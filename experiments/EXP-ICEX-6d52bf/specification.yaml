experiment:
  id: EXP-ICEX-6d52bf
  hypothesis_id: H-ICEX-6f3e4b
  derived_from_idea: IDEA-20260830-4ab603
  question_id: RQ-ICEX-001
  batch_id: BATCH-fced88
  version: 1
  title: >-
    PRICE THE FREE ORACLE'S TABLE AND MEASURE THE COUPLING- both m = 2
    endpoints and three interpolation points over one shared instance set and
    one shared operation counter, with an allocator-level memory probe rather
    than an estimated figure, matched rho and matched BSGS arms with their
    tables charged, a structured-base (Sidon versus small-multiples) control
    that must separate, a curve-free (Z/NZ, +) sumset-membership arm that
    must reproduce the dichotomy, both accounting conventions reported side
    by side, and a feasibility gate that refuses to price an empty table
  status: draft
  objective: >-
    (A) THE UNCERTAINTY. A live committed proposal places the m = 2
    free-oracle point at (time N^{2/3}, memory N^{1/3}). If the query-time
    space that makes D = Theta(1) possible is charged, the point is
    (N^{2/3}, N^{2/3}, precompute N^{2/3}). Whether the coupling is real is
    measurable at toy p in hours, and the measurement is a memory
    measurement, so it must be made with an allocator-level probe rather than
    derived from the model it is testing.
    (B) WHAT IS BUILT. Five arms over ONE instance set and ONE operation
    counter- (A) the B_0 = 0 sweep endpoint; (B) the B_0 = B full sumset
    table; (C) three interpolation points; (D) matched Pollard rho; (E)
    matched BSGS WITH ITS TABLE CHARGED, so the domination claim is measured
    and not read off an asymptotic table. Plus the structured-base control
    and the curve-free arm.
    (C) THE TWO CONVENTIONS, AND WHY BOTH ARE MANDATORY. KN-TECH-031 records
    BSGS at '2*sqrt(n) group operations and sqrt(n) storage (deterministic);
    full cost n^{2/3+o(1)} once memory is charged', and records Wiener's
    explicit statement that it is wrong to conclude Shanks's method and rho
    have the same full cost. THE SOURCE PROPOSAL'S PARAPHRASE OMITS THE
    FULL-COST FIGURE. Under processor-steps-and-storage the corrected point
    is dominated by BSGS on both axes by N^{1/6}; under full cost BSGS is
    itself at n^{2/3+o(1)}, the same exponent as the corrected point's time,
    and the domination MAY FAIL. This contract computes both and reports them
    side by side; a row quoted without its convention is inadmissible.
    (D) WHAT IS NOT DECIDED. RQ-ICEX-001's exponent decision; anything at
    m >= 4; anything about structured bases beyond the control's own two
    extremes; and any cell-probe lower bound, since no literature was
    checked.
  inputs:
    cost_unit: >-
      ONE CHARGED OPERATION IS ONE GROUP OPERATION. A TABLE PROBE IS CHARGED
      AT A DECLARED RATE FROZEN BEFORE ANY CELL RUNS, with a sensitivity row
      at probe cost 0.1, 1 and 10 group operations. MEMORY IS COUNTED IN
      STORED GROUP ELEMENTS by the program, with an allocator-level BYTE
      probe reported SIDE BY SIDE as a cross-check on direction and NEVER
      substituted for the element count. PRECOMPUTE IS A THIRD COLUMN in
      GROUP OPERATIONS with its own peak-memory column, charged separately
      and never folded into time.
    unit_discipline: >-
      BINDING AND ENFORCED. Every value carries a tag in {group_ops,
      check_ops, stored_elements, bytes, seconds, dimensionless}. The harness
      refuses any cross-tag arithmetic without a named, recorded conversion.
      TIME IS NEVER ADDED TO MEMORY- the T x S product carries BOTH tags
      (group-operations x stored-elements) and is compared only against N
      under the declared convention, with the convention printed on the row.
      KN-FIND-8f2c90's fixture is denominated in CHECK OPERATIONS as that
      finding defines them, and the reproduction arm reports in that unit,
      converting into group operations only through a named recorded
      conversion. EVERY ROW CARRIES ITS ACCOUNTING CONVENTION -
      processor-steps or full-cost - and a row without one is INVALID.
    feasibility_gate: >-
      THE HARNESS REFUSES TO PRICE AN EMPTY OR DEGENERATE OBJECT. Reported as
      INFEASIBLE with parameters and reason, never priced- a sumset table
      with ZERO ENTRIES; B < 2 (no pairs, so F + F is empty and the query is
      vacuous); a table whose min(B^2, N) size exceeds the declared memory
      cap; B_0 > B; and any interpolation cell whose two channels do not
      partition the candidate set. In addition, cells with B < 32 are
      MEASURED AND REPORTED but EXCLUDED FROM EVERY FIT, declared before the
      run, because at B = 8 the table has 36 entries and every asymptotic
      separation is invisible. THIS GATE IS THE DIRECT DESCENDANT OF
      DEC-20260904-d47cd2, which rejected a cost table that priced a Macaulay
      matrix with ZERO ROWS at every one of 54 cells; an empty sumset table
      is the same object in this lane.
    procedure: >-
      STAGE 0 (zero compute, minutes, HARD GATE). Reproduce KN-FIND-8f2c90's
      committed charge from the B_0 = 0 slice- the standard 2RN/B and the BKK
      RN/(gamma*B) in CHECK OPERATIONS, at its own cells p = 1009 and
      p = 4001, giving a speedup inside [1.5, 1.7] at the committed
      gamma = 0.86 and 0.75. Mismatch HALTS.
      STAGE 1 (zero compute, one page). Write the interpolated charge
      T(B, B_0) and S(B, B_0), emit (time, space, precompute) TRIPLES over a
      grid of (beta, B_0), verify both endpoint reductions symbolically to
      1e-12, and place every triple on a (time, memory) plane against rho,
      BSGS and van Oorschot-Wiener - UNDER BOTH CONVENTIONS.
      STAGE 2 (low compute, pure Python, p in {2^12, 2^14, 2^16}, B <= 256,
      minutes per cell). Implement both endpoints and three interpolation
      points over ONE shared instance set and ONE shared operation counter,
      with an explicit ALLOCATOR-LEVEL memory probe rather than an estimated
      figure. Arms A, B, C, D, E as in the objective. Sweep B over a 16x
      range.
      STAGE 3 (low compute). THE STRUCTURED-BASE CONTROL- rerun arms A and B
      on a Bose-Chowla Sidon base and on the small-multiples base at matched
      B, recording the query space needed for a Theta(1) query on each. The
      control MUST separate by at least a factor 4 at B = 128 or no verdict
      is readable from the main arms.
      STAGE 4 (low compute). THE CURVE-FREE ARM- the identical dichotomy on a
      random size-B subset of (Z/NZ, +) with sumset membership as the
      decomposition predicate, through the identical code path with the
      identical counters and probes.
      STAGE 5 (zero compute). Emit- the identifying triple requirement as a
      proposed reporting rule for every future m = 2 row in this lane; the
      infeasible-cell table; and the two-convention Pareto table. A
      correction-by-reference against IDEA-20260829-b5a2c8's memory row and
      boundary-lift limb is prepared FOR THE COORDINATOR and is NEVER an
      edit to that immutable record.
    mechanism: >-
      STEP 1. One instance set, one operation counter, one memory counter,
      one probe-cost parameter, shared by all five arms. An arm that needs
      its own counter is not comparable and is not built.
      STEP 2. Implement the table arm so that the sumset table is a real,
      allocated structure whose entries are counted as stored group elements
      at insertion, with a running peak. An estimated table size is NOT
      admissible- the entire claim is a memory exponent, and a memory figure
      derived from the model being tested is circular and forbidden.
      STEP 3. Implement the BSGS arm with its baby-step table charged in the
      same stored-element counter, so the domination claim is a measurement
      and not an assertion.
      STEP 4. Implement the curve-free arm by replacing the group and the
      decomposition predicate only; every counter, probe, stopping rule and
      reporting path is shared with the curve arm.
      STEP 5. Report every row as (p, B, B_0, arm, seed, charged operations,
      peak stored elements, allocator bytes, precompute operations,
      precompute peak, probe cost, convention), never as a scalar.
    instrument: >-
      Pure Python with explicit counters and an allocator-level memory probe.
      MEMORY DISCIPLINE- the largest object is the sumset table at B = 256,
      at most 32896 entries, plus a 256 x 256 matrix over Z/N; under 20 MB.
      NO MACAULAY MATRIX AND NO GROEBNER BASIS IS BUILT.
  controls:
    - >-
      CONTROL 1, BASELINE REPRODUCTION (blocking). The B_0 = 0 arm against
      KN-FIND-8f2c90's committed 2RN/B charge and its 1.5-1.7x gamma interval
      at p = 1009 and p = 4001.
    - >-
      CONTROL 2, MATCHED RHO ARM (blocking). Must reproduce 0.886*sqrt(N)
      within the seed spread under the identical counting convention, as
      KN-TECH-006 records that constant. A comparison whose baseline arm
      misses the textbook constant is not measuring a ratio; a miss is an
      INFRASTRUCTURE outcome under AGENTS.md rule 5 and never negative
      mathematical evidence.
    - >-
      CONTROL 3, MATCHED BSGS ARM WITH MEMORY CHARGED. The domination claim
      is the headline and must be measured against a real BSGS arm on the
      same instances, with its baby-step table counted in the same
      stored-element counter - not read off an asymptotic table.
    - >-
      CONTROL 4, STRUCTURED-BASE NEARBY-OBJECT CONTROL (blocking). Sidon
      versus small-multiples at matched B. The small-multiples base must
      admit Theta(1) queries at O(B) space; the Sidon base must require
      Theta(B^2). A query-space ratio BELOW 4 at B = 128 means the control is
      not discriminating and NO VERDICT MAY BE READ FROM THE MAIN ARMS.
    - >-
      CONTROL 5, CURVE-FREE NULL (REQUIRED under the standing scope
      constraint of pfdr-battery-20260904, and ADDED BY THIS CONTRACT - the
      source proposal carries none). A random size-B subset of (Z/NZ, +) with
      sumset membership as the decomposition predicate, no curve arithmetic
      anywhere. Every step of the coupling argument is about preprocessed
      sumset membership and reads no group law. PREDICTED- the curve-free arm
      reproduces the B^2 memory scaling within 20 percent and the same T*S
      floor. Consequence stated in advance- if it does, the dichotomy is a
      statement about preprocessed sumset membership and may NOT be quoted as
      a statement about elliptic curves or the ECDLP.
    - >-
      CONTROL 6, ALLOCATOR-LEVEL MEMORY PROBE, NOT AN ESTIMATE. The entire
      claim is a memory exponent; a memory figure derived from the model it
      is testing is circular and is FORBIDDEN. The stored-element count is
      the metric and the allocator byte probe is a cross-check on direction;
      both are reported side by side.
    - >-
      CONTROL 7, PROBE-COST SENSITIVITY. Every row at table-probe cost 0.1, 1
      and 10 group operations. A conclusion that flips within that range is
      labelled convention-dependent.
    - >-
      CONTROL 8, TWO-CONVENTION CONTROL. Every Pareto row is reported under
      BOTH the processor-steps-and-storage convention and a full-cost
      convention with memory charged, because KN-TECH-031 records BSGS itself
      at n^{2/3+o(1)} under the latter and the source proposal's paraphrase
      omits that.
    - >-
      CONTROL 9, SEED-INDEPENDENCE NULL. Derived exponents are seed-free and
      must be BIT-IDENTICAL across seeds; only measured counts vary.
  independent_variables:
    - factor base size B, swept over a 16x range, B <= 256
    - interpolation parameter B_0 in {0, B/4, B/2, 3B/4, B}
    - toy prime p in {2^12, 2^14, 2^16}, plus fixture cells 1009 and 4001
    - base type in {unstructured random, Bose-Chowla Sidon, small-multiples}
    - arm in {sweep endpoint, full table, interpolation, matched rho, matched BSGS}
    - table probe cost in {0.1, 1, 10} group operations
    - accounting convention in {processor-steps-and-storage, full-cost}
    - group object- curve arm against curve-free (Z/NZ, +) arm
  metrics:
    primary:
      - >-
        charged operations, GROUP OPERATIONS, per (p, B, B_0, arm, probe
        cost, seed)
      - >-
        peak query space, STORED GROUP ELEMENTS, per cell, with the
        allocator-level BYTE probe reported beside it
      - >-
        precompute operations, GROUP OPERATIONS, and precompute peak memory,
        STORED GROUP ELEMENTS, charged separately in their own columns
      - >-
        the measured T x S product, carrying BOTH unit tags, against N, per
        interpolation point
      - >-
        query time per target, GROUP OPERATIONS PER TARGET, per arm
      - >-
        matched rho operations and matched BSGS operations plus BSGS table
        memory, in the same units, on the same instances
      - >-
        structured-base control query spaces at matched B, STORED GROUP
        ELEMENTS, and their ratio
      - >-
        the identifying triple (time, query space, precompute) attached to
        every m = 2 row
    secondary:
      - symbolic endpoint reductions with residuals, required below 1e-12
      - the two-convention Pareto table, every row tagged with its convention
      - the infeasible-cell table with parameters and refusal reason
      - the curve-free arm's rows, in the same file as the curve arm
      - certificate verification pass or fail for every recovered logarithm
      - the Stage 0 reproduction figures in CHECK OPERATIONS against KN-FIND-8f2c90's committed values
  heuristic_under_test: HEUR-M2-SUMSET-1
  preregistered_prediction:
    quantity: >-
      The peak query space of the D = Theta(1) arm, in stored group elements,
      as a function of factor base size B at fixed p; and the product of
      total charged operations with peak query space across the interpolation.
    formula: >-
      For an unstructured base, |F + F| = (1 - o(1)) * binom(B+1, 2), so the
      table supporting Theta(1) queries has Theta(B^2) entries- PREDICTED
      each doubling of B multiplies peak stored elements by 4.0 within +/- 20
      percent until the min(B^2, N) cap binds, with query time FLAT in B
      within a factor 1.2. PREDICTED T x S never below 0.25*N at any B_0; a
      measured product below 0.1*N at any interpolation point falsifies the
      T*S = Omega(N) conjecture.
    source: >-
      H-ICEX-6f3e4b statements (B) and (D), from IDEA-20260830-4ab603 read in
      full. The Sidon lower-bound reasoning is the classical random-set
      argument re-derived in-record; the recalled cell-probe pointer backs
      nothing and no source was opened.
  scale_relevance:
    tier: toy
    justification: >-
      p in {2^12, 2^14, 2^16} and B <= 256. The exponents N^{2/3}, N^{1/3}
      and the T*S floor are DERIVATIONS WITHIN THE COST MODEL; what is
      measured here is their observable signature - the B^2 memory scaling,
      the flat query time, the product floor and the structured-base
      separation - at toy sizes only. TRANSFER ASSUMPTION- NONE IS CLAIMED
      beyond p <= 2^16. No correspondence trick is available to reach
      cryptographic scale for this object and none is used, so THE EXPONENT
      STATEMENTS ARE NOT VALIDATED AT CRYPTOGRAPHIC SCALE BY ANY PART OF THIS
      CONTRACT. Evidence is capped at claim_tier toy.
    correspondence: null
  tail_checks:
    - >-
      THE LARGEST B (256), where the B^2 scaling has the most room to be
      visible and where the min(B^2, N) cap is nearest; reported separately
      as the anchor of P1.
    - >-
      CELLS WHERE THE MEASURED TOTAL FALLS MORE THAN 15 PERCENT BELOW the sum
      of the two channel predictions. An unmodelled cross-term in the
      FAVOURABLE direction is precisely the falsifier of the T*S conjecture,
      so those cells are the interesting ones and are inspected individually
      rather than averaged in.
    - >-
      THE MAXIMUM MULTIPLICITY OF ANY SINGLE SUM VALUE against the Poisson
      upper tail at mean B^2/N. A heavy multiplicity tail means the base is
      not behaving as unstructured and the cell must be EXCLUDED, since the
      whole dichotomy is scoped to unstructured bases.
    - >-
      SMALL-B DEGENERACY- cells below B = 32 are reported but excluded from
      every fit, declared before the run.
    - >-
      ANY DIVERGENCE BETWEEN THE STORED-ELEMENT COUNT AND THE ALLOCATOR BYTE
      PROBE in direction; a memory claim resting on only one of them is
      incomplete, and the entire hypothesis is a memory claim.
  replication:
    seeds:
      - 20260904
      - 20260905
      - 20260906
      - 20260907
      - 20260908
    independent_instances: 5
    seeds_note: >-
      Seeds govern the unstructured base draw, the target draw, the matched
      rho walk and the curve-free arm's subset draw. DERIVED EXPONENTS AND
      SYMBOLIC OUTPUTS ARE SEED-FREE AND MUST BE BIT-IDENTICAL ACROSS SEEDS;
      only measured counts vary, and any variation in a derived quantity is
      an infrastructure failure under AGENTS.md rule 5. Per-cell intervals
      come from the seed-to-seed spread and no difference smaller than twice
      that spread is reported as a difference. The Sidon and small-multiples
      bases are deterministic constructions and carry no seed.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 2.0
    maximum_memory_gb: 8
    maximum_runs: 30
    maximum_workers: 1
  stopping_rules:
    - Stop at maximum_runs or total_cpu_hours, whichever binds first.
    - >-
      Stop immediately if Stage 0's reproduction misses KN-FIND-8f2c90's
      committed [1.5, 1.7] interval at either fixture cell.
    - >-
      Stop immediately if the matched rho arm misses 0.886*sqrt(N) outside
      the seed spread; report the run UNRUN as an infrastructure outcome.
    - >-
      Stop immediately if the structured-base control fails to separate by a
      factor 4 at B = 128; no verdict is readable from the main arms.
    - >-
      Stop a cell at its declared per-run wall clock and record it as
      censored with the counters reached.
  invalidation_rules:
    - >-
      A run reporting an ESTIMATED memory figure, or substituting the
      allocator byte probe for the stored-element count, is INVALID- the
      claim is a memory exponent and a figure derived from the model being
      tested is circular.
    - >-
      A run pricing a cell the feasibility gate declared infeasible - a
      sumset table with zero entries above all - is INVALID.
    - >-
      A run emitting an untagged value, adding time to memory, or omitting
      the accounting convention or the probe cost from a row, is INVALID.
    - >-
      A run reporting a Pareto placement under only ONE accounting
      convention is INVALID.
    - >-
      A run including sub-floor cells (B < 32) in a fit is INVALID.
    - >-
      A run quoting the dichotomy without the word 'unstructured', or
      quoting any result at m >= 4, is INVALID.
    - >-
      A run that EDITS IDEA-20260829-b5a2c8 rather than preparing a
      correction-by-reference for the Coordinator is INVALID; that record is
      immutable.
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence
      (AGENTS.md rule 5).
    - >-
      Any claimed logarithm whose certificate fails independent
      re-verification makes the run completed_invalid.
  success_criterion: >-
    The contract SUCCEEDS when Stage 0 reproduces the committed charge, the
    matched rho arm hits its constant, the structured-base control separates,
    and P1 through P6 each return a measured value with its seed spread over
    the declared grid at every probe cost, with the curve-free arm reported
    beside the curve arm, the two-convention Pareto table emitted, the
    identifying triple attached to every row, and the infeasible-cell table
    produced. Success is the production of those numbers in either
    direction- a measured B^1 memory scaling would falsify the dichotomy and
    is the most valuable possible outcome.
  falsification_criterion:
    - >-
      F1 (falsifies the hypothesis, highest value). The D = Theta(1) arm's
      measured peak memory scales as B^1 rather than B^2. A constant-time
      m = 2 query exists at linear space; the hypothesis is withdrawn and the
      construction achieving it is worth far more than the hypothesis.
    - >-
      F2 (falsifies the conjecture). The measured T x S product falls below
      0.1*N at any interpolation point.
    - >-
      F3 (withdraws the record). The B_0 = 0 arm does not reproduce
      KN-FIND-8f2c90's committed charge or gamma interval. The counting
      convention differs; the correction cannot be made.
    - >-
      F4 (voids the verdict). The structured-base control does not separate
      Sidon from small-multiples by a factor 4 at B = 128. The method is not
      measuring the structure it claims.
    - >-
      F5 (infrastructure, not evidence). The matched rho arm misses
      0.886*sqrt(N) outside the seed spread. Reported unrun under AGENTS.md
      rule 5.
    - >-
      F6 (scope finding). The curve-free arm reproduces the B^2 scaling and
      the T*S floor, as predicted. The dichotomy is about preprocessed sumset
      membership and may not be quoted as a curve statement. A FAILURE to
      reproduce is the interesting outcome and requires explanation before
      any citation.
    - >-
      F7 (retracts the comparator claim, not the dichotomy). Under the
      full-cost convention the corrected point is NOT dominated by BSGS on
      both axes - which KN-TECH-031's n^{2/3+o(1)} figure for BSGS makes a
      live possibility. Statement (E)'s comparator strengthening is retracted
      under that convention and the retraction is recorded; the dichotomy
      itself is unaffected.
    - >-
      F8 (everything holds). The free-oracle memory row is corrected from
      N^{1/3} to N^{2/3}, the boundary-lift robustness limb is withdrawn as
      stated, the m = 2 no-go strengthens to domination by BSGS on both axes
      under the processor-steps convention, and the lane acquires a reporting
      rule requiring the identifying triple.
  required_artifacts:
    - manifest.yaml with exact command, git commit, dirty-tree state, environment and dependency versions
    - raw-result.json with charged operations and peak query space per arm per (p, B, B_0, probe cost, seed), every value unit-tagged
    - precompute operations and precompute peak memory as separate columns
    - the measured T x S product across the interpolation, carrying both unit tags
    - matched rho operations and matched BSGS operations plus BSGS table memory
    - the structured-base control query spaces at matched B and their ratio
    - the curve-free arm's rows in the same file as the curve arm
    - symbolic endpoint reductions with residuals below 1e-12
    - the two-convention Pareto table, every row tagged with its convention
    - the infeasible-cell table with parameters and refusal reason
    - the allocator byte probe beside every stored-element count
    - certificates for every recovered logarithm, re-verified independently of the solver
    - a correction-by-reference note against IDEA-20260829-b5a2c8's memory row and boundary-lift limb, PREPARED FOR THE COORDINATOR and never applied as an edit
  interpretation_limits:
    - >-
      NOT A LOWER BOUND IN ANY COMPLEXITY-THEORETIC SENSE. The quantified
      statement is a CONJECTURE with a constructive falsification route, not
      a cell-probe theorem, and no literature was checked.
    - >-
      SCOPED TO m = 2 AND TO UNSTRUCTURED BASES. Nothing here may be quoted
      about m >= 4, where the candidate set has size Theta(B^{m-1}) and an
      algebraic solve genuinely has search to shorten. Any quotation of the
      dichotomy without the word 'unstructured' is an overclaim, and the
      small-multiples base is the standing counterexample.
    - >-
      NO ATTACK IS PROPOSED AND NO EXPONENT IS IMPROVED. The deliverable is
      the removal of one unattainable point from the lane's frontier table,
      the strengthening of the comparator under ONE stated convention, and a
      reporting rule.
    - >-
      THE DOMINATION CLAIM IS CONVENTION-DEPENDENT, AND THIS CONTRACT
      DEPARTS FROM ITS SOURCE PROPOSAL THERE. KN-TECH-031 records BSGS at
      full cost n^{2/3+o(1)} once memory is charged and records that it is
      wrong to conclude Shanks and rho have the same full cost; the source
      proposal quotes only the (N^{1/2}, N^{1/2}) row. Both conventions are
      computed and reported and a row without its convention is invalid.
      KN-TECH-031 also records that sqrt(n) storage is infeasible at
      cryptographic size, so BSGS is a comparator in a cost model rather than
      a deployable attack.
    - >-
      PRECOMPUTE IS CHARGED PER INSTANCE. A multi-target reading is a
      different row that this contract does not compute and must not be
      quoted as computing.
    - >-
      MEASURED MEMORY IS AN IMPLEMENTATION ARTEFACT AS WELL AS A MATHEMATICAL
      ONE- a Python dict of B^2 entries carries tens of bytes per entry and
      will dominate a small B x B matrix for reasons unrelated to the
      exponent. The metric is STORED GROUP ELEMENTS counted by the program;
      the allocator probe is a direction cross-check only.
    - >-
      TOY p ONLY, AND THE EXPONENTS ARE DERIVATIONS WITHIN THE COST MODEL,
      NOT VALIDATED AT CRYPTOGRAPHIC SCALE BY ANY PART OF THIS CONTRACT. No
      correspondence trick is available for this object and none is used.
    - >-
      'UNATTAINABLE WITHIN THIS COST MODEL' IS NOT 'UNATTAINABLE IN FACT',
      and that qualifier travels with every quoted row.
    - >-
      IF THE CURVE-FREE ARM REPRODUCES THE DICHOTOMY, as predicted, nothing
      here is a statement about elliptic curves or the ECDLP.
    - >-
      FORWARD GUIDANCE, so this is not read as a closure- structured bases
      whose sumset admits a succinct oracle without collapsing coverage,
      multi-instance amortisation of the table, and every arity m >= 4 all
      remain open.
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      NOT APPROVED. DRAFT, designed under TASK-20260904-e87737; execution
      requires a separate Coordinator approval decision. A message from any
      agent is not an approval.
    - >-
      The parent hypothesis is proof-oriented and carries a proof_search_map;
      Stage 0 and the structured-base control are HARD GATES and run before
      any verdict is read.
    - >-
      The correction-by-reference against IDEA-20260829-b5a2c8 is prepared
      for the Coordinator only. Only the Coordinator may act on it, and it
      travels as a SUPERSEDING record, never as an edit to that immutable
      proposal.
  id_allocation_provenance: >-
    EXP-ICEX-6d52bf was pre-allocated by the tasking Coordinator session and
    supplied in TASK-20260904-e87737's constraints, verified free across the
    identifier union before use. This agent has no shell and allocated no
    identifier.
  yaml_parse_disclosure: >-
    Written by a Coordinator subagent without an interpreter; every prose
    value is a folded block scalar or a quoted scalar; no tabs; no duplicate
    keys to the author's reading. THIS AGENT COULD NOT RUN A STRICT YAML
    PARSE OR tools/validate_ledger.py and did not do so; the orchestrating
    session must run both before this contract is relied on.
