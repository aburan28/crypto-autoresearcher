experiment:
  id: EXP-PFDR-acf64c
  hypothesis_id: H-PFDR-a2258e
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-2c45e2
  version: 1
  status: draft
  claim_tier: toy
  retrospective: false
  retrospective_note: >-
    PRE-REGISTRATION. No run of EXP-PFDR-acf64c exists. Every threshold,
    definition and prediction below is frozen before execution and may be changed
    only by a versioned protocol_amendment filed under
    experiments/EXP-PFDR-acf64c/amendments/ BEFORE the affected data is
    generated. NOTHING IN THIS FILE IS A MEASUREMENT.

  title: >-
    Presentation re-randomization of Semaev membership systems - is the
    standardized left-tail shape of the log solve-cost distribution a property of
    the Semaev system, or of the knob distribution acting on any system of the
    same shape?

  objective: >-
    Measure the standardized left-tail index L of the Groebner solve-cost
    distribution over a frozen distribution of ideal-preserving presentations, on
    Semaev membership systems and on curve-free random systems of the identical
    shape, and decide whether the Semaev arm has a materially heavier cheap tail.
    The experiment exists to separate a structural reading from two lookalikes -
    the generic order-statistics effect that any nondegenerate cost distribution
    produces, and the knob distribution acting on shape alone with no curve
    present.

  inputs:
    semaev_arm:
      curves: >-
        Toy prime-field short-Weierstrass curves with prime-order subgroups at
        12, 16 and 20 bits, three curves per bit size, recorded by (p, a, b, N).
      targets_per_cell: 30
      arities: [3, 4]
      factor_base_size: 'B = ceil(N^{1/m}), yield-tight, recorded per cell'
      system_construction: >-
        S_{m+1}(x_1, ..., x_m; x_R) together with the factor-base indicator
        polynomials I(x_j) = prod over v in V of (x_j - v), built by the pinned
        harness routine and hashed into the run record.
    curve_free_null_arm:
      count_per_semaev_cell: 100
      construction: >-
        Random multihomogeneous systems over the same prime field with the
        IDENTICAL variable count and the IDENTICAL multidegree vector as the
        Semaev system they are matched to, coefficients drawn uniformly from the
        field under a recorded seed. NO ELLIPTIC CURVE, NO GROUP LAW AND NO
        SUMMATION POLYNOMIAL ENTERS THIS ARM.
      purpose: >-
        THE BINDING CURVE-FREE NULL. If this arm reproduces the Semaev arm's
        tail index within the bootstrap width, the measured effect is a property
        of the shape and the knob distribution and NOT of elliptic curves, and
        the pre-stated consequence in falsification_criterion applies.
    shuffled_degree_null_arm:
      count_per_semaev_cell: 50
      construction: >-
        Same variables, deliberately WRONG multidegree vector. Separates a
        shape-specific effect from a variable-count effect.
    planted_arm:
      count_per_cell: 20
      construction: >-
        A system carrying a deliberately planted cheap presentation - a variable
        order and monomial order under which the generators are already in
        triangular form - whose solve cost is a KNOWN factor 8 below the family
        median cost, verified by direct solve at construction time and recorded.
      purpose: >-
        DYNAMIC-RANGE CONTROL WITH A DEFECT OF KNOWN SIZE. The min-over-8
        procedure must find the planted presentation and the measured excess in L
        must move by the amount a planted factor-8 outlier at frequency 1 in 24
        implies. A harness that cannot see a defect of known size cannot be
        trusted to report the absence of one.
    knob_distribution:
      frozen: true
      families:
      - >-
        K1 MONOMIAL ORDER, drawn uniformly from a declared four-element set -
        degrevlex, degrevlex with a random positive integer weight vector bounded
        by 8, graded lex, and one declared block order.
      - >-
        K2 VARIABLE PERMUTATION, drawn uniformly from the symmetric group on the
        m system variables. The indicator factors break the Semaev symmetry, so
        permutations are genuinely distinct presentations.
      - >-
        K3 UNIMODULAR RECOMBINATION of the generator set by a random unimodular
        matrix over the prime field, subject to a pre-registered bound on
        coefficient growth. Ideal-preserving by construction; the bound is
        declared before execution and a draw violating it is redrawn under the
        same seed stream and the redraw is counted.
      - >-
        K4 SCALAR RESCALING of each generator by a random nonzero field element.
        A declared no-op knob, retained as a within-run negative control -
        K4 alone must produce an excess in L consistent with 0.
      draws_per_system: 8
      extended_k_sweep: 'k in {1, 2, 4, 8, 16} on a declared subsample, for the tail-consistency check'

  controls:
  - >-
    C-NULL-CURVEFREE (BINDING). The random same-shape multihomogeneous arm. This
    is the null object of the same shape required before belief. Predicted result -
    excess in L consistent with 0. If it reproduces the Semaev tail index within
    the bootstrap width, NO STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP MAY BE
    QUOTED FROM ANY OUTCOME OF THIS EXPERIMENT.
  - >-
    C-NULL-SHUFFLED. The wrong-multidegree arm. Predicted to show no Semaev
    excess; a Semaev-sized excess here means the effect tracks variable count
    rather than shape.
  - >-
    C-PLANTED (BLOCKING, RUNS FIRST). The planted-cheap-presentation arm.
    Detection rate at or above 0.90 required before any other arm is
    interpreted. This is the control with demonstrated dynamic range.
  - >-
    C-K4-NOOP. The scalar-rescaling knob alone. Predicted excess in L consistent
    with 0 on every arm. A nonzero K4 excess means the cost measurement is
    sensitive to something that provably cannot change the computation, and the
    run is INVALID.
  - >-
    C-POWER. Presentation variance against solver noise at fixed presentation,
    measured FIRST on repeated identical inputs, per cell. Ratio below 1 marks the
    cell under-powered; an under-powered cell is reported as such and is never
    pooled and never read as a negative result.
  - >-
    C-BASELINE-REPRODUCTION. At k = 1 in the canonical presentation the harness
    must reproduce the committed canonical-presentation cost on a frozen fixture
    of 20 systems, within the measured deterministic-replay tolerance.
  - >-
    C-CALIBRATION. The solver-operation to charged-unit calibration is perturbed
    by a factor 10 in each direction; L must not move by more than 0.02, since a
    scale factor cannot change a scale-invariant statistic. A larger movement is
    an implementation defect.
  - >-
    C-BASELINES-MATCHED. Pollard rho with negation and BSGS on the same instances
    in the same charged unit, reported so that no solve-cost figure in this
    experiment is read as an attack result. Mandatory under RQ-ECDLP-002.

  independent_variables:
  - arm - semaev, curve_free_null, shuffled_degree_null, planted
  - arity m in {3, 4}
  - bit size in {12, 16, 20}
  - knob family in {K1, K2, K3, K4, all}
  - presentation draw count k in {1, 2, 4, 8, 16}

  metrics:
    primary:
    - >-
      L, the standardized left-tail index of log solve cost over presentations,
      dimensionless, defined as (median(log C) - q_{1/8}(log C)) / sd(log C),
      per system, then averaged per cell with a bootstrap interval over systems.
    - >-
      excess_L, dimensionless, equal to L on the Semaev arm minus L on the
      matched curve-free null arm, per cell, with a bootstrap interval.
    - >-
      per-knob excess_L, dimensionless, per knob family, per cell, reported
      separately and never pooled.
    secondary:
    - >-
      C, the solve cost of one presentation draw, in pinned-engine reduction
      operations, per draw, with the censoring indicator.
    - >-
      realized randomized-retry expected cost against single-presentation
      expected cost, both in pinned-engine reduction operations - the only figure
      in this experiment that may be quoted as a saving.
    - >-
      presentation-variance to solver-noise ratio, dimensionless, per cell.
    - >-
      censoring fraction, dimensionless, per cell.
    - >-
      planted-defect detection rate, dimensionless.
    - >-
      matched Pollard rho and BSGS cost in the same charged unit, and BSGS memory
      in bits.
    - >-
      wall time and peak resident memory, INFRASTRUCTURE ONLY, never a
      mathematical quantity.

  heuristic_under_test: HEUR-001

  preregistered_prediction:
    quantity: >-
      excess_L, the difference in standardized left-tail index between the Semaev
      arm and the matched curve-free same-shape arm.
    formula: >-
      excess_L at least 0.25 at m in {3, 4} and at two or more of the three bit
      sizes, with the bootstrap interval excluding 0. Under the alternative that
      the presentation-cost law of a Semaev system belongs to the same
      location-scale family as the null, excess_L has expectation exactly 0.
    source: >-
      No theorem predicts this value. It is a pre-registered threshold chosen so
      that the planted factor-8 defect at frequency 1 in 24 produces an excess
      comfortably above it, fixing the scale of a detectable effect before any
      data is seen. Recorded as a threshold and NOT as a derived prediction.

  scale_relevance:
    tier: toy
    justification: >-
      Prime fields of 12 to 20 bits, arities 3 and 4, one pinned engine. The
      tested scope is exactly those cells. No transfer to crypto scale is claimed
      and none is derivable - a statement about crypto-scale Groebner cost would
      require a correspondence this contract does not have and does not assert.
    correspondence: null

  tail_checks:
  - >-
    The empirical decay of the min-over-k cost as k grows over {1, 2, 4, 8, 16}
    must match the order-statistics prediction computed from the fitted
    single-presentation distribution on the same systems. A mismatch beyond the
    declared tolerance voids the fit and the tail index is not reported.
  - >-
    The cheapest single presentation observed across the whole Semaev arm is
    compared against its predicted extreme-value probability under the fitted
    single-presentation law. A cheapest sample far outside its predicted quantile
    is reported as an unexplained observation and is not absorbed.

  replication:
    seeds: [20260904, 20260905, 20260906]
    independent_instances: 3
    seeds_policy: >-
      One master seed per run, recorded in the manifest, from which every knob
      draw, every null-system draw and every bootstrap resample is derived by a
      declared deterministic stream. A presentation sample is reproducible from
      the master seed and its index alone. Seeds are fixed before execution and
      are never redrawn after seeing an outcome; a redraw forced by the
      coefficient-growth bound in K3 is counted and reported. The three seeds are
      independent replicates of the whole protocol, not three attempts at one
      number.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 24
    maximum_memory_gb: 8
    maximum_runs: 8
    maximum_workers: 1
    per_solve_timeout_seconds: >-
      Fixed by the pre-registered rule - 10 times the median single-presentation
      solve time measured on a declared pilot set of 20 systems, computed and
      frozen before any measured draw, and recorded in the manifest. The same
      timeout applies identically to the Semaev arm and to every null arm.

  stopping_rules:
  - >-
    SR1 BLOCKING. C-PLANTED runs first. Detection rate below 0.90 stops the run
    and the receipt reports an instrument failure. No other arm is computed.
  - >-
    SR2 BLOCKING. C-BASELINE-REPRODUCTION at k = 1 must pass on the frozen
    fixture before any re-randomized draw is taken.
  - >-
    SR3. C-POWER is measured per cell before that cell's comparison arms run.
    A cell with ratio below 1 is marked under-powered and its comparison arms are
    still run and reported, flagged, but excluded from the pooled headline.
  - >-
    SR4. If the total budget is reached the run stops and reports the cells
    completed. A budget stop is an infrastructure receipt and never a negative
    result.
  - >-
    SR5. If the censoring fraction in any cell exceeds 0.50 the primary statistic
    is not reported for that cell and the cell is recorded as censored-dominated.

  invalidation_rules:
  - >-
    C-K4-NOOP shows a nonzero excess beyond its bootstrap width. The cost
    measurement responds to a provable no-op; every number is void.
  - >-
    C-CALIBRATION moves L by more than 0.02. A scale-invariant statistic moved
    under a rescaling; the implementation is wrong.
  - >-
    Any knob draw is found not to preserve the ideal, checked by comparing the
    reduced Groebner basis of the drawn presentation against the canonical one on
    a declared subsample of at least 40 draws per knob family. A non-preserving
    knob invalidates every draw from that family.
  - >-
    The Semaev arm and a null arm are charged in different units, or the timeout
    rule differs between arms.
  - >-
    A timeout, crash, engine abort or host failure is recorded as
    failed_infrastructure and is NEVER counted as a negative mathematical result.

  success_criterion: >-
    excess_L at least 0.25 with a bootstrap interval excluding 0, at m in {3, 4}
    and at two or more bit sizes, WITH C-PLANTED, C-K4-NOOP, C-CALIBRATION and
    C-BASELINE-REPRODUCTION all discharged, AND with at least one knob family
    alone reaching 0.15. Anything less is not a success and is reported as what it
    is.

  falsification_criterion: >-
    THE DECISION RULE, FIXED BEFORE EXECUTION. (F1) The bootstrap interval for
    excess_L contains 0 at every tested cell - H-PFDR-a2258e S1 is FALSIFIED at
    tested scope for this frozen knob distribution, and the presentation
    re-randomization lane closes at toy scope with that boundary named. (F2) The
    curve-free same-shape null reproduces the Semaev tail index within the
    bootstrap width - the effect is a property of the system SHAPE and the knob
    distribution and NOT of elliptic curves; NOTHING FROM THIS EXPERIMENT MAY BE
    QUOTED AS A STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP, in either
    direction, and the record must say so in those words. (F3) The excess exists
    but only under K3 and no other knob family reaches 0.15 - S2 is falsified and
    the effect is a property of one knob rather than of the system. (F4) An
    excess appears equally on C-NULL-SHUFFLED - the effect tracks variable count,
    not shape.

  required_artifacts:
  - per-draw solve cost in charged units with knob assignment, seed index and censoring flag, for every arm
  - per-system and per-cell L with bootstrap intervals, per arm
  - excess_L per cell with bootstrap interval, and per-knob decomposition
  - C-PLANTED detection rate and the per-system planted-presentation identity
  - C-K4-NOOP excess, C-CALIBRATION perturbation results, C-BASELINE-REPRODUCTION fixture comparison
  - ideal-preservation subsample check results per knob family
  - presentation-variance to solver-noise ratio per cell and the censoring fraction per cell
  - realized randomized-retry cost against single-presentation cost, per cell, in the charged unit
  - matched Pollard rho and BSGS costs in the same unit, with BSGS memory in bits
  - the frozen pilot-set timeout derivation and its value
  - pinned engine name and version, command, environment, seeds, and resource measurements
  - k-sweep tail-consistency comparison against the order-statistics prediction

  limitations:
  - >-
    SCOPE. Prime fields of 12 to 20 bits, m in {3, 4}, one pinned engine at one
    pinned version, one frozen knob distribution. A negative result closes exactly
    that and nothing else.
  - >-
    THE SOURCE IDEA'S BAND WAS BROKEN AND WAS REPLACED. The original
    pre-registered discriminator - R_rerand(8) below 0.90 with the null at or
    above 0.95 - cannot fire in the intended direction, because a null with enough
    presentation variance to pass the idea's own power gate necessarily has a
    min-of-8 ratio far below 0.95. The replacement is the scale-invariant tail
    index. The full argument is recorded in H-PFDR-a2258e band_non_degeneracy.
  - >-
    L IS SCALE-INVARIANT BY DESIGN AND THAT IS ALSO ITS COST. It compares tail
    shapes and says nothing about the size of any realized saving. Only the
    realized randomized-retry cost against the single-presentation cost, both in
    the same charged unit, may be quoted as a saving.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED RATHER THAN SHRUNK. Whether the same
    tail-shape difference holds for Semaev membership systems at cryptographic
    factor-base sizes is NOT testable by this or any reachable experiment - a
    single Groebner solve at those sizes is beyond any budget this program has,
    and the min-over-8 protocol requires eight of them per system. This contract
    therefore does not test the claim that matters for an attack, and no
    extrapolation from these cells to that claim is licensed by anything here.
  - >-
    Timeout censoring is present by construction and biases every
    expectation-based statistic. The quantile-based primary statistic reduces but
    does not remove that bias, and the censoring fraction is reported per cell.
  - >-
    NO EXPONENT. No outcome of this experiment moves any ECDLP exponent, and no
    assembled attack cost is computed or derivable.
  - >-
    The source idea attributes the blocking of the STR / phi_alpha
    displacement-rank instrument to DEC-20260730-001, which
    TASK-20260904-5423ad read and which concerns GOAL-XEDN-003 and EXP-XEDN-006
    instead. This contract contains no displacement rank and no phi_alpha
    instrument, which is checkable from the design; the identity of the decision
    that actually blocks that instrument is unresolved.
  - >-
    Wall time and memory are infrastructure covariates and are never reported as
    mathematical quantities.

  assigned_to: executor
  approved_by: null
