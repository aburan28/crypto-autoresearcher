# FROZEN CONTRACT. Committed BEFORE any data is fetched or fitted. Every
# prediction, tolerance, window, estimator, control and failure consequence
# below is fixed here and may not be tuned to the data afterwards. A change
# after freeze requires a versioned protocol amendment (docs/task-lifecycle.md
# "Protocol amendments") and resets confirmatory status.
experiment:
  id: EXP-SSIQ-4de240
  hypothesis_id: H-SSIQ-6e0748
  version: 1
  title: >-
    Empirical exponents of the minimal-degree counting function on the AOV
    exhaustive dataset: does D1 predict alpha = 3/2, or does the ingredient-(c)
    failure mode predict alpha = 2?
  status: approved
  approved_by: coordinator
  objective: >-
    Discriminate two pre-stated models of N(T, p) = #{E : delta_E <= T} on data
    this program did not generate, and thereby test derivation D1's exponent by
    a route that fails differently from re-derivation. The deciding quantity is
    the fitted T-exponent alpha.
  objective_boundary: >-
    This experiment measures a counting function in a published dataset. It
    does NOT attack the supersingular isogeny problem, does not implement any
    isogeny algorithm, does not solve any instance, and produces no evidence
    about the attainability of a p^{1/4} algorithm.
  inputs:
    dataset:
      source: >-
        the exhaustive minimal-degree (delta_E) data released with
        arXiv:2607.14624 (Aubry-Oyono-Vincent), as reported in
        coordination/goals/GOAL-SSIQ-001/batches/BATCH-001/tasks/TASK-20260805-87e568/L1_ceiling_audit.md
      acquisition: >-
        Fetch from the arXiv ancillary files / the authors' released location.
        RECORD URL, HTTP status, fetch timestamp and SHA-256 for EVERY attempt,
        successful or not, before any parsing.
      expected_coverage: "p up to 265207 (log2 p <= 18)"
      normalisation_check_required: true
    if_unavailable: >-
      IF THE DATASET CANNOT BE OBTAINED, the run terminates
      failed_infrastructure and the experiment produces NO mathematical
      evidence in either direction (AGENTS.md rule 5). Do not substitute
      self-generated data: computing delta_E in-session would reintroduce
      exactly the shared-model dependence this experiment exists to escape, and
      such a run would be worth less than no run. Report the acquisition
      failure with every route tried.
  independent_variables:
    - T (the minimal-degree threshold), swept over the dataset's achievable range
    - p (the prime), swept over every prime the dataset covers
  metrics:
    primary:
      - id: M-ALPHA
        definition: >-
          the fitted T-exponent alpha in N(T, p) = c * T^alpha * p^beta,
          estimated by ordinary least squares on log N against log T and log p
          jointly, over the pre-registered fitting window W-MAIN below.
        unit: dimensionless exponent
        estimator_frozen: >-
          OLS on log-log with equal weights per (T, p) cell admitted by W-MAIN.
          No weighting scheme, robust variant, or outlier rejection may be
          substituted after seeing the data.
      - id: M-BETA
        definition: the fitted p-exponent beta in the same joint fit
        unit: dimensionless exponent
    secondary:
      - id: M-GRAD
        definition: >-
          REC-1b, the delta_E-gradient question that decides whether lever L4
          lives: measured autocorrelation of delta_E along 2-isogeny steps —
          specifically, the mean absolute difference |delta_{E'} - delta_E| for
          2-isogeny neighbours E' of E, compared against the mean absolute
          difference for independently sampled pairs at the same p.
        pre_registered_prediction: >-
          If NO computable gradient exists, neighbour and independent-pair mean
          absolute differences agree within their own spread and the ratio is
          ~1. A ratio detectably below 1 indicates local structure a descent
          could in principle follow. NO THRESHOLD FOR "L4 LIVES" IS
          PRE-REGISTERED because none is defensible at this scale — this arm is
          declared EXPLORATORY and may not be evaluated against a confirmatory
          criterion, per docs/task-lifecycle.md step 5.
        status: exploratory
      - id: M-RANGE
        definition: >-
          the achieved (T, p) coverage and the separating power of the fit:
          the standard error on alpha, and the alpha-difference the window can
          actually resolve.
  preregistered_prediction:
    quantity: "alpha, the T-exponent of N(T, p) = c * T^alpha * p^beta"
    formula: >-
      D1 model: alpha = 3/2, beta = 1/2, from N ~ (number of admissible n) x
      (class number h ~ |D|^{1/2}) x (embedding mass) / (p/12).
      COMPETING model (ingredient (c) contributing n^{1/2}): alpha = 2.
    source: >-
      D1, section 6 of
      coordination/goals/GOAL-SSIQ-001/batches/BATCH-001/tasks/TASK-20260805-87e568/L1_ceiling_audit.md,
      frozen at commit 7ec7f730fe9988d6aa7154cb40eb49f3b81ee48b and
      independently re-derived by TASK-20260805-89a2e7.
    decision_rule_frozen_before_data:
      - >-
        alpha within 3/2 +- 0.20 and excluding 2.0 at 2 standard errors:
        SUPPORTS D1. Lever L1 stays CLOSED-IN-SCOPE. This is weak confirmation
        and must be reported as such — an asymptotic prediction agreeing at
        log2 p <= 18 is consistent with, not proof of, the asymptotic claim.
      - >-
        alpha within 2.0 +- 0.20 and excluding 1.5 at 2 standard errors:
        REFUTES D1's exponent at the tested scale. THE PRE-COMMITTED REVERSION
        FIRES: L1 disjunct 2 returns to UNRESOLVED, L1's overall state becomes
        UNRESOLVED-ON-DISJUNCT-2, and the p^{1/4} degree-bound route reopens.
        Disjunct 1 stays CLOSED regardless, since it rests on cited primary
        text and not on D1.
      - >-
        Neither, or the window cannot exclude one model at 2 standard errors:
        INCONCLUSIVE, with the achieved separating power reported. This is a
        legitimate and pre-registered outcome and may not be presented as
        support for either model.
  controls:
    - id: C-NULL
      kind: null_object
      description: >-
        Fit the identical estimator over the identical window to counting data
        from RANDOM POSITIVE-DEFINITE TERNARY QUADRATIC FORMS of discriminant
        p/4 — the structure-free surrogate for the rank-3 trace-zero lattice.
      pre_registered_expectation: >-
        The surrogate should reproduce alpha ~ 3/2 (the Gaussian-heuristic shape
        for a random ternary lattice) but must NOT reproduce the dataset's
        p-dependence and constant if the arithmetic structure matters.
      failure_consequence: >-
        IF THE NULL OBJECT REPRODUCES THE FULL FIT INCLUDING beta AND c, the
        measurement does not distinguish supersingular arithmetic from generic
        ternary lattice geometry, and M-ALPHA MAY NOT BE CITED AS EVIDENCE
        ABOUT D1 — because D1's content is arithmetic. The run is then reported
        VOID FOR THE PRIMARY METRIC, not repaired by adjusting the surrogate.
        The Red Team already observed that D1's shape IS the Gaussian heuristic
        for a random ternary lattice; this control exists because of that
        observation, and it is expected to be the hardest one to pass.
    - id: C-ANCHOR-LOW
      kind: known_endpoint
      description: >-
        At T = 1 the count must reproduce the size of the F_p-rational locus,
        known to be ~p^{1/2}, since delta_E = 1 exactly when E is isomorphic to
        E^{(p)}.
      failure_consequence: >-
        A mismatch means the dataset's delta_E is not the quantity D1 counts —
        a NORMALISATION failure. The run is completed_invalid, not negative
        evidence.
    - id: C-ANCHOR-HIGH
      kind: known_endpoint
      description: >-
        At T = (p/2)^{1/3} the fraction must reach 1, since AOV Theorem 4.2 =
        the frozen source's Theorem 1.5 bounds delta_E by (p/2)^{1/3} for every
        supersingular E.
      failure_consequence: >-
        A fraction below 1 at the theorem's own bound means either the dataset
        is not exhaustive or the normalisation differs. completed_invalid.
    - id: C-REPRO
      kind: determinism
      description: >-
        Re-run the full pipeline from the fetched bytes with the recorded seed
        and confirm bit-identical fitted coefficients.
    - id: C-SEED
      kind: sampling_independence
      description: >-
        For the exploratory M-GRAD arm and the C-NULL surrogate, repeat under
        three declared seeds and report the spread. A conclusion that moves
        with the seed is a conclusion about the seed.
  fitting_windows:
    W-MAIN: >-
      All (T, p) cells with p >= 1000 and 1 < T <= (p/2)^{1/3}, EXCLUDING cells
      where N(T,p) < 10 (counting noise dominates) and excluding the largest T
      decile (saturation toward fraction 1 flattens the power law by
      construction, not by arithmetic). Frozen here, before any data is seen.
    W-SENS: >-
      One pre-registered sensitivity window: p >= 10000 only. Reported beside
      W-MAIN. If alpha moves by more than 0.20 between windows, the fit is
      window-sensitive and the primary result is downgraded to INCONCLUSIVE
      regardless of which side of the decision rule W-MAIN landed on.
  scale_relevance:
    tier: toy
    justification: >-
      SUB-TOY AND DECLARED SO. log2 p <= 18 is below the toy band
      RQ-SSIQ-9702af declares. The reason a sub-toy measurement is worth running
      at all is that the two competing models differ in an EXPONENT, not a
      constant, and an exponent gap of 0.5 is resolvable over a decade of T even
      at small p. That argument is itself testable and is what M-RANGE reports.
      NO CONCLUSION FROM THIS EXPERIMENT TRANSFERS TO CRYPTOGRAPHIC SCALE.
    correspondence: >-
      The dataset is computed via the Deuring correspondence in the source; this
      experiment inherits that correspondence unverified and does not re-derive
      it. Recorded as an inherited assumption, not a checked one.
  tail_checks:
    - >-
      Compare the smallest observed delta_E at each p against the C-ANCHOR-LOW
      expectation, not only the bulk fit.
    - >-
      Report the largest observed delta_E at each p against (p/2)^{1/3}. A
      single violation refutes exhaustiveness or normalisation and is reported
      immediately rather than averaged away.
  replication:
    seeds: [20260805, 11, 977]
    independent_instances: 1
    note: >-
      The primary fit is deterministic given the fetched bytes and needs no
      seed; the seeds govern C-NULL surrogate generation and the M-GRAD
      sampling only.
  budget:
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 2
    maximum_memory_gb: 4
    maximum_runs: 1
  stopping_rules:
    - >-
      If the dataset is not obtained within 1800 seconds of acquisition effort,
      stop and report failed_infrastructure with every route tried. Do not
      proceed to any fit.
    - >-
      If the wall-clock budget is reached, report the coverage actually achieved
      and mark the run valid-but-truncated with its achieved scope.
  invalidation_rules:
    - >-
      C-ANCHOR-LOW or C-ANCHOR-HIGH fails: the dataset's delta_E is not the
      quantity D1 counts. completed_invalid; NOT evidence against D1.
    - >-
      C-NULL reproduces the full fit including beta and c: primary metric VOID
      (see C-NULL failure_consequence).
    - >-
      C-REPRO does not reproduce bit-identical coefficients: completed_invalid.
    - >-
      The contract is found underspecified on any point that changes alpha: STOP
      and report the underspecification. An Executor that fills a gap in a
      frozen protocol has silently redesigned the experiment.
  success_criterion: >-
    The run is SUCCESSFUL when M-ALPHA and M-BETA are estimated over W-MAIN and
    W-SENS with standard errors, every control returns a recorded pass/fail/void
    verdict, and the pre-registered decision rule is applied mechanically to
    yield exactly one of SUPPORTS-D1 / REFUTES-D1-AT-SCALE / INCONCLUSIVE.
    SUCCESS IS NOT AGREEMENT WITH D1. A run returning REFUTES-D1-AT-SCALE with
    all controls passing is a fully successful run and the more valuable
    outcome, since it reopens lever L1 at the target exponent.
  falsification_criterion: >-
    H-SSIQ-6e0748 is falsified at the tested scale if alpha lands within
    2.0 +- 0.20 excluding 1.5 at 2 standard errors, with C-NULL, C-ANCHOR-LOW,
    C-ANCHOR-HIGH and C-REPRO all passing.
  required_artifacts:
    - implementation/fit_delta_counting.py
    - runs/RUN-SSIQ-4de240-a/manifest.yaml
    - runs/RUN-SSIQ-4de240-a/raw-result.json
    - runs/RUN-SSIQ-4de240-a/execution_report.yaml
    - runs/RUN-SSIQ-4de240-a/source_access_log.yaml
    - runs/RUN-SSIQ-4de240-a/stdout.txt
    - runs/RUN-SSIQ-4de240-a/stderr.txt
  assigned_to: executor
  frozen_at: '2026-08-05'
  freeze_note: >-
    Frozen and committed BEFORE the dataset was fetched or inspected. The
    decision rule, both windows, every control and every failure consequence
    were fixed with no knowledge of the data. This is the one property that
    makes a sub-toy measurement worth running against a shared-model confound,
    and it is the property a later amendment would destroy.
