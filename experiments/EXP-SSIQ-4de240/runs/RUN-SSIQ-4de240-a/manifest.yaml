run:
  id: RUN-SSIQ-4de240-a
  experiment_id: EXP-SSIQ-4de240
  hypothesis_id: H-SSIQ-6e0748
  task_id: TASK-20260805-ac12ae
  goal_id: GOAL-SSIQ-001
  batch_id: BATCH-002
  role: executor
  status: completed
  validity: completed_valid_with_primary_metric_void
  validity_reason: >-
    Every planned measurement terminated, every pre-registered control returned
    a recorded verdict, C-REPRO reproduced the fitted coefficients
    bit-identically, and the frozen decision rule was applied mechanically.
    C-NULL FAILED: the structure-free surrogate reproduced the full fit
    including beta and c, so spec.controls C-NULL failure_consequence and
    spec.invalidation_rules[1] apply and M-ALPHA IS VOID FOR THE PRIMARY
    METRIC -- it may not be cited as evidence about D1. The run itself is a
    valid, successful execution: the void is a measured finding, not an
    execution failure. It is neither evidence for nor evidence against D1.

  # -------------------------------------------------------------------
  # command
  # -------------------------------------------------------------------
  command:
    working_directory: /home/user/crypto-autoresearcher
    acquisition:
      - >-
        curl -sS -I -L --max-time 30 -A 'crypto-autoresearcher/TASK-20260805-ac12ae'
        -D - https://raw.githubusercontent.com/christellevincent/WISDE/main/results/results<p>.sage
        # HEAD, for every prime p <= 300000 (25997 probes); coverage enumeration
      - >-
        curl -sS -f -L --max-time 300 -A 'crypto-autoresearcher/TASK-20260805-ac12ae'
        -o <cache>/results<p>.sage
        https://raw.githubusercontent.com/christellevincent/WISDE/main/results/results<p>.sage
        # GET, for each of the 5379 covered primes, xargs -P 48, 4 retries
    primary_execution: >-
      ulimit -v 4194304; timeout 5400 python3
      experiments/EXP-SSIQ-4de240/implementation/fit_delta_counting.py
      --cache-dir <cache> --out raw-result.json --null-cap 4000
      --emit-file-hashes
    repro_execution: >-
      ulimit -v 4194304; timeout 5400 python3
      experiments/EXP-SSIQ-4de240/implementation/fit_delta_counting.py
      --cache-dir <cache> --out raw-result-repro.json --null-cap 4000
    repro_comparison: >-
      python3 attach_repro.py raw-result.json stdout.txt stdout_repro.txt
      # reads and compares the two COEFFICIENT_DIGEST/COEFFICIENT_KEY lines
      # emitted by fit_delta_counting.py; computes no new quantity
    cache_dir_note: >-
      <cache> is the session scratchpad holding the 5379 fetched files
      (1 915 238 354 bytes). The bytes are NOT committed; their per-file
      SHA-256 values are, in raw-result.json "source_files", together with the
      aggregate 674b3ef7078bfa1ebbe379bb93a62af7a1611ef570723695613cce50756e5099.
      Re-fetching from the URLs in source_access_log.yaml and re-running the
      primary command reproduces every number in raw-result.json.

  # -------------------------------------------------------------------
  # revision and environment
  # -------------------------------------------------------------------
  revision:
    commit_at_acquisition: ab8e3ad8f93b84f197aef647746a36ef0d7cd359
    commit_at_execution: 239309420fc29ec89f4c37c74b4a5c616b24e1a3
    commit_moved_during_run: true
    commit_moved_note: >-
      Another task committed 948c9aee and 23930942 (the TASK-20260805-b0da87
