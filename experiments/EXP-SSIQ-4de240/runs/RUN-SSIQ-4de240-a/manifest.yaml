      the acquisition and fit phases. Neither touches
      experiments/EXP-SSIQ-4de240 or any input of this run. Recorded per
      AGENTS.md rule 8. This Executor committed nothing.
    branch: claude/0.25-algorithm-breakthrough-y7jbiy
    dirty_tree: true
    dirty_paths: ["experiments/EXP-SSIQ-4de240/implementation/ (untracked,
      created by this run)"]

  environment:
    python: "3.11.15 (main, Mar  3 2026, 09:26:23) [GCC 13.3.0]"
    platform: Linux-6.18.5-fc-v18-x86_64-with-glibc2.39
    cpus: 4
    memory_total_gb: 15
    dependencies:
      numpy: 2.4.6
      pyyaml: 6.0.1
      curl: system
    dependency_note: >-
      numpy was NOT present in the image and was installed with
      `python3 -m pip install numpy` at 2026-08-05T03:40Z, BEFORE any fit was
      run. It is used ONLY to sample and reduce the C-NULL surrogate lattices.
      The dataset parse, the class-number computation, the OLS fit and the
      decision rule are pure Python and use no third-party library, which is
      why C-REPRO can require bit-identical coefficients.
    resource_caps_applied:
      address_space_ulimit_kb: 4194304        # spec budget maximum_memory_gb: 4
      wall_clock_timeout_seconds: 5400        # spec budget wall_clock_seconds_per_run

  # -------------------------------------------------------------------
  # inference provenance
  # -------------------------------------------------------------------
  inference:
    requested_policy: executor-implementation
    resolved_model_id: claude-opus-5
    model_verified: false
    model_verified_note: >-
      Not probe-verified. `orchestration.adapter doctor --probe` was not run in
      this session; the identifier is the model serving this subagent under the
      Claude Code runtime, recorded as configuration.
    fallback_used: true
    fallback_reason: >-
      Policy aliases do not bind under this Claude Code harness: subagents run
      `model: inherit`, so executor-implementation resolves to the session
      model. Recorded, not silently substituted (AGENTS.md model policy).
    reasoning_effort: null
    degraded_allowed: false
    degraded_requirements: []
    independent_session: true
    independence_note: >-
      SESSION independence only, never model independence. This does not lift
      the campaign's `preliminary` evidence ceiling (BATCH-002-OPENING section
      6), and no record from this run may claim that it does.

  # -------------------------------------------------------------------
  # parameters and randomness
  # -------------------------------------------------------------------
  parameters:
    counting_unit: >-
      isomorphism classes of supersingular elliptic curves over Fbar_p
      (j-invariants), reconstructed from the released maximal-order-type index
      by the Galois-orbit rule N(T,p) = #{types: delta=1} + 2*#{types:
      2 <= delta <= T}
    windows:
      W_MAIN: "p >= 1000, 2 <= T <= floor(0.9*floor((p/2)^(1/3))), N(T,p) >= 10"
      W_SENS: "identical with p >= 10000"
    estimator: >-
      OLS of log N on [1, log T, log p], equal weight per admitted cell,
      no weighting scheme, no robust variant, no outlier rejection
    null_cap_samples_per_prime: 4000
    null_surrogate_q: "round(sqrt(p)/2), Gram determinant q^2 ~= p/4"
  randomness:
    seeds: [20260805, 11, 977]           # spec.replication.seeds, FROZEN
    generator: "numpy.random.default_rng(seed) -- PCG64"
    scope: >-
      The primary fit is DETERMINISTIC given the fetched bytes and consumes no
      randomness. Seeds govern the C-NULL surrogate only (and would have
      governed M-GRAD sampling, which was not measured).
    other_sources_of_randomness: none

  # -------------------------------------------------------------------
  # timing and resources
  # -------------------------------------------------------------------
  timing:
    acquisition_started_utc: '2026-08-05T03:28:47Z'
    acquisition_finished_utc: '2026-08-05T03:47:56Z'
    acquisition_seconds: 1149
    acquisition_budget_seconds: 1800
    primary_execution_started_utc: '2026-08-05T03:53:54Z'
    primary_execution_finished_utc: '2026-08-05T03:57:44Z'
    primary_execution_seconds: 229.06
    repro_execution_seconds: 236.1
    wall_clock_budget_seconds_per_run: 5400
    budget_exceeded: false
    peak_memory_note: >-
      no OOM under the 4 GiB address-space cap; the cap was applied to both
      executions and neither was terminated.

  # -------------------------------------------------------------------
  # result
  # -------------------------------------------------------------------
  result:
    certificate:
      kind: none
      reason: >-
        Pure measurement run. No discrete log is claimed, no factor-base
        relation is claimed, no isogeny is computed, no instance of any hard
        problem is solved. docs/claims-and-verification.md requires
        `kind: none` to be stated explicitly for such runs.
    scale_tier: toy
    scale_qualifier: >-
      SUB-TOY AND DECLARED SO. max log2 p = 18.0168, BELOW the toy band
      RQ-SSIQ-9702af declares for this goal. No number in this run may be cited
      at crypto scale, and none at toy scale without this qualifier.
    objective_boundary: >-
      This run measures a counting function in a published dataset. It attacks
      nothing, implements no isogeny algorithm, solves no instance, and
      produces no evidence about whether a p^{1/4} algorithm exists.

    dataset:
      origin: >-
        github.com/christellevincent/WISDE, folder results/, released with
        arXiv:2607.14624 (Aubry-Oyono-Vincent)
      files: 5379
      bytes: 1915238354
      aggregate_sha256: 674b3ef7078bfa1ebbe379bb93a62af7a1611ef570723695613cce50756e5099
      p_range: [2, 265207]
      log2_p_max: 18.0167593295706
      order_types: 17141943
      curves_jinvariants: 33633008
      exhaustive_below_22000: true
      selection_above_22000: >-
        only the primes surviving the authors' wisde sieve, i.e. SELECTED ON
        THE UPPER TAIL of the delta distribution

    normalisation_check:
      required_by: spec.inputs.dataset.normalisation_check_required
      result: 5379 / 5379 primes agree exactly
      pass: true

    M_ALPHA:
      W_MAIN: 1.1660926254786474
      se_W_MAIN: 0.0005135858515310475
      W_SENS: 1.1726899262498947
      se_W_SENS: 0.0005169577096264654
      status: VOID_FOR_PRIMARY_METRIC   # C-NULL failure_consequence
    M_BETA:
      W_MAIN: 0.5890462103384664
      se_W_MAIN: 0.00033478988536594267
      W_SENS: 0.5894025795204527
      se_W_SENS: 0.0004244153768587001
    log_c:
      W_MAIN: -1.5929639356493226
      se_W_MAIN: 0.0033751886764786217
      c_W_MAIN: 0.20336
    fit_quality:
      W_MAIN: {cells: 126822, primes: 5211, r_squared: 0.9915019,
               T_range: [2, 45], p_range: [1009, 265207]}
      W_SENS: {cells: 116075, primes: 4150, r_squared: 0.9892816}

    M_RANGE:
      se_alpha_W_MAIN: 0.0005135858515310475
      resolvable_alpha_difference_at_2se: 0.001027171703062095
      model_gap_to_resolve: 0.5
      gap_in_units_of_se_alpha: 973.55
      log_T_decades: 1.3522
      se_caveat: >-
        the OLS standard errors assume independent cells; the cells are nested
        cumulative counts of the same curves, so residuals are strongly
        autocorrelated along T and these standard errors are ANTI-CONSERVATIVE.
        The estimator was frozen and is reported as frozen.
      estimator_bias_probe: >-
        the C-NULL ensemble has asymptotic alpha = 3/2 and beta = 1/2 BY
        CONSTRUCTION (Gaussian heuristic for a random ternary lattice), yet the
        frozen estimator over the frozen window returns alpha = 1.1362 and
        beta = 0.5951 on it -- a measured alpha bias of -0.3638. The window
        does not recover alpha = 3/2 even from an object that provably has it.

    M_GRAD:
      status: NOT_MEASURED
      arm: exploratory
      verdict: null
      reason: >-
        the released dataset carries no 2-isogeny adjacency; see
        execution_report.yaml deviations D4.

    controls:
      C_NULL:        {verdict: fail, consequence: PRIMARY_METRIC_VOID}
      C_ANCHOR_LOW:  {verdict: pass}
      C_ANCHOR_HIGH: {verdict: pass}
      C_REPRO:       {verdict: pass}
      C_SEED:        {verdict: pass}

    decision_rule_branch: INCONCLUSIVE
    decision_rule_reason: >-
      neither branch condition met: |alpha - 1.5| = 0.333907 and
      |alpha - 2.0| = 0.833907, both outside the 0.20 tolerance;
      2*se(alpha) = 0.001027. Window shift |W-MAIN - W-SENS| = 0.006597,
      below the 0.20 downgrade threshold, so the downgrade clause did not fire.
    decision_rule_note: >-
      Reported as the frozen rule selects it. The branch is INCONCLUSIVE
      independently of C-NULL; C-NULL additionally voids M-ALPHA as evidence
      about D1. NEITHER a support nor a refutation of D1 was produced.

