execution_report:
  task_id: TASK-20260805-ac12ae
  experiment_id: EXP-SSIQ-4de240
  run_id: RUN-SSIQ-4de240-a
  hypothesis_id: H-SSIQ-6e0748
  role: executor
  status: completed
  outcome_class: >-
    valid_measurement, primary metric VOID by pre-registered control
  reported_at: '2026-08-05T04:05:00Z'

  # =====================================================================
  # 1. HEADLINE -- observations only
  # =====================================================================
  headline:
    dataset_obtained: true
    dataset_origin: >-
      github.com/christellevincent/WISDE, folder results/ (the release named in
      section 5.2 of arXiv:2607.14624). 5379 files, 1 915 238 354 bytes,
      aggregate SHA-256
      674b3ef7078bfa1ebbe379bb93a62af7a1611ef570723695613cce50756e5099.
    decision_rule_branch: INCONCLUSIVE
    primary_metric_status: VOID
    one_line: >-
      alpha = 1.1661 +- 0.0005 over W-MAIN and 1.1727 +- 0.0005 over W-SENS,
      which is neither 3/2 +- 0.20 nor 2.0 +- 0.20, so the frozen rule returns
      INCONCLUSIVE; and the structure-free surrogate returned alpha = 1.1362,
      beta = 0.5951, c within a factor 1.017 of the data's, so C-NULL FAILED
      and M-ALPHA MAY NOT BE CITED AS EVIDENCE ABOUT D1.
    what_this_is_not: >-
      NOT support for D1 and NOT a refutation of D1. The pre-committed
      reversion (L1 disjunct 2 -> UNRESOLVED) does NOT fire, because its
      trigger is alpha within 2.0 +- 0.20 with C-NULL passing, and neither
      holds. Equally, L1 is not confirmed: nothing here is evidence that
      alpha = 3/2 either.

  # =====================================================================
  # 2. PRIMARY MEASUREMENTS
  # =====================================================================
  measurements:
    M_ALPHA:
      definition: >-
        fitted T-exponent of N(T,p) = c * T^alpha * p^beta, OLS on log-log with
        equal weight per admitted (T,p) cell, exactly as frozen
      W_MAIN: {value: 1.1660926254786474, se: 0.0005135858515310475}
      W_SENS: {value: 1.1726899262498947, se: 0.0005169577096264654}
      window_shift: 0.006597300771247205
      status: VOID_FOR_PRIMARY_METRIC
      status_reason: spec.controls C-NULL failure_consequence; see controls below
    M_BETA:
      W_MAIN: {value: 0.5890462103384664, se: 0.00033478988536594267}
      W_SENS: {value: 0.5894025795204527, se: 0.0004244153768587001}
    log_c:
      W_MAIN: {value: -1.5929639356493226, se: 0.0033751886764786217}
      c: 0.20336
    fit_diagnostics:
      W_MAIN: {cells: 126822, primes: 5211, dof: 126819, r_squared: 0.9915019,
               sigma_resid: 0.117864}
      W_SENS: {cells: 116075, primes: 4150, dof: 116072, r_squared: 0.9892816}

    M_RANGE:
      achieved_coverage:
        primes_in_W_MAIN: 5211
        p_range: [1009, 265207]
        log2_p_range: [9.9787, 18.0168]
        T_range: [2, 45]
        log10_T_decades: 1.3522
        cells: 126822
      separating_power:
        se_alpha_W_MAIN: 0.0005135858515310475
        alpha_difference_resolvable_at_2se: 0.001027171703062095
        definition: >-
          the smallest |alpha_model - alpha_hat| the fit can exclude at 2
          standard errors, i.e. 2*se(alpha)
        model_gap_that_had_to_be_resolved: 0.5
        gap_in_units_of_se_alpha: 973.55
        nominal_verdict: >-
          on its face the window resolves the 0.5 model gap by a factor of
          ~487. THIS NOMINAL FIGURE IS NOT TRUSTWORTHY ON ITS OWN, for the two
          reasons immediately below, and both are measured rather than
          asserted.
      why_the_nominal_power_overstates:
        - id: SE-AUTOCORRELATION
          statement: >-
            OLS standard errors assume independent cells. The cells are NESTED
            CUMULATIVE COUNTS of the same curves -- N(T,p) is non-decreasing in
            T at fixed p -- so residuals are strongly positively autocorrelated
            along T and the standard errors are ANTI-CONSERVATIVE. The
            estimator was frozen in the contract and is reported as frozen;
            this is recorded, not applied.
        - id: ESTIMATOR-BIAS
          statement: >-
            MEASURED, not argued. The C-NULL surrogate is a random ternary
            lattice ensemble whose asymptotic exponents are alpha = 3/2 and
            beta = 1/2 BY CONSTRUCTION (the Gaussian heuristic
            #{x : Q(x) <= T}/2 ~ (2 pi/3) T^{3/2}/sqrt(det) with det ~ p/4).
            Running the frozen estimator over the frozen window on that
            ensemble returns alpha = 1.1362, i.e. a bias of -0.3638 against a
            KNOWN true alpha of 3/2 (and +0.0951 on beta). The achieved window
            therefore cannot recover alpha = 3/2 even from an object that
            provably has it, and the +-0.20 tolerance in the decision rule is
            smaller than the estimator's own bias at this scale.
          why_it_matters: >-
            This is the sub-toy cost the contract's scale_relevance clause
            flagged as itself testable ("That argument is itself testable and
            is what M-RANGE reports"). It is now tested. At T <= 45 the
            asymptotic regime has not been reached, so a fitted alpha at this
            scale is not a measurement of the asymptotic alpha for the real
            data any more than it is for the null.
          scope: >-
            This statement is about the estimator and the window, not about D1.
            It says nothing about whether D1's asymptotic alpha is 3/2 or 2.

    M_GRAD:
      arm: EXPLORATORY
      status: NOT_MEASURED
      verdict: null
      threshold_used: none -- and none exists to use
      reason: >-
        M-GRAD is defined as the mean |delta_{E'} - delta_E| over 2-ISOGENY
        NEIGHBOURS versus independently sampled pairs at the same p. The
        released dataset gives, per prime, a Z-basis of each maximal order type
        and its successive minima -- but NOT the 2-isogeny adjacency of the
        supersingular graph. Recovering it means enumerating the norm-2 left
        ideals of each order, computing their right orders, rebuilding each
        right order's Gross lattice and Eisenstein-reducing it: reimplementing
        the authors' pipeline and GENERATING the neighbour delta values in
        session. That is the dependence this experiment exists to escape, it
        carries substantial silent-bug risk, and it does not fit the frozen
        wall-clock budget. Reported as a deviation (D4) rather than attempted
        badly or silently dropped. NO VERDICT IS DRAWN ABOUT LEVER L4 IN EITHER
        DIRECTION.

  # =====================================================================
  # 3. CONTROLS -- C-NULL first, as instructed
  # =====================================================================
  controls:

    - id: C-NULL
      kind: null_object
      verdict: FAIL
      consequence_fired: PRIMARY METRIC VOID
      what_was_run: >-
        Random positive-definite ternary quadratic forms of discriminant p/4,
        realised as the Goldstein-Mayer family
        L_v = {x in Z^3 : <x,v> = 0 mod q} with v uniform subject to
        gcd(v,q) = 1 and q = round(sqrt(p)/2), so the Gram determinant is
        exactly q^2 ~= p/4; N1_null = min nonzero |x|^2, an integer exactly as
        delta_E is. Same primes, same counting unit, same estimator, same
        window, three frozen seeds, up to 4000 samples per prime scaled to the
        true curve count. NO SUPERSINGULAR ARITHMETIC ENTERS -- only rank,
        determinant and positive-definiteness are shared with the real data.
      determinant_fidelity:
        over_all_primes: {min: 0.6957, max: 8.0, mean: 1.00277}
        over_W_MAIN_primes: {min: 0.942042, max: 1.059578, mean: 0.999987}
        note: >-
          the extremes over all primes come from p = 2, 3 where round(sqrt(p)/2)
          is coarse; those primes are outside W-MAIN. Over the 5211 primes that
          actually enter the fit the surrogate determinant matches p/4 to
          within 6 percent, mean ratio 0.999987. (Computed by a recorded
          one-liner over the same cache; see deviations D6.)
      numbers:
        data_W_MAIN:      {alpha: 1.166093, beta: 0.589046, log_c: -1.592964}
        null_W_MAIN_mean: {alpha: 1.136169, beta: 0.595078, log_c: -1.575821}
        differences: {d_alpha: 0.029924, d_beta: 0.006032, d_log_c: 0.017143,
                      c_ratio: 1.01729}
        per_seed_null_alpha: [1.136403, 1.136255, 1.135849]
        per_seed_null_beta:  [0.595159, 0.594994, 0.595080]
        per_seed_null_log_c: [-1.577438, -1.575136, -1.574890]
      criterion_used: >-
        the surrogate "reproduces" a component if |data - null| <= 0.20 for
        alpha and beta (the contract's own exponent tolerance) and <= ln 2 for
        log c (a bounded factor of 2, the convention D1 itself uses when
        absorbing constants into o(1)). All three reproduce, by wide margins:
        0.0299 and 0.0060 against a 0.20 tolerance, and a c-ratio of 1.017
        against a factor-2 tolerance.
      underspecification_note: >-
        THE FROZEN CONTRACT FIXES NO NUMERIC TOLERANCE FOR "reproduces ... c".
        The criterion above is stated explicitly, and the raw numbers are
        recorded, so a reviewer may re-read them under any other tolerance
        WITHOUT re-running. This does not change alpha and so is not a
        stop-and-report underspecification under the task card's clause 7; it
        is recorded here rather than resolved silently. Note that the verdict
        is not close to a boundary: it would take a tolerance below 0.030 on
        alpha, or below a c-ratio of 1.018, to flip it.
      surrogate_not_adjusted: >-
        The surrogate was written from the Red Team's BATCH-001 objection and
        was NOT modified after the null failed. One construction was
        implemented, run under three seeds, and reported.
      what_this_means_mechanically: >-
        spec.controls C-NULL failure_consequence and
        spec.invalidation_rules[1]: the measurement does not distinguish
        supersingular arithmetic from generic ternary lattice geometry, so
        M-ALPHA MAY NOT BE CITED AS EVIDENCE ABOUT D1, because D1's content is
        arithmetic. The run is VOID FOR THE PRIMARY METRIC. It is not repaired
        by adjusting the surrogate, and it was not.
      what_this_does_not_mean: >-
        It is not a finding that supersingular arithmetic is absent. C-ANCHOR-
        LOW shows the dataset carries arithmetic the surrogate does not have --
        N(1,p) equals h(-4p)/2 EXACTLY at all 5379 primes, which no generic
        lattice ensemble reproduces exactly. What is void is this particular
        THREE-PARAMETER POWER-LAW FIT's ability to separate the two; the fit is
        blind to the structure, not the data.

    - id: C-ANCHOR-LOW
      kind: known_endpoint
      verdict: PASS
      preregistered_criterion: >-
        N(1,p) reproduces the F_p-rational supersingular locus, "known to be
        ~p^{1/2}". Applied as: OLS slope of log N(1,p) on log p over every
        covered prime lies in 0.5 +- 0.10.
      measured: {slope: 0.4986185723952403, se: 0.0045, primes: 5377}
      supplementary_exact_identity:
        rule: >-
          N(1,p) = #{E : delta_E = 1} = #{supersingular j-invariants in F_p}
          = h(-4p)/2, h = class number of the order of discriminant -4p,
          computed independently by counting reduced binary quadratic forms
        result: 5377 / 5377 primes match EXACTLY, 0 mismatches
        not_preregistered: >-
          the frozen contract states this anchor as "~p^{1/2}"; the exact
          identity is a stronger supplementary check added by this run and
          reported separately so it cannot be mistaken for the frozen criterion
      primes_skipped: [2, 3]
      primes_skipped_reason: the identity and the scaling are stated for p > 3

    - id: C-ANCHOR-HIGH
      kind: known_endpoint
      verdict: PASS
      criterion: >-
        at T = floor((p/2)^(1/3)) the fraction must reach 1, i.e.
        max delta_E <= floor((p/2)^(1/3)) for every covered prime
      measured: 0 violations in 5379 primes; fraction is exactly 1 at every p
      tail_check_1: >-
        largest observed delta_E versus the theorem bound: 0 primes exceed it,
        119 primes attain it exactly (these are the wisde primes), and the
        largest shortfall anywhere is 5. Not a single violation, so
        exhaustiveness and normalisation are not contradicted at the top end.
      tail_check_2: >-
        smallest observed delta_E: equals 1 at all 5379 primes, consistent with
        a non-empty F_p-rational locus at every p, and matched exactly by
        C-ANCHOR-LOW's class-number identity.

    - id: C-REPRO
      kind: determinism
      verdict: PASS
      what_was_run: >-
        the full pipeline re-executed from the same fetched bytes with the same
        frozen seeds, in a separate process
      result: >-
        COEFFICIENT_DIGEST identical:
        8d318ba3880420f754bb227050afd928a7bf1e19cbde63fd0e9fc301b0899b11.
        The compared key covers alpha, beta, log c and all six standard errors
        for W-MAIN and W-SENS, plus the three per-seed C-NULL alpha/beta/log c
        values -- BIT-IDENTICAL, including the seeded surrogate.

    - id: C-SEED
      kind: sampling_independence
      verdict: PASS
      criterion_used: >-
        pass iff the C-NULL verdict is the same under all three frozen seeds,
        i.e. the conclusion is not a conclusion about the seed
      measured_spread_W_MAIN:
        alpha: {values: [1.136403, 1.136255, 1.135849], range: 0.000554}
        beta:  {values: [0.595159, 0.594994, 0.595080], range: 0.000166}
        log_c: {values: [-1.577438, -1.575136, -1.574890], range: 0.002548}
      note: >-
        the seed-to-seed range is 0.00055 on alpha, roughly 54 times smaller
        than the data-minus-null difference of 0.0299 and about 360 times
        smaller than the 0.20 tolerance. The C-NULL failure is not a seed
        artefact. The M-GRAD half of this control could not be exercised
        because M-GRAD was not measured (D4).

  # =====================================================================
  # 4. FROZEN DECISION RULE, APPLIED MECHANICALLY
  # =====================================================================
  decision_rule:
    source: spec.preregistered_prediction.decision_rule_frozen_before_data
    inputs_used:
      alpha_W_MAIN: 1.1660926254786474
      se_alpha_W_MAIN: 0.0005135858515310475
      alpha_W_SENS: 1.1726899262498947
    branch_tests:
      supports_D1: >-
        requires |alpha - 1.5| <= 0.20 AND |alpha - 2.0| > 2*se.
        |alpha - 1.5| = 0.333907 > 0.20 -> NOT MET.
      refutes_D1_at_scale: >-
        requires |alpha - 2.0| <= 0.20 AND |alpha - 1.5| > 2*se.
        |alpha - 2.0| = 0.833907 > 0.20 -> NOT MET.
      window_sensitivity_downgrade: >-
        |alpha_W_MAIN - alpha_W_SENS| = 0.006597 <= 0.20 -> DID NOT FIRE.
    branch_selected: INCONCLUSIVE
    branch_reason: >-
      neither branch condition met; the third clause of the frozen rule applies
      verbatim -- "Neither, or the window cannot exclude one model at 2 standard
      errors: INCONCLUSIVE, with the achieved separating power reported. This is
      a legitimate and pre-registered outcome and may not be presented as
      support for either model."
    consequences_that_did_not_fire:
      - >-
        The PRE-COMMITTED REVERSION does not fire. Its trigger is alpha within
        2.0 +- 0.20 with C-NULL, C-ANCHOR-LOW, C-ANCHOR-HIGH and C-REPRO all
        passing (spec.falsification_criterion). alpha is 1.166, and C-NULL
        failed. L1 disjunct 2 is not returned to UNRESOLVED BY THIS RUN.
      - >-
        L1 is equally not confirmed. SUPPORTS-D1 did not fire either. This run
        moves nothing in either direction, and no record may read it as
        licensing a status change.
    executor_statement: >-
      The branch above is the branch the numbers select under the rule as
      frozen. It has not been interpreted, softened, or qualified in a way that
      changes which branch fires. Whether an alpha of 1.166 -- far from BOTH
      pre-registered models, and matched to within 0.03 by a structure-free
      null with a measured estimator bias of -0.36 -- says something about the
      models, the estimator, or the scale is a judgement for the Reviewer,
      the Red Team and the Coordinator. The Executor records, and does not
      decide it.

  # =====================================================================
  # 5. DEVIATIONS, PROTOCOL READINGS, UNEXPECTED OBSERVATIONS
  # =====================================================================
  deviations:

    - id: D1
      kind: protocol_reading
      affects_alpha: possibly
      point: >-
        W-MAIN excludes "the largest T decile". The contract does not say
        whether the decile is taken per prime or over the pooled cell set.
      reading_taken: >-
        PER PRIME: keep T <= floor(0.9 * floor((p/2)^(1/3))). This is the
        reading forced by the contract's OWN stated rationale -- "saturation
        toward fraction 1 flattens the power law by construction" -- because
        saturation to fraction 1 happens at T -> (p/2)^{1/3} FOR EACH p. The
        pooled reading would delete the large-T cells of the largest primes
        only, which is not what that rationale describes.
      alternative_recorded: >-
        the pooled reading was ALSO computed and is recorded in
        raw-result.json robustness_observations.pooled_decile_reading_W_MAIN:
        alpha = 1.14041 (se 0.00058), beta = 0.61424, i.e. 0.026 away from the
        primary alpha. It changes neither the decision branch nor the C-NULL
        verdict. The ambiguity is therefore recorded, and measured to be
        immaterial to every verdict in this run, rather than left as an
        unexamined choice.
      not_escalated_because: >-
        the task card requires STOPPING when an underspecification changes
        alpha. Both readings were computed; they differ by 0.026, far inside
        the 0.20 tolerance and far outside the 0.33 distance to either model,
        so no verdict in this run turns on it.

    - id: D2
      kind: protocol_reading
      affects_alpha: no
      point: >-
        the counting unit of N(T,p). The released files are indexed by maximal
        ORDER TYPE (= Galois orbit {E, E^(p)}), not by curve.
      reading_taken: >-
        isomorphism classes of curves over Fbar_p (j-invariants), because
        H-SSIQ-6e0748 writes "#{supersingular E/Fbar_p : delta_E <= T}" and D1's
        ingredient (e) divides by "#{supersingular j-invariants} = p/12 + O(1)".
        The conversion is exact and forced by Deuring, not chosen: delta_E = 1
        iff E ~= E^(p) iff j in F_p, so singleton orbits are exactly the
        delta = 1 entries and every other entry is an orbit of size 2. Hence
        N(T,p) = #{types: delta=1} + 2*#{types: 2 <= delta <= T}.
      verified: >-
        the reconstructed j-invariant count equals floor(p/12) + e for
        5379 / 5379 primes, exactly. A wrong conversion cannot pass this.
      alternative_recorded: >-
        the order-type unit is recorded in raw-result.json
        robustness_observations.order_type_unit_W_MAIN: alpha = 1.06645,
        beta = 0.59094. Changes no verdict.

    - id: D3
      kind: dataset_property
      affects_alpha: possibly
      point: >-
        the release is EXHAUSTIVE over primes only up to 22000 (all 2464
        primes present). Above 22000 it covers only the 2915 primes surviving
        the authors' wisde sieve, a necessary condition for the existence of a
        curve with delta_E = floor((p/2)^(1/3)) -- i.e. the p > 22000 sample is
        SELECTED ON THE UPPER TAIL of the delta distribution.
      handling: >-
        the frozen contract sweeps "every prime the dataset covers", so all
        5379 primes enter W-MAIN and W-SENS as frozen. The consequence is that
        W-SENS (p >= 10000) is dominated by selected primes.
      measured_size_of_the_effect: >-
        recorded in raw-result.json robustness_observations --
        complete-coverage primes only (1000 <= p <= 22000): alpha = 1.08175,
        beta = 0.60470; sieve-selected primes only (p > 22000): alpha = 1.18346,
        beta = 0.58647. The two differ by 0.102 in alpha, which is inside the
        0.20 tolerance and far from either model, so no verdict in this run
        turns on it -- but it is a REAL and MEASURED heterogeneity that a
        reviewer must see, and it is larger than the window shift the contract
        chose as its sensitivity check.
      not_a_choice_of_this_run: >-
        the selection was made by the publishers, is documented in section 5.2
        of the source, and could not be avoided without discarding 54 percent
        of the covered primes, which the frozen contract does not authorise.

    - id: D4
      kind: metric_not_measured
      affects_alpha: no
      point: M-GRAD (secondary, EXPLORATORY) was not measured.
      reason: see measurements.M_GRAD.reason above
      consequence: >-
        the exploratory REC-1b arm is not answered by this run in either
        direction. No threshold for "L4 lives" was invented, and none was
        applied. C-SEED's M-GRAD half was consequently not exercised.

    - id: D5
      kind: aborted_attempts
      affects_alpha: no
      point: >-
        three launches of the fit preceded the one that produced the result,
        and all three are preserved in stderr.txt section 3.
      detail:
        - >-
          03:50:43Z exit 127 -- /usr/bin/time absent in this image. A WRAPPER
          infrastructure_error; no Python ran and no number was produced.
        - >-
          03:50:47Z exit 1 -- KeyError: 2, because the dataset contains
          results2.sage and results3.sage while the class-number formula
          floor(p/12)+e is stated for p > 3. An implementation_error, fixed
          before any fit existed; p = 2 and 3 are outside every window and are
          now handled explicitly and excluded from the anchors with a recorded
          reason.
        - >-
          03:51:42Z SIGTERM -- killed by the harness's 120 s foreground command
          timeout, NOT by the experiment budget (5400 s). Re-launched detached.
      nothing_was_rerun_for_a_favourable_result: >-
        none of the three produced any fitted value. The dataset, the windows,
        the estimator, the seeds and the decision rule were identical across
        all launches, and the code changes between them were the p in {2,3}
        guard and the C-ANCHOR-LOW identity fix (D6). Exactly one execution
        produced the reported numbers, and one re-execution reproduced them
        bit-identically.

    - id: D6
      kind: implementation_correction_before_the_full_run
      affects_alpha: no
      point: >-
        the first draft of C-ANCHOR-LOW used
        #{ss j in F_p} = h(-4p) (p = 1 mod 4) / h(-p) (p = 7 mod 8) / 2h(-p)
        (p = 3 mod 8). On a 10-prime smoke subset this was off by a factor of
        exactly 2 in every case, and was corrected to h(-4p)/2 -- the
        classically correct statement, since the trace-zero F_p-isomorphism
        classes number h(-4p) and each such j-invariant carries exactly two
        F_p-forms (a curve and its quadratic twist).
      disclosure: >-
        the corrected form was settled from a 10-prime subset BEFORE being run
        over the full dataset. It is stated here because that is a form of
        looking at data before fixing a check. Two things bound the concern:
        the exact identity is NOT the pre-registered criterion (the
        pre-registered criterion is the p^{1/2} scaling, which is reported
        separately and which passes at slope 0.4986), and a formula tuned to
        10 primes does not then hold EXACTLY at 5377 primes unless it is
        actually the right formula. It touches no fit and no exponent.
      also_recorded_here: >-
        the W-MAIN-restricted determinant-ratio figures quoted under C-NULL
        (min 0.942042, max 1.059578, mean 0.999987 over the 5211 W-MAIN primes)
        were computed after the run by a recorded one-liner over the same
        cache, reproducing q = round(sqrt(p)/2) for p >= 1000. raw-result.json
        itself carries the all-primes figures (min 0.6957, max 8.0, mean
        1.00277); the restriction is a presentational refinement of a number
        the run already produced, not a new measurement.

    - id: D7
      kind: environment_change
      affects_alpha: no
      point: >-
        numpy 2.4.6 was installed into the image (pip) before any fit was run,
        because the image had none.
      containment: >-
        numpy is used ONLY for the C-NULL surrogate. The parse, the class
        numbers, the OLS fit and the decision rule are pure Python, which is
        why C-REPRO could demand bit-identical coefficients and got them.

    - id: D8
      kind: shared_worktree_movement
      affects_alpha: no
      point: >-
        HEAD advanced from ab8e3ad8 to 23930942 between acquisition and the
        fit, from another task's commits (948c9aee, 23930942). Neither touches
        this experiment or any input. Both commits are recorded in the manifest
        and the source access log. This Executor committed nothing.

  unexpected_observations:
    - id: U1
      observation: >-
        Nine primes (24419, 26681, 112979, 126613, 142271, 202493, 205267,
        234331, 297613) returned HTTP 200 with no Content-Length on the HEAD
        coverage probe, then 404 on six consecutive GETs each and on a fresh
        confirming HEAD. They are not part of the released dataset. Recorded
        because a coverage enumeration that trusts HEAD alone would silently
        overstate the dataset by nine primes.
    - id: U2
      observation: >-
        The dataset extends slightly beyond the coverage the contract expected:
        the contract says "p up to 265207 (log2 p <= 18)" and the release does
        stop at 265207, but the coverage probe found candidate files above it
        (all nine phantoms include 297613). Achieved max p = 265207,
        log2 p = 18.0168, which is marginally above 18. Reported exactly.
    - id: U3
      observation: >-
        119 of the 5379 primes attain delta_max = floor((p/2)^(1/3)) exactly
        (the wisde primes), and the largest shortfall over the whole dataset is
        5. The theorem bound is tight across the entire covered range, which is
        consistent with the source's own Remark 4.3 and is recorded as an
        observation, not used in any fit.
    - id: U4
      observation: >-
        The fitted beta is 0.589 for the real data and 0.595 for the
        structure-free null -- BOTH about 0.09 above the value 1/2 that both
        D1 and the Gaussian heuristic predict. Since the null's true beta is
        1/2 by construction, this is measured estimator bias in beta at this
        scale, matching the alpha bias. Recorded; it enters no verdict.

  # =====================================================================
  # 6. SCOPE, CEILINGS, PROHIBITIONS OBSERVED
  # =====================================================================
  scope:
    claim_tier: toy
    qualifier_required_on_every_citation: >-
      SUB-TOY. max log2 p = 18.0168, below the toy band RQ-SSIQ-9702af declares
      for this goal. No number here may be cited at crypto scale, and none at
      toy scale without this qualifier.
    inherited_unverified_assumption: >-
      the dataset is computed via the Deuring correspondence and Magma/Sage
      maximal-order machinery in the source. This run INHERITS that
      correspondence unverified and did not re-derive it
      (spec.scale_relevance.correspondence). What this run did verify
      independently: the class-number normalisation at 5379/5379 primes, the
      F_p-rational locus identity at 5377/5377 primes, and the Theorem 4.2
      bound at 5379/5379 primes.
    independence_achieved: >-
      the delta_E values were generated by the paper's authors, not by this
      program. That is the confound BATCH-002 was opened to attack, and on the
      data-provenance axis it was achieved. It does NOT lift the campaign's
      preliminary ceiling: the analysis, the estimator and this report are
      still one model in one session.
    prohibitions_observed:
      - no hypothesis status was changed
      - no ledger file was read for writing or written
      - nothing was committed, pushed, merged, or opened as a PR
      - the frozen specification was not edited
      - no delta_E was computed by this run
      - >-
        no claim was made that D1 is supported, refuted, validated or
        invalidated, and no claim was made about whether a p^{1/4} algorithm
        exists

