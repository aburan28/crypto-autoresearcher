experiment:
  id: EXP-MCEGOP-1bbd00
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-0b8dff; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-0b8dff
  question_id: RQ-MCE-b38a8b
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exact three-bucket decoding-outcome profile of toy binary Goppa codes across error weights
    0..2t, against a matched random code decoded by an exhaustive coset-leader table and against the
    same Goppa code decoded by its own coset-leader table
  objective: 'One uncertainty is reduced: what a binary Goppa code''s decoder actually does outside
    the radius it is designed for, and whether that behaviour is distinguishable from a generic code''s
    at the scales this program can reach. Stated in parts: (i) THE PROFILE ITSELF -- the exact fractions
    of correct, detected-failure and silent-miscorrection outcomes at every error weight from 0 to
    2t, computed by full enumeration wherever affordable, with every classification independently
    verified rather than taken from the decoder''s own report. The silent-miscorrection bucket is
    the one that is normally invisible and it is the reason the three-bucket classification is mandatory.
    (ii) CLIFF VERSUS SLOPE -- whether the Goppa arm''s transition from correct to failing is sharper
    than a matched random code''s under an exhaustive coset-leader decoder, summarised by the transition
    width in weights. A sharp cliff is the expected signature of bounded-distance decoding on an algebraically
    structured code; a random code''s coset-leader decoder should degrade gradually. If both arms
    look the same at the exact, fully enumerable cell, the toy scale cannot separate the two regimes
    and that is a clean measured obstruction worth recording. (iii) CODE VERSUS DECODER -- how much
    of the profile is a property of the code and how much of the decoding algorithm, isolated by decoding
    the same Goppa code with its own coset-leader table wherever the table is affordable. No stage
    of this contract touches any implementation, any oracle, any deployed system or any external text.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A completed run could support exactly this: that at the tested
      toy cells, under the frozen decoder route and the frozen planted-error model, the measured outcome-count
      tables and transition widths took the reported values, exactly where enumeration was exhaustive
      and within the reported sampling error elsewhere. What does NOT follow: nothing about any implementation
      of any cryptosystem; nothing about decryption failures, oracles, side channels or fault behaviour
      in any real system, which RQ-MCE-e65b3c records as a separate claim class saying nothing about
      the mathematics; nothing about Classic McEliece''s security or parameters; no distinguisher
      claim, since both arms are compared with full knowledge of which is which; and no extrapolation
      of any profile or transition width beyond the tested (n, k, t).'
  inputs:
    procedure: 'STAGE 0 (cost: minutes). Freeze the decoder route, the planted-error model, the three-bucket
      definitions, the cells and the seeds. STAGE 1 (cost: dependent on proposal 1). Load and re-verify
      the certified fixture and its decoder against the recorded sha256. STAGE 2 (cost: seconds to
      minutes per cell). Enumerate error patterns by weight up to 2t, exhaustively while C(n,w) <=
      10^6 and by uniform sampling of 10^6 above that, recording the switch. STAGE 3 (cost: minutes
      per cell). Decode each pattern, classify into the three buckets, and independently verify every
      classification by recomputing weight and syndrome. STAGE 4 (cost: seconds to minutes; memory-capped).
      Build the matched random code''s exhaustive coset-leader table by breadth-first syndrome enumeration
      where n-k <= 24, and classify the identical patterns. STAGE 5 (cost: same as STAGE 4). Build
      the Goppa code''s own coset-leader table where affordable and classify again, isolating code
      from decoder. STAGE 6 (cost: seconds). Run the coordinate-permutation invariance control. STAGE
      7 (cost: seconds). Compute transition widths and emit the full count tables per cell per draw
      with no pooling. Total budget 3 CPU-hours.'
    instrument: Python 3.11 standard library only (numpy absent, verified). Consumes harness/goppa_toy.py
      from proposal 1 for construction and decoding; adds an enumeration and classification module
      using itertools.combinations for error spheres, a breadth-first coset-leader table builder over
      syndromes held in a dict keyed by integer syndrome, and an independent verifier that recomputes
      weight and syndrome for every returned candidate. Driven through harness/runner.py with domain-separated
      random.Random seeds. No Sage, no external package, no network, and no contact with any implementation
      of any real cryptosystem.
    parameters: 'Cells: (m,t,n) in {(4,2,16), (4,2,12), (5,2,28), (5,3,24), (6,3,48)}, chosen so that
      n - k <= 24 in every cell where the coset-leader arm is required. Error weights w = 0..2t. Exhaustive
      enumeration while C(n,w) <= 10^6; uniform sampling of exactly 10^6 patterns above that. 5 independent
      (L, g, seed) draws per cell. Coset-leader tables capped at 2^24 entries. Coordinate-permutation
      invariance control on 3 draws per cell.'
  controls:
  - Matched random binary [n,k] code with an exhaustive coset-leader decoder, same invocation.
  - Goppa code decoded by its OWN coset-leader table where n-k <= 24, isolating code structure from
    decoder design.
  - Independent verification of every outcome classification by recomputing weight and syndrome, so
    no bucket relies on the decoder's self-report.
  - 'Column-permutation invariance: the profile must be unchanged under a random coordinate permutation
    applied to code and errors together.'
  - Five independent (L, g, seed) draws per cell, so a profile is a family of five and not a single
    reading.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a matched random binary [n, k] code, same n and
    same measured k, drawn in the same invocation from a domain-separated seed and equipped with an
    EXHAUSTIVE coset-leader decoder built by breadth-first enumeration of syndromes, which is feasible
    while n - k <= 24. The identical classification into correct / detected failure / silent miscorrection
    is applied. For the Goppa profile to mean anything the null must show a GRADUAL profile: a transition
    width strictly greater than the Goppa arm''s, and a nonzero silent-miscorrection fraction already
    at low weights where the Goppa arm has none. If the random null shows the same sharp cliff at
    the same weight, then the profile is measuring the enumeration geometry of small codes rather
    than any algebraic structure, and the honest report is that the toy scale cannot separate the
    two decoding regimes. A second control is the Goppa code decoded by its OWN coset-leader table
    where n - k <= 24, which isolates how much of the profile comes from the code and how much from
    the bounded-distance decoder.'
  independent_variables:
  - cell (m, t, n)
  - error weight w
  - arm (goppa bounded-distance | matched random coset-leader | goppa coset-leader)
  - draw index
  metrics:
    primary:
    - correct fraction per w per arm
    - detected-failure fraction per w per arm
    - silent-miscorrection fraction per w per arm
    - transition width per arm
    secondary:
    - weight at which the profile becomes constant
    - exhaustive-versus-sampled flag per (cell,w)
    - coset-leader table build time and size
    - count of classification-verification failures, required zero
    - spread of profiles across the five draws
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The silent-miscorrection fraction at each weight per arm, and the transition width per
      arm.
    formula: 'For arm A and weight w, P_A(w) = (c, f, s) / N_w where c, f, s count correct, detected-failure
      and silent-miscorrection outcomes among N_w enumerated or sampled weight-w patterns, with c+f+s
      = N_w enforced. TransitionWidth(A) = min{w : correct_A(w) <= 0.05} - max{w : correct_A(w) >=
      0.95}. Pre-registered: s_goppa(w) = 0 exactly for all w <= t; correct_goppa(t+1) <= 0.05; TransitionWidth(goppa)
      <= TransitionWidth(random coset-leader) - 1.'
    source: Pre-registered in the parent proposal IDEA-20260816-0b8dff before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'All cells have m <= 6, n <= 48, n - k <= 24 so that the coset-leader arm is exhaustively
      constructible and the comparison is exact rather than modelled. The smallest cell is fully exact
      at every weight, with no sampling anywhere, which is why it is the designated discriminating
      cell. NO transfer assumption is made: transition width is a property of the coset geometry of
      a specific small code and nothing about it is claimed at any other size. The construction is
      explicitly forbidden by RQ-MCE-b38a8b''s constraints from touching any live key, ciphertext,
      device or deployed implementation, and it does not.'
    correspondence: null
  tail_checks:
  - The silent-miscorrection bucket at w = t+1 is the rarest and most interesting and is reported
    as a raw count alongside its fraction.
  - Weights where sampling replaced enumeration are flagged inline in the table, never footnoted.
  - Cells with n = 2^m are reported separately as full-field-support special cases.
  - Any draw whose profile differs qualitatively from the other four in the same cell is reported
    individually rather than averaged in.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop and report if any silent miscorrection appears at w <= t on the Goppa arm, since that invalidates
    the fixture certificate.
  - Skip the coset-leader arm in any cell where n - k > 24 and record the cell as having no null rather
    than substituting an approximate one.
  - Cap total wall-clock at 3 CPU-hours and report unreached cells.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: For every cell, full three-bucket count tables with denominators are emitted
    per arm and per draw, every classification passes independent verification, the coordinate-permutation
    invariance control shows no change, and both transition widths are reported with the five-draw
    spread.
  falsification_criterion:
  - Any silent miscorrection at w <= t on the Goppa arm.
  - Goppa correct fraction of 1.0 at w = 2t.
  - Any profile change under coordinate permutation.
  - Any classification failing independent verification.
  - Buckets not summing to N_w at any (cell, w, arm).
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-0b8dff
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The decoder route must be frozen by the Coordinator before this contract runs, because behaviour
    above t depends on it while behaviour at or below t does not; a route changed mid-grid would make
    profiles incomparable.
  - The planted-error model is frozen as uniform over weight-w vectors; whether an alternative model
    is also required is a Coordinator decision, and running both and reporting the more interesting
    one is forbidden.
  - Whether the transition-width definition (0.95 to 0.05) is the right summary must be settled before
    results are seen, since it is a free parameter that changes the headline number.
