experiment:
  id: EXP-BINSTD-0f2222
  hypothesis_id: H-BINSTD-f4b5bb
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-5e859e
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Mitt calibration: does p_hat match exactly one of M1/M2/M3 within 25%
    relative error on n=17 toys?
  status: approved
  approved_by: DEC-20261003-c943ba
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261003-c943ba under AGENTS.md standing
    user authorization (2026-09-06). No Magma/Sage/AUXIN/Bedrock. No
    ECC2K-130 solve. No n>=131 attack. Stage 2 (n=23 winning-model
    replication) not authorized here.
  approval:
    approved_by: DEC-20261003-c943ba
    composing_decision: DEC-20261003-c943ba
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 freezes M1/M2/M3, relerr band 0.25, dual #E, N grid, empty-pool
      null, twin add. Stage 1 runs n=17 mitt bake-off; writes RESULTS.md with
      exactly one O-* label. No Magma/Sage. No AUXIN. No Bedrock. No ECDLP solve.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether empirical mitt p_hat matches exactly one of M1/M2/M3
    within relative error 0.25 on the three frozen n=17 cells under dual-route
    agreement; deliver exactly one O-* label from H-BINSTD-f4b5bb.

  class: heuristic_validation
  class_note: >-
    Instrument calibration of the F2 mitt success probability. Not an
    exponent-moving breakthrough; no ECDLP attack table.

  scope:
    included:
      - >-
        Stage 0. Freeze formulas M1=N(N-1)/(2|G|), M2=N^2/|G|,
        M3=1-exp(-N^2/|G|); freeze relerr band 0.25; measure #E by dual
        trace-count; freeze N so E_M2∈{5,15,40} at attempts=200; empty-pool
        null; twin add check. JSON freeze uses a list of cell objects with
        integer n (never n-as-object-key strings).
      - >-
        Stage 1. For each frozen cell at n=17 run mitt search (≥200 attempts);
        Route A table-field hash lookup; Route B schoolbook P+Q re-verify;
        write stage1/bakeoff-table.json, stage1/control-table.json, RESULTS.md
        with exactly one O-* label.
    excluded:
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Stage-2 n=23 winning-model replication under this card.
      - Editing IDEA-20261001-5e859e claim text or GOAL-ECDLP2M-001.yaml.
      - Editing M1/M2/M3 formulas or the 0.25 band after Stage-0 freeze.
      - Treating infra failure as mathematical evidence.
      - Designing IDEA-20261001-262544 (ANSI X9.62 c2pnb; likely O-IMPEDIMENT)
        or IDEA-20261001-d53638 (deferred; 5e859e ranked first among remaining
        arithmetic trials after the skip list).
      - Reviving HEUR-H1 of EXP-BINSTD-a3cfee under this card.

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-0f2222/trial-plan-v1.json
    trial_plan_alias: experiments/EXP-BINSTD-0f2222/trial-plan.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-0f2222/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-0f2222/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-0f2222/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-0f2222/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. implementation/run.py +
      check.py + gf2.py + curve.py + mitt.py are the hash-bound sources.
      Dual meters are table-field mitt search vs schoolbook re-add.
      trial-plan.json is byte-identical to trial-plan-v1.json.
      {run_dir} is substituted by the process supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20261001-5e859e.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-f4b5bb.yaml
    related_evidence: ledger/evidence/EV-BINSTD-8edd9b.yaml
    related_experiment: experiments/EXP-BINSTD-a3cfee/specification.yaml
    relerr_band: 0.25
    attempts: 200
    pool_seed: 202610015859
    r_seed: 202610015860
    stage1_cells:
      - {n: 17, e_m2_target: 5}
      - {n: 17, e_m2_target: 15}
      - {n: 17, e_m2_target: 40}

  controls:
    - name: dual_route_mitt
      definition: >-
        Route A TableField hash lookup of R-P in the pool; Route B
        independent schoolbook Curve.add(P,Q)==R on a fresh Field.
    - name: dual_order_count
      definition: table-field #E equals schoolbook #E (trace formula).
    - name: empty_pool_null
      definition: N=0 pool must produce zero hits.
    - name: ctl_frozen_formulas_before_runs
      definition: M1/M2/M3 and band 0.25 frozen in stage0/ before Stage 1.
    - name: ctl_no_posthoc_formula_edit
      definition: Formulas/band not edited after Stage-0 freeze.
    - name: ctl_list_rows_integer_n
      definition: Freeze JSON cells are a list of objects with integer n.
    - name: certificate_kind_vocabulary
      definition: result.certificate.kind is decomposition or none.
    - name: no_break_guard
      definition: No break / n>=131 transfer / exponent claim.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_bakeoff_n17]
    - name: e_m2_target
      levels: [5, 15, 40]
    - name: N
      levels: frozen_from_measured_group_order

  metrics:
    primary:
      - name: p_hat
        unit: probability
        definition: hits / attempts for R in Pool+Pool.
      - name: relerr_vs_M1_M2_M3
        unit: dimensionless
        definition: abs(p_hat - p_M) / p_M for each named model.
      - name: winning_model
        unit: enum
        definition: unique model with relerr≤0.25 on ≥3 cells, else null.
      - name: twin_agreement
        unit: boolean
      - name: certificate_pass_rate
        unit: probability
    secondary:
      - name: group_order
        unit: integer
        definition: measured #E via dual trace-count.
      - name: empty_pool_hits
        unit: integer
      - name: wall_clock_seconds
        unit: seconds
      - name: peak_rss_bytes
        unit: bytes
        definition: reported by the executor harness if available; null allowed.

  heuristic_under_test: HEUR-BINSTD-5e859e-H1

  preregistered_prediction:
    quantity: >-
      Empirical mitt p_hat matches exactly one of M1/M2/M3 within relative
      error 0.25 on all three Stage-1 cells after twin agreement.
    formula: >-
      M1: p=N(N-1)/(2|G|); M2: p=N^2/|G|; M3: p=1-exp(-N^2/|G|);
      |G|=#E(F_{2^n}); band holds iff |p_hat-p_M|/p_M ≤ 0.25.
    source: >-
      ledger/proposals/IDEA-20261001-5e859e.yaml predictions; frozen before
      Stage 1 in stage0/preregistered-predictions.json. EV-BINSTD-8edd9b
      recorded M1-as-used misspecification (38 vs E≈8.80).

  scale_relevance:
    tier: toy
    justification: >-
      Instrument calibration on n=17 only under this card. No transfer of a
      winning model into an n≥131 attack is claimed.
    correspondence: null

  tail_checks:
    - Twin disagreement voids band claims (O-ARTIFACT).
    - Empty-pool hit voids band claims (O-ARTIFACT).
    - Two models holding ≥3 cells → O-INCONCLUSIVE, not O-SUPPORT.
    - certificate.kind decomposition on counted hits; none if zero hits.

  seeds_and_replication:
    pool_seed: 202610015859
    r_seed: 202610015860
    null_seed: 202610015861
    independent_instances: 3
    note: >-
      Three E_M2 cells at n=17 are independent instances. Dual meters are
      the replication instrument for each hit. Stage-2 n=23 not authorized.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 2.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and methodological-note.json.
    - Stage 1 complete with bakeoff/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-BINSTD-f4b5bb.
    - maximum_runs = 4.
    - Do not open Stage-2 under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin failure or certificate fail → O-ARTIFACT; do not read band as support.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an n≥131 exponent move → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with twin_order_ok and empty_pool_hits=0;
    Stage 1 produces p_hat vs M1/M2/M3 for each frozen cell with dual-route
    agreement (or a named O-ARTIFACT/O-IMPEDIMENT/O-INCONCLUSIVE/O-FAIL-BAND
    stop); RESULTS.md names exactly one O-* label from H-BINSTD-f4b5bb with
    cited artifacts.

  falsification_criterion: >-
    Any of: twin disagreement; certificate fail; post-hoc formula/band edit;
    a claimed break/exponent under this card. (O-FAIL-BAND is a valid
    scientific negative of O-SUPPORT, not a protocol fail.)

  required_artifacts:
    - experiments/EXP-BINSTD-0f2222/trial-plan-v1.json
    - experiments/EXP-BINSTD-0f2222/trial-plan.json
    - experiments/EXP-BINSTD-0f2222/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-0f2222/stage0/methodological-note.json
    - experiments/EXP-BINSTD-0f2222/stage1/
    - experiments/EXP-BINSTD-0f2222/RESULTS.md
    - experiments/EXP-BINSTD-0f2222/runs/<RUN-BINSTD-*>/
    - experiments/EXP-BINSTD-0f2222/implementation/run.py
    - experiments/EXP-BINSTD-0f2222/implementation/check.py

  dominated_by: >-
    CHECKED: not an attack row. Rho / Gaudry-Diem IC / Semaev PDP dominate
    any attack reading; this contract claims none.

  sota_delta:
    time: zero attack delta
    memory: zero
    data_queries: three-model mitt bake-off spawned from EV-BINSTD-8edd9b

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
