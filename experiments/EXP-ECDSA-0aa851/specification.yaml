  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution. This contract is
      review_required and is NOT approved; `approved_by` is null and
      `execution_authorized` is false (AGENTS.md rule 1).
    - >-
      DEDUPLICATION AGAINST EXP-ECDSA-8b5b84 IS REQUIRED BEFORE APPROVAL. The
      parent proposal names that contract's ARMS E AND F as the carrier of its
      minimal test. Approving both unchanged would run the same bias and lattice
      arms twice under two hypotheses. See derivation_gaps.
    - >-
      The bias arm should be authorized SEPARATELY and FIRST. It requires no
