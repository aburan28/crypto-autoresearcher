      A surprise on the lattice side (recovery decaying more slowly than
      (1-e)^m) requires independent replication before any record states it.
  derivation_provenance:
    tool: coordinator subagent, design-experiment lifecycle steps 3-5
    source_record: IDEA-20260805-411b0e
    authored_at: '2026-08-25'
    note: >-
      Arms, controls, the six predictions, the falsification conditions and all
      three heuristics are transcribed from the parent proposal's `mechanism`,
      `minimal_test`, `predictions`, `controls`, `confounders` and
      `heuristic_assumptions` blocks rather than re-invented. Every forced value
      (0.6366198, 0.5093, 0.3820, 0.2546, 0.1273, 0.78027, 0.86311, 0.94980,
      0.4052847, 0.1642556, -1.27324, the (1-e)^m ratios, and the crossing ratios
      4.02 to 4.58) is the parent's own pre-registered derivation and is NOT a
      measurement made here; the 2/pi confirmation by exact finite summation was
      performed in the source session and is re-checked in-harness. Budget follows
      the parent's declared estimated_cost (implementation low, compute low). No
      field is invented; gaps below.
  derivation_gaps:
    - >-
      OVERLAP WITH EXP-ECDSA-8b5b84 IS REAL AND UNRESOLVED. The parent states its
      minimal test is carried by that contract as ARMS E AND F. This contract is a
      STANDALONE rendering under its own hypothesis. A Coordinator must decide
      before approval whether to approve this one and narrow 8b5b84, approve 8b5b84
      and withdraw this one, or approve both with an explicit non-duplication
      scope. Approving both unchanged produces two evidence records for one
      computation.
    - >-
      THE BIAS ESTIMATOR AND SIMULATOR ARE UNWRITTEN. The parent's own prior notes
      that the estimator, the simulator and the sampling tolerances are all
      unwritten and any of them can be wrong. They must be specified and reviewed
      before approval, because the instrument gate and the extinction null are the
      only protection against a defective one.
    - >-
      THE CONTINUOUS APPROXIMATION IS UNCHECKED AT THE RUN'S MODULUS. sinc(2^{-l})
      was confirmed to five figures at n = 65537 and n = 1000003, not at the 64-bit
      modulus the arm will use. The contract requires an exact finite-sum re-check,
      but the cost of that check at 2^64 is not estimated.
    - >-
      THE N = 64 TO N = 160 TRANSFER FOR THE ALL-OR-NOTHING LAW IS ASSUMED, NOT
      TESTED. The crossing weight is stated at N = 160 while the lattice arm runs
      at N = 64. The assumption is that the law is structural rather than
      size-dependent; a Coordinator should decide whether to fund a second N or
      accept the assumption explicitly.
    - >-
      ARM 0 MAY RETURN NOTHING. The parent's prior on the crossing statement
      surviving contact with the primary sources is about 0.45, and the sources
      were unreachable in the source session. The contract makes
      `sources_unobtainable` a first-class outcome, but the arm that decides
      whether the crossing applies to the record-holding family is the one most
      likely to return no answer.
    - >-
      THE RANGE-REDUCTION COST IS NOT CHARGED. Only the sample multiplier is
      modelled, not the cost of performing the reduction, which grows with w. A
      complete comparison charges both; IDEA-20260805-659115 is named as where the
      other half is charged, but no contract composes them.
    - >-
      THE +/-1 MODEL'S FORCED VALUE IS NOT DERIVED. The contract requires it to be
      re-derived inside the run, since the vanishing-sum identity does not apply,
      but the derivation does not exist yet and its difficulty is unassessed.
