# EXP-ECDLP-960960
# Addition-count arithmetic. No curve point is added.
# Approved by DEC-20261003-6df6b7.
experiment:
  id: EXP-ECDLP-960960
  hypothesis_id: H-ECDLP-0f055e
  source_idea: IDEA-20261003-236fb7
  question_id: RQ-ECDLP-002
  version: 1
  title: Bit length, doublings, and addition for 6
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-6df6b7
  objective: >-
    Check the length 3, the doubling count 2, the addition count 1,
    and the nearby gap 0.
  inputs:
    value: 6
    bit_length: 3
    doublings: 2
    additions: 1
    binary_weight: 2
    length_gap: 1
    doubling_gap: 1
    count_product: 6
    count_sum: 6
    nearby_a: 1
    nearby_b: 1
    nearby_gap: 0
  controls:
    - >-
      The integer 6 has bit length 3. Reporting that length as 2
      drops the excess 1 and invalidates the run.
    - >-
      The doubling count is 2 and the addition count is 1. Two
      exceeds one by 1. The product of 3, 2, and 1 is 6. Their sum
      is 6. The binary weight is 2.
    - >-
      Two readings of 6 each have 1 addition. Their gap is 0.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {length, doublings, additions}
    - route in {count, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - additions
      - implementations_agree
    secondary:
      - binary_weight
      - count_product
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The bit length is 3. The doubling count is 2. The addition
      count is 1. The addition gap of two readings of 6 is 0.
    formula: >-
      Count the bits of 6. Count the doublings from 1 to 4. Count
      the addition that reaches 6. Subtract 2 from 3. Multiply 3
      by 2 by 1. Subtract 1 from 1.
    source: >-
      IDEA-20261003-236fb7 states the integer 6 and the counts 3,
      2, and 1, read 2026-10-03. The product and the sum were
      recomputed in this design session. That computation is not
      a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a curve addition.
    correspondence: null
  tail_checks:
    - The addition count 1 and the nearby gap 0 are required. A check that stops at the length 3 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the length 3 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 3.
    - The doubling count is not 2.
    - The addition count is not 1.
    - The product of 3, 2, and 1 is not 6.
    - The addition count is reported as 0, or a curve point is added.
  success_criterion: >-
    Both runs agree that the bit length is 3, that the doubling
    count is 2, and that the addition count is 1.
  falsification_criterion: >-
    The runs agree that the bit length is computed, and that
    length is not 3.
  required_artifacts:
    - experiments/EXP-ECDLP-960960/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-960960/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-960960/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-960960/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-960960/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-960960/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a length gap of 1 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
