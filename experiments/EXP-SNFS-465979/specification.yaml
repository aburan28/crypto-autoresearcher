experiment:
  id: EXP-SNFS-465979
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-9cfbac; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-9cfbac
  question_id: RQ-SNFS-005666
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Matched norm-bit histogram and counted smoothness for a special-form polynomial against a
    same-prime large-coefficient null, across degree, coefficient bound and sieve box size
  objective: 'The one uncertainty a run reduces is how large the special-form advantage actually is
    when it is computed as a norm distribution rather than quoted as an asymptotic, and whether the
    standard conversion from norm size to smoothness probability is usable at the sizes this program
    can reach. (i) Is there a measurable shift: over an identical sieve box and an identical scoring
    function, does the small-coefficient arm produce a norm-product bit-length histogram materially
    left of the same-prime large-coefficient arm, and is the difference Delta larger than its own
    bootstrap error bar. (ii) Does the shift convert into relations: at declared smoothness bounds,
    is the exactly counted number of smooth norm products higher on the special arm, and by what ratio,
    since a distributional shift that does not raise the counted smooth yield is a statement about
    bit lengths and nothing more. (iii) Is the model that everyone uses for this conversion valid
    here: does the Dickman-based predicted smooth count match the counted one, and if it does not,
    by how much and in which direction, because at 64-bit norms an asymptotic smoothness model is
    being used far outside where it was derived and the mismatch is itself a result worth recording.
    Every one of the three is answered from the same enumeration of the same box.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal claim a run could support is: for the named prime
      sizes, degrees, coefficient bounds, sieve boxes and smoothness bounds, the small-coefficient
      polynomial produces norm products smaller by Delta bits on average and yields the measured ratio
      more smooth pairs than the specified same-prime null, and the Dickman conversion agrees or disagrees
      with the counted values by the measured factor. What does NOT follow: no running time for any
      sieve, no crossover size, no speedup, no statement that a special form is exploitable, and nothing
      whatever about any real, published or deployed parameter set. In particular Delta may not be
      reported as an attack improvement, and the contract forbids composing it with any external cost
      figure.'
  inputs:
    procedure: 'STAGE 0, zero compute: fix the box definition, the scoring function, the smoothness
      bounds and the null construction, and hash them before any prime is generated. STAGE 1, minutes:
      implement exact integer norm evaluation and validate it against hand-computed values on ten
      pairs. STAGE 2, minutes: implement Dickman rho by numerical integration and validate against
      closed-form values at arguments 1 to 3, which is a hard gate. STAGE 3, minutes: generate the
      primes and both polynomial arms per cell, recording seeds. STAGE 4, the bulk, tens of minutes:
      enumerate the box and score both arms, emitting histograms. STAGE 5, tens of minutes: count
      smooth norm products by trial division at each bound. STAGE 6, minutes: run the box-growth sweep,
      the random-coefficient control and the degree control. STAGE 7, seconds: compute Delta with
      bootstrap error bars, the counted ratios and the predicted-to-counted ratios, and emit the run
      manifest.'
    instrument: Pure Python 3.11 standard library only; numpy, sympy, gmpy2 and fpylll were all checked
      and are absent, and Sage is excluded by contract. Arbitrary-precision int for all norms, math.gcd
      for the coprimality filter, a self-contained fixed-step numerical integrator for the Dickman
      delay differential equation, and trial division against a sieve-of-Eratosthenes prime list for
      smoothness. New module harness/snfs_norms.py holds the box enumerator, the two polynomial constructors,
      the scorer and the smoothness counter; harness/runner.py records the manifest and the inference
      block.
    parameters: Prime bit sizes n in {48, 64, 80}. Degrees d in {2,3,4}. Coefficient bounds H in {16,
      64, 256}. Sieve boxes with A = B in {50, 100, 200, 400}. Smoothness bounds B_s in {2^10, 2^12,
      2^14}. Five distinct primes per (n,d,H) cell with recorded seeds, each scored on both arms,
      giving 27 cells times 5 primes times 2 arms times up to 4 boxes. Per-cell wall-clock cap 900
      seconds.
  controls:
  - The matched same-prime large-coefficient null, run in the same loop with only the polynomial swapped.
  - A random-coefficient polynomial with no root condition, to confirm the structured null is not
    itself anomalous.
  - A box-growth sweep at A in {50, 100, 200, 400} to test Delta invariance.
  - A Dickman-integration validation against exact rho values at arguments 1 through 3, where rho
    is known in closed form.
  - A degree control at d = 2 and d = 4 with H fixed, to confirm Delta moves with degree in the derived
    direction.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The same prime p, the same base m, the same box, the same scoring function,
    and a degree-d polynomial with coefficients of ordinary size obtained from the base-m digit construction,
    so the only difference between the arms is coefficient magnitude. Additionally a random-coefficient
    control in which the null polynomial does not have m as a root modulo p at all, which must show
    a norm histogram statistically identical to the structured null; if the structured null and the
    random null differ, the measured Delta is contaminated by the root condition rather than by smallness.
    For the signal arm to mean anything, the null must show a norm histogram whose lower tail is materially
    thinner and whose counted smooth values are materially fewer, at the same box and the same smoothness
    bound.'
  independent_variables:
  - degree d
  - coefficient bound H
  - prime bit size n
  - sieve box half-width A
  - smoothness bound B_s
  metrics:
    primary:
    - mean and median log2 norm product per arm
    - Delta with bootstrap confidence interval
    - counted smooth-pair count per arm per bound
    - counted smooth ratio special over null
    - predicted-to-counted smooth count ratio
    secondary:
    - full bit-length histogram per arm
    - lower-tail mass below each bound
    - wall-clock seconds per box
    - peak resident memory
    - coprime pair count per box
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Delta(d,H,n,A), the difference in mean log2 of the norm product between the large-coefficient
      null arm and the small-coefficient special arm over the same box.
    formula: Delta is predicted to be approximately log2(p^(1/(d+1))) - log2(H) plus a box-dependent
      term that cancels between the arms, so the leading prediction is Delta = n/(d+1) - log2(H) bits,
      independent of box size to first order. The counted smooth ratio is predicted to be an increasing
      function of Delta at fixed bound, and the prereg statement is the leading-order equality above
      with an allowance of 2 log2 units.
    source: Pre-registered in the parent proposal IDEA-20260816-9cfbac before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Prime sizes 48 to 80 bits, boxes up to 400 by 400, and smoothness bounds up to
      2^14 are used because at those settings every smooth value can be counted exactly by trial division,
      making the smoothness measurement ground truth rather than a model output. The extrapolation
      assumption is stated and is deliberately minimal: Delta is predicted to follow n/(d+1) - log2(H),
      a formula that can be evaluated at any n, but the contract permits reporting that formula only
      as a prediction validated at the tested sizes, and forbids reporting a smooth-yield ratio or
      any running time at untested sizes.'
    correspondence: null
  tail_checks:
  - Inspect the extreme lower tail of both histograms for pairs with atypically small norms, which
    drive the smooth counts.
  - Check pairs near a = 0 and b = 1 separately, since box edge effects concentrate there.
  - Check whether any single prime in a cell dominates the counted smooth ratio, which would make
    the cell a one-instance result.
  - Compare the special arm's smooth values for repeated small prime factors, which would indicate
    a projective-root effect rather than a size effect.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop a cell at its 900-second cap and record it as budget-truncated, never as evidence of no advantage.
  - Stop the whole run if the Dickman integrator fails its closed-form validation, since no predicted
    count would be meaningful.
  - Stop if the norm evaluator disagrees with any of the ten hand-computed validation values.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Every cell reports Delta with error bars, counted smooth-pair ratios at every
    bound, and the predicted-to-counted ratio, with the box-growth, random-coefficient and degree
    controls all executed in the same invocation.
  falsification_criterion:
  - Delta is within its bootstrap error bar of zero at any cell where the arms differ by many orders
    of magnitude in coefficient size.
  - Counted smooth ratios are at or below 1 despite a clear histogram shift, refuting size as the
    operative variable.
  - Delta moves by more than the allowed 2 log2 units across the box sweep, refuting the box-independence
    prediction.
  - The random-coefficient control does not match the structured null, showing contamination by the
    root condition.
  - Dickman-predicted and counted smooth counts differ by more than an order of magnitude at every
    bound and every cell, invalidating the conversion step.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-9cfbac
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The null polynomial construction is a design choice that sets the headline number; the Coordinator
    must approve it explicitly and record that a stronger null would reduce Delta.
  - Whether projective roots and small-prime root densities should be included in the scoring function
    is unresolved here and materially affects the smooth counts.
  - The prereg formula ignores the rational-side contribution, which is not negligible at small boxes;
    a Coordinator must either accept the allowance of 2 log2 units or require the full two-term prediction.
  - Nothing in this contract connects Delta to a sieve running time, and any later record that wants
    a crossover must obtain the relation-collection and matrix costs separately.
