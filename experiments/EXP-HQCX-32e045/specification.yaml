experiment:
  id: EXP-HQCX-32e045
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-50d270; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-50d270
  question_id: RQ-HQC-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Differential testing of the HQC concatenated decoder against an independently derived second
    implementation, with a mutation catalogue whose effect sizes are derived before injection and
    a reported corpus-coverage figure
  objective: 'The one uncertainty a run reduces: whether the decoder implementation underlying every
    committed GOAL-HQC-001 failure number implements the intended semantics, a property no reproducibility
    or arithmetic gate can detect. A run establishes (i) whether two implementations built by different
    construction routes agree exactly over a corpus that is exhaustive at the smallest block length
    and distributional plus adversarial at larger ones; (ii) the corpus''s detection coverage over
    a mutation catalogue whose per-class effect sizes were derived before either implementation was
    mutated, so that agreement carries a measured sensitivity rather than an assumed one; and (iii)
    a named list of coverage holes - mutation classes with predicted detectable effect that the corpus
    fails to catch - which is the reusable part of the deliverable regardless of whether any defect
    is found. The expected outcome is agreement; the contribution is that agreement acquires a number.
    No attack, break, speedup or security consequence is claimed here or would follow from a run.
    No statement is made about what the published literature does or does not contain; this environment
    cannot reach external literature. No direction is declared impossible.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: over the executed corpus, two implementations
      derived from the same committed transcription by different routes agree exactly or disagree
      on a named set of inputs; and the corpus detects a stated fraction of a stated mutation catalogue
      at stated predicted-versus-observed rates. WHAT DOES NOT FOLLOW: no statement that the transcription
      is faithful to any external specification, which is a different and unaddressed question; no
      validation of any downstream failure number beyond the removal of one failure mode; nothing
      about timing, cost or machine behaviour; no attack and no security consequence; and no claim
      of full implementation independence, which one session cannot demonstrate.'
  inputs:
    procedure: 'STAGE 0 (hours, zero compute): derive the mutation catalogue and its per-class predicted
      disagreement rates from the code''s weight distribution and the pipeline''s structure, and freeze
      it. STAGE 1 (hours): write the second implementation by the explicit-codeword-table route from
      the transcription only; record the procedural constraint and its limits. STAGE 2 (seconds):
      exhaustive corpus at RM(1,4), all 65536 received words, both implementations, exact comparison.
      STAGE 3 (minutes): distributional corpus at RM(1,5) and RM(1,6) drawn from the pipeline''s own
      law, 10^6 words each, plus an adversarial slice of near-tie and near-threshold inputs. STAGE
      4 (minutes): inject each catalogued mutation into one implementation at a time; measure and
      record observed versus predicted rates. STAGE 5 (zero compute): compute coverage, list holes,
      and write the limitation statement about independence.'
    instrument: 'Python 3.11 with numpy; NO Sage. Implementation A: the numpy fast Walsh-Hadamard
      transform decoder shared across this batch. Implementation B: an explicit codeword-table decoder
      that materialises all 2^{m+1} Reed-Muller codewords and takes an exact integer correlation maximum,
      written from the transcription without consulting A''s source. Both kept in int32 so comparison
      is exact and no tolerance is involved. Mutations applied by a declarative patch table rather
      than by editing source, so each mutation is a data item with a recorded predicted effect. Corpus
      generation and comparison recorded through harness/runner.py with a frozen seed ladder.'
    parameters: 'Exhaustive corpus: RM(1,4), length 16, all 2^16 = 65536 received words. Distributional
      corpora: RM(1,5) length 32 and RM(1,6) length 64, 10^6 received words each drawn from the pipeline''s
      own law at n = 227 and n = 587 with duplication in {1, 3}. Adversarial slice: 10^5 inputs constructed
      to sit within one correlation unit of a tie and within one unit of the outer threshold. Mutation
      catalogue: at least 12 classes spanning generator-row bit flips, truncation offset off-by-one,
      tie-direction reversal, correlation-index off-by-one, duplication mis-folding, block-boundary
      misalignment and outer-radius off-by-one. Each mutation injected separately.'
  controls:
  - Unmutated pair with an exact zero-disagreement requirement over the whole corpus, fail-closed.
  - Mutation catalogue with effect sizes derived before the second implementation is written.
  - Exhaustive corpus at the smallest block length, where undetected mutations are provably semantically
    null.
  - Adversarial corpus slice of near-tie and near-threshold inputs, since those are the paths random
    corpora under-sample.
  - Explicit recording of the limits of implementation independence, so the coverage figure is not
    over-read.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is the UNMUTATED pair, and its required behaviour is
    exact: zero disagreements over the entire corpus. That is a fail-closed gate rather than a statistic.
    The signal object is each mutated pair, which must disagree at its predicted rate. FOR THE INSTRUMENT
    TO MEAN ANYTHING: (i) the unmutated pair must show exactly zero disagreements - a single one means
    the two implementations are not both correct and the differential test has found something before
    the mutation study even begins, which is itself a valuable outcome; (ii) every mutation whose
    predicted rate is above the corpus''s resolution must actually be detected, and each undetected
    one is reported as a named coverage hole rather than folded into an average; (iii) observed disagreement
    rates must match predicted rates within a stated tolerance, since a mutation detected at the wrong
    rate indicates the prediction, the corpus or the implementation is wrong and the run cannot say
    which without investigation. Both arms run in the same invocation over the same corpus.'
  independent_variables:
  - 'implementation: A (Walsh-Hadamard) versus B (explicit table)'
  - mutation class
  - 'corpus slice: exhaustive / distributional / adversarial'
  - inner block length and duplication multiplicity
  metrics:
    primary:
    - unmutated disagreement count per corpus slice
    - observed disagreement rate per mutation class
    - predicted disagreement rate per mutation class
    - coverage fraction over the catalogue
    secondary:
    - named coverage holes with predicted rates
    - corpus size and composition per slice
    - smallest detected mutation magnitude
    - wall-clock seconds per stage
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The unmutated disagreement count (predicted exactly zero) and the coverage fraction
      over the frozen mutation catalogue.
    formula: Unmutated disagreement count := number of corpus inputs on which A and B differ in decoded
      codeword or failure indicator; predicted exactly 0. Coverage := (number of catalogued mutations
      with observed disagreement rate greater than zero) divided by (number of catalogued mutations
      with predicted rate above corpus resolution); predicted at least 0.8. Per-mutation agreement
      := |observed rate - predicted rate| / predicted rate; predicted at most 0.2. Under the null
      that the corpus exercises nothing, coverage is 0 and every mutation goes undetected.
    source: Pre-registered in the parent proposal IDEA-20260816-50d270 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The exhaustive arm at RM(1,4) covers the ENTIRE input space, so within that arm
      there is no sampling and no extrapolation - a mutation that changes the decoder''s function
      there is detected with certainty, and one that is not detected is provably semantically null.
      The larger arms are sampled at inner block lengths 32 and 64 with n = 227 and n = 587, well
      below deployed HQC. The transfer assumption is narrow and stated: that a semantic defect present
      at deployed block lengths would also alter the function at these lengths, which is plausible
      because the decoder''s structure does not change with n, and which is exactly what the coverage
      figure bounds rather than assumes.'
    correspondence: null
  tail_checks:
  - Report disagreements on the adversarial near-tie slice separately, since that is where a defect
    is most likely and least likely to be sampled.
  - Check whether any mutation is detected ONLY on the adversarial slice, which would be a specific
    and reportable statement about the pipeline's own distribution.
  - Verify that mutations with tiny predicted rates are distinguished from undetected ones by reporting
    the corpus resolution alongside each.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - 'Halt and report immediately if the unmutated pair disagrees anywhere: the disagreeing inputs
    are a certificate and take priority over the rest of the study.'
  - Abort if the transcription proves too incomplete to write implementation B, reporting the incompleteness
    as the outcome.
  - Stop at the frozen catalogue; no mutation is added after observing results.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The unmutated pair agrees exactly over every corpus slice, and the run reports
    coverage over the frozen catalogue with predicted-versus-observed rates per class and a named
    list of holes.
  falsification_criterion:
  - 'The unmutated pair disagrees: at least one implementation is wrong and the disagreeing inputs
    are the deliverable, superseding the coverage study.'
  - 'Coverage is below 0.8: the corpus is weak and the named holes are the recorded obstruction.'
  - 'Predicted and observed rates disagree by more than 20 percent for most classes: the derivations
    are unreliable and no coverage figure is issued.'
  - 'The transcription is too incomplete to write implementation B: reported as the outcome, and no
    claim of decoder validation may be made.'
  - 'Mutations are detected only on the adversarial slice: the pipeline''s own distribution does not
    exercise the decoder, which is reported as a specific hole.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-50d270
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The mutation catalogue is sketched by class here but its per-class effect-size derivations are
    not written; a Coordinator must require them frozen before implementation B exists, since deriving
    them afterwards destroys the calibration.
  - The procedural constraint 'written without consulting implementation A' cannot be verified from
    the artefact and needs an explicit, honest statement of what was and was not consulted, agreed
    in advance.
  - Corpus resolution - the smallest disagreement rate the corpus can distinguish from zero - must
    be computed per slice before the coverage denominator is defined, otherwise the coverage figure
    is arbitrary.
  - Whether a disagreement in decoded codeword with an identical failure indicator counts as a disagreement
    needs a ruling; both conventions are defensible and they give different coverage numbers.
