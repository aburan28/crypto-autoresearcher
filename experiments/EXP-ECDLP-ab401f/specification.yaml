# EXP-ECDLP-ab401f
# Digit-count arithmetic. No curve point is added.
# Approved by DEC-20261004-85e4b3.
experiment:
  id: EXP-ECDLP-ab401f
  hypothesis_id: H-ECDLP-6a8905
  source_idea: IDEA-20261004-61397d
  question_id: RQ-ECDLP-002
  version: 1
  title: Doubling count and addition count of the integer 268435455
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-85e4b3
  objective: >-
    Check the counts 28, 27, and 27, the product 20412, and the nearby gap 0.
  inputs:
    bit_length: 28
    doublings: 27
    additions: 27
    length_gap: 1
    doubling_gap: 0
    digit_product: 20412
    digit_sum: 82
    nearby_a: 27
    nearby_b: 27
    nearby_gap: 0
    nearby_product: 729
  controls:
    - >-
      The bit length is 28. The doubling count is 27. The addition
      count is 27. Reporting the addition count as 28 drops the gap
      against the bit length and invalidates the run.
    - >-
      Twenty-eight exceeds twenty-seven by 1. Twenty-seven equals
      twenty-seven, so that gap is 0. The product of 28, 27, and 27
      is 20412. Their sum is 82.
    - >-
      Two readings of the addition count are both 27. Their gap is
      0 and their product is 729.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {bits, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - additions
      - implementations_agree
    secondary:
      - digit_product
      - digit_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The integer 268435455 has bit length 28, 27 doublings, and 27
      additions. The gap of two addition counts is 0.
    formula: >-
      Read the bit length 28. Count 27 doublings. Count 27 additions.
      Multiply 28, 27, and 27. Subtract 27 from 27.
    source: >-
      IDEA-20261004-61397d states the counts 28, 27, and 27, read
      2026-10-04. The gaps, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 20412 and the nearby gap 0 are required. A check that stops at the bit length 28 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the addition count 27 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 28.
    - The doubling count is not 27.
    - The addition count is not 27.
    - The product is not 20412.
    - The addition count is reported as 28, or a curve point is added.
  success_criterion: >-
    Both runs agree that the bit length is 28, that the doubling
    count is 27, that the addition count is 27, and that the product
    of those three counts is 20412.
  falsification_criterion: >-
    The runs agree that the addition count is computed, and that
    count is not 27.
  required_artifacts:
    - experiments/EXP-ECDLP-ab401f/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-ab401f/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-ab401f/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-ab401f/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-ab401f/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-ab401f/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a digit-count gap moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
