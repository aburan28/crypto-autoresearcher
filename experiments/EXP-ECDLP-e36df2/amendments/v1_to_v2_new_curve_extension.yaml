protocol_amendment:
  id: PA-ECDLP-e36df2-v1-to-v2
  id_allocation_provenance: >-
    Amendment records are not in tools/allocate_id.py's identifier space.
    One experiment has at most one v1-to-v2 amendment; the label is unique
    by construction (precedent: PA-ECDLP-44f4af-v1-to-v2).
  experiment_id: EXP-ECDLP-e36df2
  version_from: 1
  version_to: 2
  amended_at: '2026-09-21'
  filed_at: '2026-09-21'
  filed_by: coordinator
  authoring_task: TASK-20260921-9b17e4
  recorded_by_decision: DEC-20260921-e21d6a
  opening_decision: DEC-20260921-e21d6a
  goal_id: GOAL-ECDLP-001
  status: approved
  approved_by: coordinator
  approved_at: '2026-09-21'
  approved_by_decision: DEC-20260921-e21d6a
  applies_to: future_runs_only
  experiment_runs_authorized: 4
  execution_authorized: true
  v1_frozen_path: experiments/EXP-ECDLP-e36df2/specification.yaml
  v1_bytes_untouched: true
  predecessor_path: experiments/EXP-ECDLP-e36df2/specification.yaml
  predecessor_sha256_note: >-
    Not computed by the authoring (coordinator) session (no shell/hash-capable
    tool available to it -- Read/Grep/Glob/Write/Edit only). Computed
    additively by the committing session before this amendment's commit.
  predecessor_sha256: e35d2974dfac9b1e4c11769fee5c2a2b0a81def3c8de3557c9735eda45a14ec8
  predecessor_sha256_verified_by: >-
    claude-code-session 2026-09-21, via `sha256sum
    experiments/EXP-ECDLP-e36df2/specification.yaml` and `git diff --
    experiments/EXP-ECDLP-e36df2/specification.yaml` (empty, confirming v1
    is byte-identical to its state before this amendment).
  scientific_parameters_changed: false
  scientific_parameters_unchanged_list:
    - "N_i = ceil(20 * p_i), mu0_target = 20"
    - "alpha = 0.01, effect bar >= 3 (both the point-estimate and CI-lower-bound readings)"
    - "m=1 tautology exclusion, computed once outside the counted loop"
    - "cross-prime +-1 degeneracy screen, exact definition unchanged"
    - "s_x, s_y, s_rand construction code (driver/sections.py), reused unmodified"
    - "prime bit range [2**10, 2**14) and all curve/prime selection criteria (good ordinary reduction, gcd(n,p)=1, #E(F_p) != p)"
  preregistered_prediction_changed: false
  scientific_effect: >-
    Does not reopen, reweight, or extend H-ECDLP-09125b's own already-decided
    pooled statistic (24 main + 4 sensitivity-check instances; DEC-20260912-2a626b,
    EV-ECDLP-5b61eb; frozen). It authorizes exactly one new (curve, 4-primes)
    instance set, generated by the identical seeded procedure/criteria already
    frozen for this experiment under a new, distinct seed, whose results are
    evidence for a NEW sibling hypothesis (H-ECDLP-c48f2a) alone. See
    `confirmatory_status` and `reason` below for why this is not folded into
    H-ECDLP-09125b's own reading.
  reason: >-
    NOT a new scientific concern raised by evidence. H-ECDLP-09125b and
    EXP-ECDLP-e36df2 v1 are fully decided (DEC-20260912-2a626b, decision:
    support, strength: strong; H-ECDLP-09125b status: analyzed) and that
    decision is not reopened, questioned, or revisited by this amendment.
    This amendment exists solely because the user explicitly, twice,
    requested -- via a direct chat request and then confirmed through two
    rounds of AskUserQuestion after the Coordinator disclosed the exact
    tradeoffs (that the confirmatory design is already closed, that new
    data cannot revise its frozen pooled Poisson statistic, and that this
    is additional out-of-original-scope data collection rather than a
    re-test of the closed claim) -- genuinely new trials extending the
    tested curve/prime set beyond the original six curves (five global
    curves plus one engineered positive control). The user accepted that
    this overrides specification.yaml v1's frozen budget.maximum_runs=25
    (already at 28 committed runs) and explicitly asked for a formal
    protocol amendment to authorize it. The user's stated goal is
    broadening the tested-instance set for its own sake; no defect,
    confound, statistical anomaly, or unresolved question in the v1
    evidence motivates this change, and none is asserted here.
  changes:
    - field: budget.maximum_runs
      from: 25
      to: 32
      why: >-
        Covers the 28 already-committed runs (unaffected; see
        unaffected_runs) plus 4 new runs, one per reduction prime, for
        exactly one new curve sized identically to the existing design (4
        primes per curve, per frozen_positive_control_curve.json's own
        pattern and EXP-ECDLP-a26bde/driver/curves.py's
        PRIMES_PER_CURVE=4). An itemized count, not a round-number
        increase.
    - field: budget.total_cpu_hours
      from: 6
      to: 12
      why: >-
        orchestrate_manifest_summary.json records 31226.33s (~8.68 CPU
        hours) actually spent across the 28 committed runs. That total is
        NOT 28 independent jobs: the v1 driver (instance_runner.run_curve)
        walks one shared m-ladder for all 4 primes of a curve, so the 28
        run records are 7 curve-level jobs (6 main curves plus the cheap
        mu0_target=40 sensitivity redo of the smallest-prime curve) and
        cost is per curve, dominated by its largest prime. Measured
        cpu_seconds_curve_shared for the six main curves: 6783s, 319s,
        3320s, 7781s, 6110s, 6243s (sensitivity redo: 655s). One new
        curve with 4 primes in the same [2**10,2**14) bit range is
        therefore budgeted as one curve-level job at the observed
        per-curve maximum (7781s at p=14821) scaled to the top of the
        prime range (~8600s), plus curve/prime search and pooled-summary
        overhead: ~10800s (3 hours) more, for a total near 11.7 hours;
        rounded up to 12. This is an advisory
        estimate per specification.yaml's own `enforcement: advisory` and
        CLAUDE.md's "Research budgets: progress first" -- not a hard cap.
        GOAL-ECDLP-001 is a declared ECC area
        (orchestration/research-priority.yaml, tools/ecc_priority.py)
        whose own campaign-level maximum_batches/total_wall_clock_seconds
        are already unbounded (null) by that policy; this
        experiment-level figure is a genuine cost estimate for
        calibration, not a rationing device, and is not itself subject to
        the ECC-unlimited rule (which binds GOAL-level fields).
    - field: independent_variables[0] (curve set)
      from: >-
        curve in {the 5 curves frozen by EXP-ECDLP-a26bde} union {the new
        engineered positive-control curve} (6 curves total; seeds
        20260905, 20260911)
      to: >-
        Unchanged for the v1 / H-ECDLP-09125b confirmatory reading (NOT
        reopened), PLUS one new, non-engineered curve selected by the
        identical seeded procedure (frozen_ref-equivalent
        `_candidate_curves` / `_find_primes_for_curve`, same criteria: p
        in [2**10,2**14), good ordinary reduction, gcd(n,p)=1, #E(F_p) !=
        p) under a NEW seed (20260921, distinct from the two already used
        -- 20260905 and 20260911 -- so this is not a duplicate
        selection), assigned curve_idx=6 (one past the existing six). This
        new curve's 4 (curve,prime) instances feed ONLY H-ECDLP-c48f2a's
        own, separately pooled statistic -- never H-ECDLP-09125b's frozen
        24+4-instance pool.
      why: user-requested extension of the tested curve/prime set, per `reason` above.
  affected_runs: []
  unaffected_runs_note: >-
    RUN-ECDLP-e36df2-001 through RUN-ECDLP-e36df2-028 (all 28
    already-committed runs) are byte-identical and immutable, remaining
    the sole evidentiary basis for EV-ECDLP-5b61eb / DEC-20260912-2a626b /
    H-ECDLP-09125b, wholly unaffected by this amendment.
  new_runs_authorized:
    - RUN-ECDLP-e36df2-029
    - RUN-ECDLP-e36df2-030
    - RUN-ECDLP-e36df2-031
    - RUN-ECDLP-e36df2-032
  confirmatory_status: exploratory_only
  confirmatory_status_reason: >-
    H-ECDLP-09125b's success_criterion / falsification_criterion (joint
    alpha=0.01, effect>=3 Poisson bar) was pre-registered against a FIXED
    24-instance set (later extended only by a pre-planned mu0_target=40
    sensitivity check on an already-included curve, never by adding new
    curves) and has already been fully adjudicated (DEC-20260912-2a626b).
    Pooling one more curve's data into that already-decided statistic now,
    after the verdict is known, would be undisclosed post-hoc data
    dredging on a closed confirmatory test -- exactly what this program's
    pre-registration discipline and AGENTS.md rule 4 exist to prevent,
    regardless of how the new data comes out. The new curve's own
    instances are therefore scoped as exploratory-only supplementary data
    under a NEW sibling hypothesis (H-ECDLP-c48f2a, derived from the same
    instrument/idea as H-ECDLP-09125b), decidable only against ITS OWN,
    separately pre-registered statistic over its own 4 instances.
    H-ECDLP-c48f2a's own record states its success/falsification criteria
    and their statistical power explicitly; per AGENTS.md, a single,
    unreplicated empirical-only run set may never itself drive a
    `reject_scoped`-strength verdict, so any eventual falsified-looking
    reading on this one new curve would call for `weaken` plus replication,
    not `reject_scoped`.
  what_this_amendment_does_not_do:
    - >-
      Does not reopen, weaken, strengthen, or add evidence to
      H-ECDLP-09125b, EXP-ECDLP-e36df2 v1's original pooled reading,
      EV-ECDLP-5b61eb, or DEC-20260912-2a626b, all of which remain
      immutable and officially decided at support/strong.
    - >-
      Does not alter KN-FIND-e8cfdc, which remains the correct, unedited
      record of what the closed v1 confirmatory test showed.
    - >-
      Does not change N_i=ceil(20*p_i), alpha=0.01, the effect>=3 bar, the
      cross-prime screen definition, the m=1-tautology exclusion, or any
      other scientific parameter of the frozen v1 design; the new curve's
      4 instances are generated and analyzed by the SAME frozen procedure,
      only pooled separately from the closed statistic.
    - >-
      Does not invent a scientific rationale for this extension beyond the
      one actually operating: this is user-requested supplementary data
      collection, stated honestly here rather than dressed up as a
      response to an evidentiary gap in the closed test.
    - >-
      Does not edit H-ECDLP-09125b's status or status_note. That record is
      left completely untouched (see DEC-20260921-e21d6a rationale for why);
      discovery of this amendment from that hypothesis happens by searching
      the ledger for citations of H-ECDLP-09125b, not by an inline pointer
      on the immutable record itself.
  refs:
    - H-ECDLP-09125b
    - H-ECDLP-c48f2a
    - EXP-ECDLP-e36df2
    - EV-ECDLP-5b61eb
    - DEC-20260912-2a626b
    - KN-FIND-e8cfdc
    - TASK-20260921-9b17e4
    - DEC-20260921-e21d6a
