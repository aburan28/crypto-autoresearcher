experiment:
  id: EXP-FIND-b9afb9
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-FIND-52472d
  question_id: RQ-FIND-001
  goal_id: GOAL-FIND-001
  source_idea_id: IDEA-20260805-de2945

  title: >-
    Tier-certificate chain audit of GOAL-FIND-001's completion criterion: a
    differential probe of validate_ledger.py's claim-tier ceiling, a
    chain traversal over the eleven section 1.1 promotions, and a derived
    tier register for 60 runs whose parameters the checker never reads

  objective: >-
    Decide, by measurement rather than by reading, whether the clause "with
    claim boundaries no stronger than cited EV/DEC scope" in
    GOAL-FIND-001.completion_criteria has ever been evaluated for any of the
    eleven chains it governs; establish differentially whether the third link's
    failure is a key-path mismatch or an absence of data; and, if the data are
    present and only mislocated, reconstruct the ceiling so the clause becomes
    evaluable for the first time. The experiment is designed so that its
    CHEAPEST STAGE IS DECISIVE: stage 1 is a seconds-long differential probe on
    synthetic records that can terminate the entire line before any corpus file
    is traversed.

  what_this_is_not:
  - It is NOT a mathematical experiment. No elliptic curve, no field, no
    algorithm, no summation polynomial and no cost model appears anywhere in
    it. Nothing it produces may be cited as ECDLP evidence.
  - It does NOT claim that any promoted KN-FIND boundary is wrong. Its
    pre-registered prediction is that all eleven are correct.
  - It does NOT propose, and must not be read as proposing, any change to
    tools/validate_ledger.py. It reports two candidate repairs with their
    measured coverage and chooses neither; changing a checker that governs 103
    manifests and every future record is a Coordinator decision.
  - It does NOT edit, rename, move or supersede any existing record. Its only
    write is a new derived-certificate register file.
  - It does NOT license any statement about goals other than GOAL-FIND-001.
    The corpus-wide census is reported as context bounded by a published glob.
  - It does NOT change any status. Not the goal's, not a hypothesis's, not an
    evidence record's. AGENTS.md rule 1.
  - It does NOT establish that no instrument anywhere validates the criterion.
    It reports the grep it ran and the paths it walked, and nothing stronger.

  claim_ceiling:
    tier: toy
    exact_scope: >-
      A run of this contract could support, at most: that at one named commit,
      for eleven named citation chains, the committed validator does not
      evaluate its claim-tier ceiling; that the mechanism at link 3 is a
      key-path mismatch, demonstrated by a two-arm differential with the
      parameter dict held bit-identical; that a derived certificate places each
      chain's ceiling at a stated tier under a quoted convention; and that a
      two-reader adjudication of the eleven prose boundaries against those
      ceilings returned a stated verdict with a stated disagreement count.
      Nothing above that. The tier label 'toy' is used because the contract's
      claims are about a small enumerated population of records at one commit;
      it carries no mathematical content, and this contract makes no claim at
      any tier about any cryptographic parameter.

  inputs:
    executing_commit: >-
      Recorded at stage 0 as the output of `git rev-parse HEAD`, and every
      subsequent number is bound to it. Not known in advance; the repository is
      under concurrent write by many worktrees.
    audited_chain_set:
      definition: >-
        The eleven evidence records named verbatim in
        docs/knowledge-assessment-20260724.md section 1.1, each paired with the
        knowledge entry that cites it and with every run manifest it cites.
      evidence_records: [EV-BKK-001, EV-BKKMV-001, EV-BKKMV-002, EV-EQJ-001,
        EV-FB-001, EV-NCP-001, EV-REP-002, EV-SIG-002, EV-SIG-003, EV-SIG-004,
        EV-SIG-005]
      knowledge_entries: [KN-FIND-017, KN-FIND-018, KN-FIND-019, KN-FIND-020,
        KN-FIND-021, KN-FIND-022, KN-FIND-023, KN-FIND-024, KN-FIND-025,
        KN-FIND-026, KN-FIND-027]
      pairing_rule: >-
        The pairing is taken from each knowledge entry's own internal_refs,
        NOT assumed from the numeric order. If any entry's internal_refs do not
        name exactly one of the eleven evidence records, that is reported as an
        unpaired chain rather than resolved by the auditor.
    corpus_census_glob: >-
      experiments/**/manifest.yaml and experiments/**/manifest.yml, recursive,
      from the repository root. THE GLOB IS PART OF THE RESULT: every census
      number is reported as a property of this glob and of no other, and the
      file count it returns is reported beside it.
    synthetic_record_root: >-
      A scratch directory outside ledger/ and experiments/, created for the run
      and never committed. All synthetic records for stages 1 live there. NO
      SYNTHETIC RECORD MAY BE WRITTEN UNDER ledger/ OR experiments/ UNDER ANY
      CIRCUMSTANCE; a synthetic record in the ledger would be a fabricated
      research record.
    seeds:
      master_seed: 52472013
      seed_derivation_rule: >-
        No stochastic step exists in this contract -- every stage is a
        deterministic traversal or a deterministic construction -- so the
        master seed is recorded only to name the synthetic records
        reproducibly. Synthetic record k in stage 1 takes id
        SYNTH-B9AFB9-<k:03d> and, where a numeric field is needed and not
        specified by the design, the value
        (master_seed * 1103515245 + 12345 + k) mod 2^31. A third party
        reproduces the synthetic set bit-for-bit from this rule and the
        parameter table below; no other randomness enters.
    frozen_thresholds:
      tier_order: {toy: 0, medium: 1, crypto: 2}
      tier_of_run_breaks: [32, 96]
      graded_sweep_field_bits: [10, 32, 33, 64, 96, 97, 256]
      derivation_rule: >-
        field_bits := ceil(log2(max prime recorded)), applied ONLY where the
        owning experiment specification permits the parameter key's meaning to
        be quoted. Every run where it cannot is reported UNDERIVABLE.
      adjudication_rubric_hash: >-
        Computed and recorded at stage 0, BEFORE any KN-FIND prose is read for
        adjudication. The rubric text is frozen at that point and any later
        change requires a versioned protocol amendment, never an edit.

  arms_and_controls:
    treatment: >-
      The eleven real chains: traverse KN-FIND -> EV -> RUN, record for each
      link whether a tier is declared and machine-readable, evaluate whether
      the committed validator's ceiling conditional would fire, reconstruct the
      ceiling from the recorded parameters, and adjudicate the prose boundary
      against it.
    measured_null: >-
      NULL-1, a synthetic chain of identical shape in which every link is
      well-formed: one knowledge entry declaring claim_tier 'toy', one evidence
      record declaring claim_tier 'toy', four run manifests carrying
      field_bits 10 at run.inputs.parameters. FORCED VALUES DERIVED BEFORE THE
      RUN: the traversal must report enforceable_ceiling = True, reconstructed
      ceiling 'toy', boundary violations 0, and the validator must emit zero
      ceiling errors (0 <= 0). THIS NULL CAN FAIL: a traversal with an
      inverted comparison, an off-by-one in the tier lookup, or a path bug
      would report a violation on a chain built to have none, and every corpus
      number from that traversal would then be void.
    positive_control: >-
      POS-1, the differential pair, and the single most important arm in the
      contract. Two synthetic record sets identical in every byte except the
      key path of one dict: an evidence record with claim_tier 'crypto' citing
      one run manifest whose parameters are {field_bits: 10}, with those
      parameters written at run.inputs.parameters in arm A and at
      run.parameters in arm B. FORCED VALUES DERIVED BEFORE THE RUN from the
      code read: arm A emits exactly one error whose text matches
      "claim_tier 'crypto' exceeds what its runs' parameters allow"; arm B
      emits exactly zero. IF ARM A DOES NOT FIRE THE INSTRUMENT IS BROKEN AND
      NO RESULT FROM THIS CONTRACT MAY BE REPORTED AT ALL, negative or
      otherwise. IF ARM B FIRES, tier_of_run already reads the top-level path,
      sub-claim S3 of H-FIND-52472d is false, and the run terminates with that
      finding.
    nearby_object_control: >-
      POS-2, required and not optional. Run the identical chain traversal over
      a sample of at least 15 REAL chains drawn from the population where the
      ceiling is known to be evaluable -- evidence records under
      ledger/evidence/ carrying an in-vocabulary claim_tier and citing runs
      that carry field_bits at run.inputs.parameters. FORCED: the traversal
      reports enforceable_ceiling = True for all of them. A traversal that
      reports "unenforceable" everywhere has a bug and has not identified the
      load-bearing feature; no count from it may be reported. The sample is
      drawn by record id ascending, not by convenience.
    graded_control: >-
      GRAD-1, seven interior points with TWO BREAKPOINTS FORCED FROM THE CODE.
      Hold the declared tier fixed and sweep field_bits over
      [10, 32, 33, 64, 96, 97, 256] at run.inputs.parameters.
      For declared 'medium' the ceiling fires iff 1 > tier_of_run, i.e. iff
      field_bits <= 32: FORCED pattern
      [fire, fire, silent, silent, silent, silent, silent].
      For declared 'crypto' it fires iff field_bits <= 96: FORCED pattern
      [fire, fire, fire, fire, fire, silent, silent].
      Both sequences must be monotone non-increasing in field_bits, with
      breakpoints at exactly 32|33 and 96|97. A breakpoint elsewhere, or any
      non-monotonicity, localises a defect in tier_of_run itself rather than in
      the corpus -- a larger finding than the one under test, and one that must
      be reported rather than smoothed over.
    ordering_control: >-
      The synthetic arms (NULL-1, POS-1, POS-2, GRAD-1) are executed and their
      verdicts written to the run directory BEFORE any of the eleven real
      chains is traversed. The traversal script is hashed and the hash recorded
      before the first real chain is read. This forecloses tuning the traversal
      until the corpus yields a striking number.
    adjudication_control: >-
      The prose-boundary comparison in stage 3 is the only subjective step.
      Its rubric is frozen and hashed in stage 0; two independent readers score
      all eleven; disagreements are REPORTED, not resolved by the author; the
      inter-reader disagreement count is a primary metric. If the readers
      disagree on more than 2 of 11, the rubric is declared unfit and NO
      boundary verdict is issued for any entry.
    comparability_policy: >-
      Synthetic and real chains are compared only on the structural quantities
      the traversal computes (link typing, enforceability, reconstructed tier),
      never on content. The synthetic arms exist to characterise the
      instrument, not to stand in for corpus data, and no synthetic number
      appears in any aggregate over the real population.

  stages:
    order: cheapest-first, and each stage names whether it can terminate the run
    stage_0:
      name: reading and freezing
      cost: about one hour, zero compute, zero network
      actions:
      - record `git rev-parse HEAD`; re-read tools/validate_ledger.py and
        re-locate TIER_ORDER, the run_params cache, tier_of_run and the ceiling
        conditional, recording the line numbers found rather than those in the
        hypothesis
      - read DEC-20260725-024 and EV-FIND-003 and record the intended reading
        of "no stronger than cited EV/DEC scope"; if it is not the
        instance-size reading, rescope and say so before proceeding
      - read knowledge/README.md and docs/claims-and-verification.md and record
        whether either specifies a machine-readable tier field for knowledge
        entries
      - ARCHIVE CHECK, mandatory. Search ledger/, experiments/, knowledge/,
        docs/ and coordination/ for any prior record of the
        inputs.parameters-versus-parameters mismatch. If one exists this
        contract is a rediscovery, must cite it, and its novelty claim is
        withdrawn
      - freeze and hash the adjudication rubric and the traversal script
      can_terminate: >-
        YES. If a fallback already exists in tier_of_run, or a prior record
        already states the defect, the run stops here and reports that.
    stage_1:
      name: instrument characterisation
      cost: seconds
      actions: [POS-1 differential pair, NULL-1, POS-2 nearby-object sample, GRAD-1 sweeps]
      can_terminate: >-
        YES, and this is the contract's decisive cheap gate. POS-1 arm A not
        firing, or arm B firing, ends the run. NULL-1 failing ends the run.
        POS-2 failing ends the run.
    stage_2:
      name: chain traversal and census
      cost: seconds of compute, minutes of setup
      actions:
      - traverse the eleven chains and emit the per-chain table
      - reproduce the corpus-wide manifest layout census under the published
        glob, reporting the file count returned
      - read tools/validate_ledger_baseline.txt and report whether any ceiling
        error for the audited set is grandfathered there (a suppressed error is
        externally indistinguishable from an error never raised, and this is
        the only way to tell)
      can_terminate: NO
    stage_3:
      name: reconstruction and adjudication
      cost: minutes of compute, about two hours of reading
      actions:
      - derive field_bits per run where the parameter key's meaning can be
        quoted from the owning specification; list every underivable run
      - emit the derived tier-certificate register as a NEW file
      - two-reader adjudication of the eleven prose boundaries against the
        reconstructed ceilings under the frozen rubric
      can_terminate: NO

  metrics:
    primary:
    - name: n_chains_with_enforceable_ceiling
      definition: >-
        Of the eleven, the number for which the committed validator, unmodified,
        actually evaluates the ceiling -- i.e. TIER_ORDER.get(claim_tier) is not
        None AND at least one cited run yields a non-None tier_of_run.
      preregistered_value: 0
    - name: n_runs_invisible_to_tier_of_run
      definition: >-
        Of the 60 cited run manifests, the number for which
        (run.inputs or {}).get('parameters') is empty or absent.
      preregistered_value: 60
    - name: differential_error_counts
      definition: POS-1 arm A error count and arm B error count.
      preregistered_value: {arm_A: 1, arm_B: 0}
    - name: n_promoted_boundaries_above_ceiling
      definition: >-
        Of the eleven, the number whose "## Scoped claim" prose asserts a scope
        strictly above its chain's reconstructed ceiling, under the frozen
        rubric and with two readers agreeing.
      preregistered_value: 0
    secondary:
    - reconstructed_ceiling per chain, with the derivation rule and the quoted
      parameter key for each contributing run
    - n_runs_underivable, with each named and the reason stated
    - graded sweep outcomes and observed breakpoints for both declared tiers
    - POS-2 enforceable_ceiling rate over the >=15 well-formed sample
    - inter_reader_disagreement_count on the boundary adjudication
    - corpus layout census -- counts of top-level-only, inputs-only, both,
      and neither, with the glob and its file count
    - whether any audited-set ceiling error appears in validate_ledger_baseline.txt
    - the four re-located line numbers in validate_ledger.py at the executing commit

  preregistered_prediction:
    quantity: n_chains_with_enforceable_ceiling
    formula: >-
      count over i in 1..11 of [ TIER_ORDER.get(EV_i.claim_tier) is not None
      AND exists r in runs(EV_i) with tier_of_run(r.inputs.parameters) is not
      None ]
    value: 0
    source: >-
      Derived from tools/validate_ledger.py lines read on 2026-08-05 (TIER_ORDER
      ~191, run_params cache ~409, tier_of_run ~412-447, ceiling ~501-507)
      together with the measured facts that ten of eleven evidence records carry
      no claim_tier key and that all 60 cited manifests place parameters at
      run.parameters. Recorded in H-FIND-52472d before any authorised execution.
    second_forced_value:
      quantity: reconstructed_ceiling(EV-BKK-001 chain)
      value: toy
      derivation: >-
        RUN-BKK-001-a records p = [101, 431, 1009]; tier_of_run's own
        largest-cell rule gives field_bits = ceil(log2 1009) = 10 since
        2^9 = 512 < 1009 <= 1024 = 2^10; 10 <= 32 maps to TIER_ORDER['toy'] = 0.

  replication:
    planned_runs: 1
    seeds: [52472013]
    interpretation: >-
      Every stage is a deterministic function of committed files at a named
      commit; there is no stochastic quantity and replication across seeds
      would measure nothing. What replication means here is INDEPENDENT
      RE-EXECUTION AT THE SAME COMMIT BY A DIFFERENT AGENT, which is what the
      published glob, the frozen thresholds, the seed derivation rule and the
      hashed traversal script exist to make possible. A second run at a
      different commit is a different measurement and must be reported as one.

  budget:
    maximum_runs: 1
    maximum_wall_seconds: 5400
    maximum_cpu_seconds: 3600
    maximum_peak_rss_bytes: 2147483648
    maximum_total_disk_bytes: 268435456
    maximum_workers: 1
    no_network: true
    dependencies: >-
      Python 3 with PyYAML only. VERIFIED IN THIS SESSION on this container:
      `import yaml` succeeds; `import numpy` succeeds (2.4.6); `import sage`
      FAILS (No module named 'sage'), so src/ic_first_fall_fast.py does not
      import. This contract needs none of the failing ones. Recording the check
      resolves, for this container, the environment disagreement the session
      ANGLE-BRIEF flagged as unadjudicated: numpy is present, Sage is not.

  stopping_rules:
  - Stop at stage 0 if a fallback already exists in tier_of_run, or if the
    archive check finds a prior record of the same defect. Report and stop.
  - Stop at stage 1 if POS-1 arm A emits no ceiling error. The instrument is
    broken; nothing may be reported.
  - Stop at stage 1 if POS-1 arm B emits a ceiling error. S3 is false; report
    that and stop.
  - Stop at stage 1 if NULL-1 reports any boundary violation, or if POS-2's
    enforceable rate is below 15 of 15. The traversal is unsound.
  - Stop at stage 3 and issue no boundary verdict if inter-reader disagreement
    exceeds 2 of 11.
  - Stop on reaching any budget ceiling and report partial results labelled as
    partial.

  invalidation_rules:
  - Any synthetic record written under ledger/ or experiments/ invalidates the
    entire run without exception.
  - Any modification to an existing file invalidates the entire run. The only
    permitted write is the new derived-certificate register plus the run's own
    artifacts.
  - A graded breakpoint anywhere other than 32|33 and 96|97, or a non-monotone
    sweep, invalidates the threshold reading and every number that depends on
    it.
  - Reporting a corpus census without its glob and file count invalidates that
    census.
  - Deriving field_bits from a parameter key whose meaning could not be quoted
    from the owning specification invalidates that derivation; the run must
    mark it UNDERIVABLE instead.
  - Any adjudication performed before the rubric hash was recorded invalidates
    the adjudication.

  success_criterion: >-
    The run SUCCEEDS if, and only if: (a) POS-1 produces its forced 1-versus-0
    split with the parameter dict bit-identical across arms; (b) NULL-1 and
    POS-2 both pass; (c) GRAD-1 reproduces both forced breakpoints monotonically;
    and (d) the eleven-chain table is emitted with every cell populated or
    explicitly marked unavailable, together with the derived register naming
    every underivable run. Note carefully: success is defined by the
    INSTRUMENT BEHAVING AS DERIVED AND THE TABLE BEING COMPLETE, not by the
    corpus numbers coming out any particular way. A run in which
    n_chains_with_enforceable_ceiling turns out to be 11 -- refuting the
    hypothesis outright -- still SUCCEEDS as an experiment, and that is the
    intended design.

  falsification_criterion: >-
    H-FIND-52472d is falsified if any of: n_chains_with_enforceable_ceiling
    >= 1; POS-1 arm B emits a ceiling error; n_runs_invisible_to_tier_of_run
    < 60; the reconstructed ceiling for the EV-BKK-001 chain is not 'toy'; or
    the archive check finds the defect already recorded (in which case the
    novelty claim, not the mechanism, is what falls). Separately and
    independently, the AUXILIARY prediction n_promoted_boundaries_above_ceiling
    = 0 is falsified by any value >= 1 -- and that falsification would be the
    most consequential outcome available here, since it would mean a committed
    KN-FIND entry overstates its evidence and GOAL-FIND-001's completion
    criterion is not met.

  infrastructure_failure_disposition: >-
    A crash, a timeout, a missing dependency, an unreadable file, a YAML parse
    error in a record this contract merely reads, or a git operation failure is
    INFRASTRUCTURE SIGNAL AND IS NEVER NEGATIVE MATHEMATICAL EVIDENCE
    (AGENTS.md rule 3) -- and in this contract it is never negative EVIDENCE OF
    ANY KIND, since the contract's subject is verification plumbing and a
    plumbing failure during the audit would be trivially confusable with the
    finding. Concretely: if the traversal crashes on a malformed manifest, that
    manifest is reported as UNREADABLE in its own column and is NOT counted as
    "invisible to tier_of_run", because those are different facts with
    different causes. An infra_failure_receipt is written naming the failing
    component, the command, and what remains unmeasured.

  scale_relevance:
    tier: toy
    transfer_argument: >-
      There is no scale dimension to transfer along: the population is eleven
      chains and 60 manifests, enumerated exhaustively rather than sampled, so
      the result is exact for its population and carries no extrapolation. The
      corpus-wide census IS a larger population, and it is reported as a count
      under a published glob rather than as a rate, precisely so that no
      inference to "the repository" is invited. What does generalise, and only
      as a hypothesis for other goals to test on their own records, is the
      MECHANISM: a checker that fails open leaves a silence indistinguishable
      from a pass, and any goal whose completion criterion is enforced by such a
      checker should run this same traversal over its own chains.

  required_artifacts:
  - run manifest recording the executing commit sha, the re-located line
    numbers, and the resolved environment (python version, PyYAML version,
    numpy present/absent, sage present/absent)
  - the frozen adjudication rubric text and its hash, with the timestamp it was
    frozen at, demonstrably before the first adjudication read
  - the hashed traversal script, verbatim
  - POS-1 arm A and arm B validator outputs, verbatim, with the two synthetic
    record sets included so a third party can confirm they differ only in the
    key path
  - NULL-1, POS-2 and GRAD-1 outputs with their forced values stated beside the
    observed ones
  - the eleven-row chain table
  - the corpus layout census with its glob and file count
  - the derived tier-certificate register as a new file, with per-run
    derivation rule, quoted parameter key, and an explicit list of underivable
    runs
  - the two-reader adjudication sheets and the disagreement count
  - stage-0 archive-check result, including the search terms used, whether or
    not anything was found
  - an infra_failure_receipt if any stage failed for infrastructure reasons

  approval_requirements:
  - Coordinator approval is required before execution. This contract carries no
    approved_by field and must not acquire one except by Coordinator action.
  - The Coordinator should note that stage 0 includes reading two committed
    decision records (DEC-20260725-024, EV-FIND-003) to fix the intended
    reading of the criterion, and may wish to supply that reading directly
    instead, which would shorten stage 0 and remove an interpretive step.
  - The Coordinator should decide, separately and not as part of this contract,
    whether the derived register is to be filed as a knowledge entry, a
    correction, or a coordination artifact. This contract produces the content
    and takes no position on its filing.

  approval_status: >-
    NOT APPROVED. status is review_required, frozen is false,
    execution_authorized is false, evidence_eligible is false. No run has
    happened and nothing in this file is evidence.
