# EXP-ECDLP-047c8e
# Four binomial variances and one expanded second moment. No walk.
# Approved by DEC-20261001-152a19.
experiment:
  id: EXP-ECDLP-047c8e
  hypothesis_id: H-ECDLP-fadd65
  source_idea: IDEA-20260923-5d07e3
  question_id: RQ-ECDLP-78dbc5
  version: 1
  title: Binomial in-degree variance at four values of r
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-152a19
  objective: >-
    Compute r*(1/r)*(1-1/r) for r in {2, 3, 4, 16}. Expand the r = 2
    second moment from the four binomial probabilities. Reject variance 1
    at r = 2.
  inputs:
    r_values: [2, 3, 4, 16]
    predicted:
      - {r: 2, variance: "1/2", gap: "1/2"}
      - {r: 3, variance: "2/3", gap: "1/3"}
      - {r: 4, variance: "3/4", gap: "1/4"}
      - {r: 16, variance: "15/16", gap: "1/16", stored_factor: "16/15"}
    r2_probabilities: {k0: "1/4", k1: "1/2", k2: "1/4"}
  controls:
    - Variance exactly 1 at r = 2 is false. Reporting it true invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - r
    - route in {closed_form, expanded_moment}
  metrics:
    primary:
      - variance_by_r
      - gap_by_r
      - r2_expanded_variance
      - stored_factor_r16
      - poisson_claim_rejected
      - implementations_agree
    secondary:
      - mean_by_r
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Four variances, four gaps, one expanded moment, and one stored factor.
    formula: variance = r * (1/r) * (1 - 1/r) = (r-1)/r. gap = 1/r.
    source: >-
      IDEA-20260923-5d07e3 title sentence, read 2026-10-01. The fractions
      were reduced by hand in this design session. That reduction is not a
      run. No walk was simulated.
  scale_relevance:
    tier: toy
    justification: Four integers. No group and no transfer to a measured walk.
    correspondence: null
  tail_checks:
    - r = 16 is included. Stopping at r = 4 and still reporting 15/16 is invalid.
  replication:
    seeds: []
    independent_instances: 4
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If variance 1 is accepted at r = 2, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - poisson_claim_rejected is false.
    - A simulated walk or a discrete logarithm is reported.
  success_criterion: >-
    Both runs agree, the four variances are 1/2, 2/3, 3/4, and 15/16, the
    gaps are 1/r, the expanded r = 2 moment is 1/2, the stored factor at
    r = 16 is 16/15, and variance 1 at r = 2 is rejected.
  falsification_criterion: >-
    The runs agree, variance 1 at r = 2 is rejected, and any variance, gap,
    expanded moment, or stored factor differs from the preregistered rational.
  required_artifacts:
    - experiments/EXP-ECDLP-047c8e/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-047c8e/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-047c8e/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-047c8e/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-047c8e/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-047c8e/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Walk simulation and stored-experiment reinterpretation.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
