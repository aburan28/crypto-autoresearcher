experiment:
  id: EXP-TORS-c2bf13
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-146aa8
  question_id: RQ-TORS-8c7b79
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE THREE-REGIME SCREEN FOR "ELL-TORSION LEAKS k": exactly three regimes exist at ell !=
    N -- (i) the base point has composite order with an ell-part, which is Pohlig-Hellman and is a
    change of INSTANCE not of ALGORITHM; (ii) the adversary can make the secret act on attacker-chosen
    points outside G, which is the invalid-curve / small-subgroup family and needs an oracle the plain
    ECDLP does not provide; (iii) the pure prime-order instance, where nothing leaks by the coprimality
    theorem -- and every future L7 proposal must declare its regime before it is dispatched'
  status: draft
  objective: "(A) THE TAXONOMY, EXHAUSTIVE OVER THE WAY ell-TORSION CAN TOUCH k. Fix a prime ell !=\
    \ N. There are exactly three ways ell-torsion data can be connected to the secret scalar, and\
    \ they are distinguished by ONE question: what does the secret get applied to?\n  REGIME (i) --\
    \ THE SECRET IS APPLIED TO A POINT WHOSE ORDER IS DIVISIBLE BY\n    ell. This happens when the\
    \ base point is not of prime order, e.g. a\n    generator of the full group E(F_p) of order h*N\
    \ with ell | h. Then the\n    projection to the ell-part recovers the secret modulo ell, and CRT\n\
    \    recombination across the prime factors of the order is Pohlig-Hellman\n    (KN-TECH-030).\
    \ THIS IS NOT NOVEL AND THIS RECORD DOES NOT PRESENT IT AS\n    SUCH. It is also, importantly,\
    \ NOT AN ALGORITHM IMPROVEMENT: it changes what\n    \"the instance\" is, and KN-TECH-030's own\
    \ framing is that Pohlig-Hellman\n    fixes the effective problem size rather than beating rho.\
    \ A proposal that\n    arrives at \"k mod ell is recoverable from the cofactor's ell-part\" has\n\
    \    arrived at regime (i) and has rediscovered Pohlig-Hellman; the correct\n    disposition is\
    \ to say so and stop.\n  REGIME (ii) -- THE SECRET IS APPLIED TO AN ATTACKER-CHOSEN POINT OUTSIDE\
    \ G.\n    This requires an ORACLE that computes [k]R for an R the adversary supplies.\n    Given\
    \ such an oracle, ell-torsion at ell != N leaks k modulo ell in two\n    classical ways: the small-subgroup\
    \ confinement attack (Lim-Lee, KN-LIT-091\n    as recorded in KN-TECH-034) supplies a low-order\
    \ element of the same curve;\n    the invalid-curve attack (Biehl-Meyer-Muller, KN-LIT-092; and\
    \ the protocol\n    variants of KN-LIT-7441 combining both ideas) supplies a point on a\n    DIFFERENT\
    \ curve E'' sharing the a-coefficient, whose order is smooth, so the\n    device's arithmetic\
    \ silently computes in E''(F_p) and leaks k modulo the\n    small factors. THESE ARE REAL AND\
    \ DEPLOYED-RELEVANT AND THEY ARE THE ONLY\n    PLACE WHERE ell-TORSION AT ell != N DEMONSTRABLY\
    \ LEAKS k. They are also\n    outside the plain ECDLP model: KN-TECH-034 draws exactly this line\
    \ -- \"these\n    attacks require an oracle, chosen inputs, a static reused secret, or fault\n\
    \    injection; the program's target is the plain ECDLP: given E, P, Q, find k,\n    with no interaction.\"\
    \n  REGIME (iii) -- THE PURE INSTANCE: (E, P, Q) with P of prime order N and no\n    oracle. Then\
    \ nothing leaks, and this is not an empirical observation but a\n    theorem: IDEA-20260807-6eab6a\
    \ shows every homomorphic ell-primary invariant\n    vanishes identically on G, and IDEA-20260807-df906f\
    \ shows every exactly\n    propagating lossy projection on a prime-order group is injective or\n\
    \    constant. The two together cover the homomorphic and the\n    exactly-propagating-lossy families\
    \ respectively.\nEXHAUSTIVENESS ARGUMENT, which is what makes this a taxonomy rather than a list:\
    \ for ell-torsion data to depend on k at all, k must have acted on something. In the ECDLP setting\
    \ k acts only on P and only through the given Q = [k]P. So either (a) the thing k acted on has\
    \ ell in its order -- regime (i) -- or (b) the adversary can cause k to act on something else\
    \ -- regime (ii) -- or (c) neither, which is regime (iii). There is no fourth branch, and the\
    \ branch condition is decidable by inspection of the proposal.\n(B) THE CIRCULARITY GATE, WHICH\
    \ IS THE OPERATIONAL DELIVERABLE. Every future L7 proposal (and, this record argues, every proposal\
    \ in this campaign that claims ANY k-dependence) must declare, before dispatch:\n  D1 -- its REGIME,\
    \ one of (i), (ii), (iii).\n  D2 -- if (i): an explicit statement that this is Pohlig-Hellman,\
    \ a citation of\n    KN-TECH-030, and the resulting EFFECTIVE problem size, since the honest\n\
    \    headline is a change of instance.\n  D3 -- if (ii): the exact oracle assumed, its query model,\
    \ and an explicit\n    acknowledgement that the result lives in the leakage/chosen-input model\
    \ and\n    is not a mathematical advance on the ECDLP (KN-TECH-034's scope boundary,\n    the\
    \ same line KN-OPEN-011 draws for the Hidden Number Problem).\n  D4 -- if (iii): the specific\
    \ reason the coprimality theorem and the rigidity\n    theorem do not apply -- i.e. the proposal\
    \ must name which of the four\n    escapes (probabilistic propagation, auxiliary state, objects\
    \ on E[ell]\n    rather than on G, objects not tracked under the group law) it is using.\n  D5\
    \ -- A CIRCULARITY CHECK: does any step of the proposed computation require\n    knowing k, or\
    \ a discrete logarithm, or an eigenvalue obtainable only by\n    solving one? H-ENDO-001's assumption\
    \ list already excludes \"any phi whose\n    eigenvalue could only be obtained by solving a discrete\
    \ logarithm... the\n    exclusion is stated because it is exactly where circularity would otherwise\n\
    \    enter.\" D5 generalises that exclusion to every L7 mechanism.\nA PROPOSAL THAT CANNOT FILL\
    \ D1-D5 IS NOT REJECTED ON MERIT; IT IS RETURNED FOR COMPLETION. That distinction matters, because\
    \ docs/inventor-protocol.md forbids declining to generate on saturation grounds, and this gate\
    \ is a completeness requirement rather than a saturation argument.\n(C) THE TWO OUTCOMES OF APPLYING\
    \ THE SCREEN, BOTH DELIVERABLES.\n  OUTCOME 1 -- every existing and future L7 mechanism classifies\
    \ into (i), (ii)\n    or (iii) with the classification agreed by an independent reviewer. Then\
    \ the\n    taxonomy is a working screen, the lane has a cheap disposition rule, and the\n    exhaustiveness\
    \ argument in (A) is corroborated by use.\n  OUTCOME 2 -- some mechanism resists classification.\
    \ Then the exhaustiveness\n    argument is wrong, there is a fourth way ell-torsion can touch\
    \ k, and\n    finding it would be the single most valuable result this lane could produce.\n \
    \   This is the branch that makes the record falsifiable rather than definitional,\n    and it\
    \ is why the screen is proposed as a testable artifact and not as a\n    rule."
  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: 'ADMISSIBLE as an audit. It consumes no non-generic resource and mounts
    no attack. Its function is to classify OTHER proposals'' resource use, which makes it a companion
    to the DECOMPOSITION.md section 2 admissibility filter rather than a competitor: the filter asks
    "which resource does this consume?" and this screen asks "in which regime does the claimed k-dependence
    live?". A proposal can pass the resource filter (its resource genuinely escapes the generic group
    model) and still be in regime (ii) and therefore outside the plain ECDLP -- that combination is
    exactly what an unscreened batch produces, and it is what this record exists to catch.'
  reachability_gate: 'NOT APPLICABLE, and stated rather than omitted. The screen moves between no
    curves. One relevant note for lanes that do: the regime label is preserved by transport, because
    transport is injective on G (IDEA-20260807-053a55) and therefore does not change what k acted
    on. A proposal that transports an instance and then claims a different regime on the target curve
    has made an error, and the composition rule in object_first_candidate.propagation catches it.'
  inputs:
    procedure: 'STAGE 0 (zero compute, the primary deliverable): the taxonomy, the exhaustiveness
      argument, the composition rule, and the D1-D5 block. STAGE 1 (zero compute): retrospective classification
      of all nine L7 proposals in BATCH-cb71b5, with an independent reviewer concurring. Any unclassifiable
      proposal fires OUTCOME 2. STAGE 2 (minutes): the three demonstrations 3a, 3b, 3c on ONE curve
      at ONE ell, under the redacted-instance guard, with the frozen regime-(i) fixture. STAGE 3 (zero
      compute): forward guidance -- regime (iii)''s four escapes and the ell = N boundary. BUDGET:
      minutes of compute. No division polynomials are needed -- ell-torsion points are found by multiplying
      random points by #E/ell -- so this proposal carries no ell <= 13 polynomial-degree constraint,
      only the requirement that ell divide the cofactor of a generated toy curve.'
    mechanism: "STEP 1 (zero compute) -- write the taxonomy and the exhaustiveness argument in the\
      \ form of (A), with each regime's citation and each regime's honest headline.\nSTEP 2 (zero\
      \ compute) -- write the D1-D5 declaration block as a YAML fragment for inclusion in proposal\
      \ records, and apply it retrospectively to every L7 proposal in BATCH-cb71b5 as a worked classification.\
      \ That retrospective pass IS the record's first test: if any of this batch's nine proposals\
      \ cannot be classified, OUTCOME 2 has fired inside the batch that proposed the screen.\nSTEP\
      \ 3 (small compute, and the only compute in this proposal) -- a KNOWN-ANSWER DEMONSTRATION of\
      \ each regime at toy scale, so the taxonomy is exhibited rather than asserted:\n  3a. REGIME\
      \ (i) demonstration: on a toy curve with #E(F_p) = h*N and a small\n    prime ell | h, take\
      \ a generator of the full group, form the analogue\n    instance, and recover the secret modulo\
      \ ell by projecting onto the ell-part.\n    Verify against ground truth. Label the output \"\
      Pohlig-Hellman,\n    KN-TECH-030\" in the artifact itself.\n  3b. REGIME (ii) demonstration,\
      \ RUN ONLY AS A SIMULATED ORACLE ON THIS\n    PROGRAM'S OWN TOY INSTANCES AND NEVER AGAINST\
      \ ANY EXTERNAL SYSTEM: implement\n    a deliberately non-validating scalar-multiplication routine,\
      \ feed it a point\n    of small order ell on a different curve sharing the a-coefficient, and\n\
      \    confirm that the returned value determines k modulo ell. This is a\n    reproduction of\
      \ a published attack (KN-LIT-092 / KN-LIT-091 as recorded in\n    KN-TECH-034) on a self-generated\
      \ toy target, is lawful defensive\n    cryptanalysis under RQ-TORS-8c7b79's constraints, and\
      \ exists to fix the\n    regime boundary empirically -- it demonstrates that the leak is real\
      \ and\n    that it requires the oracle, which is the whole point.\n  3c. REGIME (iii) demonstration:\
      \ the same ell, the same curve, the PRIME-ORDER\n    base point, no oracle -- and the coprimality\
      \ corollaries return their forced\n    values (0 and 1), confirming no leak. Cross-referenced\
      \ to\n    IDEA-20260807-6eab6a's STAGE 1.\nTHE THREE DEMONSTRATIONS TOGETHER ARE THE INSTRUMENT'S\
      \ DYNAMIC RANGE: a leak that is present (3a, 3b) and a leak that is absent (3c), on the same\
      \ curve, at the same ell, differing only in the regime condition. That is the graded control\
      \ KN-TECH-1a5b7e's obligation 3 demands, realised as a three-point ladder rather than a two-end\
      \ gate.\nSTEP 4 (zero compute) -- forward guidance: name what remains open after the screen.\
      \ Regime (iii)'s four escapes (from IDEA-20260807-df906f claim C), and the boundary case ell\
      \ = N which no regime covers because the taxonomy is stated for ell != N -- at ell = N the relevant\
      \ families are pairing transfers (KN-TECH-032) and, in the single coincidence ell = N = p, the\
      \ anomalous break (KN-TECH-033)."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - regime (iii) as the matched null on the same curve and the same ell (blocking)
  - frozen Pohlig-Hellman fixture with exact residue comparison (blocking)
  - redacted-instance guard on every demonstration, per IDEA-20260807-bd5d91 G3 (blocking)
  - anomalous boundary exhibited (ell = N = p) as the method-ceiling control
  - independent reviewer concurrence on every regime label
  - 'NULL OBJECT (from the proposal): MANDATORY AND SUPPLIED, as a three-point dynamic range on ONE
    curve at ONE ell, which is what makes the taxonomy an instrument rather than a definition. MATCHED
    NULL OBJECT: demonstration 3c -- the same curve, the same ell, the same torsion computation, differing
    from 3a ONLY in that the base point has prime order, and from 3b ONLY in that no oracle is available.
    The null therefore removes exactly one thing (the regime condition) and preserves everything else:
    the curve, the field, the prime ell, the torsion structure, and the entire computation. KN-TECH-1a5b7e''s
    `object_preserved` line is the one that matters here and it is long. DECAY PARAMETER: the ell-valuation
    of the order of the point the secret acts on. As v_ell(ord(point)) falls from >= 1 to 0, the recovered
    information about k modulo ell must fall from complete to nil. A recovered value that persists
    at v_ell = 0 is the canonical artifact tell and would mean the demonstration is leaking k through
    the harness rather than through the mathematics -- exactly the circularity D5 guards against,
    which is why the demonstrations must run under the redacted-instance guard of IDEA-20260807-bd5d91''s
    G3. CAN THIS NULL FAIL? YES: 3c could return a non-trivial value, which would contradict the coprimality
    theorem and halt everything; or 3a/3b could fail to recover k modulo ell, which would mean the
    demonstrations are not exhibiting the regimes they claim.'
  independent_variables: []
  metrics:
    primary:
    - recovered residue versus ground truth per regime demonstration
    - effective problem size reported per KN-TECH-030 obligation 1
    - forced values (0, 1) in regime (iii)
    - regime label per proposal, with reviewer concurrence flag
    secondary:
    - list of any proposal that could not be classified
  heuristic_under_test: null
  preregistered_prediction:
    quantity: 'Regime (i) demonstration: recovered k modulo ell on a curve with ell | h, using a full-group
      generator'
    formula: Exact match with ground truth on 100 percent of cells, and the reported effective problem
      size equal to sqrt(N) rather than sqrt(h*N). BASIS - KN-TECH-030, used as a KNOWN-ANSWER CALIBRATION;
      this campaign has not previously run it.
    source: pre-registered in IDEA-20260807-146aa8 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - Harness leakage. The toy harness stores k in ECDLPInstance; a demonstration that reads it would
    "recover" k in every regime. The redacted-instance guard is mandatory and blocking, and its absence
    is the single most likely way these demonstrations produce a false regime-(iii) leak.
  - Cofactor availability at toy scale. Regime (i) and (ii) demonstrations need a curve with a small
    prime in the cofactor; harness/toycurve.py selects the LARGEST prime factor as N and does not
    guarantee a usable ell in h. Curve selection for these demonstrations must be explicit and recorded,
    or the demonstrations will silently be run on unsuitable curves.
  - Label coarseness. Regime (ii) covers a wide range of oracle strengths, from a single chosen input
    to a static reused secret with fault injection. D3 carries that detail and the label alone must
    not be used for dispatch decisions -- the observation-collision audit above records exactly this
    limitation.
  - Scope creep into regime (ii) by assumption. Any proposal may make itself "work" by assuming an
    oracle. D3's requirement to state the oracle explicitly is the guard, and a reviewer must check
    that the oracle is not smuggled in as a modelling convenience.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Exact match with ground truth on 100 percent of cells, and the reported effective
    problem size equal to sqrt(N) rather than sqrt(h*N). BASIS - KN-TECH-030, used as a KNOWN-ANSWER
    CALIBRATION; this campaign has not previously run it.
  falsification_criterion:
  - A mechanism is exhibited that depends on k, uses ell-torsion at ell != N, and fits none of the
    three regimes. The exhaustiveness argument is FALSE, the taxonomy is withdrawn, and the mechanism
    becomes the lane's primary object of study. This is the outcome that would most justify the record's
    existence.
  - Regime (iii) demonstration returns a non-forced value. Contradicts IDEA-20260807-6eab6a; treat
    as a suspected implementation error and replicate independently before reporting.
  - Regime (i) demonstration fails to recover the residue. Pohlig-Hellman is textbook; a failure is
    an implementation error and blocks the fixture.
  - Regime (ii) demonstration recovers k WITHOUT the oracle. The regime boundary is wrong -- either
    the harness leaks or the attack does not need what KN-TECH-034 says it needs -- and either way
    the taxonomy is unusable until resolved.
  - Two independent reviewers assign different regime labels to the same proposal. The labels are
    not decidable by inspection, and D1-D5 must be sharpened before the gate is adopted.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-146aa8
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
    than absent so a reader cannot mistake it for an overlooked one.'
