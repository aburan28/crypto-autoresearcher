experiment:
  id: EXP-SLHDSA-640dd9
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-9f5bd3; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-9f5bd3
  question_id: RQ-SLHDSA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exhaustively enumerate the FORS revealed-index state space at toy (a, k), compare the exact
    reuse curve against the analytic occupancy law and its leaf-collision refinement, and run a concrete-hash
    digest map against a lazily sampled oracle arm in one invocation
  objective: 'The one uncertainty a run reduces is whether the occupancy law this program has derived
    five times and measured zero times survives contact with an exact computation. Concretely: (i)
    whether the exactly enumerated mean conditional success product agrees with 2^{-ak} T_k(lambda)
    and with its leaf-collision refinement at every tested (a, k, gamma), and if not, where and by
    how much, since a constant-factor or index error in a derivation nobody has run is a live possibility
    and enumeration is the cheapest instrument that can see it; (ii) whether the refinement is strictly
    smaller pointwise, as H-SLHDSA-3a403a statement (iii) asserts, or whether there are triples where
    it is not; (iii) whether a concrete truncated hash used as the digest map produces the same curve
    as a lazily sampled random oracle, which is the only comparison in this contract that could carry
    information about a hash rather than about combinatorics, and which is pre-registered to show
    no difference. A run reduces (i) and (ii) to exact rational comparisons with no statistical error,
    and (iii) to a difference with a Monte-Carlo band and a seed spread. Full agreement on all three
    is a complete outcome and is what the contract expects.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'At most, a completed run supports: at the tested toy (a, k,
      gamma) grid, under the stated reassembly-adversary restriction, the exact distribution and mean
      of the conditional FORS success product; its exact agreement or disagreement with the two analytic
      curves; the pointwise sign of the refinement inequality; and the measured difference between
      a specified truncated concrete hash and a lazily sampled oracle as digest map, with bands and
      seed spreads. WHAT DOES NOT FOLLOW: nothing about any FIPS 205 parameter set, no security level
      in bits, no forgery, no attack, no improvement to any attack, no statement about SHA-2 or SHAKE,
      no statement about what the literature contains, and nothing about the fault or memory-corruption
      claim class. Agreement at toy (a,k) is agreement about algebra that happens to be checkable
      there; transfer to deployed parameters is an assumption stated in scale_justification and is
      not established by any run under this contract.'
  inputs:
    procedure: 'STAGE 0, freeze (zero compute): register the (a, k, gamma) grid, the two analytic
      formulas in exact rational form, the reassembly-adversary restriction, and the pre-registered
      null expectation, before any code runs. STAGE 1, exact enumeration (~1h compute): implement
      brute-force enumeration over index tuples and, independently, dynamic programming over per-tree
      occupancy; run both on the overlap region and require exact agreement; extend the DP over the
      full grid. STAGE 2, analytic evaluation (~10min compute): evaluate the Stirling-sum and Poisson-refined
      expressions in exact rational arithmetic over the same grid, with no floating point anywhere.
      STAGE 3, instrument (~3h human): build the toy FORS signer with a pluggable digest map, cleared
      against the companion mutation battery. STAGE 4, two-arm Monte Carlo (~2h compute): 10^6 trials
      per (a,k,gamma) per arm per seed, three seeds, concrete-hash and oracle arms in one process
      invocation. STAGE 5, report (zero compute): three measured curves and two analytic curves per
      (a,k), with all pairwise differences, bands, seed spreads, and the pointwise refinement-inequality
      signs.'
    instrument: Python 3.11 with fractions.Fraction for all analytic evaluation (no floating point
      in STAGE 2), math.comb and an in-repository Stirling-number routine written for this contract,
      itertools for brute-force enumeration, numpy for Monte-Carlo accumulation and bands, hashlib
      for the truncated concrete digest map (SHA-256 and SHAKE-128, each truncated to the exact ak
      + h bits the toy split needs), and a seeded random.Random keyed by the tweak for the lazily
      sampled oracle backend. New single-file module under harness/, in the style of harness/rho.py
      and harness/toycurve.py, executed via harness/runner.py so seeds, parameters and the resolved
      inference block land in the run manifest. No Sage, no external cryptographic library, no network.
    parameters: 'a in {2, 3, 4}; k in {2, 3, 4}; gamma from 0 to 32 inclusive by 1, extended to 64
      for the dynamic-programming arm only. Brute-force enumeration restricted to the region where
      2^{a k gamma} is at most 2^28. Digest truncation width exactly a*k + h bits with h in {4, 6}.
      Monte Carlo: 10^6 trials per cell per arm per seed; seeds 3; arms 2 (concrete hash, lazily sampled
      oracle) plus the gamma=0 floor arm. Analytic arm: exact rationals throughout, no tolerance parameter.
      Cross-check overlap: all (a,k,gamma) with a<=3, k<=3, gamma<=6.'
  controls:
  - Lazily sampled random-oracle digest map, identical pipeline, same invocation, same seeds and gamma
    grid.
  - Exact enumeration as ground truth wherever it is runnable, with the dynamic-programming and brute-force
    routes cross-checked on their overlap.
  - Exact rational arithmetic for the analytic curves, so that any observed gap cannot be floating-point.
  - A gamma=0 arm, where the measured success product must be exactly zero, as a pipeline sanity floor.
  - Three independent seeds per Monte-Carlo arm with the between-seed spread reported next to every
    number.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The identical enumeration and Monte-Carlo pipeline is run with the
    digest map replaced by a lazily sampled random oracle over the same index alphabet, in the same
    process invocation, on the same seeds and the same gamma grid. The null must reproduce the exact
    enumerated curve to within its Monte-Carlo band at every gamma, because under a uniform digest
    map the enumerated combinatorics is by construction the truth. If the oracle arm deviates from
    the enumeration, the measurement pipeline is broken and no statement about the concrete-hash arm
    is admissible. Only the difference between the concrete-hash arm and the oracle arm can carry
    information about the hash, and the contract pre-registers that this difference is expected to
    be zero within band.'
  independent_variables:
  - FORS tree height a
  - number of FORS trees k
  - reuse count gamma
  - digest-map arm (truncated concrete hash / lazily sampled oracle)
  - seed
  metrics:
    primary:
    - exactly enumerated mean conditional success product per (a,k,gamma)
    - analytic Stirling-sum value in exact rational form
    - analytic leaf-collision-refined value in exact rational form
    - Monte-Carlo mean success product per arm with band
    - pointwise sign of the refinement inequality across the grid
    secondary:
    - full enumerated distribution of the success product, not only its mean
    - per-tree revealed-set cardinality distribution versus m(gamma)
    - brute-force versus dynamic-programming agreement on the overlap
    - between-seed spread of every Monte-Carlo number
    - wall-clock and trial counts per arm
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The signed difference between the Monte-Carlo mean conditional success product in the
      lazily sampled random-oracle arm and the exactly enumerated mean, at every (a, k, gamma) in
      the grid.
    formula: Predicted value zero, within the binomial Monte-Carlo band. For N = 10^6 trials and enumerated
      mean p, the pre-registered two-sided 99 percent band is 2.576 * sqrt(p(1-p)/N). The enumerated
      mean itself is defined as the exact expectation over the reachable revealed-set family S of
      the product over t = 1..k of |S_t| / 2^a, where S_t accumulates by union of the per-signature
      index component over gamma signatures. The analytic comparison values are 2^{-ak} T_k(lambda)
      with T_k(lambda) = sum over j = 1..k of S(k,j) lambda^j, and 2^{-ak} E_{X ~ Poisson(lambda)}[m(X)^k]
      with m(g) = 2^a (1 - (1 - 2^{-a})^g), lambda = gamma.
    source: Pre-registered in the parent proposal IDEA-20260816-9f5bd3 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at a in {2,3,4}, k in {2,3,4}, gamma up to 64, digest truncation a*k +
      h bits with h in {4,6}. These are the largest parameters at which the revealed-set state space
      is enumerable exactly rather than sampled, which is the entire point of the design: the contract
      buys zero statistical error on the ground-truth arm and pays for it in scale. The transfer assumption,
      stated and not established: that the algebraic identity between the accumulation combinatorics
      and the Stirling-sum expression is parameter-independent, so that agreement verified exactly
      at toy (a,k) is evidence the same expression is correctly derived at larger (a,k). That is an
      assumption about algebra, not about security, and under AGENTS.md rule 4 no output of this contract
      is phrased as a statement about any deployed parameter set.'
    correspondence: null
  tail_checks:
  - Require exact agreement between the brute-force and dynamic-programming enumerations on the full
    overlap region, with any disagreement halting the run.
  - Verify the gamma=0 arm returns exactly zero in every arm.
  - Verify per-tree revealed-set cardinality in the oracle arm matches m(gamma) within its own band,
    independently of the k-fold product.
  - Re-run STAGE 2 with an independently written Stirling-number routine and require bit-identical
    rationals.
  - Confirm no floating-point value enters STAGE 2 by asserting Fraction types throughout.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report an instrument failure if the oracle arm deviates from the exact enumeration beyond
    its band at any grid point.
  - Halt the brute-force arm at 2^28 enumerated tuples and rely on the dynamic programming beyond
    that, recording the switch point.
  - Hard wall-clock stop at 12 CPU-hours; a stop is an infrastructure outcome and is never negative
    mathematical evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Exact enumerated curves over the full grid, cross-checked by two independent
    enumeration routes, reported alongside the two exact-rational analytic curves and both Monte-Carlo
    arms, with every pairwise difference, band and seed spread stated and the refinement-inequality
    sign given pointwise.
  falsification_criterion:
  - 'The oracle arm deviates from the exact enumeration beyond band: pipeline invalid, nothing else
    reported.'
  - 'Brute force and dynamic programming disagree on the overlap: ground truth invalid.'
  - 'The refinement inequality fails at any triple: H-SLHDSA-3a403a statement (iii) is contradicted
    at toy scale and superseded with the counterexample.'
  - 'The enumerated curve and the analytic curve disagree by more than 0.02 anywhere: one of the two
    is wrong and the contract must say which, or record that it cannot.'
  - 'The concrete-hash arm differs from the oracle arm beyond band and the truncation-width confounder
    cannot be excluded: the result is inconclusive, not a hash finding.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-9f5bd3
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - 'The exact indexing convention of T_k(lambda) with lambda = gamma versus lambda = q/2^h must be
    settled by the Coordinator before freezing: H-SLHDSA-3a403a uses the per-leaf rate q/2^h, while
    this toy contract fixes gamma directly, and the two agree only under a stated identification.'
  - Whether the reassembly-adversary restriction is the right scoping, or whether a second arm permitting
    bounded leaf-hash guessing should be added, is a Coordinator decision that changes the object.
  - The digest truncation width and the bit-allocation between the FORS block and the index block
    interact; this contract holds them fixed, and a Coordinator must decide whether that fixing is
    legitimate or whether the companion randomizer-distribution contract must clear first.
  - No hypothesis is minted here; a Coordinator must decide whether this contract attaches to H-SLHDSA-3a403a
    as an instrument-validity arm or requires its own hypothesis.
