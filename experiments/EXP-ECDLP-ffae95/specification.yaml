# EXP-ECDLP-ffae95
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261004-19b710.
experiment:
  id: EXP-ECDLP-ffae95
  hypothesis_id: H-ECDLP-1a72be
  source_idea: IDEA-20261003-9cdca7
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-11 table versus width-10 table
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-19b710
  objective: >-
    Check the table sizes 1024 and 512, the product 524288, and the nearby gap 0.
  inputs:
    width_hi: 11
    width_lo: 10
    table_hi: 1024
    table_lo: 512
    table_gap: 512
    table_product: 524288
    table_sum: 1536
    nearby_a: 512
    nearby_b: 512
    nearby_gap: 0
    nearby_product: 262144
  controls:
    - >-
      Two to the power 10 is 1024. Two to the power 9 is 512. Reporting
      both tables as size 512 drops the gap and invalidates the run.
    - >-
      One thousand twenty-four exceeds five hundred twelve by 512. The
      product of the two sizes is 524288. Their sum is 1536.
    - >-
      Two width-10 tables each store 512. Their gap is 0 and their
      product is 262144.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-11 table stores 1024 entries. The width-10 table stores
      512. The gap of two width-10 tables is 0.
    formula: >-
      Compute 2 to the power 10. Compute 2 to the power 9. Subtract
      512 from 1024. Multiply 1024 by 512. Subtract 512 from 512.
    source: >-
      IDEA-20261003-9cdca7 states the widths 11 and 10 and the sizes
      1024 and 512, read 2026-10-04. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 524288 and the nearby gap 0 are required. A check that stops at the size 1024 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 1024 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 10 is not 1024.
    - Two to the power 9 is not 512.
    - The gap is not 512.
    - The product is not 524288.
    - Both tables are reported as size 512, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-11 table stores 1024 entries, that
    the width-10 table stores 512, and that 1024 exceeds 512 by 512.
  falsification_criterion: >-
    The runs agree that the width-11 table size is computed, and
    that size is not 1024.
  required_artifacts:
    - experiments/EXP-ECDLP-ffae95/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-ffae95/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-ffae95/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-ffae95/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-ffae95/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-ffae95/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 512 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
