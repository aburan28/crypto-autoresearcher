    zero_fixture_rule: >-
      For each row, build the exact 64-byte CARARCH1 header for its allocation
      code and pass, append exactly the declared number of zero bytes, apply
      allocation-25 neutralization exactly as declared, and compare with the
      corresponding proposal digest. Hashing MUST be streaming and MUST NOT
      allocate the largest payload in memory.

  allocation_25_self_neutral_fixture:
    allocation_code: 25
    allocation_bytes: 1048576
    archive_digest_table_region: '[0,2688)'
    interval_certificate_digest_region: '[2688,2976)'
    remaining_index_region: '[2976,1048576)'
    initial_payload:
      - {region: '[0,2688)', value: repeat_A5}
      - {region: '[2688,2976)', value: repeat_5A}
      - {region: '[2976,1048576)', value: repeat_00}
    neutral_preimage_rule: Replace exactly bytes [0,2688) with zeros before hashing without mutating stored bytes.
    output_slots: {write_offset: 1536, verification_offset: 1568, bytes_each: 32}
    expected_write_sha256: e2d7d70353c5fa39906d6d8e3141288e95accdfafb1981800aeb87786e9c1b44
    expected_verification_sha256: 8144e1af24a5a2468a05b0ad0618fe8c19618c816f8b57ad6f2e5c02a51ce865
    round_trip_rule: >-
      Hash both passes, store the two digests at their slots, decode the index,
      encode it byte-for-byte, neutralize [0,2688), and hash both passes again.
      Initial and round-trip digests must match their two fixed expected values.
    expected_dependency_cycle_count: 0
    nearby_object_controls:
      excluded_region_perturbation: >-
        Change stored byte 0 from A5 to A4. Because the complete region is
        neutralized, both pass digests MUST remain unchanged. Failure means the
        excluded region is incomplete or the wrong preimage was hashed.
      included_region_perturbation: >-
        Starting from the unmutated canonical fixture, change stored byte 2688
        from 5A to 5B. It is outside the excluded region, so the write digest
        MUST differ from e2d7d703... and the verification digest MUST differ
        from 8144e1af.... Equality is a failing nearby-object control.

  controls:
    execution_order:
      - CTRL-SOURCE-BINDING
      - CTRL-FAMILY-MAGIC-CODE-COLLISION
      - CTRL-OFFSET-COVERAGE-RESERVED-ZERO
      - CTRL-ENCODE-DECODE-ENCODE
      - CTRL-SHA256-INDEPENDENT-PADDING
      - CTRL-CERTIFICATE-9-OF-9-BIJECTION
      - CTRL-ARCHIVE-42-BY-2-ZERO-FIXTURES
      - CTRL-ALLOCATION-25-SELF-NEUTRAL
      - CTRL-NEARBY-OBJECT-PERTURBATION
      - CTRL-ORDERING-HASH-COMMITMENT
      - CTRL-FORBIDDEN-SCIENTIFIC-PATH
    definitions:
      - id: CTRL-SOURCE-BINDING
        can_fail: true
        test: >-
          Require the exact proposal path, SHA-256, idea id, experiment id,
          fixture counts, and all copied constants to agree before parsing a
          canonical message. A stale or mismatched binding halts the package.
      - id: CTRL-FAMILY-MAGIC-CODE-COLLISION
        can_fail: true
        test: >-
          Parse the registry and proposal tables independently; reject any
          duplicate eight-byte prefix, family code, schema code within its
          namespace, family/subtype pair, or selector arm code, and reject any
          prefix whose decoded magic differs from the literal ASCII value.
      - id: CTRL-OFFSET-COVERAGE-RESERVED-ZERO
        can_fail: true
        test: >-
          For every fixed-width header, record, and subrecord in the exact
          layout sources, sort half-open [offset,offset+width) intervals and
          require a gap-free, overlap-free partition of the declared width.
          Reconcile all derived widths and require every reserved byte zero.
          A negative fixture changing the first reserved byte to 01 MUST be
          rejected before hashing.
      - id: CTRL-ENCODE-DECODE-ENCODE
        can_fail: true
        test: >-
          For all 20 canonical messages, all 84 archive zero messages, and the
          two allocation-25 pass messages, decode each typed field, reject
          trailing bytes, re-encode canonically, and require exact byte identity
          before checking its digest.
      - id: CTRL-SHA256-INDEPENDENT-PADDING
        can_fail: true
        test: >-
          Path A obtains the serialized byte length from the emitted byte
          stream. Path B obtains the expected logical length by summing declared
          field widths and payload cardinalities without consulting Path A.
          Require both lengths equal and recompute blocks as
          floor((message_bytes+72)/64), an integer-arithmetic form independent
          of the proposal's ceil expression. Require agreement for every case,
          7257 blocks over the 20 compact fixtures, every archive row's frozen
          blocks_per_pass, and 70396870 blocks across all 84 zero fixtures.
      - id: CTRL-CERTIFICATE-9-OF-9-BIJECTION
        can_fail: true
        test: >-
          Require the exact ordered 9/9 source-slot schedule, contiguous source
          and digest partitions, and unique ids/ordinals/slots. A negative map
          that aliases ordinal 8 to digest offset 2912 MUST be rejected. No
          certificate solver or actual certificate digest is permitted.
      - id: CTRL-ARCHIVE-42-BY-2-ZERO-FIXTURES
        can_fail: true
        test: >-
          Rebuild and hash all 42 allocation families under both pass headers;
          require 84/84 matches, 42 unique allocation codes, 42 unique write
          slots, 42 unique verification slots, and exact ordering.
      - id: CTRL-ALLOCATION-25-SELF-NEUTRAL
        can_fail: true
        test: >-
          Perform the declared nonzero initial and stored-digest round trip.
          Require both expected pass digests at both phases and a zero-cycle
          dependency graph. An all-zero allocation-25 payload is insufficient
          for this control and cannot substitute for it.
      - id: CTRL-NEARBY-OBJECT-PERTURBATION
        can_fail: true
        test: >-
          Run both literal allocation-25 mutations. The excluded mutation must
          preserve each pass digest and the included mutation must change each
          pass digest. Either wrong direction invalidates the package.
      - id: CTRL-ORDERING-HASH-COMMITMENT
        can_fail: true
        test: >-
          Commit, by SHA-256, the exact source bindings, implementation bytes,
          fixture table, case order, all conformance outputs, stdout, stderr,
          and invalidation log before any result may be read by a later semantic
          task. Missing or late commitment invalidates the package.
      - id: CTRL-FORBIDDEN-SCIENTIFIC-PATH
        can_fail: true
        test: >-
          The manifest must enumerate invoked modules and commands and assert
          zero curve generation, curve-equation evaluation, XOF generation,
          selector, sampler, join, witness, interval-solver, certificate-output,
          treatment, or semantic-analysis calls. Any such call immediately
          invalidates the package even if every digest matches.

  independent_variables:
    - serializer family and subtype from the fixed schedule
    - canonical fixture ordinal
    - archive allocation code 1 through 42
    - archive pass code write or verification_read
    - fixed control variant canonical, reserved-byte-invalid, slot-alias-invalid, excluded-mutation, or included-mutation
  forbidden_independent_variables:
    - curve, target, model, selector outcome, treatment arm, measured value, fitted parameter, or adaptive choice

  metrics:
    primary:
      - {id: source_binding_matches, expected: '1/1'}
      - {id: family_magic_prefix_collisions, expected: 0}
      - {id: family_code_collisions, expected: 0}
      - {id: layout_gap_or_overlap_count, expected: 0}
      - {id: reserved_zero_violations, expected: 0}
      - {id: canonical_encode_decode_encode_matches, expected: '106/106', note: '20 compact + 84 archive-zero + 2 allocation-25 initial pass messages'}
      - {id: compact_fixture_digest_matches, expected: '20/20'}
      - {id: archive_zero_fixture_digest_matches, expected: '84/84'}
      - {id: certificate_source_slot_bijection, expected: '9/9'}
      - {id: allocation_25_initial_digest_matches, expected: '2/2'}
      - {id: allocation_25_round_trip_digest_matches, expected: '2/2'}
      - {id: dependency_cycle_count, expected: 0}
      - {id: nearby_included_digest_changes, expected: '2/2'}
      - {id: nearby_excluded_digest_preservations, expected: '2/2'}
      - {id: presemantic_commitment_complete, expected: true}
      - {id: forbidden_scientific_path_events, expected: 0}
    secondary:
      - exact emitted versus independently summed bytes for every fixture
      - exact SHA-256 block count per message and aggregate
      - exact header, payload, record, item, and digest cardinalities per family
      - exact archive allocation, pass, slot, and byte counts
      - exact certificate source and digest half-open intervals
      - negative-control rejection stage and reason
      - streaming chunk size, wall time, CPU time, peak RSS, and logical bytes read
      - stdout, stderr, dependency versions, command, commit, and dirty-tree state
    explicitly_not_metrics:
      - gamma_s, X, Y, V, S, kappa, probability, slope, solver result, relation, witness, runtime advantage, or ECDLP cost

  ordering_gates:
    - id: G0-SOURCE
      admits: CTRL-SOURCE-BINDING only
      completion: exact proposal and frozen future contract bytes hash-bound
    - id: G1-STATIC-GRAMMAR
      depends_on: G0-SOURCE
      admits: family/code collision and complete layout checks only
      completion: zero collisions, gaps, overlaps, and reserved-byte defects
    - id: G2-COMPACT-FIXTURES
      depends_on: G1-STATIC-GRAMMAR
      admits: the 20 literal compact serializer fixtures only
      completion: 20/20 byte round trips and frozen digest matches
    - id: G3-INDEPENDENT-SHA
      depends_on: G2-COMPACT-FIXTURES
      admits: independent padding and block reconciliation only
      completion: zero per-message or aggregate residuals
    - id: G4-CERTIFICATE-MAP
      depends_on: G3-INDEPENDENT-SHA
      admits: static nine-row source/slot map only
      completion: 9/9 bijection and negative alias rejection without certificate output
    - id: G5-ARCHIVE
      depends_on: G4-CERTIFICATE-MAP
      admits: 84 zero fixtures, allocation-25 nonzero round trip, and two mutations
      completion: every archive control has its exact expected outcome
    - id: G6-COMMITMENT
      depends_on: G5-ARCHIVE
      admits: result packaging and hash commitment only
      completion: immutable presemantic commitment over all required artifacts
    - id: G7-SEMANTIC-BARRIER
      depends_on: G6-COMMITMENT
      admits: nothing_under_this_contract
      completion: >-
        No semantic work is part of this design. A later task remains barred
        until independent validation plus separate approval, freeze, archive,
        implementation review, execution authorization, and user authorization.

  stage_budget:
    status: prospective_not_approved_or_executable
    maximum_workers: 1
    maximum_run_packages: 1
    total_wall_clock_seconds: 1800
    total_CPU_seconds: 1800
    total_CPU_hours: 0.5
    maximum_memory_gb: 1
    maximum_retained_artifact_bytes: 268435456
    maximum_logical_bytes_hashed: 4600000000
    network_requests: 0
    stages:
      - {id: G0-SOURCE, wall_clock_seconds: 90, CPU_seconds: 90, maximum_memory_gb: 0.25, stop_rule: stop_on_any_binding_mismatch}
      - {id: G1-STATIC-GRAMMAR, wall_clock_seconds: 120, CPU_seconds: 120, maximum_memory_gb: 0.25, stop_rule: stop_on_first_unreconciled_layout_after_recording_all_static_defects}
      - {id: G2-COMPACT-FIXTURES, wall_clock_seconds: 240, CPU_seconds: 240, maximum_memory_gb: 0.5, stop_rule: stop_on_first_noncanonical_decoder_acceptance_or_fixture_mismatch}
      - {id: G3-INDEPENDENT-SHA, wall_clock_seconds: 120, CPU_seconds: 120, maximum_memory_gb: 0.25, stop_rule: stop_on_any_length_or_block_residual}
      - {id: G4-CERTIFICATE-MAP, wall_clock_seconds: 90, CPU_seconds: 90, maximum_memory_gb: 0.25, stop_rule: stop_on_any_nonbijective_mapping_or_actual_digest_attempt}
      - {id: G5-ARCHIVE, wall_clock_seconds: 960, CPU_seconds: 960, maximum_memory_gb: 1, stop_rule: stop_on_any_digest_mismatch_cycle_or_streaming_cap_violation}
      - {id: G6-COMMITMENT, wall_clock_seconds: 180, CPU_seconds: 180, maximum_memory_gb: 0.5, stop_rule: stop_if_commitment_is_missing_late_or_incomplete}
    reconciliation:
      wall_clock_stage_sum_seconds: 1800
      CPU_stage_sum_seconds: 1800
      maximum_stage_memory_gb: 1
      maximum_workers_matches: true

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 0.5
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    no_network: true
    streaming_required: true
    note: >-
      These are prospective hard caps for a future separately authorized
      mechanical conformance package. They are not measured costs and do not
      authorize this design or any implementation.

  stopping_rules:
    - Stop before reading fixture outcomes if this specification is not separately reviewed and snapshot-bound.
    - Stop at the first failed ordering gate; record the precise defect and do not admit successors.
    - Stop before hashing if a source binding, family/code, layout, length, or reserved-zero gate fails.
    - Stop before archive fixtures if any compact fixture, SHA arithmetic, or 9/9 certificate-map gate fails.
    - Stop on any forbidden scientific-path event, actual certificate-digest attempt, or network request.
    - Stop on wall, CPU, memory, retained-artifact, logical-byte, or run-package cap exhaustion.
    - Never replace, drop, regenerate, normalize away, or weaken a failed case; a repair requires a versioned successor.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, evidence_eligible is false, or approved_by is null.
    - Any implementation or output produced under TASK-20260809-1c7ba1; this task is design-only.
    - Any curve generation, curve-equation computation, selector, sampler, interval solve, certificate-output generation, join, witness, or treatment path.
    - Any actual future interval-certificate digest value replacing the pending sentinel.
    - Any source hash mismatch, offset gap/overlap, alternate encoding, nonzero reserved byte, trailing byte, or native-endian field.
    - Any missing or duplicate family, subtype, fixture, certificate row, archive allocation, pass, output slot, or required artifact.
    - Any fixture digest, byte count, block count, slot, traffic, CPU-weight, wall-weight, or archive-mapping residual.
    - Any archive digest depending on its own non-neutralized output slot or any nonzero dependency cycle.
    - Any late or incomplete ordering commitment, or any later semantic work reading uncommitted outputs.
    - Any comparison to a prior experiment output or any scientific inference from a conformance outcome.

  infrastructure_failure_disposition:
    terminal_status: failed_infrastructure
    applies_to:
      - timeout
      - crash
      - missing dependency
      - unsupported SHA implementation
      - filesystem or storage failure
      - resource exhaustion
      - environment mismatch
    interpretation: >-
      Infrastructure failure is not a failed serializer control, not evidence
      against the proposal, and never ECDLP evidence. Preserve partial logs and
      coverage, mark every unexecuted control not_performed, and do not infer a
      negative result.

  success_criterion: >-
    This unfrozen design has no current success outcome and authorizes no run.
    If a later separately approved, frozen, archived, implemented, and
    authorized package executes, its only positive disposition is
    serializer_conformance_pass: every primary metric equals its fixed expected
    value, every negative control fails in the required direction, all required
    artifacts are committed before any successor reads them, and no forbidden
    path is entered. That disposition is apparatus conformance only and is not
    scientific evidence.

  falsification_criterion: >-
    The proposed byte-reproducibility repair fails at serializer scope if any
    valid future conformance package has a source mismatch, layout gap/overlap,
    reserved-zero acceptance, nonidentity round trip, digest or block mismatch,
    certificate map other than 9/9, archive map other than 42-by-2, nonzero
    dependency cycle, failed nonzero allocation-25 round trip, included-byte
    digest collision, excluded-byte digest change, or incomplete ordering
    commitment. This falsifies only the tested serialization/interface repair;
    it is not evidence about signed-y structure or ECDLP.

  proof_search_map_relevance:
    applicability: bounded_serializer_interface_audits_only
    proof_or_asymptotic_proposal_dispatched: false
    baseline_reproduction: >-
      Reproduce exactly the proposal-bound 20 compact fixtures, 84 all-zero
      archive-pass fixtures, 9/9 source-slot schedule, ICC2 literal mapping,
      and allocation-25 finite construction.
    observation_collision: >-
      Scan family/code collisions and slot aliases; use the all-zero archive
      case to expose the direct-versus-neutral ambiguity and the nonzero
      allocation-25 fixture to distinguish it.
    quantifier_order: >-
      For every declared family/subtype fixture, every archive allocation code
      1..42, both pass codes, and every certificate ordinal 0..8, the one
      canonical preimage and mapping are fixed before execution. No witness,
      curve, digest, or case choice may depend on a future observation.
    method_ceiling:
      strongest_certifiable_claim: exact finite serializer conformance under the tested implementation
      nearby_object_control: literal included and excluded allocation-25 byte perturbations
      cannot_certify:
        - SHA-256 collision resistance as a theorem
        - semantic correctness of interval certificates, curve logic, selectors, or treatment
        - scientific validity, novelty, advantage, scaling, or ECDLP impact
    constructive_transforms_used: []
    not_applicable_reason: >-
      No theorem, asymptotic bound, reduction, or closure is being dispatched.
      The proposal's proof-search-map discipline is retained only where it
      supplies cheap interface falsifiers and a method ceiling.

  comparator_restrictions:
    prior_designs_used_as_control_patterns_only:
      - EXP-JINV-0133f4
      - EXP-JINV-9be254
      - EXP-SSI-6a2619
    permitted_reuse:
      - fail-closed controls that can invalidate the instrument
      - ordering commitment before treatment-like work
      - exact deterministic domains and resource reconciliation
      - infrastructure failure separated from mathematical evidence
      - explicit claim and scale ceilings
    forbidden_comparisons:
      - any measurements, verdicts, or outcomes from the three prior designs
      - any cross-experiment statistic, curve behavior, solver behavior, or runtime ratio
      - Pollard rho, BSGS, selector, treatment, or Pareto performance
    cross_contract_rule: >-
      A future cross-contract comparison requires a separately registered
      comparator naming both domains, both implementations, the exact statistic,
      matched accounting, and failure disposition. None is part of this design.

