# EXP-SSI-f08a63
# Toy E[2] witness-quotient audit for H-SSI-d4f424.
# Frozen before any run. The fiber partition is a prediction, not a result.
experiment:
  id: EXP-SSI-f08a63
  hypothesis_id: H-SSI-d4f424
  source_idea: IDEA-20261004-edbd24
  question_id: RQ-SSI-1946c9
  goal_id: GOAL-SSI-2fa82a
  version: 1
  title: >-
    E[2] equality-bit quotient for iota and Frobenius on y^2 = x^3 + x
  status: approved
  frozen: true
  designed_at: '2026-10-05'
  approved_by: coordinator
  approval_decision_id: DEC-20261005-8219b8
  objective: >-
    For each prime in {7, 11, 19}, evaluate all eight witnesses
    iota^a ∘ pi^b on E[2] by two group-law routes, replay Dec from
    the equality-bit table alone, reject a degree p+1 query, and
    record the reverse arrow from that table to (a, b) as missing
    unless a proof artifact is attached.
  inputs:
    curve: y^2 = x^3 + x
    field_model: F_p[i]/(i^2 + 1)
    primes: [7, 11, 19]
    iota: (x, y) -> (-x, i*y)
    frobenius: (x, y) -> (x^p, y^p)
    composition: pi^b first, then iota^a
    witness_pairs:
      - [0, 0]
      - [1, 0]
      - [2, 0]
      - [3, 0]
      - [0, 1]
      - [1, 1]
      - [2, 1]
      - [3, 1]
    torsion_points:
      O: identity
      T0: [0, 0]
      Ti: [i, 0]
      Tmi: [-i, 0]
    decryption: >-
      Dec_theta(R) is 0 if theta(R) = R and 1 otherwise.
      Q_dec is the ordered tuple of bits on (O, T0, Ti, Tmi).
    negative_query:
      point: T0
      degree: p_plus_1
      expected_status: undefined
    predicted_qdec_fibers:
      fix_all: [[0, 0], [2, 0], [1, 1], [3, 1]]
      swap_Ti_Tmi: [[1, 0], [3, 0], [0, 1], [2, 1]]
  controls:
    - >-
      Positive control. Replay every Dec bit from Q_dec alone.
      Expected disagreements: 0.
    - >-
      Negative control. The degree p+1 image of T0 is outside the
      witness set and outside Q_dec. Expected status: undefined.
      A returned point invalidates the run.
    - >-
      Nearby-object control inside the witness set. (0,0) and (2,0)
      are distinct maps because iota^2 sends (x, y) to (x, -y), and
      they are predicted to agree on E[2] because [-1] fixes every
      point of order dividing 2.
    - >-
      Two routes. Affine short-Weierstrass addition, and Jacobian
      projective addition. Neither route may import the other's
      images or a hand-written action table.
    - >-
      Point-count precondition. Each route counts #E(F_p). The cell
      is valid only if both routes report p+1.
  independent_variables:
    - prime in {7, 11, 19}
    - route in {affine, projective}
  metrics:
    primary:
      - replay_disagreements
      - qdec_fiber_partition
      - routes_agree
      - negative_query_status
      - point_count_ok
    secondary:
      - qdeg_fiber_sizes
      - unresolved_reverse_arrows
      - witness_count
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: >-
      Replay disagreements are 0. Q_dec has two fibers of size 4,
      with the membership written under inputs.predicted_qdec_fibers.
      The degree p+1 query is undefined. The reverse arrow is missing.
    formula: >-
      Bits of Dec are equality tests on E[2]. [-1] fixes E[2], and
      the design-session composition of iota with Frobenius, for
      p congruent to 3 mod 4, yields the named fibers. That
      composition is recomputed by the runs. It is not itself a run.
    source: >-
      H-SSI-d4f424, derived from the quotient lemma in
      IDEA-20261004-edbd24. The SÉTA, SiGamal, and LIT-SiGamal
      papers named in that proposal were not reopened for this
      prediction.
  scale_relevance:
    tier: toy
    justification: >-
      Three primes, eight endomorphisms, and four torsion points.
      No transfer to a cryptographic prime or to a published PKE.
    correspondence: null
  tail_checks:
    - >-
      Every witness pair in the predicted fix-all fiber must share
      one measured bit tuple, and every pair in the predicted swap
      fiber must share the other. A check that reports only the
      replay count, without the partition, is invalid.
    - >-
      Degree-aware fibers are secondary. The prediction is four
      fibers of size 2, split from the two Q_dec fibers by degree
      in {1, p}. A mismatch on Q_deg with agreement on Q_dec is
      reported separately and does not by itself falsify replay.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: >-
      Deterministic. The two instances are the affine route and the
      projective route. One run manifest per (prime, route), six
      manifests in total.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 6
    maximum_workers: 1
  stopping_rules:
    - Stop after six valid manifests, one for each prime and route.
    - Do not add a prime, a witness, or a torsion level.
    - Do not continue after a route disagreement. That cell is invalid.
  invalidation_rules:
    - The two routes disagree on any image, bit, fiber, or point count.
    - Either route reports #E(F_p) different from p+1.
    - The negative query returns a point.
    - A witness is skipped or an extra witness is added.
    - An action table is imported instead of computed from the group law.
    - The reverse arrow is marked proved without a proof artifact in the run directory.
    - A timeout, crash, or missing manifest. These are infrastructure outcomes.
  success_criterion: >-
    All six manifests are valid, routes agree on every prime,
    point_count_ok is true, replay_disagreements is 0,
    negative_query_status is undefined, unresolved_reverse_arrows
    is 1, and the measured Q_dec partition equals the pre-registered
    fibers.
  falsification_criterion: >-
    Both routes agree and point_count_ok is true, and either
    replay_disagreements is positive on some point of E[2], or the
    measured Q_dec partition differs from the pre-registered fibers.
    A route disagreement does not meet this criterion.
  required_artifacts:
    - experiments/EXP-SSI-f08a63/runs/<run-id>/command.txt
    - experiments/EXP-SSI-f08a63/runs/<run-id>/stdout.txt
    - experiments/EXP-SSI-f08a63/runs/<run-id>/stderr.txt
    - experiments/EXP-SSI-f08a63/runs/<run-id>/result.json
    - experiments/EXP-SSI-f08a63/runs/<run-id>/action-table.json
    - experiments/EXP-SSI-f08a63/runs/<run-id>/witness-ladder.yaml
  assigned_to: executor
  out_of_scope:
    - Any claim about SÉTA, SiGamal, LIT-SiGamal, or EndRing hardness.
    - Any prime outside {7, 11, 19}.
    - Any torsion other than E[2].
    - Publishing a new PKE or an attack.
