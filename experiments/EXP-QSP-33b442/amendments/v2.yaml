protocol_amendment:
  experiment_id: EXP-QSP-33b442
  version_from: 1
  version_to: 2
  recorded_at: '2026-09-17'
  predecessor_path: experiments/EXP-QSP-33b442/specification.yaml
  predecessor_sha256: e43512153dd5f88f61f95ef14df85ffaa3d0cc52c52626fe58dc298b8145401a
  reason: >-
    Two internal-consistency defects in the version-1 contract, found on review
    of PR #1261 before any run was executed. (1) The stopping rules for F1 and
    F2 give the executor contradictory orders on one and the same event: a
    Stage 2 complete splitter (N = 2^{n'}, r >= 1) with beta < n/(n + n' - r)
    satisfies, by the arithmetic of H-QSP-5540d7 (B), (q+1) log_2 d < n', i.e.
    d^{q+1} < 2^{n'} = N, and 2^{n'-r} < 2^{n'} because r >= 1, so
    N > max(d^{q+1}, 2^{n'-r}) -- a bound violation -- and Stage 2 runs I3 on
    every candidate with N >= 2^{n'-1}, so its root list exists. The F1 rule
    says STOP the sweep and return immediately; the F2 rule says archive the
    row, FINISH the sweep, then stop before Stage 3. Both cannot be followed.
    (2) M1 is defined only over the Stage 1, Stage 1b and Stage 3 cells, but
    S1 requires M1 <= 1 at every cell of Stages 1, 1b, 2 AND 3, P-A asserts
    M1 <= 1 at Stage 2 cells, and P-C asserts attainment M1 = 1 at (7, 4),
    which is not a Stage 1 cell and occurs only in the Stage 2 sweep. As
    written, S1 and P-C are not decidable from the listed metrics, contrary to
    the contract's own "DECIDABLE FROM THE METRICS ABOVE ALONE".
  changes:
    - >-
      stopping_rules, F2 rule (version-1 text beginning "A complete splitter
      with beta below the exact corollary in Stage 2") is REPLACED by: "A
      complete splitter with beta below the exact corollary n/(n + n' - r) in
      Stage 2 is, by the arithmetic of (B), a candidate with
      N = 2^{n'} > max(d^{q+1}, 2^{n'-r}), and its I3 root list is re-verified
      by the wrapper exactly as a Stage 3 certificate is (every listed x
      satisfies x^{2^{n'}} = lambda(x) in K; all listed roots pairwise
      distinct). It is therefore governed by the preceding F1 rule: STOP the
      stage, archive the splitter with its re-verified root list and BOTH
      corollary values, and return immediately. Do NOT continue the sweep, do
      NOT interpret, do NOT adjust any threshold. Report F1 and F2 together;
      the weaken/reject split of each is decided on the archived splitter
      alone (F1 against the sum form d^{q+1} + 2^{n'-r}; F2 against the
      conservative threshold n(n' - 1)/(n'(n + n' - r))). If the wrapper
      cannot re-verify the splitter's root list, that is an invalidation of
      the candidate's count under invalidation_rules, not F2, and the sweep
      likewise stops with the defect archived." The F1 rule is unchanged and
      takes precedence wherever both fire.
    - >-
      metrics.primary, M1: the phrase "over the Stage 1 exhaustive cells, the
      Stage 1b K-coefficient cells and the Stage 3 n = 131 cells" is REPLACED
      by "over the Stage 1 exhaustive cells, the Stage 1b K-coefficient cells,
      EVERY Stage 2 sweep cell (n, n', d) -- the ratio computed from the I2
      count of every candidate, not only the near-complete ones -- and the
      Stage 3 n = 131 cells". S1, P-A and P-C are thereby decidable from M1 as
      the contract claims; their text is unchanged.
  unchanged:
    - every cell, candidate set, instrument, seed, control, threshold and budget
    - every pre-registered exact value in preregistered_prediction (nothing is tuned; the prediction already asserted M1 <= 1 at Stage 2 and M1 = 1 at (7, 4))
    - the falsification conditions F0-F6 of H-QSP-5540d7 and of the contract; a Stage 2 F2 event is now recorded as also being the F1 event it already was
    - the F1 stopping rule, the F0/F5/F6 rules and every invalidation rule
  affected_runs: []
  confirmatory_status: preserved
  approved_by: coordinator
  approval_basis: >-
    Consistency correction to an approved contract before any run, under the
    AGENTS.md standing user authorization of 2026-09-06 and the original
    approval DEC-20260917-73c49a. It authorizes no run that DEC-20260917-73c49a
    did not, asserts nothing about H-QSP-5540d7, and re-scores nothing: no
    run of this contract has executed (experiments/EXP-QSP-33b442/runs/ is
    empty). specification.yaml is immutable and is bound by content in
    ledger/archives/TASK-20260917-0ef594.yaml; it is not edited.
  binding: >-
    The Executor under TASK-20260917-892420 executes specification.yaml
    version 1 as modified by this amendment, and the run manifest records
    contract version 2 with this file's path.
