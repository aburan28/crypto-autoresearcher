experiment:
  id: EXP-QSP-33b442
  hypothesis_id: H-QSP-5540d7
  version: 1
  title: >-
    THE TWISTED FROBENIUS-INJECTION BOUND, PRE-REGISTERED AND CERTIFIED: a
    five-stage, three-instrument test of N_K(X^{p^{n'}} - lambda(X)) <=
    max(d^{q+1}, p^{n'-r}) and its corollary beta >= n/(n + n' - r) -- a
    zero-compute hand re-derivation gate at (4, 3); exhaustive F_2 fixtures at
    (11,6), (13,7), (7,3), (11,4), (13,5) over all 252 lambda of degree 2..7
    per cell with brute enumeration, direct gcd and the injection count
    required to agree exactly; a seeded K-coefficient arm at n = 11 and 13; a
    complete-splitting sweep over prime n <= 31 with every splitter checked
    against the corollary; the n = 131 census at n' in {33, 44, 66} over every
    non-linearized lambda of degree 3..7 with an explicit root list per
    candidate as the certificate; and a rational-lambda fixture that either
    writes out the pole bookkeeping or records the extension as WITHDRAWN --
    against forced proves-too-much controls (subfield 64, Type 2 at n = 7 and
    n = 31, the Theorem 1 equality case) and a random-lambda null object
  status: approved
  status_note: >-
    Frozen at version 1 and approved on 2026-09-17 by the Coordinator decision
    DEC-20260917-73c49a. The approval basis is the STANDING USER AUTHORIZATION
    recorded in AGENTS.md, "Standing user authorization for ideas and
    experiments" (user instruction of 2026-09-06: ideas and experiments are
    always approved; the Coordinator does not ask the user to confirm a frozen
    protocol). User authorization being already satisfied, what the Coordinator
    verified before recording approval is PROTOCOL READINESS: every field of
    this contract is non-null, the controls, metrics, budget, stopping rules,
    invalidation rules, artifact paths and assignment are present, and the
    success and falsification criteria are both decidable from the metrics
    listed here. Approval authorizes the work; it asserts nothing about the
    truth of H-QSP-5540d7 and validates no result. No run of this contract was
    authorized before this mark; execution proceeds under TASK-20260917-892420,
    which may not be dispatched until the snapshot archive TASK-20260917-0ef594
    has committed and verified this file. Any change after this point requires a
    versioned protocol_amendment under
    experiments/EXP-QSP-33b442/amendments/; the pre-registered prediction below
    is NEVER edited after a run, and no run already executed is re-scored
    against a later prediction.
  source_proposal: IDEA-20260916-5c9d6e
  objective: >-
    Produce, under the harness and with manifests, the certificate-bearing
    numerical half of the derivation-tier claim H-QSP-5540d7: that for
    K = F_{p^n}, L = X^{p^{n'}} - lambda(X) with lambda in K[X] of degree
    d >= 1, n = q n' + r with 0 <= r < n' and the difference polynomial
    D(Y) = Lambda_{q+1}(Y) - Y^{p^{n'-r}} nonzero, the number of DISTINCT
    K-roots satisfies N_K(L) <= max(d^{q+1}, p^{n'-r}); and that every
    completely splitting such L with r >= 1 has quality beta = l n / n'^2 at
    least n/(n + n' - r) (a fortiori at least n(n' - 1)/(n'(n + n' - r))). The
    numbers this experiment produces cannot prove the bound -- the bound is a
    derivation, quantified over all p, n, n', lambda -- but they can REFUTE it,
    and they are the only way the program obtains an exact, certified,
    reproducible count at the three n = 131 cells (n' in {33, 44, 66}) that
    RQ-QSP-f9bbdb left open, together with the instrument agreement that makes
    every other count in this program's QSP line readable. Every outcome is a
    result: the bound holding on every cell with instruments in agreement
    supports H-QSP-5540d7 at derivation tier pending independent review; a
    single certified violation falsifies or weakens it exactly as
    falsification_criterion states. NO ATTACK IS RUN. No curve is touched, no
    key is involved, no point arithmetic occurs anywhere in this contract.
  class: >-
    proof-oriented pre-registered-prediction experiment. The nearest template
    pattern is heuristic-validation and the record is written in that shape, but
    what is pre-registered is not a heuristic's statistical prediction: it is a
    DERIVED INEQUALITY (the injection bound and its beta corollary), taken
    verbatim from the derivation in H-QSP-5540d7 (A) and (B) before any number
    is produced, and never tuned to a run. The experiment's only statistical
    component is the null-object arm, which tests H2 and nothing load-bearing.
  inputs:
    code_reuse: >-
      The code under analysis/qsp-ecc2k130/explore/ (qsp_explore.py, gf2rc.c,
      shape_census_131.py) MAY be reused, copied, or adapted under
      experiments/EXP-QSP-33b442/implementation/, including the parser fix
      recorded in the note's "Corrections 2026-09-17" section. BUT: EVERY NUMBER
      REPORTED BY THIS EXPERIMENT MUST BE PRODUCED BY THIS EXPERIMENT'S OWN RUNS
      UNDER THE HARNESS, with a manifest carrying the AGENTS.md artifact-policy
      fields. The JSON files under analysis/qsp-ecc2k130/explore/
      (explore.json, explore_fast.json, shape_census_131.json) and the tables in
      that README are CONTEXT and the source of the pre-registered values; they
      are NOT artifacts of this experiment, may not be copied into
      experiments/EXP-QSP-33b442/runs/, and may not be cited as its results. A
      reported value that matches the analysis note is a reproduction; a
      reported value that was read out of the analysis note is fabrication under
      AGENTS.md core rule 5.
    field_models:
      K_toy: >-
        F_2[z]/(f_n) for each tested n, with f_n an irreducible degree-n
        polynomial over F_2 recorded explicitly in the run output for every
        cell; the choice of f_n is irrelevant to every counted quantity (all
        such fields are isomorphic) and is archived so the run is reproducible.
      K_131: >-
        F_2[z]/(z^131 + z^13 + z^2 + z + 1), the ECC2K-130 field polynomial of
        RQ-QSP-f9bbdb. No curve, no group, no point is constructed.
      polynomial_arithmetic: >-
        GF(2)[X] on bit-packed integers (multiplication, modular squaring
        chains, gcd, distinct-degree factorisation) for F_2-coefficient arms;
        K[X] arithmetic over the declared K for the K-coefficient arm.
    instruments:
      I1_brute_enumeration: >-
        Enumerate every element x of K and count those with x^{2^{n'}} =
        lambda(x). Exact and assumption-free; feasible only at small n (used at
        n <= 13 in full, and as a spot check elsewhere as declared per stage).
      I2_direct_gcd: >-
        N = deg gcd(X^{2^n} - X, L) computed in F_2[X] (or K[X] for the
        K-coefficient arm) by the repeated-squaring construction of X^{2^n} mod
        L followed by a gcd. Counts DISTINCT K-roots by construction.
      I3_injection_count: >-
        Build the twisted iterates Lambda_1 = lambda, Lambda_{k+1} =
        Lambda_k^{(n')} o lambda up to k = q + 1, form D(Y) = Lambda_{q+1}(Y) -
        Y^{2^{n'-r}}, take its K-roots (via gcd(X^{2^n} - X, D) and root
        extraction, or per Frobenius orbit at n = 131), and then apply the
        CLOSING TEST: retain only those roots x with L(x) = 0. The retained set
        is the certified root set of L in K; the discarded count is the SLACK of
        the bound at that candidate and is reported.
      degenerate_detection: >-
        D = 0 is detected symbolically (not by a numeric tolerance). A candidate
        with D = 0 is reported in a separate degenerate list with its
        characterisation (lambda = c X^{2^j} + b, L = M^{2^j}) and is excluded
        from the M1 ratio, per H-QSP-5540d7 assumption 1.
    stage_0:
      name: hand re-derivation gate
      compute: ZERO. No program is run in this stage.
      content: >-
        Re-derive by hand, and archive as a derivation note: (i) f(z)^{p^k} =
        f^{(k)}(z^{p^k}); (ii) x^{p^{(k+1)n'}} = Lambda_{k+1}(x) for every root
        x of L; (iii) for x in K, (q+1)n' = n + (n' - r) gives x^{p^{n'(q+1)}}
        = x^{p^{n'-r}}, hence D(x) = 0; (iv) deg D <= max(d^{q+1}, p^{n'-r});
        (v) the degenerate case D = 0 forces lambda = c X^{p^j} + b and
        L = M^{p^j} with deg M = p^{n'-j}; (vi) the beta corollary; (vii) the
        symbolic slices of proof_search_map.baseline_embedding (Lemma 4.1
        incomparability, the two tightness slices, the r = 0 vacuity slice) and
        method_ceiling (n' | n known-false object, Type 2 at n = 127, n = 129).
      numeric_gate: >-
        At (n, n') = (4, 3) (q = 1, r = 1, bound max(d^2, 4)): for lambda =
        X^2 + X + 1 the hand count of K-roots is 1 and the injection count is 1;
        for lambda = X^3 + 1 the hand count is 0 and the injection count is 0
        with D having 2 K-roots, both failing the closing test (slack 2). These
        two cells are worked BY HAND in the derivation note and then, in Stage 1,
        recomputed by all three instruments; the two must agree.
      gate: >-
        If any identity in (i)-(vi) fails on re-derivation, or the (4, 3) hand
        count disagrees with the instrument, STOP before Stage 1 and report F0.
    stage_1:
      name: exhaustive F_2 fixtures with three-instrument agreement
      cells: >-
        (n, n') in {(11, 6) [q=1, r=5], (13, 7) [q=1, r=6], (7, 3) [q=2, r=1],
        (11, 4) [q=2, r=3], (13, 5) [q=2, r=3]}
      candidates: >-
        EVERY lambda in F_2[X] of exact degree d for d = 2..7: 2^d per degree,
        252 per cell, 1260 candidates in total. No sampling, no ordering
        dependence, no seed.
      requirement: >-
        For EVERY candidate, all three instruments (I1 brute enumeration over
        all 2^n elements of K, I2 direct gcd, I3 injection count with the
        closing test) are run and must return the SAME N. Agreement is not a
        spot check at this stage: it is required on all 1260 candidates, and any
        disagreement invalidates the run (F5).
      recorded_per_candidate: >-
        lambda (as a bit-packed integer and as a printed polynomial), d, q, r,
        N, the bound max(d^{q+1}, 2^{n'-r}), the ratio N/bound, the number of
        K-roots of D, the slack (D-roots failing the closing test), whether
        lambda is linearized, whether lambda is a square (lambda' = 0, so L has
        repeated roots and N counts distinct roots), and whether D = 0.
    stage_1b:
      name: K-coefficient random fixture (null object and coefficient generality)
      cells: 'n = 11 with n'' = 6; n = 13 with n'' = 7; d in {3, 5, 7} at each n (6 cells)'
      draws: 200 uniformly random lambda in K[X] of EXACT degree d per cell; 1200 draws total
      seed: 20260917, with a named sub-stream per (n, n', d) cell recorded in the manifest
      sample_size_justification: >-
        The bound is a universally quantified inequality, so a random sample can
        only REFUTE it, never confirm it; the sample size is therefore chosen for
        refutation power, not for an estimator's variance. 200 draws per cell
        detect a per-draw violation rate of 1.5% with probability 0.951
        (1 - 0.985^200); the 1200 draws jointly detect a per-draw violation rate
        of 0.25% with probability 0.950 (1 - 0.9975^1200). Those are the
        smallest violation rates this arm is powered to see and they are stated
        in advance so that "no violation in 1200 draws" is read as exactly that
        and not as a proof. This arm carries the twisted iterates Lambda_k^{(n')}
        with NON-trivial coefficient twists (lambda outside F_2), which the
        exhaustive F_2 arms cannot exercise at all.
      instruments: 'I2 and I3 on every draw; I1 on every fifth draw at n = 11 (2048 elements per check)'
      null_role: >-
        This arm is also the NULL OBJECT for the census: random lambda under the
        same ceiling as the structured ones, with its N-histogram and orbit
        counts reported against H2's Poisson(1/n) model.
    stage_2:
      name: complete-splitting sweep
      cells: >-
        n prime in {7, 11, 13, 17, 19, 23, 29, 31}; 2 <= n' <= 15 with n' < n
        and n' NOT dividing n (n prime, so this excludes only n' = 1 and
        n' = n); 2 <= d <= min(8, 2^{n'} - 1); every lambda in F_2[X] of exact
        degree d.
      instrument: 'I2 for the sweep; I3 on every candidate with N >= 2^{n''-1}; I1 where 2^n enumeration is affordable'
      recorded: >-
        Every candidate with N >= 2^{n'-1} (near-complete) is listed in full
        with (n, n', d, q, r, N, bound, beta, the exact corollary value, the
        conservative corollary value). Every COMPLETE splitter (N = 2^{n'}) is
        listed separately with (n, n', d, beta) and both corollary values, and
        every one is checked against BOTH thresholds.
      thresholds: >-
        beta := l n / n'^2 with l = log_2 d. PRIMARY (exact corollary of the max
        form, H-QSP-5540d7 (B)): beta >= n/(n + n' - r). FALLBACK (the
        proposal's conservative form, implied by the primary): beta >=
        n(n' - 1)/(n'(n + n' - r)). Both are computed and reported for every
        complete splitter. The success criterion is evaluated on the PRIMARY
        threshold, which is the stronger of the two, so a pass on it entails a
        pass on the conservative form; a splitter that fails the primary but
        satisfies the conservative form WEAKENS the record to the sum form
        rather than rejecting it (see falsification_criterion F2). This double
        reporting is deliberate: the approval task card named the conservative
        formula as "the exact corollary" while H-QSP-5540d7 (B) names
        n/(n + n' - r) as exact and n(n' - 1)/(n'(n + n' - r)) as the fallback,
        and checking both loses no reading either way.
    stage_3:
      name: the n = 131 census with root-list certificates
      field: 'F_2[z]/(z^131 + z^13 + z^2 + z + 1)'
      cells: >-
        n' = 33 (q = 3, r = 32, bound max(d^4, 2)); n' = 44 (q = 2, r = 43,
        bound max(d^3, 2)); n' = 66 (q = 1, r = 65, bound max(d^2, 2))
      candidates: >-
        EVERY non-linearized lambda in F_2[X] of exact degree 3..7: 248 of exact
        degree 3..7 in total, minus the 4 linearized ones (the degree-4
        X^4 + aX^2 + bX), = 244 candidates per n', 732 in total. Affine lambda
        (linearized plus a constant) ARE included and are marked as such.
        Linearized lambda are EXCLUDED from the census and handled by the
        linearized control instead.
      instrument: >-
        I3 only (I1 and I2 are infeasible at deg L = 2^{n'}): the injection
        count with the PER-ORBIT closing test -- the K-roots of D are taken
        orbit by orbit under the 2-Frobenius, and each orbit representative x is
        tested for L(x) = 0 in K, so an orbit is retained or discarded as a
        whole and the orbit structure is recorded.
      certificate: >-
        Per candidate, an EXPLICIT ROOT LIST: every retained x written out as
        its coefficient vector over F_2[z]/(z^131 + ...), grouped into Frobenius
        orbits, together with the count of D-roots discarded by the closing test
        (the slack). The run wrapper INDEPENDENTLY re-verifies every listed root
        by evaluating x^{2^{n'}} - lambda(x) in K and asserting zero, and
        re-verifies that the listed roots are pairwise distinct; the
        re-verification result is recorded per candidate. A count without a
        re-verified root list is not a result of this experiment
        (docs/claims-and-verification.md; AGENTS.md core rule 4).
      recorded: >-
        Per candidate: N, the bound, the ratio, the orbit decomposition (sizes
        and count), the slack, the degenerate flag, and the certificate path.
        Per cell: the full histogram of N and the count of orbit-carrying
        candidates.
    stage_4:
      name: the rational-lambda conjecture check ((D)(ii) of H-QSP-5540d7)
      cells: '(n, n'') = (11, 6) [q = 1, r = 5] and (23, 12) [q = 1, r = 11]'
      draws: >-
        200 random coprime pairs (a, b) in F_2[X] with deg a <= 3, deg b <= 3,
        b != 0, d = max(deg a, deg b) >= 1, per cell; seed 20260917 with a named
        sub-stream per cell.
      measurement: >-
        The exact count of x in K with x^{2^{n'}} b(x) = a(x) (equivalently the
        K-roots of X^{2^{n'}} b(X) - a(X) with b(x) != 0), against the
        CONJECTURED bound d^{q+1} + 2^{n'-r} + q d^q (at d <= 3, q = 1:
        9 + 2 + 3 = 14).
      obligation: >-
        EITHER the pole bookkeeping of (D)(ii) is written out in the Stage 5
        report as a derivation note -- stating exactly how many chain steps can
        meet a pole and why the count is at most q d^q -- OR the extension
        (D)(ii) is recorded as WITHDRAWN in the report. There is no third
        outcome: a fixture that passes without the bookkeeping written out
        leaves the extension conjectural and it is recorded as withdrawn-as-
        stated. Either way, (A) and (B) are untouched by this stage.
    stage_5:
      name: the report
      content: >-
        The closure block of docs/inventor-protocol.md section 4 (named
        obstruction, argument, forward guidance) filled from the Stage 1-4
        numbers with the scope stated exactly; the obstruction block of
        templates/research-records.md with statement, quantity, value with
        units, measured_by run IDs, scope, and a completed resource_check
        (examined / reading / spawned_ids); the instrument agreement matrix; the
        per-stage gate record; and an explicit statement of what was MEASURED
        versus what is ARITHMETIC on the derivation.
  controls:
    - name: 'C1 -- r = 0 subfield control, (n, n'', lambda) = (12, 6, X)'
      role: blocking (proves-too-much; known-false object)
      detail: >-
        n' = 6 DIVIDES n = 12, so r = 0 and the conclusion of (B) is KNOWN
        FALSE here (Diem's subfield family splits completely at d = 1). The
        bound must become vacuous -- max(d^{q+1}, 2^{n'}) = 64 >= deg L -- and
        the instrument must return the FORCED count N = 64 (the roots of
        X^64 + X are exactly F_64 subset F_{2^12}). Any other count is an
        instrument failure and invalidates the run (F5). An argument that
        excluded this object would have proved too much.
    - name: 'C2 -- Type 2 at n = 7: (7, 3, lambda = X^2 + X)'
      role: blocking (tightness; forced count)
      detail: >-
        FORCED N = 8 = 2^3. The bound max(2^3, 2^2) = 8 is ATTAINED, and
        beta = 7/9 equals the exact corollary 7/(7 + 3 - 1) exactly. A count
        other than 8 invalidates the run (F5); attainment failing while the
        count is correct falsifies the tightness claim of H-QSP-5540d7 (C)
        without touching the bound (F3).
    - name: 'C3 -- Type 2 at n = 31: (31, 15, lambda = X^{2^7} + X^{2^3} + X^2 + X)'
      role: blocking (forced count at scale; published family)
      detail: >-
        FORCED N = 32768 = 2^15. q = 2, r = 1, d = 2^7, so the bound is
        max(2^21, 2^14) = 2^21 >= 2^15: the published family must be ADMITTED
        with room, not excluded. A count other than 32768 invalidates the run.
    - name: 'C4 -- the Theorem 1 equality case: X^4 + X^2 + X over F_8 (n = 3, n'' = 2, lambda = X^2 + X)'
      role: blocking (tightness; forced count)
      detail: >-
        FORCED N = 4 = 2^2. q = r = 1, bound max(2^2, 2^1) = 4, ATTAINED, and
        beta = 3/4 equals both the exact corollary 3/(3 + 2 - 1) and Theorem 1
        of KN-LIT-4fe9d2. A count other than 4 invalidates the run.
    - name: C5 -- random K-coefficient null object (Stage 1b)
      role: blocking (null object before belief)
      detail: >-
        1200 uniformly random lambda in F_{2^11}[X] and F_{2^13}[X] run through
        the SAME instruments as the structured arms. The null lives under the
        same ceiling by construction ((A) holds for every lambda), so what this
        control tests is that the structured cells are not an artifact of the
        instrument and that the N-histogram and orbit counts of a
        no-structure arm match H2's Poisson(1/n) / Binomial(2, 1/2) model. A
        null arm exceeding the bound is F1 exactly as a structured arm would be.
    - name: C6 -- linearized arm decided independently
      role: blocking (independent decision procedure)
      detail: >-
        For lambda LINEARIZED with F_2 coefficients, L = L_f is a linearized
        polynomial and Proposition 2 of KN-LIT-4fe9d2 decides complete splitting
        independently of anything in this contract (an F_2-coefficient
        linearized L_f splits completely iff f divides X^n - 1); Theorem 1 of
        the same paper caps beta >= 3/4 on that slice. Every linearized
        candidate encountered in Stage 1, Stage 1b and Stage 2 is cross-checked
        against Proposition 2, and a disagreement between the instrument and
        Proposition 2 invalidates the run (F5). Linearized lambda are EXCLUDED
        from the Stage 3 census (which is about the non-linearized shapes
        RQ-QSP-f9bbdb left open) and are reported separately wherever they occur.
  independent_variables:
    - 'stage / arm (0, 1, 1b, 2, 3, 4, and the control id C1-C6)'
    - 'the pair (n, n''), hence q = floor(n/n'') and r = n mod n'''
    - 'deg lambda = d'
    - 'the candidate lambda itself (exhaustive within a cell, or a seeded draw)'
    - 'coefficient field of lambda: F_2 (exhaustive arms) or K = F_{2^n} (Stage 1b)'
    - 'counting instrument: I1 brute enumeration / I2 direct gcd / I3 injection count with the closing test'
    - 'shape: polynomial lambda (Stages 0-3) or rational lambda = a/b (Stage 4)'
  metrics:
    primary:
      - >-
        M1 -- per cell (n, n', d): the MAXIMUM over lambda of the ratio
        N_K(L) / max(d^{q+1}, 2^{n'-r}), together with the attaining lambda,
        over the Stage 1 exhaustive cells, the Stage 1b K-coefficient cells and
        the Stage 3 n = 131 cells. Degenerate candidates (D = 0) are excluded
        from the ratio and listed separately with N and the trivial bound
        2^{n'-j}.
      - >-
        M2 -- the three-instrument AGREEMENT MATRIX: over the 1260 Stage 1
        candidates (5 cells x 252 lambda), the number of candidates on which
        I1, I2 and I3 do not all return the same N, reported as a matrix of
        pairwise disagreement counts with every disagreeing candidate listed in
        full; plus the same matrix for the Stage 1b subset on which more than
        one instrument was run.
      - >-
        M3 -- the COMPLETE-SPLITTER LIST from Stage 2: every L with
        N = 2^{n'} at r >= 1, with (n, n', d, q, r, beta), the exact corollary
        value n/(n + n' - r), the conservative corollary value
        n(n' - 1)/(n'(n + n' - r)), and the two differences beta - exact and
        beta - conservative; plus the near-complete list (N >= 2^{n'-1}) with
        the same columns.
      - >-
        M4 -- the n = 131 CENSUS: per candidate (244 per n', n' in {33, 44,
        66}) the exact N_K(L) with its explicit, independently re-verified root
        list, the Frobenius-orbit decomposition, the slack, and N against the
        bound d^{q+1}; per cell the full histogram of N and the number of
        orbit-carrying candidates.
    secondary:
      - >-
        M5 -- the Stage 4 rational-lambda counts: per draw, #{x in K :
        x^{2^{n'}} b(x) = a(x)} against the conjectured bound
        d^{q+1} + 2^{n'-r} + q d^q, with the maximum over draws per cell and the
        distribution of counts.
      - >-
        M6 -- the FORCED FIXTURE counts through the same instruments: C1 = 64,
        C2 = 8, C3 = 32768, C4 = 4, each reported as measured value versus
        forced value.
      - >-
        M7 -- ARITHMETIC ON (B), REPORTED AND LABELLED AS NOT MEASURED: the
        smallest beta admitted at n = 131 over n' in 2..130, the beta at the ten
        n' with 131 = -1 mod n', and the Proposition 8 exponent of KN-LIT-4fe9d2
        evaluated at those beta with kappa = 4.876, against rho's 2^60.9
        (KN-LIT-096). Every row of this table is a closed-form evaluation of the
        corollary, not a measurement, and is printed in a separate section of
        the output so it can never be mistaken for one.
      - >-
        M8 -- slack statistics: per candidate and per cell, the number of
        K-roots of D discarded by the closing test, with the per-cell maximum
        and mean. Large slack at small n calibrates how loose (A) is and is the
        quantity a later sharpening would attack.
      - >-
        M9 -- null-object statistics for C5 and the Stage 3 census: the
        N-histogram, the number of orbit-carrying candidates, and the upper-tail
        probability of that number under H2's Poisson model at the cell's mean.
      - >-
        M10 -- per-cell resource measurements (wall clock, peak RSS, candidate
        throughput) for every stage, so the cost of the census is recorded for
        the next census rather than re-discovered.
  heuristic_under_test: H2
  heuristic_under_test_note: >-
    H2 (the null-object model: for uniformly random lambda of degree d the
    number of size-n Frobenius orbits of K-roots is approximately Poisson with
    mean 1/n, and over C candidates the number of orbit-carrying candidates is
    approximately Poisson(C/n)) is the ONLY heuristic this contract tests, and
    it is not load-bearing for (A) or (B): the bound holds for every lambda,
    random or structured, so a refutation of H2 at some cell is an unexpected
    observation reported under AGENTS.md rule 8 and is NOT evidence about the
    bound. H1 (the Proposition 8 / M(E) cost model under which the closure
    reading (E) is stated) is NOT tested here and CANNOT be tested here: its
    validation route is the scheduled IDEA-20260916-b84e2d, whose engine
    impediment (no Groebner or resultant engine in the container) is recorded in
    analysis/qsp-ecc2k130/explore/README.md and must be resolved before that
    experiment is designed. Until H1 is validated, the closure reading (E) of
    H-QSP-5540d7 stays CONDITIONAL whatever this experiment returns, and no
    result of this contract may be reported as validating it.
  preregistered_prediction:
    quantity: >-
      (P-A) For every non-degenerate candidate at every cell of Stages 1, 1b, 2
      and 3: N_K(L) <= max(d^{q+1}, 2^{n'-r}), i.e. M1 <= 1 everywhere. (P-B)
      For every complete splitter at r >= 1 in Stage 2: beta >= n/(n + n' - r)
      (and a fortiori beta >= n(n' - 1)/(n'(n + n' - r))), i.e. both M3
      differences are >= 0. (P-C) The bound is ATTAINED (M1 = 1) at (7, 3) and
      at (7, 4), and exceeded NOWHERE. (P-D) Instrument agreement: M2 = 0
      disagreements. (P-E) Forced fixtures: M6 = (64, 8, 32768, 4) exactly.
      (P-F) Stage 4: every draw at or below d^{q+1} + 2^{n'-r} + q d^q.
    formula: >-
      N_K(L) <= max(d^{q+1}, p^{n'-r}) with n = q n' + r, 0 <= r < n',
      D(Y) = Lambda_{q+1}(Y) - Y^{p^{n'-r}} != 0, Lambda_1 = lambda,
      Lambda_{k+1} = Lambda_k^{(n')} o lambda; and, for N = p^{n'} with r >= 1,
      (q+1) log_p d >= n' hence beta = n log_p d / n'^2 >= n/((q+1) n') =
      n/(n + n' - r) > 1/2. Rational-lambda conjecture (Stage 4 only):
      #{x in K : x^{p^{n'}} b(x) = a(x)} <= d^{q+1} + p^{n'-r} + q d^q.
      PRE-REGISTERED EXACT VALUES, taken from the pre-compute audit
      analysis/qsp-ecc2k130/explore/README.md and reproduced from scratch by
      the run (the audit numbers are context, never evidence, and the run's own
      numbers are the only results): M1 <= 0.52 at (11, 6), <= 0.56 at (13, 7),
      = 1.00 at (7, 3), <= 0.25 at (11, 4) and <= 0.25 at (13, 5); Stage 2
      complete splittings occur ONLY at (n, n') in {(7, 3), (7, 4), (31, 5),
      (31, 6)}, 356 near-complete rows and 65 complete splitters, 0 violations;
      Stage 3 max N = 132 at n' = 33 with histogram {0: 62, 1: 118, 2: 60,
      132: 4} and the four N = 132 candidates X^7 + X^2, X^7 + X^5 + 1,
      X^7 + X^6 + X^3 + X^2, X^7 + X^6 + X^5 + X^4 + X^3 + X + 1; max N = 2 at
      n' = 44 and at n' = 66, each with histogram {0: 62, 1: 122, 2: 60}. A
      deviation from a pre-registered exact value is NOT a falsification of the
      bound; it is a discrepancy between two independent computations of the
      same quantity, is reported as such, and is localised before any
      interpretation.
    source: >-
      The derivation in H-QSP-5540d7 (A) and (B), itself sharpening
      IDEA-20260916-5c9d6e (A)/(B) (max form in place of the sum form; exact
      corollary n/(n + n' - r) in place of n(n' - 1)/(n'(n + n' - r))), which
      builds on Lemma 4.1 and Appendix A.2 of KN-LIT-0a321c and is cross-checked
      against Theorem 1, Proposition 2, Proposition 5 (Types 1, 1bis, 2),
      Proposition 6 and Proposition 8 of KN-LIT-4fe9d2, and against
      CORR-20260916-8d0b81 for the F_2-coefficient slice. The prediction is a
      DERIVED INEQUALITY fixed before any run of this contract. FROZEN: it is
      never tuned to an observation; any adjustment requires a versioned
      protocol_amendment under experiments/EXP-QSP-33b442/amendments/, and runs
      already executed are never re-scored against a new prediction.
  scale_relevance:
    tier: toy
    justification: >-
      THE BOUND ITSELF NEEDS NO TRANSFER ASSUMPTION AND MAKES NO SCALE CLAIM.
      (A) and (B) are proved for every p, every n, every n' with n' not dividing
      n, and every lambda in F_{p^n}[X] with D != 0; the derivation is the
      evidence for the general statement and the numerical cells are not a
      sample from which the general statement is extrapolated. What the
      numerical cells do is REFUTATION-SEEKING plus CERTIFICATION: (i) the toy
      cells (n <= 31, p = 2) are chosen because exhaustive enumeration over all
      lambda of degree 2..8 and, at n <= 13, over all 2^n field elements is
      affordable, so a violating lambda would be FOUND if it existed in that
      range, and three independent instruments can be required to agree
      exactly -- an assurance no large cell can offer; (ii) the n = 131 cells
      at n' in {33, 44, 66} are EXACT COUNTS AT THE TARGET PARAMETER of
      RQ-QSP-f9bbdb, with explicit re-verified root lists, and are therefore
      cryptographic-scale certificates about exactly 3 x 244 = 732 named
      polynomials, not toy evidence extrapolated upward. The tier label is
      `toy` because the bulk of the candidate mass is toy; the Stage 3 cells are
      declared separately in the record as exact counts at n = 131. THE TWO
      TRANSFERS THAT ARE NOT LICENSED, stated: p = 2 in every numerical cell,
      and the move to general p is by the derivation and NEVER by measurement;
      and the Stage 3 census certifies exactly the 732 enumerated lambda -- every
      other lambda in F_{2^131}[X] at those n' is covered by the bound (a
      derivation), not by a list. No statement about any deployed curve, and no
      attack, follows from any number in this contract.
    correspondence: >-
      NONE AND NONE NEEDED. Every quantity is counted directly in the stated
      field by exhaustive enumeration, gcd, or certified root extraction; no
      sampling correspondence, no isometry claim, and no surrogate object stands
      between the measurement and the quantity. The only sampling anywhere
      (Stages 1b and 4) is a uniform draw from an explicitly described finite
      set, with the seed recorded, and its role is refutation power, stated
      under stage_1b.sample_size_justification.
  tail_checks:
    - >-
      ATTAINMENT TAIL: the bound must be ATTAINED (ratio exactly 1) at (7, 3)
      -- by X^2 + X and X^2 + X + 1, each with N = 8 -- and at (7, 4) by the
      d = 4 complete splitters with N = 16, and must be EXCEEDED NOWHERE. A
      bound attained nowhere at any cell is reported as loose by the observed
      factor (it does not falsify (A), but it weakens the tightness claim of
      (C)); a bound exceeded anywhere is F1.
    - >-
      ORBIT TAIL AT n = 131: the number of orbit-carrying candidates per cell
      (244 candidates, Poisson mean 244/131 = 1.86 under H2) must be consistent
      with that null. The pre-registered observation is 4 at n' = 33 (upper-tail
      probability about 0.11 -- consistent, and explicitly NOT evidence of
      structure) and 0 at n' = 44 and n' = 66. A count whose upper-tail Poisson
      probability falls below 0.01 refutes the null MODEL H2 at that cell and is
      reported as an unexpected observation; it does not bear on (A), whose
      ceiling (at most d^{q+1}, i.e. at most 2401 / 343 / 49) holds regardless,
      and it is not evidence of a large factor base.
    - >-
      MAXIMUM TAIL: the single largest N/bound ratio observed over ALL cells and
      arms, and the single largest N observed at n = 131, each reported with its
      candidate. A real violation shows up as a candidate above 1, not as a
      distributional drift.
    - >-
      SLACK TAIL: the largest slack (D-roots failing the closing test) over all
      candidates per cell, as the calibration of how far the bound sits above
      the truth at the cells where both are computable.
    - >-
      NULL TAIL: the largest N observed in the C5 random K-coefficient arm per
      cell against the same cell's bound, and its N-histogram against H2.
  replication:
    seeds:
      base_seed: 20260917
      stage_1b_streams: >-
        one named sub-stream per (n, n', d) cell, derived deterministically from
        the base seed and the cell label and printed in the manifest; no cell is
        ever silently re-drawn
      stage_4_streams: >-
        one named sub-stream per (n, n') cell, derived the same way and printed
        in the manifest
      seed_free_arms: >-
        Stages 0, 1, 2 and 3 and every control are EXHAUSTIVE and seed-free:
        they enumerate a fully specified finite candidate set and depend on no
        random choice at all. Re-running them on any machine must reproduce
        every number bit for bit; that is the replication guarantee for the
        load-bearing arms.
    independent_instances: >-
      3 for the load-bearing Stage 1 counts (three independent instruments I1,
      I2, I3 on each of 1260 candidates, required to agree exactly); 2 at
      n = 131 (the injection count and the wrapper's independent root
      re-verification of the emitted certificate); 1200 independent random draws
      across the 6 Stage 1b cells and 400 across the 2 Stage 4 cells.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4
    maximum_memory_gb: 4
    maximum_runs: 6
    maximum_workers: 1
    note: >-
      ADVISORY per docs/research-budget-policy.md and the CLAUDE.md research
      budget instruction of 2026-09-06: time and CPU estimates are advisory,
      may be exceeded with the overrun recorded, and require no further user
      approval. The memory cap (4 GB) and the worker count (1) are MACHINE
      PROTECTION and are real limits. A run is one stage invocation. Estimates
      from the pre-compute audit, which ran the same arithmetic outside the
      harness: Stage 0 zero compute; Stage 1 + Stage 1b + Stage 2 a few minutes
      each; Stage 3 the dominant cost (732 candidates through the injection
      count with per-orbit closing tests at deg L = 2^{n'}), of order one hour;
      Stage 4 seconds. maximum_runs 6 covers the five compute stages plus one
      re-invocation for infrastructure failure, each recorded. Budget exhaustion
      is an infrastructure outcome (F6), never evidence.
  stopping_rules:
    - 'Stage 0 gate fails (an identity does not re-derive, or the (4, 3) hand check disagrees with the instrument): STOP before any other stage; archive the failing derivation step; report F0. No later number is produced or reported.'
    - 'Any forced fixture (C1 = 64, C2 = 8, C3 = 32768, C4 = 4) returns another value: STOP; the instrument is not calibrated; archive the measured value and the candidate; report F5. No count from that instrument is reported as a result.'
    - 'Instrument disagreement at any Stage 1 candidate: STOP the stage; archive the candidate and all three instrument outputs; report F5 and return to the Coordinator. The run is invalid, not the hypothesis.'
    - 'A certified violation of the bound (a candidate with N > max(d^{q+1}, 2^{n''-r}) whose root list the wrapper re-verifies): STOP the stage, archive the certificate and the candidate, and return immediately. Do NOT continue sweeping, do NOT interpret, and do NOT adjust any threshold; this is F1 and it is the most valuable outcome this contract can produce.'
    - 'A complete splitter with beta below the exact corollary in Stage 2: archive it with both corollary values and continue the sweep to completion (the full list is what makes the weaken/reject split decidable), then STOP before Stage 3 and return. This is F2.'
    - 'Stage 4 exceeds the conjectured rational bound on any draw: archive the draw, complete the cell, and record (D)(ii) as WITHDRAWN as stated in the report. (A) and (B) are untouched and the remaining stages proceed.'
    - 'Budget exhaustion, timeout, crash, or the memory cap before a stage completes: STOP and record F6 as an INFRASTRUCTURE outcome under AGENTS.md rule 3/5, with the partial per-candidate output archived as a checkpoint. It is never evidence about (A) or (B), and a stage that did not finish is reported as unfinished, never estimated.'
  invalidation_rules:
    - 'INSTRUMENT DISAGREEMENT at any Stage 1 cell (I1, I2, I3 not all equal on any candidate) invalidates the run. The run returns to the Executor with the disagreeing candidates listed; nothing about (A) is concluded from an invalid run.'
    - 'A FIXTURE RETURNING THE WRONG FORCED COUNT (C1 != 64, C2 != 8, C3 != 32768, C4 != 4) invalidates every count produced by that instrument in that run.'
    - 'A root list that the wrapper cannot independently re-verify (a listed x with x^{2^{n''}} != lambda(x), or a duplicate in a list of distinct roots) invalidates the candidate''s count and, if it recurs, the stage.'
    - 'A linearized candidate whose instrument count contradicts Proposition 2 of KN-LIT-4fe9d2 invalidates the run (two independent decision procedures cannot both be right).'
    - 'A candidate count read from analysis/qsp-ecc2k130/explore/ rather than produced by this run invalidates the record entirely and is a violation of AGENTS.md core rule 5.'
    - 'A run whose manifest is missing any AGENTS.md artifact-policy field (exact command, git commit and dirty-tree state, environment and dependency versions, inputs and seeds, requested policy and resolved model with probe status, reasoning effort, fallback and degraded flags, stdout/stderr, raw results, validity status and reason, timestamps and resource measurements) is schema-incomplete and is not evidence until re-run or amended.'
    - 'TIMEOUTS, CRASHES, MEMORY-CAP KILLS AND BUDGET EXHAUSTION ARE INFRASTRUCTURE OUTCOMES AND ARE NEVER NEGATIVE MATHEMATICAL EVIDENCE (AGENTS.md rule 3). They invalidate the affected stage''s completeness, not the hypothesis.'
    - 'Any gate failure archives its evidence (the failing value, the candidate, the instrument outputs) BEFORE stopping.'
  success_criterion: >-
    DECIDABLE FROM THE METRICS ABOVE ALONE, with no post-hoc threshold. SUCCESS
    requires ALL FIVE: (S1) M1 <= 1 at EVERY cell of Stages 1, 1b, 2 and 3 --
    the bound holds on every non-degenerate candidate, with degenerate
    candidates listed separately and each satisfying the trivial bound
    N <= 2^{n'-j} < 2^{n'}; (S2) M2 = 0 -- the three instruments agree on all
    1260 Stage 1 candidates and wherever else more than one was run; (S3) M6 =
    (64, 8, 32768, 4) exactly -- every forced fixture is forced; (S4) M3 shows
    NO complete splitter with beta below the exact corollary n/(n + n' - r)
    (which entails none below the conservative n(n' - 1)/(n'(n + n' - r))); and
    (S5) the Stage 0 hand check passes and every Stage 3 root list is
    independently re-verified by the wrapper. If all five hold, the honest
    headline is: 'H-QSP-5540d7 is SUPPORTED AT DERIVATION TIER PENDING
    INDEPENDENT REVIEW -- a checkable argument, 1260 exhaustive toy candidates
    under three agreeing instruments, 65 complete splitters none below the
    corollary, and 732 certificate-bearing exact counts at n = 131 -- which
    proves nothing about any deployed curve, moves no attack exponent, and
    leaves the closure reading (E) conditional on the unvalidated H1.' Anything
    short of all five is NOT a success: it is the corresponding falsification
    branch, an invalid run, or -- if the stages that did run passed but a stage
    did not complete for an infrastructure reason -- INCONCLUSIVE, reported as
    such with the unfinished stage named.
  falsification_criterion: >-
    DECIDABLE FROM THE METRICS ABOVE ALONE. F0: the Stage 0 hand re-derivation
    fails (an identity in (A) does not hold, or the degenerate case is
    mischaracterised, or the (4, 3) hand check disagrees with the instrument) --
    (A) is WITHDRAWN and the hypothesis is superseded, not patched. F1: any
    non-degenerate lambda at any cell with N_K(L) > max(d^{q+1}, 2^{n'-r}),
    certified by an explicit root list the wrapper re-verifies -- (A) IS FALSE
    AS STATED; if that N nonetheless satisfies N <= d^{q+1} + 2^{n'-r} the max
    form is false and the record is WEAKENED to the sum form, and if N exceeds
    the sum form too it is REJECTED IN SCOPE. F2: any completely splitting L at
    r >= 1 in Stage 2 with beta < n/(n + n' - r) -- (B) is false as stated, with
    the same weaken/reject split against the conservative threshold
    n(n' - 1)/(n'(n + n' - r)). F3: C2 or C4 not attaining the bound while
    returning the correct count -- the TIGHTNESS claim of (C) is false; the
    bound may still hold. F4: any Stage 4 draw above d^{q+1} + 2^{n'-r} + q d^q
    -- the rational-lambda extension (D)(ii) is WITHDRAWN as stated; (A) and (B)
    are untouched. F5: instrument disagreement at any Stage 1 cell, or a fixture
    returning other than its forced count -- the RUN is INVALID and returns to
    the Executor with the defect; this is never evidence about (A). F6: timeout,
    crash, memory cap, or budget exhaustion -- an INFRASTRUCTURE outcome under
    AGENTS.md rule 3, never evidence. A negative outcome is fully admissible
    here and F1 at n = 131 with a re-verified root list would simultaneously
    answer decision target (a) of RQ-QSP-f9bbdb positively; that is the outcome
    this contract is built to find if it exists.
  required_artifacts:
    - 'A run manifest per stage invocation carrying every AGENTS.md artifact-policy field: exact command; git commit and dirty-tree state; environment and dependency versions (including the compiler and flags for any C helper); all input parameters, cell definitions and field polynomials; all seeds and named sub-streams; requested model policy, backend, resolved runtime model identifier and its probe-verification status; reasoning effort, fallback_used and any degraded requirements; stdout and stderr; raw machine-readable results; validity status and reason; timestamps, wall clock and peak_rss_bytes.'
    - 'Per-cell machine-readable JSON for Stages 1, 1b, 2, 3 and 4: one row per candidate or draw with lambda (bit-packed and printed), (n, n'', d, q, r), N, the bound, the ratio, the D-root count, the slack, the degenerate flag, the linearized flag, the square flag, the instruments run and each instrument''s returned N, and the field polynomial used.'
    - 'The Stage 3 ROOT-LIST CERTIFICATES: one file per n = 131 candidate with N > 0, listing every root as a coefficient vector over F_2[z]/(z^131 + z^13 + z^2 + z + 1), grouped into Frobenius orbits, plus the wrapper''s independent re-verification result (every listed x satisfies x^{2^{n''}} = lambda(x); all listed roots pairwise distinct) and the discarded-root (slack) count.'
    - 'The Stage 0 DERIVATION NOTE: the hand re-derivation of (A), the degenerate-case characterisation, the beta corollary, the symbolic baseline_embedding and method_ceiling slices, and the worked (4, 3) hand counts. Zero compute; archived before Stage 1 runs.'
    - 'The INSTRUMENT AGREEMENT MATRIX (M2) in full, with every disagreeing candidate listed if any.'
    - 'The COMPLETE-SPLITTER and NEAR-COMPLETE tables (M3) with beta and both corollary values per row.'
    - 'The GATE RECORD: pass/fail for Stage 0, each forced fixture C1-C4, the linearized cross-check C6, and the certificate re-verification, with the archived evidence of any failure.'
    - 'The Stage 4 output plus EITHER the written-out pole bookkeeping for (D)(ii) OR an explicit statement that the extension is recorded as WITHDRAWN.'
    - 'The Stage 5 REPORT, carrying (i) the docs/inventor-protocol.md section 4 CLOSURE BLOCK -- named obstruction, argument, forward guidance -- filled from this run''s own numbers with the scope stated exactly; and (ii) the OBSTRUCTION BLOCK of templates/research-records.md with statement, quantity, value with units, measured_by run IDs, scope, and a completed resource_check (examined, reading, spawned_ids).'
    - 'The implementation itself under experiments/EXP-QSP-33b442/implementation/, with its provenance stated where code was adapted from analysis/qsp-ecc2k130/explore/.'
    - 'An execution-report.yaml recording, per stage, what ran, what did not, and why -- with unfinished work reported as unfinished and never estimated.'
