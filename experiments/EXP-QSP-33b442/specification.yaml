    MEASURED (produced by this experiment's runs, from exhaustive enumeration,
    gcd, and certified root extraction, with no model and no estimator between
    the number and the quantity): M1, M2, M3, M4, M5, M6, M8, M9, M10 -- every
    per-candidate count, every ratio, every agreement cell, every complete
    splitter, every n = 131 root list, every slack and histogram, and every
