    be read as a measurement): M7 in its entirety -- the beta table at n = 131,
    the Proposition 8 exponents of KN-LIT-4fe9d2 at kappa = 4.876, and the
    comparison against rho's 2^60.9 from KN-LIT-096. Also modeled: H2's Poisson
    and Binomial reference distributions used in the orbit tail checks. NOT
    PRESENT IN THIS CONTRACT AT ALL: any cost formula standing in for a measured
    decomposition cost. H1 is not measured here; IDEA-20260916-b84e2d is its
    scheduled validation route and is blocked by a recorded engine impediment.
  claim_tier_note: >-
    If H-QSP-5540d7 is supported by this experiment, the resulting claim is a
    CLOSURE OF A RESEARCH LINE UNDER A STATED COST MODEL -- 'under the cost
    model of Theorem 3.2 of KN-LIT-0a321c / Proposition 8 of KN-LIT-4fe9d2 (H1),
    no factor base of the form {x : x^{p^{n'}} = lambda(x)} with lambda
    polynomial and n' not dividing n beats generic algorithms' -- together with
    an unconditional derivation-tier bound on |F|. A closure result falls under
