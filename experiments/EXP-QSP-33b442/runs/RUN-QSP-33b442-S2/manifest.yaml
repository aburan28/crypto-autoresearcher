  failure_classification: implementation_error
  failure_classification_note: >-
    agents/executor.md failure semantics: implementation_error -- the code did
    not implement the intended experiment efficiently enough to run it. This is
    NOT infrastructure (F6) and it is NOT evidence of any kind about (A) or (B).
    No mathematical claim, positive or negative, follows from it.
  defect:
    what: >-
      stage2.py computed the recorded column `deg_D` by CONSTRUCTING the
      difference polynomial D(Y) = Lambda_{q+1}(Y) + Y^{2^{n'-r}} for EVERY
      candidate in the sweep, before deciding whether I3 would be run on it.
    why_it_is_fatal_at_these_cells: >-
      deg D = d^{q+1} when d^{q+1} > 2^{n'-r}, and q = floor(n/n') reaches 15
      in this stage's own cell list. Constructing that polynomial as a
      bit-packed integer needs d^{q+1} bits: at (n, n') = (23, 3), q = 7,
      d = 8 that is 16777216 bits; at (29, 3), q = 9 it is 1073741824 bits;
      at (31, 2), q = 15 it is 281474976710656 bits, i.e. about 35 terabytes
      for ONE candidate. The construction is also quadratic-ish in that length,
      so the sweep stalled on the (23, 3) cell.
    fix_in_RUN_QSP_33b442_S2B: >-
      deg D is now taken from the identity deg D = max(d^{q+1}, 2^{n'-r})
      WITHOUT constructing D whenever the two terms differ (a difference of two
      polynomials of unequal degree cannot cancel, so D is also certainly
      nonzero); D is constructed only when d^{q+1} = 2^{n'-r}, where the common
      value is at most 2^{n'} <= 2^15 and the construction is cheap, and that
      is also the only case in which D can vanish. The degenerate test is
      therefore still symbolic and still exact, and no candidate's deg D is
      estimated. qspcore.deg_D_and_degenerate.
    what_was_NOT_changed: >-
      No cell, candidate set, instrument, seed, threshold, metric or
      pre-registered value. The correction is to how a recorded column is
      computed, not to what is measured.
