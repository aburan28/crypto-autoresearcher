    No number in report.md or metrics.json was taken from
    analysis/qsp-ecc2k130/explore/.
  companion_artifacts_recovered:
    declared_under: CORR-20260917-8b80cc route.D2_route_S5
    task_id: TASK-20260917-93192a
    the_defect: >-
      THE CAPTURE WAS MISSED, NOT THE EXECUTION. make_report.py DID run under
      the command recorded in run.code.command, and metrics.json and report.md
      in this directory are its output. The original invocation simply wrote
      none of the five companion artifacts the run-package layout of
      docs/evidence-and-reproducibility.md requires.
    what_was_done: >-
      The step was RE-EXECUTED under the experiment's own run wrapper
      (implementation/runlib.py), with all output directed to a scratch
      directory OUTSIDE experiments/. The re-execution's metrics.json was
      compared BYTE FOR BYTE with the committed metrics.json in this directory.
      Only on byte-identity were command.txt, environment.json, stdout.log,
      stderr.log and raw-result.json copied in. Nothing was reconstructed from
      a manifest field.
    these_are_not_the_original_invocations_output: >-
      SAID IN TERMS, BECAUSE IT MATTERS: the five companion files in this
      directory come from a VERIFIED-IDENTICAL RE-EXECUTION performed at a
      later commit, not from the original invocation. integrity-recovery.json
      in this directory binds each file to its source and carries every hash.
    re_execution:
      repo_commit: edd7541b320cfe2ece107b51a971d2eda09e12b9
      canonical_command: python3 experiments/EXP-QSP-33b442/implementation/make_report.py
      literal_argv: 'python3 <scratch>/experiments/EXP-QSP-33b442/implementation/make_report.py'
      why_a_byte_identical_copy_was_invoked: >-
        make_report.py resolves its output directory from its own file location
        and does not honour the QSP_RUNS_DIR override, so invoking the
        committed copy in place would have OVERWRITTEN the committed
        metrics.json. A byte-identical copy of the script was rooted at a
        scratch tree with the five frozen input run directories copied in
        verbatim; the committed experiments/ tree was never written to by the
        re-execution. Script and input hashes are pinned in
        integrity-recovery.json.
      exit_code: 0
    determinism_check:
      committed_metrics_json_sha256: b22e2f3ecf3782525b1901f03eb919114d4f78e4ec696cbe73d481e8129c27b7
      re_executed_metrics_json_sha256: b22e2f3ecf3782525b1901f03eb919114d4f78e4ec696cbe73d481e8129c27b7
      byte_identical: true
      meaning: >-
        The committed metrics.json reproduces EXACTLY from the frozen inputs.
        This is a free reproducibility check that ADDS evidence; it is not a
        new measurement, and Stage 5 takes none.
    stderr_log_is_empty_and_that_is_the_capture: >-
      stderr.log is zero bytes because the re-execution emitted nothing on file
      descriptor 2. No explanatory text was written into it, since that would
      stop it being a capture.
    raw_result_json_is_the_re_executions_own: >-
      raw-result.json is the run wrapper's raw record of the re-execution. It is
      NOT a copy of metrics.json, does not replace it, and contains no
      measurement: it records provenance, script and input integrity hashes,
      and the byte-identity check.
    budget:
      counts_against_specification_budget_maximum_runs: false
      reason: >-
        route.D2_route_S5.budget_ruling: specification.yaml budget.note scopes
        the run budget to the five compute stages plus one re-invocation for
        infrastructure failure. Stage 5 is not a compute stage and takes no
        measurement, and both RUN-QSP-33b442-S0 and -S5 recorded that reading in
        counts_against_maximum_runs_reason BEFORE this defect was raised. The
        six counted invocations remain S1, S1B, S2, S2B, S3, S4.
    nothing_else_in_this_directory_was_touched: >-
      manifest.yaml, metrics.json and report.md are byte-identical at their
      original paths. No existing byte was edited.
  supersedes:
    supersedes_path: experiments/EXP-QSP-33b442/runs/RUN-QSP-33b442-S5/manifest.yaml
    supersedes_sha256: 43e4235bb6987895d2162260907c41b051c8e92dee12d25b469fd9d68f5b8fa2
