    scope_of_this_supersession: >-
      ADDITIVE ONLY. This record is byte-for-byte the superseded manifest plus
      the `companion_artifacts_recovered` block above and this block. No
      existing field was changed. No count, ratio, histogram, seed, timestamp,
      certificate payload, deviation or anomaly was read for modification,
      rewritten or recomputed, and metrics.json and report.md were not
      regenerated.
    the_prior_manifest_governs: >-
      THE SUPERSEDED MANIFEST GOVERNS EVERY FIELD IT CARRIES. This record
      replaces it for schema validation only. It remains present and
      byte-identical at its original path and was not edited.
    precedent: >-
      RUN-SSIQ-4de240-a and RUN-MLKEM-980909-a in
      tools/run_supersession_registry.yaml, with an integrity-recovery.json
      binding each recovered file to its source. Adding files leaves an archive
      receipt's declared path hashes valid, because a receipt pins paths and
      not directory contents.
