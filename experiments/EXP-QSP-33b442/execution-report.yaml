        deg D <= 1000000. Cause: deg D = max(d^{q+1}, 2^{n'-r}) and
        q = floor(n/n') reaches 15 in Stage 2's own cell list, so deg D reaches
        8^16; no sub-quadratic GF(2)[X] engine exists in this container. The
        realised exclusion is 14 of the 356 near-complete candidates, listed
        by name with their exact deg D in RUN-QSP-33b442-S2B. No cell,
        candidate set, seed, threshold, metric or pre-registered value changed,
        and Stage 2's primary instrument I2 ran on all 42244 candidates.

