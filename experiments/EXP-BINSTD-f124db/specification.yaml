# =============================================================================
# EXP-BINSTD-f124db -- VERSION 1 (APPROVED by DEC-20261001-ffba17) frozen
# contract for H-BINSTD-6fe132: Stage 0 period+tau arithmetic certificates;
# Stage 1 toy composite-k' period lattice + Frobenius orbit-size + null/
# k-prime controls; Stage 2 AS-level/genus agreement (H-0e3641-1) with
# optional open cost table (instrument_unavailable allowed as infrastructure).
#
# Source: IDEA-20260922-0e3641 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Absorbs HOLD-H review guidance from
# analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-0e3641.yaml
# (verdict sound / consolidated_into_d11575): (A)/(B) arithmetic; H1
# isolated; (C) cost OPEN; companion to future d11575 design.
#
# ZERO RUNS in this design packet. Stages 0-2 authorized for later executor
# TASK-20261001-66c370. No AUXIN. Amazon Bedrock prohibited.
# packaging_only false.
#
# certificate.kind vocabulary (docs/claims-and-verification.md):
#   discrete_log | decomposition | key_recovery | none
# Run manifests for this experiment MUST use certificate.kind: none
# (period/tau/genus/orbit observations are NOT discrete_log solves).
# Stage artifact YAML may carry observation_kind labels outside that field.
# Do NOT invent frobenius_order or other non-vocabulary kinds on manifests.
# =============================================================================
experiment:
  id: EXP-BINSTD-f124db
  hypothesis_id: H-BINSTD-6fe132
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-0e3641
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Stage 0 GHS period+tau certificates; Stage 1 toy (4,9) shared-period
    lattice + Frobenius orbit controls; Stage 2 AS-level genus-transfer
    (H-0e3641-1) with cost left OPEN
  status: analyzed
  approved_by: DEC-20261001-ffba17
  approved_at: '2026-10-01'
  analyzed_by: DEC-20261001-49b0c2
  analyzed_at: '2026-10-01'
  evidence_id: EV-BINSTD-8b7f33
  packaging_only: false
  approval:
    approved_by: DEC-20261001-ffba17
    composing_decision: DEC-20261001-ffba17
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Does NOT claim a break. HOLD-H
      guidance absorbed. (C) net cost remains OPEN.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stages 0-2. Stage 0 is arithmetic (zero GHS attack runs on deployed
      curves). Stage 1 is toy measurement at dk'<=36. Stage 2 is toy
      AS-level/genus (+ optional cost); instrument_unavailable is
      infrastructure, not negative math. Deployed GHS attacks and
      security-ordering claims are NOT authorized.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    (A) Certify n(c)=d/gcd(c,d) against d11575's ten cells and the
    tau-minimality table. (B) On toy (4,9) verify the shared-period pair
    k-prime forbids, with Frobenius orbit-size and null/k-prime controls.
    (C) Test H-0e3641-1 genus agreement across that pair; report any cost
    comparison as OPEN observational data only.

  class: control-certificate
  class_note: >-
    Structural / control certificate with a toy mechanical arm and an
    optional genus-transfer arm. Not a smoothness CDF heuristic-validation
    of an asymptotic attack, and not a cost-model claiming cryptanalytic
    impact. HEUR ids are falsification hooks. Measured vs recomputed vs
    inherited columns stay separate. No exponent-moving claim. (C) cost
    direction remains unknown by design.

  corrections_absorbed:
    hold_h_companion_role: >-
      HOLD-H: treat as structural companion to d11575 (why the lattice is
      minimal), not a competing attack lane. When d11575 is designed, this
      packet is the natural fold-in section.
    isolate_h1: >-
      Only H-0e3641-1 (genus depends only on period) is heuristic; (A)/(B)
      are unconditional arithmetic.
    cost_stays_open: >-
      Net cost ordering of smaller-q vs larger-q shared-period cells is
      direction:unknown; Stage 2 must not file a security conclusion.
    ecc2k130_vacuous: >-
      d=1 null is the ECC2K-130-shaped control; construction vacuous there
      — no product-law / matched-rho claim.

  scope:
    included:
      - >-
        Stage 0 (arithmetic; zero scientific GHS runs on deployed curves):
        (i) for each of five rows and each of ten divisors, recompute
        n(c)=d/gcd(c,d) and compare to d11575 stated periods;
        (ii) tau(16), tau(16k) for prime k, tau(144), tau(240), tau(336);
        (iii) optional MMT abstract/tables retrieval attempt (recalled
        until verified_by); (iv) write period-tau certificate.
      - >-
        Stage 1 (toy executable): enumerate divisors of N=36 at (4,9);
        identify shared-period pair c=3,c=9 with n=4; construct ordinary
        E/F_{2^4}; verify Frobenius orbit size; run k-prime control (4,7)
        and d=1 null; certificate checks use observation artifacts with
        run-manifest certificate.kind: none.
      - >-
        Stage 2 (toy): compute Artin-Schreier level / genus at c=3 and
        c=9 by a declared method; check agreement; optional charged
        time/memory under a declared small/large-genus regime split;
        OR write instrument_unavailable infrastructure report.
    excluded:
      - Any scientific GHS / cover attack run at deployed N in {176..368}
      - Filing a break claim or security ordering of composite-k' vs ANSI
      - Editing AUXIN / QSP / SEMBIN / IDEA-20260922-d11575 claim text
      - Amazon Bedrock
      - Treating MMT as retrieved without verified_by / without reading
      - Using non-vocabulary certificate.kind values on run manifests
      - Claiming (C) resolved from one toy cost cell

  inputs:
    proposal: ledger/proposals/IDEA-20260922-0e3641.yaml
    review: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-0e3641.yaml
    curve_audit: analysis/binstd-curve-audit/
    hypothesis: ledger/hypotheses/H-BINSTD-6fe132.yaml
    idea_d11575: ledger/proposals/IDEA-20260922-d11575.yaml
    idea_8278db: ledger/proposals/IDEA-20260922-8278db.yaml
    optional_code_refs:
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-BINSTD-9d1b8e/implementation/curve.py
      - experiments/EXP-BINSTD-9d1b8e/implementation/gf2n.py
    literature_targets:
      - id: mmt_ghs_composite_degree
        refs:
          - 'M. Maurer, A. Menezes, E. Teske, eprint 2001/084'
          - 'LMS J. Comput. Math. 5 (2002) 127-174'
        extract: >-
          Whether MMT (or successor) already states tau-minimality at
          k-prime or shared-period variable-base-field observations for
          N=d*k' shapes. Abstract-level population note is already in the
          proposal; upgrade to retrieved only after opening the source.
        provenance_on_success: retrieved
        provenance_until_read: recalled
    cells:
      Stage0-deployed-period-tau:
        d: 16
        k_prime_list: [11, 13, 17, 19, 23]
        curve_ids: [c2pnb176v1, c2pnb208w1, c2pnb272w1, c2pnb304w1, c2pnb368w1]
        divisors_per_N: >-
          For each N=16k: {1,2,4,8,16,k,2k,4k,8k,16k}
        expected_n_formula: 'd / gcd(c, d)'
        frozen_tau:
          tau_16: 5
          tau_N_prime_k: 10
          tau_144_k9: 15
          tau_240_k15: 20
          tau_336_k21: 20
      Stage1-composite-toy:
        d: 4
        k_prime: 9
        dk: 36
        N: 36
        divisors: [1, 2, 3, 4, 6, 9, 12, 18, 36]
        shared_period_pair: {c_small: 3, c_large: 9, expected_n: 4, gcd_with_d: 1}
        curve_hint: >-
          Ordinary E/F_{2^4} with A,B in F_{16}; coefficients fixed by
          sigma_c^n and not by any smaller positive power for the tested c.
      Stage1-kprime-control:
        d: 4
        k_prime: 7
        dk: 28
        note: >-
          Only two families; no shared-period unequal-q pair at fixed
          gcd(*,d) from a proper divisor of k.
      Stage1-null-d1:
        d: 1
        note: >-
          Prime-degree / ECC2K-130-shaped null: period formula and
          extra-divisor argument evaporate.
      Stage2-genus-pair:
        inherit: Stage1-composite-toy
        require_genus_agreement: true
        cost_comparison: optional_open

  controls:
    - name: d11575_baseline_reproduction
      object: >-
        Stage 0 must reproduce d11575's stated periods on both k-prime
        families before claiming generalisation.
    - name: kprime_toy_control
      object: >-
        (4,7): no composite-k' shared-period unequal-q pair; baseline for
        what k-prime admits.
    - name: null_d1
      object: >-
        d=1: construction vacuous; instrument must not invent a nontrivial
        extra-divisor lattice.
    - name: coprimality_guard
      object: >-
        If a toy cell accidentally has gcd(d,k')!=1, mark mis-specified
        (not a falsifier of (B)).
    - name: certificate_kind_vocabulary
      object: >-
        Every run manifest result.certificate.kind is one of
        discrete_log | decomposition | key_recovery | none. This
        experiment uses none.
    - name: cost_open_guard
      object: >-
        Stage 2 cost artifacts (if any) labeled observational / open;
        no break or security-ordering claim.

  independent_variables:
    - stage  # 0 | 1 | 2
    - d
    - k_prime
    - divisor_c
    - control_kind  # composite | kprime | null_d1
    - seed

  metrics:
    primary:
      - period_match_rate_d11575_cells
      - tau_table_pass
      - shared_period_pair_pass
      - frobenius_orbit_size_match
      - genus_agreement_shared_period
      - null_d1_vacuous_pass
      - cost_ordering_reported_open
    secondary:
      - instrument_unavailable
      - literature_unrecovered
      - peak_rss_bytes
      - wall_s
      - termination_reason
      - certificate_kind_none_rate

  heuristic_under_test:
    - HEUR-BINSTD-6fe132-H0
    - HEUR-BINSTD-6fe132-H1
    - HEUR-BINSTD-6fe132-H2

  preregistered_prediction:
    quantity: >-
      (A) n(c)=d/gcd(c,d) matches d11575 on all ten cells × five curves;
      (B) tau table = {10,15,20,20} for prime-k / 9 / 15 / 21;
      (C) Stage 1: n(3)=n(9)=4 on N=36; Frobenius orbit size 4;
      (D) Stage 2: genus/AS-level agrees at c=3 and c=9 OR
      instrument_unavailable=true (infrastructure);
      (E) net cost ordering UNKNOWN (HEUR-H2);
      (F) NO break / security-ordering claim under any outcome.
    formula: >-
      n(c) = d / gcd(c, d);
      tau(d k') = tau(d) * tau(k') when gcd(d,k')=1;
      equality tau=2*tau(d) iff k' prime.
    source: >-
      IDEA-20260922-0e3641 (A)(B)(C); HOLD-H review; H-BINSTD-6fe132
    claim_tier: observational
    measured_vs_modeled: >-
      Stage 0 periods and tau counts are RECOMPUTED arithmetic (labeled
      recomputed); d11575 stated periods are INHERITED comparators in a
      separate column. Stage 1 orbit sizes are MEASURED. Stage 2 genus is
      MEASURED if instrument available; cost figures MEASURED vs any
      modeled regime-split formula kept in separate labeled columns.

  scale_relevance:
    tier: toy_plus_deployed_arithmetic
    justification: >-
      Stage 0 uses deployed divisor lattices as arithmetic identities only.
      Stage 1–2 toys at dk'<=36 access the same period / shared-period
      mechanism at affordable size. Transfer of (A)/(B) to deployed rows
      is exact number theory on audited (d,k), not an extrapolation of a
      measured attack cost. Genus-transfer (H1) is tested only at toy
      scale; any positive Stage 2 result does not automatically transfer
      to deployed N without a numbered assumption this protocol does not
      make.
    correspondence: null

  sample_size_justification: >-
    Stage 0: complete census of five curves × ten divisors plus four tau
    counterfactual k' values. Stage 1: one primary composite cell, one
    k-prime control, one null. Stage 2: one shared-period pair (minimal
    example of (C)'s mechanism per proposal confounders).

  tail_checks:
    - Any single d11575 cell with period mismatch is a hard fail (not averaged).
    - Report any divisor of N=36 whose n(c) disagrees with d/gcd(c,d).
    - Genus disagreement is a hard fail of H1 (not averaged).
    - Cost ordering must not be narrated as a security finding.

  replication:
    seeds:
      - 20260922
      - 20261001
      - 20261002
      - 20261003
    independent_instances: >-
      Stage 0 deterministic. Stage 1 curve construction may use seeds to
      draw ordinary (A,B) in F_{16} with odd trace if the default hint
      fails; primary seed 20260922. Stage 2 deterministic given Stage 1
      curve and magic-number choice.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 24
    maximum_workers: 1

  stopping_rules:
    - >-
      Stage 0 complete when period-tau-certificate.yaml and
      d11575-period-comparison.yaml are written (optional literature note).
    - >-
      Stage 1 complete when divisor-lattice.yaml, shared-period-pair.yaml,
      frobenius-orbit-checks.yaml, and controls-report.yaml are written.
    - >-
      Stage 2 may start after stage1/ exists. Complete when
      genus-agreement.yaml is written OR instrument_unavailable.yaml
      explains the missing cover/AS routine; optional cost-table.yaml
      labeled open.
    - Advisory wall-clock: checkpoint and report; never fabricate completion.
    - Hard stop if Stage 0 period mismatch or Stage 1 n(3)/n(9) mismatch.

  invalidation_rules:
    - Stage 0 period mismatch on any d11575 cell
    - Stage 0 tau table disagreeing on a correctly coprime (d,k') pair
    - Dual/inherited comparison columns missing or mixed unlabeled
    - null_d1 reports nontrivial extra-divisor exploit structure
    - Run manifest certificate.kind outside {discrete_log, decomposition, key_recovery, none}
    - timeout/crash/OOM → failed_infrastructure, not negative math evidence
    - Amazon Bedrock invocation attempted → abort
    - Claiming retrieved provenance without verified_by / without reading
    - Filing a break or composite-k'-is-weaker security claim

  success_criterion: >-
    Stage 0: period_match_rate=1.0 on d11575 cells; tau_table_pass=true.
    Stage 1: shared_period_pair_pass=true; frobenius_orbit_size_match on
    tested c; null_d1_vacuous_pass=true; k-prime control documented.
    Stage 2: genus_agreement_shared_period=true OR
    instrument_unavailable=true with infrastructure reason; any cost
    table labeled open. Decidable from predefined metrics. Success does
    NOT include a break or security-ordering claim.

  falsification_criterion: >-
    Stage 0 arithmetic failure; Stage 1 period/orbit failure on verified
    toy; Stage 2 genus disagreement with verified AS-level computation.
    Distinguish infrastructure (instrument_unavailable, timeout) via
    invalidation_rules / DO-5.

  required_artifacts:
    - experiments/EXP-BINSTD-f124db/stage0/period-tau-certificate.yaml
    - experiments/EXP-BINSTD-f124db/stage0/d11575-period-comparison.yaml
    - experiments/EXP-BINSTD-f124db/stage0/methodological-note.md
    - experiments/EXP-BINSTD-f124db/stage1/divisor-lattice.yaml
    - experiments/EXP-BINSTD-f124db/stage1/shared-period-pair.yaml
    - experiments/EXP-BINSTD-f124db/stage1/frobenius-orbit-checks.yaml
    - experiments/EXP-BINSTD-f124db/stage1/controls-report.yaml
    - experiments/EXP-BINSTD-f124db/stage2/genus-agreement.yaml
    - experiments/EXP-BINSTD-f124db/stage2/instrument_unavailable.yaml
    - experiments/EXP-BINSTD-f124db/runs/*/manifest.yaml
    - experiments/EXP-BINSTD-f124db/runs/*/raw-result.json
    - experiments/EXP-BINSTD-f124db/runs/*/stdout.log
  required_artifacts_note: >-
    Stage 2 must produce genus-agreement.yaml OR
    instrument_unavailable.yaml (exactly one of the two decisive paths;
    both may exist only if a partial attempt is logged then abandoned —
    prefer exactly one). Optional cost-table.yaml allowed under stage2/.

  procedure:
    stage0:
      - Load d=16 and k list from audit / IDEA-20260922-d11575.
      - >-
        For each curve and each of the ten divisors, compute n=d/gcd(c,d);
        compare to d11575 stated periods; write comparison table.
      - Compute tau table for frozen k' set; write period-tau-certificate.yaml.
      - >-
        Write methodological-note.md (HOLD-H companion role; ECC2K-130 d=1;
        certificate.kind vocabulary reminder).
      - Optional: attempt MMT retrieval; else literature_unrecovered=true.
    stage1:
      - Confirm stage0/ exists.
      - Enumerate divisors of N=36; compute n(c); assert n(3)=n(9)=4.
      - >-
        Construct ordinary E/F_{2^4}; for c in {3,9} verify minimal i with
        sigma_c^i fixing coefficients equals n(c).
      - Run (4,7) k-prime control and d=1 null; write controls-report.yaml.
      - Every run manifest sets result.certificate.kind: none.
    stage2:
      - Confirm stage1/ exists.
      - >-
        Attempt AS-level / genus computation at c=3 and c=9 with a declared
        method (document in implementation/).
      - If both levels compute: write genus-agreement.yaml with pass/fail.
      - >-
        If instrument cannot be built: write instrument_unavailable.yaml
        (infrastructure; does not falsify H0).
      - >-
        Optional: charge time/memory under a declared regime split; label
        cost-table.yaml as observational_open.

  optimistic_assumptions_disclosed:
    - >-
      Assuming H-0e3641-1 before Stage 2 would be optimistic for (C)'s
      "identical genus range" clause. Protocol isolates H1 and forbids
      silent discharge.
    - >-
      Quarter-scale toys (d=4 vs d=16) may not preserve regime balance;
      any cost table carries this scale gap explicitly (proposal
      confounder).
    - >-
      k'=9 offers only one nontrivial proper divisor m1=3 — minimal
      example of (C), not a rich census.
    - >-
      Cover/AS instrument may be unavailable; treating that as negative
      math would be wrong (rule 3).

  memory_accounting: >-
    Stage 0 negligible. Stage 1–2: peak_rss_bytes measured per run;
    dominant structures are F_{2^{dk}} elements (analytic O(dk) bits) and
    any AS/cover data structures — reconcile measured RSS in
    controls-report.yaml / genus-agreement.yaml.

  assigned_to: executor
  dominated_by: >-
    n/a for attack cost. Structural companion pinning period formula and
    tau-minimality; sota_delta is lattice correctness.
  sota_delta:
    time: Zero cryptanalytic movement; certifies period formula and tau(N)=10 minimum.
    memory: Unaffected.
    data_queries: N/A.
