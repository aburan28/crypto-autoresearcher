experiment:
  id: EXP-MCEGOP-c1b8e1
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-293dd3; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-293dd3
  question_id: RQ-MCE-b38a8b
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Equivalence testing of three random binary code-sampling conventions -- rank-rejected parity
    check, rank-rejected generator, and systematic [I | A] -- on hull dimension, square-code defect
    and minimum distance, with a within-convention self-null and a deliberately biased positive control
  objective: 'One uncertainty is reduced: whether the phrase ''matched random code'', which every
    null arm in this bucket relies on, names an object stable enough that the choice of sampler does
    not enter the result. Stated in parts: (i) THE EXCLUSION, MEASURED -- what fraction of uniformly
    sampled k-dimensional codes admit the first k coordinates as an information set, checked against
    the exact product formula. The systematic-form convention samples only from that subset, and a
    measured coverage of about 0.29 makes concrete what would otherwise be an abstract worry. This
    check also validates the uniform sampler, which everything else depends on. (ii) DOES THE EXCLUSION
    MOVE ANY STATISTIC -- what are the pairwise differences between conventions in hull dimension,
    square-code defect and minimum distance, reported with confidence intervals and read against an
    equivalence margin declared before the run, so that a null outcome is a bounded statement rather
    than a failure to reject. Every other proposal in this bucket inherits whichever answer this returns.
    (iii) CAN THE TEST SEE ANYTHING AT ALL -- whether a deliberately biased sampler is detected by
    the identical machinery, and whether a convention compared against itself shows no difference
    at the same margin. Those two arms together bound the test''s resolution from both sides, and
    without them an equivalence verdict would be indistinguishable from blindness. No timing is measured
    anywhere in this contract and it audits no cost model.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A completed run could support exactly this: that at the tested
      (n, k), the three named sampling conventions induced the reported distributions of the three
      named statistics, differing pairwise by the reported amounts with the reported intervals, judged
      equivalent or not at the declared margin; that the systematic ensemble''s measured coverage
      matched or missed the exact product formula; and that the positive control was or was not detected.
      What does NOT follow: no structural claim about any code family, no attack, no security consequence,
      no statement about this program''s timing or cost models, and no conclusion that the conventions
      are interchangeable for any statistic not tested here. An equivalence verdict is relative to
      three statistics, specific (n, k), and a stated margin, and it must always be quoted with all
      three.'
  inputs:
    procedure: 'STAGE 0 (cost: 1 hour, human). Declare and freeze the three conventions, the three
      statistics, the equivalence margin, the sample sizes and the seeds. STAGE 1 (cost: minutes).
      Implement the three samplers with explicit rejection counting, plus the deliberately biased
      positive-control sampler. STAGE 2 (cost: seconds). Run the exact coverage check: draw 2000 uniform
      codes, count how many admit {1..k} as an information set, compare against the product over i=1..k
      of (1 - 2^-i). STAGE 3 (cost: minutes per cell). Draw 2000 codes per convention plus 2000 for
      the positive control. STAGE 4 (cost: minutes to an hour per cell). Compute hull dimension, square-code
      defect, and exact minimum distance (k <= 20) or the sampled proxy on every code. STAGE 5 (cost:
      seconds). Run pairwise between-convention comparisons with confidence intervals and equivalence
      tests at the frozen margin. STAGE 6 (cost: seconds). Run the within-convention self-null on
      every convention and statistic. STAGE 7 (cost: seconds). Run the positive-control detection.
      STAGE 8 (cost: minutes). Replicate the whole cell under a second seed family, then translate
      every measured difference into the induced AUC shift a downstream comparison would inherit.
      Total budget 2 CPU-hours.'
    instrument: Python 3.11 standard library only (numpy absent, verified). Shares GF(2) elimination
      and the Schur routine with harness/goppa_toy.py from proposal 1 and the proposal-3 module, but
      does NOT require the Goppa construction, so it can run first and independently. Adds three sampler
      implementations with rejection counters, an information-set membership test, a hull routine,
      exact codebook enumeration for minimum distance where k <= 20, and directly implemented confidence
      intervals and two one-sided equivalence tests. Driven through harness/runner.py with two independent
      domain-separated seed families. No Sage, no external package, no network, and no timing measurement
      enters any comparison.
    parameters: 'Cells: (n,k) in {(16,8), (32,16), (48,24), (64,40)}, the last chosen to match the
      largest Goppa cell in this bucket. 2000 codes per convention per cell, four arms (three conventions
      plus the biased positive control), giving 8000 codes per cell and 32000 total. Exact minimum
      distance where k <= 20; sampled proxy from 10^4 random codewords above that, with the switch
      recorded. Equivalence margin declared in advance as 0.15 standard deviations of the pooled statistic,
      frozen before any draw. Two independent seed families for full replication. Coverage check at
      every cell with 2000 uniform draws.'
  controls:
  - 'Within-convention self-null: a 1000/1000 split of each convention, run through the identical
    comparison.'
  - 'Deliberately biased positive control: systematic form with A restricted to low weight, which
    must be detected as different.'
  - Exact combinatorial coverage check of the systematic ensemble's density against the product formula.
  - Rejection-rate reporting for conventions (i) and (ii), so that the acceptance process is visible
    rather than hidden.
  - Two independent seeds per convention per cell, with the whole comparison replicated.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object here is the same convention against itself. For each
    convention and each statistic, split the 2000 samples into two halves of 1000 and run the IDENTICAL
    pairwise comparison and equivalence test. That within-convention comparison must show no difference
    at the declared margin; it establishes the test''s own resolution and it is the number against
    which every between-convention difference is read. Without it, a between-convention difference
    of any size is uninterpretable because the test''s floor is unknown. A second control is a deliberately
    BIASED sampler -- for instance, drawing systematic codes with A restricted to low weight -- which
    must be detected as different by the same machinery. That positive control is what distinguishes
    ''the conventions are equivalent'' from ''the test cannot see anything'', and running it costs
    one extra arm.'
  independent_variables:
  - cell (n, k)
  - sampling convention (rank-rejected parity | rank-rejected generator | systematic [I|A] | biased
    positive control)
  - statistic (hull dimension | square-code defect | minimum distance)
  - seed family
  metrics:
    primary:
    - pairwise between-convention difference with confidence interval, per statistic per cell
    - equivalence verdict at the declared margin
    - within-convention self-null difference
    - measured systematic-ensemble coverage fraction
    secondary:
    - raw per-sample statistic values
    - rejection rate per convention
    - positive-control detection outcome
    - induced AUC shift for a downstream comparison
    - exact-versus-proxy flag for minimum distance
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The pairwise between-convention differences on three statistics, judged against a pre-declared
      equivalence margin, and the systematic ensemble's coverage fraction.
    formula: 'Coverage(k) = product over i = 1..k of (1 - 2^(-i)), the probability that a uniformly
      random k-dimensional subspace of F_2^n has {1..k} as an information set; pre-registered at 0.2896
      for k = 8 within a tolerance of 0.02. Equivalence: two conventions are declared equivalent on
      a statistic when the two-sided confidence interval for their mean difference lies entirely within
      plus or minus 0.15 pooled standard deviations, the margin frozen before any draw. Self-null:
      the same computation on a 1000/1000 split of one convention, required inside the margin.'
    source: Pre-registered in the parent proposal IDEA-20260816-293dd3 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Cells at n <= 64 with k up to 40, matched to the largest Goppa cell in this bucket
      so the result is directly usable by the other proposals here. Minimum distance is exact where
      k <= 20, so at least two cells are fully exact with no proxy error. One quantity IS scale-independent
      and is treated as such explicitly: the coverage product converges rapidly and is essentially
      constant above k of about 10, so the SIZE of the systematic ensemble''s exclusion is not a small-parameter
      artefact even though its effect on the statistics is measured only at these sizes. That distinction
      between an exact combinatorial fact and a measured empirical effect is stated on the face of
      every result.'
    correspondence: null
  tail_checks:
  - The tails of each statistic's distribution are compared separately, since an equivalence in means
    can coexist with different tails, and null arms are often read through their tails.
  - Cells where the sampled minimum-distance proxy replaces exact enumeration are flagged inline.
  - The largest-k cell is where the coverage product is most converged and the conventions differ
    most in ensemble; it is reported first.
  - Any convention whose rejection rate differs wildly from the combinatorial expectation is investigated
    before its statistics are read.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort if the measured coverage fraction misses the product formula beyond tolerance at the smallest
    cell.
  - Abort the equivalence conclusion if the positive control goes undetected, reporting the run as
    underpowered rather than as an equivalence.
  - Cap total wall-clock at 2 CPU-hours and report unreached cells.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The measured coverage fraction matches the exact product formula within tolerance,
    the positive control is detected, every within-convention self-null falls inside the declared
    margin, and every pairwise between-convention comparison is reported with its interval, its equivalence
    verdict at the frozen margin, and the induced AUC shift a downstream comparison would inherit.
  falsification_criterion:
  - Measured coverage fraction outside the tolerance around the product formula.
  - Positive control undetected.
  - Any within-convention self-null outside the declared margin.
  - A between-convention difference that fails to replicate under the second seed family.
  - Exact minimum distance differing between conventions by an amount also present in the self-null.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-293dd3
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The equivalence margin (0.15 pooled standard deviations) is asserted rather than derived from
    what downstream comparisons actually need; the Coordinator must set it from the AUC shift the
    other proposals in this bucket can tolerate, which requires deciding that tolerance first.
  - Whether three statistics suffice, or whether a fourth (for example the weight-distribution tail)
    must be added, needs a ruling, since an equivalence verdict is always relative to the statistics
    tested.
  - Whether the conclusions of this contract are binding on the other proposals in this bucket --
    that is, whether they must adopt the convention this run recommends -- is a Coordinator decision
    and cannot be self-declared here.
