# EXP-ICPERF-d02511
# Sample distribution arithmetic. No archived row.
# Approved by DEC-20261002-6006f0.
experiment:
  id: EXP-ICPERF-d02511
  hypothesis_id: H-ICPERF-604887
  source_idea: IDEA-20260926-d1adfc
  question_id: RQ-ICPERF-94c86e
  version: 1
  title: Sample distribution arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-6006f0
  objective: >-
    Check the ten-point coefficient of variation, the maximum-to-median
    ratio, the Hill index, and the written-count fractions.
  inputs:
    costs: [2, 2, 2, 2, 4, 4, 4, 8, 8, 16]
    sample_size: 10
    cost_sum: 52
    square_sum: 448
    mean_num: 26
    mean_den: 5
    variance_num: 444
    variance_den: 25
    cv_radicand: 111
    cv_den: 13
    cv_low_sq: 100
    cv_high_sq: 121
    half_compare_num: 169
    half_compare_den: 4
    median: 4
    maximum: 16
    max_over_median: 4
    hill_k: 2
    tail_low_num: 14
    tail_low_den: 5
    tail_high_num: 29
    tail_high_den: 10
    series_terms: 20
    written_targets: 687
    censored: 2
    finished: 685
    censored_cap_den: 20
    twenty_percent_num: 687
    twenty_percent_den: 5
    twenty_percent_whole: 137
    twenty_percent_remainder: 2
    band_low_num: 7
    band_low_den: 10
    band_high_num: 3
    band_high_den: 2
    outside_high: 2
    outside_low_num: 3
    outside_low_den: 5
    bootstrap_resamples: 10000
  controls:
    - >-
      The maximum-to-median ratio is 4. Reporting another ratio
      invalidates the run.
    - >-
      The coefficient of variation is strictly above 1/2. Reporting it
      as at most 1/2 invalidates the run.
    - >-
      The tail index lies strictly above 14/5 and strictly below 29/10.
      Reporting it as 2 invalidates the run.
    - >-
      Twenty percent of 687 is 687/5. Reporting it as 137 invalidates
      the run.
    - >-
      The censored fraction 2/687 is strictly below 1/20. Reporting it
      as at least 1/20 invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {variation, hill, counts}
    - route in {moments, series}
  metrics:
    primary:
      - max_over_median
      - tail_index_band
      - implementations_agree
    secondary:
      - cv_above_half
      - censored_fraction
      - twenty_percent
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The ratio 4 and the tail band from 14/5 to 29/10.
    formula: >-
      The variance with divisor 10 is the mean of the squares minus the
      square of the mean. The Hill index is the reciprocal of the mean
      of the logarithms of the two largest costs over the third largest.
      On this sample that mean is half the logarithm of 2. The series
      for that logarithm through 20 terms, with a tail below one over
      21 times 2 to the 20, places the reciprocal strictly between 14/5
      and 29/10. Twenty percent of 687 is the fraction 687/5.
    source: >-
      IDEA-20260926-d1adfc states the column definitions and the
      written counts, read 2026-10-02. The sample and the series were
      computed in this design session. That computation is not a run.
      No archived timing row was opened.
  scale_relevance:
    tier: toy
    justification: One sample of ten costs and the proposal's written counts. No transfer to an archived engine log.
    correspondence: null
  tail_checks:
    - The series tail bound is required. Stopping after the partial sum and still reporting the band 14/5 to 29/10 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the tail index is reported as 2, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The maximum-to-median ratio is not 4.
    - The coefficient of variation is reported as at most 1/2.
    - The tail index is reported as 2.
    - Twenty percent of 687 is reported as 137.
    - The censored fraction is reported as at least 1/20.
    - An archived timing row is opened or a tail is reported from it.
  success_criterion: >-
    Both runs agree that the sum is 52, the sum of squares is 448, the
    maximum-to-median ratio is 4, the coefficient of variation lies
    strictly above 1/2 and strictly below 11/13, the tail index lies
    strictly between 14/5 and 29/10, 2/687 is strictly below 1/20, and
    20 percent of 687 is 687/5.
  falsification_criterion: >-
    The runs agree, the maximum-to-median ratio stays 4, and any factor
    differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-ICPERF-d02511/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ICPERF-d02511/runs/<RUN-ID>/command.txt
    - experiments/EXP-ICPERF-d02511/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ICPERF-d02511/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ICPERF-d02511/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ICPERF-d02511/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any opening of an archived timing row.
    - Any claim that a tail is light or heavy on a real engine.
    - Any restart portfolio or attempt-cap design.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
