# EXP-ECDLP-8527d2
# Model-degree arithmetic. No point is counted.
# Approved by DEC-20261003-a92e91.
experiment:
  id: EXP-ECDLP-8527d2
  hypothesis_id: H-ECDLP-0559c1
  source_idea: IDEA-20261003-90c96d
  question_id: RQ-ECDLP-623a32
  version: 1
  title: Edwards degree versus Weierstrass degree
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-a92e91
  objective: >-
    Check the degree gap 1, the product 12, and the nearby gap 0.
  inputs:
    edwards: 4
    weierstrass: 3
    degree_gap: 1
    degree_product: 12
    degree_sum: 7
    nearby_a: 3
    nearby_b: 3
    nearby_gap: 0
    nearby_product: 9
  controls:
    - >-
      An Edwards equation has degree 4. A short-Weierstrass
      equation has degree 3. Reporting both as degree 3 drops the
      gap and invalidates the run.
    - >-
      Four exceeds three by 1. The product of the two degrees is
      12. Their sum is 7.
    - >-
      Two Weierstrass equations each have degree 3. Their gap is 0
      and their product is 9.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {read, subtract}
  metrics:
    primary:
      - degree_gap
      - degree_product
      - nearby_gap
      - implementations_agree
    secondary:
      - degree_sum
      - nearby_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      4 exceeds 3 by 1. The product of 4 and 3 is 12. The gap of
      two Weierstrass degrees is 0.
    formula: >-
      Subtract 3 from 4. Multiply 4 by 3. Add 4 and 3. Subtract
      3 from 3. Multiply 3 by 3.
    source: >-
      IDEA-20261003-90c96d states the degrees 4 and 3, read
      2026-10-03. The gap, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No point was counted.
  scale_relevance:
    tier: toy
    justification: Two written equation degrees. No transfer to a point count.
    correspondence: null
  tail_checks:
    - The product 12 and the nearby gap 0 are required. A check that stops at the gap 1 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the gap 1 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The Edwards degree is not 4.
    - The Weierstrass degree is not 3.
    - The gap is not 1.
    - The product is not 12.
    - Both degrees are reported as 3, or a point is counted.
  success_criterion: >-
    Both runs agree that the Edwards degree is 4, that the
    Weierstrass degree is 3, that 4 exceeds 3 by 1, and that the
    product is 12.
  falsification_criterion: >-
    The runs agree that the Edwards degree is computed, and that
    degree is not 4.
  required_artifacts:
    - experiments/EXP-ECDLP-8527d2/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-8527d2/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-8527d2/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-8527d2/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-8527d2/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-8527d2/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any point count or scalar recovery.
    - Any claim that a degree gap of 1 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
