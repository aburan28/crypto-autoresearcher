experiment:
  id: EXP-FROB-720a77
  hypothesis_id: H-FROB-ff99bf
  version: 1
  title: >-
    EXTEND THE EXACT WEIL CENSUS AT n=131 OVER F_2 TO DIMENSIONS 5 AND 6:
    every integer candidate with P(1) a multiple of 131 and degree 2g
    (g in {5, 6}) enumerated and Sturm-tested over the rationals with the
    z^2 - 2 boundary split off and approached from both sides -- with the
    dimension-3 (104 tests) and dimension-4 (234,220 tests) figures
    reproduced first as the instrument control, per-multiple candidate
    counts reported against the empty-sweep artifact, and a feasibility
    gate before each dimension's exact tests
  status: approved
  status_note: >-
    Frozen at version 1 and approved on 2026-10-05 by the Coordinator
    decision DEC-20261005-0f460b under the STANDING USER AUTHORIZATION
    (AGENTS.md). Protocol readiness verified: every field non-null; controls
    (C1-C3), metrics, budget, stopping rules, invalidation rules, artifact
    paths and assignment present; both criteria decidable from the metrics.
    Approval authorizes the work and asserts nothing about H-FROB-ff99bf.
    No run authorized before this mark; execution awaits a dispatched
    executor card satisfying the standing three preconditions. Changes after
    this point require a versioned protocol_amendment under
    experiments/EXP-FROB-720a77/amendments/.
  source_proposal: null
  source_proposal_note: >-
    Designed from knowledge/open-problems/KN-OPEN-095df5's cheapest-test
    item 1; the open problem is the proposal (see H-FROB-ff99bf
    source_note).
  objective: >-
    Decide by exact enumeration whether any abelian variety over F_2 of
    dimension 5 or 6 has a point count divisible by 131, extending the
    dimension-1..4 exclusion of KN-OPEN-095df5 by exactly two dimensions.
    Zero hits narrows the Couveignes-Lercier survival space at the ECC2K-130
    degree to dimension >= 7 and non-abelian groups; a hit supplies the
    concrete Weil polynomial and Honda-Tate class data the factor-base route
    needs. Both outcomes are results. NO ATTACK IS RUN; no curve, group law
    or point is constructed.
  class: >-
    derivation-tier exact census (enumeration with an exact admissibility
    test), the same class as the prior dimension-1..4 work it extends. The
    only statistical content is the C3 candidate-count transparency, which is
    diagnostic, never evidence.
  inputs:
    field_models:
      constant_q: q = 2 fixed; n = 131 fixed; no field representation is built.
    code_reuse: >-
      analysis/couveignes-lercier-131/weil_census.py and exact_targets.py
      (the prior instrument) may be reused, copied or adapted under
      experiments/EXP-FROB-720a77/implementation/ with provenance. Every
      reported number must come from this experiment's own runs with a
      manifest carrying the AGENTS.md artifact-policy fields.
    frozen_enumeration: >-
      For each g in {5, 6}, each multiple M of 131 with 0 < M <=
      (1+sqrt(2))^{2g}: enumerate integer coefficient tuples of monic
      degree-2g Weil-symmetric polynomials with P(1) = M; Sturm-test each
      over the rationals; split (z^2 - 2)^k off the boundary first and
      approach from both sides; record every admissible polynomial.
  controls:
    - >-
      C1 PRIOR-DIMENSION REPRODUCTION (instrument gate, runs first): the
      same instrument must reproduce dimension 3 (104 exact tests, zero
      hits) and dimension 4 (234,220 exact tests, zero hits) exactly as
      recorded in KN-OPEN-095df5 / EV-FROB-b6e1e9. Disagreement
      invalidates the run before any g=5 computation.
    - >-
      C2 BOUNDARY REPORTING: any Sturm case whose root straddles the
      |z| = sqrt(2) boundary gap is reported with its polynomial, not
      silently classified.
    - >-
      C3 EMPTY-SWEEP NULL: per-multiple candidate counts are reported so
      zero-hits-from-no-candidates is distinguishable from a genuine
      exhaustive miss.
  independent_variables:
    - dimension g in {5, 6}
    - multiple M of 131 in the Weil range per dimension
  metrics:
    - hits per dimension (admissible Weil polynomials with P(1) divisible by 131)
    - exact test count and candidate count per multiple, per dimension
    - boundary cases reported (C2)
    - wall time and peak RSS (diagnostics only)
  heuristic_under_test: null
  heuristic_under_test_note: >-
    No heuristic: this is an exact census. H-FROB-ff99bf's claim is read off
    the completed enumeration, never asserted before it.
  preregistered_prediction: >-
    Not directional: either zero hits at both dimensions (claim supported at
    the tested scope) or >= 1 hit with its Weil polynomial (claim falsified;
    the artifact is the polynomial and its Honda-Tate class data). Both
    outcomes are recorded; no direction is promised.
  scale_relevance: >-
    A finite exact census at the ECC2K-130 degree (n = 131, q = 2); no
    asymptotic or cryptographic-scale claim. ECC2K-130's rho baseline
    (2^60.9, KN-LIT-096) is untouched in both outcomes.
  tail_checks:
    - C1 gate passes before any g=5 computation.
    - The feasibility gate (below) is evaluated before each dimension's exact tests.
    - Every reported hit carries its full polynomial, not just a count.
  replication: >-
    The census is deterministic and seed-free; a rerun is bit-comparable.
    C1 is the in-run replication against recorded prior numbers. An
    independent session's replication is the normal review path.
  budget:
    wall_clock_seconds: 14400
    memory_gb: 4
    maximum_runs: 1
    workers: 1
    note: >-
      Machine protection only; time/CPU advisory. The feasibility gate
      exists so a dimension whose candidate count is much larger than
      dimension-4's 234,220 stops as an impediment instead of overrunning.
  stopping_rules:
    - >-
      Stop after the single run covers both dimensions (or the first hit,
      archived with its polynomial), or at the first feasibility-gate or C1
      failure, whichever comes first; archive either way.
    - >-
      FEASIBILITY GATE: before each dimension's exact tests, count
      candidates per multiple WITHOUT Sturm tests. If the projected exact
      test count exceeds 50,000,000 at that dimension, stop that dimension
      as an impediment with the count reported, never as evidence.
    - >-
      Timeout, crash, memory cap: infrastructure stop, never evidence.
  invalidation_rules:
    - C1 disagreement (104 / 234,220 / zero hits not reproduced): run invalid.
    - An empty sweep (zero candidates at some multiple where the count formula says otherwise): run invalid; C3 counts decide.
    - A silently classified boundary case (found in review): that cell recomputed; run otherwise stands with the deviation recorded.
    - No claim wording beyond H-FROB-ff99bf's interpretation limits: nothing about dimension >= 7, other q, other n, non-abelian groups, or the degree half.
  success_criterion: >-
    A completed run with C1 passing, the feasibility gate evaluated per
    dimension, and a per-dimension verdict: ZERO HITS (claim supported at
    dimensions 5-6 over F_2) or HITS with polynomials (claim falsified;
    artifact recorded). Either verdict completes the experiment.
  falsification_criterion: >-
    One or more admissible degree-10 or degree-12 Weil polynomials with
    P(1) divisible by 131, after C1 passes and C2/C3 find no instrument
    defect. The hit(s) and their polynomials are the refutation artifact
    (strongest checkable form: counterexample certificate).
  required_artifacts:
    - experiments/EXP-FROB-720a77/specification.yaml
    - experiments/EXP-FROB-720a77/implementation/ (census extension with provenance)
    - experiments/EXP-FROB-720a77/runs/<RUN-ID>/ (command.txt, environment.json, stdout.log, stderr.log, manifest.yaml, per-dimension JSON results)
    - experiments/EXP-FROB-720a77/RESULTS.md (per-dimension table + verdict)
    - a Coordinator evidence record and decision citing both, on review.
  measured_vs_modeled: >-
    Measured: exact hit and candidate counts. Modeled: the Weil range
    bounds (1+sqrt(2))^{2g} per dimension. No distributional model.
  claim_tier_note: >-
    Toy-of-nature tier: a finite exact census. Observations only until the
    separate review process supports a state transition; a miss is a scoped
    exclusion, never a closure of KN-OPEN-095df5.
  drafting_provenance: >-
    Contract restated from H-FROB-ff99bf's frozen fields by the Coordinator
    session of 2026-10-05 (opencode runtime, branch
    coord/cl-dim56-exclusion-20261005) under DEC-20261005-0f460b. No new
    scientific content beyond the hypothesis record.
  assigned_to: executor
  approved_by: coordinator
