experiment:
  id: EXP-ECDLP-8e50bd
  hypothesis_id: H-ECDLP-8db55b
  version: 1
  title: >-
    Is the CM-trace factor base log-random? Yield, maximal Fourier
    coefficient and solver cost against a random null, an equal-class-number
    second-trace null, two comparison bases, a blocking exhaustive trace
    histogram, a PLANTED arithmetic-progression arm at three densities, and a
    curve-content audit that declares two of the four arms curve-free in
    advance
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260904-ae82ce

  objective: >-
    Populate the implicit-membership cell of a standing open problem with a
    concrete closed, Bezout-tight factor base of tunable size and polylog
    membership, and then measure whether that base is indistinguishable from
    a size-matched random subset on the three statistics that matter - exact
    arity-3 decomposition yield, maximal Fourier coefficient along the
    discrete-log coordinate, and Groebner solve cost. E1 (predicted) closes
    the membership-cost and description-degree readings of the open problem
    with a mechanism; E2 would be the first coordinate-defined base in this
    corpus with a measurable additive signal. This contract is DRAFT and
    confers no execution authority.

  preregistered_prediction:
    quantity: >-
      Y1 = |F_t0| / H(4p - t0^2), dimensionless.
      Y2 = mean exact arity-3 decomposition count of F_t0 divided by that of
      the size-matched random null, dimensionless.
      Y3 = the maximal Fourier coefficient of the base along the discrete-log
      coordinate, normalised by the in-run extreme-value prediction for a
      random subset of the same size, dimensionless.
      Y4 = Groebner solve cost divided by charged exhaustive enumeration
      cost, BOTH IN F_p MULTIPLICATIONS, dimensionless.
      Y5 = the Y3 excess recovered on a planted arithmetic progression of
      declared density, dimensionless.
    formula: >-
      E1 (predicted): Y1 within [0.8, 1.2] wherever the class number is at
      least 200; Y2 within 1 plus or minus three times the inverse square
      root of (targets times mean); Y3 within the null's 95 percent
      extreme-value band; Y4 at least 0.5 for both F_t0 and the random null.
      E2: one of Y2, Y3 or Y4 outside its band for F_t0, INSIDE for the
      random null AND for the equal-class-number second-trace null, and
      persisting at the next larger prime.
      FORCED SEPARATELY: the exhaustive trace histogram equals the exact
      Kronecker class numbers TO THE POINT; the multiplicative-subgroup arm
      reproduces its committed count; the interval arm reproduces its
      recorded Fourier constant; Y5 is monotone in the planted density and
      resolved at each declared density.
    source: >-
      The size law from the count of curves with prescribed trace by
      Kronecker class numbers - RECALLED, quoted at Stage 0, and checked
      against the exhaustive histogram so the toy result does not depend on
      the citation being right. The Y2 mean from the exact representation-count
      identity, which holds for every subset. The Y3 null band computed
      IN-RUN from the random-null replicates rather than imported from any
      record. The Y4 unit prediction from the completely split membership
      polynomial - a POINTER only, since the record stating it was opened by
      nobody, which is why Y4 is measured rather than assumed.

  inputs:
    curves: >-
      Three prime-order-subgroup curves per p, ordinary, screened for
      anomalous and smooth order before entering the run set; the two special
      j-invariants excluded from every base.
    primes: "p in {2^12, 2^16, 2^20}"
    traces: >-
      Three shifts of t0 from the Hasse edge per curve, giving |F_t0| about
      p^{1/4}, p^{1/3} and p^{1/2}; t0 chosen with p not dividing t0 and D0
      not a special discriminant times a square.
    base_construction: >-
      EXHAUSTIVE at toy scale: point-count the auxiliary curve for the
      x-coordinate of every point of G and keep those with trace plus or
      minus t0. The membership cost is CHARGED as one point count per test
      and reported beside every count.
    comparison_bases: >-
      Five arms at matched size within 5 percent, through byte-identical
      routines: NULL-1 a uniform random subset of G; NULL-2 the CM-trace base
      for a SECOND trace with equal class number; COMPARISON the known
      cheap-membership multiplicative-subgroup base; REFERENCE the interval-x
      base; PLANTED an arm carrying an arithmetic progression of declared
      density in the discrete-log coordinate.

  independent_variables:
    - "base construction: F_t0, NULL-1, NULL-2, COMPARISON, REFERENCE, PLANTED"
    - "size exponent beta, via the shift s, at three values per curve"
    - "p in {2^12, 2^16, 2^20}"
    - "planted-AP density at three declared values"

  null_object:
    name: >-
      NULL-1, THE SIZE-MATCHED UNIFORM RANDOM SUBSET (blocking, all arms) and
      NULL-2, THE EQUAL-CLASS-NUMBER SECOND-TRACE BASE (blocking, and the arm
      that separates STRUCTURE from SIZE).
    construction: >-
      NULL-1: a uniformly random subset of G of size |F_t0|, freshly sampled
      per replicate, pushed through byte-identical yield, Fourier and solver
      routines. It shares only the SIZE.
      NULL-2: the CM-trace base F_t0' for a SECOND trace t0' whose Kronecker
      class number equals H(4p - t0^2) within 5 percent. It shares the size,
      the construction TYPE, the membership cost and the CM provenance, and
      differs only in which trace. This is the arm that decides whether any
      observed deviation is a property of the construction FAMILY (in which
      case NULL-2 shares it, and the finding is about size or about CM bases
      in general) or of the specific t0 (in which case it does not).
    non_degeneracy_check: >-
      PERFORMED PER ARM, AND IT RETURNS DIFFERENT ANSWERS PER ARM, WHICH IS
      THE POINT.
      Y1: non-degenerate. The ratio of a measured count to an independently
      computed class number can take any value; the band [0.8, 1.2] is
      narrow relative to the space of outcomes.
      Y2 AND Y3 AGAINST NULL-1: non-degenerate as comparisons - the two bases
      have different discrete-log multisets and their statistics are computed
      independently, so a deviation is possible and the planted arm shows it
      is achievable. BUT SEE THE CURVE-CONTENT AUDIT BELOW: they are
      degenerate as CURVE statements, being functions of the log multiset
      alone.
      Y4: non-degenerate, and it is the only arm whose input is not the log
      multiset.
      A DEGENERATE COMPARISON THAT IS DECLARED AND NOT RUN AS A TEST: F_t0
      against a subset of Z/N with the IDENTICAL log multiset. Y2 and Y3
      would agree EXACTLY, by construction, because both are functions of
      that multiset. That comparison is therefore not a test at all and is
      recorded here as the PROOF of the curve-content audit rather than
      executed as an arm.
    dynamic_range_demonstration: >-
      THE PLANTED ARITHMETIC-PROGRESSION ARM, at three declared densities.
      Construct a base of the SAME size as F_t0 whose discrete logarithms are
      deliberately NOT log-random by a known amount: the union of a random
      subset with a planted arithmetic progression occupying a declared
      fraction rho of the base, at rho in three declared values with the
      SMALLEST chosen at the edge of the Y3 null band. FORCED: the Y3 excess
      over the null band is MONOTONE in rho and is resolved at every declared
      rho; Y2's yield also deviates measurably at the largest rho. THE
      CONSEQUENCE IS BINDING: a pipeline that cannot resolve the SMALLEST
      planted rung cannot honestly declare E1 at that band, and the band is
      WIDENED to the smallest resolved rung, recorded as a versioned protocol
      amendment, BEFORE any F_t0 arm is read. This is what the source's
      control set lacked: it had two nulls and a known-answer calibration but
      nothing that measured how large a departure the instrument can actually
      see.
    curve_free_null: >-
      REQUIRED, AND HERE IT RESOLVES INTO A SHARP STRUCTURAL FINDING STATED
      BEFORE THE RUN RATHER THAN AN ARM RUN AFTER IT.
      Y2 AND Y3 ARE FUNCTIONS OF THE DISCRETE-LOG MULTISET OF THE BASE AND OF
      NOTHING ELSE. The arity-3 representation count of a target is a count
      of solutions to a sum condition among the base logarithms; the maximal
      Fourier coefficient is computed from those logarithms directly. The
      curve, the x-coordinates and the trace predicate enter ONLY through
      which multiset arises. Consequently a curve-free arm on Z/N with the
      SAME log multiset would return BIT-IDENTICAL values for Y2 and Y3 -
      the comparison is width-zero by construction and is therefore not run
      as a test. What that identity PROVES, and it is the deliverable of this
      section, is that Y2 and Y3 CARRY ZERO ELLIPTIC-CURVE CONTENT under any
      outcome.
      THE ONE ARM THAT CAN CARRY CURVE CONTENT IS Y4, because its input is a
      membership polynomial built from the x-COORDINATES rather than from the
      logarithms. Its curve-free null is therefore RUN AND IS NON-TRIVIAL: a
      Groebner solve on the same decomposition ideal with the membership
      polynomial replaced by a DENSE random polynomial of the SAME degree
      over F_p, carrying no curve and no CM structure. That arm is NULL-1's
      solver arm and it is blocking.
    pre_declared_consequence: >-
      DECLARED IN ADVANCE, BEFORE ANY CELL RUNS, AND BINDING.
      (i) NO OUTCOME OF Y2 OR Y3 - NEITHER E1 NOR E2 - MAY BE QUOTED AS A
      STATEMENT ABOUT ELLIPTIC CURVES, ABOUT COMPLEX MULTIPLICATION, OR ABOUT
      THE ECDLP. They are statements about a subset of Z/N. If E1 holds on
      them, the honest headline is "a size-matched subset of a cyclic group
      behaves like a size-matched random subset"; if E2 holds on them, the
      honest headline is "a particular subset of Z/N has an additive signal",
      and locating that signal's source in the CM construction would require
      a separate argument this contract does not supply.
      (ii) Y4 IS THE ONLY ARM WHOSE OUTCOME MAY BEAR ON CURVE STRUCTURE, and
      only by DIFFERENCE from its own curve-free null (the dense random
      membership polynomial of matched degree). If Y4 matches that null,
      nothing about CM structure is measured either, and the whole experiment
      is a statement about cyclic groups and dense polynomial systems.
      (iii) UNCONDITIONALLY: nothing in this contract is an attack, and the
      base's own accounting is a NEGATIVE delta - at its size floor and unit
      solver behaviour it would sit at exponent 1 in N, worse than the
      generic baseline by about N^{1/2}. That must accompany any quotation of
      the construction.

  controls:
    - >-
      KNOWN-ANSWER CALIBRATION (blocking, runs first): at the smallest prime,
      the FULL trace histogram over every j in F_p, computed by exhaustive
      point counting, must equal the independently computed exact Kronecker
      class numbers TO THE POINT. This is what makes the size law
      load-bearing at toy scale despite its ineffective o(1), and it is the
      check that does not depend on any recalled citation being right.
    - >-
      NULL-1, size-matched uniform random subset, byte-identical routines
      (blocking, all arms), with replicates so Y3's band is computed in-run.
    - >-
      NULL-2, second trace with equal class number (blocking): separates
      construction-family effects from t0-specific ones.
    - >-
      COMPARISON ARM, the known cheap-membership multiplicative-subgroup base
      at equal size (blocking): must reproduce its committed count and its
      predicted exhaustiveness. It is the POSITIVE CONTROL for the solver
      arm's ability to detect a sparsity effect WITHOUT calling it an
      exponent - its Y4 may sit below by a polynomial factor and that is
      PRE-REGISTERED AS NOT AN EXPONENT.
    - >-
      REFERENCE ARM, the interval-x base for the Fourier statistic, which
      must reproduce its recorded constant (calibration).
    - >-
      PLANTED-AP ARM at three declared densities (blocking dynamic-range
      check). See null_object.
    - >-
      Y4 CURVE-FREE NULL (blocking): the same Groebner solve with the
      membership polynomial replaced by a DENSE random polynomial of matched
      degree over F_p.
    - >-
      MEMBERSHIP-COST ACCOUNTING CHECK (blocking): the membership cost is
      charged as one point count per test and reported BESIDE every count. A
      yield number reported without its charged membership cost is a count,
      not a cost, and is inadmissible.
    - >-
      BEZOUT-TIGHTNESS CHECK: the membership polynomial's degree against
      |F_t0|; the base must MEET the bound rather than exceed it.
    - >-
      EXCLUSIONS, applied before any curve or trace enters the run set:
      anomalous and smooth-order curves; special j-invariants; p dividing t0;
      special discriminants.

  metrics:
    primary:
      - "Y1 = |F_t0| / H(4p - t0^2) per (p, E, t0); DIMENSIONLESS; band [0.8, 1.2] where the class number is at least 200"
      - "Y2 = mean exact arity-3 decomposition count, F_t0 over NULL-1, and the same for NULL-2 and COMPARISON; DIMENSIONLESS; with variance and coverage in the same band and bootstrap intervals"
      - "Y3 = maximal Fourier coefficient along the discrete-log coordinate, normalised by the IN-RUN extreme-value prediction from NULL-1 replicates; DIMENSIONLESS"
      - "Y4 = Groebner solve cost divided by charged exhaustive enumeration cost, BOTH IN F_p MULTIPLICATIONS via the solver's own operation counter and the enumeration's counted operations; DIMENSIONLESS; wall clock reported separately and NEVER used in this ratio"
      - "Y5 = planted-AP recovery: the Y3 excess over the null band per declared density; DIMENSIONLESS; required monotone and resolved at every rung"
      - "trace-histogram calibration: measured counts against exact Kronecker class numbers; ABSOLUTE INTEGER COUNTS, exact equality required"
    secondary:
      - "|F_t0| and H(4p - t0^2) per cell; INTEGER counts"
      - "mean, variance and coverage of exact arity-3 counts for all six bases with bootstrap intervals; dimensionless"
      - "membership cost per test in F_p operations, per base; INTEGER count, reported beside every yield number"
      - "membership polynomial degree against |F_t0|; INTEGER; the Bezout-tightness check"
      - "Groebner first-fall degree and solution count per cell; INTEGER"
      - "Y4 for the dense-random-membership curve-free null; dimensionless"
      - "fitted solver exponent across the three sizes, per base; dimensionless"
      - "wall-clock seconds and peak RSS in GiB per stage; reported as diagnostics only"
      - "pass or fail of every blocking control, listed individually"

  heuristic_under_test: HEUR-CM-2

  scale_relevance:
    tier: toy
    justification: >-
      p at most 2^20, exhaustive base construction by point-counting every
      element of G, and brute-force discrete logarithms for the Fourier arm -
      both of which cap the ladder and are why it stops there. NO TRANSFER TO
      CRYPTOGRAPHIC p IS CLAIMED OR LICENSED. AND, STATED PLAINLY RATHER THAN
      NARROWED AWAY: THE STRUCTURAL SIZE AND SPLITTING STATEMENTS CANNOT BE
      TESTED AT REACHABLE SCALE AT ALL. They carry an ineffective o(1) from
      the class-number estimate, so no finite computation can confirm the
      asymptotic form; what the toy run checks is EXACT class numbers at
      three primes, which validates the construction and the count but not
      the asymptotics. Likewise the polylog membership claim is read from the
      literature and the toy run only checks the COUNT of point counts, not a
      representative timing, because point-counting cost at 2^20 says nothing
      about it at cryptographic size.
    correspondence: null

  tail_checks:
    - "The maximum per-target arity-3 count against equal numbers of NULL-1 replicates, so a real effect is a shift of the distribution and not one outlier cell."
    - "The maximum Fourier coefficient across all F_t0 cells against the maximum across an equal number of NULL-1 replicates."
    - "The cells with the SMALLEST class number, where Y1's binomial fluctuation is largest and the [0.8, 1.2] band is weakest; reported separately from cells with class number at least 200."
    - "The smallest planted-AP density, which sets the pipeline's measured floor and decides whether the E1 band is honest."
    - "The largest-|F| solver cell, where the dense membership polynomial is heaviest and where a memory abort is most likely; reported with its peak RSS."

  replication:
    seeds: [61, 67, 71, 73, 79]
    independent_instances: 9
  seeds_policy: >-
    Five declared seeds, fixed here before execution and never re-drawn after
    an outcome is seen. Seeds govern NULL-1's random subsets (one per
    replicate, with enough replicates that Y3's extreme-value band is
    computed IN-RUN rather than imported), the planted-AP arm's random
    component, the target draws for the yield and solver arms, and the dense
    random membership polynomial of the Y4 curve-free null. F_t0, NULL-2, the
    COMPARISON base and the REFERENCE base are DETERMINISTIC given (p, E, t0)
    and carry no seed variation; reporting a seed spread for them is
    prohibited. The generator used for the discrete-logarithm computation is
    recorded per cell, because changing it permutes the logarithms and
    changes Y3's argmax though not its maximum. Every cell record carries
    (p, E, t0, base, |F|, generator, seed, RNG algorithm and state).

  budget:
    wall_clock_seconds_per_run: 14400
    total_cpu_hours: 60
    maximum_memory_gb: 32
    maximum_runs: 12
    maximum_workers: 1
  budget_note: >-
    Sized to the two real costs. (1) EXHAUSTIVE BASE CONSTRUCTION: at
    p = 2^20 this is on the order of 10^6 point counts on auxiliary curves,
    the dominant wall-clock item, done once per (p, E) and cached across the
    three t0 values. (2) THE SOLVER ARM: a Groebner solve on an ideal
    carrying a DENSE membership polynomial of degree up to about 2^10 is
    memory-heavy, which is why the memory figure is 32 GB rather than the
    schema floor and why the cell is capped at p = 2^20. A solver cell
    exceeding the declared memory is recorded as NOT COMPUTABLE IN BUDGET and
    is an INFRASTRUCTURE stop under AGENTS.md rule 5, never evidence about
    the solver exponent. The RATIO, not the absolute time, is the metric,
    which is why both sides of Y4 are counted in F_p multiplications.

  stopping_rules:
    - "STAGE 0, zero compute, HARD GATE: quote the size law, the point-counting cost class, and the complete-splitting statement in the EXACT form used, including the weight convention at the special j-invariants and the p-not-dividing-t0 condition; write the size-floor computation at the Hasse edge. Then run the exhaustive trace histogram at the smallest prime against exact class numbers. A mismatch STOPS everything and nothing is reported."
    - "STAGE 1: build F_t0 and all five comparison bases at every cell, with sizes matched within 5 percent and the Bezout-tightness check recorded."
    - "STAGE 2: the yield arm, 200 targets per cell, exact enumeration, with the membership cost charged and reported beside every count."
    - "STAGE 3: brute-force logarithms and the Fourier arm, with the null band computed in-run from NULL-1 replicates. THE PLANTED-AP ARM RUNS HERE, BEFORE the F_t0 result is read; if the smallest declared density is not resolved, the band is WIDENED and amended before proceeding."
    - "STAGE 4: the solver arm, 20 targets per cell, with the Y4 curve-free null."
    - "STAGE 5: ONLY on a band excess - one larger p and the second-trace arm. A deviation that does not persist, or that NULL-2 shares, is a controlled null."
    - "No deployed parameter is touched; every instance is toy and self-generated."

  invalidation_rules:
    - "Any execution while status is not approved, or while execution_authorized is false."
    - "Reporting a yield number without its charged membership cost."
    - "Using wall-clock time as either side of the Y4 ratio. Both sides are in F_p multiplications; wall clock is a diagnostic only."
    - "Comparing bases whose sizes differ by more than 5 percent, or running them through non-identical routines."
    - "Declaring E1 at a band narrower than the smallest planted-AP density the pipeline actually resolved."
    - "Running the log-matched Z/N comparison as a TEST of Y2 or Y3; it is identical by construction and is recorded as a proof, not executed as an arm."
    - "Quoting any Y2 or Y3 outcome as a statement about elliptic curves, complex multiplication or the ECDLP."
    - "Quoting the construction without its negative accounting - exponent 1 at the size floor under unit solver behaviour, worse than the generic baseline by about N^{1/2}."
    - "Including an anomalous curve, a special j-invariant, a t0 divisible by p, or a special discriminant."
    - "Any post-hoc change to the bands, the planted densities, the size grid or the exclusions. A change requires a versioned protocol_amendment before the affected cells are re-read."

  success_criterion: >-
    The run SUCCEEDS as a measurement, whichever explanation it supports,
    when: the exhaustive trace histogram matches the exact class numbers to
    the point at the smallest prime; all six bases are constructed at matched
    size with the Bezout-tightness check recorded; Y1 is reported per cell;
    Y2 and Y3 are reported for all six bases on byte-identical routines with
    the Y3 null band computed in-run; the planted-AP arm is resolved at every
    declared density or the band is widened and amended; Y4 is reported in
    F_p multiplications for F_t0, NULL-1, the COMPARISON arm and the
    curve-free dense-polynomial null; the membership cost is charged and
    reported beside every count; and the outcome is classified as E1 or E2
    per arm by the pre-registered rule, WITH the curve-content audit applied
    so that Y2 and Y3 outcomes are labelled as statements about a subset of
    Z/N.

  falsification_criterion: >-
    NOTHING IS REPORTED if the trace-histogram calibration fails - the
    instrument or the quoted theorem is wrong. THE SIZE LAW OR ITS
    INDEPENDENCE HEURISTIC IS WRONG, and is re-derived before any other arm
    is read, if Y1 falls outside [0.8, 1.2] at two consecutive primes where
    the class number is at least 200. E2 IS DECLARED on Y2 or Y3 if F_t0 is
    outside its band while BOTH NULL-1 and NULL-2 are inside, persisting at
    the next larger prime - a lead, routed to independent review, still no
    attack, AND still not a statement about elliptic curves by the
    curve-content audit. E2 ON THE SOLVER AXIS is declared if the fitted
    solver exponent is below 0.9 for F_t0 across three sizes and not for
    NULL-1; this is the ONLY arm whose E2 could bear on curve structure, and
    only by difference from its own curve-free null. E1 IS DECLARED, and the
    membership-cost and description-degree readings of the open problem
    closed with a mechanism, if all bands are met. THE RUN SET IS VOID if any
    blocking control fails, or if the planted-AP arm is not resolved at the
    smallest declared density without the band being widened and amended
    first.

  required_artifacts:
    - "Stage 0 receipt: the quoted size law with its exact weight convention, the point-counting cost class, the complete-splitting statement, the size-floor computation, and the source of each quotation marked RECALLED."
    - "The exhaustive trace histogram at the smallest prime beside the independently computed exact Kronecker class numbers."
    - "Per-cell base records: p, curve, t0, |F_t0|, H(4p - t0^2), Y1, membership polynomial degree, Bezout-tightness result, generator, seed."
    - "Yield tables for all six bases with mean, variance, coverage, bootstrap intervals, and the CHARGED membership cost beside every count."
    - "Fourier tables for all six bases with the in-run extreme-value band from NULL-1 replicates and the interval reference arm's calibration constant."
    - "The planted-AP table: declared density, recovered Y3 excess, resolved yes/no per rung; plus the protocol amendment if the band was widened."
    - "Solver tables in F_p MULTIPLICATIONS for F_t0, NULL-1, COMPARISON and the dense-random curve-free null, with first-fall degree, solution count, fitted solver exponent, and wall clock reported separately as a diagnostic."
    - "The curve-content audit as a written statement, showing that Y2 and Y3 are functions of the discrete-log multiset alone and are therefore curve-free by construction."
    - "The negative accounting: the construction's exponent at its size floor under unit solver behaviour, against the generic baseline."
    - "Run manifest with exact command, git commit and dirty-tree state, environment and dependency versions, RNG algorithm and seeds, requested policy, resolved model identifier and probe status, stdout and stderr, peak RSS, wall clock, and the list of cells not computable in budget."
    - "A report carrying, verbatim, all three parts of null_object.pre_declared_consequence."

  assigned_to: executor

  limitations:
    - >-
      NOT A NO-GO AND NOT AN ATTACK. E1 closes only the membership-cost and
      description-degree READINGS of the open problem, not the problem.
    - >-
      Y2 AND Y3 CARRY ZERO ELLIPTIC-CURVE CONTENT BY CONSTRUCTION, being
      functions of the discrete-log multiset alone. Only Y4 can bear on curve
      structure, and only by difference from its own curve-free null.
    - >-
      The base's size floor at exponent 1/4 means it never enters the strict
      interior of the admissible region on its own.
    - >-
      Every external theorem this construction rests on is RECALLED and was
      opened by no agent in this program; the exhaustive trace histogram is
      what makes the toy result independent of those citations being right.
      Three internal records are cited as pointers with verified_by null and
      nothing rests on them.
    - >-
      THE ASYMPTOTIC SIZE AND SPLITTING STATEMENTS CANNOT BE TESTED AT
      REACHABLE SCALE: they carry an ineffective o(1). The run checks exact
      class numbers at three primes and nothing more.
    - >-
      The polylog membership claim is read from the literature; the toy run
      checks the COUNT of point counts, not a representative timing.
    - >-
      Toy tier throughout, capped by exhaustive construction and brute-force
      logarithms.
    - >-
      No status change to any record is proposed or implied.
