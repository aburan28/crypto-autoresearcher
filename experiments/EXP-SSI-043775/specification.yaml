# =============================================================================
# EXP-SSI-043775 — version 1, approved by DEC-20261006-a0c0e6.
# Frozen Cartier-Manin rank census for IDEA-20261005-2f5c3f. The prediction
# is the rank set {0, 1, 2}, separating ordinary, intermediate, and
# superspecial. A missing rank, or a rank that fails a separation row, is a
# negative. No isogeny-path algorithm. No run in this design.
# The source idea is on origin/design/cycle-20261005-domain and is not copied.
# =============================================================================
experiment:
  id: EXP-SSI-043775
  hypothesis_id: H-SSI-defd87
  question_id: RQ-SSI-001
  source_idea: IDEA-20261005-2f5c3f
  goal_id: null
  version: 1
  title: >-
    Cartier-Manin ranks on genus-2 quintics over F_5, predicted exactly
    {0, 1, 2}, separating ordinary, intermediate, and superspecial
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: coordinator
    approved_by_role: coordinator
    composing_decision: DEC-20261006-a0c0e6
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06: "all is
      approved. ideas/experiments should be always approved") because every
      field the design protocol requires is non-null. Approval does not assert
      that the ranks are {0, 1, 2}, does not assert that those ranks separate
      the three reduction types, does not assert an isogeny-path algorithm,
      and does not assert an ECDLP exponent improvement.
    implementation_authorized: true
    scientific_execution_authorized: true
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide which completed outcome the F_5 quintic census supports. Success
    is the rank set exactly {0, 1, 2} on the squarefree monic quintics, with
    the three separation rows holding and the elliptic control passing. A
    missing rank, or a rank that fails a separation row, is a negative, so
    success can fail.

  inputs:
    field: F_5
    surface_model: y^2 = f, f monic of degree 5
    monic_count: 3125
    enumeration_order: >-
      Index i from 0 through 3124. Write i in base 5 as five digits
      (e4, e3, e2, e1, e0), each in {0, 1, 2, 3, 4}, with e0 the least
      significant digit. Then f = x^5 + e4 x^4 + e3 x^3 + e2 x^2 + e1 x + e0.
      Seed 0 names this order. It is not a pseudorandom draw. Visiting a
      count other than 3125 invalidates the run.
    squarefree: >-
      Keep f when gcd(f, f') = 1 in F_5[x]. Exclude every other f before
      the matrix is read. The sentinel f = x^5 (index 0) has f' = 0 and
      must be excluded. If index 0 appears in the rank multiset, the filter
      failed and the run is invalid.
    cartier_matrix:
      power: f^{(5-1)/2} = f^2
      expansion: f^2 = sum_{k=0}^{10} c_k x^k, coefficients in F_5
      index: >-
        The 2 by 2 matrix M over F_5 has rows and columns indexed by
        {1, 2}, with M_{i,j} equal to c_{5 i - j}. Explicitly,
        M_11 = c_4, M_12 = c_3, M_21 = c_9, M_22 = c_8. Missing powers
        are coefficient 0. This is the only index. Do not try another
        index after any surface rank is computed.
      rank: the rank of M over F_5, an integer in {0, 1, 2}
      names:
        2: ordinary
        1: intermediate
        0: superspecial
    newton:
      counts: >-
        For a squarefree f, let N_k be the number of projective points of
        y^2 = f over F_{5^k}, including the single point at infinity.
        Affine points: for each x in the field, two points when f(x) is a
        nonzero square, one when f(x) = 0, and none when f(x) is a
        nonsquare.
      polynomial: >-
        s1 = 6 - N_1. Let p2 = 26 - N_2. Then s2 = (s1^2 - p2) / 2, and s2
        must be an integer. The characteristic polynomial is
        T^4 - s1 T^3 + s2 T^2 - 5 s1 T + 25.
      valuation: >-
        v_5(0) is treated as +infinity and that point is omitted from the
        hull. v_5 of a nonzero integer is the usual 5-adic valuation.
      hull_points: >-
        (0, 0), (1, v_5(s1)) if s1 ≠ 0, (2, v_5(s2)) if s2 ≠ 0,
        (3, 1 + v_5(s1)) if s1 ≠ 0 else omit, (4, 2).
      p_rank: >-
        The Newton p-rank is the total horizontal width of the edges of
        slope 0 on the lower convex hull of those points. It is an integer
        in {0, 1, 2}. A non-integral s2, or |s1| > 8, means the point
        counter is broken: the run is invalid and no rank is read.
    elliptic_control:
      models: >-
        All A, B in F_5 for y^2 = x^3 + A x + B. Discard a model when
        4 A^3 + 27 B^2 = 0 in F_5. That is the singular locus in
        characteristic not 2 or 3.
      entry: >-
        Let g = (x^3 + A x + B)^2. The Cartier entry is the coefficient
        of x^4 in g. The same power and the same "coefficient of x^{p-1}"
        rule as the surface index at g = 1.
      trace: t = 6 - N, where N is the number of projective points over F_5, including infinity.
      mismatch: >-
        A model mismatches when the entry is 0 and 5 does not divide t, or
        when the entry is nonzero and 5 divides t. Both mismatch counts
        must be 0. A positive count rejects the index. Surface ranks are
        then not read, and the run is invalid.
    product_control: >-
      If the elliptic list contains a curve with 5 dividing t, record that
      its Cartier entry is 0 and assign a-number 1 under the accepted
      index. The product of two such curves is assigned a-number 2 by
      adding the factors. If no such curve exists, record that the product
      control did not run. That gap does not by itself invalidate the
      surface rank image.
    seeds: [0]
    forbidden:
      - Do not claim an isogeny-path algorithm.
      - Do not claim an ECDLP exponent improvement.
      - Do not change the matrix index after seeing a surface rank.
      - Do not read a surface rank when an elliptic mismatch count is positive.
      - Do not include a squareful quintic in the rank multiset.
      - Do not treat a result here as a statement about CSIDH or SQIsign parameters.

  controls:
    - id: elliptic-dictionary
      statement: >-
        The Cartier entry on a nonsingular short-Weierstrass curve over
        F_5 vanishes if and only if 5 divides the trace.
      pass_condition: both mismatch counts are 0
      on_fail: The index is rejected. The run is invalid. No surface rank is read.
    - id: squarefree-sentinel
      statement: The quintic x^5 is squareful and is excluded before the matrix is read.
      pass_condition: index 0 is not in the rank multiset, and quintics_visited is 3125
      on_fail: The filter failed. The run is invalid. No rank image is read.
    - id: newton-integral
      statement: >-
        On every squarefree quintic, s2 is an integer and |s1| is at most 8.
      pass_condition: both hold on every kept curve
      on_fail: The point counter is broken. The run is invalid. No rank is read.
    - id: product-gap
      statement: >-
        If a trace-zero elliptic curve exists, its Cartier entry is 0 after
        the dictionary control has passed.
      pass_condition: either no trace-zero curve exists and the gap is recorded, or every trace-zero curve has entry 0
      on_fail: H2 fails on that curve. The run is invalid. No surface rank is read.

  independent_variables:
    - the monic quintic f, all 3125 of them, in the frozen base-5 order
    - whether f is squarefree
    - the elliptic coefficients (A, B), as the control arm

  metrics:
    primary:
      - id: cartier_rank_image
        statement: >-
          The set of Cartier ranks on the squarefree monic quintics. The
          prediction is {0, 1, 2}. A proper subset is the negative.
      - id: separation_rows
        statement: >-
          Three rows. Rank 2 if and only if Newton p-rank is 2. Rank 0
          occurs only on Newton p-rank 0. Both ranks 0 and 1 occur among
          the Newton p-rank 0 curves. Any failed row is the negative.
    secondary:
      - id: rank_counts
        statement: The number of squarefree quintics of each rank in {0, 1, 2}.
      - id: elliptic_mismatch_counts
        statement: The two mismatch counts, each predicted 0.
      - id: elliptic_rank_image
        statement: >-
          The set of Cartier ranks on the nonsingular elliptic models.
          Record the size. Dimension 1 is predicted to have size 2 when
          both trace classes occur.
      - id: trace_zero_exists
        statement: Whether a nonsingular elliptic curve over F_5 has trace divisible by 5.
      - id: quintics_visited
        statement: Must equal 3125.
      - id: squarefree_count
        statement: How many of the 3125 quintics passed the gcd filter.

  heuristic_under_test: H1
  heuristic_under_test_note: >-
    H1 is the identification of matrix rank with 2 minus the a-number,
    accepted only after the elliptic mismatches are 0. A separation-row
    failure falsifies that reading on this list. A positive mismatch
    count rejects the index and falsifies nothing about the surface.
    H2 is the product additivity check on the elliptic list.

  preregistered_prediction:
    quantity: >-
      The set of Cartier-Manin ranks of y^2 = f for monic squarefree
      quintics f over F_5, and the agreement of those ranks with the
      Newton p-rank rows named in metrics.separation_rows.
    formula: >-
      The set equals {0, 1, 2}. Rank 2 matches Newton p-rank 2 in both
      directions. Rank 0 occurs only on Newton p-rank 0. Both ranks 0 and
      1 occur on Newton p-rank 0. A missing rank is a negative. A failed
      separation row is a negative. No other formula is written here.
    source: >-
      The set {0, 1, 2} and the three names are copied from
      IDEA-20261005-2f5c3f before any run of EXP-SSI-043775. The matrix
      index is the genus-1 Hasse coefficient of x^{p-1}, extended by
      M_{i,j} = c_{p i - j}, frozen here before any surface rank is
      computed. The Yui sentence is provenance recalled and is not this
      formula.

  scale_relevance:
    tier: toy
    justification: >-
      The tested object is the complete list of monic quintics over F_5.
      A result here is not a result at a cryptographic prime, not a CSIDH
      cost, and not an isogeny-path exponent. No extrapolation is
      authorized.
    correspondence: >-
      Direct enumeration of 3125 polynomials. No Deuring correspondence
      and no sampling equivalence to a larger field is used.

  tail_checks:
    - >-
      There is no smoothness tail. The extreme check is a rank that
      occurs once: it still counts as present. Report the three counts.
      A single curve that fails a separation row is already the negative.

  replication:
    seeds:
      - name: base5-coeff
        algorithm: coefficient order described in inputs.enumeration_order
        seed: [0]
        note: >-
          One exhaustive pass. Adding a second scientific enumeration
          order is a protocol amendment. Seed 0 does not draw a sample.
    independent_instances: 1
    independent_instances_note: >-
      One complete finite list. The elliptic control is not a second surface instance.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 2
    maximum_workers: 1
    budget_note: >-
      Time and CPU figures are advisory machine-protection watches
      (docs/research-budget-policy.md). They do not change the 3125
      quintics. maximum_runs is 2 so one infrastructure retry may take a
      new run id. Watch expiry is failed_infrastructure, never a negative
      mathematical result.

  procedure:
    elliptic: >-
      Enumerate the 25 pairs (A, B). Discard singular models. Compute the
      Cartier entry and the trace. Record both mismatch counts. If either
      count is positive, stop as invalid and do not read a surface rank.
    sentinel: >-
      Visit all 3125 quintics in the frozen order. Record the count
      visited. Confirm index 0 is excluded by the gcd test before any
      matrix on a kept curve is stored.
    matrices: >-
      On each squarefree f, compute M and its rank, and compute the Newton
      p-rank. If s2 is not an integer or |s1| > 8, stop as invalid.
    product: >-
      If a trace-zero elliptic curve exists, confirm its entry is 0 and
      record a-number 2 for the product of two such factors. If none
      exists, record the gap and continue.
    mechanism_assignment:
      - observation: >-
          The elliptic mismatches are 0, 3125 quintics were visited, the
          sentinel is excluded, every Newton value is integral, the rank
          image is {0, 1, 2}, rank 2 matches Newton p-rank 2 in both
          directions, rank 0 occurs only on Newton p-rank 0, and both
          ranks 0 and 1 occur on Newton p-rank 0.
        assigns_to: >-
          The prediction holds on this list. The three ranks separate
          ordinary, intermediate, and superspecial in the frozen sense.
          This is not an isogeny path and not an exponent.
      - observation: >-
          The same instrument checks pass, and either the rank image is a
          proper subset of {0, 1, 2}, or at least one separation row fails.
        assigns_to: >-
          Negative. A missing rank, or a rank that does not match the
          reduction type in the frozen rows, is the datum. Success does
          not hold.
      - observation: >-
          An elliptic mismatch count is positive, the visit count is not
          3125, the sentinel is in the rank multiset, a Newton coefficient
          is not integral, or |s1| > 8.
        assigns_to: >-
          Invalid. Not evidence for either reading of the rank set.
      - observation: >-
          The watch expires, a dependency is missing, or the process crashes.
        assigns_to: >-
          failed_infrastructure. Not evidence.

  stopping_rules:
    - Stop when every squarefree quintic has a rank and a Newton p-rank, or when an invalid row fires.
    - Do not add sextics, another prime, or an isogeny graph.
    - Watch expiry stops the run as failed_infrastructure.

  invalidation_rules:
    - A timeout, crash, memory abort, or missing dependency is failed_infrastructure and is not evidence against the hypothesis.
    - Reading a surface rank after a positive elliptic mismatch count invalidates the run.
    - Trying a second matrix index after seeing a surface rank invalidates the run.
    - Reporting success when the rank image is a proper subset of {0, 1, 2}, or when a separation row fails, invalidates the run.
    - Accepting the sentinel x^5 into the rank multiset invalidates the run.

  success_criterion: >-
    The run is a success for the prediction exactly when the first row of
    mechanism_assignment holds: the rank set is {0, 1, 2} and every
    separation row holds. Any other completed assignment is not this
    success. The second row is a negative, so success can fail.

  falsification_criterion: >-
    The prediction is falsified when the second row holds: the rank image
    misses an element of {0, 1, 2}, or a squarefree quintic fails a
    separation row. The third and fourth rows falsify nothing about the
    surface ranks.

  required_artifacts:
    - experiments/EXP-SSI-043775/runs/RUN-*/manifest.yaml
    - experiments/EXP-SSI-043775/runs/RUN-*/stdout.txt
    - experiments/EXP-SSI-043775/runs/RUN-*/stderr.txt
    - experiments/EXP-SSI-043775/runs/RUN-*/raw-result.json
    - experiments/EXP-SSI-043775/runs/RUN-*/verdict.yaml
  artifact_contents:
    raw-result.json: >-
      quintics_visited, squarefree_count, the rank image, the three rank
      counts, both elliptic mismatch counts, the elliptic rank image,
      whether a trace-zero elliptic curve exists, the product-control gap
      bit, and one row per squarefree quintic with its base-5 index, its
      Cartier rank, s1, s2, and its Newton p-rank.
    verdict.yaml: >-
      Exactly one assignment row from mechanism_assignment, or
      failed_infrastructure with a reason. The verdict quotes the row. It
      does not change hypothesis status. It does not claim an isogeny path.

  assigned_to: executor
  zero_runs_in_design: true
