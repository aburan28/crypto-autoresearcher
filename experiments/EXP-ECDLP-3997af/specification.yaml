experiment:
  id: EXP-ECDLP-3997af
  hypothesis_id: H-ECDLP-29400c
  version: 1
  title: >-
    Mutual information in bits between an endomorphism-image coset indicator
    and factor-base decomposability, run on the full group where the indicator
    is not constant, with a planted 0.25-bit leak fixing the estimator's
    dynamic range and an abelian null fixing the scope of the negative
  status: draft
  objective: >-
    The source proposal's ladder cannot move, and the contract says so before
    it is approved. On a prime-order subgroup every endomorphism prime to the
    order acts as multiplication by a unit, so its image is the whole subgroup
    and the image oracle answers yes for every point at every degree d. That is
    archived as a derivation, not measured.
    What is measured is the only version of the question with a non-constant
    indicator, on the FULL group E(F_p) of even order where the image of
    multiplication by 2 has index 2^t. Two quantities. FIRST, the empirical
    mutual information in bits between the coset indicator and the event that a
    candidate completes a relation over the factor base, predicted 0. SECOND,
    the charged cost per distinct verified relation when candidates are
    filtered by coset, predicted at or above 2^t, which is the opposite
    direction from the source proposal's claimed advantage.
  inputs:
    curve_family: >-
      Toy prime-field short-Weierstrass curves at p in {101, 103, 107, 211,
      1009, 2003}, hygiene-screened per curve with the factored group order,
      the largest prime factor, and an explicit "#E(F_p) != p" check. The panel
      must contain at least three curves with E(F_p) of even order and
      2-torsion rank t = 1, and at least two with t = 2. The rank t is computed
      exactly per curve from the group structure and reported per curve, never
      assumed.
    special_j_stratum: >-
      Curves with j = 0 or j = 1728 carry extra automorphisms. They may be run
      but are reported as a separate stratum and never pooled with the random
      panel, per KN-OPEN-009's standing caveat.
    factor_base: V, a random subset of E(F_p) of size B, chosen independently of every target.
    arity: 3
    B_values: [10, 20, 50]
    samples_per_cell: 100000
    targets_per_cell: 2000
    endomorphisms:
      measured: >-
        Multiplication by 2 on the full group E(F_p), whose image has index 2^t.
      inert_reference_points: >-
        The identity and, on curves with p congruent to 1 mod 3, the j = 0
        automorphism. Both are surjective, so their indicators are constant and
        their measured mutual information must be exactly 0. They are reference
        points with forced values, not arms.
    curve_free_null_instances: >-
      (Z/2N', +) with the index-2 subgroup 2(Z/2N'), at matched order and
      matched factor-base size, carrying the same coset structure with no curve
      and no endomorphism.
  controls:
    - >-
      DERIVATION, NOT AN ARM, RECORDED HERE SO IT IS NOT MISTAKEN FOR ONE. On
      the prime-order subgroup the filtered and unfiltered arms must be
      bit-identical, because the indicator is constant there. This is run once
      as an implementation check with a forced outcome and produces no
      evidence.
    - >-
      PLANTED LEAK OF KNOWN SIZE, BLOCKING. A synthetic indicator that answers
      yes with probability q1 on decomposable candidates and q0 otherwise, with
      the pair (q0, q1) chosen so that the ANALYTICALLY COMPUTED mutual
      information is exactly 0.25 bits at the measured base rate, and with that
      pair recorded in the run manifest BEFORE the arm executes. The estimator
      must return 0.25 within plus or minus 0.03 bits. An estimator that
      returns 0 on a planted 0.25 cannot detect a real leak and voids every
      zero in the run.
    - >-
      NAMED NULL, BLOCKING, CURVE-FREE. The identical protocol in (Z/2N', +)
      with the index-2 subgroup. CONSEQUENCE PRE-STATED, agreement with the
      elliptic arm means the finding is about index-2^t subgroup filtering in
      finite abelian groups and may NOT be reported as a statement about
      elliptic curves, endomorphisms, or the ECDLP. This is the anticipated
      outcome and it makes the negative broader rather than weaker.
    - >-
      UNFILTERED BASELINE. The identical relation search with no coset filter,
      on the identical instances, in the same operation unit, supplying the
      denominator of the cost ratio and the relation truth against which
      recall is checked.
    - >-
      DEDUPLICATION CONTROL. All relation counts in every arm are deduplicated
      as unordered multisets before any ratio is formed, so that no arm can
      gain from re-counting one relation under a different distinguished
      element. This is the multiplicity artifact that H-ECDLP-cd7072 removes
      from the y-oracle record and it is excluded here by construction.
    - >-
      MATCHED BASELINES, MANDATORY UNDER RQ-ECDLP-002 CONSTRAINT 3. Pollard rho
      and BSGS on the identical instances, in the same operation unit, with
      BSGS memory in bits.
  independent_variables:
    - prime p, six values
    - 2-torsion rank t in {1, 2}
    - factor-base size B in {10, 20, 50}
    - filter, coset-filtered versus unfiltered
    - object class, elliptic full group versus curve-free (Z/2N', +)
  metrics:
    primary:
      - >-
        mutual_information_bits, empirical mutual information between the coset
        indicator of a candidate under multiplication by 2 and the event that
        the candidate completes a relation over V, in bits, with the plug-in
        estimator bias reported alongside
      - >-
        coset_filter_cost_ratio, dimensionless, charged cost per distinct
        verified relation for the filtered arm divided by the unfiltered arm,
        in one unit of F_p multiplications with the coset test charged
    secondary:
      - measured 2-torsion rank t per curve, integer
      - coset occupancy counts, the 2-by-2 contingency table per cell
      - measured cost of one coset test in F_p multiplications
      - distinct relations found per arm per cell, deduplicated
      - fraction of candidates discarded by the filter, against the forced 1 - 2^{-t}
      - decomposition fraction per cell against the predicted B^m / (m! N)
      - matched rho and BSGS operation and memory counts
  heuristic_under_test: H1
  preregistered_prediction:
    quantity: >-
      Mutual information, in bits, between the endomorphism-image coset
      indicator and factor-base decomposability, on the full group.
    formula: >-
      I(indicator ; decomposable) = 0 bits. Coset membership under
      multiplication by 2 is a statement about 2-divisibility; decomposability
      over V is a statement about subset sums of V; the record proposes no
      mechanism connecting them and predicts independence. The cost prediction
      is ratio = 2^t times (1 + C_oracle / C_check), at or above 2^t, because
      the filter examines B/2^t candidates instead of B without reducing the
      per-candidate arity-(m-1) completion cost.
    source: >-
      Derived in H-ECDLP-29400c. It is NOT the source proposal's prediction,
      which was Y_phi / Y_exhaust = m/d on a ladder that is inert on the object
      the source itself declares.
  band_non_degeneracy:
    checked_before_freezing: true
    arms_found_degenerate_and_repaired:
      - >-
        SOURCE ARM REJECTED AS DEGENERATE, AND THE FALSIFIER IS UNREACHABLE FOR
        EVERY PARAMETER VALUE. IDEA-20260808-c5f9a2 pre-registers
        Y_phi / Y_exhaust = m/d with cells 3.0 plus or minus 0.5 at d = 1 and
        0.75 plus or minus 0.2 at d = 4, and a decay ladder over
        d in {1, 2, 4, 9}. COMPUTED, the whole ladder is inert on the object
        the proposal declares. Its own test boundary places the target in a
        PRIME-ORDER subgroup G of order N. Any endomorphism phi with
        gcd(deg phi, N) = 1 acts on G as multiplication by a scalar lambda in
        (Z/N)^*, which is a bijection, so phi(G) = G and the oracle answers yes
        for every point. The step the prediction depends on, "the probability
        that R - P_i is in phi(E) is 1/d", is therefore 1 and not 1/d, at every
        d in the ladder. Concretely, the proposal's phi_2 is multiplication by
        2, which is a bijection on any odd-order group, and its phi_1 is a
        degree-1 automorphism whose image is everything. Both arms return the
        same value and it is the same m-fold multiplicity artifact that
        H-ECDLP-cd7072 removes from the y-oracle record.
      - >-
        REPAIR, COMPUTED, IN TWO PARTS. First, the inertness is archived as a
        DERIVATION rather than measured, because its falsifier would be a
        contradiction in elementary group theory. Second, the measurement is
        moved to the only object where the indicator is non-constant, the full
        group E(F_p) of even order where the image of multiplication by 2 has
        index 2^t, and the statistic is replaced by MUTUAL INFORMATION IN BITS,
        which is exactly 0 under independence for every t and cannot be moved
        by the structural acceptance rate the old ratio was picking up.
    surviving_bands_and_their_separations:
      - >-
        MUTUAL INFORMATION. Null 0 bits, band [0, 0.01] bits. The plug-in
        estimator's upward bias on a 2-by-2 table at n = 100000 is
        1/(2 n ln 2) = 7.2e-6 bits, so the band sits more than three orders of
        magnitude above the bias floor and is not a threshold chosen to be easy
        to clear. The planted leak at exactly 0.25 bits is 25 band widths away
        and is exercised on the same estimator. NON-DEGENERATE with
        demonstrated dynamic range.
      - >-
        COST RATIO. Predicted at or above 2^t, so 2.0 at t = 1 with band
        [1.9, 2.3]. The source proposal's advantage requires strictly below
        1.0, at least 0.9 below the band's lower edge and in the opposite
        direction. NON-DEGENERATE, and the two readings cannot both hold.
      - >-
        The fraction of candidates discarded, forced to 1 - 2^{-t}, is a
        forced-value check on the filter implementation and is not counted as
        evidence.
  scale_relevance:
    tier: toy
    justification: >-
      7 to 11 bit prime fields, arity 3, B up to 50. Every number is a
      statement about those cells. It is additionally a statement about the FULL
      group rather than the prime-order subgroup, so it does not transfer even
      within these instances to the object on which the discrete logarithm
      problem is posed. Behaviour at cryptographic p is not measured and is not
      claimed.
    correspondence: null
  tail_checks:
    - >-
      Report the 2-by-2 contingency table in full at every cell, so a mutual
      information near zero cannot hide a degenerate table in which one coset
      is nearly empty.
    - >-
      Report the single cell with the largest mutual information individually,
      with its table, rather than only a pooled value.
    - >-
      Compare the measured decomposition fraction against B^m / (m! N) at the
      largest B, where dependence among subset sums would show first.
  replication:
    seeds: [20260904, 20260905, 20260906]
    independent_instances: 6
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 3
    maximum_memory_gb: 8
    maximum_runs: 6
    maximum_workers: 1
  stopping_rules:
    - >-
      Run the prime-order bit-identity check and the planted-leak control
      FIRST. If the filtered and unfiltered arms differ on the prime-order
      subgroup, or the planted-leak control does not return 0.25 within plus or
      minus 0.03 bits, halt. No zero from the full-group arm is read.
    - >-
      If the mutual-information estimate's interval half-width exceeds 0.01
      bits at any cell, increase the sample count to reach it under the
      observed variance, or report the cell as UNDERPOWERED with that required
      count. The band [0, 0.01] is never widened.
    - >-
      Stop at B = 50 or when the unfiltered arm at the next B would exceed one
      third of the wall-clock budget, and report which.
  invalidation_rules:
    - >-
      Relations are counted as ordered tuples rather than deduplicated
      unordered multisets anywhere in the primary metrics.
    - >-
      The coset test's own cost is omitted from the filtered arm's charge.
    - >-
      The 2-torsion rank t is assumed rather than computed per curve.
    - >-
      j = 0 or j = 1728 curves are pooled with the random panel.
    - >-
      The source proposal's m/d ratio is reported as a measured confirmation of
      anything.
    - >-
      Any measurement on the full group is presented as a statement about the
      prime-order subgroup, or about the ECDLP.
    - >-
      Any timeout, crash, or memory exhaustion is reported as evidence rather
      than as an infrastructure outcome, per AGENTS.md rule 5.
  success_criterion: >-
    All of the following on the same committed run set. The prime-order
    bit-identity check passes; the planted-leak control returns 0.25 within
    plus or minus 0.03 bits; the measured mutual information lies inside
    [0, 0.01] bits at every full-group cell at both tested 2-torsion ranks; the
    coset filter cost ratio lies at or above 2^t at every cell; and the
    curve-free (Z/2N', +) null agrees with the elliptic arm so that the
    negative is stated at abelian-group breadth. That combination is a
    complete, argued closure of the image-oracle-as-partition reading at the
    tested scope, with a derivation covering the prime-order case that no
    experiment needs to visit.
  falsification_criterion: >-
    Any of the following, scoped to the tested primes, 2-torsion ranks,
    factor-base sizes, arity 3 and the budget. Measured mutual information
    exceeding 0.01 bits at any cell while the planted-leak control fires
    correctly, which would mean coset membership does constrain
    decomposability and would require this arm to be re-specified as a positive
    experiment. Or a coset filter cost ratio below 1.0 with the accounting
    verified, which would contradict the candidate-count argument. Or a failure
    of the planted-leak control or the prime-order bit-identity check, in which
    case nothing is admissible.
  required_artifacts:
    - implementation source at a pinned revision, with the coset test and the MI estimator identified
    - per-curve group structure and the exactly computed 2-torsion rank t
    - the full 2-by-2 contingency table per cell, retained
    - the planted-leak control's (q0, q1) pair recorded before the arm executed, with its analytic MI
    - the prime-order bit-identity check output
    - the derivation note that phi(G) = G on a prime-order subgroup, archived as a refutation artifact
    - deduplicated relation sets per arm per cell
    - the curve-free (Z/2N', +) null's full results in the same schema
    - measured coset-test cost in F_p multiplications
    - matched rho and BSGS operation and memory counts on the identical instances
    - manifest per AGENTS.md artifact policy, including seeds, environment and dirty-tree state
  assigned_to: executor
  approved_by: null
