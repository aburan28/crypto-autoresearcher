# EXP-ECDLP-5a293e
# Negation invariance of x and of x+1. The y-coordinate is the control.
# Approved by DEC-20261001-41c4ea.
experiment:
  id: EXP-ECDLP-5a293e
  hypothesis_id: H-ECDLP-78a3d1
  source_idea: IDEA-20260918-7a11c2
  question_id: RQ-ECDLP-002
  version: 1
  title: Negation invariance of two x-line maps over F_17
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-41c4ea
  objective: >-
    List the affine points of y^2 = x^3 + x + 1 over F_17. For each point,
    compare x, x+1, and y with the same functions of its negation.
  inputs:
    p: 17
    A: 1
    B: 1
    maps: [x, x_plus_1, y]
    predicted:
      affine_point_count: 17
      x_mismatches: 0
      x_plus_1_mismatches: 0
      y_mismatches: 16
  controls:
    - y is the non-invariant control. Reporting y_mismatches = 0 invalidates the run.
    - Two listings, x-outer and y-outer. They must not import each other.
  independent_variables:
    - listing order
    - coordinate map
  metrics:
    primary:
      - affine_point_count
      - x_mismatches
      - x_plus_1_mismatches
      - y_mismatches
      - implementations_agree
    secondary:
      - points_with_y_zero
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Mismatch counts for x, x+1, and y.
    formula: >-
      Negation sends (x, y) to (x, -y). x and x+1 are unchanged. y changes
      exactly when 2y is not 0.
    source: >-
      Design-time count on 2026-10-01. IDEA-20260918-7a11c2 was read for the
      PGL2-control requirement. No solver was run. The count is not a run
      of this experiment.
  scale_relevance:
    tier: toy
    justification: One curve over F_17. No transfer to a torsion-quotient cost.
    correspondence: null
  tail_checks:
    - The unique point with y = 0 is included. Dropping it and still reporting 16 y-mismatches is invalid.
  replication:
    seeds: []
    independent_instances: 1
    replication_note: Deterministic. The second run uses the other loop order.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If y_mismatches is 0, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either listing imports the other.
    - y_mismatches is 0.
    - A solver time or a discrete logarithm is reported.
  success_criterion: >-
    Both runs agree, there are 17 affine points, x and x+1 have 0
    mismatches, and y has 16 mismatches.
  falsification_criterion: >-
    The runs agree, y_mismatches is not 0, and either the affine count is
    not 17, or x or x+1 has a mismatch, or y_mismatches is not 16.
  required_artifacts:
    - experiments/EXP-ECDLP-5a293e/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-5a293e/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-5a293e/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-5a293e/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-5a293e/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-5a293e/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Semaev solving and cost-per-relation.
    - Torsion orders other than 2, and any prime other than 17.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
