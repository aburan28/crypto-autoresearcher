experiment:
  id: EXP-SLHDSA-942b3d
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-a681fa; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-a681fa
  question_id: RQ-SLHDSA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exhaustively enumerate the WOTS+ encoding space at small Winternitz parameters and compute
    the full distribution of the dominance up-set size, against a deleted-checksum arm with a closed-form
    cross-check and a random non-monotone checksum arm
  objective: 'The one uncertainty a run reduces is whether the one-time layer''s extension defence,
    which every record in this repository treats as an assurance, is an exact integer statement at
    parameters where it can be checked completely. Concretely: (i) whether the maximum of |U(b)| over
    the entire valid-encoding space equals exactly one at each tested (w, len1, checksum length),
    which is a complete and decidable question requiring no hash and no probability; (ii) how much
    larger the up-set becomes when the checksum is deleted and when it is replaced by a non-monotone
    function of the same length and alphabet, measured as median, maximum and the exact count of vectors
    exceeding one, so that what the checksum removes is reported as three integer distributions rather
    than as a description; (iii) how the answer depends on the checksum length, which matters because
    the length is taken from a structural description this repository marks UNVERIFIED, and because
    a sweep converts a fixed constant into a measured threshold that the rest of the bucket can cite.
    A run reduces (i) to a single integer per parameter set, (ii) to three distributions, and (iii)
    to a curve. The expected outcome is a maximum of exactly one in the real arm and this is a complete
    deliverable.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'At most, a completed run supports: at the tested (w, len1, checksum
      length) triples, the exact distribution of the dominance up-set size over the entire valid-encoding
      space in each of the three arms, the exact count of vectors exceeding one in each arm, the agreement
      of the deleted-checksum arm with its closed-form product count, and the checksum-length dependence
      over the swept range. WHAT DOES NOT FOLLOW: nothing about any FIPS 205 parameter set, whose
      Winternitz parameters lie outside the enumerable region; no security level in bits; no forgery,
      no attack, no weakness; no statement about SHA-2, SHAKE or any hash, since no hash is evaluated
      anywhere in the contract; no statement about what the literature contains; and nothing about
      the fault or memory-corruption claim class. A maximum of exactly one confirms an order-theoretic
      property at tested parameters and does not establish that this property is what carries the
      layer''s security.'
  inputs:
    procedure: 'STAGE 0, freeze (zero compute): register the encoding map, the checksum direction
      convention, the (w, len1, checksum length) grid, and the closed-form product formula for the
      deleted-checksum arm, before any code runs. STAGE 1, encoding (~3h human): implement the encoding
      map as a pure integer function with no hashing; implement the naive quadratic dominance comparison
      and, independently, the pruned coordinate-sum sweep. STAGE 2, cross-verify (~10min compute):
      run both routes on the two smallest parameter sets and require vector-by-vector equality. STAGE
      3, real arm (~1h compute): pruned sweep over the full grid, emitting the complete |U(b)| distribution
      per triple. STAGE 4, null arms (~1h compute): deleted-checksum arm with its closed-form cross-check,
      and random-non-monotone-checksum arm at three fixed instances, both through the identical enumeration
      in the same invocation. STAGE 5, controls (~20min compute): shuffled-encoding invariance check
      and per-arm valid-encoding cardinality report. STAGE 6, sweep and report (~1h compute): checksum
      length varied by plus and minus one at every (w, len1), with all distributions, maxima, exceed-one
      counts and cardinalities tabulated.'
    instrument: 'Python 3.11 with numpy for the vectorized dominance comparisons and the coordinate-sum
      sort, itertools for the encoding enumeration, and math.prod for the closed-form product counts.
      No hashlib and no cryptographic library are used anywhere in the signal path, which is a design
      property rather than an omission: the result must be independent of any hash. The random non-monotone
      checksum arm uses a seeded random.Random purely to instantiate the null. New single-file module
      under harness/ following the convention of harness/toycurve.py, executed through harness/runner.py
      so seeds, parameters and the resolved inference block land in the run manifest. No Sage, no
      network.'
    parameters: 'w in {4, 16, 256}; len1 in {2, ..., 14} for w = 4, {2, ..., 7} for w = 16, {2, 3}
      for w = 256, in every case restricted so that w^len1 is at most 2^24. Checksum length swept
      over the structurally recorded value and that value plus and minus one, at every (w, len1).
      Arms: real checksum, deleted checksum, random non-monotone checksum at three fixed pseudorandom
      instances. Cross-verification of naive versus pruned routes on the two smallest sets in full.
      Shuffled-encoding control: one fixed coordinate permutation per (w, len1). No sampling anywhere:
      every arm is a complete enumeration and every reported number is exact.'
  controls:
  - Deleted-checksum arm, identical enumeration, same invocation, with its independent closed-form
    product count as an arithmetic cross-check.
  - Random non-monotone checksum arm of identical length and alphabet, identical enumeration, same
    invocation, three fixed pseudorandom instances.
  - Naive quadratic dominance comparison versus the pruned sweep, cross-verified vector by vector
    on the smallest two parameter sets.
  - 'A shuffled-encoding control: permute the coordinate labels of every valid encoding by one fixed
    permutation and re-enumerate; the up-set distribution must be invariant, which catches coordinate-indexing
    bugs.'
  - 'Checksum-length sweep: the checksum block length varied by plus and minus one from the structurally
    recorded value, since that value is UNVERIFIED and the count''s dependence on it is itself informative.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two null objects, both run through the identical enumeration in the
    same invocation. First, the checksum block deleted entirely, leaving only the message block: a
    random object of the same shape, in the sense that it is an encoding into the same alphabet with
    the monotonicity constraint removed. Second, the checksum block replaced by a fixed pseudorandom
    function of the message block into the same alphabet and same length, which preserves the encoding''s
    arity and length but destroys the monotone-decreasing relationship. For the signal arm to mean
    anything, both nulls must show strictly larger |U(b)| than the real checksum: specifically the
    deleted-checksum null must reproduce its own closed-form product count exactly, and the random-checksum
    null must show a substantial fraction of vectors with |U(b)| greater than one. If the random-checksum
    null shows the same distribution as the real checksum, the enumeration is measuring the encoding''s
    arity rather than the checksum''s monotonicity and no conclusion about the checksum may be drawn.'
  independent_variables:
  - Winternitz parameter w
  - message-block length len1
  - checksum block length
  - arm (real checksum / deleted / random non-monotone)
  - random-checksum instance index
  metrics:
    primary:
    - maximum of |U(b)| over all valid encodings, per arm and triple
    - exact count of valid encodings with |U(b)| greater than one, per arm and triple
    - full distribution of |U(b)| including median and support, per arm and triple
    - agreement of the deleted-checksum arm with its closed-form product count
    secondary:
    - valid-encoding cardinality per arm and triple
    - spread across the three random-non-monotone instances
    - naive versus pruned route agreement on cross-verified sets
    - shuffled-encoding invariance check result
    - wall-clock and comparison counts per arm
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The maximum of |U(b)| over the entire valid-encoding space in the real-checksum arm,
      at every tested (w, len1, checksum length) with the structurally recorded checksum length.
    formula: Predicted value exactly 1, with no tolerance, since the quantity is an integer computed
      by complete enumeration and carries no statistical error. |U(b)| is defined as the number of
      valid encodings b' satisfying b'_i at least b_i for every message-block coordinate i and b'_j
      at most b_j for every checksum-block coordinate j, counting b itself. The deleted-checksum arm's
      independent closed form, used as the arithmetic cross-check, is |U(b)| = product over i in the
      message block of (w - b_i), which is exact because the deleted arm's valid set is the full box.
    source: Pre-registered in the parent proposal IDEA-20260816-a681fa before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at w in {4, 16, 256} with len1 bounded so the encoding space is at most
      2^24 points, which is the largest region in which every arm is a complete enumeration rather
      than a sample. Deployed Winternitz parameters lie far outside this region and no run under this
      contract touches them. The transfer assumption, stated and not established: that whether the
      checksum forces the up-set to a singleton is a property of the encoding''s monotonicity arithmetic
      and not of the absolute size of (w, len1), so that a maximum of one verified exhaustively at
      small parameters is evidence the same arithmetic holds at larger ones. The deleted-checksum
      arm''s closed form partially discharges that assumption by giving a parameter-independent formula
      the enumeration is checked against, but under AGENTS.md rule 4 no output is phrased as a statement
      about any deployed parameter set.'
    correspondence: null
  tail_checks:
  - Require exact vector-by-vector agreement between the naive quadratic and pruned sweep routes on
    the two smallest parameter sets.
  - Require exact agreement between the deleted-checksum enumeration and its closed-form product count
    at every triple.
  - Require the shuffled-encoding control to leave the |U(b)| distribution unchanged.
  - Verify the checksum direction convention by constructing, by hand, one encoding pair whose dominance
    relation is known from the convention, and asserting the routine agrees.
  - Report valid-encoding cardinality per arm so that cross-arm comparisons are never made between
    sets of different size without saying so.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report an instrument failure if the deleted-checksum arm disagrees with its closed form
    at any point.
  - Halt the pruned sweep for any triple whose encoding space exceeds 2^24 and record it as out of
    scope rather than sampling it.
  - Hard wall-clock stop at 6 CPU-hours; a stop is an infrastructure outcome and is never negative
    mathematical evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Complete |U(b)| distributions over the whole valid-encoding space in all three
    arms at every tested triple, with the deleted-checksum arm matching its closed form exactly, the
    naive and pruned routes agreeing vector by vector on the cross-verified sets, and the real-arm
    maximum reported as a single exact integer per triple.
  falsification_criterion:
  - 'The deleted-checksum arm disagrees with its closed-form product count: instrument invalid, nothing
    readable.'
  - 'Naive and pruned routes disagree on any vector: the pruning is unsound and every larger triple
    is void.'
  - 'The random-non-monotone null matches the real-checksum distribution: the enumeration measures
    cardinality, not monotonicity, and no checksum statement is admissible.'
  - 'The shuffled-encoding control changes the distribution: coordinate indexing bug.'
  - 'The real-arm maximum exceeds one after all instrument controls clear: the property fails at that
    triple and the exact counterexample vector is recorded, scoped strictly to those parameters and
    to the checksum-length value used.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-a681fa
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The checksum length and the base-w digit convention come from a structural description this repository
    marks UNVERIFIED against primary text; the contract hedges by sweeping the length, but a Coordinator
    must decide whether that hedge suffices or whether a primary source must be filed as a KN-LIT
    entry first.
  - The direction convention for checksum-block dominance must be fixed explicitly by the Coordinator
    before freezing, because getting it backwards produces a plausible-looking distribution with the
    opposite meaning and no control in the contract catches a globally consistent sign error.
  - Whether the extension adversary is the right scoping, or whether a bounded-inversion arm should
    be added, is a Coordinator decision that changes the object rather than the parameters.
  - No hypothesis is minted here; the Coordinator must decide whether this attaches to a new hypothesis
    or is filed as a standalone mechanism audit under RQ-SLHDSA-001, given that H-SLHDSA-3a403a excludes
    this layer by its own text.
