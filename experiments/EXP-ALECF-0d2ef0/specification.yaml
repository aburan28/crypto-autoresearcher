experiment:
  id: EXP-ALECF-0d2ef0
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-37d5e8; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-37d5e8
  question_id: RQ-QRE-6dba8c
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Build k-fold compositions of one fixed reversible point-addition circuit under shared and
    disjoint ancilla pools, and measure per-axis residuals against the additive reference with their
    functional form in k fitted.
  objective: 'The one uncertainty a run reduces is whether a per-call circuit score is additive under
    composition, and on which axis it fails. Concretely: (i) can k-fold compositions of one fixed
    point-addition builder be constructed for k from 1 to 8 under both a shared and a disjoint ancilla
    pool, with every member independently verified to compute the correct k-fold sum against harness/toycurve.py
    and to restore every ancilla, so that residuals are measured on circuits known to be correct;
    (ii) what are the per-axis residuals r_a(k) equal to measured cost minus k times single-call cost,
    for Toffoli count, peak live-qubit width, ancilla lifetime integral and depth, and which of the
    linear, constant and saturating functional forms fits each; (iii) does a random reversible circuit
    of the same shape and inventory, composed under the identical interface and pooling rules, produce
    the same residual slopes, which is the null that decides whether any measured interface tax is
    specific to point addition or is a property of the interface alone. A run makes no statement about
    how many calls any algorithm performs, examines no downstream record in this program, and claims
    no attack or speedup. The deliverable is the residual table, the fitted forms with their coefficients
    of determination, the null comparison, and the declared ancilla-pooling policy without which none
    of the width numbers can be read.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for this reversible point-addition
      builder over the tested toy prime field, under the declared composition semantics and ancilla-pooling
      policy, the per-axis residuals of k-fold composition take the measured values for k from 1 to
      8, fitted by the reported functional forms, and differ from a matched random-circuit null by
      the measured amounts. WHAT DOES NOT FOLLOW: nothing about 256-bit circuits, nothing about large
      call counts beyond k equal to 8, nothing about any published or imported score being wrong,
      nothing about the cost of any algorithm, and no attack, speedup, feasibility or security statement.
      A residual measured under one pooling policy is a property of that policy as much as of the
      circuit, and does not transfer to a different policy without re-measurement.'
  inputs:
    procedure: 'STAGE 0 (cost: one hour): fix the composition semantics, the ancilla-pooling policy,
      the granularity convention, the offsets and the seed manifest; implement and pass the k equal
      to 1 residual identity check. STAGE 1 (cost: two hours, reusing the interpreter): implement
      the shared-pool and disjoint-pool composition builders over the existing point-addition builder.
      STAGE 2 (cost: minutes of compute): emit both families for k from 1 to 8 at the chosen prime.
      STAGE 3 (cost: minutes): validity-gate every member, verifying the k-fold sum independently
      against harness/toycurve.py on 1024 random generic starting points and requiring full ancilla
      restoration; record and exclude any member whose offsets produced an exceptional input, reporting
      the exclusion count. STAGE 4 (cost: seconds): record all four resource axes per (family, k)
      and compute the residuals. STAGE 5 (cost: minutes): fit linear, constant and saturating forms
      per axis by least squares and report the winner with its coefficient of determination. STAGE
      6 (cost: minutes, same invocation): repeat STAGES 1 through 5 for the random-circuit null. STAGE
      7 (cost: one hour): report residual tables, fits, null comparison and the pooling policy on
      the face of the record.'
    instrument: Python 3.11 standard library for the composition builders and exact arithmetic; the
      classical basis-state reversible interpreter with its ancilla-restoration checker built for
      this bucket's tooling contract, reused so the validity gate is shared and its detection matrix
      applies; harness/toycurve.py for independent verification of k-fold point sums, which is the
      role that module was written for; numpy and scipy for least-squares fitting and confidence intervals;
      pytest for the composition builders' unit tests including the k equal to 1 identity; harness/runner.py
      for run records. No Sage, no quantum simulator library, no hardware, no network.
    parameters: 'One 13-bit prime field and one curve, with a second curve at the same width as a
      curve-choice control. k from 1 to 8 inclusive (8 values). Two composition families (shared pool,
      disjoint pool). Validity gate: 1024 random generic starting points per (family, k), with k offsets
      drawn per trial and exceptional inputs excluded and counted. Null: 30 independently generated
      random reversible circuits matched on register shape, ancilla inventory and gate count, each
      composed for all 8 values of k. Least-squares fits over the 8 points per axis; bootstrap 2000
      resamples for slope intervals.'
  controls:
  - Disjoint-ancilla-pool composition as the explicit additive reference, built rather than computed
    by multiplication.
  - Random-circuit null composed under the identical interface and pooling rules, in the same invocation.
  - Independent verification of every composed circuit's output against harness/toycurve.py rather
    than against the circuit's own arithmetic.
  - Ancilla-restoration gate on every composed circuit at every k.
  - 'A k equal to 1 identity check: the residual must be exactly zero on every axis at k equal to
    1, by definition, as an instrument check on the residual code.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a random straight-line reversible circuit with the
    same register shape, the same ancilla inventory and the same gate count as the single point addition,
    composed k-fold under the identical interface and ancilla-pooling rules. The identical residual
    measurement and fitting runs on it in the same invocation. For the signal arm to mean anything,
    the null must show a width residual of comparable magnitude, since generic ancilla reuse is generic;
    the informative comparison is therefore the Toffoli residual, where the null must show a SMALLER
    glue cost if the point-addition interface tax is specific to point addition. If the null''s Toffoli
    residual matches, then the glue cost is a property of the interface and register shape alone,
    which is a legitimate and reportable finding but a different one from the claimed result.'
  independent_variables:
  - number of composed calls k
  - composition family (shared versus disjoint ancilla pool)
  - arm (point addition versus random-circuit null)
  - curve choice at fixed width
  metrics:
    primary:
    - Toffoli residual r_T(k) and its fitted slope
    - peak-width residual r_Q(k) and its value at k equal to 8
    - best-fitting functional form per axis with coefficient of determination
    - null-arm residual slopes per axis
    secondary:
    - ancilla lifetime integral residual
    - depth residual
    - exceptional-input exclusion count
    - validity-gate pass rate per (family, k)
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The per-axis composition residuals r_T(k) and r_Q(k), their fitted functional forms
      over k from 1 to 8, and the difference in fitted Toffoli slope between the point-addition arm
      and the random-circuit null.
    formula: 'For axis a, r_a(k) = cost_a(shared-pool composition of k calls) minus k times cost_a(single
      call). Predicted: r_T(k) = s times (k minus 1) with fitted slope s at or above 1 gate per call
      and a linear fit achieving coefficient of determination at or above 0.9; r_Q(8) divided by (8
      times peak_width(1)) at or below minus 0.3, that is the composed peak width is at most 70 percent
      of eight times the single-call peak width; and r_a(1) exactly zero on every axis as an instrument
      identity.'
    source: Pre-registered in the parent proposal IDEA-20260816-37d5e8 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested at a single 13-bit prime field with composition depth k up to 8, chosen
      so that every composed circuit can be independently verified against harness/toycurve.py and
      fully ancilla-checked by classical simulation, which is the property that makes the residuals
      trustworthy and which is unavailable at cryptographic width or large k. The imported ALECF packages
      concern 256-bit secp256k1 and no measurement here approaches that. The transfer assumption,
      stated and not defended, is that the SIGNS of the residuals, positive on Toffoli and negative
      on peak width, are structural and scale-robust, while their magnitudes are not and are explicitly
      not extrapolated.
    correspondence: null
  tail_checks:
  - Inspect the largest k for saturation of the width residual, which is the point at which the ancilla
    pool stops being the binding constraint.
  - Check trials excluded for exceptional inputs to confirm the exclusions are offset-driven rather
    than concentrated at one k.
  - Examine the disjoint-pool family for a width residual that is not exactly zero, which would indicate
    the additive reference is not actually additive and would invalidate the residual definition.
  - Check the null draws for circuits whose ancilla inventory happens to permit no reuse, which would
    bias the null's width residual toward zero.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Terminate at k equal to 8; no extension, since the fit family is declared over that range.
  - Abort and report instrument failure if r_a(1) is nonzero on any axis.
  - Abort if any composed circuit fails independent verification against harness/toycurve.py.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run emits validity-gated shared-pool and disjoint-pool compositions for k
    from 1 to 8, all independently verified, and reports per-axis residuals with fitted functional
    forms and coefficients of determination, alongside the same quantities for the random-circuit
    null computed in the same invocation, with the ancilla-pooling policy stated on the record.
  falsification_criterion:
  - r_a(1) nonzero on any axis.
  - The disjoint-pool family showing a nonzero width residual, invalidating the additive reference.
  - No fitted form reaching coefficient of determination 0.9 on any axis.
  - Both residuals identically zero for all k, closing the question in the additive direction.
  - Independent verification failing for any composed circuit.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-37d5e8
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The ancilla-pooling policy is the single free parameter that determines the width residual and
    must be specified exactly before approval; 'shared pool' is not yet a policy.
  - Register-routing implementation for the in-place composed interface must be fixed, since the Toffoli
    residual slope is a direct function of it and is otherwise unfalsifiable.
  - Whether k up to 8 suffices to separate the fitted forms is asserted rather than shown, and a Coordinator
    may require a larger range or a different fit family.
  - It must be decided whether a composition retaining intermediates, where width sub-additivity should
    vanish, belongs here as a third family or in a successor contract.
