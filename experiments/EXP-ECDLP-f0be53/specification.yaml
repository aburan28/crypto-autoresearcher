experiment:
  id: EXP-ECDLP-f0be53
  hypothesis_id: H-ECDLP-c41c87
  question_id: RQ-UOV-001
  goal_id: null
  version: 1
  status: draft
  claim_tier: toy
  title: >-
    Two-part contract: a VERIFICATION PROTOCOL checking a proposed plain-UOV
    accounting basis row by row against the four goals that declare it a
    prerequisite, and a five-arm excess-Macaulay-deficit measurement replacing
    a profile-ratio test that variable counting forces to k, ell and ell squared

  objective: >-
    PART 1, VERIFICATION. Check that a proposed scheme-independent accounting
    basis for the plain-UOV family fixes every row the four consuming goals
    require, and that no row is left implicit. The artifact checked is the
    basis document; the reference is the enumerated row list plus the
    next_action text of the four goals; the failing result is any absent row or
    any row stated without its alternative named. PART 2, MEASUREMENT. Compute
    the oil-space-recovery Macaulay deficit of five arms at two matched
    settings and decide whether each structural lifting adds any algebraic
    dependency beyond the generic Koszul count. NO ATTACK IS MOUNTED AND NO
    ROUND-3 SECURITY STATEMENT IS AVAILABLE.

  independent_variables:
    - name: arm
      values: [plain_uov, whipped, quotient_ring, matrix_ring, unstructured_random]
    - name: macaulay_degree
      values: [3, 4]
    - name: matched_setting
      values: [setting_A, setting_B]

  inputs:
    accounting_basis_required_rows:
      - counted quantity, field operations against gates, with the alternative named
      - memory charge model AND its exponent, as a declared row
      - whether key-expansion preprocessing is charged
      - whether seed-expansion preprocessing is charged
      - the signature-query budget
      - the unit in which every published comparison figure will be restated
    parameter_correspondence: >-
      declared and frozen before any arm is computed, mapping the four
      differently shaped public keys onto matched settings; the correspondence
      document is itself a reviewable artifact
    monomial_order: pinned before any arm runs
    seeds_per_arm: 20
    field: declared in the accounting basis, not assumed here

  metrics:
    primary:
      - name: accounting_basis_row_completeness
        unit: pass or fail per required row
        definition: >-
          For each of the six required rows, whether the basis document states
          a choice AND names the alternative it rejects. A row stated without
          its alternative is a FAIL, because a convention that does not say what
          it is not chosen over cannot make two figures subtractable.
      - name: excess_macaulay_deficit
        unit: number of dependencies (dimensionless non-negative integer)
        definition: >-
          rows minus rank minus C(m,2), per arm, per degree, per setting, per
          seed. This quantity is INDEPENDENT of the variable count, which is why
          it replaces the profile ratio.
    secondary:
      - name: degree_3_rank_ratio
        unit: dimensionless ratio
        definition: >-
          Structured arm rank divided by plain arm rank at degree 3. Retained
          as a forced-value instrument check on the parameter correspondence,
          NOT as a discriminator.
      - name: published_profile_agreement
        unit: pass or fail
        definition: >-
          Whether the plain arm reproduces the published intersection-attack
          profile at its own parameters.
      - name: seed_dispersion_of_deficit
        unit: number of distinct integers over 20 seeds
        definition: Predicted 1. Any higher value is reported before any deficit
          is interpreted.

  controls:
    - name: C-BASIS-ROW-AUDIT
      kind: verification protocol, blocking
      blocking: true
      description: >-
        The accounting basis is checked row by row against the enumerated list
        and against the four consuming goals' next_action text. THIS SESSION
        VERIFIED THE PREMISE: GOAL-UOV-001's next_action names GOAL-MAYO-001,
        GOAL-QRUOV-001 and GOAL-SNOVA-001 as consumers and states that three
        independently derived conventions would make their Pareto comparisons
        meaningless; and knowledge/techniques contains exactly two entries
        mentioning the family, KN-TECH-011 and KN-TECH-053, neither of which is
        a UOV costing entry. The executor repeats both checks so the audit rests
        on a run artifact.
    - name: C-NULL-UNSTRUCTURED
      kind: primary structureless null
      blocking: true
      description: >-
        An unstructured random multivariate-quadratic map at matched
        parameters. Every structured arm is reported as a deviation from it. IF
        ALL FOUR STRUCTURED ARMS MATCH IT, structure is invisible to this
        profile and NOTHING may be concluded from the instrument.
    - name: C-DEG3-FORCED-RATIO
      kind: forced-value check replacing a degenerate identity test
      blocking: true
      description: >-
        AT DEGREE 3 THE PROFILE RATIO IS FORCED AND IS NOT A TEST. A generic
        quadratic sequence has no linear syzygies, so its degree-3 Macaulay
        rank is exactly the row count m times N; the structured shapes multiply
        N by exactly k, ell and ell squared, so the rank ratio equals those
        factors BY VARIABLE COUNTING ALONE, with no structure involved. The
        source proposal's pre-registered identities are therefore unfalsifiable
        as stated. THEY ARE NOT LOOSENED: the ratio is retained as a
        forced-value check that the parameter correspondence is right, and the
        identity test is MOVED to the excess deficit, which is
        variable-count-free.
    - name: C-PREREGISTRATION-GATE
      kind: procedural control
      blocking: true
      description: >-
        The three exponent-neutrality identities, now stated on the excess
        deficit, and the parameter correspondence are committed and hashed
        before any arm is computed.
    - name: C-PUBLISHED-FORCED-VALUE
      kind: forced-value baseline
      blocking: true
      description: >-
        The plain-UOV arm must reproduce the published intersection-attack
        profile at its own parameters. NOTE: no agent in this program has read
        that publication, so this control's reference must be supplied by an
        agent that opens the source and names itself, and until then the control
        is UNDISCHARGED and every structured ratio is provisional.
    - name: C-PLANTED-DEPENDENCY-LADDER
      kind: positive control with predicted magnitude
      blocking: true
      description: >-
        Plant a defect of known size. Into the unstructured arm, inject j
        explicit dependencies for j in {1, 4, 16}. The measured excess deficit
        must equal j EXACTLY on every seed. An instrument that cannot resolve
        j = 1 cannot resolve a zero-versus-nonzero exponent-neutrality test.
    - name: C-ORDER-AND-DEGREE-FREEZE
      kind: instrument freeze
      blocking: true
      description: >-
        The monomial order and the degree bound are hashed before the first arm
        and asserted identical across arms and settings.

  heuristic_under_test: HEUR-001

  preregistered_prediction:
    quantity: >-
      The excess Macaulay deficit above the generic Koszul count C(m,2), per
      structured arm, at matched parameters.
    formula: >-
      excess = rows - rank - C(m,2), predicted EXACTLY 0 for the whipped,
      quotient-ring and matrix-ring arms and for the unstructured null, at both
      degrees and both settings.
    source: >-
      The exponent-neutrality conjunction asserted independently by three
      sibling proposals, restated here on a variable-count-free quantity. The
      Koszul count C(m,2) is the syzygy count of a regular quadratic sequence in
      degree 4 and is a theorem, not a fit.

  band_non_degeneracy_analysis: >-
    COMPUTED BEFORE THE TEST WAS FIXED.
    (1) THE SOURCE PROPOSAL'S IDENTITY TEST IS FORCED AND HAS BEEN REPLACED,
    NOT LOOSENED. It pre-registers profile ratios equal to k, ell and ell
    squared and treats a deviation as falsification. At Macaulay degree 3 the
    rank of a generic quadratic sequence equals its row count m times N, and
    the whipped, quotient-ring and matrix-ring shapes multiply N by exactly k,
    ell and ell squared. The predicted ratio is therefore an identity of
    variable counting that holds whatever the structure does, so the test cannot
    fail and cannot support the conjunction it is meant to test. The
    replacement quantity, the excess deficit above C(m,2), is independent of N.
    (2) THE REPLACEMENT CAN FIRE IN BOTH DIRECTIONS. The excess deficit is an
    integer with a null value of exactly 0 and no upper bound short of the row
    count, so exponent-neutrality and its failure are both representable, and
    the planted ladder demonstrates resolution at j = 1.
    (3) DEGREE 3 CARRIES NO DEFICIT INFORMATION AT ALL AND IS DEMOTED. With no
    linear syzygies the degree-3 deficit is 0 for every arm by algebra. Degree 4
    is the first degree at which any deficit exists, where the generic value is
    exactly C(m,2). The measurement is therefore taken at degree 4 and degree 3
    is retained only as the forced-ratio correspondence check.
    (4) ONE CONTROL IS UNDISCHARGEABLE IN THIS PROGRAM AS IT STANDS, AND IS
    DECLARED SO RATHER THAN QUIETLY DROPPED. C-PUBLISHED-FORCED-VALUE requires
    the published intersection-attack profile, and no agent in this program has
    read the relevant specification. Until an agent opens it and names itself,
    that control is UNDISCHARGED, every structured result is provisional, and
    the contract says so instead of substituting a recalled number.
    (5) THE PROXY ITSELF IS UNSUPPORTED AND THE DESIGN SAYS SO. HEUR-001 has an
    empty supporting_results list. The unstructured null and the published
    forced value are the only two things bounding how much faith the proxy
    carries, and one of them is currently undischarged.

  scale_relevance:
    tier: toy
    justification: >-
      Two matched toy settings with exact linear algebra. Transfer assumption,
      stated and NOT discharged: that a structural effect present at Round-3
      parameters is visible at toy ones. No Round-3 security statement is
      available from this contract in either direction.
    correspondence: >-
      The cross-shape parameter correspondence mapping four differently shaped
      public keys onto matched settings. It is doing real work, it can be wrong,
      and it is declared, frozen and checked by the forced degree-3 ratio.

  tail_checks:
    - >-
      Report the minimum and maximum excess deficit over 20 seeds per arm as
      integers. A structured arm whose excess is not outside the null's realised
      range is inside the null's own tail and is not a finding.
    - >-
      Report the single worst-agreeing seed for the plain arm against the
      published profile individually rather than averaging.

  replication:
    seeds: [2001, 2003, 2011, 2017, 2027, 2029, 2039, 2053, 2063, 2069, 2081,
            2083, 2087, 2089, 2099, 2111, 2113, 2129, 2131, 2137]
    independent_instances: 20

  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 30
    maximum_workers: 1

  stopping_rules:
    - If C-BASIS-ROW-AUDIT reports a missing row, stop and report the row.
    - >-
      If C-DEG3-FORCED-RATIO does not return exactly k, ell or ell squared, stop;
      the parameter correspondence is wrong.
    - If C-PLANTED-DEPENDENCY-LADDER fails at j = 1, stop.
    - >-
      If a degree-4 cell exceeds the memory contract, stop that cell and record
      resource_exhaustion. Under AGENTS.md rule 5 that is an infrastructure
      outcome and never a null result about a lifting.

  invalidation_rules:
    - Any profile ratio reported as evidence of exponent-neutrality.
    - Any comparison across settings computed under different correspondences.
    - Any structured result reported as final while C-PUBLISHED-FORCED-VALUE
      remains undischarged.
    - Any adoption of the accounting basis by this experiment; adoption is a
      Coordinator decision and this contract cannot perform it.
    - Any citation of a published MAYO, QR-UOV or SNOVA number.

  success_criterion: >-
    The basis document passes the row audit on all six required rows; the
    forced degree-3 ratio check passes; the planted ladder recovers j = 1, 4 and
    16 exactly; and the excess Macaulay deficit is reported as an exact integer
    per arm, per degree, per setting, per seed, against the unstructured null.

  falsification_criterion: >-
    The exponent-neutrality conjunction is falsified if any structured arm has a
    nonzero excess deficit outside the null's realised seed range at either
    setting; the failing arm is named and only that lifting is affected. The
    INSTRUMENT is void if every structured arm matches the unstructured null, if
    the forced degree-3 ratio fails, or if the planted ladder fails at j = 1.
    The VERIFICATION half fails, independently of any measurement, if a required
    accounting row is absent or is stated without its alternative.

  required_artifacts:
    - the proposed accounting basis document
    - the row-by-row audit result, one pass or fail per required row
    - the re-verified GOAL-UOV-001 next_action text and the knowledge/techniques
      search result, as run artifacts rather than coordinator readings
    - the frozen parameter correspondence and its hash
    - per arm, per degree, per setting, per seed: rows, rank, C(m,2), excess
    - the forced degree-3 rank ratios
    - the planted-dependency ladder results at j in {1, 4, 16}
    - the plain arm's comparison against the published profile, or an explicit
      record that the control is UNDISCHARGED and why
    - run manifest per AGENTS.md artifact policy

  limitations:
    - >-
      NOT AN ECDLP EXPERIMENT AND NOT A CURVE EXPERIMENT. Every object is a
      multivariate public map, so the curve-free-null requirement is discharged
      by construction; the structure-free null the design does require, and runs
      blocking, is the unstructured random arm.
    - >-
      AN UNDISCHARGED CONTROL IS DECLARED RATHER THAN SUBSTITUTED. The published
      intersection-attack profile has not been read by any agent in this
      program. Until it is, C-PUBLISHED-FORCED-VALUE is undischarged and every
      structured result is provisional. No recalled number is used in its place.
    - >-
      THE PROXY IS UNSUPPORTED. HEUR-001 has no supporting result. A deficit
      ordering is not a cost ordering, and the contract does not claim it is.
    - >-
      ADOPTION IS NOT PERFORMED HERE. An accounting basis changes nothing until
      a Coordinator decision adopts it, which is exactly what did not happen to
      the analogous ISD-FC-2026 artifact. This contract produces and checks the
      document; it does not adopt it.
    - >-
      UNTESTABLE AT ROUND-3 SCALE, STATED PLAINLY. Exact Macaulay computations
      at Round-3 parameters are out of reach of this hardware, so no statement
      about any candidate's Round-3 security level is available in either
      direction from this contract.
    - >-
      Scope: two matched toy settings, degrees 3 and 4, one frozen monomial
      order, one declared correspondence, five arms. Nothing transfers to other
      settings, other degrees, or published parameters.

  assigned_to: executor
  approved_by: null
