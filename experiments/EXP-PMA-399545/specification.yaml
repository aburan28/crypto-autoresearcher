experiment:
  id: EXP-PMA-399545
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-86a78d; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-86a78d
  question_id: RQ-PMA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Measure the divisor-parity gate's firing rate on tables pulled back from explicitly sampled
    matrices over k(t), on degree-matched uniformly sampled tables, and on the frozen prescribed family,
    with witness reverification and confidence intervals
  objective: 'The one uncertainty a run reduces is what denominator the gate''s obstruction counts
    sit over, and whether the gate ever fires on a table that provably has a matrix. Concretely: (i)
    it measures the gate''s false-obstruction rate directly, on at least 300 tables per field constructed
    by computing the exact principal minors of explicitly sampled matrices over k(t), where realizability
    is guaranteed by construction and every table carries its own witness -- so a single firing is
    an immediately checkable counterexample and no existence decider is ever needed, which matters
    because the frozen contract''s only soundness control depends on records H-PMA-001 states do not
    exist in this repository; (ii) it measures the background firing rate on degree-matched uniformly
    sampled tables of the same shape, establishing whether the gate discriminates at all or fires
    on essentially everything of this degree profile; (iii) it positions the frozen prescribed family''s
    firing rate between those two, with Wilson intervals and with every denominator printed beside
    its numerator, so that a non-vacuity claim acquires a magnitude. The run decides no matrix-existence
    question for the signal arm and reduces no uncertainty about any cryptographic quantity.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for the stated sampling
      ensembles, the stated degree caps, the tested constant fields and the specific gate implementation,
      the measured firing rates with confidence intervals on the pulled-back null, the degree-matched
      uniform null and the frozen prescribed family, plus, for every pulled-back firing, an explicit
      witness matrix and its reverification. What does NOT follow: no proof of soundness (a zero rate
      at n = 300 is a bounded statistical statement, not a theorem), no statement that the ensembles
      are canonical or that other ensembles would give the same rates, no matrix-existence conclusion
      for any signal-arm table, no generic-family claim, nothing about characteristic 2 or sizes other
      than 4, and no attack, speedup or security consequence.'
  inputs:
    procedure: 'STAGE 0 (cost: hours, human): fix the two sampling ensembles, the degree caps, the
      degree-matching target, the interval method, and the exclusion rules; write the shuffled-label
      replay for provenance blinding. STAGE 1 (cost: minutes to an hour): build NULL A over F_q --
      sample matrices, compute exact minor tables, reverify each table from its witness in an independent
      implementation, discard and count any that fail. STAGE 2 (cost: minutes): run the gate on NULL
      A, blinded; if it fires, stop and produce the counterexample package (certificate, witness matrix,
      reverification) as the primary deliverable. STAGE 3 (cost: minutes): build and run NULL B with
      matched degree profiles; check for saturation. STAGE 4 (cost: minutes): run the signal arm on
      the frozen prescribed family. STAGE 5 (cost: minutes): perturbation-stability sweep on a NULL
      A subsample. STAGE 6 (cost: hour to hours): repeat stages 1 to 5 over k = Q with per-arm UNDECIDED
      accounting; abandon the Q arm and report why if coefficient heights exceed the cap on more than
      a stated fraction. STAGE 7 (cost: minutes): rates, intervals, differences, degree-profile comparison
      table, and the run record with every denominator printed.'
    instrument: Python 3 with sympy for exact rational-function arithmetic and factorisation over
      GF(q)(t) and QQ(t); explicit cofactor expansion for the fifteen principal minors, with a second
      independent minor implementation used solely for witness reverification; the same gate implementation
      from the frozen construction invoked identically for all three arms in one process; a shuffled-label
      replay harness for blinding. harness/runner.py for the manifest, seeds and inference block.
      No Sage.
    parameters: 'n = 4. Constant fields F_q for the largest small odd q the parameter box admits,
      and Q. NULL A: at least 300 sampled matrices per field; entry ensemble is rational functions
      with numerator and denominator degrees drawn from {0, 1, 2} and coefficients uniform in the
      field (or from a bounded integer box over Q), tuned so the resulting minor degree profiles fall
      within a stated factor of the signal arm''s. NULL B: at least 300 tables per field, fifteen
      rational functions each, per-subset numerator and denominator degrees matched instance-by-instance
      to the signal arm. Signal arm: the frozen prescribed family with at least 30 parameter assignments,
      each giving three discriminants. Perturbation sweep: 50 NULL A matrices, one entry perturbed
      each. Interval method: Wilson, 95 percent. Saturation thresholds 0.05 and 0.95. Distinguishability
      threshold 0.15. Per-table factorisation cap 120 s over Q.'
  controls:
  - 'Witness reverification: every NULL A table recomputed from its witness matrix in an independent
    minor implementation and required to match exactly.'
  - 'Degree-profile control: NULL B tables checked to carry the intended per-subset numerator and
    denominator degrees, and NULL A minor degree profiles reported alongside the signal arm''s so
    the reader can judge matching.'
  - 'Provenance blinding: the gate receives tables with no provenance label and is invoked identically
    for all three arms in one process.'
  - 'Perturbation-stability control on NULL A: perturb one matrix entry, recompute the table, and
    require the gate still not to fire, across a sample; a firing after perturbation is still a false
    obstruction.'
  - 'Degenerate-branch control: tables where a required q_ij vanishes or a discriminant is zero are
    branched and excluded from rate denominators, with counts reported, per RQ-PMA-001''s constraint.'
  - 'Saturation control: if NULL B fires at rate above 0.95 or below 0.05, that fact is reported as
    the primary finding about the gate''s discrimination and the signal comparison is withheld.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): This entry IS a null-object control, so the requirement is turned inward:
    the nulls themselves must be validated. Every NULL A table is reverified by recomputing the fifteen
    principal minors of its witness matrix independently, in a separate code path, and requiring exact
    equality with the table; a table failing this is not a valid null and is discarded with its count
    reported. Every NULL B table is checked to have the intended per-subset degree profile. For the
    signal arm to mean anything: NULL A must show a firing rate of exactly zero (any firing is a false
    obstruction with an attached counterexample and is the most important possible outcome of this
    contract), and NULL B must show a firing rate strictly between 0 and 1 so that it is an informative
    background rather than a saturated or dead comparator. If NULL B fires at rate 1, the gate fires
    on essentially everything of this shape and the signal arm''s rate carries no information.'
  independent_variables:
  - 'arm: NULL A pulled back from matrices, NULL B degree-matched uniform tables, signal frozen prescribed
    family'
  - constant field in {F_q, Q}
  - sampled entry degree profile for NULL A
  - perturbed versus unperturbed, within NULL A
  metrics:
    primary:
    - firing rate with 95 percent Wilson interval, per arm and per field, with the denominator printed
    - NULL A firing count and, per firing, the certificate plus witness matrix plus reverification
      result
    - NULL A witness reverification failure count (must be 0)
    - signal minus NULL B firing-rate difference with interval
    - NULL B saturation check against the 0.05 and 0.95 thresholds
    secondary:
    - per-arm minor and discriminant degree profile distributions, for judging match quality
    - perturbation-stability firing count on NULL A
    - degenerate and excluded table counts per arm, with reasons
    - UNDECIDED counts per arm and per field from factorisation caps
    - shuffled-label replay result confirming arm-insensitivity of the gate implementation; also per-arm
      wall clock
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The gate's firing rate conditional on table provenance, with the pulled-back null pinned
      at zero.
    formula: 'firing_rate(arm, field) equals (number of tables in that arm and field on which the
      gate returns OBSTRUCTED) divided by (number of decided, non-degenerate tables in that arm and
      field), reported with a 95 percent Wilson interval and with the denominator printed. Pre-committed:
      firing_rate(NULL A) equals 0 exactly; NULL A witness reverification failures equal 0; NULL B
      firing rate strictly inside (0.05, 0.95) for the comparison to be informative; absolute difference
      between signal and NULL B of at least 0.15 required to call them distinguishable.'
    source: Pre-registered in the parent proposal IDEA-20260816-86a78d before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are n = 4, at least 300 tables per null arm per field, at least
      30 prescribed assignments in the signal arm, over F_q and Q, with entry degrees capped at 2
      and a 120 s per-table factorisation cap. The only transfer assumption is that the sampling ensembles
      are informative about the gate''s behaviour, and that assumption is NOT hidden: the ensembles
      are stated in full, their degree profiles are reported alongside the signal arm''s, and every
      rate is presented as a property of its ensemble. No extrapolation to unsampled ensembles, to
      other sizes, to characteristic 2, or to a generic family is offered.'
    correspondence: null
  tail_checks:
  - Every NULL A firing, if any, is escalated to a full counterexample package and inspected by hand;
    a single one changes the deliverable entirely.
  - Tables in any arm whose discriminant degrees fall in the top decile are inspected, since that
    is where factorisation caps bind and where arm comparability breaks.
  - NULL A matrices that are singular, or whose diagonal-conjugation orbit is non-free, are counted
    separately since their minor tables are atypical.
  - Instances where all three anchored discriminants fire together are counted separately from instances
    where one fires, because the three are not independent.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop and produce the counterexample package as the primary deliverable on the first confirmed
    NULL A firing that survives witness reverification.
  - Abort and report the null as invalid if any NULL A table fails witness reverification.
  - Abandon the Q arm, reporting why, if more than a stated fraction of its tables exceed the factorisation
    cap; this is an infrastructure boundary, never negative mathematical evidence.
  - Withhold the signal-versus-NULL-B comparison entirely if NULL B is saturated outside the 0.05
    to 0.95 band, and report the saturation instead.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: At least 300 pulled-back tables per field are constructed and every one passes
    witness reverification, all three arms are run blinded through the identical gate in one invocation,
    and firing rates with Wilson intervals and printed denominators are reported for every arm and
    field together with the degree-profile comparison table.
  falsification_criterion:
  - Any NULL A witness reverification failure.
  - 'Any confirmed NULL A firing: the gate is unsound on the constructed ensemble, with an explicit
    counterexample matrix.'
  - NULL B firing rate outside the 0.05 to 0.95 band, making the background comparison uninformative.
  - 'Signal and NULL B rates within 0.15: the prescribed family is indistinguishable from degree-matched
    background, recorded as a controlled null.'
  - 'NULL A minor degree profiles outside the stated matching factor of the signal arm''s: the arms
    are unmatched and cross-arm differences are confounded.'
  - Shuffled-label replay shows the gate implementation behaving differently by arm.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-86a78d
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must fix the NULL A matrix ensemble concretely -- entry degree distribution and
    coefficient distribution -- because every firing rate is a property of that choice and there is
    no canonical option.
  - The Coordinator must set the degree-matching tolerance between arms, and rule on what to do if
    the tolerance cannot be met over Q.
  - Whether degenerate tables are excluded from denominators or reported as a fourth verdict class
    needs a ruling; the rates differ materially between the two conventions.
  - Valid parameter assignments for the signal arm depend on the unresolved parameter-box question
    raised elsewhere in this bucket.
