    A future apparatus succeeds only if every immutable binding, exact path,
    generator replay, chronological control, coverage, fixture, S3 same-work
    mapping and throughput inequality, X-to-V-to-S losslessness, thirty-third-
    candidate overflow mutation, scalar-orientation mutation, same-path null,
