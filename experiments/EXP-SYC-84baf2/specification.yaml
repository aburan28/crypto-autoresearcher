      - No favorable effect, p-value, coefficient, or collision permits early stopping or regeneration.
      - A positive toy branch requests independent review only.
    invalidation_rules:
      - any immutable path, commit, SHA-256, or strict-parse mismatch
      - any duplicate domain, undefined key, generator reroll, overflow, or unrecorded candidate
      - any predecessor bucket audit population other than 583630848 or redesigned total other than 778174464
      - any control-order deviation
      - any future artifact outside or missing from the exact manifest
      - any use of reciprocal marginal probability as fixed-target cost
      - any zero per-input lower bound reported as finite cost
      - any curve or target selected with treatment-dependent information
      - any null path, width, function, or buffer differing from treatment except the public label lane
      - any selector read edge to verifier-only state
      - any omitted or double-counted physical-cost class or nonzero cost residual
      - any S3 same-work coverage or throughput inequality failure
      - any attempt to implement or execute while authorization flags are false or maximum_runs is zero
    evidence_boundary: >-
      Apparatus invalidity, timeout, resource exhaustion, a failed admission
      probe, or an incomplete contract is not evidence against H-SYC-b854f4 or
      ECDLP. Negative evidence can close only the exact valid toy scope.

