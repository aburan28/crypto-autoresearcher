  curve_and_target_generator:
    public_family_fixed_before_treatment: true
    public_seed_literal: EXP-SYC-84baf2/PUBLIC-FAMILY-SEED/v1
    xof: SHAKE256
    integer_encoding: unsigned_big_endian_length_prefixed
    field_prime_generation:
      domain: EXP-SYC-84baf2/FIELD-PRIME-CANDIDATE/v1
      key_fields: [bits, prime_attempt]
      attempts_per_size: 4096
      candidate_rule: >-
        Take one fresh 64-bit word, mask to bits+1 bits, set bit bits and the
        low bit, and test candidates in prime_attempt order. Accept the first
        prime p with 2^bits<=p<2^(bits+1), using deterministic Miller-Rabin
        bases valid below 2^64 followed by a Pratt or Pocklington certificate.
      exhaustion: apparatus_invalid_no_reseed_no_reroll
    curve_generation:
      domain: EXP-SYC-84baf2/CURVE-COEFFICIENTS/v1
      key_fields: [bits, curve_search_index, coefficient_id, attempt]
      search_indices_per_size: 8192
      coefficient_attempt_cap: 4
      curve_form: 'short Weierstrass y^2=x^3+a*x+b over F_p'
      point_count_algorithm: deterministic_SEA_with_certificate
      acceptance_order: first_32_accepted_by_curve_search_index
      acceptance_rules:
        - discriminant is nonzero
        - '#E(F_p)=h*r with h in {1,2,3,4}'
        - r is prime and bit_length(r)=bits
        - bit_length(r) is at least bit_length(p)-2
        - '#E(F_p) is not p'
        - j is neither 0 nor 1728
        - embedding_degree_of_r_with_respect_to_p_is_greater_than_20
        - no score, treatment statistic, model statistic, or selector output participates in acceptance
      rejection_log_required: true
      fewer_than_32_accepted: apparatus_invalid_no_seed_change
    base_point_generation:
      domain: EXP-SYC-84baf2/BASE-POINT/v1
      key_fields: [bits, curve_id, point_attempt]
      attempts_per_curve: 256
      rule: >-
        Decode the XOF word as x and sign, reject nonpoints, set P=[h]R, and
        accept the first P not equal to O satisfying [r]P=O. Record the decode,
        cofactor multiplication, and subgroup certificate.
      exhaustion: apparatus_invalid_no_reroll
    target_generation:
      domain: EXP-SYC-84baf2/TARGET-SCALAR/v1
      key_fields: [bits, curve_id, target_id=0, attempt]
      verifier_secret_seed_source: verifier_only_OS_CSPRNG_256_bits
      scalar_attempt_cap: 8
      scalar_rule: exact_rejection_uniform_on_1_through_r_minus_1
      target_rule: Q_equals_scalar_times_P
      targets_per_curve: 1
      commitment_rule: >-
        Before any selector process receives public inputs, commit SHA-256 of
        the sealed verifier seed and the ordered public curve-target manifest.
        The selector receives P,Q and certificates but no scalar, secret seed,
        decryption key, secret path, secret file descriptor, or secret-derived
        environment value.
    decoy_generation:
      domain: EXP-SYC-84baf2/VERIFIER-DECOY-SCALAR/v1
      key_fields: [bits, curve_id, target_id=0, attempt]
      seed_source: independent_verifier_only_OS_CSPRNG_256_bits
      scalar_attempt_cap: 8
      rule: exact_rejection_uniform_on_1_through_r_minus_1_and_not_equal_true_scalar
    generator_domain_audit:
