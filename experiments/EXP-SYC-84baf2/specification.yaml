  fixed_target_inference:
    marginal_diagnostic:
      definition: 'p_bar_N=E_(C,Q)[(1/4)*sum_m E_root S(C,Q,m,root)]'
      permitted_use: estimator_and_control_diagnostic_only
      forbidden_use: reciprocal_as_fixed_target_cost
    per_input_probability:
      definition: 'p_i=E_root[Z_i,root], where Z_i,root=(1/4)*sum_(m=0)^3 S(C_i,Q_i,m,root)'
      bounded_observation_range: '[0,1]'
      observations_per_input: 256
      nested_model_rule: >-
        The four model outcomes for one root are one correlated bounded vector,
        never four independent Bernoulli observations. Concentration is across
        the 256 independent fresh-root vectors only.
      simultaneous_confidence:
        family_size: 160
        familywise_one_sided_error: '1/200'
        per_bound_error: '1/32000'
        method: one_sided_Hoeffding_lower_bound_for_bounded_root_vectors
        directed_rounding_bits: 512
        formula: 'L_i=max(0,mean_root(Z_i,root)-sqrt(log(32000)/(2*256)))'
        zero_or_small_success_lower_bound: 0
      simultaneous_implication: 'with confidence at least 199/200, p_i>=L_i for all 160 frozen inputs'
    harmonic_cost:
      convention: '1/0=positive_infinity'
      exact_target_expected_roots: 'R_i=1/p_i under fresh-root HA-4'
      finite_family_mean: 'H_N=(1/32)*sum_(i at size N) 1/p_i'
      simultaneous_upper_bound: 'H_N_upper=(1/32)*sum_(i at size N) 1/L_i'
      complete_manifest_mean: 'H_manifest_upper=(1/160)*sum_(all frozen i) 1/L_i'
      uniform_worst_target_bound: 'R_N_max_upper=max_(i at size N) 1/L_i'
      any_L_i_zero: positive_branch_fails_harmonic_bound_is_infinite
      post_treatment_cluster_removal_allowed: false
      unseen_generator_draw_inference_authorized: false
    finite_ladder_coefficient:
      model: >-
        For fixed eta in {-4,0,4}, fit log(H_N_upper)=a+delta*log(N/16777216)
        +eta*(N^(-1/3)-16777216^(-1/3)); define gamma_fixed=1/3-delta.
        Use the same 8191 whole-curve, size-stratified bootstrap index streams
        as the marginal diagnostic, with no dropped or regenerated draw.
      positive_branch: >-
        Every L_i is positive; every harmonic fit converges; every control and
        cost gate passes; and LCB_99.5(gamma_fixed)>5/18 under eta=-4,0,4.
        This is only a positive toy finite-ladder coefficient and requests
        independent review. It is not an asymptotic exponent.
      negative_branch: >-
        UCB_99.5(gamma_fixed)<=5/18 under every eta narrows only the exact
        finite public family, targets, roots, models, estimator, and costs.
      inconclusive: >-
        Any zero lower bound, eta disagreement, nonconvergence, interval
        overlap, family heterogeneity failure, or apparatus invalidity.
    hard_invalidations:
      - computing fixed-target cost as 1/p_bar_N
      - reporting a finite harmonic cost when any included L_i is zero
      - removing or conditioning away a zero-success or low-success input after treatment
      - treating four model views as four independent outer inputs
      - claiming the finite-ladder coefficient is an asymptotic gamma_s

