  objective: >-
    Freeze one implementation-independent successor that preserves the complete
    signed-y workload and controls, measures the family-marginal Boolean
    probability only as a diagnostic, and permits a fixed-target cost branch
    only through simultaneous per-input lower bounds sufficient to upper-bound
    the finite-family harmonic cost E[1/p(C,Q)]. The contract is prospective:
    it records no implementation, throughput observation, experiment, scalar
    recovery, attack, speedup, asymptotic result, or cryptographic-scale result.

