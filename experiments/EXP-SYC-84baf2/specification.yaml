  lossless_success_interface:
    tracked_tuple: [D, Y, X, V, S]
    definitions:
      D: selected cross-pair denominator_diagnostic_only
      Y: multiplicity_weighted_exact_matches
      X: count_of_distinct_exact_matching_A_values_before_capacity_handling
      V: count_of_all_recorded_distinct_matches_that_pass_independent_scalar_verification
      S: '1[V>0]'
    scalar_orientation: >-
      Serialize scalars canonically in [0,r-1]. A candidate k_hat verifies
      only when [k_hat]P equals Q exactly; negated or alternate orientation is
      not normalized after candidate emission.
    candidate_order: lexicographic_by_serialized_A_then_witness_digest_then_scalar
    capacity_per_model_root: 32
    losslessness_gates:
      - X is computed from the complete exact-match stream before storage truncation
      - every one of the X distinct candidates is delivered exactly once to the verifier
      - X equals V for every valid prime-order exact-witness fixture
      - S equals 1 if and only if V is greater than zero
    overflow_rule: >-
      Detection of a thirty-third distinct exact candidate marks the apparatus
      invalid before any metric, fit, or favorable branch is accepted. No
      truncation, replacement, sampling, silent spill, or first-32 result is
      valid under this version.
    mandatory_mutations:
