      public model rules, and all seeds and domains are fixed before treatment.
      The experiment estimates only the exact generated toy family. No finite
      ladder statement is quantified over all sufficiently large N.
    method_ceiling: >-
      The strongest possible output is a toy finite-ladder coefficient under
      the simultaneous lower-bound and full-cost gates. A sequence agreeing at
      18--30 bits and flattening afterward is observationally indistinguishable,
      so no asymptotic exponent or cryptographic transfer is identifiable.
