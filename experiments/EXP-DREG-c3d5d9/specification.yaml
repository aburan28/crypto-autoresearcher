# EXP-DREG-c3d5d9
# Exhaustive check of the degree-2 killing multiplier at n = 5.
# Approved by DEC-20261001-77eb55.
experiment:
  id: EXP-DREG-c3d5d9
  hypothesis_id: H-DREG-44d4b8
  source_idea: IDEA-20260916-71ab94
  question_id: RQ-DREG-bd6c86
  version: 1
  title: One nonzero closing multiplier at n = 5
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-77eb55
  objective: >-
    In F_2[z]/(z^5 + z^2 + 1), with V = span{1, z}, R_X = z, and B = z + 1,
    find every lambda that kills the bilinear term of Tr(lambda S_3) for all
    u in the field and all x_t in V. Check that the only nonzero one is
    R_X^{-2} and that the survivor matches the affine trace form. Refuse
    R_X = 0.
  inputs:
    modulus: [1, 0, 1, 0, 0, 1]
    modulus_note: coefficients of x^5 + x^2 + 1, low degree first
    V_basis: [1, z]
    R_X: z
    B: z+1
    pair_count: 128
  controls:
    - R_X = 0 is refused. A reported nonzero killing lambda on that input invalidates the run.
    - Two implementations. One enumerates lambda. The other solves lambda^{1/2} = lambda * R_X. They must not import each other.
  independent_variables:
    - route, enumeration versus closed form
    - R_X in {z, 0}
  metrics:
    primary:
      - nonzero_killing_lambda_count
      - lambda_equals_R_inverse_square
      - affine_form_mismatches
      - zero_target_refused
      - implementations_agree
    secondary:
      - field_order
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The killing set and the affine survivor.
    formula: >-
      Nonzero killing lambda are the solutions of lambda^{1/2} = lambda * R_X
      other than 0, hence lambda = R_X^{-2}. Survivor P = Tr(u) + Tr(x_t) +
      Tr(B * R_X^{-2}).
    source: >-
      IDEA-20260916-71ab94 claim (A), read 2026-10-01. The modulus was checked
      irreducible in this design session. The lambda value was not computed.
  scale_relevance:
    tier: toy
    justification: >-
      The field has 32 elements. Nothing transfers to the n >= 12 deficit
      measurement named in the proposal.
    correspondence: null
  tail_checks:
    - All 128 pairs are compared. A sample is not a pass.
  replication:
    seeds: []
    independent_instances: 1
    replication_note: Deterministic. The second run is the closed-form route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If R_X = 0 is not refused, mark the attempt invalid and do not score the main cell.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either implementation imports the other.
    - zero_target_refused is false.
    - The output quotes a deficit measurement at n >= 12 or a discrete logarithm.
  success_criterion: >-
    Both runs agree, nonzero_killing_lambda_count is 1,
    lambda_equals_R_inverse_square is true, affine_form_mismatches is 0,
    and zero_target_refused is true.
  falsification_criterion: >-
    The runs agree, R_X = 0 is refused, and the killing count is not 1, or
    the nonzero lambda is not R_X^{-2}, or any pair mismatches the affine form.
  required_artifacts:
    - experiments/EXP-DREG-c3d5d9/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-DREG-c3d5d9/runs/<RUN-ID>/command.txt
    - experiments/EXP-DREG-c3d5d9/runs/<RUN-ID>/stdout.log
    - experiments/EXP-DREG-c3d5d9/runs/<RUN-ID>/stderr.log
    - experiments/EXP-DREG-c3d5d9/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-DREG-c3d5d9/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - The n >= 12 deficit measurement.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
