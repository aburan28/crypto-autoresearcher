experiment:
  id: EXP-XEDN-affa94
  hypothesis_id: H-XEDN-fe3446
  question_id: RQ-XEDN-002
  goal_id: GOAL-XEDN-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Forced-value audit of the XEDN relation instrument: Shioda height and the
    E_8 rank ceiling against the archived pseudo-Gram, the reachable range of
    the shortest-relation search, and a matched random-root null

  objective: >-
    Decide whether the recorded observation "max_|coeff| = 1 at p in
    {7,13,19,31} with slope 0 vs log p" (EV-XEDN-003) is (a) evidence that
    Mordell-Weil relation coefficients remain bounded on non-isotrivial surfaces
    once mu_3 is unavailable, or (b) the joint consequence of two facts that do
    not mention a, j or mu_3: that every free-x section of an all-I_1 rational
    elliptic surface is a root of E_8, and that the search instrument's reachable
    range is bounded by 3 while its falsification threshold is 4. The audit is
    ordered so that its cheapest stage can end it, and it is designed so that
    either answer is reportable.

  what_this_is_not:
    - Not a claim that EXP-XEDN-004 was mismeasured. Its verified relations were confirmed by group-law identity over F_p(t) and by specialisation at >= 20 smooth fibres, and TASK-20260725-005 independently recomputed one p = 7 surface.
    - Not a proposal to change the status of H-XEDN-003, EV-XEDN-003, DEC-20260725-001, KN-FIND-004, GOAL-XEDN-001, or any sibling record. Only the Coordinator may do that (AGENTS.md rule 1), and a correction is a superseding record, never an edit (rule 4).
    - Not a claim that GOAL-XEDN-001 failed its completion criteria. It met them on a committed decision with archived independent review and a red-team pass.
    - Not an ECDLP attack, relation collection, discrete-logarithm computation, cost model, exponent claim, or crypto-scale statement.
    - Not a widening of the degree window. deg a <= 4 and deg x <= 3 / deg b = 10 are the declared scope of GOAL-XEDN-002 and GOAL-XEDN-003 and are out of scope here.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has happened.

  claim_ceiling:
    tier: toy
    scope: >-
      A run of this contract could support, at most, statements about: (i) the
      arithmetic relationship between the archived span_rank/corank fields and
      the Shioda-Tate ceiling of 8, on the 24 surfaces recorded eligible in
      RUN-XEDN-004-MAIN at p in {7,13,19,31}; (ii) the canonical Shioda height
      spectrum of free-x sections on those same surfaces and on newly
      constructed surfaces in the identical degree window; (iii) the reachable
      value range of the frozen shortest-relation search; (iv) the behaviour of
      the identical search on synthetic E_8 root sets. It could NOT support any
      statement about crypto-scale ECDLP, about candidate B2, about number-field
      xedni, about surfaces outside the frozen degree window, or about primes
      outside {7,13,19,31} without rerunning there. Toy evidence is never
      crypto-scale evidence (AGENTS.md rule 7).

  inputs:
    archived_artifacts:
      - experiments/EXP-XEDN-004/runs/RUN-XEDN-004-MAIN/raw-result.json
      - experiments/EXP-XEDN-004/runs/RUN-XEDN-004-MAIN/manifest.yaml
      - experiments/EXP-XEDN-004/runs/RUN-XEDN-004-CTRL/raw-result.json
      - experiments/EXP-XEDN-004/implementation/run_census.sage
      - experiments/EXP-XEDN-004/implementation/xedn4_lib.py
      - experiments/EXP-XEDN-001/xedni_sections.py
      - coordination/goals/GOAL-XEDN-001/batches/BATCH-001/tasks/TASK-20260725-005/validation_notes.md
      - coordination/goals/GOAL-XEDN-001/batches/BATCH-001/tasks/TASK-20260725-006/objections.md
    artifact_binding: >-
      Every archived file is read at the git commit recorded in
      RUN-XEDN-004-MAIN/manifest.yaml, and its sha256 is recorded before use. If
      the file at that commit differs from the file in the working tree, the
      commit version binds and the discrepancy is reported. Reading a different
      version invalidates every stage-2 and stage-3 finding.
    primes: [7, 13, 19, 31]
    family:
      form: "y^2 = x^3 + a(t) x + b(t) over F_p(t)"
      deg_a_max: 2
      deg_b: 6
      a_nonzero: true
      j_nonconstant_required: true
      note: "identical to EXP-XEDN-004 inputs.family; deliberately not widened"
    section_shape:
      deg_x_max: 2
      deg_y_max: 3
      exclude_y_zero: true
    square_predicate: >-
      The frozen EXP-XEDN-001 predicate, loaded from
      experiments/EXP-XEDN-001/xedni_sections.py, whose sha256 is recorded in the
      EXP-XEDN-004 execution report as
      76f0cfe2f32362ff1110fc7c7b42db40d293099ae7718927c46223a42450b34f. The run
      must recompute that digest and halt if it differs.
    master_seed: 20260805
    domain: "EXP-XEDN-affa94/v1"
    seed_derivation_rule: >-
      All randomness derives from SHA-256 of the ASCII string
      domain || "|" || arm || "|" || decimal(p) || "|" || decimal(n) ||
      "|" || decimal(counter), interpreted big-endian unsigned; a draw of a root
      index takes the digest modulo 240 with rejection above
      floor(2^256 / 240) * 240 to keep the draw uniform. Arms are the literal
      strings "null-root", "graded-fibre", "planted", and "mu3-deletion". A
      third party reproduces every instance bit-for-bit from
      (master_seed, domain, arm, p, n, counter).
    e8_root_construction: >-
      The 240 roots are constructed explicitly and deterministically, not
      sampled: the 112 vectors (+-1, +-1) in two of eight coordinates and 0
      elsewhere, plus the 128 vectors (+-1/2)^8 with an even number of minus
      signs. The construction is verified before use by three forced checks --
      count = 240, every norm = 2, every pairwise inner product in
      {0, +-1, +-2} with +-2 only for equal or opposite vectors. Any failure
      halts the run as a construction failure.
    environment_facts_measured_in_this_container:
      - "python3 -c 'import sage' -> ModuleNotFoundError. SageMath is ABSENT."
      - "numpy 2.4.6 is present. sympy is ABSENT."
      - "experiments/EXP-XEDN-001/xedni_sections.py imports and executes as pure Python."
      - >-
        CONSEQUENCE, and it is binding on the design: the frozen
        run_census.sage CANNOT be executed here. Every recomputation in this
        contract is a REIMPLEMENTATION and must be labelled one. The
        archive-integrity control exists solely to bound that fact, and its
        failure is an infrastructure signal, never a mathematical finding.
      - >-
        These four lines were measured on 2026-08-05 outside the harness. The
        run must re-measure and record them in its own environment.json rather
        than inheriting them from this contract.

  arms_and_controls:
    treatment: >-
      The 24 surfaces recorded eligible in RUN-XEDN-004-MAIN, plus their
      recomputed discriminants, fibre types, canonical Shioda heights, true
      height Gram matrices, relation-lattice ranks and coranks.
    measured_null: >-
      NULL-ROOT. For each archived surface with n slots, draw n roots uniformly
      and independently from the explicitly constructed 240 roots of E_8 and run
      the IDENTICAL shortest-relation search -- same coefficient bound 3, same
      maximum support 3, same support-4 +-1 sweep, same early-return-on-1 rule --
      against the exact Gram of those roots. >= 200 draws per distinct n
      occurring among the archived slot counts. FORCED VALUE derived before the
      run: max_|coeff| = 1 at every n >= 3 occurring in the census. THIS NULL CAN
      FAIL: it is not a theorem that n random roots admit a +-1 relation -- eight
      mutually orthogonal roots (an A_1^8 subsystem) admit none -- and n = 3 is
      the most common archived slot count, where failure is most likely. Its
      value is recorded and hash-committed before the treatment arm's recomputed
      Gram is examined.
    positive_control: >-
      REDUCIBLE-FIBRE ARM. Surfaces in the same degree window whose discriminant
      Delta = 4a^3 + 27b^2 is NOT squarefree, hence carrying at least one
      reducible fibre and nonzero local contributions contr_v. The effect that
      MUST appear: the canonical height spectrum splits away from the constant 2
      (an I_2 fibre contributes 1/2 to a section meeting the non-identity
      component, giving h = 3/2), and the Shioda-Tate rank ceiling drops below 8.
      DECLARED THRESHOLD, fixed before the run: at least two distinct height
      values must be observed on at least 3 of the 4 non-squarefree surfaces, and
      the computed rank ceiling must be <= 7 on each. IF THIS CONTROL FAILS, the
      height instrument cannot see fibre contributions, it is broken, and NO
      negative result about the census may be reported from any arm of this
      contract. At least four such surfaces already exist among the archived
      eligible set, so the control costs nothing to populate.
    graded_control: >-
      FIBRE-DEGENERATION LADDER, 4 points, monotonicity reported. Construct
      surfaces in the same degree window with k = 0, 1, 2, 3 forced repeated
      roots of Delta. Pre-registered prediction: the Shioda-Tate rank ceiling
      8 - sum_v (m_v - 1) decreases monotonically as 8, 7, 6, 5 and the height
      spectrum widens monotonically. A ceiling that FAILS TO DECAY as reducible
      fibres are added is the canonical artifact tell of
      docs/inventor-protocol.md section 3 and localises the fault to the
      fibre-type determination instead of leaving "it did not work". Report the
      whole curve, not a pass/fail.
    instrument_range_control: >-
      PLANTED-NORM BATTERY, 5 points, monotonicity reported. On a synthetic
      finite cyclic group (not an elliptic surface -- see the comparability
      policy), plant relations of infinity norm k = 1, 2, 3, 4, 5 at supports 2,
      3 and 4 and report the recovery rate of the transcribed search as a
      function of k. Pre-registered prediction: 1.0, 1.0, 1.0, 0.0, 0.0 -- a step
      function with its edge strictly between 3 and 4, which is the edge that
      makes the falsification criterion of EXP-XEDN-004 (inf-norm >= 4)
      unreachable. Recovery rates at k = 1, 2, 3 are simultaneously the POSITIVE
      CONTROL for the transcription: declared threshold >= 19/20 at each of
      k = 2 and k = 3, and if it is not met the transcription is broken and
      nothing from stage 2 may be reported.
    stubbed_control_arm: >-
      VACUITY TEST. Re-evaluate the frozen planted_control() pass predicate with
      the relation search stubbed to return None unconditionally. FORCED VALUE:
      the verdict is unchanged at pass = true, because the predicate's
      disjunct n_slots >= 2 is already implied by an enclosing conjunct. If the
      verdict changes, the frozen control does test the instrument and the
      vacuity reading of IDEA-20260805-b6af55 is falsified.
    mu3_deletion_arm: >-
      Re-run the transcribed search on the isotrivial a = 0 EXP-XEDN-003 section
      lists with every mu_3 orbit triple deleted first. Pre-registered
      prediction: max_|coeff| still 1. A rise above 1 falsifies the claimed
      equivalence between mu_3 orbit sums and generic root triangles.
    ordering_control: >-
      The NULL-ROOT arm, the planted-norm battery and the reducible-fibre
      positive control are computed, written to disk and hash-committed BEFORE
      the treatment arm's recomputed heights, Gram matrices and ranks are
      examined. The commitment digest is recorded in the manifest. Absence of
      that commitment is invalid_measurement and the comparison may not be made.
    archive_integrity_control: >-
      The reimplementation must reproduce, on the p = 7 surface independently
      recomputed by TASK-20260725-005, the identical slot set, the identical
      verified shortest relation vector, and the identical specialisation count
      recorded there (n_slots = 3, max_|coeff| = 1, specialisation 20/20, mu_3
      absent). A frozen-fixture match, not a resemblance. A mismatch means the
      reimplementation differs from the Sage original; it is reported as an
      INFRASTRUCTURE SIGNAL under AGENTS.md rule 5 and blocks every conclusion
      about the original, in either direction.
    comparability_policy: >-
      Three substitutions are made and each is declared, with the scope it costs.
      (1) The planted-norm battery runs on a synthetic cyclic group rather than
      on E(F_p(t)) points, because the property under test is a property of the
      coefficient loop and is independent of the group; any conclusion from it is
      scoped to "the search procedure" and never to "the surfaces". (2) The
      recomputation is a pure-Python reimplementation, not the frozen Sage code,
      because SageMath is absent here; conclusions are scoped accordingly and
      gated by the archive-integrity control. (3) The E_8 null uses the abstract
      root system rather than sections of a specific surface; it therefore tests
      sufficiency of the root-geometry explanation and not necessity. No
      cross-comparison with EXP-XEDN-005, -006 or -007 is made by this contract;
      those inherit the same search function but have their own call sites and
      their own populations, and a joint statement would require a separately
      registered comparator contract naming both.

  independent_variables:
    - p in {7, 13, 19, 31}
    - surface, within the frozen degree window
    - squarefreeness of Delta (all-I_1 versus reducible-fibre arm)
    - k, the number of forced repeated roots of Delta, in {0, 1, 2, 3}
    - n, the number of sections or synthetic roots
    - planted relation infinity norm k in {1, 2, 3, 4, 5}

  metrics:
    primary:
      - max_span_rank_over_delta_squarefree_archived_surfaces, against the ceiling 8
      - canonical_height_spectrum_per_surface, against the forced constant 2
      - relation_lattice_corank_per_surface, against the forced lower bound n - 8
      - null_root_max_abs_coeff_by_n, over >= 200 draws per n, against the forced value 1
      - planted_recovery_rate_by_planted_norm, k = 1..5, against the forced step at 3/4
    secondary:
      - deg Delta and squarefreeness per archived surface, recomputed
      - Kodaira fibre type multiset per surface, from valuations of a, b and Delta
      - pairwise height-pairing histogram of surface sections versus uniform roots
      - root_triangle_incidence: fraction of surfaces with a section pair at pairing -1
      - stubbed planted_control verdict, live versus stubbed
      - mu3_deletion max_abs_coeff on the isotrivial family
      - reachable value set of the transcribed search, static reading and dynamic instrumentation reported separately
      - censored-surface count and fraction per p in the archive
      - sha256 and git commit of every archived file read

  preregistered_prediction:
    quantity: >-
      The canonical Shioda height h(P) of every free-x section on an archived
      eligible surface whose recomputed Delta is squarefree of degree 12.
    formula: >-
      h(P) = 2*chi + 2*(P . O) - sum_v contr_v(P) with chi = 1, (P . O) = 0 for a
      polynomial section with deg x <= 2, and contr_v = 0 for every irreducible
      (I_1) fibre; hence h(P) = 2 exactly, with zero spread, for every such
      section regardless of whether deg x is 0, 1 or 2.
    source: >-
      T. Shioda, "On the Mordell-Weil lattices", Comment. Math. Univ. St. Pauli
      39 (1990), together with the Kodaira fibre-type table. NOT READ -- RECALLED,
      UNVERIFIED. Stage 1 of this contract is the source check, and the run may
      NOT proceed past it on memory. If no source can be obtained, that fact is
      recorded and the prediction is reported as underived, not as satisfied.

  scale_relevance:
    tier: toy
    justification: >-
      Two of the three claims under test are scale-free in a stated sense and one
      is not, and the difference is declared. The Shioda-Tate ceiling and the
      constant height 2 are algebraic identities that do not depend on p, so
      confirming them at p in {7,13,19,31} is a CHECK OF A DERIVATION rather than
      an extrapolation. The reachable-range claim is a property of a fixed
      integer loop and is likewise p-independent. The null-root comparison is
      NOT scale-free: whether n random roots admit a +-1 relation depends on n,
      and n is bounded above in practice by how many sections a toy surface
      happens to carry, so that arm's conclusion is scoped to the observed slot
      counts and to nothing else.
    correspondence: >-
      null. No sampling correspondence is used; instances are constructed
      directly.

  tail_checks:
    - >-
      The archived surface with the LARGEST slot count (n = 19 at p = 13) is the
      extreme point of the rank comparison and must be reported individually with
      its full recomputed height Gram, not folded into an aggregate.
    - >-
      The smallest slot counts (n = 2, 3) are where the null-root arm is most
      likely to fail; their recovery rates are reported per n and never averaged
      across n.
    - >-
      The thinnest cell (p = 31, 2 eligible surfaces, flagged by RT-XEDN-004
      item 3) is reported with its count beside every statistic derived from it,
      and no trend statement is made from it alone.

  replication:
    seeds: [20260805, 20260806]
    independent_instances: 2

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 2
    maximum_memory_gb: 2
    maximum_runs: 4
    no_network: false
    network_note: >-
      Network is permitted for stage 1 only, to obtain a source for the recalled
      theorems. If it cannot be obtained, that is recorded and the run continues
      with every downstream claim explicitly marked as resting on an unverified
      recollection.

  stages:
    - id: STAGE-0
      name: archive comparison
      cost: "zero compute, minutes"
      can_terminate_run: true
      description: >-
        Read span_rank, corank and n_slots for every eligible surface in
        RUN-XEDN-004-MAIN and compare against the ceiling 8 and the bound
        corank >= n - 8. THIS IS THE CHEAPEST DECISIVE GATE AND IT RUNS FIRST. If
        every span_rank on a Delta-squarefree surface is already <= 8, the
        hypothesis's central reading of the archive is wrong and the run stops
        here with that as its result.
    - id: STAGE-1
      name: source check
      cost: "reading, hours, zero compute"
      can_terminate_run: true
      description: >-
        Obtain and quote the Shioda-Tate rank formula, the height pairing with
        contribution terms, and contr_v = 0 for an irreducible fibre. Record
        verbatim quotations with page references, or record that no source could
        be obtained. THE RUN MAY NOT PROCEED PAST THIS STAGE ON MEMORY: if no
        source is obtained, every later stage is executed and reported but every
        conclusion is stamped as resting on an unverified recollection.
    - id: STAGE-2
      name: instrument range and vacuity
      cost: "pure Python, minutes"
      can_terminate_run: true
      description: >-
        Confirm the source file at the run's recorded commit; determine the
        reachable value set of shortest_relation_group_law statically and
        dynamically; run the planted-norm battery at k = 1..5; run the stubbed
        planted_control test; count censored surfaces in the archive. This stage
        implements IDEA-20260805-b6af55 in full. If the instrument returns a
        value >= 4 on any input, the range reading is falsified and the run
        reports that.
    - id: STAGE-3
      name: discriminant and fibre types
      cost: "pure Python, minutes"
      can_terminate_run: false
      description: >-
        Recompute Delta = 4a^3 + 27b^2 over F_p[t] for every archived surface,
        its degree, its squarefreeness by gcd(Delta, Delta'), and the Kodaira
        type at each root from the valuations of a, b and Delta. Partition the
        archive into the all-I_1 treatment arm and the reducible-fibre positive
        control.
    - id: STAGE-4
      name: heights, true Gram, ranks, and the nulls
      cost: "pure Python, hours"
      can_terminate_run: false
      description: >-
        Implement the group law over F_p(t) with rational-function arithmetic;
        compute the canonical Shioda height and the true height Gram; compute the
        relation-lattice rank and corank; run the NULL-ROOT arm, the graded
        fibre-degeneration ladder, and the mu_3-deletion arm. All arms committed
        in the order declared above.

  stopping_rules:
    - Do not execute unless separately approved, frozen, and execution-authorized by the Coordinator. This contract carries no approved_by field.
    - Stop at STAGE-0 if every archived span_rank on a Delta-squarefree surface is <= 8.
    - Stop at STAGE-2 if the transcribed search returns a value >= 4 on any input.
    - Stop before STAGE-4's treatment comparison if the null arm's hash commitment is absent.
    - Hard wall-clock stop at budget; partial results remain valid for the stages that completed, and the incomplete stages are reported as not run rather than as null results.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - The frozen predicate's recomputed sha256 differs from 76f0cfe2f32362ff1110fc7c7b42db40d293099ae7718927c46223a42450b34f.
    - An archived file read at a commit other than the one recorded in RUN-XEDN-004-MAIN/manifest.yaml.
    - The E_8 root construction fails any of its three forced checks (count 240, all norms 2, inner products in {0,+-1,+-2}).
    - The archive-integrity control fails to reproduce the TASK-20260725-005 fixture. Infrastructure signal; blocks all conclusions about the original.
    - The reducible-fibre positive control fails. No negative result may be reported from any arm.
    - The planted-norm battery scores below 19/20 at k = 2 or k = 3. The transcription is broken.
    - The treatment arm examined before the null arm's commitment digest is written.

  infrastructure_failure_disposition: >-
    A timeout, crash, missing dependency, unavailable source, or failure to
    reproduce the frozen fixture is reported as INFRASTRUCTURE SIGNAL and is
    NEVER negative mathematical evidence, against H-XEDN-fe3446, against
    H-XEDN-003, or against any proposition about elliptic surfaces (AGENTS.md
    rules 3 and 5). SageMath's absence from this container is already known and
    is the reason the design is a reimplementation; discovering it again at run
    time is not a result. If the reimplementation cannot be completed within
    budget, the correct disposition is failed_infrastructure with the stages that
    did complete reported at their own scope.

  success_criterion: >-
    A run succeeds -- as an audit, which is the only thing it can succeed at --
    when all of the following hold: STAGE-0 and STAGE-3 produce a determinate
    partition of the archived surfaces into all-I_1 and reducible-fibre classes
    with recomputed discriminants; STAGE-1 records either verbatim source
    quotations or an explicit statement that none could be obtained; STAGE-2
    reports the reachable value set with static and dynamic determinations
    agreeing, and the planted battery passes at k = 2 and k = 3; the
    reducible-fibre positive control passes its declared threshold; the null arm
    is committed before the treatment arm is read; and the archive-integrity
    fixture reproduces. Under those conditions the audit reports, at toy scope
    only, whether the archived span_rank values respect the Shioda-Tate ceiling,
    whether the canonical height is constant 2 on all-I_1 surfaces, and whether a
    matched random-root null reproduces max_|coeff| = 1 at the observed slot
    counts. It establishes no ECDLP claim of any kind.

  falsification_criterion: >-
    H-XEDN-fe3446 is falsified by any of: a source check showing Shioda-Tate,
    the height formula, or contr_v(I_1) = 0 is not as recalled; every archived
    span_rank on a Delta-squarefree surface turning out to be <= 8; a recomputed
    canonical height other than 2 on an all-I_1 surface; the NULL-ROOT arm
    returning max_|coeff| > 1 at a slot count occurring in the census; or the
    mu_3-deletion arm raising max_|coeff| above 1 on the isotrivial family. Each
    of these is a real possibility and each is reportable as the run's result.

  required_artifacts:
    - experiments/EXP-XEDN-affa94/runs/*/manifest.yaml
    - experiments/EXP-XEDN-affa94/runs/*/results.json
    - experiments/EXP-XEDN-affa94/runs/*/environment.json
    - experiments/EXP-XEDN-affa94/runs/*/command.txt
    - experiments/EXP-XEDN-affa94/runs/*/stdout.log
    - experiments/EXP-XEDN-affa94/runs/*/stderr.log
    - experiments/EXP-XEDN-affa94/runs/*/null_commitment.json
    - experiments/EXP-XEDN-affa94/runs/*/source_check.md
    - experiments/EXP-XEDN-affa94/execution_report.md

  approval_requirements:
    - Independent review confirms that STAGE-0's comparison is stated correctly and that the ceiling 8 is the right bound for this family.
    - Independent review confirms the reducible-fibre positive control is capable of failing and its threshold was fixed before the run.
    - Red team confirms the null-root arm is a matched null and not a decoration, and that its forced value was derived pre-run.
    - Coordinator separately approves, freezes and authorizes execution.
  approval_status: >-
    Pending Coordinator review. No approved_by field is present because this
    contract is not approved and must not be executed in its current state.
  assigned_to: executor
