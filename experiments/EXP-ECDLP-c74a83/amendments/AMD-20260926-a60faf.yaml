protocol_amendment:
  amendment_id: AMD-20260926-a60faf
  experiment_id: EXP-ECDLP-c74a83
  hypothesis_id: H-ECDLP-0cb03b
  source_idea_ids: [IDEA-20260909-4c5ee9]
  version_from: 1
  version_to: 2
  authored_by: coordinator
  authored_at: '2026-09-26'
  approved_by: coordinator
  approval_decision: DEC-20260926-cd5d50
  batch_id: BATCH-739b32
  id_provenance: >-
    Tokens drawn with secrets.token_hex(3), checked absent from origin/main
    ledger/ and experiments/; confirm with tools/allocate_id.py --check.

  pre_data_status: No implementation, trial plan, run or output exists.

  precedence: >-
    Protocol version 2 = specification.yaml (v1, DEC-20260910-67c076) plus this
    file; this file governs where they differ.

  reason: >-
    Version 1 bundled two different objects: PO96M (an exact DLP-free
    residual label space of size O(p^{1/2-epsilon}) or forced signed packet
    dependencies with o(p^{1/2}) packets, on generic prime-order curves) and
    PO96AB* (nonlinear projectors on a specific genus-2 cover over F_787).
    The source itself gates PO96AB: inputs/autolab_research_ledger.md line 30
    requires computing L_sat, recovering J(Y) and exposing a DLP-free
    companion-kernel operation "before any relation or target experiment is
    admitted". Neither label space nor projector has a written definition
    anywhere in the repository; running a relation experiment without one
    would test an object invented by the executor.

  source_bindings:
    - path: inputs/autolab_research_ledger.md
      section: 'line 30 (PO96 open question); TRANSFER-H008; TRANSFER-NR-054'
      provenance: internal
    - id: PO96M gate text
      provenance: recalled
      location: User-pasted external ledger, 2026-09-09 session (IDEA-20260909-4c5ee9).
      quoted_gate: >-
        construct an exact DLP-free residual label space of size
        O(p^(1/2-epsilon)), or force signed packet dependencies with
        o(p^(1/2)) packets, while retaining native rank B-1, sub-rho
        source/memory, and blind descent on at least three prospectively
        frozen sizes; then pass prospective rank, memory, blind-descent and
        all-in rho/BSGS/VW gates.

  changes:
    - id: C-1
      field: staging
      new:
        stage_0_definition_gate: >-
          Zero-run theory deliverable at
          experiments/EXP-ECDLP-c74a83/implementation/stage0_label_space.md:
          (a) an explicit label map from points to labels, computable without
          any discrete logarithm; (b) a proof or proof sketch of the label
          universe size O(p^{1/2-epsilon}) with epsilon stated; (c) a check
          that the representation+operation pair is not a group homomorphism
          (KN-FIND-ffe1df object frame), with the explicit counterexample
          pair; (d) the relation predicate and its charged cost; (e) the
          proof_search_map four audits. Independent red-team review of this
          file is required before stage 1 is admitted.
        stage_1_relation_runs: >-
          Only for a stage-0-accepted PO96M-type label space, on the nine
          generic fixtures below. PO96AB* (F_787 cover projectors) is OUT OF
          SCOPE of version 2 until the line-30 prerequisites are met and bound
          by a v3 amendment.
    - id: C-2
      field: inputs.curve_rule
      new: >-
        Nine frozen fixtures, bits {16, 18, 20} x seeds {51, 52, 53}: the
        "EXP-ECDLP-c74a83" entries of
        experiments/EXP-SDEG-85eefd/amendments/ic_leads_fixtures_v2.json
        (sha256 543f49ca5304f4e61085305ca2ea01ccc0085298db26368d7362f96b1b6a5a45).
        Regenerate and byte-compare before stage 1.
    - id: C-3
      field: metrics.primary / verdict
      new: >-
        native_rank := rank over Z/q of the relation matrix on the B factor
        labels; surplus := native_rank minus the maximum rank among the five
        controls (C-4), 95% CI over the three seeds per size. cost exponent
        := slope of log(charged work, units of AMD-20260926-ced670 C-3) vs
        log q over the three sizes. Pass iff native_rank = B - 1 at every
        size, surplus CI excludes 0, exponent upper CI < 0.9 (not q-linear),
        and blind descent recovers all 32 targets per fixture. A sub-rho
        claim additionally needs exponent upper CI < 0.5 and all-in
        rho/BSGS/van Oorschot-Wiener comparisons. Otherwise scoped collapse
        naming which control matches the rank.
    - id: C-4
      field: controls (made concrete)
      new:
        rank_controls: >-
          determinant, sign, direct-root, random-Jacobian and split-product
          labelings of identical universe size (spec objective), each with 16
          replicates.
        known_false: >-
          A homomorphic bucket index (labels = k mod B via a planted DLP
          oracle) must be flagged by the stage-0 homomorphism check and
          rejected (spec falsification clause).
        baseline: Pollard rho with negation map, 64 targets per fixture.
        accounting_audit: Independent checker recomputes charged work from operation logs.
    - id: C-5
      field: budget / execution_admission
      new: >-
        maximum_memory_gb 8, maximum_workers 1, maximum_runs 1 unchanged
        (stage 0 is zero-run). currently_admitted stays false; stage 1 also
        requires the stage-0 review and the machine-protection precondition
        (15-minute load <= 14, system volume >= 5 GiB free, repository
        volume >= 20 GiB free).

  impediments:
    - id: IMP-DEF
      raised: '2026-09-26'
      condition: object undefined
      what_is_blocked: Stage 1 relation runs.
      clears_when: stage0_label_space.md exists and has passed independent red-team review.
      recheck: ls experiments/EXP-ECDLP-c74a83/implementation/stage0_label_space.md
      asserts_nothing_about: whether such a label space exists

  affected_runs: []
  confirmatory_status: Confirmatory; frozen before any data.
  claim_ceiling_unchanged: Toy fixtures; no cryptographic-size transfer.
