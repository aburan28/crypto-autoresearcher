experiment:
  id: EXP-INSTR-85b102
  hypothesis_id: H-INSTR-fffbfb
  question_id: RQ-INSTR-f8faa0
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aa267f
  source_proposal_id: IDEA-20260807-34754f
  version: 1
  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  lifecycle_transition_note: 'frozen, execution_authorized and evidence_eligible were all false while
    this contract stood at review_required; they are set true by the same Coordinator approval that
    set status: approved (see approval_note and approved_by_note). Executing this contract is licensed
    from that commit forward and not before.'
  retrospective: false
  title: 'Blocked-permutation replacement for NULL-C: a class-partition-coarsening blocking ladder
    on the group order N and the quadratic-twist pairing, with a closed-form null mean, a forced-value
    calibration on the liftable-count identity, a trace-independent null object, a planted-effect
    power curve, and a per-rung nuisance budget -- at two primes and four declared pools.'
  objective: If separately approved, authorized and executed, decide whether the campaign's free label-permutation
    null (NULL-C, harness/exp_icinv.py::permutation_null) can be replaced by a blocked permutation
    that (i) removes the group-order contamination it currently reports as structure, (ii) keeps calibrated
    size on a trace-independent null object, and (iii) retains enough power to detect a planted between-class
    effect -- and, if it cannot do all three at the campaign's pools, to say so plainly and quantify
    the trade. The deliverable is an INSTRUMENT characterisation with per-rung operating characteristics,
    not a statement about isogeny structure and not a statement about ECDLP cost.
  what_this_is_not:
  - Not an ECDLP attack, a discrete-logarithm computation, a relation collection, or a solver run.
  - Not a cost, asymptotic, exponent, speedup, cryptographic-scale, or deployed-scheme claim. sota_delta
    is zero.
  - Not an adjudication of RQ-ICINV-475b5e's isogeny-class invariance question in either direction.
  - Not an investigation of the density-independent within-class over-dispersion (DEC-20260807-41c173
    next action N8), which is a WITHIN-class anomaly and a different object.
  - Not evidence for or against H-STR-002, H-ENDO-001, or KN-FIND-b7e091; GOAL-ENDO-001 pause condition
    P2 is not engaged.
  - Not a re-validation of the committed EXP-ICINV runs' substantive conclusions; only their sampler-free
    permutation rows are used, and only as reproduction fixtures.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence of any
    kind.
  claim_ceiling: 'Tier TOY, and no downstream citation may raise it. The exact scope a completed run
    could support is: for completely enumerated F_p-isogeny classes at p in {4001, 6007}, over the
    declared functional list and the declared blocking ladder, the blocked label permutation has such-and-such
    realized size, power, nuisance budget and minimum detectable effect, and the declared functionals''
    variance ratios behave in such-and-such a way relative to a matched pure-N surrogate. NOTHING
    about attack cost, exponents, cryptographic parameters, or the substantive isogeny-class question
    may be concluded, and no run of this contract can support or reject an ECDLP claim.'
  divergence_from_parent_proposal: 'THIS CONTRACT CONTRADICTS IDEA-20260807-34754f ON ONE SUBSTANTIVE
    POINT AND THE CONTRADICTION IS ARITHMETIC, DERIVED BEFORE ANY RUN. The proposal''s recommended
    design is "the twist-block-stratified label permutation" and its prediction 1 expects the stratified
    p-value on full-field liftable density to rise above 0.05 (honest prior 0.75). Evaluated at the
    proposal''s own frozen slice from committed numbers alone, twist blocking moves the observed/null
    variance ratio from 1/664.8 to 1/617.0 -- about 7% -- and the p-value stays at the resolution
    floor. The reason is that the quadratic-twist pair {t,-t} has the LARGEST N gap of any pair in
    the pool (2|t|), not the smallest, so twist blocking removes the between-pair N contrast and keeps
    the within-pair one. Twist blocking is retained in this contract, because its real justification
    is EXCHANGEABILITY of twist-invariant functionals and that justification stands, but it is retained
    as a SEPARATE, ORTHOGONAL blocking and never as a rung of the N ladder. A second, related divergence:
    the two blockings cannot be composed at fixed p without degenerating to the identity permutation,
    which is also pre-registered here. Both derivations are in H-INSTR-fffbfb mechanism STEP 6 with
    their inputs, so a reviewer can recheck them without running anything.'
  inputs:
    implementation:
      existing_modules:
      - harness/isogeny_class.py
      - harness/exp_icinv.py
      - harness/toycurve.py
      - harness/run_icinv.py
      - harness/runner.py
      new_module: harness/run_blocknull.py
      immutability_constraint: NO EXISTING FUNCTION'S BEHAVIOUR MAY CHANGE. `_targets`, `targets_uniform`,
        `permutation_null`, `binomial_null_verdict`, `exact_null_verdict`, `decomposition_rate_m2`,
        `decomposition_rate_m3`, `liftable_density`, `factor_base_fixed_size`, `factor_base_window`
        and `two_torsion_x_count` are frozen; four committed runs depend on their current behaviour
        and this campaign has already been bitten twice by a silently altered sampler (CORR-20260807-a05e1e,
        CORR-20260807-9f83be). New capability is added as NEW functions in a NEW module. A diff showing
        zero behavioural change to the frozen functions is a required artifact.
      required_new_functions:
      - blocking(pool, rung) -> dict curve_index -> block_id, plus realized (n_blocks, delta_max_N,
        blocks_with_ge_2_classes, degenerate)
      - statistic_weighted(values, labels) -> SS_within/(n-K)
      - statistic_unweighted(values, labels) -> mean over labels with n_c>=2 of sample variance
      - blocked_permutation_null(values, labels, blocks, B, seed) -> (T_obs, empirical_null_mean,
        null_sd, r_lower, r_upper, p_lower, p_upper), numpy-vectorized
      - closed_form_null_mean(values, labels, blocks, statistic) -> exact E[T_pi | B]
      - sumset_m2(E, fb) -> (sumset_size, sums) and sumset_m3(E, fb) -> (sumset_size, sums), exact
        enumeration, no targets
    pools:
      POOL_A:
        prime: 4001
        rule: harness/run_icinv.py::pick_classes(4001, n_control=3)
        expected_realization: traces {30, -30, 18, -18}, sizes 138/138/98/98, N 3972/4032/3984/4020,
          Delta_pool = 60, as recorded in the four committed p=4001 runs. The Executor RE-DERIVES
          this at stage S0 and records it; the expectation is stated so a mismatch is visible, not
          so it can be assumed.
        role: reproduction, head-to-head against committed NULL-C, calibration
      POOL_B:
        prime: 4001
        rule: harness/run_icinv.py::pick_classes(4001, n_control=11)
        expected_realization: NOT PREDICTED. Recorded at S0 before any functional is measured.
        role: ladder, power, size
      POOL_C:
        prime: 4001
        rule: Twelve ordinary traces drawn uniformly without replacement from all ordinary traces
          at p with class size >= 20, using the declared seed derivation with arm label "POOLC". Records
          the drawn traces at S0.
        role: Selection control. pick_classes selects the LARGEST ordinary classes and class size
          is the (weighted) class number of D = t^2 - 4p, which is correlated with the arithmetic
          of D and hence with the 2-torsion structure driving several functionals. That is not selection
          on the outcome, but it is not neutral, and this arm is how the contract says so with a number
          rather than a caveat.
      POOL_D:
        prime: 6007
        rule: harness/run_icinv.py::pick_classes(6007, n_control=11)
        expected_realization: NOT PREDICTED. Recorded at S0.
        role: 'Second-prime replication. MANDATORY: CORR-20260807-a05e1e required_action 4 makes two-prime
          replication a standing obligation for every between-class statement in GOAL-ENDO-001, and
          one prime is what failed to detect the sampler confound the first time.'
      minimum_class_size: 20
      dropped_class_rule: A pooled class with fewer than 20 curves is DROPPED and the drop is recorded
        with its trace and size. Groups of size < 2 make the unweighted statistic undefined and the
        committed code silently skips them; this contract removes that silence.
    blocking_ladder:
      invariant: EVERY declared blocking is a COARSENING OF THE CLASS PARTITION -- each block is a
        union of whole classes. This is automatic because every block key below is a function of the
        class (through its trace), and it is what makes the permutation block-separable, preserves
        the group-size multiset exactly, and makes the null mean closed-form.
      permutation_rule: For each block independently, uniformly permute the vector of class labels
        held by the curves in that block. The measured values are NOT permuted; only the labels move.
        Across blocks the permutations are independent.
      rungs:
      - id: R0_FREE
        block_key: constant (one block)
        role: the committed NULL-C, reproduced exactly; the ladder's reference rung
      - id: R1_TWIST
        block_key: abs(t)
        role: ORTHOGONAL TO THE N LADDER, NOT A RUNG OF IT. Justified by exchangeability of twist-invariant
          functionals (HEUR-INSTR-2), not by N. A pooled trace whose negation is not pooled forms
          a singleton block.
      - id: R2_NBAND_w2
        block_key: floor((N - N_min)/w2), w2 = max(2, ceil(Delta_pool/2))
        role: N ladder, coarse
      - id: R3_NBAND_w3
        block_key: floor((N - N_min)/w3), w3 = max(2, ceil(Delta_pool/8))
        role: N ladder, medium
      - id: R4_NBAND_w4
        block_key: floor((N - N_min)/w4), w4 = max(2, ceil(Delta_pool/32))
        role: N ladder, fine
      - id: R5_PERCLASS
        block_key: t
        role: DEGENERATE BY CONSTRUCTION. The permutation is the identity, so p_lower is forced to
          exactly 1.0 and the ratio to exactly 1. It is the cheapest possible implementation check
          and it is mandatory.
      - id: R6_TWIST_AND_NBAND_w2
        block_key: (abs(t), floor((N - N_min)/w2))
        role: The composition, reported to expose the tension between the two blockings. Pre-registered
          as DEGENERATE at POOL-A.
      decay_parameter: Delta_max(rung) = max over blocks of (max N - min N within the block), recorded
        per rung. The N ladder R0 -> R2 -> R3 -> R4 -> R5 is required to have strictly decreasing
        Delta_max; if the declared widths do not achieve that at a realized pool, the rung is reported
        as collapsed onto its predecessor rather than silently retuned.
      degeneracy_rule: 'A rung in which every block contains exactly one class is DEGENERATE. Its
        p_lower is 1.0 by construction, it is flagged `degenerate: true`, and it is excluded from
        "the finest NON-DEGENERATE rung" wherever that phrase appears in a criterion.'
      what_non_decay_means: A functional whose ratio T_obs/E[T_pi] does NOT rise monotonically as
        Delta_max falls, while its matched pure-N surrogate's ratio does, has a nuisance that is NOT
        the group order and that nobody has named. That is the canonical artifact tell of docs/inventor-protocol.md
        section 3. It is recorded as an open anomaly with the failing rung exhibited -- never as a
        discovery, and never as a failure of the instrument.
    functionals:
    - key: order
      definition: 'N = #E(F_p)'
      role: PURE-N REFERENCE AND FORCED CONTROL. Within-class variance is EXACTLY 0, so T_obs = 0.0
        at every rung and E[T_pi | rung] is precisely the residual within-block variance of N. That
        number IS the nuisance budget.
    - key: full_liftable
      definition: '#{x in F_p : x^3+ax+b is a square}, i.e. factor_base_window(E, p) size'
      role: CALIBRATION / KNOWN-ANSWER TEST. Equals (N - 1 + z)/2 exactly, so T_obs = mean_c Var(z_c)/4
        and E[T_pi | rung] is closed-form from (N_c, n_c, {z_i}) alone.
    - key: liftable_density_W
      definition: liftable_density(E, W) for W in {p//32, p//16, p//8, p//4, p//2, p}
      role: the campaign's existing window-decay test, crossed with the blocking ladder
    - key: two_torsion_x
      definition: 'z = #{x : x^3+ax+b = 0}'
      role: twist-invariance probe (HEUR-INSTR-2) and the source of full_liftable's within-class variance
    - key: sumset_m2
      definition: '|2V|, the exact size of the 2-fold sum set of the fixed-size factor base, by enumeration'
      role: 'LAYER 1: removes the binomial sampling variance entirely'
    - key: sumset_m3
      definition: '|3V|, exact'
      role: LAYER 1
    - key: sumset_eff_m2
      definition: '|2V| / max_sums(fb_size, 2)'
      role: factor-base-size-free normalisation of sumset_m2
    - key: sumset_eff_m3
      definition: '|3V| / max_sums(fb_size, 3)'
      role: factor-base-size-free normalisation of sumset_m3
    - key: decomp_rate_m2
      definition: sampled decomposition rate at m=2 under targets_uniform (post CORR-20260807-9f83be)
      role: head-to-head against the committed NULL-C rows; P7's sampled comparator
    - key: decomp_rate_m3
      definition: sampled decomposition rate at m=3 under targets_uniform
      role: as above
    - key: decomp_efficiency_m2
      definition: rate * order / max_sums(fb_size, 2)
      role: the campaign's declared evidence row
    - key: decomp_efficiency_m3
      definition: rate * order / max_sums(fb_size, 3)
      role: the campaign's declared evidence row
    - key: s3_support
      definition: s3_monomial_support(p, a, b)
      role: exact class-invariant control; expected `invariant` in every committed run
    n_free_disclosure: NO FUNCTIONAL HERE IS CLAIMED N-FREE. |mV| is bounded by N and its additive-collision
      rate depends on N; the Layer-1 gain is removal of the SAMPLING dependence on N only, which strictly
      increases power and therefore strictly increases the danger from an uncorrected N confound.
      That is pre-registered as prediction P7 and not discovered afterwards.
    statistics:
      weighted: T_w = SS_within/(n - K), SS_within = sum_c sum_{i in c} (Y_i - mean_c)^2, K = number
        of labels present
      unweighted: T_unw = mean over labels with n_c >= 2 of the (n_c-1)-denominator sample variance
        -- the committed statistic, retained for comparability only
      primary: weighted
      both_reported_always: true
    p_value_estimator:
      formula: 'p_lower = (1 + #{v <= T_obs})/(1 + B); p_upper = (1 + #{v >= T_obs})/(1 + B)'
      raw_counts_reported: true
      resolution_floor: 1/(1 + B)
      why: 'The committed estimator #{v <= T_obs}/B returned exactly 0.0 at five of the six windows
        of RUN-ICINV-p4001-a. 0.0 is not a p-value. Both tails are reported because an artifact can
        push the observed statistic either way and reporting one tail hides half the picture.'
    closed_form_null_mean:
      weighted: E[T_w | B] = (sum_c (n_c - 1) * S2_block(c)) / (n - K)
      unweighted: E[T_unw | B] = mean over labels with n_c >= 2 of S2_block(c)
      definition: S2_beta = pooled (n_beta - 1)-denominator sample variance of Y over block beta
      applicability: VALID ONLY when every class lies entirely inside one block, which holds for every
        declared blocking on the real object. It does NOT hold for the synthetic-label null object,
        whose synthetic classes straddle blocks; there the empirical Monte-Carlo mean is the only
        null mean reported and the closed form is explicitly marked not_applicable.
    committed_reproduction_fixtures:
      sampler_free_valid_for_current_code:
      - quantity: permutation_null.liftable_density raw count
        value: r = 1 of B = 2000 (reported p = 0.0005)
        source: experiments/EXP-ICINV-180a0d/runs/RUN-ICINV-p4001-a/raw-result.json and all three
          EXP-ICINV-9b1f7c p=4001 runs
      - quantity: window_decay W=4001 raw count
        value: r = 0 of B = 1000 (reported p = 0.0)
        source: same
      - quantity: window_decay W=4001 observed_mean_within_variance
        value: 1.557881769803647e-08
        source: same
      - quantity: window_decay W=4001 null_mean
        value: 1.0357263552475702e-05
        source: same
      - quantity: full_field_liftable_within_class_count_variance
        value: 0.24938572928898783
        source: manifest.yaml result.metrics of all four p=4001 runs
      - quantity: Var(two_torsion_x) per class
        value: 1.0053951126626468 at traces 30 and -30 (n=138 each); 0.9896907216494846 at 18 and
          -18 (n=98 each)
        source: experiments/EXP-ICINV-180a0d/runs/RUN-ICINV-p4001-a/raw-result.json per_class[*].verdicts.two_torsion_x
      sampler_dependent_only_valid_fixture:
        run: RUN-ICINV-p4001-degenfix
        values:
          decomp_efficiency_m2: 0.7815
          decomp_efficiency_m3: 0.098
          decomp_rate_m2_RAW_confounded_by_order: 0.2825
          decomp_rate_m3_RAW_confounded_by_order: 0.107
        why: The target sampler has been corrected TWICE. RUN-ICINV-p4001-a's decomposition rows used
          the confounded hash-and-lift `_targets` and CORR-20260807-a05e1e forbids citing them at
          all; RUN-ICINV-p4001-uniform's and -identity's used the pre-fix `targets_uniform`. Only
          the post-fix degenfix run is a reproduction target for today's code. A naive "reproduce
          the committed p-values" check would fail here for a reason that is NOT instrument instability,
          and this block exists so that failure is not misread.
      scoping_note_on_CORR_a05e1e: CORR-20260807-a05e1e's required_action says NEVER cite the NULL-C
        rows of RUN-ICINV-p4001-a. The rows this contract cites from that run are (i) the window_decay
        block and (ii) the per-class two_torsion_x variances, both of which the same correction's
        `scope_of_the_defect.unaffected_and_why` explicitly names as unaffected -- the window-size
        decay test is listed by name, and neither quantity touches the target sampler. The top-level
        permutation_null.liftable_density row is ALSO sampler-free by construction (liftable_density
        takes no targets) and is used only as a raw-count reproduction fixture, never as evidence
        of anything. No decomposition row of that run is cited anywhere in this contract.
    seeds:
      reproduction_seed: 20260807
      master_seed: 85102
      domain: EXP-INSTR-85b102/v1
      derivation_rule: For arm label L, pool P, rung Rg, functional F, effect index d and replicate
        r, the seed is the big-endian unsigned integer of SHA-256 over the ASCII bytes of domain ||
        "|" || L || "|" || P || "|" || Rg || "|" || F || "|" || decimal(d) || "|" || decimal(r) ||
        "|" || decimal(master_seed), reduced mod 2^64, consumed by numpy.random.default_rng. A third
        party reproduces every draw bit-for-bit from (L, P, Rg, F, d, r) alone.
      reproduction_arm_uses_committed_seed: Stage S2 uses seed 20260807 and the committed dict insertion
        order, because harness/exp_icinv.py::permutation_null derives its group sizes from `groups.values()`
        and its shuffle from `random.Random(seed)`; the realized insertion order must be recorded,
        since reproduction depends on it.
    permutations:
      primary_B: 10000
      power_study_B: 1000
      why_two_values: The primary arms need resolution below 1e-4 to distinguish a floor p-value from
        a small one. The power study needs only a level-0.05 decision, for which a floor of 1/1001
        is ample, and 200 replicates x 6 effect sizes x every rung x 4 pools at B = 10000 would not
        fit the budget.
  controls:
  - 'CTRL-REPRO: reproduction of the sampler-free committed rows on the frozen POOL-A slice; failure
    is instrument instability and halts everything.'
  - 'CTRL-CALIB: the full-field liftable count, whose observed statistic and null mean are both closed
    forms in (N_c, n_c, {z_i}); a forced-value known-answer test at every rung.'
  - 'CTRL-ORDER: the functional `order`, whose within-class variance is exactly 0 and whose per-rung
    null mean IS the nuisance budget.'
  - 'CTRL-PERCLASS: the degenerate per-class rung, forced to return p_lower exactly 1.0 for every
    functional.'
  - 'CTRL-NULLOBJ: synthetic trace-independent class labelling matching the true class-size multiset,
    on the real measured values; forced-value size check at every rung.'
  - 'CTRL-SIZE0: the delta = 0 row of the planted-effect study -- unit-variance noise with TRUE labels
    and TRUE blocking; realized type-I error at the exact block structure the power numbers come from.'
  - 'CTRL-POWER: planted between-class effect at 0, 0.1, 0.2, 0.4, 0.8, 1.6 within-class standard
    deviations, 200 replicates, every rung; yields the power curve, delta*(rung), and the power COST
    of blocking relative to the free rung.'
  - 'CTRL-NSURR: pure-N surrogate with within-class noise matched to each functional; the non-forced
    reference decay curve every real functional is read against.'
  - 'CTRL-SELECTION: POOL-C, size-random trace selection, against POOL-B''s largest-classes selection.'
  - 'CTRL-PRIME: POOL-D at p = 6007; mandatory two-prime replication under CORR-20260807-a05e1e.'
  - 'CTRL-TWIST: the sorted two_torsion_x multiset equality check across every pooled {t,-t} pair,
    testing HEUR-INSTR-2 directly rather than assuming it.'
  - 'CTRL-FROZEN-DIFF: a behavioural diff proving no frozen harness function changed.'
  arms_and_controls:
    CTRL_NULLOBJ:
      construction: 'Take the pooled curve set with its real measured values. Draw a uniform permutation
        of the curves under the declared seed rule and cut it into consecutive runs of sizes equal
        to the TRUE class-size multiset; those runs are the synthetic class labels. The synthetic
        labelling therefore matches the size profile exactly and is independent of the trace by construction.
        THE BLOCKING IS COMPUTED FROM THE CURVE''S TRUE N, NOT FROM ITS SYNTHETIC LABEL: a block is
        a property of the curve, which is the same convention the real object uses and the only one
        under which the two arms are comparable.'
      replicates: 200
      forced_value: The rejection rate at level 0.05 must be 0.05. The synthetic labels are exchangeable
        within every block by construction, so THIS CONTROL CANNOT FAIL FOR A MATHEMATICAL REASON
        -- it can only fail if the implementation is wrong. It is included for exactly that reason,
        and the contract says so rather than presenting a forced pass as a finding.
      acceptance: 'The count of replicates with p_lower <= 0.05 must lie inside the exact two-sided
        99% Binomial(200, 0.05) interval, computed and reported by the Executor (normal-approximation
        guide: roughly 3 to 18 of 200). Checked at EVERY rung and both primes.'
    CTRL_SIZE0:
      construction: Y_i drawn iid standard normal under the declared seed rule; TRUE class labels;
        TRUE blocking. This is the delta = 0 row of CTRL-POWER and it measures realized size at exactly
        the block structure the power numbers are computed at.
      replicates: 200
      acceptance: same exact binomial interval as CTRL-NULLOBJ, at every rung.
    CTRL_POWER:
      construction: 'Y_i = eps_i + delta * u_{c(i)} with eps iid standard normal (so delta is measured
        directly in within-class standard deviations, sigma = 1 by construction). The class offsets
        u_c in {+1,-1} are assigned WITHIN EACH BLOCK so that the +1 and -1 counts differ by at most
        one, in an order given by the low byte of SHA-256(domain || "|u|" || decimal(trace)). Two
        reasons, both stated: the effect must vary WITHIN blocks or no blocked test could ever see
        it, which would make the arm a tautology rather than a power test; and a hash-determined order
        keeps the offsets from being a monotone function of N, which would make the planted effect
        an N effect and the blocking correct to remove.'
      declared_effect_grid_in_within_class_sd:
      - 0.0
      - 0.1
      - 0.2
      - 0.4
      - 0.8
      - 1.6
      replicates_per_cell: 200
      reported: power(rung, delta) at level 0.05; delta*(rung) = the smallest grid delta with power
        >= 0.80; power(R0_FREE, delta) - power(rung, delta) as the explicit power COST of blocking;
        and the realized within-block correlation between u and N, so a reader can see whether the
        planted effect is accidentally aligned with the nuisance.
      limitation_stated_in_advance: 'In a block containing exactly two classes, ANY +-1 assignment
        is trivially monotone in N, so the alignment disclaimer above is vacuous there. The primary
        power arm is therefore read at rungs whose blocks contain at least three classes; blocks of
        two classes are reported separately and their power numbers are labelled `two_class_block:
        true`.'
    CTRL_NSURR:
      construction: For each functional f, build Y-tilde_i = slope_f * N_{c(i)} + sqrt(v_f) * eps_i,
        eps iid standard normal, v_f the measured pooled within-class variance of f on that pool.
        slope_f is EXACT for `order` (1) and for `full_liftable` (1/2); for every other functional
        it is the size-weighted OLS slope of class mean on N estimated on that pool, reported with
        its standard error and labelled ESTIMATED. Both labels appear in the output.
      replicates: 50
      reported: R_surr(f, rung) = T_obs / E[T_pi | rung] for the surrogate, and the excess E(f, rung)
        = R_f(rung) / R_surr(f, rung). E ~ 1 means the functional is indistinguishable from a pure-N
        signal with the same noise at that rung; E < 1 means residual between-class structure beyond
        N.
      honesty_note: The excess statistic is a SECONDARY interpretive aid whose assumption (a single
        linear N slope) is stated and, for all but two functionals, estimated from the same data.
        The PRIMARY output remains the exact, assumption-free conditional test at each rung. The two
        are never mixed in one column.
    CTRL_TWIST:
      check: 'For every pooled pair {t,-t}: class sizes equal, and the SORTED vector of two_torsion_x
        over class t identical to that over class -t. At POOL-A this is forced by the committed data
        to be 66 curves with z=3 and 72 with z=1 in each of traces 30 and -30, and 42 with z=3 and
        56 with z=1 in each of 18 and -18 (derived from the committed means, sizes and "distinct values:
        2"; not measured by the Coordinator).'
      on_failure: HEUR-INSTR-2 is falsified, twist blocking is reported as UNJUSTIFIED rather than
        silently retained, and the contract's forward guidance is that it must be replaced by explicit
        |D| = |t^2 - 4p| matching. The rest of the ladder is unaffected.
  independent_variables:
  - blocking rung (equivalently Delta_max, the maximum within-block N spread)
  - functional
  - pool (POOL_A, POOL_B, POOL_C, POOL_D)
  - prime (4001, 6007)
  - planted effect size delta in within-class standard deviations
  - window W for the liftable-density family
  - statistic (weighted, unweighted)
  - number of permutations B
  metrics:
    primary:
    - name: T_obs_weighted
      definition: SS_within/(n-K) for the true grouping
      units: functional units squared
    - name: T_obs_unweighted
      definition: mean over classes with n_c>=2 of the sample variance -- the committed statistic
      units: functional units squared
    - name: perm_null_mean_empirical
      definition: Monte-Carlo mean of the statistic over B blocked permutations, with its standard
        deviation and the Monte-Carlo standard error of the mean
      units: functional units squared
    - name: perm_null_mean_closed_form
      definition: E[T_pi | B] from the block-pooled sample variances; reported with the signed residual
        against the empirical mean and that residual in Monte-Carlo standard errors
      units: functional units squared
    - name: p_lower_and_p_upper
      definition: '(1 + #{v <= T_obs})/(1+B) and (1 + #{v >= T_obs})/(1+B), with both raw counts r_lower,
        r_upper and the floor 1/(1+B)'
      units: probability
    - name: variance_ratio_R
      definition: T_obs / perm_null_mean_empirical, per functional per rung
      units: dimensionless
    - name: nuisance_budget
      definition: perm_null_mean at that rung for the functional `order` -- the residual within-block
        variance of N
      units: N squared
    - name: delta_max_N
      definition: max over blocks of (max N - min N); the ladder's decay parameter
      units: N
    - name: power_at_delta
      definition: fraction of 200 replicates with p_lower <= 0.05, per rung per planted effect size
      units: probability
    - name: minimum_detectable_effect
      definition: delta*(rung), the smallest grid delta with power >= 0.80, per rung
      units: within-class standard deviations
    - name: realized_size
      definition: rejection rate at level 0.05 on CTRL-NULLOBJ and on CTRL-SIZE0, with its exact binomial
        acceptance interval
      units: probability
    secondary:
    - name: contamination_gap
      definition: the tuple (p_lower, R, Delta_max) at R0_FREE beside the same tuple at the finest
        non-degenerate rung, per functional per pool -- the campaign's honest headline, which is the
        pair and never either number alone
      units: mixed
    - name: excess_over_N_surrogate
      definition: E(f, rung) = R_f(rung)/R_surr(f, rung), with the surrogate's slope labelled EXACT
        or ESTIMATED
      units: dimensionless
    - name: power_cost_of_blocking
      definition: power(R0_FREE, delta) - power(rung, delta)
      units: probability
    - name: pool_table
      definition: 'per class: trace, N, size, aut-order histogram, Var(z), sorted z-vector hash, census
        observed vs Hurwitz-predicted weighted count and agreement flag'
      units: mixed
    - name: rung_table
      definition: 'per rung: n_blocks, block composition by trace, Delta_max, blocks_with_ge_2_classes,
        blocks_with_ge_3_classes, degenerate flag'
      units: mixed
    - name: realized_N_spread
      definition: Delta_pool = max N - min N over the pool, beside the bound 4*sqrt(p) and the ratio
        Delta_pool/(p+1)
      units: N
    - name: exact_vs_sampled_significance
      definition: p_lower for sumset_m under the FREE permutation beside p_lower for decomp_rate_m
        at the same m -- prediction P7
      units: probability
    - name: committed_fixture_table
      definition: each reproduction fixture -> primary artifact path -> RESOLVED/UNREACHABLE -> value
        read -> signed difference
      units: mixed
    - name: frozen_function_diff
      definition: behavioural diff status for each frozen harness function
      units: categorical
  heuristic_under_test: null
  heuristic_under_test_note: 'Explicitly null rather than absent. This contract does not validate
    ONE heuristic of a conditional theorem; it validates an INSTRUMENT, and it bears on BOTH of H-INSTR-fffbfb''s
    numbered heuristics at once: HEUR-INSTR-1 (within-block exchangeability) through CTRL-NULLOBJ
    and CTRL-SIZE0, and HEUR-INSTR-2 (twist pairing) through CTRL-TWIST. Naming a single heuristic_under_test
    would misdescribe the design.'
  preregistered_prediction:
    quantity: The blocked permutation's null mean, variance ratio and p-value at each rung for the
      calibration functional and the pure-N reference, plus the realized degeneracy of two declared
      rungs and the composition of the two blockings.
    formula: T_obs = mean_c Var(z_c)/4 (count units); E[T_pi | B] = mean over classes of S2_block(c)
      (unweighted statistic) and (sum_c (n_c-1) S2_block(c))/(n-K) (weighted statistic), with S2_beta
      the pooled (n_beta - 1)-denominator sample variance over block beta; at the free rung this is
      S2_Y = (S2_N + S2_z + 2 Cov(N,z))/4; Y = (N - 1 + z)/2 from harness/exp_icinv.py::liftable_count_identity.
    source: ledger/hypotheses/H-INSTR-fffbfb.yaml mechanism STEPS 3-6, derived from harness/exp_icinv.py::liftable_count_identity
      and the sampling-without- replacement identity E[s^2] = S^2, with inputs read from experiments/EXP-ICINV-180a0d/runs/RUN-ICINV-p4001-a/raw-result.json.
    values_frozen_here:
      POOL_A_full_liftable_count_units:
        T_obs: 0.24938572928901642
        E_T_pi_R0_FREE: 165.8028717
        E_T_pi_R1_TWIST: 153.8651
        E_T_pi_NBAND_width_24: 9.0279
        E_T_pi_R5_PERCLASS: equal to T_obs; ratio exactly 1; p_lower exactly 1.0
      POOL_A_full_liftable_ratios:
        R0_FREE: 1/664.8
        R1_TWIST: 1/617.0
        NBAND_width_24: 1/36.2
        R5_PERCLASS: 1 exactly
      POOL_A_delta_max_N:
        R0_FREE: 60
        R1_TWIST: 60
        NBAND_width_24: 12
        R5_PERCLASS: 0
      POOL_A_committed_agreement:
        observed_rate_units: 1.5578817698e-08
        committed_observed: 1.557881769803647e-08
        closed_form_null_rate_units: 1.0357456e-05
        committed_null_mean: 1.0357263552475702e-05
        relative_residual_on_null_mean: 1.9e-05
        residual_on_T_obs_count_units: 2.859e-14
      POOL_A_forced_degeneracies:
        R6_TWIST_AND_NBAND_w2: DEGENERATE (w2 = 30 against min 2|t| = 36)
        R5_PERCLASS: DEGENERATE by definition
      POOL_A_two_torsion_composition:
        trace_30: 66 curves with z=3, 72 with z=1
        trace_minus_30: 66 curves with z=3, 72 with z=1
        trace_18: 42 curves with z=3, 56 with z=1
        trace_minus_18: 42 curves with z=3, 56 with z=1
      p_value_expectations:
        full_liftable_at_every_non_degenerate_rung_POOL_A: p_lower at the resolution floor 1/(1+B)
        every_control_object_at_every_rung: rejection rate at level 0.05 inside the exact 99% Binomial(200,
          0.05) interval
    in_sample_disclosure: 'THE POOL-A VALUES ABOVE ARE IN-SAMPLE. The committed run records were open
      while the closed form was written, so their reproduction is a REPRODUCTION and never a prediction,
      and every downstream statement must carry that distinction. OUT-OF-SAMPLE, and the contract''s
      real test: every POOL-B, POOL-C and POOL-D number; the entire power and size study; the excess-over-
      surrogate curves; P7''s exact-versus-sampled comparison; and the twist multiset check at p =
      6007.'
  scale_relevance:
    tier: toy
    justification: 'p in {4001, 6007}; complete enumeration of every F_p-isomorphism class costs O(p^2)
      character-sum work, which is what confines the whole design to p of order 2^12 to 2^13. At those
      p the largest prime factor of N is around 12 bits, so no functional measured here is an attack
      cost at any scale that matters, and none is claimed to be. THIS IS AN INSTRUMENT CONTRACT: it
      produces NO ECDLP claim, NO speedup, and its sota_delta is ZERO on every axis -- time, memory,
      and data/queries -- against every row of the prime-field frontier (parallel Pollard rho at 0.886*sqrt(N)
      time and O(1) memory, KN-TECH-001/KN-TECH-006; the automorphism-discounted variant on CM curves,
      KN-TECH-018; BSGS at sqrt(N) time and memory). It computes no discrete logarithm, so there is
      no axis on which it competes. Conclusions do not transfer across scale and are not offered as
      transferring: the ceiling is exactly "these primes, these enumerated classes, these functionals,
      this ladder".'
    correspondence: 'NOT APPLICABLE AND STATED RATHER THAN OMITTED. No sampling correspondence is
      used to reach scale: every class is directly and completely enumerated, and completeness is
      certified against the Hurwitz-Kronecker class number by harness/isogeny_class.py::class_census
      rather than assumed. There is therefore no isometry claim to make and no citation to assert.'
  tail_checks:
  - R5_PERCLASS must return p_lower EXACTLY 1.0 (bitwise) for every functional, every pool. Zero tolerance.
  - The functional `order` must return T_obs exactly 0.0 in floating point, every pool, every rung.
  - The identity full_liftable == (order - 1 + two_torsion_x)//2 must hold on 100% of curves at both
    primes, checked per curve and reported as a count, not a boolean.
  - No reported p-value may be exactly 0.0 or exactly 1.0 anywhere except at a rung flagged degenerate;
    the estimator makes 0.0 impossible, so an observed 0.0 is an implementation defect.
  - The smallest p_lower observed anywhere in the study must be >= 1/(1+B); a smaller value is impossible
    and indicates a counting bug.
  - For `full_liftable` and `order`, the closed-form null mean must agree with the empirical Monte-Carlo
    mean within 3 Monte-Carlo standard errors at EVERY rung and pool; these are the two functionals
    for which the closed form is exact rather than approximate.
  - 'The most extreme replicate of CTRL-NULLOBJ (the smallest p_lower over 200 draws) must be consistent
    with 200 draws from Uniform(0,1): its expected value is about 1/201, and a value below 1/(1+B)
    is impossible.'
  - Delta_max must be non-increasing along R0 -> R2 -> R3 -> R4 -> R5; a rung that fails to decrease
    Delta_max is reported as collapsed, never silently retuned.
  replication:
    seeds:
    - 20260807
    - 85102
    seed_scope: 20260807 is the committed reproduction seed and is used ONLY by stage S2's reproduction
      arm, where it must match the committed runs exactly. 85102 is the master seed from which every
      new draw is derived by the declared SHA-256 rule; no arm uses an undeclared seed, and the measurement
      arms (S0, S1, S3) are deterministic in the pool and need none.
    independent_instances: 4
    independent_instances_detail: 'Four declared pools across two independent primes: POOL_A and POOL_B
      at p = 4001 (nested, so not independent of each other), POOL_C at p = 4001 (independent trace
      selection), POOL_D at p = 6007 (independent prime). Every criterion below that says "both primes"
      requires POOL_B and POOL_D.'
    determinism_requirement: Re-running any arm with the same (L, P, Rg, F, d, r) must reproduce the
      identical values, the identical block assignment and the identical statistic bit-for-bit. A
      non-reproducible arm is invalid.
  budget:
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 6
    maximum_memory_gb: 4
    maximum_runs: 16
    note: Dominant measurement cost is the O(p) full-field liftable count and the O(p) 2-torsion count
      per curve over roughly 1200 curves per twelve-class pool; the committed RUN-ICINV-p4001-a measured
      472 curves in 43.4 s wall at 84.8 MB peak RSS, so measurement is minutes. The only arm that
      can blow the budget is the permutation study (4 pools x 7 rungs x 13 functionals x 10000 permutations,
      plus 4 pools x 7 rungs x 6 effect sizes x 200 replicates x 1000 permutations), which REQUIRES
      a numpy-vectorized permutation. If it is not vectorized the study will exceed budget; that is
      an implementation defect and is reported as an infrastructure receipt, never as a result.
  stages:
  - id: S0
    name: pool freeze and provenance
    cost: minutes; enumeration only, no functional measured
    terminates_run: true
    description: 'Enumerate every class at each prime, run class_census, and record for each declared
      pool: realized traces, N, class sizes, aut-order histogram, Delta_pool against the bound 4*sqrt(p)
      and the ratio Delta_pool/(p+1), dropped classes below the size floor, and the full rung table
      with block compositions and Delta_max. Resolve every committed reproduction fixture to its primary
      artifact path and mark RESOLVED or UNREACHABLE. Record the frozen-function behavioural diff.
      THE POOL IS FROZEN HERE, BEFORE ANY FUNCTIONAL IS MEASURED; this is what forbids the weaker
      quantifier order (choosing the pool after seeing the functional). Terminates the run on any
      census failure.'
  - id: S1
    name: zero-compute arithmetic gate
    cost: seconds; integer and rational arithmetic on committed numbers
    terminates_run: true
    description: THE CHEAPEST DECISIVE GATE AND IT RUNS BEFORE ANY MEASUREMENT. From the committed
      per-class (N, n, mean z, Var z) alone, re-derive mean_c Var(z_c)/4 and compare against the committed
      0.24938572928898783; re-derive the closed-form free-permutation null mean and compare against
      the committed 1.0357263552475702e-05. If either fails, the diagnosis that the committed 664x
      is the group order is WITHDRAWN, the run ENDS here, and that withdrawal is the deliverable.
  - id: S2
    name: committed-fixture reproduction
    cost: about 2 minutes; one invocation of the existing harness path
    terminates_run: true
    description: Re-run the existing free permutation on the frozen POOL-A slice at seed 20260807
      and reproduce the SAMPLER-FREE fixtures exactly (raw counts, not just rounded p-values), and
      the sampler-dependent fixtures against RUN-ICINV-p4001-degenfix only. Record the realized dict
      insertion order. Failure on a sampler-free fixture is instrument instability and terminates
      the run.
  - id: S3
    name: measurement
    cost: minutes to tens of minutes per pool
    terminates_run: false
    description: Measure every declared functional on every curve of every pool. Verify the liftable-count
      identity per curve. Run CTRL-TWIST. Emit the per-curve table.
  - id: S4
    name: ladder
    cost: minutes, vectorized
    terminates_run: false
    description: 'For every (pool, functional, rung): T_obs both statistics, empirical and closed-form
      null means with their residual in Monte-Carlo standard errors, both tails'' raw counts and p-values,
      ratio R, Delta_max, nuisance budget, degeneracy flag. Emit the contamination-gap table.'
  - id: S5
    name: control objects
    cost: the dominant compute; requires vectorization
    terminates_run: false
    description: CTRL-NULLOBJ, CTRL-SIZE0, CTRL-POWER and CTRL-NSURR at every rung and pool. Emit
      realized size with its exact binomial interval, the power curve, delta*(rung), the power cost
      of blocking, and the excess-over-surrogate curves. THE CONTROL OBJECTS ARE RUN AND THEIR NUMBERS
      WRITTEN TO THE RESULTS ARTIFACT BEFORE THE S4 LADDER TABLE IS INTERPRETED; a decision rule that
      emits the same verdict on CTRL-NULLOBJ as on the real object discriminates nothing and must
      be rewritten before the real table is read.
  - id: S6
    name: emission
    cost: seconds
    terminates_run: false
    description: Score every pre-registered prediction P1-P8 as MET / NOT MET / NOT DECIDABLE with
      its number, marking P1 and the POOL-A rows of P2-P6 as IN-SAMPLE reproductions. Emit the recommendation
      clause required by SC8.
  stopping_rules:
  - class_census reports any failure at either prime -> STOP; enumeration is incomplete and the run
    is invalid, not negative.
  - S1's arithmetic gate fails -> STOP; report the withdrawal of the 664x diagnosis as the deliverable,
    run nothing else.
  - S2 fails to reproduce any SAMPLER-FREE committed fixture -> STOP; instrument instability, nothing
    is concluded.
  - R5_PERCLASS returns anything other than exactly 1.0, or `order` returns nonzero within-class variance
    -> STOP; implementation defect.
  - CTRL-NULLOBJ or CTRL-SIZE0 rejects outside its exact binomial interval at any rung -> STOP for
    that rung; no result may be reported from a rung whose size is not calibrated.
  - More than half the committed reproduction fixtures resolve UNREACHABLE -> STOP and report the
    provenance failure as the deliverable.
  - Wall clock or memory exhausted -> STOP, report which pools and rungs completed, as infrastructure
    signal and never as a result.
  invalidation_rules:
  - Any arm whose draws are not reproducible bit-for-bit from its declared (L,P,Rg,F,d,r) is invalid.
  - Any blocking that is NOT a coarsening of the class partition on the real object is invalid; the
    closed-form null mean and the group-size preservation both depend on it.
  - Any comparison between rungs, pools or functionals that differ in statistic, in B, in the p-value
    estimator, or in the set of dropped classes is invalid and must be reported separately.
  - Any number reported without its rung's Delta_max, nuisance budget and delta* is invalid on its
    face; a bare blocked p-value is the exact failure mode this contract exists to end.
  - Any citation of a decomposition row of RUN-ICINV-p4001-a, -b, RUN-ICINV-p6007-a or -b is invalid
    (CORR-20260807-a05e1e required_action 1).
  - Any conclusion about ECDLP cost, attack advantage, isogeny-class invariance, or the within-class
    over-dispersion anomaly drawn from this contract is invalid on its face.
  - Any change to a frozen harness function's behaviour invalidates every reproduction fixture and
    therefore the whole run.
  success_criterion: 'ALL of the following, each decidable from the metrics above. (SC1 CALIBRATION)
    For `full_liftable` and `order`, the closed-form null mean agrees with the empirical Monte-Carlo
    mean within 3 Monte-Carlo standard errors at EVERY rung and pool, and at POOL-A the committed
    values are reproduced: T_obs to within 1e-9 of 0.24938572928898783 in count units and the free-rung
    null mean to within 1e-3 relative of 1.0357263552475702e-05 in rate units. (SC2 SIZE) CTRL-NULLOBJ
    and CTRL-SIZE0 each reject at level 0.05 in a number of replicates inside the exact two-sided
    99% Binomial(200, 0.05) interval, at every rung and both primes. (SC3 POWER) At the finest non-degenerate
    rung of POOL-B and of POOL-D, the planted effect at 0.8 within-class standard deviations is detected
    at level 0.05 in at least 90% of replicates, and delta*(rung) is reported at every rung. SC3 is
    evaluated at that rung whether or not its blocks hold three or more classes; if they hold only
    two, the number is still the deciding one and is additionally flagged `two_class_block: true`
    so a reader knows the planted offsets were unavoidably monotone in N there. The flag qualifies
    the reading, never the verdict. (SC4 FORCED VALUES) R5_PERCLASS returns p_lower exactly 1.0 for
    every functional and pool; `order` returns T_obs exactly 0.0; the liftable-count identity holds
    on 100% of curves at both primes. (SC5 LADDER) Delta_max is non-increasing along R0 -> R2 -> R3
    -> R4 -> R5 at every pool, and the nuisance budget is non-increasing along the same sequence and
    STRICTLY decreasing at every rung not reported as collapsed onto its predecessor. A collapsed
    rung -- one whose declared band width yields the same block partition as the previous rung at
    a realized pool -- is a benign realization of the declared rule and satisfies this clause with
    equality; it is not a licence to retune the width. Every functional''s ratio R is reported at
    every rung with an explicit monotonicity verdict. NOTE: a non-monotone ratio is a REPORTABLE OUTCOME
    (see what_non_decay_means), not a failure of this clause; the clause requires the verdict to be
    reported, not to come out any particular way. (SC6 DELIVERABLE) The contamination-gap table is
    emitted for every functional and pool -- (p_lower, R, Delta_max) at R0_FREE beside the same tuple
    at the finest non-degenerate rung -- together with the excess-over-surrogate curves and the scoring
    of P1-P8. (SC7 REPLICATION) SC1-SC6 hold at both p = 4001 and p = 6007. (SC8 UTILITY, AND THE
    CLAUSE THAT CAN RETURN A NEGATIVE) At the finest non-degenerate rung, for at least one primary
    functional other than `order` and `full_liftable`, the nuisance budget is reduced by at least
    a factor of 10 relative to R0_FREE AND the power at 0.8 within-class standard deviations remains
    at least 0.90, at both primes. IF NO RUNG SATISFIES BOTH AT EITHER PRIME, the recorded conclusion
    is "THE STRATIFIED NULL IS NOT BETTER THAN THE FREE ONE AT THESE POOLS": the design is NOT recommended
    for adoption, and the campaign''s between-class statements must thereafter be restricted to statements
    about means with the realized N spread declared beside them. That outcome is a SUCCESSFUL EXECUTION
    OF THIS CONTRACT and an UNSUCCESSFUL instrument, and the two must not be conflated in any downstream
    record.'
  falsification_criterion: 'ANY of the following, each naming exactly what it withdraws. (F1) The
    S1 arithmetic gate fails: mean_c Var(z_c)/4 differs from the committed 0.24938572928898783 by
    more than 1e-9, or the closed-form free-rung null mean differs from the committed 1.0357263552475702e-05
    by more than 1e-3 relative. WITHDRAWS the diagnosis that the committed 664x ratio is the group
    order plus the 2-torsion term; H-INSTR-fffbfb C1 is falsified at zero compute. (F2) A SAMPLER-FREE
    committed fixture does not reproduce at S2. Instrument instability; NOTHING is concluded and the
    discrepancy is the deliverable. (F3) CTRL-NULLOBJ or CTRL-SIZE0 fires outside its exact binomial
    interval at any rung. FALSIFIES HEUR-INSTR-1 at that rung; the blocking is wrong there and no
    result may be reported from it. (F4) Power at 0.8 within-class standard deviations at the finest
    non-degenerate rung is below 0.90. FALSIFIES C3: the blocking destroyed the test''s power, and
    the recorded conclusion is that the stratified null is not better than the free one at these pools.
    (F5) R5_PERCLASS returns anything but exactly 1.0, or `order` returns nonzero within-class variance,
    or the liftable-count identity fails on any curve. Implementation defect; the run is invalid,
    not negative. (F6) Some pooled twist pair has unequal class sizes or unequal sorted two_torsion_x
    vectors at either prime. FALSIFIES HEUR-INSTR-2; twist blocking is reported as unjustified and
    must be replaced by explicit |D| matching. (F7) Some functional''s ratio R stays below 1/4 at
    the finest non-degenerate rung while its matched pure-N surrogate''s ratio at the same rung exceeds
    1/2, at BOTH primes. FALSIFIES C4 for that functional: the residual is NOT the group order and
    the campaign has a genuine between-class effect beyond N to chase. This is the outcome worth running
    the test for and it is not a defect. (F8) A functional''s ratio fails to rise monotonically across
    the N ladder while its matched surrogate''s does. The nuisance is not (only) N and has not been
    named; recorded as an open anomaly with the failing rung EXHIBITED BY NAME. In every case the
    failing rung, pool, functional, curve or fixture is EXHIBITED BY NAME. A negative that names nothing
    has not finished and its honest status is unverified (docs/inventor-protocol.md section 4).'
  required_artifacts:
  - results.json with every primary and secondary metric, keyed by (pool, functional, rung, statistic,
    B)
  - 'pool_table.json: per class -- trace, N, size, aut-order histogram, Var(z), sorted-z hash, census
    observed vs Hurwitz-predicted weighted count, agreement flag, dropped/kept'
  - 'rung_table.json: per pool per rung -- n_blocks, block composition by trace, Delta_max, blocks
    with >=2 and >=3 classes, degenerate flag'
  - 'per_curve.csv: p, a, b, j, trace, N, aut_order, and every declared functional, one row per curve'
  - 'controls.json: CTRL-NULLOBJ and CTRL-SIZE0 rejection counts with their exact binomial intervals;
    CTRL-POWER curves, delta*(rung) and power cost; CTRL-NSURR excess curves with each slope labelled
    EXACT or ESTIMATED and its standard error'
  - 'committed_fixture_table.json: fixture -> primary path -> RESOLVED/UNREACHABLE -> value read ->
    signed difference'
  - 'prediction_scorecard.json: P1-P8 scored MET / NOT MET / NOT DECIDABLE with the deciding number,
    each flagged IN-SAMPLE or OUT-OF-SAMPLE'
  - 'frozen_function_diff.txt: behavioural diff status for every frozen harness function'
  - the exact commands, git commit, dirty-tree state, Python version and numpy version
  - the realized dict insertion order used by the S2 reproduction arm
  - stdout and stderr
  - manifest.yaml per run, schema-complete per AGENTS.md artifact policy
  infrastructure_failure_disposition: 'A timeout, crash, out-of-memory, missing dependency, unreadable
    artifact, or unresolvable committed fixture is INFRASTRUCTURE SIGNAL, recorded as failed_infrastructure
    with its cause. It is NEVER negative mathematical evidence and never counts toward the falsification
    criterion (AGENTS.md rule 5). Specifically: an unvectorized permutation study that exceeds the
    budget is an implementation defect reported as an infrastructure receipt, and the correct response
    is a reduced replicate count (declared minimum 100 per cell) reported AS a reduction, never a
    quietly smaller study presented as the planned one.'
