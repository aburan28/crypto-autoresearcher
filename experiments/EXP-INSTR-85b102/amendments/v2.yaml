protocol_amendment:
  experiment_id: EXP-INSTR-85b102
  version_from: 1
  version_to: 2
  filed_at: '2026-08-07'
  filed_by: coordinator (GOAL-ENDO-001, BATCH-aa267f)
  status: approved
  approved_by: coordinator
  approved_at: '2026-08-07'
  approval_note: >-
    Approved by the Coordinator after the user, having been shown
    RT-20260807-743198's verdict and the Coordinator's independent
    re-derivation of its central number, approved running CTRL-VALUESHUFFLE.
    THE DECISION RULE BELOW IS FROZEN FROM THIS COMMIT AND NO REPLICATE HAS BEEN
    DRAWN. Nothing in this file was written after seeing a shuffled null; the
    only numbers here are read from already-committed version-1 artifacts.
  applies_to: >-
    FUTURE RUNS ONLY. No version-1 run is re-scored, no raw artifact is altered,
    and the version-1 execution's results stand exactly as recorded
    (AGENTS.md rule 4). This amendment ADDS a control; it withdraws nothing.
  reason: >-
    EXP-INSTR-85b102's execution report attributes its non-monotone ladder
    verdicts to Monte-Carlo noise. CORR-20260807-732541 records that attribution
    as REFUTED, not merely unsupported: every cell already stores an EXACT
    closed-form null mean carrying zero Monte-Carlo error, and re-running the
    executor's own verdict rule on the exact ratio returns the identical
    non-monotone count -- 74 against 74, 138 of 138 comparable cells agreeing
    cell for cell, independently re-derived by the Coordinator. Setting the
    Monte-Carlo error to exactly zero changes nothing, so Monte-Carlo error
    cannot be the cause.

    REFUTING THE LABEL IS NOT EXPLAINING THE PHENOMENON, and the version-1
    contract contains no control that can. Two live explanations remain and the
    committed data cannot separate them, because it holds only ONE realization
    of the functional values: (i) a pure artifact of N-band blocking geometry
    acting on an arbitrary value multiset, in which case the contract's
    `what_non_decay_means` clause is mis-specified; or (ii) something specific
    to the m = 3 sum-set family, which reverses in 8 of 8 cells at both primes
    under both statistics. This amendment adds the null object that separates
    them.
  changes:
  - id: B1
    field: controls
    kind: addition
    to: >-
      CTRL-VALUESHUFFLE. The null object of the same shape: same curves, same
      traces, same N, same class sizes, same block partitions -- functional
      VALUES shuffled. Procedure, frozen: (1) read the committed per_curve.csv
      and rung_table.json of the four operative pool runs and change NOTHING
      about (trace, N) or the block assignment, so classes still lie inside
      blocks exactly as they do and the closed form stays exact; (2) permute the
      per-curve values of one functional uniformly at random across the whole
      pool, independently per functional per replicate, which destroys every
      value-class and value-N association while preserving the value multiset,
      the class sizes and the blocking geometry bit for bit; (3) recompute the
      ENTIRE ladder ratio sequence from `closed_form_null_mean` ALONE -- no
      permutation study, because the decisive quantity has an exact closed form;
      (4) report the null distribution of the type-A residue count and,
      separately, the per-functional residue indicator for the m = 3 family.
    rationale: >-
      This is the cheapest object that can separate the two explanations, and it
      is cheap precisely because of what the review established: B = 10000
      Monte-Carlo draws were ~all of the original study's cost and are not
      needed at all here.
  - id: B2
    field: stopping_rules
    kind: addition
    to: >-
      SR-B1 REPRODUCTION GATE, BLOCKING, RUNS FIRST. Before any replicate is
      drawn, re-derive the OBSERVED type-A residue count from the committed
      version-1 artifacts using the definition frozen below. If it is not 50 of
      144, STOP and report the discrepancy as the deliverable: the control's
      entire deciding number is the position of the observed value in the null,
      and a mis-transcribed observed value makes the comparison meaningless. Do
      NOT proceed to the shuffle on a failed gate, and do NOT adjust the frozen
      50 to match what is re-derived -- report both.
  - id: B3
    field: metrics
    kind: addition
    to: >-
      null distribution of the type-A residue count over the declared
      replicates; the two-sided empirical p-value of the observed count; the
      per-functional residue indicator for `sumset_m3` and `sumset_eff_m3`
      (observed 8 of 8 each) with its own null; and the realized wall clock and
      CPU seconds.
  definitions_frozen:
    type_A_reversal: >-
      An adjacent-pair reversal along the N ladder in which BOTH endpoints are
      non-degenerate, so T_obs cancels and the comparison is purely between two
      estimated null means. This is the residue that carries potential
      information.
    type_B_reversal: >-
      A reversal driven by the deterministic fact that T_obs exceeds its null
      mean at the last non-degenerate rung, by at most 1.2 null sd. Established
      by RT-20260807-743198 item 1 to carry no information; EXCLUDED from the
      statistic.
    residue_count: >-
      The number of cells (of 144) exhibiting at least one type-A reversal.
      OBSERVED VALUE, READ FROM COMMITTED VERSION-1 ARTIFACTS BEFORE ANY
      REPLICATE: 50.
    denominator_note: >-
      144 is the full cell count. The Coordinator's own recount found 138
      COMPARABLE cells, the six-cell difference being those with no closed-form
      value -- the same six RT-20260807-743198 independently identified as
      scored `MONOTONE RISE` vacuously (`all()` over an empty list at
      harness/run_blocknull.py:1551-1552). The run MUST report the residue count
      against both denominators and state which the decision rule used. The rule
      below uses whichever denominator the reproduction gate reproduces 50
      against; if 50 reproduces against neither, SR-B1 fires.
  frozen_decision_rule:
    statistic: >-
      Two-sided empirical p-value of the observed type-A residue count in the
      shuffled null, computed as (1 + #{replicates at least as extreme}) /
      (1 + n_replicates), extremeness measured as |x - median(null)|.
    state_0_INVALID:
      fires_when: >-
        SR-B1's reproduction gate fails; or any shuffled replicate alters a
        (trace, N) pair, a class size, or a block assignment; or any recomputed
        closed form loses its `exact` applicability.
      meaning: Not evidence. Returns with the concrete defect.
    state_1_CONTROLLED_NULL:
      fires_when: p > 0.05.
      meaning: >-
        The residue is a pure artifact of N-band blocking geometry acting on an
        arbitrary value multiset, with NO ARITHMETIC CONTENT. Consequence, and
        it is not small: the contract's `what_non_decay_means` clause must be
        restricted to functionals with a declared minimum association to N, and
        every reading anywhere in this campaign that treats a non-rising R as an
        unnamed-nuisance tell must be re-read against that restriction.
    state_2_STRUCTURE_PRESENT:
      fires_when: p <= 0.05.
      meaning: >-
        The reversal pattern depends on WHICH curve carries which value, not
        merely on the blocking geometry. RT-20260807-743198 item 3f localises
        the candidate: the m = 3 sum-set family, at both primes, both
        statistics, all four pools. That becomes a specific, small, testable
        object rather than a diffuse anomaly. IT REMAINS AN INSTRUMENT FINDING
        AT TOY SCALE and licenses no claim about isogeny-class structure or
        ECDLP cost.
    asymmetry_declared: >-
      state_1 is a POSITIVE finding about the instrument and state_2 is NOT a
      finding about mathematics. Neither outcome supports any GOAL-ENDO-001
      hypothesis. A `p > 0.05` result means NO STRUCTURE DETECTED at this
      replicate count, never "no structure exists": with 200 replicates the
      resolution floor is 1/201 = 0.00498, and the design's power against a
      small effect is not characterised.
    evidence_strength_cap: >-
      Any evidence record arising from this control is capped at `preliminary`
      and `claim_tier: toy` regardless of outcome. Under AGENTS.md rule 12 the
      contradiction between a validated execution report and an independent
      review already requires further independent review before ANY evidence
      record is written from this line of work.
  parameters_frozen:
    replicates: 200
    seeds:
    - 20260807
    - 20260808
    - 11235813
    pools:
    - POOL_A
    - POOL_B
    - POOL_C
    - POOL_D
    source_runs:
    - RUN-INSTR-85b102-poolA-c
    - RUN-INSTR-85b102-poolB-b
    - RUN-INSTR-85b102-poolC
    - RUN-INSTR-85b102-poolD
    permutation_study: >-
      NONE. B is not a parameter of this control. The closed form is exact and
      is the only null used.
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 1
    maximum_memory_gb: 4
    maximum_runs: 6
    budget_note: >-
      RT-20260807-743198 measured 0.631 ms per closed-form call at n = 1464
      (weighted), 768 calls per replicate, 153,600 calls at 200 replicates --
      about 1.6 CPU-minutes, under 10 CPU-minutes in total. The 1 CPU-hour
      budget is roughly six times the measured requirement and exists so a
      re-run or a superseding run does not breach it. No curve is re-enumerated,
      no functional re-measured, and no frozen function touched.
  invalidation_rules:
  - A shuffle that alters any (trace, N) pair, class size or block assignment -> INVALID.
  - Any recomputed closed form losing `exact` applicability -> INVALID.
  - >-
    Any frozen harness function modified -> INVALID. The eleven functions frozen
    by version 1 remain frozen and a zero-behavioural-change diff is still
    required.
  - >-
    A timeout, crash or OOM -> status failed_infrastructure, retained with
    partial artifacts, NEVER negative evidence (AGENTS.md rule 5).
  required_artifacts:
  - experiments/EXP-INSTR-85b102/runs/<RUN-ID>/manifest.yaml (with code.source pins, N6)
  - experiments/EXP-INSTR-85b102/runs/<RUN-ID>/raw-result.json
  - experiments/EXP-INSTR-85b102/runs/<RUN-ID>/reproduction-gate.json
  - experiments/EXP-INSTR-85b102/runs/<RUN-ID>/valueshuffle-null.json
  - experiments/EXP-INSTR-85b102/runs/<RUN-ID>/decision-rule-evaluation.json
  - experiments/EXP-INSTR-85b102/runs/<RUN-ID>/frozen_function_diff.txt
  - command.txt, environment.json, stdout.log, stderr.log
  affected_runs:
  - >-
    NONE ARE RE-SCORED. All 13 version-1 run directories are retained unchanged.
    The version-1 execution report's non-monotonicity ATTRIBUTION is corrected
    by CORR-20260807-732541; its measurements are not touched.
  confirmatory_status: exploratory_only
  confirmatory_status_note: >-
    Exploratory, and the honest label. The observed value (50 of 144) and the
    m = 3 family's 8-of-8 pattern were both known before this rule was frozen --
    they are read from committed artifacts and are what motivated the control at
    all. What is NOT known, and cannot be, is where the observed value falls in
    a null that has never been drawn. That is the entire deciding quantity and
    it is frozen here before a single replicate exists.
  what_this_amendment_does_not_do:
  - >-
    It does not withdraw any version-1 result. The S1 gate, the frozen-function
    receipt, CTRL-NULLOBJ's 28/28 calibration and the pre-registered
    twist-blocking contradiction all stand.
  - >-
    It does not fix the vacuous-`all()` verdict at run_blocknull.py:1551-1552.
    That defect is conservative and is recorded in CORR-20260807-732541; fixing
    it in a way that re-scores a run would need its own amendment.
  - >-
    It authorizes this control and nothing else. It is not a re-run of the
    version-1 ladder and not a new pool.
  refs:
  - GOAL-ENDO-001
  - BATCH-aa267f
