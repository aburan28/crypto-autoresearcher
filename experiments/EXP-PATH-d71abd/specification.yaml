experiment:
  id: EXP-PATH-d71abd
  hypothesis_id: H-PATH-89d1d0
  question_id: RQ-RELN-001
  goal_id: GOAL-PATH-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Nearby-object control for the bounded-degree algebraic factor-base no-go:
    compute the coverage exponent chi and the description density delta for the
    two index-calculus families where the hoped-for conclusion is known FALSE
    (NFS and Gaudry/Diem) alongside the family the theorem covers, with a
    matched random-subset null that establishes chi = 1 is necessary and not
    sufficient. STAGE 1 is zero compute and can end the line.

  objective: >-
    Determine whether the operative separating predicate of the bounded-degree
    algebraic factor-base theorem, and hence of the open universal question
    KN-OPEN-020, is "algebraic description" or the single scalar
    chi = m*log(Delta)/log(N); supply the nearby-object control that
    inventor-protocol section 8 audit 4 requires and that KN-OPEN-020 has never
    had; and quantify the description-cost charge that KN-OPEN-020's own text
    demands ("with all description, membership, relation, descent, time, and
    memory costs charged") and that no record in this corpus has levied.

  what_this_is_not:
    - Not an ECDLP attack, an algorithm, a factor-base construction, a relation collection, a decomposition search, or a discrete-logarithm computation.
    - Not a claim that the bounded-degree theorem is wrong, defective, or superseded. Its hypothesis correctly excludes both nearby objects; there is no contradiction and none is asserted.
    - Not a closure of KN-OPEN-020, and not a proof that a universal no-go is impossible. A confirming outcome RESTATES the open question on a different quantifier and leaves it open and strictly harder.
    - Not an endorsement, grading, or ranking of the three named escapes. Naming them is the forward guidance the inventor protocol requires, not a claim that any is promising.
    - Not an implementation of NFS, of Gaudry/Diem, or of any sieve. No paper for either was read; both are stated from their definitions.
    - Not an exponent, cost, crypto-scale, or deployed-scheme claim, and not evidence. No run has happened.
    - Not an execution of GOAL-ICEX-001, GOAL-RELN-001, or GOAL-SDEG-001, and not a consumption of any feed package. Those goals' non-execution pins are untouched.

  claim_ceiling:
    tier: toy
    tier_note: >-
      TWO TIERS ARE PRESENT AND ARE NOT CONFLATED. The counting statements
      (Theorem 1G's hypothesis equals chi <= 1-epsilon; chi_NFS = 1 under the
      declared arity attribution; chi_GaudryDiem = 1; chi -> 0 for bounded
      degree; delta >= (d/6) log2 p) are DERIVATIONS and carry derivation tier.
      Every MEASURED cell - the smoothness enumeration at M <= 2^24, the
      exhaustively enumerated (q,n) curves with q^n < 1000, the Bezout check on
      explicit toy predicates - is TOY and may not be raised. The record's
      declared claim_tier is toy, which is the ceiling on the measurements; the
      derivations are labelled separately at every citation.
    exact_scope_a_run_could_support: >-
      At most: the equivalence of the theorem's hypothesis with chi <= 1-epsilon;
      the values of chi and delta for the four declared families under the
      declared conventions; that Bezout's |F| <= 3d holds on the tested toy
      predicates; that the Gaudry subfield base and a size-matched random subset
      have comparable coverage at the tested cells; and that KN-OPEN-020's
      universal statement is false as quantified over "algebraically described".
      A run CANNOT support any statement about decomposition-search cost,
      membership-evaluation cost, linear algebra, relation rank, ECDLP hardness,
      the viability of any escape, or anything at crypto scale.

  inputs:
    smoothness_M_log2: [20, 24]
    smoothness_B_grid: [16, 32, 64, 128, 256, 512, 1024]
    gaudry_cells: [[5, 3], [7, 3], [11, 2], [13, 2]]
    bezout_degrees: [1, 2, 5, 10, 30, 100]
    chi_cells_symbolic: [[2, 10, 64], [3, 10, 64], [4, 30, 256], [2, 100, 256]]
    null_seed_count: 20
    master_seed: 20260805
    domain: EXP-PATH-d71abd/v1
    seed_derivation_rule: >-
      Every random quantity is derived deterministically as
      int(SHA256(ascii(domain || "|" || label || "|" || decimal(cell_index) ||
      "|" || decimal(counter)))) interpreted big-endian unsigned, with label in
      {"null-subset", "toy-prime", "toy-curve-a", "toy-curve-b",
      "plane-predicate"} and the counter advancing by exactly one per digest.
      The random null subset at a cell is drawn by taking successive digests mod
      the group order and rejecting repeats, in that order, until the target
      cardinality is reached. A third party reproduces every instance
      bit-for-bit from this rule alone.
    field_extension_construction: >-
      F_{q^n} is built as F_q[t]/(g) for the LEXICOGRAPHICALLY FIRST monic
      irreducible g of degree n over F_q under the ordering of coefficient
      vectors read from the constant term upward. The chosen g is RECORDED
      EXPLICITLY in the artifacts, because chi depends on |F| and |F| depends on
      the model of the field only through the subfield embedding, which must be
      exhibited rather than assumed.
    curve_selection_per_cell: >-
      For each (q,n), scan (a, b) in F_{q^n}^2 in the induced lexicographic
      order and take the first pair with nonzero discriminant for which the
      subfield factor base F = {P in E : x(P) in F_q} is nonempty. #E(F_{q^n})
      and F are obtained by EXHAUSTIVE ENUMERATION over all affine points plus
      the point at infinity - no point-counting algorithm is used and none is
      trusted.
    environment_measured_this_session: >-
      In this container `import numpy` SUCCEEDS at version 2.4.6 and
      `import sage` FAILS with ModuleNotFoundError. THIS CONTRACT REQUIRES
      NEITHER and must run in pure Python with the standard library alone. The
      ANGLE-BRIEF records two scouts disagreeing about this container's
      dependencies; the measurement above is this session's own.

  independent_variables:
    - smoothness bound B (NFS arm)
    - target size M (NFS arm)
    - the pair (q, n) (Gaudry arm)
    - plane predicate degree d (Bezout control and the bounded-degree arm)
    - factor-base construction: subfield versus uniformly random (Gaudry arm)

  metrics:
    primary:
      - id: M1
        name: chi_NFS
        definition: >-
          m_hat * log(pi(B)) / log(M), with m_hat the MEASURED mean number of
          prime factors with multiplicity of B-smooth integers in (M/2, M],
          reported alongside the definitional value u = log(M)/log(B) so the
          modelling choice is visible rather than buried.
      - id: M2
        name: chi_GaudryDiem
        definition: >-
          n * log(|F|) / log(N) from EXHAUSTIVELY ENUMERATED |F| and
          N = #E(F_{q^n}), per (q,n) cell. No cardinality is assumed.
      - id: M3
        name: chi_bounded_degree
        definition: >-
          m * log(3d) / log(N) at the declared symbolic cells, plus the degree
          d* solving chi = 1 at log2 N = 256 with m = 4.
      - id: M4
        name: delta
        definition: >-
          Description bits per factor-base element: C(d+2,2)*log2(p) / |F| for a
          plane predicate of degree d (using the ENUMERATED |F|, not the Bezout
          bound, so delta is not flattered); O(log B)/pi(B) for NFS;
          O(log q)/|F| for Gaudry. The description convention for each family is
          written out and fixed before any number is computed.
    secondary:
      - id: M5
        name: psi_ratio
        definition: log(Psi(M,B))/log(M) from exact enumeration, per (M,B).
      - id: M6
        name: arity_distribution
        definition: >-
          The full empirical distribution (not only the mean) of the number of
          prime factors with multiplicity of B-smooth integers in (M/2, M].
      - id: M7
        name: coverage_fraction
        definition: >-
          |mF| / N by exhaustive enumeration of the m-fold sumset, for the
          subfield base and for each of the 20 random null subsets, per cell.
      - id: M8
        name: bezout_margin
        definition: >-
          3d - |F| for each explicit plane predicate, which must be >= 0 at
          every degree.
      - id: M9
        name: memory_charge
        definition: >-
          delta * |F| in bits - the storage a factor base of the given
          description would require - reported for all four families, since
          KN-OPEN-020 demands memory be charged and no record has done so.

  heuristic_under_test: HEUR-CHI-3
  heuristic_under_test_note: >-
    HEUR-CHI-3 (the arity attribution m = u for NFS) is the load-bearing
    modelling choice and is tested directly by M1 against M6. HEUR-CHI-1 (the
    Dickman-based statement log Psi/log M -> 1) is tested by M5. HEUR-CHI-2 (the
    balls-in-bins prediction for the random null) is tested by M7. All three are
    named on the hypothesis; none is assumed silently, and the Dickman
    asymptotic is explicitly RECALLED, UNVERIFIED rather than cited.

  preregistered_prediction:
    quantity: chi for each of the four declared families.
    formula: >-
      chi = m log(Delta)/log(N). PREDICTED VALUES, FIXED BEFORE ANY RUN:
      chi_NFS = 1.000 exactly and independent of B; chi_GaudryDiem = 1.000
      +/- 0.05 at every (q,n) cell (tolerance covering the Hasse deviation of
      #E from q^n and of |F| from q at q^n < 1000); chi_bounded_degree =
      0.1533 / 0.2300 / 0.1014 / 0.0643 at (m,d,log2 N) = (2,10,64) / (3,10,64)
      / (4,30,256) / (2,100,256); and d* >= 2^64/3, i.e. log2 d* >= 62.4.
    source: >-
      H-PATH-89d1d0 mechanism STEPS 2-5, derived in-record from Theorems 1, 1G
      and 2 of ideas/artifacts/IDEA-20260801-021/
      bounded_degree_factor_base_theorem.md (READ IN FULL) and from the
      definition of B-smoothness. The bounded-degree values were SCOUT-COMPUTED
      in this session outside the harness and MUST be re-derived in-harness at
      Stage 1.
  second_preregistered_prediction:
    quantity: M7, the coverage fraction, subfield base versus random null.
    formula: >-
      |mF|/N ~ 1 - exp(-|F|^m / N) for BOTH arms, hence BOTH above 0.3 wherever
      |F|^m >= N and the two agreeing within a factor of 2. THE PREDICTION IS
      THAT THEY AGREE. Agreement is what establishes chi measures coverage and
      NOT usefulness, and it is registered here so that the limit is on the
      record before chi is cited anywhere.
    source: H-PATH-89d1d0 HEUR-CHI-2, balls-in-bins, labelled a heuristic.

  arms_and_controls:
    treatment: >-
      The chi and delta computation for the bounded-degree plane-predicate
      family - the family the theorem covers - at the declared symbolic cells
      and at the explicit toy predicates.
    measured_null: >-
      THE UNIFORMLY RANDOM SUBSET. At each (q,n) cell, draw 20 independent
      uniformly random subsets R of the group with |R| = |F| (the enumerated
      subfield base size) and use the same arity m = n. FORCED VALUES DERIVED
      BEFORE THE RUN: chi(R) = chi(F) EXACTLY, because chi depends only on
      cardinalities; and |mR|/N ~ 1 - exp(-|R|^m/N). THIS NULL CAN FAIL IN TWO
      DIRECTIONS AND BOTH ARE INFORMATIVE. If |mR|/N falls far below the
      balls-in-bins prediction, the sumset of a random subset is structured and
      the counting is wrong. If it comes out comparable to the subfield base -
      which is what is predicted - then chi is CONFIRMED to measure coverage
      only, and that limit must be carried permanently by every record citing
      chi. The null exists to bound the claim, not to support it.
    positive_control_1: >-
      BEZOUT, ON MY OWN READING OF THE INTERFACE. For each explicit plane
      predicate of degree d on an explicit toy prime-field curve, enumerate F
      exhaustively and check |F| <= 3d. THIS MUST HOLD - it is Bezout. A
      violation at any degree means the interface has been misread and NO
      CONCLUSION MAY BE REPORTED AT ALL. Threshold declared before the run:
      M8 >= 0 at every one of the six degrees.
    positive_control_2: >-
      THE GAUDRY SUBFIELD BASE, WHERE THE EFFECT MUST APPEAR. It is a
      construction that is known to function as index calculus, so its chi MUST
      come out at 1.000 +/- 0.05 and its coverage MUST reach a constant fraction
      of the group at every cell where |F|^n >= N. IF IT DOES NOT, THE
      ENUMERATION CODE IS BROKEN AND NO NEGATIVE ABOUT THE BOUNDED-DEGREE FAMILY
      MAY BE REPORTED. This is the nearby-object control inventor-protocol
      section 8 audit 4 requires, run rather than described.
    positive_control_3: >-
      THE THEOREM'S OWN SLICE, ZERO COMPUTE. Substituting Delta^m = N^chi into
      Theorem 3 must reproduce Pr[T in mF] <= 2^C N^{chi-1}, i.e. Theorem 3
      verbatim after taking logarithms. This is the baseline-reproduction check
      and it is exact, not a resemblance.
    graded_control_1: >-
      SIX INTERIOR POINTS, MONOTONICITY REPORTED. Sweep the plane-predicate
      degree d over {1, 2, 5, 10, 30, 100} at fixed m and fixed log2 N = 256 and
      report chi(d) and delta(d) side by side. PREDICTED: chi rises as
      m log(3d)/log N - LOGARITHMICALLY - while delta rises as (d/6) log2 p -
      LINEARLY. The gap between a logarithmic gain and a linear cost IS the
      mechanism, and it is displayed as a monotone table rather than asserted.
    graded_control_2: >-
      FOUR INTERIOR POINTS ON THE PARAMETER MEANT TO DESTROY THE EFFECT. Sweep
      (q,n) so that |F|^m/N varies across the cells, and report chi and coverage
      as functions of it. PREDICTED: chi FLAT at 1.00 while coverage rises
      monotonically. A chi that drifts with the cell localises an error in the
      cardinality identification instead of leaving "it did not work".
    graded_control_3: >-
      SEVEN INTERIOR POINTS ON B. Sweep the smoothness bound B over
      {16,32,64,128,256,512,1024} at fixed M and report chi_NFS and
      log Psi/log M. PREDICTED: chi_NFS FLAT at 1.000, B-INDEPENDENT. Any drift
      falsifies the arity attribution, which is HEUR-CHI-3 and the record's
      weakest link.
    ordering_control: >-
      The null arm (random subsets) is enumerated, measured and hash-committed
      BEFORE the subfield treatment arm is examined at any cell, and the
      pre-registered balls-in-bins band is committed before either. If the
      decision rule emits the same label on the null and on the subfield base -
      which is what is PREDICTED for coverage - that agreement must be recorded
      as the finding it is, not treated as a failed discrimination.
    comparability_policy: >-
      Cross-contract comparison to any SDEG, RELN, DREG, SEMAEV or ICEX artefact
      is FORBIDDEN. This contract shares no fixture, no seed stream, and no
      cost schema with any of them. Comparison may be made only by a separately
      registered comparator contract naming both domains and the statistic.

  scale_relevance:
    tier: toy
    justification: >-
      The chi and delta statements are COUNTING IDENTITIES that do not depend on
      scale, so the toy cells CHECK a derivation rather than extrapolate one -
      which is why the (q,n) cells with q^n < 1000 are admissible for this
      purpose and would not be admissible for a cost claim. What is genuinely
      scale-limited: the smoothness enumeration reaches only M <= 2^24, so the
      measured log Psi/log M is far from its asymptotic value and is reported as
      a finite-M measurement against the model, never as a confirmation of the
      asymptotic; and the Hasse deviation at q^n < 1000 is a large relative
      perturbation, which is exactly why the chi tolerance is +/- 0.05 rather
      than exact.
    correspondence: >-
      null. Every object is constructed and enumerated directly. No
      correspondence trick is used and none is claimed.

  tail_checks:
    - >-
      The MAXIMUM number of prime factors observed among B-smooth integers is
      compared against log_2 M, the absolute ceiling. An observation above it is
      an implementation error, not a finding.
    - >-
      The smallest observed |mR| over the 20 null seeds is compared against the
      lower tail of the balls-in-bins prediction; a systematic deficit in the
      tail is reported as evidence against HEUR-CHI-2 rather than absorbed.
    - >-
      The Bezout margin 3d - |F| is checked for degrees where the predicate is
      nearly tangent to the curve, since near-tangency is where a
      misunderstanding of intersection multiplicity would first show.

  replication:
    seeds: [20260805, 20260806, 20260807]
    independent_instances: 3
    seed_note: >-
      Seeds regenerate the null subsets and the toy plane predicates. The
      Gaudry cells, the field models, and the smoothness enumeration are
      DETERMINISTIC and identical across seeds by construction; a
      seed-dependence in any of them is an implementation error and is reported
      as one.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 2
    maximum_memory_gb: 2
    maximum_runs: 9
    stage_budgets:
      stage1_wall_clock_seconds: 3600
      stage1_compute: zero; pen-and-paper plus exact integer arithmetic on symbolic cells
      stage2_wall_clock_seconds: 600
      stage3_wall_clock_seconds: 1800
    budget_note: >-
      Enumerating B-smooth integers to 2^24 by sieve is seconds in pure Python;
      enumerating E(F_{q^n}) with q^n < 1000 and its n-fold sumset is
      milliseconds. If the M = 2^24 cell does not fit, the run reports the
      M = 2^20 cell and says so.

  stopping_rules:
    - >-
      SR1 (STAGE 1, TERMINAL, ZERO COMPUTE): if chi_NFS is not 1 under the
      declared arity attribution, or if Theorem 1G's hypothesis is not
      equivalent to chi <= 1-epsilon, STOP. The rewrite or the witness is wrong
      and the line ends for free. THIS STAGE RUNS FIRST AND CAN TERMINATE THE
      WHOLE CONTRACT.
    - >-
      SR2: if positive control 1 (Bezout, |F| <= 3d) fails at any degree, STOP.
      The interface has been misread and nothing may be reported.
    - >-
      SR3: if positive control 2 (Gaudry chi and coverage) fails at any cell,
      STOP. The enumeration is broken and no negative may be reported.
    - >-
      SR4: if the null's measured coverage falls outside the pre-registered
      band, STOP and re-derive the null's forced value before the treatment arm
      is interpreted.
    - >-
      SR5: the run reports what it covered. A truncated B grid or a dropped
      (q,n) cell is reported as truncated with the achieved cells listed, never
      as a completed sweep.

  invalidation_rules:
    - >-
      Any change to the arity attribution, the description conventions, the B
      grid, the (q,n) cells, the degree sweep, or the tolerance bands after any
      Stage-2 or Stage-3 number has been observed requires a versioned protocol
      amendment with confirmatory_status exploratory_only, and is never an edit.
    - >-
      Computing delta from the BEZOUT BOUND 3d rather than from the ENUMERATED
      |F| is invalidating: it would flatter the bounded-degree family's
      description density by using an upper bound on the denominator.
    - >-
      Any claim about NFS or Gaudry/Diem complexity, as opposed to their
      cardinalities, is out of scope; a report that makes one is invalid,
      because no paper for either was read.
    - >-
      Selecting the arity attribution after seeing which one yields chi = 1 is
      invalidating. The attribution m = u is fixed here, before any run, and the
      measured arity distribution M6 is reported ALONGSIDE it rather than
      substituted for it.

  infrastructure_failure_disposition: >-
    A timeout, crash, out-of-memory, or missing dependency is INFRASTRUCTURE
    SIGNAL AND IS NEVER NEGATIVE MATHEMATICAL EVIDENCE (AGENTS.md rule 5).
    Specifically: if the M = 2^24 smoothness enumeration exceeds memory, the
    correct outcome is a reported M = 2^20 result, NOT a conclusion that
    log Psi/log M does not approach 1. If a (q,n) cell cannot be enumerated, it
    is dropped and reported as dropped. No infrastructure outcome may be cited
    for or against H-PATH-89d1d0, and none may be cited as evidence about
    KN-OPEN-020.

  success_criterion: >-
    DECIDABLE, WITH A REACHABLE NEGATIVE. Exactly one of three branches is
    emitted; none is a failure.
    BRANCH CONFIRMED: (a) Stage 1 verifies the equivalence and returns
    chi_NFS = 1.000 flat across the whole B grid; AND (b) chi_GaudryDiem =
    1.000 +/- 0.05 at every enumerated cell (positive control 2 PASSED); AND
    (c) Bezout holds at every tested degree (positive control 1 PASSED); AND
    (d) delta separates the families by at least 6 orders of magnitude at the
    256-bit cell; AND (e) the random-subset null's coverage agrees with the
    subfield base within a factor of 2, establishing the necessary-not-
    sufficient limit. THE DELIVERABLE IS: the four-family (chi, delta, memory
    charge) table; the explicit statement that KN-OPEN-020's universal claim is
    FALSE AS QUANTIFIED over "algebraically described", with NFS as the witness
    and with the explicit note that the THEOREM is not contradicted; the
    restated open question quantified over chi with membership and decomposition
    charged; and the three named escapes, ungraded.
    BRANCH REFUTED: chi_NFS is not 1, or the equivalence fails, or delta does
    not separate. The deliverable is the exact statement of which half failed,
    a superseding record withdrawing the corresponding claim, and the note that
    the other half may still stand.
    BRANCH INSTRUMENT-BROKEN: a positive control fails. NOTHING SUBSTANTIVE IS
    REPORTED; the deliverable is the control failure and its diagnosis.
    EVERY BRANCH MUST ALSO EMIT: the necessary-not-sufficient statement with its
    null-object evidence, and FORWARD GUIDANCE naming what remains open. A
    branch emitted without the forward guidance HAS NOT FINISHED, because a
    count of evaluated families is a fatigue report and not a closure
    (docs/inventor-protocol.md section 4).

  falsification_criterion: >-
    F1 (ZERO COMPUTE, PRIMARY): chi_NFS != 1 under the declared attribution, or
    Delta^m <= N^{1-epsilon} is not equivalent to chi <= 1-epsilon. The central
    comparison fails and the hypothesis is withdrawn by superseding record.
    F2 (POSITIVE CONTROL): |F| > 3d on any explicit toy plane predicate - the
    interface was misread and nothing may be reported.
    F3 (POSITIVE CONTROL): the Gaudry cell returns chi outside 1.000 +/- 0.05,
    or its coverage does not reach a constant fraction - the enumeration is
    broken and no negative about the bounded-degree family may be reported.
    F4 (NULL): the random null's coverage falls outside the pre-registered
    balls-in-bins band - the null's forced value was wrong and the treatment arm
    may not be interpreted until it is re-derived.
    F5: delta fails to separate the families - the description-density half is
    dead and the report must say it is claiming only the chi rewrite.
    F6: an algebraically described prime-field factor base with chi -> 1 and
    polylogarithmic delta is exhibited - the description-density claim is
    refuted outright, and that is the most valuable outcome available here.

  required_artifacts:
    - the Stage-1 derivation, written out and independently checked, of the chi equivalence and of the delta bound
    - the in-harness re-derivation of the four bounded-degree chi cells and of d*, superseding the SCOUT-COMPUTED values
    - the four-family table of chi, delta, and memory charge delta*|F|, with every cardinality's provenance stated
    - the smoothness enumeration output: Psi(M,B), the full arity distribution M6, and chi_NFS per B, with M and the sieve method recorded
    - per-(q,n) records: the irreducible polynomial g, the curve (a,b), #E(F_{q^n}), the enumerated F, |mF|, and their SHA-256
    - the 20 random-null subsets per cell with their seeds, their |mR|, and the pre-registered band committed before they were drawn
    - the Bezout control table: d, the explicit predicate, the enumerated |F|, and the margin 3d - |F|
    - the graded-control tables for d, for (q,n), and for B, with monotonicity stated
    - a one-page restatement of KN-OPEN-020 quantified over chi, with the three named escapes and their structural reasons, explicitly ungraded
    - the environment record: python version, numpy importability, sage importability, verbatim

  blocking_nulls:
    - >-
      This contract was written by an agent with no authority to approve it. All
      instrument paths and SHA-256 values are to be recorded by the Executor at
      setup; this record does not compute or assert them.
    - >-
      NO NFS OR GAUDRY/DIEM PAPER WAS READ IN THE SESSION THAT WROTE THIS. Both
      constructions are stated from their definitions so that a reviewer can
      reject the identification directly, and no complexity claim about either
      is load-bearing anywhere in this contract.
    - >-
      The Dickman asymptotic for Psi(M,B) is RECALLED, UNVERIFIED. It is
      measured here at toy M, not cited.
    - >-
      The four bounded-degree chi values and d* quoted in
      preregistered_prediction were computed in a scratch interpreter outside
      the harness. They are SCOUT-COMPUTED, are not a run, and must be
      re-derived in-harness at Stage 1.

  assigned_to: executor
  approved_by: null
  approval_note: >-
    Deliberately null and MUST remain null until a Coordinator approves.
    AGENTS.md rule 1 gives this field exactly one legitimate value and this
    contract is status review_required.

