    external_references:
      rule: >-
        External literature enters only as the claims recorded about it in
        the pinned corpus records (retrieval date 2026-07-23 as recorded in
        the pinned BATCH-005 candidate report literature_deduplication
        section). No live retrieval is performed. Any voluntary re-retrieval
        is informational only, must be pinned by URL, version, retrieval
        date, and content hash in the run manifest, and may not change any
        verdict.
      items:
        - {id: galbraith_gaudry_survey, url: https://eprint.iacr.org/2015/1022, recorded_retrieval_date: '2026-07-23', note: recorded URL of KN-LIT-006; DOI 10.1007/s10623-015-0146-7}
        - {id: petit_kosters_messeng_pkc2016, url: https://doi.org/10.1007/978-3-662-49387-8_1, recorded_retrieval_date: '2026-07-23', note: recorded DOI of KN-LIT-025}
        - {id: mcguire_mueller_2017_1262, url: https://eprint.iacr.org/2017/1262, recorded_retrieval_date: '2026-07-23'}
        - {id: mahalanobis_lineage_zero_minor, url: https://arxiv.org/abs/2607.09814v1, recorded_retrieval_date: '2026-07-23'}
        - {id: dinur_golovnev_3sum_indexing, url: https://arxiv.org/abs/2512.04258, recorded_retrieval_date: '2026-07-23'}
        - {id: kasliwal_polak_sharma, url: https://arxiv.org/abs/2410.16784, recorded_retrieval_date: '2026-07-23'}
        - {id: kirkpatrick_preprocessed_3sum, url: https://arxiv.org/abs/2602.11363, recorded_retrieval_date: '2026-07-23'}
        - {id: shoup_eurocrypt1997, url: https://doi.org/10.1007/3-540-69053-0_18, recorded_retrieval_date: '2026-07-23', note: KN-LIT-011}
        - {id: quantum_resource_reduction_excluded, url: https://arxiv.org/abs/2607.13816, recorded_retrieval_date: '2026-07-23', note: different computational model; excluded from classical screen}
    audit_item_index:
      group_a_dedup_and_exclusion:
        - {id: A1, name: OBL-ZR-COMPACT-CONSTRUCTOR-001 compact z_R interface, expected_owner: IDEA-20260723-001 / EV-CRYPTO-002}
        - {id: A2, name: defect-scaled hyperplane-signature / zero-minor interface, expected_owner: IDEA-20260723-002 / EV-CRYPTO-004}
        - {id: A3, name: first-order jets and free dual-number lifts, expected_owner: EV-JET-001 / EV-JETB-001 / P1547}
        - {id: A4, name: elliptic-net / EDS recurrence and translated-coordinate annihilator, expected_owner: EV-NET-001 / P1540}
        - {id: A5, name: incidence reporting and EC richness, expected_owner: EV-INC-001 / EV-INCB-001 / P1553}
        - {id: A6, name: BKK / mixed-volume elimination, expected_owner: EV-BKK-001 / EV-BKKMV-001}
        - {id: A7, name: arithmetic-progression displacement structure, expected_owner: EV-STR-001}
        - {id: A8, name: Edwards/model, factor-base-shape, and small-isogeny levers, expected_owner: EV-REP-001 / EV-REP-002 / EV-FB-001 / EV-ISO-001}
        - {id: A9, name: solver-free summation evaluation / prime-field decomposition backend, expected_owner: KN-LIT-025 / FINDING-PF-IC-001 / McGuire-Mueller screen}
      group_b_residual_open_problems:
        - {id: B1, name: SOURCE-LOCATOR-OPEN}
        - {id: B2, name: KN-OPEN-005}
        - {id: B3, name: KN-OPEN-004}
        - {id: B4, name: KN-OPEN-006}
        - {id: B5, name: KN-OPEN-001}
      group_c_literature_screen_records:
        - {id: C1, name: Galbraith-Gaudry 2016 survey class}
        - {id: C2, name: Petit-Kosters-Messeng PKC 2016 algebraic class}
        - {id: C3, name: McGuire-Mueller ePrint 2017/1262}
        - {id: C4, name: Mahalanobis-lineage zero-minor works (2018/2023/2025/arXiv:2607.09814v1)}
        - {id: C5, name: kSUM/3SUM preprocessing cluster (arXiv:2512.04258, arXiv:2410.16784, arXiv:2602.11363)}
        - {id: C6, name: Shoup EUROCRYPT 1997 generic lower bound}
        - {id: C7, name: arXiv:2607.13816 quantum resource reduction (different model)}
      item_count: 21
    frozen_admission_sheet:
      S1_rename_exclusion_z_R: >-
        The item is a support factor, fifth-label replay, compact resultant,
        common-factor update, or source dictionary of the IDEA-20260723-001
        interface: verdict reject_duplicate, owner IDEA-20260723-001 /
        EV-CRYPTO-002.
      S2_rename_exclusion_hyperplane: >-
        The item is a zero-minor, defect loop, normalized hyperplane-signature
        enumerator, or unnamed implicit minor locator of the
        IDEA-20260723-002 interface: verdict reject_duplicate, owner
        IDEA-20260723-002 / EV-CRYPTO-004. (EV-CRYPTO-004 is inconclusive,
        not a closure theorem: only an unchanged interface, unnamed locator,
        or backend substitution may be rejected here.)
      S3_closed_class_dedup: >-
        The item falls in a named toy-negative closed class: jets
        (EV-JET-001, EV-JETB-001, P1547), elliptic nets (EV-NET-001, P1540),
        incidence (EV-INC-001, EV-INCB-001, P1553), BKK/mixed volume
        (EV-BKK-001, EV-BKKMV-001), arithmetic-progression displacement
        (EV-STR-001), Edwards/model, factor-base, small-isogeny levers
        (EV-REP-001, EV-REP-002, EV-FB-001, EV-ISO-001), or solver-free
        summation backends (KN-LIT-025, FINDING-PF-IC-001): verdict
        reject_closed_class with the named owner.
      S4_explicit_operation: >-
        The item names an explicit public operation with typed inputs and
        outputs, coefficient provenance, occurrence-level signed source
        return, and identical masked-target use. An aggregate certificate,
        an unnamed oracle, a solver/backend substitution, or a residual
        description is not an operation: else verdict
        reject_no_explicit_operation.
      S5_complete_sub_rho_path: >-
        The item carries a complete charged ledger (preprocessing, relation
        probability and attempts, independently verified rank, factor-log
        linear algebra, blind descent, verification, bit time, memory) with
        total work exponent strictly below 0.50 and every term assigned; an
        unknown term is a failure, not a zero: else verdict
        reject_not_sub_rho. Secondary flag campaign_045 records whether
        lambda and mu are both at most 0.45.
      verdict_rule: >-
        ADMIT only if S1, S2, S3 do not trigger and S4 and S5 hold. Residual
        open-problem items (group B) receive verdict residual_open_problem
        with their frozen admission obligation and are not candidates.
        Undecidable predicates yield undecidable_with_reason, never a silent
        verdict.
    calibration_fixtures:
      - id: CAL-PASS-SCR-001
        kind: must_pass
        synthetic_fixture: true
        expected_verdict: ADMIT
        description: >-
          Synthetic typed-operation fixture with an explicit public operation,
          occurrence-level signed source return, and a complete declared
          ledger (lambda = 0.44, mu = 0.40, all terms assigned), distinct
          from every closed class by construction. It exists only to prove
          the sheet can emit ADMIT; it is excluded from the corpus
          admissibility table and is not evidence about H-SCR-001.
      - id: CAL-FAIL-SCR-001
        kind: must_fail
        synthetic_fixture: false
        expected_verdict: reject_duplicate
        description: >-
          The compact z_R interface record of item A1 (IDEA-20260723-001 /
          EV-CRYPTO-002), run through the sheet first; it must trigger S1.

  controls:
    - id: CTRL-CORPUS-INTEGRITY
      method: >-
        Every audited path is pinned to commit
        b8af1551e45fbe4435745239d29f4d141eea3356 with the embedded hash
        manifest; the run reads git blob content and records SHA-256 per file
        in corpus_manifest.json.
      pass_condition: zero missing paths and zero hash mismatches.
    - id: CTRL-SHEET-CALIBRATION
      method: >-
        Run the frozen sheet on CAL-PASS-SCR-001 and CAL-FAIL-SCR-001 before
        any corpus item is adjudicated.
      pass_condition: >-
        CAL-PASS-SCR-001 receives ADMIT and CAL-FAIL-SCR-001 receives
        reject_duplicate; any other outcome invalidates the run (instrument
        failure, not a scientific result).
    - id: CTRL-DEDUP-PRIOR-NEGATIVES
      method: >-
        Every rejected item must carry its duplicate-owner or closed-class
        assignment naming the prior negative (the EV-*, IDEA-*, or KN-*
        record) it duplicates.
      pass_condition: 100 percent owner coverage over rejected corpus items.
    - id: CTRL-REPLAY-DETERMINISM
      method: Apply the frozen sheet twice over the full item index.
      pass_condition: byte-identical admissibility tables on both passes.

  independent_variables:
    - audit_item_id: the 21 frozen corpus audit items (A1-A9, B1-B5, C1-C7).
    - calibration_fixture_id: the 2 frozen calibration fixtures.
    - sheet_predicate: S1 through S5 of the frozen admission sheet.

  metrics:
    primary:
      - admissible_candidate_count: number of corpus items with verdict ADMIT; success requires exactly 0.
      - table_completeness: fraction of the 21 corpus items receiving exactly one verdict plus an owner or residual assignment; must be exactly 1.0.
      - calibration_accuracy: fraction of the 2 calibration fixtures receiving their pre-declared verdicts; must be exactly 1.0 before corpus verdicts are read.
      - dedup_owner_coverage: fraction of rejected items with a named duplicate-owner record; must be exactly 1.0.
    secondary:
      - first_failed_predicate_per_item: S1-S5 for rejected items.
      - campaign_045_flag_count: items with lambda and mu both at most 0.45 among any admitted (expected none).
      - residual_frontier_entries: the recorded residual open problems with their frozen admission obligations.
      - undecidable_items: count and reasons; must be 0 for success.
      - corpus_hash_mismatch_count: must be 0.
      - wall_clock_and_memory_per_stage.

  heuristic_under_test: null
  preregistered_prediction:
    quantity: admissible_candidate_count over the 21 frozen corpus items
    formula: >-
      count of items with (not S1) and (not S2) and (not S3) and S4 and S5,
      where S5 requires a complete charged ledger with total work exponent
      strictly below 0.50 and no unassigned term.
    source: >-
      Scoped-absence claim of IDEA-20260723-003 as recorded in the pinned
      BATCH-005 candidate report and EV-CRYPTO-005; threshold convention from
      KN-TECH-005 / KN-LIT-011 (rho at exponent 0.50).
  scale_relevance:
    tier: toy
    justification: >-
      The sheet predicates are static and scale-independent in form, but the
      conclusion is scope-bounded to the checked frozen snapshot and rests on
      toy-tier prior evidence records; no medium or cryptographic claim is
      authorized in either direction.
    correspondence: null
  tail_checks:
    - >-
      Dual-pass consistency: the sheet is applied twice over all 21 items;
      any verdict flip between passes is recorded and invalidates the run.
    - >-
      Residual-frontier completeness: the residual table must carry
      SOURCE-LOCATOR-OPEN, KN-OPEN-005, KN-OPEN-004, KN-OPEN-006, and
      KN-OPEN-001 with their frozen admission obligations; a missing entry
      blocks the success verdict.

  replication:
    seeds: []
    seed_policy: deterministic audit, no randomness.
    independent_instances: 21
    independent_instances_note: >-
      The 21 frozen corpus audit items are the distinct candidate
      families/routes/sources audited; the sheet and snapshot are fixed.
    planned_runs:
      - id: RUN-SCR-001-A
        purpose: >-
          Materialize and verify the corpus hash manifest; run the two
          calibration fixtures through the frozen sheet; abort as invalid if
          calibration is not 2/2.
      - id: RUN-SCR-001-B
        purpose: >-
          Adjudicate group A (9 dedup/exclusion items) and group B (5
          residual open problems), recording verdicts, first failed
          predicates, and owner assignments.
      - id: RUN-SCR-001-C
        purpose: >-
          Adjudicate group C (7 literature screen records), run the
          determinism replay over all items, build the residual frontier
          table, and emit the admissibility decision table.
    expected_run_count: 3

  budget:
    wall_clock_seconds_per_run: 1800
    total_wall_clock_seconds: 4200
    total_cpu_hours: 1.2
    maximum_memory_gb: 4
    maximum_runs: 3
    stages:
      - id: freeze_and_calibrate
        wall_clock_seconds: 900
        stop_rule: >-
          Stop and mark the run invalid if the corpus manifest mismatches or
          if either calibration fixture misses its pre-declared verdict.
      - id: adjudicate_groups_a_b
        wall_clock_seconds: 1800
        stop_rule: >-
          Stop with the run inconclusive (not negative) if any item's
          predicate cannot be decided from the pinned record; record
          undecidable_with_reason for that item.
      - id: adjudicate_group_c_and_aggregate
        wall_clock_seconds: 1500
        stop_rule: >-
          Stop without issuing a verdict if any required artifact
          (admissibility table, corpus manifest, calibration receipt) is
          incomplete.

  stopping_rules:
    - Stop after the three planned runs; no exploratory fourth run and no new corpus items without a versioned amendment.
    - >-
      No live external retrieval; newly discovered sources are out of scope
      and are recorded as scope notes only.
    - >-
      A crash or tooling failure is recorded as failed_infrastructure and is
      evidence for nothing (AGENTS.md rule 5).
    - Stop at 4200 total wall-clock seconds, 1.2 CPU-hours, or 4 GB resident memory.
  invalidation_rules:
    - Any run missing its manifest, exact command, environment, stdout, stderr, or raw machine-readable admissibility table is invalid.
    - Any corpus hash mismatch or missing corpus path invalidates the run.
    - Calibration accuracy below 2/2 invalidates the run (sheet unsound as instrumented).
    - Non-identical admissibility tables across the two determinism passes invalidate the run.
    - An incomplete verdict table (fewer than 21 corpus items adjudicated) is invalid unless every missing item is recorded undecidable_with_reason, in which case the run is inconclusive rather than invalid.
    - >-
      A zero-admissible table or a table with a passing candidate is a
      scientific outcome, never an invalidation.
  success_criterion: >-
    The frozen sheet applied mechanically to the frozen corpus yields a
    complete, deduplicated admissibility table over all 21 items with zero
    admissible candidates (scoped absence supported), 100 percent
    duplicate-owner coverage over rejected items, the residual frontier
    recorded as SOURCE-LOCATOR-OPEN with KN-OPEN-005, KN-OPEN-004,
    KN-OPEN-006, and KN-OPEN-001, calibration at 2/2, and corpus integrity
    verified.
  falsification_criterion: >-
    At least one of the 21 frozen corpus items passes the frozen sheet (S1-S3
    not triggered, S4 and S5 satisfied): the screen is refuted and the
    passing item must be recorded with its explicit operation and complete
    charged ledger as a candidate.

  required_artifacts:
    - experiments/EXP-SCR-001/specification.yaml
    - experiments/EXP-SCR-001/sheet/apply_sheet.py
    - experiments/EXP-SCR-001/sheet/calibration_receipt.json
    - experiments/EXP-SCR-001/corpus_manifest.json
    - experiments/EXP-SCR-001/admissibility_table.json
    - experiments/EXP-SCR-001/residual_frontier.json
    - experiments/EXP-SCR-001/runs/RUN-SCR-001-A/{manifest.yaml,command.txt,environment.json,raw-result.json,stdout.log,stderr.log}
    - experiments/EXP-SCR-001/runs/RUN-SCR-001-B/{manifest.yaml,command.txt,environment.json,raw-result.json,stdout.log,stderr.log}
    - experiments/EXP-SCR-001/runs/RUN-SCR-001-C/{manifest.yaml,command.txt,environment.json,raw-result.json,stdout.log,stderr.log}
    - experiments/EXP-SCR-001/analysis.md
    - experiments/EXP-SCR-001/execution-report.yaml
    - ledger/hypotheses/H-SCR-001.yaml

  assigned_to: executor
  inference_receipt:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: null
    fallback_used: false
    authorization_ref: null
