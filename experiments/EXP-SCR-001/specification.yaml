experiment:
  id: EXP-SCR-001
  hypothesis_id: H-SCR-001
  goal_id: GOAL-CRYPTO-001
  version: 1
  title: >-
    Post-z_R and post-hyperplane no-admissible-next-mechanism screen:
    deterministic corpus/literature dedup audit over the frozen BATCH-005
    snapshot
  status: approved
  frozen: true
  approved_by: coordinator
  approved_at: '2026-07-27'
  source_proposal: IDEA-20260723-003
  claim_tier: toy
  claim_tier_basis: >-
    This is a pure read-and-adjudicate audit: it performs no sampling, no
    curve arithmetic, and no live retrieval. Its sheet is scale-independent
    in form (static predicates over committed records), but its conclusion is
    scope-bounded to the checked frozen snapshot; per AGENTS.md rule 6 a
    zero-admissible table closes only the exact checked scope. The tier is
    recorded as toy because the audit rests on toy-tier prior evidence
    records and authorizes no medium or cryptographic claim in either
    direction.
  objective: >-
    Apply the frozen admission sheet (predicates S1-S5 below) mechanically to
    the 21 frozen corpus audit items, producing a complete, deduplicated
    admissibility table. Decide: zero admissible candidates with a complete
    charged sub-rho path (success; scoped absence supported, residual
    frontier recorded as SOURCE-LOCATOR-OPEN) versus at least one candidate
    passing the sheet (falsification; record the candidate). This is design
    only: execution is deferred to a separate Executor task after approval.

  inputs:
    corpus_snapshot:
      pinned_commit: b8af1551e45fbe4435745239d29f4d141eea3356
      verification_rule: >-
        The audit reads git blob content at the pinned commit (git cat-file),
        never the working tree. At run start the executor materializes
        corpus_manifest.json mapping every path below to its expected git
        blob SHA-1 (from this manifest) and to the SHA-256 of the blob
        content actually read; any missing path or hash mismatch invalidates
        the run (corpus integrity control).
      hash_manifest:
        - {path: ledger/proposals/IDEA-20260723-001.yaml, git_blob_sha1: 8d4e27a2c3eb24d89cd6db4c4e9db518cb04e58c}
