experiment:
  id: EXP-QALG-a5338c
  hypothesis_id: H-QALG-2eb8b0
  derived_from_idea: IDEA-20260813-02479f
  question_id: RQ-QALG-457b41
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Sample-access-model realizability audit for ML-KEM: exact closed-form evaluation
    of self-reduction noise inflation and combinatorial ceiling against the required
    virtual-sample count, with a symbolic baseline embedding and a reported numeric
    margin at every standardized level
  objective: >-
    The one uncertainty a run reduces is whether a single bounded ML-KEM public key
    can supply the independent-faulty-sample access model the dihedral-coset
    algorithm family assumes, using the standard linear self-reduction mechanism. A
    run establishes (i) the pinned correspondence between the source algorithm's "n"
    and ML-KEM's module dimension, or an explicit statement that it could not be
    pinned in this environment together with the full range of plausible readings;
    (ii) the exact integer Q = k*n^(c+1) at each standardized level across the
    declared sensitivity range in c; (iii) the closed-form error variance V(m, B) of
    a self-reduction virtual sample, symbolically checked against its m = 1 and m = 2
    baselines; (iv) the combinatorial ceiling C(k, B) on distinct bounded-coefficient
    combinations available from k in {2,3,4} rows; and (v) the resulting realizability
    verdict per level WITH ITS EXACT NUMERIC MARGIN, not a qualitative label. No
    attack is implemented, no key is attacked, no quantum computation is simulated,
    and nothing is claimed about the source algorithm's own correctness.
  what_this_is_not:
    - >-
      Not an attack on ML-KEM, not a claim that ML-KEM is broken or unbroken, and not
      a security-level statement about any standardized parameter set.
    - >-
      Not an assessment of the source algorithm's correctness. This audits a
      PRECONDITION - whether its assumed input interface is instantiable from the
      concrete target - and is silent on everything downstream of that interface.
    - >-
      Not a closure of the whole route. It audits STANDARD linear self-reduction only;
      any other sample-generation technique is explicitly out of scope and named as
      open.
    - >-
      Not a status change to any hypothesis, evidence record, decision or goal record,
      and not a promotion of any knowledge entry.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or
      evidence. No run has been executed under this contract and no number in it is a
      measurement.
  claim_ceiling:
    tier: closed_form_audit
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: under the pinned (or declared-range) correspondence
      and the standardized ML-KEM parameter table, standard linear self-reduction from
      k real rows does or does not reach Q virtual samples inside the stated noise
      budget, with this exact numeric margin, at each level, over this sensitivity
      range in c. WHAT DOES NOT FOLLOW: nothing about whether the algorithm works given
      the access model; nothing about any other sample-generation technique; nothing
      about any parameter set outside the three standardized levels; and specifically
      NOT the sentence "the route is closed", which the method ceiling forbids.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, HARD GATE): pin the source algorithm's "n", its sample
      requirement Q = k*n^(c+1), its minimum c, and its faulty-sample tolerance
      1/O(log n) to a source ACTUALLY READ in this container. Record verbatim what was
      read and what could not be reached. If the correspondence cannot be pinned, the
      declared range of plausible readings is frozen HERE, before any evaluation.
      STAGE 1 (zero compute, symbolic): derive V(m, B), the error variance of a
      self-reduction virtual sample, from variance additivity and CBD(eta)'s known
      variance. Check it EXACTLY at m = 1 (must equal eta/2, no inflation) and at
      m = 2 with unit coefficients (must equal eta). These are the baseline-embedding
      controls and they are read before anything else.
      STAGE 2 (seconds, exact integer arithmetic): compute Q at each standardized level
      across the c range. Q is astronomically large; it is computed and stored as an
      exact integer, never as a float.
      STAGE 3 (seconds): compute C(k, B), the number of distinct bounded-coefficient
      combinations available from k rows at coefficient bound B, explicitly and by
      counting rather than by assertion, as a function of B.
      STAGE 4 (seconds): solve the two-sided constraint - find the smallest B (hence
      the smallest induced noise) at which C(k, B) >= Q, evaluate the induced noise
      rate there, and report its ratio to the 1/O(log n) tolerance as the NOISE MARGIN,
      per level, per c, per correspondence reading.
      STAGE 5 (zero compute): report the trivial-floor check, the sensitivity table, the
      direction of every optimistic assumption, and the scoped verdict with the exact
      margin. Write the refusal statement for every sentence the method ceiling forbids.
    instrument: >-
      Python 3.11 with exact integer and Fraction arithmetic; no floating point anywhere
      in the Q or margin computation, since the quantities span dozens of orders of
      magnitude and a double would silently overflow or round the entire result. No
      lattice software, no ML-KEM implementation, no quantum simulation, no SageMath.
      Every formula is written from its definition and its derivation is emitted
      alongside its value. Recorded through harness/runner.py.
    parameters: >-
      Three standardized ML-KEM levels with their k in {2,3,4}, ring degree 256 and
      CBD(eta) with eta in {2,3} as standardized. Sensitivity range over c from the
      source's minimum upward, declared at STAGE 0. Correspondence readings: the pinned
      one, or the full declared plausible range. Coefficient bounds B swept over a
      declared grid from 1 upward until C(k, B) >= Q or B exceeds the modulus, whichever
      comes first.
  controls:
    - >-
      BASELINE-EMBEDDING CONTROL, symbolic, forced value, read FIRST. V(m, B) at m = 1
      must equal ML-KEM's base CBD(eta) variance eta/2 with NO inflation term, and at
      m = 2 with unit coefficients must equal exactly eta. Both are exact identities
      checkable by hand. If either fails, the general formula is wrong and no verdict
      from it may be reported.
    - >-
      TRIVIAL-FLOOR CONTROL, forced value. The degenerate case Q <= k must come out
      trivially realizable with zero inflation. A formula that reports the trivial case
      as unrealizable is broken at the low end and its high-end verdict is worthless.
      This control exists precisely because the audit's expected outcome is
      "unrealizable", and a verdict that cannot say "realizable" is not a verdict.
    - >-
      SENSITIVITY CONTROL over c. Larger c enlarges Q, worsening this obstruction, but
      also changes the algorithm's own failure bound. The verdict is reported across
      the declared c range rather than fixed at one arbitrary value, and a verdict that
      flips inside the range is reported as flipping.
    - >-
      CORRESPONDENCE-RANGE CONTROL. If STAGE 0 cannot pin the n-to-dimension
      correspondence, the verdict is computed at every plausible reading and reported
      as a range. A verdict that flips across readings is INCONCLUSIVE and is reported
      as such, never resolved by preferring a reading.
    - >-
      OPTIMISTIC-ASSUMPTION DISCLOSURE with DIRECTION. Every simplification is listed
      with the direction of its bias. In particular: treating distinct combinations of
      k <= 4 fixed rows as independent samples is OPTIMISTIC IN THE HYPOTHESIS'S
      DISFAVOUR - it makes realizability look easier than it is - so the reported
      margin is a LOWER bound on the severity and is labelled a bound, not a
      prediction.
    - >-
      MEASURED-VERSUS-MODELED SEPARATION. Every reported number is labelled as
      symbolic/derived (a closed form with its derivation emitted) or as taken from a
      standardized parameter table with that table's provenance named. Nothing in this
      contract is measured, and the deliverable must not present any number as if it
      were.
    - >-
      COLLISION SEARCH, genuine and scoped. Before concluding no favourable combining
      strategy exists, the run must SEARCH for one - a choice of m and B with
      sub-linear variance growth - over a declared scope, and report the scope. An
      asserted absence is not a passed check.
  independent_variables:
    - 'standardized level: ML-KEM-512 / 768 / 1024 (hence k in {2,3,4}, eta in {2,3})'
    - c, over the declared sensitivity range
    - the coefficient bound B
    - the n-to-module-dimension correspondence reading
  metrics:
    primary:
      - name: noise_margin
        units: dimensionless ratio
        computed_as: >-
          (achieved per-virtual-sample noise rate at the smallest B with C(k,B) >= Q)
          divided by (the 1/O(log n) tolerance at that level), as an exact rational,
          per level, per c, per correspondence reading. The hypothesis predicts this is
          far above 1; a value at or below 1 falsifies it at that level.
      - name: realizability_verdict
        units: >-
          categorical - realizable / unrealizable / undecidable_in_this_environment
        computed_as: >-
          realizable iff noise_margin <= 1 at that level for every c and every
          correspondence reading in the declared ranges; unrealizable iff
          noise_margin > 1 for all of them; undecidable if the verdict flips inside a
          declared range. The verdict is NEVER reported without its margin.
      - name: required_Q
        units: exact integer
        computed_as: k * n^(c+1) at the pinned or declared n, per level, per c.
      - name: baseline_embedding_pass
        units: boolean
        computed_as: >-
          V(1) = eta/2 exactly AND V(2, unit coefficients) = eta exactly. POSITIVE
          CONTROL, forced true.
      - name: combinatorial_ceiling
        units: exact integer, as a function of B
        computed_as: >-
          C(k, B), the number of distinct bounded-coefficient combinations of k rows at
          bound B, counted explicitly, with the smallest B satisfying C(k,B) >= Q
          reported.
    secondary:
      - name: trivial_floor_pass
        units: boolean
        computed_as: the formula reports Q <= k as realizable with zero inflation.
      - name: verdict_stability
        units: >-
          categorical - stable across both declared ranges / flips in c / flips across
          correspondence readings
        computed_as: comparison of the verdict at every point of the two declared ranges.
      - name: collision_search_scope
        units: description plus the enumerated (m, B) region searched
        computed_as: >-
          the region over which a sub-linear-variance combining strategy was searched
          for, reported so an absence is scoped rather than asserted.
      - name: optimistic_assumption_table
        units: list of assumptions with the direction of each bias
        computed_as: enumerated at STAGE 1 and STAGE 5, before the verdict is written.
      - name: unreachable_source_list
        units: list
        computed_as: >-
          everything STAGE 0 tried to read and could not, recorded as an absence rather
          than substituted by recollection.
  heuristic_under_test:
    id: HEUR-QALG-2eb8b0-1
    formal_statement: >-
      For a virtual MLWE sample sum_{i=1}^{m} c_i * (real sample i) plus fresh public
      randomness, with bounded integer c_i and independent CBD(eta) errors, the error
      variance is exactly (sum_i c_i^2) * (eta/2). For all m >= 1, all coefficient
      vectors inside the declared bound, and eta in {2,3}.
    validation: >-
      Validated symbolically, not sampled: the m = 1 and m = 2 identities are exact and
      checkable by hand, and they are the baseline-embedding control. This is a finite
      identity, not an asymptotic approximation, so empirical sampling would add
      nothing and is deliberately not performed.
    second_heuristic:
      id: HEUR-QALG-2eb8b0-2
      formal_statement: >-
        Distinct bounded combinations of the same k <= 4 underlying rows are treated as
        independent enough to count toward the algorithm's independent-sample
        requirement.
      why_it_is_here_and_its_direction: >-
        It is manifestly generous, and the direction is stated: charging the dependence
        properly would make the obstruction WORSE, so this heuristic biases the audit
        AGAINST its own hypothesis. The reported margin is therefore a lower bound on
        severity and is labelled a bound, never a prediction.
  preregistered_prediction:
    quantity: >-
      noise_margin at each of the three standardized ML-KEM levels, at the source's
      minimum c, under the pinned correspondence.
    formula: >-
      UNREALIZABLE iff noise_margin > 1 at every level across both declared sensitivity
      ranges; REALIZABLE at a level iff noise_margin <= 1 there, robustly. The parent
      proposal predicts unrealizable with a large margin, and explicitly requires the
      arithmetic rather than the assertion. NO NUMERIC VALUE IS PRE-REGISTERED for the
      margin, because computing it is the experiment and stating it in advance would be
      a fabrication.
    source: >-
      Pre-registered in the parent proposal IDEA-20260813-02479f
      (predictions.realizability_verdict and falsification_conditions) before any run
      under this contract exists. The threshold is the algorithm's own stated tolerance,
      not a threshold chosen here.
  scale_relevance:
    tier: standardized_parameter_sets
    justification: >-
      This is the rare audit that runs AT the target scale rather than below it, because
      every quantity is closed-form arithmetic and needs no simulation. That is its main
      strength and it should not be oversold: the numbers are exact evaluations of
      FORMULAS whose inputs are a parameter table and a relayed algorithm statement, so
      their reliability is the reliability of STAGE 0's pinning, not of an experiment.
    correspondence: null
    transfer_assumption: >-
      None within the three standardized levels. Transfer to any other parameter set,
      scheme or algorithm is explicitly NOT offered.
  tail_checks:
    - >-
      Report the verdict at every point of the c range and at every correspondence
      reading, not only at the endpoints, since a verdict that flips in the interior
      would be invisible from endpoints alone.
    - >-
      Report the smallest B at which C(k, B) >= Q, and the noise at B - 1 and at B + 1,
      so a knife-edge verdict is visible as one.
    - >-
      Report Q and the margin as exact integers or rationals with their digit counts. A
      margin quoted only in orders of magnitude hides whether it is 10 or 10^30, and
      those license different sentences.
    - >-
      Report the collision search's scope explicitly. An empty search reported as "no
      favourable strategy exists" is the failure mode this control is here to prevent.
  replication:
    seeds: []
    seeds_note: >-
      Explicitly empty, not omitted. Every computation in this contract is
      DETERMINISTIC closed-form arithmetic; there is no sampling, so a seed would be
      decorative and recording one would misrepresent the method. Replication here means
      independent RE-DERIVATION of the closed forms by a second party, which is required
      below as a blind re-derivation rather than as a repeat run.
    independent_instances: 1
    repeat_count: 1
    blind_rederivation_required: true
    blind_rederivation_note: >-
      Because the run cannot vary, the only meaningful replication is a blind
      re-derivation of V(m, B), C(k, B) and the margin from the pinned inputs alone, by
      a reviewer who has not read the producer's implementation. That is required before
      any verdict becomes official.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    memory_gb: 2
    maximum_memory_gb: 2
    maximum_runs: 10
  stopping_rules:
    - >-
      Stop and void the run if either baseline-embedding identity fails.
    - >-
      Stop and report if STAGE 0 cannot pin the correspondence AND the declared
      plausible range cannot be bounded. The audit is then not executable and that is
      the finding.
    - >-
      Stop the B sweep at the modulus; a coefficient bound at or beyond the modulus is
      meaningless and the sweep reaching it is itself a reportable result.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion
      is a stop, never a negative result (AGENTS.md rule 5).
    - >-
      The tolerance, the ranges and the verdict rule are frozen at STAGE 0 and are not
      revised after any margin is computed.
  invalidation_rules:
    - >-
      A timeout, crash or dependency failure makes the run failed_infrastructure and is
      NEVER negative mathematical evidence (AGENTS.md rule 5).
    - >-
      A run computing Q or the margin in floating point is invalid_measurement: the
      quantities span dozens of orders of magnitude and a double silently destroys the
      result.
    - >-
      A run reporting a verdict without its exact numeric margin is invalid_measurement,
      since a qualitative verdict cannot be checked by a reviewer - this is a named
      confounder in the parent proposal.
    - >-
      A run whose baseline-embedding or trivial-floor control was not executed in the
      same invocation as the main evaluation is invalid_measurement.
    - >-
      A run substituting a remembered value for an unpinned correspondence is
      completed_invalid; a missing input stays missing and is reported as such
      (AGENTS.md rule 5).
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment
      and requires a new contract; it is never a repair of this one.
  success_criterion: >-
    Both the baseline-embedding and the trivial-floor controls pass, STAGE 0's pinning
    record is complete (either a pinned correspondence or a bounded declared range with
    its unreachable-source list), the collision search's scope is reported, and the run
    delivers noise_margin and realizability_verdict as exact rationals at all three
    standardized levels across the full declared c and correspondence ranges, together
    with the optimistic-assumption table and the direction of each bias. The hypothesis
    H-QALG-2eb8b0 is SUPPORTED if and only if the verdict is unrealizable at all three
    levels and stable across both ranges.
  falsification_criterion:
    - >-
      noise_margin <= 1 at any standardized level, stable across both declared ranges.
      The access model IS instantiable there by standard self-reduction; the hypothesis
      is falsified at that level and this obstruction is not what closes the route.
    - >-
      The collision search finds a combining strategy with sub-linear variance growth
      reaching Q inside the budget. Same disposition, by explicit construction rather
      than by margin - and the strategy itself is the more valuable result.
    - >-
      The baseline-embedding identity fails at m = 1 or m = 2. The formula is wrong and
      nothing downstream is admissible.
    - >-
      The trivial-floor check fails. The formula cannot say "realizable" at all, so its
      "unrealizable" verdict carries no information - a control that cannot fail.
    - >-
      The verdict flips across the c range or across the correspondence readings.
      INCONCLUSIVE; the binding uncertainty is the unpinned input, and the honest report
      says so instead of preferring a reading.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment
    - >-
      raw-result.json carrying every computed quantity as an exact integer or rational -
      Q, V(m,B), C(k,B), the margin - at every point of both declared ranges, and not
      summaries
    - the STAGE 0 pinning record, verbatim, with the unreachable-source list
    - the symbolic derivation of V(m,B) and C(k,B), emitted alongside their values
    - the baseline-embedding and trivial-floor control results, in the same file
    - the optimistic-assumption table with the direction of each bias
    - the collision search's enumerated scope
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not approve. This contract is review_required and is NOT
      approved; approved_by is null and execution_authorized is false. Approval is the
      user's gate because it authorizes execution and spends compute.
    - >-
      STAGE 0 is a HARD GATE. A numeric verdict computed against an unpinned
      correspondence is not a result, and the declared plausible range must be frozen
      before any evaluation rather than after seeing which reading gives the expected
      answer.
    - >-
      The paired hypothesis is proof-oriented and carries a filled proof_search_map
      (KN-TECH-080). Its method_ceiling forbids the sentence "the route is closed"; that
      forbidden-sentence rule is part of this contract and binds the deliverable.
    - >-
      Because the run is deterministic, the blind re-derivation named under replication
      is a precondition of the result becoming official, not an optional review step.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260813-02479f
    authored_at: '2026-08-25'
    note: >-
      Metrics, controls, the two baseline checks and the sensitivity requirement are
      derived from the parent proposal's minimal_test.controls, proof_search_map and
      falsification_conditions. The tolerance threshold is the source algorithm's own
      and is not chosen here. Budgets come from the parent's declared estimated_cost
      (implementation low, compute low, "likely the cheapest of the five proposals in
      this batch"). No field is invented; a value the proposal did not supply is null or
      is assigned to STAGE 0.
  derivation_gaps:
    - >-
      The n-to-module-dimension correspondence is NOT pinned in this record and cannot
      be, since this container may not reach the source. Every numeric output depends on
      it. It is assigned to STAGE 0, and the plausible range must be declared and frozen
      there rather than chosen later.
    - >-
      The exact form of the "1/O(log n)" tolerance - its constant and its base - is
      unpinned. A tolerance stated only up to an O() is not a threshold, and the
      contract must fix a declared reading of it at STAGE 0 or report the verdict across
      the readings.
    - >-
      C(k, B) needs its counting convention declared: whether combinations are counted
      up to sign, up to scaling, and whether fresh public randomness makes otherwise
      identical combinations distinct for the algorithm's purposes. That convention can
      change the ceiling by a large factor and it is chosen before, never after.
    - >-
      Whether the dependence among combinations of k <= 4 rows should be charged is
      unresolved and is numbered HEUR-QALG-2eb8b0-2. Its direction is stated (charging
      it worsens the obstruction), so the audit is conservative - but a reviewer must be
      able to see that the generous choice was deliberate.
