experiment:
  id: EXP-SNFS-ffa309
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-ddc377; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-ddc377
  question_id: RQ-SNFS-005666
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Centred-digit magnitude detector for special-form primes: closed-form null validation, complete-sweep
    true-positive measurement, and a coverage and cost comparison against the power-lattice detector'
  objective: 'The one uncertainty a run reduces is whether a detector for the class C(d,H) can be
    built without lattice reduction, and whether its false-positive rate can be predicted in advance
    rather than measured after the fact. (i) Does the closed-form null hold: over uniform primes,
    does the distribution of the normalised maximum centred digit follow the derived (2t)^(d+1) law
    at fixed base, and does the grid minimum over M bases follow the derived extreme-value form, since
    if it does not then no pre-computed false-positive number is usable and the instrument must fall
    back to an empirical null like every other detector. (ii) Is the detector complete where the derivation
    says it is: on planted primes whose witness coefficients are below m/2, does a stride-one sweep
    catch essentially all of them, and does an out-of-subclass arm with larger coefficients fail as
    predicted, which together confirm the completeness boundary is exactly where the algebra puts
    it. (iii) What does it cost and what does it miss relative to the lattice instrument: on one planted
    sample scored by both detectors over the same grid, what is the symmetric difference in what they
    catch and what is the per-base wall-clock ratio, so the two can be placed on a coverage-versus-cost
    frontier rather than compared by assertion.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal claim a run could support is: for the tested sizes,
      degrees and coefficient bounds, the centred-digit statistic detects planted C(d,H) primes with
      the measured true-positive rate under a complete stride-one sweep, its null distribution matches
      or fails to match the derived closed form by the measured amount, and its coverage and per-base
      cost stand in the measured relation to the lattice detector. What does NOT follow: no claim
      that detection is feasible at any size where a complete sweep is unaffordable, no claim about
      witnesses outside the subclass H below m/2, no claim about any prime this program did not plant,
      and no statement whatever about deployed parameters, security, or intent.'
  inputs:
    procedure: 'STAGE 0, zero compute: derive the closed-form null and the extreme-value form for
      the grid minimum and record them, with the detection threshold fixed from the derivation before
      generation. STAGE 1, minutes: implement centred-digit extraction with exact integer arithmetic
      and unit-test by reconstructing p from its digits for a thousand random cases. STAGE 2, minutes:
      generate the planted, out-of-subclass and null arms with recorded seeds and witnesses. STAGE
      3, minutes: sweep the grid for every prime in every arm and record grid minima plus, for a subsample,
      full per-base traces. STAGE 4, minutes: compare the measured null against the derivation, which
      is a gate: failure here is reported and the remaining false-positive numbers are marked empirical
      rather than predicted. STAGE 5, minutes: compute true-positive and false-positive rates and
      the measured window. STAGE 6, tens of minutes: score the same planted sample with the power-lattice
      detector over the identical grid and compute the symmetric difference and per-base cost ratio.
      STAGE 7: run the base-correlation and blind-shift controls and emit the run manifest.'
    instrument: Pure Python 3.11 standard library only; numpy, sympy, gmpy2 and fpylll were checked
      and are absent, Sage excluded by contract. divmod on arbitrary-precision int for digit extraction,
      a shared Miller-Rabin for both arms, statistics for summaries, hashlib for the freeze receipt
      on the derived threshold, time.perf_counter for the per-base cost comparison. New module harness/snfs_digits.py
      holds the statistic, the samplers and the controls, and it imports the reducer from harness/snfs_detect.py
      for the comparison arm; harness/runner.py records the manifest.
    parameters: Bit sizes n in {32, 48, 64}. Degrees d in {2, 3, 4}. Coefficient bounds H in {4, 8,
      64} for the in-subclass arms and H set to about m for the out-of-subclass arm. Grid of 4001
      consecutive bases centred on the integer nearest p^(1/d), with a blind-shift variant. Sample
      sizes 200 primes per arm per cell. Threshold fixed from the derivation at t = 0.05. Per-cell
      wall-clock cap 600 seconds.
  controls:
  - The uniform-prime null arm in the same invocation.
  - The closed-form derived null, compared against the measured null as an instrument-validity gate.
  - A witness-excluded control on the planted arm, which must return the null distribution exactly,
    confirming the one-base window.
  - An out-of-subclass control with H above m/2, where the detector is expected to fail by construction,
    confirming the completeness boundary is real.
  - A base-correlation check comparing statistics at adjacent bases, testing the independence assumption
    behind the extreme-value form.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Uniform random primes of identical bit length scored by the identical
    statistic over the identical grid in the same invocation, PLUS the closed-form null derived at
    STAGE ONE. Having both is the point: the measured null must match the derived null, which is a
    far stronger control than either alone. For the signal arm to mean anything the null must show,
    first, that the distribution of max centred digit over m matches (2t)^(d+1) within a stated tolerance,
    and second, that the grid minimum over M bases follows the derived extreme-value form. If the
    measured null is systematically below the derived one, some primes are accidentally special and
    the census base rate, not the derivation, is the operative floor.'
  independent_variables:
  - degree d
  - coefficient bound H, in-subclass or out-of-subclass
  - bit size n
  - grid centring, centred or blind-shifted
  metrics:
    primary:
    - grid-minimum normalised max-digit statistic per prime
    - measured versus derived null cumulative distribution at fixed t
    - true-positive rate on the in-subclass planted arm
    - false-positive rate at the derived threshold
    - symmetric difference against the lattice detector on the same sample
    secondary:
    - detection window half-width in base steps
    - per-base wall-clock cost for each detector
    - adjacent-base correlation coefficient
    - out-of-subclass true-positive rate, expected near zero
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The false-positive rate of the digit detector at the derived threshold over the null
      arm, which is fixed by the closed-form null before any prime is generated.
    formula: P(E(p) <= t for a fixed base) = (2t)^(d+1) for centred digits approximately uniform on
      (-m/2, m/2], and over M approximately independent bases P(grid minimum <= t) = 1 - (1 - (2t)^(d+1))^M.
      At t = 0.05, d = 3 and M = 4001 this predicts a false-positive rate of about 1 - (1 - 10^-4)^4001,
      roughly 0.33, which is the number the measured null arm must reproduce.
    source: Pre-registered in the parent proposal IDEA-20260816-ddc377 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Sizes 32 to 64 bits with grids of 4001 bases are used because a stride-one sweep
      that actually contains the witness is affordable there, which is the only regime in which the
      detector''s true-positive rate is measurable at all. The transfer assumption is stated and is
      narrow: the closed-form null is size-independent by derivation, so if it validates here it is
      expected to hold at larger n, but the true-positive rate does NOT transfer because it presumes
      a complete sweep, and the contract forbids reporting a detection rate at any size where the
      sweep was not enumerated.'
    correspondence: null
  tail_checks:
  - Inspect null primes whose grid minimum falls below the threshold and check by exhaustive search
    whether they genuinely lie in C(d,H).
  - Inspect bases sharing small factors with p, where digit vectors degenerate.
  - Check the smallest bases in each grid, where the digit vector length exceeds d+1.
  - Inspect planted primes that are missed, which should be exactly those with a coefficient above
    m/2.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop a cell at its 600-second cap and record it as budget-truncated rather than as a negative
    result.
  - Stop the run if digit reconstruction unit tests fail.
  - Stop the comparison arm if the lattice reducer fails its own unit tests, and report the digit
    results alone.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Every cell reports the measured null against the derived closed form, the true-positive
    rate under complete sweep, the false-positive rate at the derived threshold, and the coverage
    and cost comparison against the lattice detector, with the out-of-subclass control executed in
    the same invocation.
  falsification_criterion:
  - The measured null departs from the derived closed form by more than a factor of 1.5, so no pre-computed
    false-positive rate is usable.
  - In-subclass planted primes are missed when the true base is swept, indicating the digit identity
    does not hold as derived.
  - The out-of-subclass arm is detected, showing the completeness boundary is not where the algebra
    puts it.
  - Adjacent-base correlation is high enough to invalidate the extreme-value form for the grid minimum.
  - The witness-excluded control still separates, meaning the statistic responds to something other
    than the planted witness.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-ddc377
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The threshold t = 0.05 is chosen for convenience and the Coordinator must fix it from a stated
    false-positive target instead.
  - The independence of adjacent bases is assumed in the extreme-value form and only checked empirically;
    a Coordinator may require a derivation or a correction factor before the predicted false-positive
    rate is quoted.
  - The comparison arm depends on the power-lattice detector module from a sibling contract, and the
    dependency ordering between the two experiments must be settled before either is approved.
