# EXP-SEMBIN-b8030a
# Merge-tree counting identities. No enumeration.
# Approved by DEC-20261002-33ec7a.
experiment:
  id: EXP-SEMBIN-b8030a
  hypothesis_id: H-SEMBIN-f1b7a0
  source_idea: IDEA-20260913-c94e52
  question_id: RQ-SEMBIN-9fa4ba
  version: 1
  title: Merge-tree counting identities
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-33ec7a
  objective: >-
    Check the labelled tree counts, the binary variable count, and the
    three arity remainders.
  inputs:
    leaves: [3, 4, 5, 6, 7, 8]
    labelled_counts: [3, 15, 105, 945, 10395, 135135]
    ratios: [5, 7, 9, 11, 13]
    plane_at_three: 2
    n: 571
    t: 12
    k: 48
    spine: 10
    binary_variables: 6286
    ten_times_n: 5710
    leaf_bits: 576
    arity_remainders: [1, 2, 3]
    numerators: [6291, 6296, 6301]
    denominators: [2, 3, 4]
    written_arity: [3146, 2099, 1575]
    degree_figures: [4, 10, 17, 26]
    quadratic_at_two: 5
  controls:
    - >-
      The count at eight leaves is 135135. Reporting another count
      invalidates the run.
    - >-
      The plane-tree count at three leaves is 2. Reporting it as the
      labelled count invalidates the run.
    - >-
      The binary variable count is 6286. Reporting another count
      invalidates the run.
    - >-
      Arity 3 leaves remainder 1. Reporting 3146 as an exact variable
      count invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {counts, variables}
    - route in {product, recurrence}
  metrics:
    primary:
      - labelled_count
      - binary_variables
      - implementations_agree
    secondary:
      - plane_contrast
      - arity_remainders
      - degree_figures
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The count 135135 and the variable count 6286.
    formula: >-
      The labelled count through t leaves is the product of the odd
      integers from 1 through 2t - 3. The binary variable count is
      (t - 2) n plus t k. A full j-ary tree exists only when j - 1
      divides t - 1.
    source: >-
      IDEA-20260913-c94e52 states the counts and the variable formula,
      read 2026-10-02. The products were computed in this design
      session. That computation is not a run. No tree was enumerated.
  scale_relevance:
    tier: toy
    justification: Six integer counts and one variable count. No transfer to a monomial proxy.
    correspondence: null
  tail_checks:
    - The last odd factor 13 is required. A product that stops at 11 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the eight-leaf count is not 135135, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The eight-leaf count is not 135135.
    - The binary variable count is not 6286.
    - The labelled count at three leaves is reported as 2.
    - 3146 is reported as an exact variable count.
    - A tree is enumerated or a monomial proxy is minimised.
  success_criterion: >-
    Both runs agree that the six labelled counts are 3, 15, 105, 945,
    10395 and 135135, that the binary variable count is 6286, and that
    the arity remainders are 1, 2 and 3.
  falsification_criterion: >-
    The runs agree, the eight-leaf count stays 135135, and any factor
    differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-SEMBIN-b8030a/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-SEMBIN-b8030a/runs/<RUN-ID>/command.txt
    - experiments/EXP-SEMBIN-b8030a/runs/<RUN-ID>/stdout.log
    - experiments/EXP-SEMBIN-b8030a/runs/<RUN-ID>/stderr.log
    - experiments/EXP-SEMBIN-b8030a/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-SEMBIN-b8030a/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any enumeration of merge trees.
    - Any monomial-proxy minimum or shape ranking.
    - Any claim that a cost exponent moves.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
