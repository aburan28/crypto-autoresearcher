experiment:
  id: EXP-PRECOMP-004
  status: proposed
  title: Partial Groebner/F4 prefix reuse
  objective: >-
    Stop the cold solver at controlled degrees or symbolic-preprocessing stages,
    persist the target-independent prefix, and resume from that state for unseen
    targets to map the storage/precompute/online-time Pareto frontier.
  fixtures:
    field_bits: [11, 13, 16, 20, 24, 28]
    curve_seeds: [1, 2, 3]
    holdout_targets: 100
    decomposition_arities: [2, 3]
  prefix_cutoffs:
    policy: every completed F4 degree/stage before final basis
    include: [symbolic_only, post_monomial_enumeration, post_reducer_selection, post_degree_matrix]
  metrics:
    primary: amortized_warm_speedup
    required:
      - prefix_build_seconds
      - prefix_bytes
      - resume_seconds
      - cold_seconds
      - fallback_rate
      - peak_memory_bytes
      - verification_failures
      - break_even_target_count
  outputs:
    - pareto_frontier_precompute_bytes_vs_warm_time
    - per_cutoff_summary.json
  controls:
    - matched cold target-specific solve
    - exact verification of resumed results
    - no reuse of target-derived numerical coefficients unless explicitly tagged
  success_criterion: >-
    At least one prefix cutoff yields >=5x median warm speedup with break-even
    target count <=100 and zero incorrect accepted solves in two >=20-bit cells.
  strong_signal: >-
    A stable prefix transfers across >=95% of holdouts and its optimal cutoff
    moves later, rather than earlier, as field size grows.
  falsification_hook: >-
    Every nontrivial prefix either fails on >50% of unseen targets or requires
    storage/precompute cost exceeding the cold work before N=1000 targets.
  depends_on: [EXP-PRECOMP-001]
