experiment:
  id: EXP-FBG-8c93e7
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-5ea9b4; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-5ea9b4
  question_id: RQ-FBG-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Three-null sensitivity battery: four factor-base geometries spanning the negation-collapse
    range, each measured against matched-nominal, matched-effective and matched-multiset-count random
    nulls computed in a single invocation, at three group sizes'
  objective: 'The one uncertainty a run reduces is how much of a reported factor-base coverage excess
    is produced by the definition of the matched random null rather than by the geometry. Stated in
    parts: (i) NULL CONSISTENCY - do three random bases drawn by the identical sampler but sized under
    the three declared matching rules differ from each other by exactly the closed-form amount predicted
    before the run, since if they differ by more then the samplers are not comparable and no spread
    can be attributed to the matching rule; (ii) SPREAD - for geometries spanning the negation-collapse
    range from about 0.5 to 1.0, how large is the spread in measured excess ratio across the three
    null definitions, and how does that spread compare with the excess magnitudes this program has
    recorded; (iii) ROBUSTNESS OF LARGE EFFECTS - does a ceiling-attaining excess remain clearly above
    1.0 under all three definitions, so that the null-definition question is confined to small effects
    rather than threatening every measurement in the bucket. A run cannot reduce uncertainty about
    whether any geometry has real structure, about relation yield, decomposition or linear algebra,
    about behaviour at cryptographic sizes, or about which null definition is correct - the contract
    declines to designate one. It also cannot revise any recorded verdict, since it re-runs no recorded
    cell. The deliverable is a per-geometry table with three excess columns, the collapse fraction,
    and the null consistency residual.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A completed run could support at most this: on the named toy
      prime-order curves at the three stated sizes, at the stated nominal base size and arity 3, with
      exact coverage counting over the complete target space, the four named geometries have the reported
      excess ratios under each of the three declared matched-null definitions, the spread across those
      definitions has the reported magnitude with intervals, and the three nulls do or do not satisfy
      their closed-form mutual-spread prediction. WHAT DOES NOT FOLLOW: nothing about whether any
      geometry has genuine structure; no revision, correction or contradiction of any previously recorded
      excess, since no recorded cell is re-run and the contract computes a sensitivity rather than
      a replacement value; nothing about which null definition is correct, which the contract explicitly
      declines to decide; nothing about relation yield, relation rank, decomposition cost or linear-algebra
      cost; nothing about sizes or geometries not tested; and no attack, break, speedup or security
      consequence. A large measured spread supports only that single-null excess reporting is under-specified
      at these parameters.'
  inputs:
    procedure: 'STAGE 0, closed forms (cost: 1 human hour, no compute). Derive, before any run, the
      expected mutual spread among the three nulls from the deduplication collision rate and the negation
      collision rate at each tested size, and freeze it. STAGE 1, curves (cost: seconds). Generate
      prime-order toy curves via harness/toycurve.py, verify order, Hasse membership and generator
      order, and screen out any curve with automorphisms beyond negation. STAGE 2, geometries (cost:
      seconds). Build four bases spanning the collapse range plus the collapse-fraction-1.0 control
      and the negation-doubled control, recording nominal size, effective size and collapse fraction
      for each. STAGE 3, nulls (cost: seconds). Draw the three matched random nulls per cell in the
      same process under recorded seeds. STAGE 4, coverage (cost: dominant, order N times B squared
      per base). Exact multiset-sum counting over the complete target space for every base and every
      null, with the closed-form total check on each. STAGE 5, consistency (cost: minutes). Compare
      the measured mutual spread among the nulls with the frozen closed form; halt if it disagrees.
      STAGE 6, report (cost: 1 human hour). Emit the table with three excess columns, intervals, collapse
      fractions and residuals.'
    instrument: Python 3 with harness/toycurve.py for exact curve arithmetic, point generation, negation
      and discrete-logarithm tables; numpy for count vectors and the bootstrap; harness/runner.py
      for run manifests, recorded seeds and the inference block. The three null samplers share one
      code path parameterised only by target size, which is enforced by a test asserting they are
      the same function. No Sage, no solver, no timing in the measurement path.
    parameters: 'Curves: 4 generated prime-order toy curves per size, screened for automorphisms beyond
      negation. Sizes: N near 2^12, 2^14 and 2^16. Nominal base size: B equal to ceiling of (6N) to
      the one-third power. Arity: m equal to 3. Geometries: 4 spanning the collapse range, plus 2
      controls (collapse fraction 1.0 by construction, and negation-doubled). Nulls: 3 per cell. Seeds:
      4 per cell. Target space: complete, no sampling. Cells: 6 bases times 3 nulls times 3 sizes
      times 4 curves times 4 seeds equals 864 coverage computations, of which one third are null cells
      reusable across geometries at the same size and seed.'
  controls:
  - Closed-form mutual-spread check among the three nulls, computed before the run and verified after.
  - A geometry with collapse fraction exactly 1.0 by construction, for which the three nulls must
    agree within interval width.
  - A deliberately negation-doubled base - every element paired with its negation - which must show
    the maximum possible divergence between nominal and effective size.
  - 'Closed-form total check per cell: summed multiset count equals binomial(B_eff + m - 1, m) exactly.'
  - Identical sampler, identical seed discipline and identical coverage code across all three nulls,
    run in one process.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null objects here are the three matched random bases themselves,
    and the control that makes the comparison meaningful is a CONSISTENCY CHECK among them: a random
    base has collapse fraction determined only by the birthday-style collision rate at size B in a
    group of order N, so the three nulls must differ from each other by a predictable and small amount,
    computable in closed form before the run. For the signal arm to mean anything, the three nulls
    measured against each other must reproduce that closed-form spread within intervals; if they do
    not, the samplers differ in some way other than size and the whole comparison is void. A second
    control is required: a geometry with collapse fraction exactly 1.0 by construction, for which
    all three nulls must give identical excess to within interval width. If they do not, the null
    construction itself carries a size-independent bias.'
  independent_variables:
  - matched-null definition (nominal, effective, multiset-count)
  - geometry, spanning the negation-collapse range
  - group size N
  - curve instance and seed
  metrics:
    primary:
    - exact coverage per base and per null
    - excess ratio under each of the three null definitions, with bootstrap interval
    - spread across the three excess ratios per geometry
    - negation-collapse fraction per geometry
    - closed-form mutual-spread residual among the three nulls
    secondary:
    - nominal, effective and multiset-count sizes per base
    - closed-form total residual per cell
    - collapse-fraction-1.0 control spread
    - negation-doubled control divergence
    - interval half-width per cell, for comparison against the spread
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The spread in measured coverage excess across the three matched-null definitions, per
      geometry and per size.
    formula: 'For a geometry G at size N let e_nom, e_eff and e_mult be its coverage excess ratios
      against the matched-nominal, matched-effective and matched-multiset-count nulls. The spread
      is the maximum of the three minus the minimum. Predicted: spread at least 0.01 for geometries
      whose negation-collapse fraction is at most 0.55; spread below the interval half-width for the
      collapse-fraction-1.0 control; and the mutual spread among the three nulls themselves equal
      to the frozen closed-form prediction within its interval. The collapse fraction is defined as
      effective distinct-group-element count after negation collapse and deduplication, divided by
      nominal listed size.'
    source: Pre-registered in the parent proposal IDEA-20260816-5ea9b4 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are N near 2^12 to 2^16 with nominal B from 29 to 46 and arity
      3, on 4 screened prime-order curves per size with 4 seeds, exact counting over the complete
      target space. Transfer assumptions, stated: the negation-collapse mechanism is exact arithmetic
      and transfers to any size, but the MAGNITUDE of the induced excess spread depends on how close
      coverage sits to saturation and therefore does not transfer - at larger N the three definitions
      may separate more or less and the contract does not extrapolate. Deduplication collision rates
      are size-dependent and are computed per size rather than assumed. Nothing here is claimed at
      cryptographic scale, and the frozen battery''s 2^18 cells are outside the tested range, so any
      statement about their exposure to null-choice spread is an unverified transfer the contract
      must label as such.'
    correspondence: null
  tail_checks:
  - The negation-doubled control, where nominal and effective size diverge maximally.
  - The collapse-fraction-1.0 control, where all three definitions must coincide.
  - The smallest tested size, where the closed-form mutual spread among nulls may fall inside interval
    width and make the consistency check vacuous.
  - Any curve found during screening to carry automorphisms beyond negation, which must be excluded
    and reported rather than silently kept.
  - The geometry with the largest measured spread, recomputed independently with a fresh seed set.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - 'Halt and report if the measured mutual spread among the three nulls disagrees with the frozen
    closed form beyond its interval: the samplers are not comparable.'
  - Halt and report if the collapse-fraction-1.0 control shows spread beyond interval width.
  - Halt and report if any closed-form total residual is nonzero.
  - Per-cell wall-clock budget of 1800 seconds and total budget of 120 cell-hours; exceeded cells
    are recorded infeasible, which is not negative mathematical evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The three nulls reproduce their frozen closed-form mutual spread, the collapse-fraction-1.0
    control shows no spread beyond interval width, every closed-form total residual is zero, and the
    run reports for each geometry at each size the three excess ratios with intervals, the spread,
    and the negation-collapse fraction - whether the spread turns out large or negligible.
  falsification_criterion:
  - The three nulls do not reproduce their frozen closed-form mutual spread.
  - The collapse-fraction-1.0 control shows spread beyond interval width, indicating a size-independent
    bias in null construction.
  - All three null definitions agree within intervals for every geometry at every tested size, refuting
    the claim that null choice matters at these parameters.
  - Any closed-form total residual is nonzero.
  - The negation-doubled control fails to show maximal divergence, indicating the effective-size computation
    is wrong.
  - Curve screening admits a curve with extra automorphisms, making the negation account incomplete
    for that cell.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-5ea9b4
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The closed-form mutual spread among the three nulls must be derived and frozen before STAGE 1;
    it is specified as a required output of STAGE 0 but is not derived in this draft.
  - Whether the matched-multiset-count null should match binomial(B_eff + m - 1, m) or binomial(B_nom
    + m - 1, m) is itself a third-level choice a Coordinator must fix, since the counting identity
    is stated in terms of distinct group elements.
  - The trimming rule interacts with negation collapse and its interaction is not derived; a Coordinator
    should require the trimming rule to be applied before or after collapse consistently and state
    which.
  - Whether any statement may be made about the frozen battery's 2^18 cells, which lie outside this
    contract's tested range, or whether the contract must add a 2^18 arm to say anything about them.
