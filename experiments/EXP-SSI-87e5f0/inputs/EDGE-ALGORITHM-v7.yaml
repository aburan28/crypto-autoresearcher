edge_algorithm:
  id: EDGE-ALGORITHM-v7
  format: EDGE-ALGORITHM-v7
  status: design_manifest_no_implementation
  version: 7
  typed_body: >-
    Tag-32 payload is field_model(bytestring)||opcode_count(u16)||opcode_table||
    witness_equation_count(u16)||witness_equations(bytestring)||
    transcript_schema(bytestring)||implementation_digest(32)||algorithm_digest(32).
    Each opcode table row is opcode(u8)||operand_count(u8)||operand_widths(bytestring)||
    output_width(u16)||foe_code(u8)||operation_code(u8), with operation_code in
    the finite v13 table FIELD_ADD=1, FIELD_MUL=2, FIELD_INV=3, CURVE_EVAL=4,
    KERNEL_POINT=5, ISOGENY_PUSH=6, MATRIX_ENTRY=7, WITNESS_ASSERT=8, or
    TRANSCRIPT_HASH=9. Each witness equation is
    equation_id(u16)||instruction_count(u16)||instruction records, and each
    instruction is opcode(u8)||destination(u16)||argument_count(u8)||
    argument_indices(argument_count*u16)||result_width(u16), over source curve
    id, destination curve id, degree, factors, kernel points, pushforward
    points, and matrix entries; free-form equation names are invalid.
    The final algorithm_digest is the complete tag-32 frame without itself.
  required_relations:
    - field_add and field_mul use fixed p-row widths and canonical reduction
    - field_inv rejects zero and records the exact extended-gcd transcript
    - curve_evaluation and kernel construction serialize all operands and outputs
    - isogeny_pushforward recomputes destination curve id and endpoint images
    - witness equations bind every transition and changed matrix row
    - transcript digest chains every intermediate value and operation
  implementation:
    implementation_digest: null
    source_tree_commit: null
    independent_edge_replay_receipt: null
  admission:
    materialized: false
    missing_implementation_or_replay_is: INVALID_CERTIFICATE
    freeze_allowed: false
