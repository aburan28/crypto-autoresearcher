incumbent:
  id: INCUMBENT-BASELINE-v2
  format: INCUMBENT-BASELINE-v2
  status: design_manifest_no_measurement
  source_commit: null
  advice_scope_code: null
  preprocessing_scope_digest: null
  setup_foe: null
  query_foe: null
  setup_bytes: null
  query_bytes: null
  memory_bytes: null
  q_convention: null
  baseline_digest: null
  typed_comparison_rule: >-
    Tag-33 payload is source_commit(bytestring)||advice_scope_code(u8)||
    preprocessing_scope_digest(32)||setup_foe(signed560)||query_foe(signed560)||
    setup_bytes(u64)||query_bytes(u64)||memory_bytes(u64)||q_convention(bytestring)||
    baseline_digest(32)||incumbent_digest(32). q* is defined only when both
    scopes match and q*=(successor_setup-incumbent_setup)/
    (incumbent_query-successor_query) has positive denominator and verified
    finite numerator/denominator. Null fields block comparison.
  admission:
    materialized: false
    independent_verification_receipt: null
    missing_baseline_is: INVALID_INCUMBENT
    freeze_allowed: false
