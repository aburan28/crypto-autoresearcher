control_reference:
  id: C-PAIR-REF-v7
  format: C-PAIR-REF-v7
  status: design_manifest_no_measurement
  experiment_id: EXP-SSI-87e5f0
  seed_schedule:
    seed_frame: >-
      SHA256(DOMAIN-v7 code=60 body_schema=1 over advice_digest||replicate_index(u64)).
      Replicate indices are exactly 0..31.
    replicate_count: 32
    seed_list_encoding: replicate_index(u64)||seed(32), ascending index order
    seed_list_digest: SHA256(concatenation of complete seed derivation frames)
  endpoint_universe: >-
    The control endpoint universe is a fixed typed list in this manifest. It is
    not inferred from treatment rows and cannot contain provider or source-path
    fields. Endpoint indices are unique and sorted before the row generator.
  generator: >-
    For each seed, hash-rank the fixed endpoint list with DOMAIN-v7 code=61,
    select the declared endpoint_count, reject duplicates, and serialize the
    exact owner/order/helper/index/trace inputs. The endpoint list, count, and
    selection rule are inputs to c_pair_digest.
    row_frame: >-
      C-PAIR-ROW-v7 is raw 385 bytes: row_tag(u8=28)||replicate_index(u64)||
    seed(32)||owner_set_digest(32)||endpoint_set_digest(32)||helper_digest(32)||
    index_digest(32)||trace_digest(32)||terminal_code(u8)||attempt_count(u64)||
    success_bit(u8)||total_foe(signed560)||memory_peak(signed560)||row_digest(32).
      row_digest is SHA256 of the raw 385-byte row with only row_digest omitted.
  finite_table: >-
    The table is exactly 32 ordered complete rows followed by
    table_digest=SHA256(concatenation of those complete rows). A row or table is
    not present in this design-only record.
  admission:
    measured_rows_present: false
    independent_verification_receipt: null
    missing_reference_is: INVALID_CONTROL
    freeze_allowed: false
