experiment:
  id: EXP-MONO-917e3a
  version: 1
  status: completed
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-09-04'
  hypothesis_id: H-MONO-93bc4d
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  coordinator_approval_rationale: >-
    APPROVED AND EXECUTED IN THE SAME ACT, per the same precedent as
    DEC-20260904-8c2580's D-5 check: this is a zero/near-zero-compute
    mathematical verification (Stage 0 conceptual check plus Stage 1
    explicit witness computation from IDEA-20260904-0417a5's own named
    minimal_test), not a sampled experiment requiring separate Executor
    dispatch. The frozen contract and the completed run are recorded
    together; independent review (Stage 2, required before any citation
    of HEUR-KUM-2 as discharged) is dispatched separately after this
    snapshot archives.

  title: >-
    Stage 0-1 verification of a candidate proof that HEUR-KUM-2 reduces to
    an elementary translation-action freeness fact, with explicit witnesses
    at m=4 and m=5

  what_this_is_not:
    - Not a discrete-logarithm computation, not an ECDLP attack, not relation collection.
    - Not an ECDLP cost, runtime, exponent, or cryptographic-scale claim.
    - >-
      Not, by itself, a change to H-MONO-45183a's own status or to
      HEUR-KUM-2's own recorded status in that record -- this experiment's
      results feed a Coordinator decision after independent review, per
      AGENTS.md rule 1 (only the Coordinator changes hypothesis status,
      and only after the review this contract's own next step requires).
    - >-
      Not a claim about arithmetic monodromy at any fixed finite prime;
      the witnesses are proof devices (existence witnesses for a
      polynomial non-vanishing statement), not statistical samples of
      per-prime behavior.

  claim_ceiling:
    tier: derivation
    exact_scope_a_run_could_support: >-
      At most: whether the specific witness computations described exist
      and are correct (a mechanical, zero-tolerance check), and whether
      those witnesses' root-distinctness counts match EV-MONO-efbd1c's
      own previously-reported G8 values. The GENERIC (indeterminate-point)
      claim itself rests on the specialization-witness proof technique
      applied to these witnesses, not on the witnesses' own numeric
      content beyond existence and correctness.
    what_no_outcome_can_support: >-
      No outcome from this contract alone establishes HEUR-KUM-2 as
      officially discharged -- that requires the independent Stage 2
      review this contract's own next_step names. No outcome supports any
      relation-rate, cost, exponent, or arithmetic-monodromy-at-fixed-p
      claim.

  inputs:
    mechanism_under_test: >-
      IDEA-20260904-0417a5's own four-step derivation (translation-action
      faithfulness reduction; faithfulness as a torsion statement; why the
      torsion condition fails generically with the honest |S|>=2 gap
      named; the S_{m-1}->Aut(V) injectivity argument). Read that record's
      own `mechanism` field for the full text; not restated here verbatim.
    witness_construction: >-
      For arity m, draw m-1 points on a chosen curve E/F_p by scanning
      x-coordinates from a starting value, rejecting 2-torsion points
      (y=0). Compute all 2^{m-2} signed sums (eps_1=+1 fixed, eps_2..
      eps_{m-1} free) via standard elliptic-curve point addition. A
      witness is CLEAN if all 2^{m-2} resulting x-coordinates are pairwise
      distinct.
    curves_tested: >-
      m=4: (p=101,A=2,B=3) and (p=211,A=5,B=7), both curves independently
      chosen, both producing clean witnesses on the first attempt. m=5:
      (p=101,A=2,B=3), two point-choices tried (xstart=2, collision;
      xstart=17, clean) -- the collision is disclosed, not discarded.

  stage_order:
    stage_0:
      name: proves-too-much conceptual control (Q2)
      description: >-
        Confirm the reduction's key genericity step does NOT apply on the
        factor-base sublocus, where the conclusion (no signed subset sum
        in E[2]) is known FALSE (Part B's own B-1 criterion, rate
        6(tau-1)/N at m=4). Performed by direct logical inspection: the
        argument's own text invokes "since the x_i are indeterminates" as
        the load-bearing step; on the factor-base locus the x_i are
        specific rational values, not indeterminates, so the argument does
        not apply there at all. The control is satisfied.
      result: passed
    stage_1:
      name: explicit freeness witnesses (Q3)
      description: >-
        Compute, by direct curve arithmetic, at least one clean witness at
        m=4 and at least one at m=5. See raw-result.json for the exact
        curves, points, and root sets.
      result: passed_both_arities
    stage_2:
      name: independent review (required before citation)
      description: >-
        NOT PERFORMED IN THIS CONTRACT. Per this record's own claim_ceiling
        and per IDEA-20260904-0417a5's own minimal_test, a blind
        re-derivation of the reduction -- starting from the statement of
        the reduction and the parameters alone, never reading this
        record's or the idea's own argument text -- is required before
        HEUR-KUM-2 is cited anywhere as discharged. Dispatched as the next
        step after this snapshot archives.

  metrics:
    primary:
      - "M1: does a clean m=4 witness exist? (yes/no, with the exact witness recorded)"
      - "M2: does a clean m=5 witness exist? (yes/no, with the exact witness recorded)"
    secondary:
      - "M3: do the witnesses' distinct-root counts match EV-MONO-efbd1c's G8 (4 and 8)?"
      - "M4: does the proves-too-much control correctly fail to apply on the factor-base locus?"

  preregistered_prediction:
    - quantity: M1, M2
      value: "At least one clean witness exists at each of m=4 and m=5."
      formula: n/a (existence claim, per the mechanism's own Step 3 repair).
      source: IDEA-20260904-0417a5 mechanism Step 3.
    - quantity: M3
      value: "4 and 8 exactly."
      formula: 2^{m-2} at m=4 and m=5.
      source: EV-MONO-efbd1c's own reported G8 counts.

  replication:
    planned_runs: 1
    seeds: not_applicable
    interpretation: >-
      Deterministic. Every witness is exactly reproducible by re-running
      implementation/witness_search.py; no seed variation is meaningful.

  budget:
    maximum_runs: 1
    maximum_wall_seconds: 60
    maximum_cpu_seconds: 60
    maximum_peak_rss_bytes: 67108864
    maximum_total_disk_bytes: 10485760
    maximum_workers: 1
    no_network: true

  environment_preconditions:
    consequence: NO CAS AND NO SOLVER IS REQUIRED. Pure Python only.
    if_a_precondition_fails: >-
      A missing interpreter or an arithmetic exception is
      `failed_infrastructure`, never negative mathematical evidence
      (AGENTS.md rule 3).

  infrastructure_failure_disposition: >-
    Any crash is recorded with its exact cause and classified
    `failed_infrastructure`. Supports and weakens NOTHING about
    H-MONO-93bc4d or H-MONO-45183a.

  stopping_rules:
    - Do not execute unless separately reviewed, approved, frozen and authorized. (Satisfied here.)
    - A witness-search collision is disclosed, not silently retried away.
    - No status change to H-MONO-45183a or HEUR-KUM-2 without independent Stage-2 review.

  invalidation_rules:
    - Any execution while frozen, execution_authorized or evidence_eligible is false.
    - Any silent discarding of a disclosed collision.
    - Any citation of HEUR-KUM-2 as discharged before Stage 2's independent review completes.

  success_criterion: >-
    A run is well-formed evidence if: the proves-too-much control's own
    outcome is reported plainly; both arities' witness searches are
    reported exactly, including any disclosed collision; and the
    consistency check against EV-MONO-efbd1c's own G8 counts is reported.

  falsification_criterion: >-
    No clean witness exists at m=4 or m=5 under a correct, sufficiently
    exhaustive search (not merely an unlucky first choice); or the
    witnesses' distinct-root counts contradict EV-MONO-efbd1c's own G8
    values.

  outcomes:
    stage_0_1_pass_pending_stage_2: >-
      Both stages passed as reported here. The hypothesis's own status
      remains `proposed` pending the required independent review; this
      record does not itself authorize any citation of HEUR-KUM-2 as
      discharged.
    infrastructure_or_integrity_failure: See infrastructure_failure_disposition.

  scale_relevance:
    tier: derivation
    why_conclusions_transfer_or_do_not: >-
      The generic (indeterminate-point) claim, if it survives Stage 2,
      transfers to every characteristic-greater-than-3 field and every
      non-singular curve by construction (the derivation makes no
      curve-specific or field-specific assumption beyond char > 3). The
      witnesses themselves establish existence only, at the two specific
      arities tested (m=4, m=5); m=3 and m>=6 are not tested here (m=3's
      own case is separately already settled per H-MONO-0b3def/OBS-2, and
      the idea's own falsification condition G5/G6 names m>=6 as untouched
      by this record).

  required_artifacts_if_later_authorized:
    - Frozen approved specification (this file).
    - implementation/witness_search.py, independently reproducible.
    - Run manifest, command, environment, raw-result.json.
    - Independent Stage-2 review (Validator + Red Team), dispatched next.

  approval_requirements:
    - This contract IS IDEA-20260904-0417a5's own named Stage 0-1 minimal_test, executed directly per the low-compute precedent established at DEC-20260904-8c2580.
    - Independent review (Stage 2) must blindly re-derive the reduction from the statement and parameters alone before HEUR-KUM-2 is cited as discharged anywhere.

  approval_status: >-
    APPROVED AND EXECUTED 2026-09-04 by the Coordinator; see
    `coordinator_approval_rationale` above.

  source_refs:
    - ledger/proposals/IDEA-20260904-0417a5.yaml
    - ledger/hypotheses/H-MONO-93bc4d.yaml
    - ledger/hypotheses/H-MONO-45183a.yaml
