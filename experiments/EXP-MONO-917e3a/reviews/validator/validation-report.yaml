  # =====================================================================
  # BLIND RE-DERIVATION (blind_rederivation.assigned_to = validator)
  # =====================================================================
  blind_rederivation:
    quantity: The translation-action-freeness reduction and its torsion criterion
    blind_from_respected: true
    blind_from_declared:
      - ledger/proposals/IDEA-20260904-0417a5.yaml
      - ledger/hypotheses/H-MONO-93bc4d.yaml
