    chronology_attested:
      derivation_locked_to_disk_at: '2026-09-04T20:41:00Z'
      locked_artifact_sha256: b91ec7ef7abe74e8229176197eba0d4c8874c975d825d2c9a5ec263bddd8cb28
      first_read_of_H_MONO_93bc4d_at: '2026-09-04T20:45:54Z'
      first_read_of_IDEA_20260904_0417a5_at: '2026-09-04T20:46 (immediately after H-MONO-93bc4d)'
      witness_search_py_read: false
      note: >-
        The J1 derivation below and ALL J2 computation (independent
        implementation, the three witness recomputations, the negative
        controls, the decay control and the quantifier probe) were completed
        and written to disk BEFORE 20:45:54Z, i.e. before any of the
        blind_from records was opened. witness_search.py was never opened at
        any point; it is excluded here by both the review plan and the task
        brief. Only inputs read before locking: agents/validator.md, AGENTS.md,
        and the task card TASK-20260904-cb0cb2.yaml (which restates A-1/A-2).

    imported_without_reproof:
      - "(G1) deg_T S_m = 2^{m-2} with nonzero leading coefficient."
      - "(G2) roots of S_m in T are exactly x(sum eps_i P_i) over eps in {+-1}^{m-1}."
      - "(G3) x(-Q)=x(Q); index set V = F_2^{m-1}/<diag>, |V| = 2^{m-2}."
      - "(G4) the Galois group embeds in V and acts by translation."

    my_derivation_part_a_equality_condition: |
      SETUP. K = k(x_1..x_{m-1}), f(x)=x^3+Ax+B, M = K(y_1..y_{m-1}) with
      y_i^2 = f(x_i), P_i = (x_i,y_i).  phi : V -> kbar, phi([eps]) =
      x(sum_i eps_i P_i);  R := phi(V) the set of DISTINCT roots, |R| <= |V|.

      (1) THE ACTION IS WELL DEFINED AND ALWAYS TRANSITIVE.
      The f(x_i) are pairwise non-associate non-squares in K^* in distinct
      variables, so the m-1 quadratic extensions are linearly disjoint and
      W := Gal(M/K) = F_2^{m-1} acts by P_i -> +-P_i.  Every root lies in M,
      so the splitting field L satisfies K <= L <= M and Gal(L/K) = W/Gal(M/L).
      diag sends sum eps_i P_i to its negative and x(-Q)=x(Q), so diag fixes
      every root and lies in Gal(M/L).  Hence

          G := Gal(L/K)  =  V/N,   N := Gal(M/L)/<diag>.

      (V is elementary abelian 2, so "quotient of V" and the record's "embeds
      in V" agree on cardinality, which is all I use.)  Because W acts by FIELD
      automorphisms, w.phi([eps]) = phi([eps]+[w]) is well defined on R and
      phi : V ->> R is V-equivariant.  Therefore V acts TRANSITIVELY on R,
      UNCONDITIONALLY.  Transitivity is free; it is not the content of the claim.

      (2) FAITHFUL <=> FREE <=> REGULAR, BECAUSE V IS ABELIAN.
      V abelian and transitive on R => all point stabilisers are equal
      (Stab(w.r) = w Stab(r) w^-1 = Stab(r)); the common stabiliser N is the
      kernel of V -> Sym(R).  So faithful <=> N=0 <=> no nonzero [w] fixes any
      root <=> free; and transitive + free = simply transitive = the REGULAR
      representation of V.  "Faithful" and "free" are interchangeable here
      precisely because the group is abelian and already transitive.

      (3) EQUALITY AND IRREDUCIBILITY.   |R| = |V|/|N| = 2^{m-2}/|N|.
        (i)  free (N=0): |R| = 2^{m-2} = deg_T S_m, so by (G1)+(G2)
             S_m = c * prod_{[eps]}(T - phi([eps])) with pairwise distinct
             roots; S_m is SEPARABLE, the Galois action is transitive on its
             full root set, so S_m is IRREDUCIBLE over K, [L:K] = 2^{m-2}, and
             G = V = (Z/2)^{m-2} acting by the regular representation.
        (ii) not free (N != 0): the distinct roots form ONE orbit of size
             2^{m-2}/|N| < 2^{m-2}; the squarefree part of S_m is irreducible
             of that smaller degree and S_m is a proper power of it, hence
             REDUCIBLE (non-squarefree), and G = V/N is a PROPER quotient.

      CONCLUSION (a).  Containment in V plus the translation action yields the
      FULL group V -- equivalently S_m irreducible over K with monodromy exactly
      (Z/2)^{m-2} -- IF AND ONLY IF the action is free (= faithful), IF AND ONLY
      IF the 2^{m-2} sign-class values are PAIRWISE DISTINCT.  Irreducibility of
      S_m and freeness of the V-action are THE SAME STATEMENT.  The only thing
      that can go wrong is root COLLISION; intransitivity is impossible.

    my_derivation_part_b_torsion_criterion: |
      Fix a base class [eps] and a nonzero [w] in V.  A representative w has
      support S; the other representative w+diag has support S^c; [w] != 0 iff
      S is a nonempty PROPER subset of {1..m-1}.  Put
          Q_S  = sum_{i in S}    eps_i P_i,
          Q_S' = sum_{i notin S} eps_i P_i.
      Then phi([eps]) = x(Q_S + Q_S') and phi([eps]+[w]) = x(Q_S' - Q_S).
      On an elliptic curve x(U) = x(U') iff U = U' or U = -U'.  Hence

          [w] fixes phi([eps])
            <=> Q_S + Q_S' =  (Q_S' - Q_S)   <=>  2 Q_S  = O
             or Q_S + Q_S' = -(Q_S' - Q_S)   <=>  2 Q_S' = O

          *** [w] fixes a root  <=>  2Q_S = O or 2Q_S' = O
              <=>  Q_S in E[2]  or  Q_{S^c} in E[2]   (E[2] contains O). ***

      Manifestly symmetric in S <-> S^c, as required since w and w+diag are the
      same class.  FREENESS CRITERION: the action is free iff for every nonempty
      PROPER subset S and every sign vector eps,  sum_{i in S} eps_i P_i is NOT
      in E[2].  (Only signs on S matter, and flipping all of them negates the
      sum, which E[2] is invariant under.)  In the generic setting all
      stabilisers are equal, so it suffices to test eps = all-plus; AT A
      SPECIALIZATION THAT REDUCTION IS INVALID and all pairs must be tested.

      BOOKKEEPING THE RECORD SHOULD CARRY:
        - E[2] = {O} union {(x,0)}.  "Q_S in E[2]" is "Q_S = O OR y(Q_S) = 0".
          The O branch is NOT captured by "y(Q_S)=0" -- y(O) is undefined, not
          zero.  This branch is not academic: it is the branch that causes this
          run's own disclosed collision (see J2 finding F4).
        - S = the FULL set is EXCLUDED ([w]=0); the full signed sum being in
          E[2] causes no collision.  A criterion phrased as "no nonempty signed
          subset sum lies in E[2]" is therefore strictly STRONGER than needed --
          correct, but not tight.
        - Any witness computation must check no signed sum is O before comparing
          x-coordinates, since x(O) is undefined.

    my_derivation_part_c_why_it_holds_generically: |
      THIS IS THE STEP THE RECORD LEAVES OPEN FOR |S| >= 2.  I derive it for all
      |S| >= 1 uniformly, with no witness required.

      For nonempty S and signs eps let  sigma_{S,eps} : E^{m-1} -> E,
      (P_1..P_{m-1}) |-> sum_{i in S} eps_i P_i.  Pick j in S.  Fixing the other
      coordinates, P_j |-> sum_{i in S} eps_i P_i is (translation by a constant)
      composed with (+-1): an ISOMORPHISM of E.  Hence sigma_{S,eps} is
      SURJECTIVE and every fibre has dimension m-2.  E[2] is finite (4 geometric
      points if char != 2).  Therefore

          B_{S,eps} := sigma_{S,eps}^{-1}(E[2])   is closed of dimension
          m-2 < m-1, a PROPER closed subvariety of E^{m-1}.

      E is geometrically irreducible, so E^{m-1} is irreducible, so its generic
      point lies in no proper closed subvariety.  The bad locus B = union over
      the finitely many (S,eps) of B_{S,eps} is still proper closed.  The generic
      point of E^{m-1} IS ((x_i,y_i))_i over M.  Hence for ALL nonempty proper S
      and ALL eps, sum_{i in S} eps_i P_i is not in E[2] at the generic point:
      the action is FREE, and S_m is irreducible over K with monodromy exactly
      V = (Z/2)^{m-2}.

      PROPERTIES OF THIS ARGUMENT THAT MATTER FOR THE REVIEW:
        - It is UNIFORM in |S|.  |S| = 1 and |S| >= 2 are the same argument.
          The record's named |S| >= 2 gap does not need a separate treatment and
          does not need a numerical witness.
        - The "dominance of the summation map" the record names as the missing
          ingredient is exactly the one-line fact above (an isomorphism in the
          j-th coordinate), so the gap is closable in one line.
        - It is valid CURVE-BY-CURVE over any base field, using only "E is a
          geometrically irreducible elliptic curve" and "E[2] is finite".  It
          does NOT require A,B to be indeterminates.  This is the decisive
          difference from the witness route (J2 finding F3).
        - The geometric statement follows identically over kbar, so arithmetic
          and geometric monodromy are both exactly V.

    proves_too_much_control_on_my_own_derivation:
      required_by_plan: >-
        A re-derivation that would ALSO prove freeness on the factor-base
        sublocus (where freeness is known FALSE) is itself flawed.
      result: passes
      detail: >-
        Genericity enters my derivation in exactly one place and it is
        load-bearing: step (1), where W acts by FIELD automorphisms of M. On the
        factor-base sublocus the x_i are specific rational values, there is no
        such action, phi is a bare map of sets with no equivariance, and the
        "all stabilisers are equal" step of (2) collapses. My derivation
        therefore yields NOTHING there, which is the required failure signature.
        I verified the collapse concretely rather than asserting it, by
        constructing a specialization where the stabilisers are genuinely
        UNEQUAL: m=4, P_1 = P_2 = P with P and 2P not 2-torsion. Then
        phi([100]) = phi([010]) = x(P_3) (a collision), yet the stabiliser of
        phi([000]) computed from the Part (b) criterion is TRIVIAL. So at a
        specialization one MUST test all C(2^{m-2},2) pairs, not the stabiliser
        of one root. Executed as CONTROL 1 in validator_controls.py; the
        detector fires as predicted.
      stronger_statement: >-
        My criterion does not merely fail to prove the false conclusion on the
        factor-base sublocus -- it PREDICTS the collisions there quantitatively.
        See the decay control under J2 (metric_recomputations M9).

  # =====================================================================
  # J1 -- COMPARISON AGAINST THE RECORD (read only after locking the above)
  # =====================================================================
  j1_comparison:
    verdict_on_joint: holds
    summary: >-
      The record's CONCLUSION and its TORSION CRITERION agree exactly with my
      independent derivation. Two defects in the stated justification, neither
      of which changes the final answer, and one mischaracterisation of the
      remaining gap which understates what the record has actually proved.

    agreements:
      - id: A1
        item: Reduction target (Step 1)
        finding: >-
          AGREES. The record identifies faithfulness of the translation action
          as the exact condition for equality, and concludes irreducibility plus
          monodromy exactly (Z/2)^{m-2}. Identical to my Conclusion (a).
      - id: A2
        item: Torsion criterion (Step 2)
        finding: >-
          AGREES EXACTLY, including the derivation route (x(A)=x(B) iff A=+-B,
          applied to Q_S + Q_S' versus Q_S - Q_S'). The record's two cases are
          swapped relative to mine (its "+" branch gives 2Q_S'=O where mine
          gives 2Q_S=O) because it brackets (Q_S - Q_S') where I bracket
          (Q_S' - Q_S); the DISJUNCTION "2Q_S = O or 2Q_S' = O" is identical and
          the swap is cosmetic, not an error.
      - id: A3
        item: m=3 behaviour
        finding: >-
          AGREES with my pre-registered prediction P4: V of order 2, roots
          x(P_1 +- P_2), group Z/2 acting on TWO ROOTS of S_3. My derivation
          reproduces this without special-casing.

    discrepancies:
      - id: D1
        severity: moderate -- text defect, conclusion unaffected
        location: IDEA-20260904-0417a5 mechanism, STEP 1
        record_says: >-
          "Containment plus a translation action gives equality as soon as the
          action is FAITHFUL, because a faithful translation action of a group
          on itself is regular and therefore transitive, and transitivity is
          exactly irreducibility."
        my_finding: >-
          The conclusion is right but the stated reason misidentifies the
          load-bearing implication, in two ways.
          (i) A translation action of a group ON ITSELF is regular and
          transitive ALWAYS -- faithfulness is automatic for the regular action
          and buys nothing. The action actually at issue is V on the ROOT SET R,
          which is a quotient phi : V ->> R of the index set; and on R the action
          is transitive UNCONDITIONALLY (my step 1). So transitivity is not what
          faithfulness purchases. What faithfulness purchases is INJECTIVITY of
          phi, i.e. |R| = 2^{m-2} = deg_T S_m.
          (ii) "transitivity is exactly irreducibility" is FALSE as stated
          without a separability hypothesis. Transitivity on the set of DISTINCT
          roots gives irreducibility of the SQUAREFREE PART only; S_m itself is
          irreducible only if additionally deg_T S_m equals the number of
          distinct roots. The record's chain omits this degree count, which is
          precisely the step freeness supplies.
        why_it_matters: >-
          A reader following the record's chain would conclude that the danger
          is intransitivity, and would not see that the sole failure mode is
          root COLLISION (S_m becoming a proper power of its squarefree part).
          The whole experimental programme -- checking pairwise distinctness of
          roots -- is aimed at collision, so the text is misaligned with the
          record's own evidence. Repairable by inserting the degree count.
        recommended_repair: >-
          Restate as: the action of V on R is always transitive; freeness
          (= faithfulness, since V is abelian and transitive) is equivalent to
          |R| = |V| = deg_T S_m, which makes S_m separable and hence irreducible
          with Galois group exactly V.
      - id: D2
        severity: moderate -- omission with a demonstrated consequence
        location: IDEA-20260904-0417a5 mechanism, STEP 3
        record_says: >-
          "2 Q_S = O with S nonempty means Q_S in E[2], hence y(Q_S) = 0."
        my_finding: >-
          E[2] = {O} union {(x,0)}. "Q_S in E[2]" is "Q_S = O OR y(Q_S) = 0";
          y(O) is undefined, not zero. Step 3 silently drops the Q_S = O branch.
        why_it_matters: >-
          Not academic. This run's OWN disclosed m=5 collision is caused by
          exactly the dropped branch: P_2+P_3+P_4 = O (see J2 finding F4). A
          collision predictor built from the record's Step-3 formulation would
          fail to predict the record's own observed collision.
        recommended_repair: >-
          Carry E[2] as {O} union {y=0} throughout, or state the criterion as
          2Q_S = O (which the record's own Step 2 already does correctly) and
          never translate it to y(Q_S)=0.
      - id: D3
        severity: significant -- the record understates what it proved and
          overstates the route
        location: IDEA-20260904-0417a5 STEP 3 "THE HONEST GAP"; H-MONO-93bc4d
          heuristic_assumptions H1
        record_says: >-
          "for |S| >= 2 this argument needs 'the summation map is dominant onto
          E', or an explicit specialization witness. The cheapest repair is a
          SPECIALIZATION ARGUMENT."
        my_finding: >-
          The named missing ingredient -- dominance of the summation map -- is
          TRUE AND ELEMENTARY, and provable in one line: fixing all coordinates
          but one j in S, the map P_j |-> sum_{i in S} eps_i P_i is a translation
          composed with +-1, hence an isomorphism of E, hence sigma_{S,eps} is
          surjective and sigma^{-1}(E[2]) has dimension m-2 < m-1. The generic
          point of the irreducible variety E^{m-1} avoids it. This closes |S|>=2
          uniformly with |S|=1, for EVERY curve over EVERY field, with no witness.
        why_it_matters: >-
          The record chose the strictly weaker of the two repairs it names, and
          then claimed for it the scope that only the stronger one delivers (see
          J2 finding F3). The gap the record honestly flags is real as a gap in
          its own text, but it is one line from closed -- and closing it that way
          would make Stage 1 unnecessary for the generic claim and would make the
          record's stated universal scope actually correct.
        classification: >-
          This is a STRENGTHENING finding, not a break. My independent derivation
          reaches the record's own conclusion by a route that supports the
          record's own stated scope.

    net_j1_assessment: >-
      The reduction (translation-action faithfulness implies irreducibility) is
      CORRECT, and the torsion criterion is CORRECT and exactly as predicted by
      the review plan (2Q_S=O or 2Q_S'=O). The Coordinator's prior that Steps 1,
      2 and 4 are "fully rigorous on inspection" is upheld for Step 2; for Step 1
      I find the conclusion right but the written justification defective (D1).
      The Coordinator's moderate-confidence flag on Step 3 is vindicated as to
      there being an issue, but the issue is NOT the one the prior names -- see
      J2.

  # =====================================================================
  # J2 -- INDEPENDENT WITNESS VERIFICATION
  # =====================================================================
  j2_independent_witness_verification:
    verdict_on_joint: >-
      holds on the computations; breaks on the inference from those computations
      to the record's stated universal scope.
    independence_of_implementation:
      wrote_own_implementation: true
      read_producer_implementation: false
      artifacts:
        - experiments/EXP-MONO-917e3a/reviews/validator/validator_independent_check.py
        - experiments/EXP-MONO-917e3a/reviews/validator/validator_controls.py
      description: >-
        Affine Weierstrass arithmetic over F_p written from scratch, stdlib only,
        point at infinity as None, inversion by Fermat. Two INDEPENDENT routes to
        the same answer were implemented and cross-checked on every input: (R1)
        direct computation of the 2^{m-2} signed sums with eps_1 fixed to +1 and
        an all-pairs distinctness test; (R2) my own J1 torsion criterion, testing
        every nonempty proper subset S and every sign pattern on S for membership
        in E[2]. R2 is derived from my blind J1 work and is not present in the
        record's evidence at all, so agreement between R1 and R2 is an
        independent check on both my code and my derivation.

    code_core: |
      def add(self, P, Q):                      # F_p Weierstrass addition
          p = self.p
          if P is None: return Q
          if Q is None: return P
          x1, y1 = P; x2, y2 = Q
          if x1 % p == x2 % p and (y1 + y2) % p == 0: return None      # P = -Q
          if x1 % p == x2 % p and y1 % p == y2 % p:
              if y1 % p == 0: return None                              # 2-torsion
              lam = (3*x1*x1 + self.A) * pow(2*y1, p-2, p) % p
          else:
              lam = (y2 - y1) * pow((x2 - x1) % p, p-2, p) % p
          x3 = (lam*lam - x1 - x2) % p
          y3 = (lam*(x1 - x3) - y1) % p
          return (x3, y3)

      def sign_class_sums(E, pts):              # the 2^{m-2} sign classes
          n = len(pts); out = []
          for tail in product([1, -1], repeat=n-1):
              eps = (1,) + tail                 # eps_1 fixed to +1: a section of
              S = None                          # {+-1}^{m-1}/<diag>
              for e, P in zip(eps, pts):
                  S = E.add(S, P if e == 1 else E.neg(P))
              out.append((eps, S))
              return_guard = None
          return out

      def x_coords_distinct(E, pts):            # pairwise distinctness + O guard
          recs = sign_class_sums(E, pts)
          infinities = [eps for eps, S in recs if S is None]
          xs = [(eps, None if S is None else S[0]) for eps, S in recs]
          collisions = [(e1, e2, x1) for (e1, x1), (e2, x2)
                        in combinations(xs, 2) if x1 == x2]
          return (not collisions and not infinities), xs, collisions, infinities

      def torsion_criterion_violations(E, pts):  # my J1 criterion, route R2
          n = len(pts); bad = []
          for r in range(1, n):                  # nonempty PROPER subsets only
              for S in combinations(range(n), r):
                  for signs in product([1, -1], repeat=r):
                      if signs[0] == -1: continue    # global sign on S irrelevant
                      Q = None
                      for i, e in zip(S, signs):
                          Q = E.add(Q, pts[i] if e == 1 else E.neg(pts[i]))
                      if E.is_two_torsion(Q): bad.append((S, signs, Q))
          return bad
    code_note: >-
      The `return_guard = None` line in the transcribed sign_class_sums above is
      a transcription artifact of this YAML block and is not present in the
      executed file; see validator_independent_check.py for the exact code run.

