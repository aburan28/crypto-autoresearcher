    control_checks:
      - id: C0
        name: arithmetic self-test (positive control on my own implementation)
        method: >-
          Over p = 101, 211, 1009: Hasse bound on #E; and 300 random point
          triples per curve checked for commutativity, associativity, inverse,
          identity, and Lagrange (N*P = O).
        result: PASS on all three curves
      - id: C1
        name: negative control -- P_1 = P_2 must collide
