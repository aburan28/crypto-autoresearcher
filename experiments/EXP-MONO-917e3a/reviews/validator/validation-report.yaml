      - id: C2
        name: negative control -- P_1 in E[2] must collide
        method: m=4, points [(100,0), (5,21), (9,12)] on p=101
        expected: collision
        result: PASS -- two collisions detected; route R2 flags S={1}, |S|=1 branch
      - id: C3
        name: negative control -- P_1 + P_2 in E[2] by construction (|S|=2 branch)
        method: P_1=(5,21), P_2 = T - P_1 with T=(100,0); m=4 on p=101
        expected: collision
        result: PASS -- collision detected; confirms the |S|>=2 branch of the
          criterion is exactly what collides, which is the branch the record
          names as its open gap
      - id: C4
        name: positive control -- agreement of the two independent routes at scale
        method: 400 random point tuples on each of 5 (curve, arity) combinations
        result: PASS -- routes R1 and R2 agree on 2000/2000 tuples
      - id: C5
        name: falsifiability control -- the checker is not vacuously true
        method: exhaustive search over all 4-tuples of points on E/F_5 (A=1,B=1),
          where 8 distinct x-values cannot exist among 5 candidates
        result: PASS -- no clean witness found; cleanliness is a genuinely
          falsifiable property of the (curve, points) pair
      - id: C6
        name: proves-too-much control on my own re-derivation
        result: PASS -- see blind_rederivation.proves_too_much_control_on_my_own_derivation

    findings:
      - id: F1
        severity: none -- confirmatory
        finding: >-
          All three claimed witnesses reproduce EXACTLY under a fully independent
          implementation, including every individual root value and its
          sign-class label, and including the ordering in which they are
          recorded. All nine points lie on their stated curves. No signed sum is
          the point at infinity in any clean witness, so x is everywhere defined
          and the distinctness comparison is well posed. The producer's numbers
          are correct.
      - id: F2
        severity: none -- confirmatory, and it retires the Coordinator's stated worry
        finding: >-
          THE COORDINATOR'S STATED LOW-CONFIDENCE AREA IS UNFOUNDED, and I say so
          having tested it. The prior worries "that no hidden lower-dimensional
          degeneracy in the chosen curves/points could invalidate the inference",
          i.e. that the witness might not be "sufficiently generic". For the
          direction of inference actually used, NO GENERICITY OF THE WITNESS IS
          REQUIRED AT ALL. The inference is: a rational function F on the
          irreducible variety E^{m-1} that is nonzero at ONE closed point in its
          domain is not the zero function, hence is nonzero at the generic point.
          A witness sitting on the most degenerate sublocus imaginable is still a
          valid witness. Degeneracy can only manufacture a FALSE COLLISION (a
          dirty witness, which proves nothing and is simply retried), never false
          cleanliness. I checked the witness curves for specialness anyway
          (M6/M7): both are ordinary, neither has j = 0 or 1728, and the point
          orders are unremarkable. So the specialization step is sound, and it is
          sound for a reason stronger than the prior hoped for.
      - id: F3
        severity: HIGH -- this is the real gap, and it is not the one the prior names
        finding: >-
          QUANTIFIER-ORDER DEFECT BETWEEN THE WITNESS AND THE CLAIMED SCOPE.
          H-MONO-93bc4d and specification.yaml claim the result for "any field k
          with char k > 3, any non-singular E", and scale_relevance asserts it
          "transfers to every characteristic-greater-than-3 field and every
          non-singular curve by construction". What the witnesses actually
          establish is strictly less.
          A witness on E_0/F_101 proves, rigorously, that the roots are pairwise
          distinct at the generic point of E_0^{m-1} -- i.e. HEUR-KUM-2 FOR THAT
          ONE CURVE over F_101(x_1..x_{m-1}). To reach an arbitrary target curve
          E/k one must move to the universal family, where the discriminant is a
          polynomial D(A,B,x_*). A nonzero value at (A,B) = (2,3) proves only
          D is not identically zero in ALL variables, hence D(A,B,.) is nonzero
          for (A,B) OUTSIDE A PROPER CLOSED SUBSET of the (A,B)-plane, in all but
          finitely many characteristics. Specializing back to a FIXED (A_0,B_0)
          is not licensed: a specific curve of cryptographic interest could a
          priori lie on that bad locus, and the bad locus is a curve in the
          (A,B)-plane, so it carries roughly q rational points. Nonvanishing
          generically does not imply nonvanishing after fixing A and B. The
          record's H1 rigorous_support -- "a nonzero value at one point implies
          the function is not identically zero" -- is a true statement about the
          WRONG function: it is about D(A,B,x_*), while the claim needs
          D(A_0,B_0,x_*) for every admissible (A_0,B_0).
          This is exactly the "quantifier fidelity" failure in agents/validator.md
          proof-architecture check 6: a per-instance witness presented as one
          uniform witness.
        empirical_backing: >-
          I confirmed that witness-existence is a property of the (curve, field)
          and is decoupled from the generic statement's truth. Exhaustive search
          over every elliptic curve over F_11, F_13, F_17: 55/110, 59/156 and
          52/272 curves respectively admit NO clean m=4 witness over their own
          F_p; and at m=5 NO curve over F_7, F_11 or F_13 admits one. By my
          section-3 argument the GENERIC statement is nonetheless TRUE for every
          one of those curves. So a witness is neither necessary for the generic
          claim nor transferable between curves; its absence carries no
          information and its presence is scoped to the curve that carries it.
        consequence_and_remedy: >-
          The record's CONCLUSION is nevertheless TRUE at the claimed scope --
          just not by the route the record uses. My blind derivation's section 3
          proves it for every curve over every field in one line, via surjectivity
          of the summation map, which is precisely the "dominance" the record
          names as its missing ingredient and then declines to supply in favour of
          the witness. RECOMMENDED REMEDY: adopt the dominance argument as Step 3
          and demote Stage 1 from "the proof device that closes the gap" to what
          it honestly is -- a confirmatory sanity check and a per-curve instance
          result. That change makes the record's stated scope correct and makes
          this experiment's role in the argument smaller but honest.
      - id: F4
        severity: MODERATE -- a factual error in a run artifact, internally
          self-contradicting
        finding: >-
          THE RECORD MISIDENTIFIES WHICH SIGN CLASSES COLLIDED in its own
          disclosed m=5 collision. raw-result.json's note says "disclosed
          collision at (1,1,1,1) and (1,1,-1,-1)", and H-MONO-93bc4d's
          stage_0_1 text repeats it as "(1,1,1,1) and (1,1,-1,-1) both mapped to
          x=3". This contradicts the root table in the SAME JSON object, which
          records (1,1,-1,-1) -> 21, not 3. My recomputation confirms the table
          and refutes the note: the collision is between (1,1,1,1) -> 3 and
          (1,-1,-1,-1) -> 3.
        why_it_matters: >-
          Two reasons, and the second is the substantive one.
          (a) It is a stated fact in an immutable run artifact that is wrong and
          is contradicted by the adjacent data in the same file.
          (b) The TRUE collision is caused by the exact E[2] branch that the
          record's Step 3 drops (discrepancy D2). The colliding pair differs on
          S = {2,3,4}, and P_2 + P_3 + P_4 = O -- the point at infinity, which
          lies in E[2] but does NOT satisfy "y(Q_S) = 0". The
          misattributed pair (1,1,1,1)/(1,1,-1,-1) would have required
          P_3 + P_4 in E[2] or P_1 + P_2 in E[2], and I verified both are FALSE
          (P_3+P_4 = (5,80), P_1+P_2 = (23,46), neither 2-torsion). So the
          record's own single observed negative datum is evidence for the defect
          in its own derivation, and the misattribution conceals that.
        recommended_repair: >-
          Supersede (never overwrite) the run record with a correction naming the
          collision as (1,1,1,1) vs (1,-1,-1,-1), S = {2,3,4}, cause
          P_2+P_3+P_4 = O in E[2], and cross-reference it to the Step-3 O-branch
          omission.
      - id: F5
        severity: LOW -- coverage, not correctness
        finding: >-
          The two m=4 witnesses are NOT independent tests of the same condition,
          so "two curves, both clean on the first attempt" corroborates less than
          it appears. E/F_211 has group order 225, which is ODD, so E[2](F_211)
          is TRIVIAL: on that curve the only rational 2-torsion point is O, and
          the freeness criterion collapses to "no signed proper-subset sum equals
          O". That witness therefore never exercises the (x,0) branch of E[2] at
          all -- it tests a strictly weaker condition than the p=101 witness,
          which has tau = 2. Neither witness curve has full rational 2-torsion.
        remedy_already_supplied: >-
          I closed this gap myself rather than only reporting it: metric M8
          records six new clean witnesses, at both m=4 and m=5, on three curves
          with E[2](F_p) = (Z/2)^2 (tau = 4). The witness claim survives on the
          case the record does not cover.

    specialization_argument_assessment:
      question_asked: >-
        Does finding ONE clean witness at a specific curve/point choice establish
        that no nonempty signed subset sum of GENERIC points lies in E[2]?
      answer: >-
        PARTLY, AND THE PART THAT FAILS IS NOT THE PART THE PRIOR SUSPECTED.
        Decomposed into the three inferences it actually chains:
      inference_1:
        statement: "clean witness at a closed point => nonvanishing at the generic
          point of E_0^{m-1} for that same curve E_0"
        verdict: VALID, unconditionally
        reasoning: >-
          F = prod over pairs of (phi_eps - phi_eps') is a rational function on
          E_0^{m-1}; the witness lies in its domain (I verified no signed sum is
          O); E_0^{m-1} is irreducible since E_0 is geometrically irreducible; a
          function nonzero at a closed point of an irreducible variety is nonzero
          at its generic point. NO genericity of the witness is needed. This is
          finding F2 and it retires the Coordinator's stated worry.
      inference_2:
        statement: "=> HEUR-KUM-2 holds over F_101(x_1,x_2,x_3) for y^2=x^3+2x+3"
        verdict: VALID -- a genuine, rigorous, per-curve instance result
      inference_3:
        statement: "=> HEUR-KUM-2 holds for ANY non-singular E over ANY k with char>3"
        verdict: INVALID as argued
        reasoning: >-
          This is the quantifier-order defect of finding F3. The witness lives on
          a fixed curve; the target claim quantifies over curves; and passing
          between them via the universal family gives only "outside a proper
          closed subset of the (A,B)-plane, in all but finitely many
          characteristics". Nonvanishing of D(A,B,x_*) does not imply
          nonvanishing of D(A_0,B_0,x_*) for a specified (A_0,B_0).
      is_there_a_reason_a_witness_could_fail_to_generalize:
        answer: >-
          Yes, and I can name it precisely, which is what the joint asked for.
          NOT because the witness curve/points sit on a special sublocus -- that
          direction of inference is immune to degeneracy (F2). The failure is
          that "clean witness exists over F_p" is a property of the pair (curve,
          field) that is logically independent of the generic statement, and I
          demonstrated the independence empirically in both directions: half the
          curves over F_11 admit no clean m=4 witness at all, and no curve over
          F_7/F_11/F_13 admits a clean m=5 one, yet the generic statement holds
          for every one of them. A witness is a sufficient certificate for ONE
          curve and carries no information about any other.
      net: >-
        The specialization technique is sound and correctly applied AS FAR AS IT
        GOES; it is simply weaker than the record needs, and the record claims the
        scope of the argument it did not use (dominance) while supplying the
        argument that cannot reach that scope (the witness). The conclusion is
        rescued in full by the one-line dominance argument in my section 3, so
        this is a repairable presentation defect over a true theorem, not a
        refutation.

