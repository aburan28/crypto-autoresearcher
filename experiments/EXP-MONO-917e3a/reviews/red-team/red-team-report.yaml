  # ---------------------------------------------------------------------
  # J3, point 1: the |S| >= 2 gap. THE ACTUAL ALGEBRA.
  # ---------------------------------------------------------------------
  j3_1_signed_subset_sum_algebra:
    attack_attempted: >-
      Construct, or argue for, a nonempty signed subset sum
      Q_S = sum_{i in S} eps_i P_i of GENERIC points with |S| >= 2 that lies
      in E[2], i.e. y(Q_S) = 0 as a rational-function identity in the x_i,
      y_i, A, B modulo y_i^2 = f(x_i).
    result: FAILED. No such sum exists, and I can prove it.

    case_S_equals_2:
      setup: >-
        P_1 = (x_1,y_1), P_2 = (x_2,y_2), y_i^2 = f(x_i) = x_i^3 + A x_i + B,
        x_1 != x_2 (indeterminates). lambda = (y_2-y_1)/(x_2-x_1),
        x_3 = lambda^2 - x_1 - x_2, y_3 = lambda(x_1-x_3) - y_1.
      computation: >-
        Clearing denominators, (x_1-x_2)^3 * y(P_1+P_2) reduces, modulo
        y_1^2 - f(x_1) and y_2^2 - f(x_2), to an element of the FREE rank-4
        module over k[x_1,x_2] with basis {1, y_1, y_2, y_1 y_2}:
            (x_1-x_2)^3 * y(P_1+P_2)  =  C_u * y_1  +  C_v * y_2,
            C_v =   x_1^3 + 3 x_1^2 x_2 + 3 A x_1 + A x_2 + 4B
            C_u = -(x_2^3 + 3 x_1 x_2^2 +   A x_1 + 3 A x_2 + 4B)
        (the 1 and y_1 y_2 coefficients are identically 0; C_u is the
        x_1 <-> x_2 mirror of -C_v, as it must be).
      conclusion: >-
        Because {1,y_1,y_2,y_1y_2} is a FREE basis, C_u y_1 + C_v y_2 = 0
        forces C_u = C_v = 0 in k[x_1,x_2]. But C_v carries the monomial
        x_1^3 with coefficient 1. That coefficient is 1 in EVERY
        characteristic, and it does not depend on A or B. Hence
        y(P_1+P_2) is NOT identically zero, for every field of char != 2 and
        every non-singular E. The (+,-) case is the same computation with
        y_2 -> -y_2 and gives C_v -> -C_v, likewise nonzero. And
        P_1 + P_2 = O would force x_1 = x_2, false. SO THE |S| = 2 CASE IS
        NOT A GAP AT ALL, AND NEEDS NO WITNESS: it is a three-line
        computation with a characteristic-uniform, curve-uniform answer.
      verification: >-
        Computed and re-derived in sympy 1.14.0; script at
        experiments/EXP-MONO-917e3a/reviews/red-team/scripts/algebra.py.

    case_S_equals_3:
      why_it_matters: >-
        This is the case that actually degenerated in the record's own m = 5
        first attempt (see O-7), so I did it explicitly rather than by
        analogy.
      computation: >-
        y(P_1+P_2+P_3), numerator cleared and reduced modulo the three
        relations y_i^2 = f(x_i), has FOUR nonzero coefficients on the
        basis {y_3, y_2, y_1, y_1y_2y_3} of the rank-8 free module over
        k[x_1,x_2,x_3] (the coefficients of 1, y_1y_2, y_1y_3, y_2y_3
        vanish). The y_3 coefficient has total degree 9 and contains the
        monomial x_1^6 x_2^3 with coefficient -1 -- again independent of A,
        B and nonzero in every characteristic.
      conclusion: y(P_1+P_2+P_3) is not identically zero. |S| = 3 is likewise not a gap.

    general_S_the_repair_the_record_should_have_used:
      statement: >-
        LEMMA (all |S| >= 1, all k with char k != 2,3, all non-singular E,
        no witness, no specialization, no heuristic). Let x_1..x_{m-1} be
        algebraically independent over k, y_i^2 = f(x_i), P_i = (x_i,y_i).
        For every nonempty S and every eps in {+-1}^S,
        Q_S = sum_{i in S} eps_i P_i is NOT in E[2].
      proof: >-
        Pick j in S. Let K = k({x_i, y_i}_{i != j}). K is algebraic over
        k(x_i : i != j), which has transcendence degree m-2, so x_j is
        TRANSCENDENTAL over K. Put R = sum_{i in S, i != j} eps_i P_i, an
        element of E(K) (R = O if S = {j}). If Q_S = eps_j P_j + R = T for
        some T in E[2], then P_j = +-(T - R). Every point of E[2] has
        coordinates algebraic over k, and R is K-rational, so T - R is
        K-bar-rational and x_j = x(P_j) would be algebraic over K.
        Contradiction. QED.
      why_this_is_strictly_better_than_the_record_s_route: >-
        (i) It covers |S| = 1 and |S| >= 2 by ONE argument, so the record's
        asymmetric treatment disappears; (ii) it is uniform in k, in E and
        in the characteristic, which is exactly the scope
        H-MONO-93bc4d's `statement` claims and exactly what a finite witness
        set cannot deliver (O-6); (iii) it needs no computation, so
        EXP-MONO-917e3a's Stage 1 becomes optional rather than load-bearing.
      proves_too_much_control_on_my_own_replacement: >-
        RUN, AND IT PASSES. On the factor-base sublocus the x_i are specific
        rational values, so "x_j transcendental over K" fails at the first
        step and the argument does not apply -- correct, since freeness is
        known FALSE there (H-MONO-45183a B-1, rate 6(tau-1)/N at m = 4). I
        also ran it against two SHARPER known-false objects the record never
        names, both of which it survives correctly: (i) x_2 specialized to a
        root of f, where P_2 in E[2] makes S_3(x_1,c,T) have a double root
        and the conclusion is false -- my argument fails because x_2 = c is
        not transcendental; (ii) the CODIMENSION-1 sublocus at m = 4 given by
        x_3 = x(P_1+P_2), where P_1+P_2-P_3 = O is a |S| = 3 sum in E[2]
        while x_1 and x_2 remain indeterminate -- my argument fails because
        no coordinate is transcendental over the field generated by the
        other two. Object (ii) is the more informative control: it is only
        codimension 1 and it leaves MOST of the x_i generic, so it tests
        whether the argument uses JOINT algebraic independence rather than
        "the x_i look like indeterminates". The record's Step 3 phrasing
        ("since the x_i are indeterminates") is loose enough that a careless
        reader would conclude freeness on object (ii); the record should
        state the hypothesis as joint algebraic independence of ALL of
        x_1..x_{m-1}.

  # ---------------------------------------------------------------------
  # J3, point 2: S_{m-1} -> Aut(V) at m = 4 and the order-6 coincidence
  # ---------------------------------------------------------------------
  j3_2_injectivity_at_m4:
    verdict: THE RECORD'S ARGUMENT IS CORRECT AT m = 4. Machine-verified.
    what_i_checked: >-
      Enumerated V = F_2^{m-1}/<all-ones> and the induced action of every
      coordinate permutation, for m = 3, 4, 5, and computed the kernel and
      image of S_{m-1} -> Aut(V) directly.
    results:
      m3: "|V| = 2, |Aut(V)| = 1, kernel = all of S_2 (order 2), image order 1. NOT injective -- exactly as the record says."
      m4: "|V| = 4, |Aut(V)| = |GL_2(F_2)| = 6, |S_3| = 6, kernel trivial, image order 6. INJECTIVE, and therefore also SURJECTIVE: the map is an ISOMORPHISM S_3 -> GL_2(F_2)."
      m5: "|V| = 8, |Aut(V)| = |GL_3(F_2)| = 168, |S_4| = 24, kernel trivial, image order 24. Injective, NOT surjective."
    the_record_s_argument_checked_line_by_line: >-
      "pi acts trivially on V iff pi(e_i) = e_i or e_i + (1,..,1) for every
      i; e_i has weight 1 and e_i + (1,..,1) has weight m-2; for m >= 4 these
      differ, so pi(i) = i." At m = 4 the two weights are 1 and 2, distinct,
      so the argument goes through. At m = 3 both are 1 and it fails,
      correctly. The argument is sound and the stated m-range is right.
    does_the_order_6_coincidence_matter:
      answer: >-
        IT DOES NOT DAMAGE INJECTIVITY, BUT IT SUPPLIES A STEP THE RECORD
        NEVER STATES, AND IT DESTROYS THE FALSIFIABILITY OF THE m = 4
        HEADLINE. Three distinct points:
      point_1_unstated_step: >-
        The record proves INJECTIVITY. The conclusion it draws -- "At m = 4
        this group is AGL(2,2) = S_4, the FULL symmetric group on the four
        roots" -- requires SURJECTIVITY onto GL_2(F_2), which the record
        never states or proves. It is true, but only because
        |S_3| = |GL_2(F_2)| = 6 forces it once injectivity is known. That
        inference should be written down; it is the only place in the record
        where a numerical coincidence is load-bearing, and a reader
        generalizing the sentence to m >= 5 would be wrong (at m = 5 the
        image has index 7 in GL_3(F_2)).
      point_2_no_information_at_m4: >-
        At m = 4, |V semidirect S_3| = 24 = |Sym(4 roots)|. So the CLAIMED
        MONODROMY IS THE FULL SYMMETRIC GROUP ON THE FIBRE, and the
        containment half of the symmetric-base claim has literally zero
        content there: every permutation any census could ever observe lies
        in S_4 by definition. m = 4 is therefore the WORST arity at which to
        headline the symmetric-base result, and the only testable half is the
        lower bound (all 24 realized). The record and its companion
        (IDEA-20260904-ad63fe) both headline m = 4. This is an
        observation-fiber problem, not an arithmetic one: the observable
        cannot separate the claim from its negation at the arity chosen to
        display it.
      point_3_the_real_m4_risk_is_elsewhere: >-
        The order coincidence is benign. The m = 4 risk is the MISSING
        SURJECTION ONTO S_{m-1} identified in O-2 below, which is a
        different and unaddressed step.
    verification: experiments/EXP-MONO-917e3a/reviews/red-team/scripts/group.py

  # ---------------------------------------------------------------------
  # J3, point 3: is the specialization-witness LOGIC valid here?
  # ---------------------------------------------------------------------
  j3_3_specialization_witness_logic:
    verdict: >-
      THE PRINCIPLE IS VALID; ITS APPLICATION HERE IS NOT, BECAUSE THE
      "POLYNOMIAL" IS NOT ONE OBJECT OVER ONE BASE FIELD. The record's
      one-sentence justification ("a nonzero value at one point implies the
      function is not identically zero") is a true statement about a fixed
      polynomial over a fixed ring, and it does not transfer to a claim
      quantified over fields and curves.
    the_coherence_problem_stated_exactly: >-
      H-MONO-93bc4d's SCOPE is "any field k with char k > 3, any
      non-singular E : y^2 = x^3+Ax+B over k, any m >= 3, x_1..x_{m-1}
      INDETERMINATES". Under that quantifier order, A and B are FIXED
      elements of k and the object whose non-vanishing is needed is
      Phi_{m,A,B} in k[x_1..x_{m-1}] -- a DIFFERENT polynomial over a
      DIFFERENT ring for every (k, A, B). A witness at (p,A,B) = (101,2,3)
      establishes Phi_{4,2,3} != 0 over F_101 and says nothing whatsoever
      about Phi_{4,A',B'} over F_7, over Q, or over F_{101} for a different
      curve. No finite set of witnesses can discharge a for-all-fields,
      for-all-curves statement. This is a QUANTIFIER-ORDER failure, not a
      coverage failure, so "compute more witnesses" does not fix it.
    the_weaker_reading_also_fails: >-
      If instead one reads A and B as indeterminates too, the object is
      Phi_m in Z[A,B,x_*] and a witness mod 101 does prove Phi_m != 0 over
      Z. But (i) that yields the conclusion only for (A,B) OUTSIDE the zero
      locus of some nonzero polynomial -- i.e. for a Zariski-dense set of
      curves, NOT "for every non-singular E", which is what the record
      claims and what the exceptional-locus question is about; and (ii) a
      nonzero integer polynomial can have content divisible by a small
      prime and vanish identically mod that prime, so char 5, 7, 11, 13, ...
      are not covered by witnesses at 101 and 211. The record's
      specification.yaml asserts the opposite in
      `scale_relevance.why_conclusions_transfer_or_do_not`: "transfers to
      every characteristic-greater-than-3 field and every non-singular curve
      by construction (the derivation makes no curve-specific or
      field-specific assumption beyond char > 3)". That sentence is true of
      the RECORD'S STEP 1-2 and of my replacement lemma; it is FALSE of the
      Step 3 repair the record actually relies on, which is nothing but a
      curve-specific and field-specific computation.
    is_there_a_general_position_requirement: >-
      YES, AND THE RECORD NAMES NONE. The witness must be a point at which
      the relevant polynomial is defined and nonzero; the record's own
      procedure additionally requires enough F_p-rational points to pick
      m-1 of them with distinct x-coordinates. That is a FIELD-SIZE
      condition, and it is the parameter that actually controls whether a
      witness exists (see O-11: at p = 5 no clean m = 4 witness exists on
      16 of 20 non-singular curves even after EXHAUSTIVE search, while the
      generic claim is true for every one of them). Nothing in the record,
      the idea, the specification or the implementation states any field-size
      requirement, and the record's falsification condition G3 reads
      exhaustive non-existence as evidence AGAINST the hypothesis. That is
      backwards and must be rewritten.
    what_saves_the_conclusion: >-
      Not the witnesses. The transcendence lemma above, or the published
      result in O-12. Both are unconditional and both cover the full stated
      scope.

  # ---------------------------------------------------------------------
  # J4, point 1: THE m = 3 ORDER-4-VS-ORDER-2 QUESTION, RESOLVED
  # ---------------------------------------------------------------------
  j4_1_m3_resolution:
    question: >-
      Does H-MONO-93bc4d's own m = 3 corollary (a group of order 4 acting on
      TWO roots of S_3) make sense, and is it compatible with EV-MONO-a0a89c
      OBS-2 (S_2, order 2)?
    answer: >-
      IT IS A REAL ERROR IN THE RECORD, NOT A MISREADING AND NOT TWO
      COMPATIBLE STATEMENTS. The two objects the record warns about
      (H-MONO-0b3def's D_4 on four POINTS versus this record's group on two
      ROOTS) ARE correctly distinguished -- I checked H-MONO-0b3def's
      statement directly: its object is Phi(e1,e2), the four points of E over
      the unordered pair, Galois closure k(t1,t2,y1,y2) of degree 8, group
      D_4. That is genuinely a different cover of a different degree, and the
      record is right to say so. But having correctly excluded D_4, the
      record then reports its OWN object's m = 3 answer as "V semidirect S_2
      of order 4 acting on 2 roots", and that is impossible.
    why_it_is_impossible: >-
      Monodromy of a cover is by definition the Galois group of the splitting
      field of the fibre polynomial, acting FAITHFULLY on the fibre. At m = 3
      the fibre is deg_T S_3 = 2^{m-2} = 2 roots. |Sym(2)| = 2. A group of
      order 4 cannot act faithfully on two objects. The record's own general
      formula 2^{m-2}(m-1)! evaluates to 4 at m = 3 and to |Sym(2^{m-2})| = 2
      -- the formula exceeds the symmetric group's order at exactly one
      arity, m = 3, and that is the arity the record chose for its baseline
      reproduction check.
    what_the_true_answer_is: >-
      S_2, ORDER 2, over BOTH bases. disc_T S_3 = 16 f(x_1) f(x_2)
      (EV-MONO-a0a89c OBS-1) is symmetric, hence lies in k[e_1,e_2]; it is
      squarefree there (I factored it: the single odd-multiplicity factor is
      A^2 e_2 + A B e_1 + A e_1^2 e_2 - 2 A e_2^2 + B^2 + B e_1^3
      - 3 B e_1 e_2 + e_2^3), hence a non-square in k(e_1,e_2), hence the
      degree-2 polynomial S_3 is irreducible over the SYMMETRIC base too and
      its monodromy there is S_2 of order 2. Consistently, the transposition
      (x_1 x_2) fixes BOTH roots x(P_1+P_2) and x(P_1-P_2), so the descent
      contributes nothing -- which is exactly what the record's own Step 4
      says (Aut(V) is trivial at m = 3). THE RECORD CONTRADICTS ITSELF: Step
      4 establishes that the S_{m-1} factor acts trivially at m = 3, and the
      baseline check then multiplies by it anyway.
    root_cause_the_missing_load_bearing_hypothesis: >-
      (D3) derives |monodromy over K_sym| = 2^{m-2}(m-1)! from "(D1) gives
      the translation part, the descent Gal(K_ord/K_sym) = S_{m-1} gives the
      linear part". Writing N for the splitting field of S_m over K_sym, the
      exact sequence is
          1 -> Gal(N / N cap K_ord) -> Gal(N/K_sym) -> Gal(N cap K_ord/K_sym) -> 1,
      with the left term = V by (D1). The order 2^{m-2}(m-1)! therefore
      requires N cap K_ord = K_ord, i.e. K_ord SUBSET N -- equivalently, that
      the symmetric-base monodromy SURJECTS onto S_{m-1}. THAT HYPOTHESIS IS
      NEVER STATED AND NEVER PROVED, AND IT IS FALSE AT m = 3: there
      N = K_sym(sqrt(f(x_1)f(x_2))) while K_ord = K_sym(sqrt(e_1^2 - 4 e_2)),
      and I verified symbolically that
      f(x_1) f(x_2) * (e_1^2 - 4 e_2) is NOT a square in k(e_1,e_2) (both
      factors appear with odd multiplicity), so the two quadratic extensions
      are distinct, N cap K_ord = K_sym, and the S_2 quotient is not realized
      at all.
    this_is_a_proves_too_much_hit: >-
      Run the (D3) argument unchanged on m = 3, where the conclusion is known
      false: it still "proves" order 4. The declared failure signature in the
      task card's `proves_too_much` block is about the FACTOR-BASE sublocus,
      which (D3) never touches; m = 3 is the cheap known-false object that
      the record's plan did not include and that (D3) does not survive. The
      surviving-step location is precisely the sentence "the descent
      Gal(K_ord/K_sym) = S_{m-1} gives the linear part", which assumes a
      surjection that must be proved.
    consequence_for_m_greater_equal_4: >-
      UNKNOWN AND UNADDRESSED. The m = 3 failure does not by itself refute
      (D3) at m >= 4 -- the missing surjection may well hold there, and
      IDEA-20260904-ad63fe asserts it at m = 4 ("A subgroup of Sym(V) that
      contains all translations and surjects onto GL_2(F_2)") -- but it is
      ASSERTED there too, not proved, in a record whose status is `proposed`.
      The narrowest defensible statement today is: the symmetric-base
      monodromy CONTAINS V and is CONTAINED in V semidirect S_{m-1}, with the
      upper bound attained only if the surjection holds, which is false at
      m = 3 and open at m >= 4.
    what_survives: >-
      (D1) AND (D2) ARE NOT AFFECTED. (D1) is a statement over K_ord, where
      the exact sequence question does not arise, and its m = 3 reproduction
      IS correct: V of order 2 acting freely on 2 roots gives S_2, matching
      OBS-2 exactly. The defect is confined to (D3) and to every sentence in
      H-MONO-93bc4d that carries (D3)'s conclusion.

  objections:
    - id: O-1
      joint: J4
      severity: breaks
      target: "IDEA-20260904-0417a5 proof_search_map.baseline_embedding.reproduction_check; H-MONO-93bc4d statement"
      objection: >-
        "Setting m = 3 in (D3) gives V semidirect S_2 of order 4 acting on 2
        roots" is false: no faithful permutation group on 2 objects has order
        4, and the true symmetric-base monodromy of S_3 on its 2 roots is
        S_2, order 2.
      evidence: >-
        Machine-enumerated: at m = 3 the kernel of S_2 -> Aut(V) is all of
        S_2, so the image of V semidirect S_2 in Sym(2 roots) has order 2.
        Independently: disc_T S_3 = 16 f(x_1) f(x_2) is a non-square in
        k(e_1,e_2) (factored; squarefree), giving irreducibility and Galois
        group S_2.

    - id: O-2
      joint: J4
      severity: breaks
      target: "IDEA-20260904-0417a5 (D3) / mechanism STEP 4 conclusion"
      objection: >-
        (D3) has an unstated load-bearing hypothesis -- K_ord is contained in
        the splitting field of S_m over K_sym, equivalently the symmetric-base
        monodromy surjects onto S_{m-1} -- without which the order
        2^{m-2}(m-1)! does not follow. It is FALSE at m = 3 and unproved at
        m >= 4.
      evidence: >-
        f(x_1)f(x_2)*(e_1^2-4e_2) is not a square in k(e_1,e_2), so
