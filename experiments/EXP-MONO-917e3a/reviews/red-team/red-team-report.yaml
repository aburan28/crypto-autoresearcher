  reduction_and_scope_challenges:
    - id: SC-1
      challenge: >-
        SCOPE INFLATION, SYMMETRIC BASE. H-MONO-93bc4d's `statement` asserts
        the symmetric-base group "over k(e_1..e_{m-1}) ... exactly V
        semidirect S_{m-1}, order 2^{m-2}(m-1)!, with empty exceptional
        locus" with no m-restriction under a SCOPE of "any m >= 3". False at
        m = 3, unproved at m >= 4, and the exceptional-locus half is
        unargued at every m. Must be narrowed.
    - id: SC-2
      challenge: >-
        SCOPE INFLATION, FIELDS AND CURVES. "any field k with char k > 3, any
        non-singular E" is supported for Steps 1-2 and for my replacement
        lemma, but NOT by the witness route the record actually invokes at
        Step 3 (O-6).
    - id: SC-3
      challenge: >-
        REDUCTION INSTANTIATION. (D3) instantiates a cited reduction
        ("companion proposal, claim C2/C3") whose hypotheses were not
        checked: the cited claim is m = 4-scoped, `proposed`, and its own
        surjection premise is asserted rather than proved (O-4, O-2).
    - id: SC-4
      challenge: >-
        SCOPE LIMITS THAT ARE CORRECT AND SHOULD BE PRESERVED VERBATIM. I
        checked each and found them accurate: no arithmetic-monodromy claim
        at fixed p beyond the existing containment; no relation-rate, cost or
        exponent claim; KN-OPEN-009 not closed (relation-rate half untouched);
        the m = 4 "full symmetric" consequence explicitly barred from being
