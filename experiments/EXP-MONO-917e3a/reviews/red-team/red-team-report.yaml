        at x = 3.
      why_it_matters: >-
        The two readings are DIFFERENT MATHEMATICS. The reported pair differs
        in coordinates {3,4}, i.e. |S| = 2 -- the exact case the record names
        as its honest gap. The ACTUAL pair differs in coordinates {2,3,4},
        i.e. |S| = 3 with complement S' = {1}; and since P_1 = (3,6) is not
        2-torsion, the degeneracy is Q_S = P_2+P_3+P_4 = O, the point at
        infinity, not a finite 2-torsion point. A reader auditing the
        record's own gap would have drawn the wrong conclusion about which
        case degenerated. Under AGENTS.md rule 5 a disclosure that does not
        match its own data is a reporting defect regardless of whether the
        conclusion moves; here it also happens to be the single most
        diagnostically relevant fact in the run.

    - id: O-8
      joint: J3
      severity: major
      target: "EXP-MONO-917e3a specification.yaml; implementation/witness_search.py; execution_report.yaml protocol_deviations"
      objection: >-
        FIVE PRE-REGISTERED CONTROLS WERE SILENTLY DROPPED AND THE
        DEVIATIONS WERE NOT RECORDED. IDEA-20260904-0417a5's own
        `minimal_test.controls` pins OI-1(a) through OI-1(e). The frozen
        specification.yaml contains no OI-1 entry at all. Of the two that
        bind a witness search: OI-1(b) requires the search to "compute and
