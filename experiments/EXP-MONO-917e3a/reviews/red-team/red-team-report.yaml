        downstream record reads the result as bearing on relation search.

  proof_architecture_challenges:
    - attack: observation-fiber
      result: >-
        HIT AT m = 4 FOR (D3). Holding the observable fixed (the monodromy as
        a permutation group on the 2^{m-2} roots) and varying the object, the
        m = 4 claim places its conclusion at the FULL symmetric group, where
        no observation can distinguish it from any weaker containment. The
        missing separator is a lower-bound witness for the S_{m-1} factor --
        an observed 3-cycle (see counterexample_or_mutation).
    - attack: quantifier-order
      result: >-
        HIT AT STEP 3. The theorem is stated FOR ALL k, FOR ALL E, THERE
        EXISTS no bad signed subset sum. The witness repair supplies THERE
        EXISTS (k,E) FOR WHICH the roots are distinct, and then infers the
        for-all. The witness is chosen after seeing the parameter, not
        before. See j3_3.
    - attack: boundary-and-strictness
      result: >-
        HIT. The old method is the m = 3 case, and (D3) does NOT embed it: it
        returns 4 where the boundary gives 2 (O-1). (D1) DOES embed it
        correctly (S_2, matching OBS-2).
    - attack: method-ceiling
      result: >-
        PASSES, WITH A CORRECTION. The record's declared ceiling ("an
        unconditional determination of the GEOMETRIC monodromy ... cannot
        certify arithmetic monodromy at fixed p, relation rates, cost, or any
        exponent") is accurate and honestly stated. The correction is that the
        ceiling is reached by CITATION (O-12), so the record's marginal
        contribution sits below its own ceiling.
    - attack: nearby-object
      result: >-
        The record names ONE nearby object (the factor-base sublocus) and
        (D1) survives it correctly. I added three: m = 3 for (D3), which it
        fails (O-1/O-2); x_2 at a root of f, and the codimension-1 locus
        x_3 = x(P_1+P_2), both of which (D1) survives.
    - attack: compositional-invariant
      result: >-
        The strengthened invariant is "the translation action of V on the
        roots is FREE" in place of "the group is contained in V". Deleting
        freeness leaves containment, which is A-2 and is already committed;
        the strong invariant does imply the target (regular => transitive =>
        irreducible), and I verified the equivalence freeness <=> injectivity
        of the class-to-root map <=> all 2^{m-2} roots distinct, using
