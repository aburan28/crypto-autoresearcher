  counterexample_or_mutation:
    to_the_load_bearing_lemma: >-
      NONE FOUND, AND I NOW BELIEVE NONE EXISTS. Proof in
      j3_1.general_S.
    to_D3_as_stated: >-
      FOUND, AND IT IS FREE: m = 3. Substituting m = 3 into (D3)'s own
      formula yields a monodromy of order 4 acting faithfully on 2 roots,
      which is impossible, while the true value is 2. The offending step is
      "the descent Gal(K_ord/K_sym) = S_{m-1} gives the linear part", which
      silently assumes a surjection that fails at m = 3.
    cheapest_discriminating_mutation_for_the_open_part: >-
      To test whether the missing surjection of O-2 holds at m = 4 -- the one
      thing that would rescue (D3) at the arity the record headlines --
      compute, over a small F_p on a curve with g(X) = X^3 - e_1X^2 + e_2X -
      e_3 IRREDUCIBLE, whether the Frobenius permutation of the four roots of
      S_4^sym has order 3. A 3-cycle lies in AGL(2,2) \ V and cannot arise
      from translations alone, so a single observed 3-cycle proves the
      surjection is nontrivial at m = 4, and its absence over many irreducible
      g refutes it. This is IDEA-20260904-ad63fe's own (C3)(c) prediction read
      as a test of (D3)'s missing step rather than as a census statistic, and
      it costs a few hundred point additions.

  baseline_comparison:
    cost_axes: >-
      NONE, correctly. This is a pure derivation; no time, memory or
      data/query coordinate is claimed. `dominated_by: not_applicable` in
      IDEA-20260904-0417a5 carries a stated reason (Pollard rho, O(sqrt N)
      time / O(1) memory, KN-OPEN-001, checked and untouched) and is
      therefore a filled field rather than an unchecked null under AGENTS
      rule 5. `sota_delta: 0 on every attack axis` is accurate. I confirm no
      ECDLP, relation-rate, or exponent claim is made anywhere in the record,
      and that KN-LIT-7593's eliminated-dimension rule does not apply since
      no search dimension is eliminated.
    the_baseline_that_does_bind: >-
      For a PROOF claim the relevant frontier is the literature, and there
      the record is DOMINATED. Semaev 2004's absolute irreducibility of S_m
      (O-12) gives HEUR-KUM-2 by a two-line Gauss's-lemma argument, with no
      witnesses, no heuristics, no characteristic caveats beyond the source's
      own, and it predates this program by twenty-two years. The record's
      contribution against that baseline is the REDUCTION (irreducibility
      <=> freeness of the translation action) and the structural observation
      that Part A's equality and Part B's collision criterion are one
      computation at two loci -- both of which remain genuine and useful --
      not the theorem.

  heuristic_challenges:
    - challenge: >-
        H1's "NONE LOAD-BEARING" is false for (D3). See O-2, O-4, O-5. Two
        assumptions carry (D3) and neither is numbered, stated, or justified.
    - challenge: >-
        The one assumption H1 does name is described as "offered as a THEOREM
        with a named gap and a specialization-witness repair, not as a
        distributional assumption". That is the right category, but the
        repair as executed does not prove the theorem at the stated scope
        (O-6), so the record is in fact conditional on an unstated
        genericity-of-(A,B,k) restriction. Either prove it unconditionally
        (RC-1) or number the restriction.
    - challenge: >-
        RANDOM-MODEL TRANSFER, applied to the witness rather than to a
        distribution: the record treats "one witness exists" as if the
        witness were a generic point of the parameter space. It is not -- it
        is an F_p-rational point on a small-height curve, and the object
        being tested (a minimal-degree signed subset sum landing in E[2]) is
        exactly the kind of structured quantity that need not behave like a
        random draw. The cheapest computation that would expose a systematic
        deviation is the one I ran (O-11): sweep p and watch whether the
        non-existence rate decays like the random-map prediction 6/p at
        m = 4. It does, which is reassuring about the null and damning about
        the witness's evidential value.

  cost_model_challenges:
