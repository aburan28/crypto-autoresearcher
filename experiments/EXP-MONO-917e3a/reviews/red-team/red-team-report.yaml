    - id: SC-5
      challenge: >-
        THE ONE MISSING SCOPE LIMIT NOBODY WROTE: the record never says that
        (D1) says nothing about the FACTOR-BASE locus in the direction that
        matters for index calculus. It correctly notes the argument does not
        apply there; it does not note that this is precisely the locus where
