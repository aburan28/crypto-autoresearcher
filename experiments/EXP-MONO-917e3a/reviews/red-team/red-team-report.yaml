        computes no point orders and only skips y = 0; OI-1(e) requires
        (A,B) "drawn uniformly from all non-singular (A,B) in F_p^2, never
        from a small-height box" -- the implementation hard-codes (2,3) and
        (5,7), which is a small-height box and is not drawn at all.
        `execution_report.protocol_deviations` is the empty list and the
        manifest lists only the m = 5 collision.
      compounding: >-
        OI-1(b) is also aimed at the WRONG degeneracy. The failure that
        actually occurred (O-7) is a subset SUM equal to O; no reference
        point was 2-torsion, so the guard as written could never have fired.

    - id: O-9
      joint: J3
      severity: major
      target: "Q4 / metric M3 / q4_consistency_check in raw-result.json, execution_report.yaml, manifest.yaml, and H-MONO-93bc4d"
      objection: >-
        Q4 IS A TAUTOLOGY PRESENTED AS A CROSS-VALIDATION. It compares the
        number of distinct roots at a CLEAN witness -- which is 2^{m-2}
        whenever the witness is clean, by the definition of clean -- against
        EV-MONO-efbd1c's G8, the number of distinct realized FROBENIUS
        PERMUTATIONS, which is also 2^{m-2} when the group is all of V. Both
        sides equal 2^{m-2} by construction, so `match: true` was
        unfalsifiable before the run. It is also an apples-to-oranges
        comparison: a count of ROOTS against a count of GROUP ELEMENTS. The
        specification pins it as preregistered_prediction M3 with
        "formula: 2^{m-2}", which states the tautology outright.

    - id: O-10
      joint: J3
      severity: major
      target: "EXP-MONO-917e3a Stage 1 as evidence"
      objection: >-
        NO NULL-OBJECT CONTROL WAS RUN, AND THE OBSERVED OUTPUT IS A
        CONTROLLED NULL. A uniformly random map of the 2^{m-2} sign classes
        into F_p yields all-distinct with probability 0.9417 (m = 4,
        p = 101), 0.9718 (m = 4, p = 211) and 0.7525 (m = 5, p = 101). The
        entire Stage-1 record -- two m = 4 witnesses clean, one m = 5 attempt
        colliding, a second clean -- is precisely what a random function
        reproduces. The record's framing ("outcome: passed, both curves clean
        on the first attempt", "witness counts match G8 exactly") reads
        null-matching output as corroboration.
      scoping_this_objection_honestly: >-
        This does NOT invalidate the witness's LOGICAL role. One point of
        non-vanishing does prove a polynomial is not identically zero, and
        that inference does not require discriminating power. The objection
        is that the run is reported as though it also carried evidential
        weight, which it does not, and that the record's own
        docs/inventor-protocol.md section 3 obligation (null object before
