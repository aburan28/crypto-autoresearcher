    - id: O-7
      joint: J3
      severity: major
      target: "raw-result.json note; execution_report.yaml stage_1_result.m5.attempt_1.note; H-MONO-93bc4d stage_0_1_verification_performed_by_coordinator; implementation.md"
      objection: >-
        THE DISCLOSED ANOMALY IS MISREPORTED IN EVERY PLACE IT IS DISCLOSED,
        AND THE RAW DATA IN THE SAME FILE CONTRADICTS THE NOTE. All three
        records say the m = 5 first-attempt collision was between (1,1,1,1)
        and (1,1,-1,-1). The recorded root map in the same raw-result.json
        gives (1,1,-1,-1) -> 21 and (1,-1,-1,-1) -> 3. I recomputed
