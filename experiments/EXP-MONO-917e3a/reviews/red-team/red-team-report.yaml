    - id: O-11
      joint: J3
      severity: major
      target: "IDEA-20260904-0417a5 falsification_conditions G3; H-MONO-93bc4d falsification_condition (c)"
      objection: >-
        G3 CAN FIRE ON A TRUE HYPOTHESIS. It reads "no freeness witness
        exists at m = 4 or m = 5 over any tested small field with the search
        completing normally" as falsifying. I ran the exhaustive version: over
        ALL non-singular (A,B) and ALL triples of distinct-x, non-2-torsion
        F_p-points, NO clean m = 4 witness exists on 16/20 curves at p = 5,
        27/42 at p = 7, 35/110 at p = 11, 41/156 at p = 13, 32/272 at p = 17,
        30/342 at p = 19, 22/506 at p = 23, and 0/870 at p = 31, 0/1260 at
        p = 37. The generic claim is TRUE for every one of those curves. The
        controlling parameter is FIELD SIZE, which the record never names,
        and the non-existence rate DECAYS to zero as it should -- the exact
        signature that says "artifact of the probe", not "signal about the
        object".
      family_correlation_the_record_pre_registered_and_never_ran: >-
        At p = 19 the failure rate is 9/18 = 50.0% on the j = 1728 (B = 0)
        family versus 5.9% on generic curves and 16.7% on j = 0. That is
        exactly the family-correlated failure signature the record's own
        OI-1(d) FAMILY_RATE_ALERT was written to quarantine on, and OI-1(d)
        was never implemented (O-8). It vanishes by p = 31, confirming it is
        a small-field artifact rather than curve structure -- which is the
        answer the alert should have produced.

    - id: O-12
      joint: J3
      severity: "major (novelty and citation, not correctness)"
      target: "IDEA-20260904-0417a5.novelty_status_note; the whole framing 'HEUR-KUM-2 IS NOT A HEURISTIC, IT IS A ONE-LINE NONDEGENERACY LEMMA'"
      objection: >-
        THE THEOREM IS ALREADY PUBLISHED, AND THE RECORD ASKED FOR EXACTLY
        THIS CHECK. Its novelty_status_note says "NO EXTERNAL SOURCE WAS READ
        IN THIS SESSION; the external arm is therefore UNVERIFIED and a
        reviewer with retrieval should check whether irreducibility of
        summation polynomials over the generic function field is already
        published (a plausible location is the literature following Semaev
        2004 ...; RECALLED ONLY, not read, and not support)." I checked, in
        PRIMARY TEXT, and the recollection is right.
      primary_sources_read: >-
        (1) arXiv:1403.0126, "Point compression for the trace zero subgroup
        over a small degree extension field", Theorem 1, quoted verbatim from
        the PDF: "For any m >= 3, let Z_1, ..., Z_m be elements of the
        algebraic closure F_q of F_q. Then f_m(Z_1,...,Z_m) = 0 if and only
        if there exist Y_1,...,Y_m in F_q such that the points (Z_i,Y_i) are
        on E and (Z_1,Y_1) + ... + (Z_m,Y_m) = O in the group E(F_q).
        Furthermore, f_m is absolutely irreducible and symmetric of degree
        2^{m-2} in each variable. The total degree is (m-1)2^{m-2}." The
        theorem is attributed there to reference [41] Theorem 1 (Semaev).
        (2) eprint 2017/609, "On the discrete logarithm problem for
        prime-field elliptic curves", quoted verbatim: "Moreover, the
        polynomial S_m is symmetric of degree 2^{m-2} in each variable X_i,
        it is absolutely irreducible and ...".
      why_this_settles_HEUR_KUM_2: >-
        Absolute irreducibility of S_m in k-bar[X_1,...,X_m] implies
        HEUR-KUM-2 in two lines. If S_m factored in k-bar(x_1..x_{m-1})[T]
        into factors of positive T-degree, Gauss's lemma over the UFD
        k-bar[x_1..x_{m-1}] would produce a factorization in
        k-bar[x_1..x_{m-1}][T] with both factors of positive T-degree, i.e. a
        nontrivial factorization of S_m in k-bar[X_1..X_m] -- contradiction.
        (Absolute irreducibility also forces the T-content to be a unit, so
        primitivity is automatic.) Irreducibility over k-bar(x_*) implies it
        over k(x_*). Combined with A-2's containment in a group of order
        2^{m-2}, transitivity on 2^{m-2} roots forces the monodromy to be
        EXACTLY V, regular, and hence the action free -- (D1)'s full
        conclusion, with no witnesses and no heuristics.
      disclosure_on_the_strength_of_this_finding: >-
        I read the two later papers in primary text, not Semaev 2004 itself,
        and both state the fact for curves over F_q. I did not verify the
        original proof nor its characteristic hypotheses. The Coordinator
        should have Semaev 2004 itself retrieved before the citation is
        recorded as the discharging authority. What is already certain is
        that "no record offers a proof" was an assertion about
        ledger/ (grep-scoped, internal only) that the record correctly
        flagged as not covering the literature, and that the literature arm
        now points hard against novelty.
      what_this_does_NOT_do: >-
        It does not make the record wrong. (D1)/(D2) are TRUE. It changes
        what the record IS: a rediscovery with an independent proof, not a
        new theorem, and its `novelty_status: adaptation` plus
        `priority_rationale` ("removes the last conditionality from the only
        monodromy statement this lane has") need restating on that basis.

    - id: O-13
      joint: J3
      severity: minor
      target: "IDEA-20260904-0417a5 assumptions: 'A-1 and A-2 are used as established ... and are not reproved'"
      objection: >-
        A-1, as written in H-MONO-45183a, already contains the clause
        "generically the fibre is exactly that set and the roots are
        distinct" -- a loose form of the very conclusion (D1) proves. The
        record imports A-1 wholesale and does not say which clause of it it
        is and is not relying on. If A-1's distinctness clause were taken as
        established, (D1) would be circular; if it is not, the record should
        say so. This is a one-sentence fix and it matters because the
        confounder list already flags "CIRCULARITY VIA A-1/A-2" for the
        reviewer but not for the author.

