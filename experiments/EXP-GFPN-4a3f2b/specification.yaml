# EXP-GFPN-4a3f2b
# Batch-16 word-product arithmetic. No kernel.
# Approved by DEC-20261002-9bb08b.
experiment:
  id: EXP-GFPN-4a3f2b
  hypothesis_id: H-GFPN-9a7042
  source_idea: IDEA-20260920-204828
  question_id: RQ-GFPN-c01af8
  version: 1
  title: Batch-16 word-product counts
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-9bb08b
  objective: >-
    Check the batch-16 norm and extension counts, the excess 3, and the
    cross excess 1395.
  inputs:
    batch: 16
    schoolbook_M: 25
    karatsuba_M: 15
    norm_addend: 26
    extension_inner: 17
    schoolbook_norm: 76
    schoolbook_numerator: 1267
    schoolbook_written: 79
    schoolbook_excess: 3
    schoolbook_gap: 51
    karatsuba_norm: 56
    karatsuba_numerator: 767
    karatsuba_written: 48
    karatsuba_shortfall: 1
    karatsuba_gap: 129
    ratio_num: 129
    ratio_den: 767
    hundredths: 15
    cross_excess: 1395
    scratch_extension: 5
    scratch_inplace: 1
  controls:
    - >-
      The schoolbook norm count is 76. Reporting it as 75 invalidates
      the run.
    - >-
      The schoolbook extension numerator is 1267. It exceeds 79 times 16
      by 3. Reporting the extension count as exactly 79 invalidates the
      run.
    - >-
      The Karatsuba numerator is 767. It is 1 below 48 times 16.
      Reporting the extension count as exactly 48 invalidates the run.
    - >-
      129 times 100 exceeds 767 times 15 by 1395. Reporting 129/767 as
      at most 15/100 invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {schoolbook, karatsuba}
    - route in {norm_add, extension_numerator}
  metrics:
    primary:
      - schoolbook_numerator
      - cross_excess
      - implementations_agree
    secondary:
      - schoolbook_excess
      - karatsuba_gap
      - karatsuba_shortfall
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The schoolbook excess is 3 and the Karatsuba cross excess is 1395.
    formula: >-
      The norm count is 2M + 26. The extension numerator is 3M times the
      batch size plus 2M + 17. The ratio compares 129 times 100 with 767
      times 15.
    source: >-
      IDEA-20260920-204828 states the pairs 76 versus 79 and 56 versus 48,
      read 2026-10-02. The numerators were computed in this design
      session. That computation is not a run. No kernel was timed.
  scale_relevance:
    tier: toy
    justification: Two integer formulas at one batch size. No transfer to a kernel.
    correspondence: null
  tail_checks:
    - The Karatsuba cross excess 1395 is required. A check that stops at the schoolbook pair is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the schoolbook norm count disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The schoolbook norm count is not 76.
    - The schoolbook extension count is reported as exactly 79.
    - The Karatsuba extension count is reported as exactly 48.
    - The ratio 129/767 is reported as at most 15/100.
    - A kernel is timed or a throughput ratio is stated.
  success_criterion: >-
    Both runs agree that the schoolbook norm count is 76, that 1267
    exceeds 79 times 16 by 3, that 767 is 1 below 48 times 16, and that
    129 times 100 exceeds 767 times 15 by 1395.
  falsification_criterion: >-
    The runs agree, the schoolbook norm count is 76, and 1267 does not
    exceed 79 times 16 by 3.
  required_artifacts:
    - experiments/EXP-GFPN-4a3f2b/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-GFPN-4a3f2b/runs/<RUN-ID>/command.txt
    - experiments/EXP-GFPN-4a3f2b/runs/<RUN-ID>/stdout.log
    - experiments/EXP-GFPN-4a3f2b/runs/<RUN-ID>/stderr.log
    - experiments/EXP-GFPN-4a3f2b/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-GFPN-4a3f2b/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any kernel timing, rho walk, or throughput ratio.
    - Any claim that one inversion path is faster.
    - Any measured steps per second.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
