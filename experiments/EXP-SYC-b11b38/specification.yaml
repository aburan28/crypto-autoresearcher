    RT-68EA16-OBJ1-DERIV1-uncalibrated-against-HA2:
      status: CALIBRATION_REPAIRED_EXPECTATION_ONLY_RESIDUAL_DISCLOSED
      correspondence:
        hypothesis_variable: X is the number of distinct exact matching A values for one frozen (curve,
          root, public model) root before the Boolean V/S bridge.
        compiler_field: candidate_index is the zero-based ordinal of a retained distinct candidate within
          one (curve, root, public model, eta) accounting tuple.
        eta_rule: eta is a preregistered finite-size analysis stratum, not a new root draw. For each eta
          tuple the candidate_index occupancy equals that root/model X after the same exact-match
          and retention rules; eta does not multiply occupancy inside a tuple.
        expected_value_rule: Therefore HA-2 supplies expected occupancy per tuple E[X], conditional on its
          heuristic and the finite calibration convention below. It does not supply a deterministic
          occupancy, a per-tuple tail, independence across tuples, or a maximum-over-98304-tuples
          guarantee.
        tuple_count_per_size: 98304
        tuple_count_identity: 32 curves * 256 roots * 4 public models * 3 eta values = 98304
        capacity: 32
        capacity_scope: HA-2 gives mean margins only. The deterministic worst-case bounds 504, 1016, 2040,
          4088, and 8184 exceed 32, so the unchanged overflow rule remains mandatory and cap
          adequacy is not proved in the simultaneous-tail or worst-case sense.
      ha2_calibration:
        source_hypothesis: H-SYC-b854f4
        formula: E[X] = N^(-1/3 + gamma_x + o(1))
        finite_ladder_convention: For the arithmetic KAT only, set the unspecified o(1) correction to zero
          and use N=2^bits. These decimals are symbolic finite reference values, not observed
          estimates or rigorous finite-N tail bounds.
