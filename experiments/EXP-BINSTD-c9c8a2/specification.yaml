  objective: >-
    Replace the prose closure of the k-list column of RQ-BINSTD-b6f698's
    reachability table for ECC2K-130 with three separable quantities: (1) the
    EXACT sum-compatible filter capacity of the ambient group of order 4l, as a
    certificate and as guarded code; (2) the ideal k-list cost table as that
    column's CEILING, conditional on a filter the certificate excludes
    exactly, with its gap, closure and floor lines in named ambients; and (3)
    the APPROXIMATE capacity of the declared Koblitz-specific arms BEYOND THE
    CERTIFICATE'S EXACT COMPONENTS, measured as a level-1 bucket gain on an
    AR-B1-admissible ladder against each arm's own histogram-preserving
    shuffle stratified by the exact quotient and an exact-saturated null, with
    exact controls, exact-content-only controls and a LEAD branch shown
    reachable for growing and flat excess and routed.

  decision_it_changes:
    selection_text_quoted: |
      QUOTED VERBATIM from DEC-20260928-63addc selected S2 decision_it_changes
      (a quotation of the selection decision, not an assertion of this
      contract): "Whether the k-list column of the reachability table for
      ECC2K-130 is recorded as a quantity (exact capacity 2 bits from the
      cofactor, a 26-bit gap per level against the ideal-tree stake,
      approximate capacity of the declared families measured against exact
      positive controls) in place of the prose closure by Theorem C. Positive
      next decision on the record's expected reading (exact controls at 2 and
      4, every declared family within the random-label null and decaying): the
      column closes for the declared families with a measured obstruction block
      and the stake stays as the column's ceiling. Negative-for-the-null next
      decision (a declared family meets the lead threshold): the route is live,
      exponent-relevant by claim (A), and goes to review-breakthrough and
      independent replication before any interpretation. Artifact (a misread
      exact control, a shuffle that reproduces the signal, no decay): nothing
      read."
    operative_reading: >-
      As this contract reads it. The "26-bit gap per level" is stated per
      named ambient (25.80 bits target subgroup, capacity 0 bits; 24.20 bits
      full group, capacity 2 bits). "Within the random-label null" is read
      BEYOND THE EXACT COMPONENTS: no stratified controlled excess (L3). POSITIVE
      NEXT DECISION on the expected reading (every run-level control and gate
      passes, PC-15 and PC-17 pass, every declared arm reads NEG): the column is
      recorded FOR THE DECLARED ARMS AND TESTED CELLS with a measured
      obstruction block (the stratified controlled excess per (cell, arm, M)
      with its seed interval and the measured floor), and the ideal-tree table
      stays as the column's ceiling. NEGATIVE-FOR-THE-NULL NEXT DECISION (an arm
      meets the LEAD threshold of SR-4): the route is live, is
      exponent-relevant only in the counterfactual sense of the ceiling, and
      goes to review-breakthrough at max and to independent replication BEFORE
      any interpretation. RESIDUAL (ART-RES): the arm is not closed, its
      numbers are recorded, the next decision is a targeted replication.
      ARTIFACT OR DEFECT (ART-DEF): nothing is read.

