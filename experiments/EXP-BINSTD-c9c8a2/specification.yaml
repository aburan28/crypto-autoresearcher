  # ---------------------------------------------------------------------------
  definitions:
    field: Carried. F_2[t]/(f), elements as non-negative integers; the field polynomial rule DF-8 (named polynomial; else a self-checked type-II ONB recurrence polynomial; else the lowest-weight irreducible, least as an integer); recorded per cell.
    normal_basis: Carried. A normal element per DF-8; coordinates by Gauss-Jordan inverse; Frobenius the cyclic shift; self-check on 100 random elements. In a normal basis Tr(c) is the sum of the coordinates of c (FHLM CACR CORR 2003-18 Section 4.2, retrieved), so F1's weight parity is Tr(x) (DF-9).
    curve: Carried. y^2 + xy = x^3 + A x^2 + B; Koblitz cells A = 0, B = 1; uniform sampling on affine points (DF-4); CELL-K17C sampled through its verified discrete-logarithm table.
    group_order_and_admission: >-
      Carried (routes A, B, C; AR-B1, AR-B1-C, AR-O), with one addition
      (RR-11): every cell's largest prime factor is PROVED PRIME BY COMPLETE
      TRIAL DIVISION to its integer square root (CODE-GATE
      prove_prime_by_trial_division; CELL-K41's 549756390943 needs odd divisors
      up to 741455). The recalled Miller-Rabin determinism bound no longer
      carries any admission. The design-time orders are INPUTS checked at
      setup (IR-9).
    halving_and_the_exact_filters: >-
      Carried. Q in 2E exactly when Tr(x(Q)) = Tr(A) (re-derived from the group
      law; FHLM Lemma 4.1(iv) at source). h2(P) = Tr(x(P)) + Tr(A). h4
      CONSTRUCTED by scalar multiplication (the tested exact control); its
      halving presentation (DF-6) supplies the STRATUM of every Koblitz arm,
      used only after PC-4b on that cell.
    exact_filters_on_a_cyclic_cell: Carried. A verified generator and an N-entry table; dlog mod M a surjective homomorphism for every M dividing N.
    exact_quotient_of_a_cell: >-
      NEW (RR-1). By the corollary of the certificate, every exact
      sum-compatible map on a declared cell below its largest prime is a
      function of the cell's EXACT QUOTIENT e: h4 (alphabet 4) on every
      Koblitz cell (order 4 x a prime), h2 (alphabet 2) on CELL-O19 (order 2 x a
      prime). On the Z/l cells e is constant.
    bucket_gain: Carried. G(h) = M x the maximum over conditioning cells with at least MIN_CELL = 100 pairs of the empirical maximum conditional sum-label frequency; EXACT, OCCUPIED and ESTIMATED (IR-12 mass rule) as in version 2.
    sample_size_rule: Carried unchanged. Rule R-M (M = 2^r, r = floor(log2(N) / p + 1/2), N = l); rule R-S (S = 2^ceil(log2(128 M^2))); the table in audit sheet stage_0.sample_table, frozen here by reference.
    stream: >-
      Carried, with a stream label (RR-10). One stream of ordered pairs per
      (cell, seed, label), of length the largest S of the cell, seeded by crc32
      of (label, cell, seed). Stage 2 and the gate use the label "stream" (the
      version-2 streams); PC-9 uses "pc9", PC-6c "pc6c", PC-18 "pc18". Labels are
      evaluated once per distinct support point and cached.
    random_label_null: >-
      RESTATED (RR-1, RR-3, RR-6). THE FAMILY NULL at every Stage 2 (cell, M) is
      the EXACT-SATURATED random label q r + e (e the point's exact quotient, r
      uniform on M / q values; q = 4 on Koblitz cells, 2 on CELL-O19), fifty
      independent draws per seed on the same pairs and gain code, pooled over
      ten seeds to 500: q50 and q99 (type-1; q99 the sixth largest of 500) and
      W = q99 - q50; and per seed V_s = q90 - q50 of that seed's fifty draws.
      Never resamples of an arm it judges. THE GATE NULL (PC-2, PC-6a, PC-6b) is
      the uniform label, twenty draws per seed, as carried. On the Z/l ladder
      the two coincide (e constant) and fifty draws per seed are used.
    histogram_preserving_shuffle: >-
      RESTATED (RR-1, route (a)). The labels of the support points are
      reassigned by a uniform random permutation under a recorded seed ACTING
      WITHIN EACH STRATUM OF THE EXACT QUOTIENT for every curve-cell arm (h4 on
      Koblitz cells, h2 on CELL-O19), including RLFAM, XCO1 and XCO2: every
      label's joint histogram with e is kept exactly, so every exact component
      the certificate counts survives the shuffle, and every other relation
      between a point and its label is destroyed. Ten per (cell, arm, M, seed).
      The unstratified branch is used for the gate's PC-6a and PC-6b and on the
      Z/l and Z/2^17 controls. The version-2 rule "stratified for the F5
      composites only" is withdrawn by supersession.
    planted_controls: >-
      (1) The planted marginal-only label (bucket 0 at probability 1/2, the
      rest uniform; a random function of the point): unstratified at every gate
      M >= 8 (PC-6b), stratified at M = 16 (PC-6d). (2) The planted mixture on
      Z/lZ (the key on a fraction rho of points, uniform on the rest), rho in 1,
      0.9, 0.8, 0.7, 0.6, 0.5, 0.25, 0.125, 0.0625 (RR-5). (3) RLFAM (PC-15). (4)
      The exact-content-only labels (RR-2): XCO1, an independent weight w ~
      Binomial(n, 1/2) conditioned on w = e (mod 2) labelled by the F1 quantile
      rule; XCO2, q r + e with r = 0 at probability 1/2, otherwise uniform on 1
      .. M/q - 1. (5) The exact label i mod M on Z/(16 x 2003) and Z/(64 x 2003)
      with strata i mod 4 (PC-6c).
    decision_clauses: >-
      Per arm F at (cell, M) and seed s: G_F(s); E_RL(s) = G_F(s) - q50 of the
      exact-saturated null; E_Sh(s) = G_F(s) - the median of its ten STRATIFIED
      shuffle readings; p(s) = (1 + the number of those readings at least
      G_F(s)) / 11; Z(s) = E_Sh(s) / V_s. L1: the median over seeds of E_RL is at
      least 3 W. L3: the median over seeds of E_Sh is at least 3 W, and p(s) =
      1/11 on at least 8 of 10 seeds. L2, PRE-REGISTERED AS NON-DECAY (RR-3): on
      the three ladder cells at their N^(1/3) alphabets, one OLS slope of Z(s)
      against log2 l per seed; the interval is the second smallest to the second
      largest of the ten slopes; L2 HOLDS WHEN THE UPPER END IS AT LEAST 0 (decay
      is not established: fewer than nine of ten seeds decline). THE LEAD FLOOR
      is L1 and L3 at all three ladder cells: a stratified controlled excess and
      an excess over the exact-saturated null each of at least 3 W at every
      ladder cell; there is no growth requirement. CLASSIFICATION per arm:
      NOT-ESTIMATED when a ladder N^(1/3) key is not estimated; LEAD when L1 and
      L3 hold on all three ladder cells at N^(1/3) and L2 holds; NEG when L3
      holds at no estimated (cell, M); ART-RES otherwise. Ordinary-cell arms are
      NEG when L3 holds at no estimated (cell, M), else ART-RES. Implemented by
      CODE-EST and CODE-FAM.
    pc9_redefinition: >-
      DISCLOSED (RR-8). PC-9 compares the median of ten curve-sampled readings
      of an out-of-family filter (the polynomial-basis coordinates of x at the
      odd positions 1, 3, ..., 2r - 1), on its own stream, with the 0.005 and
      0.995 quantiles of 200 index-sampled readings from a verified table. The
      exhaustive population value on CELL-K13 is REPORTED, NOT CHECKED: a sampled
      maximum is biased upward against its population value, so an
      exhaustive pin would need a tolerance this design does not have. The
      version-1 criterion (inside a bootstrap interval around the exhaustive
      value) was redefined in version 2 without disclosure; this is the
      disclosure.
    exact_quotient_audit: >-
      NEW (RR-1). CODE-AUDIT reports per declared (cell, arm, offset, M) the
      affine-point mass in label classes on which h2 (purity_2) and, on
      Koblitz cells, h4 (purity_4) is constant; exhaustive on CELL-K13, CELL-K19
      and CELL-O19, a 2^20-point sample with standard error on CELL-K23 and
      CELL-K41. An arm is EXACT-CARRYING when either purity is at least 0.05;
      the table is frozen in the audit sheet (C-4) and re-run at S0-6. It never
      computes a gain, shuffle, null or clause and never changes a
      classification rule.
    sr6_image_rule: NEW (CD-9). A reading counts as EXACT for SR-6 only when every used cell is a point mass AND the arm's image size on the support lies outside 1, 2, 4.
    l_b_meter: Carried unchanged. Row P1 l_fibre = 1 and b = 2 exactly; row P2 b = 1 exactly on the full group and l_image = 0 on the odd-order subgroup; b = M / G links the meter to the gain (PC-14).
    declared_filter_families: >-
      UNCHANGED FROM VERSION 2 in definition. On a Koblitz cell at alphabet
      M = 2^r, twelve arms: F1, the normal-basis Hamming weight of x in M
      quantile classes (the mid-CDF of Binomial(n, 1/2)); F2 at offsets 0,
      floor((n - r)/2), n - r, a cyclic window of r normal-basis coordinates;
      F3 at the same offsets, a window of r polynomial-basis coordinates; F4,
      the leading r coordinates of the least cyclic rotation of x's normal-basis
      vector; F5, the composites 4 t + h4 for t in F1, F2@0, F3@0 and F4 at
      alphabet M/4. On the ordinary cell, F2 and F3 at the three offsets (six
      arms, ORD-*). The list is declared and therefore incomplete. Code:
      CODE-FAM labels_from_parts (shared with CODE-AUDIT). F1 is a MIXED object
      (marginal skew plus the exact E/2E bit, DF-9); under the stratified
      comparison that bit is not excess.
    ceiling_model: >-
      Carried unchanged and COUNTERFACTUAL THROUGHOUT: k = 2^j lists of size
      L = N^(1/(j + 1)); per-attempt cost k L; B = L; relations B without orbit
      unknowns and B/262 with them; linear algebra k R^2; memory k L x 17 bytes;
      DECLARED AMBIENT the target subgroup (N = l); gap and closure lines in
      each named ambient. THE ORBIT-UNKNOWNS LINE IS CONDITIONAL on the
      per-orbit unit NO APPROVED CONTRACT HAS FIXED (CORR-20260925-649e25) AND
      on a trade class KN-FIND-47da4e declines to price; the WITHOUT-ORBIT line
      is the unconditional one of the pair. The ceiling-model thresholds g*_k
      are arithmetic of this model only; NO STATISTIC OF THIS CONTRACT IS MAPPED
      ONTO THEM (RR-4).

