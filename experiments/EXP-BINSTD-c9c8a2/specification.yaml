    ladder:
      - {id: CELL-K13, n: 13, a: 0, order_input: 8012 = 4 x 2003, alphabets: '16 (N^(1/3)) and 8 (N^(1/4))', stratum: h4, role: ladder}
      - {id: CELL-K19, n: 19, a: 0, order_input: 523492 = 4 x 130873, alphabets: '64 and 16', stratum: h4, role: 'ladder; PRIMARY cell'}
      - {id: CELL-K23, n: 23, a: 0, order_input: 8383412 = 4 x 2095853, alphabets: '128 and 32, and the fixed alphabet 16', stratum: h4, role: ladder}
    ladder_note: Carried. Three AR-B1-admissible cells; log2 l from 10.9679 to 20.9991; n = 29 and 31 inadmissible and not declared.
    fixed_alphabet:
      - {id: CELL-K41, n: 41, a: 0, order_input: 2199025563772 = 4 x 549756390943, alphabets: '16 only', stratum: h4, role: 'fixed-alphabet arm; 549756390943 proved prime at setup by complete trial division'}
    composite_control:
      id: CELL-K17C
      curve: Koblitz a = 0 at n = 17, field t^17 + t^3 + 1
      order_input: 130972 = 4 x 137 x 239, recomputed at setup
      role: Carried. The nearby object where the capacity is not 2 bits; exact filters 548 and 956 at S = 2^26 and 2^27 (PC-5); gate arms at 2, 4 and 16 and PC-9. No family arm is read on it.
    ordinary_control:
      id: CELL-O19
      curve: the n = 19 RQ-CERTBIN-836ce2 cell, field t^19 + t^5 + t^2 + t + 1, A = 46693, B = 306147
      order_input: 523646 = 2 x 261823, recomputed at setup by routes C and B
      role: Carried, with its six arms now stratified by h2 (capacity 1 bit). A stratified excess on CELL-K19 but not here would be Koblitz-specific; on both, coordinate-generic.
    calibration_cell:
      id: CELL-RC1
      curve: RC-1, n = 17, field t^17 + t^3 + 1, A = 97044, B = 126251
      order_input: 130412 = 4 x 32603, recomputed at setup by routes C and B
      role: Carried; the cell of the two absorbed calibration rows (with CELL-K19).
    generic_controls:
      - {id: CELL-Z-2003, object: Z/2003Z, alphabets: '16 and 8'}
      - {id: CELL-Z-130873, object: Z/130873Z, alphabets: '64 and 16'}
      - {id: CELL-Z-2095853, object: Z/2095853Z, alphabets: '128, 32 and 16 (16 added, RR-5)'}
      - {id: CELL-ZS16, object: 'Z/(16 x 2003)Z, strata i mod 4', alphabets: '16 (PC-6c)'}
      - {id: CELL-ZS64, object: 'Z/(64 x 2003)Z, strata i mod 4', alphabets: '64 (PC-6c)'}
      - {id: ISO-K13 to ISO-K41 and ISO-O19, object: 'Z/(4 l)Z for l in 2003, 130873, 2095853, 549756390943 and Z/(2 x 261823)Z, strata i mod 4 or i mod 2', alphabets: 'the family alphabets of the matching cell (PC-18)'}
    generic_controls_role: >-
      The Z/lZ ladder: the log-interval key i -> floor(i M / l) as the far-end
      positive control (PC-7), the growing LEAD control (PC-16), the flat LEAD
      control at M = 16 (PC-16b) and the decaying non-LEAD control at M = 16
      (PC-16c); three relabelled windows as nulls (PC-7c); the planted mixture
      as the measured resolving floor. The ZS cells pin the stratified branch
      (PC-6c). The ISO cells carry the run-level RR-2 control (PC-18).
    exact_grid_control:
      id: CELL-Z2
      object: Z/2^17 with the low log2(M) bits at M in 8, 16, 32, 64, 128
      role: CTL-MAXEXACT on every declared alphabet at its declared S (PC-1), carried
    deployed_row:
      id: ROW-ECC2K130
