# EXP-BINSTD-c9c8a2 -- VERSION 3 of the lane-B contract for the k-list column
# of RQ-BINSTD-b6f698 on ECC2K-130: the frozen (but NOT approved) contract for
# H-BINSTD-17cf9d, SUPERSEDING EXP-BINSTD-6f1e66 (version 2, unedited). Stage 0
# (zero compute) commits the guarded capacity certificate, the ideal-tree
# CEILING with its gap and closure lines and floors in named ambients, the
# ceiling-model threshold arithmetic, the Koblitz orders, the sample table and
# the exact-quotient audit. Stage 1 is the instrument gate and the run-level
# controls. Stage 2 measures the declared arms BEYOND THE CERTIFICATE'S EXACT
# COMPONENTS (every arm against its own shuffle stratified by the exact
# quotient and against an exact-saturated null). Stage 3 classifies them along
# an admissible three-cell ladder.
#
# Designed by TASK-20260929-749b50 (lane B, BATCH-35bdda, GOAL-ECDLP2M-001)
# under DEC-20260929-8c3cb2 (revise; RR-1 to RR-12) within DEC-20260928-63addc
# selected S2 and design_conditions C1 to C8. Read with CORR-20260928-4cb669,
# CORR-20260925-649e25 and CORR-20260922-81aeab.
#
# ZERO RUNS. Nothing may be executed under this contract until
# DEC-20260929-585602 approves it by name. NO SPEEDUP, NO EXPONENT, NO CLOSURE.
# =============================================================================
