    - a certificate block with kind none, this being a pure measurement contract that claims no solve and no relation

  # ---------------------------------------------------------------------------
  proof_search_map:
    inherits: H-BINSTD-17cf9d proof_search_map, in full
    bottleneck: >-
      The level-1 bucket gain G(h) of cheap filters on a binary Koblitz curve
      at the alphabets of rule R-M, read BEYOND THE EXACT COMPONENTS against the
      arm's own stratified shuffle and the exact-saturated null. Decision-changing
      because either outcome replaces a prose closure with a quantity scoped to
      the declared arms and tested cells.
    baseline_embedding:
      parameter_slice: Z/2^n low bits (PC-1); Z/lZ key growing, flat and decaying (PC-7, PC-16, PC-16b, PC-16c); the composite n = 17 cell at 548 and 956 (PC-5); Z/(16 x 2003) and Z/(64 x 2003) exact beyond the stratum (PC-6c)
      reproduction_check: SYMBOLIC for the capacity computations and AS GUARDED CODE (CODE-CERT, PC-CERT-1 to PC-CERT-4), plus the frozen fixture of ten import-safe code blocks with pass criteria stated before execution and placed in SR-1 and IR-1 to IR-24.
    observation_collision:
      observable: the stratified controlled excess per arm per cell, its excess over the exact-saturated null, and the per-seed standardised excess along the ladder
      distinct_preimage_search: >-
        OC-1 marginal skew (PC-6a, PC-6b, PC-6d; F1 reclassified as mixed); OC-2
        sparse tables (rule R-S, IR-12, PC-2, PC-9 disclosed); OC-3 secretly
        exact (certificate, SR-6 image rule); OC-4 a blind instrument (PC-1,
        PC-5, PC-7, PC-16, PC-16b); OC-5 occupancy growth (L2 per-seed, PC-15);
        OC-6 exact-content-only labels (stratified comparison; PC-6c, PC-6d,
        PC-17, PC-18).
    quantifier_order: >-
      The certificate is universal over finite abelian groups and exactly
      sum-compatible maps. The measurement is over THE TESTED CELLS and THE
      DECLARED ARMS ONLY, at level 1 only, beyond the exact components and
      above the measured floor at the declared S. Nothing is claimed about
      undeclared or target-dependent filters, levels above 1, or any deployed
      curve's cost or security.
    method_ceiling:
      strongest_certifiable_claim: The alphabet bound on ECC2K-130 plus the classifications beyond the exact components on the tested cells with every positive and exact-content-only control read. It can NEVER certify that no cheap filter exists, and a NEG bounds an arm's stratified controlled excess only at the measured floor.
      nearby_object_control: CELL-K17C, the Z/l key ladder, CELL-Z2, the ZS and ISO cells, CELL-O19, RLFAM, XCO1 and XCO2, all blocking
    proof_obligations: inherits PO-1 to PO-11 of H-BINSTD-17cf9d
    not_applicable_reason: null

  # ---------------------------------------------------------------------------
  interpretation_limits:
    - Designed, NOT approved. approved_by is null. No run exists and none is authorized until DEC-20260929-585602 approves this contract by name.
    - NO SPEEDUP, NO EXPONENT, NO CLOSURE, NO DEPLOYED-CURVE VERDICT. This contract certifies a capacity, records a ceiling, and measures a control beyond the exact components.
    - THE CEILING IS COUNTERFACTUAL AND IS LABELLED SO EVERYWHERE IT APPEARS. No ideal-tree total is a reachable cost, a prediction or an outcome; no statistic of this contract is mapped onto the ceiling-model thresholds; the outcome table contains no cell below matched rho.
    - THE ORBIT-UNKNOWNS LINE IS CONDITIONAL, on the per-orbit unit no approved contract has fixed and on a trade class KN-FIND-47da4e declines to price; the without-orbit line is the unconditional one of the pair, itself under the ceiling label.
    - >-
      RESOLVING FLOOR, MEASURED (RR-5). At the declared S, L1 and L3 register an
      excess only at or above 3 W of the exact-saturated null; the operative
      floor is the measured planted-mixture rho per (l, M) on a grid reaching
      rho = 1, so it exists at M = 8, 16 and 32 and at the fixed alphabet. The
      version-2 design figures (about 2.8, 3.5, 4.7, 6.3 and 8.8 at M = 8 to 128)
      are WITHDRAWN as the floor; they were underestimates for a uniform label
      (version-2 review computations about 8.90 and 14.57 at M = 64 and 128) and
      do not describe this reference. A NEG says an arm's stratified controlled
      excess lies below the floor, never that G = 1.
    - LEAD REACH IS SCOPED to what PC-16, PC-16b and PC-16c show (success_criterion); L2 is a non-decay test and does not separate a decay slower than PC-16c's.
    - >-
      THE L1 REFERENCE IS THE EXACT-SATURATED NULL. On a synthetic group of
      CELL-K13's isomorphism type at M = 16 its q50 is about 6.1 and its W about
      0.71, against 2.45 and 0.49 for a uniform label (audit sheet C-5, design
      figures); a genuine filter therefore reaches L1 only by beating what the
      certificate's free 2 bits already read. L1 is not a separator by itself (an
      exact-content-only label with a skewed residual meets it, C-5); L3 is, and
      NEG is read on L3 alone.
    - The exact-quotient audit (C-4, design figures) finds F1 and the four F5 composites EXACT-CARRYING on every audited cell and alphabet (F1 on the E/2E bit, purity_2 0.76 to 0.99, purity_4 0; F5 purity 1) and no other arm; under the stratified comparison this changes no rule.
    - Toy tier. Ladder at n at most 23, fixed-alphabet reading to n = 41. The transfer to n = 131 is HEUR-B2, a heuristic and never a bound, testable only on held-out tested cells.
    - Level 1 only. Target-dependent filters are out of family. The declared arm list is incomplete by construction.
    - NO BUDGET QUANTITY. None of D1, D2 or D3 of CORR-20260928-4cb669 is used and no per-attempt oracle budget is asserted; were one ever needed it would be D3, never D1. Matched rho 2^60.8090 is the only reference quantity, on the ceiling, floor and threshold lines only.
    - The absorbed IDEA-20260926-d06324 rows and the cited IDEA-20260922-153a90, IDEA-20260922-faa8d2 and IDEA-20260922-845a77 records are cited BY ID and are not edited.
    - Wagner 2002 is cited as retrieved at source (version-1 and version-2 red teams); the halving criterion is RE-DERIVED FROM THE GROUP LAW and corroborated at source by FHLM CACR CORR 2003-18 Section 4 (retrieved, verified_by TASK-20260929-7d8385); nothing is relayed through IDEA-20260922-1b16d7 or IDEA-20261001-39014f.
    - The primality of l rests on the primary source's statement; the certificate's divisor set of 4l is conditional on it, as is every deployed-row line.
    - This contract asserts nothing about the AUXIN census, about EXP-FROB-30006a or any RUN-FROB value, or about any EXP-QSP-70b731 run. None was read.

