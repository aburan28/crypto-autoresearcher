      - Stage 0, zero compute. The capacity certificate and its four control readings, as guarded code (CODE-CERT).
      - Stage 0, zero compute. The ideal k-list CEILING table at k in 4, 8, 16, 32, with and without orbit unknowns, the gap and closure lines in both named ambients, the (C3) and (C4) floors with their ambients, and the ceiling-model threshold arithmetic.
      - Stage 0, zero compute. The Koblitz orders and admissibility; the sample-size table; the exact-quotient audit (CODE-AUDIT, re-run at S0-6 against the frozen C-4 table).
      - Stage 1. Run-level controls (PC-CERT-1 to PC-CERT-4, PC-1, PC-5, PC-6c, PC-7, PC-7c, PC-16, PC-16b, PC-16c, PC-18, PC-11 to PC-14) and the per-cell gate (PC-8, PC-2, PC-3, PC-4, PC-4b, PC-6a, PC-6b, PC-6d, PC-9), with the two absorbed calibration rows; issue_clearance (PC-10).
      - Stage 2. The declared arms on the ladder cells at N^(1/3) and N^(1/4), on the fixed-alphabet cells at M = 16 and on the ordinary cell, ten seeds, ten stratified shuffles per seed, the exact-saturated null, and the held-out labels RLFAM, XCO1 and XCO2.
      - Stage 3. The per-arm classification along the ladder (L1 to L3), PC-15, PC-17 and the HEUR-B2 held-out tests.
      - The HEUR-B1 validation by direct pair-sum counting on the primary cell, as committed code (CODE-HB1).
    excluded:
