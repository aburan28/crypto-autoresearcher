experiment:
  id: EXP-HAWKL-46ac46
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-6605ac; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-6605ac
  question_id: RQ-HAWK-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Generator-fidelity battery for the HAWK lane: declared rule versus an independently written
    constraint-equivalent generator versus a deliberately perturbed positive control, with per-statistic
    constraint-determined or rule-determined classification.'
  objective: 'The one uncertainty a run reduces is how much of what the HAWK lane measures is a property
    of the mathematics its records claim to study and how much is a property of the particular generator
    it happens to run. Concretely: (i) whether the declared HAWK-SHAPED generation rule is recoverable
    from the lane''s committed specifications and hypothesis scope statements to the level of an implementable
    algorithm, and how many of its parameters those records leave under-determined - the count being
    a finding in its own right; (ii) which battery statistics are pinned by the stated constraint
    set (they agree between the declared rule and an independently written generator satisfying the
    same constraints) and which are pinned only by the rule''s incidental choices (they disagree beyond
    sampling error), reported per statistic with permutation p-values across ring degrees 4, 8 and
    16; (iii) whether the battery has any power at all, established by a third generator deliberately
    perturbed in one stated way, which the battery must detect - without this arm firing, an agreement
    result between the two honest generators is uninterpretable and the run reports insufficient power
    instead. A run measures no timing, calls no solver, and makes no claim about HAWK itself.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: at ring degrees 4,
      8 and 16, at the stated sample size, statistics S1..Sk are indistinguishable between the declared
      rule and an independently written constraint-equivalent generator while statistics T1..Tm differ,
      with the deliberately perturbed control detected on statistics U1..Uj, and with p free parameters
      of the declared rule left under-determined by committed records. What does NOT follow: nothing
      about fidelity to HAWK, whose specification is unread by this program; nothing about the joint
      distribution of the statistics, since only marginals are tested; nothing that validates or invalidates
      any committed HAWK-lane conclusion; nothing about sample sizes or ring degrees beyond those
      run; and no statement about HAWK''s security in either direction.'
  inputs:
    procedure: 'STAGE 0 (cost: a day of human work). Read the committed specifications and hypothesis
      scope statements; write out the declared rule as an implementable algorithm; list every parameter
      the records leave under-determined and freeze a choice for each, recording that the choice is
      ours. Write the constraint set separately and FREEZE IT before the next stage; the specification
      records the write order. STAGE 1 (cost: hours). Implement the second generator against the frozen
      constraint set only, without consulting the first implementation. STAGE 2 (cost: hours). Implement
      the perturbed control generator by changing exactly one stated incidental property of the declared
      rule while preserving all constraints. STAGE 3 (cost: minutes). Generate 1000 instances per
      generator per ring degree in {4, 8}, and 300 per generator at ring degree 16. STAGE 4 (cost:
      minutes to hours). Compute the battery on every instance, with short-vector-dependent statistics
      computed exactly where feasible and flagged where not. STAGE 5 (cost: minutes). Constraint-conformance
      check on every instance; any failure halts as a bug report. STAGE 6 (cost: minutes). Two-sample
      permutation tests, 10000 shuffles: honest-versus-honest, declared-versus-perturbed, and seed-split
      within each generator; apply the frozen multiple-comparison correction. STAGE 7 (cost: minutes).
      Emit the classification vector, the under-determined parameter list, and the whole metric table
      through harness/runner.py as a reusable instrument record.'
    instrument: Python 3 with exact integer arithmetic; integer matrices as tuples of tuples; sympy
      for cyclotomic reduction, Smith and Hermite normal forms and modular rank; numpy for permutation-test
      bookkeeping only. Short-vector statistics use the same hand-written exact-integer enumeration
      as the other lattice contracts in this batch; no external lattice library is required and none
      is assumed. No computer-algebra system and specifically no Sage. No timing measurement is used
      as a metric anywhere, so results are hardware-independent. Runs, seeds and manifests through
      harness/runner.py, extending the EXP-HAWK-a2f34a instrument lineage that this contract is auditing.
    parameters: 'Three generators: declared rule, independent constraint-equivalent rule, deliberately
      perturbed control. Ring degrees n in {4, 8, 16}; 1000 instances per generator at degrees 4 and
      8, 300 at degree 16. Battery of approximately 10 statistics: Gram entry mean, Gram entry variance,
      orthogonality defect, shortest-vector length over the 2n-th root of the determinant, automorphism
      group order, determinant, Gram rank mod 2, mod 3, mod 5, and count of distinct Gram entry values.
      Permutation shuffles: 10000. Multiple-comparison correction frozen in the specification. Seeds
      declared.'
  controls:
  - 'Deliberately-perturbed generator as a positive control: the battery MUST detect it, or no agreement
    finding is interpretable.'
  - 'Constraint-conformance boolean on every instance from every generator: a constraint violation
    is a bug report, not a statistic.'
  - 'Seed-split control: split each generator''s own output in half by seed and run the identical
    two-sample test within one generator; this must show no difference and calibrates the test''s
    false-positive rate.'
  - 'Degree-scaling control: report every statistic across ring degrees 4, 8, 16 so that a jump is
    visible rather than averaged away.'
  - 'Order-of-writing control: the constraint set is written and frozen before the second generator
    is implemented, and the specification records the commit order.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a generator known to be WRONG in a stated way: a
    third generator that satisfies the stated constraint set but deliberately violates one incidental
    property of the declared rule (for instance, drawing basis entries from a distribution with a
    different tail while preserving determinant and unimodularity). Run through the identical battery
    in the same invocation. For the signal comparison to mean anything, the battery must DETECT this
    deliberately-perturbed generator on at least one statistic at the sample size used - otherwise
    the battery has no power and the finding that the two honest generators agree is vacuous. This
    is the positive control that makes an agreement result interpretable, and it is the single most
    important arm of the contract, since without it ''the generators agree'' is indistinguishable
    from ''the battery cannot tell anything apart''.'
  independent_variables:
  - generator (declared, independent, perturbed control)
  - ring degree n in {4, 8, 16}
  - statistic identity within the frozen battery
  - seed split (first half versus second half, for false-positive calibration)
  metrics:
    primary:
    - per-statistic permutation p-value, declared versus independent generator
    - per-statistic permutation p-value, declared versus perturbed control
    - classification vector (constraint-determined / rule-determined / degree-anomalous) per statistic
    - count of under-determined parameters in the declared rule
    secondary:
    - seed-split within-generator p-values
    - constraint-conformance failure counts
    - per-statistic values and dispersions at each ring degree
    - largest ring degree at which each statistic was computed exactly rather than sampled
  heuristic_under_test: null
  preregistered_prediction:
    quantity: m, the number of battery statistics classified rule-determined, i.e. on which the declared
      rule and the independently written constraint-equivalent generator differ at the corrected significance
      level, at ring degree 8.
    formula: 'm = |{ statistic S : p_corrected(declared, independent; S) < 0.05 at n = 8 }|, reported
      only if the positive control condition holds, namely |{ S : p_corrected(declared, perturbed;
      S) < 0.05 }| >= 1. Predicted m >= 1. If the positive control condition fails, m is not reported
      at all and the run reports insufficient battery power instead - this conditionality is part
      of the pre-registration, not a post-hoc escape.'
    source: Pre-registered in the parent proposal IDEA-20260816-6605ac before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Ring degrees 4, 8 and 16 (dimensions 8, 16, 32), matching the scope already declared
      in H-HAWK-c7a551 so that the audit covers exactly the range the lane's existing experiments
      use. No extrapolation to larger degrees or to HAWK parameters is performed or licensed. Fidelity
      is measured relative to a stated constraint set and a second implementation, and the substitution
      cost relative to HAWK itself remains unmeasured and is explicitly stated as such in every output.
    correspondence: null
  tail_checks:
  - Check statistics that take very few distinct values at ring degree 4, where permutation tests
    degenerate; report them at degree 8 and 16 only.
  - Check the instances with extreme orthogonality defect from each generator individually, to confirm
    the rejection or acceptance logic is not truncating a tail.
  - Check whether any generator ever produces a non-unimodular or wrong-determinant basis, which is
    a constraint violation and halts the run.
  - 'Check the perturbed control''s detection margin: if it is detected on only one statistic and
    only barely, report the battery power as marginal rather than adequate.'
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report insufficient power if the perturbed control is undetected by every statistic.
  - Halt as a bug report if any generator produces constraint violations.
  - Halt if the seed-split control shows within-generator differences at the corrected level, indicating
    an inflated false-positive rate.
  - Halt the ring degree 16 arm if exact short-vector statistics exceed the wall-clock budget, and
    report which statistics were sampled rather than computed.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run emits a per-statistic classification vector with corrected permutation
    p-values for both the honest-versus-honest and declared-versus-perturbed comparisons at each ring
    degree, together with the seed-split calibration, the constraint-conformance counts and the under-determined
    parameter list - with the perturbed control detected on at least one statistic and the seed-split
    control clean.
  falsification_criterion:
  - The perturbed control is undetected by every statistic (insufficient power; no fidelity conclusion
    available).
  - The seed-split control shows within-generator differences at the corrected level.
  - Any generator produces constraint violations.
  - Every statistic is classified rule-determined, meaning the stated constraints pin essentially
    nothing.
  - The declared rule proves unrecoverable from committed records to an implementable level.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-6605ac
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must decide whether parameters left under-determined by committed records may
    be frozen by this contract's own choice (as proposed) or whether the contract must instead report
    the under-determination and stop.
  - The constraint set is the reference against which fidelity is defined and is not fully written
    anywhere; the Coordinator must approve it, and a weak constraint set makes almost everything rule-determined
    while a strong one makes almost nothing so.
  - 'The perturbation used for the positive control must be chosen by the Coordinator: too subtle
    and the battery reports no power, too gross and the control proves nothing about realistic differences.'
  - The multiple-comparison correction is unspecified and materially determines the headline count
    m.
