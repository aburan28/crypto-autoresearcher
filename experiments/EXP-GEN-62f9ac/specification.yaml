experiment:
  id: EXP-GEN-62f9ac
  hypothesis_id: H-GEN-7a1474
  version: 1
  title: >-
    Genus, spinor genus and class bits of the Gross lattice: a three-stratum
    information budget for EndRing, with a positive control that proves the
    pipeline can report more than one spinor genus
  status: review_required
  objective: >-
    Fix a lattice convention; derive and then verify computationally that all
    Gross lattices at a fixed p share one genus symbol; compute the number of
    spinor genera in that genus from the genus symbol alone across a prime ladder
    covering every residue class mod 24; assemble the bit budget
    0 + log2(#spinor genera) + log2(h) and reconcile the last term against the
    mass formula; and run the DEFI-side contrast on which the method must give
    the opposite verdict.
  experiment_class: measurement
  inputs:
    prime_ladder: >-
      At least 20 primes covering every residue class mod 24 and spanning a
      factor 100 in p, up to roughly 10^4. Frozen into primes.json before any
      run, with the smallest p at which the class set has more than two elements
      recorded explicitly -- below that, "all curves share a genus" is vacuous
      and must not be counted as a confirmation.
    lattice_convention: >-
      FIXED AT STAGE 1 AND NAMED IN EVERY REPORTED NUMBER. Trace-zero elements of
      the order, Gross's {2x - Tr(x)}, and scaled reduced-norm forms differ by
      factors that matter at the prime 2, where genus symbols and spinor norm
      groups are the classical source of error. One convention is chosen,
      recorded, and never mixed.
    positive_control_family: >-
      Classical ternary lattices KNOWN to lie in at least two spinor genera,
      small enough to compute by hand and verify against published values.
    defi_contrast_forms: >-
      The indefinite quadratic forms of the DEFI setting recorded in
      KN-LIT-7648, where genus = spinor genus = equivalence class.
  controls:
    - id: C1_positive_spinor_control
      description: >-
        Run the identical genus / spinor-genus pipeline on the family known to
        have >= 2 spinor genera. It MUST report >= 2. BLOCKING AND DECISIVE: a
        pipeline that has only ever returned 1 has not been shown able to return
        anything else, and B2 would be unfalsifiable as measured. This is the
        null-sufficiency failure mode of KN-TECH-1a5b7e / KN-TECH-6c0e15 in its
        purest form.
    - id: C2_defi_contrast
      description: >-
        The same pipeline on the DEFI-side forms must report the COLLAPSE (genus
        = spinor genus = class), i.e. the opposite verdict. BLOCKING: a pipeline
        reporting "irreducibly global" for both is asserting a conclusion rather
        than measuring the stratification.
    - id: C3_mass_formula
      description: >-
        The supersingular vertex count at each p must match the classical mass
        formula exactly, computed independently, BEFORE any lattice is built.
        BLOCKING.
    - id: C4_two_constructions
      description: >-
        The supersingular vertex set built by two independent constructions must
        agree exactly at every prime. BLOCKING.
    - id: C5_class_separation
      description: >-
        Two maximal orders known to be NON-isomorphic at the same p must have
        IDENTICAL genus symbols (that is B1) and must be separated by a
        class-level invariant (that is the residual term). This demonstrates the
        pipeline distinguishes the strata rather than collapsing them.
  independent_variables:
    - prime p (>= 20 values covering all residue classes mod 24)
    - lattice family (Gross lattices, positive-control family, DEFI-side forms)
  metrics:
    primary:
      - >-
        distinct_genus_symbols(p): number of distinct genus symbols among the
        Gross lattices of all supersingular curves at p. Predicted exactly 1.
      - >-
        spinor_genera_count(p): number of spinor genera in that genus, computed
        from the genus symbol alone. Predicted 1 or 2.
      - >-
        bit_budget(p) = 0 + log2(spinor_genera_count) + log2(h), with h computed
        and independently cross-checked against the mass formula.
    secondary:
      - the full genus symbol per p, recorded verbatim
      - spinor count as a function of p mod 4, 8 and 12
      - class number h computed versus mass-formula predicted
      - the smallest p at which the class set is large enough for B1 to have content
      - wall-clock, peak memory, and the largest p reached
  measured_vs_modeled:
    measured:
      - genus symbols, spinor counts, class numbers, vertex counts
      - the positive-control and DEFI-contrast pipeline outputs
    modeled:
      - B1 (local conjugacy of maximal orders implies a common genus)
      - the mass formula h ~ p/12 with its p mod 12 corrections
      - HEUR-GEN-1's congruence-only dependence of the spinor count
    rule: measured and modeled never share a column; every modeled entry names its source
  optimistic_assumptions:
    - >-
      One lattice convention is used throughout. BIAS: the spinor count is
      convention-dependent at 2, so a different convention could give a different
      number. Direction: unknown sign; mitigated by recomputing the spinor count
      under a second convention at three primes as a robustness check, and by
      SUPERSEDING the record rather than patching it if the two disagree.
    - >-
      Toy p up to 10^4. BIAS: B1 is confirmed only where the class set is small
      enough to enumerate. Direction: understates nothing about the derivation,
      but the confirmation is narrow and the record says so.
    - >-
      The DEFI contrast uses the forms as recorded in the corpus entry rather
      than reconstructed from the primary paper. BIAS: the contrast is only as
      good as that entry. Direction: flatters the contrast if the entry
      simplified.
  optimistic_assumption_rule: >-
    Every reported spinor count names its lattice convention, and the bit budget
    is labeled an information-theoretic accounting rather than a computational
    one. The list above is reproduced in the results report with the direction of
    each bias.
  heuristic_under_test: HEUR-GEN-1
  preregistered_prediction:
    quantity: >-
      The number of spinor genera in the genus of the Gross lattice, as a
      function of p.
    formula: >-
      spinor_genera_count(p) is in {1, 2} and depends on p only through p mod 4,
      8 and 12 -- i.e. the induced partition of the prime ladder by spinor count
      equals the partition by residue class mod 24.
    source: >-
      HEUR-GEN-1 in H-GEN-7a1474, from the local determination of spinor norm
      groups for a quaternion algebra ramified exactly at p and infinity. Frozen
      before execution; a revision is a protocol_amendment.
  scale_relevance:
    tier: toy
    justification: >-
      p <= 10^4 is where the full supersingular vertex set and its maximal orders
      can be enumerated, so B1's "exactly one genus symbol" is checked
      exhaustively rather than sampled. Crucially, the SPINOR COUNT is computed
      from the genus symbol alone and therefore does NOT require solving EndRing
      for any curve -- which is what makes the experiment feasible at all. What
      transfers to cryptographic p is the derivation; the enumeration does not.
      Resulting evidence is capped at claim_tier toy.
    correspondence: null
  tail_checks:
    - >-
      The primes at which the spinor count changes, if any, required to be
      exactly the residue-class boundaries mod 24 predicted by HEUR-GEN-1.
    - >-
      The largest p reached, with its class number and wall-clock, documenting
      the feasibility wall rather than implying it.
    - >-
      The three primes at which the spinor count is recomputed under a SECOND
      lattice convention, reported side by side with the first.
  replication:
    seeds: [5, 10, 15]
    independent_instances: 3
    note: >-
      Genus symbols and spinor counts are deterministic functions of p and the
      convention, so seeds vary only the construction route for the vertex set
      and the order representatives. Results must be IDENTICAL; a seed-dependent
      genus symbol indicates a bug in order construction, not variance.
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 60
    maximum_memory_gb: 16
    maximum_runs: 300
  stopping_rules:
    - >-
      HALT at C1 if the positive control cannot report >= 2 spinor genera. B2
      would be unfalsifiable and nothing about it may be reported.
    - >-
      HALT at C2 if the DEFI contrast gives the same verdict as the supersingular
      side.
    - >-
      Abandon a prime whose order enumeration exceeds the memory cap; record it
      as INFRASTRUCTURE-LIMITED, never as a genus result.
    - >-
      Stop at the CPU-hour cap; report completed primes and name the rest. Do NOT
      interpolate the spinor count across a missing residue class -- the
      congruence prediction is exactly what the missing class would test.
  invalidation_rules:
    - Any BLOCKING control failing invalidates every downstream number.
    - >-
      A spinor count reported without its lattice convention is invalid
      regardless of its value.
    - >-
      A confirmation of B1 at a prime whose class set has two or fewer elements
      is vacuous and may not be counted; such primes are reported separately.
    - >-
      Crashes, timeouts and memory exhaustion are infrastructure outcomes under
      AGENTS.md rule 5.
  success_criterion: >-
    C1-C5 pass, and the experiment reports the genus symbol, spinor count, class
    number and assembled bit budget for every completed prime, together with the
    spinor count's dependence on residue class mod 24, the second-convention
    robustness check at three primes, and an explicit forward-guidance statement
    distinguishing arithmetic-local from graph-local invariants. The experiment
    succeeds whichever way the numbers fall.
  falsification_criterion: >-
    B1 is REFUTED by two supersingular curves at the same p with different genus
    symbols -- escalated immediately, since it would be a locally computable
    distinguisher. B2 is refuted by a spinor count of 4 or more together with a
    computable separator. HEUR-GEN-1 is refuted independently by a count varying
    within a residue class mod 24; that refutes neither B1 nor B3 but means the
    spinor term must be computed per prime rather than predicted. C1 or C2
    failing refutes nothing and reports nothing.
  required_artifacts:
    - the Stage-1 convention decision, written out with its effect at the prime 2
    - frozen primes.json with the residue-class coverage and the vacuity threshold
    - per-run manifest with command, commit, environment, seed, resolved model
    - full genus symbols per prime, recorded verbatim
    - spinor-genus counts with the local spinor norm data they were computed from
    - class numbers computed and mass-formula predicted, side by side
    - the second-convention robustness check at three primes
    - control outcomes C1-C5 with pass/fail and measured values
    - the forward-guidance statement naming what B1 forbids (arithmetic-local
      invariants) and, explicitly, what it does NOT forbid (graph-neighbourhood
      invariants, delta-type global statistics, orientation data, theta-series
      truncations)
  assigned_to: executor
  approved_by: null
  approval_note: >-
    Status is review_required. 60 CPU-hours. Note that C1 is the control this
    experiment most needs and the one most likely to be skipped: without a
    demonstration that the pipeline CAN report more than one spinor genus, a
    measured count of 1 is not a measurement.
