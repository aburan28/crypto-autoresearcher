# EXP-SSI-494592
# Equality-bit quotient of eight endomorphisms on E[4].
# Frozen before any run. The partition below is a prediction, not a result.
experiment:
  id: EXP-SSI-494592
  hypothesis_id: H-SSI-cb227f
  source_idea: IDEA-20261004-edbd24
  question_id: RQ-SSI-1946c9
  goal_id: GOAL-SSI-2fa82a
  version: 1
  title: >-
    E[4] equality-bit fibers for iota and Frobenius on y^2 = x^3 + x
  status: approved
  frozen: true
  designed_at: '2026-10-05'
  approved_by: coordinator
  approval_decision_id: DEC-20261005-1f5fae
  objective: >-
    List the sixteen points of E[4] over F_{p^2}, apply each of
    the eight witnesses, and partition the witnesses by the set
    of points they fix.
  inputs:
    primes: [7, 11, 19]
    curve: "y^2 = x^3 + x"
    field: "F_p[i] / (i^2 + 1)"
    witnesses: "iota^a after pi^b, a in 0..3, b in 0..1"
    predicted_point_count:
      7: 64
      11: 144
      19: 400
    predicted_e4_count:
      7: 16
      11: 16
      19: 16
    predicted_fiber_count:
      7: 7
      11: 5
      19: 5
    predicted_largest_fiber:
      7: 2
      11: 3
      19: 3
    predicted_replay_disagreements:
      7: 0
      11: 0
      19: 0
    predicted_fibers:
      7:
        - [[0, 0]]
        - [[0, 1]]
        - [[1, 1]]
        - [[2, 0]]
        - [[2, 1]]
        - [[3, 1]]
        - [[1, 0], [3, 0]]
      11:
        - [[0, 0]]
        - [[0, 1]]
        - [[2, 1]]
        - [[1, 0], [3, 0]]
        - [[1, 1], [2, 0], [3, 1]]
      19:
        - [[0, 0]]
        - [[0, 1]]
        - [[2, 1]]
        - [[1, 0], [3, 0]]
        - [[1, 1], [2, 0], [3, 1]]
    predicted_fix_counts:
      7: [16, 4, 8, 4, 4, 8, 2]
      11: [16, 4, 4, 2, 4]
      19: [16, 4, 4, 2, 4]
  controls:
    - >-
      Pair control. iota and iota^3, the witnesses (1, 0) and
      (3, 0), stay in one fiber at every prime. Each fixes two
      points of E[4].
    - >-
      Fine control. At p=7 every other witness is a singleton.
      At p=11 and p=19 the witnesses (1, 1), (2, 0), and (3, 1)
      form one fiber.
    - >-
      Two Frobenius routes. One uses (a + b i)^p = a - b i.
      The other raises each coordinate to the p-th power in
      F_{p^2}. They must not import each other's fibers.
    - >-
      Endomorphism check. iota squared equals negation on every
      point of E[4]. A failure invalidates the cell.
  independent_variables:
    - prime in {7, 11, 19}
    - frobenius_route in {closed_form, exponent}
  metrics:
    primary:
      - fibers
      - fiber_count
      - largest_fiber
      - replay_disagreements
      - routes_agree
    secondary:
      - point_count
      - e4_count
      - fix_counts
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: >-
      The witness partitions under inputs. Fiber counts are
      7, 5, 5. Largest fibers are 2, 3, 3. Replay disagreements
      are 0.
    formula: >-
      A fiber is a maximal set of witnesses with the same set of
      fixed points in E[4]. Membership is compared after sorting
      each witness pair as [a, b] and sorting each fiber by its
      pairs. Fibers are then sorted by length and then
      lexicographically. Fix counts follow that fiber order.
    source: >-
      IDEA-20261004-edbd24, specialized from E[2] to E[4] on this
      curve. The partition was computed in the design session
      and is not a run.
  scale_relevance:
    tier: toy
    justification: >-
      Three primes and a 16-point module. No transfer to a
      cryptographic endomorphism-ring scheme.
    correspondence: null
  tail_checks:
    - >-
      p=7 must be reported. Dropping the singleton-heavy cell
      invalidates the batch.
    - >-
      The group order over F_{p^2} must be (p+1)^2, and E[4]
      must contain 16 points. Any other count invalidates the cell.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: >-
      Deterministic. One manifest per prime and Frobenius route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 6
    maximum_workers: 1
  stopping_rules:
    - Stop after six valid manifests.
    - Do not add a prime, a curve, or a torsion level.
    - Do not continue a cell after the routes disagree.
  invalidation_rules:
    - The two Frobenius routes disagree.
    - iota squared fails to equal negation on some point of E[4].
    - The point count is not (p+1)^2 or E[4] does not have 16 points.
    - A timeout, crash, or missing manifest.
  success_criterion: >-
    All six manifests are valid, the routes agree, iota squared
    equals negation, replay disagreements are 0, fiber counts are
    7, 5, and 5, largest fibers are 2, 3, and 3, and the sorted
    fibers equal the pre-registered partition.
  falsification_criterion: >-
    The routes agree, iota squared equals negation, the point
    counts are the required ones, and a fiber membership, a fiber
    count, or a largest-fiber value differs from the table. A
    route disagreement or a point-count failure does not meet
    this criterion.
  required_artifacts:
    - experiments/EXP-SSI-494592/runs/<run-id>/command.txt
    - experiments/EXP-SSI-494592/runs/<run-id>/stdout.txt
    - experiments/EXP-SSI-494592/runs/<run-id>/stderr.txt
    - experiments/EXP-SSI-494592/runs/<run-id>/result.json
    - experiments/EXP-SSI-494592/runs/<run-id>/fibers.json
  assigned_to: executor
  out_of_scope:
    - Any torsion other than E[4].
    - Any prime outside {7, 11, 19}.
    - Any curve other than y^2 = x^3 + x.
    - A SÉTA, SiGamal, or LIT-SiGamal implementation.
    - Editing H-SSI-d4f424 or EXP-SSI-f08a63.
