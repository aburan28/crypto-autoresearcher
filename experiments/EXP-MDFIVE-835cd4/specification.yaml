experiment:
  id: EXP-MDFIVE-835cd4
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-79aec0; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-79aec0
  question_id: RQ-MDFIVE-6870c1
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Enumerate MD5's padding-pinned final-block word mask per length residue and measure the resulting
    drop in best chunk separation under value-pinning and difference-pinning, against schedule and
    mask nulls.
  objective: 'The run reduces one uncertainty: how much of the collision-preimage asymmetry is contributed
    by Merkle-Damgard strengthening rather than by the compression function, expressed as a measurable
    drop in a split statistic. As parts: (i) it enumerates exactly which final-block words the padding
    rule pins, for every message-length residue class, which is an exact computation with no modelling
    freedom and either matches an independent transcription of the rule or exposes an error; (ii)
    it measures the change in best achievable chunk separation caused by that pinning under two regimes,
    a preimage-like value regime and a collision-like difference regime, using one enumeration routine
    that cannot tell them apart except through its forbidden-word set; (iii) it places the observed
    drop inside two null distributions, one over schedules and one over masks, which between them
    separate the effect of MD5''s schedule from the effect of pinning any two words at all. The run
    reduces no uncertainty about attack cost, produces no preimage and no collision, and cannot show
    that the mode is or is not the source of the asymmetry in any absolute sense. A zero or null-enveloped
    drop closes the mode reading for this statistic with a number and redirects to the compression-function
    candidates measured by the sibling records.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: for MD5 as specified, message-length
      residue class c, and the inherited chunk-separation definition, padding pins the enumerated
      word set and reduces best chunk separation by D steps under value-pinning and by zero under
      difference-pinning, with MD5''s D at the stated position in both nulls. What does NOT follow:
      no complexity of any kind, no claim that lifting the padding constraint would enable anything,
      no statement about multi-block strategies, and no claim about MD5''s preimage resistance.'
  inputs:
    procedure: STAGE 0 transcribe MD5's padding and length-encoding rule twice independently and require
      exact agreement; cost minutes, mismatch halts. STAGE 1 enumerate the pinned-word mask for all
      512 length residues modulo the block size; cost seconds. STAGE 2 import the chunk-separation
      enumeration from the sibling record unchanged and extend it with a forbidden-word parameter,
      validating that the forbidden set empty reproduces the sibling record's published value exactly;
      cost minutes, and a mismatch halts. STAGE 3 compute separations under the three regimes for
      every residue class; cost seconds. STAGE 4 run the shape-matched schedule null at 10^4 samples
      with MD5's mask; cost under a minute. STAGE 5 run the random-mask null at 10^4 samples on MD5's
      schedule; cost under a minute. STAGE 6 rerun STAGES 1 through 5 with the partial-word treatment
      flipped, producing the bracket. STAGE 7 rerun on MD4. STAGE 8 emit the manifest, the mask table
      and the full drop distributions.
    instrument: Python 3.11 standard library, run under harness/runner.py for the manifest and seeds.
      The chunk-separation enumeration is imported from the sibling record's module rather than reimplemented,
      so that the ablation and the baseline share code exactly and any difference between them is
      the mask and nothing else. hashlib is used only to fingerprint the schedule and padding tables
      into the manifest; no hash is evaluated for a measurement. No Sage, no solver.
    parameters: 'MD5: 64 steps, 16 words of 32 bits per block, 512-bit block, padding of one bit then
      zeros then a 64-bit little-endian length. Message-length residues: all 512 classes modulo the
      block size, expressed at byte granularity as 64 classes plus the bit-level cases. Nulls: 10^4
      samples each. Partial-word bracketing: two full passes. MD4 arm: 48 steps, same strengthening,
      same enumeration. Random-mask null draws two of sixteen words uniformly, all 120 combinations
      enumerated exhaustively rather than sampled where possible.'
  controls:
  - Shape-matched random schedules with MD5's actual mask, 10^4 samples, same invocation.
  - Random-mask null pinning two arbitrary words of MD5's actual schedule, 10^4 samples.
  - Difference-pinning arm, which must produce a drop of zero and is a correctness check on the model
    rather than a comparison.
  - Partial-word bracketing, running the whole ablation twice with partly pinned words counted as
    pinned and as free.
  - MD4 with the same strengthening, checking the instrument moves between primitives.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls, both in the same invocation. First, shape-matched random
    schedules with the identical pinned-word mask, giving the distribution of separation drops that
    any four-uses-per-word schedule suffers from pinning two words; MD5''s drop must exceed the central
    band of that distribution for the effect to be schedule-specific. Second, a random-mask null in
    which two arbitrary words are pinned instead of words 14 and 15, giving the drop that pinning
    any two words causes; MD5''s actual drop under its actual mask must exceed that band for the effect
    to belong to the padding position rather than to pinning in general. If either null envelops the
    signal, the record states a controlled null and says which of the two readings is closed.'
  independent_variables:
  - message-length residue class
  - 'pinning regime: none, value-pinning, difference-pinning'
  - 'partial-word treatment: pinned versus free'
  - 'arm: MD5, MD4, schedule null, mask null'
  metrics:
    primary:
    - pinned-word mask per residue class
    - best chunk separation per regime
    - drop in steps under value-pinning
    - drop in steps under difference-pinning
    - MD5's position within each null distribution
    secondary:
    - bracket width from the partial-word treatment
    - MD4 drop and its null positions
    - number of residue classes sharing a mask
    - exhaustive random-mask drop table over all 120 word pairs
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The value-pinning drop D in steps for the appended-block residue class, and the difference-pinning
      drop, which is predicted to be exactly zero.
    formula: 'D = S(forbidden = empty) - S(forbidden = pinned words), where S is the best chunk separation
      as defined by the sibling record, namely the largest window admitting a split in which each
      side omits a word the other uses, with forbidden words unavailable as omitted-word witnesses
      on the constrained side. Predicted: D >= 2 steps under value-pinning; D = 0 under difference-pinning;
      wholly pinned word count = 3 in the appended-block case.'
    source: Pre-registered in the parent proposal IDEA-20260816-79aec0 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Every quantity is computed on full MD5 and full MD4 as specified, so no size reduction
      and no extrapolation occurs anywhere in the run; the toy label refers only to compute cost.
      The one scope restriction, stated rather than assumed away, is that the analysis covers a single
      final block, and multi-block strategies would change which block carries the mask; no result
      is transferred to that case.
    correspondence: null
  tail_checks:
  - With the forbidden set empty, the enumeration must reproduce the sibling record's separation value
    exactly, or the shared code has diverged.
  - The difference-pinning arm must yield exactly zero; any other value halts interpretation.
  - 'Monotonicity check: adding a forbidden word may never increase separation.'
  - The exhaustive 120-pair random-mask table must contain MD5's actual pair, and its drop must match
    the value computed in the signal arm.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt if the two padding-rule transcriptions disagree.
  - Halt if the empty-forbidden-set reproduction fails.
  - Halt if monotonicity is violated anywhere, which indicates an enumeration bug.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The pinned-word count matches the forced prediction, the difference-pinning drop
    is exactly zero, the value-pinning drop is at least 2 steps, and MD5's drop exceeds the central
    90 percent of both null distributions under at least one of the two partial-word treatments, with
    the bracket reported.
  falsification_criterion:
  - Difference-pinning drop is nonzero.
  - Value-pinning drop is below 2 steps.
  - MD5's drop lies inside the central band of the shape-matched schedule null.
  - MD5's drop lies inside the central band of the exhaustive random-mask table.
  - The partial-word bracket straddles the null bands, leaving the verdict undetermined under both
    treatments.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-79aec0
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must rule on how a partly pinned word is treated, since the bracket may be wide
    enough that the two treatments give opposite verdicts.
  - 'The forbidden-word semantics need specifying precisely: whether a pinned word is unavailable
    as a neutral word only, or also as a step the split may cross, changes the drop and both readings
    are defensible.'
  - A ruling is needed on whether the single-block scope is acceptable for the record's claim or whether
    a multi-block arm must be specified before approval.
