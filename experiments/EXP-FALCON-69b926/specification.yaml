experiment:
  id: EXP-FALCON-69b926
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-8bdc64; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-8bdc64
  question_id: RQ-FNDSA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Efficiency ratio of a public dual-lattice character-sum dictionary against the exactly computed
    oracle divergence of an enumerated toy sampler law, swept over width, dimension and dictionary
    norm bound.
  objective: 'The uncertainty a run reduces is what fraction of an exactly computed information-theoretic
    bound a statistic built only from public data recovers, which is the successor question this corpus''s
    own divergence hypothesis names and declines to answer. In parts: (i) whether the pipeline is
    sound, evidenced by the ideal-law null returning zero captured divergence to enumeration precision,
    by the in-dictionary positive control returning eta at or above 0.9, and by the out-of-dictionary
    positive control returning eta at or below 0.1; (ii) what eta is at the tested cells, as a function
    of Gaussian width, lattice dimension and dictionary norm bound, including the saturation curve
    of eta against the norm bound; (iii) whether eta correlates with the geometric alignment between
    the secret frame directions and the short dual vectors, which is the mechanism-level prediction
    distinguishing a structural explanation from a numerical coincidence. A run does not reduce uncertainty
    about deployed widths or dimensions, about exploitability, about signature counts at deployed
    parameters, or about security, and no stage produces such a quantity.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: for the toy lattices built in this
      run, at d in {2, 4}, sigma in {0.4, 0.5, 0.7, 1.0, 2.0}, and the frozen dual dictionary construction,
      the oracle divergence, the captured divergence and their ratio take the reported values in exact
      arithmetic, together with the reported alignment correlation. WHAT DOES NOT FOLLOW: that no
      efficient public statistic exists, since the dual character-sum dictionary is one class of statistics
      among many and a small eta bounds only that class; anything about deployed widths, where the
      measured width dependence indicates this representation becomes rapidly less informative; anything
      about FN-DSA parameter sets or any released implementation; any attack, any signature count
      at deployed parameters, and any security consequence. eta is a fraction of an information-theoretic
      bound, not a fraction of an achievable attack.'
  inputs:
    procedure: 'STAGE 0, cost under one hour: freeze the dictionary construction rule, the norm bounds,
      the widths, the alignment statistic and the numerator formula. STAGE 1, cost about one day:
      reuse the validated enumeration instrument to produce exact defective and ideal laws at d =
      2, sigma = 0.5. STAGE 2, cost minutes: compute the oracle Kullback-Leibler divergence in exact
      arithmetic as the denominator. STAGE 3, cost minutes: build the dual dictionary from the public
      basis alone and compute exact character sums under both laws. STAGE 4, cost minutes: run the
      ideal-law null, the off-lattice dictionary null and both single-frequency positive controls;
      HALT IF ANY FAILS. STAGE 5, cost about one hour: compute eta at d = 2 across all widths and
      norm bounds, reporting the saturation curve. STAGE 6, cost about half a day: repeat at d = 4
      across five independent lattices per cell. STAGE 7, cost about an hour: compute the alignment
      statistic per lattice and report its correlation with eta, plus the quadratic-approximation
      control at one cell.'
    instrument: Pure Python 3 with fractions.Fraction throughout the exact path, reusing the validated
      exact enumeration instrument from the first entry of this batch rather than reimplementing it.
      Dual lattice vectors computed from the public basis by exact rational linear algebra implemented
      in-run. Character sums evaluated as exact rational and algebraic quantities via truncated series
      with explicit tail bounds, never in floating point, because the values underflow doubles at
      moderate widths. numpy used only for the final correlation between eta and the alignment statistic.
      Run manifests through harness/runner.py. No Sage, no external computer algebra, no network.
    parameters: Dimensions d in {2, 4}, with d = 8 attempted only if the d = 4 cells complete inside
      budget. Widths sigma in {0.4, 0.5, 0.7, 1.0, 2.0}, chosen to span the regime where the ideal
      character sums are computable down to the regime where they underflow, which is itself a reported
      boundary. Dictionary norm bounds chosen so that ideal character sums range down to 1e-12, 1e-20
      and 1e-30, giving three nested dictionaries per cell. Five independently constructed toy lattices
      per (d, sigma) cell. Truncation radius 8 sigma with tail bounds reported, inherited from the
      enumeration instrument. Single-frequency injected defect magnitudes {1e-3, 1e-5}.
  controls:
  - 'Ideal-law null: numerator computed against the ideal law must be zero to enumeration precision.'
  - 'Off-lattice dictionary null: test vectors not in the dual lattice, bounding how much captured
    divergence arbitrary test functions produce.'
  - Single-frequency positive control, in-dictionary, must give eta near one.
  - Single-frequency positive control, out-of-dictionary, must give eta near zero, which together
    with the previous control shows the dictionary is the binding constraint.
  - 'Quadratic-approximation control: at one cell, compute the captured divergence directly rather
    than by the small-signal formula and report the discrepancy.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null arm replaces the enumerated defective law with the exactly
    computed IDEAL law and runs the identical dictionary construction, character-sum computation and
    captured-divergence calculation. The numerator must come out zero to the enumeration''s precision;
    any nonzero value means the dictionary or the reference values are manufacturing signal and every
    eta is void. A second null uses a random dual dictionary drawn from vectors NOT in the dual lattice,
    which should capture no structured signal and whose captured divergence bounds how much the estimator
    picks up from arbitrary test functions. A positive control injects a known defect concentrated
    at a single known dual frequency and must produce eta near one when that frequency is in the dictionary
    and near zero when it is excluded.'
  independent_variables:
  - Gaussian width sigma
  - lattice dimension d
  - dictionary norm bound
  - toy lattice index
  metrics:
    primary:
    - oracle Kullback-Leibler divergence in exact arithmetic
    - captured divergence of the public dictionary
    - efficiency ratio eta with its across-lattice spread
    - eta as a function of dictionary norm bound, the saturation curve
    secondary:
    - per-dual-vector character sums under both laws
    - alignment statistic between secret frame directions and short dual vectors
    - captured divergence in the off-lattice dictionary null
    - discrepancy of the quadratic approximation against direct computation at one cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The efficiency ratio eta of the public dual-lattice character-sum dictionary against
      the oracle divergence.
    formula: eta = CapturedDivergence(dictionary) / KL(enumerated defective law, ideal law), where
      CapturedDivergence is the small-signal quadratic form obtained by summing, over dictionary vectors
      w, the squared magnitude of the difference between the defective and ideal character sums at
      w, each normalized by its variance under the ideal law. eta lies in [0, 1] by construction and
      a value above 1 falsifies the computation. No value is pre-committed; what is pre-committed
      is that eta decreases monotonically in sigma by at least a factor of ten between sigma = 0.5
      and sigma = 2.0.
    source: Pre-registered in the parent proposal IDEA-20260816-8bdc64 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested at d in {2, 4} against a deployed dimension of 1024 or 2048, and at sigma
      in {0.4, 2.0} against a deployed sigma of order 165, so the tested widths are two orders of
      magnitude below deployed and the tested dimensions three below. NO EXTRAPOLATION IS PERFORMED,
      and the record notes that its own measured width dependence points against this representation
      being informative at deployed widths, which is a reason to report the measurement honestly rather
      than to project it. The width sweep exists precisely to make that dependence a measured quantity
      rather than an assumption.
    correspondence: null
  tail_checks:
  - Report the truncation tail bound for every character sum and require it below one hundredth of
    the sum's magnitude before the sum is used.
  - Report the width at which the ideal character sums fall below the enumeration tail bound, since
    beyond it the dictionary is empty and eta is undefined rather than zero.
  - Report eta separately per lattice as well as pooled, and flag cells where one lattice dominates
    the spread.
  - Report the quadratic-approximation discrepancy explicitly rather than assuming the small-signal
    regime.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt and report pipeline failure if the ideal-law null returns nonzero captured divergence.
  - Halt a width cell as soon as the usable dictionary is empty and report that width as the boundary
    of the representation's applicability.
  - Halt at d = 4 if a single cell exceeds four hours and report the achieved dimension rather than
    extrapolating.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All four controls pass, eta is computed with an across-lattice spread whose half-width
    is below half the central value at every d = 2 cell, and the eta-versus-norm-bound saturation
    curve is resolved at three nested dictionary sizes per cell.
  falsification_criterion:
  - Ideal-law null returning nonzero captured divergence.
  - In-dictionary positive control below eta of 0.9, or out-of-dictionary control above 0.1.
  - Off-lattice dictionary null capturing divergence comparable to the signal arm.
  - eta exceeding 1.0 at any cell.
  - Quadratic-approximation discrepancy above 20 percent at the control cell.
  - eta failing to decrease with sigma, falsifying the character-sum decay mechanism.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-8bdc64
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The normalization of each per-vector signal by its variance under the ideal law is stated but
    not derived, and it sets the numerator's scale.
  - Whether the full Kullback-Leibler divergence is the right denominator, as opposed to the divergence
    achievable by any statistic with bounded sample complexity, is a modelling choice the Coordinator
    must settle.
  - The alignment statistic relating secret frame directions to short dual vectors is named but not
    defined.
  - How the covariance statistic of IDEA-20260808-e7ba81 and the cross-node statistic of IDEA-20260813-2d839b
    would be embedded in the same ratio is asserted as possible but not specified, and doing so is
    most of the value of the yardstick.
