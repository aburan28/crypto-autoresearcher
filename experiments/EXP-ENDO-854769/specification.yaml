  controls:
  - Unit/scalar short distractor never establishes rank-two ring generation
  - Collinear independent-looking inputs must not claim saturation
  - Complete planted order certificate and independent coefficient gcd oracle
  - Faithful standard two-generator quotient-module check; alternate basis replication
    deferred
  - Gamma divisible by ell and gamma nonzero on module are separate fixtures
  independent_variables:
  - fundamental_discriminants
  - conductors
  - b_coefficients
  - module_primes
  - generator_controls
  - policies
  - basis_matrices
  metrics:
    primary:
    - Actual generated-order index at each selection step
    - Additive rank and multiplicative closure flags
    - Exact division acceptance/rejection from all module basis vectors
    - Priced norm/gcd scoring counts and selected steps, with explicit unpriced_work/accounting_complete=false
    secondary:
    - Deterministic case counts and all invalid/unresolved cases
    - Enumeration/scoring/index/module operation counts are diagnostics only
    - 'Explicit unpriced_work and accounting_complete=false: sorting/list maintenance,
      ring-update bookkeeping and certificate work remain outside scoring counters.'
  scale_relevance:
    tier: toy
    justification: Complete saturation only relative to supplied certified ambient
      order and exact module action; policy outcomes are diagnostic operation counts.
      Implemented lattice family is C/O_f only; arbitrary CM ideal-class representatives
      are not tested.
    correspondence: null
  replication:
    seeds:
    - 1729
    independent_instances: 0
    plan: Deterministic exhaustive bounded fixture set, not stochastic population
      sampling; independent oracle and future independent review.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
  - Stop after exactly the frozen deterministic fixture schedule; no adaptively extended
    search.
  - Preserve a failed check, crash or machine-protection stop with logs; do not use
    it as mathematical rejection.
  invalidation_rules:
  - Source/spec/plan hash mismatch or undeclared parameter change
  - Missing/adaptively discarded controls or floating arithmetic
  - Torsion division inferred from nonfaithful or incomplete module action
  - Replay checker agreement alone never discharges independent mathematical review.
  - Replay checker agreement alone never discharges independent mathematical review.
  success_criterion: The frozen fixture schedule completes, internal exact/differential
    arithmetic checks pass, every adverse control is preserved with its intended certificate/ambiguity,
    and all canonical artifacts validate. This is a scoped trial-integrity pass; hypothesis
    support requires the separately archived independent review.
  falsification_criterion: A preserved exact disagreement under all valid assumptions
    refutes only this scoped prediction; implementation/oracle defects invalidate
    the trial.
  required_artifacts:
  - raw-result.json
  - manifest.yaml
  - stdout.log
  - stderr.log
  - check.stdout.log
  - check.stderr.log
  - command.txt
  - environment.json
  - launch.json
  - execution-receipt.json
  assigned_to: executor
  approved_by: coordinator
  execution_authorized: true
  implementation_path: tools/lattice_order_saturation.py
  candidate_argv:
  - python3
  - tools/lattice_order_saturation.py
  - --seed
  - '1729'
  - --output-dir
  - '{run_dir}'
  candidate_check_argv:
  - python3
  - tools/lattice_order_saturation.py
  - --check
  - '{run_dir}/raw-result.json'
  output_contract:
    schema_version: lattice-order-saturation/v1
    required_top_level:
    - schema_version
    - direction
    - seed
    - parameters
    - cases
    - checks
    - limitations
    case_fields:
    - D_K
    - planted_order_conductor
    - generator_pool
    - policies
    - saturation
    - division_controls
    exact_number_encoding: Canonical integer values and normalized fraction strings
      or numerator/denominator objects; never floating arithmetic.
    unexpected_observations: Preserve as explicit case status with supporting exact
      inputs and failure certificate.
    case_fields_policy: Driver-specific exact case fields approved by source review;
      planted orders/conductors/lattices explicitly named and distinct from inferred
      metrics.
  torsion_certification_policy: Only exact faithful full action on Lambda/ell*Lambda
    (all basis vectors), equivalently integral gamma/ell on the supplied lattice.
    Ordinary/supersingular finite-field lift additionally requires ell != characteristic,
    complete geometric torsion action or certified module representation, faithful
    map identification and explicit divided endomorphism; characteristic prime needs
    its own inseparable/local method and is excluded here.
  interpretation_limits:
  - No ECDLP solve, subgroup-transfer advantage, novelty or quantitative improvement
    claim.
  - All instances are synthetic exact algebra with planted/known ambient orders; this
    is not inference from unknown finite-field endomorphism rings.
  - Ordinary lifts require certified actual f_E separately from Frobenius f_pi; no
    conductor-only security discount.
  - Sparse checkout prevents authoritative full-ledger backlog counts; KB retrieval
    unavailable; literature pointers remain unverified by this coordinator.
  - Development regression tests are software checks, not immutable admitted scientific
    evidence.
  - Complete saturation only relative to supplied certified ambient order and exact
    module action; policy outcomes are diagnostic operation counts.
  - Policy scoring counts are diagnostic; any unpriced sorting/list/closure/certificate
    work must be named, and finite-field map generation is out of scope.
  approval_missing: []
  next_discriminating_experiment: Produce faithful finite-field torsion certificates
    for ell != characteristic and explicit divided maps; independently match policy
    evidence before any improvement claim.
  added: '2026-10-12'
  idea_ids:
  - IDEA-20261014-2a4b38
  checker_scope: Hash/integrity and exact fixture replay by producer implementation;
    not independent research validation.
  source_dependencies:
  - tools/lattice_experiment_manifest.py
  attention_contract:
    decisive_evidence: Every required full-assumption fixture agrees with independent
      exact arithmetic; each adverse control is separately labeled and produces a
      certificate/collision/ambiguity as appropriate.
    inconclusive_decision: Keep hypothesis proposed and record missing assumption/certificate;
      implementation failure provides no mathematical rejection.
    local_ambiguity_rule: All fixtures are predetermined; preserve anomalies verbatim,
      no adaptive scope or outcome changes.
    peripheral_exclusions:
    - finite-field map reconstruction
    - ECDLP solving
    - cryptographic-scale extrapolation
    - novelty/performance promotion
    rerank_trigger: Canonical pilot snapshot and actual independent review available,
      or an implementation/certificate defect changes the next discriminating task.
  designed_at: '2026-10-14'
  decision_impact:
    on_positive: 'Archive exact scoped pilot observations and request blind independent
      arithmetic rederivation. Only after that passes, design successor: Produce faithful
      finite-field torsion certificates for ell != characteristic and explicit divided
      maps; independently match policy evidence before any improvement claim.'
    on_negative: Preserve the exact adverse-control or full-assumption counterexample
      and independently localize it. A genuine valid-assumption disagreement revises
      only this bounded prediction; an implementation/manifest defect invalidates
      the trial and routes a scoped correction, with hypothesis/goal status unchanged.
    on_inconclusive: Keep hypothesis proposed and record the exact missing certificate,
      implementation or review dependency with a checkable successor. No negative
      mathematical interpretation.
  proposal_scope_deferred: The proposal includes broader graph/basis/normalization/finite-field
    successor controls. This pilot runs only the exact frozen implemented fixture
    schedule, with those unimplemented extensions left open rather than falsely marked
    tested.
