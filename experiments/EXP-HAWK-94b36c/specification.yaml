experiment:
  id: EXP-HAWK-94b36c
  hypothesis_id: H-HAWK-316263
  derived_from_idea: IDEA-20260801-019
  question_id: RQ-HAWK-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Independent re-implementation of the reported module-LIP HAWK key-recovery
    attack at reduced parameters, with a planted-isomorphism positive control, a
    random-non-key null, and an explicit four-way separation of the causes of
    non-recovery
  objective: >-
    The one uncertainty a run reduces is whether the reported HAWK key-recovery
    break survives an independent rebuild from its specification at parameters
    small enough to run. A run establishes (i) whether the specified reduction and
    solver can be implemented at all without the author's code, and the exact list
    of places where the specification did not determine a choice; (ii) the measured
    key-recovery success rate, wall clock and peak memory at the report's own
    reduced parameter set and at one strictly lower set, over at least 30
    independent key pairs per set; and (iii) whether that rate is within the
    pre-registered 20 percent relative tolerance of the report's claimed rate,
    WHERE that claimed rate can be pinned to a source actually read in this
    environment. No claim about full-size HAWK is attempted or implied. No
    statement is made about what the published literature contains beyond what
    stage 0 can pin to a read source.
  what_this_is_not:
    - >-
      Not a new attack on HAWK, not an improvement of the reported one, and not a
      claim that HAWK is broken or unbroken at any deployed parameter set.
    - >-
      Not a refutation of the reported break. A non-reproduction under this contract
      is a statement about this implementation, these parameters and this budget.
    - >-
      Not a re-run of the author's code. An implementation that reads the author's
      code has answered a different question, and the run record lists every
      artifact read.
    - >-
      Not a status change to any hypothesis, evidence record, decision or goal
      record, and not a promotion of any knowledge entry.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or
      evidence. No run has been executed under this contract.
  claim_ceiling:
    tier: reduced_parameter_reproduction
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: at the executed reduced parameter sets, an
      implementation written from the report's specification alone recovered HAWK
      private keys at a measured rate with measured time and memory, and that rate
      did or did not fall inside the pre-registered tolerance around the report's
      claimed rate. WHAT DOES NOT FOLLOW: nothing about full-size HAWK; no
      upgrade of the reported break's claim tier at cryptographic scale; and, for a
      non-reproduction, no assertion that the reported break is incorrect - only
      that this build did not reproduce it here.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, HARD GATE): pin the report's specification of the
      reduction and the solver, and its claimed reduced-parameter figures, to a
      source actually read in this container. Record verbatim what was read and
      what could not be reached. If the claimed figures cannot be pinned, the
      comparison arm is declared UNAVAILABLE and the run proceeds to deliver the
      absolute curve only - it does NOT substitute a remembered number.
      STAGE 1 (implementation, no measurement): build the reduction and the solver
      from the specification alone. Maintain a running SPECIFICATION-GAP LOG: every
      place a value had to be chosen that the specification did not determine, with
      the choice made and its plausible alternatives.
      STAGE 2 (minutes, POSITIVE CONTROL, read FIRST): the planted-isomorphism
      fixture at the lower parameter set - construct module-LIP instances with a
      known planted isomorphism and require the solver to return it exactly. A
      failure here voids the run.
      STAGE 3 (minutes): the REDUCTION ROUND-TRIP check - a HAWK key mapped through
      the reduction and back must reproduce the original data, and the produced
      instance must have the stated dimension. This isolates a reduction bug from a
      solver bug.
      STAGE 4 (hours): the signal arm - run the full pipeline on at least 30
      independent key pairs at the lower set and at the report's reduced set,
      recording per-instance success bit, wall clock, peak memory and a CENSORING
      FLAG for any instance stopped by the budget.
      STAGE 5 (minutes): the NULL arm - random non-key module-LIP instances of
      matched dimension and determinant, same solver, same budget.
      STAGE 6 (zero compute): assemble the comparison table, apply the four-way
      separation to every non-recovery, and write the scoped verdict plus the
      specification-gap log.
    instrument: >-
      Python 3.11 with numpy; no SageMath, which is absent from this container.
      Integer lattice arithmetic exact throughout; any reduction step written from
      its definition rather than vendored. Certificates for a recovered key are
      re-checked by the run wrapper (the recovered private key must reproduce the
      public key and verify a signature), never by the attack code
      (docs/claims-and-verification.md). Recorded through harness/runner.py.
    parameters: >-
      Two parameter sets: the report's own reduced set, pinned at STAGE 0, and one
      strictly lower set chosen so the solver terminates inside
      wall_clock_seconds_per_run on a pilot cell. At least 30 independent key pairs
      per set from the declared seed streams. At least 30 planted-isomorphism
      fixtures at the lower set. At least 30 random non-key instances matched on
      dimension and determinant. Comparison tolerance pre-registered at 20 percent
      relative on the success rate and one order of magnitude on time and memory.
  controls:
    - >-
      POSITIVE CONTROL, forced value, read FIRST. Planted-isomorphism module-LIP
      instances at the lower parameter set: the solver must return the planted
      isomorphism EXACTLY, integer for integer, on 30 of 30. Forced value 1.0. If it
      is not 1.0 the solver is broken and NO conclusion about HAWK, positive or
      negative, may be drawn from any arm.
    - >-
      NULL OBJECT, matched shape, CAN FAIL. Random non-key module-LIP instances of
      identical dimension and determinant, same solver, same budget. Forced
      expectation: success rate far below the HAWK-derived arm. If it equals the
      HAWK arm, the pipeline is not using the reduction and every positive result is
      void.
    - >-
      REDUCTION ROUND-TRIP CONTROL. The reduction's output instance must have the
      stated dimension n/2 + 1 and must round-trip back to the input data. This
      isolates a reduction defect from a solver defect - without it, a
      non-reproduction has two indistinguishable causes.
    - >-
      CENSORING CONTROL. Every instance stopped by the per-run budget carries an
      explicit censoring flag and is reported SEPARATELY from instances that
      terminated without success. A timeout is never scored as an attack failure
      (AGENTS.md rule 5).
    - >-
      IMPLEMENTATION-INDEPENDENCE CONTROL. The run record lists every artifact the
      implementer read. Reading the author's code at any point makes the run
      invalid_measurement for this contract's purpose, because "independent" is the
      property under test.
    - >-
      SPECIFICATION-GAP LOG. Every under-determined choice is recorded with its
      alternatives, before any measurement is read. Where a gap is load-bearing, the
      contract requires the pipeline to be run under at least two of the plausible
      alternatives and both results reported, since a single arbitrary choice
      silently converts a reproducibility question into a coin flip.
    - >-
      ORDERING CONTROL. The positive control, the round-trip check and the null arm
      are computed, recorded and hash-committed BEFORE the signal arm's success rate
      is looked at.
  independent_variables:
    - 'parameter set: report reduced set / one strictly lower set'
    - 'instance type: HAWK-derived / planted-isomorphism fixture / random non-key'
    - the choice taken at each load-bearing specification gap
    - seed / instance index
  metrics:
    primary:
      - name: recovered_key_success_rate
        units: fraction of instances
        computed_as: >-
          number of instances on which the pipeline returned a private key that the
          run wrapper independently re-verified against the public key, divided by
          the number of NON-CENSORED instances in the cell; the censored count is
          reported alongside and never folded into the denominator silently.
      - name: reproduction_delta
        units: relative fraction
        computed_as: >-
          (measured success rate at the report's reduced set minus the report's
          claimed rate) divided by the report's claimed rate. Reported only if
          STAGE 0 pinned the claimed rate to a read source; otherwise reported as
          UNAVAILABLE with the reason, never estimated.
      - name: planted_fixture_pass_rate
        units: fraction of fixtures
        computed_as: >-
          exact integer-for-integer recovery of the planted isomorphism divided by
          fixture count. Forced value 1.0; this is the positive control.
      - name: random_nonkey_success_rate
        units: fraction of instances
        computed_as: >-
          successes on random non-key instances divided by non-censored instance
          count. This is the null.
      - name: specification_gap_count
        units: count
        computed_as: >-
          number of entries in the specification-gap log, with each entry's choice
          and alternatives, and a flag for whether the gap was load-bearing enough
          to require running both alternatives.
    secondary:
      - name: solver_wall_clock
        units: seconds per instance
        computed_as: measured per instance, reported as a distribution per cell.
      - name: peak_memory
        units: bytes
        computed_as: peak_rss_bytes per instance, reported as a distribution per cell.
      - name: cost_delta_vs_report
        units: order of magnitude
        computed_as: >-
          log10 of measured median time and memory divided by the report's claimed
          figures, reported only if those figures were pinned at STAGE 0.
      - name: censoring_rate
        units: fraction of instances
        computed_as: budget-stopped instances divided by attempted instances, per cell.
      - name: reduction_roundtrip_pass
        units: boolean per instance
        computed_as: >-
          the reduction's output dimension equals n/2 + 1 and the round-trip
          reproduces the input data.
  heuristic_under_test:
    id: HEUR-HAWK-316263-1
    formal_statement: >-
      The success rate and cost at the strictly lower parameter set are
      monotonically related to those at the report's reduced set - a solver failing
      at the lower set will not succeed at the higher one, and the cost curve
      between them has no crossover.
    status: >-
      Tested by the two-point curve. Two points can refute a claimed monotonicity;
      they cannot establish it, and this contract does not claim they can.
  preregistered_prediction:
    quantity: >-
      recovered_key_success_rate at the report's reduced parameter set, compared
      against the report's claimed rate at the same set.
    formula: >-
      CONFIRMATION iff |measured rate minus claimed rate| / claimed rate <= 0.20
      AND measured median time and memory are within one order of magnitude of the
      claimed figures. NON-REPRODUCTION iff the measured rate is below the claimed
      rate by more than 20 percent relative, with the positive control passing, the
      round-trip passing, and the censoring rate below 10 percent. Under the null
      that the pipeline is not using the reduction at all, the HAWK arm and the
      random non-key arm coincide.
    source: >-
      Pre-registered in the parent proposal IDEA-20260801-019
      (predictions.minimum_effect, "Matching the report's success rate within 20% at
      the same reduced parameters constitutes confirmation") before any run under
      this contract exists. Never tuned to data.
  scale_relevance:
    tier: reduced_parameter
    justification: >-
      Executed at the report's own reduced parameters and one lower set, both far
      below deployed HAWK. That is the entire design: reproduction is only checked
      where the solver terminates. The transfer assumption between the two sets is
      numbered HEUR-HAWK-316263-1 and carries its own falsification condition; NO
      transfer to full-size HAWK is assumed, offered, or licensed by any outcome.
    correspondence: null
  tail_checks:
    - >-
      Report the number of successful recoveries per cell in absolute terms and
      refuse any comparison in a cell with fewer than 5 successes or fewer than 5
      failures - a rate estimated from a nearly degenerate cell has an interval that
      swallows the 20 percent tolerance.
    - >-
      Report the full per-instance time distribution, not only the median; a heavy
      right tail near the budget means the success rate is really a budget
      measurement.
    - >-
      Report the slowest 5 and fastest 5 instances per cell explicitly, with their
      seeds, so a bimodal solver behaviour is visible rather than averaged away.
    - >-
      Report the success rate separately under each alternative taken at every
      load-bearing specification gap. A reproduction that holds under one choice and
      fails under another is a finding about the specification, not about the attack.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 30
    repeat_count: 3
    note: >-
      30 independent key pairs per parameter set per seed stream. The instance count
      is set by the discrimination requirement: it must separate a rate differing by
      20 percent relative from the claimed rate. If the claimed rate is near 0 or
      near 1, 30 instances will NOT achieve that separation and the honest report is
      INCONCLUSIVE with the required instance count computed, not a verdict.
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 12.0
    memory_gb: 12
    maximum_memory_gb: 12
    maximum_runs: 40
  stopping_rules:
    - >-
      Stop and void the run if the planted-isomorphism fixture is below 1.0.
    - >-
      Stop and report if STAGE 1 cannot produce an implementation from the
      specification. That is a reproducibility finding, delivered as one, and it is
      never negative evidence about the attack.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
      exhaustion is a stop, never a negative result (AGENTS.md rule 5).
    - >-
      The tolerance, the parameter sets, the instance count and the seeds are frozen
      before any measurement and are not revised after any rate is observed.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence
      (AGENTS.md rule 5).
    - >-
      A run in which the implementer read the author's code, or any artifact not
      listed in the run record, is invalid_measurement for this contract: the
      independence being tested was not present.
    - >-
      A run whose null arm or positive control was not executed in the same
      invocation as the signal arm is invalid_measurement.
    - >-
      Any claimed key recovery whose certificate fails independent re-verification
      by the run wrapper makes the run completed_invalid
      (docs/claims-and-verification.md).
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT
      experiment and requires a new contract; it is never a repair of this one.
  success_criterion: >-
    The planted fixture reads 1.0, the reduction round-trip passes on every
    instance, the null arm's success rate is materially below the HAWK arm's, the
    censoring rate is below 10 percent, and the run reports recovered_key_success_rate
    with a binomial interval at both parameter sets together with the measured time
    and memory distributions and the complete specification-gap log. The hypothesis
    H-HAWK-316263 is SUPPORTED if and only if reproduction_delta is available and
    within +/- 0.20 and the cost deltas are within one order of magnitude.
  falsification_criterion:
    - >-
      reproduction_delta is below -0.20 with its interval excluding -0.20 from above,
      the positive control at 1.0, the round-trip passing, and censoring below 10
      percent. The break did NOT reproduce at these parameters and the measured rate
      is the recorded shortfall. This is a weaken, never a reject_scoped, on one
      unreplicated run.
    - >-
      The null arm's success rate equals the HAWK arm's. The pipeline is not using
      the reduction; every positive result is void.
    - >-
      The planted fixture is below 1.0. Nothing is reportable from any arm.
    - >-
      A load-bearing specification gap changes the verdict between its plausible
      alternatives. The reported break is not reproducible from its specification as
      written, which is a finding about the report and is recorded as one.
    - >-
      More than 10 percent of instances are censored by the budget. The success rate
      is a budget measurement and no reproduction verdict is licensed.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment
    - >-
      raw-result.json carrying every per-instance measurement - success bit, wall
      clock, peak memory, censoring flag, seed - and not summaries
    - the null arm's and the positive control's measurements, in the same file as the signal arm
    - the STAGE 0 pinning record - what was read verbatim, and what could not be reached
    - the complete specification-gap log with choices and alternatives
    - the list of every artifact the implementer read, for the independence control
    - certificates for every claimed key recovery, re-verified by the wrapper
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not approve. This contract is review_required and is
      NOT approved; approved_by is null and execution_authorized is false. Approval
      is the user's gate because it authorizes execution and spends compute.
    - >-
      STAGE 0 is a HARD GATE and must complete before implementation effort is
      authorized. If the report's claimed figures cannot be pinned to a read source,
      the comparison arm is declared unavailable IN THE CONTRACT before the run, not
      after seeing the measured rate.
    - >-
      The paired hypothesis carries a filled proof_search_map; its
      observation-collision audit (four preimages of "did not recover") is a
      precondition of the design and its separations are implemented as STAGE 2,
      STAGE 3 and the censoring flag.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260801-019
    authored_at: '2026-08-25'
    note: >-
      Metrics, controls and criteria are derived from the parent proposal's
      minimal_test, predictions and falsification_conditions. The 20 percent
      tolerance is the parent's own pre-registered figure and is not re-chosen here.
      Budgets come from the parent's declared estimated_cost (implementation high,
      compute medium). No field is invented; a value the proposal did not supply is
      null or is assigned to STAGE 0.
  derivation_gaps:
    - >-
      The report's identity, its reduced parameter set and its claimed figures are
      NOT pinned in this record and cannot be, since this container cannot reach
      external literature. Everything about them is assigned to STAGE 0, and a
      contract approved without STAGE 0 completing would be measuring against a
      remembered number - the exact failure AGENTS.md rule 5 forbids.
    - >-
      The lower parameter set is not numerically fixed. It must be chosen by the
      termination criterion on a pilot cell, before any success rate is observed,
      and not by which choice makes the curve look better.
    - >-
      The certificate for "a recovered HAWK private key" needs its exact form
      declared - which public data it must reproduce and which signature it must
      verify - since the wrapper's re-verification is what separates a claim from a
      result.
    - >-
      Whether 30 instances per cell suffices depends on the claimed rate, which is
      unknown until STAGE 0. The sample size must be recomputed from the pinned rate
      before freezing, and if the required count exceeds the budget the honest
      outcome is a re-scoped contract, not a smaller sample with the same verdict.
