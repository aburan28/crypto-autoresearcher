experiment:
  id: EXP-SHATWO-c4c28c
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-8ee479; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-8ee479
  question_id: RQ-SHATWO-f196c7
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Word-width scaling ladder for SHA-256/w at w = 8, 12, 16, 24: solver-free predicted crossing
    against solver-measured reachable step count under one frozen budget normalization, with a random-tap
    null arm at every width'
  objective: The one uncertainty a run reduces is whether the solver-free crossing integer tracks
    the measured frontier when the object is scaled. (i) It produces, for each of four widths, the
    pair (s_pred, s_meas) computed by two frozen pipelines - GF(2) rank elimination in the carry-fixed
    model, and a frozen CNF encoder and solver at a normalized budget - so that the predictive claim
    implicit in RQ-SHATWO-f196c7 target 2 becomes a falsifiable gap sequence rather than a plausibility
    argument. (ii) It reduces the artifact uncertainty by carrying a random-tap null arm through both
    pipelines at every width in the same invocation, so that any constancy of the gap is reportable
    as a property of SHA-256's taps rather than of the budget-normalization rule, which is where all
    the design freedom in this contract is concentrated. (iii) It forces the resolution question to
    be answered before the verdict by requiring the replicate spread of s_meas to be reported per
    width and to grow with w, per the inventor-protocol section 3 structural tell that a quantity
    which should degrade and does not is the signature of an artifact; if the spread swamps the drift
    the run reports UNRESOLVED with its measured resolution limit. A run does NOT reduce uncertainty
    about w = 32, about full SHA-256, or about whether any characteristic exists beyond a measured
    s_meas.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope: for SHA-256/w at w in {8, 12, 16, 24}, under
      the declared rotation-scaling rule, the frozen condition-support family and carry class, the
      frozen CNF encoder, the named solver version, and the frozen budget-normalization rule, the
      gap Delta(w) took the emitted values with the emitted replicate spread, and was scored TRACKING,
      DRIFT or UNRESOLVED by the preregistered rule. WHAT DOES NOT FOLLOW: any value at w = 32; any
      extrapolation of the gap sequence, which this contract forbids rather than merely cautions against;
      that a TRACKING score makes the crossing integer a bottleneck, a mechanism, or an exploitable
      quantity; that a low s_meas at any width means no characteristic exists there; and nothing about
      full 64-step SHA-256, HMAC-SHA-256, TLS certificate chains, code signing, or Bitcoin.'
  inputs:
    procedure: 'STAGE 0 (hours, human): write and hash the preregistration - rotation-scaling rule,
      condition-support family, carry class, budget-normalization rule, seed set, and the TRACKING/DRIFT/UNRESOLVED
      thresholds. STAGE 1 (2-3 days human, minutes machine): implement SHA-256/w twice at each of
      four widths and cross-validate each pair on 10^6 random inputs; abort a width on any mismatch.
      STAGE 2 (minutes machine): compute s_pred(w) at all four widths with the solver-free rank pipeline,
      twice by independent implementations, requiring bitwise agreement. STAGE 3 (hours machine):
      encoder faithfulness gate at every width - 100 planted instances per width, every returned assignment
      must decode and verify. STAGE 4 (the bulk, bounded by declared wall clock): measure s_meas(w,
      seed) at the normalized budget, five seeds per cell, across the step ladder at each width, with
      a liveness planted instance per cell. STAGE 5 (same scale): repeat STAGES 2-4 for 20 random-tap
      draws per width. STAGE 6 (minutes): emit Delta(w), first differences, replicate spreads, exhaustive-search
      cost per width, and the run manifest with solver version, encoding hash, seeds and resolved
      inference block.'
    instrument: Python 3.11 throughout; numpy for uint64 bit-packed GF(2) elimination in the s_pred
      pipeline; PySAT with a pinned CaDiCaL or Kissat build for the s_meas pipeline, version fixed
      for the whole experiment; two independently written pure-Python SHA-256/w implementations per
      width for cross-validation and certificate verification; hashlib only to validate the 32-bit
      reference from which the scaling rule is derived; harness/runner.py for manifests, deterministic
      seeds and the inference block. No computer-algebra system and no Sage.
    parameters: 'Widths w in {8, 12, 16, 24}; block = 16 words = 16w bits; step ladders bracketing
      each width''s pilot frontier. Rotation amounts by one frozen scaling rule, reported explicitly
      per width. Condition-support family: one preregistered family, identical in construction across
      widths. Carry class: all-zero plus 8 sampled per width. Budget normalization: equal wall-clock
      per CNF variable, base set by a pilot at w = 8. Seeds 101..105 per cell. Random-tap null: 20
      draws per width. Encoder gate: 100 planted instances per width. Cross-validation: 10^6 random
      inputs per implementation pair.'
  controls:
  - Random-tap null arm at every width through both pipelines in the same invocation.
  - Certificate verification of every returned assignment against an independently written SHA-256/w
    implementation.
  - Two independent implementations of SHA-256/w cross-validated on 10^6 random inputs before any
    measurement at that width.
  - Replicate seeds at every (w, s) cell with spread reported and required to grow with w.
  - A liveness planted instance at every width and budget, so a silently failing harness is not read
    as a low s_meas.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Random-tap arm at every width, executed in the same invocation through
    both pipelines: sigma0 and sigma1 replaced by uniformly sampled GF(2) linear maps of matched fan-in,
    with s_pred recomputed by the identical rank code and s_meas remeasured by the identical encoder
    and solver at the identical normalized budget, 20 draws per width. For the signal arm to mean
    anything, the null must show a DIFFERENT Delta behaviour - if random-tap variants also yield a
    constant Delta across widths, then constancy is a property of the budget-normalization rule and
    of generic instance scaling, not of SHA-256''s design, and the result is recorded as a controlled
    null with the measured agreement. Additionally a structural-tell check per inventor-protocol section
    3: Delta should degrade in quality as w grows and the search gets harder; a Delta whose replicate
    spread does not grow with w is suspicious of the measurement rather than reassuring.'
  independent_variables:
  - word width w in {8, 12, 16, 24}
  - step count s within each width's ladder
  - arm (signal versus random-tap null)
  - seed
  - carry class for the s_pred pipeline
  metrics:
    primary:
    - s_pred(w)
    - s_meas(w, seed)
    - Delta(w) = s_meas - s_pred
    - first differences of Delta across consecutive widths
    - TRACKING / DRIFT / UNRESOLVED score under the preregistered rule
    secondary:
    - replicate spread of s_meas per width
    - CNF variable and clause counts per width
    - certificate verification rate per width
    - exhaustive-search cost per width
    - spread of s_pred across sampled carry classes
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The maximum absolute first difference of Delta over the three consecutive width pairs
      (8,12), (12,16), (16,24), in the signal arm, and the same quantity in the random-tap null arm.
    formula: 'D_max = max over consecutive width pairs (w, w'') of | Delta(w'') - Delta(w) |, where
      Delta(w) = s_meas(w) - s_pred(w), s_meas is the seed-median largest step count with a certificate-verified
      satisfying assignment at the normalized budget, and s_pred is the least step count at which
      surviving freedom reaches zero in the preregistered carry class and support family. Frozen decision
      rule: D_max < 1.0 scores TRACKING; D_max > 2.0 with monotone sign scores DRIFT; otherwise UNRESOLVED.
      The signal arm''s score is informative only if the null arm does not also score TRACKING.'
    source: Pre-registered in the parent proposal IDEA-20260816-8ee479 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Every tested parameter is a reduced instantiation: widths 8 to 24 bits against
      SHA-256''s 32, blocks of 128 to 384 bits against 512, step ladders in the low tens against 64.
      This is deliberate, because the contract''s entire purpose is the scaled-down validation step
      of docs/inventor-protocol.md section 6, which requires the smallest object on which the comparison
      is fully executable. The transfer assumption is stated and NOT tested: that SHA-256/w for w
      in 8..24 is the same family as SHA-256, mediated by one declared rotation-scaling rule. Extrapolation
      of Delta to w = 32 is forbidden by this contract, and no numeric step count here may be quoted
      against 32-bit SHA-256.'
    correspondence: null
  tail_checks:
  - Report the per-width rotation triple explicitly so a degenerate scaling at some width is visible
    rather than buried in the rule.
  - Report exhaustive-search cost per width, so a width where s_meas is achievable by brute force
    is not read as structural.
  - Report the spread of s_pred across the 8 sampled carry classes per width, so a class-sensitive
    prediction is visible.
  - Check the smallest width and smallest step count, where solutions must be found by every seed
    at the base budget; failure indicts the harness rather than the object.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Abort a width if its two implementations disagree on any cross-validation input, or if its encoder
    gate fails on any planted instance.
  - Abort the whole run if any returned satisfying assignment fails independent verification.
  - Stop at the four preregistered widths; do not add a fifth after seeing the gap sequence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All four widths pass cross-validation and the encoder gate, every returned assignment
    verifies independently, and the full Delta(w) sequence with first differences and replicate spreads
    is emitted for both the signal and the random-tap null arms - including when the score is UNRESOLVED,
    since the measured resolution limit is itself the reusable deliverable.
  falsification_criterion:
  - The random-tap null arm also scores TRACKING, falsifying the premise that gap constancy is a property
    of SHA-256's taps.
  - Delta drifts monotonically with D_max above 2.0 steps, falsifying the solver-free crossing as
    a predictor at the tested widths.
  - Replicate spread of s_meas fails to grow with w, triggering the section 3 artifact suspicion and
    voiding the reading.
  - Any returned assignment fails independent verification at any width.
  - The two independent rank implementations disagree on s_pred at any width.
  - Exhaustive search reaches the measured s_meas at some width more cheaply than the solver did,
    showing that width's measurement is uninformative about search structure.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-8ee479
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The budget-normalization rule concentrates all the design freedom in this contract and is declared
    rather than derived; a Coordinator must approve it explicitly and may require a second rule as
    a sensitivity arm.
  - The rotation-scaling rule from 32 down to 8, 12, 16 and 24 bits is a modelling choice with no
    argument attached, and some widths may receive degenerate triples.
  - No argument establishes that four widths suffice to distinguish constancy from drift at the achievable
    replicate spread; the UNRESOLVED band exists because that gap is open.
  - This contract depends on the solver-free rank pipeline from the companion proposal in this bucket
    and cannot be approved before that pipeline's forced value rank(A_16) = 512 has passed.
