experiment:
  id: EXP-ECDLP-b473c0
  hypothesis_id: H-ECDLP-d76995
  question_id: RQ-ICEX-001
  version: 1
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Instance-level pairing for the ICEX charged comparison - a frozen
    certificate-carrying instance set, a same-method-twice null with a required
    nonzero spread, a swept planted effect, and a curve-free cost-oracle arm
    whose expected success is the scope gate

  objective: >-
    If separately approved, authorized and executed, measure the per-instance
    log-cost correlation between the two methods the ICEX lane compares, on one
    frozen certificate-carrying instance set, and quantify how much interval
    width instance-level pairing actually buys against an unpaired design
    computed on the same data. The deliverable is a PRICED DESIGN, not a
    comparison result - the operating characteristic of the lane's headline
    comparison, expressed as the effect size it can detect and with what
    probability.

  what_this_is_not:
    - Not the lane's comparison. No exponent is produced and no advantage language is licensed.
    - Not a check for generation bias. Pairing removes instance variance and cannot detect a set generated to favour one method.
    - Not a discrete-logarithm attack claim of any kind.
    - Not a status change to any record.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling: >-
    Tier TOY, unraisable by any downstream citation. The exact scope a completed
    run could support is - on the frozen toy fixture set, at the tested sizes,
    the per-instance log-cost correlation between the two methods is a stated
    value with a stated interval, and the paired estimator's interval is narrower
    than the unpaired one by a stated factor. It cannot support any statement
    about the lane's exponent, about larger sizes, or about generation bias.

  falsifiable_prediction: >-
    PRE-REGISTERED BEFORE EXECUTION AND NEVER TUNED TO THE DATA.
    (1) The same-method-twice null gives a median paired log ratio of 0 within
    its bootstrap interval AND a per-instance spread strictly greater than 0.
    (2) The paired estimator recovers the planted multiplicative effect within
    its interval at EVERY swept magnitude, with a detection rate monotone
    non-decreasing in the magnitude and equal to the declared alpha at the
    no-effect setting.
    (3) The measured correlation's lower interval bound exceeds 0.3
    (PAIRING MATERIAL) or its upper bound falls below 0.1 (PAIRING IMMATERIAL);
    otherwise INCONCLUSIVE.
    (4) The ratio of paired to unpaired interval half-width equals the square
    root of one minus the measured correlation, within the bootstrap interval.
    (5) The curve-free cost-oracle arm reproduces the variance-reduction
    signature - this is the EXPECTED outcome and its consequence is fixed below.

  measured_quantities:
    - name: charged_work
      definition: >-
        Total charged operations for one method on one instance, under the lane's
        full-charging convention covering preprocessing, relations, linear
        algebra, descent, memory and multitarget, counted under ONE convention
        frozen before any cell runs.
      units: charged operations (dimensionless integer)
    - name: log_ratio_per_instance
      definition: >-
        Natural log of one method's charged work divided by the other's, on the
        SAME instance.
      units: nats (dimensionless)
    - name: rho_instance
      definition: >-
        Pearson correlation of the two methods' log charged work across the
        frozen instance set, with a bootstrap interval.
      units: dimensionless, in [-1, 1]
    - name: paired_interval_halfwidth
      definition: >-
        Half-width of the bootstrap interval of the median log ratio under the
        paired design.
      units: nats
    - name: unpaired_interval_halfwidth
      definition: >-
        The same quantity under a deliberately unpaired design computed on the
        same underlying measurements by shuffling the instance correspondence.
      units: nats
    - name: recovered_planted_effect
      definition: >-
        The paired estimator's point estimate of a planted multiplicative cost
        inflation, against its known injected value.
      units: dimensionless multiplicative factor
    - name: detection_rate
      definition: >-
        Fraction of replications at which the lane's decision rule fires, per
        planted magnitude.
      units: dimensionless fraction, with a binomial interval
    - name: failure_roster
      definition: >-
        The list of instances on which either method failed to complete, and the
        side on which each failed.
      units: instance identifiers (categorical), with per-side counts

  metrics:
    primary: [rho_instance, paired_interval_halfwidth, unpaired_interval_halfwidth, detection_rate, recovered_planted_effect]
    secondary: [charged_work, log_ratio_per_instance, failure_roster]

  null_and_control_objects:
    - id: NULL-SAMEMETHOD
      name: same-method-twice pairing null
      construction: >-
        One method run twice over the entire frozen set under DIFFERENT seeds,
        paired per instance.
      forced_value: >-
        Median paired log ratio 0 within its bootstrap interval, AND per-instance
        spread strictly greater than 0.
      non_vacuity: >-
        THE SPREAD REQUIREMENT IS WHAT MAKES THIS NULL NON-DEGENERATE. If the
        second run is a deterministic replay of the first, the paired ratio is
        identically 1 by construction, the null has width exactly zero, and it
        could never detect a pairing failure. Different seeds give it genuine
        run-to-run variance, and the contract requires that variance to be
        observed rather than assumed.
      can_it_differ_from_treatment: >-
        YES. A harness that pairs by index rather than by instance identity, or
        that silently regenerates an instance between arms, produces a median
        ratio away from 1 and is caught here.
    - id: NULL-UNPAIRED
      name: deliberately unpaired reproduction
      construction: >-
        The identical measurements re-analysed with the instance correspondence
        broken, so each side is summarised independently before comparison.
      forced_value: none - it is the comparator whose width difference is the effect
      non_vacuity: >-
        It is the DYNAMIC RANGE of the design question - the whole quantity under
        study is the difference between this arm and the paired one, and if the
        two coincide the answer is that pairing buys nothing, which is a real
        result rather than a failure.
    - id: PLANT-EFFECT
      name: swept planted multiplicative cost inflation
      construction: >-
        A known multiplicative inflation injected into one arm's charged work,
        swept over {1.00, 1.05, 1.10, 1.25, 1.50, 2.00}, at least 200
        replications per level. The injector is charged in full and CANNOT access
        the target scalar; a peek-check verifies that.
      forced_value: >-
        The estimator recovers the injected factor within its interval at every
        level; the detection rate is monotone non-decreasing; the rate at 1.00
        equals the declared alpha within Monte Carlo error.
      non_vacuity: >-
        THIS IS THE DEMONSTRATED-DYNAMIC-RANGE CONTROL, and it is what turns
        "the paired interval is narrower" into "the design detects an effect of
        size d with probability q". Without it, a narrower interval is a number
        with no operational meaning.
    - id: NULL-CURVEFREE
      name: curve-free synthetic cost-oracle pair
      construction: >-
        Two synthetic cost samplers with a shared per-instance effect calibrated
        to the measured rho and matched marginal dispersion, containing NO
        elliptic curve anywhere, run through the identical pairing analysis and
        the identical planted-effect sweep.
      forced_value: none - the arm is the scope gate
      non_vacuity: >-
        It produces its own interval widths, recovered effects and detection
        rates, each with intervals.
      consequence_pre_declared: >-
        THIS ARM IS EXPECTED TO REPRODUCE THE SIGNATURE, AND THE CONSEQUENCE IS
        WRITTEN DOWN IN ADVANCE FOR EXACTLY THAT REASON. Paired experimental
        design is a general statistical fact. IF THE CURVE-FREE ORACLES REPRODUCE
        THE VARIANCE REDUCTION AND THE RECOVERED PLANTED EFFECTS WITHIN THEIR
        INTERVALS, THEN THE RESULT OF THIS EXPERIMENT IS A STATEMENT ABOUT PAIRED
        EXPERIMENTAL DESIGN AND NOTHING FROM IT MAY BE QUOTED AS A STATEMENT
        ABOUT ELLIPTIC CURVES OR THE ECDLP. The measured rho remains a fact about
        THIS lane's instances; the design benefit does not.

  scope_gate: >-
    See NULL-CURVEFREE consequence_pre_declared. The gate is evaluated and
    reported BEFORE any design recommendation is made, and its verdict is printed
    on the face of every quoted number.

  independent_variables: [instance_identity, method, seed, planted_magnitude, pairing_mode, arm]

  preregistered_prediction:
    quantity: rho_instance, and the ratio of paired to unpaired interval half-width
    formula: >-
      For paired equal-variance measurements the variance of the difference is
      2 sigma squared times (1 minus rho), so the interval half-width ratio is
      predicted to equal the square root of (1 minus rho). Intervals are
      bootstrap over instances, 2000 resamples.
    source: ledger/hypotheses/H-ECDLP-d76995.yaml predictions P1 through P6
    values_frozen_here:
      frozen_set_size: 30
      pairing_material_rule: lower bound of the rho interval above 0.3
      pairing_immaterial_rule: upper bound of the rho interval below 0.1
      inconclusive_band: everything between, declared before the run
      planted_levels: [1.00, 1.05, 1.10, 1.25, 1.50, 2.00]
      replications_per_level: 200
      alpha: 0.05
      samemethod_spread_requirement: strictly greater than 0

  decision_rule_that_falsifies: >-
    THE RECORD IS FALSIFIED, and its central claim rejected in scope, IF the
    measured correlation's upper interval bound falls below 0.1 with every
    control passing. Instances are then effectively interchangeable at these
    sizes, pairing buys the lane nothing, and the lane may stop paying for a
    design constraint that does not help.
    THE RECORD IS SUPPORTED IN SCOPE IF the lower bound exceeds 0.3 with every
    control passing AND the curve-free arm does NOT reproduce the signature.
    IF THE CURVE-FREE ARM DOES REPRODUCE IT - the expected case - the correlation
    stands as a fact about this lane's instances and the design benefit is
    reported as a general statistical fact with no curve content.
    THE RUN IS INVALID, and no verdict of either kind may be reported, if
    NULL-SAMEMETHOD has zero spread or a median ratio away from 1, if PLANT-EFFECT
    is non-monotone or fails to recover any injected level, or if the
    no-effect detection rate materially exceeds alpha.

  stages:
    - id: S0
      name: frozen set construction and certification
      terminates_run: true
      description: >-
        Build the frozen instance set, attach a verified certificate to every
        instance, and record the set manifest with hashes. An instance without a
        verified certificate does not enter the set. Freeze the charging
        convention here, before any cell runs.
    - id: S1
      name: pairing null
      terminates_run: true
      description: >-
        NULL-SAMEMETHOD. Zero spread, or a median ratio away from 1, ENDS the
        run - in the first case because the null is degenerate, in the second
        because the pairing is not real.
    - id: S2
      name: planted-effect sweep
      terminates_run: true
      description: >-
        PLANT-EFFECT at every level, with the peek-check on the injector. A
        non-monotone rate, a failure to recover any level, or an
        anti-conservative no-effect rate ENDS the run.
    - id: S3
      name: curve-free arm
      terminates_run: false
      description: >-
        The identical analysis on the synthetic oracle pair. Its verdict is
        computed and the scope gate evaluated BEFORE any design recommendation.
    - id: S4
      name: paired and unpaired estimation on the real methods
      terminates_run: false
      description: >-
        Both methods on every frozen instance, then the paired and unpaired
        estimators on the same measurements, with the failure roster produced
        first and the estimates reported both with and without the failures.
    - id: S5
      name: verdict
      terminates_run: false
      description: >-
        Apply the frozen decision rule; report rho, both interval widths, the
        power curve from S2, and the scope-gate verdict on the face of the
        result.

  replication:
    seeds: [0, 1, 2, 3, 4]
    independent_instances: 30
    seeds_per_cell: 5
    seeds_policy: >-
      Every instance is addressed by (frozen_set_index) and is generated ONCE at
      S0 from a seed derived as a SHA-256 over the ASCII bytes of the domain
      string, the index, and the declared master seed, reduced to 64 bits. The
      domain string is EXP-ECDLP-b473c0/v1. THE INSTANCE SET IS THEN FROZEN AND
      IS NEVER REGENERATED - every method, every arm, every replicate and both
      pairing modes consume the identical frozen instances, which is what makes
      the design paired at instance level rather than by convention. Method-side
      randomness is addressed separately by (method, frozen_set_index, replicate)
      under the same derivation, so a method can be re-run independently on a
      fixed instance. The master seed is fixed in the frozen contract before any
      execution and is never re-drawn.
    determinism_requirement: >-
      Re-running any (method, frozen_set_index, replicate) must reproduce the
      identical charged work. Any cell failing this is INVALID and the method is
      reported as nondeterministic, which changes how NULL-SAMEMETHOD is read.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 100
    maximum_memory_gb: 8
    maximum_runs: 300
    maximum_workers: 1
    note: >-
      Below the per-run floor in templates/research-records.md deliberately, and
      the reason is stated - the per-run unit here is one method on one toy
      fixture instance, and the frozen set is 30 instances across many
      replications, so the WORK is sized by total_cpu_hours and maximum_runs
      rather than by a long single run. The planted-effect sweep with 200
      replications per level at 6 levels dominates maximum_runs.

  stopping_rules:
    - NULL-SAMEMETHOD spread exactly 0 -> STOP, degenerate null, report it rather than treating a replay as a pairing check.
    - NULL-SAMEMETHOD median paired ratio away from 1 beyond its interval -> STOP, the pairing is not real.
    - PLANT-EFFECT non-monotone, or any level not recovered -> STOP, no demonstrated dynamic range.
    - No-effect detection rate materially above alpha -> STOP, the rule is anti-conservative and every p-value in the lane is suspect.
    - Index calculus cannot run on the frozen instances -> STOP the paired design; report an UNPAIRED comparison with its variance penalty stated, never substitute a nearby instance.
    - Per-run ceiling exhausted at a cell -> STOP that cell, report failed_infrastructure with coverage reached.

  invalidation_rules:
    - Any estimate computed over a regenerated rather than the frozen instance is invalid.
    - Any paired estimate reported over survivors only, without the failure roster alongside, is invalid.
    - Any charged-work number produced under a charging convention not frozen at S0 is invalid.
    - Any instance in the frozen set lacking a verified certificate invalidates every estimate that used it.
    - Any quoted number lacking the curve-free scope-gate verdict on its face is invalid.
    - Any exponent, advantage-language or cryptographic-scale statement drawn from this contract is invalid on its face.

  success_criterion: >-
    ALL of - (a) the frozen set built with a verified certificate on every
    instance and its manifest hashed; (b) NULL-SAMEMETHOD gives median 0 with
    strictly positive spread; (c) PLANT-EFFECT recovers every level with a
    monotone rate and an alpha-level no-effect rate; (d) rho estimated with a
    bootstrap interval; (e) paired and unpaired half-widths computed on the SAME
    measurements and their ratio compared against the predicted square root of
    one minus rho; (f) the failure roster produced and estimates reported with
    and without failures; (g) the curve-free arm completed and the scope gate
    evaluated; (h) the frozen decision rule applied. Reaching PAIRING IMMATERIAL
    or INCONCLUSIVE is a SUCCESSFUL run; only failing (a) through (g) is
    unsuccessful.

  falsification_criterion: >-
    The measured correlation's upper interval bound below 0.1, with every control
    passing. H-ECDLP-d76995's central claim is then rejected in the tested scope
    and pairing is priced at approximately zero benefit for this lane at these
    sizes. Secondary falsifiers of the DESIGN rather than the hypothesis - a
    degenerate or failing pairing null, a planted sweep without dynamic range, an
    anti-conservative rule, methods that cannot share instances, or failures
    clustering on one side. In every case the failing control is named and
    forward guidance names the next object.

  required_artifacts:
    - the frozen instance set manifest with per-instance hashes and verified certificates
    - the charging convention, frozen at S0, recorded verbatim
    - results.json with charged work per (arm, method, instance, replicate)
    - NULL-SAMEMETHOD median, interval and per-instance spread
    - planted-effect recovered values and detection rates with binomial intervals at every level
    - the injector peek-check transcript
    - rho with bootstrap resamples retained
    - paired and unpaired half-widths computed on the same measurements
    - the failure roster with per-side counts, and estimates with and without failures
    - the curve-free arm's full results and the scope-gate verdict
    - exact commands, git commit, dirty-tree state, environment and dependency versions
    - peak resident memory, wall clock and CPU time per cell
    - stdout and stderr

  scale_relevance:
    tier: toy
    justification: >-
      Toy fixtures only, per the lane's declared scope. The measured correlation
      carries no guarantee at any larger size and no transfer is claimed.
    correspondence: null

  limitations:
    - >-
      An experimental-design control. PRODUCES NO COMPARISON RESULT and no
      exponent, and licenses no advantage language.
    - >-
      PAIRING REMOVES INSTANCE VARIANCE, NOT GENERATION BIAS. A frozen set
      generated in a way that favours one method yields a tighter but still
      biased estimate, and this contract measures the former and cannot detect
      the latter.
    - >-
      Scoped to methods that can run to completion on identical instances. Where
      they cannot, the honest report is an unpaired comparison with its variance
      penalty stated.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY RATHER THAN SILENTLY
      SHRUNK - the lane's actual question, whether a charged index-calculus
      exponent excludes one half, is not settled by this contract and cannot be
      settled at reachable toy sizes. The correlation measured here is a toy-scale
      quantity and no transfer to larger sizes is claimed.
    - >-
      The expected outcome of the curve-free arm is that it reproduces the
      signature, in which case the design benefit is a general statistical fact
      with no elliptic-curve content. That is stated in advance rather than
      discovered afterwards.
    - >-
      Changes no record's status.

  infrastructure_failure_disposition: >-
    A timeout, crash, out-of-memory or certificate-verification failure is
    INFRASTRUCTURE SIGNAL, recorded as failed_infrastructure with its cause and
    the affected instance. It is NEVER negative mathematical evidence. An
    instance on which a method times out enters the FAILURE ROSTER and is
    reported; it is never silently dropped, because dropping it compares the
    methods on the subset the weaker one could handle.

  assigned_to: executor

  authorization_note: >-
    This contract is status draft, is not frozen, and carries approved_by null.
    Only the Coordinator may approve, freeze or authorize execution (AGENTS.md
    rule 1). Written under TASK-20260904-c0edda, which is DESIGN ONLY. It
    supersedes no contract, edits no record and alters no goal.
