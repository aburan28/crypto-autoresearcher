# =============================================================================
# EXP-FROB-ad6a6d — version 1, approved by DEC-20261006-a7f0c6. Frozen
# slope-image comparison for IDEA-20261006-922612. Success is the
# idea's prediction: I_frob <= floor(I_rand / 2). The concrete negative
# is I_frob > floor(I_rand / 2) after the instrument checks pass and the
# map is lossy. This design session checked the field arithmetic and the
# discriminant residue 3. It did not enumerate E(F_{7^3}) and did not
# record either image size. No discrete logarithm is authorized. Source
# idea bytes are blob 6d02bf84d4668476886f9c12fc7a3b76f8139099.
# =============================================================================
experiment:
  id: EXP-FROB-ad6a6d
  hypothesis_id: H-FROB-5f6c86
  question_id: RQ-FROB-7d8dd4
  goal_id: GOAL-FROB-6333a9
  source_idea: IDEA-20261006-922612
  version: 1
  title: >-
    Image size of Frobenius-chord slopes on y^2 = x^3 + x + 1 over
    F_{7^3}, against one frozen random-chord sample
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  designed_at: '2026-10-06'
  frozen: true
  execution_authorized: true
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261006-a7f0c6
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null and
      the trial plan names a driver. Approval does not assert that the
      Frobenius image is the smaller one, does not assert that it is
      the larger one, and does not assert that an exponent moves.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Work only on y^2 = x^3 + x + 1 over F_7, with points in
      F_7[z]/(z^3 + z + 1). Count distinct chord slopes on S and on
      the frozen random sample of size |S|. The discriminant, the
      modulus, the 20 identities, the dual inverse, the vertical-drop
      fraction, and the affine null count are instrument checks. The
      tangent image and the reversed-pair image are written beside the
      row and do not choose it. Do not search for a discrete logarithm
      and do not add a curve to the claim. The single future run slot
      is RUN-FROB-026551. This decision does not launch it.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether I_frob <= floor(I_rand / 2). The concrete negative
    is that the instrument checks pass, the slope map is lossy, and
    I_frob is greater than floor(I_rand / 2). No faster
    discrete-logarithm algorithm is in scope.

  inputs:
    curve: >-
      p=7, A=1, B=1, model y^2 = x^3 + x + 1. The discriminant
      4A^3+27B^2 = 31 is 3 mod 7. A zero discriminant is
      instrument_failure. The design session evaluated that residue
      and did not enumerate points.
    field: >-
      F_{7^3} = F_7[z]/(z^3 + z + 1). Coefficients use a0 + 7 a1 + 49
      a2. The relation z^3 + z + 1 = 0 is an instrument check. The
      polynomial t^3 + t + 1 has no root in F_7; the run recomputes
      that. The design session evaluated it at t = 0..6.
    subset: >-
      S is the affine points whose x-coordinate is not in F_7.
      Infinity is excluded. |S| below 20 makes the comparison void.
    frobenius_slope: >-
      For P in S, lambda(P, pi(P)) uses the coordinate 7-power map.
      A zero denominator is instrument_failure. I_frob is the number
      of distinct values.
    random_slope: >-
      Points are ordered by (x, y). Pairs of distinct points are
      scanned with the left point outer. Vertical pairs are skipped.
      The first |S| surviving slopes form the random sample. If the
      scan ends early, the run is void. I_rand is the number of
      distinct values on that sample.
    dual_inverse: >-
      The first 20 points of S are sloped with a Fermat inverse and
      with an extended-gcd inverse. Disagreement is instrument_failure.
      The driver is experiments/EXP-FROB-ad6a6d/implementation/run.py.
      The checker is experiments/EXP-FROB-ad6a6d/implementation/check.py.
      The field code is experiments/EXP-FROB-ad6a6d/implementation/field.py.
    null_curve: >-
      y^2 = x^3 + x + z over the same field. The instrument count is
      the number of affine points whose coordinate 7-power still lies
      on that curve. A positive count is instrument_failure. Infinity
      is not counted.
    secondary: >-
      I_tan is the image size of (3x^2+1)/(2y) on the points of S
      where 2y is nonzero. I_rev is the image size of the same random
      scan with each accepted pair reversed. Neither number chooses
      the reading row. The empty-bin counts are recorded against the
      exact fraction 343 * (342/343)^|S| and do not choose the row.

  controls:
    - id: discriminant-control
      statement: >-
        31 mod 7 is recomputed and must be nonzero.
    - id: modulus-control
      statement: >-
        z^3 + z + 1 reduces to 0, and t^3 + t + 1 has no root in F_7.
    - id: frobenius-identity-control
      statement: >-
        On the first 20 points of S, lambda(pi(P), pi^2(P)) equals
        lambda(P, pi(P)) to the seventh power.
    - id: dual-slope-control
      statement: >-
        On those same 20 points the two inverses return the same slope.
    - id: null-curve-control
      statement: >-
        The affine null count is 0. A positive count means the null
        curve was not outside the base field in the sense the idea
        required, and the inequality is not scored.
    - id: drop-fraction-control
      statement: >-
        Vertical pairs dropped while filling the random sample are at
        most one tenth of the pairs examined. A larger drop voids the run.

  independent_variables:
    - whether the chord is the Frobenius chord or the frozen random chord
    - the reversed-pair sample, which does not choose the row

  metrics:
    primary:
      - id: image_ratio
        statement: >-
          I_frob compared with floor(I_rand / 2). The idea's prediction
          is that I_frob is at most that floor. The concrete negative
          is that I_frob is greater, while the instrument checks pass
          and the map is lossy.
    secondary:
      - id: sample_size
        statement: the integer |S|
      - id: I_frob
        statement: the Frobenius-chord image size
      - id: I_rand
        statement: the frozen random-chord image size
      - id: I_tan
        statement: the tangent-slope image size; this does not choose the row
      - id: I_rev
        statement: the reversed-pair image size; this does not choose the row
      - id: L
        statement: >-
          lossy when |S| >= 2 I_frob. The row not_lossy is a void, not
          the inequality negative.

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 is the factor-of-two gap on this curve. The reversed-pair
    image is the second sample named in the source idea. If the two
    random images differ by more than a factor of two, the report sets
    h1_within_factor_two false and does not use HEUR-1 to interpret
    I_frob. That flag does not change the reading row. Do not relabel
    an instrument failure as an inequality failure.

  preregistered_prediction:
    quantity: >-
      I_frob and I_rand, the two slope-image cardinalities on samples
      of size |S| for y^2 = x^3 + x + 1 over F_{7^3}.
    formula: >-
      I_frob <= floor(I_rand / 2). The concrete negative is that the
      instrument checks pass, |S| >= 2 I_frob, and I_frob > floor(I_rand / 2).
      A larger Frobenius image is not a confirmation. Source idea
      IDEA-20261006-922612. Neither image was counted before this
      formula was frozen.
    source: >-
      IDEA-20261006-922612, whose prediction is I_frob <= floor(I_rand / 2).
      KR-IC-b0fcda, KR-IC-46d822, KR-IC-955fd6, KR-IC-1fcdbc, and
      KR-RHO-037e22 were opened in this session and do not state this
      image comparison.

  scale_relevance:
    tier: toy
    justification: >-
      The field has 343 elements. The question's toy window starts
      near 2^16. No transfer from 343 elements to that window is
      assumed. The sample is one curve, not a tail draw. The minimum
      effect is the idea's own factor of 2.
    correspondence: >-
      Direct enumeration of affine points in F_7[z]/(z^3 + z + 1).
      No Deuring correspondence is used.

  tail_checks:
    - >-
      Meeting the factor of 2 is the prediction. Exceeding it, with
      the map lossy, is the negative. No third numeric band is
      introduced after the counts are seen.
    - >-
      The empty-bin counts are reported beside
      343 * (342/343)^|S|. They do not move the threshold.

  replication:
    seeds:
      - EXP-FROB-ad6a6d|claim|deterministic
    independent_instances: 1
    future_run_slot: RUN-FROB-026551
    note: >-
      One is the number of curves scored. The computation is
      deterministic. The dual inverse on 20 slopes is the replication
      of the slope integer. RUN-FROB-026551 is the named future slot
      in the trial plan. This design session does not create that
      directory and does not launch the slot.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One run manifest covers both images, the 20 identities, the
      tangent image, the reversed sample, and the null count.
      Wall-clock and CPU figures are advisory and null. The 1 GB
      memory figure is machine protection for the point list. A
      watchdog expiry is failed_infrastructure, not a value of the ratio.

  stopping_rules:
    - Stop after a reading row is named.
    - Do not change the curve and do not replace the factor of 2 after seeing a count.
    - Do not let I_tan or I_rev choose the row.
    - A timeout voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - A zero discriminant, a modulus failure, a short sample, a vertical-drop fraction above one tenth, a failed identity, a dual-slope disagreement, or a positive affine null count voids the run.
    - A mean fibre below 2 voids the comparison. It is not the inequality negative.
    - Using I_tan or I_rev to choose the reading row voids the run.
    - Scoring any curve other than the frozen curve voids the run.

  success_criterion: >-
    The instrument checks pass, |S| >= 2 I_frob, and
    I_frob <= floor(I_rand / 2). This is the prediction of
    IDEA-20261006-922612. It is reachable as a failure when the
    instrument checks pass, the map is lossy, and I_frob is greater
    than floor(I_rand / 2).

  falsification_criterion: >-
    The instrument checks pass, |S| >= 2 I_frob, and I_frob is greater
    than floor(I_rand / 2). That strict inequality is the concrete
    negative named with the source idea. The prediction is the
    opposite inequality and is not this negative. A short sample, a
    failed identity, a positive null count, a mean fibre below 2, and
    a timeout are not this negative.

  decision_impact:
    on_positive: >-
      A later evidence review may record that this one curve has a
      Frobenius-chord image at most half the frozen random-chord
      image. The generic exponent stays 1/2. No knowledge entry is
      promoted from this design record, and no discrete logarithm is
      claimed.
    on_negative: >-
      A later evidence review may record that this one curve has a
      Frobenius-chord image larger than half the frozen random-chord
      image, so the predicted factor-of-two thinness fails on this
      curve only. The generic exponent stays 1/2. The two outcomes
      name different inequalities and different readings.

  required_artifacts:
    - experiments/EXP-FROB-ad6a6d/runs/RUN-FROB-026551/manifest.yaml
    - experiments/EXP-FROB-ad6a6d/runs/RUN-FROB-026551/raw-result.json
    - experiments/EXP-FROB-ad6a6d/runs/RUN-FROB-026551/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: instrument_failure
      when: >-
        a discriminant is 0, the modulus check fails, |S| < 20, the
        random sample is short, I_rand < 2, the vertical drop exceeds
        one tenth, a Frobenius denominator vanishes, either of the 20
        checks fails, the affine null count is positive, or I_frob is 0
    - id: not_lossy
      when: >-
        the instrument checks pass and |S| < 2 I_frob, so the slope
        map is not lossy and the inequality is not scored
    - id: image_exceeds_half
      when: >-
        the instrument checks pass, the map is lossy, and I_frob is
        greater than floor(I_rand / 2)
    - id: image_at_most_half
      when: >-
        the instrument checks pass, the map is lossy, and I_frob is
        at most floor(I_rand / 2)
  reading_rule: >-
    Name exactly one row. image_at_most_half is the only success row.
    image_exceeds_half is the concrete negative. not_lossy and
    instrument_failure are not values of the ratio. Record both
    counts, the threshold, I_tan, I_rev, the null count, and
    attack_claimed false beside the row. Those fields do not change
    the row.
