  title: >-
    A base-change ladder over F_{p^k}, k=1..4, run on a frozen six-object
    battery at p=211, testing whether a Frobenius census can be corrected
    into a certified geometric-monodromy instrument and whether it correctly
    refuses (UNDECIDED) when no independent structural lower bound is
    available, per H-MONO-59f6a6.

  objective: >-
    Now approved, frozen and execution_authorized (see
    `coordinator_approval_rationale`): decide, at toy scale and scoped
    strictly to p=211, whether the
    five-step base-change-ladder protocol of H-MONO-59f6a6 (i) reproduces the
    already-established D_4 result on N1 at every k=1..4, (ii) produces the
    forced 4->2 drop on the planted separator h_sep (N2) while its true-
    (Z/2)^2 twin (N2-twin) shows no drop, (iii) produces the forced 3->1 drop
    on the pure constant-field case N4, (iv) reproduces S_4/S_5 Chebotarev
    density laws on the random-polynomial controls N3/N5, and (v) correctly
    reports UNDECIDED at every k for N5 regardless of how well its density
    profile matches S_5. No run has happened yet; nothing here is evidence.

  what_this_is_not:
    - Not a discrete-logarithm computation, not an ECDLP attack, not relation collection.
    - >-
      Not an ECDLP cost, runtime, asymptotic, exponent, cryptographic-scale,
      or deployed-scheme claim, in either direction.
    - >-
      Not a closure of KN-OPEN-009, RQ-MONO-001, or GOAL-MONO-001; not a
      status change to any of them, to KN-FIND-a8990a, or to H-MONO-0b3def /
      H-MONO-0f9170. Coordinator authority alone (AGENTS.md rule 1).
    - >-
      Not a claim about m>=4 Semaev covers, characteristic 2 or 3, or any
      curve or field outside the frozen six-object battery at p=211.
    - >-
      Not the literal degree-100 N5 construction of IDEA-20260830-8a767e;
      see H-MONO-59f6a6 `test_boundary` for the disclosed scoping-down to a
      generic quintic (S_5, order 120).
    - >-
      Not yet executed and not evidence: approved and frozen as of
      2026-08-30 (see `coordinator_approval_rationale`), but no run has
      happened at the time this contract was written.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: that on the six frozen battery objects at p=211, the ladder
      measured the forced R_k sequences (or did not), the hand-derived
      structural upper/inertia lower bounds agreed with the ladder-measured
