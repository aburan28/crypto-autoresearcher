      their classical Chebotarev laws (or did not), and the Step-5 verdict
      machinery correctly refused (UNDECIDED) on N5 at every k (or did not).
      The PROTOCOL's general validity beyond these six objects is not
      established by this run; it is a toy-scale demonstration on a battery
      chosen precisely because its answers are independently derivable by
      hand in advance.
    what_no_outcome_can_support: >-
      No outcome establishes anything about m>=4, about relation rates, or
      about any curve, prime, or cover outside the six frozen objects. No
      outcome converts to a cost, exponent, or crypto-scale claim. No outcome
      closes KN-OPEN-009, RQ-MONO-001, or GOAL-MONO-001. A drop on N1, if
      observed, would be a highly consequential finding about H-MONO-0b3def
      and KN-FIND-a8990a, but this run alone cannot decide whether such a
      drop is a genuine refutation or an implementation defect in this
      record's own ladder machinery -- see `stopping_rules` and
      H-MONO-59f6a6's falsification_conditions.

  field_arithmetic_representation:
    design_decision: >-
      GENERIC, NOT AD HOC. F_{p^k} = F_p[x]/(m_k(x)) for a FIXED monic
      irreducible degree-k polynomial m_k(x), the SAME representation used
      uniformly for k=1,2,3,4 (k=1 is simply F_p itself, m_1(x)=x, no
      polynomial ring needed). This deliberately replaces the ad hoc
      quadratic-tower approach of EXP-MONO-4c7479's `fp_common.py` (Fp2 as
      F_p[w]/(w^2-d), Fp4 as Fp2[z]/(z^2-e)), which is specific to k in
      {1,2,4} via repeated squaring of a fixed quadratic extension and does
      not generalise to k=3 at all. Elements of F_{p^k} are represented as
      length-k coefficient tuples (c_0,...,c_{k-1}) meaning
      c_0 + c_1 x + ... + c_{k-1} x^{k-1} mod m_k(x).
    m_k_search_procedure: >-
      For k=2,3,4: try candidates m_k(x) = x^k - a for a = 2,3,4,... in
      increasing order (skipping a such that x^k-a is trivially reducible,
      e.g. a a perfect d-th power for some prime d|k, which the
      irreducibility test below rejects anyway), testing each by RABIN'S
      IRREDIBILITY TEST: m_k(x) is irreducible over F_p iff (a) for every
      prime q dividing k, gcd(x^{p^{k/q}} - x, m_k(x)) = 1 in F_p[x]/(m_k(x))
      reduced mod m_k(x) via the polynomial Euclidean algorithm, AND
      (b) x^{p^k} = x exactly mod m_k(x). Both conditions are checked by
      computing x^{p^j} mod m_k(x) via repeated squaring of the
      already-reduced polynomial x, i.e. iteratively squaring and reducing
      (a standard polynomial modular exponentiation), for each required
      exponent p^{k/q} and p^k. The FIRST a (starting from 2) for which
      x^k-a passes both checks is m_k(x); the search and its winning `a` are
      recorded in the run's Stage-0 transcript for reproducibility. If no
      a <= 50 succeeds (not expected at p=211 for k<=4; binomials x^k-a fail
      to be irreducible only when a is a d-th power for some prime d|k, a
      genuinely rare event to persist over 50 consecutive trials), the
      Executor falls back to trying non-binomial monic polynomials of degree
      k with a single extra linear term (x^k - a x - b) under the same test,
      and reports which branch was used; this is a stated CONTINGENCY, not
      the expected path, and its use is reported as a deviation from the
      primary design, not silently absorbed.
    frobenius: >-
      The p-power (absolute) Frobenius of F_{p^k}/F_p, x -> x^p, computed
      GENUINELY as a field automorphism on this representation: for an
      element g(x) = c_0 + c_1 x + ... + c_{k-1} x^{k-1} mod m_k(x), Frob(g)
      = g(x)^p mod m_k(x), computed by POLYNOMIAL MODULAR EXPONENTIATION
      (repeated squaring of g(x) in the ring F_p[x]/(m_k(x)), p-1 squarings'
      worth of work done via O(log p) squarings and multiplications, each a
      degree-<k polynomial multiplication followed by reduction mod m_k(x)).
      Frob^j for j>1 (needed when comparing against a lower-level field, or
      computing x^{p^j} in the irreducibility test above) is Frob applied j
      times, or equivalently g(x)^{p^j} mod m_k(x) computed directly by
      exponentiation to p^j via repeated squaring -- both give the same
      result and the Executor may use whichever is cheaper; a lightweight
      cross-check computing both ways once per run and confirming agreement
      is REQUIRED and reported (a mismatch is an implementation defect,
      voiding the run's interpretation, never mathematical evidence).
    embeddings_between_levels: >-
      F_p embeds into F_{p^k} as the constant tuple (c_0,0,...,0). For
      comparing whether a value lies in a sub-field F_{p^j} for j|k (needed,
      e.g., to detect when sqrt(2) newly appears at k=2 versus k=4 for N2,
      or to confirm N4's cube roots of unity are already in F_p), the test
      is: an element g of F_{p^k} lies in F_{p^j} (j|k) iff g^{p^j} = g
      exactly (computed via the same modular-exponentiation routine).
      Concretely EMBEDDING an F_{p^j} element into F_{p^k} coordinates
      (j|k) is NOT needed anywhere in this contract's primary metrics (every
      quantity is computed and compared entirely within its own field level);
      it is used only for the diagnostic sub-field membership test above.
    modular_square_root_in_Fpk: >-
      GENERALISED TONELLI-SHANKS OVER F_{p^k}. F_{p^k}^* is cyclic of order
      N = p^k - 1. An element g != 0 is a square iff g^{N/2} = 1 (identity
      element (1,0,...,0)). If N/2 is odd -- equivalently N = 2*odd -- a
      square root is g^{(N/2+1)/2}... more precisely: write N = Q * 2^S with
      Q odd; find a non-residue z of F_{p^k} (by trial over the fixed
      generator sequence x, x+1, x+2, ... of F_{p^k}, testing z^{N/2} != 1);
      then run the standard Tonelli-Shanks loop (identical in structure to
      `fp_common.py`'s F_p routine, ported verbatim to operate on F_{p^k}
      ring elements via the multiplication/exponentiation routines above
      instead of scalar mod-p arithmetic). This single generalised routine
      REPLACES the three separate, level-specific square-root routines
      (`sqrt_mod` for F_p, `Fp2.sqrt`, `Fp4.sqrt_of_fp2_nonsquare`) the
      sibling contract's `fp_common.py` used; it is the concrete
      generalisation this contract's design note requires, and its
      correctness at k=1 (reducing to plain Tonelli-Shanks) is the mandatory
      Stage-0 sanity check against `fp_common.py`'s existing `sqrt_mod`
      before it is trusted at k=2,3,4.
    total_order_for_labelling: >-
      Every F_{p^k} element is totally ordered by LEXICOGRAPHIC comparison
      of its coefficient tuple (c_0,c_1,...,c_{k-1}), each c_i compared as
      an integer in [0,p-1]. This order is the FIXED convention used
      throughout for canonical square-root branch selection (the returned
      root is whichever of the two square roots is lexicographically
      smaller) and for canonical labelling of a fibre's points (sorted by
      this order once per base point, reused identically at every k). This
      is the exact mechanism satisfying H-MONO-59f6a6's "fixed labelling
      maintained across k" assumption, stated here as an executable rule
      rather than left implicit.
    environment_preconditions: >-
      Pure Python 3 standard library only: integer arithmetic, `pow(x, e,
      m)`, `pow(x, -1, m)`; hand-written polynomial-ring arithmetic mod
      m_k(x) (multiplication as convolution followed by reduction, using
      long division by the fixed m_k(x)); NO sympy, NO sage, NO numpy, NO
      external CAS. `fp_common.py`'s `legendre` and `sqrt_mod` (plain F_p
      routines) MAY be reused or ported for the k=1 level and as the Stage-0
      cross-check target for the generalised F_{p^k} square-root routine;
      its `Fp2`/`Fp4` classes are NOT used for the primary k=2,3,4
      computations in this contract (superseded by the generic
      representation above), consistent with the task's explicit direction
      to use a more general representation than that ad hoc tower.

  battery:
    p: 211
    p_verification: >-
      211 is prime (trial division up to sqrt(211)~14.5 finds no factor);
      odd; does not divide any tested cover degree (max degree 5, and N5's
      structural order 120); 211 mod 3 = 1 (211 = 70*3+1), REQUIRED for N4;
      211 mod 8 = 3 (211 = 26*8+3), which is why 2 is a quadratic
      non-residue mod 211 (the classical rule: (2/p)=+1 iff p = +-1 mod 8;
      211 = 3 mod 8 gives (2/211) = -1). Chosen for consistency with the two
      sibling contracts (EXP-MONO-4c7479, EXP-MONO-2a13d7 both use p in
      {101,211}) and because, uniquely among that pair, 211 = 1 mod 3
      (101 mod 3 = 2, so p=101 is NOT usable for N4). The Executor
      independently re-verifies primality and every congruence above as its
      first construction step; a failure is `failed_infrastructure`, never
      mathematical evidence.
    c: 2
    c_verification: >-
      c=2 serves DOUBLE DUTY, deliberately, at p=211: it is BOTH the fixed
      non-square needed by N2 (verified: (2/211) = -1 above) AND the fixed
      non-cube needed by N4 (verified: 2^{(211-1)/3} mod 211 = 2^70 mod 211.
      By repeated squaring: 2^1=2, 2^2=4, 2^4=16, 2^8=45, 2^16=126, 2^32=51,
      2^64=69 (all mod 211); 70=64+4+2, so 2^70 = 69*16*4 mod 211 =
      (69*16 mod 211)*4 mod 211 = 49*4 mod 211 = 196. Since 196 != 1 mod
      211, 2 is NOT in the order-70 subgroup of cubes, i.e. 2 is a non-cube.
      THE EXECUTOR MUST INDEPENDENTLY RE-VERIFY BOTH FACTS IN CODE as a
      Stage-0 check before using c=2 anywhere; a mismatch is
      `failed_infrastructure`.
    N1:
      description: >-
        The m=3 Semaev symmetric-base cover of EXP-MONO-4c7479 / H-MONO-0b3def,
        reusing the curve (A,B)=(1,1) at p=211 from EXP-MONO-4c7479's
        committed `curve_panel_committed` (already disc-verified there:
        4*1+27*1=31 mod 211=31, nonzero). Fibre: the four labelled points
        {P1,-P1,P2,-P2} of Phi(e1,e2) as defined in H-MONO-0b3def's
        `statement`, using the SAME construction (base (e1,e2) -> t1,t2 via
        the discriminant D=e1^2-4e2 -> y1,y2 via f(t_i)=t_i^3+A t_i+B) as
        EXP-MONO-4c7479's arm (a), but with Frobenius realized via THIS
        contract's generic F_{p^k} representation rather than the sibling's
        ad hoc Fp2/Fp4 towers.
      forced_R_k: {k1: 8, k2: 8, k3: 8, k4: 8}
      structural_upper_bound_U: >-
        Z/2 wr S_2 = D_4, order 8. Imported verbatim from H-MONO-0b3def
        STEP 1 (the preserved block system {P1,-P1},{P2,-P2}); not
        re-derived here.
      inertia_lower_bound_L: >-
        D_4, order 8. Imported verbatim from H-MONO-0b3def STEP 5 (inertia
        at D_swap={e1^2-4e2=0} and D_sign={f(t1)f(t2)=0}); not re-derived
        here. Since L=U=8 already at the arithmetic level, N1 is expected to
        reach DECIDED (D_4) at k=1 already, with the ladder (k=2,3,4)
        serving as a CONFIRMATORY check that R_stab does not drop, exactly
        as H-MONO-0b3def's own STEP 4 (d=1) predicts.
    N2:
      description: "h_sep(Y) = (Y^2 - e) (Y^2 - 2e), base variable e, over F_211(e)."
      a_of_e: "e (the identity function of the base variable; degree 1, trivially squarefree)"
      c_constant: 2
      fibre_labelling: >-
        Roots of h_sep(Y) as a polynomial in Y over whatever field level t
        contains sqrt(e) and sqrt(2e): P1 = (+sqrt(e), lexicographically
        smaller root), -P1 = -sqrt(e), P2 = +sqrt(2e) (smaller root), -P2 =
        -sqrt(2e). "Base points" are values of e in F_{p^k} (sampled or
        enumerated as specified in `census_procedure` below); e=0 is
        EXCLUDED as a ramification point (both factors degenerate there;
        reported separately, never pooled).
      forced_R_k: {k1: 4, k2: 2, k3: 4, k4: 2}
      structural_upper_bound_U: >-
        (Z/2)^2, order 4. No swap symmetry exists between the two factors
        (a(e)=e and 2e=c*a(e) are two DISTINCT F_p(e)-rational functions
        with no automorphism of the base exchanging them), so the group is
        contained in the pure sign-flip group on the two independent pairs.
      inertia_lower_bound_L: >-
        AT THE ARITHMETIC LEVEL (over F_p(e)): <sigma_1 sigma_2> = Z/2,
        order 2 ONLY. Derivation (H-MONO-59f6a6 mechanism STEP 2): a(e)=e
        and c*a(e)=2e share the IDENTICAL zero/pole divisor (e=0 and
        e=infinity, since c=2 is a nonzero CONSTANT, not a function of e).
        Local analysis at e=0 (local coordinate e=s^2): sqrt(e)=s and
        sqrt(2e)=sqrt(2)*s BOTH flip sign as s -> -s, so the local
        monodromy generator is the DIAGONAL sigma_1 sigma_2 only -- never an
        individual sigma_i. The SAME diagonal generator recurs at
        e=infinity by the symmetric local analysis there. Hence L=2, NOT 4,
        at the arithmetic level: this is the precise algebraic fact
        UNDERLYING G_geom=Z/2, and it is a genuinely independent computation
        from the census. AT THE GEOMETRIC LEVEL (over F_p-bar(e), i.e. after
        formally adjoining sqrt(2)): sqrt(2e) = sqrt(2)*sqrt(e) is already
        expressible via sqrt(e) alone once sqrt(2) is a constant in the
        field, so the geometric extension is JUST F_p-bar(e)(sqrt(e)),
        degree 2, giving a TIGHT geometric bound U_geom = L_geom = Z/2,
        order 2, matching R_stab exactly. BOTH derivations (arithmetic-level
        L=2!=U=4, and the refined geometric-level U_geom=L_geom=2) are
        REQUIRED Stage-3 outputs; reporting only the naive U=4 without the
        refined geometric pair would understate what the hand derivation
        actually shows.
    N2_twin:
      description: "(Y^2 - e) (Y^2 - (e+1)), the TRUE-(Z/2)^2 control."
      a_of_e: e
      b_of_e: "e + 1"
      fibre_labelling: >-
        Identical convention to N2: P1=+sqrt(e), -P1=-sqrt(e), P2=+sqrt(e+1)
        (smaller root), -P2=-sqrt(e+1). Excluded ramification points: e=0
        and e=-1, reported separately.
      forced_R_k: {k1: 4, k2: 4, k3: 4, k4: 4}
      structural_upper_bound_U: >-
        (Z/2)^2, order 4. Same reasoning as N2 (no swap symmetry between two
        distinct F_p(e)-rational functions a(e), b(e)).
      inertia_lower_bound_L: >-
        (Z/2)^2, order 4, ALREADY at the arithmetic level. Derivation: a(e)
        and b(e)=e+1 have DISTINCT zero divisors (e=0 and e=-1). At e=0,
        b(0)=1 != 0, so ONLY sqrt(e) ramifies there, giving the INDIVIDUAL
        generator sigma_1 (not the diagonal). At e=-1, a(-1)=-1 != 0, so
        ONLY sqrt(e+1) ramifies there, giving the INDIVIDUAL generator
        sigma_2. Together sigma_1 and sigma_2 generate the FULL (Z/2)^2.
        Hence L=U=4 ALREADY, with no constant-field correction needed:
        THIS MEMBER IS DECIDABLE WITHOUT THE LADDER AT ALL (d=1), a
        deliberate contrast with N2 (d=2), matching the idea's framing that
        the pair "is the discrimination the whole record exists for."
    N3:
      description: >-
        A uniformly random monic quartic Y^4+b3 Y^3+b2 Y^2+b1 Y+b0, redrawn
        independently at each of k=1,2,3,4 with coefficients b_i drawn from
        F_{p^k} (not F_p) at level k, discarding non-squarefree draws
        (gcd(h,h')!=1 via the polynomial Euclidean algorithm over F_{p^k})
        and redrawing at the next index (never retried in place), mirroring
        EXP-MONO-4c7479's `random_quartic_null_control` design exactly but
        generalised to F_{p^k} coefficients for k>1.
      forced_density_profile: >-
        S_4 Chebotarev law: 1/24 (1^4), 1/4 (2.1.1), 1/8 (2^2), 1/3 (3+1),
        1/4 (4), at EVERY tested k=1,2,3,4, within 3 binomial standard
        errors. The idea's own predictions force this only at k=1,2;
        extending unchanged to k=3,4 is a disclosed Coordinator addition
        (genericity is not expected to depend on which finite field the
        coefficients are drawn from), not a claim in the source proposal.
      verdict_machinery: >-
        NOT APPLIED. N3 is an instrument-correctness control (does the
        classifier reproduce known S_4 statistics), not a Step-5 verdict
        target; no U/L/DECIDED-or-UNDECIDED output is required or reported
        for N3, matching the idea's own predictions list.
      classification_method: >-
        Distinct-degree factorization via repeated-squaring computation of
        Y^{(p^k)^i} mod h(Y) in the polynomial ring F_{p^k}[Y] (an
        extension, at the level of F_{p^k} coefficients, of
        EXP-MONO-4c7479's arm (b) machinery, itself required to run as a
        GENERAL quartic factoring routine, never the biquadratic shortcut).
    N4:
      description: >-
        Y^3 - 2 over F_211, a SINGLE-POINT base (Spec F_p, no moving
        parameter). p=211=1 mod 3, so the cube roots of unity are already in
        F_p; c=2 is a verified non-cube (see `battery.c_verification`), so
        Y^3-2 is irreducible over F_p and its splitting field is F_{p^3}
        (a pure constant-field extension, [F_p(beta):F_p]=3 with no
        further Galois-closure work needed since omega is already present).
      fibre_labelling: >-
        The three roots {beta, beta*omega, beta*omega^2} of Y^3-2 in
        F_{p^3}, computed ONCE via factoring Y^3-2 over F_{p^3} (using this
        contract's F_{p^3}=F_p[x]/(m_3(x)) representation), then labelled by
        ASCENDING lexicographic order of their coefficient-tuple
        representation in that fixed basis; this single labelling is reused
        at every k.
      census_procedure: >-
        There is exactly ONE base point at every k (the single point of
        Spec F_p); R_k is read off a SINGLE Frobenius-to-the-k computation
        (x -> x^{p^k} in F_{p^3}, applied to each of the three labelled
        roots, all represented in F_{p^3} regardless of which k's ladder
        step is being evaluated -- the roots always live in F_{p^3}; what
        varies with k is which power of Frobenius is applied), and R_k is
        the ORDER of the cyclic group generated by that single resulting
        permutation of the 3 labelled roots. No sampling, no statistics: an
        EXACT, deterministic computation at every k.
      forced_R_k: {k1: 3, k2: 3, k3: 1, k4: 3}
      derivation_of_forced_values: >-
        Gal(F_{p^3}/F_p) = Z/3 = <Frob_p>. R_k = order of the subgroup
        generated by Frob_p^k inside this Z/3. Since Z/3 has prime order,
        Frob_p^k generates all of Z/3 (order 3) whenever k is NOT a multiple
        of 3, and generates only the identity (order 1) when k IS a
        multiple of 3. Hence R_1=3, R_2=3, R_3=1, R_4=3 (4 mod 3 = 1 != 0).
      structural_upper_bound_U: "Z/3, order 3. Immediate: any degree-3 binomial's Galois group over a field already containing the cube roots of unity is cyclic of order dividing 3."
      inertia_lower_bound_L: >-
        U=3 exactly, established by field theory alone (p=1 mod 3 and c a
        verified non-cube force [F_p(beta):F_p]=3 exactly, with no
        possibility of a smaller degree); no inertia/ramification argument
        is meaningful or needed for a single-point base. G_geom=1 (trivial):
        over F_p-bar there is no moving base point at all, so there is no
        monodromy group in the usual sense -- the entire R_1=3 arithmetic
        group is a pure constant-field artifact (d=3), which is exactly why
        this member is named "the extreme case" in the source proposal.
    N5:
      description: >-
        SCOPED DOWN from the idea's literal degree-100 construction; see
        H-MONO-59f6a6 `test_boundary` for the full feasibility argument. A
        uniformly random monic QUINTIC Y^5+b4Y^4+...+b0, redrawn
        independently at each k=1,2,3,4 with coefficients drawn from
        F_{p^k}, discarding non-squarefree draws and redrawing at the next
        index, by the same design as N3 extended to degree 5.
      structural_upper_bound_U: "S_5, order 120. Trivial degree bound: the Galois group of any degree-5 polynomial's splitting field embeds in S_5."
      inertia_lower_bound_L: >-
        NOT DERIVED, BY DESIGN. Establishing "a generic quintic has full S_5
        Galois group" rigorously requires Hilbert-irreducibility-type
        machinery (specialization of a generic polynomial's Galois group),
        which is explicitly OUT OF SCOPE for this toy record. L is recorded
        as trivial (order 1) -- the honest default for "no independent lower
        bound was attempted" -- for every k.
      forced_verdict: "UNDECIDED at every k=1,2,3,4, with both bounds (U=120, L=1) reported, REGARDLESS of the observed density match quality."
      forced_density_profile_reported_but_not_decisive: >-
        S_5 Chebotarev law (classical cycle-index computation): 1/120
        (1^5), 10/120 (2.1^3), 15/120 (2^2.1), 20/120 (3.1^2), 20/120 (3.2),
        30/120 (4.1), 24/120 (5). This histogram IS measured and reported
        (as a secondary metric, and as the honest reason the density match
        alone is NOT sufficient for DECIDED per Step 5's interface rule),
        but it does not and must not change the forced UNDECIDED verdict.
      classification_method: >-
        Distinct-degree factorization, identical in structure to N3's but
        for degree-5 polynomials (one extra squaring round in the
        repeated-squaring exponentiation; otherwise the same routine).

  census_procedure:
    k1_exhaustive_members: >-
      N1, N2, N2-twin: EXHAUSTIVE census over every (e1,e2) [N1] or e [N2,
      N2-twin, a single base variable, so exhaustive over e in F_p, 211
      values, not p^2 -- see note below] in F_p at k=1. NOTE ON BASE
      DIMENSION: N1's base is 2-dimensional (e1,e2), matching
      EXP-MONO-4c7479 exactly (p^2=44521 points); N2 and N2-twin's base is
      1-DIMENSIONAL (the single variable e), so their k=1 exhaustive census
      is only p=211 points each, cheaper than N1's, not p^2. This asymmetry
      is a genuine feature of the two different cover shapes (N1 is a
      2-parameter symmetric-pair cover; N2/N2-twin are 1-parameter
      biquadratics) and is stated explicitly to avoid an inflated cost
      estimate.
    k1_exact_members: "N4: a single exact computation, no enumeration or sampling (see battery.N4.census_procedure)."
    k1_sampled_members: >-
      N3, N5: S=2,000 independent draws each (matching EXP-MONO-4c7479's
      random-quartic-control draw count), classified and tallied into a
      cycle-type histogram.
    k_gte_2_sampled_members: >-
      N1, N2, N2-twin: base sizes at k>=2 are p^{2k} (N1) or p^k (N2,
      N2-twin) -- too large to enumerate (e.g. N1's base at k=4 has
      211^8 ~= 3.87*10^17 points). SAMPLE S=10,000 base points per
      (member, k) cell, drawn via a SEEDED deterministic rule: for each
      draw index j and each coordinate, the coordinate's coefficient tuple
      in F_{p^k} is drawn via SHA256(domain || "|coord|" || decimal(p) ||
      "|" || decimal(k) || "|" || decimal(j) || "|" || decimal(coord_index)
      || "|" || decimal(coeff_index) || "|" || decimal(counter)) mod p per
      coefficient, big-endian unsigned interpretation, rejection sampling
      against modulo bias exactly as EXP-MONO-4c7479's
      `random_quartic_control_seed_rule`, domain string
      "EXP-MONO-a20e48/v1". S=10,000 is fixed IN ADVANCE from each member's
      structural upper bound U (N1: U=8, N2/N2-twin: U=4), giving expected
      hits per class at least 10,000/8=1,250 -- comfortably satisfying
      HEUR-AG-2's coupon-collector requirement at probability >=0.999, per
      H-MONO-59f6a6.
    k_gte_2_exact_member: "N4: the same single exact computation at every k (see battery.N4)."
    k_gte_2_sampled_random_controls: >-
      N3, N5: S=2,000 independent draws each, coefficients drawn from
      F_{p^k} via the same seeded rule, redrawing on non-squarefree hits.
    subgroup_generation_routine: >-
      For N1, N2, N2-twin, N4 (the four members with a genuine fixed
      labelled fibre): from the SET of observed Frobenius permutations of
      the labelled fibre (fibre size 4 for N1/N2/N2-twin, 3 for N4), compute
      the subgroup of the symmetric group on the fibre's points that this
      set generates, by standard orbit/Schreier-style closure (repeatedly
      compose newly found elements with the generating set and with each
      other until no new element appears; feasible in milliseconds since
      |S_4|=24 and |S_3|=6 are trivially small). R_k is the ORDER of this
      generated subgroup. This routine does NOT apply to N3/N5 (no fixed
      labelled fibre across independent draws); their R_k-equivalent is the
      density-histogram comparison described per-member above.

  controls:
    identical_object_null: >-
      Two independently generated random quartics (N3) over the SAME F_p at
      a fixed k. FORCED: both draws individually reproduce S_4 densities
      over their own sub-ensembles (split the 2,000 draws into two halves
      by seed parity and confirm both halves independently match the S_4
      profile within 3 s.e.); no separation is claimed between the halves. A
      protocol that separates two draws from the same distribution has a
      false-positive problem and its other verdicts are suspect.
    true_z2z2_control: >-
      N2-twin, described above. Forced 4 at every k, paired against N2's
      4->2->4->2. This is the decisive pair.
    sample_size_control: >-
      On N2 (h_sep) at k=1 SPECIFICALLY: in addition to the exhaustive
      census over all p=211 values of e, run TWO ADDITIONAL SAMPLED
      sub-censuses at S=1,000 and S=100,000 (drawn via the same seeded rule
      as k>=2, applied here at k=1 even though exhaustive enumeration is
      also cheap and available, precisely so this control is meaningful).
      FORCED: R_1=4 identically across the exhaustive census, the S=1,000
      sample, and the S=100,000 sample. Any run whose R_k value CHANGES from
      an adjacent k is additionally re-run with a TENFOLD sample increase at
      the affected cell before the drop is reported as confirmed, per
      H-MONO-59f6a6 HEUR-AG-2's falsification condition (this generalises
      the source proposal's h_sep-specific control to any cell showing an
      unexpected change).
    labelling_control: >-
      For N1, N2, N2-twin, N4: recompute the generated subgroup under a
      SECOND, independently chosen labelling convention -- REVERSE
      lexicographic order on coefficient tuples (instead of ascending) for
      selecting canonical square-root branches and ordering the fibre.
      FORCED: the resulting group, as an ABSTRACT group, is isomorphic to
      the primary labelling's result, and its ORDER is IDENTICAL. A
      labelling-dependent order is an implementation defect and voids the
      affected cell's interpretation (never reported as a mathematical
      finding).
    reproduction_control: >-
      On N1 at k=1: the resulting five-class Frobenius histogram (identity,
      {sigma_i}, sigma_1 sigma_2, block-swap involutions, four-cycles) MUST
      exactly reproduce EXP-MONO-4c7479's own histogram for the SAME curve
      (A=1,B=1) at p=211, read from that experiment's committed run
      artifacts under `experiments/EXP-MONO-4c7479/runs/`. A mismatch means
      this contract's classifier differs from the lane's own and VOIDS
      interpretation of every other N1 metric until resolved (this is
      H-MONO-59f6a6's proof_search_map.baseline_embedding.reproduction_check
      made operational).

  metrics:
    primary:
      - >-
        M1: R_k per battery member per k=1..4, as a group order (all six
        members) and, for N1/N2/N2-twin/N4, as an explicit generator list
        for the realized subgroup.
      - >-
        M2: the central h_sep contrast, R_1=4 exactly vs R_2=2 exactly on
        N2, reported as its own headline number, not buried in the general
        R_k table.
      - >-
        M3: the twin-control non-drop, R_k=4 at every k=1..4 on N2-twin.
      - "M4: N4's drop, R_1=3, R_3=1 exactly (and R_2=3, R_4=3 per the derived period-3 sequence)."
      - >-
        M5: N5's Step-5 verdict at every k (FORCED UNDECIDED with both
        bounds reported), reported independently of M6.
      - "M6: N5's cycle-type density histogram at every k, compared against the S_5 Chebotarev law."
    secondary:
      - "N3's cycle-type density histogram at every k, compared against the S_4 Chebotarev law."
      - "N1's R_k=8 reproduction across the ladder, cross-checked against the reproduction_control."
      - "Sample-size control outcome on N2 (exhaustive vs S=1,000 vs S=100,000)."
      - "Tenfold-sample-increase confirmation for any cell whose R_k changed from an adjacent k."
      - "Labelling-control agreement flag (isomorphic group, identical order) for N1, N2, N2-twin, N4."
      - "Reproduction-control agreement (N1 at k=1 vs EXP-MONO-4c7479)."
      - "Structural upper bound U and inertia lower bound L per member, as recorded in `battery` above, cross-checked against ladder-measured R_stab."
      - "Step-5 verdict per member (DECIDED with the group, or UNDECIDED with both bounds), for every member except N3."
      - "Sample size and smallest observed class density per (member,k) cell for the sampled cells."
      - "m_k(x) search transcript: which candidate a (or fallback polynomial) was selected for k=2,3,4, and the Rabin's-test verification steps."
      - "Generalised-sqrt-in-F_{p^k} cross-check against `fp_common.py`'s plain F_p `sqrt_mod` at k=1."
      - "Wall time, peak memory, and operation counts per stage, per cell."

  preregistered_prediction:
    - quantity: N1 R_k, all k
      value: "8, every k=1..4"
      formula: "|D_4|=8, H-MONO-0b3def STEP 1/5, d=1 by STEP 4."
      source: H-MONO-59f6a6 predictions item 2 / falsification_conditions item 5.
    - quantity: N2 (h_sep) R_1 vs R_2
      value: "4 then 2"
      formula: "G_arith=(Z/2)^2 (independent sign flips), G_geom=Z/2 (diagonal-only inertia, c a constant)."
      source: H-MONO-59f6a6 predictions item 1 / falsification_conditions item 1.
    - quantity: N2 R_3, R_4
      value: "4, 2"
      formula: "period-2 in k (d=2): sqrt(2) absent at odd k, present at even k."
      source: H-MONO-59f6a6 mechanism STEP 4.
    - quantity: N2-twin R_k, all k
      value: "4, every k=1..4"
      formula: "L=U=4 already at the arithmetic level (distinct branch divisors, individual inertia generators)."
      source: H-MONO-59f6a6 predictions item 3 / falsification_conditions item 2.
    - quantity: N4 R_1 vs R_3
      value: "3 then 1"
      formula: "Gal(F_{p^3}/F_p)=Z/3 (prime order); Frob^3=identity."
      source: H-MONO-59f6a6 predictions item 4 / falsification_conditions item 3.
    - quantity: N4 R_2, R_4
      value: "3, 3"
      formula: "period-3 in k (d=3): Frob^k generates all of Z/3 whenever 3 does not divide k."
      source: H-MONO-59f6a6 mechanism STEP 4 / assumptions.
    - quantity: N3 density profile, all k
      value: "1/24, 1/4, 1/8, 1/3, 1/4"
      formula: S_4 Chebotarev densities.
      source: H-MONO-59f6a6 heuristic context (instrument control, no verdict).
    - quantity: N5 verdict, all k
      value: "UNDECIDED, U=120, L=1"
      formula: "Step 5 interface rule; L never independently derived for a generic quintic."
      source: H-MONO-59f6a6 predictions item 6 / falsification_conditions item 6.
    - quantity: N5 density profile (reported, non-decisive)
      value: "1/120, 10/120, 15/120, 20/120, 20/120, 30/120, 24/120"
      formula: S_5 Chebotarev densities.
      source: H-MONO-59f6a6 statement (N5 forced_density_profile_reported_but_not_decisive).
    - quantity: sample-size control on N2
      value: "R_1=4 identically at exhaustive, S=1,000, and S=100,000"
      formula: "fixed-p blindness (O1) does not depend on sample size."
      source: H-MONO-59f6a6 predictions item 5 / falsification_conditions item 4.

  seeds_and_reproducibility:
    exhaustive_and_exact_parts_are_seed_free: >-
      N1/N2/N2-twin's k=1 exhaustive census and N4's exact single-point
      computation at every k are fully deterministic; two runs on the same
      code and inputs must produce bit-identical outputs.
    sampled_parts_seed_rule: >-
      All k>=2 sampling for N1/N2/N2-twin, all draws for N3/N5 at every k,
      and N2's k=1 sample-size-control sub-censuses, use the domain-string
      SHA256 rule specified in `census_procedure.k_gte_2_sampled_members`,
      with domain "EXP-MONO-a20e48/v1" for the primary run.
    master_seeds: [20260830, 20260831]
    master_seed_use: >-
      Identical convention to EXP-MONO-4c7479: the domain string is
      independent of a master seed for the base draw formula; the two master
      seeds label two INDEPENDENT REPLICATION RUNS via a domain suffix
      ("run-20260830" and "run-20260831"), so the two runs draw genuinely
      different samples. Only the sampled/random cells are expected to show
      run-to-run numeric spread (in the density histograms for N3/N5, and
      possibly in which specific base points a k>=2 sample happens to hit
      for N1/N2/N2-twin, though the FORCED group orders R_k themselves are
      expected to be run-invariant given the generous sample-size margin);
      any such spread is reported before any control-band verdict is read.

  replication:
    planned_runs: 2
    seeds: [20260830, 20260831]
    interpretation: >-
      All exact/exhaustive metrics (N1/N2/N2-twin k=1, N4 at every k, all
      structural/inertia bounds, all Step-5 verdicts) are seed-invariant by
      construction: any run-to-run difference in them is an implementation
      defect (non-determinism bug), not sampling noise, and voids the cell.
      The k>=2 sampled R_k values for N1/N2/N2-twin are expected to be
      run-invariant GIVEN the generous sample-size margin (see
      `census_procedure`), so a run-to-run difference there is treated as a
      HEUR-AG-2 falsification candidate, escalated to a tenfold-sample-
      increase check before being reported as a genuine finding. Only the
      N3/N5 density histograms are expected to show ordinary sampling
      variation between the two runs.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 2.0
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
    below_template_floor_rationale: >-
      Following the two sibling contracts' precedent:
      templates/research-records.md's stated budget floors
      (wall_clock_seconds_per_run >= 600, maximum_memory_gb >= 8) are sized
      to avoid truncating a real computation to an arbitrary small window.
      This contract sets a smaller wall-clock cap (1800s, at the sibling
      EXP-MONO-2a13d7's level, above the 600s single-tool-window floor) and
      a much smaller memory cap (1GB) because, per `cost_note` below, the
      actual work is comfortably a small fraction of that budget; the CPU
      hour figure (2.0) is set somewhat above the two siblings' own figures
      (0.75, 1.0) to cover this contract's added complexity (generic
      F_{p^k} arithmetic through k=4, a labelling control, a sample-size
      control, and two random-polynomial density controls at every k rather
      than one), not because the estimate below suggests it is needed.
    cost_note: >-
      CONFIRMING THE SOURCE PROPOSAL'S OWN "under a minute per cell" CLAIM
      EXPLICITLY, WITH ONE DISCLOSED REVISION. The proposal's cost model
      (`target_complexity.time_exponent`) states the full protocol is
      affordable at "p=101, k<=4, S=10^5" in under a minute per cell; this
      contract confirms that order of magnitude at p=211 with the SMALLER
      S=10,000 (not 10^5) for the k>=2 sampled cells on N1/N2/N2-twin --
      REVISED DOWN from the proposal's own upper figure because 10,000 is
      already generously above the coupon-collector floor for groups of
      order at most 8 (see `census_procedure`), and using 10^5 uniformly
      would multiply the sampled-cell cost tenfold for no metric this
      contract needs; the sample-size CONTROL specifically (on N2 at k=1)
      still exercises S=100,000 once, as required. Total operation count,
      by member: (a) N1/N2/N2-twin k=1 exhaustive: N1 has a 2-D base
      (p^2=44,521 points), N2/N2-twin have a 1-D base (p=211 points each),
      total ~= 44,943 points, each O(1) F_p arithmetic (a handful of
      multiplications and at most one modular sqrt), identical order of
      cost to the sibling contracts' own k=1 census; (b) N1/N2/N2-twin
      k=2,3,4 sampled: 3 members x 3 k-values x 10,000 = 90,000 samples,
      each O(1) arithmetic in F_{p^k} (k<=4: polynomial multiplication mod
      m_k(x) of degree <4, i.e. at most a handful of integer multiplications
      per ring operation, plus one generalised-Tonelli-Shanks sqrt costing
      O(log(p^k)) ring squarings, i.e. at most ~30 ring multiplications per
      sample in the worst case, k=4); (c) N2's sample-size control: an
      extra 1,000+100,000 = 101,000 samples at k=1 only (cheap F_p
      arithmetic, no F_{p^k} tower needed); (d) N1/N2/N2-twin labelling
      control: a second pass over the SAME k=1 exhaustive base (~44,943
      points again) under the reverse-lexicographic convention, plus N4's
      trivial relabelling; (e) N3/N5 draws: 2 members x 4 k-values x 2,000
      draws = 16,000 draws, each requiring a distinct-degree factorization
      of a degree-4 or degree-5 polynomial over F_{p^k} via repeated
      squaring of Y^{(p^k)^i} mod h(Y) -- at most ~2 squaring rounds (since
      the distinct-degree test only needs i=1,2 for degree<=5) each costing
      O(deg^2)~25 multiplications, plus O(log(p^k))~30 squarings for the
      exponentiation itself, i.e. roughly 750 ring operations per draw in
      the worst case (k=4, degree 5); (f) N4: 4 exact computations total,
      negligible. Grand total is on the order of 10^5-10^6 elementary
      modular-arithmetic operations across the whole battery, each a
      handful of Python-level integer multiplications -- comfortably
      seconds to low tens of seconds of pure Python at these sizes, NOT
      minutes; the 1800s-per-run cap and 2.0 total-CPU-hour budget (2 runs x
      1800s = 1 hour, well above this estimate) are generous margins, not
      tight estimates, mirroring both sibling contracts' own framing.
    scoping_confirmation: >-
      Per the task's own instruction to exercise judgment on anything
      genuinely oversized: NOTHING in this battery, as scoped (including the
      N5 scoping-down to a quintic rather than a literal degree-100 object),
      exceeds the sibling contracts' own budget order of magnitude. The one
      genuine cost/feasibility judgment call in this contract is N5's
      scoping-down itself, which is a FEASIBILITY decision (fibre-size
      incompatibility with a degree-100 group, per H-MONO-59f6a6
      `test_boundary`), not a cost-driven trim -- the literal degree-100
      construction, were it representable at all on a small fibre, would
      not obviously have cost more than the quintic does per sample.

  stage_order_and_terminating_stage:
    principle: Cheapest decisive gate first.
    stage_0:
      name: >-
        frozen battery table (emitted above, before any code runs), p/c
        verification, and m_k(x) search transcript for k=2,3,4
      compute: "none to seconds"
      terminates_the_run_if: >-
        Any p/c verification fails (p not prime, p not 1 mod 3, or c not
        simultaneously a non-square and non-cube mod p), or Rabin's
        irreducibility test fails to find any usable m_k(x) within the
        stated search bound. Instrument outcome, never mathematical
        evidence.
    stage_1:
      name: k=1 census on all six members, plus the reproduction control
      compute: "seconds to low minutes; see cost_note"
      terminates_a_members_interpretation_if: >-
        The N1 reproduction control fails to reproduce EXP-MONO-4c7479's
        histogram exactly: N1's (and only N1's) interpretation is void until
        resolved; N2/N2-twin/N3/N4/N5 proceed independently.
    stage_2:
      name: k=2,3,4 base-change ladder on all six members
      compute: "seconds to low minutes; see cost_note"
      terminates_nothing_by_default: >-
        Every result is reported regardless of whether it matches the
        forced prediction; a mismatch is a falsifier (see
        H-MONO-59f6a6 falsification_conditions), not a stopping condition,
        EXCEPT the N1-drop case, which triggers the escalation rule in
        `stopping_rules` below rather than a routine report.
    stage_3:
      name: >-
        hand-derived structural upper bound U and inertia lower bound L per
        member (already recorded in `battery` above; this stage is the
        Executor's TRANSCRIPTION and independent re-verification of those
        derivations into the run's required artifacts, not a fresh
        derivation)
      compute: none (algebraic, recorded, not computed)
    stage_4:
      name: Step-5 verdict per member (except N3), plus the sample-size and labelling controls
      compute: "seconds"

  stopping_rules:
    - This contract is now approved, frozen and execution_authorized (approved_by: coordinator, 2026-08-30; see `coordinator_approval_rationale`). Do not execute any FUTURE amendment to this contract unless it is likewise separately reviewed, approved, frozen and authorized.
    - Stop Stage 0 if p/c verification or the m_k(x) search fails; report as infrastructure signal.
    - Stop N1's interpretation (only) if the reproduction control fails against EXP-MONO-4c7479.
    - >-
      IF N1 IS OBSERVED TO DROP AT ANY k (R_k < 8 for any k=1..4) WITH THE
      REPRODUCTION AND LABELLING CONTROLS PASSING: do not report this as a
      routine negative. Report it as the run's headline finding, per
      H-MONO-59f6a6's falsification_conditions, and escalate to independent
      review-adversarial per AGENTS.md rule 12 before any interpretation of
      any other battery member is finalized. Do not allow this record's own
      conclusion about the protocol's general validity to be used to
      characterize the drop as a mere instrument quirk without that review.
    - Stop on any budget breach, reporting it as infrastructure signal.

  invalidation_rules:
    - Any execution while `frozen`, `execution_authorized`, or `evidence_eligible` is false.
    - Any missing p/c verification transcript, m_k(x) search transcript, or seed record.
    - Any run manifest lacking field_bits for the tested prime (p=211, 8 bits) and, where relevant, the F_{p^k} extension degree k.
    - Any cell reporting R_k without its accompanying excluded-strata count (N1/N2/N2-twin's ramification exclusions) where applicable.
    - Any N5 report omitting either the forced UNDECIDED verdict or the (non-decisive) density histogram.
    - >-
      Any post-hoc change to a pre-registered forced value, sample size, or
      exclusion rule after any Stage-1 or Stage-2 number has been observed.
      Such a change requires a versioned protocol amendment marked
      exploratory_only and is never a silent edit.
    - Any report of N3's density match as a Step-5 verdict (DECIDED or UNDECIDED); N3 carries no verdict by design.
    - Any use of the ad hoc `Fp2`/`Fp4` tower classes for a k=2,3,4 primary computation instead of the generic F_p[x]/(m_k(x)) representation required by this contract.

  success_criterion: >-
    APPROVED AND EXECUTION_AUTHORIZED; no run has happened yet, so no
    outcome is reported here. When executed, its positive disposition is:
    Stage 0 passes (p, c, and
    every m_k(x) verified); the N1 reproduction control passes and N1 shows
    R_k=8 at every k; N2 shows R_1=4, R_2=2, R_3=4, R_4=2 exactly; N2-twin
    shows R_k=4 at every k; N4 shows R_1=3, R_2=3, R_3=1, R_4=3 exactly; N3
    and N5 reproduce their respective S_4/S_5 Chebotarev density profiles
    within band at every k; N5's Step-5 verdict is UNDECIDED at every k with
    both bounds reported; the sample-size control on N2 shows R_1=4
    unchanged across exhaustive/1,000/100,000; the labelling control agrees
    for N1/N2/N2-twin/N4. THAT DISPOSITION SUPPORTS EXACTLY the scoped
    statement in `claim_ceiling` and nothing more.

  falsification_criterion: >-
    Any of the seven items in H-MONO-59f6a6's `falsification_conditions`:
    (a) h_sep failing 4->2 at k=2; (b) N2-twin dropping at any k; (c) N4
    failing to reach 1 at k=3; (d) N2's R_1 changing with sample size; (e)
    N1 dropping at any k (the most consequential, escalated per
    `stopping_rules`); (f) N5 returning DECIDED at any k; (g) any battery
    member failing to be constructible or classifiable (infrastructure
    signal, never evidence, per AGENTS.md rule 3).

  outcomes:
    no_execution_authorization: "SUPERSEDED BY APPROVAL 2026-08-30 (see `coordinator_approval_rationale`); retained to show the pre-approval disposition. Before approval: no run, no observation, no evidence, no inference."
    future_controlled_confirmation_toy: >-
      The expected outcome per the derivations recorded in `battery`: every
      forced R_k value and verdict matches, corroborating (not proving --
      the proof is the hand derivation) H-MONO-59f6a6 at toy scale, p=211
      only, on the six frozen battery objects.
    future_deviation_found: >-
      Any falsification_criterion item other than (e) triggers with controls
      passing. Escalated to independent review-adversarial per AGENTS.md
      rule 12 before any hypothesis-status change is considered; not
      reported as a routine negative.
    future_n1_drop_found: >-
      Falsification item (e). Per `stopping_rules`, reported as the run's
      headline finding, with both candidate readings (genuine refutation of
      H-MONO-0b3def STEP 4, versus a defect in this record's own ladder
      machinery) investigated and distinguished before any status change to
      any record is considered.
    instrument_failure: >-
      N3's density profile failing to match S_4 Chebotarev law, or the
      labelling/reproduction controls failing. Inconclusive instrument
      signal; never evidence.
    infrastructure_or_integrity_failure: >-
      Stage-0 verification failure, budget breach, or non-terminating
      search. Never mathematical evidence (AGENTS.md rule 5).

  scale_relevance:
    tier: toy
    justification: >-
      p=211 only; six frozen battery objects only; degrees at most 5; groups
      of order at most 120 (N5's structural bound, itself unproven as a
      lower bound). A toy run checks specific numerical consequences of
      hand-derived algebra rather than establishing anything by scale.
      Nothing here transfers to cryptographic-scale p, and nothing here
      addresses any curve, cover, or prime outside this battery.
    correspondence: null

  tail_checks:
    - >-
      Whichever of N1/N2/N2-twin's k=4 sampled cells shows the smallest
      observed class count (out of the S=10,000 sample) is reported
      explicitly, as the honest tail check on HEUR-AG-2's coupon-collector
      margin at the largest tested field.
    - >-
      N5's rarest observed cycle-type frequency (expected near the identity
      class, forced density 1/120) at S=2,000 draws is reported explicitly,
      as the tail check on whether the density estimate itself is
      well-resolved at this sample size (independent of, and not load-
      bearing for, the forced UNDECIDED verdict).

  future_work:
    - >-
      The idea's literal N5 (a genuine degree-100 sparse-class permutation
      representation, ~100 realized classes each of density ~1/100),
      untested here; would require either a fibre of size >=10 or a
      materially different, non-permutation notion of "realized class" than
      this battery's uniform subgroup-generation design uses.
    - >-
      Extending the ladder to k=5,6 to test whether any battery member's
      period assumption (N2: period 2, N4: period 3) continues to hold, or
      whether a longer period exists that this contract's k<=4 range cannot
      see.
    - >-
      Should Stage 1/2 reveal an N1 drop, a dedicated proof-of-concept
      re-derivation task checking H-MONO-0b3def's STEP 2-5 specifically
      against this record's independently-built F_{p^k} machinery, before
      any hypothesis-status change, per the Coordinator's proof-oriented
      dispatch gate (agents/coordinator.md).
    - >-
      A genuine Hilbert-irreducibility-based derivation of L for the N5-type
      "generic polynomial" construction, which would let a future record
      test whether the protocol CAN reach DECIDED on a large, generic
      Galois group once the missing proof is supplied -- this record only
      tests that it correctly refuses to do so WITHOUT that proof.

  required_artifacts:
    - Frozen approved specification with a freeze receipt binding its SHA-256.
    - Stage-0 transcript: p/c verification, and the m_k(x) search log for k=2,3,4 (candidate `a` values tried, Rabin's-test intermediate results, winning polynomial).
    - >-
      Per-base-point (or per-draw) classification log, RETAINED IN FULL, for
      every (member,k) cell: for N1/N2/N2-twin, every enumerated or sampled
      base point's coordinates, computed permutation, and stratum
      membership; for N4, the single exact computation per k; for N3/N5,
      every draw's coefficients and classified cycle type.
    - R_k tables per member per k, with generator lists for N1/N2/N2-twin/N4.
    - Structural upper bound U and inertia lower bound L record per member, transcribed from `battery` above and independently re-verified by the Executor.
    - Step-5 verdict per member (except N3), with both bounds where UNDECIDED.
    - N3 and N5 density-histogram tables against their S_4/S_5 Chebotarev comparators.
    - Sample-size control output (N2, exhaustive vs S=1,000 vs S=100,000).
    - Labelling-control output (second labelling's generated group, per member, with isomorphism/order-agreement flag).
    - Reproduction-control output (N1 at k=1 vs EXP-MONO-4c7479's committed histogram).
    - Generalised-sqrt-in-F_{p^k} cross-check output against `fp_common.py`'s `sqrt_mod` at k=1.
    - >-
      Run manifests carrying field_bits, git commit, dirty-tree state,
      environment, resolved model identifier and probe status, per run.
    - Command, stdout, stderr, timings, peak RSS, and an execution report.
    - Snapshot archive followed by independent validation and red-team review.

  approval_requirements:
    - >-
      Coordinator confirms this contract does not fall under GOAL-MONO-001's
      `next_action` prohibition on commissioning a generic-fibre census as a
      RELATION-RATE PROBE (see `batch_id_note`); this contract is a pure
      protocol/instrument test and asserts no relation-rate content.
    - >-
      GOAL-MONO-001 is `paused` with its campaign budget exhausted;
      execution requires either a fresh budget grant from GOAL-PATH-001 and
      a Coordinator batch assignment, or approval through the standalone
      experiment lifecycle exactly as for EXP-MONO-4c7479 and EXP-MONO-2a13d7.
    - >-
      Independent review confirms the generic F_p[x]/(m_k(x)) representation
      and its Frobenius/sqrt routines are actually what the submitted
      implementation uses for k=2,3,4 (not a reversion to the ad hoc
      Fp2/Fp4 towers).
    - >-
      Independent review confirms the fixed-labelling convention (lexicographic on coefficient tuples) is applied consistently across k for every member with a genuine fibre.
    - >-
      Independent review confirms N5's Step-5 verdict machinery genuinely
      never derives or uses an independent L (i.e. the UNDECIDED verdict is
      not an artifact of an under-powered census that would flip to DECIDED
      with more samples, but a structural consequence of L being undefined
      by design).
    - >-
      Independent review confirms the N1 reproduction control was actually
      run against EXP-MONO-4c7479's own committed artifacts, not against a
      freshly recomputed reference value.

