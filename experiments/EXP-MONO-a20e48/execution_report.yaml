execution_report:
  experiment_id: EXP-MONO-a20e48
  handoff_id: TASK-20260830-34067c
  hypothesis_id: H-MONO-59f6a6
  implementation_commit: e7f5f623b2ce42f6f56e37365ea27f2586fbab9c
  implementation_commit_note: >-
    Commit checked out at run start for both runs (repository dirty with
    unrelated concurrent-session files outside this task's write scope;
    see each run manifest's code.dirty_note). This report and the run
    artifacts it cites are not yet committed by the Coordinator; the
    Coordinator's snapshot commit will record the final SHA that includes
    these files.

  protocol_deviations:
    - >-
      m_4(x)'s search required the FALLBACK branch (x^4 - x - 7), not a
      binomial x^4-a: all 50 binomial candidates (a=2..51) failed Rabin's
      irreducibility test, and the fallback found x^4-x-7 as its 7th
      candidate (a=1,b=7). This is the contract's own stated CONTINGENCY
      branch, reported per its instruction, not a silent substitution. See
      implementation.md and each run's raw-result.json
      stage0.m_k_search["4"] for the full 57-candidate transcript.
    - >-
      The frozen contract's `field_arithmetic_representation` does not
      spell out, verbatim, how N1/N2/N2-twin's fibre coordinates (which may
      need a field extension beyond a given ladder step's own base field
      F_{p^k}) compose with the base-change ladder. This Executor's
      disclosed resolution -- build a self-contained quadratic-tower-of-
      quadratic-tower ON TOP of each ladder step's own F_{p^k} (never
      embedding across different ladder levels k1 != k2) -- is documented
      in implementation.md and is, in the Executor's reading, consistent
      with the contract's explicit statement that no cross-level embedding
      is needed; it is flagged here for independent review rather than
      treated as an unstated implicit requirement.
    - >-
      Measured wall-clock (~450-460s per run) materially exceeds the
      contract's own cost_note estimate ("seconds to low tens of seconds").
      Both runs completed well within the 1800s budget cap (no stopping
      rule triggered); the excess is concentrated in N3/N5's distinct-
      degree factorization at k=3,4 (large modular-exponentiation exponents
      over a coefficient field of size up to p^4, costlier in pure Python
      than the contract's estimate assumed). Reported as a measured fact,
      not a violation.
    - >-
      Per the contract's own scoping-down disclosure (already recorded in
      the frozen contract itself, not introduced here): N5 is a generic
      QUINTIC (S_5, order 120), not the source idea's literal degree-100
      construction. This Executor introduced no further scoping change.

  runs:
    completed:
      - RUN-MONO-a20e48-1
      - RUN-MONO-a20e48-2
    invalid: []
    failed: []

  stage0:
    p_c_verification:
      p: 211
      prime_verified: true
      odd_verified: true
      p_mod_3: 1
      p_mod_3_eq_1_verified: true
      p_mod_8: 3
      c: 2
      two_pow_105_mod_211: 210
      two_is_nonsquare_verified: true
      two_pow_70_mod_211: 196
      two_is_noncube_verified: true
      note: >-
        All independently re-derived by this Executor's own code (trial
        division for primality; direct modular exponentiation for the
        Euler's-criterion and cube-subgroup checks), not read off the
        spec's worked numbers. Identical across both runs (Stage 0 is
        seed-free).
    m_k_search:
      k1: {kind: trivial, note: "F_p itself, m_1(x)=x"}
      k2: {kind: binomial, a: 2, n_candidates_tried: 1}
      k3: {kind: binomial, a: 2, n_candidates_tried: 1}
      k4: {kind: fallback, a: 1, b: 7, n_candidates_tried: 57, note: "binomial branch exhausted (50 tries), fallback's 7th candidate won"}
    sqrt_cross_check_k1_vs_fp_common:
      checked: 211
      mismatches: 0
      pass: true
    frobenius_two_ways_cross_check:
      k1: {all_match: true}
      k2: {all_match: true}
      k3: {all_match: true}
      k4: {all_match: true}
    all_pass: true
    identical_across_both_runs: true

  battery_results:
    N1:
      description: "m=3 Semaev symmetric-base cover, curve (A,B)=(1,1), p=211"
      forced_R_k: {k1: 8, k2: 8, k3: 8, k4: 8}
      observed_R_k_run1: {k1: 8, k2: 8, k3: 8, k4: 8}
      observed_R_k_run2: {k1: 8, k2: 8, k3: 8, k4: 8}
      forced_values_met: true
      N1_DROP_OBSERVED: false
      reproduction_control:
        reference: "EXP-MONO-4c7479/runs/RUN-MONO-4c7479-20260830 (p=211,A=1,B=1)"
        reference_histogram: {identity: 6105, sigma_i: 11100, sigma1_sigma2: 4950, block_swap_involution: 11100, four_cycle: 11055}
        observed_histogram_both_runs: {identity: 6105, sigma_i: 11100, sigma1_sigma2: 4950, block_swap_involution: 11100, four_cycle: 11055}
        match: true
        note: EXACT match, not merely within-tolerance; k=1 exhaustive census is seed-free so both runs computed the identical value.
      labelling_control:
        k1_group_order_reverse_lex: 8
        matches_primary: true
      structural_upper_bound_U: "D_4, order 8 (transcribed from battery.N1, imported verbatim from H-MONO-0b3def STEP 1; not re-derived)"
      inertia_lower_bound_L: "D_4, order 8 (transcribed from battery.N1, imported verbatim from H-MONO-0b3def STEP 5; not re-derived)"
      independent_spot_check: >-
        The k=1 exhaustive-census-generated group (order 8) is
        computationally NON-ABELIAN with element-order profile
        [1,2,2,2,2,2,4,4] -- matching D_4's own conjugacy-class order
        profile exactly (identity, five order-2 elements, two order-4
        elements) and ruling out every abelian order-8 group
        (Z/8, Z/4xZ/2, (Z/2)^3). This is a computational consistency
        check with D_4, not an independent re-derivation of the D_4 claim
        itself (which remains H-MONO-0b3def's).
      step5_verdict: "DECIDED (D_4), since L=R_stab=U=8 at every tested k"

    N2:
      description: "h_sep(Y)=(Y^2-e)(Y^2-2e), c=2, p=211"
      forced_R_k: {k1: 4, k2: 2, k3: 4, k4: 2}
      observed_R_k_run1: {k1: 4, k2: 2, k3: 4, k4: 2}
      observed_R_k_run2: {k1: 4, k2: 2, k3: 4, k4: 2}
      forced_values_met: true
      sample_size_control:
        exhaustive_group_order: 4
        S_1000_group_order: 4
        S_100000_group_order: 4
        R1_consistent: true
      labelling_control:
        k1_group_order_reverse_lex: 4
        matches_primary: true
      structural_upper_bound_U: "(Z/2)^2, order 4 (transcribed; no swap symmetry between a(e)=e and 2e)"
      inertia_lower_bound_L_arithmetic: "Z/2, order 2 (transcribed; diagonal-only inertia at e=0 and e=infinity)"
      geometric_bound_U_geom_L_geom: "Z/2, order 2 (transcribed; sqrt(2) becomes a constant once adjoined, tight geometric bound)"
      step5_verdict: >-
        DECIDED at the GEOMETRIC level (Z/2, since U_geom=L_geom=2, matching
        R_stab at even k). At the ARITHMETIC level (k odd, R_k=4), L=2 !=
        U=4 -- the arithmetic bound alone is UNDECIDED-between-2-and-4 at
        odd k, exactly the central contrast this member exists to
        demonstrate (this is the intended outcome per H-MONO-59f6a6, not an
        instrument failure).

    N2_twin:
      description: "(Y^2-e)(Y^2-(e+1)), true-(Z/2)^2 control, p=211"
      forced_R_k: {k1: 4, k2: 4, k3: 4, k4: 4}
      observed_R_k_run1: {k1: 4, k2: 4, k3: 4, k4: 4}
      observed_R_k_run2: {k1: 4, k2: 4, k3: 4, k4: 4}
      forced_values_met: true
      labelling_control:
        k1_group_order_reverse_lex: 4
        matches_primary: true
      structural_upper_bound_U: "(Z/2)^2, order 4"
      inertia_lower_bound_L: "(Z/2)^2, order 4 (already at the arithmetic level; distinct branch divisors e=0, e=-1 give independent generators)"
      step5_verdict: "DECIDED ((Z/2)^2), since L=R_stab=U=4 at every tested k, with no constant-field correction needed (d=1)"

    N4:
      description: "Y^3-2 over F_211, single exact point"
      forced_R_k: {k1: 3, k2: 3, k3: 1, k4: 3}
      observed_R_k_ascending_lex_run1: {k1: 3, k2: 3, k3: 1, k4: 3}
      observed_R_k_ascending_lex_run2: {k1: 3, k2: 3, k3: 1, k4: 3}
      observed_R_k_descending_lex_labelling_control: {k1: 3, k2: 3, k3: 1, k4: 3}
      forced_values_met: true
      cube_root_verification: "all three found roots independently verified to cube to 2 in F_{211^3}, both runs"
      structural_upper_bound_U: "Z/3, order 3 (field-theory bound: degree-3 binomial's Galois group over a field with cube roots of unity divides 3)"
      inertia_lower_bound_L: "3, established by field theory alone (p=1 mod 3, c a verified non-cube force [F_p(beta):F_p]=3 exactly)"
      step5_verdict: "DECIDED (Z/3), L=U=3 exactly; G_geom=1 (trivial, pure constant-field artifact, d=3) -- the 'extreme case' per the source proposal"

    N3:
      description: "Random monic quartic, S_4 density instrument control (no verdict)"
      verdict_machinery: "NOT APPLIED, per contract"
      density_vs_S4_within_3se:
        run1: {k1: true, k2: true, k3: true, k4: true}
        run2: {k1: true, k2: true, k3: true, k4: false}
      run2_k4_out_of_band_detail: >-
        class "1^4" (forced density 1/24): observed 56/2000 vs expected
        83.3, deviation -3.06 se -- just outside the 3-se band. Recorded as
        ordinary sampling noise (see run2 manifest.yaml anomalies), not an
        instrument failure: 40 independent 3-se checks were run across
        both replications (5 classes x 4 k-values x 2 runs), and a single
        marginal excursion is unsurprising under the null.
      identical_object_null_control: >-
        Both seed-parity halves (1000 draws each) at k=1, run1 and run2,
        independently reproduce S_4 density within 3se for every class
        (see raw-result.json N3.identical_object_null_control per run) --
        no separation detected between the two halves of the same
        distribution, as required.

    N5:
      description: "Random monic quintic, S_5 density instrument (scoped down from the source idea's degree-100 construction)"
      forced_verdict_all_k: UNDECIDED
      observed_verdict_run1: {k1: UNDECIDED, k2: UNDECIDED, k3: UNDECIDED, k4: UNDECIDED}
      observed_verdict_run2: {k1: UNDECIDED, k2: UNDECIDED, k3: UNDECIDED, k4: UNDECIDED}
      forced_verdict_met: true
      U: 120
      L: 1
      density_vs_S5_within_3se:
        run1: {k1: true, k2: true, k3: true, k4: true}
        run2: {k1: true, k2: true, k3: true, k4: true}
      note: >-
        Verdict is UNDECIDED at every k regardless of density-match quality,
        per the contract's forced Step-5 refusal (L is never independently
        derived for a generic quintic, by design). No good density match
        was allowed to, or did, change this.

