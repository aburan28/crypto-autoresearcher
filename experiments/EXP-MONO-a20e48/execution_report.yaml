      labelling control agreeing). Per the handoff's critical instruction,
      this section exists regardless of outcome: had a drop been observed,
      it would have been reported here as the run's headline finding with
      both candidate readings (genuine anomaly vs. ladder-code defect)
      presented unresolved. No such escalation is triggered by this run.

  observations:
    - >-
      Frozen prediction reference: H-MONO-59f6a6 predictions items 1-6 and
      falsification_conditions items (a)-(g) (see specification.yaml
      preregistered_prediction). Every forced numeric value listed there
      was measured and matched exactly, in both replication runs, with all
      required controls (reproduction, sample-size, labelling, identical-
      object-null) passing. These are observations only; no verdict on
      H-MONO-59f6a6 is rendered by this report -- that judgment belongs to
      the Coordinator and independent reviewers.
    - >-
      Comparison against the frozen preregistered_prediction table
      (specification.yaml): all ten listed quantities matched their stated
      value exactly in both runs. No tail-check or control item failed to
      meet its stated tolerance except the single N3 k=4 (run2) marginal
      excursion noted above, which the contract's own instrument-control
      framing (no verdict machinery for N3) already anticipates as possible
      ordinary noise.

  anomalies:
    - >-
      m_4(x) required the fallback search branch (see protocol_deviations
      and stage0.m_k_search above) -- disclosed contingency, not a defect.
    - >-
      N3 k=4, run2: "1^4" class density 3.06 se from forced, marginally
      outside the 3-se band (see battery_results.N3 and run2's
      manifest.yaml). Ordinary sampling noise on a no-verdict instrument
      control; recorded per AGENTS.md rule 8, not silently absorbed.
    - >-
      An implementation bug was found and fixed BEFORE any official run:
      the per-ladder-step "level 2" tower's Frobenius formula
      (`tower.Level2.frob`) initially used the wrong exponent (the level-1
      field's own order instead of the ladder step's base-field order),
      which produced an automorphism of order 2 instead of the required
      order 4 and failed a ring-homomorphism self-test. Caught by that
      self-test, fixed, and re-verified before any battery member was
      classified. See implementation.md for the derivation. No official
      run was affected (the bug was caught during development, prior to
      RUN-MONO-a20e48-1).
    - >-
      Measured wall-clock (~450-460s/run) materially exceeds the frozen
      contract's own "seconds to low tens of seconds" cost estimate,
      though well within the 1800s cap. See protocol_deviations above.

  artifact_paths:
