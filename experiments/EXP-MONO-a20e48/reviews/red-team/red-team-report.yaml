        verify.py -- independent raw-log tally + from-scratch subgroup
        closure + element-order computation; used to re-derive N1/N2/
        N2-twin's R_k directly from per_base_point_log/*.jsonl.
      - >-
        bugtest/tower_buggy.py -- reconstructs the literally-disclosed bug
        (Level2's automorphism exponent uses q1=q0^2 instead of q0).
      - >-
        bugtest/tower_identity_bug.py -- maximally broken Level2.frob
        (identity); the proves-too-much / silent-coincidence object for N1.
      - >-
        bugtest/tower_conj_bug.py -- maximally broken Level1.conj
        (identity); the proves-too-much object for N2, "always report no
        drop".
      - >-
        bugtest/run_bug_n1.py, run_bug_n1_id.py, run_bug_n1_k1.py,
        run_bug_n2.py -- drivers exercising the real seeded sampling
        procedure against both the real and mutated tower code.

