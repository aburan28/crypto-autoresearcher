experiment:
  id: EXP-ECDLP-24fd38
  hypothesis_id: H-ECDLP-bd61aa
  version: 1
  title: >-
    The same-advice control - kangaroo on the promised interval as the named
    null object for the advised four-list route, with the time axis shown
    DEGENERATE over the asserted range, the memory axis carrying the whole
    claim, and a proves-too-much control on XOR that the argument must pass
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260904-ae82ce

  record_kind: static_symbolic_control
  record_kind_note: >-
    AN AUDIT OF A COST CLAIM, NOT A MEASUREMENT, and specified as one. There
    is no instance, no run and no implementation of either algorithm. What is
    CHECKED is a committed conditional exponent; the REFERENCE is the
    cheapest known algorithm consuming the identical resource; the FAILURE
    CONDITIONS are stated below. It carries the same control obligations a
    measurement would - a named null, a demonstrated dynamic range, an
    explicit non-degeneracy check, a decision rule - because a conditional
    exponent is an artifact until the identical resource has been handed to
    the simplest competitor.

  objective: >-
    Discharge a declared open obligation of this lane: compare the advised
    four-list route against the cheapest algorithm consuming the SAME
    per-target advice - a kangaroo walk on the interval that advice defines -
    on the two typed axes both algorithms have. Emit the resulting
    comparison table, the certificate row it justifies, and, as a first-class
    output, the finding that the TIME axis is a width-zero discriminator over
    the range where the input exponent is actually asserted. This contract is
    DRAFT and confers no execution authority.

  artifact_under_check: >-
    The committed exponent for the advised four-list route,
    N^{max((1+mu)/4, (1-mu)/2)} in both time and peak memory, asserted by its
    source record FOR ALL mu in [0,1/3], where mu*log2(N) top bits of the
    target logarithm are supplied.

  reference_standard: >-
    Kangaroo (Pollard lambda / Gaudry-Schost / Galbraith-Ruprai) on the
    interval W of size N^{1-mu} that the same advice defines:
    Theta(N^{(1-mu)/2}) group operations with O(log N) memory using
    distinguished points, parallelizing with total work unchanged. Only the
    exponent 1/2 in |W| is load-bearing; the constants are RECALLED, opened
    by no agent in this program, and are not used in any comparison.

  preregistered_prediction:
    quantity: >-
      Delta_T(mu) = (four-list time exponent) - (kangaroo time exponent), and
      Delta_M(mu) = (four-list memory exponent) - (kangaroo memory exponent),
      both dimensionless rational exponents of N, tabulated at
      mu in {0, 1/6, 1/3, 1/2, 2/3, 1}.
    formula: >-
      On the ASSERTED range mu in [0,1/3]: Delta_T(mu) = 0 EXACTLY, and
      Delta_M(mu) = max((1+mu)/4, (1-mu)/2) = (1-mu)/2, strictly positive,
      taking 1/2 at mu = 0, 5/12 at mu = 1/6 and 1/3 at mu = 1/3.
      For mu in (1/3,1] the arithmetic gives Delta_T(mu) = (3mu-1)/4 and
      Delta_M(mu) = (1+mu)/4, but these rows are EMITTED AS UNASSERTED
      because the input exponent is quantified only over [0,1/3].
      On F_2^{3m} with random-oracle lists: the four-list join at 2^{m} beats
      the cheapest same-resource two-list method at 2^{3m/2}, a gain of
      2^{m/2}, so the control PASSES the four-list machinery there.
    source: >-
      Elementary arithmetic of the max, verified symbolically in exact
      rationals. The four-list column is CONSUMED from its committed source
      record, whose statement and quantifier were read verbatim in this
      session. The kangaroo column's exponent is recalled textbook material.

  inputs:
    mu_grid: "{0, 1/6, 1/3, 1/2, 2/3, 1}"
    asserted_range: "[0, 1/3], read verbatim from the input record's own quantifier"
    axes: "time exponent of N; memory exponent of N; resource = per-target advice in bits of the logarithm"
    excluded_axes: "per-group preprocessing; multi-target reuse of a join output; data/query, since neither algorithm issues queries"
    arithmetic: "exact rationals, zero tolerance, no floating point anywhere"

  independent_variables:
    - "mu, the advice fraction, over the six-row grid"
    - "axis: time versus memory"
    - "ambient object: prime-order group G (interval promise) versus F_2^{3m} with random-oracle lists (subgroup-coset promise)"
    - "assertion status: within the input record's quantifier range versus extrapolated beyond it"

  null_object:
    name: >-
      KANGAROO ON W - the cheapest known algorithm consuming the IDENTICAL
      resource. This record IS the null-object control for the advised
      four-list branch; the null is the deliverable, not a formality.
    construction: >-
      Given ADVICE(mu), the top mu*log2(N) bits of the target logarithm, the
      unknown lies in a known interval W of size N^{1-mu}. Kangaroo walks two
      herds inside W with distinguished points and finds the logarithm in
      Theta(sqrt(|W|)) = Theta(N^{(1-mu)/2}) group operations with O(log N)
      memory. It consumes exactly the advice and nothing else - no oracle, no
      preprocessing, no additional promise - which is what makes it the
      control rather than merely a comparator. Pollard rho and BSGS, against
      which this lane's prior verdicts compared, do NOT consume the advice
      and are therefore not controls for a conditional route at all.
    non_degeneracy_check: >-
      PERFORMED, AND IT RETURNED A NEGATIVE RESULT ON ONE AXIS, WHICH IS
      REPORTED RATHER THAN GLOSSED. The question is whether the null can
      differ from the treatment on each axis over the range where the input
      is asserted.
      TIME AXIS: NO. On mu in [0,1/3], max((1+mu)/4,(1-mu)/2) = (1-mu)/2
      identically, so Delta_T is FORCED TO ZERO across the entire asserted
      range. A discriminator whose value cannot vary cannot fire, and
      "the exponents agree" is therefore not a finding but a width-zero band.
      This contract computes and publishes Delta_T anyway, labelled
      DEGENERATE, precisely so no later reader mistakes the tie for evidence.
      MEMORY AXIS: YES. Delta_M = (1-mu)/2 on that range, strictly positive
      and varying from 1/2 down to 1/3, so the memory comparison has a real
      band and can fail (a measured or re-derived Delta_M of 0 anywhere would
      falsify the dominance claim outright). THE DOMINANCE CLAIM THEREFORE
      RESTS ENTIRELY ON THE MEMORY AXIS and is stated as memory-strict /
      time-tied. This check is a BLOCKING Stage 1 obligation and its result
      is a primary metric, not a footnote.
    dynamic_range_demonstration: >-
      THE XOR PROVES-TOO-MUCH CONTROL, which gives the same-resource argument
      a known-NONZERO answer on one object and a known-ZERO answer on the
      other, so the instrument is shown able to return both. On F_2^{3m} with
      random-oracle lists and the prefix quotient as the resource, the
      cheapest two-list consumer of that resource is 2^{3m/2} while the
      four-list join is 2^{m}: the four-list structure contributes a factor
      2^{m/2} and the control MUST PASS it. On the prime-order group the same
      argument returns a contribution of exactly zero on time. An argument
      that returned "dominated" on BOTH objects would have proved too much
      and would be wrong somewhere it has not been read closely enough.
      SECOND RUNG: the guessed-bits variant, where kangaroo with k guessed
      top bits costs sqrt(N * 2^k), i.e. exponent 1/2 + mu/2, strictly worse
      than rho for mu > 0. This is a third known answer the same arithmetic
      must reproduce, and it checks the machinery against the input record's
      own separately-derived ceiling.
    curve_free_null: >-
      NOT A SEPARATE ARM, BECAUSE THE ENTIRE COMPARISON IS CURVE-FREE BY
      CONSTRUCTION, AND THAT IS RECORDED HERE RATHER THAN OMITTED. Both
      algorithms are generic-group algorithms; the prime-order object is a
      cyclic group of prime order with an interval promise, and the
      proves-too-much object is F_2^{3m} with random-oracle lists. No
      elliptic curve, no curve equation, no point representation and no
      curve-specific structure appears anywhere in the derivation. There is
      therefore no curve-derived signature a non-curve object could
      reproduce, because there is no curve-derived signature at all.
    pre_declared_consequence: >-
      DECLARED IN ADVANCE, UNCONDITIONAL, AND BINDING. NO ROW OF THE
      DELIVERABLE TABLE IS A STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP.
      Every row is a statement about generic-group algorithms with per-target
      advice, and it applies to ANY prime-order group. Quoting the mu = 1/3
      corner, the memory dominance, or the certificate row as an
      elliptic-curve result is a mis-citation, and the run's report must
      carry this sentence. Separately and equally binding: the time-axis tie
      on [0,1/3] may NOT be quoted as "kangaroo is faster", because it is
      not - it ties, and the whole dominance is on memory.

  controls:
    - >-
      mu = 0 SLICE (blocking baseline): both sides must land on time exponent
      exactly 1/2, with the four-list side already at memory exponent 1/2
      against kangaroo's 0. A failure on the four-list side is INHERITED from
      the input record; this record's four-list column is then void and its
      kangaroo column stands.
    - >-
      NON-DEGENERACY DERIVATION (blocking, Stage 1): compute Delta_T and
      Delta_M symbolically across the asserted range and record explicitly
      which axis is a width-zero discriminator. This is a control on the
      record's OWN claim and its result is a primary metric.
    - >-
      F_2^{3m} PROVES-TOO-MUCH CONTROL (blocking): the same-resource argument
      must PASS the four-list machinery on XOR, where the four-list join
      beats the two-list same-resource method by 2^{m/2}. If the argument
      dominates there too, it proves too much and this record is void until
      repaired.
    - >-
      GUESSED-BITS CONSISTENCY CHECK: kangaroo with k guessed top bits at
      sqrt(N * 2^k), exponent 1/2 + mu/2, must reproduce the input record's
      own separately-derived ceiling. A disagreement localises an arithmetic
      error in one of the two records and is reported rather than absorbed.
    - >-
      QUANTIFIER-RANGE CONTROL (blocking): every row with mu > 1/3 is
      MARKED UNASSERTED, because the input exponent's own record quantifies
      it only over [0,1/3]. Emitting such a row as asserted is an
      invalidation.
    - >-
      MANDATORY PARETO ROWS: rho and BSGS are tabulated beside both
      algorithms, NOT as controls - neither consumes the advice - but so that
      a reader can see the incumbent frontier and see why they are not the
      control for a conditional route.
    - >-
      MEMORY-COLUMN MANDATE: no row may be emitted with a time exponent and
      no memory exponent. The two algorithms share a time exponent on the
      asserted range and are distinguished only by memory, so a time-only
      table is uninterpretable by construction.

  metrics:
    primary:
      - "Delta_T(mu) per grid row; dimensionless rational exponent of N; FORCED 0 on [0,1/3] and LABELLED DEGENERATE there"
      - "Delta_M(mu) per grid row; dimensionless rational exponent of N; predicted (1-mu)/2 on [0,1/3], strictly positive; this carries the dominance claim"
      - "the crossing point of the two time exponents; dimensionless rational; predicted exactly mu = 1/3"
      - "XOR proves-too-much control outcome; categorical PASS/FAIL for the four-list machinery; FORCED PASS"
      - "per-row assertion status; categorical in {ASSERTED (mu <= 1/3), UNASSERTED (mu > 1/3)}"
    secondary:
      - "the six-row (time, memory) table for BOTH algorithms; dimensionless rational exponents of N, both columns mandatory on every row"
      - "the mu = 0 reconciliation on both sides; exact rationals"
      - "the guessed-bits ceiling 1/2 + mu/2 against the input record's own value; exact rationals"
      - "the four-list route placed on the balance law as a closed form; dimensionless ratio, reported as a CONSISTENCY CROSS-CHECK against a sibling record and explicitly NOT as evidence"
      - "the text of the proposed same-resource certificate row, with the baseline named for each of the lane's conditional branches"
      - "rho and BSGS rows tabulated for context, marked NOT-A-CONTROL"

  heuristic_under_test: HEUR-ADV-2

  scale_relevance:
    tier: null
    justification: >-
      NO SCALE TIER APPLIES because nothing is computed on any instance and
      no group is ever instantiated. Recording the tier as null rather than
      as toy is deliberate: labelling it toy would imply a small-parameter
      measurement that could in principle be repeated at larger ones, and
      there is none. FURTHER, AND STATED PLAINLY RATHER THAN NARROWED AWAY:
      THIS COMPARISON CANNOT BE DECIDED EMPIRICALLY AT REACHABLE SCALE. It is
      a statement about exponents, and at any size a machine could run, the
      constants - kangaroo's factor 2, the four-list route's sorting factors
      and its list-construction overhead - would dominate the exponent gap
      entirely. An empirical arm would measure constants and report them as
      exponents, which is why none is proposed here.
    correspondence: null

  tail_checks:
    - "The mu = 1/3 row, the crossing point and the lane's own advertised corner, reported individually: both algorithms at time N^{1/3}, four-list at memory N^{1/3}, kangaroo at O(log N)."
    - "The mu = 0 row, where the four-list route degenerates to a meet-in-the-middle and the whole conditional structure disappears."
    - "The first UNASSERTED row, mu = 1/2, reported with its extrapolation warning attached rather than in a footnote, since it is the row a careless reader would quote as strict dominance."
    - "The XOR control at small m, where 2^{m/2} is smallest and the four-list advantage is least, since that is where a mis-stated control would first appear to fail."

  replication:
    seeds: []
    independent_instances: 0
  seeds_policy: >-
    NO RANDOMNESS IS USED ANYWHERE IN THIS CONTRACT, so the seeds list is
    empty by construction rather than by omission, and there is nothing to
    replicate in the statistical sense. Reproducibility rests instead on
    (a) exact rational arithmetic, which reproduces bit for bit, and (b) the
    sha256 of the input record from which the four-list exponent and its
    quantifier are transcribed, recorded in the run manifest so a later
    session can verify it consumed the same statement. INDEPENDENT
    RE-DERIVATION, not replication, is the meaningful check here: the paired
    hypothesis names a symbolic re-derivation of the substitution as a proof
    obligation, and any disagreement is reported AGAINST the input record
    rather than absorbed.

  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 8
    maximum_runs: 1
    maximum_workers: 1
  budget_note: >-
    At the schema floors, and the floors are nominal here. The computation is
    a few dozen exact rational operations and a six-row table; it completes
    in under a second. The 600-second wall clock and 8 GB memory figures are
    set AT the floors rather than below them so that no stopping rule can be
    confused with a budget exhaustion, and both are reported so the envelope
    prediction can fail. maximum_runs is 1 because the derivation is
    deterministic: a second run would produce identical output and a third
    would too.

  stopping_rules:
    - "STAGE 0, HARD GATE: transcribe the four-list exponent AND its quantifier range verbatim from the committed source record, with that record's sha256. If the quantifier range cannot be located and quoted, the comparison has no declared domain and the run STOPS."
    - "STAGE 1, HARD GATE: the mu = 0 reconciliation on both sides. A failure on the four-list side voids that column and the run continues with the kangaroo column alone, reporting the dominance claim as SUSPENDED."
    - "STAGE 2, BLOCKING: the non-degeneracy derivation. Its result - which axis is width-zero over the asserted range - is recorded before the table is emitted, so the table cannot be written as though the time axis carried information."
    - "STAGE 3: the six-row table with both columns, rows above mu = 1/3 marked UNASSERTED."
    - "STAGE 4, BLOCKING: the XOR proves-too-much control. A FAIL voids the record until repaired and the certificate row is NOT emitted."
    - "STAGE 5: the certificate row text, naming the same-resource baseline for each conditional branch of the lane."
    - "An independent derivation finding the four-list time exponent strictly below (1-mu)/2 anywhere on [0,1/3] STOPS the run, inverts the record into a positive lead, and routes it to independent review at the highest tier rather than allowing any dominance text to be written."

  invalidation_rules:
    - "Any execution while status is not approved, or while execution_authorized is false."
    - "Emitting any row with mu > 1/3 as ASSERTED without citing an independent re-derivation of the four-list exponent valid on that range."
    - "Emitting any row with a time exponent and no memory exponent."
    - "Describing the [0,1/3] result as kangaroo being FASTER. It ties on time; the dominance is on memory, and the time discriminator is width-zero there."
    - "Presenting Delta_T = 0 on [0,1/3] as a finding rather than as a degeneracy."
    - "Comparing constants, or comparing wall clock at unequal processor counts; both algorithms parallelize with total work unchanged and the comparison is on total work."
    - "Treating rho or BSGS as the control for the conditional branch; neither consumes the advice."
    - "Quoting any row as a statement about elliptic curves or the ECDLP."
    - "Any post-hoc change to the mu grid, the asserted range, or the forced values. A change requires a versioned protocol_amendment before the affected rows are re-emitted."

  success_criterion: >-
    The run SUCCEEDS when: the four-list exponent AND its quantifier range
    are transcribed verbatim with the source sha256; the mu = 0
    reconciliation lands on 1/2 on both sides; the non-degeneracy derivation
    is recorded, naming the time axis as width-zero over [0,1/3] and the
    memory axis as the carrier of the claim; the six-row table is emitted
    with BOTH columns on every row and with mu > 1/3 rows marked UNASSERTED;
    the XOR proves-too-much control returns PASS; the guessed-bits
    consistency check reproduces the input record's ceiling; and the
    same-resource certificate row is written with its baseline named per
    conditional branch.

  falsification_criterion: >-
    THE DOMINANCE CLAIM IS FALSIFIED if Delta_M is zero anywhere on [0,1/3],
    since with the time axis already identically zero the record would have
    nothing left. THE RECORD INVERTS INTO A POSITIVE LEAD, to be routed to
    independent review rather than claimed, if an independent derivation
    finds the four-list advised time exponent strictly below (1-mu)/2 for
    some mu in [0,1/3]. THE ARGUMENT PROVES TOO MUCH, and the record is void
    until repaired, if the XOR control reports the four-list machinery as
    dominated. THE FOUR-LIST COLUMN IS VOID, with the kangaroo column
    standing and the dominance suspended, if the mu = 0 slice fails on the
    four-list side. THE RECORD IS VOID ENTIRELY if kangaroo's interval cost
    is shown to exceed sqrt(|W|)^{1+delta} for some delta > 0. A ROW EMITTED
    AS ASSERTED ABOVE mu = 1/3 without a valid re-derivation is a scope
    violation and the table is withdrawn and re-issued.

  required_artifacts:
    - "Stage 0 receipt: the four-list exponent and its quantifier range quoted verbatim, with the source record's path and sha256."
    - "The mu = 0 reconciliation, shown in exact rationals on both sides."
    - "The NON-DEGENERACY RECORD: Delta_T and Delta_M as closed forms over [0,1/3], with the explicit statement of which axis is width-zero and why."
    - "The six-row (time, memory) table for both algorithms, with the assertion status on every row and rho and BSGS tabulated beside them as context marked NOT-A-CONTROL."
    - "The XOR proves-too-much control worked out: the two-list same-resource cost 2^{3m/2}, the four-list join cost 2^{m}, and the PASS verdict."
    - "The guessed-bits consistency check against the input record's own ceiling."
    - "The balance-law placement of the four-list route as a closed form, labelled a CROSS-CHECK and explicitly not evidence."
    - "The proposed same-resource certificate row as text, naming the cheapest known consumer for each conditional branch of the lane."
    - "Run manifest with exact command, git commit and dirty-tree state, environment, requested policy, resolved model identifier and probe status, stdout and stderr, wall clock."
    - "A report carrying, verbatim, the unconditional scope sentence from null_object.pre_declared_consequence."

  assigned_to: executor

  limitations:
    - >-
      ZERO RUNS, no implementation, no instance, no ECDLP result. A dominance
      statement for one conditional branch under one resource.
    - >-
      THE TIME AXIS IS DEGENERATE OVER THE ASSERTED RANGE and the claim is
      memory-strict / time-tied. Any summary saying kangaroo is faster on
      [0,1/3] is wrong.
    - >-
      THE mu > 1/3 ROWS ARE UNASSERTED because the input exponent is
      quantified only over [0,1/3]. This contract refuses to extend it.
    - >-
      The four-list column is CONSUMED from a committed record and inherits
      that record's own proof obligations; if it is falsified the column is
      void.
    - >-
      The kangaroo column's exponent is RECALLED textbook material that no
      agent in this program has opened. Only the exponent is load-bearing and
      the constants are unused.
    - >-
      THE COMPARISON CANNOT BE DECIDED EMPIRICALLY AT REACHABLE SCALE:
      constants would dominate the exponent gap at any size a machine could
      run. Stated rather than narrowed.
    - >-
      Per-group preprocessing and multi-target reuse are different resources
      with their own frontiers and are excluded and named.
    - >-
      NOTHING HERE IS SPECIFIC TO ELLIPTIC CURVES; both objects are generic
      groups.
    - >-
      No status change to any hypothesis, experiment or goal, and no sub-rho
      mechanism is claimed.
