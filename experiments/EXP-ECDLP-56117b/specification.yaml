        already discharged by the named known-false control (a = 1/4),
        which is a control, not a proof-map audit.
    proof_obligations: []
    four_audits:
      - audit: exact_baseline_reproduction
        status: N/A
        reason: "Empirical measurement, no theorem whose baseline must be reproduced as a parameter slice or regression fixture."
      - audit: observation_collision_search
        status: N/A
        reason: "No certificate or quotient; nothing to collide."
      - audit: quantifier_order_statement
        status: N/A
        reason: "No quantified claim; licensed statements are cell-scoped measurements."
      - audit: method_ceiling_with_nearby_object_control
        status: N/A
        reason: "No method ceiling. The known-false a = 1/4 cell is the nearby-object CONTROL of the measurement, recorded under `controls`, not as a proof-map audit."

