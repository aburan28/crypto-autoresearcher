        role: PRIMARY (the owed cell)
        a: 0.0625          # 1/16
        r: 2
        seeds: [1, 2, 3, 4, 5]
        seed_count: 5
        verdict_rule: frozen_4_of_5
        null_a: true       # NULL_A measured on the identical pool
        run_ids: [RUN-ECDLP-56117b-a16r2-s1, RUN-ECDLP-56117b-a16r2-s2, RUN-ECDLP-56117b-a16r2-s3, RUN-ECDLP-56117b-a16r2-s4, RUN-ECDLP-56117b-a16r2-s5]
      - id: a8r2
