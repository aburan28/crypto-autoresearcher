        measured object is a coverage difference on a named cell.
    constructive_transforms: []
    quantifier_order: not_applicable
    quantifier_order_not_applicable_reason: >-
      Every statement this experiment can license is of the form "at these
      parameters, on this instrument family, over these seeds, this
