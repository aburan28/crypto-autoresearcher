  bootstrap:
    method: BCa 95%
    resampling_unit: seed
    resampling_unit_note: >-
      THE SEED is the resampling unit. Each cell holds exactly ONE margin
      per seed, so resampling WITHIN a seed stratum is degenerate -- it
      returns that seed's single value every time and yields a zero-width
      interval. EV-ECDLP-6a4ebc UC-2 recorded that v3's "stratified by
      seed" text was ambiguous and that the Executor took the seed as the
      unit. This contract states the unit explicitly so that ambiguity is
      not repeated. CI endpoints only: no margin, pass_count or five-seed
      verdict depends on the bootstrap; those are computed from the
      per-seed margins directly.
    resamples: 10000
    generator_seed: 20260907

