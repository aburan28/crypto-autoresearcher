    n_equals_2_30_exact_basins: forbidden
    n_equals_2_30_note: >-
      Infeasible on 15 GB, declared in experiments/EXP-ECDLP-612fb1/amendments/v2_to_v3.yaml
      Section 10 (`budget_note`): at N = 2^30 the two persistent int32 arrays
      plus a transient per doubling round are at least 13 GB against a 15 GB
      host. Not attempted.
    online_resel_l_arms: forbidden
    online_resel_l_note: >-
      RANK 2 of the current portfolio, blocked on the EXP-ECDLP-6ac801
      definitional revision. A G3 PASS is a ceiling and licenses no online
      arm (DEC-20260907-6d9427 standing prohibition).
    cells:
