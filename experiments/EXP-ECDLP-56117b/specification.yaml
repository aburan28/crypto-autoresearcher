    not_applicable_reason: >-
      THIS EXPERIMENT IS PURELY EMPIRICAL. It proposes no theorem, no
      asymptotic bound, no certificate family, no reduction and no closure
      argument. It measures one exactly computable statistic -- the
      difference between an exact top-t basin share and the exact coverage
      of a weight-selected table -- on an independently written instrument
      at declared parameters, and reports it with controls. There is no
      bottleneck whose removal changes a theorem. Per
      templates/research-records.md and agents/coordinator.md's
      proof-oriented dispatch gate, the four cheap pre-compute audits are
      recorded as N/A rather than omitted.
    bottleneck: null
    baseline_embedding:
