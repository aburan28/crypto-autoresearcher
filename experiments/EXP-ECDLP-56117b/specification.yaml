  # =====================================================================
  # THE G3 FEASIBILITY PREDICATE, STATED FORMALLY AND SELF-CONTAINEDLY
  #
  # Copied from experiments/EXP-ECDLP-612fb1/amendments/v2_to_v3.yaml
  # Section 3 (the frozen definition). The IMPLEMENTATION must be written
  # from THIS TEXT, not from any existing code. Selecting by true basin
  # size is a named invalidation rule.
  # =====================================================================

  g3_predicate:

    copied_from: >-
      experiments/EXP-ECDLP-612fb1/amendments/v2_to_v3.yaml `g3_predicate`
      (Section 3). Provenance: internal. This authorship read that section
      in full. The clauses below are the operative definition for THIS
      experiment. Where this contract adapts a clause (instrument family,
      seed counts, the 20-seed cell's lack of a binary threshold), the
      adaptation is named in that clause; everything unnamed is copied.

    parameters:
      N: "the group/set size. THIS EXPERIMENT USES N = 2^24 = 16777216 only."
      T: "the nominal table size, T = round(N^{1/3}). FROZEN as T = 256 at n = 24. Use the frozen value; do not recompute a rounding."
      T_sel: "the number of stored entries under test. THIS EXPERIMENT USES T_sel = floor(T/2) EXACTLY: 128 at n = 24."
      a: "the shape parameter a = T*W^2/N. This experiment uses a = 1/16 (primary), a = 1/8 (robustness / distribution), a = 1/4 (known-false control)."
      W: "the expected walk length between distinguished points, W = sqrt(a*N/T). Real-valued; NOT rounded."
      theta: "the DP density, theta = 1/W."
      cap: "the per-walk step cap, cap = ceil(8*W). A walk that reaches the cap without meeting a DP is a MISS: it is charged `cap` steps and contributes no DP."
      r: "the precomputation pool ratio. r = 2 is the primary cell; r in {4, 8} are the decay control."
    exact_parameter_table: >-
      Computed from W = sqrt(a*N/T), cap = ceil(8*W), copied from
      v2_to_v3.yaml `g3_predicate.exact_parameter_table_for_this_item` at
      n = 24 so a re-implementer never has to infer them:
        n = 24, T = 256, T_sel = 128:
          a = 1/16 : W = 64.000000        theta = 0.015625000  cap = 512
          a = 1/8  : W = 90.509668        theta = 0.011048544  cap = 725
          a = 1/4  : W = 128.000000       theta = 0.007812500  cap = 1024

    reading_this_experiment: >-
      READING P2 ONLY. A uniformly random function on Z_N together with an
      independent Bernoulli(theta) DP marking (HEUR-BLT-1's statistical
      model). The implementer MUST use its OWN map and its OWN DP marking,
      written from this text. It MUST use the SAME T, T_sel, a, W, cap, r,
      the SAME pool procedure (`pool` below) and the SAME selection weight
      and tie-break (`selection` below).
      THIS IS NOT READING P1. The frozen v2 mix64/hash64 instrument
      (v2_to_v3.yaml `reading_P1_frozen_instrument`) is the PRIOR family
      this experiment is independent of. Reproducing mix64 would make this
      experiment a second read of the same instrument and would fail the
      independence constraint.
      AGREEMENT IS AT THE VERDICT AND PER-SEED SIGN LEVEL, NOT THE
      MAGNITUDE LEVEL, and only after the fact, judged by review. Two
      different random-function families give different margin magnitudes
      at the same (a, r, seed label); EV-ECDLP-2e9680 measured exactly that
      at a = 1/4. A magnitude difference is EXPECTED and is not a break.
      The seed index is NOT a shared object across instrument families
      (EV-ECDLP-6a4ebc `j2_seed_pairing_caveat`; EV-ECDLP-6783b8
      `cell_by_cell_result."a=1/8".agreement`). Chasing seed labels is
      wrong; the 20-seed a = 1/8 arm is the remedy (DEC-20260907-6d9427).

    basins: >-
      For x in Z_N let the trajectory be x, f(x), f(f(x)), ... . Define
      dist(x) = the least m >= 0 with D(f^m(x)) = 1, and first_dp(x) = f^m(x)
      for that least m; if no such m exists (the trajectory enters a DP-free
      cycle) then x is UNREACHABLE and belongs to no basin. Define
          basin(d) = #{ x in Z_N : first_dp(x) = d AND dist(x) <= cap }
      for each DP d (i.e. each d with D(d) = 1). Points with dist(x) > cap are
      CAPPED and belong to no basin. Every basin count is exact; nothing is
      sampled. Note dist(d) = 0 for a DP d, so every DP is in its own basin.

    top_share: >-
      TopShare(t) = ( sum of the t LARGEST values of basin(d) over all DPs d )
      / N. Ties among equal basin sizes do not affect the sum, so no tie-break
      is needed for this quantity. TopShare is the exact single-walk hit
      probability of the best possible t-entry table -- an ORACLE, unreachable
      by any real selection rule, which is why it is the CEILING in G3.

    pool: >-
      THE PRECOMPUTATION POOL AT RATIO r, the Bernstein-Lange procedure as
      v2_to_v3.yaml Section 3 froze it. Draw independent uniform starts
      x_1, x_2, ... from Z_N using a deterministic stream seeded by s. Walk
      each start to its first DP or to the cap. A capped walk is a MISS: it
      is charged `cap` group operations to P and contributes NOTHING to the
      pool. A walk that terminates at DP d with length L (the number of
      steps taken, 0 if the start is itself a DP) CREDITS d with (L, +1):
          S_d  <- S_d + L        (the summed generating-walk length at d)
          h_d  <- h_d + 1        (the hit count at d)
      GENERATION STOPS AT THE FIRST MOMENT the pool contains exactly r*T
      DISTINCT DPs. Every generating walk, hit or miss, is charged to P.
      The pool is therefore a set of r*T distinct DPs, each carrying (S_d, h_d).

    selection: >-
      STATIC(T)_r is the size-T subset of the r*T pool entries selected by
          w(d) = S_d + 4 * W * h_d
      taking the T entries of LARGEST w(d), ties broken by an independent,
      seeded, deterministic key ASCENDING. The implementer MUST declare its
      tie-break stream (v2 used a stream seeded 400 + s; any deterministic
      tie-break is acceptable for reading P2, provided it is disclosed and
      seeded from s).
      w(d) IS AN ESTIMATOR COMPUTED FROM POOL EVIDENCE ONLY. It is NOT the
      basin size, and a selection by TRUE basin size is a DIFFERENT AND
      STRICTLY STRONGER rule that this predicate FORBIDS. EV-ECDLP-2e9680's
      controlled diagnostic measured how much that choice matters at
      N = 2^24, T_sel = T/2: selecting by true size instead of by w(d)
      LOWERS the pass count at every tested a (a = 1/16: 5 -> 5; a = 1/8:
      5 -> 1; a = 3/16: 2 -> 0; a = 1/4: 0 -> 0). Selecting by w(d) is the
      REALISTIC rule -- what a precomputer who does not know the basin
      sizes must actually use.
      TIE-BREAK HONESTY, recorded rather than copied as a false claim:
      v2_to_v3.yaml stated that ties in a real-valued w are measure-zero.
      EV-ECDLP-6a4ebc UC-4 measured that 75-85% of pool entries are TIED
      and that ties STRADDLE THE SELECTION CUT, so that argument is false
      as written. The conclusion at that batch survived by measured
      headroom (64 alternative tie-break streams, no sign flip), not by
      the argument. This contract does not repeat the false measure-zero
      claim. The implementer declares the stream; a later reviewer may
      vary it.

    static_coverage: >-
      StaticCov(T, r) = ( sum of basin(d) over the T entries d of STATIC(T)_r )
      / N. Note this is the EXACT coverage of the table the realistic rule
      actually chose -- exact basin sizes are used to SCORE the selection,
      but never to MAKE it.

    predicate_per_seed: >-
      At a cell (N, a, r, T_sel) and seed s, with both quantities computed on
      THE SAME instantiation (same s, same map, same pool draw):
          margin_s  :=  TopShare_s(T_sel)  -  StaticCov_s(T, r)
          g3_s      :=  [ margin_s >= 0 ]                (a boolean)

    predicate_per_cell_five_seeds: >-
      Over a declared five-seed set S with |S| = 5:
          pass_count := #{ s in S : g3_s }
          G3 PASSES at the cell  iff  pass_count >= 4
          G3 FAILS  at the cell  iff  pass_count <= 3
      The >= 4-of-5 threshold is v2's own frozen G3 rule, reused verbatim,
      and is NOT changed by this experiment. It applies to every cell in
      this contract whose declared seed set has size 5: a16r2, a4r2,
      a16r4, a16r8, a8r4, a8r8.

    predicate_per_cell_twenty_seeds: >-
      Over the declared twenty-seed set S = {1..20} at cell a8r2 ONLY:
      THERE IS NO BINARY G3 PASS/FAIL THRESHOLD. This contract does not
      invent a 16/20 (or any other) bar after seeing 5-seed texture.
      The result at this cell IS the margin distribution: the twenty
      per-seed margins (each with TopShare and StaticCov reported
      separately), pass_count out of 20 (the count of non-negative
      margins, a descriptive statistic, not a verdict), the pooled mean
      margin, and a BCa 95% CI whose resampling unit is THE SEED
      (declared explicitly; see `bootstrap`). A secondary, non-criterion
      descriptive statistic -- the fraction of C(20,5) = 15504 five-seed
      subsets that would G3-PASS under the frozen >= 4/5 rule -- MAY be
      reported in g3_verdict_table.json and MUST NOT be used as a success
      or falsification criterion.

    predicate_semantics: >-
      G3 PASS means: the best possible T_sel-entry table's exact coverage
      reaches or exceeds the exact coverage of the realistically-selected
      T-entry table. It is a statement about the BASIN-SIZE DISTRIBUTION and
      the ESTIMATOR'S LOSS -- a CEILING. It does not assert that any online
      re-selection procedure attains that ceiling.
      G3 FAIL means: the ceiling itself lies below the comparator, so a
      T_sel-entry claim at that cell is infeasible BEFORE any algorithm runs.
      THIS EXPERIMENT RUNS NO S1/F1 / online arm, so that routing is
      inherited, not exercised.

    what_this_section_does_not_specify: >-
      Stated plainly rather than left as a silent gap, copied from
      v2_to_v3.yaml Section 3: this section does NOT specify (i) the exact
      PRNG used to draw the uniform pool starts, nor its batching; (ii) the
      exact tie-break key stream; (iii) the exact PRNG used to draw the
      random function f and the DP marking D. The implementer MUST disclose
      all three in IMPLEMENTATION.md and in every run manifest. If a
      reviewer believes any of them DOES change a five-seed verdict, that
      is itself a finding and must be reported, not absorbed.

  # =====================================================================
  # INDEPENDENCE CONSTRAINT -- LOAD-BEARING
  # =====================================================================

  independence:
    load_bearing: true
    required: >-
      The executor and its implementation MUST NOT read, import, copy, or
      sys.path-insert any of the paths below. Independence is CODE
      independence: a different random-function family, an independently
      written basin closure, authored from this specification's
      `g3_predicate` text (and, if needed as the frozen definition this
      text copies, from experiments/EXP-ECDLP-612fb1/amendments/v2_to_v3.yaml
      Section 3 ONLY -- that YAML, not the Python). Expectation
      independence is NOT claimed: prior margins are quoted below as
      context, labelled as not a target to match.
    forbidden_paths:
      - experiments/EXP-ECDLP-612fb1/source_v2/
      - experiments/EXP-ECDLP-612fb1/source_v3/
      - experiments/EXP-ECDLP-6ac801/source/
      - any existing instrument.py in this lineage
    forbidden_operations:
      - read
      - import
      - copy
      - sys.path-insert
    permitted_definitional_reads:
      - experiments/EXP-ECDLP-56117b/specification.yaml (this file; the operative contract)
      - experiments/EXP-ECDLP-612fb1/amendments/v2_to_v3.yaml (Section 3 text only, the frozen definition this file copies)
      - ledger/evidence/EV-ECDLP-6783b8.yaml
      - ledger/evidence/EV-ECDLP-6a4ebc.yaml
      - ledger/evidence/EV-ECDLP-2e9680.yaml
      - ledger/evidence/EV-ECDLP-60e266.yaml
      - ledger/decisions/DEC-20260907-6d9427.yaml
      - ledger/hypotheses/H-ECDLP-37dc01.yaml
    implementation_files:
      - experiments/EXP-ECDLP-56117b/source/__init__.py
      - experiments/EXP-ECDLP-56117b/source/g3_predicate.py
      - experiments/EXP-ECDLP-56117b/source/run_cell.py
      - experiments/EXP-ECDLP-56117b/source/analyze.py
      - experiments/EXP-ECDLP-56117b/source/IMPLEMENTATION.md
    implementation_files_note: >-
      NAMED EXACTLY, NOW. The executor writes these five files and no
      sixth module without saying so in the execution report. An undeclared
      sixth module is a scope expansion. IMPLEMENTATION.md must name the
      three choices `g3_predicate.what_this_section_does_not_specify`
      leaves open, and must attest that none of `forbidden_paths` was
      read, imported, copied, or sys.path-inserted.

  # =====================================================================
  # CELL GRID
  # =====================================================================

