experiment:
  id: EXP-SIMSPK-1a10f5
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-29e9bc; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-29e9bc
  question_id: RQ-SIMSPK-f6a6c0
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exhaustive bit-based division-property propagation over the SIMON rotation-constant space
    at small word sizes, with every predicted-balanced bit verified experimentally by full structured-set
    XOR-sums, and matched random-quadratic and linear controls
  objective: 'A run reduces exactly one uncertainty: whether this campaign''s symbolic algebraic-degree
    instrument is measuring the cipher rather than its own bookkeeping, and if so what integral reach
    looks like across the rotation-constant space. Concretely it determines (i) the exact integer
    count of events where the propagation predicts an output bit balanced after r rounds but a full
    structured-set XOR-sum measures it nonzero under some key, where the prediction is zero and any
    nonzero count is a hard falsification carrying an exact witness triple; (ii) the value of r_div
    for every orbit representative at word sizes 4, 6 and 8, delivered as a distribution with its
    tie structure rather than as a ranking, together with the reduced propagation set size per round
    so a reader can see where the engine was near its memory ceiling; and (iii) whether r_div distinguishes
    rotation geometry from mere AND-gate count, measured against a matched random-quadratic null with
    equal gate count, and whether it has any resolving power at all, measured against a random-constant
    null. The linear control establishes that the engine can report the ceiling value, and the detection-power
    control establishes that the experiment can see imbalance. No hypothesis is minted and no attack
    is produced.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'At most, a run could support: for the round-function form pinned
      in STAGE 0, at word sizes 4, 6 and 8, over the frozen enumeration of initial structured sets,
      at round counts up to the declared ceiling, with the propagation rules frozen in STAGE A and
      the memory ceiling recorded, (a) an exact integer count of predicted-balanced-but-measured-nonzero
      events with witnesses; (b) a value of r_div per orbit representative under those rules and that
      enumeration, which is a LOWER BOUND on integral reach and not the reach itself; (c) the empirical
      distribution of r_div with its tie structure and the standardized triple''s orbit-weighted percentile;
      and (d) the same on a random-constant null and a matched random-quadratic null. What does NOT
      follow: that r_div is the true integral or division-property reach of any variant; that a balanced
      bit at r rounds implies any attack, key-recovery cost or data complexity; that any triple is
      strong, weak, optimal or anomalous; that a bit without a balancedness prediction is unbalanced;
      that results at word sizes 4 through 8 transfer to 16, 24, 32, 48 or 64; anything about designer
      intent; and anything about the security of any deployed SIMON variant.'
  inputs:
    procedure: 'STAGE 0, pin the round-function form, Feistel orientation and rotation direction against
      the specification and test vectors; human cost 30 to 60 minutes, may fail, failure recorded
      as a named missing baseline. STAGE 1, state and freeze the division-property transition rules
      for copy, XOR, rotation and AND, plus the initial-structured-set enumeration rule; write to
      a preregistration file and hash it; 2 to 3 hours human, zero compute. STAGE 2, implement the
      propagation engine with dominance reduction and a declared memory ceiling of 200000 vectors;
      validate at n = 4 by propagating with and without reduction and comparing predictions; minutes.
      STAGE 3, exhaustive sweep at n = 4 over all 64 triples and the frozen initial-set enumeration;
      seconds. STAGE 4, experimental cross-check at n = 4: full-codebook structured sets, 32 random
      keys per constant, every predicted-balanced bit verified against a separately written cipher
      implementation; minutes. STAGE 5, controls: linear round function, matched random-quadratic
      family of 32 draws, random-constant null of 200 draws, detection-power check on non-predicted
      bits; minutes. STAGE 6, sweep and cross-check at n = 6, then n = 8, each under its declared
      stage budget, with the cross-check cost of 2^d encryptions per key per round reported and any
      stage that binds recorded as a budget outcome. STAGE 7, distribution assembly, tie structure,
      orbit-weighted percentiles.'
    instrument: CPython 3.11 standard library only. numpy, z3, python-sat and pulp are absent in this
      environment as verified on 2026-08-16, and Sage is excluded by contract, which rules out the
      usual MILP encoding of division-property propagation and is the reason the engine is an explicit
      set of exponent vectors held as Python integers with dominance reduction by pairwise bitwise-AND
      tests. The cipher used for the experimental cross-check is written independently of the propagation
      code, in a separate module, so that a shared misreading of the round function cannot make the
      two arms agree spuriously; both are validated against the STAGE 0 test vectors. Seeds, manifest
      and per-stage timing follow harness/runner.py conventions; identifiers minted with tools/allocate_id.py
      --next.
    parameters: 'Word sizes n in {4, 6, 8}, block sizes 8, 12 and 16 bits, constant spaces of 64,
      216 and 512 triples reduced to orbit representatives. Initial structured sets: all coordinate
      subsets of dimension d for d from 2n minus 4 up to 2n minus 1, enumerated exhaustively at n
      = 4 and by a frozen stratified rule at n = 6 and 8 with the omitted region named. Round ceiling
      16 at n = 4, 20 at n = 6 and 8. Experimental cross-check: 32 random keys per constant at n =
      4, 16 at n = 6, 8 at n = 8, with the full 2^d structured set encrypted each time. Nulls: 200
      uniformly drawn rotation triples, 32 matched random-quadratic round functions with AND-gate
      count equal to n, 1 linear round function. Memory ceiling 200000 vectors in the reduced propagation
      set. Total run ceiling 5400 seconds.'
  controls:
  - Experimental XOR-sum cross-check of every predicted-balanced bit, under multiple random keys,
    executed in the same invocation as the symbolic propagation and against a separately written cipher
    implementation.
  - Purely linear round-function control whose r_div must reach the round ceiling.
  - Matched random-quadratic round function with equal AND-gate count, separating rotation geometry
    from quadratic-term count.
  - Random-constant null family establishing r_div's spread when nothing is designed.
  - 'Dominance-reduction control at n = 4: propagate with and without reduction and confirm identical
    balancedness predictions.'
  - 'Detection-power control: XOR-sums of bits NOT predicted balanced must be nonzero for at least
    some keys, confirming the experiment can see imbalance.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Three nulls, all executable in the same invocation as the signal arm.
    The primary null object is a rotation triple drawn uniformly from (Z/n)^3, propagated identically,
    giving the r_div distribution over random constants; a distribution with fewer than two distinct
    values means the measure cannot rank at that word size and no percentile may be quoted. The second
    null is a matched random quadratic round function with the same number of AND gates and the same
    output width but with the AND inputs wired to uniformly random bit positions rather than to rotations:
    this separates whether r_div reflects rotation geometry or merely the count of quadratic terms,
    and the signal arm means nothing about rotations unless the two distributions differ. The third
    null is a purely linear round function, for which balancedness is preserved indefinitely and r_div
    must therefore hit the round ceiling; if it does not, the propagation engine is faulty and the
    signal arm is void. Alongside these, the experimental arm provides a null of a different kind:
    XOR-sums of bits NOT predicted balanced, measured on random keys, which should be nonzero for
    at least some keys, confirming the experiment can detect imbalance at all.'
  independent_variables:
  - word size n
  - rotation triple (a,b,c)
  - initial structured set (dimension d and active coordinate subset)
  - round count r
  - arm (rotation family, random-constant null, matched random-quadratic null, linear control)
  metrics:
    primary:
    - predicted_balanced_but_measured_nonzero count, exact integer, with witness triples
    - r_div per orbit representative per word size
    - number of distinct r_div values and tie count at the standardized triple's value
    - r_div of the linear control
    secondary:
    - reduced propagation set size |K_r| per round, and the round at which the memory ceiling binds
    - r_div distributions on the random-constant and matched random-quadratic nulls
    - count of non-predicted bits measuring nonzero, the detection-power metric
    - wall-clock seconds and peak resident memory per stage
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The number of (constant, initial set, round, output bit, key) events in which the frozen
      division-property propagation predicts the output bit is balanced while the directly measured
      XOR-sum over the full structured plaintext set is nonzero.
    formula: 'Predicted value exactly 0, by the soundness of division property for balancedness. The
      predicted law under test: for a structured input set S whose division property is the initial
      set K_0, propagate K_r round by round using the frozen copy, XOR, rotation and AND rules with
      dominance reduction; output bit j is predicted balanced after r rounds if and only if no vector
      in K_r equals the unit vector e_j. The measured quantity is the XOR over all p in S of bit j
      of enc_r(k, p), for random keys k. Soundness asserts predicted-balanced implies measured-zero;
      the converse is explicitly NOT asserted and measured-zero without a prediction is recorded separately
      as over-approximation slack rather than as a discrepancy.'
    source: Pre-registered in the parent proposal IDEA-20260816-29e9bc before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested word sizes are 4, 6 and 8, block sizes 8, 12 and 16 bits, against a family
      whose smallest deployed block size is 32 bits at word size 16. The limit is not the propagation,
      which is cheap, but the experimental cross-check, which encrypts 2^d plaintexts per key per
      round and is what makes the symbolic arm trustworthy; dropping it to reach word size 16 would
      remove the only independent validation and is refused. The transfer assumption is stated rather
      than made: no r_div value measured here is claimed to hold or to rank the same way at word size
      16 or above, and whether the ranking transfers at all is the subject of a separate transfer
      contract. What does carry beyond this scale, conditionally, is the validation of the propagation
      rules themselves, and even that is scoped to the rounds, constants and keys actually tested.'
    correspondence: null
  tail_checks:
  - 'The all-active initial set, d = 2n, is run explicitly: it makes every bit trivially balanced
    for zero rounds and is a sanity floor.'
  - Initial sets of dimension 1 are run explicitly and must give r_div at or near zero.
  - Triples with a = b are reported as a separate stratum since the AND degenerates and the propagation
    rules simplify.
  - Constants whose reduced set size approaches the memory ceiling are reported by name with their
    |K_r| trajectory, so a ceiling-limited r_div is visibly a budget outcome and never a bound.
  - The maximum round reached per constant is reported alongside r_div so ceiling saturation is distinguishable
    from genuine loss of balancedness.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt the entire run and report an instrument fault if the linear control fails to reach the round
    ceiling.
  - Halt a constant's propagation when the reduced set exceeds 200000 vectors, record the round reached
    as a budget outcome, and continue to the next constant; never report that constant's r_div as
    determined.
  - Abort the sweep if any predicted-balanced-but-measured-nonzero event occurs, since every r_div
    computed from falsified rules is void; report the witness and stop.
  - Halt the run at 5400 seconds total and report the word sizes actually completed.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Zero predicted-balanced-but-measured-nonzero events across every constant, initial
    set, round and key tested at word sizes 4, 6 and 8, with the linear control at the round ceiling,
    dominance reduction shown prediction-neutral at n = 4, and at least 2 distinct r_div values on
    the random-constant null.
  falsification_criterion:
  - Any predicted-balanced bit measuring nonzero under any tested key, with its witness triple recorded.
  - The linear control failing to reach the round ceiling.
  - Dominance reduction changing any balancedness prediction at n = 4.
  - The detection-power control finding no nonzero XOR-sums among non-predicted bits, making agreement
    vacuous.
  - Fewer than 2 distinct r_div values on the random-constant null family at a given word size, which
    withdraws that word size's licence to rank.
  - The memory ceiling binding before r_div is determined for a majority of constants at a given word
    size, in which case no distribution is reported there.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-29e9bc
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The division-property transition rule for the AND at rotation offsets must be written out explicitly
    and frozen; the proposal names its shape but the Coordinator must confirm the exact rule, including
    how the copy through the Feistel branch is accounted, before approval.
  - The initial-structured-set enumeration rule at n = 6 and 8 is stratified rather than exhaustive
    and must be fixed by the Coordinator before the sweep, since choosing it after seeing n = 4 results
    would let the set family be tuned to the constants.
  - The memory ceiling of 200000 vectors is a proposal-level guess at what fits comfortably in this
    environment and must be confirmed against a measured Python set-of-integers footprint before freezing,
    since a ceiling that binds on most constants would make the sweep uninformative.
  - Whether r_div ties are reported only or also broken, and whether the standardized triple's percentile
    may be quoted when its tie group is large, are Coordinator decisions this proposal does not make.
