# =============================================================================
# EXP-FROB-aacf57 — version 1, approved by DEC-20261006-6d6850.
# Frozen dimension test for IDEA-20261005-bda728.
# The quadratic is Q_E(T) = S_3(alpha, beta, T) on the first ordinary
# subfield curve E/F_11. The null is E0, the first nonsingular
# short-Weierstrass curve over F_{11^5} whose j-invariant is not in F_11.
# The prediction is the dimension pair (1, 0). Any other pair is a negative.
# No ECDLP exponent. No run in this design.
# The source idea is on origin/design/qlwe-9f4777-logunit and is not copied.
# =============================================================================
experiment:
  id: EXP-FROB-aacf57
  hypothesis_id: H-FROB-43ac09
  question_id: RQ-FROB-7d8dd4
  source_idea: IDEA-20261005-bda728
  goal_id: null
  version: 1
  title: >-
    Shift-invariant dimension of Q_E = S_3(alpha, beta, T) at 11^5,
    predicted 1 on E and 0 on the null E0
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: coordinator
    approved_by_role: coordinator
    composing_decision: DEC-20261006-6d6850
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06: "all is
      approved. ideas/experiments should be always approved") because every
      field the design protocol requires is non-null. Approval does not assert
      that the dimension pair is (1, 0), does not assert an ECDLP exponent
      improvement, and does not assert that the pair was observed.
    implementation_authorized: true
    scientific_execution_authorized: true
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide the shift-invariant dimension pair of one descended quadratic
    at (q, n) = (11, 5). The quadratic is Q_E(T) = S_3(alpha, beta, T)
    on the subfield curve E. The null is E0. Success is the pair (1, 0),
    with span rank 5 on E and the transposition control not equal to 1.
    Any other pair of integers is a negative, so success can fail.

  inputs:
    names:
      quadratic: >-
        Q_E(T) = S_3(alpha, beta, T), the third Semaev polynomial in its
        third variable, on the subfield curve E, at the first admissible
        pair (alpha, beta) defined below.
      null_curve: >-
        E0, the first nonsingular short-Weierstrass curve over F_{11^5}
        whose j-invariant is not in F_11.
      null_quadratic: >-
        Q_0(T) = S_3(alpha, beta, T) on E0 at the same pair (alpha, beta).
      subfield_curve: >-
        E, the first nonsingular ordinary short-Weierstrass curve over F_11.
    field:
      prime: 11
      degree: 5
      construction: F_11[z] / (m(z))
      modulus_rule: >-
        m is the lexicographically first monic polynomial of degree 5
        over F_11 that is irreducible. Write
        m = z^5 + c4 z^4 + c3 z^3 + c2 z^2 + c1 z + c0.
        Lex order is (c0, c1, c2, c3, c4) with c0 varying fastest, each
        ci in {0, 1, ..., 10}. Irreducible means m has no factor of
        degree 1 or 2, tested by gcd(m, X^{121} - X) = 1. Every
        nontrivial factorization of a degree-5 polynomial has a factor
        of degree 1 or 2, and X^{121} - X is divisible by every
        irreducible of degree dividing 2.
    normal_basis:
      rule: >-
        Enumerate nonzero field elements in lex order of coordinates
        on the monomial basis (1, z, z^2, z^3, z^4), constant term
        varying fastest. The generator gamma is the first element such
        that omega_i = gamma^{11^i} for i = 0, 1, 2, 3, 4 are
        F_11-linearly independent. Both arms use this basis. Record
        gamma before either dimension is computed.
    curves:
      model: y^2 = x^3 + A x + B
      lex_order_subfield: >-
        (A, B) in {0, 1, ..., 10}^2 with A varying fastest.
      nonsingular: 4 A^3 + 27 B^2 is nonzero in the field of definition
      ordinary: >-
        On F_11, the trace t = 12 - #E(F_11) is nonzero. The point
        count includes the point at infinity and is a square test.
        It selects the curve. It is not the dimension.
      lex_order_extension: >-
        (A, B) in F_{11^5}^2 in the normal-basis coordinate order,
        A varying fastest.
      j_invariant: >-
        j = 1728 * (4 A)^3 / (4 A^3 + 27 B^2), reduced in the field.
        In characteristic 11 the integer 1728 is congruent to 1, and
        the executor uses that reduction rather than an integer outside
        the field. E0 is the first nonsingular curve with j not in F_11.
    summation_polynomial:
      source: knowledge/techniques/KN-TECH-002.md
      formula: >-
        S_3(x1, x2, x3) = (x1 - x2)^2 * x3^2
        - 2 * ((x1 + x2) * (x1 * x2 + A) + 2 * B) * x3
        + ((x1 * x2 - A)^2 - 4 * B * (x1 + x2)).
        Coefficients (A, B) are those of the curve under test.
      admissible_pair: >-
        Enumerate (alpha, beta) in F_{11^5}^2 in the same coordinate
        order, alpha varying fastest, and stop at the first pair among
        the first 64 slots for which Q_E(T) = S_3(alpha, beta, T) on E
        has degree exactly 2 and gcd(Q_E, T^{11} - T) = 1. Degree 2
        means alpha is not beta. The gcd condition is the statement
        that neither root lies in F_11. The null quadratic uses this
        same pair on E0.
    descent:
      substitution: T = t0 omega_0 + t1 omega_1 + t2 omega_2 + t3 omega_3 + t4 omega_4
      coordinate_quadrics: >-
        Expand Q(T) in the normal basis as sum_{i=0}^{4} q_i(t) omega_i.
        Each q_i is a polynomial in (t0, t1, t2, t3, t4) of degree at
        most 2 with coefficients in F_11. These five polynomials are
        the coordinate quadrics. V is their F_11-span inside the
        21-dimensional space of polynomials of degree at most 2.
        Monomial order is grevlex with t0 > t1 > t2 > t3 > t4.
    cycle:
      name: C_5
      action: >-
        (C · f)(t0, t1, t2, t3, t4) = f(t4, t0, t1, t2, t3).
        This is the pullback of the 11-power Frobenius on normal-basis
        coordinates: the coordinates of x^{11} are
        (t4, t0, t1, t2, t3) when the coordinates of x are
        (t0, t1, t2, t3, t4).
      invariant_dimension: >-
        dim(V^{C_5}) is the F_11-dimension of {f in V : C · f = f}.
    methods:
      method_A: >-
        Row-reduce the five quadrics. On a general element of that
        span, solve C · f - f = 0. The dimension of the solution space
        is the invariant dimension. The rank of the row-reduced span
        is dim V.
      method_B: >-
        Apply the projector 9 * (I + C + C^2 + C^3 + C^4), where 9 is
        used only after the executor has checked that 5 * 9 ≡ 1
        (mod 11). The rank of the image of the projector on V is the
        invariant dimension.
      agreement: the two methods must return the same integers
    transposition_control:
      name: L
      action: >-
        (L · f)(t0, t1, t2, t3, t4) = f(t1, t0, t2, t3, t4).
        L swaps the first two coordinates and fixes the other three.
        It is not a power of the 5-cycle C_5.
      prediction: >-
        The invariant dimension of V_E under L is not 1. The value 1
        means the cycle is not distinguished from this permutation.
    pre_registered:
      invariant_dimension_object: 1
      invariant_dimension_null: 0
      pair: [1, 0]
      span_rank_object: 5
      transposition_invariant_dimension: not 1
    seeds: [0]
    enumeration_order: >-
      Seed 0 names the lex rules above. It is not a pseudorandom draw.
    forbidden:
      - Do not claim an ECDLP exponent improvement.
      - Do not build a factor base, a Gröbner basis, or a discrete-log solver.
      - Do not use the curve y^2 = x^3 + x + 1.
      - Do not substitute the integers 1 and 0 for the linear algebra.
      - Do not choose a different pair on E0.
      - Do not change the normal basis between the two arms.

  controls:
    - id: five-invertible
      statement: 5 * 9 ≡ 1 (mod 11), so the trivial projector is defined.
      pass_condition: the congruence holds before any dimension is reported
      on_fail: The run is invalid. No dimension is read.
    - id: null-j
      statement: The selected E0 is nonsingular and its j-invariant is not in F_11.
      pass_condition: both hold
      on_fail: The null arm is invalid. No dimension pair is read.
    - id: two-methods
      statement: >-
        Method A and method B agree on dim V_E, on both invariant
        dimensions, and on the transposition control.
      pass_condition: four agreements
      on_fail: >-
        The instrument disagrees with itself. The run is invalid. No
        dimension is read as the prediction.
    - id: transposition
      statement: >-
        The invariant dimension of V_E under L is not 1.
      pass_condition: the agreed value is an integer other than 1
      on_fail: >-
        The cycle is not distinguished from the transposition. If the
        dimension pair is (1, 0) this is not success.
    - id: admissible-pair
      statement: >-
        An admissible (alpha, beta) exists in the first 64 slots.
      pass_condition: the pair is recorded together with deg Q_E = 2
      on_fail: >-
        There is no quadratic in the frozen window. The outcome is the
        existence negative. It is not a dimension pair and it is not success.

  independent_variables:
    - the curve, E or the null E0
    - the linear map, the Frobenius cycle C_5 or the transposition L
    - the linear-algebra method, A or B

  metrics:
    primary:
      - id: dimension_pair
        statement: >-
          The ordered pair (invariant dimension of V_E under C_5,
          invariant dimension of V_0 under C_5). The prediction is
          (1, 0). Any other pair of integers is the negative.
    secondary:
      - id: span_rank_object
        statement: >-
          dim V_E, the rank of the five coordinate quadrics of Q_E.
          The pre-registered value is 5. A smaller rank is not success.
      - id: span_rank_null
        statement: >-
          dim V_0, recorded and not predicted.
      - id: transposition_invariant_dimension
        statement: >-
          Invariant dimension of V_E under L. Success requires an
          integer other than 1.
      - id: method_agreement
        statement: Boolean agreement of methods A and B on each reported integer.
      - id: named_objects
        statement: >-
          The recorded (A, B) of E, the recorded (A0, B0) and j of E0,
          the field modulus, the normal-basis generator, and the pair
          (alpha, beta).

  heuristic_under_test: H1
  heuristic_under_test_note: >-
    H1 says the five quadrics on E form a free rank-1 module over
    F_11[C_5], hence invariant dimension 1, and the same pair on E0
    has invariant dimension 0. A pair other than (1, 0) falsifies it
    on this quadratic. The group-algebra fact is not the counter.

  preregistered_prediction:
    quantity: >-
      The shift-invariant dimension of the descended quadratic Q_E on
      the subfield curve E, paired with the same dimension of Q_0 on
      the null curve E0.
    formula: >-
      The pair equals (1, 0). Any other pair of integers is the
      negative. The span rank on E equals 5. The formula that
      motivates the 1 is the dimension of the trivial isotypic
      component of a free rank-1 module over F_11[C_5]. That formula
      is not evaluated in place of the linear algebra.
    source: >-
      Copied from IDEA-20261005-bda728 before any run of
      EXP-FROB-aacf57. The Semaev polynomial is the formula in
      KN-TECH-002, which was opened. No smoothness law is the source
      of the integer 1.

  scale_relevance:
    tier: toy
    justification: >-
      The tested object is one quadratic over F_{11^5}, about 2^17
      field elements, on one subfield curve and one null curve. A
      result here is not a result at cryptographic size and not an
      exponent. No extrapolation to n greater than 5 is authorized.
    correspondence: >-
      Direct linear algebra on a span of five quadrics in five
      variables. No Deuring correspondence is used.

  tail_checks:
    - >-
      There is no smoothness tail. The extreme check is the pair
      itself. A single disagreement between method A and method B
      already makes the run invalid. One pair other than (1, 0) is
      already the negative. The transposition returning 1 is the
      check that the cycle was not an arbitrary permutation.

  replication:
    seeds:
      - name: lex-basis
        algorithm: the modulus, basis, curve, and pair rules in inputs
        seed: [0]
        note: >-
          One exhaustive pass by two methods. Adding another quadratic
          is a protocol amendment. Seed 0 does not draw a sample.
    independent_instances: 1
    independent_instances_note: >-
      One quadratic. E0 is the null, not a second copy of the
      prediction 1. Methods A and B are two implementations of one
      dimension.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
    budget_note: >-
      Time and CPU figures are advisory machine-protection watches
      (docs/research-budget-policy.md). They do not change the fields,
      the quadratic, or the pair (1, 0). maximum_runs is 2 so one
      infrastructure retry may take a new run id. Watch expiry is
      failed_infrastructure, never a negative mathematical result.

  procedure:
    identities: >-
      Build m(z), the normal basis, E, and E0, in that order. Check
      5 * 9 ≡ 1 (mod 11) and check that j(E0) is not in F_11. Record
      the names. Then search the first 64 pairs.
    dimensions: >-
      Expand Q_E and Q_0. Run method A and method B on V_E under C_5,
      on V_0 under C_5, and on V_E under L. Record both integers and
      whether they agree. Do not emit a verdict from a single method.
    mechanism_assignment:
      - observation: >-
          The projector inverse checks, E0 has j not in F_11, an
          admissible pair exists in the first 64 slots, S_3 is not
          the zero polynomial, methods A and B agree, dim V_E is 5,
          the transposition invariant dimension is not 1, and the
          dimension pair is (1, 0).
        assigns_to: >-
          The prediction holds on this quadratic. This is not an
          exponent and not a factor base.
      - observation: >-
          The same validity checks hold, methods A and B agree, and
          the dimension pair is any pair of integers other than (1, 0).
        assigns_to: >-
          Negative. The shift-invariant dimension pair is not (1, 0).
          Success does not hold. The observed pair is the datum.
      - observation: >-
          Methods A and B agree, the dimension pair is (1, 0), and
          either dim V_E is not 5 or the transposition invariant
          dimension is 1.
        assigns_to: >-
          Not success. The pair (1, 0) held and a required companion
          integer failed. Report the integers. Do not call this the
          primary negative.
      - observation: >-
          No admissible pair exists in the first 64 slots.
        assigns_to: >-
          Existence negative. There is no dimension pair to score.
          This is not success and it is not a wrong pair.
      - observation: >-
          5 is not invertible, j(E0) lies in F_11, the two methods
          disagree, S_3 expands to the zero polynomial, the arms use
          different bases or different pairs, or the integers 1 and 0
          were substituted for the linear algebra.
        assigns_to: >-
          Invalid. Not evidence for either reading of the pair (1, 0).
      - observation: >-
          The watch expires, a dependency is missing, or the process crashes.
        assigns_to: >-
          failed_infrastructure. Not evidence.

  stopping_rules:
    - >-
      Stop when the agreed dimension pair, the span rank on E, and the
      transposition dimension are recorded, or when an invalid row or
      the existence row fires.
    - Do not add another quadratic, another extension, or a factor base.
    - Watch expiry stops the run as failed_infrastructure.

  invalidation_rules:
    - >-
      A timeout, crash, memory abort, or missing dependency is
      failed_infrastructure and is not evidence against the hypothesis.
    - Substituting the integers 1 and 0 for the linear algebra invalidates the run.
    - Scoring a dimension when methods A and B disagree invalidates the run.
    - Scoring a dimension when j(E0) lies in F_11 invalidates the run.
    - Reporting success when the pair is not (1, 0) invalidates the run.

  success_criterion: >-
    The run is a success for the prediction exactly when the first row
    of mechanism_assignment holds: the shift-invariant dimension is 1
    on E and 0 on the null E0. Any other completed assignment is not
    this success. The second row is a negative, so success can fail.

  falsification_criterion: >-
    The prediction is falsified when the second row holds: the agreed
    dimension pair is any pair of integers other than (1, 0). The third
    row does not replace that negative. The fourth row falsifies the
    existence of the quadratic in the frozen window and does not invent
    a dimension pair. The fifth and sixth rows falsify nothing.

  required_artifacts:
    - experiments/EXP-FROB-aacf57/runs/RUN-*/manifest.yaml
    - experiments/EXP-FROB-aacf57/runs/RUN-*/stdout.txt
    - experiments/EXP-FROB-aacf57/runs/RUN-*/stderr.txt
    - experiments/EXP-FROB-aacf57/runs/RUN-*/raw-result.json
    - experiments/EXP-FROB-aacf57/runs/RUN-*/verdict.yaml
  artifact_contents:
    raw-result.json: >-
      The modulus, the normal-basis generator, the coefficients of E
      and of E0, j(E0), the pair (alpha, beta), the degree of Q_E,
      and for each arm and for the transposition the method A integer,
      the method B integer, and whether they agree.
    verdict.yaml: >-
      Exactly one assignment row from mechanism_assignment, or
      failed_infrastructure with a reason. The verdict quotes the row.
      It does not change hypothesis status. It does not claim an exponent.

  assigned_to: executor
  zero_runs_in_design: true
