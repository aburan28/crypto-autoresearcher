experiment:
  id: EXP-FALCON-537872
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-c7ddc2; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-c7ddc2
  question_id: RQ-FNDSA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Three-role precision ablation of a toy Klein sampler, measuring divergence against exact
    arithmetic per role and fitting the growth exponent of the divergence statistic in the number
    of signatures per key.
  objective: 'The uncertainty a run reduces is whether a Gaussian sampler''s precision requirement
    is a scalar or a vector. In parts: (i) whether the three declared roles, once-per-key tree constants,
    per-signature recursion arithmetic, and base-sampler comparison constants, can be assigned unambiguously
    and ablated independently, evidenced by the count of quantities needing the tie-breaking rule
    and by the logging-only null reading identically zero; (ii) how divergence from exact arithmetic
    depends on each role''s precision separately, reported as a three-way ablation table with the
    other two roles held at 53 bits, and whether the most and least damaging roles differ by at least
    a factor of four; (iii) whether the fitted growth exponent of the divergence statistic in the
    number of signatures under one key is 1.0 for the key-fixed role and 0.5 for the signature-fresh
    roles, which would establish the correlation-class mechanism independently of any magnitude. A
    run does not reduce uncertainty about deployed parameter sets, about any released implementation''s
    internal structure, about what precision any specification requires, or about security, and no
    procedure stage produces such a quantity.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: for the toy sampler implementation
      and toy bases built in this run, at d in {4, 8, 16}, sigma in {1.5, 2.0}, and the declared role
      assignment, divergence takes the reported values across the ablation grid and the fitted growth
      exponents take the reported values with the reported intervals. WHAT DOES NOT FOLLOW: nothing
      about FN-DSA-512 or FN-DSA-1024, nothing about any released implementation, nothing about any
      specification''s precision requirement, nothing about how many signatures an adversary would
      need, and nothing about security. A role that dominates divergence in this toy implementation
      is a fact about this implementation, and a growth exponent is a statement about correlation
      structure rather than about exploitability.'
  inputs:
    procedure: 'STAGE 0, cost under one hour: freeze the role assignment rule, the tie-breaking rule,
      the aggregated statistic, the precision grids, bases and widths. STAGE 1, cost about one day
      of implementation: instrument the toy sampler so each role reads an independent precision parameter
      through the shared emulator, and enumerate every real-valued quantity with its role label. STAGE
      2, cost minutes: run the logging-only ablation null; HALT IF NONZERO. STAGE 3, cost about an
      hour: run the all-53 null and both injected-bias positive controls at N up to 10^5. STAGE 4,
      cost a few hours: run the three one-dimensional ablations, precision in 12, 16, 20, 24, 32 and
      40 for the ablated role and 53 for the others, at d in 4, 8 and 16 and sigma in 1.5 and 2.0,
      ten independent keys each, 10^5 signatures per cell. STAGE 5, cost about an hour: run the N-ladder
      at 10, 100, 1000, 10000 and 100000 for each role and fit growth exponents. STAGE 6, cost a few
      hours: fill the two-dimensional slice at four values each and compute additivity residuals.
      STAGE 7, cost under an hour: assemble the table, exponents and all intervals.'
    instrument: Pure Python 3 for the toy sampler with the shared p-bit mantissa emulator over Python
      integers, the same emulator validated in the enumeration entry of this batch, so the emulator
      is a shared instrument rather than three separate ones. numpy for accumulating the statistic
      over 10^5 signatures per cell and for the log-log fits. Exact-arithmetic reference expectations
      computed in fractions.Fraction. Run manifests through harness/runner.py. No Sage, no external
      computer algebra, no network.
    parameters: Dimensions d in {4, 8, 16}. Widths sigma in {1.5, 2.0}. Role precisions each swept
      over {12, 16, 20, 24, 32, 40} with the other two at 53. Ten independently generated toy keys
      per cell. Signatures per cell 10^5, with an N-ladder at 10, 100, 1000, 10000 and 100000 for
      the exponent fits. Two-dimensional slice over role one by role two at 16, 20, 24 and 32, sixteen
      cells, at d = 8 and sigma = 2 only. Injected bias magnitudes 1e-2, 1e-3 and 1e-4 for each of
      the two positive controls. Total signal cells 3 roles times 6 precisions times 3 dimensions
      times 2 widths times 10 keys = 1080.
  controls:
  - All-53 null arm through the identical pipeline, fitted growth exponent must be consistent with
    no signal.
  - 'Logging-only ablation null: lower the precision of a quantity that cannot reach the output, must
    produce identically zero divergence.'
  - Positive control with an injected constant per-key bias of known size, must fit growth exponent
    1.0.
  - Positive control with an injected fresh per-signature bias of known size, must fit growth exponent
    0.5.
  - 'Key-resampling control: repeat the role-one arm over ten independent keys and confirm the fitted
    exponent is stable, since a key-fixed effect must not depend on which key.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null arm is a sampler with ALL THREE roles at the reference precision
    53, run through the identical ablation pipeline and the identical growth-exponent fit. The null
    must show no growth of divergence with N beyond the estimator''s own square-root noise floor,
    and its fitted exponent must be consistent with the no-signal value within its confidence interval.
    A second null ablates a role that provably cannot affect the output, for example the precision
    of a quantity used only for logging, which must produce identically zero divergence. A positive
    control injects a known constant per-key bias and must produce a fitted growth exponent of 1.0,
    and a second injects a fresh per-signature bias and must produce 0.5.'
  independent_variables:
  - precision of role one, the once-per-key tree constants
  - precision of role two, the per-signature recursion arithmetic
  - precision of role three, the base-sampler comparison constants
  - number of signatures per key N
  - lattice dimension d
  metrics:
    primary:
    - divergence of the frozen statistic from its exact-arithmetic expectation, per cell
    - fitted growth exponent in N with confidence interval, per role
    - ratio of divergence between the most and least damaging role at equal precision reduction
    - additivity residual on the two-dimensional slice
    secondary:
    - across-key variance of the role-one divergence
    - count of quantities assigned by the tie-breaking rule
    - wall-clock per cell
    - fraction of cells whose control flow differed from the reference cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The growth exponent in the dependence of the divergence statistic on the number of signatures
      drawn under a single key, fitted separately for each ablated role.
    formula: Deviation(N) = A * N^beta, with beta = 1.0 predicted for role one because a key-fixed
      common-mode error adds coherently across signatures, and beta = 0.5 predicted for roles two
      and three because signature-fresh errors add incoherently. Deviation is the absolute difference
      between the sample mean of the frozen linear functional over N signatures and its exact-arithmetic
      expectation, and A is left free in the fit.
    source: Pre-registered in the parent proposal IDEA-20260816-c7ddc2 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at d in {4, 8, 16} against a deployed dimension of 1024 or 2048, sigma
      in {1.5, 2.0} against a deployed sigma of order 165, and role precisions from 12 to 53 bits.
      TRANSFER ASSUMPTION, STATED: the growth exponents 1.0 and 0.5 are consequences of correlation
      structure and are dimension-free in the argument, so if the argument holds they would not change
      with dimension; the contract tests that dimension-independence directly by sweeping dimension
      over a factor of four and reports the measured stability rather than assuming it. The ablation
      TABLE by contrast is a magnitude and carries no transfer claim whatsoever.'
    correspondence: null
  tail_checks:
  - Report the across-key spread of the role-one divergence and flag any cell where one key contributes
    more than half the effect.
  - Check the fraction of cells whose control flow differed from the reference cell, since a control-flow
    change invalidates the comparison for that cell.
  - Verify at the largest N that the estimator noise floor, measured from the all-53 null, is at least
    a factor of five below the smallest reported signal.
  - Report the additivity residual with its own confidence interval rather than as a point value.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report instrument failure if the logging-only ablation is nonzero.
  - Halt any role arm whose control-flow difference rate exceeds 5 percent of cells and report it
    as a measured limit of the ablation method at that precision.
  - Cap N at 10^5 per cell regardless of whether the exponent fit has converged, and report the achieved
    confidence interval rather than extending the budget.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The logging-only null reads zero, the all-53 null shows no growth, both injected-bias
    positive controls recover their forced exponents within 0.15, and every role's growth exponent
    is estimated with a confidence half-width below 0.15.
  falsification_criterion:
  - Logging-only ablation nonzero, or all-53 null showing growth.
  - Either positive control failing to recover its forced exponent within 0.15.
  - Role-one exponent not distinguishable from role-two exponent at N = 10^5.
  - All three roles' divergences within a factor of four at equal precision reduction, refuting separability.
  - More than a quarter of real-valued quantities requiring the tie-breaking rule.
  - Control-flow differences exceeding 5 percent of cells, making the ablation method itself unsound
    at these precisions.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-c7ddc2
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The exact role assignment rule and its tie-breaker are described but not written; a Coordinator
    must fix them before freezing because they partly determine the answer.
  - The frozen linear functional used as the aggregated statistic is unspecified, and the growth-exponent
    argument holds only for a functional linear in the perturbation.
  - Whether a control-flow change under low precision should void a cell or be reported as part of
    the effect is a judgment the record leaves open.
  - The claim that the exponents are dimension-free is an argument, not a derivation written out here,
    and should be checked symbolically before the dimension sweep is authorized.
