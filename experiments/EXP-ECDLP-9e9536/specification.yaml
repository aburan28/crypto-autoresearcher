experiment:
  id: EXP-ECDLP-9e9536
  hypothesis_id: H-ECDLP-b51c3d
  version: 1
  title: >
    Three-chart gluing-obstruction instrument on
    frozen Z/15 coset atlas and Z/11 plant
  status: approved
  approved_by: coordinator
  approved_at: '2026-09-08'
  approval_decision: DEC-20260908-9e18aa
  approval_basis: >
    Standing user authorization recorded in AGENTS.md on
    2026-09-06 (ideas and experiments always approved once
    the protocol is complete). Coordinator completeness
    check is DEC-20260908-9e18aa after TASK-20260908-b97365.
    User confirmation is not an outstanding gate.
  frozen: true
  frozen_at: '2026-09-08'
  execution_authorized: true
  execution_authorized_note: >
    Stage 0 only. Stages 1 and later remain unauthorized
    until an independent review of the Stage 0 instrument
    holds and a later Coordinator decision extends
    execution_authorized_stages. This approval does not
    authorize Stage 1 of EXP-ECDLP-90f602, does not
    authorize Stage 2 of EXP-ECDLP-4be480, does not
    authorize Stage 2 of EXP-ECDLP-6a97f4, does not
    authorize Stage 17 of EXP-ECDLP-420e73, does not
    authorize Stage 5 of EXP-ECDLP-a98ea9, does not
    classify W, and does not change H-ECDLP-4afa77,
    H-ECDLP-2ac931, H-ECDLP-e9d9bb, H-ECDLP-77caa5,
    H-ECDLP-07c7c6, H-ECDLP-2ade73, or H-ECDLP-a3598b.
  execution_authorized_stages: [0]
  execution_authorized_decision: DEC-20260908-9e18aa
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260908-b97365
  source_proposal: IDEA-20260905-970b2f
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-9e18aa under the standing 2026-09-06
    user authorization. Stage 0 is the gluing
    instrument. A priced overlap-width search is a
    later stage and is not run here.

  objective: >
    Compute obstruction and refuse on one frozen
    family (COS15, PLANT11, NULL11) and decide
    whether the gluing instrument works. Stage 0
    does not search a cheaper atlas, does not
    decode a scalar, and does not authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: COS15 exact +1 intertwining
      and obstruction 0; PLANT11 pairwise SAT and
      globally refused; NULL11 obstruction recorded
      and not used as a rigidity gate; empty and
      two-chart objects rejected. Certificate kind none.
    formula: >
      COS15: v(x)=x mod 5 on Z/15; intertwine means
      v(x+1)=(v(x)+1) mod 5 for all x; obstruction=0.
      PLANT11 charts A={0,1,2,3,4}, B={3,4,5,6,7},
      C={7,8,9,10,0} on Z/11. R_AB and R_BC require
      equal labels on the overlap; R_CA requires
      unequal labels. Pairwise SAT, global UNSAT,
      refuse. NULL11 uses the same charts with the
      frozen all-zero labelling (obstruction 0,
      recorded only). FORCED Stage 0: fixture_pass,
      coset_zero_obstruction_pass, plant_refuse_pass,
      reject_invalid_pass, null_recorded_pass all true.
    source: >
      ledger/proposals/IDEA-20260905-970b2f.yaml
      predictions[0] and minimal_test.
      Provenance internal; read in this design session.

  design_tightening_stage0_is_instrument_not_width: >
    IDEA-20260905-970b2f also flags priced overlap
    width as a later question. Stage 0 does not
    search a cheaper atlas and does not claim a
    compact global section. That comparison is a
    Stage 1+ object. This is a disclosed tightening,
    not a silent change of the idea's claim.

  inputs:
    fixture:
      coset:
        id: COS15
        n: 15
        feature_mod: 5
        transition: 1
        role: known_false_exact_quotient
        must_intertwine: true
        must_obstruction: 0
      plant:
        id: PLANT11
        n: 11
        charts:
          A: [0, 1, 2, 3, 4]
          B: [3, 4, 5, 6, 7]
          C: [7, 8, 9, 10, 0]
        relations:
          AB: equal
          BC: equal
          CA: unequal
        role: cycle_inconsistent_plant
        must_pairwise_sat: true
        must_global_sat: false
        must_refuse: true
      matched_null:
        id: NULL11
        n: 11
        charts:
          A: [0, 1, 2, 3, 4]
          B: [3, 4, 5, 6, 7]
          C: [7, 8, 9, 10, 0]
        labels:
          A: 0
          B: 0
          C: 0
        role: matched_null
        obstruction_is_not_a_gate: true
      invalid:
        - id: ATLAS-empty
          charts: {}
          must_reject: true
        - id: ATLAS-twochart
          charts:
            A: [0, 1]
            B: [1, 2]
          must_reject: true
      working_model: >
        Exact three-chart compatibility on Z/n.
        Not a decoder. Not a priced-width search.
      do_not_hunt_a_new_atlas: true

  independent_variables:
    - atlas in the frozen family
    - pairwise SAT versus global refuse

  null_object:
    name: COS15 exact coset feature
    construction: >
      v(x)=x mod 5 on Z/15. Translation by 1
      intertwines exactly. This is the known-false
      object for a prime-order rigidity reading.
    non_degeneracy_check: >
      coset_zero_obstruction_pass must be true
      before any plant refuse is read as a
      measurement.
    dynamic_range_demonstration: >
      ATLAS-empty and ATLAS-twochart must be
      rejected before obstruction is read as a
      fiber. An argument that still reports a
      cycle obstruction on those objects proves
      too much.

  controls:
    - COS15 exact intertwining (known-false / proves-too-much)
    - PLANT11 pairwise SAT / global UNSAT
    - NULL11 same-shape recorded obstruction
    - empty and two-chart rejection
    - exact discrete constraints, no sampling
    - charts frozen before any obstruction is read

  metrics:
    primary:
      - fixture_pass boolean
      - coset_zero_obstruction_pass boolean
      - plant_refuse_pass boolean
      - reject_invalid_pass boolean
      - null_recorded_pass boolean
    secondary:
      - COS15 obstruction integer
      - PLANT11 pairwise_sat / global_sat
      - NULL11 obstruction integer
      - wall-clock seconds and peak RSS

  heuristic_under_test: none

  scale_relevance:
    tier: toy
    justification: >
      One composite group of order 15 and one
      prime-order group of order 11 with a frozen
      three-chart family. No transfer to
      cryptographic n or to an elliptic atlas.
    correspondence: null

  tail_checks:
    - COS15 feature is x mod 5 on Z/15
    - PLANT11 charts and relations are exactly the frozen lists
    - NULL11 labels are the frozen all-zero triple
    - ATLAS-empty and ATLAS-twochart are rejected

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 0 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: fixture_pass,
      coset_zero_obstruction_pass, plant_refuse_pass,
      reject_invalid_pass, and null_recorded_pass.
      A miss classifies the run failed_infrastructure
      if it is a size or encoding bug, otherwise it
      is a scoped falsification of P-S0-GLUE.
    - Stages 1 and later are not authorized.
    - Do not hunt a new atlas.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 0 is not in execution_authorized_stages
    - Changing n, charts, or relations after this freeze
    - Hunting a new atlas because a frozen plant fails
    - Reading Stage 0 as a priced-width search or decoder
    - Reading Stage 0 as H1, a W class, or an ECDLP advantage
    - Authorizing Stage 1 of EXP-ECDLP-90f602 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-4be480 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-6a97f4 from this contract
    - Authorizing Stage 17 of EXP-ECDLP-420e73 from this contract
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this contract
    - Editing EXP-ECDLP-a5f766 or H-ECDLP-a3598b
    - Changing H-ECDLP-4afa77, H-ECDLP-2ac931, H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6, or H-ECDLP-2ade73
    - Designing IDEA-20260905-7720ef as a second object

  success_criterion: >
    Stage 0 succeeds as a measurement when
    fixture_pass, coset_zero_obstruction_pass,
    plant_refuse_pass, reject_invalid_pass, and
    null_recorded_pass are true, and the run
    manifest carries certificate.kind none.
    Success is instrument reproduction, not a
    priced-width claim and not an attack.

  falsification_criterion: >
    A certified nonzero COS15 obstruction or failed
    intertwining, after fixture_pass, is a scoped
    miss of P-S0-GLUE. A certified accept of
    PLANT11 as a global certificate is a scoped
    miss of P-S0-GLUE. Infrastructure bugs are not
    mathematics. Stage 0 does not test P-S1-WIDTH.

  required_artifacts:
    - Stage 0 raw-result.json with the five gates
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt

  assigned_to: executor

  limitations:
    - Two toy groups.
    - No priced-width search.
    - No decoder. No cryptographic transfer.
    - No Stage 1 of 90f602. No Stage 2 of 4be480.
      No Stage 2 of 6a97f4. No Stage 17 of 420e73.
      No Stage 5 of a98ea9.
    - Certificate kind none. No solve or attack.
    - W is not classified.
    - EXP-ECDLP-a5f766 remains another lane.
    - Do not hunt a new atlas.
    - IDEA-20260905-7720ef is not a second object.
