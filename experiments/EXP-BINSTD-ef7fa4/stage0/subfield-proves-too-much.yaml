# Subfield proves-too-much control (Stage 0 symbolic row).
# Baseline embedding: V = F_q inside F_{q^n} (Oakley / IDEA-20260922-70a67c).
# There V^{(k)} = V for all k (subfield closed under multiplication), so
# symmetrisation DOES shrink unknowns. If the packet's subspace formula
# predicted saturation (growth with k) on this object, it has proved too much.
experiment_id: EXP-BINSTD-ef7fa4
task_id: TASK-20261001-2fe20a
stage: 0
artifact: subfield-proves-too-much
control_name: subfield_proves_too_much
object: >-
  Symbolic: V = F_q subset F_{q^n} (subfield factor base). Product spaces
  satisfy V^{(k)} = V for every k, dim constant in k.
subfield_row:
  setting: 'V = F_q in F_{q^n} (symbolic; not executed at RC-1)'
  dim_V: 'log2(q)'
  dim_V_k_all_k: 'dim V  (no growth, no saturation)'
  symmetrised_unknown_count: 'm * dim V'
  plain_unknown_count: 'm * dim V'
  saturation_predicted_by_subspace_formula: false
  note: >-
    The subspace formula dim V^{(k)}=min(k(l-1)+1,n) applies only when V is
    a coordinate subspace, not a subfield. Applying it verbatim to a subfield
    would falsely predict growth — that mis-application is the proves-too-much
    failure mode this row guards against.
packet_formula_on_subfield:
  if_naively_applied: 'would predict dim growth with k'
  correctly_scoped: 'formula restricted to polynomial-basis subspaces'
  proves_too_much: false
  reason: >-
    Packet scopes the formula to V=span{1,z,...,z^{l-1}}; subfield case is
    named as the baseline where V^{(k)}=V and symmetrisation works (JV 2010 /
    IDEA-20260922-70a67c). Control passes: formula does not claim saturation
    on the subfield object.
rc1_fixture_crosscheck:
  n: 17
  l: 6
  m: 3
  subspace_dims_expected: [6, 11, 16]
  subfield_contrast: 'If V were a subfield of size 2^6, dims would be [6,6,6]'
certificate:
  kind: none
  verified: null
