# =============================================================================
# EXP-BINSTD-ef7fa4 -- VERSION 1 (APPROVED by DEC-20261001-dba19e) frozen
# contract for H-BINSTD-770ec3: Stage 0 product-space saturation tables
# (n=131 + RC-1) + preregistered predictions; Stage 1 RC-1 symmetrised S_4
# spurious-lift census with lift-by-factoring; Stage 2 random-subspace null;
# Stage 3 Frobenius-arm null (a77711) on the n=17 Koblitz sibling.
#
# Source: IDEA-20260926-120d6a under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# ZERO RUNS in this design packet. Stages 0-3 authorized for later
# executor TASK-20261001-2fe20a. No AUXIN. Amazon Bedrock prohibited.
# packaging_only false.
#
# certificate.kind vocabulary (docs/claims-and-verification.md):
#   discrete_log | decomposition | key_recovery | none
# Stage-0 / dimension / metric-only manifests use none.
# Runs that claim a genuine decomposition recovered by lift MUST use
# certificate.kind: decomposition and re-verify independently.
# =============================================================================
experiment:
  id: EXP-BINSTD-ef7fa4
  hypothesis_id: H-BINSTD-770ec3
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260926-120d6a
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Product-space saturation table (n=131) + RC-1 spurious-lift factor for
    S_m-symmetrised subspace descent; Frobenius arm preregistered null
  status: approved
  approved_by: DEC-20261001-dba19e
  approved_at: '2026-10-01'
  packaging_only: false
  approval:
    approved_by: DEC-20261001-dba19e
    composing_decision: DEC-20261001-dba19e
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Does NOT claim a break or rho
      competitiveness. Does NOT authorize deployed-curve attacks.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2, 3]
    optional_stages: []
    scientific_execution_authorized_note: >-
      Stages 0-3 are the required success path. Stage 0 is analysis /
      table arithmetic and MUST complete before Stage 1. Stages 1-3 are
      toy n=17 only. No deployed-curve attacks. No Amazon Bedrock.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    (A) Freeze Stage-0 product-space dimension tables at n=131 balanced
    (m,l) cells and at RC-1, plus preregistered spurious-factor predictions,
    BEFORE any scientific run.
    (B) At RC-1 (n=17, m=3, l in {4,5,6}) measure dim V^{(k)} by explicit
    span (P2) and the spurious factor
    (e-solutions)/(genuine decompositions) with exact lift-by-factoring
    (P1), using exhaustive e-space enumeration at l in {4,5} and
    declared sampling/censoring at l=6.
    (C) Repeat Stage 1 on a size-matched random subspace (P3).
    (D) On the Koblitz n=17 sibling with stable subspace dim 8, compare
    W_4 / first-iteration-containing-1 work on a 17-conjugate orbit vs
    one instance, against an ordinary RC-1 unrelated-target null (P4;
    preregistered null).
    Claim no deployed attack and no exponent move.

  class: heuristic_validation
  class_note: >-
    Hybrid: Stage 0 is a structural_certificate (dimension arithmetic);
    Stages 1-2 are heuristic-validation of HEUR-BINSTD-770ec3-H1
    (spurious count); Stage 3 is a preregistered-null shape check for
    a77711. Measured vs modeled columns stay separate. No
    exponent-moving claim.

  scope:
    included:
      - >-
        Stage 0: write dimension-table-n131.yaml for (m,l) in
        {(5,23),(5,28),(6,22),(6,24),(8,20)} with per-k dims and sums vs
        ml; dimension-table-rc1.yaml for l=4..9, k=1..3; 
        preregistered-predictions.yaml (spurious factors 2^{9.6}/2^{13.6}/
        2^{17.6} at l=4/5/6); methodological-note.md; subfield
        proves-too-much symbolic row.
      - >-
        Stage 1: RC-1 cell (n=17, f=t^17+t^3+1, A=97044, B=126251,
        #E=4*32603); V={deg<l}; m=3; 50 subgroup targets seed
        2026092731; build symmetrised S_4 in (e1,e2,e3,x_R); enumerate
        e-space solutions (exhaustive at l=4,5; at l=6 sample >=2^24
        assignments or degree-D closure for refutation + lower bound);
        lift every found e-solution by factoring the cubic; genuine
        count by exact enumeration over V^3; report P1, P2,
        lift_agreement.
      - >-
        Stage 2: size-matched random subspace of dimension l (recorded
        seed); same metrics (P3).
      - >-
        Stage 3: Koblitz sibling y^2+xy=x^3+x^2+1 at n=17 (order
        2*65587); V=ker g(sigma) dim 8; 5 targets with 17 conjugates;
        compare W_4 work / first-iter-containing-1 for orbit system vs
        17x one instance; ordinary RC-1 with 17 unrelated targets as
        null (P4).
    excluded:
      - Any scientific ECDLP / GHS / decomposition attack at n>=41
      - Claiming the mechanism beats matched rho on any deployed curve
      - Claiming an exponent improvement from symmetrisation on subspace bases
      - Quietly editing IDEA-20260926-120d6a claim text
      - Using non-vocabulary certificate.kind values
      - AUXIN edits
      - Amazon Bedrock
      - Re-scoring predictions after observing Stage 1+ without protocol_amendment

  inputs:
    proposal: ledger/proposals/IDEA-20260926-120d6a.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-770ec3.yaml
    frobenius_null: ledger/proposals/IDEA-20260906-a77711.yaml
    subfield_baseline: ledger/proposals/IDEA-20260922-70a67c.yaml
    rho_baseline: knowledge/findings/KN-FIND-aa2efc.md
    conservation: knowledge/findings/KN-FIND-007.md
    code_refs:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - experiments/EXP-CERTBIN-e94b27/impl/instances.py
      - experiments/EXP-CERTBIN-e94b27/impl/macaulay.py
      - experiments/EXP-CERTBIN-e94b27/impl/closure.py
    cells:
      Stage0-n131:
        n: 131
        cells:
          - {m: 5, l: 23, predicted_dims: [23, 45, 67, 89, 111], predicted_sum: 335, ml: 115}
          - {m: 5, l: 28, predicted_dims: [28, 55, 82, 109, 131], predicted_sum: 405, ml: 140}
          - {m: 6, l: 22, note: 'e_6 dim min(6*21+1,131)=127'}
          - {m: 6, l: 24, note: 'e_6 saturates at 131'}
          - {m: 8, l: 20, note: 'every e_k with k>=5 saturates'}
        role: structural_certificate_table
      BIN-TOY-RC1:
        n: 17
        irreducible: t^17 + t^3 + 1
        A: 97044
        B_curve: 126251
        group_order: 4 * 32603
        m: 3
        l: [4, 5, 6]
        V: polynomial_basis_window_deg_lt_l
        targets: 50
        seed: 2026092731
        predicted_spurious_log2: [9.6, 13.6, 17.6]
        role: primary_spurious_lift_census
      BIN-TOY-random-subspace:
        n: 17
        l: [4, 5, 6]
        V: random_matched_dimension
        role: faster_saturation_null
      BIN-TOY-koblitz-frobenius:
        n: 17
        curve: y^2 + xy = x^3 + x^2 + 1
        group_order: 2 * 65587
        V: ker_g_sigma_dim_8
        targets: 5
        conjugates: 17
        role: frobenius_arm_P4

  controls:
    - name: exact_enumeration_ground_truth
      object: >-
        Genuine decompositions counted by exact enumeration over V^m
        (blocking for P1 numerator/denominator).
    - name: lift_by_factoring
      object: >-
        Every e-solution lifted by factoring X^m+e_1 X^{m-1}+...+e_m;
        roots-in-V test separates genuine from spurious (observation-collision
        distinguisher).
    - name: random_subspace_null
      object: >-
        Size-matched random subspace; predicted spurious factor at least
        the polynomial-basis value.
    - name: subfield_proves_too_much
      object: >-
        Stage-0 symbolic row with V^{(k)}=V (no saturation); if the
        packet's formula predicted saturation there, it has proved too much.
    - name: ordinary_frobenius_null
      object: >-
        Ordinary RC-1 with 17 unrelated targets; P4 drop must not appear
        here if claimed as Koblitz-structure.
    - name: certificate_kind_vocabulary
      object: >-
        Every run manifest result.certificate.kind is one of
        discrete_log | decomposition | key_recovery | none.
    - name: no_break_guard
      object: No break / attack-cost / rho-beating / exponent claim in any artifact.
    - name: seed_control
      object: Stage 1/2 targets and random subspaces use recorded seed 2026092731 (+ documented replicates if any).

  independent_variables:
    - arm  # poly_basis | random_subspace | koblitz_orbit | ordinary_null
    - n
    - m
    - l
    - enumeration_mode  # exhaustive | sampled | closure_lower_bound
    - seed
    - target_index

  metrics:
    primary:
      - product_space_dims
      - spurious_factor
      - lift_agreement
      - genuine_decomposition_count
      - e_space_solution_count
      - orbit_closure_ratio
    secondary:
      - sampled_assignment_count
      - censoring_flag
      - first_iteration_containing_1
      - W4_work_units
      - peak_rss_bytes
      - wall_clock_s
      - termination_reason

  heuristic_under_test:
    - HEUR-BINSTD-770ec3-H1

  preregistered_prediction:
    quantity: >-
      (A) Stage-0 dims at listed (m,l) equal min(k(l-1)+1, n) per k
      (structural; not a statistical prediction).
      (B) At RC-1 m=3, spurious_factor within factor 4 of
      m! 2^{sum_k dim V^{(k)} - ml} ≈ 2^{9.6}, 2^{13.6}, 2^{17.6}
      at l=4,5,6.
      (C) Random-subspace spurious_factor >= poly-basis value at matched l.
      (D) P4 orbit_closure_ratio consistent with null (no drop) on Koblitz
      vs ordinary.
      (E) lift_agreement = 1.0 on every genuine decomposition.
    formula: >-
      dim V^{(k)} = min(k(l-1)+1, n);
      spurious_factor ≈ m! * 2^{sum_k dim V^{(k)} - m*l};
      genuine ≈ 2^{m*l - n}/m! (balance / conservation form).
    source: >-
      IDEA-20260926-120d6a predictions P1–P4 and H1; H-BINSTD-770ec3;
      KN-FIND-007 conservation cited for genuine-count side.
      Huang et al. 2013 product-space form marked recalled.
    claim_tier: observational_plus_structural
    measured_vs_modeled: >-
      product_space_dims (explicit span), e_space_solution_count,
      genuine_decomposition_count, lift outcomes, W4_work_units,
      wall_s, RSS are MEASURED. Stage-0 n=131 table and the
      m! 2^{sum dim - ml} band are MODELED / arithmetic predictions
      written before Stage 1 and never retuned to Stage 1+ data without
      a protocol_amendment. Sampling lower bounds at l=6 are labeled
      bounds, not point estimates.

  scale_relevance:
    tier: toy
    justification: >-
      Executable cells at n=17; n=131 contribution is Stage-0 dimension
      arithmetic only. No transfer of measured spurious factors to
      deployed solving cost is claimed — only the direction
      (unknown inflation / huge spurious fibre) and the unconditional
      dimension table.
    correspondence: >-
      None exact for solving cost. Transfer assumption for heuristic
      direction only, disclosed; Stage-0 dims need no transfer.

  tail_checks:
    - Largest-l cell (l=6) spurious factor vs prediction (heaviest fibre).
    - Smoothest observed e-solution (if any near-genuine) reported explicitly.
    - Censoring fraction at l=6 sampling disclosed.
    - Random-subspace excess over poly-basis at each l.

  replication:
    seeds:
      - 2026092731
    independent_instances: >-
      Stage 0 deterministic arithmetic (seed-free). Stage 1 primary seed
      2026092731 for 50 targets; exhaustive cells are deterministic given
      frozen RC-1 and V. Stage 2 draws one primary random subspace per l
      from the same seed stream (document subspace basis). Stage 3 uses
      5 recorded targets. Optional replicate seeds may be added only via
      protocol_amendment.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 20
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete when n131 + RC-1 dimension tables, preregistered predictions, methodological note, and subfield control row are written BEFORE Stage 1.
    - Stage 1 complete when P2 reported for required (l,k), P1 reported for l in {4,5} exhaustively and for l=6 with disclosed sampling/censoring, and lift_agreement reported.
    - Stage 2 complete when P3 reported for at least l in {4,5}.
    - Stage 3 complete when orbit_closure_ratio reported for Koblitz arm and ordinary null.
    - Advisory wall-clock: checkpoint and report; never fabricate completion.
    - At l=6, if exhaustive 2^33 is infeasible: record sampling bound and continue; do not invent a point count.

  invalidation_rules:
    - Stage 0 dims disagree with min(k(l-1)+1,n) without identified arithmetic bug
    - Claiming rho-beating, exponent improvement, or deployed attack cost
    - Retuning preregistered spurious-factor band after Stage 1+ without protocol_amendment
    - timeout/crash/OOM → failed_infrastructure, not negative math evidence
    - Amazon Bedrock invocation attempted → abort
    - certificate.kind outside vocabulary → invalid run
    - Genuine decomposition claimed without independent lift/enumeration agreement
    - Editing IDEA-20260926-120d6a claim text

  success_criterion: >-
    Stage 0: dimension tables + predictions + methodological note committed
    before Stage 1.
    Stage 1: P2 exact; P1 within factor 4 of formula at >=2 of {4,5,6}
    OR documented surprise branch (near-1) with lift_agreement=1.0;
    lift_agreement=1.0 on genuine set.
    Stage 2: P3 >= P1 (or documented exception).
    Stage 3: P4 null reported (or anomaly filed as DO-4).
    Decidable from predefined metrics. Positive agreement does NOT
    authorize a deployed claim.

  falsification_criterion: >-
    P2 not exact; OR P1 outside [1/4,4] of formula at two of three l with
    lift_agreement=1.0; OR lift_agreement < 1.0 on any enumerated genuine
    decomposition; OR any rho-beating / exponent / break claim.

  required_artifacts:
    - experiments/EXP-BINSTD-ef7fa4/stage0/dimension-table-n131.yaml
    - experiments/EXP-BINSTD-ef7fa4/stage0/dimension-table-rc1.yaml
    - experiments/EXP-BINSTD-ef7fa4/stage0/preregistered-predictions.yaml
    - experiments/EXP-BINSTD-ef7fa4/stage0/methodological-note.md
    - experiments/EXP-BINSTD-ef7fa4/stage0/subfield-proves-too-much.yaml
    - experiments/EXP-BINSTD-ef7fa4/stage1/spurious-lift-summary.yaml
    - experiments/EXP-BINSTD-ef7fa4/stage1/product-space-dims.yaml
    - experiments/EXP-BINSTD-ef7fa4/stage2/random-subspace-summary.yaml
    - experiments/EXP-BINSTD-ef7fa4/stage3/frobenius-arm-summary.yaml
    - experiments/EXP-BINSTD-ef7fa4/runs/
    - experiments/EXP-BINSTD-ef7fa4/implementation/

  optimistic_assumptions_disclosed:
    - >-
      Spurious-count heuristic treats the symmetrised system as a uniform
      random map F_2^N→F_2^n; bias direction uncertain — measured, not
      assumed tight.
    - >-
      l=6 cell may be a sampling LOWER BOUND on e-solutions; labeled bound,
      not a point prediction.
    - >-
      Polynomial-basis V is the optimistic (slowest-saturating) case for
      the certificate that symmetrisation fails to shrink unknowns.
    - >-
      Stage-3 stable subspace dim 8 is not a balanced l; P4 is shape
      comparison only.

  memory_accounting: >-
    Dominant structures: e-space assignment buffers at l=5 (~2^27
    iterations, streaming; peak RSS expected << 4 GiB if not materialising
    the full table); V^m enumeration tables at small l; Macaulay/closure
    matrices only if l=6 closure path used — peak_rss_bytes reported per
    run and reconciled against declared buffers. No van Oorschot–Wiener
    tradeoff in this contract.

  certificate:
    kind_vocabulary:
      - discrete_log
      - decomposition
      - key_recovery
      - none
    stage0_kind: none
    genuine_decomposition_kind: decomposition
    note: >-
      Lift-recovered genuine decompositions carry certificate.kind
      decomposition and are independently re-checked (roots in V and
      sum-to-target on a fresh curve object). Metric-only and Stage-0
      arithmetic use none.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
