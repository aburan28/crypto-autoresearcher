protocol_amendment:
  experiment_id: EXP-IC-001
  version_from: 2
  version_to: 3
  reason: >-
    The v2 success criterion was conditioned on bit size (>= 2/3 seeds at any
    bit size). At 36-bit with 13 seeds, only 4/13 (31%) have finite K* because
    the Hasse bound makes the subgroup order N vary by 6 orders of magnitude
    at a fixed bit size. The conditional result is definitive: 4/4 instances
    with N > 10^9 have finite K*, and 9/9 with N < 10^8 have K* = infinity.
    The criterion should be conditional on N, not bit size.
  changes:
    - >-
      Success criterion revised from "T_desc < sqrt(N) for >= 2/3 seeds at
      any bit size" to "K* finite for >= 2/3 of instances where sqrt(N) >
      T_desc_gops". This decouples the criterion from the Hasse-bound N
      variation.
    - >-
      Falsification criterion revised from "T_desc >= sqrt(N) at ALL bit
      sizes" to "K* = infinity for ALL instances where sqrt(N) > T_desc_gops".
    - >-
      H-IC-001 prediction metric renamed from crossover_K_star to
      crossover_K_star_conditional_on_N.
  affected_runs: []
  confirmatory_status: preserved
  approved_by: coordinator
