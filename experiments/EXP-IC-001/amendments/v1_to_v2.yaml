protocol_amendment:
  experiment_id: EXP-IC-001
  version_from: 1
  version_to: 2
  reason: >-
    Independent review (TASK-20260726-003, verdict REVISE) identified 5
    blocking objections in the v1 specification. This amendment repairs all
    5 before re-review and execution.
  changes:
    - >-
      BO-1 fix: rho calibration now uses total_group_operations (ALL group
      ops: precompute + walk + verify) instead of walk-only group_operations.
      rho.py modified to count all group ops via _count_mul helper. Fixes
      97% overhead bias at 8-bit.
    - >-
      BO-2 acknowledgment: the T_desc/sqrt(N) crossover is explicitly declared
      implementation-bound (sympy Buchberger vs Python rho). Added to
      interpretation_limits and analysis_methodology. The hypothesis
      statement no longer claims mathematical invariance.
    - >-
      BO-4 fix: S_rel heuristic corrected from N*T_desc to (N/B)*T_desc for
      m=2. The decomposition probability per random target is ~B^2/N (not
      B/N), so N/B targets are needed for B relations, each costing T_desc.
    - >-
      BO-5 fix: S*T^2 frontier comparison dropped from primary metrics.
      With corrected S_rel = (N/B)*T_desc, the condition S*T^2 >= N reduces
      to T_desc^3 >= B, which is nearly always true and thus vacuous. The
      experiment now focuses on K* finiteness only.
    - >-
      BO-6 partial fix: where decompositions exist (8-12 bits), S_rel should
      be measured directly. At bits >= 16 where no decompositions are found,
      the corrected heuristic is used with explicit declaration.
  affected_runs: []
  confirmatory_status: preserved
  approved_by: coordinator
