# EXP-BINSTD-213f22
# Fill-in schedule arithmetic. No matrix is eliminated.
# Approved by DEC-20261003-3931be.
experiment:
  id: EXP-BINSTD-213f22
  hypothesis_id: H-BINSTD-637cbf
  source_idea: IDEA-20261002-7def74
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Surplus numerators versus the hour cap
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-3931be
  objective: >-
    Check the product 960, the excess 4, and the excess 1.
  inputs:
    num_sum: 23
    num_product: 960
    num_span: 4
    levels: 4
    floor: 3
    level_excess: 1
    cells: 12
    hour_cap: 8
    cell_excess: 4
    n_sum: 71
    n_product: 12121
    square_sum: 1779
    square_gap: 672
  controls:
    - >-
      The product of 4, 5, 6, and 8 is 960. Dropping 4 leaves 240
      and invalidates the run.
    - >-
      Twelve exceeds 8 by 4. Four exceeds 3 by 1. The numerator sum
      is 23 and the span from 4 to 8 is 4.
    - >-
      The n sum is 71 and the n product is 12121. The squares 289,
      529, and 961 sum to 1779. Nine hundred sixty-one exceeds 289
      by 672.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {product, excess, square}
    - route in {multiply, subtract}
  metrics:
    primary:
      - num_product
      - cell_excess
      - level_excess
      - implementations_agree
    secondary:
      - num_sum
      - square_sum
      - n_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The product of 4, 5, 6, and 8 is 960. Twelve exceeds 8 by 4.
      Four exceeds 3 by 1.
    formula: >-
      Multiply 4, 5, 6, and 8. Subtract 8 from 12. Subtract 3 from 4.
    source: >-
      IDEA-20261002-7def74 states the n list 17, 23, and 31, the
      surplus multipliers 1, 5/4, 3/2, and 2, the floor of 3 out of
      4, and the hour cap 8, read 2026-10-03. It does not name the
      fill-in bound as an integer. The products were recomputed in
      this design session. That computation is not a run. No matrix
      was eliminated.
  scale_relevance:
    tier: toy
    justification: Four written surplus multipliers and one written hour cap. No transfer to a fill-in ratio.
    correspondence: null
  tail_checks:
    - The excess 4 and the excess 1 are required. A check that stops at the product 960 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the product 960 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The product is not 960.
    - The cell excess is not 4.
    - The level excess is not 1.
    - The numerator 4 is dropped, or a matrix is eliminated.
  success_criterion: >-
    Both runs agree that the product of 4, 5, 6, and 8 is 960, that
    12 exceeds 8 by 4, that 4 exceeds 3 by 1, and that the squares
    sum to 1779.
  falsification_criterion: >-
    The runs agree that the product of 4, 5, 6, and 8 is computed,
    and that product is not 960.
  required_artifacts:
    - experiments/EXP-BINSTD-213f22/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-213f22/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-213f22/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-213f22/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-213f22/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-213f22/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any relation collection, elimination, or fill-in measurement.
    - Any claim that a fill-in ratio stays inside a bound.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
