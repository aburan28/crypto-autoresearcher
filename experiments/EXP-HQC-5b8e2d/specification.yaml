experiment:
  id: EXP-HQC-5b8e2d
  hypothesis_id: H-HQC-c1baab
  derived_from_idea: IDEA-20260821-7a08df
  question_id: RQ-HQC-001
  goal_id: GOAL-HQC-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Joint lower-tail dependence profile R_k(u) of HQC's SIGNED inner-margin vector
    at deployed HQC-1 parameters, gated on a per-sample decoder-consistency
    identity check and refereed against a 16-draw cross-ciphertext re-pairing
    null, a decoder-free structural null, an i.i.d. Bernoulli maximal-removal
    null, an unsigned object-confusion control, a five-point graded sensitivity
    ladder, and a W-conditioned mechanism arm
  objective: >-
    The one uncertainty a run reduces is whether HQC's assumption A17 - that the
    n_e inner-decoder outcomes are independent - holds at the tail depth the DFR
    depends on, AT DEPLOYED PARAMETERS, which no committed record in this corpus
    can currently speak to. A run establishes (i) that the failure event is
    exactly {M_(delta_e+1) < 0} on the SIGNED margin, verified per sample against
    the deployed decoder's own symbol output rather than assumed; (ii) the
    dimensionless ratio R_k(u) over a frozen ladder of quantile depths and orders,
    which equals 1 identically under A17 and therefore measures A17's error
    directly with no model of p_i; (iii) whether that ratio's departure GROWS or
    DIES as k increases toward the index delta_e + 1 = 16 that the DFR actually
    depends on, which decides whether any measured dependence is DFR-relevant at
    all; (iv) whether conditioning on the total error weight W removes the
    departure, which separates the mixture mechanism from the conservation
    mechanism and is what stops a correlation being sold as a cause; and (v) how
    the measured profile compares against SPEC Theorem 6.1's flat R = 1 and
    against eprint 2026/795's independence-free model, IF that model can be
    transcribed. NO ATTACK, NO ORACLE, NO QUERY COUNT, NO KEY RECOVERY, AND NO DFR
    VALUE IS PRODUCED BY ANY OUTCOME.
  what_this_is_not:
    - >-
      Not an attack, not a chosen-ciphertext procedure, not a decryption-failure
      oracle, not a query count, not a key recovery. The headline observable
      requires the TRANSMITTED CODEWORD, which an adversary does not have, so it is
      a simulation instrument and not an attack surface.
    - >-
      NOT A DFR MEASUREMENT. R_k(u) is a dimensionless dependence ratio;
      converting it into a DFR at k = 16 requires an extrapolation stated as a
      numbered heuristic and reported with its bracket, or refused.
    - >-
      Not a statement that HQC is weak or strong. A DFR bound that is conservative
      is not a vulnerability, and a dependence ratio above 1 is not an attack.
    - >-
      NOT A RESULT ABOUT THE RELIABILITY MEASURE D = |M|. The signed margin and
      the reliability measure are DIFFERENT OBJECTS; every table carries which one
      it is computed on, and a citation dropping that label cites something this
      contract does not claim.
    - >-
      Not a claim about eprint 2026/795's contents. No page of that paper has been
      read in this program; its block-level mechanism is known only from a search
      snippet, and the transcription stage exists to replace that.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run
      has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at HQC-1's deployed parameters, under the
      deployed decoder and a pinned tie rule, the joint law of the SIGNED
      inner-margin vector departs from the product of its marginals by a factor R
      at order k and depth u, with a null interval of width W. WHAT DOES NOT
      FOLLOW - no DFR value; no statement that HQC is secure or insecure; no
      verdict that eprint 2026/795's model is right; nothing at depths beyond the
      declared ladder (a statement about depth 1e-4 is NOT a statement about depth
      2^-128); nothing about HQC-3 or HQC-5, whose inner codes differ and whose
      inner DFRs are not monotone in security level; and nothing about
      maximum-likelihood decoding of the whole concatenated code. DEPLOYED
      PARAMETERS ARE NOT A DEPLOYED CLAIM TIER: the toy ceiling is set by the
      certificate standard in docs/claims-and-verification.md, not by the
      parameter values, and nothing here carries a certificate of anything.
  inputs:
    procedure: >-
      STAGE 0, PRE-REGISTRATION BEFORE ANY DATA EXISTS - freeze and HASH: the
      SIGNED margin definition; the exact tie rule (BOTH the deployed
      deterministic rule and a random-tie-break arm are run); the fact that
      D = |M| is a DIFFERENT quantity with its own table; the quantile ladder
      u in {1e-1, 3e-2, 1e-2, 3e-3, 1e-3, 3e-4, 1e-4}; the orders
      k in {2, 3, 4, 6, 8}; the block pairs for R_2, chosen to span every cyclic
      separation class; the estimator and its variance formula; the reporting
      floor; and the extrapolation law with its functional form fixed. A ladder or
      pair set chosen after seeing data would inflate any effect arbitrarily.
      STAGE 1, SAMPLING AT DEPLOYED PARAMETERS - draw the message, form its
      Reed-Solomon codeword and the n_e transmitted inner codewords (so the
      transmitted codeword per block is KNOWN, which is what makes the signed
      margin computable); draw x, y, r_1, r_2, e with the deployed fixed-weight
      sampler AND, as a declared second arm, with an exact-uniform Fisher-Yates
      sampler; form e' = x.r_2 - r_1.y + e and truncate to N = n_e.n_2; split into
      46 blocks of 384, fold the 3-fold duplication to length 128, run a
      length-128 fast Walsh-Hadamard transform, and record the SIGNED margin M_j
      together with W = omega(e'). Store (W, M_1..M_46) per sample; D_j = |M_j| is
      derived at analysis time at no storage cost. STAGE 2, THE ESTIMATOR -
      estimate each block's marginal lower u-quantile from the POOLED data (with
      marginal equality checked as a precondition, not assumed), then estimate
      R_k(u) as the empirical joint exceedance count over T u^k with a bootstrap
      interval over at least 200 resamples; run the identical estimator a second
      time on D_j as the declared secondary table; report the effective sample
      size in the conditioned region at every cell and REFUSE any cell whose
      expected count under independence is below 30. STAGE 3, THE NULLS - the
      cross-ciphertext re-pairing null drawn 16 times, the decoder-free structural
      null, and the i.i.d. Bernoulli(p*) maximal-removal null, all on the identical
      estimator code path. RULE ON THE NULLS FIRST: the three-branch verdict is
      emitted on the null arms BEFORE any real cell is read; if it emits the same
      branch on a null arm as on the real arm it discriminates nothing and is
      rewritten before the real arm is looked at. STAGE 4, THE MECHANISM ARM -
      repeat the estimate CONDITIONED ON W in narrow bins. STAGE 5, GRADED
      SENSITIVITY, RUN BEFORE THE REAL ARM IS READ - a synthetic signed-margin
      generator M_j = sqrt(1-t) Z_j + sqrt(t) Z_0 with marginals matched to the
      measured signed ones, at t in {0, 0.1, 0.25, 0.35, 0.5}, with monotonicity
      reported across the three interior points. STAGE 6, THE REFEREE STEP -
      transcribe eprint 2026/795's closed-form model FROM THE PRIMARY PDF and
      evaluate its R_k(u) prediction at HQC-1; if the transcription cannot be
      obtained, report the head-to-head as BLOCKED and make only the SPEC
      comparison.
    instrument: >-
      A C implementation of the two sparse ring products (omega.omega_r = 4950
      shift-XORs on a 17669-bit vector each) and the 46 length-128 fast
      Walsh-Hadamard transforms. AN EXACT-INTEGER IMPLEMENTATION IS PREFERRED,
      because the correlations are integer-valued sums and the margin is
      lattice-valued, which removes the float-precision confounder entirely; if
      float32 is used, the pipeline MUST recompute one rung in float64 and report
      both the rank-disagreement rate and the SIGN-disagreement rate, the latter
      of which must be 0. Arms use DISJOINT seed streams declared in Stage 0.
      Recorded through harness/runner.py with a manifest and source blob hashes.
    parameters: >-
      Deployed HQC-1: n = 17669, omega = 66, omega_r = omega_e = 75,
      n_1 = n_e = 46, n_2 = 384, delta_e = 15. Sample-size ladder
      T in {1e5, 1e6, 1e7}, primary run at T = 1e7. Quantile ladder
      u in {1e-1, 3e-2, 1e-2, 3e-3, 1e-3, 3e-4, 1e-4}. Orders
      k in {2, 3, 4, 6, 8}. 16 independent re-pairing null draws; 200 bootstrap
      resamples; reporting floor of 30 expected counts under independence. Two
      sampler arms (deployed biased, exact-uniform Fisher-Yates) and two tie-rule
      arms (deployed deterministic, random). Graded-control latent strengths
      t in {0, 0.1, 0.25, 0.35, 0.5}. Storage about 2 GB at T = 1e7 in float32,
      4 GB in float64.
  controls:
    - >-
      NULL-A, CROSS-CIPHERTEXT RE-PAIRING (the primary null). Block j's signed
      margin is taken from ciphertext pi_j(t) for independent uniform
      permutations. OBJECT REMOVED - the within-ciphertext coupling. OBJECT
      PRESERVED, and this list matters more than the removal list - every block's
      marginal signed-margin law EXACTLY (the multiset of block-j values is
      unchanged), the sample size, the sampler, the decoder, the tie rule, the
      truncation, the block index structure and the estimated quantiles. FORCED
      VALUE 1 by construction. IT CAN FAIL: if quantile-estimation error, the
      reporting floor, or an indexing bug generates the signal, NULL-A returns
      something other than 1 and no signal cell at that depth is reportable. Drawn
      16 TIMES with independent permutation families and reported as an INTERVAL,
      never a single draw.
    - >-
      NULL-B, DECODER-FREE STRUCTURAL NULL - signed-margin vectors from a
      key-independent process matched to the measured signed marginals with no
      coupling at all. NULL-A and NULL-B must AGREE within their intervals; if
      not, the estimator responds to something other than within-ciphertext
      coupling and no signal number is reportable.
    - >-
      NULL-C, MAXIMAL REMOVAL - e' replaced by a genuine i.i.d. Bernoulli(p*)
      vector of the same length (the binary symmetric channel A5 asserts e'
      behaves like), through the entire pipeline unchanged INCLUDING the signed
      margin computation against the known transmitted codeword. FORCED VALUE 1.
      Total removal must be at least as extreme as partial removal AND ON THE SAME
      SIDE; landing on the opposite side of NULL-A from the real arm means the
      statistic is not tracking the object. NULL-C is ALSO the sharpest statement
      of what A5 claims, so the real-versus-NULL-C contrast is a second
      deliverable: the combined A5+A17 error at deployed parameters. It is the arm
      EV-HQC-b71230's OPEN-6 did not have.
    - >-
      NULL-SIGN, THE OBJECT-CONFUSION CONTROL - the identical estimator run on the
      UNSIGNED reliability vector D = |M|, reported in its own labelled table
      beside the signed one with the DIVERGENCE DEPTH recorded. This arm has NO
      forced value and is not a null in the KN-TECH-1a5b7e sense; it is a
      discrimination check on the contract's own definition, so that a reader who
      mistakes D for M sees immediately that the tables differ. If they are
      numerically indistinguishable at every cell, THAT is reportable: it means
      the decoder is essentially never wrong in the conditioned region, which
      bounds the depth at which the measurement can say anything about failure.
    - >-
      GRADED CONTROL with FIVE points and at least THREE INTERIOR ones, with
      MONOTONICITY REPORTED - because a two-point gate can pass while the
      statistic is non-monotone in between, so that a verdict reads as a departure
      but not as a direction. Comparator named (NULL-A), spread the same bootstrap
      spread as the headline, threshold numeric and pre-declared.
    - >-
      SAMPLE-SIZE LADDER in T with CONVERGENCE AS A REPORTING PRECONDITION: a run
      whose R_2 estimate changes by more than its own interval between the last
      two rungs is not an estimate and no value is reported.
    - >-
      SAMPLER ARM - deployed biased sampler versus exact-uniform Fisher-Yates, so
      that a dependence measured only under the deployed sampler is scoped to the
      sampler rather than to the scheme.
    - >-
      TIE-RULE ARM - deterministic versus random tie-break. A13's 1/2-credit model
      assumes a coin the deployed decoder does not flip, and a deterministic rule
      can induce cross-block dependence a coin would not because it breaks every
      tie the same way. Ties are exactly M_j = 0, the boundary of the headline
      object.
    - >-
      PRECONDITION CHECK on marginal equality of the signed margin across the 46
      blocks, from the circulant-covariance derivation. TAIL FORM: the block-wise
      MINIMUM signed margin over all T draws compared across blocks, since a
      quantile comparison at u = 1e-2 would miss an indexing defect the extreme
      exposes.
    - >-
      DECODER CONSISTENCY CHECK ON EVERY SAMPLE (hard gate) - the deployed
      decoder's symbol output must disagree with the transmitted symbol EXACTLY
      when M_j < 0. Pass rate must be 100 percent, with M_j = 0 ties counted and
      reported separately.
    - >-
      NON-CIRCULANT SURROGATE (cheap, worth running) - the same pipeline on a
      matched random-linear code where quasi-cyclicity is removed but length,
      rate, weights and sampler match, as a third nearby object.
    - >-
      PRE-REGISTRATION of the margin definition, quantile ladder, k set, pair set,
      estimator, reporting floor and extrapolation law, in a HASHED document that
      provably predates the data.
  independent_variables:
    - quantile depth u over the declared ladder
    - order k over {2, 3, 4, 6, 8}
    - >-
      arm - signal, NULL-A (16 draws), NULL-B, NULL-C, NULL-SIGN, non-circulant
      surrogate
    - sampler - deployed biased versus exact-uniform Fisher-Yates
    - tie rule - deployed deterministic versus random
    - total error weight W, binned, for the mechanism arm
    - shared-latent strength t for the graded control
    - sample size T over {1e5, 1e6, 1e7}
    - block separation class, for the R_2 pair selection
  metrics:
    primary:
      - >-
        decoder_consistency_pass_rate - fraction (unitless, in [0,1]) of samples
        on which the deployed decoder's symbol output disagrees with the
        transmitted symbol exactly when M_j < 0, with the tie count (M_j = 0)
        reported separately. MUST BE 1.0
      - >-
        R_k_u_signed - the joint lower-tail exceedance ratio (dimensionless) on
        the SIGNED margin, per (k, u, arm, sampler, tie-rule) cell, with a
        200-resample bootstrap interval
      - >-
        null_A_interval - the 16-draw min/max interval of R_k(u) on the re-paired
        arm (dimensionless), per cell, and whether it contains 1
      - >-
        R_k_profile_trend - the sign and magnitude of the change in the departure
        |R_k - 1| as k runs through {2, 3, 4, 6, 8} (dimensionless), which decides
        whether the dependence reaches index 16
      - >-
        conditional_R2_given_W - R_2(u) computed within narrow W bins
        (dimensionless), against the unconditional value
    secondary:
      - >-
        R_k_u_unsigned - the identical estimator on D = |M| (dimensionless), in
        its own labelled table, with the DIVERGENCE DEPTH against the signed table
      - >-
        null_B_value and null_C_value with intervals (dimensionless), and which
        side of NULL-A each lands on
      - >-
        graded_control_values at t in {0, 0.1, 0.25, 0.35, 0.5} (dimensionless)
        with an explicit monotonicity verdict
      - >-
        blockwise_marginal_quantiles of the signed margin (correlation units) at
        every u, plus the block-wise minimum over all T draws
      - >-
        marginal_failure_probability P[M_j < 0] measured (unitless), against SPEC
        Table 11's inner DFR at HQC-1 of about 2^-10.8
      - >-
        depth_gap - log2 u minus log2 P[M_j < 0] (bits) at every u, the honest
        statement of how far the deepest reachable conditioning event sits from
        the failure event, reported BESIDE every headline cell
      - >-
        effective_conditioned_count per cell (unitless), and the explicit LIST of
        cells the reporting floor excluded
      - >-
        sample_size_ladder_values and the convergence verdict across
        T in {1e5, 1e6, 1e7}
      - >-
        float32_vs_float64_sign_disagreement_rate for M_j (must be 0) and the
        rank-disagreement rate
      - >-
        leave_one_out_false_positive_rate of the OUTSIDE rule on the null
        ensemble's own members (percent), derived before the run
      - >-
        eprint_2026_795_prediction for R_k(u) at HQC-1, or a BLOCKED marker
      - >-
        extrapolation_bracket at k = 16 under both the log-linear and the C(k,2)
        forms, or an explicit REFUSED marker
  heuristic_under_test:
    - id: HEUR-001
      formal_statement: >-
        For all blocks j and all u in the declared ladder, the pooled empirical
        lower u-quantile of the SIGNED margin is a consistent estimator of every
        block's own lower u-quantile, uniformly in j; the 46 block signed-margin
        laws are identical, so pooling multiplies the effective sample size by 46
        without bias.
      preregistered_prediction: >-
        Block-wise lower quantiles agree with their pooled value at every u within
        sampling error, with the only known symmetry-breaker being the truncation
        of 5 of 17669 coordinates whose predicted effect size of order 5/17669 is
        computed IN ADVANCE.
      prediction_source: >-
        IDEA-20260816-b68344's zero-compute circulant-covariance derivation
        (internal, this repository) plus SPEC Prop 6.1.2's marginal invariance via
        the image-verified BATCH-001 transcription. The classical statement
        imitated is exchangeability of coordinates of a cyclically invariant
        random vector.
      scale_access_and_transfer: >-
        Measured AT the deployed HQC-1 parameters it is claimed for. NO surrogate,
        no shortcut, NO TRANSFER ASSUMPTION - the sampling is already affordable at
        scale, which is the whole reason this design exists.
      sample_size_justification: >-
        T = 1e7 with 46 blocks gives about 4.6e8 pooled margin values, so the
        deepest ladder rung u = 1e-4 has about 4.6e4 pooled order statistics
        behind each quantile and about 1e3 per block. The reporting floor of 30
        expected counts under independence is what limits the ladder's depth, so
        the deepest reportable u scales like 30/(T * 46) per block - a decade of
        extra depth costs a decade of T, and that tradeoff is stated rather than
        optimised after the fact.
      comparison_metric: >-
        Chi-square of the 46 block-wise quantile estimates against their pooled
        value at each u.
      tail_checks:
        - >-
          The block-wise MINIMUM signed margin over all T draws, compared across
          blocks. The minimum of the SIGNED margin is the informative extreme
          precisely because it can go negative; the minimum of the unsigned D is
          pinned at 0 by ties and carries nothing.
      falsification_condition: >-
        Block-wise quantiles differ beyond sampling error at any u, or a block's
        extreme is systematically different. Either contradicts the circulant
        derivation or exposes an indexing defect; the package halts.
    - id: HEUR-002
      formal_statement: >-
        FOR THE EXTRAPOLATION STEP ONLY. There exists a declared functional form f
        with R_k(u) = f(k; theta), theta estimated from k in {2, 3, 4, 6, 8},
        extrapolating to k = delta_e + 1 = 16. The default form is log-linear,
        log R_k = (k-1) log rho, fixed in Stage 0.
      preregistered_prediction: >-
        Leave-one-out across the five k values predicts the held-out point within
        its interval, and the bracket between the log-linear and C(k,2) forms at
        k = 16 spans at most 3 orders of magnitude.
      prediction_source: >-
        The log-linear form is what a pairwise-exchangeable dependence with no
        higher-order structure produces; the competing C(k,2) form is what
        EV-HQC-b71230 measured for a DIFFERENT statistic at PS-R3
        (log2 A-hat_k tracking C(k,2) * log2 A-hat_2 to within 0.4 to 6.4
        percent). THIS PROGRAM'S OWN NEAREST DATA POINTS AT THE COMPETING FORM,
        which is why both are fitted and reported side by side rather than one
        being chosen.
      scale_access_and_transfer: >-
        THE TRANSFER ASSUMPTION IS STATED AND IS THE WEAKEST LINK IN THE PACKAGE:
        k = 16 is TWICE the largest measured order, and no amount of internal
        cross-validation makes an extrapolation of that length safe. It is
        reported as a BRACKET, never a point, or refused outright.
      sample_size_justification: >-
        Five k values is the most the reporting floor permits at T = 1e7 - the
        expected count under independence falls like u^k, so k = 8 at u = 1e-4 is
        already at the floor. Five points supports leave-one-out with four-point
        fits and nothing more, which is exactly why the extrapolation carries a
        refusal condition rather than a confidence interval.
      comparison_metric: >-
        Leave-one-out prediction error at every u, and the width of the
        two-form bracket at k = 16.
      tail_checks:
        - >-
          The extrapolated R_16 must be BRACKETED by the log-linear and C(k,2)
          forms, and the bracket is what is reported.
      falsification_condition: >-
        The bracket at k = 16 spans more than 3 orders of magnitude, or
        leave-one-out errors exceed the intervals. THE EXTRAPOLATION IS REFUSED
        and only the measured profile is reported, with an explicit statement that
        no DFR-relevant conclusion follows.
    - id: HEUR-003
      formal_statement: >-
        The mixture-and-conservation decomposition is complete at second order:
        R_2 = 1 + Var(p_i(W))/E[p_i(W)]^2 - C + o(.), with C the conservation term
        and the remainder third order in the per-block failure probability.
      preregistered_prediction: >-
        The mixture term computed DIRECTLY from the measured Var(p_i(W)) and
        E[p_i(W)] over the W bins equals the measured difference between the
        unconditional and conditional R_2, at every u on the ladder.
      prediction_source: >-
        The over-dispersion identity for a mixture of independent Bernoulli
        vectors over a common parameter (exact in that model), plus
        negative-association bounds for fixed-total-weight allocations - the same
        rigorous ingredient IDEA-20260808-cbb848 builds its analytic sandwich
        from. The classical statement imitated is multivariate hypergeometric urn
        allocation.
      scale_access_and_transfer: >-
        Measured at deployed parameters with no transfer. The W bins are drawn
        from the same T samples as the headline.
      sample_size_justification: >-
        The W-conditioned arm partitions the same T = 1e7 samples into narrow
        bins, so each bin carries T/(number of bins) samples and the reporting
        floor applies WITHIN each bin. The number of bins must therefore be fixed
        in Stage 0 from the floor and the target depth, not chosen afterwards to
        make a bin look clean.
      comparison_metric: >-
        Predicted mixture contribution against the measured (unconditional minus
        conditional) departure.
      tail_checks:
        - >-
          The agreement must hold at EVERY u on the ladder, not just the
          shallowest. A decomposition that works at u = 1e-1 and fails at u = 1e-4
          is a second-order statement being used in a tail.
      falsification_condition: >-
        The predicted mixture contribution disagrees with the measured difference
        at any u. The decomposition is incomplete and a third mechanism is
        operating; the residual is then the deliverable.
    - id: HEUR-004
      formal_statement: >-
        For all u in the declared ladder and all blocks j, {M_j < q_u} is a
        strictly nested family shrinking toward {M_j < 0} as u decreases toward
        P[M_j < 0], so a dependence measured at depth u concerns a SUPERSET of the
        failure event.
      preregistered_prediction: >-
        The measured marginal P[M_j < 0] from the signed margins agrees with SPEC
        Table 11's inner DFR at HQC-1 (about 2^-10.8) within its interval.
      prediction_source: >-
        Monotonicity of the quantile function (symbolic), plus SPEC Table 11 via
        the image-verified BATCH-001 transcription.
      scale_access_and_transfer: >-
        None - the set-inclusion statement is checked symbolically and the
        marginal is measured at the parameters it is claimed for.
      sample_size_justification: >-
        At T = 1e7 with 46 blocks, a marginal failure probability of 2^-10.8 gives
        about 2.6e5 expected failures pooled, so the marginal is resolved to well
        under a percent - far tighter than the Table 11 comparison needs.
      comparison_metric: >-
        Measured P[M_j < 0] against SPEC Table 11's inner DFR, and the reported
        depth_gap = log2 u - log2 P[M_j < 0] at every u.
      tail_checks:
        - >-
          The depth_gap is reported BESIDE EVERY HEADLINE CELL, so the distance
          between the measurement and the failure event is never out of sight.
      falsification_condition: >-
        The measured marginal disagrees materially with Table 11. The pipeline's
        decoder or margin is not the specified one and the package halts.
  preregistered_prediction:
    quantity: >-
      decoder_consistency_pass_rate, null_A_interval at every cell, R_2(1e-2) on
      the signed margin, the R_k profile trend, and the graded-control values.
    formula: >-
      Predicted decoder_consistency_pass_rate = 1.0 exactly (ties counted
      separately). Predicted null_A_interval containing 1.00 at every reported
      cell - a HARD GATE. Predicted |R_2(1e-2) - 1| at least 0.02, scored against
      the 16-draw null interval and not an asymptotic reference, WITH THE SIGN
      DELIBERATELY UNPREDICTED because conservation forces down and mixture forces
      up and neither is known to dominate at HQC's actual parameters. Predicted
      profile trend: if a departure exists at k = 2 it GROWS with k. Predicted
      graded control = 1.00 at t = 0 and at least 1.5 at t = 0.5, with
      monotonicity across the three interior points reported. Predicted
      conditional-versus-unconditional change of at least 50 percent of the
      unconditional departure. Under the null that A17 is exact at every tested
      depth, R_k(u) = 1 at every cell - which is a first-class, pre-declared
      outcome and NOT a failure.
    source: >-
      Pre-registered in IDEA-20260821-7a08df's `predictions` and
      `null_object_control` blocks and restated in H-HQC-c1baab before any run
      under this contract exists. The comparison values 2^-10.8 (Table 11) and
      EV-HQC-b71230's C(k,2) scaling are CITED, not measured here. Never tuned to
      data.
  scale_relevance:
    tier: deployed_parameters_toy_claim
    justification: >-
      The measurement runs at HQC-1's PUBLISHED parameters, which is unusual for
      this lane and is the point: EV-HQC-b71230's own boundaries state that NO
      CELL AT TRUE HQC PARAMETERS IS CERTIFIED. It is possible only because the
      DEPENDENCE STRUCTURE needs no failure observed - the continuous signed
      margin buys about three orders of tail depth over the binary indicator at
      the same sample size, reaching quantile depth 1e-4 per block against a
      per-block failure probability of about 2^-10.8. BUT DEPLOYED PARAMETERS ARE
      NOT A DEPLOYED CLAIM TIER: the ceiling is set by the certificate standard,
      and the gap between depth 1e-4 and the DFR at 2^-128 is spanned only by
      HEUR-002's extrapolation, which is bracketed or refused. Scoped to HQC-1;
      HQC-3 and HQC-5 have different inner codes and non-monotone inner DFRs, so
      nothing transfers.
    correspondence: null
  tail_checks:
    - >-
      Report the effective conditioned sample count at every cell and LIST the
      cells the reporting floor excluded. The floor is a selection rule computed
      under the hypothesis under test, so it is declared in advance and its
      exclusions are visible rather than silent.
    - >-
      Report the depth_gap in bits beside every headline cell.
    - >-
      Report the block-wise MINIMUM signed margin across all 46 blocks.
    - >-
      Report the deep-k deep-u corner with its WIDENED interval rather than
      trimming it: quantile-estimation error propagates into R_k as roughly k
      times the relative quantile error, so that corner is the least reliable.
    - >-
      Report the float32-versus-float64 SIGN-disagreement rate; a flipped sign is
      a flipped failure bit, and a nonzero rate voids every depth reported.
    - >-
      Report the leave-one-out false-positive rate of the OUTSIDE rule on the null
      ensemble's own members - with a 16-draw min/max tolerance interval it is
      12.5 percent in either direction and 6.25 percent one-sided - beside any
      OUTSIDE verdict. Cells sharing null draws are NOT independent and their
      rates must not be multiplied into a joint p-value.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 86400
    total_cpu_hours: 120.0
    maximum_memory_gb: 32
    maximum_runs: 12
  stopping_rules:
    - >-
      HALT if the decoder-consistency check falls below 100 percent outside the
      declared tie set. The headline identity does not hold as implemented and the
      package is void until the disagreement is located.
    - >-
      HALT if the measured marginal P[M_j < 0] disagrees materially with SPEC
      Table 11's inner DFR at HQC-1.
    - >-
      HALT if block-wise marginals differ systematically; the pooled-quantile
      estimator is invalid.
    - >-
      Emit the three-branch verdict on the NULL ARMS FIRST. If it emits the same
      branch on a null arm as on the real arm, REWRITE THE RULE BEFORE THE REAL
      ARM IS LOOKED AT.
    - >-
      Stop reporting at any cell whose expected count under independence is below
      30, and list it as excluded.
    - >-
      Stop if the estimate does not converge across the T ladder; a run whose R_2
      changes by more than its own interval between the last two rungs is not an
      estimate and no value is reported.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
      exhaustion is a stop, never a negative result (AGENTS.md rule 5).
    - >-
      If the eprint 2026/795 transcription cannot be obtained, complete every
      other stage and mark the head-to-head BLOCKED - an infrastructure outcome
      under AGENTS.md rule 3, never a mathematical one.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence
      (AGENTS.md rule 5).
    - >-
      A run whose null arms were not executed on the IDENTICAL estimator code path
      in the same invocation as the signal arm is invalid_measurement.
    - >-
      A run reporting a channel or mechanism attribution without the W-conditioned
      arm having executed is invalid_measurement - two mechanisms produce R_2 > 1
      and the attribution was not made.
    - >-
      A run conflating the SIGNED margin with the UNSIGNED reliability in any
      table, or omitting the object label from any table, is invalid_reporting.
    - >-
      A run with a nonzero float32-versus-float64 SIGN-disagreement rate is
      invalid_measurement at every depth reported.
    - >-
      A run reporting NULL-A as a single draw rather than a 16-draw interval is
      invalid_reporting (KN-TECH-1a5b7e mode 5).
    - >-
      A run whose arms share seed streams is invalid_measurement - shared seeds
      shrink apparent variance in arm differences.
    - >-
      A run reporting an extrapolated R_16 as a point rather than a bracket, or
      reporting one at all when the bracket exceeds 3 orders, is
      invalid_reporting.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT
      experiment requiring a new contract; it is never a repair of this one.
  success_criterion: >-
    decoder_consistency_pass_rate is exactly 1.0 outside the declared tie set; the
    measured marginal P[M_j < 0] matches SPEC Table 11 within its interval;
    block-wise marginals agree; NULL-A's 16-draw interval contains 1 at every
    reported cell; NULL-A and NULL-B intervals overlap at every cell; NULL-C lands
    on NULL-A or on the same side as the real arm; the graded control returns 1.00
    at t = 0, at least 1.5 at t = 0.5, and is MONOTONE across the three interior
    points; the estimate converges across the T ladder; the float32-vs-float64
    sign-disagreement rate is 0; and the run reports R_k(u) with bootstrap
    intervals at every unexcluded cell on the signed margin, the parallel unsigned
    table with its divergence depth, the profile trend in k, the W-conditioned
    comparison, the depth_gap beside every cell, and either the eprint 2026/795
    comparison or an explicit BLOCKED marker. MEETING THIS MEANS THE MEASUREMENT
    WAS MADE WITH A LICENSED INSTRUMENT - whatever value R took, INCLUDING exactly
    1 at every cell.
  falsification_criterion:
    - >-
      decoder_consistency_pass_rate below 1.0 outside the tie set - claim (A)'s
      identity does not hold as implemented and THE PACKAGE IS VOID until the
      disagreement is located.
    - >-
      NULL-A's interval excludes 1 at a cell - that cell is unreportable; at most
      cells, the estimator is broken and the package is void.
    - >-
      NULL-A and NULL-B disagree - the estimator responds to something other than
      within-ciphertext coupling and no signal number is reportable.
    - >-
      NULL-C lands on the opposite side of NULL-A from the real arm - total
      removal is less extreme than partial removal and on the wrong side; the
      statistic is not tracking the object and the package is void.
    - >-
      The graded control is not monotone across its interior points - the
      instrument detects a departure but cannot SIGN one; every verdict is
      reported without a directional reading and the record says so where the
      verdict appears.
    - >-
      The estimate does not converge across the T ladder - it is not an estimate
      and none is reported.
    - >-
      R_k(u) = 1 within interval at every reported cell - THE PRIMARY NULL
      OUTCOME. A17 survives at the tested depth at deployed parameters, and the
      deliverable is an OBSTRUCTION recorded with its quantity, value, error bars,
      source runs and scope. A first-class result that does NOT close RQ-HQC-001.
    - >-
      A departure at k = 2 that SHRINKS toward 1 as k grows - the dependence does
      not reach index 16, the DFR-relevant conclusion is NULL, and the k = 2
      finding must NOT be reported as a DFR statement.
    - >-
      The signed and unsigned tables agree everywhere - the conditioned region
      contains essentially no wrong decodes at any reachable depth, and no
      DFR-relevant conclusion follows even if a dependence is detected.
    - >-
      R_k(u) > 1 stably and growing in k - both published models are optimistic.
      THIS MAY NOT BE STATED until reproduced by an INDEPENDENT IMPLEMENTATION and
      passed by independent Validator and Red Team review, and even then it is a
      statement about a dependence ratio at deployed parameters, not about HQC's
      DFR, its IND-CCA security, or any deployed system.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment
    - >-
      raw-result.json (or a documented binary table) carrying the PER-SAMPLE
      (W, M_1..M_46) signed margins - not summaries - or, where the full table
      exceeds the archive budget, the per-cell exceedance counts plus a retained
      subsample with its selection rule declared in Stage 0
    - >-
      the Stage 0 pre-registration document with its hash, provably predating the
      data, carrying the margin definition, ladder, k set, pair set, estimator,
      reporting floor and extrapolation law
    - >-
      the decoder-consistency pass rate with the tie count reported separately
    - >-
      R_k(u) on the SIGNED margin with bootstrap intervals per
      (k, u, arm, sampler, tie-rule) cell
    - >-
      R_k(u) on the UNSIGNED reliability in its own labelled table, with the
      divergence depth against the signed table
    - >-
      the NULL-A 16-draw interval per cell and the derived leave-one-out
      false-positive rate
    - NULL-B and NULL-C values and intervals, in the same file as the signal arm
    - the R_k profile as a function of k with its trend
    - the conditional R_2 given W in narrow bins, against the unconditional
    - >-
      the graded-control values at all five t with an explicit monotonicity
      verdict
    - the block-wise marginal quantiles and block-wise minima
    - >-
      the effective conditioned count per cell and the LIST of cells the reporting
      floor excluded
    - the sample-size ladder values and the convergence verdict
    - >-
      the float32-versus-float64 SIGN-disagreement rate (must be 0) and the
      rank-disagreement rate
    - >-
      the transcribed eprint 2026/795 prediction for R_k(u), or an explicit
      BLOCKED marker
    - the extrapolation bracket at k = 16 under both forms, or a REFUSED marker
    - source blob hashes for every module used
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution. This contract is
      review_required and is NOT approved; `approved_by` is null and
      `execution_authorized` is false (AGENTS.md rule 1).
    - >-
      THIS IS THE MOST EXPENSIVE CONTRACT IN ITS BATCH (tens of core-hours,
      multi-gigabyte tables). The Coordinator must confirm the compute and storage
      budget before authorizing, and must decide the raw-artifact retention policy
      in advance, since a 2-4 GB per-sample table cannot simply be committed.
    - >-
      The Stage 0 pre-registration must be written and HASHED before any data
      exists. A ladder or pair set chosen after seeing data inflates any effect
      arbitrarily, and this gate is the only protection against it.
    - >-
      An R_k(u) > 1 outcome requires an INDEPENDENT SECOND IMPLEMENTATION plus
      independent Validator and Red Team review before any record states it.
  derivation_provenance:
    tool: coordinator subagent, design-experiment lifecycle steps 3-5
    source_record: IDEA-20260821-7a08df
    authored_at: '2026-08-25'
    note: >-
      Stages, arms, controls, metrics, thresholds and all four heuristics are
      transcribed from the parent proposal's `mechanism`, `minimal_test`,
      `predictions`, `null_object_control`, `heuristic_assumptions`,
      `confounders` and `falsification_conditions` blocks rather than re-invented.
      The parent was REPAIRED IN PLACE on 2026-08-24 after a red-team screen found
      it had conflated the signed margin with the non-negative reliability
      measure, which would have made its headline identity false and its
      decoder-consistency gate unpassable; this contract is written against the
      REPAIRED text and carries the signed/unsigned distinction into every table
      and every invalidation rule. Comparison values (2^-10.8, the C(k,2) scaling,
      the 12.5 percent false-positive rate) are cited to their sources and are NOT
      measurements made here. Budget follows the parent's declared estimated_cost
      (implementation medium, compute HIGH). No field is invented; gaps below.
  derivation_gaps:
    - >-
      THE RAW-ARTIFACT RETENTION POLICY IS UNRESOLVED. The per-sample table is
      2-4 GB at T = 1e7 and the program's normal rule is that raw-result.json
      carries every per-instance measurement, not summaries. A Coordinator must
      decide before approval what is archived, what is regenerable from a seed,
      and what subsample is retained with its selection rule pre-declared -
      otherwise the run either violates the artifact rule or silently drops the
      data its own re-analysis would need.
    - >-
      THE BLOCK-PAIR SET FOR R_2 IS NOT ENUMERATED. The parent says "chosen to
      span every cyclic separation class"; the exact pairs must be written and
      frozen in Stage 0, because pair selection after seeing data is exactly the
      inflation route the pre-registration exists to close.
    - >-
      THE W BINNING IS NOT SPECIFIED. The mechanism arm's discrimination threshold
      (a 50 percent change in the departure) is not decidable until the number and
      width of W bins are fixed, and the reporting floor applies within each bin,
      so bin count trades directly against reachable depth.
    - >-
      EXACT-INTEGER VERSUS FLOAT IMPLEMENTATION IS LEFT OPEN. The parent prefers
      exact integers, which removes the sign-flip confounder entirely, but does
      not require it. A Coordinator should require it, because the float path
      needs a float64 re-run of a whole rung as its own control and that cost is
      unmeasured.
    - >-
      STAGE 6 DEPENDS ON RETRIEVING A PDF THIS PROGRAM HAS NOT BEEN ABLE TO READ.
      The parent's own prior on obtaining it is about 0.55, limited by whether a
      future session has a PDF renderer. The contract makes BLOCKED a first-class
      outcome, but the head-to-head framing is the proposal's headline and a
      Coordinator should weigh whether tens of core-hours are justified when the
      referee step may not run.
    - >-
      THE NON-CIRCULANT SURROGATE ARM IS NAMED BUT NOT PARAMETERISED. Matching
      length, rate, weights and sampler on a random-linear code is a design task
      the parent does not perform, and its cost is unestimated.
    - >-
      NOTHING IN THIS CONTRACT ESTABLISHES WHETHER u = 1e-4 IS DEEP ENOUGH TO
      MATTER. The depth_gap metric reports the distance honestly, but whether a
      dependence measured three orders above the per-block failure probability
      bears on a probability at 2^-128 is precisely what HEUR-002 cannot settle,
      and the contract's own refusal condition may fire.
