# EXP-BINSTD-64f4e7
# Cyclotomic integers for the torus row. No field search.
# Approved by DEC-20261002-90f353.
experiment:
  id: EXP-BINSTD-64f4e7
  hypothesis_id: H-BINSTD-397930
  source_idea: IDEA-20260926-6f2601
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Cyclotomic integers for the torus row
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-90f353
  objective: >-
    Divide 2^65+1 by 90123. Reduce the cofactor modulo 131. Compare
    131^100 with 2^703 and 2^704. Reject a bit count of at most 7.03
    and reject a geometric sum equal to 17.
  inputs:
    phi_130: 48
    indices: [130, 17030, 2230930]
    euler: [48, 6240, 817440]
    two_65_plus_1: 36893488147419103233
    denominator: 90123
    quotient: 409368176241571
    cofactor: 3124947910241
    cofactor_quotient: 23854564200
    cofactor_remainder: 41
    inclusion_exclusion: 82
    fibre: 48
    ambient: 130
    unknowns: 17030
    two_to_703_below: true
    two_to_704_above: true
    order_mod_17: 8
    shift_mod_8: 0
    shift_mod_17: 1
    geometric_sum_mod_17: 0
    geometric_sum_equals_17: false
  controls:
    - >-
      A bit count of at most 7.03 for 131 is false. 2^703 is
      strictly below 131^100. Reporting that bound invalidates
      the run.
    - >-
      The sum of 256^i for seventeen terms equal to 17 is false.
      Reporting that equality invalidates the run.
    - >-
      Remainder 0 on the cofactor is false. The remainder is 41.
      Reporting a second factor of 131 invalidates the run.
    - >-
      phi(130) strictly below 48 is false. Reporting that
      invalidates the run.
    - Two integer routes. They must not import each other.
  independent_variables:
    - index
    - route in {divide, repeat_module}
  metrics:
    primary:
      - quotient
      - cofactor_remainder
      - bit_bracket
      - at_most_703_rejected
      - implementations_agree
    secondary:
      - euler_values
      - geometric_sum_bit
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The quotient, the remainder 41, and the two power bits.
    formula: >-
      phi(130) is 48. The next index is 130 times 131. The quotient
      is (2^65+1) divided by 90123. The cofactor is that quotient
      divided by 131, and the remainder of the cofactor on division
      by 131 is 41. Compare 2^703 with 131^100 and 2^704 with
      131^100 by integer powers, not by floating point. The
      seventeen-term geometric sum is reduced modulo 17 termwise.
    source: >-
      IDEA-20260926-6f2601 names the quotient, the indices, and the
      figure 7.03, read 2026-10-02. The remainder 41 and the power
      comparison were recomputed in this design session. That
      computation is not a run. The figure 7.03 is below log2(131).
      No field was built.
  scale_relevance:
    tier: toy
    justification: Integer division and two power comparisons. No transfer to a factor base.
    correspondence: null
  tail_checks:
    - The third index 2230930 is required. Stopping after 17030 and still reporting phi of the third index is invalid.
  replication:
    seeds: []
    independent_instances: 3
    replication_note: Deterministic. The second run is the other integer route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If 131 is reported at most 2 to the power 7.03, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - 131 is reported at most 2 to the power 7.03.
    - The geometric sum is reported equal to 17.
    - The cofactor remainder is reported as 0.
    - phi(130) is reported strictly below 48.
    - A field extension or a torus point is reported.
  success_criterion: >-
    Both runs agree on phi(130) = 48, the three indices, the three
    Euler values, the quotient, the remainder 41, the inclusion
    82, the product 17030, both power bits, and the geometric-sum
    bit. 131 stays strictly above 2 to the power 7.03. The
    geometric sum stays unequal to 17.
  falsification_criterion: >-
    The runs agree, the remainder stays 41, 131 stays above 2 to
    the power 7.03, and any quotient, Euler value, or power bit
    differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-BINSTD-64f4e7/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-64f4e7/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-64f4e7/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-64f4e7/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-64f4e7/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-64f4e7/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any field extension, torus point, or factor-base search.
    - A claim that the torus row helps or does not help an attack.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
