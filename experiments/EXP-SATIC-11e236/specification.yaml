# EXP-SATIC-11e236
# Free-bit cutoff arithmetic. No rank simulation.
# Approved by DEC-20261002-f2795d.
experiment:
  id: EXP-SATIC-11e236
  hypothesis_id: H-SATIC-b1ff02
  source_idea: IDEA-20260926-b11cb1
  question_id: RQ-SATIC-1ae57a
  version: 1
  title: Free-bit cutoff arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-f2795d
  objective: >-
    Check the degree-2 monomial counts and the seven free-bit cutoffs.
  inputs:
    degrees: [17, 19, 23, 29, 37, 89, 131]
    cutoffs: [5, 5, 6, 7, 8, 12, 15]
    cutoff_sum: 58
    sample_u: [5, 6, 7, 8, 9, 12, 13, 15, 16]
    monomial_counts: [16, 22, 29, 37, 46, 79, 92, 121, 137]
    equal_degrees: [29, 37]
    equal_counts: [29, 37]
    sqrt_floors: [5, 6, 6, 7, 8, 13, 16]
    sqrt_gaps: [0, 1, 0, 0, 0, 1, 1]
    gap_degrees: [19, 89, 131]
    square_pairs: [36, 38, 49, 169, 178, 196, 256, 262, 289]
    power_five: 32
    power_eight: 256
  controls:
    - >-
      The seven cutoffs are 5, 5, 6, 7, 8, 12 and 15. Reporting the
      cutoff at n = 19 as 6 invalidates the run.
    - >-
      The count at u = 7 is 29 and the count at u = 8 is 37. Reporting
      that equality excludes the cutoff invalidates the run.
    - >-
      The rounded square root exceeds the cutoff by 1 at n = 19, 89 and
      131. Reporting no excess invalidates the run.
    - >-
      The two formulas for the monomial count agree. A disagreement
      invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {counts, cutoffs}
    - route in {binomial, quadratic}
  metrics:
    primary:
      - cutoff_sum
      - sqrt_gap_count
      - implementations_agree
    secondary:
      - equal_bound
      - monomial_counts
      - powers
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The cutoff sum 58 and the three square-root gaps of 1.
    formula: >-
      The monomial count is (u^2 + u + 2) / 2. The cutoff is the largest
      u whose count is at most n. The rounded square root is the largest
      integer whose square is at most 2n.
    source: >-
      IDEA-20260926-b11cb1 states the cutoff and the seven written
      values, read 2026-10-02. The counts were computed in this design
      session. That computation is not a run. No solver was run.
  scale_relevance:
    tier: toy
    justification: Seven integer cutoffs. No transfer to a search tree.
    correspondence: null
  tail_checks:
    - The next monomial count is required. A cutoff that ignores u + 1 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the cutoff at n = 19 is reported as 6, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - Any cutoff differs from the preregistered list.
    - Equality at n = 29 or n = 37 is reported as excluding the cutoff.
    - The square-root gap at n = 19, 89 or 131 is reported as 0.
    - A rank simulation or a solver is run.
  success_criterion: >-
    Both runs agree that the seven cutoffs are 5, 5, 6, 7, 8, 12 and 15,
    that they sum to 58, that equality at 29 and 37 stays inside the
    bound, and that the rounded square root exceeds the cutoff by 1 at
    n = 19, 89 and 131.
  falsification_criterion: >-
    The runs agree, the seven cutoffs stay 5, 5, 6, 7, 8, 12 and 15, and
    any monomial count differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-SATIC-11e236/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-SATIC-11e236/runs/<RUN-ID>/command.txt
    - experiments/EXP-SATIC-11e236/runs/<RUN-ID>/stdout.log
    - experiments/EXP-SATIC-11e236/runs/<RUN-ID>/stderr.log
    - experiments/EXP-SATIC-11e236/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-SATIC-11e236/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any rank simulation or leaf count.
    - Any solver run or conflict ratio.
    - Any claim that a search exponent moves.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
