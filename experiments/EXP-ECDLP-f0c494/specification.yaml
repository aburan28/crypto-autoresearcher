experiment:
  id: EXP-ECDLP-f0c494
  hypothesis_id: H-ECDLP-643ea6
  question_id: RQ-FIND-001
  goal_id: null
  version: 1
  status: draft
  claim_tier: not_applicable
  title: >-
    Verification protocol for barrier-title integrity: every tracked derived
    rendering of a knowledge title is checked against the YAML-parsed source,
    with a deliberately defective line rule as the demonstrated-defect control
    that must blank all thirteen block-scalar-titled records, and the ephemeral
    dedup corpus declared uncheckable rather than assumed

  objective: >-
    THIS IS A VERIFICATION PROTOCOL, NOT AN EXPERIMENT. WHAT IS CHECKED: every
    derived rendering of a knowledge record's title that this repository
    produces or ships. AGAINST WHAT REFERENCE: the value of the title field
    obtained by parsing the record's YAML front matter with a YAML loader.
    WHAT RESULT FAILS IT: any record whose rendered title is empty, is a bare
    YAML indicator, or is a strict prefix of the parsed title. The protocol
    additionally DEMONSTRATES the diagnosed defect rather than inferring it, by
    running a stated line rule over the same corpus and requiring it to blank
    every record in the affected population.

  independent_variables:
    - name: extractor
      values: [tracked_yaml_extractor, stated_line_rule]
    - name: record_family
      values: [findings, techniques, open_problems]
    - name: title_form
      values: [plain_single_line, block_scalar_or_empty]

  inputs:
    corpus_root: knowledge/
    reference_rule: >-
      parse the front matter with a YAML loader and take the value of the title
      key
    stated_line_rule: >-
      take the remainder of the first line beginning with "title:", strip
      whitespace, and emit it as the title
    affected_population_floor: 13
    affected_population_named_members:
      - KN-FIND-006
      - KN-FIND-720727
      - KN-FIND-860118
      - KN-FIND-a8990a
      - KN-TECH-057
    tracked_derived_renderings:
      - the output of tools/build_knowledge_index.py
      - outputs/prior_proposals_index.json
      - outputs/_blacklist_compact.txt

  metrics:
    primary:
      - name: rendering_disagreement_count
        unit: records (dimensionless non-negative integer)
        definition: >-
          The number of knowledge records for which any tracked derived
          rendering differs from the YAML-parsed title. DISCLOSED DEBT: this is
          asserted EXACTLY and must be 0. It is closed and never grown, so any
          addition to it is a regression.
      - name: line_rule_blank_rate_on_affected_population
        unit: fraction (dimensionless), reported also as a count out of the
          population size
        definition: >-
          The fraction of the affected population that the stated line rule
          renders as empty or as a bare indicator.
    secondary:
      - name: affected_population_size
        unit: records (dimensionless non-negative integer)
        definition: >-
          The number of knowledge records whose title line is empty or ends in
          a block-scalar indicator. ASSERTED AS A FLOOR of at least 13, with
          per-family coverage of at least 1 in each of findings, techniques and
          open-problems, NEVER as an exact total.
      - name: source_empty_title_count
        unit: records (dimensionless non-negative integer)
        definition: >-
          Records whose PARSED title is genuinely empty. A source defect, whose
          repair is a superseding record and not a re-extraction, reported as a
          disjoint count.
      - name: truncation_count
        unit: records (dimensionless non-negative integer)
        definition: >-
          Records whose rendered title is a strict prefix of the parsed title,
          with a separate count of those where the truncation removes a scope
          qualifier such as a toy-scale or prime-field marker.

  controls:
    - name: C-POSITIVE-BYTE-FOR-BYTE
      kind: forced-value baseline
      blocking: true
      description: >-
        Every record whose title is a single-line plain scalar must be rendered
        BYTE FOR BYTE identically by the reference rule and by every tracked
        rendering. If the reference changes any of them, the reference is wrong
        and the audit stops before anything is reported.
    - name: C-DEMONSTRATED-DEFECT
      kind: planted defect of known size with predicted magnitude
      blocking: true
      description: >-
        Run the STATED LINE RULE, defined verbatim in the inputs, over the same
        corpus. IT MUST BLANK EVERY RECORD IN THE AFFECTED POPULATION, i.e. all
        13 of 13 at the corpus as it stands, and MUST BLANK NONE of the
        plain-scalar records. This is the demonstrated-dynamic-range control:
        the defect is exhibited, not inferred, and its magnitude is the whole
        range of the statistic, from 0 of 13 for a correct extractor to 13 of 13
        for the diagnosed rule.
    - name: C-SYNTHETIC-INJECTION
      kind: planted defect in a scratch copy
      blocking: true
      description: >-
        Inject a synthetic record carrying a block-scalar title into a SCRATCH
        COPY of the corpus. The line rule must blank it and the reference rule
        must not. NO SYNTHETIC RECORD IS EVER WRITTEN INTO knowledge/, which
        would be a fabrication vector rather than a control.
    - name: C-SOURCE-VERSUS-EXTRACTION
      kind: cause separation, blocking
      blocking: true
      description: >-
        Records whose PARSED title is genuinely empty are counted separately
        from records the extractor failed on. Their repairs differ, so pooling
        them would make the report unactionable.
    - name: C-FLOOR-NOT-EXACT
      kind: assertion-discipline gate
      blocking: true
      description: >-
        The affected-population size is asserted as a FLOOR plus per-family
        coverage, never as an exact corpus total, because the corpus grows with
        every batch and differs between concurrent worktrees. The floor may be
        raised only from a reviewed corpus and NEVER to turn a failing check
        green. Only the disclosed-debt quantity, the rendering disagreement
        count, is exact and it is asserted as 0.
    - name: C-READ-ONLY
      kind: safety gate
      blocking: true
      description: >-
        The protocol is read-only over knowledge/ and over the tracked
        renderings. It proposes repairs and performs none; a source-side defect
        is repaired by a superseding record under AGENTS.md rule 4 and never by
        an edit.

  heuristic_under_test: HEUR-001

  preregistered_prediction:
    quantity: >-
      The blank rate of the stated line rule over the affected population, and
      the rendering disagreement count for the tracked extractors.
    formula: >-
      Line rule blanks 13 of 13 on the affected population and 0 of the
      plain-scalar records. Tracked extractors disagree with the parsed source
      on exactly 0 records.
    source: >-
      YAML block-scalar syntax: the content of a folded or literal block scalar
      begins on the line AFTER the indicator, so any rule reading the remainder
      of the indicator line returns the indicator or the empty string. The
      affected population was enumerated by this coordinator session directly
      from the corpus.

  band_non_degeneracy_analysis: >-
    COMPUTED BEFORE THE PROTOCOL WAS FIXED.
    (1) THE DEMONSTRATED DEFECT SPANS THE WHOLE RANGE OF THE STATISTIC. A
    correct YAML extractor blanks 0 of the affected population; the diagnosed
    line rule blanks 13 of 13. There is no threshold between them to loosen and
    no configuration in which both give the same answer, so the control cannot
    be degenerate.
    (2) THE AFFECTED POPULATION WAS ENUMERATED, NOT ASSUMED. Searching the
    corpus for records whose title line is empty or ends in a block-scalar
    indicator returns thirteen records at the time of writing, and all five that
    the source proposal names are among them. The source proposal's own
    prediction that the true count exceeds five is therefore already confirmed
    as a floor.
    (3) THE COUNT IS A FLOOR BY CONSTRUCTION AND THE REASON IS RECORDED. An
    exact corpus total fails on branches that changed nothing and cannot be
    right in two concurrent worktrees at once. The exact assertion is reserved
    for the disclosed debt, namely zero rendering disagreements, which is closed
    and never grown.
    (4) ONE PREDICTED CELL IS UNCHECKABLE AND IS DECLARED SO RATHER THAN
    ANSWERED WEAKLY. The source proposal's third prediction, the number of
    proposals in a particular round falling inside the five invisible barriers,
    requires the dedup corpus that round screened against. That corpus is
    session scaffolding under a temporary directory, it is absent from this
    worktree, and no generator for it exists in this repository. No number is
    reported for it, and its absence is NOT evidence that the defect cost
    nothing.
    (5) THE ORIGINALLY DIAGNOSED EXTRACTOR IS NOT THE ONE THIS REPOSITORY
    SHIPS. tools/build_knowledge_index.py parses the front matter with a YAML
    loader, so the tracked path does not have the defect. The protocol is
    therefore an invariant check over extractors that exist plus an exhibition
    of the defect on a stated rule, rather than a repair of a rule this
    repository does not contain.

  scale_relevance:
    tier: null
    justification: >-
      Not a scaled measurement. This is a structural check over a corpus at the
      time of the run, and it transfers to no other corpus, worktree or harness.
    correspondence: null

  tail_checks:
    - >-
      Report the individual record identifiers in the affected population, not
      only their count, so a later reader can re-check the floor against a grown
      corpus without re-deriving it.
    - >-
      For truncated renderings, report separately those whose truncation removes
      a scope qualifier. A scope-stripped barrier reads as STRONGER than it is
      and causes false rejection of legitimate ideas, which is the opposite
      error to a blanked barrier and is equally bad.

  replication:
    seeds: []
    independent_instances: 1

  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 8
    maximum_runs: 2
    maximum_workers: 1

  stopping_rules:
    - If C-POSITIVE-BYTE-FOR-BYTE fails, stop; the reference rule is wrong.
    - >-
      If C-DEMONSTRATED-DEFECT blanks fewer than the whole affected population,
      stop; the stated line rule is not the diagnosed rule and the exhibition
      has not been performed.
    - >-
      If any write is attempted into knowledge/, abort. The protocol is
      read-only and a synthetic record reaching the corpus would be a
      fabrication vector.

  invalidation_rules:
    - Any exact corpus-total assertion in place of a floor plus coverage.
    - Any floor raised to make a failing check pass.
    - Any pooling of source-empty titles with extraction failures.
    - Any reported number for the ephemeral dedup corpus or for the downstream
      duplication cost.
    - Any repair applied in place to a knowledge record rather than proposed as
      a superseding record.

  success_criterion: >-
    The reference rule reproduces every plain-scalar title byte for byte; the
    stated line rule blanks the entire affected population and none of the
    plain-scalar records; the rendering disagreement count is reported exactly;
    the affected population is reported as a floor with per-family coverage and
    with its member identifiers listed; and source-empty titles, extraction
    failures and truncations are reported as three disjoint counts.

  falsification_criterion: >-
    The diagnosis is falsified if a YAML-based re-extraction produces the same
    empty entries as the line rule on the affected population, which would mean
    the source records really are missing titles. The protocol FAILS,
    independently of the diagnosis, if any tracked derived rendering disagrees
    with the parsed source, which is a live defect and is the finding. The
    demonstration is void if the line rule does not blank the whole affected
    population.

  required_artifacts:
    - the parsed title of every knowledge record, as the reference
    - every tracked derived rendering of those titles
    - the per-record comparison table and the exact disagreement count
    - the affected population member list, with per-family counts
    - the stated line rule's output over the same corpus
    - the synthetic-injection result from the scratch copy, with the scratch
      path recorded and confirmed outside knowledge/
    - the three disjoint counts for source-empty, extraction-failure and
      truncation, with scope-stripping flagged
    - an explicit record that the ephemeral dedup corpus is uncheckable here
    - run manifest per AGENTS.md artifact policy

  limitations:
    - >-
      INFRASTRUCTURE, NOT MATHEMATICS. No exponent moves, no family closes, and
      no evidence about any cryptographic object is produced. Under AGENTS.md
      rule 5 an infrastructure failure is never evidence against a mathematical
      hypothesis, and fixing one establishes nothing mathematical either.
    - >-
      NO CURVE-FREE NULL IS RUN AND THAT IS A PROOF, NOT AN OMISSION. Every
      object here is a text file and a YAML mapping. There is nothing
      curve-shaped for a result to be misattributed to.
    - >-
      UNCHECKABLE CELL, DECLARED. The dedup corpus the source proposal audits is
      session scaffolding under a temporary directory. A CONTENT SEARCH of the
      repository for its filename token, not a directory listing, found it only
      inside proposals that mention it, with no tracked copy and no generator on
      this branch; that is a checked absence, scoped to this branch, and it is
      not a claim that no such generator exists anywhere. Neither the corpus nor
      the downstream duplication cost can be measured here, and no number is
      reported for either.
    - >-
      THE REPOSITORY'S OWN TRACKED EXTRACTOR ALREADY PARSES YAML. The audit
      therefore verifies an invariant rather than repairing a defect in the
      tracked path, and a passing result must not be reported as having fixed
      anything.
    - >-
      A count over a growing corpus is a floor. Only the disclosed debt, zero
      rendering disagreements, is exact, and raising the floor to make a check
      pass would stop it being a check.
    - >-
      Scope: this repository's knowledge corpus and tracked renderings at the
      time of the run.

  assigned_to: executor
  approved_by: null
