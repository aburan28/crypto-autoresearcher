  task_id: TASK-20260823-14f80f
  version: 1
  recorded_at: '2026-08-23'
  title: Zero-run static audit of a source-resolved output-sensitive joinability certificate
  status: review_required
  approved_by: null
  assigned_to: null
  implementation_authorized: false
  execution_authorized: false
  experiment_design_approved: false
  research_state_transition_authorized: false
  evidence_promotion_authorized: false
  evidence_claimed: false
  maximum_runs: 0
  experiment_runs: 0
  zero_experiment_runs_occurred: true
  claim_ceiling: zero_experiment_static_proof_architecture_and_pre_implementation_review_only
  objective: >-
    Falsify or complete the symbolic certificate before any code or empirical
    work. The audit must show which conditions imply the N^(1/3+o(1)) branch
    and where every concrete elliptic-curve candidate presently fails.
  inputs:
    group_order_symbol: N
    list_length: L=N^(1/3)
    list_count: 4
    pair_survival_target: 1/L=N^(-1/3)
    ambient_collision_probability: 1/N
    required_conditioned_collision_probability: 1/L^2=N^(-2/3)
    target_total_time: N^(1/3+o(1))
    target_peak_memory: N^(1/3+o(1))
  certificate_rows:
    - JPR-C1-SOURCE
    - JPR-C2-DECOMPOSABLE-KEY
    - JPR-C3-OUTPUT-SENSITIVE
    - JPR-C4-CONDITIONAL-COLLISION
    - JPR-C5-CORRELATION-CONTROL
    - JPR-C6-VERIFICATION
    - JPR-C7-FULL-COST
  arms:
    - id: POS-XOR
      object: F_2^(3m) with m-bit quotient key
      expected: PASS
      reason: >-
        L=2^m. Matching keys enumerates L pairs, outputs lie in a kernel of
        size 2^(2m), and cross-collision probability is 2^(-2m).
    - id: NULL-PAIR-COIN
      object: prime cyclic group with independent Bernoulli(1/L) pair survival
      expected: REJECT
      reason: >-
        L^2 pair evaluations are required and conditioned sums remain uniform;
        per-attempt success is L^2/N=N^(-1/3), hence N^(1/3) retries.
    - id: NULL-POINT-HASH
      object: prime cyclic group with a post-hoc point-hash subset of density 1/L
      expected: REJECT
      reason: >-
        Collision concentration may be correct, but enumerating qualifying
        pair sums normally costs L^2.
    - id: NULL-FULL-TABLE
      object: oracle returning the best L outputs after materializing all L^2 pairs
      expected: REJECT
      reason: The oracle hides N^(2/3) preprocessing and proves too much.
  metrics:
    - name: join_enumeration_exponent
      unit: exponent_of_N
      success_value: at_most_1/3_plus_o1
    - name: filtered_output_exponent
      unit: exponent_of_N
      success_value: 1/3_plus_o1
    - name: conditioned_cross_collision_exponent
      unit: exponent_of_N_in_probability
      success_value: -2/3_plus_o1
    - name: per_attempt_success_exponent
      unit: exponent_of_N
      success_value: 0
    - name: retry_exponent
      unit: exponent_of_N
      success_value: 0
    - name: total_time_exponent
      unit: exponent_of_N
      success_value: at_most_1/3_plus_o1
    - name: peak_memory_exponent
      unit: exponent_of_N
      success_value: at_most_1/3_plus_o1
    - name: source_replay
      unit: boolean_and_reject_rules
      success_value: exact_without_DLP_oracle
  controls:
    - POS-XOR must pass all seven rows.
    - NULL-PAIR-COIN must fail C2 and C4/C5.
    - NULL-POINT-HASH must fail C2 even if C4 passes.
    - NULL-FULL-TABLE must fail C3/C7.
    - Pollard rho (1/2,0) and BSGS (1/2,1/2) remain Pareto baselines.
  procedure:
    - Re-derive all arm exponents symbolically from the declared inputs.
    - Fill every certificate row with theorem, assumption, or explicit missing status.
    - Remove each row and record the cheapest counterexample that then passes.
    - Run the proves-too-much objects and the quantifier-order audit.
    - Record a Pareto table with time, memory, data, scope, dominated_by, and sota_delta.
    - Stop. Do not implement or run an experiment.
  success_criterion: >-
    Static success requires internally consistent symbolic derivations; POS-XOR
    passes; all three negative controls fail for the intended reason; each
    certificate row is necessary or its redundancy is proved; source replay is
    exact; and every concrete elliptic-curve candidate is marked with the first
    unsatisfied row. This success is design integrity only and supplies no
    ECDLP evidence or implementation authority.
  falsification_criterion: >-
    Any control has the wrong disposition, a hidden L^2 or retry cost survives,
    the claimed conditions do not imply the target cost, source replay needs a
    DLP oracle, or a condition cannot be stated with the required quantifiers.
  stopping_rules:
    - Stop immediately on a control-disposition mismatch.
    - Stop if the audit would require code, a curve sample, or an experiment run.
    - Stop if a source is only recalled but is needed to support a decision.
  budget:
    maximum_runs: 0
    wall_clock_seconds: 0
    cpu_hours: 0
    memory_gb: 0
    notes: Static authoring and review only; dispatcher task attempts are accounted separately.
  required_artifacts:
    - frontier-rerank.yaml
    - proof-search-map.yaml
    - joinability-certificate.yaml
    - runtime-session-receipt.json
  interpretation_limits:
    - A certificate theorem is conditional on all rows and is not an instantiated attack.
    - A failed coordinate panel does not prove every approximate relation impossible.
    - A static PASS does not change any hypothesis or goal scientific status.
    - No cryptographic-scale transfer is made.
  review_plan: coordination/goals/GOAL-ECDLP-001/batches/BATCH-c36939/review-plan.yaml
