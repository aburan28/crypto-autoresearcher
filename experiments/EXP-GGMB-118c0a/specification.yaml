experiment:
  id: EXP-GGMB-118c0a
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-d73e83
  question_id: RQ-GGMB-6eaabc
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE ISOGENY-TRANSPORT ORACLE IS A RELABELING: an explicit generic-group simulator answers
    phi(P), phi(Q) queries at O(1) amortized cost per query by issuing fresh labels from a second
    table indexed by the SAME linear form, Shoup''s bound is undegraded because label tables are independent,
    and therefore no isogeny walk can itself be the source of an advantage -- from which the campaign''s
    own prediction of ZERO within-class variance in every group-level cost functional follows as a
    theorem rather than an expectation'
  status: draft
  objective: "(A) THE ORACLE. TRANSPORT(phi, h) where phi : E -> E' is an F_p-isogeny of degree d\
    \ with gcd(d, N) = 1 and h is a handle for a point of G: return a handle for phi(h) in G' = phi(G)\
    \ subset E'(F_p). This is the oracle form of DECOMPOSITION.md's transport theorem T1, and it is\
    \ the oracle every lane that proposes to \"walk to a better curve\" implicitly assumes.\n(B) THE\
    \ SIMULATOR, EXHIBITED. The generic simulator S maintains, per curve it has been asked about,\
    \ a separate label table; every handle carries its formal linear form lambda(h) = (alpha, beta)\
    \ in (Z/N)^2 with h = [alpha]P + [beta]Q. On TRANSPORT(phi, h):\n  1. Look up lambda(h) = (alpha,\
    \ beta).\n  2. Because phi restricted to G is an injective group homomorphism onto G'\n     with\
    \ phi(P) generating G' and phi(Q) = [k]phi(P) (T1), the transported\n     point has the SAME linear\
    \ form in the basis (phi(P), phi(Q)).\n  3. Look up (alpha, beta) in the table for E'. If present,\
    \ return the stored\n     label. If absent, draw a fresh uniform unused label, store it, return\
    \ it.\nCOST: one dictionary lookup and at most one label draw, i.e. O(1) amortized per query and\
    \ ZERO group-oracle calls. T_sim = 0 group operations. The simulator never needs the degree d,\
    \ never computes an isogeny, and never learns k.\n(C) THE BOUND IS NOT DEGRADED, AND THIS IS THE\
    \ NON-OBVIOUS PART. One might expect that giving the adversary r independent encodings of the\
    \ same group weakens Shoup's bound by a factor in r. It does not. Shoup's argument bounds the\
    \ probability that any two of the q formal linear forms the adversary has constructed become equal\
    \ when evaluated at the true k: that probability is at most binomial(q,2)/N, and it depends only\
    \ on the NUMBER of distinct linear forms the adversary has built, not on how many label tables\
    \ they are distributed across. Labels in different tables are independent uniform draws and a\
    \ collision across tables conveys nothing, because equality of labels is only meaningful within\
    \ a table. So r encodings cost the adversary q queries and buy zero extra collision opportunities,\
    \ and the bound remains Omega(sqrt(N)). Transport across an entire isogeny class of h curves gives\
    \ the adversary h label tables and NO reduction in the bound. THE PRECISE STATEMENT AND ITS RISK:\
    \ this is a claim about the standard counting argument in Shoup 1997 (KN-LIT-011, KN-TECH-005)\
    \ extended to multiple independent encodings of one group. I have not located a written multi-encoding\
    \ statement in this corpus, and the extension is asserted here with its argument, not quoted.\
    \ IF THE MULTI-ENCODING EXTENSION FAILS, the correct fallback claim is the weaker and still decisive\
    \ one that the bound degrades by at most a factor polynomial in h -- and since h <= p^{1/2+o(1)}\
    \ by the Brauer-Siegel-type bound on class numbers, even a catastrophic factor-h degradation would\
    \ leave the exponent unchanged for h = poly(log p). Both the claim and the fallback are recorded\
    \ so a reviewer can reject the strong form without collapsing the record.\n(D) THE CONSEQUENCE\
    \ FOR THE WHOLE CAMPAIGN, WHICH IS WHY THIS IS FILED IN L12 AND NOT IN L1. GOAL-ENDO-001's organising\
    \ idea is that ECDLP difficulty is an isogeny-class invariant and that a cost-minimising curve\
    \ in the class would be a target. This record sharpens that:\n  THE WALK IS FREE AND WORTHLESS.\
    \ Moving to another curve in the class is,\n  in the generic model, exactly a change of labels.\
    \ Therefore ANY advantage\n  found on a different curve in the class must come ENTIRELY from the\n\
    \  resource consumed AFTER arrival -- R1 (coordinates as field elements) or\n  R2 (the curve equation)\
    \ -- and NEVER from the transport.\nTwo corollaries, both testable and both cheap:\n  COROLLARY\
    \ 1. Every cost functional that is a function of the group\n  operations alone -- rho step count,\
    \ relation YIELD given a factor base of\n  fixed size, BSGS table size, the meet-in-the-middle\
    \ exponent -- is EXACTLY\n  constant across the isogeny class, with zero variance, not small variance.\n\
    \  DECOMPOSITION.md section 5 prediction 1 records \"zero variance in relation\n  yield\" as an\
    \ [open] expectation; this record DERIVES it, which converts a\n  prediction into a control: if\
    \ L1's instrument measures nonzero within-class\n  variance in a group-level functional, the instrument\
    \ is broken, and that is\n  a far more useful reading than \"we found variance\".\n  COROLLARY\
    \ 2. Any within-class variance L1 does find MUST be located in an\n  R1/R2 quantity -- solving\
    \ degree, first-fall degree, Macaulay rank profile,\n  factor-base decomposition probability.\
    \ L1's measurement should therefore be\n  stratified by resource, and a variance report that does\
    \ not say which\n  resource the varying functional consumes is uninterpretable.\n\n(E) WHAT ESCAPES,\
    \ STATED SO THE CLOSURE IS NOT OVERSOLD. TRANSPORT as specified returns a HANDLE. The moment a\
    \ lane asks for the COORDINATES of phi(h) on E', it is no longer using the transport oracle --\
    \ it is using the coordinate oracle on E', which is resource R1 and is adjudicated separately\
    \ (IDEA-20260807-070d03). The composite \"transport then read coordinates\" is exactly as strong\
    \ as \"read coordinates on E'\" and no stronger, so the value of an isogeny walk is precisely\
    \ the value of the R1 resource at the destination minus its value at the origin. That difference\
    \ is L1's actual question, correctly posed, and this record's contribution is to have removed\
    \ the walk from it.\n(F) WHAT WOULD REFUTE IT. Exhibit a generic adversary that, given the transport\
    \ oracle for a class of h curves, solves ECDLP in fewer than c*sqrt(N) group operations. By (B)\
    \ and (C) that adversary can be run against the simulator, contradicting Shoup. So a refutation\
    \ is either an error in the simulator (most likely: the claim that lambda is preserved) or a genuine\
    \ multi-encoding weakness in Shoup's counting, and either would be a significant finding about\
    \ the generic model itself."
  resource_label: 'R4 (isogeny graph / class-group action) as CLAIMED by the lanes that would use
    this oracle; VERDICT: the resource is nominal -- the transport oracle delivers R4 in a form containing
    no non-generic information, so the effective resource consumed is none. The audit itself consumes
    no resource.'
  admissibility: inadmissible_generic_group
  admissibility_argument: 'INADMISSIBLE, and this is the deliverable rather than a defect, filed under
    the IDEATION-BRIEF non-negotiable 1 which asks that inadmissible proposals be filed as recorded
    closures with their obstruction named. The transport oracle applies phi to points of G and returns
    points of a group of the same prime order N; by H-ENDO-001''s argument every such map is determined
    on G by its action on the linear form, and here that action is the identity. So the oracle does
    exactly what the admissibility filter forbids: its only use of phi is to apply it to points of
    G. THE OBSTRUCTION IS NAMED: transport preserves the linear form exactly, so the projection lambda
    -- the object the generic model tracks -- is unchanged, and an oracle that leaves the tracked
    object unchanged is a change of coordinates rather than a new object (docs/inventor-protocol.md
    section 2). The verdict is filed here so that every lane proposing an isogeny walk inherits it
    instead of re-deriving it.'
  reachability_gate: 'DISCHARGED, AND IN THE STRONGEST POSSIBLE WAY. T5 asks whether a good curve
    in the class is reachable and at what cost. This record answers a prior question: FOR A GENERIC
    ADVERSARY THERE IS NO GOOD CURVE, because every curve in the class presents the identical tracked
    object. Reachability therefore does not bind at all in the generic model -- the cost of reaching
    a specified curve (vectorization, ~p^{1/4} classically, versus O(log p) steps to a random one
    under GRH) is a cost for a benefit that is provably zero. The gate binds again, unchanged, the
    moment a lane consumes R1 or R2 at the destination, and at that point the lane owes the full T5
    analysis: is the good destination common enough to hit by random walking, or locally detectable
    at each step? This record does not answer that and does not claim to.'
  inputs:
    procedure: 'STAGE 0 (zero compute, 1 hour, HARD GATE): prove lambda-preservation; write the simulator;
      count its cost; audit the multi-encoding counting argument. If lambda-preservation fails the
      record ends here. STAGE 1 (zero compute): check both baseline slices (d = 1 and phi an endomorphism)
      against the standard simulator and against Oracle D. STAGE 2 (toy compute, <= 20 min): enumerate
      one small F_p-isogeny class at p <= 2^20 with harness/toycurve.py; implement T1 transport for
      each edge; verify the transport certificate independently (check phi(P) has order N and phi(Q)
      = [k]phi(P) for the KNOWN toy k, which is available at toy scale and is the cheapest possible
      correctness certificate). STAGE 3 (toy compute, included in the 20 min): measure the three group-level
      functionals across the class with matched seeds; run the matched-random-curve null; run the
      broken-transport control; run the d and L ladders. STAGE 4 (zero compute): publish Corollary
      1 as a blocking control for L1 and the resource-stratification requirement for L1/L2/L3/L10/L13.'
    mechanism: 'STEP 1 (zero compute) -- PROVE lambda-PRESERVATION. phi : E -> E'' an F_p-isogeny,
      d = deg phi, gcd(d, N) = 1. Then ker(phi) intersect G is a subgroup of G of order dividing both
      d and N, hence trivial, so phi|_G is injective; it is a homomorphism; its image G'' = phi(G)
      has order N and is generated by phi(P). And phi([alpha]P + [beta]Q) = [alpha]phi(P) + [beta]phi(Q).
      Therefore lambda is preserved on the nose. Four lines, elementary, and it is the whole simulator-correctness
      proof.

      STEP 2 (zero compute) -- WRITE THE SIMULATOR of (B) with its data structure (one hash table
      per curve, keyed by (alpha, beta), valued by label) and count its cost: O(1) amortized lookups,
      0 group-oracle calls, memory linear in the number of distinct (curve, linear form) pairs the
      adversary has touched -- which is at most q, so memory is O(q) and is charged.

      STEP 3 (zero compute, THE STEP THAT COULD FAIL) -- THE MULTI-ENCODING COUNTING ARGUMENT of (C).
      Write out Shoup''s collision count with r label tables and verify that the failure probability
      is still bounded by binomial(q,2)/N. Check specifically whether an adversary can extract anything
      from an equality test ACROSS tables; the answer should be that cross-table equality is not a
      defined operation, and if the model as this campaign uses it DOES define it, the argument must
      be redone. This is where a reviewer should look.

      STEP 4 (bounded toy compute, <= 20 minutes) -- THE COROLLARY-1 CONTROL, which is the only part
      that touches a machine and is an INSTRUMENT test, not a mathematical one. Enumerate a small
      F_p-isogeny class at p <= 2^20 using the existing harness (harness/toycurve.py), and measure,
      on every curve in the class with instances transported by T1 so that k is identical: (i) Pollard
      rho step count with a fixed seed and a transported walk, (ii) relation yield for a factor base
      of fixed SIZE (not fixed content), (iii) BSGS table size. Corollary 1 predicts these are EXACTLY
      equal across the class up to the walk''s own randomisation. A nonzero within-class variance
      in (i)-(iii), with seeds matched, means the instrument or the transport implementation is faulty;
      it is not a discovery. THIS IS THE CHEAPEST AVAILABLE TWO-DIRECTIONAL CHECK ON L1''s INSTRUMENT
      and it is available before L1 spends anything.

      STEP 5 (zero compute) -- PUBLISH THE REDIRECTION: L1, L2, L3, L10 and L13 must state, for any
      within-class variance they report, which resource the varying functional consumes. Group-level
      functionals may not vary.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - matched random curve at the same p and same N in a different isogeny class with independent k
    (null direction)
  - 'deliberately broken transport, a non-isogeny bijection (planted-failure direction: the instrument
    must see it)'
  - 'degree ladder d in {2,3,5,7,11} and walk-length ladder L in {1,2,4,8} (inverted decay test: invariance
    predicted)'
  - d = 1 identity slice and endomorphism slice (baseline reproduction)
  - 'transport certificate: phi(P) has order N and phi(Q) = [k]phi(P), verified independently of the
    transport code'
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, matched in shape to the transported
    comparison. NULL OBJECT: a MATCHED RANDOM CURVE E'''' at the same p with the same prime-order
    subgroup size N but in a DIFFERENT isogeny class (different trace), carrying an INDEPENDENTLY
    DRAWN k''''. Corollary 1''s group-level functionals must be equal across the transport class AND
    must show their ordinary instance-to-instance spread on the null. If the null shows zero spread
    too, the measurement is insensitive and proves nothing about transport; if the transport class
    shows the same spread as the null, either transport is not being implemented correctly or Corollary
    1 is false. DECAY PARAMETER: the isogeny degree d, taken over an increasing ladder d in {2, 3,
    5, 7, 11, ...} and over composite walks of increasing length L in {1, 2, 4, 8} steps. Corollary
    1 predicts NO decay -- exact equality at every d and every L -- which is the unusual case where
    INVARIANCE is the prediction and any drift with d or L is the artifact tell. This inverts the
    usual decay test and the inversion is stated explicitly so it is not misapplied: here a quantity
    that DOES change with the parameter meant to be irrelevant is the signature of a broken instrument.
    THIRD CONTROL: a deliberately BROKEN transport (apply a map that is not an isogeny, e.g. a random
    bijection of point sets). The measurement must show the group-level functionals differing, confirming
    the instrument can see a transport failure at all.'
  independent_variables: []
  metrics:
    primary:
    - simulator group-oracle calls per query and memory in entries
    - within-class variance of rho step count, relation yield, BSGS table size, with matched seeds
    - the same three on the matched-random-curve null
    - transport certificate pass/fail per edge
    secondary:
    - drift of each functional across the d and L ladders
    - result of the broken-transport control
  heuristic_under_test: null
  preregistered_prediction:
    quantity: within-class variance of Pollard rho step count, with seeds and walk function transported
      so the walks correspond exactly, over every curve in an enumerated toy isogeny class
    formula: EXACTLY ZERO -- bitwise identical step counts, not merely statistically indistinguishable,
      because the transported walk visits corresponding points. Any nonzero variance under matched
      seeds is an implementation fault in the transport, not a mathematical result, and the run is
      INVALID rather than negative (AGENTS.md rule 5). Pre-registered.
    source: pre-registered in IDEA-20260807-d73e83 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - GENERATOR RENORMALISATION. If the implementation picks a fresh generator on E' rather than using
    phi(P), the linear forms are rescaled by a unit and the measured correspondence breaks even though
    the mathematics is fine. This is the single most likely cause of a spurious nonzero variance and
    the transport certificate is designed to catch it.
  - WALK-FUNCTION MISMATCH. Pollard rho partitions by a function of the point's coordinates. Transporting
    the walk requires transporting the PARTITION, not just the points; if the partition is recomputed
    from E' coordinates the walks diverge and step counts differ for a purely R1 reason. That divergence
    is REAL and INTERESTING -- it is R1 variance, exactly what Corollary 2 predicts is the only place
    variance can live -- and it must not be mistaken for a violation of Corollary 1. The measurement
    must report both the transported-partition and recomputed-partition step counts.
  - COFACTOR AND SMOOTHNESS at toy scale. At p <= 2^20 the group order can be smooth and Pohlig-Hellman
    (KN-TECH-030) can dominate, making step counts meaningless. Every curve in the class must have
    its order factored and its largest prime factor recorded before any count is used.
  - CLASS ENUMERATION COMPLETENESS. A "class" that is actually a partial walk gives a biased sample.
    The enumeration must be certified complete by matching the class size against the class number
    of the order, or reported as partial.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACTLY ZERO -- bitwise identical step counts, not merely statistically indistinguishable,
    because the transported walk visits corresponding points. Any nonzero variance under matched seeds
    is an implementation fault in the transport, not a mathematical result, and the run is INVALID
    rather than negative (AGENTS.md rule 5). Pre-registered.
  falsification_criterion:
  - 'lambda-preservation fails: an F_p-isogeny with gcd(deg, N) = 1 for which phi([alpha]P + [beta]Q)
    is not [alpha]phi(P) + [beta]phi(Q). This would contradict phi being a homomorphism and would
    indicate an error in the record or the implementation; it is the cleanest possible falsifier and
    it costs nothing to check.'
  - The multi-encoding counting argument fails and the degradation is worse than poly(h). The strong
    claim in (C) is withdrawn and the fallback is re-examined; the corollaries survive because they
    follow from lambda-preservation alone, not from the bound.
  - Nonzero within-class variance in a group-level functional under matched seeds and a passing transport
    certificate. Corollary 1 is false, which would contradict an elementary argument and must be replicated
    independently before being reported as anything other than a suspected implementation fault.
  - The broken-transport control is NOT detected. The instrument cannot see a transport failure, so
    every zero-variance result it produced is void and the run set is INVALID rather than confirming.
  - A generic adversary is exhibited that uses the transport oracle to solve ECDLP in fewer than c*sqrt(N)
    group operations. This contradicts Shoup via the simulator and would be a finding about the generic
    model itself, requiring the review escalation of AGENTS.md rule 12.
