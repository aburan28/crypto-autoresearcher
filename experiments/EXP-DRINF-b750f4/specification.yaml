# =============================================================================
# EXP-DRINF-b750f4 — version 1, approved by DEC-20261005-3b806c.
# Frozen comparison: the isogeny-class count read from the PDF named by
# KN-LIT-174 against an enumeration of the six rank-2 Drinfeld modules
# over F_3. The PDF integer is not verified in this design. No module was
# enumerated here. Source idea IDEA-20261005-497357 is already on origin/main.
# =============================================================================
experiment:
  id: EXP-DRINF-b750f4
  hypothesis_id: H-DRINF-cac0da
  question_id: RQ-DRINF-6b5a9d
  source_idea: IDEA-20261005-497357
  goal_id: null
  version: 1
  title: >-
    Isogeny-class count of the six rank-2 Drinfeld modules over F_3
    against the formula in the PDF named by KN-LIT-174
  status: approved
  approved_by: DEC-20261005-3b806c
  approved_at: '2026-10-05'
  packaging_only: false
  approval:
    approved_by: DEC-20261005-3b806c
    approved_by_role: coordinator
    composing_decision: DEC-20261005-3b806c
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06: "all is
      approved. ideas/experiments should be always approved") because every
      field the design protocol requires is non-null. Approval does not assert
      that the published count equals the enumeration, and it does not treat
      any unread PDF integer as verified.
    implementation_authorized: true
    scientific_execution_authorized: true
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether the integer N_formula read from the isogeny-class
    formula in the PDF named by KN-LIT-174 equals N_enum, the number of
    distinct monic Frobenius characteristic polynomials of the six
    modules, or whether those integers differ. A missing formula withdraws
    the equality. It does not become a remembered integer.

  inputs:
    field: F_3
    frobenius: tau is the Frobenius of F_3
    characteristic: (T)
    modules:
      - id: M00
        rule: Phi_T = 0*tau + 1*tau^2
      - id: M01
        rule: Phi_T = 0*tau + 2*tau^2
      - id: M10
        rule: Phi_T = 1*tau + 1*tau^2
      - id: M11
        rule: Phi_T = 1*tau + 2*tau^2
      - id: M20
        rule: Phi_T = 2*tau + 1*tau^2
      - id: M21
        rule: Phi_T = 2*tau + 2*tau^2
    set_size_before_quotient: 6
    carlitz:
      rule: Psi_T = tau
      role: nearby_object_control
      instruction: Exclude it from N_enum and from N_j. Record its polynomial degree separately.
    published_count:
      source_name: >-
        Mohamed Ahmed Mohamed Saadbouh, Endomorphism Rings and Isogenies
        Classes for Drinfeld A-Modules of Rank 2 over Finite Fields
      source_id: arXiv:0412367
      named_by: knowledge/literature/KN-LIT-174.md
      local_paths:
        - downloads/0412367v3.pdf
        - downloads/0412367v3 (1).pdf
      count_provenance_at_design: recalled
      design_session_opened_pdf: false
      pdf_status_at_design: absent
      instruction: >-
        N_formula is the integer the PDF's isogeny-class formula returns
        on these six modules. Read the formula from one of the local
        paths, or from a copy of arXiv:0412367 fetched at run time and
        recorded by path and hash. Do not insert an integer from memory.
        If no formula is read, N_formula stays unread and the equality
        is withdrawn.
    forbidden:
      - Do not treat an unread PDF integer as verified.
      - Do not replace a missing formula with a recalled formula.
      - Do not include Psi_T = tau among the six.
      - Do not claim an ECDLP exponent improvement.

  controls:
    - id: carlitz-exclusion
      statement: >-
        The rank-1 module Psi_T = tau is not one of the six. Its
        polynomial must not be counted inside N_enum.
      pass_condition: the six-module set has size 6 before any quotient, and the Carlitz polynomial is recorded apart from that set
      on_fail: The run is invalid. Do not drop a rank-2 module to force the set back to six.
    - id: bound-plus-one
      statement: >-
        Run the relation search at the degree bound stated in the PDF and
        again at that bound plus 1. The minimal polynomials must agree.
      pass_condition: the two searches return the same minimal polynomial for every module, including the Carlitz control
      on_fail: >-
        The bound was tight and the search was incomplete. The run is
        invalid. Do not keep the smaller bound's count.
    - id: set-size
      statement: >-
        Before any quotient by polynomials or by j, the input list has
        six distinct pairs (g, Delta).
      pass_condition: six pairs are listed and no pair is repeated
      on_fail: The run is invalid.

  independent_variables:
    - which of the six pairs (g, Delta) is expanded
    - the relation-search degree bound, PDF bound versus that bound plus 1, on the same modules

  metrics:
    primary:
      - id: abs_diff_N_formula_N_enum
        statement: >-
          Absolute difference |N_formula - N_enum| after N_formula has
          been read from the PDF formula. Unread if the formula was not read.
      - id: degree_of_each_rank2_polynomial
        statement: Degree of the monic minimal polynomial returned for each of the six modules.
      - id: N_j_minus_N_enum
        statement: >-
          N_j minus N_enum, using the j formula from the same PDF.
          Unread if that formula was not read.
    secondary:
      - id: N_formula
        statement: Integer read from the PDF formula, or the token unread.
      - id: N_enum
        statement: Number of distinct monic polynomials among the six, or unread if no degree bound was read.
      - id: N_j
        statement: Number of distinct j-invariants among the six, or unread.
      - id: carlitz_polynomial_degree
        statement: Degree of the Carlitz control polynomial, recorded apart from the six.
      - id: pdf_status
        statement: absent, read_formula, or read_no_formula.
      - id: bounds_agree
        statement: Whether the PDF degree bound and the bound plus 1 returned the same minimal polynomials.

  heuristic_under_test: HA-1
  heuristic_under_test_note: >-
    HA-1 is the equality of the PDF count and the enumeration on these
    six modules. A mismatch is a negative on this field. It is not an
    ECDLP exponent.

  preregistered_prediction:
    quantity: >-
      Equality of the published isogeny-class count and the enumeration
      of the six modules, the degree of each rank-2 polynomial, and the
      sign of N_j - N_enum.
    formula: >-
      |N_formula - N_enum| = 0. Each rank-2 characteristic polynomial has
      degree 2. N_j - N_enum >= 0. A difference of at least 1 is the
      negative. No numeral for N_formula is written here.
    source: >-
      The equality is the prediction in IDEA-20261005-497357, copied
      before any run of EXP-DRINF-b750f4. The published count's document
      is arXiv:0412367, Mohamed Ahmed Mohamed Saadbouh, Endomorphism
      Rings and Isogenies Classes for Drinfeld A-Modules of Rank 2 over
      Finite Fields, named by KN-LIT-174. This design session opened
      knowledge/literature/KN-LIT-174.md and did not open the PDF.
      Provenance of the PDF integer: recalled. The integer is not verified.

  scale_relevance:
    tier: toy
    justification: >-
      The tested parameters are q = 3, deg(T) = 1, and six modules.
      A result on these six modules is not a result at larger q, at
      larger m, or at a cryptographic field. No extrapolation is authorized.
    correspondence: >-
      Direct enumeration of the six modules. No Deuring correspondence
      and no sampling equivalence is used.

  tail_checks:
    - >-
      There is no sampled tail. The census is six modules. The extreme
      check is the Carlitz control: its polynomial must stay outside the
      six, and if every rank-2 degree is 2 then the Carlitz degree is
      recorded and compared with 2. Equality of that control degree with
      2 does not by itself pass or fail the six-module count. It is reported.

  replication:
    seeds:
      - name: arithmetic
        algorithm: deterministic enumeration of the six pairs and of additive-polynomial relations
        seed: 0
        note: >-
          No random generator is consulted. seed 0 records that fact.
          Substituting a random sample of modules is forbidden.
    independent_instances: 6
    independent_instances_note: >-
      The six modules are the census. They are not six draws from a
      distribution. The Carlitz module is a control, not a seventh draw.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
    budget_note: >-
      Time and CPU figures are advisory machine-protection watches
      (docs/research-budget-policy.md). They do not cap the six frozen
      modules. maximum_runs is 2 so one infrastructure retry may take a
      new run id. Watch expiry is failed_infrastructure, never a
      negative mathematical result.

  procedure:
    read_pdf: >-
      Open a local copy named by KN-LIT-174, or fetch arXiv:0412367 and
      record the path and sha256. Read until the characteristic
      polynomial, the isogeny-class formula, and the j-invariant are
      either defined or recorded as absent. Do not use the markdown note
      as a substitute for those definitions. It does not contain them.
    formula: >-
      If an isogeny-class formula is defined, apply it to the six modules
      and record the integer N_formula together with a short quotation of
      the formula and the page or equation label. If the formula is
      absent, set pdf_status to read_no_formula and leave N_formula unread.
    enumeration: >-
      If the PDF states a degree bound for the characteristic polynomial,
      search additive-polynomial relations for the monic polynomial of
      least degree satisfied by tau, up to that bound, for each of the
      six modules and for the Carlitz control. Repeat at bound plus 1.
      Count distinct polynomials among the six. Do not search under a
      degree bound taken from memory when the PDF states none.
    j_count: >-
      If the PDF defines j, evaluate it on the six modules and count the
      distinct values. If j is not defined, leave N_j unread.
    mechanism_assignment:
      - observation: >-
          pdf_status is read_formula, bounds_agree is true, the set size
          is 6, |N_formula - N_enum| = 0, every rank-2 degree is 2, and
          N_j - N_enum >= 0. The Carlitz polynomial is outside the six.
        assigns_to: >-
          Agreement on these six modules at q = 3. Does not transfer to
          another q or another m. Does not verify any integer that was
          not read from the PDF during the run.
      - observation: >-
          pdf_status is read_formula, bounds_agree is true, and
          |N_formula - N_enum| is at least 1.
        assigns_to: >-
          Negative. The published count and the enumeration disagree.
      - observation: >-
          A rank-2 polynomial has degree other than 2, or N_j < N_enum,
          and bounds_agree is true.
        assigns_to: >-
          Negative. The degree prediction failed, or one module carried
          two characteristic polynomials.
      - observation: >-
          The PDF is absent, or it contains no isogeny-class formula.
        assigns_to: >-
          Withdrawn. The equality prediction is inconclusive. If a degree
          bound was read, still record N_enum. Do not substitute a
          recalled formula. Not a negative.
      - observation: >-
          The two degree bounds disagree, the set size is not 6, the
          Carlitz polynomial is counted among the six, N_formula was
          filled from memory, the watch expires, or a dependency is missing.
        assigns_to: >-
          Invalid or failed_infrastructure. Not evidence for either count.

  stopping_rules:
    - Stop when pdf_status, the six polynomials or an explicit unread reason, the Carlitz degree, and one assignment row are recorded.
    - Do not add a seventh rank-2 module, another q, or another characteristic.
    - Watch expiry stops the run as failed_infrastructure.

  invalidation_rules:
    - A timeout, crash, memory abort, or missing dependency is failed_infrastructure and is not evidence against the hypothesis.
    - Using a remembered integer as N_formula invalidates the run.
    - Reporting equality when the PDF formula was not read invalidates the run.
    - A disagreement between the degree bound and the bound plus 1, reported as a completed count, invalidates the run.
    - Changing the pre-registered equality after seeing the integers is forbidden. A correction is a new amendment record, and existing runs are not re-scored against it.

  success_criterion: >-
    The run is a success for the agreement reading exactly when the first
    row of mechanism_assignment holds. Any other completed assignment is
    not this success. In particular a withdrawn formula is not a success,
    and a mismatch is a negative, so success can fail.

  falsification_criterion: >-
    The equality on these six modules is falsified when the second row of
    mechanism_assignment holds. The degree prediction or the inequality
    N_j >= N_enum is falsified when the third row holds. The fourth row
    falsifies nothing. The fifth row falsifies nothing.

  required_artifacts:
    - experiments/EXP-DRINF-b750f4/runs/RUN-*/manifest.yaml
    - experiments/EXP-DRINF-b750f4/runs/RUN-*/stdout.txt
    - experiments/EXP-DRINF-b750f4/runs/RUN-*/stderr.txt
    - experiments/EXP-DRINF-b750f4/runs/RUN-*/raw-result.json
    - experiments/EXP-DRINF-b750f4/runs/RUN-*/verdict.yaml
  artifact_contents:
    raw-result.json: >-
      pdf_status, the path and sha256 of the PDF that was read or a
      statement that it was absent, N_formula or unread, N_enum or unread,
      N_j or unread, the six polynomials with degrees, the Carlitz degree,
      and bounds_agree. The count provenance of any integer taken from the
      PDF is retrieved, because the run opened it. An unread integer stays
      recalled and is not filled in.
    verdict.yaml: >-
      Exactly one assignment row from mechanism_assignment, or
      failed_infrastructure with a reason. The verdict quotes the row. It
      does not change hypothesis status.

  assigned_to: executor
  zero_runs_in_design: true
