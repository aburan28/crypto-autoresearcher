experiment:
  schema: crypto.autoresearch.experiment.v3
  id: EXP-ECDLP-adaa91
  hypothesis_id: null
  hypothesis_id_note: >-
    This is an apparatus-identity and power-control contract for the inference
    interface of IDEA-20260809-2ba70c, not a test of an ECDLP hypothesis.
    Naming a mathematical hypothesis would invite an inference this synthetic
    deterministic fixture cannot support.
  source_proposal_id: IDEA-20260809-2ba70c
  goal_id: GOAL-ECDLP-001
  question_id: RQ-ECDLP-002
  batch_id: BATCH-f5d854
  task_id: TASK-20260809-c9220d
  version: 1
  title: >-
    Repaired matched-mean decoder, seed/rank, exact-law, and eta-aware
    estimator fixture
  status: review_required
  created_at: '2026-08-09'
  created_by: coordinator
  approved_by: null
  execution_authorized: false
  implementation_authorized: false
  experiment_class: deterministic_apparatus_control
  claim_ceiling: apparatus_design_only

  objective: >-
    Specify the cheapest deterministic control that can falsify the inference
    apparatus of IDEA-20260809-2ba70c before any curve, selector, or signed-y
    treatment is built. Regenerate two equal-mean matched streams from one
    frozen seed, independently decode their reversible artifacts, and require
    the estimator to distinguish diffuse Boolean success from polynomially
    concentrated multiplicity by exactly the pre-registered bridge exponents.

  authorization_boundary:
    authorized_here:
      - freeze the experiment design and exact expected values
      - snapshot and independently review the design
    forbidden_here:
      - write implementation source
      - execute the compiler, materializer, decoder, estimator, or bootstrap
      - create a run id, run receipt, observation, or evidence record from data
      - generate a curve, scalar list, selector, selected pair, isomorphism model, or signed-y treatment
      - claim an attack, speedup, security impact, hypothesis transition, or breakthrough
    next_gate: >-
      Only an independently reviewed Coordinator decision may open a fresh
      implementation-review batch. Design PASS alone never authorizes execution.

  inputs:
    master_seed:
      derivation: 'SHA-256 of ASCII EXP-ECDLP-adaa91|design-seed-v1'
      hex: a3b2512dad8e950380ed20e6338bd399454688bb3770783d0f8e90dd8ee69ba1
      bytes: 32
      frozen_before_implementation: true
    sizes:
      - {bits: 18, N: 262144, kappa: 64}
      - {bits: 21, N: 2097152, kappa: 128}
      - {bits: 24, N: 16777216, kappa: 256}
      - {bits: 27, N: 134217728, kappa: 512}
      - {bits: 30, N: 1073741824, kappa: 1024}
    arms: [diffuse, concentrated]
    eta_values: [-4, 0, 4]
    clusters_per_size: 32
    roots_per_cluster: 8192
    roots_per_size: 262144
    total_cluster_records: 320
    total_root_records: 2621440
    bootstrap_draws_per_arm_eta: 8191
    bootstrap_positions_per_draw_size: 32
    total_bootstrap_indices: 7863360
    arithmetic: exact_integers_and_directed_multiprecision_only

  exact_construction:
    cluster_load_assignment: >-
      For each size, generate 32 common cluster ranks. Sort by
      (rank_u256, cluster_u8). Assign A_c=1024 to sorted positions 0 through
      15 and A_c=3072 to positions 16 through 31. The assignment is shared by
      both arms and is retained before root selection.
    root_selection: >-
      For each complete (arm,bits,cluster) tuple generate 8192 root ranks and
      sort by (rank_u256,root_u16). In the diffuse arm select the first A_c
      roots. In the concentrated arm select the first A_c/kappa roots. Every
      A_c is divisible by every kappa in its size row; a failed divisibility
      assertion is compiler invalidity.
    root_values:
      diffuse_selected: {D: 1048576, Y: 1, X: 1, V: 1, S: 1}
      concentrated_selected: {D: 1048576, Y: kappa, X: kappa, V: kappa, S: 1}
      unselected: {D: 1048576, Y: 0, X: 0, V: 0, S: 0}
    meanings:
      X: match multiplicity used by the bridge diagnostic
      Y: independently decoded multiplicity mirror; equality with X is mandatory
      V: independently decoded value mirror; equality with X is mandatory
      S: Boolean success indicator
      D: fixed exposure retained only to prove no exposure offset enters the marginal estimator
    exact_counts_per_size:
      common_sum_X: 65536
      common_sum_Y: 65536
      common_mean_X: '1/4'
      common_mean_Y: '1/4'
      diffuse_sum_S: 65536
      concentrated_sum_S_by_bits: {18: 1024, 21: 512, 24: 256, 27: 128, 30: 64}
      concentrated_sum_X_squared_by_bits:
        18: 4194304
        21: 8388608
        24: 16777216
        27: 33554432
        30: 67108864
    derivation_assertions:
      - '16*1024+16*3072=65536.'
      - '65536/262144=1/4.'
      - 'For every cluster, sum(X^2)=kappa*sum(X).'
      - 'For every concentrated cluster, sum(S)=sum(X)/kappa.'
      - 'For diffuse, kappa=1 and sum(S)=sum(X).'

  deterministic_stream_contract:
    xof: SHAKE256
    absorb_rule: 'u16be(key_utf8_length) || key_utf8 || master_seed_32'
    byte_order: big_endian
    lexical_rules:
      - Every key is ASCII and begins with literal EXP-ECDLP-adaa91.
      - Fields occur in the displayed order and use one literal vertical bar as separator.
      - Field names and values contain neither a vertical bar nor an equals sign.
      - bits has width 2, cluster width 2, root width 4, draw width 4, and position width 2.
      - The u16 length prefix and fixed field grammar make absorbed messages prefix-free.
    domains:
      cluster_rank: >-
        EXP-ECDLP-adaa91|matched-mean-cluster-rank-v1|bits=<18|21|24|27|30>|
        cluster=<00..31>|component=load-rank-u256
      root_rank: >-
        EXP-ECDLP-adaa91|matched-mean-root-rank-v1|arm=<diffuse|concentrated>|
        bits=<18|21|24|27|30>|cluster=<00..31>|root=<0000..8191>|
        component=success-rank-u256
      bootstrap_index: >-
        EXP-ECDLP-adaa91|matched-mean-bootstrap-v1|arm=<diffuse|concentrated>|
        eta=<-4|0|4>|bits=<18|21|24|27|30>|draw=<0000..8190>|
        position=<00..31>|component=cluster-index-u64
    output_semantics:
      cluster_rank: 'squeeze exactly 32 bytes and interpret as u256be'
      root_rank: 'squeeze exactly 32 bytes and interpret as u256be'
      bootstrap_index: >-
        Squeeze exactly 8 bytes, interpret as u64be, and take the low five
        bits. Because 32 divides 2^64 this is exact uniform reduction with no
        rejection, no cap, and exactly one word per key.
    exact_key_counts:
      cluster_rank: 160
      root_rank: 2621440
      bootstrap_index: 7863360
      total: 10484960
      formulas:
        - '5*32=160.'
        - '2*5*32*8192=2621440.'
        - '2*3*5*8191*32=7863360.'
        - '160+2621440+7863360=10484960.'
    exact_xof_output_bytes:
      cluster_rank: 5120
      root_rank: 83886080
      bootstrap_index: 62906880
      total: 146798080
    collision_policy: >-
      Complete semantic keys must be pairwise distinct. Within each rank
      stream, duplicate 256-bit rank values invalidate the package even though
      the numeric tie-break would define an order; this preserves the stricter
      predecessor promise. Duplicate complete keys, missing ordinals, extra
      keys, or an output-byte residual invalidate before materialization.

  exact_probability_law:
    status: finite_deterministic_fixture_with_exact_resampling_law
    materialized_data_law: >-
      Once the seed is frozen, every root record is deterministic. No observed
      frequency is described as an independent Bernoulli draw. The exact
      quantities are finite-population sums defined by exact_construction.
    bootstrap_law: >-
      Each bootstrap position is exactly uniform on {0,...,31} under the
      SHAKE256 ideal-XOF model because reduction is by the low five bits of one
      u64 word. Keys are disjoint across arm, eta, size, draw, and position.
      The realized package is deterministic and fully regenerable from the
      frozen seed; no cap conditioning, imputation, or dropped draw exists.
    interpretation: >-
      Bootstrap intervals certify only that the estimator and resampling code
      recover a planted finite fixture. They do not provide sampling evidence
      about curves, ECDLP, SHAKE256, or an asymptotic population.

  reversible_artifact_contract:
    canonical_order: 'arm, bits ascending, cluster 00..31, root 0000..8191'
    success_bitset:
      bits_per_stream: 8192
      bytes_per_stream: 1024
      stream_count: 320
      total_bytes: 327680
      bit_order: 'root 0 is most-significant bit of byte 0; zero padding is forbidden because 8192 is byte aligned'
    multiplicity_table:
      format: u16be
      entries_per_stream: 8192
      bytes_per_stream: 16384
      stream_count: 320
      total_bytes: 5242880
      value_rule: 'selected diffuse=1; selected concentrated=kappa; unselected=0'
    cluster_rank_records:
      payload_bytes: 5120
      header_bytes: 320
      total_bytes: 5440
      rule: 'five 64-byte headers plus 160 ordered u256 ranks; header binds size, seed digest, assignments, and payload digest'
    root_rank_stream_digests:
      stream_count: 320
      digest: SHA-256
      total_bytes: 10240
      framing: 'ASCII MRANKv01 || u8 arm || u8 bits || u8 cluster || u32be count || concatenated u256be ranks'
    independent_decoders:
      decoder_A: 'streaming decoder over the success bitset and u16 table'
      decoder_B: 'independent reference decoder that reconstructs selected roots directly from ranks and A_c/kappa'
      equality_gate: >-
        The two decoders must agree root-for-root on selection, X, Y, V, S,
        per-cluster sums, and ordered SHA-256 digests. Shared parsing or helper
        code is forbidden except for reading raw bytes.

  estimators:
    cell_means:
      mu: 'sum(X)/262144 at each arm and size'
      mean_Y: 'sum(Y)/262144 at each arm and size'
      m2: 'sum(X^2)/262144 at each arm and size'
      kappa: 'm2/mu; zero mu is invalid'
      p: 'sum(S)/262144 at each arm and size'
      ratio: 'p/mu; zero mu is invalid'
    bridge_slopes:
      x_axis: 'ln(N/2^24)'
      eta_correction: 'subtract eta*(N^(-1/3)-2^-8) from ln(metric)'
      fit: 'equal-size OLS with free intercept over the five positive values'
      metrics: [kappa, ratio]
      precision: 'directed 256-bit arithmetic; final decimal interval width below 1e-15'
    marginal_gamma:
      model: >-
        For fixed eta, log(p_i)=alpha+beta*log(N_i/16777216)
        +eta*(N_i^(-1/3)-2^-8), with a free alpha and no exposure offset.
      point_fit: >-
        Maximize the exact aggregated binomial log likelihood over the five
        size rows. A deterministic interval-Newton solve at 384-bit precision
        must isolate one interior root to width below 2^-120. No estimator
        substitution, continuity correction, or dropped size is permitted.
      reported_quantity: 'gamma_s=beta+1/3 exactly'
    bootstrap:
      method: size_stratified_nonparametric_whole_cluster_bootstrap
      draws_per_arm_eta: 8191
      resampling_unit: >-
        At each size resample 32 complete clusters with replacement using the
        frozen bootstrap indices. Move all 8192 root records, bitsets,
        multiplicities, and summary values together.
      refits: 49146
      point_fits: 6
      all_fit_attempts: 49152
      interval: >-
        Sort all 8191 converged values. Type-1 ranks 41 and 8151 are the exact
        two-sided 99-percent percentile endpoints and the corresponding
        one-sided 99.5-percent bounds.
      convergence_rule: 'Every draw converges; no draw is dropped, regenerated, winsorized, or replaced.'

  controls:
    - id: C0-static-compiler
      description: >-
        Before materialization enumerate all 10484960 complete keys; prove
        counts, prefix freedom, disjoint domains, exact byte consumption,
        divisibility, archive allocations, and zero resource residuals.
      blocking: true
    - id: C1-seed-rank-regeneration
      description: >-
        Two independent processes regenerate the 160 cluster ranks, 320 root
        stream digests, and 30 bootstrap stream digests from the frozen seed.
        Every byte and ordering must agree.
      blocking: true
    - id: C2-dual-decoder
      description: >-
        Decoder A and independently implemented decoder B must agree on every
        root and summary. This is a nearby-object control against a self-
        consistent encoder/decoder bug.
      blocking: true
    - id: C3-diffuse-identity
      description: >-
        The diffuse arm is the zero-concentration apparatus identity: equal
        means, kappa=1, ratio=1, eta=0 slopes zero, and gamma_s=1/3.
      blocking: true
    - id: C4-concentrated-power
      description: >-
        The concentrated arm preserves E[X] and E[Y] while planting
        kappa=N^(1/3) and p/E[X]=N^(-1/3). Failure to detect both is an
        estimator power failure.
      blocking: true
    - id: C5-arm-label-swap
      description: >-
        Swap only presentation labels after decoding. Numerical outputs must
        swap as complete records and no statistic may change. A change exposes
        arm-dependent hidden state.
      blocking: true

  independent_variables:
    - arm in {diffuse, concentrated}
    - bits in {18,21,24,27,30}
    - eta in {-4,0,4}

  metrics:
    primary:
      - exact E[X] and E[Y] by arm and size
      - delta_kappa under eta=-4,0,4
      - delta_ratio under eta=-4,0,4
      - marginal gamma_s at eta=0 and the diffuse-minus-concentrated gap
    secondary:
      - all key and XOF-output counts
      - per-stream rank, bitset, multiplicity, and summary digests
      - two-decoder rootwise mismatch count
      - bootstrap convergence count and percentile ranks
      - logical I/O, archive bytes, CPU seconds, wall seconds, and peak RSS

  preregistered_prediction:
    exact_common_values:
      diffuse_E_X: '1/4'
      concentrated_E_X: '1/4'
      diffuse_E_Y: '1/4'
      concentrated_E_Y: '1/4'
    eta_zero:
      diffuse: {delta_kappa: '0', delta_ratio: '0', gamma_s: '1/3'}
      concentrated: {delta_kappa: '1/3', delta_ratio: '-1/3', gamma_s: '0'}
      gamma_gap: '1/3'
    concentrated_eta_aware_bridge_slopes:
      - {eta: -4, delta_kappa: '0.3265707003291663', delta_ratio: '-0.34009596633750033'}
      - {eta: 0, delta_kappa: '0.3333333333333333', delta_ratio: '-0.3333333333333333'}
      - {eta: 4, delta_kappa: '0.34009596633750033', delta_ratio: '-0.3265707003291663'}
    source: >-
      Exact finite counts and formulas preserved by IDEA-20260809-2ba70c and
      independently found proposal-ready by TASK-20260809-019240. These are
      pre-registered apparatus expectations, not observations.

  success_criterion: >-
    All blocking controls pass; both decoders have zero mismatches; all exact
    counts and common means agree; diffuse eta=0 slopes are within 1e-12 of
    zero; each concentrated eta-aware slope is within 1e-12 of its registered
    decimal reference; eta=0 gamma values are within 1e-12 of 1/3 and 0; the
    gamma gap is within 1e-12 of exactly 1/3 and its 99-percent bootstrap
    interval excludes zero; every one of 49152 fits converges; and all resource
    and archive residuals are zero. Success certifies only this apparatus on
    this deterministic fixture.
  falsification_criterion: >-
    Any key, rank, XOF-byte, digest, decode, count, mean, slope, gamma,
    bootstrap, convergence, archive, or resource mismatch falsifies the
    inference apparatus at this fixture scope before any curve or selector is
    built. It is apparatus invalidity, not negative evidence about ECDLP.

  budget:
    wall_clock_seconds: 9000
    CPU_seconds: 18000
    memory_bytes: 268435456
    archive_bytes: 33554432
    maximum_runs: 1
    note: >-
      Hard execution ceilings copied into resource_contract for exact staged
      accounting. This design task executes zero runs.

  resource_contract:
    maximum_parallel_shards: 1
    maximum_run_packages: 1
    planned_wall_seconds: 7200
    hard_wall_seconds: 9000
    planned_CPU_seconds: 14400
    hard_CPU_seconds: 18000
    peak_RSS_admission_bytes: 214748364
    peak_RSS_hard_cap_bytes: 268435456
    exact_XOF_output_bytes: 146798080
    archive_allocations:
      - {id: seed_manifest, bytes: 4096}
      - {id: compiler_schedule, bytes: 65536}
      - {id: cluster_rank_records, bytes: 5440}
      - {id: root_rank_digests, bytes: 10240}
      - {id: success_bitsets, bytes: 327680}
      - {id: multiplicity_tables, bytes: 5242880}
      - {id: cluster_summaries, bytes: 30720}
      - {id: bootstrap_indices, bytes: 7863360}
      - {id: bootstrap_stream_digests, bytes: 960}
      - {id: estimator_records, bytes: 6291456}
      - {id: stdout_stderr, bytes: 1048576}
      - {id: environment_source_receipts, bytes: 2097152}
      - {id: hashes_container_index, bytes: 1048576}
    archive_allocated_bytes: 24036672
    archive_hard_cap_bytes: 33554432
    archive_reserve_bytes: 9517760
    archive_write_plus_verification_read_bytes: 48073344
    accounting_rule: >-
      Every allocation receives one write row and one verification-read row.
      XOF absorb/output, rank sorting, bit packing, table writes, decoding,
      hashing, all 49152 fits, and both decoder passes receive separate integer
      operation and logical-traffic rows. Physical cache and machine-runtime
      calibration are measured only in a later authorized run and never
      inferred from these admission ceilings.

  staged_execution:
    - {stage: S0-static-compiler, treatment: false, stop_on_failure: true}
    - {stage: S1-seed-rank-and-materialization, treatment: false, stop_on_failure: true}
    - {stage: S2-independent-decode-and-exact-counts, treatment: false, stop_on_failure: true}
    - {stage: S3-estimators-and-bootstrap, treatment: false, stop_on_failure: true}
    - {stage: S4-archive-write-read-and-package-verification, treatment: false, stop_on_failure: true}

  stopping_rules:
    - Stop before materialization on any S0 compiler failure.
    - Stop before estimation on any seed, rank, digest, or dual-decoder mismatch.
    - Stop and classify invalid on the first hard wall, CPU, RSS, archive, or convergence cap hit.
    - Never stop early for a favorable slope, gamma, interval, or exact mean.
    - Execute all 8191 bootstrap draws in every admitted arm-by-eta cell or report invalid.
    - No later stage may run after a blocking control fails.

  invalidation_rules:
    - A missing, extra, duplicate, malformed, or non-prefix-free key invalidates.
    - A duplicate rank within a declared unique rank stream invalidates.
    - Any imputed, dropped, replaced, capped, or nonconverged bootstrap fit invalidates.
    - Any shared decoder helper beyond raw-byte input invalidates the independence control.
    - Any curve, scalar, selector, point, model, signed-y, or ECDLP artifact invalidates scope.
    - Any resource or archive residual different from zero invalidates.
    - Timeout, crash, or implementation failure is infrastructure evidence only.

  required_artifacts:
    - frozen specification and source-tree digest
    - compiler key enumeration, cardinality proof, and zero-residual resource schedule
    - seed manifest and environment/dependency record
    - five cluster-rank records and 320 root-rank stream digests
    - 320 success bitsets and 320 multiplicity tables
    - 320 cluster summaries and rootwise dual-decoder comparison digest
    - 7863360 retained bootstrap indices and 30 raw-word stream digests
    - six point-fit records and 49146 bootstrap-fit records
    - exact prediction comparison and control verdicts
    - operation, logical-traffic, archive, CPU, wall, and peak-RSS tables
    - exact command, commit, dirty-tree state, stdout, stderr, hashes, and immutable validity receipt

  proof_search_map:
    applicable: true
    bottleneck: >-
      Determine whether equal expected match multiplicity can conceal a
      polynomial loss in Boolean success under the declared estimator.
    baseline_reproduction: >-
      Diffuse data reproduce kappa=1, p/E[X]=1, beta=0, and gamma_s=1/3 from
      exact counts before the concentrated arm is interpreted.
    observation_collision: >-
      Both arms have E[X]=E[Y]=1/4, so a mean-only apparatus collides by
      construction; kappa, p/E[X], and gamma_s must separate them.
    quantifier_order: >-
      Seed, sizes, cluster loads, kappa values, eta values, decoder formats,
      estimators, thresholds, and budgets are fixed before implementation and
      before any result is read.
    method_ceiling: >-
      Passing certifies only that one deterministic apparatus detects its own
      planted one-third bridge separation. It proves nothing about whether
      prime-field ECDLP data exhibit that separation or any positive gamma_s.
    nearby_object_control: >-
      The diffuse arm has identical schema and equal means but no
      concentration; the arm-label swap detects hidden treatment state.

  scale_relevance:
    tier: toy
    justification: >-
      The N labels span 2^18 through 2^30 only to exercise slope machinery.
      No elliptic curve or group computation occurs. The result is an
      apparatus certificate and cannot validate cryptographic scale.

  interpretation_limits:
    - Passing is not evidence for IDEA-20260809-2ba70c's ECDLP mechanism.
    - Failing is not evidence against any ECDLP hypothesis.
    - The ideal-XOF resampling law is a fixture assumption, not a cryptographic finding.
    - No measured runtime, attack exponent, memory exponent, or security impact follows from the design.
    - Novelty remains unverified; the knowledge index was unavailable and empty during design opening.
    - Pollard rho remains the security baseline and this apparatus control has zero SOTA delta.

  runtime_policy:
    design_provider: OpenAI
    design_runtime: native Codex authenticated through ChatGPT
    direct_codex_allowed: true
    direct_claude_code_allowed: true
    api_direct_allowed: true
    local_allowed: true
    fallback_used: false
    degraded_requirements: []
    bedrock_selected_configured_probed_contacted_or_used: false

  execution_status: not_run
  run_ids: []
  observations: []
  results: []
