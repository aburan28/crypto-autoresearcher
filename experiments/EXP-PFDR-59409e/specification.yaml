ic polynomial factorization may be used only if the exact algorithm and version are frozen in the execution lock and charged; no hidden random solver choice. If the certified ideal contains1, archive its explicit source-generator combination and return an empty quotient and empty solution list; do not attempt multiplication matrices of dimension0. A quotient dimension or matrix rank alone never certifies UNSAT.",
