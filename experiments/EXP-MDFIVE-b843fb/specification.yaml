experiment:
  id: EXP-MDFIVE-b843fb
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-85ce8c; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-85ce8c
  question_id: RQ-MDFIVE-6870c1
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Compute a dependency-set generalisation of chunk separation across matched permutation-type
    and recurrence-type schedule families at fixed step count, with backward-compatibility and saturation
    nulls and a three-rule expansion sweep.
  objective: 'The run reduces one uncertainty: whether schedule type, isolated from step count and
    state size, systematically changes the split statistic that meet-in-the-middle accounting rests
    on. As parts: (i) it establishes that the generalised statistic is backward compatible, by requiring
    an identity-expansion recurrence schedule to reproduce permutation-type values exactly, without
    which no cross-type number is interpretable and the run halts; (ii) it produces two distributions
    over 10^4 shape-matched schedules per type, so the comparison is between distributions rather
    than between two hand-picked instances, and it locates MD5 inside its own type''s distribution
    so that MD5''s atypicality is not confused with a type effect; (iii) it sweeps three declared
    expansion rules of differing sparsity, which separates a genuine type effect from an artefact
    of one rule''s density and is the control most likely to close the claim honestly. The run reduces
    no uncertainty about any deployed hash function, states its transfer assumption as unverified,
    and produces no attack. A null result, meaning overlapping distributions, is a measured obstruction
    to the schedule-type reading of the transfer question and is recorded with its medians and overlap
    so a later record can re-scope rather than re-run.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: under the declared families, the
      declared expansion rules and the dependency-set neutrality definition, the median generalised
      chunk separation for recurrence-type schedules is D steps below that for permutation-type schedules
      at matched step count, with the stated overlap and the stated saturation step counts. What does
      NOT follow: nothing about any deployed hash function, no security comparison between schedule
      types, no complexity of any kind, and no claim that a split of any length is or is not achievable.'
  inputs:
    procedure: STAGE 0 declare the three expansion rules and the dependency-set neutrality definition
      in writing before any computation; cost review time. STAGE 1 implement the generalised statistic
      over dependency sets; cost hours. STAGE 2 run the backward-compatibility check by passing singleton
      sets and requiring exact agreement with the sibling record's MD5 value; cost minutes, and disagreement
      halts the run. STAGE 3 run the fully saturated null and require exactly zero; cost seconds.
      STAGE 4 generate 10^4 permutation-type and 10^4 recurrence-type schedules per expansion rule
      at 64 steps and compute the statistic for all; cost under a minute per rule. STAGE 5 compute
      medians, interquartile ranges, overlap fractions and saturation step counts. STAGE 6 place MD5
      in the permutation-type distribution and report its percentile. STAGE 7 emit the manifest, the
      full statistic arrays and the declared expansion rules verbatim.
    instrument: Python 3.11 standard library using frozensets for dependency sets, with numpy for
      distribution summaries, run under harness/runner.py for the manifest and seeds. The permutation-type
      statistic is imported from the sibling record's module for the backward-compatibility check,
      with its content hash recorded. No hash function is evaluated anywhere in this run; hashlib
      is used only to fingerprint the declared expansion rules into the manifest. No Sage, no solver.
    parameters: 'Step count fixed at 64 for both types. Input words fixed at 16. Permutation type:
      each word appears exactly 4 times. Recurrence type: first 16 steps meet input words directly,
      remaining 48 steps meet words generated by one of three declared rules, sparse with 2 inputs
      per combination, medium with 3, dense with 4. Samples: 10^4 per type per rule, seeds recorded.
      Nulls: identity-expansion recurrence, fully saturated schedule. MD5''s actual schedule as a
      single labelled point. Saturation measured as the first step at which every subsequent dependency
      union equals the full input set.'
  controls:
  - Identity-expansion recurrence null, which must reproduce permutation-type values exactly.
  - Fully saturated schedule null, which must return separation exactly zero.
  - Matched-parameter design holding step count, input count and state size fixed across types.
  - Expansion-rule sweep over three declared rules of differing sparsity, so a type difference driven
    entirely by one rule's density is visible.
  - MD5's actual schedule reported as a point in the permutation-type distribution, so the type comparison
    is not confounded with MD5 being atypical within its own type.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls in the same invocation. First, the identity-expansion recurrence
    schedule, whose dependency sets are all singletons; the generalised statistic must reproduce the
    permutation-type value exactly, which is the backward-compatibility check without which no cross-type
    number means anything. Second, a fully saturated schedule in which every step''s word depends
    on all sixteen inputs; the statistic must be exactly zero. For the comparison to mean anything
    both nulls must hit their forced values, and additionally the permutation-type and recurrence-type
    distributions must each be computed over shape-matched random members rather than from single
    instances, so that a type difference is a difference of distributions.'
  independent_variables:
  - 'schedule type: permutation versus recurrence'
  - 'expansion rule sparsity: 2, 3 or 4 inputs per combination'
  - step count within the schedule
  - 'arm: sampled family, identity-expansion null, saturated null, MD5'
  metrics:
    primary:
    - generalised chunk separation per schedule
    - median separation per type per rule
    - distribution overlap fraction
    - identity-expansion null agreement with the permutation-type computation
    secondary:
    - interquartile range per type
    - saturation step count per rule
    - MD5's percentile within the permutation-type distribution
    - sibling-module content hash
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The difference in median generalised chunk separation between permutation-type and recurrence-type
      schedules at 64 steps, per expansion rule, and the distribution overlap fraction.
    formula: 'For a schedule with dependency sets d_0..d_63, separation S = max over windows [a,b]
      and split points c of (b-a) such that union(d_a..d_{c-1}) omits an element of union(d_c..d_{b-1})
      and vice versa. Predicted: median S_perm minus median S_rec >= 4 steps for every declared rule;
      overlap <= 0.2; identity-expansion null exactly equal to permutation-type value.'
    source: Pre-registered in the parent proposal IDEA-20260816-85ce8c before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The comparison is run at MD5''s actual step count and input count, so the permutation-type
      arm includes the real MD5 schedule with no reduction. The recurrence-type arm is an abstract
      declared family rather than any deployed function''s schedule, and the transfer assumption is
      stated as a first-class field: results describe that family and transfer to a deployed function
      only if that function''s schedule is well approximated by the family, which this run does not
      check and does not assert. No number here may be quoted for any named deployed hash function.'
    correspondence: null
  tail_checks:
  - Identity-expansion null must match the permutation-type computation exactly, bit for bit.
  - Fully saturated null must return exactly zero.
  - Separation must be monotone non-increasing as dependency sets are enlarged, checked on a constructed
    sequence.
  - Halving the sample size must not move any median by more than one step.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt if the backward-compatibility check fails.
  - Halt if the sibling module's content hash differs from the version its owning record used.
  - Fix sample sizes before the run and do not extend after seeing medians.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The identity-expansion null matches exactly, the saturated null returns zero,
    the median separation difference is at least 4 steps in the predicted direction for all three
    expansion rules, and the distribution overlap is at most 0.2, with everything reproducible from
    the manifest seeds.
  falsification_criterion:
  - Identity-expansion null does not match exactly.
  - Saturated null returns nonzero separation.
  - Median difference below 4 steps for any declared rule.
  - Overlap above 0.2.
  - The direction of the difference reverses under any declared rule.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-85ce8c
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must approve the three expansion rules, since they define the recurrence family
    entirely and a family chosen to produce the predicted effect would make the run circular.
  - A ruling is needed on whether dependency-set neutrality is the right generalisation of the sibling
    record's condition, since a coefficient-aware definition would be sharper and would give different
    numbers.
  - The transfer assumption needs an explicit Coordinator statement of what would have to be shown
    for any result here to apply to a named deployed function, so that a later record cannot quietly
    make that leap.
