  executor_assessment:
    protocol_complete: false
    protocol_complete_note: >-
      Stage 0 did not reach a terminal search outcome (neither
      qualifying-curve-found nor full-range-exhausted) within the approved
      budget; M6/Stage 1/Stage 2 were never reached. This is a
      resource_exhaustion outcome per agents/executor.md's failure
      taxonomy, not a completed protocol. The run itself is fully and
      honestly recorded and reproducible; the EXPERIMENT's own question
      (does the additive D3 form survive against D_prod on a
      genuinely-discriminating curve) remains unanswered by this run.
    data_quality: limited
    data_quality_note: >-
      Every number reported (curves examined, primes visited, occupancy
      counts for the prior filter) is exact and complete for the searched
      sub-range. No number is estimated, extrapolated, or fabricated. The
      limitation is scope, not quality: only 91 of 278 declared primes were
      searched.
    requires_rerun: true
    requires_rerun_note: >-
      A follow-up cannot simply "rerun the same script again" and expect a
      different result: the search is deterministic and would retrace the
      identical order and reach the identical resource-exhaustion point
      (subject only to machine-speed variation in the exact prime at which
      the internal safety break fires). A genuine follow-up needs a
      Coordinator decision on how to proceed -- e.g. a larger wall-clock
      budget amendment, a narrower declared prime range, or an
      implementation change to Stage 0's O(p^3)-per-prime root-finding cost
      (which was NOT modified here, since the task authorized only the
      filter change and the M6 addition, not a Stage-0 performance
      rewrite). This report flags the issue; it does not resolve it.
