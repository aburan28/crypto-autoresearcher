        [101, 2000], 278 primes total). 1,405,292 curves in that sub-range
        satisfied the prior weaker filter; zero additionally satisfied the
        corrected max(h_+,h_-)>=2 addition. Classified resource_exhaustion.
    - metric: "Measured throughput speedup vs version 1"
      value: >-
        1.55x pairs/second (25,073.9 vs 16,166.5); 108 primes reached vs 91
        (up to p=751 vs p=641). Real and SR-A1-verified, but insufficient
        to complete the full declared range within the unchanged 900s
        budget. See measured_speedup_disclosure above.
    - metric: "M6 pre-Stage-1 sanity check (D_sum != D_prod?)"
