  executor_assessment:
    protocol_complete: false
    protocol_complete_note: >-
      Stage 0 did not reach a terminal search outcome (neither
      qualifying-curve-found nor full-range-exhausted) within the approved
      budget, for the second run in a row. M6/Stage 1/Stage 2 were never
      reached. This is a resource_exhaustion outcome per
      agents/executor.md's failure taxonomy, not a completed protocol. The
      run itself, and the SR-A1 equivalence gate that authorized its
      method, are fully and honestly recorded and reproducible. The
      EXPERIMENT's own question (does the additive D3 form survive against
      D_prod on a genuinely-discriminating curve) remains unanswered.
    data_quality: limited
    data_quality_note: >-
      Every number reported (SR-A1 gate pairs/disagreements, curves
      examined, primes visited, occupancy counts, throughput) is exact and
      complete for what was actually computed. No number is estimated,
      extrapolated, or fabricated. The limitation is scope (108 of 278
      primes), not quality.
    requires_rerun: true
    requires_rerun_note: >-
      A follow-up cannot simply rerun the same script and expect a
      different outcome: the search is deterministic (subject to the
      caveats about single-process execution disclosed above) and would
      retrace the identical order and reach nearly the identical
      resource-exhaustion point. This experiment has now resource-exhausted
      TWICE under two different Z-determination implementations, the
      second measurably faster than the first but still insufficient. A
      genuine follow-up needs a Coordinator decision: e.g. a larger
      wall-clock budget amendment, a narrower declared prime range, or a
      further implementation change (a compiled/vectorized fast-test inner
      loop, since the current pure-Python fast test's own constant-factor
      overhead is now the disclosed bottleneck) -- not authorized by this
      task and not attempted unilaterally here.

