execution_report:
  experiment_id: EXP-MONO-8ec0e5
  implementation_commit: UNKNOWN_PENDING_COORDINATOR_FILL
  implementation_commit_note: >-
    Not recorded by the Executor; git CLI state in this shared,
    concurrently-worked repository is unreliable across concurrent sessions,
    per explicit instruction for this task. The Coordinator fills this in
    at archive time, per this sub-lane's established practice (see
    RUN-MONO-98abb2-1's own manifest.yaml). This run's validity is bound
    additionally to CONTENT via the sha256 values recorded in
    runs/RUN-MONO-8ec0e5-1/manifest.yaml.

  protocol_deviations:
    - >-
      Stage 0's search did not complete within the specification's own 900s
      budget. The reused script structure (from EXP-MONO-98abb2's own
      run_bivariate_test.py) carries an internal Stage-0 wall-clock safety
      break, originally 300s (tuned for the PRIOR, uncorrected filter, which
      succeeded after only 10,316 pairs). The corrected, strictly rarer
      filter (Z=3 AND h_+>=1 AND h_->=1 AND max(h_+,h_-)>=2) did not succeed
      within 300s (first, superseded attempt: 302.9s wall, 7,222,199 pairs,
      primes to 503, none found). The constant was then raised from 300 to
      850 -- using more of the SAME 900s budget the specification already
      approves, not widening the declared range [101,2000], the search
      order, or the qualifying filter -- and the script was re-run once,
      producing this run's own final, archived artifacts. That 850s-limited
      execution ALSO did not find a qualifying curve (863.6s wall,
      13,961,419 pairs, primes to 641, none found). Both attempts are
      disclosed in full in implementation.md; only the second is archived
      as RUN-MONO-8ec0e5-1, per the "one run directory" constraint.
    - >-
      No git command was run and no commit sha is recorded, per explicit
      task instruction for this shared, concurrently-worked repository.
    - >-
      UNEXPECTED OBSERVATION: the specification's own framing characterized
      exhaustion as "very unlikely" given that many curves satisfying
      max(h_+,h_-)>=2 alone were seen in the prior experiment's search. This
      run's own disclosed counters show the PRIOR filter (h_+>=1 AND
      h_->=1, without the corrected addition) was satisfied 830,736 times
      in the searched sub-range (primes 101..641), while the corrected,
      joint condition (adding max(h_+,h_-)>=2) was satisfied ZERO times in
      that same sub-range. The joint condition is evidently much rarer than
      the specification's own framing anticipated, within the searched
      portion of the range.

  runs:
    completed: []
    invalid: []
    failed: []
    resource_exhausted:
      - RUN-MONO-8ec0e5-1

  observations:
    - metric: "Stage 0 search outcome"
      value: >-
        NO QUALIFYING CURVE FOUND within the approved 900s wall-clock
        budget. 13,961,419 (A,B) pairs examined across 91 primes ascending
        from 101 through 641 inclusive (out of the full declared range
        [101, 2000], which has 278 primes total). 830,736 curves in that
        sub-range satisfied the PRIOR filter (h_+>=1 AND h_->=1 alone);
        zero additionally satisfied the corrected max(h_+,h_-)>=2 addition.
        Classified `resource_exhaustion` (the declared range was NOT fully
        searched, so this is distinct from the specification's own
        `no_qualifying_curve_found` outcome, which requires full-range
        exhaustion).
    - metric: "M6 pre-Stage-1 sanity check (D_sum != D_prod?)"
      value: >-
        NOT REACHED. No qualifying curve was found, so M6 was never
        executed. No claim of pass or fail is made.
    - metric: "M1/M2 (R1_sum, R2_sum) and M3 (R1_prod, R2_prod)"
      value: >-
        NOT REACHED. Stage 1's exhaustive census and Stage 2's comparison
        never ran; these metrics have no value from this run, measured or
        modeled, and none is fabricated in their place.
    - metric: "M4 (found curve's own parameters)"
      value: "NOT APPLICABLE. No curve was found within budget."
    - metric: "M5 (number of curves scanned in Stage 0 before success or exhaustion)"
      value: >-
        13,961,419 (A,B) pairs examined before the internal 850s wall-clock
        safety break was hit (neither success nor full-range exhaustion).
        See runs/RUN-MONO-8ec0e5-1/raw-result.json `stage_0.curves_examined`
        and `stage_0.last_prime_fully_scanned` = 641.

  anomalies:
    - >-
      See protocol_deviations above for the full disclosure of the
      budget/safety-break issue and the occupancy-rarer-than-expected
      observation. No crash, exception, or infrastructure failure occurred;
      exit code 0, empty stderr.log, resource usage within all
      specification caps (863.6s <= 900s wall, 793.3s <= 900s cpu, ~22.2MiB
      << 128MiB RSS) for the archived run.
    - >-
      A first, superseded attempt at this same run (STAGE0_WALL_BREAK_S=300,
      the value inherited unmodified from EXP-MONO-98abb2's own script)
      also completed without error, without finding a curve, after 302.9s.
      Its own stdout.log/stderr.log/raw-result.json were produced, read,
      and then overwritten by the second, archived attempt above before any
      manifest or execution_report was written for it -- it was never
      itself a finalized, reported run, so no run record was overwritten or
      re-keyed. It is disclosed here and in implementation.md so it is not
      silently discarded, per AGENTS.md's "record, never discard" rule.

  artifact_paths:
