execution_report:
  experiment_id: EXP-MONO-8ec0e5
  reports_on: >-
    RUN-MONO-8ec0e5-2 (protocol_amendment v1_to_v2, task TASK-20260904-73f77a).
    RUN-MONO-8ec0e5-1's own version-1 execution_report content (the
    corrected-filter re-test that resource-exhausted using a pure
    O(p)-per-pair cubic_roots scan) is PRESERVED IN FULL BELOW under
    `version_1_report` -- it is not overwritten, only superseded as "the
    latest report" by this file's top-level fields, which now describe
    version 2's own outcome. RUN-MONO-8ec0e5-1 itself is retained unchanged
    in its own run directory and its own resource_exhaustion classification
    stands exactly as originally recorded (AGENTS.md rule 4 / the
    amendment's own `affected_runs` block: "NONE ARE RE-SCORED").
  implementation_commit: 334b92d1563ef61cc13b5a30f237b4b6f99c5794
  implementation_commit_note: >-
    Not recorded by the Executor; git CLI state in this shared,
    concurrently-worked repository is unreliable across concurrent
    sessions, per explicit instruction for this task. Filled in by the
    Coordinator at archive time via a verified `gh api` read of origin's
    true tip immediately before this archive commit. This run's validity
    is bound additionally to CONTENT via the sha256 values recorded in
    runs/RUN-MONO-8ec0e5-2/manifest.yaml.

  sr_a1_equivalence_gate_result:
    mandatory_and_blocking: true
    declared_range: {prime_lo: 101, prime_hi: 199}
    n_primes_checked: 21
    n_nonsingular_pairs_checked: 496102
    n_disagreements: 0
    passed: true
    wall_seconds: 5.674
    note: >-
      EXHAUSTIVE, not a sample: every non-singular (A,B) pair for every
      prime in [101,199] was checked. The fast O(log p) splitting test
      (X^p mod f(X) == X, computed by repeated-squaring polynomial
      arithmetic in F_p[X]/(f(X))) agreed with the existing, unmodified
      cubic_roots-based Z-determination on all 496,102 pairs. Per the
      amendment's own frozen_decision_rule.if_sr_a1_gate_passes, the real
      search proceeded using the fast test as the PRIMARY Z-determination
      method.

  stage_0_real_search_result:
    outcome: resource_exhaustion
    declared_range: {prime_lo: 101, prime_hi: 2000, total_primes: 278}
    primes_searched: {from: 101, to_inclusive: 751, count: 108}
    curves_examined: 22185348
    nonsingular_pairs_examined: 22140974
    fast_test_said_splits_completely: 3675407
    curves_satisfying_prior_weaker_filter: 1405292
    qualifying_curves_found: 0
    wall_seconds: 884.8
    cpu_seconds: 883.2
    peak_rss_bytes: 23412736
    internal_stage0_wall_break_seconds: 860
    note: >-
      Full declared range [101,2000] was NOT exhausted (only 108 of 278
      primes). Classified resource_exhaustion, not no_qualifying_curve_
      found. Per AGENTS.md rule 3, NOT evidence for or against
      H-MONO-dd666a in either direction.

  measured_speedup_disclosure:
    version_1_run: {pairs: 13961419, wall_seconds: 863.6, pairs_per_second: 16166.5, primes_reached: 91, last_prime: 641}
    version_2_run: {pairs: 22185348, wall_seconds: 884.8, pairs_per_second: 25073.9, primes_reached: 108, last_prime: 751}
    throughput_speedup_factor_measured: 1.55
    honest_assessment: >-
      A real, SR-A1-verified 1.55x throughput improvement (pairs/second)
      was measured, and 17 more primes were reached (108 vs 91). This is
      the ACTUAL measured speedup, reported plainly rather than any
      estimated or hoped-for figure. It is substantially smaller than an
      informal reading of the amendment's own "the O(p) fallback now
      applies to only ~1/6 of non-singular pairs" reasoning might suggest.
      See implementation.md's ADDENDUM (v2) section for the disclosed
      analysis: the fast test's own O(log p) cost carries non-negligible
      pure-Python per-call constant-factor overhead (roughly a dozen
      modular multiplications per squaring/multiply step, ~20 such steps
      per pair for p up to ~751), which is not yet negligible against a
      single O(p) range-scan at these still-modest prime sizes. THIS
      SPEEDUP WAS NOT SUFFICIENT TO COMPLETE THE FULL DECLARED RANGE within
      the unchanged 900s budget -- the amendment's own stated expectation
      ("should complete the FULL declared [101,2000] range comfortably
      inside that already-approved budget") was NOT met.

  m6_sanity_check_result:
    reached: false
    note: >-
      NOT REACHED. No qualifying curve was found in Stage 0, so M6 never
      ran. No claim of pass or fail is made.

  stage_1_stage_2_results:
    reached: false
    note: >-
      NOT REACHED. Stage 1's exhaustive census and Stage 2's D_sum/D_prod
      comparison never ran; these metrics have no value from this run,
      measured or modeled, and none is fabricated in their place.

  protocol_deviations:
    - >-
      Stage 0's search did NOT complete within the specification's own,
      unchanged 900s budget, for the second run in this experiment (see
      `stage_0_real_search_result` above). The internal Stage-0 wall-clock
      safety break (STAGE0_WALL_BREAK_S) was set to 860s (vs 850s in
      RUN-MONO-8ec0e5-1), to leave a little less headroom given the SR-A1
      gate itself also runs first inside the same unchanged 900s total
      budget. This did not widen the declared range, reorder the search, or
      alter the qualifying filter -- only the internal safety-break
      constant and the Z-determination method (per the amendment) changed.
    - >-
      EXECUTOR PROCESS-MANAGEMENT ERROR, FULLY DISCLOSED (operational, not
      scientific): during this task's execution, the Executor's first
      script invocation was moved to a background task by the harness after
      exceeding a tool-level timeout; the Executor mistakenly judged (via
      sandbox-degraded `ps`/`pgrep` output) that it had died, deleted its
      log files, and launched a second, independent invocation against the
      same run directory while the first was, in fact, still running. The
      first attempt completed on its own with a numerically-consistent but
      ultimately DISCARDED `raw-result.json` (its own stdout/stderr became
      unrecoverable once its log file paths were deleted and recreated by
      the second invocation). The Executor then killed the second,
      not-yet-complete process, emptied the run directory, and executed a
      THIRD, single, uncontended run, which is the one archived as
      RUN-MONO-8ec0e5-2 and reported throughout this file. No number in
      this report or in runs/RUN-MONO-8ec0e5-2/ comes from either the
      discarded first attempt or the killed second attempt. Full timeline
      in implementation.md's ADDENDUM (v2) section, per AGENTS.md's
      "record, never discard" rule.
    - >-
      No git command was run and no commit sha is recorded, per explicit
      task instruction for this shared, concurrently-worked repository.
    - >-
      UNEXPECTED OBSERVATION: the corrected filter's occupancy remains
      exactly zero throughout the now-extended searched sub-range
      (primes 101..751, 108 primes, 22,140,974 non-singular pairs), while
      the weaker prior filter (h_+>=1 AND h_->=1 alone) is satisfied
      1,405,292 times in that same sub-range. Consistent with, and an
      extension of, the same observation already disclosed in
      RUN-MONO-8ec0e5-1's own execution_report.yaml.

  runs:
