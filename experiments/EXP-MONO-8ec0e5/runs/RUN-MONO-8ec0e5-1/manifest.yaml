  outcome_summary: >-
    Stage 0's search for a curve satisfying Z=3 AND h_+>=1 AND h_->=1 AND
    max(h_+,h_-)>=2 (the corrected filter, per CORR-20260904-b9f9c1) did NOT
    find a qualifying curve within the approved 900s wall-clock budget.
    13,961,419 (A,B) pairs were examined across 91 primes ascending from 101
    to 641 (inclusive) before the script's own internal wall-clock safety
    break (850s, itself inside the 900s specification budget) was hit. This
    is classified `resource_exhaustion`, NOT `no_qualifying_curve_found`
    (which would require the FULL declared range [101,2000] to be
    exhausted) -- the declared range was NOT fully searched. M6, Stage 1 and
    Stage 2 were never reached. Per AGENTS.md rule 3 and
    agents/executor.md's failure taxonomy, this is not evidence for or
    against H-MONO-dd666a in either direction. See implementation.md for the
    full disclosure, including the reused-but-superseded first attempt at
    this run (STAGE0_WALL_BREAK_S=300s, stopped at p=503 after 302.9s
    without finding a curve) that led to raising the internal safety break
    to 850s before this authoritative execution.

  protocol_deviations:
    - >-
      THE SEARCH DID NOT COMPLETE WITHIN THE APPROVED BUDGET. The reused
      script structure (from EXP-MONO-98abb2's own run_bivariate_test.py)
      carries an internal Stage-0 wall-clock safety break, originally 300s,
      whose purpose is to reserve time within the specification's own 900s
      total budget for Stage 1's exhaustive census if a curve is found. That
      value was tuned for the PRIOR (uncorrected) filter, which happened to
      succeed after only 10,316 (A,B) pairs. This experiment's corrected,
      strictly rarer filter (adding max(h_+,h_-)>=2) did not succeed within
      300s (first attempt: 302.9s wall, 7,222,199 pairs examined, primes up
      to 503, no qualifying curve). The internal constant
      (STAGE0_WALL_BREAK_S) was then raised from 300 to 850 -- USING MORE OF
      THE SAME 900s BUDGET THE SPECIFICATION ALREADY APPROVES, NOT WIDENING
      THE DECLARED SEARCH RANGE [101,2000], THE SEARCH ORDER, OR THE
      QUALIFYING FILTER -- and the script was re-run once, producing this
      run's own final, authoritative artifacts. That second, 850s-limited
      execution ALSO did not find a qualifying curve (863.6s wall,
      13,961,419 pairs, primes up to 641). Both attempts used the identical
      declared search order and identical qualifying filter; only the
      internal safety-break constant changed between them, and only the
      second (850s) attempt's stdout/stderr/raw-result.json are the ones
      archived in this run directory, per the task's "one run directory"
      constraint. Both attempts are disclosed in full in implementation.md;
      neither is discarded or hidden.
    - >-
      No git command was run and no commit sha is recorded, per the
      dispatching Coordinator's explicit instruction for this shared,
      concurrently-worked repository. See `code.commit_note`.
    - >-
      UNEXPECTED OBSERVATION, DISCLOSED PLAINLY: the specification's own
      stage_0 description characterized exhaustion as "very unlikely given
      EXP-MONO-98abb2's own search already passed 10,316 (A,B) pairs, many
      satisfying max(h_+,h_-)>=2 alone, before landing on its own excluded
      coincidence point." This run's own disclosed counters
      (`z3_curves_with_prior_filter_h_plus_ge1_h_minus_ge1_total` = the
      count of curves satisfying the PRIOR filter h_+>=1 AND h_->=1 alone,
      without the corrected max(h_+,h_-)>=2 addition, tallied throughout the
      search) show that the prior filter alone was satisfied 465,254 times
      through p=503 (first attempt) and 830,736 times through p=641 (second,
      archived attempt), yet NONE of those curves
      additionally satisfied max(h_+,h_-)>=2 within the searched range. The
      joint condition is evidently much rarer than the specification's own
      framing anticipated. This is reported here as a plain occupancy fact
      about the searched sub-range; no claim is made about the full declared
      range [101,2000], most of which remains unsearched.

