experiment:
  id: EXP-MONO-8ec0e5
  version: 1
  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-09-04'
  hypothesis_id: H-MONO-dd666a
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  coordinator_approval_rationale: >-
    APPROVED. This is DEC-20260904-c4be2f's own named high-priority
    next_action: a corrected re-run of the joint (h_+, h_-) bivariate test
    that EXP-MONO-98abb2 could not complete because its own filter admitted
    a coincidence point. This specification's own Stage-0 filter
    (max(h_+,h_-)>=2, in addition to h_+>=1 AND h_->=1) is PROVEN, by two
    independent reviewers of the prior round, to exclude the only point
    where the two competing predictions coincide -- so unlike the prior
    attempt, ANY outcome here is genuinely discriminating.

  title: >-
    Corrected re-test: does the additive D3 closed form survive on a
    curve with BOTH h_+>=1 and h_->=1 AND max(h_+,h_-)>=2, provably
    excluding the coincidence point that made EXP-MONO-98abb2 inconclusive?

  what_this_is_not:
    - Not a discrete-logarithm computation, not an ECDLP attack, not relation collection.
    - Not an ECDLP cost, runtime, exponent, or cryptographic-scale claim.
    - >-
      Not a re-run of EXP-MONO-98abb2 in the sense of expecting the same
      curve or the same (non-)result -- the corrected filter provably
      cannot land on that experiment's own coincidence point.
    - Not a test of the non-split strata.
    - Not a re-scoping of H-MONO-93bc4d's own already-closed collision-rate formula.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: whether, on a specific found curve with h_+>=1, h_->=1,
      and max(h_+,h_-)>=2, the additive closed-form prediction matches an
      exhaustive census exactly while the named multiplicative rival does
      not. Because the filter provably excludes the only coincidence
      point, a match here (or a mismatch) is genuinely informative either
      way -- unlike EXP-MONO-98abb2's own inconclusive result.
    what_no_outcome_can_support: >-
      No outcome supports any relation-rate, cost, exponent, or
      cryptographic-scale claim. No outcome resolves the non-split strata
      or the cross-lane H-MONO-93bc4d question.

  inputs:
    construction_reused: >-
      EXP-MONO-0e6e8f's own already-independently-verified Q_e(T)
      construction and classification method, and EXP-MONO-98abb2's own
      already-independently-verified Stage-0/1/2 pipeline structure,
      reused unmodified except for the Stage-0 filter, which now ADDS
      "max(h_+,h_-) >= 2" to the prior "h_+>=1 AND h_->=1" condition.
    domain: EXP-MONO-8ec0e5/v1
    search: >-
      Scan ordinary curves (varying A,B) at toy primes in [101,2000], SAME
      fixed ascending order as every prior experiment in this sub-thread
      (prime asc, then A asc, then B asc), until a curve with Z=3 AND
      h_+>=1 AND h_->=1 AND max(h_+,h_-)>=2 is found. Disclose the exact
      number of curves scanned before success, or exhaustion. Do NOT
      hard-code or special-case any specific (A,B) pair from any prior
      review or run.
    census: >-
      On the found curve, exhaustively enumerate the distinct-split (Z=3)
      residual stratum's own base points, classify each via the
      already-verified Q_e(T) construction, and tabulate exact
      #1^4, #2+1+1, #2+2 counts.

  stage_order:
    stage_0:
      name: search for a Z=3, h_+>=1, h_->=1, max(h_+,h_-)>=2 curve
      compute: seconds to minutes
      description: >-
        Scan curves as described above. Report success (with the exact
        curve, its n_+, n_-, h_+, h_- values) or exhaustion (a reportable
        non-finding per HEUR-CELL-4, not a falsification -- very unlikely
        given EXP-MONO-98abb2's own search already passed 10,316 (A,B)
        pairs, many satisfying max(h_+,h_-)>=2 alone, before landing on
        its own excluded coincidence point).
    stage_1:
      name: exhaustive distinct-split census on the found curve
      compute: minutes
      description: >-
        Reusing EXP-MONO-0e6e8f's own verified construction, exhaustively
        classify every distinct-split base point on the found curve, and
        tabulate the #1^4, #2+1+1, #2+2 counts.
    stage_2:
      name: exact comparison -- observed vs. additive-sum vs. multiplicative rival
      compute: seconds
      description: >-
        Compute BOTH D_sum = h_+ n_- + h_- n_+ (the frozen D3 formula,
        unmodified) and D_prod = h_+ h_- (n_++n_-) (the same named rival
        as EXP-MONO-98abb2) from the found curve's own (n_+, n_-, h_+, h_-)
        values, BEFORE reading Stage 1's own results. Compare each
        formula's own predicted #1^4, #2+1+1 EXACTLY (zero tolerance)
        against Stage 1's own observed counts. Report R1_sum, R2_sum and
        R1_prod, R2_prod explicitly, whether zero or not. ADDITIONALLY,
        before running Stage 1, verify by direct substitution of the
        found curve's own (h_+, h_-) values into the identity
        D_prod - D_sum = h_-(h_+-1)n_+ + h_+(h_--1)n_- that this specific
        curve does NOT sit on the coincidence point -- i.e. confirm
        D_sum != D_prod algebraically BEFORE running the exhaustive
        census, as an explicit, disclosed sanity check that the corrected
        filter worked as intended on this specific instance.

  metrics:
    primary:
      - "M1: R1_sum = observed #1^4 - D_sum-predicted #1^4 (exact integer, zero-tolerance)"
      - "M2: R2_sum = observed #2+1+1 - D_sum-predicted #2+1+1 (exact integer, zero-tolerance)"
    secondary:
      - "M3: R1_prod, R2_prod -- residuals against the named multiplicative rival."
      - "M4: the found curve's own (p, A, B, n_+, n_-, h_+, h_-) values, disclosed in full."
      - "M5: the number of curves scanned in Stage 0 before success (or exhaustion)."
      - "M6: the pre-Stage-1 algebraic confirmation that D_sum != D_prod on this specific curve (the corrected-filter sanity check)."

  preregistered_prediction:
    - quantity: M1, M2
      value: "Exactly 0, under the additive D3 formula (unchanged)."
      formula: "D_sum = h_+ n_- + h_- n_+; see H-MONO-dd666a's own statement field."
      source: IDEA-20260904-4f614a mechanism, unmodified.
    - quantity: M3
      value: >-
        Predicted to differ from 0 (D_sum != D_prod is now GUARANTEED,
        not merely likely, by the corrected filter and the proven
        identity) -- named before any run.
      formula: "D_prod = h_+ * h_- * (n_+ + n_-); same named rival as EXP-MONO-98abb2."
      source: H-MONO-dd666a's own mechanism field, per CORR-20260904-b9f9c1's own proven identity.

  replication:
    planned_runs: 1
    seeds: [20260904007]
    interpretation: >-
      Deterministic once the search order and range are fixed; exact
      reproducibility from the recorded curve and search order.

  budget:
    maximum_runs: 1
    maximum_wall_seconds: 900
    maximum_cpu_seconds: 900
    maximum_peak_rss_bytes: 134217728
    maximum_total_disk_bytes: 10485760
    maximum_workers: 1
    no_network: true

  environment_preconditions:
    consequence: NO CAS AND NO SOLVER IS REQUIRED. Pure Python, reusing already-verified implementations.
    if_a_precondition_fails: >-
      A missing interpreter or an arithmetic exception is
      `failed_infrastructure`, never negative mathematical evidence.
      Exhaustion of the Stage-0 search range without finding a qualifying
      curve is NOT an infrastructure failure -- it is a reportable, valid,
      non-evidentiary outcome per HEUR-CELL-4.

  infrastructure_failure_disposition: >-
    Any crash is recorded with its exact cause and classified
    `failed_infrastructure`. Supports and weakens NOTHING about
    H-MONO-dd666a or IDEA-20260904-4f614a.

  stopping_rules:
    - Do not execute unless separately reviewed, approved, frozen and authorized. (Satisfied here.)
    - Stop and report the Stage-0 search outcome plainly if the declared range is exhausted.
    - Do not silently discard a disconfirming Stage-2 residual, for either prediction.
    - Do not hard-code, special-case, or search-order-bias toward any specific (A,B) pair.
    - >-
      If the pre-Stage-1 algebraic sanity check (M6) finds D_sum = D_prod
      on the found curve despite the corrected filter, STOP and report a
      specification_error immediately -- this would mean the proven
      identity itself, or its implementation here, has a bug, and no
      further stage should proceed until that is resolved.

  invalidation_rules:
    - Any execution while frozen, execution_authorized or evidence_eligible is false.
    - Any post-hoc widening of the Stage-0 search range after observing a result.
    - Any reporting of Stage-2 residuals that omits R1_sum, R2_sum, R1_prod, or R2_prod.
    - Skipping the pre-Stage-1 algebraic sanity check (M6).

  success_criterion: >-
    A run is well-formed evidence if: Stage 0's search outcome is reported
    with the exact curve or exact scan count; the pre-Stage-1 sanity check
    (M6) confirms D_sum != D_prod on the found curve; Stage 1's exhaustive
    census is reported in full; Stage 2's exact residuals against BOTH
    predictions are reported plainly.

  falsification_criterion: >-
    Any nonzero R1_sum or R2_sum on a found, sanity-checked qualifying
    curve.

  outcomes:
    additive_form_confirmed_interaction_rival_excluded: >-
      A qualifying curve is found, the sanity check confirms D_sum !=
      D_prod, R1_sum=R2_sum=0 exactly, and R1_prod or R2_prod is nonzero.
      This is the first genuinely discriminating confirmation of the
      additive form in the joint (h_+>=1, h_->=1) regime -- completing
      H-MONO-1297d7's own unfinished test and warranting extension of
      KN-FIND-edd62c to the full bivariate form.
    additive_form_falsified: >-
      A qualifying curve is found (sanity-checked) but R1_sum or R2_sum
      is nonzero. The additive form is falsified for the joint regime,
      requiring a corrected cross-term.
    both_forms_falsified: >-
      Neither prediction matches exactly. Reported plainly as a genuinely
      surprising result.
    specification_error_coincidence_still_found: >-
      The pre-Stage-1 sanity check finds D_sum=D_prod despite the
      corrected filter. A bug in the identity or its implementation;
      Stage 1/2 do not proceed until resolved.
    no_qualifying_curve_found: >-
      The declared search range is exhausted without finding a qualifying
      curve. Reported as a valid, non-evidentiary occupancy finding.
    infrastructure_or_construction_failure: See infrastructure_failure_disposition. Never mathematical evidence.

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_do_not: >-
      Toy scale only; no transfer to cryptographic scale. A single
      confirmed, genuinely discriminating joint-regime match is a real but
      limited completion of the tested picture.

  required_artifacts_if_later_authorized:
    - Frozen approved specification (this file).
    - Stage-0 search outcome (curve found or range exhausted, with exact scan count).
    - Pre-Stage-1 algebraic sanity check result (M6).
    - Run manifest, command, environment, raw-result.json with the found curve's own full parameters and the exhaustive census's own exact counts.
    - Independent Validator + Red Team review before any citation of this result.

  approval_requirements:
    - This contract is DEC-20260904-c4be2f's own named high-priority next_action.
    - Independent review confirms the found curve's own qualification, the sanity check's own correctness, and the exact residual computations for both predictions.

  approval_status: >-
    APPROVED 2026-09-04 by the Coordinator; see `coordinator_approval_rationale` above.

  source_refs:
    - ledger/hypotheses/H-MONO-dd666a.yaml
    - ledger/proposals/IDEA-20260904-4f614a.yaml
    - ledger/decisions/DEC-20260904-c4be2f.yaml
    - ledger/evidence/EV-MONO-b967e0.yaml
    - ledger/corrections/CORR-20260904-b9f9c1.yaml
    - knowledge/findings/KN-FIND-edd62c.md
    - experiments/EXP-MONO-98abb2/implementation/run_bivariate_test.py
    - experiments/EXP-MONO-0e6e8f/implementation/run_uncond_census.py

  inference:
    requested_policy: executor-implementation
    reasoning_effort: medium
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
