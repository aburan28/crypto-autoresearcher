experiment:
  id: EXP-ALECF-04d97b
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-699a0f; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-699a0f
  question_id: RQ-ALECF-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: A zero-compute provenance audit of the three imported ALECF benchmark packages that decomposes
    each pairwise score delta into circuit, benchmark, and unattributable terms, validated against
    synthetic package triples with known ground truth.
  objective: 'The one uncertainty a run reduces is whether the score differences among the three committed
    ALECF packages are attributable to circuit design on the evidence this repository holds, or whether
    an alternative explanation survives. Concretely: (i) does the score relation score = round(final-row
    toffoli) times final-row peak qubits reproduce for all three packages, which is the premise that
    makes score.json a derivative of an identifiable log row rather than an opaque aggregate; (ii)
    what is the longest byte-identical prefix shared by the three results.tsv files, and does the
    shared-ancestry reading survive a look at every row rather than the head and tail alone; (iii)
    applying a mechanical three-way decomposition, what fraction of each pairwise score delta is uniquely
    attributable to a circuit difference, what fraction to a benchmark difference, and what fraction
    is unattributable, with the surviving explanations enumerated rather than summarized. A run does
    not decide which explanation is true, does not evaluate the circuits, does not re-run the benchmark
    (its Rust harness is not committed here, only README.md, results.tsv and score.json), and does
    not modify or supersede EV-ALECF-001. The deliverable is a decomposition table, a residual fraction
    per pair, the enumerated surviving explanations, and the validation numbers from the synthetic
    control triples that say whether the procedure can be trusted at all.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: on the bytes committed under
      experiments/EXP-ALECF-00{1,2,3}/source/ at the audited commit, the score relation holds or fails
      as measured, the shared log prefix has the measured length, and each pairwise score delta decomposes
      with the measured circuit, benchmark and unattributable fractions under the declared rules.
      WHAT DOES NOT FOLLOW: nothing about which circuit is better, nothing about whether the original
      Autolab campaign was correctly conducted, nothing about the correctness of the imported scores,
      nothing about 256-bit quantum attack cost, and no conclusion that a large residual means an
      error was made. A residual measures what the committed evidence determines, and evidence that
      exists elsewhere and cannot be reached from this environment is neither refuted nor invoked.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes): record sha256 for all nine committed source artifacts and
      freeze the audited paths in the manifest. STAGE 1 (cost: minutes of compute, one hour of engineering):
      parse the three results.tsv files into typed rows, compute pairwise longest byte-identical row
      prefixes, and report row counts and distinct commit identifiers per file. STAGE 2 (cost: seconds):
      verify the score relation per package against every row, not only the last, and report which
      rows satisfy it. STAGE 3 (cost: two to four hours of engineering): implement the three-way decomposition
      as explicit mechanical rules over the provenance tuple, with an enumerated list of surviving
      explanations emitted for every pair. STAGE 4 (cost: one hour): implement the synthetic triple
      generator for the three ground-truth cases and run the identical decomposition code on them.
      STAGE 5 (cost: seconds, same invocation): run the permuted-fork-label control on the real packages.
      STAGE 6 (cost: under an hour): emit the decomposition table, the residual fractions, the control
      validation numbers, and the enumerated explanations, with the run refusing to report real-package
      numbers if the synthetic attribution accuracy falls below the declared threshold.'
    instrument: 'Python 3.11 standard library only for the audit itself: hashlib for artifact hashing,
      csv for tab-separated parsing, json for score files, and exact integer arithmetic for the score
      relation. The synthetic triple generator is a small deterministic script committed alongside.
      harness/runner.py emits the run record and its inference block. No Sage, no numerical libraries,
      no network access, and explicitly no attempt to build or execute the Autolab Rust harness, which
      is not present in this repository: source/ holds README.md, results.tsv and score.json and nothing
      else, and that absence is itself an audited fact.'
    parameters: 'Exactly three real packages (EXP-ALECF-001, EXP-ALECF-002, EXP-ALECF-003), three
      pairwise comparisons, nine committed artifacts. Log sizes as committed: 8, 114 and 8 data rows.
      Synthetic controls: 3 ground-truth regimes times 30 independently generated triples each, with
      log lengths sampled from 5 to 150 rows to bracket the real ones. Permuted-label control: all
      6 permutations of the three fork identifiers.'
  controls:
  - Three synthetic package triples with known ground-truth attribution (pure snapshot-time, pure
    circuit, random), all run through the identical decomposition code in the same invocation as the
    real packages.
  - 'Hash-first discipline: every input file''s sha256 is recorded before parsing, so the audit is
    re-runnable against the exact bytes examined.'
  - 'Arithmetic self-check: the score relation must be re-derived per package and a package where
    it fails is reported as such rather than silently excluded.'
  - A permuted-label control in which the three real packages' fork identifiers are shuffled, which
    must leave the decomposition unchanged because the procedure must not read the fork name.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a synthetic triple of benchmark packages constructed
    so that the ground-truth attribution is known: build three results.tsv files and three score.json
    files from a scripted generator in which the differences are, by construction, purely snapshot-time
    (identical circuit, different truncation point of one log), then a second triple in which they
    are purely circuit (different final rows appended to identical prefixes with a declared spec change),
    then a third in which they are random. The identical differencing procedure runs on all of them
    in the same invocation. For the signal arm to mean anything, the null must show the procedure
    assigning nearly all delta to the correct term in the two constructed cases and nearly all delta
    to the residual in the random case. If the procedure assigns a confident circuit attribution to
    a purely snapshot-time triple, it is broken and the measurement on the real packages means nothing.'
  independent_variables:
  - package pair
  - ground-truth regime of the synthetic triple (snapshot-time, circuit, random)
  - fork-label permutation
  metrics:
    primary:
    - circuit-attributable fraction per pair
    - benchmark-attributable fraction per pair
    - unattributable residual fraction per pair
    - attribution accuracy on synthetic triples per regime
    secondary:
    - longest shared byte-identical row prefix
    - count of rows satisfying the score relation per package
    - count of distinct commit identifiers per log
    - invariance of decomposition under fork-label permutation
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The unattributable residual fraction of the score delta between EXP-ALECF-001 and EXP-ALECF-003,
      under the declared decomposition rules, using only committed artifacts.
    formula: 'Let D = |score(003) - score(001)| = |1624467943 - 1516125312| = 108342631. The decomposition
      assigns weights w_circuit + w_benchmark + w_residual = 1 to D under the mechanical rules, where
      w_residual is the weight of delta consistent with more than one surviving explanation. Prediction:
      w_residual >= 0.5, and correspondingly w_circuit <= 0.5. Validation gate: mean attribution accuracy
      on the 30 synthetic snapshot-time triples must be at least 0.9 before this number is reported.'
    source: Pre-registered in the parent proposal IDEA-20260816-699a0f before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The audited objects are three toy-tier imported packages whose own evidence record
      fixes claim tier toy as a hard ceiling (EV-ALECF-001). No parameter is swept and no extrapolation
      is made: the tested scope is exactly the nine committed files. The only transfer assumption
      is that the decomposition rules, once mechanical, would apply to other imported benchmark packages,
      and that assumption is stated rather than exercised, since no other package is audited here.'
    correspondence: null
  tail_checks:
  - Check every row of each log against the score relation, not only the final row, since a mid-log
    row satisfying it would identify a different authoritative row.
  - Inspect the note field on every row for markers such as 'sync-check baseline' that indicate a
    non-submission row.
  - Check the 114-row log for internal duplication that would indicate repeated identical submissions
    rather than campaign progress.
  - Check for rows where the correct field is not OK, which would change which rows are eligible to
    be authoritative.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - The audit terminates after the three real pairs and the 90 synthetic triples; there is no adaptive
    extension.
  - Report and stop if any committed artifact's sha256 does not match the value recorded at STAGE
    0.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run emits, for each of the three real pairs, a decomposition with named surviving
    explanations and a residual fraction, together with synthetic-control attribution accuracies that
    meet or fail the declared 0.9 gate, and the permuted-label invariance check, with all numbers
    derived from hashed inputs.
  falsification_criterion:
  - The score relation fails on the final row of any package.
  - Attribution accuracy on synthetic snapshot-time triples falls below 0.9, voiding the real-package
    numbers.
  - The decomposition changes under fork-label permutation.
  - The residual on the 001-versus-003 pair falls below 0.1, contradicting the prediction and closing
    the question in the other direction.
  - No byte-identical shared prefix exists across the three logs.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-699a0f
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The mechanical decomposition rules are sketched, not specified; a Coordinator must fix the exact
    predicate for 'benchmark identity' before approval.
  - It must be decided whether analysis.md and implementation.md inside each package count as committed
    evidence for attribution, or whether the audit is restricted to source/.
  - The threshold 0.9 for synthetic attribution accuracy is asserted, not derived, and needs justification
    or replacement.
  - Whether a superseding evidence record should be filed if the residual is large is a Coordinator
    decision and is deliberately not pre-judged here.
