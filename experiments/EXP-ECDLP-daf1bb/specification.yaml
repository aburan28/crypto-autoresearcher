experiment:
  id: EXP-ECDLP-daf1bb
  hypothesis_id: H-ECDLP-a69bea
  version: 1
  title: >
    Exact Hom-triviality calibrator on three
    frozen (p, N) triples
  status: approved
  approved_by: coordinator
  approved_at: '2026-09-08'
  approval_decision: DEC-20260908-5dda73
  approval_basis: >
    Standing user authorization recorded in AGENTS.md on
    2026-09-06 (ideas and experiments always approved once
    the protocol is complete). Coordinator completeness
    check is DEC-20260908-5dda73 after TASK-20260908-037345.
    User confirmation is not an outstanding gate.
  frozen: true
  frozen_at: '2026-09-08'
  execution_authorized: true
  execution_authorized_note: >
    Stage 0 only. Stages 1 and later remain unauthorized
    until an independent review of the Stage 0 instrument
    holds and a later Coordinator decision extends
    execution_authorized_stages. This approval does not
    authorize Stage 1 of EXP-ECDLP-0d1336, does not
    authorize Stage 1 of EXP-ECDLP-1aa0f8, does not
    authorize Stage 1 of EXP-ECDLP-79f8c4, does not
    authorize Stage 1 of EXP-ECDLP-628891, does not
    authorize Stage 1 of EXP-ECDLP-9e9536, does not
    authorize Stage 1 of EXP-ECDLP-90f602, does not
    authorize Stage 2 of EXP-ECDLP-4be480, does not
    authorize Stage 2 of EXP-ECDLP-6a97f4, does not
    authorize Stage 17 of EXP-ECDLP-420e73, does not
    authorize Stage 5 of EXP-ECDLP-a98ea9, does not
    classify W, and does not change H-ECDLP-38f4b4,
    H-ECDLP-a23318, H-ECDLP-536b21, H-ECDLP-3f68f6,
    H-ECDLP-b51c3d, H-ECDLP-4afa77, H-ECDLP-2ac931,
    H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6,
    H-ECDLP-2ade73, or H-ECDLP-a3598b.
  execution_authorized_stages: [0]
  execution_authorized_decision: DEC-20260908-5dda73
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260908-037345
  source_proposal: IDEA-20260905-24b41a
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-5dda73 under the standing 2026-09-06
    user authorization. Stage 0 is the exact Hom
    calibrator. Nets, Miller functions, cubical
    lifts, dual-number jets, and the (L, b) meter
    are a later stage and are not run here.

  objective: >
    Compute brute-force Hom triviality
    on one frozen family (REAL, KF, NULL)
    and decide whether the enumerative Hom
    calibrator works. Stage 0 does not
    construct a net, does not evaluate a
    Miller function, does not lift to dual
    numbers, and does not authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL has both
      homs trivial; KF has multiplicative
      hom nontrivial; NULL has additive
      hom nontrivial; zero p and N rejected.
      Certificate kind none.
    formula: >
      Hom(Z/N, F_p^*) trivial iff gcd(N, p-1)
      is 1. Hom(Z/N, F_p) trivial iff gcd(N, p)
      is 1. REAL is p=17 N=5. KF is p=11 N=5.
      NULL is p=7 N=7. FORCED Stage 0:
      fixture_pass, real_hom_pass,
      known_false_mov_pass, reject_invalid_pass,
      null_anomalous_pass all true.
    source: >
      ledger/proposals/IDEA-20260905-24b41a.yaml
      proof_search_map.baseline_embedding and
      method_ceiling.nearby_object_control.
      Provenance internal; read in this design session.

  design_tightening_stage0_is_instrument_not_net: >
    IDEA-20260905-24b41a also flags nets,
    cubical lifts, Miller functions,
    dual-number jets, and an (L, b) meter.
    Stage 0 does not construct a net, does
    not evaluate a Miller function, does
    not lift to dual numbers, and does not
    claim a pairing. The meter and the four
    constructions are Stage 1+ objects.
    (T2) gcd arithmetic is the only Stage 0
    arm. This is a disclosed tightening,
    not a silent change of the idea's claim.

  inputs:
    fixture:
      real:
        id: REAL
        p: 17
        N: 5
        must_mult_trivial: true
        must_add_trivial: true
        role: real_coprime
      known_false:
        id: KF
        p: 11
        N: 5
        must_mult_trivial: false
        role: known_false_mov_slice
      matched_null:
        id: NULL
        p: 7
        N: 7
        must_add_trivial: false
        role: matched_null_anomalous
      invalid:
        - id: N-zero
          N: 0
          must_reject: true
        - id: P-zero
          p: 0
          must_reject: true
      working_model: >
        Exact gcd tests for Hom(Z/N, F_p^*)
        and Hom(Z/N, F_p) on frozen triples.
        Not a net. Not a Miller function.
        Not a cubical lift. Not a dual-number
        jet.
      do_not_hunt_a_new_curve: true

  independent_variables:
    - object in the frozen family
    - whether N divides p-1

  null_object:
    name: KF MOV-slice p=11 N=5
    construction: >
      N divides p-1. Multiplicative hom
      nontrivial. This is the known-false
      object for a "every (p, N) pair has
      trivial Hom to F_p^*" reading.
    non_degeneracy_check: >
      known_false_mov_pass must be true
      before any REAL Hom is read as a
      measurement.
    dynamic_range_demonstration: >
      N-zero and P-zero must be rejected
      before Hom is read as a census.

  controls:
    - KF multiplicative hom nontrivial (known-false / proves-too-much)
    - REAL both homs trivial
    - NULL additive hom nontrivial
    - zero p and N rejection
    - exact discrete gcd, no sampling
    - triples frozen before any Hom is read

  metrics:
    primary:
      - fixture_pass boolean
      - real_hom_pass boolean
      - known_false_mov_pass boolean
      - reject_invalid_pass boolean
      - null_anomalous_pass boolean
    secondary:
      - REAL gcd(N, p-1) / gcd(N, p)
      - KF gcd(N, p-1)
      - NULL gcd(N, p)
      - wall-clock seconds and peak RSS

  heuristic_under_test: none

  scale_relevance:
    tier: toy
    justification: >
      Three frozen integer triples. No
      transfer to nets, Miller functions,
      cubical arithmetic, or cryptographic n.
    correspondence: null

  tail_checks:
    - REAL is the frozen pair p=17 N=5
    - KF is the frozen pair p=11 N=5
    - NULL is the frozen pair p=7 N=7
    - N-zero and P-zero are rejected

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 0 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: fixture_pass,
      real_hom_pass, known_false_mov_pass,
      reject_invalid_pass, and
      null_anomalous_pass. A miss classifies
      the run failed_infrastructure if it is
      a size or encoding bug, otherwise it
      is a scoped falsification of P-S0-HOM.
    - Stages 1 and later are not authorized.
    - Do not hunt a new curve.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 0 is not in execution_authorized_stages
    - Changing the three triples after this freeze
    - Hunting a new curve because a frozen cell fails
    - Reading Stage 0 as a net, Miller function, cubical lift, dual-number jet, or a decoder
    - Reading Stage 0 as an ECDLP advantage
    - Authorizing Stage 1 of EXP-ECDLP-0d1336 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-1aa0f8 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-79f8c4 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-628891 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-9e9536 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-90f602 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-4be480 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-6a97f4 from this contract
    - Authorizing Stage 17 of EXP-ECDLP-420e73 from this contract
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this contract
    - Editing EXP-ECDLP-a5f766 or H-ECDLP-a3598b
    - Changing H-ECDLP-38f4b4, H-ECDLP-a23318, H-ECDLP-536b21, H-ECDLP-3f68f6, H-ECDLP-b51c3d, H-ECDLP-4afa77, H-ECDLP-2ac931, H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6, or H-ECDLP-2ade73

  success_criterion: >
    Stage 0 succeeds as a measurement when
    fixture_pass, real_hom_pass,
    known_false_mov_pass,
    reject_invalid_pass, and
    null_anomalous_pass are true, and the
    run manifest carries certificate.kind
    none. Success is instrument
    reproduction, not a net claim and not
    an attack.

  falsification_criterion: >
    A certified KF miss of multiplicative
    hom nontrivial after fixture_pass is a
    scoped miss of P-S0-HOM. A certified
    REAL nontrivial hom after fixture_pass
    is a scoped miss of P-S0-HOM.
    Infrastructure bugs are not mathematics.
    Stage 0 does not test P-S1-NET.

  required_artifacts:
    - Stage 0 raw-result.json with the five gates
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt

  assigned_to: executor

  limitations:
    - Three frozen toy integer triples.
    - Not a net. Not a Miller function.
    - Not a cubical lift. Not a dual-number jet.
    - No decoder. No cryptographic transfer.
    - No Stage 1 of 0d1336. No Stage 1 of 1aa0f8.
      No Stage 1 of 79f8c4. No Stage 1 of 628891.
      No Stage 1 of 9e9536. No Stage 1 of 90f602.
      No Stage 2 of 4be480. No Stage 2 of 6a97f4.
      No Stage 17 of 420e73. No Stage 5 of a98ea9.
    - Certificate kind none. No solve or attack.
    - W is not classified.
    - EXP-ECDLP-a5f766 remains another lane.
    - Do not hunt a new curve.
