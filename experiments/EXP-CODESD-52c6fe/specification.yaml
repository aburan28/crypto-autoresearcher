experiment:
  id: EXP-CODESD-52c6fe
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-cdbe94; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-cdbe94
  question_id: RQ-FAEST-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exhaustive enumeration of punctured seed-tree revealed-node antichains at leaf counts 8 to
    1024 and hidden-set sizes 1 to 6, measuring per-level profile distributions, fibre sizes, and
    distance to a matched random-antichain null.
  objective: 'The one uncertainty a run reduces is whether seed-tree opening size, which the whole
    family treats as a design constant, is a genuine random variable with computable structure, and
    whether that structure is a property of puncturing or merely of antichains in trees. Concretely:
    (i) whether the map from hidden leaf sets to per-level cardinality profiles is many-to-one, measured
    as an exact fibre-size histogram over the complete enumeration; (ii) whether antichain cardinality
    has nonvanishing variance at hidden-set sizes of order log L, measured as a coefficient of variation
    swept over t, together with the exact upper-tail fraction exceeding each candidate allowance across
    a swept range; (iii) whether the puncturing-induced profile distribution is distinguishable from
    a uniform random antichain of matched cardinality, measured as total variation distance with an
    exact confidence bound, computed through the identical profile function in the same invocation.
    A run does not reduce uncertainty about any scheme''s allowance, about the security consequence
    of exceeding one, or about seed values, hashes or commitments, none of which are evaluated. It
    reduces uncertainty about whether the opening is an object with measurable state rather than an
    implementation detail.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for complete regular
      trees of branching factor 2, 4 and 8 at the declared leaf counts, under the maximal-disjoint-subtree
      puncturing rule and uniform hidden sets of the declared sizes, the profile distribution, fibre-size
      histogram, tail fractions and distance to the random-antichain null were as tabulated. What
      does NOT follow: nothing about any deployed scheme''s opening-size budget, since none has been
      read; nothing about non-uniform hidden sets induced by a real challenge derivation; and no security
      consequence whatsoever, since exceeding an allowance is not modelled as an event with any downstream
      effect here.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes) freeze the puncturing rule, the profile definition and the
      sweep grid in a fixture. STAGE 1 (cost: hours human) implement tree construction, antichain
      extraction and profile computation; implement round-trip reconstruction. STAGE 2 (cost: minutes
      compute) run round-trip verification exhaustively at L equal to 8, 16, 32 over all hidden sets
      of all sizes; HALT on any failure. STAGE 3 (cost: minutes compute) run the t-equal-1 constant
      check and the branching-factor sweep sanity checks. STAGE 4 (cost: tens of minutes compute)
      run the full enumeration at L in 8 to 1024, t in 1 to 6, branching factor 2, 4, 8, tabulating
      profiles and fibre sizes. STAGE 5 (cost: minutes compute) run the random-antichain null at matched
      cardinality with the same sample count, through the identical profile function, and compute
      total variation distance with a binomial confidence bound. STAGE 6 (cost: minutes compute) run
      the level-wise dynamic program and require exact agreement wherever both run; extend it beyond
      the enumerable range and label those rows as dynamic-program-only. STAGE 7 (cost: minutes) emit
      tables, tail fractions across the swept allowance range, and the one-tree-versus-tau-trees comparison
      at matched total leaves.'
    instrument: 'Python 3.11 standard library: itertools.combinations for hidden-set enumeration,
      collections.Counter for histograms, fractions.Fraction for exact tail fractions, random.Random
      with declared seeds for the null arm. numpy 2.4.6 optional for histogram bookkeeping. No hash
      function is called, no cryptographic library is loaded, no Sage. Run through harness/runner.py
      with immutable run records under an experiments/EXP-* directory.'
    parameters: 'Leaf counts L in {8, 16, 32, 64, 128, 256, 512, 1024}; branching factor in {2, 4,
      8}; hidden-set size t in {1, 2, 3, 4, 5, 6}; enumeration is complete where C(L, t) is at most
      5000000, and is a declared-seed uniform sample of 5000000 hidden sets otherwise, with sampled
      rows labelled. Null arm: an equal number of uniform random antichains at matched cardinality
      per grid point, plus a second null of 1000000 antichains drawn without cardinality conditioning.
      Candidate allowance sweep: every integer cardinality from the observed minimum to the observed
      maximum, so tail fractions are reported as a full curve rather than at one point. Dynamic program
      extended to t up to 32 at L up to 4096, labelled dynamic-program-only.'
  controls:
  - Random-antichain null at matched cardinality, same invocation, same profile function.
  - Round-trip reconstruction of the derivable leaf set from every antichain, exhaustively at small
    L.
  - Dynamic program computing the same distribution independently of the enumeration.
  - t equal to 1, where the profile is a known constant equal to the tree depth for branching factor
    2; must be reproduced exactly.
  - Branching factor sweep (2, 4, 8) to separate binary-tree artifacts from puncturing structure.
  - One-tree versus tau-trees at matched total leaves, to place the effect on the paradigm axis or
    the design-choice axis.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): A random antichain of the same cardinality drawn uniformly from the
    set of all antichains of that cardinality in the same tree, WITHOUT any hidden set behind it,
    pushed through the identical profile computation in the same invocation. For the signal arm to
    mean anything, the puncturing-induced profile distribution must differ from the random-antichain
    profile distribution by more than the sampling error, measured by total variation distance with
    an exact confidence bound. If the two coincide, the measurement has characterized antichains in
    binary trees, not puncturing, and the result is recorded as a controlled null.'
  independent_variables:
  - leaf count L
  - branching factor
  - hidden-set size t
  - arm identity (puncturing signal, matched-cardinality null, unconditioned null)
  - tree layout (one merged tree versus tau independent trees at matched total leaves)
  metrics:
    primary:
    - profile distribution per grid point
    - antichain cardinality mean, variance, coefficient of variation
    - fibre-size histogram with maximum and median
    - total variation distance to the matched-cardinality null with confidence bound
    secondary:
    - upper-tail fraction curve across the swept allowance range
    - enumeration-versus-dynamic-program disagreement
    - round-trip reconstruction failure count
    - one-tree versus tau-trees cardinality difference at matched total leaves
    - wall-clock seconds per grid point
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The coefficient of variation of revealed-antichain cardinality, CV(L, t), and the maximum
      fibre size F(L, t) of the hidden-set-to-profile map.
    formula: CV(L, t) = sqrt(Var[|A|]) / E[|A|] where A is the revealed antichain under a uniform
      hidden set of size t in a complete branching-factor-b tree with L leaves. Predicted CV(L, t)
      is at least 0.02 at t equal to round(log2 L). F(L, t) = max over profiles of the number of hidden
      sets mapping to it; predicted F(256, 4) is at least 2. CV identically 0 falsifies claim (B);
      F identically 1 falsifies claim (A).
    source: Pre-registered in the parent proposal IDEA-20260816-cdbe94 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested leaf counts run to 1024 by enumeration and 4096 by dynamic program, with
      hidden-set sizes to 6 and 32 respectively. These are combinatorial objects, not security parameters,
      so the scale limit is on the enumeration and not on any cryptographic quantity; the dynamic
      program extends the same exact computation further at the price of relying on its own correctness,
      which is why exact agreement with enumeration wherever both run is a halting gate. The transfer
      assumption is stated: results apply to complete regular trees under the declared rule with uniform
      hidden sets, and to nothing else without re-running.'
    correspondence: null
  tail_checks:
  - 't equal to 1: profile must equal the constant single-path profile, exactly, at every L and branching
    factor.'
  - 't equal to L: the antichain must be empty and the profile all zeros.'
  - 'Branching factor 2 versus 4 at matched L: verify the depth changes as expected and the profile
    length changes with it, so no length mismatch is silently padded.'
  - 'Grid points switched from complete enumeration to sampling: verify they are labelled and excluded
    from every exactness claim.'
  - 'Dynamic-program-only rows: verify they are labelled distinctly and never merged into enumeration
    rows in any emitted statistic.'
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt on any round-trip reconstruction failure.
  - Halt if the dynamic program disagrees with the enumeration at any shared grid point.
  - Halt if the t-equal-1 or t-equal-L degenerate checks fail.
  - Stop the sweep and report partial coverage if wall-clock exceeds two core-hours; partial coverage
    is reported as partial, never as a null.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All round-trip and degenerate checks pass, the dynamic program agrees exactly
    with the enumeration wherever both run, and the run emits complete profile distributions, fibre-size
    histograms, tail-fraction curves and null distances at every grid point, with sampled and dynamic-program-only
    rows distinctly labelled.
  falsification_criterion:
  - Maximum fibre size is 1 at every grid point, so the profile loses nothing and is a change of coordinates
    rather than a lossy projection.
  - Coefficient of variation is 0 at every t, so opening size is not a random variable.
  - Total variation distance to the matched-cardinality null is below its confidence bound everywhere,
    so puncturing is indistinguishable from generic antichain structure at the profile level.
  - Round-trip reconstruction fails, voiding the extraction rule.
  - Dynamic program and enumeration disagree, voiding the extension beyond the enumerable range.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-cdbe94
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must fix the puncturing rule to be modelled, since a different reveal rule changes
    the antichain and hence every number, and no specification is available to fix it from.
  - The reference measure for the random-antichain null does real work and must be approved; two are
    proposed here and the Coordinator should decide whether both are reported or one is primary.
  - Whether the dynamic-program extension is admitted at all, given it cannot be cross-checked outside
    the enumerable range.
