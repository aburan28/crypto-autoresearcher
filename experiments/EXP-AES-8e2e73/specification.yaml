experiment:
  id: EXP-AES-8e2e73
  hypothesis_id: H-AES-a8c830
  derived_from_idea: IDEA-20260805-72ec9a
  question_id: RQ-AES-003
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Cost-model measurement - freeze the measured conversion constant T(r, k, cfg) with peak
    RSS, build the generic baseline as the curve B(h) with its measured/modelled boundary
    marked, derive the domination frontier h*, and reproduce the campaign's own committed
    endpoints and its DOMINATED verdict at h = 96

  objective: >-
    The one uncertainty a run reduces is whether this campaign can state ANY cost comparison
    in a frozen, measured unit - and, since two committed throughput figures a factor of 4.43
    apart currently scale every such statement, whether that factor is a configuration
    difference or an unrecorded configuration. A run establishes (i) the measured conversion
    constant T(r, 128, cfg) for r = 3 to 7 at both thread counts, both key-schedule
    treatments and both engines, each with measured peak RSS; (ii) whether the two committed
    figures reconcile as threads x rounds x key-schedule treatment within 20 percent;
    (iii) the derived curve B(h) with its measured/modelled boundary marked and the frontier
    h*; (iv) whether a RUNNABLE baseline at h in {96, 100, 104} agrees with the derived B(h)
    within variance, recovers the key, and shows the forced 16x graded ratios; and (v) whether
    the curve reproduces the campaign's committed endpoints and returns DOMINATED on its
    committed hinted mode. NO MARGIN IS CLAIMED AGAINST ANY REFERENCE and this contract
    completes no criterion by itself.

  what_this_is_not:
    - >-
      Not an attack, a cryptanalytic result, or a margin claim against any reference. It
      builds the instrument that would let a margin be claimed honestly, and claims none.
    - >-
      Not a statement about full-round or deployed AES, and not a comparison to published
      cryptanalysis in either direction.
    - >-
      Not a completion of any campaign criterion. By the question record's own ruling a
      measured throughput receipt is INFRASTRUCTURE.
    - >-
      Not a status change to any committed evidence record or decision. If the reconciliation
      shows a committed figure was misconfigured, the resolution is a SUPERSEDING correction
      record under a new id, never an edit.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run has been
      executed under this contract.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE. On THIS machine and THIS build, for AES-128 at r = 3 to 7
      under the declared configurations: the measured conversion constant is the reported
      table; the two committed figures do or do not reconcile within 20 percent; the derived
      curve B(h) and the frontier h* take the reported values; and a runnable baseline at
      h in {96, 100, 104} does or does not agree with the derivation. WHAT DOES NOT FOLLOW -
      no margin for any construction against any reference; nothing about full-round or
      deployed AES; nothing about any other machine, since T is machine-specific; no comparison
      to the published frontier in either direction; and no completion of any criterion, since
      this is infrastructure by the question record's own ruling.

  inputs:
    procedure: >-
      STAGE 0 (reading, zero compute). Open the committed measurement receipt and the earlier
      batch package receipt, identify the EXACT configuration behind each of the two committed
      throughput figures, and record which one the committed cost model adopts. If the model
      already fixes one, the audit narrows to confirming it.
      STAGE 1 (measurement, minutes). Measure T(r, 128, cfg) for r = 3, 4, 5, 6, 7 at 1 and 4
      threads, key schedule amortised AND charged per trial, on the pinned pure-Python harness
      and on the hardware-accelerated path SEPARATELY AND LABELLED, with measured peak RSS at
      every point. FREEZE AND HASH-COMMIT THE TABLE BEFORE STAGE 3.
      STAGE 2 (derivation, zero compute). Evaluate B(h) and h*, place every construction the
      campaign has built onto the curve by its READ h, and check the two committed endpoints -
      h = 0 against the definitional reference and h = 96 against the recorded exhaustive-search
      figure. MARK THE MEASURED/MODELLED BOUNDARY at every h.
      STAGE 3 (baseline implementation, hours). Implement exhaustive search over an
      h-bit-hinted residual as a RUNNABLE artifact, tuned in good faith, and RUN it at
      h in {96, 100, 104} where it completes. Record measured wall clock, measured peak RSS,
      query count and kind, and the success-probability convention. Compare against the derived
      B(h) at the same h: the derivation and the run must agree within measured variance, and a
      disagreement means the conversion constant does not convert.
      STAGE 4 (controls, minutes). Run the h = 128 null, the no-op sibling loop, the graded
      ratios at h = 104, 100, 96, and the curve's verdict on the committed hinted mode.
      STAGE 5 (zero compute). Emit the T table, the B(h) table as a TUPLE of (time, measured
      peak RSS, queries with their kind) at every h, the frontier h* with the T used to compute
      it named in the same line, and the archive restatement of every prior cost figure in the
      frozen unit - restating being explicitly not re-measuring.
    instrument: >-
      Measurement on the execution machine only, no external dependency. The pinned pure-Python
      harness and the hardware-accelerated C path measured separately and never mixed in one
      column. Peak RSS measured, never modelled. The T table and the B(h) curve are
      hash-committed before any candidate construction's cost is measured under them. Recorded
      through harness/runner.py.
    parameters: >-
      k = 128; r in {3, 4, 5, 6, 7}; threads in {1, 4}; key schedule amortised and charged per
      trial; engines pinned-harness and hardware-accelerated, labelled separately; runnable
      baseline at h in {96, 100, 104}; null at h = 128; producer task envelope 1600 seconds;
      average-case convention 2^(k-1-h) applied on BOTH sides and declared once.

  controls:
    - >-
      NULL OBJECT, FORCED VALUE PRE-DERIVED, CAN FAIL. The baseline run at h = 128, where the
      residual is empty and the cost is one verification. FORCED: measured time equal to the
      verification cost alone within timing noise. If the implementation charges more, it
      carries uncharged setup and EVERY other point on the curve is inflated.
    - >-
      POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR. The baseline at h = 104, residual 2^23,
      must COMPLETE and must RECOVER THE KEY. If it does not recover a key it is not a
      key-recovery baseline and no comparison to it is admissible.
    - >-
      GRADED CONTROL, THREE INTERIOR POINTS, MONOTONICITY REPORTED. Measured baseline time at
      h = 104, 100, 96, whose forced ratios are exactly 16 and 16. A measured ratio departing
      from 16 localises the departure to a residual size and shows the search loop is not
      encryption-dominated.
    - >-
      SIBLING NULL ISOLATING THE CHARGED QUANTITY. The identical loop with the encryption
      replaced by a no-op of the same call structure. The difference isolates cipher work from
      loop overhead, which is exactly what T must measure and what a naive timing conflates.
    - >-
      NEARBY-OBJECT CONTROL WHERE THE HOPED-FOR CONCLUSION MUST FAIL. The campaign's committed
      hinted mode at h = 96, where domination is independently measured and committed. The curve
      MUST return DOMINATED there; a margin means the framework is wrong.
    - >-
      ORDERING CONTROL. The T table and B(h) are HASH-COMMITTED BEFORE any candidate
      construction's cost is measured under them. Absence of that commitment is
      invalid_measurement by the campaign criterion's own wording.
    - >-
      ARCHIVE CHECK, ZERO COMPUTE. Enumerate every prior cost figure under this goal and restate
      it in the frozen unit. Restating is NOT re-measuring and the distinction is preserved in
      the output.

  independent_variables:
    - round count r
    - thread count
    - 'key-schedule treatment: amortised versus charged per trial'
    - 'engine: pinned pure-Python harness versus hardware-accelerated path'
    - hint budget h
    - 'loop arm: real encryption versus no-op sibling'

  metrics:
    primary:
      - >-
        T(r, k, cfg) in encryptions per second, MEASURED, for r = 3..7 at each (threads,
        key-schedule treatment, engine), with measured peak RSS at each point. Every cell is
        labelled MEASURED; no cell mixes measured and modelled.
      - >-
        The reconciliation ratio of the two committed throughput figures against the product
        (thread count) x (round-count ratio) x (key-schedule treatment factor), reported with
        its percentage discrepancy, or an explicit statement of failure to reconcile.
      - >-
        B(h) as a TABLE OF TUPLES (time in seconds, measured peak RSS, query count and kind) at
        every h, with each h labelled MEASURED-END-TO-END or MODELLED (measured constant applied
        to a derived count). The boundary between them is marked explicitly.
      - >-
        h* = k - 1 - log2(1600 T), reported with the exact T used to compute it named in the
        same line.
      - >-
        Measured baseline wall clock, measured peak RSS, query count and kind at h in
        {96, 100, 104}, and the signed discrepancy against the derived B(h) at the same h.
      - >-
        Graded ratios between consecutive measured baseline points, whose forced value is 16.
      - >-
        The curve's verdict on the campaign's committed hinted mode at h = 96, which must be
        DOMINATED.
    secondary:
      - The no-op sibling loop's cost as a fraction of the real loop.
      - The h = 128 null's measured time against the verification cost alone.
      - Key recovery outcome of the baseline at h = 104.
      - Every campaign construction placed on the curve with its READ h and its COUNTED residual.
      - The archive restatement of prior cost figures in the frozen unit, labelled restated not re-measured.
      - sha256 of the T table and of the B(h) curve, with their commit timestamps.

  heuristic_under_test: HEUR-AES-B1
  heuristic_under_test_note: >-
    STAGE 3 and STAGE 4 validate HEUR-AES-B1 of H-AES-a8c830 - that the hinted exhaustive
    search is ENCRYPTION-DOMINATED with negligible per-trial overhead - by the graded control
    with forced 16x ratios and by the no-op sibling that isolates loop overhead from cipher
    work. HEUR-AES-B2, the residual-size assumption, is validated per construction by COUNTING
    the residual from the key schedule rather than inferring it from the byte count. Neither is
    distributional, so neither takes a distributional validation, and the contract says so
    rather than borrowing a template that does not apply.

  cost_model_disclosure:
    measured_vs_modelled: >-
      EVERY REPORTED NUMBER IS LABELLED. MEASURED - T at each (r, cfg); peak RSS at every point;
      baseline wall clock at h in {96, 100, 104}; the no-op and null arms. MODELLED - B(h) at
      every h below about h* - 4, computed as a measured constant applied to an EXACT DERIVED
      COUNT 2^(k-1-h). The two NEVER share a column, and the boundary is marked at the exact h
      where the residual exceeds the producer envelope.
    optimistic_assumptions:
      - >-
        AVERAGE-CASE CONVENTION 2^(k-1-h). DIRECTION OF BIAS: favours the BASELINE by a factor
        of 2 against the worst case. Applied on both sides, so it cancels in a ratio; declared
        because it does not cancel in an absolute figure.
      - >-
        KEY SCHEDULE AMORTISED in the primary T column. DIRECTION OF BIAS: raises T, which
        LOWERS B(h) and therefore makes the baseline look FASTER and domination MORE likely.
        The charged-per-trial column is measured alongside precisely so the bias is visible.
      - >-
        FOUR-CORE SCALING measured rather than assumed linear. The campaign's committed figure
        assumes linearity; DIRECTION OF THAT ASSUMPTION'S BIAS: raises T, lowers B(h), overstates
        domination. Measuring it is inside scope because assuming it is how a factor of 4 enters
        a comparison unnoticed.
      - >-
        ORACLE TRANSPORT CHARGED AT ZERO on the candidate side, because the process is its own
        oracle. DIRECTION OF BIAS: favours the CANDIDATE. It is an artifact of the harness and
        is named as such.
      - >-
        HEUR-AES-B1's encryption-domination. DIRECTION OF BIAS: if false, the real baseline is
        SLOWER than B(h), so domination is OVERSTATED. The graded control and the no-op sibling
        measure it rather than assuming it.
    memory_accounting: >-
      PEAK RSS IS A FIRST-CLASS METRIC AT EVERY POINT, MEASURED AND NOT MODELLED. The dominant
      structure is sized analytically on both sides - the baseline holds two
      plaintext/ciphertext pairs plus a key schedule, which is O(1) and is what makes it hard to
      beat on the Pareto frontier; the campaign's hinted construction holds a 2^20-entry
      candidate bitmap plus parity tables, sized in the same line. Measured peak RSS is
      reconciled against those analytic sizes and a discrepancy is reported, not absorbed. A
      baseline measured above 100 MiB carries uncharged state and must be rebuilt.
    hidden_overhead: >-
      Two overheads hide here and both are disclosed. FIRST, the candidate side's QUERY COST -
      2^33 chosen plaintexts against the baseline's about two known pairs - which is charged at
      zero transport by the harness and named as an artifact. SECOND, the MODELLED half of
      B(h): below about h* - 4 the figure is a measured constant times a derived count, never a
      completed run, and the cost model caps a modelled claim below the top tier. Any margin at
      small h inherits that cap AND MUST SAY SO IN THE SAME SENTENCE.
    standardized_parameter_sets: >-
      Named sets are (k = 128, r) for r in {3, 4, 5, 6, 7}, reduced-round only, at the two
      thread counts and two key-schedule treatments. AFFECTED-VERSUS-SAFE SCOPE: nothing here
      touches full-round or deployed AES, so the affected scope is EMPTY and the statement is
      made explicitly rather than left to inference.

  preregistered_prediction:
    quantity: >-
      h*, the reconciliation discrepancy of the two committed throughput figures, and the
      curve's verdict on the campaign's committed hinted mode at h = 96.
    formula: >-
      h* = k - 1 - log2(1600 T), predicted in [88, 91] for k = 128 and r in 3..7. The committed
      ratio is 4.43 and the re-measured ratio is predicted to be explained by (thread count) x
      (round-count ratio) x (key-schedule treatment) to within 20 percent. The verdict at
      h = 96 is predicted DOMINATED with B(96) in the bracket the two committed figures imply.
      T(3)/T(7) predicted in [1.6, 2.6] with T monotone decreasing in r. Graded ratios predicted
      exactly 16, accepted within [12, 20].
    source: >-
      Pre-registered in the parent proposal IDEA-20260805-72ec9a predictions block and restated
      in H-AES-a8c830 before any run under this contract exists. The h* values 88.0 and 90.2 are
      DERIVED ARITHMETIC from the two committed throughput figures as stated in that proposal,
      not measurements, and they are re-derived at STAGE 2. Never tuned to data.

  scale_relevance:
    tier: toy
    justification: >-
      Reduced-round AES-128 only, on one machine, in the campaign's own cost-model unit. The
      baseline is RUNNABLE TO COMPLETION only at h at or above roughly h* - 4; everywhere else
      B(h) is a measured constant applied to an exact derived count, which is the honest
      structure of a generic-baseline comparison in this environment and which nobody in this
      campaign has written down. THE TRANSFER ASSUMPTION IS STATED AND IS NARROW: that a
      constant measured at h near the frontier converts correctly at smaller h, where the count
      is derived rather than run. That assumption is exactly what the h = 96, 100, 104 agreement
      check tests, and it is why the check is a success criterion rather than a diagnostic.
    correspondence: null

  tail_checks:
    - >-
      Report T per (r, threads, key-schedule, engine) cell separately and never averaged; an
      averaged T is a constant for a configuration nobody ran, which is the exact defect this
      contract exists to fix.
    - >-
      Report the measured/modelled label at every h of B(h), since the boundary is where a
      claim will be laundered.
    - >-
      Report the graded ratios individually, not only their product; a product of 256 across two
      steps is consistent with 8 and 32, which would be a different finding.
    - >-
      Report measured peak RSS beside every time, since a Pareto comparison reported on time
      alone repeats the error a red team is required to attack.
    - >-
      Report the query count and kind on both sides at every h; adding query cost makes the
      domination larger, not smaller, and omitting it flatters the candidate.

  replication:
    seeds: [20260825, 20260826, 20260827]
    independent_instances: 3
    repeat_count_per_cell: 5
    note: >-
      Each throughput cell is measured 5 times and the median reported with the full spread,
      because a single timing on a shared machine is not a measurement. Seeds vary the baseline's
      key and hint material across three independent instances, so the h = 104 key-recovery
      control is not a single lucky draw.

  budget:
    wall_clock_seconds: 5400
    wall_clock_seconds_note: Per run. total_cpu_hours bounds the whole contract.
    total_cpu_hours: 6.0
    memory_gb: 8
    maximum_runs: 30

  stopping_rules:
    - >-
      Stop and report if the h = 128 null costs materially more than the verification cost alone;
      the implementation carries uncharged setup and every point on the curve is inflated.
    - >-
      Stop and report if the baseline at h = 104 fails to recover the key; no comparison to it is
      admissible and nothing negative may be reported from any other stage.
    - >-
      Stop and report if measured T is flat or non-monotone in r; the constant is not usable and
      the curve cannot be frozen.
    - >-
      Do not measure any candidate construction's cost under the T table before the table and the
      curve are hash-committed. That ordering is the criterion this contract serves.
    - >-
      Stop at maximum_runs or total_cpu_hours. Budget exhaustion is a stop, never a negative
      result (AGENTS.md rule 5).

  invalidation_rules:
    - >-
      A timeout, crash or memory exhaustion makes the run failed_infrastructure and is NEVER
      negative evidence about the constant or the curve.
    - >-
      A run in which the T table and B(h) were not hash-committed BEFORE any candidate cost was
      measured under them is invalid_measurement by the campaign criterion's own wording.
    - >-
      A run mixing the pinned-harness and hardware-accelerated engines in one column is
      invalid_measurement.
    - >-
      A run mixing measured and modelled figures in one column, or reporting a modelled figure
      without its label, is invalid_measurement.
    - >-
      A run reporting time without measured peak RSS and without query count and kind is
      invalid_measurement, because the comparison the cost model requires is a Pareto comparison.
    - >-
      A run in which the no-op sibling or the h = 128 null was not executed in the same invocation
      is invalid_measurement.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment and
      requires a new contract.

  success_criterion: >-
    ALL of the following, each decidable from the primary metrics. (1) T is measured at every
    declared (r, threads, key-schedule, engine) cell with measured peak RSS, is monotone
    decreasing in r with T(3)/T(7) in [1.6, 2.6], and the no-op sibling costs at most 20 percent
    of the real loop. (2) The h = 128 null returns the verification cost alone within noise, and
    the baseline at h = 104 COMPLETES AND RECOVERS THE KEY. (3) Graded ratios between h = 104,
    100 and 96 lie in [12, 20]. (4) The measured baseline at h in {96, 100, 104} agrees with the
    derived B(h) within measured variance. (5) h* lies in [88, 91], with the T used named in the
    same line. (6) The curve reproduces both committed endpoints and returns DOMINATED on the
    committed hinted mode at h = 96. (7) The T table and B(h) were hash-committed before any
    candidate cost. A run meeting (1) to (7) FREEZES the constant and the curve. The
    reconciliation of the two committed figures is reported either way and is NOT part of the
    success criterion, because both of its branches are informative.

  falsification_criterion:
    - >-
      Measured T disagreeing with BOTH committed figures by more than a factor of 4 falsifies
      (A1)'s freezability until explained; the curve is not frozen.
    - >-
      T flat or non-monotone in r, or the no-op loop above 20 percent, falsifies HEUR-AES-B1: the
      measurement is loop-dominated and the constant does not convert.
    - >-
      Measured baseline time at h = 96 outside the bracket the committed figures imply falsifies
      the conversion, and the cost model's measured-conversion requirement is unmet.
    - >-
      Graded ratios outside [12, 20] falsify HEUR-AES-B1 and mean the baseline is not dominated
      by the residual search, so it is not a generic baseline.
    - >-
      The baseline at h = 104 failing to recover the key falsifies its status as a key-recovery
      baseline; no comparison to it is admissible.
    - >-
      h* outside [88, 91] falsifies (A3) as stated and must be explained before the curve is used.
    - >-
      The curve returning a MARGIN on the committed hinted mode at h = 96 falsifies (A4): the
      framework contradicts a committed measured comparison and no baseline curve is published.
    - >-
      A construction whose COUNTED residual differs from 2^(k-h) falsifies HEUR-AES-B2; the curve
      must be re-indexed by the residual and every placement recomputed.

  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment
    - >-
      the T table for r = 3..7 at both thread counts, both key-schedule treatments and both
      engines, each cell MEASURED and carrying its peak RSS, hash-committed with a timestamp
    - >-
      the reconciliation of the two committed throughput figures, or an explicit statement of
      failure to reconcile with the discrepancy quantified
    - >-
      B(h) as a table of tuples (time, measured peak RSS, queries with kind) with the
      measured/modelled boundary marked at every h, hash-committed
    - h* with the exact T used to compute it named in the same line
    - >-
      measured baseline wall clock, peak RSS, query count and kind at h in {96, 100, 104}, with
      the key-recovery outcome at h = 104
    - the h = 128 null and the no-op sibling measurements, in the same file as the signal arm
    - every campaign construction placed on the curve with its READ h and its COUNTED residual
    - >-
      the archive restatement of every prior cost figure in the frozen unit, labelled restated
      and explicitly not re-measured

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not approve. This contract is review_required and NOT approved;
      approved_by is null and execution_authorized is false. Approval is the USER's gate because
      it authorizes execution and spends compute.
    - >-
      STANDALONE DISPATCH IS BINDING. The campaign criterion requires the baseline to be built by
      a task that produces NO candidate, with an independent red-team pass specifically on the
      baseline. A task card bundling this with a candidate construction violates the criterion
      it exists to serve and must not be approved.
    - >-
      The cost-model unit and the average-case convention must be confirmed against the committed
      cost model at approval. If the committed model fixes something else, the curve is rebuilt
      in that unit before execution.
    - >-
      Any correction arising from the reconciliation SUPERSEDES under a new id. This contract does
      not authorize an edit to any committed evidence record or decision.

  derivation_provenance:
    tool: coordinator subagent, /design-experiment lifecycle steps 3-5
    source_record: IDEA-20260805-72ec9a
    authored_at: '2026-08-25'
    note: >-
      Every stage, control, forced value and prediction is taken from the parent proposal's
      mechanism, minimal_test, controls, predictions and heuristic_assumptions blocks. The two
      committed throughput figures (3.35e8 and 7.555e7 enc/s), the 4.43 ratio, the h* values 88.0
      and 90.2, the h = 96 bracket of 6.4 to 28.4 seconds and the 69.39 s and 25.66 s
      construction timings are QUOTED FROM COMMITTED IN-REPOSITORY RECORDS as that proposal
      quotes them; none is re-measured here and none is invented. The proposal explicitly did NOT
      open the underlying measurement receipt, so STAGE 0 exists to do that. The cost_model_disclosure
      block - measured/modelled separation, bias DIRECTIONS, analytic memory sizing, hidden
      overhead and named parameter sets - is this contract's addition, required of a cost-model
      measurement experiment. Budgets come from the parent's estimated_cost (implementation medium,
      compute low). No measurement, timing, run or citation is invented.

  derivation_gaps:
    - >-
      THE COMMITTED FIGURES ARE QUOTED, NOT VERIFIED. The parent proposal did not open the
      measurement receipt behind the lower figure and quotes it as the question record quotes it.
      STAGE 0 must open it; if the configuration behind either figure cannot be identified, the
      reconciliation cannot be attempted and that is itself the finding.
    - >-
      WHETHER THE HARDWARE-ACCELERATED PATH IS CHARGEABLE AT ALL is unsettled. It is unpinned
      across r = 3..7 and mixing it into a comparison whose candidate side runs elsewhere would
      manufacture a factor. It is measured and labelled separately, and a Coordinator must decide
      which engine the cost model adopts before any margin is computed under the curve.
    - >-
      THE PRODUCER ENVELOPE OF 1600 SECONDS is taken from the campaign's task sizing. If that
      sizing changes, h* moves and every placement on the curve moves with it. The envelope must
      be recorded in the same line as h*.
    - >-
      THIS CONTRACT COMPLETES NO CRITERION. By the question record's own ruling it is
      infrastructure, and its own honest prior of completing a criterion is zero. It is proposed
      because the generic-baseline criterion is unreachable without it, and any downstream record
      citing it must carry that sentence.
