experiment:
  id: EXP-FROB-30006a
  hypothesis_id: H-FROB-a5bf86
  goal_id: GOAL-FROB-6333a9
  question_id: RQ-FROB-7d8dd4
  proposal_id: IDEA-20260920-b9f0c5
  version: 1
  title: >-
    WDSat conflict ratio vs 2^{ml}/m! on Frobenius-stable vs random factor bases
    (n = 41 primary; n = 43 capacity-gated)
  status: approved
  status_note: >-
    Frozen at version 1 and APPROVED 2026-09-20 by DEC-20260920-cf8ded under
    AGENTS.md standing user authorization (2026-09-06). Designing is not
    approving; this mark is the Coordinator completeness check. Authorizes
    implementation and Stage measurement as defined; does NOT authorize
    attack, DL recovery, or deployed-curve instances. Scientific trials
    require /run after snapshot TASK-20260920-956d12. HEUR-FROB-WDSAT-NULL is
    a new prior — not attributed to IDEA-20260906-a77711
    (DEC-20260920-f1e672).
  approved_by: coordinator
  approved_at: '2026-09-20'
  approval_decision: DEC-20260920-cf8ded
  approval_basis: >-
    Standing user authorization recorded in AGENTS.md on 2026-09-06.
    Coordinator completeness check is DEC-20260920-cf8ded.
  frozen: true
  frozen_at: '2026-09-20'
  execution_authorized: true
  execution_authorized_decision: DEC-20260920-cf8ded
  archived_by: TASK-20260920-956d12
  assigned_to: executor

  objective: >-
    Build Koblitz Weil-descent PDP instances whose factor base is a
    Frobenius-stable intermediate subspace (and a size-matched random
    control), run WDSat on independently certified-UNSAT targets, and report
    the conflict ratio to 2^{m l}/m!. Primary cell decides basis-blind vs
    pruning; n = 43 is decisive when capacity allows.

  class: measurement

  claim_tier: toy
  claim_tier_note: >-
    Toy binary Koblitz PDP UNSAT audit. No ECDLP solve; no deployed target.

  certificate_semantics:
    kind: none
    kind_note: >-
      Measurement of solver conflicts on UNSAT; decomposition certificates
      apply only to any incidental SAT rows (must be verified on the curve
      and excluded from the conflict-ratio primary metric).

  inputs:
    curve_family: >-
      Koblitz y^2 + x y = x^3 + a x^2 + 1 over F_2, base field F_{2^n} with
      n in {41, 43}; a in {0, 1} chosen so #E(F_{2^n}) has a usable prime
      factor (record the order factorization).
    primary_cell:
      n: 41
      m: 2
      l: 20
      ml: 40
      null_conflicts: 549755813888   # 2^40 / 2!
      null_formula: 2^{ml}/m!
      stable_V: >-
        One irreducible degree-20 factor f of (T^{41}-1)/(T-1); V = ker f(σ)
        in the normal-basis / polynomial-basis representation declared in the
        run manifest.
      random_V: >-
        Uniform random F_2-subspace of dimension 20 that is NOT equal to any
        Frobenius-stable subspace; reject and resample if stability test passes.
      unsat_targets: 3
      seeds: [2026092001, 2026092002, 2026092003]
    decisive_cell:
      n: 43
      m: 3
      l: 14
      ml: 42
      null_conflicts: 732986880819.2  # 2^42 / 6; report as exact rational 2^42/6
      null_formula: 2^{ml}/m!
      stable_V: >-
        Each of the three irreducible degree-14 factors of (T^{43}-1)/(T-1).
      random_V: one size-matched non-stable dim-14 subspace
      unsat_targets_per_V: 1
      capacity_gate: >-
        Attempt one stable-V UNSAT. If wall_clock or memory exhausts before
        UNSAT, record resource_exhaustion impediment; do NOT score a
        mathematical null from a timeout.
    solver: >-
      WDSat from SRC-ICPERF-TRIMOSKA-WDSAT-2024, rebuilt per ANF with exact
      MAX_* from the instance (same discipline as EXP-ICPERF-e21835/66fd51).
    regression_gate: >-
      Before primary cells: one shipped Trimoska/ICPERF certified-UNSAT row;
      conflicts within 2x of the archived reference.

  controls:
    - id: C-REG
      text: ICPERF/Trimoska WDSat UNSAT regression within 2x conflicts.
    - id: C-RAND
      text: Random non-stable same-dimension V at the primary cell.
    - id: C-CERT
      text: >-
        Independent UNSAT certificate (Macaulay2/Singular unit ideal on the
        descended system, or exhaustive on a declared reduced fixture) before
        scoring.
    - id: C-SIZE
      text: MAX_ID equals ANF-derived value or the run is invalid.

  independent_variables:
    - n
    - m
    - V_kind (stable | random)
    - which irreducible factor (n = 43)
    - target seed

  metrics:
    primary:
      - wdsat_conflicts
      - null_2_ml_over_factorial
      - conflict_ratio (conflicts / null)
      - unsat_certificate_status
    secondary:
      - decisions
      - wall_s
      - cpu_s
      - peak_rss_kb
      - max_id_anf_match
      - conflict_depth_histogram (only if conflict_ratio <= 0.5)

  heuristic_under_test:
    id: HEUR-FROB-WDSAT-NULL
    statement: Basis-blind reference is 2^{ml}/m!.
    note: New prior; not a corollary of IDEA-20260906-a77711.

  preregistered_prediction:
    recorded_at: '2026-09-20'
    prior: >-
      Coordinator prior BEFORE any primary-cell run: the honest expectation
      after a77711 is basis-blind (ratio within 1% of 1 on both stable and
      random arms). Pruning (ratio <= 0.5) would be a positive surprise and
      opens branch-order follow-on. This prior is NOT attributed to a77711's
      Lemma A1 / Prediction A (those concern invariant-ring rewriting degree,
      not WDSat conflicts) — DEC-20260920-f1e672.
    decision_rule: >-
      Let r_s = median stable-arm conflict_ratio on certified-UNSAT primary
      replicates; r_r likewise for random. If |r_s - 1| <= 0.01 and
      |r_r - 1| <= 0.01 → verdict basis_blind. If r_s <= 0.5 on every
      certified-UNSAT primary replicate → verdict pruning. Otherwise →
      inconclusive with measured (r_s, r_r) reported; no silent rounding into
      either bin.

  replication:
    primary_unsat_targets: 3
    require_all_certified: true

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 14
    maximum_runs: 20
    maximum_workers: 1
    machine_quiet_required: true
    n43_note: >-
      Decisive cell may exhaust resources; that is an impediment, not evidence.

  stopping_rules:
    - Complete primary cell (stable + random) or stop on instrument invalidation.
    - Attempt n = 43 once; on resource_exhaustion checkpoint and continue to reporting.
    - Any protocol change requires an additive amendment before further runs.
    - Do not treat timeout as UNSAT.

  invalidation_rules:
    - Scoring conflicts without an independent UNSAT certificate.
    - Mis-sized WDSat build (MAX_ID ≠ ANF-derived).
    - Fabricated regression pass.
    - Labelling a timeout as basis-blind or pruning.
    - Citing a77711 as implying the conflict null.

  success_criterion: >-
    Primary cell complete with certified-UNSAT ratios and a verdict under the
    preregistered decision_rule (basis_blind | pruning | inconclusive).

  falsification_criterion: >-
    Instrument cannot certify UNSAT on the primary cell with matched MAX_ID;
    or pruning asserted without certificates.

  required_artifacts:
    - experiments/EXP-FROB-30006a/implementation.md
    - experiments/EXP-FROB-30006a/implementation/
    - experiments/EXP-FROB-30006a/trial-plan.json
    - >-
      Per run under experiments/EXP-FROB-30006a/runs/<RUN-ID>/: manifest.yaml,
      command.txt, environment.json, stdout.log, stderr.log, raw-result.json,
      unsat certificates, ANF/CNF inputs, WDSat build config_used.json

  dependencies:
    - SRC-ICPERF-TRIMOSKA-WDSAT-2024
    - SRC-ICPERF-TRIMOSKA-ECICB-2024
    - IDEA-20260918-9abf42 (dimension table only)
    - DEC-20260920-f1e672 (attribution constraint)

  review_required: true
  review_note: >-
    Ordinary review-adversarial after primary cell before any hypothesis
    status move. review-breakthrough only if a pruning claim is promoted as
    contradicting prior FROB negatives.

  interpretation_limits:
    - Toy scope only.
    - Ratio ≈ 1 does not close trace-zero / T_n exponent routes (a77711 arm B).
    - n = 43 absence is capacity, not mathematics.

  inference:
    requested_policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false

  dominated_by: null
  dominated_by_note: >-
    Diagnostic vs 2^{ml}/m!; not an attack Pareto claim. Frontier unchecked
    beyond Trimoska/ICPERF WDSat cells.
  sota_delta:
    time: Unmeasured.
    memory: Unmeasured.
    data_queries: n/a
