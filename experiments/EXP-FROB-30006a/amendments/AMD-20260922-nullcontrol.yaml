  does_not_rewrite: experiments/EXP-FROB-30006a/specification.yaml
  contract_status_unchanged: >-
    EXP-FROB-30006a stays `status: approved`, `version: 1`, `frozen: true`,
    `frozen_at: 2026-09-20`, approved by DEC-20260920-cf8ded. This amendment adds
    to it and does not supersede it. It does not re-approve it and does not
    change `approved_by`.

  supersedes_fields:
    - >-
      preregistered_prediction.decision_rule, clause 2 only: "If r_s <= 0.5 on
      every certified-UNSAT primary replicate -> verdict pruning." Superseded by
      A-2 below, which adds a conjunct. Clause 1 (basis_blind) and clause 3
      (otherwise -> inconclusive) are UNCHANGED.
    - >-
      inputs.solver, to the extent that it leaves the WDSat search mode
      unstated. A-1 states it. Every other part of that field -- the source
