# =============================================================================
# AMD-EXP-FROB-30006a-20260922-nullcontrol
#
# ADDITIVE protocol amendment, authorized by DEC-20260922-e9d35a, written BEFORE
# ANY RUN EXISTS: experiments/EXP-FROB-30006a/runs/ contains only .gitkeep,
# bound by that name in TASK-20260920-956d12's snapshot receipt at commit
# 14ef07b83. No outcome has been observed, so the prohibition on changing a
# success criterion after observing outcomes is not engaged.
#
# WHAT IT ADDS: a declared solver search mode, and a control differential on the
# `pruning` branch of the frozen decision rule.
#
# WHAT IT WEAKENS: nothing. Both numeric gates are unchanged. The pruning branch
# becomes STRICTLY HARDER to satisfy and the basis_blind branch is untouched.
#
# WHAT IT IS NOT: evidence, a prediction, or a claim about what the run will
# find. It is a control, and it asserts nothing about H-FROB-a5bf86 in either
# direction.
# =============================================================================
amendment:
  id: AMD-EXP-FROB-30006a-20260922-nullcontrol
  experiment_id: EXP-FROB-30006a
  decision_id: DEC-20260922-e9d35a
  recorded_at: '2026-09-22'
  kind: additive_protocol_amendment
  authored_by: coordinator
  archived_by: TASK-20260922-0e3b58

  id_form_note: >-
    The identifier is DERIVED from the experiment id, the date and a slug,
    following the committed precedents AMD-EXP-AUXIN-7e2e3d-20260916-bands and
    AMD-EXP-SEMBIN-4fa22c-20260916-collision. `tools/allocate_id.py` has no
    `amendment` type and none was invented; no random 6-hex token is claimed for
