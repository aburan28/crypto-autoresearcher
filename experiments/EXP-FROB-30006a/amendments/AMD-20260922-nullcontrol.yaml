  cites:
    - EV-FROB-b6e1e9
    - EXP-FROB-9af278
    - KN-FIND-47da4e
    - DEC-20260920-cf8ded
    - DEC-20260918-4b7e21
    - TASK-20260922-cd6f21
    - CORR-20260922-9e402f
  cites_note: >-
    EV-FROB-b6e1e9 is cited as a MEASUREMENT WITH ITS PROVENANCE and NOT as this
    program's evidence. DEC-20260922-e9d35a ITEM-1 rules its `strength:
    preliminary` unconferred and forbids it supporting a hypothesis status move,
    a completion criterion, or a knowledge promotion. A CONTROL may rest on such
    a record; a claim may not, and nothing here claims anything.

  # ---------------------------------------------------------------------------
  # THE DEFECTS
  # ---------------------------------------------------------------------------
  defect:
    D1: >-
      THE WDSAT SEARCH MODE IS AN UNDECLARED FREE PARAMETER ON THE PRIMARY
      METRIC. The frozen contract's primary metric is conflict_ratio = WDSat
      conflicts / (2^{ml}/m!). Its `inputs.solver` field names the source record,
      the per-ANF rebuild and the MAX_* sizing but no search mode; the strings
      XORGAUSS, XG and -x do not occur in the specification; and
      `independent_variables` lists n, m, V_kind, which irreducible factor and
      target seed, without the mode. EV-FROB-b6e1e9 measures the mode's effect on
      comparable binary Koblitz point-decomposition instances: WDSat's XG-ext
      mode cuts conflicts 69x at n = 19 (5747 -> 83) and 220x at n = 23
      (148234 -> 675) against its default mode on the same instances. A factor of
      69 to 220 on the numerator of the deciding quantity is not a build detail.
    D1_consequence: >-
      Both verdict bins become mode-determined. `basis_blind` requires
      |r - 1| <= 0.01, a window 0.02 wide, against a knob worth two orders of
      magnitude; `pruning` requires r <= 0.5, which one mode might clear on both
      arms and the other on neither. The verdict would be a fact about which
      binary was built.
    D2: >-
      THE `pruning` BRANCH NEVER CONSULTS THE RANDOM-V CONTROL. The frozen
      decision_rule reads r_r on the basis_blind branch and only r_s on the
      pruning branch. C-RAND is a declared control that the rule does not read
      where it would discriminate, so ANY effect common to both arms -- a loose
      null, a search mode, an instance-size artifact -- returns `pruning`, which
      is a claim specifically about Frobenius stability.
    D2_consequence: >-
      The most consequential positive outcome this campaign can produce would be
      reachable without the control that separates it from its most likely
      confound. A `pruning` verdict would be a positive result about Frobenius
      structure in subfield-curve index calculus, would open the branch-order
      follow-on GOAL-FROB-6333a9's objective names, and under AGENTS.md rule 12
      promoting it as contradicting prior FROB negatives would require
      review-breakthrough at max, which is undegradable.
    what_makes_D2_live_rather_than_hypothetical: >-
      EV-FROB-b6e1e9 measured the confound's magnitude on a factor base with NO
      Frobenius specialness at all. Under XG a plain single-shift baseline sat
      12x and 24x BELOW its own orbit-naive enumeration bound (2^{2 l'} = 1024 at
      n = 19 and 16384 at n = 23; measured 83 and 675), while the SAME instances
      in plain mode sat 5.6x and 9.0x ABOVE it. 2^{ml}/m! is an
      enumeration-naive bound of exactly that kind. That record's own
      resource_check flagged this and said it would be worth knowing BEFORE this
      experiment's result is interpreted.

  # ---------------------------------------------------------------------------
  # THE CHANGE
  # ---------------------------------------------------------------------------
  change:
    A-1_declare_the_search_mode:
      binds: >-
        `search_mode` is an INDEPENDENT VARIABLE of this contract, taking the two
        values `wdsat_default` and `wdsat_xg_ext` (the -x / XORGAUSS search).
      requirement: >-
        At the PRIMARY cell (n = 41, m = 2, l = 20), every certified-UNSAT
        replicate of BOTH arms (stable V and random V) is solved in BOTH modes on
        the identical instance. Conflicts, decisions, wall_s, cpu_s and
        peak_rss_kb are recorded per mode. The same WDSat build and the same
        MAX_* sizing serve both modes for a given instance; if a mode requires a
        different build, that fact is recorded in config_used.json and the two
        builds are reported as such rather than silently compared.
      verdict_computation: >-
        The decision_rule is evaluated SEPARATELY PER MODE. Two verdicts are
        reported.
      mode_disagreement_rule: >-
        If the two modes yield different verdicts, THE RESULT IS `inconclusive`
        with both verdicts, both (r_s, r_r) pairs and both modes reported. It is
        NEVER resolved by selecting a mode, by averaging, by taking the lower
        conflict count, or by declaring one mode canonical after the fact. A mode
        disagreement is a real finding about the metric's dependence on the
        search strategy and is reported as one.
      decisive_cell_n43: >-
        The n = 43 decisive cell attempts `wdsat_xg_ext` FIRST, because it is the
        cheaper mode on the evidence available and the cell is capacity-gated.
        If capacity permits only one mode at n = 43, that cell reports ONE mode
        and is explicitly NOT a mode comparison; the frozen capacity gate is
        unchanged and resource exhaustion remains an impediment, never a
        mathematical result and never a verdict.
      why_both_and_not_one: >-
        Fixing a single mode would have been cheaper and would have been the
        wrong repair. Which mode is "right" for a conflict-count comparison is
        exactly the open question D1 exposes, and choosing one now would answer
        it by fiat before any measurement. Measuring both converts an undeclared
        parameter into a reported one, which is what a control does.

    A-2_control_differential_on_the_pruning_branch:
      prior_clause: >-
        "If r_s <= 0.5 on every certified-UNSAT primary replicate -> verdict
        pruning."
      amended_clause: >-
        Verdict `pruning` requires BOTH of: (i) r_s <= 0.5 on every
        certified-UNSAT primary replicate, and (ii) r_r > 0.5 on the median of
        the same replicates, in the SAME search mode. Both conjuncts are
        evaluated on the same mode and the same replicate set.
      new_named_bin:
        name: null_loose
        condition: >-
          r_s <= 0.5 AND r_r <= 0.5, in the same mode on the same replicates.
        reading: >-
          A FINDING ABOUT THE NULL, NOT ABOUT FROBENIUS STABILITY. It is evidence
          that 2^{ml}/m! -- the contract's declared `heuristic_under_test`
          HEUR-FROB-WDSAT-NULL -- is not a valid basis-blind reference for this
          solver in this mode, because a factor base with no Frobenius structure
          also beats it by a factor of two or more. It is NOT support for pruning
          in any degree and may not be reported as a partial or weak pruning
          result.
        why_it_is_a_sub_bin_and_not_a_new_rule: >-
          The frozen rule's clause 3 already routes everything outside its two
          bins to `inconclusive` with measured (r_s, r_r) reported.
          `null_loose` NAMES one region of that existing branch so it can be
          recognised and reported rather than being recorded as an undifferentiated
          inconclusive. This is why A-2 can be additive: it refines the third
          clause instead of contradicting it.
      basis_blind_unchanged: >-
        Clause 1 is UNTOUCHED: |r_s - 1| <= 0.01 AND |r_r - 1| <= 0.01 ->
        basis_blind. It already consults both arms, which is precisely why it
        needed no repair and is the evidence that the pruning branch's omission
        was an oversight rather than a design.
      no_threshold_is_WEAKENED: >-
        0.5 stays 0.5 and 0.01 stays 0.01. `pruning` gains a conjunct and is
        strictly harder to reach; no bin becomes easier to reach.

    A-3_report_the_arm_to_arm_ratio:
      binds: >-
        r_s / r_r is reported as a PRIMARY quantity beside r_s and r_r, per mode,
        with its per-replicate values and its median.
      why: >-
        Any mode-level or null-level rescaling divides out of r_s / r_r, because
        both arms are divided by the same 2^{ml}/m!. It is therefore the
        basis-sensitive number: the quantity that answers "does V_kind matter"
        without first requiring that the null be correct. It is NOT a new
        verdict bin and no threshold is attached to it; attaching one after
        seeing values would be the prohibited act this amendment exists to
        prevent.

    A-4_null_loose_is_a_result_with_a_forward_obligation:
      binds: >-
        A `null_loose` verdict in any mode obliges the closing evidence record to
        report it as direct evidence against HEUR-FROB-WDSAT-NULL as a reference,
        scoped to the tested cell, arm, mode and solver version, and to state
        that no conclusion about V_kind follows from it.
      why: >-
        Otherwise `null_loose` reads downstream as a failed measurement. It is
        not: the contract names HEUR-FROB-WDSAT-NULL as its
        `heuristic_under_test`, so a demonstration that the heuristic's own
        reference value is unreachable by an unstructured control is an outcome
        about the declared object of the experiment.
      what_it_does_not_oblige: >-
        It does not oblige a hypothesis status move on H-FROB-a5bf86, does not
        discharge C1 or C2 of GOAL-FROB-6333a9, and does not license a knowledge
        promotion. Every one of those still needs independent review and a
        separate committed decision.

    A-5_a_results_index_that_makes_the_run_set_enumerable:
      binds: >-
        experiments/EXP-FROB-30006a/RESULTS.json is a REQUIRED ARTIFACT, written
        after the last solver invocation, accounting for EVERY cell planned in
        trial-plan.json -- including cells that were never run, each with its
        reason. Its binding schema is specified on TASK-20260922-cd6f21 under
        `results_json_schema`.
      why_it_is_part_of_this_amendment_and_not_a_second_one: >-
        A-1 and A-2 CREATE QUANTITIES THAT DID NOT EXIST IN THE FROZEN CONTRACT
        -- a verdict per search mode, an arm-to-arm ratio, and a `null_loose`
        bin -- and the frozen `required_artifacts` names nowhere to report them.
        An amendment that adds a measurement obligation without adding a place
        for it is half an amendment. Folded in here rather than filed as a second
        amendment because this whole record is one unpublished act: nothing in it
        has been pushed, so no reader could have relied on the four-clause
        version, and splitting it would manufacture a history the program never
        had.
      why_it_is_needed_at_all: >-
        A RUN-ID DOES NOT EXIST UNTIL THE RUNNER MINTS IT, so no card can declare
        `runs/<RUN-ID>/manifest.yaml` in advance and none may guess one --
        inventing a run identifier is a fabrication under AGENTS.md rule 5. Yet a
        dispatcher's `artifact_paths` must be exact files
        (`research_dispatch.py` validate_artifact_path). RESULTS.json resolves
        the tension honestly: it is nameable before the run and it makes the
        unnameable set enumerable afterwards. Without it, "which cells ran" is
        answerable only by listing a directory, and a directory listing cannot
        tell a cell that refuted from a cell that was never attempted.
      the_invariant_that_carries_the_weight: >-
        A PLANNED CELL THAT WAS NOT RUN IS RECORDED WITH ITS REASON AND IS NEVER
        SILENTLY ABSENT. Absence and refutation look identical in a directory and
        must not look identical in the record; and a capacity-exhausted cell is
        an impediment, never a verdict and never negative mathematical evidence.
      not_a_results_narrative: >-
        RESULTS.json IS AN INDEX AND A TABLE, NOT AN INTERPRETATION. It carries
        measured values, certificate status, the bin the amended rule yields per
        mode, and `mode_agreement.resolved: false`. It does not argue, does not
        move a hypothesis and is not an evidence record. Note the distinction
        from DEC-20260918-4b7e21's ruling that EXP-SEMBIN-992e73's RESULTS.md is
        an internal working note: that ceiling attached to an UNAPPROVED,
        unreviewed run, not to the filename. This artifact belongs to an approved
        contract executed by a dispatched card under a frozen protocol, and its
        standing is whatever the independent review round confers on it -- which
        is still nothing until that round has run.

  # ---------------------------------------------------------------------------
  # WHAT IS UNCHANGED
  # ---------------------------------------------------------------------------
  unchanged:
    - >-
      Every cell, curve, dimension, seed and factor base: n = 41 / m = 2 / l = 20
      primary with stable V = ker f(sigma) for one degree-20 irreducible factor
      of (T^41-1)/(T-1) and a size-matched non-stable random V; n = 43 / m = 3 /
      l = 14 decisive; seeds [2026092001, 2026092002, 2026092003]; three
      certified-UNSAT primary targets per arm.
    - >-
      Every control as frozen: C-REG (ICPERF/Trimoska regression within 2x),
      C-RAND, C-CERT (independent UNSAT certificate before scoring), C-SIZE
      (MAX_ID equals the ANF-derived value or the run is invalid).
    - >-
      Every invalidation rule, including "Labelling a timeout as basis-blind or
      pruning" and "Citing a77711 as implying the conflict null".
    - >-
      Every stopping rule, the n = 43 capacity gate, and the rule that resource
      exhaustion is an impediment and never a mathematical null.
    - >-
      claim_tier `toy`, certificate_semantics `none`, the interpretation_limits
      block, review_required true, and the inference block.
    - >-
      The contract's own preregistered prior (basis-blind, ratio within 1% of 1
      on both arms), recorded 2026-09-20 and NOT attributed to
      IDEA-20260906-a77711 per DEC-20260920-f1e672. This amendment does not
      restate, revise or score it.

  budget_impact:
    what_changes: >-
      Requiring both search modes at the primary cell roughly DOUBLES the primary
      cell's solver invocations: 2 arms x 3 certified-UNSAT targets x 2 modes.
    why_it_fits: >-
      TASK-20260922-cd6f21 declares maximum_runs 20 and memory_gb 14, inherited
      verbatim from the card it supersedes; the
      contract declares maximum_memory_gb 14, maximum_workers 1 and
      machine_quiet_required true. The campaign budget is unlimited by ECC policy
      (maximum_batches and total_wall_clock_seconds both null) and
      max_concurrent stays 1, so nothing is displaced and no other lane is
      affected.
    if_it_does_not_fit: >-
      Resource exhaustion on the doubled cell is an IMPEDIMENT with a recorded
      clears_when, never a mathematical result, never a verdict, and never a
      reason to drop a mode silently. Dropping a mode is a procedure deviation
      and is recorded as one.

  transfer_assumptions: >-
    STATED BECAUSE THIS AMENDMENT RESTS ON A TRANSFER AND THE TRANSFER IS THE
    WEAK PART. EV-FROB-b6e1e9's figures are at n = 19 and 23, on a NON-LINEAR
    orbit union of a random F_2-subspace, at m = 2, against a 2^{2 l'}
    enumeration bound over two blocks in distinct subspaces with no m! summand
    symmetry, on Koblitz curves at 23 bits or fewer. This contract is at n = 41
    and 43, on the LINEAR ker g(sigma) and a size-matched random control, at
    m = 2 and 3, against 2^{ml}/m!. Different object, different cells, DIFFERENT
    NULL. THE AMENDMENT DOES NOT ASSUME THE TRANSFER HOLDS -- it assumes only
    that it is POSSIBLE, which is enough to justify a control and nowhere near
    enough to justify a prediction. A reader who believes the transfer fails
    should still want A-1 and A-2: an undeclared solver mode on the primary
    metric and a control-free pruning branch are defects independent of any
    transfer, and both are checkable by reading the frozen specification alone.

  authorization: >-
    Authorizes the executor card TASK-20260922-cd6f21 -- which supersedes
    TASK-20260920-66a30e, undispatchable for directory entries in its
    artifact_paths, changing no scientific parameter -- to run the primary cell
    under this amendment, within the budget that card inherits verbatim. It
    authorizes
    NO new cell, NO new curve, NO attack, NO DL recovery, NO deployed-curve
    instance, and NO increase in scope. Launch remains `/run EXP-FROB-30006a`
    after TASK-20260922-0e3b58's ledger archive verifies, so that the executor
    reads a committed and pushed amendment rather than a working tree.

  non_claims:
    - >-
      NOT EVIDENCE. This record measures nothing and contains no result.
    - >-
      NOT A PREDICTION about what EXP-FROB-30006a will find. The Coordinator's
      prior under the amended rule is recorded in DEC-20260922-e9d35a ITEM-3,
      before any run exists, and expects basis_blind on both modes.
    - >-
      NOT a statement that EV-FROB-b6e1e9's XG gap transfers to this contract's
      cells. See transfer_assumptions.
    - >-
      NOT a hypothesis status move. H-FROB-a5bf86 stays `approved`.
    - >-
      NOT a security claim about any curve, in either direction. No deployed or
      challenge parameter is touched.
    - >-
      NOT official until TASK-20260922-0e3b58's commit is verified against Git.
