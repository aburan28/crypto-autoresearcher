#
# ZERO RUNS in this design packet. Stages 0-2 authorized for executor
# TASK-20261003-551cb3. No AUXIN. Amazon Bedrock prohibited. NO break.
# NO attack. NO exponent. Distinct from 161102 / engine races / 99487f.
# Runnable command surface declared below.
# =============================================================================
experiment:
  id: EXP-BINSTD-8be7c5
  hypothesis_id: H-BINSTD-ad480d
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261002-5ebfcd
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    n−1 vs two chained S_3: frozen ≥2× median wall-time band at (n,ℓ)∈{17,19}×{3}
  status: approved
  approved_by: DEC-20261003-fdf02f
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  packaging_only: false
  execution_authorized_stages: [0, 1, 2]
  execution_authorized_note: >-
    Stages 0-2 authorized by DEC-20261003-fdf02f under AGENTS.md standing
    user authorization (2026-09-06). Stage 0 freeze; Stage 1 n=17; Stage 2
    n=19 + null. Missing n−1 / chained-S_3 attempt launchers => O-IMPEDIMENT
    (detector, not a fake solver). No Magma/Sage/AUXIN/Bedrock. No ECC2K-130
    solve. No n>=131 attack.
  approval:
    approved_by: DEC-20261003-fdf02f
    composing_decision: DEC-20261003-fdf02f
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-2 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stage 0 freezes V (ℓ=3), seeds, encoder/solver pin, ≥2× band, ≥20-target
      catalog, combinadic twins, dimVV twins, launcher probe. Stage 1 n=17
      timings or O-IMPEDIMENT. Stage 2 n=19 + random-Boolean matched-N_var
      null. Dual median aggregators. No Magma/Sage/AUXIN/Bedrock.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide HEUR-BINSTD-5ebfcd-H1 at toys: whether median T_{n−1} ≤ (1/2)·median
    chained S_3 under a shared pin over ≥20 targets per completed cell, or
    fail the band, or stop as O-IMPEDIMENT if attempt paths are absent;
    deliver exactly one O-* label from H-BINSTD-ad480d.

  class: heuristic_validation
  class_note: >-
    Pre-registered ≥2× attempt-cost band. Not an exponent-moving breakthrough;
    no ECDLP attack table.

  scope:
    included:
      - >-
        Stage 0. Freeze V (ℓ=3) for n∈{17,19}, catalog_seed 2026100305,
        pin_seed 2026100306, band 0.5, ≥20-target catalog, encoder pin
        (encode_s3 copy), solver/attempt launcher probe (empty candidate
        lists at freeze), combinadic twins, dimVV twins.
      - >-
        Stage 1. n=17, ℓ=3; if n−1 AND chained-S_3 attempt launchers exist
        and match freeze hashes, time ≥20 targets with dual medians; else
        O-IMPEDIMENT. Write RESULTS.md with exactly one O-* label.
      - >-
        Stage 2. n=19 + random-Boolean matched-N_var null with predicted
        ratio in [0.75, 1.25]. Same missing-path rule. Writes stage2/*.
        Does not overwrite Stage-1 RESULTS.md.
    excluded:
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Provisioning n−1 or S_3 attempt solvers mid-tick.
      - Editing IDEA-20261002-5ebfcd claim text or GOAL-ECDLP2M-001.yaml.
      - Editing the 0.5 band after Stage-0 freeze.
      - Treating infra / missing-launcher as evidence against HEUR-BINSTD-5ebfcd-H1.
      - Equating this meter with S_4 vs two S_3 (161102) or engine races.

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-8be7c5/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-8be7c5/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-8be7c5/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-8be7c5/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-8be7c5/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage2: >-
      python3 experiments/EXP-BINSTD-8be7c5/implementation/run.py --stage 2
      --trial-plan experiments/EXP-BINSTD-8be7c5/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. Dual median aggregators and
      combinadic twins are the dual-implementation control. {run_dir}
      substituted by supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20261002-5ebfcd.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-ad480d.yaml
    band: 0.5
    catalog_seed: 2026100305
    pin_seed: 2026100306
    n_targets: 20
    ell: 3
    null_ratio_interval: [0.75, 1.25]
    encoder_pin:
      path: experiments/EXP-BINSTD-8be7c5/implementation/encode_s3.py
      copied_from: experiments/EXP-BINSTD-5b2fd0/implementation/encode_s3.py
      role: encoder_not_attempt_solver
    n1_attempt_launcher_candidates: []
    chained_s3_attempt_launcher_candidates: []
    launcher_note: >-
      No in-repo n−1 or chained-S_3 ATTEMPT launchers were found at design
      time. encode_s3 is encoding size, not an attempt. Frozen Stage-1/2
      outcome when paths are missing is O-IMPEDIMENT (detector). Do not
      provision Magma/Sage/AUXIN.
    stage1_cells:
      - {n: 17, ell: 3}
    stage2_cells:
      - {n: 19, ell: 3}

  controls:
    - name: ctl_fixed_dim_V_ell3
      definition: Frozen V has exactly ℓ=3 basis elements on every cell.
    - name: ctl_shared_encoder_solver_pin
      definition: Encoder sha256 and solver/attempt pin shared across arms; no mid-tick swap.
    - name: ctl_same_target_catalog_both_arms
      definition: Frozen ≥20-target catalog used by both n−1 and chained-S_3 arms.
    - name: null_random_boolean_matched_Nvar
      definition: >-
        Stage 2 random-Boolean systems of matched N_var; predicted median
        ratio ∈ [0.75, 1.25]. Unscored when attempt paths are absent.
    - name: ctl_no_posthoc_band_edit
      definition: Band 0.5 frozen in stage0/preregistered-predictions.json before any timing.
    - name: ctl_no_midtick_lib_provision
      definition: Do not install Magma/Sage/AUXIN/Bedrock or a new n−1/S_3 solver this tick.
    - name: twin_median_aggregators
      definition: median_sort and median_select must agree before any band verdict.
    - name: twin_combinadic_catalog
      definition: Two independent colex combinadic ranks of the target-id subset must agree.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_n17_timings_or_impediment, 2_n19_plus_null]
    - name: cell
      levels: ['(17,3)', '(19,3)']
    - name: arm
      levels: [n1_attempt, chained_S3_two_attempts, random_boolean_null]

  metrics:
    primary:
      - name: median_wall_time_ratio_n1_over_chained_S3
        unit: dimensionless
        definition: median T_n-1 / median (T_S3_1 + T_S3_2); band 0.5.
      - name: targets_completed
        unit: count
        definition: Independent targets with both arms timed; ≥20 per completed cell.
      - name: dual_median_agreement
        unit: boolean
        definition: median_path_a == median_path_b on each scored arm.
    secondary:
      - name: null_median_ratio
        unit: dimensionless
        definition: Stage-2 random-Boolean matched-N_var ratio; interval [0.75, 1.25].
      - name: launcher_present
        unit: boolean
        definition: n-1 AND chained-S_3 attempt launchers present at freeze and at run.

  heuristic_under_test: HEUR-BINSTD-5ebfcd-H1
  preregistered_prediction:
    quantity: median T_{n−1} / median chained-S_3 wall time
    formula: median T_{n−1} ≤ (1/2) · median (T_{S3,1} + T_{S3,2})
    source: >-
      IDEA-20261002-5ebfcd HEUR-BINSTD-5ebfcd-H1 (copied verbatim). KR-IC-081a58
      / KR-IC-5a43e5 retrieved via frontier map. Written in
      stage0/preregistered-predictions.json BEFORE any run. Never edited after
      freeze.

  scale_relevance:
    tier: toy
    justification: >-
      Attempt-cost instrument on n∈{17,19} only. No transfer of a ≥2× band
      into an n≥131 attack is claimed.
    correspondence: null

  tail_checks:
    - Dual-median disagreement voids band claims (O-ARTIFACT).
    - <20 completed targets → O-INCONCLUSIVE (not O-SUPPORT).
    - Missing attempt launchers → O-IMPEDIMENT (not O-FAIL-BAND).
    - Stage-2 null ratio outside [0.75, 1.25] → O-NULL-FAIL.

  replication:
    seeds: [2026100305, 2026100306]
    independent_instances: 2
    replication_note: >-
      Cells (17,3) and (19,3) are independent instances. Dual median
      aggregators plus combinadic twins are the replication instrument.

  seeds_and_replication:
    catalog_seed: 2026100305
    pin_seed: 2026100306
    independent_instances: 2
    n_targets: 20

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 36000
    total_cpu_hours: 10.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json, v-catalog.json, target-catalog.json, launcher-probe.json.
    - Stage 1 complete with timings/control-table/RESULTS.md, including named O-IMPEDIMENT if paths absent.
    - Stage 2 complete with stage2/timings.json, null-control.json, stage2/RESULTS.md (does not overwrite Stage-1 RESULTS.md).
    - RESULTS.md names exactly one O-* label from H-BINSTD-ad480d.
    - maximum_runs = 4.
    - Do not provision missing launchers; stop as O-IMPEDIMENT.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Dual-median or combinadic failure → O-ARTIFACT; do not read the band as support.
    - Infra timeout/crash/missing launcher → O-IMPEDIMENT, never negative evidence.
    - Claiming an n≥131 exponent move → protocol invalid.
    - Equating this meter with IDEA-20261001-161102 → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with twin_ok and combinadic agreement and band
    0.5 marked written_before_any_scientific_timing; Stage 1 (and Stage 2)
    produce either ≥20-target dual-median timings deciding the 0.5 band
    plus a Stage-2 null reading, or a named O-IMPEDIMENT/O-ARTIFACT/O-INCONCLUSIVE
    stop; RESULTS.md names exactly one O-* label from H-BINSTD-ad480d with
    cited artifacts.

  falsification_criterion: >-
    Attempt paths admitted, ≥20 targets complete, dual medians agree, and
    median T_{n−1} > (1/2)·median chained S_3 on a completed cell
    (O-FAIL-BAND). Missing launchers do not falsify the heuristic.

  required_artifacts:
    - experiments/EXP-BINSTD-8be7c5/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-8be7c5/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-8be7c5/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-8be7c5/stage0/v-catalog.json
    - experiments/EXP-BINSTD-8be7c5/stage0/target-catalog.json
    - experiments/EXP-BINSTD-8be7c5/stage0/launcher-probe.json
    - experiments/EXP-BINSTD-8be7c5/stage1/timings.json
    - experiments/EXP-BINSTD-8be7c5/RESULTS.md

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
