experiment:
  id: EXP-ICEX-a40cf3
  hypothesis_id: H-ICEX-9d75dd
  derived_from_idea: IDEA-20260805-45bf55
  question_id: RQ-ICEX-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Right-censoring bias in a charged cost exponent - post-hoc cap ladder applied to one set of
    fully recorded Pollard-rho runs, measuring both admissible aggregates against their closed
    forms, the fixed-cap slope contamination against a known exponent of 1/2, and whether a
    sqrt(ell)-scaled cap restores it, with a BSGS nearby-object control that cuts against the headline
  objective: >-
    The one uncertainty a run reduces is whether a charging convention, rather than an algorithm,
    determines a measured cost exponent in this program's own accounting. A run establishes
    (i) that the uncensored arm on the identical recorded runs reproduces the true exponent 1/2,
    which gates everything else; (ii) the measured censored-to-uncensored aggregate ratio and
    cost-per-certified-success ratio at five cap multiples, against closed forms derived before any
    run, including whether they move in OPPOSITE directions; (iii) the fitted ladder slopes under a
    FIXED cap for both aggregates, against a true exponent of exactly 0.5; (iv) whether a
    sqrt(ell)-scaled cap restores a slope interval containing 0.500; and (v) the budget feasibility
    ratio recomputed from committed text. The censored and uncensored arms are the SAME runs with
    caps applied post hoc, so the comparison has no between-arm confound. No index-calculus arm is
    run, no relation feed is consumed, and no campaign cost aggregate is assembled.
  what_this_is_not:
  - >-
    Not an attack, not an algorithm, not a speedup, and not a measurement of index calculus. Every arm
    is a generic baseline and no cryptanalytic mechanism is exercised.
  - >-
    Not an argument for charging timeouts as infinite or for treating them as negative mathematical
    evidence. AGENTS.md rule 5 stands unqualified; the argument is that the MIRROR error - reading a
    timeout as a cheap attempt - is currently unguarded.
  - >-
    Not a measurement of the operational cost of a real timeout. Post-hoc capping deliberately
    isolates the accounting effect and eliminates partial-state loss, restart overhead and cache
    effects.
  - >-
    Not an edit, amendment or supersession of any protocol artifact. If an amendment is warranted it is
    a separate Coordinator record naming the exact clause.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has
    been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - on matched Pollard rho at 8 to 16 bits, applying a cap post hoc to
      fully recorded step counts changes the charged aggregate and the cost per certified success by
      stated ratios at stated cap multiples, and changes the fitted ladder slope by a stated amount
      relative to an uncensored arm whose slope interval contains 0.5; and a sqrt(ell)-scaled cap does or
      does not restore it. WHAT DOES NOT FOLLOW - nothing about index calculus, nothing about any
      relation search's tail behaviour, no exponent movement, and no status change to any record. The
      claim is about an accounting rule measured on a generic baseline, and it may not be raised by any
      downstream citation.
  inputs:
    procedure: >-
      STAGE 0, zero compute, minutes, CAN TERMINATE THE SLOPE HALF - recompute the budget feasibility
      ratio from the committed protocol text, quoting the three numbers verbatim with their field paths;
      and record whether the per-attempt cap is intended fixed across the ladder or re-declared per cell.
      If it is per-cell and sqrt(ell)-scaled by intent, the slope half is void immediately and the run
      records that, continuing with the level half, the aggregate ambiguity and the budget arithmetic.
      STAGE 1, zero compute, one page - re-derive E[min(X, M)] = sqrt(pi ell / 2) erf(c / sqrt 2),
      P(X <= M) = 1 - exp(-c^2 / 2), the two ratio families, and the two asymptotic limits 0 and 1.
      Freeze and hash the forced-value table before any run.
      STAGE 2, seconds to minutes - run matched Pollard rho TO COMPLETION at n in {8, 10, 12, 16},
      2000 attempts per cell, recording the FULL uncensored step count per attempt. Then apply EVERY cap
      in the c ladder POST HOC to the same recorded costs. This is the design's central economy - the
      censored and uncensored arms are the identical runs.
      STAGE 3, minutes - the survival goodness-of-fit control, then the uncensored null's slope, both
      analysed and written down BEFORE any capped arm is examined. Then the capped ratios, the graded
      monotonicity verdicts, and the four fitted slopes under fixed-M and sqrt(ell)-scaled-M for both
      aggregates.
      STAGE 4, minutes - the BSGS nearby-object control on the same instances, with its censoring
      distortion compared against rho's at matched c.
      STAGE 5, zero compute - the archive check, recording that no prior censoring-fraction measurement
      exists in this corpus as UNAVAILABLE rather than as a passed check.
    instrument: >-
      Pure Python, standard library plus numpy for bootstrap resampling with a frozen seed. All costs are
      exact step counts from an instrumented counter, never wall clock, so that algorithmic spread and
      host noise are never mixed. Caps are applied post hoc to recorded costs, so no run is ever actually
      interrupted and no timeout side effect is present or claimed. Recorded through harness/runner.py.
    parameters: >-
      Ladder cells n in {8, 10, 12, 16} bits, 2000 attempts per cell, seeds derived from the declared
      replication seeds. Cap multiples c = M / sqrt(ell) in {0.25, 0.5, 1, 2, 4}, defined directly in
      STEP UNITS. Cap regimes - fixed M held constant across the ladder, and M = c0 sqrt(ell) with
      c0 = 1. Aggregates - (a) the charged aggregate, the sum of min(X, M) over the attempt schedule, and
      (b) the charged cost per certified success, with a restart after a timeout. Bootstrap 2000
      resamples for every slope interval. Kolmogorov-Smirnov band for the survival fit declared in
      Stage 1 before any comparison.
  controls:
  - >-
    NULL OBJECT, same shape, forced value pre-derived, CAN FAIL - the UNCENSORED arm at c = infinity on
    the identical recorded runs. FORCED VALUES - aggregate ratio exactly 1.000, per-success ratio exactly
    1.000, fitted slope interval containing 0.500. This null can genuinely fail; if the uncensored slope
    does not contain 0.5 the rho implementation is not the algorithm modelled and no censoring conclusion
    may be drawn from it.
  - >-
    POSITIVE CONTROL, if it does not fire NO negative may be reported - the c = 0.25 cell, where the
    derived distortion is roughly fivefold downward in the charged aggregate. The measured ratio must land
    in the Monte Carlo band around 0.197413. This is the sensitivity demonstration - if a fivefold
    distortion is invisible, nothing about smaller ones may be concluded.
  - >-
    GRADED CONTROL, five interior points, monotonicity reported per adjacent pair - the c ladder
    {0.25, 0.5, 1, 2, 4}. FORCED - aggregate (a)'s ratio monotone INCREASING to 1, aggregate (b)'s ratio
    monotone DECREASING to 1, the two curves approaching 1 from opposite sides with no crossing. Reporting
    monotonicity per pair localises a failure to a cap value rather than leaving "the effect did not
    appear".
  - >-
    SURVIVAL-MODEL GOODNESS-OF-FIT CONTROL, runs before any ratio is interpreted - the empirical survival
    of the recorded step counts against exp(-t^2 / (2 ell)) at each cell, with a declared KS band. If the
    model fails, the DERIVED FORCED VALUES are wrong but the DIRECTION of the bias is not, because
    E[min(X, M)] <= E[X] holds for every distribution. The contract pre-declares which conclusions survive
    a model failure (the sign and the repairs) and which do not (the specific numbers).
  - >-
    NEARBY-OBJECT CONTROL, CUTS AGAINST THE HEADLINE - BSGS, whose cost is nearly deterministic rather than
    heavy-tailed. FORCED - at the same c, BSGS's censoring distortion must be SMALLER than rho's, because a
    concentrated distribution has less mass beyond any cap above its mean. It is included precisely because
    it weakens the general reading - the effect is a property of the cost DISTRIBUTION, so an arm with
    concentrated cost is barely affected.
  - >-
    VERDICT-ON-THE-NULL-FIRST, blocking - the uncensored arm is analysed and its slope written down before
    any capped arm is examined.
  - >-
    ARCHIVE CHECK, zero compute - prior censoring-fraction measurements in this corpus are recorded as
    UNAVAILABLE, not as a passed check, with the search command and its output verbatim.
  independent_variables:
  - group order in bits, across the ladder
  - cap multiple c = M / sqrt(ell)
  - cap regime - fixed M versus M = c0 sqrt(ell)
  - aggregate - charged sum of min(X, M) versus charged cost per certified success
  - algorithm arm - Pollard rho versus deterministic BSGS
  metrics:
    primary:
    - >-
      aggregate_ratio_a(c) - the sum of min(X, M) over the recorded attempts divided by the sum of X over
      the same attempts, dimensionless, per cell and pooled over the ladder, with a bootstrap interval.
    - >-
      aggregate_ratio_b(c) - the charged cost per certified success under restart,
      E[min(X, M)] / P(X <= M), divided by the uncensored mean E[X], dimensionless, per cell and pooled,
      with a bootstrap interval.
    - >-
      slope_fixed_cap_a and slope_fixed_cap_b - ordinary least squares slope of log2 of each aggregate on
      the bit size across the four ladder cells with M held FIXED, dimensionless, each with a bootstrap
      interval.
    - >-
      slope_scaled_cap_a and slope_scaled_cap_b - the same with M = c0 sqrt(ell), c0 = 1, each with a
      bootstrap interval. FORCED to contain 0.500.
    - >-
      slope_uncensored - the same on the uncensored arm, dimensionless, with a bootstrap interval. FORCED
      to contain 0.500.
    - >-
      censoring_fraction(c) per cell per arm - the fraction of recorded attempts with X > M, dimensionless.
      This is the metric whose absence the hypothesis is about, and it is free from the recorded terminal
      codes.
    - >-
      budget_feasibility_ratio - maximum_attempts times per_attempt_wall divided by per_campaign_wall,
      dimensionless, recomputed from committed text with the three quoted values and their field paths.
      FORCED 5.3333, with floor of per_campaign_wall over per_attempt_wall equal to 24.
    secondary:
    - >-
      survival goodness-of-fit statistic per cell against exp(-t^2 / (2 ell)), with the declared KS band.
    - >-
      monotonicity verdicts per adjacent c pair for both aggregates, and whether the two curves cross.
    - >-
      bsgs_distortion_ratio(c) - the same aggregate ratio computed on the BSGS arm, dimensionless, reported
      against rho's at matched c.
    - >-
      implied alpha shift per c at each ladder cell, in exponent units, so the size of the effect is
      expressed in the units of the quantity it would contaminate.
    - >-
      the full recorded uncensored step-count distribution per cell, since every capped arm is derived from it.
    - >-
      the Stage 0 record of whether the cap is intended fixed or per-cell, with its source.
  heuristic_under_test: HEUR-ICEX-C1
  preregistered_prediction:
    quantity: >-
      aggregate_ratio_a and aggregate_ratio_b across the c ladder; slope_fixed_cap_a and slope_fixed_cap_b;
      slope_scaled_cap_a and slope_scaled_cap_b; and budget_feasibility_ratio.
    formula: >-
      aggregate_ratio_a(c) = erf(c / sqrt 2), giving 0.197413, 0.382925, 0.682689, 0.954500, 0.999937 at
      c = 0.25, 0.5, 1, 2, 4 - monotone increasing to 1.
      aggregate_ratio_b(c) = erf(c / sqrt 2) / (1 - exp(-c^2 / 2)), giving 6.416425, 3.258850, 1.735051,
      1.103896, 1.000272 - monotone DECREASING to 1, the opposite direction.
      Under a fixed cap, slope_fixed_cap_a is predicted strictly below 0.35 (asymptotic forced value 0) and
      slope_fixed_cap_b strictly above 0.65 (asymptotic forced value 1), against a true exponent of exactly
      0.5. Under M = c0 sqrt(ell), BOTH slope intervals contain 0.500.
      budget_feasibility_ratio = 128 times 300 divided by 7200 = 5.3333, with 24 full-length attempts per
      campaign.
      Under the null that censoring does not bias the aggregate, every ratio is 1 at every c and all four
      fixed-cap slopes contain 0.500.
    source: >-
      Pre-registered in the parent proposal IDEA-20260805-45bf55, whose mechanism derives the two closed
      forms from one integral each and evaluates them during ideation. Those tabulated values are
      DERIVATIONS from the stated closed forms, not measurements. The budget numbers are quoted verbatim
      from a committed protocol artifact and are re-read by Stage 0 rather than trusted. Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      The ladder is 8 to 16 bits, where thousands of rho attempts can be run TO COMPLETION so that the full
      uncensored cost is available and every cap can be applied post hoc to the identical runs. That
      completeness is the entire design - a real timeout would destroy exactly the datum the comparison needs.
      The quantity under test is scale-free in c, so a toy ladder is the right place to measure it; what a toy
      ladder CANNOT show is the asymptotic limits 0 and 1, which are approached slowly, and the contract
      therefore states conservative thresholds (0.35 and 0.65) rather than the limits. Nothing transfers to
      any cryptographic size and no such transfer is attempted.
    correspondence: null
  tail_checks:
  - >-
    Report the empirical survival at the largest recorded step counts per cell, since the censoring effect
    lives entirely in the right tail and a bulk goodness-of-fit statistic can pass while the tail is wrong.
  - >-
    Report the number of censored attempts at each (cell, c) and refuse any cell with fewer than 30, reporting
    the shortfall rather than a ratio.
  - >-
    Report each ratio recomputed on the upper and lower halves of the bootstrap distribution, to expose an
    unstable estimate.
  - >-
    Report the slope refitted with each single ladder cell removed, since with four cells one point can carry
    the whole slope.
  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 4
    maximum_runs: 8
  stopping_rules:
  - >-
    HALT the interpretation of every capped arm if slope_uncensored's interval does not contain 0.500. The
    instrument is not the algorithm modelled and no censoring conclusion may be drawn.
  - >-
    If Stage 0 establishes the cap is per-cell and sqrt(ell)-scaled by intent, record that, VOID the slope
    half, and continue with the level half, the aggregate ambiguity, the censoring fraction and the budget
    arithmetic. This is a stopping rule on a claim, not on the run.
  - >-
    Refuse any (cell, c) with fewer than 30 censored attempts and report the shortfall rather than a ratio.
  - >-
    Stop at the declared ladder, cap multiples and attempt counts. No cap value is added after any ratio is
    seen; the c ladder's selection is disclosed as chosen to span the regime where erf(c / sqrt 2) moves.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop, never a
    negative result (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    A timeout, crash or dependency failure makes the run failed_infrastructure and is NEVER negative
    mathematical evidence (AGENTS.md rule 5). This contract's whole subject is the symmetric error, and
    committing the original one inside it would be self-refuting.
  - >-
    A run in which any attempt was actually interrupted rather than run to completion and capped post hoc is
    invalid_measurement - the design's no-confound property depends on the arms being the identical runs.
  - >-
    A run whose uncensored null was not analysed and written down before the capped arms is
    invalid_measurement.
  - >-
    A run reporting costs in wall-clock seconds rather than step counts is completed_invalid, because the
    derivation and the cap ladder are defined in step units.
  - >-
    A run reporting any ratio without its censoring fraction at the same cell is invalid_measurement - the
    missing metric is the hypothesis's subject.
  - >-
    A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires a new
    contract; it is never a repair of this one.
  success_criterion: >-
    The run yields interpretable evidence when ALL of the following hold, each decidable from the primary
    metrics -
    (1) slope_uncensored's bootstrap interval contains 0.500;
    (2) the survival goodness-of-fit statistic is inside its declared KS band at every cell, OR the run
    explicitly declares the model failed and reports only the distribution-free conclusions;
    (3) aggregate_ratio_a at c = 0.25 lies in the Monte Carlo band around 0.197413;
    (4) aggregate_ratio_a is monotone increasing and aggregate_ratio_b monotone decreasing across the c
    ladder, with no crossing;
    (5) all four ratio families match their forced values within their Monte Carlo bands;
    (6) slope_fixed_cap_a is below 0.35 and slope_fixed_cap_b is above 0.65;
    (7) slope_scaled_cap_a and slope_scaled_cap_b both have intervals containing 0.500;
    (8) budget_feasibility_ratio reproduces 5.3333 with 24 full-length attempts;
    (9) censoring_fraction is reported at every (cell, c, arm).
  falsification_criterion:
  - >-
    slope_uncensored's interval does not contain 0.500. Instrument broken - infrastructure signal, not a
    negative result, and nothing else may be reported.
  - >-
    aggregate_ratio_a and aggregate_ratio_b move in the SAME direction with c. The opposition claim, which is
    the headline, is REFUTED and the derived asymptotic exponents 0 and 1 are withdrawn.
  - >-
    slope_fixed_cap_a and slope_fixed_cap_b both stay inside slope_uncensored's interval at every cell. The
    slope-contamination claim is REFUTED at this ladder; the level claim may still stand and is reported
    separately, with the ladder's shortness stated as the reason the asymptotic effect could not appear.
  - >-
    slope_scaled_cap_a or slope_scaled_cap_b fails to contain 0.500. The DIAGNOSIS is wrong even if the bias
    is real, and the constructive repair is withdrawn. This is the most useful negative the design admits.
  - >-
    The measured ratios miss erf(c / sqrt 2) outside the Monte Carlo band WHILE the survival fit passes. The
    derivation is wrong and is withdrawn; the distribution-free inequality survives.
  - >-
    budget_feasibility_ratio does not reproduce 5.3333 and 24. That section is withdrawn without prejudice to
    the rest.
  - >-
    Stage 0 establishes the cap is per-cell and sqrt(ell)-scaled by intent. HEUR-ICEX-C2 is falsified, the
    slope half is void, and the finding reduces to a documentation defect reported at that smaller size.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
  - raw-result.json carrying every per-attempt FULL uncensored step count, since every capped arm is derived from it
  - the uncensored null's analysis and its committed slope, demonstrably written before any capped arm was examined
  - the survival goodness-of-fit comparison per cell with its declared KS band
  - censoring_fraction at every (cell, c, arm), and the count of censored attempts per cell
  - the BSGS nearby-object arm's measurements, in the same file as the rho arm
  - the Stage 0 record - the three budget numbers quoted verbatim with their field paths, and the recorded reading of whether the cap is fixed or per-cell, with its source
  - the archive check's search command and verbatim output, recorded as unavailable rather than as a passed check
  - the frozen Stage 1 forced-value table, written before any run and hashed
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator drafting does not confer approval. This contract is review_required and is NOT approved;
    approved_by is null and execution_authorized is false. Approval is the user's gate because it authorizes
    execution and spends compute, even where the compute is very low.
  - >-
    Stage 0's reading of another team's frozen artifact is the single point on which the slope half depends.
    Approval should state how that reading is to be obtained and recorded, since HEUR-ICEX-C2 is explicitly a
    reading rather than a fact and its author is unavailable to confirm it.
  - >-
    This contract measures generic baselines only and consumes no index-calculus feed, which is what keeps it
    outside the existing measurement restriction recorded for this area. Approval should confirm that reading
    before execution.
  - >-
    The r-adding walk's parameter r must be named before approval - the birthday survival model is known to be
    imperfect for small r, and a goodness-of-fit failure attributable to r would be a statement about the walk
    rather than about censoring.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260805-45bf55
    authored_at: '2026-08-25'
    note: >-
      The two closed forms, the five-point c ladder with its forced values, the two asymptotic limits, the
      seven named controls including the BSGS nearby object that cuts against the headline, the
      verdict-on-the-null-first ordering rule and the budget arithmetic are taken from the parent proposal's
      mechanism, predictions and minimal_test, restated as measurable quantities with units. Every numeric value
      is a DERIVATION from a stated closed form performed during ideation, never a measurement. The budget
      numbers are quoted from a committed artifact and are re-read rather than trusted. Boilerplate identical
      across contracts by program rule comes from the fixed table. Budgets follow the parent's declared low
      implementation and very low compute.
  derivation_gaps:
  - >-
    HEUR-ICEX-C2 - that the per-attempt cap is fixed rather than per-cell - is a reading of another record's
    frozen artifact whose author is unavailable. The slope half of the hypothesis depends entirely on it, and
    Stage 0 can only record the reading, not confirm the intent. That exposure is irreducible within this
    contract.
  - >-
    The wall-clock cap in the artifact is 300 seconds while the derivation is in step units. Converting requires
    a per-step time, which is machine-dependent. The contract defines the c ladder directly in step units and
    translates the wall-clock number only for the budget arithmetic, but that means the c ladder is NOT the
    artifact's actual cap and the correspondence between them is unestablished.
  - >-
    The claim that an algebraic relation search is more heavy-tailed than rho - which is what would make the
    censoring bias ASYMMETRIC between arms and therefore consequential - is RELAYED-UNVERIFIED, is not measured
    by this package, and enters no forced value. It appears only as motivation and must not be cited as a
    finding.
  - >-
    The c ladder was chosen to span the regime where erf(c / sqrt 2) moves. A different ladder would show a
    different effect size. This is disclosed rather than presented as neutral, and the monotonicity requirement
    is what makes the ladder informative rather than cherry-picked.
  - >-
    The thresholds 0.35 and 0.65 for the fixed-cap slopes are conservative choices made because the four-cell
    ladder is short and c is not yet small at the smallest cell. They are not derived from the asymptotic limits
    and a run that lands between them and 0.5 is genuinely ambiguous at this ladder length.
