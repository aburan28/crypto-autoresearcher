experiment:
  id: EXP-SSI-b52e7a
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-SSI-b17f73
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  batch_id: null
  assigned_to: executor
  title: >-
    Review-required contract: planted-orientation positive control via
    Deuring reduction over a discriminant ladder, measuring the sensitivity
    horizon of S1-2's candidate filters against matched random instances

  objective: >-
    If separately approved, frozen and authorized, exercise every candidate
    per-vertex filter named in S1-2's list against a KNOWN-planted-structure
    positive control built by Deuring reduction of Hilbert class polynomials
    H_D mod an inert prime, over a discriminant ladder, and report a
    four-cell confusion table and a fitted sensitivity horizon per filter,
    cross-checked against S1-2's independently derived cost exponent. This
    contract is an instrument design and a pre-execution declaration. No run
    has happened.

  what_this_is_not:
    - Not an attack on any supersingular-isogeny hardness assumption, not a key recovery, not a solve.
    - Not a claim that any filter is broken or sound in general; it measures firing rates on a specific ladder at toy scale only.
    - Not a revision of S1-2's cost exponent; it is an independent cross-check that can corroborate or contradict it.
    - Not an approval, a freezing, an execution authorization, a run, an observation, or evidence.
    - Not a use of the SIDH/SIKE torsion-image setting as a positive target; the constructor plants an endomorphism-ring structure, not a torsion-point image.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      TOY ONLY, and CONTROL-TIER at that: a completed run could support, at
      most, (1) that gate (a)'s known j-invariants (1728 at D=-4, 0 at D=-3)
      reproduce exactly; (2) that gate (b)'s independent point-counting
      supersingularity check passes on every planted instance; (3) a
      four-cell confusion table per (D, filter) on the declared toy ladder;
      (4) a fitted sensitivity horizon |D|_max per filter and its residual
      against S1-2's C_test^2 identity, within the ladder's covered range
      only -- explicitly NOT extrapolated past the sparse top of the ladder.
      NOTHING ELSE. No outcome may be quoted as evidence about the hardness
      of any supersingular-isogeny assumption, as an exponent, or as a
      crypto-scale result.

  inputs:
    discriminant_ladder:
      base: [-3, -4, -7, -8, -11, -19, -43, -67, -163]
      extension_rule: >-
        Additional small-class-number D up to |D| ~ p^{2/3}, sparse at the
        top because class-polynomial degree grows as h(D) ~ p^{1/3};
        infeasible beyond small h even at toy scale. The exact extended set
        per toy prime is fixed and recorded before any filter is run, never
        chosen after seeing a result.
    toy_primes:
      values: "to be fixed at freeze time from build_isogeny_graph.py's existing toy-scale range; declared, not chosen post hoc"
    filter_list:
      source: "S1-2's candidate filter list, consumed as-is, not re-derived here"
    matched_random_instances:
      construction: >-
        For each (D, p) cell, an equal number of uniformly random
        supersingular j-invariants at the same p, independently verified
        supersingular by point counting, with no planted structure.
    seeds:
      master_seed: 55917053
      domain: "EXP-SSI-b52e7a/v1"
      seed_derivation_rule: >-
        ASCII bytes of domain || "|" || label || "|" || decimal(D) || "|" ||
        decimal(p) || "|" || decimal(counter), hashed with SHA-256; digest
        integers interpreted big-endian unsigned. Labels exactly one of
        {"planted-root-select", "random-instance"}. Reproduces every
        instance bit-for-bit from (master_seed, domain, label, D, p,
        counter) and nothing else.
    counting_convention:
      firing_rate: "fraction of instances at a given (D, filter) cell on which the filter fires"
      horizon_fit: >-
        |D|_max is the largest |D| on the ladder at which the fitted firing
        rate curve crosses below 0.9, interpolated linearly between
        adjacent ladder points; frozen before any data is observed.

  arms_and_controls:
    treatment: >-
      The planted arm. Per (D, p) cell: N planted instances via Deuring
      reduction, gate (b) independently verified, each candidate filter
      evaluated and its fire/miss recorded.
    measured_null: >-
      The matched random arm at the same (D, p) cells. FORCED VALUE DERIVED
      BEFORE THE RUN: at |D| >= p^{2/3}*C, planted and random firing rates
      must coincide (gate c), because the planted property becomes generic.
      THIS NULL CAN FAIL: a filter that "fires on everything" at large |D|
      and would otherwise be scored sensitive is caught precisely here.
    positive_control: >-
      Gate (a). D=-4 at p = 3 mod 4 must produce j=1728; D=-3 at p = 2 mod 3
      must produce j=0. A mismatch halts the whole contract with a
      derivation-tier negative and no further compute spent.
    ordering_control: >-
      Gate (a) and gate (b) run before any filter is evaluated on any
      instance; gate (c) is evaluated after the full ladder is measured but
      before any horizon is reported as a positive finding.
    comparability_policy: >-
      No number from this contract may be compared with any figure from
      S1-1, S1-7, or any other slice entry except through S1-2's declared
      cost-exponent c, via the single stated horizon identity
      |D|_max = C_test^2.

  stages_cheapest_first:
    - id: stage-1-gate-a
      cost: "zero compute, minutes"
      content: "Compute D=-4 and D=-3 planted j-invariants and check against the known constants."
      can_terminate_run: true
      termination_rule: "A mismatch ends the contract here; no further stage runs."
    - id: stage-2-ladder-construction-and-gate-b
      cost: "minutes to low hours depending on ladder extent"
      content: >-
        Build the full discriminant ladder per declared toy prime, reduce
        H_D mod p, and independently verify supersingularity of every root
        by point counting.
      can_terminate_run: true
      termination_rule: "Any planted root failing independent supersingularity verification halts the package."
    - id: stage-3-filter-sweep
      cost: "minutes to hours depending on filter count and ladder size"
      content: >-
        Run every candidate filter from S1-2's list against planted and
        matched-random instances at every ladder cell; record the four-cell
        confusion table.
      can_terminate_run: true
      termination_rule: "Gate (c) failure (planted/random rates diverge past the invisibility threshold) is flagged but does not halt the package; it is reported."
    - id: stage-4-horizon-fit-and-crosscheck
      cost: "minutes, no new compute"
      content: >-
        Fit |D|_max per filter and compute the residual against S1-2's
        C_test^2 identity.
      can_terminate_run: false
      termination_rule: "Not applicable; this stage only post-processes stage-3 output."

  metrics:
    primary:
      - "confusion table cell counts (planted-fires, planted-misses, random-fires, random-misses) per (D, p, filter)."
      - "fitted |D|_max per filter."
      - "residual of |D|_max against S1-2's predicted C_test^2, per filter."
    secondary:
      - "gate (a) exact-match verdict."
      - "gate (b) independent-verification pass rate."
      - "gate (c) invisibility-threshold convergence per filter."

  heuristic_under_test: HEUR-SSI-b17f73-1

  preregistered_prediction:
    quantity: "per-filter |D|_max"
    formula: "|D|_max = C_test^2, where C_test is S1-2's charged per-instance test cost for that filter"
    source: "Derived in H-SSI-b17f73 (mechanism section); cross-checked, not re-derived, against S1-2's own c=1/2 identity."

  scale_relevance:
    tier: toy
    justification: >-
      The discriminant ladder is toy-scale by construction and honestly
      sparse at its top (class-polynomial degree ~ p^{1/3}); the horizon fit
      is a within-ladder statement and must not be extrapolated to
      cryptographic |D| or p. Gate (a)'s known j-invariants are exact
      algebraic checks and hold at every scale, but that does not raise the
      tier of the horizon fit itself.
    correspondence: null

  tail_checks:
    - >-
      Extreme ladder point: verify gate (c) convergence explicitly at the
      single largest |D| reached on each toy prime's ladder, since that
      point is where the sparse-ladder risk is greatest.

  replication:
    seeds: [55917053, 55917054, 55917055]
    independent_instances: 3
    interpretation: >-
      Three seeds per cell for the random-instance construction; the planted
      construction is deterministic given (D, p) and needs no seed variation
      beyond root-selection tie-breaking, which is itself seeded and
      reported.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 4
    maximum_memory_gb: 4
    maximum_runs: 3
    maximum_workers: 1

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, archived, and authorized.
    - Stop the whole package immediately on any gate (a) mismatch.
    - Stop stage 2 on any gate (b) independent-verification failure.
    - Stop at the first budget, memory, or wall-clock ceiling and record what was covered rather than truncating silently.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any change to the discriminant ladder, the horizon-fit rule, or the filter list after any number has been observed.
    - Any horizon reported over a |D| range the ladder did not actually cover.
    - Absence of the gate (b) independent verification log for any planted instance used in a reported cell.

  success_criterion: >-
    This contract has no current success outcome because it is not
    authorized for execution. IF a separately approved, frozen successor is
    executed, its only positive disposition is: gate (a) reproduces exactly;
    gate (b) passes on every planted instance used; the confusion table is
    populated for every declared (D, p, filter) cell; a horizon is fitted
    per filter within the ladder's actual coverage; and the residual against
    S1-2's C_test^2 identity is reported, whether or not it agrees. THAT
    DISPOSITION ESTABLISHES NO ATTACK, NO HARDNESS CONCLUSION, AND NO
    CRYPTO-SCALE RESULT.

  falsification_criterion: >-
    H-SSI-b17f73 (specifically HEUR-SSI-b17f73-1) is falsified by any of:
    a filter firing at rate >= 0.9 on planted instances with |D| >> C_test^2
    (horizon law wrong); every filter, including exhaustive BFS at the exact
    planted radius, missing planted instances (constructor broken, not the
    filters); or gate (a) failing (stop immediately, no horizon claim of any
    kind may be made).

  outcomes:
    no_execution_authorization: "The only current disposition: a review_required draft. No run, no observation, no evidence, no inference."
    future_complete_readout: "Only after separate approval, freezing, authorization, and valid execution; scoped toy-only."
    infrastructure_or_integrity_failure: >-
      A timeout, crash, or missing dependency is INFRASTRUCTURE SIGNAL and is
      NEVER negative mathematical evidence against H-SSI-b17f73 or any filter
      named in S1-2 (AGENTS.md rule 5).

  required_artifacts_if_later_authorized:
    - Frozen approved specification with a freeze receipt binding its SHA-256.
    - Gate (a) and gate (b) logs for every planted instance used.
    - Raw per-cell records: (D, p, filter, instance ordinal, fired boolean), one JSON object per line, sorted keys, UTF-8.
    - Fitted horizon and residual table per filter.
    - Manifest, environment, exact argv, stdout, stderr, timestamps, resource measurements.
    - Snapshot archive followed by independent validation and red-team review.

  approval_requirements:
    - Independent review confirms the Deuring-reduction constructor and the horizon-law derivation before any compute is authorized.
    - Independent review confirms gate (a)/(b)/(c) can actually discriminate (i.e., are not vacuously passable).
    - Coordinator separately approves and freezes a successor contract without editing this draft.
    - >-
      GOAL-SSI-001 is currently status active with an open dispatch queue, so
      no goal-activation blocker applies to this contract; approval still
      requires the review steps above.

  approval_status: >-
    Pending review. No approved_by field is present because this draft is
    not approved and only the Coordinator may approve it (AGENTS.md rule 1).
  approved_by: null
