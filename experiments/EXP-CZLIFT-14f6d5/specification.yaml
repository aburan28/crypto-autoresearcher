experiment:
  id: EXP-CZLIFT-14f6d5
  hypothesis_id: H-CZLIFT-27a184
  source_idea: IDEA-20261009-791518
  question_id: RQ-CZLIFT-b9f765
  goal_id: GOAL-CZLIFT-1516d5
  version: 1
  title: Rank ladder extended with retrieved rank-record curves (Grunewald-Zimmert rank >= 8, Brumer-Kramer rank
    >= 9) plus the rank-7 overlap curve
  status: approved
  frozen: true
  designed_at: '2026-10-09'
  approved_by: coordinator
  approval_decision: DEC-20261009-575cd3
  execution_authorized: true
  status_note: Frozen at version 1 and approved 2026-10-09 by DEC-20261009-575cd3 under AGENTS.md 'Standing user
    authorization' and the user's request of 2026-10-09 to design and execute all accepted angles; driver and checker
    smoke-tested before freezing. Approval asserts nothing about H-CZLIFT-27a184. The proposal named LMFDB; its
    database stops at conductor 500000 and holds no rank-8 curve, so the retrieved sources are Dujella's rank-history
    pages, recorded in the driver docstring and inputs.
  objective: 'Run the lane-1 census driver on the three curves at hmax 10^5 and 3 x 10^5 (no twists): counts, growth
    slopes, coverage ratios and H_half tables.'
  inputs:
    curves: 382623908456a1 (rank 7, lane-1 overlap); [1,-1,1,-6494556985832,6351402068900282539] (Grunewald-Zimmert
      1977, rank >= 8, retrieved); [1,-1,1,-1608154463,25555312501831] (Brumer-Kramer 1977, rank >= 9, retrieved)
    sources: https://web.math.pmf.unizg.hr/~duje/tors/rk8.html and rk9.html, retrieved 2026-10-09 by WebFetch; LMFDB
      ec_curvedata rank=8 query returned no data on 2026-10-09
    hmax:
      main: 100000
      replication: 300000
    n_primes: 16
  controls:
  - The rank-7 overlap curve must reproduce its lane-1 counts exactly (same driver, same inputs).
  - Every sample point is re-verified on its curve by the checker; the H = 300 count is re-derived by a slow scalar
    search on every curve.
  - Rank labels are lower bounds from the sources; no rank is computed here.
  independent_variables:
  - curve
  - H
  - p
  metrics:
    primary:
    - counts.<hmax> per curve (record curves against the overlap curve)
    - coverage_ratio_median
    - coverage_ratio_frac_above_1p5
    secondary:
    - growth_slopes (uninformative where N is small, reported anyway)
    - h_half tables
  heuristic_under_test: null
  preregistered_prediction:
    quantity: counts.<hmax> per curve (record curves against the overlap curve), coverage_ratio_median, coverage_ratio_frac_above_1p5
    formula: N_E(hmax) of each record curve below that of the rank-7 curve; coverage median in [0.8, 1.2], frac
      above 1.5 < 0.05; no H_half at p >= 1000 on the record curves
    source: H-CZLIFT-27a184 predictions
  scale_relevance:
    tier: toy
    justification: tested parameters as listed under inputs; no crypto-scale statement
    correspondence: null
  tail_checks:
  - every per-run primary metric is recorded so a near-miss on one seed can be compared with the other
  replication:
    seeds: []
    independent_instances: 2
    replication_note: two trials; a prediction counts only if it holds on both
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1
  stopping_rules:
  - Stop after the two planned trials have output_validated receipts.
  - A crash or timeout is failed_infrastructure; never a metric value.
  invalidation_rules:
  - The checker cannot reproduce its re-run subset from the recorded inputs.
  success_criterion: 'On both trials: both record curves have fewer points than the rank-7 curve at hmax; coverage_ratio_median
    in [0.8, 1.2]; coverage_ratio_frac_above_1p5 < 0.05; no h_half entry at p >= 1000 for either record curve.'
  falsification_criterion: On both trials a record curve with more points than the rank-7 curve at hmax, or coverage_ratio_median
    outside [0.8, 1.2], or frac above 1.5 >= 0.05.
  decision_impact:
    on_positive: H-CZLIFT-27a184 moves to supported after review; the collapse of the Neron constant on record curves
      is recorded with the measured counts.
    on_negative: A record curve richer in small points than the rank-7 curve reopens the 'bespoke construction'
      clause with a retrieved-rank follow-up.
  required_artifacts:
  - experiments/EXP-CZLIFT-14f6d5/runs/<RUN-ID>/manifest.yaml
  - experiments/EXP-CZLIFT-14f6d5/runs/<RUN-ID>/raw-result.json
  - experiments/EXP-CZLIFT-14f6d5/runs/<RUN-ID>/command.txt
  - experiments/EXP-CZLIFT-14f6d5/runs/<RUN-ID>/environment.json
  - experiments/EXP-CZLIFT-14f6d5/runs/<RUN-ID>/stdout.log
  - experiments/EXP-CZLIFT-14f6d5/runs/<RUN-ID>/stderr.log
  launcher:
    trial_plan: experiments/EXP-CZLIFT-14f6d5/trial-plan.json
    driver: experiments/EXP-CZLIFT-14f6d5/implementation/run.py
    checker: experiments/EXP-CZLIFT-14f6d5/implementation/check.py
    library:
    - experiments/EXP-CZLIFT-a255fc/implementation/run.py
    - harness/czlift_run.py
  assigned_to: executor
  out_of_scope:
  - Any claim about a deployed curve.
