red_team_report:
  id: RT-20261023-174849
  task_id: TASK-20261023-7b5dc6
  experiment_id: EXP-CZLIFT-14f6d5
  hypothesis_id: H-CZLIFT-27a184
  review_plan_id: REVIEW-CZLIFT-14F6D5-EVIDENCE-20261023
  reviewed_snapshot: 14a328a264
  snapshot_note: >-
    HEAD at review time was 16d9b40673 (four later red-team report commits for other experiments).
    git diff 14a328a264..HEAD is empty for every path in this task's read_scope and for the task card,
    so the files read are the ones committed at 14a328a264.
  recorded_at: '2026-10-23'
  run_ids: [RUN-CZLIFT-ca7450, RUN-CZLIFT-b1dce4]
  claim_under_review: >-
    With the Grunewald-Zimmert (rank >= 8) and Brumer-Kramer (rank >= 9) curves retrieved from Dujella's
    rank-history pages and the lane-1 rank-7 curve as overlap: N_E(10^5) on the two record curves is below
    N_E(10^5) of the rank-7 curve (the constant c_E falls with coefficient height although the rank is
    larger), every coverage cell with N >= 30 has ratio to the uniform model in [0.5, 1.5] with median in
    [0.8, 1.2], and no H_half(p) is resolved on either record curve for p >= 1000 at H <= 3 x 10^5.

  joint_verdicts:
    R1: breaks
    R2: breaks
    PTM-1: breaks   # at the level of the rank inference; the counter-level signature holds (see below)

  joint_findings:
    R1: >-
      The data do not bear on rank. Across the three run curves the count order (rank-7 1155 > BK 215 > GZ 5
      at H = 1e5) is exactly the order of |disc| (1.2e13 < 1.6e28 < 1.0e38), while the rank order (7 < 8 < 9)
      is not monotone in the count: the rank >= 9 curve has 43x the points of the rank >= 8 curve. Four
      discriminating controls, all run here, each separate rank from coefficient size, and each goes against
      'higher rank does not buy more small points'. (1) Elkies-Watkins low-conductor rank records
      (arXiv:math/0403374, Table 2, first row per rank; coefficients checked against the table's
      N and |disc|/N): rank >= 8, 9, 10, 11 curves have N_E(1e5) = 1027, 1023, 743, 665. That is 205x the 1977
      rank >= 8 record and 4.8x the 1977 rank >= 9 record. Across the seven rank >= 7 curves, N_E(1e5) has Spearman
      correlation -1.00 with log|disc| and -0.40 with the rank lower bound (rt_summary_output.json). The local
      growth exponent 2 dlogN/dloglogH between 1e5 and 3e5 is 6.6, 8.4, 8.8, 9.8, 9.4 for EW ranks 7..11, so
      it orders by rank. At H = 1e6 the EW rank >= 9 curve overtakes the rank-7 curve (2281 vs 2153), and the
      rank >= 8 curve ties it (2149). That outcome was predicted in the script header before the run; the
      predicted overtake by rank 8 did not quite happen. (2) Coefficient-matched null: 24 random curves
      with a4, a6 within 12.5% of BK's or GZ's all have N_E(3e5) = 1, which is O only. 12 random curves of
      the rank-7 curve's coefficient size have median 1 and maximum 9. So at matched coefficient size the
      record curves carry 11 to 311 times the small points of generic curves, whose average rank is below
      0.885 (Bhargava-Shankar). (3) Translation mutation: x = x' + t is a Q-isomorphism. It keeps the rank,
      regulator, conductor, torsion and the discriminant, so the model stays minimal. Under it N_E(1e5) of
      the rank-7 curve falls from 1155 to 3 at t = 1e6, which is below GZ's 5, so the frozen falsification
      clause F1 would fire on the same curve written differently. GZ moved onto its generator cluster
      (t = 1536898) rises from 5 to 29, and BK moved off its cluster falls from 215 to 13. N_E(H) at finite H
      is a property of the model and the window. The Neron constant c_E is an isomorphism invariant, so the
      parenthetical 'c_E falls with coefficient height' misdescribes what was measured. (4) Canonical-height
      attribution (rt_heights_output.json, Silverman normalisation, listed sublattices, so lattice counts are
      lower bounds). Regulators are R_L = 3.75 (rank-7, 7 window points), 751 (GZ, 8 source points) and 497
      (BK, 9 source points). At the matched canonical radius T = 6 the lattice balls hold 1349, 215 and 461
      points. The 231x GZ deficit at H = 1e5 splits into about 6.3x lattice density (regulator net of the rank
      gain) times about 37x naive-height window loss: the window captures 5 of the at least 215 lattice
      points. The BK deficit of 5.4x splits into 2.9x times 1.8x. BK's listed lattice overtakes the rank-7
      lattice at T of about 16.5-17. GZ's crosses at T of about 270 by the Gaussian heuristic. The supported
      reading is 'these two 1977 curves have large regulators and large discriminants that push their
      small-canonical-height points out of the naive window', not 'rank does not help'. Rank labels: GZ >= 8
      and BK >= 9 are certified lower bounds (VAL-20261022-2dd0e7 C3). The rank-7 label is a lower bound in
      its own source: Elkies-Watkins footnote 3 says the stated rank is the rank of the subgroup generated by
      small integral points, 'very likely' the actual rank. No upper bound is established anywhere in the
      record or here (no CAS). The comparison 'the record curves have larger rank' therefore depends on an
      unestablished upper bound rank(382623908456a1) <= 7 (for GZ) or <= 8 (for BK). The breaking reading
      above does not depend on it. LMFDB re-check: the stats page (2026-10-23) lists 3,824,372 curves up to
      conductor 299,996,953 with maximum rank 5 (19 curves). 'No rank-8 curve in LMFDB' holds. The
      specification's and driver's 'database stops at conductor 500000' is wrong; this is not load-bearing.
      'Global lifts stay useless on record-rank curves' is not measured: the run has no lifting step. For any
      coverage-based lift, uselessness follows from counting, independent of rank (see baseline_comparison).
      The generalisation from two 1977 curves to 'record-rank curves' fails on the EW records.
    R2: >-
      Two of the four success clauses cannot fail, and a third can fail on one side only. Instrument cap:
      for any point set, ratio = distinct/model <= min(n, N_p)/model, which is about 1 + x/2 at small
      x = n/N_p, reaches its maximum of 1.582 at x = 1, and exceeds 1.5 only for x in (0.875, 1.099). In the
      frozen cell populations only 6 of 131 (1e5) and 7 of 156 (3e5) cells can exceed 1.5 under any
      reductions at all. The largest attainable frac_above_1p5 is therefore 0.046 and 0.045, both below the
      0.05 threshold, so clause S3 is fixed by the counts and cannot fail. The largest attainable median, with
      every cell injective, is 1.071 and 1.082, so the upper edge of S2 (1.2) cannot fail either. S4 cannot
      fail: H_half(p) needs distinct >= N_p/2, and distinct <= n <= 311 < N_p/2 at every p >= 1000 on both
      record curves (rt_summary_output.json S4_cap), so S4 is a restatement of the counts. Proves-too-much on
      the coverage clauses, on identical (n, N_p) cells: an arithmetic progression {kG : |k| <= m}, in which
      every residue's discrete log is known, passes the frozen criterion on both runs (median 1.071 and
      1.082, frac 0.046 and 0.045). So do subgroup confinement of index 2 and 3 (pass rate 1.00) and index 4
      (0.975 and 0.63). Read against a null of the run's own shape, the coverage data reject uniform
      reduction. The observed frozen median of 1.0424 compares with 1.0008 +- 0.0017 (1 sd, 400 nested
      replicates) for independent uniform points, with 0 of 400 replicates at or above the observation. In
      the 32 top cells (one per curve and prime) observed collisions are 4969 against 6142 +- 39 expected.
      The half-width of the frozen band [0.8, 1.2] is about 118 null sd. A same-height random-rationals null (each
      x = a/d^2 replaced by a random a'/d^2 of the same height bound) gives a median of 1.0277 +- 0.0040 and
      reproduces most of the excess. The BK-only median of 1.0271 sits inside it (79.5% of replicates at or
      above), and the rank-7 curve stays above it. VAL-20261022-2dd0e7 L9's unexplained excess is therefore
      mostly the arithmetic of small-height x mod p plus the cap, not a property of rank. Cell provenance:
      the rank-7 overlap curve supplies 99 of 131 and 109 of 156 frozen cells, the same cells as lane 1 by
      control C1. BK supplies 32 and 47. GZ supplies none, so 'every coverage cell' says nothing about the
      rank >= 8 curve. The unstated saturation filter and upper median (DISC-1) are benign for every verdict
      here but must be stated in any record. What the coverage criterion can still test on these runs is
      that the median cell is not confined to a subgroup of index about 4 or more. That is a weak negative
      statement, not uniformity.
    PTM-1: >-
      Counter level: the signature holds. The red-team counter reproduces VAL-20261022-2dd0e7 on 11a1
      (LMFDB 11.a2, rank 0, Z/5): N = 3 at H = 10 and 5 from H = 30 to 3e5. On 210e2 (LMFDB 210.e6,
      [1,0,0,-1070,7812], rank 0, Z/2 x Z/8; all 15 affine points verified torsion of order 2, 4 or 8)
      N = 16 from H = 300 to 3e5. Neither manufactures points. Inference level: the rank inference survives
      on both known-false objects. At the primary hmax 1e5, 11a1 (rank 0) and GZ (rank >= 8) have the same
      N_E = 5. 210e2 (rank 0) has N = 16, which is more than GZ at both trials' hmax (5 and 11). With 210e2 as
      the baseline, clause S1 ('record curve below baseline') holds on both trials. The argument 'fewer
      points at hmax, so higher rank does not buy small points' would conclude that a rank >= 8 curve has no
      more small points than a rank-0 curve. That is false: N_E(H) is bounded for rank 0 and unbounded for
      rank >= 1. The argument survives at the step where a single-hmax count stands in for
      c_E (log H)^{r/2}. The primary metric is rank-blind. The only rank-sensitive observable is the growth
      in H, which the specification marked uninformative, and it separates the objects: GZ goes 1, 3, 5, 11
      over H = 1e4 to 3e5, while 11a1 and 210e2 are flat.

  objections:
  - id: O1
    severity: breaking
    joint: R1
    text: >-
      Rank and discriminant are perfectly confounded across the three curves, and the run has no arm that
      varies one with the other fixed. Every control that separates them (EW low-conductor records,
      coefficient-matched null, translation mutation, canonical-height attribution) shows that coefficient
      size and window placement drive N_E(H). At matched size or matched canonical radius, rank adds points.
    evidence: [rt_ew_output.json, rt_ew_1e6_output.json, rt_null_null_output.json, rt_null_translate_output.json, rt_heights_output.json, rt_summary_output.json]
  - id: O2
    severity: breaking
    joint: R1
    text: >-
      The parenthetical mechanism 'c_E falls with coefficient height' names an isomorphism invariant
      (c_E is proportional to |tors| R^{-1/2}). The measured quantity is not invariant: N_E(1e5) of one curve
      spans 3 to 1155 over integral translations that keep the discriminant. c_E is not identified at
      H <= 3e5, where every curve is pre-asymptotic (GZ local exponent 17.3 against r = 8).
  - id: O3
    severity: breaking
    joint: R2
    text: >-
      S3 (frac above 1.5 < 0.05) and S4 (no H_half at p >= 1000) are fixed by the counts and cannot fail for
      any reductions. The upper edge of S2 cannot fail either. Meeting the success criterion therefore carries
      evidence only through S1, which O1, O2 and PTM-1 show to be model- and window-dependent, and through
      the lower edge of S2.
  - id: O4
    severity: major
    joint: R2
    text: >-
      'Reduce uniformly' / 'no structure in E(F_p)' is contradicted at the instrument's own resolution
      (median 1.0424 against a uniform null of 1.0008 +- 0.0017). It passes the frozen band only because the
      band's half-width is about 118 null sd. A DL-known arithmetic progression also passes.
  - id: O5
    severity: major
    joint: R1
    text: >-
      'Rank is larger' rests on an unproven upper bound for the overlap curve: its rank-7 label is a
      lower bound in Elkies-Watkins (footnote 3). The record states 'recalled' and does not mark it as a lower
      bound used as an exact value.
  - id: O6
    severity: major
    joint: R1
    text: >-
      'Global lifts stay useless on record-rank curves' generalises from two 1977 curves to a class whose
      low-conductor members (EW ranks 8 to 11) carry 665 to 1027 points at H = 1e5. The run also measures no
      lifting step.
  - id: O7
    severity: minor
    joint: R1
    text: >-
      Provenance deltas. LMFDB's EC/Q database reaches conductor 299,996,953, not 500000 as the
      specification's status_note and the run.py docstring say; its maximum rank is 5, so the substantive
      claim holds. The conductor and coefficients of 382623908456a1 are now retrieved (EW Table 2: N and
      |disc|/N = 32 give |disc| = 12243965070592, the run's value), which closes VAL L7's unverified 2-part.
      The 'a1' suffix is a convention, not an LMFDB or Cremona label.

  required_controls:
  - >-
    Rank-versus-discriminant factorial: at least two curves per rank (EW Table 2 rows r = 5..11 at small
    |disc| plus the 1977 records at large |disc|), with coefficient-matched random curves as the null. Started
    here with one EW row per rank (rt_ew.py) and 36 null curves (rt_null.py).
  - >-
    A model-invariant primary metric: N(T) = #{P : hhat(P) <= T} from a saturated basis, or at least N_E(H)
    on the reduced minimal model with the model named in the statement and a translation-stability check
    (rt_null.py translate).
  - >-
    The coverage reference replaced by the nested uniform-point null and the same-height-rationals null
    (rt_coverage_null.py), with the cap per cell reported and cells with cap below the band edge declared
    uninformative for that edge.
  - The rank-0 large-torsion object (210e2) run through the same primary metric as a standing proves-too-much row.

  counterexample_or_mutation: >-
    Translation x = x' + 10^6 of the rank-7 model [0,0,0,-10012,346900] gives the minimal model
    [0, 3e6, 0, 3e12-10012, 1e18-10012e6+346900] of the same curve (same discriminant), with N_E(1e5) = 3
    and N_E(3e5) = 5. In that model the rank-7 curve has fewer points than the GZ curve (5 and 11), so the
    frozen falsification clause F1 fires with no change of curve. In the other direction, EW
    [1,-1,0,-135004,97151644] (rank >= 9) has N_E(1e6) = 2281 > 2153 for the rank-7 curve.

  baseline_comparison: >-
    No cost claim is made and no frontier row or dominated_by field is involved, so there is nothing to
    Pareto-check. For the approach the coverage measures, enumerating small global points until a target's
    residue is hit, half coverage needs at least N_p/2 distinct global points, which is Omega(p) work. Pollard
    rho and BSGS need O(sqrt p), and rho has O(1) memory. The approach is dominated on time for every p, rank,
    curve and coverage outcome. That is a counting fact; the run does not supply evidence for it, and it does
    not depend on rank. The closest specialised baseline is the xedni calculus. Jacobson-Koblitz-Silverman-
    Stein-Teske (DCC 20 (2000) 41-64) show it is asymptotically almost certain to fail because relation
    coefficients among lifted points are bounded. The run's coverage proxy does not test that obstruction.

  heuristic_challenges:
  - >-
    heuristic_under_test is null, but the hypothesis title and mechanism assert the uniform-reduction model
    as a finding. That model is a heuristic: it is rejected by the run-shaped null (O4) and mostly explained
    by small-height-rational arithmetic (Farey null). It must not be promoted as 'no structure'.
  - >-
    Random-model transfer: the uniform model treats the n points as independent draws. The reductions are of
    small-height rationals (Farey-spaced mod p) and of a rank-r lattice ball (collisions need a short kernel
    vector), and both bias collisions downward. The cheapest exposing experiment is rt_coverage_null.py
    (seconds of CPU).
  - >-
    Parameter that should destroy the signal: H. If rank helps asymptotically, the record-to-rank-7 count
    ratio must rise with H. It does: BK/r7 = 0.055, 0.144, 0.186, 0.199 at H = 1e4, 3e4, 1e5, 3e5, and
    EW-r9/r7 = 0.886, 0.981, 1.059 at 1e5, 3e5, 1e6. The 'deficit' is decaying exactly as the rank-helps
    reading predicts.

  cost_model_challenges:
  - not applicable (no cost, speedup or complexity claim; inventor-protocol section 6 ladder not engaged)

  reduction_and_scope_challenges:
  - Scope must be 'the reduced minimal models of the two 1977 curves, naive x-height H <= 3e5, 16 primes 103..20011', not 'record-rank curves'.
  - No statement about c_E, regulators or rank as a variable is within the tested scope.
  - Out of scope already (specification) and must stay so; any deployed-curve or ECDLP statement.

  proof_architecture_challenges:
  - >-
    Observation-fiber: N_E(1e5) = 5 has a rank-0 preimage (11a1) and a rank >= 8 preimage (GZ). The missing
    separator is growth in H, or a canonical-height count.
  - >-
    Quantifier order: the record curves were chosen because Dujella's pages list them, not as
    representatives of 'record-rank curves'. The conclusion quantifies over a class that the witnesses do
    not sample (EW records falsify the generalisation).
  - >-
    Method ceiling: the coverage ratio can never exceed min(n, N_p)/model, which is about 1 + x/2. Its upper
    band edges therefore cannot register structure at the median x of 0.11-0.16.
  - >-
    Nearby object: the EW rank >= 9 curve, the closest object for which 'record curve below rank-7' is
    false at H = 1e6.

  narrowest_supported_statement: >-
    On the reduced minimal models y^2+xy+y = x^3-x^2-6494556985832x+6351402068900282539 (Grunewald-Zimmert
    1977, rank >= 8) and y^2+xy+y = x^3-x^2-1608154463x+25555312501831 (Brumer-Kramer 1977, rank >= 9), the
    number of rational points of naive x-height <= H (O and +-P counted) is 5 and 215 at H = 1e5, and 11 and
    311 at H = 3e5. On y^2 = x^3-10012x+346900 (conductor 382623908456, rank >= 7) it is 1155 and 1559. These
    counts are exact and were reproduced by three independent implementations. Modulo the 16 primes
    103..20011, no coverage cell with n >= 30 has ratio below 0.99, so there is no gross subgroup
    confinement. No H_half(p) at p >= 1000 is possible on the record curves because n < N_p/2 there. Within
    this window the counts are ordered by discriminant, not rank, so the run carries no information about
    rank as a variable, about c_E, or about lifting.

  recommended_strength: >-
    Observation, toy tier, two named curves in named models. The counts and the 'no gross confinement'
    statement are reliable, with no sampling error and triple reproduction. The hypothesis's interpretive
    content is unsupported or contradicted: the c_E mechanism, 'reduce uniformly', 'rank does not buy small
    points' and 'global lifts useless on record-rank curves'. Meeting the success criterion is weak evidence,
    because S3 and S4 cannot fail and S2 can fail only below 0.8. If H-CZLIFT-27a184 moves at all, it should
    be to a narrowed 'supported' restricted to the narrowest statement above, with the mechanism, title
    clause 'reduce uniformly' and the rank reading recorded as not supported. The full statement as written
    should not move to supported. No knowledge promotion beyond the measured counts is warranted.

  obstructions_the_record_would_close:
  - obstruction: Few small global points on rank-record curves (the 'Neron constant collapse').
    measured_quantity: N_E(H), the number of points with naive x-height <= H (dimensionless count, O included)
    values: {GZ: {1e5: 5, 3e5: 11}, BK: {1e5: 215, 3e5: 311}, rank7: {1e5: 1155, 3e5: 1559, 1e6: 2153}}
    error_bars: >-
      Zero sampling error (exhaustive, deterministic, triple-reproduced). Model dependence is the real error
      bar: over integral translations of the same curve N_E(1e5) spans 3..1155 (rank-7), 5..29 (GZ, three
      shifts tried) and 13..215 (BK, two shifts tried). The population error is unbounded: n = 2 record curves,
      and EW records of the same rank give 665..1027.
    resource_reading: >-
      The theory that takes 'N_E(H) is governed by the discriminant and the naive-height offset, not by rank'
      as its hypothesis is the Elkies-Watkins search strategy: small |disc| and many small integral points are
      used to find high rank with small conductor. Read as a resource, the measurement says that high-rank
      curves rich in small points exist exactly when the discriminant is small (EW ranks 8..11: 665..1027
      points at 1e5). So the global-lift lane is not closed for rank-record curves, only for the 1977
      models. Candidate for ranking, not evidence; no record created (write scope).
    spawned_ids: []
  - obstruction: Reductions of small global points are uniform in E(F_p).
    measured_quantity: frozen upper median of distinct/model over cells with n >= 30 and model <= 0.9 N_p (dimensionless)
    values: {observed_3e5: 1.0424, observed_1e5: 1.0419, BK_only_3e5: 1.0271, rank7_only_3e5: 1.0459}
    error_bars: >-
      Uniform-point nested null 1.0008 +- 0.0017 (1 sd, 400 replicates; 99% range 0.9963..1.0048).
      Same-height-rationals null 1.0277 +- 0.0040. Top-cell collisions: observed 4969, uniform 6142 +- 39,
      Farey 3751 +- 57.
    resource_reading: >-
      The collision deficit relative to uniform is the hypothesis of injectivity arguments for small-height
      encodings: distinct rationals of height <= H stay distinct mod p when 2H^2 < p (Farey spacing), and
      collisions of small Mordell-Weil combinations need a short kernel vector. Neither is an obstruction to
      lifting. Both are classical, so this measurement explains VAL L9 and is not a new finding.
    spawned_ids: []
  - obstruction: H_half(p) unresolved at p >= 1000 on the record curves.
    measured_quantity: H_half(p), least grid H with distinct/N_p >= 1/2; h_half_scaling slope of log log H_half on log p
    values: {BK_H_half: {103: 3e4, 149: 3e4, 211: 1e5, 293: 1e5, 419: 3e5}, slope_BK: 0.147 (5 primes), slope_rank7: 0.312 (10 primes), predicted_2_over_r: {r7: 0.286, r9: 0.222}}
    error_bars: >-
      No resampling is possible. The slopes are OLS on 5 and 10 primes below 2500 and are fragile. The
      p >= 1000 clause is fixed by n < N_p/2 and carries no independent information.
    resource_reading: >-
      Under the lattice model, log H_half grows like p^{2/r}. The theory taking this as its hypothesis (the
      height cost of a lift-based relation) predicts that higher rank lowers the exponent. The run's own
      slope is lower on the rank >= 9 curve (0.147) than on the rank-7 curve (0.312), which points toward rank
      helping asymptotically, the opposite of the R1 reading. In any case the counting bound (at least N_p/2
      points) keeps such lifts above rho.
    spawned_ids: []

  recalled_citations_checked:
  - citation: Dujella, rank-history pages rk8.html and rk9.html (Grunewald-Zimmert 1977 rank >= 8; Brumer-Kramer 1977 rank >= 9)
    result: >-
      The sealed copies (VAL blind/sources) give the specification's equations and 8 and 9 points.
      rankhist.html, fetched 2026-10-23, lists '8 1977 Grunewald - Zimmert' and '9 1977 Brumer - Kramer'
      under the header 'rank >='. These are lower bounds, as the record says. No delta.
  - citation: 382623908456a1 = [0,0,0,-10012,346900], rank 7, conductor 382623908456 (recalled)
    result: >-
      Elkies-Watkins, 'Elliptic curves of large rank and small conductor', ANTS VI (LNCS 3076), arXiv
      math/0403374, Table 2 first rank-7 row: [0,0,0,-10012,346900], N = 382623908456, |disc|/N = 32, r = 7.
      Footnote 3 says the stated rank is the rank of the subgroup generated by small integral points, 'very
      likely' the actual rank, and 'difficult to prove'. The Sage ec_database docs give the same ainvs and
      conductor. Delta: the rank is a lower bound, not an established value.
  - citation: LMFDB ec_curvedata rank=8 query returned no data; 'database stops at conductor 500000'
    result: >-
      The LMFDB EC/Q stats page (2026-10-23) reports 3,824,372 curves with conductor <= 299,996,953 and
      ranks 0..5 only (19 of rank 5). 'No rank-8 curve' holds. The conductor bound in the record is wrong.
  - citation: 11a1 rank 0 torsion Z/5; 210e2 rank 0 torsion Z/2 x Z/8 (used for PTM-1)
    result: LMFDB 11.a2 = 11a1, [0,-1,1,-10,-20], rank 0, Z/5. LMFDB 210.e6 = 210e2, [1,0,0,-1070,7812], rank 0, Z/2+Z/8 (both pages fetched 2026-10-23).
  - citation: Bhargava-Shankar, average rank < 0.885 (used only to interpret the coefficient-matched null)
    result: arXiv:1312.7859, Theorem 3 (ordered by height, average rank < .885). Annals publication not re-checked.
  - citation: Jacobson-Koblitz-Silverman-Stein-Teske, Analysis of the xedni calculus attack
    result: Designs, Codes and Cryptography 20 (2000) 41-64, doi 10.1023/A:1008312401197; abstract-level check only.

  next_concrete_action: >-
    Coordinator: record EXP-CZLIFT-14f6d5 as the scoped observation in narrowest_supported_statement, and
    do not move the full statement of H-CZLIFT-27a184 to supported. Then freeze a successor contract, a
    rank-versus-discriminant ladder on Elkies-Watkins Table 2 rows (r = 5..11, several per rank) plus the
    1977 records plus coefficient-matched random curves. Its primary metric is N(T) from canonical heights,
    with N_E(H) in reduced models as secondary. Its coverage is read against the nested uniform and
    same-height-rationals nulls, with the per-cell cap reported. The red-team scripts here are the starting
    implementation; each runs in seconds to minutes.

  must_not_claim:
  - Higher rank does not buy more small points, or rank does not help (contradicted by the EW rows, the coefficient-matched null, and EW-r9 > rank-7 at H = 1e6).
  - The Neron constant c_E falls with coefficient height (not measured; N_E(H) at finite H is model-dependent).
  - Small global points reduce uniformly, or have no structure in E(F_p) (rejected by the run-shaped uniform null; the frozen band cannot see it).
  - Global lifts are useless on record-rank curves, as a measured finding or as a lane closure (no lifting step measured; the counting bound is rank-independent; EW records break the class).
  - Meeting S3 or S4 as evidence (they cannot fail given the counts).
  - The rank-7 label as an exact rank.

  scope_limits:
  - Toy tier. Two record curves in their reduced minimal models; naive x-height <= 3e5; 16 primes 103..20011.
  - Red-team canonical heights are floating-point doubling limits (k = 7; pairing convergence <= 5e-4). Regulators are of listed sublattices (index and exact rank unknown), so lattice counts are lower bounds.
  - The coefficient-matched null curves have uncomputed ranks; the rank reading of that control is heuristic, though the counts are exact.
  - The EW rank labels are lower bounds (footnote 3). Numerically, 8, 9, 10 and 11 independent points were found among points of height <= 1e4 (rt_ew_heights_output.json, Gram minimum eigenvalue 0.03 to 0.19); this is not a proof.
  - The same-height-rationals null keeps denominators and the height bound but not the numerator distribution; it is a heuristic null.
  - "Label note: in rt_heights_output.json the keys 'pairing_convergence_max_abs(k6-k5)' and 'max_abs(k6-k5)' hold the k = 7 versus k = 6 difference. K was raised to 7 before the run and the key labels were not updated."

