  joint_findings:
    J1: >-
      Custody is complete and bound on both run packages. All 20 run files recompute (sha256sum and hashlib, on
      the worktree and on git blobs at the snapshot 5c3cfdeef7 and the ledger-archive commit 53709b0ab5) to the
      values in execution-receipt.json, ledger-receipt.json and the dispatch-queue ledger archive block, and both
      execution-receipt.json self-hashes (fb4b90e8..., 5bfde691...) match the ledger receipt. No unlisted, duplicated
      or missing artifact; all six spec-required artifacts are present; no unplanned run directory. The contract
      files (specification d71b6370..., trial plan 1248daec..., run.py efd811c5..., check.py 86432a5e..., lane-1
      library d8de24d0..., harness/czlift_run.py ea163968...) are byte-identical at the contract-freeze commit
      b553f64e3a (queue snapshot block of TASK-20261009-046d5b), the run commit 08ee02a391, the ledger commit and
      the snapshot, and equal the trial-plan, environment.json, manifest and snapshot-receipt records. Ancestry is
      b553f64e3a <= 08ee02a391 <= 53709b0ab5 <= 5c3cfdeef7. command.txt and launch.json argv equal the frozen
      trial-plan argv with {run_dir} substituted, and check_argv also matches. trial_id, plan_sha256, environment
      commit and authority commit agree; status output_validated, returncode 0, check_returncode 0; dirty false;
      seed null and deterministic, as the spec (seeds: []) requires. Both archive receipts' own hashes match the
      queue archive blocks and their archive commits (d476cc2e..., 5e80232a...). Wall times 38.6 s and 178.0 s
      are within the 5400 s watchdog. Minor gaps that do not break the joint are listed under limitations L4 and L5.
    J2: >-
      Every frozen success and falsification metric, every count, every coverage cell, every H_half table and
      both secondary metrics recompute exactly on both trials. Layer A (cell arithmetic from the raw fields) has
      0 mismatches in 432 + 480 cells. Layer B (independent: own point enumeration, own #E(F_p), own reductions)
      has 0 mismatches in N_p, n_points, distinct, ratio, counts and h_half. The recorded coverage summaries
      reproduce bit for bit under the frozen lane-1 library definition, and growth slopes and h_half_scaling
      slopes reproduce bit for bit. The checker receipt ("check ok", rc 0) agrees. One definitional discrepancy
      (DISC-1) is reported and does not change any criterion clause: the recorded coverage_cells and
      coverage_ratio_median use a saturation filter and an upper-median convention that the specification and
      the hypothesis do not state. Both readings are sealed in j2_definitions.json. It is classified as disclosed,
      not as a break, because the specification names the metric by the frozen library's key, the trial plan
      freezes that library by hash, and every success and falsification clause, plus the hypothesis's "every cell
      in [0.5, 1.5]", has the same truth value under the hypothesis's broader cell set, with wide margin. The
      Coordinator may weigh this differently; the raw rows are listed.
    J3: >-
      The sealed blind value agrees with the recorded value. N_E(300) on both record curves is 0 affine points,
      which is 1 counting O. Raw counts["300"] = 1 on both curves in both runs. The blind derivation extends to
      every grid H, and every recorded count equals the sealed affine count + 1 (the point at infinity, H(O) = 1):
      GZ 0,0,0,0,0,2,4,10 -> raw 1,1,1,1,1,3,5,11; BK 0,0,0,0,2,6,28,112,214,310 -> raw 1,1,1,1,3,7,29,113,215,311.
      The sealed file labels the O-excluded count "primary". The producer, the lane-1 driver docstring, the
      plan's PTM-1 wording ("torsion count") and the standard convention all include O, and the sealed with_O
      field equals the recorded value. This is a labelling convention, not a computational disagreement. The
      a-invariants in the specification match the cited Dujella pages verbatim (sealed SEAL-2), and the raw
      ainvs and the driver CURVES equal the specification's.
    PTM-1: >-
      The producer's frozen counter (lane-1 library, sha256 d8de24d0... verified before import) on 11a1 =
      [0,-1,1,-10,-20] at hmax 300000 with the driver's 16 primes gives N_E(H) = 3 at H = 10 and 5 at every H in
      30..300000. That equals #E(Q)_tors = 5 with no growth, growth slope 0.0, and no coverage cells or H_half. The
      expected failure signature, growth meaning the counter manufactures points, is absent. The H = 10 value 3
      is correct (O and (5,5),(5,-6); the torsion points with x = 16 have height 16), so the plan's wording "stay
      at its torsion count at every H" is literally false below H = 16 by arithmetic, not because of the counter.
      The validator's own counter agrees (4 affine points, sealed blind file).
