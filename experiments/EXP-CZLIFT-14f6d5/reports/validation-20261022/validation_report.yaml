  verdict: passed
  verdict_basis: >-
    J1, J2, J3 and PTM-1 hold. The two run packages are complete, bound to the committed snapshot and the frozen
    contract, and every frozen metric and control recomputes exactly, including from an independent
    enumeration. The receipts are admissible evidence for the review-evidence step. This report does not
    support or weaken H-CZLIFT-27a184, changes no status, and authorizes no promotion.
  limitations:
  - L1 DISC-1. The recorded coverage summary uses a saturation filter (model_distinct <= 0.9 N_p) and an upper-median convention that neither the specification nor the hypothesis states. Under the hypothesis's "every cell with N >= 30" the medians are 1.038875 (144 cells) and 1.038043 (176 cells), against recorded 1.041919 (131) and 1.042439 (156). No criterion clause changes.
  - L2 Checker strength. check.py is not implementation-independent for the summary, verifies only the stored point samples, and its H = 300 recount is vacuous on both record curves (N(300) = O only). It does not test control C1. raw-result.json archives only a 12-point sample per curve, so distinct counts cannot be recomputed from raw alone; the validator re-enumerated.
  - L3 Replication. The two trials are nested deterministic runs of one implementation, not independent instances.
  - L4 Environment and resources. numpy, sympy and PyYAML versions are not recorded (runtime_lock null); peak memory is not recorded; harness/__init__.py (59 bytes) is imported but not hashed (unchanged between run commit and snapshot); dirty is evaluated at record-write time with untracked files ignored.
  - L5 Manifest content. The manifest metrics omit the per-curve counts and the h_half tables that the primary metric and success criterion use; they are only in raw-result.json. The plan's "manifest files_sha256" does not exist in this schema.
  - L6 Count convention. N_E(H) includes O and counts P and -P separately; the GZ "5 points" at H = 1e5 are O plus two x-coordinates (13057, 32797). The specification does not define N_E; the lane-1 driver docstring does.
  - L7 Provenance. The retrieved curves carry no named verified_by agent. The rank-7 label and conductor are recalled (rank >= 7 and the odd conductor part are verified here, exact rank and 2-part are not). The LMFDB empty-query statement is unverifiable from here.
  - L8 Plan wording. PTM-1's "torsion count at every H" is false at H = 10 by arithmetic (count 3). claim_under_review's "no half-coverage at p >= 1000" holds for the record curves only, which is the specification's scope; the rank-7 curve resolves H_half at p = 1193, 1697 (both runs) and 2417 (3e5 run).
  - L9 Null model. There is no empirical null object; the systematic excess over the uniform model (median ~1.04, max 1.259) is unexplained by the run. This is interpretation, left to the review-evidence round (PD-1).
  - L10 Blindness scope. The phase-1 derivation was blind to the implementation and raw results, but not to the producer's headline numbers (5, 215, 1155, 1.04), which the task card's claim_under_review states. For H > 1000 the validator's sieve relies on the same square-denominator theorem as the producer's sieve (convergent standard design, independent code); the theorem-free slow scan covers H <= 1000.
  - L11 Compute sampled. Validator enumerations to H = 3e5 of GZ, BK, 11a1 and 37a1 (blind) and of the rank-7 curve (phase 2); the producer's counter on 11a1 to 3e5 (PTM-1); 2-descent images to p < 2e5. The producer's full census was not re-run.
  coordinator_prior_comparison: >-
    Custody held, every frozen metric recomputed exactly, and the blind re-derivation agreed. The anticipated
    definitional issue appeared as DISC-1 (the producer's cell population), with no effect on any outcome.
