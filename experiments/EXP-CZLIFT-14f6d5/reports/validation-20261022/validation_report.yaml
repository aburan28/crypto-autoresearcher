    result: heuristic_under_test is null. The preregistered_prediction (counts, median band, frac band, no record-curve H_half at p >= 1000) is in the frozen specification. The snapshot receipt (22:32:05Z) precedes the run start (22:40:23Z), and the specification is byte-identical at freeze and run commits.
  - check: sample integrity
    result: exhaustive deterministic enumeration, not sampling; seed null, consistent with spec seeds []; metrics recomputed from raw and from independent enumeration, not copied
  - check: correspondence validity
