  - check: scale binding
    result: tier toy; hmax 1e5 / 3e5, 16 primes 103..20011, three curves recorded; no crypto-scale statement made
  - check: null object
    result: >-
      The reference is the analytic uniform-reduction model, not an empirical null object of the same shape.
      Ratios reach 1.259 (rank-7, p = 211, H = 300, n/N_p ~ 0.52) and the median sits near 1.04 > 1 under every
      cell set. The run does not say what the ratio should do as n/N_p grows. This is reported for the
      review-evidence round (interpretation is not owned here, PD-1).
