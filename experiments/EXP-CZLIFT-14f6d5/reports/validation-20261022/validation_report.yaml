  - discrepancy: DISC-1
    statement: >-
      H-CZLIFT-27a184 defines the coverage population as "every coverage cell with N >= 30". The frozen lane-1
      summarize() additionally requires model_distinct <= 0.9 N_p and takes the median as sorted[n // 2], the
      upper element when n is even. Neither the specification nor the hypothesis states either rule.
    rows_excluded_by_saturation_filter_1e5: 13 cells, all 382623908456a1, (p, H) = (103, 3000..100000), (149, 10000..100000), (211, 10000..100000), (293, 30000..100000), (419, 100000); ratios 1.0001..1.0746
    rows_excluded_by_saturation_filter_3e5: 20 cells, the 13 above plus 382623908456a1 at (103..419, 300000) and (593, 300000), and brumer-kramer at (103, 300000); ratios 1.0000..1.0747
    nearest_cells_to_threshold: model/N_p = 0.8795 (kept) and 0.9133 (dropped); no cell within 0.02 of 0.9
    effect: median shifts by 0.0030 (1e5) and 0.0044 (3e5); no criterion clause changes
    rows_file: j2_definitions.json
  borderline_probes:
  - probe: cells at the N >= 30 threshold
    result: no cell has n_points 30 or 31; BK at H = 10000 has n_points 29 in all 16 primes and is excluded under every reading (O inclusion cannot move it across)
  - probe: points reducing to O (p | d)
    result: one, 382623908456a1 x = 298100/10609 (d = 103), reduces to O mod 103; the producer and validator both handle it and the distinct counts agree
  - probe: primes dividing 6 * discriminant (silent prime drop)
    result: none of the 16 primes divides any discriminant; all 16 primes are retained on every curve
  - probe: 2-torsion / c = 0 points (single-counted points)
    result: none; E(Q)[2] trivial on all three curves (no rational root of the 2-division cubic); affine counts are even
  - probe: singular fits
    result: GZ growth slope is a 2-point (1e5) or 3-point (3e5) fit and is exactly or nearly determined; GZ h_half_scaling is omitted (0 resolved primes), which is correct; no division by zero
  - probe: ties / duplicate reductions
    result: collisions occur (e.g. rank-7 p = 103, H = 100, 65 points, 61 distinct) and match exactly
  control_checks:
  - control: C1 "rank-7 overlap curve must reproduce its lane-1 counts exactly (same driver, same inputs)"
    result: holds. Counts, ainvs, primes, the full coverage table, h_half, discriminant and points_sample of 382623908456a1 equal those of lane-1 RUN-CZLIFT-74f172 (hmax 1e5) and RUN-CZLIFT-490b33 (hmax 3e5); lane-1 raw hashes 056518bb... and cfc6bfc8... equal their execution receipts. check.py does not test this control; the validator did.
    evidence: c1_ptm1.json
  - control: C2 "every sample point is re-verified on its curve by the checker; the H = 300 count is re-derived by a slow scalar search on every curve"
    result: >-
      Done by check.py as written, but weak. Only points_sample is verified (12, 4/10 and 12 points), with the
      producer's own g_exact. The H = 300 recount scans only square denominators and uses g_exact. On both record
      curves N(300) = 1 (O only), so the recount there cannot detect a sieve miss. The validator's independent
      slow all-denominator scan (H <= 1000) and sieve (H <= 3e5) reproduce every count, and every source-listed
      generator of height <= 3e5 (GZ P8 x = 13057; all nine BK generators) is found by the validator's
      enumeration (positive control).
  - control: C3 "rank labels are lower bounds from the sources; no rank is computed here"
    result: >-
      Holds in the records: rank_label_note states lower bounds, and rank 7 is marked recalled. The validator
      additionally certified rank >= 8 (GZ) and >= 9 (BK) from the sources' listed points, and rank >= 7 for the
      overlap curve from its enumerated points, by 2-descent images at fully split primes with E(Q)[2] = 0. These
      are lower bounds only.
    evidence: rank_certificate.json
  - control: checker independence
    result: >-
      check.py imports the driver and the lane-1 library and re-derives the summary with the producer's own
      summarize(), so it confirms raw <-> metrics self-consistency but cannot catch a wrong-but-consistent
      definition. It does not recompute N_p, distinct counts or H_half. The validator's independent Layer B
      recomputation supplies this (0 mismatches).
  - control: replication (agents/validator.md item 5)
    result: >-
      The two trials are nested, deterministic runs of the same code; counts and cells at H <= 1e5 are identical
      by construction, so 1e5/3e5 agreement carries no replication weight beyond the extension to 3e5. An
      implementation-independent replication of counts and coverage is provided by this validation.
  heuristic_validation_checks:
