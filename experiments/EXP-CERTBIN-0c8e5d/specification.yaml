# EXP-CERTBIN-0c8e5d
# Membership-cost integers at m = 5, l = 23. No gcd.
# Approved by DEC-20261002-56eaf5.
experiment:
  id: EXP-CERTBIN-0c8e5d
  hypothesis_id: H-CERTBIN-aff7ff
  source_idea: IDEA-20260926-0d1d74
  question_id: RQ-CERTBIN-836ce2
  version: 1
  title: Membership-cost integers at m = 5 and l = 23
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-56eaf5
  objective: >-
    Count the coefficient slots, the loop exponent, and the residual
    excess at m = 5, l = 23. Place the raw gap below 80 bits and the
    factorial-adjusted gap versus 2^37 strictly between 50.4 and 50.5
    bits. Reject a residual below the threshold.
  inputs:
    l: 23
    m: 5
    degree: 8388608
    coefficient_slots: 24
    orbit_gcds: 131
    loop_exponent: 92
    factorial: 24
    raw_gap_hundredths: 7804
    eighty_bits_hundredths: 8000
    fifty_bits_hundredths: 5000
    twenty_four_fifth: 7962624
    two_to_23: 8388608
    twenty_four_squared: 576
    two_to_9: 512
    residual_exponent: 69
    gain_exponent: 46
    excess_factor: 771751936
    sixteen: 16
    thirty_two: 32
  controls:
    - >-
      The named residual below the beat-the-loop threshold is false.
      The excess factor is 771751936. Reporting the residual below
      the threshold invalidates the run.
    - >-
      l*D^2 below 2^l at D = 2^{24} is false. The same factor is
      strictly above 1. Reporting that inequality invalidates the run.
    - >-
      A raw gap of at least 80 bits is false. 7804 is strictly below
      8000. Reporting that invalidates the run.
    - >-
      An adjusted gap of at most 50 bits versus 2^37 is false.
      24^5 is strictly below 2^{23}. Reporting that invalidates
      the run.
    - Two integer routes. They must not import each other.
  independent_variables:
    - budget
    - route in {powers, repeat_module}
  metrics:
    primary:
      - excess_factor
      - raw_gap_below_80
      - adjusted_gap_above_504
      - residual_below_threshold_rejected
      - implementations_agree
    secondary:
      - coefficient_slots
      - gain_exponent
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The excess factor, the raw gap, and the adjusted bracket.
    formula: >-
      The loop exponent is 4*23. The raw gap in hundredths is
      9200-1396. The adjusted gap versus 37 exceeds 50.4 bits when
      24^5 is below 2^{23}, and stays below 50.5 bits when 24^2 is
      above 2^9. The excess factor is 23*2^{25}. It exceeds 2^{29}
      when 23 exceeds 16, and stays below 2^{30} when 23 is below 32.
    source: >-
      IDEA-20260926-0d1d74 names the cell m = 5, l = 23, the loop
      exponent about 2^92, and the budgets 2^13.96 and 2^37, read
      2026-10-02. The factor and the brackets were recomputed in
      this design session. That computation is not a run. No gcd
      was computed.
  scale_relevance:
    tier: toy
    justification: Integer comparisons of written exponents. No transfer to a runtime.
    correspondence: null
  tail_checks:
    - The adjusted gap versus 2^37 is required. Stopping after the raw gap and still reporting the 50.4 bracket is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other integer route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the named residual is reported below the threshold, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The named residual is reported below the threshold.
    - l*D^2 is reported below 2^l at D = 2^{24}.
    - The raw gap is reported at least 80 bits.
    - The adjusted gap versus 2^37 is reported at most 50 bits.
    - A gcd or a runtime is reported.
  success_criterion: >-
    Both runs agree on the degree 8388608, the 24 slots, the 131
    gcds, the exponent 92, the factorial 24, the raw gap 7804
    hundredths, the excess factor 771751936, and the gain exponent
    46. The residual stays above the threshold. The raw gap stays
    below 80 bits. The adjusted gap stays strictly above 50.4 bits
    and strictly below 50.5 bits.
  falsification_criterion: >-
    The runs agree, the residual stays above the threshold, the raw
    gap stays below 80 bits, and any factor, exponent, or bracket
    differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-CERTBIN-0c8e5d/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CERTBIN-0c8e5d/runs/<RUN-ID>/command.txt
    - experiments/EXP-CERTBIN-0c8e5d/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CERTBIN-0c8e5d/runs/<RUN-ID>/stderr.log
    - experiments/EXP-CERTBIN-0c8e5d/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CERTBIN-0c8e5d/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any gcd, modular composition, or runtime measurement.
    - A claim that the primitive beats the loop or does not.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
