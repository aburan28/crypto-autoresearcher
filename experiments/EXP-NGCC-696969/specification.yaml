experiment:
  id: EXP-NGCC-696969
  hypothesis_id: H-NGCC-f74578
  version: 1
  title: >-
    Tins sign-29-1 reproduction: one signature to a fresh-message forgery,
    checked by a separate verifier
  status: review_required
  objective: >-
    Decide H-NGCC-f74578 on the official round-1 Tins package by running
    the published sign-29-1 argument and retaining only a fresh-message
    signature that a separately compiled verifier accepts.
  inputs:
    candidate_id: sign-29
    roster: inputs/ngcc-round1-20260920/candidates.yaml
    package_url: >-
      https://www.niccs.org.cn/niccs/Proposal/Public-Key%20Cryptographic%20Algorithms/Round%201%20candidates/Tins.zip
    literature_pointer: https://eprint.iacr.org/2026/2266
    finding_id: sign-29-1
    corpus_listing: KN-LIT-160d90
  controls:
    - >-
      Separate verifier: the process that checks the fresh signature is
      not the process that recovered the witness, and it is compiled from
      the same official sources.
    - >-
      Null transcript: on each key, replace the signature given to
      recovery with a fresh signature on a different message from a
      different key, and require the recovery to report no witness.
      A run that reports a witness on this control is invalid.
    - >-
      Honest baseline: before recovery, the official signer and verifier
      must accept one honest signature on a known message. A package that
      fails this check is an infrastructure failure, not a falsification.
  independent_variables:
    - parameter set name, as declared by the official package
    - keygen seed in {0, 1}
  metrics:
    primary:
      - fresh_signature_accepted
      - null_control_reported_witness
      - honest_kat_or_self_test_passed
    secondary:
      - unknowns_in_the_linear_system
      - recovery_wall_clock_seconds
      - peak_rss_bytes
  heuristic_under_test: null
  preregistered_prediction:
    quantity: fresh_signature_accepted
    formula: >-
      For every declared parameter set and both seeds, fresh_signature_accepted
      is true, null_control_reported_witness is false, and the linear system
      has at most 1044 unknowns.
    source: >-
      Saarinen, ePrint 2026/2266, finding sign-29-1, as indexed in
      inputs/ngcc-round1-20260920/paper_mentions.yaml. The prediction was
      written before any run of this experiment.
  scale_relevance:
    tier: crypto
    justification: >-
      The instances are the submitted parameter sets of a round-1
      candidate, not scaled-down toys. No extrapolation beyond those sets
      is claimed.
    correspondence: null
  tail_checks: []
  replication:
    seeds: [0, 1]
    independent_instances: 2
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 8
    maximum_runs: null
  stopping_rules:
    - Stop a parameter set after both seeds have a completed attempt.
    - Stop the experiment after every declared parameter set has been attempted or recorded as unavailable.
    - A timeout or crash stops that attempt and is recorded as infrastructure. It does not falsify the hypothesis.
  invalidation_rules:
    - The null control reports a witness.
    - The honest self-test fails before recovery.
    - Submission binaries, object files, or submission build scripts were executed.
    - The fresh message appears in the recovery transcript.
  success_criterion: >-
    For every parameter set the official package declares, both seeds
    produce a signature on a message absent from the recovery transcript,
    the separate verifier accepts it, the null control reports no witness,
    and the recorded unknown count is at most 1044.
  falsification_criterion: >-
    For some declared parameter set, both seeds finish a recovery attempt
    without an accepted fresh-message signature, the honest self-test had
    passed, and the null control did not fire.
  required_artifacts:
    - package sha256 and the parameter-set list, recorded before recovery
    - exact compile and run commands
    - per seed: recovery transcript hash, fresh message, signature bytes, verifier verdict
    - null-control verdict
    - run manifest with git commit and dirty-tree state
  assigned_to: executor
  approved_by: null
  approval_withheld_because: >-
    The design-experiment skill treats a contract as approved only after
    a snapshot archive commit. This checkout is on branch
    exec/aes-14352a-stage1, and git status in this worktree fails because
    a linked worktree gitdir is missing. Approval waits for a commit on
    an NGCC branch. The fields above are otherwise filled.
