# EXP-ECDLP-0b3e67
# Model-gap arithmetic. No point is enumerated.
# Approved by DEC-20261003-3590e0.
experiment:
  id: EXP-ECDLP-0b3e67
  hypothesis_id: H-ECDLP-471f56
  source_idea: IDEA-20261003-09a306
  question_id: RQ-ECDLP-623a32
  version: 1
  title: Allowed gaps 0, 1, 2, and 4
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-3590e0
  objective: >-
    Check the sum 7, the product 8, and the control gap 0.
  inputs:
    allowed_count: 4
    allowed_sum: 7
    positive_prod: 8
    gap_hi: 4
    gap_mid: 2
    gap_lo: 1
    gap_zero: 0
    hi_minus_mid: 2
    hi_minus_lo: 3
    hi_minus_zero: 4
    control_gap: 0
  controls:
    - >-
      The allowed gaps 0, 1, 2, and 4 sum to 7. Dropping 4 makes
      the sum 3 and the count 3, and that report invalidates the
      run.
    - >-
      The product of 1, 2, and 4 is 8. Four exceeds 2 by 2. Four
      exceeds 1 by 3. Four exceeds 0 by 4.
    - >-
      The control gap of one equation counted twice is 0.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {sum, product, control}
    - route in {add, multiply}
  metrics:
    primary:
      - allowed_sum
      - positive_prod
      - control_gap
      - implementations_agree
    secondary:
      - allowed_count
      - hi_minus_mid
      - hi_minus_lo
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The four allowed gaps sum to 7. The product of 1, 2, and 4
      is 8. The control gap is 0.
    formula: >-
      Add 0, 1, 2, and 4. Multiply 1, 2, and 4. Subtract 2 from
      4. The double count has gap 0.
    source: >-
      IDEA-20261003-09a306 states the allowed gap set 0, 1, 2,
      and 4, and the control gap 0, read 2026-10-03. No prime is
      named as an integer. The sums were recomputed in this
      design session. That computation is not a run. No point
      was enumerated.
  scale_relevance:
    tier: toy
    justification: One written four-element set. No transfer to a point count.
    correspondence: null
  tail_checks:
    - The product 8 and the control gap 0 are required. A check that stops at the sum 7 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the sum 7 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The sum is not 7.
    - The product is not 8.
    - The control gap is not 0.
    - The set is reported without 4, or a point is enumerated.
  success_criterion: >-
    Both runs agree that the four allowed gaps sum to 7, that
    the product of 1, 2, and 4 is 8, that 4 exceeds 2 by 2, and
    that the control gap is 0.
  falsification_criterion: >-
    The runs agree that the four allowed gaps are summed, and
    that sum is not 7.
  required_artifacts:
    - experiments/EXP-ECDLP-0b3e67/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-0b3e67/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-0b3e67/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-0b3e67/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-0b3e67/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-0b3e67/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any point enumeration or prime selection.
    - Any claim that a sum of 7 is a model gap.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
