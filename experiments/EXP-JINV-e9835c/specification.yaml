experiment:
  id: EXP-JINV-e9835c
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-f00729
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'CLOSURE with a named obstruction: the automorphism quotient E -> E/Aut is a lossy projection
    that is NOT a group homomorphism - the orbit of P+Q is not determined by the orbits of P and Q
    - so it is compatible with equality tests (giving rho''s sqrt(|Aut|)) and with relation transport
    (giving index calculus''s |Aut|/2), and with NOTHING that propagates through the group law; every
    j=0 / j=1728 mechanism that needs propagation therefore dies at the first addition, and the forward
    guidance names the three classes that do not need it'
  status: draft
  objective: "(A) THE OBJECT AND THE FAILURE, STATED EXACTLY. Let A = Aut(E) act on E, let r = |A/{+-1}|\
    \ (r = 3 for j=0, r = 2 for j=1728, r = 1 generically), and let pi: E -> E/A be the orbit map.\
    \ pi is a genuinely lossy projection: it forgets which of the |A| points of an orbit you hold,\
    \ and it cannot be inverted. Now ask the lossy-projection test's actual question - does the RETAINED\
    \ PART PROPAGATE DETERMINISTICALLY through the target's operations? The target's operation is\
    \ addition. Compute:\n  pi(P) + pi(Q) is not defined; the natural candidate is the SET\n  { phi^i(P)\
    \ + phi^j(Q) : 0 <= i,j < r },\n  which has r^2 elements and meets exactly r distinct A-orbits,\
    \ indexed by\n  the difference (i - j) mod r, because phi^i P + phi^j Q =\n  phi^j( phi^{i-j}\
    \ P + Q ).\nSo the orbit of P+Q is determined by (pi(P), pi(Q)) ONLY UP TO AN r-FOLD AMBIGUITY,\
    \ and that ambiguity is exactly the residue (i-j) mod r. For r = 1 (generic j, and also for negation\
    \ alone, since -P + -Q = -(P+Q)) the ambiguity is trivial and the projection IS a homomorphism\
    \ - which is why negation is free and has always been free. For r > 1 it is not. [derived in this\
    \ record; elementary and verifiable by hand.]\n(B) WHY THAT EXACT FAILURE PRODUCES EXACTLY THE\
    \ TWO KNOWN CONSTANTS.\n  B1 RHO NEEDS ONLY AN EQUALITY TEST, NOT THE GROUP LAW ON THE QUOTIENT.\
    \ A\n    collision search on E/A needs to recognise when two walk states coincide\n    as orbits;\
    \ the walk itself is computed on E and only the state is\n    projected. Since |E/A| = N/|A| approximately,\
    \ the birthday bound gives\n    sqrt(|A|) fewer steps. That is KN-TECH-018's sqrt(|Aut|), at most\n\
    \    sqrt(6), and it survives the non-homomorphism because it never uses it.\n    (It pays for\
    \ that in fruitless cycles, which is a separate cost and is\n    H-RHO-bc6ea6's subject for r\
    \ = 1; that hypothesis explicitly places\n    j in {0,1728} OUT OF SCOPE, so the j=0 cycle structure\
    \ is unmeasured in\n    this program.)\n  B2 INDEX CALCULUS NEEDS ONLY TRANSPORT OF WHOLE RELATIONS.\
    \ Applying phi to\n    a COMPLETE relation sum e_i P_i = R gives sum e_i phi(P_i) = phi(R). The\n\
    \    ambiguity in (A) never arises because every summand is shifted by the\n    SAME i. That is\
    \ why the factor-base quotient works and gives at most r\n    on collection and r^2 on dense linear\
    \ algebra\n    (IDEA-20260807-f8a045 claim (A)).\n  B3 EVERYTHING ELSE DIES. Any mechanism that\
    \ needs to ADD TWO PROJECTED\n    OBJECTS - a walk defined on the quotient, a decomposition search\
    \ over\n    orbit-indexed unknowns with mixed shifts, a meet-in-the-middle over\n    orbits, a\
    \ baby-step/giant-step on E/A, a \"summation polynomial in the\n    quotient coordinate\" that\
    \ treats the quotient as a group - encounters\n    the r-fold ambiguity at every addition and\
    \ must either enumerate the r\n    branches (destroying the r-fold saving exactly) or track the\
    \ shift index\n    (which is the next point).\n\n(C) TRACKING THE SHIFT INDEX IS A CHANGE OF COORDINATES,\
    \ NOT A NEW OBJECT. The obvious repair is to track the pair (orbit, shift index). But the shift\
    \ index of a point relative to a fixed orbit representative is exactly the information the orbit\
    \ map discarded: (pi(P), i) determines P. By the lossy-projection test of docs/inventor-protocol.md\
    \ section 2 - \"a projection that loses nothing is a change of coordinates, not a new object\"\
    \ - the repaired object is E itself in different notation, and it therefore inherits every bound\
    \ E has. This is the same shape of failure as the worked counterexample in that section, where\
    \ tracking (x xor y, x*y) is worthless because the pair recovers the unordered pair of inputs.\
    \ THE REPAIR IS EXACTLY AS EXPENSIVE AS THE THING IT REPAIRS, AND THAT IS THE CLOSURE.\n(D) WHAT\
    \ THE CLOSURE DOES AND DOES NOT SAY. It says: no mechanism whose tracked object is the A-ORBIT\
    \ can beat the constants in B1 and B2, because the orbit does not propagate through addition and\
    \ the only fix restores the full point. It does NOT say j=0 curves are as hard as generic ones\
    \ by any proof - they are cheaper by the stated constants. It does NOT declare the lane impossible;\
    \ it names an obstruction inside a stated scope and hands forward the classes that avoid it (see\
    \ forward guidance in the mechanism). THIS PROPOSAL CLAIMS NOTHING BEYOND THE KNOWN CONSTANTS.\
    \ It is filed as a closure argument, which under docs/inventor-protocol.md section 4 requires\
    \ a named obstruction (the non-homomorphism), an argument ((A) and (C)), and forward guidance\
    \ (below) - all three of which it supplies."
  resource_label: '"audit: consumes no resource". This proposal mounts no attack and consumes no R1-R8
    resource; it audits the resource ledger itself, in the sense of lane L12 (RQ-GGMB-6eaabc), by
    deciding in advance which L3 mechanisms are worth compute.'
  admissibility: admissible
  admissibility_argument: 'An audit is not subject to the admissibility filter, because the filter
    asks what non-generic resource a MECHANISM consumes and this record proposes no mechanism. Its
    content is an argument about a map between sets, checkable by hand. What it does is make the filter
    cheaper to apply: after this record, an L3 proposal whose tracked object is an automorphism orbit
    and whose mechanism requires adding two orbits can be rejected at zero cost, which is the same
    service DECOMPOSITION.md section 2 provides for group-operation outputs. It is admissible in the
    trivial sense and useful in the practical one.'
  reachability_gate: 'NOT APPLICABLE AS A WALK, but the closure interacts with T4/T5 in a way that
    strengthens it. T4: an Aut of order > 2 requires D_0 = -3 or D_0 = -4, and a curve whose isogeny
    class lacks such a curve cannot be walked to one at any price. So the object this record closes
    is only ever AVAILABLE on curves that already have it, and its closure therefore costs the campaign
    nothing it could have reached. Conversely, this is why the closure matters: it removes the temptation
    to spend the campaign''s isogeny budget searching for a "better automorphism" that T4 says cannot
    exist inside a fixed class.'
  inputs:
    procedure: THE CHEAPEST VALID DISCRIMINATOR IS THE OBSERVATION-COLLISION SEARCH AND IT COSTS SECONDS.
      On one small j=0 toy curve, exhibit an explicit pair (P,Q) and (P', Q') = (phi(P), Q) with the
      same orbits but different orbit of the sum. That single explicit pair PROVES the non-homomorphism
      on that curve and, together with the r=1 control on a generic curve, establishes the entire
      closure. Everything else in the mechanism is corroboration. Step 3's branching-cost measurement
      is the only part that needs real compute and it is worth running because it converts "this cannot
      help" into "this loses by a factor sqrt(3)", which is a citable number rather than an opinion.
    mechanism: "THIS IS AN ARGUMENT, NOT AN EXPERIMENT, AND ITS STEPS ARE PROOF STEPS.\nSTEP 1. Verify\
      \ (A) mechanically on toy curves: for many random pairs (P,Q) on a j=0 curve, compute the multiset\
      \ of A-orbits of { phi^i P + phi^j Q }, and confirm it has exactly r = 3 distinct orbits with\
      \ multiplicity r each, indexed by (i-j) mod r. Confirm the generic-curve case gives exactly\
      \ 1. This is a few lines against harness/toycurve.py and it converts the hand derivation into\
      \ a checked fact.\nSTEP 2. Verify the (C) collapse mechanically: confirm that (orbit(P), shift\
      \ index relative to a canonical representative) determines P uniquely, by round-tripping every\
      \ point of a sample. If any information is lost, (C) is wrong and the repaired object is genuinely\
      \ lossy after all - which would be the interesting event and would reopen the lane.\nSTEP 3\
      \ (THE BRANCHING-COST MEASUREMENT, and it is what turns the argument into a quantitative statement).\
      \ Implement a walk that operates PURELY on the quotient - i.e. that refuses to look at the underlying\
      \ point and must enumerate the r branches at each addition. Measure its cost against a walk\
      \ on E/A that computes on E and projects only the state. Predicted: the pure quotient walk costs\
      \ exactly r times more per step, cancelling the sqrt(r) birthday saving and leaving a NET LOSS\
      \ of r/sqrt(r) = sqrt(r) - i.e. the naive \"work on the quotient\" idea is worse than doing\
      \ nothing by a factor sqrt(3) = 1.73 on a j=0 curve. THIS IS A PREDICTION WITH A NUMBER AND\
      \ IT IS FALSIFIABLE.\nSTEP 4. FORWARD GUIDANCE - the classes this closure does NOT reach, written\
      \ out so the next session does not have to rediscover them:\n  G1 MECHANISMS THAT NEVER ADD\
      \ PROJECTED OBJECTS. Relation transport (B2) is\n    the known one. Multi-target and preprocessing\
      \ (lane L13,\n    RQ-MTGT-2cabee): a precomputed table indexed by orbits is queried by\n   \
      \ equality, never added, so the r-fold saving in table size survives. This\n    is genuinely\
      \ open and this record does not touch it.\n  G2 MECHANISMS THAT USE THE QUOTIENT AS A VARIETY\
      \ RATHER THAN AS A SET.\n    E/A is isomorphic to P^1; for j=0 the map is (x,y) -> y (degree\
      \ 3) and\n    for j=1728 it is (x,y) -> x^2 (degree 4). Algebraic constructions on that\n  \
      \  P^1 - summation polynomials in the quotient coordinate - are not\n    \"adding orbits\",\
      \ they are writing equations, and they pay the\n    non-homomorphism as a DEGREE increase rather\
      \ than as a branching factor.\n    That is IDEA-20260807-d329e2, which is this record's designated\
      \ test.\n  G3 THE FRUITLESS-CYCLE STRUCTURE AT r > 1 IS UNMEASURED IN THIS PROGRAM.\n    H-RHO-bc6ea6\
      \ excludes j in {0,1728} by assumption. A |A| = 6 quotient\n    walk has a richer cycle structure\
      \ than a negation walk and its escape\n    cost could eat a materially larger share of the sqrt(6).\
      \ That is a\n    constant, but it is a constant nobody here has measured, and it could\n   \
      \ make the j=0 discount SMALLER than sqrt(6) rather than larger.\n  G4 THE PRIMALITY OF N, NOT\
      \ THE SIZE OF |A|, IS THE LOAD-BEARING FACT IN\n    H-ENDO-001'S HALF OF THE OBSTRUCTION. Composite-order\
      \ groups are outside\n    both arguments."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - generic-j curve, which must show branching exactly 1 (N1)
  - j=1728 curve, which must show branching exactly 2 (N2)
  - fake |Aut|-sized partition, which must show branching about |Aut|^2 (N3)
  - 'degenerate-pair enumeration: short orbits, Q = phi^i P, and points whose order divides |Aut|,
    each counted separately'
  - peek-check on the pure-quotient walk implementation, verifying it cannot access the underlying
    point
  - matched rho with negation on the identical instance
  - "NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, AND IT IS UNUSUAL HERE BECAUSE THE NULL\
    \ IS THE GENERIC CURVE AND THE PREDICTION IS THAT THE NULL BEHAVES DIFFERENTLY. N1 GENERIC-j CURVE\
    \ (r = 1, negation only). Step 1 must return exactly ONE\n  orbit for { phi^i P + phi^j Q }, i.e.\
    \ the projection IS a homomorphism\n  there. If the instrument reports r > 1 branches on a generic\
    \ curve it is\n  broken, since -P + -Q = -(P+Q) is an identity.\nN2 j=1728 CURVE (r = 2). Step\
    \ 1 must return exactly TWO orbits. The\n  instrument must therefore produce THREE different answers\
    \ on three curve\n  families, which is a much stronger instrument test than a single\n  comparison.\n\
    N3 FAKE PARTITION: partition the points into arbitrary blocks of size |A|\n  that are not orbits,\
    \ and run Step 1. The branch count must be\n  approximately |A|^2, not |A|, because a fake partition\
    \ has no structure at\n  all. An instrument that reports |A| on a fake partition is counting\n\
    \  bookkeeping, not mathematics.\nDECAY PARAMETER: r itself, swept over {1, 2, 3} via {generic,\
    \ j=1728, j=0}. The branching factor must EQUAL r exactly and must therefore GROW with r. A branching\
    \ factor that is constant across the three families is the canonical artifact tell and voids the\
    \ measurement."
  independent_variables: []
  metrics:
    primary:
    - distinct-orbit count per random pair, per family, with the full histogram
    - explicit witness pair for the non-homomorphism, recorded verbatim
    - round-trip success rate of (orbit, shift index)
    - per-step and end-to-end cost of both walk variants, in point additions
    secondary:
    - degenerate-pair counts and their exclusion rationale
    - pass/fail of all four controls
  heuristic_under_test: null
  preregistered_prediction:
    quantity: number of distinct Aut-orbits met by { phi^i P + phi^j Q } for generic (P,Q), by curve
      family
    formula: Exactly 1 (generic), 2 (j=1728), 3 (j=0), on at least 99.9 percent of random pairs, with
      the residual accounted for by the enumerated degenerate cases. Any other triple refutes claim
      (A).
    source: pre-registered in IDEA-20260807-f00729 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - DEGENERATE PAIRS. If Q is in the orbit of P, or if P has order dividing |Aut|, or if x = 0 on
    a j=0 curve (a fixed point of the order-3 automorphism), the branch count collapses. These are
    enumerated and excluded rather than allowed to dilute the histogram.
  - NEGATION IS ALREADY COUNTED. The standard baseline 0.886*sqrt(N) already includes the sqrt(2)
    from negation (KN-TECH-006, KN-TECH-018), so the EXTRA discount at j=0 is sqrt(3) and not sqrt(6).
    Every constant in this record is stated relative to a named baseline, and quoting sqrt(6) against
    an already-negation-discounted baseline would double-count.
  - IMPLEMENTATION OVERHEAD MASQUERADING AS BRANCHING. A pure-quotient walk written naively can be
    slower for reasons that have nothing to do with branching. The per-step cost must be decomposed
    into branch enumerations and other work before the factor 3 is claimed.
  - THE ARGUMENT IS ABOUT ADDITION, NOT ABOUT COMPUTATION IN GENERAL. A mechanism that uses the quotient
    without adding is untouched, and G1/G2 in the forward guidance say so. Reading this closure as
    "automorphisms are useless" would be a misreading and is forbidden.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Exactly 1 (generic), 2 (j=1728), 3 (j=0), on at least 99.9 percent of random
    pairs, with the residual accounted for by the enumerated degenerate cases. Any other triple refutes
    claim (A).
  falsification_criterion:
  - No pair (P,Q), (P',Q') with equal orbits and unequal sum-orbit exists on a j=0 curve. Claim (A)
    is false, the projection IS a homomorphism, and this entire closure is withdrawn by a superseding
    record. This is the single cleanest falsifier in the batch.
  - The branching count on a generic curve is not exactly 1. Instrument failure; every number void.
  - (orbit, shift index) fails to determine the point. Claim (C) is false and the repaired object
    is genuinely new; the lane reopens with a concrete object to study.
  - The pure-quotient walk beats matched rho with negation. The closure is refuted; halt for independent
    review under AGENTS.md rule 12.
  - The fake-partition control reports branching |Aut| rather than about |Aut|^2. The instrument is
    measuring bookkeeping and its outputs are void.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
