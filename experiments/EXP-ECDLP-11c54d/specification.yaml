  historical_scientific_protocol:
    objective: Over F_29, count affine points of y^2 = x^3 - x + 1 and y^2 = x^3 + x whose x lies in {0,
      ..., 14} or in {15, ..., 28}. The positive reading is the four counts 20, 16, 10, and 9, hence imbalances
      4 and 1 and gap 3. Counting the first curve twice has gap 0. This is not a discrete logarithm.
    preregistered_prediction:
      quantity: The four half-counts equal 20, 16, 10, and 9, so the absolute gap of the imbalances is
        3.
      formula: The positive reading is that exact match, including projective totals 37 and 20. The negative
        reading is any other pair on a valid scanner.
      source: IDEA-20261006-43905e states those four integers and the gap 3. That list was fixed before
        this driver was executed.
    success_criterion: The manifest is valid, planted_ok is true, the four half-counts are 20, 16, 10,
      and 9, and the projective totals are 37 and 20.
    falsification_criterion: The manifest is valid, planted_ok is true, and either half-count differs
      from that list or a projective total differs from 37 or 20.
    decision_impact:
      on_positive: Record that these two curves match the pre-registered half-counts. Do not treat the
        gap as a discrete logarithm or as a rho step.
      on_negative: Record that the recount missed the pre-registered integers. Do not replace the list
        and do not run rho from this manifest.
    stopping_rules:
    - Stop after one valid manifest for RUN-ECDLP-4a3ca0.
    - Do not add a curve, a second prime, or a rho walk.
    - A missed matrix is the recorded result. Do not change the four integers.
    invalidation_rules:
    - The two enumerations disagree, or the self-count gap is nonzero.
    - A named discriminant is zero.
    - A timeout, crash, or missing half.
    replication:
