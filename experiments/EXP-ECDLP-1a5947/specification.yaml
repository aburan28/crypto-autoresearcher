# EXP-ECDLP-1a5947
# Digit-count arithmetic. No curve point is added.
# Approved by DEC-20261004-4d2b8c.
experiment:
  id: EXP-ECDLP-1a5947
  hypothesis_id: H-ECDLP-2df042
  source_idea: IDEA-20261003-62892c
  question_id: RQ-ECDLP-002
  version: 1
  title: Doubling count and addition count of the integer 63
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-4d2b8c
  objective: >-
    Check the counts 6, 5, and 5, the product 150, and the nearby gap 0.
  inputs:
    bit_length: 6
    doublings: 5
    additions: 5
    length_gap: 1
    doubling_gap: 0
    digit_product: 150
    digit_sum: 16
    nearby_a: 5
    nearby_b: 5
    nearby_gap: 0
    nearby_product: 25
  controls:
    - >-
      The bit length is 6. The doubling count is 5. The addition
      count is 5. Reporting the addition count as 6 drops the gap
      against the bit length and invalidates the run.
    - >-
      Six exceeds five by 1. Five equals five, so that gap is 0.
      The product of 6, 5, and 5 is 150. Their sum is 16.
    - >-
      Two readings of the addition count are both 5. Their gap is
      0 and their product is 25.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {bits, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - additions
      - implementations_agree
    secondary:
      - digit_product
      - digit_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The integer 63 has bit length 6, 5 doublings, and 5
      additions. The gap of two addition counts is 0.
    formula: >-
      Read the bit length 6. Count 5 doublings. Count 5 additions.
      Multiply 6, 5, and 5. Subtract 5 from 5.
    source: >-
      IDEA-20261003-62892c states the counts 6, 5, and 5, read
      2026-10-04. The gaps, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 150 and the nearby gap 0 are required. A check that stops at the bit length 6 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the addition count 5 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 6.
    - The doubling count is not 5.
    - The addition count is not 5.
    - The product is not 150.
    - The addition count is reported as 6, or a curve point is added.
  success_criterion: >-
    Both runs agree that the bit length is 6, that the doubling
    count is 5, that the addition count is 5, and that the product
    of those three counts is 150.
  falsification_criterion: >-
    The runs agree that the addition count is computed, and that
    count is not 5.
  required_artifacts:
    - experiments/EXP-ECDLP-1a5947/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-1a5947/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-1a5947/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-1a5947/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-1a5947/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-1a5947/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a digit-count gap moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
