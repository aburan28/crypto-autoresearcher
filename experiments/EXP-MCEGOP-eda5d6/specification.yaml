experiment:
  id: EXP-MCEGOP-eda5d6
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-118177; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-118177
  question_id: RQ-MCE-b38a8b
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Construct, exhaustively certify and hash-pin a binary Goppa key-pair fixture family at m
    in 4..6, t in 2..4, n <= 64, using dependency-free Python, against a matched random-code null
    and a corrupted-key positive control run in the same invocation
  objective: 'The single uncertainty a run reduces is whether this program can produce a binary Goppa
    object at all, and with what certified properties. Stated in parts: (i) CONSTRUCTIBILITY -- whether
    a valid Gamma(L,g) with squarefree irreducible g can be built from the Python standard library
    alone on this machine, at each cell of the declared grid, and whether the trace-expanded parity
    check attains the expected rank mt or falls short, cell by cell. (ii) CERTIFIED DECODABILITY --
    whether the implemented decoder recovers every error pattern of weight <= t on the enumerated
    sphere, with zero silent miscorrections, and whether the enumerated minimum distance meets or
    exceeds 2t+1 in every cell small enough to enumerate fully. These are counted facts with denominators,
    not spot checks, and they are the only basis on which any later structural measurement in this
    bucket could be trusted. (iii) DISCRIMINATION FLOOR -- whether a matched random binary code of
    identical n and k, run through the identical pipeline in the same invocation, differs measurably
    on any metric. This third part is what decides whether the toy scale is informative at all: a
    cell where the null matches the signal arm everywhere is a cell too small to carry any comparative
    claim, and knowing which cells those are is worth more than any single measured number, because
    it fixes the floor below which every other proposal in this bucket is measuring nothing. A run
    also emits the artifact: a hash-pinned fixture file plus a self-check script that re-derives it
    from the seed in a separate process, so that reproducibility is demonstrated rather than asserted.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A completed run could support exactly this and no more: that
      at the enumerated cells with m <= 6, n <= 64, t <= 4, over the two declared field-polynomial
      bases and the declared seeds, a constructed Gamma(L,g) had the measured rank, the measured dimension,
      the measured enumerated minimum distance and the measured decoding-outcome counts recorded in
      the run record; that the matched random null had its own measured values; and that the emitted
      artifact re-derives to the recorded sha256. What does NOT follow: nothing about Classic McEliece
      or any standardized parameter set, nothing about the security of any scheme, no distinguisher,
      no attack, no key recovery, no statement about the behaviour of any structure at m = 13, and
      no claim that a metric separating the arms at n = 16 would separate them anywhere else. RQ-MCE-b38a8b''s
      TOY-and-defensive ceiling applies unchanged and is not waived by anything in this contract.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes). Freeze the validity gate, the two field-polynomial bases,
      the cell grid and the seed derivation, and commit them before any cell runs. STAGE 1 (cost:
      seconds). Build and self-test GF(2^m) for m in {4,5,6}: inverse existence for all nonzero elements,
      table round-trip, sampled associativity. STAGE 2 (cost: seconds to minutes per cell). Search
      for monic irreducible g of degree t; record failures as unavailable cells rather than substituting.
      STAGE 3 (cost: seconds). Draw L, check g(a) != 0, build H over GF(2^m), trace-expand to H2,
      reduce, record rank and pivots. STAGE 4 (cost: seconds to minutes). Compute G, k, systematic
      form and column permutation; run the corrupted-g positive control and the permuted-copy control.
      STAGE 5 (cost: minutes to an hour on the largest enumerable cells). Enumerate the codebook where
      k <= 20 and compute exact minimum distance; otherwise sample and label the bound as sampled.
      STAGE 6 (cost: minutes per cell, capped). Enumerate every weight-<=t error pattern up to a 10^6
      cap, decode, classify each outcome. STAGE 7 (cost: same as 3-6, doubling total). Run the matched
      random null through STAGES 3-6 unchanged. STAGE 8 (cost: minutes). Emit the artifact, hash it,
      re-derive from seed in a fresh process, compare. Total budget 4 CPU-hours, with unreached cells
      reported rather than the grid silently shrunk.'
    instrument: 'Python 3.11.15 standard library only, verified: numpy and galois both fail to import
      in this environment. A new module harness/goppa_toy.py implementing GF(2^m) as exp/log tables
      from a fixed primitive polynomial per m; GF(2) linear algebra with matrix rows as Python ints
      and Gaussian elimination by XOR and bit_length; polynomial arithmetic over GF(2^m) as coefficient
      lists with extended Euclid for the key equation; codebook and error-sphere enumeration by itertools.combinations.
      Driven through harness/runner.py so the run manifest records the resolved inference block per
      the model-policy note, with determinism supplied by random.Random(seed) and domain-separated
      seed derivation. No Sage, no Magma, no external package, no network.'
    parameters: m in {4,5,6} with field polynomials x^4+x+1, x^5+x^2+1, x^6+x+1, plus a second basis
      per m for the invariance control. t in {2,3,4}. n in {12,16} for m=4; {24,28,32} for m=5; {40,48,56,64}
      for m=6, always with n <= 2^m and n >= mt+4 so the dimension is positive and nontrivial. 5 independent
      (L, g, seed) draws per cell, giving at most 45 cells and 225 Goppa instances plus 225 matched
      nulls. Full codebook enumeration only where k <= 20 (at most 2^20 codewords). Error-sphere enumeration
      exhaustive up to a hard cap of 10^6 patterns per cell; above the cap, uniform random sampling
      of exactly 10^6 patterns with the switch recorded in the run record. Coset-leader table for
      the null capped at n-k <= 24.
  controls:
  - Matched random binary [n,k] code, same n and k, same enumerations, same invocation, domain-separated
    seed.
  - 'Deliberately corrupted fixture positive control: a g with a root inside L, which the validity
    gate MUST reject; if it passes, the gate is not measuring what it claims.'
  - 'Column-permuted copy of the Goppa code: must decode identically after applying the inverse permutation,
    catching index bugs that would otherwise read as structure.'
  - 'Second field-polynomial basis for the trace expansion: every reported invariant must be unchanged,
    or the implementation is basis-dependent and unusable as a fixture.'
  - Five independent (L, g, seed) draws per cell so that any per-cell number carries a spread rather
    than a single reading.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): For every cell, in the SAME process invocation and from a domain-separated
    seed, generate a matched random binary [n, k] code by sampling a uniformly random (n-k)-by-n GF(2)
    matrix and resampling on rank deficiency, with n and k taken from the Goppa cell after its rank
    is measured. Run the identical rank-profile extraction, systematic-form reduction, codebook enumeration
    and -- for the decoder arm -- an exhaustive coset-leader syndrome-table decoder against it. For
    the fixture claim to mean anything the null must show BOTH: (a) the same generic rank mt, so that
    rank alone is not the signal; and (b) at least one metric on which it differs, most plausibly
    a smaller enumerated minimum distance and a bounded-distance decoder that fails some weight-t
    pattern. If the random null matches the Goppa arm on every metric in a cell, that cell is recorded
    as UNINFORMATIVE and discarded from comparative reading -- not reported as a Goppa property.'
  independent_variables:
  - m (field extension degree)
  - t (Goppa polynomial degree)
  - n (code length)
  - draw index / seed
  - arm (goppa | matched-random-null | corrupted-g positive control | permuted-copy control)
  metrics:
    primary:
    - rank(H2)
    - k = n - rank(H2)
    - exact or sampled minimum distance, labelled which
    - fraction of weight-<=t patterns decoded correctly
    - silent-miscorrection count at weight <= t
    secondary:
    - wall-clock per stage
    - GF(2^m) multiplication count
    - peak resident memory
    - count of unavailable cells from failed g search
    - sha256 of the artifact and of its re-derivation
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The decoding-success fraction on the enumerated weight-<=t error sphere, per arm and
      per cell, together with rank(H2).
    formula: 'S(arm, m, t, n, seed) = |{e : wt(e) <= t and Decode(H2 e^T) = e}| / |{e : wt(e) <= t}|.
      Pre-registered: S(goppa) = 1 exactly for every cell that passes the validity gate, and rank(H2)
      = m*t for at least 90 percent of cells. For the null arm no value is pre-committed; the only
      pre-registered relation is S(goppa) >= S(null), and S(null) = 1 is a recorded outcome meaning
      the cell is uninformative.'
    source: Pre-registered in the parent proposal IDEA-20260816-118177 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at m <= 6, n <= 64, t <= 4, which is three to four binary orders of magnitude
      below any deployed parameter set and sits exactly on RQ-MCE-b38a8b''s declared toy boundary.
      NO transfer or extrapolation assumption is made: the fixture is an instrument and its numbers
      are claimed only at the cells run. The one quantity that would be scale-independent if it held
      -- the designed-distance bound d >= 2t+1 for binary Goppa with squarefree g -- is treated here
      as a prediction to be measured at the tested cells, not as a theorem proved by this run and
      not as a licence to speak about larger m.'
    correspondence: null
  tail_checks:
  - Cells with n = 2^m (full-field support) reported separately as a degenerate special case rather
    than averaged in.
  - Cells where rank(H2) < mt reported individually with their (m,t,n,seed) and not folded into a
    mean.
  - The largest t at the smallest admissible n, where n - mt is smallest, is run immediately after
    the smoke cell because it is the most likely to degenerate.
  - A g with a repeated root or a root in L must be rejected by the validity gate; one such g is injected
    deliberately as a positive control.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop the grid and report if the m=4, t=2, n=16 smoke cell fails any falsification condition.
  - Hard cap of 4 CPU-hours in total; on exhaustion, report which cells were not reached rather than
    shrinking the declared grid.
  - Abort exhaustive error-sphere enumeration in any cell exceeding 10^6 patterns and switch to the
    declared uniform sampling, recording the switch in the run record.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Every cell that passes the validity gate decodes 100 percent of its enumerated
    weight-<=t error sphere with zero silent miscorrections, the matched random null is run in the
    same invocation with its own measured fractions, and the emitted fixture artifact re-derives byte-identically
    from its seed in a separate process to the recorded sha256.
  falsification_criterion:
  - Any weight-<=t pattern uncorrected on a validity-passing Goppa cell.
  - Enumerated minimum distance below 2t+1 in any fully enumerated cell.
  - rank(H2) > mt in any cell.
  - Any invariant changing under the second field-polynomial basis.
  - The corrupted-g positive control passing the validity gate.
  - The re-derived artifact failing to match the recorded sha256.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-118177
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Which decoder route is primary -- Patterson with a square root modulo g, or the extended-Euclid
    key equation on the degree-2t alternant presentation -- is not settled here. The Coordinator must
    freeze one as primary and the other as a cross-check, because running both and reporting the better
    one is a selection effect.
  - The exact contents of the validity gate (distinct support, g(a) != 0, squarefreeness, irreducibility,
    rank condition, existence of a systematic form) must be frozen as an explicit checklist before
    any cell runs.
  - Whether this fixture may be cited or consumed by EXP-MCE-3ffdf9 is a Coordinator decision; that
    contract is at review_required and this proposal cannot bind it.
  - Whether d >= 2t+1 is imported as a background assumption or treated purely as a measured prediction
    needs a Coordinator ruling, since importing it makes the enumeration a check and not importing
    it makes the enumeration the only evidence.
