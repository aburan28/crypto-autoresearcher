experiment:
  id: EXP-EQIC-3665b2
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-267b95
  question_id: RQ-EQIC-8cb959
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'ASSEMBLE THE RIGHT-HAND SIDE AND ACTUALLY SOLVE: the lane has never built a linear system
    with a right-hand side, so no cost path exists at all -- produce the first certificate-carrying
    end-to-end index-calculus discrete log on a j = 0 curve with a phi-stable factor base, against
    a CARDINALITY-MATCHED random base and against rho, BSGS and the automorphism-discounted rho, and
    measure the constant C in the linear-in-N prime-field collection cost'
  status: draft
  objective: "(A) THE ABSENCE THIS ADDRESSES, STATED FROM THE RECORD. DEC-20260727-009 R3 records,\
    \ of this entire line of work, that \"_collect_relations builds rows as bare 0/1 incidence vectors\
    \ and never records the target's scalar multiple, so no linear system with a right-hand side has\
    \ ever been assembled - not in EXP-STR-002, not in EXP-STR-003\", that the measured rank deficiency\
    \ of the phi arm's own row list was 4, 6, 30 and 67, and that \"there is no committed rho or BSGS\
    \ baseline at n = 41617 or n = 158071, the two instances carrying the headline claims\". THE LANE\
    \ HAS NO END-TO-END COST PATH. This proposal builds one. It is filed as an ALGORITHM proposal\
    \ rather than as tooling because the object produced is a complete attack pipeline with a verifiable\
    \ output, and its deliverable is a fully-charged cost, not a metric.\n(B) THE SYSTEM, WRITTEN\
    \ OUT. On a j = 0 curve with G = <P> of prime order N, Q = [k] P, and phi acting on G as lambda\
    \ with lambda^2 + lambda + 1 = 0 mod N, take a factor base V that is a union of m phi-orbits,\
    \ |V| = 3m, with canonical orbit representatives whose logs are l_1, ..., l_m. Draw targets R_t\
    \ = a_t P + b_t Q with independent random a_t, b_t. A successful arity-2 decomposition R_t = eps_1\
    \ phi^{c_1}(P_{j_1}) + eps_2 phi^{c_2}(P_{j_2}) gives the linear equation over F_N\n  eps_1 lambda^{c_1}\
    \ l_{j_1} + eps_2 lambda^{c_2} l_{j_2} - b_t k = a_t.\nTHE UNKNOWNS ARE l_1, ..., l_m AND k: exactly\
    \ m + 1 of them. Collect until the system has rank m + 1 and solve; k is read off directly and\
    \ is independently verifiable by checking [k] P == Q, which is a docs/claims-and-verification.md\
    \ solution certificate that the run wrapper re-verifies without touching the solver. THE MATCHED\
    \ ARM: the same everything with V a uniformly drawn on-curve x-coordinate set of the SAME cardinality\
    \ 3m, whose unknowns number 3m + 1. THE RELATION ARITHMETIC, EXPLICIT: in the phi arm each successful\
    \ search yields ONE independent equation and the orbit closure yields two more rows that are lambda-multiples\
    \ with rank increment 0, so full rank needs m + 1 successful searches; in the matched arm it needs\
    \ 3m + 1; the per-search success probability is the same in both because it depends on |V| = 3m\
    \ and the arity. The end-to-end relation-collection ratio is therefore predicted to be (3m + 1)/(m\
    \ + 1), which tends to 3 and is measurably below 3 at small m -- a sharper prediction than the\
    \ asymptotic constant, and one that the matched-cardinality design makes checkable.\n(C) THE COST\
    \ MODEL, WITH ITS OWN PREDICTION. Let P_succ be the measured per-target success probability, s\
    \ the measured cost per decomposition search, and L the measured linear-algebra cost. Then\n \
    \ total(phi arm)    = (m+1) / P_succ * s + L(m+1),\n  total(matched arm) = (3m+1) / P_succ * s\
    \ + L(3m+1).\nWith the exhaustive-pair search s = Theta(|V|^2) = Theta(9 m^2) and P_succ = Theta(m^2\
    \ / N), the collection term is Theta(m N) -- WORSE than linear in N and increasing in m. With\
    \ the standard quadratic-root search (for each v in V solve the quadratic S_3(v, x2, x_R) = 0\
    \ for x2 and test membership) s = Theta(|V|) = Theta(3m) and the collection term becomes Theta(N\
    \ / 1) -- LINEAR IN N AND INDEPENDENT OF m. THE PRE-REGISTERED STRUCTURAL PREDICTION: total cost\
    \ is flat in m over a wide range once the quadratic-root search is used, and the constant C in\
    \ total = C * N / r is the number this experiment exists to measure. No prior record in this program\
    \ contains it.\n(D) THE THREE OUTCOMES, ALL DELIVERABLES.\n  O1 (expected). Both arms solve, the\
    \ phi arm needs (3m+1)/(m+1) times fewer\n    successful searches, the end-to-end ratio is close\
    \ to that value, and\n    BOTH lose to rho by a factor of order sqrt(N)/(0.886 C / sqrt(6)) --\n\
    \    thousands at 20 bits. The deliverable is the first fully-charged\n    prime-field index-calculus\
    \ cost in this program, with the measured C,\n    and the first end-to-end confirmation that the\
    \ phi-stable base's benefit\n    survives full accounting at exactly the predicted size.\n  O2.\
    \ The phi arm's end-to-end ratio is MATERIALLY BELOW (3m+1)/(m+1) --\n    the unknown reduction\
    \ does not survive accounting, and the cause is\n    locatable in the recorded per-stage timings\
    \ (most likely the\n    lambda-coefficient linear algebra, which is dense over F_N rather than\n\
    \    0/1 sparse). That is a concrete negative about the classical quotient's\n    realisability,\
    \ and it would be new.\n  O3. The phi arm's ratio EXCEEDS (3m+1)/(m+1) by more than the noise\
    \ band.\n    Something is producing more than the accounted saving; the first\n    suspects are\
    \ a lower per-search cost in the phi arm (the membership test\n    can be done on the invariant\
    \ line, one cube instead of three lookups) or\n    an unaccounted density effect. Either is a\
    \ finding and would be routed\n    to a new record rather than absorbed here.\n\n(E) WHAT THIS\
    \ IS NOT. It is not a claim that index calculus is competitive -- claim (C) predicts the opposite\
    \ quantitatively. It is not evidence about H-STR-002 in either direction: no displacement rank\
    \ is measured, no block-circulant structure is constructed, no structured solver is used or priced,\
    \ and the linear algebra is ordinary dense Gaussian elimination over F_N chosen precisely because\
    \ it is the neutral choice."
  resource_label: R1, R2
  admissibility: admissible
  admissibility_argument: 'R1: the pipeline decomposes points by solving polynomial conditions on
    x-coordinates as FIELD ELEMENTS -- a generic-group simulator cannot evaluate S_3 or test membership
    of an x-coordinate in a set, so relation collection is not simulable in the sense of KN-FIND-b7e091.
    R2: the phi-stable base and the invariant-line membership test use the curve equation a = 0. THE
    ONE PLACE ADMISSIBILITY COULD BE QUESTIONED, ADDRESSED DIRECTLY: the orbit closure step (emitting
    phi(R) and phi^2(R)) IS generic-group simulable and is exactly Oracle D of KN-FIND-b7e091 -- which
    is why this proposal charges it as a cost and credits it with ZERO relations (claim (B)), rather
    than counting its output as progress. The saving claimed comes from the unknown count, which is
    a property of the factor base''s construction and not of any oracle call.'
  reachability_gate: 'NOT APPLICABLE TO THE DESIGN: one fixed curve per instance, no isogeny movement,
    so T5 does not bind and no reachability cost is incurred. BINDING ON THE SCOPE via T4, exactly
    as elsewhere in the lane: the phi-stable base requires D_0 = -3, which the isogeny class fixes,
    so a target curve outside that class cannot be moved into it at any cost. The measured constant
    C, however, is a property of prime-field arity-2 index calculus generally and the epsilon = 1
    arm measures it WITHOUT any automorphism -- so that half of the deliverable is not scope-limited
    to CM curves, which is worth recording because it is the more broadly useful number.'
  inputs:
    procedure: 'CHEAPEST VALID DISCRIMINATOR: ONE SOLVE AT 12 BITS, BOTH ARMS. At field_bits = 12
      with N about 3000 and m about 9 (so |V| = 27), the exhaustive search is affordable, the dense
      solve is trivial, and the whole pipeline runs in seconds. If the phi arm does not recover k,
      or does not reach full rank at m + 1 successful searches, the design is wrong and nothing larger
      should be attempted. That single cell tests the entire pipeline including certificates. THEN:
      field_bits in {12, 16, 20}, seeds {1, 2, 3}, both arms plus the forbidden-comparison arm, with
      the quadratic-root search, 20 target streams per cell, archived rho and BSGS at every instance.
      THEN: the m-sweep at the largest affordable field size, m spanning a factor of 8, to test flatness.
      THEN: the epsilon ladder at one instance. THEN: fit C and report the cost table.'
    mechanism: 'STEP 1 -- ROW FORMAT AND lambda. Extend the collection record to (a_t, b_t, [(j_i,
      c_i, eps_i)]) and compute lambda as the root of X^2 + X + 1 mod N matching the chosen zeta_3,
      verified by phi(P) == [lambda] P. HARD GATE, inherited from IDEA-20260807-b42544.

      STEP 2 -- QUADRATIC-ROOT SEARCH, WHICH IS THE COST-DECISIVE CHANGE. Replace the committed exhaustive
      V x V scan (harness/semaev.py::_find_decomposition, which is Theta(|V|^2) per target) with:
      for each v in V, S_3(v, x2, x_R) is a QUADRATIC in x2; solve it over F_p; test whether either
      root lies in V; on a hit, lift and check the point sum. Cost Theta(|V|) per target. This is
      standard and is not claimed as novel; it is stated because the committed instrument''s quadratic
      scan changes the measured exponent of the collection stage from N to m N, and a cost path built
      on it would price the wrong algorithm.

      STEP 3 -- MEMBERSHIP ON THE INVARIANT LINE (phi ARM ONLY). In the phi arm, membership of a candidate
      x in V is decided by testing x^3 in the set of m orbit invariants -- ONE cube and one hash lookup
      -- instead of three lookups for x, zeta x, zeta^2 x. This is valid by IDEA-20260807-4d7e8e and
      is a constant-factor instrument advantage that MUST be measured separately and reported, because
      it is a second, independent source of phi-arm advantage and conflating it with the unknown-count
      quotient would inflate the headline ratio.

      STEP 4 -- SOLVE AND CERTIFY. Accumulate rows until rank m + 1 (phi arm) or 3m + 1 (matched arm)
      over F_N, solve by dense Gaussian elimination, extract k, and emit a certificate {kind: discrete_log,
      statement: {curve, P, Q, k}} which the run wrapper re-verifies by computing [k] P and comparing
      with Q, independently of the solver. Every collected relation additionally carries a decomposition
      certificate re-verified by semaev.verify_decomposition_certificate.

      STEP 5 -- THE BASELINES, ARCHIVED AT THE SAME INSTANCES. Run harness/rho.py on the identical
      instance and record its group operations; run BSGS; and compute the automorphism-discounted
      rho reference 0.886 sqrt(N)/sqrt(6) (KN-TECH-018). All three must be archived AT THE INSTANCES
      CARRYING THE HEADLINE NUMBERS -- the specific defect DEC-20260727-009 R3 names -- not at smaller
      ones.

      STEP 6 -- THE COST TABLE. Report, per (arm, m, instance): targets drawn, S_3 evaluations, successful
      searches, rows emitted, rank curve, linear-algebra field operations, wall time per stage, peak
      memory, and the fully-charged total; plus the three baselines and the ratios. Derive C from
      total = C * N / r and report it with its fit residual.

      STEP 7 -- THE m-SWEEP. Repeat over m spanning at least a factor of 8, to test claim (C)''s flatness
      prediction. Flatness in m is a strong structural check on the whole cost model and costs only
      more cells.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - cardinality-matched random base, |V| = 3m in both arms (blocking)
  - the forbidden unknown-count-matched, cardinality-mismatched arm
  - epsilon orbit-breaking ladder at fixed cardinality
  - anti-null: known-k instance and deliberately rank-deficient system
  - archived rho and BSGS at the headline instances, not only at small ones
  - 'cross-solver agreement: recovered k must equal harness/rho.py''s k on at least one instance per
    field size'
  - certificate re-verification of every relation and of the final k
  - invariant-line membership test measured separately from the unknown-count effect
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. MATCHED NULL: the cardinality-matched
    random factor base, |V| = 3m in BOTH arms, same curve, same target stream (same a_t, b_t seeds),
    same search implementation, same linear-algebra implementation. The ONLY difference is whether
    V is a union of orbits and hence whether the unknown count is m or 3m. THE FORBIDDEN COMPARISON,
    RUN AND REPORTED: a random base of cardinality m (unknown-count-matched, cardinality-mismatched).
    Its per-search success probability is about 9 times lower at arity 2 and it will look terrible;
    reporting it makes the size confound visible as a number rather than available as an argument.
    DECAY PARAMETER: epsilon, the orbit-breaking fraction at fixed cardinality 3m. The end-to-end
    cost ratio must move monotonically from its epsilon = 0 value to 1.00 at epsilon = 1, tracking
    the unknown count (1 - epsilon) m + 3 epsilon m. A ratio flat in epsilon means the advantage is
    not coming from the orbit structure. ANTI-NULL: solve an instance whose k is known by construction
    and confirm the pipeline returns it; and solve one whose relation system is deliberately rank-deficient
    and confirm the pipeline reports failure rather than a wrong k. A pipeline that cannot fail cannot
    be trusted when it succeeds.'
  independent_variables: []
  metrics:
    primary:
    - targets drawn, S_3 evaluations, successful searches, rows emitted
    - rank after each inserted row, per arm
    - linear-algebra field operations and wall time, per arm
    - peak memory, per cell
    secondary:
    - fully-charged total, per arm, per cell
    - archived rho group operations and BSGS cost at the same instance
    - recovered k and its certificate verification result
    - fitted C and its residual
    - m-sweep flatness curve and epsilon ladder curve
  heuristic_under_test: null
  preregistered_prediction:
    quantity: successful searches to full rank, matched arm over phi arm
    formula: '(3m + 1)/(m + 1) exactly, within a band of plus or minus 12 percent over at least 20
      independent target streams. Note this is NOT 3.00 at small m: at m = 16 it is 2.88, at m = 64
      it is 2.97. Pre-registering the m-dependent value rather than the asymptotic 3 is what makes
      the prediction sharp.'
    source: pre-registered in IDEA-20260807-267b95 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - TARGET DEPENDENCE. The committed collector draws targets as consecutive multiples of P, which
    correlates them and biases P_succ. Independent random (a_t, b_t) is mandatory and the change must
    be recorded, since it alters the object of measurement relative to prior runs in this lane.
  - SEARCH IMPLEMENTATION. The exhaustive V x V scan changes the collection exponent from N to m N.
    Which search is used must be stated with every number, and both should be measured at one small
    cell so the difference is quantified rather than argued.
  - TWO SOURCES OF phi-ARM ADVANTAGE. The unknown-count quotient and the cheaper invariant-line membership
    test are independent, and pooling them inflates the headline ratio. STEP 3 measures the membership
    test separately for exactly this reason.
  - DENSE VERSUS SPARSE LINEAR ALGEBRA. The phi arm's rows carry lambda-power coefficients and are
    DENSER in value than the matched arm's 0/1 rows, even though both have the same support size.
    A sparse solver would treat them differently; dense Gaussian elimination is chosen to neutralise
    this, and the choice must be reported because it is also the choice that keeps this record independent
    of H-STR-002's subject matter.
  - SIGN BOOKKEEPING. eps_i is a lift choice; an inconsistent convention produces rows that are wrong
    over F_N while looking right as incidence vectors, and the resulting system will simply fail to
    yield the correct k -- which is why the certificate check is the load-bearing control.
  - RHO VARIANCE. A single rho run has high variance; the baseline must be the median of at least
    10 runs, reported with its spread, or the comparison ratio is noise.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: '(3m + 1)/(m + 1) exactly, within a band of plus or minus 12 percent over at
    least 20 independent target streams. Note this is NOT 3.00 at small m: at m = 16 it is 2.88, at
    m = 64 it is 2.97. Pre-registering the m-dependent value rather than the asymptotic 3 is what
    makes the prediction sharp.'
  falsification_criterion:
  - The phi arm does not recover k, or recovers a k failing [k] P == Q. The pipeline is wrong; nothing
    is reported until repaired; and this is an implementation failure, not evidence about the method
    (AGENTS.md rule 5).
  - Full rank is not reached at m + 1 successful searches in the phi arm. Then either the relations
    are not independent as claim (B) says, or the collection is producing duplicates. The rank curve
    locates which, and the first case would contradict the arithmetic and be a major observation.
  - 'The end-to-end ratio is materially below (3m+1)/(m+1). Outcome O2: the quotient does not survive
    accounting; the per-stage timings must name where it was lost, and the answer is reported even
    if it is unflattering to the classical baseline.'
  - Total cost is strongly m-dependent under the quadratic-root search. The cost model in claim (C)
    is wrong; no C is reported.
  - The linear-in-N fit residual exceeds 20 percent across the field-size ladder. Same disposition.
  - The dense solve exceeds memory at the largest cell. An INFRASTRUCTURE outcome under AGENTS.md
    rule 5, recorded with the memory number, and it caps the reachable field size rather than saying
    anything mathematical.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
