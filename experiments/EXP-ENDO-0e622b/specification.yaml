# EXP-ENDO-0e622b
# Corrected-pricing replication of the combined-route screen (EXP-ENDO-7494e7)
# for H-ENDO-f58749, ordered by DEC-20261016-4f3a1a (replicate). The one-shot
# column now charges the input-format term of CORR-20261016-ac9fc8. Frozen
# before the official run. Modelled counts only.
experiment:
  id: EXP-ENDO-0e622b
  hypothesis_id: H-ENDO-f58749
  source_idea: IDEA-20261016-15a6fc
  question_id: RQ-ENDO-476761
  goal_id: GOAL-ENDO-001
  version: 1
  title: >-
    Combined route (2-GLV on a cheaper-model isogenous neighbour) against GLV
    on E, re-run with the one-shot input-format term of CORR-20261016-ac9fc8
    charged
  status: approved
  frozen: true
  designed_at: '2026-10-16'
  approved_by: coordinator
  approval_decision_id: DEC-20261016-77dce3
  approval_basis: >-
    The standing user authorization in AGENTS.md (2026-09-06, "all is
    approved. ideas/experiments should be always approved").
  execution_authorized: true
  claim_tier: modelled
  replicates: EXP-ENDO-7494e7 / RUN-ENDO-795989 (EV-ENDO-7628a0)
  links:
    ordering_decision: DEC-20261016-4f3a1a
    correction: CORR-20261016-ac9fc8
    prior_evidence: EV-ENDO-7628a0
    prior_experiment: EXP-ENDO-7494e7
    prior_run: RUN-ENDO-795989
    derivation: experiments/EXP-ENDO-7494e7/validation/TASK-20261016-35d324.md (section A4)
  objective: >-
    Run harness/endosweep/isoglv.py once, with the frozen arguments of
    EXP-ENDO-7494e7, over the same seven RUN-ENDO-d7cb69 population curves and
    the same two controls, now that the one-shot combined cost charges the
    input-format term (combined.input_format). Turn the validator's written
    correction of RUN-ENDO-795989 into an executed run record, and check that
    nothing else in the run moved.
  motivation: >-
    DEC-20261016-4f3a1a found the frozen success criterion of H-ENDO-f58749 met
    on RUN-ENDO-795989 and still met under CORR-20261016-ac9fc8, but declined
    support because the deciding one-shot column is under-charged and its
    corrected signs rest on a written derivation (TASK-20261016-35d324, A4),
    not on an executed instrument. The defect: the route hands the
    neighbour's chain endomorphism a Jacobian point Q = phi(P), but isoglv
    priced its first step with the affine-input shortcut. The fix,
    isoglv.input_format_cost(order, path), charges the cheaper of (a) the
    chain on the Jacobian input and (b) E's chain on the affine P plus one
    more forward pass, stores it as combined.input_format, and adds it to both
    one-shot gains. The timed bench of the combined route freezes its
    prediction from these corrected figures, which is why this re-run ranks
    first.
  inputs:
    population: >-
      The rows of the source run with role population and
      best.persistent_gain > 0, selected by isoglv.py: other/Tom-384,
      mnt/mnt5/2, mnt/mnt5/3, other/BADA55-VPR-224, mnt/mnt3/1, mnt/mnt3/3
      and GOST 2001 test curve. The two controls are added with --include.
      check.py requires exactly these nine names. Identical to EXP-ENDO-7494e7.
    source_rows:
      path: experiments/EXP-ENDO-25ad84/runs/RUN-ENDO-d7cb69/raw-result.json
      sha256: 0576225d496168485a8c30d5d460edab1ab969e7cd3a4d7850e43406a65282da
      note: run.py refuses to launch if the digest differs.
    no_glv_arm:
      - name: other/BADA55-VPR-224
        reason: >-
          |D_K| > 2e6 (research/endosweep_curves_20261006/curves.md). There
          is no chain endomorphism to price, so it gets no glv_on_E or
          combined arm and its model change stands alone. It is not counted
          for or against arm G.
    instrument: harness/endosweep/isoglv.py (with input_format_cost)
    unit_tests: tests/test_isoglv.py
    frozen_arguments: >-
      --rows experiments/EXP-ENDO-25ad84/runs/RUN-ENDO-d7cb69/raw-result.json
      --ells 2,3,5,7,11,13 --depth 2 --max-nodes 64 --disc-bound 2000000
      --build-limit 3 --build-seconds 900 --max-candidates 12
      --verify-scalars 8 --seed 20261016
      --include "control+ascent: 11-descendant of a j = 0 curve (256-bit),mnt/mnt5/1"
    named_future_run_slot: RUN-ENDO-f461e9
    difference_from_EXP-ENDO-7494e7: >-
      Only the experiment and run ids in run.py, one added check in check.py
      (every combined route must carry the input_format term), and
      isoglv.input_format_cost with its use in both one-shot gains. Arguments,
      seed, source rows, curve set, controls and cost model are unchanged.
  arms:
    glv_on_E: curvesweep.sweep_curve on E with D = D_K (re-run here, not copied).
    model_change: The RUN-ENDO-d7cb69 best route, copied and not recomputed.
    combined: >-
      curvesweep.sweep_curve on the first neighbour, in order of increasing
      conversion cost, whose short-Weierstrass class is cheaper than E's and
      on which the cheapest chain element builds and passes curvesweep's
      GLV-2 point check. The route E -> E' -> E is verified on 8 scalars
      (isomodel.verify_route). The forward chain, the dual chain, the scalar
      adjustment and, new in this contract, the input-format term
      combined.input_format.M_eq are charged in the one-shot column.
    cost_model: curvesweep M_eq = M + S, that is S = 1 M, for all three arms.
    input_format_term: >-
      isoglv.input_format_cost(order, path): 0 for a unit endomorphism (empty
      chain order); otherwise min(jac, via_e), where jac is the chain's first
      step on a Jacobian input minus its affine-input price and via_e is one
      more forward pass along the path (Jacobian steps plus the tail). Unit
      tests (tests/test_isoglv.py) pin it to the A4 derivation: +29 for orders
      [7, 5] and [7, 5, 5]; +32 for [11, 5] and [11, 3, 7], whose alternative
      is +47; 0 for a unit endomorphism.
  controls:
    - id: control+ascent
      role: positive
      rule: >-
        The row "control+ascent: 11-descendant of a j = 0 curve (256-bit)" of
        RUN-ENDO-d7cb69. This is a 256-bit curve one descending degree-11
        step below a j = 0 crater.
      required: >-
        D_K = -3 is reported. The combined route is non-null and its node is
        the j = 0 crater, so the walk reached it and the unit GLV is priced.
        combined.route_verification.ok is true on 8 scalars, and
        combined_vs_E_model_baseline.oneshot_gain > 0.
    - id: control-/mnt/mnt5/1
      role: negative
      rule: >-
        mnt/mnt5/1, which is already isomorphic to an a = -3 model (curves.md:
        "-3/a is a fourth power"). No neighbour can be in a cheaper class.
      required: >-
        candidates_cheaper_class = 0 and combined is null. No combined_vs_*
        figure is emitted for this row.
    - id: route_verification
      rule: Every combined route is checked by k*P computed both ways on 8 scalars.
      required: >-
        route_verification.ok is true. One mismatch voids that route (see the
        invalidation rules).
    - id: input_format_present
      rule: Every non-null combined route carries combined.input_format (check.py).
      required: >-
        check.py exits 0. A combined route without the term makes the run
        invalid, because its one-shot figures would repeat the defect of
        CORR-20261016-ac9fc8.
  independent_variables:
    - curve (the seven population curves and the two controls)
    - isogeny path to the neighbour (ell in {2,3,5,7,11,13}, depth <= 2, <= 64 nodes per curve)
    - candidate order (increasing conversion cost; at most 12 cheaper-class candidates)
  metrics:
    primary:
      - per curve, combined_vs_glv_on_E persistent_gain and oneshot_gain (oneshot with input_format charged)
      - per curve, combined.input_format M_eq and route
      - per curve, model_change_vs_glv_on_E persistent_gain and oneshot_gain
      - per curve, combined_vs_E_model_baseline persistent_gain and oneshot_gain
      - route verification pass or fail, on 8 scalars, for every combined route
      - >-
        count of population curves with a GLV arm that have a combined route,
        and with combined_vs_glv_on_E oneshot_gain > 0
      - >-
        per curve, agreement with RUN-ENDO-795989 of every non-timing field
        that the input-format term does not enter (combined node, persistent
        gains, model_change_vs_glv_on_E)
    secondary:
      - >-
        per curve, candidates_cheaper_class and every attempt: path, j,
        arithmetic, conversion_M_eq, glv.ok, built, verified, best_element,
        note and seconds
      - >-
        chain build failures by edge path, recorded as observations of the
        edge type. They are not negative evidence about End(E') unless a
        conductor certificate is archived.
      - D_K and f_pi per curve as isoglv.py reports them
      - rows_with_error, by name
  heuristic_under_test: null
  preregistered_prediction:
    stated_before_data: true
    quantity: >-
      combined_vs_glv_on_E (persistent and one-shot), combined.input_format.M_eq
      and the combined node (path, j) on each population curve with a GLV arm,
      and the two controls.
    basis: >-
      isoglv is deterministic at the frozen seed apart from the pricing fix,
      which touches only the one-shot columns. So every field outside the
      one-shot columns is predicted to equal RUN-ENDO-795989, and the one-shot
      columns are predicted to equal the validator's corrected values
      (TASK-20261016-35d324 A4; CORR-20261016-ac9fc8 item C1), computed as
      1 - (glv_M_eq on E' + conversion_M_eq + input_format_M_eq) / glv_M_eq on
      E from the M_eq values recorded in RUN-ENDO-795989.
    persistent_combined_vs_glv_on_E:
      tolerance: exact (equal to the RUN-ENDO-795989 value)
      GOST 2001 test curve: 0.05955   # +5.955 %
      mnt/mnt3/1: 0.11033             # +11.033 %
      mnt/mnt3/3: 0.11033
      mnt/mnt5/2: 0.11302             # +11.302 %
      mnt/mnt5/3: 0.11302
      other/Tom-384: 0.11844          # +11.844 %
    oneshot_combined_vs_glv_on_E:
      tolerance: plus or minus 0.02 percentage points
      GOST 2001 test curve: '+2.20 %'   # 1 - (2005.5 + 48 + 32) / 2132.5
      mnt/mnt3/1: '+5.78 %'             # 1 - (1304.7 + 48 + 29) / 1466.5
      mnt/mnt3/3: '+5.78 %'
      mnt/mnt5/2: '+7.55 %'             # 1 - (1890.5 + 48 + 32) / 2131.4
      mnt/mnt5/3: '+7.55 %'
      other/Tom-384: '+9.46 %'          # 1 - (2850.8 + 48 + 29) / 3233.8
    input_format_M_eq:
      GOST 2001 test curve: 32     # order [11, 3, 7]: min(47, 32), via E then forward
      mnt/mnt3/1: 29               # order [7, 5]: min(29, 32), chain on the Jacobian input
      mnt/mnt3/3: 29
      mnt/mnt5/2: 32               # order [11, 5]: min(47, 32), via E then forward
      mnt/mnt5/3: 32
      other/Tom-384: 29            # order [7, 5, 5]: min(29, 32), chain on the Jacobian input
      control+ascent: 0            # unit endomorphism (x, y) -> (beta x, y)
    combined_node:
      note: >-
        The same combined path and j as RUN-ENDO-795989 on every curve, copied
        from experiments/EXP-ENDO-7494e7/runs/RUN-ENDO-795989/raw-result.json.
      GOST 2001 test curve: {path: [5], j: '0x5949b00f4ae6acf1741b2d012f7e8db3580384a388ac881ab190d3e05c7b73ed'}
      mnt/mnt3/1: {path: [5], j: '0x2b3a2d8c94d55848be35c450485ff650af783b30'}
      mnt/mnt3/3: {path: [5], j: '0x2b3a2d8c94d55848be35c450485ff650af783b30'}
      mnt/mnt5/2: {path: [5], j: '0x3fca9c57bdeef74482b853d8169c9ae5850fb527bb7e2bfff48f1ff62e48'}
      mnt/mnt5/3: {path: [5], j: '0x3fca9c57bdeef74482b853d8169c9ae5850fb527bb7e2bfff48f1ff62e48'}
      other/Tom-384: {path: [5], j: '0x1f7289da0e35b975e08538ba4900775caef516cb2118cc2c3ef45a5c1b53ce7e6a9e9f4a26302b5b885af1947308e2dc'}
      "control+ascent: 11-descendant of a j = 0 curve (256-bit)": {path: [11], j: '0x0'}
      mnt/mnt5/1: null   # no combined route
    controls: >-
      control+ascent passes as before, and its combined_vs_E_model_baseline
      oneshot_gain is unchanged at +32.57 % (0.32566), because the unit GLV
      has input_format 0. mnt/mnt5/1 still has candidates_cheaper_class = 0
      and combined null.
    secondary_expectation: >-
      combined_vs_E_model_baseline oneshot_gain on the population rows
      approximately GOST 0.3193, mnt3 0.3432, mnt5 0.3693, Tom-384 0.4061
      (CORR-20261016-ac9fc8 item C2, Coordinator arithmetic, not gating), and
      model_change_vs_glv_on_E and combined_vs_E_model_baseline
      persistent_gain equal to RUN-ENDO-795989.
    source: >-
      Coordinator, written into this contract before the official run. The
      values come from the validator's A4 derivation and the M_eq values of
      RUN-ENDO-795989, which were observed before this contract; this is a
      replication, so the prediction is a reproduction check and not a blind
      forecast (see development_disclosure).
  instrument_alert: >-
    Any persistent value or combined node (path, j) differing from
    RUN-ENDO-795989, or any one-shot combined_vs_glv_on_E value outside plus
    or minus 0.02 percentage points of the prediction, or any input_format
    M_eq differing from the prediction, is an instrument alert. It is not
    hypothesis evidence in either direction; the reviewer resolves it before
    any decision uses the run.
  scale_relevance:
    tier: crypto
    justification: >-
      The curves are deployed or published curves of 160 to 384 bits plus a
      256-bit constructed control. The results are modelled counts in
      curvesweep's M_eq model. Nothing transfers to wall-clock time or to
      other formula families.
    correspondence: null
  tail_checks:
    - Every combined route is checked by k*P computed both ways. One mismatch voids that route.
    - Every chain element priced on a neighbour must pass curvesweep's GLV-2 check on points (glv.verified).
    - Every combined route carries combined.input_format (check.py).
    - >-
      glv_on_E ratios are compared descriptively with curves.md. A
      disagreement is recorded and explained in review. It does not void the
      run.
  replication:
    seeds: [20261016]
    independent_instances: 1
    named_future_run_slot: RUN-ENDO-f461e9
    replication_note: >-
      This is the replication ordered by DEC-20261016-4f3a1a: one
      deterministic pass at the same seed and bounds as RUN-ENDO-795989, with
      the pricing correction. Variation of the seed, the bounds or the
      candidate cap is not part of this contract.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 10800
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one manifest for RUN-ENDO-f461e9.
    - Do not change an argument, a seed, the source rows, the curve set or the cost model, and do not run a second pass.
    - Do not drop a row or an attempt. A per-curve exception stays recorded as an error row.
  invalidation_rules:
    - >-
      A failed control makes the combined arm indeterminate. control+ascent
      guards the positive leg and control-/mnt/mnt5/1 guards against an
      invented candidate. This is an instrument alert, not evidence. No
      post-hoc relaxation of a control is allowed.
    - >-
      A combined route that fails verification is void and is not counted as
      a gain. It is reported as an instrument alert.
    - >-
      If check.py fails (a missing artifact, a digest mismatch, a row set
      other than the nine frozen names, rows.jsonl disagreeing with
      raw-result.json, a changed frozen parameter, or a combined route
      without the input_format term), the run is invalid. If run.py refuses
      to launch because the source rows changed, the run is invalid.
    - >-
      A timeout, a crash or a memory abort is failed_infrastructure. It is
      never a negative result.
    - >-
      An error row for a population curve means that curve is unscreened. It
      is not a zero gain.
    - >-
      An attempt that ends in a build-time limit or an error is unresolved
      for that candidate. A curve with no success and any unresolved attempt
      is unresolved, not non-composing.
    - >-
      A chain build failure on a neighbour is an observation of that edge.
      It is never negative evidence about End(E') without an archived
      conductor certificate.
  success_criterion: >-
    Unchanged from the frozen EXP-ENDO-7494e7 contract. The run is valid,
    both controls pass, and at least one population curve with a GLV arm has
    a verified combined route with combined_vs_glv_on_E oneshot_gain > 0 at
    S = 1 M, the one-shot gain now charging the input-format term.
  falsification_criterion: >-
    Unchanged from the frozen EXP-ENDO-7494e7 contract. The run is valid and
    both controls pass, but every resolved population curve with a GLV arm
    has either no combined route or combined_vs_glv_on_E oneshot_gain <= 0
    at S = 1 M (that is, every corrected one-shot gain is at most 0). Arm G
    is then rejected for one-shot k*P in this scope. For the corollary, any
    verified model_change_vs_glv_on_E oneshot_gain > 0 falsifies it.
  decision_impact:
    on_positive: >-
      If the success criterion is met and the prediction holds exactly (no
      instrument alert), the replicate condition of DEC-20261016-4f3a1a is
      satisfied and the evidence review may move H-ENDO-f58749 toward
      support at the modelled tier, scoped to the four isogeny classes. If it
      is met with an instrument alert, the reviewer resolves the alert first.
      Either way, make no speed claim and no ECDLP claim.
    on_negative: >-
      If every corrected one-shot gain is at most 0, arm G is rejected for
      one-shot k*P in this scope, and the persistent rows are reported
      separately. This would contradict the validator's derivation and is
      reviewed as such before any adverse transition.
    on_unresolved: >-
      Curves left unresolved by build-time limits or error rows are reported
      as infrastructure outcomes. A rerun at a larger build_seconds needs a
      new contract.
    next_either_way: >-
      The timed bench of the combined route against GLV on E (other/Tom-384
      first) is the next item in either case, with its prediction frozen
      from this run's corrected modelled figures.
  development_disclosure: >-
    The fix was derived by the independent validator (TASK-20261016-35d324,
    joint A4) and implemented in harness/endosweep/isoglv.py after
    RUN-ENDO-795989, and every predicted value above comes from that
    derivation and the recorded M_eq values of RUN-ENDO-795989. The
    input_format_cost code has executed only in tests/test_isoglv.py before
    this contract was frozen; the rest of isoglv.py ran in RUN-ENDO-795989
    and in the development smoke run disclosed by EXP-ENDO-7494e7. No run of
    this experiment's launcher preceded freezing.
  instrument_limits:
    - The model_change arm is copied from RUN-ENDO-d7cb69 (isomodel, 200 sampled scalars). It is not recomputed.
    - Only short-Weierstrass classes cheaper than E's are candidates. Edwards and Montgomery neighbour models are not tried for the combined arm.
    - At most build_limit = 3 chain elements per sweep and build_seconds = 900 per build. Only the first 12 cheaper-class candidates by conversion cost are tried, and the first success stops the search.
    - Route verification uses affine kernel-polynomial Velu (isomodel.verify_route). Conversion is charged with isomodel.conversion_cost for the Weierstrass target.
    - >-
      The input-format term is the cheaper of two evaluations in the same
      operation-count model; alternative (b) relies on the isogeny being
      horizontal and commuting with the CM action, which the validator
      verified on these crater curves (A3) and this run does not re-certify.
      Normalising Q to affine (about 1.5 log2 p M_eq) is not priced.
    - D_K is certified up to |D_K| <= 2e6. f_E is not certified, so no edge is classified horizontal or vertical by this run.
    - The six population positives are four isogeny classes (mnt3/1 with mnt3/3, mnt5/2 with mnt5/3); per-class, not per-curve, counts carry the evidence.
    - The worst case of 9 curves x 13 sweeps x build_seconds can exceed the 3 h watchdog. Expiry is failed_infrastructure.
  required_artifacts:
    - experiments/EXP-ENDO-0e622b/runs/RUN-ENDO-f461e9/manifest.yaml
    - experiments/EXP-ENDO-0e622b/runs/RUN-ENDO-f461e9/raw-result.json
    - experiments/EXP-ENDO-0e622b/runs/RUN-ENDO-f461e9/rows.jsonl
    - experiments/EXP-ENDO-0e622b/runs/RUN-ENDO-f461e9/stdout.log
    - experiments/EXP-ENDO-0e622b/runs/RUN-ENDO-f461e9/stderr.log
  assigned_to: executor
  launcher:
    trial_plan: experiments/EXP-ENDO-0e622b/trial-plan.json
    driver: experiments/EXP-ENDO-0e622b/implementation/run.py
    checker: experiments/EXP-ENDO-0e622b/implementation/check.py
  out_of_scope:
    - Timings, fixed-base k*P, precomputed windows, constant-time complete formulas, and binary or extension fields.
    - Any ECDLP, rho or exponent statement.
    - Any statement about End(E') or the conductor of a neighbour.
    - Validation of the idea's heuristics H1-H3.
    - Any edit of RUN-ENDO-795989, the EXP-ENDO-7494e7 specification or CORR-20261016-ac9fc8.
