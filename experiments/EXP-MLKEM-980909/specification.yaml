experiment:
  id: EXP-MLKEM-980909
  hypothesis_id: H-MLKEM-7d9bcc
  version: 1
  title: >-
    Fixed-cap RT-CTRL-1 100-bit BKZ tour with independent terminal telemetry
  status: approved
  frozen: true
  execution_authorized: true
  approved_by: DEC-20260831-dfa5a6
  objective: >-
    Observe exactly one full BKZ tour attempt at d=512, beta=55, q=3329,
    MPFR=100, and the pre-existing deterministic seed formula, while retaining
    a durable terminal lifecycle record under the unchanged 21600-second cap.
    The observation may measure only its stated toy instrument scope.
  inputs:
    worker: coordination/goals/GOAL-MLKEM-005/batches/BATCH-266fa2/tasks/TASK-20260831-66f15c/rt_ctrl_1_target.py
    supervisor: coordination/goals/GOAL-MLKEM-005/batches/BATCH-266fa2/tasks/TASK-20260831-66f15c/rt_ctrl_1_supervisor.py
    strategy_sha256: f516b0a6f0c580cff72e1e2c3562c44dc6f17e8f99613e9e4020e35481b27a18
    seed_formula: default_rng([715923,0,512,55,0,0]).integers(0,2**31-1)
  controls:
    - Controlled SIGTERM self-test with no BKZ, independently verified before target launch.
    - Manifest/noninterference check covering d, beta, MPFR bits, seed formula, strategy hash, and cap.
  independent_variables: []
  metrics:
    primary:
      - terminal cause and elapsed seconds
      - last durable worker stage
      - CPU user/system seconds and RSS samples
      - terminal telemetry receipt verification
    secondary:
      - worker status, error string, BKZ elapsed seconds, tours when the worker returns
  heuristic_under_test: null
  preregistered_prediction:
    quantity: run lifecycle outcome
    formula: null
    source: DEC-20260815-3e8e9c and BATCH-f9780d red-team operational repair request
  scale_relevance:
    tier: toy
    justification: >-
      This is one random q-ary basis at d=512,beta=55 under fpylll 0.6.4 on
      one host. It makes no claim about FIPS 203, ML-KEM parameters, attack
      costs, or key recovery.
    correspondence: null
  tail_checks: []
  replication:
    seeds: [452658293]
    independent_instances: 1
  budget:
    wall_clock_seconds_per_run: 21600
    total_cpu_hours: 6.0
    maximum_memory_gb: 16
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop exactly at 21600 seconds inclusive of telemetry; the supervisor records a terminal receipt then sends SIGTERM.
    - Stop without retuning after a terminal worker completion or recorded exception.
  invalidation_rules:
    - Invalidate interpretation if the worker/strategy hashes, seed formula, d, beta, MPFR bits, or cap differ from the frozen manifest.
    - Invalidate terminal telemetry if the independent verifier rejects its manifest or event chain.
  success_criterion: >-
    The producer completion gate is satisfied when one terminal lifecycle
    receipt and all declared artifacts exist. A completed BKZ return is an
    observation, not experiment success in a cryptanalytic sense.
  falsification_criterion: >-
    The telemetry mechanism is invalid if its pre-target controlled SIGTERM
    self-test or independent verifier fails. A timeout or process termination
    does not falsify any mathematical hypothesis.
  required_artifacts:
    - target_manifest.json
    - events.jsonl
    - worker_state.json
    - worker_result.json when worker returns
    - terminal_receipt.json
    - stdout.log
    - stderr.log
    - execution_report.md
    - environment.json
  assigned_to: executor
