experiment:
  id: EXP-FRODO-02bbaa
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-FRODO-8ea540
  question_id: RQ-FRODO-3260cc
  goal_id: GOAL-FRODO-001
  batch_id: null
  title: >-
    Review-required design: exact-rational recomputation of FrodoKEM's Renyi
    divergence, inversion of the published order for the sample budget it
    corresponds to, and an explicit-quantifier audit of the
    divergence-to-bit-security conversion

  objective: >-
    If separately approved, frozen and authorized: (1) reproduce the
    divergence-to-bit-security conversion symbolically from first principles rather
    than from a citation; (2) recompute R_a(chi||psi) in exact rational arithmetic
    at the printed order for each of Frodo-640/976/1344 and compare it to the
    printed figure under both candidate readings; (3) invert the printed order for
    the sample count it is optimal at and compare that to the scheme's actual chi
    sample count; (4) emit the sample-count sensitivity curve; and (5) record, with
    a quoted sentence, where the primary text binds the sample count relative to the
    adversary's target count. This is an instrument-and-audit design proposal. No
    run has happened, no primary text has been read, and nothing here is evidence.

  source_gate:
    status: SHUT
    rule: >-
      RQ-FRODO-3260cc.constraints[0] forbids designing an experiment for execution
      before the FrodoKEM specification and the primary Renyi-divergence analysis
      are filed as KN-LIT entries at stated provenance levels with extraction damage
      marked, and GOAL-FRODO-001.next_action repeats it in stronger terms. THIS
      CONTRACT IS A DESIGN, NOT AN AUTHORIZATION. Stages 1 and 2 below are
      deliberately SOURCE-FREE so that the instrument can be built and validated
      while the gate is shut; Stages 3 and 4 consume FrodoKEM figures and MAY NOT
      EXECUTE until the filing is committed.
    prerequisite_deliverables:
      - KN-LIT entry for the FrodoKEM specification or standard proposal, provenance level stated, extraction damage marked
      - KN-LIT entry for the primary Renyi-divergence analysis, or a recorded statement that it could not be obtained
      - a transcription of the sampling table, the Renyi order, the divergence, the target security level and the sample structure, each with a section or page reference and a numbered assumption list

  what_this_is_not:
    - Not an attack, not a break, not a statement about deployed FrodoKEM, and not a claim that any published figure is wrong.
    - Not an estimate of LWE hardness at Frodo's dimensions, and not a derivation of any sieve, BKZ or core-SVP cost. That lane belongs to GOAL-MLKEM-003 and GOAL-MLKEM-004 (GOAL-FRODO-001.non_duplication); a stage that finds itself there has left the lane and must hand off.
    - Not an analysis of any FrodoKEM implementation, timing channel, or fault behaviour (KN-LIT-2088, KN-LIT-3859, KN-LIT-118, KN-TECH-047 are out of scope by RQ-FRODO-3260cc.constraints).
    - Not a decryption-failure-rate computation; that is EXP-FRODO-60fd9d's.
    - Not a verification of FrodoKEM's security proof. Reproducing a printed number verifies an arithmetic assertion and nothing else.
    - Not an approval, a freeze, an execution authorization, a run, an observation, or evidence.

  claim_ceiling:
    tier: crypto_for_arithmetic_only
    arithmetic_scope: >-
      CRYPTO tier is available for exactly one class of statement: that an
      independently recomputed exact-rational R_a(chi||psi), at the order the
      document prints, at the standardised parameter sets Frodo-640/976/1344, equals
      or differs from the printed figure, with the difference's size. This is
      reachable at crypto tier because the computation is finite AT the real
      parameters -- a sum over at most 25 support points -- and uses no
      extrapolation heuristic. That is unusual for this program and is the reason
      RQ-FRODO-3260cc was selected.
    security_scope: >-
      TOY tier, without exception, for every bit-security statement produced here,
      including T1, T2, the total loss, the recovered sample budget N*, and every
      sample-count threshold. Per RQ-FRODO-3260cc.scope.claim_tier_ceiling: a
      discrepancy in a divergence is NOT an attack and neither outcome is evidence
      about the hardness of LWE at Frodo's dimensions. A run that records both
      classes at one tier has failed regardless of what it computed
      (GOAL-FRODO-001.next_action).

  inputs:
    parameter_sets: [Frodo-640, Frodo-976, Frodo-1344]
    to_be_read_from_primary_text:
      - the sampling table per parameter set, and the normalisation convention (see EXP-FRODO-60fd9d stage 1)
      - the ideal distribution psi -- ROUNDED Gaussian or DISCRETE Gaussian, which are different distributions, with its parameter
      - the Renyi order a per parameter set
      - the printed divergence per parameter set, and whether it denotes R_a, R_a - 1, ln R_a or log2 R_a
      - the target security level lambda per parameter set
      - the sample structure: which chi samples the divergence argument charges, and how many
      - the sentence stating the conversion, with its quantifiers
    provisional_values_for_design_only:
      note: >-
        EVERY VALUE IN THIS BLOCK IS EITHER RECALLED FROM MODEL MEMORY OR READ FROM
        THE EXTRACTION-DAMAGED EXCERPT QUOTED IN RQ-FRODO-3260cc.provenance. NONE IS
        A VALUE THIS PROGRAM HAS ESTABLISHED. They appear here so the design is
        concrete and so a reviewer can check the arithmetic; they are OVERWRITTEN by
        the Stage 0 transcription and are never used in a reported result.
      excerpt_orders: [200, 500, 1000]
      excerpt_divergences: ["0.324e-4", "0.140e-4", "0.264e-4"]
      recalled_security_levels: [143, 209, 274]
      recalled_sample_counts: [20544, 31296, 43072]
      recalled_sample_count_formula: "2*n*nbar + 2*nbar*n + nbar*nbar with nbar = 8"
    order_grid_multipliers: [0.125, 0.25, 0.5, 1, 2, 4, 8]
    sample_count_multipliers: [0.25, 0.5, 1, 2, 4, 16, 256]
    target_counts_for_quantifier_table: [1, 256, 65536, 1048576, 4294967296]
    arithmetic: "fractions.Fraction throughout; no floating point in any reported quantity; floats permitted only in a clearly labelled human-readable column"
    master_seed: 3260601
    domain: "EXP-FRODO-02bbaa/v1"
    seed_derivation_rule: >-
      Only the Bernoulli fixture arm consumes randomness. A draw uses
      SHA-256 over the ASCII bytes of domain || "|" || arm_label || "|" ||
      decimal(parameter_set_index) || "|" || decimal(counter), interpreted
      big-endian unsigned; rational fixtures take p = 1 + (digest mod 998) over
      1000 and q = 1 + (digest2 mod 998) over 1000 so both lie strictly inside
      (0,1) and the divergence is finite. Counter starts at 0 and advances once per
      digest. This rule reproduces every instance bit for bit from the master seed
      alone.

  arms_and_controls:
    treatment: >-
      Exact-rational R_a(chi||psi) at the printed order, per parameter set, compared
      to the printed figure under both readings; the loss decomposition; the
      inversion for N*; the sensitivity table.
    measured_null_1: >-
      BERNOULLI FIXTURE. P = (p, 1-p), Q = (q, 1-q) for rational p, q from the seed
      rule. FORCED VALUE, derived pre-run:
      R_a(P||Q)^{a-1} = p^a q^{1-a} + (1-p)^a (1-q)^{1-a}, computed by an
      independent code path from the pipeline's. The pipeline must return it EXACTLY
      as a Fraction at every tested order. CAN FAIL. Twenty instances.
    measured_null_2: >-
      IDENTICAL-DISTRIBUTION SMOKE TEST. P = Q. FORCED VALUE R_a = 1 exactly at
      every order. DECLARED EXPLICITLY AS A CONTROL A CORRECT IMPLEMENTATION CANNOT
      FAIL, therefore counted as a smoke test and NOT as a sensitivity
      demonstration -- the failure mode KN-TECH-1a5b7e names, recorded rather than
      committed.
    positive_control: >-
      PERTURBED-TABLE SENSITIVITY, THRESHOLD DECLARED BEFORE THE RUN. Take the filed
      table, move u units of mass between two cells so that the second moment
      changes by 1 part in 1e4, and recompute R_a at the printed order. THE
      RECOMPUTED R_a - 1 MUST CHANGE BY AT LEAST 1 PART IN 1e3 OF ITS OWN VALUE. IF
      IT DOES NOT, THE PIPELINE CANNOT DETECT A DISCREPANCY OF THE SIZE BEING LOOKED
      FOR, AND NO AGREEMENT WITH THE PRINTED FIGURE MAY BE REPORTED AS A
      VERIFICATION. This is RQ-FRODO-3260cc.constraints's mutation requirement
      applied to the divergence side, where the question record states it only for
      the table side.
    graded_control: >-
      ORDER SWEEP, SEVEN POINTS, MONOTONICITY AND LINEARITY REPORTED. R_a at the
      seven order multipliers. Report (i) monotonicity in a, which is forced by
      theorem and whose violation is a pipeline bug rather than a FrodoKEM finding,
      and (ii) the residual of a linear fit of log2 R_a against a, which is the
      approximation HEUR-FR-2 rests on. Report the residual as a number.
    nearby_object_control: >-
      DE-TUNED ORDER. Compute the balance ratio T2/T1 at a/8 and 8a. FORCED: the
      ratio scales as a^2, so an eightfold change moves it by 64 and it must land
      outside the [1/3, 3] band at both de-tuned orders. IF THE DIAGNOSTIC REPORTS
      "TUNED" AT A DELIBERATELY DE-TUNED ORDER, it is not measuring tuning, and the
      budget-recovery results (G3, G4 of H-FRODO-8ea540) are void.
    ordering_control: >-
      The null arms, the positive control, the graded sweep and the de-tuned control
      are computed and their results hash-committed BEFORE the printed FrodoKEM
      divergence is read into the comparison. The decision rule is executed on the
      perturbed table before the unperturbed one. Absence of that commitment is
      invalid_measurement.
    comparability_policy: >-
      No result from this contract may be compared to any other experiment's without
      a separately registered comparator contract naming both domains, both seed
      rules, and the comparison statistic. In particular, results here may not be
      combined with EXP-FRODO-60fd9d's failure-rate results into a single security
      statement: the two are at different tiers and a combined statement would be a
      tier violation.

  procedure:
    stage_0_source_gate:
      cost: reading, zero compute
      content: >-
        Acquire and file the primary sources; transcribe every quantity in
        inputs.to_be_read_from_primary_text with a reference; twice, independently,
        and diff the two transcriptions. A transcription that does not survive its
        own diff does not reach Stage 3.
      terminates_run: >-
        Yes, by pause. If the sources cannot be obtained after the declared
        source-preference order is exhausted, the run halts and reports the
        acquisition failure as an infrastructure and access outcome
        (GOAL-FRODO-001.pause_conditions), NEVER as evidence about any FrodoKEM
        quantity.
    stage_1_symbolic:
      cost: "<= 3600 s wall clock, zero compute, SOURCE-FREE"
      content: >-
        Reproduce the probability-preservation inequality from Holder rather than
        citing it; reproduce multiplicativity from the product form; derive
        lambda' = ((a-1)/a)(lambda - N log2 R_a), the T1/T2 decomposition with the
        cross term kept explicit, the optimum a* and the inversion N*. Then attempt
        to locate a primary source for both properties and record its exact
        statement, or record that it could not be obtained.
      terminates_run: >-
        YES, AND THIS IS THE CHEAPEST DECISIVE GATE IN THE CONTRACT. If the Holder
        derivation does not reproduce the inequality in the form used, the whole
        conversion as stated in H-FRODO-8ea540 is wrong and the run halts with that
        as its result. Cost of finding out: one hour of algebra.
    stage_2_instrument:
      cost: "<= 600 s, SOURCE-FREE"
      content: >-
        Implement R_a in exact rational arithmetic; run measured_null_1 and
        measured_null_2; verify multiplicativity numerically for N = 2, 3, 4 by
        direct computation over the product space; verify monotonicity in a on the
        seven-point grid.
      terminates_run: >-
        Yes. Any Bernoulli-fixture inequality, any multiplicativity failure, or any
        monotonicity violation halts the run and reports a pipeline defect.
    stage_3_recomputation:
      cost: "<= 600 s, REQUIRES STAGE 0"
      content: >-
        Recompute R_a from the filed table against the filed psi at the printed
        order; run the positive control and the graded sweep; compare to the printed
        figure under both readings; apply the frozen decision rule; invert for N*;
        emit the sensitivity table over the sample-count multipliers and the
        target-count table.
      terminates_run: no
    stage_4_quantifier:
      cost: reading, zero compute
      content: >-
        Write the document's conversion sentence out with explicit quantifiers,
        quote it with a section reference, and determine whether the sample count is
        bound before or after the adversary's target count. If the document is
        silent, RECORD SILENCE -- silence is the finding, not permission to assume
        the favourable reading.
      terminates_run: no

  metrics:
    primary:
      - "R_a(chi||psi) at the printed order, per parameter set, as an exact Fraction"
      - "relative difference between the recomputed value and the printed figure, under each of the two readings"
      - "T1 = lambda/a, T2 = N log2 R_a, the cross term, and the total loss, in bits, per parameter set"
      - "balance ratio T2/T1 per parameter set, against the pre-frozen band [1/3, 3]"
      - "N* = lambda/(c a^2), the recovered sample budget, against the sample count read from the specification"
      - "the quantifier statement, quoted, with a section reference, or a recorded silence"
    secondary:
      - "monotonicity check across the seven-order grid: number of violations (forced to 0)"
      - "linear-fit residual of log2 R_a against a, the HEUR-FR-2 validation"
      - "positive-control response: fractional change in R_a - 1 for a 1e-4 change in the second moment"
      - "de-tuned nearby-object balance ratios at a/8 and 8a"
      - "sensitivity table: total loss at each sample-count multiplier, and the sample count at which the loss reaches 1, 5 and 20 bits"
      - "multi-target table: loss at each target count, and the target count at which it reaches 1 and 20 bits"
      - "Bernoulli-fixture pass count out of 20, exact"

  preregistered_prediction:
    quantity: >-
      The balance ratio T2/T1 at the printed order, per parameter set, and the
      recovered sample budget N* against the specification's own sample count.
    formula: >-
      T1 = lambda/a; T2 = N * log2 R_a(chi||psi); with log2 R_a = c*a,
      a* = sqrt(lambda/(N c)) and N* = lambda/(c a^2). At the optimum T1 = T2, so
      the ratio T2/T1 is the tuning diagnostic.
    source: >-
      Derived in H-FRODO-8ea540.mechanism from the probability-preservation
      inequality and multiplicativity, both RECALLED AS STANDARD AND NOT CITED TO
      ANY PAPER, THEOREM NUMBER, PAGE OR VENUE. Verifying them is Stage 1 and a
      failure there falsifies the prediction's basis rather than the prediction.
    prediction: >-
      Ratio inside [1/3, 3] at AT LEAST TWO of the three parameter sets, and N*
      within a factor of 3 of the specification's sample count at Frodo-640 and
      Frodo-976. NO AGREEMENT IS PREDICTED AT FRODO-1344: the excerpt figures give a
      ratio of 5.99 and N* = 7194 against a recalled 43072, and that cell is
      pre-registered as an ANOMALY TO RESOLVE. Predicting agreement there would be
      predicting against this design's own arithmetic. The most likely explanation
      of the anomaly is that this program's recalled lambda or sample count for
      Frodo-1344 is wrong, and that reading is fixed here, before the run.
    not_predicted: >-
      Whether the printed divergences reproduce. That is the question this goal
      exists to ask and predicting its answer either way would be predicting the
      result. What is frozen instead is the decision rule below.
    frozen_decision_rule: >-
      Relative difference below 1e-2 between the recomputed R_a and the printed
      figure under the determined reading: REPRODUCED WITHIN THE PRINTED FIGURE'S
      OWN THREE-SIGNIFICANT-DIGIT PRECISION. Above 1e-1: STATED DISCREPANCY, with
      its size. Between: INCONCLUSIVE, with the printed precision reported beside
      it. THE RULE MAY NOT BE REVISED AFTER ANY NUMBER IS OBSERVED; EV-IC-002 is
      this program's own precedent for a verdict being retracted because a criterion
      was revised after the prior one was seen to fail.

  scale_relevance:
    tier: crypto
    justification: >-
      The divergence is a sum over at most 25 support points and the conversion is
      closed-form arithmetic, so the computation is performed AT the standardised
      parameter sets with no extrapolation, no toy proxy and no correspondence
      trick. THE ARITHMETIC CONCLUSION THEREFORE TRANSFERS TO THE REAL PARAMETERS
      BECAUSE IT IS COMPUTED THERE. That is the whole reason GOAL-FRODO-001 exists.
    limit: >-
      The crypto tier applies ONLY to the arithmetic statement. Every security
      reading remains at TOY (see claim_ceiling), because bit-security numbers here
      depend on a target level lambda that this program reads rather than derives,
      on a sample count that is a modelling choice, and on a reduction whose
      applicability is not verified.
    correspondence: null

  replication:
    seeds: [3260601, 3260602, 3260603]
    independent_instances: 3
    interpretation: >-
      Only the Bernoulli fixture arm is stochastic; the FrodoKEM recomputation is
      deterministic and its three "replicates" are re-executions that must agree
      bit for bit. A byte-level disagreement between replicates is an integrity
      failure and invalidates the package.

  budget:
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 2
    maximum_memory_gb: 2
    maximum_runs: 3
    maximum_workers: 1
    no_network_during_computation: true
    network_note: >-
      Stage 0 is an acquisition stage and necessarily uses the network; it is
      performed and archived separately from the computation stages, which run with
      no network at all.

  stopping_rules:
    - Do not execute while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Do not execute any stage consuming a FrodoKEM figure until the source gate's prerequisite deliverables are committed.
    - Stop at Stage 1 if the Holder derivation does not reproduce the probability-preservation inequality in the form used.
    - Stop at Stage 2 on any Bernoulli-fixture inequality, multiplicativity failure, or monotonicity violation.
    - Stop before the treatment comparison if the null-arm and positive-control hash commitment is absent.
    - Stop on exhaustion of any declared budget, and report the exhaustion as a budget outcome.

  invalidation_rules:
    - Any floating-point value in a reported primary metric.
    - Any comparison of the recomputed divergence to a printed figure made before the ordering control's commitment.
    - Any revision of the frozen decision rule, the balance band, or the anomaly reading after a number has been observed, other than through a versioned protocol amendment recorded as exploratory_only.
    - Any use of the provisional excerpt values in a reported result.
    - Any statement combining an arithmetic-tier and a security-tier conclusion into one claim.
    - Any derivation of a sieve, BKZ, core-SVP or lattice-estimator cost anywhere in the package (out of lane, GOAL-FRODO-001.non_duplication).
    - Any use of the words break, attack or vulnerable about FrodoKEM in any artifact of this package.

  success_criterion: >-
    THIS DRAFT HAS NO CURRENT SUCCESS OUTCOME BECAUSE IT IS NOT AUTHORIZED FOR
    EXECUTION. If a separately approved, frozen and authorized successor is executed,
    its only positive disposition is a complete readout in which: the Stage-1
    derivation is reproduced and recorded; the Bernoulli fixture passes 20/20
    exactly; monotonicity shows zero violations; the positive control meets its
    declared 1e-3 threshold; the de-tuned control lands outside the band at both
    de-tuned orders; and, for each parameter set, an exact-rational R_a is reported
    with the frozen decision rule's verdict, the loss decomposition, the recovered
    budget N*, the sensitivity table, and the quoted quantifier sentence or a
    recorded silence. THAT DISPOSITION ESTABLISHES NO ATTACK, NO EXPONENT, NO
    CRYPTO-SCALE SECURITY CLAIM, AND NOTHING ABOUT LWE.

  falsification_criterion: >-
    The package falsifies H-FRODO-8ea540 if any of: the Holder derivation fails to
    reproduce the inequality used (F1); the balance ratio lies outside [1/3, 3] at
    two or more parameter sets once correct lambda and N are read, refuting HEUR-FR-3
    and the budget-recovery framing (F2); the whole-scheme reading of the printed
    divergence proves correct, refuting consequence (B) (F3); or the de-tuned
    nearby-object control reports "tuned", voiding the diagnostic (F4). A pipeline
    defect (F5: non-monotone R_a, or a Bernoulli-fixture inequality) falsifies
    nothing about FrodoKEM and halts the run.

  outcomes:
    no_execution_authorization: >-
      The only current disposition. Review-required draft; no run, no observation,
      no evidence, no mathematical inference.
    future_clean_readout: >-
      Only after separate approval, freezing, authorization, a committed source
      filing, and a valid execution. Arithmetic conclusions at crypto tier, security
      conclusions at toy tier, recorded separately and never merged.
    future_discrepancy: >-
      A stated discrepancy with its size, at ARITHMETIC tier only. It is a
      documentation or analysis defect until costed with a charged attacker cost and
      independently reviewed (RQ-FRODO-3260cc.constraints). It is not an attack and
      may not be described as one.
    source_acquisition_failure: >-
      Reported as an access and infrastructure outcome per
      GOAL-FRODO-001.pause_conditions. NEVER evidence about any FrodoKEM quantity.
    infrastructure_or_integrity_failure: >-
      A timeout, crash, missing dependency or memory exhaustion is reported as
      infrastructure signal and is NEVER negative mathematical evidence about
      H-FRODO-8ea540 or about FrodoKEM (AGENTS.md rule 5). The container's package
      availability is disputed by two independent 2026-08-05 sweeps and the executor
      must record what it actually found; note that Stages 1 to 4 are designed to
      need nothing beyond the standard library precisely so that this dispute cannot
      block the decisive gate.

  required_artifacts_if_later_authorized:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - The KN-LIT filings from Stage 0, with provenance levels and extraction damage marked.
    - The two independent transcriptions and their diff.
    - The Stage-1 derivation in full, including the Holder step, and the primary-source verification record or its recorded failure.
    - Null-arm, positive-control, graded-sweep and de-tuned-control results with their hash commitment, timestamped before the treatment arm.
    - Exact-rational R_a per parameter set as a Fraction, with the code path used.
    - Loss decomposition, N*, sensitivity table and multi-target table.
    - The quoted quantifier sentence with its reference, or a recorded silence.
    - Manifest, environment, exact command, stdout, stderr, seeds, resolved model and policy, and validity status.
    - Snapshot archive followed by independent Validator and Red Team review (GOAL-FRODO-001.completion_criteria).

  approval_requirements:
    - Independent review confirms the source gate is honoured and that no stage consuming a FrodoKEM figure can run before the KN-LIT filings are committed.
    - Independent review confirms the split claim ceiling is enforceable as written and that no artifact merges the two tiers.
    - Independent review confirms the frozen decision rule, the balance band and the anomaly reading were fixed before execution.
    - Coordinator separately approves and freezes a successor contract WITHOUT EDITING THIS DRAFT.
    - Execution is authorized separately after the approved frozen package is received.

  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved and only the Coordinator may approve (AGENTS.md rule 1).
