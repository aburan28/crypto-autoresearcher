experiment:
  id: EXP-EQLA-95fa76
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-1e673d
  question_id: RQ-EQLA-0d3f40
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE MATCHED NULL THE STR LANE NEVER HAD: a synthetic matrix generator that holds shape,
    density, row-weight law, column-orbit partition and base-row budget FIXED while varying exactly
    one nuisance variable at a time - orbit closure fraction, B mod g, and dedup policy - so that
    every structure statistic in the lane (phi_alpha, raw rank, informative rank, block cost ratio)
    is reported as a surface over those variables instead of as a number, with the decay requirement
    stated in advance and blocking'
  status: draft
  objective: "(A) THE LANE'S MEASUREMENT HISTORY IS THE ARGUMENT FOR THIS RECORD. EV-STR-003 O-8 measured\
    \ that a construction with ZERO endomorphism content reproduces the small-versus-B displacement-rank\
    \ signature at 4 of 4 instances, including both headline instances, and attains alpha = 0 at B\
    \ = 204. EV-STR-003 O-4 traced the whole arm-E divergence to a difference of CLOSURE CONVENTION,\
    \ and recorded that arm E \"was a valid EXISTENCE control and a MIS-SPECIFIED COMPARATIVE one:\
    \ S1/F1 tested a proposition strictly stronger than OBS-1's content, on an uncontrolled nuisance\
    \ variable\". EV-STR-003 UC-2 states the obligation this record discharges: \"Any future criterion\
    \ of the S1 form must control the nuisance variable - by matching base-row budgets and reporting\
    \ alpha conditional on suppression count - or it is untestable.\" EV-STR-004 then ran A-prime\
    \ and E-prime, returned instrument_verdict `mixed`, and left UC-2 (truncation reading IL0) unresolved\
    \ at exactly the residue-1 cells. Four experiments have measured the lane's statistics; none has\
    \ measured them as FUNCTIONS OF THE NUISANCE VARIABLES.\n(B) WHAT IS BUILT. A generator that emits\
    \ a relation-matrix-shaped object from a declared parameter vector, with NO curve in the loop,\
    \ and a matched curve-derived arm that shares every parameter:\n  B           factor-base size\
    \ (columns)\n  g           orbit length of the column permutation sigma (g in {1, 2, 3, 4})\n\
    \  rho_B       B mod g, swept over {0, 1, ..., g-1} at otherwise fixed B\n  R_base      number\
    \ of base rows, MATCHED across arms by construction\n  w           row weight law (matched to\
    \ the measured Semaev arity m)\n  c           ORBIT CLOSURE FRACTION: the fraction of base rows\
    \ for which\n              the g-1 sigma-shifts are also emitted, swept over [0, 1]\n  d     \
    \      dedup policy in {off, exact-row, zero-filter} - the three\n              behaviours the\
    \ committed harness mixes at\n              harness/endomorphism_la.py lines 303-304 and 350-351\n\
    \  lambda_used the folding weight in {true lambda, wrong root lambda^2,\n              random\
    \ mu with mu^g != 1}\n  s           seed\nArms: (A) curve-derived rows from a genuine j = 0 instance;\
    \ (E) synthetic rows with identical (B, g, rho_B, R_base, w, c, d, s) and ZERO endomorphism content;\
    \ (P) planted-signal rows carrying a deliberately inserted structure the instrument is required\
    \ to detect.\n(C) WHAT IS MEASURED, AS A SURFACE. For every cell of the parameter grid, on every\
    \ arm, the whole battery:\n  phi_alpha              the as-committed displacement rank under sigma\n\
    \  rand_alpha             the same under a seeded random permutation\n  rank(M)              \
    \  raw rank over F_N\n  rank(tilde-M)          informative rank after lambda-folding\n       \
    \                  (IDEA-20260807-0e4d83)\n  free_rel_count         rows folding to zero (IDEA-20260807-61049d)\n\
    \  nnz, nnz_j             sparsity before and after the isotypic split\n  block_cost_ratio   \
    \    blockwise over plain sparse solve cost\n  misaligned_row_count   the phase-break statistic\
    \ of EV-STR-003 S3\n  dedup_suppressed_count rows silently dropped\nNothing is reported as a scalar.\
    \ Every statistic is reported as a function of c and of rho_B at fixed everything else, because\
    \ that is the only form in which the decay requirement of docs/inventor-protocol.md section 3\
    \ can be checked.\n(D) THE DECAY REQUIREMENT, DECLARED IN ADVANCE AND BLOCKING. c is the parameter\
    \ whose increase CREATES the phi-structure and whose decrease must DESTROY it. Therefore:\n  for\
    \ a statistic to be admissible as evidence of phi-structure, it must\n  vary monotonically in\
    \ c, and its arm-A and arm-E values at the SAME c must\n  be compared - never arm A at one c against\
    \ arm E at another.\nA statistic that is flat in c is measuring something else and may not be\
    \ cited as evidence about the endomorphism in either direction. A statistic whose arm-A and arm-E\
    \ curves coincide at every c is measuring the closure convention, exactly as EV-STR-003 O-8 found\
    \ for the alpha signature, and that coincidence is the CONTROLLED NULL, which is a result and\
    \ is reported as one.\n(E) THE TWO OUTCOMES, BOTH DELIVERABLES.\n  OUTCOME 1 - every statistic\
    \ in the battery has coincident A and E curves\n    over the whole (c, rho_B) grid. Then the lane's\
    \ four experiments were\n    measuring closure convention and truncation phase, the instrument\n\
    \    question EV-STR-003 UC-1 left UNADJUDICATED is adjudicated in the only\n    way a control\
    \ can adjudicate it, and every future STR measurement is\n    obliged to report against this surface.\
    \ That is a genuine instrument\n    result and it is the predicted one.\n  OUTCOME 2 - some statistic\
    \ separates A from E at matched (c, rho_B, R_base,\n    d) with an effect exceeding its measured\
    \ seed-to-seed spread. Then that\n    statistic carries endomorphism content, the lane has a working\n\
    \    instrument for the first time, and the statistic - not phi_alpha by\n    default - becomes\
    \ the lane's meter. The strongest candidate for this,\n    and it is predicted to FAIL to separate,\
    \ is informative rank; the\n    strongest candidate to succeed is the free-relation count, which\
    \ is\n    curve-derived by construction."
  resource_label: 'audit: consumes no resource. The synthetic arms use no curve at all; the curve-derived
    arm consumes R1 + R3 only to supply rows for comparison, and no claim in this record depends on
    that arm alone.'
  admissibility: admissible
  admissibility_argument: 'An instrument consumes no resource and mounts nothing, so the section-2
    filter is satisfied vacuously. Its purpose is precisely to enforce that filter on the rest of
    the lane: a statistic that cannot be separated from a curve-free null is not evidence that any
    resource was consumed, whatever its value. This record is L14''s obligation (RQ-INSTR-f8faa0)
    applied inside L5.'
  reachability_gate: 'Not applicable in its isogeny form: no curve is moved between, and the synthetic
    arms use no curve at all. The T4 scoping that binds every other L5 record binds this one only
    through arm A, which requires a D_0 = -3 curve - class-determined and unreachable from a generic
    curve at any cost. The instrument itself is reachable for any g at zero cost, which is exactly
    why building it before spending more compute on curve-derived measurements is the right order
    of work.'
  inputs:
    procedure: 'STAGE 0 (hours, implementation): write the generator, the arm-matching assertion,
      the battery and the hashing. No measurement is reported until the arm-matching assertion passes
      field by field. STAGE 1 (minutes, HARD GATES, in this order): SELF-CHECK 3 (g = 1 arms coincide
      exactly); SELF-CHECK 2 (planted deficiency recovered exactly); SELF-CHECK 1 (plant P1 fires
      and gives block ratio exactly 1/g). Any failure halts the line - none of these is a finding.
      STAGE 2 (minutes): the c-sweep at fixed B and rho_B = 0, both arms, five seeds. This alone answers
      the lane''s oldest open question (is alpha flat in the parameter that is supposed to destroy
      it) and is the cheapest valid discriminator in the record. STAGE 3 (minutes): the rho_B sweep
      at c = 1, both arms - the IL0 test. STAGE 4 (an hour): the dedup-policy sweep, both arms. STAGE
      5 (hours): the full grid over g, B and 5 seeds; report the surfaces. STAGE 6 (hours): HEUR-L5-8''s
      matching-richness ladder. Everything is pure Python on numpy-sized objects with no curve arithmetic
      except in arm A, and the whole grid is minutes-to-hours at toy B.'
    mechanism: "STEP 1. Write the generator as a pure function of the parameter vector plus a seed,\
      \ with a declared and hashed output. It emits: the column-orbit partition sigma, the base rows,\
      \ the closure rows, the dedup decisions and the final row list, together with sha256 of the\
      \ factor base and of the row list - which closes EV-STR-003 UC-6 (\"run records do not archive\
      \ the objects the metric is computed from\") at zero cost and makes every cell CHECKABLE from\
      \ artifacts rather than merely reproducible by re-execution.\nSTEP 2. Implement arm E (zero\
      \ endomorphism content) as: a random column partition into B/g blocks of size g, a random base-row\
      \ set with the matched weight law, and closure under the POSITIONAL block permutation. This\
      \ is EV-STR-003's arm E, but with R_base matched by construction and with the dedup policy as\
      \ an explicit parameter rather than inherited from the harness.\nSTEP 3. Implement arm A by\
      \ taking the base rows from a genuine j = 0 instance via the existing harness, then applying\
      \ the IDENTICAL closure, dedup and truncation code path as arm E. The only difference between\
      \ arms must be the provenance of the base rows. Any other difference is a bug and the generator\
      \ asserts against it by comparing the emitted parameter vectors field by field.\nSTEP 4. Implement\
      \ arm P (planted signal). Two plants, because an instrument must be shown to detect what it\
      \ claims to detect:\n  P1 - a genuinely block-circulant, FULL-informative-rank matrix built\
      \ by\n    drawing B/g independent rows in the quotient space and lifting them.\n    Every structure\
      \ statistic must fire, and the block cost ratio must be\n    1/g exactly.\n  P2 - a matrix with\
      \ an implanted rank deficiency of a declared size k.\n    rank(M) must be short by exactly k.\
      \ If it is not, the rank code is wrong\n    and every rank in the lane's history is suspect.\n\
      \nSTEP 5. Sweep. c in {0, 0.25, 0.5, 0.75, 1}, rho_B in {0, ..., g-1} at fixed B (achieved by\
      \ varying the number of complete orbits and padding with singleton columns, which is exactly\
      \ what the `xs[:B]` truncation of `_build_phi_invariant_factor_base` does accidentally and which\
      \ this generator does deliberately and records), d in {off, exact-row, zero-filter}, g in {1,\
      \ 2, 3, 4}, at least 5 seeds per cell, B spanning at least an order of magnitude.\nSTEP 6. Report\
      \ each statistic as a surface, with per-cell seed-to-seed spread. THE ACCEPTANCE RULE, frozen\
      \ before execution: a statistic separates the arms only if the A-E difference at matched (c,\
      \ rho_B, d, B) exceeds 3 times the pooled seed-to-seed standard deviation at that cell, at a\
      \ majority of cells, with a consistent sign. EV-STR-003 O-5 recorded that EXP-STR-003's contract\
      \ made its own `mixed` branch UNREACHABLE by construction; this rule has three reachable outcomes\
      \ (separates, does not separate, inconsistent-sign) and the third is reported as inconclusive\
      \ rather than folded into either of the others.\nSTEP 7. Publish the surface as the lane's reference\
      \ instrument, with the obligation that any future STR measurement cites the cell of this surface\
      \ it corresponds to."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - arm E - matched random matrix, identical shape, density and column-orbit partition, zero endomorphism
    content, R_base matched by construction
  - plant P1 - genuinely block-circulant full-informative-rank matrix
  - plant P2 - implanted rank deficiency of declared size
  - g = 1 degenerate limit, arms must coincide exactly
  - seeded random shift operator, for rand_alpha, as in the committed harness
  - 20-seed distribution measurement at three anchor cells before any 3-sigma rule is applied
  - the frozen EXP-STR-003 arm-A cells (B = 27, 55, 204, 397 with phi_alpha = 9, 2, 4, 1) reproduced
    as fixture points on the surface
  - 'NULL OBJECT (from the proposal): THIS RECORD IS THE NULL OBJECT CONTROL, so the field states
    the null of the null - what would show that the CONTROL itself is broken. THE MATCHED NULL, as
    the L5 brief requires: a random matrix of identical shape, density and column-permutation orbit
    structure (arm E). THE DECAY PARAMETER: c, the orbit closure fraction - the parameter whose decrease
    destroys the phi-structure. Secondary decay parameter: rho_B = B mod g, whose nonzero values are
    exactly the truncation regime EV-STR-004 flagged as IL0. SELF-CHECK 1 (planted positive P1): a
    genuinely structured, full-rank block-circulant matrix. Every structure statistic must fire and
    the block cost ratio must be exactly 1/g. If the instrument cannot see P1, it cannot see anything
    and the whole grid is void. SELF-CHECK 2 (planted deficiency P2): implanted rank deficiency k
    must be recovered exactly. This is a known-answer test of the rank code itself, which EV-STR-003
    UC-3 flagged as resting on the driver''s vectorised implementation alone at the two largest instances.
    SELF-CHECK 3 (degenerate limit): at g = 1 the closure is the identity, arm A and arm E must coincide
    EXACTLY at every c, and every block cost ratio must be 1. Any separation at g = 1 is a bug in
    the arm-matching and voids the grid. SELF-CHECK 4 (seed stability): at fixed parameters, the seed-to-seed
    spread must be reported before any A-E difference is interpreted; the acceptance rule of STEP
    6 is defined in units of that spread precisely so that it cannot be evaluated without it.'
  independent_variables: []
  metrics:
    primary:
    - every statistic in the battery, per cell, per arm, per seed
    - seed-to-seed spread and full empirical distribution at the anchor cells
    - the parameter vector and sha256 of factor base and row list, per cell
    - arm-matching assertion result, field by field, per cell
    secondary:
    - all four self-check outcomes
    - 'the three-branch acceptance verdict per statistic: separates | does not separate | inconsistent
      sign'
  heuristic_under_test: null
  preregistered_prediction:
    quantity: null
    formula: null
    source: null
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - UNMATCHED MOMENTS (HEUR-L5-8). Arm E matches declared moments, not the joint support law of Semaev
    decompositions. A separation could be an unmatched moment rather than endomorphism content; the
    matching-richness ladder of STAGE 6 exists to bound this and its result must accompany any separation
    claim.
  - DEDUP AS A HIDDEN VARIABLE. The committed harness both deduplicates rows and drops all-zero rows,
    and EV-STR-003 O-4 showed dedup behaviour drove the arm-E divergence. Making d explicit removes
    it as a confounder for THIS record but means results are only comparable to prior records at the
    matching d value, which must be named in every comparison.
  - 'PHASE SENSITIVITY. alpha is a phase-tracking statistic: one skipped emission shifts the whole
    downstream stream (EV-STR-003 O-4). It may therefore be extremely sensitive to emission ORDER,
    which is not in the declared parameter vector. Emission order must be added as a swept variable
    if the c-sweep shows non-monotonicity.'
  - SMALL-B RESOLUTION. At B = 27 with g = 3 there are 9 orbits and c takes only 10 distinct values;
    the sweep has almost no resolution. B must span at least an order of magnitude and small-B cells
    must be labelled low-resolution rather than averaged in.
  - MULTIPLE COMPARISONS. Nine statistics times five c values times g values times seeds is a large
    grid, and a 3-sigma rule applied cell-by-cell will produce false separations by chance. The acceptance
    rule requires a MAJORITY of cells with consistent sign precisely to blunt this, and the expected
    false-separation count under the null must be computed and reported alongside the observed count.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: null
  falsification_criterion:
  - 'SELF-CHECK 3 fails: arms differ at g = 1. Arm matching is broken; the grid is void and nothing
    is reported.'
  - 'SELF-CHECK 2 fails: planted deficiency not recovered. The rank code is wrong; this invalidates
    the instrument and casts doubt on prior committed ranks, which must then be recomputed before
    being cited again.'
  - 'SELF-CHECK 1 fails: plant P1 does not fire. The instrument cannot detect genuine structure and
    every null it reports is void - the exact failure mode L14 (RQ-INSTR-f8faa0) exists to prevent.'
  - phi_alpha is flat in c on both arms. The statistic does not respond to the parameter that creates
    and destroys the structure it claims to measure; it is voided for all purposes and no record may
    cite it in either direction.
  - Arm A separates from arm E on some statistic at matched parameters, 3 sigma, majority of cells,
    consistent sign. The lane has a working instrument; this record's own prediction is wrong; independent
    review before any interpretation, and the statistic - not phi_alpha - becomes the meter.
  - The EXP-STR-003 fixture cells do not land on the surface. The generator does not reproduce the
    committed behaviour and is not a control for it; halt and reconcile. This is an infrastructure
    outcome under AGENTS.md rule 5, not mathematical evidence.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-1e673d
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
