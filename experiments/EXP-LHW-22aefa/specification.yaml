    "mathematical_contract": {
      "arithmetic": "Ordinary nonnegative integer addition. m-bit inputs a,b; output x=a+b must be less than 2^m. No reduction modulo a group order or 2^m is used in the primary arm.",
      "target_set": "W(m,w)={x:0<=x<2^m and popcount(x)=w}, in increasing integer order, including targets of bit length less than m. N=binom(m,w).",
      "weights": "For each cell U is sorted unique {floor(w/2),ceil(w/2),w}. Both summands have weight u. This resolves the source missing second-summand convention by retaining the equal-weight Esser-May setting. An unequal-weight or modular repair is not silently substituted.",
      "bits": "For i=0..m-1, a_i,b_i,x_i in {0,1}; c_0=0; t_i=a_i+b_i+c_i; x_i=t_i mod 2; c_{i+1}=floor(t_i/2). Require c_m=0.",
      "strata": "For u in U define k=2u-w. k counts outgoing 1-carries c_1..c_m, with c_m=0. If k<0 or k>m-1 the weight slot is empty and recorded as such. For k=0 use ell=0; for k>0 include ell=1..k, the maximum contiguous run of 1s in c_1..c_m. The source stratum S_(u,k,ell) contains ordered pairs with both input weights u, no overflow, output weight w, carry count k and maximum carry-run length exactly ell. Empty strata remain in inventory with N_s=0 and zero mixture weight.",
      "counts": "N_s=|S_s| and R_s(x)=#{(a,b) in S_s:a+b=x}, ordered multiplicities retained. R_u(x)=sum_ell R_(u,2u-w,ell)(x). D_u=binom(m,u) is the single-endpoint domain size; D_u^2 is the unconditioned ordered-pair size. N_s is neither D_u nor a collision count.",
      "source_dp": {
        "state": "F_s(i,A,B,K,h,e), where i bits have been processed, A and B are remaining input 1s, K remaining outgoing 1-carries, h is the current carry-run length, e in {0,1} says the maximum allowed run ell has already been attained. Incoming carry is 1 iff h>0. Initial state (0,u,u,k,0,ell==0).",
        "transitions": "Visit digit pairs j=0,1,2,3 in lexicographic order (0,0),(0,1),(1,0),(1,1). Set c=(h>0), t=a_i+b_i+c, z=t mod2, d=floor(t/2), h2=(d==1?h+1:0), e2=e or(h2==ell). Recur to (i+1,A-a_i,B-b_i,K-d,h2,e2). Reject negative remaining counts, A or B or K greater than remaining bit positions, or h2>ell. There is no unknown-target digit input.",
        "terminal": "At i=m return 1 iff A=B=K=h=0 and e=1; otherwise return0. Every state outside the declared range returns0. For impossible k emit N_s=0 without recursion. N_s is F_s at its initial state. Because the carry identity fixes output weight to 2u-k, no redundant output-weight state is needed.",
        "target_fixed_variant": "To obtain R_s(x), use the same branch law but allow a branch only if z equals bit i of the supplied offline certification target x. This x-conditioned function is a separate analyst-only interface and cannot be imported by the deployed draw interface.",
        "cost_sum_recurrence": "In parallel maintain G_s on the same state graph: terminal valid state has G=4, invalid state0; nonterminal G=sum over valid digit-pair branches j of [G_child+(20+2j)*F_child]. The registered word-operation charge is an explicit abstract accounting convention for unranking, not a measured CPU bound. E[unrank charge|s]=G_s(root)/N_s. Counters and real process telemetry are reported separately.",
        "size_bound": "At most 3m nonempty candidate strata; per stratum at most 2(m+1)^5 tabulated states (i,A,B,K,h plus e), each count at most 2^(2m), and G adds O(log m) bits. Conservative all-strata memory is O(m^6) integers of O(m) bits, hence O(m^7) bits. This bound is for the public source generator, not exponential target-certification arrays.",
        "output_weight_models": {
          "fixed_weight": "For every primary u, use an independent count DP T(i,A,B,c,v) over processed positions i, remaining weights A,B, incoming carry c and output ones v. Start(0,u,u,0,0); each digit pair subtracts its input ones, computes z=(a+b+c)%2 and d=floor((a+b+c)/2), and adds one continuation to T(i+1,A-a,B-b,d,v+z). At i=m retain A=B=0; full integer output weight is v+c. Normalize by D_u^2. Also condition on c=0 using its exact count denominator, explicitly retaining rejected overflow mass.",
          "iid": "For each primary phi=u/m and the stationary diagnostic phi grid {1/8,1/4,3/8,1/2}, use probability DP T(i,c,v), initial(0,0,0)=1, same digit transition with weight phi^(a+b)*(1-phi)^(2-a-b). Terminal full weight is v+c; separately report c=0 conditional law. Compare fixed-weight and IID only at phi=u/m; the stationary grid is a separate diagnostic, not a rounded fixed-weight surrogate.",
          "definition_derived_stationary": "Unverified design correspondence to be independently checked: r=2phi(1-phi), p_i=[phi^2/(1-r)]*(1-r^i), Pr(Y_i=1)=r+(1-2r)*p_i, q_infinity=2phi-phi^2/(phi^2+(1-phi)^2). These are unconditioned IID marginals, not independent output bits or exact fixed-weight/no-overflow marginals.",
          "reported_source_row": "ePrint2019/931 section3.1, printed pages11-12 (PDF indices10-11) reports omega=4phi^4-4phi^3-phi^2+2phi after its eight-state stationary computation. Preserve this distinct formula and its residual to the definition-derived model. Do not label a design discrepancy as a validated contradiction; matrix construction, stationary solve and source correspondence are future independent checks."
