      "sampler": {
        "policy_features": "j_s is the zero-based rank of u in U; b_s=0 when k=0, otherwise ceil(3ell/k) in {1,2,3}. Policy (alpha,beta) has each parameter in {-2,-1,0,1,2}. Let v_s=alpha*j_s+beta*b_s, v_min=min active v_s, t_s=2^(v_s-v_min), Z=sum_active t_s*N_s, lambda_s=t_s*N_s/Z.",
        "sample": "Read L=ceil(log2 Z) unbiased bits, as a nonnegative integer z; reject z>=Z and repeat. For Z=1 use L=0,z=0. Select the first stratum in lexicographic (u,k,ell) order whose cumulative t_s*N_s range contains z; let rank=floor((z-offset)/t_s). Unrank uniformly in S_s using F child masses, lexicographic branches and subtraction. Return only the known pair and sum; no unknown target or target table enters sampling.",
        "probabilities": "Each ordered pair in S_s has probability t_s/Z. Hence q_policy(x)=sum_s t_s*R_s(x)/Z, sum_x q_policy(x)=1, and the conditional stratum law q_s(x)=R_s(x)/N_s. The sampler is a joint-pair sampler; it is not asserted to be two independent collision endpoints.",
        "rank_certificate": "For every nonempty stratum on the independent small controls enumerate every rank and prove inverse rank(unrank(r))=r, no duplicates and exact domain coverage. In every primary cell test ranks 0,N_s-1,floor(N_s/2) and 256 additional deterministic uniform ranks per nonempty stratum; preserve every pair and roundtrip. These finite samples validate implementation, not an empirical proof of pointwise uniformity.",
        "rng": "SHA-256 counter stream with domain literal carry-mixture-v1 and tag the compact UTF-8 JSON array [EXP-LHW-22aefa,cell_key,decimal_cell_seed,purpose,stratum_key_or_none,replica_decimal]. Block=SHA256(UTF8(domain)||byte0||UTF8(tag)||uint64be(counter)), counter starts0. Consume bits MSB first continuously; for a bound B use L=ceil(log2 B), reject values>=B; B=1 consumes0 bits. Purpose is rank-check, null-permutation or blindness-canary; stratum_key is u:k:ell. Fisher-Yates uses one continuous stream per (cell,stratum,replica). No platform PRNG or hidden seed.",
        "draw_benchmark": "In each training cell preserve256 deterministic full weighted-policy draws for each of25 policies, in addition to the stratum rank checks. In each holdout cell benchmark256 full draws for the distinct real frozen candidate, real frozen baseline and policy(0,0), never fit or benchmark a new candidate grid. Null policies are evaluated exactly through counts, not by sampling. RNG purpose policy-sampler and key alpha:beta. Charge real CPU/wall/entropy/memory and verify every returned pair independently; these draws are implementation/cost checks within the declared RUN, not estimates of tail mass."
