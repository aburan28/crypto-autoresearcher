        "amortization": "Primary rate eta_policy(x)=q_policy(x)/C_policy is the steady-source-draw rate under the explicitly modeled charge. Also report q_policy(x)/(C_policy+B_cell/U) at U=1,1024,1048576. Table setup and all training/certification costs are separately retained. No exponential offline R_s(x) table is available to a claimed solver; a future use must charge it or state and justify actual amortization over U targets.",
