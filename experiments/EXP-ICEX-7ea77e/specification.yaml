experiment:
  id: EXP-ICEX-7ea77e
  hypothesis_id: H-ICEX-5666b2
  derived_from_idea: IDEA-20260815-fa6a12
  question_id: RQ-EQLA-0d3f40
  batch_id: BATCH-fced88
  version: 1
  title: >-
    MEASURE THE LANE'S SECOND COST TERM INSTEAD OF CITING IT- instrumented
    block Wiedemann and block Lanczos on the relation matrices this campaign
    actually retains, counted in F_N field operations and stored field
    elements, against a random sparse null matched on dimension, density AND
    row-weight law, against a curve-free relation-matrix-shaped generator,
    and against a known-solution correctness control, with a matrix inventory
    as the first deliverable, a feasibility gate that refuses to price an
    empty or underdetermined matrix, and a hard refusal to emit any total
    combining field and group operations
  status: draft
  objective: >-
    (A) THE UNCERTAINTY. The ICEX exponent is relation cost plus
    linear-algebra cost. The second is cited as an asymptotic. Whether that
    citation is right for the matrices this campaign actually produces is
    measurable at the dimensions the campaign reaches, and has not been
    measured.
    (B) WHAT IS BUILT. Two instrumented solvers with explicit field-operation
    and stored-element counters, three matrix arms sharing one solver
    (real, matched random, curve-free synthetic), and three correctness
    controls (known solution, identity, permutation).
    (C) THE FIRST DELIVERABLE IS AN INVENTORY, NOT A MEASUREMENT. Stage 0
    determines whether the lane's runs retained their relation matrices, at
    what dimensions, and with what hashes. If they did not, the regeneration
    cost is measured and reported and the contract's scope narrows to what is
    regenerable within budget. The contract does not assume availability, and
    a narrowed scope is a scope outcome rather than a negative result.
    (D) WHAT IS NOT DECIDED. The ICEX exponent, which RQ-ICEX-001 reserves;
    anything at dimensions above the tested range; and whether a DESIGNED
    structured support would solve faster, which is KN-OPEN-006's question
    and for which this is only the baseline.
  inputs:
    cost_unit: >-
      F_N FIELD OPERATIONS, with MULTIPLICATIONS and ADDITIONS counted in
      SEPARATE COLUMNS and never summed without a declared relative weight,
      reported at weights in {1, 2, 5} multiplications per
      addition-equivalent. MEMORY- STORED F_N ELEMENTS, counted by the
      program, with an allocator-level byte probe reported SIDE BY SIDE as a
      cross-check on direction and never substituted for the element count.
      WALL CLOCK, in SECONDS, is a machine-tagged SECONDARY column only and
      never a primary metric.
    unit_discipline: >-
      BINDING AND ENFORCED. Every value carries a tag in {field_mults,
      field_adds, field_ops_weighted, stored_elements, bytes, seconds,
      dimensionless}. The harness refuses any cross-tag arithmetic without a
      named, recorded conversion. THE HARD RULE OF THIS CONTRACT- NO TOTAL
      COMBINING A FIELD-OPERATION COUNT WITH A GROUP-OPERATION COUNT MAY BE
      EMITTED, and no group-operation quantity may be subtracted from a
      field-operation total. The lane's relation term and both matched
      baselines are in GROUP operations; this contract's output is in FIELD
      operations; a downstream aggregation must convert at an explicitly
      declared, recorded rate, and this contract deliberately does not
      perform that conversion so that the junction stays visible. A red-team
      pass on this program found a headline flipped by exactly that
      subtraction.
    feasibility_gate: >-
      THE HARNESS REFUSES TO PRICE AN EMPTY OR UNDERDETERMINED MATRIX.
      Reported as INFEASIBLE with dimensions and reason, never priced or
      timed- ZERO ROWS; zero columns; fewer rows than columns (an
      underdetermined system whose kernel dimension exceeds the target, so
      the solve cost is not the quantity being modelled); a matrix with an
      all-zero row or column that has not been declared and stripped; and any
      matrix whose declared dimension does not match its actual shape. In
      addition, matrices of dimension below a declared floor of n = 64 are
      MEASURED AND REPORTED but EXCLUDED FROM EVERY FIT, declared before the
      run, because iterative-solver startup costs dominate there. THIS GATE
      IS THE DIRECT DESCENDANT OF DEC-20260904-d47cd2, which rejected a cost
      table that priced a Macaulay matrix with ZERO ROWS at every one of 54
      cells because its cost primitive raised a COLUMN count to a
      matrix-multiplication exponent and never compared it with a row count.
      A solver harness that will time an empty matrix will report a number
      for it.
    procedure: >-
      STAGE 0 (HARD GATE, hours at most). MATRIX INVENTORY. Enumerate the
      lane's runs, determine which retained their relation matrices, and
      report paths, dimensions, densities, row-weight distributions,
      column-frequency distributions and sha256 per matrix. Where matrices
      were not retained, measure and report the regeneration cost and narrow
      the scope explicitly. THE INVENTORY IS A DELIVERABLE IN ITS OWN RIGHT.
      STAGE 1 (HARD GATE, minutes). CORRECTNESS. Both solvers on a
      known-solution matrix, on the identity, and on a permutation matrix.
      Every answer must be correct and the identity and permutation costs
      must match their by-inspection values. NO COUNT IS ADMITTED UNTIL THIS
      PASSES.
      STAGE 2 (HARD GATE, minutes). INSTRUMENT RESPONSE. Double the row
      weight of a synthetic matrix at fixed dimension and confirm the
      field-operation count rises by 2x +/- 15 percent; double the dimension
      at fixed weight and confirm it rises by 4x +/- 25 percent. A counter
      that does not respond to the two quantities the model says drive it is
      not measuring them.
      STAGE 3 (the measurement, hours). Both solvers on every inventoried
      real matrix, at at least two block sizes, with all counters.
      STAGE 4. The MATCHED RANDOM null at the same dimension, density AND
      row-weight law, per real matrix, over the declared seeds.
      STAGE 5. The CURVE-FREE SYNTHETIC arm from a relation-matrix-shaped
      generator with no curve in the loop, matched additionally on the
      column-frequency law.
      STAGE 6. Fits- the field-operation count against dimension at fixed
      weight on the random arm (must trend toward exponent 2), and the
      real-versus-random and synthetic-versus-real ratios per dimension.
      STAGE 7 (zero compute). The infeasible-matrix table, the identifying
      five-tuple attached to every row, and an explicit statement that the
      output is in FIELD operations and carries no combined total.
    mechanism: >-
      STEP 1. Instrument both solvers so that every field multiplication and
      every field addition increments a counter at the point of operation,
      and every allocation of a field element increments a stored-element
      counter with a running peak. An estimated count is not admissible.
      STEP 2. Build the matched random null by sampling a matrix with the
      SAME dimension, the SAME density and the SAME row-weight distribution
      as its real counterpart - matched by construction and asserted field by
      field, not merely in aggregate.
      STEP 3. Build the curve-free synthetic arm from a
      relation-matrix-shaped generator taking a declared parameter vector and
      a seed, with NO CURVE IN THE LOOP, matched additionally on the
      column-frequency law. Reuse the generator design already specified as
      the matched null of EXP-EQLA-95fa76 rather than building a second one;
      that contract is DRAFT and unapproved and none of its results are
      assumed.
      STEP 4. Run all three arms through the SAME solver code path; the only
      difference between arms is the provenance of the matrix.
      STEP 5. Report every row as the identifying five-tuple (dimension,
      average row weight, iteration count, block size, peak stored elements)
      plus the two operation columns, never as a single scalar.
    instrument: >-
      Instrumented block Wiedemann and block Lanczos over F_N with explicit
      counters. A library whose internal operation count cannot be
      instrumented is NOT admissible as the instrument here, however fast it
      is, because an opaque count cannot be compared against a derived form.
  controls:
    - >-
      CONTROL 1, KNOWN-SOLUTION MATRIX (blocking). Solver correctness
      verified before any count or timing is admitted. A solver that returns
      a wrong kernel element cheaply is not fast.
    - >-
      CONTROL 2, IDENTITY AND PERMUTATION MATRICES (blocking). Known-answer
      cost controls whose solve cost is known by inspection.
    - >-
      CONTROL 3, MATCHED RANDOM SPARSE NULL. Matched on dimension, density
      AND row-weight distribution - NOT density alone, which would make the
      null a weak reference. The column-frequency law of both arms is
      reported alongside so a reviewer can see which moments were matched and
      which were not.
    - >-
      CONTROL 4, CURVE-FREE SYNTHETIC ARM (REQUIRED under the standing scope
      constraint of pfdr-battery-20260904). A relation-matrix-shaped
      generator with NO CURVE IN THE LOOP, matched on shape, density,
      row-weight law and column-frequency law, run through the identical
      solver code path. Solve cost is a function of shape and weight law
      unless something curve-derived enters it. PREDICTED- the synthetic arm
      reproduces the real arm within the same factor 1.5. Consequence stated
      in advance- if it does, no linear-algebra measurement in this lane may
      be quoted as a curve-specific or endomorphism-specific result.
    - >-
      CONTROL 5, INSTRUMENT-RESPONSE NULL (blocking). Doubling row weight
      must double the count within 15 percent; doubling dimension at fixed
      weight must quadruple it within 25 percent. A counter insensitive to
      the two quantities the model says drive it voids the grid.
    - >-
      CONTROL 6, ALLOCATOR CROSS-CHECK. The stored-element counter and the
      allocator-level byte probe are reported SIDE BY SIDE and must move in
      the same direction; a divergence means one of them is measuring
      something else and is reported rather than reconciled silently.
    - >-
      CONTROL 7, TWO SOLVERS REPORTED SEPARATELY AND NEVER AVERAGED. Their
      costs differ on structured input, so a cost term quoted without naming
      its solver is not identifying.
    - >-
      CONTROL 8, SEED SPREAD. The random and synthetic arms are run over the
      declared seeds and their seed-to-seed spread is reported before any
      real-versus-null ratio is interpreted; no ratio smaller than twice that
      spread is reported as a difference.
  independent_variables:
    - matrix arm in {real relation matrices, matched random sparse, curve-free synthetic}
    - solver in {block Wiedemann, block Lanczos}
    - matrix dimension, spanning as wide a range as the inventory provides
    - average row weight, as produced and matched in the null arms
    - block size, at least two declared values
    - addition weight in {1, 2, 5} multiplications per addition-equivalent
  metrics:
    primary:
      - >-
        field MULTIPLICATIONS and field ADDITIONS, in separate columns, per
        solver per matrix per block size per seed
      - >-
        weighted FIELD OPERATIONS at each declared addition weight,
        reported one row per weight
      - >-
        peak solver working set in STORED F_N ELEMENTS, with the
        allocator-level byte probe beside it
      - >-
        iteration count, dimensionless, per solve
      - >-
        ratio of real to matched-random field operations, dimensionless, per
        dimension, with seed spread
      - >-
        ratio of curve-free synthetic to real field operations, dimensionless,
        per dimension
      - >-
        fitted exponent of field operations against dimension at fixed row
        weight on the RANDOM arm, dimensionless
    secondary:
      - sparsity pattern statistics per matrix - row-weight distribution, column-frequency distribution, bandwidth - not density alone
      - wall clock in SECONDS, machine-tagged, never a primary metric
      - the Stage 0 matrix inventory with paths, dimensions and sha256
      - the infeasible-matrix table with dimensions and refusal reason
      - the identifying five-tuple attached to every row
      - correctness-control results for all three control matrices
  heuristic_under_test: HEUR-EQLA-1
  preregistered_prediction:
    quantity: >-
      The ratio of measured F_N field operations on the lane's real relation
      matrices to the same solvers on a random sparse null matched on
      dimension, density and row-weight law.
    formula: >-
      For an n x n sparse matrix of average row weight w, both solvers
      perform Theta(n) matrix-vector products of Theta(n*w) field operations
      each, for Theta(n^2 * w) total - a form re-derived from the iteration
      structure and NOT cited. PREDICTED- the real-to-random ratio lies
      within a factor 1.5 at every tested dimension. FALSIFIED if it exceeds
      1.5 at a majority of dimensions with a consistent sign.
    source: >-
      H-ICEX-5666b2 statements (B) and (C). No external complexity result is
      relied on; the reference form is derived in-record.
  scale_relevance:
    tier: toy
    justification: >-
      The tested dimensions are whatever the lane's toy runs produced, and
      they sit FAR BELOW any asymptotic regime; iterative solvers have
      startup costs that dominate at small dimension, which is exactly this
      regime. Evidence is capped at claim_tier toy per RQ-EQLA-0d3f40's
      constraint. TRANSFER ASSUMPTION, STATED AND UNJUSTIFIED- that cost
      behaviour at these dimensions says anything about the dimensions where
      the ICEX exponent would matter. THERE IS NO CORRESPONDENCE TRICK
      AVAILABLE HERE to reach cryptographic matrix dimensions, so that
      transfer is NOT TESTABLE AT REACHABLE SCALE and is declared rather than
      approximated.
    correspondence: null
  tail_checks:
    - >-
      THE LARGEST AVAILABLE MATRIX is the only one anywhere near an
      asymptotic regime and is reported separately; it anchors the
      random-arm exponent fit and any statement about the cited asymptotic.
    - >-
      THE SMALLEST MATRICES (n < 64) are reported but EXCLUDED FROM EVERY
      FIT, declared before the run, because startup costs dominate there.
    - >-
      UNMATCHED MOMENTS. The random null matches dimension, density and
      row-weight law but not the column-frequency law; the synthetic arm
      matches that too. A separation that appears against the random null but
      NOT against the synthetic arm is an unmatched-moment artifact rather
      than structure, and that comparison is the tail check that decides it.
    - >-
      ANY DIVERGENCE BETWEEN THE STORED-ELEMENT COUNTER AND THE ALLOCATOR
      PROBE is inspected individually; a memory claim resting on only one of
      them is incomplete.
  replication:
    seeds:
      - 20260904
      - 20260905
      - 20260906
      - 20260907
      - 20260908
    independent_instances: 5
    seeds_note: >-
      Seeds govern the matched-random draw, the curve-free synthetic
      generator and the solver's own random projections (both block Wiedemann
      and block Lanczos are randomised). The REAL arm's matrices are fixed
      objects and are identified by sha256 rather than by seed, but the
      solver seeds still apply to them and at least 5 solver seeds are run
      per matrix so that solver-induced variance is separated from
      matrix-induced variance. No real-versus-null ratio is interpreted
      before the seed spread is reported.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 4.0
    maximum_memory_gb: 8
    maximum_runs: 24
    maximum_workers: 1
  stopping_rules:
    - Stop at maximum_runs or total_cpu_hours, whichever binds first.
    - >-
      Stop immediately if Stage 1 correctness fails on any control matrix; no
      count is admissible from an incorrect solver.
    - >-
      Stop immediately if Stage 2's instrument-response null fails.
    - >-
      Stop a solve at the declared per-run wall clock and record it as
      CENSORED with its iteration count and counters reached, never as a
      completed measurement.
    - >-
      Stop and report if Stage 0 finds no retained matrices and regeneration
      exceeds the budget; the inventory is then the deliverable.
  invalidation_rules:
    - >-
      A run emitting any total that COMBINES a field-operation count with a
      group-operation count, or subtracting one from the other, is INVALID.
      This is the specific defect this contract exists to close.
    - >-
      A run pricing or timing a matrix the feasibility gate declared
      infeasible - zero rows, zero columns, or fewer rows than columns - is
      INVALID.
    - >-
      A run including sub-floor matrices (n < 64) in a fit is INVALID.
    - >-
      A run reporting an ESTIMATED operation count rather than an
      instrumented one, or substituting the allocator byte probe for the
      stored-element count, is INVALID.
    - >-
      A run reporting a solver cost without naming its solver and its block
      size is INVALID.
    - >-
      A run summing field multiplications and additions without a declared
      relative weight is INVALID.
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence
      (AGENTS.md rule 5).
    - >-
      Any claimed kernel element that fails independent re-verification makes
      the run completed_invalid.
  success_criterion: >-
    The contract SUCCEEDS when the Stage 0 inventory is reported, Stages 1
    and 2 gates pass, both solvers are measured on every inventoried real
    matrix and on both null arms with all counters, the real-to-random and
    synthetic-to-real ratios are reported per dimension with seed spread, the
    random-arm exponent fit is reported, and the infeasible-matrix table is
    emitted. Success is the production of a MEASURED cost term in field
    operations with its memory column, in either direction - a confirmation
    that the cited asymptotic is adequate is a successful run.
  falsification_criterion:
    - >-
      F1 (voids the run). Solver correctness fails, or the instrument
      response fails. Infrastructure outcome under AGENTS.md rule 5; no count
      is admissible.
    - >-
      F2 (confirms the hypothesis). Real matrices match the random reference
      within 1.5 at every dimension. The cited asymptotic is adequate at the
      tested dimensions.
    - >-
      F3 (falsifies the hypothesis). Real matrices solve materially FASTER -
      ratio below 1/1.5, consistent sign, majority of dimensions. The lane's
      linear-algebra term is overstated and the ICEX exponent improves for
      index calculus.
    - >-
      F4 (falsifies the hypothesis). Real matrices solve materially SLOWER -
      ratio above 1.5, consistent sign, majority of dimensions. The term is
      understated, which is the direction that flatters index calculus if
      left unmeasured.
    - >-
      F5 (scope finding). The random arm's fitted exponent does not trend
      toward 2 across the available range. The tested dimensions are entirely
      pre-asymptotic; no comparison against the cited asymptotic is
      admissible and only the real-versus-random ratio survives.
    - >-
      F6 (scope finding). The curve-free synthetic arm reproduces the real
      arm within 1.5, as predicted. The measured cost is a function of shape
      and weight law, and no measurement here may be read as a curve
      statement.
    - >-
      F7 (scope outcome, not a result). Stage 0 finds no retained matrices
      and regeneration exceeds the budget. The scope narrows to what is
      regenerable and that narrowing is reported.
  required_artifacts:
    - manifest.yaml with exact command, git commit, dirty-tree state, environment and dependency versions
    - the Stage 0 matrix inventory with paths, dimensions, densities, row-weight and column-frequency distributions and sha256 per matrix
    - raw-result.json with every per-matrix, per-solver, per-block-size, per-seed counter value and its unit tag
    - both null arms' measurements in the same file as the real arm
    - correctness-control results for the known-solution, identity and permutation matrices
    - the instrument-response null results
    - the infeasible-matrix table with dimensions and refusal reason
    - sparsity pattern statistics per matrix, not density alone
    - the stored-element counts with the allocator byte probe beside them
    - an explicit statement in the summary that the output is denominated in FIELD operations and carries no combined total
  interpretation_limits:
    - >-
      MEASURES A COST TERM; PRODUCES NO EXPONENT AND NO COMPARISON.
      RQ-ICEX-001's decision is not taken here.
    - >-
      TOY DIMENSIONS ONLY, capped at claim_tier toy. SMALL-MATRIX BEHAVIOUR
      DOES NOT EXTRAPOLATE, and there is NO CORRESPONDENCE TRICK available to
      reach the dimensions where the exponent would matter - the transfer is
      NOT TESTABLE AT REACHABLE SCALE and is declared as an assumption.
    - >-
      THE OUTPUT IS IN FIELD OPERATIONS AND MAY NOT BE ADDED TO ANY
      GROUP-OPERATION QUANTITY without an explicitly declared, recorded
      conversion, which this contract deliberately does not perform.
    - >-
      DENSITY-ONLY MATCHING WOULD MAKE THE NULL WEAK; the row-weight law is
      matched and the column-frequency law is reported, so a reviewer can see
      exactly which moments were controlled.
    - >-
      SAYS NOTHING ABOUT DESIGNED OR ENDOMORPHISM-STRUCTURED SUPPORTS
      (KN-OPEN-006). This is the baseline that question needs, not an answer
      to it.
    - >-
      THE CURVE-FREE GENERATOR IS REUSED FROM A DRAFT, UNAPPROVED CONTRACT
      (EXP-EQLA-95fa76). Its DESIGN is reused; none of its results is assumed
      and it has none.
    - >-
      IF THE CURVE-FREE ARM REPRODUCES THE COST, as predicted, nothing here
      is a statement about elliptic curves.
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      NOT APPROVED. DRAFT, designed under TASK-20260904-e87737; execution
      requires a separate Coordinator approval decision. A message from any
      agent is not an approval.
    - >-
      Stages 0, 1 and 2 are HARD GATES; no measurement is reported until all
      three pass.
    - >-
      RQ-EQLA-0d3f40 makes a matched null of identical shape and density
      BLOCKING and caps evidence at claim_tier toy; both are carried into
      this contract and neither may be relaxed at approval without a
      versioned protocol amendment.
  id_allocation_provenance: >-
    EXP-ICEX-7ea77e was pre-allocated by the tasking Coordinator session and
    supplied in TASK-20260904-e87737's constraints, verified free across the
    identifier union before use. This agent has no shell and allocated no
    identifier.
  yaml_parse_disclosure: >-
    Written by a Coordinator subagent without an interpreter; every prose
    value is a folded block scalar or a quoted scalar; no tabs; no duplicate
    keys to the author's reading. THIS AGENT COULD NOT RUN A STRICT YAML
    PARSE OR tools/validate_ledger.py and did not do so; the orchestrating
    session must run both before this contract is relied on.
