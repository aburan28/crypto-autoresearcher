experiment:
  id: EXP-UOV-cd7536
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-UOV-4d1377
  question_id: RQ-UOV-001
  goal_id: GOAL-UOV-001
  batch_id: null
  title: >-
    Review-required contract: measure the graded Macaulay rank profile of the
    k = 2 UOV intersection-attack system over F_16 at even-n toy cells against a
    matched planted-solution null, with the semi-regular prediction derived and
    frozen before any run

  objective: >-
    If separately approved, frozen and authorized, build the k = 2
    intersection-attack system derived in H-UOV-4d1377 from random toy UOV keys
    over F_16, together with a planted-solution null, an unplanted null, a
    forced-positive control and a graded solution-dimension control; compute
    exact GF(16) Macaulay ranks at degrees 2..d_reg+1; and report the deficit
    against the frozen semi-regular prediction, arm by arm. THE OBJECT UNDER
    TEST IS THE SEMI-REGULARITY HEURISTIC HEUR-UOV-A1, NOT UOV.

  what_this_is_not:
    - Not a key recovery, not a signature forgery, and not an attack of any kind.
    - Not a complexity, cost, exponent, cryptographic-scale or deployed-parameter claim.
    - Not a statement about the NIST UOV round-3 parameter sets, which this program has not read.
    - Not a statement about MAYO, QR-UOV or SNOVA; those goals own their own objects.
    - Not a reuse of src/ic_first_fall_fast.py, which is F_2 by construction and does not import.
    - Not an approval, a freeze, an execution authorization, a run, an observation, or evidence.
    - Not a test of the hybridised systems that IDEA-20260805-69af7c's frontier depends on.

  claim_ceiling: >-
    TIER toy. Any future execution is limited to q = 16, the four even-n core
    cells (v,m) = (3,3), (7,5), (6,4), (8,6), degrees D <= d_reg + 1, three
    seeds, two independent choices of (L_1, L_2) per cell, and the rank routine
    written for this contract. The exact scope a passing run could support is:
    'on this instrument lineage, at these four cells over F_16, at these seeds
    and these L-choices, the graded Macaulay rank profile of the derived
    intersection system did / did not differ from that of a matched
    planted-solution random system, with the frozen semi-regular prediction
    reproduced by the null.' NO OUTCOME may establish a cost, an exponent, a
    crypto-scale conclusion, or a statement about any deployed parameter set
    (AGENTS.md rules 4 and 7).

  inputs:
    field: GF(16)
    field_polynomial: "x^4 + x + 1, primitive over GF(2); element 0..15 as the coefficient vector, LSB = constant term"
    core_cells_v_m: [[3, 3], [7, 5], [6, 4], [8, 6]]
    core_cells_n: {"3,3": 6, "7,5": 12, "6,4": 10, "8,6": 14}
    odd_n_arm_v_m: [[4, 3], [5, 4], [6, 5]]
    stretch_cells_v_m: [[9, 6], [10, 7]]
    M_rule: "M = 3m - 2"
    N_rule: "N = 2n - 3m"
    derived_M_N_core: {"3,3": [7, 3], "7,5": [13, 9], "6,4": [10, 8], "8,6": [16, 10]}
    frozen_dreg_core: {"3,3": 2, "7,5": 4, "6,4": 5, "8,6": 4}
    frozen_dreg_odd_n_arm: {"4,3": 3, "5,4": 3, "6,5": 3}
    degrees_per_cell: "D = 2, 3, ..., d_reg + 1 inclusive, using the frozen d_reg for that cell"
    seeds: [1, 2, 2026]
    l_choices_per_cell: 2
    max_invertibility_trials: 100
    master_seed: 4213877
    domain: EXP-UOV-cd7536/v1
    seed_derivation_rule: >-
      All randomness derives from SHA-256 of the ASCII string
      domain || "|" || label || "|" || decimal(v) || "|" || decimal(m) || "|" ||
      decimal(seed) || "|" || decimal(counter), interpreted big-endian unsigned,
      consumed 4 bits at a time from the most significant end to produce F_16
      elements; the counter advances once per digest and never repeats within a
      cell. Labels are exactly: "oil" (the matrix O'), "P1", "P2" (the free
      public blocks), "lcomb" (the F_q-coefficients of a candidate combination
      of polar forms), "constraint" (the imposed linear constraints), "nullP"
      (the null system's coefficients), "nullU", "point" (the planted projective
      point). No other label may draw randomness. This rule alone must let a
      third party regenerate every instance bit-for-bit.

  construction:
    design_status: declared_only_not_implemented_or_observed
    uov_key: >-
      Draw O' in F_16^{v x m} from label "oil". Draw the upper-triangular
      v x v block P1_l and the v x m block P2_l for l = 1..m from labels "P1"
      and "P2". Set P3_l = Upper(- O'^T P1_l O' - O'^T P2_l) so that p_l
      vanishes identically on the oil space O = column span of [O' ; I_m].
      REQUIRED INTEGRITY CHECK, run before anything else and recorded: evaluate
      every p_l at every one of the m basis vectors of O and at 50 random
      F_16-combinations of them, and require the value 0 in all m*(m+50) cases.
      A single nonzero value is a construction failure and terminates the cell.
    polar_forms: >-
      P'_l = P_l + P_l^T from the full upper-triangular n x n matrix P_l. Over
      GF(16), characteristic 2, P'_l is alternating with zero diagonal.
      REQUIRED CHECK: assert diagonal entries are 0 and P'_l is symmetric.
    invertible_combinations: >-
      For t = 0, 1, ..., max_invertibility_trials - 1 draw coefficients
      (c_1..c_m) from label "lcomb" and test whether sum_l c_l P'_l is
      invertible over GF(16) by exact elimination. The first two independent
      invertible combinations found are L_1 and L_2. RECORD the trial count.
      If fewer than two are found within the trial budget the cell terminates as
      CONSTRUCTION_FAILURE - an infrastructure and construction outcome, never
      mathematical evidence about UOV.
    equation_assembly: >-
      Form the 3m quadratic forms in x: p_l(L_1^{-1}x), p_l(L_2^{-1}x) and
      P'_l(L_1^{-1}x, L_2^{-1}x) for l = 1..m. REQUIRED INTEGRITY CHECK: exactly
      two of the 3m must be the identically zero polynomial, and both must be
      cross-block equations at the two indices whose polar forms were used to
      build L_1 and L_2 (or the corresponding indices when L_i is a combination
      rather than a single form - in which case the vanishing is of the
      combination and the check is that exactly two independent vanishing
      relations occur). If the count of identically zero forms is not 2, or if
      any of the surviving 3m - 2 forms is a scalar multiple of another, the
      package is INVALID_MEASUREMENT and no rank is reported.
    linear_constraints: >-
      Draw 3m - n - 1 independent linear forms from label "constraint", verify
      their independence by rank, and substitute to eliminate that many
      variables; then dehomogenise by setting one remaining coordinate to 1,
      leaving exactly N = 2n - 3m variables. REQUIRED CHECK: the resulting
      variable count must equal 2n - 3m exactly.
    solution_witness: >-
      Independently compute a witness x* in L_1 O intersect L_2 O satisfying the
      imposed constraints, by exact linear algebra on the two m-dimensional
      subspaces, and verify that x* is a root of every one of the 3m - 2
      equations. THE WITNESS IS COMPUTED WITHOUT REFERENCE TO THE MACAULAY
      MATRIX and its existence is checked before any rank is taken. If no
      witness exists, P1 of the hypothesis is contradicted and the run halts
      with that as its finding.

  arms_and_controls:
    treatment: >-
      TREAT - the derived intersection system, M = 3m - 2 quadratic forms in
      N = 2n - 3m variables over GF(16).
    measured_null: >-
      NULL-P - M uniformly random quadratic forms in N variables over GF(16)
      drawn from label "nullP", each constrained to vanish at one uniformly
      random projective point x*_null drawn from label "point". Matched to TREAT
      on (M, N, q, has-a-solution). FORCED VALUE DERIVED BEFORE THE RUN: d_ff
      equal to the frozen semi-regular d_reg of that cell (2, 4, 5, 4 on the
      core ladder) and deficit(D) = 0 for every D < d_reg. THIS NULL CAN FAIL,
      which is what makes it a null rather than a decoration: if the planted
      point alone forces a degree fall the unplanted series does not predict,
      NULL-P misses its frozen value and every treatment comparison at that cell
      is blocked.
    second_null: >-
      NULL-U - M uniformly random quadratic forms in N variables with NO planted
      point, drawn from label "nullU". Same forced value. Run beside NULL-P
      specifically to measure whether the planting is load-bearing, because
      IDEA-20260801-014 specifies the unplanted null and this contract asserts
      that choice is wrong; the assertion is measured, not argued.
    positive_control: >-
      POS - the treatment system with ZERO linear constraints imposed, so
      N = n - 1 and the projective solution set has dimension at least
      t = 3m - n - 1 > 0. A positive-dimensional solution set forces the Hilbert
      function to stabilise to a polynomial of degree t rather than to a
      constant, hence forces deficit(D) > 0 at high enough D. THRESHOLD
      DECLARED BEFORE THE RUN: deficit(d_reg) >= 1 at every cell with
      3m - n >= 2, i.e. at (3,3) t=2, (7,5) t=2, (8,6) t=3; cell (6,4) has
      3m - n = 2 so t = 1 and is included. IF POS DOES NOT FIRE, THE INSTRUMENT
      CANNOT SEE A FORCED DEGREE FALL AND NO NEGATIVE RESULT MAY BE REPORTED
      FROM ANY ARM OF THIS EXPERIMENT.
    graded_control: >-
      GRADE-c for c = 0, 1, ..., 3m - n - 1, giving projective solution
      dimension t = (3m - n - 1) - c. At cell (8,6), 3m - n = 4 so c runs over
      0, 1, 2, 3 and t over 3, 2, 1, 0 - four interior points. At (3,3) and
      (7,5), 3m - n = 3 so c runs over 0, 1, 2 and t over 2, 1, 0 - three
      points. DERIVED EXPECTATION: deficit(d_reg) strictly decreasing in c. A
      non-monotone reading localises the obstruction to a specific solution
      dimension rather than leaving 'it did not work'.
    nearby_object_pairs: >-
      Cells are chosen so that the ladder contains pairs matched on one factor
      and differing in the other: (6,4) and (8,6) have surplus 3m - n = 2 and 4
      at (M,N) = (10,8) and (16,10); (7,5) and (8,6) have frozen d_reg 4 at
      different (M, N). Reporting deficit across these pairs separates 'the
      instrument reads the oil structure' from 'the instrument reads the shape
      of the system'.
    ordering_control: >-
      The COMPLETE null arms - NULL-P and NULL-U, all cells, all seeds -
      are constructed, ranked, hashed and their verdicts recorded and committed
      BEFORE any treatment system is constructed. Absence of that commitment is
      INVALID_MEASUREMENT. The frozen decision rule is executed on NULL-P first;
      if it emits the same label on NULL-P and NULL-U at every cell, the rule
      discriminates nothing on the null side and must be reviewed before the
      treatment arm is read.
    comparability_policy: >-
      The odd-n arm cells (4,3), (5,4), (6,5) may NEVER be pooled with the
      even-n core ladder, in any statistic, because over GF(16) with n odd every
      alternating matrix is singular and L_1, L_2 must come from a different
      construction. Cross-cell aggregation of any kind requires a separately
      registered comparator that names both constructions. No comparison with
      any other experiment in this repository is permitted: there is no prior
      solving-degree measurement on a multivariate system here, and the Boolean
      DREG/SIG lineage measures a different object over a different field with
      non-inert field equations.

  metrics:
    primary:
      - >-
        deficit(D) = sr_pred(D) - rank(Macaulay_D), per arm, per cell, per seed,
        per L-choice, for D = 2..d_reg+1, reported as exact integers with
        sr_pred and rank printed beside it.
      - >-
        d_ff = min{D : deficit(D) > 0}, per arm per cell, and the gap
        d_ff(TREAT) - d_ff(NULL-P).
      - >-
        deficit_ratio(D) = deficit_TREAT(D) / max(1, deficit_NULL-P(D)) at
        D = d_reg - 1, d_reg, d_reg + 1.
    secondary:
      - Nonzero generator count of TREAT, which must be exactly 3m - 2, with the disposition of the two lost forms.
      - Measured projective dimension of the unconstrained solution space against the derived bound 3m - n - 1.
      - Number of trials needed to find two invertible polar-form combinations, per cell per seed.
      - deficit(d_reg) as a function of t across the GRADE arm, with the monotonicity verdict.
      - L-choice spread of deficit(d_reg) per cell, reported BEFORE any treatment-null gap.
      - Seed-to-seed spread of deficit(d_reg) per arm per cell, reported BEFORE any model comparison.
      - NULL-P versus NULL-U deficits side by side at every cell.
      - Macaulay matrix dimensions, nonzero density, wall clock and peak RSS per cell.
      - System hash and per-block pivot receipts for every rank computed.

  preregistered_prediction:
    quantity: >-
      The frozen semi-regular degree d_reg and the derived rank baseline
      sr_pred(D) for each core cell, and the pre-registered gap
      d_ff(TREAT) - d_ff(NULL-P) = 0.
    formula: >-
      H(z) = (1 - z^2)^M / (1 - z)^N with M = 3m - 2 and N = 2n - 3m;
      h_k = [z^k] H(z); d_reg = min{k : h_k <= 0};
      sr_pred(D) = C(N + D, D) - sum over k <= D with h_k > 0 of h_k.
      Frozen values on the core ladder: (3,3) M=7 N=3 d_reg=2; (7,5) M=13 N=9
      d_reg=4; (6,4) M=10 N=8 d_reg=5; (8,6) M=16 N=10 d_reg=4.
    source: >-
      DERIVED IN-REPO, H-UOV-4d1377 mechanism parts P2 and P3, from the Koszul
      relation in degree 4 and the free-resolution count. NOT taken from any
      publication; the primary sources for semi-regular Hilbert series were not
      retrieved and no citation is asserted. The two boundary cases M = 1 and
      M >= C(N+1,2) are checked against the formula at Stage 1 before any use.

  stages:
    - id: stage0_read
      purpose: >-
        Obtain the NIST UOV round-3 specification and the actual text of the
        intersection attack; quote the published equation count, variable count
        and cost formula; record whether they agree with the derivation. Source
        preference order, to be exhausted before any 'sources unobtainable'
        claim: (1) the specification bundle from the team's own site or
        repository, (2) raw.githubusercontent, (3) arXiv, (4) ePrint ABSTRACT
        pages, (5) author-hosted PDFs. ANGLE-BRIEF section 1 measures all of
        these as reachable and only eprint.iacr.org PDF bodies as blocked.
      terminates_run: >-
        Yes, in one direction: if the published system is built differently from
        the derivation, the experiment measures a different object and must be
        relabelled before Stage 3.
      blocking: false
    - id: stage1_arithmetic
      purpose: >-
        Recompute the frozen d_reg and sr_pred tables in committed
        standard-library Python from the series definition, and verify the two
        boundary cases. Zero linear algebra.
      terminates_run: >-
        YES AND IT IS THE CHEAPEST GATE. A disagreement with the frozen table
        means the prediction is wrong and nothing else may run until the record
        is superseded.
      blocking: true
    - id: stage2_structure
      purpose: >-
        At cells (3,3) and (6,4), build a toy UOV key and verify by exact linear
        algebra that P'_a O is contained in O-perp for every a, that
        dim(L_1 O intersect L_2 O) >= 3m - n, that the generator count is
        3m - 2 with exactly two identically-zero forms, and that the witness x*
        satisfies every equation.
      terminates_run: >-
        YES. A failure here refutes H-UOV-4d1377's part P1 or P2 - that is, this
        program's own derivation - at a cost of seconds, and that refutation is
        a more valuable outcome than the measurement it would have preceded.
      blocking: true
    - id: stage3_ranks
      purpose: >-
        Build and rank every arm at every core cell. NULL arms first, committed
        and hashed, then POS and GRADE, then TREAT.
      terminates_run: no
      blocking: false
    - id: stage4_stretch
      purpose: >-
        Optional. The odd-n arm with its declared substitute construction, and
        the stretch cells. Explicitly OUTSIDE the completion gate.
      terminates_run: no
      blocking: false

  replication:
    seeds: [1, 2, 2026]
    independent_instances: 24
    interpretation: >-
      24 = 4 core cells x 3 seeds x 2 L-choices for the treatment arm, with the
      same seed set for each null arm. Two independent L-choices per cell exist
      specifically to test the universal quantifier over L in H-UOV-4d1377's
      quantifier_order; a result that holds for one choice and not the other is
      a distributional statement and must be reported as one.

  budget:
    maximum_runs: 1
    wall_clock_seconds_per_run: 10800
    maximum_wall_seconds: 10800
    maximum_cpu_seconds: 21600
    total_cpu_hours: 6
    maximum_memory_gb: 8
    maximum_peak_rss_bytes: 8589934592
    maximum_total_disk_bytes: 4294967296
    maximum_workers: 1
    no_network: false
    network_note: >-
      Stage 0 requires network access for source retrieval and is the only stage
      that does. Stages 1-4 are strictly offline and any network access during
      them is an invalidation.
    dominant_cost: >-
      Cell (8,6) at D = 5: a 4576 x 3003 GF(16) Macaulay matrix, about 14 MB
      unpacked as uint8, per arm per seed per L-choice. All other core cells are
      an order of magnitude smaller.

  environment_declaration:
    verified_on: '2026-08-05'
    findings:
      - "python3 -c 'import numpy' succeeds; numpy 2.4.6."
      - "python3 -c 'import sympy' fails with ModuleNotFoundError."
      - "python3 -c 'import sage' fails with ModuleNotFoundError."
      - >-
        "sys.path.insert(0,'src'); import ic_first_fall_fast" fails at line 23,
        "from sage.all import GF, Matrix", ModuleNotFoundError.
      - "No Groebner engine, no msolve, no Singular, no fpylll."
    consequence: >-
      The exact GF(16) rank routine, the monomial indexing and the Macaulay
      assembly must all be written for this contract. This is an implementation
      cost, it is budgeted above, and it means the instrument has NO prior
      validation in this repository - which is why Stage 1's boundary cases,
      Stage 2's structural checks and the POS control all gate the measurement.
      This declaration also settles, for this contract only, the environment
      disagreement ANGLE-BRIEF section 5.3 item 1 records between two scouting
      sweeps: numpy is present at 2.4.6, Sage is not.

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, archived and authorized. GOAL-UOV-001 is status draft and no Coordinator approval exists.
    - Stop if Stage 1's in-harness recomputation disagrees with the frozen d_reg or sr_pred tables.
    - Stop if Stage 2 finds P'_a O not contained in O-perp, or the intersection dimension below 3m - n, or a generator count other than 3m - 2, or no witness x*.
    - Stop before any treatment construction if the complete null arms and their digests are absent.
    - Stop a cell as CONSTRUCTION_FAILURE if two independent invertible polar-form combinations are not found within 100 trials.
    - Stop the ladder if peak RSS exceeds 8 GB or wall clock exceeds 10800 s; report cells covered rather than failing the package.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any treatment rank computed before the null arms are committed and hashed.
    - A generator count other than exactly 3m - 2 nonzero forms, or the two losses appearing as duplicates rather than as identically zero polynomials over a characteristic-2 field.
    - A variable count after constraint substitution and dehomogenisation other than exactly 2n - 3m.
    - Any rank whose value does not equal the sum of its per-block new pivots, or any block covered other than exactly once.
    - Any pooling of odd-n arm results with the even-n core ladder.
    - Any adjustment to the frozen protocol clauses of H-UOV-4d1377 after any number has been observed, without a versioned protocol amendment marked exploratory_only.
    - Any network access during Stages 1 through 4.

  success_criterion: >-
    This contract has no current success outcome, because it is not authorized
    for execution. IF a separately approved, frozen and authorized successor is
    executed, its only positive disposition is a COMPLETE AND ADMISSIBLE READOUT,
    defined as all of: (1) Stage 1 reproduces the frozen d_reg and sr_pred
    tables and both boundary cases; (2) Stage 2's structural checks all pass at
    both probe cells; (3) NULL-P reproduces its frozen first-fall degree at
    every core cell and seed; (4) the POS control fires with deficit(d_reg) >= 1
    at every core cell; (5) the GRADE arm is monotone in c at cell (8,6);
    (6) the L-choice and seed spreads are reported BEFORE any treatment-null
    comparison and are strictly smaller than that comparison; and (7) the
    treatment-null gap is reported per cell with its exact integer value.
    A readout satisfying (1)-(7) is admissible WHATEVER the gap turns out to be:
    a gap of 0 at every cell is a CONTROLLED NULL and is the pre-registered
    expected result and a first-class deliverable, and a negative gap at three
    or more cells is a measured departure. Neither establishes any attack, cost,
    exponent, crypto-scale or deployed-parameter conclusion.

  falsification_criterion: >-
    HEUR-UOV-A1 is refuted OVER THE TESTED RANGE ONLY if d_ff(TREAT) is strictly
    below the frozen semi-regular value at three or more of the four even-n core
    cells, at every seed and both L-choices, while NULL-P sits at its frozen
    value at those same cells and the POS control has fired. Any weaker pattern
    is reported as instrument doubt and not as a refutation. Separately, this
    contract's own derivation is falsified by Stage 2 finding the containment or
    the dimension bound to fail, and its own prediction is falsified by Stage 1
    failing to reproduce the frozen tables; both of those outcomes terminate the
    run and are recorded as findings about this program's mathematics rather
    than about UOV.

  infrastructure_failure_disposition: >-
    A timeout, a crash, an out-of-memory condition, a missing dependency, a
    failure to retrieve a source at Stage 0, or a CONSTRUCTION_FAILURE from the
    invertibility search is reported as INFRASTRUCTURE SIGNAL and is NEVER
    negative mathematical evidence, about HEUR-UOV-A1, about UOV, or about
    anything else (AGENTS.md rule 3 and rule 5). In particular, an inability to
    complete cell (8,6) within budget reduces the ladder to the cells actually
    covered and the conclusion is scoped to those cells; it does not weaken the
    heuristic and it does not license a statement about the uncovered cells.

  scale_relevance:
    tier: toy
    justification: >-
      Conclusions do NOT transfer across scale and the contract says so rather
      than arguing that they might. The tested cells have m <= 6 and q = 16; the
      recalled deployed sets have m = 44 to 96 and q = 16 or 256, with d_reg 20
      to 37 and Macaulay matrices of 2^72 to 2^144 columns that can never be
      built. What the toy ladder CAN show is a trend: deficit as a function of
      cell size across (3,3), (6,4), (7,5), (8,6). A trend moving with size is a
      positive reason to refuse the extrapolation; a flat trend is weak support
      and must be described as weak. The extrapolation itself is carried
      explicitly as HEUR-UOV-A3 and is DECLARED UNMET by this contract.
    correspondence: null

  tail_checks:
    - >-
      Verify that the witness x* lies in the kernel of the Macaulay matrix's
      evaluation map at every degree, independently of the rank computation. A
      rank routine that loses the known solution is broken regardless of what
      its numbers look like.
    - >-
      Verify sr_pred(D) <= C(N + D, D) and rank(D) <= min(rows, cols) at every
      cell and degree; a deficit outside [0, sr_pred(D)] is an arithmetic error,
      not a measurement.
    - >-
      Recompute the rank of the smallest cell (3,3) by a second, independent
      method - brute-force row reduction with a different pivot order - and
      require exact agreement.
    - >-
      Report the extreme cell: the single largest deficit observed anywhere,
      with its arm, cell, seed and L-choice, so that an outlier is visible
      rather than absorbed into a median.

  required_artifacts_if_later_authorized:
    - The frozen approved specification and a freeze receipt binding its SHA-256.
    - The Stage-1 arithmetic transcript, including the boundary-case checks and the recomputed d_reg and sr_pred tables.
    - The Stage-2 structural transcript for both probe cells, with the containment and dimension checks shown.
    - Construction transcripts per cell and seed: O', P1, P2, P3, the polar forms, the invertibility trial count, L_1, L_2, the imposed constraints, and the witness x*, each with a SHA-256 digest.
    - The null-before-treatment commitment with digests, timestamped before any treatment construction.
    - Per-arm, per-cell, per-degree rank records with sr_pred, deficit, block receipts and the system hash.
    - The GRADE arm table with the monotonicity verdict, and the POS arm's fired/not-fired verdict.
    - Environment record, command lines, stdout, stderr, wall clock, peak RSS, and the run manifest with field_bits recorded.
    - An execution report naming every stage that terminated early and why.

  outcomes:
    no_execution_authorization: >-
      THIS IS THE ONLY CURRENT DISPOSITION. A review_required draft; no run, no
      observation, no evidence, no inference.
    future_controlled_null: >-
      Only after separate approval, freezing, authorization and a valid
      execution meeting all seven success conditions. Scoped to the four even-n
      core cells over F_16 and to this instrument lineage.
    future_measured_departure: >-
      Only under the falsification_criterion above. Would be routed to
      independent validation and red team before any evidence record is written,
      and would still assert nothing about a deployed parameter set.
    structural_refutation: >-
      Stage 2 refutes this program's own derivation. Recorded as a correction
      superseding H-UOV-4d1377 and the three paired proposals.
    infrastructure_or_integrity_failure: >-
      Inconclusive infrastructure signal, never evidence for or against
      HEUR-UOV-A1 or any UOV proposition.

  approval_requirements:
    - Independent review confirms the derivation of M = 3m - 2 and N = 2n - 3m, the frozen d_reg table, and the char-2 even-n restriction on the cell list.
    - Independent review confirms that NULL-P is the correct matched null and that its forced value can actually fail.
    - Coordinator separately approves and freezes a contract without editing this draft.
    - A separate execution authorization is granted after the approved frozen package is delivered.
  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
