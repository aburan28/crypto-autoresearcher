    serialized_from: experiments/EXP-OIFP-0ca0c9/runs/RUN-OIFP-003/manifest.json
    source_sha256: da19b16c26c1dae96025ef4aa369d9bf63969d87eb9575c5c40010c18e5a09a8
    serialized_by: executor
    serialized_at: '2026-08-05'
    method: >-
      Field-by-field transcription only. No value was recomputed,
      re-derived or supplied from outside this run directory.
