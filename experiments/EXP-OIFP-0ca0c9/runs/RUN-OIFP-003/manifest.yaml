  # This package is SPARSE: it contains only manifest.json and
  # collision_table.json, and manifest.json is the thinnest of the three
  # OIFP manifests -- it carries no git block, no runtime block and no
  # inference block at all. Every value below is transcribed from those two
  # files; everything else is an explicit null with a note. Nothing is
  # reconstructed, inferred, or estimated.
  # ------------------------------------------------------------------
