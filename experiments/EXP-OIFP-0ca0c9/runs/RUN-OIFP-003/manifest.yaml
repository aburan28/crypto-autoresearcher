      - environment (no environment record of any kind)
      - inputs.seed
      - timing.started_at
      - timing.finished_at
      - timing.wall_seconds
      - resources.peak_rss_bytes
      - resources.cpu_seconds
      - result.certificate (no certificate block is recorded)
