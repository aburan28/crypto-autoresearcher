        wall-clock budget. NOT negative evidence against OIFP MITM.
      unexpected_observation: >-
        Most random ordinary prime-order curves at bits=20 have very small
        3-isogeny classes (2-8 nodes), giving trivially fast MITM. Larger
        classes (309, 384 nodes) appeared in 2/20 reps and gave 13-17 step
        collisions.
    metrics_source: manifest.json result (verbatim)
    collision_table_cross_check:
      note: >-
        collision_table.json in this directory records the same bits=20
        aggregates and adds the per-replication detail. Transcribed here so
        the agreement is visible.
      bits_20:
        completed_reps: 20
        exhausted_reps: 0
        mean_collision_steps: 2.4
        median_collision_steps: 1.0
        min_collision_steps: 1
        max_collision_steps: 17
        ratio_mean_over_pred: 0.075
      recorded_anomalies:
        - description: >-
            Most random ordinary prime-order 20-bit curves have very small
            3-isogeny classes (2-8 nodes, not O(sqrt(p)) ~ 1024). Only reps
            4 (class=384) and 8 (class=309) had meaningfully larger classes.
          implication: >-
            Selection pressure toward small discriminants in random curve
            generation. Class sizes observed do not represent the full h(D)
            ~ sqrt(p) scale stated in the specification prediction.
        - description: >-
            bits=40 first rep found class_size=4730 (partial enumeration
            stopped at 30s budget). The 10000-step BFS MITM did not find a
            collision in that partial class, causing resource_exhaustion.
          implication: >-
            At bits=40, the isogeny class enumerator and MITM BFS are both
            compute-limited at 300s per-rep budget. A faster random-walk
            MITM with distinguished points would be needed.
