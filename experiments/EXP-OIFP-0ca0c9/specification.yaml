experiment:
  id: EXP-OIFP-0ca0c9
  hypothesis_id: H-OIFP-097d1a
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-003
  version: 1
  title: Ordinary OIFP MITM collision cost measurement at toy prime fields
  status: review_required
  frozen: false
  claim_tier: toy
  confirmatory_status: exploratory
  objective: >-
    Measure the actual collision step count for ordinary OIFP birthday MITM at bits=20 and
    bits=40. Compare to the theoretical O(p^{1/4}) prediction. Confirm that both endpoints
    (E and E') are given explicitly and the backward walk starts at E'.
  metrics:
    primary:
      - collision_steps (number of isogeny evaluations to find collision)
    secondary: []
  metrics_basis: >-
    Schema slot filled under DEC-20260805-7b3e91 (RUL-12) from this contract's own
    committed text. The quantity is named in preregistered_prediction.quantity and
    again in the success_criterion and falsification_criterion, both stated in
    terms of "Mean collision steps". Nothing new is measured or claimed.
  preregistered_prediction:
    quantity: collision_steps = number of isogeny evaluations to find collision
    formula: O(sqrt(h(D))) ~ p^{1/4} isogeny steps
    source: BATCH-055 OIFP analysis; CSI-FiSh 2020 known complexity
  controls:
    - id: CTRL-RANDOM-WALK-BASELINE
      description: >-
        For a RANDOM walk on a graph of the same size h(D) and degree ell+1
        (not the isogeny graph), measure the collision step count.
        Expected: same O(p^{1/4}) by birthday paradox — but the isogeny graph's
        ALGEBRAIC STRUCTURE might give early termination at algebraic coincidences.
      expected_outcome: collision_steps ≈ p^{1/4} (same as isogeny MITM)
    - id: CTRL-KNOWN-ISOGENY-PATH
      description: >-
        For a PLANTED pair (E, E') where a short explicit isogeny path is known
        (e.g., E' = phi(E) for a known ell-isogeny phi), verify the MITM finds the
        collision in at most 1 step in the forward direction.
      expected_outcome: "MITM finds collision at step 1 (forward: E' is step 1 from E)"
  inputs:
    bits: [20, 40]
    replications: 20
    ell: 3
    seed: 2026080456
  success_criterion: >-
    Mean collision steps < 4 * p^{1/4} at bits=20 (< 4 * 2^5 = 128 steps) and
    bits=40 (< 4 * 2^10 = 4096 steps).
  falsification_criterion: >-
    Mean collision steps > 10 * p^{1/4} at either bit size.
  claim_ceiling: >-
    Toy-tier collision cost measurements at bits={20,40}. NOT claimable: sub-L[1/2]
    asymptotics at crypto scale; H-OIFP-097d1a status above analyzed; any ECDLP claim.
  budget:
    wall_clock_seconds_per_run: 300
    total_cpu_hours: 2
    maximum_memory_gb: 8
  required_artifacts:
    - experiments/EXP-OIFP-0ca0c9/specification.yaml
    - experiments/EXP-OIFP-0ca0c9/runs/RUN-OIFP-001/manifest.json
    - experiments/EXP-OIFP-0ca0c9/runs/RUN-OIFP-001/collision_table.json
