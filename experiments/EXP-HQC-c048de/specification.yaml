# EXPERIMENT CONTRACT -- EXP-HQC-c048de (review_required, unapproved, zero runs).
experiment:
  id: EXP-HQC-c048de
  hypothesis_id: H-HQC-df7fb2
  derived_from_idea: IDEA-20261018-169104
  question_id: RQ-HQC-001
  goal_id: GOAL-HQC-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Capped ISD curves
  objective: Do low-memory curves hold at reduced n?
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: C ISD suite with caps
    parameters: n in {101,163,257}; caps 2^10,2^14,2^18; 100 instances per cell
    procedure: 1. Run each algorithm at each cap. 2. Compare to predictions. 3. Find crossover.
  controls:
  - 'null: uncapped run equals standard cost'
  - 'positive: cap at 2^4 where cost must blow up as predicted'
  - 'A/A: same cap two seed blocks'
  independent_variables:
  - algorithm
  - memory_cap
  metrics:
    primary:
    - log2 ops deviation
    secondary:
    - crossover cap
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: ops at cap
    formula: KN-LIT-5677ae formulas at reduced parameters
    source: KN-LIT-5677ae
  scale_relevance:
    tier: toy
    justification: 'n reduced; transfer: curve shape'
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 40
    maximum_memory_gb: 16
    maximum_runs: 36
  stopping_rules:
  - 100 instances per cell
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - unsolved within 2^40 ops censored
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    Success if C3 deviation <= 1.5 bits beyond the AA1 noise floor (P1) and C1/C2 crossover
    within 1 doubling (P2).
  falsification_criterion: Falsified if C3 deviation > 3 bits or crossover > 2 doublings off.
  decision_impact:
    on_positive: Adopt the validated curves in the memory-charged baseline.
    on_negative: Correct the low-memory curves with measured constants.
  variable_ledger:
    independent:
    - name: algorithm
      levels:
      - stern
      - mmt
    - name: memory_cap
      levels:
      - 2^10
      - 2^18
    factors:
    - name: seed_block
      treatment: randomized
      value: seed blocks A and B, disjoint master seeds
      how: >-
        two disjoint master seeds derived by SHAKE256 from a frozen label; every arm run under
        both
    comparisons:
    - id: C1
      arms:
      - mmt 2^10
      - mmt 2^18
      differs_in:
      - memory_cap
      design: one_factor
    - id: C2
      arms:
      - stern 2^10
      - mmt 2^10
      differs_in:
      - algorithm
      design: one_factor
    - id: C3
      arms:
      - measured vs predicted all
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - stern 2^14 seed-block A
      - stern 2^14 seed-block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-169104.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-169104.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml with frozen parameters, seeds, code commit and tool versions
  - raw-result.json with per-trial records and verification flags
  - ops CSV
  - curve SVG
  - PDF
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-HQC-c048de/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-169104.
    standing_authorization: >-
      AGENTS.md 'Standing user authorization' lets the Coordinator approve once the contract
      is complete and runnable; no user re-approval is required.
