experiment:
  id: EXP-SSIQ-ff61bc
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-SSIQ-fe47d7
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  batch_id: null
  assigned_to: executor
  title: >-
    Review-required contract: zero-compute p^{1/4} necessary-condition
    certificate (N1-N4) applied to every named sub-1/3 route under
    GOAL-SSIQ-001, with two known-answer gates and the N1/N3 duality check

  objective: >-
    If separately approved, frozen and authorized, perform the pen-and-
    paper audit that IDEA-20260807-edb3f3 and H-SSIQ-fe47d7 specify: derive
    the certificate vector (k, r, beta, u) as claimed or implied by each
    named sub-1/3 route under this goal, evaluate N1-N4 against it, run the
    two known-answer gates (incumbent, classical meet-in-the-middle) before
    trusting any route's row, and compute the N1/N3 duality check on any
    route claiming to combine family enlargement with tail exploitation.
    This contract is an instrument design and a pre-execution declaration.
    No run has happened.

  what_this_is_not:
    - Not an attack, not a solve, not an algorithm, not a certificate of any route's correctness.
    - Not a claim that any named route achieves, or is close to achieving, exponent p^{1/4}.
    - Not a re-derivation of the 3/8 coincidence; that arithmetic is CITED to IDEA-20260805-250e50/H-SSIQ-90e07b throughout and this contract computes no new instance of it.
    - Not a sufficiency argument: a route passing all four conditions is NOT thereby shown to achieve p^{1/4}; it is promoted to a designed experiment under a separate future handoff.
    - Not an approval, a freezing, an execution authorization, a run, an observation, or evidence.
    - Not a reopening of any CLOSED lever (e.g. L1, CLOSED-IN-SCOPE) or of GOAL-SSI-001's Deuring-dichotomy closure; the audit reads those verdicts, it does not revise them.

  claim_ceiling:
    tier: medium
    exact_scope_a_run_could_support: >-
      MEDIUM (a decision procedure over the lever map; no measurement). A
      completed run could support, at most: (1) that the certificate
      reproduces exponent 1/3 on the incumbent and 1/2 on classical
      meet-in-the-middle; (2) a PASS/FAIL/UNRESOLVED table over every named
      sub-1/3 route under this goal, each row with its one-line arithmetic;
      (3) the N1/N3 duality check's combined-deficit figure for any route
      claiming both axes. NOTHING ELSE. In particular, no outcome may be
      quoted as evidence that any specific route achieves p^{1/4}, as a
      lower bound on any architecture outside list-and-close, or as a
      re-derivation of the 3/8 figure independent of its cited source.

  inputs:
    named_route_list:
      construction: >-
        Enumerate, at freeze time, every route named under GOAL-SSIQ-001's
        lever map as of the most recent committed goal checkpoint: levers
        L1-L5, N5, A1-A7, and every catalogue entry in the C1/C2/Q3 slices
        of ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/ that names a
        specific mechanism for reducing the time exponent below 1/3. The
        list is CLOSED before any row is audited; a route surfacing after
        freeze is recorded as a versioned amendment, not silently added.
      exclusions: >-
        Routes already CLOSED-IN-SCOPE (e.g. L1) are included in the table
        with their existing closure verdict carried forward, not re-
        derived, and are marked NOT RE-OPENED.
    certificate_definitions:
      k: "size of the closable target family"
      r: "guaranteed covering radius"
      beta: "amortised per-entry check exponent"
      u: "smoothness parameter of the split at radius r, u = log p / (r_exponent * log B)"
    known_answer_gates:
      incumbent_gate:
        radius: p^{1/3}
        forced_result: "k=1, beta=0, N1-N4 all PASS, exponent exactly 1/3"
      mitm_gate:
        rank: 4
        forced_result: "k=1, exponent exactly 1/2"
    n1_n3_ball_count_identity:
      source: >-
        ledger/evidence/EV-SSIQ-e43afd.yaml observation O-6 (rank-3
        trace-zero sublattice, discriminant asymptotic to p), CITED not
        re-derived, identical to the identity IDEA-20260805-250e50 STEP 3
        already uses.
      formula: "ball count / total curves ~ T^{3/2} p^{-1/2}"
    cited_3_8_source:
      proposal: ledger/proposals/IDEA-20260805-250e50.yaml
      hypothesis: ledger/hypotheses/H-SSIQ-90e07b.yaml
      value: "E(1/4, 0, 1/4) = 3/8"
      citation_discipline: >-
        Every appearance of the value 3/8 in any artefact produced under
        this contract MUST carry this citation inline. An artefact stating
        3/8 without the citation is a defect and is corrected before
        archival, not silently accepted.

  arms_and_controls:
    treatment: >-
      The full PASS/FAIL/UNRESOLVED table: one row per named route, with
      the route's stated or derivable (k, r, beta, u), the N1-N4 evaluation
      against it, and the one-line arithmetic justifying each verdict.
    known_answer_gate_incumbent: >-
      Certificate applied to (k, r, beta, u) = (1, p^{1/3}, 0,
      log p/(3 log B)). MUST return N1-N4 all PASS and exponent exactly
      1/3. Computed and hash-committed BEFORE any named route's row is
      read.
    known_answer_gate_mitm: >-
      Certificate applied to the rank-4 meet-in-the-middle case, k = 1.
      MUST return exponent exactly 1/2. Computed and hash-committed
      alongside the incumbent gate, before any named route's row is read.
    duality_control: >-
      For every named route whose own record claims BOTH family enlargement
      (an N1-axis argument) AND tail/re-randomisation exploitation (an
      N3-axis argument), compute the combined deficit as the product of the
      route's stated family-size deficit and its stated tail-exponent
      deficit, and compare against the forced floor p^{1/8}. FORCED
      PREDICTION: combined deficit >= p^{1/8} for every such route (STEP 5
      of H-SSIQ-fe47d7). A route with combined deficit strictly below
      p^{1/8} is the falsifier F7-d outcome and is flagged for immediate
      independent review, not silently recorded as a PASS.
    scope_control: >-
      Any named route using an architecture other than list-and-close
      (relation collection, descent, higher-dimensional embeddings) is
      marked NOT APPLICABLE, never scored PASS or FAIL, per the
      quantifier_order and method_ceiling of H-SSIQ-fe47d7.
    ordering_control: >-
      Both known-answer gates are computed, hash-committed, and reported
      BEFORE any named route's certificate values are evaluated. If either
      gate fails, the audit halts and no route is scored.
    comparability_policy: >-
      No verdict from this contract may be cited as establishing that any
      route achieves, or does not definitively rule out achieving, p^{1/4}
      -- the certificate is necessary, never sufficient, and this must be
      stated on every citation of any row in this table.

  stages_cheapest_first:
    - id: stage-0-gate-derivation
      cost: "zero compute, ~1 h"
      content: >-
        Derive the incumbent and MITM known-answer gates symbolically;
        confirm each returns its forced exponent.
      can_terminate_run: true
      termination_rule: >-
        A gate failing its forced value ends the contract here with zero
        compute spent; the certificate is void.
    - id: stage-1-route-enumeration
      cost: "zero compute, ~1 h"
      content: >-
        Enumerate the closed, pre-registered list of every named sub-1/3
        route under GOAL-SSIQ-001 as of freeze, with a pointer to the
        record where each route is defined.
      can_terminate_run: false
      termination_rule: >-
        A route whose own record does not state enough to identify
        (k, r, beta, u) is listed with UNRESOLVED and the specific missing
        field named, never guessed.
    - id: stage-2-per-route-audit
      cost: "zero compute, ~1 day total across all routes"
      content: >-
        For each route, evaluate N1-N4 against its (k, r, beta, u), record
        PASS/FAIL/UNRESOLVED with the one-line arithmetic, and run the
        duality control where applicable.
      can_terminate_run: false
      termination_rule: >-
        Any single route passing all four conditions triggers an immediate
        stop-and-flag for rule-12 review before the remaining routes are
        audited, per falsifier F7-b; auditing of the remaining routes may
        continue in parallel but the flagged route's review is not delayed
        by it.

  metrics:
    primary:
      - "gate_incumbent_result: (k, r, beta, u, exponent) for the incumbent certificate application."
      - "gate_mitm_result: (k, exponent) for the classical meet-in-the-middle certificate application."
      - "route_verdicts: list of (route_id, k, r, beta, u, N1, N2, N3, N4, verdict, arithmetic) per named route."
      - "duality_check_results: (route_id, family_size_deficit, tail_exponent_deficit, combined_deficit, floor_p_1_8, pass_fail) for every route claiming both axes."
    secondary:
      - "not_applicable_routes: list of routes scoped out for using a non-list-and-close architecture."
      - "unresolved_routes: list of routes with an insufficiently specified certificate, and the missing field."
      - "citation_audit: count of every appearance of the value 3/8 in produced artefacts and confirmation each carries the required citation."

  heuristic_under_test: HEUR-SSIQ-Q37-1

  preregistered_prediction:
    quantity: >-
      (i) the incumbent and MITM gate results; (ii) the PASS/FAIL/UNRESOLVED
      distribution over the named route list; (iii) the duality check's
      combined-deficit figure for every route claiming both axes.
    formula: >-
      (i) incumbent gate returns (1, p^{1/3}, 0, log p/(3 log B)) with
      exponent exactly 1/3; MITM gate returns (1, exponent) with exponent
      exactly 1/2, both forced. (ii) PREDICTED (P-a in the source catalogue
      entry, restated here as a prediction not an assertion): every
      sub-1/3 route named under this goal to date fails at least one of
      N1-N4, identifiably without compute -- but any single PASS is an
      equally valid, more consequential, and immediately actioned outcome.
      (iii) combined deficit >= p^{1/8} for every duality-eligible route,
      forced by the shared ball-density identity (STEP 5).
    source: >-
      Derived in H-SSIQ-fe47d7 (mechanism STEPS 1-6) and
      IDEA-20260807-edb3f3, transcribing
      ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/Q3.md section "Q3-7". The
      3/8 corroboration is cited to IDEA-20260805-250e50/H-SSIQ-90e07b, not
      re-derived here.

  scale_relevance:
    tier: medium
    justification: >-
      Every operation in this contract is symbolic and zero-compute: it
      applies exact arithmetic (Hermite-type ball counts, exchange-rate
      products) to already-stated or already-derivable route parameters. It
      is not a toy-scale empirical measurement, but it is also not a proof
      of any unconditional lower bound -- hence medium tier, matching the
      catalogue source's own stated ceiling for this entry, never raised.
    correspondence: null

  tail_checks:
    - >-
      Degenerate-radius check: applying the certificate at r = p^{1} (no
      restriction at all) must return k = 1, beta = 0, N1-N4 trivially
      satisfied, and exponent equal to the unrestricted list cost -- a
      sanity boundary that must pass before any interior radius is trusted.
    - >-
      Route re-audit: re-run the audit on the incumbent and MITM cases a
      second time from a re-read of their own source records (not from the
      Stage 0 derivation's cached numbers) and confirm the same verdict --
      this is the certificate's own re-read discipline, matching this
      goal's standing repair adopted after GD-6.
    - >-
      Citation conservation: every occurrence of "3/8" in any produced
      artefact must trace to an inline citation of
      IDEA-20260805-250e50/H-SSIQ-90e07b; an uncited occurrence is treated
      as invalid_measurement for that artefact.

  replication:
    seeds: []
    independent_instances: 1
    interpretation: >-
      This contract is a deterministic symbolic audit with no random
      sampling; "replication" here means the re-audit tail check above
      (a second independent re-derivation of the two known-answer gates
      from source, not a second random draw). Any divergence between the
      two derivations is an implementation defect in the audit procedure,
      not a distribution.

  budget:
    wall_clock_seconds_per_run: 0
    total_cpu_hours: 0
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    note: >-
      Zero compute throughout; the "budget" here bounds analyst wall-clock
      (Stage 0 ~1h, Stage 1 ~1h, Stage 2 ~1 day across all routes), tracked
      outside this machine-resource block per this goal's SC-3-adjacent
      practice of never inventing a compute figure for a zero-compute
      contract.

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, and authorized under a dispatched batch.
    - Stop before any named route is scored if either known-answer gate is not hash-committed first.
    - Stop the whole package if either known-answer gate fails its forced value.
    - Immediately flag for rule-12 review, without halting the remaining audit, if any route passes N1-N4 (falsifier F7-b).
    - Stop and flag for review, without halting the remaining audit, if the duality check on any route returns combined deficit below p^{1/8} (falsifier F7-d).
    - Record what was covered rather than truncating silently if the route enumeration cannot be completed within the declared analyst-time budget.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any change to the named-route list, the N1-N4 definitions, or the duality floor after any row has been scored.
    - Any row scored PASS or FAIL without the one-line arithmetic recorded.
    - Any appearance of the value 3/8 without its required citation.
    - Any assertion, anywhere in a produced artefact, that a route passing N1-N4 thereby achieves or is shown to be near p^{1/4}.
    - Absence of the pre-scoring hash commitment of both known-answer gates.
    - Re-deriving the 3/8 figure as if it were new content of this contract rather than a cited corroboration.

  success_criterion: >-
    This contract has no current success outcome because it is not
    authorized for execution. IF a separately approved, frozen successor is
    executed, its only positive disposition is: both known-answer gates
    reproduce their forced values exactly; every named route on the closed
    list receives a PASS/FAIL/UNRESOLVED/NOT-APPLICABLE verdict with its
    arithmetic; the duality check is computed for every eligible route; and
    the full table is reported regardless of which way any individual row
    falls, including a route that passes all four conditions (which routes
    to rule-12 review rather than closing the line). A TABLE IN WHICH EVERY
    ROUTE FAILS AT LEAST ONE CONDITION IS A FULLY SUCCESSFUL, INFORMATIVE
    OUTCOME, EXPLICITLY NAMED AS SUCH BY THE SOURCE CATALOGUE ENTRY'S OWN
    FALSIFIER TEXT (F7-b), AND MUST NOT BE REPORTED AS A NULL RESULT.

  falsification_criterion: >-
    H-SSIQ-fe47d7 is falsified, in whole or in the named part, by any of:
    (F7-a) the incumbent gate returns anything other than exponent 1/3, or
    the MITM gate anything other than 1/2 -- certificate void, no route
    scored; (F7-c) a named route is exhibited that achieves p^{1/4} while
    failing N1 or N3 -- the architecture scoping is wrong and the source's
    section-0.3 identity needs a fifth parameter, named in the source
    catalogue entry as the single most valuable possible outcome; (F7-d) a
    duality-eligible route's combined deficit is measured strictly below
    p^{1/8} -- the "same computation twice" claim is wrong and must be
    withdrawn by a superseding record. (F7-b), a route passing all four
    conditions, is EXPLICITLY NOT a falsification -- it is the certificate's
    confirmation and is routed to further work, per H-SSIQ-fe47d7's own
    text.

  outcomes:
    no_execution_authorization: >-
      The only current disposition: a review_required draft. No run, no
      observation, no evidence, no inference.
    future_complete_readout: >-
      Only after separate approval, freezing, authorization, and valid
      execution under a dispatched batch; scoped medium-tier and never a
      claim that any specific route achieves or nears p^{1/4}.
    infrastructure_or_integrity_failure: >-
      Because this is a zero-compute symbolic audit, the only
      infrastructure failure mode is an inability to locate or read a
      named route's own source record; that route is then recorded
      UNRESOLVED with the missing artefact named, which is INFRASTRUCTURE
      SIGNAL and never a FAIL verdict for that route (AGENTS.md rule 5).

  required_artifacts:
    - Frozen approved specification with a freeze receipt binding its SHA-256.
    - The Stage 0 gate-derivation note with both proofs, and the reviewer's attack recorded.
    - The closed, dated, pointer-linked route-enumeration list from Stage 1.
    - The full PASS/FAIL/UNRESOLVED/NOT-APPLICABLE table with per-route arithmetic.
    - The duality-check table for every eligible route.
    - The citation audit confirming every 3/8 occurrence is cited.
    - Manifest, environment, exact analyst-time log, timestamps.
    - Snapshot archive followed by independent validation and red-team review.

  approval_requirements:
    - Independent review confirms both known-answer gate derivations before any route is scored.
    - Independent review confirms the closed route list is actually closed (no in-scope route omitted) and that the scope control correctly excludes non-list-and-close architectures.
    - Coordinator separately approves and freezes a successor contract without editing this draft.
    - A dispatched batch under GOAL-SSIQ-001 (or a successor goal) exists to carry the audit.

  approval_status: >-
    Pending review. No approved_by field is present because this draft is
    not approved and only the Coordinator may approve it (AGENTS.md rule 1).
