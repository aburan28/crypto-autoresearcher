        disclosed in advance in section 11. The harness is not modified.
    - id: O-9
      note: >-
        No linear system is assembled and no solve is attempted. The rank
        deficiency of either arm's matrix is not measured. Nothing here shows a
        solvable system exists at any cell.
    - id: INT-BATCH012-F
