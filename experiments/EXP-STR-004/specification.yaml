      cell_groups:
        ladder_ten_at_CURVE_J12S1_m2: [L12, L13, L24, L25, L48, L49, L96, L97, L192, L193]
        L0_residue_zero_five: [L12, L24, L48, L96, L192]
        L1_residue_one_five: [L13, L25, L49, L97, L193]
        cross_curve_two_at_CURVE_J16S3_m2: [X96, X97]
        arity_two_at_CURVE_J12S1_m3: [A12M3, A13M3]
        residue_zero_seven: [L12, L24, L48, L96, L192, X96, A12M3]
        residue_one_seven: [L13, L25, L49, L97, L193, X97, A13M3]
      why_this_ladder: >-
        A DOUBLING LADDER WITH A MATCHED PLUS-ONE COMPANION AT EVERY RUNG. The
        doubling gives a sixteen-fold range of B at a FIXED curve, which is the
        independence-of-B lever that no committed artifact in this lineage has
        ever pulled - EV-STR-003 tied B to the curve by B = ceil(isqrt(n)), so B
        and the curve moved together and neither was isolated. The plus-one
        companion gives the residue contrast - `_build_phi_invariant_factor_base`
        returns xs[:B], so at B = 3q + 1 the last phi-orbit is TRUNCATED to a
        single element whose phi-image is not in F, while at B = 3q the factor
        base is a clean union of q whole orbits. B mod 3 is therefore the one
        structural variable separating a phi-invariant factor base from an
        almost-phi-invariant one, and it is varied at every rung rather than
        confounded with size.
      why_only_two_cross_curve_cells: >-
        Two is enough to detect a gross curve dependence and more would buy
        proportionally more compute for a question this contract does not
        primarily ask. IF X96 OR X97 DISAGREES WITH ITS CURVE-J12S1 COUNTERPART
        L96 OR L97, THAT IS A FINDING TO REPORT AND IT BOUNDS EVERY LADDER
        STATEMENT TO ONE CURVE. That consequence is stated here, in advance.
      why_only_two_arity_cells: >-
        EV-STR-003's boundaries clause records in terms that nothing in it
        extends to arity m = 3, because all sixteen of its cells ran at m = 2.
        Two m = 3 cells at the smallest rung remove that as a TOTAL blind spot at
        a cost the relation-collection loop can bear, since the committed m = 3
        branch at endomorphism_la.py lines 305-339 is a quadruple loop over the
        factor base whose cost grows like B squared per target. TWO CELLS DO NOT
        ESTABLISH m = 3 BEHAVIOUR and this contract says so; they establish
        whether the m = 2 pattern survives at all at m = 3 on those two cells.
      residue_two_is_out_of_scope: >-
        No declared cell has B mod 3 = 2. The derivation note defines the
        predicted set only for B mod 3 in {0, 1} and says so; nothing in this
        contract extends to B mod 3 = 2, where the truncated tail is partially
        closed under the phi-image map and the arithmetic differs.
    matched_base_row_budget:
      definition: >-
        R_base(B) = ceil(B / 3) + 1, computed as (B + 2) // 3 + 1. IT IS A
        FUNCTION OF B ALONE AND IS IDENTICAL ACROSS THE TWO ARMS AT EVERY CELL.
        Both arms collect their own base rows with the identical committed call
        and then TRUNCATE the list to exactly the first R_base(B) rows before any
        closure is applied. No other quantity of this contract depends on the
        arm.
      why_this_value: >-
        Two requirements fix it and nothing else does. (i) The committed
        `_measure_displacement_rank` takes its SQUARE branch, which is the branch
        the derivation note analyses, only when the final row count is at least
        B; an unconditional closure emits 3 rows per base row, so 3 * R_base >= B
        is required, i.e. R_base >= ceil(B / 3). (ii) The `+ 1` is one spare
        sigma-orbit triple, so that a shortfall of ONE base row still leaves
        3 * ceil(B / 3) >= B rows and the square branch survives to be measured
        and reported rather than silently becoming a rectangular-branch
        measurement of a different quantity. A shortfall of two base rows loses
        the square branch and invalidates the cell under IV-6.
      truncation_is_declared_not_incidental: >-
        Rows beyond the first R_base are DISCARDED before the closure and enter
        no measurement. Because `_collect_relations` returns its rows in a
        deterministic order, the first R_base rows are a PREFIX and are therefore
        IDENTICAL for every collection quota Q large enough to reach them. The
        measured object is consequently invariant to Q above the shortfall
        threshold, and that invariance is a design property this contract asserts
        and the Executor records (assertion `prefix_invariance_note`).
      shortfall_disposition: >-
        If either arm collects fewer than R_base(B) base rows at a cell, that is
        a SHORTFALL. It is recorded NAMING THE CELL AND THE ARM in the run
        record, in results/sweep_summary.json and in results/run_index.json; the
        cell is EXCLUDED from the comparative criteria (F-4, and F-3 and F-5 for
        the affected arm) with the exclusion stated in the summary; and the
        verdict is `incomplete`. THE ARMS ARE NEVER RE-BALANCED AFTER THE FACT -
        the driver does not top one arm up, does not trim the other down to
        match, and does not re-run a cell with a different budget.
    collection_quota:
      definition: >-
        Q(B) = max(60, B + 10), passed as the `num_targets` argument of
        _collect_relations. Per cell - 60 at B in {12, 13, 24, 25, 48, 49}, 106
        at B = 96, 107 at B = 97, 202 at B = 192, 203 at B = 193.
      why_a_floor_of_60_and_why_it_is_declared_in_advance: >-
        The committed collection loop at endomorphism_la.py:269 hardwires its
        candidate-target allowance at 5 * num_targets and breaks as soon as
        num_targets rows exist, so the quota controls BOTH the stopping point and
        the search allowance and they cannot be set separately without modifying
        the harness, which is forbidden. The committed form max(10, B + 10) would
        give only 110 candidate targets at B = 12, and the two-summand hit rate
        falls with B - EV-STR-003 measured hits/attempts = 15/27 at B = 27 on
        this same curve - so at the smallest rungs the committed quota leaves too
        few candidate targets to make R_base(B) base rows probable. THE FLOOR OF
        60 IS CHOSEN BEFORE ANY CELL IS MEASURED, FOR THAT REASON, AND IT CANNOT
        AFFECT WHICH ROWS ARE MEASURED because the measured rows are a prefix
        (see `truncation_is_declared_not_incidental`). It is not a threshold, not
        a criterion and not a fitted quantity.
    shift_operators:
      sigma: >-
        THE POSITIONAL BLOCK-OF-3 PERMUTATION, identical to the matrix Z built at
        harness/endomorphism_la.py lines 174-183 for shift_type "phi" -
        sigma(3j + k) = 3j + ((k + 1) mod 3) for 3j + k < 3 * (B // 3), and
        sigma(i) = i for i >= 3 * (B // 3). Its action on a row is written
        (sigma . v)[sigma(i)] = v[i]. Both arms declare shift `phi` and both are
        measured under this one operator.
      phi_image_map: >-
        THE COMMITTED MULTIPLICATIVE MAP used inside the append block at
        endomorphism_la.py lines 292-304 and 341-351 - for each set coordinate
        idx of a row, take x = factor_base[idx], form
        shifted_x = pow(zeta3, shift, p) * x % p, and set the coordinate
        factor_base.index(shifted_x) if and only if shifted_x is in the factor
        base. WHEN shifted_x IS NOT IN THE FACTOR BASE THE COORDINATE IS SILENTLY
        DROPPED. This map and sigma coincide as index maps exactly when the
        factor base is a clean union of phi-orbits, which is exactly when
        B mod 3 = 0; the derivation note derives that statement.
      alternate_shift_is_deliberately_not_measured: >-
        The seeded random shift of endomorphism_la.py lines 185-193 is NOT
        measured here. EXP-STR-003 measured it as CTRL-4 to supply a
        one-variable comparison its arm C could not express; this contract's two
        arms already share one shift operator, so a second operator would double
        the O(B^3) measurement cost and feed no criterion. Recorded as a
        deliberate exclusion rather than an oversight.
    environment_binding:
      python: recorded per run by harness/runner.py::environment()
      dependencies_recorded_by_the_harness: [sympy, pyyaml]
      numpy_note: >-
        numpy is imported inside _measure_displacement_rank at
        endomorphism_la.py:130 and is NOT in harness/runner.py::environment()'s
        dependency dict. The driver must therefore record numpy.__version__
        explicitly in every raw-result.json under `environment_supplement`, or
        the artifact policy's dependency-version requirement is not met for the
        primary metric's own dependency.
      sage_version_note: >-
        harness/runner.py::environment() hardcodes `"sage_version": None` at
        line 53 and the harness may not be modified. THE CONSEQUENCE IS DECLARED
        IN ADVANCE RATHER THAN DISCOVERED LATER - manifest.run.environment
        .sage_version will read null in all 28 manifests, and the captured
        `sage --version` string is instead recorded VERBATIM in every manifest
        under manifest.run.inputs.parameters.sage_version_captured, which the
        driver controls, and in every raw-result.json under
        environment_supplement, and in results/certificate_verification.json.
        This is a manifest-versus-supplement disagreement of the same family as
        EV-STR-003 unresolved confound UC-5, it is disclosed here before
        execution, and it is not repaired by modifying the harness.
      source_hashes_required: >-
        The driver records the SHA-256 of harness/endomorphism_la.py,
        harness/semaev.py, harness/toycurve.py and harness/runner.py, computed at
        run time from the working tree, in every raw-result.json under
        `code_hashes`. All 28 runs must agree; a disagreement invalidates the SET
        pending Coordinator adjudication (IV-3).
    solver_availability_check:
      status: PERFORMED BEFORE THE FREEZE AND IT PASSED.
      who_and_when: >-
        The dispatching session, on 2026-07-29, before the BATCH-014 dispatch
        queue was authored and therefore strictly before any EXP-STR-004 contract
        text existed.
      what_was_observed_verbatim: >-
        SageMath 10.9, release date 2026-05-04, is installed at
        /usr/local/bin/sage and computes correctly - it built
        EllipticCurve(GF(1009),[1,1]), returned order 1034, and produced a
        generator of that order. `import sage` from the system python3 FAILS.
      provenance_and_its_limits: >-
        THIS IS A PRE-FREEZE HOST OBSERVATION BY THE DISPATCHING SESSION, NOT AN
        ARCHIVED RESULT. It has no run id, no manifest, no seed record, no
        receipt and no independent verification. It is recorded here as the
        PROVENANCE OF A DESIGN DECISION and MAY NOT BE CITED ANYWHERE AS A
        MEASUREMENT, AS A CONTROL, OR AS EVIDENCE OF ANYTHING. It is the analogue
        of the EXP-STR-003 probe values and is treated the same way - recorded in
        advance, never promoted. This contract did not re-run the check and does
        not claim to have run it.
      consequence_1_sage_is_invoked_through_the_binary: >-
        Sage is invoked through the `sage` BINARY, NEVER as a plain Python
        import, because `import sage` from the system python3 does not work on
        this host and a contract clause written as a Python import would fail at
        execution and burn the batch. The EXP-STR-001 lineage artifact
        experiments/EXP-STR-001/str1_ap_matrix.sage was run exactly this way -
        its committed command.txt reads
        `sage experiments/EXP-STR-001/str1_ap_matrix.sage` - and this contract
        follows that precedent for its Sage component only.
      consequence_2_sage_is_not_the_driver: >-
        THE OBJECT OF MEASUREMENT IS THE COMMITTED HARNESS and the driver is
        plain Python, exactly as EXP-STR-003's was. Re-implementing the
        measurement in Sage would measure a different object. Sage's ONE role in
        this contract is the INDEPENDENT CERTIFICATE VERIFIER that
        docs/claims-and-verification.md requires - it re-checks every claimed
        decomposition with its own elliptic-curve arithmetic, independent of
        harness/toycurve.py in exactly the sense that document demands.
      binding_executor_obligation: >-
        THE EXECUTOR CAPTURES THE EXACT `sage --version` STRING EXACTLY ONCE,
        BEFORE THE FIRST COMPUTATION, and records it VERBATIM in every one of the
        28 manifests and in results/certificate_verification.json, together with
        the statement that it is ONE capture reused verbatim, recorded as one
        capture and not as 28 independent probes. IF THE CAPTURED STRING DOES NOT
        NAME SageMath 10.9 WITH RELEASE DATE 2026-05-04, or the `sage` binary is
        absent, or it fails to start, or it exits nonzero, THE EXECUTOR STOPS AND
        REPORTS under stopping rule SR-8. THE MISMATCH IS INFRASTRUCTURE SIGNAL,
        IT IS RECORDED AS SUCH, AND NO MATHEMATICAL CONCLUSION IS DRAWN FROM IT
        IN EITHER DIRECTION.
      what_this_check_does_not_settle: >-
        It does not establish that the Sage verifier is correct, that the harness
        is correct, or that any cell is measurable. It establishes that the
        computer-algebra dependency the BATCH-013 scope ruling flagged as
        UNRESOLVED was present and functioning on this host on the day the
        BATCH-014 queue was written, and nothing more.
    scratch_directory:
      requirement: >-
        The driver takes a mandatory `--scratch` argument, resolves it to an
        absolute real path, and ASSERTS that it does not start with the
        repository root BEFORE any write. All Sage input and output files, and
        any intermediate per-cell payload, live there and nowhere else.
      why: >-
        The declared artifact set for this experiment is exactly the 28 run
        directories, the two driver files and the three results files. A file
        left anywhere else under experiments/EXP-STR-004/ is an UNDECLARED
        ARTIFACT that fails the post-commit verifier and blocks the review chain,
        as BATCH-010 demonstrates permanently. The scratch files are not
        artifacts of this experiment, are never copied into the repository, and
        are never cited.

  # ===================================================================
  # 2. ARMS - TWO, AND NO THIRD
  # ===================================================================
  independent_variables:
    - arm: [A-prime, E-prime]
    - cell: [L12, L13, L24, L25, L48, L49, L96, L97, L192, L193, X96, X97, A12M3, A13M3]
  held_fixed_within_a_cell:
    - the curve, its derived seed, p, n, a, b and zeta3
    - B, the decomposition arity m, the collection quota Q and the budget R_base
    - the shift operator sigma under which alpha is measured
    - the committed harness sources, unmodified
    - the closure being unconditional, so that the suppression count is zero in both arms
  two_arms_and_no_third: >-
    DEC-20260727-009's next action names arm A-prime and arm E-prime and says
    `two arms and nothing else`. THIS CONTRACT ADDS NO THIRD ARM. It does not
    re-run EXP-STR-003's arms A, B, C, D or E; it does not invoke
    harness.endomorphism_la.main() at all; and it adds an INSTANCE DIMENSION
    rather than an arm, because the proposition under replication is
    `alpha = O(r) = O(1), independent of B` and a replication that measures alpha
    at one B establishes nothing about independence of B. RULE-BATCH014-SCOPE in
    the BATCH-014 dispatch queue rules that `two arms and nothing else`
    constrains the arms and not the instances.
  arms:
    - id: A-prime
      name: phi-invariant factor base with the committed append closure, unconditional
      factor_base: >-
        harness.endomorphism_la._build_phi_invariant_factor_base(inst, B, zeta3)
        at the cell's declared B. PHI-INVARIANT except for the truncated tail
        when B mod 3 != 0, which is a property of the committed builder and is
        MEASURED, NOT REPAIRED.
      base_rows: >-
        harness.endomorphism_la._collect_relations(inst, fb, m, Q(B)) with
        include_phi_orbits=False, truncated to the first R_base(B) rows.
      closure: >-
        THE COMMITTED APPEND RULE OF endomorphism_la.py LINES 292-304 (m = 2) AND
        341-351 (m = 3) WITH THE LINE-303/304 `sum(shifted_row) > 0` ZERO FILTER
        AND `shifted_row not in relations` DEDUP BOTH DISABLED. For each base row
        r in order, emit r, then for shift in (1, 2) form the shifted row by the
        phi_image_map of section 1 and APPEND IT UNCONDITIONALLY. The emitted
        stream is therefore r_0, S_1 r_0, S_2 r_0, r_1, S_1 r_1, S_2 r_1, ... .
        This is exactly what DEC-20260727-009 specifies and it is what makes the
        prediction sharp.
      declared_shift: phi
      alpha_call: >-
        harness.endomorphism_la._measure_displacement_rank(rows_final, len(fb),
        "phi", zeta3, p, n) - the committed function, unmodified.
      a_property_of_this_arm_declared_in_advance_rather_than_discovered_later: >-
        WITH THE ZERO FILTER DISABLED, SOME APPENDED ROWS ARE NOT GENUINE
        RELATIONS. If a summand's phi-image falls outside the truncated factor
        base the shifted row silently drops that coordinate, and the resulting
        row does not certify any decomposition; with the filter off, an
        all-zero shifted row may also be emitted. THIS IS DECLARED HERE, BEFORE
        EXECUTION, AS A PROPERTY OF THE ARM. Its consequences bind - appended
        rows carry certificate kind `none` with that reason recorded; NO RECORD
        MAY DESCRIBE ARM A-PRIME'S MATRIX AS A MATRIX OF RELATIONS; and an alpha
        of 0 obtained on a matrix containing non-relations is a fact about the
        row list, not about a solvable system. Discovering this after the result
        and calling it a caveat would be the failure.
    - id: E-prime
      name: phi-free factor base with a positional sigma-orbit closure, unconditional
      factor_base: >-
        harness.endomorphism_la._build_random_factor_base(inst, B) at the same
        declared B. NOT phi-invariant. ZERO ENDOMORPHISM CONTENT.
      base_rows: >-
        harness.endomorphism_la._collect_relations(inst, fb, m, Q(B)) with
        include_phi_orbits=False, truncated to the first R_base(B) rows - the
        identical call shape as arm A-prime, differing only in the factor base.
      closure: >-
        A PHI-FREE CLOSURE THAT EMITS EACH SIGMA-ORBIT ONCE AND NEVER SUPPRESSES.
        For each base row r in order, emit r, sigma . r and sigma . (sigma . r)
        in that order, unconditionally, with no dedup and no zero filter, where
        sigma is the SAME positional block-of-3 permutation under which alpha is
        measured.
      declared_shift: phi
      alpha_call: >-
        harness.endomorphism_la._measure_displacement_rank(rows_final, len(fb),
        "phi", zeta3, p, n) - the committed function, unmodified.
      what_it_isolates: >-
        CLOSURE CONVENTION FROM ENDOMORPHISM CONTENT. The appended rows are index
        permutations of incidence vectors over a factor base that is not
        phi-invariant; they are not images of any relation under any map of the
        curve and they are mathematically worthless as relations. THAT IS THE
        POINT OF THE ARM and it is recorded here as it was for EXP-STR-003 arm E.
        EV-STR-003 observation O-4 adjudicated arm E's divergence as a difference
        of CLOSURE CONVENTION rather than a dedup count or a driver defect, and
        UC-1 names this successor `arm E-prime` in those words.
      the_two_closures_do_not_coincide_at_residue_one_and_this_is_declared: >-
        A CONFOUND THAT IS NAMED IN ADVANCE RATHER THAN DISCOVERED AFTERWARDS.
        The A-prime closure uses the committed MULTIPLICATIVE phi-image map and
        the E-prime closure uses the POSITIONAL permutation sigma. The derivation
        note derives that the two coincide as index maps exactly when the factor
        base is a clean union of phi-orbits, i.e. exactly when B mod 3 = 0, and
        that they differ on the truncated tail otherwise. CONSEQUENCE, BINDING -
        at the seven residue-one cells the two arms differ in TWO ways, the
        factor base AND the tail behaviour of the closure, so ANY DISAGREEMENT
        BETWEEN THE ARMS AT A RESIDUE-ONE CELL IS ATTRIBUTABLE TO THE TRUNCATED
        TAIL OF THE COMMITTED BUILDER AND IS NOT EVIDENCE OF ENDOMORPHISM
        CONTENT. At the seven residue-zero cells the closures coincide and the
        factor base is the only difference, so those seven are the cells at which
        a disagreement would be informative. Section 7 binds this reading to F-4.
        The alternative - applying the multiplicative map to arm E-prime's random
        factor base - is not available, because a random factor base is almost
        never closed under multiplication by zeta3 and the closure would emit
        empty rows at every cell, which is a degenerate arm and not a control.

  # ===================================================================
  # 3. CONTROLS
  # ===================================================================
  controls:
    - id: CTRL-1
      control: >-
        MATCHED BASE-ROW BUDGET. Both arms consume exactly R_base(B) base rows at
        every cell, R_base being a function of B alone. This is the direct repair
        of the nuisance variable EXP-STR-003 criterion F1 fired on, which
        EV-STR-003 observation O-4 diagnosed as arm E consuming 2.5x to 3.0x as
        many base rows as arm A, and which UC-2 requires controlled.
    - id: CTRL-2
      control: >-
        UNCONDITIONAL CLOSURE IN BOTH ARMS. Suppression is impossible by
        construction, the suppression count is pre-registered as ZERO for both
        arms at every cell, and every cell reports alpha BESIDE its suppression
        count, as UC-2 requires. A NONZERO SUPPRESSION COUNT IS A FINDING TO
        REPORT AND AN IMPLEMENTATION DEFECT OF THE DRIVER, not a value to accept
        quietly; it invalidates that cell under IV-8.
    - id: CTRL-3
      control: >-
        IDENTICAL SHIFT OPERATOR, IDENTICAL B, IDENTICAL m, IDENTICAL CURVE,
        IDENTICAL DERIVED SEED AND IDENTICAL COLLECTION QUOTA WITHIN A CELL. The
        factor base and the closure rule are the only differences between the
        arms, and the residue-one caveat above states where the closure rule
        differs.
    - id: CTRL-4
      control: >-
        FACTOR-BASE STRUCTURE ASSERTION. For arm A-prime the driver asserts, per
        cell, that len(factor_base) == B and that
        factor_base[3j + k] == pow(zeta3, k, p) * factor_base[3j] % p for every
        complete block 0 <= j < B // 3 and k in {0, 1, 2}, and records the
        assertion. This is the hypothesis the derivation note's exactness rests
        on, and it is CHECKED PER CELL rather than assumed. A failure invalidates
        that cell under IV-4.
    - id: CTRL-5
      control: >-
        STATIC-BOUND CONTROL. The misalignment SET is computed from the final row
        list by definition, independently of any rank computation, and its
        cardinality is compared against the measured alpha. The relation
        alpha <= |MIS| is a falsifier (F-2), not a fitted quantity. It is the
        derivational limb EV-STR-003 observation O-6 records as CONFIRMED at 4 of
        4 in its rescoped form.
    - id: CTRL-6
      control: >-
        PREDICTED-SET CONTROL. The predicted set T is computed by the closed-form
        rule of the derivation note from artifacts that exist BEFORE any alpha is
        measured - the factor base and the base row list, both sha256-recorded -
        and is written to the run record BEFORE the measured set is computed. The
        two sets and their symmetric difference are reported together.
    - id: CTRL-7
      control: >-
        PROVENANCE CONTROL. Every run records the git commit, the tracked-tree
        dirty state, the SHA-256 of all four harness sources, the numpy, sympy
        and Python versions, and the one captured `sage --version` string. The
        driver ABORTS BEFORE WRITING ANY RUN RECORD if the tracked working tree
        is dirty with respect to harness/ (SR-7) or dirty at all (SR-9).
    - id: CTRL-8
      control: >-
        CROSS-CHECK AGAINST THE ONE OVERLAPPING COMMITTED RECORD. The driver
        compares the CURVE-J12S1 parameters it computes (p, n, curve_id) against
        experiments/EXP-STR-002/runs/RUN-STR-phi-b12-s1-m2/raw-result.json, READ
        ONLY, and records the comparison. AGREEMENT is a provenance check on the
        driver; DISAGREEMENT IS A FINDING TO REPORT, not a defect to fix, and the
        committed record is never edited. No metric of this contract is compared
        against that record, because no cell of this contract uses
        B = ceil(isqrt(n)).
    - id: CTRL-9
      control: >-
        CHECKABILITY CONTROL, closing EV-STR-003 unresolved confound UC-6
        prospectively. Every run archives the sha256 of the factor base, of the
        base row list and of the final row list, and - subject to the per-run
        size cap - the objects themselves, so that a third party can CHECK an
        alpha from the archived artifacts and not merely REPRODUCE it by
        re-execution.

  # ===================================================================
  # 4. METRICS
  # ===================================================================
  metrics:
    primary:
      - name: misalignment_set
        symbol: MIS(arm, cell)
        per: (arm, cell)
        definition: >-
          Computed by the driver directly from the arm's FINAL row list R, with
          rows = len(R), cols = B, and sigma the positional block-of-3
          permutation of section 1. Write (sigma . v)[sigma(i)] = v[i]. The
          branch is "square" when rows >= cols and "rectangular" otherwise,
          matching endomorphism_la.py lines 220-234. THIS CONTRACT REQUIRES THE
          SQUARE BRANCH AT EVERY CELL - a rectangular branch invalidates the cell
          under IV-5. In the square branch, with M = R[:cols],
          MIS = { i in [0, cols) such that M[sigma(i)] != sigma . M[i] }.
        recorded_as: >-
          THE FULL SORTED MEMBER LIST, plus the sha256 of that list, plus its
          cardinality EXPLICITLY LABELLED AS A COUNT. The count is never reported
          alone and no criterion is evaluated on it.
        why_it_is_primary: >-
          In the square branch, row i of the displacement matrix satisfies
          D[i][j] = M[i][j] - M[sigma(i)][sigma(j)] and vanishes exactly when
          M[sigma(i)] equals sigma . M[i]. The derivation note derives that
          identity from harness/endomorphism_la.py lines 233-242 and derives, in
          closed form, which rows fail it under each arm's closure. MIS is
          therefore the object of which alpha is a rank, and it is the object
          this contract predicts.
      - name: predicted_misalignment_set
        symbol: T(arm, cell)
        per: (arm, cell)
        definition: >-
          Computed by the driver from the CLOSED-FORM RULE stated in
          experiments/EXP-STR-004/derivation_note.md section D-7, from (i) the
          arm's base row list after truncation to R_base and (ii) the truncated
          tail index set tau(B) = { 3 * (B // 3), ..., B - 1 }. It is computed
          and written BEFORE the measured set and before alpha.
        recorded_as: >-
          The full sorted member list plus its sha256 plus its cardinality
          labelled as a count.
      - name: set_agreement
        per: (arm, cell)
        definition: >-
          One of `equal`, `cardinality_only_agreement`, `unequal`. `equal` iff
          MIS == T as sets. `cardinality_only_agreement` iff MIS != T and
          |MIS| == |T|. `unequal` otherwise. The SYMMETRIC DIFFERENCE is recorded
          as a sorted member list in every case.
        binding_rule: >-
          `cardinality_only_agreement` COUNTS AS DISAGREEMENT FOR EVERY
          CRITERION. Reporting it as agreement is a contract violation.
      - name: phi_alpha
        symbol: alpha(arm, cell)
        per: (arm, cell)
        definition: >-
          The integer returned by the committed
          harness.endomorphism_la._measure_displacement_rank on the arm's final
          row list, len(factor_base) as the column count, shift_type "phi",
          zeta3, p and n. The sentinel -1 of the committed main() is not used - a
          cell with no rows records alpha as null with
          `alpha_status: no_relations` and is excluded from the criteria.
        recorded_as: integer or null
      - name: suppression_count
        per: (arm, cell)
        definition: >-
          The number of closure candidates NOT emitted by the arm's closure. It
          is ZERO in both arms at every cell by construction, is PRE-REGISTERED
          AS ZERO, and is reported BESIDE alpha at every cell (UC-2).
        recorded_as: integer
    secondary:
      - branch - "square" or "rectangular"; required to be "square" at every cell.
      - rows_base_collected - rows returned by _collect_relations before truncation.
      - rows_base_used - rows after truncation; equals R_base(B) unless a shortfall occurred.
      - base_row_shortfall - boolean, with the cell and the arm named when true.
      - rows_final - length of the row list handed to the rank measurement.
      - appended_row_count - rows_final minus rows_base_used; equals 2 * R_base absent a shortfall.
      - factor_base_sha256, base_row_list_sha256, final_row_list_sha256.
      - factor_base_length, factor_base_orbit_structure_verified (arm A-prime only, CTRL-4).
      - hits, attempts as returned by _collect_relations.
      - certificates_emitted, certificates_verified_in_run, certificates_verified_by_sage.
      - sage_version_captured - the one captured string, verbatim.
      - p, n, a, b, zeta3, B, B_mod_3, q, tau, curve_id, requested_seed, derived_seed, m, R_base, Q.
      - determinism_check - at L12, L13, A12M3 and A13M3 only; pass or fail.
      - wall_seconds and peak_rss_bytes per run, in distinct non-overlapping windows.
    explicitly_not_measured:
      - >-
        NO COST QUANTITY OF ANY KIND. No cost ratio, no structured_cost, no
        wiedemann_cost, no density_penalty, no crossover, no wall-time
        comparison, no rho or BSGS baseline. RT-CM-1 through RT-CM-6 remain OPEN
        objections that no arm of this experiment addresses.
      - >-
        NO rank_M AND NO rank_deficiency. They feed no criterion here and each
        costs a further O(B^3) elimination per cell. EV-STR-003 observation O-9
        and unresolved confound UC-3 are therefore untouched, not repaired.
      - >-
        NO relation-density measurement. This contract measures no density
        penalty, so it has no occasion to quote EV-STR-001's yield_penalty. IF
        ANY RECORD ARISING FROM THIS EXPERIMENT NEVERTHELESS TOUCHES THE
        RELATION-DENSITY PENALTY, IT QUOTES THE WHOLE RANGE 17.5x TO 4128.6x,
        WHICH GROWS WITH SIZE AND SUPERLINEARLY IN m, AND NEVER 17.5x ALONE -
        quoting the smallest of six medians alone understates the measured
        penalty by a factor of 236.
      - >-
        NO `commutation_holds`. It is True by default at endomorphism_la.py:442
        and True by construction otherwise, so it discriminates nothing.
      - >-
        NO ALTERNATE-SHIFT ALPHA, for the reason in section 1
        `alternate_shift_is_deliberately_not_measured`.

  # ===================================================================
  # 5. PRE-REGISTERED PREDICTIONS - SET IDENTITIES AT NAMED CELLS
  # ===================================================================
  PRED_ID_STR:
    rule: >-
      EVERY PREDICTION IN THIS CONTRACT IS AN IDENTITY OF NAMED SETS AT A NAMED
      CELL. NO PREDICTION IS STATED AS A CARDINALITY. Where this contract, its
      driver, its run records, its summary or any record citing it reports a
      COUNT, it states that it is a count AND names its members, or - where the
      members are too numerous to name inline - gives the explicit rule that
      generates them together with the full sorted member list in the raw
      artifact and the sha256 of that list. A MEASURED CARDINALITY EQUAL TO A
      PREDICTED CARDINALITY WITH A DIFFERENT MEMBER SET IS RECORDED AS
      `cardinality_only_agreement` AND COUNTS AS DISAGREEMENT FOR EVERY
      CRITERION.
    it_binds_this_contracts_own_statements_too: >-
      THE RULE IS NOT CONFINED TO THE PREDICTIONS. It binds every count, power
      and magnitude statement this contract, its driver and its downstream
      records make about themselves - the run count 28, the cell count 14, the
      path counts, the budget arithmetic and every reported cardinality. Each is
      declared a COUNT and its members are named or generated by a stated rule.
    why_it_is_written_this_hard: >-
      THE RECURRENCE IS THE FINDING, NOT THE MAGNITUDE. Named instances a reader
      can check - carried defect D-2, where PC-2 predicted eleven class flips and
      eleven occurred BUT ONLY FIVE WERE THE SAME CELLS, recorded as coincidental
      and never citable as a successful prediction; RT21-1, where a power-curve
      column reporting a COUNT of tuples was read as a MAGNITUDE by three
      successive sessions; and RT31-5, where a deviation COUNT of 8 that named no
      member survived the Executor, the archiving session and an immutable commit
      message. TWO OF THESE PASSED INDEPENDENT REVIEW BEFORE THEY WERE CAUGHT.
      This contract's whole content is set-valued, which is where the failure
      mode bites hardest.
  pre_registered_predictions:
    basis: >-
      EVERY PREDICTED SET BELOW IS DERIVED FROM COMMITTED SOURCE CODE IN
      experiments/EXP-STR-004/derivation_note.md, which is snapshot-committed by
      TASK-20260729-041 BEFORE any cell is measured. No prediction is taken from
      a probe, a report or a prior record. This is the one place where this
      contract's pre-registration is stronger than EXP-STR-003's, whose
      predictions came from unarchived scratchpad probes.
    P-1:
      statement: >-
        AT EVERY CELL WITH B mod 3 == 0 - NAMED - L12, L24, L48, L96, L192, X96,
        A12M3 - MIS(A-prime, cell) IS THE EMPTY SET, and consequently
        alpha(A-prime, cell) = 0 EXACTLY.
      form: >-
        THE PREDICTION IS THE SET, STATED AS A SET. The value 0 is a CONSEQUENCE
        of the set being empty (the displacement matrix is then identically zero
        and its rank is 0) and is not itself the prediction.
      derivation_ref: derivation_note.md sections D-4 and D-6.
      it_is_DEC_20260727_009s_own_sharp_prediction: >-
        Carried verbatim in content from that decision's next action, which
        states `alpha = 0 exactly at every instance with B mod 3 == 0`.
    P-2:
      statement: >-
        AT EVERY CELL WITH B mod 3 != 0 - NAMED - L13, L25, L49, L97, L193, X97,
        A13M3 - MIS(A-prime, cell) EQUALS T(A-prime, cell), the set defined by
        the closed-form rule of derivation_note.md section D-7 from the base row
        list and tau(B).
      form: >-
        THE PREDICTION IS THE SET. DEC-20260727-009 states the consequence as
        `alpha equal to the number of rows touching the truncated tail
        otherwise`; THIS CONTRACT REFUSES TO PRE-REGISTER THAT AS A NUMBER and
        pre-registers the SET that number would count, per PRED-ID-STR. The
        derivation gives alpha <= |T| and does NOT predict equality; the exact
        rank of the displacement matrix is not predicted at these cells and no
        criterion requires it.
      computed_before_alpha: >-
        T is computed from the factor base and the truncated base row list, both
        sha256-recorded, and is written to the run record BEFORE the measured set
        and before alpha. The summary reports BOTH SETS AND THEIR SYMMETRIC
        DIFFERENCE.
    P-3:
      statement: >-
        AT EVERY ONE OF THE FOURTEEN NAMED CELLS, MIS(E-prime, cell) =
        MIS(A-prime, cell) AND alpha(E-prime, cell) = alpha(A-prime, cell). THE
        PHI-FREE CONSTRUCTION IS PREDICTED TO MATCH THE PHI-INVARIANT ONE
        EXACTLY.
      why_it_is_the_discriminating_prediction: >-
        IT IS FALSIFIABLE IN BOTH DIRECTIONS. If it holds at every named cell,
        the statistic cannot be measuring phi-invariance of the factor base,
        because a construction with none of it scores identically. If it fails at
        any named cell, the cells are NAMED and something other than the closure
        convention is at work there.
      how_it_differs_from_EXP_STR_003s_S1: >-
        EXP-STR-003's criterion S1 predicted arm E would score AT LEAST AS WELL
        as arm A, which is strictly stronger than the proposition OBS-1 asserted;
        EV-STR-003 observation O-4 records that as a MIS-SPECIFIED COMPARATIVE
        CONTROL. P-3 predicts EQUALITY, on matched base-row budgets, which is the
        proposition actually at issue.
      derived_consequence_stated_in_advance_and_not_a_substitute_for_P_3: >-
        The derivation note derives MIS(E-prime, cell) independently - the empty
        set at every residue-zero cell, and at a residue-one cell the singleton
        { 3q } when sigma . r_q != r_q for that arm's own last consumed base row
        and the empty set otherwise. Combined with P-1 and P-2 this implies that
        P-3 HOLDS UNCONDITIONALLY AT THE SEVEN RESIDUE-ZERO CELLS, and that at
        the seven residue-one cells it holds exactly when no arm-A-prime base row
        touches tau(B) and the two arms agree on the sigma-invariance of their
        last consumed base row. THIS REFINEMENT IS A DERIVED CONSEQUENCE, STATED
        BEFORE EXECUTION SO THAT IT CANNOT BE FITTED AFTERWARDS. It does not
        replace P-3, which is what RULE-BATCH014-SCOPE pre-registered and what
        F-1 and F-4 are evaluated against.
    P-4:
      statement: >-
        AT EVERY NAMED CELL AND FOR BOTH ARMS, alpha(arm, cell) <=
        |MIS(arm, cell)|, where |MIS| is the CARDINALITY OF THE MEASURED SET and
        is reported beside the member list.
      status: >-
        This is the derivational limb EV-STR-003 observation O-6 records as
        CONFIRMED at 4 of 4 in its rescoped form. It is carried here as a
        FALSIFIER (F-2) and not as a fitted quantity.
    reporting_requirement: >-
      results/sweep_summary.json must carry, for every cell and arm, the
      predicted set, the measured set, their symmetric difference, the
      set_agreement label, alpha, the suppression count, the base-row counts and
      the two sha256 values. Disagreement is REPORTED, never repaired, never
      averaged away and never used to adjust any criterion. The verdict is
      computed from the measured values alone by the frozen rule in section 7.

  # ===================================================================
  # 6. SEEDS, DETERMINISM, REPLICATION
  # ===================================================================
  seeds:
    requested: [1, 3]
    assignment: CURVE-J12S1 -> requested seed 1; CURVE-J16S3 -> requested seed 3.
    derived: >-
      harness.endomorphism_la._generate_j0_instance uses s = seed * 100 + offset
      with offset in [0, 50). The DERIVED seed s is what every downstream
      construction consumes - both factor bases, the target selection inside
      _collect_relations - and it is recorded per run alongside the requested
      seed.
    determined_or_sampled_label: >-
      RC-8, BINDING. EVERY QUANTITY IN THIS CONTRACT IS DETERMINED. p, n, a, b,
      zeta3, B, m, Q, R_base, the derived seed, tau(B), the factor bases, the
      base row lists, T, MIS and alpha are all DETERMINED. THERE IS NO SAMPLING
      ANYWHERE IN THIS CONTRACT AND NO QUANTITY IS SAMPLED. The driver must not
      import or call `random`, `numpy.random` or `secrets`, and must not read any
      clock or environment value into a computation. A SECOND EXECUTION AT THE
      SAME COMMIT MUST REPRODUCE EVERY PRIMARY VALUE EXACTLY; anything else is a
      defect to report.
  replication:
    intra_run_determinism_check: >-
      At L12, L13, A12M3 and A13M3 only, kept cheap by design, each arm
      recomputes its alpha a second time from the identical row list and asserts
      equality. The result is recorded as `determinism_check: pass | fail`. A
      failure invalidates that run under IV-7.
    independent_replication: >-
      Full independent replication is NOT performed by the Executor and is NOT
      claimed by this contract. Independence here is session-level and
      implementation-level at best. MODEL-LEVEL AND HARDWARE-LEVEL INDEPENDENCE
      ARE UNAVAILABLE ON THIS BRANCH AND ARE NEVER CLAIMED (N-5). Until an
      independent non-originating validation report exists, this experiment's
      evidence strength ceiling is `preliminary` and no record may describe it as
      replicated.
    independent_instances: 2
    repeats_per_cell: 1
    repeats_rationale: >-
      Repeats are pointless where the computation is deterministic - a repeat
      returns the same integer and the same set by construction. Replication
      value here comes from the fourteen cells, from the B-sweep at a fixed
      curve, and from independent re-execution by a different session; not from
      re-running the same seed.
  confirmatory_status:
    value: confirmatory
    basis: >-
      Every predicted set is derived from committed source code in a derivation
      note that is snapshot-committed BEFORE any cell is measured; no parameter
      of the design is chosen after seeing an outcome; the falsification
      conditions are set equalities fixed in advance; and the collection quota
      floor, the base-row budget and the cell list are all fixed by stated
      reasons that do not refer to any outcome.
    its_limit_stated_with_it: >-
      THE DESIGN IS FOURTEEN CELLS WITH ONE REALISATION PER CELL ON ONE HOST AND
      ONE STACK. It is confirmatory ABOUT THOSE CELLS and supports NO
      distributional statement across curves, across seeds or across B beyond the
      ten ladder points. No scaling law may be read off the ladder.

  # ===================================================================
  # 7. CRITERIA, FALSIFIERS AND THE VERDICT RULE
  # ===================================================================
  falsification_conditions:
    - id: F-1
      name: SET IDENTITY
      rule: >-
        FIRES at any named cell and arm where the MEASURED misalignment set is
        not EQUAL, as a set, to the PREDICTED set. The predicted set is the empty
        set for arm A-prime at a residue-zero cell (P-1), T(A-prime, cell) for
        arm A-prime at a residue-one cell (P-2), and MIS(A-prime, cell) for arm
        E-prime at every cell (P-3, set limb). A CARDINALITY MATCH WITH A
        DIFFERENT MEMBER SET FIRES F-1 and is recorded as
        `cardinality_only_agreement`. The report NAMES the cells and gives the
        symmetric difference as a sorted member list.
    - id: F-2
      name: STATIC BOUND
      rule: >-
        FIRES at any named cell and arm where alpha > |MIS|, the cardinality of
        that arm's own measured misalignment set at that cell. Cells named.
    - id: F-3
      name: LADDER
      rule: >-
        Let Z0 = { ladder cells at which alpha(A-prime) = 0 } and let
        L0 = {L12, L24, L48, L96, L192}. F-3 is evaluated over the TEN LADDER
        CELLS ONLY and reports one of three outcomes -
        `identity_holds` iff Z0 == L0;
        `fails_wholly` iff Z0 and L0 are disjoint;
        `mixed` otherwise, i.e. Z0 != L0 and Z0 and L0 share at least one member.
        THE SYMMETRIC DIFFERENCE IS NAMED BY CELL NAME IN ALL THREE CASES. This
        is the independence-of-B falsifier for arm A-prime and it is stated as a
        SET IDENTITY OVER NAMED CELLS, never as `alpha did not grow`.
    - id: F-4
      name: DIAGNOSTICITY
      rule: >-
        Let AGREE = { named cells at which alpha(E-prime) = alpha(A-prime) } and
        let N be the set of the fourteen named cells evaluable under the
        exclusions. F-4 FIRES iff AGREE != N. The report NAMES the members of the
        symmetric difference and, for each, states the DIRECTION of the
        inequality. F-4 FIRING IS NOT A FAILURE OF THE EXPERIMENT.
      the_reading_bound_to_F_4_in_advance: >-
        F-4 FIRING ONLY AT RESIDUE-ONE CELLS IS EXPLAINED BY THE DERIVATION AS A
        TRUNCATED-TAIL EFFECT OF THE COMMITTED BUILDER AND IS NOT EVIDENCE OF
        ENDOMORPHISM CONTENT, because at those cells the two arms differ in two
        ways and not one (see arms.E-prime
        .the_two_closures_do_not_coincide_at_residue_one_and_this_is_declared).
        F-4 FIRING AT ANY RESIDUE-ZERO CELL - L12, L24, L48, L96, L192, X96,
        A12M3 - IS THE INFORMATIVE OUTCOME, because at those cells the derivation
        gives both arms the empty misalignment set and alpha 0, so a disagreement
        there contradicts the derivation itself and is a finding about the
        derivation or about the committed code. THE CELLS ARE NAMED IN EITHER
        CASE AND THE READING IS FIXED HERE, BEFORE EXECUTION.
    - id: F-5
      name: B-INDEPENDENCE OF THE BOUND
      rule: >-
        Evaluated PER ARM over the TEN LADDER CELLS ONLY. Let
        A5(arm) = { ladder cells at which alpha(arm) <= 3 } and let TEN be the
        full ten-cell ladder set. The outcome is one of three -
        `identity_holds` iff A5(arm) == TEN;
        `fails_wholly` iff A5(arm) is empty;
        `mixed` otherwise. THE SYMMETRIC DIFFERENCE IS NAMED BY CELL NAME IN ALL
        THREE CASES. This is the direct test of H-STR-002's own words - alpha <=
        r = 3 for phi-invariant factor bases at all tested B - at a FIXED curve
        over a sixteen-fold range of B.
      the_reading_bound_to_F_5_in_advance: >-
        IF F-5 DOES NOT FIRE FOR ARM A-PRIME, THAT IS NOT SUPPORT FOR H-STR-002
        IF F-4 ALSO DOES NOT FIRE. A bound of 3 that a construction with ZERO
        ENDOMORPHISM CONTENT satisfies identically is a property of the CLOSURE
        CONVENTION, not of the endomorphism. This sentence is pre-registered so
        that a favourable-looking ladder cannot be read as a mechanism result
        after the fact. THE DERIVATION NOTE MAKES THIS THE EXPECTED OUTCOME, NOT
        A REMOTE CONTINGENCY - it derives alpha = 0 for BOTH arms at all seven
        residue-zero cells - and stating that in advance is the point of freezing
        it here.
  the_mixed_branch_is_reachable_by_construction: >-
    EXP-STR-003 section 7 defined S_i = not F_i, making its own `mixed` verdict
    branch UNREACHABLE by construction while the measured S1 pattern WAS mixed;
    EV-STR-003 observation O-5 records this as a CONTRACT DESIGN DEFECT. THIS
    CONTRACT REPAIRS IT. Every verdict rule here is defined over SET EQUALITIES
    and never over complementary predicates - F-3, F-4 and F-5 each have a
    three-valued outcome whose middle value `mixed` is attained by any non-empty
    PROPER subset, and the experiment verdict has an explicit `mixed` branch
    reached whenever the F-4 agreement set is a non-empty proper subset of the
    named cells, plus three further named residual cases that also resolve to
    `mixed`. `mixed` MUST BE REPORTED AS `mixed` AND NEVER COERCED TO EITHER
    POLE.
  verdict_rule:
    statement: >-
      THE EXECUTOR COMPUTES AND RECORDS EXACTLY ONE VERDICT IN
      results/sweep_summary.json AND INTERPRETS NONE OF THEM. The branches are
      evaluated IN THE ORDER GIVEN and the first that matches is the verdict, so
      the rule is total, deterministic and leaves the Executor no discretion. Let
      N be the set of named cells evaluable after exclusions; let
      DISAGREE = { cells at which F-1 fires for either arm }; let
      AGREE = { cells at which alpha(E-prime) = alpha(A-prime) }; let
      GREATER = { cells at which alpha(E-prime) > alpha(A-prime) }.
    branches:
      - order: 1
        verdict: incomplete
        condition: >-
          N is not the full fourteen-cell set, OR any stopping rule fired, OR any
          certificate failed verification, OR a base-row shortfall excluded any
          cell, OR any cell recorded a rectangular branch.
      - order: 2
        verdict: instrument_artifact_confirmed
        condition: DISAGREE is empty AND AGREE == N.
        what_it_licenses: >-
          Exactly one statement, at toy tier, scoped by claim_ceiling - the
          number the committed harness reports as `phi_alpha` carries no
          information about whether the factor base is phi-invariant, on these
          fourteen cells. It licenses NO statement about H-STR-002's mechanism,
          no cost claim and no conclusion about index calculus.
      - order: 3
        verdict: mixed
        condition: AGREE is a non-empty PROPER subset of N.
        sub_label: named_cells_point_different_ways
      - order: 4
        verdict: instrument_artifact_falsified
        condition: >-
          AGREE is empty AND F-1 fires at no cell for arm A-prime AND GREATER is
          non-empty. The members of GREATER are NAMED.
      - order: 5
        verdict: mixed
        condition: AGREE == N and DISAGREE is non-empty.
        sub_label: alpha_agreement_without_set_agreement
      - order: 6
        verdict: mixed
        condition: AGREE is empty and GREATER is empty.
        sub_label: E_prime_strictly_below_A_prime_at_every_cell
      - order: 7
        verdict: mixed
        condition: >-
          AGREE is empty and GREATER is non-empty and F-1 fires for arm A-prime
          at at least one cell.
        sub_label: A_prime_prediction_failed_with_disagreement
    exhaustiveness_note: >-
      AGREE is one of three things - equal to N, a non-empty proper subset, or
      empty. Branch 2 and branch 5 exhaust AGREE == N; branch 3 exhausts the
      proper-subset case; branches 4, 6 and 7 exhaust AGREE empty. The seven
      branches are therefore exhaustive and pairwise disjoint given the order,
      and exactly one verdict is always defined. THIS IS A COUNT OF SEVEN
      BRANCHES AND ITS MEMBERS ARE THE SEVEN `order` VALUES ABOVE.
    the_coordinators_disposition_fixed_in_advance: >-
      UNDER `mixed` OR `incomplete` THE COORDINATOR'S DECISION ON THE INSTRUMENT
      QUESTION IS `inconclusive`, AND SAYING SO PLAINLY IS THE REQUIRED OUTCOME.
      `mixed` and `incomplete` are NOT failures of the experiment and must not be
      rewritten into either of the other two.
    the_ladder_verdicts_are_separate_fields: >-
      The F-3 outcome and the two F-5 outcomes (one per arm) are recorded as
      SEPARATE FIELDS in results/sweep_summary.json - `f3_ladder_verdict`,
      `f5_verdict_A_prime`, `f5_verdict_E_prime` - each with its symmetric
      difference named by cell. THEY ARE NEVER FOLDED INTO THE INSTRUMENT
      VERDICT.
  success_criterion: >-
    THIS CONTRACT DECLARES NO `success`. It has a verdict rule and five
    falsifiers, and every branch of the verdict rule is a legitimate outcome. The
    template field is answered here rather than left null - the outcome that
    would most advance the research question is F-4 firing at a RESIDUE-ZERO
    cell, because that is the only outcome under which the phi-invariant factor
    base does something the phi-free closure does not at a cell where the two
    closures coincide; and the derivation predicts it will NOT occur. Stating
    that in advance is the point.
  falsification_criterion: >-
    See falsification_conditions F-1 through F-5 above, each of which is a set
    identity over named cells with its consequences fixed here, before execution.
    NO CRITERION MAY BE CHANGED AFTER ANY OUTCOME IS OBSERVED WITHOUT A VERSIONED
    protocol_amendment UNDER experiments/EXP-STR-004/amendments/, per
    docs/task-lifecycle.md section 5; an outcome-driven revision is exploratory
    and cannot be evaluated against this confirmatory criterion.
  no_mandatory_sentence_clause: >-
    RT21-1, BINDING. The EXP-YIELD-002 clause C-20 made a FALSE power sentence
    mandatory on every downstream record and it propagated verbatim into two
    immutable artifacts after three reviews called it correct. THIS CONTRACT
    REPRODUCES THAT SENTENCE NOWHERE, IN WHOLE OR IN PARAPHRASE, AND CREATES NO
    CLAUSE MAKING ANY SENTENCE MANDATORY ON A DOWNSTREAM RECORD. Every binding
    above is a RULE that a downstream record RE-DERIVES from the measured sets -
    the set identities of F-1 to F-5, the verdict branches, PRED-ID-STR - and
    never a sentence to be copied.
  no_unquantified_comparative_word_disposes_of_any_number: >-
    RC-D, BINDING. `shrink`, `closer`, `consistent with`, `essentially`, `small`,
    `large`, `dramatic` and their kin are FORBIDDEN as dispositive language
    anywhere in this experiment's artifacts. The only dispositions available are
    the set equalities of F-1 through F-5 and the seven verdict branches.

  # ===================================================================
  # 8. BUDGET AND STAGE ESTIMATES
  # ===================================================================
  budget:
    wall_clock_seconds_per_run: 900
    total_wall_clock_seconds: 7200
    sage_verification_seconds: 900
    maximum_memory_gb: 8
    maximum_runs: 28
    total_cpu_hours: 2
    artifact_bytes_per_run_directory: 2097152
    artifact_bytes_total_tree: 67108864
    minimum_free_disk_bytes_to_start: 5368709120
    basis: >-
      ESTIMATE, NOT A MEASUREMENT, AND LABELLED ONE. EXP-STR-003 consumed
      132.595 s of a declared 5400 s for TWENTY runs including cells at B = 204
      and B = 397, with peak RSS 0.0994 GB of 8 GB (EV-STR-003 observation O-12).
      This contract's largest B is 193 and the rank measurement's cost grows like
      B cubed, so its per-cell measurement cost at the top rung is BELOW
      EXP-STR-003's top cell. Against that - this contract has 28 runs rather
      than 20, adds two m = 3 cells whose relation-collection loop costs like B
      squared per target, collects to a quota floor of 60 at the six smallest
      rungs, and adds a Sage subprocess. THE CAPS ARE HEADROOM OVER AN ESTIMATE.
      If the real cost exceeds them that is a BUDGET DEFECT TO REPORT under the
      stopping rules - NEVER A RESULT.
  stage_resource_estimates:
    - stage: S1
      work: instance generation for the two declared curves, each generated once and reused
      estimate_seconds: 60-900
      memory_gb: 1
      dominant_cost: >-
        EllipticCurve.order() naive point counting at field_bits 16 (p of order
        42000) inside the b-search and offset loops of _generate_j0_instance,
        plus sympy.factorint.
    - stage: S2
      work: factor-base construction, both types, at fourteen cells
      estimate_seconds: 10-120
      memory_gb: 1
      dominant_cost: lift_x trials at B = 192 and B = 193.
    - stage: S3
      work: relation collection for the 28 cells to the quota Q(B)
      estimate_seconds: 300-3000
      memory_gb: 2
      dominant_cost: >-
        the two m = 3 cells, whose committed branch is a quadruple loop over the
        factor base with a lift_x per inner step, and the L192/L193 cells, whose
        quota is 202 and 203 and whose failed searches scan O(B^2) pairs.
    - stage: S4
      work: alpha measurement per cell, plus the determinism recheck at the four smallest cells
      estimate_seconds: 100-1500
      memory_gb: 4
      dominant_cost: >-
        two dense object-dtype matrix products and one modular Gaussian
        elimination at B = 192 and B = 193, in pure Python over numpy object
        arrays. This is the single term most likely to be underestimated.
    - stage: S5
      work: one batched Sage invocation over all cells, verifying every base-row certificate
      estimate_seconds: 30-900
      memory_gb: 2
      dominant_cost: Sage interpreter startup, paid once, plus point arithmetic over at most 500 certificates.
    - stage: S6
      work: run-record writing (28 x 6 files), summary and index assembly
      estimate_seconds: 5-60
      memory_gb: 1
      dominant_cost: none
  stage_total_reconciliation: >-
    Optimistic sum 505 s, pessimistic sum 6480 s, against a declared total cap of
    7200 s. THE PESSIMISTIC SUM FITS WITH 720 s OF HEADROOM, which is the one
    respect in which this budget is better founded than EXP-STR-003's, whose
    pessimistic sum exceeded its own cap by 80 s. Both sums are ESTIMATES and
    both are hand-derived arithmetic over the stage ranges above; they are
    counts of seconds and their terms are the six stage ranges named. If the real
    cost exceeds the cap, SR-2 fires and that is a budget defect to report, never
    a result.
  per_run_cap_headroom_note: >-
    The largest single run is arm E-prime or arm A-prime at L193 - factor base,
    collection to quota 203, one alpha at B = 193, and its share of writing. The
    estimate is 100-500 s against a 900 s per-run cap. THE MARGIN IS NOT LARGE
    AND IT IS STATED RATHER THAN IMPLIED. A per-run breach terminates that run
    only and execution continues with the remaining cells.

  # ===================================================================
  # 9. STOPPING RULES - AND WHAT EACH BREACH MEANS
  # ===================================================================
  every_breach_is_infrastructure_signal: >-
    A TIMEOUT, A CRASH, MEMORY EXHAUSTION, DISK EXHAUSTION, AN ARTIFACT-SIZE
    BREACH, A MISSING OR MISMATCHED SAGE BINARY, OR ANY OTHER IMPLEMENTATION
    FAILURE IS INFRASTRUCTURE SIGNAL. It is recorded as such in the run records
    and in results/run_index.json. IT IS NEVER A MEASUREMENT, NEVER A ZERO, NEVER
    A NEGATIVE RESULT ABOUT H-STR-002 AND NEVER A NEGATIVE RESULT ABOUT THE
    INSTRUMENT QUESTION (AGENTS.md core rule 5). NON-EXECUTION IS NEVER RECORDED
    AS A RESULT.
  stopping_rules:
    - id: SR-0
      rule: >-
        MANDATORY PRE-FLIGHT DISK CHECK, BEFORE THE FIRST WRITE. The driver
        records the free space on the volume holding the repository as an exact
        figure in bytes, in results/run_index.json and in the first manifest. IF
        FREE SPACE IS BELOW 5 GiB (5368709120 bytes) THE EXECUTOR STOPS AND
        REPORTS AND WRITES NO RUN RECORDS. An out-of-space failure mid-run would
        leave a partial run package that looks like a measurement, and that is
        worse than not starting. A disk stop is INFRASTRUCTURE SIGNAL.
    - id: SR-1
      rule: >-
        PER-RUN WALL CLOCK EXCEEDS 900 s. That run is terminated and recorded
        with status `failed_infrastructure`, valid false, invalid_reason
        `per_run_timeout`, together with whatever stdout and stderr were
        captured, and all six files are still written. Execution continues with
        the remaining cells. The verdict is `incomplete`.
    - id: SR-2
      rule: >-
        TOTAL WALL CLOCK EXCEEDS 7200 s. Every cell not yet run is recorded
        `cancelled_by_budget` with the full six-file set still written and no
        metrics, the Executor reports WHICH NAMED CELLS WERE NOT REACHED, and the
        verdict is `incomplete`.
    - id: SR-3
      rule: >-
        RESIDENT MEMORY EXCEEDS 8 GB. Same disposition as SR-1 for the run that
        breached it, with invalid_reason `memory_limit_exceeded`.
    - id: SR-4
      rule: >-
        A RUN DIRECTORY WOULD EXCEED 2 MiB ACROSS ITS SIX FILES. The driver
        writes the sha256 of the factor base, of the base row list and of the
        final row list, OMITS the full dumps, records deviation DEV-SIZE-1 NAMING
        THE EXACT CELLS AFFECTED, and continues. IT NEVER WRITES A TRUNCATED JSON
        DOCUMENT and it never truncates after writing. The consequence is
        recorded rather than hidden - for those cells an alpha is REPRODUCIBLE by
        re-execution but not CHECKABLE from the archived artifacts alone, which
        is exactly the gap EV-STR-003 unresolved confound UC-6 names and which
        CTRL-9 otherwise closes.
    - id: SR-5
      rule: >-
        THE TREE UNDER experiments/EXP-STR-004/ WOULD EXCEED 64 MiB. STOP. Every
        cell not yet run is recorded `cancelled_by_budget` with its six-file set
        still written, the verdict is `incomplete`, and the Executor reports
        which named cells were not reached. A BUDGET STOP IS NOT A RESULT.
    - id: SR-6
      rule: >-
        CUMULATIVE SAGE WALL CLOCK EXCEEDS 900 s, or the Sage verification does
        not complete for any other reason after the pre-flight version check
        passed. The certificates are left UNVERIFIED BY SAGE. All 28 run records
        are still written, with `certificate_verification_status: unverified`,
        terminal status `failed_infrastructure`, valid false and invalid_reason
        `sage_verification_unavailable`; every affected CELL is recorded
        `incomplete` in the summary and the verdict is `incomplete`. This is
        INFRASTRUCTURE SIGNAL.
    - id: SR-7
      rule: >-
        HALT THE WHOLE EXPERIMENT IMMEDIATELY, discard nothing, and report, if
        any of the following is detected at any point - harness/ differs from
        HEAD; any path under experiments/EXP-STR-001/, experiments/EXP-STR-002/
        or experiments/EXP-STR-003/ is modified; any file is written outside
        experiments/EXP-STR-004/ and the declared out-of-repository scratch
        directory; the `--scratch` path resolves inside the repository root; a
        run directory already exists; or a run identifier outside the declared 28
        is about to be written. THESE ARE EVIDENCE-INTEGRITY FAILURES, NOT
        RESULTS.
    - id: SR-8
      rule: >-
        THE `sage` BINARY IS ABSENT, FAILS TO START, EXITS NONZERO, OR ITS
        `--version` STRING DOES NOT NAME SageMath 10.9 WITH RELEASE DATE
        2026-05-04. The Executor STOPS AND REPORTS BEFORE THE FIRST COMPUTATION
        and writes no run records. INFRASTRUCTURE SIGNAL. NO MATHEMATICAL
        CONCLUSION IS DRAWN FROM IT IN EITHER DIRECTION.
    - id: SR-9
      rule: >-
        THE TRACKED WORKING TREE IS DIRTY AT PRE-FLIGHT. The Executor STOPS AND
        REPORTS and writes no run records, because harness/runner.py records
        `dirty` repository-wide in every manifest and IV-1 would then invalidate
        all 28 runs at once. INFRASTRUCTURE SIGNAL. A tree that becomes dirty
        mid-execution is caught instead by IV-1 per run.
    - id: SR-10
      rule: >-
        AN ARM COLLECTS ZERO BASE ROWS AT A CELL. That cell records alpha null
        with `alpha_status: no_relations`, is excluded from every criterion with
        the exclusion NAMING THE CELL AND THE ARM, and the verdict is
        `incomplete`.
    - id: SR-11
      rule: >-
        A CARD THAT CANNOT FINISH INSIDE ITS CAP MUST STOP AND REPORT A BOUNDED
        PARTIAL RESULT NAMING EXACTLY WHICH CELLS IT DID NOT REACH. It must not
        overrun silently and must not compress by fabricating a figure or a
        verdict.

  # ===================================================================
  # 10. INVALIDATION RULES
  # ===================================================================
  invalidation_rules:
    - id: IV-1
      rule: >-
        Any run whose manifest records code.dirty true is INVALID. SR-9 stops the
        experiment before any record is written if the tree is dirty at
        pre-flight, so IV-1 catches a tree that becomes dirty mid-execution.
    - id: IV-2
      rule: >-
        Any run missing manifest.yaml, command.txt, environment.json, stdout.log,
        stderr.log or raw-result.json is INVALID.
    - id: IV-3
      rule: >-
        Any run whose `code_hashes` block disagrees with the other runs' is
        INVALID, and the whole SET is invalid pending Coordinator adjudication -
        the arms would not have been measured against one code base.
    - id: IV-4
      rule: >-
        Any cell at which len(factor_base) != B, or at which arm A-prime's
        orbit-structure assertion of CTRL-4 fails, is INVALID for both arms. The
        committed builder returns a SHORT list when it cannot find enough whole
        orbits within its trial bound, and the derivation's exactness rests on
        the orbit layout, so both are checked rather than assumed.
    - id: IV-5
      rule: >-
        Any run recording branch `rectangular` is INVALID. The derivation, the
        predicted sets and the criteria are all defined on the square branch, and
        a rectangular measurement measures a different quantity.
    - id: IV-6
      rule: >-
        Any cell at which either arm recorded a base-row shortfall is EXCLUDED
        from the comparative criteria, with the cell and the arm NAMED and the
        exclusion stated in the summary, and the verdict is `incomplete`. If the
        shortfall is large enough that rows_final < B, IV-5 also applies and the
        run is invalid.
    - id: IV-7
      rule: >-
        Any run at L12, L13, A12M3 or A13M3 whose `determinism_check` failed is
        INVALID.
    - id: IV-8
      rule: >-
        Any run recording a nonzero suppression_count is INVALID - the closure
        was not unconditional, so the arm did not hold its declared variable
        fixed and the matched control is broken. The nonzero value is reported as
        a finding.
    - id: IV-9
      rule: >-
        Any run whose base-row decomposition certificates do not all verify is
        `completed_invalid` as an INVALID MEASUREMENT - the solver claimed a
        decomposition and the witness is wrong. IT IS NOT A NEGATIVE OBSERVATION
        AND IT IS NOT EVIDENCE AGAINST ANYTHING. This applies to the in-run
        verification at harness/runner.py lines 85-133 and to the independent
        Sage verification alike.
    - id: IV-10
      rule: >-
        Any cell whose certificate pass did not reproduce the committed
        collection - that is, whose per-certificate reconstructed incidence rows
        are not equal, in order and element by element, to the base rows returned
        by the committed `_collect_relations` - is INVALID. The certificates
        would then not be certificates of the measured rows.
    - id: IV-11
      rule: >-
        A total run count other than exactly 28, or any run identifier not in
        `run_inventory`, makes the SET invalid pending Coordinator adjudication.
        Individual valid runs are preserved and never deleted.
    - id: IV-12
      rule: >-
        Disagreement between a run's raw-result.json and the corresponding cell
        of results/sweep_summary.json invalidates the SUMMARY, not the run. The
        raw record governs and the summary is regenerated from the raw records.
    - id: IV-13
      rule: >-
        Any metric produced by harness.endomorphism_la.main() being used for any
        cell invalidates that cell. main() is a forbidden entry point.
    - id: IV-14
      rule: >-
        Any Sage verification output containing a value that is not a plain
        integer where an integer is required, or that fails to round-trip through
        JSON as an exact integer, is NOT ACCEPTED as a verification. EV-STR-001's
        deviations record three EXP-STR-001 Sage invocations lost to preparser
        Integer leaks and JSON coercer truncation; the verifier must coerce every
        emitted value with `int(...)` and the driver must re-check the types on
        read. A failure here is INFRASTRUCTURE SIGNAL under SR-6, not a failed
        certificate.

