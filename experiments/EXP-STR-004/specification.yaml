        `_collect_relations`) it was not met. No criterion here is evaluated
        against FC-1 and no record arising from this experiment may treat the
        ambiguity as settled.
    - id: UC-3
      note: >-
        rank_M and rank_deficiency are not measured here at all, so EV-STR-003's
        confound about their implementation basis is untouched, not repaired.
    - id: UC-4
      note: >-
        The absence of an Executor task receipt for TASK-20260727-021 is not
