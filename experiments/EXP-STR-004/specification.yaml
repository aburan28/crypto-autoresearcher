  command_template: >-
    python3 experiments/EXP-STR-004/driver/bsweep_driver.py
    --exp-id EXP-STR-004
    --cells L12,L13,L24,L25,L48,L49,L96,L97,L192,L193,X96,X97,A12M3,A13M3
    --arms AP,EP
    --scratch <ABSOLUTE PATH OUTSIDE THE REPOSITORY>
