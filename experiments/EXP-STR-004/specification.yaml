experiment:
  id: EXP-STR-004
  hypothesis_id: H-STR-002
  version: 1
  status: review_required
  frozen: true
  frozen_on: '2026-07-29'
  frozen_on_precision: >-
    Date only. The freezing session had no shell and no clock access and does not
    fabricate a wall-clock time.
  title: >-
    Two-arm B-sweep of the phi-displacement-rank statistic over fourteen named
    (curve, B, m) cells - arm A-prime (phi-invariant factor base, unconditional
    committed append closure) against arm E-prime (phi-free factor base,
    unconditional positional sigma-orbit closure) - on matched base-row budgets,
    with set-valued predictions frozen before execution
  claim_tier: toy
  objective: >-
    Discharge DEFER-BATCH009-001 by measuring, under a contract frozen before
    execution, the misalignment SET and the displacement rank alpha reported by
    the committed harness for the two arms DEC-20260727-009 names, at fourteen
    individually named cells that vary B sixteen-fold at a FIXED curve, so that
    the independence-of-B content of H-STR-002's primary prediction is TESTED
    rather than assumed, and so that the closure convention is separated from
    endomorphism content on a matched base-row budget.

  # ===================================================================
  # 0. WHAT THIS EXPERIMENT IS, AND WHAT IT CAN NEVER BE
  # ===================================================================
  instrument_not_mathematics: >-
    THIS EXPERIMENT TESTS AN INSTRUMENT AND A REPLICATION OBLIGATION, NOT A
    MATHEMATICAL MECHANISM. Its object is the number the committed
    harness/endomorphism_la.py reports as `phi_alpha`, together with the
    misalignment set that number is bounded by, measured on two declared row
    lists over fourteen named cells. IT CANNOT, UNDER ANY OUTCOME, ESTABLISH OR
    REFUTE H-STR-002's MECHANISM. That mechanism is a one-line consequence of phi
    being an automorphism - for a phi-invariant factor base F, phi(R) is a genuine
    relation whenever R is, and the closed relation system really is
    C_3-equivariant - and NO ARM OF THIS EXPERIMENT TOUCHES ANY OF IT. A
    confirming outcome shows that the number carries no information about
    phi-invariance of the factor base on the tested cells; it does not show that
    phi-invariance is worthless and it does not close the endomorphism direction.
    A falsifying outcome shows the two arms separate somewhere; it does not
    thereby support H-STR-002, because this contract measures no cost, no wall
    time, no relation density and no end-to-end attack.
  freezing_this_contract_changes_no_research_state: >-
    hypothesis_id is H-STR-002 because this is the replication that hypothesis's
    `weaken` owes, and for no other reason. H-STR-002 REMAINS `weakened` PER
    DEC-20260727-009 UNTIL A LEDGER-ARCHIVED DECISION SAYS OTHERWISE. Freezing
    this contract creates no hypothesis, changes no hypothesis status, approves
    nothing and promotes nothing. EXP-STR-001, EXP-STR-002 and EXP-STR-003 are
    committed and immutable and are not amended, superseded or re-executed here.
  what_this_experiment_is_NOT:
    - Not a cryptanalytic result, not an attack, not an attack improvement.
    - Not a closure, not an impossibility claim, not a target-class result.
    - >-
      Not a test of H-STR-002's mechanism, its cost model, its relation-density
      assumption or its structured-solve prediction.
    - Not evidence at any tier above toy, in either direction.
    - >-
      Not a re-execution of EXP-STR-002 or EXP-STR-003. Their run records are
      immutable and out of scope. No file under experiments/EXP-STR-001/,
      experiments/EXP-STR-002/ or experiments/EXP-STR-003/ may be read-modified,
      written or staged under this contract, and no run identifier here collides
      with theirs.
    - >-
      Not a repair of harness/endomorphism_la.py. The committed harness is the
      OBJECT of measurement. Modifying it - including "fixing" the IndexError at
      line 451 - destroys the measurement and requires a versioned protocol
      amendment before any such change is executed.
    - >-
      Not an assembly of a linear system and not a solve. No right-hand side is
      solved for, no rank_M is computed, and EV-STR-003 observation O-9 (no
      end-to-end path, rank-deficient matrices) is NOT repaired by this contract.
  claim_ceiling: >-
    Every statement this experiment can license is confined to a TOY-TIER,
    TWO-ARM, FOURTEEN-CELL MEASUREMENT of a displacement-rank statistic and its
    pre-registered misalignment set, on two deterministically generated j=0
    (a = 0, CM discriminant -3) prime-field curves with p = 1 mod 3 at field_bits
    12 and 16, factor base B <= 193, decomposition arity m in {2, 3}, ONE
    realisation per cell, on ONE host and ONE software stack, plus one evidence
    record and one decision scoped to exactly those cells. UNDER
    docs/target-result-profile.md RULE A1 THIS IS NOT TARGET-CLASS ON ITS OWN,
    and this clause says so rather than leaving it to be inferred.
  what_may_not_be_concluded_under_any_outcome:
    - >-
      N-1 THAT H-STR-002's MECHANISM IS RIGHT OR WRONG. No arm tests it. The
      evidence record and the decision arising from this experiment must state
      this in the same terms EV-STR-003 used, because reading an instrument
      result as a mechanism result is exactly what produced DEC-20260726-006.
    - >-
      N-2 THAT alpha IS O(1), OR THAT IT IS NOT. Fourteen toy cells support
      neither. If alpha <= 3 holds at all ten ladder cells for arm A-prime, that
      is a measured fact about those ten cells and about nothing else - and it is
      NOT support for H-STR-002 if arm E-prime, which has ZERO endomorphism
      content, does the same.
    - >-
      N-3 A `reject_scoped` DISPOSITION ON THIS RUN SET. agents/coordinator.md
      forbids `reject_scoped` on a single unreplicated empirical-only run set
      outright. EXP-STR-004 is ONE run set. The route to anything stronger than
      `weaken` runs through the DERIVATION NOTE, which is why this contract
      requires that note archived BEFORE execution rather than written afterwards
      to justify a verdict.
    - >-
      N-4 ANY COST STATEMENT. This contract measures no time as a metric, no
      memory as a metric, no operation count and no baseline. No cost ratio, no
      structured_cost, no wiedemann_cost, no density_penalty, no crossover and no
      comparison to Pollard rho or BSGS. RC-7 is declared inapplicable in
      section 12 with its reason and its cost.
    - >-
      N-5 THAT THE REPLICATION IS INDEPENDENT AT MODEL LEVEL OR HARDWARE LEVEL.
      It is session-level and implementation-level independent at best, exactly
      as EV-STR-003's strength_basis records. Model independence is unavailable
      on this branch and is never claimed.
    - >-
      No statement about B > 193, about field_bits > 16, about j != 0 curves,
      about generic curves, about arity m > 3, or about medium or cryptographic
      scale. No re-charging, flagging or defence of any index-calculus cost
      model; RT-CM-1 through RT-CM-6 remain OPEN and untouched. No claim that a
      GOAL-ECDLP-001 completion criterion is met. All four asymptotic-claim
      promotion gates in agents/coordinator.md remain OPEN and this contract does
      not attempt them.
  the_D_1_prophylaxis_stated_in_this_contracts_own_text: >-
    THIS FILE IS FROZEN AT `status: review_required` WITH `approved_by: null` BY
    DESIGN, AND THAT NULL MUST NOT BE READ AS EVIDENCE OF NON-APPROVAL. Carried
    defect D-1 records that experiments/EXP-YIELD-001/specification.yaml still
    reads `review_required` with `approved_by: null` although its execution gate
    was met, because the file is immutable and is resolved only by a decision
    record. The same prophylaxis applies here deliberately. The Coordinator's
    approval determination on EXP-STR-004, and every pre-dispatch condition the
    independent reviewer imposes, are recorded VERBATIM AND AT THE MOMENT THEY
    ARE MADE in the TASK-20260729-043 snapshot receipt and again as a formal
    experiment_status_transition block in DEC-20260729-004. THIS FILE IS NEVER
    EDITED AFTER TASK-20260729-041 COMMITS IT. A receipt that records NOT
    APPROVED is recorded as NOT APPROVED, and no later record may attribute an
    APPROVED determination to a receipt that does not carry it.

  # ===================================================================
  # 1. INPUTS
  # ===================================================================
  inputs:
    bound_commit: null
    bound_commit_status: >-
      NULL BECAUSE IT IS UNKNOWN TO THE FREEZING SESSION, NOT BECAUSE IT IS
      PENDING FABRICATION. The session that wrote this contract had no shell, ran
      no git command and verified no commit identifier. The harness is bound
      instead by two run-time facts that the Executor records and a reviewer can
      check against Git afterwards: the SHA-256 of each harness source, computed
      at run time and recorded in every raw-result.json under `code_hashes`, and
      the commit and dirty state that harness/runner.py::write_run records in
      every manifest under `run.code`.
    code_under_measurement:
      - path: harness/endomorphism_la.py
        role: the instrument. Read and called; never modified.
      - path: harness/semaev.py
        role: >-
          relation search (_find_decomposition, build_factor_base) and the
          committed certificate constructor. Never modified.
      - path: harness/toycurve.py
        role: curve arithmetic and deterministic instance generation. Never modified.
      - path: harness/runner.py
        role: >-
          run-record writer (write_run) and the in-run independent certificate
          re-verification at runner.py lines 85-133. Never modified.
    committed_functions_the_driver_must_call:
      - harness.endomorphism_la._generate_j0_instance(seed, field_bits)
      - harness.endomorphism_la._find_zeta3(p)
      - harness.endomorphism_la._build_phi_invariant_factor_base(inst, B, zeta3)
      - harness.endomorphism_la._build_random_factor_base(inst, B)
      - harness.endomorphism_la._collect_relations(inst, fb, m, Q, include_phi_orbits=False)
      - harness.endomorphism_la._measure_displacement_rank(rows, cols, "phi", zeta3, p, n)
      - harness.semaev._find_decomposition(E, V, R, a, b, p)
      - harness.runner.write_run / harness.runner.RunResult / harness.runner.curve_id
    forbidden_entry_point: >-
      harness.endomorphism_la.main() IS FORBIDDEN, in process and as a
      subprocess, for every cell and both arms. It raises IndexError at
      endomorphism_la.py:451 whenever B mod 3 != 0 with relations present, which
      is true of seven of the fourteen declared cells (EXP-STR-003 criterion S4,
      measured 4 of 4), and it cannot express either arm of this contract. Any
      metric produced by main() being used for any cell invalidates that cell.
    instance_construction: >-
      The driver constructs its own instances and TRANSCRIBES NOTHING. For each
      of the two declared curves it calls, in this exact order - (1)
      inst = _generate_j0_instance(requested_seed, field_bits); (2) if inst is
      None the curve is recorded `instance_unavailable` and every cell on it is
      recorded not measured; (3) p = inst.p, n = inst.n, a = inst.a, b = inst.b,
      derived_seed = inst.seed; (4) zeta3 = _find_zeta3(p), and if None the curve
      is `instance_unavailable`; (5) curve_id(p, a, b, field_bits) from
      harness/runner.py. EACH CURVE IS GENERATED EXACTLY ONCE AND REUSED ACROSS
      ALL ITS CELLS, which is sound because the construction is deterministic and
      which is also the largest single cost saving available to this contract.
      Every one of p, n, a, b, zeta3, requested_seed, derived_seed, B, B mod 3
      and m is recorded in every run record produced from that curve.
    parameters_are_predictions_not_inputs: >-
      EV-STR-003 records p in {2293, 2953, 42013, 631843} and n in {733, 3061,
      41617, 158071} across its four instances at 12, 12, 16 and 20 field bits.
      NO VALUE IS TAKEN FROM THAT RECORD AS AN INPUT. B is a FREE PARAMETER of
      this contract and is NOT computed as ceil(isqrt(n)); every other instance
      parameter is COMPUTED by the committed generator and RECORDED. Any value
      transcribed from a report, hardcoded, or supplied on the command line
      invalidates the run. A MISMATCH AGAINST A PRIOR RECORD IS A FINDING TO
      REPORT, never a defect to fix and never grounds for overriding the computed
      value.
    curves:
