      - RUN-STR-004-EP-L24
      - RUN-STR-004-EP-L25
      - RUN-STR-004-EP-L48
      - RUN-STR-004-EP-L49
      - RUN-STR-004-EP-L96
      - RUN-STR-004-EP-L97
      - RUN-STR-004-EP-L192
      - RUN-STR-004-EP-L193
      - RUN-STR-004-EP-X96
      - RUN-STR-004-EP-X97
      - RUN-STR-004-EP-A12M3
      - RUN-STR-004-EP-A13M3
    six_file_rule: >-
      THE SIX-FILE-PER-RUN SET IS MANDATORY EVEN FOR A NON-COMPLETED RUN. A run
      cancelled by budget, failing on infrastructure, exhausting memory,
      exhausting disk or invalidated by a failed certificate STILL writes all six
      files, with the terminal status recorded in the manifest.
  certificate_discipline:
    applies_because: >-
      THIS EXPERIMENT TOUCHES CURVE COMPUTE. Every base row of both arms is a
      CLAIMED DECOMPOSITION and therefore carries a certificate that independent
      code re-verifies, per docs/claims-and-verification.md. Claim tier stays
      TOY.
    base_rows:
      kind: decomposition
      statement_fields: >-
        target - the affine point whose decomposition is claimed; k - the scalar
        with target = k * P, recorded so the claim is a RELATION and not merely a
        point identity; summands - the list of affine summand points WITH THEIR
        SIGN CHOICES ALREADY APPLIED, so no verifier has to guess a sign;
        summand_x - their x-coordinates; curve - p, a, b; P - the base point.
      m_2_source: >-
        The certificate returned by the committed
        harness.semaev._find_decomposition, unmodified, extended by the driver
        with k and P.
      m_3_source: >-
        The committed m = 3 branch at endomorphism_la.py lines 305-339 returns no
        certificate, so the driver RECONSTRUCTS one in the same shape from the
        same committed search - the two signed factor-base points sA, sB and the
        remainder point target - (sA + sB) whose x lies in the factor base. THIS
        IS A DRIVER REIMPLEMENTATION OF A COMMITTED LOOP AND IS DECLARED AS ONE;
        its faithfulness is not assumed but CHECKED by IV-10.
      binding_check_IV_10: >-
        The driver reconstructs each base row's incidence vector from its
        certificate and asserts equality, in order and element by element, with
        the base rows returned by the committed `_collect_relations`. The
        certificates are the certificates OF THE MEASURED ROWS only if that
        assertion passes, and the cell is invalid if it does not.
      what_recording_k_does_NOT_do: >-
        Recording k does not assemble a linear system, does not attempt a solve,
        does not repair EV-STR-003 observation O-9 and licenses no cost claim. It
        makes each individual base row a checkable relation and nothing more.
    appended_rows:
      kind: none
      reason: >-
        APPENDED ROWS ARE NOT CLAIMED AS RELATIONS BY EITHER ARM, and no attempt
        is made to certify them. For arm A-prime, with the zero filter disabled,
        a shifted row whose phi-image left the truncated factor base has silently
        dropped a coordinate and certifies nothing. For arm E-prime the appended
        rows are index permutations of incidence vectors over a factor base that
        is not phi-invariant and are not images of any relation under any map of
        the curve. NO RECORD MAY DESCRIBE EITHER ARM'S MATRIX AS A MATRIX OF
        RELATIONS.
    verification_layer_1_in_run:
      what: >-
        harness/runner.py::write_run re-verifies the run-level certificate at
        lines 85-133 with harness.semaev.verify_decomposition_certificate, which
        recomputes the point sum from the curve arithmetic module rather than
        trusting the search path, and forces status `completed_invalid` with
        valid false on failure.
      one_certificate_per_run_limitation_declared: >-
        RunResult carries EXACTLY ONE certificate and the harness may not be
        modified. THE CONSEQUENCE IS DECLARED RATHER THAN WORKED AROUND - the
        run-level certificate is the FIRST base row's certificate, chosen
        deterministically, so that the harness's own gate actually fires; ALL
        R_base certificates are written to raw-result.json under
        `raw.certificates` with a per-certificate in-run verification result
        obtained by calling the same committed verifier directly; and the driver
        sets valid false with invalid_reason `certificate_failed` if ANY
        certificate of that run fails. Reporting only the first would be the
        failure.
    verification_layer_2_independent_sage:
      what: >-
        experiments/EXP-STR-004/driver/verify_certificates.sage re-verifies EVERY
        base-row certificate of ALL 28 runs with Sage's OWN elliptic-curve
        arithmetic - it reconstructs each curve as EllipticCurve(GF(p), [a, b]),
        checks that every summand lies on the curve, checks that the summands sum
        to the target, and checks that k * P equals the target.
      independence_requirement: >-
        IT MUST NOT IMPORT, CALL OR REPLICATE harness/toycurve.py, harness/
        semaev.py or any other harness module, and it shares NO CODE with the
        driver. It reads a JSON certificate bundle from a scratch path given on
        the command line and writes a JSON verdict file to another scratch path.
      invocation: >-
        ONE BATCHED INVOCATION over all cells, so that interpreter startup is
        paid once, of the form
        `sage experiments/EXP-STR-004/driver/verify_certificates.sage <IN.json> <OUT.json>`
        run from the repository root, with IN and OUT both under the declared
        out-of-repository scratch directory. THE EXACT COMMAND IS RECORDED IN
        command.txt AND IN results/certificate_verification.json. Sage is invoked
        THROUGH THE BINARY and NEVER as a Python import.
      integer_hygiene: >-
        The verifier coerces every emitted value with `int(...)` before writing
        JSON, and the driver re-checks the types on read (IV-14). EV-STR-001's
        deviations record three EXP-STR-001 Sage invocations lost to preparser
        Integer leaks and JSON coercer truncation; that hazard is named here in
        advance.
      ordering_consequence_declared: >-
        Because the Sage pass is ONE batched invocation, the driver computes all
        28 cells first, invokes Sage once, and then writes all 28 run records
        with the Sage verdict already incorporated. PER-RUN TIMING WINDOWS ARE
        STILL DISTINCT AND NON-OVERLAPPING - each run's window is the window of
        its own computation, captured during the computation phase - AND THE SAGE
        WINDOW IS A SEPARATE SINGLE WINDOW RECORDED IN
        results/certificate_verification.json AND FOLDED INTO NO PER-RUN TIMING.
        If the Sage phase fails, SR-6 still writes all 28 records.
    failed_certificate_disposition: >-
      A FAILED CERTIFICATE MAKES THAT RUN `completed_invalid` AS AN
      invalid_measurement, per docs/claims-and-verification.md. IT IS NOT A
      NEGATIVE OBSERVATION, it is not evidence about H-STR-002, it is not
      evidence about the instrument question, and the affected cell is excluded
      from every criterion with the exclusion named.
  required_artifacts:
    contract:
      - experiments/EXP-STR-004/specification.yaml
      - experiments/EXP-STR-004/derivation_note.md
    implementation:
      - experiments/EXP-STR-004/driver/bsweep_driver.py
      - experiments/EXP-STR-004/driver/verify_certificates.sage
    per_run:
      - experiments/EXP-STR-004/runs/<RUN-ID>/manifest.yaml
      - experiments/EXP-STR-004/runs/<RUN-ID>/command.txt
      - experiments/EXP-STR-004/runs/<RUN-ID>/environment.json
      - experiments/EXP-STR-004/runs/<RUN-ID>/stdout.log
      - experiments/EXP-STR-004/runs/<RUN-ID>/stderr.log
      - experiments/EXP-STR-004/runs/<RUN-ID>/raw-result.json
    summary:
      - experiments/EXP-STR-004/results/sweep_summary.json
      - experiments/EXP-STR-004/results/run_index.json
      - experiments/EXP-STR-004/results/certificate_verification.json
    exact_path_binding: >-
      The 174 exact repository-relative paths of the run package (28 runs x 6
      files, the two driver files, the three results files and the archive's own
      receipt) are declared in advance in
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-014/dispatch_queue.json
      under declared_commit_sets. NOTHING ELSE MAY BE WRITTEN UNDER
      experiments/EXP-STR-004/. A file outside that set - including a macOS
      AppleDouble `._` sidecar - is an undeclared artifact that fails the
      post-commit verifier and blocks review. Nothing is analysed, interpreted or
      promoted in any of these files; analysis belongs to the reviews and to the
      ledger archive.
  artifact_policy_mapping:
    exact_command: manifest.run.code.command and command.txt, per run, written by write_run.
    git_commit_and_dirty_state: manifest.run.code.commit and .dirty.
    environment_and_dependency_versions: >-
      environment.json and manifest.run.environment, PLUS
      raw-result.json.environment_supplement carrying numpy.__version__ and the
      captured sage version string, neither of which
      harness/runner.py::environment() records and both of which this
      experiment's primary metric and certificate discipline depend on.
    input_parameters_and_seeds: >-
      manifest.run.inputs (curve_id, seed, parameters, including
      sage_version_captured) and raw-result.json.raw.cell, carrying
      requested_seed, derived_seed, p, n, a, b, zeta3, B, B_mod_3, q, tau, m,
      R_base and Q.
    requested_and_resolved_model_policy: >-
      manifest.run.inference, written by write_run as requested_policy
      executor-terra with resolved_model_id "none (deterministic harness
      execution)", PLUS raw-result.json.inference_supplement carrying
      model_verified, model_provenance, fallback_used and degraded_requirements.
      THE HARNESS IS NOT MODIFIED TO ADD THEM. EV-STR-003 observation O-12 defect
      2 records that manifest.run.inference.fallback_used is hardcoded false at
      harness/runner.py lines 136-146 while the supplement records true; THE SAME
      DISAGREEMENT WILL APPEAR IN ALL 28 MANIFESTS HERE, it is disclosed in
      advance, and it is not repaired by editing the harness.
    reasoning_effort_and_fallback: raw-result.json.inference_supplement.
    stdout_and_stderr: >-
      stdout.log and stderr.log, each carrying real captured output. A zero-byte
      stderr.log is permitted by IV-2, which requires presence only; EV-STR-003
      observation O-12 defect 1 records two such files in the EXP-STR-003
      package, and no assertion is made here that every stderr is non-empty.
    raw_machine_readable_results: raw-result.json.
    validity_status_and_reason: manifest.run.result.valid, .invalid_reason and manifest.run.status.
    timestamps_and_resources: >-
      manifest.run.timing and manifest.run.resources, measured around EACH run's
      own computation window individually. Reusing one timing window across
      several run records - the EXP-STR-002 defect D6 - is FORBIDDEN.
    checkability: >-
      raw-result.json carries factor_base_sha256, base_row_list_sha256 and
      final_row_list_sha256 in every run, and the objects themselves subject to
      SR-4. This closes EV-STR-003 unresolved confound UC-6 prospectively.

