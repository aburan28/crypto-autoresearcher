    sys.path to import harness.*, resolves and asserts the scratch path, and
    records the resolved absolute scratch path in every run record)
  implementation_note: >-
    The driver is NEW code written under this contract at
    experiments/EXP-STR-004/driver/bsweep_driver.py. It must construct its own
    instances from the committed helpers; CALL the committed measurement
    functions rather than reimplementing them, so that the measured object is the
    committed harness; implement ONLY the two closures, the misalignment-set
    computation, the predicted-set rule of the derivation note and the m = 3
    certificate reconstruction, all four of which are fully specified in
    sections 1, 2, 4 and 11 and in the derivation note; write every run through
    harness.runner.write_run; never import or call
    harness.endomorphism_la.main(); and never modify any file under harness/ or
    under experiments/EXP-STR-001/, -002/ or -003/. It creates no ledger record,
    writes nothing under coordination/, knowledge/ or tools/, and makes no
    commit.
  RC_7_declared_inapplicable_with_its_reason_and_its_cost:
    determination: RC-7 IS DECLARED INAPPLICABLE, WITH THE REASON, RATHER THAN SKIPPED OR SATISFIED BY A FABRICATED PAIRING.
    reason: >-
      EXP-STR-004 solves no instance and recovers no discrete logarithm; it
      measures a matrix statistic. There is no algorithmic task against which
      Pollard rho or BSGS is a matched baseline, and quoting one would be
      decoration.
    the_cost_of_this_honesty: >-
      EV-STR-003's boundary `NO ARCHIVED BASELINE AT THE TWO LARGER INSTANCES`
      STAYS OPEN, and this contract does not close it. There is still no
      committed rho or BSGS run record at n = 41617 or n = 158071.
  conditional_result_pairing_rule_declared_inapplicable:
    determination: >-
      agents/coordinator.md requires a conditional result to be dispatched only
      paired with a heuristic-validation experiment. IT IS DECLARED INAPPLICABLE
      HERE, WITH THE REASON, rather than skipped or satisfied by a fabricated
      pairing.
    reason: >-
      EXP-STR-004 states NO conditional result and introduces NO numbered
      heuristic. It is a direct measurement of a deterministic function of
      (curve, B, m, arm) with no distributional assumption and nothing to
      validate at scale. If a later record wishes to state a conditional claim on
      this basis, that pairing obligation attaches to THAT record and is not
      discharged here.
  carried_defects_this_contract_does_not_repair:
    - id: UC-7
      note: >-
        H-STR-002's falsification condition FC-1 IS AMBIGUOUS AS DRAFTED and THIS
        CONTRACT DOES NOT RESOLVE IT IN EITHER PARTY'S FAVOUR. On the natural
        reading (what relation collection produces) it was met at 4 of 4 by
        EXP-STR-003 arm B against arm C; on the defender's reading (collection
