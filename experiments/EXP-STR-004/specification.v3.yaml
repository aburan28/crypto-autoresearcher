    precedent at experiments/EXP-STR-001/runs/RUN-STR-001-a/command.txt.)
  implementation_note: >-
    The driver is NEW code written under this contract by TASK-20260729-044 at
    experiments/EXP-STR-004/driver/bsweep_driver.py. It must: construct its own
    instances from the committed helpers; call the committed measurement
    function rather than reimplementing it; implement ONLY the two closures, the
    base-row search stopping condition, the MIS computation and the T/T_E
    computation itself, all fully specified above and in the derivation note;
    write every run through harness.runner.write_run; and never import or call
    harness.endomorphism_la.main(). It must not modify any file under harness/
    or under experiments/EXP-STR-001/, -002/ or -003/, must create no ledger
    record, must make no commit, and must write no macOS AppleDouble sidecar.
  inference_receipt:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-opus-5
    model_provenance: >-
      Runtime-reported by the freezing session (a Cursor/Claude Code subagent).
      NOT probe-verified.
    model_verified: false
    model_verification_note: >-
      `python3 -m orchestration.adapter doctor --probe` was NOT run: this
      session had no shell. EV-STR-003 observation O-13 records that the same
      command returns "No module named orchestration.adapter" on this branch. NO
      POLICY-EQUIVALENCE CLAIM IS MADE.
    reasoning_effort: null
    fallback_used: true
