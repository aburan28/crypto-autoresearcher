    - experiments/EXP-STR-002/specification.yaml - the phi-ablation control declared at lines 36-39 and never implemented.
    - experiments/EXP-STR-001/ - the Sage lineage and the `sage <script>.sage` invocation precedent.
    - docs/claims-and-verification.md - certificate discipline, claim-tier ceiling, refutation-artifact ordering.
    - docs/target-result-profile.md - rule A1 and its building-block clause.
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-014/dispatch_queue.json - the authoritative dispatch card and preregistration block.
  command_template: >-
    python3 experiments/EXP-STR-004/driver/bsweep_driver.py --exp-id EXP-STR-004
    --cells L12,L13,L24,L25,L48,L49,L96,L97,L192,L193,X96,X97,A12M3,A13M3
    --arms AP,EP --sage /usr/local/bin/sage
    (run from the repository root; the driver inserts the repository root on
