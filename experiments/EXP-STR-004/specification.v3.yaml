experiment:
  id: EXP-STR-004
  hypothesis_id: H-STR-002
  hypothesis_id_note: >-
    NAMED DELIBERATELY, AND NAMING IT CHANGES NOTHING. This experiment is the
    replication that the `weaken` of DEC-20260727-009 owes on an
    `empirical_only` basis, so it names the hypothesis its obligation belongs
    to. FREEZING THIS CONTRACT CHANGES NO RESEARCH STATE. H-STR-002 remains
    `weakened` per DEC-20260727-009, scoped as that record's `status_scope`
    states, until a ledger-archived Coordinator decision says otherwise. NO ARM
    OF THIS EXPERIMENT TESTS H-STR-002's MECHANISM, and no outcome of it can
    establish or refute that mechanism (see section 0 and N-1).
  version: 3
  version_note: >-
    v3 is the BATCH-015 freeze after BATCH-014's RC-14 non-execution failure.
    BATCH-014's one amendment cycle produced v2, which discharged B-2 and M-1
    but left a B-1 remainder (RT-20260730-001): F-1(E)-fires with F-1(A)-silent
    and F-4-silent was still unlabeled. v3 generalizes `prediction_failed` so
    every complete valid F-1/F-4 matrix outcome maps to exactly one named label.
    Immutable priors: specification.v1-frozen-f3e15614.yaml,
    specification.v2.yaml at 26625837, amendments/v1_to_v2.yaml.
    Changelog: experiments/EXP-STR-004/amendments/v2_to_v3.yaml.
  status: review_required
  approved_by: null
  approved_by_note: >-
    THE NULL IS BY DESIGN AND MUST NOT BE READ AS EVIDENCE OF NON-APPROVAL
    (D-1 / INT-BATCH014-F prophylaxis). v3 is frozen at `review_required` with
    `approved_by: null` and is NEVER edited after its BATCH-015 snapshot. The
    Coordinator's approval determination is recorded in the pre-execution
    approval receipt before any run is unblocked.
  frozen: true
  frozen_on: '2026-07-30'
  frozen_by_task: TASK-20260730-005
  archived_by_task: TASK-20260730-006
  amends: EXP-STR-004/v2
  amends_snapshot_commit: 26625837d422d3c0cf8a108e93b09cee149c9070
  amends_review: RT-20260730-001
  amends_approval_receipt_task: TASK-20260730-004
  prior_batch_terminal: >-
    BATCH-014 closed as RC-14 non-execution failure after a second REVISE.
    No EXP-STR-004 run was authorized in BATCH-014.
  claim_tier: toy
  confirmatory_status: confirmatory
  confirmatory_basis: >-
    STATED WITH ITS LIMIT, AND THIS IS THE ONE PLACE THIS EXPERIMENT DIFFERS
    FROM ITS THREE PREDECESSORS IN THIS CAMPAIGN. Every predicted set below is
    derived from committed source code in experiments/EXP-STR-004/derivation_note.md
    and frozen, with that note, in the TASK-20260729-041 snapshot commit BEFORE
    any cell is measured; no parameter of the design is chosen after seeing an
    outcome; and the falsification conditions are SET EQUALITIES fixed in
    advance. Unlike EXP-STR-003 (integrity note SPEC-STR-003-B) no probe value
    for any predicted quantity was reported to this session by anyone - no
    probe of this experiment exists.
  confirmatory_limit: >-
    THE LIMIT IS AS BINDING AS THE STATUS. The design is FOURTEEN CELLS WITH ONE
    REALISATION PER CELL, on ONE host and ONE software stack, at two curves.
    It is confirmatory ABOUT THOSE CELLS and supports NO distributional
    statement across curves, no statement about untested B, and no scaling law.
    One realisation per cell is justified only by determinism (section 6): a
    repeat returns the same integer by construction, so replication value comes
    from independent RE-EXECUTION by another session, not from re-running a
    seed.
  title: >-
    Two-arm B-sweep of the phi-displacement-rank statistic at fourteen named
    (curve, B, m) cells - arm A-prime (phi-invariant factor base, unconditional
    phi-orbit closure) against arm E-prime (phi-free positional closure, zero
    endomorphism content) - with set-valued predictions frozen before execution

  # ===================================================================
  # 0. WHAT THIS EXPERIMENT IS, WHAT IT CAN NEVER BE, AND ITS CEILING
  # ===================================================================
  instrument_not_mathematics: >-
    THIS EXPERIMENT TESTS AN INSTRUMENT, NOT A MATHEMATICAL HYPOTHESIS. Its
    object is the number the committed harness reports as `phi_alpha`, produced
    by harness.endomorphism_la._measure_displacement_rank, and the question is
    whether that number carries any information about phi-invariance of the
    factor base it was computed over. It CANNOT, under any outcome, establish or
    refute H-STR-002's mechanism. The mechanism is a one-line consequence of phi
    being an automorphism: for a phi-invariant factor base F, phi(R) is a
    genuine relation whenever R is, and the closed relation system really is
    C_3-equivariant. NO ARM OF THIS EXPERIMENT TOUCHES ANY OF THAT. A
    confirming outcome shows the NUMBER carries no information about
    phi-invariance; it does not show phi-invariance is worthless and it does not
    close the endomorphism direction. A falsifying outcome shows a phi-free
    construction does not reproduce the phi-invariant one at some named cell; it
    does not thereby support H-STR-002, because this contract measures no cost,
    no wall-time comparison, no solve and no end-to-end attack.
  what_this_experiment_is_NOT:
    - >-
      Not a cryptanalytic result, not an attack, not an attack improvement, not
      a closure of any lane, not an impossibility claim, not a target-class
      result under docs/target-result-profile.md rule A1.
    - >-
      Not a test of H-STR-002's mechanism, its cost model, or any of its three
      predictions. The third assumption - the relation-density penalty - is NOT
      measured here at all.
    - >-
      Not evidence at any tier above toy, in either direction.
    - >-
      Not a re-execution of EXP-STR-002 or EXP-STR-003. Their run records are
      immutable, committed and out of scope. No file under
      experiments/EXP-STR-001/, experiments/EXP-STR-002/ or
      experiments/EXP-STR-003/ may be read-modified, written or staged by any
      task under this contract, and no run identifier produced here may reuse
      one of theirs.
    - >-
      Not a repair of harness/endomorphism_la.py. THE COMMITTED HARNESS IS THE
      OBJECT OF MEASUREMENT. Modifying it - including "fixing" the IndexError at
      line 451, or the hardcoded inference block at harness/runner.py:140-146,
      or the hardcoded `sage_version: None` at harness/runner.py:53 - would
      destroy the measurement and requires a versioned protocol amendment before
      any such change is executed.
    - >-
      Not a third arm. DEC-20260727-009's next action says `two arms and nothing
      else`; this contract adds an INSTANCE dimension and NO arm. It does not
      re-run EXP-STR-003's arms A, B, C, D or E.
  claim_ceiling: >-
    Every statement this experiment can license is confined to a TOY-TIER,
    TWO-ARM, FOURTEEN-CELL MEASUREMENT of a displacement-rank statistic and its
    pre-registered misalignment set, on deterministically generated j=0 (a=0, CM
    discriminant -3) prime-field curves with p = 1 mod 3 at field_bits 12 and
    16, B <= 193, arity m in {2, 3}, ONE realisation per cell, on ONE host and
    ONE software stack. UNDER docs/target-result-profile.md RULE A1 THIS IS NOT
    TARGET-CLASS ON ITS OWN AND THIS FIELD SAYS SO RATHER THAN LEAVING IT TO BE
    INFERRED. It is admitted under A1's building-block clause only because an
    undischarged replication obligation on this goal's sole active hypothesis is
    a defect in a building block, and because leaving it undischarged
    permanently blocks H-STR-002 from moving in EITHER direction. NOT CLAIMABLE
    FROM THIS EXPERIMENT UNDER ANY OUTCOME: any statement about B > 193, about
    field_bits > 16, about j != 0 curves, about generic curves, about arity
    m > 3, or about medium or cryptographic scale; any cost claim, cost ratio,
    structured-solve cost, Wiedemann comparison, density penalty or crossover;
    any re-charging, flagging or defence of any index-calculus cost model, with
    RT-CM-1 through RT-CM-6 remaining OPEN and untouched; any asymptotic
    statement in either direction; and any claim that a GOAL-ECDLP-001
    completion criterion is met. All four asymptotic-claim promotion gates in
    agents/coordinator.md remain OPEN and this contract does not attempt them.
  what_this_experiment_may_not_conclude:
    - >-
      N-1 THAT H-STR-002's MECHANISM IS RIGHT OR WRONG. No arm tests it. This
      must be stated in EV-STR-004 and DEC-20260729-004 in the same terms
      EV-STR-003 used, because the temptation to read an instrument result as a
      mechanism result is exactly what produced DEC-20260726-006.
    - >-
      N-2 THAT alpha IS O(1), OR THAT IT IS NOT. Fourteen toy cells support
      neither. If alpha <= 3 holds at all ten ladder cells for arm A-prime it is
      a measured fact about those ten cells and about nothing else - and it is
      NOT support for H-STR-002 if arm E-prime, which has ZERO endomorphism
      content, does the same.
    - >-
      N-3 `reject_scoped` ON A SINGLE UNREPLICATED EMPIRICAL-ONLY RUN SET, which
      agents/coordinator.md forbids outright. EXP-STR-004 is ONE run set. The
      route to anything stronger than `weaken` runs through the DERIVATION NOTE,
      which is why it is archived BEFORE execution rather than written
      afterwards to justify a verdict.
    - >-
      N-4 ANY COST STATEMENT. This contract measures no time as a result, no
      memory as a result, no operation count and no baseline. RC-7 is declared
      inapplicable below, with its reason and its cost.
    - >-
      N-5 THAT THE REPLICATION IS INDEPENDENT AT MODEL LEVEL OR HARDWARE LEVEL.
      It is session-level and implementation-level independent at best, exactly
      as EV-STR-003's strength_basis records, and integrity note INT-BATCH014-D
      carries that unavailability forward unrepaired.
  what_this_experiment_may_conclude_if_the_run_set_is_valid:
    - >-
      M-1 THAT DEFER-BATCH009-001 IS DISCHARGED, if and only if this contract is
      frozen before execution, executed, snapshot-committed under its own run
      ids, and independently reviewed - and NOT otherwise. Discharge is a
      PROCEDURAL fact established by artifacts and receipts. IT IS NOT ITSELF A
      RESULT and it does not by itself move H-STR-002 one step in either
      direction.
    - >-
      M-2 A VERDICT ON THE INSTRUMENT QUESTION that EV-STR-003 left
      UNADJUDICATED after criterion F1 fired - whether the number the committed
      harness reports as `phi_alpha` carries information about phi-invariance of
      the factor base - at toy tier, on the fourteen named cells, computed by
      the frozen rule of section 7 and interpreted by nobody before the reviews.
    - >-
      M-3 A PRE-REGISTERED alpha-VERSUS-B TABLE at a FIXED curve over a
      sixteen-fold range of B, reported per named cell with its predicted set
      beside it, from which a reader may see whether the measured alpha tracks B
      on those cells - AND NO SCALING LAW.

  # ===================================================================
  # 0b. THE CONTRACT'S OWN RULES, BOUND INTO THE FREEZE
  # ===================================================================
  binding_rules:
    - id: PRED-ID-STR
      rule: >-
        EVERY PREDICTION IN THIS CONTRACT IS AN IDENTITY OF NAMED SETS AT A
        NAMED CELL. NO PREDICTION IS STATED AS A CARDINALITY. Where any record
        of this experiment reports a COUNT it states that it is a count AND
        names its members, or - where the members are too numerous to name
        inline - gives the explicit rule that generates them together with the
        full sorted member list in the raw artifact and the sha256 of that list.
        A MEASURED CARDINALITY EQUAL TO A PREDICTED CARDINALITY WITH A DIFFERENT
        MEMBER SET IS RECORDED AS `cardinality_only_agreement` AND COUNTS AS
        DISAGREEMENT FOR EVERY CRITERION. Reporting it as agreement is a
        contract violation. This rule binds every statement this contract makes
        about itself as well as every prediction.
      why: >-
        THE RECURRENCE IS THE FINDING, NOT THE MAGNITUDE. Named prior instances
        a reader can check: D-2, where PC-2 predicted eleven class flips and
        eleven occurred BUT ONLY FIVE WERE THE SAME CELLS, recorded as
        coincidental and never citable as a successful prediction; RT21-1, where
        a column reporting a COUNT was read as a MAGNITUDE by three successive
        sessions; and RT31-5, where a deviation COUNT that named no member
        survived the Executor, the archiving session and an immutable commit
        message. This contract's whole content is set-valued, which is where the
        rule bites hardest.
    - id: RC-8
      rule: >-
        EVERY QUANTITY CARRIES A DETERMINED OR SAMPLED LABEL. In this contract
        p, n, a, b, zeta3, B, m, the derived seed, the factor base, the target
        sequence, the base row list, the emitted row list, tau(B), T(cell),
        T_E(cell), MIS and alpha are ALL DETERMINED. THIS EXPERIMENT HAS NO
        UNSEEDED RANDOMNESS AND NO SAMPLING ANYWHERE. A second execution at the
        same commit must reproduce every primary value EXACTLY; anything else is
        a defect to report.
    - id: RC-D
      rule: >-
        NO UNQUANTIFIED COMPARATIVE WORD DISPOSES OF ANY NUMBER. `shrink`,
        `closer`, `consistent with`, `essentially`, `small`, `large` and
        `dramatic` are forbidden as dispositive language in any record of this
        experiment. The only dispositions are the set equalities of F-1 to F-5
        and the verdict rule of section 7.
    - id: RC-7
      rule: >-
        DECLARED INAPPLICABLE, WITH ITS REASON, IN THIS CONTRACT'S OWN TEXT.
        EXP-STR-004 solves no instance and recovers no discrete logarithm; it
        measures a matrix statistic. There is no algorithmic task against which
        Pollard rho or BSGS is a matched baseline, and quoting one would be
        decoration. THE COST OF THIS HONESTY IS RECORDED: EV-STR-003's boundary
        `NO ARCHIVED BASELINE AT THE TWO LARGER INSTANCES` stays OPEN, there is
        still no committed rho or BSGS run record at n = 41617 or n = 158071,
        and this experiment does not close that gap.
    - id: RT21-1
      rule: >-
        BOUND AS A PROHIBITION. The C-20 power sentence of the EXP-YIELD lineage
        is false as to its five-per-cent clause, may never be quoted
        unaccompanied, and IS NOT REPRODUCED HERE IN WHOLE OR IN PARAPHRASE.
        This contract also creates NO clause making any sentence mandatory on a
        downstream record.
    - id: EV-STR-001-RANGE
      rule: >-
        THE RELATION-DENSITY PENALTY IS NOT MEASURED BY THIS EXPERIMENT AT ALL.
        If any record of this batch nevertheless touches it, it quotes the WHOLE
        RANGE and never a single figure. EV-STR-001's yield_penalty is
        `C(B,m)/supply medians 17.5/214.9 (p=211), 41.9/924.5 (p=1009),
        87.8/4128.6 (p=4099)` - a range of 17.5x to 4128.6x that GROWS WITH SIZE
        and SUPERLINEARLY IN m. Quoting 17.5x alone is forbidden: it is the
        smallest of six medians, at the smallest prime and the smaller arity,
        and quoting it alone understates the measured penalty by a factor of
        236. The prohibition exists because the temptation is to reach for that
        figure when discussing H-STR-002's third assumption, WHICH THIS
        EXPERIMENT DOES NOT TEST.
    - id: UC-7-UNRESOLVED
      rule: >-
        H-STR-002's falsification condition FC-1 IS AMBIGUOUS AS DRAFTED AND
        THIS CONTRACT DOES NOT RESOLVE IT IN EITHER PARTY'S FAVOUR. On the
        natural reading of "relation collection" it was met at 4 of 4 by
        EXP-STR-003 arm B against arm C; on the defender's reading, in which
        collection INCLUDES the orbit closure because the appends live inside
        `_collect_relations`, it was not met. EV-STR-003 UC-7 records that
        ambiguity as one reason the accompanying transition was `weaken` and
        nothing stronger. No record of this experiment may adopt one reading and
        present it as settled.

  # ===================================================================
  # 1. INPUTS
  # ===================================================================
  inputs:
    commit_binding:
      status: >-
        THE FREEZING SESSION HAD NO SHELL AND NO GIT ACCESS AND VERIFIED NO
        COMMIT IDENTIFIER. It ran no git command, no validator, no allocator, no
        harness and no Sage.
      orchestrator_reported_base: >-
        The dispatching session reported that this work sits on branch
        `cursor/goal-ecdlp-001-batch-014`, based on `origin/main` at short
        commit `f5139200`, which contains the BATCH-014 opening control-plane
        commit at short commit `15fd845b`. THESE ARE ORCHESTRATOR-REPORTED SHORT
        IDENTIFIERS TRANSCRIBED VERBATIM, NOT VERIFIED BY THIS SESSION, and no
        full 40-hex sha is asserted for either.
      binding_rule: >-
        The commit that binds this contract is the one TASK-20260729-041 records
        in its snapshot receipt from git facts. The Executor additionally
        records the FULL commit and the tracked-tree dirty state per run through
        harness.runner.git_state(), plus the sha256 of the four harness sources
        computed at run time (see code_hashes below). Where the
        orchestrator-reported short identifiers and the receipt disagree, THE
        RECEIPT GOVERNS and the disagreement is reported.
    code_under_measurement:
      - path: harness/endomorphism_la.py
        role: >-
          THE INSTRUMENT. Read and called; never modified. The measured value is
          the integer returned by its `_measure_displacement_rank`.
      - path: harness/semaev.py
        role: >-
          relation search (`_find_decomposition`) and the arm E-prime factor
          base (`build_factor_base`). Never modified.
      - path: harness/toycurve.py
        role: >-
          curve arithmetic and deterministic instance generation. Never
          modified. NOTE: it is precisely because the metric's whole pipeline
          depends on this module that the certificate verifier must be
          independent of it (CTRL-2).
      - path: harness/runner.py
        role: run-record writer (`write_run`). Never modified.
    committed_functions_the_driver_must_call:
      - harness.endomorphism_la._generate_j0_instance(seed, field_bits)
      - harness.endomorphism_la._find_zeta3(p)
      - harness.endomorphism_la._build_phi_invariant_factor_base(inst, B, zeta3)
      - harness.endomorphism_la._build_random_factor_base(inst, B)
      - harness.endomorphism_la._measure_displacement_rank(rows, B, "phi", zeta3, p, n)
      - harness.semaev._find_decomposition(E, V, target, a, b, p)
      - harness.runner.write_run / harness.runner.RunResult / harness.runner.curve_id
    forbidden_entry_point: >-
      harness.endomorphism_la.main() IS FORBIDDEN, in process and as a
      subprocess, on two independent grounds. (i) EXP-STR-003 criterion S4
      measured, at 4 of 4 with committed run records, that it raises IndexError
      at harness/endomorphism_la.py:451 with exit code 1 and writes no record
      whenever B mod 3 != 0 with relations present - which is true of SEVEN of
      the fourteen cells declared here. (ii) It cannot express either arm of
      this contract: it hardcodes the line-303/304 dedup and zero filter that
      arm A-prime must disable, and it has no phi-free positional closure at
      all. There is no arm D here and no subprocess invocation of the committed
      program anywhere in this contract.
    why_the_driver_reimplements_the_collection_loop_and_nothing_else: >-
      DECLARED IN ADVANCE AS DEVIATION DEV-BASE-1, NOT DISCOVERED LATER. The
      committed `_collect_relations` cannot express either arm: its closure block
      hardcodes the line-303/304 guard, and its loop stops on
      `len(relations) >= num_targets` where `relations` COUNTS APPENDED ROWS,
      so it cannot deliver a matched BASE-ROW budget. The driver therefore
      reimplements the base-row search to be byte-faithful to the committed
      control flow in every respect that affects which rows are found - the same
      target sequence, the same `seen_targets` dedup, the same
      `semaev._find_decomposition` call for m = 2, the same quadruple loop with
      first-hit-wins for m = 3, the same line-289 base-row zero filter - and
      differs ONLY in (a) the stopping condition, which counts BASE rows, and
      (b) the closure block, which is the arm's declared unconditional closure.
      THE MEASUREMENT FUNCTION ITSELF IS NEVER REIMPLEMENTED: reimplementing
      `_measure_displacement_rank` would measure a different object, and doing
      so invalidates the cell (IV-11).
    instance_construction: >-
      The driver constructs its own instances. For each declared curve it calls,
      in this exact order: (1) inst = _generate_j0_instance(requested_seed,
      field_bits); (2) if inst is None the curve is recorded
      `instance_unavailable` and every cell on it is `cancelled_by_budget` with
      the reason stated (stopping rule SR-11); (3) p = inst.p, n = inst.n,
      a = inst.a, b = inst.b, derived_seed = inst.seed; (4) zeta3 =
      _find_zeta3(p), and if None the curve is `instance_unavailable`;
      (5) curve_id(p, a, b, field_bits) from harness/runner.py. EVERY ONE of p,
      n, a, b, zeta3, requested_seed, derived_seed (which is
      requested_seed*100 + offset), B, m and B mod 3 is recorded in every run
      record produced from that instance.
    parameters_are_computed_never_transcribed: >-
      NO instance parameter may be hardcoded, transcribed from a report, or
      supplied on the command line. EV-STR-003 records
      `p in {2293, 2953, 42013, 631843}` and `n in {733, 3061, 41617, 158071}`
      across its four instances at 12, 12, 16 and 20 field bits; THIS CONTRACT
      ASSIGNS NONE OF THOSE VALUES TO ANY CELL and asserts no mapping between
      them and the curves below. A mismatch between a computed value and a prior
      record is A FINDING TO REPORT, never a defect to fix and never grounds for
      overriding the computed value.
    curves:
      - label: CURVE-J12S1
        construction: harness.endomorphism_la._generate_j0_instance(seed=1, field_bits=12)
        requested_seed: 1
        field_bits: 12
        note: >-
          The instance EV-STR-003 labels I1, and the ONE instance for which a
          committed EXP-STR-002 run record exists (RUN-STR-phi-b12-s1-m2), so it
          carries a cross-check against a committed record (CTRL-7). NOTE that
          the committed record is at B = ceil(isqrt(n)), which is NOT one of the
          declared B values here, so the cross-check is on the INSTANCE
          PARAMETERS (p, n, curve_id, derived seed) and not on any alpha.
      - label: CURVE-J16S3
        construction: harness.endomorphism_la._generate_j0_instance(seed=3, field_bits=16)
        requested_seed: 3
        field_bits: 16
        note: The instance EV-STR-003 labels I3. No committed record overlaps any cell on it.
    B_is_a_free_parameter_and_that_is_the_whole_design: >-
      `_build_phi_invariant_factor_base(inst, B, zeta3)` TAKES B AS A FREE
      PARAMETER, so B can be swept AT A FIXED CURVE. EV-STR-003 observation O-1
      measured four alphas at four DIFFERENT curves with B tied to each curve by
      B = ceil(isqrt(n)), so B and the curve moved together and neither was
      isolated. That is the confound this design removes, and it costs no new
      mathematics. H-STR-002's primary prediction is `alpha <= r = 3 for
      phi-invariant factor bases AT ALL TESTED B`; the word doing the work is
      ALL, and a replication that measures alpha at one B establishes nothing
      about independence of B.
    shift_operator:
      declared_for_both_arms: phi
      definition: >-
        shift_type "phi" in `_measure_displacement_rank`, the positional
        block-of-3 permutation Z built at harness/endomorphism_la.py:174-183,
        i.e. sigma(3j+k) = 3j + ((k+1) mod 3) for 3j+k < 3*(B//3), and
        sigma(i) = i for i >= 3*(B//3).
      why_identical_across_arms: >-
        So that the ONE variable separating the arms is the FACTOR BASE and its
        phi-invariance, and nothing else. The seeded random shift of
        harness/endomorphism_la.py:185-193 is NOT used anywhere in this
        contract; a run recording shift_type other than "phi" is invalid
        (IV-12).
    solver_availability_check_carried_verbatim:
      status: >-
        PERFORMED BEFORE THE FREEZE AND IT PASSED. Carried here as required by
        the BATCH-014 execution gate.
      who_and_when: >-
        The dispatching session, on 2026-07-29, before the BATCH-014 dispatch
        queue was authored and therefore strictly before any EXP-STR-004
        contract text existed.
      what_was_observed_verbatim: >-
        SageMath 10.9, release date 2026-05-04, is installed at
        /usr/local/bin/sage and computes correctly: it built
        EllipticCurve(GF(1009),[1,1]), returned order 1034, and produced a
        generator of that order. `import sage` from the system python3 FAILS.
      provenance_and_its_limits: >-
        THIS IS A HOST OBSERVATION BY THE DISPATCHING SESSION, NOT AN ARCHIVED
        RESULT. It has no run id, no manifest, no seed record, no receipt and no
        independent verification. It is recorded as the PROVENANCE OF A DESIGN
        DECISION and MAY NOT BE CITED ANYWHERE AS A MEASUREMENT, AS A CONTROL,
        OR AS EVIDENCE OF ANYTHING. It is the analogue of the EXP-STR-003 probe
        values and is treated the same way: recorded in advance, never promoted.
      re_observed_at_freeze_time_by_the_dispatching_session: >-
        The dispatching session re-reported, immediately before this card ran,
        `which sage` -> /usr/local/bin/sage and `sage --version` -> "SageMath
        version 10.9, Release Date: 2026-05-04". CARRIED VERBATIM AS A
        PRE-FREEZE HOST OBSERVATION WITH THE SAME LIMITS. The freezing session
        did not run either command and does not claim to have.
      binding_executor_obligation: >-
        THE EXECUTOR CAPTURES THE EXACT `sage --version` STRING EXACTLY ONCE,
        BEFORE THE FIRST COMPUTATION, and records it VERBATIM in every one of
        the 28 manifests and in results/certificate_verification.json, together
        with the statement that it is ONE CAPTURE REUSED VERBATIM - not 28
        independent probes asserted as 28. Because
        harness/runner.py::environment() hardcodes `sage_version: None` at line
        53 and the harness may not be modified, the string is carried into the
        manifest through RunResult.parameters as
        `sage_version_string`, and the hardcoded None is DISCLOSED in every
        raw-result.json rather than repaired.
      infrastructure_signal_disposition: >-
        IF THE CAPTURED STRING DOES NOT NAME SageMath 10.9 WITH RELEASE DATE
        2026-05-04, or the `sage` binary is absent, or it fails to start, or it
        exits nonzero, THE EXECUTOR STOPS AND REPORTS. The mismatch is
        INFRASTRUCTURE SIGNAL, is recorded as such in the run records, and NO
        MATHEMATICAL CONCLUSION IS DRAWN FROM IT IN EITHER DIRECTION (AGENTS.md
        core rule 5).
      what_this_check_does_not_settle: >-
        It does not establish that the Sage verifier is correct, that the harness
        is correct, or that any cell is measurable. It establishes that the
        computer-algebra dependency the BATCH-013 scope ruling flagged as
        UNRESOLVED was present and functioning on this host on the day the queue
        was written, and nothing more.
    host_disk_observation_and_a_discrepancy_recorded_not_overwritten:
      current_observation_by_the_dispatching_session: >-
        `df -h .` immediately before this card ran reported size 1.8Ti, 208Gi
        used, 1.6Ti available, 12 percent capacity, on the volume holding this
        worktree. Transcribed verbatim; the freezing session ran no command.
      the_older_note_it_disagrees_with: >-
        The BATCH-014 dispatch queue's artifact_size_budget and
        operational_hazards blocks, and the GOAL-ECDLP-001 next_action, state
        that the volume is AT 99 PERCENT WITH ABOUT 30 GiB FREE and that
        `git fsck` timed out on it. THAT STATEMENT IS NOT DELETED, NOT EDITED
        AND NOT SILENTLY SUPERSEDED HERE - this contract has no write access to
        the queue or the goal record, and an immutable coordination record is
        corrected by a new record, never by preference.
      disposition: >-
        BOTH OBSERVATIONS ARE RECORDED. They are inconsistent, they were taken
        at different times by the same kind of unarchived host probe, and
        NEITHER IS AN ARCHIVED RESULT. The consequence for this contract is
        exactly nil: the MANDATORY PRE-FLIGHT DISK CHECK (PF-3) and the
        below-5-GiB stop are binding regardless of which figure a reader
        believes, because the Executor measures free space itself and records
        the exact figure before the first write. The `git fsck` timeout is
        carried unretracted: archive cards must expect git operations here to be
        slow and MUST NOT read a slow or timed-out git command as a verification
        failure - an unfinished verification is reported as unfinished, never as
        PASS and never as FAIL.
    environment_binding:
      python: recorded per run by harness/runner.py::environment()
      dependencies_recorded_by_the_harness: [sympy, pyyaml]
      numpy_note: >-
        numpy is imported INSIDE `_measure_displacement_rank` (line 130) and is
        NOT in harness/runner.py::environment()'s dependency dict. The driver
        MUST record numpy.__version__ explicitly in every raw-result.json under
        `environment_supplement`, or the artifact policy's dependency-version
        requirement is not met for the primary metric's own dependency.
      sage_note: >-
        harness/runner.py::environment() returns `sage_version: None`,
        hardcoded at line 53. The harness is the object of measurement and is
        not modified. The captured `sage --version` string is recorded in
        RunResult.parameters, in raw-result.json under
        `environment_supplement`, and in results/certificate_verification.json,
        and the hardcoded None is disclosed in every raw-result.json.
      inference_block_note: >-
        harness/runner.py:140-146 HARDCODES manifest.run.inference to
        `requested_policy: executor-terra`, `resolved_model_id: none
        (deterministic harness execution)` and `fallback_used: false`. That is
        the defect EV-STR-003 UC-5 records, it is hardcoded in a harness this
        contract forbids modifying, and it is NOT repaired here. The Executor
        MUST write an `inference_supplement` block in every raw-result.json
        carrying the true requested policy, resolved model, model_verified,
        model_provenance, fallback_used and degraded_requirements, AND a
        statement that manifest.run.inference is hardcoded and must not be read
        as the executing session's provenance. A reader of manifest.yaml alone
        would otherwise conclude no fallback occurred.
      code_hashes: >-
        The driver records the SHA-256 of harness/endomorphism_la.py,
        harness/semaev.py, harness/toycurve.py and harness/runner.py, computed
        at run time from the working tree, in every raw-result.json under
        `code_hashes`. All 28 runs must agree; a disagreement invalidates the
        SET (IV-8).

  # ===================================================================
  # 2. INDEPENDENT VARIABLES, THE TWO ARMS, AND NO THIRD
  # ===================================================================
  independent_variables:
    - arm: [A-prime, E-prime]
    - cell: >-
        the fourteen named (curve, B, m) cells of section 3. B is the primary
        instance variable and is swept sixteen-fold (12 to 192) at a FIXED
        curve; B mod 3 is varied at every rung; the curve is varied at one rung
        only; m is varied at the smallest rung only.
  held_fixed:
    - the shift operator, "phi", identical in both arms at every cell
    - the base-row budget R_base(cell), a function of B alone, identical across arms
    - the curve, its derived seed, zeta3, B and m within a cell
    - >-
      the target sequence, which depends only on (derived_seed, n, t_idx) and
      therefore on neither the arm nor B - see CTRL-3
    - the committed harness sources, unmodified
  arms:
    - id: A-prime
      name: phi-invariant factor base with the line-303/304 guard DISABLED
      authority: >-
        DEC-20260727-009's next action, verbatim in content: "the as-committed
        phi arm with the line-303/304 dedup and zero-filter disabled so shifted
        rows are appended unconditionally". EV-STR-003 UC-1 names it `arm
        A-prime` in those words.
      factor_base: >-
        harness.endomorphism_la._build_phi_invariant_factor_base(inst, B, zeta3)
        at the cell's declared B. PHI-INVARIANT except for the truncated tail
        when B mod 3 != 0, which is a property of the committed builder's
        `xs[:B]` return and IS MEASURED, NOT REPAIRED.
      base_rows: >-
        R_base(cell) rows found by the base-row search of
        inputs.why_the_driver_reimplements_the_collection_loop_and_nothing_else,
        over THIS arm's factor base.
      closure: >-
        THE COMMITTED APPEND RULE WITH THE LINE-303/304 DEDUP AND ZERO FILTER
        DISABLED. For each base row r, in collection order, and for each shift
        in (1, 2) in that order: form shifted_row exactly as
        harness/endomorphism_la.py:294-302 does - for every idx with r[idx]
        nonzero, compute shifted_x = pow(zeta3, shift, p) * factor_base[idx] % p
        and, IF AND ONLY IF shifted_x is in factor_base, set
        shifted_row[factor_base.index(shifted_x)] = 1 - and APPEND IT
        UNCONDITIONALLY. The `sum(shifted_row) > 0` filter and the
        `shifted_row not in relations` dedup are BOTH OFF. The emitted stream is
        therefore exactly (r, shift-1 row, shift-2 row) per base row, in that
        order, with length exactly 3 * R_base(cell).
      declared_shift: phi
      a_property_of_this_arm_declared_in_advance_rather_than_discovered_later: >-
        WITH THE ZERO FILTER DISABLED, SOME APPENDED ROWS ARE NOT GENUINE
        RELATIONS. If a summand's phi-image falls outside the truncated factor
        base, the shifted row SILENTLY DROPS THAT COORDINATE, and the resulting
        row does not certify any decomposition. THIS IS DECLARED HERE, BEFORE
        EXECUTION, AS A PROPERTY OF THE ARM, and its consequences are binding:
        appended rows carry certificate kind `none` WITH THAT REASON RECORDED;
        NO RECORD MAY DESCRIBE ARM A-PRIME'S MATRIX AS A MATRIX OF RELATIONS;
        and an alpha of 0 obtained on a matrix containing non-relations is a
        fact about the ROW LIST, not about a solvable system. Discovering this
        after the result and calling it a caveat would be the failure. The
        derivation note, section 6, Claim 4a, derives the drop exactly.
    - id: E-prime
      name: phi-free positional closure, zero endomorphism content
      authority: >-
        DEC-20260727-009's next action, verbatim in content: "a phi-free closure
        that emits each sigma-orbit once and never suppresses, which isolates
        closure convention from endomorphism content". EV-STR-003 UC-1 names it
        `arm E-prime` in those words; observation O-4 adjudicated arm E's
        divergence as a difference of CLOSURE CONVENTION and named this arm as
        the successor that converts that diagnosis into evidence.
      factor_base: >-
        harness.endomorphism_la._build_random_factor_base(inst, B) at the same
        declared B. NOT phi-invariant. ZERO ENDOMORPHISM CONTENT.
      base_rows: >-
        R_base(cell) rows found by the IDENTICAL base-row search over THIS arm's
        factor base, from the IDENTICAL target sequence.
      closure: >-
        A PHI-FREE CLOSURE THAT EMITS EACH SIGMA-ORBIT ONCE AND NEVER
        SUPPRESSES. For each base row r, in collection order, emit r, then
        sigma(r), then sigma^2(r), in that order, UNCONDITIONALLY, with no dedup
        and no zero filter, where sigma is the SAME positional block-of-3
        permutation and sigma^k(r) means the row with
        sigma^k(r)[sigma^k(i)] = r[i] for every i in [0, B). THERE IS NO zeta3
        MULTIPLICATION AND NO MEMBERSHIP TEST, so no coordinate can be dropped.
        The stream length is exactly 3 * R_base(cell).
      declared_shift: phi
      what_it_isolates: >-
        CLOSURE CONVENTION FROM ENDOMORPHISM CONTENT. The appended rows are
        index permutations of incidence vectors over a factor base that is NOT
        phi-invariant; they are not images of any relation under any map of the
        curve and they are MATHEMATICALLY WORTHLESS AS RELATIONS. THAT IS THE
        POINT OF THE ARM and it is recorded here as it was for EXP-STR-003 arm
        E. The arm is not offered as a competing method.
      the_difference_from_EXP_STR_003_arm_E: >-
        EXP-STR-003 arm E mirrored the committed filter and dedup term for term
        (its frozen contract, section 2, arm E `synthetic_closure`), so it
        SUPPRESSED rows and, per EV-STR-003 observation O-4, consumed 2.5x to
        3.0x as many base rows as arm A. That uncontrolled nuisance variable is
        why criterion F1 fired and the instrument question was left
        UNADJUDICATED. HERE SUPPRESSION IS IMPOSSIBLE BY CONSTRUCTION AND THE
        BASE-ROW BUDGET IS MATCHED BY CONSTRUCTION.
      anticipated_rebuttal_recorded_in_advance: >-
        "Arm E-prime's rows are fake, so comparing them to real ones is a
        category error." Recorded because it is the strongest available
        objection and must not be discovered after the result. `phi_alpha`
        claims to detect a property of the MATRIX; arm E-prime exhibits a matrix
        that may score identically while lacking the causal property
        (phi-invariance of F) the hypothesis says produces it. A statistic that
        cannot distinguish worthless rows from genuine ones carries no
        information about which it was given. Note also that arm A-prime's
        appended rows are NOT all genuine relations either (see that arm's
        declared property), so "real versus fake" is not a clean partition of
        the two arms and this contract does not present it as one.
  the_nuisance_variable_is_controlled_by_construction: >-
    THE FAILURE F1 FIRED ON IS DESIGNED OUT, NOT ARGUED AWAY. (a) MATCHED
    BASE-ROW BUDGET: both arms collect EXACTLY R_base(cell) base rows before any
    closure, and R_base is a function of B alone, identical across the two arms
    at every cell. (b) UNCONDITIONAL CLOSURE IN BOTH ARMS, so suppression is
    impossible by construction and the pre-registered suppression count is ZERO
    for both arms at every cell; every cell reports alpha BESIDE its suppression
    count, as EV-STR-003 UC-2 requires. (c) IDENTICAL SHIFT OPERATOR IN BOTH
    ARMS. (d) IDENTICAL B, IDENTICAL m, IDENTICAL curve, IDENTICAL derived seed
    and IDENTICAL target sequence within a cell. (e) NEITHER ARM IS TOPPED UP TO
    MATCH THE OTHER: a shortfall is recorded, not compensated.
  shortfall_disposition: >-
    A SHORTFALL AT EITHER ARM IS RECORDED NAMING THE CELL AND THE ARM, and that
    CELL is EXCLUDED from every comparative criterion (F-3, F-4, F-5 and the
    P-3 comparison), with the exclusion STATED IN THE SUMMARY by cell name and
    arm name. The excluded cell's own measured values are still recorded in
    full. The verdict is then `incomplete`. DO NOT collect extra rows for one
    arm alone to close a gap; that would move the nuisance variable this design
    exists to control.

  # ===================================================================
  # 3. THE FOURTEEN NAMED CELLS
  # ===================================================================
  cells:
    note: >-
      FOURTEEN CELLS, NAMED INDIVIDUALLY. Every criterion is evaluated CELL BY
      CELL and every failure is reported BY CELL NAME, never as a count of
      failing cells. `R_base` is `ceil(B/3)`, a function of B alone, identical
      across the two arms. `emitted_rows` is `3 * R_base`, which is >= B at
      every cell, so the SQUARE branch of harness/endomorphism_la.py:233-242 is
      taken at every cell and the rectangular limb is never reached.
      `tail_index` is the single member of tau(B) where B mod 3 == 1, and
      `none` where B mod 3 == 0.
    ladder_CURVE_J12S1_m2_ten_cells:
      - {id: L12,  curve: CURVE-J12S1, B: 12,  m: 2, B_mod_3: 0, q: 4,  tail_index: none, R_base: 4,  emitted_rows: 12,  predicted_mis_a_prime: "EMPTY SET (P-1)"}
      - {id: L13,  curve: CURVE-J12S1, B: 13,  m: 2, B_mod_3: 1, q: 4,  tail_index: 12,   R_base: 5,  emitted_rows: 15,  predicted_mis_a_prime: "T(cell) (P-2)"}
      - {id: L24,  curve: CURVE-J12S1, B: 24,  m: 2, B_mod_3: 0, q: 8,  tail_index: none, R_base: 8,  emitted_rows: 24,  predicted_mis_a_prime: "EMPTY SET (P-1)"}
      - {id: L25,  curve: CURVE-J12S1, B: 25,  m: 2, B_mod_3: 1, q: 8,  tail_index: 24,   R_base: 9,  emitted_rows: 27,  predicted_mis_a_prime: "T(cell) (P-2)"}
      - {id: L48,  curve: CURVE-J12S1, B: 48,  m: 2, B_mod_3: 0, q: 16, tail_index: none, R_base: 16, emitted_rows: 48,  predicted_mis_a_prime: "EMPTY SET (P-1)"}
      - {id: L49,  curve: CURVE-J12S1, B: 49,  m: 2, B_mod_3: 1, q: 16, tail_index: 48,   R_base: 17, emitted_rows: 51,  predicted_mis_a_prime: "T(cell) (P-2)"}
      - {id: L96,  curve: CURVE-J12S1, B: 96,  m: 2, B_mod_3: 0, q: 32, tail_index: none, R_base: 32, emitted_rows: 96,  predicted_mis_a_prime: "EMPTY SET (P-1)"}
      - {id: L97,  curve: CURVE-J12S1, B: 97,  m: 2, B_mod_3: 1, q: 32, tail_index: 96,   R_base: 33, emitted_rows: 99,  predicted_mis_a_prime: "T(cell) (P-2)"}
      - {id: L192, curve: CURVE-J12S1, B: 192, m: 2, B_mod_3: 0, q: 64, tail_index: none, R_base: 64, emitted_rows: 192, predicted_mis_a_prime: "EMPTY SET (P-1)"}
      - {id: L193, curve: CURVE-J12S1, B: 193, m: 2, B_mod_3: 1, q: 64, tail_index: 192,  R_base: 65, emitted_rows: 195, predicted_mis_a_prime: "T(cell) (P-2)"}
    cross_curve_CURVE_J16S3_m2_two_cells:
      - {id: X96, curve: CURVE-J16S3, B: 96, m: 2, B_mod_3: 0, q: 32, tail_index: none, R_base: 32, emitted_rows: 96, predicted_mis_a_prime: "EMPTY SET (P-1)"}
      - {id: X97, curve: CURVE-J16S3, B: 97, m: 2, B_mod_3: 1, q: 32, tail_index: 96,   R_base: 33, emitted_rows: 99, predicted_mis_a_prime: "T(cell) (P-2)"}
    arity_CURVE_J12S1_m3_two_cells:
      - {id: A12M3, curve: CURVE-J12S1, B: 12, m: 3, B_mod_3: 0, q: 4, tail_index: none, R_base: 4, emitted_rows: 12, predicted_mis_a_prime: "EMPTY SET (P-1)"}
      - {id: A13M3, curve: CURVE-J12S1, B: 13, m: 3, B_mod_3: 1, q: 4, tail_index: 12,   R_base: 5, emitted_rows: 15, predicted_mis_a_prime: "T(cell) (P-2)"}
    why_this_ladder: >-
      A DOUBLING LADDER WITH A MATCHED PLUS-ONE COMPANION AT EVERY RUNG. The
      doubling gives a sixteen-fold range of B (12 to 192) at a FIXED curve,
      which is the independence-of-B lever. The plus-one companion gives the
      residue contrast: `_build_phi_invariant_factor_base` returns `xs[:B]`, so
      at B = 3q+1 the LAST phi-orbit is TRUNCATED to a single element whose
      phi-image is not in F, while at B = 3q the factor base is a clean union of
      q whole orbits. B mod 3 is therefore the one structural variable that
      separates a phi-invariant factor base from an ALMOST-phi-invariant one,
      and it is varied at every rung rather than confounded with size.
    why_the_cross_curve_cells: >-
      THE CONTROL SEPARATING A PROPERTY OF THE LADDER FROM A PROPERTY OF ONE
      CURVE. Two cells only, at one rung: two is enough to detect a gross curve
      dependence and more would buy proportionally more compute for a question
      this contract does not primarily ask. IF X96 AND X97 DISAGREE WITH L96 AND
      L97, THAT IS A FINDING TO REPORT AND IT BOUNDS EVERY LADDER STATEMENT TO
      ONE CURVE. The consequence is stated in advance.
    why_the_arity_cells: >-
      EV-STR-003's boundaries clause records in terms that NOTHING IN IT EXTENDS
      TO ARITY m = 3, because every one of its sixteen cells ran at m = 2. Two
      m = 3 cells at the smallest rung remove that as a TOTAL BLIND SPOT at a
      cost the relation-collection loop can bear: the committed m = 3 branch is
      a quadruple loop over the factor base, so its cost grows like B squared
      per target and only the smallest rung is affordable. TWO CELLS DO NOT
      ESTABLISH m = 3 BEHAVIOUR, and this contract says so; they establish
      whether the m = 2 pattern survives at all at m = 3 on those two cells.
    what_was_traded_to_fit_and_it_is_named: >-
      TWO THINGS WERE CUT AND BOTH ARE NAMED. (a) THE 20-BIT INSTANCE,
      EV-STR-003's I4 at B = 397, is NOT in this contract: its rank measurement
      costs roughly eight times the top ladder rung and it would have bought one
      more curve rather than one more B. CONSEQUENCE STATED: nothing here
      extends to B > 193 or to field_bits > 16, and EV-STR-004 must say so.
      (b) THE m = 3 SWEEP IS TWO CELLS AT THE SMALLEST RUNG ONLY. CONSEQUENCE
      STATED: two cells do not establish m = 3 behaviour.

  # ===================================================================
  # 4. CONTROLS
  # ===================================================================
  controls:
    - id: CTRL-1
      control: >-
        ARM E-PRIME, THE PHI-FREE POSITIVE CONTROL ON THE NULL, on a MATCHED
        base-row budget with an UNCONDITIONAL closure. This is the decisive
        control and the whole discriminating content of the experiment. It
        repairs the mis-specification EV-STR-003 observation O-4 records
        (EXP-STR-003 arm E consumed 2.5x-3.0x the base rows of arm A) and the
        mis-specified comparative criterion O-4 names (EXP-STR-003 S1 predicted
        arm E would score AT LEAST AS WELL as arm A, which is strictly stronger
        than the proposition at issue; P-3 here predicts EQUALITY).
    - id: CTRL-2
      control: >-
        INDEPENDENT CERTIFICATE RE-VERIFICATION BY SAGE. Every BASE row of both
        arms is a claimed decomposition and carries a `decomposition`
        certificate. A SEPARATE Sage verifier, invoked THROUGH THE `sage` BINARY
        and NEVER as a Python import, reconstructs each curve as
        EllipticCurve(GF(p),[a,b]) and re-verifies every certificate with
        Sage's OWN elliptic-curve arithmetic. IT MUST NOT IMPORT, CALL OR
        REPLICATE harness/toycurve.py. This matters precisely because the whole
        measurement pipeline - instance generation, factor bases, relation
        search - runs through harness/toycurve.py, so the harness's own
        `verify_decomposition_certificate` (harness/semaev.py:174) is NOT the
        independent verifier this control requires: it is independent of the
        SOLVER but not of the curve arithmetic. Both are recorded, and they are
        labelled differently.
    - id: CTRL-3
      control: >-
        IDENTICAL TARGET SEQUENCE ACROSS ARMS AND ACROSS B. The target scalar is
        `k = (t_idx + 1) * max(2, derived_seed % max(2, n - 3)) % (n - 1) + 1`,
        byte-faithful to harness/endomorphism_la.py:272, and depends only on
        t_idx, derived_seed and n - NOT on the arm, the factor base or B. Both
        arms therefore see the SAME targets in the SAME order at every cell and
        differ only in which of them decompose over their own factor base. The
        driver records the ordered list of attempted target x-coordinates per
        cell (or its sha256 under the per-run size cap) so this is checkable.
    - id: CTRL-4
      control: >-
        THE STATIC BOUND, computed independently of any rank computation.
        MIS(arm, cell) is computed by the driver directly from the final row
        list by the definition in section 5, and `alpha <= |MIS|` (P-4) is a
        FALSIFIER (F-2), not a fitted quantity. It is the derivational limb
        EV-STR-003 observation O-6 records as CONFIRMED at 4 of 4 in its
        rescoped form, and Corollary 2b of the derivation note derives it.
    - id: CTRL-5
      control: >-
        INTRA-RUN DETERMINISM RECHECK at the four cells L12, L13, A12M3 and
        A13M3 only (kept cheap by design): each arm recomputes its alpha a
        second time from the identical row list and asserts equality, recorded
        as `determinism_check: pass | fail` in that run's raw-result.json. A
        failure invalidates that run (IV-7). Repeats are pointless where the
        computation is deterministic; this checks that it IS.
    - id: CTRL-6
      control: >-
        FACTOR-BASE PREFIX-NESTING CHECK. Per Remark 1 of the derivation note,
        on a fixed curve the factor base at a smaller B is a PREFIX of the
        factor base at a larger B, for both builders, so long as the candidate
        trial bound is not exhausted. The driver asserts, per arm on
        CURVE-J12S1, that F(12) is a prefix of F(13), F(13) of F(24), and so on
        up the ladder, and records each assertion. THIS IS WHAT MAKES THE SWEEP
        A ONE-VARIABLE COMPARISON, and it is checked rather than assumed. A
        failure is a FINDING TO REPORT and it bounds every cross-B statement.
    - id: CTRL-7
      control: >-
        INSTANCE CROSS-CHECK AGAINST THE ONE OVERLAPPING COMMITTED RECORD.
        CURVE-J12S1 is EV-STR-003's I1, for which
        experiments/EXP-STR-002/runs/RUN-STR-phi-b12-s1-m2/raw-result.json
        exists. The driver compares the COMPUTED p, n and curve_id against that
        record's corresponding fields and records the comparison. NO ALPHA IS
        COMPARED: the committed record is at B = ceil(isqrt(n)), which is not a
        declared B here. AGREEMENT is a provenance check on the driver;
        DISAGREEMENT IS A FINDING TO REPORT, never a defect to fix, and the
        committed record is never edited.
    - id: CTRL-8
      control: >-
        PROVENANCE CONTROL. Every run records the git commit, the tracked-tree
        dirty state, the sha256 of the four harness sources, numpy, sympy and
        Python versions, the captured `sage --version` string, the sha256 of the
        factor base and the sha256 of the final row list. The last two close
        EV-STR-003 UC-6 PROSPECTIVELY: an alpha becomes CHECKABLE from the
        archived artifacts and not merely REPRODUCIBLE by re-execution. NOTHING
        IN THE IMMUTABLE EXP-STR-003 PACKAGE IS REPAIRED BY THIS.

  # ===================================================================
  # 5. METRICS
  # ===================================================================
  metrics:
    primary:
      - name: alpha
        per: (arm, cell)
        label: DETERMINED
        definition: >-
          The integer returned by the COMMITTED
          harness.endomorphism_la._measure_displacement_rank(rows, B, "phi",
          zeta3, p, n) on the arm's final row list and the cell's B. The -1
          sentinel of the committed main() is NOT used and is not reachable:
          main() is a forbidden entry point and the function itself returns 0 on
          an empty row list. If an arm collected fewer than R_base(cell) base
          rows, that is a SHORTFALL under SR-4 and the cell is excluded from the
          comparative criteria; alpha is still recorded.
        recorded_as: integer
      - name: MIS
        per: (arm, cell)
        label: DETERMINED
        definition: >-
          The SET of row indices i in [0, B) at which row i of the displacement
          matrix is not the zero row, computed by the driver DIRECTLY from the
          final row list R and independently of any rank computation. With
          rows = len(R), cols = B, branch = "square" if rows >= cols else
          "rectangular" (matching harness/endomorphism_la.py:220-235), and
          shift_row(r) the row with shift_row(r)[sigma(j)] = r[j]:
          in the square branch, M = R[:cols] and
          MIS = { i in [0, cols) : M[sigma(i)] != shift_row(M[i]) }.
          Lemma 2 of the derivation note derives that this set is exactly the
          set of non-vanishing rows of the displacement matrix. Every cell of
          this contract takes the square branch; the rectangular formula
          (MIS = { i in [0, rows) : shift_row(R[i]) != R[i] }) is recorded for
          completeness and its use at any cell means a shortfall occurred.
        recorded_as: >-
          the full sorted member list, its cardinality LABELLED AS A COUNT, and
          the sha256 of the member list
      - name: T
        per: (arm A-prime, cell)
        label: DETERMINED
        definition: >-
          The PREDICTED misalignment set for arm A-prime, computed by the driver
          from the closed-form rule of derivation_note.md section 8.1 applied to
          artifacts that exist BEFORE any alpha is measured - the factor base
          and the base row list, both sha256-recorded - namely
          T(cell) = { 3t : 0 <= t < q and r_{t+1}[e] != 0 }
                  U { 3t+2 : 0 <= t < q and r_{t+1}[e] != 0 }
                  U { 3q : if r_{q+1} != shift_row(r_{q+1}) }
          where e is the cell's tail_index, q = B // 3, and r_1..r_{R_base} are
          the base rows in collection order; and T(cell) is the EMPTY SET
          whenever B mod 3 == 0. The driver MUST compute T before computing
          alpha at that cell, and record the order.
        recorded_as: the full sorted member list plus its cardinality labelled as a count
    secondary:
      - name: T_E
        per: (arm E-prime, cell)
        label: DETERMINED
        status: >-
          DERIVATION REFERENCE, NOT A CRITERION AND NOT A PREDICTION OF THIS
          CONTRACT. T_E(cell) is the set derivation_note.md section 8.2 derives
          for arm E-prime: the empty set when B mod 3 == 0, and
          { 3q } exactly when r_{q+1} != shift_row(r_{q+1}) otherwise. IT
          ENTERS NO CRITERION AND CANNOT CHANGE ANY VERDICT. It is reported so
          that a reviewer can see, per cell, whether an F-4 firing is the
          truncation artifact the derivation predicts or something else. The
          pre-registered prediction for arm E-prime remains P-3 and only P-3.
      - name: symmetric_difference
        per: (arm, cell)
        definition: the symmetric difference of the measured MIS and the predicted set, as a sorted member list
      - name: cardinality_only_agreement
        per: (arm, cell)
        definition: >-
          true exactly when |MIS| equals the predicted cardinality AND the
          member sets differ. Under PRED-ID-STR this COUNTS AS DISAGREEMENT for
          every criterion and must never be reported as agreement.
      - name: suppression_count
        per: (arm, cell)
        pre_registered_value: 0
        definition: >-
          The number of candidate appended rows that WOULD have been rejected by
          the committed `sum(shifted_row) > 0` filter or the
          `shifted_row not in relations` dedup, counted and REPORTED but NEVER
          ACTED ON, since both closures are unconditional. Pre-registered as
          ZERO for both arms at every cell BY CONSTRUCTION (suppression is
          impossible), and reported BESIDE alpha at every cell as EV-STR-003
          UC-2 requires. A NONZERO value is a FINDING TO REPORT and invalidates
          that run (IV-5), because the closure was then not unconditional as
          declared.
      - name: base_rows_collected
        definition: >-
          count of base rows found before any closure, with R_base(cell) beside
          it. A value below R_base(cell) is a SHORTFALL (SR-4).
      - name: rows_final
        definition: length of the row list handed to the measurement; equals 3 * base_rows_collected by construction
      - name: appended_row_count
        definition: rows_final minus base_rows_collected; equals 2 * base_rows_collected by construction
      - name: branch
        definition: '"square" or "rectangular" - which limb of harness/endomorphism_la.py:220-235 executed'
      - name: target_attempts
        definition: >-
          number of distinct target x-coordinates attempted before R_base(cell)
          base rows were found, with the attempt cap T_max(B) = 5 * max(10, B + 10)
          beside it
      - name: factor_base_sha256
        definition: sha256 of the JSON serialisation of the factor base list, in order
      - name: row_list_sha256
        definition: sha256 of the JSON serialisation of the final row list, in order
      - name: determinism_check
        definition: '"pass" or "fail" at the four cells CTRL-5 names; "not_computed" elsewhere'
      - name: prefix_nesting_check
        definition: per-arm result of CTRL-6, recorded as pass, fail or not_applicable
      - name: instance_parameters
        definition: p, n, a, b, zeta3, curve_id, requested_seed, derived_seed, B, m, B_mod_3, q, tail_index
      - name: certificate_summary
        definition: >-
          per run: the number of base-row decomposition certificates emitted
          (labelled as a count, with the base-row index of each named in
          raw-result.json), the number Sage re-verified, and the per-certificate
          verdicts in results/certificate_verification.json
    explicitly_not_measured:
      - >-
        NO cost ratio, NO structured_cost, NO wiedemann_cost, NO density_penalty
        and NO crossover claim. This contract measures an instrument. RT-CM-1
        through RT-CM-6 remain OPEN objections that no arm of this experiment
        addresses, and no record of it may describe them as settled, tested or
        addressed.
      - >-
        NO wall-time comparison between a structured solver and Wiedemann. No
        structured solver exists in this repository.
      - >-
        NO rho or BSGS baseline. RC-7 is declared inapplicable above with its
        reason and its cost.
      - >-
        NO `commutation_holds`. EXP-STR-003 recorded it as True by default and
        True by construction, so it discriminates nothing; excluded
        deliberately, not by oversight.
      - >-
        NO rank_M and NO rank_deficiency. EV-STR-003 UC-3 records that those
        rested on a vectorised implementation this contract does not need, they
        feed no criterion here, and computing them would add a second O(B^3)
        elimination per cell for no criterion.
      - >-
        NO relation-density measurement of any kind, and no hit-rate comparison
        between the arms as a result. `target_attempts` is recorded as
        provenance for the shortfall rule ONLY and no record may read it as a
        yield or density statement.

  # ===================================================================
  # 6. SEEDS, DETERMINISM, REPLICATION
  # ===================================================================
  seeds:
    requested: [1, 3]
    assignment: CURVE-J12S1 -> requested_seed 1, field_bits 12; CURVE-J16S3 -> requested_seed 3, field_bits 16
    derived: >-
      `_generate_j0_instance` uses s = requested_seed * 100 + offset with offset
      in [0, 50). The DERIVED seed s is what every downstream construction
      consumes - both factor-base builders and the target sequence - and it is
      recorded per run alongside the requested seed. The two arms at a cell MUST
      record the SAME derived seed; a disagreement invalidates both runs
      (IV-13).
    determinism: >-
      THERE IS NO UNSEEDED RANDOMNESS ANYWHERE IN THIS CONTRACT AND NO SAMPLING
      ANYWHERE (RC-8). The driver must not import or call `random`,
      `numpy.random` or `secrets`, and must not read any clock or environment
      value into a computation. Every arm at every cell is a deterministic
      function of (field_bits, requested_seed, B, m) and the committed harness
      sources. A second execution at the same commit must reproduce every
      primary value EXACTLY; anything else is a defect to report.
  replication:
    independent_instances: 2
    cells: 14
    repeats_per_cell: 1
    repeats_rationale: >-
      Repeats are pointless where the computation is deterministic: a repeat
      returns the same integer by construction. That is checked rather than
      assumed at four cells (CTRL-5). Replication value here comes from the
      fourteen cells, from the two curves, and from independent RE-EXECUTION by
      a different session - NOT from re-running a seed.
    independent_replication: >-
      NOT PERFORMED BY THE EXECUTOR AND NOT CLAIMED BY THIS CONTRACT. The
      post-execution validation task TASK-20260729-046 is a non-originating
      session; until its report exists this experiment's evidence-strength
      ceiling is `preliminary` and no record may describe it as `replicated`.
      Independence is session-level and implementation-level at best. MODEL
      INDEPENDENCE IS UNAVAILABLE THROUGHOUT AND IS NEVER CLAIMED
      (INT-BATCH014-D): the adapter refuses `review-adversarial` on the
      available backend, `python3 -m orchestration.adapter doctor --probe`
      returns "No module named orchestration.adapter" on this branch, and no
      BATCH-014 session may be counted toward a completion_quorum attestation.
    what_this_experiment_replicates: >-
      IT DISCHARGES DEFER-BATCH009-001, the replication obligation that a
      `weaken` on an `empirical_only` basis owes under
      docs/claims-and-verification.md - and only if it is frozen before
      execution, executed, snapshot-committed under its own run ids,
      independently reviewed and ledger-archived, with the post-commit verifier
      accepting those commits. DISCHARGE IS A PROCEDURAL FACT, NOT A RESULT
      (M-1).

  # ===================================================================
  # 7. PRE-REGISTERED PREDICTIONS, FALSIFIERS, CRITERIA, VERDICT
  # ===================================================================
  pre_registered_predictions:
    provenance: >-
      EVERY PREDICTION BELOW IS DERIVED FROM COMMITTED SOURCE CODE IN
      experiments/EXP-STR-004/derivation_note.md AND FROZEN WITH IT, IN THE SAME
      TASK-20260729-041 SNAPSHOT COMMIT, BEFORE ANY CELL IS MEASURED. Unlike
      EXP-STR-003 (SPEC-STR-003-B) no probe of any predicted quantity was
      reported to this session by anyone, and no such probe exists. The
      predictions are ALSO recorded, in the same terms, in the BATCH-014
      dispatch queue's `preregistration` block at the opening control-plane
      commit, which strictly precedes this contract. Recording them twice in two
      commits that both precede execution is deliberate: pre-registration is a
      property of COMMIT ORDER checkable against git, not of a working tree.
    P-1:
      statement: >-
        AT EVERY CELL WITH B mod 3 == 0 - NAMED: L12, L24, L48, L96, L192, X96,
        A12M3 - the misalignment set MIS(A-prime, cell) IS THE EMPTY SET, and
        consequently alpha(A-prime, cell) = 0 EXACTLY.
      form: >-
        THE PREDICTION IS THE SET, STATED AS A SET. The value 0 is its
        consequence and is NOT the prediction (PRED-ID-STR).
      authority_and_derivation: >-
        DEC-20260727-009's own sharp pass/fail prediction, carried verbatim in
        content, and derived in derivation_note.md Theorem 1.
    P-2:
      statement: >-
        AT EVERY CELL WITH B mod 3 != 0 - NAMED: L13, L25, L49, L97, L193, X97,
        A13M3 - MIS(A-prime, cell) EQUALS T(cell), the set the derivation note
        defines in closed form from the emitted row list and the truncated-tail
        index set tau(B).
      form: >-
        THIS CONTRACT REFUSES TO PRE-REGISTER A NUMBER. DEC-20260727-009 states
        the consequence as "alpha equal to the number of rows touching the
        truncated tail otherwise"; the derivation gives TWO misaligned rows per
        tail-touching base row (indices 3t and 3t+2, not 3t+1) plus possibly the
        final row 3q, and alpha may be strictly below |T(cell)|. The SET is
        pre-registered; the count is reported as a count with its members named.
      computation_order: >-
        The driver computes T(cell) from the factor base and the base row list -
        both of which exist and are sha256-recorded BEFORE any alpha is measured
        - then computes MIS(A-prime, cell) from the final row list, then reports
        BOTH SETS AND THEIR SYMMETRIC DIFFERENCE. The order is recorded.
    P-3:
      statement: >-
        AT EVERY ONE OF THE FOURTEEN NAMED CELLS, MIS(E-prime, cell) =
        MIS(A-prime, cell) AND alpha(E-prime, cell) = alpha(A-prime, cell). THE
        PHI-FREE CONSTRUCTION IS PREDICTED TO MATCH THE PHI-INVARIANT ONE
        EXACTLY.
      why_it_is_the_whole_discriminating_content: >-
        IT IS FALSIFIABLE IN BOTH DIRECTIONS. If it holds at every named cell,
        the statistic cannot be measuring phi-invariance of the factor base,
        because a construction with none of it scores identically. If it fails
        at any named cell, the cells are NAMED and the phi-invariant factor base
        is doing something the phi-free closure does not. NOTE THE DIFFERENCE
        FROM EXP-STR-003's S1: that criterion predicted arm E would score AT
        LEAST AS WELL as arm A, which is strictly stronger than the proposition
        at issue, and EV-STR-003 observation O-4 records it as a MIS-SPECIFIED
        COMPARATIVE CONTROL. P-3 predicts EQUALITY, on matched base-row budgets.
      the_derivation_disagrees_with_it_at_seven_cells_and_that_is_recorded_here_before_execution: >-
        DECLARED, NOT DISCOVERED LATER, AND P-3 IS CARRIED UNCHANGED.
        derivation_note.md section 8.2 derives that the two arms' misalignment
        sets agree by force at the seven B mod 3 == 0 cells, and CAN DIFFER at
        the seven B mod 3 == 1 cells - because arm A-prime's closure is a CURVE
        operation that can drop a coordinate whose phi-image left the truncated
        factor base, while arm E-prime's closure is an INDEX operation that
        cannot. The exact condition is named: the sets differ as soon as some
        arm-A-prime base row among the first ceil(B/3) has a nonzero coordinate
        at the tail index. NEITHER BRANCH IS FORCED at any named cell. THIS
        CONTRACT DOES NOT AMEND, WEAKEN OR REINTERPRET P-3: it records the
        derivation beside it, both before any measurement, and the disagreement
        between the queue's prediction and the derivation is reported to the
        Coordinator as a FINDING. The consequence for interpretation is fixed in
        advance in interpretation_limits below.
    P-4:
      statement: >-
        AT EVERY NAMED CELL AND FOR BOTH ARMS, alpha(arm, cell) <=
        |MIS(arm, cell)|.
      authority_and_derivation: >-
        The derivational limb EV-STR-003 observation O-6 records as CONFIRMED at
        4 of 4 in its rescoped form, carried here AS A FALSIFIER and not as a
        fitted quantity, and derived in derivation_note.md Corollary 2b. The
        inequality may be strict; only its violation is a criterion.
  falsification_conditions:
    F-1_SET_IDENTITY: >-
      FIRES at any named cell and arm where the MEASURED misalignment set is not
      EQUAL, AS A SET, to the PREDICTED set for that arm - which is the empty
      set or T(cell) for arm A-prime (P-1, P-2) and MIS(A-prime, cell) for arm
      E-prime (P-3's MIS limb). P-3 HAS TWO LIMBS AND THEY DO NOT COINCIDE: (i)
      MIS-set equality MIS(E-prime)=MIS(A-prime), evaluated by F-1 for arm
      E-prime; (ii) alpha equality alpha(E-prime)=alpha(A-prime), evaluated by
      F-4. EITHER MAY FIRE WITHOUT THE OTHER. A synthetic counterexample at B=13
      with MIS(A)={0,2}, alpha(A)=1, MIS(E)={12}, alpha(E)=1 was constructed in
      RT-20260729-034 (objection B-2): F-1(E) fires while F-4 is silent at that
      cell. Summary reporting MUST record both limbs. The v1 sentence claiming
      they "coincide by construction" is RETRACTED. A CARDINALITY MATCH WITH A
      DIFFERENT MEMBER SET FIRES F-1 and is recorded as
      `cardinality_only_agreement`. The report NAMES THE CELLS and gives the
      symmetric difference.
    F-2_STATIC_BOUND: >-
      FIRES at any named cell and arm where alpha > |MIS|. CELLS NAMED. A firing
      contradicts Corollary 2b of the derivation note, which is exact linear
      algebra over the field F_n, so it indicates an implementation defect in
      `matrix_rank_mod` or in the driver's MIS computation. IT IS REPORTED AS
      SUCH AND IT DOES NOT INVALIDATE THE RUN: a criterion may not delete the
      evidence that fired it.
    F-3_LADDER: >-
      FIRES if and only if the set of ladder cells at which alpha(A-prime) = 0
      is not EQUAL to the L0 set {L12, L24, L48, L96, L192}. The report names
      the members of the symmetric difference. THIS IS THE INDEPENDENCE-OF-B
      FALSIFIER FOR ARM A-PRIME and it is stated as a set identity over NAMED
      cells, never as "alpha did not grow".
    F-4_DIAGNOSTICITY: >-
      FIRES if and only if the set of named cells at which alpha(E-prime) =
      alpha(A-prime) is not EQUAL to the full fourteen-cell set. The report
      names the members of the symmetric difference AND, for each, states THE
      DIRECTION of the inequality. F-4 FIRING IS NOT A FAILURE OF THE
      EXPERIMENT: it means the arms' alpha sets differ on a nonempty named
      subset of cells. Interpretation is governed by interpretation_limits IL0
      in the same sentence: a firing localised to B mod 3 == 1 cells is the
      truncation-artifact reading until proven otherwise, and must not be
      paraphrased as "the phi-invariant factor base is doing something" without
      that caveat. This rephrase discharges RT-20260729-034 objection M-1.
    F-5_B_INDEPENDENCE_OF_THE_BOUND: >-
      FIRES, PER ARM, if and only if the set of the ten ladder cells at which
      alpha <= 3 is not EQUAL to the full ten-cell ladder set {L12, L13, L24,
      L25, L48, L49, L96, L97, L192, L193}. CELLS NAMED. This is the direct test
      of H-STR-002's own words - "alpha <= r = 3 for phi-invariant factor bases
      at all tested B" - at a FIXED curve over a sixteen-fold range of B.
    the_reading_that_must_be_written_beside_F_5_whatever_it_does: >-
      IF F-5 DOES NOT FIRE FOR ARM A-PRIME, THAT IS NOT SUPPORT FOR H-STR-002 IF
      F-4 ALSO DOES NOT FIRE. A bound of 3 that a construction with ZERO
      endomorphism content satisfies identically is a property of the closure
      convention, not of the endomorphism. This sentence is pre-registered so
      that a favourable-looking ladder cannot be read as a mechanism result
      after the fact.
    the_mixed_branch_is_reachable_by_construction_and_this_repairs_O_5: >-
      EXP-STR-003 section 7 defined S_i = not F_i, making its own `mixed` verdict
      branch UNREACHABLE BY CONSTRUCTION while the measured S1 pattern WAS mixed
      - EV-STR-003 observation O-5 records this as a CONTRACT DESIGN DEFECT.
      HERE THE VERDICT RULE IS DEFINED OVER SET EQUALITIES, NOT OVER
      COMPLEMENTARY PREDICATES, so `mixed` - a non-empty PROPER subset - is
      reachable at F-3, F-4 and F-5 alike and MUST be reported as `mixed` rather
      than coerced to either pole. The derivation note, section 8.2, argues
      `mixed` is the branch its own account makes most likely, which is a
      further reason the branch had to be reachable.
  success_criterion: >-
    THE INSTRUMENT-ARTIFACT PROPOSITION IS CONFIRMED - that is, the number the
    committed harness reports as `phi_alpha` carries NO information about
    whether the factor base is phi-invariant - if and only if, on the values
    MEASURED BY THIS EXPERIMENT: F-1 fires at NO cell for EITHER arm, AND F-4
    does NOT fire. Meeting it licenses exactly ONE statement, at TOY tier,
    scoped by claim_ceiling: on these fourteen cells, that number carries no
    information about phi-invariance of the factor base. It licenses NO
    statement about H-STR-002's mechanism, NO cost claim, NO asymptotic claim
    and NO conclusion about index calculus. The F-3 and F-5 ladder verdicts are
    recorded SEPARATELY and are never folded into it.
  falsification_criterion: >-
    THE INSTRUMENT-ARTIFACT PROPOSITION IS FALSIFIED - that is, this experiment
    exhibits a named cell where the arms' alpha values differ with direction
    alpha(E-prime) > alpha(A-prime) while A-prime's MIS predictions hold - if
    and only if, on the values MEASURED BY THIS EXPERIMENT: F-1 does NOT fire
    for arm A-prime, AND the set of cells at which alpha(E-prime) >
    alpha(A-prime) is NON-EMPTY AND IS NAMED. A falsification is NOT support for
    H-STR-002 (N-1, N-2) and is NOT a cost or asymptotic claim (N-4). See
    interpretation_limits IL0 for the truncation-artifact reading that must be
    reported beside any firing localised to B mod 3 == 1 cells.
  verdict_rule: >-
    THE EXECUTOR COMPUTES AND RECORDS EXACTLY ONE VERDICT IN
    results/sweep_summary.json AND INTERPRETS NONE OF THEM. On a fully measured
    valid set, every outcome of the F-1/F-4 matrix maps to exactly one named
    label (RT-20260729-034 B-1 repair).
    `instrument_artifact_confirmed` - F-1 fires at no cell for either arm AND
    F-4 does not fire.
    `instrument_artifact_falsified` - F-1 does not fire for arm A-prime AND the
    set of cells at which alpha(E-prime) > alpha(A-prime) is NON-EMPTY and is
    NAMED.
    `mixed` - the named cells point different ways: the agreement set of F-4 is
    a non-empty PROPER subset of the fourteen.
    `prediction_failed` - the measurement set is complete and valid (no IV-*,
    SR-4 exclusion, cert failure, stop, or unmeasured cell) AND F-4 does not
    fire AND F-1 fires for AT LEAST ONE arm (A-prime, E-prime, or both).
    Reason codes, recorded beside the verdict and never collapsed: (i)
    `F1_A_prime_fires_F4_silent` when F-1 fires for A-prime; (ii)
    `F1_E_prime_fires_F4_silent` when F-1 fires for E-prime and not for
    A-prime; (iii) both codes when both arms fire F-1. This generalizes the
    v2 branch that covered only (i) and closes the RT-20260730-001 B-1
    remainder (reachable unlabeled case F-1(E)-only with F-4 silent).
    `incomplete` - any named cell was not measured, any stopping rule fired, any
    certificate failed, or a base-row shortfall excluded a cell from the
    comparative criteria.
    UNDER `mixed`, `prediction_failed`, OR `incomplete` THE COORDINATOR'S
    DECISION ON THE INSTRUMENT QUESTION IS `inconclusive`, AND SAYING SO PLAINLY
    IS THE REQUIRED OUTCOME.
    The F-3 and F-5 ladder verdicts are recorded as SEPARATE fields
    (`ladder_verdict_F3`, `ladder_verdict_F5_A_prime`,
    `ladder_verdict_F5_E_prime`) and are NEVER folded into the instrument
    verdict. No criterion may be changed after any outcome is observed without a
    further versioned protocol_amendment under experiments/EXP-STR-004/amendments/;
    an outcome-driven revision is exploratory and cannot be evaluated against
    this confirmatory criterion. RC-14 permits at most one amendment cycle; a
    second REVISE is a batch failure.
  interpretation_limits:
    - >-
      AN F-4 FIRING LOCALISED TO B mod 3 == 1 CELLS, WITH DIRECTION
      alpha(A-prime) >= alpha(E-prime), IS THE TRUNCATION ARTIFACT THE
      DERIVATION PREDICTS AND IS NOT ENDOMORPHISM CONTENT. Its mechanism is a
      coordinate dropped because a phi-image left the `xs[:B]`-truncated factor
      base - the same mechanism EV-STR-003 observation O-4 identifies as arm A's
      skip cause. Reading such a firing as "the phi-invariant factor base is
      doing something mathematical" is forbidden in advance. This clause is
      pre-registered precisely so that the most likely outcome cannot be
      oversold afterwards.
    - >-
      NEITHER VERDICT POLE IS SUPPORT FOR OR EVIDENCE AGAINST H-STR-002's
      MECHANISM (N-1). The mechanism is untested here under every outcome.
    - >-
      alpha SMALL AT THESE CELLS IS A PROPERTY OF A ROW LIST CLOSED UNDER sigma,
      which is a derivation and not a measurement (EV-STR-003 observation O-7
      records the same point). No record may present it as a discovery.
    - >-
      TOY-SCALE EVIDENCE IS NEVER PRESENTED AS CRYPTO-SCALE VALIDATION
      (AGENTS.md core rule 7). Maximum field size here is 16 bits.
    - >-
      A TIMEOUT, CRASH, MEMORY EXHAUSTION, DISK EXHAUSTION, MISSING OR
      MISMATCHED `sage` BINARY, FAILED CERTIFICATE OR IMPLEMENTATION FAILURE IS
      INFRASTRUCTURE SIGNAL OR AN INVALID MEASUREMENT. It is NEVER a negative
      mathematical result about H-STR-002, about the instrument question, or
      about anything else (AGENTS.md core rule 5).
    - >-
      NEGATIVE EVIDENCE CLOSES ONLY THE EXACT TESTED SCOPE (AGENTS.md core rule
      6): these two curves, these fourteen (curve, B, m) cells, these two arms,
      this solver path and this budget.

  # ===================================================================
  # 8. BUDGET AND STAGE ESTIMATES
  # ===================================================================
  budget:
    wall_clock_seconds_per_run: 900
    total_wall_clock_seconds: 7200
    sage_verification_seconds: 900
    maximum_memory_gb: 8
    maximum_runs: 28
    artifact_size_per_run_bytes: 2097152
    artifact_size_tree_bytes: 67108864
    minimum_free_disk_bytes: 5368709120
    basis: >-
      ESTIMATE, NOT A MEASUREMENT, AND LABELLED ONE. Basis: EXP-STR-003 consumed
      132.595 s of a declared 5400 s for TWENTY runs INCLUDING cells at B = 204
      and B = 397, with peak RSS 0.0994 GB of 8 GB (EV-STR-003 observation
      O-12). THIS CONTRACT'S LARGEST B IS 193, below EXP-STR-003's top two
      cells. AGAINST THAT: this contract has 28 runs rather than 20, adds two
      m = 3 cells whose relation-collection loop costs like B squared per
      target, and adds a Sage subprocess. IF THE REAL COST EXCEEDS THIS
      ENVELOPE, THAT IS A BUDGET DEFECT TO REPORT UNDER THE STOPPING RULES -
      NEVER A RESULT.
    a_term_that_is_expected_to_be_cheaper_here_and_why: >-
      EXP-STR-003's dominant measurement term was arms B and C, whose alpha was
      of order B (27, 52, 197, 386), because `matrix_rank_mod` pays O(B) work
      per pivot and those matrices had almost B pivots. BOTH ARMS HERE ARE
      CLOSED UNDER sigma, so the derivation predicts a displacement matrix with
      few nonzero rows and small rank, and the elimination then pays little more
      than its O(B^2) pivot-scan floor per cell. THAT IS A PREDICTION ABOUT COST
      AND IT IS NOT A RESULT: if the prediction fails the matrices are dense,
      the cost rises toward O(B^3), and the 900 s per-run cap is what covers it.
  stage_resource_estimates:
    - stage: S1
      work: instance generation for the two curves (_generate_j0_instance, _find_zeta3)
      estimate_seconds: 10-300
      dominant_cost: E.order() and sympy.factorint at field_bits 16
    - stage: S2
      work: factor-base construction, 28 builds, both builders, B up to 193
      estimate_seconds: 5-120
      dominant_cost: lift_x trials at B = 192 and B = 193
    - stage: S3
      work: base-row collection, 28 cells, 327 base rows per arm
      estimate_seconds: 60-1200
      dominant_cost: >-
        L192 and L193, where 64 and 65 base rows must be found and each target
        costs an O(B^2) scan inside `_find_decomposition`; plus the two m = 3
        cells, whose quadruple loop is cheap only because B = 12 and 13
    - stage: S4
      work: 28 alpha measurements plus 28 MIS computations plus 8 determinism rechecks
      estimate_seconds: 20-600
      dominant_cost: >-
        the O(B^2) pivot-scan floor of `matrix_rank_mod` at B = 192 and 193 if
        the derivation holds; O(B^3) if it does not. THE SINGLE TERM MOST LIKELY
        TO BE UNDERESTIMATED, exactly as it was for EXP-STR-003 stage S4.
    - stage: S5
      work: one batched Sage invocation re-verifying every base-row certificate
      estimate_seconds: 20-300
      dominant_cost: >-
        Sage startup, paid once, plus 654 certificate checks. 654 IS A COUNT AND
        ITS TERMS ARE NAMED: 2 arms times the per-cell R_base values 4, 5, 8, 9,
        16, 17, 32, 33, 64, 65 (ladder), 32, 33 (cross-curve) and 4, 5 (arity),
        summing to 327 per arm.
    - stage: S6
      work: 28 run records of six files each, plus the three results files
      estimate_seconds: 5-60
      dominant_cost: none
  stage_total_reconciliation: >-
    Optimistic sum 120 s, pessimistic sum 2580 s, against a declared Executor
    cap of 7200 s. THESE ARE SUMS OF ESTIMATES AND NEITHER IS A MEASUREMENT. The
    pessimistic sum sits inside the cap with headroom, which is deliberate: a
    contract whose pessimistic sum exceeds its cap is one whose stopping rule
    fires on a design flaw rather than on a surprise (EXP-STR-003's did, by
    80 s, and recorded it).

  # ===================================================================
  # 9. PRE-FLIGHT CHECKS AND STOPPING RULES
  # ===================================================================
  pre_flight_checks:
    - id: PF-1
      check: >-
        Capture `sage --version` EXACTLY ONCE, before the first computation.
        Record the exact string verbatim. If it does not name SageMath 10.9 with
        release date 2026-05-04, or the binary is absent, or it fails to start,
        or it exits nonzero: STOP AND REPORT, write no run records, and record it
        as INFRASTRUCTURE SIGNAL.
    - id: PF-2
      check: >-
        Assert that `harness/` matches HEAD. If any of the four harness sources
        differs from its HEAD blob, HALT THE WHOLE EXPERIMENT AND REPORT: the
        object of measurement is not the committed object.
    - id: PF-3
      check: >-
        MANDATORY DISK CHECK. Record the free space on the volume holding the
        repository, as an EXACT figure, in results/run_index.json and in the
        first manifest. IF FREE SPACE IS BELOW 5 GiB, STOP AND REPORT AND WRITE
        NO RUN RECORDS - an out-of-space failure mid-run would leave a partial
        run package that looks like a measurement, and that is worse than not
        starting. A disk stop is INFRASTRUCTURE SIGNAL. See
        inputs.host_disk_observation_and_a_discrepancy_recorded_not_overwritten:
        two inconsistent host figures are on record and this check is binding
        regardless of which a reader believes.
    - id: PF-4
      check: >-
        Record the tracked-tree dirty state. If the tracked tree is dirty in any
        path outside experiments/EXP-STR-004/, STOP AND REPORT BEFORE WRITING
        ANY RUN RECORD rather than producing 28 runs that IV-1 will invalidate.
    - id: PF-5
      check: >-
        Assert that no directory under experiments/EXP-STR-004/runs/ already
        exists for any of the 28 declared run ids. `write_run` refuses to
        overwrite an existing run directory; that refusal MUST be reported and
        NEVER worked around by renaming.
    - id: PF-6
      check: >-
        Assert that experiments/EXP-STR-004/specification.yaml and
        experiments/EXP-STR-004/derivation_note.md are present and byte-identical
        to their blobs at the TASK-20260729-041 commit, and record their sha256.
        A DIFFERENCE MEANS THE CONTRACT WAS EDITED AFTER THE FREEZE: halt and
        report.
  stopping_rules:
    - id: SR-1
      rule: >-
        Per-run wall clock exceeds 900 s. That run is terminated and recorded
        with status `failed_infrastructure`, valid false, invalid_reason
        `per_run_timeout`, together with whatever stdout and stderr were
        captured, and all six files are still written. IT IS NOT A MEASUREMENT,
        NOT A ZERO, NOT A NEGATIVE RESULT ABOUT H-STR-002 AND NOT A NEGATIVE
        RESULT ABOUT THE INSTRUMENT QUESTION (AGENTS.md core rule 5). Execution
        CONTINUES with the remaining cells.
    - id: SR-2
      rule: >-
        Total wall clock exceeds 7200 s. Every cell not yet started is recorded
        `cancelled_by_budget` with its full six-file set written and no metrics,
        the verdict is `incomplete`, and the Executor reports WHICH NAMED CELLS
        WERE NOT REACHED. A BUDGET STOP IS NOT A RESULT and is never reported as
        one.
    - id: SR-3
      rule: Resident memory exceeds 8 GB. Same disposition as SR-1 for the run that breached it.
    - id: SR-4
      rule: >-
        BASE-ROW SHORTFALL. An arm found fewer than R_base(cell) base rows
        within the attempt cap T_max(B) = 5 * max(10, B + 10). The run is
        recorded with the shortfall NAMING THE CELL AND THE ARM, its measured
        values are kept, THE CELL IS EXCLUDED from every comparative criterion
        with the exclusion stated in the summary by name, and the verdict is
        `incomplete`. The other arm is NOT trimmed to match and this arm is NOT
        topped up.
    - id: SR-5
      rule: >-
        Sage sub-cap of 900 s breached, or the verifier exits nonzero. The
        certificates are left UNVERIFIED, every affected run is `incomplete`
        rather than `completed_valid`, and it is INFRASTRUCTURE SIGNAL. No
        mathematical conclusion is drawn in either direction.
    - id: SR-6
      rule: >-
        PER-RUN ARTIFACT CAP of 2 MiB hit. The driver writes the sha256 of the
        factor base and of the final row list, OMITS the full dumps, records
        deviation DEV-SIZE-1 NAMING THE EXACT CELLS AFFECTED, and continues. IT
        NEVER WRITES A TRUNCATED JSON DOCUMENT. Consequence recorded rather than
        hidden: for those cells an alpha is REPRODUCIBLE by re-execution but not
        CHECKABLE from the archived artifacts alone, which is exactly the gap
        EV-STR-003 UC-6 names and which this contract otherwise closes.
    - id: SR-7
      rule: >-
        TREE CAP of 64 MiB for everything under experiments/EXP-STR-004/ hit.
        STOP. Every cell not yet run is recorded `cancelled_by_budget` with its
        six-file set still written, the verdict is `incomplete`, and the
        Executor reports which named cells were not reached.
    - id: SR-8
      rule: >-
        HALT THE WHOLE EXPERIMENT IMMEDIATELY, DISCARD NOTHING, AND REPORT if
        any of the following is detected at any point: `harness/` differs from
        HEAD; any path under experiments/EXP-STR-001/, experiments/EXP-STR-002/
        or experiments/EXP-STR-003/ is modified; any file is written outside
        experiments/EXP-STR-004/driver/, /runs/ and /results/; a run identifier
        outside the 28 declared is about to be written; or a macOS AppleDouble
        `._` sidecar is created. THESE ARE EVIDENCE-INTEGRITY FAILURES, NOT
        RESULTS.
    - id: SR-9
      rule: >-
        `harness.endomorphism_la.main()` is about to be invoked, in process or
        as a subprocess. HALT AND REPORT. It is a forbidden entry point.
    - id: SR-10
      rule: >-
        The driver is about to modify anything under harness/. HALT AND REPORT.
        If a harness defect blocks a cell, RECORD IT AND STOP THAT CELL: a
        repair requires a versioned protocol amendment and no card in BATCH-014
        has one.
    - id: SR-11
      rule: >-
        `_generate_j0_instance` returns None, or `_find_zeta3` returns None, for
        a declared curve. Every cell on that curve is recorded
        `cancelled_by_budget` with reason `instance_unavailable`, the verdict is
        `incomplete`, and it is INFRASTRUCTURE SIGNAL - not a negative result
        about anything.
    - id: SR-12
      rule: >-
        A CARD THAT CANNOT FINISH INSIDE ITS CAP MUST STOP AND REPORT A BOUNDED
        PARTIAL RESULT NAMING EXACTLY WHICH CELLS IT DID NOT REACH. It must not
        overrun silently and must not compress by fabricating a figure or a
        verdict.

  # ===================================================================
  # 10. INVALIDATION RULES
  # ===================================================================
  invalidation_rules:
    - id: IV-1
      rule: any run whose manifest records code.dirty true is invalid.
    - id: IV-2
      rule: >-
        any run missing manifest.yaml, command.txt, environment.json,
        stdout.log, stderr.log or raw-result.json is invalid.
    - id: IV-3
      rule: >-
        any run whose recorded factor-base length is not exactly the cell's
        declared B is invalid: the declared cell was not realised. This covers
        both builders exhausting their candidate trial bound.
    - id: IV-4
      rule: >-
        any run whose recorded rows_final is not exactly 3 times its recorded
        base_rows_collected is invalid: the declared unconditional closure did
        not emit one triple per base row.
    - id: IV-5
      rule: >-
        any run recording a nonzero suppression_count is invalid: the closure was
        not unconditional as declared. The value is still recorded and reported.
    - id: IV-6
      rule: >-
        any run in which a base-row decomposition certificate FAILS the
        independent Sage re-verification is `completed_invalid` with
        invalid_reason `certificate_failed`. It is an INVALID MEASUREMENT, NOT a
        negative observation, and it is not evidence against anything
        (docs/claims-and-verification.md).
    - id: IV-7
      rule: >-
        any run at L12, L13, A12M3 or A13M3 whose determinism_check failed is
        invalid.
    - id: IV-8
      rule: >-
        any run whose `code_hashes` block disagrees with the other runs' is
        invalid, and the whole SET is invalid pending Coordinator adjudication -
        the arms would not have been measured against one code base.
    - id: IV-9
      rule: >-
        any disagreement between a run's raw-result.json and the corresponding
        cell of results/sweep_summary.json invalidates the SUMMARY, not the run.
        THE RAW RECORD GOVERNS and the summary is regenerated from the raw
        records.
    - id: IV-10
      rule: >-
        a total run count other than exactly 28, or any run identifier not in
        run_inventory, makes the SET invalid pending Coordinator adjudication.
        Individual valid runs are preserved and never deleted.
    - id: IV-11
      rule: >-
        any cell whose alpha was obtained other than by calling the committed
        `harness.endomorphism_la._measure_displacement_rank` - including any
        reimplementation of it, and including any value produced by
        `harness.endomorphism_la.main()` - is invalid. Reimplementing the
        measurement would measure a different object.
    - id: IV-12
      rule: >-
        any run recording a shift_type other than "phi", or recording
        branch "rectangular", is invalid: the declared operator was not used, or
        the row list was too short and a shortfall went unrecorded.
    - id: IV-13
      rule: >-
        any run whose recorded derived_seed differs from the value
        `_generate_j0_instance` returned, or differs from the other arm's
        derived_seed at the same cell, or whose recorded attempted-target list
        (or its sha256) differs from the other arm's at the same cell, is
        invalid together with its partner: the cell did not hold its declared
        variables fixed.
    - id: IV-14
      rule: >-
        any run missing factor_base_sha256 or row_list_sha256 is invalid. Where
        DEV-SIZE-1 applies the full dumps may be omitted, but the two hashes may
        NOT: they are the whole of the UC-6 repair.
    - id: IV-15
      rule: >-
        any run whose recorded `sage_version_string` differs from the string in
        results/certificate_verification.json is invalid, and the SET's
        certificate status is invalid: "one capture reused verbatim" was
        violated.
  invalidation_rules_removed_before_the_freeze_with_the_removal_recorded:
    - id: REMOVED-1
      candidate_rule: any run recording alpha == -1 (the no-relations sentinel) is invalid.
      verdict: CANNOT FIRE
      arithmetic_and_reason: >-
        The -1 sentinel is assigned only in `harness.endomorphism_la.main()` at
        lines 434 and 439 (`... if phi_rels else -1`). main() is a FORBIDDEN
        entry point in this contract and is never invoked, and
        `_measure_displacement_rank` itself returns 0 - not -1 - on an empty row
        list (line 134). With R_base(cell) >= 4 at every one of the fourteen
        cells and SR-4 disposing of any shortfall, the value -1 is unreachable
        at every declared cell.
      replaced_by: >-
        SR-4 (base-row shortfall, with the cell excluded from the comparative
        criteria and named) and IV-3 (factor-base length), which catch the
        underlying condition the sentinel was standing in for.
    - id: REMOVED-2
      candidate_rule: >-
        any run whose recorded random seed does not reproduce its sampled
        quantities is invalid (seed integrity of sampled quantities).
      verdict: CANNOT FIRE
      arithmetic_and_reason: >-
        THERE IS NO SAMPLED QUANTITY ANYWHERE IN THIS CONTRACT. Under RC-8 every
        quantity is DETERMINED: the instance, zeta3, both factor bases, the
        target sequence, the base rows, the closures, MIS, T and alpha are
        deterministic functions of (field_bits, requested_seed, B, m) and the
        committed sources. The seeded random shift permutation of
        harness/endomorphism_la.py:185-193 is not used. A rule about sampled
        quantities has nothing to range over.
      replaced_by: >-
        IV-13, the derived-seed and target-sequence determinism check across the
        two arms of a cell, and CTRL-5, the intra-run determinism recheck at
        four cells.
    - id: REMOVED-3
      candidate_rule: >-
        the EXP-STR-003 partner-equality rules IV-5 and IV-6 - any arm whose
        factor-base or base-row-list equality assertion against its partner arm
        failed is invalid - and IV-4, any arm-D run whose `--out` path lies
        inside the repository.
      verdict: CANNOT FIRE
      arithmetic_and_reason: >-
        Inherited from the EXP-STR-003 template and inapplicable by design.
        (a) The two arms here use DELIBERATELY DIFFERENT factor bases - that is
        the independent variable - and therefore deliberately different base-row
        lists; there is no partner-equality invariant to violate, and asserting
        one would assert the negation of the design. (b) THERE IS NO ARM D:
        this contract invokes no subprocess of the committed program and has no
        `--out` path, because main() is forbidden (SR-9).
      replaced_by: >-
        For (a): IV-13 plus CTRL-3, which fix the variables that ARE held
        constant across the arms (derived seed, target sequence), and CTRL-6,
        which fixes what is held constant across B. For (b): nothing is needed;
        the rule's subject does not exist.

  # ===================================================================
  # 11. RUN INVENTORY AND REQUIRED ARTIFACTS
  # ===================================================================
  run_inventory:
    naming: >-
      run_suffix = "004-<ARM>-<CELL>" with ARM in {AP, EP} - AP for arm A-prime,
      EP for arm E-prime - and CELL one of the fourteen cell ids, so
      harness/runner.py builds run_id = "RUN-STR-004-<ARM>-<CELL>". These
      identifiers are disjoint from EXP-STR-001's (RUN-STR-001-a), from the 13
      EXP-STR-002 identifiers and from the 20 RUN-STR-003-* identifiers.
    count: 28
    count_note: 28 IS A COUNT - 2 arms times 14 named cells - AND ITS MEMBERS ARE ENUMERATED BELOW.
    ids:
      - RUN-STR-004-AP-L12
      - RUN-STR-004-AP-L13
      - RUN-STR-004-AP-L24
      - RUN-STR-004-AP-L25
      - RUN-STR-004-AP-L48
      - RUN-STR-004-AP-L49
      - RUN-STR-004-AP-L96
      - RUN-STR-004-AP-L97
      - RUN-STR-004-AP-L192
      - RUN-STR-004-AP-L193
      - RUN-STR-004-AP-X96
      - RUN-STR-004-AP-X97
      - RUN-STR-004-AP-A12M3
      - RUN-STR-004-AP-A13M3
      - RUN-STR-004-EP-L12
      - RUN-STR-004-EP-L13
      - RUN-STR-004-EP-L24
      - RUN-STR-004-EP-L25
      - RUN-STR-004-EP-L48
      - RUN-STR-004-EP-L49
      - RUN-STR-004-EP-L96
      - RUN-STR-004-EP-L97
      - RUN-STR-004-EP-L192
      - RUN-STR-004-EP-L193
      - RUN-STR-004-EP-X96
      - RUN-STR-004-EP-X97
      - RUN-STR-004-EP-A12M3
      - RUN-STR-004-EP-A13M3
    six_file_rule: >-
      THE SIX-FILE-PER-RUN SET IS MANDATORY EVEN FOR A NON-COMPLETED RUN. A run
      cancelled by budget, failing on infrastructure, exhausting memory,
      exhausting disk or invalidated by a failed certificate STILL WRITES ALL SIX
      FILES, with the terminal status recorded in the manifest. That is what
      makes the 174-path declaration of the BATCH-014 queue exact in advance
      instead of a guess.
    id_allocation_status: >-
      ALLOCATOR-VERIFIED. `python3 tools/allocate_id.py --check` was run once per
      identifier for all 31 identifiers - EXP-STR-004, EV-STR-004,
      DEC-20260729-004 and the 28 RUN-STR-004-* ids - and the verbatim output is
      recorded in the TASK-20260729-040 task report. 30 of 31 return
      "OK: well-formed and free across the union" at exit 0. EXP-STR-004 returns
      "REFUSE: taken" at exit 1 with exactly ONE occurrence, which is
      experiments/EXP-STR-004/specification.yaml - THIS FILE, the deliverable the
      check was run against. That is a self-occurrence produced by running the
      check AFTER the write rather than before it, not a collision with another
      record; `occurrences()` at tools/allocate_id.py:72-80 matches an
      identifier against a file basename OR ITS PARENT DIRECTORY NAME, and
      `experiments/*/specification.yaml` is one of its four search globs, so this
      file's own directory is the hit. The pre-write state is established by
      read-only git rather than by assertion: `git ls-files
      experiments/EXP-STR-004` returns EMPTY and `git status` reports the whole
      directory untracked, so no committed or tracked file carried EXP-STR-004
      before this task, and the occurrence count before the write was ZERO.
      NOTHING WAS RENAMED. See integrity note SPEC-STR-004-C for the ordering
      defect and the residual limitation.
  required_artifacts:
    contract:
      - experiments/EXP-STR-004/specification.yaml
      - experiments/EXP-STR-004/derivation_note.md
    implementation:
      - experiments/EXP-STR-004/driver/bsweep_driver.py
      - experiments/EXP-STR-004/driver/verify_certificates.sage
    per_run:
      - experiments/EXP-STR-004/runs/<RUN-ID>/manifest.yaml
      - experiments/EXP-STR-004/runs/<RUN-ID>/command.txt
      - experiments/EXP-STR-004/runs/<RUN-ID>/environment.json
      - experiments/EXP-STR-004/runs/<RUN-ID>/stdout.log
      - experiments/EXP-STR-004/runs/<RUN-ID>/stderr.log
      - experiments/EXP-STR-004/runs/<RUN-ID>/raw-result.json
    summary:
      - experiments/EXP-STR-004/results/sweep_summary.json
      - experiments/EXP-STR-004/results/run_index.json
      - experiments/EXP-STR-004/results/certificate_verification.json
    exact_path_binding: >-
      The 174 exact repository-relative paths of the run package - the Cartesian
      product of the 28 run ids and the 6 file names, plus the driver, the
      verifier, the three results files and the archive receipt - are declared
      in the BATCH-014 dispatch queue under
      declared_commit_sets.TASK-20260729-045_snapshot_commits_174_paths, and
      TASK-20260729-045 must write the FULLY EXPANDED list into its receipt.
      Anything extra, including a macOS AppleDouble `._` sidecar, fails the
      post-commit verifier and blocks review. NOTHING IS ANALYSED, INTERPRETED
      OR PROMOTED IN ANY OF THESE FILES: analysis belongs to the reviews and to
      the ledger archive.
    what_the_summary_must_carry_per_cell_and_arm: >-
      alpha; the predicted set; the measured set MIS; their symmetric
      difference; `cardinality_only_agreement`; the suppression count; the
      base-row count beside R_base(cell); the two sha256 values; the branch; the
      determinism and prefix-nesting check results; T_E for arm E-prime labelled
      as a derivation reference and not a criterion; the F-1 to F-5 evaluations
      BY NAMED CELL; the single frozen verdict; and the three separate ladder
      verdict fields. EVERY SET IS REPORTED AS A SORTED MEMBER LIST. Every count
      says it is a count and names its members or gives the rule plus the hash.
  artifact_policy_mapping:
    exact_command: manifest.run.code.command and command.txt, per run, written by write_run
    git_commit_and_dirty_state: manifest.run.code.commit and manifest.run.code.dirty
    environment_and_dependency_versions: >-
      environment.json and manifest.run.environment, PLUS
      raw-result.json.environment_supplement carrying numpy.__version__ (absent
      from harness/runner.py::environment() and a dependency of the primary
      metric) and the captured `sage --version` string (hardcoded to None at
      harness/runner.py:53, which is disclosed and not repaired).
    input_parameters_and_seeds: >-
      manifest.run.inputs (curve_id, seed, parameters) and
      raw-result.json.raw.instance, carrying requested_seed, derived_seed, p, n,
      a, b, zeta3, B, m, B_mod_3, q and tail_index.
    requested_and_resolved_model_policy: >-
      manifest.run.inference is HARDCODED by harness/runner.py:140-146 and MUST
      NOT be read as the executing session's provenance. The true block lives in
      raw-result.json.inference_supplement, carrying requested_policy, the
      resolved model, model_verified, model_provenance, fallback_used and
      degraded_requirements, together with the disclosure that the manifest
      value is hardcoded. This is EV-STR-003 UC-5's defect, disclosed and not
      repaired, in a harness this contract forbids modifying.
    reasoning_effort_and_fallback: raw-result.json.inference_supplement
    stdout_and_stderr: >-
      stdout.log and stderr.log, which must carry the driver's REAL captured
      output for every run - never the empty strings EXP-STR-002 recorded, and
      never a zero-byte stderr where output existed (the EV-STR-003 O-12 defect
      1). A genuinely empty stream is recorded as such in run_index.json.
    raw_machine_readable_results: raw-result.json
    validity_status_and_reason: manifest.run.result.valid, .invalid_reason and manifest.run.status
    timestamps_and_resources: >-
      manifest.run.timing and manifest.run.resources, measured around EACH run
      INDIVIDUALLY. Reusing one timing window across several run records is the
      EXP-STR-002 defect D6 and it is FORBIDDEN.
    certificates: >-
      per base row in raw-result.json under `certificates`, summarised in
      manifest.run.result.certificate, and independently re-verified in
      results/certificate_verification.json by the Sage verifier (CTRL-2).
      Appended rows carry kind `none` WITH THE REASON RECORDED and are never
      claimed as relations.

  # ===================================================================
  # 12. PROVENANCE AND GOVERNANCE
  # ===================================================================
  assigned_to: executor
  assigned_task: TASK-20260729-044
  prior_evidence: [EV-STR-003, EV-STR-002, EV-STR-001]
  prior_decision: [DEC-20260727-009, DEC-20260726-006]
