obligations:
  - id: V8-ORDINAL-01
    requirement: Carry exact A0 through A32 ordinals and admission digests through entry, attempt admission, recovery, and meter contexts.
    falsifier: E013 can create A2 but D002 or M002 writes or selects A1.
  - id: V8-ORDINAL-02
    requirement: Require the linked attempt-start for the exact current ordinal.
    falsifier: A stale A0 start permits D004 for A1 or A2.
  - id: V8-PHASE-01
    requirement: Derive E0 and successor phase identities explicitly; record path and payload phase must agree.
    falsifier: C003 writes phase P0 at an E0 path or C002 reserves an occupied predecessor.
  - id: V8-TRACE-01
    requirement: Compose C003 to P001 and E013(A2) to D002 to M002 using literal prior post-universes without reseeding.
    falsifier: Any composed step is evidence-invalid or changes ordinal or phase.
  - id: V8-EVENT-01
    requirement: Every durable event must name and validate the exact durable record digest that caused it.
    falsifier: A durable event advances with no corresponding record in the universe.
  - id: V8-RECOVERY-01
    requirement: Model recoverable-result true and false branches without DEFAULT and materialize retained result or quarantine terminal records.
    falsifier: R005 accepts only not_applicable or always emits a terminal.
  - id: V8-EVIDENCE-01
    requirement: Require result, content, terminal, commit, CAS, and committed records at their corresponding states.
    falsifier: Removing a required state record still permits a successor action.
  - id: V8-IDENTITY-01
    requirement: Bind prior-process safety claims to literal launch-identity and kernel-observation records.
    falsifier: Empty identity evidence plus an asserted absence reaches meter finalization.
  - id: V8-POST-01
    requirement: Independently reconstruct post-state, action path, payload, and exact append-only union.
    falsifier: Post-state mutation, occupied-path overwrite, prerequisite deletion, or unrelated replacement passes verification.
  - id: V8-UNIQUE-01
    requirement: Enforce logical uniqueness and canonical path-payload agreement for admissions, attempts, phases, commits, and terminals.
    falsifier: Duplicate logical records or path-payload phase disagreement remain countable.
  - id: V8-GIT-01
    requirement: Make repository_validation the only Git object, ref, CAS, and committed-phase authority.
    falsifier: Live or recovery contexts execute a Git write directly.
  - id: V8-GIT-02
    requirement: Derive intent bytes, commit bytes, OID, parent/ref relation, and CAS result rather than trusting enum labels.
    falsifier: A self-including intent or wrong parent/ref can progress after an applied label.
  - id: V8-CONTEXT-01
    requirement: Require rule evaluation_context to equal its source schema fixed context.
    falsifier: A live_transition rule consumes a live_supervisor source unnoticed.
  - id: V8-OVERLAP-01
    requirement: Enumerate and reject unintended multiple matching rules for every valid source product.
    falsifier: Priority silently resolves a product that matches multiple non-default rules.
  - id: V8-CAPABILITY-01
    requirement: Validate and mutate every descriptor field including schema.
    falsifier: Any one-field descriptor mutation remains valid.
  - id: V8-RESOURCE-01
    requirement: Reject malformed, negative, over-cap, unsafe-integer, duplicate-ID, and unknown-edge resource inputs before arithmetic.
    falsifier: Invalid input produces an accepted numeric result.
  - id: V8-RESOURCE-02
    requirement: Bind canonical resource input and derived result digests into the durable resource receipt.
    falsifier: Meter finalization can emit a receipt unrelated to the charged arithmetic fixture.
  - id: V8-PUBLISH-01
    requirement: Verify one immutable in-memory artifact snapshot and bind publication bytes without later moving-file rereads.
    falsifier: A concurrent file change can make executed, parsed, and reported hashes refer to different bytes.
