repair_obligations:
  - id: V9-REDUCER-01
    requirement: >-
      Define one total deriveState(canonicalRecordUniverse) reduction. Selector
      context, schema, state, event, phase, ordinal, dispatcher match, and every
      evidence relation must be outputs of that reduction, never fixture edits.
    falsifier: >-
      Any accepted fixture can change a source field without changing canonical
      record bytes and thereby alter selection.
  - id: V9-SCHEMA-01
    requirement: >-
      Close the durable universe over an explicit record-type registry with exact
      canonical path templates, exact payload keys and value domains, and one
      authorized producer set per type.
    falsifier: >-
      Unknown record types, extra or missing keys, arbitrary paths, or producer
      swaps are accepted after canonical bytes and digests are recomputed.
  - id: V9-PATH-01
    requirement: >-
      Canonicalize and validate relative POSIX paths before uniqueness checks;
      reject absolute paths, dot segments, parent traversal, duplicate normalized
      paths, empty segments, and noncanonical encodings.
    falsifier: >-
      opaque/x.json and opaque/dir/../x.json coexist or resolve to one accepted
      logical destination.
  - id: V9-ORDINAL-01
    requirement: >-
      Derive an exact contiguous A0 through current-Ak admission/start history,
      bounded to A0-A32, with one admission and one linked start per ordinal.
    falsifier: >-
      Sparse A2 history, duplicate ordinal, future ordinal, A33, or missing A1 is
      accepted.
  - id: V9-IDENTITY-01
    requirement: >-
      Bind current attempt, admission, start, reservation, capability receipt,
      launch intent, launch identity, kernel observation, result, resource
      receipt, attempt end, and campaign terminal into one digest-linked identity.
    falsifier: >-
      Any component from another attempt, phase, executable, or reservation can
      be substituted with recomputed outer digests.
  - id: V9-PHASE-01
    requirement: >-
      Derive exact P0-P5 and E0 phase order from committed predecessor records;
      reservations include attempt ordinal and predecessor commitment.
    falsifier: >-
      A phase is skipped, reordered, duplicated, or launched against a reservation
      for another attempt or predecessor.
  - id: V9-TRACE-01
    requirement: >-
      Reconstruct every next pre-state solely from the prior post-state and exact
      post-record universe. Include a complete A0 -> P0-P5 -> E0 -> Git -> meter
      trace and an A2 recovery trace.
    falsifier: >-
      Any trace step invokes sourceFor or equivalent reseeding, or carries only
      the record array while replacing context/state/bindings.
  - id: V9-POST-01
    requirement: >-
      Derive action execution, exact append delta, post-universe, and complete next
      state from action semantics. Fixture-controlled action_executed or partial
      post-state patches are forbidden.
    falsifier: >-
      A fixture marks an unexecuted action as executed or supplies a next source
      inconsistent with the produced records.
  - id: V9-EVENT-01
    requirement: >-
      Give each event a unique record predicate and exact predecessor chain.
      Spawn, runtime, validation, map-open, and valid outcomes must not alias a
      generic terminal-only predicate.
    falsifier: >-
      A validation-failure terminal is accepted as spawn failure, or an unrelated
      predecessor record satisfies an event label.
  - id: V9-AUTHORITY-01
    requirement: >-
      Validate producer authority for every durable type before linkage or state
      derivation. Candidate processes cannot produce admission, capability,
      resource, Git-CAS, terminal, or supervisor-only evidence.
    falsifier: >-
      Replacing an authorized producer with candidate_process leaves the universe
      valid.
  - id: V9-CLOSURE-01
    requirement: >-
      Reject every validly encoded but unreferenced record and require exact
      closure from roots through typed digest edges. No opaque noncounter class is
      permitted.
    falsifier: >-
      An arbitrary private-copy or unknown record can be appended without changing
      the derived decision.
  - id: V9-GIT-01
    requirement: >-
      Bind literal blob and tree object bytes, derive Git object IDs with the
      actual Git object hash algorithm, and bind commit bytes to the exact tree,
      parent, author/committer policy, message, phase result/content/terminal, and
      attempt identity.
    falsifier: >-
      A synthetic descriptive hash substitutes for a tree object or committed
      phase content.
  - id: V9-GIT-02
    requirement: >-
      Require each phase parent to equal the preceding committed OID, enforce the
      exact intended ref and authorized producer across intent/observation/CAS,
      and require a post-CAS ref observation equal to the new OID.
    falsifier: >-
      Disconnected parent, alternate ref, candidate CAS, or post-CAS ref movement
      is accepted.
  - id: V9-OUTCOME-01
    requirement: >-
      Derive last_phase_outcome and campaign progression from the exact terminal,
      result, content, and committed Git object. Do not accept source assertions.
    falsifier: >-
      A harness-failure terminal coexists with asserted valid_outcome and permits
      successor launch.
  - id: V9-CAPABILITY-01
    requirement: >-
      Bind the capability receipt to canonical descriptor bytes, descriptor hash,
      opened executable identity, kernel policy evidence, inherited descriptor
      targets and rights, private-map policy, attempt, phase, reservation, and
      launch intent.
    falsifier: >-
      A forged/replayed receipt or inherited-descriptor target substitution is
      accepted.
  - id: V9-RESOURCE-01
    requirement: >-
      Derive the exact measured-attempt set from the admitted/started universe and
      require memory vertices to equal that set. Derive the complete conservative
      overlap graph from literal lifetime intervals; do not trust a completeness
      label.
    falsifier: >-
      An admitted attempt or overlap edge can be removed while arithmetic and
      hashes are recomputed and the measurement remains valid.
  - id: V9-RESOURCE-02
    requirement: >-
      Bind each resource receipt to a measurement containing its exact ordinal
      exactly once and to the matching admission/start identity and campaign
      closure domain.
    falsifier: >-
      An A2 receipt binds an A0/A1-only measurement.
  - id: V9-CONTEXT-01
    requirement: >-
      Derive dispatcher context and source schema uniquely from the closed state;
      reject cross-context overlap and any supplied dispatcher_match flag.
    falsifier: >-
      The same universe can be paired with two contexts or schemas and reach two
      accepted actions.
  - id: V9-PUBLISH-01
    requirement: >-
      Publish one self-contained snapshot containing the authoritative handoffs,
      V7 and V8 rejected evidence bytes, builder, verifier, contract, generated
      artifacts, controls, reviews, and one external manifest root. Exclude
      AppleDouble files and bind every payload exactly once.
    falsifier: >-
      Verification depends on a sibling path, omits the control artifact or a
      handoff, accepts a cross-file swap, or trusts a replaceable unpinned root.
  - id: V9-DIFFERENTIAL-01
    requirement: >-
      Implement the independent verifier without importing builder validation or
      reduction helpers. Run mandatory mutations for every confirmed V8
      counterexample and require the expected stable rejection reason.
    falsifier: >-
      Builder and verifier share semantic code, or any frozen counterexample lacks
      an executed negative control.
