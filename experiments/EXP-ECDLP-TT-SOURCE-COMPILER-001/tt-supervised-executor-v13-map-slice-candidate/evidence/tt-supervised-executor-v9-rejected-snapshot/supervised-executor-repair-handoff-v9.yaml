v10_repair_obligations:
  - id: V10-PREDICATE-INVENTORY-01
    requirement: >-
      Enumerate every builder validity predicate, constructor-only assertion,
      and verifier validity predicate in a machine-readable ledger. Classify
      intentional asymmetries explicitly; unclassified asymmetry is rejection.
    falsifier: >-
      A builder semantic predicate has no independent verifier predicate and is
      not preregistered as constructor-only.
  - id: V10-RECORD-SCHEMA-01
    requirement: >-
      Require every durable record schema literal to equal the closed protocol
      schema and validate field types, not only exact payload key names.
    falsifier: >-
      A fully rehashed record with an alternate schema literal or wrong field
      type survives independent replay.
  - id: V10-CONFIG-01
    requirement: >-
      Independently validate exact capability, repository, approval, and
      resource-policy objects including integer types and bounds.
    falsifier: >-
      A relinked alternate resource policy or noninteger recovery approval is
      accepted.
  - id: V10-BASE-REACHABILITY-01
    requirement: >-
      Derive the exact sequence-zero trusted base from campaign roots and typed
      digest reachability. Require equality with the supplied sequence-zero
      universe; a type whitelist is insufficient.
    falsifier: >-
      The accepted A3 resource-lifetime record, or any authorized known-type
      record without an admission/start/consumer path, survives either validator.
  - id: V10-RULE-TOTALITY-01
    requirement: >-
      Define exact action and observation semantics for every one of the 153
      inherited selector rules and every adverse branch, or explicitly remove
      unreachable rules under a proved closed source invariant.
    falsifier: >-
      Any selectable rule reaches ACTION_SEMANTICS_MISSING, relies on a default
      fallthrough, or lacks a complete positive and negative trace obligation.
  - id: V10-ACTION-OUTPUT-01
    requirement: >-
      For every deterministic selected action, independently reconstruct the
      exact expected domain-record bodies from the pre-universe and derived
      source, rather than checking only the domain record-type multiset.
    falsifier: >-
      An action receipt selects the correct rule while its fully rehashed domain
      record applies to another ordinal, phase, predecessor, or closure value.
  - id: V10-OBSERVATION-OUTPUT-01
    requirement: >-
      For externally observed domains, validate exact current ordinal/phase,
      authority, pending-observation identity, value types, bounds, and all
      links consumed by later actions.
    falsifier: >-
      A legal type envelope carrying stale, cross-context, or out-of-cap values
      is accepted after journal relinking.
  - id: V10-RESOURCE-RECEIPT-01
    requirement: >-
      Bind each resource receipt's input digest, result digest, and literal
      result to the exact linked measurement in addition to ordinal/admission/start.
    falsifier: >-
      A receipt with fabricated totals remains valid when its measurement link
      and journal are recomputed.
  - id: V10-RESOURCE-METRIC-01
    requirement: >-
      Name the charged memory quantity precisely and use bounded integer
      arithmetic. Distinguish conservative connected-component capacity sum
      from simultaneous peak memory and reject negative or above-cap observations.
    falsifier: >-
      The accepted negative/above-cap observation universe survives, arithmetic
      overflows silently, or a component sum is reported as measured peak memory.
  - id: V10-ATTEMPT-END-01
    requirement: >-
      Close attempt-end outcome, terminal request, durable state, ordinal, and
      resource-receipt semantics under an explicit state-dependent vocabulary.
    falsifier: >-
      An unrecognized or state-inconsistent attempt-end payload reaches closure.
  - id: V10-PRIVATE-MAP-01
    requirement: >-
      Bind E0 map intent, observation, descriptor token, opened receipt, launch
      intent, current ordinal, E0 phase, and reservation. Require null map
      receipts on every non-E0 launch.
    falsifier: >-
      E0 launches without the current opened receipt or non-E0 launches with a
      map receipt survive replay.
  - id: V10-PHASE-IDENTITY-01
    requirement: >-
      Enforce one current ordinal/phase identity across reservation, executable,
      capability, launch, spawn token, reap, result, content, terminal, Git
      intent/object/CAS/commit, and meter launch identity.
    falsifier: >-
      A complete phase chain can be cross-linked to another phase or admitted
      ordinal while action receipts still describe the current attempt.
  - id: V10-GIT-CONTENT-01
    requirement: >-
      Bind intent, result, content, blob, tree, commit, phase, and attempt ordinal
      into one same-phase edge chain in both validators, in addition to literal
      Git object bytes and ref continuity.
    falsifier: >-
      The accepted P1 tree containing a P0 blob, or an equivalent same-type
      cross-phase substitution, survives either validator.
  - id: V10-CLOSURE-01
    requirement: >-
      Bind recalculation to the exact current campaign terminal and exact current
      measurement result digest; bind lock release to that recalculation, current
      ordinal, complete status, and a still-held root lock.
    falsifier: >-
      The accepted V9 recalculation mutation, or any stale/cross-attempt variant,
      passes either validator.
  - id: V10-DIFFERENTIAL-01
    requirement: >-
      Execute all fully relinked semantic mutations through both independently
      authored validators and require equal accept/reject decisions plus the
      preregistered rejection class. Builder self-checks are not evidence of
      independent parity.
    falsifier: >-
      Either validator accepts a mutated universe rejected by the other outside
      an explicitly reviewed constructor-only row.
  - id: V10-REGRESSION-PIN-01
    requirement: >-
      The independent verifier must own and pin mandatory regression IDs,
      operations, target traces, mutation bytes, and expected rejection classes.
      Artifact-supplied tests are untrusted inputs.
    falsifier: >-
      Replacing all mandatory controls with repeated trivial failures retains a
      passing regression count.
  - id: V10-PUBLISH-01
    requirement: >-
      Freeze a portable bundle containing the predicate ledger, both validators,
      exact source bytes, traces, full mutations, receipts, prior rejected V9
      evidence, and nested manifests under one external root. Require directory
      equality with the manifest, reject all symlinks in reviewed evidence path
      components, and bind the external root from the verifier entrypoint.
    falsifier: >-
      Any reviewed byte is absolute-path dependent, mutable, omitted, or not
      transitively pinned by the external root; any unlisted payload or
      intermediate symlink alias is accepted.
mandatory_fully_relinked_regressions:
  - alternate_record_schema_literal
  - noninteger_recovery_approval
  - alternate_resource_policy
  - sequence_zero_unconsumed_known_type
  - sequence_zero_A3_resource_lifetime
  - observed_resource_value_above_cap
  - observed_resource_value_negative
  - fabricated_resource_receipt_input
  - fabricated_resource_receipt_result
  - invalid_attempt_end_outcome
  - stale_attempt_end_terminal_request
  - e0_missing_private_map_receipt
  - e0_cross_ordinal_private_map_receipt
  - non_e0_unexpected_private_map_receipt
  - arbitrary_process_token
  - alternate_private_map_descriptor_token
  - cross_phase_reap_result_content_terminal
  - cross_ordinal_phase_chain
  - cross_phase_git_intent_components
  - cross_phase_git_blob_tree
  - cross_phase_terminal_result_content
  - forged_recalculation_terminal_digest
  - forged_recalculation_totals_digest
  - stale_lock_release_recalculation
  - release_without_held_lock
  - builder_accepts_verifier_rejects
  - verifier_accepts_builder_rejects
  - mandatory_regression_suite_substitution
  - unlisted_publication_payload
  - intermediate_evidence_symlink_alias
proof_track: >-
  Show by induction over the contiguous journal that exact source reconstruction
  plus exact action-output reconstruction yields one semantic post-universe for
  every deterministic action in the covered trace families.
disproof_track: >-
  Generate validly rehashed universes from each predicate-ledger row, recompute
  all downstream links and journal roots, and seek any acceptance differential
  or alternate post-universe for the same pre-universe and selected action.
next_concrete_action: >-
  Preserve the frozen V9 bundle, independent NO-GO reports, and all accepted
  counterexamples under one rejected-snapshot root, then cut the versioned V10
  draft from the exact-domain verifier prototype.
