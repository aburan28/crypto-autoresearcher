    - knowledge/techniques/KN-TECH-a810e4.md
    - ledger/questions/RQ-MONO-001.yaml
    - ledger/goals/GOAL-MONO-001/goal.yaml
    - docs/inventor-protocol.md
    - docs/claims-and-verification.md

  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
