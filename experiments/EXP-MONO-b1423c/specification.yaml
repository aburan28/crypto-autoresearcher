experiment:
  id: EXP-MONO-b1423c
  version: 1
  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-08-31'
  coordinator_approval_rationale: >-
    APPROVED. This is DEC-20260831-fccd7e's own named next_action: a
    small, targeted positive-control check closing the single remaining
    open qualification on H-MONO-663fb4's status -- whether
    EXP-MONO-b19c6b's Fisher-combined statistic can detect a genuine
    positive (SENSITIVITY), not merely that it does not fire on a null
    (SPECIFICITY, already confirmed via Stage 2's gate). Per
    KN-TECH-a810e4's own lesson (a control's letter is not its intent),
    this is deliberately scoped to close that specific gap precisely,
    not to re-run any part of the three prior full K3/K4 experiments.
    NO NEW EXECUTOR-STAGE-2/3-SCALE COMPUTE IS NEEDED: this reuses
    EXP-MONO-b19c6b's own frozen, twice-reviewed implementation
    (fields.py, curve.py, conv.py, groupstate.py, stats.py) and
    EXP-MONO-c819ba's own already-realized, already-reviewed subgroup
    curve (RO3: p=307, A=269, B=6, N=288, n1=3, n2=96), which has an
    EXACT, forced, maximally-extreme positive control built in (C/F
    exactly 1.0 at h=N/2=144 and h=N/4=72 -- the theoretical maximum
    possible value, confirmed exact in EXP-MONO-c819ba's own
    execution_report.yaml L4_positive_control_1_subgroup block). SAME
    STANDALONE-BRANCH AUTHORITY AS ALL TEN PRIOR MONO CONTRACTS THIS
    SESSION: GOAL-MONO-001 is `paused` with its campaign budget
    exhausted; this draws on none of it.
  hypothesis_id: H-MONO-663fb4
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  batch_id: null
  batch_id_note: >-
    No batch is asserted. GOAL-MONO-001 is `paused` with its campaign
    budget exhausted; batch assignment is a Coordinator act and is not
    performed here.

  title: >-
    K5 sensitivity check: does EXP-MONO-b19c6b's Fisher-combined
    statistic reject a genuine, maximally-extreme positive control
    (RO3's exact subgroup factor base)?

  objective: >-
    Close the single open qualification on EV-MONO-04d447/DEC-20260831-
    fccd7e: confirm (or refute) that the Fisher-combined panel-level
    statistic EXP-MONO-b19c6b introduced as a co-equal primary metric can
    detect a genuine, known-exceptional factor base -- its SENSITIVITY,
    which the null-object gate (confirming only SPECIFICITY) never
    tested. This directly discharges H-MONO-663fb4's own mandatory
    `proof_search_map.method_ceiling.nearby_object_control` (K5) against
    the Fisher-combined statistic specifically, for the first time in
    this three-experiment lane.

  what_this_is_not:
    - Not a discrete-logarithm computation, not an ECDLP attack, not relation collection at scale.
    - Not an ECDLP cost, runtime, asymptotic, exponent, cryptographic-scale, or deployed-scheme claim.
    - >-
      Not a fourth K3/K4 attempt on the real x-coordinate factor base:
      this uses ONLY a synthetic/reconstructed subgroup factor base as
      the known-positive arm, mixed with EXP-MONO-b19c6b's own already-
      archived real-arm raw p-values as the background panel.
    - >-
      Not a re-litigation of EXP-MONO-b19c6b's own "controlled null
      confirmed" reading for the per-curve Holm/permutation statistic,
      which this record does not touch.
    - Not a claim on GOAL-ECDLP-001's or GOAL-RELN-001's territory.
    - Not approved for any purpose beyond what this record states once run.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: whether the Fisher-combined statistic, computed exactly
      as EXP-MONO-b19c6b's own frozen `stats.py` defines it, rejects
      (or fails to reject) a panel containing RO3's exact subgroup
      factor base mixed into EXP-MONO-b19c6b's own realized
      random-ordinary panel's raw p-values, at m=4. This establishes
      whether the statistic's machinery has practical detection power at
      this panel size (k~48-50) for a maximally-extreme case -- it does
      NOT establish the statistic's power against the mild, diffuse
      deviation H-MONO-663fb4 actually hypothesizes, which would be a
      much harder, smaller-effect-size test.
    what_no_outcome_can_support: >-
      No outcome establishes the asymptotic size of C; no outcome
      converts a measured deviation into a cost or an exponent; no
      outcome transfers to crypto scale. A REJECT here does not confirm
      K3/K4's exceptional-locus branch (RO3's subgroup is a DIFFERENT,
      known-exceptional object, not evidence about the real x-coordinate
      factor base); a FAIL-TO-REJECT here would be a significant,
      reportable finding about the statistic's practical sensitivity at
      this panel size specifically, not proof it can never detect
      anything.

  inputs:
    reused_frozen_implementation: >-
      experiments/EXP-MONO-b19c6b/implementation/{fields,curve,conv,
      groupstate,stats}.py, BYTE-IDENTICAL, no modification permitted.
      This is the exact, twice-independently-reviewed Fisher-combined
      implementation (`fisher_combined_pvalue`, cross-checked against
      scipy.stats.chi2.sf to 4.4e-14 max error by the Red Team) whose
      sensitivity is under test.
    known_positive_construction: >-
      RO3 exactly as EXP-MONO-c819ba's own archived
      execution_report.yaml records it: p=307, A=269, B=6, N=288, n1=3,
      n2=96. FB = the index-h subgroup H <= E(F_p) at h=N/2=144 AND,
      separately, h=N/4=72 (two cells, both tested). Construct H exactly
      as EXP-MONO-c819ba's own (corrected, per that contract's own
      INTERPRETATION 1 disclosure) subgroup-construction method:
      H = {(a,b) in Z/n1 x Z/n2 : b == 0 mod k} for the appropriate k,
      reproduced from experiments/EXP-MONO-c819ba/implementation/controls.py's
      subgroup construction function VERBATIM (read-only reuse, do not
      reconstruct from the prose description alone -- use the actual
      code that produced the exact, already-verified values
      forced_relative_deviation=1.0/3.0, C/F=1.0/1.0).
    background_panel: >-
      EXP-MONO-b19c6b RUN-MONO-b19c6b-1's own archived
      `stage3_per_curve_raw_pvalues` for the random-ordinary family
      (48 or 49 curves, whichever RUN-1 realized), read directly from
      `experiments/EXP-MONO-b19c6b/runs/RUN-MONO-b19c6b-1/raw-result.json`
      -- NOT re-generated. This is a genuinely non-exceptional
      background (independently confirmed by two reviewers to show no
      signal), used here only as REALISTIC BACKGROUND NOISE for the
      Fisher-combined pooling, not as new evidence in its own right.
    null_draws_for_the_positive_control_cell: 20000
    null_draws_note: >-
      Matches EXP-MONO-b19c6b's own design-time-verified draw count
      exactly (KN-TECH-95a42b), so the positive-control cell's own raw
      p-value is computed under an identically-powered instrument to the
      background panel it is mixed with.
    domain: EXP-MONO-b1423c/v1
    seed_derivation_rule: >-
      Every null-subset draw for the RO3-subgroup cell uses SHA-256 of
      domain || "|" || decimal(master_seed) || "|" || "null-subset" || "|"
      || decimal(p) || "|" || decimal(h) || "|" || decimal(draw_index) ||
      "|" || decimal(counter), big-endian unsigned, rejection-sampled
      against modulo bias, identical mechanism to EXP-MONO-b19c6b's own
      `controls.py::draw_symmetric_subset`. master_seed=20260901 (single
      run; no replication needed for a deterministic-construction
      positive-control check -- the KNOWN object is fixed, only the null
      draws are randomized, and a single well-powered draw count already
      settles the question decisively for a maximally-extreme case).

  arms_and_controls:
    known_positive_cell_ro3_h_n_over_2: >-
      FB = H, |H|=144, on RO3 (p=307, N=288). Compute Var_real and
      C_real/F at m=4 using EXP-MONO-b19c6b's own conv.py. Draw 20000
      matched-null symmetric subsets of size F=144 on the SAME curve,
      compute Var_null distribution, compute the two-sided permutation
      raw p-value for Var and for C/F exactly as EXP-MONO-b19c6b's
      stats.py defines it (p=(1+count)/(20001)).
    known_positive_cell_ro3_h_n_over_4: >-
      Identical construction at h=72 (F=72). Both cells' raw p-values
      are reported; EITHER alone rejecting the Fisher-combined test
      below is a sufficient positive result.
    background_reuse: >-
      Take RUN-MONO-b19c6b-1's own archived random-ordinary
      `stage3_per_curve_raw_pvalues` UNCHANGED -- do not recompute, do not
      re-draw. BOTH statistics' entries are reused, each only within its
      own panel: the `p_var_raw` entries are the background for the Var
      panels (S1/S2) and the `p_cf_raw` entries are the background for the
      C/F panels (S3/S4). A Fisher combination never mixes the two
      statistics: a C/F treatment p-value is pooled only with `p_cf_raw`
      background, and a Var treatment p-value only with `p_var_raw`.
    fisher_combined_mixed_panel: >-
      TWO SEPARATE MIXED PANELS, ONE PER KNOWN-POSITIVE CELL: (a) the
      RO3-h=N/2 raw p-value PLUS all of the background panel's raw
      p-values for the SAME statistic; (b) the RO3-h=N/4 raw p-value PLUS
      the same-statistic background.
      Apply EXP-MONO-b19c6b's own `fisher_combined_pvalue` (unmodified)
      to each mixed panel. THIS IS THE PRIMARY TEST.
    dual_path_control: >-
      Route 1 (direct convolution) vs route 2 (FFT-derived) on BOTH
      known-positive cells, same 1e-9 relative tolerance as prior
      contracts in this lane.
    comparability_policy: >-
      This record does NOT license any comparison of its own numbers
      with EXP-MONO-c819ba's, EXP-MONO-670aa6's, or EXP-MONO-b19c6b's own
      archived cells beyond the specific reuse declared above (reading,
      not recomputing, RO3's construction and RUN-MONO-b19c6b-1's
      background panel).

  metrics:
    primary:
      - "S1: Fisher-combined p-value of mixed panel (a) (RO3 h=N/2 + background), Var statistic."
      - "S2: Fisher-combined p-value of mixed panel (b) (RO3 h=N/4 + background), Var statistic."
      - "S3/S4: identical, C/F statistic."
      - "S5: raw two-sided permutation p-value of the RO3-subgroup cells alone (both h), both statistics -- reported to show whether the KNOWN-POSITIVE cell itself is an extreme outlier before pooling."
    secondary:
      - Dual-path route1/route2 agreement on both known-positive cells.
      - Var_real, C_real/F, and their ratio to the matched null's mean/median for both known-positive cells (for direct comparison against EXP-MONO-c819ba's own already-reported L4/coset-union values).

  preregistered_prediction:
    - quantity: S5 (raw p-value of the known-positive cell alone)
      value: >-
        EXPECTED NEAR THE FLOOR (1/20001), since C/F=1.0 exactly is the
        theoretical maximum possible value and RO3's own already-
        archived C/F=1.0 forced result is a qualitatively extreme
        construction (full character-sum concentration). This is a
        PREDICTION, stated before any run, not a guaranteed outcome --
        if the null distribution's own spread at F=144/F=72 happens to
        be wide enough that C/F=1.0 is not actually rare, S5 would NOT
        be near the floor, which would itself be an important, reportable
        finding about how "extreme" this specific positive control
        actually is relative to a null of this exact size.
      source: >-
        EXP-MONO-c819ba's own execution_report.yaml
        L4_positive_control_1_subgroup block (C/F exactly 1.0, the
        theoretical maximum).
    - quantity: S1-S4 (Fisher-combined, mixed panel)
      value: >-
        TWO-SIDED, GENUINELY OPEN: if S5 confirms the known-positive cell
        is a genuine outlier, S1-S4 rejecting (combined p < 0.05) would
        confirm the Fisher-combined statistic's sensitivity, closing
        K5's gap for this metric. Failing to reject even with a genuinely
        extreme single cell injected would be a significant, reportable
        finding that the statistic lacks practical power at this panel
        size (k~48-50) even for a maximally-extreme case -- informative
        either way.
      source: DEC-20260831-fccd7e next_action; Red Team OBJ-5 (EXP-MONO-b19c6b review).

  budget:
    maximum_runs: 1
    maximum_wall_seconds: 600
    maximum_cpu_seconds: 1200
    maximum_peak_rss_bytes: 536870912
    maximum_total_disk_bytes: 268435456
    maximum_workers: 1
    no_network: true
    cost_note: >-
      Two known-positive cells x 20000 null draws each on a single fixed
      curve (RO3, N=288) is comparable in cost to a handful of
      EXP-MONO-b19c6b cells (that contract's per-curve cost at n=20000
      was a small fraction of its ~400s total runtime across ~48-50
      curves); expected well under 60s total. A single run, no
      replication needed (the known object and background panel are both
      fixed; only the null draws are randomized once at a well-verified
      draw count).

  environment_preconditions:
    consequence: NO CAS AND NO SOLVER IS REQUIRED, unchanged from all three prior contracts in this lane.
    if_a_precondition_fails: >-
      A missing interpreter or a failed symmetry/subgroup-construction
      check is `failed_infrastructure`, reported as infrastructure
      signal, NEVER negative mathematical evidence (AGENTS.md rule 3).

  infrastructure_failure_disposition: >-
    Any timeout, crash, or construction failure is recorded with its
    exact cause and classified `failed_infrastructure` or `invalid`.
    Supports and weakens NOTHING about H-MONO-663fb4 or the ECDLP.

  stopping_rules:
    - Do not execute unless separately reviewed, approved, frozen and authorized. (Satisfied here.)
    - >-
      Stop if RO3's reconstructed subgroup does not reproduce
      EXP-MONO-c819ba's own archived exact values (forced_relative_
      deviation=1.0/3.0, C/F=1.0/1.0) to the declared tolerance --
      this would mean the reused construction code was misapplied, not
      that the positive control failed; report as `failed_infrastructure`.
    - Stop on any budget breach, reporting it as infrastructure signal.

  invalidation_rules:
    - Any execution while frozen, execution_authorized or evidence_eligible is false.
    - Any recomputation (rather than direct reuse) of RUN-MONO-b19c6b-1's background panel.
    - Any modification to the reused fields/curve/conv/groupstate/stats.py implementation files.
    - Any report of S1-S4 without also reporting S5 (the known-positive cell's own raw p-value, needed to interpret S1-S4 correctly).

  success_criterion: >-
    A run is well-formed evidence (regardless of which direction S1-S5
    come out) if: RO3's reconstructed subgroup reproduces
    EXP-MONO-c819ba's exact archived values; the background panel is
    reused unmodified; S1-S5 are reported with exact values, both
    known-positive cells, both statistics; the dual-path control shows no
    threshold breach. THAT DISPOSITION SUPPORTS EXACTLY the scoped
    statement in claim_ceiling and nothing more.

  falsification_criterion: >-
    Any of: (a) RO3's reconstruction failing to reproduce
    EXP-MONO-c819ba's exact archived values (infrastructure signal, not
    evidence); (b) S5 showing the known-positive cell is NOT a
    near-floor outlier despite its C/F=1.0 construction (itself a
    reportable finding about this null's actual spread at F=144/72,
    escalated rather than absorbed); (c) S1-S4 failing to reject despite
    S5 confirming a genuine outlier (a significant, reportable finding
    that the Fisher-combined statistic lacks practical sensitivity at
    this panel size, k~48-50, even for a maximally-extreme case).

  outcomes:
    sensitivity_confirmed: >-
      S5 confirms RO3's subgroup is a genuine outlier AND at least one of
      S1-S4 rejects (combined p < 0.05). Closes K5's gap for the
      Fisher-combined statistic; H-MONO-663fb4's status may be revisited
      toward unscoped `supported` for the per-curve+Fisher-combined
      instrument jointly.
    sensitivity_gap_confirmed: >-
      S5 confirms a genuine outlier but NONE of S1-S4 reject. A
      significant, reportable finding: the Fisher-combined statistic, as
      currently constructed (unweighted pooling across k~48-50 curves),
      lacks practical power to detect even a maximally-extreme single-
      curve deviation at this panel size -- informing whether future
      contracts should use a weighted or rank-based combining method
      instead.
    positive_control_itself_not_extreme: >-
      S5 shows the known-positive cell is not near the floor. This means
      C/F=1.0 is less extreme relative to this null's actual spread than
      expected, and no conclusion about Fisher-combined sensitivity can
      be drawn from this specific construction; a different (more
      extreme, or larger) positive control would be needed.
    infrastructure_or_integrity_failure: See infrastructure_failure_disposition. Never mathematical evidence.

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_do_not: >-
      Unchanged from all three predecessors: toy scale, no transfer to
      cryptographic scale or F_{q^n}. This record additionally does not
      transfer its finding (about a maximally-extreme synthetic subgroup
      case) to any claim about the mild, diffuse deviation H-MONO-663fb4
      actually hypothesizes for the real x-coordinate factor base.

  required_artifacts_if_later_authorized:
    - Frozen approved specification with a freeze receipt binding its SHA-256.
    - RO3 subgroup reconstruction transcript, cross-checked against EXP-MONO-c819ba's own archived exact values.
    - Both known-positive cells' raw Var/C-F values, null distributions summary, and raw p-values (S5).
    - Both mixed-panel Fisher-combined results (S1-S4), both statistics.
    - Dual-path control results on both known-positive cells.
    - Run manifest carrying git commit, dirty-tree state, environment, resolved model identifier and probe status.
    - Command, stdout, stderr, timings, peak RSS, and an execution report.
    - Snapshot archive followed by independent validation and red-team review.

  approval_requirements:
    - This contract IS DEC-20260831-fccd7e's own named next_action; no further Coordinator judgment call is reserved beyond this approval.
    - Independent review confirms RO3's reconstruction genuinely reproduces EXP-MONO-c819ba's archived exact values before trusting S1-S5.
    - Independent review confirms the background panel is genuinely reused, not recomputed or altered.

  approval_status: >-
    APPROVED 2026-08-31 by the Coordinator; see `coordinator_approval_rationale` above.

  source_refs:
    - ledger/hypotheses/H-MONO-663fb4.yaml
    - experiments/EXP-MONO-c819ba/specification.yaml
    - experiments/EXP-MONO-c819ba/execution_report.yaml
    - experiments/EXP-MONO-c819ba/implementation/controls.py
    - experiments/EXP-MONO-b19c6b/specification.yaml
    - experiments/EXP-MONO-b19c6b/implementation/stats.py
    - experiments/EXP-MONO-b19c6b/reviews/red-team/red-team-report.yaml
