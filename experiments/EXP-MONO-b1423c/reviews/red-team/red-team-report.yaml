  reduction_and_scope_challenges:
    - >-
      The contract's own claim_ceiling ("does NOT establish the statistic's
      power against the mild, diffuse deviation H-MONO-663fb4 actually
      hypothesizes") is correct and is not violated anywhere in the archived
      execution_report.yaml or implementation.md -- see OBJ-4 for why this
      scope limit is not merely a formal caveat but the substantively
      correct reading (a single-extreme-outlier test is close to the
      statistically expected worst case for any pooling method, and says
      little about the method's actual intended regime).
