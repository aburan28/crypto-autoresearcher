red_team_report:
  id: RT-20260831-b1423c
  task_id: red-team-mono-b1423c
  experiment_id: EXP-MONO-b1423c
  hypothesis_id: H-MONO-663fb4
  role: red-team
  joint: J2-adversarial

  review_plan_copy: >-
    Prior (Coordinator): EXP-MONO-b1423c is a small, targeted follow-up
    experiment that correctly reconstructed a known-exceptional positive
    control (EXP-MONO-c819ba's RO3 subgroup factor base) and confirmed it
    lands exactly at the permutation-test floor (a genuine, maximally-extreme
    outlier), but found EXP-MONO-b19c6b's Fisher-combined statistic FAILS to
    reject this outlier when mixed into a ~49-curve background panel
    (combined p in [0.47, 0.52]). The Coordinator interprets this as an
    informative negative finding about Fisher's method's known statistical
    property (diluting a single extreme value across many background tests),
    not an implementation bug, and computed that the extreme cell's
    chi-squared contribution (~19.8) is comparable to the panel's own
    natural fluctuation (df=98, sd~14). TASK: attack this. Joint
    J2-adversarial: find the strongest case that this disposition is wrong
    -- either (a) the "sensitivity gap" finding is actually an artifact of
    something else (construction error, unrepresentative background panel,
    subtle implementation issue), or (b) the mathematical explanation given
    for WHY it failed to reject is wrong or incomplete, or (c) the
    experiment doesn't actually establish what it claims. Blindness:
    dispatched fresh and concurrently with an independent Validator session;
    do not read experiments/EXP-MONO-b1423c/reviews/validator/ or any
    validator-labeled path. Proves-too-much / cross-lane check: if
    Fisher-combined genuinely has this dilution weakness at k~49, does that
    retroactively cast doubt on EXP-MONO-b19c6b's own "controlled null
    confirmed" reading (which relied partly on Fisher-combined showing no
    signal)? Specifically: was Fisher-combined's "no signal" result in
    EXP-MONO-b19c6b ever informative for the single/few-curve-deviation
    case, or only for the many-mild-curves case it is traditionally suited
    for, and is EV-MONO-04d447's own disposition already scoped for this or
    does it need an additional caveat? Hunt for a genuinely new,
    previously-undiscovered defect, per this lane's established practice.

  snapshot_reviewed:
    commit_sha: 8e8edf2d473e3f51f715580e137f3b0f5a54bf15
    receipt: coordination/tasks/TASK-20260831-cca2c8/snapshot-receipt.json
    design_snapshot_commit_run_was_executed_against: af5528b494b1ef9486ba69f0f458e16e95bb748e
    out_of_band_edit_disclosed: 9e786d21d60506b69fc6ecfe0620925ceece5130 (CORR-20260831-817847)
