      all and can it ever detect a genuine deviation" (yes, mechanically,
      per the sibling review's synthetic check) crossed with "does it detect
      THIS SPECIFIC kind of deviation (single extreme outlier) at THIS
      panel size" (no, robustly, per this review). It remains entirely open
      for the many-mild-curves regime -- this is stated in the record's own
      `outcomes.sensitivity_gap_confirmed` block but should be restated
