  proof_architecture_not_applicable_reason: >-
    This is a toy-scale statistical-instrument sensitivity check against a
    synthetic positive control, not a proof-oriented theorem, asymptotic
    bound, or reduction. Section 8's proof-architecture portfolio does not
    apply.

  narrowest_supported_statement: >-
    Every construction, reconstruction, and arithmetic claim in
    EXP-MONO-b1423c's execution_report.yaml is independently reconfirmed
    here from scratch (a standalone, repository-code-free re-derivation of
    RO3's group order/structure; byte-for-byte diffs of every reused
    implementation file; an independent reimplementation of the Fisher-
    combined statistic reproducing S1-S4 bit-for-bit; and a direct reading
    of run.py confirming CORR-20260831-817847's claim that the disclosed
    out-of-band edit's ambiguity was never live in the executed code). No
    implementation defect, construction error, or unrepresentative-panel
    disqualification was found: RO3's subgroup is a genuine, maximally-
    extreme outlier (S5 at the exact permutation floor on both statistics,
    both cells, by margins of roughly 6,358x and 245x over the largest of
    20,000 null draws for Var, and 5.8x and 3.4x over the null mean for
    C/F), and none of S1-S4 reject at alpha=0.05 using the specified,
    correctly-matched background panel. HOWEVER: the reported combined
    p-values (0.47-0.52) are NOT representative of what the identical test
    would show under the three other archived, equally non-exceptional
    background panels available in this same lane (0.076-0.19), nor of a
    pooled k=191 panel (0.58-0.63) -- the specific RUN-1-random-ordinary
    choice happens to be the least-sensitive-looking of the options
    available, because that panel's own Fisher-combined statistic sits
    appreciably (z~-1.3) below its own null expectation before any outlier
    is added. The DIRECTION of the finding ("Fisher-combined does not
    reject even a maximally-extreme single outlier at k~49-191") is robust
    across every panel tried and gets stronger, not weaker, at larger k --
    supporting the Coordinator's qualitative "genuine dilution, not
    artifact" reading. The specific MAGNITUDE and the "comparable to the
    panel's natural fluctuation" framing understate how much of the
    non-rejection is attributable to this particular background panel's own
    below-average quietness, and should be qualified accordingly in any
    future citation. Separately, this experiment's own single-extreme-
    outlier construction tests a regime Fisher's method was never expected
    to be strong in (the per-curve Holm test already covers it); the
    statistic's actual intended regime -- many mild, diffuse per-curve
    deviations -- remains completely untested by any experiment in this
    three-experiment lane, and EV-MONO-04d447's "untested assumption"
    language for Fisher-combined sensitivity should be sharpened to
    "demonstrated absent for the single-outlier case, entirely untested for
    the many-mild-curves case" once this result is folded in. One minor,
    genuinely new documentation defect was found (OBJ-5): implementation.md
    misstates the h=144 Var-vs-null-max margin as "roughly 6x" when the
    correct figure is roughly 6,358x, apparently by substituting a different
    reported ratio (C/F-vs-null-mean, 5.83) into that sentence. This does
    not affect any measured value used in S1-S5 or the outcome
    classification.

  next_concrete_action: >-
    (1) Fold OBJ-1's panel-sensitivity finding into the Coordinator's
