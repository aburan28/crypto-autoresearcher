        measured=3.0, C/F=1.0. Exact match to EXP-MONO-b1423c's own
        reconstruction_verification block and to
        `matches_c819ba_archived_exact_values: true` on both cells.
    - id: RECOMP-4
      metric: Background panel genuine, unmodified reuse
      method: >-
        Loaded EXP-MONO-b19c6b/runs/RUN-MONO-b19c6b-1/raw-result.json
        directly, extracted stage3_per_curve_raw_pvalues.random-ordinary (48
        curves), and independently computed
        sha256(json.dumps(obj,sort_keys=True,default=str)) exactly as
        run.py's own `sha256_of` does.
      result: >-
        Computed hash 530403e17b9d4870a21abe1ea1e1bcdb698e05a0916b4380725b9ae18fb0b23b
        matches `background_panel_sha256` in RUN-MONO-b1423c-1's raw-result.json
        exactly. The background panel is provably the genuine archived data,
        not a reconstruction, recomputation, or alteration.
    - id: RECOMP-5
      metric: S1-S4 Fisher-combined mixed-panel p-values
      method: >-
        Wrote an independent, from-scratch Python implementation of Fisher's
        method (statistic = -2*sum(ln p_i), df=2k) and the closed-form
        even-df chi-squared survival function, cross-checked against
        scipy.stats.chi2.sf; applied it to [S5 floor p-value] + [48
        background p_var_raw or p_cf_raw values, read directly from
        EXP-MONO-b19c6b's own raw-result.json].
      result: >-
        S1=S2 (Var) = 0.5197796626550032 (fisher_stat 96.64413440048166,
        df=98). S3=S4 (C/F) = 0.47085766077181307 (fisher_stat
        98.3572413619046, df=98). BIT-IDENTICAL to raw-result.json's S1-S4
        and cross-checked against scipy.stats.chi2.sf to full agreement
        (0.5197796626550051 / 0.47085766077180663, differing only in the
        16th significant digit from floating-point summation order).
    - id: RECOMP-6
      metric: >-
        Background-matching correctness (the concern the disclosed
        out-of-band commit 9e786d21d / CORR-20260831-817847 raised).
      method: >-
        Read experiments/EXP-MONO-b1423c/implementation/run.py directly
        (lines 169-171, 252-256), not the correction's prose.
      result: >-
        CONFIRMED CORRECT, independent of and in addition to
        CORR-20260831-817847's own check: `background_p_var` (from
        `p_var_raw`) is pooled ONLY into the Var Fisher panels
        (`mixed_var`), and `background_p_cf` (from `p_cf_raw`) is pooled
        ONLY into the C/F Fisher panels (`mixed_cf`), at every call site, no
        exception. The ambiguity in the original frozen prose was never
        exploited in the actually-executed code.
    - id: RECOMP-7
      metric: >-
        THE CORE MATHEMATICAL-EXPLANATION CHECK (task item 4) -- is the
        Coordinator's dilution explanation for S1-S4's non-rejection
        correctly computed, and is it the actual reason?
      method: >-
        Independently computed, from the archived raw p-values and from
        first principles (not from the Coordinator's commit message or any
        prose): the extreme cell's own chi-sq contribution
        (-2*ln(4.999750012499375e-05)); the chi2(df=98) null distribution's
        mean/sd; the actual alpha=0.05 rejection threshold via
        scipy.stats.chi2.ppf(0.95,98); the 48-curve background panel's own
        realized chi-sq sum (excluding the injected cell) for both
        statistics; and, going beyond what the archived record states, the
        number of null draws that would be required to close the gap by
        raising n_null_draws alone.
      result: >-
        Extreme-cell contribution: 19.80707510257234 -- matches the
        Coordinator's commit-message figure "~19.8" exactly. chi2(df=98):
        mean=98.0, sd=sqrt(196)=14.0 exactly -- matches "sd~14" exactly.
        BUT the "comparable in magnitude" framing, while directionally
        correct, understates the picture; sharper numbers: the alpha=0.05
        rejection threshold is 122.108 (1.722 sd above the mean, not 1 sd).
        The 48-curve background's OWN realized sum (excluding the injected
        cell) is 76.837 (Var) / 78.550 (C/F) -- both chi2(df=96)-typical,
        sitting ~1.4 sd BELOW their own null mean of 96 (unremarkable
        fluctuation, not an anomalously quiet panel). Adding the injected
        cell's 19.807 gives totals of 96.644 / 98.357 -- landing almost
        EXACTLY at the FULL PANEL's null mean of 98, i.e. statistically
        indistinguishable from a 49-value panel with NO injected signal at
        all. The shortfall to the rejection threshold is 45.27 (Var) / 43.56
        (C/F) chi-sq units -- more than DOUBLE the injected cell's
        contribution. GOING BEYOND THE ARCHIVED RECORD: because S5 is a
        PERMUTATION p-value with a hard floor of 1/(n_null_draws+1), the
        maximum possible chi-sq contribution ANY single injected cell of
        this construction could EVER supply is capped at
        -2*ln(1/(n+1)), independent of how much more extreme the true
        underlying deviation actually is -- at n=20000 that cap is exactly
        19.807, already realized here (both cells hit count=0). Closing the
        ~44-45-unit gap by raising n_null_draws alone would require ~467,000
        draws even under the generous assumption that the background sat
        exactly at its own theoretical mean, and ~2.9-6.8 BILLION draws
        given the actually-realized background level -- computationally
        infeasible at this panel size. CONCLUSION: the Coordinator's
        explanation is CONFIRMED CORRECT and is not an artifact of an
        unrepresentative background sample (the realized background level
        is unremarkable) or of an implementation defect (dual-path control
        is exact; S1-S4 independently reproduce bit-for-bit). It is in fact
        a STRUCTURAL property of this exact configuration (one
        floor-capped, permutation-derived p-value pooled unweighted into a
        k=49 Fisher panel), not merely an unlucky draw -- no realistically
        achievable increase in null-draw count could have flipped this
        specific outcome for a single-cell-injection positive control of
        this type.

