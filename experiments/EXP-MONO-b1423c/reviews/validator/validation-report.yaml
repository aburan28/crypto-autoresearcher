  is_this_the_right_kind_of_positive_control:
    task_item_6_analysis: >-
      NO, and the record's own claim_ceiling already says so correctly --
      this independent review confirms that scoping is both accurate and,
      per RECOMP-7, even more sharply true than stated. This experiment
      establishes exactly one thing: an unweighted Fisher combination of one
      permutation-floor-capped extreme p-value with 48 background p-values
      does not reject at k=49. It establishes NOTHING about H-MONO-663fb4's
      actually-hypothesized regime -- a MILD, DIFFUSE character-bias shift
      spread across MANY curves, where many of the 49 p-values would each be
      modestly (not maximally) shifted away from uniform. Those are
      different statistical regimes: Fisher's method is the classical tool
      of choice specifically for diffuse, many-small-effects signals (its
      textbook comparative weakness is exactly the single-extreme-outlier
      case this experiment tests), so a "sensitivity gap" here is close to
      the LEAST informative case one could have chosen about the scenario
      H-MONO-663fb4 predicts, though it remains a valid, honestly-scoped
      finding about the specific configuration tested. RECOMP-7's floor
      argument sharpens this further: because ANY single-cell-injection
      design of this type is capped by the permutation floor's contribution
      ceiling, no single-outlier positive control built this way (at any
      practically reachable n_null_draws) could ever discharge K5 for the
      Fisher-combined statistic at this panel size -- a DIFFERENT positive
      control (e.g. several curves each carrying a modest, non-extreme
      p-value shift, matching the mild/diffuse hypothesis's own shape) would
      be needed to test the regime that actually matters to H-MONO-663fb4,
      and this record correctly does not claim to have done so.

