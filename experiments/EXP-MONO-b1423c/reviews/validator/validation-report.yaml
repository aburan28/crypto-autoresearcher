  j1_attack_verdict: holds
  finding_summary: >-
    Full bit-for-bit re-execution from a clean scratch copy reproduces every
    reported number exactly. RO3's group structure, the subgroup positive
    control's Var/C-F values, the background panel's exact identity, and
    S1-S4's Fisher-combined values were ALL independently re-derived from
    first principles and/or from-scratch reimplementation -- not merely by
