  metric_recomputations:
    - id: RECOMP-1
      metric: RO3 group structure (independent of groupstate.py)
      method: >-
        Brute-force point count over F_307 for y^2=x^3+269x+6 via Legendre
        symbol, plus an independently-written elliptic-curve group-law
        implementation (add/double/negate) used to enumerate all points and
        sample element orders, written from scratch without reading
        groupstate.py's own algorithm.
      result: >-
        N=288 exactly (independent point count); a randomly sampled point
        of order 96 confirms n2=96, giving n1=N/n2=3 -- matches the
        contract's declared and archived (p=307,A=269,B=6,N=288,n1=3,n2=96)
        exactly, WITHOUT relying on the reused CurveState implementation at
        all.
    - id: RECOMP-2
      metric: Var_real for both known-positive cells (independent of conv.py)
      method: >-
        Applied H-MONO-663fb4's own mechanism step (5) directly: for FB = H
        <= G of order h, Var_R N_m(R) = (N/h - 1) * h^(2m) / N^2 (subgroup
        spectrum, m=4), computed from scratch in Python with no reference to
        conv.py's algorithm.
      result: >-
        h=144: (288/144-1)*144^8/288^2 = 2229025112064.0. h=72:
        (288/72-1)*72^8/288^2 = 26121388032.0. BIT-IDENTICAL to
        raw-result.json's var_real for both cells. C/F = h/h = 1.0 in both
        cases, matching C_over_F_real exactly. This independently confirms
        conv.py's numeric output via an entirely separate closed-form
        derivation and implementation, not merely a source diff.
    - id: RECOMP-3
      metric: Archived comparison values for RO3's subgroup arms
      method: Read EXP-MONO-c819ba/execution_report.yaml's L4_positive_control_1_subgroup block directly.
      result: >-
