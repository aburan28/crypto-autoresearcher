# =============================================================================
# EXP-BINSTD-e066d8 -- VERSION 1 (APPROVED by DEC-20261002-6dd4c6) frozen
# contract for H-BINSTD-555991: U-REACH GTTD double-large-prime oracle-class
# pricing (claims A–D) with Stage-0 blind re-derivation + Stage-1 toy j=2
# graph census.
#
# Source: IDEA-20261001-621974 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Consolidates IDEA-20260926-1db0e8 (HOLD-X12) and IDEA-20261001-5628bc
# (convention-audit arm). Supersedes IDEA-20260922-c2bbe6 (not edited).
#
# ZERO RUNS in this design packet. Stages 0-1 authorized for executor
# TASK-20261002-4a4e11. No AUXIN. Amazon Bedrock prohibited.
# NO break. NO attack. NO exponent. Column pricing / composition only.
# =============================================================================
experiment:
  id: EXP-BINSTD-e066d8
  hypothesis_id: H-BINSTD-555991
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-621974
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    U-REACH: Stage-0 blind re-derivation of GTTD j=2 budget table (j=0
    fixture first) plus Stage-1 toy j=2 large-prime graph census with
    replica and G(n,M) controls
  status: approved
  approved_by: DEC-20261002-6dd4c6
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-6dd4c6
    composing_decision: DEC-20261002-6dd4c6
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 is zero-compute (or tiny fixture-cell) blind re-derivation of
      claims A–C with j=0 fixture first, m=5 proves-too-much, general-bound
      check, and 5628bc convention audit. Stage 1 is solver-free exhaustive
      toy j=2 graph census. No oracle-cost measurement. No Magma/Sage. No
      AUXIN. No Bedrock. No ECC2K-130 decomposition solve.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Freeze and independently re-derive the U-REACH claim-(A–D) table with
    the j=0 fixture blocking any j=2 reading; validate H-621974-1..3 at toy
    scale on RC-1 and Koblitz n=19 against replica and finite-size G(n,M);
    deliver exactly one O-* label from H-BINSTD-555991 — recording the
    large-prime column as CLOSED in the enumeration class and as a BUDGET
    ROW (or E1-general / mixed / artifact) in the product-law convention.

  class: measurement
  class_note: >-
    Composition / column-pricing experiment with a Stage-0 arithmetic
    certificate and a Stage-1 heuristic-validation census. Carries
    H-621974-1..3. Not an exponent-moving breakthrough experiment; no
    ECDLP attack table produced; no oracle cost claimed.

  scope:
    included:
      - >-
        Stage 0 (ZERO COMPUTE beyond a small Python fixture cell). Write
        stage0/preregistered-predictions.json and stage0/blind-rederivation.md
        freezing: claim-(C) table at m in {3,4}, theta in {1/2,1}, w in
        {m,32m}, both ambients; j=0 fixture targets D3=11.010251,
        plain_m3=-15.55, 1db0e8_line=123.97; T_1 gaps 1.17/4.69/5.19;
        m=5 infeasibility; s*=0.672; free-oracle floors 53.84/45.92 as
        D1-type only; 5628bc convention-audit notes (N=4r vs N=r);
        tripwire note on m=3 free-oracle floor scoping aa2efc; check that
        no general algebraic-oracle bound by the small-tuple loop is
        exhibited. j=0 fixture MUST pass to 0.01 bit before any j=2 value
        is written into RESULTS.
      - >-
        Stage 1. Exhaustive (P_1,Q_1) enumeration of j=2 partials at m=3 on
        RC-1 and Koblitz n=19; build uncanonicalised large-prime graph;
        measure cycle yield, cycle weight, partial yield vs finite-size
        G(n,M) and Z/(4r) replica; certificate re-summation; truncated-key
        control; write stage1/*.json.
      - >-
        RESULTS.md with exactly one O-* label from H-BINSTD-555991
        distinguishable_outcomes; memory (graph vertices, matrix size B)
        stated beside every time figure.
    excluded:
      - Magma/Sage/cypari2/AUXIN provisioning as the success path.
      - Amazon Bedrock.
      - Editing IDEA-20261001-621974 claim text (or superseded c2bbe6).
      - Editing shared GOAL-ECDLP2M-001.yaml.
      - Claiming break / exponent / ECC2K-130 attack from this contract.
      - Claiming that any oracle meets a budget (budget ≠ cost).
      - Measuring SAT/Groebner/algebraic oracle cost (oracle-side is next_gate).
      - Treating infra failure as mathematical evidence against claims A–D.
      - Running any ECC2K-130 / deployed-scale decomposition cell.
      - Overwriting experiments/EXP-CERTBIN-e94b27/impl/ in place without a
        documented copy/wrapper under this experiment's write_scope.
      - Designing or executing the m=3 two-large-block oracle measurement
        under this card.

  inputs:
    proposal: ledger/proposals/IDEA-20261001-621974.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-555991.yaml
    question: ledger/questions/RQ-BINSTD-b6f698.yaml
    hold_decision: ledger/decisions/DEC-20260928-63addc.yaml
    ureach_ranking: ledger/decisions/DEC-20260929-7257b2.yaml
    dominated_by_input: ledger/proposals/IDEA-20260926-1db0e8.yaml
    convention_audit_arm: ledger/proposals/IDEA-20261001-5628bc.yaml
    superseded_record: ledger/proposals/IDEA-20260922-c2bbe6.yaml
    product_law_finding: knowledge/findings/KN-FIND-aa2efc.md
    d3_pin: ledger/corrections/CORR-20260928-4cb669.yaml
    rho_convention: ledger/corrections/CORR-20260922-81aeab.yaml
    per_orbit_conditional: ledger/corrections/CORR-20260925-649e25.yaml
    gttd_lit: knowledge/literature/KN-LIT-164.md
    field_instrument: experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
    curve_instrument: experiments/EXP-CERTBIN-e94b27/impl/curve.py
    analysis_readme: analysis/binstd-idea-review-20260926/README.md

  controls:
    - name: j0_fixture_blocking
      description: >-
        Stage 0 must reproduce D3=11.0103 (±0.01 bit), plain m=3 budget
        -15.55 (±0.01), and 1db0e8 line 123.97 (±0.01) BEFORE any j=2
        budget value is read into RESULTS. Failure → O-FIXTURE-FAIL.
    - name: proves_too_much_m5
      description: >-
        Same Stage-0 argument at m=5 must return infeasibility (B'>B
        constraint violated at unconstrained optimum), not a gain.
    - name: convention_audit_5628bc
      description: >-
        Stage 0 records ambient N=4r vs N=r (±1 bit on 2LP budgets, ±2 on
        plain) and cofactor-as-size-parameter notes beside the table.
    - name: relabelled_Z_4r_replica
      description: >-
        BLOCKING Stage 1: random nested subsets of matched sizes over
        Z/(4r); graph statistics must coincide with the curve's within
        [0.5,2], else O-ARTIFACT / structure report.
    - name: finite_size_G_n_M
      description: >-
        Compare cyclomatic number against 1000 finite-size G(n,M)
        simulations at the same (vertices, edges), not only the asymptotic
        0.162 n formula.
    - name: certificate_resummation
      description: >-
        Every cycle relation re-sums to O on a freshly built curve object
        (zero tolerance; docs/claims-and-verification.md).
    - name: truncated_key_adversarial
      description: >-
        Truncated-key canonicalisation must produce measurable failure
        rate >0; else certificate check has no power (O-ARTIFACT).
    - name: ordinary_vs_koblitz
      description: >-
        RC-1 (ordinary) against Koblitz n=19; a difference is reported as
        structure, not as a gain.
    - name: memory_beside_time
      description: >-
        Graph vertex count B' and matrix size B stated beside every time
        / budget figure in RESULTS.md.

  independent_variables:
    - name: stage
      levels: [0_freeze_rederive, 1_toy_graph_census]
    - name: m_budget
      levels: [3, 4]
    - name: theta
      levels: [0.5, 1.0]
    - name: w_factor
      levels: [1, 32]
    - name: ambient
      levels: [N_eq_4r, N_eq_r]
    - name: field_degree_n
      levels: [17_RC1, 19_koblitz]
    - name: large_window_dprime
      levels: [grid_per_n]
    - name: edges_over_vertices
      levels: [0.6, 0.75, 1.0, 1.5]
    - name: arm
      levels: [curve, Z_4r_replica]

  metrics:
    primary:
      - name: stage0_max_abs_discrepancy_bits
        unit: bits
        definition: >-
          Max |rederived - claimed| over claim-(C) table entries and
          claim-(A/B) fixtures after convention matching.
      - name: j0_fixture_pass
        unit: boolean
        definition: >-
          Whether D3, plain m=3, and 1db0e8 line each agree within 0.01 bit.
      - name: cyclomatic_ratio_vs_G_n_M
        unit: ratio
        definition: Measured cyclomatic number / finite-size G(n,M) mean at each (cell,d',r/V',arm).
      - name: mean_cycle_relation_weight
        unit: count
        definition: Mean weight of fundamental-cycle relations at r=V'.
    secondary:
      - name: partials_per_target_over_p2
        unit: ratio
        definition: Empirical mean partials per target divided by predicted p_2.
      - name: large_prime_occupancy_chi2_pvalue
        unit: probability
        definition: Chi-squared p-value of large-prime occupancy vs Poisson(r/V').
      - name: certificate_pass_rate
        unit: fraction
        definition: Fraction of cycle relations that re-sum to O under correct canonicalisation.
      - name: truncated_key_failure_rate
        unit: fraction
        definition: Failure rate under truncated-key adversarial canonicalisation.
      - name: peak_rss_bytes
        unit: bytes
        definition: Peak RSS of Stage-1 processes (memory honesty).
      - name: wall_clock_seconds
        unit: seconds
        definition: Measured wall clock (reported; not a pre-committed claim).
      - name: graph_vertices
        unit: count
        definition: >-
          Cardinality of V' (and replica size) — memory column beside time.
      - name: general_algebraic_bound_found
        unit: boolean
        definition: Whether Stage 0 exhibited a general small-tuple-loop lower bound on every algebraic 2LP oracle.

  heuristic_under_test: H-621974-1; H-621974-2; H-621974-3

  preregistered_prediction:
    quantity: >-
      Stage-0 claim-(A–C) table and j=0 fixtures; Stage-1 cycle
      yield/weight/partial yield bands; no direction on whether any live
      solver meets s* (out of scope).
    formula: >-
      D3(4)=11.010251 (pinned); plain_m3≈-15.55; 1db0e8_line≈123.97;
      D3_2LP(3)=8.71, D3_2LP(4)=22.34 at theta=1,w=m;
      sensitivity bands 7.46–9.71 (m=3) and 19.84–23.34 (m=4);
      s*=0.672 bit/unknown at m=4;
      Stage-1 cyclomatic and curve/replica ratios in [0.5,2];
      mean weight ≤32m; partials/p2 in [0.5,2] after parity factor;
      certificate_pass_rate=1.0; truncated_key_failure_rate>0;
      m=5 infeasible; general_algebraic_bound_found expected false
      (if true → O-E1-GENERAL-BOUND).
    source: >-
      ledger/proposals/IDEA-20261001-621974.yaml claims A–D + predictions;
      DEC-20260929-7257b2 U-REACH; frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy_plus_arithmetic
    justification: >-
      Stage 0 is ECC2K-130-parameter arithmetic (no curve run). Stage 1 is
      toy n in {17,19} validating graph heuristics that move the budget by
      log2 of measured constants. No crypto-scale solve.
    correspondence: >-
      Transfer of theta/w ratios to V'=2^37.89–2^51.77 is stated as a
      heuristic (H-621974-2/3 validation plans). Enumeration-class closure
      (A,B) is arithmetic and transfers without scale. Budget column (C)
      is a requirement at deployed parameters, not a measured cost.

  sample_size_justification: >-
    Stage 0 is exhaustive over the frozen (m,theta,w,ambient) table — not
    a sample. Stage 1: ≥64 seeds per (cell,d') and 1000 G(n,M) sims so the
    [0.5,2] cyclomatic band is resolvable against finite-size noise at
    V'≤2^10; expected partials per target at mid d' are ≫1 by the p_2
    formula (about 2^(2d'-14) on RC-1).

  tail_checks:
    - >-
      Any Stage-0 entry >0.05 bit off after convention matching →
      O-ARITHMETIC; do not read j=2 budgets.
    - >-
      j=0 fixture miss → O-FIXTURE-FAIL; stop before Stage 1 RESULTS reading.
    - >-
      Certificate failure or truncated-key zero-failure → O-ARTIFACT.
    - >-
      Mean weight >32m → O-MIXED-W; recompute budget with measured w before
      any E2 reading.

  replication:
    seeds: [2026100262]
    seed_base_note: >-
      Per-cell seeds 0..63 derived from seed_base; replica uses the same
      indices with an independent stream; G(n,M) sims use seed_base+offset.
    independent_instances: 2
    note: >-
      Scientific sample is the Stage-0 table (deterministic) plus Stage-1
      graph census across two cells × three d' × four r/V' ratios × two
      arms. Not expandable by leftover wall clock into an oracle-cost cell
      or ECC2K-130 attack under this card.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 2.0
    maximum_memory_gb: 4
    maximum_runs: 4
    maximum_workers: 1
    note: >-
      Advisory only (docs/research-budget-policy.md). Scientific requirement
      is complete Stage-0 freeze+rederivation and Stage-1 census with
      controls — not expandable into oracle-cost measurement or deployed-
      scale decomposition under this card.

  stopping_rules:
    - >-
      SR-1. Stage 0 freeze + j=0 fixture pass before any Stage-1 RESULTS
      reading of j=2 budgets.
    - >-
      SR-2. If Stage 0 arithmetic / fixture fails → O-ARITHMETIC /
      O-FIXTURE-FAIL; do not claim O-E2-BUDGET-ROW.
    - >-
      SR-3. If m=5 returns a gain → O-PROVES-TOO-MUCH; stop promotion of
      claim (C).
    - >-
      SR-4. If Stage 1 certificate or truncated-key control fails →
      O-ARTIFACT; void the arm.
    - >-
      SR-5. If replica and curve share the same out-of-band deviation →
      O-ARTIFACT (model/instrument), not a curve structure reading.
    - >-
      SR-6. Advisory budget exhausted → O-IMPEDIMENT; never negative evidence.
    - >-
      SR-7. Do not escalate any budget figure into an oracle-cost claim or
      ECDLP attack under this card.
    - >-
      SR-8. Do not open the oracle-side measurement (1db0e8 (D) extension /
      HOLD-X1 ladder) under this card.

  invalidation_rules:
    - Editing stage0/preregistered-predictions.json after Stage-0 freeze.
    - Reading or promoting j=2 budgets before j=0 fixture pass.
    - Claiming any oracle meets a budget, or that IC beats rho, from this contract.
    - Provisioning Magma/Sage/cypari2/AUXIN as the success path.
    - Using Amazon Bedrock.
    - Editing IDEA-20261001-621974 / IDEA-20260922-c2bbe6 claim text or shared GOAL-ECDLP2M-001.yaml.
    - Overwriting a prior RUN-* directory.
    - Claiming break / exponent / ECC2K-130 attack from this contract.
    - Treating O-IMPEDIMENT or infra failure as mathematical evidence against claims A–D.
    - Mixing per-orbit (kappa=262) and unconditional readings without labelling.

  success_criterion: >-
    ALL of: (1) Stage-0 freeze present with j=0 fixture pass to 0.01 bit;
    (2) Stage-0 claim-(A–C) table re-derived within 0.05 bit OR a named
    O-ARITHMETIC / O-FIXTURE-FAIL / O-E1-GENERAL-BOUND / O-PROVES-TOO-MUCH
    stop; (3) Stage-1 delivers cyclomatic/weight/partial metrics with
    replica + G(n,M) + certificate controls OR a named O-ARTIFACT /
    O-IMPEDIMENT stop; (4) RESULTS.md names exactly one O-* label;
    (5) memory stated beside time; (6) no invalidation_rule fired. This
    delivers the U-REACH large-prime column reading; it does NOT claim any
    curve is broken and does NOT itself promote a KN-FIND.

  falsification_criterion: >-
    ANY of: (F1) j=0 fixture miss with a claimed O-E2 (O-FIXTURE-FAIL);
    (F2) Stage-0 discrepancy >0.05 bit with a claimed O-E2 (O-ARITHMETIC);
    (F3) m=5 gain with a claimed rebalancing success (O-PROVES-TOO-MUCH);
    (F4) certificate / truncated-key defect with a claimed E2
    (O-ARTIFACT); (F5) Magma/Sage/AUXIN/Bedrock used as success path;
    (F6) claiming an oracle meets a budget. Budget exhaustion is
    O-IMPEDIMENT, not falsification of H-621974-* or of claims A–D.

  required_artifacts:
    - experiments/EXP-BINSTD-e066d8/implementation/
    - experiments/EXP-BINSTD-e066d8/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-e066d8/stage0/blind-rederivation.md
    - experiments/EXP-BINSTD-e066d8/stage0/convention-audit-5628bc.md
    - experiments/EXP-BINSTD-e066d8/stage1/graph-census.json
    - experiments/EXP-BINSTD-e066d8/stage1/controls.json
    - experiments/EXP-BINSTD-e066d8/runs/
    - experiments/EXP-BINSTD-e066d8/RESULTS.md

  procedure:
    stages:
      - id: S0-FREEZE
        text: >-
          Write preregistered-predictions.json; implement the blind
          re-derivation fixture cell; run j=0 fixtures first; write
          blind-rederivation.md and convention-audit-5628bc.md; ZERO Stage-1
          graph runs before freeze.
      - id: S1-CENSUS
        text: >-
          Implement exhaustive j=2 enumerator + union-find + cycle extract
          + certificate + replica + G(n,M) simulator; run RC-1 and n=19
          grids; write stage1/graph-census.json and controls.json.
      - id: S-SUM
        text: >-
          Write RESULTS.md with exactly one O-* label; preserve raw
          manifests under runs/; cite RUN IDs; no ledger status edits;
          do not open oracle-side next_gate work under this card.

  assigned_to: executor
  executor_handoff: TASK-20261002-4a4e11
  snapshot_task: TASK-20261002-db7663

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
