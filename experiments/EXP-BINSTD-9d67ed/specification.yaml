  objective: >-
    Decide whether median residual nonlinear clause density after Karabina
    auxiliary symmetrisation stays ≤ α=3 on Stage-1 n=17 cells under twin
    agreement; deliver exactly one O-* label from H-BINSTD-d460e5.

  class: heuristic_validation
  class_note: >-
    Pre-registered residual-density band on an encoding-residue instrument.
    Not an exponent-moving breakthrough; no ECDLP attack table.

  scope:
    included:
      - >-
        Stage 0. Freeze α=3, pin, seeds, Karabina transform definition,
        moduli/V as LIST rows with integer n and ell (never n-as-JSON-key);
        twin probe on (17,3).
      - >-
        Stage 1. For (n,ℓ)∈{(17,3),(17,4)} measure ≥20 xR targets treated
        vs unsymmetrised null; twin C_nl/N_var; write panels/control-table/
        RESULTS.md with exactly one O-* label.
    excluded:
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Stage-2 n=19,23 panels under this card.
      - Editing IDEA claim text or GOAL-ECDLP2M-001.yaml.
      - Editing α after Stage-0 freeze.
      - Treating infra failure as mathematical evidence.
      - Solver bake-off vs XOR-SAT (IDEA-20261001-5c936b).
      - Using a missing Magma SAT detector as the residue meter.

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-9d67ed/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-9d67ed/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-9d67ed/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-9d67ed/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-9d67ed/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. Dual meters are the
      dual-implementation control. {run_dir} substituted by supervisor.
      trial-plan.json is byte-identical to trial-plan-v1.json.

  inputs:
    source_idea: ledger/proposals/IDEA-20261002-92aa34.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-d460e5.yaml
    alpha: 3
    n_targets: 20
    target_seed: 2026100302
    pin_seed: 2026100301
    stage1_cells:
      - {n: 17, ell: 3}
      - {n: 17, ell: 4}

  controls:
    - name: twin_Cnl_Nvar
      definition: >-
        encode_residue path A (packed masks) equals path B (frozenset
        monomials) on C_nl and N_var for treated and null on every target.
    - name: ctl_frozen_alpha
      definition: α=3 frozen in stage0/preregistered-predictions.json.
    - name: ctl_shared_encoder_pin
      definition: V=poly_basis(ell); moduli listed as integer-n rows.
    - name: null_unsymmetrised_encode
      definition: Same pin without Karabina auxiliaries; α not claimed on null.
    - name: ctl_no_posthoc_alpha_edit
      definition: check.py refuses pred.alpha != 3.
    - name: ctl_int_n_fields
      definition: >-
        Freeze JSON uses lists of {n: int, ell: int} objects; never
        stringified n object-keys (EXP-BINSTD-4c6404 failure mode).
    - name: ctl_no_magma_sat
      definition: Residue meter is in-Python clause/variable counts only.
    - name: ctl_no_solver_bakeoff
      definition: No wall-time comparison to XOR-SAT/Crossbred.
    - name: ctl_no_midtick_lib_provision
      definition: Do not provision Magma/Sage/AUXIN.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_n17_density]
    - name: cell
      levels: ['(17,3)', '(17,4)']
    - name: encode
      levels: [karabina_aux_treated, unsymmetrised_null]

  metrics:
    primary:
      - name: median_treated_Cnl_over_Nvar
        unit: dimensionless
        definition: Median C_nl/N_var after Karabina auxiliaries across ≥20 xR.
      - name: completed_target_count
        unit: integer
        definition: Number of targets with finite density under twin agreement.
      - name: twin_agreement
        unit: boolean
        definition: Path A equals path B on C_nl and N_var.
    secondary:
      - name: median_null_Cnl_over_Nvar
        unit: dimensionless
      - name: null_ge_treated
        unit: boolean
      - name: wall_clock_seconds
        unit: seconds
      - name: peak_rss_bytes
        unit: bytes

  heuristic_under_test: HEUR-BINSTD-92aa34-H1

  preregistered_prediction:
    quantity: >-
      Median C_nl/N_var after Karabina auxiliary symmetrisation ≤ 3 on each
      Stage-1 cell, with ≥20 targets and twin agreement.
    formula: >-
      C_nl = #{Weil-bit equations retaining a deg≥2 monomial after deleting
      monomials supported only on pure-linear F2 pivots};
      N_var = |nonlinear_support \ pivots|; density = C_nl/N_var
      (0 if both 0; artifact if C_nl>0 and N_var=0).
    source: >-
      IDEA-20261002-92aa34 / HEUR-BINSTD-92aa34-H1; α=3 frozen before
      Stage 1 in stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Encoding-residue instrument on n=17 only under this card. No transfer
      of an α band into an n≥131 attack is claimed.
    correspondence: null

  tail_checks:
    - Twin disagreement voids density claims (O-ARTIFACT).
    - Fewer than 20 completed targets → O-INCONCLUSIVE.
    - Stringified n JSON keys → check.py FAIL (protocol invalid).
    - Magma SAT detector used as C_nl → protocol invalid.

  seeds_and_replication:
    target_seed: 2026100302
    pin_seed: 2026100301
    independent_instances: 2
    n_targets: 20
    note: >-
      Cells (17,3) and (17,4) are independent instances. Twin meters are the
      replication instrument for each target.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json, encoder-pin.json, v-catalog.json.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-BINSTD-d460e5.
    - maximum_runs = 4.
    - Do not open Stage-2 under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin failure → O-ARTIFACT; do not read density as support.
    - Band outcome without ≥20 targets → protocol invalid.
    - JSON freeze dict-keyed by string n → protocol invalid.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an n≥131 exponent move → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with twin_ok true on the probe; Stage 1
    produces ≥20-target medians (or a named O-ARTIFACT/O-IMPEDIMENT/
    O-INCONCLUSIVE stop); RESULTS.md names exactly one O-* label from
    H-BINSTD-d460e5 with cited artifacts.

  falsification_criterion: >-
    Any of: twin disagreement; post-hoc α edit; band verdict without ≥20
    targets; Magma SAT detector as C_nl; stringified n keys; a claimed
    break/exponent under this card. (O-FAIL-BAND is a valid scientific
    negative of O-SUPPORT, not a protocol fail.)

  required_artifacts:
    - experiments/EXP-BINSTD-9d67ed/trial-plan-v1.json
    - experiments/EXP-BINSTD-9d67ed/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-9d67ed/stage0/encoder-pin.json
    - experiments/EXP-BINSTD-9d67ed/stage0/v-catalog.json
    - experiments/EXP-BINSTD-9d67ed/stage1/
