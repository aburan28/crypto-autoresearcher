review_report:
  id: REVIEW-BINSTD-9d67ed-20261004-report
  plan: experiments/EXP-BINSTD-9d67ed/review/review-plan.yaml
  addendum: experiments/EXP-BINSTD-9d67ed/review/addendum-pd1.yaml
  task_id: TASK-20261004-b86fea
  experiment_id: EXP-BINSTD-9d67ed
  hypothesis_id: H-BINSTD-d460e5
  prior_overturned: false
  joints:
    J1:
      verdict: holds
      finding: >-
        Two runs. RUN-BINSTD-c87287 is O-STAGE0-OK. RUN-BINSTD-4c79f8 is
        O-SUPPORT. RESULTS.md outcome is O-SUPPORT, matching the Stage 1
        raw file. Both receipts are output_validated, returncode 0,
        check_returncode 0, checker stdout OK. Both manifests are
        completed_valid, code.dirty false, certificate.kind none.
        claims.break and claims.exponent_move are false on both.
        claims.n_ge_131 is absent from both run manifests and both
        raw-result claim objects. It is present only on
        stage0/preregistered-predictions.json, where it is false.
        certificate.kind none is the expected marker for a card that
        claims no discrete-log solve.
    J2:
      verdict: holds
      finding: >-
        decide_outcome order: artifact or twin_ok false returns
        O-ARTIFACT; completed_target_count below 20 returns
        O-INCONCLUSIVE; band_holds false returns O-FAIL-BAND;
        null_ge_treated false returns O-FAIL-NULL; the remaining
        conjunction returns O-SUPPORT. A zero-N_var leftover
        (N_var=0 with C_nl>0) sets the meter artifact flag and clears
        twin_ok, so that leftover is O-ARTIFACT. band_holds is
        median_treated <= 3 after the count gate, so treated median > 3
        is O-FAIL-BAND. null median < treated is O-FAIL-NULL.
        Archived completed counts are 20 and 20. band_holds is not
        read before the artifact and count gates. check.py refuses
        O-SUPPORT, O-FAIL-BAND, and O-FAIL-NULL when the count is
        below 20 or twin_ok is false.
    J3:
      verdict: holds
      finding: >-
        Blind medians from stage1/panels.json rows, before
        implementation/ was opened. (17,3): median treated 5/3 =
        1.6666666666666667, median null 17/6 = 2.8333333333333335.
        (17,4): median treated 7/4 = 1.75, median null 17/8 = 2.125.
        Every row density equals C_nl/N_var. Both treated medians are
        <= 3. Both null medians are >= the treated median. Headers
        match. Temp copy /tmp/review-binstd-9d67ed, with that copy's
        stage1 json and RESULTS.md removed, reran --stage 1 into
        /tmp/review-binstd-9d67ed-stage1. Outcome O-SUPPORT. Treated
        medians 1.6666666666666667 and 1.75. Archived repo stage files
        were not overwritten.
  proves_too_much:
    verdict: holds
    entailed: false
    objects:
      - >-
        "O-SUPPORT is an ECDLP solve or an exponent improvement" is
        not entailed. certificate.kind is none. claims.break and
        claims.exponent_move are false. The label is the density-band
        conjunction on the toy encode.
      - >-
        "the null is inside the alpha band" is not entailed. Alpha 3
        is claimed on the treated encode only. The null gate is null
        median >= treated median. The null medians 17/6 and 17/8 are
        larger than the treated medians. They are the comparison, not
        an alpha-band pass.
      - >-
        "this package calibrates n=19, n=23, or ECC2K-130" is not
        entailed. Stage 1 cells are (17,3) and (17,4). Stage 2 is not
        authorized. certificate.kind is none. No discrete logarithm
        is solved.
    failure_signature_observed: false
  blind_rederivation:
    quantity: >-
      Median of the 20 treated_density values and the 20 null_density
      values on each Stage-1 cell, whether each treated median is <= 3,
      and whether each null median is >= the treated median. Also
      whether each row density equals C_nl/N_var.
    computed_before_implementation_read: true
    cells:
      - cell_id: n17_l3
        n: 17
        ell: 3
        median_treated: 1.6666666666666667
        median_treated_exact: '5/3'
        median_null: 2.8333333333333335
        median_null_exact: '17/6'
        treated_le_3: true
        null_ge_treated: true
        density_equals_C_nl_over_N_var: true
      - cell_id: n17_l4
        n: 17
        ell: 4
        median_treated: 1.75
        median_treated_exact: '7/4'
        median_null: 2.125
        median_null_exact: '17/8'
        treated_le_3: true
        null_ge_treated: true
        density_equals_C_nl_over_N_var: true
  procedure_deviations:
    - id: PD-1
      source: experiments/EXP-BINSTD-9d67ed/review/addendum-pd1.yaml
      statement: >-
        PD-1: one coordinator task owns J1, J2, and J3. No separate
        validator session and no red-team session were run. The
        addendum records that concentration. It does not reassign an
        owner or narrow proves-too-much.
  post_median_label_order_reads:
    note: >-
      Medians were recomputed from stage1/panels.json rows before these
      files were opened. They are listed here, not in sources_read,
      because blind_from is the implementation directory. The median
      quantity did not use them.
    paths:
      - experiments/EXP-BINSTD-9d67ed/implementation/run.py
      - experiments/EXP-BINSTD-9d67ed/implementation/check.py
      - experiments/EXP-BINSTD-9d67ed/implementation/encode_residue.py

