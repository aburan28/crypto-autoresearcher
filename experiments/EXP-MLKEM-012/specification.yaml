experiment:
  id: EXP-MLKEM-012
  hypothesis_id: H-MLKEM-012
  goal_id: GOAL-MLKEM-003
  version: 1
  title: Conditional Carrier CC cost sensitivity to Pwrong underestimation (HEUR-S1/S2)
  status: approved
  frozen: true
  approved_by: coordinator
  approved_at: '2026-07-31'
  claim_tier: medium
  objective: Given Table C.2 / pickle CC intermediates, compute how Algorithm 3.1
    total cost and NIST margins move if log2(Pwrong) is underestimated by Δ bits and
    the R·(N·Tdec+TFFT) term (Case A) or the full total (Case B) pays +Δ. Anchor Δ
    to the KN-FIND-012 floor gap only as an upper reference.
  heuristic_under_test: HEUR-S1
  metrics:
    primary:
    - min_Delta_CaseA_to_meet_nist
    - margin_nist_minus_A
  scale_relevance:
    tier: medium
    justification: Conditional cost table at Kyber parameters; not a measurement of
      true Pwrong.
  success_criterion: NIST-crossover Δ under Case A is reported for all three Kyber
    sets with explicit heuristics HEUR-S1/S2.
  falsification_criterion: Case A crossover Δ exceeds 84 bits for all sets (would
    contradict brittleness relative to KN-FIND-012 floor gap).
  required_artifacts:
  - experiments/EXP-MLKEM-012/runs/RUN-MLKEM-012-001/results.json
  - experiments/EXP-MLKEM-012/runs/RUN-MLKEM-012-001/cost_sensitivity.json
  budget:
    wall_clock_seconds_per_run: 600
    maximum_runs: 2
