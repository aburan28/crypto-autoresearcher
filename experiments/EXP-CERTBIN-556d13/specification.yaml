# EXP-CERTBIN-556d13
# Above-cap window exponents. No solver.
# Approved by DEC-20261002-944cb5.
experiment:
  id: EXP-CERTBIN-556d13
  hypothesis_id: H-CERTBIN-3e547f
  source_idea: IDEA-20260926-3c6a19
  question_id: RQ-CERTBIN-836ce2
  version: 1
  title: Above-cap window exponents
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-944cb5
  objective: >-
    Bracket the four linear-algebra ceiling exponents. Show the m = 4
    cap sits strictly above its ceiling. Bracket the B = 2^29 cell.
    Reject a nonempty window at m = 4 and a mu exponent of at least 7.1.
  inputs:
    rho_hundredths: 6081
    ceilings:
      - {m: 4, numerator: 5881, denominator: 200, above_hundredths: 2940, below_hundredths: 2941}
      - {m: 8, numerator: 5781, denominator: 200, above_hundredths: 2890, below_hundredths: 2891}
    brackets:
      m5_above_2924: true
      m5_below_2925: true
      m6_above_2911: true
      m6_below_2912: true
      cap4_above_3389: true
      cap4_below_3390: true
      window_m4_empty: true
    cell_m5_b29:
      la_above_6032: true
      la_below_6033: true
      mu_below_71: true
      calls_above_219: true
    neutral:
      m5_num: 4
      m5_den: 5
      m6_above_833_per_1000: true
      m6_below_834_per_1000: true
      mitm_m5_num: 3
      mitm_m5_den: 5
      mitm_m6_num: 1
      mitm_m6_den: 2
    enumeration_b_exponent: 0
  controls:
    - >-
      A nonempty window at m = 4 is false. The cap exponent is
      strictly above 33.89 and the ceiling exponent is strictly
      below 29.41. Reporting a window invalidates the run.
    - >-
      The m = 4 ceiling exponent equal to 29.40 is false. It is
      strictly larger. Reporting equality invalidates the run.
    - >-
      A mu exponent of at least 7.1 at m = 5 and B = 2^29 is false.
      Reporting that invalidates the run.
    - >-
      5/6 equal to 833/1000 is false. 5000 is strictly above 4998.
      Reporting equality invalidates the run.
    - Two integer routes. They must not import each other.
  independent_variables:
    - arity
    - route in {cross_multiply, repeat_module}
  metrics:
    primary:
      - ceiling_brackets
      - window_m4_empty
      - mu_below_71
      - equality_2940_rejected
      - implementations_agree
    secondary:
      - neutral_bits
      - enumeration_exponent
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Four ceiling brackets and one empty window.
    formula: >-
      For m a power of two the ceiling exponent is
      (6081/100 - log2(m))/2, an exact rational. For m = 5 it
      lies above 29.24 when 5^100 is below 2^233, and below 29.25
      when 5^100 is above 2^231. For m = 6 it lies above 29.11
      when 6^100 is below 2^259, and below 29.12 when 6^100 is
      above 2^257. The m = 4 cap lies above 33.89 when 24^100 is
      above 2^456, and below 33.90 when 24^5 is below 2^23. At
      B = 2^29 the mu exponent lies below 7.1 when 120^10 is
      above 2^69, and the calls exponent lies above 21.9 by the
      same comparison. Compare by cross-multiplication.
    source: >-
      IDEA-20260926-3c6a19 names the ceilings 29.40, 29.24, 29.11
      and 28.9, the cap 33.9, and the cell figures 60.32, 7.1 and
      21.9, read 2026-10-02. The brackets were recomputed in this
      design session. That computation is not a run. The written
      29.40 and 7.1 sit on the wrong side of the exact values.
      No solver was run.
  scale_relevance:
    tier: toy
    justification: Exponent brackets. No transfer to an elasticity.
    correspondence: null
  tail_checks:
    - The m = 8 ceiling is required. Stopping after m = 6 and still reporting the m = 8 bracket is invalid.
  replication:
    seeds: []
    independent_instances: 4
    replication_note: Deterministic. The second run is the other integer route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If a nonempty window at m = 4 is reported, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - A nonempty window at m = 4 is reported.
    - The m = 4 ceiling exponent is reported equal to 29.40.
    - The mu exponent at the m = 5 cell is reported at least 7.1.
    - 5/6 is reported equal to 833/1000.
    - An elasticity or a solver cost is reported.
  success_criterion: >-
    Both runs agree on the two exact ceiling rationals, the four
    strict brackets, the empty m = 4 window, the three cell bits,
    the neutral comparisons, and the enumeration exponent 0. The
    m = 4 ceiling stays strictly above 29.40. The mu exponent stays
    strictly below 7.1.
  falsification_criterion: >-
    The runs agree, the m = 4 window stays empty, the mu exponent
    stays below 7.1, and any bracket differs from the preregistered
    table.
  required_artifacts:
    - experiments/EXP-CERTBIN-556d13/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CERTBIN-556d13/runs/<RUN-ID>/command.txt
    - experiments/EXP-CERTBIN-556d13/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CERTBIN-556d13/runs/<RUN-ID>/stderr.log
    - experiments/EXP-CERTBIN-556d13/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CERTBIN-556d13/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any solver run, elasticity fit, or relation count.
    - A claim that the above-cap window pays or does not pay.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
