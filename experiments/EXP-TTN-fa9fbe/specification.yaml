experiment:
  id: EXP-TTN-fa9fbe
  hypothesis_id: H-TTN-806b84
  derived_from_idea: IDEA-20260807-049ed4
  question_id: RQ-TTN-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Cost-model measurement - field operations and peak memory to construct and
    evaluate Semaev S_m through the exact chi(m)-term rank-1 factorization versus
    the dense composed resultant, at m in 3 to 6 and three prime sizes, with a
    random same-rank tensor null, an m equal to 3 forced-value gate and a
    coefficient-level exactness gate

  objective: >-
    The one uncertainty a run reduces - whether the dramatically low bond ranks
    measured in EV-TTN-001 and the constructive 45-term decomposition certified in
    EV-TTN-002 are a CONSTRUCTION-COST lever for S_m or only an exact structural
    curiosity, a question that was never asked because H-TTN-001 was gated on
    recall under truncation instead. A run establishes (i) the field-operation
    count and peak memory to construct and to evaluate S_m by each route, per m
    and per prime size, with measured and modeled numbers kept in separate
    columns; (ii) whether a random tensor of the same shape and the same nominal
    rank chi(m) shows the same saving, which is what separates Semaev structure
    from generic low-rank bookkeeping; (iii) whether the factored S_m agrees with
    the dense S_m coefficient for coefficient wherever the dense one is
    computable; and (iv) the cost of the solver interface, since a construction
    win can be erased there entirely. Censored dense cells are recorded as
    infrastructure and never as a win for the factored route. No attack, break,
    speedup or security consequence is claimed here or would follow from a run,
    and no ECDLP exponent statement is licensed by any outcome.

  what_this_is_not:
  - >-
    Not an attack, a key recovery, a relation-search result or an ECDLP exponent
    claim. Pollard rho at exponent 1/2 dominates the underlying problem
    regardless and this contract adds no row to that frontier.
  - >-
    Not a Groebner solving-degree or first-fall-degree result. The parent proposal
    declares those families off-limits as the primary lens and this contract
    honours that.
  - >-
    Not a reopening of H-TTN-001 on its own terms. That hypothesis was gated on
    RECALL UNDER TRUNCATION; this contract proposes no truncation and asserts no
    negligible directions.
  - >-
    Not a claim about m at least 7. HEUR-TTNX-1 is unvalidated and caps everything
    here at m at most 6.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output or
    evidence. No run has been executed under this contract.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at m in 3, 4, 5, 6 and the three executed prime
      sizes, constructing and evaluating S_m by the factored route costs a stated
      number of field operations and a stated peak memory, the dense route costs a
      stated number or is recorded censored, the random same-rank null costs a
      stated number, and the solver interface costs a stated number. WHAT DOES NOT
      FOLLOW - nothing about m at least 7, because HEUR-TTNX-1 is unvalidated;
      nothing about cryptographic-size primes; no end-to-end index-calculus cost,
      because FINDING-PF-IC-001 records that the linear-algebra stage dominates;
      no solving-degree statement; and no ECDLP exponent claim of any kind. A
      censored dense cell supports NO comparison at that cell in either direction.

  inputs:
    procedure: >-
      STAGE 0 (zero compute, blocking). Declare the three prime sizes, the
      field-operation accounting convention shared by both routes, the modeled
      cost formulas with their sources, and the list of optimistic assumptions
      with the DIRECTION of each bias. Freeze the m equal to 3 forced-value
      expectation. All fixed before any timing exists.
      STAGE 1 (exactness gate, blocking). Construct S_m by both routes at m in 3,
      4, 5 and compare COEFFICIENT FOR COEFFICIENT over F_p at each prime size.
      Any disagreement anywhere halts the run - the extraction is then not a
      construction and no timing is reportable.
      STAGE 2 (forced-value gate, blocking). At m equal to 3 the dense object is 3
      by 3 and the dense route MUST win on field operations. A measurement in
      which the factorization wins at m equal to 3 means the counter is broken and
      the run stops.
      STAGE 3 (primary null, run BEFORE any positive reading). Factor a RANDOM
      tensor of the same shape and the same nominal rank chi(m) by the same
      routine at every cell, three independent draws, and record the same
      field-operation and memory metrics.
      STAGE 4 (signal arm). Count field operations and measure peak RSS for
      construction and for evaluation, both routes, m in 3, 4, 5, 6, three prime
      sizes. Record every censored dense cell explicitly with its censoring
      threshold - EV-TTN-002's dense symbolic S_6 probe was censored at 150
      seconds, so there is currently no m equal to 6 dense reference at all.
      STAGE 5 (interface arm). Measure the field-operation cost of the operations
      the downstream solver actually performs on S_m - specialisation at
      factor-base coordinates, and resultant/Groebner input preparation - for each
      route, including any redensifying step the factored route requires.
      STAGE 6 (zero compute). Fit the construction-cost exponent per route with a
      confidence interval, assemble the concrete-cost table with measured and
      modeled columns separated, list the optimistic assumptions with their bias
      directions, reconcile measured peak RSS against the analytic sizes chi(m)
      and (d+1)^m, and state the affected-versus-safe scope, which for this
      contract is that NO deployed system is affected by any outcome.
    instrument: >-
      The dense route as currently implemented in the harness (dense symbolic
      composed resultant). The factored route built on ttn2_bond_rank_cert.sage
      from experiments/EXP-TTN-002, promoted from certificate to constructive
      routine. Field operations counted by an instrumented F_p arithmetic wrapper
      SHARED BY BOTH ROUTES, so the comparison cannot be a comparison of two
      accounting conventions. Peak RSS measured by the harness. Recorded through
      harness/runner.py with instrument sha256 against the pinned EXP-TTN-002
      instrument.
    parameters: >-
      m in 3, 4, 5, 6. Three prime sizes fixed at Stage 0, spanning the range
      EV-TTN-001 used for its 27 cells. Per-variable degree d equal to 2^{m-2};
      dense array size (d+1)^m; predicted factored term count chi(m) equal to
      C(2^{m-3}+2, 2), i.e. 3, 6, 15, 45 at m equal to 3, 4, 5, 6. Three
      random-tensor draws per null cell. Dense censoring threshold declared at
      Stage 0 and applied identically at every cell.

  controls:
  - >-
    PRIMARY NULL, mandatory and run first - a RANDOM tensor of the same shape and
    the same nominal rank chi(m), factored by the same routine. If the
    construction-plus-evaluation cost is the same as for the genuine Semaev bond,
    the saving is generic low-rank bookkeeping and carries nothing about summation
    polynomials.
  - >-
    FORCED-VALUE GATE at m equal to 3, blocking - the dense route MUST win because
    the dense object is 3 by 3. A measurement reporting the factorization winning
    there is broken.
  - >-
    EXACTNESS GATE, blocking - the factored S_m must agree with the dense S_m
    coefficient for coefficient wherever the dense one is computable, BEFORE any
    timing is reported.
  - >-
    SHARED-COUNTER CONTROL - both routes are instrumented through the same F_p
    arithmetic wrapper, so a field-operation difference cannot be an accounting
    difference.
  - >-
    CENSORING CONTROL - every censored dense cell is recorded with its threshold
    and excluded from every comparison. A censored dense cell is infrastructure
    (AGENTS.md rule 3) and is NEVER read as a win for the factored route.
  - >-
    MEMORY RECONCILIATION - measured peak RSS is reconciled against the analytic
    dominant-structure sizes chi(m) rank-1 terms versus (d+1)^m dense entries, and
    a discrepancy larger than an order of magnitude is reported as an unexplained
    gap rather than absorbed.

  independent_variables:
  - 'route - dense symbolic composed resultant versus chi(m)-term rank-1 factorization'
  - m in 3, 4, 5, 6
  - prime size
  - 'arm - genuine Semaev bond versus random same-shape same-nominal-rank tensor'
  - 'stage - construction versus evaluation versus solver interface'

  metrics:
    primary:
    - >-
      construction field-operation count - counted F_p multiplications and
      additions, reported separately and as a total - per (route, m, prime, arm),
      MEASURED, via the shared instrumented arithmetic wrapper
    - >-
      evaluation field-operation count at a factor-base specialisation - same
      units and counter - per (route, m, prime, arm), MEASURED
    - >-
      fitted construction-cost exponent with confidence interval - dimensionless -
      per route, fitted over the m ladder at fixed prime size, against the
      approximately 1.979 dense reference recorded in the EV-TTN-002 context,
      MEASURED from the counts above
    - >-
      peak resident memory - bytes - per (route, m, prime, arm), MEASURED, and
      reported alongside the MODELED dominant-structure sizes chi(m) and (d+1)^m
      in a separate column
    - >-
      exactness verdict - boolean per (m, prime) - whether the factored and dense
      coefficient arrays agree everywhere the dense one is computable
    secondary:
    - >-
      solver-interface field-operation count - same counter - the cost of
      specialisation and of resultant/Groebner input preparation per route,
      including any redensifying step, MEASURED
    - >-
      per-contraction reduction cost - field operations to reduce a composed
      factorization back to chi(m+1) terms - MEASURED, isolated because it is the
      named bottleneck
    - >-
      wall time per route per cell - seconds - reported but NEVER substituted for
      the field-operation count, since Sage and Singular implementation constants
      can dominate at small m and invert the comparison
    - >-
      realised term count after reduction versus the predicted chi(m) - integers -
      so a route that silently keeps more terms than chi(m) is visible
    - >-
      censored cells listed explicitly with their thresholds

  cost_table_discipline:
    measured_vs_modeled: >-
      Every reported number carries a label. MEASURED means an instrumented run
      with a manifest. MODELED means a cost formula, and the formula and its
      source are named in the same row. The two never appear in one column. The
      approximately 1.979 dense reference is quoted from the EV-TTN-002 context as
      that record's claim and is re-measured here rather than assumed.
    optimistic_assumptions:
    - >-
      Field operations are counted uniformly, so a multiplication and an addition
      may be summed into one total. BIAS DIRECTION - this FAVOURS whichever route
      uses relatively more additions; the split counts are therefore reported
      separately so the reader can re-weight.
    - >-
      The factored route is assumed to be able to hand S_m to the solver in
      factored form for at least some solver operations. BIAS DIRECTION - FAVOURS
      the factored route. Stage 5 measures the interface cost precisely to remove
      this assumption, and if it cannot be measured the assumption is flagged as
      unremoved.
    - >-
      chi(m) is treated as the term count after reduction. BIAS DIRECTION -
      FAVOURS the factored route if the reduction is incomplete. The realised term
      count is measured and reported against chi(m) to expose this.
    - >-
      Dense censoring uses a fixed threshold. BIAS DIRECTION - FAVOURS the
      factored route, because a slow dense cell becomes absent rather than large.
      Mitigated by excluding censored cells from every comparison rather than
      scoring them.
    hidden_overhead: >-
      The headline ratio chi(m) to (d+1)^m hides the per-contraction reduction
      back to chi(m+1) terms, which is where such savings usually die and which is
      measured as its own secondary metric. It also hides the solver-interface
      cost. Both are named here rather than buried in a lower-order term.
    standardized_parameter_sets: >-
      NONE EXIST FOR THIS OBJECT, and that is stated rather than papered over.
      There is no NIST-style standardized parameter set for Semaev summation
      polynomial construction. The declared sets are m in 3, 4, 5, 6 at three toy
      prime sizes fixed at Stage 0, chosen for comparability with EV-TTN-001's 27
      cells and EV-TTN-002's 9 cells.
    affected_vs_safe_scope: >-
      NO deployed system is affected by any outcome of this contract. It measures
      the construction cost of an internal subroutine at toy parameters and makes
      no cryptanalytic claim.

  heuristic_under_test:
    id: HEUR-TTNX-1
    formal_statement: >-
      The rank law chi(m) equal to C(2^{m-3}+2, 2), certified for m at most 6,
      continues to hold at m equal to 7 and beyond.
    tested_here: false
    consequence: >-
      NOT TESTED. Extending the certificate to m equal to 7 is out of this
      contract's budget. The heuristic is therefore UNVALIDATED, every claim in
      this lane is capped at m at most 6, and any statement about m at least 7 is
      forbidden by claim_ceiling. A separate contract would be needed to validate
      it, and its failure would be a result rather than a defect.

  preregistered_prediction:
    quantity: >-
      The ratio of factored to dense construction field-operation counts at m
      equal to 5 and m equal to 6, and the fitted construction-cost exponent of
      the factored route against the dense reference of approximately 1.979.
    formula: >-
      R(m, prime) := ops_factored(m, prime) / ops_dense(m, prime), for
      construction plus evaluation. Predicted R below 1 at some m at most 6 at ALL
      three prime sizes, and a fitted factored exponent below 1.979 with a
      confidence interval excluding 1.979. FORCED VALUE - R above 1 at m equal to
      3 at every prime size. Under the null that low rank buys nothing exact, R is
      at least 1 at every m and every prime size.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-049ed4, whose
      predictions block states a crossover at some m at most 6 reproduced at three
      field sizes and any fitted exponent below 1.979 surviving the random-tensor
      null, and whose honest_prior_of_survival records 0.55 for the m equal to 6
      construction win and 0.15 for the win surviving the solver interface, before
      any run under this contract exists. Never tuned to data.

  scale_relevance:
    tier: toy
    justification: >-
      Executed at m at most 6 and three toy prime sizes, far below anything
      cryptographic, because the dense reference must remain computable for the
      comparison to exist at all - and at m equal to 6 it may already not be, which
      is why censoring is a first-class outcome here rather than a nuisance. The
      transfer assumption to larger m is HEUR-TTNX-1, which is UNVALIDATED and is
      explicitly NOT used. The field-size independence measured in EV-TTN-001
      (beta 0.000000) is the reason three prime sizes suffice to expose a
      field-size-dependent artifact, and it is cited as that record's claim.
    correspondence: null

  tail_checks:
  - >-
    Report the realised term count after each reduction against the predicted
    chi(m); a route that quietly retains more terms than chi(m) is not the route
    the hypothesis describes.
  - >-
    Report the per-contraction reduction cost separately at every m, since a total
    that improves while the reduction cost explodes at m equal to 6 predicts the
    opposite sign at m equal to 7.
  - >-
    Report field-operation counts AND wall time in the same row; a case where they
    disagree in sign identifies implementation constants and must be flagged
    rather than resolved in favour of either.
  - >-
    Reconcile measured peak RSS against the analytic dominant-structure size at
    every cell; a discrepancy above one order of magnitude is an unexplained gap
    and is reported as such.
  - >-
    Report the three random-tensor draws separately as well as their range, since
    a null summarised by a mean can hide a draw that matches the signal.

  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 6.0
    maximum_memory_gb: 16
    maximum_runs: 40

  stopping_rules:
  - >-
    Stop immediately if the Stage 1 exactness gate fails at any coefficient.
  - >-
    Stop immediately if the Stage 2 m equal to 3 forced-value gate reports the
    factored route winning.
  - >-
    Do not read any signal cell before its matching random-tensor null cell has
    been executed in the same invocation.
  - >-
    Censor a dense cell at the declared Stage 0 threshold, record it, and exclude
    it from every comparison. Do not raise the threshold after seeing a censoring.
  - >-
    Stop at m equal to 6. Extending to m equal to 7 requires validating
    HEUR-TTNX-1 and is a different contract.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
    exhaustion is a stop, never a negative result (AGENTS.md rule 5).

  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion, Sage or Singular failure or dependency
    failure makes the run failed_infrastructure and is NEVER negative mathematical
    evidence (AGENTS.md rule 5). A censored dense cell is infrastructure and is
    never a win for the factored route.
  - >-
    A run whose null arm is missing, or whose null arm was not executed in the
    same invocation as the signal arm, is invalid_measurement.
  - >-
    A run whose two routes were counted through different arithmetic wrappers is
    invalid_measurement - the comparison the contract exists to make was not made.
  - >-
    A run reporting a cost comparison at a cell where the dense route was censored
    is invalid_measurement at that cell.
  - >-
    A run mixing measured and modeled numbers in one column is
    invalid_measurement.
  - >-
    A run whose parameters differ from the frozen contract is a DIFFERENT
    experiment and requires a new contract; it is never a repair of this one.

  success_criterion: >-
    The exactness gate passes at every (m, prime) where the dense route is
    computable, the m equal to 3 forced-value gate fires correctly, and the run
    reports construction and evaluation field-operation counts, peak RSS, and
    solver-interface costs for both routes, on the genuine arm and all three
    random-tensor draws, at every non-censored cell, together with the fitted
    exponent and its confidence interval and the explicit censored-cell list. This
    criterion is decidable from the primary metrics alone and says nothing about
    which route wins.

  falsification_criterion:
  - >-
    The factored construction plus evaluation cost is at least the dense cost at
    every non-censored m and every prime size. The hypothesis is false, the low
    rank buys nothing exact either, and the measured counts plus the isolated
    per-contraction reduction cost are the recorded obstruction - a quantity with
    units, measured over the declared scope, which is what the closure standard
    requires.
  - >-
    The random-tensor null shows the same saving as the genuine bond. The effect
    is generic low-rank bookkeeping and no reading of the signal arm is
    admissible.
  - >-
    The factored S_m disagrees with the dense S_m at any computable coefficient.
    The extraction is not a construction and the record is void until repaired.
  - >-
    The m equal to 3 forced-value gate reports the factored route winning. The
    field-operation counter is broken and nothing is reportable.
  - >-
    A construction win at m equal to 5 or 6 is fully erased by the measured
    solver-interface cost. The useful form of the claim is false even though the
    construction number stands, and the interface is named as the next target.

  required_artifacts:
  - >-
    manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
    model and inference block, instrument sha256 against the pinned EXP-TTN-002
    instrument, and environment
  - >-
    raw-result.json carrying every per-cell field-operation count split into
    multiplications and additions, every peak RSS reading, and every per-contraction
    reduction cost - not summaries
  - >-
    the null arm's measurements for all three random-tensor draws, in the same file
    as the signal arm
  - >-
    the coefficient-level exactness comparison output at every (m, prime) where the
    dense route is computable
  - >-
    the Stage 0 pre-declaration text, written before the first timing exists and
    hashed, containing the prime sizes, the accounting convention, the modeled
    formulas with sources, the optimistic-assumption list with bias directions, and
    the censoring threshold
  - >-
    the concrete-cost table with measured and modeled columns separated and every
    censored cell listed with its threshold

  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval is required before execution, and under this engagement
    approval is the USER's gate because it authorizes execution and spends
    compute. This contract is NOT approved - approved_by is null and
    execution_authorized is false (AGENTS.md rule 1).
  - >-
    The paired hypothesis H-TTN-806b84 carries a filled proof_search_map with a
    named bottleneck, a frozen m equal to 3 baseline fixture, an
    observation-collision search realised as the random-tensor null, an explicit
    quantifier order, a method ceiling and a nearby-object control. That map must
    be audited against KN-TECH-080 before implementation, because the hypothesis
    carries an asymptotic_claim of kind cofactor_improvement.
  - >-
    The prime sizes, the shared arithmetic wrapper, the modeled formulas, the
    optimistic-assumption list and the censoring threshold must be recorded at
    Stage 0 before any timing exists.
  - >-
    NOTE FOR THE APPROVER - correcting KN-OPEN-007's Current state summary, which
    contradicts both EV-TTN-001 and EV-TTN-002, is a Coordinator curation task
    that is NOT part of this contract and must not be bundled into its ledger
    archive.

  derivation_provenance:
    tool: coordinator subagent, design-experiment lifecycle steps 3 to 5
    source_record: IDEA-20260807-049ed4
    authored_at: '2026-08-25'
    note: >-
      Controls, metrics, predictions and falsification conditions are taken from
      the parent proposal's minimal_test, null_object_control and
      falsification_conditions blocks. The cost-table discipline block is imposed
      by the design-experiment skill's cost-model measurement pattern rather than
      by the proposal, because the deliverable is a cost table. Committed values
      (bond ranks 3, 6, 15; chi(6) equal to 45; beta 0.000000; the 150-second
      dense S_6 censoring; the approximately 1.979 dense exponent) are quoted from
      EV-TTN-001 and EV-TTN-002 as those records' claims, not asserted here.
      Budgets come from the parent's declared estimated_cost (implementation
      medium, compute medium). No field is invented.

  derivation_gaps:
  - >-
    The three prime sizes are unspecified in the proposal. They must be pinned at
    Stage 0, and they should span EV-TTN-001's 27-cell range so field-size
    independence can be checked rather than assumed.
  - >-
    Whether ttn2_bond_rank_cert.sage can be promoted from certificate to
    constructive routine is unknown to this contract. If it cannot, the whole
    factored arm is an instrumentation task whose cost is not budgeted here and
    which must be reported as infrastructure.
  - >-
    The solver-interface measurement needs the downstream solver's actual input
    convention pinned. The proposal names specialisation and resultant/Groebner
    input preparation but does not fix the interface, and an interface chosen
    after seeing a construction win would flatter it.
  - >-
    The dense censoring threshold is not fixed by the proposal. It must be set at
    Stage 0 and held, because raising it after a censoring is the cheapest way to
    manufacture a comparison that favours the factored route.
  - >-
    The uniform field-operation weighting is a simplification. If the two routes
    have materially different multiplication-to-addition ratios, a Coordinator
    must decide the weighting BEFORE the fit, not after.
