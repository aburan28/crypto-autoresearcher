experiment:
  id: EXP-SSI-7b1469
  version: 10
  schema: SSI-CANONICAL-v10
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: null
  hypothesis_note: >-
    Deliberately null. This is a design-only successor that closes physical
    and accounting interfaces; it is not an executed cryptanalytic hypothesis.
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  batch_id: BATCH-cdcf50
  source_proposal: ledger/proposals/IDEA-20260806-9c2f80.yaml
  direct_predecessor: EXP-SSI-9d821a
  predecessor_contract: experiments/EXP-SSI-9d821a/specification.yaml
  supersedes: EXP-SSI-9d821a
  title: >-
    SSI-CANONICAL-v10 framed semantics, finite accounting, and verifiable path
    contract for the fixed-advice classical OneEnd boundary
  objective: >-
    Close the v9 review residuals in one fresh namespace: every named object has
    a registered tag and exact frame grammar; every digest has an ordered framed
    preimage; fixed advice has a source-bound pre-target witness; helper/index
    records cross-check semantic identities; builder, terminals, events,
    restarts, memory, certificate, HNF/output, replay, and control interfaces
    are finite and byte-recomputable. This remains design-only and cannot claim
    an attack, lower bound, security result, changed exponent, or result for a
    deployed system.
  claim_ceiling: >-
    At most a mechanically reviewable contract for the named finite
    construction and its pending admission inputs. It cannot establish an
    all-advice lower bound, validate a heuristic, transfer to EndRing, Isogeny,
    SQIsign, or CSIDH security, or make a positive SIDH/SIKE torsion-image claim.
  metrics:
    required: [validity_status, terminal_code, total_foe, memory_bytes, success_bit, break_even_q]
    note: >-
      These are output columns only. No metric is populated by this design
      record and no run is authorized.
  budget:
    wall_clock_seconds: 900
    memory_gb: 2
    maximum_runs: 0
    note: >-
      Zero runs are permitted by this design-only successor. A future
      Coordinator approval requires a separately scoped Executor handoff.
  success_criterion: >-
    Not applicable until this exact contract, all control artifacts, and the
    independently verified incumbent gate are satisfied; this record is not
    evidence-eligible.
  falsification_criterion: >-
    The design is falsified as byte-recomputable if two conforming serializers
    can produce different bytes for any registered frame, digest preimage,
    helper/index identity, finite terminal, event schedule, memory interval,
    certificate path, replay pair, or control row.

  inputs:
    proposal: ledger/proposals/IDEA-20260806-9c2f80.yaml
    direct_predecessor_contract: experiments/EXP-SSI-9d821a/specification.yaml
    predecessor_validator: coordination/goals/GOAL-SSI-001/batches/BATCH-1ab3b0/reviews/TASK-20260809-b2c255/validation_report.yaml
    predecessor_red_team: coordination/goals/GOAL-SSI-001/batches/BATCH-1ab3b0/reviews/TASK-20260809-467402/red_team_report.md
    predecessor_evidence: ledger/evidence/EV-SSI-d10bd4.yaml
    predecessor_decision: ledger/decisions/DEC-20260809-21db52.yaml
    incumbent_foe_gate: experiments/EXP-SSI-16649a/inputs/INCUMBENT-FOE-v1.yaml
    incumbent_foe_gate_sha256: c0cd6c84f386a833534f67e73e10862785a4911ff5dce870021add77187fbcf8
    frame_registry: experiments/EXP-SSI-7b1469/inputs/FRAME-REGISTRY-v5.yaml
    provider_trust_manifest: experiments/EXP-SSI-7b1469/inputs/PROVIDER-TRUST-v5.yaml
    c_pair_control_manifest: experiments/EXP-SSI-7b1469/controls/C-PAIR-REF-v5.yaml
    synthetic_control_manifest: experiments/EXP-SSI-7b1469/controls/SYNTHETIC-REF-v5.yaml
  lineage_rule: >-
    EXP-SSI-9d821a and all earlier contracts are immutable provenance only. No
    field, width, default, formula, terminal, tag, or cost is inherited unless
    it is repeated in this SSI-CANONICAL-v10 contract. This file and its named
    v10 inputs are the only active interpretation.

  scope:
    problem: >-
      The instance is a canonically encoded supersingular j-invariant E over
      F_{p^2}. The target is classical OneEnd/EndRing path finding without a
      published secret torsion image, SQIsign transcript, or CSIDH secret.
      SIDH/SIKE torsion-image recovery is excluded as a positive target.
    advice_quantifier: >-
      For each selected p, an ADVICE-RECEIPT-v5 is generated and committed
      before target selection. Its source bytes, source commit, owner set,
      helper, order, and index are functions only of p, the complete vertex
      manifest, and advice_seed. The witness transcript contains no target E,
      instance, attempt, or selection field. The scoped formula is
      forall p exists fixed A_p forall E in V_p.
    query_scope: >-
      A target run uses committed advice and the complete target manifest. Each
      attempt has at most L_steps=1048576 graph steps and A_MAX=32768 attempts;
      all bytes, events, terminal frames, and censored traces are retained.
    prohibited_claims:
      - all-advice lower bound
      - uncharged target, factor, provider, or torsion-image oracle
      - hidden preprocessing or memory
      - quantum query or quantum memory claim
      - deployed-parameter security conclusion

  canonical_wire:
    schema_id: SSI-CANONICAL-v10
    frame_grammar: >-
      Every object is tag(u8)||version(u8)||payload_len(u32 little-endian)||
      payload(payload_len exact bytes). The six-byte prefix is included in every
      digest preimage unless a rule explicitly says frame_without_final_digest;
      no raw tag||version expression is a valid v10 object.
    bytestring: >-
      u32 little-endian body_length followed by exactly body_length bytes. Text
      is UTF-8 bytes with no Unicode normalization; source, path, and binary
      fields are opaque bytestrings unless their grammar says otherwise.
    integer_widths:
      u8: {bytes: 1, range: [0, 255], encoding: unsigned_little_endian}
      u16: {bytes: 2, range: [0, 65535], encoding: unsigned_little_endian}
      u32: {bytes: 4, range: [0, 4294967295], encoding: unsigned_little_endian}
      u64: {bytes: 8, range: [0, 18446744073709551615], encoding: unsigned_little_endian}
      BI560: >-
        sign(u8)||magnitude(70 bytes little-endian), with sign 0/1, negative
        zero rejected, and magnitude <2^560. SIGNED560 is exactly this encoding.
      digest: {bytes: 32, encoding: SHA256}
      curve_id: >-
        version(u8=1)||j0(field_bytes)||j1(field_bytes), where field_bytes is
        fixed by the p row and coefficients are canonical little-endian values.
    frame_limits:
      payload_len_max: 4294967295
      object_bytes_max: 4294967301
      source_blob_bytes_max: 67108864
      helper_payload_bytes_max: 67108864
      certificate_bytes_max: 67108864
      trace_bytes_max: 67108864
      output_bytes_max: 8388608
      matrix_rows_max: 512
      matrix_columns_max: 512
      factor_count_max: 65535
      certificate_edge_count_max: 80000
      transition_factor_count_max: 8
      hnf_operation_count_max: 200000
      witness_count_max: 512
      terminal_reason_bytes_max: 1024
      event_frame_bytes: 177
      event_count_max: 350000
      event_trace_header_bytes: 142
      source_generator_bytes_max: 1048576
      provider_id_bytes_max: 128
      mirror_path_bytes_max: 4096
      overflow_precedence: >-
        Check fixed widths, finite counts, multiplication/addition, payload
        length, and digest preimage size in that order. The first failed check
        emits OVERFLOW and no later result replaces it.

  frame_registry:
    source: FRAME-REGISTRY-v5
    registry_digest: >-
      SHA256(the complete FRAME-REGISTRY-v5 frame excluding registry_digest).
    tag_version_rule: >-
      Every tag below is unique, every version is u8=5, and a parser rejects a
      tag/version pair not present in this registry before reading payload bytes.
    entries:
      - {tag: 16, name: SSJ-MANIFEST-v5, final_digest: manifest_digest}
      - {tag: 17, name: ADVICE-RECEIPT-v5, final_digest: advice_digest}
      - {tag: 18, name: ORDER-MANIFEST-v5, final_digest: order_digest}
      - {tag: 19, name: TARGET-MANIFEST-v5, final_digest: target_digest}
      - {tag: 20, name: SELECTION-MAP-v5, final_digest: map_digest}
      - {tag: 21, name: TARGET-SELECTION-INDEX-v5, final_digest: index_digest}
      - {tag: 22, name: BUILDER-REQUEST-v5, final_digest: request_digest}
      - {tag: 23, name: OWNER-RECORD-v5, final_digest: record_digest}
      - {tag: 24, name: ENDPOINT-RECORD-v5, final_digest: endpoint_digest}
      - {tag: 25, name: NULL-OWNER-RECORD-v5, final_digest: null_digest}
      - {tag: 26, name: BUILDER-TERMINAL-v5, final_digest: terminal_digest}
      - {tag: 27, name: HELPER-v5, final_digest: helper_digest}
      - {tag: 28, name: HELPER-PAYLOAD-BLOB-v5, final_digest: blob_digest}
      - {tag: 29, name: HELPER-PAYLOAD-v5, final_digest: payload_digest}
      - {tag: 30, name: MATRIX-v5, final_digest: matrix_digest}
      - {tag: 31, name: EDGE-CERT-v5, final_digest: certificate_digest}
      - {tag: 32, name: PROVIDER-RECEIPT-v5, final_digest: receipt_digest}
      - {tag: 33, name: EDGE-TRANSITION-v5, final_digest: transition_digest}
      - {tag: 34, name: OP-LOG-v5, final_digest: op_digest}
      - {tag: 35, name: SATURATION-v5, final_digest: saturation_digest}
      - {tag: 36, name: OUTPUT-v5, final_digest: output_digest}
      - {tag: 37, name: EVENT-v5, final_digest: event_digest}
      - {tag: 38, name: TRACE-SHARED-v5, final_digest: shared_trace_digest}
      - {tag: 39, name: FINAL-IDENTITY-v5, final_digest: identity_digest}
      - {tag: 40, name: C-PAIR-ROW-v5, final_digest: row_digest}
      - {tag: 41, name: SYN-CELL-v5, final_digest: cell_digest}
      - {tag: 42, name: PAIR-REQUEST-v5, final_digest: pair_request_digest}
      - {tag: 43, name: KEY-DOMAIN-v5, final_digest: key_digest}
      - {tag: 44, name: ATTEMPT-SEED-LIST-v5, final_digest: seed_list_digest}
      - {tag: 193, name: HELPER-SLOT-v5, final_digest: none}
    digest_catalog: >-
      A digest field is always the final payload field. Its preimage is the
      complete outer frame with that final field omitted, except registry_digest
      which uses the registry frame and blob_digest which uses the complete
      HELPER-PAYLOAD-BLOB-v5 frame with blob_digest omitted. Concatenations of
      multiple objects are concatenations of complete frames in the order named;
      an unframed concatenation is invalid.

  parameters_and_bounds:
    primes:
      - {label: SQISign-I, p_code: 1, p_expression: 5*2^248-1, field_bytes: 32, security_label_bits: 256}
      - {label: SQISign-V, p_code: 2, p_expression: 27*2^500-1, field_bytes: 64, security_label_bits: 512}
    fp2: >-
      u^2+1=0; j=j0+j1*u with coefficient order j0,j1 and each coefficient in
      [0,p-1]. Noncanonical field encodings are rejected.
    limits:
      vertex_count_max: 4000000
      owner_count_min: 2
      owner_count_max: 8388607
      endpoint_count_min: 2
      endpoint_count_max: 7
      endpoint_pair_count_max: 262144
      helper_capacity_max: 524288
      target_count_max: 2000000
      selection_count: 4
      requested_owner_count_max: 15000
      builder_record_stride: 4096
      builder_payload_bytes: 4090
      endpoint_record_stride: 512
      endpoint_payload_bytes: 506
      graph_steps_max: 1048576
      attempts_max: 32768
      terminal_frame_bytes_max: 1171
      request_frame_bytes_max: 183
      event_code_max: 109
    derived_bound_checks:
      - 2 <= owner_count <= owner_count_max and owner_count <= vertex_count
      - 2 <= endpoint_count <= endpoint_count_max
      - helper_capacity = 1 << ceil_log2(max(2,2*endpoint_pair_count)) and helper_capacity <= helper_capacity_max
      - 6 + 1 + 4 + expression_bytes + 32 + 8 + vertex_count*curve_id_bytes + 32 <= object_bytes_max
      - target_count <= min(vertex_count,target_count_max)
      - 1 + 6*32 + 8 + 1 + 2 + target_count*selection_count*192 + 32 <= payload_len_max
      - 6 + request_frame_bytes_max + requested_owner_count*builder_record_stride + terminal_frame_bytes_max <= source_blob_bytes_max
      - helper_capacity*96 <= helper_payload_bytes_max
      - factor_count <= factor_count_max and factor_count <= transition_factor_count_max for every helper/transition payload
      - edge_count <= certificate_edge_count_max and hnf_operation_count <= hnf_operation_count_max
      - 8 + rows*columns*71 + 32 <= payload_len_max
      - event_count*event_frame_bytes + event_trace_header_bytes <= trace_bytes_max
      - witness_count*71 + 138 <= output_bytes_max
      - every BI560 magnitude < 2^560

  manifests_and_advice:
    ssj_manifest: >-
      SSJ-MANIFEST-v5 payload is p_code(u8)||expression(bytestring)||
      S_p_digest(32)||vertex_count(u64)||curve_ids(bytestring)||manifest_digest(32).
      curve_ids is exactly vertex_count concatenated curve_id bodies in sorted
      order; curve_ids body length equals vertex_count*curve_id_bytes.
      manifest_digest covers the complete frame without manifest_digest.
    target_manifest: >-
      TARGET-MANIFEST-v5 payload is p_code(u8)||ssj_manifest_digest(32)||
      target_count(u64)||target_indices(target_count*u64)||target_digest(32).
      It is not a target-specific subset: target_indices are ascending indices
      into the complete SSJ manifest, target_digest covers the complete frame
      without target_digest, and target_manifest_digest always means this frame.
    advice_receipt: >-
      ADVICE-RECEIPT-v5 payload is p_code(u8)||ssj_manifest_digest(32)||
      advice_seed(32)||generator_algorithm_id(bytestring)||source_commit_id(bytestring)||
      source_bytes(bytestring)||source_digest(32)||owner_count(u64)||owner_set_digest(32)||
      order_digest(32)||input_transcript_digest(32)||advice_digest(32).
      source_digest is SHA256(source_bytes body), and input_transcript_digest is
      SHA256 of the literal SSI-ADVICE-INPUT-v5 domain tag followed by only
      p_code, ssj_manifest_digest, advice_seed, generator_algorithm_id,
      source_commit_id, and source_digest in canonical field order. It is not a
      target, helper, or index digest. The source bytes and transcript are
      required before any target frame is read; missing source material is
      ADVICE_UNAVAILABLE.
    owner_generator: >-
      owner_set is generated by interpreting source_bytes under the exact
      algorithm id and p row, retaining owner_count distinct ascending u64
      indices. Any target, instance, attempt, or selection byte in source,
      transcript, or output before the target frame is rejected.
    role_resolution: >-
      For target index t and selection code s, target-owner means
      owner_set[t mod owner_count], next-owner means owner_set[(t+1) mod
      owner_count]; target-endpoint means endpoint_set[t mod endpoint_count],
      next-endpoint means endpoint_set[(t+1) mod endpoint_count]. The four map
      entries are fixed and are the only role function. owner_count and
      endpoint_count minimums prevent modulo-zero and same-owner ambiguity.
    order_manifest: >-
      ORDER-MANIFEST-v5 payload is p_code(u8)||owner_count(u64)||owner_indices
      (owner_count*u64)||owner_set_digest(32)||generator_id(bytestring)||
      source_digest(32)||generator_seed(32)||order_digest(32). owner_indices are
      ascending and equal the advice receipt owner set; order_digest covers the
      complete frame without order_digest.

  helper_and_index:
    selection_map: >-
      SELECTION-MAP-v5 payload is four 5-byte entries followed by map_digest:
      entry=(selection_code(u8)||owner_role(u8)||endpoint_role(u8)||branch_code(u8)||certificate_role(u8)).
      Entries are [0,target-owner,next-endpoint,0,0],
      [1,target-owner,next-endpoint,1,1], [2,next-owner,target-endpoint,2,0],
      [3,next-owner,target-endpoint,3,1]. map_digest covers its complete frame
      without map_digest.
    key_domain: >-
      KEY-DOMAIN-v5 has exactly four bodies. Domain 1 (pair) is
      domain_code(u8=1)||p_code(u8)||owner_curve_id(bytestring)||
      endpoint_curve_id(bytestring)||owner_index(u64)||endpoint_index(u64)||
      key_digest(32). Domain 2 (query) is domain_code(u8=2)||p_code(u8)||
      target_manifest_digest(32)||advice_digest(32)||target_index(u64)||
      selection_code(u8)||map_digest(32)||pair_key(32)||key_digest(32).
      Domain 3 (restart) is domain_code(u8=3)||p_code(u8)||
      target_manifest_digest(32)||advice_digest(32)||target_index(u64)||
      attempt_index(u64)||attempt_seed(32)||key_digest(32). Domain 4 (null)
      is domain_code(u8=4)||p_code(u8)||advice_digest(32)||target_index(u64)||
      branch_code(u8)||draw_index(u64)||key_digest(32). In every body the
      final key_digest is SHA256 of the complete frame with key_digest omitted;
      there are no implicit fields or alternate domains.
    helper_slot: >-
      HELPER-SLOT-v5 is exactly 96 bytes: slot_tag(u8=193)||state(u8)||pair_key(32)||
      owner_index(u64)||endpoint_index(u64)||payload_offset(u64)||payload_length(u32)||
      payload_digest(32)||reserved(u16=0). A nonempty slot requires state=1,
      and its fields must equal the referenced endpoint and payload fields.
    helper_payload: >-
      HELPER-PAYLOAD-v5 payload is owner_index(u64)||endpoint_index(u64)||
      middle_degree(BI560)||factor_count(u16)||factor_count*factor(BI560)||
      matrix_frame(bytestring)||payload_flags(u8)||payload_digest(32). Factors
      are sorted by absolute magnitude then sign, multiplicity is retained, and
      middle_degree equals the signed product of factors under BI560 arithmetic.
      payload_flags bit 0 is the matrix-present bit and all other bits are zero.
      pair_key is recomputed from the exact owner and endpoint curve-id bodies;
      matrix_frame is the canonical MATRIX-v5 output of SSI-PAIR-MATRIX-v5 over
      p_code, those curve ids, pair_key, and the sorted factor list. The
      implementation must expose that deterministic relation and its input
      transcript; an asserted matrix or an unbound pair key is invalid. The
      matrix frame, factors, owner/endpoint, and pair_key are checked as one
      semantic record before payload_digest is accepted.
    helper_blob: >-
      HELPER-PAYLOAD-BLOB-v5 payload is blob_id(32)||payload_count(u64)||
      complete HELPER-PAYLOAD-v5 frames in ascending (owner_index,endpoint_index)||
      blob_digest(32). blob_id is SHA256 of the literal domain tag
      SSI-HELPER-BLOB-ID-v5||payload_count(u64)||the complete payload frame bytes,
      excluding both blob_id and blob_digest; blob_digest covers the complete blob
      frame without blob_digest. Occupied slot payload_digest equals the exact
      payload frame digest and every range is nonoverlapping and in bounds.
    helper_frame: >-
      HELPER-v5 payload is p_code(u8)||capacity(u64)||occupied_count(u64)||
      slot_width(u16=96)||owner_set_digest(32)||order_digest(32)||blob_id(32)||
      slot_body(capacity*96)||blob_frame(bytestring)||helper_digest(32).
      The helper digest covers the complete helper frame without helper_digest.
    index_record: >-
      TARGET-SELECTION-INDEX-v5 records are exactly 192 bytes:
      record_tag(u8)||target_index(u64)||selection_code(u8)||branch_code(u8)||
      owner_index(u64)||endpoint_index(u64)||pair_key(32)||helper_digest(32)||
      slot_index(u64)||payload_offset(u64)||payload_length(u32)||payload_digest(32)||
      query_key(32)||reserved(17). Every record rechecks the helper slot, endpoint,
      owner, blob id, range, pair key, and query key; binary order is only a
      storage optimization, never the semantic binding.
    index_frame: >-
      TARGET-SELECTION-INDEX-v5 payload is p_code(u8)||target_manifest_digest(32)||
      advice_digest(32)||owner_set_digest(32)||order_digest(32)||helper_digest(32)||
      map_digest(32)||target_count(u64)||selection_count(u8=4)||record_width(u16=192)||
      records(target_count*4*192)||index_digest(32).

  finite_builder:
    request_frame: >-
      BUILDER-REQUEST-v5 payload is p_code(u8)||advice_digest(32)||
      target_manifest_digest(32)||request_id(u64)||requested_owner_count(u64)||
      request_seed(32)||seed_list_digest(32)||request_digest(32), exactly 177
      payload bytes and 183 complete frame bytes. request_digest covers the
      complete frame without request_digest; request_frame_bytes is therefore
      exactly 183 and binds the finite attempt list before execution.
    endpoint_record: >-
      ENDPOINT-RECORD-v5 is a 512-byte frame with payload exactly
      endpoint_index(u64)||endpoint_curve_id(bytestring)||pair_key(32)||
      helper_digest(32)||slot_index(u64)||payload_offset(u64)||payload_length(u32)||
      payload_digest(32)||endpoint_digest(32)||zero padding to 506 bytes.
      endpoint_digest covers the frame without endpoint_digest and all pointer
      identities are checked against C-HELPER-v5.
    owner_record: >-
      OWNER-RECORD-v5 is a 4096-byte frame with payload exactly
      owner_index(u64)||endpoint_count(u32)||endpoint_count complete 512-byte
      endpoint records||record_digest(32)||zero padding to 4090 bytes. The
      record digest covers the frame through endpoint records without the final
      digest and owner_index is checked against the committed order manifest.
    null_record: >-
      NULL-OWNER-RECORD-v5 has the same 6-byte outer frame as every object and
      exactly 4090 payload bytes: position(u64)||null_reason(u8)||
      request_digest(32)||owner_index(u64=0)||endpoint_count(u32=0)||
      endpoint_digest(32=zero)||null_digest(32)||zero padding to 4090 bytes.
      null_digest is the final semantic field and covers the complete frame
      without null_digest. It never masquerades as an OWNER-RECORD-v5.
    terminals: >-
      BUILDER-TERMINAL-v5 payload is request_digest(32)||terminal_code(u8)||
      terminal_position(u64)||requested_count(u64)||emitted_count(u64)||
      retained_count(u64)||candidate_count(u64)||terminal_reason(bytestring)||
      stream_digest(32)||terminal_digest(32). terminal_reason body length is
      <=terminal_reason_bytes_max and terminal_digest covers the complete frame
      without terminal_digest. stream_digest covers request frame, every fixed
      owner or null stride, and terminal frame without stream_digest.
    terminal_codes:
      ZERO_REQUEST: 0
      COMPLETE: 1
      FINITE_OWNER_EXHAUSTED: 2
      CANDIDATE_CAP: 3
      INVALID_RECORD: 4
      OVERFLOW: 5
      INFRASTRUCTURE_UNAVAILABLE: 6
      REPLAY_IDENTITY_FAILURE: 7
      ADVICE_UNAVAILABLE: 8
    precedence: >-
      Parse and digest-check the request first. If requested_owner_count=0,
      emit ZERO_REQUEST only after request identity is valid. For nonzero
      requests the total order is OVERFLOW > REPLAY_IDENTITY_FAILURE >
      INVALID_RECORD > ADVICE_UNAVAILABLE > INFRASTRUCTURE_UNAVAILABLE >
      CANDIDATE_CAP > FINITE_OWNER_EXHAUSTED > COMPLETE. Malformed request
      identity is INVALID_RECORD, never ZERO_REQUEST.
    total_bound: >-
      request_frame_bytes + emitted_count*4096 + terminal_frame_bytes <=
      source_blob_bytes_max; no request, terminal, reason, digest, or padding
      bytes are outside this inequality. terminal_frame_bytes is exactly
      147+reason_body_bytes because the terminal payload is 141+reason_body_bytes
      and the outer frame is 6 bytes; therefore 0<=reason_body_bytes<=1024 and
      terminal_frame_bytes<=1171.

  accounting_and_restart:
    event_frame: >-
      EVENT-v5 payload is phase(u8)||event_code(u16)||primitive_code(u8)||
      operation_count(u64)||input_bytes(u64)||hash_blocks(u64)||byte_units(u64)||
      event_foe(BI560)||operand_digest(32)||event_digest(32), exactly 171 payload
      bytes and 177 complete frame bytes. event_digest covers the frame without
      event_digest.
    event_code_table:
      setup:
        1: vertex_enumeration
        2: order_manifest_build
        3: advice_source_read
        4: advice_commit_build
        5: helper_build
        6: index_build
        7: setup_digest
      query:
        100: index_read
        101: helper_slot_read
        102: helper_payload_read
        103: certificate_read
        104: graph_step
        105: hnf_row_operation
        106: saturation_factor
        107: trace_write
        108: output_serialize
        109: terminal_write
    primitive_rules: >-
      primitive_code=1 field operation charges operation_count; 2 byte read,
      3 byte write, and 4 byte compare charge byte_units=ceil(input_bytes/64);
      5 SHA256 charges hash_blocks=ceil((input_bytes+9)/64); 6 matrix row
      operation, 7 transition check, and 8 output operation charge their exact
      operation_count. All unused count fields are zero and event_foe is the
      exact BI560 sum of the applicable charge, never an asserted label.
    event_charge_table: >-
      For code 1 the input is each serialized curve-id body and operation_count
      is its vertex-enumeration count. Codes 2, 4, 5, and 6 use respectively
      the complete order, advice, helper, and index frame bytes as input;
      operation_count is the exact emitted record count. Code 3 reads the
      complete source_bytes body. Code 7 hashes the complete phase-0 frame
      concatenation. Code 100 reads one complete index record, 101 reads one
      96-byte helper slot, and 102 reads one complete helper payload frame.
      Code 103 reads one complete certificate frame or provider-receipt frame,
      code 104 reads one serialized edge-transition frame, code 105 charges
      one HNF operation, code 106 charges one transition factor, code 107
      writes one complete event frame, code 108 charges one output operation,
      and code 109 writes one terminal frame. Each mapping fixes input_bytes,
      operation_count, hash_blocks, and byte_units before event_foe is computed.
    event_population: >-
      Every control-flow branch emits the named event codes in source order.
      A graph step emits one 104 event plus the exact serialized edge input
      bytes; each HNF operation emits one 105 event; each certificate factor
      emits one 106 event; terminal, provider, replay, and output bytes are
      emitted through 103, 107, 108, and 109 as applicable. The event trace is
      the complete ordered list and no event is charged twice across phases.
    restart_seed: >-
      A restart seed is SHA256 of the complete KEY-DOMAIN-v5 frame with
      domain_code=3 and payload target_manifest_digest(32)||advice_digest(32)||
      target_index(u64)||attempt_index(u64)||attempt_seed(32), where the final
      key_digest is omitted from the preimage. The seed sample space is uniform
      256-bit attempt_seed; a finite run has exactly A attempts in 0..A_MAX-1,
      and must materialize ATTEMPT-SEED-LIST-v5 before execution. Its payload is
      p_code(u8)||advice_digest(32)||target_manifest_digest(32)||request_id(u64)||
      attempt_count(u64)||attempt_index/attempt_seed pairs in exact index order||
      seed_list_digest(32), where 0<=attempt_count<=attempts_max and the final
      digest covers the complete list frame without seed_list_digest. The list,
      not an implicit PRNG state, is the complete finite sample space and its
      digest is a request input; every attempt retains its trace and reports
      success_bit=1 only if one attempt emits a valid non-scalar output.
    expected_cost: >-
      For finite runs report the exact pair (success_bit, total_foe, total_bytes,
      memory_peak) and failure probability over the declared seed list. Do not
      use E[W]/q unless an independently justified infinite IID restart law and
      the joint success/cost distribution are supplied. A successful run's cost
      is the sum through its first success; an exhausted run is a terminal
      failure, not infinity and not a success.
    phase_partition: >-
      Phase 0 is setup codes 1..7 and is charged once per advice receipt. Phase
      1 is query codes 100..109 and is charged per target attempt. Setup bytes
      read during a query are phase-1 reads and are not recharged as phase-0
      construction. T_setup is the exact phase-0 sum; T_run is the exact sum of
      all phase-1 events in a finite attempt set.
    memory_intervals: >-
      Each retained buffer is a tuple (buffer_id, allocation_event,
      release_event, exact_bytes). The verifier sums buffers with
      allocation_event<=step<release_event. The mandatory rows are vertex
      manifest, target manifest, advice source, order, helper slots, helper
      blob, index, provider receipt, certificate frame, matrix, operation log,
      trace, output, request, and terminal. No ordinal-only row or allocator
      allowance is valid; M_advice and M_work are the maxima of these sums.
      The required buffer table gives exact formulas: vertex_manifest=
      6+1+4+expression_bytes+32+8+4+vertex_count*curve_id_bytes+32;
      target_manifest=6+1+32+8+target_count*8+32; advice_source=4+
      source_bytes_body; order=6+1+8+owner_count*8+32+4+generator_id_body+
      32+32+32; helper_slots=capacity*96; helper_blob=6+32+8+
      sum(payload_frame_bytes)+32; index=6+1+6*32+8+1+2+
      target_count*selection_count*192+32; provider_receipt=6+provider_receipt_payload_bytes;
      certificate=6+certificate_payload_bytes; matrix=6+8+rows*columns*71+32;
      operation_log=6+operation_count*194; trace=event_trace_header_bytes+
      event_count*event_frame_bytes; output=6+4+witness_count*71+3*32+32;
      request=183; terminal=147+reason_body_bytes. Allocation and release
      events for every row are present in the trace, and a buffer released at
      step k is excluded from the sum at k.

  certificate_hnf_output:
    provider_trust: >-
      PROVIDER-TRUST-v5 is a separately archived trusted input. Its provider id,
      Ed25519 public key, key digest, and verification command are fixed before
      a certificate is accepted. A missing trust entry is INVALID_CERTIFICATE,
      not a provider-selected default.
    provider_receipt: >-
      PROVIDER-RECEIPT-v5 payload is provider_id(bytestring)||mirror_path(bytestring)||
      artifact_digest(32)||provider_public_key(32)||signed_message_digest(32)||signature(64)||
      receipt_digest(32). signed_message_digest is SHA256 of the canonical
      SSI-PROVIDER-RECEIPT-v5 domain tag followed by p_code, target_manifest_digest,
      target_index, advice_digest, horizon, edge_count, path_bytes, artifact_digest,
      mirror_digest, transition_root, mirror_path bytestring, provider_id bytestring,
      and provider_public_key, in that order. It deliberately excludes the recursive receipt frame,
      transition_frames, signature, and receipt_digest. artifact_digest equals the
      digest of the complete ordered transition-frame stream and mirror_digest
      equals the digest of the exact mirrored byte stream; the two streams must
      be byte-equal, edge_certificate.mirror_path must equal the receipt
      mirror_path byte-for-byte, and path continuity is checked against that stream. The
      trusted key digest must equal provider_public_key and the signature verifies
      this signed_message_digest under that key.
    edge_certificate: >-
      EDGE-CERT-v5 payload is p_code(u8)||target_manifest_digest(32)||
      target_index(u64)||advice_digest(32)||horizon(u64)||edge_count(u64)||
      path_bytes(u64)||provider_receipt_frame(bytestring)||mirror_path(bytestring)||
      artifact_digest(32)||mirror_digest(32)||transition_root(32)||
      transition_frames(bytestring)||certificate_digest(32). transition_frames
      is the exact ordered concatenation of EDGE-TRANSITION-v5 frames; its body
      length equals path_bytes, edge_count equals frame count, and every source
      equals the previous destination. The first source is the selected target,
      the final destination is the selected endpoint, horizon and path_bytes are
      bounded, and certificate_digest covers the complete frame without it.
    transition: >-
      EDGE-TRANSITION-v5 payload is source_index(u64)||destination_index(u64)||
      degree(BI560)||factor_count(u16)||factor_count*factor(BI560)||
      transition_witness_digest(32)||transition_digest(32). Indices are in the
      target manifest, degree is the signed product of sorted factors, and the
      transition_witness_digest is SHA256 of the literal SSI-EDGE-WITNESS-v5
      domain tag followed by p_code, source_index, destination_index, degree,
      factor_count, and the serialized sorted factors. The witness digest is
      verified from exactly those fields; a provider assertion cannot replace it.
    matrix: >-
      MATRIX-v5 payload is rows(u32)||columns(u32)||row-major entries, each
      SIGNED560=71 bytes, followed by matrix_digest(32). The payload length is
      exactly 8+rows*columns*71+32 and matrix_digest covers the frame without it.
    hnf: >-
      HNF-RIGHT-ROW-v4 starts from the matrix digest and processes columns in
      ascending pivot order. In OP-LOG-v5, op_code 1 swaps matrix[row] and
      matrix[column]; op_code 2 updates matrix[row] := matrix[row] +
      scalar*matrix[column]; and op_code 3 signed-normalizes matrix[row] at
      pivot column=column. Thus row and column are exact indices for every
      opcode, not labels for an omitted pivot. Each operation checks bounds,
      factor_index, scalar, the canonical pre/post matrix bytes, and the
      previous/next digest. OP-LOG-v5 payload is
      op_code(u8)||row(u64)||column(u64)||scalar(SIGNED560)||factor_index(u32)||
      previous_digest(32)||next_digest(32)||op_digest(32), with op_digest final
      and the chain starting at matrix_digest; operation count is bounded by
      hnf_operation_count_max.
    saturation_and_output: >-
      SATURATION-v5 consumes each transition factor in serialized order and
      emits factor_index(u32)||factor(BI560)||pre_matrix_digest(32)||
      post_matrix_digest(32)||saturation_bit(u8)||saturation_digest(32). A factor
      is saturated iff its post matrix satisfies SATURATION-PREDICATE-v5:
      pivot columns are strictly increasing, each nonzero pivot is positive,
      every pivot is the signed gcd-normalized representative, entries outside
      the pivot row/column congruence class are zero or reduced to the canonical
      interval, and zero rows trail nonzero rows. saturation_digest covers the
      frame without it. OUTPUT-v5
      payload is branch_code(u8)||scalar_class(u8)||witness_count(u16)||
      witness_count*SIGNED560||matrix_digest(32)||op_log_digest(32)||
      saturation_digest(32)||output_digest(32). scalar_class=0 is accepted only
      when the final matrix has the exact non-scalar predicate and every witness
      relation verifies; scalar_class=1 requires all diagonal entries equal and
      off-diagonal entries zero; 2 is null; 3 is invalid. output_digest is final.

  controls:
    paired_replay: >-
      PAIR-REQUEST-v5 explicitly differs between treatment and null by
      branch_code and null_mutation_digest; after that request frame, both arms
      must emit identical normalized pre-classification frames, event count,
      matrix digest, op-log digest, and shared trace digest. TRACE-SHARED-v5
      contains request_digest, event_count, complete event frames,
      normalized_matrix_digest, normalized_op_log_digest, and shared_trace_digest.
      FINAL-IDENTITY-v5 contains shared_trace_digest, identity_bit, and the two
      final output digests. Any shared-byte mismatch is REPLAY_IDENTITY_FAILURE.
    branch_null: >-
      For owner_count>=2, null_owner is the first SHA256 of the complete
      KEY-DOMAIN-v5 domain-4 frame preimage
      domain_code(1)||p_code(1)||advice_digest(32)||target_index(u64)||
      branch_code(u8)||draw_index(u64), interpreted little-endian modulo
      owner_count, that differs from the treatment owner. Every rejected draw
      and its preimage digest is serialized in the pair request; if all owner
      indices are exhausted the branch emits FINITE_OWNER_EXHAUSTED. Modulo-zero
      is rejected at admission.
    c_pair: >-
      The C-pair manifest is C-PAIR-REF-v5. It fixes 32 framed seeds, exact
      owner/endpoint marginal generators, helper/index grammar, row frame,
      censor limit, finite-table digest rule, and source digest. It has no
      measured rows in this design record; absent rows or receipt are
      INVALID_CONTROL rather than a negative result.
    synthetic: >-
      The synthetic manifest is SYNTHETIC-REF-v5. It fixes eight cells and 16
      target rows per cell, framed target identifiers, reduced signed rational
      encoding (positive denominator, gcd=1, denominator and numerator BI560),
      recurrence, complete-set aggregation, and cell digest. It has no measured
      cells in this design record; absent cells or receipt are INVALID_CONTROL.

  proof_search_map:
    exact_baseline_reproduction: >-
      Reproduce the hash-bound incumbent source at each p row before comparison;
      missing source remains a hard admission failure.
    observation_collision_search: >-
      Serialize two independent copies of every v10 frame, mutate each tag,
      length, pointer, identity, digest, terminal, and branch field, and require
      rejection. The audit is pending and no result is claimed here.
    quantifier_order: >-
      Verify source-bound ADVICE-RECEIPT-v5 and its target-free transcript before
      reading TARGET-MANIFEST-v5, then verify all target/query fields occur only
      in phase 1.
    method_ceiling_nearby_control: >-
      Use paired replay, finite C-pair, and synthetic manifests under the exact
      v10 registry and frame grammar; passing them would assert implementation
      consistency only, not an SSI result.

  stopping_and_artifacts:
    hard_gates_before_freeze:
      - every object uses the registry and outer frame grammar
      - every digest and pointer passes its complete preimage and cross-check
      - advice source and pre-target transcript are independently materialized
      - builder totals, terminal precedence, finite restart, event schedule, and memory intervals pass
      - certificate trust, path continuity, HNF/output semantics, replay, and controls pass
      - independently verified incumbent measurement exists
    stopping_rules:
      - stop on malformed frame, unknown tag, out-of-range pointer, digest mismatch, overflow, identity mismatch, or semantic predicate failure
      - stop after A_MAX attempts or L_steps graph steps per attempt
      - preserve every complete censored trace
      - provider or mirror unavailability is failed_infrastructure, never research evidence
    required_artifacts:
      - exact command, commit, clean/dirty state, environment, dependencies, and seeds
      - registry, all framed input/output bytes, and SHA256 digests
      - finite ATTEMPT-SEED-LIST-v5 and its request-bound digest
      - complete phase-separated event trace, allocation/release memory table, and bounded restart record
      - validity status, terminal code, and reason
      - requested policy, resolved model, model verification, and fallback/degraded fields
      - independent Validator and Red Team reports
    completion_gate:
      - direct inputs exist and parse
      - no v9 clause is active by inheritance
      - every registered frame and digest is byte-recomputable
      - execution_authorized remains false and frozen remains false
