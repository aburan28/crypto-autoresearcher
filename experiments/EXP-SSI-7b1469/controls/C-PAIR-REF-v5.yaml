control_reference:
  id: C-PAIR-REF-v5
  format: FRAME-C-PAIR-v5
  status: design_manifest_no_measurement
  experiment_id: EXP-SSI-7b1469
  purpose: >-
    Bind the finite dependent-null reference to the exact v10 generator and
    frame registry without asserting a measured distribution or result.
  seed_schedule:
    version: 5
    seed: >-
      SHA256 of literal SSI-C-PAIR-SEED-v5||advice_digest(32)||
      replicate_index(u64 little-endian). This control seed domain is not a
      KEY-DOMAIN-v5 production query domain.
    replicate_count: 32
    seed_list_encoding: (replicate_index(u64 LE)||seed(32)) for indices 0..31
      in ascending order
    seed_list_digest: SHA256(seed_list_encoding)
  row_format: >-
    C-PAIR-ROW-v5 payload is replicate_index(u64)||seed(32)||owner_set_digest(32)||
    endpoint_set_digest(32)||helper_digest(32)||index_digest(32)||
    shared_trace_digest(32)||terminal_code(u8)||attempt_count(u64)||
    success_bit(u8)||total_foe(BI560)||memory_peak(BI560)||row_digest(32).
    row_digest is final and covers the complete row frame without row_digest.
  finite_table_digest: >-
    SHA256(concatenation of the 32 complete row frames in replicate_index order);
    the value is absent until all rows are measured and independently replayed.
  admission:
    measured_rows_present: false
    independent_verification_receipt: null
    missing_reference_is: INVALID_CONTROL
    freeze_allowed: false
