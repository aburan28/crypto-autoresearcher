control_reference:
  id: SYNTHETIC-REF-v5
  format: SYN-CELL-v5
  status: design_manifest_no_measurement
  experiment_id: EXP-SSI-7b1469
  generator:
    cell_count: 8
    target_count_per_cell: 16
    cell_seed: >-
      SHA256 of literal SSI-SYNTHETIC-CELL-v5||cell_index(u64 little-endian).
    target_identifier: >-
      SHA256 of literal SSI-SYNTHETIC-TARGET-v5||cell_seed(32)||
      cell_index(u64 little-endian)||target_index(u64 little-endian).
  rational_encoding: >-
    RATIONAL560 is numerator(SIGNED560)||denominator(BI560), denominator>0,
    gcd(abs(numerator),denominator)=1, and zero is encoded as numerator zero,
    denominator one. Every recurrence output is reduced before serialization.
  cell_format: >-
    SYN-CELL-v5 payload is cell_index(u64)||cell_seed(32)||target_set_digest(32)||
    advice_size(BI560)||q_num(BI560)||q_den(BI560)||setup_foe(BI560)||
    query_foe(BI560)||incumbent_num(BI560)||incumbent_den(BI560)||
    censor_limit(u64)||target_count(u64)||cell_digest(32). cell_digest is final
    and covers the complete frame without cell_digest.
  recurrence: >-
    q_num_next=q_num+successes; q_den_next=q_den+attempts; query_foe_next=
    query_foe+attempt_foe; setup_foe is fixed per cell. Aggregation is max over
    all 16 complete target rows; a censored or missing row invalidates the cell.
  cell_table_digest: >-
    SHA256(concatenation of eight complete cell frames in cell_index order);
    the value is absent until all cells are measured and independently replayed.
  admission:
    measured_cells_present: false
    independent_verification_receipt: null
    missing_reference_is: INVALID_CONTROL
    freeze_allowed: false
