experiment:
  id: EXP-VOLC-9f5571
  hypothesis_id: H-VOLC-dff1f8
  question_id: RQ-VOLC-f6253b
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-d7e255
  version: 1
  status: approved
  claim_tier: toy
  retrospective: false
  retrospective_note: >-
    THIS IS A PRE-REGISTRATION. No run of EXP-VOLC-9f5571 exists at the time of
    writing and the runs/ directory does not yet exist. Every threshold,
    definition and prediction below is frozen before execution and may be changed
    only by a versioned protocol_amendment filed under
    experiments/EXP-VOLC-9f5571/amendments/ BEFORE the affected data is
    generated. NOTHING IN THIS FILE IS A MEASUREMENT. The family inventory quoted
    throughout is DERIVED IN THE DESIGN SESSION, has no run record, and is
    re-derived by this experiment's own Stage 1.

  title: >-
    Within-class relation density against TRUE volcano level on the matched-order
    family N = 19507, with the level built by Velu isogenies and not proxied by a
    2-torsion count -- plus the T5 reachability gate on the 37-vertex depth-1
    107-volcano at t = 211, where a variance result becomes an attack only if the
    minimiser is reachable.

  objective: >-
    MEASURE THE WITHIN-CLASS VOLCANO-LEVEL AXIS CORRECTLY, ONCE, WITH ITS OWN
    DETECTION FLOOR STATED -- AND THEN ASK THE ONLY QUESTION THAT MAKES A
    VARIANCE RESULT WORTH ANYTHING: IS THE MINIMISER REACHABLE? Inside a single
    isogeny class every quantity this campaign regresses against -- disc End(E),
    volcano depth at ell, N(alpha_min), |Aut| -- is a function of the single
    integer f_E | f (T4). The within-class contrast is ONE axis, and its
    effective sample size is the NUMBER OF LEVELS, not the number of curves, with
    the maximal-order level always the smallest. On the campaign's own committed
    deep volcano (p = 4001, t = 30) the true level distribution is {0: 3, 1: 9,
    2: 18, 3: 36, 4: 72} and the crater carries n = 3, where the design detects
    nothing below a 9.8% excess. That is the identifiability ceiling, recorded
    before execution so a null cannot later be reported as though the design had
    power it never had.

    THE FIVE MANDATORY CONTROLS, EACH DISCHARGING A NAMED COMMITTED FAILURE.
    (1) TARGETS ARE SAMPLED WITH targets_B (harness/exp_icinv_fullgroup.py:485),
    the certified full-group two-generator sampler; exp_icinv.targets_uniform is
    PROHIBITED. H-ICINV-6c7920 (status `specified`, live, NOT adjudicated) holds
    that the campaign's entire reported over-dispersion is a targets_uniform
    artifact, because that sampler's support is the cyclic subgroup <G> and on
    r = 3 curves the estimand is uniform on at most half the group. THIS CONTRACT
    MUST NOT AND DOES NOT PRESUME THAT HYPOTHESIS TRUE OR FALSE; it simply does
    not reuse the disputed sampler. (2) EVERY MEASUREMENT IS STRATIFIED ON
    r = #{x in F_p : x^3 + a x + b = 0} and the strata are reported. (3) THE
    VOLCANO IS BUILT BY VELU ISOGENIES, not by two_torsion_x_count: the
    committed "volcano level" WAS the 2-torsion count -- ell_subgroup_count(., 2)
    and exp_icinv.two_torsion_x_count are character-for-character the same
    expression -- and it resolved 2 of 5 levels, reporting strata {1: 72, 3: 66}
    where 66 is levels 0-3 POOLED (red_team_notes.md section 10). (4) THE
    FACTOR-BASE DENSITY IS SWEPT; the saturated row is never run alone. The
    committed over-dispersion decays 2.037 -> 0.930 as density falls
    0.5306 -> 0.0234, and the m = 3 operating density is 1/m! ~ 0.167
    (red_team_notes.md section 4). (5) THE T5 GATE IS EVALUATED AND REPORTED
    BEFORE any minimiser is described as useful.

    THE T5 GATE, WHICH IS HALF THIS CONTRACT. A VARIANCE RESULT IS NOT AN ATTACK.
    Under T5 a cost-minimising vertex is useful only if goodness is (i) common
    enough to hit by random walk, or (ii) decided by a LOCAL test evaluable at
    each step of a walk. On the t = 211, p = 19717 class both branches are
    directly measurable: the crater is 1 vertex of an enumerated ~37, and the
    candidate local test is the count of F_p-rational 107-isogenies from a
    vertex, which on a depth-1 volcano should separate crater from floor -- the
    exact counts are MEASURED here, not assumed from the textbook. The walk
    length is reported as a DISTRIBUTION OVER SEEDS, never as a point estimate;
    this directly discharges committed failure mode N5, where a
    94.7%-of-ceiling walk result was withdrawn because it rested on a single draw
    while the 8-seed mean sat on the ceiling. Both branches are scoped to this
    37-vertex class: at cryptographic scale reaching a SPECIFIED curve is the
    CSIDH vectorization problem, about p^{1/4} classically at best, and nothing
    measured here transfers.

    WHAT THIS EXPERIMENT DOES NOT DO. It does not run the between-class |D_0|
    contrast, which belongs to EXP-JINV-bd141d and may not be pooled with these
    results. It uses NULL-C nowhere, in either direction: NULL-C is a
    between-class MEAN detector with power 1.00 at a 0.9% shift and is
    disqualified for any within-class contrast by that committed
    characterisation. It claims no attack, no exponent and no speedup.

  inputs:
    family_construction:
      matched_order_N: 19507
      identity: "D = (t - 2)^2 - 4N with p = N + t - 1 required prime"
      inventory_provenance: >-
        DERIVED IN THE DESIGN SESSION BY A SCRIPT. No run record, no manifest, no
        independent verification. Stage 1 re-derives the family under an
        immutable run record; disagreement terminates the run PREMISE-FAILED.
      completeness_gate: >-
        isogeny_class.class_census must return agrees: true for every class used.
      order_verification: >-
        #E(F_p) = 19507 verified PER CURVE, not per class.
    within_class_arm:
      conductor_arm_classes: [3, 107]
      depth_available: 1
      depth_statement: >-
        STATED BEFORE EXECUTION AS A LIMITATION OF THE DESIGN, NOT AS A RESULT.
        Classes at f = 1 have NO within-class level axis at all. Classes at f = 3
        and f = 107 are DEPTH-1 volcanoes, so the within-class level contrast in
        this family is a two-level crater-versus-floor comparison and nothing
        deeper. On the f = 107 class the crater has ONE vertex, supporting a rank
        statement and no variance statement; the f = 3 class carries h(D_0)
        crater vertices against about 3 h(D_0) floor vertices and is the only
        usable two-level contrast at reasonable n anywhere in this family. DEPTH
        GREATER THAN 1 IS UNTESTED BY THIS CONTRACT and the named successor is a
        matched-order family with greater depth.
      level_construction: >-
        Explicit Velu ell-isogeny graph at ell = 3 and ell = 107: kernels from
        rational ell-torsion, edges resolved up to the isomorphism
        (a, b) ~ (u^4 a, u^6 b), level assigned by distance to the floor.
      level_proxy_prohibited: >-
        two_torsion_x_count and ell_subgroup_count(., 2) are PROHIBITED as level
        variables anywhere in this experiment.
      per_level_counts_required: >-
        The run reports the ACTUAL enumerated per-level vertex counts and the
        detection floor those counts imply, BEFORE reporting any level effect.
    t5_arm:
      class: "t = 211, p = 19717, D = -34347 = -3 * 107^2"
      structure_expected: "depth-1 107-volcano; 1 crater vertex at j = 0 (|Aut| = 6); 36 floor vertices (|Aut| = 2)"
      vertex_count_authority: >-
        The Hurwitz-Kronecker enumeration, NOT the class number: for D_0 = -3 the
        Deuring correspondence weights j = 0 by 1/3, so h(-3 * 107^2) = 36 is a
        cross-check on the floor and not a vertex count for the class.
      branch_i_commonness: >-
        Random walks on the Velu-constructed volcano from recorded seeds; the
        number of steps to FIRST reach a crater vertex is recorded PER SEED. The
        deliverable is the empirical distribution -- every per-seed value listed,
        plus minimum, median and maximum. A POINT ESTIMATE IS PROHIBITED.
      branch_ii_locality: >-
        The candidate local test is the number of F_p-rational 107-isogenies from
        a vertex. On a depth-1 volcano a floor vertex has exactly one (the
        ascending one) and a crater vertex has more, the count depending on the
        splitting of ell in the CM field. THE COUNTS ARE MEASURED EXHAUSTIVELY ON
        EVERY VERTEX and reported as measured; the textbook counts are NOT
        assumed.
      transport: >-
        gcd(107, 19507) = 1 with N prime, so T1 carries the ECDLP between crater
        and floor with the SAME k. At least one explicit transport with a
        certificate re-verified independently of the transport code.
    sampler:
      required: "harness/exp_icinv_fullgroup.py:485 targets_B"
      support_certificate: >-
        Support certified EQUAL to the enumerated point set of E(F_p) on every
        measured vertex. A single failure terminates the run PREMISE-FAILED.
      prohibited: >-
        exp_icinv.targets_uniform is PROHIBITED in every arm, for the reason
        stated in the objective. This is a refusal to reuse a disputed
        instrument, NOT a position on H-ICINV-6c7920.
    stratification:
      variable: "r = #{x in F_p : x^3 + a x + b = 0}, values in {0, 1, 3}"
      requirement: >-
        Every statistic reported per stratum as well as pooled, plus an exact
        contingency table of r against level for every class. If r is associated
        with level, the level effect and the r effect are CONFOUNDED within that
        class and the record must say so rather than attributing the difference
        to the endomorphism ring.
    density_grid:
      factor_base_rule: "exp_icinv.factor_base_fixed_size (first `size` liftable x from 0)"
      sweep_required: true
      saturated_row_alone_prohibited: true
      operating_density_target: 0.16666666
      committed_decay_reference: >-
        p = 4001: variance ratio 2.037 at density 0.5306, 1.826 at 0.3690, 1.337
        at 0.2237, 1.265 at 0.1144, 1.175 at 0.0745, 1.032 at 0.0437, 0.930 at
        0.0234 (red_team_notes.md section 4). Quoted as the reason for the sweep;
        not re-measured here.
    statistic_prohibitions:
      null_c: >-
        exp_icinv.permutation_null (NULL-C) may NOT be used anywhere in this
        experiment, in either direction. It is a between-class MEAN detector with
        power 1.00 at a 0.9% shift and median p = 0.0590 at zero planted shift
        (red_team_notes.md section 5), disqualified for any within-class contrast
        by its own committed characterisation. A result quoting it is
        inadmissible regardless of what it says.
    instrument_gate:
      blocking: true
      rule: >-
        BLOCKING under GOAL-ENDO-001 criterion C4. No conclusion may be drawn
        from any statistic that has not passed BOTH directions of
        EXP-INSTR-36c8cf at the ACTUAL per-level vertex counts of this design. An
        unmeasured control cell BLOCKS its conclusion; it does not pass it.
    source_constraints: >-
      harness/exp_icinv.py MUST NOT BE EDITED. New driver, new module, and a new
      Velu ell-isogeny graph builder for general odd ell, over
      harness/isogeny_class.py, harness/toycurve.py and
      harness/exp_icinv_fullgroup.py. Run manifests must pin the hash of every
      source file executed (harness/runner.py:source_provenance, audited by
      tools/check_run_source_provenance.py --strict) -- the standing A6
      precondition carried from EXP-ICINV-4d33aa amendment v2, which is BLOCKING.

  controls:
    - >-
      C-VELU-GATE. Rebuild the p = 4001, t = 30 2-volcano by Velu and reproduce
      the committed true level distribution {0: 3, 1: 9, 2: 18, 3: 36, 4: 72}
      EXACTLY, matching h(D_0 f'^2) at every level; and reproduce the agreement
      of two_torsion_x_count with ell_subgroup_count(., 2) on all 138 curves.
      This gates the NEW machinery against a committed object. Failure makes the
      run INVALID.
    - >-
      C-MATCHED-NULL, READ FIRST. An f = 1 class of the same matched-order family
      -- which has NO level axis by construction -- split into two arbitrary
      declared halves of the same sizes as the real levels, run through the
      identical level comparison. Its verdict is computed and WRITTEN TO THE RUN
      RECORD before the real level contrast is read (null-first,
      docs/inventor-protocol.md). If it shows an effect, every level result here
      is withdrawn and the deliverable is the instrument finding.
    - >-
      C-DETECTION-FLOOR. The chi-square dispersion detection floor implied by the
      ACTUAL per-level vertex counts and target count is computed and reported
      BEFORE any level effect. No effect below its own floor may be reported as
      an effect. Reference points from the campaign's own table: variance-ratio
      floor 1.250 at n = 138 T = 400, 1.355 at n = 72 T = 300, 3.668 at n = 3
      T = 300 (red_team_notes.md section 6).
    - >-
      C-SUPPORT. targets_B support certified equal to the enumerated E(F_p) on
      every measured vertex.
    - >-
      C-STRATUM. Full r-stratified reporting plus the exact r-against-level
      contingency table per class.
    - >-
      C-DENSITY. The full density sweep; the saturated row is never reported
      alone.
    - >-
      C-SEEDS. The T5 walk is run from at least the declared seed count and the
      FULL per-seed distribution is reported. A point estimate is prohibited.
    - >-
      C-LOCAL-EXHAUSTIVE. The rational-ell-isogeny count is evaluated on EVERY
      vertex of the t = 211 class and compared against its Velu-assigned level.
      One disagreeing vertex refutes HEUR-VOLC-1.
    - >-
      C-TRANSPORT-CERT. At least one explicit T1 transport between crater and
      floor with a certificate re-verified independently of the transport code
      (docs/claims-and-verification.md).

  independent_variables:
    - "true volcano level within a class, assigned by Velu construction"
    - "factor-base density (the swept grid)"
    - "r in {0, 1, 3}, as a stratification variable"
    - "arity m in {2, 3}"
    - "walk seed, for the T5 reachability distribution"

  metrics:
    primary:
      - "per-level mean and sd of decomposition_rate_m3, per class, per density row, per r stratum"
      - "per-level mean and sd of decomposition_rate_m2, per class, per density row, per r stratum"
      - "the chi-square dispersion detection floor implied by the actual per-level counts, per class, per density row"
      - "matched-null (f = 1 arbitrary halves) verdict, per density row -- computed and written FIRST"
      - "T5 branch (i): steps to first crater, per seed, full distribution"
      - "T5 branch (ii): rational-107-isogeny count per vertex against Velu level, exhaustive"
      - "T5 VERDICT in {reachable_by_commonness, reachable_by_local_test, both, neither}"
    secondary:
      - "enumerated per-level vertex counts per class, against h(D_0 f'^2)"
      - "exact contingency table of r against level, per class"
      - "liftable_density and decomposition_efficiency per vertex and per level"
      - "targets_B support-certificate outcome per vertex"
      - "the Velu-gate reproduction of the committed p = 4001 level distribution"
      - "T1 transport certificate outcomes"
      - "wall-clock and memory per class, for successor budgeting"

  heuristic_under_test: HEUR-VOLC-1
  heuristic_under_test_note: >-
    HEUR-VOLC-1 (the rational-ell-isogeny count is a LOCAL test separating crater
    from floor with zero error) is validated inside this experiment by the
    exhaustive per-vertex evaluation of C-LOCAL-EXHAUSTIVE, and it is what T5
    branch (ii) rests on entirely. HEUR-VOLC-2 (the within-class dispersion
    statistic detects a planted per-level shift and rejects the f = 1 matched
    null at the ACTUAL per-level counts) is NOT validated here: it is validated
    by EXP-INSTR-36c8cf, which is BLOCKING for this contract under GOAL-ENDO-001
    criterion C4.

  preregistered_prediction:
    quantity: >-
      The crater-versus-floor difference in relation density inside each
      conductor-arm class, compared against the detection floor implied by that
      class's ACTUAL per-level vertex counts; and the T5 verdict, computed from
      the per-seed walk-length distribution and the exhaustive local-test
      evaluation.
    formula: >-
      NO DIRECTION AND NO EFFECT SIZE IS PREDICTED FOR THE LEVEL ARM, AND NONE IS
      INVENTED. DECOMPOSITION.md section 5 prediction 2 records the campaign's
      standing expectation of NO effect stratified by volcano level, and the
      committed per-level table on the correct rebuilt volcano at p = 4001 shows
      no monotone trend (0.4800 / 0.4456 / 0.4489 / 0.4411 / 0.4519 at n = 3 / 9
      / 18 / 36 / 72). The preregistered quantity is therefore the per-level mean
      and sd REPORTED ALONGSIDE ITS OWN DETECTION FLOOR, and a difference is
      claimed only if it EXCEEDS that floor at a majority of density rows in the
      swept grid AND has the same sign in every r stratum meeting the reporting
      floor. THE DESIGN'S OWN IDENTIFIABILITY CEILING IS PREDICTED EXACTLY AND
      DERIVED, NOT MEASURED: within-class depth in the N = 19507 family is 1, so
      the level axis is a two-level contrast; the f = 107 class crater has ONE
      vertex, which supports a rank statement and no variance statement. FOR THE
      T5 GATE the predicted structure is likewise derived: the crater fraction is
      exactly 1/(enumerated class size), and branch (ii) succeeds only if the
      rational-107-isogeny count separates the two levels with ZERO exceptions
      across all vertices.
    source: >-
      analysis/endomorphism-isogeny-decomposition/MATCHED-ORDER-DESIGN.md
      sections 1, 3, 4 (E2 within-class arm, E3) and 5; DECOMPOSITION.md
      section 3 (T4, T5) and section 5 prediction 2; red_team_notes.md sections
      4, 5, 6 and 10 for the committed density-decay, NULL-C power,
      detection-floor and true-volcano-level tables; BATCH-cb71b5
      what_was_withdrawn for failure mode N5.

  scale_relevance:
    tier: toy
    justification: >-
      One matched group order N = 19507 (~14.25 bits), primes near 2^14.3,
      within-class volcano DEPTH 1 only, a 37-vertex T5 class. NO TRANSFER IS
      CLAIMED to depth greater than 1, to a second N, to relation-collection COST
      as opposed to density, to reachability at any larger scale, or to the ECDLP
      in the prime-order subgroup. Any positive T5 verdict is a statement about a
      37-vertex volcano and must be reported alongside the statement that at
      cryptographic scale the corresponding problem is CSIDH vectorization, about
      p^{1/4} classically at best.
    correspondence: null
    correspondence_note: >-
      No sampling correspondence is used to reach scale. Every vertex is
      enumerated directly, the volcano is constructed explicitly, and the T5 walk
      is measured exhaustively rather than modelled. The GRH-conditional rapid
      mixing of the class-group Cayley graph cited in DECOMPOSITION.md section 3
      is CITED, NOT PROVED, and is not load-bearing here.

  tail_checks:
    - >-
      WALK-LENGTH TAIL. The minimum and maximum per-seed walk length are reported
      explicitly alongside the median, and every per-seed value is listed. A
      summary without the full list is incomplete, and this is the exact failure
      that produced the withdrawal of the 94.7%-of-ceiling walk result.
    - >-
      CRATER TAIL. On classes whose crater carries few vertices, the individual
      per-vertex values are listed against the full floor distribution rather
      than summarised by a mean.
    - >-
      LOCAL-TEST TAIL. Every vertex whose rational-ell-isogeny count disagrees
      with its Velu-assigned level is listed individually; there must be none for
      branch (ii) to be declared available.
    - >-
      DENSITY TAIL. The lowest and highest density rows are reported explicitly
      alongside the operating row, so an effect that exists only at saturation is
      visible as such.
    - >-
      SUPPORT-CERTIFICATE TAIL. Any vertex whose targets_B support certificate is
      not an exact set equality is listed individually; there must be none.

  replication:
    seeds: [20260810, 20260811, 11235813, 20260812, 20260813, 20260814, 20260815, 20260816]
    seeds_note: >-
      At least eight seeds, chosen because the committed failure this contract
      discharges was a SINGLE-DRAW walk result whose 8-seed mean sat on the
      ceiling (BATCH-cb71b5 what_was_withdrawn). Seeds govern the target draw and
      the walk; the exact sum sets are seed-independent and must be computed once
      per (vertex, factor-base size) and reused.
    independent_instances: 2
    independent_instances_note: >-
      The conductor arm supplies TWO classes with a level axis (f = 3 and
      f = 107) at this matched order, and the T5 gate has exactly ONE class. This
      is a small number of independent instances and it is a property of the
      design, stated here rather than discovered later. A second matched N and a
      deeper volcano are the named successors and are NOT in this contract.

  budget:
    wall_clock_seconds_per_run: 21600
    total_cpu_hours: 36
    maximum_memory_gb: 8
    maximum_runs: 24
    budget_provenance: >-
      COORDINATOR-SET. MATCHED-ORDER-DESIGN.md states no budget for E2's
      within-class arm or for E3. These figures bound the task and are not
      derived from any measurement. Exhausting them is a budget event under
      AGENTS.md rule 5, reported as such, and never as a null level effect and
      never as an unreachable T5 verdict.
    dominant_cost: >-
      Exact m = 3 sum-set enumeration over the conductor-arm vertices at
      #E = 19507, plus one Velu ell-isogeny graph construction per class at
      ell = 107 (degree-107 kernels, the heaviest single item). The T5 walk is
      negligible at 37 vertices. Sum sets are computed once per (vertex,
      factor-base size) and reused across seeds, density rows and statistics.

  stopping_rules:
    - >-
      SR1 VELU GATE, RUNS FIRST, COSTS MINUTES. Rebuild the p = 4001 2-volcano
      and reproduce {0: 3, 1: 9, 2: 18, 3: 36, 4: 72} exactly. If it fails, STOP:
      the level machinery is wrong and nothing downstream is interpretable. Run
      INVALID, returned to the executor as a defect.
    - >-
      SR2 FAMILY GATE. Re-derive the N = 19507 family and the t = 211 class
      structure; verify #E = 19507 per curve; obtain completeness certificates.
      Disagreement terminates PREMISE-FAILED.
    - >-
      SR3 SUPPORT GATE. Certify targets_B's support on every measured vertex
      before any rate is recorded. A single failure terminates PREMISE-FAILED.
    - >-
      SR4 NULL FIRST. The f = 1 matched-null verdict is computed and WRITTEN TO
      THE RUN RECORD before the real level contrast is read. The ordering is part
      of the protocol, not a convenience.
    - >-
      SR5 FLOOR BEFORE EFFECT. The detection floor implied by the actual
      per-level counts is computed and written before any level effect is
      reported. No effect below its own floor may be described as an effect.
    - >-
      SR6 INSTRUMENT GATE, BLOCKING. Do not read or report any level verdict
      until EXP-INSTR-36c8cf has delivered, at the ACTUAL per-level counts, a
      detection floor and a false-positive rate for every statistic used.
    - >-
      SR7 FROZEN GRID. Stop at the declared N, classes, ell values, factor-base
      sizes, density rows, target counts and seeds. No extension without a
      versioned protocol_amendment filed BEFORE the extra data is generated.
    - >-
      SR8 BUDGET. On exceeding wall_clock_seconds_per_run, stop that run and
      record status failed_infrastructure with partial artifacts retained. Per
      AGENTS.md rule 5 this is never negative mathematical evidence and never a
      verdict -- in particular an exhausted walk budget is NOT an unreachable T5
      verdict.
    - >-
      SR9 NO OUTCOME SHOPPING. Every verdict, including the T5 verdict, is
      computed by the frozen rule inside the run and written to the run record.
      It is not selected afterwards and the set of reported metrics does not
      depend on which verdict fired.
    - >-
      SR10 BASELINE PAUSE. If any level or crater/floor ratio appears to exceed
      the automorphism-discounted rho baseline, STOP and escalate: GOAL-ENDO-001
      pause condition P3 requires an independent review-adversarial session
      before any record states the excess, and review-breakthrough at max effort
      before any record calls it a break.

  invalidation_rules:
    - >-
      Any use of exp_icinv.targets_uniform in any arm.
    - >-
      Any use of exp_icinv.permutation_null (NULL-C) anywhere in this experiment,
      in either direction.
    - >-
      Any use of two_torsion_x_count or ell_subgroup_count(., 2) as a level or
      crater variable.
    - >-
      Reporting only the saturated density row, or omitting the density sweep.
    - >-
      Reporting a walk length as a point estimate, or from fewer than the
      declared seed count.
    - >-
      Omitting r stratification or the r-against-level contingency table.
    - >-
      Reporting a level effect without the detection floor implied by the actual
      per-level counts, or reading the level contrast before the matched-null
      verdict is written.
    - >-
      Pooling these results with EXP-JINV-bd141d's, or running the between-class
      |D_0| contrast here.
    - >-
      Any curve with #E(F_p) != 19507, or any class without a completeness
      certificate.
    - >-
      Any edit to harness/exp_icinv.py; any run manifest that does not pin the
      hash of every source file executed.
    - >-
      Any reference value quoted from a committed record without being read from
      that record at run time and bound by a source_sha256. Transcription at any
      precision is prohibited (EXP-ICINV-4d33aa amendment v2 change A4,
      CORR-20260807-a24675).

  success_criterion: >-
    THE CONTRACT SUCCEEDS WHEN THE LEVEL AXIS IS MEASURED WITH ITS OWN RESOLUTION
    STATED AND THE T5 GATE IS DECIDED -- not when a particular direction is
    observed. Concretely, ALL of the following hold: (1) SR1-SR5 pass; (2) the
    per-level vertex counts and their implied detection floor are reported before
    any effect; (3) the f = 1 matched-null verdict is written before the real
    contrast is read and shows no effect; (4) per-level means and sds are
    reported for every conductor-arm class at every density row and every r
    stratum, with the r-against-level contingency table; (5) the T5 walk is run
    from at least eight seeds with the FULL per-seed distribution reported, and
    the local test is evaluated on EVERY vertex of the t = 211 class; (6) at
    least one T1 transport certificate is emitted and independently re-verified;
    and (7) the run emits BOTH frozen verdicts, computed inside the run: a LEVEL
    verdict in {LEVEL-EFFECT, NO-LEVEL-EFFECT, NOT-RESOLVABLE} and a T5 verdict
