# EXP-ECDLP-642207
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261004-d1bc0c.
experiment:
  id: EXP-ECDLP-642207
  hypothesis_id: H-ECDLP-07996e
  source_idea: IDEA-20261004-4db42d
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-30 table versus width-29 table
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-d1bc0c
  objective: >-
    Check the table sizes 536870912 and 268435456, the product 144115188075855872, and the nearby gap 0.
  inputs:
    width_hi: 30
    width_lo: 29
    table_hi: 536870912
    table_lo: 268435456
    table_gap: 268435456
    table_product: 144115188075855872
    table_sum: 805306368
    nearby_a: 268435456
    nearby_b: 268435456
    nearby_gap: 0
    nearby_product: 72057594037927936
  controls:
    - >-
      Two to the power 29 is 536870912. Two to the power 28 is 268435456.
      Reporting both tables as size 268435456 drops the gap and invalidates
      the run.
    - >-
      Five hundred thirty-six million eight hundred seventy thousand nine
      hundred twelve exceeds two hundred sixty-eight million four hundred
      thirty-five thousand four hundred fifty-six by 268435456. The product
      of the two sizes is 144115188075855872. Their sum is 805306368.
    - >-
      Two width-29 tables each store 268435456. Their gap is 0 and their
      product is 72057594037927936.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-30 table stores 536870912 entries. The width-29 table stores
      268435456. The gap of two width-29 tables is 0.
    formula: >-
      Compute 2 to the power 29. Compute 2 to the power 28. Subtract
      268435456 from 536870912. Multiply 536870912 by 268435456. Subtract 268435456 from 268435456.
    source: >-
      IDEA-20261004-4db42d states the widths 30 and 29 and the sizes
      536870912 and 268435456, read 2026-10-04. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 144115188075855872 and the nearby gap 0 are required. A check that stops at the size 536870912 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 536870912 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 29 is not 536870912.
    - Two to the power 28 is not 268435456.
    - The gap is not 268435456.
    - The product is not 144115188075855872.
    - Both tables are reported as size 268435456, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-30 table stores 536870912 entries, that
    the width-29 table stores 268435456, and that 536870912 exceeds 268435456 by 268435456.
  falsification_criterion: >-
    The runs agree that the width-30 table size is computed, and
    that size is not 536870912.
  required_artifacts:
    - experiments/EXP-ECDLP-642207/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-642207/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-642207/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-642207/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-642207/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-642207/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 268435456 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
