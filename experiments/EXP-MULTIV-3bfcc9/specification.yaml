experiment:
  id: EXP-MULTIV-3bfcc9
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-b0046a; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-b0046a
  question_id: RQ-QRUOV-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Cross-scheme rank fingerprint census: empirical rank distribution of random combinations
    of public coefficient matrices for four UOV-family schemes against a random symmetric space and
    an isotropy-only null.'
  objective: 'The uncertainty reduced is whether one cheap public-key statistic separates the four
    schemes from each other and from a structureless form space, and whether the separation is fully
    explained by each transform. Stated as parts: (i) the run computes the empirical rank histogram
    of 10^5 random combinations for each of four scheme-shaped keys at matched flattened dimensions,
    using one rank routine shared by every arm, so that any difference between arms cannot be an implementation
    difference; (ii) it computes the same histogram for a uniformly random symmetric matrix space,
    which must reproduce a closed-form q-analogue law and thereby validates the instrument, and for
    an isotropy-only random space that carries an oil-shaped subspace but no algebra, which separates
    the oil space''s contribution from the compression''s; (iii) it subtracts, per arm, the deviation
    that the transform alone forces - rank quantisation modulo ell, k-fold repetition under whipping,
    exact invariance under seed compression - and reports the residual, which is the only part that
    could indicate something the transform does not already explain. The run recovers no key, performs
    no search, and produces histograms and distances only.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supported scope is: at the named toy flattened dimensions
      over the named fields, the rank distribution of random combinations of each scheme-shaped public
      key is as reported, differs from the two nulls by the reported total variation distances, and
      leaves the reported residual after the transform-forced component is subtracted. What does NOT
      follow: no attack, no distinguishing advantage of cryptographic significance, no security consequence
      - the structure these fingerprints reflect is public by construction - and nothing about deployed
      parameter sets, where neither the dimensions nor the sampling regime are tested here.'
  inputs:
    procedure: 'STAGE 0, dimension matching (cost: human): find and record parameter cells where the
      four schemes'' flattened dimensions coincide exactly; report cells where they cannot. STAGE
      1, one rank routine (cost: low): exact F_q Gaussian elimination with unit tests against forced
      values. STAGE 2, null validation (cost: minutes): random symmetric space histogram against the
      closed-form q-analogue law; abort on mismatch. STAGE 3, invariance controls (cost: minutes):
      congruence and equation-basis recombination must leave every histogram unchanged. STAGE 4, four
      scheme arms (cost: minutes per cell): 10^5 samples each. STAGE 5, isotropy-only null and seed-compression
      invariance check (cost: minutes). STAGE 6, analysis (cost: minutes): histograms, divisibility
      fractions, pairwise total variation distances, and residuals against the transform-forced predictions.'
    instrument: Python 3 with exact F_q arithmetic via precomputed log/antilog tables for q in {2,
      4, 8}; one Gaussian elimination rank routine shared byte-for-byte by every arm; key construction
      modules for the four scheme shapes reusing the transform implementations, with a single form-construction
      routine so that characteristic-2 conventions cannot differ between arms; histogram and total
      variation computed in plain Python integers. No computer algebra system and no Sage. Driven
      by harness/runner.py for seeds and manifests.
    parameters: q in {2, 4, 8}; flattened n in {8, 12, 16}; m in {4, 6, 8}; oil dimension o = m where
      a scheme has one; algebra dimension ell in {2, 3} for the ring-structured arms; whipping k in
      {2, 3} for the whipped arm with the underlying map sized so the flattened n matches; 10^5 random
      combinations per key; 10 independently generated keys per arm per cell so that between-key dispersion
      is visible; 6 arms per cell.
  controls:
  - Uniformly random symmetric matrix space of identical dimension, measured by the identical routine
    in the same invocation.
  - Isotropy-only null with a planted common isotropic subspace but no algebra structure, isolating
    the oil space's contribution.
  - 'Seed-compression invariance control: the same key with and without seed compression must give
    byte-identical histograms.'
  - 'Congruence-invariance control: apply a random invertible congruence to all P_i and confirm the
    histogram is unchanged, which is what makes it an invariant rather than a coordinate artifact.'
  - 'Equation-basis control: replace the P_i by a random invertible linear recombination of themselves
    and confirm the histogram is unchanged.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a uniformly random m-dimensional space of symmetric
    n by n matrices over F_q, with no oil space and no algebra structure, sampled and measured by
    the identical rank routine in the same invocation. For any scheme''s fingerprint to mean anything,
    the null arm must reproduce the closed-form q-analogue rank law for random symmetric matrices
    within its sampling interval; if it does not, the rank routine or the sampler is wrong. A second,
    sharper null is a random space of symmetric matrices constrained ONLY to have a common isotropic
    subspace of dimension o, which isolates the oil space''s contribution from the compression''s.'
  independent_variables:
  - scheme arm
  - field size q
  - flattened dimension n
  - algebra dimension ell
  - whipping factor k
  metrics:
    primary:
    - normalised rank histogram per arm
    - fraction of ranks divisible by ell
    - pairwise total variation distance between arms
    - residual against the transform-forced prediction
    secondary:
    - closed-form null law values
    - between-key dispersion of the histogram within an arm
    - invariance-control agreement
    - wall clock per cell as cost
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The normalised distribution of rank(sum c_i P_i) over uniform c in F_q^m, per scheme
      arm, and its total variation distance to the two nulls.
    formula: 'Null law: for a uniformly random symmetric n by n matrix over F_q, the probability of
      corank d is the standard q-analogue expression, whose values at (q, n) = (4, 12) are computed
      and frozen in the run log before sampling. Transform-forced predictions: for an arm built from
      ell by ell blocks over an algebra, P(rank not divisible by ell) is predicted to be 0 in the
      pure-block case; for a whipped arm with factor k, the predicted rank of a uniform combination
      is k times the underlying-map rank for block-uniform coefficient vectors, which occur with probability
      q^{-(k-1)m}; for seed compression, the predicted histogram difference is exactly 0.'
    source: Pre-registered in the parent proposal IDEA-20260816-b0046a before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested at flattened n <= 16 over q <= 8, chosen so that exact rank computation
      is cheap enough for 10^5 samples per arm and so that four schemes can be given exactly matching
      flattened dimensions, which larger parameters make progressively harder rather than easier.
      No transfer to deployed parameters is claimed; the histogram's behaviour at cryptographic dimensions
      is not measured and is listed as an open direction.
    correspondence: null
  tail_checks:
  - the low-rank tail, where MinRank-style structure would live and where sampling is thinnest; reported
    as a raw count, never as a rate, when the count is below 30
  - q = 2, where rank coincidences are most common
  - the largest ell tested, where quantisation should be most visible
  - block-shaped dimensions with no algebra, if that control is added, to check quantisation is not
    dimensional
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - abort if the null arm fails the closed-form law check
  - abort if any invariance control changes a histogram
  - stop at 10^5 samples per key; report low-rank tail counts as counts rather than extending sampling
    to chase a rate
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All six arms are measured by one shared rank routine in one invocation at each
    cell, the null arm reproduces the closed-form law, both invariance controls pass, and every arm's
    histogram, distances and residual are reported whatever they show.
  falsification_criterion:
  - Null arm fails the closed-form q-analogue law check.
  - Seed-compression invariance control shows any histogram difference.
  - Congruence or equation-basis invariance control changes a histogram.
  - All four scheme arms are within sampling intervals of the isotropy-only null, falsifying the fingerprint
    claim at the tested scope.
  - Rank quantisation modulo ell appears in the null arm.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-b0046a
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - A block-shaped-but-algebra-free control is needed to separate quantisation forced by block dimensions
    from quantisation forced by the algebra, and it is not specified here; the Coordinator must decide
    whether to add it, because without it a positive result is ambiguous.
  - Exact parameter cells where all four schemes share flattened dimensions are asserted to exist
    but not exhibited; they must be found and frozen before approval.
  - The closed-form q-analogue rank law for symmetric matrices differs between even and odd characteristic
    and the correct branch per cell must be fixed in advance rather than chosen after seeing the null.
