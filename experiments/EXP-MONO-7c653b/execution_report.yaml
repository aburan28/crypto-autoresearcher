  protocol_deviations:
    - >-
      s5_expr is defined LOCALLY in implementation/run_experiment.py, not
      added to the shared harness/semaev.py, because this task's own
      operating instructions restrict writes to
      experiments/EXP-MONO-7c653b/ and prohibit any git command in this
      shared worktree (a different concurrent session currently owns this
      branch). Disclosed per the handoff's own instruction to disclose
      whichever choice is made and why; see implementation.md for full
      reasoning.
    - >-
      The seed_derivation_rule's domain string is resolved as
      f"EXP-MONO-7c653b/v1/run-{seed}" (master_seed folded in as a per-run
      suffix), following EXP-MONO-805a02's own precedent, because the
      contract's literal formula omits master_seed as an explicit hash
      component while requiring reproduction "from (master_seed, domain,
      label, p, m, counter)". Verified empirically (Stage 3/4a tuples and
      Stage 4a's delta' differ between the two runs) to actually produce
      independent draw streams, avoiding EXP-MONO-805a02's own disclosed
      Stage-2 defect (identical samples across nominally different seeds).
    - >-
      Stage 4a's delta' is drawn ONCE for the whole stage, not redrawn per
      trial; the contract's mechanism text does not unambiguously specify
      either reading. See implementation.md for the reasoning and the exact
      point of divergence if a future reviewer judges per-trial redraw was
      intended.
    - >-
      RUN-MONO-7c653b-1's /usr/bin/time wrapper failed a sysctl call under
      sandbox; its benign stderr artifact is preserved verbatim rather than
      cleaned, and RUN-MONO-7c653b-2 was launched without the wrapper (no
      useful measurement would have been gained by repeating a failing
      wrapper). RUN-MONO-7c653b-2's resources.cpu_seconds is therefore null,
      disclosed as such.
    - >-
      On-curve factor base construction (Stage 1) is disclosed as a
      residue-analogue reading of the contract's explicit
      non_residue_and_delta_construction clause; the contract does not
      spell out the on-curve construction with the same explicit detail.

