    gate_outcome: PASS in both runs; Stage 3 and Stage 4a were interpreted in both.

  stage3_twist_cost_identity:
    description: >-
      j=m-1 (all-non-residue) tuples, m in {4,5}, p in {211,1009}, n=500 per
      m=4 cell / n=200 per m=5 cell, tuples drawn from the twisted factor
      base under label "twisted-fb-tuple". Direct route: s4_expr/s5_expr
      specialized and factored mod p (split_with_multiplicity and
      split_distinct computed and reported SEPARATELY, never pooled).
      Twist route: E_delta group arithmetic per the frozen contract's own
      construction, x(Q) := X(R)*inverse(delta) mod p. Compare: exact SET
      equality per tuple.
    twisted_factor_base:
      p211: {size: 100, delta: 57, delta_source_x: 0, sha256_digest: f4491f210a84cb47f78a7372a6f848be83b4389aa8eef6e63718edd71dfea3b2}
      p1009: {size: 473, delta: 19, delta_source_x: 0, sha256_digest: 3fe9d721a2ebff5698208fe21dbe48f29c060abe63228a848741a3cc9b4fdd43}
      note: >-
        Identical size, delta, and digest in both official runs (the
        construction is deterministic and seed-independent, as required),
        confirmed directly, not assumed.
    exact_match_rate:
      run_1: {m4_p211: 1.0, m4_p1009: 1.0, m5_p211: 1.0, m5_p1009: 1.0}
      run_2: {m4_p211: 1.0, m4_p1009: 1.0, m5_p211: 1.0, m5_p1009: 1.0}
      tail_check_m5: >-
        m=5 (the largest tested arity, per this contract's own tail_checks
        clause) reads exact_match_rate=1.0 at BOTH p in BOTH runs,
        reported here separately from m=4's rate as required, not pooled.
      mismatches_observed: NONE. first_mismatch is null in every (m,p) cell of both runs.
    split_with_multiplicity_rate:
      run_1: {m4_p211: 1.0, m4_p1009: 1.0, m5_p211: 1.0, m5_p1009: 1.0}
      run_2: {m4_p211: 1.0, m4_p1009: 1.0, m5_p211: 1.0, m5_p1009: 1.0}
    split_distinct_rate:
      run_1: {m4_p211: 1.0, m4_p1009: 0.992, m5_p211: 0.925, m5_p1009: 0.945}
      run_2: {m4_p211: 1.0, m4_p1009: 0.99, m5_p211: 0.94, m5_p1009: 0.955}
      note: >-
        Reported SEPARATELY from split_with_multiplicity_rate per the
        contract's own MULTIPLICITY-AND-DISTINCT-BOTH-REPORTED control.
        Every observed shortfall below 1.0 is a REPEATED root case
        (split_with_multiplicity remains 1.0 in every such cell), never a
        non-split case.
    operation_count_reconciliation:
      convention: >-
        Per attempt (one sign class of the 2^(m-2) up to global sign):
        exactly m-1 EllipticCurve.add calls (acc starts at the point at
        infinity / None; folding all m-1 signed twist points costs one
        add() call each) plus one final F_p multiplication
        (X(R)*inverse(delta)). Reported HERE, beside (never folded into)
        H-MONO-40aca5's own D_trial(E)=m-1 count for the j=0 branch.
      measured_vs_expected:
        run_1:
          m4_p211: {measured: 6000, expected: 6000, reconciles_exactly: true}
          m4_p1009: {measured: 6000, expected: 6000, reconciles_exactly: true}
          m5_p211: {measured: 3200, expected: 3200, reconciles_exactly: true}
          m5_p1009: {measured: 3200, expected: 3200, reconciles_exactly: true}
        run_2:
          m4_p211: {measured: 6000, expected: 6000, reconciles_exactly: true}
          m4_p1009: {measured: 6000, expected: 6000, reconciles_exactly: true}
          m5_p211: {measured: 3200, expected: 3200, reconciles_exactly: true}
          m5_p1009: {measured: 3200, expected: 3200, reconciles_exactly: true}
      twisted_factor_base_build_cost: >-
        Reported SEPARATELY (sub-millisecond at both p in both runs), never
        charged against per-attempt cost, per H-MONO-40aca5's own H2
        convention.
    factor_degree_multiset_summary: >-
      Every irreducible factor observed, at every (m,p) cell, in both runs,
      has degree exactly 1 (no factor of degree >=2 was ever observed).
      Full per-cell multisets are recorded verbatim in each run's own
      raw-result.json under stage3.cells.<cell>.factor_degree_multiset.
    timed_out: false in every (m,p) cell of both runs (s5_expr's 300s per-cell timeout never triggered).

