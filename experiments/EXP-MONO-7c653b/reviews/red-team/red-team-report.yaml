  # =====================================================================
  # JOINT 2 -- STAGE-4A MUTANT ISOLATION
  # =====================================================================
  joint_2_mutant_isolation:
    verdict: HOLD
    code_reading: >-
      implementation/run_experiment.py. `stage4a()` (lines 587-677) builds
      `E_delta = EllipticCurve(p, (a*delta*delta)%p, (b*delta**3)%p)` at line
      592 and `points_delta = build_points_delta(a, b, p, delta, tuple_x)` at
      line 631 -- BOTH parameterized by the CORRECT `delta`, never
      `delta_prime`. `mutant_twist_route_xset()` (lines 319-336) takes the
      already-built `E_delta`/`points_delta` and runs the IDENTICAL
      accumulation loop as `twist_route_xset()` (lines 295-316, Stage 3's own
      route: same `E_delta.negate`/`add_counter` calls, same sign
      enumeration over eps in {+1,-1}^(k-1) with eps_0 fixed). `delta_prime`
      is used in exactly two places in the whole file: `inv_delta_prime =
      pow(delta_prime, -1, p)` (line 324) and `xQ = (acc[0] *
      inv_delta_prime) % p` (line 334) -- both AFTER `acc` (the full signed
      sum R) has already been computed using delta-based points. Grepped
      every occurrence of "delta_prime"/"delta'" in the file (11 hits: 319,
      322, 324, 334, 341, 596, 598, 608, 610-612, 633, 658-659, 671) -- none
      is inside `build_points_delta` or an `EllipticCurve(...)` construction
      call. This is exactly and only the final-rescaling mutation, matching
      the contract's own PROVES-TOO-MUCH-WRONG-RESCALING-MUTANT control
      description verbatim.
    excluded_mutants_confirmed_absent: >-
      (a) Sign flip on y_i': not present -- `mutant_twist_route_xset` uses
      the SAME `points_delta` list and the SAME `E_delta.negate` calls as
      Stage 3's own `twist_route_xset`; no separate y'-negation code path
      exists anywhere in the file. (b) Rebuilding both twist and rescaling
      with the same delta': not present -- `E_delta` and `points_delta` are
      each built exactly once per stage4a() call, both parameterized by
      `delta` (verified above); `delta_prime` never appears as an argument to
      `build_points_delta` or to `EllipticCurve(...)`.
    hand_reconstruction: >-
      Fresh, independent script (rt1_mutant_reconstruction.py, this
      directory) implementing textbook affine short-Weierstrass point
      addition and a brute-force modular square root FROM SCRATCH -- no
      import of harness/toycurve.py or run_experiment.py's own group-law/sqrt
      code. Reconstructed RUN-1's own stage4a trial 0 (m=4, p=211, a=37,
      b=57, delta=57, delta_prime=102, tuple_x=[5,163,155]):
        twist points (74,58),(7,44),(184,99) on E_delta: y^2=x^3+154x+93 (mod
        211), independently verified on-curve;
        rescaling the 4 signed-sum results by inverse(delta) gives x-set
        {5,67,144,171} -- EXACTLY the raw-result.json direct_route_xset for
        this trial (confirms the reconstruction is faithful before the
        mutation is even applied);
        rescaling the SAME 4 signed-sum results by inverse(delta_prime)
        instead gives x-set {6,9,139,205} -- EXACTLY the raw-result.json
        mutant_twist_route_xset for this trial, and disjoint from
        {5,67,144,171}.
      Script output reproduced by re-running it in this session; all
      assertions pass.
    full_batch_algebraic_corroboration: >-
      Beyond the single hand-worked trial, script rt3_full_batch_scale_relation.py
      checks the closed-form identity mutant_xset == {(delta *
      inverse(delta_prime) * c) mod p : c in direct_route_xset} against ALL
      50 trials in BOTH official runs, using only the values already recorded
      in each run's raw-result.json (no group-law re-execution needed for
      this check). RESULT: 50/50 trials in RUN-1 (fixed scale constant
      delta*inv(delta')=44 mod 211) and 50/50 trials in RUN-2 (fixed scale
      constant 73 mod 211) satisfy the identity exactly, and the constant is
      never 1. This relation can hold for every trial only if the
      pre-rescaling accumulator X(R) is IDENTICAL between the correct route
      and the mutant route in every single trial -- i.e. it is a full
      algebraic proof, not a spot check, that delta_prime enters nowhere
      except the one final division, across the entire sample in both runs.
      This also explains MECHANISTICALLY why the agreement rate is 0/50
      rather than merely "observed to be 0/50": each mutant x-value is the
      corresponding correct x-value times a FIXED nonzero, non-unity scalar,
      which for a generic value produces an unequal result -- matching the
      contract's own forced_output reasoning ("the returned x-set is scaled
      by delta/delta' != 1").
    breaking_artifact_check: >-
      NOT FOUND. No evidence the mutant construction secretly perturbs
      anything besides the final rescaling; no hand-reconstructed trial
      matches the direct route.

  # =====================================================================
  # JOINT 3 -- 499-VS-500 DISCREPANCY
  # =====================================================================
  joint_3_tuple_count_discrepancy:
    verdict: HOLD (substantive) WITH REQUIRED CORRECTION (execution_report.yaml)
    exact_mechanism: >-
      `independent_sample_check()` (run_experiment.py lines 680-714)
      redraws Stage 3's OWN "twisted-fb-tuple" SHA-256 stream for p=211, m=4
      -- a bit-identical reproduction of `stage3_cell`'s own draw sequence,
      since `SeedStream`/`draw_distinct` are pure functions of (domain,
      label, p, m, counter) and `tfb["xs"]` (itself a deterministic scan) --
      and stores each of the 500 draws as `tuple(sorted(draw_distinct(...)))`
      inside a Python `set()` (line 693). Re-executing this exact code
      (script rt2_tuple_count_discrepancy.py, this directory, importing
      run_experiment.py's own SeedStream/draw_distinct/twisted_factor_base
      functions -- an investigative reproduction of an already-executed
      deterministic PRNG stream, distinct from the from-scratch blind
      re-derivation assigned to the other joint) reproduces the discrepancy
      exactly and locates its origin: for domain="EXP-MONO-7c653b/v1/run-20260905"
      (RUN-1's own domain), trial index 218 (0-indexed) draws [121,78,103]
      and trial index 206 drew [103,78,121] -- the SAME 3-element value-set
      {78,103,121}, just in a different internal Fisher-Yates pop order. The
      `set()` collapses these two distinct trials into one entry, yielding
      len(s3_tuples)=499 against 500 actual draws.
    why_this_is_benign_not_a_dropped_or_duplicated_trial: >-
      `stage3_cell`'s own loop (`for i in range(n): ... trials_completed +=
      1`, lines 458-500) increments `trials_completed` unconditionally once
      per iteration, independent of the drawn value; trial 206 and trial 218
      are TWO separate, fully-executed pipeline runs (two separate
      `poly_split_analysis` calls on the direct-route Semaev polynomial, two
      separate `build_points_delta`/`twist_route_xset` calls on the twist
      route, two separate match comparisons) -- nothing is cached, skipped,
      or reused across iterations. Moreover the two trials are PROVABLY
      forced to agree on outcome regardless: Semaev's S_4 is symmetric under
      permutation of its three fixed arguments, and the twist-route signed
      sum is symmetric under permutation of the input points (elliptic-curve
      addition is commutative, and the code's own eps-enumeration already
      ranges over the complete 2^k sign set up to global negation regardless
      of input order) -- so trials 206 and 218 compute mathematically
      IDENTICAL direct-route and twist-route outputs, only differing in
      which coordinate is internally labelled first. The coincidence could
      not, even in principle, have silently inflated or deflated
      exact_match_rate. n_completed=500 for this cell is the correct count
      of genuinely executed, independently evaluated trials.
    plausibility_check: >-
      p=211's twisted factor base has size 100 (verified:
      `twisted_factor_base(211,37,57)["size"]==100`), giving C(100,3)=161700
      possible 3-element subsets. A birthday-bound estimate for 500 draws
      gives P(>=1 collision) = 1-exp(-500*499/(2*161700)) ~= 0.538 -- an
      unsurprising, roughly-coin-flip-odds event, not evidence of a tracking
      defect.
    generalization_check_all_cells_both_runs: >-
      Re-ran the identical duplicate-detection logic (rt2_tuple_count_discrepancy.py)
      for all 8 (seed, cell) combinations: RUN-1 m4_p1009 (fb=473): 0
      duplicates in 500 draws. RUN-1 m5_p211 (fb=100): 0 duplicates in 200
      draws. RUN-1 m5_p1009 (fb=473): 0 duplicates in 200 draws. RUN-2, all
      four cells (m4_p211, m4_p1009, m5_p211, m5_p1009): 0 duplicates. RUN-1's
      m4_p211 cell is the ONLY one of 8 with a repeated value-set, consistent
      with it having by far the smallest factor base (100 vs 473) and hence
      the highest per-draw collision probability -- not with any
      cell-specific code defect. Note that `independent_sample_check()` is
      only ever COMPUTED for the m4/p211 cell in the first place (Stage 4a
      itself is fixed at m=4,p=211 by the contract), so raw-result.json
      carries no equivalent field for the other three Stage-3 cells to be
      discrepant in; I supplied the missing comparison directly.
    required_correction_found_beyond_the_assigned_question: >-
      execution_report.yaml line 134 states `run_1: {stage3_m4_p211_tuple_count:
      500, stage4a_tuple_count: 50, overlap_count: 0}` -- this is FACTUALLY
      WRONG. RUN-1's own raw-result.json records stage3_m4_p211_tuple_count
      as 499, not 500. implementation.md (~line 240) independently describes
      the check as recomputing "Stage 3's own 500-tuple m4_p211 sample"
      without disclosing the collision anywhere. This is a stronger finding
      than "not disclosed": the Executor's own summary artifact contains an
      incorrect transcription of its own raw data for RUN-1, silently
      smoothing the anomalous value to match RUN-2's clean 500 rather than
      reporting the observed value. This does not change the validity of
      Stage 3's exact_match_rate (see above) but the record cannot be
      archived with execution_report.yaml stating a number contradicted by
      its own cited raw-result.json.
    breaking_artifact_check: >-
      NOT FOUND on the substantive question (no dropped/duplicated trial). A
      DIFFERENT, narrower defect WAS found: execution_report.yaml's own
      summary number for run_1 is wrong and must be corrected to 499 with
      the mechanism disclosed, before this record is treated as complete.

