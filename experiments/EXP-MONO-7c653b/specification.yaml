experiment:
  id: EXP-MONO-7c653b
  hypothesis_id: H-MONO-10ca08
  version: 1
  title: >-
    Quadratic-twist cost identity for the j=m-1 (all-non-residue) Semaev
    summation locus: exact-match verification of a hand-derived
    representation-reduction, plus its wrong-rescaling-constant control
  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-09-05'
  coordinator_approval_rationale: >-
    APPROVED after independent read-through of this contract and
    H-MONO-10ca08 by the orchestrating Coordinator. This is a small,
    standalone experiment under the classic lifecycle
    (docs/task-lifecycle.md steps 3-7), not a GOAL-MONO-001 campaign
    batch, drawing on no exhausted campaign budget. The pre-design
    observation-collision audit against EXP-MONO-12ce1c is independently
    verified sound: that contract's own specification and evidence record
    contain no quadratic-twist, E_delta, or trace-zero-subgroup
    construction anywhere, confirming this contract's own claim (the
    twist cost identity, HEUR-PARITY-3) is genuinely untested. The
    Coordinator's own disclosed scoping decision (dropping
    IDEA-20260830-d84f6a's Stage 2 j-ladder census and Stage 4b
    tau=4-vs-fixture control, since EXP-MONO-12ce1c's own tau in {1,2,4}
    panel already bears on both at greater rigor) is concurred with and
    is reversible by any future record per H-MONO-10ca08's own
    `superseded_design_for_reference`. Budget (1800s/2GB/2 runs) is
    justified by name against EXP-MONO-805a02's own measured precedent
    for structurally similar small-scale work, not EXP-MONO-12ce1c's
    larger panel. The deterministic seed-derivation rule, the
    twisted-factor-base digest requirement, and the independently-drawn
    Stage 4a control sample are all load-bearing reproducibility
    safeguards, not padding. Success criterion is decidable regardless of
    outcome direction, per the design-experiment skill's own requirement,
    and explicitly treats a Stage-3 falsification of HEUR-PARITY-3 as a
    valid, non-catastrophic run outcome.

  objective: >-
    Machine-check, by exact computation (not statistics), IDEA-20260830-
    d84f6a's/H-MONO-10ca08's hand-derived claim (HEUR-PARITY-3) that the
    j=m-1 branch of the m-th Semaev summation fibre -- every specialisation
    coordinate an F_p-x-coordinate whose point is only defined over
    F_{p^2} -- can be computed as m-1 F_p-rational group additions on the
    quadratic twist E_delta, plus one disclosed multiplication, reproducing
    the direct polynomial-root x(Q) exactly; and that a deliberately wrong
    final rescaling constant fails to reproduce it (the proves-too-much
    control this claim needs to be discriminating). This is the ONE part
    of IDEA-20260830-d84f6a confirmed genuinely untested by EXP-MONO-12ce1c
    (see H-MONO-10ca08's `observation_collision_audit_against_exp_mono_
    12ce1c`); this contract does not re-test the j=0/j=m-1 parity law or
    the intermediate-j genericity gap, both already decided by
    EXP-MONO-12ce1c / EV-MONO-efbd1c / DEC-20260830-0f8def
    (H-MONO-45183a `supported_scoped`).

  what_this_is_not:
    - >-
      Not a re-test of H-MONO-45183a Part A (the j=0-or-j=m-1 complete-
      splitting dichotomy) or of the intermediate-j genericity gap
      (HEUR-PARITY-2). Neither is sampled at any j other than 0 (Stage 1
      only) and m-1 (Stages 3-4a). A reader must not read this contract's
      silence on intermediate j as any kind of confirmation.
    - >-
      Not IDEA-20260830-d84f6a's own full Stage 2 j-ladder census (all j
      from 0 to m-1, multiplicity-aware split_with_multiplicity AND
      split_distinct reporting) or its Stage 4b tau=4-vs-fixture nearest-
      object control. Both are deliberately omitted; see
      H-MONO-10ca08's own disclosed scoping rationale
      (`disposition_object_1_parity_law`). Their full original text
      remains available in `ledger/proposals/IDEA-20260830-d84f6a.yaml`
      for any future record.
    - Not an ECDLP attack, cost, exponent, or cryptographic-scale claim in either direction.
    - >-
      Not a status change to IDEA-20260805-cf2d5a, H-MONO-45183a,
      EXP-MONO-12ce1c, H-MONO-40aca5, EXP-MONO-805a02, RQ-MONO-001, or
      GOAL-MONO-001. Those are Coordinator acts and none is performed here.
    - Not approved, frozen, authorized, executed, or evidence, until separately reviewed.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: that on the declared m=4/p=211/j=0 fixture and the j=m-1
      cells at m in {4,5}, p in {211,1009}, a=37/b=57 (p=211) and a=17/b=19
      (p=1009), the twist-computed signed-sum x-coordinate matched the
      direct polynomial-root x-coordinate exactly, and that a deliberately
      wrong rescaling constant failed to reproduce it. A run may also
      support the HAND DERIVATION it checks, but the derivation's validity
      comes from the argument, cited separately.
    what_no_outcome_can_support: >-
      No outcome establishes anything at cryptographic scale, about
      F_{q^n}, about ECDLP cost, or about any exponent. Toy evidence is
      never crypto-scale evidence (AGENTS.md rule 7).

  inputs:
    reused_infrastructure:
      - path: harness/semaev.py
        role: >-
          s3_expr, s4_expr reused directly. A new s5_expr must be added by
          ONE further resultant elimination in the identical pattern
          s4_expr already uses (S_5 = Res_U(S_4(x1,x2,x3,U), S_3(x4,T,U))),
          evaluated NUMERICALLY (coordinates substituted before the
          resultant is taken, per EXP-MONO-805a02's own Stage-2 precedent
          for tractability) rather than symbolically over Z.
      - path: harness/toycurve.py
        role: >-
          EllipticCurve (add, mul, lift_x), Point, reused directly for
          both E (p, a, b) and E_delta (p, a*delta*delta % p,
          b*delta**3 % p) -- NO modification needed for the twisted curve,
          per IDEA-20260830-d84f6a's own construction.
    curves:
      p211: {p: 211, a: 37, b: 57}
      p1009: {p: 1009, a: 17, b: 19}
      note: >-
        Matching KN-FIND-c41ea9's / H-MONO-40aca5's / EXP-MONO-805a02's
        own committed p=211 curve (a=37, b=57) and p=1009 curve (a=17,
        b=19; confirmed committed in
        experiments/EXP-MONO-805a02/reviews/red-team/
        rt5_degdrop2_and_null.py line 16) exactly, so Stage 1/3/4a results
        are directly comparable to that lane's own D_trial(E)=m-1
        j=0 result.
    non_residue_and_delta_construction: >-
      For each p, scan x=0,1,...,p-1 in increasing order. A candidate x is
      a NON-RESIDUE x-coordinate iff f(x) != 0 mod p AND
      pow(f(x), (p-1)//2, p) == p-1 (strict Euler-criterion non-residue,
      never 0). The first accepted x is DELTA_SOURCE; delta := f(DELTA_SOURCE)
      mod p is the fixed non-residue used for E_delta for that p (this
      reuses an already-classified non-residue value rather than
      introducing a second construction; any x with f(x) a non-residue
      would serve equally, since only delta's quadratic-non-residue-ness
      is used, never its specific value). The retained ordered list of ALL
      such non-residue x's (excluding DELTA_SOURCE only if it is drawn
      again, which is permitted) is the "twisted factor base" for that p;
      its length and its SHA-256 digest over canonical decimal lines are
      committed before any j=m-1 tuple is drawn.
    seed_derivation_rule: >-
      Every random draw (choice of j=m-1 tuples from the twisted factor
      base; choice of the m-1 tuple for the wrong-rescaling mutant; choice
      of delta' != delta for the mutant) uses SHA-256 of
      domain || "|" || label || "|" || decimal(p) || "|" || decimal(m) ||
      "|" || decimal(counter), domain = "EXP-MONO-7c653b/v1", with
      rejection sampling against modulo bias, exactly as EXP-MONO-12ce1c's
      own `seed_derivation_rule` specifies. Labels: "twisted-fb-tuple",
      "mutant-tuple", "mutant-delta-prime". A third party reproduces every
      instance bit-for-bit from (master_seed, domain, label, p, m,
      counter).
    master_seeds: [20260905, 20260906]

  battery:
    - id: STAGE1-HARD-GATE-FIXTURE
      description: >-
        Reproduce KN-FIND-c41ea9's / H-MONO-40aca5's / EXP-MONO-805a02's
        own committed m=4, p=211, a=37, b=57, j=0 fixture (193
        specialisations of distinct on-curve x-coordinate triples,
        193/193 complete splitting, root sets exactly
        {x(+-P1+-P2+-P3)}), cell for cell, using `harness/semaev.py`'s own
        `s4_expr`. Per EXP-MONO-805a02's own disclosed protocol deviation,
        the literal historical 193 triples are not committed anywhere
        machine-readable; a freshly, deterministically seeded 193-triple
        sample of the IDENTICAL construction (same curve, same p, same
        s4_expr resultant, same 193-triple count, drawn from the on-curve
        factor base under label "fixture-triple" using this contract's own
        seed_derivation_rule) is an acceptable reproduction.
      terminates_the_run_if: >-
        Any of the 193 triples fails to split completely, or any root set
        disagrees with {x(+-P1+-P2+-P3)}. Then Stages 3-4a are NOT
        interpreted; the harness reuse (s4_expr, EllipticCurve) has a
        defect this record did not anticipate.
      forced_output: "193/193 complete splitting; root sets exactly {x(+-P1+-P2+-P3)}."
    - id: STAGE3-TWIST-COST-IDENTITY
      description: >-
        Restricted to j=m-1 (all-non-residue) tuples. For m=4: draw n=500
        tuples per p (p in {211,1009}) of 3 DISTINCT x-coordinates from
        that p's twisted factor base, label "twisted-fb-tuple". For m=5:
        draw n=200 tuples per p of 4 distinct such x-coordinates. For each
        tuple: (a) DIRECT ROUTE -- specialise s4_expr/s5_expr at the tuple
        and factor the resulting univariate polynomial in T over F_p
        (numerically, coefficients reduced mod p first), recording the
        full root set and whether it splits completely (with multiplicity
        AND distinct-count, both reported, closing the exact gap
        EXP-MONO-805a02's own Red Team named as O-2 for this lane's prior
        contract). (b) TWIST ROUTE -- for each x_i compute y_i' in F_p
        with (y_i')^2 = f(x_i)*inverse(delta) mod p (via
        `sympy.ntheory.residue_ntheory.sqrt_mod`, the same primitive
        `harness/toycurve.py`'s own `_sqrt_mod` uses), instantiate
        E_delta = EllipticCurve(p, a*delta*delta % p, b*delta**3 % p),
        compute R = sum eps_i*(delta*x_i mod p, delta**2*y_i' mod p) over
        E_delta for every eps in {+1,-1}^{m-1} up to global sign (2^{m-2}
        distinct sign classes), and set x(Q) := X(R) * inverse(delta) mod
        p for each. (c) COMPARE -- the SET of twist-route x(Q) values must
        equal the SET of direct-route roots exactly (multiset-agnostic set
        equality per class, as IDEA-20260830-d84f6a's own falsification
        condition specifies), reported per tuple and aggregated per (m,p)
        cell as an exact-match rate.
      forced_output: >-
        Exact set equality in 100% of tested tuples at every (m,p) cell;
        complete-splitting rate (multiplicity-aware AND distinct) of
        1.000 at every cell as a byproduct sanity check against
        H-MONO-45183a Part A (not a re-test of the general claim, a local
        consistency check on this contract's own panel).
      operation_count_reporting: >-
        Per attempt on the twist route: exactly m-1 EllipticCurve.add
        calls plus one final F_p multiplication (X(R)*inverse(delta)),
        reported beside (never folded into) H-MONO-40aca5's own m-1-
        addition count for j=0, per that record's own unit-declaration-
        tripwire convention. The twisted-factor-base build cost (scanning
        x=0..p-1 once per p) is reported separately, not charged against
        per-attempt cost, per H-MONO-40aca5's own H2 convention.
    - id: STAGE4A-WRONG-RESCALING-MUTANT
      description: >-
        m=4, p=211, j=3 (i.e. m-1=3, so this IS a j=m-1 cell), n=50
        trials, label "mutant-tuple" for the tuple draw and
        "mutant-delta-prime" for delta' != delta (drawn from the SAME
        twisted-factor-base construction's non-residue values, i.e. any
        non-residue value distinct from delta, via f(x) at a distinct
        non-residue x). Construct R exactly as Stage 3's twist route does
        (using the CORRECT delta throughout the sum), then compute the
        FINAL rescaling as X(R) * inverse(delta') mod p instead of
        inverse(delta). Compare this mutant x-set against the direct-route
        root set from an independently-drawn set of 50 j=3 tuples at
        m=4, p=211 (NOT reusing Stage 3's own 500 p=211/m=4 tuples, to
        keep the control's own sample independent and auditable).
        NOT USED as mutants, per IDEA-20260830-d84f6a's own explicit
        exclusion (each provably cannot fail and would give the control no
        discriminating power): a sign flip on y_i' (relabels eps_i only);
        rebuilding the twist AND the rescaling with the same delta'
        (an F_p-isomorphic twist, since delta'=s^2*delta makes
        X(R')/delta' = X(R)/delta).
      forced_output: >-
        Materially below 1.000 agreement rate with the direct route
        (predicted near 0, since the returned x-set is scaled by
        delta/delta' != 1, a generically different value at every trial).
        IF this control ALSO reproduces x(Q) at a rate near 1.000, Stage
        3's exact-match test has no discriminating power and Stage 3's own
        main result, however clean, is UNSUPPORTED -- reported as the
        record's headline finding in that case, not buried beside a clean
        Stage-3 number.

  controls:
    - id: HARD-GATE-FIXTURE-REPRODUCTION
      description: "Stage 1. CAN FAIL: voids Stages 3-4a if it fails."
    - id: MULTIPLICITY-AND-DISTINCT-BOTH-REPORTED
      description: >-
        Stage 3 reports split_with_multiplicity AND split_distinct
        separately at every cell, never pooled, closing the exact gap
        EXP-MONO-805a02's own Red Team named for this lane's earlier
        contract (O-2).
    - id: PROVES-TOO-MUCH-WRONG-RESCALING-MUTANT
      description: >-
        Stage 4a. CAN FAIL EITHER WAY: a deliberately wrong final
        rescaling must fail to reproduce x(Q); if it does not fail, the
        exact-match test has no discriminating power regardless of the
        main construction's own reported success rate. The mutant is
        exactly and only the final-rescaling-constant mutation, never a
        sign flip or a matched twist+rescaling rebuild (both provably
        leave the fibre x-set fixed and could not fail against a correct
        construction either).
    - id: UNIT-DECLARATION-TRIPWIRE
      description: >-
        The one extra F_p multiplication (x(Q)=X(R)*inverse(delta)) on
        the twist route is counted and reported explicitly in Stage 3's
        operation-count reporting; it is never silently absorbed into
        "the same cost as j=0."
    - id: INDEPENDENT-CONTROL-SAMPLE
      description: >-
        Stage 4a's 50 comparison tuples are independently drawn, not
        reused from Stage 3's own m=4/p=211 sample, so the control's
        result cannot be an artifact of tuple reuse.

  metrics:
    primary:
      - "Stage 1 fixture pass/fail (193/193 required)."
      - >-
        Stage 3 exact-match rate between twist-route and direct-route
        x(Q), per (m,p) cell, m in {4,5}, p in {211,1009}.
      - >-
        Stage 3 complete-splitting rate (multiplicity-aware AND distinct)
        per (m,p) cell, as a byproduct sanity check.
      - "Stage 4a mutant agreement rate against the direct route, m=4, p=211."
    secondary:
      - "Twisted-factor-base size and construction wall time, per p."
      - "Operation count (additions + multiplications) per attempt on the twist route, reported beside H-MONO-40aca5's own j=0 count."
      - "Full factor-degree multiset per Stage-3 cell (per this lane's own house convention for a null-object-adjacent statistic)."

  heuristic_under_test: HEUR-PARITY-3
  preregistered_prediction:
    quantity: "Stage 3 exact-match rate"
    formula: "1.000 at every (m,p) cell, per HEUR-PARITY-3 / mechanism STEP 5."
    source: H-MONO-10ca08 mechanism STEP 5 (hand derivation, unverified by computation prior to this contract)

  scale_relevance:
    tier: toy
    justification: >-
      p in {211, 1009}, m in {4,5}. No transfer or extrapolation to
      cryptographic scale is claimed; the underlying isomorphism argument
      is scale-independent by construction (standard elliptic-curve
      theory), but the MEASUREMENT is toy-scale only.
    correspondence: null

  tail_checks:
    - >-
      m=5 (the largest tested arity, deg_T S_5=8) is where an isomorphism
      or sign-convention error would most likely first manifest as a
      multi-root mismatch rather than a single-value one; report the m=5
      cells' exact-match rate separately from m=4's, not pooled.

  replication:
    seeds: [20260905, 20260906]
    independent_instances: 2

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1.0
    maximum_memory_gb: 2
    maximum_runs: 2
    maximum_workers: 1
    budget_precedent_note: >-
      Sized against EXP-MONO-805a02's own budget (1800s wall / 2GB /
      2 runs, measured 73.4s and 72.7s actual), NOT EXP-MONO-12ce1c's
      (7200s / 2GB, an 8-curve panel with F_{p^2}-native cycle-type
      classification and dual independent classifier paths). This
      contract's workload -- <=1450 total tuples (500+500+200+200 at
      Stage 3, plus 50+50 at Stage 4a across two independently-drawn
      samples) at m<=5 on TWO fixed curves, using only F_p group
      arithmetic on the twist route and a handful of small-p resultant
      eliminations (one new s5_expr build) on the direct route, is much
      closer in character and scale to EXP-MONO-805a02's than to
      EXP-MONO-12ce1c's larger panel.

  stopping_rules:
    - "Stage 1 is a hard gate: do not proceed to Stage 3 or 4a until it passes exactly."
    - >-
      If the s5_expr resultant elimination fails to terminate within 300
      seconds at either p, abort that cell as failed_infrastructure and
      report the timeout; do not fall back to a smaller m silently.
    - "Stop on any budget breach, reporting the breach as infrastructure signal."

  invalidation_rules:
    - Any execution while frozen, execution_authorized, or evidence_eligible is false.
    - Any missing twisted-factor-base digest, seed record, or run manifest.
    - Any run manifest lacking field_bits.
    - Any pooling of split_with_multiplicity and split_distinct into one figure.
    - >-
      Any post-hoc change to a preregistered value, tolerance, or decision
      rule after any Stage-3 or Stage-4a number has been observed. Such a
      change requires a versioned protocol amendment marked
      exploratory_only, and is never an edit.
    - >-
      Reuse of Stage 3's own m=4/p=211 tuple sample for Stage 4a's
      comparison set (the two must be independently drawn per this
      contract's own INDEPENDENT-CONTROL-SAMPLE control).

  success_criterion: >-
    A run is successful, REGARDLESS OF WHICH DIRECTION ANY INDIVIDUAL
    NUMBER POINTS, if it reports: Stage 1's pass/fail outcome exactly;
    Stage 3's exact-match rate and complete-splitting rate (both
    multiplicity-aware and distinct) at every (m,p) cell; Stage 4a's
    mutant agreement rate; and the operation-count reconciliation for the
    twist route. A Stage-3 mismatch (falsifying HEUR-PARITY-3) is a VALID,
    REPORTABLE, NON-CATASTROPHIC RUN OUTCOME -- the run succeeds by
    detecting and reporting it cleanly with the exact tuple and both
    computed x-sets, even though it would be a significant negative result
    for H-MONO-10ca08's own central claim. Likewise a Stage-4a control
    failure (the mutant reproducing x(Q)) is a valid, reportable outcome
    that voids Stage 3's discriminating power without voiding the run.

  falsification_criterion: >-
    Any of: (a) Stage 1's fixture failing to reproduce; (b) any Stage-3
    twist-computed x(Q) disagreeing with the direct-route x(Q); (c) Stage
    4a's mutant reproducing x(Q) at a rate near 1.000. (a) voids
    interpretation of everything downstream; (b) falsifies HEUR-PARITY-3
    directly and is this record's single most consequential possible
    outcome; (c) does not falsify HEUR-PARITY-3 itself but voids Stage 3's
    claim to have discriminated it, and must be reported with equal
    prominence.

  required_artifacts:
    - implementation.md
    - implementation/ (source code, including the new s5_expr addition to a local copy or extension of harness/semaev.py -- see amendments/ if harness/semaev.py itself is modified)
    - runs/RUN-MONO-7c653b-1/
    - runs/RUN-MONO-7c653b-2/
    - execution_report.yaml

  assigned_to: executor

  source_refs:
    - ledger/hypotheses/H-MONO-10ca08.yaml
    - ledger/proposals/IDEA-20260830-d84f6a.yaml
    - ledger/hypotheses/H-MONO-45183a.yaml
    - ledger/hypotheses/H-MONO-40aca5.yaml
    - experiments/EXP-MONO-12ce1c/specification.yaml
    - experiments/EXP-MONO-12ce1c/execution_report.yaml
    - ledger/evidence/EV-MONO-efbd1c.yaml
    - ledger/decisions/DEC-20260830-0f8def.yaml
    - experiments/EXP-MONO-805a02/specification.yaml
    - experiments/EXP-MONO-805a02/execution_report.yaml
    - knowledge/findings/KN-FIND-c41ea9.md
    - harness/semaev.py
    - harness/toycurve.py
    - docs/inventor-protocol.md
    - docs/claims-and-verification.md
    - templates/research-records.md

  inference:
    requested_policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
