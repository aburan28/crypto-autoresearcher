experiment:
  id: EXP-VOLC-eeaf77
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-3f5545
  question_id: RQ-VOLC-f6253b
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'COMPLETE-CLASS LEVEL-VECTOR STRATIFICATION: enumerate an entire toy F_p-isogeny class by
    j-sweep, label every curve with the FULL level vector (v_ell(f_E))_{ell | c} rather than a single
    depth, and decompose the variance of each frozen cost functional into level-vector, total-conductor,
    and residual components against a level-permutation null -- the design that can separate "the
    functional reads the ell it is defined at", "the functional reads the size of the order", and
    "the functional reads nothing"'
  status: draft
  objective: "(A) THE OBJECT IS A VECTOR, NOT A NUMBER, AND THIS LANE HAS BEEN TREATING IT AS A NUMBER.\
    \ A curve's position in the endomorphism-ring stratification of its isogeny class is the conductor\
    \ f_E | c, equivalently the VECTOR v(E) = (v_ell(f_E))_{ell | c}. Distinct coordinates are INDEPENDENT:\
    \ an ell_1-isogeny changes only the ell_1-coordinate, so a curve can be at the CRATER of the ell_1-volcano\
    \ and at the FLOOR of the ell_2-volcano simultaneously. Every previous framing in this program\
    \ that speaks of \"the volcano level\", \"the crater\", \"the floor\", or \"a conductor step\"\
    \ -- including H-ECTD-19017a's vertical-step design and IDEA-20260805-38aebb's descending path\
    \ -- implicitly projects the vector onto one coordinate or onto the single scalar f_E. THIS RECORD\
    \ MEASURES THE VECTOR.\n(B) THE THREE COMPETING EXPLANATIONS, AND WHY THE VECTOR IS WHAT SEPARATES\
    \ THEM. Suppose a cost functional C varies within an isogeny class. Then:\n  (H_ell) C READS THE\
    \ ell IT IS DEFINED AT. C is an ell-local quantity (for\n    instance anything built on E[ell]\
    \ or on rational ell-isogeny counts), so\n    C depends on v_ell(f_E) and on NO OTHER COORDINATE.\
    \ Signature: in a\n    two-coordinate class, a main effect on coordinate ell and none on the\n\
    \    other, and no interaction.\n  (H_size) C READS THE SIZE OF THE ORDER. C depends on |disc(O_f)|\
    \ = f^2|D_K|\n    or on h(disc O_f), both monotone in the SCALAR f = prod ell^{v_ell(f_E)}.\n\
    \    Signature: C correlates with log f, with the coordinates entering only\n    through that\
    \ sum, and with equal weight per unit of log ell.\n  (H_0) C reads nothing about the endomorphism\
    \ ring. Signature: variance\n    explained by v(E) does not exceed the level-permutation null.\n\
    These three are mutually exclusive and jointly exhaustive for functionals that depend on End(E)\
    \ at all, and NO SINGLE-ell DESIGN CAN DISTINGUISH THEM. That is this record's reason to exist.\n\
    (C) THE DESIGN. Fix p at toy scale. Enumerate the ENTIRE F_p-isogeny class of a chosen trace t:\
    \ sweep every j in F_p, build a curve with that j, compute its trace, and keep both the curve\
    \ and its quadratic twist when the trace matches +/- t. The class has size sum over f | c of h(f^2\
    \ D_K), which is Theta(sqrt(p)) up to log factors -- a few hundred to a few thousand curves at\
    \ p ~ 2^12 to 2^14, i.e. FULLY ENUMERABLE. Label each curve with v(E) by counting rational ell-isogenies\
    \ per ell | c (the instrument of IDEA-20260807-b1b604). Then measure every frozen L1 functional\
    \ on every curve and run the variance decomposition.\n(D) WHAT MAKES THIS DIFFERENT FROM MEASURING\
    \ VARIANCE. A within-class variance number is uninterpretable on its own: instance noise, factor-base\
    \ sampling, and Groebner implementation jitter all contribute. The LEVEL-PERMUTATION NULL fixes\
    \ this exactly: keep the measured C values, keep the class, and randomly permute the level-vector\
    \ LABELS among the curves. Recompute the variance explained. The permutation distribution is the\
    \ exact null for \"levels carry no information\", it requires no distributional assumption, and\
    \ the observed R^2 must exceed its 95th percentile before any claim is made. This is cheap --\
    \ the expensive measurements are already done -- and it is the difference between a citable stratification\
    \ and a number."
  resource_label: R3 (End(E) as a ring, via the conductor) and R4 (isogeny graph) as the STRATIFYING
    variable; R1 and R2 as the measured functionals
  admissibility: admissible
  admissibility_argument: 'The stratifying variable v(E) is curve-only data derived from the isogeny
    graph and the conductor, never from an action on G. The MEASURED quantities are restricted, by
    construction and by a blocking rule in required_metrics, to functionals that do NOT factor through
    the abstract triple (G, P, Q): Semaev/Groebner meters, factor-base decomposition yield, relation-collection
    cost, and curve-equation shape. Any functional that does factor through the triple -- rho cost,
    BSGS cost -- is measured ONLY as an instrument check and is required by IDEA-20260807-5cabfc to
    be constant across the class; a variation there is an implementation bug, and it may never be
    reported as a depth effect. With that restriction the proposal escapes H-ENDO-001 and KN-FIND-b7e091
    for the same reason IDEA-20260807-cbe8c1 does: the measured data is field data, not group elements.'
  reachability_gate: 'THIS PROPOSAL DOES NOT MOVE BETWEEN CURVES TO ATTACK -- it enumerates them exhaustively,
    which is possible only because the class has Theta(sqrt(p)) vertices at toy scale and is FLATLY
    IMPOSSIBLE at crypto scale, where the class has ~ 2^128 vertices for a 256-bit p. That asymmetry
    is the scope limit and it is stated here, not buried. CONDITIONALLY ON A POSITIVE: if the variance
    aligns with the LEVEL VECTOR (H_ell), the good curves are reachable, because IDEA-20260807-bb03d3
    shows any target level vector below the smoothness bound B is reachable in O(B^2 log^2 p) with
    no factoring, and the level is locally detectable in one step by isogeny counting. If instead
    the variance is residual -- attached to individual curves rather than to v -- then goodness has
    only a global address, the crater is a Cl(O)-torsor, and the lane dies on the T5 cost even though
    the variance is real. THE DECOMPOSITION''S REACHABILITY DICHOTOMY IS THEREFORE DECIDED BY WHICH
    TERM OF THIS RECORD''S VARIANCE DECOMPOSITION IS LARGE, which is the strongest reason to run it
    early.'
  inputs:
    procedure: 'STAGE 1 (hours): class selection arithmetic; find a t with c having two distinct small
      prime factors at p ~ 2^12. Pure integers. STAGE 2 (hours, HARD GATE): complete j-sweep enumeration;
      class-count gate against the class-number sum. STAGE 3 (hours): level labelling with the per-level
      count cross-check. STAGE 4 (hours to days): the Semaev sweep over every enumerated curve, plus
      N2, N3, N4. STAGE 5 (minutes): variance decomposition and the permutation null. STAGE 6 (zero
      compute): the H_ell / H_size / H_0 verdict, with the instrument-check results reported alongside.'
    mechanism: 'STEP 1 -- CLASS SELECTION. Choose p ~ 2^12 to 2^14 and a trace t such that c = sqrt((t^2
      - 4p)/D_K) has AT LEAST TWO distinct small prime factors, so v(E) has at least two coordinates
      and H_ell versus H_size is decidable. Record how many candidate traces had to be scanned to
      find one, because that density is itself a scoping number. STEP 2 -- COMPLETE ENUMERATION. For
      every j in F_p, construct a curve with that j (standard formulas; handle j = 0 and j = 1728
      separately since they have extra twists), compute #E by the harness''s point count, and keep
      the curve if its trace is t. Also keep the quadratic twist when its trace is t. Verify the total
      count equals sum_{f | c} h(f^2 D_K) computed independently by counting primitive reduced binary
      quadratic forms -- THIS IS A HARD GATE on the enumeration''s completeness, and it is exactly
      the check IDEA-20260805-38aebb already machine-verified at 180 cells for the class number formula,
      so the two records cross-validate. STEP 3 -- LEVEL LABELLING. For each curve and each ell |
      c, count rational ell-isogenies (kernel factors of the ell-division polynomial, verified by
      Velu plus a trace check) and assign the level by Fouquet-Morain descent. Cross-check: the number
      of curves with a given v must equal h(f^2 D_K) for the corresponding f. A mismatch voids the
      labelling. STEP 4 -- MEASUREMENT. On every curve, with an IDENTICAL protocol: build the frozen
      factor base at the declared size, run the m = 3 Semaev decomposition measurement (harness/semaev.py),
      and record Groebner wall time, basis size, basis maximum total degree (a proxy, never the degree
      of regularity), decomposition yield over a fixed target set, and the curve-equation shape metrics
      of IDEA-20260807-a6fb2a. STEP 5 -- DECOMPOSITION AND NULL. Fit three nested models per functional:
      M0 (intercept only), M_size (intercept + log f), M_vec (intercept + one term per coordinate
      + pairwise interactions). Report R^2 and the nested F-style comparisons. Then run the level-permutation
      null 10^4 times and report the observed R^2''s percentile in the permutation distribution FOR
      EVERY MODEL. No conclusion is drawn from a coefficient whose R^2 sits below the 95th percentile.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - level-permutation null, 10^4 permutations (N1, blocking)
  - height-zero class with c = 1 (N2)
  - matched random curves from other classes (N3)
  - fixed curve with resampled factor-base seed and resampled k (N4)
  - matched rho and BSGS as an instrument check that must show no effect
  - class-count gate against sum_{f|c} h(f^2 D_K)
  - "NULL OBJECT (from the proposal): (N1) THE LEVEL-PERMUTATION NULL, primary and blocking: permute\
    \ the v(E)\n  labels among the enumerated curves 10^4 times, refit, and report the\n  observed\
    \ R^2's percentile. This is an EXACT null for \"levels carry no\n  information about C\" and needs\
    \ no distributional assumption.\n(N2) THE HEIGHT-ZERO CLASS: a second class at the same p with\
    \ c = 1, so every\n  curve has v = 0 and the class is a single crater. The measured spread of\
    \ C\n  there is the pure within-crater spread, and it is the correct baseline\n  against which\
    \ the between-level spread must be judged. If between-level\n  spread does not exceed within-crater\
    \ spread, depth explains nothing even if\n  the permutation test passes on a technicality.\n(N3)\
    \ MATCHED RANDOM CURVES at the same p from OTHER classes, size-matched to\n  the enumerated class.\
    \ This is DECOMPOSITION L1's between-class comparison,\n  reused here to check that the class's\
    \ own spread is not simply the generic\n  curve-to-curve spread.\n(N4) FIXED CURVE, RESAMPLED\
    \ FACTOR-BASE SEED and RESAMPLED k: the instrument\n  noise floor. Every effect size is reported\
    \ in units of this floor.\nDECAY PARAMETER: the number of levels, i.e. the height vector (v_ell(c))_{ell}.\
    \ Any level effect must be identically zero when every v_ell(c) = 0 (N2), and its explained variance\
    \ must grow no faster than the number of distinct v values available. A quantity whose explained\
    \ variance is the same in N2 as in the treatment class is the canonical artifact tell."
  independent_variables: []
  metrics:
    primary:
    - v(E) per curve, with the per-level counts against h(f^2 D_K)
    - Groebner wall time, basis size, basis max total degree, per curve
    - decomposition yield per curve over a fixed target set
    - R^2 of M0, M_size, M_vec per functional, with permutation percentiles
    secondary:
    - within-crater spread (N2) and between-class spread (N3)
    - instrument noise floor (N4)
    - RESOURCE LABEL of every measured functional, stated explicitly; a triple-factoring functional
      may appear only under "instrument check"
  heuristic_under_test: null
  preregistered_prediction:
    quantity: enumerated class size versus sum_{f | c} h(f^2 D_K)
    formula: EXACT EQUALITY. This is a completeness gate, not a statistic. A mismatch halts the line,
      because an incomplete enumeration silently biases every level's cell count and hence every variance
      estimate.
    source: pre-registered in IDEA-20260807-3f5545 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - UNBALANCED CELLS. Level counts follow h(f^2 D_K), which grows roughly like f, so deep levels have
    MANY more curves than the crater. An unweighted variance decomposition will be dominated by the
    deep levels. Weighting must be declared before the fit and the same weighting used in the permutation
    null.
  - j = 0 and j = 1728 have extra automorphisms and extra twists, changing both the enumeration bookkeeping
    and the Semaev system's symmetry. They must be flagged and the decomposition reported both with
    and without them.
  - FACTOR-BASE SAMPLING correlates with the curve, since the base is built from on-curve x-coordinates.
    A base drawn by the same seed on two curves is not the same set. N4 measures this and every effect
    is in units of it.
  - Selecting a class for "c has two small prime factors" selects on D, hence possibly on |D_K| and
    on h. The N3 control at matched p and the report of the selection density are what keep this visible.
  - 'Multiple testing: three models times several functionals. The permutation percentile must be
    reported per test and the family-wise criterion declared in advance.'
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 10800
    total_cpu_hours: 12.0
    maximum_memory_gb: 8
    maximum_runs: 60
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACT EQUALITY. This is a completeness gate, not a statistic. A mismatch halts
    the line, because an incomplete enumeration silently biases every level's cell count and hence
    every variance estimate.
  falsification_criterion:
  - Enumerated class size differs from sum_{f | c} h(f^2 D_K). The enumeration is incomplete or the
    level labelling is wrong; the line halts and nothing is reported.
  - Per-level counts differ from h(f^2 D_K). The labelling instrument is broken; every stratified
    statistic is void.
  - Matched rho or BSGS shows a level dependence. Mathematically impossible by IDEA-20260807-5cabfc,
    therefore diagnostic of a pipeline leak; the run set is INVALID rather than positive.
  - 'M_vec''s R^2 fails to clear the permutation null for every functional. That is the PREDICTED
    outcome and it is a controlled null: "the frozen cost functionals of this program do not resolve
    the endomorphism-ring stratification of an isogeny class at toy scale, with achieved power X".
    The achieved power must be reported or the null is uninformative.'
  - Groebner runs exceed budget before the class is covered. Infrastructure outcome under AGENTS.md
    rule 5; report coverage achieved, never a null.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-3f5545
