    reproducibility:
      result: PASS
      findings:
        - C1, T1, C2, T3 and T4 re-executed with identical results (rerun_fast.json).
        - >-
          T2 is identical by an exact row-set symmetry recount (83,328 row-sets
          x 120 = 9,999,360), not by re-enumerating all of GL_5(F_2)
          (recount_T2.json).
    definitional_audit:
      result: FAIL
      findings:
        - id: DA-1 OR-row product
          text: >-
            Both instruments compute m*f as the SET of OR-ed monomials
            {mm|m for mm in f}. Colliding monomials collapse instead of
            cancelling over F_2, so this is not the Boolean-ring product. At
            (6,3), 270 of 320 rows differ from the true product.
          locations:
            - experiments/EXP-SEMBIN-e76704/src/ffd_semaev.py:95
            - experiments/EXP-SEMBIN-e76704/src/recomb_search.py:31
            - experiments/EXP-SEMBIN-e76704/src/fastfall.py:25 (r |= 1 << idx[mm | m])
          script: audit_or_xor.py
          coordinator_note: >-
            The top-level session independently confirmed the core case. In
            the Boolean ring over F_2, u0u1 * (u0 + u1) = u0u1 + u0u1 = 0, but
            the set-OR product returns u0u1.
        - id: DA-2 fast kernel uses neither convention
          text: >-
            The fast kernel XORs OR-rows when it recombines generators, so it
            implements neither the OR convention nor the true product. At T1
            the slow and fast instruments build different V_D (dim V_2 12
            versus 13). At T3 the fast kernel reports new_falls(M, 2) = 4 on
            5,376 matrices where the slow instrument and the true product both
            give 0 (instrument disagreement).
          scripts: [slow_vs_fast.py, span_compare.py, crossval.py]
        - id: DA-3 true Boolean product values
          text: >-
            Under the true (XOR, cancelling) Boolean product: T1 is unchanged
            (d'_ff 2 -> 3); T2 upward is 1,355,520; T3 upward is 0; T4 upward is
            4,824.
          scripts: [truekernel.py, boolring.py, recount.py]
          outputs: [recount_T2.json, recount_T3.json, recount_T4.json]
        - id: DA-4 counterexample in the counted set
          text: >-
            M = [1, 2, 4, 13, 26] at (6,3). The true product gives u1w1 * h3 =
            u1w1, and h0 + h2 + u1w1*h3 + u0*h4 + u2*h4 = 1 + u1 + u2 + w0 + w1,
            which is not in V_1 = span{h4}. So d'_ff(M) = 2, but the src
            instrument counts this M as upward.
          scripts: [certificate.py, certificate2.py]
        - id: DA-5 mechanism of the (6,3) count
          text: >-
            Every upward M contains row 26. 1,612,800 = 5 * |GL_5(F_2)| / 31 is
            exactly the number of matrices whose generators include h4 = f1 +
            f3 + f4 = u0 + u2 + w0 + w2. That is the unique element of the
            generator span with degree <= 1.
          scripts: [inspect63.py, recount.py]
        - id: DA-6 Nagao 2013/549 Definition 1, no field equations
          text: >-
            At D = 2 for the witness M = [1, 2, 4, 8, 26], the top-degree kernel
            has dimension 0 (21 equations, 10 unknowns), so there is no fall.
            D_ff(M) = 3 is reached through the Koszul (trivial) syzygy g0 = h4,
            g4 = h0 + 1. Over GL_5(F_2), exactly 1,612,800 matrices separate
            under Definition 1.
          scripts: [nagao_def1.py, def1_general.py, def1_all_and_c1.py]
        - id: DA-7 Definition 1 with field equations as generators
          text: >-
            With u_j^2 + u_j included as generators, h4*h4 + sum_j (u_j^2 + u_j)
            = h4 is a fall at D = 2. So D_ff(M) = 2 and there is no separation.
          scripts: [nagao_def1.py, def1_general.py]
        - id: DA-8 literal 2015/984 Definition 6
          text: >-
            d'_F = 1 for every presentation, because 1 is in the ideal: the
            instances are unsatisfiable.
          scripts: [hps_def6.py]
        - id: DA-9 null under Definition 1
          text: >-
            T4 null under Definition 1, adjusted for trivial syzygies:
            D_ff(I) = D_ff(M) = 3 for all 20,160 matrices, so 0 are upward.
          scripts: [def1_general.py, hps_all42.py]
        - id: DA-10 T3 structurally forced
          text: >-
            The T3 negative is structurally forced, because 1 is in the
            generator span at Semaev (4,2).
          scripts: [def1_all_and_c1.py]
    scope:
      result: FAIL
      findings:
        - >-
          The "definition #4" label is wrong. The code computes the OR-row
          artifact, not the Boolean-ring d'_ff, and literal 2015/984 Definition
          6 gives d'_F = 1 on these unsatisfiable instances (DA-1, DA-8).
        - H-SEMBIN-934774 contradicts itself on T2/T4 (validator finding, transcribed as stated).
        - >-
          The interpretation "generic, not descent-specific (the null separates
          too)" is contradicted: under Definition 1 the null does not separate
          (DA-9).
        - >-
          The claim "degree-drop absorption not supported" is contradicted:
          at (6,3), separation occurs exactly for the M whose generators
          include the unique degree-<=1 span element h4 (DA-5).

