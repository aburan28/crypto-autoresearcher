experiment:
  id: EXP-SEMBIN-e76704
  hypothesis_id: H-SEMBIN-934774
  version: 1
  title: >-
    Confirmatory replication, from committed hash-pinned code, of the
    exploratory D_ff versus D_ff^max separation (reduced definition #4) on
    Weil-descended Semaev S_3 systems: exhaustive GL_l(F_2) counts at
    (n, n') = (6, 3) and (4, 2) plus a degree-matched random null
  status: approved
  status_history:
    - status: approved
      at: '2026-09-29'
      by: coordinator
      ref: DEC-20260929-79ba35
      note: >-
        Approved under the standing user authorization (AGENTS.md "Standing
        user authorization for ideas and experiments") and the user's
        in-session direction of 2026-09-29. Approval is permission to run,
        not a claim that the hypothesis holds.
  question_id: RQ-SEMBIN-9e8f82
  goal_id: GOAL-SEMBIN-fcb7a2
  idea_id: IDEA-20260929-0238ee
  objective: >-
    Re-execute, from committed and sha256-pinned source on a clean path, the
    exhaustive recombination counts found exploratorily on 2026-09-27, and
    score them against exact values frozen in the runner before execution.
    The value of this experiment is (i) replication of computation from
    code whose identity is fixed by hash, and (ii) converting scratch data
    produced by scripts that imported the instrument from a session
    scratchpad into a citable run record. It is the recommended first target
    of KN-OPEN-7f0511 item (A), restricted to the reduced definition #4.
  launcher: >-
    python3 experiments/EXP-SEMBIN-e76704/src/run_separation.py
    experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f
  launcher_cwd: repository root (/home/user/crypto-autoresearcher or any checkout of the approved commit)
  run_id: RUN-SEMBIN-79996f
  run_exit_codes:
    '0': all tests executed; predictions may still fail; read results.json verdict
    '3': infrastructure failure (uncaught exception); never mathematical evidence
  inputs:
    source_files:
      experiments/EXP-SEMBIN-e76704/src/run_separation.py:
        sha256: 3ba1755ac80f101e79b5ee5ef0dbdd96aee21ff5c5e91b15f92e0de918e2adf7
        role: frozen runner; PRED block, controls C1/C2, tests T1-T4, scoring, output
      experiments/EXP-SEMBIN-e76704/src/ffd_semaev.py:
        sha256: 15acdaeccc96edafaeaebae17ce16c4c28322ce54ee400aaa1268a17bc1fad2b
        role: system construction (build_system, a_real_xR, random_matched, popcount, MODS)
      experiments/EXP-SEMBIN-e76704/src/recomb_search.py:
        sha256: bc3ecf6d95951b35abad3dce8013a19a102e19e72eef23d95e51543e99f75061
        role: original (slow) instrument ffd / new_falls_at, recombine, tables
      experiments/EXP-SEMBIN-e76704/src/fastfall.py:
        sha256: 6eaae88180f572b365af74587eab45867997bfdf3575c0d69b4dc1509efaecdc
        role: fast F_2-linear kernel used for the exhaustive sweeps
    source_hash_provenance: >-
      sha256sum computed by the top-level session on 2026-09-29 at the
      Coordinator's request and relayed to this Coordinator (which has no
      shell); files reported unchanged since, and reported committed and
      pushed (with development/) at 2db2dda9f9. The runner independently
      writes source_sha256 for every src/*.py into manifest.json; the two
      must agree (invalidation rule IR-1). src/__pycache__/ is a gitignored
      derived artifact and is not part of the frozen source.
    exploratory_provenance: >-
      experiments/EXP-SEMBIN-e76704/development/exploratory-20260927/ --
      recomb2.py / recomb2_results.json (slow instrument, all 10 cells, full
      generator sets), control.py / control_results.json (fast kernel; the
      exhaustive GL_5 sweep at (6, 3) giving 1,612,800 upward and witness
      [1, 2, 4, 8, 26]), nullcontrol.py / nullcontrol_results.json /
      nullcontrol.log (Semaev and null cells; exhaustive GL_4 at (4, 2) giving
      0 and 5,424 upward), diagnose.py (witness check by the slow
      instrument; its console output is not preserved as a file). Those
      scripts import the instrument from a scratchpad path, not from src/.
    system_construction: >-
      run_separation.cell_systems(n, n'): rng = random.Random(100 n + n');
      x_R = a_real_xR(n, 1, 1, rng); basis {1, a, ..., a^(n'-1)};
      Semaev = indep(build_system(n, n', 1, x_R, basis)); null =
      indep(random_matched(Semaev, 2 n', rng)) on the same RNG stream.
      Curve y^2 + xy = x^3 + x^2 + 1; modulus ffd_semaev.MODS[n]; Boolean ring;
      N = 2 n'. x_R is determined by the seed and not written to results.json.
    cells:
      T1_and_T2: {n: 6, n_prime: 3, kind: semaev, generators_after_reduction: 5, N: 6}
      T3: {n: 4, n_prime: 2, kind: semaev, generators_after_reduction: 4, N: 4}
      T4: {n: 4, n_prime: 2, kind: degree_matched_null, N: 4}
      C1: '(n, n'') in {(3,2),(4,2),(5,2),(6,2),(7,2),(3,3),(4,3),(5,3),(6,3),(7,3)}, identity only, full unreduced sets'
    witness_M: [1, 2, 4, 8, 26]
    witness_M_meaning: >-
      rows are generator bitmasks; identity except row index 4 = f_1 + f_3 +
      f_4 (0-based generator indices)
    observable: >-
      d'_ff = min{ D : new_falls(D) > 0 }, new_falls(D) = dim(V_D cap R_{<D})
      - dim V_{D-1}, GF(2) Macaulay rank in the Boolean ring (definition #4 of
      KN-OPEN-7f0511, reduced/"fake"; NOT definition #3)
  controls:
    - id: C1
      kind: implementation regression
      design: >-
        For each of the 10 cells, the fast kernel (fastfall.Kernel.ffd) and the
        original instrument (recomb_search.ffd) compute d'_ff on the identity
        presentation of the full generator set; all_match must be true.
      limit: >-
        Checks the identity only, and checks two implementations of the same
        definition against each other; it cannot detect a definitional error
        they share and does not directly compare recombined presentations
        beyond the T1 witness.
    - id: C2
      kind: invariance sanity check
      design: >-
        At the T1 witness, the recombined set has the same F_2-rank as the
        original and that rank equals the generator count (5). With M
        invertible this implies equal spans.
      limit: Checked at the witness only.
    - id: T1_cross_instrument
      kind: independent-path check of the load-bearing witness
      design: >-
        T1 computes d'_ff(I) and d'_ff(M) at the witness with the ORIGINAL
        (slow) instrument, while T2's count comes from the fast kernel.
    - id: T3_negative_semaev
      kind: negative control on the same system class
      design: >-
        A Semaev cell where exploration found NO upward separation
        exhaustively; guards against an instrument that reports separation
        everywhere.
    - id: T4_null
      kind: nearby-object control (degree-matched random null)
      design: >-
        A random Boolean system with the same per-equation monomial-degree
        profile as the Semaev (4, 2) system, on the same RNG stream; tests
        whether separation is specific to Weil descent (exploration: it is not).
  independent_variables:
    - cell (n, n') in {(6, 3), (4, 2)}
    - system kind (Semaev descent; degree-matched random null)
    - recombination M, ranging over all of GL_l(F_2)
  metrics:
    primary:
      - results.json verdict.<test>.pass_ for T1_witness, T2_semaev_6_3, T3_semaev_4_2, T4_null_4_2
      - results.json all_predictions_confirmed
      - results.json controls_pass (C1 all_match AND C2)
    secondary:
      - per-test fields group_order, upward, upward_zero_generator, downward, D_ff_identity, D_ff_max, seconds
      - T1 new_falls_identity, new_falls_M, degrees_identity, degrees_M
      - C1 per-cell original / fast values
      - elapsed_seconds; manifest.json python, platform, source_sha256
  heuristic_under_test: not_applicable -- no numbered heuristic is assumed or validated; all quantities are exact finite counts
  preregistered_prediction:
    quantity: >-
      Exact values scored by run_separation.PRED: T1 (6,3) M = [1,2,4,8,26]:
      D_ff_identity 2, D_ff_M 3. T2 (6,3) exhaustive GL_5(F_2): group_order
      9,999,360, upward 1,612,800, upward_zero_generator 0, downward 0,
      D_ff_identity 2, D_ff_max 3. T3 Semaev (4,2) exhaustive GL_4(F_2):
      group_order 20,160, upward 0, D_ff_identity 2, D_ff_max 2. T4 null (4,2)
      exhaustive GL_4(F_2): group_order 20,160, upward 5,424, D_ff_identity 2,
      D_ff_max 3.
    formula: >-
      Equality, value by value, as coded in run_separation.main (checks =
      {k: got[k] == v}); no tolerance, since every quantity is an exact
      integer from an exhaustive enumeration. group_order values also equal
      the closed forms |GL_5(F_2)| = 31*30*28*24*16 and |GL_4(F_2)| =
      15*14*12*8.
    source: >-
      NOT INDEPENDENT PRE-REGISTRATION. Every value was read off the
      exploratory run of 2026-09-27 (control_results.json for T2 and the
      witness; nullcontrol_results.json / nullcontrol.log for T3 and T4;
      diagnose.py console output, not preserved, for T1), produced by
      substantially the same instrument code imported from a scratchpad
      path. No theorem predicts these numbers. A pass confirms reproducible
      computation from committed code, not a prediction made blind to the
      outcome.
    secondary_expected_values: >-
      Recorded now, before execution, but NOT scored by the runner's verdict:
      T1 new_falls_identity [0, 1, 15], new_falls_M [0, 0, 10], degrees
      identity [2, 2, 2, 2, 2], degrees_M [2, 2, 2, 2, 1] (source: the
      top-level session's report of diagnose.py output; no preserved file);
      T3 downward 5,376 (source: recomb2_results.json, slow instrument, same
      4-generator system). A mismatch here does not change the runner verdict;
      it is reported as a discrepancy in the evidence review and must be
      explained before the replication can be recorded as clean.
  scale_relevance:
    tier: toy
    justification: >-
      Field sizes 2^4 and 2^6; N = 4 and 6 Boolean variables; 4 or 5
      generators. Tested parameters only. No transfer or extrapolation to
      larger n, to chained systems, to cryptographic parameters, or to
      asymptotic statements is assumed or asserted; the result says nothing
      about whether D_ff^max is bounded.
    correspondence: not_applicable -- direct exhaustive computation, no sampling correspondence
  tail_checks:
    - >-
      not_applicable: every quantity is an exact count over a finite group
      enumerated exhaustively; there is no sampled distribution whose tail
      could be checked.
  replication:
    seeds: [603, 402, 302, 502, 602, 702, 303, 403, 503, 703]
    seeds_note: >-
      random.Random(100 n + n'); 603 and 402 drive T1-T4 (x_R and the null);
      the rest are C1 cells. The enumeration of GL_l(F_2) is deterministic.
    independent_instances: 3
    independent_instances_note: >-
      Three systems scored (Semaev (6,3), Semaev (4,2), null (4,2)), plus ten
      identity-only regression cells in C1. Replication here is replication
      of the exploratory computation by the committed code; it is one
      execution, not multiple independent samples.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 86400
    total_cpu_hours: 24
    maximum_memory_gb: 4
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      Machine-protection ceilings, not estimates: the exploratory run's
      duration was not recorded, so no time estimate is claimed. The 86,400 s
      watchdog protects the shared host from a hung single-threaded
      pure-Python process; its expiry checkpoints the task as an
      infrastructure event and never counts as evidence. Memory is small by
      construction (<= 64 monomials, row bitmasks, a <= 31-entry cache) and
      4 GB is a ceiling. maximum_runs 1 counts the one scored execution
      (exit 0).
  stopping_rules:
    - SR-1 Execute the launcher exactly once. A run that exits 0 is final whatever its verdict; it is never re-run to obtain a different verdict.
    - SR-2 A non-zero exit (3 or any other) or a watchdog kill is an infrastructure event. Preserve the attempt's files, report it, fix only infrastructure (never src/ or PRED), and re-attempt under this same frozen contract into a fresh run directory with a new RUN id minted by the session.
    - SR-3 Stop and report, without launching, if any src/*.py sha256 differs from inputs.source_files or if the run directory already exists.
  invalidation_rules:
    - IR-1 manifest.json source_sha256 differs from inputs.source_files for any of the four files -- run invalid, not evidence.
    - IR-2 The run was launched from a working tree where any src/ file is modified or untracked relative to the approved commit -- run invalid.
    - IR-3 results.json is missing, unparseable, or lacks verdict, all_predictions_confirmed or controls_pass -- infrastructure failure, not evidence.
    - IR-4 manifest.json command does not correspond to the launcher (script path and run directory) -- run invalid.
    - IR-5 Any edit to src/, PRED or this specification after approval without a versioned protocol_amendment under amendments/ -- run invalid.
  success_criterion: >-
    Exit 0, IR-1..IR-5 not triggered, results.json controls_pass == true AND
    all_predictions_confirmed == true (runner verdict pass_ true for T1, T2,
    T3 and T4). Meaning: the committed code reproduces the exploratory
    counts; the reduced first fall degree separates upward under
    recombination at Semaev (6,3), does not at Semaev (4,2), and does on the
    degree-matched null at (4,2) -- at these cells only.
  falsification_criterion: >-
    Exit 0 with IR-1..IR-5 not triggered, and EITHER any runner verdict
    check is false (any exact preregistered value mismatches) OR
    controls_pass is false (C1 or C2 failed). Either falsifies the
    replication: the exploratory finding is not reproduced by the committed
    code and may not be cited. A failed control additionally forbids any
    mathematical reading of T1-T4 from that run. An exit-3 or other
    infrastructure failure falsifies nothing and is not evidence.
  interpretation_limits:
    - Not independent pre-registration (see preregistered_prediction.source); it confirms computation, not a novel prediction.
    - Toy tier, N <= 6; nothing about asymptotics, n-growth, chained systems, cryptographic parameters, subexponentiality, or any curve's security.
    - Silent on whether D_ff^max is BOUNDED (Nagao's open problem); shows only that it can EXCEED D_ff on this class, for the reduced definition.
    - >-
      Measures definition #4 (reduced, Boolean ring), inheriting the 2015/984
      Lemma 4 gap (unproved there; literal form false per H-SEMBIN-a7e721);
      Nagao's D_ff^max is defined over definition #1 and no transfer is
      asserted.
    - Generic, not descent-specific -- the degree-matched null separates too (T4).
    - Not automatic -- of five Semaev cells with a recorded linear degree drop in nullcontrol_results.json, four did not separate (three under 400-sample search, one exhaustively, re-tested here as T3).
    - The runner's downward counter skips M with a new fall at d'_ff(I); downward = 0 is not an exhaustive count of lowering M.
    - One curve (a2 = a6 = 1), one basis, one x_R per cell, 2-decomposition systems reduced to an independent subset; the unreduced 6-generator (6,3) set is not tested.
  required_artifacts:
    - experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f/results.json (runner)
    - experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f/manifest.json (runner)
    - experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f/log.txt (runner)
    - experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f/manifest.yaml (executor run record, run schema of tools/validate_ledger.py check_run, certificate kind none)
    - experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f/command.txt
    - experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f/environment.json
    - experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f/stdout.log
    - experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f/stderr.log
    - experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f/raw-result.json (byte-identical copy of results.json, sha256 recorded in manifest.yaml)
  required_artifacts_note: >-
    The first three are what the frozen runner writes. The remaining six are
    the program's run-record wrapper, required so that RUN-SEMBIN-79996f
    registers in tools/validate_ledger.py and can be cited by the reserved
    evidence record EV-SEMBIN-c71cad. They add no computation.
  scoring: >-
    The runner's own verdict block is the score. No re-scoring, tolerance,
    or reinterpretation is applied by the executor.
  assigned_to: executor
  approved_by: coordinator
  approval_ref: DEC-20260929-79ba35
