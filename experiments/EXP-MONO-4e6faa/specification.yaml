experiment:
  id: EXP-MONO-4e6faa
  version: 1
  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-09-04'
  hypothesis_id: H-MONO-d4c511
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  coordinator_approval_rationale: >-
    APPROVED. This is IDEA-20260904-4f614a's own named cheapest, most
    decisive next step, targeting exactly the one honestly-disclosed
    weakness in an otherwise zero-free-parameter, six-integer-exact
    closed form: both curves it was checked against happen to zero out
    the D-term's own h_- (twist) contribution, so the formula's untested
    part cannot yet be distinguished from a fit. This experiment searches
    for a genuinely stress-testing object (h_->0) rather than merely
    re-confirming the already-fit numbers.

  title: >-
    Does the #E[4]-driven exact closed form for the m=4 symmetric-base
    census survive a genuine stress test, on a curve where the formula's
    own untested twist term is nonzero?

  what_this_is_not:
    - Not a discrete-logarithm computation, not an ECDLP attack, not relation collection.
    - Not an ECDLP cost, runtime, exponent, or cryptographic-scale claim.
    - >-
      Not a re-confirmation of the already-fit archived numbers (those
      are cited, not re-derived, as already-established context) -- the
      entire point of this contract is to test the FORMULA's own untested
      term on a NEW object it was not fit to.
    - >-
      Not a test of the non-split strata (Z<3), which the parent idea
      itself names as separate, not-yet-attempted future work.
    - >-
      Not, by itself, a re-scoping of H-MONO-93bc4d's own already-closed
      collision-rate formula -- that cross-lane question is named but
      explicitly deferred to a future Coordinator ranking decision.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: whether, on a specific found curve with h_->0, the closed
      form's own exact prediction for #1^4 and #2+1+1 (on the
      distinct-split stratum) matches an exhaustive census exactly. A
      match is toy-scale supportive evidence the D-term's own claimed
      form is correct, not a proof for every curve; a mismatch is a
      complete falsification of that specific term's form.
    what_no_outcome_can_support: >-
      No outcome supports any relation-rate, cost, exponent, or
      cryptographic-scale claim. No outcome resolves the non-split strata
      or the cross-lane H-MONO-93bc4d question, both explicitly deferred.

  inputs:
    construction_reused: >-
      EXP-MONO-0e6e8f's own already-independently-verified Q_e(T)
      construction and classification method (implementation/
      run_uncond_census.py), reused unmodified for the census step.
    domain: EXP-MONO-4e6faa/v1
    search: >-
      Scan ordinary curves (varying A,B) at toy primes in [101,2000],
      computing #E(F_p), #E^d(F_p) (the quadratic twist's own order,
      = 2p+2-#E(F_p)), tau, #E[4], #E^d[4] for each, until a curve with
      Z=3 (full rational 2-torsion, admissible for the distinct-split
      stratum) AND h_- = (#E^d[4]-tau)/4 > 0 is found. Disclose the exact
      number of curves scanned before success, or exhaustion of the
      declared range if none is found.
    census: >-
      On the found curve, exhaustively enumerate the distinct-split (Z=3)
      residual stratum's own base points (i.e. (e1,e2,e3) such that g
      splits into three distinct F_p-rational roots), classify each via
      the already-verified Q_e(T) construction, and tabulate exact
      #1^4, #2+1+1, #2+2 counts.

  stage_order:
    stage_0:
      name: search for an h_->0, Z=3 curve
      compute: seconds to minutes
      description: >-
        Scan curves as described above. Report success (with the exact
        curve, its n_+, n_-, h_+, h_- values) or exhaustion of the
        declared range (a reportable non-finding, per HEUR-CELL-1's own
        bounded-negative rule -- not a falsification of the formula).
    stage_1:
      name: exhaustive distinct-split census on the found curve
      compute: minutes
      description: >-
        Reusing EXP-MONO-0e6e8f's own verified construction, exhaustively
        classify every distinct-split base point on the found curve into
        the five-class scheme, and separately tabulate the #1^4, #2+1+1,
        #2+2 counts.
    stage_2:
      name: exact comparison against the closed form's own prediction
      compute: seconds
      description: >-
        Compute the closed form's own predicted #1^4, #2+1+1, #2+2 from
        the found curve's own (n_+, n_-, h_+, h_-) values (per
        IDEA-20260904-4f614a's own stated formula), and compare EXACTLY
        (zero tolerance) against Stage 1's own observed counts. Report
        the residuals R1, R2 explicitly, whether zero or not.

  metrics:
    primary:
      - "M1: R1 = observed #1^4 - predicted #1^4 (exact integer, zero-tolerance)"
      - "M2: R2 = observed #2+1+1 - predicted #2+1+1 (exact integer, zero-tolerance)"
    secondary:
      - "M3: the found curve's own (p, A, B, n_+, n_-, h_+, h_-) values, disclosed in full."
      - "M4: the number of curves scanned in Stage 0 before success (or exhaustion)."

  preregistered_prediction:
    - quantity: M1, M2
      value: "Exactly 0, under IDEA-20260904-4f614a's own closed form."
      formula: "See H-MONO-d4c511's own statement field for the full closed form."
      source: IDEA-20260904-4f614a mechanism.

  replication:
    planned_runs: 1
    seeds: [20260904004]
    interpretation: >-
      Deterministic once the search order and range are fixed; exact
      reproducibility from the recorded curve and search order.

  budget:
    maximum_runs: 1
    maximum_wall_seconds: 900
    maximum_cpu_seconds: 900
    maximum_peak_rss_bytes: 134217728
    maximum_total_disk_bytes: 10485760
    maximum_workers: 1
    no_network: true

  environment_preconditions:
    consequence: NO CAS AND NO SOLVER IS REQUIRED. Pure Python, reusing EXP-MONO-0e6e8f's own verified implementation.
    if_a_precondition_fails: >-
      A missing interpreter or an arithmetic exception is
      `failed_infrastructure`, never negative mathematical evidence
      (AGENTS.md rule 3). Exhaustion of the Stage-0 search range without
      finding an h_->0 curve is NOT an infrastructure failure -- it is a
      reportable, valid, non-evidentiary outcome per HEUR-CELL-1.

  infrastructure_failure_disposition: >-
    Any crash is recorded with its exact cause and classified
    `failed_infrastructure`. Supports and weakens NOTHING about
    H-MONO-d4c511 or IDEA-20260904-4f614a.

  stopping_rules:
    - Do not execute unless separately reviewed, approved, frozen and authorized. (Satisfied here.)
    - Stop and report the Stage-0 search outcome plainly if the declared range is exhausted without finding a qualifying curve.
    - Do not silently discard a disconfirming Stage-2 residual.

  invalidation_rules:
    - Any execution while frozen, execution_authorized or evidence_eligible is false.
    - Any post-hoc widening of the Stage-0 search range after observing a Stage-1 or Stage-2 result.
    - Any reporting of Stage-2 residuals that omits either R1 or R2.

  success_criterion: >-
    A run is well-formed evidence if: Stage 0's search outcome (found or
    exhausted) is reported with the exact curve or exact scan count;
    Stage 1's exhaustive census is reported in full; Stage 2's exact
    residuals R1, R2 are reported plainly, whether zero or not.

  falsification_criterion: >-
    Any nonzero R1 or R2 on a found h_->0 curve, correctly constructed and
    verified.

  outcomes:
    formula_survives_the_stress_test: >-
      A qualifying curve is found and R1=R2=0 exactly. The D-term's own
      claimed form is genuinely predictive, not merely fit -- a real
      upgrade in confidence for IDEA-20260904-4f614a's own closed form.
    formula_falsified_on_the_stress_test: >-
      A qualifying curve is found but R1 or R2 is nonzero. The D-term's
      own specific claimed form is falsified; the underlying mechanism
      (2-torsion translation involutions) may still be sound with a
      different D-term form, a question for future work.
    no_qualifying_curve_found: >-
      The declared search range is exhausted without finding an h_->0,
      Z=3 curve. Reported as a valid, non-evidentiary occupancy finding
      per HEUR-CELL-1 -- neither confirms nor refutes the formula.
    infrastructure_or_construction_failure: See infrastructure_failure_disposition. Never mathematical evidence.

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_do_not: >-
      Toy scale only; no transfer to cryptographic scale. A single
      confirmed h_->0 curve is a real but limited stress test, not a
      proof for every possible (n_+,n_-,h_+,h_-) combination.

  required_artifacts_if_later_authorized:
    - Frozen approved specification (this file).
    - Stage-0 search outcome (curve found or range exhausted, with exact scan count).
    - Run manifest, command, environment, raw-result.json with the found curve's own full parameters and the exhaustive census's own exact counts.
    - Independent Validator + Red Team review before any citation of this result alongside IDEA-20260904-4f614a's own broader claim.

  approval_requirements:
    - This contract IS the cheapest, most decisive next step named by IDEA-20260904-4f614a's own text.
    - Independent review confirms the found curve's own h_->0 status and the exact residual computation, blind to the Executor's own reported values where feasible.

  approval_status: >-
    APPROVED 2026-09-04 by the Coordinator; see `coordinator_approval_rationale` above.

  source_refs:
    - ledger/hypotheses/H-MONO-d4c511.yaml
    - ledger/proposals/IDEA-20260904-4f614a.yaml
    - ledger/decisions/DEC-20260904-dd58c3.yaml
    - experiments/EXP-MONO-0e6e8f/implementation/run_uncond_census.py

  inference:
    requested_policy: executor-implementation
    reasoning_effort: medium
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
