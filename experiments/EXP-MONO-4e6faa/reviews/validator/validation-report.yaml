  # ==================================================================
  # J1 -- INDEPENDENT CURVE AND TWIST CONSTRUCTION AUDIT
  # ==================================================================
  j1_curve_and_twist_audit:
    method: >-
      Standalone Python, written from scratch for this review: own quadratic
      residue / Legendre-symbol function, own brute-force square-root
      function, own short-Weierstrass point addition/doubling law, own point
      enumeration over F_p, own scalar-multiplication-by-repeated-doubling,
      own n-torsion counter (enumerate all points, check nP == O). Imports
      NOTHING from RC or UC. Full script retained in this session's scratch
      workspace (ephemeral, not a durable repository artifact); its logic is
      reproduced in full below because the task's write_scope is this single
      report file.
    code_core: |
      def legendre(a, p):
          a %= p
          if a == 0: return 0
          return 1 if pow(a, (p - 1) // 2, p) == 1 else -1

      def sqrt_mod(a, p):           # brute force, fine at p=101
          a %= p
          if a == 0: return 0
          if legendre(a, p) != 1: return None
          for c in range(1, p):
              if (c * c) % p == a: return c
          return None

      def add(P, Q, A, p):          # own short-Weierstrass group law
          if P is None: return Q
          if Q is None: return P
          x1, y1 = P; x2, y2 = Q
          if x1 == x2 and (y1 + y2) % p == 0: return None
          if P == Q:
              if y1 == 0: return None
              lam = (3*x1*x1 + A) * pow(2*y1, p-2, p) % p
          else:
              lam = (y2-y1) * pow((x2-x1) % p, p-2, p) % p
          x3 = (lam*lam - x1 - x2) % p
          y3 = (lam*(x1-x3) - y1) % p
          return (x3, y3)

      def count_n_torsion(A, B, p, n):   # brute enumerate + brute scalar mul
          cnt = 0
          for P in all_points(A, B, p):
              if scalar_mul(P, n, A, p) is None:
                  cnt += 1
          return cnt
    results:
      f_roots_mod_101: [0, 10, 91]
      f_roots_count: 3
      E_order: 100
      twist_nonresidue_d: 2
      twist_A_B: [4, 0]
      Ed_order: 104
      identity_2p_plus_2_minus_E_equals_Ed: true
      E4_count: 4
      Ed4_count: 8
      Z: 3
      tau: 4
      h_plus: 0
      h_minus: 1
    confirmation_table:
      - {claim: "3 distinct roots of f(X)=X^3+X mod 101", predicted: 3, own_result: 3, match: true}
      - {claim: "#E(F_101) = 100", predicted: 100, own_result: 100, match: true}
      - {claim: "#E^d(F_101) = 104 (E^d: y^2=x^3+4x)", predicted: 104, own_result: 104, match: true}
      - {claim: "2p+2-#E == #E^d", predicted: true, own_result: true, match: true}
      - {claim: "#E(F_101)[4] = 4", predicted: 4, own_result: 4, match: true}
      - {claim: "#E^d(F_101)[4] = 8", predicted: 8, own_result: 8, match: true}
      - {claim: "tau = Z+1 = 4", predicted: 4, own_result: 4, match: true}
      - {claim: "h_+ = (4-4)/4 = 0", predicted: 0, own_result: 0, match: true}
      - {claim: "h_- = (8-4)/4 = 1", predicted: 1, own_result: 1, match: true}
    verdict: HOLDS. All nine independently-checked facts confirmed exactly, using group-law and torsion-counting code sharing no line with RC/UC or with run_h_minus_stress.py.

  # ==================================================================
  # J2 -- BLIND STAGE-1 RECLASSIFICATION + STAGE-2 RECOMPUTATION
  # ==================================================================
  j2_blind_reclassification:
    method: >-
      Own driver script, structurally independent of run_h_minus_stress.py
      (own variable names, own loop/assertion structure, own reporting
      order), reusing ONLY UC.classify_fibre, UC.resultant, UC.CLASSES (from
      EXP-MONO-0e6e8f/implementation/run_uncond_census.py) and RC.compile_sym,
      RC.qe_from_sym (from EXP-MONO-815525/implementation/run_census.py, via
      UC's own transitive import), loaded read-only by file path exactly as
      the Executor's own script does. n_+/n_- were computed directly from the
      definition (own loop over F_101, own Legendre-symbol calls), not
      inherited from J1. h_+/h_- were taken from this report's own J1 result
      above (0 and 1). This is a FULL exhaustive census (152,096 base
      points), not a sample.
    code_core: |
      sys.path.insert(0, UC_DIR); sys.path.insert(0, RC_DIR)
      import run_uncond_census as UC
      import run_census as RC

      S = [x for x in range(101) if x not in {0, 10, 91}]
      n_plus  = sum(1 for x in S if legendre(f_val(x), 101) ==  1)
      n_minus = sum(1 for x in S if legendre(f_val(x), 101) == -1)

      symtab = RC.compile_sym(101, 1, 0)
      fpoly = RC.pnorm([0, 1, 0, 1], 101)   # f(X) = X^3 + X
      tally = {c: 0 for c in UC.CLASSES}
      for r1, r2, r3 in itertools.combinations(S, 3):
          e1 = (r1+r2+r3) % 101
          e2 = (r1*r2+r1*r3+r2*r3) % 101
          e3 = (r1*r2*r3) % 101
          g = [(-e3) % 101, e2, (-e1) % 101, 1]
          if UC.resultant(g, fpoly, 101) == 0:
              continue   # not expected on this stratum; counted as anomaly
          qe = RC.qe_from_sym(symtab, 101, e1, e2, e3)
          label = UC.classify_fibre(qe, 101)
          tally[label["class"]] += 1
    own_n_plus_n_minus: {n_plus: 48, n_minus: 50, sum: 98, expected_p_minus_Z: 98}
    stratum_enumeration:
      base_points_enumerated: 152096
      expected_C_98_3: 152096
      match: true
      resultant_zero_anomalies: 0
      none_qe_anomalies: 0
    own_observed_five_class_counts:
      "1^4": 36944
      "2+2": 108096
      "2+1+1": 7056
      "4": 0
      "3+1": 0
      total: 152096
    own_D3_prediction:
      formula_used: >-
        D = h_+*n_- + h_-*n_+ ; #1^4 = C(n_+,3)+C(n_-,3)+D ;
        #2+1+1 = 3*n_+*n_- - 3*D ;
        #2+2 = C(n_++n_-,3) - C(n_+,3) - C(n_-,3) - 3*n_+*n_- + 2*D
        (re-checked verbatim against IDEA-20260904-4f614a section D3,
        notation block; not paraphrased from the task prompt).
      D: 48
      D_terms: {"h_plus_times_n_minus": 0, "h_minus_times_n_plus": 48}
      predicted:
        "1^4": 36944
        "2+1+1": 7056
        "2+2": 108096
    own_residuals:
      R1_1^4: 0
      R2_2plus1plus1: 0
      R3_2plus2: 0
      all_zero: true
    verdict: >-
      HOLDS. Own independent reclassification (own driver, own n_+/n_-
      computation, own J1 h_+/h_- values) reproduces R1 = R2 = R3 = 0
      exactly, with the full exhaustive 152,096-point stratum matching
      C(98,3) exactly and zero anomalies (resultant-zero or None-Qe) on this
      stratum, as required.

