        computation has no randomness, so two runs cannot differ without a
        nondeterminism bug) and is correctly NOT presented as independent
        replication evidence. I found no new instance of the conditioning-trap
        pattern in this run at the spots I checked. I have NOT independently
        re-read the three prior incidents in this sub-thread in enough detail
        to confirm this run avoids every specific failure mode those incidents
        surfaced; this is a limitation of this review, not a clean bill of
