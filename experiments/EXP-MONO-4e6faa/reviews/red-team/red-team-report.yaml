        consistent with an unbiased coin flip, not a sign of a systematically
        favorable search order and not, on its own, a demonstration that
        h_->0 objects are exotic or hard to find. The deterministic
        A-ascending-then-B-ascending order is pre-registered in the frozen
        specification (before any result was seen), so there is no
        post-hoc-selection concern even though the base rate is high; the
        record's own framing ("stress test," "genuine search") should be read
        with this base rate in mind -- it does not overclaim rarity anywhere
