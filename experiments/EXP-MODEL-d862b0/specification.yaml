experiment:
  id: EXP-MODEL-d862b0
  hypothesis_id: H-MODEL-25e2eb
  derived_from_idea: IDEA-20260807-4fc635
  question_id: RQ-MODEL-e61cb2
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    The PGL_2(F_p) null battery for curve-model claims: per-variable random Moebius decay sweep,
    the shifted-Kummer exact-equality calibration gate, and the planted deck-group positive control,
    with a pre-registered four-cell interpretation table
  objective: >-
    The one uncertainty a run reduces is which of the L11 lane's measured quantities are properties
    of the curve model and which are properties of the coordinate change. A run establishes
    (i) whether the two hard gates pass - the shifted-Kummer coordinate reproducing every algebraic
    metric exactly after retargeting, and the planted deck-group signal at g = 4 being detected -
    which together decide whether any number this lane has produced or will produce is
    interpretable at all; (ii) the orbit distribution, over 30 independent per-variable PGL_2 draws
    at each number r of randomised variables, of per-variable degree, monomial support size, Bezout
    number, Groebner solving-degree proxy and wall time; and (iii) the filled interpretation table
    assigning each metric to model-invariant, reparametrisation-artifact, or genuine-model-effect.
    No attack, key recovery, speedup or security consequence is claimed here or would follow from a
    run. No statement is made about what the published literature contains. No direction is declared
    impossible.
  what_this_is_not:
    - >-
      Not an attack, a key recovery, a distinguisher, or a cryptanalytic result of any kind. It is a
      control battery and a measurement contract.
    - Not a claim, in either direction, about the security of any deployed curve or parameter set.
    - >-
      Not a status change to any hypothesis, evidence record, decision or goal record, and not a
      promotion of any knowledge entry.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
      has been executed under this contract.
    - >-
      Not a re-litigation of EV-REP-001 or EV-REP-002. Those records stand; this contract measures
      what their comparisons could and could not have distinguished.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the executed toy primes, arity m = 3, and the executed degree-2
      coordinates, each named metric has a measured orbit distribution under per-variable PGL_2
      substitution, and the two hard gates either passed or failed. WHAT DOES NOT FOLLOW - no
      statement about the ECDLP; no cost or exponent claim; no statement about coordinates of degree
      other than 2; no statement about a crypto-scale parameter set; and specifically NOT that a
      metric found reparametrisation-invariant at toy scale is invariant at any larger scale, which
      would be a separate assumption requiring its own evidence.
  inputs:
    procedure: >-
      STAGE 1 (minutes, GATE): implement the per-variable substitution machinery - take a polynomial
      in t_1..t_m and a tuple of PGL_2(F_p) matrices, substitute, clear denominators, reduce to the
      squarefree part under a normalisation convention frozen before this stage. Verify on the
      identity element (must return the input unchanged, coefficient for coefficient) and on a
      composition (mu then nu applied in sequence must equal the composed map applied once). Also
      run the deliberately broken substitution (denominators not cleared), which the identity test
      must catch. GATE - a failure halts everything downstream.
      STAGE 2 (minutes, GATE): NULL-3, the shifted Kummer coordinate. Implement x_R(P) = x(P - R)
      through the SAME code path as x(P), build the full decomposition system in that coordinate
      with the right-hand side retargeted to target - mR, and compare every algebraic metric with
      the Weierstrass baseline. Required - exact equality. GATE.
      STAGE 3 (minutes, GATE): NULL-5, the planted signal. Construct a j = 1728 curve with
      4 | p - 1, take the coordinate x^2 whose deck group has order 4, and confirm the pipeline
      reports per-variable degree 4^(m-2) and Bezout B^(m-1)/4 rather than 2^(m-2) and B^(m-1)/2.
      Repeat at g = 6 on a j = 0 curve with 6 | p - 1. GATE.
      STAGE 4 (about an hour): the decay sweep. For r = 0, 1, .., m apply r independent random
      Moebius maps to r distinct variables, repeat over 30 independent draws, and record every
      metric per draw. Report min, median, max, interquartile range per (metric, r).
      STAGE 5 (minutes): the affine sub-battery. Sweep beta from random to exactly 0 at fixed alpha
      and confirm the support returns to exactly 13 at beta = 0.
      STAGE 6 (about an hour): the symmetry null two-by-two - (rational 2-torsion present or absent)
      x (diagonalising coordinate or random Moebius) - recording pass/fail of the parity and
      palindrome checks in all four cells.
      STAGE 7 (zero compute): emit the interpretation table of the parent proposal, filled in with a
      verdict cell for every metric measured.
    instrument: >-
      Python with a symbolic algebra library for the elimination and a fixed-seed random number
      generator for the PGL_2 draws. The substitution, denominator clearing and squarefree reduction
      are written from their definitions in this contract's own module; the decomposition system and
      the toy instance generator are the committed harness modules shared across this lane. The
      PGL_2 sampler is rejection sampling on 2x2 matrices with nonzero determinant, and its
      uniformity is checked by exhaustive enumeration at a small p before any draw is consumed. All
      runs recorded through the program's run wrapper with a manifest.
    parameters: >-
      Toy primes at roughly 16, 20 and 24 field bits; summation arity m = 3 so r sweeps 0, 1, 2, 3;
      30 independent PGL_2 draws per (prime, r) cell; affine sub-battery with alpha fixed and beta
      taking 5 values ending at exactly 0; deck order g in {2, 4, 6} realised on a generic curve, a
      constructed j = 1728 curve with 4 | p - 1, and a constructed j = 0 curve with 6 | p - 1; one
      additional curve with no rational 2-torsion for the symmetry null. Wall-time noise band frozen
      before Stage 4 as plus or minus 25 percent of the median of 10 repeated timings of the
      baseline cell.
  controls:
    - >-
      Identity element of PGL_2 - must be an exact no-op, coefficient for coefficient. Blocking.
    - >-
      Composition consistency - substituting mu then nu must equal substituting the composite once.
      Blocking.
    - >-
      Deliberately broken substitution with denominators left uncleared, which the identity test
      must catch. A battery whose own wiring check cannot fail is not a check.
    - >-
      NULL-3, the shifted Kummer coordinate x_R(P) = x(P - R) with the target retargeted to
      target - mR. Predicted answer is EXACT EQUALITY on every algebraic metric, not a distribution.
      This is the calibration standard and it is blocking.
    - >-
      NULL-5, the planted deck-group positive control at g = 4 and g = 6. The measured Bezout number
      must track B^(m-1)/g. Blocking - an instrument that detects nothing everywhere is
      indistinguishable from one that is not connected.
    - >-
      NULL-4, the symmetry null - a curve with no rational 2-torsion, on which the parity-grading
      check must FAIL. A symmetry test that passes where the symmetry cannot exist is measuring an
      implementation artifact.
    - >-
      NULL-2 endpoint, the affine sub-battery with beta going to exactly 0, where support must return
      to exactly 13. The sharpest artifact test in the battery because its endpoint is known.
    - >-
      Uniformity check on the PGL_2 sampler itself by exhaustive enumeration at small p, before any
      draw is used in a measured cell.
  independent_variables:
    - number r of randomised variables, sweeping 0 to m
    - 'coordinate family: Weierstrass baseline / random Moebius / shifted Kummer / squared coordinate on j = 1728'
    - deck-group order g in {2, 4, 6}
    - affine shift beta, swept from random to exactly 0 at fixed alpha
    - presence or absence of rational 2-torsion on the curve
    - field size in bits
  metrics:
    primary:
      - name: support_size_distribution
        units: number of monomials with nonzero coefficient, dimensionless integer
        computed: >-
          For each (prime, r, draw) cell, count the monomials of the substituted, denominator-cleared,
          squarefree-reduced summation polynomial whose coefficient is nonzero in F_p. Report min,
          median, max and the exact count of draws attaining each distinct value, over the 30 draws.
      - name: per_variable_degree
        units: degree, dimensionless integer
        computed: >-
          Maximum exponent of each variable t_i in the substituted polynomial, per draw. Reported as
          a full distribution over the 30 draws, not a mean, because the prediction is zero variance.
      - name: null3_exact_equality_pass_fraction
        units: fraction of algebraic metrics agreeing exactly, in [0, 1]
        computed: >-
          Over the frozen list of algebraic metrics (per-variable degree, total degree, support size,
          Bezout number, solving-degree proxy), the fraction whose shifted-Kummer value equals the
          retargeted Weierstrass baseline value EXACTLY as integers. Required value is 1.
      - name: null5_bezout_ratio
        units: dimensionless ratio
        computed: >-
          Measured Bezout number at deck order g divided by the predicted B^(m-1)/g, reported per
          g in {2, 4, 6}. Required value is exactly 1 at each g.
      - name: solving_cost_orbit_spread
        units: >-
          interquartile range of the Groebner solving-degree proxy (dimensionless integer) and of
          wall time (seconds), each over the 30 draws at r = m
        computed: >-
          Order the 30 per-draw values at r = m and take the 75th minus the 25th percentile. Reported
          alongside the largest and smallest model-versus-baseline gap recorded in EV-REP-001 and
          EV-REP-002, cited as those records' values and not re-measured here.
    secondary:
      - name: bezout_number
        units: dimensionless integer
        computed: Product of per-variable degrees of the substituted system, per draw.
      - name: wall_time
        units: seconds
        computed: >-
          Median of 10 repeated timings of the elimination per cell, with the frozen noise band
          reported alongside. Labelled weak evidence in every report, since toy-scale timing is
          dominated by library overhead.
      - name: identity_and_composition_pass
        units: boolean per check
        computed: Exact coefficient-wise equality of the substituted polynomial with its reference.
      - name: symmetry_two_by_two
        units: pass/fail per cell, 4 cells
        computed: >-
          Parity-grading and palindrome checks evaluated in each of (2-torsion present or absent) x
          (diagonalising coordinate or random Moebius).
      - name: affine_endpoint_support
        units: number of monomials, dimensionless integer
        computed: Support size at each of the 5 beta values, with the beta = 0 value reported exactly.
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The joint tuple (per_variable_degree, support_size_distribution, null3_exact_equality_pass_fraction,
      null5_bezout_ratio, solving_cost_orbit_spread).
    formula: >-
      per_variable_degree = 2 exactly, zero variance, for every r and every draw. support_size = 13
      at r = 0 and = 27 for every r >= 1 in at least 28 of 30 draws, and = 13 exactly at beta = 0.
      null3_exact_equality_pass_fraction = 1. null5_bezout_ratio = 1 at each of g = 2, 4, 6.
      solving_cost_orbit_spread is DECLARED OPEN and is the quantity the contract most wants; the
      record's stated expectation, with prior 0.6, is that its interquartile range exceeds the
      largest model-versus-baseline gap in EV-REP-002, and the opposite outcome is a negative for
      that expectation and is reported as one.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-4fc635 (predictions block) before any run
      under this contract exists. Never tuned to data; a run that reports a different quantity
      reports a different experiment.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at roughly 16 to 24 field bits in pure Python symbolic algebra, far below any
      deployed parameter set. That is adequate because every quantity under test is an algebraic
      invariant of a polynomial system - degree, support, Bezout - whose value at toy scale is the
      value the definition gives, not an approximation to a larger-scale value. The one metric that
      does NOT transfer is wall time, which at this scale is dominated by library overhead; the
      contract labels it weak evidence rather than extrapolating it. No transfer assumption is made
      or needed for the algebraic metrics, and none is licensed for the timing metric.
    correspondence: null
  tail_checks:
    - >-
      Report the full 30-draw distribution of every metric, never a mean alone, since a single
      atypical Moebius map (near-identity, or one moving a branch point to infinity) produces an
      outlier support that a mean would hide.
    - >-
      Report the number of draws in which the sampled matrix was within a declared distance of the
      identity, so a degenerate draw block can be distinguished from a mathematical effect.
    - >-
      Report the minimum and maximum solving-cost proxy at r = m separately from the interquartile
      range, since the tail is what would swallow a model difference.
    - >-
      Report per-cell whether the squarefree reduction removed a factor, since a silently dropped
      factor changes support without changing anything mathematical.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
    repeat_count_per_cell: 30
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 4.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
    - Halt the entire run if the Stage 1 identity or composition check fails.
    - Halt if NULL-3 fails exact equality on any algebraic metric; report the failing metric and nothing else.
    - Halt if NULL-5 fails to track B^(m-1)/g at g = 4; report the measured ratio and nothing else.
    - >-
      Stop at the declared sweep - r from 0 to m, 30 draws, 5 beta values, 3 deck orders. The draw
      count and the noise band are frozen before Stage 4 and are not revised after seeing a
      distribution.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop,
      never a negative result (AGENTS.md rule 5).
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
      and is NEVER negative mathematical evidence (AGENTS.md rule 5).
    - >-
      A run whose gate arms were not executed in the same invocation as the sweep arms is
      invalid_measurement - the comparison this contract exists to make was not made.
    - >-
      Failure to construct a j = 1728 curve with 4 | p - 1 or a j = 0 curve with 6 | p - 1 at the
      chosen primes is an INFRASTRUCTURE outcome, not a blindness finding; the run is incomplete and
      is re-dispatched with different primes.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT experiment and requires a new
      contract; it is never a repair of this one.
    - >-
      A run whose PGL_2 sampler uniformity check was skipped is invalid_measurement, since the orbit
      distribution is meaningless if the group is not sampled uniformly.
  success_criterion: >-
    The run is successful when ALL of the following hold and are read off the predefined metrics:
    (1) identity_and_composition_pass is true for both checks and the broken-substitution control is
    caught; (2) null3_exact_equality_pass_fraction = 1; (3) null5_bezout_ratio = 1 at each of
    g = 2, 4, 6; (4) per_variable_degree = 2 in all 30 x (m+1) x 3 draws with zero variance;
    (5) support_size = 13 at r = 0 and = 27 in at least 28 of 30 draws at every r >= 1, and = 13
    exactly at beta = 0; (6) the symmetry two-by-two shows the parity check FAILING on the
    2-torsion-free curve; and (7) solving_cost_orbit_spread is reported with its interquartile range
    and its comparison against the EV-REP-002 gap, with the interpretation table filled in for every
    metric. Note that (7) is satisfied by REPORTING the spread, in either direction - the battery
    succeeds whether the spread is wide or narrow, and which it is, is the finding.
  falsification_criterion:
    - >-
      NULL-3 exact-equality pass fraction below 1 - INSTRUMENT FAULT. The pipeline cannot reproduce
      itself under a translation; the L11 measurement programme halts and no sibling number is
      reportable. Not evidence about models.
    - >-
      null5_bezout_ratio not equal to 1 at g = 4 - INSTRUMENT BLIND. The battery cannot detect an
      effect predicted by theory, so every negative it would produce is void.
    - >-
      per_variable_degree varies across draws - the substitution machinery is not degree-preserving
      as implemented, which invalidates every degree claim in the lane.
    - >-
      support_size does not return to exactly 13 at beta = 0 - the canonical artifact tell; the
      normalisation or squarefree convention is wrong.
    - >-
      The identity element is not an exact no-op, or the broken-substitution control passes the
      identity test - implementation error, nothing is reportable.
    - >-
      The parity or palindrome check PASSES on the curve with no rational 2-torsion - the
      symmetry-derived sparsity claims of the sibling records are artifacts and must be withdrawn.
    - >-
      solving_cost_orbit_spread interquartile range at r = m is strictly below the smallest
      model-versus-baseline gap recorded in EV-REP-002 - the record's own headline expectation is
      refuted, solving cost is reparametrisation-invariant, and the lane's wall-time comparisons
      stand. This is a negative for the proposal and is reported as one, not softened.
  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved inference block and environment
    - raw-result.json carrying every per-draw measurement for all 30 draws in every cell, not summaries
    - the gate arms' measurements (NULL-3, NULL-5, identity, composition, broken substitution) in the same file as the sweep arms
    - the frozen wall-time noise band and the normalisation/squarefree convention, written before Stage 4 and hashed
    - the PGL_2 sampler uniformity check output at the small-p enumeration
    - the filled interpretation table, one verdict cell per measured metric
    - sha256 of every substituted polynomial's coefficient vector per cell, so a later run can be compared exactly
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Approval is required before execution and is the USER's gate, because it authorizes execution
      and spends compute. This contract is review_required and NOT approved; approved_by is null and
      execution_authorized is false.
    - >-
      The parent proposal declares proof_search_map not_applicable with a stated reason, so the
      KN-TECH-080 proof-oriented gate does not bind here; the Coordinator must confirm that reading
      before approval rather than inheriting it.
    - >-
      The wall-time noise band and the normalisation convention must be frozen in an amendment or in
      this contract before Stage 4 runs. Choosing either after seeing a distribution turns this
      contract into a claim.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260807-4fc635
    authored_at: '2026-08-25'
    note: >-
      Metrics, controls, gates and predictions are transcribed from the parent proposal's
      predictions, minimal_test and null_object_control blocks; the interpretation table is the
      proposal's part (D). Budgets come from the parent's declared estimated_cost (implementation
      medium, compute low) through the program's cost table. Boilerplate identical across contracts
      by program rule - invalidation rules, required artifacts, approval gate - comes from the fixed
      table. No field is invented: a value the proposal did not supply is either derived here and
      labelled as such (the noise band, the seed list, the exact budget numbers) or left null.
  derivation_gaps:
    - >-
      The wall-time noise model is specified here as a percentage band around a median of 10
      timings, but the parent proposal only requires that a noise model be declared before the run.
      The Coordinator must confirm this band is the one intended, since NULL-3's wall-time arm is
      judged against it.
    - >-
      The Groebner solving-degree proxy is named but not defined here; the exact proxy (highest
      degree reached during the elimination, or the number of S-polynomial reductions) must be fixed
      against the committed harness before approval, because two proxies would give two different
      spreads and the spread is the headline.
    - >-
      The comparison targets for solving_cost_orbit_spread are "the largest and smallest
      model-versus-baseline gap recorded in EV-REP-001/EV-REP-002". Those exact numbers must be read
      out of the committed evidence records and written into the contract before Stage 4, or the
      falsification criterion is not decidable.
    - >-
      Whether the 30-draw count suffices to distinguish a point mass from a narrow spread is not
      derived from a power calculation. The parent proposal states 30 draws distinguish a point mass
      from a spread but not two nearby distributions; a Coordinator wanting the latter must fund more
      draws in an amendment before the run.
