experiment:
  id: EXP-ECTD-cb23c5
  hypothesis_id: H-ECTD-e58462
  question_id: RQ-ECTD-001
  goal_id: GOAL-ECTD-001
  source_idea: IDEA-20261006-783062
  version: 1
  designed_at: '2026-10-10'
  title: One rational degree-2 Velu edge and its order and j invariants
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-10'
  frozen: true
  execution_authorized: true
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261010-d81975
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      One least-eligible-prime rational degree-2 quotient census for
      y^2=x^3-2x+1 with 5<p<256, plus fixed same-shape controls.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false
      applied: true
  claim_tier: toy
  objective: >-
    Select the least eligible prime below 256 for the fixed curve
    y^2=x^3-2x+1, construct the rational degree-2 isogeny through its
    unique rational 2-torsion point, and compare the source and codomain
    point counts and j-invariants. This is one explicit edge control for
    the ECTD question, not a weakness or path-recovery measurement.
  inputs:
    source_curve: y^2 = x^3 - 2x + 1
    source_a: -2
    source_b: 1
    prime_search:
      lower_exclusive: 5
      upper_exclusive: 256
      ascending: true
      primality: exact trial division through floor(sqrt(p))
      eligible: >-
        The source is nonsingular modulo p and x^3-2x+1 has exactly
        one distinct root r in F_p. Select the first eligible prime.
      no_eligible_prime: >-
        Exhaust every prime in the frozen interval, preserve each rejection
        reason, and score the source idea's no-instance negative outcome.
    kernel: >-
      T=(r,0) in E(F_p), with exact order 2; kernel {O,T}.
    quotient_construction: >-
      Put X=x-r, A=3r, B=3r^2-2 modulo p. The translated source is
      y^2=X^3+A*X^2+B*X. For X nonzero use the degree-2 quotient map
      u=X+A+B/X, v=y*(1-B/X^2), and codomain
      v^2=u^3-2A*u^2+(A^2-4B)*u. Map O and T to the codomain identity.
      Record coefficients, kernel, map type, and degree. All arithmetic is
      exact in F_p.
    driver: experiments/EXP-ECTD-cb23c5/implementation/run.py
    checker: experiments/EXP-ECTD-cb23c5/implementation/check.py
    trial_plan: experiments/EXP-ECTD-cb23c5/trial-plan.json
  controls:
    - id: least-prime-and-root
      statement: >-
        Record every prime examined and its source discriminant and root
        count. Verify the selected p is prime, lies in the frozen interval,
        has nonzero discriminant, has exactly one distinct cubic root, and
        every smaller candidate prime fails eligibility.
    - id: kernel-order-and-rejection
      statement: >-
        Verify T lies on the source and 2T=O. Find the lexicographically
        first affine source point with y nonzero and require the kernel
        constructor to reject it as an order-2 kernel input. A three-root
        source prime must be rejected by instance selection.
    - id: translated-model-null
      statement: >-
        The source in original short form and in translated X=x-r form
        must have identical point count and j. Coordinate translation
        alone must not be scored as codomain j movement.
    - id: quotient-map
      statement: >-
        Verify both curves are nonsingular, the displayed map satisfies
        the codomain equation on every source affine point outside the
        kernel, and its only rational source poles are O and T. Verify
        the displayed quotient is a separable degree-2 isogeny with the
        stated kernel; a failed identity voids the scored comparison.
    - id: independent-orders-and-j
      statement: >-
        Enumerate point counts independently from each curve equation,
        including the identity, without copying an order. Compute each
        j from its own coefficients; recompute the source j from both its
        original and translated forms. A disagreement voids the score.
  independent_variables:
    - source versus translated source versus degree-2 codomain
  metrics:
    primary:
      - id: source_and_codomain_orders
        statement: Exact #E(F_p), #E2(F_p), and their integer difference.
      - id: source_and_codomain_j
        statement: Exact j(E), j(E2), and their equality indicator in F_p.
    secondary:
      - id: least_prime_certificate
        statement: Examined-prime table, root lists, discriminants, selected p and r.
      - id: kernel_and_map_certificate
        statement: T, 2T, quotient coefficients, map checks, and rejection control.
      - id: translated_model_null
        statement: Source and translated-source order and j equality flags.
      - id: resource_record
        statement: Python version, source identity, wall time, CPU time, and peak memory.
  heuristic_under_test: HEUR-1
  preregistered_prediction:
    quantity: source and codomain order difference plus j inequality
    formula: >-
      For the least eligible p, positive means both independently computed
      orders are equal and j(E) differs from j(E2). Equal j is a negative.
      Exhaustive absence of an eligible p in the frozen interval is also a
      negative. A verified order mismatch is preserved as an anomalous
      contradiction requiring independent review before interpretation.
    source: IDEA-20261006-783062
  scale_relevance:
    tier: toy
    justification: >-
      One small prime below 256 and one separable degree-2 edge. No
      transfer to larger fields, hidden paths, weak endpoints, or ECDLP
      work factors is licensed.
    correspondence: Direct exact construction in the selected finite field.
  tail_checks:
    - Report every skipped prime and its exact rejection reason.
    - Report source, translated-source, and codomain point counts and j values separately.
    - Preserve a failed map, order, or j check as a visible control failure.
  replication:
    seeds: []
    independent_instances: 1
    future_run_slot: RUN-ECTD-f96d04
    note: >-
      The selection and complete finite-field enumerations are deterministic.
      The separate checker recomputes the least-prime decision, counts, j
      values, and final flags from the raw result.
  budget:
    enforcement: advisory
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      Memory and process bounds protect the machine. A resource stop or
      implementation failure is infrastructure, not a numerical negative.
  stopping_rules:
    - Search the complete frozen prime interval if no eligible p is found.
    - At the first eligible p, complete every map and invariant control before scoring.
    - >-
      After the first eligible p, inspect a later prime only to exercise
      the separate three-root rejection control. Never select or score
      a later prime if the selected instance is unfavorable.
  invalidation_rules:
    - A wrong selected prime, unverified kernel, invalid map, failed rejection control, or failed translated-model null voids the scored edge.
    - A point-count disagreement between independent methods or a j recomputation disagreement voids the scored edge.
    - A timeout, crash, or missing required artifact is infrastructure, never a mathematical negative.
  success_criterion: >-
    An eligible prime exists, every selection and map control passes, the
    independently counted source and codomain orders are equal, and their
    exact j-invariants differ.
  falsification_criterion: >-
    Either the complete frozen prime search finds no eligible p, or all
    controls pass on the selected p and the exact source and codomain j
    values are equal. A verified order mismatch is an anomalous
    contradiction: preserve it and obtain independent breakthrough-tier
    review before assigning a hypothesis conclusion.
  decision_impact:
    on_positive: >-
      An evidence review may record one certified rational degree-2 edge
      with shared group order and distinct j at the selected small prime.
      It establishes no trapdoor, weak endpoint, or attack-cost change.
    on_negative: >-
      An evidence review may weaken only the proposal's fixed-prime
      j-movement prediction, or record that the bounded search found no
      eligible prime. It does not disprove degree-2 j movement elsewhere.
    on_anomalous_order_mismatch: >-
      Preserve the raw finding and seek independent map/count review at the
      required breakthrough tier before any contradiction claim or status
      transition.
  required_artifacts:
    - experiments/EXP-ECTD-cb23c5/runs/RUN-ECTD-f96d04/manifest.yaml
    - experiments/EXP-ECTD-cb23c5/runs/RUN-ECTD-f96d04/raw-result.json
  run_report: >-
    After the run records are sealed, its observation report, quantitative
    graph with source, and inspected PDF are written under a fresh
    experiments/EXP-ECTD-cb23c5/reports/run-<UTC timestamp>/ directory
    following the research-visuals skill.
  assigned_to: executor
