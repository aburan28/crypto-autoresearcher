experiment:
  id: EXP-SIMSPK-fbbf19
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-74950b; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-74950b
  question_id: RQ-SIMSPK-f6a6c0
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Cross-word-size transfer matrix for rotation-constant rankings: rank trajectories of literal
    integer triples at word sizes 8, 12, 16 and 24 under a fixed measure and a frozen comparable round-count
    rule, with label-shuffle and independent-trajectory nulls'
  objective: 'A run reduces exactly one uncertainty: whether a ranking of rotation constants computed
    at the toy word sizes this goal can afford says anything about the word sizes the family actually
    deploys. Concretely it determines (i) whether the scoring pipeline is deterministic, checked by
    a self-transfer arm that must return Kendall tau exactly 1.0 between a word size and a rerun of
    itself, since any nondeterminism would masquerade as imperfect transfer; (ii) the full transfer
    matrix of Kendall tau-b between rankings at word sizes 8, 12, 16 and 24, with bootstrap intervals
    over triples, computed on the shared literal-triple domain at round counts fixed by a frozen comparable-fraction
    rule so that word size rather than relative depth is the varying factor, reported against a 1000-permutation
    label-shuffle band and an independent-trajectory null; and (iii) whether the matrix''s entries
    depend on the arithmetic relationship between word-size pairs or merely on their numeric distance,
    which is the mechanism claim and whose failure leaves the measurement intact. The censoring-symmetric
    recomputation and the proportional-scaling robustness arm establish that any transfer conclusion
    is not an artifact of differential censoring or of one cross-size interpretation. No hypothesis
    is minted and no constant is declared better at any size.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: medium
    exact_scope_a_run_could_support: 'At most, a run could support: for the single measure actually
      swept, on the shared literal-triple domain, at word sizes 8, 12, 16 and 24, at round counts
      set by the frozen comparable-fraction rule, under the cross-size interpretation used, with the
      censoring rates reported, (a) a self-transfer calibration result; (b) a transfer matrix of Kendall
      tau-b with bootstrap intervals and null bands; (c) a transfer horizon at the declared threshold;
      and (d) per-triple rank trajectories including the standardized triple''s. What does NOT follow:
      that any measure value, margin, weight or reach transfers, since only rankings are measured;
      that transfer measured for this measure holds for any other portfolio measure; that transfer
      holds to word sizes 32, 48 or 64, which are not run; that a stable or unstable rank says anything
      about design, intent, provenance or security; any attack, distinguisher or complexity claim;
      and any statement that a constant is strong or weak at any word size.'
  inputs:
    procedure: 'STAGE 0, freeze the measure, the shared literal-triple domain, the comparable round-count
      rule and its two sensitivity variants, the cross-size interpretation, and the 0.7 transfer threshold;
      hash the specification. Zero compute, 1 to 2 hours human. STAGE 1, resolution gate: confirm
      from the resolution-profiling contract that the chosen measure has a usable window at every
      swept word size; a size failing the gate is dropped from the sweep and the drop is recorded.
      Minutes. STAGE 2, score at word size 8, all shared literal triples, at the rule''s round count.
      Minutes. STAGE 3, self-transfer calibration: rescore word size 8 and require tau exactly 1.0.
      Minutes. STAGE 4, score at word sizes 12, 16 and 24 in that order, recording censoring flags
      and per-size wall clock; the word size 24 stage is bounded by its declared budget and reported
      as a budget outcome if it binds. STAGE 5, rank conversion within each size and trajectory assembly.
      Seconds. STAGE 6, transfer matrix with 1000-resample bootstrap, label-shuffle null over 1000
      permutations, independent-trajectory null. Seconds. STAGE 7, structure test tabulating tau against
      the arithmetic relationship of each word-size pair. Seconds. STAGE 8, robustness: censoring-symmetric
      recomputation, two alternative round-count fractions, and the proportional-scaling cross-size
      interpretation at word sizes 8 and 16.'
    instrument: CPython 3.11 standard library only; numpy, z3, python-sat and pulp are absent in this
      environment as verified on 2026-08-16 and Sage is excluded by contract. The measure is invoked
      as a frozen module from its own contract rather than reimplemented here, so this contract contributes
      only the cross-size harness and the statistics. Kendall tau-b, the bootstrap and the permutation
      nulls are implemented from scratch and cross-checked against a hand-computed 12-element fixture
      stored in the run directory. Seeds for the bootstrap, the shuffles and the independent-trajectory
      null are recorded separately in the manifest. Manifest, seeding and per-stage timing follow
      harness/runner.py conventions; identifiers minted with tools/allocate_id.py --next.
    parameters: 'Word sizes 8, 12, 16 and 24. Shared literal-triple domain: entries in 0 through 7,
      giving 512 literal triples that reduce identically at every swept size, with an extended-domain
      robustness arm at word sizes 16 and 24 only. Measure: one portfolio measure with a confirmed
      resolution window at all four sizes, preferring impossible-differential reach for its O(n) per-round
      cost. Round counts: a frozen fraction of each variant''s full round count, primary fraction
      one third, with sensitivity fractions one quarter and one half. Bootstrap 1000 resamples; label
      shuffle 1000 permutations; independent-trajectory null 1000 draws. Transfer threshold 0.70 for
      the horizon. Censoring flags recorded per cell with rates reported per word size. Total run
      ceiling 7200 seconds excluding the inherited measure budget.'
  controls:
  - 'Self-transfer calibration: rescore one word size and require tau exactly 1.0, detecting any nondeterminism
    in the scoring pipeline.'
  - Label-shuffle null within one word size, 1000 permutations, giving the independence band directly
    from the real marginals.
  - Independent-trajectory null with ranks drawn independently per word size, giving the tau expected
    when trajectories carry no structure.
  - 'Censoring symmetry check: censoring rates reported per word size, with a rerun excluding all
    censored triples from every size symmetrically to confirm the transfer conclusion is not censoring-driven.'
  - 'Alternative cross-size interpretation: rotation amounts scaled proportionally to n rather than
    reduced modulo n, run at word sizes 8 and 16, so the conclusion does not rest on one interpretation
    of what the same constant means across sizes.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls, both in the same invocation. The primary null object is
    a set of trajectories in which each triple''s rank at each word size is drawn independently and
    uniformly, matching the observed rank distribution but carrying no cross-size structure; the identical
    transfer matrix is computed on it, giving the tau expected when trajectories mean nothing, which
    is centred on zero with a spread set by the number of triples. The secondary null is a label shuffle
    within one word size, permuting which triple holds which rank at word size 16 while leaving word
    size 8 intact, over 1000 permutations, giving the independence band directly from the real marginals.
    For the signal arm to mean anything, the observed tau between adjacent word sizes must lie outside
    the label-shuffle band; if it lies inside, the ranking does not transfer at all between those
    sizes and every toy-scale conclusion in this goal is scoped to its own word size, which is a decisive
    and highly usable measured obstruction. A third calibration arm computes tau between a word size
    and itself under a rerun, which must be exactly 1.0 and detects any nondeterminism in the scoring
    pipeline.'
  independent_variables:
  - word size n
  - literal rotation triple (a,b,c)
  - round-count fraction (one quarter, one third, one half)
  - cross-size interpretation (reduction modulo n versus proportional scaling)
  - arm (real trajectories, label-shuffle null, independent-trajectory null, self-transfer calibration)
  metrics:
    primary:
    - Kendall tau-b per word-size pair with bootstrap interval
    - label-shuffle independence band per word-size pair
    - self-transfer tau, required exactly 1.0
    - transfer horizon n_max at the 0.70 threshold
    secondary:
    - independent-trajectory null tau per pair
    - per-triple largest inter-size rank jump, with the standardized and median triples reported
    - censoring rate per word size and the transfer matrix on the censoring-symmetric subset
    - transfer matrix under the two alternative round-count fractions and under proportional scaling
    - wall-clock seconds and peak resident memory per word size
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The Kendall tau-b transfer coefficient between the rotation-constant ranking at word
      size 8 and at word size 16, under the frozen measure, the shared literal-triple domain and the
      primary round-count fraction, together with its position relative to the 1000-permutation label-shuffle
      band.
    formula: For each word size n in the sweep and each literal triple t in the shared domain, let
      v(t,n) be the frozen measure's value at the round count given by the comparable rule, and let
      R(t,n) be t's mid-rank percentile among all shared-domain triples at word size n, computed within
      that word size only. The transfer coefficient between sizes n and n' is tau_b of the paired
      sequences R(.,n) and R(.,n') over the uncensored shared domain, with ties handled by the tau-b
      correction and tie counts reported. The self-transfer prediction is exactly 1.0. The structural
      prediction is that tau_b(n,n') is not a function of the numeric distance between n and n' alone.
      No value is pre-committed for tau_b(8,16) itself, because the campaign has never computed a
      ranking at two word sizes and any predicted value would be fabrication; what is pre-committed
      is the 0.70 horizon threshold, frozen before scoring, and the rule that no toy-scale extrapolation
      elsewhere in this goal may be made without quoting the relevant coefficient.
    source: Pre-registered in the parent proposal IDEA-20260816-74950b before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: medium
    justification: 'The sweep spans word sizes 8, 12, 16 and 24, of which 16 and 24 are word sizes
      the family actually deploys, corresponding to block sizes 32 and 48; this reaches deployed parameters
      directly for two of the four points, which is why the tier is medium rather than toy. The measure
      is chosen for cost specifically so that the deployed sizes are reachable, since a measure affordable
      only at word size 8 could not answer a transfer question at all. The transfer assumption this
      contract makes about ITSELF is stated: results cover word sizes 8 through 24 and say nothing
      about 32, 48 or 64, which are not run, and the shared literal-triple domain restricted to entries
      0 through 7 means the measured transfer describes that subdomain rather than the full constant
      space at the larger sizes. Both restrictions are named in every conclusion, and the extended-domain
      robustness arm at sizes 16 and 24 bounds how much the restriction matters.'
    correspondence: null
  tail_checks:
  - Triples whose entries collide after reduction at a small word size are reported as a declared
    degenerate stratum and the matrix is recomputed with them excluded, since artificial ties distort
    tau.
  - The extreme ranks at each word size, the top and bottom deciles, are tracked across sizes separately,
    since a matrix can show healthy overall tau while the tails scramble completely and the tails
    are what a campaign quotes.
  - The word size 24 stage is reported with its actual completion status, since it is the most likely
    to bind against budget and a truncated sweep must not be presented as a completed row of the matrix.
  - The largest single inter-size rank jump across all triples is reported by name, since one triple
    moving from the first percentile to the ninety-ninth is a qualitatively different finding from
    diffuse decay.
  - Word-size pairs where either size failed the resolution gate are reported as excluded rather than
    filled in.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt the entire run and report an instrument fault if the self-transfer calibration returns tau
    below 1.0, since nondeterminism invalidates every transfer number.
  - Drop any word size failing the resolution gate before scoring begins and record the drop; do not
    proceed and then explain a low tau by resolution afterwards.
  - Halt the word size 24 stage at its declared budget and report the triples actually scored; a truncated
    row is reported as truncated and its tau entries are withheld rather than computed on a biased
    subset.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Self-transfer tau exactly 1.0, every swept word size passing its resolution gate,
    and the full transfer matrix reported with bootstrap intervals, label-shuffle bands, the independent-trajectory
    null, the transfer horizon, and the censoring-symmetric recomputation.
  falsification_criterion:
  - Self-transfer tau below 1.0, indicating a nondeterministic scoring pipeline.
  - Every transfer matrix entry lying inside the label-shuffle band, meaning rankings do not transfer
    between any pair of swept word sizes.
  - Transfer matrix entries fully explained by numeric distance with no dependence on arithmetic relationship,
    falsifying the structural prediction.
  - Transfer conclusions reversing on the censoring-symmetric subset, meaning the measured transfer
    is a censoring artifact.
  - Transfer conclusions reversing under the proportional-scaling cross-size interpretation, meaning
    the result is an artifact of reduction modulo n.
  - Transfer conclusions reversing under either alternative round-count fraction, meaning the comparable-round
    rule rather than word size is driving the matrix.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-74950b
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The comparable round-count rule is the contract's most consequential modelling choice and the
    Coordinator must fix the primary fraction before scoring; the proposal suggests one third of each
    variant's full round count and runs two sensitivity variants, but the choice is not the proposal's
    to make and a rule chosen after seeing the matrix would invalidate it.
  - Which portfolio measure is swept must be decided by the Coordinator against the resolution-profiling
    results, since a measure without a window at word size 24 cannot contribute that row; the proposal's
    preference for impossible-differential reach is a cost argument and not an authority.
  - Whether the shared literal-triple domain restricted to entries 0 through 7 is an acceptable scoping
    choice, or whether the extended domain must be primary rather than a robustness arm, is a Coordinator
    decision with a direct cost consequence at word size 24.
  - Whether the 0.70 transfer threshold is the right licence boundary for extrapolation in this goal's
    other contracts, and what those contracts must do if the measured tau falls below it, is a policy
    question this contract measures but does not settle.
