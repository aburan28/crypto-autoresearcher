# gap + Delta(m) sign-flip table (claims C1–C3).
#
# Source: IDEA-20260922-1a081a under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Absorbs IDEA-20260922-c07598 as a symmetry-ledger section (also designed
# separately as EXP-BINSTD-e6fc82 on PR #1545 — cited, not re-run).
# Support restatement: HOLD-X4 / IDEA-20260926-cafcf1 (EXP-BINSTD-c05a0f).
#
# ZERO RUNS in this design packet. Stage 0 authorized for executor
# TASK-20261002-cd30d0. No AUXIN. Amazon Bedrock prohibited.
# NO break. NO attack. NO exponent. Composition / indexing only.
# =============================================================================
experiment:
  id: EXP-BINSTD-7100ec
  hypothesis_id: H-BINSTD-72f0cc
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-1a081a
  absorbed_idea_ids:
    - IDEA-20260922-c07598
  related_idea_ids:
    - IDEA-20260926-cafcf1
    - IDEA-20260915-8fe0ef
    - IDEA-20260913-41c4f0
    - IDEA-20260922-8ac1ea
  goal_id: GOAL-ECDLP2M-001
  hold_id: HOLD-B
  version: 1
  title: >-
    HOLD-B Stage-0: curve-blindness corpus census (C1), independent rho gap
    table with (227,55) fixture (C2), and signed Delta(m) fan with branch
    labels (C3)
  status: approved
  approved_by: DEC-20261002-e4e699
  approved_at: '2026-10-02'
  # Top-level frozen/execution_authorized are what tools/experiment_execution.py
  # load_plan reads (nested approval.frozen alone is not sufficient).
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0]
  execution_authorized_note: >-
    Stage 0 authorized for /run admission under DEC-20261002-e4e699 and live
    executor TASK-20261003-775f8a / trial-plan-v1.json. Design-time executor
    TASK-20261002-cd30d0 remains historical. No Magma/Sage/AUXIN/Bedrock.
  approval:
    approved_by: DEC-20261002-e4e699
    composing_decision: DEC-20261002-e4e699
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stage 0 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0]
    scientific_execution_authorized_note: >-
      Stage 0 is zero-compute: corpus grep, independent arithmetic from the
      audit dump, support restatement against cafcf1 certificate, c07598
      section citation. No Magma/Sage. No AUXIN. No Bedrock. No decomposition
      solve.
    execution_state: >-
      approved frozen contract; Stage 0 /run-admissible under
      TASK-20261003-775f8a / trial-plan-v1.json
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    (1) Freeze Stage-0 preregistered predictions for C1–C3 and the five-column
    consequence. (2) Census filed binary IC cost laws for curve-coefficient
    reads (C1). (3) Independently recompute the ten matched-rho design figures
    and (227,55) fixture (C2). (4) Build the signed Delta(m) table for named
    blind and aware lines with branch labels (C3). (5) Restate HB1-2 support
    against HOLD-X4/cafcf1 before any trigger reading. (6) Deliver exactly one
    O-* label. Observations only.

  class: measurement
  class_note: >-
    Composition / indexing experiment with a Stage-0 arithmetic+grep
    certificate. Carries C1–C3. Not an exponent-moving breakthrough; no ECDLP
    attack table; no lambda_x measurement.

  scope:
    included:
      - >-
        Stage 0 (ZERO COMPUTE beyond grep + Python arithmetic). Write
        stage0/preregistered-predictions.json freezing: C1 predicted
        counterexample count 0; Delta_rho targets
        {163:3.67,233:4.43,283:4.57,409:4.84,571:5.08} bits within 0.05;
        (227,55) fixture; C3 blind Delta>0 (>=3.6); C3 aware Delta<0
        (magnitude>=3.1); five IC columns under C1.
      - >-
        C1 census: list every binary IC cost law in ledger/ and knowledge/
        in scope; record whether it reads a/b other than through lambda_x/r;
        emit stage0/c1-census.json and stage0/c1-census.md.
      - >-
        C2: independent script from analysis/binstd-curve-audit/ parameters
        emits ten rho figures and (227,55); stage0/c2-rho-table.json.
      - >-
        C3: signed Delta table for Semaev/Nagao-style blind lines and
        GGMP-type aware lines with branch column; stage0/c3-delta-table.json.
      - >-
        Support restatement note citing EXP-BINSTD-c05a0f / IDEA-20260926-
        cafcf1 before any HB1-2 trigger reading; c07598 section pointer to
        IDEA-20260922-c07598 / EXP-BINSTD-e6fc82 (PR #1545).
      - >-
        Nearby-object controls: sect193r1/r2 must not receive <tau,-1>
        baselines; sect239k1 must receive a Frobenius row.
      - RESULTS.md with exactly one O-* label from H-BINSTD-72f0cc.
    excluded:
      - Magma/Sage/cypari2/AUXIN provisioning as the success path
      - Amazon Bedrock
      - Editing IDEA-20260922-1a081a / c07598 / cafcf1 claim text
      - Editing shared GOAL-ECDLP2M-001.yaml
      - Claiming break / exponent / security verdict from this contract
      - Measuring lambda_x or running decomposition cells
      - Re-executing EXP-BINSTD-e6fc82 or EXP-BINSTD-c05a0f under this card
      - Treating infra failure as mathematical evidence against C1–C3
      - Reading HB1-2 Weil support as fired without the cafcf1 restatement

  inputs:
    proposal: ledger/proposals/IDEA-20260922-1a081a.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-72f0cc.yaml
    question: ledger/questions/RQ-BINSTD-b6f698.yaml
    hold_decisions:
      - ledger/decisions/DEC-20260924-99ce20.yaml
      - ledger/decisions/DEC-20260928-63addc.yaml
    absorbed_section: ledger/proposals/IDEA-20260922-c07598.yaml
    support_certificate_idea: ledger/proposals/IDEA-20260926-cafcf1.yaml
    support_certificate_exp_pointer: >-
      experiments/EXP-BINSTD-c05a0f/specification.yaml (PR #1562; may be
      absent on main until merge — cite by id; O-IMPEDIMENT if required
      bytes unavailable and cannot be fetched read-only)
    c07598_exp_pointer: >-
      experiments/EXP-BINSTD-e6fc82/specification.yaml (PR #1545; cite by id)
    audit_dump: analysis/binstd-curve-audit/binary-curve-params.txt
    audit_readme: analysis/binstd-curve-audit/README.md
    trial_plan: experiments/EXP-BINSTD-7100ec/trial-plan-v1.json
    implementation:
      - experiments/EXP-BINSTD-7100ec/implementation/run.py
      - experiments/EXP-BINSTD-7100ec/implementation/check.py
    related:
      - ledger/proposals/IDEA-20260915-8fe0ef.yaml
      - ledger/proposals/IDEA-20260913-41c4f0.yaml
      - ledger/proposals/IDEA-20260922-8ac1ea.yaml

  independent_variables:
    - name: corpus_freeze_timestamp
      levels: [stage0_freeze]
      role: defines C1 scope
    - name: field_degree_m
      levels: [163, 233, 283, 409, 571]
      role: FIPS pairs for C2/C3
    - name: line_class
      levels: [frobenius_blind, frobenius_aware_relation, frobenius_aware_LA]
      role: C3 regime

  controls:
    - name: n17_fixture
      description: >-
        Reproduce IDEA-20260915-8fe0ef (227, 55) before filling any C3 cell.
    - name: sect193_null_frobenius
      description: >-
        sect193r1/r2 must not receive a <tau,-1> baseline (nearby-object).
    - name: sect239k1_positive_frobenius
      description: >-
        sect239k1 must receive a Frobenius row; c2tnb239v* must not.
    - name: cafcf1_support_restatement
      description: >-
        HB1-2 Weil support restated against HOLD-X4 certificate before trigger.
    - name: c07598_section
      description: >-
        Symmetry ledger cited with corrected sqrt convention; not re-measured.
    - name: convention_matching
      description: >-
        C2 gaps compared only after naming negation-only vs plain-rho baseline.

  primary_metrics:
    - id: M-C1-COUNTEREXAMPLES
      definition: count of in-scope filed laws falsifying C1
    - id: M-C2-GAP-ERR
      definition: max |computed Delta_rho(m) - predicted| over five m (bits)
    - id: M-C2-FIXTURE
      definition: whether (227,55) reproduced exactly
    - id: M-C3-BLIND-MIN
      definition: min Delta(m) over blind cells (bits)
    - id: M-C3-AWARE-MAX
      definition: max Delta(m) over relation-dominated aware cells (bits)
    - id: M-COLS
      definition: IC column count recommended under C1 outcome

  secondary_metrics:
    - id: M-MEMORY
      definition: >-
        Peak RSS of Stage-0 scripts if any; else "N/A (grep+arithmetic)" —
        memory stated beside every time figure when scripts run.

  seeds_and_replication:
    random_seeds: []
    replication_plan: >-
      Stage 0 is deterministic given corpus freeze + audit dump. A second
      agent may re-run the same scripts; disagreement localises to census
      inclusion rules (recorded in stage0/c1-inclusion-rules.md).

  budget:
    wall_clock_seconds: 3600
    memory_gb: 2
    maximum_runs: 2
    cpu_note: advisory; Stage 0 is grep + arithmetic

  stopping_rules:
    - >-
      Stop Stage 0 when RESULTS.md names exactly one O-* label and all
      required_artifacts exist, or when a named O-IMPEDIMENT is filed.
    - Do not open any Stage beyond 0 under this contract.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze
    - Reading HB1-2 as fired without cafcf1 support restatement
    - Claiming break / exponent / security verdict
    - Provisioning Magma/Sage/AUXIN/Bedrock as the success path
    - Editing IDEA-20260922-1a081a / c07598 / cafcf1 or GOAL-ECDLP2M-001.yaml
    - Overwriting a prior RUN-* directory
    - Treating O-IMPEDIMENT as evidence against C1–C3

  success_criterion: >-
    ALL of: (1) Stage-0 freeze present; (2) C1 census artifact present with
    either zero counterexamples (O-C1-HOLD path) or a named counterexample
    law id (O-C1-COUNTEREXAMPLE path); (3) C2 table within 0.05 bit and
    (227,55) fixture pass, OR named O-C2-FAIL; (4) C3 table with branch
    labels present OR named O-C3-MIXED / O-IMPEDIMENT; (5) cafcf1 support
    restatement note present; (6) RESULTS.md names exactly one O-* label;
    (7) no invalidation_rule fired. Delivers the HOLD-B indexing reading;
    does NOT claim any curve is broken and does NOT promote a KN-FIND.

  falsification_criterion: >-
    ANY of: (F1) a filed law falsifying C1 while RESULTS claims O-C1-HOLD;
    (F2) C2 gap >0.05 bit or fixture miss while RESULTS claims O-C1-HOLD
    without O-C2-FAIL; (F3) a blind cell with Delta<=0 (or aware
    relation-dominated cell with Delta>=0) while RESULTS claims unconditional
    C3 success; (F4) HB1-2 trigger read without cafcf1 restatement; (F5)
    Magma/Sage/AUXIN/Bedrock used as success path; (F6) security/break/
    exponent claim. Budget exhaustion is O-IMPEDIMENT, not falsification of
    C1–C3.

  success_criteria:
    - Stage-0 freeze committed before census results are interpreted
    - Exactly one O-* label in RESULTS.md
    - Singular success_criterion above satisfied

  falsification_criteria:
    - Singular falsification_criterion above fires
    - Any invalidation_rule fires

  required_artifacts:
    - experiments/EXP-BINSTD-7100ec/implementation/
    - experiments/EXP-BINSTD-7100ec/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-7100ec/stage0/c1-inclusion-rules.md
    - experiments/EXP-BINSTD-7100ec/stage0/c1-census.json
    - experiments/EXP-BINSTD-7100ec/stage0/c1-census.md
    - experiments/EXP-BINSTD-7100ec/stage0/c2-rho-table.json
    - experiments/EXP-BINSTD-7100ec/stage0/c3-delta-table.json
    - experiments/EXP-BINSTD-7100ec/stage0/support-restatement-cafcf1.md
    - experiments/EXP-BINSTD-7100ec/stage0/c07598-section.md
    - experiments/EXP-BINSTD-7100ec/runs/
    - experiments/EXP-BINSTD-7100ec/RESULTS.md

  procedure:
    stages:
      - id: S0-FREEZE
        text: >-
          Write preregistered-predictions.json; write c1-inclusion-rules.md;
          write support-restatement-cafcf1.md and c07598-section.md; ZERO
          result interpretation before freeze.
      - id: S0-CENSUS
        text: >-
          Run C1 grep census; C2 rho script with (227,55); C3 Delta table;
          nearby-object controls; write RESULTS.md with exactly one O-*.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
