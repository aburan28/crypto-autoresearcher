experiment:
  id: EXP-XEDN-ad2158
  hypothesis_id: H-XEDN-f40aba
  derived_from_idea: IDEA-20260805-4efae0
  question_id: RQ-XEDN-004
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Unbounded relation search over the archived p = 31 no-relation surfaces, behind a
    reimplementation-fidelity gate, a computed-expectation spurious-hit null, and a
    frozen population - resolving whether the archived zero-relation cell is a density
    obstruction or a censored blow-up
  objective: >-
    The one uncertainty a run reduces is which of three indistinguishable ground-truth
    states produced the archived no-relation label at p = 31: no relation among the
    enumerated slots, a relation beyond the archived support ceiling, or a relation with
    a coefficient outside the archived alphabet. A run establishes (i) that a
    reimplementation of the archived search reproduces the archived instrument EXACTLY on
    the archived data, without which every downstream count is about a different object;
    (ii) the recovery table of that instrument against planted relations of known
    infinity-norm and support, computed and hash-committed BEFORE the archive is touched,
    so the archive is read against a frozen sensitivity curve; (iii) the measured
    spurious-hit rate of an unbounded search on matched null slot sets, against its
    computed expectation, which at p = 31 is not negligible; and (iv) the count of
    archived p = 31 no-relation surfaces admitting a relation of support at or above 5 or
    infinity-norm at or above 4 that passes the census's own generic verification. NO
    STATUS CHANGE to any record is proposed or permitted by this contract.
  what_this_is_not:
    - >-
      Not cryptanalysis and not an attack. It re-reads a committed archive with an
      uncensored instrument.
    - >-
      Not a demonstration that the audited hypothesis is FALSE in general. At most it
      falsifies that hypothesis AT p = 31, on the archived surfaces, by the hypothesis's own
      stated condition.
    - >-
      Not a demonstration that the audited hypothesis is TRUE. A count of zero shows the
      archived cell does not falsify it - a much narrower statement, and conflating the two
      would repeat the error being audited.
    - >-
      Not a status change to any goal, hypothesis, decision, evidence record or knowledge
      finding, and not a promotion of any knowledge entry.
    - >-
      Not a re-execution of the archived implementation, which cannot run in this container.
      That absence is an infrastructure fact the contract records rather than routes around.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or
      evidence. No run has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: over the frozen set of archived p = 31 no-relation
      surfaces, an unbounded search over the archived slot lists found this many relations
      passing the census's own generic verification, of which this many had support at or
      above 5 or infinity-norm at or above 4, at a measured spurious-hit rate of [value]
      against a computed expectation of [value]. WHAT DOES NOT FOLLOW: nothing about
      surfaces outside the archive; nothing about other primes; nothing about the audited
      hypothesis's truth; and no status change anywhere.
  inputs:
    procedure: >-
      STAGE 1 (zero compute, one hour): read the committed census implementation line by
      line and write down the reachable output set of its relation search and the preimages
      of its no-relation label. FREEZE the population - the exact archived surface list to
      be searched - and the disposition rule, before anything runs. If the reachable output
      set turns out to include the falsification region, STOP: the premise of this contract
      is refuted at zero cost and that is a complete result.
      STAGE 2 (seconds, FIDELITY GATE, read FIRST): reimplement the archived search verbatim
      against an abstract finite abelian group - no curves needed - and require it to
      reproduce the archived coefficient vectors and skip reasons on the archived
      relation-bearing configurations, entry for entry. A mismatch means a different
      instrument and voids every count.
      STAGE 3 (seconds): the planted RECOVERY LADDER on the reimplementation - planted
      relations of known infinity-norm and known support across a declared grid - producing
      the full recovery table with its monotonicity verdict. The table is HASH-COMMITTED
      before the archive arm is looked at, so the archive is read against a frozen
      sensitivity curve.
      STAGE 4 (seconds, NULL ARM): matched slot sets of the same size drawn from random
      abelian groups of comparable order with NO planted relation, at least 1000 draws per
      cell. Measure the unbounded search's spurious-hit rate and compare it against the
      expectation computed at STAGE 1 from the slot count, alphabet and group order.
      STAGE 5 (minutes, SIGNAL ARM): the unbounded relation search over the frozen archived
      population's slot lists, applied to the specialised fibre images - F_p point
      arithmetic only. EVERY candidate is passed through the census's own generic
      verification; a candidate holding at fibres but not generically is counted as spurious,
      never as a falsification.
      STAGE 6 (zero compute): report the count per surface with its witnessing relation, the
      spurious rate against its expectation, and the scoped disposition.
    instrument: >-
      Pure Python 3.11 with exact integer arithmetic; no SageMath, which is ABSENT from this
      container - the archived implementation therefore cannot be executed here, which is why
      STAGE 2's fidelity gate exists and why its failure is fatal rather than inconvenient.
      The search runs over specialised fibre images, needing only F_p point arithmetic. The
      generic verification is the census's own check, applied unchanged. Recorded through
      harness/runner.py.
    parameters: >-
      Population: exactly the archived p = 31 surfaces recorded as eligible-or-analysed and
      returning no relation, frozen at STAGE 1 from the committed run artifacts. Search
      bounds: UNBOUNDED in coefficient magnitude and support, subject only to a declared
      computational ceiling that is recorded and checked non-binding. Recovery ladder: a
      declared grid over infinity-norm and support spanning both sides of the archived
      instrument's declared bounds. Null draws: at least 1000 per (slot count, group order)
      cell. Qualifying threshold: support at or above 5, or infinity-norm at or above 4 -
      taken from the audited hypothesis's own falsification condition and not re-chosen here.
  controls:
    - >-
      FIDELITY GATE, read FIRST, fatal. The reimplementation, run with the archived bounds on
      the archived slot lists, must reproduce the archived coefficient vectors and skip
      reasons entry for entry on the archived relation-bearing configurations. Because the
      archived implementation cannot be executed in this container, this is the ONLY thing
      standing between "we measured the archived instrument" and "we measured something
      else", and a mismatch voids every count.
    - >-
      POSITIVE CONTROL, the effect MUST appear. Planted relations at support and
      infinity-norm strictly INSIDE the archived instrument's declared bounds must be
      returned with their exact values. If the instrument cannot reach its own declared
      ceiling, the diagnosis changes from "design ceiling" to "implementation defect" and no
      conclusion about the ceiling may be drawn.
    - >-
      GRADED CONTROL, at least three interior points, monotonicity reported. The full
      recovery table over infinity-norm at fixed support, and over support at fixed
      infinity-norm. The prediction is a STEP function with steps at the archived bounds. A
      SMOOTH decay instead of a step means the search is failing for a reason other than its
      declared bounds and the diagnosis must change before the archive is read.
    - >-
      NULL OBJECT, matched shape, forced value COMPUTED PRE-RUN, CAN FAIL. Matched slot sets
      from random abelian groups of comparable order with no planted relation. The expected
      spurious count is computed at STAGE 1 from the slot count, the coefficient alphabet and
      the group order, and at p = 31 it is NOT negligible - so this null has real content and
      may well fire. A measured rate departing from the computed expectation means the
      counting model is wrong and no signal-arm count is readable.
    - >-
      GENERIC-VERIFICATION CONTROL, blocking. Every candidate from the unbounded search must
      pass the census's own generic check, not merely specialisation at fibres. At p = 31 a
      fibre-only relation is often a coincidence; without this filter the search MANUFACTURES
      falsifications. The filter's false-acceptance rate is itself measured on the null arm.
    - >-
      ORDERING CONTROL. The recovery table and the null arm are computed and hash-committed
      BEFORE the archive arm is looked at, so the confound resolution is read against a frozen
      sensitivity curve rather than against one shaped by the answer.
    - >-
      POPULATION-FREEZE CONTROL. The searched surface set is fixed at STAGE 1 and verified
      unchanged at STAGE 6. A population enlarged or narrowed after the search began makes the
      count a property of the searcher rather than of the archive.
    - >-
      CENSORING-CEILING CONTROL. The unbounded search's own computational ceiling is recorded
      and checked non-binding on every surface. A binding ceiling reintroduces exactly the
      censoring the contract exists to remove, and a surface whose ceiling binds is reported as
      censored rather than as a zero.
    - >-
      ARCHIVE CHECK, zero compute. Enumerate any prior measurement of this observable in this
      repository and record its ABSENCE as an absence rather than as a passed check.
  independent_variables:
    - 'arm: archived-bounds reproduction / planted recovery ladder / matched null / unbounded archive search'
    - planted infinity-norm and planted support, on the recovery ladder
    - archived surface index within the frozen population
    - slot count and group order, in the null arm
  metrics:
    primary:
      - name: p31_unbounded_hit_count
        units: count of surfaces, with the witnessing relation per hit
        computed_as: >-
          number of surfaces in the frozen archived population on which the unbounded search
          returns a relation passing the census's own generic verification with support at or
          above 5 or infinity-norm at or above 4. Reported PER SURFACE with the witnessing
          relation, never as a bare aggregate.
      - name: reimplementation_fidelity
        units: boolean, plus the per-configuration comparison
        computed_as: >-
          exact reproduction of the archived coefficient vectors and skip reasons on the
          archived relation-bearing configurations. FIDELITY GATE, forced true.
      - name: recovery_table
        units: recovery fraction per (infinity-norm, support) cell
        computed_as: >-
          fraction of planted relations of each norm and support that the reimplemented
          archived search returns correctly, over the declared grid, with the monotonicity
          verdict. HASH-COMMITTED before the archive arm.
      - name: spurious_hit_rate
        units: hits per draw, against the computed expectation
        computed_as: >-
          unbounded-search hits on matched null slot sets divided by draws, per cell, reported
          as a RATIO to the STAGE 1 computed expectation rather than as a raw count.
      - name: generic_filter_false_acceptance
        units: count from the null arm
        computed_as: >-
          null-arm candidates accepted by the census's generic verification. Forced 0; a
          non-zero value means the filter cannot carry the enlarged candidate stream.
    secondary:
      - name: instrument_image_set
        units: the set of distinct non-null values the archived search can return
        computed_as: >-
          from an adversarial sweep designed to make the archived search return a value in the
          falsification region. Any such value refutes this contract's premise at zero cost
          and is the most useful possible early outcome.
      - name: censoring_ceiling_status
        units: per surface, binding or non-binding, with the ceiling value
        computed_as: >-
          the unbounded search's own computational ceiling against the largest norm and
          support actually explored on that surface.
      - name: population_freeze_check
        units: boolean plus the surface list hash
        computed_as: the searched set compared against the STAGE 1 frozen list.
      - name: per_surface_search_extent
        units: largest norm and support explored, per surface
        computed_as: recorded so a zero can be read as "searched this far and found nothing".
      - name: sage_absence_receipt
        units: verbatim command and output
        computed_as: >-
          the recorded fact that the archived implementation's runtime is unavailable here,
          which is an infrastructure finding in its own right (AGENTS.md rule 5).
  heuristic_under_test:
    id: HEUR-XEDN-f40aba-1
    formal_statement: >-
      The expected number of spurious relations among n randomly chosen elements of an abelian
      group of order M, under a coefficient alphabet of size a and support s, is approximately
      (n choose s) * a^s / M.
    validation_plan: >-
      SAMPLE: at least 1000 draws per (slot count, group order) cell in the null arm. COMPARISON:
      the measured spurious rate against the expectation computed at STAGE 1, reported as a RATIO
      rather than as a raw count. TAIL CHECK: the cells with the highest spurious rates, reported
      explicitly, since those are where a signal-arm hit would be least trustworthy. TRANSFER:
      none; the model is used only at the archived p = 31 slot counts and group orders.
    second_heuristic:
      id: HEUR-XEDN-f40aba-2
      formal_statement: >-
        The census's generic verification remains a reliable filter against fibre coincidences
        when applied to the far larger candidate stream an unbounded search produces.
      validation_plan: >-
        Measured directly as the filter's false-acceptance count on the null arm, where no genuine
        relation exists. Any non-zero acceptance makes every signal-arm hit inadmissible.
  preregistered_prediction:
    quantity: >-
      p31_unbounded_hit_count over the frozen archived population, and the recovery_table.
    formula: >-
      FOR THE RECOVERY TABLE, a forced step function derived from the archived source before any
      run: full recovery strictly inside the archived bounds, zero recovery strictly outside them,
      with the steps at the archived alphabet and support ceilings. Any cell disagreeing means the
      source was misread and the contract must be corrected. FOR THE HIT COUNT, NO VALUE IS
      PRE-REGISTERED - it is the quantity nobody has measured and inventing one would be a
      fabrication. The DISPOSITION is pre-registered instead: any count above 0 falsifies the
      audited hypothesis at p = 31 by its own stated condition; a count of 0 converts the archived
      density reading from an assumption into a measurement.
    source: >-
      Pre-registered in the parent proposal IDEA-20260805-4efae0 (predictions.recovery_rate and
      predictions.p31_confound_resolution, "No pre-registered value is asserted, because this is
      the quantity nobody has measured and inventing a number for it would be a fabrication")
      before any run under this contract exists. Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      One prime, one lane, one instrument lineage, at a prime small enough that the specialised
      fibres are tiny. THAT SMALLNESS IS THE DOMINANT CONFOUNDER, not a convenience: it is why the
      spurious-hit expectation is non-negligible and why the generic-verification filter is
      blocking rather than optional. The design does not claim the result transfers to any other
      prime, and the successor if the null fires is the SAME audit at a larger prime.
    correspondence: null
    transfer_assumption: >-
      None offered. Nothing here transfers to any other goal's instruments without the same
      reading being performed on them - though that reading is cheap, and a program-wide census of
      controls that cannot fail is an obvious successor rather than an implication of this run.
  tail_checks:
    - >-
      Report the count PER SURFACE with the witnessing relation and its norm and support, never as
      a bare aggregate; one witness is the whole result and an aggregate would bury it.
    - >-
      Report the largest norm and support actually explored per surface, so a zero reads as
      "searched this far and found nothing" rather than as an unqualified absence.
    - >-
      Report the null arm's highest-spurious-rate cells explicitly; a signal-arm hit in a
      comparable cell is not trustworthy and must be flagged as such.
    - >-
      Report the recovery table's full grid with its monotonicity verdict. A smooth decay where a
      step was predicted changes the diagnosis and must be visible.
    - >-
      Report every surface whose search ceiling bound, separately from the zeros. A binding
      ceiling is exactly the censoring this contract exists to remove.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 1000
    repeat_count: 3
    note: >-
      The archive arm is DETERMINISTIC - the archived slot lists are fixed and an unbounded search
      over them returns the same result every time - so seeds govern only the null arm's draws and
      the recovery ladder's plantings. "independent_instances: 1000" is the null-arm draw count per
      cell, which is where the statistical content lives; the archive arm's replication is the
      surface count, which is whatever the archive contains and is not a design choice.
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 0.5
    memory_gb: 4
    maximum_memory_gb: 4
    maximum_runs: 10
  stopping_rules:
    - >-
      STOP AT STAGE 1 if the archived search's reachable output set is found to include the
      falsification region. This contract's premise is refuted at zero cost, which is a complete
      and useful result.
    - >-
      Stop and void every count if the fidelity gate fails or the positive control does not fire.
    - >-
      Stop the unbounded search on a surface at the declared computational ceiling and record that
      surface as CENSORED, never as a zero.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop,
      never a negative result (AGENTS.md rule 5).
    - >-
      The population, the qualifying threshold, the recovery grid and the spurious expectation are
      frozen before STAGE 5 and are not revised after any hit is observed.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
      and is NEVER negative mathematical evidence (AGENTS.md rule 5). The absence of the archived
      implementation's runtime is itself such a fact and is recorded, not worked around.
    - >-
      A run whose reimplementation does not reproduce the archived instrument on the archived data
      is completed_invalid: it measured a different instrument.
    - >-
      A run whose null arm or recovery table was not computed and hash-committed BEFORE the archive
      arm is invalid_measurement - the frozen sensitivity curve is the point.
    - >-
      A run counting a candidate that passed only fibre specialisation, without the census's generic
      check, is completed_invalid: it manufactured a falsification.
    - >-
      A run whose searched population differs from the STAGE 1 frozen list is completed_invalid.
    - >-
      A run reporting a censored surface as a zero is invalid_measurement.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
      a new contract; it is never a repair of this one.
  success_criterion: >-
    The fidelity gate reproduces the archive exactly, the positive control fires, the recovery table
    shows the predicted step structure and is hash-committed before the archive arm, the null arm's
    spurious rate agrees with its computed expectation, the generic filter accepts nothing from the
    null arm, no surface's search ceiling binds, and the run reports p31_unbounded_hit_count per
    surface with witnessing relations and per-surface search extents. The hypothesis H-XEDN-f40aba is
    SUPPORTED if and only if that count is 0 with all controls behaving.
  falsification_criterion:
    - >-
      p31_unbounded_hit_count is above 0 with all controls behaving and every hit passing the generic
      verification. The hypothesis is FALSIFIED, the archived cell is a censored blow-up rather than a
      density obstruction, and the audited hypothesis is falsified at p = 31 by its own stated
      condition. The witnessing relation is archived as a COUNTEREXAMPLE CERTIFICATE before any
      decision that rests on it.
    - >-
      The archived search returns a value in the falsification region during the adversarial sweep.
      This contract's premise is wrong and is withdrawn at zero cost.
    - >-
      The fidelity gate fails, or the positive control does not fire. Nothing is reportable; the
      diagnosis is an implementation defect rather than a design ceiling.
    - >-
      The measured spurious rate departs materially from its computed expectation, or the generic
      filter accepts null-arm candidates. The search's false-positive behaviour is unknown and no
      count may be read as a falsification.
    - >-
      The recovery table shows a smooth decay where a step was predicted. The search is failing for a
      reason other than its declared bounds and the diagnosis must change before the archive is read.
    - >-
      Any surface's search ceiling binds. The censoring the contract exists to remove is still
      present on that surface and its result is censored, not zero.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference
      block and environment
    - the image set stated as a set, with the archived source lines that determine it
    - the fidelity-gate comparison, per archived configuration
    - the full recovery table by (infinity-norm, support) with seeds, hash-committed before the archive arm
    - the null arm's spurious rate against its computed expectation, and the filter's false-acceptance count
    - >-
      raw-result.json carrying the per-surface archive-arm outcome, the witnessing relation for every
      hit, the per-surface search extent and the censoring status - and not summaries
    - the STAGE 1 frozen population list with its hash, and the STAGE 6 freeze verification
    - a verbatim receipt that the archived implementation's runtime is unavailable in this container
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not approve. This contract is review_required and is NOT approved;
      approved_by is null and execution_authorized is false. Approval is the user's gate because it
      authorizes execution and spends compute.
    - >-
      The FIDELITY GATE is a hard precondition. Because the archived implementation cannot run in
      this container, it is the only thing distinguishing a measurement of the archived instrument
      from a measurement of something else.
    - >-
      The ORDERING CONTROL is a hard precondition: the recovery table and the null arm must be
      hash-committed before the archive arm is read, or the confound resolution is read against a
      sensitivity curve shaped by its own answer.
    - >-
      The paired hypothesis is proof-oriented and carries a filled proof_search_map (KN-TECH-080);
      its observation-collision audit names a FOURTH preimage - a fibre-only coincidence - and the
      generic-verification control is that separation. It is blocking, not optional.
    - >-
      No status change to any audited record may accompany this contract's approval. A disagreement
      with a committed record travels as a superseding record under a new id and only by the
      Coordinator.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260805-4efae0
    authored_at: '2026-08-25'
    note: >-
      Stages, controls, the recovery ladder, the spurious-count formula and the refusal to
      pre-register a hit count are taken from the parent proposal's minimal_test, controls,
      predictions and confounders. This contract narrows the parent's three-arm design to the arm
      the parent itself says nobody has measured, because the image-set argument is already carried
      by a committed sibling hypothesis and re-running it here would measure the same object twice;
      the adversarial image sweep is retained as a SECONDARY metric precisely because it can refute
      this contract's premise at zero cost. The qualifying threshold is the audited hypothesis's own
      falsification condition and is not re-chosen. Budgets come from the parent's declared
      estimated_cost (implementation low, compute very low).
  derivation_gaps:
    - >-
      Whether the census's generic verification can be applied to a candidate found by an unbounded
      search, using only the archived slot data, is NOT established here. It is load-bearing: without
      it the search manufactures falsifications at p = 31. It must be settled before approval, and if
      it cannot be, the honest outcome is that the confound is unresolvable from the archive alone.
    - >-
      The declared computational ceiling for the unbounded search is not fixed. It must be set so
      that it is non-binding on every surface, and a ceiling chosen for convenience would reintroduce
      exactly the censoring the contract exists to remove.
    - >-
      Whether a differing committed variant of the archived implementation exists is unchecked. If
      the archived source is not the code that produced the archived results, the whole audit is
      aimed at the wrong artifact and must be redone; the fidelity gate catches this only if the
      variant differs observably on the archived configurations.
    - >-
      The recovery grid's exact extent is not fixed. It must span both sides of the archived bounds
      by enough points to make the predicted step visible, and it is chosen before, never after.
