experiment:
  id: EXP-SHATHREE-0f0eab
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-8640ad; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-8640ad
  question_id: RQ-SHATHREE-cd2cb2
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Sweep the divisor lattice of Z/64 as an internal-differential parameter: exact kernel dimensions,
    injected-asymmetry tables and a Pareto dominance verdict for t = 1..32 against randomised-constant
    and randomised-support nulls'
  objective: The uncertainty a run reduces is whether the translation amount used by internal-differential
    analysis of Keccak-f[1600] is singled out by a computable property of the permutation and its
    constants, or only by the sponge mode's rate/capacity split, or by neither. (i) It establishes
    by rank computation rather than by formula that the fixed subspaces S_t have dimension 25*gcd(t,64)
    and form a chain under inclusion, converting the parameterisation of the family from an assumption
    of this repository into a checked fact with a recorded failure mode. (ii) It produces the complete
    24-by-7 integer table of injected asymmetry weights w_i(t) = wt(RC_i XOR tau_t RC_i), a forced
    value of FIPS 202 obtainable with 168 popcounts and no search, and answers whether t = 32 is anomalous
    or typical among the divisors on that axis -- which is the single sharpest cheap question in this
    bucket. (iii) It computes controllable symmetric dimension per t per digest size and emits a Pareto
    dominance verdict at r = 4, 6, 8, then reads all of it against 1000 matched-support and 1000 randomised-support
    null schedules run in the same invocation, so that any ordering claimed for the standard's constants
    is read against the ordering a random schedule of the same shape produces.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: ''for Keccak-f[1600] and the FIPS
      202 constant schedule, the fixed subspaces of z-translation have the following exact dimensions
      and inclusion structure; the injected asymmetry weights take the following exact values across
      all seven divisors; and at r = 4, 6, 8 the divisor t = 32 is (or is not) Pareto-dominant on
      the declared structural axes, with the null arms placing that verdict at the following quantile.''
      What does NOT follow: any claim that some t supports a better or worse attack, any claim about
      why any published work chose any t, any statement about full-round SHA-3, and any inference
      that a non-dominant t is exploitable.'
  inputs:
    procedure: 'STAGE 0 (cost: reuses the validated Keccak transcription; minutes). Import the FIPS
      202 implementation validated against hashlib by the companion contract, or revalidate it if
      run standalone. STAGE 1 (cost: ~10 min CPU). Construct tau_t as a 1600x1600 GF(2) permutation
      matrix for t in {1,2,4,8,16,32,64}; compute rank(I XOR tau_t) and the kernel dimension; compare
      against 25*gcd(t,64) and record any disagreement as a falsification. STAGE 2 (cost: ~5 min CPU).
      Extract a kernel basis for each S_t and test inclusion in S_{2t} by membership of every basis
      vector; record the chain. STAGE 3 (cost: seconds). Compute the 24x7 table w_i(t) by popcount
      on 64-bit lane integers; record per-t totals and per-round detail. STAGE 4 (cost: ~10 min CPU).
      For each digest size (rates 1152, 1088, 832, 576 bits, i.e. 18, 17, 13, 9 lanes) intersect S_t
      with the rate subspace and record dim(S_t intersect rate) as a 7x4 table. STAGE 5 (cost: ~20
      min CPU). Iterate the deviation recursion for each t through r = 8 under the declared identity
      and expansion chi treatments; record active-row counts at r = 4, 6, 8. STAGE 6 (cost: ~90 min
      CPU). Repeat stages 3-5 for 1000 matched-support and 1000 randomised-support null schedules
      in the same process; emit the ordering distributions and the Pareto verdict with its null quantile.'
    instrument: Python 3.11; the validated pure-Python Keccak-f[1600] from the companion contract;
      numpy bit-packed GF(2) linear algebra with a hand-written rank routine; hashlib for revalidation;
      itertools for the divisor enumeration. No Sage. Manifests and seeds through harness/runner.py.
    parameters: 'Divisors t in {1,2,4,8,16,32,64}. State 1600 bits. Rounds r in 1..8, verdicts read
      at r = 4, 6, 8. Digest sizes SHA3-224/256/384/512 with rates 1152/1088/832/576 bits and capacities
      448/512/768/1024 bits. Null arms: 1000 matched-support schedules and 1000 randomised-support
      schedules, PCG64 seeds 1..2000 declared in advance. Two chi treatments (identity, expansion).'
  controls:
  - 'Random-constant null: 1000 schedules with matched support shape, same code path.'
  - 'Random-support null: 1000 schedules with the support set itself randomised to 7 distinct z-positions.'
  - 't = 64 identity control: must yield zero injected weight and dim S_64 = 1600 for every arm.'
  - 'Rank-versus-formula control: kernel dimensions are computed by rank, not by the 25*gcd formula,
    and the two are compared.'
  - 'Cross-arm sanity: the seven arms are read from one round-function evaluation, and a separate
    per-t independent evaluation must reproduce them bit-identically.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Identical sweep over the divisor lattice with the 24 FIPS constants
    replaced by 1000 random schedules of matched support shape (executed in the same invocation, same
    code path, constants array swapped), and separately with the RC support set itself randomised
    to 7 uniformly chosen z-positions. For the sweep to mean anything, the ORDERING of the seven t
    on at least one axis must differ between the FIPS arm and the median of the null arms. If the
    ordering is identical, the ordering is a property of the shift structure of any 7-element support
    set and carries no information about the standard''s constants -- recorded as a controlled null.'
  independent_variables:
  - translation divisor t
  - round index r
  - digest size / rate
  - constant-schedule arm in {FIPS, matched-support null, randomised-support null}
  metrics:
    primary:
    - kernel dimension of I XOR tau_t by rank
    - inclusion verdict per consecutive divisor pair
    - w_i(t) 24x7 integer table
    - dim(S_t intersect rate) 7x4 table
    - Pareto dominance verdict for t = 32 at r = 4, 6, 8
    secondary:
    - per-t cumulative injected weight through r
    - null-arm ordering distribution over the seven divisors
    - wall clock per stage
    - rank-versus-formula discrepancy count
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The kernel dimensions dim S_t for the seven divisors, and the total injected weight
      W(t) = sum over i = 0..23 of w_i(t).
    formula: dim S_t = 25 * gcd(t, 64), forced, giving 25, 50, 100, 200, 400, 800, 1600 for t = 1,
      2, 4, 8, 16, 32, 64. For the weight, w_i(t) = wt(RC_i XOR tau_t RC_i) counts positions z with
      RC_i[z] != RC_i[z-t mod 64]; since supp(RC_i) is contained in {0,1,3,7,15,31,63}, w_i(t) is
      bounded above by 2*|supp(RC_i)| and equals that bound exactly when no two support elements differ
      by t mod 64. For t = 32 the unique colliding pair is (31,63), so w_i(32) = 2*|supp(RC_i)| -
      2*[RC_i[31] = RC_i[63] = 1] - ... is predicted to follow the exact indicator form recorded in
      the companion contract. No prediction is pre-committed for the ordering of W(t) across t; that
      is the measured unknown.
    source: Pre-registered in the parent proposal IDEA-20260816-8640ad before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Full-width Keccak-f[1600] state, full FIPS 202 constant schedule, all seven divisors,
      all four standardised digest sizes -- no parameter is reduced. Labelled toy because the axes
      are structural and the round range 1-8 is chosen for dynamic range. Transfer assumption: none.
      Nothing is extrapolated beyond the divisors and rounds computed.'
    correspondence: null
  tail_checks:
  - t = 64 must give zero injected weight and full-space kernel; a nonzero result voids the run.
  - w_i(t) must never exceed 2*|supp(RC_i)| for any i, t.
  - Sum of dim S_t over the divisor chain must match the closed form as an arithmetic cross-check.
  - The 7x4 rate-intersection table must have dim(S_t intersect rate) <= min(25t, rate bits) in every
    cell.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort if stage 1 kernel dimensions disagree with the closed form -- the parameterisation, not
    the compute, is at fault.
  - Fixed 2000 null draws, no adaptive extension.
  - Total wall-clock ceiling of 3 hours; a timeout is a budget outcome and never negative mathematical
    evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run is successful if the kernel dimensions, inclusion chain, w_i(t) table,
    rate-intersection table and Pareto verdict are emitted for every declared cell with all tail checks
    passing -- whether or not t = 32 turns out special.
  falsification_criterion:
  - Any kernel dimension disagrees with 25*gcd(t,64).
  - The inclusion chain fails at any link.
  - w_i(t) exceeds its forced upper bound anywhere.
  - t = 64 yields nonzero injected weight.
  - The FIPS ordering coincides with the null median ordering on every axis at every r -- controlled
    null, recorded as such.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-8640ad
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The normalisation used to compare arms of different symmetric dimension is not fixed by this proposal
    and a Coordinator must approve one before the run, since the dominance verdict depends on it.
  - Whether cumulative injected weight or peak per-round weight is the right cost axis is undetermined
    and both are reported.
  - The rate-intersection stage presumes the absorption layout of FIPS 202 lane ordering; that layout
    must be pinned in the contract text before approval.
