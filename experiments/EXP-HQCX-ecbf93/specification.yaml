experiment:
  id: EXP-HQCX-ecbf93
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-208783; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-208783
  question_id: RQ-HQC-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Sampler ablation on the committed HQC joint-moment measurement: fixed-weight versus Bernoulli
    inputs at matched marginal, frozen estimator and frozen intervals, with a per-input partial-ablation
    ladder'
  objective: 'The one uncertainty a run reduces: what fraction of the committed joint-moment deficit
    of EV-HQC-b71230 is owed to HQC''s fixed-weight input sampling rather than to its code or decoder.
    A run establishes (i) log2 A-hat_k for k = 2..18 under an i.i.d. Bernoulli(w/n) sampler at matched
    coordinate marginal, using the same estimator and the same frozen intervals, so the arm difference
    is directly comparable to committed numbers; (ii) whether the operating point q is preserved by
    the ablation, which is a fail-closed gate on the comparison rather than a result; and (iii) which
    of the five inputs carries the effect, by Bernoulli-ising them one at a time. The run also separates
    the shell constraint from total-weight variance with a fixed-total-weight Bernoulli second null.
    The deliverable in every branch is an attribution fraction with confidence intervals - including
    the branch where the fraction is near zero, which exonerates the sampler and redirects the mechanism
    search. No attack, break, speedup or security consequence is claimed here or would follow from
    a run. No statement is made about what the published literature does or does not contain; this
    environment cannot reach external literature. No direction is declared impossible.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: at the executed reduced parameter
      set, with the executed estimator and trial counts, the fixed-weight sampler accounts for a stated
      fraction, with stated confidence intervals, of the measured deficit in log2 A-hat_k at each
      k, and the effect localises to stated inputs. WHAT DOES NOT FOLLOW: nothing about HQC''s deployed
      parameter sets; nothing about whether assumption A17 holds there; nothing about the specification''s
      DFR value; no security consequence in either direction, and specifically not a decryption-failure
      attack, since anti-correlation makes the binomial tail conservative; and nothing about whether
      the residual, if any, is a property of the code.'
  inputs:
    procedure: 'STAGE 0 (zero compute): derive and record the exact fixed-weight covariance -w(n-w)/(n^2(n-1))
      and the Bernoulli arm''s zero, and the resulting q-invariance prediction. STAGE 1 (minutes):
      open the harness, place the sampler behind an interface without touching the downstream path,
      and run the discard-prefix bit-identity check against committed per-trial S arrays; abort if
      it fails. STAGE 2 (minutes to an hour, T = 1e6): both arms, k = 2 only, with the q gate. STAGE
      3 (hours, T = 1e7 to match the committed run): both arms, k = 2..18, frozen intervals reused
      verbatim; report attribution fractions. STAGE 4 (hours): five per-input partial ablations at
      k = 2 and k = 17, plus the fixed-total-weight Bernoulli second null. STAGE 5 (zero compute):
      compose the additivity check and write the run record with every gate state.'
    instrument: Python 3.11 with numpy; NO Sage. The existing GOAL-HQC-001 measurement path is reused
      unchanged downstream of the sampler; the only new code is two samplers - a fixed-weight shell
      sampler reproducing the committed one bit-identically, and an i.i.d. Bernoulli sampler - plus
      a third fixed-total-weight Bernoulli variant. Estimator, frozen intervals, INV-NULL check and
      the discard-prefix comparability harness are taken from the committed artefacts of EXP-HQC-982268
      rather than reimplemented. Runs recorded through harness/runner.py so the resolved inference
      block and seed ladder land in the manifest.
    parameters: 'The reduced parameter set already used by the committed runs (PS-R3 as referenced
      by EV-HQC-b71230), unchanged, so the arms are comparable to committed numbers. k = 2..18, the
      same 17 pre-specified cells and the same frozen intervals. T = 1e6 for STAGE 2, T = 1e7 for
      STAGE 3 to match the committed trial count. Five per-input partial ablations. Three sampler
      variants: fixed-weight shell, free Bernoulli(w/n), fixed-total-weight Bernoulli. Seed ladder
      frozen in the specification; the fixed-weight arm''s first 10^4 trials are the discard prefix
      used for the bit-identity gate.'
  controls:
  - Bernoulli(w/n) null arm in the same invocation, same seed ladder, same estimator, same frozen
    intervals.
  - q-agreement gate between arms; failure voids the comparison as a changed operating point.
  - Discard-prefix bit-identity check reproducing committed per-trial S arrays in the fixed-weight
    arm.
  - INV-NULL estimator bit-identity re-run under the Bernoulli arm.
  - 'Per-input partial ablation (one input Bernoulli-ised at a time) as an internal consistency check:
    the single-input effects should compose roughly additively at k = 2 if the mechanism is second-order.'
  - A fixed-total-weight Bernoulli variant (conditioned on the realised weight) as a second null separating
    shell-constraint from weight-variance effects.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is the Bernoulli(w/n) arm: the same n, the same expected
    weights, the same ring, truncation, decoder, tie rule, estimator and frozen intervals, with i.i.d.
    coordinates and therefore EXACTLY zero sampler covariance by construction. It runs in the same
    invocation off the same seed ladder. FOR THE SIGNAL ARM TO MEAN ANYTHING THE NULL MUST SHOW: (i)
    q = E[S]/n_e agreeing between arms within Monte-Carlo error, since the coordinate marginal is
    w/n in both - a q difference means the ablation changed the operating point and the comparison
    is void; (ii) the estimator''s own bias behaviour unchanged, verified by re-running the committed
    INV-NULL bit-identity check; and (iii) if the mechanism claim is right, log2 A-hat_k in the Bernoulli
    arm lying inside the frozen independence intervals at most orders. A Bernoulli arm that still
    shows a large deficit is not a failure of the experiment - it is the exoneration outcome and it
    redirects the mechanism search.'
  independent_variables:
  - 'sampler variant: fixed-weight shell / free Bernoulli / fixed-total-weight Bernoulli'
  - which of the five inputs is ablated (partial-ablation ladder)
  - joint-moment order k
  metrics:
    primary:
    - log2 A-hat_k for k = 2..18 per arm
    - attribution fraction per k
    - q per arm and the arm difference
    - count of cells inside the frozen interval per arm
    secondary:
    - per-input partial-ablation deficits at k = 2 and k = 17
    - additivity residual of the partial ablations
    - discard-prefix and INV-NULL bit-identity pass counts
    - wall-clock seconds per arm
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The attribution fraction f_k := 1 - |log2 A-hat_k(Bernoulli)| / |log2 A-hat_k(fixed-weight)|
      at k = 2 and k = 17.
    formula: 'Predicted f_2 >= 0.5 and f_17 >= 0.5, i.e. the free-Bernoulli arm''s deficit is at most
      half the fixed-weight arm''s at both orders. Definitions verbatim from H-HQC-18d1b4: mubar_k
      = E[C(S,k)]/C(n_e,k), q = E[S]/n_e, A_k = mubar_k/q^k. The underlying sampler quantity is Cov(1_i,
      1_j) = -w(n-w)/(n^2(n-1)) for the shell and 0 for Bernoulli, exactly. Under the exoneration
      branch f_k is consistent with 0 at every k.'
    source: Pre-registered in the parent proposal IDEA-20260816-208783 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Executed at the same reduced parameter set as the committed runs, chosen precisely
      so the numbers are comparable to EV-HQC-b71230 rather than to a fresh baseline. That set is
      orders of magnitude below deployed HQC. NO transfer to deployed parameters is claimed or attempted:
      the attribution fraction is a property of the executed set. The only quantity that is exact
      at every scale is the sampler covariance formula of STAGE 0, which is a statement about the
      sampler and not about HQC''s security.'
    correspondence: null
  tail_checks:
  - Report large-k cells with the number of trials contributing a non-zero C(S,k) term, and refuse
    any cell whose contributing-trial count is below 30.
  - Check that the arm difference at k = 2 is stable when the trial count is increased tenfold on
    a single arm pair.
  - Verify the q gate separately within each decile of the S distribution, not only in aggregate.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort if the discard-prefix bit-identity check against committed per-trial S arrays fails.
  - Abort the comparison at any cell where the q gate fails.
  - Stop at the declared cell list; the estimator, intervals and cells are frozen before any data
    is generated.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both bit-identity gates pass, the q gate passes, and the run emits f_k with confidence
    intervals for all 17 pre-specified cells plus the five per-input partial-ablation values - whatever
    their magnitudes.
  falsification_criterion:
  - 'f_k is consistent with zero at every k: the sampler is exonerated and the bound on its contribution
    is the recorded obstruction.'
  - 'The q gate fails: the ablation is mis-specified and no attribution is reportable.'
  - 'The discard-prefix check fails: the harness does not reproduce committed data and nothing may
    be compared to it.'
  - 'The fixed-total-weight Bernoulli null behaves like the shell arm: the effect is total-weight
    variance rather than the shell constraint, and the attribution is reassigned to that.'
  - 'Partial ablations fail to compose even approximately: the second-order propagation account is
    wrong and is withdrawn even if f_k is large.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-208783
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Whether the frozen intervals calibrated for the fixed-weight arm remain valid calibration for
    the Bernoulli arm needs a written argument or a re-derivation; a Coordinator must settle this
    before approval because reusing them is what makes the comparison cheap.
  - The exact matching rule for the fixed-total-weight Bernoulli variant - conditioning on the realised
    weight versus resampling until the weight matches - must be fixed in advance, since the two are
    not the same law.
  - The harness's sampler separability is asserted and unverified; the Coordinator should require
    STAGE 1 to report separability explicitly as a gate before authorising STAGE 3's larger spend.
