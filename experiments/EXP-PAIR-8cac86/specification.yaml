experiment:
  id: EXP-PAIR-8cac86
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-30868b
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: A NON-TRIVIAL SELF-PAIRING ON THE CRYPTOGRAPHIC SUBGROUP FORCES EMBEDDING DEGREE ONE - two
    independent arguments (the Castryck-Houben-Merz constraint m | Delta_O combined with the elementary
    congruence Delta = (t-2)^2 - 4.#E, and Galois equivariance of the Tate pairing) both prove that
    a self-pairing non-trivial on G of prime order N exists if and only if p = 1 mod N, in which case
    the map IS the classical Frey-Ruck pairing landing in F_p; so the "computable from one point"
    route and the classical transfer coincide exactly on their common domain and the lane has no third
    option
  status: draft
  objective: "(A) THE SHARP QUESTION. RQ-PAIR-21313f asks whether a CM-specific self-pairing exists\
    \ that is computable from ONE point. A pairing on G x G with values in mu_N would solve ECDLP\
    \ by s(P, Q) = s(P, P)^k followed by one DLP in mu_N inside F_{p^k}. The Weil pairing is alternating\
    \ so e(P,P) = 1 always; IDEA-20260807-464ff8 closes the endomorphism/distortion route. What remains\
    \ is the Tate pairing and the generalised self-pairings of KN-LIT-7489. This record closes both,\
    \ by two arguments that must agree and whose agreement is the internal check.\n(B) ARGUMENT ONE\
    \ - THE DISCRIMINANT ROUTE, AND ITS ONE-LINE CONSEQUENCE. KN-LIT-7489 (Castryck, Houben, Merz)\
    \ states that a non-trivial self-pairing with cyclic domain, compatible with isogenies between\
    \ O-oriented elliptic curves, has order m dividing Delta_O, the discriminant of the orienting\
    \ order. Suppose such a pairing is non-trivial on G, so m = N. Then N | Delta_O, and since Delta_O\
    \ divides D = t^2 - 4p = disc(Z[pi]) (because Z[pi] is contained in O, so the conductor of O divides\
    \ that of Z[pi]), we get N | t^2 - 4p. Now the elementary identity, which is the whole content\
    \ -\n    t^2 - 4p = (t-2)^2 - 4(p + 1 - t) = (t-2)^2 - 4.#E(F_p).\nSince N | #E(F_p), reduce mod\
    \ N - N | (t-2)^2, and N prime gives N | (t-2), i.e. t = 2 mod N. Substituting into #E = p + 1\
    \ - t = 0 mod N gives p = t - 1 = 1 mod N. THAT IS EMBEDDING DEGREE 1. The converse is the same\
    \ computation read backwards. So, for N | #E(F_p) prime -\n    N | disc(End(E))   <==>   t = 2\
    \ mod N   <==>   p = 1 mod N   <==>  k = 1.\nCorollary, stated because it is the useful form -\
    \ if N > 2 sqrt(p) + 2 then N | (t-2) with |t-2| <= 2 sqrt(p) + 2 forces t = 2 exactly, i.e. #E(F_p)\
    \ = p - 1. So among near-prime-order curves the ONLY isogeny class in which a CHM self-pairing\
    \ can reach G is the trace-two class.\n(C) ARGUMENT TWO - THE GALOIS ROUTE, INDEPENDENT OF (B).\
    \ The Tate- Lichtenbaum pairing is Galois equivariant, t(pi(P), pi(Q)) = t(P,Q)^p. Take P, Q in\
    \ G, which is contained in ker(pi - 1), so pi fixes both - hence t(P,Q) = t(P,Q)^p, so t(P,Q)^{p-1}\
    \ = 1, so t(P,Q) lies in mu_N intersect F_p. If k > 1 then N does not divide p - 1, so that intersection\
    \ is trivial and t(P,Q) = 1 for ALL P, Q in G - the Tate pairing restricted to G x G is identically\
    \ trivial, self-pairings included. If k = 1 then mu_N is contained in F_p, the Frey-Ruck non-degeneracy\
    \ hypothesis holds over the base field itself, and for N || #E both E(F_p)[N] and E(F_p)/N.E(F_p)\
    \ are cyclic of order N generated by (the class of) P; non-degeneracy then forces t(P,P) to be\
    \ a PRIMITIVE N-th root of unity. So at k = 1 a non-trivial self-pairing computable from one point\
    \ does exist - and it is exactly the Frey-Ruck pairing, whose target is F_p, whose use is the\
    \ classical transfer, and whose cost is a field DLP in F_p at L_p(1/3).\n(D) THE CONCLUSION, WHICH\
    \ IS THE LANE'S ANSWER. The two arguments have different hypotheses and the same boundary - k\
    \ = 1. There is no CM-specific self-pairing that is non-classical - the only self-pairing usable\
    \ on G is the k = 1 Frey-Ruck pairing, and k = 1 is precisely the case in which the classical\
    \ MOV/Frey-Ruck transfer is already maximally effective. The lane's novel branch is therefore\
    \ EMPTY, not merely unexplored, and it is empty for a reason that can be checked in two modular\
    \ exponentiations per curve. What remains open and is NOT closed by this record - self-pairings\
    \ that are neither of Weil/Tate type nor compatible with oriented isogenies; pairings into groups\
    \ other than mu_N; and bilinear maps that are not pairings of divisors at all. Those are named\
    \ in the forward guidance, not dismissed."
  resource_label: R7 (pairings into F_{p^k}) composed with R3 (End(E) as a ring - the discriminant
    Delta_O is a ring invariant invisible to G).
  admissibility: admissible
  admissibility_argument: The resource genuinely escapes the generic group model - the discriminant
    of End(E) is not a group-operation output, and a pairing value is an element of a different group
    entirely, so neither is covered by KN-FIND-b7e091's simulability results. The proposal is therefore
    admissible on its face and does not fall foul of the H-ENDO-001 filter - it never applies phi
    to a point of G. Its outcome is nonetheless a closure - the admissible resource exists, is computable,
    and is provably trivial on G except in the k = 1 case. That is the strongest kind of negative
    this campaign can produce - one where the resource was admitted and then shown empty, rather than
    excluded by the filter.
  reachability_gate: 'ANSWERED IN THE STRONGEST FORM AND THE ANSWER IS NEGATIVE. The property "supports
    a non-trivial self-pairing on G" is equivalent to p = 1 mod N by (B)/(C), and both p and N are
    F_p-isogeny-class invariants (the trace is fixed on a class, so #E is fixed, so its prime divisors
    are fixed). The property is therefore CONSTANT on the isogeny class, so T5''s dichotomy does not
    arise - goodness is neither common enough to hit nor locally detectable, it is simply not variable.
    There is no curve to walk to, at any cost. This is the same structural fact IDEA-20260807-b92080
    develops for the embedding degree, and the two records share it deliberately.'
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE, blocking): verify the CHM statement in the primary
      text and transcribe it. STAGE 1 (zero compute): write (B) and (C). STAGE 2 (minutes, uses IDEA-20260807-e7eb5d''s
      instrument): the three-way agreement sweep over ~500 toy curves at p in [2^12, 2^20], selected
      to include curves with small k by construction so that F_{p^k} arithmetic is feasible. STAGE
      3 (HARD GATE): the k = 1 planted positive and the coprime-to-Delta_O forced null. STAGE 4 (hours):
      the trace-two family, including one certified end-to-end solve at toy scale to show the k =
      1 route is the classical transfer and to charge its field-DLP cost.'
    mechanism: 'STEP 1 - STAGE 0, BLOCKING. Obtain the primary text of Castryck-Houben-Merz and verify
      the constraint m | Delta_O verbatim, including the 2-adic refinements (2m | Delta_O when 4 |
      Delta_O, 4m | Delta_O when 8 | Delta_O) and, critically, the exact hypotheses on the orientation
      and on the cyclicity of the domain. KN-OPEN-3f7a21 records that this corpus''s citation_verified
      markings are unreliable, and H-SPR-71a843 already carries the same Stage-0 obligation. Without
      this, (B) is void. Write the result to knowledge/literature as a verified transcription. STEP
      2 - THE DERIVATION (zero compute). Write (B) and (C) with quantifiers explicit. Both are short.
      (B) needs only that Delta_O divides t^2 - 4p and the identity t^2 - 4p = (t-2)^2 - 4.#E. (C)
      needs only Galois equivariance of the Tate pairing and Frey-Ruck non-degeneracy. STEP 3 - THE
      NUMERICAL AGREEMENT TEST (low compute). For toy curves, compute independently (i) whether N
      | disc(End(E)), (ii) k = ord_N(p), and (iii) the reduced Tate self-pairing t(P,P) via the instrument
      of IDEA-20260807-e7eb5d. The three must agree on every curve - (i) true iff (ii) equals 1 iff
      (iii) is non-trivial. A disagreement on any curve falsifies one of the two arguments or the
      instrument, and the record commits in advance to reporting which. STEP 4 - THE TRACE-TWO FAMILY
      (low compute). Construct the corollary''s family directly - curves with #E(F_p) = p - 1 - and
      confirm that they are exactly where the self-pairing is non-trivial, and that solving ECDLP
      on them via t(P,P) is precisely a DLP in F_p, i.e. the classical transfer, with the field-DLP
      cost charged in full per IDEA-20260807-5f24d7.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - k = 1 planted positive (trace-two curve) - must give a primitive N-th root of unity
  - k > 1 forced null - must give exactly 1
  - subgroup of order coprime to Delta_O - must give exactly 1 by (B) alone
  - broken-instrument control - final exponentiation omitted; the positive control must then return
    a value outside mu_N and be rejected
  - fixed-(p,N) CM sweep - curves in one isogeny class with different End levels must all give the
    same answer
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, in both directions. FORCED NULL - any
    toy curve with k > 1 must give t(P,P) = 1 exactly, on 100 percent of points tested. This is derivable
    before measurement from (C), which is what makes the instrument able to fail. PLANTED POSITIVE
    - a toy curve with #E(F_p) = p - 1 (trace two, k = 1) must give t(P,P) of exact multiplicative
    order N. An instrument that cannot produce the positive cannot certify the negative. DECAY PARAMETER
    - the embedding degree k. The predicted shape is a STEP at k = 1, not a decay - the fraction of
    points with non-trivial self-pairing is 1 at k = 1 and 0 at every k >= 2. A GRADUAL decline in
    that fraction as k grows is the canonical artifact tell and, per docs/inventor-protocol.md, means
    the measurement is an instrument property. The most likely cause, named in advance, is an omitted
    or incorrect final exponentiation by (p^k - 1)/N. MATCHED NULL OBJECT OF THE SAME SHAPE - a random
    cyclic subgroup of E[N''] with N'' coprime to Delta_O. By (B) the pairing there must be exactly
    trivial with no exceptions; this is the same control H-SPR-71a843 uses in the supersingular setting
    and it calibrates the same instrument.'
  independent_variables: []
  metrics:
    primary:
    - per curve, the tuple (p, t,
    - the reduced Tate self-pairing value and its exact multiplicative order
    - the three booleans of prediction 1 and their agreement matrix
    - pass or fail of every named control
    secondary:
    - for the trace-two solve, an independently re-verified certificate [k]P = Q
  heuristic_under_test: null
  preregistered_prediction:
    quantity: agreement between the three independently computed booleans [N divides disc(End(E))],
      [ord_N(p) = 1], [t(P,P) not equal to 1], over a toy curve sweep
    formula: Perfect three-way agreement on 100 percent of curves. Even one disagreement falsifies
      (B), or (C), or the instrument, and the record pre-commits to a diagnostic order - instrument
      first (run the planted positive), then (C), then (B).
    source: pre-registered in IDEA-20260807-30868b before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - The divisor-shift auxiliary point. Computing t(P,P) requires a divisor representative with support
    disjoint from div(f_{N,P}), typically (P+R) - (R) for a random auxiliary R. R is NOT a second
    independent point in G and its use does not violate the "one point" requirement - but a buggy
    implementation can make the value depend on R, which would look like a discovery. The instrument
    must report invariance across at least 20 independent R per evaluation.
  - Small-N artifacts. At toy scale N can be small enough that mu_N is accidentally in F_p for reasons
    unrelated to the intended family, inflating the k = 1 population. The prime ladder must include
    N large relative to p so that the corollary in (B) is in force.
  - Conductor confusion. disc(End(E)) and disc(Z[pi]) differ by a square factor. The equivalence in
    (B) is stated for disc(End(E)) dividing t^2 - 4p; when N || t^2 - 4p exactly, N | disc(End(E))
    follows, but the general case needs care. Every reported divisibility must name which discriminant
    it used.
  - Treating the k = 1 branch as a new attack. It is not. It is MOV/Frey-Ruck at its most favourable
    parameter, and its cost is the F_p DLP, charged in full.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Perfect three-way agreement on 100 percent of curves. Even one disagreement falsifies
    (B), or (C), or the instrument, and the record pre-commits to a diagnostic order - instrument
    first (run the planted positive), then (C), then (B).
  falsification_criterion:
  - Stage 0 finds the CHM constraint different from the transcription, or inapplicable to ordinary
    prime-field curves. Argument (B) is void; (C) survives independently and the record is superseded
    with the narrower claim.
  - Any curve with k > 1 returning a non-trivial reduced Tate self-pairing, surviving the instrument
    controls. That refutes (C) and would be the most consequential observation this lane could produce.
  - 'Any curve with k = 1 and N || #E returning a trivial self-pairing. That refutes the non-degeneracy
    step and would mean the exceptional case is empty too - which would make the closure STRONGER,
    and the record commits to reporting it as such rather than as a failure.'
  - A curve on which N | disc(End(E)) but ord_N(p) is not 1. That is arithmetically impossible under
    (B), so it means the discriminant or the order computation is wrong; halt and repair.
  - Toy-scale F_{p^k} arithmetic exceeding budget before any k > 1 curve is measured. INFRASTRUCTURE
    outcome under AGENTS.md rule 5, recorded as such, never as evidence about self-pairings.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
