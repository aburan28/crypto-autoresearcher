experiment:
  id: EXP-SSI-ad4f9b
  hypothesis_id: H-SSI-cd6f34
  derived_from_idea: IDEA-20260803-48e258
  question_id: RQ-SSI-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Crossover locus p*(w) for the corrected p^(1/3+o(1)) supersingular-isogeny method against
    the matched Delfs-Galbraith / van Oorschot-Wiener middle-memory baseline - a cost-model
    measurement emitting a locus with a pre-registered lower bound, a known-answer gate at the
    committed margin point, a fitted-window guard, a null-baseline control and an
    adversarial-corner reading, on committed numbers and zero new cryptanalytic compute
  objective: >-
    The one uncertainty a run reduces - whether the campaign's committed uncertainty, which is
    too wide to make the margin at one (p, w) point conclusive, is narrow enough to make the
    LOCATION of the sign change conclusive. A run establishes (i) whether the curve machinery
    reproduces the committed BATCH-003 margin band at the matched point for all eighteen
    readings, which is a hard gate on everything else; (ii) the crossover locus p*(w) over five
    memory values, eighteen readings and both batched-evaluation scenarios, with undefined
    segments marked and the charging-point correction applied and signed; (iii) whether the
    relative width of the locus band is strictly smaller than the relative width of the margin
    band at the matched point, which is the load-bearing reconditioning claim and which can
    fail; and (iv) how far the locus moves when the corrected overhead is replaced by the
    source's original one-operation-per-entry convention, which forces the overhead correction
    to demonstrate it is doing the work claimed for it. No attack, break, speedup or security
    consequence is claimed here or would follow from a run. No new gamma is acquired and no new
    measurement of any kind is made.
  what_this_is_not:
  - >-
    Not an attack, a key recovery, a distinguisher, or any cryptanalytic result. It is a
    rearrangement of already committed measurements into a different reported object.
  - >-
    Not a validation of Heuristic 1 of the assessed method, not a substitute for pairing that
    heuristic with a validation experiment, and not a reason to defer that pairing. Every
    emitted object carries the condition on its face.
  - >-
    Not a security claim, in either direction, about any deployed parameter set. A crossover
    above the deployed range is a statement about a model.
  - >-
    Not a re-examination of NIST-III or NIST-V, which retain comfortable margins under every
    committed scenario.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence.
    No run has been executed under this contract.
  claim_ceiling:
    tier: medium
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - under the frozen baseline cost model, the committed c
      bracket with its mandatory attachments, the committed eighteen measured-gamma readings,
      the transcribed baseline constant, and the two declared batched-evaluation scenarios,
      the crossover locus p*(w) takes the tabulated values over w in the plotted range on the
      segments inside fitted windows, and the relative band width of that locus stands in the
      stated ratio to the committed margin's relative band width. WHAT DOES NOT FOLLOW - no
      security statement about any parameter set; no validation of Heuristic 1; no statement
      about segments outside fitted windows, which are emitted as gaps; no statement about
      implementation constants, parallelism or memory hierarchy; and nothing at all about
      whether the batched implementation is buildable.
  inputs:
    procedure: >-
      STAGE 0 (zero compute). Freeze, in a hash-bound specification written before any curve
      is drawn, the crossover definition, the baseline cost model, the uncertainty-propagation
      rule, the fitted-window boundaries, and the two batched-evaluation scenario values.
      STAGE 1 (zero compute, BLOCKING FOR THE ABSOLUTE LOCUS). Execute the bibliographic
      transcription of the Delfs-Galbraith / van Oorschot-Wiener constants and the baseline
      constant, with quoted excerpts and content hashes. If unobtainable, emit the curve ONLY
      in ratio form against an unpinned baseline constant and report the absolute locus as
      UNRUN under AGENTS.md rule 5.
      STAGE 2 (minutes, HARD GATE). Re-read every committed input from its committed source
      record rather than from the parent proposal's transcription, and report any disagreement
      as a defect of the parent record. Then run the known-answer gate at the matched point for
      all eighteen readings.
      STAGE 3 (minutes). Emit p*(w) over the five memory values for all eighteen readings and
      both batched-evaluation scenarios, with the charging-point correction applied and its
      sign printed, and with every out-of-window evaluation emitted as an UNDEFINED segment
      naming the missing input.
      STAGE 4 (minutes). Run the null-baseline control and the adversarial-corner reading.
      STAGE 5 (zero compute). Report the band-width comparison, the joint-or-split verdict on
      the two batched-evaluation scenarios, and the list of undefined segments.
    instrument: >-
      Standard-library Python 3.11 plus numpy for the table, with a machine-readable table
      writer. NO Sage, no isogeny computation, no field arithmetic, no solver, no seeds beyond
      the frozen input files. All committed inputs are read from the repository's committed
      evidence, decision and goal records by exact path, and each read is logged with the path
      and the file's content hash. Recorded through harness/runner.py.
    parameters: >-
      Memory axis w in {2^20, 2^25, 2^30, 2^35, 2^40}. Eighteen committed measured-gamma
      readings, taken as an enumerated set and never averaged. The committed c bracket, used
      only as a bracket with its mandatory attachments and never as a point value. Two
      batched-evaluation scenarios at the committed low and high extremes. Standardized
      parameter sets - the NIST-I, NIST-III and NIST-V primes as named in the campaign's
      committed goal record; NIST-I is the known-answer point and the only set at which the
      pre-registered bound is contested. The prime ladder for the locus sweep runs over
      log2 p in {128, 192, 256, 320, 384, 448, 512, 576, 640, 768, 1024} plus a bisection
      refinement of the sign change to 0.5 bits of log2 p.
  controls:
  - >-
    KNOWN-ANSWER GATE, HARD BLOCKER. Evaluated at w = 2^30 and the NIST-I prime, the curve
    machinery must return a margin inside the committed BATCH-003 band for every one of the
    eighteen readings. A curve that cannot reproduce the point it generalizes is void, and
    nothing downstream is emitted.
  - >-
    FITTED-WINDOW GUARD. Every evaluation at a (p, w) for which any required input lies
    outside its fitted window is emitted as UNDEFINED with the missing input named, never
    extrapolated. This control exists because a prior extrapolation defect in this campaign
    was found by review rather than by contract, and it makes the discipline mechanical.
  - >-
    NULL-BASELINE CONTROL. Recompute p*(w) with the corrected overhead REPLACED by the
    source's original one-operation-per-entry convention. The locus must move by an amount
    consistent with the measured overhead. A locus that barely moves means the corrected
    overhead is not driving the result.
  - >-
    ADVERSARIAL-CORNER CHECK. Evaluate at the corner of the c bracket and the gamma readings
    MOST favourable to the attack, and report that corner explicitly with its p* value. The
    pre-registered lower bound is claimed only if it survives that corner.
  - >-
    INPUT-PROVENANCE CONTROL. Every committed number is re-read from its committed source
    record with its path and content hash logged, and is compared against the parent
    proposal's transcription. A disagreement is reported as a defect and halts the emission of
    any object that depends on the disputed number.
  - >-
    NULL OBJECT (mandatory under docs/inventor-protocol.md). The null object here is the
    SCALAR the curve is supposed to improve on - the committed margin at the single point
    (p = NIST-I, w = 2^30) with its committed band. The curve must reproduce it exactly
    (known-answer gate) AND must beat it on relative band width (band_ratio < 1.0). If the
    curve reproduces the scalar but does not beat its relative width, the null object has won
    and the record's central claim is refuted - which is the outcome this control exists to
    make visible rather than to prevent.
  independent_variables:
  - available memory w
  - measured-gamma reading (eighteen committed values, enumerated, never averaged)
  - batched-evaluation scenario L4 (two values, low and high committed extremes)
  - overhead convention (corrected versus original one-operation-per-entry, for the null baseline)
  - corner of the c bracket (central versus attack-favourable, for the adversarial-corner check)
  metrics:
    primary:
    - >-
      p_star_table - log2 p*(w) as a machine-readable table over eighteen readings x two L4
      scenarios x five w values, in bits of log2(p), computed as the location of the sign
      change of the log-cost difference between the two curves, bisected to 0.5 bits.
    - >-
      band_ratio - dimensionless. Computed as (max minus min of log2 p*(2^30) over the
      eighteen readings and both L4 scenarios, divided by the median log2 p*(2^30)) divided by
      (the committed margin band width in bits, divided by the committed margin's central
      value). Strictly below 1.0 supports the reconditioning claim; at or above 1.0 refutes it.
    - >-
      known_answer_gate_pass_count - integer out of eighteen. The number of readings whose
      reconstructed margin at w = 2^30 and the NIST-I prime lies inside the committed
      BATCH-003 band.
    - >-
      null_baseline_displacement - in bits of log2(p). The signed shift of log2 p*(2^30) when
      the corrected overhead is replaced by the original one-operation-per-entry convention.
    secondary:
    - >-
      adversarial_corner_p_star - log2 p* at the most attack-favourable admissible corner, per
      w, reported as its own row rather than folded into the band.
    - >-
      l4_verdict - JOINT if both batched-evaluation curves independently satisfy the
      pre-registered bound at every w, SPLIT otherwise, with the separating w named.
    - >-
      undefined_segment_list - every (p, w) at which any required input is outside its fitted
      window, with the missing input named for each. Count and enumeration both reported.
    - >-
      charging_point_correction - the signed correction applied for the charging-point
      overstatement, in bits, printed per curve rather than absorbed.
    - >-
      input_provenance_table - one row per committed input, giving its source path, content
      hash, committed value, and whether it agrees with the parent proposal's transcription.
  cost_model:
    measured_vs_modeled: >-
      Every column of the emitted table is labelled MEASURED or MODELED and the two never mix
      in one column. MEASURED - the per-entry overhead exponents and the ell-independent
      structural prefactor, both read from committed BATCH-002/003 evidence. MODELED - the
      p^(1/3+o(1)) and p^(1/2) cost laws, the van Oorschot-Wiener memory dependence, and the
      baseline constant, all of which are formulas with named sources. DERIVED - p*(w) itself,
      which is a root of a modelled difference evaluated at measured coefficients, and is
      labelled DERIVED rather than either.
    optimistic_assumptions:
    - >-
      The low end of the committed c bracket is OPTIMISTIC (favourable to the attack), because
      one of the two seam-free exponents is a transient of the unimproved shared reduction.
      Direction of bias - lowers p*, i.e. makes the method look MORE relevant than it is.
    - >-
      The charging point overstates the entry-weighted cost. Direction of bias - raises p*,
      i.e. makes the method look LESS relevant than it is. This one is corrected explicitly
      and its sign is printed rather than absorbed.
    - >-
      Treating the o(1) as a constant over the plotted range. Direction of bias - UNKNOWN and
      declared unknown, since the o(1) hides a superpolynomial overhead in the assessed
      method's own statement; at large p this is the term the locus is most sensitive to, and
      it is printed on the curve rather than footnoted.
    - >-
      Charging the batched-evaluation term at either declared extreme rather than at a
      measured value. Direction of bias - the low extreme favours the attack. Both are emitted
      separately so the reader sees the interval rather than a choice.
    memory_accounting: >-
      Memory is a FREE AXIS of the deliverable, not a fixed assumption - that is the point of
      the record, since the committed margin is quoted at a single w. The assessed method's
      dominant structure is its per-entry table, sized analytically from the committed
      structural prefactor; the baseline's memory dependence enters through the van
      Oorschot-Wiener constant. The RUN's own memory is negligible (a table of a few thousand
      rows) and is reported separately so it is not confused with the modelled attack memory.
    hidden_overhead: >-
      Disclosed on the face of every emitted curve, not in a footnote. The o(1) in
      p^(1/3+o(1)) hides a superpolynomial overhead by the assessed method's own statement;
      the batched-evaluation term removes a large but never-implemented part of the corrected
      overhead and is carried as two scenarios; and the charging-point overstatement is
      applied as a signed correction.
    standardized_parameter_sets: >-
      NIST-I, NIST-III and NIST-V as named in the campaign's committed goal record. The
      pre-registered bound is contested at NIST-I only. Affected-versus-safe scope - if the
      bound holds, NO deployed parameter set in the plotted memory range is affected by the
      assessed method under this cost model, and that statement is scoped to the model, the
      committed inputs and the fitted windows.
  heuristic_under_test: null
  heuristic_under_test_note: >-
    Explicitly null. This contract does NOT test Heuristic 1 of the assessed method; it
    inherits it. HEUR-XO-1 and HEUR-XO-2 of H-SSI-cd6f34 are CONTAINED rather than tested -
    HEUR-XO-1 by the fitted-window guard, which refuses to evaluate outside the fitted window,
    and HEUR-XO-2 by the ratio-form fallback, which emits the shape without the constant. A
    contract that tested a heuristic would need a sampling arm and this one has none.
  preregistered_prediction:
    quantity: >-
      Two quantities, both fixed before any curve exists. (1) The minimum over the eighteen
      readings and both batched-evaluation scenarios of log2 p*(w), for every w <= 2^40.
      (2) band_ratio at w = 2^30 and the NIST-I prime.
    formula: >-
      p*(w) is defined as the unique p at which log2 C_method(p, w) minus log2
      C_baseline(p, w) changes sign, with C_method the corrected p^(1/3+o(1)) cost at the
      given reading and scenario and C_baseline the matched Delfs-Galbraith / van
      Oorschot-Wiener middle-memory cost at memory w. PREDICTED - min log2 p*(w) > 512 for
      every w <= 2^40. band_ratio is defined in the metrics block. PREDICTED - band_ratio
      strictly below 1.0. Under the null that the rearrangement buys nothing, band_ratio is
      at least 1.0.
    source: >-
      Pre-registered in the parent proposal IDEA-20260803-48e258, predictions
      crossover_locus_lower_bound and crossover_band_width_in_log2p, before any run under this
      contract exists. Never tuned to data; a run that reports a different quantity reports a
      different experiment.
  scale_relevance:
    tier: medium
    justification: >-
      The inputs are the campaign's only medium-tier measured results against a
      cryptographically scaled target, and the deliverable is evaluated at and beyond the
      standardized parameter sets rather than at toy scale. The transfer assumption is stated
      and is narrow - that the committed overhead law holds inside its fitted window and that
      out-of-window points are emitted as gaps rather than extrapolated. There is NO transfer
      from a toy measurement here, because there is no new measurement at all; what there is
      instead is an extrapolation risk in p, and the fitted-window guard is the contract's
      answer to it.
    correspondence: null
  tail_checks:
  - >-
    Report the number of readings whose p*(w) falls within 8 bits of the 2^512 boundary at
    any w. A bound that holds only by a narrower margin than the propagation error is reported
    as MARGINAL rather than as satisfied.
  - >-
    Report the extreme corner explicitly (attack-favourable c end, attack-favourable gamma
    reading, low batched-evaluation extreme) and its p* per w. The pre-registered bound is
    claimed only if the extreme corner satisfies it.
  - >-
    Report the sensitivity of log2 p* to a one-bit perturbation of the modelled o(1) term at
    each w, since that term is treated as a constant and the locus at large p is most
    sensitive to it.
  - >-
    Report the monotonicity of p*(w) in w. More memory helps the baseline and must push p* UP.
    A p*(w) that is flat or non-monotone in w means the baseline's memory dependence is not
    wired in and the instrument is not responding to the parameter it is built around; that is
    an instrument failure, not a finding.
  replication:
    seeds:
    - 20260825
    independent_instances: 3
    note: >-
      The computation is deterministic and carries no randomness, so seeds control only the
      table-writer ordering and the bisection start point. The three independent instances are
      three independent re-executions from the committed inputs, and their outputs must agree
      bit-for-bit; any disagreement is an instrument defect.
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1.0
    maximum_memory_gb: 4
    maximum_runs: 6
  stopping_rules:
  - >-
    HALT if the known-answer gate fails on any of the eighteen readings. No locus, no band and
    no scenario comparison is emitted.
  - >-
    HALT the absolute-locus arm if the bibliographic transcription cannot be executed; emit the
    ratio-form curve only and report the absolute locus as UNRUN. This is a stop, not a
    negative result.
  - >-
    HALT if any committed input re-read from its source disagrees with the parent proposal's
    transcription; report the disagreement and wait for a Coordinator decision rather than
    choosing a value.
  - >-
    Stop at the declared memory axis, the declared prime ladder and the declared two batched-
    evaluation scenarios. The propagation rule and the fitted-window boundaries are frozen
    before any curve is drawn and are not revised after seeing a locus.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a
    stop, never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion, network failure or dependency failure makes the run
    failed_infrastructure and is NEVER negative mathematical evidence (AGENTS.md rule 5). A
    failed bibliographic fetch is specifically named here as such.
  - >-
    A run in which any curve segment is drawn through a region where a required input is
    outside its fitted window, without that segment being marked UNDEFINED, is
    invalid_measurement. The contract's central discipline was not applied.
  - >-
    A run that reports the spread of the eighteen readings as a confidence interval is
    invalid_measurement. They share the same acquired ell set and the same two implementations
    and are not independent.
  - >-
    A run that cites a point value for c rather than the committed bracket with its mandatory
    attachments is invalid_measurement, per DEC-20260802-48c72c.
  - >-
    A run whose control arm (null baseline or adversarial corner) was not executed in the same
    invocation as the signal arm is invalid_measurement.
  - >-
    A run whose parameters differ from this frozen contract is a DIFFERENT experiment and needs
    a new contract; it is never a repair of this one.
  success_criterion: >-
    ALL FOUR of the following, each decidable from the primary metrics. (1)
    known_answer_gate_pass_count equals 18. (2) The p_star_table is emitted complete over
    eighteen readings x two L4 scenarios x five w values, with every out-of-window cell marked
    UNDEFINED and its missing input named. (3) band_ratio is reported with its two components
    shown separately. (4) null_baseline_displacement and adversarial_corner_p_star are reported
    for every w. NOTE that success here means the MEASUREMENT WAS MADE; whether the hypothesis
    is supported is decided by the pre-registered prediction and the falsification criteria
    below, and a completed run that refutes S1 or S2 is a successful run.
  falsification_criterion:
  - >-
    band_ratio at or above 1.0 - S2 is FALSE. The crossover band is proportionally no
    narrower than the margin band, the reconditioning argument is wrong, the curve buys
    nothing over the scalar, and that negative is the deliverable.
  - >-
    Any admissible reading placing log2 p*(w) at or below 512 for some w <= 2^40 - S1 is
    FALSE. This is the concrete-threat finding; it is escalated for independent review before
    any interpretation and is reported with its reading and scenario named.
  - >-
    known_answer_gate_pass_count below 18 - the machinery is wrong and nothing is reportable.
  - >-
    null_baseline_displacement near zero - the corrected overhead is not driving the locus,
    and the record must be re-described rather than defended.
  - >-
    p*(w) flat or non-monotone in w - the baseline's memory dependence is not wired in; the
    instrument is not responding to its own free parameter and no locus is reportable.
  required_artifacts:
  - >-
    manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
    model/inference block and environment
  - >-
    raw-result.json carrying every per-cell value of the p_star_table, not summaries
  - >-
    the input_provenance_table with one row per committed input, its source path, content
    hash and committed value
  - >-
    the null-baseline arm and the adversarial-corner arm, in the same file as the signal arm
  - >-
    the frozen hash-bound Stage-0 specification, written before any curve is drawn and hashed
  - >-
    the bibliographic transcription with quoted excerpts and content hashes, or an explicit
    UNRUN receipt naming what could not be fetched
  - >-
    the enumerated list of UNDEFINED segments with the missing input named for each
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval is required before execution. This contract is NOT approved;
    approved_by is null, execution_authorized is false and frozen is false (AGENTS.md rule 1).
    Approval is the user's gate because it authorizes execution and spends compute.
  - >-
    The bibliographic transcription is BLOCKING for the absolute-locus arm and must be
    attempted before the run is scored against the pre-registered bound. If it is expected to
    fail, the Coordinator should authorize the ratio-form arm explicitly rather than letting
    the run discover it.
  - >-
    A Coordinator must confirm, before approval, that this contract does not displace the
    pairing of Heuristic 1 with its own validation experiment, which remains the campaign's
    substantive outstanding item.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260803-48e258
    authored_at: '2026-08-25'
    note: >-
      Design, controls, metrics and criteria are taken from the parent proposal's
      minimal_test, controls, required_metrics, predictions and falsification_conditions, and
      are restated here as a contract rather than re-invented. Boilerplate identical across
      contracts by program rule - invalidation rules, required artifacts, approval gate - comes
      from a fixed table. Budgets come from the parent's declared estimated_cost, which is
      implementation low and compute none. NO NUMBER IS INVENTED - every committed value the
      parent recites is treated as a transcription to be re-read from its source at run time,
      and no measurement, timing or result is asserted here.
  derivation_gaps:
  - >-
    The parent proposal recites committed numeric values (the c bracket endpoints, the two
    seam-free exponents, the structural prefactor, the margin band, the batched-evaluation
    extremes) as prose. This contract deliberately does NOT copy them into its own parameter
    block, because a transcription of a transcription is how a wrong number becomes load
    bearing. The executor must read each from its committed source. A Coordinator may wish to
    pin the exact source paths in an amendment before approval.
  - >-
    The uncertainty-propagation rule from the eighteen readings and the c bracket to the width
    of the p*(w) band is named but not specified. It must be fixed in the Stage-0 hash-bound
    specification BEFORE any curve is drawn, because choosing it after seeing the band is how
    band_ratio silently becomes whatever is wanted.
  - >-
    The fitted-window boundaries in both p and ell are named but not enumerated here. They
    must be read from the committed fit and frozen in Stage 0; a window chosen to include a
    desired point is the exact failure the guard exists to prevent.
  - >-
    The bisection tolerance of 0.5 bits of log2 p is chosen for legibility, not derived from
    the propagation error. If the propagation error is much larger, the tolerance is spurious
    precision and should be widened in an amendment before approval.
