# EXP-BINSTD-92ffc6
# Cofactor ratio arithmetic. No builder audit.
# Approved by DEC-20261002-d91465.
experiment:
  id: EXP-BINSTD-92ffc6
  hypothesis_id: H-BINSTD-55f2c8
  source_idea: IDEA-20261001-5628bc
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Cofactor ratio arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-d91465
  objective: >-
    Compute the order of (1, 0) on the F_2 curve and the exact
    size-ratio powers, including the sides of the written decimals.
  inputs:
    affine_on: [[0, 1], [1, 0], [1, 1]]
    affine_off: [0, 0]
    double: [0, 1]
    triple: [1, 1]
    quadruple_identity: true
    rows:
      - {m: 2, yield_den: 4, attempts: 1, yield2_den: 2, attempts2: 1}
      - {m: 3, yield_den: 16, attempts: 4, yield2_den: 4, attempts2: 2}
      - {m: 4, yield_den: 64, attempts: 16, yield2_den: 8, attempts2: 4}
      - {m: 5, yield_den: 256, attempts: 64, yield2_den: 16, attempts2: 8}
      - {m: 6, yield_den: 1024, attempts: 256, yield2_den: 32, attempts2: 16}
      - {m: 8, yield_den: 16384, attempts: 4096, yield2_den: 128, attempts2: 64}
    la_den: 16
    la2_den: 4
    shift_m2_above_13333: true
    shift_m2_below_13334: true
    shift_m3_exact: true
    shift_m4_exact: true
    shift_m5_above_6666: true
    shift_m5_below_6667: true
    shift_m6_above_5714: true
    shift_m6_below_5715: true
    shift_m8_above_4444: true
    shift_m8_below_4445: true
    multiset: 6
    combination: 3
    partner_floor_log: 129
    partner_product: 2722258935367507707729280517973639940516
    partner_mod4: 1
  controls:
    - >-
      A double equal to the identity is false. Twice (1, 0) is
      (0, 1). Reporting the identity invalidates the run.
    - >-
      An arity-2 attempt count of 4 is the size ratio. The attempt
      count is 1. Reporting 4 invalidates the run.
    - >-
      The point (0, 0) on the curve is false. Reporting it on the
      curve invalidates the run.
    - >-
      The written 1.3333 as an upper bound on 4/3 is false. 4/3 is
      strictly above 13333/10000 and strictly below 13334/10000.
      Reporting otherwise invalidates the run.
    - >-
      The written 0.6667 as a lower bound on 2/3 is false. 2/3 is
      strictly above 6666/10000 and strictly below 6667/10000.
      Reporting otherwise invalidates the run.
    - >-
      A multiset count of 3 is the combination count. C(4, 2) is 6.
      Reporting 3 invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - arity
    - route in {group_powers, repeat_module}
  metrics:
    primary:
      - double
      - attempts_m2
      - multiset
      - implementations_agree
    secondary:
      - shift_sides
      - partner_floor_log
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The double (0, 1) and the arity-2 attempt count 1.
    formula: >-
      Distinct-point addition and doubling use the binary slope.
      The attempt count is 4 to the power m-2. The free-oracle
      shift is 4/(m+1), compared with the written ten-thousandths
      by cross-multiplication. The multiset count is C(4, 2).
    source: >-
      IDEA-20261001-5628bc states the four-point subgroup and the
      ratio table, read 2026-10-02. The group law and the powers
      were computed in this design session. That computation is
      not a run. The arity-2 attempt count is 1. No builder was
      read.
  scale_relevance:
    tier: toy
    justification: One four-point group and six integer rows. No transfer to a builder.
    correspondence: null
  tail_checks:
    - The m = 8 row is required. Stopping after m = 4 and still reporting the m = 8 powers is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If twice (1, 0) is reported as the identity, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - Twice (1, 0) is reported as the identity.
    - The arity-2 attempt count is reported as 4.
    - (0, 0) is reported on the curve.
    - 4/3 is reported at most 1.3333, or 2/3 is reported at least 0.6667.
    - The multiset count is reported as 3.
    - A builder classification or a primality proof is reported.
  success_criterion: >-
    Both runs agree that the affine points are (0, 1), (1, 0) and
    (1, 1), that twice (1, 0) is (0, 1), that three times (1, 0)
    is (1, 1), that four times (1, 0) is the identity, that the
    six attempt counts are 1, 4, 16, 64, 256 and 4096, that the
    multiset count is 6, and that the six decimal sides match the
    table. The arity-2 attempt count stays 1.
  falsification_criterion: >-
    The runs agree, the double stays (0, 1), the arity-2 attempt
    count stays 1, and any count differs from the preregistered
    table.
  required_artifacts:
    - experiments/EXP-BINSTD-92ffc6/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-92ffc6/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-92ffc6/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-92ffc6/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-92ffc6/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-92ffc6/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any builder audit, primality proof, or curve over a larger field.
    - A claim that a cofactor convention helps or does not help.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
