experiment:
  id: EXP-EWALK-b57ffb
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-18d2f7
  question_id: RQ-EWALK-8fa147
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE QUOTIENT LADDER, INCLUDING ITS TRIVIAL TOP AND ITS ONE OPEN RUNG: quotienting G by the
    FULL End(E)-action leaves exactly TWO classes and zero information about k, so the ladder is bounded
    above by uselessness and below by |Aut| <= 6; the two costs that bound it are INDEPENDENT and
    have DIFFERENT thresholds -- canonicalisation costs h per STEP and binds at h > 6, disambiguation
    costs h per COLLISION and does not bind until h ~ sqrt(N) -- and the gap between those thresholds
    is the lane''s only exponent-moving target: an efficiently computable H-invariant on the ENCODING
    for H of order h >> 6 would give a sqrt(h) speedup, which at h = N^{2/3} is N^{1/6} total, and
    Shoup''s bound does NOT forbid it because such an invariant is non-generic by construction'
  status: draft
  objective: "(A) THE TOP OF THE LADDER IS TRIVIALLY USELESS, AND SAYING SO CLOSES A FAMILY THAT KEEPS\
    \ REAPPEARING. \"Quotient the group by the endomorphism ring action\" sounds like the natural\
    \ maximal version of the automorphism trick. It is not, and the reason is one line. On a prime-order\
    \ G every endomorphism acts as a scalar (H-ENDO-001), and Z is contained in every End(E), so the\
    \ image of the full endomorphism action on G is ALL of Z/N. The orbit of any A != O under that\
    \ action is therefore [c]A for every c, i.e. the whole of <A> = G \\ {O}. THE QUOTIENT HAS EXACTLY\
    \ TWO CLASSES: {O} and everything else. A walk on it carries zero bits about k, and no collision\
    \ in it is a relation. The family is closed by counting, at zero compute, and the closure is worth\
    \ recording precisely because the construction sounds maximal rather than degenerate.\n(B) THE\
    \ LADDER, ENUMERATED, WITH THE REALISABILITY CONSTRAINT MADE EXPLICIT. The equivalences available\
    \ are indexed by subgroups H <= (Z/N)^*, with A ~ [c]A for c in H. Orbits have size h = |H| (freely,\
    \ since N is prime and c != 1 fixes no nonzero point). The ladder:\n  h = 1     no quotient. Baseline\
    \ 1.2533*sqrt(N).\n  h = 2     H = {+-1}, the negation. Canon free. Gain sqrt(2). AVAILABLE ON\n\
    \            EVERY CURVE.\n  h = 4     H = mu_4, units of Z[i]. Requires D_0 = -4, j = 1728,\n\
    \            p = 1 mod 4. Canon free (min over <= 4 encodings). Gain 2.\n  h = 6     H = mu_6,\
    \ units of Z[zeta_3]. Requires D_0 = -3, j = 0,\n            p = 1 mod 3. Canon free. Gain sqrt(6)\
    \ = 2.449. THIS IS THE TOP\n            OF THE FREE-CANON LADDER (IDEA-20260807-ebcae6, Lemma\
    \ 1).\n  6 < h < N H = <lambda> for lambda of multiplicative order h. Realisable\n           \
    \ as an ACTION at cost: free if lambda is a unit (impossible for\n            h > 6), a few field\
    \ operations if lambda is the eigenvalue of\n            an efficiently computable non-unit endomorphism\
    \ (small |D_0|\n            only), and about log2(N) group operations for an arbitrary\n     \
    \       scalar c. Canon by enumeration costs h evaluations per step.\n            THE OPEN RUNG.\n\
    \  h = N-1   H = (Z/N)^*, i.e. (A). Two classes, zero information.\nTHE REALISABILITY CONSTRAINT\
    \ IS OFTEN MISSED AND IS WORTH STATING: one cannot simply \"choose H\". To quotient by H one must\
    \ be able to APPLY its elements, and the cheaply applicable ones are exactly the F_p-rational\
    \ endomorphisms, which for a generic curve are the scalars (expensive, log2(N) group operations\
    \ each) plus {+-1} (free).\n(C) THE TWO COSTS ARE INDEPENDENT AND THEIR THRESHOLDS DIFFER BY AN\
    \ EXPONENT. This is the record's substantive content and it does not appear anywhere in the corpus.\n\
    \  (COST 1) CANONICALISATION, PAID PER STEP. Every step must map a class to\n    a class, which\
    \ requires a canonical orbit element. By enumeration that\n    is h evaluations per step. The\
    \ gain is sqrt(h), so the charged ratio is\n    h/sqrt(h) = sqrt(h) >= 1 and the quotient is a\
    \ strict LOSS for every\n    h >= 2 whose canon is not free. THRESHOLD: binds immediately, i.e.\
    \ at\n    h > 6 where free canon runs out.\n  (COST 2) DISAMBIGUATION, PAID PER COLLISION. A class\
    \ collision gives\n    a_i P + b_i Q = [c](a_j P + b_j Q) for an UNKNOWN c in H. With h\n    candidates\
    \ one tries each and verifies [k]P = Q, costing h*log2(N)\n    group operations ONCE per candidate\
    \ collision, not per step. THRESHOLD:\n    this stays below the walk's own sqrt(N) cost until\
    \ roughly\n    h ~ sqrt(N)/log2(N).\n  SO THE TWO CONSTRAINTS ARE SEPARATED BY AN ENORMOUS GAP:\
    \ h > 6 kills the\n  step cost while h up to about sqrt(N) is affordable for the collision\n \
    \ cost. EVERYTHING THE LANE'S CEILING RESTS ON IS COST 1 ALONE. Cost 2 is\n  not the obstruction\
    \ and never was, and any argument that conflates them\n  is bounding the wrong quantity.\n\n(D)\
    \ THE OPEN RUNG IS EXPONENT-MOVING, WHICH IS WHY THIS RECORD REFUSES TO CLOSE THE LANE. Suppose\
    \ there existed an efficiently computable H-INVARIANT: a function f on G, computable in O(1) or\
    \ O(polylog) field operations from the ENCODING of a single point, non-constant, with f([c]A)\
    \ = f(A) for all c in H, for some H of order h. Then canon is free (use f as the class label),\
    \ COST 1 vanishes, and the walk runs on (N-1)/h + 1 classes at 1.2533*sqrt(N/h) steps. Put h =\
    \ N^{alpha}:\n  total cost about N^{(1-alpha)/2}, plus COST 2 at about N^{alpha} once.\n  Balancing\
    \ (1-alpha)/2 = alpha gives alpha = 1/3 and total N^{1/3}.\nA cheap invariant for an orbit of\
    \ size N^{1/3} would therefore give an N^{1/3} algorithm for prime-field ECDLP, an EXPONENT MOVE\
    \ from 1/2 to 1/3. THIS IS NOT A CLAIM THAT SUCH AN f EXISTS. It is a statement of what the lane's\
    \ one open rung is worth, stated so the rung is not quietly filled in with \"closed\".\n(E) SHOUP'S\
    \ BOUND DOES NOT FORBID IT, AND THE REASON IS EXACTLY WHY THE LANE IS FILED AS INADMISSIBLE. In\
    \ the generic group model the encodings are random labels, so a function of a single label that\
    \ is constant on <lambda>-orbits would have to encode knowledge of the orbit structure, which\
    \ a generic algorithm does not have; the only generic route is to compute the h orbit elements,\
    \ which costs h. So the Omega(sqrt(N)) bound (KN-TECH-005) and the ceiling sqrt(|Aut|) are CONSISTENT\
    \ with (D): the bound forbids a GENERIC cheap canon, and (D) asks for a NON-GENERIC one -- a function\
    \ of the actual x-coordinates of the actual curve. That is resource R1 in the campaign's taxonomy\
    \ (x-coordinates as field elements), not R3, and it is therefore OUTSIDE the closure of KN-FIND-b7e091,\
    \ which covers incidence and endomorphism-image oracles only. THE HONEST READING OF LANE L6 IS\
    \ THEREFORE: the R3-only part is closed at sqrt(6), and the one live question it points at is\
    \ an R1 question that belongs to lanes L1/L11 and should be handed to them with this framing attached.\n\
    (F) THE NATURAL CANDIDATES FOR f FAIL, AND THE FAILURES ARE INSTRUCTIVE RATHER THAN EXHAUSTIVE.\n\
    \  (F1) THE ORBIT SUM sum_{i<h} [lambda^i] A = [(lambda^h - 1)/(lambda - 1)] A\n    = O identically,\
    \ since lambda^h = 1 and lambda - 1 is invertible mod N.\n    Constant, hence useless. Instantiated\
    \ at h = 3 on a real curve\n    (p = 4294967539, y^2 = x^3 + 7, N = 613557433) in EV-ENDO-001\
    \ /\n    KN-FIND-009, where P + phi(P) + phi^2(P) returned the point at\n    infinity.\n  (F2)\
    \ ANY SYMMETRIC FUNCTION OF THE ORBIT COMPUTED IN THE GROUP inherits\n    the same problem for\
    \ the additive symmetric functions, and the\n    non-additive ones (products of x-coordinates,\
    \ elementary symmetric\n    polynomials in the x_i) are NOT computable without first computing\
    \ the\n    orbit -- which is COST 1 again. This is the loop the family keeps\n    returning to.\n\
    \  (F3) A MODULAR FUNCTION OR ISOGENY INVARIANT would be invariant under\n    maps of CURVES,\
    \ not of POINTS, and so does not separate points at all.\n    This is the point where the lane\
    \ hands off to L10/RQ-CLGP-b99df5, and\n    the hand-off is a scope boundary rather than a failure.\n\
    \  NOT EXHAUSTIVE, AND THE RECORD SAYS SO. F1-F3 are the candidates a\n  session naturally reaches\
    \ for. The absence of a cheap invariant is an\n  OPEN PROBLEM here, not a theorem, and calling\
    \ it a theorem would be\n  exactly the premature closure docs/inventor-protocol.md forbids.\n\n\
    (G) WHAT EACH POSSIBLE OUTCOME OF PURSUING (D) WOULD MEAN. Stated so the rung is a research object\
    \ rather than a gesture:\n  OUTCOME 1 -- someone exhibits a cheap non-constant <lambda>-invariant\
    \ on\n    the encoding for some h >> 6. Exponent-moving; the largest possible\n    result in this\
    \ campaign; would require independent review at\n    review-breakthrough before any description.\n\
    \  OUTCOME 2 -- someone proves no such invariant exists for a stated class\n    of computations\
    \ (e.g. low-degree rational functions of x). Then the\n    sqrt(6) ceiling becomes a theorem rather\
    \ than a cost argument, and the\n    lane closes at the section-4 standard with a genuinely strong\n\
    \    obstruction.\n  OUTCOME 3 -- neither. The rung stays open and is carried forward as a\n \
    \   named open problem with its payoff computed, which is strictly better\n    than the current\
    \ state where it is not written down at all."
  resource_label: R3 for the ladder and the closures (End(E) as a ring; its unit group and the multiplicative
    orders of non-unit eigenvalues). The OPEN RUNG in (D) is explicitly R1 (x-coordinates as field
    elements) and is labelled as such, which is the whole point of (E) -- the lane's live question
    is not in the lane's own resource.
  admissibility: inadmissible_generic_group
  admissibility_argument: THE LADDER AND ITS CLOSURES ARE INADMISSIBLE; THE OPEN RUNG IS NOT, AND
    THE RECORD SEPARATES THEM RATHER THAN AVERAGING THEM. Everything in (A), (B), (C) and (F) applies
    endomorphisms to points of a prime-order G, which is Oracle D of KN-FIND-b7e091 -- generic-group
    simulable, closed at exponent 1/2 (KN-TECH-005). The overall verdict for this record is therefore
    `inadmissible_generic_group`, and it is filed as a recorded closure of the full-ring-quotient
    family with its obstruction named. BUT (D)/(E) identify an object -- a cheap H-invariant computed
    from the x-coordinate ENCODING -- that is NOT generic-group simulable, precisely because in the
    GGM the labels are random and no function of one label can be constant on orbits without knowing
    the orbit structure. That object consumes R1 and escapes KN-FIND-b7e091's closure, which covers
    incidence and endomorphism-image oracles and not encoding-dependent invariants. It is therefore
    an ADMISSIBLE target that this lane has surfaced and cannot pursue, and the correct disposition
    is a hand-off to the R1 lanes with the payoff calculation attached.
  reachability_gate: 'TWO DIFFERENT GATES, AND SEPARATING THEM IS PART OF THE POINT. (i) FOR THE FREE-CANON
    RUNGS (h = 4, 6): unreachable in the strong sense. |Aut| is fixed by D_0, which by T4 is fixed
    by the isogeny class, so from a class with D_0 not in {-3, -4} no isogeny walk of any length reaches
    a curve with a larger automorphism group -- not expensive, impossible. Cost of construction when
    generating curves for measurement: O(1) rejection sampling on p mod 3 or p mod 4. (ii) FOR THE
    OPEN RUNG: the reachability question does not arise at all, because the object sought is a FUNCTION
    on a fixed curve, not another curve. That is a meaningful structural difference from the rest
    of the campaign, where T5 is the crux: the lane''s one live question is entirely local, needs
    no isogeny walking, and would apply to ANY prime-field curve including the target''s own. It is
    therefore the only object surfaced in this lane whose value is not gated by the class invariants
    -- which is precisely why it is worth handing to the R1 lanes rather than dropping.'
  inputs:
    procedure: 'STAGE 0 (zero compute, and it is the entire primary deliverable): write the ladder,
      the two-threshold analysis, the payoff calculation, the GGM argument, and the candidate failures,
      with the quantifier discipline of the proof_search_map enforced -- in particular, the open rung
      is written as OPEN. STAGE 1 (minutes, optional known-answer checks): on one toy curve, enumerate
      and verify (i) the full-scalar quotient has 2 classes, (ii) <lambda>-orbits have size ord(lambda)
      and partition G \ {O}, (iii) the orbit sum is O for every orbit, (iv) the h = 2 quotient has
      (N-1)/2 + 1 classes. Each is a one-line prediction and each fails loudly if wrong. STAGE 2 (zero
      compute): file the GGM question with lane L12 (RQ-GGMB-6eaabc) as an explicit oracle-class audit
      request, and file the invariant-rational-function question with the R1 lanes (L1 RQ-ICINV-475b5e,
      L11 RQ-MODEL-e61cb2) with the payoff attached. THE CHEAPEST DECISIVE ACTION IS STAGE 2''s L12
      REQUEST: a simulability result there costs no compute and would close the rung, finishing lane
      L6 at the section-4 standard with a genuinely strong obstruction rather than a cost argument.'
    mechanism: 'ZERO COMPUTE. The deliverable is a written enumeration and two derivations, plus one
      optional cheap check.

      PART 1 -- THE LADDER (B), with each rung carrying: the subgroup H, its order h, the realisability
      of its action and at what cost, the canonicalisation cost, the resulting gain, and the curve
      condition (D_0 value, congruence on p) under which it exists.

      PART 2 -- THE TWO-THRESHOLD COST ANALYSIS (C), with the per-step and per-collision accounting
      written separately and their thresholds computed: h > 6 for COST 1 and about h ~ sqrt(N)/log2(N)
      for COST 2.

      PART 3 -- THE PAYOFF CALCULATION (D): balance (1-alpha)/2 against alpha to get alpha = 1/3 and
      a total N^{1/3}. State the memory position too: the walk is still O(1) per processor plus a
      distinguished-point table, so an N^{1/3} time with O(1) memory would be a strictly better Pareto
      point than anything currently on the prime-field frontier -- which is a reason to take the rung
      seriously and also a reason to be extremely sceptical of any claimed cheap invariant.

      PART 4 -- THE GGM ARGUMENT (E), written carefully enough for lane L12 (RQ-GGMB-6eaabc) to audit:
      state the oracle class ("returns a label constant on <lambda>-orbits, computable from one encoding"),
      and either exhibit a simulator or argue none exists. THIS RECORD ARGUES NONE EXISTS AND FLAGS
      THE ARGUMENT AS REQUIRING INDEPENDENT AUDIT, because a simulability result here would close
      the rung and would be the cheapest possible way to finish the lane.

      PART 5 -- THE CANDIDATE FAILURES (F), with (F1) verified symbolically and already instantiated
      on a real curve in EV-ENDO-001.

      OPTIONAL PART 6 (minutes of compute, and it is a known-answer check rather than an experiment).
      On a toy curve, verify by direct enumeration that: the full-scalar-action quotient has exactly
      2 classes; the <lambda>-orbits for a random lambda have size ord(lambda) and partition G \ {O}
      evenly; and the orbit sum is O for every orbit. Each is a one-line prediction of the derivations
      and each is checkable in seconds with harness/toycurve.py.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - h = 1 degenerate end: gain must be exactly 1.0
  - h = N-1 degenerate end: information must be exactly zero
  - h = 2 baseline reproduction against the 0.886 convention
  - Koblitz/subfield nearby-object control: the argument must NOT bound it
  - enumerative-canon decay: gain must fall as 1/sqrt(h)
  - 'NULL OBJECT (from the proposal): MANDATORY EVEN THOUGH THIS IS A DERIVATION. THE MATCHED NULL
    IS THE LADDER ITSELF EVALUATED AT ITS OWN DEGENERATE ENDS, and the decay parameter is h. At h
    = 1 the projection loses nothing and gains nothing -- the change-of-coordinates case. At h = N-1
    it loses everything and gains nothing -- claim (A). A derivation that predicted a gain at EITHER
    end would be manufacturing an effect, so the derivation must be checked to produce gain exactly
    1.0 at h = 1 and to produce ZERO USABLE INFORMATION at h = N-1. THE DECAY REQUIREMENT: the net
    charged gain sqrt(h)/h = 1/sqrt(h) must DECAY monotonically to 0 as h grows under enumerative
    canon, and must GROW as sqrt(h) under free canon; a cost model in which the gain does not respond
    to h in opposite directions under the two canon assumptions is not modelling the canonicalisation
    cost at all, and is the canonical artifact tell for this record. SECOND NULL, for Optional Part
    6: the enumeration must recover exactly 2 classes for the full-scalar quotient and exactly (N-1)/h
    + 1 for <lambda>, on a curve where both are independently computable.'
  independent_variables: []
  metrics:
    primary:
    - class count per rung, verified by enumeration at toy size
    - orbit size and freeness per rung
    - canonicalisation cost and disambiguation cost, stated separately with their units (per step
      versus per collision)
    - the derived gain per rung, free-canon and enumerative-canon columns reported separately and
      never mixed
    secondary:
    - the curve condition (D_0, congruence on p) each rung requires
    - explicit OPEN/CLOSED status per rung, with the open one labelled R1
  heuristic_under_test: null
  preregistered_prediction:
    quantity: number of classes under the full endomorphism-action quotient
    formula: EXACTLY 2, on every prime-order instance. A single toy instance with more than 2 falsifies
      (A) and would mean the scalar image is not all of Z/N, which would contradict Z being in End(E).
    source: pre-registered in IDEA-20260807-18d2f7 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - CONFLATING THE TWO COSTS. Almost every informal treatment of "why can't we quotient by more" mixes
    the per-step canonicalisation with the per-collision disambiguation. They have thresholds separated
    by an exponent and mixing them bounds the wrong quantity. This is the record's main contribution
    and also its main way of being misread.
  - READING THE PAYOFF AS A RESULT. The N^{1/3} in (D) is conditional on an object that does not exist
    as far as this record knows. Quoting it without its prerequisite would be a serious overclaim,
    and it is flagged here, in interpretation_limits, and in the method_ceiling.
  - SCOPE CREEP TO EXTENSION FIELDS. On subfield/Koblitz curves cheap large-order maps DO exist and
    the corresponding speedups are classical (KN-LIT-042). Reading the F_p ceiling as universal would
    be wrong in a way that is easy to check and easy to miss.
  - SPURIOUS-COLLISION COUNT. The (D) balance assumes O(1) candidate collisions in a DP run. A quotient
    that generates many spurious collisions shifts alpha downward and the payoff with it.
  - 'REALISABILITY. "Choose H" is not free: applying an arbitrary scalar costs log2(N) group operations,
    so a ladder rung that ignores the cost of APPLYING the action is measuring a fiction.'
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACTLY 2, on every prime-order instance. A single toy instance with more than
    2 falsifies (A) and would mean the scalar image is not all of Z/N, which would contradict Z being
    in End(E).
  falsification_criterion:
  - A prime-order instance whose full-endomorphism quotient has more than 2 classes. (A) is false.
  - A <lambda>-orbit of size other than ord(lambda), or one fixing a nonzero point. The freeness argument
    is false and the whole ladder's class counts are wrong.
  - A counterexample to the orbit-sum identity. (F1) is false.
  - A GGM simulator for the encoding-dependent orbit-label oracle. (E) is false, the open rung is
    CLOSED, and lane L6 finishes -- which this record names as the most valuable possible refutation
    of itself.
  - An efficiently computable non-constant <lambda>-invariant on the encoding for h >> 6. (D)'s prerequisite
    is met, the ceiling of IDEA-20260807-ebcae6 is void, and the result requires independent review-breakthrough
    handling before any description (AGENTS.md rule 12).
  - The h = 2 rung failing to reproduce the 0.886 convention. The ladder's arithmetic is wrong and
    every rung is void.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
