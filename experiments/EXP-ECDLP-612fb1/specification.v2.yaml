  preregistered_prediction:
    quantity: >-
      SAME QUANTITY as v1 (rho_T(U) at fixed P, L, epsilon, a = 1/4, k = 4,
      LOWER bracket, steady-state, N in {2^24, 2^30}), now evaluated on
      T_sel_grid_v2 = {0.65T, 0.75T} and reported beside rho_ORACLE and
      rho_cum (item d), gated by G3 (item a).
    formula: >-
      RE-DERIVED, NOT COPIED FROM v1 (this field is retracted and replaced,
      per the task's explicit instruction and item b/h). v1's model
      asymptote rho_T(infinity) = 0.51 is RETRACTED: it rested on the
      coincidence C_max(1/8) = 0.2716 = p_static(a = 1/4, r = 2) with ZERO
      pre-registered margin; the batch measured C_max(1/8) to within 0.1%
      (0.271) but measured p_static = 0.289, not 0.27, so the equality the
      0.51 asymptote depended on fails, and by disjointness (F-J3-1) the
      exact top-T/2 basin share is BELOW STATIC(T)'s exact coverage in
      10/10 exactly enumerated seeds at a = 1/4 (2^20 and 2^24) -- the
      pre-registered T_sel = T/2 claim was infeasible on this instrument
      before any re-selection ran. THE RE-DERIVED QUANTITY replacing 0.51
      is rho_ORACLE(a = 1/4, r = 2), read DIRECTLY off the exact basins
      rather than from a closed-form coincidence: measured rho_ORACLE(8T)
      = 0.553 [per-seed 0.50-0.59] at 2^24 and 0.541 at 2^20 (from
      EV-ECDLP-60e266 / results/j3_oracle_floor.json); this is now
      understood as a FLOOR the LOWER bracket cannot cross (never an
      asymptote it is predicted to reach), and the batch's own measured
      rho_T(8T) = 0.654 (2^24) / 0.688 (2^30), rho_T(16T) = 0.619 / 0.632
      sit strictly above it with CIs excluding 1.0 and closing 66-90% of
      the STATIC(T_sel)->ORACLE(T_sel) gap by 16T (F-J3-6). PREDICTIONS AT
      THE V2 GRID (informed extrapolation from v1's own measured points,
      explicitly flagged UNVERIFIED and not re-derived from a closed form):
      (i) G3 is predicted to PASS at both T_sel = 0.65T and T_sel = 0.75T
      at a = 1/4, r = 2 (unlike at T_sel = T/2, where it failed 10/10),
      because both grid points exceed rho_ORACLE*T (about 0.55T), so the
      T/2-cell infeasibility does not automatically transfer to this grid;
      this prediction is the FIRST thing STAGE 1v2/2v2 tests and may fail.
      (ii) At T_sel = 0.65T (just below the measured crossing 0.654), S1_v2
      is predicted to be BORDERLINE: eps_ss(RESEL-L(0.65T), 8T) close to
      but not above STATIC(T)'s eps_ss, difference near zero with a CI that
      may or may not exclude zero. (iii) At T_sel = 0.75T (= 3T/4, a point
      v1 already measured: eps_ss(8T) = 0.772 at 2^24 against STATIC(T)'s
      0.7395, red team j3_frontier.json), S1_v2 is predicted to be MET
      (RESEL-L(0.75T) exceeding STATIC(T)), replicating that sign under the
      v2 protocol's stricter (relative-tolerance, non-vacuity-guarded)
      criterion; this v2 run is a fresh measurement under the amended
      criteria, not a re-read of the v1 run at 3T/4. (iv) rho_T(8T) and
      rho_T(16T), recomputed by interpolation on the two-point
      T_sel_grid_v2, are predicted to replicate v1's own values (0.654-
      0.688 at 8T, 0.619-0.632 at 16T) within CI, since the grid brackets
      them; at U = 4T, where v1's own rho_T(4T) (0.776-0.780) lies ABOVE
