    Advisory per docs/research-budget-policy.md; research spending is not
    rationed by default (CLAUDE.md "Research budgets: progress first").
    Sized proportionally to v1's own accounting, not to any external
    ceiling: STAGE 0 (a-scan) is 12 a-values x 3 r-values x 5 seeds of
    exact-basin work at N = 2^20 -- v1's own Stage G (10 seed-cells at
    2^20) used well under a minute of its 3600 s/run budget in total, so
    Stage 0's larger grid at the SAME N is still seconds-to-minutes,
    batched as about 5 runs (one per seed, sweeping the whole a x r grid
    internally, mirroring how v1's Stage G batched one run per (a, seed)).
    STAGE 1v2 (N = 2^24, 5 seeds, one run per seed covering both T_sel in
    the v2 grid plus STATIC/RHO/ORACLE/NULL-A/CAP) is the same size per run
