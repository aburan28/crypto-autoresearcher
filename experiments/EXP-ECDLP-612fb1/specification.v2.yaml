  objective: >-
    UNCHANGED IN METHOD, REFRAMED IN GATING (see `field_provenance`). Measure,
    on the same generic keyed-random-function instrument and the same toy
    curve as v1, the advice ratio rho_T(U) = T_resel(U)/T at fixed
    (P, L, epsilon) for the LOWER-bracket re-selected table against the
    static Bernstein-Lange table -- but now: (0) preceded by a cheap a-scan
    of the exact-basin ceiling (item h) to place the tested cell honestly
    before any re-selected arm is run; (1) gated at every (a, r, T_sel) cell
    by the G3 ceiling-feasibility test before S1/F1 are interpreted (item a),
    since v1's own batch showed the pre-registered T_sel = T/2 cell was
    infeasible by disjointness before any re-selection ran; (2) scored by a
    non-vacuous, relatively-toleranced S1 and a one-sided S2 (items b, c);
    (3) reported as a frontier tuple that charges working storage rather
    than a bare advice ratio (item d); (4) modeled by a corrected
    HEUR-BLT-7 (item e) under a pool-admission rule that keeps CAP(c)
    honest to its own name (item f); (5) protected by a permanent negative
    fixture in the analysis pipeline (item g). Every other control,
    definition and instrument choice of v1 is retained (see
    `field_provenance.unchanged`).

  definitions: # v1 definitions retained verbatim below; new terms appended (additive, per field_provenance)
    N: order of the group (or size of the set for the generic instrument)
    T: nominal table size N^{1/3} rounded, i.e. 64 at 2^20, 256 at 2^24, 1024 at 2^30
    T_sel: number of entries STORED (the advice); T_sel in {T/4, T/2, 3T/4, T} (general grid; superseded for the v2 run stage, see T_sel_grid_v2)
    W: expected walk length between DPs, W = sqrt(a N / T); theta = 1/W
    a: T W^2 / N in {1/4 (headline, W = (1/2) sqrt(N/T)), 1/2}
    r: >-
      precomputation pool ratio, the number of DISTINCT distinguished points
      in the pool divided by T, generation continuing until r T distinct DPs
      are found with EVERY generating walk charged to P and every walk's
      (length, +1) credited to its DP -- the paper's procedure (its Section 4
      figure 1.24 (lT)^{1/2} at N = 2T is reproduced only under this reading)
    P: precomputation cost, the sum of all generation walk lengths in group operations, capped walks charged at the cap
    k: online walks per target, k = 4, each from an independent uniform restart, stop at first hit
    cap: 8W steps per walk (paper); a capped walk is a miss, charged 8W, and contributes no DP
    U: number of targets processed; up to 16T
    R: round length in targets; re-selection happens after every R targets; R = T default
    L: online group operations per target, walk steps only; restart scalar multiplications and lookups counted separately
    epsilon: per-target success probability within the k-walk budget
    weight: published Bernstein-Lange weight S_d + 4 W h_d (S_d total length of walks credited to d, h_d their count)
    p_arm: single-walk hit rate of an arm's current table (hits / walks in a window)
    eps_ss: steady-state per-target success measured over the targets of the last two rounds before U
    eps_cum: cumulative (batch-average) per-target success over the first U targets
    gain: eps_ss of an arm minus eps_ss of the STATIC arm at the same T_sel
    T_resel(U): >-
      smallest T_sel at which the LOWER-bracket re-selected arm's eps_ss(U)
      equals eps_ss of STATIC at T_sel = T, by log-linear interpolation on
      the T_sel grid; rho_T(U) = T_resel(U) / T
    S: advice size in bits, T_sel times bits per entry (frozen below)
    S_peak: peak working storage in bits, max pool entries times pool bits per entry
    LOWER bracket: >-
      THE ALGORITHM: only walks of SOLVED targets enter the pool (with known logarithm)
    UPPER bracket: >-
      DIAGNOSTIC ONLY, generic arm only: every online walk enters the pool
      as if solvable; not an algorithm; bounds the LOWER-bracket loss
    # -- new terms, additive (field_provenance.changed.definitions) --
    T_sel_grid_v2: >-
      {0.65T, 0.75T}. The T_sel grid actually run and interpreted by v2's
      replication stage (STAGE 1v2/2v2 below), chosen because it brackets
      the measured crossing rho_T(8T) = 0.654 (2^24) / 0.688 (2^30) from
      EV-ECDLP-60e266, per DEC-20260906-1f5b71's next_actions RANK 1 grid
      ("T_sel in {0.65T, 0.75T} (the measured rho_T neighbourhood)"). It
      supersedes {T/4, T/2, 3T/4, T} as the INTERPRETED grid for this
      batch only; the general grid remains T_resel(U)'s definitional
      interpolation domain (item h note; see the retained T_sel line above).
    rho_ORACLE(a, T_sel, U): >-
      T_sel/T at which the exact-basin ceiling arm ORACLE(T_sel)'s eps_ss(U)
      (or, at N <= 2^24, its exact top-T_sel basin share) equals STATIC(T)'s
      eps_ss(U) (exact coverage), by the same log-linear interpolation rule
      as T_resel(U)/rho_T(U). This is the FLOOR no LOWER-bracket selection
      rule can cross on this instrument (disjointness; F-J3-1). Reported
      beside rho_T(U) on every exact cell (item d).
    admitted-walk count (item e): >-
      the MEASURED number of online walks actually admitted to the pool by
      solved targets through U targets -- i.e. the sum, over solved
      targets, of the number of walks each one used before its first hit
      (mean measured 1.7 at U = 8T, 2^24, RUN-013 heur_blt7_regression) --
      as opposed to the contract's prior formula's assumption of k = 4
      walks admitted per solved target.
    r_eff (corrected, item e): >-
      r + (admitted-walk count) / T, replacing v1's r_eff = r + U k p_s / T.
      The two agree only if every solved target uses exactly k walks before
      its first hit, which is false by construction (a target stops at its
      FIRST hit, using on average about 1.7 of its up-to-k=4 restarts at the
      tested cells); v1's formula overcounts admitted evidence by about
      1.7x (F-J3-4).
    ceiling-feasibility (G3, item a): >-
      the exact-basin (or, at N = 2^30, sampled-ORACLE) test that a
      T_sel-entry table's coverage CAN exceed a same-pool STATIC(T)
      table's coverage on this instrument, evaluated BEFORE any RESEL-L(T_sel)
      arm's S1/F1 outcome is interpreted at that (a, r, T_sel) cell.
    UNTESTABLE (item a): >-
      the outcome recorded when G3 fails at a cell: S1/F1 are neither MET
      nor NOT MET there, only "the pre-registered claim's premise did not
      hold on this instrument at this cell" -- an invalidation-adjacent
      outcome, never scored as a negative result (mirrors AGENTS.md rule 5
      for infrastructure failures, applied here to a ceiling failure of the
      claim's premise rather than of the run).
    non-vacuity guard (item b): >-
      the pre-condition that STATIC(T)'s own dynamic range on the tested
      cell is large enough for an "S1 met" verdict to carry information:
      STATIC(T) eps_ss(U) >= 0.5 AND STATIC(T) eps_ss(U) is CI-separated
      above RHO's eps_ss(U) (no table, same k, W, cap) by at least 0.30.
      Introduced because S1's absolute tolerance passed vacuously on a
      keyed bijection where every table sat at 3-5% success (F-J4-1).
    permanent negative fixture (item g): >-
      the two red-team bijection-walk seeds (affine-xorshift and numpy
      permutation, keyed, N = 2^20) at
      coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-90e7cf/src/pipeline_perm
      and
      coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-90e7cf/results/j4_perm/,
      retained as a REQUIRED regression object: any v2 analysis run must
      score G1 FAIL on both (never crash, never pass) before its G1 verdict
      on the real object may be trusted (item g).

  instrument: # unchanged in substance (field_provenance); charging note appended
    generic_walk: >-
      f(x) = mix64(x XOR K) mod N with mix64 a fixed 64-bit mixer (e.g.
      splitmix64 finaliser) and K the walk-key seed; DP predicate
      hash64(x) < floor(2^64 / W) with an independent key so W need not be
      an integer; "hit" = the terminal DP is in the current table; nothing
      is certified (certificate kind: none) and the arm may not be quoted as
      solving logarithms.
    curve_walk: >-
      Toy prime-order short-Weierstrass curve E/F_p, p about 2^24, #E = N
      prime, found by search over small (a, b) with point counting and
      recorded as curve_id TOY-P24-<hash> with (p, a, b, N, P); r-adding
      walk f(X) = X + M_{j(X)}, j(X) = hash(x(X)) mod 32, M_j = [m_j]P with
      seeded known m_j, independent of every target (the Bernstein-Lange /
      Hitchcock interlude requirement); DP predicate on hash(x(X)) as above;
      online start Q_u + [c]P; a hit at d with accumulated scalar s gives
      k_u = log d - c - s mod N; pool entries from a solved target's walks
      get log d' = k_u + c' + s'.
    certificates: >-
      Curve arm only. Every solved target emits certificate kind
      discrete_log with (curve_id, P, Q_u, k_u), re-verified by the run
      wrapper with an INDEPENDENT scalar multiplication [k_u]P == Q_u not
      sharing code with the walk, AND checked against the seeded logarithm
      x_u (read only by the checker). Either check failing makes the run
      completed_invalid (docs/claims-and-verification.md).
    bits_per_entry_frozen: >-
      Table entry: 2 ceil(log2 N) bits (point identifier plus logarithm; the
      generic arm stores a placeholder logarithm of the same width so S is
      comparable across arms). Pool entry: table entry plus 32 bits (S_d)
      plus 16 bits (h_d). Frozen here; reported per arm as S and S_peak.
    charging: >-
      UNCHANGED UNIT (group operations, restarts, lookups, re-selection
      integer operations, certificate operations counted separately as in
      v1). AMENDED TIMING (item f): re-selection integer operations are
      charged as each admitted walk is compared against the current cap
      threshold, i.e. per admission, not once at round end against the
      whole batch of that round's admissions; this is the same charging
      RULE the pool-admission algorithmic change below requires, not a new
      unit.
    pool_admission_v2: >-
      NEW, item (f). v1's CAP(c) applied the cap AFTER a round's full batch
      of admissions was merged into the pool, so CAP(2T)'s measured S_peak
      reached 2.6-2.8 T at the tested cells (red team F-J3-2), not 2T as its
      name implies. v2's CAP(c) applies the cap PER ADMITTED TARGET: as each
      solved target's walks are admitted (in the LOWER bracket's existing
      admission order, i.e. one solved target's full set of used walks at a
      time), the pool is immediately truncated back to its top-c entries by
      the published weight before the next target's walks are admitted, so
      the pool's entry count never exceeds c at any point within a round,
      not only at round boundaries. UNCAPPED and STATIC/STATIC2T pool
      construction are unaffected. This changes the pool CONTENTS at CAP(c)
      cells relative to v1 (slightly more truncation happens mid-round), so
      v2's CAP(c) cells are a genuinely new measurement, not a re-read of
      v1's CAP(c) runs.

  inputs:
    stage_plan: >-
      STAGE 0 (NEW, item h -- the a-scan, run FIRST, before any other stage):
      generic instrument, N = 2^20 only, exact basins; a_scan_grid =
      {1/16, 1/8, 3/16, 1/4, 5/16, 3/8, 7/16, 1/2, 5/8, 3/4, 7/8, 1} (12
      points; the two contract cells 1/4 and 1/2 are included for
      continuity with v1), r in {2, 4, 8}, 5 seeds. For every (a, r, seed)
      cell: exact top-T_sel basin share for T_sel in {T/4, T/2, 3T/4, T,
      0.65T, 0.75T} and STATIC(T)_r exact coverage, giving rho_ORACLE(a, r,
      T_sel) at every grid point by the same interpolation rule as rho_T.
