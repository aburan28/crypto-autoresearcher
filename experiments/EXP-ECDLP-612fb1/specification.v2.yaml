    max wall time of 85.8 s), so 5 runs. STAGE 2v2 (N = 2^30, 5 seeds) same
    shape as v1's Stage 2, 5 runs. STAGE 4v2 (analysis, including the
    permanent-negative-fixture regression check) is 1-2 runs, matching v1's
    own RUN-037-scale analysis cost. Total: about 5 (Stage 0) + 5 (Stage
    1v2) + 5 (Stage 2v2) + 2 (Stage 4v2) = 17 runs, with 3 spare for
    recorded infrastructure re-runs, i.e. maximum_runs 20; total_cpu_hours 4
    is generously above v1's ACTUAL usage of 0.14 of its 12-hour ceiling for
    a grid of comparable size run at N <= 2^30. These are advisory estimates
    only and require no repeated approval to revise upward if the actual
