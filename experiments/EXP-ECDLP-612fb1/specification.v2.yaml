  stopping_rules: # v1's seven rules retained verbatim; no rule removed
    - "G1 at 2^20 is computed and reported before Stage 1v2 is interpreted; if the top-T share exceeds C_max(a) by more than 5% or falls below 85% of it, the model comparison is suspended and all later cells are reported as measurements only."
    - "G2 at each N in {2^24, 2^30} is evaluated first at that N; on failure that N's cells are run only if budget remains and are recorded as invalid-for-interpretation."
    - "Any exceedance of an exact top-T_sel share by any table's exact coverage stops the run as completed_invalid (implementation error)."
    - "Any round-0 mismatch between a re-selected arm and its STATIC twin stops the run as completed_invalid."
    - "Any certificate failure on the curve arm stops that run as completed_invalid (not applicable this batch: Stage 3 is not re-run)."
    - "Stop at maximum_runs or total_cpu_hours, whichever binds first; a cell not reached is reported as not run, never as a negative."
    - "Wall clock per run at 3600 s; a run that exceeds it is failed_infrastructure and is re-planned with a smaller shard, never interpreted."
    - "NEW: G3 is computed and reported at every (a, r, T_sel) cell before that cell's RESEL-L S1/F1 outcome is interpreted (item a)."
    - "NEW: STAGE 4v2's analysis run must pass the permanent-negative-fixture G1 regression check (item g) before any G1 verdict on a real cell is reported as trustworthy."

  invalidation_rules: # v1's ten rules retained verbatim; new rules appended (items a, g)
    - "Execution while status is not approved or execution_authorized is false: no run under this contract is evidence."
    - "A timeout, crash, memory exhaustion or dependency failure is failed_infrastructure and is NEVER negative mathematical evidence (AGENTS.md rule 5)."
    - "Gate G2 failure at an N invalidates that N's run set as not comparable to the paper; it is not a negative result."
    - "NULL-B or PHI(0) differing from STATIC bit-for-bit, or round-0 non-identity: bookkeeping leak; invalid."
    - "NULL-A gain CI-separated above zero and at least half of the RESEL-L gain: artifact; the run set is invalid, not evidence (retained as the operative artifact test per S2_v2, item c)."
    - "Any exact coverage above the exact global top-T_sel share: invalid (impossible by disjointness)."
    - "Duplicated or missing seeds, a manifest missing command, commit, dirty-tree state, environment, requested policy or resolved model, or raw/summary disagreement: invalid."
    - "Any solved logarithm on the curve arm without a verified: true certificate, or any certificate failing independent re-verification or the seeded-log check: completed_invalid (not applicable this batch: Stage 3 is not re-run)."
    - "Reading the seeded logarithm anywhere in the solver path: invalid."
    - "Any post-hoc change to the T_sel grid, the U grid, the tolerances of G1/G2, the success margin or the pre-registered prediction beyond what THIS versioned amendment states: requires a further versioned protocol_amendment; runs already executed are never re-scored."
    - "NEW (item a): G3 FAIL at a cell -- exact top-T_sel share below STATIC(T) exact coverage (or ORACLE(T_sel) eps_ss below STATIC(T) eps_ss) in more than 1 of 5 seeds -- makes S1/F1 UNTESTABLE at that (a, r, T_sel): report the measurement, the exact gap per seed, and state explicitly that neither S1 nor F1 fires there. This is NOT a negative result and NOT the same as invalid_run_set: the run set is fully valid, its premise is ceiling-infeasible."
    - "NEW (item g): fit_cutoff returning None during G1 aggregation must be scored as G1 FAILED by the analysis code, never raise an exception; an exception there is a STOPPING CONDITION for STAGE 4v2 (analysis code defect), not a report of any G1 verdict."
    - "NEW (item g): a G1 PASS verdict (or a silent crash instead of FAIL) on either permanent-negative-fixture seed set invalidates STAGE 4v2's entire G1 pipeline for this batch until repaired; no G1 verdict on a real cell from that run of the analysis code may be reported as trustworthy."

  success_criterion: >-
    STAGE 0 (item h) reports the a-scan and the ordering control FIRST and
    gates nothing itself (informational; feeds the amendment record's
    `discharges` for item h and the re-derived `preregistered_prediction`
    above). AT EACH (a = 1/4, r = 2, T_sel) CELL IN T_sel_grid_v2, AT BOTH
    N in {2^24, 2^30}: FIRST evaluate G3 (item a). If G3 FAILS (>1 of 5
    seeds below the ceiling): S1/F1 are UNTESTABLE at that cell; report the
    measurement and STOP interpreting that cell for S1/F1 (proceed to the
    next T_sel or N). If G3 PASSES: evaluate the NON-VACUITY GUARD (item
    b) -- STATIC(T) eps_ss(U) >= 0.5 AND CI-separated above RHO's eps_ss(U)
    by >= 0.30. If the guard FAILS: S1 is NOT EVALUABLE on this cell
    (report only; this is expected to hold trivially on the real object,
    per the measured STATIC(T)-RHO gap of about 0.73 at 2^24, and exists to
    exclude vacuous objects like the bijection fixtures). If the guard
    HOLDS: S1_v2 is MET iff the 95% CI (stratified-by-seed BCa bootstrap)
    of [eps_ss(RESEL-L(T_sel), U) - eps_ss(STATIC(T), U)] has upper bound
    >= 0 and point estimate >= -tol, where tol = 0.05 * (eps_ss(STATIC(T),
    U) - eps_ss(RHO, U)) [RELATIVE, replacing v1's absolute 0.03], AND
    rho_T(U)'s 95% CI excludes 1.0 AND lies within T_sel_grid_v2 without
    requiring extrapolation beyond it (UNCENSORED; if the crossing point
    the CI implies lies outside {0.65T, 0.75T}, rho_T(U) is reported as
    censored and S1_v2 is NOT EVALUABLE at that U, an honest outcome per
    the re-derived prediction's item (iv) above). U_ss and U* crossing
    margins are likewise 0.05 * (the same gap), replacing v1's absolute
    0.02; U* may be reported "unreachable within tested U" and this is a
    valid, complete value, never an omission (item d). S2_v2 (ONE-SIDED,
    item c, replaces v1's S2): MET iff, at every round, NULL-A(T_sel)'s
    gain (i) is NOT CI-separated above zero, AND (ii) has point-estimate
    magnitude <= 0.5 x RESEL-L(T_sel)'s gain point estimate at the same
    round; the null's own perturbation magnitude (|gain(NULL-A)| relative
    to STATIC(T_sel)'s own eps_ss) is recorded alongside for scale, per the
    v1 batch's own finding that this null's perturbation (0.11-0.22) was
    2-3x the effect size (0.064-0.076), never "slightly below". NULL-B and
    PHI(0) bit-identity to STATIC (unchanged, boolean, MET iff true in
    every round of every generic run). S3-S6 (mechanism clauses, PHI decay,
    r-shrinkage, UPPER-LOWER gap): UNCHANGED FROM v1, verbatim, evaluated
    on whatever T_sel/N cells this batch's budget reaches (informational
    where the v2 grid does not exactly match v1's S3/S5/S6 cells; v1's own
    S3, S4, S5, S6 results already stand as toy-scale support for the
    mechanism clauses and are not required to be re-measured to hold).
    OVERALL: EFFECT (S1_v2 MET at >= 1 of the two T_sel_grid_v2 points, at
    both N, with the non-vacuity guard holding and G3 passing there) AND
    MECHANISM (S3, S5, S6 from v1 standing, or re-confirmed if re-measured)
    -> the effect and mechanism clauses of H-ECDLP-37dc01 are supported at
    toy scale on the tested grid, reported ALWAYS as the frontier tuple
    (item d), never as a bare "T_sel reaches T" headline (interpretation
    bullet appended below). G3 FAIL at every T_sel in the v2 grid -> the
    T/2-cell infeasibility EV-ECDLP-60e266 measured extends to this grid
    too; report as such and route the finding to the Coordinator exactly
    as DEC-20260906-1f5b71 did for T_sel = T/2 -- no further T_sel is tried
    by this contract without a further amendment naming a new grid.

  falsification_criterion: >-
    F1_v2: at U = 16T, at a cell where G3 PASSES and the non-vacuity guard
    HOLDS, RESEL-L(T_sel) remains CI-separated below STATIC(T) (95% CI
    upper bound of the difference < 0) at both generic N with G2 passed
    and S2_v2 clean: rho_T(16T) > 0.85 with CI (unchanged threshold; ONLY
    evaluated where G3 passes -- a G3-FAILED cell can neither meet nor
    falsify F1, it is UNTESTABLE, per item a). F2 -- NULL-A reproduces at
    least half of the re-selected gain WITH a CI-separated-above-zero
    reading (the S2_v2 one-sided artifact test, item c): ARTIFACT, invalid,
    not a negative (unchanged from v1's F2 in substance; restated to match
    S2_v2's one-sided form). F3 -- the phi decay is non-monotone beyond CI:
    artifact, invalid (unchanged). F4 -- exceedance of the exact oracle
    share: implementation error, invalid; exceedance of 0.42 at 2^30 with
    the exact tell holding at 2^24: model contradiction routed to review,
    never promoted on Executor authority (unchanged). F5 -- gain does not
    decrease with r or gain(8) > 0.03 with the effect present: the
    MECHANISM clause is falsified (unchanged; evaluated on whatever cells
    are re-measured, or stands on v1's own S5 result if not re-measured).
    F6_v2 (REPLACES v1's F6, item h second half, quoting and retiring v1's
    (C6) per the amendment record's `discharges`): the a-scan ordering
    control is falsified if rho_ORACLE(a = 1/4, r) is measured >=
    rho_ORACLE(a = 1/2, r) at any r in {2, 4, 8}, with CI, at any N in the
    a-scan or STAGE 1v2/1 grid: the basin model's ordering prediction is
    inverted, and the observation is routed to H-ECDLP-3550b8's review
    exactly as v1's F6 routed its firing. Any G3 FAIL, any gate failure
    (G1/G2), or any non-vacuity-guard failure is UNTESTABLE / INVALID,
    never negative, and is reported as such rather than as F1_v2 or F6_v2
    firing.

