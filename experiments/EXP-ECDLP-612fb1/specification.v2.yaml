  title: >-
    THE BATCH-RESELECTED FIXED-SIZE TABLE, MEASURED (v2 amendment): does a
    re-selected table at T_sel in {0.65T, 0.75T} -- bracketing the
    ceiling-feasible neighbourhood of the measured crossing rho_T(8T) =
    0.654-0.688 -- reach the static T-entry table's per-target success at
    equal precomputation, equal walk budget and equal bits per entry,
    NOW GATED by an exact-basin ceiling-feasibility test before
    interpretation, with a non-vacuous, relatively-toleranced success
    criterion, a one-sided null test, a frontier-tuple headline that
    charges working storage, a corrected batch-pool-equivalence heuristic,
    a per-admission pool cap, and a permanent negative fixture guarding the
    analysis pipeline -- preceded by a cheap a-scan of the ceiling itself

