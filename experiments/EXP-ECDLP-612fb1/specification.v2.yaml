    - "The single largest exceedance (if any) of a re-selected table's hit rate over the exact top-T_sel share, reported with the round and seed (must be zero or negative)."
    - "The capped-walk fraction and the cycle mass per cell; a cell with capped fraction above 0.01 is flagged and its L re-reported with capped walks charged at the cap."
    - "The seed with the smallest steady-state gain of RESEL-L(T_sel) at U = 8T for each T_sel in T_sel_grid_v2, reported beside the pooled value."
    - "Curve arm: not re-run by this amendment; v1's certificate result is cited only."
    - "The a = 1/2 differential, reported per seed as a diagnostic (superseded as the discriminating test by the a-scan ordering control, item h)."
    - "NEW (item g): the two permanent-negative-fixture seeds' G1 output on every STAGE 4v2 analysis run: must read FAIL, never PASS, never a crash."
    - "NEW (item a): every G3 UNTESTABLE cell reported individually with its exact top-T_sel share minus STATIC(T) exact coverage, per seed."

  replication: # unchanged
