  interpretation: # v1's four bullets retained verbatim, plus one new bullet
    - >-
      Every conclusion this contract can license is claim_tier toy and is a
      CONSTANT-FACTOR statement under the generic S T^2 ceiling
      (KN-LIT-013); it moves no exponent and names no non-generic
      structure. It is scoped to the tested curves (one toy curve), the
      generic instrument, the parameters above, this solver and this
      budget; transfer to other N is an assumption to be stated in the
      evidence record.
    - >-
      The reduction is in ADVICE at fixed (P, L, epsilon) for a batch of U
      uniform targets and is bought with working storage during the batch;
      the CAPPED arms are the frontier-honest points on the
      (P, S, L, epsilon, U) frontier and S_peak is reported beside T on
      every cell (RQ-ECDLP-78dbc5 definition of fewer_DP).
    - >-
      IDEA-20260906-a3d6ae (growth with relation accounting) is the
      frontier comparator and is predicted to dominate this mechanism on
      per-target L at equal S_peak; it is cited, not designed, here.
    - >-
      The generic arm solves nothing and certifies nothing; only curve-arm
      cells may be quoted as solved logarithms (not applicable this batch:
      Stage 3 is not re-run).
    - >-
      NEW (items a, d): under RQ-ECDLP-78dbc5's fewer_DP definition, EV-
      ECDLP-60e266 already establishes that "T_sel reaches T" is not a
      licensable headline on its own even where S1_v2 is MET: the frontier
      tuple (item d) -- in particular S_peak/T -- must be quoted in the
      same sentence as any advice-ratio number, and a G3 PASS at a cell
      does not by itself mean the re-selected table stores fewer entries
      than STATIC(T) at the online site once working storage is charged.
      This bullet supersedes no measurement; it states the reporting
      discipline the v1 batch's own outcome (EV-ECDLP-60e266 `inference`)
      already required and enforces it prospectively for v2.

