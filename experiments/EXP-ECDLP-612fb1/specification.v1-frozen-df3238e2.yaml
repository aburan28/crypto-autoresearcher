  title: >-
    THE BATCH-RESELECTED FIXED-SIZE TABLE, MEASURED: does a table of T/2
    stored distinguished points, re-selected between rounds from the
    batch's own solved walks by the published Bernstein-Lange weight, reach
    the static T-entry table's per-target success at equal precomputation,
    equal walk budget and equal bits per entry by a batch of 8T targets --
    with its own basin-law gate, its own primary-source reproduction gate,
    relabelled-evidence and frozen-table nulls, a phi decay, the r-shrinkage
    tell and the exact-oracle ceiling as controls, and a certified curve
    arm

  objective: >-
    Measure, on a generic keyed-random-function instrument at N in
    {2^20, 2^24, 2^30} and on one toy prime-order curve at N about 2^24, the
    advice ratio rho_T(U) = T_resel(U)/T at fixed (P, L, epsilon) for the
    LOWER-bracket re-selected table of IDEA-20260906-ee3543 against the
    static Bernstein-Lange table built from the same pool, together with
    every control that could make the ratio misleading: the same-pool
    static tables at T_sel and 2T, rho with no table, a relabelled-evidence
    null, a frozen-table null, a phi decay of admitted solved walks, the
    r-shrinkage structural tell, the exact-oracle hit-rate ceiling at small
    N, the UPPER-bracket diagnostic, capped-pool arms with S_peak, the
    early-batch penalty and break-even, a basin-law gate at 2^20, and a
    reproduction gate against Bernstein-Lange's published 1.79 (l/T)^{1/2}.
    Every quantity is counted in group operations and bits, never in wall
    clock. This contract is self-sufficient (its gates are its own) and
    cites EXP-ECDLP-869870 as the full instrument whose validation it does
    not depend on.

  definitions:
    N: order of the group (or size of the set for the generic instrument)
    T: nominal table size N^{1/3} rounded, i.e. 64 at 2^20, 256 at 2^24, 1024 at 2^30
    T_sel: number of entries STORED (the advice); T_sel in {T/4, T/2, 3T/4, T}
    W: expected walk length between DPs, W = sqrt(a N / T); theta = 1/W
    a: T W^2 / N in {1/4 (headline, W = (1/2) sqrt(N/T)), 1/2}
    r: >-
      precomputation pool ratio, the number of DISTINCT distinguished points
      in the pool divided by T, generation continuing until r T distinct DPs
      are found with EVERY generating walk charged to P and every walk's
      (length, +1) credited to its DP -- the paper's procedure (its Section 4
      figure 1.24 (lT)^{1/2} at N = 2T is reproduced only under this reading)
    P: precomputation cost, the sum of all generation walk lengths in group operations, capped walks charged at the cap
    k: online walks per target, k = 4, each from an independent uniform restart, stop at first hit
    cap: 8W steps per walk (paper); a capped walk is a miss, charged 8W, and contributes no DP
    U: number of targets processed; up to 16T
    R: round length in targets; re-selection happens after every R targets; R = T default
    L: online group operations per target, walk steps only; restart scalar multiplications and lookups counted separately
    epsilon: per-target success probability within the k-walk budget
    weight: published Bernstein-Lange weight S_d + 4 W h_d (S_d total length of walks credited to d, h_d their count)
    p_arm: single-walk hit rate of an arm's current table (hits / walks in a window)
    eps_ss: steady-state per-target success measured over the targets of the last two rounds before U
    eps_cum: cumulative (batch-average) per-target success over the first U targets
    gain: eps_ss of an arm minus eps_ss of the STATIC arm at the same T_sel
    T_resel(U): >-
      smallest T_sel at which the LOWER-bracket re-selected arm's eps_ss(U)
      equals eps_ss of STATIC at T_sel = T, by log-linear interpolation on
      the T_sel grid; rho_T(U) = T_resel(U) / T
    S: advice size in bits, T_sel times bits per entry (frozen below)
    S_peak: peak working storage in bits, max pool entries times pool bits per entry
    LOWER bracket: >-
      THE ALGORITHM: only walks of SOLVED targets enter the pool (with known logarithm)
    UPPER bracket: >-
      DIAGNOSTIC ONLY, generic arm only: every online walk enters the pool
      as if solvable; not an algorithm; bounds the LOWER-bracket loss

  instrument:
    generic_walk: >-
      f(x) = mix64(x XOR K) mod N with mix64 a fixed 64-bit mixer (e.g.
      splitmix64 finaliser) and K the walk-key seed; DP predicate
      hash64(x) < floor(2^64 / W) with an independent key so W need not be
      an integer; "hit" = the terminal DP is in the current table; nothing
      is certified (certificate kind: none) and the arm may not be quoted as
      solving logarithms.
    curve_walk: >-
      Toy prime-order short-Weierstrass curve E/F_p, p about 2^24, #E = N
      prime, found by search over small (a, b) with point counting and
      recorded as curve_id TOY-P24-<hash> with (p, a, b, N, P); r-adding
      walk f(X) = X + M_{j(X)}, j(X) = hash(x(X)) mod 32, M_j = [m_j]P with
      seeded known m_j, independent of every target (the Bernstein-Lange /
      Hitchcock interlude requirement); DP predicate on hash(x(X)) as above;
      online start Q_u + [c]P; a hit at d with accumulated scalar s gives
      k_u = log d - c - s mod N; pool entries from a solved target's walks
      get log d' = k_u + c' + s'.
    certificates: >-
      Curve arm only. Every solved target emits certificate kind
      discrete_log with (curve_id, P, Q_u, k_u), re-verified by the run
      wrapper with an INDEPENDENT scalar multiplication [k_u]P == Q_u not
      sharing code with the walk, AND checked against the seeded logarithm
      x_u (read only by the checker). Either check failing makes the run
      completed_invalid (docs/claims-and-verification.md).
    bits_per_entry_frozen: >-
      Table entry: 2 ceil(log2 N) bits (point identifier plus logarithm; the
      generic arm stores a placeholder logarithm of the same width so S is
      comparable across arms). Pool entry: table entry plus 32 bits (S_d)
      plus 16 bits (h_d). Frozen here; reported per arm as S and S_peak.
    charging: >-
      Group operations: one per walk step (generic: one mixer application;
      curve: one point addition). Counted separately: restart scalar
      multiplications (one per online walk, cost 1.5 ceil(log2 N) group
      operations each, reported as a count and as operations), table
      lookups (count), re-selection integer operations (one comparison or
      move = one operation; the sort or partial selection per round),
      certificate scalar multiplications (curve arm). Wall clock is
      recorded in the manifest and is never a decision variable.

  inputs:
    stage_plan: >-
      STAGE G (gates, generic, N = 2^20, a in {1/4, 1/2}, 5 seeds): exact
      basins by enumeration; basin-law gate G1; the fixture computed and
      REPORTED (not gated) at this theta; all arms at U = 16T (cheap; exact
      coverage of every table each round). STAGE 1 (generic, N = 2^24, a in
      {1/4, 1/2}, 5 seeds): exact basins; all arms; fixture gate G2; the
      HEUR-BLT-7 regression. STAGE 2 (generic, N = 2^30, a in {1/4, 1/2},
      5 seeds): sampled only; headline arms; fixture gate G2. STAGE 3
      (curve, N about 2^24, a = 1/4, 3 seeds): curve search run, then the
      certified arms. STAGE 4: analysis run producing the CI tables. The
      order is binding: G1 before Stage 1 is interpreted, G2 at each N
      before that N's arms are interpreted.
    arms: >-
      ARM STATIC(T_sel): top-T_sel of the r = 2 pool by the published
      weight, frozen; T_sel in {T/4, T/2, 3T/4, T}. ARM STATIC2T: the whole
      r = 2 pool stored (2T entries, equal P; the "does re-selected T match
      static 2T" comparator). ARM RHO: no table; per-target k walks with
      DPs, a hit = collision among the target's own walks; same budget.
      ARM RESEL-L(T_sel): LOWER bracket re-selected, uncapped pool. ARM
      RESEL-U(T_sel in {T, T/2}): UPPER bracket, generic only. ARM NULL-A
      (T_sel in {T, T/2}): as RESEL-L but every batch evidence increment
      (length, +1), whether a hit on a table entry or a solved walk's
      terminal DP, is credited to a uniformly random existing pool entry
      instead of the true one; solved walks' new DPs enter the pool with
      their true logarithm and ZERO evidence. ARM NULL-B (T_sel in {T,
      T/2}): pool bookkeeping runs exactly as RESEL-L but the table is never
      re-selected (must equal STATIC bit-for-bit under the same seeds). ARM
      PHI(phi in {0, 0.1, 0.25, 0.5, 1}, T_sel = T/2): as RESEL-L but each
      solved target contributes ALL of its evidence with probability phi
      and none otherwise (seeded Bernoulli per target); phi = 1 is RESEL-L,
      phi = 0 must equal STATIC bit-for-bit. ARM RSWEEP(r in {2, 4, 8},
      T_sel in {T, T/2}): STATIC and RESEL-L from pools of ratio r. ARM
      CAP(c in {4T, 2T}, T_sel in {T, T/2}): as RESEL-L but after each
      re-selection only the top-c pool entries by weight are retained.
      ARM RSWEEP-R(R in {T/4, T, 4T}, T_sel = T/2, N = 2^24 only): round
      length sweep. ARM ORACLE(T_sel), N <= 2^24 only: the top-T_sel DPs by
      EXACT basin size over all DPs (the ceiling arm; not an algorithm).
      CURVE arms (Stage 3): STATIC(T), STATIC(T/2), RESEL-L(T),
      RESEL-L(T/2), NULL-A(T/2), RHO, with certificates; U = 8T.
    per_target_protocol: >-
      For target u: draw up to k = 4 independent uniform restarts; walk
      each to its first DP or the cap; on the first hit, stop, credit the
      hit entry with (length, +1), record solved with the certificate
      (curve) or the hit (generic); after the round, apply the arm's pool
      rule; re-select the table as the top-T_sel of the pool by weight
      (ties broken by a seeded permutation). Targets are independent,
      uniform, non-adaptive; the seeded logarithm is never read by the
      solver.
    fixture_procedure: >-
      G2 FIXTURE at each N in {2^24, 2^30}, a = 1/4, r = 2, ARM STATIC(T):
      M = 40000 single-walk trials per seed from uniform restarts, cap 8W;
      scaled main-computation cost = (total walk steps over trials) /
      (number of trials whose terminal DP is in the table) / sqrt(N/T),
      pooled over the 5 seeds; scaled precomputation = P / sqrt(N T). At
      a = 1/2 the same with the Table 4.1 target. This reproduces the
      paper's metric ("average number of multiplications per successful
      discrete-logarithm computation, scaled by (l/T)^{1/2}", one walk per
      experiment, cap 8W, randomisation and double-check excluded).
    exact_basins: >-
      At N in {2^20, 2^24} (generic) and on the curve (Stage 3, optional
      if within budget): for every x the first DP reached and its distance,
      by vectorised forward iteration with pointer jumping, cap 8W; basin
      sizes of every DP, cycle mass, capped mass; exact coverage of every
      table of every arm at every round = sum of its entries' basin sizes
      / N; the global top-T_sel share (ORACLE arm).

  controls:
    - >-
      (a) STATIC(T): the same-pool static Bernstein-Lange table with the
      published weight at r = 2 -- THE BASELINE for every ratio; and
      STATIC(T_sel) for each T_sel, the twin of each re-selected arm.
    - >-
      (b) STATIC2T: the whole r = 2 pool stored; answers whether the
      re-selected T matches a static 2T at equal P (model: it EXCEEDS it,
      0.39 vs about 0.32 single-walk).
    - >-
      (c) RHO: distinguished-point rho with no table at the same k W budget;
      the floor (predicted below 0.02 per target).
    - >-
      (d) NULL-A relabelled batch evidence: must reproduce STATIC(T_sel)
      within CI at every round; NULL-B frozen table: must equal STATIC
      bit-for-bit (a difference is a leak from the pool bookkeeping into the
      walks).
    - >-
      (e) PHI decay in {1, 0.5, 0.25, 0.1, 0}: gain must be non-decreasing
      in phi, zero at phi = 0 exactly, and follow the time-rescaling law
      eps_resel(phi, U) about eps_resel(1, phi U).
    - >-
      (f) STRUCTURAL TELL, two parts: the gain must SHRINK as r grows over
      {2, 4, 8} and be at most 0.03 at r = 8; and the hit rate of every
      re-selected table must never exceed the EXACT global top-T_sel share
      at N in {2^20, 2^24} (deterministic; exceedance is an implementation
      error) nor 0.42 at 2^30 (model 0.39 plus 0.03).
    - >-
      (g) LOWER bracket is the algorithm; UPPER bracket (generic only) is a
      diagnostic whose gap to LOWER is reported and must stay below 0.05.
    - >-
      (h) CAP(4T) and CAP(2T) pool arms with S_peak reported in bits beside
      the UNCAPPED arm's S_peak.
    - >-
      (i) Early-batch penalty: eps_cum over the first 10% of the U = 8T
      batch for RESEL-L(T/2) versus STATIC(T); steady-state crossing U_ss
      and cumulative break-even U* at margin 0.02, reported as "> 16T" when
      not reached.
    - >-
      (j) BASIN-LAW GATE G1 at N = 2^20 (both a): exact basins; survival
      log-log slope on 10 <= n <= W^2/4 within 0.15 of -1/2; cutoff n_c with
      n_c theta^2/2 in [0.5, 2]; exact top-T share divided by the model
      C_max(a) in [0.85, 1.05]; STATIC(T) exact coverage strictly below the
      top-T share. Fails -> the model predictions are not checked and the
      batch cells are reported as measurements without model comparison;
      an exceedance of the top-T share by any table fails the run as
      invalid.
    - >-
      (k) PRIMARY-SOURCE REPRODUCTION GATE G2 at N in {2^24, 2^30}: the
      generic STATIC(T) arm at a = 1/4, r = 2 must give scaled main-
      computation cost within 0.18 (10%) of 1.79 -- Bernstein-Lange Section
      4 case study, alpha = 1/2, N = 2T (T = 64 and T = 1024: 1.79; T =
      65536: 1.77), NOT a Table 4.1 entry since Table 4.1 covers alpha >=
      0.707 only -- and scaled precomputation within [1.05, 1.40]
      (published 1.17-1.24); at a = 1/2 within 0.16 of Table 4.1's 1.62
      (alpha = 0.707, N = 2T, T = 512 column). Fails at an N -> that N's
      run set is INVALID (instrument not comparable to the paper), never
      negative.
    - >-
      (l) ROUND-0 IDENTITY: round 0 of every re-selected arm equals its
      STATIC(T_sel) twin bit-for-bit (same seeds); a difference is a
      bookkeeping error and invalidates the run.
    - >-
      (m) GENERIC-VERSUS-CURVE transfer check at N = 2^24, a = 1/4: STATIC(T)
      and RESEL-L(T/2) steady-state success on the curve within CI of the
      generic instrument; a difference is a walk-quality finding reported
      separately, never folded into the gain.
    - >-
      (n) ORACLE(T_sel) ceiling arm at N <= 2^24: the top-T_sel by exact
      basin size, the value every re-selected arm is measured toward and
      may not exceed.

  independent_variables:
    - "N in {2^20, 2^24, 2^30} generic; about 2^24 curve"
    - "a in {1/4, 1/2}"
    - "T_sel in {T/4, T/2, 3T/4, T} (and 2T for STATIC2T)"
    - "arm in {STATIC, STATIC2T, RHO, RESEL-L, RESEL-U, NULL-A, NULL-B, PHI, RSWEEP, CAP, RSWEEP-R, ORACLE}"
    - "U from 0 to 16T in rounds of R"
    - "r in {2, 4, 8}"
    - "phi in {0, 0.1, 0.25, 0.5, 1}"
    - "pool cap in {uncapped, 4T, 2T}"
    - "R in {T/4, T, 4T} (2^24 only)"
    - "walk in {keyed random function, r-adding curve walk r = 32}"
    - "seed (walk key, targets, decay stream, null stream)"

  metrics:
    primary:
      - "rho_T(U) at U in {4T, 8T, 16T}, a = 1/4, r = 2, LOWER bracket, steady-state; dimensionless; stratified-by-seed BCa bootstrap 95% CI"
      - "eps_ss(RESEL-L(T/2), U = 8T) - eps_ss(STATIC(T)); per-target success difference; bootstrap 95% CI; at both a"
      - "gain(NULL-A, T_sel) at every round; must be within CI of zero; and NULL-B / PHI(0) bit-identity to STATIC (boolean)"
      - "gain(PHI(phi), T/2) at U = 8T for each phi; monotonicity and gain(0) = 0"
      - "single-walk hit rate p of every re-selected table per round versus the exact top-T_sel share (N <= 2^24) and versus 0.39 (2^30); exceedance flag"
      - "gain(RESEL-L, T_sel) at U = 8T as a function of r in {2, 4, 8}; monotone decrease and gain(8) <= 0.03"
      - "G1 gate values (slope, cutoff, top-T share / C_max) and G2 gate values (scaled cost, scaled P) per N"
    secondary:
      - "eps_cum(U) for every arm and the cumulative solved counts; early-batch penalty over the first 10%; U_ss; U*"
      - "UPPER minus LOWER steady-state gap per round (generic)"
      - "CAP(4T), CAP(2T) gain relative to UNCAPPED; S_peak in bits per arm; S in bits per arm"
      - "L: mean online walk steps per target and per successful target per arm; restart scalar multiplications (count and operations); lookups; re-selection integer operations per round and their ratio to the round's group operations"
      - "P per pool (r = 2, 4, 8) in group operations and scaled by sqrt(N T)"
      - "STATIC2T single-walk hit rate and steady-state success (equal-P comparator)"
      - "RHO per-target success (floor)"
      - "HEUR-BLT-7 regression at N = 2^24: slope of pool-entry count on exact basin size after U in T*{1, 2, 4, 8}, versus (r T + U k p_s)/N; exact coverage of the re-selected table versus that of a precomputation pool of ratio r_eff selected by the same rule"
      - "exact coverage of every table at every round (N <= 2^24) beside its sampled hit rate; exact-versus-sampled residual"
      - "time-rescaling residual |eps_resel(phi, U) - eps_resel(1, phi U)| per phi"
      - "round-length R sweep: gain and re-selection operations versus R"
      - "curve arm: certificate pass count (must equal solved count), generic-versus-curve differences"
      - "capped-walk fraction and cycle mass per cell"
      - "the a = 1/2 differential: eps_ss(RESEL-L(T/2)) - eps_ss(STATIC(T)) at a = 1/2, predicted CI-separated below zero"

  heuristic_under_test: null
  heuristic_note: >-
    The experiment tests the main claim of H-ECDLP-37dc01; HEUR-BLT-7's
    validation plan is folded in as a secondary metric (the regression at
    N = 2^24) and HEUR-BLT-1/2 are tested in full by EXP-ECDLP-869870, on
    which this contract does NOT depend because it carries its own gates
    G1 and G2.

  preregistered_prediction:
    quantity: >-
      rho_T(U) = T_resel(U)/T at fixed (P = the r = 2 pool, L = k W with cap
      8W, epsilon = eps_ss of STATIC(T)), a = 1/4, k = 4, LOWER bracket,
      steady-state, generic instrument at N in {2^24, 2^30}; together with
      the single-walk hit-rate trajectory of RESEL-L(T) and the differential
      at a = 1/2.
    formula: >-
      rho_T(0) = 1 exactly. rho_T(4T) <= 0.75 (CI excluding 1.0).
      rho_T(8T) in [0.45, 0.65], model asymptote rho_T(infinity) = 0.51 =
      T_oracle/T_static = 1.64/3.20 (aed829 (B3): oracle L sqrt(T/N) = 1.28
      versus published 1.79, squared); equivalently rho solves
      C_max(a rho) = p_static(a, r = 2) with p_static about 0.27 (implied by
      1.79 with mean walk 0.97 W) and C_max(1/8) = 0.27, giving rho about
      0.5 at a = 1/4. rho_T(16T) <= 0.6. Hit rate of RESEL-L(T): from about
      0.27 to within 0.03 of the exact top-T share (model C_max(1/4) =
      0.39) by U = 16T, never above it. At a = 1/2: p_static about 0.42
      (from Table 4.1's 1.62) exceeds C_max(1/4) = 0.39, so RESEL-L(T/2)
      stays CI-separated below STATIC(T) and rho_T(infinity) is about 0.6.
      Early-batch penalty >= 0.08 over the first 10% at U = 8T; U_ss in
      [4T, 10T]; cumulative U* in [8T, 16T] or "> 16T". Gain(r): strictly
      decreasing over {2, 4, 8}, gain(8) <= 0.03. UPPER minus LOWER < 0.02
      after round 4. CAP(4T) retains >= 80% of the gain, CAP(2T) >= 60%.
      STATIC2T single-walk hit rate about 0.32. RHO < 0.02. Re-selection
      integer operations < 5% of the round's group operations at R = T.
      Fixture: 1.79 within 0.18, P/sqrt(NT) in [1.05, 1.40] (model (B4):
      1.25); a = 1/2: 1.62 within 0.16.
    source: >-
      Model numbers derived in IDEA-20260906-ee3543 claim (C) from
      IDEA-20260906-aed829 (B2)-(B3) and this design's (B4) -- UNVERIFIED
      derivations of this batch; published numbers from Bernstein-Lange
      Section 4 and Table 4.1 (primary text read by the coordinator
      2026-09-06, scratchpad bl2012.txt); scratch numbers (SCRATCH_SUMMARY.md,
      internal, unverified, 2 seeds, no null, no decay, no certificate)
      inform the early-batch and hit-rate ranges only. Written before any
      run; never tuned to data; a change requires a versioned
      protocol_amendment and runs already executed are never re-scored.

  scale_relevance:
    tier: toy
    justification: >-
      Toy scale: curve arm at p about 2^24 (field <= 32 bits); generic
      instrument at N up to 2^30 is not a field and is labelled toy by the
      same ceiling. Every conclusion is a constant-factor statement under
      the generic S T^2 = Omega~(eps N) ceiling (KN-LIT-013, KN-TECH-005)
      and is scoped to the tested (N, a, r, k, cap, walk, solver) grid;
      N-independence across 2^24 and 2^30 is the only transfer evidence
      and extrapolation to cryptographic N is an assumption to be stated
      per evidence record, never a result. Exponents (1/3, 1/3, 2/3) are
      unchanged by construction.
    correspondence: null

  tail_checks:
    - "Round 0 of every re-selected arm versus its STATIC twin: bit-identical (deterministic tail of the decay)."
    - "The largest exact basin per seed at N <= 2^24 against the Borel(1 - theta) N/W-sample order-statistic 99% band."
    - "The single round with the largest |gain(NULL-A)| across all cells, reported individually with its CI."
    - "The single largest exceedance (if any) of a re-selected table's hit rate over the exact top-T_sel share, reported with the round and seed (must be zero or negative)."
    - "The capped-walk fraction and the cycle mass per cell; a cell with capped fraction above 0.01 is flagged and its L re-reported with capped walks charged at the cap."
    - "The seed with the smallest steady-state gain of RESEL-L(T/2) at U = 8T, reported beside the pooled value."
    - "Curve arm: certificate pass count equals solved count exactly; any mismatch is completed_invalid."
    - "The a = 1/2 differential (RESEL-L(T/2) below STATIC(T)) reported per seed."

  replication:
    seeds: [1, 2, 3, 4, 5]
    independent_instances: 5
  seed_policy: >-
    Generic arm: walk-key seed s in {1, 2, 3, 4, 5}, target seed 100 + s,
    PHI Bernoulli stream 200 + s, NULL-A relabelling stream 300 + s,
    tie-breaking permutation 400 + s; every arm at the same s shares the
    walk, the pool and the target sequence so that arms differ only in the
    declared way. Curve arm: s in {1, 2, 3} with the same offsets, plus
    curve-search seed 1000. Independent instances: 5 per (N, a) generic,
    3 on the curve. Seeds are recorded in every manifest; a duplicated or
    missing seed invalidates the cell.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 12
    maximum_memory_gb: 8
    maximum_runs: 48
    maximum_workers: 1
  budget_note: >-
    Sized to the work, not the tool window. Group-operation counts: at
    2^30 one arm at U = 16T is about 3.4e7 walk steps; about 40 arm-cells
    per (a, seed) give about 1.4e9 steps per run, vectorised over the
    round's walks (minutes to tens of minutes); 2^24 and 2^20 are 64x and
    1024x smaller; exact basins at 2^24 need about 5 int32 arrays of 16M
    entries (about 0.4 GB). Curve arm: about 6 arms x 3 seeds x about 1e6
    point additions plus certificates in pure Python, well under an hour.
    Run count: 10 (Stage G) + 10 (Stage 1) + 10 (Stage 2) + 1 + 3 (Stage 3)
    + 2 (analysis) = 36, with 12 spare for recorded infrastructure re-runs.
    The 8 GB figure is the schema floor and is not approached.

  stopping_rules:
    - "G1 at 2^20 is computed and reported before Stage 1 is interpreted; if the top-T share exceeds C_max(a) by more than 5% or falls below 85% of it, the model comparison is suspended and all later cells are reported as measurements only."
    - "G2 at each N in {2^24, 2^30} is evaluated first at that N; on failure that N's cells are run only if budget remains and are recorded as invalid-for-interpretation."
    - "Any exceedance of an exact top-T_sel share by any table's exact coverage stops the run as completed_invalid (implementation error)."
    - "Any round-0 mismatch between a re-selected arm and its STATIC twin stops the run as completed_invalid."
    - "Any certificate failure on the curve arm stops that run as completed_invalid."
    - "Stop at maximum_runs or total_cpu_hours, whichever binds first; a cell not reached is reported as not run, never as a negative."
    - "Wall clock per run at 3600 s; a run that exceeds it is failed_infrastructure and is re-planned with a smaller shard, never interpreted."

  invalidation_rules:
    - "Execution while status is not approved or execution_authorized is false: no run under this contract is evidence."
    - "A timeout, crash, memory exhaustion or dependency failure is failed_infrastructure and is NEVER negative mathematical evidence (AGENTS.md rule 5)."
    - "Gate G2 failure at an N invalidates that N's run set as not comparable to the paper; it is not a negative result."
    - "NULL-B or PHI(0) differing from STATIC bit-for-bit, or round-0 non-identity: bookkeeping leak; invalid."
    - "NULL-A gain CI-separated above zero and at least half of the RESEL-L gain: artifact; the run set is invalid, not evidence."
    - "Any exact coverage above the exact global top-T_sel share: invalid (impossible by disjointness)."
    - "Duplicated or missing seeds, a manifest missing command, commit, dirty-tree state, environment, requested policy or resolved model, or raw/summary disagreement: invalid."
    - "Any solved logarithm on the curve arm without a verified: true certificate, or any certificate failing independent re-verification or the seeded-log check: completed_invalid."
    - "Reading the seeded logarithm anywhere in the solver path: invalid."
    - "Any post-hoc change to the T_sel grid, the U grid, the tolerances of G1/G2, the success margin or the pre-registered prediction: requires a versioned protocol_amendment; runs already executed are never re-scored."

  success_criterion: >-
    EFFECT (all of S1-S4, at a = 1/4, r = 2, k = 4, generic instrument at
    BOTH N = 2^24 and N = 2^30, with G1 reported and G2 passed): S1 -- at
    U = 8T the LOWER-bracket RESEL-L(T/2) steady-state success minus
    STATIC(T) has a 95% CI (stratified-by-seed BCa bootstrap) whose upper
    bound is >= 0 and a point estimate >= -0.03, i.e. the T/2 re-selected
    table reaches the static T table within CI; equivalently reported as
    rho_T(8T) with CI. S2 -- NULL-A's gain is within CI of zero at every
    round for T_sel in {T, T/2}, and NULL-B and PHI(0) equal STATIC
    bit-for-bit. S3 -- gain(PHI(phi)) is non-decreasing in phi with
    gain(0) = 0 and gain(1) - gain(0.1) CI-separated above zero. S4 -- no
    re-selected table's hit rate exceeds the exact top-T_sel share at
    N <= 2^24 (deterministic) nor 0.42 at 2^30. MECHANISM (both, required
    for the mechanism clause of H-ECDLP-37dc01): S5 -- gain(RESEL-L) is
    strictly decreasing over r in {2, 4, 8} with the 2-to-4 step
    CI-separated and gain(8) <= 0.03; S6 -- the UPPER minus LOWER gap is
    below 0.05 in steady state. EFFECT met and MECHANISM met -> the
    hypothesis is supported at toy scale on the tested grid (constant
    factor only). EFFECT met, MECHANISM not met -> effect supported,
    mechanism inconclusive, no mechanism claim promoted. Neither S1 nor
    F1 met (CI straddles) -> inconclusive; extension of U or seeds only by
    amendment. The curve arm must agree with the generic arm within CI at
    2^24 (control (m)) for any curve-scoped statement; disagreement limits
    every conclusion to the random-function instrument.

  falsification_criterion: >-
    F1 -- at U = 16T, RESEL-L(T/2) LOWER remains CI-separated below
    STATIC(T) (95% CI upper bound of the difference < 0) at both generic N
    with G2 passed and S2-S4 clean: rho_T(16T) > 0.85 with CI; the
    hypothesis is REJECTED IN ITS STATED REGIME, with rho_T(16T) and its CI
    as the obstruction quantity over the stated scope. F2 -- NULL-A
    reproduces the gain (see invalidation): ARTIFACT, invalid, not a
    negative. F3 -- the phi decay is non-monotone beyond CI: artifact,
    invalid. F4 -- exceedance of the exact oracle share: implementation
    error, invalid; exceedance of 0.42 at 2^30 with the exact tell holding
    at 2^24: model contradiction routed to review, never promoted on
    Executor authority. F5 -- gain does not decrease with r or gain(8) >
    0.03 with the effect present: the MECHANISM clause is falsified. F6 --
    the a = 1/2 RESEL-L(T/2) reaches STATIC(T) within CI while the a = 1/4
    one does not: the model's differential prediction is inverted; the
    hypothesis is rejected as stated and the observation routed to
    H-ECDLP-3550b8's review. Any gate failure is INVALID, never negative.

  required_artifacts:
    - "experiments/EXP-ECDLP-612fb1/runs/RUN-*/manifest.yaml with exact command, git commit and dirty-tree state, environment, requested policy, resolved model identifier and fallback flag, seeds, wall clock, peak_rss_bytes"
    - "experiments/EXP-ECDLP-612fb1/runs/RUN-*/raw-result.json with one record per (arm, round, target): walks used, steps per walk, outcome, hit entry, and for the curve arm the certificate; per-round pool size, table composition hash, S, S_peak, re-selection integer operations, restart and lookup counts"
    - "experiments/EXP-ECDLP-612fb1/runs/RUN-*/summary.json with per-arm per-round hit rates, eps_ss, eps_cum, exact coverage (N <= 2^24), Wilson intervals; the G1 and G2 gate values; the HEUR-BLT-7 regression"
    - "exact basin-size histograms (compressed) per (N <= 2^24, a, seed) and the curve, with cycle and capped mass"
    - "the curve record (p, a, b, N, P, curve_id) with the point-counting verification"
    - "certificates for every solved logarithm on the curve arm in raw-result.json, kind discrete_log, verified: true by the independent verifier, verifier_commit recorded; kind none stated explicitly for generic runs"
    - "the analysis run's CI tables: rho_T(U), differences, NULL gains, phi decay, r sweep, UPPER-LOWER, CAP retention, early-batch penalty, U_ss, U*, the fixture table beside the published values, with the bootstrap code and resample count"
    - "the instrument implementation at a path declared in the executor handoff, recorded by commit in every manifest; one code path for all arms with arm selection by configuration"
    - "a per-run cost table separating MEASURED (counted) from MODELED (formula) numbers, never mixed in one column"

  cost_model:
    measured_vs_modeled: >-
      MEASURED: every count (walk steps, restarts, lookups, re-selection
      integer operations, certificate operations, bits, P), every rate and
      every exact coverage. MODELED: C_max(a), (B1)-(B4), the 0.51
      asymptote, the 0.32 STATIC2T value and the 0.42 a = 1/2 static rate
      -- each labelled with its formula and source and never placed in a
      measured column.
    optimistic_assumptions:
      - "A walk step is one group operation; on a real curve a point addition is about 10 field multiplications and a lookup is a memory access -- the unit is stated, not converted."
      - "Restart scalar multiplications (1.5 log2 N group operations per online walk) are excluded from L, as the paper excludes them; they are counted and reported and are about 36 per walk at 2^24 against a walk of about 128 steps, i.e. NOT negligible at toy scale and reported as such."
      - "Re-selection cost is counted in integer operations, which are not group operations; the ratio reported is of counts, not of time."
      - "The pool is charged as working storage (S_peak), not as advice, following the paper's distinction; the CAPPED arms bound it."
      - "Targets are uniform and independent; a skewed distribution is out of scope and would re-select a different object."
    memory_accounting: >-
      S = T_sel x 2 ceil(log2 N) bits (advice); S_peak = max pool entries x
      (2 ceil(log2 N) + 48) bits (working storage); both reported per arm
      and per round; the UNCAPPED arm's S_peak grows about linearly in U k
      p_s and is the number most likely to be understated; measured
      peak_rss_bytes reconciled against the analytic sizes in the analysis
      run.
    hidden_overhead: >-
      None hidden in an o(1) term; the early-batch penalty and the working
      storage are the honest costs and are first-class metrics.
    standardized_parameter_sets: >-
      (N, T, W, a, r, k, cap) = (2^24, 256, 128, 1/4, 2, 4, 8W) and
      (2^30, 1024, 512, 1/4, 2, 4, 8W) as the headline cells; the a = 1/2
      cells with W = sqrt(N/(2T)). No cryptographic parameter set is costed
      by this contract.

  interpretation:
    - >-
      Every conclusion this contract can license is claim_tier toy and is a
      CONSTANT-FACTOR statement under the generic S T^2 ceiling
      (KN-LIT-013); it moves no exponent and names no non-generic
      structure. It is scoped to the tested curves (one toy curve), the
      generic instrument, the parameters above, this solver and this
      budget; transfer to other N is an assumption to be stated in the
      evidence record.
    - >-
      The reduction is in ADVICE at fixed (P, L, epsilon) for a batch of U
      uniform targets and is bought with working storage during the batch;
      the CAPPED arms are the frontier-honest points on the
      (P, S, L, epsilon, U) frontier and S_peak is reported beside T on
      every cell (RQ-ECDLP-78dbc5 definition of fewer_DP).
    - >-
      IDEA-20260906-a3d6ae (growth with relation accounting) is the
      frontier comparator and is predicted to dominate this mechanism on
      per-target L at equal S_peak; it is cited, not designed, here.
    - >-
      The generic arm solves nothing and certifies nothing; only curve-arm
      cells may be quoted as solved logarithms.

  assigned_to: executor
  review_required: true
  review_note: >-
    Claim-relevant producer; on approval the dispatch card must carry
    review_required: true with a dependent Validator task (blind
    re-derivation of the fixture and of the exact top-T share at 2^24 from
    the statement of the quantities, blind to the producer's
    implementation) and a Red Team task on the null and decay design.
