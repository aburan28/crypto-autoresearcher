protocol_amendment:
  id: PA-ECDLP-612fb1-v1-to-v2
  id_allocation_provenance: >-
    Amendment records are NOT in tools/allocate_id.py's identifier space.
    That tool's PREFIX_TYPE mapping covers GOAL, RQ, IDEA, H, EXP, EV, DEC,
    TASK, BATCH, CORR only; there is no "amendment" or "protocol_amendment"
    entry, and grep of the tool's source confirms no mention of the word
    "amendment" anywhere in it. The two precedent amendment records read for
    this task's field shape (experiments/EXP-STR-004/amendments/v1_to_v2.yaml
    id PA-STR-004-v1-to-v2, experiments/EXP-IC-002/amendments/v1_to_v2.yaml
    with no top-level `id` field at all) confirm this: neither was minted by
    the allocator. This id (PA-ECDLP-612fb1-v1-to-v2) is a deterministic,
    collision-free label -- one experiment has at most one v1-to-v2
    amendment, so the experiment id plus the version pair is unique by
    construction, unlike the random-token identifier types the allocator
    protects. No `allocate_id.py --next` or `--check` call was made or is
    needed for this record.
  experiment_id: EXP-ECDLP-612fb1
  version_from: 1
  version_to: 2
  authoring_task: this design authorship (coordinator role, no TASK-* handoff self-assigned; the orchestrating session dispatched this as direct design work, not through a queued handoff record, mirroring how EXP-IC-002's amendment names `amended_by_task` as the session that authored it)
  amended_at: '2026-09-06'

  triggering_decision:
    id: DEC-20260906-1f5b71
    goal_id: GOAL-ECDLP-bbc21f
    batch_id: BATCH-289698
    decision_verb: weaken
    hypothesis_id: H-ECDLP-37dc01
    evidence_id: EV-ECDLP-60e266
    authoritative_field: >-
      disposition_per_contract.EXP_ECDLP_612fb1.amendment_required_before_any_further_run,
      quoted and implemented item-by-item below. This is the ONLY
      authoritative spec for what this amendment must contain; nothing here
      re-derives it independently or substitutes a paraphrase for its
      numbers.
    review_tasks:
      - task_id: TASK-20260906-7ec3ea
        role: validator
        joints_owned: [J1, J2]
        verdict: HOLDS_WITH_FINDINGS
        report: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-7ec3ea/validation_report.yaml
      - task_id: TASK-20260906-90e7cf
        role: red_team
        joints_owned: [J3, J4]
        verdict: BROKEN (J3 load-bearing on the claim; J4 narrow, criterion named)
        report: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-90e7cf/red_team_report.yaml
    contract_outcome_that_triggered_this: >-
      S1 NOT MET (CI-separated BELOW at both N and on the curve: -0.064
      [-0.080, -0.049] at 2^24, -0.076 [-0.083, -0.068] at 2^30, -0.049
      [-0.071, -0.029] on TOY-P24-1ca86fe9187c) and F1 NOT MET by its letter
      (rho_T(16T) 0.619 / 0.632, not > 0.85) though F1's CI-separation
      clause IS met -- an outcome the frozen v1 contract's own success and
      falsification criteria do not name a cell for. The Coordinator's
      committed disposition is `weaken` on H-ECDLP-37dc01 (not `reject_scoped`,
      forbidden on one unreplicated batch), carrying the amendment named
      here as the replication the verb requires before any further
      hypothesis transition.

  v1_frozen_path: experiments/EXP-ECDLP-612fb1/specification.v1-frozen-df3238e2.yaml
  v1_frozen_sha256: df3238e205f3ec1c290238af5921993c5b63d4f9ad56a12e959d9ea6109571dd
  v1_frozen_sha256_provenance: >-
    This authoring role holds no shell and computed no hash itself, exactly
    as DEC-20260906-2b1387 discloses for v1's own approval ("this
    coordinator role has no shell and computed no hash: the sha256 of each
    approved specification at its committed bytes is recorded by the Git
    half"). The value above is the path_sha256 already recorded,
    content-first, for experiments/EXP-ECDLP-612fb1/specification.yaml at
    v1's approval commit by coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-9c5410/archives/TASK-20260906-2d30dd/ledger-receipt.json
    (and independently backfilled in that batch's dispatch_queue.json
    path_sha256). Because the contract is frozen (immutable, rule 2) and no
    later commit touched this path -- confirmed by grepping
    coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/archives/TASK-20260906-7a2446/snapshot-receipt.json,
    which does not bind experiments/EXP-ECDLP-612fb1/specification.yaml at
    all, i.e. BATCH-289698 left this path untouched -- this hash is still
    the current committed content hash of the file this record freezes a
    byte-for-byte copy of. This is a REUSED, already content-verified hash
    of the same immutable bytes, never a fabricated or estimated one. The
    orchestrating session's Git half should re-verify path_sha256 against
    the frozen copy when it stages this amendment (content-first
    verification per AGENTS.md "Concurrency: many agents, many worktrees").
  v2_path: experiments/EXP-ECDLP-612fb1/specification.v2.yaml

  discharges: # one entry per DEC-20260906-1f5b71 item (a)-(h), each naming the exact v2 change and the review finding it answers
    - item: a
      title: G3 ceiling-feasibility gate
      decision_text_quoted: >-
        "a CEILING-FEASIBILITY GATE G3 from the exact basins before any
        re-selected arm is interpreted -- exact top-T_sel share >=
        STATIC(T) exact coverage (or ORACLE(T_sel) eps_ss >= STATIC(T)
        eps_ss) in at least 4 of 5 seeds; its failure makes S1 UNTESTABLE
        at that (a, r, T_sel), never negative; zero extra compute"
      answers: >-
        F-J3-1 (red team, load-bearing: exact top-T/2 share below
        STATIC(T) exact coverage in 10/10 exact seeds at a = 1/4, so the
        pre-registered T_sel = T/2 claim was infeasible before any
        re-selection ran)
      v2_change: >-
        New `inputs.g3_gate_procedure`, new control "G3 CEILING-FEASIBILITY
        GATE" in `controls`, a new invalidation rule (G3 FAIL -> UNTESTABLE,
        never negative), and `success_criterion`/`falsification_criterion`
        both restructured to evaluate G3 FIRST at every (a, r, T_sel) cell
        before S1/F1 are read. At N = 2^24 this is exact and zero-compute
        (reads the ORACLE arm the contract already runs); at N = 2^30 it is
        read from the sampled ORACLE(T_sel) reading, corroborated
        informationally by the N = 2^24 exact reading and by v1's own
        N-independence agreement -- a judgment call, see `judgment_calls`
        below.
    - item: b
      title: S1 non-vacuity guard, relative tolerance
      decision_text_quoted: >-
        "an S1 NON-VACUITY GUARD -- STATIC(T) eps_ss >= 0.5 and
        CI-separated above RHO by >= 0.30, tolerance stated relative (5%
        of the STATIC(T) - RHO gap), rho_T CI excluding 1.0 and uncensored
        on the T_sel grid; U_ss/U* margins relative likewise"
      answers: >-
        F-J4-1 (red team, load-bearing: S1's absolute tolerance
        (point >= -0.03, CI upper >= 0) is MET on the affine-xorshift
        keyed bijection where every table sits at 3-5% success and RHO at
        0 -- S1's own tolerance is at the scale of the object's whole
        dynamic range there)
      v2_change: >-
        New `definitions.non-vacuity guard`; `success_criterion` restated
        so S1_v2 is evaluated only when STATIC(T) eps_ss(U) >= 0.5 AND
        CI-separated above RHO's eps_ss(U) by >= 0.30; the tolerance
        becomes tol = 0.05 * (STATIC(T) eps_ss - RHO eps_ss), replacing
        v1's flat 0.03; rho_T(U)'s CI must exclude 1.0 AND lie within
        T_sel_grid_v2 without extrapolation (uncensored); U_ss/U* margins
        become 0.05 * the same gap, replacing v1's flat 0.02.
    - item: c
      title: S2 one-sided
      decision_text_quoted: >-
        "S2 RESTATED as the null's expected sign -- one-sided: NULL-A gain
        not CI-separated above zero and <= 0.5 x the RESEL-L gain at every
        round, with the null's own perturbation recorded"
      answers: >-
        F-J4-2 (red team, load-bearing: S2's two-sided "within CI of
        zero" is unsatisfiable by NULL-A's own design -- uniform relabelling
        over a 2T-9T-entry pool must randomise the table toward the
        random-subset level, measured gain -0.11 to -0.22 in every real
        cell, 2-3x the effect size, never "slightly below")
      v2_change: >-
        `success_criterion`'s S2_v2 restated one-sided exactly as quoted;
        `metrics.primary` gains a CI-above-zero-flag-and-ratio line;
        `falsification_criterion`'s F2_v2 restated to match; control (d) in
        `controls` annotated as diagnostic-only for the retired two-sided
        reading.
    - item: d
      title: headline as the frontier tuple, S_peak charged
      decision_text_quoted: >-
        "the HEADLINE QUANTITY restated as T_resel/T_static at fixed
        success WITH S_peak CHARGED, reported as the frontier tuple
        (T_sel/T, S_peak/T, P/sqrt(NT), L, eps_ss, eps_cum, U, early
        penalty) with rho_ORACLE beside rho_T on every exact cell and
        rho_cum beside rho_ss, U* stated explicitly when unreachable"
      answers: >-
        F-J3-2 ("fewer stored DPs" survives on no cell once working
        storage counts: the smallest re-selected cell, CAP(2T,T/2), holds
        2.6 T against STATIC(T)'s 1 T) and F-J3-3 (rho_T is steady-state;
        the RQ's own epsilon is cumulative, where the ratio is 0.75-0.77
        and U* is unreachable, not merely "> 16T")
      v2_change: >-
        New `definitions.rho_ORACLE`; `metrics.primary` gains the frontier-
        tuple line and the rho_ORACLE/rho_cum-beside-rho_ss line;
        `interpretation` gains a bullet forbidding a bare advice-ratio
        headline; `success_criterion` requires the frontier tuple in the
        OVERALL disposition; U* may be reported "unreachable within tested
        U" as a valid, never-omitted value.
    - item: e
      title: HEUR-BLT-7 with the admitted-walk count
      decision_text_quoted: >-
        "HEUR-BLT-7 stated with the admitted-walk count in place of U k p_s"
      answers: >-
        F-J3-4 (red team, not load-bearing but directed by the
        decision: v1's r_eff = r + U k p_s / T assumes k = 4 walks per
        solved target; solved targets stop at the first hit, mean 1.7 walks
        used, so the formula overcounts admitted evidence by about 1.7x --
        executor's r_eff 23.28 at 8T versus the honest 13.3)
      v1_statement_quoted_first: >-
        H-ECDLP-37dc01 HEUR-BLT-7 `formal_statement` (quoted verbatim, per
        the task's instruction to quote before replacing): "BATCH-POOL
        EQUIVALENCE. In the LOWER bracket, after U targets with k walks
        each and per-target solve rate p_s, the pool's evidence (count,
        length sum) for every basin of size n is distributed as that of a
        Bernstein-Lange precomputation pool with ratio r_eff = r + U k p_s
        / T, up to the correlation that a target's k walks are admitted
        together, with relative error in the resulting top-T_sel exact
        coverage at most 10% for U k >= T and N >= 2^24."
      v2_change: >-
        New `definitions.admitted-walk count` and `definitions.r_eff
        (corrected, item e)`: r_eff = r + (admitted-walk count)/T, where
        admitted-walk count is the MEASURED sum, over solved targets, of
        walks actually used before the first hit (mean measured 1.7 at the
        tested cell). `metrics.secondary`'s HEUR-BLT-7 line corrected
        accordingly, with the v1 (superseded) reading retained beside it
        for auditability, never silently dropped. H-ECDLP-37dc01's own
        heuristic_assumptions entry for HEUR-BLT-7 is amended in step by
        the Coordinator decision that approves v2 (outside this
        experiment-contract record's write scope; noted for traceability).
    - item: f
      title: per-admission pool cap
      decision_text_quoted: >-
        "the pool cap applied per admitted target or per round before
        admission so that CAP(2T)'s S_peak is 2 T"
      answers: >-
        F-J3-2 (CAP(2T,T/2) holds 2.6 T, not 2 T -- red team: "the
        pool grows by a round's admitted walks BEFORE the cap is applied at
        round end")
      v2_change: >-
        New `instrument.pool_admission_v2` specifying per-admitted-target
        cap enforcement (the pool is truncated back to its top-c entries
        immediately after each solved target's walks are admitted, not
        once at round end); `inputs.per_target_protocol` amended to match;
        `controls` (h) annotated; `metrics.secondary` gains an invalidation
        note that CAP(c)'s measured S_peak must never exceed c under the
        corrected rule.
    - item: g
      title: fit_cutoff None -> G1 FAIL; permanent negative fixture
      decision_text_quoted: >-
        "fit_cutoff None mapped to a G1 FAIL and the two bijection seeds
        (red team src/pipeline_perm, results/j4_perm) kept as a permanent
        negative fixture"
      answers: >-
        F-J4-4 (red team: on both bijections fit_cutoff returns None
        and the snapshot analysis.py raises TypeError instead of scoring
        G1 FAILED; with a None-guard it correctly reports G1 FAILED on all
        three criteria in both kinds)
      permanent_fixture_paths_cited_exactly: >-
        coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-90e7cf/src/pipeline_perm
        and
        coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-90e7cf/results/j4_perm/
        (these are the red team's OWN task-scoped artifacts from
        TASK-20260906-90e7cf, per the task's instruction that these ARE
        this task's own artifacts, not a separate location to search for).
      v2_change: >-
        New `definitions.permanent negative fixture`; new
        `inputs.g1_permanent_fixture_procedure` requiring STAGE 4v2's
        analysis run to score G1 FAIL (never crash, never PASS) on both
        fixture seed sets before any real-cell G1 verdict is trusted; two
        new `invalidation_rules` entries (None-guard exception is a
        stopping condition; a PASS or crash on either fixture invalidates
        the whole G1 pipeline for the batch); a new `tail_checks` entry and
        a new `required_artifacts` entry recording the fixture check output
        in every STAGE 4v2 manifest/summary.
    - item: h
      title: 2^20 a-scan run first; (C6) replaced by the ordering prediction
      decision_text_quoted: >-
        "the a-scan of ORACLE(T/2) - STATIC(T) on 2^20 exact basins
        (seconds per cell) run FIRST to locate any (a, r) at which a
        fixed-advice T/2 claim is feasible, and (C6) replaced by the
        ordering prediction rho_ORACLE(a = 1/4) < rho_ORACLE(a = 1/2) with
        rho_T(a) tracking it"
      answers: >-
        F-J3-1's `required_successor` (the a-scan) and F-J4-3 (red
        team, not load-bearing but directed: the a = 1/2 differential does
        not discriminate the basin model because the identical disjointness
        inequality holds at a = 1/4 too; "what does discriminate is
        rho_ORACLE (0.55 at a = 1/4 vs 0.67 at a = 1/2, 2^24)")
      v1_C6_quoted_first: >-
        H-ECDLP-37dc01 statement, clause (C6), quoted verbatim (per the
        task's instruction to quote v1's C6 before replacing it): "(C6) at
        a = 1/2 the same T/2 table CANNOT reach the static full-T success
        (its ceiling C_max(1/4) = 0.39 lies below the static a = 1/2 hit
        rate of about 0.42 implied by Table 4.1's 1.62), so the model
        predicts T_resel/T of about 0.6 there, not 0.5 -- a differential
        prediction that separates the basin model from a generic 'more
        evidence helps' story." The contract's own operationalisation of
        (C6) is metrics.secondary's "the a = 1/2 differential:
        eps_ss(RESEL-L(T/2)) - eps_ss(STATIC(T)) at a = 1/2, predicted
        CI-separated below zero" and falsification F6 ("the a = 1/2
        RESEL-L(T/2) reaches STATIC(T) within CI while the a = 1/4 one does
        not: the model's differential prediction is inverted").
      replacement_quoted: >-
        Red team required_successor (F-J4-3): "Replace (C6) by the ordering
        prediction rho_ORACLE(a=1/4) < rho_ORACLE(a=1/2) with rho_T(a)
        tracking it, tested from the ORACLE arms already run." Already
        corroborated by v1's own data (rho_ORACLE about 0.55 at a = 1/4
        versus about 0.67 at a = 1/2, 2^24) BEFORE any new run under v2.
      v2_change: >-
        New STAGE 0 in `inputs.stage_plan` (the a-scan, N = 2^20, 12-point
        a-grid x r in {2,4,8} x 5 seeds, exact basins, zero re-selected
        arms, run and reported FIRST); new `independent_variables.a_scan_grid`;
        new control "A-SCAN ORDERING CONTROL" in `controls`, replacing v1's
        implicit reliance on the a = 1/2 differential; `falsification_criterion`'s
        F6_v2 restated as the ordering-prediction falsifier (rho_ORACLE(1/4,
        r) >= rho_ORACLE(1/2, r) at any r, with CI, falsifies it and routes
        to H-ECDLP-3550b8 exactly as v1's F6 did); the a = 1/2 differential
        demoted to a diagnostic-only metric in `metrics.secondary` and
        `tail_checks`, since F-J4-3 shows it does not discriminate.

  not_changed: # mirrors EXP-IC-002's `unchanged_fields` style; the complete list is also embedded in v2's own `field_provenance.unchanged`
    - "id, hypothesis_id, derived_from_idea, question_id, goal_id"
    - "designed_by, assigned_to, review_required, review_note"
    - "every v1 definition (T, T_sel general grid, W, a, r, P, k, cap, U, R, L, epsilon, weight, p_arm, eps_ss, eps_cum, gain, T_resel(U), S, S_peak, LOWER/UPPER bracket) -- new terms are additive"
    - "instrument.generic_walk, instrument.curve_walk, instrument.certificates, instrument.bits_per_entry_frozen, instrument.charging's UNIT (the charging TIMING for re-selection integer operations under CAP arms changes per item f, the unit does not)"
    - "inputs.per_target_protocol (except the pool-cap timing clause, item f)"
    - "controls (a), (b), (c), (e), (g), (i)-(n) verbatim; (d), (f), (h), (j) touched only by an ADDITIVE annotation, none of their v1 text is deleted"
    - "independent_variables (every v1 line retained; T_sel_grid_v2 and a_scan_grid are additive, not replacements of the definitional grid)"
    - "metrics.primary and metrics.secondary (every v1 line retained; new lines added for items c, d, e)"
    - "heuristic_under_test (null, unchanged)"
    - "scale_relevance, tail_checks (v1's eight checks retained; two new ones added for items a, g), replication, seed_policy"
    - "stopping_rules (v1's seven retained verbatim; two new ones added for items a, g)"
    - "cost_model.measured_vs_modeled's structure, optimistic_assumptions, memory_accounting, hidden_overhead, standardized_parameter_sets"
    - "interpretation (v1's four bullets retained verbatim; one new bullet appended)"
    - "Stage 3 (curve arm) is not re-run by this amendment; v1's certificate and control-(m) results stand and are cited, not re-measured"
    - "claim_tier toy and every scope/transfer statement"

  budget_shape: >-
    Same shape as v1's block (wall_clock_seconds_per_run,
    total_cpu_hours, maximum_memory_gb, maximum_runs, maximum_workers, plus
    a budget_note), sized proportionally larger to cover the new STAGE 0
    a-scan plus the STAGE 1v2/2v2/4v2 re-run, per CLAUDE.md "Research
    budgets: progress first" (advisory, not a gate on approving this
    amendment; see specification.v2.yaml `budget`/`budget_note` for the
    worked sizing: about 17 runs, 4 CPU-hours advisory ceiling, against
    v1's actual usage of 37 runs / 0.14 CPU-hours for a comparable-size
    grid).

  binding: >-
    No run under EXP-ECDLP-612fb1 is authorized by this record. Per v1's
    own approval_note precedent and design-experiment step 4: this
    amendment must be confirmed by the USER (via the orchestrating
    session) and then recorded APPROVED by a committed Coordinator decision
    (setting specification.v2.yaml's `status: approved`, `approved_by:
    coordinator`, `frozen: true`, `execution_authorized: true`) before any
    executor handoff may be written or any run may occur. specification.yaml
    (v1) is PRESERVED UNCHANGED at its own path; its 37 executed runs
    (RUN-ECDLP-612fb1-001..037, less the recorded infrastructure failure
    RUN-011, superseded by RUN-012) STAND AS EXECUTED and are NOT re-scored
    by this amendment or by any future run under v2. Where v2 and v1
    disagree, and v2 is approved, v2 governs; until v2 is approved, v1
    remains the only executable contract for this experiment identifier,
    and it is not currently execution_authorized either (v1's own
    execution_authorized has not been reset to false by this record -- v1
    is simply a completed, fully-executed contract that this amendment does
    not reopen).

  judgment_calls: # explicit per the task's instruction: state, do not guess silently
    - >-
      G3 at N = 2^30 (item a): v1 restricts the ORACLE(T_sel) arm and exact
      basins to N <= 2^24. The decision's text allows an "or equivalently"
      sampled reading (ORACLE(T_sel) eps_ss >= STATIC(T) eps_ss), but does
      not specify HOW to obtain a sampled ORACLE(T_sel) reading at N = 2^30
      cheaply and honestly. Rather than invent a new sampled-basin
      estimator (which would itself need its own bias/variance
      characterisation before it could bind a gate), this amendment scopes
      G3 to be EXACT and BINDING at N = 2^24 (STAGE 1v2) and INFORMATIONAL
      at N = 2^30 (STAGE 2v2), corroborated by the 2^24 exact reading and
      by v1's own established N-independence agreement (rho_T(8T) 0.654 at
      2^24 vs 0.688 at 2^30, same sign and order of magnitude). If the
      orchestrating session or the user wants G3 to be independently
      binding at 2^30 too, a sampled-ORACLE estimator would need to be
      specified as a further amendment item; this record does not invent
      one.
    - >-
      The a-scan grid (item h) is not numerically specified by the
      decision beyond "an a-scan ... on 2^20 exact basins". This record
      chose a 12-point grid from 1/16 to 1 at r in {2, 4, 8}, chosen to (i)
      include the two contract cells (1/4, 1/2) for continuity, (ii) be
      fine enough to plausibly locate a feasible (a, r) if one exists
      without being so fine that Stage 0 stops being "seconds per cell" in
      aggregate, and (iii) reuse the same 5-seed replication as the rest of
      the contract. This is a reasonable, disclosed choice, not the only
      possible one; the orchestrating session or user may prefer a coarser
      or finer grid before approving.
    - >-
      The T_sel_grid_v2 = {0.65T, 0.75T} pair is exactly what the decision's
      next_actions RANK 1 names ("T_sel in {0.65T, 0.75T} (the measured
      rho_T neighbourhood)"), so it is not a judgment call in itself, but
      one CONSEQUENCE of it is: at U = 4T, v1's own measured rho_T(4T)
      (0.776-0.780) lies ABOVE 0.75T, so item (b)'s "uncensored on the
      whole T_sel grid" requirement will correctly make S1_v2 NOT EVALUABLE
      at U = 4T on this grid, by design of the guard rather than a defect
      of the grid choice. This is disclosed in specification.v2.yaml's
      `preregistered_prediction` (iv) as an expected, honest outcome, not
      papered over.
    - >-
      Whether to re-run Stage 3 (the curve arm) at the amended T_sel grid
      is NOT named by DEC-20260906-1f5b71's item list or next_actions. This
      amendment does NOT re-run Stage 3: v1's curve-arm result already
      passed control (m) (agreement with the generic instrument within CI)
      and the decision's RANK 1 action does not name a curve re-run. A
      future amendment can add one if the user or Coordinator wants curve-
      scoped S1_v2/G3 evidence at the new grid.
    - >-
      "STAGE 0 MUST complete and be reported before STAGE 1v2/2v2 is
      INTERPRETED" (not necessarily before it is EXECUTED) mirrors v1's own
      G1/G2-before-interpretation (not before-execution) ordering exactly,
      since v1's own execution report shows G2's pooled verdict was in fact
      produced after Stage 2 began (validator finding J1-F1, not
      load-bearing) and the contract's own stopping rules already
      distinguish evaluate-before-report from evaluate-before-run. This
      amendment does not tighten that ordering rule beyond v1's own
      practice; a future amendment could, if the Coordinator wants to close
      that gap for v2's own gates too.
    - >-
      This authoring role has no Git access and cannot itself compute a
      sha256, run `tools/allocate_id.py`, or verify path_sha256 against the
      live worktree. Every hash and path claim above is either quoted from
      a prior, already content-verified ledger artifact (the v1 approval
      receipt) or is a reused label (this amendment's own id). This mirrors
