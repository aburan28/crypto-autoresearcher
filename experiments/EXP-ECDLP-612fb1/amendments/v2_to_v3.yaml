  # =========================================================================
  # 9. WHAT A PASS DOES AND DOES NOT LICENSE
  # =========================================================================

  interpretation:
    - >-
      claim_tier TOY, unchanged. Generic keyed-random-function instrument at
      N in {2^20, 2^24}; no curve arm, no cryptographic N, no scheme named.
      Every conclusion is a constant-factor statement under the
      Corrigan-Gibbs-Kogan S T^2 = Omega~(eps N) ceiling (KN-LIT-013,
      provenance: internal via the citing v1/v2 contracts). NO EXPONENT MOVES
      AND NONE IS CLAIMED; the four asymptotic promotion gates of
      agents/coordinator.md are not engaged by this item and cannot be.
    - >-
      A G3 PASS IS A CEILING RESULT, NOT A MECHANISM RESULT. It says the best
      possible T_sel-entry table beats a realistically-selected T-entry table
      on exact coverage. It does NOT say that H-ECDLP-37dc01's online
      LOWER-bracket re-selection procedure attains that ceiling at any
      achievable batch size U. ZERO ONLINE ARMS ARE RUN HERE. Any report that
      elides this distinction misstates the result, exactly as
      DEC-20260907-9b1b02 `decision_rationale_for_verb` (iv) already recorded
      for EXP-ECDLP-6ac801.
    - >-
      a in {1/16, 1/8, 3/16} lies OUTSIDE H-ECDLP-37dc01's own stated
      `test_boundary.parameters` ("a in {1/4, 1/2}"). That widening is already
      recorded additively on the hypothesis (`test_boundary.boundary_amendments`,
      entered when EXP-ECDLP-6ac801 was designed) and is restated here so this
      item is never read as evidence inside the original boundary. It is a
      disclosed scope widening, never a silent extension.
    - >-
      SMALLER a IS NOT FREE, and this must be quoted whenever a PASS is.
      a = T*W^2/N, so at fixed (N, T) a smaller a is a SHORTER walk: at
      N = 2^24 the tested a = 1/16 has W = 64 against the contract's headline
      a = 1/4 W = 128. A shorter W means more distinguished points, a cheaper
      precomputation per DP, and a different point on the (P, S, L, epsilon, U)
      frontier -- not the same operating point with a better constant. Any
      advice-ratio statement from this batch must carry S, S_peak, P/sqrt(NT)
      and W in the same sentence, per v2's own frontier-tuple discipline (item
      d), which this amendment inherits unchanged.
    - >-
      EV-ECDLP-60e266's obstruction (T_sel = T/2 infeasible at a = 1/4) is
      NEITHER reopened NOR weakened by this item. a = 1/4 appears here only as
      a known-false control that must reproduce it.

