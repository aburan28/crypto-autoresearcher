  # =========================================================================
  # 2. THE EXACT QUESTION
  # =========================================================================

  question: >-
    On the FROZEN v2 instrument of EXP-ECDLP-612fb1 (walk, DP predicate, cap,
    pool procedure and selection rule exactly as v2 froze them), at
    N = 2^24 with EXACT basins, T = 256, T_sel = T/2 = 128, r = 2, seeds
    {1, 2, 3, 4, 5}: is the ceiling-feasibility predicate G3 (Section 3)
    SATISFIED at a = 1/16 and at a = 1/8?
    Secondary, and reported in the same table but never in place of it: the
    same predicate at a = 3/16 and a = 1/4, where its conclusion is KNOWN FALSE
    (Section 6), and at r in {4, 8}, where the signal must decay (Section 5).
    ZERO ONLINE ARMS ARE RUN BY THIS ITEM. No RESEL-L, NULL-A, CAP, PHI, RHO or
    curve arm is executed at any cell. This item measures a ceiling, not a
    mechanism, and Section 9 states exactly what a PASS does and does not
    license.

  # =========================================================================
  # 3. THE G3 FEASIBILITY PREDICATE, STATED FORMALLY AND SELF-CONTAINEDLY
  #
  # THIS SECTION IS THE HEART OF THE AMENDMENT. It exists because
  # EXP-ECDLP-6ac801's a = 1/8 disagreement was caused, per its own committed
  # evidence record, by a frozen contract that said "the published
  # Bernstein-Lange weight" and never wrote the formula down. A reviewer must
  # be able to implement everything below from this text alone, WITHOUT
  # opening experiments/EXP-ECDLP-612fb1/source_v2/ or source_v3/. That is not
  # a convenience: TASK-20260907-b2a8ad's blind re-derivation is blind from
  # exactly those paths, so anything omitted here is a gap the re-deriver must
  # fill by guessing, which is how the last disagreement happened.
  # =========================================================================

  g3_predicate:

    parameters:
      N: "the group/set size, N = 2^n. This item uses n in {20, 24}."
      T: >-
        the nominal table size, T = round(N^{1/3}), FROZEN by v2 as the exact
        table T = 64 at n = 20, T = 256 at n = 24, T = 1024 at n = 30. Use the
        frozen values; do not recompute a rounding.
      T_sel: "the number of stored entries under test. THIS ITEM USES T_sel = floor(T/2) EXACTLY: 32 at n = 20, 128 at n = 24."
      a: "the frozen shape parameter a = T*W^2/N. This item uses a in {1/16, 1/8} (primary) and {3/16, 1/4} (known-false controls)."
      W: "the expected walk length between distinguished points, W = sqrt(a*N/T). Real-valued; NOT rounded."
      theta: "the DP density, theta = 1/W."
      cap: "the per-walk step cap, cap = ceil(8*W). A walk that reaches the cap without meeting a DP is a MISS: it is charged `cap` steps and contributes no DP."
      r: "the precomputation pool ratio. r = 2 is the primary cell; r in {4, 8} are the decay control (Section 5)."
      seeds: "s in {1, 2, 3, 4, 5}. Five, exactly, declared here and never chosen after seeing an outcome."
    exact_parameter_table_for_this_item: >-
      Computed by this authorship from the formulas above (W = sqrt(a*N/T),
      cap = ceil(8*W)) and stated here so a re-deriver never has to infer them:
        n = 24, T = 256, T_sel = 128:
          a = 1/16 : W = 64.000000        theta = 0.015625000  cap = 512
          a = 1/8  : W = 90.509668        theta = 0.011048544  cap = 725
          a = 3/16 : W = 110.851252       theta = 0.009021100  cap = 887
          a = 1/4  : W = 128.000000       theta = 0.007812500  cap = 1024
        n = 20, T = 64, T_sel = 32:
          a = 1/16 : W = 32.000000        theta = 0.031250000  cap = 256
          a = 1/8  : W = 45.254834        theta = 0.022097087  cap = 363
          a = 3/16 : W = 55.425626        theta = 0.018042196  cap = 444
          a = 1/4  : W = 64.000000        theta = 0.015625000  cap = 512

    reading_P1_frozen_instrument: >-
      THE PRODUCTION READING (STAGE 3A/3B). The iteration map and DP predicate
      are v2's, verbatim, and are restated here in full so this section is
      self-contained:
        Let MASK64 = 2^64 - 1 and let mix64(z) be the splitmix64 finaliser on a
        64-bit unsigned integer, computed with wrapping arithmetic:
            z ^= z >> 30;  z = (z * 0xBF58476D1CE4E5B9) & MASK64
            z ^= z >> 27;  z = (z * 0x94D049BB133111EB) & MASK64
            z ^= z >> 31;  return z
        Walk key:   K    = mix64(0x9E3779B97F4A7C15 + s)
        DP key:     K_dp = mix64(K XOR 0xD1B54A32D192ED03)
        Iteration:  f(x) = mix64(x XOR K) AND (N - 1)          for x in [0, N)
        DP test:    D(x) = 1  iff  mix64(x XOR K_dp) < floor(2^64 / W)
      This is the only reading against which STAGE 3A's replication of the
      committed N = 2^20 a-scan numbers is meaningful, because those numbers
      were produced under exactly this map.
    reading_P2_instrument_family: >-
      THE BLIND READING (required of TASK-20260907-b2a8ad, Section 8). A
      re-deriver implementing this predicate from this text alone MAY, and
      SHOULD, use its own uniformly random function on Z_N together with its
      own independent Bernoulli(theta) DP marking (HEUR-BLT-1's statistical
      model), rather than reproducing mix64/hash64. It MUST use the SAME T,
      T_sel, a, W, cap, r, seed count, the SAME pool procedure (`pool` below)
      and, critically, the SAME selection weight and tie-break (`selection`
      below).
      AGREEMENT IS AT THE VERDICT AND PER-SEED SIGN LEVEL, NOT THE MAGNITUDE
      LEVEL. Two different random-function families give different margin
      magnitudes at the same (a, r, seed); EV-ECDLP-2e9680 measured exactly
      that at a = 1/4 (blind margins about -0.030 to -0.052 against
      production's -0.008 to -0.036, same sign every seed). A magnitude
      difference between P1 and P2 is EXPECTED and is not a break. A
      per-cell VERDICT difference, or a per-seed SIGN difference, is.

    basins: >-
      For x in Z_N let the trajectory be x, f(x), f(f(x)), ... . Define
      dist(x) = the least m >= 0 with D(f^m(x)) = 1, and first_dp(x) = f^m(x)
      for that least m; if no such m exists (the trajectory enters a DP-free
      cycle) then x is UNREACHABLE and belongs to no basin. Define
          basin(d) = #{ x in Z_N : first_dp(x) = d AND dist(x) <= cap }
      for each DP d (i.e. each d with D(d) = 1). Points with dist(x) > cap are
      CAPPED and belong to no basin. Every basin count is exact; nothing is
      sampled. Note dist(d) = 0 for a DP d, so every DP is in its own basin.

    top_share: >-
      TopShare(t) = ( sum of the t LARGEST values of basin(d) over all DPs d )
      / N. Ties among equal basin sizes do not affect the sum, so no tie-break
      is needed for this quantity. TopShare is the exact single-walk hit
      probability of the best possible t-entry table -- an ORACLE, unreachable
      by any real selection rule, which is why it is the CEILING in G3.

    pool: >-
      THE PRECOMPUTATION POOL AT RATIO r, exactly as v2 froze the
      Bernstein-Lange procedure. Draw independent uniform starts x_1, x_2, ...
      from Z_N using a deterministic stream seeded by s. Walk each start to its
      first DP or to the cap. A capped walk is a MISS: it is charged `cap`
      group operations to P and contributes NOTHING to the pool. A walk that
      terminates at DP d with length L (the number of steps taken, 0 if the
      start is itself a DP) CREDITS d with (L, +1): that is,
          S_d  <- S_d + L        (the summed generating-walk length at d)
          h_d  <- h_d + 1        (the hit count at d)
      GENERATION STOPS AT THE FIRST MOMENT the pool contains exactly r*T
      DISTINCT DPs. Every generating walk, hit or miss, is charged to P.
      The pool is therefore a set of r*T distinct DPs, each carrying (S_d, h_d).

    selection: >-
      *** THE FORMULA EXP-ECDLP-6ac801 DID NOT STATE. This clause exists
      because omitting it is what produced that batch's a = 1/8 disagreement
      (EV-ECDLP-2e9680 `a_1_8_disagreement.root_cause`). ***
      STATIC(T)_r is the size-T subset of the r*T pool entries selected by the
      PUBLISHED BERNSTEIN-LANGE WEIGHT
          w(d) = S_d + 4 * W * h_d
      taking the T entries of LARGEST w(d), ties broken by an independent,
      seeded, deterministic key ASCENDING (v2 draws that key from a stream
      seeded 400 + s; any deterministic tie-break is acceptable for the P2
      reading, since ties in a real-valued w are measure-zero and the choice
      cannot change a verdict).
      w(d) IS AN ESTIMATOR COMPUTED FROM POOL EVIDENCE ONLY. It is NOT the
      basin size, and a selection by TRUE basin size is a DIFFERENT AND
      STRICTLY STRONGER rule that this predicate FORBIDS. EV-ECDLP-2e9680's
      controlled diagnostic measured how much that choice matters at
      N = 2^24, T_sel = T/2: selecting by true size instead of by w(d) LOWERS
      the pass count at every tested a (a = 1/16: 5 -> 5; a = 1/8: 5 -> 1;
      a = 3/16: 2 -> 0; a = 1/4: 0 -> 0). Selecting by w(d) is the
      REALISTIC rule -- what a precomputer who does not know the basin sizes
      must actually use -- and it is the rule v2's own instrument implements
      and the rule this predicate binds.

    static_coverage: >-
      StaticCov(T, r) = ( sum of basin(d) over the T entries d of STATIC(T)_r )
      / N. Note this is the EXACT coverage of the table the realistic rule
      actually chose -- exact basin sizes are used to SCORE the selection, but
      never to MAKE it.

    predicate_per_seed: >-
      At a cell (N, a, r, T_sel) and seed s, with both quantities computed on
      THE SAME instantiation (same s, same map, same pool draw):
          margin_s  :=  TopShare_s(T_sel)  -  StaticCov_s(T, r)
          g3_s      :=  [ margin_s >= 0 ]                (a boolean)

    predicate_per_cell: >-
      Over the declared seed set S = {1, 2, 3, 4, 5}:
          pass_count := #{ s in S : g3_s }
          G3 PASSES at the cell  iff  pass_count >= 4
          G3 FAILS  at the cell  iff  pass_count <= 3
      The >= 4-of-5 threshold is v2's own frozen G3 rule
      (specification.v2.yaml `inputs.g3_gate_procedure`, "in at least 4 of the
      5 seeds") and is NOT changed by this amendment.

    predicate_semantics: >-
      G3 PASS means: the best possible T_sel-entry table's exact coverage
      reaches or exceeds the exact coverage of the realistically-selected
      T-entry table. It is a statement about the BASIN-SIZE DISTRIBUTION and
      the ESTIMATOR'S LOSS -- a CEILING. It does not assert that any online
      re-selection procedure attains that ceiling.
      G3 FAIL means: the ceiling itself lies below the comparator, so a
      T_sel-entry claim at that cell is infeasible BEFORE any algorithm runs.
      Per v2's frozen `invalidation_rules`, a G3 FAIL makes an S1/F1 claim at
      that cell UNTESTABLE, never a negative result. THIS ITEM RUNS NO S1/F1
      ARM, so that routing is inherited, not exercised.

    what_a_reviewer_needs_and_this_section_does_not_give: >-
      Stated plainly rather than left as a silent gap. This section does NOT
      specify: (i) the exact PRNG used to draw the uniform pool starts, nor its
      batching; (ii) the exact tie-break key stream. Neither can change a
      verdict at the stated precision -- (i) only changes WHICH pool of the
      same size and law is drawn, which is what the five seeds are for, and
      (ii) breaks measure-zero ties. Any P2 re-derivation MUST disclose its own
      choices for both. If a reviewer believes either DOES change a verdict,
      that is itself a finding and must be reported, not absorbed.

  # =========================================================================
  # 4. THE TESTED CELLS, THE STAGES, AND THE RUN-ID SCHEME
  # =========================================================================

  stage_plan:
    STAGE_3A:
      name: "N = 2^20 replication anchor"
      purpose: >-
        Reproduce, BY A FRESH RUN, the exact contested a-scan numbers that
        started this lane. The values in `recomputed_by_this_authorship` have
        now been read off one committed table by three arithmetic routes and
        never re-produced by an execution. STAGE 3A is that execution. It
        anchors STAGE 3B: a 2^24 result whose own 2^20 baseline does not
        reproduce is not interpretable.
      N: 1048576   # 2^20
      T: 64
      T_sel: 32
      a_grid: [0.0625, 0.125, 0.1875, 0.25]
      r_grid: [2, 4, 8]
      seeds: [1, 2, 3, 4, 5]
      basins: exact
      reading: P1 (frozen v2 instrument)
      preregistered_expectation: >-
        At r = 2: a = 1/16 pass 5/5, a = 1/8 pass 4/5 (seed 2 failing),
        a = 3/16 pass 1/5, a = 1/4 pass 0/5, with the per-seed margins listed
        verbatim in `recomputed_by_this_authorship` reproduced to at least 6
        decimal places. THIS IS A PRE-REGISTERED PREDICTION AND MAY FAIL; see
        `invalidation_rules`.
      runs: 5
      run_ids: [RUN-ECDLP-612fb1-v3-rep20-s1, RUN-ECDLP-612fb1-v3-rep20-s2, RUN-ECDLP-612fb1-v3-rep20-s3, RUN-ECDLP-612fb1-v3-rep20-s4, RUN-ECDLP-612fb1-v3-rep20-s5]
    STAGE_3B:
      name: "N = 2^24 exact-basin G3 measurement, with all controls"
      purpose: >-
        The primary cell. Answers Section 2's question at one scale above the
        a-scan, on the frozen v2 instrument, with the null, decay and
        proves-too-much controls measured in the SAME run so no control is
        drawn from a different pool than the signal it controls.
      N: 16777216  # 2^24
      T: 256
      T_sel: 128
      a_grid: [0.0625, 0.125, 0.1875, 0.25]
      a_grid_roles:
        "0.0625": "PRIMARY (a = 1/16)"
        "0.125": "PRIMARY (a = 1/8) -- the cell EXP-ECDLP-6ac801 left OPEN"
        "0.1875": "KNOWN-FALSE control (a = 3/16), Section 6"
        "0.25": "KNOWN-FALSE control (a = 1/4), Section 6 -- also the replication control against EV-ECDLP-60e266"
      r_grid: [2, 4, 8]
      r_grid_roles:
        "2": "PRIMARY"
        "4": "DECAY control, Section 5"
        "8": "DECAY control, Section 5"
      seeds: [1, 2, 3, 4, 5]
      basins: exact
      reading: P1 (frozen v2 instrument)
      arms_run: >-
        NONE beyond what the predicate needs: exact basins, TopShare(T_sel),
        the pool at each r, STATIC(T)_r by w(d), StaticCov(T, r), plus the two
        nulls of Section 5. No RESEL-L, NULL-A(online), CAP, PHI, RHO, RSWEEP
        or curve arm is run.
      runs: 5
      run_ids: [RUN-ECDLP-612fb1-v3-g3x24-s1, RUN-ECDLP-612fb1-v3-g3x24-s2, RUN-ECDLP-612fb1-v3-g3x24-s3, RUN-ECDLP-612fb1-v3-g3x24-s4, RUN-ECDLP-612fb1-v3-g3x24-s5]
    STAGE_3C:
      name: "analysis"
      purpose: >-
        Pool the five seeds per cell into the G3 verdict table, the decay
        table, the null table and the proves-too-much table; compute the
        stratified-by-seed BCa bootstrap 95% CI on each pooled margin; emit the
        cost table. Reports the G3 verdict line BEFORE any interpretive line,
        exactly as v2's frozen ordering requires.
      runs: 1
      run_ids: [RUN-ECDLP-612fb1-v3-analysis-001]
  run_id_scheme: >-
    RUN-ECDLP-612fb1-v3-<cell>-<sN>, extending the existing
    RUN-ECDLP-612fb1-v2-* convention (v2 used -v2-ascan-sN, -v2-1v2-sN,
    -v2-2v2-sN, -v2-analysis-001). v3 run ids MUST NOT collide with any
    existing RUN-ECDLP-612fb1-* directory; v1's RUN-ECDLP-612fb1-001..037 and
    v2's sixteen run records are immutable and are never touched, edited, or
    re-scored by this item.
  total_planned_runs: 11

  # =========================================================================
  # 5. CONTROLS BEFORE BELIEF
  # =========================================================================

  controls:

    NULL_A_G3:
      kind: null object of the same shape (the v2 NULL-A relabelling pattern)
      construction: >-
        On the IDENTICAL pool draw at the same (N, a, r, s), replace each pool
        entry's evidence pair (S_d, h_d) by a uniform random relabelling of the
        pool's own multiset of evidence pairs (draw the permutation from a
        declared stream seeded 300 + s, exactly the v2 NULL-A stream). Then
        select STATIC_NULL(T)_r by the SAME weight w and the SAME tie-break,
        and compute StaticCovNull(T, r) and
        margin_null_s := TopShare_s(T_sel) - StaticCovNull_s(T, r).
      why_this_is_the_right_null: >-
        The relabelling destroys exactly one thing -- the correspondence
        between an entry's accumulated evidence and its basin size -- while
        preserving N, a, r, W, cap, the map, the basin distribution, the pool
        size, the pool's evidence multiset, the weight formula and the
        tie-break. It is the same shape in every respect that is not the claim.
      predicted_signature: >-
        margin_null_s > margin_s at essentially every (a, r, s), because an
        uninformative selection must cover less than a weight-informed one.
        THE SIGNAL IS NOT margin_s > 0 ALONE. It is margin_s > 0 TOGETHER WITH
        margin_null_s COMFORTABLY LARGER -- i.e. the realistic comparator is
        materially better than an uninformative one, so a G3 PASS is a fact
        about basin structure rather than an artifact of a weak comparator.
      artifact_tell: >-
        If margin_null_s is NOT materially larger than margin_s -- i.e. if the
        relabelled, information-free selection covers about as much as the
        weight-based one -- then w(d) carries almost no information at this
        cell, and "G3 PASS" is a statement about a degenerate comparator, not
        about the basin distribution. Report it and do not read the PASS as
        support.
      reported_as: per (N, a, r, seed) margin_null, and pooled with its CI.

    NULL_B_G3:
      kind: bit-identity null (the v2 NULL-B pattern)
      construction: >-
        Compute STATIC(T)_r twice at every (N, a, r, s) through two
        independent selection code paths over the same weights and keys (v2
        already ships two: a counted streaming selector and a numpy lexsort).
        Require the two selected DP sets to be IDENTICAL as sets.
      predicted_signature: identical in every cell.
      artifact_tell: >-
        Any difference is a bookkeeping leak in the selection path and
        INVALIDATES the run set for that cell (it is not a negative result).

    DECAY_G3:
      kind: decay control -- the parameter whose increase must destroy the signal
      parameter: r, the precomputation pool ratio, over {2, 4, 8} at fixed (N, a, T_sel, s)
      mechanism: >-
        Growing r gives the realistic selector strictly more evidence to choose
        from, so StaticCov(T, r) must rise toward TopShare(T) and the margin
        TopShare(T_sel) - StaticCov(T, r) must fall. r is therefore a genuine
        destroy-the-signal knob and not merely another parameter.
      requirement: >-
        margin_s must be NON-INCREASING in r at every (N, a, s), and the cell
        verdict must go FAIL by r = 8 at every tested a.
      artifact_tell: >-
        A margin that does NOT decay in r -- flat, non-monotone beyond CI, or
        rising -- is the canonical artifact signature of
        docs/inventor-protocol.md ("a quantity that fails to decay when the
        parameter meant to destroy it increases"). It means the measured
        quantity is not the estimator-loss gap the predicate claims to measure,
        and the batch's PASS readings must then be reported as uninterpretable
        rather than as support.
      preregistered_expectation_from_committed_data: >-
        Read by this authorship from RUN-ECDLP-612fb1-v2-ascan-s1..s5 at
        N = 2^20, r = 2/4/8, T_sel = T/2 (provenance: internal). The margin is
        strictly decreasing in r in ALL 20 (a, seed) combinations tested, and
        already negative at r = 4 in every one of them:
          a = 1/16: pass 5/5 (r=2), 0/5 (r=4), 0/5 (r=8)
          a = 1/8 : pass 4/5 (r=2), 0/5 (r=4), 0/5 (r=8)
          a = 3/16: pass 1/5 (r=2), 0/5 (r=4), 0/5 (r=8)
          a = 1/4 : pass 0/5 (r=2), 0/5 (r=4), 0/5 (r=8)
        This item tests whether the same decay holds at N = 2^24. It is a
        prediction that can fail.

    EXACT_COVERAGE_NON_EXCEEDANCE:
      kind: deterministic implementation check, inherited from v2 control (f)
      requirement: >-
        StaticCov(T, r) must never exceed TopShare(T), and StaticCovNull(T, r)
        must never exceed TopShare(T), at any cell. An exceedance is
        impossible by disjointness and is an implementation error.
      artifact_tell: any exceedance stops the run as completed_invalid.

    ROUND_ZERO_AND_SEED_INTEGRITY:
      kind: run-integrity control, inherited from v2
      requirement: >-
        Exactly five distinct seeds per cell, no duplicate and no missing seed;
        raw-result.json and summary.json must agree cell for cell; the manifest
        must carry the exact command, git commit, dirty-tree state,
        environment, all seed streams, requested policy, resolved model
        identifier, wall clock and peak_rss_bytes.

  # =========================================================================
  # 6. PROVES-TOO-MUCH CONTROL (known-false objects)
  # =========================================================================

  proves_too_much:
    objects:
      - object: "a = 1/4, T_sel = T/2, r = 2, N = 2^24, frozen v2 instrument"
        why_conclusion_is_known_false: >-
          G3-feasibility at this cell is KNOWN FALSE on committed,
          independently reviewed evidence from two separate batches:
          EV-ECDLP-60e266 measured the exact top-T/2 basin share BELOW
          STATIC(T)'s exact coverage in 10 of 10 exactly enumerated seeds at
          a = 1/4 (this is the `obstruction` that batch recorded, unchanged
          and not reopened here); and EV-ECDLP-2e9680 independently reproduced
          0/5 under BOTH its blind and its production reading at exactly this
          cell (production margins -0.012918, -0.008373, -0.036196, -0.016829,
          -0.022216). Provenance: internal.
        required_outcome: "G3 FAIL, pass_count <= 3 and expected 0/5, with every per-seed margin negative."
      - object: "a = 3/16, T_sel = T/2, r = 2, N = 2^24, frozen v2 instrument"
        why_conclusion_is_known_false: >-
          EV-ECDLP-2e9680 reports a = 3/16 CONFIRMED G3-INFEASIBLE at exactly
          this cell under both readings (blind 0/5, production 0/5).
          Provenance: internal.
        required_outcome: "G3 FAIL, pass_count <= 3."
      - object: "every tested a at r = 8 (see DECAY_G3)"
        why_conclusion_is_known_false: >-
          At N = 2^20 the committed a-scan gives 0/5 at r = 8 for all four a
          values (this authorship's own reading of
          RUN-ECDLP-612fb1-v2-ascan-s1..s5). Provenance: internal.
        required_outcome: "G3 FAIL at r = 8 at every a."
    failure_signature: >-
      The SAME predicate, the SAME code path, the SAME pool procedure and the
      SAME analysis must return G3 FAIL on every object above. A PASS on any of
      them means the predicate as implemented proves too much: it would then be
      returning FEASIBLE where feasibility is already established false, and
      NO PASS ANYWHERE IN THIS BATCH -- including at a = 1/16 and a = 1/8 --
      may be read as support until that is explained. This is a STOPPING
      CONDITION for interpretation, not a negative result about the hypothesis.
    named_risk_this_authorship_flags_in_advance: >-
      a = 3/16 IS THE THIN ONE, and it is named here rather than discovered
      later. EV-ECDLP-2e9680's own controlled post-seal diagnostic, applying
      the w(d) selection rule (the rule THIS predicate binds) to a shared pool
      at N = 2^24, scored a = 3/16 at pass_by_weight = 2/5 -- against the >= 4/5
      bar, still a clean FAIL, but two seeds nearer the boundary than the
      production run's own 0/5. At N = 2^20 this authorship reads a = 3/16,
      r = 2 at 1/5. If STAGE 3B returns a = 3/16 at 4/5 or 5/5, the
      proves-too-much control has FIRED and the correct report is that this
      predicate does not discriminate at this T_sel on this instrument -- which
      would be the most informative outcome this batch can produce and must not
      be softened into "a 3/16 is borderline."

  # =========================================================================
  # 7. METRICS, STOPPING RULES, INVALIDATION, ARTIFACTS
  # =========================================================================

  metrics:
    primary:
      - "G3 verdict (PASS/FAIL), pass_count out of 5, and per-seed margin_s = TopShare_s(T_sel) - StaticCov_s(T, r), at every (N, a, r) cell. Reported BEFORE any interpretive line."
      - "pooled margin per cell with a stratified-by-seed BCa bootstrap 95% CI, resample count declared"
      - "TopShare_s(T_sel) and StaticCov_s(T, r) reported SEPARATELY beside every margin, never only their difference"
      - "STAGE 3A only: per-seed margin at (a, r = 2) against the committed RUN-ECDLP-612fb1-v2-ascan-s* value, with the absolute difference, to at least 6 decimal places"
    secondary:
      - "margin_null_s (NULL_A_G3) per (N, a, r, seed), pooled with CI, and the ratio margin_s / margin_null_s per cell"
      - "NULL_B_G3 set-identity boolean per (N, a, r, seed)"
      - "DECAY_G3: margin as a function of r in {2, 4, 8} per (N, a, seed); a monotonicity flag per (a, seed); the r at which the cell verdict first goes FAIL"
      - "exact basin-size histogram per (N, a, seed); cycle mass and capped mass as fractions of N"
      - "pool statistics per (N, a, r, seed): generating walks, capped-walk fraction, P in group operations, P / sqrt(N*T)"
      - "S and S_peak in bits under v2's frozen bits_per_entry (T_sel * 2 * n bits for the advice; the pool at r*T * (2*n + 48) bits as working storage), reported so no ratio in this batch is ever quoted without its storage sibling"

  stopping_rules:
    - "Wall clock 3600 s per run: a run exceeding it is failed_infrastructure, re-planned with a smaller shard, and NEVER interpreted (AGENTS.md rule 5)."
    - "Peak RSS 8 GB per run: exceeding it is failed_infrastructure, never a result."
    - "Stop at maximum_runs; a cell not reached is reported as NOT RUN, never as a negative."
    - "Any exact-coverage exceedance (EXACT_COVERAGE_NON_EXCEEDANCE) stops the run as completed_invalid."
    - "Any NULL_B_G3 set difference stops that cell as completed_invalid."
    - "The G3 verdict table is computed and reported BEFORE any interpretive line in every artifact, mirroring v2's frozen gate ordering."
    - "STAGE 3A must complete and be reported before STAGE 3B is INTERPRETED (it may be executed in either order, mirroring v2's own G1/G2-before-interpretation-not-before-execution practice)."

  invalidation_rules:
    - "Execution before this amendment is committed and its approving decision DEC-20260907-6d9427 is committed and post-commit-verified: no run under this item is evidence (see `binding`)."
    - "A timeout, crash, memory exhaustion or dependency failure is failed_infrastructure and is NEVER negative mathematical evidence."
    - "Duplicated or missing seeds, a manifest missing command/commit/dirty-tree/environment/seeds/requested policy/resolved model, or raw-result.json disagreeing with summary.json: invalid."
    - "Any StaticCov or StaticCovNull exceeding TopShare(T): invalid, impossible by disjointness."
    - "A NULL_B_G3 selection-set difference: bookkeeping leak, invalid."
    - "PROVES-TOO-MUCH FIRING (G3 PASS at a = 3/16 or a = 1/4 at r = 2, N = 2^24, or at r = 8 at any a): NOT invalid and NOT a negative result -- it is a STOPPING CONDITION FOR INTERPRETATION. Report every measurement, report the firing explicitly and first, and do not report any PASS in this batch as support until the Coordinator has adjudicated it."
    - "STAGE 3A failing to reproduce the committed a-scan per-seed margins (`recomputed_by_this_authorship`) beyond floating-point tolerance: NOT a negative result about the hypothesis -- it is an INSTRUMENT DISCREPANCY between this item's implementation and the frozen v2 a-scan implementation, and STAGE 3B becomes uninterpretable until it is explained. Report it as such."
    - "DECAY_G3 non-decay (margin flat or increasing in r beyond CI at any (N, a)): the measured quantity is not what this predicate claims to measure; report every reading and treat the batch's PASS readings as uninterpretable, per docs/inventor-protocol.md 'controls before belief'."
    - "Any post-hoc change to the a-grid, the r-grid, the seed set, T_sel, the >= 4/5 threshold, the weight formula w(d) = S_d + 4*W*h_d, or any control above: requires a further versioned protocol_amendment. Runs already executed are never re-scored."
    - "Reading TRUE BASIN SIZE anywhere in the SELECTION path (as opposed to the SCORING path): invalid. This is the exact confound EXP-ECDLP-6ac801's a = 1/8 disagreement traced to, and it is now a named invalidation rule rather than an unstated assumption."

  # -------------------------------------------------------------------------
