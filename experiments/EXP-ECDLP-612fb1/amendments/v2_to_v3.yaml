  # 10. BUDGET -- SIZED TO A 4-CORE, 15 GB CONTAINER
  # =========================================================================

  budget:
    wall_clock_seconds_per_run: 3600
    maximum_memory_gb: 8
    maximum_runs: 14
    maximum_workers: 1
    total_cpu_hours: 2
    enforcement: >-
      Wall clock and memory are MACHINE PROTECTION and bind (CLAUDE.md
      "Research budgets: progress first" keeps machine limits in force while
      making research cost estimates advisory). total_cpu_hours and
      maximum_runs are advisory estimates and may be revised upward without
      further approval if the actual run needs more.
  budget_note: >-
    THE MEMORY QUESTION IS ANSWERED FROM MEASURED, COMMITTED DATA, NOT
    ESTIMATED. N = 2^24 EXACT BASINS FIT COMFORTABLY.
    Evidence: experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v2-1v2-s1/manifest.yaml
    records peak_rss_bytes 643100672 (about 0.60 GiB, peak_rss_within_limit
    true) for a STRICTLY HEAVIER N = 2^24 workload -- exact basins PLUS the
    full v2 arm list (STATIC, STATIC2T, RHO, RESEL-L, NULL-A, CAP, ORACLE at
    two T_sel values, U up to 16T). This item runs exact basins, pools and
    selections ONLY, with no online arms, and processes one a-value at a time
    (each basin structure released before the next is built). Its ceiling is
    therefore BELOW that measured 0.60 GiB, against a declared 8 GB ceiling --
    more than 13x headroom. The structural arithmetic agrees: at N = 2^24 the
    pointer-jumping closure holds one int32 successor array (67 MB), one int32
    distance array (67 MB), a transient uint64 index array (134 MB, released),
    and two int32 temporaries per doubling round (134 MB), i.e. a few hundred
    MB.
    N = 2^30 EXACT BASINS DO NOT FIT AND ARE NOT ATTEMPTED. The same arithmetic
    at N = 2^30 gives 4.3 GB + 4.3 GB for the two persistent int32 arrays plus
    4.3 GB of transient per doubling round -- at least 13 GB, against a 15 GB
    host that must also hold the interpreter, numpy and the OS. That is a
    memory-infeasible cell and dispatching it would produce an infrastructure
    stop and nothing else (the recorded cost of exactly that mistake is
    GOAL-DREG-001 BATCH-006 item C1). N = 2^24 IS THE LARGEST N AT WHICH THIS
    ITEM DECLARES EXACT BASINS, which is also v2's own frozen restriction
    ("ORACLE stays exact-only at N <= 2^24"). No sampled 2^30 reading is added
    by this amendment.
    WALL CLOCK. Measured, committed: RUN-ECDLP-612fb1-v2-ascan-s1 ran the
    12-point a-scan at N = 2^20 across r in {2, 4, 8} in 4.027 s wall
    (0.27-0.42 s per a-cell); RUN-ECDLP-612fb1-v2-1v2-s1 ran the far heavier
    N = 2^24 stage in 11.856 s wall. STAGE 3A is a 4-point a-grid at N = 2^20
    (smaller than the measured 12-point scan). STAGE 3B is a 4-point a-grid at
    N = 2^24 with nulls; exact-basin work scales about 16x from 2^20, so the
    honest expectation is tens of seconds to a few minutes per seed. The 3600 s
    per-run ceiling is v2's own frozen value, carried unchanged, and leaves
    roughly two orders of magnitude of headroom.
    CONCURRENCY. maximum_workers: 1 per run, and the batch's queue declares
    max_concurrent: 2 (GOAL-ECDLP-bbc21f's own machine-headroom figure for this
    4-core, 15 GB container). The dispatch chain here is strictly serial except
    for the Validator/Red-Team pair, which run no experiment-scale compute and
    are budgeted at 4 GB each (8 GB combined, inside 15 GB). The executor runs
    with nothing else in flight.
    RUN COUNT. 5 (STAGE 3A) + 5 (STAGE 3B) + 1 (STAGE 3C) = 11 planned, plus 3
    spare for recorded infrastructure re-runs = maximum_runs 14.

