    the `review-breakthrough` policy at `max`, per
    orchestration/model-policies.yaml `routing_rules` id
    `unrecoverable-result-review` (`contradicts_prior_evidence: true`), with an
    independent Validator (TASK-20260907-b2a8ad, blind re-derivation of the
    load-bearing quantity) and an independent Red Team (TASK-20260907-ee1ca7,
    proves-too-much, nulls, decay, cost/scope), mutually blind, under a
    review_plan written before either runs. See
    ledger/handoffs/TASK-20260907-b2a8ad.yaml `review_plan` (mirrored on
    TASK-20260907-ee1ca7's handoff). No run under this item is evidence before
    that chain -- snapshot archive, both reviews, then the ledger archive --
    completes and is post-commit-verified.
  blind_rederivation_required: >-
    YES, and it is the reason Section 3 is written the way it is. The
    load-bearing quantity is the G3-feasibility VERDICT (pass_count out of 5,
    and the per-seed margin SIGNS) at T_sel = T/2, r = 2, N = 2^24, at
    a = 1/16 and a = 1/8. The Validator re-derives it under reading P2 from
    Section 3 and the parameter table ALONE, SEALS the result (a hashed,
    timestamped artifact) BEFORE opening any `blind_from` path, and only then
