    - "coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/tasks/TASK-20260907-aad514/artifact_inventory.json"

  # =========================================================================
  # 8. THE REVIEW THIS ITEM REQUIRES
  # =========================================================================

  review_required: true
  review_note: >-
    CLAIM-RELEVANT AND CLAIM-CHANGING. A confirmed G3 PASS at a in {1/16, 1/8}
    at N = 2^24 REOPENS clause (C1) of H-ECDLP-37dc01 -- the original
    T_sel = T/2 claim -- at a smaller a than the hypothesis's own stated
    test_boundary, and resolves a recorded DISAGREEMENT inside the committed,
