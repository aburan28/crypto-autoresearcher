      verdict: holds
      finding: >-
        outcome_label was opened only after the blind arithmetic below
        was recorded. NULL_LO=0.5, NULL_HI=2.0, SLICE_MIN=4.0. O-NULL
        requires every W/U ratio in [0.5, 2]. O-SLICE requires every
        ratio >= 4. The residual is O-INCONCLUSIVE, and it is reached
        only after rate(P) is 1 and rate(U) matches image/r. Both
        archived ratios are 0, rate(P) is 1, and rate(U) equals
        image/r. The hypothesis text for O-INCONCLUSIVE says ratios in
        (2, 4) or seed disagreement. These rows are not that case.
        The code residual is what fired. The run is not relabeled.
        Ratio 0 is not E-NULL and not E-SLICE. sw is 32 and 36, so a
        zero intersection is not a scoped rejection of occupancy.
    - id: J3
      label: J3 census identities and replay
      verdict: holds
      finding: >-
        Blind values agree with the archived census. Temp Stage-1
        replay returned O-INCONCLUSIVE with rate(P)=1 and rate(W)=0
        on both seeds.
