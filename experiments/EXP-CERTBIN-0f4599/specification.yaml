# =============================================================================
# EXP-CERTBIN-0f4599 -- VERSION 1 (APPROVED by DEC-20261003-f561a3) frozen
# contract for H-CERTBIN-a3d441: target-law separation of the tuple ceiling
# (U / P / W) on E_0 over F_{2^19}. Source: IDEA-20260930-f1d8ff under
# RQ-CERTBIN-836ce2 / GOAL-ECDLP2M-001.
#
# ZERO RUNS in this design packet. Stages 0-1 authorized for executor
# TASK-20261003-c3b10e. No AUXIN. Amazon Bedrock prohibited. NO break.
# NO attack. NO exponent. Toy n=19 only. Runnable command surface below.
# Sibling d2d20c is a different observable; not this contract.
# =============================================================================
experiment:
  id: EXP-CERTBIN-0f4599
  hypothesis_id: H-CERTBIN-a3d441
  question_id: RQ-CERTBIN-836ce2
  source_idea: IDEA-20260930-f1d8ff
  goal_id: GOAL-ECDLP2M-001
  goal_ids: []
  goal_ids_note: >-
    Shared GOAL-ECDLP2M-001.yaml is not edited in this archive (concurrent
    lanes). Operative next_action lives on DEC-20261003-f561a3.
  version: 1
  title: >-
    Law-index control: do uniform, planted, and independent x-slice hit
    rates on one enumerable n=19 m=3 cell obey the null, or concentrate?
  status: approved
  approved_by: DEC-20261003-f561a3
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261003-f561a3 under AGENTS.md standing
    user authorization (2026-09-06), in fact only after snapshot
    TASK-20261003-be9568 verifies against Git. No Magma/Sage/AUXIN/Bedrock.
    No ECC2K-130 solve. No n>=131 attack. Stage 2 not present.
  assigned_to: executor
  approval:
    approved_by: DEC-20261003-f561a3
    composing_decision: DEC-20261003-f561a3
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06)
      once the protocol was complete (all required fields non-null).
      Approval does not assert the hypothesis is true.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    On E_0 / F_{2^19}, m=3, smallest admissible B, measure exact rate(U),
    rate(P), rate(W) on two independent (V,W) seeds and emit exactly one
    O-* label from {O-NULL, O-SLICE, O-INCONCLUSIVE, O-ARTIFACT,
    O-IMPEDIMENT}.

  class: heuristic_validation
  class_note: >-
    Control / law-index instrument. Pre-registered null vs slice bands.
    Not an exponent-moving breakthrough; sota_delta zero.

  claim_tier_and_scope:
    claim_tier: toy
    statement: >-
      Hit-rate law comparison on one enumerable cell: n=19, E_0, m=3,
      unordered 3-multiset factor-base sums. No Certicom instance.
    sota_delta: zero on every ECDLP cost axis
    dominated_by: >-
      Pollard rho on this subgroup dominates any reading of a 10^4-size
      sumset census. This experiment does not compete with rho.
    certificate_kind: instrument_checksum
    certificate_note: >-
      Planted targets must lie in the enumerated image. Twin C(B+2,3).
      No discrete logarithm is claimed.
    affected_vs_safe: No deployed or standardized curve is touched or affected.

  scope:
    included:
      - >-
        Stage 0. Freeze curve.json (order, r, irreducible modulus),
        cells.json (two (V,W) pairs, B, C, F_V, S_W),
        preregistered-predictions.json (null band, slice min, birthday).
        Twin mul, twin add, twin C, planted-on-curve probe.
      - >-
        Stage 1. Enumerate unordered 3-multiset image; exact rate(U)=|image|/r;
        exact rate(W)=|image ∩ S_W|/|S_W|; planted 200-draw checksum rate(P);
        write stage1/panels.json, stage1/control-table.json, RESULTS.md.
    excluded:
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Gröbner / SAT solvers.
      - Reopening EXP-CERTBIN-8bdf86 / 591d28.
      - Restating the uniform-law cap of IDEA-20260926-3c6a19 / 4b65e3.
      - Designing or running the d2d20c k-orbit collision observable.
      - Editing shared GOAL-ECDLP2M-001.yaml.
      - Treating infra failure as mathematical evidence.

  execution_surface:
    trial_plan: experiments/EXP-CERTBIN-0f4599/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-CERTBIN-0f4599/implementation/run.py --stage 0
      --trial-plan experiments/EXP-CERTBIN-0f4599/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-CERTBIN-0f4599/implementation/run.py --stage 1
      --trial-plan experiments/EXP-CERTBIN-0f4599/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. Twin meters: mul, add,
      C(B+2,3). {run_dir} is substituted by the process supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20260930-f1d8ff.yaml
    hypothesis: ledger/hypotheses/H-CERTBIN-a3d441.yaml
    n: 19
    m: 3
    equation: y^2 + xy = x^3 + 1
    modulus: t^19 + t^5 + t^2 + t + 1
    expected_order: 523492
    p_ceil_floor: 0.015625
    max_C: 10000000
    n_targets: 200
    seeds: [2026100319, 2026100320]
    null_band: [0.5, 2.0]
    slice_min: 4.0

  controls:
    - name: planted_P
      definition: >-
        Law P must hit (rate 1). A miss falsifies the instrument, not the
        curve. Null object of the same shape as U and W.
    - name: independent_W
      definition: dim(W ∩ V) = 0 on every accepted seed; else reject the seed.
    - name: two_seeds
      definition: Seed pair A=2026100319 and holdout B=2026100320, same B rule.
    - name: twin_C
      definition: stars-and-bars C(B+2,3) equals nested-loop multiset count.
    - name: twin_mul
      definition: Field.mul_school == mul_expand on 64 random pairs.
    - name: twin_add
      definition: Curve.add_a == add_b on a probe pair.
    - name: torsion_nearby
      definition: >-
        Same formula with N=4 has ceiling ≥ 1 once C ≥ 4; "a miss is
        expected" is false there.
    - name: order_checksum
      definition: Point count must equal 523492 before any rate is read.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_census]
    - name: law
      levels: [U, P, W]
    - name: seed
      levels: [2026100319, 2026100320]

  metrics:
    primary:
      - name: rate_U
        unit: dimensionless
        definition: "|image|/r from exact census"
      - name: rate_P
        unit: dimensionless
        definition: planted-hit fraction on 200 draws (must be 1)
      - name: rate_W
        unit: dimensionless
        definition: "|image ∩ S_W| / |S_W|"
      - name: rate_W_over_rate_U
        unit: dimensionless
        definition: law-W hit rate divided by law-U hit rate
    secondary:
      - name: branching_b
        unit: dimensionless
        definition: C / |image|
      - name: L_bits
        unit: bits
        definition: coverage gap log2(r) - log2(|image|)
      - name: group_additions_charged
        unit: count
      - name: B
        unit: count
      - name: C
        unit: count

  heuristic_under_test: HEUR-CERTBIN-f1d8ff-H1

  preregistered_prediction:
    quantity: >-
      rate(U)=|image|/r; rate(P)=1; rate(W)/rate(U) in [1/2, 2] (null) or
      ≥ 4 on every seed (slice). Birthday b = 1 + Theta(C/r) for C ≤ r/64.
    formula: >-
      p_ceil = min(1, C(B+2,3)/r); occupancy image deficit Theta(C^2/r).
    source: >-
      ledger/proposals/IDEA-20260930-f1d8ff.yaml (H1); frozen before Stage 1
      in stage0/preregistered-predictions.json. Recalled Feller occupancy
      is a pointer, not support.

  scale_relevance:
    tier: toy
    justification: >-
      Direct enumeration at n=19 only. No transfer of the measured ratio
      to m=83 or m=131. The counting identity C/r transfers as an identity,
      not as a measured concentration.
    correspondence: null

  tail_checks:
    - Heaviest fiber > 8 at this C/r is a birthday-tail failure (record, do not silently drop).
    - Twin C or planted miss voids the table (O-ARTIFACT).

  seeds_and_replication:
    seed_a: 2026100319
    seed_b: 2026100320
    n_targets: 200
    independent_instances: 2
    note: Two (V,W) pairs. Exact census is the replication instrument.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 2.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen curve/cells/preregistered-predictions.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-CERTBIN-a3d441.
    - maximum_runs = 4.
    - Stop if C > 10^7 or C/r < 2^{-6} after the B rule cannot be met.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - rate(P)<1 or twin failure → O-ARTIFACT; do not read law comparison.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an n≥131 exponent move → protocol invalid.
    - Using C(B,3) instead of C(B+2,3) → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with order checksum and twin_ok; Stage 1
    produces exact rate(U), rate(W), rate(P) per seed (or a named
    O-ARTIFACT/O-IMPEDIMENT stop); RESULTS.md names exactly one O-* label
    from H-CERTBIN-a3d441 with cited artifacts.

  falsification_criterion: >-
    Any of: planted miss; post-hoc band edit; a claimed break/exponent
    under this card. (O-SLICE is a valid scientific negative of O-NULL,
    not a protocol fail. O-NULL is a valid negative of O-SLICE.)

  required_artifacts:
    - experiments/EXP-CERTBIN-0f4599/trial-plan-v1.json
    - experiments/EXP-CERTBIN-0f4599/stage0/preregistered-predictions.json
    - experiments/EXP-CERTBIN-0f4599/stage0/curve.json
    - experiments/EXP-CERTBIN-0f4599/stage0/cells.json
    - experiments/EXP-CERTBIN-0f4599/stage1/
    - experiments/EXP-CERTBIN-0f4599/RESULTS.md
    - experiments/EXP-CERTBIN-0f4599/runs/<RUN-CERTBIN-*>/
    - experiments/EXP-CERTBIN-0f4599/implementation/run.py
    - experiments/EXP-CERTBIN-0f4599/implementation/check.py

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
