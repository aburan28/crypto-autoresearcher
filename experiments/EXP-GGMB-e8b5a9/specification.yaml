experiment:
  id: EXP-GGMB-e8b5a9
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-070d03
  question_id: RQ-GGMB-6eaabc
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE FACTOR-BASE MEMBERSHIP ORACLE, ADJUDICATED PROPERLY: it is the one place index calculus
    genuinely leaves the generic group model, and it is nevertheless worthless, because at arity 1
    a FREE membership oracle yields an algorithm whose optimum is exactly rho at N/(2 sqrt(L)) draws
    with L = N, while at arity m >= 2 the useful object is not membership but DECOMPOSITION, whose
    prime-field cost is unbounded by any Bezout argument since -- with no proper subfield and hence
    no Weil restriction -- a size-L subset of F_p has vanishing degree exactly L, whereas the subfield
    factor base over F_{q^n} is cut out by n-1 LINEAR conditions'
  status: draft
  objective: "(A) THE ORACLE AND WHY IT IS THE INTERESTING ONE. FBMEM_S(h) returns the bit [ x(h)\
    \ in S ] for a declared set S subset F_p of size L. Unlike every other oracle this campaign has\
    \ named, its answer is NOT a function of the linear form lambda(h): two instances with identical\
    \ generic transcripts can give different membership answers, because membership depends on the\
    \ concrete encoding. THIS IS THE GENUINE ESCAPE FROM THE GENERIC GROUP MODEL, and it is the one\
    \ that historically matters: it is the resource index calculus consumes, it is resource R1, and\
    \ it is why KN-TECH-005's bound has never been a proof that ECDLP is hard.\n(B) THE FIRST ADJUDICATION,\
    \ WHICH IS THE EASY ONE. NON-SIMULABLE, in the (N-weak) sense of IDEA-20260807-63056d: no simulator\
    \ that is a function of lambda alone is correct. Witness, exhibitable at toy scale: fix E, P,\
    \ Q and two distinct sets S_1, S_2 of the same size; the generic transcript is identical and the\
    \ answers differ. That establishes (N-weak) and nothing more, and the record says so rather than\
    \ claiming (N-strong).\n(C) THE SECOND ADJUDICATION, WHICH IS THE ONE THAT MATTERS, AND THE ANSWER\
    \ IS THAT NON-SIMULABILITY BUYS NOTHING. FBMEM is SELF-COMPUTABLE: a real adversary holds the\
    \ concrete coordinates of P and Q and knows the linear form (alpha, beta) it used to build h,\
    \ so it computes [alpha]P + [beta]Q and tests x in S itself, in O(log N) field operations. The\
    \ oracle hands it nothing. In the IDEA-20260807-5876b8 taxonomy this is cell (b), verdict PUB.\
    \ The correct reading is NOT \"the oracle is closed\" but \"THE ORACLE FRAMING IS EMPTY\": the\
    \ question is and always was about the cost of an ALGORITHM, never about access to a bit.\n(D)\
    \ THE GENERATION CLAIM, WHICH COLLAPSES SEVERAL LANES' ORACLES AT ONCE. Every R1/R2 oracle this\
    \ campaign has named factors through the single coordinate map x : G -> F_p up to a publicly computable\
    \ function:\n  FBMEM_S = 1_S composed with x -- a publicly computable predicate;\n  MODEL-CHANGE\
    \ (Weierstrass -> Montgomery / Edwards / Hessian / Jacobi-\n    quartic / theta) = a publicly\
    \ computable birational map applied to\n    (x, y) -- so a model-change oracle is INTER-COMPUTABLE\
    \ with the\n    coordinate oracle and adds exactly zero;\n  SUMMATION-POLYNOMIAL ROOT-FINDING\
    \ at supplied field elements = a publicly\n    computable root-find;\n  any \"x-coordinate in\
    \ an interval / has small Hamming weight / lies in a\n    prescribed algebraic set\" predicate\
    \ = a publicly computable predicate.\nTherefore THE R1/R2 FAMILY HAS ONE GENERATOR, x, AND IT\
    \ IS FREE. Lane L11 (curve models) consumes no resource its lane L1 sibling does not already have;\
    \ a model change can alter the SHAPE OF THE FACTOR BASE and hence the cost of decomposition, and\
    \ that -- not any new oracle -- is the only thing L11 can be about. This is a redirection for\
    \ L11, not a closure of it.\n(E) THE ARITY SPLIT, WHICH IS THE ACTUAL EXPLANATION OF WHY THE ESCAPE\
    \ HAS NOT BEATEN RHO OVER PRIME FIELDS. Give the adversary FBMEM for free and count.\n  ARITY\
    \ 1. Draw random R_j = [a_j]P + [b_j]Q and query FBMEM. A random point\n    lies in the factor\
    \ base with probability about 2L/N (the factor 2 because\n    x determines the point up to sign).\
    \ A hit gives one congruence\n    a_j + b_j*k = +-e_i (mod N) where e_i = log_P(P_i) is a NEW\
    \ UNKNOWN. The\n    system closes only when two hits land on the SAME factor-base element, at\n\
    \    which point subtracting gives k. By the birthday bound that needs about\n    sqrt(L) hits,\
    \ hence about sqrt(L) * N/(2L) = N/(2 sqrt(L)) draws. This is\n    MINIMISED AT L = N, where it\
    \ equals sqrt(N)/2 draws -- and at L = N the\n    \"factor base\" is the whole group and the membership\
    \ oracle is vacuous.\n    CONCLUSION: an unlimited free membership oracle at arity 1 gives an\n\
    \    algorithm that is exactly Pollard rho, whose optimum is attained by\n    throwing the factor\
    \ base away. Non-simulable, free, and provably\n    worthless -- the third member of the KN-FIND-b7e091\
    \ \"non-simulable but\n    useless\" family, and the first one with a cost formula attached.\n\
    \  ARITY m >= 2. The useful object is not membership but DECOMPOSITION: given\n    a target R,\
    \ RETURN m factor-base elements summing to it. With\n    L = (m! N)^{1/m} a random R decomposes\
    \ with constant probability, L + 1\n    relations suffice, and the QUERY COUNT is about L = N^{1/m},\
    \ which is\n    sub-birthday for every m >= 3. SO THE ESCAPE IS REAL IN THE QUERY MODEL,\n   \
    \ and the entire prime-field ECDLP question is the CHARGED COST C of one\n    decomposition. This\
    \ is why the honest verdict for the decomposition\n    oracle is COST (cell c) and not a closure,\
    \ and why this lane must not\n    report index calculus as closed by Shoup (see IDEA-20260807-7270d1).\n\
    \n(F) WHY C IS LARGE OVER F_p AND SMALL OVER F_{q^n}, STATED AS A DEGREE FACT RATHER THAN AS FOLKLORE.\
    \ The decomposition condition is S_m(x_1, .., x_m, x(R)) = 0 together with \"x_i lies in the factor\
    \ base\".\n  OVER F_{q^n} with the subfield factor base {x in F_q}: after Weil\n    restriction\
    \ each x_i becomes an n-tuple of F_q-coordinates and the\n    condition x_i in F_q becomes n-1\
    \ LINEAR equations on that tuple --\n    DEGREE 1. The system's Bezout bound is then controlled\
    \ by deg S_m alone\n    and is independent of the factor-base size; this is the structural reason\n\
    \    Gaudry/Diem-style index calculus beats rho over extension fields.\n  OVER F_p: n = 1, there\
    \ is no Weil restriction and no proper subfield. The\n    smallest-degree polynomial vanishing\
    \ on a size-L subset of F_p has degree\n    EXACTLY L -- for every subset, including intervals,\
    \ random sets and root\n    sets of chosen polynomials, since a monic polynomial vanishing on\
    \ L\n    points has degree at least L. So the membership condition contributes\n    degree L per\
    \ variable, the Bezout bound on the decomposition system\n    scales like L^m * deg S_m, and at\
    \ the useful L = N^{1/m} that is already\n    about N. NO CHOICE OF PRIME-FIELD FACTOR BASE ESCAPES\
    \ THIS, because the\n    obstruction is a counting fact about subsets of F_p, not a defect of\
    \ any\n    particular choice.\nThat is the precise content of KN-FIND-5c1a03's \"non-algebraic\
    \ factor base forced by Bezout\", written as a degree computation that a toy experiment can check.\n\
    (G) THE DISCRIMINATING EXPERIMENT, AND IT HAS A GENUINE TWO-WAY OUTCOME. Three factor bases MATCHED\
    \ ON SIZE L and differing only in structure -- (a) an interval [0, L), (b) a uniformly random\
    \ subset, (c) the root set of a chosen degree-L polynomial -- must, by (F), give the SAME decomposition\
    \ cost over F_p, because all three have vanishing degree exactly L. A fourth arm, OUT OF SCOPE\
    \ AND LABELLED AS SUCH, is the subfield factor base over F_{q^2} at matched total field size,\
    \ which by (F) must be CHEAPER. If (a), (b), (c) differ, (F)'s degree argument is incomplete and\
    \ there is prime-field factor-base structure this program has not identified -- which would be\
    \ the most valuable outcome available in the entire campaign. If the F_{q^2} arm is NOT cheaper,\
    \ the instrument is broken and no negative from it is citable."
  resource_label: R1 (x-coordinates as field elements) -- CLAIMED AND GENUINE. This is the one proposal
    in this lane whose oracle really does consume a non-generic resource. The audit's verdict is that
    the resource is real, free, and insufficient at arity 1; at arity m the resource is real and the
    binding quantity is a COST, not an oracle.
  admissibility: admissible
  admissibility_argument: 'ADMISSIBLE, and it is the only oracle in this lane''s nine proposals that
    is. FBMEM''s answer is not a function of the group-operation transcript: it reads the x-coordinate
    as a field element, which is exactly resource R1 in DECOMPOSITION.md section 2 and exactly the
    blind spot KN-TECH-005 names ("the bound is about the generic model; it says nothing about attacks
    exploiting concrete structure"). The admissibility filter passes it. What this record then shows
    is that passing the filter is necessary and nowhere near sufficient, which is the campaign''s
    own decision target stated from the other side.'
  reachability_gate: 'NOT APPLICABLE in the curve-motion sense: no isogeny walk is proposed and no
    curve is changed. The analogous gate that DOES bind here is the factor-base reachability question,
    and the record states it explicitly: a good factor base is useful only if it is (i) common enough
    to hit by random choice or (ii) recognisable by a local test. Claim (F) predicts there is no good
    prime-field factor base to reach, which discharges the gate by emptiness rather than by cost --
    and Arm B, the uniformly random factor base, is precisely the test of whether random choice suffices.'
  inputs:
    procedure: 'STAGE 0 (zero compute, 2 hours): the two adjudications, the arity-1 cost derivation,
      the generation table, the degree fact. Plus a literature scout for an existing matched-size
      factor-base-structure comparison; log any hit to knowledge/literature/. STAGE 1 (toy compute,
      <= 30 min, HARD GATE): the arity-1 measurement. Draw random combinations, query a locally implemented
      membership predicate, count draws to closure, fit against N/(2 sqrt(L)) over the L ladder. This
      is cheap, needs no Groebner engine, and if the fit fails the rest of the design is built on
      a broken derivation. STAGE 2 (toy compute, HARD GATE): the two planted controls -- planted decomposition
      must be found; Arm D must be cheaper. Both blocking. STAGE 3 (toy compute, hours): the four-arm
      matched-size measurement at m = 3, three sizes, five seeds, with the L ladder. STAGE 4 (zero
      compute): the charged accounting of Step 6 and the write-up, with every number naming its arity,
      L, prime, seed and solver.'
    mechanism: "STEP 1 (zero compute) -- THE TWO ADJUDICATIONS. Write the (N-weak) non-simulability\
      \ witness and the poly-time self-computation. Verdict PUB. Record that the verdict is a REDIRECTION\
      \ and not a closure.\nSTEP 2 (zero compute) -- THE ARITY-1 COST DERIVATION of (E). Derive N/(2\
      \ sqrt(L)) draws and its minimum sqrt(N)/2 at L = N. State the conclusion in the form that makes\
      \ it checkable: at arity 1 the optimal factor base is the whole group, i.e. there is no factor\
      \ base.\nSTEP 3 (zero compute) -- THE GENERATION CLAIM of (D). For each named R1/R2 oracle write\
      \ the publicly computable map that reduces it to x. Publish the table. This is what closes L11's\
      \ oracle framing.\nSTEP 4 (zero compute) -- THE DEGREE FACT of (F). State and prove: a nonzero\
      \ polynomial over F_p vanishing on a set of size L has degree at least L; the subfield condition\
      \ over F_{q^n} becomes n-1 linear conditions after Weil restriction. Two elementary facts whose\
      \ CONTRAST is the whole content.\nSTEP 5 (toy compute, the experiment) -- THE MATCHED-SIZE FOUR-ARM\
      \ MEASUREMENT. At p <= 2^20, fix a curve, fix a target R, fix arity m = 3, and fix factor-base\
      \ size L. Build the decomposition system and measure, per arm: Groebner solving degree, first-fall\
      \ degree, Macaulay matrix dimension at the solving degree, wall-clock, and DECOMPOSITION SUCCESS\
      \ RATE.\n  ARM A: interval factor base [0, L).\n  ARM B: uniformly random subset of size L (THE\
      \ NULL: matched on size, no\n    structure whatsoever).\n  ARM C: root set of a chosen degree-L\
      \ polynomial with structured\n    coefficients (e.g. a Chebyshev-like or Artin-Schreier-like\
      \ family), to\n    test whether ANY prime-field algebraic structure helps.\n  ARM D, OUT OF\
      \ CAMPAIGN SCOPE AND LABELLED AS SUCH: E over F_{q^2} with\n    q^2 approximately p and the\
      \ subfield factor base {x in F_q}, matched on\n    L and on m. This is the POSITIVE CONTROL\
      \ for \"algebraic factor base\n    helps\"; if it is not cheaper, the instrument cannot detect\
      \ the effect it\n    is looking for and Arms A-C prove nothing.\nRepeat over 5 seeds and 3 sizes.\n\
      STEP 6 (zero compute) -- THE CHARGED-COST ACCOUNTING. For each arm compute q * C + g against\
      \ 0.886 * sqrt(N), with q the measured relation count needed and C the measured per-decomposition\
      \ cost, so that the record ends in the cell-(c) arithmetic rather than in a verdict word."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - ARM B, uniformly random size-L factor base (matched null, blocking)
  - ARM D, F_{q^2} subfield factor base (planted signal, blocking, and explicitly OUT OF CAMPAIGN
    SCOPE -- a scope-boundary control, never evidence about prime fields)
  - planted decomposition of the target inside the factor base (solver sanity, blocking)
  - L ladder {N^{1/4}, N^{1/3}, N^{1/2}, N^{2/3}} as the decay test
  - 'factored group order and largest prime factor per curve (KN-TECH-030 hygiene), and #E != p (KN-TECH-033
    hygiene)'
  - matched Pollard rho with negation and matched BSGS on identical instances, counted in the same
    operation unit
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, and it is ARM B. The uniformly random
    size-L subset is the matched null: same size, same expected decomposition probability, zero structure.
    Prediction (F) says Arms A, B and C are INDISTINGUISHABLE; if Arm A or C beats Arm B on solving
    degree by more than the seed-to-seed spread, prime-field factor-base structure exists and the
    degree argument is incomplete -- the campaign''s best available outcome. DECAY PARAMETER: the
    factor-base size L, on a ladder L in {N^{1/4}, N^{1/3}, N^{1/2}, N^{2/3}}. The degree argument
    predicts the Bezout bound and the observed solving degree grow with L for ALL arms identically;
    a structural advantage in Arm A or C should SHRINK as L grows toward N (where every set is unstructured).
    A putative advantage that does NOT decay as L grows is the canonical artifact tell. PLANTED-SIGNAL
    CONTROL: ARM D, the out-of-scope F_{q^2} subfield factor base, which by (F) MUST be cheaper. An
    instrument that cannot see Arm D''s advantage cannot see factor-base structure at all, and every
    Arm A/B/C null it produces is void rather than negative. SECOND PLANTED CONTROL: a factor base
    constructed to contain a KNOWN decomposition of the target R. The decomposition oracle must find
    it; a solver that misses a planted solution is broken.'
  independent_variables: []
  metrics:
    primary:
    - draws to closure vs L at arity 1, with the fitted exponent
    - Groebner solving degree, first-fall degree, Macaulay dimension per arm
    - decomposition success rate and per-decomposition wall-clock (this is C)
    - relations needed to closure (this is q)
    secondary:
    - q*C + g against 0.886*sqrt(N) per arm
    - pass/fail of both planted controls
    - factored order and largest prime factor per curve
  heuristic_under_test: null
  preregistered_prediction:
    quantity: expected number of random draws to recover k with a free arity-1 membership oracle,
      as a function of factor-base size L, measured at p <= 2^20
    formula: Fits N/(2 sqrt(L)) within 25 percent across L in {N^{1/4}, N^{1/3}, N^{1/2}, N^{2/3}},
      and the measured minimum over L is attained at the largest L tested. A fit that fails means
      the uniformity heuristic HEUR-1 is wrong for this walk and the derivation must be redone; a
      minimum attained at SMALL L would mean the arity-1 factor base genuinely helps, which contradicts
      the derivation and is the single most interesting negative outcome available here.
    source: pre-registered in IDEA-20260807-070d03 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - SIZE-STRUCTURE CONFLATION. Any comparison of factor bases must match on SIZE, or a difference
    in decomposition probability is mistaken for a difference in structure. Every arm uses exactly
    L elements and the design says so three times because this is the error that would invalidate
    everything.
  - SOLVER STRATEGY. Solving degree depends on monomial order and selection strategy. All arms must
    use the identical solver configuration and it must be recorded; a cross-arm comparison with differing
    configurations measures the configuration.
  - SMALL-p ARTIFACTS. At p <= 2^20 the field equations and accidental coincidences can dominate.
    The prime ladder must span enough range to see whether the arm ordering depends on p at all; an
    ordering that appears at one prime and vanishes at another is noise.
  - ARM D SCOPE LEAKAGE. Arm D is over an EXTENSION field and is outside this campaign's declared
    scope. It is a control on the instrument and may never appear in a conclusion about prime fields.
    This is a documentation risk, not a technical one, and it is the most likely way this record gets
    misread.
  - ARITY-1 WALK CORRELATION. If the arity-1 draws are produced by a rho-style walk rather than independent
    draws, the birthday constant changes and the fit degrades for reasons unrelated to the claim.
    Independent draws are specified.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Fits N/(2 sqrt(L)) within 25 percent across L in {N^{1/4}, N^{1/3}, N^{1/2},
    N^{2/3}}, and the measured minimum over L is attained at the largest L tested. A fit that fails
    means the uniformity heuristic HEUR-1 is wrong for this walk and the derivation must be redone;
    a minimum attained at SMALL L would mean the arity-1 factor base genuinely helps, which contradicts
    the derivation and is the single most interesting negative outcome available here.
  falsification_criterion:
  - The arity-1 draw count does not fit N/(2 sqrt(L)) within 25 percent. The uniformity heuristic
    or the derivation is wrong; the arity-1 conclusion is withdrawn and the arity-m design is re-examined,
    since it shares the heuristic.
  - Arms A or C beat Arm B reproducibly by >= 2 solving degrees, surviving the L-ladder decay test.
    (F) is incomplete; prime-field factor-base structure exists; escalate to independent review. THIS
    IS THE OUTCOME THE RECORD HOPES FOR AND EXPECTS NOT TO GET.
  - Arm D is not cheaper than Arms A-C. The instrument cannot detect factor-base structure; Arms A-C
    produce no citable negative and the run set is INVALID rather than confirming (AGENTS.md rule
    5, RQ-INSTR-f8faa0).
  - The planted decomposition is not found. Solver broken; nothing is reported.
  - 'A curve in the set has smooth order or #E = p. Pohlig-Hellman or the anomalous transfer is doing
    the work; the instance is void and is replaced, not interpreted.'
  - Groebner computations at m = 3 exceed the memory or time budget before any degree resolves. INFRASTRUCTURE
    outcome under AGENTS.md rule 5, recorded as such, never as evidence about decomposition cost.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-070d03
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
