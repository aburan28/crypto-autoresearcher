    "methods": {
      "A_counting_scope": "Write a conditional derivation, not a lane closure: in a cyclic group of prime order N comparable to p, under the specified near-uniform m-sum yield model and fixed m, nonvanishing yield demands B^m/N bounded below. An algorithm explicitly materializing both ordered subset-selection lists of sizes asymptotic to B^k and B^(m-k), for fixed k, incurs the larger size at least B^(m/2). Distinct-x sampling and fixed factorial/sign constants must be carried. This does not lower-bound algorithms that compress collisions, reuse preprocessing, exploit relations, change target distribution or use another solver. Source free-oracle omega_LA/m arithmetic is a conditional counterfactual; neither yield nor an ECDLP exponent is measured by a plant.",
      "S_construction": "Work in F_p[x1,...,x_m,z]. S2(u,v)=u-v. S3(u,v,w)=(u-v)^2*w^2-2*((u+v)*(u*v+a)+2*bcoef)*w+(u*v-a)^2-4*bcoef*(u+v). For n>=4 define Sn=Res_z(S_(n-1)(x1,...,x_(n-2),z),S3(x_(n-1),x_n,z)), using exact Sylvester determinant over the polynomial ring with variable order x1>...>xn>z. Construct S4 and S5 at actual a,bcoef; S6 for optional m5. Specialize the final coordinate to x(R), combine coefficients mod p, and retain complete realized support and each actual per-variable degree. Expected degree is 2^(m-1), but degree drops are recorded as strata, not silently discarded. Independent checker verifies S3 by exact point arithmetic and resultant identities using a disjoint recursive resultant implementation on the small calibration fixtures.",
      "plant": "At each X first enumerate x in [0,X) only until m eligible distinct x values exist; if fewer exist after full scan, this distribution is unavailable, not a recovery failure. For each trial draw x uniformly from [0,X) until y^2=x^3+a*x+bcoef has a nonzero square root and x differs from earlier x in this tuple. Pick either square-root sign uniformly; because #E=N prime, every nonidentity lift lies in G. Keep the ordered tuple, reject R=sum(Pi)=O, and record all repeats, nonsquares, zero-y, target-infinity and sampling costs. The accepted tuple law is uniform conditional on liftability/distinctness/noninfinite target; it is not uniform over all integer tuples or random targets. Independent checker seals the ordered x multiset and actual point sum before the solver sees only f,p,m,X,a,bcoef,R.",
      "polynomial_arms": "REAL uses the exact specialized S_(m+1). DENSE-DEGREE null includes every monomial in [0,d1]x...x[0,dm], where di are REAL actual degrees; nonconstant coefficients sampled uniformly from F_p^*; set constant to minus the value of nonconstant terms at the same plant. Resample coefficients if the resulting constant is zero, so degree/support stable. SPARSE-SUPPORT diagnostic uses exactly REAL support union {1}, with the same planting rule and nonzero coefficients; disclose extra constant if REAL lacks it. Dense null is the mandatory source degree-matched arm; sparse diagnostic separates coefficient effects from density/shape changes and cannot replace it. NO-PLANT REAL chooses R=[s]G with s uniform in 1..N-1 independently of all box samples; NO-PLANT random uses nonzero random coefficients including the constant on the corresponding supports without adjustment. Valid incidental roots are expected possibilities and retained.",
      "coefficient_lifts": "For every arm select lexicographically greatest realized monomial exponent l under x1>...>xm; no other realized monomial is divisible by it. Normalize by its coefficient inverse modulo p, and lift every coefficient to {0,...,p-1}, fixing leading coefficient exactly 1. Save original and normalized coefficients, inverse and hashes. Expand powers over Z without coefficient reduction after normalization. Lifts have nonnegative coefficients, hence no cancellation in their integer power supports. A zero/constant polynomial is a separately recorded degenerate target, not a usable degree-matched instance; keep it in sampling/support accounting.",
      "JM_supports": "Let S_j=supp(f^j) over Z for j=0..t with S_0={0}; let U_t=union(S_0,...,S_t). Define M_k={alpha in U_t: alpha-k*l has all entries nonnegative and lies in union(S_0,...,S_(t-k))}, k=0..t, M_(t+1)=empty. These sets are nested because l is in S_1. For each alpha choose k(alpha)=max{k:alpha in M_k}, and construct exactly g_alpha=p^(t-k)*x^(alpha-k*l)*f^k. Its entire support lies in U_t, it vanishes modulo p^t at every root of f mod p, and leading exponent is alpha. This is the generalized basic JM strategy handling missing lower-power support explicitly. No undisclosed shifts, recentering, row deletion or box extension. Paper notation m for multiplicity is renamed t here; arity m is separate. Extended variable shifts are outside this finite contract; the source t-extension here extends multiplicity only.",
      "lattice": "Columns and rows are all alpha in U_t ordered lexicographically ascending; each row is coefficient vector of g_alpha(X*x1,...,X*xm). It is triangular with diagonal p^(t-k(alpha))*X^sum(alpha). Verify exact support containment, diagonal and determinant product independently. Save every shift label, coefficient/scaling map, matrix hash and full reconstructible entries. No convex-hull/count-only stand-in. A symbolic dimension or byte estimate exceeding memory yields a checkpoint with exact unfinished panel, never a success or smaller substituted lattice.",
      "reduction": "Use SageMath10.6 exact arithmetic, fpylll0.6.4 and fplll5.5.0 with exact source/binary/strategy hashes recorded before scientific sampling. Run proved LLL delta=99/100, eta=501/1000, MPFR precision256, then run two independent copies of that LLL output through BKZ block=min(20,omega) and block=min(30,omega), delta=99/100, exactly four complete tours, no pruning, no random rerandomization and no auto-abort. Stop early only if a complete tour makes no basis change; record actual tours. If the pinned interface needs a driver, implement these same fixed full-block enumeration tours using fpylll primitives and archive driver/strategy identity; no silent library/version fallback. LLL-only output is an additional diagnostic. Preserve integer transformation U with reduced_matrix=U*input_matrix and det(U)=+1 or -1, checked exactly. Finite-precision failure permits precision512 then1024 with same starting matrix/seed, all attempts charged; failure after that is infrastructure. Exact rational Gram-Schmidt checks size reduction and Lovasz inequalities for the LLL output.",
      "recovery": "Unscale columns exactly, reject nonintegral coefficients, and retain each original integral row polynomial h0 together with its content c and primitive polynomial h=h0/c. Use primitive polynomials only for rational ideals; integer-root zero sets are unchanged. Sort by squared scaled norm of original h0 then lexicographic coefficient tuple. The p^t divisibility and HG inequality apply to h0, not automatically to h after dividing content; preserve this distinction in every certificate. For each prefix compute the reduced lexicographic Groebner basis over Q, x1>...>xm, using deterministic Buchberger: smallest lcm leading-monomial pair first, ties by input index; exact rational reductions in basis order, no heuristic criteria required. Retain transformation/reduction certificates. A unit ideal stops that prefix chain as inconsistent. First proper zero-dimensional prefix is solved completely: lex elimination, factor univariate elimination polynomials over Q, retain rational roots, substitute recursively, recompute elimination on each branch, and enumerate every rational tuple; filter integer coordinates in [0,X) and exact f mod p. No plant coordinates or hidden equality constraints enter the solver. If every prefix remains positive-dimensional, return non-isolated, not root-free. Complete all roots for the chosen prefix; stop after its full enumeration, no cherry-picked subset search. A separate run of the same prefix algorithm using only original row polynomials h0 with omega*norm_squared(h0(X*x)) < p^(2*t) supplies the HG-certified recovery classification. Above-HG roots that independently verify are valid empirical recoveries; do not reject them solely for lacking the sufficient norm bound.",
      "independence": "For every trial record total/short polynomial counts, exact pairwise and joint gcd diagnostics, symbolic Jacobian rank over Q(x1,...,xm), rank at the sealed plant, the dimension and unit status of each examined ideal, chosen zero-dimensional ideal degree and all rational roots. Algebraic independence, absence of a common factor, and finite common zero set are different observations. HEUR-CM-1 failure rate is fraction of completed trials lacking a proper finite isolating prefix containing the plant; report both raw recovery and recovery conditional on that event. Above 0.5 flag heuristic-limited, not degree-limited. Do not condition on this event when computing the source 25/50 primary threshold.",
      "independent_certificates": "Checker uses integer modular arithmetic and affine point addition written separately from construction/solver. It verifies every returned integer tuple, box bounds and congruence; for REAL it tries all 2^m sign combinations of rational lifts and verifies an actual sum equals R or -R, changing all signs if necessary. Semaev algebraic-closure roots without rational signed decomposition are not decomposition successes. Planted recovery is equality of sorted x multisets to the sealed plant, with a valid point certificate; alternate valid decompositions and valid null roots are distinct success columns. Preserve all candidate outputs, rejected candidates and reasons. The source X_max uses planted recovery, with any-valid-decomposition threshold secondary.",
      "X_search": "At each (m,p,t,reducer), start with beta grid {j/40: j=1,...,ceil(40*(1/m+0.10))}, plus beta=0,0.10,0.183,1/m-0.15,1/m-0.02,1/m. Map beta to X=max(1,floor(exp(beta*log(p)))) using certified interval exponentiation until the integer floor is determined, treating rational powers by exact integer-root arithmetic. Deduplicate integer X. Evaluate all arms at the union of their requested X values, 50 fresh sealed plants per admissible X, paired across REAL/dense/sparse and reducers. Locate every adjacent observed pass (>=25/50) to fail (<25/50) interval and carry out ten midpoint iterations in beta on each, retaining every evaluation. Cache repeated integer X; ten iterations need not give ten distinct X values and quantization is disclosed. If no pass/fail bracket exists, bisect the full beta range ten times to characterize censoring, never invent a crossing. Report largest observed passing X as empirical X_max_observed, its integer-resolution interval and the complete set of passing islands; do not claim a global or monotone mathematical maximum. Nonmonotonicity adds a fixed full grid j/200 over the same beta range, with no isotonic replacement of raw data. Use the union of adaptive/fine-grid points for all paired arms and fixed counts. If largest X still passes, report right-censored. If no admissible X passes, report threshold not observed, not zero. If low-X plants cannot exist, report finite-box availability floor.",
      "generic_baselines": "For each curve, take the first20 REAL plants at m3,t1,X=ceil(p^(1/3)), generated independently of the adaptive X search, as the explicit matched baseline subset. Compute log_G(R) with BSGS width ceil(sqrt(N)), canonical full points, all table entries and queries charged; verify scalar. Also use negation-canonical rho: 16 independent hash-generated nonzero additions aj*G+bj*R, canonicalize each state point by smaller y and negate both labels when needed; SHA256 compressed canonical point selects partition. Use Floyd cycle detection with exact labels and solve (b1-b2)*x=(a2-a1) mod N; every collision scalar is verified, zero denominator or fruitless cycle causes a deterministic new table/start seed and all work is charged. Restart after 8*ceil(sqrt(N)) updates as a disclosed fixed algorithmic rule, without marking the target a failure; continue checkpoints until recovery. Include preprocessing, restarts, canonicalization, hashes and verification, group/field ops, bytes, time and memory. No quotient speed constant presumed, no comparison of decomposition recovery rate to DLP cost. These are matched public synthetic targets, not deployed keys."
