experiment:
  id: EXP-SHATWO-28902d
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-74e42d; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-74e42d
  question_id: RQ-SHATWO-f196c7
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Observation-collision audit of the rank observable: exact GL invariance of the expanded-schedule
    rank profile under message-block basis change, verified computationally, paired with a measured
    step-count spread across four sampled basis classes'
  objective: 'The one uncertainty a run reduces is whether the linear observable that the deficit
    programme in this bucket rests on can identify a frontier at all. (i) It establishes and computationally
    verifies an exact observation collision in the sense of docs/inventor-protocol.md section 8 audit
    2: for every invertible GF(2) change of basis A on the message block, the carry-fixed expanded
    schedule''s rank profile, surviving-freedom sequence and redundancy sequence are provably unchanged,
    so an entire matrix group''s worth of distinct primitives share the observable exactly, and the
    run asserts this bitwise across sampled A rather than resting on the argument alone. (ii) It measures
    whether the collided objects also share the frontier, by running a frozen instrument at a frozen
    budget on four declared classes of A - identity, sparse involution, dense random, word permutation
    - with replicate seeds and certificate verification, and scoring the cross-class step-count spread
    against the within-class seed spread by a rule frozen in advance. (iii) It forces the run to declare
    its own resolution first: if seed noise alone matches the cross-class spread, no verdict is issued
    and the measured resolution limit is the deliverable. A run does NOT reduce uncertainty about
    whether some refined, non-GL-invariant observable could identify the frontier, which remains open
    and is named as the escape.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope: the rank profile, surviving-freedom and redundancy
      sequences of the carry-fixed expanded schedule are exactly invariant under every invertible
      change of basis on the message block - a proof, verified bitwise across the sampled elements
      at the tested width - and, for the four sampled basis classes at the declared toy width, budget,
      seed set and instrument, the measured reachable step counts took the emitted values with the
      emitted spreads and scored HARMFUL or HARMLESS AT THIS RESOLUTION under the frozen rule. WHAT
      DOES NOT FOLLOW: that the deficit programme is closed, since a refined non-invariant observable
      may still identify the frontier and the escape is named rather than dismissed; that any composed
      primitive says anything about SHA-256 itself; that a HARMLESS score generalizes beyond four
      sampled classes to the whole group; and nothing about full 64-step SHA-256, HMAC-SHA-256, TLS
      certificate chains, code signing, or Bitcoin.'
  inputs:
    procedure: 'STAGE 0 (an hour, human): write and hash the preregistration - the four A classes
      with their sampling rules, seeds, budget, and the spread-ratio decision rule. STAGE 1 (minutes,
      machine): the symbolic half - sample 20 invertible A across the four classes, recompute the
      full rank profile of the composed expansion for each, and assert bitwise equality with the identity
      case at every s, support and carry class; abort on any deviation. STAGE 2 (hours, human): implement
      the affine composition layer in the frozen encoder and in an independently written implementation
      of the composed primitive for certificate verification; verify that the identity composition
      reproduces the uncomposed CNF exactly after canonical re-sorting. STAGE 3 (minutes, machine):
      confirm the companion planted-signal instrument gate has passed by citing its run id; do not
      proceed with the empirical half otherwise. STAGE 4 (hours, machine): measure the reachable step
      count for one A per class - plus the identity - at the frozen budget with five seeds each, verifying
      every returned assignment. STAGE 5 (minutes): compute cross-class and within-class spreads,
      apply the frozen rule, and emit HARMFUL, HARMLESS AT THIS RESOLUTION, or RESOLUTION LIMIT. STAGE
      6 (minutes): emit the run manifest with seeds, encoder hash, solver version and resolved inference
      block, and record the named escape - a refined non-invariant observable - as forward guidance
      per the section 4 closure standard.'
    instrument: Python 3.11 with numpy for uint64 bit-packed GF(2) elimination and for sampling invertible
      matrices by products of random transvections; the same linearizer module as the rank ledger,
      reused so the invariance assertion is a control on that pipeline too; PySAT with a pinned CaDiCaL
      or Kissat build for the empirical half, version frozen; an independently written implementation
      of the composed primitive for certificate verification; harness/runner.py for manifests, deterministic
      seeds and the inference block. No computer-algebra system and no Sage.
    parameters: 'Symbolic half at full SHA-256 parameters: 32-bit words, 512-bit block, 64 steps,
      20 sampled A in GL(512, 2), all support families and 8 carry classes. Empirical half at word
      width 16, block 256 bits: four A classes - identity; sparse involution built from 8 random transvections;
      uniform invertible dense sampled as a product of 3n random transvections; and a random permutation
      of the 16 message words - one representative each, five seeds per representative (seeds 401..405),
      one frozen budget, one step ladder. Decision rule: cross-class spread greater than twice the
      pooled within-class seed spread scores HARMFUL.'
  controls:
  - Identity element A = I as a member of the sampled family, same code path, same invocation.
  - Bitwise rank-profile invariance assertion under every sampled A, as a pipeline control on the
    whole construction.
  - Identity-composition CNF equality check against the uncomposed instance after canonical re-sorting.
  - Replicate seeds within every A class, with within-class spread reported and required to be below
    the cross-class spread.
  - Certificate verification of every returned assignment against an independently written implementation
    of the composed primitive.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The identity element is the null object and it runs in the same invocation:
    A = I is a member of the sampled family, so the signal arm and the null arm are the same code
    path with one matrix differing, which is the strictest possible matching. For the empirical half
    to mean anything, the identity arm''s measured step count must be reproducible across its own
    replicate seeds to within less than the spread observed across the A classes; if seed noise alone
    equals the cross-A spread, the falsifier cannot fire and the run reports its resolution limit.
    A second null is the rank-invariance assertion itself, which is a control on the whole pipeline:
    if recomputing the rank profile under a sampled A does not reproduce the identity case bitwise,
    the linearizer or the composition is wrong and no measured step count means anything.'
  independent_variables:
  - basis-change class of A (identity, sparse involution, dense random, word permutation)
  - step count within the ladder
  - seed
  - carry class in the symbolic half
  metrics:
    primary:
    - bitwise rank-profile agreement flag per sampled A
    - measured reachable step count per A per seed
    - cross-class spread of the step count
    - within-class pooled seed spread
    - HARMFUL / HARMLESS / RESOLUTION LIMIT score
    secondary:
    - CNF variable and clause counts per A
    - certificate verification rate per A
    - identity-composition CNF equality flag
    - wall-clock and peak memory per run
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The ratio of the cross-class spread of the measured reachable step count to the pooled
      within-class seed spread, across the four sampled basis-change classes at the frozen budget.
    formula: 'ratio = ( max over classes of the seed-median step count minus min over classes of the
      seed-median step count ) divided by ( pooled standard deviation of the step count across seeds
      within classes ). Frozen rule: ratio > 2.0 scores COLLISION HARMFUL, falsifying the rank observable
      as a frontier predictor as stated; ratio <= 2.0 with pooled within-class spread strictly below
      the cross-class spread scores COLLISION HARMLESS AT THIS RESOLUTION; pooled within-class spread
      at or above the cross-class spread scores RESOLUTION LIMIT and no verdict is issued. The symbolic
      half''s forced value is bitwise rank-profile equality under every sampled A, which must hold
      before the ratio is computed at all.'
    source: Pre-registered in the parent proposal IDEA-20260816-74e42d before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The symbolic half runs at the FULL SHA-256 parameter set - 32-bit words, 512-bit
      block, 64 steps, the group GL(512, 2) - with no reduction and no extrapolation, because rank
      invariance is exact and costs nothing. The empirical half runs at word width 16 with a 256-bit
      block, so the relevant group there is GL(256, 2) rather than GL(512, 2), and the record states
      the actual group at the tested width rather than quoting the full-width one. The transfer assumption
      stated and NOT tested: that a step-count spread observed across basis classes at w = 16 would
      also appear at w = 32. No extrapolation across width is performed.'
    correspondence: null
  tail_checks:
  - Report the per-seed step counts for every class, not only medians, so a bimodal class is visible.
  - Report CNF variable and clause counts per class next to the step counts, so a spread that tracks
    encoding size is visible on inspection.
  - Check the identity class against the uncomposed instance for exact CNF equality after canonical
    re-sorting.
  - Check the sparse-involution class specifically, since it changes the basis while barely changing
    CNF size, and is therefore the cleanest single test of the falsifier.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort if the bitwise rank-profile invariance assertion fails for any sampled A.
  - Do not run the empirical half unless the companion planted-signal instrument gate has passed and
    its run id is cited.
  - Halt on any returned assignment that fails independent certificate verification.
  - Stop at the four preregistered classes; do not add classes after seeing the spread.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The bitwise rank-profile invariance holds for every sampled A, the identity composition
    reproduces the uncomposed CNF exactly, every returned assignment verifies, and the cross-class
    and within-class spreads are emitted with the frozen rule applied - with all three possible scores,
    including RESOLUTION LIMIT, counting as complete deliverables, and with the named escape recorded
    as forward guidance per the section 4 closure standard whichever way the score falls.
  falsification_criterion:
  - Bitwise rank-profile invariance fails under some sampled A, falsifying the composition or the
    linearizer and voiding the run.
  - The identity-composition CNF differs from the uncomposed instance, falsifying the composition
    layer's neutrality.
  - ratio > 2.0, falsifying the rank observable as a frontier predictor as stated - the outcome this
    contract exists to be able to report.
  - Pooled within-class seed spread meets or exceeds the cross-class spread, falsifying the resolvability
    of the comparison at this seed count and budget.
  - Any returned assignment fails independent certificate verification.
  - The spread is driven entirely by the dense-random class while the sparse-involution class shows
    none, indicating the effect tracks CNF size rather than the basis change.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-74e42d
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Four sampled classes are a tiny and non-uniform sample of the group, and no argument establishes
    that a HARMLESS score at four points says anything about the group; a Coordinator must scope any
    HARMLESS reading to the sample explicitly.
  - The escape - a refined observable that is not invariant under message-block basis change - is
    named but not constructed, and constructing one is left open.
  - No argument establishes that a spread at w = 16 would persist at w = 32, and none is attempted.
  - The empirical half depends on the companion planted-signal instrument gate and cannot be approved
    before it passes.
