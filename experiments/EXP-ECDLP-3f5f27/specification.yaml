# EXP-ECDLP-3f5f27
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261004-9dd497.
experiment:
  id: EXP-ECDLP-3f5f27
  hypothesis_id: H-ECDLP-c19daa
  source_idea: IDEA-20261004-323aba
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-27 table versus width-26 table
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-9dd497
  objective: >-
    Check the table sizes 67108864 and 33554432, the product 2251799813685248, and the nearby gap 0.
  inputs:
    width_hi: 27
    width_lo: 26
    table_hi: 67108864
    table_lo: 33554432
    table_gap: 33554432
    table_product: 2251799813685248
    table_sum: 100663296
    nearby_a: 33554432
    nearby_b: 33554432
    nearby_gap: 0
    nearby_product: 1125899906842624
  controls:
    - >-
      Two to the power 26 is 67108864. Two to the power 25 is 33554432.
      Reporting both tables as size 33554432 drops the gap and invalidates
      the run.
    - >-
      Sixty-seven million one hundred eight thousand eight hundred
      sixty-four exceeds thirty-three million five hundred fifty-four
      thousand four hundred thirty-two by 33554432. The product of the
      two sizes is 2251799813685248. Their sum is 100663296.
    - >-
      Two width-26 tables each store 33554432. Their gap is 0 and their
      product is 1125899906842624.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-27 table stores 67108864 entries. The width-26 table stores
      33554432. The gap of two width-26 tables is 0.
    formula: >-
      Compute 2 to the power 26. Compute 2 to the power 25. Subtract
      33554432 from 67108864. Multiply 67108864 by 33554432. Subtract 33554432 from 33554432.
    source: >-
      IDEA-20261004-323aba states the widths 27 and 26 and the sizes
      67108864 and 33554432, read 2026-10-04. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 2251799813685248 and the nearby gap 0 are required. A check that stops at the size 67108864 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 67108864 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 26 is not 67108864.
    - Two to the power 25 is not 33554432.
    - The gap is not 33554432.
    - The product is not 2251799813685248.
    - Both tables are reported as size 33554432, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-27 table stores 67108864 entries, that
    the width-26 table stores 33554432, and that 67108864 exceeds 33554432 by 33554432.
  falsification_criterion: >-
    The runs agree that the width-27 table size is computed, and
    that size is not 67108864.
  required_artifacts:
    - experiments/EXP-ECDLP-3f5f27/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-3f5f27/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-3f5f27/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-3f5f27/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-3f5f27/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-3f5f27/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 33554432 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
