experiment:
  id: EXP-SEMBIN-4fa22c
  hypothesis_id: H-SEMBIN-a7e721
  goal_id: GOAL-SEMBIN-fcb7a2
  question_id: RQ-SEMBIN-9e8f82
  version: 1
  status: review_required
  approved_by: null
  approval_note: >-
    DESIGNING IS NOT APPROVING. This contract is complete and frozen at version 1; it moves to `approved`
    only on a committed Coordinator decision, which the standing user authorization of 2026-09-06 permits
    the Coordinator to supply without asking the user, once the protocol is complete. Nothing in this file
    may be edited after that decision — a change is an additive amendment with a new id, never a rewrite
    (AGENTS.md core rule 4).
  frozen_at: '2026-09-16'
  authored_by: coordinator
  authored_under: DEC-20260916-88ac73 next_actions rank 1

  title: >-
    Fake first fall degree of the coset-shifted EQS4 degree-3 Weil descents, measured against matched
    unshifted and random null systems, with the instrument's blindness to the true degree declared as a
    success criterion rather than a caveat

  objective: >-
    Measure d'_F — the fake first fall degree, computed in the Boolean ring where X^2 is identified with X
    — for the EQS4 systems of Nagao 2015/984 at the smallest parameters that carry the structure, and
    determine whether it exceeds the 4 that Proposition 5 claims for d_F. The purpose is to test the
    PROPOSITION'S JUSTIFICATION at those instances, never the proposition itself.

  # ==========================================================================
  # DESIGN CONSTRAINTS INHERITED FROM DEC-20260916-88ac73.
  # These are reproduced here because that decision required them to live in
  # this contract's SUCCESS CRITERIA and not in its prose. Each appears again
  # below as a criterion with a verdict field.
  # ==========================================================================
  design_constraints:
    DC-1: >-
      The instrument may not claim to bound d_F from below and may not be described as able to refute
      Proposition 5. A Boolean-ring Macaulay computation is structurally unable to exhibit d_F > 4: degree
      drops produced purely by X^2 -> X count toward d_F and are invisible to d'_F, so the instrument
      never sees the falls that can make d_F small.
    DC-2: >-
      The convention on condition (1) and on trivial Koszul falls is declared HERE, before any run.
    DC-3: >-
      The instance includes the coset shifts v_i. A descent without them is EQS2 and must not be reported
      against Proposition 5.
    DC-4: >-
      The generators are the REDUCED degree-3 descents, with the representative fixed by this contract
      rather than left to the implementation.

  declared_conventions:
    condition_1: >-
      DECLARED AS THE EQUALITY FORM. Condition (1) of Definitions 3 and 6 reads ">= dF" in the frozen text
      (inputs/NAGAO-2015-984/paper_fulltext.md :401, :439) and Definition 6's conditions name dF rather
      than d'F. Under a literal ">=" both quantities degenerate: a zero-dimensional system with a unique
      F_2 solution has linear elements in its ideal, so a literal d_F would be <= 2 and Assumption 1 of
      the paper would be false outright. This contract therefore computes the EQUALITY form — a first fall
      is a combination sum_i h_i f_i whose degree is STRICTLY LESS than max_i deg(h_i f_i), with all
      products at the same degree d — and records this as A DECLARED INTERPRETATION OF AN AMBIGUOUS SOURCE,
      not as the obvious reading. Whether ">=" is in the PDF or is a lost prime glyph is not determinable
      from the frozen text and this contract does not claim to resolve it.
    trivial_koszul_falls: >-
      DECLARED EXCLUDED, AND THE EXCLUSION IS ITSELF MEASURED. With the field equations inside the
      generating set, g = (X_j^2 + X_j) on a cubic f together with h_j = f + 1 on the field equation gives
      degree-5 products summing to X_j^2 + X_j. So the literal true d_F of any cubic system with the field
      equations at p = 2 is at most 5, and Proposition 5's bound of 4 sits ONE DEGREE BELOW A TRIVIAL
      CEILING. Because this contract computes d'_F in the Boolean ring, where X_j^2 + X_j is zero, these
      particular falls do not arise — but the same shape can appear through any multiplier pair
      (g, h) = (f_k, f_j + c) on two generators, which is a Koszul syzygy present in every system and
      carrying no information about this one. The run EXCLUDES falls whose combination lies in the module
      generated by the trivial Koszul syzygies f_j f_k + f_k f_j, and REPORTS the degree at which the
      first trivial fall would have occurred, so a reader can see the margin between the measured value
      and the ceiling. An instrument that admits them measures the ceiling and not the system.
    generator_representative: >-
      DECLARED: the reduced degree-3 descents. Definition 3 defines the descent with `mod S_fe` (:262) and
      the paper notes that at p = 2 degree-3 polynomials can be taken (:274). Each descended coordinate
      polynomial is reduced modulo the field equations to its multilinear representative, then that
      multilinear form is the generator. The representative is irrelevant to d'_F and NOT irrelevant to
      d_F, which is one more reason this contract measures only the former.
    monomial_ordering: >-
      Graded reverse lexicographic on the Boolean monomials, variables ordered as emitted by the descent
      (x-coordinate variables of point 1, then point 2, then point 3). d'_F as defined is a degree and is
      order-INDEPENDENT, unlike a Gröbner basis cardinality; the order is declared because the Macaulay
      matrix construction uses it and because an order-sensitivity check is a required control (C-4).

  # ==========================================================================
  instance_specification:
    field: F_{2^n}
    n_values: [7, 8, 9, 10, 11, 12]
    n_note: >-
      The series exists to test P-3's monotonicity, which needs at least three consecutive n at fixed m.
      The largest n is a budget question, not a scientific one: the run walks upward and stops at the
      stopping rule, recording the largest n it reached. A truncated series is a complete result for the n
      it covers (core rule 6).
    m: 3
    m_note: >-
      m - 1 = 3 in the paper's parameterisation of the third summation polynomial. Held FIXED across the
      whole series; varying both m and n at once would confound the two.
    summation_polynomial: >-
      The third summation polynomial S_3 of the curve, in the form the paper uses. Its construction is
      standard and is implemented from the definition rather than imported, so that the descent and the
      shifts are under this contract's control (DC-3, DC-4).
    curve: >-
      A fixed short-Weierstrass curve over F_{2^n} for each n, with its defining polynomial and
      coefficients recorded per n in the run's inputs block. The curve is NOT a Koblitz curve and this is
      deliberate: Proposition 5 is not a statement about Koblitz curves and choosing one would add a
      Frobenius structure the proposition does not assume.
    vector_space_and_shifts: >-
      A GF(2)-subspace V of F_{2^n} of dimension l = ceil(n / m), and the coset shifts v_i of Definition 8
      (:713) with footnote 1 (:285-290). THE SHIFTS ARE PART OF THE INSTANCE (DC-3). Each run records the
      basis of V and every v_i explicitly, as field elements in the recorded basis, so that the shifted
      and unshifted systems differ by exactly the recorded quantity and nothing else.
    arms:
      - id: A-SHIFTED
        what: EQS4 — the descent WITH the coset shifts v_i. The system the hypothesis is about.
      - id: A-UNSHIFTED
        what: >-
          EQS2 — the identical descent with every v_i set to zero, everything else byte-identical. The
          matched pair of P-2.
      - id: A-NULL-RANDOM
        what: >-
          A random multilinear degree-3 system over the same variables, with equation count and per-degree
          monomial COUNT matched to A-SHIFTED, coefficients uniform in F_2 subject to that support. The
          null object of P-4. Ten independent draws per n, with a recorded seed each.
      - id: A-NULL-SHUFFLED
        what: >-
          A second null object: A-SHIFTED's own monomials with their coefficients randomly permuted across
          equations, preserving the exact global monomial multiset. This is the stricter null — it matches
          not just the counts but the actual support — and it is the one that discriminates between "the
          summation polynomial matters" and "systems of this shape behave this way". Ten draws, seeded.

  # ==========================================================================
  metrics:
    - id: M-1
      name: d_prime_F
      what: >-
        The smallest degree d at which a non-trivial first fall occurs, per arm per n: the least d such
        that the Macaulay matrix at degree d, over the Boolean monomials, has a kernel vector not in the
        span of the trivial Koszul syzygies.
      units: degree (integer)
      how: >-
        Degree-by-degree rank computation over GF(2). At each d, build the matrix whose rows are the
        Boolean reductions of the products h f for every generator f and every Boolean monomial h with
        deg(h f) <= d, and whose columns are the Boolean monomials of degree <= d; compute its rank and
        the rank of the trivial-syzygy submodule; a fall is a rank defect beyond the trivial one.
      censoring: >-
        If no fall is found at or below the largest d the budget reaches, M-1 is recorded as
        `> d_max_reached` — A CENSORED OBSERVATION, never a value, and never "no fall exists".
    - id: M-2
      name: trivial_fall_degree
      what: The degree at which the first TRIVIAL Koszul fall occurs, per arm per n.
      units: degree (integer)
      why: >-
        The margin M-2 - M-1 is what makes M-1 readable. A measured M-1 equal to M-2 is an instrument
        reading the ceiling (declared_conventions.trivial_koszul_falls).
    - id: M-3
      name: macaulay_rank_series
      what: The full rank of the Macaulay matrix at each degree, per arm per n, as a series.
      units: rank (integer per degree)
      why: >-
        M-1 is one integer read off this series, and an integer with no series behind it cannot be
        checked. Recording the series lets a reviewer re-derive M-1 without re-running the algebra.
    - id: M-4
      name: system_shape
      what: >-
        Per arm per n: variable count, equation count, per-degree monomial counts, and the sha256 of the
        canonical serialisation of the generator set.
      units: counts and a hash
      why: >-
        This is what makes the null arms auditable as matched. A null object whose shape is not recorded
        alongside the target's is not demonstrably matched.
    - id: M-5
      name: cost
      what: Wall seconds, CPU seconds and peak resident set per arm per n per degree.
      units: seconds, kilobytes
      cost_instrument_note: >-
        Peak resident set is sampled by polling, and a POLL INTERVAL IS A MEASUREMENT FLOOR: this contract
        forbids reporting any wall-time RATIO between two measurements that both finish inside the poll
        interval, and requires the interval to be recorded beside every wall figure. This clause exists
        because CORR-20260916-33068f measured a 51x wall inflation from exactly this defect in another
        campaign's instrument. Wall time here is a budget quantity, not a scientific one; no conclusion of
        this experiment may rest on it.

  # ==========================================================================
  controls:
    - id: C-1
      name: THE MATCHED UNSHIFTED PAIR
      what: A-UNSHIFTED measured by the identical code path at the identical n.
      what_it_detects: >-
        Whether the shifts are doing the work the mechanism claims. If shifted and unshifted agree, the
        mechanism is wrong (F-2) whatever happens to the prediction.
    - id: C-2
      name: NULL OBJECTS BEFORE BELIEF
      what: A-NULL-RANDOM and A-NULL-SHUFFLED, ten seeded draws each, measured by the identical code path.
      what_it_detects: >-
        Whether the measurement reads the summation polynomial or merely the shape of a degree-3 Boolean
        system. THIS CONTROL IS EVALUATED AND REPORTED BEFORE ANY d'_F VALUE IS INTERPRETED (inventor
        protocol, controls before belief). If the nulls match the target profile, no d'_F value from this
        run says anything about Nagao (F-3), and the run reports that rather than the headline.
    - id: C-3
      name: A KNOWN-ANSWER FIXTURE
      what: >-
        The two hand systems verified in coordination/review/sembin-20260916-propquant/coordinator-recheck.py
        — f1 = X1X2 + X3, f2 = X1 + X2 with fake quantity 2 — plus at least one system with a
        deliberately planted fall at a known degree, run through the same instrument.
      what_it_detects: >-
        That the instrument finds a fall it is supposed to find, and reports the degree the hand algebra
        gives. An instrument validated only on systems whose answer nobody knows is not validated.
    - id: C-4
      name: ORDER SENSITIVITY
      what: >-
        Every arm re-run at one n under a second variable order (reversed), asserting an IDENTICAL M-1.
      what_it_detects: >-
        An implementation in which the declared order-independence of d'_F has been broken by the matrix
        construction. A discrepancy is an instrument defect (F-4), not a fact about the systems.
    - id: C-5
      name: MONOTONICITY
      what: M-1 as a series in n at fixed m.
      what_it_detects: >-
        A non-monotone series, which is a defect signal in the instrument BEFORE it is a fact about the
        systems (F-4). Recorded as a series so a reader can see it rather than being told it held.
    - id: C-6
      name: FIELD-EQUATION PLACEMENT
      what: >-
        At one n, the same measurement with the field equations placed INSIDE the generating set versus
        handled by Boolean reduction alone, reporting both.
      what_it_detects: >-
        That the declared convention is the one the code implements. The literal-versus-inside distinction
        is exactly what makes Lemma 4 false in one form and plausible in the other, so an instrument that
        cannot show which one it computed cannot be cited on either.

  # ==========================================================================
  success_criterion:
    note: >-
      A criterion here is a statement about WHAT THE RUN MUST ESTABLISH ABOUT ITSELF, not about which way
      the result comes out. A run that measures d'_F <= 4 everywhere satisfies every criterion below and
      falsifies the hypothesis (F-1); that is a success of the experiment and a failure of the prediction,
      and the two are not confused.
    criteria:
      - id: S-1
        binds: DC-1
        criterion: >-
          THE RUN'S OWN REPORT STATES THAT IT CANNOT REFUTE PROPOSITION 5, AND NO REPORTED OUTCOME IS
          PHRASED AS DOING SO. Specifically: the report contains an explicit statement that a measured
          d'_F > 4 is CONSISTENT with d_F <= 4 because Lemma 4 runs d_F <= d'_F, and that the instrument
          is structurally blind to the X^2 -> X falls that can make d_F small.
        why_it_is_a_criterion_and_not_a_caveat: >-
          Because the natural design of this experiment has a refutation as its headline, and that
          headline is unreachable by construction. A contract that put this in an interpretation section
          would have a success criterion no run could satisfy and would discover it after the compute was
          spent. Verdict field: PASS or FAIL.
      - id: S-2
        binds: DC-2
        criterion: >-
          The run reports which convention it computed for condition (1), reports M-2 beside M-1 for every
          arm, and reports the C-6 both-placements comparison. A run that reports M-1 without M-2 FAILS
          this criterion even if M-1 is correct.
      - id: S-3
        binds: DC-3
        criterion: >-
          Every reported EQS4 value comes from a system whose recorded shifts v_i are non-zero, and the
          shifts are recorded explicitly as field elements. Any value from a zero-shift system is labelled
          EQS2 and is not reported against Proposition 5.
      - id: S-4
        binds: DC-4
        criterion: >-
          The generators are the reduced multilinear degree-3 descents, and the run records the sha256 of
          their canonical serialisation (M-4) so the representative is checkable.
      - id: S-5
        binds: the both-consequences reporting rule of DEC-20260915-94855e as restated by DEC-20260916-88ac73
        criterion: >-
          FOR EVERY MEASURED d'_F THE REPORT STATES BOTH CONSEQUENCES: what the value means for
          Proposition 5's justification, and what it means for the proposition itself (namely nothing, in
          the refuting direction). A confirmation direction — d'_F <= 4 — additionally carries its
          condition on Lemma 4's inside form, which is UNPROVEN and whose literal form is verified false,
          and carries the statement that the confirmation is instance-level.
      - id: S-6
        binds: controls before belief
        criterion: >-
          C-2's null arms are reported BEFORE any interpretation of the target arms, and C-3's
          known-answer fixture passes. If the nulls fail to discriminate, the run's headline IS that
          failure and no d'_F value is offered as evidence about Nagao.
      - id: S-7
        binds: artifact policy
        criterion: >-
          Every required artifact below is present, and every metric is machine-readable and re-derivable
          from the recorded rank series (M-3) without re-running the algebra.

  falsification_criterion: >-
    The hypothesis H-SEMBIN-a7e721 is falsified by F-1 (d'_F <= 4 on every shifted instance reached, with
    C-2 discriminating and C-5 holding). Its MECHANISM is falsified without its prediction by F-2 (shifted
    and unshifted agree). The MEASUREMENT is voided by F-3 (nulls match the target) or F-4 (non-monotone
    series, or a convention change moving a value). Each of F-3 and F-4 is an instrument outcome and is
    reported as one; neither is negative evidence about Nagao (core rule 5).

  # ==========================================================================
  proof_search_map:
    why_present: >-
      This contract bears on a published bound, which makes it proof-oriented under section 8 of
      docs/inventor-protocol.md. The four audits are cheap and are run BEFORE compute; a failed audit is
      frequently the useful result.
    exact_baseline_reproduction:
      audit: >-
        Reproduce, by hand and in the instrument, the fake-quantity value 2 for f1 = X1X2 + X3,
        f2 = X1 + X2, and the true first fall 3 for the same pair with the field equations outside.
      status: >-
        ALREADY DONE for the hand algebra, by the Coordinator, at
        coordination/review/sembin-20260916-propquant/coordinator-recheck.py, with the degree-2 search made
        exhaustive over all 31 nonzero coefficient choices. C-3 carries it into the instrument.
      what_a_failure_would_mean: >-
        That the instrument does not compute the quantity this contract names, before any Nagao instance
        is touched.
    observation_collision_search:
      audit: >-
        Search the corpus and this program's records for an existing measured first fall degree — true or
        fake — for summation-polynomial descents at these parameters, shifted or unshifted, before
        spending compute.
      status: >-
        REQUIRED BEFORE THE FIRST RUN and not yet performed. `search_knowledge` is the instrument
        (AGENTS.md knowledge retrieval policy: search before proposing an experiment likely to duplicate
        earlier work). Absence of a result is NOT evidence that nothing was tried; recall is a floor.
      what_a_collision_would_mean: >-
        Either the run is a replication, which is worth knowing and cheap to reframe, or the existing
        value disagrees with the prediction, which is worth more than the run.
    quantifier_order:
      audit: >-
        State the quantifier order of the claim being audited, explicitly.
      statement: >-
        Proposition 5 as read under DEC-20260916-88ac73: FOR ALL instances of the shifted degree-3 descent
        family, the TRUE first fall degree d_F is at most 4. This experiment measures, FOR SPECIFIC
        INSTANCES, the FAKE quantity d'_F. The audit's whole content is that these are different
        quantifiers over different quantities: an instance-level measurement of d'_F cannot contradict a
        universal statement about d_F in the direction Lemma 4 permits.
      status: >-
        PASSED, and it is the reason DC-1 exists. This audit is what the campaign got wrong before
        2026-09-16 and what a blind read corrected (CORR-20260916-96f47d).
    method_ceiling_and_nearby_object_control:
      audit: >-
        Name the ceiling the method cannot exceed, and run the method against a nearby object where the
        answer is known to differ.
      ceiling: >-
        The trivial Koszul ceiling: the literal true d_F of ANY cubic system with the field equations at
        p = 2 is at most 5, so Proposition 5's bound of 4 sits one degree below it. Any method whose
        headline is "the bound is nearly tight" is measuring the ceiling.
      nearby_object_control: >-
        C-2's two null arms, and specifically A-NULL-SHUFFLED, which preserves the exact monomial multiset
        of the target. If the method returns the same profile for the shuffled object, it is reading shape.
      status: PASSED as a design audit; C-2 and M-2 carry it into execution.
    proves_too_much:
      audit: >-
        Run the argument against an object for which its conclusion is known false.
      object: >-
        A degree-3 Boolean system with a PLANTED fall at degree 3 (C-3's second fixture). The argument
        "no fall at or below 4, therefore the borrowed estimate cannot carry the bound" must NOT go
        through for this object: the instrument must find the planted fall at 3.
      status: REQUIRED AS PART OF C-3, verdict recorded in the run.

  # ==========================================================================
  budget:
    wall_clock_seconds_per_arm_per_n: 1800
    wall_clock_seconds_total: 43200
    memory_gb: 10
    memory_enforcement: >-
      RESIDENT-SET watchdog, NEVER RLIMIT_AS. An RLIMIT_AS cap aborts algebra engines that reserve far
      more address space than they touch; that defect and its repair are recorded in
      EXP-ICPERF-e21835 and CORR-20260915-654160's lineage, and reintroducing it here would repeat a
      mistake this program has already paid for.
    maximum_runs: 4
    maximum_runs_note: >-
      One run per pass over the n-series. Four allows an initial pass, a repair pass, and two extensions
      of the series; it is not a licence to re-roll the nulls until they discriminate, which would void
      C-2 entirely.
    machine: 4 CPUs, 15 GB. Record the 1-minute load average at the start of every arm.
    cost_estimate: null
    cost_estimate_note: >-
      Advisory and deliberately null. Per the research-budget policy of 2026-09-06 an estimate does not
      gate the work; the stopping rules below do.

  stopping_rules:
    - id: SR-1
      rule: >-
        An arm that exceeds its per-arm wall budget at degree d STOPS and records M-1 as `> d-1`, a
        CENSORED observation. It never records "no fall".
    - id: SR-2
      rule: >-
        The n-series stops ascending when an arm at n censors. The series is reported for the n it
        completed; a truncated series is a complete result for its own scope (core rule 6).
    - id: SR-3
      rule: >-
        If C-3's known-answer fixture fails, THE RUN STOPS BEFORE MEASURING ANY NAGAO INSTANCE and reports
        an instrument failure. Measuring an unknown with an instrument that fails a known is worthless.
    - id: SR-4
      rule: >-
        If C-2's nulls fail to discriminate, the run COMPLETES the target arms — the data is worth
        keeping — but reports the null failure as its headline and offers no d'_F value as evidence about
        Nagao (S-6).
    - id: SR-5
      rule: >-
        A watchdog kill or an infrastructure failure ends the arm and is recorded as
        `failed_infrastructure`. It is never negative mathematical evidence (core rule 5).

  required_artifacts:
    - the exact command for every invocation, and the poll interval used for resident-set sampling
    - git commit AND dirty-tree state; if the tree is dirty, the per-file sha256 of every code file that
      ran, because a recorded commit that does not contain the bytes that ran recovers nothing
      (CORR-20260916-33068f D-2)
    - environment and dependency versions, including the algebra engine and its version if one is used
    - >-
      per arm per n, the generator set in canonical serialisation, its sha256, the basis of V, and every
      coset shift v_i as an explicit field element
    - every random seed for A-NULL-RANDOM and A-NULL-SHUFFLED
    - the full Macaulay rank series M-3 as machine-readable rows, from which M-1 must be re-derivable
      without re-running the algebra
    - M-1, M-2, M-4, M-5 per arm per n, with censoring flags
    - the C-3 fixture verdicts, the C-4 order-sensitivity comparison, the C-6 both-placements comparison
    - stdout and stderr per invocation
    - validity status and reason per arm
    - timestamps, load average at arm start, and resource measurements
    - the observation-collision search of the proof_search_map, with its queries and their results,
      recorded before the first measurement

  dependencies:
    - >-
      inputs/NAGAO-2015-984/paper_fulltext.md, frozen with its sha256 sidecar. Definitions 3, 6, 8,
      Proposition 5, Lemma 4 and footnote 1.
    - >-
      An implementation of the third summation polynomial and its Weil descent, written under this
      contract. NOTHING IS IMPORTED from another campaign's converter: EXP-ICPERF's converter emits for
      SAT and Gröbner engines over a different encoding, and reusing it would couple two audits through
      one implementation — the exact defect the ICPERF review found when two engines behind one converter
      were mistaken for independent agreement.
    - >-
      No dependency on GOAL-ICPERF-e6b6a4's instrument, and none on its results.

  write_scope_when_dispatched:
    - experiments/EXP-SEMBIN-4fa22c/code/
    - experiments/EXP-SEMBIN-4fa22c/runs/
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    fallback_note: >-
      TRUE, and declared here rather than amended after the fact. This checkout has no API credentials for
      any adapter backend (`adapter doctor`: ANTHROPIC_API_KEY and every other key unset), so the
      runtime-native binding permitted by core rule 16 is the only route and a card claiming otherwise
      would be false. DEC-20260916-7b2235 records the finding and its standing condition.
    degraded_allowed: false
    degraded_requirements_expected:
      - >-
        model_verified will be false: `doctor --probe` needs a usable backend. The resolved identifier is
        self-reported and is unverified configuration, not an established fact.
    independent_session_required: false
  review_plan_required_before_any_claim_transition: >-
    A result from this experiment that is presented as contradicting Proposition 5 requires
    `review-breakthrough` at `max`, undegradable, under core rule 12 — and in this environment that tier
    CANNOT BE SERVED, so such a claim would stay un-promoted while the campaign stays active. This
    contract does not pre-authorize a cheaper tier for a result it has not seen: DEC-20260916-88ac73
    declined to do so on the grounds that deciding a review tier in advance for an unobtained result is
    the shape of a silent downgrade. The tier is set by what a result claims, when it claims it.

  citations:
    - id: H-SEMBIN-a7e721
      provenance: internal
      what: the hypothesis this contract tests
      verified_by: coordinator, this session, which authored it
    - id: DEC-20260916-88ac73
      provenance: internal
      what: the decision imposing DC-1 through DC-4 and directing this contract be written
      verified_by: coordinator, this session
    - id: NAGAO-2015-984
      provenance: retrieved
      what: Definitions 3, 6 and 8, Proposition 5, Lemma 4, footnote 1, and conditions (1) at :401 / :439
      verified_by: >-
        the blind reader of coordination/review/sembin-20260916-propquant/report.md, and the Coordinator
        for the passages quoted in DEC-20260916-88ac73
    - id: CORR-20260916-33068f
      provenance: internal
      what: >-
        the poll-interval measurement floor and the dirty-tree provenance lesson, both written into
        required_artifacts and M-5 above
      verified_by: coordinator, this session, which authored it
