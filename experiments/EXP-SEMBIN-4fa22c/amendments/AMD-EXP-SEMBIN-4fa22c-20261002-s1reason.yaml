amendment:
  id: AMD-EXP-SEMBIN-4fa22c-20261002-s1reason
  experiment_id: EXP-SEMBIN-4fa22c
  decision_id: DEC-20261002-4242bd
  recorded_at: '2026-10-02'
  written_under_task: TASK-20261002-3361b3
  archived_by: TASK-20261002-81ff3c
  kind: additive_protocol_amendment
  subkind: reporting_annotation
  supersedes_fields: null
  does_not_rewrite:
    - experiments/EXP-SEMBIN-4fa22c/specification.yaml
    - experiments/EXP-SEMBIN-4fa22c/amendments/AMD-EXP-SEMBIN-4fa22c-20260916-collision.yaml
    - experiments/EXP-SEMBIN-4fa22c/amendments/AMD-EXP-SEMBIN-4fa22c-20260921-lemma4.yaml
  does_not_rewrite_note: >-
    The contract is frozen at version 1 and both earlier amendments are immutable. This amendment
    edits none of them. It ADDS one reporting requirement: an annotation printed next to S-1's
    frozen sentence. It does not change S-1's criterion text, its verdict rule (PASS or FAIL on
    the frozen text, exactly as before), any other criterion, any falsification criterion, any
    arm, metric, control, stopping rule, budget, maximum_runs or required artifact.
  authority: >-
    DEC-20261002-4242bd, ruling R-2 (the Coordinator disposition of the S-1 reason-text flag that
    DEC-20260928-3f71c4 NA-3 delegated). It holds no authority that decision does not record.
  applies_to: >-
    Runs of EXP-SEMBIN-4fa22c launched after this amendment's archive commit (TASK-20261002-81ff3c)
    is verified. It is prospective only. In the checkout this was written from (origin/main
    b29a6abafa as reported by the dispatching session), experiments/EXP-SEMBIN-4fa22c/ holds
    specification.yaml and amendments/ only: no code/ and no runs/. So no run record of this
    experiment exists on main, and the Coordinator writing this has read no outcome of it.
    Whether material from the 2026-09-16 epoch-1 and epoch-2 executor claims exists on
    origin/cursor/semaev-2015-audit-program-5b8b (PR #1377) is NOT KNOWN to this Coordinator,
    and that ref was not read. This amendment says nothing about whether any such material is
    admissible. It changes no pass or fail rule, so it cannot have been fitted to any outcome
    wherever an outcome may exist.

  why_this_amendment_exists: >-
    AMD-EXP-SEMBIN-4fa22c-20260921-lemma4 flagged this item and deliberately left it undecided,
    quoted: "a run satisfying S-1 as frozen will print, in its report, a reason that invokes the
    premise L-1 records as refuted at the declared equality convention, and this amendment
    imposes no annotation requirement that would soften it. Flagged so the next coordinating
    session sees it; a change there needs its own decision." DEC-20260928-3f71c4 NA-3 required
    the next card revision to record a disposition, "either an additive reporting annotation under
    a protocol_amendment, or a ruling that S-1 stands as frozen with the tension disclosed in the
    report". DEC-20261002-4242bd chose the first, for the reasons recorded at its R-2. In short,
    a disclosure that lived only on the dispatch card would bind the executor and nobody else.
    The reviewers of REVIEW-SEMBIN-20260916-cbb416 read experiments/EXP-SEMBIN-4fa22c/ and not
    the card, so a reporting requirement belongs in the protocol chain they read.

  # ==========================================================================
  changes:
    S1-A:
      title: >-
        S-1 STANDS AS FROZEN. Its reason clause gets one labelled annotation printed directly
        next to it.
      binds: >-
        S-1 (specification.yaml success_criterion.criteria, id S-1), additively. Also covers any
        place where the report quotes the same premise as it is restated in
        AMD-EXP-SEMBIN-4fa22c-20260916-collision what_this_amendment_does_not_do.
      what_is_unchanged: >-
        The run's report still contains S-1's sentence exactly as frozen, including "a measured
        d'_F > 4 is CONSISTENT with d_F <= 4 because Lemma 4 runs d_F <= d'_F, and that the
        instrument is structurally blind to the X^2 -> X falls that can make d_F small". S-1's
        verdict is still PASS or FAIL on that frozen text and on nothing else.
      requirement: >-
        Directly after the S-1 sentence (same section, no intervening sentence), the report prints
        the annotation below VERBATIM. Wherever else the report quotes the premise "Lemma 4 runs
        d_F <= d'_F", it either prints the annotation again or points to it by its label.
      annotation_text: >-
        ANNOTATION TO S-1 (AMD-EXP-SEMBIN-4fa22c-20261002-s1reason). The reason clause above,
        "because Lemma 4 runs d_F <= d'_F", is printed because S-1 is frozen. Its premise is
        recorded REFUTED as a universal statement at this contract's declared equality
        convention for condition (1), over F_2 at N <= 3
        (AMD-EXP-SEMBIN-4fa22c-20260921-lemma4 L-1; EV-SEMBIN-1ca3c8). That refutation is void
        under the literal ">=" reading printed in 2015/984. No d_F consequence in this report is
        discharged by citing Lemma 4 (AMD-EXP-SEMBIN-4fa22c-20260921-lemma4 L-2 requirement_5).
        This report's statement that it cannot refute Proposition 5 is also the content of design
        constraint DC-1, which does not cite Lemma 4: the instrument is structurally blind to the
        X^2 -> X falls that can make d_F small.
      sources_of_each_sentence_in_the_annotation:
        - sentence: the premise is recorded refuted at the declared equality convention, over F_2 at N <= 3
          source: >-
            AMD-EXP-SEMBIN-4fa22c-20260921-lemma4 L-1 what_is_recorded, quoted: "the universally
            quantified statement d_F <= d'_F, Lemma 4 of 2015/984, is REFUTED AS A UNIVERSAL
            STATEMENT"; and what_this_amendment_does_not_do: "every witness of EV-SEMBIN-1ca3c8
            is over F_2" and "every witness has N <= 3".
        - sentence: void under the literal ">=" reading
          source: >-
            DEC-20260916-87fc5c limitations, third entry, quoted verbatim between the markers
            [[ ]]: [[The refutation is void under the literal ">=" reading printed in 2015/984,
            under which the inequality holds and is empty.]]
            AMD-EXP-SEMBIN-4fa22c-20260921-lemma4 recorded_tension T-1 records that a reader's
            table may license a narrower void. This annotation states the void exactly as
            DEC-20260916-87fc5c states it and does not take a side on T-1.
        - sentence: no d_F consequence is discharged by citing Lemma 4
          source: >-
            AMD-EXP-SEMBIN-4fa22c-20260921-lemma4 L-2 requirement_5, quoted: "It may not cite
            Lemma 4 as a theorem in support of any d_F consequence stated under this clause".
        - sentence: DC-1 does not cite Lemma 4
          source: >-
            AMD-EXP-SEMBIN-4fa22c-20260921-lemma4 flagged_for_a_future_decision_and_NOT_amended_here,
            quoted: "DC-1, by contrast, does NOT cite Lemma 4: its argument is the structural
            blindness of a Boolean-ring Macaulay computation to X^2 -> X falls, which nothing in
            this round touches." DC-1's own text is specification.yaml design_constraints.DC-1.
      verdict_reporting: >-
        The run's per-criterion verdict table carries S-1's PASS or FAIL as before, plus a separate
        field `s1_annotation_present: true | false`. If the annotation is missing, that is a
        defect against this amendment and is reported as one. It is NOT turned into an S-1 FAIL,
        and it says nothing about Nagao.
      what_this_clause_does_not_assert: >-
        It does not decide whether S-1's conclusion survives without its printed reason, and it
        does not restate S-1 "more accurately". It reports two recorded facts next to a frozen
        sentence: the status of the premise (from L-1), and that DC-1 states the same conclusion on
        a ground that does not cite Lemma 4 (a textual fact about the contract). Readers are left
        to weigh them. It asserts nothing new about Lemma 4, Proposition 5, Assumption 1, any value
        of d_F or d'_F, any curve, or any parameter set.

  what_this_amendment_does_not_do:
    - It does not edit the frozen contract or either earlier amendment, by a single byte.
    - >-
      It does not change EXP-SEMBIN-4fa22c's status (approved, unrun on main), H-SEMBIN-a7e721's
      status, GOAL-SEMBIN-fcb7a2's status, or any completion criterion.
    - >-
      It does not approve, re-approve or dispatch a run. It adds no budget, run, arm, control or
      stopping rule.
    - It does not change S-1's verdict rule or any other criterion's.
    - >-
      It does not rule on whether any EXP-SEMBIN-4fa22c material on
      origin/cursor/semaev-2015-audit-program-5b8b is admissible, and it does not presume such
      material exists.
    - It promotes no claim. IMP-SEMBIN-FCB7A2-LEMMA4-TIER stands.

  citations:
    - ref: AMD-EXP-SEMBIN-4fa22c-20260921-lemma4
      provenance: internal
      claim: L-1's recorded refutation and scope, L-2 requirement_5, and the S-1 flag this amendment disposes of.
      verified_by: coordinator, TASK-20261002-3361b3, which read the committed file in full.
    - ref: DEC-20260916-87fc5c
      provenance: internal
      claim: the ">=" void limitation, quoted verbatim.
      verified_by: coordinator, TASK-20261002-3361b3, which read the committed record in full.
    - ref: DEC-20260928-3f71c4
      provenance: internal
      claim: NA-3, which delegates this disposition and names the two admissible routes.
      verified_by: coordinator, TASK-20261002-3361b3, which read the committed record in full.
    - ref: experiments/EXP-SEMBIN-4fa22c/specification.yaml
      provenance: internal
      claim: S-1's frozen text and DC-1's frozen text.
      verified_by: coordinator, TASK-20261002-3361b3, which read the relevant sections.
    - ref: EV-SEMBIN-1ca3c8
      provenance: internal
      claim: >-
        Cited by identifier only, as AMD-EXP-SEMBIN-4fa22c-20260921-lemma4 L-1 cites it. This task
        did not reopen the evidence record; every statement relying on it is quoted from L-1.
      verified_by: >-
        coordinator, TASK-20260921-d61759 (per AMD-EXP-SEMBIN-4fa22c-20260921-lemma4 citations);
        not re-read by TASK-20261002-3361b3.
