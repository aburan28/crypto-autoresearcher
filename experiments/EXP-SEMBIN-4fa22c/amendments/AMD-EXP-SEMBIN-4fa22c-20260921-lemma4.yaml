  supersedes_fields: null
  does_not_rewrite: experiments/EXP-SEMBIN-4fa22c/specification.yaml
  does_not_rewrite_note: >-
    The contract is frozen at version 1 and its own what_changed_at_approval says so. Nothing below
    edits it, and nothing below may be read as editing it. S-5's phrase "Lemma 4's inside form, which
    is UNPROVEN and whose literal form is verified false" was ACCURATE WHEN WRITTEN on 2026-09-16 and
    stays exactly as written; L-1 records that its premise has since been refuted, which is a
    different act from correcting it and is the only act available, because the contract is immutable
    (AGENTS.md core rule 4). Every clause here ADDS a reporting requirement or RECORDS A FACT; none
    removes, weakens, reinterprets, or restates "more accurately" a declared convention, arm, metric,
    control, success criterion, falsification criterion, stopping rule, budget, or required artifact.
    In particular L-4 does NOT remove control C-6, because removing a declared control is a rewrite.
  authority: >-
    Next action NA-1, ranked 1, of DEC-20260916-87fc5c, committed at
    ledger/decisions/DEC-20260916-87fc5c.yaml. This amendment mints no decision and holds no authority
    that decision did not already record. Its four clauses L-1 to L-4 implement NA-1's clauses (a) to
    (d) in order. Everything it may assert is bounded by that decision's `limitations` block and by
    section 5 of the ruling that decision transcribes -- in particular by section 5's "NOT
    ESTABLISHED, and not claimed" list, which this amendment carries into
    what_this_amendment_does_not_do so far as it bears on this contract. The one item of that list not
    carried below is "nothing about the first revision of 2013/549", which is not served, was not
    fetchable, and bears on no clause here.

  naming_convention_this_amendment_obeys: >-
    EVERY PLACEMENT NAMED BELOW NAMES ITS SIDE. "FAKE side" means the system whose fake first fall
    degree d'_F is taken; "TRUE side" means the system whose true first fall degree d_F is claimed.
    Lemma 4 as printed in 2015/984 puts S_fe INSIDE THE FAKE SYSTEM and OUTSIDE THE TRUE SYSTEM. This
    convention is imposed because ruling section 4.1 records that leaving the side implicit propagated
    an inside/outside distinction located on the FAKE side -- where it is inert, and therefore not a
    distinction at all -- through four committed documents over five days and into a dispatch card.
    CORR-20260916-96f47d drew the distinction on the TRUE side and drew it CORRECTLY; the drift is in
    the documents that restated it. This amendment does not add a fifth.

  cites:
    - DEC-20260916-87fc5c
    - EV-SEMBIN-1ca3c8
    - coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/ruling/composition.md
    - coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/read-nagao-2013-549/report.md
    - coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/read-semaev-2015-310/report.md
    - coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/read-semaev-2015-310/reextract.md
    - tools/lemma4_inside_form.py
    - tools/test_lemma4_inside_form.py
    - CORR-20260916-96f47d
    - CORR-20260921-942a62
    - TASK-20260916-9da6e0
    - TASK-20260916-64a93b

  why_this_amendment_exists: >-
    The frozen contract instructs an executor to lean on a statement this program has since shown to
    be false. S-5 directs that a confirmation direction "additionally carries its condition on Lemma
    4's inside form, which is UNPROVEN"; on 2026-09-21 that inside form was refuted at the contract's
    own declared equality convention, by two witnesses from two independent implementations
    (EV-SEMBIN-1ca3c8). A second, independent defect is that the inside/outside language S-5 uses was
    located on the FAKE side across this campaign's records, where adjoining S_fe changes d'_F by
    nothing -- so it does not name a weaker target that might have survived. The contract cannot be
    edited, and an executor reading only the contract would cite a refuted theorem in a run report.
    This amendment records the refutation at its exact scope, replaces the broken citation with a
    per-instance measurement the run can actually make, supplies the source anchor the campaign never
    recorded, and records what control C-6 can and cannot show. It changes no status and approves
    nothing.

  # ==========================================================================
  changes:
    L-1:
      title: >-
        S-5's PREMISE IS REFUTED at the contract's own declared equality convention -- and the
        contract's text is not touched
      implements: NA-1 clause (a)
      binds: >-
        S-5 (specification.yaml, the criterion whose text ends "its condition on Lemma 4's inside
        form, which is UNPROVEN and whose literal form is verified false"), read together with
        declared_conventions.condition_1
      what_is_recorded: >-
        At the EQUALITY reading of condition (1) of Definitions 5 and 6 of NAGAO-2015-984 -- which is
        this contract's declared convention -- the universally quantified statement d_F <= d'_F, Lemma
        4 of 2015/984, is REFUTED AS A UNIVERSAL STATEMENT. The honest word for S-5's "UNPROVEN" is
        now "REFUTED as a universal statement". Evidence: EV-SEMBIN-1ca3c8, whose witnesses are
        f_1 = X^2 Y, f_2 = XY + X over F_2[X,Y] (witness A, blind reader TASK-20260916-9da6e0) and
        f_1 = X_1X_2 + X_3, f_2 = X_1X_3 + X_2 over F_2[X_1,X_2,X_3] (witness B,
        tools/lemma4_inside_form.py, written independently and earlier). Both give d'_F = 2 and
        d_F = 3. The failure is not isolated: 94 of 400 random multilinear pairs at N = 3 violate the
        inequality (23.5%, seed 20260916).
      which_placements_are_refuted: >-
        TRUE SIDE, S_fe OUTSIDE the true system -- that is, d_F({f_1..f_M}) <= d'_F, Lemma 4's printed
        true-side placement: refuted by witness A. TRUE SIDE, S_fe INSIDE the true system -- that is,
        d_F({f_1..f_M} u S_fe) <= d'_F, the form this campaign's records describe as the one it
        depends on: refuted by witness A under the equality reading and by witness B. Both statements
        are refuted at the declared equality convention; neither is refuted "in general" beyond the
        boundaries below.
      scope_note_stated_in_the_same_breath: >-
        THE REFUTATION IS VOID UNDER THE LITERAL ">=" READING PRINTED IN 2015/984, under which the
        inequality HOLDS and is empty, both quantities collapsing to 1 + (least degree of a nonzero
        ideal element). This is DEC-20260916-87fc5c's third limitation, quoted rather than
        paraphrased, and it is stated here and not in a footnote because an amendment that records the
        refutation without the reading under which its target is TRUE overstates it. The EQUALITY
        reading is A DECLARED INTERPRETATION OF AN AMBIGUOUS SOURCE -- the contract says so itself at
        declared_conventions.condition_1 -- supported by three independent routes and SETTLED BY NONE.
        The three routes: 2013/549's own Definition 1 prints equality; a literal ">=" degenerates both
        quantities so that Assumption 1 of 2015/310 would be false outright (the contract's own route);
        and TASK-20260916-9da6e0's finding that under ">=" the derivation of Lemma 4 succeeds without
        using Lemma 3 at all, which is the other kind of proving-too-much. Whether the printed ">=" is
        authorial or a lost prime glyph is NOT determinable from the frozen text -- TASK-20260916-9da6e0
        establishes only that it is IN THE PDF and not an extraction artifact, which narrows the
        question to Nagao's intent and does not answer it.
      inertness_consequence_for_S_5_s_language: >-
        S-5's "inside form" language does NOT pick out a weaker target that might survive. Adjoining
        S_fe to the FAKE system leaves d'_F unchanged -- every member X_j^p - X_j given any multiplier
        h_j contributes h_j(X_j^p - X_j) = 0 mod S_fe, and Definition 6 states all three of its
        conditions mod S_fe, so such a member contributes deg = -infinity to condition (1) and nothing
        to conditions (2) and (3). Ruling section 3 rules this ESTABLISHED at p = 2, N <= 3, over F_2,
        under both readings of condition (1), on three independent supports: a one-line derivation
        from Definition 6 as printed, the blind reader exhaustively on witness A, and
        tools/lemma4_inside_form.py on witness B and on 300 random multilinear pairs at N = 3 with
        zero disagreements. CONSEQUENCE: on the FAKE side, "inside" and "outside" are THE SAME
        STATEMENT, so the campaign's inside/outside distinction -- located on the fake side in four
        committed documents (ruling 4.1) -- is not a distinction, and the "inside form" S-5 names is
        not a fallback position.
      what_this_clause_does_not_do: >-
        It does not edit S-5, does not change its verdict field, does not restate it, and does not
        relieve a run of satisfying S-5 as frozen. S-5 remains a criterion about what the run's report
        must state, and a run still reports both consequences for every measured d'_F. What L-2
        supplies is the route by which the confirmation-direction consequence may now be discharged.

    L-2:
      title: >-
        THE OPERATIVE CLAUSE -- per-instance U-4 bookkeeping. The d_F consequence is discharged by
        measurement at the instance, or it is not stated at all
      implements: NA-1 clause (b)
      binds: >-
        M-1 and M-3 (additively), S-5's both-consequences reporting rule, and required_artifacts
        (additively). It adds a required record and a reporting rule; it changes no metric definition,
        no arm, no control, no stopping rule and no budget.
      why_this_replaces_a_citation_with_a_measurement: >-
        An inference of the form "d'_F was measured at v, therefore d_F <= v" may no longer be
        discharged by citing Lemma 4 as a theorem (EV-SEMBIN-1ca3c8, `inference`). What the derivation
        from 2013/549's Lemma 2 actually delivers is d_F({f_1..f_M} u S_fe) <= max_i deg(g_i f_i) with
        the products taken UNREDUCED (TASK-20260916-9da6e0's derivation, steps 1-6, at
        read-nagao-2013-549/report.md :341-363). Turning that into <= d'_F needs the hypothesis the
        reader labels (H4) and records as U-4 -- "the witness realising d'_F satisfies
        max_i deg(g_i f_i) <= d'_F", i.e. its products lose no total degree under reduction mod S_fe
        (ibid. :365-368). U-4 is STATED IN NEITHER PAPER, does not follow from Definition 6 (which
        bounds only the REDUCED product degree), and cannot be closed by Lemma 2, whose bound is
        relative to deg R while deg R is itself governed by the unreduced product degree one step
        upstream (ibid. :370-375). Both papers discharge U-4 in their own applications by EXPLICIT
        BOOKKEEPING rather than by the fake definition -- Petit et al.'s multipliers have deg g_i <= 1
        and the [f]_i are reduced by construction, and 2015/984's Lemma 6 proof tracks the same
        quantities on already-reduced local polynomials (ibid. :438-444). This clause turns that route
        into a per-instance reporting requirement, which is exactly the resource reading recorded at
        EV-SEMBIN-1ca3c8 obstruction.resource_check.
      requirement_1_what_is_recorded_per_instance: >-
        FOR EVERY REPORTED VALUE OF M-1 (d'_F), per arm per n, the run records a `u4_bookkeeping`
        block in its machine-readable results, in the same machine-readable artifact that carries that
        M-1 value. IT IS RECORDED, NOT RE-DERIVED: a kernel vector is not recoverable from the rank
        series M-3, which records ranks and not witnesses, so a witness that is not written down is
        not recoverable at all. The block records, at minimum: (i) THE REALISING FAKE WITNESS -- the
        non-trivial degree-M-1 kernel vector the instrument reads M-1 off, per the contract's declared
        Koszul exclusion -- in canonical serialisation, as a multiplier tuple (g_1..g_M) with one
        multiplier g_i per generator f_i; (ii) for each i, the UNREDUCED TOTAL DEGREE deg(g_i f_i),
        computed in F_2[X_1..X_N] as an ordinary polynomial product BEFORE the Boolean identification
        X^2 = X (which at p = 2 IS reduction mod S_fe, so "unreduced" here means "before the Boolean
        reduction the instrument otherwise applies"); (iii) max_i deg(g_i f_i); (iv) the reported
        d'_F; (v) the boolean verdict `max_i deg(g_i f_i) <= d'_F` AT THAT INSTANCE.
      requirement_2_which_side_the_multipliers_are_read_on: >-
        The multipliers g_i are the multipliers of the FAKE-side witness -- the witness realising the
        d'_F this instrument measures, on the FAKE system. The degrees recorded are of those same
        multipliers against those same generators, computed without the Boolean reduction. No
        quantity in this block is measured on the TRUE side; the TRUE side appears only in the
        consequence permitted by requirement_4, and is named there.
      requirement_3_censored_instances: >-
        Where M-1 is censored under SR-1 or SR-2 there is no realising witness, so the block records
        `not_applicable: censored` with the censoring flag the contract already requires, and NO
        consequence of any kind is stated for that instance. A censored observation is not a value
        (M-1 `censoring`) and this clause does not make it one.
      requirement_4_what_the_report_MAY_state_where_the_verdict_holds: >-
        Only where `max_i deg(g_i f_i) <= d'_F` holds at that instance may the report state the d_F
        consequence, and it then states it in exactly this shape, on the TRUE side and with the field
        equations named as members: "at this instance, d_F of the TRUE system {the reduced degree-3
        descent generators} u S_fe is <= d'_F, DISCHARGED BY THE BOOKKEEPING RECORDED IN
        u4_bookkeeping." It states it as discharged by that bookkeeping and NOT by citing Lemma 4, in
        any direction, as a theorem. The report additionally states the hypotheses the derivation
        still consumes and that this bookkeeping does not discharge: (H1) = 2013/549's Lemma 2; U-2,
        the reduction-to-zero <=> ideal-membership equivalence that 2015/984 adds with an "i.e." and
        neither paper proves; U-5, that reduction mod S_fe is linear and never raises total degree;
        and U-6, the declared equality reading of condition (1), which L-1 records is a declared
        interpretation and not a settled fact. U-3 -- that S_fe is inside the system whose d_F is
        claimed -- is discharged by construction here, because the consequence is stated for the union.
      requirement_5_what_the_report_MAY_NOT_state: >-
        It may not state any consequence for d_F of the descent generators ALONE with S_fe OUTSIDE the
        TRUE system. That is Lemma 4's printed true-side placement, the derivation does not deliver it
        (step 6 of TASK-20260916-9da6e0's derivation fails: the witness it constructs needs the field
        equations as members), and witness A of EV-SEMBIN-1ca3c8 refutes it. It may not cite Lemma 4
        as a theorem in support of any d_F consequence stated under this clause, and it may not present
        the bookkeeping verdict at one instance as evidence about any other instance, any other n, any
        other arm, or any family.
      what_requirement_5_does_NOT_reach: >-
        THE PROHIBITION ABOVE IS SCOPED TO THE d_F CONSEQUENCE STATEMENTS THIS CLAUSE GOVERNS, and it
        is scoped deliberately. S-1's criterion text directs the report to state that a measured
        d'_F > 4 is consistent with d_F <= 4 "because Lemma 4 runs d_F <= d'_F". S-1 is frozen, NA-1
        directs nothing about it, and this amendment does not amend it -- see
        flagged_for_a_future_decision_and_NOT_amended_here. An executor satisfies S-1 as written. A
        blanket prohibition here would instead have put the amendment in contradiction with a declared
        success criterion, which an executor could only resolve by treating the amendment as
        overriding the contract -- a rewrite by another route, and the exact failure this amendment is
        written to avoid.
      requirement_6_where_the_verdict_FAILS: >-
        Where `max_i deg(g_i f_i) <= d'_F` fails at that instance, the run records the verdict, the
        value max_i deg(g_i f_i), and the gap max_i deg(g_i f_i) - d'_F, and the report states that NO
        d_F bound follows from that instance's measurement. IT DOES NOT STATE THAT d_F > d'_F THERE,
        and it does not report the failure as evidence against Lemma 4, against Proposition 5, or
        about the system: U-4 is a SUFFICIENT condition for the derivation to go through, and a
        witness that fails it establishes only that this route is unavailable at that instance.
      permitted_but_not_required_second_witness: >-
        U-4 as the reader states it is a property of A witness realising d'_F, so ONE witness
        satisfying it suffices for the derivation. If the exhibited witness fails the verdict, the run
        MAY -- it is not required to -- exhibit another non-trivial witness at the same degree M-1
        that satisfies it; if it does, that discharges the instance and both witnesses are recorded,
        the failing one never silently replaced. Any such search runs inside the contract's existing
        per-arm wall budget and stopping rules; THIS AMENDMENT ADDS NO BUDGET, NO RUN, AND NO ARM, and
        a search that does not complete is reported as not completed rather than as an absence.
      what_is_not_assumed: >-
        WHETHER THE EQS4 INSTANCES THIS CONTRACT WILL MEASURE ARE AMONG THE VIOLATING INSTANCES IS NOT
        ESTABLISHED AND IS NOT ASSUMED (DEC-20260916-87fc5c, fourth limitation). A counterexample
        refutes a universally quantified statement and says nothing about a typical instance, still
        less about a structured family. This clause exists precisely because the inference must now be
        discharged instance by instance; it predicts no outcome for that verdict at any n, and an
        executor must not treat either outcome as expected. Whether Nagao's own application chain
        discharges U-4 at the instances Proposition 5 covers is an OPEN question, ranked as NA-4 of
        DEC-20260916-87fc5c and not answered here.

    L-3:
      title: >-
        THE MISSING 2015/310 CITATION ANCHOR, and the LINK 1 characterisation qualification
      implements: NA-1 clause (c)
      binds: >-
        the contract's `citations` and `dependencies` blocks, additively. Neither is edited; this
        clause supplies the anchor they do not carry, at a path a reviewer can check.
      the_defect_being_repaired: >-
        NO RECORD OF THIS CAMPAIGN CITES 2015/310 AT ALL. TASK-20260916-64a93b established this by
        direct inspection (read-semaev-2015-310/report.md :88-97): H-SEMBIN-a7e721's `citations` block
        carries five entries and 2015/310 is not among them; EXP-SEMBIN-4fa22c's `citations` block
        carries four and it is not among them either; the contract's `dependencies` (:429-441) name
        only inputs/NAGAO-2015-984/paper_fulltext.md. The consumed Semaev statement therefore exists
        in this campaign's records ONLY as unanchored prose inside a `mechanism` field, with no
        section, equation, page or line anchor and no provenance marking. Ruling section 1.4 rules
        this a defect in the campaign's own records: a citation that cannot be checked without redoing
        that task's work is not a citation.
      anchor:
        work: >-
          Igor Semaev, "New algorithm for the discrete logarithm problem on elliptic curves", IACR
          ePrint 2015/310, revision of 2015-04-10.
        frozen_at: >-
          inputs/SEMAEV-2015-310/paper_fulltext.md, sha256
          3b3bea4c24c6265e1056b25ad41f6cec77669bcff9117e13e79163de3f68b8f3, verified against its
          sidecar by TASK-20260916-64a93b in session; and the PDF at
          inputs/SEMAEV-2015-310/eprint-2015-310.pdf, likewise sidecar-verified.
        consumed_statement: >-
          The section 4.5 FIRST FALL DEGREE result -- the number 4 -- for the descended chained S_3
          system. It is consumed THROUGH Nagao and not directly.
        section_and_line_range: >-
          Section 4.5 of inputs/SEMAEV-2015-310/paper_fulltext.md, lines :561-600 (PDF page 10). The
          load-bearing display sits at :574-589 and is unreadable in the frozen markdown; it was
          reassembled from PDF glyph coordinates and recorded as F-1 of
          read-semaev-2015-310/reextract.md. Section 4.4's first-fall-degree definition, which the
          qualification below turns on, is at :505-518 (reextract.md F-2).
        route_through_nagao: >-
          inputs/NAGAO-2015-984/paper_fulltext.md :587-600, Proposition 2, attributing the bound of 4
          at p = 2 to Semaev [14]; :719-729 and :844, Proposition 5 restating the same bound for EQS4
          with footnote 6 "The situation is the same as the Semaev's case. So, we omit the proof.";
          and :956-960, where Nagao's [14] is identified as 2015/310.
        ambiguity_recorded_and_NOT_resolved: >-
          Within section 4.5 there are three candidate statements and they are not the same claim.
          S-A at :97 (Introduction), "The first fall degree is proved to be 4" -- system-level,
          asserted as proved. S-B at :598-599 (section 4.5 body), "Anyway at least t - 2 of the
          equations in (5) have the first fall degree 4" -- per-equation and explicitly partial,
          excluding the terminal equation and, at t = 2, excluding every equation in the system. S-C
          at :602-605, Assumption 1, d_F4 <= 4 -- a different quantity, and labelled an assumption.
          TASK-20260916-64a93b was instructed not to resolve this by choosing and did not; THIS
          AMENDMENT DOES NOT CHOOSE EITHER. What is recorded is that the campaign's records do not
          say, and that S-A and S-B differ materially.
        provenance: retrieved
        verified_by: >-
          TASK-20260916-64a93b, which read the frozen text in full, verified both sidecars, and
          reassembled every relied-on formula from PDF glyph coordinates. NOT `recalled` -- no clause of
          this anchor comes from an unopened source, and none of it is this session's recollection.
      link_1_characterisation_qualification: >-
        RECORDED AS NA-1 (c) DIRECTS. H-SEMBIN-a7e721's LINK 1 calls Semaev's quantity the FAKE first
        fall degree. That is right about Semaev's COMPUTATION and wrong about Semaev's DEFINITION.
        Semaev's section 4.4 definition (:505-518) is stated for the system (12) over a field K with
        NO field equations and no reduction modulo them -- the TRUE first fall degree in Nagao's
        taxonomy (Definition 5, NAGAO-2015-984 :398-410) -- while section 4.5 computes deg_{F2} of the
        coordinate Boolean functions, which are multilinear by construction, i.e. the FAKE quantity
        (Definition 6, ibid. :430-448). Nagao says so in terms at ibid. :452-459: "In [14], Semaev
        says ... He uses the true definition of first fall degree." So Semaev STATES the result under
        the TRUE definition and calls it "proved" (:97), while his ARGUMENT computes the FAKE bound.
        LINK 1 therefore understates the paper in one direction while correctly identifying what the
        argument computes. Source: read-semaev-2015-310/report.md :116-124.
      what_this_clause_does_not_do: >-
        It does not move H-SEMBIN-a7e721, whose record is immutable and is not edited, and ruling
        section 1.4 carries the qualification as a next action expressly noting that it does not move
        the hypothesis. It does not resolve which of S-A, S-B, S-C the campaign consumes. It asserts
        nothing about whether Semaev's argument is correct -- ruling section 1.4 records that
        TASK-20260916-64a93b found its quantifier order to be the STRONGEST available, a single
        uniform witness, and that finding is not disturbed here.

    L-4:
      title: >-
        CONTROL C-6 IS STRUCTURALLY UNINFORMATIVE for the quantity this contract measures -- and IS
        NOT REMOVED
      implements: NA-1 clause (d)
      binds: >-
        C-6 (specification.yaml, FIELD-EQUATION PLACEMENT), and S-2, which requires the C-6
        both-placements comparison to be reported. Both stand. This clause changes neither.
      what_is_recorded: >-
        C-6 compares two measurements that are now known to be IDENTICAL for d'_F, so it CAN ONLY EVER
        REPORT AGREEMENT. C-6 places the field equations INSIDE THE GENERATING SET whose d'_F is
        measured -- that is, INSIDE THE FAKE SYSTEM -- and compares that against the same measurement
        with the field equations handled by Boolean reduction alone, which is the FAKE SYSTEM WITHOUT
        them. Both placements C-6 varies are on the FAKE SIDE. Inertness (ruling section 3;
        EV-SEMBIN-1ca3c8, the INERTNESS observation) makes those two systems have the same d'_F,
        identically, for every instance: each member X_j^2 + X_j given any multiplier contributes 0
        mod S_fe, and Definition 6 states all three of its conditions mod S_fe. Agreement is therefore
        STRUCTURALLY FORCED, not observed.
      the_control_is_NOT_removed: >-
        C-6 IS NOT REMOVED, NOT DOWNGRADED, AND NOT MADE OPTIONAL. Removing or relaxing a declared
        control is a rewrite and is forbidden to this amendment. C-6 is still run at one n and its
        both-placements comparison is still reported, exactly as C-6 and S-2 require.
      how_its_verdict_is_reported: >-
        Where C-6 agrees -- the only outcome a correct implementation can produce -- the run reports
        that outcome LABELLED AS STRUCTURALLY FORCED, in the shape "C-6 agreed, and agreement is
        forced by inertness, so this outcome is not a passed check", rather than as a control that
        passed. No conclusion of the run may rest on C-6's agreement, and C-6's agreement may not be
        offered as evidence that the declared convention is the one the code implements, nor as
        evidence of anything else. Report it, labelled; do not count it.
      an_observation_this_clause_records_and_does_not_act_on: >-
        C-6's stated `what_it_detects` reasons from "the literal-versus-inside distinction is exactly
        what makes Lemma 4 false in one form and plausible in the other". That distinction bears on
        Lemma 4 only on the TRUE SIDE, while the placements C-6 actually varies are on the FAKE SIDE,
        where by inertness there is no distinction. This is the same naming defect ruling section 4.1
        records in four other committed documents, appearing in the contract's own control rationale;
        it is why C-6 cannot show what its rationale says it shows. RECORDED, NOT ACTED ON: C-6's text
        is frozen, this amendment does not edit it, and ruling section 4.1 lists four documents rather
        than five -- the fifth locus is this amendment's own observation, derived from ruling section
        3, and a later reader may disagree with it without disturbing anything else here.
      a_reading_that_is_explicitly_not_a_requirement: >-
        Because agreement is forced by a one-line derivation, a DISAGREEMENT at C-6 would be
        information about the instrument rather than about the systems. THIS AMENDMENT DECLARES NO
        CRITERION, NO VERDICT, AND NO STOPPING RULE FOR THAT CASE, and does not route it to F-4 or to
