experiment:
  id: EXP-ECTD-d971bc
  hypothesis_id: H-ECTD-110aef
  question_id: RQ-ECTD-001
  goal_id: GOAL-ECTD-001
  source_proposal: IDEA-20260805-4f9881
  version: 1

  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  approval_status: >-
    Not approved. No approved_by field is present. Only the Coordinator approves
    an experiment (AGENTS.md rule 1). This contract does not amend, re-register,
    unfreeze, or supersede EXP-ECTD-001; it reads that contract's run driver and
    computes closed forms, and every proposed repair is an OFFER to the
    Coordinator.

  title: >-
    Pre-run forced-value audit of the queued heavy-tail screen: class-constancy
    of the mean yield, the 1.582 coverage ceiling, the median-degeneracy
    collision, and the constructibility of the mandatory planted control

  objective: >-
    If later approved and authorized, determine BEFORE BATCH-003 spends its
    40 CPU-hours whether EXP-ECTD-001's primary metric
    class_max_over_median_per_meter, with its frozen >=100x threshold, can fire
    on the three yield-shaped meters, and whether its mandatory
    CTRL-PLANTED-OUTLIER is constructible at fixed (B, m, N). Emit: the verbatim
    meter definitions; the closed-form lambda / cap / degeneracy-threshold /
    estimator-ceiling table over the frozen grid; a matched-null and
    positive-control simulation at KN-FIND-007's own sizes; and a constructive
    replacement statistic offered to the Coordinator. NO CURVE IS CONSTRUCTED, NO
    GROEBNER BASIS IS COMPUTED, NO DISCRETE LOGARITHM IS SOLVED.

  what_this_is_not:
    - Not an ECDLP attack, a relation collection, a Groebner computation, or a discrete-logarithm solve.
    - Not a claim about whether rare trapdoor endpoints exist. It audits an instrument; a mechanism question is not answered by a measurement audit.
    - Not evidence for or against H-ECTD-001. That hypothesis's mathematical content is untouched.
    - Not a statement about groebner_solving_degree_d_reg or macaulay_rank_defect_at_first_fall. Those two of the five primary meters are outside this contract entirely and the delta_d_reg >= 2 route to heavy_tail_hit remains fully live.
    - Not an amendment to a frozen contract, and not a status change to any record.
    - Not a run, an observation, or evidence. No execution has occurred.
    - Not a claim that EXP-ECTD-001 should not run. The two Groebner/Macaulay meters may well justify it; that is the Coordinator's call, not this contract's.

  claim_ceiling:
    tier: toy
    scope: >-
      A run could support, at most: that under EXP-ECTD-001's own frozen
      factor-base rule and Tate's class-constancy of N, the closed-form mean
      yield lambda = binomial(B+m-1,m)/N is identical on every curve of a class;
      that cap(lambda) = min(1,lambda)/(1-exp(-lambda)) is at most 1.5820 for
      every lambda; that "max/median >= 100" is equivalent to
      "median <= min(1,lambda)/100"; that no >=100x planted mean-or-coverage
      outlier is constructible at fixed (B, m, N); and that a toy simulation at
      N = 2^14/2^16/2^18 reproduces those forced values while a matched null and
      a structured positive control behave as derived. NOT CLAIMABLE UNDER ANY
      OUTCOME: that class-internal heterogeneity does not exist; that the
      trapdoor lane is closed; anything at all about the two Groebner/Macaulay
      meters; any crypto-scale statement; any status change.

  inputs:
    frozen_contract_read: experiments/EXP-ECTD-001/specification.yaml
    meters_audited:
      - semaev_m3_relation_density
      - semaev_m4_relation_density
      - fb_decomposition_probability
    meters_explicitly_not_audited:
      - groebner_solving_degree_d_reg
      - macaulay_rank_defect_at_first_fall
    closed_form_grid:
      n_bits: [40, 44, 48, 52, 56]
      m_values: [3, 4]
      B_ladder_rule: >-
        B ranges over round(2^k * N^(1/m)) for k in {-2, -1, 0, 1, 2}, computed
        as exact integers from the exact N of each cell. The ladder is declared
        here in full so that a third party reproduces the grid without seeing any
        result; no B is chosen after a number is observed.
      class_size_assumed: 64
      class_size_assumed_note: >-
        64 is EXP-ECTD-001's own frozen min_class_size and is used only in the
        estimator-ceiling arm. Note that EXP-ECTD-45290a's census bears on
        whether a class of exactly 64 is typical; the two contracts must not be
        cross-compared inside either one's artifacts.
    simulation_grid:
      N_values: [16384, 65536, 262144]
      N_values_note: >-
        Exactly the sizes KN-FIND-007 used (2^14, 2^16, 2^18), so the simulation
        arm reproduces a committed fixture rather than opening a new size regime.
      m_values: [3]
      B_values_rule: B = round(N^(1/3)) and 2*round(N^(1/3)), exact integers
      n_random_subsets: 64
      target_sample_size_S: [1024, 16384, 262144]
      graded_fractions: [0.0, 0.25, 0.5, 0.75, 1.0]
    master_seed: 110240857
    seed_derivation_rule: >-
      Every random draw uses SHA-256 over the ASCII byte string
      "EXP-ECTD-d971bc/v1" || "|" || label || "|" || decimal(N) || "|" ||
      decimal(B) || "|" || decimal(counter), with the digest interpreted as a
      big-endian unsigned integer and reduced by rejection sampling into the
      required range (discard r >= floor(2^256 / M) * M, else emit r mod M).
      Labels are exactly: "null-subset", "graded-path", "target-sample". The
      counter advances once per digest consumed. A third party reproduces every
      draw bit-for-bit from this rule and the master seed, with no other state.
    arithmetic_rule: >-
      lambda is computed as an exact rational from exact integer binomial
      coefficients; no floating point enters it. Floating point appears only in
      cap(lambda), the estimator ceiling and the reported ratios, each to 6
      significant figures with the exact rational retained in the raw artifact.

  arms_and_controls:
    treatment: >-
      Closed-form evaluation of lambda = binomial(B+m-1,m)/N,
      cap(lambda) = min(1,lambda)/(1-exp(-lambda)), the degeneracy threshold
      min(1,lambda)/100, and the estimator ceiling S*lambda at which
      1 + 2.2414/sqrt(S*lambda) reaches 100, over the whole closed_form_grid;
      plus the simulation arm's measured max/median over 64 random B-subsets of
      Z/N at each simulation cell.
    measured_null: >-
      NULL-RANDOM-SUBSET. 64 independent uniformly random B-element subsets of
      Z/N \ {0}, matched on N, on B, on m, and on the estimator's target sample
      size S, and containing NO ELLIPTIC CURVE AT ALL. FORCED VALUES DERIVED
      BEFORE THE RUN: every subset has the identical exact lambda; the measured
      max/median must lie below cap(lambda) and hence below 1.5820; and the
      measured coverage must concentrate near 1 - exp(-lambda). THIS NULL CAN
      FAIL IN A WAY THAT MATTERS: if its max/median or coverage differs
      materially from what a curve-point base gives at matched (N, B, m, S), then
      the group-only model is incomplete, curve geometry does enter the yield
      statistics, and the audit's scope is wrong -- WHICH WOULD BE A POSITIVE
      FINDING FOR THE CAMPAIGN and the design wants it found.
    positive_control: >-
      CTRL-SMALL-MULTIPLES, the nearby structured object where the effect MUST
      appear. D = {g, 2g, ..., Bg} for a generator g of Z/N, at matched B.
      KN-FIND-007 records for this base family a coverage ratio of 0.0021 at
      2^18 and a concentration statistic reaching 1224x; those are THAT RECORD'S
      measurements, cited and not re-asserted here. THE INSTRUMENT MUST REPRODUCE
      A COLLAPSED COVERAGE AND A LARGE CONCENTRATION, at matched B, with lambda
      UNCHANGED. IF IT DOES NOT, THE IMPLEMENTATION CANNOT SEE STRUCTURE AT ALL
      AND NO NEGATIVE FROM ANY ARM MAY BE REPORTED. Note precisely what this
      control demonstrates: a 1224x effect IS available in this system -- in the
      concentration, and downward in coverage, never upward in the mean.
    graded_control: >-
      CTRL-GRADED, five interior points, monotonicity reported, and it carries
      one quantity that MUST move and one that MUST NOT. Interpolate from the
      uniformly random base to the small-multiples base by replacing a fraction
      f in {0, 0.25, 0.5, 0.75, 1.0} of the base with small multiples, at fixed
      B. FORCED: lambda is invariant along the ENTIRE path because it depends
      only on (B, m, N) -- a lambda that moves with f is an implementation error
      and voids the arm -- while coverage must fall monotonically and
      concentration must rise monotonically. A coverage that fails to fall as f
      rises is the canonical artifact tell: a quantity that does not respond to
      the parameter meant to move it. The joint test (one invariant, two
      monotone) is strictly stronger than any of the three alone and localises an
      obstruction instead of leaving "it did not work".
    ordering_control: >-
      NULL-RANDOM-SUBSET and CTRL-SMALL-MULTIPLES are computed, hashed and
      committed BEFORE any treatment table is read, and the decision rule is
      executed on the null first. If the rule emits the same verdict on the null
      as on the treatment it discriminates nothing and MUST be rewritten before
      the treatment arm is looked at. Absence of the pre-commit hash is
      invalid_measurement.
    comparability_policy: >-
      No comparison to EXP-ECTD-001's own future run outputs, to EXP-ECTD-45290a,
      or to EXP-FB3-001 may be made inside this run's artifacts. KN-FIND-007's
      recorded figures are CITED as that record's measurements and are never
      merged with numbers produced here. Any cross-contract comparison requires a
      separately registered comparator naming both domains, both statistics, the
      expected relation, and the failure disposition.

  independent_variables:
    - N
    - B
    - m
    - arm (treatment closed-form, null random subset, small-multiples control, graded fraction f)
    - target sample size S
    - graded fraction f

  metrics:
    primary:
      - lambda_exact = binomial(B+m-1,m)/N, as an exact rational, per grid cell
      - true_mean_ratio = max_curves(lambda) / median_curves(lambda), per class -- forced 1.000000
      - cap_lambda = min(1,lambda)/(1-exp(-lambda)), per grid cell, and its global maximum
      - degeneracy_threshold = min(1,lambda)/100, per grid cell
      - estimator_ceiling = the S*lambda at which 1 + 2.2414/sqrt(S*lambda) = 100
      - planted_constructibility_count = number of the three audited meters admitting a >=100x planted outlier at fixed (B,m,N) -- forced 0
      - measured max/median over 64 random subsets per simulation cell, against cap_lambda
      - coverage and concentration per arm, and along the graded path
    secondary:
      - verbatim meter definitions extracted from the EXP-ECTD-001 run driver, per meter
      - which of the three audited meters the identity actually covers, after Stage 1
      - exact-mean reproduction check against the closed form on a directly enumerated toy group
      - the constructive replacement statistic z_E with its multiple-comparison correction, evaluated on all arms
      - wall clock and peak RSS per cell

  heuristic_under_test: HEUR-ECTD-YIELD-2
  heuristic_under_test_note: >-
    HEUR-ECTD-YIELD-2 (the normal approximation behind the estimator ceiling) is
    the ONLY modelled step in the hypothesis and is therefore the only one that
    can be "under test" in the usual sense. Forced values V1-V4 rest on exact
    counting and Tate's theorem; they are CHECKED by this contract, not tested by
    it, and the distinction is preserved in every artifact.

  preregistered_prediction:
    quantity: >-
      The eight primary metrics, each with an exact value or a numeric band fixed
      before execution.
    formula: >-
      lambda_exact = binomial(B+m-1,m)/N, identical for every curve of a class.
      true_mean_ratio = EXACTLY 1.000000 on every class, every m, every B.
      cap_lambda <= 1.5820 at EVERY grid cell, with global maximum exactly
      1/(1 - 1/e) = 1.581977 at lambda = 1; hand-checkable points
      cap(0.167) = 1.0836, cap(0.3) = 1.1574, cap(1) = 1.58198, cap(2) = 1.1565.
      Hence the frozen >=100x threshold is unreachable by a factor of >= 63.2.
      degeneracy_threshold: "max/median >= 100" is equivalent to
      "median <= min(1,lambda)/100" at 100 percent of grid cells.
      estimator_ceiling: S*lambda <= 0.0005 is required for the ratio to reach
      100, against a driver S*lambda that must be orders of magnitude larger for
      the meter to be estimable at all.
      planted_constructibility_count = EXACTLY 0.
      measured max/median over 64 random subsets: below cap_lambda at every
      simulation cell, and approximately 1 + 2.2414/sqrt(S*lambda).
      CTRL-SMALL-MULTIPLES: lambda unchanged, coverage collapsed, concentration
      large; the graded path monotone in both directions with lambda flat.
    source: >-
      H-ECTD-110aef predictions V1-V7, derived in IDEA-20260805-4f9881 from
      knowledge/findings/KN-FIND-007.md (in-corpus, proof_status derivation,
      confidence established) plus Tate's isogeny theorem (RECALLED, no theorem
      number asserted) plus EXP-ECTD-001's own frozen factor-base rule and
      invalidation rule.
    provenance_of_cited_figures: >-
      The coverage ratio 0.0021 at 2^18, the concentration 1224x, the 144 cells
      with maximum absolute deviation exactly 0, and the typed-decomposition
      penalty 4.817x are KN-FIND-007's RECORDED MEASUREMENTS. They are cited as
      that record's figures and are NOT this contract's measurements, NOT
      re-derived here, and NOT merged with any number this run produces.

  scale_relevance:
    tier: toy
    justification: >-
      The closed-form arm is size-independent algebra evaluated at the frozen
      contract's own 40-56 bit grid, so it is not an extrapolation: a binomial
      coefficient divided by N is exact at any size. The simulation arm runs at
      N = 2^14/2^16/2^18 and is a CONFIRMATION OF A DERIVATION at the sizes
      KN-FIND-007 already used, not a measurement extended to a new regime. Both
      distinctions must be preserved in every artifact, because collapsing them
      is precisely the error this audit exists to catch elsewhere.
    correspondence: >-
      null. No sampling correspondence is used. The simulation draws directly in
      Z/N, which is the group every curve in the class is isomorphic to when N is
      prime, and that isomorphism is the reason the simulation is legitimate --
      stated here so a reviewer can attack it.

  tail_checks:
    - id: TAIL-YIELD-CEILING
      check: >-
        Beyond the bulk agreement, compare the SINGLE LARGEST measured coverage
        across all arms against the hard ceiling min(1, lambda). A single
        coverage above the ceiling is impossible by counting, so its appearance
        is an implementation defect that voids the arm regardless of how well the
        bulk fits.
    - id: TAIL-YIELD-CONCENTRATION
      check: >-
        Report the largest measured max_r c_D(r) per arm against the Poisson
        extreme-value prediction for the random arm. The structured arm must
        exceed it substantially; the random arm must not. This is the check that
        distinguishes "the instrument sees structure" from "the instrument sees
        noise", and it is reported before any conclusion about the treatment.
    - id: TAIL-YIELD-LAMBDA-FLAT
      check: >-
        The measured mean must agree with the exact closed-form lambda at EVERY
        arm and EVERY graded fraction, within the sampling error of S draws. A
        measured mean that drifts with f, or with the arm, contradicts an exact
        identity and voids the whole run.

  replication:
    seeds: [110240857]
    seed_note: >-
      One master seed with the deterministic derivation rule above; per-cell
      streams are separated by label, N, B and counter, so cells are independent
      without needing independent seeds. Two runs at the same master seed must
      agree bit-for-bit; a disagreement is an infrastructure fault.
    independent_instances: 3
    planned_runs:
      - id: RUN-ECTD-d971bc-read
        purpose: >-
          Stage 1 only -- extract the verbatim meter definitions from the
          EXP-ECTD-001 run driver and report which of the three audited meters
          the identity actually covers. THIS RUN ALONE CAN TERMINATE THE AUDIT.
      - id: RUN-ECTD-d971bc-audit
        purpose: >-
          Stages 2 and 3 -- the closed-form table and the simulation arms with
          all controls.

  stages:
    - id: S1
      name: meter definition extraction
      cost: reading, zero compute, ~30 minutes
      can_terminate: true
      description: >-
        Open EXP-ECTD-001's run driver and record the EXACT formula of each of
        the five primary meters, verbatim, with file and line. Classify each of
        the three audited meters as yield-shaped or not. IF NONE IS YIELD-SHAPED,
        THE AUDIT STOPS HERE, reports that the identity binds nothing, and
        BATCH-003 proceeds unchanged -- a fully acceptable, pre-registered
        outcome. If the driver does not exist or does not define its meters
        precisely enough to classify, that is an INFRASTRUCTURE AND SPECIFICATION
        finding reported as such, and it is itself a useful deliverable, because
        a frozen contract whose primary metrics cannot be read is not
        reproducible by a third party.
    - id: S2
      name: closed-form table
      cost: exact integer arithmetic, minutes
      can_terminate: true
      description: >-
        lambda, cap(lambda), the degeneracy threshold, the estimator ceiling, and
        the planted-constructibility count, over the whole closed_form_grid. This
        stage contains the decisive content and costs minutes. If cap(lambda)
        exceeds 1.5820 at any cell the V2 calculus is wrong and the audit stops.
    - id: S3
      name: simulation with all controls
      cost: minutes to ~1.5 hours
      can_terminate: false
      description: >-
        Null, positive control, graded path, and the exact-mean reproduction
        check, at the three simulation N. Ordering control enforced. May be
        truncated at the wall clock without affecting S2's content.
    - id: S4
      name: constructive replacement
      cost: zero compute
      can_terminate: false
      description: >-
        Evaluate the proposed z_E statistic on every arm already computed and
        report its power against the ratio statistic at matched S. Emit it as an
        OFFER to the Coordinator, never as an amendment.
  stage_order_rationale: >-
    S1 is reading and can end the audit; S2 is minutes of integer arithmetic and
    carries the decisive forced values. The expensive simulation runs last and
    only confirms. No expensive stage precedes a cheap one that could have
    terminated it.

  budget:
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 3
    maximum_memory_gb: 2
    maximum_runs: 2
    maximum_total_disk_bytes: 536870912
    no_network: true

  stopping_rules:
    - Do not execute while status is review_required, frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Stop after S1 and report if none of the three audited meters is yield-shaped.
    - Stop and report a specification finding if the run driver does not define its meters precisely enough to classify.
    - Stop before S3 if the null and positive-control results have not been computed, hashed and committed.
    - Stop and report instrument_void if CTRL-SMALL-MULTIPLES does not show a coverage collapse and a concentration spike.
    - Stop and report if any measured coverage exceeds min(1, lambda) or any measured mean departs from the exact lambda beyond sampling error.
    - Truncate S3 at the wall clock and report the cells covered; truncation is never a negative result.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Missing pre-commit hash for the null and positive-control arms.
    - Any floating point inside lambda or inside the binomial coefficients.
    - Any B chosen after a result is observed, or any grid cell added post hoc.
    - Any artifact that states a conclusion covering more than the three audited meters.
    - Any merging of KN-FIND-007's cited figures with numbers produced by this run.
    - Any cross-contract comparison without a separately registered comparator.

  infrastructure_failure_disposition: >-
    A timeout, crash, out-of-memory, missing run driver, or unreadable file is
    reported as an INFRASTRUCTURE SIGNAL with the exact failing command and
    resource state, and is NEVER negative mathematical evidence against
    H-ECTD-110aef, H-ECTD-001, or any ECTD proposition (AGENTS.md rule 5). In
    particular, an S3 that does not finish its largest simulation cell reports
    the cells it covered; that is a budget outcome and never a statement about
    the identity, which S2 has already checked in closed form.

  success_criterion: >-
    This draft has NO current success outcome because it is not authorized for
    execution. If a later, separately approved and frozen successor is executed,
    its only positive disposition is: verbatim meter definitions extracted with
    file and line; the closed-form table complete over the grid with cap(lambda)
    <= 1.5820 everywhere and the planted-constructibility count exactly 0; the
    null arm below cap and the positive control showing a coverage collapse with
    a large concentration; the graded path monotone in coverage and
    concentration with lambda flat; and the explicit statement, in every
    artifact, of which two meters the audit does not cover. THAT DISPOSITION
    ESTABLISHES NO ECDLP ATTACK, NO EXPONENT, NO CLAIM ABOUT WHETHER RARE
    TRAPDOOR ENDPOINTS EXIST, AND NO STATUS CHANGE TO ANY RECORD.

  falsification_criterion: >-
    Any of H-ECTD-110aef's F1-F6. Chiefly: an executor constructs a >=100x
    planted mean-or-coverage outlier at fixed (B, m, N), refuting the derivation
    outright and confirming EXP-ECTD-001 sound as frozen (F1); or S1 finds none
    of the three meters is yield-shaped, collapsing the audit's scope (F2, the
    most likely single failure); or a grid cell yields cap(lambda) > 1.5820,
    refuting the V2 calculus (F3).

  outcomes:
    no_execution_authorization: >-
      The only current disposition: a review_required draft. No run, no
      observation, no evidence, no mathematical inference.
    future_valid_audit: >-
      Only after separate approval, freezing, authorization and a valid
      execution. Scoped to three of five meters, toy tier, instrument-level.
    scope_collapse: >-
      S1 finds the audited meters are not yield-shaped. Reported as such;
      BATCH-003 proceeds unchanged. This is a legitimate outcome, not a failure.
    instrument_void: >-
      CTRL-SMALL-MULTIPLES fails. No negative from any arm may be reported.
    infrastructure_or_integrity_failure: >-
      Inconclusive infrastructure signal, never evidence against any proposition.

  required_artifacts:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - Exact command, driver version, git commit and dirty-tree state, environment.json.
    - Verbatim meter definitions with file and line, and the yield-shaped classification of each.
    - Pre-commit hash of the null and positive-control results, timestamped before the treatment arm.
    - The closed-form table over the full grid, machine-readable, with exact rationals for lambda.
    - Per-arm coverage, concentration and max/median tables, with S, B, m, N on every row.
    - The graded-path table with monotonicity explicitly reported for coverage and concentration and flatness explicitly reported for lambda.
    - The three tail checks.
    - The constructive replacement statistic with its evaluation on every arm, marked as an offer to the Coordinator.
    - An explicit statement, in the execution report, of the two meters this audit does not cover.
    - Wall clock, peak RSS, stdout, stderr, and an execution report naming which stages completed and which were truncated.

  assigned_to: executor
  approved_by: null

  review_notes:
    - >-
      Reviewers are asked to attack, in this order: (1) the assumption that the
      three audited meters are yield-shaped -- this is the audit's largest
      exposure and S1 exists solely to remove it; (2) the V2 cap derivation,
      specifically the use of 1 - exp(-lambda) as the median curve's coverage,
      and whether a legitimately non-Poisson median could lift the ratio above
      1.582; (3) whether the simulation in Z/N is a fair stand-in for a curve
      group of prime order N, which the contract asserts via the group
      isomorphism and which the null arm tests directly.
    - >-
      A reviewer who judges S1 and S2 sufficient may decline S3; the closed-form
      content does not depend on it. That would cost under an hour and is
      pre-registered as an acceptable outcome.
    - >-
      This contract is deliberately ordered so that its cheapest stage is its
      most decisive, and so that its most likely failure mode (S1 scope collapse)
      is pre-registered as an acceptable result rather than as a defeat.
