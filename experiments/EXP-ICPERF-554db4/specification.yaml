experiment:
  id: EXP-ICPERF-554db4
  version: 1
  title: Gamma-bound blind schedule and sorted-summand binary m8 positive gate
  goal_id: GOAL-ICPERF-e6b6a4
  question_id: RQ-ICPERF-94c86e
  hypothesis_id: H-ICPERF-3982eb
  idea_ids: [IDEA-20261017-3f46a5]
  batch_id: BATCH-f08d22
  status: review_required
  approved_by: null
  execution_authorized: false
  frozen: false
  designed_at: '2026-10-18'
  designed_by: coordinator
  designed_by_decision: DEC-20261018-273b2d
  objective: >-
    Remove the prior gamma admission ambiguity by a prospective statement-only
    blind target replay, then compare original and target-blind sorted-summand
    XCNF encodings on two separately planted, full-point-verified binary m=8
    controls. This is a solver instrument and input-identifiability gate. It
    contains zero natural solver calls and asserts no factor-base quality or
    end-to-end speed result.
  scope:
    family: ordinary_binary
    curve: y^2+xy=x^3+31 over GF(2)[u]/(u^61+u^5+u^2+u+1)
    field_polynomial_bits: 2305843009213693991
    b_polynomial_bits: 31
    subgroup_order_r: 576460752557211763
    cofactor: 4
    source_point: [1, 446358225178544464]
    generator: [938161616493806685, 1665004790792120888]
    torsion_point_T: [70364449406991, 2147483661]
    gamma: 70364449406991
    gamma_definition: >-
      gamma is the unique fourth root b^(1/4) in the declared GF(2^61)
      representation and equals x(T), T=[r]P_source. Derive and verify both
      equalities using only this statement and the named curve fixture.
    arity_m: 8
    addition_equations: seven chained three-point equations
    bases:
      weighted: 316 projected sign-folded columns
      local_random: 316 projected sign-folded columns
    positives: one separately planted target for each base
    natural_solver_calls: 0
    direct_summation_note: >-
      The present eight-summand chain uses seven S3 equations. A direct S8
      uses seven summands plus its target; direct eight-summand comparison
      would require S9 and is a different frozen experiment.
  immutable_predecessor:
    experiment: EXP-ICPERF-018b0c
    positive_run: RUN-ICPERF-712e85
    natural_run: RUN-ICPERF-1c8bfe
    evidence: EV-ICPERF-54ac6b
    decision: DEC-20261017-3b87bf
    observed_scope: >-
      Two original planted calls were each wall-censored at 300 seconds;
      natural calls attempted zero of 64. The predecessor remains immutable.
  input_bindings:
    curve_fixture: {path: research/icperf_ordinary_binary_fixture_20261017/fixture.json, sha256: 230d941d79152b17697341f65e5a46ddd2e3deb5e58f9ca21be889e49a5df39a}
    weighted_base: {path: research/icperf_binary_torsion_k11_weighted_20261017/base.json, sha256: 339495624ac88d2539f1792502993a4d2889229099cf107987ee0d77f0b39833}
    local_random_base: {path: research/icperf_binary_torsion_k11_local_control_20261017/base.json, sha256: 181e53a33197f002c66e27a6b7b995b73d5924ae708031774cffb8f098afa8b0}
    original_positive_manifest: {path: experiments/EXP-ICPERF-018b0c/inputs/positive_manifest.json, sha256: 87095048bb6717eb3ec1d94acb34d9ee3cc9b0257a7432cf0e68d593a9bed068}
    original_target_manifest: {path: experiments/EXP-ICPERF-018b0c/inputs/target_manifest.json, sha256: 973655e9329f060364d77511b490833066193e1f22a910fbdd65fa59d706d285}
    original_formula_manifest: {path: experiments/EXP-ICPERF-018b0c/inputs/formula_manifest.json, sha256: 82b0129ad0e9879c629414d24966161246435856b9d14cdbe1310ce477629368}
    original_weighted_formula: {path: research/icperf_binary_k11_planted_xcnf_20261017/complete/weighted.xcnf.gz, sha256: 9db4759522bff9a039930e5fca9257128c7e2a9615164f97b563d8c449a0b050}
    original_local_formula: {path: research/icperf_binary_k11_planted_xcnf_20261017/complete/local_random.xcnf.gz, sha256: a0e24b789ddee407f68115eec26ec528a0c829dfe4970fab065ccaeab1c2dbfc}
    original_weighted_model: {path: research/icperf_binary_k11_planted_xcnf_20261017/complete/weighted.known_model.txt, sha256: 0a8f2cfd091b50ebd22a67e3cbadbeddf516d6d2560bff95eab19ac7e22fc888}
    original_local_model: {path: research/icperf_binary_k11_planted_xcnf_20261017/complete/local_random.known_model.txt, sha256: 5b97613d54cc38daed76da8c8a3d5017060d1d69ee5fec19f0d47ee65ea43be8}
    original_solver_binary: {path: /opt/homebrew/bin/cryptominisat5, sha256: a3f85c3709b5e2a040bf82a4a604d1c7b9f10219bbf180a9e0f72319a2e892ac}
  target_schedule:
    domain: ICPERF-k11-natural-v1
    scalar_rule: >-
      For uint32 big-endian j starting at 0, k_j=1+(int(SHA256(
      b'ICPERF-k11-natural-v1\0' || bytes.fromhex(fixture_sha256) ||
      uint32_be(j))) mod (r-1)); Q_j=[k_j]G. The scalar is public only to
      the independent known-answer checker. Neither base nor solver output
      enters candidate selection.
    raw_channels: >-
      R0=[inverse_mod(4,r)]Q_j; T=[r]P_source. For c=0,1,2,3 take
      R_c=R0+[c]T, each projecting under [4] to Q_j.
    admission: >-
      Scan j=0..1023 and take the first eight distinct Q_j for which all
      four R_c are affine, have x != 0, and have x != gamma. The last
      predicate excludes the pole of t=gamma/(x+gamma). Record each
      rejection and reason; fewer than eight admissions invalidates input
      preparation.
    predicted_reference_check: >-
      Under the bound gamma, independently derived admissions should use
      counters 0..7, 32 raw channels and 66 planned old-pilot labels. This
      expectation is a comparison target, not the source of the derivation.
  blind_schedule_gate:
    mode: read_only_no_solver
    reviewer_allowed_inputs:
      - experiments/EXP-ICPERF-554db4/specification.yaml
      - research/icperf_ordinary_binary_fixture_20261017/fixture.json
    blind_from:
      - experiments/EXP-ICPERF-018b0c/implementation
      - experiments/EXP-ICPERF-018b0c/inputs
      - experiments/EXP-ICPERF-018b0c/runs
      - research/icperf_binary_torsion_m8_chain_20261017/chain.json
    derivation: >-
      Implement field and curve arithmetic independently from the named
      fixture; derive T and gamma, at most 1024 candidates, the first eight
      admissions and 32 raw channels. Seal the derivation, source-read list
      and digest before comparing any predecessor manifest.
    controls:
      - A changed domain separator must change the first scalar and schedule.
      - The point T must be rejected by the coordinate map as the pole.
      - Setting gamma to 714891581849174975 must reject counter 0 and select counters 1..8 for the first eight admissions under the alternative predicate.
      - Independently recompute all 64 prior natural formula target constants and compare their hashes only after the blind schedule is sealed.
    stop: >-
      A field, point, gamma, schedule, channel or target-constant mismatch is
      an input-preparation defect. Stop before any new solver call, preserve
      both derivations and request an additive correction.
  sorted_encoding:
    transform: >-
      Add constraints t_0 <= t_1 <= ... <= t_7 on the eight encoded 11-bit
      coordinate values, using unsigned numeric comparison on each adjacent
      pair. Keep the exact base-membership set, raw target, seven S3 equations
      and point checker. Charge comparator variables/clauses, emission and
      checking. Do not add a target-dependent base rule.
    full_point_preservation: >-
      For any accepted signed point tuple, carry each entire point and its
      torsion lift with its coordinate through a stable sort. Recompute six
      intermediate full-point sums, their phi values and the seven S3
      equations. Group commutativity and associativity preserve the raw sum
      and cofactor projection. Do not claim preservation of spurious Boolean
      models that fail full-point certification.
    witness_controls:
      - Recheck original complete positive assignments against all CNF and XOR rows and exact point certificates.
      - Derive both sorted positive witnesses from the actual signed point tuples, recompute all intermediate values, and check every new CNF and XOR row.
      - Reverse each planted point tuple and recompute intermediates; its original unsorted XCNF must admit that complete witness, the sorted XCNF must reject its order, and sorting it again must recover a certified sorted witness.
      - Flip the first primary bit of each sorted positive model; require independent full-point rejection.
      - Include repeated-coordinate and opposite-sign constructed controls to check stable ties and lift handling.
    missing_binding: >-
      No sorted encoder, transformed XCNF/witness manifest, independent
      comparator checker or preservation-control receipt is committed yet.
      TASK-20261018-da71bd must produce and hash them before approval.
  solver_panel:
    admission: >-
      Require the sealed blind schedule and all original/sorted positive
      Boolean and full-point checks before scientific solver admission.
      Require one quiet host with one solver process, at least 10 GiB
      MemAvailable and declared raw-output disk reserve before each call.
    paired_order:
      - weighted_unsorted_first
      - weighted_sorted
      - weighted_unsorted_repeat
      - local_random_unsorted_first
      - local_random_sorted
      - local_random_unsorted_repeat
    fixed_options: ['--verb', '0', '--threads', '1', '--maxsol', '1', '--random', '20261018']
    seed: 20261018
    threads: 1
    per_call_wall_seconds: 1200
    sampled_rss_bytes_per_call: 8589934592
    maximum_primary_models_per_call: 64
    maximum_calls: 6
    cumulative_solver_call_admission_seconds: 7200
    interpretation: >-
      The two planted targets differ by base. Within-base sorted versus
      unsorted comparisons retain all capped attempts and the identical
      unsorted A/A repeat. Neither a cross-base ratio nor a natural-yield
      estimate is licensed. If either sorted
      positive fails to certify, no natural panel is inferred or launched.
  variable_ledger:
    independent:
      - {name: encoding, levels: [unsorted, sorted]}
    factors:
      - {name: base, treatment: crossed, value: [weighted, local_random], how: one separate planted target per frozen base}
      - {name: curve_and_gamma, treatment: fixed, value: certified GF(2^61) fixture and gamma 70364449406991, how: bound statement and fixture hash}
      - {name: solver, treatment: fixed, value: one hash-bound CryptoMiniSat binary and seed 20261018, how: freeze argv before execution}
      - {name: host_load, treatment: measured, value: MemAvailable and load average before every call, how: retain per-call receipt}
      - {name: call_order, treatment: measured, value: fixed U/S/U sequence per base, how: retain timestamps and A/A spread}
      - {name: formula_size, treatment: measured, value: exact CNF/XOR/comparator counts, how: independent parser}
    comparisons:
      - {id: weighted_sorted_vs_unsorted, arms: [weighted_unsorted_first, weighted_sorted], differs_in: [encoding], design: one_factor}
      - {id: local_sorted_vs_unsorted, arms: [local_random_unsorted_first, local_random_sorted], differs_in: [encoding], design: one_factor}
      - {id: weighted_unsorted_aa, arms: [weighted_unsorted_first, weighted_unsorted_repeat], differs_in: [call_order], design: aa}
      - {id: local_unsorted_aa, arms: [local_random_unsorted_first, local_random_unsorted_repeat], differs_in: [call_order], design: aa}
      - {id: weighted_sorted_gate, arms: [weighted_sorted], differs_in: [], design: absolute}
      - {id: local_sorted_gate, arms: [local_random_sorted], differs_in: [], design: absolute}
    aa_not_applicable: null
    crosses_map: true
  prediction_provenance:
    - prediction: Both sorted planted positives return independently certified models under the 1200-second and sampled 8-GiB caps.
      first_recorded_in: ledger/hypotheses/H-ICPERF-3982eb.yaml
      written_at: '2026-10-18'
      data_seen:
        - {path: experiments/EXP-ICPERF-018b0c/runs/RUN-ICPERF-712e85/raw-result.json, measured: true}
        - {path: experiments/EXP-ICPERF-018b0c/inputs/positive_manifest.json, measured: false}
      sample_status: partially_in_sample
      overlap: Same two planted targets and source formulas were previously inspected; the sorted formulas and 1200-second calls have no prior solver result.
      decisive_scope: Exploratory sorted-encoding feasibility on these two planted controls only; A/A spread bounds any solver-cost comparison and a fresh natural-target panel requires a new freeze.
  preregistered_prediction:
    quantity: Number of sorted planted calls with an independently checked complete Boolean model and full-point certificate under the fixed call cap.
    formula: Two certified sorted calls out of two distinct planted positives; original and A/A repeat calls report paired costs and censoring without an advantage threshold.
    source: H-ICPERF-3982eb and the prospective sorted-witness construction; the solver outcome is conjectural.
  transfer_obligations:
    - map: Stable sorting of eight actual signed summand points and re-chaining their full-point partial sums.
      kind: other
      source: Unsorted full-point witness for the same base, raw channel and target.
      destination: Sorted-coordinate full-point witness under the new encoding.
      preserves: [curve, field, raw group sum, cofactor-four projected target, projected coefficient multiset]
      changes: [ordered presentation, six intermediate point values, circuit witness, comparator gates]
      controls:
        - {kind: identity_map, comparison: weighted_unsorted_aa}
        - {kind: matched_random, comparison: local_sorted_vs_unsorted}
      assessment: experiments/EXP-ICPERF-554db4/transfer-assessment.json
  controls:
    - Same original formula and point witnesses as the predecessor, byte-bound without editing old records.
    - Equal-column local-random base as a representation control, never an independent natural target sample.
    - Independent sorted witness, CNF/XOR evaluation and full-point certificate for each base.
    - Blind exact-gamma target schedule with altered-domain, pole and alternate-gamma controls before opening producer manifests.
    - Input A/A re-emission checks the original unsorted bytes and known model.
    - Two identical unsorted calls per base, under the same seed and cap, measure host/solver timing spread as the A/A controls.
    - The unsorted arm has the identical new call cap and host admission as its sorted mate.
  metrics:
    primary:
      - Blind gamma, eight-target and 32-channel derivation agreement, plus all specified altered-object controls.
      - Each of six calls classified certified, wall_censored, memory_censored, model_cap_censored, solver_reported_unsat_unvalidated, invalid or infrastructure_failure.
      - Number of sorted positive calls with independently checked complete Boolean model and full-point certificate.
    secondary:
      - Emission, comparator, decompression, solver, model extraction, independent checking and archive packaging wall/CPU separately.
      - Per-call wall, process CPU, sampled peak RSS, host load, solver conflicts when reported, model count and rejected-model reasons.
      - CNF variables/clauses, native-XOR rows, compressed/raw bytes and comparator overhead for each base and encoding.
      - Full spent cost for censored/failed calls and zero natural calls by design.
  replication:
    seeds: [20261018]
    independent_instances: 2
    note: One planted target per base and one seed, with an identical unsorted repeat in each base; exploratory instrument test only, not powered speed comparison.
  scale_relevance:
    tier: medium
    justification: One certified GF(2^61) fixture with a 59-bit prime-order subgroup, two B=316 bases and m=8 only.
    correspondence: null
  budget:
    enforcement: advisory
    maximum_solver_calls: 6
    maximum_workers: 1
    wall_clock_seconds_per_call: 1200
    cumulative_call_admission_seconds: 7200
    maximum_memory_bytes_per_call: 8589934592
    maximum_primary_models_per_call: 64
    note: >-
      Six locked scientific calls are a protocol boundary. Wall/RSS guards
      protect the host and censor calls; they do not cap the unlimited ECC
      campaign. Additional preparation, checking and packaging time is
      measured and charged separately.
  stopping_rules:
    - Stop before solver work if the blind gamma/schedule gate or any original/sorted positive witness check fails.
    - Attempt the six fixed calls once each in the stated order, preserving all attempts even if an earlier call is censored.
    - A host-admission failure prevents that call; do not replace it with a cleaner run under the same frozen protocol.
    - No natural solver call is authorized by this contract.
  success_criterion: >-
    Both weighted_sorted_gate and local_sorted_gate report an independently
    checked model and full-point certificate inside their 1200-second and
    sampled-8-GiB limits, after the blinded gamma and all input controls pass.
    This is bounded planted solver feasibility only. Any exploratory timing
    difference must be read against both unsorted A/A spreads and cannot
    select a factor base.
  falsification_criterion: >-
    A point-level counterexample to the stable-sort preservation argument
    invalidates the representation. A complete independently proved solver
    contradiction on a verified planted formula invalidates the instrument.
    Censoring or unproved UNSAT does not falsify relation existence.
  invalidation_rules:
    - A changed original source digest, incorrect gamma or target constant, missing Boolean/point positive, or mismatch in the complete raw archive invalidates input or execution integrity.
    - A timeout, memory/model cap or unproved UNSAT is censored or unvalidated, not a verified absence of point relations.
    - A solver model violating a CNF/XOR row or exact point certificate is retained and reported as an implementation or extraction defect.
  decision_impact:
    on_positive: >-
      After content-first archive and independent review, if both sorted
      planted positives certify, design a separate prospective common-target
      natural panel with exact gamma and matched unsorted/sorted formulas.
      A two-positive diagnostic cannot select a factor base or establish E2E S.
    on_negative: >-
      A proved failure of the sorted-witness construction or an invalid
      transformed positive returns the encoding to implementation. A complete
      valid bounded solver failure limits only this instrument/cap and directs
      solver-engineering or a different representation; it does not refute
      natural relation existence.
    on_censored: >-
      Preserve every call and charged cost, retain instrument feasibility
      unresolved, and rank a new solver mechanism or cost-bounded falsifier.
  required_artifacts:
    design:
      - experiments/EXP-ICPERF-554db4/specification.yaml
      - experiments/EXP-ICPERF-554db4/transfer-assessment.json
      - ledger/hypotheses/H-ICPERF-3982eb.yaml
      - ledger/decisions/DEC-20261018-273b2d.yaml
      - docs/reports/2026-10-18-icperf-binary-m8-sorted-design.md
      - docs/reports/2026-10-18-icperf-binary-m8-sorted-design.py
      - docs/reports/2026-10-18-icperf-binary-m8-sorted-design.svg
      - docs/reports/2026-10-18-icperf-binary-m8-sorted-design.pdf
    before_approval:
      - Exact gamma-bound blind reviewer derivation and source-read attestation, sealed before predecessor manifests are opened.
      - Sorted encoder and full-point preservation controls with hash-bound positive formulas and models.
      - Independent input and result checker, complete fixed trial plan, raw artifact list, dispatcher queue, executor handoff and isolated archive tasks.
      - Read-only preapproval packet with approvable true for exact final bytes, followed by approval decision and ready selector.
    per_run: >-
      Supervisor launch/receipt/environment/command/stdout/stderr/check logs,
      manifest, raw result, independent check, every call input/output/model
      and certificate in a complete hash manifest plus deterministic bundle.
      Freeze exact paths and run IDs in the eventual approved trial plan.
    visual_record: An observation report, editable graph/diagram source, rendered figure and inspected PDF for all outcomes.
  runbook_route:
    status: not_written
    reason: No executable trial plan or linted runbook exists for the sorted encoder; executor-implementation remains the prospective route.
  readiness_blockers:
    - No independently sealed blind gamma-bound schedule from the new statement exists yet.
    - No sorted encoder, transformed positive formulas/models or independent equivalence controls exist yet.
    - No hash-bound trial plan, admitted supervisor launcher, complete raw archive coverage or preapproval packet exists yet.
    - No positive experiment_preapproval assessment or ordinary ready-selector result exists yet.
  claim_limits:
    - A positive planted solver result is an instrument observation, not natural relation yield or factor-base superiority.
    - This protocol does not measure degree of regularity, useful rank, linear algebra, target DLP work, complete cold E2E S or matched rho.
