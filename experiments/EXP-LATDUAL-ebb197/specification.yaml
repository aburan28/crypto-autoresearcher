experiment:
  id: EXP-LATDUAL-ebb197
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-70e41d; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-70e41d
  question_id: RQ-MLKEM-003
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Measure exact step counts and peak memory for enumeration and a Gauss-style sieve on identical
    lattices at dimensions 20 to 44, and report the crossover displacement under a one-parameter memory
    price with its confidence band
  objective: 'The run reduces one uncertainty: how far the enumeration/sieving crossover moves once
    memory is charged at a nonzero price, and whether the measurement can place it at all. Stated
    as parts: (i) do the two algorithms agree on the shortest norm on every basis, and does the null
    arm show a materially different exponent pair, which together license reading the signal arm;
    (ii) what are the four fitted exponents, time and memory for each algorithm, with intervals, over
    n = 20 to 44 on one lattice distribution; (iii) what is the crossover displacement Delta(mu, theta)
    = n*(mu) - n*(0) as a banded curve over the price sweep, and at which prices is the band too wide
    to place a crossover. The run is not asked where the true asymptotic crossover lies, is not asked
    to compare against G6K or FPLLL, and is not asked anything about deployed parameter sets. A run
    that returns a band too wide to place n*(mu) is a complete run: it measures how much precision
    the question needs, which KN-OPEN-017 anticipates as one of two honest failure modes.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for these two pure-Python
      implementations on this lattice distribution over n = 20 to 44, the measured time and memory
      exponents were as reported with the stated intervals, the null arm behaved as reported, and
      under the stated price family the crossover displacement is the reported banded curve. WHAT
      DOES NOT FOLLOW: nothing about G6K, FPLLL or any optimised implementation, whose constants and
      asymptotics differ; no revised crossover dimension asserted as fact, only a banded projection;
      no re-ranking of primal, dual or enumeration-based attacks at cryptographic dimensions; no claim
      that any published cost model is wrong; and nothing about ML-KEM, FIPS 203 or any deployed system.'
  inputs:
    procedure: 'STAGE 0 (cost: 0 compute, ~4h human). Freeze the lattice distribution, the determinant
      normalisation, the sieve saturation criterion, the instrumentation boundary for both algorithms,
      the price family and theta set, and the fit protocol. STAGE 1 (cost: low). Basis generation
      at n = 20 to 44 with recorded exact-integer bases. STAGE 2 (cost: medium). Exhaustive ground
      truth at n <= 26. STAGE 3 (cost: high). Enumeration runs with node-count and stack-depth instrumentation.
      STAGE 4 (cost: high, dominant). Sieve runs with reduction-attempt and peak-list instrumentation.
      STAGE 5 (cost: low). Norm-agreement verification across all bases; halt on disagreement. STAGE
      6 (cost: high). Null arm: both algorithms on unimodularly scrambled scaled-orthogonal bases
      of matched dimension and determinant. STAGE 7 (cost: low). Four fits with intervals; numerical
      propagation of the joint interval through the crossover equation to produce the band. STAGE
      8 (cost: low). Emit immutable run records through harness/runner.py.'
    instrument: Python 3.11 standard library only; numpy, fpylll and Sage are absent from this environment
      and none is used. Exact integer arithmetic for bases and Gram matrices; fractions.Fraction for
      Gram-Schmidt; a depth-first exact-SVP enumeration with an explicit node counter; a Gauss-style
      sieve holding its list in a plain Python list with an explicit reduction-attempt counter and
      a peak-size tracker; ordinary least squares with interval propagation implemented directly.
      Seeds and run records through harness/runner.py; wall clock recorded but used only as a secondary
      metric.
    parameters: n in {20, 22, 24, ..., 44}; ten bases per dimension from one fixed distribution with
      all bases in a dimension normalised to a common determinant; sieve saturation criterion fixed
      in STAGE 0; mu on a log grid of twelve points from 0 to 1; theta in {0.5, 1.0}; null arm at
      the same dimensions with ten bases each; exhaustive ground truth at n in {20, 22, 24, 26}.
  controls:
  - 'Null arm: unimodularly scrambled scaled-orthogonal bases of matched dimension and determinant,
    run through the identical code path in the same invocation.'
  - 'Norm-agreement control: enumeration and sieve must return the same shortest norm on every basis;
    disagreement halts the run.'
  - Exhaustive ground truth at n <= 26 by full enumeration over a proven radius.
  - 'Cost-unit control: both algorithms additionally instrumented by wall clock, reported only as
    a secondary metric to expose divergence between abstract counts and real time.'
  - 'Determinant control: all bases in a dimension normalised to the same determinant so norms are
    comparable.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The identical measurement runs against a null lattice of the same shape:
    bases of the same dimension and determinant obtained by applying a random unimodular transform
    to a scaled orthogonal lattice, so the true shortest vector is known exactly and the instance
    has no hard structure. Both algorithms run on it in the same invocation from the same seed stream.
    The null must show a materially different exponent pair, enumeration nearly linear in n and sieve
    list size collapsing, and must show n*(mu) either undefined or far from the signal arm''s. If
    the null arm produces the same exponent pair as the signal arm, the instrument is measuring implementation
    overhead rather than instance hardness and every signal-arm exponent is an artifact, recorded
    as a controlled null.'
  independent_variables:
  - lattice dimension n
  - algorithm (enumeration versus sieve)
  - arm (signal versus scrambled-orthogonal null)
  - memory price mu
  - wiring exponent theta
  metrics:
    primary:
    - exact enumeration node count per basis
    - exact sieve reduction-attempt count per basis
    - peak sieve list size in vectors
    - fitted time and memory slopes with intervals for both algorithms
    secondary:
    - per-vector bit-size in the sieve list
    - number of sieve rounds to saturation
    - peak enumeration stack depth
    - wall clock per run
    - memory high-water mark in bytes
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The crossover displacement Delta(mu, theta) = n*(mu, theta) - n*(0, theta), reported
      as a curve in mu for each theta with a 95 percent band propagated from the four fitted slope-and-intercept
      intervals, together with an explicit flag at every mu where the band exceeds 12 dimensions.
    formula: C(T, M; mu, theta) = T * (1 + mu * M^theta). With fits log2 T_A(n) = a_A * n + b_A and
      log2 M_A(n) = c_A * n + d_A for A in {enum, sieve}, n*(mu, theta) is the smallest n solving
      a_sieve*n + b_sieve + log2(1 + mu*2^{theta*(c_sieve*n + d_sieve)}) = a_enum*n + b_enum + log2(1
      + mu*2^{theta*(c_enum*n + d_enum)}). At mu = 0 this reduces to the step-count crossover. The
      band on n* is obtained by propagating the joint interval on (a, b, c, d) through this equation
      numerically over 2000 parametric bootstrap draws.
    source: Pre-registered in the parent proposal IDEA-20260816-70e41d before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Measured at n = 20 to 44 with exact SVP ground truth, in pure Python without numpy
      or fpylll, both absent here. The transfer assumption is stated and is the entry''s largest liability:
      placing n*(mu) at dimensions above 44 requires extrapolating four fitted slopes beyond their
      measured band, and the entry reports the resulting band rather than a point. Where the band
      exceeds 12 dimensions the entry declares n*(mu) unplaceable at that price. Nothing is transferred
      to ML-KEM dimensions or FIPS 203 parameter sets, and no attack ranking at cryptographic scale
      is asserted.'
    correspondence: null
  tail_checks:
  - Smallest dimensions, where enumeration should dominate decisively and the sieve list should be
    trivially small.
  - Largest dimensions, where the sieve list approaches the memory ceiling and any saturation artifact
    must be identified before it is fitted.
  - The mu = 0 corner, which must reproduce the ordinary step-count comparison exactly.
  - The theta = 1 corner, the maximally memory-hostile price, where any displacement should be largest.
  - Bases with anomalously short vectors, checked separately so a heavy tail in instance hardness
    is not fitted as a slope.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop increasing n when peak sieve list size exceeds 2 million vectors or a single basis exceeds
    2 wall-clock hours, and report the achieved band.
  - Halt and report an instrument defect on any norm disagreement between the two algorithms.
  - Stop the fit and declare n*(mu) unplaceable if the 95 percent band on c_sieve - c_enum contains
    zero.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Four slopes are fitted with 95 percent intervals from measured runs on identical
    bases, the null arm's slopes differ materially from the signal arm's, and Delta(mu, theta) is
    reported as a banded curve over the full price sweep, including where applicable the honest verdict
    that the band is too wide to place a crossover.
  falsification_criterion:
  - 'Null-arm slopes match signal-arm slopes: the instrument measures code overhead and every exponent
    is void.'
  - 'Norm disagreement on any basis: instrument defect, run void.'
  - 'The c_sieve - c_enum interval contains zero: the memory-exponent gap is unresolved and n*(mu)
    is declared unplaceable, which is the reported result.'
  - 'Sieve list size saturates rather than growing: the implementation is not a faithful Gauss sieve
    and the memory series is void.'
  - 'Delta(mu, theta) below 2 dimensions across the whole sweep: pricing is measured not to move the
    crossover in the tested regime.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-70e41d
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must fix theta's admissible set from an explicit wiring model rather than the
    draft's bracketing choice; KN-TECH-035 and KN-LIT-094 supply the discipline but the draft does
    not derive theta.
  - Whether peak list size in vectors or in bits is the correct memory unit for the price needs a
    stated derivation before approval.
  - The lattice distribution for the signal arm is named as fixed but not chosen, and the choice determines
    what the fitted exponents are about.
  - Whether the extrapolation band may be reported at all, or only the in-band fit, is a claim-tier
    decision under docs/claims-and-verification.md.
