# =============================================================================
# AMD-20261008-9c080d -- ADDITIVE protocol amendment of EXP-PFDR-0b3699,
# protocol version 1 -> 2. specification.yaml (v1) is NOT edited.
# Approved by DEC-20261008-ef482f under the standing user authorization of
# 2026-09-06.
#
# Purpose: let the run set continue at RA-04 to RA-06 under a new executor
# task, using the PINNED scripts unchanged (DEF-1 route B,
# DEC-20261008-8cb005), and rule the points the continuation needs:
#   A-1   execution scope
#   A-2   archives
#   A-3   the G-REPRO exclusion set (DISCLOSED: ruled after RA-02 output
#         existed)
#   A-4   DEF-1
#   A-5   launcher identity constants in manifests
#   A-6   the pin location the pinned analyze_a.py reads
#   A-7   the ten pre-data interpretations
#   A-8   PC-NULL-R unchanged
#   A-9   provenance logging
#   A-10  RA-07 not triggered
#
# It changes no threshold, prediction, statistic, cell, arm, seed, curve,
# control, gate text (other than A-3's reading of one clause), outcome
# condition, stopping or invalidation rule, P0 rule, machine limit, or any
# byte of any pinned file. TW-SCOPE binds.
# =============================================================================
protocol_amendment:
  id: AMD-20261008-9c080d
  amendment_id: AMD-20261008-9c080d
  experiment_id: EXP-PFDR-0b3699
  hypothesis_id: H-PFDR-2765d2
  question_id: RQ-PFDR-ae2fba
  kind: additive
  version_from: 1
  version_to: 2
  recorded_at: '2026-10-08'
  authored_by: coordinator
  approved_by: coordinator
  approval_decision: DEC-20261008-ef482f
  execution_handoff: TASK-20261008-9456e8
  output_archive: TASK-20261008-398fce
  archived_by: TASK-20261008-6f12b8
  id_provenance: >-
    Supplied by the top-level session. tools/allocate_id.py has no amendment
    type, so the token was drawn at random and confirmed free with --check.
    The Coordinator has no shell and minted no identifier.
  authority: >-
    Coordinator, under the standing user authorization of 2026-09-06
    (AGENTS.md "Standing user authorization for ideas and experiments").
    CLAUDE.md: "Changing a frozen scientific protocol uses an additive
    amendment; never rewrite historical records". coordinator.md: success
    criteria are not changed after observing outcomes without a recorded
    protocol amendment. This file is that record.
    Untouched by it:
    - specification.yaml (v1);
    - every file archived by TASK-20261008-5ea531 (with the single,
      append-only exception of A-6);
    - every pinned script.
  precedence: >-
    Protocol version 2 = specification.yaml (v1) + this file. This file
    governs exactly where it names a field; where it is silent, the
    specification governs. Its approval_rulings AR-1 to AR-7 continue to
    govern where they name a clause. RA-01, RA-02 and RA-03 were run under
    version 1. Their records are not rewritten, and this file does not
    re-score them, except that A-3 states the reading under which RA-02's
    G-REPRO verdict is read.

  reason: >-
    TASK-20261002-8a6b8a ran RA-01 to RA-03 and stopped before RA-04 on
    DEF-1: the pinned run_jobs.py finalize writes no run.code.command. Its
    package is archived as produced by TASK-20261008-5ea531 (commit
    051be4c86). DEC-20261008-8cb005 chose route B: keep the pinned scripts
    unchanged and repair manifests by supersession later. The specification
    authorises execution "by TASK-20261002-8a6b8a only. Nothing else.", so a
    continuation needs this amendment.
    A blind adjudication (TASK-20261008-e2830e, sealed by
    TASK-20261008-5e4188) rated the executor's G-REPRO reading (PDI-2)
    "admissible_reading_of_open_detail", the clause being undecided on its
    plain words. That bears on whether the run set may continue at all. A
    walk of the pinned code that RA-04 to RA-06 invoke under a new task found
    two further points the frozen text and the earlier cards did not foresee
    (A-5, A-6). That walk is the lesson of AMD-20261002-236691 on the
    EXP-PFDR-011cd0 line.

  changes:
    - id: A-1
      field: experiment.execution_authorized_scope (additive)
      text: >-
        RA-04, RA-05 and RA-06, in the fixed order of stopping_rules [0], by
        TASK-20261008-9456e8 only, starting from the state archived by
        TASK-20261008-5ea531 (RA-01 to RA-03 terminal; design.json pinned at
        sha256
        2c0996fec8553caffd867b326a16b2a62b81f7d69c2e3deab3db269800d0b78b).
        RA-01 to RA-03 are not re-run. RA-07 is not authorised (A-10). A
        further continuation, if that task stops, needs a Coordinator
        decision. No run starts before the TASK-20261008-6f12b8 ledger
        receipt has verified and every dispatch_precondition of
        TASK-20261008-9456e8 holds.
    - id: A-2
      field: experiment.output_archive (additive)
      text: >-
        RA-01 to RA-03 and the EC-A1, script, fixture and notes artifacts of
        TASK-20261002-8a6b8a are archived by TASK-20261008-5ea531, which
        supersedes TASK-20261002-33afa9 (DEC-20261008-8cb005). The outputs of
        TASK-20261008-9456e8 are archived by TASK-20261008-398fce. The
        specification's output_archive value and the RA-01 to RA-03 manifests
        that name TASK-20261002-33afa9 are not edited.
    - id: A-3
      field: gates G-REPRO, the phrase "timing keys excluded, as EXP-PFDR-011cd0 G1'" (reading; no text change)
      text: >-
        The excluded census-row keys are exactly seconds,
        harvest.harvest_seconds and harvest.worker_maxrss_bytes. These are
        the elapsed-time and per-process resource measurements of the run,
        and the set equals the committed T-DET exclusion set
        (tests/test_index_calculus_relcensus.py _strip_census). Every other
        census-row key is compared, ru_maxrss_bytes included. Every key of
        every harvest row and staircase row is compared, with no exclusion.
        The second comparison (--arms extended) uses the same exclusion set,
        compares against the archived job, covers all three row files, and
        is restricted to the pre-existing arms. Census rows are matched by
        (bits, curve, m, arm, mode). Harvest and staircase records are
        compared in file order within an instance.
        This is the reading TASK-20261002-8a6b8a recorded as PDI-2 before
        any run, and that experiments/EXP-PFDR-0b3699/reproduce_check.py
        implements.
    - id: A-3-disclosure
      text: >-
        A-3 is ruled AFTER RA-02 output exists, and with the Coordinator
        aware of its consequence. RA-02's g-repro-report.json records, for
        information, harvest.worker_maxrss_bytes equal on 0 of 1100 compared
        rows in each of the four pairs. Under a reading that compared that
        key, G-REPRO would not pass. Every other census-row key matched (0
        mismatches in each pair), and the new harvest-row and staircase files
        of the base pairs are byte-identical to the archived files.
        Safeguards:
        (1) the reading was recorded pre-data by the executor
            (implementation-notes.yaml pre_data_interpretations, recorded_at
            2026-10-02T20:03:05Z);
        (2) DEC-20261008-8cb005 fixed the routing of each possible
            adjudication verdict, and it was committed (TASK-20261008-13dfad,
            b10ebef18) before the adjudication was dispatched;
        (3) the adjudicator read no output of this experiment and wrote its
            own blind reading first (b0-blind-reading.yaml, sealed sha256
            1bd12c40dfa4d78a8825d82f5eb5339e5f3b1a3875eb04a4a8ab15333539a8a3).
        The blind reading rated exclusion of harvest.worker_maxrss_bytes
        "admissible but not compelled". It found the engine code gives no
        guarantee that this key is equal across runs, because it is the
        process's resident-memory high-water mark. The independent review
        round re-examines A-3 as an owned joint (DEC-20261008-ef482f NA-6).
        A-3 is not evidence about H-PFDR-2765d2.
    - id: A-4
      field: required_artifacts.per_run manifest "exact command" (provenance; DEF-1)
      text: >-
        Every run-root manifest written by the pinned run_jobs.py finalize
        lacks run.code.command. It records the commands as run.code.commands
        and in the run root's command.txt. This is known defect DEF-1, a
        provenance-schema defect that affects no measurement. It does not
        invalidate a run under I-A6, because the commands are recorded. It is
        repaired after the run set ends, by superseding manifest records
        routed through tools/run_supersession_registry.yaml. That shared-file
        write is held for the user (DEC-20261008-8cb005 HU-4). Until then,
        tools/validate_ledger.py reports
        "<run root>/manifest.yaml: run.code.command missing (not
        reproducible)" for each such run root, and that line class is the
        only validator error a run root of this experiment may carry.
    - id: A-5
      field: manifest identity fields written by the pinned run_jobs.py
      text: >-
        The pinned run_jobs.py writes into every manifest its own constants:
        - run.task_id TASK-20261002-8a6b8a;
        - run.protocol.handoff TASK-20261002-8a6b8a;
        - run.protocol.output_archive TASK-20261002-33afa9;
        - run.protocol.amendments [];
        - the INFERENCE block.
        For RA-04 to RA-06 these values identify the launcher's authoring
        task and the v1 protocol block compiled into it. They do not identify
        the executing task, and they are recorded as written. The executing
        task (TASK-20261008-9456e8), the protocol version (2, this file) and
        the output archive (TASK-20261008-398fce) are recorded per run in
        experiments/EXP-PFDR-0b3699/execution-report-9456e8.yaml and in the
        continuation section of implementation-notes.yaml (A-6). The
        superseding manifests of A-4 also carry them. No pinned file is
        changed to alter these constants. An archive check or validity check
        that expects the executing task id in run.task_id reads this clause
        instead.
    - id: A-6
      field: required_artifacts.per_experiment implementation-notes.yaml (pin location) and the pins.calibration_json record
      text: >-
        The pinned analyze_a.py unmask refuses to run unless the literal
        string calibration_json and the pinned sha256 occur in the file
        experiments/EXP-PFDR-0b3699/implementation-notes.yaml (analyze_a.py
        lines 1408-1411). That file is declared append-only, and
        TASK-20261008-5ea531 archives it at sha256
        3efcee6cb21f4b81ebf0bb4b48eef7a6f0dc9a03e4dca1788d4ac79ca5ff94b1.
        TASK-20261008-9456e8 may therefore APPEND to it, under all of these
        conditions:
        - it appends exactly one new top-level section,
          implementation_notes.continuation_9456e8, at two-space indentation;
        - the bytes archived by 5ea531 (git show
          051be4c86:experiments/EXP-PFDR-0b3699/implementation-notes.yaml)
          remain an exact byte prefix of the file after every append;
        - the whole file parses with yaml.safe_load after every append;
        - the key continuation_9456e8 occurs exactly once.
        That section holds the continuation's authority check, its
        re-verification table, and pins_calibration_json (path, sha256,
        pinned_at), written before RA-06 starts. It is the pins.calibration_json
        record of the run set. No other existing file is appended to. The
        continuation's report goes to a new file,
        experiments/EXP-PFDR-0b3699/execution-report-9456e8.yaml. The
        snapshot archive TASK-20261008-398fce verifies the prefix rule in
        place of the 5ea531 path_sha256 for this one path.
    - id: A-7
      field: the ten pre-data interpretations of TASK-20261002-8a6b8a (implementation-notes.yaml pre_data_interpretations PDI-1 to PDI-10)
      text: >-
        PDI-1 to PDI-10, as recorded, are the binding readings of the clauses
        they name, for RA-04 to RA-06 and for the reading of RA-01 to RA-03.
        Basis:
        - PDI-1, PDI-4, PDI-5 and PDI-8 follow from the text;
        - PDI-3, PDI-6, PDI-7 and PDI-10 admissibly resolve an open detail;
        - PDI-2 is ruled by A-3;
        - PDI-9 is admissible: the referenced EXP-PFDR-011cd0 A-TAIL uses the
          uncalibrated mu_model, and PDI-9 uses the calibrated null mean
          rho1_hat_b x mu_model(j). The list is secondary and never gating,
          and the review reports it under both means.
        All of these come from the e2830e adjudication, the PDI-9 point as
        ruled in DEC-20261008-ef482f. Whether recording PDI-2, rather than
        stopping, met 8a6b8a's NO JUDGMENT ON SCOPE constraint is a
        procedural finding (DEC-20261008-ef482f PF-1). It is not an
        invalidation.
    - id: A-8
      field: analysis.PC-NULL-R_rule
      text: >-
        Unchanged (option OPT-1 of the pre-data assessment). Criterion (ii)
        was assessed pre-data on synthetic draws as informative:
        - false-failure rate about 0.01 at every ladder n;
        - power 0.48 to 0.88 against one null arm at kappa 1.10;
        - power 0.51 to 0.61 against one over-dispersed null arm.
        Criterion (i) was found to fail at most 0.0003 under the null and
        under each of the single-arm and common-mode departures assessed.
        Both readings are recorded for the review round. Neither changes the
        rule.
    - id: A-9
      field: provenance of RA-04 to RA-06 commands
      text: >-
        The pinned run_jobs.py does not append finalize invocations to a run
        root's command.txt. TASK-20261008-9456e8 therefore records, in
        execution-report-9456e8.yaml, the verbatim argv (as executed) of
        every run_jobs.py and analyze_a.py invocation of RA-04 to RA-06,
        finalize included, with UTC start and end times. The superseding
        manifests of A-4 derive run.code.command from command.txt together
        with this list.
    - id: A-10
      field: runs RA-07 (repro-attribution)
      text: >-
        Not triggered: G-REPRO passed under A-3. An attribution of
        harvest.worker_maxrss_bytes on the 38be58dad engine bytes may be
        commissioned by the review round as a review computation, outside
        this run set.

  what_this_does_not_change:
    - every threshold, prediction, statistic, cell, arm, seed, curve, rung, design quantity and P0 rule of version 1
    - every gate text except the reading A-3 states, every control, the outcome table, success and falsification criteria, stopping and invalidation rules
    - the approval_rulings AR-1 to AR-7 and the blinding rules (stopping_rules [5], I-A7)
    - machine protection limits and watchdogs
    - every byte of the pinned files (pins.scripts), of design.json, and of every file archived by TASK-20261008-5ea531 except the append A-6 permits
