  pre_data_interpretations:
    recorded_at: '2026-10-02T20:03:05Z'
    note: Recorded before any run of this experiment and before any output of it exists. Each is a reading of a frozen clause where the clause leaves a mechanical detail open; none changes a threshold, seed, curve range, arm, statistic, control or outcome rule. Listed for Coordinator and reviewer scrutiny.
    PDI-1_mu_model: >-
      mu_model(j) for TT at m = 4 = T (T - 1) / (3 N_j) with T = s_sub^2, the number of
      stored arity-2 tails (one per +- pair of signed 2-term sums over indices with
      replacement, identities excluded): L1 gives E[R] = |RR| / N with |RR| = (signed
      pairs) / (generic multiplicity 3, L2) and signed pairs = 2 C(T, 2). Cross-check (not a
      rule source): summed over the 4000 EXP-PFDR-011cd0 band curves (design.json
      attempt-3, sizes["4"].s_sub, N) it equals that design.json's
      cells["small_x|TT4|band"].E_C_R_uniform = 1014.0187532883527 exactly (to all printed
      digits); the alternatives 8 C(s,4) / N (981.55) and T = s (s - 1) (1003.10) do not.
    PDI-2_grepro_excluded_keys: >-
      G-REPRO "timing keys excluded, as EXP-PFDR-011cd0 G1'": the census-row keys excluded are
      seconds, harvest.harvest_seconds and harvest.worker_maxrss_bytes -- the timing and
      per-process resource-measurement keys, exactly the set the committed determinism test
      (tests/test_index_calculus_relcensus.py _strip_census, T-DET) excludes. reproduce_check.py
      reports, for information, whether each excluded key also matched. Every other key of
      every census row, and every key of every harvest and staircase row, is compared exactly.
    PDI-3_tb_pairs: >-
      CC-1 recount for class TB: the pairs of the TB class are (base, tail) pairs, i.e. the star
      pairs (1, j) only; two tails of one x-group form a TT pair (CC-4: a relation is counted in
      each class whose pairs carry it), never a TB pair. TT uses every pair (1, j) and (i, j).
      TB is never decision-bearing in this experiment.
    PDI-4_permutation_null: >-
      RC-3 permutation: the pooled z depends on a curve's permutation only through which of the
      four null arms sits in position 0, so a uniform permutation is drawn as a uniform choice of
      the position-0 arm per curve (identical distribution of z).
    PDI-5_nb_sums: >-
      Simulation of a structured-arm TOTAL over a rung uses the exact identity that independent
      NB(r_j, p) with common p = 1/D sum to NB(sum r_j, p), Poisson sums to Poisson and
      Binomial(n_j, kappa) thinning sums to Binomial(sum n_j, kappa). Random arms (whose
      per-curve variances enter V) are drawn per curve. D = 1 is drawn as Poisson.
    PDI-6_u_coverage_and_prediction: >-
      Each synthetic design's own bound (coverage, P0 predicted U_A at kappa = 1) is computed by
      the analysis.upper_bound_U_A rule with >= 20000 replicates in each of 5 seed families: the
      random-arm replicate bank of each family is reused across synthetic designs (common random
      numbers); the structured total is drawn afresh for every design at its own kappa_hat
      (Poisson-planted above 1, as drawn at 1, binomially thinned below 1). P0's predicted U_A at
      kappa = 1 is reported as the median and 5%/95% quantiles of the bounds of >= 4000 synthetic
      null designs.
    PDI-7_compound_planting: >-
      Compound-planted power and X_rel: the structured arm's per-curve count is NB with mean
      kappa m_j and index of dispersion 1.307 x D (red team J4 d upper CI), so its rung total is
      NB(sum kappa m_j / (1.307 D - 1), 1 / (1.307 D)).
    PDI-8_candidate_curves: >-
      design_a.py builds the candidate curves c = 2010 .. 8809 at each rung (6800 = 2 x the
      declared 3400, the largest n_b the P0 RULE can select) so that any raise is covered by the
      same pinned run; analyze_a.py p0 takes the first final n_b curves of each rung. The design
      curves at the declared n are the prefix c = 2010 .. 5409.
    PDI-9_a_tail_mean: >-
      Tail check per-curve Poisson tail P(Poisson(mbar_j) >= n_A,j) < 1e-4: mbar_j is the
      calibrated null mean m_j = rho1_hat_b x mu_model(j) of RA-05 (secondary, never gating).
    PDI-10_blinding_reads: >-
      RA-05 never JSON-parses a census or harvest line of small_x, small_x_offset, subgroup or
      planted_sub: each line's arm is read by a fixed-pattern string scan first and only null-arm
      lines are parsed. CC-6 exclusions of structured instances come from merge-report.json's
      non_valid_keys (keys only). arm-read-log.json records per file the parsed line counts per
      null arm and only a boolean for skipped structured lines.
