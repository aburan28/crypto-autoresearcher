experiment:
  id: EXP-TORS-ffb5d3
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-631e80
  question_id: RQ-TORS-8c7b79
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'POINT-LEVEL RANDOM SELF-REDUCTION INSIDE AN ISOGENY CLASS BY SMALL-ELL ELKIES WALKS: measure
    the mixing constant c in "L = c*log(p) steps to uniformity" and the per-step transport cost, so
    that any weak-curve finding in L1 CASCADES to the whole class with a MEASURED polylog overhead
    instead of an asserted one -- and, symmetrically, so that a within-class variance finding can
    be priced against the T5 reachability dichotomy before it is called an attack'
  status: draft
  objective: "(A) THE REDUCTION, STATED WITH ITS QUANTIFIERS. Let E be an ordinary curve over F_p\
    \ with prime-order subgroup G = <P> of order N, Q = [k]P. Let ell_1, ..., ell_L be Elkies primes\
    \ (each <= 13), and let Phi = phi_L o ... o phi_1 be the composition of the corresponding F_p-rational\
    \ Vélu isogenies. By the kernel-or-injective dichotomy (IDEA-20260807-053a55), each phi_i is injective\
    \ on the image of G because gcd(ell_i, N) = 1, so Phi is injective on G and\n  Phi(Q) = [k] Phi(P),\
    \   with the SAME k.\nTherefore (E_L, Phi(P), Phi(Q)) is an ECDLP instance on a DIFFERENT curve\
    \ of the SAME class with the SAME secret, and any solution pulls back for free. If the walk mixes\
    \ -- i.e. if E_L is close to uniform in the class after L steps -- then a WORST-CASE instance\
    \ on E has been converted into an AVERAGE-CASE instance on a random curve of the class, at a cost\
    \ of L transports. CONSEQUENCE (the cascade, which is why this is worth doing): if ANY property\
    \ of a curve makes the ECDLP measurably cheaper there, and that property holds on a non-negligible\
    \ fraction of the class, then the reduction makes EVERY instance in the class cheaper by the same\
    \ factor up to the transport overhead. That is DECOMPOSITION.md T2 made EFFECTIVE and PRICED rather\
    \ than merely asserted.\n(B) WHAT IS ALREADY KNOWN, STATED FIRST SO NOTHING IS CLAIMED THAT ISN'T\
    \ NEW. This reduction is not new. Jao, Miller and Venkatesan (KN-LIT-237, recorded in this corpus\
    \ at `confidence: reported` from its abstract) construct expander graphs from Cayley graphs of\
    \ narrow ray class groups under GRH and state that \"the graph of small prime degree isogenies\
    \ between ordinary elliptic curves achieves non-negligible eigenvalue separation\", explaining\
    \ \"the relationship between the expansion properties of these graphs and the security of the\
    \ elliptic curve discrete logarithm problem.\" DECOMPOSITION.md T5 records the same thing as the\
    \ campaign's central open item: the crater of the ell-volcano is a Cayley graph of Cl(O) and is\
    \ a rapid mixer under GRH, so a uniformly random curve in the class is reachable in O(log p) steps.\
    \ THIS RECORD CLAIMS NO THEOREM. It claims a MEASUREMENT: the constant hidden in O(log p), the\
    \ per-step cost in group and field operations, the fraction of curves from which the walk is even\
    \ startable (curves with no Elkies prime in {3,...,13} have no cheap step available), and the\
    \ empirical mixing profile at toy scale where the class can be enumerated exhaustively and the\
    \ true stationary distribution is therefore KNOWN rather than assumed.\n(C) WHY A MEASURED CONSTANT\
    \ IS NOT A COSMETIC IMPROVEMENT ON AN ASYMPTOTIC. Three concrete decisions in this campaign depend\
    \ on the constant and cannot be made without it.\n  1. L1's DECISION RULE. If L1 finds within-class\
    \ variance in a cost functional,\n    the immediate question is whether a better curve is REACHABLE.\
    \ T5's\n    dichotomy says goodness is usable only if it is common enough to hit by\n    random\
    \ walking or locally detectable. \"Common enough\" is a statement about\n    the mixing constant\
    \ and the goodness density jointly; without c the\n    dichotomy cannot be evaluated on any concrete\
    \ finding.\n  2. THE CASCADE'S PRICE. A speedup factor s on a fraction f of the class\n    cascades\
    \ to a speedup of roughly s on ALL of it only if the expected number\n    of walk restarts, about\
    \ 1/f, times the per-restart cost L*(cost per step),\n    is small against the attack cost itself.\
    \ That is an explicit\n    per-attempt-cost x inverse-success-probability bookkeeping, and every\
    \ term\n    in it except s and f is what this record measures.\n  3. THE HONEST NEGATIVE. If the\
    \ measurement shows the transport overhead is\n    LARGE relative to toy-scale attack costs, then\
    \ even a real within-class\n    variance would not be exploitable at this scale, and L1's eventual\
    \ negative\n    becomes stronger -- it would rest on a measured obstruction rather than on\n \
    \   an untested assumption that transport is cheap.\n\n(D) THE POINT-DEPENDENT DATA AND THE HARD\
    \ CONSTRAINT. The walk's output is (E_L, Phi(P), Phi(Q)) -- point-dependent, publicly computable,\
    \ no discrete logarithm anywhere (each step is: build psi_ell, extract a rational kernel, run\
    \ Vélu, evaluate at two points). DOES IT LEAK ANYTHING ABOUT k? NO, and the reason is IDEA-20260807-053a55's\
    \ simulator: Phi|_G is an injective homomorphism with an efficiently computable inverse, so the\
    \ walk's entire output is self-generatable and adds no query power. THE WALK IS NOT AN ATTACK\
    \ AND THIS RECORD DOES NOT PROPOSE IT AS ONE. It is a REDUCTION -- a way to move an instance to\
    \ where a hypothetical advantage might live -- and its value is exactly zero until some other\
    \ lane exhibits such an advantage. Filing it now, with its cost measured, is what makes a later\
    \ L1 finding immediately priceable instead of triggering a fresh design cycle.\n(E) THE TWO OUTCOMES.\n\
    \  OUTCOME 1 -- the walk mixes at toy scale with a measured small constant, and\n    the per-step\
    \ cost is polylog. Then the cascade is real and priced, T2 is\n    effective rather than nominal,\
    \ and every subsequent within-class finding in\n    this campaign inherits a concrete overhead\
    \ figure.\n  OUTCOME 2 -- the walk mixes slowly, or a material fraction of curves have no\n  \
    \  cheap Elkies step, or the transport cost dominates. Then the cascade is\n    EXPENSIVE at toy\
    \ scale, which is a named obstruction against the whole\n    \"walk to a better curve\" family\
    \ and is exactly the kind of measured\n    negative docs/inventor-protocol.md section 4 asks for\
    \ -- with forward\n    guidance naming what remains (larger ell at higher per-step cost; vertical\n\
    \    rather than horizontal steps; the locally-detectable-goodness branch of T5)."
  resource_label: R5
  admissibility: admissible
  admissibility_argument: 'ADMISSIBLE AS A RESOURCE USE, WITH NO ATTACK CLAIMED. Each step consumes
    R5 -- the Elkies condition and the rational-kernel extraction are computations on E[ell] as a
    Galois module, which the generic group oracle does not supply -- and R4, the isogeny graph structure.
    The walk therefore genuinely escapes the generic model at the curve level. At the POINT level
    it does not: Phi|_G is a scalar under any identification (H-ENDO-001) and the transported instance
    is simulable (IDEA-20260807-053a55). The record''s position is that this is admissible AND currently
    worthless as an attack, and that the honest deliverable is the price list rather than the resource
    label. A reader who takes "admissible" here as a hint of promise has misread the record.'
  reachability_gate: 'REQUIRED, AND THIS RECORD IS ESSENTIALLY A MEASUREMENT OF IT. IS A GOOD OBJECT
    REACHABLE, AND AT WHAT COST? (i) A UNIFORMLY RANDOM curve of the class: reachable in L_mix steps,
    and L_mix is exactly what this record measures. Under T5 and KN-LIT-237 this is expected to be
    O(log p) under GRH; at toy scale it is measured directly and unconditionally. (ii) A SPECIFIED
    curve: NOT reachable cheaply. That is the vectorization problem underlying CSIDH, costing about
    sqrt(h(O)) ~ p^{1/4} classically at best (T5). This record does not attempt it and no part of
    the design depends on it. (iii) THEREFORE the reduction is usable only under T5''s first branch
    -- goodness common enough to hit by random walking -- with expected restarts 1/f for a goodness
    density f. It is NOT usable for goodness identified only by a global address. The price sheet
    in STEP 6 is stated as a function of f precisely so that this constraint is visible in the arithmetic
    rather than in prose. (iv) DEAD STARTS: curves with no Elkies prime in the declared set cannot
    step at all. Their measured fraction is a hard bound on the reduction''s coverage and is a required
    metric.'
  inputs:
    procedure: 'STAGE 0 (dependency gate): IDEA-20260807-053a55''s certificate at 100 percent. STAGE
      1 (hours to a day, the budget sink): enumerate one toy class exhaustively at 16 bits, then 18
      and 20 if budget allows. Build the Elkies adjacency matrix and RUN THE CONNECTIVITY CHECK FIRST
      -- it costs nothing and it decides whether the rest of the experiment is meaningful. STAGE 2
      (HARD GATE, minutes): the one-step TV reproduction against the adjacency matrix. STAGE 3 (hours):
      R >= 10^4 walks per starting curve up to L_max = 50; TV curve; tau and L_mix(eps) for eps in
      {0.1, 0.05, 0.01}. STAGE 4 (minutes): the random-jump null and the lazy-walk null. STAGE 5 (hours):
      per-step cost measurement and the dead-start distribution. STAGE 6 (zero compute): the cascade
      price sheet as a function of (f, s). BUDGET: ell <= 13 throughout (deg psi_13 = 84); field sizes
      16-20 bits for the exhaustive enumeration. This is the most expensive proposal in the L7 set
      and its cost is dominated by STAGE 1, not by the walks.'
    mechanism: 'STEP 1 (dependency) -- IDEA-20260807-053a55''s transport primitive with its four-part
      certificate must pass at 100 percent. Nothing here runs otherwise.

      STEP 2 (class enumeration) -- enumerate a toy isogeny class exhaustively at 16-20 field bits
      using the fingerprint sieve of IDEA-20260807-c98c3d plus exact point counting for confirmation.
      THE EXHAUSTIVE ENUMERATION IS THE POINT: it gives the exact stationary distribution (uniform
      on the class for a symmetric walk on the crater) so mixing can be measured against ground truth
      rather than estimated. This is the toy-scale shortcut that makes the measurement possible at
      all, and it is unavailable at cryptographic size.

      STEP 3 (the walk) -- from each starting curve, run R independent walks of length up to L_max,
      at each step choosing uniformly among the available Elkies primes in {3,5,7,11,13} and, for
      each, uniformly among the rational kernels found. Record the j-invariant trajectory and the
      transported point pair with its certificate at every step.

      STEP 4 (the mixing measurement) -- at each step i, compute the total-variation distance between
      the empirical distribution of j(E_i) over the R walks and the uniform distribution on the enumerated
      class. Fit the decay to TV(i) ~ A * exp(-i / tau) and report tau, then convert to the operational
      quantity: L_mix(eps) = the smallest i with TV(i) <= eps for declared eps in {0.1, 0.05, 0.01},
      and the constant c = L_mix(0.05) / log(p) measured across at least three field sizes so that
      c is a fitted constant rather than a single-point ratio.

      STEP 5 (the cost measurement) -- field operations and wall clock per step, by ell; total cost
      of a mixed walk; the fraction of enumerated curves with zero available Elkies primes in the
      declared set (dead starts); and the fraction with exactly one (walks that can only shuttle back
      and forth, which mix poorly and must be reported separately because averaging them with well-connected
      curves would hide the failure mode).

      STEP 6 (the cascade price sheet) -- combine into the bookkeeping of claim (C.2): for a hypothetical
      speedup s on a fraction f of the class, the expected total cost is (1/f) * L_mix * (cost per
      step) + (attack cost / s). Publish the sheet as a function of (f, s) so any future L1 finding
      is immediately priceable. NO VALUE OF s OR f IS ASSUMED OR PREDICTED -- they are the finding''s
      inputs, and this record supplies only the other terms.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - connectivity check on the enumerated class under the declared primes (blocking, run FIRST)
  - one-step TV against the adjacency matrix (blocking)
  - random-jump null, mixes in one step, upper reference (blocking)
  - lazy-walk null, must mix about twice as slowly (blocking)
  - transport certificate at every step (blocking)
  - volcano-level check via IDEA-20260807-1d9c5f, to confirm the walk is not silently confined to
    one level of a multi-level class
  - anomalous / smooth-order exclusion per KN-TECH-034
  - 'NULL OBJECT (from the proposal): MANDATORY AND SUPPLIED. MATCHED NULL OBJECT: a RANDOM-JUMP WALK
    on the same enumerated class -- at each step, jump to a uniformly random curve of the class (possible
    only because the class is enumerated, which is again the toy-scale shortcut). The null has the
    same state space, the same step count and the same stationary distribution, and differs from the
    real walk ONLY in the step structure. It mixes in ONE step by construction, so it is the upper
    reference: the real walk''s TV curve must lie above the null''s and converge to it. DECAY PARAMETER:
    the step index i. The TV distance of the REAL walk must DECAY with i; a TV distance that plateaus
    above eps is the signature of a disconnected or poorly connected graph -- most likely because
    the declared Elkies set does not generate the class -- and that is a real and reportable obstruction,
    not a measurement failure. SECOND NULL, and this one can fail informatively: a LAZY WALK that
    stays put with probability 1/2. It must mix roughly twice as slowly. If it does not, the TV estimator
    is not responding to the walk at all. THIRD CONTROL (connectivity, blocking): verify from the
    enumerated class and the extracted kernels that the Elkies-isogeny graph on the class is CONNECTED
    under the declared prime set. If it is not, uniformity is unreachable by construction and the
    mixing measurement is void -- it would be measuring convergence to the uniform distribution on
    a component, not on the class. This check costs nothing once the class is enumerated and it is
    the single most likely way the experiment is silently wrong.'
  independent_variables: []
  metrics:
    primary:
    - TV distance per step index, with R and its sampling error
    - tau, L_mix(eps) for three eps, and c with fit residuals and point count
    - dead-start and single-kernel fractions
    - field operations and wall clock per step by ell
    secondary:
    - certificate pass rate
    - connectivity verdict and the number of connected components
    - class size and enumeration completeness
  heuristic_under_test: null
  preregistered_prediction:
    quantity: One-step total-variation distance, empirical over R walks versus computed from the class
      adjacency matrix
    formula: Agreement within sampling error at R >= 10^4. A mismatch invalidates the estimator. BASIS
      - both quantities are computed from the same enumerated class; this is an internal consistency
      check, not a finding.
    source: pre-registered in IDEA-20260807-631e80 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - VOLCANO CONFINEMENT, the most dangerous confounder here. If the class has ell-volcano depth for
    some declared ell, a horizontal-only walk stays on one level and will appear to mix to uniform
    ON THAT LEVEL while the "class" it is compared against is larger. The TV distance would then plateau
    at a value determined by the level's share of the class and would be misread as slow mixing. The
    volcano-level check is mandatory and its output must be used to define the correct comparison
    distribution.
  - Class size versus R. With R = 10^4 walks and a class of size h, the TV estimator's own bias is
    order sqrt(h/R); for large classes at 20 bits this can dominate the signal and must be reported
    alongside every TV value.
  - 'Non-uniform step availability. Curves with more Elkies primes are visited more often under a
    "choose uniformly among available" rule, so the stationary distribution of the declared walk may
    NOT be uniform on the class. This is a real design flaw risk: the walk must either be made symmetric
    (Metropolis correction) or its true stationary distribution computed from the adjacency matrix
    and used as the comparison. The record flags this explicitly because comparing against the wrong
    stationary distribution would produce a plateau that looks exactly like slow mixing.'
  - Toy-scale fit weakness. Three field sizes over 16-20 bits cannot separate c*log(p) from c'*p^delta
    for small delta. Any statement about c must carry that limitation in the same sentence.
  - Pure-Python constants. Per-step wall clock does not transfer to a compiled implementation; field-operation
    counts do.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 10800
    total_cpu_hours: 12.0
    maximum_memory_gb: 8
    maximum_runs: 60
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Agreement within sampling error at R >= 10^4. A mismatch invalidates the estimator.
    BASIS - both quantities are computed from the same enumerated class; this is an internal consistency
    check, not a finding.
  falsification_criterion:
  - The Elkies graph on the enumerated class is disconnected under primes <= 13. Uniformity is unreachable
    by construction; the mixing measurement is VOID (not negative) and the honest report is that the
    declared prime set does not generate the class at this size -- with the immediate forward guidance
    that larger ell must be included.
  - The one-step empirical TV disagrees with the adjacency-matrix computation. The estimator or the
    sampler is wrong; nothing else is interpretable.
  - 'The TV curve plateaus above 0.05 at L_max on a CONNECTED class. OUTCOME 2: the walk mixes too
    slowly for the cascade to be cheap at this scale. A genuine measured obstruction.'
  - The lazy-walk null does not mix more slowly than the real walk. The TV estimator is not responding
    to the walk structure.
  - A transport certificate fails mid-walk. INFRASTRUCTURE outcome under AGENTS.md rule 5; the walk
    is discarded, not recorded as a data point.
  - Exhaustive class enumeration at 16 bits exceeds the wall-clock budget. Also an infrastructure
    outcome; the proposal reduces scope to a sampled enumeration and reports the TV measurement as
    an estimate against an estimated stationary distribution, with the weakening stated prominently.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-631e80
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
    than absent so a reader cannot mistake it for an overlooked one.'
