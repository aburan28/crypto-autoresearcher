experiment:
  id: EXP-SMON-32339c
  hypothesis_id: H-SMON-db677d
  version: 1
  title: Extend the Semaev summation-cover battery to m = 6 and m = 7, where the fibre has degree
    16 and 32 and a wrong theorem has far more room to show
  status: completed_without_coordinator_approval
  status_note: NOT `approved`. No Coordinator subagent approved this. It reuses EXP-SMON-e5cbe6's
    library UNCHANGED, by import, so it tests the same implementation at a new arity rather
    than a second implementation at the same one.
  objective: EXP-SMON-e5cbe6 verified Theorems A/B/C of the manuscript at m = 3, 4, 5. The theorems
    are stated for every m >= 3, so each further arity is a free falsification opportunity.
    At m = 6 the predicted non-split factorization type is 2^8 on a degree-16 fibre; at m =
    7 it is 2^16 on degree 32. The monodromy group is (Z/2)^4 and (Z/2)^5, of order 16 and 32,
    and the prediction that EVERY class yields exactly one factorization type becomes correspondingly
    harder to satisfy by accident.
  inputs:
    parameters:
      field_bits:
      - 10
      - 11
      - 12
      primes:
      - 1009
      - 2003
      - 4001
      arities_m:
      - 6
      - 7
      curves: 5
      samples_per_curve: 60
      seed: 20260807
  controls:
  - 'Library reuse by import, not by copy: a divergence between this run and RUN-SMON-e5cbe6-001
    could then only come from the arity, not from an edit.'
  - 'Both loci swept: uniform specializations and the factor-base locus, so Theorem C is tested
    at the new arities too, not only Theorem B.'
  - The j=0 and j=1728 curves from the original battery are retained.
  independent_variables:
  - arity m
  - curve
  - locus (uniform vs factor-base)
  metrics:
    primary:
    - fraction of good specializations matching the predicted factorization type
    - maximum irreducible factor degree observed
    - count of mixed factorization types
    - fraction of good factor-base specializations splitting completely
    secondary:
    - number of distinct Frobenius classes realized out of 2^{m-2}
    - fraction of specializations that are degenerate at each arity
  preregistered_prediction:
    quantity: the multiset of irreducible-factor degrees at a good specialization
    formula: 1^{2^{m-2}} when all c(a_i) agree, 2^{2^{m-3}} otherwise; nothing else. At m=6
      that is 1^16 or 2^8; at m=7, 1^32 or 2^16.
    source: Theorem 4.2 of papers/semaev-conservation-specialization/paper.tex
  scale_relevance:
    tier: toy
    justification: Primes to 4001. A counterexample at any prime would refute the general theorem
      outright, so the falsification value does not depend on scale; agreement does not establish
      the theorem, which rests on the derivation.
    correspondence: null
  tail_checks:
  - All 2^{m-2} Frobenius classes must be realized -- 16 at m=6 and 32 at m=7 -- so a group
    SMALLER than predicted would show as missing classes.
  - Degeneracy fraction is reported per arity; it grows with m and must not be silently absorbed
    into the denominator.
  replication:
    seeds:
    - 20260807
    independent_instances: 0
    independent_instances_note: 'Deliberately zero: the point is to re-test the SAME implementation
      at a new arity. An independent implementation is a different and also-wanted experiment.'
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.01
    maximum_memory_gb: 1
    maximum_runs: 1
  stopping_rules:
  - Single run; arities fixed in advance at 6 and 7.
  invalidation_rules:
  - A crash or timeout invalidates the run and is not negative mathematical evidence (AGENTS.md
    rule 3).
  success_criterion: Every good specialization at m = 6 and m = 7 matches the predicted type,
    no factor of degree >= 3 appears, no mixed type appears, every factor-base specialization
    splits completely, and all 16 and 32 Frobenius classes are realized.
  falsification_criterion: Any good specialization with an unpredicted factorization type, any
    factor of degree >= 3, any mixed type, any non-splitting good factor-base specialization,
    or a Frobenius class that never occurs across the whole sweep.
  required_artifacts:
  - code/extend_arity.py
  - runs/RUN-SMON-32339c-001/{manifest.yaml, raw-result.json, stdout.log, stderr.log}
  assigned_to: top-level session
  approved_by: null
