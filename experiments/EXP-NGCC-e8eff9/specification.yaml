experiment:
  id: EXP-NGCC-e8eff9
  hypothesis_id: H-NGCC-e2f945
  version: 1
  title: >-
    BiT sign-02-1 length audit: seed and unsalted-digest bounds versus the
    claimed classical level
  status: review_required
  objective: >-
    Decide H-NGCC-e2f945 by tabulating, for every official BiT parameter
    set, the claimed classical level, the seed length, and the unsalted
    digest length, then comparing the generic bound with the claim.
  inputs:
    candidate_id: sign-02
    roster: inputs/ngcc-round1-20260920/candidates.yaml
    package_url: >-
      https://www.niccs.org.cn/niccs/Proposal/Public-Key%20Cryptographic%20Algorithms/Round%201%20candidates/BiT.zip
    literature_pointer: https://eprint.iacr.org/2026/2266
    finding_id: sign-02-1
    out_of_scope_finding: sign-02-2
    corpus_listing: KN-LIT-bc233d
  controls:
    - >-
      Two sources: each length is copied from the specification with a page
      or algorithm reference, and from the reference C source with a file
      and line reference. A set where those two disagree is inconclusive.
    - >-
      Unused lengths: a seed or digest that the parameter set does not use
      as key entropy or as the signed digest is recorded and excluded from
      the minimum.
    - >-
      No attack: the run generates no key, signature, or forgery. sign-02-2
      is not executed.
    - >-
      Meeting sets stay meeting: a parameter set whose applicable bound is
      at least the claim is reported as no shortfall.
  independent_variables:
    - parameter set name, as declared by the official package
  metrics:
    primary:
      - claimed_classical_bits
      - seed_bits
      - unsalted_digest_bits
      - generic_bound_bits
      - shortfall
    secondary:
      - specification_source_agree
  heuristic_under_test: null
  preregistered_prediction:
    quantity: shortfall
    formula: >-
      generic_bound_bits is the minimum of seed_bits and
      unsalted_digest_bits/2 over the inputs that set actually uses.
      shortfall is true when generic_bound_bits is strictly less than
      claimed_classical_bits. At least one declared set has shortfall true
      and specification_source_agree true.
    source: >-
      Saarinen, ePrint 2026/2266, finding sign-02-1, as indexed in
      inputs/ngcc-round1-20260920/paper_mentions.yaml. The prediction was
      written before any run of this experiment.
  scale_relevance:
    tier: crypto
    justification: >-
      The rows are the submitted BiT parameter sets. The result is a bound
      comparison, not a performed 2^256 search.
    correspondence: null
  tail_checks: []
  replication:
    seeds: []
    independent_instances: 1
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: null
  stopping_rules:
    - Stop after every declared parameter set has a completed row or is recorded as missing a required length.
    - A missing specification is infrastructure. It does not clear the set and it does not count as a shortfall.
  invalidation_rules:
    - A length is taken from memory of a similar lattice scheme rather than from the BiT specification or source.
    - A sign-02-2 search is run and its outcome is scored as sign-02-1.
    - An inconclusive disagreement is scored as a shortfall or as a clearance.
    - Submission binaries, object files, or submission build scripts are executed.
  success_criterion: >-
    The table covers every declared parameter set, at least one row has
    shortfall true with specification_source_agree true, and no row scores
    a disagreement or an unused length as a shortfall.
  falsification_criterion: >-
    Every declared parameter set has shortfall false and
    specification_source_agree true.
  required_artifacts:
    - package sha256 and the parameter-set list
    - one row per set with the three lengths, the bound, the claim, both source locations, and the agree flag
    - run manifest with git commit and dirty-tree state
  assigned_to: executor
  approved_by: null
  approval_withheld_because: >-
    The design-experiment skill treats a contract as approved only after
    a snapshot archive commit. This checkout is on branch
    exec/aes-14352a-stage1, and git status in this worktree fails because
    a linked worktree gitdir is missing. Approval waits for a commit on
    an NGCC branch. The fields above are otherwise filled.
