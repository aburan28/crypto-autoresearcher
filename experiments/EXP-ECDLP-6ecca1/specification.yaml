experiment:
  id: EXP-ECDLP-6ecca1
  hypothesis_id: H-ECDLP-3cf1d8
  derived_from_idea: IDEA-20260812-c49409
  question_id: RQ-ECDLP-912694
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    ARM S plus ARM H, cost arm EXCLUDED - complete-class enumeration of the
    automorphism locus at 7 to 9 bits with the odd exceptional-degree check over
    ell in 3, 5, 7, 11, 13, paired with a heuristic-validation enumeration of
    conductor smoothness against Dickman-de Bruijn rho over primes in [2^16, 2^28]
    with a matched uniform-integer synthetic control

  objective: >-
    The one uncertainty a run reduces - whether the automorphism locus of an
    ordinary F_p-isogeny class is a single vertex and whether the odd exceptional
    degree from the j equal to 0 vertex is exactly 3, which is RQ-ECDLP-912694's
    decision target stated as a finite checkable prediction; and, separately,
    whether the conductor of a quadratic-form-constrained CM family obeys the
    uniform-integer smoothness law that any future cost argument would depend on. A
    run establishes (i) the number of vertices with |Aut| greater than 2 in every
    completely enumerated D_K in {-3, -4} class at 7, 8 and 9 bits, with
    F_p-isomorphism deduplication logged; (ii) the per-degree table of codomain
    |Aut| from the special vertex for ell in 3, 5, 7, 11, 13, with each kernel
    identified as ramified, split, inert or descending; (iii) the same measurements
    on the frozen D_K outside {-3,-4} fixture, on the D_K in {-7, -8, -11}
    nearby-object control and on the extension-field control; and (iv) the empirical
    CDF of u equal to log f / log B against Dickman-de Bruijn rho over the complete
    enumeration of the thin family 4p equal to t^2 + |D_K| f^2 for p in [2^16,
    2^28], with a matched uniform-integer synthetic control and an explicit tail
    check on the smoothest observed conductor. THE COST ARM IS EXCLUDED - no Pollard
    rho step count, no charged ascent cost and no end-to-end saving is measured. No
    attack, break or security consequence is claimed here or would follow.

  what_this_is_not:
  - >-
    NOT the cost arm. Arm C of the parent proposal needs 20 to 28 bit primes,
    exceeds RQ-ECDLP-912694's declared bit sizes, and requires its own contract and
    an explicit scope decision. Nothing here measures a rho step count, a discount
    or a charged ascent.
  - >-
    Not an attack and not an exponent claim. Even the excluded cost arm would
    concern a constant factor of at most 1.733 on a subfamily of density about
    1/sqrt(p).
  - >-
    Not evidence about P-256 or P-224, neither of which has D_K in {-3, -4}. Both
    are explicitly outside the covered family.
  - >-
    Not a density claim about curves. Classes with D_K in {-3, -4} are found by
    searching for them, which is not a random sample.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output or
    evidence. No run has been executed under this contract.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - for the completely enumerated classes at 7, 8 and 9
      bits, the automorphism locus has a stated vertex count and the odd-degree
      codomain |Aut| table has stated values over ell in 3, 5, 7, 11, 13; the
      control classes have stated |Aut| values; and over the completely enumerated
      (p,t) family in [2^16, 2^28] the empirical smoothness CDF has a stated KS
      distance from Dickman rho at each admissible B. WHAT DOES NOT FOLLOW - nothing
      about odd degrees outside the declared set; nothing about cryptographic p;
      nothing about rho step counts, reach cost or any end-to-end saving, because
      the cost arm is excluded; no density law, only consistency with one over a
      finite range; and nothing about P-256, P-224 or any deployed curve.

  inputs:
    procedure: >-
      STAGE 0 (zero compute, blocking). Declare the exact prime list for Arm S, the
      degree set, the F_p-isomorphism deduplication rule (NEVER by j-invariant alone,
      since twists share j), the Arm H B grid, the KS threshold, and the minimum
      expected smooth count below which an Arm H cell is refused rather than
      reported. Fix the Dickman rho evaluation routine and check it against known
      values of rho at small u. All fixed before any enumeration.
      STAGE 1 (frozen regression fixture, blocking). Enumerate a complete class with
      D_K outside {-3, -4} and verify |Aut| equal to 2 at EVERY vertex. This is the
      baseline_embedding reproduction check and it is the same prediction
      EXP-ISOU-2ac81f makes for its generic band, so the two instruments cross-check.
      STAGE 2 (nearby-object control, blocking). Enumerate crater vertices with D_K
      in {-7, -8, -11}, which have a small-degree endomorphism of norm 2 or 3 but
      |Aut| equal to 2, and verify the measured |Aut| is exactly 2. A measurement
      showing anything else there is measuring something other than the F_p-rational
      automorphism group and every reading is void.
      STAGE 3 (extension-field control, blocking). On special-j curves where the
      named automorphism is NOT F_p-rational, verify that the F_p-rational |Aut| is
      2, which is what RQ-ECDLP-912694's own scope asks to be demonstrated.
      STAGE 4 (Arm S, D1). For each declared prime and each D_K in {-3, -4},
      enumerate the COMPLETE F_p-isogeny class up to F_p-ISOMORPHISM by exact point
      enumeration and odd-degree Velu quotients, log the deduplication decisions, and
      count vertices with |Aut| greater than 2.
      STAGE 5 (Arm S, D2). From the special vertex, compute EVERY F_p-rational
      ell-isogeny for each ell in 3, 5, 7, 11, 13, record the codomain's |Aut| and
      classify the kernel as ramified, split, inert or descending. Every kernel and
      quotient carries an independent curve-membership certificate.
      STAGE 6 (Arm H, synthetic control FIRST). Draw uniformly random integers
      matched in size to the conductors, factor them with the identical pipeline, and
      compute the identical KS statistic against rho. This validates the sampler, the
      factoriser and the metric before the constrained family is read.
      STAGE 7 (Arm H, signal). Completely enumerate (p,t) with D_K in {-3, -4} over
      primes in [2^16, 2^28] via 4p equal to t^2 + |D_K| f^2, factor each f
      completely, and compute the empirical CDF of u equal to log f / log B against
      rho(u) for each B in the grid, with the KS statistic and the tail check on the
      smoothest observed f.
      STAGE 8 (zero compute). Assemble the class tables, the per-degree |Aut| table,
      the control table, the Arm H CDF comparison per B with refused cells listed,
      and the explicit statement that the cost arm was not run.
    instrument: >-
      Exact point enumeration and odd-degree Velu quotients for Arm S. Kohel's
      criterion is IMPLEMENTED AND INDEPENDENTLY CHECKED against a separately
      computed endomorphism ring at each level rather than trusted. Every kernel,
      quotient and curve-membership claim is re-verified by code sharing no state
      with the producer. A bounded sieve plus complete integer factorisation for Arm
      H, with the Dickman rho routine written from its defining delay differential
      equation and checked against known values at small u. Recorded through
      harness/runner.py.
    parameters: >-
      ARM S - primes of 7, 8 and 9 bits, exact list fixed at Stage 0; D_K in {-3,
      -4} with p congruent to 1 mod 3 and 1 mod 4 respectively so the automorphisms
      are F_p-rational; odd degrees ell in 3, 5, 7, 11, 13; complete classes
      enumerated up to F_p-isomorphism. CONTROLS - one complete class per prime with
      D_K outside {-3, -4}; crater curves with D_K in {-7, -8, -11}; special-j curves
      over an extension field. ARM H - complete enumeration of the thin family over
      primes in [2^16, 2^28]; B grid fixed at Stage 0; KS threshold fixed at Stage 0;
      matched uniform-integer synthetic control of equal size. EXCLUDED - all 20 to
      28 bit work and all rho measurement.

  controls:
  - >-
    FROZEN REGRESSION FIXTURE, blocking - a complete class with D_K outside {-3, -4}
    must show |Aut| equal to 2 at every vertex. Computed and frozen before the
    special-j arm is read. This is also the exact parameter slice recovering
    EV-ECDLP-b3e847 obstruction 4, so the standing closure is reproduced rather than
    contradicted.
  - >-
    NEARBY-OBJECT CONTROL, blocking and mandatory - crater vertices with D_K in {-7,
    -8, -11}, which possess a small-degree endomorphism of norm 2 or 3 but |Aut|
    equal to 2. This discriminates the automorphism group from being on the crater,
    and it is the sharpest available control because a cheap endomorphism is present
    while an invertible one is not.
  - >-
    EXTENSION-FIELD CONTROL, named in RQ-ECDLP-912694's own scope - special-j curves
    where the automorphism is not F_p-rational must show F_p-rational |Aut| equal to
    2.
  - >-
    DEDUPLICATION CONTROL, blocking - class vertices are deduplicated up to
    F_p-ISOMORPHISM and never by j-invariant alone, with every decision logged.
    Twists share j and have different traces; deduplicating by j would both merge
    distinct vertices and import curves from other classes, corrupting D1 in both
    directions.
  - >-
    CERTIFICATE CONTROL - every kernel, every isogeny edge and every curve-membership
    claim is independently re-verified by code sharing no state with the producer.
    Verification fraction must be 1.0.
  - >-
    ARM H SYNTHETIC CONTROL, mandatory and run FIRST - uniformly random integers
    matched in size to the conductors, factored by the identical pipeline and scored
    by the identical KS statistic against rho. If the control itself departs from
    rho, the sampler, the factoriser or the metric is at fault and the signal arm is
    unreadable.
  - >-
    ARM H POWER GATE - a B cell whose expected smooth count falls below the Stage 0
    minimum is REFUSED and reported as refused, never reported as agreement.

  independent_variables:
  - 'D_K - -3, -4 (signal); outside {-3,-4} (fixture); -7, -8, -11 (nearby object)'
  - prime bit size 7, 8, 9 for Arm S
  - odd isogeny degree ell in 3, 5, 7, 11, 13
  - 'field of definition of the automorphism - F_p-rational versus extension only'
  - 'Arm H - smoothness bound B across the declared grid'
  - 'Arm H arm - constrained conductor family versus matched uniform integers'

  metrics:
    primary:
    - >-
      locus size - integer per class - the number of vertices with |Aut| greater than
      2 in a completely enumerated F_p-isogeny class, reported with the
      F_p-isomorphism deduplication log; predicted exactly 1 for D_K in {-3, -4}
    - >-
      per-degree codomain |Aut| table - integer per (ell, isogeny) - the |Aut| of the
      codomain of every F_p-rational ell-isogeny from the special vertex, each row
      carrying the kernel classification (ramified, split, inert, descending)
    - >-
      control |Aut| values - integer per vertex - measured |Aut| on the D_K outside
      {-3,-4} fixture, on the D_K in {-7, -8, -11} nearby objects and on the
      extension-field control; all predicted exactly 2
    - >-
      Kolmogorov-Smirnov statistic - dimensionless - between the empirical CDF of u
      equal to log f / log B over the enumerated family and Dickman rho(u), per B in
      the grid, reported for both the signal arm and the synthetic control
    - >-
      certificate verification fraction - dimensionless in [0,1] - the fraction of
      kernels, quotients and membership claims independently re-verified; must be 1.0
    secondary:
    - >-
      exact conductor f, its complete factorisation and its largest prime factor, per
      enumerated class in Arm S and per family member in Arm H
    - >-
      family size and per-B expected smooth count in Arm H, so a refused cell is
      visibly refused rather than absent
    - >-
      smoothest observed f in the enumerated family, and the rho-predicted
      probability of seeing one that smooth at the observed sample size - the tail
      check
    - >-
      volcano level of every vertex, so the crater is identified by structure rather
      than by |Aut| alone
    - >-
      class size per enumerated class, reported so a class too small to have a
      nontrivial ascent is visibly so
    - >-
      wall time and peak memory per arm, and an explicit list of censored cells

  heuristic_under_test:
    id: H-AUT-1
    formal_statement: >-
      FOR ordinary curves with D_K in {-3, -4}, the conductor f equal to
      sqrt((4p - t^2)/|D_K|) behaves like a uniformly random integer of its size with
      respect to smoothness - for B in the declared grid, the proportion of the family
      with f B-smooth equals rho(u) with u equal to log f / log B and rho the
      Dickman-de Bruijn function, up to sampling error.
    tested_here: true
    scale_access: >-
      The family is thin but COMPLETELY ENUMERABLE, because 4p equal to t^2 + |D_K|
      f^2 parametrises it exactly. So the run does not sample the family - it
      enumerates it over primes in [2^16, 2^28], and the only sampling error is the
      finiteness of the range itself. That is the scale-access mechanism, and it is
      what makes this validation cheap.
    transfer_assumption: >-
      STATED EXPLICITLY - f is constrained by a quadratic form and is therefore NOT a
      uniformly random integer. Consistency with rho is predicted and the constraint
      is flagged as the most likely source of deviation. A measured deviation is a
      FINDING, not a defect, and its DIRECTION says whether a future saving would be
      more or less available than a Dickman estimate would predict. Nothing is
      transferred to cryptographic p.
    sample_size_justification: >-
      Derived from the SMALLEST predicted probability the run must resolve. For each B
      in the grid the expected smooth count is (family size) times rho(u_B). The Stage
      0 declaration fixes a minimum expected count of 30 - meaningfully larger than 1
      - and any B whose expected count falls below it is REFUSED rather than reported,
      because a KS statistic computed where fewer than a handful of smooth conductors
      are expected measures nothing. The B grid is therefore chosen so that the
      largest declared u still clears the minimum at the enumerated family size, and
      the family size is reported so a reader can check the arithmetic.
    comparison_metric: >-
      Kolmogorov-Smirnov distance between the empirical CDF of u and rho(u), computed
      identically on the signal arm and on the matched uniform-integer control, with
      the threshold fixed at Stage 0.
    tail_checks: >-
      The smoothest observed f against the rho-predicted probability of seeing one
      that smooth at the observed family size; and the per-B smooth counts reported
      raw alongside the CDF, so a KS statistic driven entirely by the bulk cannot hide
      a tail disagreement.

  preregistered_prediction:
    quantity: >-
      The number of vertices with |Aut| greater than 2 per D_K in {-3, -4} class; the
      set of odd degrees ell in 3, 5, 7, 11, 13 whose codomain from j equal to 0 still
      has |Aut| equal to 6; and the KS distance between the enumerated conductor
      smoothness CDF and Dickman rho.
    formula: >-
      Locus(class) := |{vertices with |Aut| greater than 2}|; predicted exactly 1 for
      every sampled D_K in {-3, -4} class. Exceptional(ell) := true iff some
      F_p-rational ell-isogeny from j equal to 0 has codomain with |Aut| equal to 6;
      predicted true for ell equal to 3 with ramified kernel and FALSE for ell in 5,
      7, 11, 13. KS(B) := sup_u |F_emp(u) - rho(u)|; predicted below the Stage 0
      threshold at every admissible B. Under the null that the automorphism structure
      is not what the frame says, Locus is not 1 or Exceptional is true for some ell
      greater than 3. Under the null that the quadratic-form constraint biases
      smoothness, KS exceeds the threshold.
    source: >-
      Pre-registered in the parent proposal IDEA-20260812-c49409, whose predictions
      block states exactly 1 with zero exceptions for the locus, exactly the ell equal
      to 3 ramified isogenies and no others for the boundary, and whose H-AUT-1
      validation_plan specifies enumerating all (p,t) with D_K in {-3,-4} over primes
      in [2^16, 2^28], factoring each f completely, and comparing the empirical CDF of
      u against rho(u) by a Kolmogorov-Smirnov statistic with a tail check on the
      smoothest observed f. The minimum expected smooth count of 30 and the numeric KS
      threshold are this contract's operationalisation, fixed at Stage 0 before any
      enumeration. Never tuned to data.

  scale_relevance:
    tier: toy
    justification: >-
      ARM S is executed at exactly RQ-ECDLP-912694's declared bit sizes of 7, 8 and 9
      because it requires COMPLETE class enumeration up to F_p-isomorphism, which is
      only exact at those sizes; the predictions D1 and D2 are structural and do not
      need scale to be decided. ARM H reaches primes in [2^16, 2^28] because the
      family is thin and completely enumerable there, so the smoothness law is tested
      on the real object rather than on a proxy - but this is still far below
      cryptographic size and no transfer to cryptographic p is claimed. THE COST ARM,
      which is the part that would need scale to mean anything, is EXCLUDED for
      exactly that reason.
    correspondence: >-
      Arm H's scale access comes from the exact parametrisation 4p equal to t^2 +
      |D_K| f^2, which enumerates the family without needing to construct or count
      points on any curve. That is the correspondence that makes a 2^28 range
      affordable at all.

  tail_checks:
  - >-
    Report the smoothest observed conductor f and the rho-predicted probability of
    observing one that smooth at the enumerated family size; an excess of smooth
    conductors is the interesting direction and would mean a saving is more available
    than predicted.
  - >-
    Report per-B raw smooth counts alongside the CDF, so a KS statistic driven by the
    bulk cannot hide a tail disagreement, and so a refused cell is visible.
  - >-
    Report the class SIZE of every Arm S class; at 7 to 9 bits a class may be so small
    that the crater is the only vertex, which makes D1 trivially true at that cell and
    must be labelled rather than counted as confirmation.
  - >-
    Report the number of F_p-rational ell-isogenies actually found at each ell; a
    degree with zero rational isogenies contributes no evidence about D2 and must not
    be scored as agreement.
  - >-
    Report the deduplication log in full, including every pair of curves considered
    for merging, since a D1 result of exactly 1 obtained by over-merging looks
    identical to a correct one.

  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
    note: >-
      Arm S is deterministic complete enumeration, so seeds affect only the
      independent re-verification pipeline and the synthetic control draws in Arm H.
      Arm H's signal arm is likewise a complete enumeration; its three instances
      differ only in the matched uniform-integer control draw.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 2.0
    maximum_memory_gb: 8
    maximum_runs: 30

  stopping_rules:
  - >-
    Stop immediately if the D_K outside {-3,-4} frozen fixture shows |Aut| other than
    2 at any vertex.
  - >-
    Stop immediately if the D_K in {-7, -8, -11} nearby-object control shows |Aut|
    other than 2.
  - >-
    Stop immediately if the certificate verification fraction is below 1.0 on any
    kernel, quotient or membership claim.
  - >-
    Do not read the Arm H signal arm before the matched uniform-integer synthetic
    control has been executed in the same invocation.
  - >-
    REFUSE any Arm H B cell whose expected smooth count is below the Stage 0 minimum
    of 30, and report it as refused rather than as agreement.
  - >-
    DO NOT EXECUTE ANY 20 to 28 BIT WORK AND DO NOT MEASURE ANY POLLARD RHO STEP
    COUNT. The cost arm is excluded from this contract; performing it would silently
    widen the question's declared scope.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion
    is a stop, never a negative result (AGENTS.md rule 5).

  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion, factorisation failure or dependency failure
    makes the run failed_infrastructure and is NEVER negative mathematical evidence
    (AGENTS.md rule 5).
  - >-
    A run deduplicating class vertices by j-invariant alone is invalid_measurement -
    twists share j and the deduplication rule is what D1 is most sensitive to.
  - >-
    A run whose Arm H signal arm was executed without the matched uniform-integer
    synthetic control in the same invocation is invalid_measurement.
  - >-
    A run reporting a KS statistic at a B cell whose expected smooth count is below
    the declared minimum is invalid_measurement at that cell.
  - >-
    A run whose class enumeration is not COMPLETE at a given prime is
    invalid_measurement for D1 at that prime - a partial class cannot bound a vertex
    count from above.
  - >-
    A run performing any part of the excluded cost arm is OUT OF CONTRACT and its
    cost measurements are inadmissible regardless of quality.
  - >-
    A run whose parameters differ from the frozen contract is a DIFFERENT experiment
    and requires a new contract.

  success_criterion: >-
    The frozen D_K outside {-3,-4} fixture, the D_K in {-7, -8, -11} nearby object and
    the extension-field control all return |Aut| equal to 2; the certificate
    verification fraction is 1.0; every Arm S class is enumerated COMPLETELY up to
    F_p-isomorphism with the deduplication log recorded; the per-degree codomain
    |Aut| table is populated for every ell in the declared set at which at least one
    F_p-rational isogeny exists; and the Arm H synthetic control and signal arm both
    report a KS statistic against rho at every admissible B with the refused cells
    listed. This criterion is decidable from the primary metrics alone and says
    nothing about which values are found.

  falsification_criterion:
  - >-
    A class with D_K in {-3, -4} containing two or more vertices with |Aut| greater
    than 2, with the deduplication log showing no over-splitting. D1 is FALSE, the
    frame's premise fails, and the record must be superseded rather than repaired.
  - >-
    An F_p-rational isogeny of odd degree ell greater than 3 from the j equal to 0
    vertex whose codomain still has |Aut| equal to 6. D2 is FALSE and
    RQ-ECDLP-912694's exceptional-prime boundary is not where predicted - a direct and
    useful answer in the unexpected direction.
  - >-
    Any vertex of the frozen fixture, or any D_K in {-7, -8, -11} crater vertex, or
    any extension-field control curve, measured with F_p-rational |Aut| other than 2.
    The meter is not measuring |Aut| and EVERY reading is void.
  - >-
    The Arm H empirical CDF departs from Dickman rho beyond the Stage 0 threshold at
    any admissible B while the matched uniform-integer synthetic control agrees.
    H-AUT-1 is FALSIFIED over the enumerated range - the quadratic-form constraint
    biases conductor smoothness, and any Dickman-based availability estimate for a
    future cost arm is wrong by the measured direction.
  - >-
    The Arm H synthetic control ITSELF departs from rho beyond the threshold. The
    sampler, factoriser or metric is at fault and the signal arm is unreadable in
    either direction.
  - >-
    Certificate verification fraction below 1.0 anywhere. Nothing is reportable.

  required_artifacts:
  - >-
    manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model
    and inference block, and environment
  - >-
    raw-result.json carrying every enumerated vertex with its |Aut| and volcano level,
    every ell-isogeny with its kernel classification and codomain |Aut|, every
    conductor with its complete factorisation, and every Arm H family member - not
    summaries
  - >-
    the control arms' measurements - frozen fixture, nearby object, extension field,
    and the Arm H matched uniform-integer synthetic control - in the same file as the
    signal arms
  - >-
    the FULL F_p-isomorphism deduplication log, including every pair considered for
    merging and the decision taken
  - >-
    independent re-verification certificates for every kernel, quotient and
    curve-membership claim, produced by code sharing no state with the producer, with
    the verification fraction stated
  - >-
    the Stage 0 pre-declaration text, written before any enumeration and hashed,
    containing the prime list, the degree set, the deduplication rule, the B grid, the
    KS threshold and the minimum expected smooth count
  - >-
    the Arm H per-B table with family size, expected smooth count, observed smooth
    count, KS statistic and refusal status, plus the smoothest-conductor tail check

  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval is required before execution, and under this engagement
    approval is the USER's gate because it authorizes execution and spends compute.
    This contract is NOT approved - approved_by is null and execution_authorized is
    false (AGENTS.md rule 1).
  - >-
    THE COST ARM IS EXCLUDED BY THIS CONTRACT. The parent proposal states that Arm C
    exceeds RQ-ECDLP-912694's declared bit sizes and must not be executed under the
    existing scope by default. It is not included here and its stopping rule forbids
    it. A future cost arm needs its own contract AND an explicit scope decision by the
    approver.
  - >-
    ARM H SCOPE NOTE, FOR THE APPROVER. Arm H enumerates over primes in [2^16, 2^28],
    which is outside RQ-ECDLP-912694's declared bit sizes of 7, 8 and 9, even though
    it performs NO curve arithmetic, constructs no isogeny and solves no DLP - it is a
    sieve plus integer factorisations. It is included because a conditional result
    must be paired with validation of the distribution it is conditional on, and
    because it is the cheapest way to learn whether any future cost arm is worth
    commissioning. Whether that counts as widening the question's scope is a ruling
    only the approver can make; if the ruling is no, Arm H is removed and Arm S stands
    alone with H-AUT-1 recorded as unvalidated.
  - >-
    The paired hypothesis H-ECDLP-3cf1d8 carries a filled proof_search_map with a
    named bottleneck, a frozen baseline fixture, an executed observation-collision
    search, an explicit quantifier order, a method ceiling and a nearby-object
    control. That map must be audited against KN-TECH-080 before implementation, since
    the hypothesis carries an asymptotic_claim of kind constant_factor.
  - >-
    The prime list, degree set, deduplication rule, B grid, KS threshold and minimum
    expected smooth count must be recorded at Stage 0 before any enumeration.

  derivation_provenance:
    tool: coordinator subagent, design-experiment lifecycle steps 3 to 5
    source_record: IDEA-20260812-c49409
    authored_at: '2026-08-25'
    note: >-
      Arm S, its controls, the deduplication requirement, the certificate requirement
      and the falsification conditions are taken from the parent proposal's
      minimal_test, controls, proof_search_map and falsification_conditions blocks.
      Arm H is the parent proposal's own H-AUT-1 validation_plan, promoted to a
      first-class arm because the Coordinator contract requires a conditional result
      to be paired with heuristic validation. TWO ADDITIONS BY THIS CONTRACT, both
      recorded - the matched uniform-integer synthetic control for Arm H, required by
      the design-experiment skill's heuristic-validation pattern and absent from the
      proposal; and the minimum expected smooth count of 30, which converts the
      proposal's B grid into a power gate. THE COST ARM IS DELIBERATELY EXCLUDED,
      following the proposal's own instruction that it must not be executed under the
      existing scope by default. Budgets come from the parent's declared estimated_cost
      (implementation medium, compute low) and its compute_budget_note, which states
      Arm S runs in seconds and the conductor enumeration takes minutes to an hour.
      No field is invented.

  derivation_gaps:
  - >-
    The exact prime list at 7, 8 and 9 bits is not fixed. It must be pinned at Stage 0,
    and it should be the COMPLETE set of qualifying primes at those sizes rather than a
    selection, since selecting primes after seeing a locus count would select the
    outcome.
  - >-
    The KS threshold and the B grid are not given by the proposal. A Coordinator must
    fix them, and the threshold should be derived from the enumerated family size
    rather than chosen as a conventional significance level.
  - >-
    At 7 to 9 bits a class may contain only the crater vertex, which makes D1 trivially
    true at that cell. The proposal notes that ascent may be a single step or none at
    these sizes. The contract requires class size to be reported so such cells are
    labelled, but it does not say how many nontrivial cells are needed for D1 to mean
    anything - that threshold is unset and a Coordinator should set it.
  - >-
    Whether F_p-rational isogenies of every declared degree exist at these tiny primes
    is unknown in advance. A degree with no rational isogenies contributes nothing to
    D2, and if several degrees are empty the D2 test is weaker than the quantifier
    order suggests.
  - >-
    H-AUT-2 (the sqrt(m) rho discount) is recorded on the hypothesis and is
    UNVALIDATED, because its validation lives in the excluded cost arm. Any future
    contract that measures a discount must validate it against the same-curve
    quotient-on-versus-off positive control the proposal specifies, and must count
    fruitless-cycle incidence as a charged cost.
