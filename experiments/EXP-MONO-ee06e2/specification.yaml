experiment:
  id: EXP-MONO-ee06e2
  version: 1
  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-09-04'
  hypothesis_id: H-MONO-fa4cb9
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  coordinator_approval_rationale: >-
    APPROVED. This is DEC-20260904-46b71e's own named high-priority
    next_action: the linear-vs-non-linear discrimination that a single
    h_-=1 curve (EXP-MONO-4e6faa) could not provide. Cheap (same pipeline,
    seconds of compute), pre-registers a named non-linear rival before any
    run, and independently re-verifies (rather than assumes) the Red
    Team's own free-standing finding that h_->=2 curves exist and are
    common at p=101.

  title: >-
    Does the D3 closed form's h_- dependence survive as LINEAR on a
    curve with h_- >= 2, discriminating it from a named quadratic rival?

  what_this_is_not:
    - Not a discrete-logarithm computation, not an ECDLP attack, not relation collection.
    - Not an ECDLP cost, runtime, exponent, or cryptographic-scale claim.
    - >-
      Not a re-run of EXP-MONO-4e6faa (that result stands on its own,
      cited not re-derived) -- this experiment specifically targets the
      functional-FORM question that curve's h_-=1 could not resolve.
    - >-
      Not a test of the non-split strata, named by the parent idea as
      separate future work.
    - >-
      Not a re-scoping of H-MONO-93bc4d's own already-closed collision-rate
      formula.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: whether, on a specific found curve with h_- >= 2, the
      LINEAR closed-form prediction (D3, unchanged) matches an exhaustive
      census exactly while a named quadratic rival does not. A linear
      match with a quadratic mismatch is toy-scale evidence the D-term's
      dependence on h_- is specifically linear (not merely monotonic or
      threshold-like), not a proof for every curve; any other outcome is
      reported exactly as observed.
    what_no_outcome_can_support: >-
      No outcome supports any relation-rate, cost, exponent, or
      cryptographic-scale claim. No outcome resolves the non-split strata
      or the cross-lane H-MONO-93bc4d question.

  inputs:
    construction_reused: >-
      EXP-MONO-0e6e8f's own already-independently-verified Q_e(T)
      construction and classification method
      (implementation/run_uncond_census.py), and EXP-MONO-4e6faa's own
      already-independently-verified Stage-0/1 search-and-census pipeline
      structure, reused unmodified except for the Stage-0 filter threshold
      (h_- >= 2 instead of h_- > 0) and the addition of the named quadratic
      rival prediction in Stage 2.
    domain: EXP-MONO-ee06e2/v1
    search: >-
      Scan ordinary curves (varying A,B) at toy primes in [101,2000], SAME
      fixed ascending order as EXP-MONO-4e6faa (prime asc, then A asc,
      then B asc), computing #E(F_p), #E^d(F_p), tau, #E[4], #E^d[4] for
      each, until a curve with Z=3 AND h_- >= 2 is found. Disclose the
      exact number of curves scanned before success, or exhaustion of the
      declared range if none is found. Do NOT hard-code or special-case
      the specific (A,B)=(1,33) pair the Red Team's own review previously
      found at p=101 -- the fixed search order decides, independently
      re-verifying rather than assuming that finding.
    census: >-
      On the found curve, exhaustively enumerate the distinct-split (Z=3)
      residual stratum's own base points, classify each via the
      already-verified Q_e(T) construction, and tabulate exact
      #1^4, #2+1+1, #2+2 counts.

  stage_order:
    stage_0:
      name: search for a Z=3, h_->=2 curve
      compute: seconds to minutes
      description: >-
        Scan curves as described above. Report success (with the exact
        curve, its n_+, n_-, h_+, h_- values) or exhaustion of the
        declared range (a reportable non-finding, per HEUR-CELL-2's own
        bounded-negative rule -- not a falsification of the formula, though
        the Red Team's own prior count makes exhaustion very unlikely).
    stage_1:
      name: exhaustive distinct-split census on the found curve
      compute: minutes
      description: >-
        Reusing EXP-MONO-0e6e8f's own verified construction, exhaustively
        classify every distinct-split base point on the found curve into
        the five-class scheme, and separately tabulate the #1^4, #2+1+1,
        #2+2 counts.
    stage_2:
      name: exact three-way comparison -- observed vs. linear vs. quadratic
      compute: seconds
      description: >-
        Compute BOTH D_lin = h_+ n_- + h_- n_+ (the frozen D3 formula) and
        D_quad = h_+ n_- + (h_-)^2 n_+ (the named quadratic rival) from
        the found curve's own (n_+, n_-, h_+, h_-) values, BEFORE reading
        Stage 1's own results. Then compute each formula's own predicted
        #1^4, #2+1+1, #2+2 and compare EXACTLY (zero tolerance) against
        Stage 1's own observed counts. Report R1_lin, R2_lin (residuals
        against the linear prediction) and R1_quad, R2_quad (residuals
        against the quadratic rival) explicitly, whether zero or not.

  metrics:
    primary:
      - "M1: R1_lin = observed #1^4 - D_lin-predicted #1^4 (exact integer, zero-tolerance)"
      - "M2: R2_lin = observed #2+1+1 - D_lin-predicted #2+1+1 (exact integer, zero-tolerance)"
    secondary:
      - "M3: R1_quad, R2_quad -- the same residuals against the named quadratic rival, reported for context and discrimination, not as the primary pre-registered prediction."
      - "M4: the found curve's own (p, A, B, n_+, n_-, h_+, h_-) values, disclosed in full."
      - "M5: the number of curves scanned in Stage 0 before success (or exhaustion)."

  preregistered_prediction:
    - quantity: M1, M2
      value: "Exactly 0, under the LINEAR D3 formula (unchanged from IDEA-20260904-4f614a / EXP-MONO-4e6faa)."
      formula: "D_lin = h_+ n_- + h_- n_+; see H-MONO-fa4cb9's own statement field."
      source: IDEA-20260904-4f614a mechanism, unmodified.
    - quantity: M3
      value: >-
        Predicted to differ from 0 whenever h_- >= 2 and n_+ > 0 (since
        D_lin != D_quad in that regime) -- i.e. this experiment predicts,
        BEFORE running, that the quadratic rival will NOT match, precisely
        so that a linear match is a genuinely discriminating result rather
        than an ambiguous one.
      formula: "D_quad = h_+ n_- + (h_-)^2 n_+; named here as the rival under test, not endorsed."
      source: H-MONO-fa4cb9's own mechanism field (the simplest non-linear rival not excluded by EXP-MONO-4e6faa).

  replication:
    planned_runs: 1
    seeds: [20260904005]
    interpretation: >-
      Deterministic once the search order and range are fixed; exact
      reproducibility from the recorded curve and search order.

  budget:
    maximum_runs: 1
    maximum_wall_seconds: 900
    maximum_cpu_seconds: 900
    maximum_peak_rss_bytes: 134217728
    maximum_total_disk_bytes: 10485760
    maximum_workers: 1
    no_network: true

  environment_preconditions:
    consequence: NO CAS AND NO SOLVER IS REQUIRED. Pure Python, reusing EXP-MONO-0e6e8f's and EXP-MONO-4e6faa's own verified implementations.
    if_a_precondition_fails: >-
      A missing interpreter or an arithmetic exception is
      `failed_infrastructure`, never negative mathematical evidence
      (AGENTS.md rule 3). Exhaustion of the Stage-0 search range without
      finding an h_->=2 curve is NOT an infrastructure failure -- it is a
      reportable, valid, non-evidentiary outcome per HEUR-CELL-2.

  infrastructure_failure_disposition: >-
    Any crash is recorded with its exact cause and classified
    `failed_infrastructure`. Supports and weakens NOTHING about
    H-MONO-fa4cb9 or IDEA-20260904-4f614a.

  stopping_rules:
    - Do not execute unless separately reviewed, approved, frozen and authorized. (Satisfied here.)
    - Stop and report the Stage-0 search outcome plainly if the declared range is exhausted without finding a qualifying curve.
    - Do not silently discard a disconfirming Stage-2 residual, for either the linear or the quadratic prediction.
    - Do not hard-code, special-case, or search-order-bias toward the specific (A,B)=(1,33) pair the Red Team's prior review named -- let the fixed, declared search order decide independently.

  invalidation_rules:
    - Any execution while frozen, execution_authorized or evidence_eligible is false.
    - Any post-hoc widening of the Stage-0 search range after observing a Stage-1 or Stage-2 result.
    - Any reporting of Stage-2 residuals that omits R1_lin, R2_lin, R1_quad, or R2_quad.
    - Hard-coding the search to land on the previously-named (A,B)=(1,33) pair rather than following the declared fixed order independently.

  success_criterion: >-
    A run is well-formed evidence if: Stage 0's search outcome (found or
    exhausted) is reported with the exact curve or exact scan count;
    Stage 1's exhaustive census is reported in full; Stage 2's exact
    residuals against BOTH the linear and quadratic predictions are
    reported plainly, whether zero or not.

  falsification_criterion: >-
    Any nonzero R1_lin or R2_lin on a found h_->=2 curve, correctly
    constructed and verified.

  outcomes:
    linear_form_confirmed_quadratic_rival_excluded: >-
      A qualifying curve is found, R1_lin=R2_lin=0 exactly, and R1_quad or
      R2_quad is nonzero. The linear form of the D-term is genuinely
      discriminated from the named rival -- this closes the
      retrodiction-bias gap in full for the tested curve.
    linear_form_falsified: >-
      A qualifying curve is found but R1_lin or R2_lin is nonzero. The
      specific linear form is falsified; H-MONO-fa4cb9's own outcome (II)
      or (III) applies depending on whether the quadratic rival matches
      instead.
    both_forms_falsified: >-
      Neither the linear nor the quadratic prediction matches exactly.
      Reported plainly as a genuinely surprising result requiring a fresh
      derivation attempt, per H-MONO-fa4cb9's own outcome (III).
    no_qualifying_curve_found: >-
      The declared search range is exhausted without finding an h_->=2,
      Z=3 curve. Reported as a valid, non-evidentiary occupancy finding
      per HEUR-CELL-2 -- very unlikely given the Red Team's own prior
      count, but reported exactly as found if it occurs.
    infrastructure_or_construction_failure: See infrastructure_failure_disposition. Never mathematical evidence.

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_do_not: >-
      Toy scale only; no transfer to cryptographic scale. A single
      confirmed linear-vs-quadratic discrimination is a real but limited
      test, not a proof for every possible h_- value or every curve.

  required_artifacts_if_later_authorized:
    - Frozen approved specification (this file).
    - Stage-0 search outcome (curve found or range exhausted, with exact scan count).
    - Run manifest, command, environment, raw-result.json with the found curve's own full parameters and the exhaustive census's own exact counts.
    - Independent Validator + Red Team review before any citation of this result alongside IDEA-20260904-4f614a's own broader claim.

  approval_requirements:
    - This contract is DEC-20260904-46b71e's own named high-priority next_action.
    - Independent review confirms the found curve's own h_->=2 status, that the search was not biased toward the previously-named (A,B) pair, and the exact residual computations for both the linear and quadratic predictions.

  approval_status: >-
    APPROVED 2026-09-04 by the Coordinator; see `coordinator_approval_rationale` above.

  source_refs:
    - ledger/hypotheses/H-MONO-fa4cb9.yaml
    - ledger/proposals/IDEA-20260904-4f614a.yaml
    - ledger/decisions/DEC-20260904-46b71e.yaml
    - ledger/evidence/EV-MONO-91bca2.yaml
    - experiments/EXP-MONO-4e6faa/implementation/run_h_minus_stress.py
    - experiments/EXP-MONO-4e6faa/reviews/red-team/red-team-report.yaml
    - experiments/EXP-MONO-0e6e8f/implementation/run_uncond_census.py

  inference:
    requested_policy: executor-implementation
    reasoning_effort: medium
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
