      status: confirmed
    - target: "H-MONO-fa4cb9's own transfer_assumption -- 'a confirmed
        linear match on ONE h_->=2 curve supports but does not prove the
        linear form for every possible h_- value'"
      challenge: >-
        This is honestly stated and, per OBJ-J4-4, actually UNDERSELLS the
        strength of the result: the derivation (once independently
        verified as I did above) does not merely leave room for
        extrapolation from one data point -- it structurally forces
        linearity for every (h_+,h_-) pair in {0,..,3}^2 with h_++h_-<=3
