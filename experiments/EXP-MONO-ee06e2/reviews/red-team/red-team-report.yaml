  proof_architecture_challenges:
    - attack: compositional-invariant
      target: "STEP 4's 'exchanged by the other two involutions and by
        nothing else' clause"
      finding: >-
        Deleting this clause (i.e. allowing two different halvable T's
        fixed-point pairs to overlap) is exactly the failure mode that
        would break the "exactly one pair per T'" count and hence the
        entire linear-sum structure. I checked this specific deletion
        directly from the group law (OBJ-J4-1: 2Q=T' and 2Q=T'' sharing an
        x-coordinate forces T'=T'' since 2-torsion points are
        self-negative) and confirmed the clause holds absolutely, not
        merely generically -- it survives for every Z=3 curve, not just
        the two tested. This closes, by argument rather than data, exactly
        the failure mode EXP-MONO-4e6faa's own red-team report
        (RT-20260904-f4c9a2) flagged as unverified for h_->=2 configurations.
    - attack: nearby-object
      target: "the untested (h_+>0, h_->0) regime"
      finding: >-
        The nearest object for which the claimed mechanism (disjoint,
        non-interacting pairs) COULD plausibly fail is a curve where a
        special h_+ pair and a special h_- pair coexist and share
        proximity in some way the disjointness proof does not anticipate
        (e.g. an accidental extra rational relation between the two
        pairs' elements at small p). I located a concrete instance of this
        nearby object (p=103, A=1, B=11, h_+=1, h_-=1) and verified its
        basic parameters hold up under brute-force computation; I did not
        run its full census (out of scope, see counterexample_or_mutation),
        so this remains a NAMED, cheap, unexecuted control rather than a
        completed one.
    - attack: quantifier-order
      target: "STEP 4/5's 'each halvable T' contributes exactly one pair'"
      finding: >-
        Rewriting with explicit quantifiers: "for every Z=3 ordinary
        curve, for every nontrivial 2-torsion point T' with chi(f'(e_T'))
        in {computed from that curve alone}, the fixed-point pair {x0,x1}
        is determined purely by T' and the curve -- no witness is chosen
        after seeing the census result." I confirmed this by construction:
        Stage 2's D_lin/D_quad computation reads ONLY (n_+,n_-,h_+,h_-)
        (found BEFORE Stage 1 runs, per the code's own stage ordering and
        the manifest's `computed_before_reading_stage_1` disclosure), so
        no witness-after-the-fact selection is structurally possible in
        the EXECUTED pipeline. No quantifier-order violation found.

  narrowest_supported_statement: >-
    On the found curve p=101, A=1, B=33 (Z=3, tau=4, n_+=52, n_-=46, h_+=0,
    h_-=3), Stage 0's search was genuinely unbiased (independently
    re-verified from scratch, matching the archived scan count exactly:
    135 (A,B) pairs, 134 nonsingular, 8 with Z=3), and the exhaustive
    census (152,096 base points) matches the linear D3 closed form exactly
    (R1_lin=R2_lin=0) while decisively excluding the named quadratic rival
    (R1_quad=-312, R2_quad=936). IDEA-20260904-4f614a's own STEP 4/5
    derivation of this linear form is SOUND on independent re-derivation:
    the "exactly one pair per halvable T', no double counting" claim
    (i), the "chi mu-invariance prevents D/2+1+1 overlap" claim (ii), and
    the claim that this mechanism structurally FORCES linearity rather
    than merely being compatible with it (iii) all check out via direct
