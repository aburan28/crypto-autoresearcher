      independently re-derives roots_f, n_+/n_-, and h_+/h_- from scratch
      inside this script rather than importing J1's in-memory values. This is
      a FULL exhaustive census over itertools.combinations of the 98-element
      set S = F_101 \ {4,45,52}, i.e. all C(98,3) = 152096 base points, not a
      sample. D_lin and D_quad formulas were re-verified against
      IDEA-20260904-4f614a's own (D3) notation block ("D := h_+ * n_- + h_- *
      n_+") and H-MONO-fa4cb9's own mechanism/statement fields ("D_quad =
      h_+ n_- + (h_-)^2 n_+"), not taken from the task prompt's paraphrase.
    stratum_enumeration:
      base_points_enumerated: 152096
      expected_C_98_3: 152096
      match: true
    own_observed_five_class_counts:
      "1^4": 37436
      "2+2": 107952
      "2+1+1": 6708
      "4": 0
      "3+1": 0
      total: 152096
      anomalies_recorded_within_the_above_counts: {non_squarefree: 13352, deg_lt_4: 1496}
      anomalies_note: >-
        These are ramified/degenerate fibres, already counted inside the
        class tallies above (37436+107952+6708 = 152096 exactly, no double
        counting or omission). Per H-MONO-fa4cb9's own mechanism, this
        ramification IS the mu_T fixed-point mechanism the D-term is
        modeling, not an error to exclude.
    own_D_lin_D_quad:
      formula_used_lin: "D_lin = h_+*n_- + h_-*n_+ (re-checked verbatim against IDEA-20260904-4f614a's own (D3) block)"
      formula_used_quad: "D_quad = h_+*n_- + (h_-)**2*n_+ (re-checked verbatim against H-MONO-fa4cb9's own mechanism/statement fields)"
      D_lin: 156
      D_quad: 468
    own_predictions:
      predicted_lin: {"1^4": 37436, "2+1+1": 6708, "2+2": 107952}
      predicted_quad: {"1^4": 37748, "2+1+1": 5772, "2+2": 108576}
    own_residuals:
      R1_lin: 0
      R2_lin: 0
      R3_lin_2plus2_bonus: 0
      R1_quad: -312
      R2_quad: 936
      R3_quad_2plus2_bonus: -624
    verdict: >-
      HOLDS. Own independent reclassification (own driver, own n_+/n_-/h_+/
      h_- recomputation, own D_lin/D_quad formula re-derivation from the
      idea/hypothesis records themselves) reproduces R1_lin = R2_lin = 0
      exactly and R1_quad = -312, R2_quad = 936 exactly, on the full
      exhaustive 152,096-point stratum, matching C(98,3) exactly. The linear
      form is reproduced exactly; the named quadratic rival is decisively
      excluded, independently.

