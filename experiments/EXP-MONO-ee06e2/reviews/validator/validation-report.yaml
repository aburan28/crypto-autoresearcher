  # ==================================================================
  # J1 -- INDEPENDENT CURVE AND TWIST CONSTRUCTION AUDIT
  # ==================================================================
  j1_curve_and_twist_audit:
    method: >-
      Standalone Python (j1_curve_twist_audit.py), written from scratch for
      this review: own trial-division primality check, own brute-force
      quadratic-residue table (built from {x*x mod p : x in F_p}, cross-
      checked to have exactly (p-1)/2 residues and (p-1)/2 non-residues),
      own brute-force root finder for f(X)=X^3+X+33, own short-Weierstrass
      point-enumeration (full (x,y) scan, not a square-root shortcut), own
      point-addition/doubling group law, own repeated-doubling scalar
      multiplication, own order-4-torsion counter (scalar_mult(4,P)==O), and
      a Lagrange-style group-law sanity check (20 random sampled points times
      the brute-force-counted order return O, for both E and its twist).
      Imports NOTHING from RC.pt_add, RC.curve_order, or any file under
      experiments/EXP-MONO-0e6e8f or experiments/EXP-MONO-815525.
    results:
      p: 101
      A_B: [1, 33]
      f_roots: [4, 45, 52]
      Z: 3
      order_E_bruteforce: 108
      d_nonresidue: 2
      A_twist_recomputed: 4
      B_twist_recomputed: 62
      order_Etwist_bruteforce: 96
      twist_sanity_2p_plus_2_minus_E: 96
      E4: 4
      Etwist4: 16
      tau: 4
      h_plus: 0
      h_minus: 3
      n_plus: 52
      n_minus: 46
    confirmation_table:
      - {claim: "f(X)=X^3+X+33 has exactly 3 distinct roots mod 101", predicted: 3, own_result: 3, match: true}
      - {claim: "#E(F_101) = 108", predicted: 108, own_result: 108, match: true}
      - {claim: "d=2 is a quadratic non-residue mod 101", predicted: true, own_result: true, match: true}
      - {claim: "A_twist = A*d^2 mod 101 = 4", predicted: 4, own_result: 4, match: true}
      - {claim: "B_twist = B*d^3 mod 101 (264 mod 101 = 62)", predicted: 62, own_result: 62, match: true}
      - {claim: "#E^d(F_101) = 96", predicted: 96, own_result: 96, match: true}
      - {claim: "2p+2-#E == #E^d", predicted: true, own_result: true, match: true}
      - {claim: "#E(F_101)[4] = 4", predicted: 4, own_result: 4, match: true}
      - {claim: "#E^d(F_101)[4] = 16", predicted: 16, own_result: 16, match: true}
      - {claim: "tau = Z+1 = 4", predicted: 4, own_result: 4, match: true}
      - {claim: "h_+ = (4-4)/4 = 0", predicted: 0, own_result: 0, match: true}
      - {claim: "h_- = (16-4)/4 = 3", predicted: 3, own_result: 3, match: true}
      - {claim: "n_+ = 52", predicted: 52, own_result: 52, match: true}
      - {claim: "n_- = 46", predicted: 46, own_result: 46, match: true}
    verdict: "HOLDS. All fourteen independently-checked facts confirmed exactly, using group-law, torsion-counting, and quadratic-residue code sharing no line with RC/UC or with any prior experiment's implementation."

