# =============================================================================
# EXP-BINSTD-ff5050 -- VERSION 1 (APPROVED by DEC-20261003-953dd5) successor
# of EXP-BINSTD-cb15a4 for H-BINSTD-ce918e after EV-BINSTD-375f15 /
# DEC-20261003-c14256 (decision: replicate). One frozen contract admitting:
#   Stage 0  — re-freeze pin/(α,M₀) + new catalog_seed + process-isolated probe
#   Stage 1R — independent n=17 replication (new seed; process-isolated RSS)
#   Stage 2  — multi-n n∈{19,23,29,31} + random-Boolean matched-N_var null
# No v1 re-run. No AUXIN. No Bedrock. No break / exponent / n≥131 transfer.
# =============================================================================
experiment:
  id: EXP-BINSTD-ff5050
  hypothesis_id: H-BINSTD-ce918e
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-20561e
  goal_id: GOAL-ECDLP2M-001
  successor_of: EXP-BINSTD-cb15a4
  cites_evidence: EV-BINSTD-375f15
  cites_decision: DEC-20261003-c14256
  version: 1
  title: >-
    Independent Stage-1R peak-RSS replication (process-isolated) + Stage-2
    multi-n + random-Boolean null for H-BINSTD-ce918e
  status: approved
  approved_by: DEC-20261003-953dd5
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1, 2]
  execution_authorized_note: >-
    Stages 0, 1R, and 2 authorized by DEC-20261003-953dd5 under AGENTS.md
    standing user authorization (2026-09-06), discharging NA-1 of
    DEC-20261003-c14256 / EV-BINSTD-375f15. No Magma/Sage/AUXIN/Bedrock.
    No ECC2K-130 solve. No n>=131 attack. No re-run of frozen v1 package
    EXP-BINSTD-cb15a4 / trial-plan-v1.json.
  approval:
    approved_by: DEC-20261003-953dd5
    composing_decision: DEC-20261003-953dd5
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete. Approval does not assert the hypothesis is
      true. Stages 0/1R/2 authorized. Cites EV-BINSTD-375f15.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stage 0 freezes inherited (α,M₀)=(1.0,16777216), XOR-SAT pin, new
      catalog_seed=2026100375050, process-isolated RSS probe. Stage 1R
      re-measures n=17 ℓ∈{3,4} under process-isolated getrusage. Stage 2
      measures n∈{19,23,29,31} ℓ∈{3,4} plus matched random-Boolean null.
      No Magma/Sage/AUXIN/Bedrock. No ECDLP solve. No v1 re-run.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Independently replicate the Stage-1 O-SUPPORT band at n=17 under a new
    seed and process-isolated RSS, then separate OS RSS floor from the
    ℓ-channel via Stage-2 multi-n + random-Boolean null — before any
    support / KN-FIND reading of H-BINSTD-ce918e.

  class: heuristic_validation
  class_note: >-
    Replication + null-control package for a memory instrument. Not an
    exponent-moving breakthrough; no ECDLP attack table.

  scope:
    included:
      - >-
        Stage 0. Freeze V family for Stage-1R and Stage-2 cells; inherit
        (α,M₀) and XOR-SAT pin from EXP-BINSTD-cb15a4 / EV-BINSTD-375f15;
        new catalog_seed; process-isolated RSS probe twin check.
      - >-
        Stage 1R. For (n,ℓ)∈{(17,3),(17,4)} measure process-isolated
        peak_rss of encode+solve; write stage1r/panels.json,
        stage1r/control-table.json, RESULTS-stage1r.md with exactly one O-*.
      - >-
        Stage 2. For n∈{19,23,29,31}, ℓ∈{3,4}: real panels + matched
        random-Boolean null; write stage2/ and RESULTS.md with floor
        separation diagnostics.
    excluded:
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Re-running EXP-BINSTD-cb15a4 trial-plan-v1.json / v1 run_ids.
      - Editing IDEA-20261001-20561e claim text or GOAL-ECDLP2M-001.yaml.
      - Editing (α,M₀) after Stage-0 freeze.
      - Treating infra failure as mathematical evidence.
      - Promoting support / KN-FIND before Stage-1R replication completes.

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-ff5050/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-ff5050/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-ff5050/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1r: >-
      python3 experiments/EXP-BINSTD-ff5050/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-ff5050/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage2: >-
      python3 experiments/EXP-BINSTD-ff5050/implementation/run.py --stage 2
      --trial-plan experiments/EXP-BINSTD-ff5050/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface for /run via tools/experiment_execution.py
      load_plan. Stage-1R and Stage-2 measure RSS in a fresh subprocess
      (process-isolated getrusage). {run_dir} substituted by supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20261001-20561e.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-ce918e.yaml
    parent_experiment: experiments/EXP-BINSTD-cb15a4/specification.yaml
    parent_evidence: ledger/evidence/EV-BINSTD-375f15.yaml
    parent_decision: ledger/decisions/DEC-20261003-c14256.yaml
    alpha: 1.0
    M0_bytes: 16777216
    catalog_seed: 2026100375050
    parent_catalog_seed: 202610032056
    stage1r_cells:
      - {n: 17, ell: 3}
      - {n: 17, ell: 4}
    stage2_cells:
      - {n: 19, ell: 3}
      - {n: 19, ell: 4}
      - {n: 23, ell: 3}
      - {n: 23, ell: 4}
      - {n: 29, ell: 3}
      - {n: 29, ell: 4}
      - {n: 31, ell: 3}
      - {n: 31, ell: 4}

  controls:
    - name: twin_Nvar
      definition: encode_s3 N_var path A == path B on every measured V.
    - name: ctl_fixed_dim_V
      definition: Every measured V has exactly ℓ basis elements (dim ℓ).
    - name: ctl_frozen_V_family
      definition: Catalog frozen in stage0/v-catalog.json before Stage 1R/2.
    - name: ctl_shared_xorsat_pin
      definition: Encoder pin inherited from EXP-BINSTD-cb15a4 and re-frozen.
    - name: ctl_frozen_alpha_M0_before_runs
      definition: (α,M₀)=(1.0, 16777216) inherited and re-frozen before Stage 1R.
    - name: ctl_no_posthoc_band_edit
      definition: Band constants not edited after Stage-0 freeze.
    - name: ctl_process_isolated_rss
      definition: >-
        Stage-1R/2 peak_rss measured in a fresh subprocess (child
        RUSAGE_SELF), not the parent process envelope.
    - name: ctl_new_catalog_seed
      definition: catalog_seed ≠ parent 202610032056.
    - name: null_random_boolean_matched_Nvar
      definition: >-
        Stage 2: for each real cell, a random Boolean linear system with the
        same (nv, neq) measured under the same process-isolated RSS probe.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1R_replication_n17, 2_multi_n_null]
    - name: cell
      levels:
        - '(17,3)'
        - '(17,4)'
        - '(19,3)'
        - '(19,4)'
        - '(23,3)'
        - '(23,4)'
        - '(29,3)'
        - '(29,4)'
        - '(31,3)'
        - '(31,4)'
    - name: panel_kind
      levels: [real_encode_solve, null_random_boolean]

  metrics:
    primary:
      - name: peak_rss_bytes
        unit: bytes
        definition: >-
          Child-process peak RSS via resource.getrusage(RUSAGE_SELF).ru_maxrss
          * 1024 around encode+solve (or null solve).
      - name: band_holds
        unit: boolean
        definition: peak_rss_bytes ≤ M0_bytes · 2^(alpha · ell).
      - name: twin_agreement
        unit: boolean
        definition: Twin N_var meters agree on every measured V.
      - name: floor_dominant
        unit: boolean
        definition: >-
          Stage-2 diagnostic: real RSS nearly constant across n and ℓ
          (spread < 5%), suggesting OS RSS floor rather than ℓ-channel.
      - name: null_n_insensitive
        unit: boolean
        definition: >-
          Stage-2 diagnostic: null RSS spread across n < 5% (expected by
          construction for matched-N_var random Boolean).
    secondary:
      - name: N_var
        unit: integer
      - name: lin_rank_solve
        unit: integer
      - name: wall_clock_seconds
        unit: seconds
      - name: real_n_spread
        unit: ratio
      - name: null_n_spread
        unit: ratio

  heuristic_under_test: HEUR-BINSTD-20561e-H1

  preregistered_prediction:
    quantity: >-
      Process-isolated peak_rss(encode+solve) ≤ M₀·2^{α·ℓ} on Stage-1R cells
      after twin agreement, with (α,M₀)=(1.0, 16777216) and new catalog_seed;
      Stage-2 extends the same band to n∈{19,23,29,31} and records floor vs
      ℓ-channel separation via matched random-Boolean null.
    formula: >-
      band_bytes(ell) = 16777216 * 2**(1.0 * ell); peak_rss from child
      process resource.getrusage(RUSAGE_SELF).ru_maxrss * 1024.
    source: >-
      EV-BINSTD-375f15 / DEC-20261003-c14256 NA-1; IDEA-20261001-20561e
      Stage-2 plan; frozen before Stage 1R in stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Memory instrument on n≤31 only under this card. No transfer of a RSS
      band into an n≥131 attack is claimed.
    correspondence: null

  tail_checks:
    - Twin disagreement voids band claims (O-ARTIFACT).
    - RSS probe unavailable → O-IMPEDIMENT / O-INCONCLUSIVE (not O-SUPPORT).
    - floor_dominant=true blocks upgrading Stage-1R O-SUPPORT to support/KN-FIND
      without further isolation work (diagnostic, not a band falsifier).

  seeds_and_replication:
    catalog_seed: 2026100375050
    parent_catalog_seed: 202610032056
    independent_instances: 2
    note: >-
      Stage-1R cells (17,3)/(17,4) are the independent replication of
      EV-BINSTD-375f15 under a new seed and process-isolated RSS. Twin meters
      remain the per-V replication instrument. Stage-2 adds multi-n + null.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 8.0
    maximum_memory_gb: 2
    maximum_runs: 6
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and v-catalog.json.
    - Stage 1R complete with stage1r panels/control-table/RESULTS-stage1r.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - Stage 2 complete with stage2 panels/control-table/RESULTS.md, OR named stop.
    - RESULTS-stage1r.md / RESULTS.md each name exactly one O-* label.
    - maximum_runs = 6.
    - Do not re-run EXP-BINSTD-cb15a4 v1 package.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin failure → O-ARTIFACT; do not read band as support.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an n≥131 exponent move → protocol invalid.
    - Reusing parent catalog_seed 202610032056 as the replication seed → protocol invalid.
    - Measuring Stage-1R/2 RSS only in the parent process (no subprocess) → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with twin_ok and rss_probe_ok true on the
    process-isolated probe; Stage 1R produces process-isolated peak_rss vs
    band for each Stage-1R cell with twin agreement (or a named
    O-ARTIFACT/O-IMPEDIMENT/O-INCONCLUSIVE stop); Stage 2 produces multi-n
    real panels plus matched random-Boolean null with floor-separation
    diagnostics; RESULTS files name exactly one O-* label per completed stage
    package.

  falsification_criterion: >-
    Any of: twin disagreement; post-hoc (α,M₀) edit; reused v1 catalog_seed;
    non-isolated Stage-1R RSS; a claimed break/exponent under this card.
    (O-FAIL-BAND is a valid scientific negative of O-SUPPORT, not a protocol
    fail. floor_dominant is a diagnostic, not by itself O-FAIL-BAND.)

  required_artifacts:
    - experiments/EXP-BINSTD-ff5050/trial-plan-v1.json
    - experiments/EXP-BINSTD-ff5050/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-ff5050/stage0/v-catalog.json
    - experiments/EXP-BINSTD-ff5050/stage1r/
    - experiments/EXP-BINSTD-ff5050/stage2/
    - experiments/EXP-BINSTD-ff5050/RESULTS-stage1r.md
    - experiments/EXP-BINSTD-ff5050/RESULTS.md
    - experiments/EXP-BINSTD-ff5050/runs/<RUN-BINSTD-*>/
    - experiments/EXP-BINSTD-ff5050/implementation/run.py
    - experiments/EXP-BINSTD-ff5050/implementation/check.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
