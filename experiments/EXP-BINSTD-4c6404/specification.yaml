# toys (Stages 0-2). Source IDEA-20261002-79a077 under RQ-BINSTD-b6f698 /
# GOAL-ECDLP2M-001.
#
# ZERO RUNS in this design packet. Stages 0-2 authorized for executor
# TASK-20261003-b17785. No AUXIN. Amazon Bedrock prohibited. NO break.
# NO attack. NO exponent. Distinct from 7def74 / 9ff676 / 9d8520.
# Runnable command surface declared below. Dual Python GF(2) solvers.
# =============================================================================
experiment:
  id: EXP-BINSTD-4c6404
  hypothesis_id: H-BINSTD-dcc004
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261002-79a077
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Krylov/Wiedemann vs dense GE: frozen τ=1.0 median wall-time band at
    n∈{17,23,31}, s∈{1.5,2.0}
  status: approved
  approved_by: DEC-20261003-3ff445
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  packaging_only: false
  execution_authorized_stages: [0, 1, 2]
  execution_authorized_note: >-
    Stages 0-2 authorized by DEC-20261003-3ff445 under AGENTS.md standing
    user authorization (2026-09-06). Stage 0 freeze; Stage 1 n=17 IC-like
    races; Stage 2 n∈{23,31} + Bernoulli-null. Both solver arms are
    pure-Python in gf2la.py. No Magma/Sage/AUXIN/Bedrock. No ECC2K-130
    solve. No n>=131 attack.
  approval:
    approved_by: DEC-20261003-3ff445
    composing_decision: DEC-20261003-3ff445
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-2 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stage 0 freezes r(n), surplus, τ=1.0, N_rep=7, seeds, weight 5,
      combinadic twins, Python dual-solver probe. Stage 1 n=17 races.
      Stage 2 n∈{23,31} + null. Dual median aggregators. No Magma/Sage/AUXIN/Bedrock.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide HEUR-BINSTD-79a077-H1 at toys: whether median wall_Wiedemann ≤
    median wall_dense (τ=1.0) on frozen sparse GF(2) squares, or fail the
    band, or stop as O-ARTIFACT/O-INCONCLUSIVE/O-IMPEDIMENT; deliver exactly
    one O-* label from H-BINSTD-dcc004.

  class: heuristic_validation
  class_note: >-
    Pre-registered τ=1.0 LA-solver band. Not an exponent-moving breakthrough;
    no ECDLP attack table. Cost numbers are measured wall times of the Python
    arms, not modeled sparse-LA asymptotics.

  scope:
    included:
      - >-
        Stage 0. Freeze r(17)=32, r(23)=48, r(31)=64, surplus {1.5,2.0},
        catalog_seed 2026100307, pin_seed 2026100308, null_seed 2026100309,
        τ=1.0, N_rep=7, odd row-weight 5, combinadic twins, Python solver probe.
      - >-
        Stage 1. n=17, s∈{1.5,2.0}; IC-like XOR-folded squares; dual clocks
        and dual medians; Ax=b self-check; write RESULTS.md with exactly one
        O-* label.
      - >-
        Stage 2. n∈{23,31} IC-like + Bernoulli-null of matched shape/weight
        with predicted ratio interval [0.25, 4.0]. Writes stage2/*. Does not
        overwrite Stage-1 RESULTS.md.
    excluded:
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Editing IDEA-20261002-79a077 claim text or GOAL-ECDLP2M-001.yaml.
      - Editing the τ=1.0 band after Stage-0 freeze.
      - Treating infra timeout as evidence against HEUR-BINSTD-79a077-H1.
      - Equating this meter with nnz fill-in (7def74).

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-4c6404/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-4c6404/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-4c6404/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-4c6404/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-4c6404/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage2: >-
      python3 experiments/EXP-BINSTD-4c6404/implementation/run.py --stage 2
      --trial-plan experiments/EXP-BINSTD-4c6404/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. Dual median aggregators and
      combinadic twins are the dual-implementation control. {run_dir}
      substituted by supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20261002-79a077.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-dcc004.yaml
    tau: 1.0
    catalog_seed: 2026100307
    pin_seed: 2026100308
    null_seed: 2026100309
    n_rep: 7
    row_weight: 5
    surplus: [1.5, 2.0]
    r_n: {17: 32, 23: 48, 31: 64}
    null_ratio_interval: [0.25, 4.0]
    solvers:
      wiedemann: experiments/EXP-BINSTD-4c6404/implementation/gf2la.py
      dense_ge: experiments/EXP-BINSTD-4c6404/implementation/gf2la.py
    magma_sage_auxin: forbidden
    stage1_cells:
      - {n: 17, surplus: 1.5}
      - {n: 17, surplus: 2.0}
    stage2_cells:
      - {n: 23, surplus: 1.5}
      - {n: 23, surplus: 2.0}
      - {n: 31, surplus: 1.5}
      - {n: 31, surplus: 2.0}

  controls:
    - name: ctl_frozen_tau
      definition: τ=1.0 frozen in stage0/preregistered-predictions.json before any timing.
    - name: ctl_frozen_surplus_schedule
      definition: Surplus levels {1.5, 2.0} frozen; not edited after Stage 0.
    - name: ctl_same_matrix_bytes_both_solvers
      definition: matrix_sha256 identical for both timed arms of a race.
    - name: null_random_sparse_matched_shape
      definition: >-
        Stage 2 Bernoulli generator with mean weight 5 and the same r(n),
        surplus fold; predicted ratio interval [0.25, 4.0].
    - name: ctl_no_posthoc_tau_edit
      definition: τ=1.0 is not edited after freeze.
    - name: ctl_no_midtick_lib_provision
      definition: Do not install Magma/Sage/AUXIN/Bedrock this tick.
    - name: twin_median_aggregators
      definition: median_sort and median_insert must agree before any band verdict.
    - name: twin_combinadic_catalog
      definition: Two independent colex combinadic ranks of {17,23,31} must agree.
    - name: ctl_ax_equals_b
      definition: Every scored race has matvec(A,x)=b for both solvers.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_n17_ic_races, 2_n23_n31_plus_null]
    - name: cell
      levels: ['(17,1.5)', '(17,2.0)', '(23,1.5)', '(23,2.0)', '(31,1.5)', '(31,2.0)']
    - name: arm
      levels: [krylov_wiedemann, dense_ge, bernoulli_null]

  metrics:
    primary:
      - name: wiedemann_over_dense_median_wall_ratio
        unit: dimensionless
        definition: median t_Wiedemann / median t_dense; band τ=1.0.
      - name: n_success
        unit: count
        definition: Full-rank Ax=b races scored per (n,s) cell; ≥5 required.
      - name: dual_median_agreement
        unit: boolean
        definition: median_sort == median_insert on each scored arm.
    secondary:
      - name: null_median_ratio
        unit: dimensionless
        definition: Stage-2 Bernoulli matched-shape ratio; interval [0.25, 4.0].
      - name: matrix_nnz
        unit: count
        definition: Number of ones in the square race matrix.

  heuristic_under_test: HEUR-BINSTD-79a077-H1
  preregistered_prediction:
    quantity: median(wall_Wiedemann) / median(wall_dense)
    formula: R ≤ τ with τ = 1.0
    source: >-
      IDEA-20261002-79a077 HEUR-BINSTD-79a077-H1 (copied; τ frozen here as
      1.0 meaning "Wiedemann median wall ≤ dense GE median wall"). KR-IC-ae532f
      / KR-IC-1fcdbc retrieved via frontier map. Written in
      stage0/preregistered-predictions.json BEFORE any run. Never edited after
      freeze.

  scale_relevance:
    tier: toy
    justification: >-
      LA-solver instrument on r≤64 Python GF(2) squares labelled by toy
      Koblitz n∈{17,23,31}. No transfer of a τ band into an n≥131 attack
      is claimed. Measured times include CPython overhead.
    correspondence: null

  tail_checks:
    - Dual-median disagreement voids band claims (O-ARTIFACT).
    - <5 completed races on a required cell → O-INCONCLUSIVE (not O-SUPPORT).
    - Stage-2 null ratio outside [0.25, 4.0] → O-NULL-FAIL.
    - Ax≠b discards that race; too many discards → O-INCONCLUSIVE.

  replication:
    seeds: [2026100307, 2026100308, 2026100309]
    independent_instances: 6
    replication_note: >-
      Six (n,s) cells plus Bernoulli-null copies at n∈{23,31}. Dual median
      aggregators plus combinadic twins are the replication instrument.

  seeds_and_replication:
    catalog_seed: 2026100307
    pin_seed: 2026100308
    null_seed: 2026100309
    independent_instances: 6
    n_rep: 7

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 36000
    total_cpu_hours: 8.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json, v-catalog.json, target-catalog.json, launcher-probe.json.
    - Stage 1 complete with timings/control-table/RESULTS.md.
    - Stage 2 complete with stage2/timings.json, null-control.json, stage2/RESULTS.md (does not overwrite Stage-1 RESULTS.md).
    - RESULTS.md names exactly one O-* label from H-BINSTD-dcc004.
    - maximum_runs = 4.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Dual-median or combinadic failure → O-ARTIFACT; do not read the band as support.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an n≥131 exponent move → protocol invalid.
    - Equating this meter with IDEA-20261002-7def74 → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with combinadic agreement and τ=1.0 marked
    written_before_any_scientific_timing; Stages 1–2 produce dual-median
    timings deciding the τ=1.0 band plus a Stage-2 null reading, or a named
    O-ARTIFACT/O-INCONCLUSIVE/O-IMPEDIMENT/O-NULL-FAIL/O-FAIL-BAND stop;
    RESULTS.md names exactly one O-* label from H-BINSTD-dcc004 with cited
    artifacts.

  falsification_criterion: >-
    ≥5 successful races per required cell, dual medians agree, and
    median wall_Wiedemann > median wall_dense on a completed IC-like cell
    (O-FAIL-BAND). Infra failure does not falsify the heuristic.

  required_artifacts:
    - experiments/EXP-BINSTD-4c6404/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-4c6404/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-4c6404/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-4c6404/stage0/v-catalog.json
    - experiments/EXP-BINSTD-4c6404/stage0/target-catalog.json
    - experiments/EXP-BINSTD-4c6404/stage0/launcher-probe.json
    - experiments/EXP-BINSTD-4c6404/stage1/timings.json
    - experiments/EXP-BINSTD-4c6404/RESULTS.md

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
