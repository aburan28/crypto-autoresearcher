experiment:
  id: EXP-ECDLP-72a191
  hypothesis_id: H-ECDLP-24d15c
  question_id: RQ-ECDLP-165d4b
  version: 1
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    A detection floor for the census - the exact operating characteristic of the
    pre-registered eight-pair sign rule, the one correlation its power depends
    on, a swept planted dial with a no-effect null at the threshold, a
    shuffled-pair control that must collapse the correlation, and a curve-free
    cyclic-group arm whose expected success is the scope gate

  objective: >-
    If separately approved, authorized and executed, compute the exact operating
    characteristic of the decision rule pre-registered in H-ECDLP-e42bda, measure
    the single free parameter that rule's power depends on, and emit a reusable
    minimum-detectable-effect table so that every present and future null cell of
    this census reports a FLOOR alongside its verdict. A cell whose measured
    effect is smaller than its own floor is recorded as UNRESOLVED, never as
    NEGATIVE.

  what_this_is_not:
    - Not a statement about any curve family's genericity, about the automorphism mechanism, or about the ECDLP. It is an audit of a decision rule.
    - Not a status change to H-ECDLP-e42bda or to any recorded census cell.
    - Not a re-run of the census. No candidate-family outcome is observed and no held-out group is touched.
    - Not a claim that the pre-registered design is wrong; that the correlation falls below the required value is a PREDICTION, and the opposite would be a genuine reusable positive fact.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling: >-
    Tier TOY, unraisable by any downstream citation. The exact scope a completed
    run could support is - the pre-registered eight-pair sign-permutation rule at
    its declared threshold has a stated power function under the stated null
    model, and the measured paired correlation at the tested bit sizes is a
    stated value with a stated interval. It can NEVER certify that a curve family
    is generic, that no non-generic mechanism exists, or that a larger pair count
    would find one.

  falsifiable_prediction: >-
    PRE-REGISTERED BEFORE EXECUTION AND NEVER TUNED TO THE DATA.
    (1) The exact two-sided sign-permutation p-value at eight pairs is 2/256 =
    0.0078125 for zero minority signs and 18/256 = 0.0703125 for one, so at a
    threshold of 0.025 nothing weaker than ALL EIGHT PAIRS CONCORDANT can reach
    significance. Zero compute, checkable by hand.
    (2) The empirical standard deviation of log charged work per single arm lies
    within 20 percent of the derived value of about 0.6413.
    (3) The measured paired correlation's UPPER interval bound falls below the
    value the pre-registered effect requires at the target power (UNDERPOWERED),
    or its LOWER bound reaches it (ADEQUATELY POWERED, refuting this record).
    (4) The shuffled-pair control drops the measured correlation to approximately
    0.
    (5) The no-effect dial detects at the declared threshold within Monte Carlo
    error, and the planted sweep's detection rate is monotone non-decreasing and
    agrees with the closed form at the measured correlation.
    (6) At least 3 of 4 low dial settings share the not-detected verdict in at
    least 80 percent of replications, establishing the observation collision.

  measured_quantities:
    - name: signperm_pvalue_table
      definition: >-
        The exact two-sided sign-permutation p-value for every minority-sign
        count, at each tabulated pair count, computed by enumerating all sign
        assignments.
      units: dimensionless probability
    - name: sd_log_work
      definition: >-
        Empirical standard deviation of the natural log of charged work for a
        single walk arm, per bit size, with a bootstrap interval.
      units: nats (dimensionless)
    - name: rho_paired
      definition: >-
        Pearson correlation of log charged work between the two paired arms under
        a shared pair token, target scalar, partition seed and stopping rule, per
        bit size and pooled, with a bootstrap interval.
      units: dimensionless, in [-1, 1]
    - name: rho_shuffled
      definition: The same correlation with the shared pair token broken.
      units: dimensionless
    - name: detection_rate
      definition: >-
        Fraction of replications at which the lane's exact decision rule fires,
        per planted dial setting, with a binomial interval.
      units: dimensionless fraction
    - name: mde_table
      definition: >-
        Minimum detectable effect at 80 percent power, indexed by pair count,
        correlation and threshold, emitted machine-readable.
      units: dimensionless multiplicative ratio
    - name: verdict_collision_set
      definition: >-
        The set of distinct planted dial settings that share the not-detected
        verdict at the declared replication rate.
      units: set of dial settings (categorical)
    - name: fixed_overhead_per_arm
      definition: >-
        Per-arm fixed cost - setup, certificate replay, canonicalisation -
        reported separately, with the correlation recomputed WITH and WITHOUT it.
      units: charged operations (integer)
    - name: shared_walk_fraction
      definition: >-
        The fraction of each paired walk that is deterministically shared between
        the two arms.
      units: dimensionless fraction in [0, 1]

  metrics:
    primary: [rho_paired, sd_log_work, detection_rate, signperm_pvalue_table, mde_table]
    secondary: [rho_shuffled, verdict_collision_set, fixed_overhead_per_arm, shared_walk_fraction]

  null_and_control_objects:
    - id: NULL-DIAL-ZERO
      name: no-effect dial
      construction: >-
        An identically charged canonicalisation on a fake orbit structure of size
        1, delivering no discount and no mathematics, over at least 200
        replications.
      forced_value: >-
        Detection rate equal to the declared threshold within Monte Carlo error.
      non_vacuity: >-
        Capable of failing upward, and its failure is decisive - a materially
        higher rate means the rule is ANTI-CONSERVATIVE, every past p-value in
        this lane is suspect, and every number including this contract's own is
        suspended pending repair.
    - id: PLANT-DIAL-SWEEP
      name: swept planted discount dial
      construction: >-
        A synthetic, fully charged canonicalisation on a fake orbit structure of
        declared size, delivering a KNOWN expected discount and no mathematics,
        swept over at least 6 settings from no effect through the largest
        discount the lane's own mechanism can produce, at least 200 replications
        per setting. A PEEK-CHECK verifies the dial cannot access the target
        scalar or the underlying orbit.
      forced_value: >-
        Detection rate monotone non-decreasing across the sweep, agreeing with
        the closed-form power at the measured correlation within binomial error
        at every setting.
      non_vacuity: >-
        THIS IS THE DEMONSTRATED-DYNAMIC-RANGE CONTROL and it produces the
        instrument's power CURVE directly. A dial that fires only at the largest
        setting has established nothing about the rule's behaviour at the effect
        sizes the census actually cares about.
      disagreement_disposition: >-
        Agreement validates the closed form for reuse. DISAGREEMENT means the
        closed form is the wrong model and the EMPIRICAL curve is the
        deliverable instead - which is a successful outcome of this contract, not
        a failure of it.
    - id: NULL-SHUFFLED-PAIR
      name: shuffled-pair coupling control
      construction: >-
        The shared pair token broken so the two arms use independent seeds, the
        correlation re-estimated on otherwise identical measurements.
      forced_value: correlation falling to approximately 0
      non_vacuity: >-
        Gives the correlation estimator a demonstrated dynamic range from near 0
        to whatever the coupled value is. A shuffled correlation that stays high
        means the two arms share a deterministic prefix of the walk and the
        coupled number is MANUFACTURED BY CONSTRUCTION rather than measured -
        which is the easiest way for this whole measurement to be worthless while
        looking clean.
    - id: CONTROL-NEARBY-POWERED
      name: nearby adequately-powered design
      construction: >-
        The same power machinery applied to a single-arm design already believed
        adequate, with many seeds and a tight interval, whose parameters are
        resolved from a committed evidence record at S0.
      forced_value: >-
        The method must report that design as ADEQUATELY POWERED and the
        eight-pair sign rule as not.
      non_vacuity: >-
        A method that condemns BOTH has not identified the load-bearing
        structure - which is the DISCRETENESS of the sign statistic, not sample
        size as such - and its verdict on the eight-pair rule is uninformative.
    - id: NULL-CURVEFREE
      name: curve-free cyclic-group arm
      construction: >-
        The identical correlation and dispersion measurement on a curve-free
        cyclic group of the same order, with a matched-cost random-mapping walk
        and the identical pairing convention, containing no elliptic curve
        anywhere.
      forced_value: none - the arm is the scope gate
      non_vacuity: >-
        It produces its own correlation and dispersion with intervals and can
        agree with or differ from the curve arm.
      consequence_pre_declared: >-
        THIS ARM IS EXPECTED TO REPRODUCE THE SIGNATURE AND THE CONSEQUENCE IS
        WRITTEN DOWN IN ADVANCE FOR EXACTLY THAT REASON. IF THE CURVE-FREE GROUP
        REPRODUCES THE MEASURED CORRELATION AND THE LOG-WORK DISPERSION WITHIN
        THEIR INTERVALS, THE DETECTION-FLOOR RESULT IS A STATEMENT ABOUT
        COLLISION-SEARCH WALK STATISTICS ON CYCLIC GROUPS AND NOTHING FROM IT MAY
        BE QUOTED AS A STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP. The floor
        remains fully usable by the census as an INSTRUMENT fact; it carries no
        curve content.

  scope_gate: >-
    See NULL-CURVEFREE consequence_pre_declared. The gate is evaluated and
    reported BEFORE the floor is published to the census, and its verdict is
    printed on the face of every quoted number and inside the emitted
    minimum-detectable-effect table itself.

  independent_variables: [bit_size, curve_index, seed, arm_variant, dial_setting, pair_token_mode, group_type]

  preregistered_prediction:
    quantity: rho_paired and the detection rate per dial setting
    formula: >-
      Under the stated null the squared collision time is asymptotically
      exponential, so the variance of the log collision time is one quarter of
      the trigamma function at 1, that is pi squared over 24, about 0.4112, with
      standard deviation about 0.6413. For a paired comparison the standard
      deviation of the log ratio is that times the square root of twice one minus
      the correlation, about 0.9070 times the square root of one minus the
      correlation. With delta the negative log of the true paired ratio, the
      per-pair correct-sign probability is the standard normal CDF at delta
      divided by that standard deviation, and the power at eight pairs is that
      probability to the eighth.
    source: >-
      ledger/hypotheses/H-ECDLP-24d15c.yaml predictions P1 through P8. The
      constants were re-derived by hand under TASK-20260904-c0edda and are
      reproduced here so a reviewer can check them without a source.
    values_frozen_here:
      pair_counts_tabulated: [4, 8, 12, 16, 24, 32]
      thresholds_tabulated: [0.05, 0.025]
      eight_pair_exact_pvalues: {zero_minority: 0.0078125, one_minority: 0.0703125}
      sd_log_work_derived: 0.6413
      sd_log_work_admissible_band: [0.513, 0.770]
      paired_factor: 0.9070
      target_power: 0.8
      bit_sizes: [12, 13, 14, 15, 16]
      curves: 40
      seeds_per_curve: 40
      dial_settings: at least 6, spanning no effect through the largest mechanism-attainable discount
      replications_per_dial: 200
      collision_threshold: at least 3 of 4 low settings sharing a verdict at 80 percent

  decision_rule_that_falsifies: >-
    THE RECORD IS FALSIFIED, and its central claim rejected in scope, IF the
    measured correlation's LOWER interval bound reaches or exceeds the value the
    pre-registered effect requires at the target power, with every control
    passing. The pre-registered design is then adequately powered for its stated
    effect, and the positive fact - near-perfect seed coupling of paired quotient
    walks - is the deliverable instead.
    THE RECORD IS SUPPORTED IN SCOPE IF the correlation's UPPER bound falls below
    that value with every control passing. The comparison is made against an
    INTERVAL BOUND, never against the point estimate.
    THE CLOSED FORM IS DISCARDED, and the empirical power curve becomes the sole
    deliverable, if the measured log-work dispersion falls outside its frozen
    band or if the planted sweep disagrees with the closed form.
    THE RUN IS INVALID, and no verdict of any kind may be reported, if the exact
    p-value table does not reproduce its frozen values, if the no-effect dial
    detects materially above the threshold, if the shuffled-pair control does not
    collapse the correlation, or if the planted sweep is non-monotone.

  stages:
    - id: SA
      name: symbolic, zero compute
      terminates_run: true
      description: >-
        Enumerate all sign assignments and emit the exact p-value table at every
        tabulated pair count and threshold, asserting the two eight-pair values
        to the last digit. Compose with the null-model log-variance to emit the
        minimum-detectable-effect grid and the inverse sizing formula. THIS STAGE
        ALONE SETTLES THE ARITHMETIC CLAIM AND COSTS NO COMPUTE. A mismatch ENDS
        the run - the arithmetic claim is wrong and the record is withdrawn and
        superseded.
    - id: SB
      name: nearby-powered control and rule-text confirmation
      terminates_run: true
      description: >-
        Confirm the decision rule against the FROZEN contract text, not against
        prose about it; if a frozen contract differs from the hypothesis record's
        wording, the audit is re-run against the frozen text and every number
        changes. Resolve the nearby adequately-powered design's parameters from a
        committed evidence record and score it. A method that condemns both
        designs ENDS the run.
    - id: SC
      name: dispersion and coupling measurement
      terminates_run: true
      description: >-
        Measure the single-arm log-work dispersion and the paired correlation
        under the lane's own pairing convention, per bit size, with bootstrap
        intervals. Run NULL-SHUFFLED-PAIR. Report the shared-walk fraction and
        the per-arm fixed overhead, and recompute the correlation with and
        without the overhead. Dispersion outside its band DISCARDS the closed
        form; a shuffled correlation that does not collapse ENDS the run.
    - id: SD
      name: dial sweep
      terminates_run: true
      description: >-
        NULL-DIAL-ZERO and PLANT-DIAL-SWEEP with the peek-check. An
        anti-conservative no-effect rate or a non-monotone sweep ENDS the run.
    - id: SE
      name: curve-free arm
      terminates_run: false
      description: >-
        The identical dispersion and correlation measurement on the curve-free
        cyclic group. Its verdict is computed and the scope gate evaluated BEFORE
        the floor is published.
    - id: SF
      name: floor emission and verdict
      terminates_run: false
      description: >-
        Apply the frozen decision rule; emit the per-cell detection-floor schema
        field carrying pair count, measured correlation, threshold and minimum
        detectable effect at the target power, with the scope-gate verdict inside
        the emitted artifact itself.

  replication:
    seeds: [0, 1, 2, 3, 4]
    independent_instances: 40
    seeds_per_cell: 40
    seeds_policy: >-
      Every walk is addressed by (group_type, bit_size, curve_index, arm_variant,
      seed_index, dial_setting) and its seed is derived deterministically as a
      SHA-256 over the ASCII bytes of the domain string, those fields in that
      order, and the declared master seed, reduced to 64 bits. The domain string
      is EXP-ECDLP-72a191/v1. THE PAIRED ARMS AT A FIXED (group_type, bit_size,
      curve_index, seed_index) SHARE THE PAIR TOKEN, TARGET SCALAR, PARTITION
      SEED AND STOPPING RULE by construction - that shared token is the object
      whose effect is being measured, and NULL-SHUFFLED-PAIR is exactly the arm
      that breaks it, so the two modes must be addressable separately and both
      are recorded. THE SHARED-WALK FRACTION IS A REQUIRED REPORTED QUANTITY,
      because a correlation driven by a deterministic shared prefix is
      manufactured rather than measured. Group orders are exactly known by
      exhaustive point count at these sizes, so no estimation error enters. The
      master seed is fixed in the frozen contract before any execution and is
      never re-drawn.
    determinism_requirement: >-
      Re-running any tuple must reproduce the identical charged work. Any cell
      failing this is INVALID.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 20
    maximum_memory_gb: 8
    maximum_runs: 200
    maximum_workers: 1
    note: >-
      Sized to the work and deliberately small - the symbolic stage costs no
      compute at all and settles the arithmetic claim, and the measurement stage
      runs full walks only at 12 to 16 bits where they are cheap. The dial sweep
      dominates maximum_runs at 200 replications per setting.

  stopping_rules:
    - The exact p-value table does not reproduce its frozen values -> STOP, the arithmetic claim is wrong, the record is withdrawn and superseded.
    - The frozen contract's decision rule differs from the audited text -> STOP, re-run the audit against the frozen text; every number changes.
    - The method condemns the nearby adequately-powered design too -> STOP, the load-bearing structure has not been identified.
    - Measured dispersion outside its frozen band -> the closed form is DISCARDED and only the empirical power curve survives; the run continues under that reduced deliverable.
    - NULL-SHUFFLED-PAIR does not collapse the correlation -> STOP, the coupling is manufactured, not measured.
    - NULL-DIAL-ZERO detects materially above the threshold -> STOP, the rule is anti-conservative, every number in the lane including this contract's is suspended.
    - PLANT-DIAL-SWEEP non-monotone -> STOP, no demonstrated dynamic range.

  invalidation_rules:
    - Any correlation reported without the shared-walk fraction alongside it is invalid.
    - Any correlation reported without both the with-overhead and without-overhead values is invalid; a per-arm fixed overhead inflates the correlation by adding a common constant.
    - Any comparison of the correlation against the required threshold made on the point estimate rather than on an interval bound is invalid.
    - Any power number computed for a statistic other than the sign test actually pre-registered is invalid; a different statistic has different power and this audit says nothing about it.
    - Any detection floor emitted without the curve-free scope-gate verdict inside the artifact is invalid.
    - Any conversion of an UNRESOLVED cell into a NEGATIVE one on the strength of this floor is invalid on its face.
    - Any statement about a curve family's genericity, about the automorphism mechanism, or about the ECDLP drawn from this contract is invalid on its face.

  success_criterion: >-
    ALL of - (a) the exact p-value table emitted and matching its frozen values
    to the last digit; (b) the decision rule confirmed against the frozen
    contract text; (c) the nearby adequately-powered design scored as adequate;
    (d) dispersion and correlation measured per bit size with bootstrap
    intervals, the shared-walk fraction and per-arm overhead reported, and the
    correlation recomputed both ways; (e) NULL-SHUFFLED-PAIR collapsing the
    correlation; (f) NULL-DIAL-ZERO at the threshold and PLANT-DIAL-SWEEP
    monotone across at least 6 settings; (g) the verdict-collision set reported;
    (h) the curve-free arm completed and the scope gate evaluated; (i) the
    minimum-detectable-effect table emitted machine-readable with the scope-gate
    verdict inside it. Measuring a correlation that REFUTES this record is a
    SUCCESSFUL run; only failing (a) through (h) is unsuccessful.

  falsification_criterion: >-
    A measured paired correlation whose lower interval bound reaches the value
    the pre-registered effect requires at the target power, with every control
    passing. H-ECDLP-24d15c's central claim is then refuted and the positive fact
    is the deliverable. Secondary falsifiers of the DESIGN rather than the
    hypothesis - a wrong p-value table, a manufactured coupling, an
    anti-conservative rule, a non-monotone dial, a dispersion outside its band,
    no verdict collision, or a curve-free arm that reproduces the signature. In
    every case the failing control is named and forward guidance names the next
    object - including the open question of whether the coupling strengthens or
    weakens with bit size, which this contract does not answer.

  required_artifacts:
    - the exact sign-permutation p-value table at every tabulated pair count and threshold
    - the minimum-detectable-effect grid, machine-readable, with the scope-gate verdict inside it
    - the frozen-contract text the rule was confirmed against, quoted
    - the nearby adequately-powered design's parameters, their committed source, and its power score
    - the measured correlation with bootstrap resamples, per bit size and pooled, with and without per-arm overhead
    - the shuffled-pair correlation
    - the shared-walk fraction per arm pair
    - single-arm log-work dispersion per bit size against the derived value
    - detection rate per dial setting with binomial intervals, and the empirical power curve
    - the dial implementation's peek-check transcript
    - the verdict-collision set
    - the curve-free arm's full results and the scope-gate verdict
    - the per-cell detection_floor schema field as it would be attached to a census cell
    - exact commands, git commit, dirty-tree state, environment and dependency versions
    - stdout and stderr

  scale_relevance:
    tier: toy
    justification: >-
      12 to 16 bits, where group orders are exactly known by exhaustive point
      count so no estimation error enters. Whether the paired coupling
      strengthens or weakens with bit size is a TRANSFER ASSUMPTION and is not
      established here.
    correspondence: null

  limitations:
    - >-
      THIS CONTRACT MAKES NO STATEMENT ABOUT ANY CURVE FAMILY'S GENERICITY, about
      the automorphism mechanism, or about the ECDLP. It is an audit of a
      decision rule.
    - >-
      Scoped to the exact statistic pre-registered in H-ECDLP-e42bda. A different
      statistic has different power and is not covered.
    - >-
      The correlation is measured at 12 to 16 bits and the transfer to larger bit
      sizes is NOT established. It is recorded as unjustified rather than quietly
      assumed.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY RATHER THAN SILENTLY
      SHRUNK - the design's power at the bit sizes the census actually cares
      about cannot be measured here, because the correlation is measured only
      where full walks are cheap. The floor is reported at the sizes where it was
      measured.
    - >-
      A measured detection floor bounds Type II error under the stated null model
      only. IT DOES NOT CONVERT AN UNRESOLVED CELL INTO A NEGATIVE ONE, and an
      underpowered design is a design fact, not evidence that a mechanism is
      absent.
    - >-
      The null model is asymptotic and is least accurate at exactly the toy sizes
      where it is measured; the dispersion band is the only defence and it is a
      finite-sample check, not a proof.
    - >-
      Changes no record's status.

  infrastructure_failure_disposition: >-
    A timeout, crash or missing dependency is INFRASTRUCTURE SIGNAL, recorded as
    failed_infrastructure with its cause and coverage. It is NEVER negative
    mathematical evidence (AGENTS.md core rule 5). The symbolic stage requires no
    compute at all and its result survives any failure of the measurement stage,
    so a compute failure downgrades the deliverable to the arithmetic audit
    rather than voiding the contract.

  assigned_to: executor

  authorization_note: >-
    This contract is status draft, is not frozen, and carries approved_by null.
    Only the Coordinator may approve, freeze or authorize execution (AGENTS.md
    rule 1). Written under TASK-20260904-c0edda, which is DESIGN ONLY. It
    supersedes no contract, edits no record, touches no held-out group, and
    changes no census cell's recorded verdict.
