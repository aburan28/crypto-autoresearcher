# EXP-CERTBIN-255713
# Combination-count arithmetic. No multiset is enumerated.
# Approved by DEC-20261003-ab8c78.
experiment:
  id: EXP-CERTBIN-255713
  hypothesis_id: H-CERTBIN-b4ec98
  source_idea: IDEA-20260930-d2d20c
  question_id: RQ-CERTBIN-836ce2
  version: 1
  title: Written counts versus the two combinations
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-ab8c78
  objective: >-
    Check the gap 14554216, the cross 316, and the product 2166.
  inputs:
    count_lo: 6154284
    count_hi: 20708500
    combination_gap: 14554216
    numerator_lo: 37875205398372
    numerator_hi: 428841951541500
    ratio_num: 11085
    ratio_den: 979
    eleven_times_den: 10769
    ratio_cross: 316
    orbit: 38
    orbit_square: 1444
    base_k2: 76
    base_k3: 114
    half_k2: 38
    half_k3: 57
    excess_product: 2166
    scale_lo: 332
    scale_hi: 498
    nearby_combination: 6044060
    nearby_gap: 110224
  controls:
    - >-
      Choosing 3 from 334 gives 6154284. Choosing 3 from 500 gives
      20708500. Their difference is 14554216. Choosing 3 from 332
      gives 6044060 and invalidates the run.
    - >-
      11085 exceeds 11 times 979 by 316. Eleven times 979 is 10769.
      The products of each count with one less than itself are
      37875205398372 and 428841951541500.
    - >-
      Twice 19 is 38. Twice 38 is 76 and three times 38 is 114.
      Twice 19 and three times 19 are 38 and 57. The product of the
      excesses 38 and 57 is 2166. The square of 38 is 1444. Four
      times 83 is 332 and six times 83 is 498.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {combination, ratio, orbit}
    - route in {choose, product}
  metrics:
    primary:
      - combination_gap
      - ratio_cross
      - excess_product
      - implementations_agree
    secondary:
      - numerator_lo
      - numerator_hi
      - orbit_square
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The combination gap is 14554216. 11085 exceeds 11 times 979
      by 316. The product of 38 and 57 is 2166.
    formula: >-
      Choose 3 from 334 and from 500 and subtract. Reduce the
      written expectations by 8 and subtract 11 times 979 from
      11085. Multiply the excesses 38 and 57.
    source: >-
      IDEA-20260930-d2d20c states the counts 6154284 and 20708500,
      the bases 332 and 498, the weight 3, the expectations
      7.832e-12 and 8.868e-11, and the degree 19, read 2026-10-03.
      The products were recomputed in this design session. That
      computation is not a run. No multiset was enumerated. The
      subgroup order was not computed.
  scale_relevance:
    tier: toy
    justification: Two written counts and one written degree. No transfer to a collision exponent.
    correspondence: null
  tail_checks:
    - The cross 316 and the product 2166 are required. A check that stops at the gap is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the gap 14554216 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The gap is not 14554216.
    - The cross is not 316.
    - The product is not 2166.
    - The nearby combination 6044060 is reported as the count at base 332 with weight 3.
    - A multiset is enumerated, a collision is counted, or a curve is built.
  success_criterion: >-
    Both runs agree that choosing 3 from 334 gives 6154284, that
    choosing 3 from 500 gives 20708500, that their difference is
    14554216, that the two numerators are 37875205398372 and
    428841951541500, that 11085 exceeds 11 times 979 by 316, and
    that the product of 38 and 57 is 2166.
  falsification_criterion: >-
    The runs agree that the difference of the two combination counts
    is computed, and that difference is not 14554216.
  required_artifacts:
    - experiments/EXP-CERTBIN-255713/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CERTBIN-255713/runs/<RUN-ID>/command.txt
    - experiments/EXP-CERTBIN-255713/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CERTBIN-255713/runs/<RUN-ID>/stderr.log
    - experiments/EXP-CERTBIN-255713/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CERTBIN-255713/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any enumeration of multisets, collision count, or curve construction.
    - Any claim that a collision exponent moves.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
