experiment:
  id: EXP-BINSTD-cec99c
  hypothesis_id: H-BINSTD-d09592
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261002-9ff676
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Unique-orbit yield retention R ≥ 1/2 after ⟨Frob,neg⟩ collapse on n=17
    toy Koblitz under twin in-Python orbit meters
  status: approved
  approved_by: DEC-20261003-be1d8e
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261003-be1d8e under AGENTS.md standing
    user authorization (2026-09-06). No Magma/Sage/AUXIN/Bedrock. No
    ECC2K-130 solve. No n>=131 attack. Stage 2 (n∈{23,31}) not authorized.
  approval:
    approved_by: DEC-20261003-be1d8e
    composing_decision: DEC-20261003-be1d8e
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 freezes V/ρ=1/2/surplus/seeds/group; twin conjugate probe;
      identity-null R=1. Stage 1 runs n=17 surplus cells with twin orbit
      meters; writes RESULTS.md with exactly one O-* label.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether unique-orbit retention R stays ≥ 1/2 of raw yield after
    ⟨Frobenius, negation⟩ collapse on the n=17 toy, under twin in-Python
    orbit meters and an identity-action null.

  class: heuristic_validation
  class_note: >-
    Pre-registered ρ=1/2 uniqueness-retention instrument. Not an
    exponent-moving breakthrough; no ECDLP attack table.

  scope:
    included:
      - >-
        Stage 0. Freeze V catalogs as list rows with integer n∈{17,23,31},
        ρ=1/2, surplus multipliers {1, 3/2, 2}, seeds 2026100311/2026100312,
        orbit group ⟨Frob,neg⟩; twin conjugate probe; identity-null probe.
      - >-
        Stage 1. n=17 collect S_3 + short-walk relations to each surplus;
        twin unique-orbit counts; identity-null R=1; one O-* label.
    excluded:
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Magma-missing as a scientific verdict.
      - Stage-2 n∈{23,31} panels under this card.
      - Editing IDEA claim text or GOAL-ECDLP2M-001.yaml.
      - Editing ρ after Stage-0 freeze.
      - Treating infra failure as mathematical evidence.
      - JSON freeze files that use n as object-key strings.

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-cec99c/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-cec99c/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-cec99c/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-cec99c/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-cec99c/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. Twin meters are orbit_a
      vs orbit_b. {run_dir} substituted by supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20261002-9ff676.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-d09592.yaml
    rho_numer: 1
    rho_den: 2
    catalog_seed: 2026100311
    collect_seed: 2026100312
    ell: 3
    stage1_cells:
      - {n: 17, ell: 3}

  controls:
    - name: twin_orbit_census
      definition: orbit_a unique count == orbit_b unique count on every bag.
    - name: null_identity_orbit_action
      definition: Same bag under identity action has R = 1 exactly.
    - name: ctl_frozen_rho
      definition: ρ = 1/2 frozen in stage0/preregistered-predictions.json.
    - name: ctl_frozen_surplus_schedule
      definition: surplus multipliers frozen as a list of {numer,denom} rows.
    - name: ctl_frozen_V_catalog
      definition: V/FB frozen as cells list of rows each with integer n.
    - name: ctl_no_n_object_keys
      definition: check.py refuses digit-string JSON object keys.
    - name: ctl_no_posthoc_rho_edit
      definition: ρ not edited after Stage-0 freeze.
    - name: ctl_canonical_orbit_representative
      definition: lex-min of the ⟨Frob,neg⟩ orbit of each relation.
    - name: ctl_no_magma_detector
      definition: Missing Magma/Sage is not an outcome; Python meters decide.

  independent_variables:
    - name: stage
      levels: [0_freeze_probe, 1_n17_surplus_retention]
    - name: surplus_multiplier
      levels: ['1', '3/2', '2']

  metrics:
    primary:
      - name: unique_orbit_retention_R
        unit: dimensionless
        definition: 'orbit_unique / raw per surplus cell'
      - name: twin_agreement
        unit: boolean
        definition: unique_a == unique_b on every bag.
      - name: surplus_floor_met
        unit: boolean
        definition: raw count ≥ s·|#FB| on every Stage-1 cell.
    secondary:
      - name: null_identity_R
        unit: dimensionless
      - name: raw_relation_count
        unit: integer
      - name: fb_size
        unit: integer
      - name: wall_clock_seconds
        unit: seconds

  heuristic_under_test: HEUR-BINSTD-9ff676-H1

  preregistered_prediction:
    quantity: >-
      After surplus floors, R = |orbit_unique|/|raw| ≥ 1/2 on each Stage-1
      n=17 surplus cell under twin agreement and identity-null R=1.
    formula: >-
      R_holds iff unique * 2 >= raw * 1 (ρ = 1/2). Unique from lex-min
      canonical representatives of ⟨Frob,neg⟩ orbits.
    source: >-
      IDEA-20261002-9ff676 HEUR-BINSTD-9ff676-H1 with ρ frozen here as 1/2
      (not 1/(2n)). Written before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Uniqueness instrument on n=17 only under this card. No transfer of
      the ρ band into an n≥131 attack is claimed.
    correspondence: null

  tail_checks:
    - Twin disagreement voids R claims (O-ARTIFACT).
    - Surplus floor failure → O-INCONCLUSIVE (band not authorized).
    - Identity-null R ≠ 1 → O-ARTIFACT.
    - Digit-string n object keys → check.py FAIL.

  seeds_and_replication:
    catalog_seed: 2026100311
    collect_seed: 2026100312
    independent_instances: 3
    note: >-
      Three surplus multipliers on one n=17 cell. Twin meters are the
      replication instrument for each bag.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and v-catalog.json.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-BINSTD-d09592.
    - maximum_runs = 4.
    - Do not open Stage-2 under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Magma-missing used as the scientific outcome → protocol invalid.
    - Twin failure → O-ARTIFACT; do not read R as support.
    - Band outcome without surplus floors → protocol invalid.
    - n-as-object-key JSON freeze → protocol invalid.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an n≥131 exponent move → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with twin_ok and identity-null R=1 on the
    probe; Stage 1 produces surplus-floor status and, when floors met,
    R vs 1/2 per cell (or a named O-ARTIFACT/O-IMPEDIMENT/O-INCONCLUSIVE
    stop); RESULTS.md names exactly one O-* label from H-BINSTD-d09592
    with cited artifacts.

  falsification_criterion: >-
    Any of: twin disagreement; post-hoc ρ edit; band verdict without
    surplus floors; Magma-missing as a verdict; a claimed break/exponent
    under this card. (O-FAIL-BAND is a valid scientific negative of
    O-SUPPORT, not a protocol fail.)

  required_artifacts:
    - experiments/EXP-BINSTD-cec99c/trial-plan-v1.json
    - experiments/EXP-BINSTD-cec99c/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-cec99c/stage0/v-catalog.json
    - experiments/EXP-BINSTD-cec99c/stage1/
    - experiments/EXP-BINSTD-cec99c/RESULTS.md
    - experiments/EXP-BINSTD-cec99c/runs/<RUN-BINSTD-*>/
    - experiments/EXP-BINSTD-cec99c/implementation/run.py
    - experiments/EXP-BINSTD-cec99c/implementation/check.py
    - experiments/EXP-BINSTD-cec99c/implementation/orbit_a.py
    - experiments/EXP-BINSTD-cec99c/implementation/orbit_b.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
