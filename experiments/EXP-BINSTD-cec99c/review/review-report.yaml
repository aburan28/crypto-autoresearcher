  prior_overturned: false
  joints:
    J1:
      verdict: holds
      finding: >-
        Two runs. RUN-BINSTD-3f972b is O-STAGE0-OK. RUN-BINSTD-d08b90 is
        O-INCONCLUSIVE. RESULTS.md outcome is O-INCONCLUSIVE, matching
        the Stage 1 raw file. Both receipts are output_validated,
        returncode 0, check_returncode 0, checker stdout OK. Both
        manifests are completed_valid, code.dirty false, certificate.kind
        none. claims.break, claims.exponent_move, and claims.n_ge_131
        are false on both. certificate.kind none is the expected marker
        for a card that claims no discrete-log solve.
    J2:
      verdict: holds
      finding: >-
        Label order is twin failure → O-ARTIFACT, unmet surplus floor →
        O-INCONCLUSIVE, then the identity null, then band_ok → O-SUPPORT
        else O-FAIL-BAND. Archived surplus_met is false, so the emitted
        label is O-INCONCLUSIVE. band_holds true on the partial bags does
        not override the floor. check.py refuses O-SUPPORT and
        O-FAIL-BAND unless surplus_met is true. No cell's raw count meets
        its floor.
    J3:
      verdict: holds
      finding: >-
        Blind floors are 1*4//1 = 4, 3*4//2 = 6, and 2*4//1 = 8.
        Archived raw 3 is strictly below each. Temp copy
        /tmp/review-binstd-cec99c, with that copy's stage1 json and
        RESULTS.md removed, reran --stage 1 into
        /tmp/review-binstd-cec99c-stage1. Outcome O-INCONCLUSIVE. Raw
        counts 3, 3, 3. Archived repo stage files were not overwritten
        (sha256 of panels.json, control-table.json, and RESULTS.md
        unchanged).
  proves_too_much:
    verdict: holds
    objects:
      - >-
        "O-INCONCLUSIVE means the retention ratio fell below 1/2" is
        false here. band_holds is true on every partial bag (unique 2
        over raw 3). The label is the unmet surplus floor.
      - >-
        "raw met the surplus floor" is false. raw is 3 and the floors
        are 4, 6, and 8.
      - >-
        "this package calibrates n=23, n=31, or ECC2K-130" is false.
        Stage 2 is not authorized and certificate.kind is none.
    failure_signature_observed: false
  blind_rederivation:
    quantity: 1*4//1, 3*4//2, and 2*4//1, and whether 3 is strictly below each
    computed_before_implementation_read: true
    floors: [4, 6, 8]
    archived_raw: 3
    strictly_below_each_floor: true
  procedure_deviations:
    - id: PD-1
      source: experiments/EXP-BINSTD-cec99c/review/addendum-pd1.yaml
      statement: >-
        One coordinator task owns J1, J2, and J3. No separate validator
        session and no red-team session were run. The addendum records
