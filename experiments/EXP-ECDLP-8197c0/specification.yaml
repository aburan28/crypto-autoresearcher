  id: EXP-ECDLP-8197c0
  hypothesis_id: H-ECDLP-df33b3
  question_id: RQ-ECDLP-4fcbd3
  question_ids:
    - RQ-ECDLP-4fcbd3
  source_idea: IDEA-20260930-a6491b
  goal_id: null
  goal_ids: []
  goal_ids_note: >-
    No goal head is edited. GOAL-ECDLP2M-001.yaml is out of write-scope.
  version: 1
  title: >-
    Stage 0 Weil-ceiling / (D1)/(D2) worksheet; Stage 1 Python dual-route
    restricted-spectrum ladder at field_bits 8, 10, 12 versus equal-size
    random subsets
  status: analyzed
  approved_by: coordinator
  approved_at: '2026-10-03'
  approval_decision: DEC-20261003-c8da17
  packaging_only: false
  designed_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261003-c8da17 under AGENTS.md standing
    user authorization (2026-09-06). Trial-plan-v1 admits Stages 0-1 only.
    No Magma/Sage/AUXIN/Bedrock. No Stage 2. No field_bits >= 16.
  execution_surface:
    trial_plan: experiments/EXP-ECDLP-8197c0/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-ECDLP-8197c0/implementation/run.py --stage 0
      --trial-plan experiments/EXP-ECDLP-8197c0/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-ECDLP-8197c0/implementation/run.py --stage 1
      --trial-plan experiments/EXP-ECDLP-8197c0/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. {run_dir} is substituted by
      the process supervisor. trial-plan.json is a byte-identical twin of
      trial-plan-v1.json.
  approval:
    approval_decision: DEC-20261003-c8da17
    composing_decision: DEC-20261003-c8da17
    rule: >-
      Approved under AGENTS.md "Standing user authorization for ideas and
      experiments" (user, 2026-09-06: "all is approved. ideas/experiments should
      be always approved") once the protocol was complete. Approval does not
      assert the hypothesis is true. Stages 0-1 on field_bits {8,10,12} only.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      section: Standing user authorization for ideas and experiments
      instruction_date: '2026-09-06'
      quotation: 'all is approved. ideas/experiments should be always approved'
      renewed_user_approval_required: false

  objective: >-
    Decide, on Python-enumerable prime-order toys at field_bits 8, 10 and 12,
    whether bounded-degree subset restriction of a frozen coordinate predictor
    sits at the equal-size random-subset product (O-FLOOR) or exhibits a
    concentration signature against that null (O-CONCENTRATION), after a
    zero-run Stage-0 derivation worksheet that records the Weil meeting point
    and the (D1)/(D2) break steps. Dual meters share one DFT path.

  class: heuristic-validation
  class_note: >-
    Heuristic-validation of HEUR-1 / HEUR-2 at toy scale. No exponent-moving
    claim. Magma-tabulated logs of the idea's {16,20,24} panel are not a
    success path.

  claim_tier_and_scope:
    claim_tier: toy
    statement: >-
      Restricted-spectrum dual-route measurement on self-generated
      field_bits {8,10,12} curves. No discrete-logarithm solve. No deployed
      curve.
    sota_delta: zero on every ECDLP cost axis
    dominated_by: rho / van Oorschot-Wiener at 0.886 sqrt(N)
    certificate_kind: none
    certificate_note: >-
      No solve or relation is claimed. D1 is an instrument self-check
      (eps_S == 1), not a DL certificate.
    affected_vs_safe: No deployed or standardized curve is touched.

  scope:
    included:
      - 'Stage 0 (zero scientific trials): Weil meeting-point arithmetic at c = 1, (D1)/(D2) break steps, sigma = 1 slice'
      - 'Stage 1: field_bits {8,10,12}; families x-interval, x-residue, popcount; predictors 1, Legendre(x), x mod 2, Legendre(y); equal-size random-subset null; D1 even-order control; D2 interval reported not scored'
    excluded:
      - field_bits 16, 20, 24 and any Magma/Sage tabulated-log census
      - Stage 2, itinerary classes, delta_KS, deployed curves
      - Amazon Bedrock, AUXIN, editing GOAL-ECDLP2M-001.yaml

  stages:
    stage_0:
      name: Zero-run Weil / nearby-object worksheet
      deliverables:
        - stage0/preregistered-predictions.json
        - stage0/weil-ceiling.yaml
        - stage0/d1-d2-breaks.yaml
        - stage0/precommit-hashes.json
        - stage0/selfchecks.json
      blocks_stage_1_until: >-
        Stage-0 self-checks pass and precommit-hashes.json is written BEFORE
        any curve enumeration. A failed self-check halts Stage 1.
    stage_1:
      name: Python dual-route restricted-spectrum ladder
      deliverables:
        - stage1/cells.yaml
        - stage1/ladder.json
        - stage1/d1-control.json
        - stage1/decision-rules.json
        - RESULTS.md

  freeze:
    8:
      field_bits: 8
      curve_seed: 2026100308
      d1_seed: 2026101308
      j_interval_max_extra: 3
    10:
      field_bits: 10
      curve_seed: 2026100310
      d1_seed: 2026101310
      j_interval_max_extra: 3
    12:
      field_bits: 12
      curve_seed: 2026100312
      d1_seed: 2026101312
      j_interval_max_extra: 3
    weil_c: 1
    ratio_floor_lo: 0.5
    ratio_floor_hi: 2.0
    ratio_concentration: 4.0

  inputs:
    field_bits: [8, 10, 12]
    families: [x_interval, x_residue, popcount]
    predictors: [one, legendre_x, x_lsb, legendre_y]
    weil_c: 1
    implementation: experiments/EXP-ECDLP-8197c0/implementation/run.py

  controls:
    - 'Equal-size seeded random subset, identical DFT path (blocking null)'
    - '(D1) 2-descent kernel on even-order 2q; eps_S must be 1 at frequency q (blocking positive control)'
    - '(D2) discrete-log interval with kangaroo membership charged (proves-too-much; reported, not scored)'
    - 'Whole-group slice sigma = 1 on predictor g = 1 (baseline embedding)'
    - 'Missing numpy.fft is O-IMPEDIMENT, never O-FLOOR or O-CONCENTRATION'

  independent_variables:
    - field_bits in {8, 10, 12}
    - subset family in {x_interval, x_residue, popcount}
    - rung j
    - predictor
    - object versus equal-size random subset (dual route)

  metrics:
    primary:
      - spike_ratio_to_null
      - product_C
      - d1_eps_at_q
      - outcome_label
    secondary:
      - sigma
      - meeting_point_j
      - weil_informative_flag
      - peak_rss_bytes

  heuristic_under_test: HEUR-1
  preregistered_prediction:
    quantity: spike ratio A(S)/A(random subset of equal size)
    formula: >-
      E-FLOOR band [0.5, 2]; E-CONCENTRATION threshold 4 at every size with
      non-decreasing trend; meeting point sigma* = 1/sqrt(N) at weil_c = 1
    source: >-
      IDEA-20260930-a6491b predictions and minimal_test, copied 2026-10-03;
      scale reduced to field_bits {8,10,12} as a disclosed Python bound, not
      a silent threshold change of the Magma panel
  scale_relevance:
    tier: toy
    justification: >-
      field_bits 8, 10, 12 with Python enumeration. The idea named 16, 20, 24
      with Magma logs; that panel is not authorized and is not a success path.
    correspondence: null
  tail_checks:
    - Largest ratio to null per size versus the largest over equal-size null cells
    - D1 must read eps_S = 1; a miss voids the run

  replication:
    seeds: [2026100308, 2026100310, 2026100312]
    independent_instances: 3
    replication_note: One curve per field_bits; sizes are the replication axis, not extra seeds per size.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 3
    maximum_workers: 1

  stopping_rules:
    - 'Stage 0 completes or Stage 1 does not start'
    - 'D1 miss (O-D1-MISS) stops scoring and voids the mathematical reading'
    - 'Missing numpy yields O-IMPEDIMENT and stops Stage 1 without a floor/concentration label'
    - 'A crash, timeout, or memory abort is failed_infrastructure, never O-FLOOR or O-CONCENTRATION'
    - 'Stop after Stages 0-1; do not start Stage 2'

  invalidation_rules:
    - Dual meters use different DFT implementations
    - Magma, Sage, AUXIN, or Bedrock is selected as a success path
    - field_bits outside {8,10,12} are claimed as authorized
    - Thresholds 0.5 / 2 / 4 are edited after any Stage-1 read
    - IDEA-20260930-a6491b or GOAL-ECDLP2M-001.yaml is edited

  success_criterion: >-
    Stage 0 self-checks pass. Stage 1 emits exactly one of O-FLOOR,
    O-CONCENTRATION, O-INCONCLUSIVE, O-D1-MISS, O-ARTIFACT, O-IMPEDIMENT
    from the frozen decision rules, with dual-meter tables and the D1
    reading archived. GENERATED coverage per trial includes launch.json,
    execution-receipt.json, command.txt, environment.json, stdout.log,
    stderr.log, check.stdout.log, check.stderr.log plus manifest.yaml,
    raw-result.json, RESULTS.md and the stage files.

  falsification_criterion: >-
    O-FLOOR is false if some family has spike ratio >= 4 at every size with
    a non-decreasing trend. O-CONCENTRATION is false if every family has
    ratio <= 2 at every size. A derivation that goes through on (D1) or
    (D2) falsifies the Stage-0 worksheet.

  outcome_table:
    O-FLOOR: every bounded-degree family ratio in [0.5, 2] at every size; D1 pass
    O-CONCENTRATION: some family ratio >= 4 at every size, non-decreasing, null not; D1 pass
    O-INCONCLUSIVE: D1 pass and neither FLOOR nor CONCENTRATION
    O-D1-MISS: D1 eps_S is not 1 at sigma = 1/2 (void)
    O-ARTIFACT: null ratios fail to sit in the Gumbel-like band while object ratios do, or a spike ratio that does not decay in p on the null
    O-IMPEDIMENT: numpy missing, curve search exhausted, timeout, crash; not a mathematical result

  required_artifacts:
    - experiments/EXP-ECDLP-8197c0/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-8197c0/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-8197c0/runs/<RUN-ID>/RESULTS.md
    - experiments/EXP-ECDLP-8197c0/stage0/preregistered-predictions.json
    - experiments/EXP-ECDLP-8197c0/stage0/weil-ceiling.yaml
    - experiments/EXP-ECDLP-8197c0/stage1/ladder.json
  required_artifacts_note: >-
    Supervisor-generated files per trial (not listed as producer artifacts in
    trial-plan, because they are reserved): launch.json, execution-receipt.json,
    command.txt, environment.json, stdout.log, stderr.log, check.stdout.log,
    check.stderr.log. The producer additionally writes manifest.yaml,
    raw-result.json, RESULTS.md and the stage files.

  assigned_to: executor
  amazon_bedrock: NOT SELECTED
  out_of_scope:
    - Magma or Sage tabulated discrete logs
    - AUXIN records
    - 'Any "run: Magma" success path'
    - GOAL-ECDLP2M-001.yaml
    - Stage 2 arc-concentration of IDEA-20260905-9c4f0c
    - Deployed curves and n >= 131
