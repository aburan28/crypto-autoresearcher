# EXP-ECDLP-080496
# Point count and coordinate cycle on C_27 over F_97.
# No group law. Approved by DEC-20261001-ebbc28.
experiment:
  id: EXP-ECDLP-080496
  hypothesis_id: H-ECDLP-09812e
  source_idea: IDEA-20260913-11d3cb
  question_id: RQ-ECDLP-002
  version: 1
  title: Rational points and the coordinate cycle on the Hesse cubic over F_97
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-ebbc28
  objective: >-
    Enumerate the projective points of x^3 + y^3 + z^3 = 81 xyz over F_97.
    Check that sigma(x : y : z) = (y : z : x) preserves the curve, has order
    dividing 3, fixes no point, and sends O = (1 : 96 : 0) to (1 : 0 : 96).
  inputs:
    p: 97
    d: 27
    equation: x^3 + y^3 + z^3 - 81*x*y*z
    O: [1, 96, 0]
    predicted:
      point_count: 117
      fixed_points: 0
      sigma_O: [1, 0, 96]
  controls:
    - >-
      The identity map fixes every found point. Reporting its fixed-point
      count as 0 invalidates the run.
    - Two charts, z-first and x-first. They must not import each other. The normalized point sets must agree.
  independent_variables:
    - projective chart
    - map in {sigma, identity}
  metrics:
    primary:
      - point_count
      - sigma_preserves_all
      - sigma_cube_is_id
      - fixed_points_of_sigma
      - sigma_O
      - identity_fixes_all
      - implementations_agree
    secondary:
      - chart_size_before_normalize
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Point count, fixed points of sigma, and sigma(O).
    formula: >-
      A point is a projective triple satisfying the equation. sigma cycles
      the three coordinates. Fixed means equal after scaling the first
      nonzero coordinate to 1.
    source: >-
      IDEA-20260913-11d3cb claim (A), read 2026-10-01. A design-time
      enumeration found 117 points and 0 fixed points, and sigma(O) matches
      (1 : 0 : 96) after scaling. That enumeration is not a run.
  scale_relevance:
    tier: toy
    justification: One curve over a 97-element field. No transfer.
    correspondence: null
  tail_checks:
    - "The point at (0 : 1 : 0) is tested. Omitting the z = 0, x = 0 chart and still reporting 117 is invalid."
  replication:
    seeds: []
    independent_instances: 1
    replication_note: Deterministic. The second run is the other chart order.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the identity control does not fix every point, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either enumeration imports the other.
    - identity_fixes_all is false.
    - A group-law addition or a discrete logarithm is reported.
  success_criterion: >-
    Both runs agree, the point count is 117, sigma preserves every point,
    sigma cubed is the identity, sigma fixes no point, sigma(O) is
    (1 : 0 : 96), and the identity map fixes every point.
  falsification_criterion: >-
    The runs agree, the identity control passes, and the point count is not
    117, or sigma fails to preserve a point, or sigma fixes a point, or
    sigma(O) is not (1 : 0 : 96).
  required_artifacts:
    - experiments/EXP-ECDLP-080496/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-080496/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-080496/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-080496/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-080496/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-080496/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - The Hesse group law and the claim that sigma is translation.
    - The degree argument for multiplication maps.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
