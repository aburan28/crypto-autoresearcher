experiment:
  id: EXP-ALPF-c8b943
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-0027ac; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-0027ac
  question_id: RQ-ALPF-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Factorial representation-by-curve design over independently sampled prime-field toy curves
    with quadratic-twist and isogenous-partner contrasts, decomposing survival-verdict and first-fall-degree
    variance into representation, curve and residual components.
  objective: 'The one uncertainty a run reduces is whether the ALPF representation comparison measures
    representations or measures one curve family. Stated as parts: (i) is the leading-form degree
    profile a deterministic function of the representation alone, constant across independently sampled
    curves, as the elementary-symmetric change of variables implies -- a zero-cost check that separates
    the deterministic half of the response from the stochastic half before any variance is decomposed;
    (ii) decomposing the variance of the metered first-fall degree over a factorial grid of three
    representations by fifteen or more independently sampled prime-order toy curves, with a quadratic-twist
    contrast nested within curve, what is the ratio of the representation variance component to the
    curve variance component, and does the representation component exceed the 95th percentile of
    a within-curve label-permutation null; (iii) do curveless null systems matched to the same degree
    profiles reproduce the between-representation differences, in which case the apparent representation
    effect is a profile effect with no curve content at all. Reducing these executes the guard KN-OPEN-003
    explicitly asks for, over prime fields, at the scale the archived campaign already reached.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: at this bit size,
      this factor-base size and this representation set, over this sample of curves, the variance
      in first-fall degree decomposes into the reported components with the reported intervals, and
      the representation component did or did not exceed its permutation null. What does NOT follow:
      that any representation reduces any real decomposition or solving cost; that a representation
      effect at toy scale persists at medium or cryptographic scale; that the archived EXP-ALPF-011
      positive is invalid, since that run is immutable and its scope was never wider than its own
      curve family; and no attack, speedup or security consequence of any kind.'
  inputs:
    procedure: 'STAGE 0 (cost: 0 compute): fix the representation set and the profile predictions
      from the archived EXP-ALPF-011 table. STAGE 1 (cost: ~1 CPU-hour): generate 30 independent prime-field
      toy curves at a 15-bit prime with prime-order subgroups using harness/toycurve.py, plus each
      curve''s quadratic twist; record coefficients and orders. STAGE 2 (cost: ~30 CPU-minutes): search
      each curve for a small-degree isogenous partner within the toy range and record availability.
      STAGE 3 (cost: ~2 CPU-hours): for every curve and twist build the three representations at |FB|
      = 4 with harness/semaev.py, assert profile constancy within representation, and meter d_ff with
      the shared pure-Python Macaulay meter. STAGE 4 (cost: ~30 CPU-minutes): meter 30 curveless null
      systems per profile. STAGE 5 (cost: minutes): run 200 within-curve label permutations of the
      variance decomposition. STAGE 6 (cost: minutes): report variance components with intervals,
      the permutation-null position, the twist contrast, the isogeny contrast on its subsample, and
      the profile-constancy indicator.'
    instrument: Python 3 only, no Sage. harness/toycurve.py for curve generation, prime-order subgroup
      search, quadratic twist construction and the seeding convention; harness/semaev.py for s3_expr,
      s4_expr and build_factor_base; a shared pure-Python Macaulay-rank meter over F_p; a hand-written
      two-way variance decomposition and permutation test in numpy-free Python so no additional dependency
      is introduced; harness/runner.py for run manifests, seeds and the inference block.
    parameters: 'Prime: one 15-bit prime. Curves: 30 independently sampled with prime-order subgroups,
      plus their 30 quadratic twists, giving 60 curve objects. Isogenous partners: searched at degrees
      2, 3 and 5, availability reported. Representations: x-ring baseline, e-ring elementary-symmetric,
      power-sum. |FB| = 4 fixed. Metered cells: 60 curves x 3 representations = 180, plus 3 profiles
      x 30 curveless nulls = 90. Permutations: 200. Maximum Macaulay degree 14 with a 2 million column
      cap. Seed blocks: 5 blocks of 6 curves.'
  controls:
  - Quadratic-twist contrast within each sampled curve, run in the same invocation as its base curve.
  - Isogenous-partner contrast where a small-degree isogeny is available, reported for the subset
    where it exists.
  - 'Curveless null arm: random homogeneous systems matched to each representation''s degree profile.'
  - 'Label-permutation null: 200 permutations of representation labels within curve, giving the null
    distribution of the representation variance component.'
  - Profile-constancy assertion recorded per curve rather than assumed, since the deterministic prediction
    must be checked not assumed.
  - Seed-block control with 5 disjoint blocks over the curve sample.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls in the same invocation. First, curveless nulls: random homogeneous
    systems matched to each representation''s degree profile, 30 per profile, metered identically
    -- the representation ''effect'' on d_ff must exceed the difference these curveless nulls show
    between the same profiles, otherwise the effect is a profile effect that any random system of
    that shape would produce and no curve or representation is involved. Second, a label-permutation
    null: re-run the entire variance decomposition with the representation labels randomly permuted
    within curve, 200 times, to give the null distribution of the representation variance component.
    For the signal arm to mean anything, the observed representation component must exceed the 95th
    percentile of the permutation null, and the curveless nulls must reproduce the between-profile
    d_ff differences seen in the signal arm no better than at chance.'
  independent_variables:
  - representation (x-ring, e-ring, power-sum)
  - sampled curve identity
  - twist status (base vs quadratic twist)
  - isogenous-partner availability
  - seed block
  metrics:
    primary:
    - variance components for representation, curve, twist-within-curve and residual in d_ff, with
      intervals
    - position of the observed representation component in the 200-permutation null
    - profile-constancy indicator per representation across all 60 curve objects
    - d_ff per (representation, curve object)
    secondary:
    - curveless null d_ff distribution per profile
    - twist contrast magnitude per curve
    - isogeny contrast on the available subsample with its subsample size
    - number of curves generated per unit time and rejection rate for lack of a prime-order subgroup
    - peak Macaulay dimensions per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The ratio of the representation variance component to the curve variance component in
      the metered first-fall degree, and the constancy of the leading-form degree profile within representation.
    formula: 'Fit d_ff(r, c) = mu + alpha_r + beta_c + gamma_{twist(c)} + eps with alpha the representation
      effect, beta the curve effect and gamma the within-curve twist contrast; report Var(alpha) /
      Var(beta) with a bootstrap interval over the 5 seed blocks. Pre-registered predictions: profile
      is constant within representation on 100 percent of curve objects; Var(alpha) / Var(beta) >=
      2; and the observed Var(alpha) exceeds the 95th percentile of the null obtained by permuting
      representation labels within curve 200 times. If Var(beta) is zero the ratio is reported as
      undefined with Var(alpha) alone, not as infinity.'
    source: Pre-registered in the parent proposal IDEA-20260816-0027ac before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested at a single 15-bit prime with |FB| = 4 and 60 curve objects, well inside
      the archived ALPF parameter range. No transfer to medium or cryptographic scale is assumed or
      claimed, and no fit is extrapolated in the field size, which is deliberately held FIXED so that
      the curve factor is not confounded with a size factor. The design's one generalisation is across
      the sampled curve population at that bit size, which is exactly the population the sample is
      drawn from.
    correspondence: null
  tail_checks:
  - Report the curves with the extreme d_ff values individually with their coefficients and j-invariants,
    since a single special curve driving the curve component is the most informative tail.
  - Report any curve where the profile differed from its representation's predicted profile, individually.
  - Report the twist contrast distribution's tails, since a bimodal twist contrast would indicate
    an order-dependent effect rather than a coefficient effect.
  - Report curve-generation rejections so the sampled population is characterised rather than assumed
    uniform.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop and report underpowered if fewer than 20 curves with prime-order subgroups are generated
    within 2 CPU-hours.
  - Drop the isogeny contrast and report it dropped if fewer than 8 curves have a partner at degree
    2, 3 or 5.
  - Hard stop at 6 total CPU-hours.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Profile constancy checked on every curve object, a variance decomposition with
    bootstrap intervals reported for all four components, and the permutation-null position of the
    representation component reported.
  falsification_criterion:
  - Profile not constant within representation on any curve object.
  - Representation-to-curve variance ratio below 2, or below 1, confirming the confounding warning
    as binding.
  - Observed representation component below the 95th percentile of the label-permutation null.
  - Curveless null arm reproducing the signal arm's between-profile d_ff differences.
  - d_ff constant across all cells, degenerating the response.
  - Fewer than 20 usable curves generated, leaving the design underpowered.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-0027ac
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Whether build_factor_base makes 'curve' and 'factor base' separable at all must be settled by
    a Coordinator; if not, the curve component must be relabelled as a curve-plus-factor-base component
    throughout.
  - The quadratic twist changes the group order; a Coordinator must decide whether order enters as
    a covariate or whether twists are matched on order where possible.
  - The small-degree isogeny search procedure at toy sizes is not implemented in the listed harness
    modules and must be specified or the axis dropped before approval.
  - The bootstrap interval scheme over 5 seed blocks needs pinning, since 5 blocks is few for a bootstrap
    and a jackknife may be more honest.
