        "curve_selection": "For bits8,10,12,16 list the eight largest primes strictly below2^bits in decreasing order, then (A,B) in0..63 squared lex order. Reject singular,j0/1728,supersingular,anomalous curves; require exact FULL order N=#E an odd prime and N>2*max(B)+1. Choose first eligible curve, plus first two further distinct-j curves at8bits for the mandatory3-curve graph calibration. Require independent point-count paths and a nonzero generator P with[N]P=O; helper generate_instance alone is insufficient because it returns a prime subgroup. Encode infinity separately and affine points by fixed-width x,y integers. Named anchors N4099 and65537: scan all primes p in[N-128,N+128] in ascending order and A,B0..63 lex; select first nonsingular ordinary nonanomalous curve with full order exactlyN. Missing fixture in fixed pool is ineligible, never replace N or ladder.",
        "randomness": "SHA256 counter stream on UTF8 EXP_ID|stage|cell|base_index|replicate_seed|counter; increment counter per32-byte block and rejection-sample integers uniformly without modulo bias. Uniform B-subsets use partial Fisher-Yates on sorted on-curve x-class representatives; at larger fields use uniform x rejection to on-curve nonzero non-2torsion classes and reject duplicates, which is uniform over classes. Canonical representative is lex lesser of Q,-Q. Include both signs in W once. No outcome-dependent resampling.",
