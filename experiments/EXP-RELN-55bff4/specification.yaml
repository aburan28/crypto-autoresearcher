    "methods": {
      "stage0": "Use Z/101, W=±{1,2,3}, m2 and m3. Construct exact rational101x101 P and exact A=mW, compute direct matrix covariances and killed-chain forward/Palm moments. Compare Fourier formulas via certified intervals. Independently implement EC addition on each toy fixture and paired cyclic labels. This validates implementation, not source heuristics.",
      "stage1": "For each frozen base compute BSGS logs only in calibration/checker process; charge this cost and prohibit its use by EC collector. Enumerate actual full mW and select lexicographically first sorted decomposition for every hit. Form lambda_j=(1/B)sum_l cos(2*pi*j*l/N), lambda_star=max j!=0 |lambda_j|. Let f=1_A-p, Fourier weights w_j=|sum_x f(x)exp(-2pi ijx/N)|^2. rho(k)=sum_j!=0 lambda_j^k*w_j/sum_j!=0 w_j. p=0/1 has undefined normalized covariance and separately exact deterministic hit behavior; never divide by zero.",
      "numerical_certificates": "Use rigorous Arb-style ball enclosures for trig/DFT and linear solves at precision128,256,512,1024,2048 bits in that order until every reported comparison quantity enclosure width<=1e-10. An ordinary floating FFT is exploratory only and cannot establish an exact spectrum. Failure to certify is numerical_inconclusive, not source failure. Store full spectrum/weights enclosures and precision, rational stage0 truth, residuals and checker bounds.",
      "hitting_law": "Let T=G\\A and Q=P_TT. Solve u=(I-Q)^-1*1, v=(I-Q)^-2*1. Stationary forward tau=min{t>=1:R_t in A} has nu=pi_T; Palm return with R0~pi(.|A) has nu=(pi|A)*P_AT. E tau=1+nu*u and E tau^2=1+nu*(2*v+u). Compute both, plus start-conditioned-outside hitting law separately. Kac check: Palm mean exactly1/p; forward mean need not equal1/p. Variance/mean reference for geometric(p) is(1-p)/p. Source M3 is operationalized as stationary FORWARD tau, with the other laws reported explicitly because source did not fix the starting law.",
      "hitting_certification": "Since full symmetric walk is irreducible on odd prime group, lambda_star<1. For killed Q, norm<=r=1-p*(1-lambda_star)<1 from mean-zero spectral bound and Cauchy-Schwarz. The residual solution error is <=norm(residual)/(1-r); propagate intervals through second solve and moments. Independently compare exact rationalN101. Also calculate survival P(tau>t)=nu*Q^(t-1)*1 for t>=1, hash predicted CDF at t1..256 and powers2^9..2^17 before sampling. This uses the killed operator, not covariance alone.",
      "stage2": "For each base/seed/q simulate exactly100000 stationary EC walk steps with paired abstract increments; record every state, hit, decomposition and operation count. IID comparator uses100000 independent full-group targets with own public RNG. Additionally1000 independent stationary forward-start trajectories per base, each stopped at first hit or100000 steps, test forward CDF; preserve right-censoring. Never estimate forward law by pooling consecutive-hit gaps, which are Palm returns. Exact certified moments are primary M3; censored empirical moments are lower bounds and survival diagnostics until rigorous tail bounds close them.",
      "statistics": "M1 compare each of50 certified lambda_star values with[scale/1.3,1.3*scale], scale=sqrt(log(N/2)/B), require>=45 compatible per cell. Report8-bit cells, exempt from source HEUR-1 extrapolation as explicitly stated in source derivation. Systematic factor>1.5 means median(lambda_star/scale)>1.5, confirmed both seeds. M2 rho estimator=(1/(T-k))*sum_t (I_t-p)(I_t+k-p)/(p*(1-p)), p exact. SE follows covariance_SE_recipe, with100 contiguous blocks1000 as a secondary diagnostic; no iid block assumption. Compare all five lags within3SE; same signed >3SE in both seeds while paired cyclic arm agrees is curve instrumentation failure. Do not use iid standard errors for a slowly mixing walk.",
      "M3": "Write certified forward moment ratio per cell before trajectories. N4099/B8/m2 threshold>=2 times geometric, below1.3 refutes headline; values1.3..2 fail the>=2 prediction without satisfying the stronger headline-refutation threshold. Both B48 anchors must lie within factor1.2, i.e[1/1.2,1.2]. Report other cells against geometric and full killed-chain law. Moment enclosure crossing threshold is inconclusive. Empirical forward CDF compared pointwise using simultaneous95% DKW band sqrt(log(2/.05)/(2*1000)) with censoring retained as interval mass; it does not substitute for certified moments.",
      "ap": "q in{0,1/4,1/2,3/4,1}; t=round_half_up(q*B). Retain B-t classes chosen uniformly without replacement from AP classes{x([j]P):1<=j<=B}, then add t classes uniformly from the complement of the retained set in ALL n classes. Thus q1 is exactly uniform random B-subset and q0 exact AP. Do not forbid reselecting removed AP classes. Use paired random streams across q; monotonicity is a source prediction, not a sampler identity. Report every q mean and paired difference; replicated negative differences beyond3SE count against monotonicity after sampler controls pass.",
      "M4": "At q0 require rho16>=.9. Compare lambda_star nonincreasing over q; interval-certified increase is a source monotonicity violation, not invalid sampler. q1 lambda_star within factor1.3 of independent random cohort mean. AP generator signs/membership match random controls exactly. Report coverage, spectra and forward/Palm laws at every q.",
      "relations": "Freeze public P, checker-chosen Q=[s]P. Collector chooses a,b uniformF_N and starts R0=[a]P+[b]Q, exactly uniform; collector never receives s or log tables. At hit t, sum D_t=R_t, verify first-hit row D_t-sum_{i=1}^t W_i-aP-bQ=O. Formal factor-base occurrences=m+t, plus at most2 header terms before combining. Consecutive hits s<t yield pure row D_t-D_s-sum_{i=s+1}^t W_i=O with formal occurrences2m+(t-s). Store raw occurrence vector, signed sparse coefficient vector overF_N, cancelled terms, headers and independently checked point identity. No fabricated m+gap row omitting D_s. Repeated/cancelled rows may have sparse weight<m or0 without being invalid.",
      "M5": "Retain literal source reference m+1/p and its factor1.5 prediction. Primary actual collected consecutive-hit row formal occurrence mean uses2m+gap; separately report first-hit occurrencesm+tau, sparse support and header counts. Compare every definition transparently, never select the one that happens to fit. IID-like means all measured/certified |rho(k)|<.05 at k2,4,8,16 and forward moment ratio within factor1.2. Nonmixing means certified |rho16|>=.9. Other cells intermediate. Source lower bound<m is tested on formal occurrences, where a violation indicates reconstruction/counter error; sparse support belowm is a valid cancellation diagnostic and refutes that interpretation of the assertion. Kac implies mean consecutive gap1/p even in nonmixing chains, so source drought-length mean inference is explicitly under test.",
      "cost_accounting": "Keep coordinatewise vectors: EC additions/doublings, base-field mul/add/inversion, integer/rational arithmetic and operand bits, equality/table lookups, random draws, oracle calls, CPU/wall,RSS,data/storage/I/O. Charge fixture/base/lookup construction, failed sampling, exact enumeration, spectral/probability work, all certificates and checks. Distinguish algorithm-only and full audit totals; no unexplained sum of unlike units or free cached ground truth. Report denominator-zero cases explicitly.",
      "pareto": "For one fixed public challenge Q=[s]P per distinct selected p, s=SHA256(EXP_ID|baseline|p) mod(N-1)+1 held checker-only: ordinary BSGS with b=ceil(sqrtN), fixed-width full point keys and independently verified solution; matched negation-quotient rho with32 public increment pairs generated by the experiment counter RNG, x-coordinate hash partition, canonical +/- point and coefficient sign updates, Floyd cycle detection,16 fixed restart seeds and at most N+1 point-state transitions per restart. Record every failed/degenerate collision and all group calls/table/storage; a failed finite rho attempt is baseline_incomplete, never evidence of attack advantage. The0.886sqrtN reference is modeled context, not forced measured equality. No reuse of secret s by solvers.",
      "heuristic_tail": "Retain source Gaussian-maximum comparison for each50-base cohort: theoretical max of (N-1)/2 independent |Normal(0,1/(2B))| values, using certified normal CDF bounds; compare full empirical CDF and largest lambda_star to its1-1/50 quantile. This is an unverified source approximation; symmetry lambda_j=lambda_{N-j} is explicit and independence among other characters is not assumed as fact.",
      "stationarity_audit": "Record all a,b initial coefficients from the1000 independent forward restarts and apply discrete-uniform Kolmogorov distance to a/N,b/N, conservative alpha.01 DKW threshold sqrt(log(2/.01)/(2*1000)); ties use the actual discrete reference CDF. Compare rho(k) in two halves of each100000-step walk with the covariance_SE_recipe at each half length. The chosen full-group uniform law is algebraically invariant; a nominal KS failure is recorded and replicated, not silently replaced.",
      "covariance_SE_recipe": "For each lag k, let g_t=f(R_t)f(R_{t+k})/[p(1-p)] with f=1_A-p. Compute gamma_h=E[g_0*g_h]-rho(k)^2 from the uniform start and the chronologically ordered four times0,k,h,h+k: multiply the appropriate diagonal f-power at repeated times and apply exact P^gap between successive distinct times. This finite transition-product definition fixes overlap h<=k correctly. For L=T-k, Var(mean g)= [L*gamma0+2*sum_{h=1}^{L-1}(L-h)*gamma_h]/L². Use certified interval arithmetic. Evaluate h through successive fixed cutoffs128,256,512,1024,2048,4096,8192,16384,32768,65536,L-1. For h>k, |gamma_h|<=C*lambda_star^(h-k), C=(max(p,1-p)^2/[p(1-p)])², from reversible L2 contraction on the separated blocks. Tail variance bound<=2*C*lambda_star^(H+1-k)/(L*(1-lambda_star)) for cutoffH>=k. Stop at first tail bound<=10% of the lower bound on the evaluated nonnegative variance, otherwise continue to the full finite sum. Primary SE is the square root of the certified upper variance bound. Block-means SE and both halfwalks are additional diagnostics; primary3SE does not rely on an iid block approximation. Failure to enclose at frozen precision ladder remains numerical_inconclusive."
