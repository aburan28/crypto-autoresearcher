<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">RUN-ECDLP-b2d284 execution pipeline</title>
  <desc id="desc">The queue, claim, and supervisor were admitted. The declared pre-execution memory guard failed on macOS before the producer started, so checker and output were not reached.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#59636e"/></marker>
    <style>
      .label { font: 15px -apple-system, BlinkMacSystemFont, sans-serif; fill: #17202a; }
      .small { font: 12px -apple-system, BlinkMacSystemFont, sans-serif; fill: #4d5966; }
      .box { stroke-width: 2; rx: 12; }
    </style>
  </defs>
  <rect width="1120" height="300" fill="#ffffff"/>
  <text x="30" y="30" class="label" font-weight="700">RUN-ECDLP-b2d284 — execution path (recorded states)</text>
  <text x="30" y="52" class="small">One requested trial; no comparable measurements were emitted, so this run uses a pipeline diagram.</text>
  <g stroke="#59636e" stroke-width="2" marker-end="url(#arrow)">
    <line x1="155" y1="145" x2="180" y2="145"/><line x1="315" y1="145" x2="340" y2="145"/>
    <line x1="475" y1="145" x2="500" y2="145"/><line x1="635" y1="145" x2="660" y2="145"/>
    <line x1="795" y1="145" x2="820" y2="145"/><line x1="955" y1="145" x2="980" y2="145"/>
  </g>
  <g>
    <rect x="30" y="100" width="125" height="90" class="box" fill="#d9f2df" stroke="#26834a"/>
    <rect x="190" y="100" width="125" height="90" class="box" fill="#d9f2df" stroke="#26834a"/>
    <rect x="350" y="100" width="125" height="90" class="box" fill="#d9f2df" stroke="#26834a"/>
    <rect x="510" y="100" width="125" height="90" class="box" fill="#ffe3b3" stroke="#b26a00"/>
    <rect x="670" y="100" width="125" height="90" class="box" fill="#f0f2f4" stroke="#8a949e" stroke-dasharray="6 4"/>
    <rect x="830" y="100" width="125" height="90" class="box" fill="#f0f2f4" stroke="#8a949e" stroke-dasharray="6 4"/>
    <rect x="990" y="100" width="125" height="90" class="box" fill="#f0f2f4" stroke="#8a949e" stroke-dasharray="6 4"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="92" y="130"><tspan x="92">queue</tspan><tspan x="92" dy="20">admitted</tspan><tspan x="92" dy="20">task bound</tspan></text>
    <text x="252" y="130"><tspan x="252">claim epoch 1</tspan><tspan x="252" dy="20">live</tspan><tspan x="252" dy="20">then released</tspan></text>
    <text x="412" y="130"><tspan x="412">supervisor</tspan><tspan x="412" dy="20">plan loaded</tspan><tspan x="412" dy="20">lock held</tspan></text>
    <text x="572" y="130"><tspan x="572">preexec_fn</tspan><tspan x="572" dy="20">failed</tspan><tspan x="572" dy="20">infrastructure</tspan></text>
    <text x="732" y="130"><tspan x="732">producer</tspan><tspan x="732" dy="20">not started</tspan></text>
    <text x="892" y="130"><tspan x="892">checker</tspan><tspan x="892" dy="20">not started</tspan></text>
    <text x="1052" y="130"><tspan x="1052">raw output</tspan><tspan x="1052" dy="20">not emitted</tspan></text>
  </g>
  <text x="30" y="245" class="small">Recorded cause: “Exception occurred in preexec_fn.” Host: Darwin; Python 3.12.8. Source: execution-receipt.json.</text>
  <text x="30" y="267" class="small">Green = reached; amber = infrastructure stop; dashed gray = not reached.</text>
</svg>
