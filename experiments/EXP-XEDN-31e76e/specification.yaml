experiment:
  id: EXP-XEDN-31e76e
  hypothesis_id: H-XEDN-4f2172
  derived_from_idea: IDEA-20260815-8f5ae8
  question_id: RQ-XEDN-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Retention audit, homogeneity test and pooled lift-probability exponent fit
    across three completed XEDN controls -- with a blocking synthetic
    injection control that must reject a known heterogeneity, a planted-section
    recovery check, and a distinct-size count that gates the fit independently
    of its interval

  objective: >-
    THE ONE UNCERTAINTY A RUN REDUCES -- whether RQ-XEDN-001's declared
    phase-two gate can be resolved from census data already paid for, or
    whether a fourth control is genuinely required. A run establishes, in this
    order -- (i) R1, whether the raw per-surface census data of GOAL-XEDN-001,
    -002 and -003 is retained and reachable, with exact paths; (ii) R2, whether
    per-cell lift counts re-extracted in harness reproduce the summary values
    recorded in those goals' own evidence records exactly; (iii) P1, the three
    per-control fitted exponents with confidence intervals; (iv) P2, a
    pre-declared heterogeneity statistic across them, together with P3, an
    injection control establishing that the same machinery CAN reject a known
    heterogeneity at this data's precision; (v) P4, recovery of the lane's
    already-recorded planted-section control in the pooled data; and only then
    (vi) F1, the number of DISTINCT sizes the pooled data spans, and F2, the
    pooled exponent with its interval against RQ-XEDN-001's declared threshold
    read verbatim from that record. NO ATTACK, no complexity exponent, no new
    census run unless poolability fails, and no statement about any surface
    outside the three completed windows.

  what_this_is_not:
    - >-
      Not an attack, an algorithm, or any cryptanalytic result. The "exponent"
      measured is the decay exponent of a lift probability inside a toy census,
      NOT a complexity exponent, and conflating the two would be a category
      error.
    - >-
      Not new evidence. It is a fit over data three completed goals already
      produced, and it inherits every limitation of those goals.
    - >-
      Not a statement about the surface family at large. The three goals may
      have completed precisely because their windows behaved; this design
      cannot correct for that and reports the selection instead.
    - >-
      Not a status change to GOAL-XEDN-001, -002 or -003, to any of their
      evidence records, or to RQ-XEDN-001. Only the Coordinator changes a
      status.
    - >-
      Not approval, freezing, execution authorization, a run, an observed
      output, or evidence. approved_by is null.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE -- "across the retained census data of the
      three completed XEDN controls, spanning [F1] distinct sizes, the
      per-control exponents [did / did not] pass a pre-declared homogeneity
      test whose power was demonstrated by an injection control, and the pooled
      exponent is [F2] with interval [interval], which [excludes / contains]
      RQ-XEDN-001's declared phase-two threshold, over those three coefficient
      windows and those sizes only." WHAT DOES NOT FOLLOW -- any statement
      about the surface family beyond the three windows, about sizes not
      present in the retained data, about any prime not already censused, or at
      any cryptographic scale; and no correction for the survivorship selection
      by which those three goals came to be completed.

  inputs:
    procedure: >-
      STAGE 0 (zero compute, ORDERING CONTROL) -- declare and hash, before any
      exponent is computed -- the fit's functional form, the size variable, the
      heterogeneity statistic, its significance level, the injection
      displacement, and the minimum distinct-size count of 3. Read
      RQ-XEDN-001's declared phase-two threshold VERBATIM from that record and
      record the path and line.
      STAGE 1 (minutes) -- RETENTION AUDIT. For each of the three completed
      goals, locate the raw per-surface census artifacts and classify as
      reachable-at-per-surface-granularity, reachable-summary-only, or
      unreachable, recording exact paths. IF ANY GOAL IS NOT REACHABLE AT
      PER-SURFACE GRANULARITY, STOP and report the retention audit as the
      deliverable.
      STAGE 2 (minutes) -- COUNT REPRODUCTION, gating. Re-extract per-cell lift
      counts and totals in harness and compare, as exact integers, against the
      summary values recorded in each goal's own evidence records. A single
      disagreement blocks everything downstream.
      STAGE 3 (minutes) -- fit each control SEPARATELY under the declared form,
      producing three exponents with standard errors and 95 percent intervals.
      STAGE 4 (minutes) -- run the INJECTION CONTROL first, then the
      heterogeneity statistic on the real three. If the injection control fails
      to reject, STOP -- part P is undecidable and the deliverable is the power
      analysis. If the heterogeneity statistic rejects on the real three, STOP
      -- pooling is invalid and the deliverable is that finding.
      STAGE 5 (minutes) -- pool, recover the planted-section control, count
      DISTINCT sizes, fit, and report the pooled exponent with its interval
      against the threshold, with the residual structure check.
      STAGE 6 (zero compute) -- assemble the verdict, the selection statement,
      and, if the gate is unmet, the exact sizes a fourth control would have to
      add.
    instrument: >-
      Python 3.11 with numpy; NO Sage and NO sympy (recorded absent in prior
      lane records; absence must be re-checked and recorded at run time).
      Counts are handled as exact integers. The fit and the heterogeneity
      statistic are implemented from their definitions rather than taken from a
      statistics package whose defaults could silently change the test.
      Confidence intervals are reported with the method used named. Recorded
      through harness/runner.py.
    parameters: >-
      Three completed goals -- GOAL-XEDN-001, GOAL-XEDN-002, GOAL-XEDN-003 --
      and their committed experiment run artifacts. Fit functional form, size
      variable, heterogeneity statistic and significance level -- all declared
      and hashed at Stage 0, before any exponent is computed. Injection
      displacement -- declared at Stage 0, applied to two of the three
      exponents at the measured standard errors. Minimum distinct-size count --
      3. RQ-XEDN-001's phase-two threshold -- read verbatim at run time, not
      restated in this contract.
  controls:
    - >-
      ORDERING CONTROL -- the fit form, size variable, heterogeneity statistic,
      significance level, injection displacement and minimum size count are
      committed and hashed BEFORE any per-control exponent is computed. A test
      selected after seeing three point estimates is not a test.
    - >-
      COUNT REPRODUCTION, gating -- per-cell lift counts re-extracted in
      harness must reproduce the three goals' recorded summary values EXACTLY
      as integers. A refit that cannot reproduce the counts it is built from is
      reading a different archive.
    - >-
      PER-CONTROL AGREEMENT CHECK, blocking -- each control is fit in isolation
      before any pooling is attempted, and the three exponents are compared
      before a single pooled number exists.
    - >-
      SYNTHETIC INJECTION CONTROL, BLOCKING AND THE MOST IMPORTANT CONTROL HERE
      -- feed the identical heterogeneity machinery a synthetic input in which
      two of the three exponents are displaced by the declared amount at the
      MEASURED standard errors. It MUST REJECT. Without this, "the exponents
      agree" is indistinguishable from "the test cannot tell", and the
      poolability verdict carries no information.
    - >-
      PLANTED-SECTION RECOVERY -- the lane's already-recorded planted-section
      control must be recovered in the pooled data. A pipeline that loses a
      signal it was given cannot be trusted to measure the rate of signals it
      was not.
    - >-
      DISTINCT-SIZE GATE -- the number of distinct sizes spanned is reported as
      a primary metric and gates the fit INDEPENDENTLY of the interval. A fit
      over two sizes is a line through two points.
    - >-
      RESIDUAL STRUCTURE CHECK -- the pooled fit's residuals against size must
      show no systematic structure at the declared tolerance. Structure means
      the declared functional form is wrong and the exponent is not
      interpretable.
    - >-
      SELECTION STATEMENT -- the survivorship by which these three goals came
      to be completed is reported with every fit. It is named, not corrected.

  independent_variables:
    - source control (GOAL-XEDN-001 / -002 / -003)
    - coefficient window (differs deliberately by control)
    - size (the fit's independent variable)
    - "analysis mode (per-control isolated fit / pooled fit / synthetic injection)"

  metrics:
    primary:
      - >-
        R1 retention_verdict -- per goal, one of
        reachable_per_surface / reachable_summary_only / unreachable, with the
        exact artifact paths. Unit -- categorical per goal.
      - >-
        R2 count_reproduction_mismatch_count -- number of cells where the
        harness re-extraction disagrees with the goal's recorded summary value.
        Unit -- dimensionless count. Required 0.
      - >-
        P1 per_control_exponent -- three fitted exponents with standard errors
        and 95 percent confidence intervals, computed in isolation. Unit --
        dimensionless exponent.
      - >-
        P2 heterogeneity_statistic and its p-value at the pre-declared level,
        across the three per-control exponents. Unit -- test statistic and
        probability.
      - >-
        P3 injection_control_rejects -- boolean, whether the identical
        machinery rejects the declared synthetic displacement at the measured
        standard errors. Unit -- boolean. Required true; blocking.
      - >-
        P4 planted_recovery -- boolean, whether the lane's recorded
        planted-section control is recovered in the pooled data. Unit --
        boolean. Required true.
      - >-
        F1 distinct_size_count -- the number of distinct sizes the pooled data
        spans. Unit -- dimensionless count. Required at least 3, and reported
        independently of F2.
      - >-
        F2 pooled_exponent -- the pooled fitted exponent with its 95 percent
        interval, and a boolean for whether that interval excludes
        RQ-XEDN-001's declared threshold read verbatim at run time. Unit --
        dimensionless exponent plus boolean.
    secondary:
      - per-cell lift counts and totals per control, as exact integers
      - the interval method used and the fit's residuals against size
      - the residual structure check verdict at the declared tolerance
      - the exact path and line from which RQ-XEDN-001's threshold was read
      - the selection statement recording how the three goals came to be completed
      - if the gate is unmet, the exact sizes a fourth control would have to add
      - a recorded check of whether sage and sympy import

  heuristic_under_test: HEUR-XEDN-POOL-1
  preregistered_prediction:
    quantity: >-
      P2 fails to reject homogeneity at the pre-declared level, on a test P3
      shows can reject; F1 >= 3; and F2's interval is reported against the
      declared threshold.
    formula: >-
      P1_i := the exponent fitted to control i alone under the declared form.
      P2 := the pre-declared heterogeneity statistic over (P1_1, P1_2, P1_3)
      with their standard errors. P3 := the same statistic applied to
      (P1_1, P1_2 + d, P1_3 + d) for the declared displacement d. Under the
      NULL that the three controls measure different quantities, P2 rejects.
      Under the NULL that the test has no power at this precision, P3 also
      fails to reject -- which is why P3 is blocking and why a P2 pass alone
      means nothing.
    source: >-
      Pre-registered in IDEA-20260815-8f5ae8 (predictions -- per-control
      exponent agreement, planted-section recovery, fitted exponent against the
      lane's declared threshold; heuristic HEUR-XEDN-POOL-1) and restated as
      R1-R2, P1-P4, F1-F2 in H-XEDN-4f2172 before any run exists. The
      injection control P3 is added here because the parent's agreement check
      as written could not fail informatively. RQ-XEDN-001's threshold is NOT
      restated in this contract and must be read verbatim at run time.

  scale_relevance:
    tier: toy
    justification: >-
      The data is entirely toy-scale census output from three completed goals
      and no new instances are generated. Scale access is therefore whatever
      the retained archive already contains, which is precisely why F1, the
      number of DISTINCT sizes spanned, is a primary metric and an independent
      gate -- a pooled exponent is a claim about how a quantity varies with
      size, and it is only as good as the range of sizes present. TRANSFER
      ASSUMPTIONS, STATED -- none is made beyond the three tested coefficient
      windows and the sizes actually present, and the survivorship by which
      those windows came to be completed is reported and NOT corrected for.
    correspondence: null

  tail_checks:
    - >-
      Report the smallest and largest size present per control, so a pooled
      range that is really one control's range is visible.
    - >-
      Report the control whose window is most extreme separately as the
      likeliest outlier, since a heterogeneity result driven by one control
      means something different from one driven by all three.
    - >-
      Report the cells with the fewest lift events, since a fitted exponent
      dominated by cells with single-digit counts is a fit to counting noise.
    - >-
      Report the per-control exponent that would result from dropping each
      control in turn, so the pooled number's dependence on any one control is
      visible rather than hidden inside an interval.

  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
    note: >-
      Seeds govern only the injection control's synthetic draws and any
      resampling used for interval estimation. The retention audit, the count
      re-extraction and the per-control fits are DETERMINISTIC given the
      archive and must be identical across seeds; a difference there is an
      implementation defect, not variance.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 0.5
    maximum_memory_gb: 2
    maximum_runs: 4

  stopping_rules:
    - >-
      STOP AT STAGE 1 if any of the three goals' raw data is not reachable at
      per-surface granularity. The retention audit IS the deliverable, and a
      fourth control is genuinely required.
    - >-
      STOP AT STAGE 2 if the count reproduction disagrees on any cell. The
      discrepancy is the deliverable and nothing downstream may be reported.
    - >-
      STOP AT STAGE 4 if the injection control fails to reject. Part P is
      undecidable at this data's precision and the deliverable is the power
      analysis; no agreement may be claimed.
    - >-
      STOP AT STAGE 4 if the heterogeneity statistic rejects on the real three.
      Pooling is invalid, no pooled number is computed, and the finding is that
      the three controls did not measure one quantity.
    - >-
      No new census run is authorized by this contract under any outcome.
      Commissioning a fourth control is a separate proposal with its own record.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
      exhaustion is a stop, never a negative result (AGENTS.md rule 5).

  invalidation_rules:
    - >-
      A timeout, crash, or missing-dependency failure makes the run
      failed_infrastructure and is NEVER negative evidence (AGENTS.md rule 5).
      An unreachable artifact due to a tooling error is an infrastructure
      failure; an artifact that was never retained is a retention finding, and
      the two must be distinguished in the report.
    - >-
      A run that computes a pooled exponent without having executed the
      injection control in the same invocation is invalid_measurement.
    - >-
      A run that reports the pooled exponent while the heterogeneity statistic
      rejected is completed_invalid.
    - >-
      A run whose fit form, heterogeneity statistic or significance level was
      fixed after any per-control exponent was computed is completed_invalid.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT
      experiment and requires a new contract.

  success_criterion: >-
    The run is SUCCESSFUL as a measurement when -- (a) R1 is reported per goal
    with exact paths; (b) R2 = 0; (c) P1 reports three exponents with
    intervals; (d) P3 is true and P2 is reported with its p-value; (e) P4 is
    true; and (f) F1 and F2 are reported with the selection statement and the
    residual structure verdict, F2 compared against RQ-XEDN-001's threshold
    read verbatim at run time. The hypothesis H-XEDN-4f2172 is SUPPORTED at toy
    tier if, in addition, all three goals are reachable at per-surface
    granularity, P2 fails to reject on a test P3 shows can reject, and
    F1 >= 3 -- at which point F2's relation to the threshold is REPORTED as the
    lane's phase-two answer in either direction.

  falsification_criterion:
    - >-
      P2 REJECTS homogeneity on a test P3 shows can reject. Part P is FALSE,
      pooling is invalid, no pooled number is produced, and the finding is that
      the three completed controls measured three different quantities.
    - >-
      R1 shows summary-only or unreachable data for any goal. Part R is FALSE,
      the fit is impossible from existing data, and a fourth control is
      genuinely required.
    - >-
      F1 < 3. Part F is FALSE -- the gate is NOT met on this data however tight
      the interval, and the deliverable names the sizes a fourth control would
      have to add.
    - >-
      P3 is false -- the injection control fails to reject. The homogeneity
      verdict is uninformative; part P is undecidable and no agreement may be
      claimed.
    - >-
      P4 is false -- the planted-section control is not recovered. No rate the
      pipeline reports is admissible.
    - >-
      R2 > 0 -- the count reproduction disagrees. The refit is reading a
      different archive from the one the lane's conclusions rest on and
      everything downstream is blocked.
    - >-
      The residual structure check fails at the declared tolerance.
      HEUR-XEDN-POOL-2 is refuted, the exponent is not interpretable, and only
      per-cell rates may be reported.

  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
    - raw-result.json carrying every per-cell count and every per-control fit, not summaries
    - the Stage-0 pre-registration (fit form, size variable, heterogeneity statistic, level, injection displacement, minimum size count), hashed, with a timestamp preceding any exponent computation
    - the retention audit table with exact artifact paths per goal
    - the count reproduction comparison, cell by cell, against the goals' recorded summaries
    - the injection control's input, its statistic and its verdict, in the same file as the real heterogeneity test
    - the planted-section recovery result
    - the exact path and line from which RQ-XEDN-001's phase-two threshold was read
    - the drop-one-control sensitivity table for the pooled exponent

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution. This contract is
      review_required and is NOT approved; approved_by is null and
      execution_authorized is false (AGENTS.md rule 1). Approval is the user's
      gate because it authorizes execution and spends compute.
    - >-
      The Stage-0 pre-registration must be committed and hashed before any
      per-control exponent is computed. A heterogeneity test chosen after
      seeing three point estimates is not a test and voids this contract.
    - >-
      A Coordinator must confirm that approving this contract authorizes NO new
      census run under any outcome. Commissioning a fourth control is a
      separate proposal with its own budget.
    - >-
      A Coordinator must confirm that this experiment changes no status of
      GOAL-XEDN-001/002/003 or of RQ-XEDN-001, whichever way the fit comes out.

  derivation_provenance:
    tool: coordinator-subagent design pass
    source_record: IDEA-20260815-8f5ae8
    authored_at: '2026-08-25'
    note: >-
      Metrics R1-R2, P1-P2, P4, F1-F2 render the parent proposal's three
      predictions, its four minimal_test controls and its four falsification
      conditions into quantities decidable from a recorded number. P3, the
      synthetic injection control, is ADDED HERE and is not in the parent -- the
      parent's agreement check as written could pass for the uninformative
      reason that a three-point heterogeneity test has little power, which
      would make part P unfalsifiable. Its addition is disclosed rather than
      folded in silently. Budgets come from the parent's declared
      estimated_cost (implementation low, compute low). No field is invented;
      unsupplied values are listed in derivation_gaps.

  derivation_gaps:
    - >-
      THE FIT'S FUNCTIONAL FORM IS NOT SPECIFIED by the parent proposal and is
      not specified here. A Coordinator must fix it before approval, together
      with the size variable, because "the lift-probability exponent" names
      different parameters under different forms and a form chosen after seeing
      the data would make the exponent fitted rather than measured.
    - >-
      THE HETEROGENEITY STATISTIC AND ITS LEVEL are not specified. They must be
      fixed before approval, along with the injection displacement, which
      determines what P3 actually demonstrates.
    - >-
      RQ-XEDN-001's declared phase-two threshold is NOT restated in this
      contract, deliberately -- it must be read verbatim from that record at
      run time, with the path and line recorded. A threshold quoted from memory
      into a frozen contract is exactly the failure this program's citation
      rules exist to prevent.
    - >-
      Whether the three goals' raw data is retained at per-surface granularity
      is UNKNOWN at design time; the parent proposal prices it at even odds and
      calls it the fact that decides everything. This contract is therefore
      written so that a retention failure is a first-class reported outcome
      rather than an aborted run.
    - >-
      Survivorship cannot be corrected for by any procedure available here. It
      is reported as a selection statement attached to every fit, and a
      Coordinator should treat the pooled exponent as conditional on it.
