experiment:
  id: EXP-AES-5ec78f
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-AES-5c1c01
  question_id: RQ-AES-001
  goal_id: GOAL-AES-001
  batch_id: null
  assigned_to: executor
  title: >-
    Review-required contract: slope-collision fibre histogram of x -> S(x)
    + a*x, Inv-conic known-answer gate, and two matched-arm coincidence-rate
    measurement (AES MixColumns vs. an alternative extreme-slope MDS matrix)
    at r in {3,4}

  objective: >-
    If separately approved, frozen and authorized: (Stage 0) exhaustively
    compute and freeze the 256 per-slope fibre-size histograms of
    x -> S(x) + a*x with no AES query, and separately verify the Inv-conic
    bound max_b N(a,b) <= 2 for Inv; (Stage 1) measure the byte-coincidence
    rate of a two-round exchange/mixture structure under two matched arms
    (real AES MixColumns; an alternative all-nonzero invertible MDS matrix
    at the fibre-histogram extremes) at r in {3,4}, divide by the
    Stage-0-frozen prediction, and compare against PRP, r=10 decay, and
    random-bijective-S-box controls. This contract is an instrument design
    and a pre-execution declaration. No run has happened.

  what_this_is_not:
    - Not an attack on AES, not a key recovery, not a distinguisher
      certificate, and not a claim about full-round or deployed AES.
    - Not a claim that MixColumns is weak; the predicted and expected
      disposition is a CLOSED NEGATIVE (MixColumns coefficients are
      unexceptional relative to the slope-generic law), and this contract
      does not treat that expectation as a foregone conclusion -- the
      falsifiers F9-a/F9-b/F9-c remain live and are evaluated exactly as
      written.
    - Not a relation to any named baseline mechanism, published attack, or
      the published state of the art in either direction.
    - Not an approval, a freezing, an execution authorization, a run, an
      observation, or evidence.

  claim_ceiling:
    tier: control
    exact_scope_a_run_could_support: >-
      CONTROL ONLY, and only the specific instrument, arms and round counts
      declared here. A completed run could support, at most: (1) that the
      Inv-conic bound holds exactly (max_b N(a,b) = 2 for every nonzero a,
      N(0,b) = 1 for every b); (2) that the measured/predicted
      byte-coincidence ratio at r in {3,4} is within [0.9, 1.1] in both the
      AES-MixColumns arm and the alternative-MDS arm, OR that it is not,
      with the residual reported as the finding either way; (3) that the
      arm-A/arm-B ratio is or is not within 3 sigma of the fibre-histogram
      prediction. NOTHING ELSE. No outcome may be quoted as a distinguisher,
      a key-recovery precursor, an exponent, a crypto-scale result, or a
      statement about deployed AES.

  inputs:
    field: "GF(2^8), AES modulus x^8+x^4+x^3+x+1 (0x11b)"
    sbox: "AES S-box, S = L o Inv, L the fixed GF(2)-affine map with constant 0x63"
    round_counts: [3, 4]
    stage0_grid: "all 256 slopes a in GF(2^8), all 256 values b, no AES query"
    stage1_structures_per_arm: 1073741824  # 2^30
    alternative_mds:
      construction: >-
        An invertible all-nonzero 4x4 MDS-shaped matrix over GF(2^8) whose
        coefficients are drawn from slopes at the fibre-histogram extremes
        (max fibre size 8 and max fibre size 4, per the Stage-0 histogram
        {4:84, 5:136, 6:31, 7:3, 8:1} over the 255 nonzero slopes),
        constructed and frozen BEFORE Stage 1 is read.
    seeds:
      master_seed: 5ec78f01
      domain: "EXP-AES-5ec78f/v1"
      seed_derivation_rule: >-
        ASCII bytes of domain || "|" || label || "|" || decimal(round) || "|"
        || decimal(arm) || "|" || decimal(structure_index), hashed with
        SHA-256; digest interpreted big-endian unsigned, structure inputs
        derived by rejection sampling. Labels are exactly one of
        {"struct-p1", "struct-p2", "exchange-subset"}. This rule reproduces
        every instance bit-for-bit from (master_seed, domain, label, round,
        arm, structure_index) and nothing else.

  arms_and_controls:
    treatment_aes: >-
      Real AES MixColumns arm. 2^30 two-round (r in {3,4}) exchange/mixture
      structures; measure byte-coincidence rate; divide by the Stage-0-frozen
      prediction for the AES MixColumns coefficient set.
    alternative_mds_arm: >-
      Same construction with the alternative-MDS matrix substituted for
      MixColumns; measure byte-coincidence rate; divide by the
      Stage-0-frozen prediction for THAT matrix's coefficient set (drawn at
      the fibre-histogram extremes).
    prp_arm: >-
      Matched PRP arm at identical structure count and code path, to confirm
      the measurement pipeline shows no artifact-driven coincidence excess
      absent any structured diffusion layer.
    r10_decay_arm: >-
      Round count 10 within this reduced-round harness (not a full-round
      claim). A coincidence-rate excess that fails to decay by r=10 is
      treated as an artifact tell per RQ-AES-001 null-object-control
      discipline.
    random_bijective_sbox_arm: >-
      Real MixColumns, S-box replaced by a uniformly random 8-bit bijection.
      Isolates whether any observed AES-arm/alt-MDS-arm divergence is
      S-box-specific rather than diffusion-layer-specific.
    known_answer_gate_inv_conic: >-
      For Inv (not S), max_b N(a,b) = 2 for every nonzero slope a, exactly,
      with zero exceptions -- a hard, exact, re-derivable algebraic fact
      (Graph(Inv) is the conic xy=1 plus the origin). Any N > 2 voids the
      instrument.
    known_answer_gate_bijection: >-
      For S (and for the alternative-MDS arm's own S-box), N(0,b) = 1 for
      every b exactly -- 256 fibres of size 1, forced by bijectivity.
    ordering_control: >-
      Stage 0 (the frozen fibre-histogram digest and both known-answer
      gates) is computed and committed BEFORE any Stage-1 treatment number is
      read, in both arms.

  stages_cheapest_first:
    - id: stage-0-fibre-histogram
      cost: "milliseconds, one core, no AES query"
      content: >-
        Exhaustive fibre-size histogram of x -> S(x) + a*x over all 256
        slopes and all 256 values (2^16 operations); Inv-conic gate;
        bijection gate; alternative-MDS matrix construction and its own
        fibre-histogram build.
      can_terminate_run: true
      termination_rule: >-
        Any Inv-conic or bijection gate failure ends the contract here with
        an instrument-void verdict and zero Stage-1 compute spent.
    - id: stage-1-coincidence-measurement
      cost: "~30 s/core per (arm, round); ~4 core-minutes for 2 rounds x 4 arms, per the source entry's own charged-cost derivation"
      content: >-
        2^30 structures per arm at r in {3,4} for all four arms (AES,
        alt-MDS, PRP, random-bijective-S-box) plus the r=10 decay arm;
        measured/predicted ratio computed against the frozen Stage-0
        digests.
      can_terminate_run: false
      termination_rule: >-
        Runs to completion or the declared wall-clock/CPU budget ceiling; a
        budget halt is infrastructure signal, never negative mathematical
        evidence.

  metrics:
    primary:
      - "measured_predicted_ratio(arm, round): byte-coincidence rate / Stage-0-frozen prediction, per arm per round."
      - "arm_A_arm_B_ratio: AES-arm rate / alt-MDS-arm rate, versus the ratio predicted from their two frozen fibre histograms."
      - "inv_conic_gate: max_b N(a,b) over all nonzero a, for Inv (must be exactly 2)."
      - "bijection_gate: N(0,b) for every b, for S and for the alt-MDS matrix's S-box (must be exactly 1)."
    secondary:
      - "prp_arm_ratio: measured/predicted-equivalent baseline reading."
      - "r10_decay_ratio: coincidence excess at r=10 across arms."
      - "random_bijective_sbox_arm_ratio: isolates S-box-specificity."
      - "fibre_histogram_maxima_full_table: all 255 nonzero-slope maxima, cross-checked against the source entry's own re-derived {4:84,5:136,6:31,7:3,8:1}."

  heuristic_under_test: null

  preregistered_prediction:
    quantity: >-
      (i) measured_predicted_ratio in both arms at r in {3,4}; (ii)
      arm_A_arm_B_ratio; (iii) inv_conic_gate; (iv) bijection_gate.
    formula: >-
      (i) 1.00 +/- resolution, target band [0.9, 1.1] (F9-a). (ii) within 3
      sigma of the ratio predicted from the two frozen fibre histograms
      (F9-b). (iii) exactly 2 for every nonzero a (conic statement, exact).
      (iv) exactly 1 for every b (bijectivity, exact).
    source: >-
      H-AES-5c1c01 mechanism section, itself transcribing catalogue entry
      A1-9's own derivation (ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/A1.md
      lines 699-733), including the session-recomputed maxima histogram
      {4:84,5:136,6:31,7:3,8:1}. No external source is cited for any of this.

  scale_relevance:
    tier: control
    justification: >-
      Stage 0 is an exact, exhaustive, algebraic computation over the full
      256-element field -- a derivation check, not an extrapolation. Stage 1
      is a toy-scale, reduced-round (r in {3,4}) measurement with no key
      recovery, no adaptive oracle beyond chosen-plaintext structure
      construction, and no claim about full-round or deployed AES. The
      expected disposition is a closed negative about the specific MixColumns
      coefficient set, which is itself a legitimate control-tier result under
      docs/inventor-protocol.md section 8, not a crypto-scale validation.
    correspondence: null

  tail_checks:
    - >-
      Extreme-slope check: the alternative-MDS matrix is deliberately drawn
      from the fibre-histogram extremes (max=8 and max=4); the
      measured/predicted ratio must hold in [0.9,1.1] even at these tail
      slopes, which is the sharpest test of the slope-generic model, not just
      the bulk-behavior slopes MixColumns itself uses.
    - >-
      r=10 decay check: the coincidence excess (if any survives r in {3,4})
      must not persist at r=10; persistence is the canonical artifact tell
      per RQ-AES-001 discipline.

  replication:
    seeds: [1425131265, 1425131266, 1425131267]  # 0x5ec78f01 + {0,1,2}
    independent_instances: 3
    interpretation: >-
      Three seeds reseed the 2^30-structure sample. Stage-0 quantities (the
      fibre histogram, both known-answer gates) are exact algebra and MUST
      be seed-invariant exactly; any seed-dependence there is
      invalid_measurement. Stage-1 coincidence rates are Monte Carlo
      estimates and seed-to-seed variation is expected and reported as a
      spread.

  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 1
    maximum_memory_gb: 1
    maximum_runs: 3

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, and authorized under GOAL-AES-001's active batch.
    - Stop before any Stage-1 number is read if the Stage-0 fibre-histogram digest and both known-answer gates are not committed.
    - Stop the whole package on any Inv-conic gate failure (any N(a,b) > 2 for Inv, nonzero a).
    - Stop the whole package on any bijection-gate failure.
    - Stop at the first budget, memory, or wall-clock ceiling and record what was covered rather than truncating silently.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any change to the alternative-MDS matrix, the round counts, or the [0.9,1.1] / 3-sigma thresholds after any Stage-1 number has been observed.
    - Any comparison of a measured_predicted_ratio with a published or recalled cryptanalytic figure.
    - Absence of the pre-treatment commitment of the PRP and random-bijective-S-box control arms.
    - Reporting the alternative-MDS matrix's coefficients as chosen AFTER seeing Stage-1 AES-arm results (the matrix must be frozen at Stage 0, before any Stage-1 read).

  success_criterion: >-
    This contract has no current success outcome because it is not
    authorized for execution. IF a separately approved, frozen successor is
    executed, its only positive disposition is: the Inv-conic and bijection
    gates both pass exactly; measured_predicted_ratio is within [0.9,1.1] in
    both the AES and alt-MDS arms at both r=3 and r=4; the arm-A/arm-B ratio
    is within 3 sigma of the fibre-histogram-predicted ratio; the PRP,
    random-bijective-S-box and r=10 decay controls behave as expected (no
    unexplained excess, no persistence at r=10). THAT DISPOSITION
    ESTABLISHES NO ATTACK, NO KEY RECOVERY, AND NO CRYPTO-SCALE OR
    DEPLOYED-SCHEME CONCLUSION -- at most a scoped closed-negative statement
    that the specific AES MixColumns coefficients are coincidence-generic
    relative to the slope-local fibre law, which is itself a genuinely
    undetermined outcome in advance: F9-a, F9-b and F9-c name concrete,
    reachable alternative dispositions (the fibre model failing, the two
    arms diverging beyond the predicted ratio, or the conic gate itself
    failing), none of which is foreclosed by this specification.

  falsification_criterion: >-
    H-AES-5c1c01 is falsified, in whole or in the named part, by any of:
    (F9-a) measured/predicted outside [0.9,1.1] in either arm -- the
    slope-local model does not govern the coincidence rate, and the residual
    is the finding;
    (F9-b) arm-A/arm-B ratio departs from the fibre-histogram prediction by
    more than 3 sigma -- the MixColumns coefficients are doing something the
    fibre law does not capture;
    (F9-c) the Inv gate returns any N > 2 -- instrument void (the conic
    statement is exact and its failure invalidates the run, not the
    mathematics).

  outcomes:
    no_execution_authorization: >-
      The only current disposition: a review_required draft. No run, no
      observation, no evidence, no inference.
    future_complete_readout: >-
      Only after separate approval, freezing, authorization, and valid
      execution under GOAL-AES-001; scoped control-tier, AES-128, r in
      {3,4}, and never a distinguisher or key-recovery claim by itself.
    infrastructure_or_integrity_failure: >-
      A timeout, crash, or implementation failure is recorded as
      INFRASTRUCTURE SIGNAL and is NEVER negative mathematical evidence
      against H-AES-5c1c01 or IDEA-20260807-4ee607 (AGENTS.md rule 5).

  required_artifacts_if_later_authorized:
    - Frozen approved specification with a freeze receipt binding its SHA-256.
    - Stage-0 fibre-histogram table (all 255 nonzero-slope maxima and the full partition shapes), digested and committed before Stage 1.
    - The frozen alternative-MDS matrix definition and its own fibre-histogram table.
    - Raw per-arm, per-round coincidence counts sufficient for independent ratio recomputation.
    - Manifest, environment, exact argv, stdout, stderr, timestamps, and resource measurements.
    - Snapshot archive followed by independent validation and red-team review.

  approval_requirements:
    - Independent review confirms the Inv-conic derivation (Graph(Inv) is the conic xy=1 plus the origin) and the L-not-Inv obstruction argument before any compute is authorized.
    - Independent review confirms the alternative-MDS matrix is frozen at the fibre-histogram extremes BEFORE Stage 1 is read, and that it is genuinely invertible and all-nonzero.
    - Coordinator separately approves and freezes a successor contract without editing this draft.
    - GOAL-AES-001's active batch (current_batch_id) has capacity for this task under its campaign budget before dispatch.

  approval_status: >-
    Pending review. No approved_by field is present because this draft is
    not approved and only the Coordinator may approve it (AGENTS.md rule 1).
  approved_by: null
