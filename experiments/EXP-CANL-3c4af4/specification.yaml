experiment:
  id: EXP-CANL-3c4af4
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-11b93d
  question_id: RQ-CANL-63098f
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE SMALL-DISCRIMINANT ESCAPE AND EXACTLY HOW MUCH OF IT IS REAL: when |disc End| = O(1)
    the norm-form gap closes and the CM order genuinely enlarges the Xedni coefficient set from 2C_0+1
    to about 2 pi C_0^2 / sqrt(|D_E|) per slot, but the norm-ONE part of that gain is the unit group
    and produces only cyclotomic tautologies that reduce to 0 = 0 mod N -- so the surviving gain is
    a constant factor of order C_0 with the instance count still Theta(N)'
  status: draft
  objective: "(A) THE REGIME THIS RECORD OWNS. IDEA-20260807-fd5a24 proves that every alpha in O \\\
    \ Z has N(alpha) >= |D_E|/4, hence contributes nothing to a Xedni relation whose coefficients\
    \ are constrained to N(alpha) <= C_0^2, WHENEVER |D_E| > 4C_0^2. This record owns the complementary\
    \ regime |D_E| <= 4C_0^2. That regime is not a curiosity: |D_E| = |D_0| f_E^2 is small exactly\
    \ for curves at the crater of a volcano whose fundamental discriminant is small, i.e. j = 0 (D_0\
    \ = -3, exists over F_p for every p = 1 mod 3), j = 1728 (D_0 = -4, p = 1 mod 4), and the finitely\
    \ many j that are roots of H_{D_0} for small |D_0|. secp256k1 is y^2 = x^3 + 7, a j = 0 curve,\
    \ so its canonical lift has CM by Z[zeta_3] with |D_E| = 3. THE ESCAPE REGIME CONTAINS A DEPLOYED\
    \ CURVE, and this record is written because dismissing it would be exactly the premature closure\
    \ docs/inventor-protocol.md forbids.\n(B) THE GAIN, COMPUTED EXACTLY. O is a lattice in C of covolume\
    \ sqrt(|D_E|)/2. The elements of norm at most C_0^2 are the lattice points in a disc of radius\
    \ C_0, so\n    |{alpha in O : N(alpha) <= C_0^2}| = 2 pi C_0^2 / sqrt(|D_E|)\n               \
    \                          + O(C_0/|D_E|^{1/4} + 1).\nAt |D_E| = 3 this is 3.63 C_0^2 + O(C_0);\
    \ at |D_E| = 4 it is 3.14 C_0^2 + O(C_0). Compare the Z-case count 2C_0 + 1. SO IN THE SMALL-|D_E|\
    \ REGIME CM MULTIPLIES THE PER-SLOT COEFFICIENT COUNT BY ABOUT 1.8 C_0, AND SIMULTANEOUSLY HALVES\
    \ THE NUMBER OF SLOTS (r_O + 1 = r_Z/2 + 1 instead of r_Z + 1). Net reachable-residue count:\n\
    \    Z-case:  (2C_0+1)^{r_Z+1}      ~ (2C_0)^{r_Z+1}\n    CM-case: (3.6 C_0^2)^{r_Z/2+1} ~ 3.6^{r_Z/2+1}\
    \ C_0^{r_Z+2}\nso the CM case is larger by a factor about (3.6/4)^{r_Z/2} * 3.6 * C_0/2. THIRD\
    \ EXACT NUMBER (after fd5a24's two): at small |D_E| the CM structure multiplies the reachable-k\
    \ count by Theta(C_0) while halving the number of points to lift. That is a genuine improvement\
    \ and it must be stated as one.\n(C) THE PART OF THE GAIN THAT IS FAKE, AND WHY. The norm-1 elements\
    \ of O are exactly the units, O^* -- six for D_E = -3, four for D_E = -4, two otherwise. They\
    \ act on Ẽ as AUTOMORPHISMS, and the relations they generate are the cyclotomic identities: 1\
    \ + zeta_3 + zeta_3^2 = 0 in Z[zeta_3], 1 + i^2 = 0 in Z[i]. Applied to any point P̃ these give\n\
    \    P̃ + zeta_3 P̃ + zeta_3^2 P̃ = O\nwhich is not a relation among independent points at all\
    \ -- it is the Z-dependence of three vectors in the rank-2 Z-module O P̃. Reducing mod p: lambda(zeta_3)\
    \ =: mu satisfies mu^2 + mu + 1 = 0 in Z/N, so the reduced relation is (1 + mu + mu^2) P = O,\
    \ i.e. 0 = 0. IT CARRIES NO INFORMATION ABOUT k, FOR ANY P, FOR ANY CURVE. It is target-independent\
    \ by construction. THIS PROGRAM HAS ALREADY FOUND THE SAME PHENOMENON IN A DIFFERENT SETTING:\
    \ KN-FIND-003 (promoted by DEC-20260724-022 from EV-XEDN-002) records that on the isotrivial j\
    \ = 0 function-field family the counted sections form mu_3 orbits whose specialised relation \"\
    is a tautology\" (KN-FIND-008). That was over F_p(t) with Shioda heights; this is over a number\
    \ field with Neron-Tate heights. Two independent settings, one mechanism. The consilience is evidence\
    \ that the tautology is structural rather than an artifact of either family.\n(D) THE PART OF\
    \ THE GAIN THAT IS REAL. NOT ALL small-norm elements are units. In Z[zeta_3] the elements of norm\
    \ 3 include 1 - zeta_3 (the ramified prime), norm 4 includes 2, norm 7 includes 3 + zeta_3, and\
    \ so on. These are NOT automorphisms, the relations they generate are NOT tautologies, and lambda(alpha)\
    \ = a + b*mu is a genuinely new residue for each (a,b). So the Theta(C_0) enlargement survives\
    \ after deleting the O(1) units. FOURTH EXACT NUMBER: the surviving enlargement is (2 pi C_0^2/sqrt(|D_E|)\
    \ - |O^*|), which is Theta(C_0^2) per slot, so the reachable-k count gains Theta(C_0^{r_Z/2+1})\
    \ relative to naive counting and Theta(C_0) relative to the Z-case at matched Z-rank.\n(E) WHY\
    \ THAT STILL DOES NOT MOVE THE EXPONENT, AND THE HONEST BOTTOM LINE. The instance count is I =\
    \ N / (reachable-k count). Every factor computed above is a function of C_0 and r_Z alone, both\
    \ absolute constants at fixed arity (ECFG-P1543-R1: \"fixed arity 2 <= r <= 9\"). So\n    I_CM(small\
    \ |D_E|) = N / Theta(C_0^{r_Z+2}) = N^{1 - o(1)},\nand the exponent of N is 1, against rho's 1/2.\
    \ CM AT SMALL DISCRIMINANT IMPROVES THE CONSTANT AND NOT THE EXPONENT -- which is precisely the\
    \ verdict docs/target-result-profile.md tells this program to record as such rather than to dress\
    \ up."
  resource_label: 'R3 (End(E) as a ring: the unit group, the small-norm elements, and the ring map
    lambda: O -> Z/N) and R6 (the characteristic-zero lift on which those elements act as isogenies
    with degree = norm).'
  admissibility: admissible
  admissibility_argument: 'The proposal''s operative computations -- counting lattice points of the
    norm form inside a disc, separating units from non-units, and evaluating lambda(alpha) = a + b*mu
    -- are all ring-level and take place either in O or on the characteristic-zero lift. NONE of them
    is "apply phi to a point of G". The place where H-ENDO-001 does bite is part (C), and this record
    USES it rather than violating it: the tautology is exactly the statement that the unit orbit collapses
    to a scalar identity mod N. Note also that the admissibility filter would close a naive reading
    of part (D) -- "the extra endomorphisms give extra relations on G" -- if those relations were
    obtained by applying alpha to points of G. They are not; they are obtained from Z-dependences
    in a characteristic-zero Mordell-Weil lattice, and only their REDUCTIONS are scalars. The distinction
    is the whole reason the lane is admissible at all.'
  reachability_gate: null
  inputs:
    procedure: 'STAGE 0 (minutes, zero risk): exact enumeration of S(C_0) and its unit/non-unit split
      for all class-number-one |D_E| and C_0 <= 20. STAGE 1 (HARD GATE, minutes): construct a toy
      j = 0 curve over F_p with p = 1 mod 3 using harness/toycurve.py, find mu, and verify the tautology
      on 1000 random points. Failure halts everything. STAGE 2 (minutes): verify lambda(1 - zeta_3)
      != 0 and enumerate {lambda(alpha)} as a multiset, reporting collisions. STAGE 3 (hours): exact
      reachable-residue counts in both arms at r_Z in {2,4}, C_0 in {2,3,5,8}, at three toy N. STAGE
      4 (minutes): threshold control at |D_E| just above and just below 4C_0^2, identical code. STAGE
      5 (zero compute): charge against 0.886 sqrt(N) and record the exponent.'
    mechanism: 'STEP 1 -- ENUMERATE THE SHELL EXACTLY. For each D_E in the small set {-3,-4,-7,-8,-11,-12,-16,-19,-27,-28,-43,-67,-163}
      (class number one) and each C_0 in {1,...,20}, enumerate S(C_0) = {alpha = a + b w : N(alpha)
      <= C_0^2} by exhaustive integer search, and partition it into units and non-units. Pure integer
      arithmetic, milliseconds. Report the exact counts against the predicted 2 pi C_0^2/sqrt(|D_E|).

      STEP 2 -- CONSTRUCT lambda AND VERIFY THE TAUTOLOGY. For a toy ordinary E/F_p with j = 0 and
      p = 1 mod 3: find mu in Z/N with mu^2 + mu + 1 = 0 (a primitive cube root of unity mod N, which
      exists because N | #E(F_p) and the automorphism zeta_3 acts on E(F_p)); realise zeta_3 explicitly
      as (x,y) -> (mu_p x, y) where mu_p^3 = 1 in F_p; verify on random P in G that zeta_3(P) = [mu]P
      and that P + zeta_3(P) + zeta_3^2(P) = O. THIS IS THE TAUTOLOGY, made concrete and checkable
      in twenty lines of harness code against harness/toycurve.py.

      STEP 3 -- SHOW A NON-UNIT RELATION IS NOT A TAUTOLOGY. Take alpha = 1 - zeta_3, N(alpha) = 3.
      Then lambda(alpha) = 1 - mu, which is NOT zero mod N (since mu != 1 for N > 3). So the relation
      alpha P̃ = (1 - zeta_3) P̃ reduces to [1 - mu] P, a genuine and computable multiple. This separates
      parts (C) and (D) empirically and is the arm that can fail: if lambda(alpha) turned out to be
      0 or 1 for every small-norm non-unit alpha, part (D) would be empty and the escape would be
      entirely fake.

      STEP 4 -- COUNT REACHABLE RESIDUES, BOTH ARMS, EXACTLY. At toy N, for r_Z = 2 and 4, enumerate
      all coefficient tuples in S(C_0)^{r_O+1} and all integer tuples in [-C_0,C_0]^{r_Z+1}, compute
      the induced residues k, and report |{distinct k}| for each arm. This is the direct measurement
      of part (B)''s arithmetic and it is exact, not sampled.

      STEP 5 -- CHARGE IT. Multiply N / |{distinct k}| by the per-attempt cost and compare against
      0.886 sqrt(N). Report the exponent, not a ratio.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - Synthetic rank-2 coefficient ring with no arithmetic (the null object).
  - Threshold pair |D_E| = 4C_0^2 -/+ 1 with identical code.
  - k-resampling control: the tautology must not move with k.
  - Automorphism-discounted rho baseline on the same j = 0 curve (KN-TECH-018).
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. NULL OBJECT: the same reachable-residue
    count run with the CM order replaced by Z x Z with a SYNTHETIC "norm" form of the same determinant
    -- that is, a rank-2 coefficient ring with the right shape and no arithmetic. The reachable-residue
    count in the null arm must be the naive product of coordinate ranges, with no structure; if the
    CM arm does not exceed the null arm, part (D) is empty. DECAY PARAMETER: |D_E|. The gain 2 pi
    C_0^2/sqrt(|D_E|) MUST DECAY LIKE |D_E|^{-1/2} and must reach the Z-case value 2C_0+1 at |D_E|
    ~ 4C_0^2. A measured gain that FAILS TO DECAY as |D_E| grows is the canonical artifact tell and
    indicates the shell enumeration is wrong. SECOND NULL (the tautology arm): resample k with the
    curve and P fixed. The tautology relation must be unchanged -- it is target-independent by construction
    -- while any genuine relation must change. An instrument in which the tautology "moves" with k
    is broken.'
  independent_variables: []
  metrics:
    primary:
    - Exact |S(C_0)| and unit/non-unit split per (D_E, C_0)
    - Multiset {lambda(alpha)} with collision counts
    - Reachable-residue counts, both arms, exact
    - Tautology pass/fail on every sampled point
    secondary:
    - Fitted instance-count exponent with interval
    - Null-arm values for every metric
  heuristic_under_test: null
  preregistered_prediction:
    quantity: '|{alpha in O : N(alpha) <= C_0^2}| measured exactly, versus the predicted 2 pi C_0^2/sqrt(|D_E|),
      for |D_E| in the class-number-one list and C_0 in 1..20'
    formula: Relative error below 15% for C_0 >= 5 at every |D_E|, and the exact integer counts recorded
      for every cell. A systematic sign-consistent deviation above 15% means the covolume sqrt(|D_E|)/2
      is wrong as used.
    source: pre-registered in IDEA-20260807-11b93d before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - lambda collisions. Different alpha can give the same residue mod N, inflating |S| relative to
    the useful count. Measured directly by the multiset metric rather than assumed away.
  - Torsion. On a j = 0 curve the lift has extra torsion; torsion points have height 0 and produce
    spurious "relations". Torsion must be quotiented out before any height or rank is reported, and
    the torsion order recorded.
  - Small N. At toy N the cube root of unity mu may be small or structured, making lambda(alpha) collide
    more often than at crypto N. The k- resampling control and a ladder of N address this; the record
    must not report a residue count from a single N.
  - Twist multiplicity. j = 0 has six sextic twists over F_p with different group orders; every measurement
    names its twist and none are pooled.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Relative error below 15% for C_0 >= 5 at every |D_E|, and the exact integer counts
    recorded for every cell. A systematic sign-consistent deviation above 15% means the covolume sqrt(|D_E|)/2
    is wrong as used.
  falsification_criterion:
  - The tautology check fails on any point. Instrument failure under AGENTS.md rule 5; nothing is
    reported.
  - '|S(C_0)| deviates systematically from 2 pi C_0^2/sqrt(|D_E|). The lattice-point count is wrong
    and part (B) is withdrawn.'
  - lambda(alpha) = 0 for every non-unit alpha in the shell. Part (D) is empty; the escape is entirely
    tautological; the lane closes completely and that is a stronger negative than the one predicted.
  - reachable_residue_gain < 1 at |D_E| = 3. The small-|D_E| escape does not exist even in the constant,
    and fd5a24's theorem is unnecessary.
  - reachable_residue_gain grows faster than C_0^2. The counting is wrong in the attacker's favour;
    the record is superseded and the lane reopens.
  - The threshold control shows the same gain on both sides of |D_E| = 4C_0^2. The measurement is
    not sensitive to the load-bearing structure and no negative may be reported from any arm.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-11b93d
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
