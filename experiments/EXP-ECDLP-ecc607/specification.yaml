experiment:
  id: EXP-ECDLP-ecc607
  hypothesis_id: H-ECDLP-05599b
  version: 1
  title: >-
    Graded Macaulay rank filtration of the toy Semaev decomposition system
    against an exactly ideal-matched random bidegree-(2,2) null, with a
    blocking degree-unmatched positive control, a planted-generator ladder at
    known degrees, and a curve-free arm carrying a pre-declared consequence
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260904-ae82ce

  objective: >-
    Decide whether ANY Groebner observable available to the current toy
    encoding of prime-field point decomposition depends on the summation
    polynomial, once the point set is held EXACTLY fixed. Two generating sets
    of the IDENTICAL ideal are compared degree by degree: the Semaev system
    and a uniformly random bidegree-(2,2) system with the same grid vanishing
    set. Outcome I (filtrations agree) says the lane's cost-model numerator
    is a statistic of Z and B and answers the question's decision target with
    REDESIGN; Outcome II (they separate) isolates Semaev-specific
    generator-level content for the first time. This contract is DRAFT and
    confers no execution authority.

  preregistered_prediction:
    quantity: >-
      The paired per-degree agreement of the graded rank filtrations
      (dim_{F_p} V_D)_{D = 0..2B} of F_sem and F_null within each cell, and
      the derived paired difference Delta_lf = d_lf(F_null) - d_lf(F_sem) in
      integer DEGREES with resolution 1.
    formula: >-
      NO DIRECTION IS PRE-COMMITTED for the F_sem-versus-F_null comparison;
      that is the unknown. What is pre-committed is the DECISION RULE.
      OUTCOME I is declared when the filtrations agree at every degree in at
      least 95 percent of at least 200 cells AND the last fall degrees agree
      in at least 95 percent. OUTCOME II is declared when they disagree at
      one or more degrees in at least 20 percent of cells with a consistent
      direction in at least two thirds of those cells. Anything else is
      INTERMEDIATE and settles nothing. Separately FORCED, with directions
      pre-committed: reduced-basis equality in 100 percent of squarefree
      cells; variable-swap Delta_lf exactly 0; degree-unmatched arm Delta_lf
      at least B - 4 in at least 90 percent of cells with B >= 8; planted
      generator of degree d raises dim V_d by exactly 1 and nothing below.
    source: >-
      The forced-identical reduced basis follows from the m = 2 structure
      theorem relayed from IDEA-20260829-bdca13 (re-checked per cell here
      rather than assumed). The degree-unmatched bound follows from the
      generator degree differing by B - 3. The planted-generator prediction
      follows from the definition of V_D: adjoining one new generator of
      degree d that is already in the ideal adds at most one new spanning
      vector at degree d and none below it.

  inputs:
    curves: "8 curves with generic j-invariant, short Weierstrass, p > 3"
    primes: "p in {2^8, 2^10, 2^12} in scope; 2^14 and 2^16 as flagged out-of-scope calibration"
    factor_base_sizes: "B in {4, 8, 16, 32}"
    arity: "m = 2 in scope; m = 3 OPTIONAL and only if the m = 2 grid is clean"
    targets: >-
      STRATIFIED so |Z| takes each of 0, 1, 2 and 3 at least 40 times;
      |Z| is computed from the group law with NO use of S_3, so the
      stratification variable is independent of the arm under test.
    monomial_order: "grevlex primary, frozen before any cell; lex on a 10 percent subsample as a sensitivity arm only"
    factor_base_precondition: "distinct on-curve x-coordinates, checked per cell"

  independent_variables:
    - "arm: F_sem, F_null (degree- and zero-set-matched), degree-unmatched interpolated null, variable-swap, sparsity-matched null, planted-generator ladder, curve-free"
    - "B in {4, 8, 16, 32}"
    - "p in {2^8, 2^10, 2^12}"
    - "|Z| stratum in {0, 1, 2, 3}"
    - "monomial order (grevlex, lex subsample)"

  null_object:
    name: >-
      F_null, THE EXACTLY IDEAL-MATCHED RANDOM BIDEGREE-(2,2) NULL. Blocking,
      and the deliverable of this lane.
    construction: >-
      F_null = (r(x1,x2), fV(x1), fV(x2)) where r is drawn UNIFORMLY from the
      9-dimensional F_p-space of bidegree-(2,2) polynomials subject to
      r(v_i,v_j) = 0 on exactly the cells of Z and r(v_i,v_j) nonzero on
      every other grid cell. Draws that vanish off Z are rejected and
      redrawn, capped at 100 draws per cell, with the rejection count
      recorded and a cell that fails all 100 recorded as a FAILED
      CONSTRUCTION rather than silently dropped. Because the grid vanishing
      sets coincide and fV is squarefree, F_sem and F_null generate the
      IDENTICAL IDEAL: their reduced bases, staircases, quotient dimensions
      and trivial-ideal flags agree exactly. The two arms are matched on
      variable count, generator count, multidegree support AND exact solution
      set - strictly finer than a support-matched null, which changes |Z| and
      therefore confounds generator structure with solution count.
    non_degeneracy_check: >-
      REQUIRED, AND IT HAS TWO HALVES HERE BECAUSE THE NULL IS PARTLY
      DEGENERATE BY DESIGN.
      (a) THE IDEAL-LEVEL OBSERVABLES ARE WIDTH ZERO BY CONSTRUCTION, AND
      THAT IS DECLARED IN ADVANCE RATHER THAN DISCOVERED. The reduced basis,
      staircase, quotient dimension and trivial-ideal flag CANNOT differ
      between F_sem and F_null, so they carry EXACTLY ZERO discriminating
      power and are used here only as a per-cell PRECHECK on the structure
      theorem, never as a comparison. Any report treating their agreement as
      a finding is misreading this contract.
      (b) THE FILTRATION IS NOT WIDTH ZERO, and this is checked rather than
      assumed. Nothing forces dim V_D(F_sem) = dim V_D(F_null) at any
      intermediate D: the two generating sets have different coefficients and
      the Macaulay ranks are computed independently. The degree-unmatched arm
      DEMONSTRATES empirically that the filtration comparison can separate
      two generating sets of the same ideal, by at least B - 4 degrees; if it
      cannot, the filtration is width zero in practice too, the instrument
      has no power, and the run reports INSTRUMENT FAILURE rather than a
      controlled null. That is why the degree-unmatched arm is blocking and
      runs before the main grid.
    dynamic_range_demonstration: >-
      A PLANTED-GENERATOR LADDER at four known degrees, run before the main
      grid. For each planted d in {3, 5, 9, B-1}, adjoin to F_sem one
      redundant generator of degree exactly d that already lies in the ideal
      (constructed as a monomial multiple of an existing generator, reduced
      to degree d), and recompute the filtration. FORCED: dim V_d rises by
      EXACTLY 1 and dim V_D is UNCHANGED for every D < d, in 100 percent of
      cells. This is a defect of KNOWN SIZE at a KNOWN DEGREE, and it must
      fire at that degree and nowhere else. It measures the engine's
      per-degree resolution rather than asserting it, which is the specific
      gap a single blocking positive control at B - 4 degrees leaves: the
      degree-unmatched arm shows the instrument can see a HUGE difference,
      the ladder shows it can see a difference of ONE at a NAMED degree,
      which is the resolution the main comparison actually needs.
    curve_free_null: >-
      REQUIRED, AND HERE IT IS DECISIVE. Every quantity measured by this
      contract is a graded rank of a Macaulay matrix built from three
      polynomials in F_p[x1,x2]. The only curve inputs are the coefficients
      of S_3 and the fact that V consists of on-curve x-coordinates. A
      non-curve object can therefore reproduce the entire signature. THE ARM:
      replace S_3 by a FIXED bidegree-(2,2) polynomial with the same monomial
      SUPPORT as S_3 and randomly drawn coefficients, and replace V by a
      uniformly random B-subset of F_p with no curve behind it; define Z as
      the resulting grid vanishing set; then build the matched F_null against
      THAT generator by the identical construction and compare filtrations by
      the identical rule, over the same B, p and |Z| strata.
    pre_declared_consequence: >-
      DECLARED IN ADVANCE, BEFORE ANY CELL RUNS, AND BINDING. If the
      curve-free arm reproduces the SAME outcome classification (I, II or
      INTERMEDIATE) as the curve arm at every B and p, then NOTHING measured
      by this experiment may be quoted as a statement about Semaev summation
      polynomials, about elliptic curves, or about the ECDLP. The honest
      headline in that case is a statement about bidegree-(2,2) ideals over
      F_p with a completely split membership polynomial, and every downstream
      citation must carry that scope. Only a MEASURED DIFFERENCE in
      classification between the curve arm and the curve-free arm is quotable
      as curve content, and any such difference is routed to independent
      review before interpretation rather than reported as a finding. NOTE,
      STATED SO IT IS NOT MISREAD: under Outcome I the curve-free arm is
      expected to agree, so Outcome I is expected to be a statement about
      encodings and not about curves - which is precisely the finding, and
      the reason the arm is mandatory rather than optional.

  controls:
    - >-
      REDUCED-BASIS EQUALITY PRECHECK (blocking, per cell, before any
      filtration is compared). The two arms must produce the IDENTICAL
      reduced basis; a single inequality voids the design at that cell and
      the finding is reported as being about the structure theorem or the
      implementation, not about solving degree.
    - >-
      DEGREE-UNMATCHED INTERPOLATED NULL (blocking positive control). Its
      generator has bidegree up to (B-1, B-1) and generates the same ideal,
      so any instrument with power must separate it from F_sem by at least
      B - 4 degrees. If it does not, the line HALTS as an instrument failure
      and NO controlled null may be declared.
    - >-
      PLANTED-GENERATOR LADDER at d in {3, 5, 9, B-1} (blocking). See
      null_object.
    - >-
      VARIABLE-SWAP ARM (blocking false-positive check). S_3 is symmetric in
      x1 and x2, so swapping must give EXACTLY zero difference. Any nonzero
      value is an engine bug and blocks every other number.
    - >-
      m = 1 GCD KNOWN-ANSWER EDGE and the B = 1 HAND CELL (blocking). Both
      arms must agree at B = 1 by hand, and the engine must reproduce the gcd
      degree at m = 1.
    - >-
      SPARSITY-MATCHED NULL (required third arm). S_3 has a specific sparse
      coefficient pattern while a uniform bidegree-(2,2) polynomial is dense,
      so a filtration difference could reflect SPARSITY rather than Semaev
      structure. Run a null uniform over bidegree-(2,2) polynomials with the
      SAME monomial support as S_3 subject to vanishing on Z, wherever the
      support allows the |Z| conditions to be satisfied; where it does not,
      the cell is reported as sparsity-unmatched rather than dropped.
    - >-
      UNSATISFIABLE ARM. |Z| = 0 cells give the unit ideal in both arms; the
      filtration comparison is still run there and reported SEPARATELY,
      because a difference in HOW the two arms reach the unit ideal is itself
      a generator-level signal.
    - >-
      ORDER SENSITIVITY ARM. Grevlex primary, lex on a 10 percent subsample.
      The last fall degree is the headline because it is order-independent;
      the solving degree is order-dependent and is reported PER ORDER, never
      pooled.
    - >-
      INDEPENDENT-IMPLEMENTATION SUBSAMPLE. 20 cells re-computed by a second
      exact linear-algebra path; a disagreement is an INSTRUMENT FAILURE and
      is reported as such, never as a finding about solving degree.
    - >-
      CERTIFICATE ARM. Cells with |Z| >= 1 emit a decomposition certificate
      re-verified by independent point addition; cells with |Z| = 0 emit the
      checkable negative certificate (the sorted 2B candidate list, verified
      disjoint from V in O(B log B)).
    - >-
      CURVE-FREE ARM (blocking) with the pre-declared consequence above.

  metrics:
    primary:
      - "dim_{F_p} V_D for both arms, every cell, every degree D = 0..D_max; INTEGER vector-space dimension; the primary comparison is per-degree paired equality"
      - "Delta_lf = d_lf(F_null) - d_lf(F_sem), paired per cell; INTEGER DEGREES, resolution 1; reported as a paired median with a blocked bootstrap 95 percent interval"
      - "per-cell fraction of degrees at which the two filtrations agree; dimensionless in [0,1]; the OUTCOME I / II rule is applied to this"
      - "degree-unmatched arm Delta_lf; INTEGER DEGREES; forced at least B - 4 in at least 90 percent of cells with B >= 8"
      - "planted-generator ladder: dim V_d increment and the largest D < d with any change; INTEGER; forced +1 and none respectively"
    secondary:
      - "per-degree excess dim V_{D+1} - dim(S_1 times V_D), both arms; INTEGER"
      - "solving degree per arm per order; INTEGER DEGREES; never pooled across orders"
      - "reduced-basis equality result per cell; boolean"
      - "variable-swap Delta_lf; INTEGER DEGREES; forced 0"
      - "null-construction success rate and number of redraws per cell; integer count out of 100"
      - "|Z| per cell, computed from the group law with no use of S_3; integer in {0,1,2,3}"
      - "certificate verification pass or fail, positive and negative arms; boolean"
      - "sparsity-matched arm Delta_lf where constructible; INTEGER DEGREES"
      - "curve-free arm: full filtration, Delta_lf, and outcome classification; same units as the curve arm"
      - "independent-implementation agreement on the 20-cell subsample; boolean per cell"
      - "pre-flight column and row counts; integers. Peak RSS in GiB and wall-clock seconds per cell"
      - "count of cells aborted as not computable in budget; integer"

  heuristic_under_test: HEUR-SDEG-2

  scale_relevance:
    tier: toy
    justification: >-
      p at most 2^16 (2^12 in scope), B at most 32, m = 2 with m = 3
      optional, one frozen monomial order, exact rank over F_p. NO TRANSFER
      TO CRYPTOGRAPHIC SCALE IS CLAIMED OR LICENSED, and none is possible
      from these parameters: the measured quantity is floored at B by the
      encoding and is a property of a generating set, a monomial order and an
      exact-rank convention, none of which survives a change of encoding.
      THE FULL CLAIM THE LANE ULTIMATELY WANTS - how the solving degree of
      prime-field summation-polynomial systems grows toward cryptographic
      parameters - CANNOT BE TESTED AT REACHABLE SCALE BY THIS OR ANY NEARBY
      CONTRACT, and this contract does not shrink that claim silently: it
      measures a strictly prior question, whether the observable depends on
      the summation polynomial at all.
    correspondence: null

  tail_checks:
    - "The largest-B and largest-D cells, where implementation differences are most likely to surface, reported individually."
    - "The 10 cells with the most extreme Delta_lf, reported with their curve invariants, to check whether the tail is a special-j or 2-torsion artifact."
    - "Cells with the largest B^2/p ratio - B = 32 at p = 2^8, where B^2/p = 4 and the null-construction bound is VACUOUS - reported separately and expected to require many redraws or to fail construction outright."
    - "Any cell where all 100 null draws are rejected, reported individually as a forced-vanishing configuration, which is a structural fact about that configuration."
    - "The intra-curve correlation of Delta_lf, reported explicitly, since cells share curves and seeds."

  replication:
    seeds: [11, 22, 33, 44, 55]
    independent_instances: 8
  seeds_policy: >-
    Five declared seeds, fixed here before execution and never re-drawn after
    an outcome is seen. Seeds govern the null draws, the factor-base draws
    and the target stratification sampler; the RNG algorithm and its state
    are recorded per cell so any cell is reproducible in isolation. Both arms
    of a pair run on the SAME curve, factor base, target and ideal - the
    pairing is the design fact that cancels cell-level nuisance parameters -
    so a seed indexes a PAIR, never one arm. Bootstrap resampling is BLOCKED
    BY CURVE as well as by cell, and if the two intervals differ by more than
    a factor 1.5 in width the naive interval is discarded and only the
    blocked one is reported. A cell re-run under a new seed is a NEW cell.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 8
    maximum_workers: 1
  budget_note: >-
    Sized to the work. At the worst declared m = 2 cell (B = 32, D_max = 64)
    the Macaulay matrix is 2145 columns by about 6500 rows, roughly 56 MB
    dense; at the worst optional m = 3 cell (B = 8, D_max = 24) it is 2925
    columns by about 8000 rows, roughly 94 MB. Both are three orders of
    magnitude below the memory stop this program recorded against a chained
    boolean encoding in a different lane, which was an INFRASTRUCTURE stop
    and never negative mathematical evidence. A PRE-FLIGHT column-and-row
    count runs before every allocation and ABORTS the cell if columns exceed
    100,000 or the projected dense working set exceeds 4 GiB. Peak RSS is a
    required reported metric precisely so the envelope prediction can fail.

  stopping_rules:
    - "STAGE 0, zero compute, HARD GATE: write the one-line proof of the definitional split and the B = 1 hand computation for both arms. If the B = 1 arms do not agree, the design is void and the run STOPS."
    - "STAGE 0 also re-reads the committed harness source and confirms the bidegree-(2,2) claim that fixes the null's construction space; if the bidegree has changed, the null is re-specified before anything runs."
    - "STAGE 1: build and validate the exact graded rank engine on the m = 1 gcd edge and the B = 1 cell. A miss STOPS the run."
    - "STAGE 2: the blocking controls - degree-unmatched arm, variable-swap arm, planted-generator ladder - run BEFORE the main grid. Any failure STOPS the run and reports an instrument failure."
    - "STAGE 3: the main grid, at least 200 cells. STAGE 4: the curve-free arm. STAGE 5: the m = 3 analogue, OPTIONAL, and only if Stage 3 is clean."
    - "A cell exceeding the pre-flight column or memory threshold is recorded as not computable in budget and is an INFRASTRUCTURE stop under AGENTS.md rule 5, never evidence."

  invalidation_rules:
    - "Any execution while status is not approved, or while execution_authorized is false."
    - "Using a computer-algebra termination event anywhere in place of an exact graded rank."
    - "Comparing filtrations at a cell whose reduced-basis equality precheck failed."
    - "Pooling solving degrees across monomial orders, or reporting an absolute last fall degree as a result."
    - "Reading any yield or coverage statement off this battery; targets are stratified by |Z| and no such statement is admissible."
    - "Fitting a scaling law to Delta_lf under Outcome I or under an INTERMEDIATE result."
    - "Any post-hoc change to the 95 percent, 20 percent or two-thirds thresholds, or to the planted-generator forced values. A change requires a versioned protocol_amendment before the affected cells are re-read."
    - "Transferring any conclusion to the chained boolean encoding of a different lane; that encoding is different and nothing here reaches it."

  success_criterion: >-
    The run SUCCEEDS as a measurement, whichever outcome it reaches, when:
    the B = 1 and m = 1 known-answer edges reproduce exactly; the
    degree-unmatched arm separates by at least B - 4 degrees in at least 90
    percent of cells with B >= 8; the variable-swap arm gives exactly 0 in
    100 percent of cells; every planted generator raises dim V_d by exactly 1
    at its own degree and nothing below; the reduced-basis equality precheck
    passes in 100 percent of squarefree cells; at least 200 cells are
    recorded with all four |Z| strata populated at least 40 times each; the
    curve-free arm is run and classified; and the outcome is declared as
    exactly one of OUTCOME I, OUTCOME II or INTERMEDIATE by the
    pre-registered rule with the disagreeing cells listed individually.

  falsification_criterion: >-
    THE DESIGN IS VOID at any squarefree cell where the two arms produce
    different reduced Groebner bases. THE INSTRUMENT IS BLIND, and no
    controlled null may be declared, if the degree-unmatched arm shows
    |Delta_lf| below 1 in more than 10 percent of cells with B >= 8, if the
    variable-swap arm is nonzero anywhere, or if any planted generator fails
    to fire at exactly its own degree. OUTCOME I is declared, and the lane's
    decision target answered REDESIGN, when the filtrations agree at every
    degree in at least 95 percent of at least 200 cells while the
    degree-unmatched arm separates cleanly. OUTCOME II is declared when they
    disagree at one or more degrees in at least 20 percent of cells with a
    consistent direction in at least two thirds. A signal that is nonzero but
    does NOT decay as B grows at fixed |Z| MUST be reported as suspected
    artifact before it is reported as signal. THE SCOPE COLLAPSES TO A
    NON-CURVE STATEMENT if the curve-free arm reproduces the same outcome
    classification, and in that case the pre-declared consequence binds.

  required_artifacts:
    - "Stage 0 receipt: the one-line proof of the definitional split, the B = 1 hand computation for both arms, and the harness source sha256 with the bidegree claim quoted."
    - "Per-cell records: p, curve, B, seed, |Z|, arm, full filtration dim V_D for every D, per-degree excess, last fall degree, solving degree per order, reduced-basis equality result, null redraw count."
    - "The blocking-control table: degree-unmatched Delta_lf per cell, variable-swap Delta_lf per cell, planted-generator ladder increments per d per cell."
    - "The curve-free arm table with the identical columns and its outcome classification."
    - "Independent-implementation subsample agreement receipt for 20 cells."
    - "Certificates: decomposition certificates for |Z| >= 1 cells re-verified by independent point addition; checkable negative certificates for |Z| = 0 cells."
    - "Pre-flight column and row counts, peak RSS, wall clock per cell; the list of cells aborted as not computable in budget."
    - "Run manifest with exact command, git commit and dirty-tree state, environment and dependency versions, RNG algorithm and seeds, requested policy, resolved model identifier and probe status, stdout and stderr."

  assigned_to: executor

  limitations:
    - >-
      INSTRUMENT CALIBRATION ONLY. No attack, no exponent, no cost model, and
      Outcome II is a distinguisher between two generating sets rather than
      an algorithm.
    - >-
      Every number is a property of a generating set, a monomial order and an
      exact-rank convention, and must never be quoted as an ideal invariant.
    - >-
      The measured "solving degree" is an exact graded rank threshold, not
      what a production F4 or F5 would reach.
    - >-
      Absolute last fall degrees are floored at B by the encoding, so only
      matched differences are interpretable.
    - >-
      Toy scale, m = 2 in scope, one frozen order. THE LANE'S ULTIMATE CLAIM
      about growth toward cryptographic parameters cannot be tested at
      reachable scale by this contract, and that is stated rather than
      quietly narrowed.
    - >-
      Under Outcome I the curve-free arm is EXPECTED to agree, which means
      Outcome I is expected to be a statement about encodings and not about
      elliptic curves. That expectation is recorded before the run so it
      cannot be presented afterwards as a surprise or as a curve result.
    - >-
      The m = 3 analogue would need an S_4 instrument that does not exist in
      the committed harness today and is therefore explicitly optional; its
      absence cannot invalidate the m = 2 result.
