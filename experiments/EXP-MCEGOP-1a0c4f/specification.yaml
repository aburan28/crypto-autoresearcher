experiment:
  id: EXP-MCEGOP-1a0c4f
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-023239; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-023239
  question_id: RQ-MCE-e65b3c
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Full empirical distribution of the square-code dimension defect over 200 toy Goppa keys,
    200 matched random binary codes and 200 random alternant codes per cell, reported as ROC, AUC,
    equal-error rate and overlap count with a same-arm self-null
  objective: 'One uncertainty is reduced: whether the square-code dimension defect is an INSTRUMENT
    at this program''s reachable scale, meaning a statistic with a measured decision-error rate, or
    merely a quantity with different averages in two populations. Stated in parts: (i) SEPARATION
    WITH AN ERROR RATE -- what is the AUC and equal-error rate of D separating toy Goppa keys from
    matched random binary codes at identical (n, k), and how many integer values of D are attained
    by both arms. A gap between means with heavy overlap is not an instrument, and only the overlap
    count settles it. (ii) WHAT THE STATISTIC IS ACTUALLY SEEING -- whether the same statistic also
    separates Goppa from random ALTERNANT codes at the same (n, k). If it does not, D measures alternant
    structure rather than Goppa structure, which is directly relevant to the axis RQ-MCE-3f7c02 identified
    as decisive, namely code family rather than rate. This arm is the reason the contract exists in
    its present form; it is a competing explanation run in the same invocation, not an afterthought.
    (iii) THE MEASUREMENT''S OWN RESOLUTION -- whether scoring 100 random codes against 100 further
    random codes gives AUC near 0.5. If it does not, the pipeline manufactures separation and every
    other number in the run is void, so this is a gating check and not a reported nicety. No stage
    of this contract touches a real key, a deployed parameter set, or any external text.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A completed run could support exactly this: that at the tested
      toy cells with m <= 6, n <= 64, over the declared samplers and sample sizes, the square-code
      dimension defect had the reported empirical distributions per arm, and the reported AUC, equal-error
      rate and overlap counts, with the same-arm self-null at its reported value. What does NOT follow:
      nothing about Classic McEliece or any standardized parameter set; nothing about the existence
      or non-existence of any distinguisher at any other rate, length or field size; no key recovery
      of any kind, since a distinguisher is not a break and RQ-MCE-e65b3c constraint 4 is binding;
      and no claim that a high AUC at high rate persists at any lower rate, since every toy cell here
      is high-rate by construction and that confound is fatal to transfer.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes). Freeze cells, sample sizes, samplers, matching rule and the
      ROC computation before any draw. STAGE 1 (cost: dependent on proposal 1). Load and re-verify
      the certified fixture generator against its recorded sha256. STAGE 2 (cost: seconds to minutes
      per cell). Draw 200 Goppa keys with independent (L, g, seed), recording realised k. STAGE 3
      (cost: seconds). Draw 200 matched random binary codes at the measured k with rank rejection,
      and 200 random alternant codes at the same (n, k), resampling any that miss the match and recording
      the resample rate. STAGE 4 (cost: minutes per cell). Compute dim(C*C) for all 600 codes by forming
      k(k+1)/2 componentwise products and eliminating over GF(2). STAGE 5 (cost: seconds). Run the
      invariance control: random row operation plus column permutation on 20 Goppa keys, recompute
      D, require no change. STAGE 6 (cost: seconds). Compute pairwise ROCs, AUCs by the Mann-Whitney
      identity, equal-error rates and overlap counts, per cell, with no pooling. STAGE 7 (cost: seconds).
      Run the same-arm self-null. STAGE 8 (cost: minutes). Emit raw sample vectors, not just summaries.
      Total budget 2 CPU-hours across all cells.'
    instrument: Python 3.11 standard library only (numpy absent, verified). Reuses harness/goppa_toy.py
      from proposal 1 for field arithmetic, construction and GF(2) elimination; adds a Schur-product
      routine holding code rows as Python ints and computing componentwise products by bitwise AND,
      then eliminating by XOR. ROC, AUC via the Mann-Whitney U identity, and equal-error rate implemented
      directly from the raw sample vectors with no statistical package. Run through harness/runner.py
      with domain-separated seeds from random.Random. No Sage, no external library, no network.
    parameters: 'Cells: (m,t,n) in {(4,2,16), (4,2,12), (5,3,32), (5,2,28), (5,3,24), (6,4,64), (6,3,48),
      (6,4,40), (6,2,56)}, nine cells, each with k measured rather than assumed. Sample sizes: 200
      per arm per cell, three arms, giving 5400 codes total. Alternant arm multipliers drawn uniformly
      from the nonzero elements of GF(2^m)^n. Matching rule: exact equality of realised k; resample
      on mismatch, cap 10 resamples then report the cell as unmatched. Invariance control on 20 keys
      per cell. Self-null: a 100/100 split of the random binary arm.'
  controls:
  - Matched random binary [n,k] arm at the Goppa arm's measured k, drawn in the same invocation.
  - 'Same-arm self-null: 100 random codes scored against 100 further random codes, AUC required near
    0.5.'
  - Random alternant arm at the same (n,k) as the discriminating competing explanation.
  - 'Invariance control: apply a random invertible row operation and a random column permutation to
    each Goppa key and recompute D, which must be unchanged; any change is an implementation bug.'
  - 'Generic-value control: compute min(n, k(k+1)/2) explicitly per cell and report it, so that a
    defect is always read against the ceiling that defines it.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a matched random binary [n, k] code, sampled by
    drawing a uniformly random (n-k)-by-n GF(2) parity check and resampling on rank deficiency, with
    k taken from the Goppa arm''s MEASURED rank so the arms match exactly. Two hundred are drawn per
    cell and run through the identical Schur-square pipeline in the same invocation. For the signal
    arm to mean anything the null must show: (a) D concentrated at or very near zero, since a random
    code''s Schur square should fill; and (b) in the SAME-ARM self-null, where 100 random codes are
    scored against another 100 random codes, an AUC in [0.45, 0.55]. If the self-null is not near
    one half, the pipeline manufactures separation from nothing and every other number in the run
    is void. A third arm of 200 random alternant codes at the same (n, k) is the discriminating control:
    it is not a null but a competing explanation, and if the Goppa arm does not separate from it,
    the statistic is measuring alternant structure and must be reported as such.'
  independent_variables:
  - cell (m, t, n)
  - arm (goppa | random-binary | random-alternant)
  - sample index / seed
  - control condition (none | row-permutation invariance | self-null split)
  metrics:
    primary:
    - raw per-sample D values
    - AUC per arm pair per cell
    - equal-error rate per arm pair per cell
    - count of D values attained by both arms
    - same-arm self-null AUC
    secondary:
    - realised k and resample rate per arm
    - generic ceiling min(n, k(k+1)/2) per cell
    - wall-clock per cell
    - count of invariance-control failures, required zero
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The AUC of D separating the Goppa arm from the matched random binary arm, and separately
      from the random alternant arm, per cell.
    formula: 'D(C) = min(n, k(k+1)/2) - dim(C*C), where C*C is the GF(2) span of all componentwise
      products of pairs of codewords, computed from the k(k+1)/2 pairwise products of a generator
      basis. AUC(X, Y) = P(D_X > D_Y) + 0.5 P(D_X = D_Y), evaluated as the Mann-Whitney statistic
      on the raw samples. Pre-registered: AUC(goppa, random-binary) >= 0.9 at (5,3,32); AUC(self-null)
      in [0.45, 0.55]; AUC(goppa, alternant) explicitly not pre-committed.'
    source: Pre-registered in the parent proposal IDEA-20260816-023239 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'All cells have m <= 6, n <= 64, t <= 4, inside RQ-MCE-b38a8b''s declared toy boundary
      and far below any deployed set. The transfer assumption is explicitly REFUSED and the reason
      is stated as a confound rather than a caveat: at these sizes k = n - mt forces high rate, and
      high rate is the regime most favourable to this statistic, so a separation here provides no
      evidence about behaviour at lower rate. The only claim made outside a tested cell is the trivially
      checkable one that the generic Schur square fills when k(k+1)/2 >= n.'
    correspondence: null
  tail_checks:
  - Cells where the two arms share any D value are reported with the exact shared values, not just
    an overlap count.
  - Any Goppa sample with D = 0 (no defect at all) is inspected individually, since it would indicate
    either a construction failure or a genuinely generic key.
  - The lowest-rate cell available, (6,4,40) with k = 16, is the one nearest the informative boundary
    and is reported separately.
  - Alternant samples that coincide exactly with a Goppa code in the same cell are detected by code
    equality and counted.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort and report if the same-arm self-null AUC falls outside [0.45, 0.55] at any cell.
  - Abort a cell after 10 failed resamples enforcing the (n,k) match and report it unmatched rather
    than relaxing the matching rule.
  - Cap total wall-clock at 2 CPU-hours and report unreached cells.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: For every cell, raw per-sample D vectors for all three arms are emitted, the
    invariance control passes with zero failures, the same-arm self-null AUC lies in [0.45, 0.55],
    and the three pairwise AUCs, equal-error rates and overlap counts are reported per cell with no
    pooling across cells.
  falsification_criterion:
  - Same-arm self-null AUC outside [0.45, 0.55].
  - Any invariance-control failure.
  - AUC(goppa, random-binary) below 0.9 at the highest-rate cell, which closes the toy lane for this
    statistic.
  - Complete overlap of the Goppa and alternant distributions, which refutes any Goppa-specific reading
    of D.
  - Random binary arm whose modal D is not zero, indicating the arms are mismatched.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-023239
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The random alternant sampler's exact definition -- whether the multiplier is uniform over nonzero
    vectors, whether the support is shared with the Goppa arm, and whether the resulting code is required
    to be non-Goppa -- must be frozen by the Coordinator, because the discriminating arm's meaning
    depends entirely on it.
  - The sample size of 200 is asserted rather than derived; a power calculation for distinguishing
    AUC 0.95 from 1.0 at these discrete supports must be done before freezing.
  - Whether this contract may run before proposal 1's fixture is approved is a Coordinator sequencing
    decision; without the fixture there is no Goppa arm.
