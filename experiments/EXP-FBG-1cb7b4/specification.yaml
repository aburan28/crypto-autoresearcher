  derived_from_idea: IDEA-20260816-405086
  question_id: RQ-FBG-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Attainment-fraction growth ladder: five factor bases at matched size across four group sizes,
    coverage normalised by the exact combinatorial ceiling, with a closed-form random lower anchor
    and a ceiling-attaining upper anchor verified at every rung'
  objective: 'The one uncertainty a run reduces is how a factor-base geometry''s coverage behaves
    across group sizes once the measurement is normalised by the exact combinatorial ceiling, so that
    the comparison is no longer made against a denominator that itself moves with size. Stated in
    parts: (i) CURRENCY CALIBRATION - at every rung of the size ladder, does the matched random base''s
    attainment fraction match its closed-form prediction and does the ceiling-attaining construction
    reach 1.000, since both anchors must land for any intermediate fraction to be readable, and does
    a degenerate small-coset base fall well below the random anchor to establish dynamic range; (ii)
    SLOPE - for each constructible x-line geometry in the panel, what is the slope of attainment fraction
    against the logarithm of group size, with its interval under a family-wise correction across the
    panel, reported in whichever direction it falls; (iii) BAND VALIDITY - does the mean multiset
    count per target stay inside the range where the ceiling is strictly below 1, since above that
    the ceiling saturates and the currency silently degenerates into raw coverage. A run cannot reduce
    uncertainty about relation yield, decomposition cost, linear-algebra cost, index-calculus cost
    or exponent relevance of any kind; it cannot overturn any verdict reached on the yield channel;
    and it cannot say anything about sizes beyond the four tested rungs. The deliverable is a five-line
    attainment plot with two pre-predicted anchors and a slope table.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A completed run could support at most this: on the named toy
      prime-order curves at the four stated group sizes, under the single declared base-size rule
      and at arity 3, with exact coverage counting over the complete target space, the five named
      bases have the reported attainment fractions, the two anchors do or do not land on their pre-computed
      closed-form values, and each constructible geometry''s attainment fraction has the reported
      slope against the logarithm of group size with the reported interval under the stated correction.
      WHAT DOES NOT FOLLOW: no claim of exponent relevance for any slope, in either direction, since
      coverage is not relation yield and attainment is not cost; no revision or contradiction of any
      verdict recorded on the yield channel, which was posed on a different quantity and is not re-run
      here; nothing about relation collection, decomposition, linear algebra or index-calculus cost;
      nothing about sizes beyond the tested rungs or base-size rules other than the declared one;
      nothing operational about the upper anchor, whose discrete logarithms are known by construction;
      and no attack, break, speedup or security consequence. A slope excluding zero supports only
      that measured coverage moves relative to its exact ceiling across the tested range.'
  inputs:
    procedure: 'STAGE 0, freezing (cost: 2 human hours, no compute). Declare the base-size rule; compute
      and freeze, for each of the four sizes, the exact ceiling min(1, mean) and the closed-form random-base
      attainment prediction, before any measurement. STAGE 1, curves (cost: seconds to minutes). Generate
      and verify prime-order toy curves via harness/toycurve.py at all four sizes; build discrete-logarithm
      tables where the upper anchor needs one. STAGE 2, bases (cost: seconds). At each size build
      three constructible x-line geometries, the ceiling-attaining upper anchor, the matched random
      lower anchor and the degenerate small-coset control, all at matched effective size. STAGE 3,
      coverage (cost: dominant; the 2^18 rung is the budget driver at order N times B squared). Exact
      multiset-sum counting over the complete target space per base, with the closed-form total check
      and the ceiling re-check on every cell. STAGE 4, anchors (cost: minutes). Verify both anchors
      against their frozen predictions at every rung; HALT if either misses. STAGE 5, slopes (cost:
      200 permutations per cell plus bootstrap). Fit attainment against the logarithm of size per
      geometry, apply the family-wise correction, report intervals. STAGE 6, report (cost: 2 human
      hours). Emit the plot, the slope table, the anchor residuals and the per-cell mean.'
    instrument: Python 3 with harness/toycurve.py for exact curve arithmetic, point generation, negation
      handling and discrete-logarithm tables; numpy for count vectors, bootstrap and the permutation
      loop; harness/runner.py for run manifests, recorded seeds and the inference block. The ceiling
      and the closed-form random attainment are computed in exact rational or high-precision arithmetic
      and frozen to a file before STAGE 1, with a test asserting the measurement code cannot modify
      that file. No Sage, no solver, no timing in the measurement path.
    parameters: 'Curves: 4 generated prime-order toy curves per size. Sizes: N near 2^12, 2^14, 2^16
      and 2^18. Base-size rule: B equal to ceiling of (6N) to the one-third power, one rule across
      the whole ladder, giving effective sizes near 29, 46, 73 and 116. Arity: m equal to 3. Bases
      per size: 6 - three constructible x-line geometries, the ceiling-attaining upper anchor, the
      matched random lower anchor, the degenerate small-coset control. Seeds: 4 per cell. Permutation
      draws: 200 per cell. Target space: complete, no sampling. Cells: 6 bases times 4 sizes times
      4 curves times 4 seeds equals 384 exact coverage computations, with the 2^18 rung accounting
      for most of the budget.'
  controls:
  - Matched random base as the lower anchor with a closed-form predicted attainment, drawn in the
    same invocation at every size.
  - Ceiling-attaining construction as the upper anchor, which must reach 1.000.
  - Degenerate small-subgroup-coset base, which must fall far below the random anchor, establishing
    dynamic range.
  - 'Closed-form total check per cell: summed multiset count equals binomial(B_eff + m - 1, m) exactly.'
  - 'Ceiling re-check per cell: measured coverage must not exceed min(1, mean), reproducing the zero-violation
    record.'
  - Permutation-null band on base labellings at each size, and a family-wise correction across the
    panel.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two anchors serve as the mandatory controls and both are closed-form,
    which is what makes this currency auditable. LOWER ANCHOR: the matched random base of identical
    realised size, drawn in the same invocation, whose attainment fraction must match one minus the
    exponential of minus the mean, all divided by the ceiling, within its interval at every size.
    UPPER ANCHOR: a ceiling-attaining construction, whose attainment fraction must be 1.000 within
    its interval at every size. For any geometry''s attainment to mean anything, BOTH anchors must
    land on their predicted values; a run in which the random base misses its closed form has a miscalibrated
    denominator and every fraction in it is wrong, and a run in which the ceiling-attaining construction
    fails to reach 1 has either a broken construction or a wrong ceiling. A third control is required:
    a deliberately degenerate base concentrated in a small subgroup coset, whose attainment must be
    far below the random anchor; an apparatus that cannot see that has no dynamic range.'
  independent_variables:
  - group size N across the four-point ladder
  - geometry within the six-member panel
  - curve instance and seed
  - base-size rule (held fixed at one declared rule; recorded as a variable so a later contract can
    vary it)
  metrics:
    primary:
    - exact coverage per cell
    - exact ceiling min(1, mean) per cell
    - attainment fraction per cell with bootstrap interval
    - anchor residuals against the frozen closed-form predictions
    - fitted slope of attainment against the logarithm of N per geometry, with interval and family-wise
      correction
    secondary:
    - mean multiset count per target per cell
    - effective size after negation collapse per cell
    - permutation-null p-value per cell
    - ceiling-violation count per cell, which must be zero
    - closed-form total residual per cell, which must be zero
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The attainment fraction of each panel base at each size, and its fitted slope against
      the logarithm of group size.
    formula: 'Let mu equal binomial(B_eff + m - 1, m) divided by N be the mean multiset count per
      target and let the ceiling be min(1, mu). Attainment A equals measured coverage divided by that
      ceiling. Frozen before any run: the random-base attainment prediction A_rand equals (1 minus
      the exponential of minus mu) divided by min(1, mu), computed exactly at each of the four sizes;
      and the upper anchor prediction A_ceil equals 1.000. Predicted: the measured random base satisfies
      the absolute value of A minus A_rand below its interval half-width at every size; the ceiling-attaining
      construction satisfies the absolute value of A minus 1.000 below its interval half-width at
      every size; the degenerate small-coset control satisfies A below 0.5 times A_rand. The slope
      of A against the logarithm of N for each constructible geometry is reported with its interval
      and is deliberately not predicted in sign or magnitude.'
    source: Pre-registered in the parent proposal IDEA-20260816-405086 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are N near 2^12 to 2^18 with effective base sizes 29 to 116
      at arity 3 on 4 curves per size with 4 seeds, exact coverage counting over the complete target
      space so the primary metric carries no sampling error. Transfer assumptions, stated: the attainment
      currency is scale-free only relative to the single declared base-size rule, and changing that
      rule changes what the currency measures, so no statement transfers across rules; the currency
      is informative only while the ceiling is strictly below 1, and the contract reports the per-cell
      mean so a reader can see where saturation begins; and the fitted slope is a four-point trend
      over a size range spanning a factor of 64, reported with an interval and explicitly not an asymptotic
      rate. Nothing extrapolates to cryptographic sizes, and the upper anchor is not constructible
      there at all, so the currency''s calibration does not exist outside toy scale.'
    correspondence: null
  tail_checks:
  - The largest rung at N near 2^18, which drives the compute budget and where any counter inefficiency
    surfaces.
  - The smallest rung, where the closed-form random attainment approximation is least accurate and
    a finite-size correction may be needed.
  - Any cell whose mean multiset count leaves the informative band, reported as a degenerate currency
    cell rather than folded into the slope.
  - The degenerate small-coset control at every size, verifying dynamic range does not collapse at
    the largest rung.
  - The cell with the largest anchor residual, recomputed independently with fresh seeds.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 10800
    total_cpu_hours: 12.0
    maximum_memory_gb: 8
    maximum_runs: 60
  stopping_rules:
  - 'HALT and report if either anchor misses its frozen closed-form prediction at any rung: the currency
    is not calibrated and no fraction in the run can be read.'
  - Halt and report if any measured coverage exceeds min(1, mean) or any closed-form total residual
    is nonzero.
  - Per-cell wall-clock budget of 3600 seconds at the 2^18 rung and 1800 seconds elsewhere; exceeded
    cells are recorded infeasible, which under AGENTS.md rule 3 is not negative mathematical evidence.
  - Stop after the three smaller rungs and report a three-point ladder if the 2^18 rung exceeds the
    total budget, rather than reporting a four-point slope that was never measured.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both anchors land on their frozen closed-form predictions within interval half-widths
    at every rung, the degenerate control falls below half the random anchor, every ceiling and closed-form
    total check passes with zero violations, and the run reports an attainment fraction with an interval
    for every panel geometry at every size together with the fitted slopes and their family-wise-corrected
    intervals - in whichever direction those slopes fall, including all intervals containing zero.
  falsification_criterion:
  - The matched random base's attainment misses its frozen closed-form prediction at any rung.
  - The ceiling-attaining construction fails to reach 1.000 at any rung.
  - Any measured coverage exceeds the exact ceiling min(1, mean), or any closed-form total residual
    is nonzero.
  - The degenerate small-coset control does not fall well below the random anchor, indicating insufficient
    dynamic range.
  - The mean multiset count leaves the informative band at one or more rungs, making the currency
    degenerate and the four-point slope uninterpretable.
  - Every constructible geometry's slope interval contains zero after correction, which refutes the
    claim's measurable form and is reported as a measured obstruction with its numbers and scope.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-405086
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The closed-form random-base attainment uses a Poisson-style approximation whose finite-size correction
    at effective size near 29 is not derived here; a Coordinator must require the correction or accept
    the smallest rung as uncalibrated.
  - Whether a single base-size rule across the ladder is the right choice, or whether the contract
    should sweep the rule so the ceiling's saturation point is located rather than assumed, is unresolved
    and materially changes the compute budget.
  - Which construction serves as the ceiling-attaining upper anchor, and whether it reaches the ceiling
    exactly at every tested size or only at some, must be established before approval; the frozen
    evidence record reports one such construction attaining the ceiling exactly but at parameters
    that are not identical to these.
  - The family-wise correction rule across a panel and a ladder is named but not specified; the frozen
    battery's own validation found an aggregation rule documented only in a code comment, and this
    contract must not repeat that.
