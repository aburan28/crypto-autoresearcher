# EXP-AUXIN-e9a5c7
# Integer slice of the written null-order condition. No curve point is counted.
# Approved by DEC-20261007-43cfb5.
experiment:
  id: EXP-AUXIN-e9a5c7
  hypothesis_id: H-AUXIN-126dac
  source_idea: IDEA-20261005-447d82
  question_id: RQ-AUXIN-f8d8c0
  version: 1
  title: Prime halves 2 and 3 build the integer 5
  status: approved
  frozen: true
  designed_at: '2026-10-07'
  approved_by: coordinator
  approval_decision_id: DEC-20261007-43cfb5
  objective: >-
    Check that the halves differ by 1, that the pair 2 and 3 builds 5, and that 5 does not exceed 65536.
  inputs:
    half_lo: 2
    half_hi: 3
    half_gap: 1
    half_product: 6
    half_sum: 5
    built: 5
    power: 65536
    power_minus_built: 65531
    nearby_a: 1
    nearby_b: 1
    nearby_gap: 0
    nearby_product: 1
  controls:
    - >-
      The two halves differ by 1. The primes 2 and 3 build the integer
      5. Reporting a prime larger than 65536 with both halves prime
      invalidates the run.
    - >-
      Three exceeds two by 1. The product of 2 and 3 is 6. Their sum
      is 5. Two to the power 16 is 65536, and 65536 exceeds 5 by 65531.
    - >-
      Two readings of the half-gap are both 1. Their gap is 0 and
      their product is 1.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {halves, compare}
  metrics:
    primary:
      - half_gap
      - built
      - power
      - implementations_agree
    secondary:
      - half_product
      - power_minus_built
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The only integer whose two halves are the primes 2 and 3 is 5.
      Five does not exceed 65536. The gap of two half-gap readings is 0.
    formula: >-
      Subtract (n-1)/2 from (n+1)/2. Check that 2 and 3 differ by 1.
      Build 2*2+1. Compute 2 to the power 16. Subtract 5 from 65536.
    source: >-
      IDEA-20261005-447d82 asks for a prime larger than 2 to the power
      16 whose two halves are both prime, read 2026-10-07. The gap, the
      product, and the comparison were recomputed in this design
      session. That computation is not a run. No curve point was counted.
  scale_relevance:
    tier: toy
    justification: One written null-order condition. No transfer to a curve order.
    correspondence: null
  tail_checks:
    - The comparison with 65536 and the nearby gap 0 are required. A check that stops at the half-gap 1 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the built integer 5 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The two halves do not differ by 1.
    - The pair 2 and 3 does not build 5.
    - Five exceeds 65536.
    - A prime larger than 65536 is reported, or a curve point is counted.
  success_criterion: >-
    Both runs agree that the two halves differ by 1, that the pair 2
    and 3 builds the integer 5, and that 5 does not exceed 65536.
  falsification_criterion: >-
    The runs agree that a prime larger than 65536 has two prime halves.
  decision_impact:
    on_positive: >-
      Agreement that the only such integer is 5, and that 5 does not
      exceed 65536, records that the written null-order search has no
      prime above 65536. It does not count a curve point.
    on_negative: >-
      Agreement that a prime larger than 65536 has two prime halves
      records that the half-gap argument failed, and the null-order
      search stays open.
  required_artifacts:
    - experiments/EXP-AUXIN-e9a5c7/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-AUXIN-e9a5c7/runs/<RUN-ID>/command.txt
    - experiments/EXP-AUXIN-e9a5c7/runs/<RUN-ID>/stdout.log
    - experiments/EXP-AUXIN-e9a5c7/runs/<RUN-ID>/stderr.log
    - experiments/EXP-AUXIN-e9a5c7/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-AUXIN-e9a5c7/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any count of points on a curve, factorization of a curve order, or auxiliary-input walk.
    - Any claim that a half-gap of 1 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
