experiment:
  id: EXP-INSTR-5813d7
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-1c14d7
  question_id: RQ-INSTR-f8faa0
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'COMPLETENESS OF AN ENUMERATED ISOGENY CLASS IS A WEIGHTED CARDINALITY CHECK AND THAT IS
    NOT ENOUGH: the committed Hurwitz-Kronecker census validates the enumerator against a formula
    using the same twist logic it is testing, so add an independent all-(a,b) brute-force ground truth
    at tiny p and an ell-isogeny closure check, and state the twist and automorphism weighting explicitly
    because a variance measured over a structurally biased subset of a class is meaningless'
  status: draft
  objective: "(A) WHY COMPLETENESS IS LOAD-BEARING AND NOT HYGIENE. The gating measurement of GOAL-ENDO-001\
    \ is the within-class variance of a cost functional. If the enumerated set is a SUBSET of the\
    \ class, the measured variance is the variance over that subset, and the subset is not random:\
    \ any natural incomplete enumeration -- a breadth-first search over a few small ell, a level of\
    \ a volcano, a twist family -- is a structurally selected subset, typically a coset of a subgroup\
    \ of Cl(O) or a single volcano level. Variance over a coset is not an estimate of variance over\
    \ the class; it can be arbitrarily smaller. So a completeness failure produces exactly the campaign's\
    \ headline result -- \"within-class variance is small\" -- for a reason that has nothing to do\
    \ with isogenies. harness/isogeny_class.py's own module docstring says this in one line: \"A within-class\
    \ variance measurement over a biased subset of a class is meaningless.\" This record takes that\
    \ seriously enough to ask what the existing check actually proves.\n(B) WHAT THE COMMITTED CENSUS\
    \ PROVES, STATED PRECISELY. harness/isogeny_class.py::class_census computes, for each ordinary\
    \ trace t, the observed weighted count sum over the enumerated curves of 2/|Aut(E)| and compares\
    \ it with hurwitz_class_number(4p - t^2). RUN-ICINV-p4001-a reports census_failures: 0 over 127\
    \ traces, and the code carries a recorded instance of the check DOING ITS JOB: the comment in\
    \ _class_number_forms records that omitting primitivity (gcd(A,B,C) = 1) made the census reject\
    \ 60 of 127 traces at p = 1009. That is a real, working instrument and this record does not propose\
    \ replacing it. What it proves is a WEIGHTED CARDINALITY. It does not prove membership: an enumeration\
    \ that omitted one curve and included one spurious curve of the same |Aut| would pass unchanged.\
    \ It also cannot fail independently of the thing it is testing, because harness/isogeny_class.py::enumerate_curves\
    \ builds the set by sweeping j and then applying twists_of_j, while the |Aut| assignment used\
    \ in the weighting is derived from the SAME j = 0 / j = 1728 case analysis that twists_of_j uses.\
    \ A single mistake in that case analysis moves the observed and the predicted side together. The\
    \ census is therefore a joint test of the enumerator and the class-number code, and it is not\
    \ independent of the enumerator's central assumption.\n(C) THE WEIGHTING, WRITTEN OUT, BECAUSE\
    \ THIS IS WHERE SUCH CHECKS GO WRONG. Over F_p with p > 3:\n  For u in F_p^*, (a, b) and (u^4\
    \ a, u^6 b) define F_p-isomorphic curves, and the\n  stabiliser of (a,b) in this action is Aut(E),\
    \ of order 2 generically, 4 when\n  j = 1728 and p = 1 mod 4, and 6 when j = 0 and p = 1 mod 3.\
    \ Hence each\n  F_p-isomorphism class corresponds to exactly (p-1)/|Aut(E)| pairs (a,b).\n  The\
    \ number of F_p-isomorphism classes with a given j is 2 for j not in\n  {0, 1728} (a curve and\
    \ its quadratic twist, of traces t and -t), 6 for j = 0\n  when p = 1 mod 3 and 2 otherwise, and\
    \ 4 for j = 1728 when p = 1 mod 4 and 2\n  otherwise. This is exactly harness/isogeny_class.py::twists_of_j.\n\
    \  The classical count relating this to class numbers is Deuring's, in the form\n  given by Schoof,\
    \ \"Nonsingular plane cubic curves over finite fields\",\n  J. Combin. Theory Ser. A 46(2) (1987)\
    \ 183-211: for an ordinary trace the\n  number of curves of that trace, in the appropriate weighting,\
    \ is a\n  Kronecker/Hurwitz class number of the discriminant t^2 - 4p. [open] THE EXACT\n  NORMALISATION\
    \ -- Kronecker H versus Hurwitz H, unweighted class count versus\n  the 2/|Aut| weighting, and\
    \ whether the sum runs over all orders between\n  Z[pi] and O_K -- IS RECORDED HERE AS A CLAIM\
    \ TO BE CHECKED, NOT QUOTED. The\n  paper was not read in this session; only its bibliographic\
    \ details and the\n  fact that it treats this count were confirmed. The committed code uses the\n\
    \  2/|Aut| weighting against a Hurwitz class number summed over f^2 dividing\n  4p - t^2, and\
    \ Step 2 below settles whether that normalisation is right by\n  brute force rather than by citation.\n\
    \n(D) THE THREE CHECKS THIS PROPOSES, IN INCREASING STRENGTH.\n  C1  WEIGHTED CARDINALITY (committed,\
    \ retained). Necessary, cheap, already\n      passing, already demonstrated to catch a real bug.\n\
    \  C2  INDEPENDENT BRUTE-FORCE GROUND TRUTH AT TINY p, WHICH BREAKS THE\n      CIRCULARITY. For\
    \ p <= about 300 there are fewer than p^2 = 90000 pairs\n      (a,b). Enumerate ALL of them, discard\
    \ singular ones, compute each curve's\n      trace by the character sum, and partition the pairs\
    \ into F_p-isomorphism\n      classes by the explicit orbit map (a,b) -> (u^4 a, u^6 b). This\
    \ uses NO\n      j-invariant formula, NO twists_of_j case analysis, and NO class number. It\n\
    \      yields the exact class sizes, the exact |Aut| distribution, and the exact\n      orbit\
    \ sizes (p-1)/|Aut|. Compare against enumerate_curves and against\n      hurwitz_class_number\
    \ on the same p. THIS IS THE ONLY CHECK THAT IS\n      GENUINELY INDEPENDENT OF THE ENUMERATOR,\
    \ and it is cheap precisely because\n      it is dumb.\n  C3  ell-ISOGENY CLOSURE, WHICH CERTIFIES\
    \ MEMBERSHIP RATHER THAN COUNT. For a\n      declared set of small ell, verify that every ell-neighbour\
    \ of every\n      enumerated curve is itself enumerated. Closure plus connectivity implies\n \
    \     completeness. Connectivity of the ell-isogeny graph restricted to a set of\n      small\
    \ ell is exactly the statement that the corresponding ideal classes\n      generate Cl(O), which\
    \ under ERH is guaranteed by a bound of Bach's shape\n      -- Bach, \"Explicit bounds for primality\
    \ testing and related problems\",\n      Math. Comp. 55 (1990) 355-380, giving generation by prime\
    \ ideals of norm\n      at most 12 log^2 |Delta| under ERH, with a sharper constant often quoted\n\
    \      for the imaginary quadratic case. [open] THE EXACT CONSTANT IS NOT\n      RELIED ON: at\
    \ toy scale the closure check is run for ALL ell up to a\n      declared bound and the result\
    \ is compared with C1 and C2, so the\n      generation statement is verified rather than assumed.\
    \ What C3 adds beyond\n      C1 is membership: a set that is ell-closed and has the right weighted\n\
    \      cardinality is the class.\n\n(E) THE FAILURE MODE C3 IS SPECIFICALLY FOR. If a future lane\
    \ enumerates a class by breadth-first search over the ell-isogeny graph instead of by the O(p^2)\
    \ j-sweep -- which it will have to, because the j-sweep does not scale -- then the BFS reaches\
    \ only the subgroup of Cl(O) generated by the ell used, and only the volcano levels reachable\
    \ by those ell. Two consequences, both structural:\n  a BFS over ell that do NOT divide the conductor\
    \ f stays on a single volcano\n  level and enumerates the crater of one order, not the class;\n\
    \  a BFS over ell whose ideal classes generate a proper subgroup H < Cl(O)\n  enumerates a coset\
    \ of H, which is a set of size h/[Cl(O):H] with a\n  group-theoretic structure that could plausibly\
    \ correlate with any functional.\nBoth look like a complete class to a cardinality check ONLY\
    \ if the check is omitted; C1 would catch them by count. C3 catches them by structure and, critically,\
    \ catches them BEFORE the count is available -- which matters at the p where the j-sweep is no\
    \ longer affordable and C1 is the only thing standing between the campaign and a coset.\n(F) THE\
    \ SCOPE CEILING, STATED BECAUSE IT BOUNDS THE ENTIRE L1 LANE. enumerate_curves is O(p) j-invariants\
    \ times O(p) per character sum, i.e. O(p^2); harness/isogeny_class.py's header claims p up to\
    \ about 2^17 for full enumeration. At p = 2^12 the whole enumeration ran inside the 43.4 seconds\
    \ of RUN-ICINV-p4001-a; at p = 2^17 the work is 1024 times larger. At the p where complete enumeration\
    \ is affordable, the largest prime factor of N is around 12 to 16 bits, so NO functional measured\
    \ on a complete class is an attack cost at any interesting scale. That is not an objection to\
    \ the lane; it is the honest boundary of what complete enumeration can ever deliver, and it belongs\
    \ in the completeness record because it is the reason a future lane will be tempted to substitute\
    \ a BFS."
  resource_label: 'audit: consumes no resource. It certifies the enumeration underlying L1''s R1/R2/R4
    measurements and L2''s R3/R4 stratification.'
  admissibility: admissible
  admissibility_argument: No oracle, no attack, no group-operation advantage. The isogeny graph (R4)
    is traversed only to certify a set, never to move an instance or to search for a better curve;
    the reachability question T5 is therefore untouched by C3 and is addressed explicitly in reachability_gate
    below.
  reachability_gate: 'REQUIRED, SINCE C3 MOVES BETWEEN CURVES, AND ANSWERED. C3 walks the ell-isogeny
    graph but only to enumerate a set that is already fully enumerated by the j-sweep, so every curve
    it reaches is already known and no search is performed. It therefore uses only the CHEAP side
    of T5 (a random or exhaustive local neighbourhood) and never the hard side (reaching a specified
    curve, i.e. vectorization at about sqrt(h)). If a later lane uses C3''s machinery to enumerate
    a class at a p where the j-sweep is unaffordable, T5 becomes binding immediately: the BFS then
    IS the enumeration, its completeness is exactly the generation question, and this record''s coset
    failure mode becomes the live risk rather than a control.'
  inputs:
    procedure: 'STAGE 0 (zero compute): write down the weighting statement (C) with the [open] markers
      and freeze it. STAGE 1 (minutes, and it is the cheapest independent check in the lane): C2 at
      p = 11, 13, 17, 19, 23. Fewer than 600 pairs each; the orbit computation is trivial; it settles
      the twist and |Aut| logic against nothing but the group action. Any disagreement here stops
      the campaign''s L1 lane at once. STAGE 2 (an hour): C2 at p = 101, 103, 251, 257, covering both
      p = 1 mod 12 and p = 11 mod 12. STAGE 3 (an hour): the collision pair and the removal sweep,
      giving the minimum detectable incompleteness. STAGE 4 (hours): C3 on the p = 4001 target class,
      with both neighbour-count routes reported and their disagreement rate recorded. STAGE 5 (hours):
      the known-incomplete coset simulation; every check must fail. STAGE 6 (hours): the timing ladder
      and the ceiling report.'
    mechanism: 'STEP 1 -- FREEZE THE WEIGHTING STATEMENT. Write (C) down as the contract''s normalisation
      clause, with the [open] marker on the exact class-number convention intact. No number is reported
      against a convention that has not been stated.

      STEP 2 -- C2, AND IT COMES FIRST BECAUSE IT IS THE ONLY INDEPENDENT ONE. For p in {11, 13, 17,
      19, 23, 101, 103, 251, 257}: enumerate all (a,b) in F_p^2 with 4a^3 + 27b^2 != 0; compute each
      trace by the character sum; group the pairs into orbits under (a,b) -> (u^4 a, u^6 b); record
      orbit sizes and derive |Aut| as (p-1)/orbit size. Compare, per trace: the orbit count against
      len(isogeny_classes(p)[t]); the |Aut| multiset against the enumerator''s aut_order field; the
      weighted sum against hurwitz_class_number(4p - t^2). Report per-p agreement counts and the exact
      first disagreement if any. INCLUDE p = 1 mod 12 and p = 11 mod 12 so that j = 0 and j = 1728
      both appear with and without their extra automorphisms; the case analysis is where this kind
      of code fails.

      STEP 3 -- C3. For a declared ell set, construct the ell-neighbours of every enumerated curve
      by a route independent of rational_isogeny_count: find the order-ell rational subgroups directly
      by exhausting the ell-torsion available over F_p AND, separately, by checking whether X^2 -
      tX + p has a root modulo ell and using that to predict the neighbour count. Report both counts
      per curve and their disagreement rate; the disagreement rate is itself the audit of rational_isogeny_count.
      Then verify closure: every constructed neighbour''s (a,b) must lie in the enumerated set up
      to isomorphism. Report the closure defect, i.e. the number of neighbours not found in the set.

      STEP 4 -- THE COSET SIMULATION, WHICH IS THE POSITIVE CONTROL. Deliberately build an INCOMPLETE
      enumeration -- BFS from one curve over a single ell chosen so its ideal class generates a proper
      subgroup -- and run C1, C2 and C3 on it. C1 must fail on cardinality; C3 must report a positive
      closure defect. If either passes on a known-incomplete set, that check cannot support a completeness
      claim and is withdrawn.

      STEP 5 -- REPORT THE CEILING. Measure enumerate_curves wall time at p in {1009, 4001, 16001,
      65537} and fit the O(p^2) growth, so the campaign has a measured rather than asserted ceiling
      for complete enumeration, and record the largest prime factor of N attainable at that ceiling.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - known-incomplete coset (BFS over one ell generating a proper subgroup)
  - mixed-trace set of the right size, which C1 must reject at once
  - collision pair with identical weighted cardinality and different membership
  - the reintroduced primitivity bug, which must reproduce the recorded 60-of-127 rejection at p =
    1009
  - p chosen in both 1 mod 12 and 11 mod 12 residue classes
  - 'NULL OBJECT (from the proposal): MANDATORY, AND IT IS STEP 4. The NULL OBJECT is a KNOWN-INCOMPLETE
    SET of the same shape: a BFS-truncated coset with the same p, the same trace and a plausible size.
    Every check must FAIL on it. A completeness check that passes a known-incomplete set is worthless,
    and this is the one experiment that establishes the checks have any power at all. SECOND NULL:
    a set of the same size at the same p assembled from curves of SEVERAL traces. C1 must fail immediately;
    if it does not, the trace grouping is not being enforced. DECAY PARAMETER: the fraction of the
    class removed. Sweep it from 0 to 0.5 and record the smallest removed fraction at which each check
    fires. That number is the completeness instrument''s minimum detectable incompleteness and it
    is the quantity that makes "the class was complete" a bounded claim rather than an assertion.
    A check whose firing rate does NOT rise as the removed fraction grows is the canonical artifact
    tell and would mean the check is responding to something other than the missing curves.'
  independent_variables: []
  metrics:
    primary:
    - per-trace orbit count, |Aut| multiset and weighted sum from brute force
    - per-trace enumerate_curves count and weighted sum
    - per-trace hurwitz_class_number value
    - closure defect per curve and per class, with both neighbour-count routes
    secondary:
    - firing threshold of each check versus removed fraction
    - enumerate_curves wall time versus p and the fitted exponent
  heuristic_under_test: null
  preregistered_prediction:
    quantity: agreement between the all-(a,b) brute-force orbit count and enumerate_curves, per trace,
      at each tested p
    formula: EXACT agreement on every trace at every tested p, including the j = 0 and j = 1728 traces
      at p = 1 mod 12 and p = 11 mod 12. A single disagreement is a defect in the enumerator or in
      the |Aut| assignment and invalidates every class-based measurement taken with it until resolved.
    source: pre-registered in IDEA-20260807-1c14d7 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - SHARED CASE ANALYSIS. C1's observed and predicted sides both depend on the j = 0 / j = 1728 case
    analysis. Only C2 avoids it, which is why C2 is staged first despite being the least sophisticated.
  - SUPERSINGULAR TRACES. class_census skips t = 0 mod p with a note that the mass formula differs.
    The brute force will include those curves, so the comparison must exclude them explicitly rather
    than silently, or C2 will appear to disagree.
  - SMALL p DEGENERACIES. At p = 11 or 13 the Hasse interval is tiny and some traces have empty classes.
    Empty classes must be handled as a case, not as a division by zero.
  - ORBIT COMPUTATION COST. C2 is O(p^2) pairs times O(p) for each character sum if done naively,
    i.e. O(p^3); it must reuse the trace per j or per orbit, which is a correctness-sensitive optimisation
    and must itself be checked against the naive version at the smallest p.
  - CONCURRENT EDITS. harness/exp_icinv.py changed under this session between two reads on 2026-08-07.
    Every source-based claim in this record must be re-verified against the tree at execution time
    and the commit recorded.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACT agreement on every trace at every tested p, including the j = 0 and j =
    1728 traces at p = 1 mod 12 and p = 11 mod 12. A single disagreement is a defect in the enumerator
    or in the |Aut| assignment and invalidates every class-based measurement taken with it until resolved.
  falsification_criterion:
  - C2 disagrees with enumerate_curves at any tested p. The enumerator is defective and every class-based
    measurement is attempted_and_inconclusive until repaired.
  - C2 disagrees with hurwitz_class_number while agreeing with enumerate_curves. The class-number
    normalisation in (C) is wrong; the census has been passing for the wrong reason and must be re-derived.
  - C3 passes on the known-incomplete coset. Closure adds nothing and is withdrawn.
  - C1 fails to fire when a single generic curve is removed. The weighted sum is not being computed
    as documented.
  - The primitivity-bug reproduction does not yield 60 of 127 at p = 1009. The recorded provenance
    of the census's own success is wrong, which is an evidence-integrity matter and not a mathematical
    one.
  - rational_isogeny_count agrees with the characteristic-polynomial route everywhere. This record's
    reading of it is withdrawn and L2's stratifier is vindicated.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
