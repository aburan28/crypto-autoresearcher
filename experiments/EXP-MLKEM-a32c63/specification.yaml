  derivation_gaps:
  - >-
    The exact clamp-free and clamped blocksize windows are not enumerated here. They must be computed from the
    implementation's own wrapper rule and FROZEN in Stage 0b, because a window drawn after seeing which cells
    completed is a window chosen to suit the result.
  - >-
    The success radius is required to be declared before any data but is not supplied here. It must be set in an
    amendment or at approval. A radius chosen after seeing the lifted-minimum curve sets the achievable count to
    whatever is wanted, which is the single easiest way to make this contract meaningless.
  - >-
    The preprocessing recipe is described as pinned but is not specified. Two runs at the same blocksize with
    different preprocessing give different achievable counts, so it must be pinned exactly and recorded.
  - >-
    The closed-form pool-cardinality-forced component is described but its exact expression is not given. It must be
    derived and frozen in Stage 0c, before any data, because deriving it afterward would let it absorb whatever
    residual is inconvenient.
  - >-
    The core-SVP dimensions-to-bits constant is a CONVENTION recorded in this corpus and is not verified. If it is
    wrong the conversion factor changes but the structure of the claim does not; it should nevertheless be named
    explicitly in the output rather than applied silently.
  - >-
    H1, the blocksize extrapolation, is declared UNTESTABLE within this budget. That is the honest statement and it
    means every extrapolated bit correction is an assumption-laden number. A Coordinator wanting a testable bridge
    must commission a different contract at larger blocksizes, and this one must not be cited as having supplied one.
