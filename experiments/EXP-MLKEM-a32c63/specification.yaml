experiment:
  id: EXP-MLKEM-a32c63
  hypothesis_id: H-MLKEM-ef3360
  derived_from_idea: IDEA-20260821-374af4
  question_id: RQ-MLKEM-003
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Measured achievable free-dimension count on ML-KEM-shaped q-ary bases - lift-depth sweeps of the minimum
    Babai-lifted pool norm against a pre-declared success radius, split into a clamp-free primary window and a
    clamped secondary window whose applied value is forced, with a matched non-sieve null pool drawn eight
    times per cell, a closed-form pool-cardinality forced component subtracted, a flat-profile nearby-object
    control, and a zero-compute reproduction gate that can void the whole record before any sieve runs
  objective: >-
    The one uncertainty a run reduces - whether a real sieve pool can actually give up the number of dimensions
    the pinned estimator charges it for, and if not, in which DIRECTION the charged number is wrong. A run
    establishes (i) whether a zero-compute programmatic stage reproduces the committed discount values from the
    estimator's own closed-form law and inverts the committed effective dimensions back to nominal blocksizes,
    which is a gate on citing either; (ii) the measured achievable free-dimension count per blocksize and seed
    over a clamp-free window, defined against a success radius declared before any data exists; (iii) its SIGNED
    residual against each named target law, each labelled with its target, with the clamped cells reported
    separately against all three targets and contributing no statement about which law the estimator should
    charge; and (iv) whether the same count is achieved by a matched non-sieve pool, which decides whether the
    discount is a property of sieving at all. No attack, no break, no exponent moved, and no statement about the
    security of any standardized parameter set.
  what_this_is_not:
  - >-
    Not an attack, a break, or a speedup. It measures one INPUT that a committed cost figure is computed from.
  - >-
    Not a correction to any committed evidence record or to the prior batch that sized the discount. That work
    evaluated the estimator's own formula and priced the counterfactual; this measures whether a real pool
    achieves the formula's value. Neither run produces the other's number.
  - >-
    Not a claim that the repository holds no dimensions-for-free value. It holds a committed magnitude carried as
    a numbered hypothesis in a committed evidence record, and that leg of the parent proposal is WITHDRAWN.
  - >-
    Not an attack use of a large achievable count. The recorded open problem of combining the discount with bulk
    short-vector output still stands between the two, and this contract does not touch it.
  - >-
    Not a statement about the standardized parameter sets' blocksizes. The only bridge is a numbered
    extrapolation heuristic and every extrapolated number is labelled as extrapolated.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has been
    executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the executed blocksizes, on ML-KEM-shaped q-ary bases at the standardized
      modulus with the pinned preprocessing recipe and the named sieve kernels, the achievable free-dimension
      count is the measured value with its seed interval, and its signed residual against the law the pinned
      estimator charges is the measured residual with its interval. WHAT DOES NOT FOLLOW - nothing about the
      blocksizes the estimator actually evaluates for the standardized parameter sets; nothing about other
      lattice families; nothing about sieve kernels not run; nothing about which law is right outside the
      executed window; and no security statement about any parameter set. A measurement that AGREES with a law
      inside error is a real and reportable outcome that closes nothing.
  inputs:
    procedure: >-
      STAGE 0 (zero compute; CITE, DO NOT REDISCOVER; THEN FREEZE). Do NOT re-derive the estimator's discount law
      or its magnitude - both are committed. CITE the prior batch's committed run output and the committed
      evidence record's numbered hypothesis for the magnitude and for the fact that the estimator's own function
      is what was evaluated. Then do the three things that are NOT committed, all at zero compute.
      (0a) Reproduce PROGRAMMATICALLY that the committed effective dimensions invert, under the estimator's
      closed-form law, to the stated nominal blocksizes; and that the committed discount values are the values of
      that law at the committed blocksizes. Report ANY disagreement with the parent's hand arithmetic as a defect
      of the parent record.
      (0b) Freeze the implementation's clamp - its wrapper rule, its crossover blocksize, and the applied-value
      table over the whole measurement window - so that NO residual is ever taken against a function that is not
      in force at that cell.
      (0c) Declare the success radius and the three residual targets BEFORE any data exists, and derive in closed
      form the pool-cardinality-forced component of the achievable count.
      STAGE 1 (instrument). Rebuild the sieving instrument at its pinned versions and record the rebuild in the
      receipt, reproducing a committed database size at a committed dimension before any new measurement is
      trusted.
      STAGE 2 (the tracked object). For each blocksize and seed, build a q-ary basis, preprocess it under the
      pinned recipe, then for lift depth zero, one, two and upward run the sieve in the projected sublattice of
      the reduced dimension and, for every vector in the resulting pool, compute its Babai lift back to the full
      block and record the resulting norm. RETAIN ONLY the minimum over the pool. The achievable count is the
      largest depth at which that minimum still clears the declared radius.
      STAGE 3 (the comparison, LEVEL FIRST AND SLOPE SECOND). On the clamp-free window report the signed residual
      against the estimator's charged law and against the unclamped implementation law, with seed intervals. On
      the clamped window report those two AND the residual against the clamped applied value, all three
      SEPARATELY LABELLED. Then report whether the two clamp-free residuals have OPPOSITE signs, which is the case
      that says the truth lies between the conventions, and the extrapolated correction at the estimator's own
      blocksizes, stated as an extrapolation under H1 and NEVER as a measurement.
      STAGE 4 (verdict discipline). Emit the frozen four-branch decision rule on the NULL ARM FIRST, then on the
      real arm. The same branch on both arms means the rule discriminates nothing.
    instrument: >-
      A rebuilt lattice-sieving stack at pinned versions, with the rebuild receipt reproducing a committed pool
      size at a committed dimension. Explicit lift-depth sweeps - the sweep SETS the depth, so the
      implementation's own free-dimension chooser does NOT enter the measured quantity. Babai lifting applied
      vector-wise to the whole pool. An INDEPENDENT code path for the depth-zero pool minimum, used only for the
      bitwise regression. At least two sieve kernels, or every number is scoped to one kernel by name. Recorded
      through harness/runner.py.
    parameters: >-
      ML-KEM-shaped q-ary bases at the standardized modulus. A CLAMP-FREE PRIMARY WINDOW of blocksizes above the
      implementation's clamp crossover, and a CLAMPED SECONDARY WINDOW below it, with the crossover computed and
      frozen in Stage 0. Three seeds per blocksize. Lift depth swept upward from zero until the tracked minimum
      crosses the radius. At least eight null draws per cell. The success radius declared before any data, with
      the achievable count ALSO reported at three declared radii so the dependence is visible rather than hidden.
      One deliberately under-preprocessed cell, to expose the preprocessing sensitivity. STANDARDIZED PARAMETER
      SETS - the three FIPS 203 sets enter ONLY as the destination of an extrapolated correction under H1, and
      never as an executed parameter.
  controls:
  - >-
    NULL-A, THE MATCHED NON-SIEVE POOL. OBJECT REMOVED - sieving. Generate a pool of lattice vectors in the same
    projected sublattice by random integer combinations followed by Babai rounding against the same reduced
    basis, RESAMPLED until its norm multiset matches the real pool's decile by decile, then run the IDENTICAL
    lifting and minimisation code path. OBJECT PRESERVED - dimension, basis, norm distribution, pool cardinality,
    lifting code, success radius. CAN THIS NULL FAIL - YES, and the failure direction is pre-declared: if it
    returns the same achievable count, then the free dimensions come from the norm distribution and pool size
    alone, sieving contributes nothing readable by this instrument, and that strong negative is the headline.
  - >-
    FORCED-VALUE SUBTRACTION, DERIVED BEFORE THE RUN. A pool of K vectors whose lifted norms were independent
    draws from a fixed law would have its minimum falling like the K-th order statistic, so the achievable count
    would grow like the logarithm of K over a rate. Since K is itself set by the sieve dimension, PART of any
    observed growth of the achievable count in blocksize is FORCED BY POOL SIZE ALONE. That forced component is
    computed in closed form in Stage 0 and SUBTRACTED before any residual against a published law is read. If
    the whole measured count equals the forced component, the measurement is about cardinality and not about the
    sieve.
  - >-
    FORCED-VALUE EXCLUSION ON THE CLAMPED CELLS. Over the clamped window the value the implementation applies is
    FORCED by its wrapper and not by any property of the lattice. Reporting that the applied value is far below a
    law there is a forced fact and is INADMISSIBLE as a finding. Only the residual of the MEASURED count against
    a NAMED law carries information, and on those cells it must be reported against all three targets or not at
    all.
  - >-
    MAXIMAL-REMOVAL CONTROL. At lift depth zero no lifting occurs, so the tracked minimum must equal the pool
    minimum EXACTLY, bitwise, against an independent code path. If it does not, the lifting path is broken.
  - >-
    MONOTONICITY GATE. The tracked minimum must be non-decreasing in lift depth up to noise, because a deeper
    lift adds a rounding error term and removes a dimension of sieving. A non-monotone reading means the lifting
    implementation is wrong and no achievable count is reportable.
  - >-
    FLAT-PROFILE NEARBY-OBJECT CONTROL. A random unimodular-transformed cube, where lifting should succeed far
    deeper because there is no q-ary shape to fight. It must give a materially DIFFERENT achievable count; if it
    gives the same one, the instrument is reading the lifting code and not the lattice.
  - >-
    COMPARATOR DRAW COUNT. NULL-A is a GENERATED comparator, so it is drawn at least eight times per cell and
    reported as an INTERVAL. A residual read against a single draw is not reportable.
  - >-
    VERDICT ON THE NULL ARM FIRST. The frozen four-branch decision rule - above both laws, between them, below
    both, or intervals overlapping both - is emitted on NULL-A BEFORE the real arm is looked at. The same branch
    on both arms means the rule discriminates nothing.
  - >-
    INSTRUMENT REBUILD RECEIPT. The rebuilt instrument must reproduce a committed pool size at a committed
    dimension before any new measurement is trusted.
  - >-
    STAGE-0a REPRODUCTION GATE. The committed discount values and the blocksize inversion must be reproduced
    programmatically before either is cited.
  independent_variables:
  - blocksize (clamp-free primary window and clamped secondary window)
  - lift depth
  - seed (three per blocksize)
  - 'pool type: real sieve pool / NULL-A matched non-sieve pool'
  - 'lattice type: ML-KEM-shaped q-ary / flat-profile random unimodular cube'
  - sieve kernel (at least two)
  - success radius (three declared values, so the dependence is visible)
  - preprocessing quality (pinned recipe, plus one deliberately under-preprocessed cell)
  metrics:
    primary:
    - >-
      f_meas - an integer per (blocksize, seed), the largest lift depth at which the minimum Babai-lifted pool
      norm still clears the declared multiple of the Gaussian heuristic; reported with a per-blocksize interval
      over seeds, and with the primary and secondary windows LABELLED SEPARATELY.
    - >-
      residual_vs_estimator_law - in dimensions, signed, seed-averaged, over the clamp-free window. The achievable
      count minus the closed-form law the PINNED ESTIMATOR charges. THIS IS THE ONLY RESIDUAL THAT BEARS ON THE
      COMMITTED BIT COUNTS.
    - >-
      residual_vs_implementation_law - in dimensions, signed, same window. The achievable count minus the
      unclamped linear implementation law. Reported separately and never merged with the above.
    - >-
      null_gap - in dimensions. The sieve pool's achievable count minus NULL-A's, per cell, with NULL-A's interval
      over at least eight draws.
    - >-
      forced_component_residual - in dimensions. The achievable count minus the closed-form pool-cardinality-forced
      component computed in Stage 0.
    secondary:
    - >-
      residual_vs_clamped_applied_value - in dimensions, over the CLAMPED cells only, reported separately and never
      merged with the clamp-free window.
    - >-
      the full lifted-minimum curve against lift depth, archived for at least one (blocksize, seed) per blocksize.
    - >-
      fitted slope of the achievable count against blocksize, with a confidence interval, reported against BOTH
      laws' slopes as a CONSISTENCY CHECK and explicitly not as the discriminator.
    - >-
      level_separation - the difference between the two laws over the measured window, in dimensions, which is the
      quantity the discrimination actually rests on.
    - >-
      implied bit correction (the core-SVP constant times residual_vs_estimator_law) extrapolated to the
      estimator's own blocksizes under H1, LABELLED AS AN EXTRAPOLATION, with the committed margins printed beside
      it.
    - >-
      the frozen clamp table - the applied value per blocksize over the whole window - and the crossover.
    - >-
      per-cell wall time and peak resident memory, and the instrument rebuild receipt.
    - >-
      the achievable count at each of the three declared success radii, so the radius dependence is visible.
    - >-
      per-kernel achievable counts where two kernels were run, so H2's scope assumption is checkable.
  cost_model:
    measured_vs_modeled: >-
      Strictly separated and never mixed in a column. MEASURED - the achievable count, the lifted-minimum curves,
      the null-pool counts, wall time and peak resident memory, all from instrumented runs with manifests. MODELED -
      both published discount laws, the pool-cardinality-forced component, and the core-SVP dimensions-to-bits
      conversion, each with its formula and source named. CITED-COMMITTED - the discount magnitude, the effective
      dimensions and the margins, all read from committed evidence and never recomputed here. EXTRAPOLATED - the
      implied bit correction at the estimator's own blocksizes, which is MEASURED times MODELED under H1 and
      carries its own column label so it can never be read as measured.
    optimistic_assumptions:
    - >-
      The success radius. The achievable count is DEFINED relative to it and moves with it. Direction of bias -
      a more generous radius raises the count and therefore biases the residual POSITIVE (toward 'the estimator
      charges too much'). Mitigated by declaring it before the run AND reporting the count at three declared
      radii.
    - >-
      Preprocessing quality. Better preprocessing raises the achievable count. Direction of bias - POSITIVE.
      Mitigated by pinning the recipe exactly and including one deliberately under-preprocessed cell to expose
      the sensitivity.
    - >-
      The pool-cardinality-forced component is computed under an independence idealisation that the real pool
      does not satisfy. Direction of bias - UNKNOWN and declared unknown; a positively correlated pool would make
      the true forced component smaller, which would make the subtraction conservative.
    - >-
      Extrapolating a residual measured at the executed blocksizes to blocksizes an order of magnitude larger.
      Direction of bias - UNKNOWN, and this is the largest disclosed uncertainty in the whole contract. The
      closed-form law's asymptotic character means the residual could shrink, grow or change sign; no direction is
      asserted and no category verdict may rest on it.
    memory_accounting: >-
      MEMORY IS A FIRST-CLASS METRIC HERE FOR TWO DISTINCT REASONS AND THE TWO ARE KEPT APART. (a) The RUN's own
      peak resident memory is measured per cell and reported, because the pool at the largest executed blocksize
      is the binding resource and is what sets the reachable window. It is sized ANALYTICALLY in advance from the
      sieve's own database-size formula in the sieve dimension, and the MEASURED peak is reconciled against that
      analytic size; a measured peak materially above the analytic size means the implementation holds more than
      the pool and the cell's timing is not comparable. (b) The ATTACK-side memory of the modelled sieve is NOT
      measured or claimed here at all; this contract measures a dimension count, not an attack cost, and the
      dimensions-to-bits conversion touches only the time exponent. The tradeoff between the two is explicitly out
      of scope.
    hidden_overhead: >-
      Disclosed. (a) THE CLAMP - over part of any small-blocksize window the implementation's own free-dimension
      count is forced by a wrapper rather than by the law, so a residual taken there against the unclamped law is a
      residual against a function not in force. Handled by splitting the window and naming every residual's target.
      (b) POOL CARDINALITY IS NOT A FREE VARIABLE - the sieve sets the database size from a formula in the
      dimension, so lowering the sieve dimension by the lift depth also shrinks the pool, and the two effects act
      in the SAME direction on the tracked minimum. This is the forced component and it must be SUBTRACTED rather
      than argued away. (c) THE TWO LAWS ARE NOT INTERCHANGEABLE - the estimator charges one and the implementation
      applies the other, clamped; reporting one as if it were the other is the single most likely misreading of
      this contract's output. (d) The achievable count is dimensionless and therefore insensitive to hardware and
      library configuration, which is one of the reasons this object is preferable to a timing-based one.
    standardized_parameter_sets: >-
      The three FIPS 203 parameter sets enter ONLY as the destination of an extrapolated correction under H1, never
      as an executed parameter. AFFECTED-VERSUS-SAFE SCOPE - NO parameter set is claimed affected or safe by this
      contract in either direction. The committed margins are printed beside the extrapolated correction purely so
      a reader can see whether the correction would be decision-relevant IF the extrapolation held, and the
      contract states in the same sentence that the extrapolation is an assumption and that no category verdict may
      rest on it.
  heuristic_under_test: H2
  heuristic_under_test_note: >-
    H2 (kernel and profile generality) is tested, by running at least two sieve kernels at matched cells. H1 (the
    blocksize extrapolation) is NOT tested and is declared UNTESTABLE within this budget - reaching the estimator's
    own blocksizes is far outside any plausible batch budget on this instrument, and saying so plainly is the
    honest handling. Every number extrapolated under H1 is labelled as an extrapolation and no category verdict may
    rest on it.
  preregistered_prediction:
    quantity: >-
      Four quantities, fixed before any data exists. (1) residual_vs_estimator_law over the clamp-free window.
      (2) residual_vs_implementation_law over the same window. (3) null_gap. (4) level_separation.
    formula: >-
      The achievable count is the largest lift depth at which the minimum Babai-lifted pool norm clears the declared
      multiple of the Gaussian heuristic. Each residual is that count minus the named law evaluated at the same
      blocksize, seed-averaged. PREDICTED - residual_vs_estimator_law at least 1.5 dimensions in magnitude with a
      sign STABLE ACROSS SEEDS; residual_vs_implementation_law likewise at least 1.5; null_gap at least 1.0
      dimension; level_separation above 1.5 dimensions over the measured window, which is what makes the LEVEL test
      the discriminator. THE SLOPE TEST IS DEMOTED BY ARITHMETIC STATED IN ADVANCE - the two laws' slopes over the
      reachable window differ by far less than this design can resolve, so the fitted slope is reported with an
      interval and with a statement of which laws' slopes that interval excludes, as a consistency check only.
      Under the null that the conventions are empirically equivalent here, both residuals are within 1.5 of zero.
    source: >-
      Pre-registered in the parent proposal IDEA-20260821-374af4, predictions block, before any run under this
      contract exists. The parent's part-(B) law-versus-law arithmetic is HAND ARITHMETIC performed during its own
      repair pass, is NOT a run, has NO run record behind it, and Stage 0a exists to reproduce it programmatically
      before it is cited as a result. If Stage 0a disagrees, that part of the parent is void and the disagreement is
      the reportable outcome.
  scale_relevance:
    tier: toy
    justification: >-
      The executed blocksizes are far below the ones the estimator evaluates for the standardized parameter sets,
      and the clamp-free part of that window is only a few cells wide. THE WINDOW IS SET BY TWO HARD CONSTRAINTS,
      both stated - below the clamp crossover the implementation's applied value is forced by its wrapper, so
      residuals there cannot bear on the estimator's charge; and above the executed range the sieve cost grows
      steeply enough in the dimension that a substantially larger blocksize is outside any plausible batch budget,
      which committed timings at a lower dimension make concrete. The ONLY bridge to the standardized sets is H1,
      which is a pure extrapolation assumption with no random model behind it and which this contract cannot test.
      Every extrapolated number is labelled as extrapolated; a measurement that agrees with a law inside error is a
      real outcome that closes nothing.
    correspondence: null
  tail_checks:
  - >-
    Report the full lifted-minimum curve, not just the crossing depth, for at least one seed per blocksize, so a
    curve that crosses the radius and then RECROSSES is visible rather than silently reduced to one integer.
  - >-
    Report the achievable count at all three declared success radii, so a count that is stable across radii is
    distinguishable from one sitting on a knife edge.
  - >-
    Report NULL-A's achievable count as an INTERVAL over at least eight draws and state whether the real arm's
    interval overlaps it. An overlap is the S2 falsifier and must not be reported as a gap.
  - >-
    Report the deliberately under-preprocessed cell beside its properly preprocessed twin, so the preprocessing
    sensitivity is visible as a number rather than as a caveat.
  - >-
    Report, per cell, the measured peak resident memory against the analytically predicted pool size. A measured
    peak materially above the analytic size means the implementation holds more than the pool and that cell's cost
    is not comparable to the others.
  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
    note: >-
      Three seeds per blocksize for the real arm; NULL-A is drawn at least eight times per cell independently of the
      seed schedule, because it is a generated comparator and a residual read against a single draw is not
      reportable. The real and null arms at a given cell share the same basis and the same lifting code path.
  budget:
    wall_clock_seconds_per_run: 21600
    total_cpu_hours: 60.0
    maximum_memory_gb: 64
    maximum_runs: 40
  stopping_rules:
  - >-
    HALT if Stage 0a's programmatic reproduction disagrees with the committed discount values or with the blocksize
    inversion. The parent's arithmetic is wrong, every law-versus-law gap it states is void, and the disagreement is
    the deliverable. This is the cheapest way this contract can fail and it fails before any sieve runs.
  - >-
    HALT if the depth-zero bitwise regression against the independent pool-minimum code path fails. The lifting path
    is broken.
  - >-
    HALT if the monotonicity gate fails. No achievable count is reported and the batch reports an implementation
    defect.
  - >-
    HALT if the instrument rebuild receipt does not reproduce the committed pool size at the committed dimension.
    Infrastructure, not a result.
  - >-
    PER-CELL BUDGET STOP. If a (blocksize, seed) cell exceeds its declared per-cell wall-clock allowance, record it
    as BUDGET-STOPPED and continue. Budget exhaustion is a stop, never a negative result (AGENTS.md rule 5).
  - >-
    WINDOW FLOOR. If fewer than two CLAMP-FREE cells complete, NO residual against the estimator's charged law may
    be reported at all; the run reports the reduced window and stops. A one-cell residual is not a level test.
  - >-
    Stop at the declared windows, seeds, radii and null draw count. None is revised after data is seen; in
    particular the success radius is frozen in Stage 0c and a radius chosen afterward sets the achievable count to
    whatever is wanted.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first.
  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion, or a failed instrument rebuild makes the run failed_infrastructure and is
    NEVER negative mathematical evidence (AGENTS.md rule 5). The instrument's own committed reproducibility warning
    makes a rebuild failure a foreseeable infrastructure outcome, not a finding.
  - >-
    A run reporting ANY residual without naming its target law is invalid_reporting. Over the clamped cells the
    three targets differ by many dimensions and an unnamed residual is ambiguous by that much.
  - >-
    A run that MERGES the clamp-free and clamped windows into one residual is invalid_measurement.
  - >-
    A run that reports 'the implementation's applied value is far below the law' at a clamped cell as a FINDING is
    invalid_reporting; that value is forced by the wrapper and not by the lattice.
  - >-
    A run whose null arm was not executed in the same invocation, on the same basis and through the same lifting
    code path as the signal arm is invalid_measurement.
  - >-
    A run that reports an extrapolated bit correction as a MEASUREMENT rather than as an extrapolation under H1 is
    invalid_reporting.
  - >-
    A run that reports an achievable count without subtracting the closed-form pool-cardinality-forced component is
    invalid_measurement.
  - >-
    A run whose parameters differ from this frozen contract is a DIFFERENT experiment and needs a new contract.
  success_criterion: >-
    ALL SEVEN of the following, each decidable from the primary metrics. (1) Stage 0a's programmatic reproduction
    passes and the frozen clamp table and success radius are recorded before any data. (2) The instrument rebuild
    receipt reproduces the committed pool size. (3) The depth-zero bitwise regression and the monotonicity gate both
    pass. (4) f_meas is reported with a seed interval at every completed cell, with the primary and secondary
    windows labelled separately, and at least two clamp-free cells completed. (5) residual_vs_estimator_law and
    residual_vs_implementation_law are reported over the clamp-free window, each labelled with its target, and the
    clamped cells' three residuals are reported separately. (6) null_gap is reported with NULL-A drawn at least
    eight times per cell, and the four-branch verdict was emitted on NULL-A before the real arm. (7)
    forced_component_residual is reported. NOTE that success means THE MEASUREMENT WAS MADE AND ITS GATES PASSED;
    whether the hypothesis is supported is decided by the pre-registered prediction and the falsification criteria,
    and a completed run showing both residuals near zero is a successful run.
  falsification_criterion:
  - >-
    Both residuals lie within 1.5 dimensions of zero across the clamp-free window - the two laws agree with
    measurement and with each other where it can be checked, the convention question is EMPIRICALLY EMPTY in this
    range, and the extrapolation gap is the only remaining uncertainty. A real negative and the outcome to bet on
    second-most.
  - >-
    NULL-A returns the same achievable count as the sieve pool within its interval - the discount is a property of
    pool size and norm profile, NOT of sieving, and no sieve-derived statement is reportable from this instrument.
    A strong negative and the headline in that branch.
  - >-
    The tracked minimum is not monotone in lift depth - the lifting implementation is wrong; no achievable count is
    reported and the batch reports an implementation defect.
  - >-
    The measured achievable count equals the forced pool-cardinality component within error - the measurement is
    about cardinality and the tracked object dissolves.
  - >-
    The flat-profile nearby object returns the same achievable count as the q-ary bases - the instrument reads the
    lifting code rather than the lattice and the object is void.
  - >-
    The seed intervals at EVERY clamp-free cell overlap BOTH published laws - the reachable window cannot separate
    the conventions at the claimed resolution, and the record reports that the discrimination it proposed is not
    achievable on this instrument. Declared in advance so that it is a result and not a disappointment.
  - >-
    Stage 0a's programmatic inversion or reproduction disagrees with the parent's hand arithmetic - every gap figure
    in the parent's part (B) is void and the disagreement is the reportable result.
  required_artifacts:
  - >-
    manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block, the pinned
    instrument versions and environment
  - >-
    raw-result.json carrying every per-cell achievable count and the full lifted-minimum curve for at least one
    seed per blocksize, not summaries
  - >-
    NULL-A's per-draw measurements, at least eight per cell, in the same file as the signal arm
  - >-
    the frozen Stage-0 declaration - success radius, three residual targets, clamp table and crossover, and the
    closed-form pool-cardinality-forced component - hashed and written before any data
  - >-
    the Stage-0a reproduction receipt showing the committed discount values and the blocksize inversion reproduced
    programmatically
  - >-
    the instrument rebuild receipt reproducing the committed pool size at the committed dimension
  - >-
    the flat-profile nearby-object arm and the under-preprocessed cell, with their comparisons
  - >-
    the four-branch verdict as emitted on NULL-A, timestamped BEFORE the real arm's verdict
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval is required before execution. This contract is NOT approved; approved_by is null,
    execution_authorized is false and frozen is false (AGENTS.md rule 1). Approval is the user's gate because it
    authorizes execution and spends compute.
  - >-
    LEG 1 IS A COMPLETE DELIVERABLE ON ITS OWN AND COSTS NO SIEVE TIME. The Coordinator may authorize Stage 0 alone,
    which either voids the parent's law-versus-law arithmetic or freezes the clamp table and the radius; the
    measurement leg can then be authorized separately with a better-informed budget.
  - >-
    The budget here is the largest in this batch and the reachable window is only a few cells wide. The Coordinator
    should confirm before approval that the declared clamp-free window is actually reachable on the target machine,
    because a window that collapses to one cell makes the level test unreportable by this contract's own stopping
    rule.
  - >-
    Nothing here may be recorded as correcting any committed evidence record, and nothing here moves the status of
    the hypothesis whose conjunct supplies the margins. The independent-review requirement is unmet and inherited.
