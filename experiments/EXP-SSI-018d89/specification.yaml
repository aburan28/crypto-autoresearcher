# EXP-SSI-018d89
# Smallest prime self-isogeny degree for two supersingular j-invariants, p = 43.
# Not approved: the F_{43^2} self-isogeny lambda census driver is missing,
# and GOAL-SSI-001 is already at the approval-capacity cap.
# IDEA-20261006-9d9d22 / H-SSI-8a695a. No run is minted.
experiment:
  id: EXP-SSI-018d89
  hypothesis_id: H-SSI-8a695a
  source_idea: IDEA-20261006-9d9d22
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  version: 1
  title: >-
    Absolute difference of lambda(j1) and lambda(j2) for the first two
    supersingular j-invariants in F_{43^2}
  status: review_required
  frozen: false
  designed_at: '2026-10-07'
  approved_by: null
  execution_authorized: false
  objective: >-
    Build F_{43^2} with the smallest positive quadratic nonresidue d
    modulo 43, keep the first two supersingular j-invariants j1 and j2
    in the order b then a, and test whether |λ(j1) - λ(j2)| is at
    least 1, with each λ in {0, 2, 3, 5, 7, 11}.
  inputs:
    p: 43
    field: "F_43[alpha]/(alpha^2 - d)"
    d_rule: smallest positive quadratic nonresidue modulo 43
    order: b then a, a and b in 0..42
    primes: [2, 3, 5, 7, 11]
    models:
      generic: "y^2 = x^3 + 3 k x + 2 k, k = j / (1728 - j)"
      j_0: "y^2 = x^3 + 1"
      j_1728: "y^2 = x^3 + x"
  controls:
    - >-
      The model rebuilt from j has that same j. A mismatch invalidates
      λ for that vertex.
    - >-
      Two short-Weierstrass models of the same j, when a second model
      exists, yield the same λ.
    - >-
      Each accepted kernel has order ℓ, and the dual isogeny restores
      the source j. A failure invalidates that ℓ.
    - >-
      An ordinary j, the smallest a + b α that fails the trace test, is
      not assigned a λ. It only checks that the trace test can reject.
  independent_variables:
    - the ordered field elements a + b alpha
    - the prime ell in the fixed list 2, 3, 5, 7, 11
  metrics:
    primary:
      - absolute difference |lambda(j1) - lambda(j2)|
    secondary:
      - quadratic_nonresidue_d
      - supersingular_count_seen_before_j2
      - j1
      - j2
      - lambda_j1
      - lambda_j2
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: absolute difference |lambda(j1) - lambda(j2)|
    formula: >-
      lambda(j) is the smallest ell in {2, 3, 5, 7, 11} that occurs as
      a self-isogeny at j, or 0 if none occur. The prediction is
      |lambda(j1) - lambda(j2)| >= 1, with both values in
      {0, 2, 3, 5, 7, 11}.
    source: >-
      IDEA-20261006-9d9d22 predictions, read 2026-10-07. The prediction
      is the idea's own metric, direction different, minimum effect 1.
      It is not taken from a run.
  scale_relevance:
    tier: toy
    justification: >-
      One prime p = 43 and two vertices. No transfer to any larger
      prime or to path-finding is claimed. Exponent delta against the
      opened Õ(p^{1/4}) baseline is 0.
    correspondence: null
  tail_checks:
    - >-
      Sample size two has no tail. lambda(j1) = lambda(j2), including
      (0, 0), is the negative outcome, not a discarded sample.
  replication:
    seeds: []
    independent_instances: 1
    replication_note: >-
      One deterministic census on one field. No future run slot is
      named and no RUN id is minted.
  budget:
    enforcement: advisory
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one defined census or one invalidation.
    - A crash or timeout is incomplete, not a negative result.
  invalidation_rules:
    - p = 43 fails a primality check.
    - Fewer than two supersingular j-invariants exist in F_{43^2}.
    - A rebuilt model does not reproduce its input j.
    - A kernel accepted as order ell fails the dual restoration check.
    - The prime list is applied out of order, or ell = 2 is skipped.
    - A quaternion order or a connecting ideal is computed.
  success_criterion: >-
    The census is defined: two supersingular j-invariants j1 and j2 are
    found in the stated order, each rebuilt model reproduces its input
    j, each accepted kernel has order ell, and each dual restores the
    source j. lambda(j1) and lambda(j2) lie in {0, 2, 3, 5, 7, 11} and
    |lambda(j1) - lambda(j2)| is at least 1.
  falsification_criterion: >-
    The census is defined under the same controls, both lambda values
    lie in {0, 2, 3, 5, 7, 11}, and lambda(j1) equals lambda(j2),
    including the pair (0, 0). Equality is a real result, not an
    invalid run.
  decision_impact:
    on_positive: >-
      Record that the five-prime cap separates j1 and j2 at p = 43, so
      |lambda(j1) - lambda(j2)| >= 1. The hypothesis may move to
      analyzed only after a run receipt. The opened baselines
      Õ(p^{1/2}) and Õ(p^{1/4}) stay as stated in KN-TECH-024 and
      KN-LIT-078. No connecting ideal is produced.
    on_negative: >-
      Record that lambda(j1) equals lambda(j2) inside the cap,
      including (0, 0), so this separation is absent for this pair. The
      inequality is rejected in that exact scope. A shared 0 does not
      assert that the endomorphism rings are equal. The same baselines
      stay unchanged.
  required_artifacts:
    - experiments/EXP-SSI-018d89/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-SSI-018d89/runs/<RUN-ID>/command.txt
    - experiments/EXP-SSI-018d89/runs/<RUN-ID>/stdout.log
    - experiments/EXP-SSI-018d89/runs/<RUN-ID>/stderr.log
    - experiments/EXP-SSI-018d89/runs/<RUN-ID>/raw-result.json
  assigned_to: executor
  missing_driver: >-
    No committed program builds F_{43^2} = F_43[alpha]/(alpha^2 - d)
    with d the smallest positive quadratic nonresidue modulo 43, scans
    j = a + b alpha in order of b then a, keeps the first two j whose
    short-Weierstrass model has Frobenius trace divisible by 43, and
    for each kept j and for ell in {2, 3, 5, 7, 11} computes the
    ell-division polynomial, applies Vélu, and writes lambda_j1 and
    lambda_j2. harness/isogeny_class.py velu_odd refuses even ell,
    including ell = 2, and does not implement that census.
    harness/endosweep/explicit.py division_polynomials computes
    division polynomials of one prime-field model (p, a, b) and does
    not scan F_{43^2} or compare a Vélu codomain j to the source j.
    There is no trial-plan.json. This replication plan names no run
    slot, so no RUN id is minted.
  out_of_scope:
    - Any prime other than 43.
    - A maximal order, a quaternion path, or a connecting ideal.
    - A claim that changes the opened path-finding exponents.
