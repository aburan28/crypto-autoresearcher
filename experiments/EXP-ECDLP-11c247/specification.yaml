  execution_authorized_stages: [0]
  execution_authorized_decision: DEC-20260908-be0e26
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260908-97f3b8
  source_proposal: IDEA-20260902-a0ed78
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-be0e26 under the standing 2026-09-06
    user authorization. Stage 0 is the exact Galois
    product identity calibrator at d in {1,2}. Fibre
    census, Chebotarev size law, yield census, and
    conorm smoothness are later stages and are not
    run here.

  objective: >
    Evaluate the exact rational identity
    product(d, delta)=delta times d
    equals 1 on Galois slices of one
    frozen family (REAL, KF, NULL) at
    d in {1,2} and decide whether the
    cover-image count calibrator works.
    Stage 0 does not enumerate fibres
    and does not authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL identity
      product=1; REAL Kummer product=1;
      KF wrong-delta product=2 not 1;
      NULL zero-product=0 not 1; d=0
      rejected. Certificate kind none.
    formula: >
      product(d, delta_num, delta_den)
      equals (delta_num times d) /
      delta_den. Galois equality is
      product=1. Frozen identity:
      d=1, delta=1/1, product=1.
      Frozen Kummer: d=2, delta=1/2,
      product=1. KF uses delta=1/1 at
      d=2 so product=2. FORCED Stage 0:
      fixture_pass, real_count_pass,
      known_false_wrong_delta_pass,
      reject_invalid_pass,
      null_zero_pass all true.
    source: >
      ledger/proposals/IDEA-20260902-a0ed78.yaml
      (S1) Galois equality as Stage 0
      hard-gate identity.
      Provenance internal; read in this design session.

  design_tightening_stage0_is_instrument_not_audit: >
    IDEA-20260902-a0ed78 Stage 0 is
    write (R)/(S)/(S1)/(S2) and Stage 1
    is a fibre root-finding census at
    toy p. Stage 0 here is a disclosed
    tightening: the Galois equality
    delta times d equals 1 at two
    frozen degrees, not the fibre
    census, not Chebotarev size, not
    yield, not conorm. Exact rational
    product identities are the only
    Stage 0 arm.

  inputs:
    fixture:
      degrees_frozen: [1, 2]
      real_identity:
        id: REAL-ID
        d: 1
        delta_num: 1
        delta_den: 1
        must_product: 1
        role: real_identity
      real_kummer:
        id: REAL-K
        d: 2
        delta_num: 1
        delta_den: 2
        must_product: 1
        role: real_kummer_galois
      known_false:
        id: KF
        wrong_delta: true
        d: 2
        delta_num: 1
        delta_den: 1
        must_product: 2
        must_not_equal_real: true
        role: known_false_wrong_delta
      matched_null:
        id: NULL
        kind: zero_product
        must_product: 0
        must_not_equal_real: true
        role: matched_null_zero_product
      invalid:
        - id: d-zero
          d: 0
          must_reject: true
      working_model: >
        Exact Galois product identity at
        frozen d in {1,2}. Not a fibre
        census. Not a Chebotarev size
        law. Not a yield census. Not a
        conorm arm. Not a rho beat.
      do_not_enumerate_fibres: true
      do_not_measure_chebotarev: true
      do_not_count_yield: true
      do_not_run_conorm: true

  independent_variables:
    - object in the frozen family
    - whether delta is 1/d or 1
    - whether d is a frozen positive degree

  null_object:
    name: zero-product at frozen degrees
    construction: >
      Replace the product formula by
      the zero product. product=0,
      which is not 1. This is the
      nearby-object control with the
      structure term removed.
    non_degeneracy_check: >
      known_false_wrong_delta_pass must
      be true before any REAL identity
      is read as a measurement.
    dynamic_range_demonstration: >
      d=0 must be rejected before an
      identity is read as a census.

  controls:
    - KF wrong-delta product=2 (known-false / proves-too-much)
    - REAL identity product=1 and REAL Kummer product=1
    - NULL zero-product rejection of collapse
    - d=0 rejection
    - exact rational arithmetic, no floats
    - degrees frozen before any fibre is enumerated

  metrics:
    primary:
      - fixture_pass boolean
      - real_count_pass boolean
      - known_false_wrong_delta_pass boolean
      - reject_invalid_pass boolean
      - null_zero_pass boolean
    secondary:
      - REAL-ID product
      - REAL-K product
      - KF product
      - NULL product
      - wall-clock seconds and peak RSS

  heuristic_under_test: none

  scale_relevance:
    tier: toy
    justification: >
      Frozen rational identities at
      d in {1,2}. No transfer to a
      fibre census, Chebotarev size
      law, yield, conorm, or
      cryptographic p.
    correspondence: null

  tail_checks:
    - REAL identity is product=1
    - REAL Kummer is product=1
    - KF is product=2
    - NULL is product=0
    - d=0 is rejected

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 0 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: fixture_pass,
      real_count_pass,
      known_false_wrong_delta_pass,
      reject_invalid_pass, and
      null_zero_pass. A miss classifies
      the run failed_infrastructure if it is
      a size or encoding bug, otherwise it
      is a scoped falsification of P-S0-DELTA.
    - Stages 1 and later are not authorized.
    - Do not enumerate fibres.
    - Do not measure Chebotarev size.
    - Do not count yield.
    - Do not run conorm smoothness.
    - Do not identify a rho cost.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 0 is not in execution_authorized_stages
    - Changing the frozen degrees after this freeze
    - Enumerating fibres because a frozen identity fails
    - Reading Stage 0 as a fibre census, Chebotarev size law, yield census, conorm arm, or a decoder
    - Reading Stage 0 as an ECDLP advantage or a rho beat
    - Authorizing Stage 1 of EXP-ECDLP-11c247 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-114eb2 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-821bc5 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-735974 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-fdae20 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-089e80 from this contract
