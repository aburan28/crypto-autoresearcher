    - Authorizing Stage 2 of EXP-ECDLP-4be480 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-6a97f4 from this contract
    - Authorizing Stage 17 of EXP-ECDLP-420e73 from this contract
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this contract
    - Editing EXP-ECDLP-a5f766 or H-ECDLP-a3598b
    - Changing H-ECDLP-7df817, H-ECDLP-92e64c, H-ECDLP-881d63, H-ECDLP-9a1388, H-ECDLP-7f5b05, H-ECDLP-e54f8c, H-ECDLP-a69bea, H-ECDLP-38f4b4, H-ECDLP-a23318, H-ECDLP-536b21, H-ECDLP-3f68f6, H-ECDLP-b51c3d, H-ECDLP-4afa77, H-ECDLP-2ac931, H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6, or H-ECDLP-2ade73
    - Dispatching EXP-ECDLP-df601f from BATCH-5a5091
    - Designing IDEA-20260902-2327a5 as a Stage 0 duplicate of EXP-ECDLP-821bc5

  success_criterion: >
    Stage 0 succeeds as a measurement when
    fixture_pass, real_count_pass,
    known_false_wrong_delta_pass,
    reject_invalid_pass, and
    null_zero_pass are true, and the
    run manifest carries certificate.kind
    none. Success is instrument
    reproduction, not a fibre census
    and not an attack.

  falsification_criterion: >
    A certified KF miss of the gap 2 not 1
    after fixture_pass is a scoped miss
    of P-S0-DELTA. A certified REAL identity
    miss after fixture_pass is a scoped
    miss of P-S0-DELTA. Infrastructure bugs
    are not mathematics. Stage 0 does not
    test P-S1-FIBRE.

  required_artifacts:
    - Stage 0 raw-result.json with the five gates
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt

  assigned_to: executor

  limitations:
    - Frozen toy identity at d in {1,2}.
    - Not a fibre census. Not a Chebotarev size law.
    - Not a yield census. Not a conorm arm. Not a rho cost.
    - Not a rho beat. Not the O2-line W.
    - No decoder. No cryptographic transfer.
    - No Stage 1 of 11c247. No Stage 1 of 114eb2.
      No Stage 1 of 821bc5. No Stage 1 of 735974.
      No Stage 1 of fdae20. No Stage 1 of 089e80.
      No Stage 1 of b3f975. No Stage 1 of daf1bb.
