# EXP-ECDLP-5e666a
# Digit-count arithmetic. No curve point is added.
# Approved by DEC-20261004-b1e1f9.
experiment:
  id: EXP-ECDLP-5e666a
  hypothesis_id: H-ECDLP-73073e
  source_idea: IDEA-20261003-45e0e0
  question_id: RQ-ECDLP-002
  version: 1
  title: Doubling count and addition count of the integer 17
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-b1e1f9
  objective: >-
    Check the counts 5, 4, and 1, the product 20, and the nearby gap 0.
  inputs:
    bit_length: 5
    doublings: 4
    additions: 1
    length_gap: 1
    doubling_gap: 3
    digit_product: 20
    digit_sum: 10
    nearby_a: 1
    nearby_b: 1
    nearby_gap: 0
    nearby_product: 1
  controls:
    - >-
      The bit length is 5. The doubling count is 4. The addition
      count is 1. Reporting the addition count as 4 drops the gap
      against the doubling count and invalidates the run.
    - >-
      Five exceeds four by 1. Four exceeds one by 3. The product
      of 5, 4, and 1 is 20. Their sum is 10.
    - >-
      Two readings of the addition count are both 1. Their gap is
      0 and their product is 1.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {bits, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - additions
      - implementations_agree
    secondary:
      - digit_product
      - digit_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The integer 17 has bit length 5, 4 doublings, and 1
      addition. The gap of two addition counts is 0.
    formula: >-
      Read the bit length 5. Count 4 doublings. Count 1 addition.
      Multiply 5, 4, and 1. Subtract 1 from 1.
    source: >-
      IDEA-20261003-45e0e0 states the counts 5, 4, and 1, read
      2026-10-04. The gaps, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 20 and the nearby gap 0 are required. A check that stops at the bit length 5 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the addition count 1 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 5.
    - The doubling count is not 4.
    - The addition count is not 1.
    - The product is not 20.
    - The addition count is reported as 4, or a curve point is added.
  success_criterion: >-
    Both runs agree that the bit length is 5, that the doubling
    count is 4, that the addition count is 1, and that the product
    of those three counts is 20.
  falsification_criterion: >-
    The runs agree that the addition count is computed, and that
    count is not 1.
  required_artifacts:
    - experiments/EXP-ECDLP-5e666a/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-5e666a/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-5e666a/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-5e666a/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-5e666a/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-5e666a/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a digit-count gap moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
