# EXP-ECDLP-9095d4
# Digit-count arithmetic. No curve point is added.
# Approved by DEC-20261004-c3466e.
experiment:
  id: EXP-ECDLP-9095d4
  hypothesis_id: H-ECDLP-9594d9
  source_idea: IDEA-20261004-321913
  question_id: RQ-ECDLP-002
  version: 1
  title: Doubling count and addition count of the integer 32767
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-c3466e
  objective: >-
    Check the counts 15, 14, and 14, the product 2940, and the nearby gap 0.
  inputs:
    bit_length: 15
    doublings: 14
    additions: 14
    length_gap: 1
    doubling_gap: 0
    digit_product: 2940
    digit_sum: 43
    nearby_a: 14
    nearby_b: 14
    nearby_gap: 0
    nearby_product: 196
  controls:
    - >-
      The bit length is 15. The doubling count is 14. The addition
      count is 14. Reporting the addition count as 15 drops the gap
      against the bit length and invalidates the run.
    - >-
      Fifteen exceeds fourteen by 1. Fourteen equals fourteen, so that
      gap is 0. The product of 15, 14, and 14 is 2940. Their sum is 43.
    - >-
      Two readings of the addition count are both 14. Their gap is
      0 and their product is 196.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {bits, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - additions
      - implementations_agree
    secondary:
      - digit_product
      - digit_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The integer 32767 has bit length 15, 14 doublings, and 14
      additions. The gap of two addition counts is 0.
    formula: >-
      Read the bit length 15. Count 14 doublings. Count 14 additions.
      Multiply 15, 14, and 14. Subtract 14 from 14.
    source: >-
      IDEA-20261004-321913 states the counts 15, 14, and 14, read
      2026-10-04. The gaps, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 2940 and the nearby gap 0 are required. A check that stops at the bit length 15 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the addition count 14 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 15.
    - The doubling count is not 14.
    - The addition count is not 14.
    - The product is not 2940.
    - The addition count is reported as 15, or a curve point is added.
  success_criterion: >-
    Both runs agree that the bit length is 15, that the doubling
    count is 14, that the addition count is 14, and that the product
    of those three counts is 2940.
  falsification_criterion: >-
    The runs agree that the addition count is computed, and that
    count is not 14.
  required_artifacts:
    - experiments/EXP-ECDLP-9095d4/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-9095d4/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-9095d4/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-9095d4/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-9095d4/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-9095d4/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a digit-count gap moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
