# =============================================================================
# EXP-CSIDH-906d0e — version 1, designed and approved 2026-10-09 by
# DEC-20261009-3fa819 under the standing user authorization, after the
# launcher was committed and runnability proven (AGENTS.md, "Approval
# is bounded by execution"). Frozen ancilla-width comparison for
# IDEA-20261006-fd07db. Success is the idea's prediction: on the frozen
# cell, width_I is at least twice width_F. The concrete negative is
# agreement on both pairs with a ratio strictly below 2. The designing
# session built the launcher and validated the machinery end to end at
# discriminants -23 and -83 (run.py --self-test: both circuits agree
# with each other and with the classical mirror on every composable pair,
# widths and gate counts constant across pairs, inputs unchanged) and
# verified the algebraic control identities at -59 by hand; it did NOT
# execute the frozen -59 cell, so no width at -59 was observed before
# freezing. No discrete logarithm is authorized.
# =============================================================================
experiment:
  id: EXP-CSIDH-906d0e
  hypothesis_id: H-CSIDH-2e274b
  question_id: RQ-CSIDH-64343f
  goal_id: GOAL-CSIDH-001
  source_idea: IDEA-20261006-fd07db
  version: 1
  designed_at: '2026-10-09'
  title: >-
    Ancilla-width ratio of Dirichlet-composition and ideal-multiplication
    reversible NCT circuits at discriminant -59
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-09'
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261009-3fa819
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null and
      the trial plan names a driver and a checker whose machinery the
      designing session validated at discriminants -23 and -83.
      Approval does not assert that the ratio is at least 2, does not
      assert that it is below 2, and does not assert that any exponent
      or security level moves.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Build Circuit-F and Circuit-I at discriminant -59 only, evaluate
      them on the frozen pairs (A, B) and (P, P), run the
      discriminant -60 refusal control, and name exactly one reading
      row. The widths, the ratio, the agreement bits, the (P, P)
      value check, the -60 refusal bits, and the gate counts are the
      recorded numbers. Do not rebuild a circuit after seeing a width,
      do not add a pair, do not change the 16-bit encoding or the
      fresh-bit allocation discipline, and do not search for a
      discrete logarithm. No quantum circuit is run.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether the reversible NCT circuit that multiplies ideals in
    Z[(1+sqrt(-59))/2] needs at least twice the ancilla of the
    reversible NCT circuit that composes binary quadratic forms, for one
    class-group composition step at discriminant -59 under the frozen
    16-bit encoding and fresh-bit allocation discipline. The primary
    metric is the ratio width_I / width_F, scored only when both
    circuits return the same reduced form on both frozen pairs and the
    instrument checks pass. The concrete negative is agreement on both
    pairs with a ratio strictly below 2. No faster hidden-shift
    algorithm is in scope.

  what_this_is_not:
    - >-
      Not a CSIDH-512 gate count.
    - >-
      Not a Kuperberg cost and not a quantum cost.
    - >-
      Not a security level for any CSIDH parameter set.
    - >-
      Not a theorem that every ideal-multiplication circuit is wider than
      every form-composition circuit.
    - >-
      Not approval of a hypothesis: approval authorizes execution of
      this contract only; it asserts nothing about the ratio.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      The two ancilla widths, their ratio, the agreement bits, the
      control bits, and the gate counts at discriminant -59 under the
      frozen 16-bit encoding, NCT gate set, and fresh-bit allocation
      discipline, for the two frozen circuits on the two frozen pairs.
      Nothing about any other discriminant, bit width, circuit, or
      encoding follows, and no CSIDH security level follows.

  inputs:
    discriminant: >-
      D = -59 is fundamental (59 is congruent to 3 modulo 4). The
      order is O = Z[(1+sqrt(-59))/2]; omega = (1+sqrt(-59))/2
      satisfies omega^2 = omega - 15.
    form_set: >-
      F is the set of reduced positive-definite binary quadratic forms
      (a, b, c) of discriminant -59 under the reduced convention
      -a < b <= a <= c, with b >= 0 when |b| = a or a = c. The run
      re-derives F and its cardinality; this record does not assert |F|
      as an observation. Fewer than three forms as re-derived by the
      run is the idea's own negative row, too_few_forms.
    principal_and_generators: >-
      P is the principal form (1,1,15). A and B are the two
      lexicographically smallest forms of F distinct from P, ordered by
      (a, b, c) with b in (-a, a]; as frozen definitions for the
      circuits, A = (3,-1,5) and B = (3,1,5). B is the inverse class of
      A, so the composite class of (A, B) is the principal class, and
      P composes with itself to P. These are structural identities used
      as expected control values, not measurements.
    encoding: >-
      Each form coefficient is one signed 16-bit two's-complement
      register. Input registers (a1,b1,c1,a2,b2,c2) are 96 bits;
      output registers (a,b,c) are 48 bits. Inputs are never written.
    ancilla_definition: >-
      Ancilla qubits are zero-initialized bits that are not part of the
      input or output registers; garbage bits not returned to zero count
      toward the width. Frozen allocation discipline for both circuits:
      every temporary result of every arithmetic operation is a fresh
      zero-initialized bit (no time reuse of scratch bits); bounded
      loops are unrolled to the frozen iteration bounds with fresh
      temporaries per iteration; no garbage uncomputation.
    shared_substrate: >-
      Both circuits use the same shared reversible arithmetic substrate:
      the same ripple-carry adder, two's-complement negation,
      comparator, conditional swap, shift-add multiplier, restoring
      divider, and extended-gcd blocks, each built from NOT, CNOT and
      Toffoli only.
    circuit_F: >-
      Dirichlet composition, frozen algorithm. (i) Input validation:
      each form must satisfy b odd and b^2 - 4ac = -59 (parity and
      discriminant equations; a violation raises a refusal flag and no
      output is written). (ii) Unimodularity fix: while gcd(a1, a2)
      is not 1, apply the SL2 transformation T: (a,b,c) -> (a+b+c, b+2c,
      c) to the first form, at most 3 times (refusal flag if the pair is
      still not coprime). The CRT congruence b1 = b2 modulo 2 holds
      structurally because both b's are validated odd, so the loop
      condition reduces to coprimality. (iii) Require gcd(a1, a2) = 1
      on the fixed forms (refusal flag otherwise). (iv) CRT:
      B_mid is the solution congruent to b1 modulo 2*a1 and to b2
      modulo 2*a2, computed via one extended-gcd. (v) A_mid = a1*a2
      and C_mid = (B_mid^2 + 59) / (4*a1*a2) by square-and-divide. (vi)
      Gauss reduction of (A_mid, B_mid, C_mid): at most 8 iterations
      of (b <- b mod 2a into (-a, a]; c <- (b^2+59)/(4a); if a > c then
      swap a,c and negate b), refusal flag if not reduced after 8.
      (vii) Write the reduced form to the output registers.
    circuit_I: >-
      Ideal multiplication, frozen algorithm. (i) The same input
      validation as Circuit-F. (ii) m_i = (-b_i - 1)/2, so form i maps
      to the ideal with Z-basis vectors (a_i, 0) and (m_i, 1) in the
      basis {1, omega}. (iii) The four product generators via the ring
      multiplication (x1 + y1*omega)(x2 + y2*omega) =
      (x1*x2 - 15*y1*y2) + (x1*y2 + x2*y1 + y1*y2)*omega: (a1*a2, 0),
      (a1*m2, a1), (a2*m1, a2), (m1*m2 - 15, m1 + m2 + 1). (iv)
      Integer-lattice normalization of the four generators: k = gcd of
      all eight coordinates (content); h3 = gcd of the four
      omega-coordinates, with the refusal check h3 = k; column
      reduction isolating the omega-coordinate columns; h1 = gcd of the
      constant-coordinate columns; A = h1 / k; M = (constant
      coordinate of the omega-column)/k reduced modulo A. (v) The form
      (A, -2*M - 1, ((-2*M-1)^2 + 59)/(4*A)). (vi) The same Gauss
      reduction subroutine, same frozen bound 8. (vii) Write the
      output.
    check_pairs: >-
      The frozen check pairs are (A, B) and (P, P). The non-fundamental
      control is the pair ((1,0,15), (1,0,15)) of discriminant -60,
      which must make both builders refuse (parity/equation flags);
      silent agreement on a computed output voids the run.
    expected_control_values: >-
      (P, P) composes to (1,1,15) in both circuits. (A, B) composes to
      the principal class in both circuits; both must output (1,1,15)
      after reduction. These are structural identities used as expected
      control values, not measurements.
    ancilla_accounting: >-
      The width accountant excludes exactly the 96 input and 48 output
      bits. A simulation asserts that the input registers are unchanged
      and that every ancilla bit was zero-initialized. The accounting
      policy is identical for both circuits. A width that counts an
      input or output register as ancilla voids the run.

  controls:
    - id: principal-pair
      statement: >-
        (P, P) composes to (1,1,15) in both circuits. Any other product
        on that pair is instrument_failure.
    - id: nonfundamental
      statement: >-
        The discriminant -60 pair ((1,0,15), (1,0,15)) must be refused
        by both builders. Silent agreement on a computed output voids
        the run.
    - id: ancilla-definition
      statement: >-
        The accountant excludes exactly the 96 input and 48 output
        bits, the simulation asserts the input registers are unchanged
        and every ancilla bit was zero-initialized, and the policy is
        identical for both circuits. A width that counts an input or
        output register as ancilla voids the run.
    - id: no-reuse
      statement: >-
        The allocator hands each scratch bit out at most once
        (fresh-bit-per-temporary discipline), the same for both
        circuits. A circuit that reuses a scratch bit in time is a
        different circuit and voids the run.

  independent_variables:
    - representation in {dirichlet forms, ideals}
    - input pair in {(A, B), (P, P)}

  metrics:
    primary:
      - id: width_ratio
        statement: >-
          The ratio width_I / width_F as an exact rational number,
          scored only when the agreement bits on both frozen pairs are
          true and the instrument checks pass.
    secondary:
      - id: form_count
        statement: the cardinality of F as re-derived by the run
      - id: width_F
        statement: the ancilla width of Circuit-F in bits
      - id: width_I
        statement: the ancilla width of Circuit-I in bits
      - id: agreement_bits
        statement: one agreement bit per frozen pair, (A, B) and (P, P)
      - id: pp_value_check
        statement: >-
          the (P, P)-value check bit, true when both circuits output
          (1,1,15) on (P, P)
      - id: minus60_refusal_bits
        statement: the discriminant -60 refusal bit per circuit
      - id: gate_counts
        statement: NOT, CNOT, and Toffoli totals per circuit

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 says the ideal representation carries two Z-basis elements
    and a lattice normalization while the form representation carries
    three coefficients and one Chinese-remainder step, so under the
    frozen no-reuse allocation discipline the first needs at least twice
    the ancilla of the second at this bit width. The row ratio_below_two
    is the negative for the claim on this cell. It is not a refutation
    of any other circuit, discriminant, or encoding. Do not relabel an
    instrument failure as a ratio.

  preregistered_prediction:
    quantity: >-
      The ratio width_I / width_F on the frozen cell: both circuits,
      both pairs (A, B) and (P, P), scored only when the agreement
      bits on both pairs are true and the instrument checks pass.
    formula: >-
      The ratio is at least 2. The concrete negative is agreement on
      both pairs with a ratio strictly below 2. Source idea
      IDEA-20261006-fd07db, frozen before the frozen -59 cell was ever
      executed: the designing session's validation runs used the
      discriminants -23 and -83 only.
    source: >-
      IDEA-20261006-fd07db, heuristic H1. The selecting session
      verified the algebraic control identities, the principal-form
      values and the inverse-class relation by hand, and validated the
      launcher machinery at discriminants -23 and -83
      (run.py --self-test), but never executed the frozen -59 cell, so
      no width of the frozen cell was observed before freezing. KN-LIT-508,
      opened when the idea was filed, counts class-number
      indivisibility and does not predict this ratio.

  scale_relevance:
    tier: toy
    justification: >-
      One discriminant below 200, one bit width, two circuits, two
      pairs: a complete cell, not a sample. No transfer to CSIDH-512
      or to any cryptographic class group is assumed. The minimum
      effect is the idea's own factor of 2.
    correspondence: >-
      Direct classical simulation of the two reversible circuits. No
      Deuring correspondence is used.

  tail_checks:
    - >-
      Flag whether either width exceeds four times the other. The flag
      does not change the reading row.

  replication:
    seeds:
      - EXP-CSIDH-906d0e|circuit-F|pair-(A,B)
      - EXP-CSIDH-906d0e|circuit-F|pair-(P,P)
      - EXP-CSIDH-906d0e|circuit-I|pair-(A,B)
      - EXP-CSIDH-906d0e|circuit-I|pair-(P,P)
    independent_instances: 1
    note: >-
      The computation is deterministic; no randomness enters. The seeds
      name the two circuits and the two pairs, which are the whole
      frozen cell. Nothing is sampled.

  budget:
    enforcement: advisory
    maximum_runs: 1
    maximum_memory_mb: 512
    watchdog_seconds: 120
    watchdog_reason: >-
      Machine protection for two classical bit-level circuit simulations
      on one core; expiry is failed_infrastructure, not a width.
    budget_note: >-
      Wall-clock and CPU figures are advisory with no cap, so none is
      set. The memory figure and the watchdog are machine protection,
      not a research budget. One trial: the single run id
      RUN-CSIDH-760fc4 covers both frozen pairs, both circuits, and
      the discriminant -60 control.

  stopping_rules:
    - >-
      One run id, RUN-CSIDH-760fc4, covers both pairs, the -60
      control, both circuits, and exactly one reading row. No second
      run id is opened.
    - Do not rebuild a circuit after seeing a width.
    - Do not add a pair after seeing a width.
    - A timeout voids the run. It does not fill the negative row.

  invalidation_rules:
    - >-
      A timeout, crash, or memory abort is failed_infrastructure, never
      a mathematical negative.
    - Refusal on a frozen pair voids the run.
    - Silent agreement on the discriminant -60 control voids the run.
    - A disagreement used in the score voids the run.
    - >-
      An ancilla-definition violation, including a width that counts an
      input or output register as ancilla, voids the run.

  success_criterion: >-
    The run finishes, the instrument checks pass, both pairs agree, and
    width_I is at least twice width_F. This is the prediction of
    IDEA-20261006-fd07db. It is reachable as a failure when the same
    conditions hold and the ratio is strictly below 2.

  falsification_criterion: >-
    The instrument checks pass, both pairs agree, and the ratio is
    strictly below 2. That finished agreement is the concrete negative
    named with the source idea. The row too_few_forms, |F| < 3 as
    re-derived by the run, is the idea's own negative row and is not
    this criterion. A refusal on a frozen pair, a silent -60
    agreement, a disagreement used in the score, and a timeout are
    instrument rows, not this negative.

  decision_impact:
    on_positive: >-
      A later evidence review may record that, under this 16-bit NCT
      encoding and fresh-bit allocation discipline, the
      ideal-multiplication representation costs at least twice the
      ancilla of the Dirichlet-composition representation for one
      composition step at discriminant -59, which prices the
      representation choice for the reversible group-action circuit
      GOAL-CSIDH-001 wants built. The generic hidden-shift exponent is
      unchanged and no CSIDH security level is claimed.
    on_negative: >-
      A later evidence review may record that the same frozen circuits
      agree and the ratio is strictly below 2, so the two-representation
      ancilla separation fails at this discriminant and encoding and the
      representation choice must be made on other grounds. The two
      outcomes name different rational numbers and different readings.

  required_artifacts:
    - experiments/EXP-CSIDH-906d0e/runs/RUN-CSIDH-760fc4/manifest.yaml
    - experiments/EXP-CSIDH-906d0e/runs/RUN-CSIDH-760fc4/raw-result.json
    - experiments/EXP-CSIDH-906d0e/runs/RUN-CSIDH-760fc4/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: instrument_failure
      when: >-
        any control or accounting guard fails: silent -60 agreement,
        (P, P) not composing to (1,1,15), disagreement on a scored
        pair, an ancilla-definition violation, or refusal on a frozen
        pair
    - id: too_few_forms
      when: >-
        |F| < 3 as re-derived by the run; the idea's own negative
    - id: ratio_below_two
      when: >-
        the instrument checks pass, both pairs agree, and the ratio is
        strictly below 2
    - id: ratio_at_least_two
      when: >-
        the instrument checks pass, both pairs agree, and the ratio is
        at least 2
  reading_rule: >-
    Name exactly one row, the first whose condition holds in the order
    listed. ratio_at_least_two is the only success row. ratio_below_two
    is the concrete negative. too_few_forms is the idea's own negative
    row and is not an instrument failure. instrument_failure is not a
    value of the ratio. Record |F|, width_F, width_I, the ratio, the
    two agreement bits, the (P, P)-value check bit, the discriminant
    -60 refusal bit per circuit, the gate counts per circuit, and
    attack_claimed false beside the row. Those fields do not change the
    row.

  launcher:
    driver: experiments/EXP-CSIDH-906d0e/implementation/run.py
    checker: experiments/EXP-CSIDH-906d0e/implementation/check.py
    note: >-
      The driver and the checker are committed by the designing session
      before approval; a contract whose launcher is absent stays
      review_required. The launcher is bound by the trial plan's source
      hashes at run admission.
