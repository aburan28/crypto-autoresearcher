# EXP-ECDLP-6e332b
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261004-a4409d.
experiment:
  id: EXP-ECDLP-6e332b
  hypothesis_id: H-ECDLP-5cca8d
  source_idea: IDEA-20261004-25eeb0
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-20 table versus width-19 table
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-a4409d
  objective: >-
    Check the table sizes 524288 and 262144, the product 137438953472, and the nearby gap 0.
  inputs:
    width_hi: 20
    width_lo: 19
    table_hi: 524288
    table_lo: 262144
    table_gap: 262144
    table_product: 137438953472
    table_sum: 786432
    nearby_a: 262144
    nearby_b: 262144
    nearby_gap: 0
    nearby_product: 68719476736
  controls:
    - >-
      Two to the power 19 is 524288. Two to the power 18 is 262144.
      Reporting both tables as size 262144 drops the gap and invalidates
      the run.
    - >-
      Five hundred twenty-four thousand two hundred eighty-eight exceeds
      two hundred sixty-two thousand one hundred forty-four by 262144.
      The product of the two sizes is 137438953472. Their sum is 786432.
    - >-
      Two width-19 tables each store 262144. Their gap is 0 and their
      product is 68719476736.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-20 table stores 524288 entries. The width-19 table stores
      262144. The gap of two width-19 tables is 0.
    formula: >-
      Compute 2 to the power 19. Compute 2 to the power 18. Subtract
      262144 from 524288. Multiply 524288 by 262144. Subtract 262144 from 262144.
    source: >-
      IDEA-20261004-25eeb0 states the widths 20 and 19 and the sizes
      524288 and 262144, read 2026-10-04. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 137438953472 and the nearby gap 0 are required. A check that stops at the size 524288 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 524288 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 19 is not 524288.
    - Two to the power 18 is not 262144.
    - The gap is not 262144.
    - The product is not 137438953472.
    - Both tables are reported as size 262144, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-20 table stores 524288 entries, that
    the width-19 table stores 262144, and that 524288 exceeds 262144 by 262144.
  falsification_criterion: >-
    The runs agree that the width-20 table size is computed, and
    that size is not 524288.
  required_artifacts:
    - experiments/EXP-ECDLP-6e332b/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-6e332b/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-6e332b/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-6e332b/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-6e332b/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-6e332b/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 262144 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
