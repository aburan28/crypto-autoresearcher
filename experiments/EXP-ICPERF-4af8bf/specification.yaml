# EXP-ICPERF-4af8bf
# Binomial ceiling ratios. No solver.
# Approved by DEC-20261002-3458f4.
experiment:
  id: EXP-ICPERF-4af8bf
  hypothesis_id: H-ICPERF-a5f550
  source_idea: IDEA-20260915-69941f
  question_id: RQ-ICPERF-94c86e
  version: 1
  title: Binomial ceiling ratios
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-3458f4
  objective: >-
    Check the three binomials, the degree-step factors, and the
    comparison of the larger square with a factor-10 inflation of the
    smaller square.
  inputs:
    binom_8_3: 56
    binom_9_4: 126
    binom_20_3: 1140
    dimension_ratio_num: 285
    dimension_ratio_den: 14
    spread_cap: 10
    dimension_gap_num: 145
    dimension_gap_den: 14
    degree_step_num: 9
    degree_step_den: 4
    degree_step_above_two_num: 1
    degree_step_above_two_den: 4
    dimension_cap: 2
    squared_step_num: 81
    squared_step_den: 16
    squared_below_cap_num: 79
    squared_below_cap_den: 16
    cubed_step_num: 729
    cubed_step_den: 64
    cubed_above_cap_num: 89
    cubed_above_cap_den: 64
    small_square: 3136
    large_square: 1299600
    inflated_small: 31360
    inflated_ratio_num: 16245
    inflated_ratio_den: 392
    inflated_above_num: 173
    inflated_above_den: 392
    inflated_above_int: 41
    small_cube: 175616
    cube_over_square: 56
  controls:
    - >-
      The dimension ratio is 285/14. Reporting it as 10 invalidates
      the run.
    - >-
      The degree step is 9/4. Reporting it as 2 invalidates the run.
    - >-
      The cubed step is 729/64. Reporting it as 10 invalidates the
      run.
    - >-
      Ten times 3136 is 31360, which is below 1299600. Reporting the
      inflated square as the larger square invalidates the run.
    - >-
      The inflated ratio exceeds 41. Reporting it as 41 invalidates
      the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - binomial in {C(8,3), C(9,4), C(20,3)}
    - route in {product, pascal}
  metrics:
    primary:
      - dimension_ratio
      - cubed_step
      - implementations_agree
    secondary:
      - inflated_ratio
      - degree_step
      - small_cube
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The ratio 285/14 and the factor 729/64.
    formula: >-
      The dimension is the binomial of n plus d taken at d. The cell
      pair is n equal to 5 and 17 at d equal to 3. The degree step
      raises d from 3 to 4 at n equal to 5. Squaring and cubing that
      step are the two linear-algebra exponents. The inflated
      comparison multiplies the smaller square by 10.
    source: >-
      IDEA-20260915-69941f states the binomial ceiling and the caps
      10 and 2, read 2026-10-02. The binomials were computed in this
      design session. That computation is not a run. No solver was
      executed.
  scale_relevance:
    tier: toy
    justification: Three binomials. No transfer to an installed engine.
    correspondence: null
  tail_checks:
    - The cubed step is required. Stopping after the square and still reporting 729/64 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the dimension ratio is reported as 10, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The dimension ratio is reported as 10.
    - The degree step is reported as 2.
    - The cubed step is reported as 10.
    - The inflated ratio is reported as 41.
    - A Groebner basis, a SAT solve, or an engine sweep is reported.
  success_criterion: >-
    Both runs agree that the binomials are 56, 126 and 1140, that
    the dimension ratio is 285/14, that the degree step is 9/4, that
    the squared and cubed steps are 81/16 and 729/64, and that
    1299600 divided by 31360 is 16245/392.
  falsification_criterion: >-
    The runs agree, the dimension ratio stays 285/14, and any factor
    differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-ICPERF-4af8bf/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ICPERF-4af8bf/runs/<RUN-ID>/command.txt
    - experiments/EXP-ICPERF-4af8bf/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ICPERF-4af8bf/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ICPERF-4af8bf/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ICPERF-4af8bf/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any Groebner engine, SAT solver, or scheduling sweep.
    - Any claim that a solver lane is closed.
    - Any measured spread from a running matrix.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
