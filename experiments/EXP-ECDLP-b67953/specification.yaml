experiment:
  id: EXP-ECDLP-b67953
  hypothesis_id: H-ECDLP-61032f
  version: 1
  title: >-
    Normalized excess-collision mass Xi as the replacement primary metric for
    the frozen decomposition-probability protocol - exact enumeration over all
    targets at N in {2^14, 2^16, 2^18}, against a forced null value 1 - 1/M
    with an explicitly derived without-replacement correction, a curve-free
    matched arm over Z/NZ, two positive controls that must fire in opposite
    directions, and a five-point graded ladder between them
  status: draft
  status_note: >-
    DRAFT. Not review_required and not approved. Coordinator design freeze
    converting IDEA-20260805-4ddd8c into a testable protocol under
    TASK-20260904-43152a. Not snapshot-committed, not independently reviewed,
    NO RUN AUTHORIZED. This contract does not amend, supersede or edit the
    frozen GOAL-RELN-001 measurement protocol, which remains as committed.
  objective: >-
    Measure Xi = conc/mu^2 by exact enumeration over all group targets, for
    elliptic-curve factor bases and for a matched curve-free index set, and
    compare against the value 1 - 1/M forced by the independent-uniform model
    plus a derived distinctness correction; and thereby establish whether the
    p_exist arm of the frozen protocol carries any elliptic-curve content beyond
    arithmetic. The budget meets the template floors; the computation itself is
    small and the floors are not the binding constraint.
  inputs:
    cells: >-
      Three rungs, m = 3, unsigned multisets throughout: (N = 2^14, B = 30),
      (N = 2^16, B = 42), (N = 2^18, B = 50). One optional fourth rung at
      N = 2^20 for a slope reading only.
    arms_per_cell: >-
      ARM-EC-RANDOM (elliptic-curve factor base of B distinct points with
      x-coordinates in a prescribed subset of F_p, prime-order group);
      ARM-FREE-RANDOM (the curve-free null, B distinct elements drawn uniformly
      from Z/NZ); ARM-SIDON (Bose-Chowla base of the relevant order);
      ARM-SMALLMULT (the base {P, 2P, ..., BP}); ARM-GRADED at mixing fractions
      f in {0, 1/4, 1/2, 3/4, 1} between ARM-SIDON and ARM-SMALLMULT.
    bases_per_cell: >-
      200 independent bases per randomized arm per cell. Deterministic arms
      (ARM-SIDON, ARM-SMALLMULT, and each graded rung at fixed construction) are
      constructed once per cell and their exact Xi is additionally computed
      combinatorially before the run.
    forced_values_frozen_before_execution: >-
      E[Xi] = 1 - 1/M with M = binomial(B+2, 3), evaluating to 0.99979839 at
      (B=30, N=2^14), 0.99992449 at (B=42, N=2^16) and 0.99995475 at
      (B=50, N=2^18); PLUS a without-replacement / no-identity correction of
      size O(B^2/N) which the driver DERIVES EXACTLY and writes to
      results/forced_values.yaml BEFORE any measured value is computed. At
      N = 2^14 with B = 30 that correction is of order 0.05 while 1/M is of
      order 2e-4, so the correction dominates and MUST be derived rather than
      bounded; a bounded correction would make the band wrong in the direction
      that manufactures a false positive.
  controls:
    - id: NULL-FREE-RANDOM
      description: >-
        NAMED CURVE-FREE NULL, AND THE PRIMARY CONTROL OF THIS CONTRACT. B
        distinct nonzero elements drawn uniformly from the abstract cyclic group
        Z/NZ, with the same B, the same N, the same m, the same enumeration code
        path and PAIRED seeds with ARM-EC-RANDOM. No elliptic curve is
        constructed or touched in this arm. Its forced value is
        1 - 1/M + (derived correction), computed and written before execution.
      failure_meaning: >-
        CONSEQUENCE DECLARED IN ADVANCE, IN BOTH DIRECTIONS. (i) If
        ARM-EC-RANDOM and NULL-FREE-RANDOM agree within the declared band at
        every cell, then NOTHING measured by this experiment may be quoted as a
        statement about elliptic curves or about the ECDLP; the only admissible
        reading is a statement about what the p_exist metric can detect. (ii) If
        ARM-EC-RANDOM departs from NULL-FREE-RANDOM outside the band at any
        cell, that residual is the ONLY elliptic-curve content in the
        measurement and requires independent review before any use.
    - id: CTRL-BAND-NONDEGENERACY
      description: >-
        BLOCKING PRE-EXECUTION CHECK ON THE NULL ITSELF. Before any arm is
        measured, the driver computes the null band width in the units of the
        metric (three standard errors of the mean of Xi over 200 bases, plus the
        derived correction interval) and asserts it is STRICTLY POSITIVE and
        strictly smaller than the separation between the forced null value and
        each positive control's forced value. The computed band width, the two
        separations, and the ratio of separation to band width are written to
        results/forced_values.yaml before execution.
      failure_meaning: >-
        A band of zero width, or a band as wide as the separation it must
        resolve, means the discriminator cannot fire and the design teaches
        nothing. The run STOPS and reports; it does not proceed to measure. This
        control exists because a pre-registered null whose band is zero by
        construction has already occurred in this program.
    - id: CTRL-SIDON-POSITIVE
      description: >-
        POSITIVE CONTROL, EFFECT MUST APPEAR. A correctly constructed Bose-Chowla
        base must return Xi exactly 0 and coverage exactly min(1, mu), with zero
        tolerance. Declared pre-run.
      failure_meaning: >-
        A nonzero Xi on a correctly constructed Sidon base means the instrument
        is broken and NO negative result may be reported from any other arm.
    - id: CTRL-SMALLMULT-POSITIVE
      description: >-
        SECOND POSITIVE CONTROL, EFFECT MUST APPEAR IN THE OPPOSITE DIRECTION.
        The base {P, 2P, ..., BP} must return Xi above 100, matching to within
        one part in 10^6 the value computed combinatorially before the run from
        the count of ordered pairs of 3-multisets of {1..B} with equal sum.
      failure_meaning: >-
        Two controls that must fire in opposite directions bound the instrument
        on both sides, which a single null does not. A miss on either bound
        voids every reading.
    - id: CTRL-GRADED-LADDER
      description: >-
        DEMONSTRATED DYNAMIC RANGE. Five rungs at mixing fraction
        f in {0, 1/4, 1/2, 3/4, 1} between the Sidon and small-multiples
        geometries. For each rung the exact Xi is computed combinatorially
        BEFORE the run and written to results/forced_values.yaml; the measured
        value must match the precomputed value to within one part in 10^6 and
        the sequence must be strictly increasing in f.
      failure_meaning: >-
        This is the planted-defect-of-known-size control: five known Xi values
        spanning 0 to above 100, each of which the instrument must return to six
        figures. A non-monotone ladder, or any rung off its precomputed value,
        localizes the failure to a specific mixing fraction and voids the
        readings. An instrument that merely returns a number on one null has not
        demonstrated it can resolve a difference; this one has.
    - id: CTRL-INSTRUMENT-REPRODUCTION
      description: >-
        ARITHMETIC REPRODUCTION GATE, ZERO COMPUTE, RUN FIRST. Reproduce
        mu/(1 - exp(-mu)) = 1.107172 at mu = 0.207195 and compare against the
        committed 1.1071 probe value; and reproduce the committed cell means
        from binomial(B+2,3)/N at the three rungs.
      failure_meaning: >-
        If the instrument cannot reproduce a committed number from arithmetic
        alone, no negative result may be reported from it and the line stops at
        zero compute.
    - id: CTRL-ORDERING
      description: >-
        The null arm is generated, measured, hashed and written BEFORE any
        structured arm is generated, and the frozen decision rule is executed on
        the null first. If the rule emits the same label on NULL-FREE-RANDOM and
        on ARM-SIDON, it discriminates nothing and must be rewritten as a new
        contract version before the remaining arms are read.
      failure_meaning: >-
        Prevents a decision rule from being fitted to the structured arms.
    - id: CTRL-ARCHIVE-CHECK
      description: >-
        ZERO COMPUTE. Before measuring, list every archived measurement of the
        same observable found in the repository and record it. An observable
        that is not found is recorded as an ABSENCE, never as a passed check.
      failure_meaning: >-
        A duplicate measurement found in the archive changes this contract from
        a measurement into a replication and must be reported as such.
  independent_variables:
    - 'group order N, in {2^14, 2^16, 2^18} with an optional 2^20 rung'
    - 'factor-base size B, at the declared rung per N'
    - 'base geometry / arm, in {EC-random, free-random, Sidon, small-multiples, graded f}'
    - 'index-set object, in {elliptic curve E(F_p), abstract group Z/NZ}'
  metrics:
    primary:
      - >-
        Xi = conc/mu^2, dimensionless, computed by exact enumeration over ALL N
        targets, reported per arm per cell as a mean over the declared bases with
        its standard error.
      - >-
        mu = mean fibre size, in multisets per target (dimensionless count),
        exact, per arm per cell.
      - >-
        cov = p_exist, the fraction of group targets with at least one
        decomposition, dimensionless, exact, per arm per cell.
      - >-
        max_r c_D(r), the largest fibre size, an integer count, per arm per cell.
      - >-
        band_width and separation_to_band_ratio from CTRL-BAND-NONDEGENERACY,
        dimensionless, written before execution.
    secondary:
      - >-
        forced_minus_measured Xi residual per arm per cell, dimensionless, with
        the forced value and the derived correction reported on the line above
        the measured value in the same file.
      - >-
        paired ARM-EC-RANDOM minus NULL-FREE-RANDOM Xi difference per cell, with
        a paired confidence interval.
      - >-
        coverage ratio of ARM-SIDON to the matched random arm, against the
        pre-derived ceiling mu/(1 - exp(-mu)), reported per cell rather than
        quoting the global 1.582 bound at cells whose mu is far from 1.
      - >-
        p_exist dynamic range max over min across non-degenerate arms,
        dimensionless, per cell.
      - 'slope of Xi in log2(N) across the completed rungs, with the rung count stated.'
      - 'seed, base construction transcript and a hash of the ordered base for every arm.'
  heuristic_under_test: HEUR-XI-2
  preregistered_prediction:
    quantity: >-
      The mean of Xi over independent uniformly drawn factor bases, per cell,
      for the elliptic-curve arm and for the curve-free arm.
    formula: >-
      E[Xi] = 1 - 1/M exactly under the independent-uniform model, with
      M = binomial(B+m-1, m), plus a without-replacement and no-identity
      correction of size O(B^2/N) derived exactly by the driver before
      execution. Numerically 1 - 1/M is 0.99979839, 0.99992449 and 0.99995475 at
      the three rungs.
    source: >-
      Derived in H-ECDLP-61032f mechanism Step 4 from the primality of N and the
      invertibility of a nonzero difference coordinate. Unconditional under its
      stated model; not a distributional assumption.
  scale_relevance:
    tier: toy
    justification: >-
      N at most 2^18, with one optional 2^20 rung. Exact enumeration requires an
      array of N counters and binomial(B+2,3) multiset sums per base - about
      2.8e5 sums per base at the largest rung - which is trivially bounded and is
      the reason the method cannot be pushed further. NOTHING MEASURED HERE IS
      EVIDENCE ABOUT CRYPTOGRAPHIC-SIZE CURVES IN EITHER DIRECTION.
    correspondence: null
  tail_checks:
    - >-
      The largest observed max_r c_D(r) per arm per cell, reported explicitly:
      the accounting identity is tight exactly when this equals 1, so its value
      is the direct check on the coverage bound.
    - >-
      The single base, by hash, whose Xi deviates most from the forced value in
      each randomized arm, reported individually rather than absorbed into the
      mean.
    - >-
      The graded-ladder rung with the largest precomputed-minus-measured
      discrepancy, reported with its exact discrepancy.
  replication:
    seeds:
      - 'RUN-ECDLP-b67953-1 (Stage 0/1 reading and arithmetic gates, deterministic): master seed 20260904061'
      - 'RUN-ECDLP-b67953-2 (N = 2^14 cell, all arms): master seed 20260904062'
      - 'RUN-ECDLP-b67953-3 (N = 2^16 cell, all arms): master seed 20260904063'
      - 'RUN-ECDLP-b67953-4 (N = 2^18 cell, all arms): master seed 20260904064'
      - 'RUN-ECDLP-b67953-5 (optional N = 2^20 slope rung): master seed 20260904065'
    independent_instances: 200
    replication_note: >-
      SEEDS POLICY. Each cell run declares one master seed above; the driver
      derives 200 per-base seeds deterministically from it and records the
      derivation rule and every derived base hash in the run manifest.
      ARM-EC-RANDOM and NULL-FREE-RANDOM are PAIRED: base index i in both arms is
      drawn from the same derived seed, so the two arms see the same random
      draws and their difference is a paired quantity. Deterministic arms carry
      no seed and their construction transcript is recorded instead. No seed may
      be changed after a run; a re-seeded protocol is a NEW contract.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 3
    maximum_memory_gb: 8
    maximum_runs: 5
    budget_feasibility_note: >-
      At the largest rung a single base needs about 2.8e5 multiset sums and an
      array of 2^18 counters; 200 bases across nine arms is well inside 600
      seconds in numpy. The optional 2^20 rung needs under 10 MB of counters.
      Memory is set at the template floor of 8 GB, far above what the work
      requires; the floor is not the binding constraint and no exception is
      claimed.
  stopping_rules:
    - >-
      ST-0 STAGE GATE. Stages run cheapest-first and any stage may end the line.
      Stage 0 (obtain and quote the reference formula, or record that it could
      not be obtained), Stage 1 (arithmetic reproduction gates and derivation of
      the forced values and the correction), Stage 2 (exact enumeration), Stage 3
      (optional slope rung). Stage 2 does not start until Stage 1 has written
      results/forced_values.yaml and CTRL-BAND-NONDEGENERACY has passed.
    - >-
      ST-1 PER-RUN CAP. 600 seconds and 8 GB per run; on approaching the cap the
      run STOPS and names every arm or cell not reached, with its reason.
    - >-
      ST-2 STOP AND REPORT ON AMBIGUITY. If the multiset convention, the target
      set, or the Sidon construction cannot be resolved unambiguously from this
      contract, the Executor STOPS AND REPORTS rather than guessing; the
      ambiguity is recorded as a protocol deviation.
    - >-
      ST-3 NO INTERPRETATION. Observations only. The run package must not state
      whether the p_exist ladder is forced, must not write an evidence or
      decision record, and must not touch any hypothesis or protocol status.
  invalidation_rules:
    - >-
      INV-BAND. CTRL-BAND-NONDEGENERACY fails: the run set is INVALID before any
      measurement and no reading is taken.
    - >-
      INV-SIDON. ARM-SIDON returns Xi other than exactly 0: the instrument is
      broken and every arm in that cell is INVALID.
    - >-
      INV-LADDER. Any graded rung differs from its precomputed Xi by more than
      one part in 10^6, or the ladder is non-monotone: INVALID.
    - >-
      INV-IDENTITY. Any arm reports p_exist above min(1, mu)/(1 - exp(-mu)) at
      its cell: the accounting identity is violated, so the enumeration is
      wrong; INVALID, not interesting.
    - >-
      INV-CORRECTION. The without-replacement correction is BOUNDED rather than
      DERIVED at any cell: that cell is INVALID, because a bounded correction
      makes the null band wrong in the direction that manufactures a false
      positive.
    - >-
      INV-INFRASTRUCTURE. A timeout, crash or implementation failure is recorded
      with its terminal status and IS INFRASTRUCTURE SIGNAL, NEVER negative
      evidence about H-ECDLP-61032f or HEUR-XI-2 (AGENTS.md rule 5).
  success_criterion: >-
    S1. Every control passes (CTRL-BAND-NONDEGENERACY positive and adequate;
    CTRL-INSTRUMENT-REPRODUCTION reproduces 1.107172 and the committed cell
    means; ARM-SIDON returns exactly 0; ARM-SMALLMULT matches its precomputed
    value to one part in 10^6; the graded ladder is monotone and on its
    precomputed values); AND the mean of Xi on ARM-EC-RANDOM lies within three
    standard errors of 1 - 1/M plus the derived correction at every completed
    cell. S1 MET means the p_exist arm of the frozen protocol is forced by
    (B, m, N) up to a residual smaller than the declared band, AT THE TESTED TOY
    CELLS, UNDER THE UNSIGNED CONVENTION. It licenses no statement about
    cryptographic scale and no closure of any research question.
  falsification_criterion: >-
    F1. The mean of Xi on ARM-EC-RANDOM lies outside the declared band at any
    completed cell WHILE NULL-FREE-RANDOM lies inside it at the same cell and
    every instrument control passes. F1 MET falsifies HEUR-XI-2 at that scale:
    elliptic-curve factor bases are NOT exchangeable with uniform index sets at
    the second moment, the p_exist arm regains genuine content, and the result
    requires independent review before any use. F2. CTRL-INSTRUMENT-REPRODUCTION
    fails, or the source reference formula proves materially different from the
    transcription: the identification underlying the whole design is withdrawn
    and restated against the real text. F3, DECLARED IN ADVANCE AND BINDING
    WHATEVER ELSE HOLDS: if ARM-EC-RANDOM and NULL-FREE-RANDOM agree within the
    band at every cell, no statement about elliptic curves or the ECDLP may be
    quoted from this experiment.
  required_artifacts:
    - experiments/EXP-ECDLP-b67953/driver/enumerate_fibres.py
    - experiments/EXP-ECDLP-b67953/driver/base_constructions.py
    - experiments/EXP-ECDLP-b67953/driver/forced_values.py
    - experiments/EXP-ECDLP-b67953/results/forced_values.yaml
    - experiments/EXP-ECDLP-b67953/results/summary.json
    - experiments/EXP-ECDLP-b67953/results/reference_formula_quotation.md
    - experiments/EXP-ECDLP-b67953/results/seed_env_manifest.yaml
    - experiments/EXP-ECDLP-b67953/runs/RUN-ECDLP-b67953-1/manifest.yaml
    - experiments/EXP-ECDLP-b67953/runs/RUN-ECDLP-b67953-1/results.json
    - experiments/EXP-ECDLP-b67953/runs/RUN-ECDLP-b67953-1/stdout.log
    - experiments/EXP-ECDLP-b67953/runs/RUN-ECDLP-b67953-2/manifest.yaml
    - experiments/EXP-ECDLP-b67953/runs/RUN-ECDLP-b67953-2/results.json
    - experiments/EXP-ECDLP-b67953/runs/RUN-ECDLP-b67953-2/stdout.log
    - experiments/EXP-ECDLP-b67953/runs/RUN-ECDLP-b67953-3/manifest.yaml
    - experiments/EXP-ECDLP-b67953/runs/RUN-ECDLP-b67953-3/results.json
    - experiments/EXP-ECDLP-b67953/runs/RUN-ECDLP-b67953-3/stdout.log
    - experiments/EXP-ECDLP-b67953/runs/RUN-ECDLP-b67953-4/manifest.yaml
    - experiments/EXP-ECDLP-b67953/runs/RUN-ECDLP-b67953-4/results.json
    - experiments/EXP-ECDLP-b67953/runs/RUN-ECDLP-b67953-4/stdout.log
    - experiments/EXP-ECDLP-b67953/runs/RUN-ECDLP-b67953-5/manifest.yaml
    - experiments/EXP-ECDLP-b67953/runs/RUN-ECDLP-b67953-5/results.json
    - experiments/EXP-ECDLP-b67953/runs/RUN-ECDLP-b67953-5/stdout.log
  required_artifacts_note: >-
    results/forced_values.yaml is written BEFORE any measured value exists and
    contains the forced Xi, the exactly derived distinctness correction, the
    precomputed exact Xi of every deterministic arm and graded rung, the
    band width, and the separation-to-band ratio. results/reference_formula_
    quotation.md contains either a verbatim quotation of the source formula with
    its page reference, or an explicit statement that the source could not be
    obtained; it is never left implicit.
  run_plan:
    - id: RUN-ECDLP-b67953-1
      description: 'Stage 0 source-text reading and Stage 1 arithmetic gates, CTRL-INSTRUMENT-REPRODUCTION, CTRL-BAND-NONDEGENERACY, CTRL-ARCHIVE-CHECK, writes forced_values.yaml'
    - id: RUN-ECDLP-b67953-2
      description: 'N = 2^14, B = 30: all nine arms including NULL-FREE-RANDOM at paired seeds, CTRL-ORDERING enforced'
    - id: RUN-ECDLP-b67953-3
      description: 'N = 2^16, B = 42: same arm set'
    - id: RUN-ECDLP-b67953-4
      description: 'N = 2^18, B = 50: same arm set'
    - id: RUN-ECDLP-b67953-5
      description: 'optional N = 2^20 rung, ARM-EC-RANDOM and NULL-FREE-RANDOM only, for a slope reading'
  provenance:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    independent_session: false
    independent_review_status: >-
      NOT YET REQUESTED. Contract is at `draft`; independent pre-execution
      review, snapshot commit and the transitions to review_required and
      approved are separate later Coordinator actions.
    design_session_verification_note: >-
      The Coordinator subagent that wrote this contract verified verbatim that
      GOAL-RELN-001 carries completion criterion "Committed protocol-plus-
      measurement decision giving scoped P(decomp) estimates with controls, or a
      scoped no-go against honest measurement" and status `active`. It read only
      the committed TITLE line of knowledge/findings/KN-FIND-007.md and did NOT
      open experiments/EXP-FB3-001/conservation.md, the frozen RELN protocol
      file, the red-team objections file carrying the 1.1071 probe, or
      KN-LIT-009. Every number attributed to those sources in this contract is
      taken from IDEA-20260805-4ddd8c and is flagged for re-derivation in
      Stage 1 rather than relied upon.
  source_refs:
    - ledger/hypotheses/H-ECDLP-61032f.yaml
    - ledger/proposals/IDEA-20260805-4ddd8c.yaml
    - ledger/questions/RQ-RELN-001.yaml
    - ledger/goals/GOAL-RELN-001.yaml
    - knowledge/findings/KN-FIND-007.md
    - docs/claims-and-verification.md
    - docs/inventor-protocol.md
