experiment:
  id: EXP-BINSTD-38f216
  hypothesis_id: H-BINSTD-dba2ab
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-29b1c5
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Corrected iota-stable subspace census (Stage 1) and V_W one-bit
    relation-phase measurement on n=17 Koblitz and RC-1 cells (Stage 2), with
    Stage 0 zero-compute lemma and per-row verdict table
  status: approved
  approved_by: DEC-20260930-492bf6
  approved_at: '2026-09-30'
  approval:
    approved_by: DEC-20260930-492bf6
    composing_decision: DEC-20260930-492bf6
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-2 only.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stages 0-2 only. Stage 3 (larger n constant table) and Stage 4 (WDSat)
      and Stage 5 (deployed-row fill beyond Stage 0 table) are NOT authorized
      by this approval.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    (B) Certify the corrected emptiness classification of iota-stable
    F_2-subspaces and file prime-row STRUCTURALLY EMPTY / composite-row OPEN
    verdicts. (C)(D) Measure the price of the V_W constructive escape as
    multiplicity and relation-phase total ratio against matched-size
    controls, discriminating one-bit net gain from the original 2^{m-1} net
    claim.

  class: cost-model-measurement
  class_note: >-
    Also carries a proof-oriented Stage 0-1 census (heuristic/structure
    validation of the corrected lemma). Cost-model fields below cover Stage 2.

  scope:
    included:
      - >-
        Stage 0. Zero-compute: write corrected lemma steps; x(P+T) identity;
        per-row verdict table for named standardized binary curves (prime EMPTY,
        composite OPEN with V_d named); commit before any scientific run.
      - >-
        Stage 1. Census: for n in {6,7,8,9,10,11,12,13} and declared b values,
        enumerate F_2-subspaces (exhaustive dim<=3; sample higher dims) and
        count iota-stable ones; predict tau(n) each equal to b^{1/4} F_{2^d}.
      - >-
        Stage 2. Toy measurement: n=17 Koblitz (a=1,b=1, order 2*65587) and
        RC-1 ordinary (A=97044, B=126251); m=2; l=8; 20 W per cell; seed
        20260926; exhaustive pair-sums over F_W; metrics multiplicity,
        coverage, relation_phase_total_ratio; Koblitz tau-bar check.
    excluded:
      - Stage 3 larger-n constant ladder (unauthorized)
      - Stage 4 WDSat / CNF-XOR arm (missing WDSat; unauthorized)
      - Any run at deployed n >= 131
      - AUXIN / FROB / QSP / SEMBIN edits or values
      - Pricing the composite-row scaled-subfield successor seam (separate idea)

  inputs:
    proposal: ledger/proposals/IDEA-20260922-29b1c5.yaml
    review: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-29b1c5.yaml
    curve_audit: analysis/binstd-curve-audit/
    hypothesis: ledger/hypotheses/H-BINSTD-dba2ab.yaml
    optional_code_refs:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - src/semaev_tree.py
    cells:
      census_n: [6, 7, 8, 9, 10, 11, 12, 13]
      BIN-KOB-17: >-
        Koblitz y^2 + xy = x^3 + 1 over F_2[t]/(t^17+t^3+1); #E = 2*65587
        (review / DEC-20260926-cb4487 pointer; recompute and prove at setup)
      BIN-ORD-17-RC1: >-
        Ordinary A=97044, B=126251 over the same field (RC-1); recompute #E
        at setup; halt on disagreement

  controls:
    - name: brute_force_oracle
      object: Exact certificate multiset at Stage 2; any arm disagreeing is wrong
    - name: matched_size_subspace
      object: Random F_2-subspace V with |V| matched to measured |V_W|
    - name: random_pairing_known_false
      object: Arbitrary pairs instead of iota-orbits; orbit loop MUST be unsound
    - name: koblitz_tau_bar
      object: V_W covered set must equal tau-bar^{-1} of F_W covered set
    - name: original_lemma_alternative
      object: >-
        Known-false on (n=6, b in F_4\F_2): original predicts fewer stable
        subspaces than tau(n); census must reject original if correction holds
    - name: matched_rho
      object: Negation-only (and Frobenius on Koblitz) group-op estimate beside totals
    - name: null_random_boolean
      object: >-
        Not used in authorized stages (Stage 4 deferred); reserved if SAT arm
        is later amended in

  independent_variables:
    - n
    - b
    - curve_kind  # koblitz | ordinary
    - W_seed
    - arm  # plain_subspace | V_W_orbit | random_pairing

  metrics:
    primary:
      - iota_stable_subspace_count
      - multiplicity_per_covered_target
      - relation_phase_total_ratio
      - certificate_multiset_equality
    secondary:
      - "|V_W|"
      - orbit_count
      - coverage_per_pair_sum
      - koblitz_tau_bar_identity_pass
      - operation_counts_curve_add_membership_inversion
      - matched_rho_group_ops_estimate
      - peak_rss_bytes
      - wall_s
      - termination_reason

  heuristic_under_test:
    - HEUR-BINSTD-dba2ab-H1
    - HEUR-BINSTD-dba2ab-H2

  preregistered_prediction:
    quantity: >-
      iota_stable_subspace_count = number of divisors of n, each V = b^{1/4}
      F_{2^d}; multiplicity_per_covered_target = 2 at m=2 on V_W;
      relation_phase_total_ratio = 1/2
    formula: >-
      Corrected lemma: nonzero iota-stable F_2-subspaces are exactly
      { b^{1/4} F_{2^d} : d|n }. Clustering: |even-parity T-flip group| =
      2^{m-1}; relation-phase total ratio = 1/2 at matched |B|.
    source: >-
      analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-29b1c5.yaml
      (corrected lemma + clustering); IDEA-20260922-29b1c5 (A)(C); KN-FIND-007
    claim_tier: observational
    measured_vs_modeled: >-
      Stage 1 counts are measured. Stage 2 multiplicity and coverage are
      measured. Relation-phase totals report measured operations and modeled
      ratio 1/2 separately; never mix in one column. Rho estimates are modeled
      from closed form sqrt(pi*r/(4k)) with k=1 (negation) or k=n (Koblitz).

  scale_relevance:
    tier: toy
    justification: >-
      Census n<=13; exhaustive m=2 at n=17. Transfer to deployed n in
      131..571 is Stage 0 arithmetic only (EMPTY/OPEN verdicts), not a
      measured cost. Explicit extrapolation distance stated in Stage 0 table.
    correspondence: null

  tail_checks:
    - >-
      Extreme W: min/max |V_W|/2^l over >=20 W per (n,b); exhibit extreme W
    - >-
      Max decompositions of any single target vs Poisson tail (reported, not gated)
    - >-
      Fixed point x=b^{1/4} orbit-size-1 shift disclosed in orbit counts

  optimistic_assumptions:
    - assumption: H1 |V_W| ~ 2^l
      bias_direction: underestimates variance of base size
    - assumption: Poisson occupancy for per-target counts
      bias_direction: may understate concentration from residual structure
    - assumption: rho closed-form comparator without measured group-op timing
      bias_direction: comparator is modeled, labeled as such

  memory_accounting: >-
    Peak RSS measured. Dominant structures: list of |V_W|~2^l field elements
    and pair-sum map at Stage 2 (about 2^{16} entries at l=8). Analytic size
    reconciled against peak_rss_bytes in the run summary.

  hidden_overhead_honesty: >-
    One F_q inversion per membership test (~2 log2 n multiplies). No
    superpolynomial factor hides in an o(1). Headline is a constant, not an
    exponent.

  standardized_parameter_sets:
    - name: Stage1-census
      n: [6, 7, 8, 9, 10, 11, 12, 13]
    - name: Stage2-BIN-KOB-17
      n: 17
      m: 2
      l: 8
    - name: Stage2-BIN-ORD-17-RC1
      n: 17
      m: 2
      l: 8
  affected_vs_safe_scope: >-
    AFFECTED (structural verdicts only): prime-degree standardized binary rows
    under the corrected emptiness certificate. SAFE / untouched as attack
    cost: all deployed curves' asymptotic security; composite-row attack
    pricing (OPEN, successor seam). No NIST security-level cost table claimed.

  replication:
    seeds: [20260926]
    independent_instances: 20
    independent_instances_note: 20 independent W per Stage 2 cell; census is deterministic given (n,b) for exhaustive dims

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 40
    maximum_workers: 1
  budget_note: >-
    Advisory. Expected Stage 1 seconds-per-(n,b); Stage 2 about a minute per
    cell in pure Python (review estimate). Null total_cpu_hours is valid under
    research-budget-policy.

  stopping_rules:
    - Stop Stage 0 after lemma writeup + verdict table artifacts are written.
    - Stop Stage 1 after all census cells report counts and exhibited stable V.
    - Stop Stage 2 after both n=17 cells complete 20 W (or hit wall clock).
    - A timeout/crash is failed_infrastructure, never a mathematical miss.
    - If Stage 1 finds a counterexample to the corrected lemma, halt Stages 2+
      and archive the counterexample certificate before any decision.

  invalidation_rules:
    - Missing required artifacts invalidate the run.
    - Overwriting an existing run record invalidates the procedure.
    - Changing success/falsification criteria after observing outcomes without
      a versioned protocol_amendment invalidates interpretation.
    - Mixing measured and modeled numbers in one reported column invalidates
      the cost table.
    - Reading AUXIN/FROB/QSP run values into this experiment invalidates scope.
    - Any claim of deployed-curve break or exponent move invalidates the report.

  success_criterion: >-
    Stage 0 artifacts committed. Stage 1: for every tested (n,b),
    iota_stable_subspace_count equals the number of divisors of n and each
    exhibited stable V equals b^{1/4} F_{2^d} for some d|n. Stage 2: on both
    n=17 cells, certificate_multiset_equality holds; multiplicity_per_covered_target
    in [1.5, 2.5] on V_W at m=2; relation_phase_total_ratio in [0.4, 0.6];
    random-pairing control unsound; Koblitz tau-bar identity passes on the
    Koblitz cell. All primary metrics decidable from predefined outputs.

  falsification_criterion: >-
    Any Stage 1 cell with stable count != tau(n) or a stable V not of the form
    b^{1/4} F_{2^d}; OR Stage 2 multiplicity < 1.5 on V_W; OR
    relation_phase_total_ratio outside [0.4, 0.6] with passing counters; OR
    sound random-pairing orbit loop; OR failed Koblitz identity. Original-lemma
    agreement on a discriminating cell (n=6, b not in F_2) falsifies the
    corrected restatement.

  required_artifacts:
    - experiments/EXP-BINSTD-38f216/runs/RUN-*/raw-result.json
    - experiments/EXP-BINSTD-38f216/runs/RUN-*/manifest.yaml
    - experiments/EXP-BINSTD-38f216/runs/RUN-*/stdout.txt
    - stage0/lemma-writeup.md
    - stage0/per-row-verdict-table.yaml
    - stage1/census-summary.json
    - stage2/metrics-summary.json
    - implementation/ (gf2n + curve + V_W + census + orbit loop sources)

  assigned_to: executor
  executor_handoff: TASK-20260930-22e38a
  snapshot_task: TASK-20260930-33e3bc

  cost_model_disclosure: >-
    Measured: subspace counts, |V_W|, multiplicity, coverage, operation
    counters, wall_s, peak_rss. Modeled: predicted ratio 1/2; rho closed forms.
    Optimistic assumptions listed above. Tables under those assumptions are
    bounds/comparators, not predictions of wall-clock attack cost.
