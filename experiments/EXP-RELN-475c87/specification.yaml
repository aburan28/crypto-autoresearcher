experiment:
  id: EXP-RELN-475c87
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  approved_by: null

  hypothesis_id: H-RELN-96e3ba
  question_id: RQ-RELN-001
  goal_id: GOAL-RELN-001
  idea_id: IDEA-20260805-5ac0a2

  title: >-
    Zero-compute-first audit of the reference curve frozen into the
    GOAL-RELN-001 protocol: exact multiset conservation over the +/- symmetric
    factor base, the forced 2^m discrepancy, and the pre-run verdict table for
    RULE-HEUR-TRACK

  objective: >-
    Decide, before any decomposition-probability campaign is authorised, whether
    the reference curve RULE-HEUR-TRACK compares measurements against is the
    correct forced value for the objects the protocol names, and publish the
    verdict table that rule would return at every default ladder cell. The
    contract is ordered so that the cheapest stage is decisive: stage 1 is pen and
    paper and can terminate the whole line.

  what_this_is_not:
    - Not a decomposition-probability measurement. No p_exist or p_solve is estimated for any cell.
    - Not a discrete-logarithm computation, relation collection, or ECDLP attack.
    - Not a claim about KN-LIT-009. That paper has not been read; stage 0 exists to read it and both outcomes are pre-registered.
    - Not a claim about the Petit-Kosters-Messeng construction; ARM-PKM-PRIME is untouched and remains blocked on its own materialisation gate.
    - Not an authorisation, approval, freezing, execution licence, run, observation, or evidence.
    - Not a status change to the frozen protocol, to EV-RELN-001, to GOAL-RELN-001.next_action, or to any knowledge record.
    - Not an assertion that the BATCH-001 red-team PASS was wrong; that review's verdict is a fact about the review and is recorded as such.

  claim_ceiling:
    tier: toy
    exact_scope: >-
      A completed run could support only this: on deterministically generated
      ordinary short-Weierstrass curves at field_bits in {8, 10, 12, 16} with
      factor bases drawn from the protocol's own default B-ladder and m in
      {1, 2, 3}, the enumerated size-m multiset totals over W = V union -V equal
      (or differ from) C(2B+m-1, m); the exponent ratio against the protocol's
      reference equals (or differs from) the derived closed form; and
      RULE-HEUR-TRACK's verdict at each cell is (or is not) determined before
      measurement. Nothing about crypto-scale decomposition probability, about
      index-calculus cost, or about the correctness of any published paper may be
      concluded, and the frozen protocol's prohibited_claims list is inherited
      verbatim.

  inputs:
    field_bits: [8, 10, 12, 16]
    arity_m: [1, 2, 3]
    factor_base_size_ladder:
      note: >-
        Taken unmodified from the frozen protocol's
        fixture_ladder.factor_base_size_ladder_rule so that the audit judges the
        design as designed. Changing the ladder would make the verdict table
        unfalsifiable against the artifact under audit.
      bits_8: [4, 6, 8, 12]
      bits_10: [6, 10, 14, 20]
      bits_12: [8, 14, 20, 28]
      bits_16: [12, 20, 32, 48]
    base_families:
      - id: FB-UNIFORM
        description: B distinct non-2-torsion x-coordinates drawn without replacement by the seeded sampler below.
      - id: FB-2TORSION-NULL
        description: >-
          As FB-UNIFORM but with t = 1 (and separately t = 2 where the curve
          permits) x-coordinates of 2-torsion points substituted in. Forced
          multiset total becomes C(2B-t+m-1, m).
      - id: FB-SMALLMULT-POS
        description: "V = {x(iG) : i = 1..B} for the deterministic generator G below. Positive control."
      - id: FB-POINTS-NOSIGN
        description: >-
          Nearby object where the protocol's reference is CORRECT: the searched set
          is a B-element point set with no negation closure, obtained by taking one
          lift per x-coordinate and forbidding sign freedom in the enumerator.
          Forced total C(B+m-1, m), forced exponent ratio (p/N) * prod(1+j/B) with
          no 2^m.
    prime_selection: >-
      p = the smallest prime strictly greater than 2^(bits-1) + 1, found by
      deterministic trial division over odd candidates in increasing order. Fixed,
      not seeded, so that a reader can reproduce the primes without the seed
      stream.
    curve_selection: >-
      For t = 0, 1, 2, ...: a_t = int(SHA-256(seed_bytes("curve-a", bits, t))) mod p,
      b_t = int(SHA-256(seed_bytes("curve-b", bits, t))) mod p. Reject if
      (4 a_t^3 + 27 b_t^2) mod p == 0. Compute N by full point enumeration (p <= 2^16,
      so this is exact and cheap). Accept the first candidate with N odd (no
      2-torsion in the main arm), N having a prime factor greater than N/4 (near-cyclic),
      and N != p (so p/N is visibly not 1). Record a, b, N, and the number of
      candidates rejected.
    generator_selection: >-
      G = the point of largest order found by scanning points in the deterministic
      enumeration order; ties broken by lexicographic (x, y). Recorded explicitly.
    seed_derivation_rule: >-
      seed_bytes(label, bits, counter) = ASCII of
      "EXP-RELN-475c87/v1|" || label || "|" || decimal(bits) || "|" || decimal(counter).
      All hashes are SHA-256; digests are interpreted big-endian unsigned. Factor
      base draws use label "fb" with counter = index of the draw, and select the
      candidate x-coordinate at position (digest mod remaining) from the sorted list
      of remaining eligible x-coordinates. Every seed used is listed exhaustively in
      the run manifest before execution; no adaptive reseeding.
    master_seed_list: >-
      Deterministic by construction from the rule above; the manifest enumerates
      every (label, bits, counter) triple actually consumed.

  arms_and_controls:
    treatment:
      id: ARM-EXACT
      description: >-
        Exact enumeration of c_W over W = V union -V for FB-UNIFORM, giving the
        multiset total, the coverage, c_W(O), and the negation-symmetry check.
    measured_null:
      id: ARM-2TORSION-NULL
      description: >-
        FB-2TORSION-NULL. Forced value C(2B-t+m-1, m), DIFFERENT from the treatment
        arm's forced value, derived before the run. This null can fail: an
        enumerator that hard-codes |W| = 2B returns the wrong total here.
      forced_value_derived_pre_run: true
    positive_control:
      id: ARM-SMALLMULT-POS
      description: >-
        FB-SMALLMULT-POS. Conservation forces its multiset TOTAL to equal
        FB-UNIFORM's exactly; KN-FIND-007 records a measured coverage ratio of
        0.0021 for this family at N ~ 2^18, m = 3. The instrument must therefore
        return equal totals and a coverage collapse of at least one order of
        magnitude at the corresponding toy cells. IF THE COVERAGE COLLAPSE DOES NOT
        APPEAR, THE INSTRUMENT CANNOT SEE COLLISIONS AND NO NEGATIVE RESULT MAY BE
        REPORTED FROM ANY ARM OF THIS CONTRACT.
    nearby_object_control:
      id: ARM-POINTS-NOSIGN
      description: >-
        FB-POINTS-NOSIGN. The object on which the protocol's reference exponent is
        correct. The instrument must report a ratio near 1 here and near 2^m in
        ARM-EXACT. Equal answers on both mean the instrument is not reading the
        negation symmetry, which is the load-bearing structure, and nothing may be
        concluded.
    graded_control:
      id: ARM-B-LADDER
      description: >-
        The forced ratio (p/N) 2^m prod_{j=0}^{m-1}(1 + j/(2B)) decreases strictly
        in B. Four interior points per cell family; report the measured sequence and
        its monotonicity verdict. Non-monotonicity localises the error to the
        multiset correction rather than leaving "it did not match".
    baseline_slice:
      id: ARM-M1
      description: >-
        m = 1. The decomposable target set must be exactly W, of size 2B, with zero
        deficit. Exact boundary check with no approximation anywhere.
    ordering_control: >-
      The forced-value table (all predictions of H-RELN-96e3ba, instantiated at the
      actual primes and curve orders) is written to the run directory and SHA-256
      hashed BEFORE any enumerator is executed. The null arm's verdict is computed
      and recorded before the treatment arm's output is read. The comparison is
      committed-file against output, never the reverse.
    comparability_policy: >-
      All arms at a given (bits, m, B) use the same prime, the same curve, the same
      arity, the same enumerator build, and the same counting convention; only the
      factor-base family or the sign convention differs. Cross-arm comparisons are
      reported only within a matched cell.

  independent_variables: [field_bits, arity_m, factor_base_size_B, base_family, sign_convention]

  metrics:
    primary:
      - metric_id: multiset_total
        type: integer
        definition: "sum over all group elements of c_W(g), enumerated exactly"
        forced_value: "C(2B+m-1, m) in ARM-EXACT; C(2B-t+m-1, m) in ARM-2TORSION-NULL; C(B+m-1, m) in ARM-POINTS-NOSIGN"
      - metric_id: exponent_ratio
        type: rational
        definition: "mu / (B^m/(m! p)) where mu = multiset_total / N"
        forced_value: "(p/N) * 2^m * prod_{j=0}^{m-1}(1 + j/(2B))"
      - metric_id: forced_residual_table
        type: table
        definition: >-
          For each of the 20 default ladder cells: mu, 1 - exp(-mu), P_reported,
          their absolute difference, and the RULE-HEUR-TRACK verdict each reference
          curve implies at the declared 0.05 tolerance.
      - metric_id: source_fidelity
        type: categorical
        definition: >-
          One of {formula_quoted_with_2^m_present, formula_quoted_without_2^m,
          formula_quoted_in_different_setting, source_unobtainable}, with the
          verbatim quotation or the exact HTTP outcome recorded.
    secondary:
      - metric_id: identity_count
        type: integer
        definition: "c_W(O) at m = 2; forced value B on a 2-torsion-free base"
      - metric_id: negation_symmetry_fraction
        type: rational
        definition: "fraction of g with c_W(g) = c_W(-g); forced value 1"
      - metric_id: hasse_factor
        type: rational
        definition: "p / N per curve, reported separately so it is never conflated with 2^m"
      - metric_id: coverage_and_deficit
        type: rational
        definition: >-
          coverage and mu - coverage per arm. Reported as descriptive context for
          H-RELN-66c079; NOT used to draw any conclusion in this contract.
      - metric_id: environment_report
        type: record
        definition: >-
          Result of importing numpy, sympy, sage, and src/ic_first_fall_fast, with
          versions or the exact exception text.

  heuristic_under_test: HEUR-RELN-A1

  preregistered_prediction:
    quantity: >-
      The enumerated multiset total per arm and the exponent ratio per cell.
    formula: >-
      total = C(|W| + m - 1, m) with |W| = 2B (ARM-EXACT), 2B - t
      (ARM-2TORSION-NULL), B (ARM-POINTS-NOSIGN);
      ratio = (p/N) * 2^m * prod_{j=0}^{m-1} (1 + j/(2B)).
    source: >-
      KN-FIND-007 (multiset conservation double count) combined with KN-TECH-002
      (deg S_n in each variable = 2^{n-2}, hence 2^{m-1} roots and 2^m targets per
      multiset). Derived in H-RELN-96e3ba steps 2 and 3 before this contract was
      written.

  stages:
    - id: STAGE-0-SOURCE
      cost: "zero compute; bounded reading and network attempts"
      description: >-
        Attempt to obtain iacr:2015/310 through the abstract page, any arXiv or
        author-hosted copy, and the PDF endpoint, in that order. Record the exact
        HTTP status of each attempt. If obtained, quote the decomposition-probability
        statement verbatim with its section number and its stated setting. If not,
        record source_unobtainable with the failure modes and PROCEED, because every
        other stage audits this program's own artifact and does not need the paper.
      can_terminate_run: false
      terminates_what: "Nothing; it re-scopes the conclusion between 'literature' and 'transcription'."
    - id: STAGE-1-ALGEBRA
      cost: "zero compute"
      description: >-
        Write out both derivations of the 2^{m-1} target coverage (degree bound;
        sign-vector count) and the conservation double count over W. Have them
        checked. IF THE TWO DERIVATIONS DISAGREE, STOP THE RUN AND REPORT THE
        DISAGREEMENT -- this is the cheapest decisive gate in the contract.
      can_terminate_run: true
      terminates_what: "The entire line, before any code is written."
    - id: STAGE-2-COMMIT
      cost: "zero compute"
      description: >-
        Instantiate the forced-value table at the selected primes, curves and orders;
        write it to the run directory; record its SHA-256 in the manifest.
      can_terminate_run: false
    - id: STAGE-3-ENUMERATE
      cost: "seconds to minutes, pure Python standard library"
      description: >-
        For every (bits, m, B, arm): build the factor base, build W under the arm's
        sign convention, enumerate all size-m multisets, accumulate c_W, and emit
        multiset_total, identity_count, negation_symmetry_fraction, coverage. Compare
        against the committed table. Run ARM-M1 first, then ARM-2TORSION-NULL, then
        ARM-POINTS-NOSIGN, then ARM-SMALLMULT-POS, then ARM-EXACT.
      can_terminate_run: true
      terminates_what: >-
        Any mismatch on a forced integer value terminates the run and is reported as
        a falsification of H-RELN-96e3ba, not as a bug to be fixed and re-run.
    - id: STAGE-4-VERDICT-TABLE
      cost: "zero compute"
      description: >-
        Evaluate RULE-HEUR-TRACK at the declared 0.05 absolute tolerance against both
        reference curves at all 20 default cells and publish the table, separating the
        forced-MISS cells from the forced-insensitive-TRACK cells and stating why the
        second class is the more serious one.
      can_terminate_run: false

  replication:
    seeds:
      - "EXP-RELN-475c87/v1|fb|<bits>|<index>  (exhaustively enumerated in the manifest)"
      - "EXP-RELN-475c87/v1|curve-a|<bits>|<t>"
      - "EXP-RELN-475c87/v1|curve-b|<bits>|<t>"
    independent_instances: 3
    replication_note: >-
      Three independently seeded curves per bit size, and three independently seeded
      factor bases per (curve, B). The forced values are deterministic, so replication
      here tests the INSTRUMENT rather than sampling noise; that is stated so no
      reader mistakes agreement across seeds for statistical support.

  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 12
    unit_note: >-
      Counts are reported in exact integers (multisets enumerated, group operations)
      as the primary unit and in wall clock as a secondary unit. No scalar cost is
      formed across units; the frozen protocol's OBL-NO-SCALARIZATION is inherited.

  stopping_rules:
    - id: STOP-DERIVATIONS-DISAGREE
      condition: "The two derivations of 2^{m-1} in STAGE-1 disagree."
      action: "Stop; report the disagreement as the result."
    - id: STOP-FORCED-VALUE-MISMATCH
      condition: "Any enumerated integer differs from its committed forced value."
      action: "Stop; report as falsification of H-RELN-96e3ba. Do not adjust the code and re-run."
    - id: STOP-POSITIVE-CONTROL-FAILS
      condition: "ARM-SMALLMULT-POS shows no coverage collapse."
      action: "Stop; report instrument insensitivity. NO negative result from any arm may be reported."
    - id: STOP-NEARBY-OBJECT-UNSEPARATED
      condition: "ARM-POINTS-NOSIGN and ARM-EXACT return the same exponent ratio."
      action: "Stop; the instrument is not reading the sign convention."
    - id: STOP-BUDGET
      condition: "Wall clock or memory budget exhausted."
      action: "Report as infrastructure outcome; see infrastructure_failure_disposition."

  invalidation_rules:
    - "Any factor base containing a duplicate x-coordinate, or a 2-torsion x in an arm that forbids it."
    - "Any curve accepted with even N in the main arm, or with N = p."
    - "Any enumeration whose multiset count does not match the combinatorial count of its own loop structure (self-consistency)."
    - "Any output file whose committed forced-value table hash does not match the manifest."
    - "Any adaptive reseeding, or any seed not present in the pre-execution manifest."
    - "Any comparison across arms that do not share prime, curve, m and B."

  infrastructure_failure_disposition: >-
    A timeout, crash, missing dependency, import failure, or network refusal is
    INFRASTRUCTURE SIGNAL and is recorded as such with its exact error text. It is
    NEVER negative mathematical evidence and never contributes to any verdict about
    the reference curve, the heuristic, or decomposition probability (AGENTS.md
    rule 3). Specifically: a 403 on the ePrint PDF endpoint yields
    source_fidelity = source_unobtainable and re-scopes the conclusion to this
    program's transcription; it does not license any statement about what the paper
    says. The stage-3 enumerator is deliberately dependency-free (standard library
    only) so that the decisive stages cannot be blocked by the environment; the
    environment_report metric records the import outcomes for numpy, sympy, sage and
    src/ic_first_fall_fast regardless.

  scale_relevance:
    tier: toy
    justification: >-
      The conservation identity and the degree bound are exact at every field size,
      so the toy enumeration CHECKS A DERIVATION rather than extrapolating a
      measurement. That makes the derivation's conclusion scale-free while leaving
      every empirical quantity (coverage, deficit) firmly toy. The verdict table is
      about a specific frozen ladder at bits <= 16 and transfers to nothing else.
    correspondence: null

  tail_checks:
    - >-
      Compare the smallest and largest mu cells explicitly: the audit's most
      damaging claim concerns the SMALL-mu cells (where the rule returns TRACK on a
      wrong reference), not the large-residual ones, and the report must present
      them first.
    - >-
      Check that the measured ratio sequence approaches 2^m from above as B grows,
      as the closed form requires, rather than merely lying above 2^m.

  success_criterion: >-
    All of: (a) the two derivations in STAGE-1 agree; (b) every enumerated integer
    matches its committed forced value in every arm, including the 2-torsion null's
    DIFFERENT forced value; (c) the measured exponent ratio matches the closed form
    to within floating-point tolerance at every cell and is monotone decreasing in B;
    (d) ARM-POINTS-NOSIGN returns a ratio near 1 while ARM-EXACT returns near 2^m;
    (e) ARM-SMALLMULT-POS shows the required coverage collapse; and (f) the published
    verdict table shows RULE-HEUR-TRACK's outcome determined at all 20 default cells.
    Meeting all six supports H-RELN-96e3ba at toy tier and supports no claim about
    KN-LIT-009 unless STAGE-0 obtained the source.

  falsification_criterion: >-
    Any of: an enumerated total differing from C(|W|+m-1, m) in any arm; the m = 1
    slice returning a decomposable set of size other than 2B; c_W(O) below B at
    m = 2 on a 2-torsion-free base; any g with c_W(g) != c_W(-g); a measured exponent
    ratio near 1 in ARM-EXACT; or the two STAGE-1 derivations disagreeing. Any one of
    these refutes H-RELN-96e3ba and the result is reported as a refutation.

  required_artifacts:
    - "The committed forced-value table and its SHA-256, written before execution."
    - "Per-cell enumerated integers for every arm, with the arm's forced value beside each."
    - "The measured exponent-ratio sequences with their monotonicity verdicts."
    - "The 20-cell RULE-HEUR-TRACK verdict table under both reference curves."
    - "The verbatim source quotation with section reference, or the exact per-endpoint HTTP outcomes."
    - "The environment report (numpy, sympy, sage, ic_first_fall_fast import outcomes)."
    - "The full seed manifest, enumerated before execution."
    - "A statement of which stage terminated the run, if any."

  assigned_to: executor
