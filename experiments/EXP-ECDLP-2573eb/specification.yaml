# EXP-ECDLP-2573eb
# Hit-rate exponent arithmetic. No hit count.
# Approved by DEC-20261002-7fff2c.
experiment:
  id: EXP-ECDLP-2573eb
  hypothesis_id: H-ECDLP-529091
  source_idea: IDEA-20261002-6e6ce8
  question_id: RQ-ECDLP-002
  version: 1
  title: Hit-rate exponent arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-7fff2c
  objective: >-
    Check that 7/16 is 1/16 below 1/2, and that epsilon = 0 keeps the
    exponent equal to 1/2.
  inputs:
    m: 5
    theta: 1
    epsilon_zero: 0
    tie_gap: 0
    epsilon_num: 1
    epsilon_den: 8
    exp_num: 7
    exp_den: 16
    gap_num: 1
    gap_den: 16
    cross_low: 14
    cross_high: 16
    cross_diff: 2
    constant_factor: 2
  controls:
    - >-
      7/16 is 1/16 below 1/2. Reporting the two fractions as equal
      invalidates the run.
    - >-
      At epsilon = 0 the exponent is 1/2. Reporting that cell as
      strictly below 1/2 invalidates the run.
    - >-
      The constant factor 2 does not enter the exponent. The epsilon
      = 0 cell stays equal to 1/2.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - cell in {zero, eighth}
    - route in {cross_product, formula}
  metrics:
    primary:
      - gap_eighth
      - tie_at_zero
      - implementations_agree
    secondary:
      - cross_diff
  heuristic_under_test: null
  preregistered_prediction:
    quantity: 7/16 is 1/16 below 1/2, and the epsilon = 0 cell ties 1/2.
    formula: >-
      Compare 7 times 2 with 16 times 1. Evaluate 2 times (1 minus
      epsilon) divided by 4 at epsilon 0 and epsilon 1/8.
    source: >-
      IDEA-20261002-6e6ce8 states the exponent 2(1 - epsilon)/(m - theta)
      at m = 5 and theta = 1, read 2026-10-02. The fractions were
      computed in this design session. That computation is not a run.
      No hit rate was measured.
  scale_relevance:
    tier: toy
    justification: Two rational cells. No transfer to a group order.
    correspondence: null
  tail_checks:
    - The exact tie at epsilon = 0 is required. A check that stops at 7/16 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the gap 1/16 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The gap of 7/16 below 1/2 is not 1/16.
    - Epsilon = 0 is reported as strictly below 1/2.
    - 7/16 is reported as equal to 1/2.
    - A hit rate is measured or a curve is built.
  success_criterion: >-
    Both runs agree that 7/16 is 1/16 below 1/2, that the cross
    difference is 2, and that the epsilon = 0 cell equals 1/2.
  falsification_criterion: >-
    The runs agree, the cross products of 7/16 and 1/2 are 14 and 16,
    and their difference is not 2.
  required_artifacts:
    - experiments/EXP-ECDLP-2573eb/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-2573eb/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-2573eb/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-2573eb/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-2573eb/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-2573eb/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any hit-rate count, any coset enumeration, and any curve.
    - Any claim that epsilon is at least 1/8.
    - Any measured relation or linear algebra.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
