  stop_check:
    rule: STOP-1
    definition: >-
      "If the idea's own flagged c>=12 example (Q = k*n^{c+1}) CANNOT be
      reproduced from the primary sources -- i.e., the exponent, its origin
      reduction step, or its formula cannot be located and verified in
      KN-LIT-21383c, KN-LIT-4706, or KN-LIT-1744 -- STOP and report the
      discrepancy (what was found instead, and where) BEFORE computing any
      new reach-map number." (EXP-MLKEM-9d41b6.stopping_rules)
    outcome: STOP-1 FIRED.
    what_was_sought: >-
      A formula of the shape "Q = k*n^{c+1}" (sample/state count Q as a
      function of module rank k and ring/lattice dimension n, with exponent
      constant c, and c stated or derivable as >= 12), located in
      KN-LIT-21383c (Regev 2004), KN-LIT-4706 (BKSW), or KN-LIT-1744
      (IP-M-EDCP), with a specific theorem/lemma/page citation.
    search_performed: >-
      Full-text extraction (pdftotext -layout) of both local PDFs and the
      fetched arXiv PDF, followed by targeted grep passes for: "n^{c",
      "Q = k", "k*n", "k \cdot n", literal "astronomically"/"impractical",
      the digit sequences "12" and "8" in exponent contexts, and the phrase
      "sample" (60+ occurrences in KN-LIT-1744 alone, all inspected by line
      context). Followed by direct reads of every section in KN-LIT-1744
      whose table of contents names sample-count results (Section 2.3
      "Increasing the Number of Samples", Section 5.1 "Amplification of the
      Sample Number", Lemma 28) and every relevant lemma in KN-LIT-4706
      (Lemma 10 EDCP self-reduction, Lemma 11 Gaussian-EDCP to DCP, Lemma 12
      cube-separation, Theorem 2 LWE<=EDCP) and the relevant sections of
      KN-LIT-21383c (group-size relation N=(2M)^n, the O(n^2.5)-uniqueSVP
      headline reduction).
    what_was_found_instead:
      - source: KN-LIT-4706 (BKSW), Lemma 10 (EDCP self-reduction), p.15-16
          (running-header page 15/16 of the PDF, "Lemma 10")
        formula: >-
          "there is a probabilistic reduction with run-time polynomial in
          kappa, from G-EDCP^l_{n,N,r1} (resp. U-EDCP) to
          G-EDCP^{O(l/kappa^{c+1})}_{n,N,r2} (resp. U-EDCP), ... where
          r1/r2 = O(kappa^c) for any constant c." Exponent form c+1 DOES
          appear here, structurally similar to the flagged "n^{c+1}" -- but
          the base of the exponent is the SECURITY PARAMETER kappa, not the
          lattice/ring dimension n, and the quantity scaling is the DCP-STATE
          COUNT l (an input sample budget), not a module rank k times a
          dimension n. No constraint forcing c>=12 appears; the statement is
          "for any constant c" and BKSW's own worked instance elsewhere in
          the same paper (Lemma 12, cube separation for the LWE->EDCP
          reduction, and IP-M-EDCP's Lemma 29 citing it) fixes a DIFFERENT
          constant, c>=8, not c>=12.
        theorem_page_cited: "KN-LIT-4706, Lemma 10, PDF page 15-16 (visible via pdftotext line 797-809 of full-text extraction; original paper section 2, 'Reductions between EDCP')."
      - source: KN-LIT-4706 (BKSW), Lemma 12 (cube-separation width choice)
        formula: >-
          "For a constant c >= 8, a matrix A in Z_q^{m x n} is randomly
          chosen ... " -- the constant here is explicitly bounded c>=8, and
          this Lemma is reused verbatim by KN-LIT-1744 as "Lemma 29
          ([BKSW18, Lemma 12]). For a constant C >= 8, ...". Neither
          instance states c>=12, and neither is a sample-COUNT formula of the
          shape k*n^{c+1} -- Lemma 12/29 sets a GRID-WIDTH parameter z=q/c,
          not a sample or state count.
        theorem_page_cited: "KN-LIT-4706, Lemma 12 (pdftotext line 926); KN-LIT-1744, Lemma 29 citing [BKSW18, Lemma 12] (pdftotext line 2590)."
      - source: KN-LIT-1744 (IP-M-EDCP), Section 2.3 / 5.1, Lemma 28
        formula: >-
          The sample-amplification result actually proved is: starting from
          m = O(log kappa) P-MLWE samples, produce m' = poly(kappa)
          IP-MLWE-like samples (Lemma 28, Section 5.1). A separate
          back-of-envelope count earlier in the technical overview (Section
          2.3) states the number of P-MLWE samples IP-M-EDCP state generation
          needs is m = omega(tilde{}(log q . d^n) / log(q/B)) -- an
          expression in RING DEGREE d and MODULE RANK n as an EXPONENT of d
          (d^n, not n^{c+1} for a rank-independent constant c), with q the
          modulus and B a bound, not a "Q = k*n^{c+1}" formula and not tied to
          a constant c at all.
        theorem_page_cited: "KN-LIT-1744, Section 2.3 (pdftotext line 682-684), Section 5.1 / Lemma 28 (pdftotext line 2296-2340)."
      - source: KN-LIT-21383c (Regev 2004)
        formula: >-
          The paper's headline composed reduction is stated as
          Theta(n^{2.5})-uniqueSVP (abstract, and Theorem/Corollary 1.x), and
          internally the DCP group size relation used is N = (2M)^n (line
          251 of the extracted text) -- no Q = k*n^{c+1} formula, no c>=12
          constant, and (being unstructured, single-rank) no module-rank
          variable k at all: k as a module-rank parameter does not exist in
          this paper's object language.
        theorem_page_cited: "KN-LIT-21383c, Abstract and Section 2 (pdftotext lines 14-16, 251)."
      - source: KN-OPEN-8a5965 itself (a POINTER RECORD, not a governed primary source, but read to trace the c>=12 origin)
        finding: >-
          The document's own Q1 sub-question 6 is the actual origin of the
          "c >= 12" phrase in this program's records: "The concluding
          accounting uses an amplitude bound of n where the corollary proves
          n^{3/2}. Re-derived at c >= 12 the conclusion survives either way
          (n^{-2} <= 1/n)." This is a statement about SIMON 2026's (KN-LIT-
          e204ab's) OWN internal failure-probability/amplitude-bound
          accounting in the DCP algorithm's proof -- an erratum note about Q1,
          not a sample-count formula and not sourced to KN-LIT-21383c,
          KN-LIT-4706, or KN-LIT-1744 at all. Separately, the SAME document's
          "Q2" section states, without an inline citation to any of the three
          governed sources or to a specific theorem in KN-LIT-e204ab: "Q =
          k.n^{c+1} samples with c>=12, k>c -- on the order of 12.n^13
          coherent DSP samples." No derivation, theorem number, or page is
          given for this line in KN-OPEN-8a5965 itself.
    conclusion: >-
      The literal formula "Q = k*n^{c+1}" with rank k, dimension n, and
      c >= 12 does NOT appear, in that form, in KN-LIT-21383c, KN-LIT-4706, or
      KN-LIT-1744. The nearest structural relative is BKSW's Lemma 10
      (exponent form kappa^{c+1}, "for any constant c", no lower bound forcing
      c>=12, and base kappa/sample-budget l rather than dimension n/module
      rank k). The specific constant 8 (not 12) recurs twice across the two
      local sources (BKSW Lemma 12; IP-M-EDCP Lemma 29 citing it) but attaches
      to a grid-width parameter, not a sample count. Regev 2004 has neither a
      module rank k nor any c-parameterised exponent of this shape. The c>=12
      figure traces, as far as this run could determine, to KN-OPEN-8a5965's
      own Q1 erratum note about SIMON 2026's proof accounting (out of scope,
      Q1) conflated in the SAME document's Q2 section into an uncited
      "Q = k.n^{c+1}" sample-count line that this run could not verify against
      Simon 2026's full text either (PDF access blocked, HTTP 403; only the
      abstract was reachable, which does not contain this formula). Because
      KN-OPEN-8a5965 is explicitly a pointer record, not a citable primary
      source, per this experiment's own invalidation_rules ("Any parameter
      transformation cited only to KN-OPEN-8a5965 or KN-TECH-d1bc4f ... is
      SOURCE-BLOCKED, not treated as cited"), the c>=12 example as flagged
      cannot be reproduced from a governed primary source. This is STOP-1's
      exact trigger condition.
    action_taken: >-
      STOPPED per protocol. No reach-map table, no per-(convention, k)
      verdicts, and no composed (dimension, modulus, noise-ratio) numbers were
      computed for k in {1,2,3,4}, since a reach map built on a mis-stated or
      untraceable baseline is explicitly worse than none
      (hidden_overhead_disclosure / stopping_rules rationale in the frozen
      specification). No k=1 degeneracy-gate check was run either, since
      STOP-1 is the PRIMARY, RUN-FIRST rule and gates STOP-2 and everything
      downstream of it.

