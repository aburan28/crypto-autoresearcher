experiment:
  id: EXP-MLKEM-9d41b6
  hypothesis_id: H-MLKEM-7f3a2c
  version: 1
  title: >-
    Conditional reach map of the DCP -> Regev -> BKSW -> IP-M-EDCP chain
    against FIPS 203 ML-KEM-512/768/1024, both alpha conventions, Q1 not
    adjudicated
  status: approved

  objective: >-
    Determine, per HEUR-DCP-1's validation plan and H-MLKEM-7f3a2c's
    three-part test boundary (both-conventions sweep, k=1 degeneracy gate,
    SOURCE-BLOCKED discipline), whether the published DCP -> unstructured LWE
    -> Module-LWE reduction chain -- GRANTING Simon 2026's claimed parameters
    without adjudicating their correctness -- reaches FIPS 203's deployed
    ML-KEM-512/768/1024 parameters (k=2,3,4; n=256; q=3329), under each of two
    normalisation conventions for alpha, with every reported number traced to
    a specific theorem/page in Regev 2004 (KN-LIT-21383c), BKSW (KN-LIT-4706),
    or IP-M-EDCP (KN-LIT-1744). Q1 (is Simon's proof correct) is explicitly
    OUT OF SCOPE and is not touched by any part of this experiment.

  inputs:
    primary_sources:
      - id: KN-LIT-21383c
        title: "Quantum Computation and Lattice Problems (Regev 2004)"
        access: "DOI 10.1137/S0097539703440678, arXiv cs/0304005"
      - id: KN-LIT-4706
        title: "Learning With Errors and Extrapolated Dihedral Cosets (BKSW)"
        access: >-
          CORRECTED 2026-08-07: NOT under any downloads/ path -- that
          directory does not exist in this repository (0 hits, confirmed via
          git ls-tree; this is the KN-OPEN-3f7a21 pattern, found in this
          record's own first draft). Real file, confirmed valid PDF (463170
          bytes): /Volumes/SSD990/research/10770194.pdf, outside this repo.
          Verify the path resolves before relying on it; STOP (per
          stopping_rules) and report if it does not.
      - id: KN-LIT-1744
        title: "Module Learning With Errors and Structured Extrapolated Dihedral Cosets (IP-M-EDCP)"
        access: >-
          IACR ePrint 2026/155. CORRECTED 2026-08-07: same downloads/-path
          defect as KN-LIT-4706 above. Real file, confirmed valid PDF
          (1229350 bytes): /Volumes/SSD990/research/2026-155.pdf, outside
          this repo. Verify before relying on it; STOP and report if it does
          not resolve.
      - id: FIPS-203
        title: "NIST FIPS 203, Module-Lattice-Based Key-Encapsulation Mechanism Standard"
        access: "NIST publication; must cite the exact table naming k, n, q, eta per parameter set"
    granted_but_unadjudicated:
      - id: KN-LIT-e204ab
        title: "Simon 2026 (ePrint 2026/1591), claimed poly-time DCP algorithm"
        note: >-
          Its stated noise tolerance (1/O(log n)) and delivered SVP factor
          (sqrt(n) polylog(n)) are GRANTED as input parameters to this
          computation. Q1 correctness is out of scope; use KN-LIT-e204ab
          directly for the exact stated numbers, not KN-OPEN-8a5965's or
          KN-TECH-d1bc4f's paraphrase, which are pointers only.
    pointer_records_not_to_be_cited_as_sources:
      - KN-OPEN-8a5965
      - KN-TECH-d1bc4f
      - "these frame the question; every substantive number in the reach map must trace to a primary source above, not to these summaries"

  controls:
    - both_conventions_sweep: >-
        Compute the reach verdict independently under BOTH normalisation
        conventions for alpha (ratio in (0,1); absolute sqrt(n) polylog(n))
        at every tested k. Agreement -> robust verdict. Disagreement -> the
        disagreement is reported as the finding, not resolved by picking one
        convention.
    - k1_degeneracy_gate: >-
        At k=1, the IP-M-EDCP-derived parameter map MUST reduce exactly to
        KN-LIT-4706's plain unstructured LWE-eDCP equivalence. Run this check
        BEFORE trusting any k in {2,3,4} number computed by the same
        procedure. A failure here is a STOP (see stopping_rules), not a
        smoothed-over footnote.
    - source_blocked_discipline: >-
        Any parameter transformation that cannot be traced to a specific
        theorem/page in KN-LIT-21383c, KN-LIT-4706, or KN-LIT-1744 is marked
        SOURCE-BLOCKED in the output table explicitly, never inferred or
        filled from a secondary summary (including this contract's own prose,
        KN-OPEN-8a5965, or KN-TECH-d1bc4f).

  independent_variables:
    - alpha_convention: [ratio_in_0_1, absolute_sqrt_n_polylog_n]
    - rank_k: [1, 2, 3, 4]   # k=1 is the degeneracy gate, not a deployed ML-KEM instance

  metrics:
    primary:
      - reach_verdict: "reaches | does_not_reach | condition_violated, per (convention, k)"
      - composed_regime: "(dimension, modulus, noise-ratio alpha) triple delivered by the chain, per (convention, k)"
      - fips203_regime: "(n=256, q=3329, eta) triple per ML-KEM variant, cited to FIPS 203 directly"
    secondary:
      - sample_count_Q: "Q = k*n^{c+1} reproduced from source with its c value, or reported discrepancy"
      - k1_gate_result: "pass | fail, with the specific discrepancy if fail"
      - source_blocked_count: "number of table cells marked SOURCE-BLOCKED, and which cells"

  heuristic_under_test: HEUR-DCP-1

  preregistered_prediction:
    quantity: "reach verdict per (alpha_convention, rank_k) cell of the 2x4 grid (including k=1 gate)"
    formula: >-
      Composition of Regev's DCP->SVP dimension/noise-rate relation (as
      corrected by BKSW) with IP-M-EDCP's MLWE bridge, substituting Simon
      2026's granted noise tolerance and FIPS 203's (k, n, q); no numeric
      formula is fixed in advance beyond "each link's own stated formula,
      composed" -- the point of the experiment is to determine what that
      composition actually is, since KN-OPEN-8a5965 records that it has never
      been computed.
    source: >-
      KN-LIT-21383c, KN-LIT-4706, KN-LIT-1744, read directly; the prediction
      itself is the experiment's output, not a pre-committed number, because
      no such number exists anywhere in the ledger or knowledge corpus prior
      to this experiment.

  scale_relevance:
    tier: not_applicable
    justification: >-
      This is not a toy-vs-crypto scale question in the usual computational
      sense: no lattice reduction, sampling, or attack runs at any scale.
      The target parameters (FIPS 203's own k=2,3,4, n=256, q=3329) ARE the
      deployed values from the outset -- there is no scale gap to bridge by
      design, and no correspondence trick or toy-instance extrapolation is
      used or needed.
    correspondence: null

  tail_checks: []   # not applicable; no distributional/statistical claim is made

  memory_accounting:
    applicable: false
    justification: >-
      NOT APPLICABLE. This is pure literature arithmetic: reading three
      papers and FIPS 203, tracing formulas, and substituting numbers by
      hand/in prose. There is no computational run, no process to measure,
      and no peak_rss_bytes to record. Stated explicitly here, rather than
      left as a silently empty field, per the field-completeness gate.

  optimistic_assumption_disclosure: >-
    This experiment assumes the reduction chain's stated formulas, as printed
    in the three primary sources, are complete and are correctly transcribed
    by the executor into this record's reach-map table. Any step in a source
    labelled "Sketch" or otherwise informally justified must be flagged in the
    output with its DIRECTION OF BIAS if a simplification is made when reading
    it (e.g., "reading the sketch's stated bound as an equality rather than an
    inequality would understate the required sample count, biasing the reach
    verdict toward reaches"). An unflagged simplification of a Sketch-labelled
    step is a defect in the run, not an acceptable simplification.

  hidden_overhead_disclosure: >-
    KN-OPEN-8a5965 flags Q = k*n^{c+1} samples with c>=12 (on the order of
    12*n^13 coherent DSP samples) as "simultaneously polynomial and
    astronomically impractical." This experiment MUST reproduce this example
    from its primary source (tracing which of the three reductions the
    exponent c actually originates in) and report it as a SUPERPOLYNOMIAL-IN-
    PRACTICE HIDDEN COFACTOR alongside any "reaches" verdict -- never let a
    bare "polynomial time" headline absorb it. If the exponent cannot be
    reproduced from source, this triggers the stopping rule below.

  replication:
    seeds: []
    independent_instances: 0
    justification: >-
      There is no randomness in this experiment to seed -- it is deterministic
      literature arithmetic, not a sampled or simulated process. The natural
      check on this kind of result is a second reader independently re-deriving
      the same citations and comparing tables (an independent review pass),
      not a repeated run with a different seed. `independent_instances: 0` and
      `seeds: []` are therefore the correct values here, not a gap in the
      contract -- a nonzero value would misrepresent a reading task as a
      computational experiment with variance to average out.

  budget:
    wall_clock_seconds_per_run: 0
    total_cpu_hours: 0
    maximum_memory_gb: not_applicable
    maximum_runs: 1
    justification: >-
      Single literature-arithmetic pass, not a replicated computational
      experiment. Reading time is real but is not a "run" in the sense this
      field tracks; no compute budget is consumed. maximum_runs: 1 reflects
      that this is produced once and reviewed, not resampled.

  stopping_rules:
    - >-
      STOP-1 (PRIMARY, RUN FIRST): if the idea's own flagged c>=12 example
      (Q = k*n^{c+1}) CANNOT be reproduced from the primary sources -- i.e.,
      the exponent, its origin reduction step, or its formula cannot be
      located and verified in KN-LIT-21383c, KN-LIT-4706, or KN-LIT-1744 --
      STOP and report the discrepancy (what was found instead, and where)
      BEFORE computing any new reach-map number. A reach map built on top of
      a mis-stated baseline is worse than none.
    - >-
      STOP-2: if the k=1 degeneracy gate fails (does not reduce to plain
      unstructured LWE), STOP before reporting any k in {2,3,4} verdict; report
      the discrepancy and treat the k>=2 computation as invalid pending a
      corrected parameter-mapping procedure.

  invalidation_rules:
    - >-
      Any table cell substituting FIPS 203's exact (k, n, q) triple without a
      direct citation to the FIPS 203 publication itself invalidates that
      cell.
    - >-
      Any parameter transformation cited only to KN-OPEN-8a5965 or
      KN-TECH-d1bc4f (rather than the primary source they point to) is
      SOURCE-BLOCKED per the controls above, not treated as cited.

  success_criterion: >-
    A reach map exists, per convention (2 conventions), at each of k in
    {2,3,4} (the deployed ML-KEM ranks) plus the k=1 gate, where EVERY number
    in the table is traced to a specific theorem/page in one of the three
    primary sources or FIPS 203, AND the idea's own flagged c>=12 example is
    either reproduced from source with its exact exponent and origin step, or
    the discrepancy between what is claimed and what is found is explicitly
    reported (never silently dropped). Decidable: the table exists with full
    citations, or it does not; the c>=12 example is reproduced or its
    discrepancy is named, with no third (silent) outcome.

  falsification_criterion: >-
    ANY convention yields a reach verdict at ANY tested k that is NOT
    astronomically impractical (i.e., a "reaches" verdict whose sample count
    and noise tolerance are within a range that would matter for near-term
    risk assessment, not merely asymptotically). THIS FLIPS THE CONCLUSION AND
    IS THE SINGLE MOST CONSEQUENTIAL POSSIBLE OUTCOME IN THE CURRENTLY ACTIVE
    PORTFOLIO: every one of GOAL-MLKEM-001..005 and GOAL-MLDSA-001..002's
    threat models would need to change at the root, per KN-OPEN-8a5965's "Why
    it matters." This is stated explicitly here so that outcome is never
    buried under a routine-looking table.

  required_artifacts:
    - reach_map_table: "convention x k -> (Q, alpha, dimension, reach verdict), for k in {1,2,3,4}"
    - citations: "direct theorem/page citation for every number in the table, or an explicit SOURCE-BLOCKED marker"
    - q1_noninterference_confirmation: >-
        explicit statement confirming Q1 (Simon's proof correctness) was NOT
        touched, adjudicated, or assumed correct beyond the granted-input
        parameters named in this contract's inputs section
    - k1_degeneracy_gate_result: "pass/fail with derivation, per the k1_degeneracy_gate control"
    - hidden_overhead_report: "the reproduced or discrepant Q = k*n^{c+1}, c>=12 example, per hidden_overhead_disclosure"

  assigned_to: executor
  approved_by: coordinator
