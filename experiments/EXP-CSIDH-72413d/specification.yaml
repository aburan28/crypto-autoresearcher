# EXP-CSIDH-72413d
# Stage-0 Kronecker-versus-kernel certificate for H-CSIDH-695382.
# Frozen before the official run.
experiment:
  id: EXP-CSIDH-72413d
  hypothesis_id: H-CSIDH-695382
  source_idea: IDEA-20261006-534e34
  question_id: RQ-CSIDH-64343f
  goal_id: GOAL-CSIDH-001
  version: 1
  title: >-
    Kronecker splitting versus rational degree-l kernels at p = 47
  status: approved
  frozen: true
  designed_at: '2026-10-12'
  approved_by: coordinator
  approval_decision_id: DEC-20261012-7569fa
  execution_authorized: true
  objective: >-
    Compare two subsets of {3, 5, 7, 11} on the smallest nonsingular
    supersingular Montgomery curve over F_47. Split is the set of l
    with Kronecker symbol (-47 / l) = 1. Edge is the set of l that
    admit a rational cyclic kernel whose Vélu quotient is
    supersingular and F_47-isomorphic to y^2 = x^3 + A' x^2 + x.
  inputs:
    prime: 47
    primes: [3, 5, 7, 11]
    curve: "y^2 = x^3 + A x^2 + x"
    selection: smallest nonsingular supersingular A
    named_future_run_slot: RUN-CSIDH-92d9d9
  controls:
    - >-
      The Kronecker symbol agrees with quadratic reciprocity. The
      singular coefficient A = 2 is refused. The scored curve is
      supersingular and is not the smallest ordinary curve.
    - >-
      A rational order-3 point on the scored curve has a Vélu image
      with the same point count.
  independent_variables:
    - the prime l in {3, 5, 7, 11}
  metrics:
    primary:
      - matrix_holds
      - beyond_matrix
    secondary:
      - planted_ok
  heuristic_under_test: >-
    IDEA-20261006-534e34: at p = 47 the Kronecker set and the
    rational-kernel set are the same four-prime comparison.
  preregistered_prediction:
    quantity: >-
      The symmetric difference of Split and Edge has size 0.
    formula: >-
      The positive reading is size 0. The negative reading is size
      at least 1 on a valid manifest.
    source: >-
      IDEA-20261006-534e34 states that the sets are equal and that
      a symmetric difference of size at least 1 is the negative.
      That pair was fixed before this driver was executed.
  scale_relevance:
    tier: toy
    justification: >-
      One 47-element field and four primes. CSIDH-512 is not this
      contract.
    correspondence: null
  tail_checks:
    - >-
      No eligible supersingular curve invalidates the cell.
    - >-
      A kernel reported on the singular coefficient A = 2 invalidates
      the cell.
  replication:
    seeds: []
    independent_instances: 1
    named_future_run_slot: RUN-CSIDH-92d9d9
    replication_note: >-
      One deterministic pass. No seed is drawn.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 60
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one valid manifest for RUN-CSIDH-92d9d9.
    - Do not add a prime, a second curve, or a class-group computation.
    - A missed matrix is the recorded result. Do not change the sets.
  invalidation_rules:
    - No eligible curve exists, or a planted check fails.
    - The singular coefficient is scored.
    - A timeout, crash, or missing set.
  success_criterion: >-
    The manifest is valid, planted_ok is true, and the symmetric
    difference has size 0.
  falsification_criterion: >-
    The manifest is valid, planted_ok is true, and the symmetric
    difference has size at least 1.
  decision_impact:
    on_positive: >-
      Record that these four primes name the same set on this one
      curve. Do not treat that as a class-group theorem and do not
      claim a security level.
    on_negative: >-
      Record that the two sets differ on this curve. Do not publish
      a CSIDH-512 action from this manifest.
  required_artifacts:
    - experiments/EXP-CSIDH-72413d/runs/RUN-CSIDH-92d9d9/manifest.yaml
    - experiments/EXP-CSIDH-72413d/runs/RUN-CSIDH-92d9d9/raw-result.json
  assigned_to: executor
  launcher:
    trial_plan: experiments/EXP-CSIDH-72413d/trial-plan.json
    driver: experiments/EXP-CSIDH-72413d/implementation/run.py
    checker: experiments/EXP-CSIDH-72413d/implementation/check.py
  out_of_scope:
    - Any prime field other than 47, and any prime outside {3, 5, 7, 11}.
    - The class group, a security level, and CSIDH-512.
