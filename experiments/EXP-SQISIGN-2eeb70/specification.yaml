experiment:
  id: EXP-SQISIGN-2eeb70
  hypothesis_id: H-SQISIGN-d1647c
  derived_from_idea: IDEA-20260801-020
  question_id: RQ-SQISIGN-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Power-calibrated two-sample permutation probe of toy SQIsign-style transcripts against a matched
    endomorphism-ring baseline, delivering a minimum detectable divergence rather than a verdict
  objective: >-
    The one uncertainty a run reduces is whether the toy transcript distribution is distinguishable
    from a matched baseline that carries no secret information, AND at what resolution that question
    was actually asked. A run establishes (i) the permutation p-value of a pre-registered divergence
    statistic on real transcripts against the matched baseline at three toy sizes; (ii) the MINIMUM
    DETECTABLE DIVERGENCE at power 0.95 and level 1e-3, measured empirically from an injected-bias
    dose ladder rather than assumed from a formula, which is the number that makes a null
    interpretable; (iii) the positive-control rejection rate, which gates whether any negative may be
    read at all; and (iv) the calibration of the test on a negative control drawn from a ring
    independent of the secret. No attack, break, speedup or security consequence is claimed here or
    would follow from a run. No statement is made about SQIsign's standardized parameters. No
    direction is declared impossible.
  what_this_is_not:
    - >-
      Not an attack, a key recovery, a forgery, or a cryptanalytic result. It is a calibrated
      statistical control probe.
    - >-
      Not a claim, in either direction, about the security of SQIsign at its standardized parameters
      or of any deployed system.
    - >-
      Not a proof of independence. A non-rejection is a bound at the measured resolution and is
      reported in those words or not at all.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence. No
      run has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope, at the executed toy sizes, for the ONE declared divergence statistic
      on the ONE declared feature encoding, and at the achieved sample sizes, the toy transcript
      distribution is or is not distinguishable from the matched baseline, with a stated minimum
      detectable divergence. WHAT DOES NOT FOLLOW: nothing about SQIsign's standardized parameters,
      nothing about statistics outside the declared battery, nothing about an adversary who observes
      many signatures under one key unless that regime is itself an arm, and no security statement
      of any kind. Extrapolation of the toy-size trend is a separate numbered heuristic
      (HEUR-SQISIGN-LEAK-1) requiring its own evidence.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, blocking). Pre-declare, in the frozen contract and hashed before any
      generation: the transcript feature encoding, the divergence statistic, the permutation
      procedure and resample count, the rejection level, the injected-bias dose ladder, and the
      three toy size parameters. STAGE 1 (instrument construction). Instantiate the toy signing
      pipeline and verify that the matched baseline is produced by the SAME code path with only the
      secret-dependent step replaced; assert byte-level identity of every non-replaced stage on a
      fixed seed. This is a wiring gate: if the two arms differ anywhere else, the probe measures the
      code path. STAGE 2 (calibration, run BEFORE the real arm is read). Generate the negative
      control (ring independent of the secret) and measure the empirical rejection rate against the
      nominal level; generate the positive-control dose ladder and measure the rejection rate at each
      dose; report the smallest dose with rejection rate at least 0.95 as the MINIMUM DETECTABLE
      DIVERGENCE. STAGE 3 (the real arm). Generate real transcripts and the matched baseline at each
      of the three toy sizes on disjoint seed streams; compute the divergence statistic and its
      permutation p-value. STAGE 4 (trend). Report the p-value and the minimum detectable divergence
      as functions of toy size, with a signed slope and interval, testing HEUR-SQISIGN-LEAK-1.
      STAGE 5 (zero compute). Assemble the table and the refusal statement for any regime outside
      the calibrated resolution.
    instrument: >-
      One divergence or distance statistic on a declared feature encoding of the transcript
      (commitment codomain invariant, challenge, response walk descriptor), with a permutation test
      at 10000 resamples. The statistic, the encoding, the dose ladder and the level are frozen
      before data generation. The positive control injects a secret-dependent bias of controllable
      magnitude into the response step only, so the dose axis is a single scalar. Recorded through
      harness/runner.py.
    parameters: >-
      Three toy size parameters, declared and frozen before generation, ordered smallest to largest.
      2000 transcripts per arm per size. Four arms: real, matched baseline, positive control at each
      of at least four doses, negative control. Permutation resamples 10000. Rejection level 1e-3.
      Target power 0.95. Disjoint seed streams per arm, per size, per replicate. Three independent
      replicates at distinct seeds.
  controls:
    - >-
      POSITIVE CONTROL (BLOCKING, run before the real arm is read): transcripts with a deliberately
      injected secret-dependent bias at a declared dose ladder. The test MUST reject at the reference
      dose with rate at least 0.95. If it does not, the run is invalid for this hypothesis and no
      negative may be recorded.
    - >-
      NEGATIVE CONTROL: transcripts generated from a ring independent of the secret. The test must
      NOT reject above the nominal level 1e-3 within Monte-Carlo error. A higher rate means the
      permutation calibration or the sample-independence assumption has failed.
    - >-
      NULL OBJECT, the matched baseline itself: transcript components produced by the SAME code path
      with only the secret-dependent step replaced by an independent instance. FORCED VALUE: equal
      distributions, hence a uniform p-value. Any deviation is the finding. A baseline generated by
      a different code path is not this null and voids the comparison.
    - >-
      WIRING GATE: byte-level identity of every non-replaced pipeline stage between the real and
      baseline arms on a fixed seed, asserted before any statistic is computed.
    - >-
      SEED-INDEPENDENCE CONTROL: disjoint seed streams per arm, asserted programmatically, since
      shared randomness between arms is the canonical way a null becomes artefactual here.
    - >-
      DOSE LADDER as the resolution instrument: at least four injected-bias doses spanning the
      resolution boundary in both directions, so the minimum detectable divergence is MEASURED rather
      than derived from an assumed variance.
  independent_variables:
    - toy size parameter, one of three declared values
    - >-
      arm, one of real transcript, matched baseline, positive control at dose d, negative control
    - injected-bias dose d, over at least four declared values
    - seed stream / replicate index
  metrics:
    primary:
      - >-
        transcript_vs_baseline_permutation_p_value, units a probability in [0,1], computed as the
        fraction of 10000 permutation resamples whose divergence statistic equals or exceeds the
        observed one, per toy size and per replicate
      - >-
        minimum_detectable_divergence, units the same units as the declared divergence statistic,
        computed as the smallest injected-bias dose on the ladder at which the empirical rejection
        rate over replicates reaches 0.95 at level 1e-3, per toy size
      - >-
        positive_control_rejection_rate, units a rate in [0,1], computed as the fraction of replicates
        rejecting at level 1e-3, per dose and per toy size
      - >-
        negative_control_rejection_rate, units a rate in [0,1], computed as the fraction of replicates
        rejecting at level 1e-3 on transcripts from an independent ring
    secondary:
      - >-
        observed divergence statistic value with a bootstrap interval, units the statistic's own
        units, per arm and per toy size
      - >-
        divergence_trend_slope across the three toy sizes, units statistic units per size step, with
        an interval, computed by least squares on the three points
      - >-
        wiring_gate_pass, units boolean, computed as byte-level identity of non-replaced stages on a
        fixed seed
      - >-
        seed_stream_disjointness_pass, units boolean, asserted programmatically per arm
      - >-
        per-arm sample counts actually realized, units count, so a shortfall cannot be absorbed into
        a summary
  heuristic_under_test:
    id: HEUR-SQISIGN-LEAK-1
    formal_statement: >-
      Let D(n) be the true divergence between the toy transcript distribution and the matched
      baseline at toy size n. The heuristic asserts that if D(n) is below the measured minimum
      detectable divergence at every tested n AND the measured trend in n is not materially
      increasing, then the toy-size verdict is directionally informative about larger n. The
      heuristic makes no quantitative claim about D at any untested n.
    validation_arm: >-
      Stage 4, the trend arm across three toy sizes, with the slope and its interval reported. This
      arm can falsify the heuristic and cannot confirm it beyond the tested range.
  preregistered_prediction:
    quantity: >-
      The permutation p-value on real transcripts at the largest toy size, and the minimum detectable
      divergence at that size.
    formula: >-
      Predicted, before any run: the real-arm p-value exceeds 1e-3 at every toy size (no rejection),
      the positive control rejects with rate at least 0.95 at the reference dose, and the negative
      control rejects at a rate at most 1e-3 within Monte-Carlo error. Under the alternative that a
      transcript-level leak exists at these toy parameters, the real-arm p-value falls below 1e-3
      with the negative control still calibrated. Under the null that the instrument has no power,
      the positive control also fails to reject, which is INVALID rather than negative.
    source: >-
      Pre-registered in the parent proposal IDEA-20260801-020, whose single stated prediction is a
      permutation p-value below 1e-3 at the largest toy size with power at least 0.95 against a
      constructed leak. The dose ladder, the sample sizes and the resolution reporting requirement
      are added by this contract as the operationalization of that power requirement, and are frozen
      here before any run exists.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at three declared toy size parameters chosen so that both the transcript and the
      matched baseline are directly sampleable, which is the entire design: the probe is only ever
      run where the baseline can be constructed exactly. The transfer assumption is stated as
      HEUR-SQISIGN-LEAK-1 and is explicitly NOT used to claim anything about standardized SQIsign
      parameters. No exact correspondence permitting sampling at cryptographic scale is available for
      this measurement, and that is the honest ceiling of the design.
    correspondence: null
  tail_checks:
    - >-
      Report the empirical null distribution of the divergence statistic and its upper tail, not just
      the p-value, so a heavy tail that inflates the nominal level is visible.
    - >-
      Report the number of permutation resamples exceeding the observed statistic; a p-value derived
      from zero exceedances is bounded by 1/10000 and must be reported as a bound, not as zero.
    - >-
      Report the rejection rate at the two doses immediately below the reference dose, so the
      resolution boundary is bracketed rather than asserted at one point.
    - >-
      Report per-replicate p-values, never only their combination, so a single outlying replicate
      cannot be averaged away.
  replication:
    seeds:
      - 20260801
      - 20260802
      - 20260803
    independent_instances: 3
  budget:
    wall_clock_seconds: 10800
    wall_clock_seconds_per_run: 10800
    total_cpu_hours: 8.0
    memory_gb: 8
    maximum_memory_gb: 8
    maximum_runs: 24
  stopping_rules:
    - >-
      Abort if the wiring gate fails, i.e. if any non-replaced pipeline stage differs between the
      real and baseline arms on a fixed seed.
    - >-
      Abort the size if fewer than the declared 2000 transcripts per arm can be generated within
      budget, and report the shortfall rather than a p-value computed at a smaller n.
    - >-
      Stage 2 calibration runs BEFORE the real arm is read. If the positive control fails at the
      reference dose, stop and report the instrument's resolution; do not proceed to interpret the
      real arm.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. A budget exhaustion is a stop,
      never a negative result (AGENTS.md rule 5).
    - >-
      The statistic, encoding, dose ladder and rejection level are frozen before data generation and
      are not revised after seeing any p-value.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
      and is NEVER negative mathematical evidence (AGENTS.md rule 5). The unavailability of a toy
      signing pipeline is such a failure.
    - >-
      A run whose positive control was not executed in the same invocation as the real arm is
      invalid_measurement: the resolution the negative depends on was not established.
    - >-
      A run whose arms share a seed stream is invalid_measurement, because sample independence, on
      which the permutation test rests, was not achieved.
    - >-
      A run in which the matched baseline was generated by a different code path from the real arm is
      invalid_measurement: it compared implementations rather than distributions.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires a
      new contract; it is never a repair of this one.
  success_criterion: >-
    The run succeeds as a MEASUREMENT when all of the following hold and are reported: the wiring
    gate passes; the seed streams are disjoint; the negative-control rejection rate is at most 1e-3
    within Monte-Carlo error; the positive-control rejection rate reaches at least 0.95 at some dose
    on the ladder, which establishes the minimum detectable divergence at that toy size; and the
    real-arm permutation p-value together with that resolution number is reported at all three toy
    sizes with per-replicate values. Each is decidable from the primary metrics above. A run that
    reports a real-arm p-value WITHOUT a minimum detectable divergence does not meet this criterion.
  falsification_criterion:
    - >-
      The real-arm p-value is below 1e-3 at any toy size while the negative control is calibrated.
      THE HYPOTHESIS IS FALSIFIED: transcript-level leakage is detectable at that toy parameter.
      Escalate to independent replication and red-team review; no security statement follows.
    - >-
      The positive control fails to reject at every dose on the ladder. The instrument has no power,
      the run is INVALID for this hypothesis, and the deliverable is the instrument's failure, never
      a negative about SQIsign.
    - >-
      The negative control rejects at a rate materially above 1e-3. The calibration is broken and
      every p-value in the run is void.
    - >-
      The divergence trend across the three toy sizes is materially and monotonically increasing.
      HEUR-SQISIGN-LEAK-1 is falsified and each verdict is scoped to its own size.
    - >-
      The minimum detectable divergence cannot be computed at any toy size. No bound was produced and
      nothing is reportable in either direction.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model and
      inference block, environment, and the frozen statistic and encoding by hash
    - >-
      raw-result.json carrying every per-replicate, per-arm, per-dose, per-size measurement, not
      summaries, including the empirical permutation null distribution
    - >-
      the positive-control dose ladder's full rejection-rate curve, in the same file as the real arm
    - >-
      the negative control's rejection rate and the wiring-gate and seed-disjointness assertions
    - >-
      the pre-registration text, written before the first run and hashed
    - >-
      certificate kind none, recorded explicitly, since no solve or relation is claimed
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator authorship does not confer approval. This contract is review_required and is NOT
      approved; approved_by is null and execution_authorized is false (AGENTS.md rule 1). Approval is
      the user's gate because it authorizes execution and spends compute.
    - >-
      The toy signing pipeline and the matched baseline construction must be identified by path and
      confirmed to exist before approval. If no such pipeline exists in this repository, the first
      task is its construction under a separate contract, not this measurement.
    - >-
      The divergence statistic and the transcript feature encoding must be named exactly in the
      frozen contract before approval; leaving them to the executor would make the test's power a
      choice made after seeing data.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment lifecycle steps 3-5
    source_record: IDEA-20260801-020
    authored_at: '2026-08-25'
    note: >-
      The parent proposal is terse: it supplies the arms (real, baseline, positive control, negative
      control), the single prediction (permutation p-value below 1e-3 at the largest toy size with
      power at least 0.95), the required metrics (p-value, minimum detectable divergence, control
      outcomes) and one heuristic (HEUR-SQISIGN-LEAK-1). This contract operationalizes the power
      requirement into a measured dose ladder and makes the minimum detectable divergence a blocking
      deliverable rather than an afterthought, because the proposal's own falsification condition
      "fails to reject while rejecting the positive control" is undecidable without it. Sample
      counts, resample counts, level and toy-size count are design choices made here and declared as
      such; the proposal supplied none. Boilerplate that is identical across contracts by program
      rule comes from a fixed table. Budgets come from the parent's declared estimated_cost of
      implementation medium and compute medium.
  derivation_gaps:
    - >-
      THE TOY SQIsign PIPELINE IS NOT IDENTIFIED. The parent proposal names no implementation and
      this repository is not asserted to contain one. Whether the transcript can be generated at all
      is the single largest unresolved precondition and must be settled before approval, not
      discovered by the executor.
    - >-
      The divergence statistic is unspecified ("a distance or divergence measure"). A coordinator
      must fix it before approval, because choosing a statistic after seeing the transcripts is the
      most likely way this contract would silently become a claim.
    - >-
      The transcript FEATURE ENCODING is unspecified. Computing a divergence on raw serialized bytes
      would make the test's power a property of the serializer rather than of the transcript, and the
      encoding must therefore be named in the frozen contract.
    - >-
      The three toy size parameters are not fixed by the parent proposal and must be declared
      numerically before approval, since the trend arm testing HEUR-SQISIGN-LEAK-1 is meaningless
      without them.
    - >-
      The reference dose at which the positive control must reject is not derived from any model. It
      is measured by the ladder, which is the honest choice, but the ladder's span must be declared
      before approval so that a null cannot be rescued by widening it afterwards.
