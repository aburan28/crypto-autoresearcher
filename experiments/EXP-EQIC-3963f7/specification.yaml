experiment:
  id: EXP-EQIC-3963f7
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-eeb226
  question_id: RQ-EQIC-8cb959
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE PHASE GRADING OF S_3, AND THE ONE STATISTIC IT MAKES TESTABLE: for a = 0 the summation
    polynomial splits into exactly three phase-graded pieces S_3 = A_0 + A_1 + A_2, so every decomposition
    over a phi-stable base carries a RELATIVE PHASE d = c_1 - c_2 in Z/3; test whether d is uniform,
    because non-uniformity is the only route by which phi-stability could change relation-collection
    cost at fixed factor-base size'
  status: draft
  objective: "(A) THE GRADING, EXACTLY. For E : y^2 = x^3 + b over F_p with p = 1 mod 3,\n  S_3(x1,x2,x3)\
    \ = x3^2 (x1-x2)^2 - 2 x3 ((x1+x2) x1 x2 + 2b)\n                  + (x1 x2)^2 - 4b (x1+x2).\n\
    Grade the monomials by their total degree in (x1, x2) modulo 3, with x3 fixed at the target value\
    \ x_R. The result has EXACTLY three graded pieces and no more:\n  A_2 = x_R^2 (x1 - x2)^2    \
    \                   [ (x1,x2)-degree 2 ]\n  A_0 = -2 x_R ((x1 + x2) x1 x2 + 2b)           [ degrees\
    \ 3 and 0 ]\n  A_1 = (x1 x2)^2 - 4 b (x1 + x2)               [ degrees 4 and 1 ]\nso S_3(x1,x2,x_R)\
    \ = A_0 + A_1 + A_2 with A_c homogeneous of (x1,x2)-degree congruent to c mod 3. This decomposition\
    \ exists IF AND ONLY IF a = 0: with a != 0 the terms -2a(x1+x2)x3, -2a x1 x2 and a^2 appear with\
    \ (x1,x2)-degrees 1, 2 and 0, which redistributes across the classes and destroys the clean three-term\
    \ form.\n(B) WHAT THE GRADING DOES AND, CRUCIALLY, DOES NOT DO. It does NOT split the solution\
    \ variety: S_3 = 0 requires the SUM to vanish, not each piece. Imposing A_0 = A_1 = A_2 = 0 is\
    \ strictly stronger and says that the SAME pair decomposes all three of R, phi(R), phi^2(R) simultaneously\
    \ -- a degenerate condition, generically empty, and this record does not pursue it. What the grading\
    \ DOES give is a phase bookkeeping. Substituting x1 = zeta^{c_1} v_i and x2 = zeta^{c_2} v_j for\
    \ orbit representatives v_i, v_j,\n  S_3(zeta^{c_1} v_i, zeta^{c_2} v_j, x_R)\n    = zeta^{c_2}\
    \ S_3(zeta^{d} v_i, v_j, zeta^{-c_2} x_R),  d = c_1 - c_2,\nusing the weight-1 semi-invariance\
    \ S_3(z x1, z x2, z x3) = z S_3(x1,x2,x3). So the nine phase pairs collapse to three RELATIVE\
    \ phases d in Z/3 times three choices of WHICH member of the target orbit {R, phi R, phi^2 R}\
    \ is being decomposed.\n(C) THE COST ACCOUNTING THAT KILLS THE NAIVE READING, STATED UP FRONT.\
    \ The collapse in (B) does NOT reduce the search. For a phi-stable base of cardinality 3m the\
    \ unordered-pair search space is (3m)^2/2 = 4.5 m^2, and the structured enumeration m^2 orbit-representative\
    \ pairs times 9 phase combinations divided by 2 is the same 4.5 m^2. Every phase combination must\
    \ still be tested, because the three overall-phase classes decompose three DIFFERENT targets.\
    \ There is no free factor of 3 in the search. The factor of 3 that does exist is in the UNKNOWN\
    \ COUNT (m instead of 3m), which is the classical automorphism quotient and is calibrated by IDEA-20260807-b42544,\
    \ not claimed here.\n(D) THE ONE REMAINING ROUTE, AND THIS IS THE PROPOSAL. If the relative phase\
    \ d of the decompositions that actually EXIST is not uniform on Z/3, then the search can be reordered\
    \ to test the favoured class first, and the expected number of S_3 evaluations per found relation\
    \ falls by the factor 1 / (3 * max_d Pr[d]). Under uniformity that factor is 1 (no saving); under\
    \ a maximally skewed distribution it is 3. THE CLAIM UNDER TEST: for a phi-stable factor base\
    \ on a j = 0 curve, the relative phase d = c_1 - c_2 of collected arity-2 decompositions is distributed\
    \ uniformly on Z/3, and any observed deviation is sampling noise. TWO OUTCOMES, BOTH DELIVERABLES:\n\
    \  OUTCOME U (uniform, and the pre-registered expectation). Then the\n  phi-stable base contributes\
    \ NOTHING to relation collection beyond the\n  unknown-count quotient, and this record supplies\
    \ the first measured, null-\n  controlled statement of that in this repository. It converts \"\
    phi-orbit\n  bases give a factor 3\" from an unattributed ratio into an exact\n  decomposition:\
    \ factor 3 in unknowns, factor 1 in search, phase uniform.\n  OUTCOME B (biased). Then S_3 restricted\
    \ to a mu_3-stable set has a\n  structural preference among phase classes on CM-by--3 curves.\
    \ That is a\n  statement about summation polynomials, not about bookkeeping, it is the\n  first\
    \ phi-specific effect in this lane that is not a construction\n  artifact, and it carries an immediate\
    \ (constant-factor) search-ordering\n  consequence plus a follow-on question about whether the\
    \ bias survives\n  arity growth.\n\n(E) WHY THE GRADING IS THE MECHANISM AND NOT DECORATION. A\
    \ bias in d, if it exists, must come from the algebra of the three graded pieces: writing x1 =\
    \ zeta^d v, x2 = w, the vanishing condition becomes\n  zeta^{2d} x_R^2 (v - zeta^{-d} w)^2 ...\
    \ more precisely,\n  A_2 contributes x_R^2 (zeta^d v - w)^2, whose vanishing locus depends on\
    \ d\n    through a translation of the ratio v/w by a cube root of unity;\n  A_0 contributes -2\
    \ x_R ((zeta^d v + w) zeta^d v w + 2b);\n  A_1 contributes (zeta^d v w)^2 - 4b(zeta^d v + w) =\
    \ zeta^{2d}(vw)^2\n    - 4b(zeta^d v + w).\nOnly A_1's leading term is phase-homogeneous; A_0\
    \ and A_2 mix phases. So the three phase classes correspond to three GENUINELY DIFFERENT plane\
    \ curves in (v, w), and there is no symmetry of the construction forcing them to carry equal numbers\
    \ of factor-base points. Uniformity is therefore a heuristic to be tested, not a theorem -- which\
    \ is exactly why the measurement is worth making and why the null must be run."
  resource_label: R1, R2
  admissibility: admissible
  admissibility_argument: 'R1: the tracked quantity is a statistic of the vanishing locus of a polynomial
    in x-coordinates viewed as FIELD ELEMENTS. A generic-group simulator has no access to S_3, to
    the graded pieces, or to the relative phase of a decomposition, so the measurement is not simulable
    in the sense of KN-FIND-b7e091. R2: the three-term grading and the semi-invariance hold IF AND
    ONLY IF a = 0, so the resource genuinely is the curve EQUATION. The proposal never applies phi
    to a point of G to gain information -- claim (C) states positively that the phase collapse yields
    no search saving -- so the admissibility filter of DECOMPOSITION.md section 2 is not triggered.'
  reachability_gate: 'NOT APPLICABLE TO THE DESIGN, BINDING ON THE SCOPE. No curve movement: every
    arm fixes one curve. T5 does not bind. T4 does: the mu_3-action requires D_0 = -3, which is a
    property of the isogeny class and cannot be reached by walking from a class that lacks it. A measured
    phase bias would therefore apply only to curves already known to be CM by -3, which no standardized
    curve in this program''s target set is.'
  inputs:
    procedure: 'CHEAPEST VALID DISCRIMINATOR, MINUTES: symbolically confirm the three-term grading
      and its failure at a != 0, and confirm A_2 vanishes identically on the diagonal at d = 0. Those
      are free and either could kill the framing. THEN, hours: on field_bits in {16, 20, 24} and seeds
      {1, 2, 3}, build a canonically labelled phi-stable base of cardinality 3m, collect at least
      300 certified arity-2 relations per instance with recorded phases, and run the chi-squared test
      on the off-diagonal marginal with the diagonal reported separately. Run the synthetic-phase
      null on a matched random base of the same cardinality, and the epsilon ladder at the largest
      affordable instance. Report raw counts.'
    mechanism: 'STEP 1 -- CANONICAL REPRESENTATIVES, DONE FIRST BECAUSE EVERYTHING DEPENDS ON IT.
      For each mu_3-orbit {x, zeta x, zeta^2 x} of on-curve x-coordinates, define the representative
      as the member with the least integer value in [0, p). This is canonical, cheap, and independent
      of the harness''s generation order (which the committed _build_phi_invariant_factor_base does
      NOT guarantee to be canonical: it appends in the order x, zeta x, zeta^2 x for whatever candidate
      x the seed produced). Recompute the phase of every base element against the canonical representative
      and record the relabelling.

      STEP 2 -- COLLECT WITH PHASES. Run the existing arity-2 decomposition search (harness/semaev.py::_find_decomposition,
      or the quadratic-root variant) on a stream of targets R_t = a_t P + b_t Q over a phi-stable
      base of cardinality 3m. For every found decomposition record (i, c_1, j, c_2, eps_1, eps_2)
      and hence d = (c_1 - c_2) mod 3. Certificate-verify each one independently.

      STEP 3 -- THE TEST. Pool over targets and instances; test the empirical distribution of d against
      uniform on Z/3 with a chi-squared goodness-of-fit at 2 degrees of freedom, pre-registering alpha
      = 0.01 and a minimum sample of 300 relations per instance so the test has power against a 10
      percentage point deviation. Report the raw counts, not only the p-value.

      STEP 4 -- STRATIFY, BECAUSE A POOLED BIAS CAN BE AN ARTIFACT OF ONE CELL. Report d-counts per
      instance, per target, and per (i, j) orbit pair. A bias that is present in every instance is
      structural; a bias driven by one orbit pair is a property of that pair''s geometry and must
      be reported as such.

      STEP 5 -- THE DIAGONAL CONTROL. The case i = j (both summands from the same orbit) is special:
      there A_2 = x_R^2 (zeta^{c_1} v - zeta^{c_2} v)^2 = x_R^2 v^2 (zeta^{c_1} - zeta^{c_2})^2, which
      VANISHES identically when d = 0. So d = 0 on the diagonal makes S_3 lose its leading term in
      x_R and the decomposition condition degenerates to A_0 + A_1 = 0, a different curve. The diagonal
      is therefore expected to be biased BY CONSTRUCTION and must be reported separately; a pooled
      bias driven entirely by the diagonal is not the effect this record is about, and separating
      them is the difference between a finding and an artifact.

      STEP 6 -- THE NULLS. Run STEP 2 and STEP 3 unchanged on the two null objects below and report
      all columns in one table.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - synthetic-phase null on a cardinality-matched random base (blocking)
  - synthetic-phase null on a generic (a != 0) curve at matched p
  - epsilon ladder {0, 1/3, 2/3, 1} at fixed cardinality
  - planted phase bias (one orbit member deleted at a fixed phase)
  - diagonal stratum reported separately from off-diagonal
  - independent certificate re-verification of every relation
  - canonical representative rule frozen and its relabelling recorded before collection
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. TWO NULLS PLUS A DECAY PARAMETER. NULL-1,
    THE SYNTHETIC-PHASE NULL. Take a uniformly drawn factor base of the SAME cardinality 3m on the
    SAME curve, partition it arbitrarily into m triples, and assign fake "phases" 0, 1, 2 within each
    triple. Collect decompositions and compute the fake d exactly as in STEP 2. This distribution
    MUST be uniform -- there is no group action producing it -- so a non-uniform reading here is an
    instrument defect (most likely in the representative rule or in the search''s enumeration order,
    which visits factor-base indices in a fixed sequence and can correlate with the triple labelling).
    This null is what makes OUTCOME B believable if it fires. NULL-2, THE a != 0 CURVE. On a curve
    with a != 0 there is no mu_3-action, so x -> zeta x maps the base off the curve and the statistic
    is undefined; the corresponding control is the synthetic-phase null above, run at matched p and
    N on a generic curve, to confirm the enumeration order contributes nothing. DECAY PARAMETER: epsilon,
    the fraction of orbits broken at fixed cardinality 3m (per IDEA-20260807-b42544). Any measured
    bias in d must decay monotonically toward the NULL-1 uniform value as epsilon goes 0 -> 1/3 ->
    2/3 -> 1, because at epsilon = 1 there are no orbits and no phases. A bias flat in epsilon is
    the canonical artifact tell and the record must report it as an artifact. THIRD CONTROL, THE PLANTED
    BIAS: artificially delete from the base one member of each orbit at a fixed phase; the measured
    d-distribution must shift in the predicted direction. An instrument that cannot see a planted
    bias cannot be trusted to report its absence.'
  independent_variables: []
  metrics:
    primary:
    - raw d-counts on Z/3, off-diagonal and diagonal, per instance
    - chi-squared statistic, degrees of freedom, p-value, sample size
    - per-(i,j)-orbit-pair d-counts for the stratification check
    - synthetic-null d-counts on the identical pipeline
    secondary:
    - epsilon ladder d-counts
    - S_3 evaluations per certified relation, naive and phase-ordered
    - sha256 of the canonically relabelled factor base per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: off-diagonal relative-phase distribution of certified arity-2 decompositions over a
      phi-stable base, chi-squared against uniform on Z/3
    formula: 'PRE-REGISTERED EXPECTATION IS UNIFORMITY: chi-squared p above 0.01 at every instance
      with at least 300 relations. OUTCOME B is declared only if p is below 0.01 at a MAJORITY of
      instances AND the maximum class probability exceeds 0.40 (a 7 percentage point excess over 1/3),
      so that a statistically significant but operationally useless deviation is not reported as a
      finding.'
    source: pre-registered in IDEA-20260807-eeb226 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - REPRESENTATIVE CONVENTION. d shifts by a constant per orbit under a change of representative.
    The committed _build_phi_invariant_factor_base appends orbits in generation order, which is NOT
    canonical. Freezing the least-integer rule is a hard precondition; failing to freeze it turns
    the statistic into a report on the seed.
  - ENUMERATION ORDER. harness/semaev.py::_find_decomposition scans V x V[i:] in list order and RETURNS
    THE FIRST HIT. If the base is laid out as consecutive orbit triples (which _build_phi_invariant_factor_base
    does), the first hit is systematically biased toward low indices and hence toward particular phases.
    The fix is to enumerate ALL decompositions per target, not the first, or to randomise the scan
    order with a recorded seed. THIS IS THE MOST LIKELY SOURCE OF A SPURIOUS BIAS and the synthetic-phase
    null is calibrated to catch it.
  - DIAGONAL CONTAMINATION. The i = j stratum is algebraically biased; pooling it with the off-diagonal
    manufactures a finding.
  - 'MULTIPLICITY. Testing many instances and reporting the significant ones is p-hacking. The decision
    rule is fixed in advance: a MAJORITY of instances must be significant AND the effect size must
    exceed the stated threshold.'
  - TARGET CORRELATION. Targets generated as consecutive multiples of P (as the committed _collect_relations
    does, with k a fixed arithmetic progression) are not independent. Targets must be drawn with independent
    random (a_t, b_t) and the change recorded.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'PRE-REGISTERED EXPECTATION IS UNIFORMITY: chi-squared p above 0.01 at every
    instance with at least 300 relations. OUTCOME B is declared only if p is below 0.01 at a MAJORITY
    of instances AND the maximum class probability exceeds 0.40 (a 7 percentage point excess over
    1/3), so that a statistically significant but operationally useless deviation is not reported
    as a finding.'
  falsification_criterion:
  - The three-term grading does not hold at a = 0, or does hold at a != 0. Claim (A) is wrong and
    the record is superseded.
  - A_2 does not vanish identically on the diagonal at d = 0. The diagonal stratification loses its
    algebraic justification and STEP 5 must be redesigned.
  - The synthetic-phase null is non-uniform. Instrument defect; nothing is reported about the real
    base.
  - A measured bias does not decay across the epsilon ladder. The bias is an artifact and may not
    be attributed to phi.
  - Fewer than 300 certified relations are collectable in budget at every instance. The test is underpowered;
    the cells are reported without a verdict, and this is a BUDGET outcome under AGENTS.md rule 5,
    not evidence of uniformity.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
