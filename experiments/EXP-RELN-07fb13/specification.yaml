      "curve_selection": "For each bit b, use the first eight primes p>=2^b. For each p and (A,B) in0..31 squared lex order, E:y^2=x^3+A*x+B. Reject singular, j0/1728, supersingular (p divides trace), and anomalous #E=p. Require prime N=#E with2^(b-1)<=N<2^(b+1). Choose first three distinct j-invariants in this finite ordered pool. No rank/cost eligibility filter. Choose lex-first nonzero point P and verify [N]P=O by independent arithmetic. Exhausting pool is ineligible/inconclusive, never parameter replacement.",
      "base": "Set U=ceil(sqrt(N)). Enumerate affine points in x then y order, retaining first U negation-pair representatives, the lesser of Q and-Q. B contains both signs of every representative, exactly2U points, sorted by representative index then sign. The same B and U negation-quotient columns are used by every policy. Record point search and all construction costs; no discrete-log labels are provided to collectors.",
      "relation": "Given sampled signed pair Q1,Q2 in B, compute Q3=-(Q1+Q2). If Q3 in B emit row=sum of its three signed representative unit vectors over F_N; otherwise record a failed attempt. Repetitions count literally; combine equal column coefficients. Independently verify each point identity and every rank pivot. Every row annihilates the unknown nonzero base-log vector, so target is U-1; never replace it by observed lower rank.",
      "truth_boundary": "Fresh collector process per policy/seed receives only public curve/P/base/seed/policy, not calibration logs, unseen rows, support-rank audit or another policy transcript. Checker-only exhaustive support audit and any truth table remain outside collector input. Replay is measurement verification only, never an oracle used for selection.",
      "randomness": "Use SHA256 of UTF8 RELN|bits|curve_index|seed|arm|counter, with counter incremented on every 32-byte block. Rejection-sample integers in required ranges for unbiased choices; separate selector stream has arm=selector. All byte encodings and attempted draws are recorded. No library-global RNG. Baseline/candidate execution order is hash-sorted by seed and policy, sequential fresh processes."
    },
    "methods": {
      "arms": "A0 samples both representative indices uniformly0..U-1 and independent signs. A1 with probability3/4 samples uniformly from ordered index pairs in the same partition half, otherwise samples A0. A2 similarly favors opposite halves. A3 similarly favors cyclic index distance min(|i-j|,U-|i-j|)<=floor(U/8). Halves are [0,floor(U/2)) and its complement. Category pairs are selected by uniform index rejection with all rejected draws charged; signs stay independent uniform. Nonempty categories are verified before execution. No point sum, relation or rank is evaluated to choose a pair.",
      "feedback": "Partition attempts into blocks of64. First32 in each block cycle arms0,1,2,3 eight times (50% forced exploration). Remaining32 choose the arm with maximum fixed score, tie lowest arm index; recompute score only at block boundary and when rank enters a new quarter bin floor(4*rank/U), capped3. Maintain in each rank bin each arm n attempts, g independent rows, cumulative charged operation cost c; unsuccessful attempts have gain0. Score is Wilson lower-bound numerator divided by mean cost c/n: L=(g/n+z^2/(2n)-z*sqrt((g/n)*(1-g/n)/n+z^2/(4n^2)))/(1+z^2/n), z=1.645; n=0 gives score0. Use exact algebraic interval comparisons/refine until order resolved, ties smallest index. Wilson is a frozen heuristic score for nonstationary feedback, not a coverage-valid confidence bound on adaptive observations.",
      "comparators": "Four fixed-arm policies and the uniform mixture (uniform independent arm choice each attempt) use exactly the same relation generation, verification, RREF update and stop rule. A one-arm feedback menu reproduces fixed policy after disabling selector bookkeeping, whose actual overhead remains separately charged in normal comparison. Frozen equal scores with selector configured uniform reproduce the uniform-mixture stream.",
      "finite_stop": "Every policy stops on informative rank U-1. If not reached after4N stochastic attempts, enter identical lexicographic complete signed pair scan over B^2, stopping when rank U-1. If scan exhausts with smaller rank, store exact complete row-span certificate and label structural_target_unattainable. This is a source-relevant prerequisite failure; no stopped-cost success or silent lower-rank target. The independent checker enumerates full support after collectors finish, never before, and audits any unattainability certificate. Fallback is part of every policy and fully charged.",
      "cost_metric": "Primary C is deterministic total charged scalar work: number of base-field or rank-field additions/subtractions/multiplications, integer quotient/remainder operations inside extended-Euclid inversion, point equality coordinate comparisons, array/hash-table key comparisons and64 SHA256 compression rounds per processed block. Count random rejection, point verification, modular elimination, selector score arithmetic, reconstruction and certificate verification. Square-root/score comparisons use exact rational interval arithmetic and all primitive integer operations are counted. Setup includes base/index construction and arm initialization. Curve-fixture generation and full-support checker work are common verification/setup costs, reported separately and added equally to each policy cost; no free cost exclusion in headline threshold. Also report component vector, CPU/wall, RSS and bytes, without treating weighted primitive-work units as hardware-independent time.",
      "ci": "At each of9 curves, use30 paired seeds and five differences D_j=C_feedback-0.8*C_comparator_j. Report mean differences and one-sided Student-t upper/lower intervals at alpha=0.05/45 (45 curve/comparator comparisons),29 degrees of freedom. This is a preregistered approximate mean CI with iid-seed/finite-variance assumptions; no exact coverage theorem is claimed. Also report a fixed10000 paired seed-resample percentile bootstrap using SHA256 seed2026090999, full distribution, max, worst three seeds and fallback frequency. Contradictory t/bootstrap sign or any censored seed makes threshold inference inconclusive. Do not pool curves or select the best fixed arm after seeing a gain; feedback must beat all four and mixture.",
      "rank_drift": "For each arm and rank bin report independent-row count/attempt and gain/charged cost with all zeros. In final rank bin require at least one pre-fallback independent row per curve across seeds and report exact counts; absence falsifies the preregistered empirical near-saturation condition, not a universal zero-drift theorem. H1 persistent >=25% relative gain/cost variation is measured as max/min nonzero empirical arm rates in each populated bin; denominator0 explicitly infinite/undefined, never evidence by itself.",
      "reconstruction": "Retain original verified row and exact RREF combination coefficients for each accepted row. Quotient projection maps F_N^U onto dimension U-r at rank r, with N^r preimages per unrestricted residual (loss r*log2 N); actual generated finite-row collisions reported separately. Reconstruction witnesses retain discarded span coordinates; no lossy full-translation group quotient is claimed. At target rank certify kernel dimension1 and relation identities; no target ECDLP recovery is inferred.",
      "calibration": "At p127 use first eligible prime-order nonanomalous curve from A,B0..31, same base/arms. Exhaust all signed pairs and cross-check with all B^3 tuples; every generated accepted row must appear and no valid tuple-induced row may be missed by pair enumeration. Calibration seeds1901,1902 are separate, charged and never tune the frozen policy."
