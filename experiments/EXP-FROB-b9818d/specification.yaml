# =============================================================================
# EXP-FROB-b9818d — version 1, approved by DEC-20261006-0df3f3. Frozen
# hit-rate cell for IDEA-20261006-7300c0. Success is the idea's
# prediction: both the orbit-over-random ratio and the null ratio lie
# in the closed interval [1/2, 2], with every hit count at least 1.
# The concrete negative is that both object hit counts are at least 1
# and the object ratio lies strictly outside [1/2, 2], while the null
# ratio lies inside the interval. This design session did not score a
# hit and did not record a trace. No discrete logarithm is authorized.
# Source idea bytes are copied unchanged from
# origin/design/hyper-79cb0a-prym, blob
# 43db777291b1ebd0bba6757b18ca67935cb38371.
# =============================================================================
experiment:
  id: EXP-FROB-b9818d
  hypothesis_id: H-FROB-387988
  question_id: RQ-FROB-7d8dd4
  source_idea: IDEA-20261006-7300c0
  version: 1
  title: >-
    Size-matched S_3 hit rates for one Frobenius orbit versus a
    random 5-set on an ordinary curve over F_{3^5}
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261006-0df3f3
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null.
      Approval does not assert that the ratio lies in [1/2, 2], does
      not assert that an ordinary curve exists in this family, and
      does not assert that an exponent moves.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Work only at q = 3 and n = 5. Use
      F_{3^5} = F_3[a]/(a^5 + 2 a + 1). Search every short-Weierstrass
      pair (A, B) over F_3. Score one size-5 orbit, one seeded random
      5-set, and 40 targets on the object, then two seeded random
      5-sets and 40 targets on the null. Re-add every hit. Do not
      build a Macaulay matrix and do not search for a discrete
      logarithm.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether rho(B_orbit)/rho(B_rand) and the null ratio of two
    random 5-sets both lie in the closed interval [1/2, 2]. The
    concrete negative is that both object hit counts are at least 1
    and the object ratio lies strictly outside [1/2, 2], while the
    null ratio lies inside the interval. No faster index-calculus
    algorithm is in scope.

  inputs:
    field: >-
      F_3 = {0, 1, 2}. F_{3^5} = F_3[a]/(a^5 + 2 a + 1). Write each
      extension element as c0 + c1 a + c2 a^2 + c3 a^3 + c4 a^4 with
      coefficients in {0, 1, 2}. Lexicographic order is dictionary
      order on (c0, c1, c2, c3, c4). Reconfirm that a^5 + 2 a + 1
      has no root in F_3 and no quadratic factor over F_3. A factor
      is instrument_failure. Do not replace the polynomial after
      seeing a hit.
    curve_model: >-
      y^2 = x^3 + A x + B. Over F_3 the partial derivative in x is
      A, because 3 x^2 = 0, and the partial in y is 2 y. A curve
      with A = 0 has a singular point and is skipped. A curve with
      A not 0 is treated as nonsingular.
    ordinary_test: >-
      Enumerate E(F_3), including the point at infinity. Let t = 4
      minus that count. The curve is ordinary only when 3 does not
      divide t. Supersingular curves are skipped.
    object_search: >-
      Visit (A, B) with A from 0 to 2 and, for each A, B from 0 to 2.
      Skip A = 0. Skip curves whose trace is divisible by 3. For the
      first remaining curve, compute E(F_{3^5}) by enumeration and
      factor its order. Let r be the largest prime factor of that
      order that does not divide the order of E(F_3). Require
      r >= 41. Take G to be the unique subgroup of order r. If this
      curve fails the subgroup test, continue to the next (A, B).
      If none qualify, the reading is unmeasured_no_ordinary_curve
      and the null is not built.
    generator: >-
      The generator of G is the lexicographically least affine point
      of order r, comparing x-tuples and breaking ties by the
      smaller y-tuple. No random generator is used.
    orbit_base: >-
      The 3-power Frobenius is (x, y) -> (x^3, y^3). Walk scalars
      1, 2, 3, ... of the generator. Discard an orbit whose size is
      not 5. Among orbits of size 5, choose the one whose
      lexicographically least x-coordinate is smallest. If no
      size-5 orbit exists, the reading is unmeasured_no_free_orbit.
    random_base: >-
      Draw from the linear congruential generator
      state -> (1103515245 * state + 12345) mod 2^31, starting at
      state 20261006. Each draw uses the next state modulo r, and a
      0 is discarded. Collect five distinct points of G. If those
      five points are a single Frobenius orbit, discard them and
      continue. Record the five scalars. The base must have
      cardinality 5.
    targets: >-
      After both object bases are frozen, continue the same
      generator and collect 40 distinct points of G. Do not look at
      a sum while collecting them. The denominator is 40.
    hit_rule: >-
      A target T is a hit for a base B when T = P + Q for some
      ordered pair (P, Q) in B x B, including pairs with P = Q.
      The sum uses the characteristic-3 group law below. rho is the
      hit count divided by 40. The ratio of two counts h1/h2 lies
      in the closed interval [1/2, 2] exactly when h2 <= 2 h1 and
      h1 <= 2 h2. It lies strictly outside when h1 > 2 h2 or
      h2 > 2 h1. A zero count makes the ratio undefined.
    group_law: >-
      Affine characteristic-3 addition on y^2 = x^3 + A x + B.
      The point at infinity is the identity. The negative of
      (x, y) is (x, -y). If the two points are distinct and not
      negatives, lambda = (y2 - y1) / (x2 - x1),
      x3 = lambda^2 - x1 - x2, y3 = lambda (x1 - x3) - y1.
      If the points are equal and y is not 0, lambda = A * (2 y)^{-1},
      and x3 = lambda^2 - 2 x, with that subtraction performed in
      the field. If y = 0, the double is the identity.
    second_addition: >-
      Every hit is recomputed by a second function that uses
      Jacobian coordinates (X : Y : Z) for the affine point
      (X/Z^2, Y/Z^3), with the same characteristic-3 slope, and
      that does not call the affine function. Disagreement on any
      hit is instrument_failure and voids the cell.
    null_curve: >-
      For this model set c4 = 0 and Delta = -A^3. When Delta is not
      0, set j = 0. The null curve is the lexicographically first
      pair (A, B) of elements of F_{3^5} such that not both lie in
      F_3, Delta is not 0, the trace of Frobenius on E(F_{3^5}) is
      not divisible by 3, j does not lie in F_3, and the group has
      a prime factor r >= 41. If no pair passes, and the object was
      found, the reading is unmeasured_no_null. If the object was
      not found, the null is not searched. When a null exists, draw
      two 5-sets from seeds 20261007 and 20261008 with the same
      generator, rejecting a draw that is a single Frobenius orbit,
      then draw 40 targets by continuing the second seed's generator.

  controls:
    - id: second-addition
      statement: >-
        Every reported hit agrees under the Jacobian recomputation.
        One disagreement voids the cell and is not a hit rate.
    - id: null-ratio
      statement: >-
        The null curve's ratio of two random 5-sets is reported
        whenever the null exists. A null ratio strictly outside
        [1/2, 2], with both null counts at least 1, means the
        object ratio is not interpreted.
    - id: cardinality
      statement: >-
        The orbit base has cardinality 5 and the random base has
        cardinality 5. Any other cardinality voids the cell.
    - id: order-of-freezing
      statement: >-
        Both bases are frozen before the 40 targets, and the targets
        are frozen before any hit bit is computed. A hit bit used
        to choose a target voids the cell.

  independent_variables:
    - which base is scored, the orbit or a random 5-set
    - whether the curve is the object or the null
    - the target index from 1 to 40
    - whether the addition is the affine function or the Jacobian recomputation

  metrics:
    primary:
      - id: object_ratio
        statement: >-
          h_orbit / h_rand, as a ratio of two hit counts with
          denominator 40. The idea's prediction is the closed
          interval [1/2, 2]. A ratio strictly outside that interval,
          with both counts at least 1 and the null ratio inside the
          interval, is the concrete negative.
      - id: null_ratio
        statement: >-
          h_null_1 / h_null_2. The idea's prediction is the same
          closed interval. A null ratio strictly outside the
          interval blocks interpretation of the object ratio.
    secondary:
      - id: hit_counts
        statement: the four integers h_orbit, h_rand, h_null_1, h_null_2
      - id: curve_coefficients
        statement: the object (A, B) and the null (A, B), or the unmeasured reason
      - id: second_addition_failures
        statement: the number of hits that fail the Jacobian recomputation, required to be 0 on every interpreted row
      - id: orbit_size
        statement: the cardinality of the orbit base, required to be 5

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 says the two object hit rates differ by at most a factor
    of 2, and the two null rates do too. The row yield_gap is the
    negative for that band on this cell. It is not a refutation of
    Gaudry's exponent. Do not relabel an instrument failure or an
    unmeasured search as that negative. A zero hit count is
    inconclusive_zero_rate, not a confirmation of the interval.

  preregistered_prediction:
    quantity: >-
      The pair of ratios (h_orbit/h_rand, h_null_1/h_null_2) at
      q = 3, n = 5, base size 5, and 40 targets, together with the
      four hit counts.
    formula: >-
      Both ratios lie in the closed interval [1/2, 2], and every
      hit count is at least 1. Integer form: h_rand <= 2 h_orbit,
      h_orbit <= 2 h_rand, h_null_2 <= 2 h_null_1, and
      h_null_1 <= 2 h_null_2, with all four counts at least 1.
      The concrete negative is h_orbit > 2 h_rand or
      h_rand > 2 h_orbit, with both object counts at least 1 and
      the null counts satisfying the same closed band. A ratio
      equal to 5 is outside the band. A count of 0 is not a
      confirmation. Source idea IDEA-20261006-7300c0. No hit was
      scored before this formula was frozen.
    source: >-
      IDEA-20261006-7300c0, whose prediction is the closed interval
      [1/2, 2] for both ratios. KR-IC-b0fcda, KR-IC-5a43e5,
      KR-IC-46d822, KR-IC-f5c584, and KR-RHO-037e22 were opened in
      this session and do not state this ratio.

  scale_relevance:
    tier: toy
    justification: >-
      The only field is F_{3^5}, which has 243 elements. No transfer
      to n = 131 or to a binary field is assumed. The sample is the
      40 frozen targets, not a tail draw from a Dickman law. The
      minimum effect is the idea's own band [1/2, 2].
    correspondence: >-
      Direct enumeration of the group and direct addition of ordered
      pairs. No Deuring correspondence and no summation-polynomial
      solver is used.

  tail_checks:
    - >-
      A hit count of 0 is kept as 0. It is not replaced by a
      pseudocount, and the ratio is not declared to lie in the band.
    - >-
      A ratio equal to 5, the orbit length, is strictly outside
      [1/2, 2] and counts toward the negative when the other
      conditions of yield_gap hold.

  replication:
    seeds:
      - EXP-FROB-b9818d|object-lcg-20261006
      - EXP-FROB-b9818d|null-lcg-20261007
      - EXP-FROB-b9818d|null-lcg-20261008
    independent_instances: 1
    note: >-
      One is the number of object curves scored. The seeds name the
      frozen generators. The group-law enumeration is deterministic
      given those seeds.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One run manifest covers the curve search, both bases, the 40
      targets, the null arm, and the Jacobian recomputation.
      Wall-clock and CPU figures are advisory and null. The 2 GB
      memory figure is machine protection for the point list of
      E(F_{3^5}). A watchdog expiry is failed_infrastructure, not a
      ratio.

  stopping_rules:
    - Stop after a reading row is named, or after every (A, B) pair over F_3 has been classified and none qualifies.
    - Do not drop a target whose 25 sums were computed.
    - Do not widen the band [1/2, 2] after seeing a count.
    - A timeout voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - A Jacobian disagreement on a hit voids the run.
    - An orbit or a random base whose cardinality is not 5 voids the run.
    - Using a hit bit to choose a target voids the run.
    - a^5 + 2 a + 1 being reducible over F_3 voids the run.
    - Replacing a zero count by a pseudocount voids the run.
    - Scoring a supersingular curve as the object voids the run.
    - Interpreting the object ratio when the null ratio is strictly outside the band voids the run.

  success_criterion: >-
    The instrument checks pass, all four hit counts are at least 1,
    and both ratios lie in the closed interval [1/2, 2]. This is the
    prediction of IDEA-20261006-7300c0. It is reachable as a failure
    when both object hit counts are at least 1 and the object ratio
    lies strictly outside [1/2, 2] while the null ratio lies inside
    the interval.

  falsification_criterion: >-
    The instrument checks pass, both object hit counts are at least
    1, the object ratio lies strictly outside [1/2, 2], and the null
    ratio lies inside [1/2, 2]. That is the concrete negative named
    with the source idea: cardinality matching did not remove the
    yield gap. A ratio equal to 1/2 or equal to 2 is inside the
    predicted closed interval and is not this negative. A zero count,
    a missing ordinary curve, a noisy null, and a timeout are not
    this negative.

  required_artifacts:
    - experiments/EXP-FROB-b9818d/runs/RUN-*/manifest.yaml
    - experiments/EXP-FROB-b9818d/runs/RUN-*/stdout.txt
    - experiments/EXP-FROB-b9818d/runs/RUN-*/stderr.txt
    - experiments/EXP-FROB-b9818d/runs/RUN-*/hits.csv
    - experiments/EXP-FROB-b9818d/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: instrument_failure
      when: >-
        the field polynomial is reducible, a Jacobian recomputation
        disagrees, a base cardinality is not 5, a hit bit was used
        to choose a target, a zero count was replaced, a
        supersingular curve was scored as the object, or the object
        ratio was interpreted while the null ratio was strictly
        outside the band
    - id: unmeasured_no_ordinary_curve
      when: >-
        every (A, B) in F_3 is singular or has trace divisible by 3,
        or no ordinary curve has a prime-order subgroup of order at
        least 41 outside E(F_3), or no size-5 orbit exists
    - id: unmeasured_no_null
      when: >-
        the object exists and no null pair passes the frozen null
        test
    - id: inconclusive_zero_rate
      when: >-
        the instrument checks pass, both curves exist, and at least
        one of the four hit counts is 0
    - id: null_instrument_noisy
      when: >-
        the instrument checks pass, both null counts are at least 1,
        and the null ratio lies strictly outside [1/2, 2]
    - id: yield_gap
      when: >-
        the instrument checks pass, both object counts are at least
        1, the object ratio lies strictly outside [1/2, 2], and the
        null ratio lies inside [1/2, 2]
    - id: ratio_in_band
      when: >-
        the instrument checks pass, all four hit counts are at least
        1, and both ratios lie in the closed interval [1/2, 2]
  reading_rule: >-
    Name exactly one row, the first whose condition holds in the
    order listed. ratio_in_band is the only success row. yield_gap
    is the concrete negative. inconclusive_zero_rate does not
    confirm the interval. null_instrument_noisy does not interpret
    the object ratio. unmeasured_no_ordinary_curve and
    unmeasured_no_null are not ratios. instrument_failure is not a
    ratio. Record the four hit counts, both ratios or the reason a
    ratio is undefined, the curve coefficients, the orbit size, and
    attack_claimed false beside the row. Those fields do not change
    the row.
