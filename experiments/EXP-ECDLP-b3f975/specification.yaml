experiment:
  id: EXP-ECDLP-b3f975
  hypothesis_id: H-ECDLP-e54f8c
  version: 1
  title: >
    Exact Gaussian-integer box-membership
    calibrator on three frozen (p, R, x)
    triples
  status: approved
  approved_by: coordinator
  approved_at: '2026-09-08'
  approval_decision: DEC-20260908-de0c09
  approval_basis: >
    Standing user authorization recorded in AGENTS.md on
    2026-09-06 (ideas and experiments always approved once
    the protocol is complete). Coordinator completeness
    check is DEC-20260908-de0c09 after TASK-20260908-994d0c.
    User confirmation is not an outstanding gate.
  frozen: true
  frozen_at: '2026-09-08'
  execution_authorized: true
  execution_authorized_note: >
    Stage 0 only. Stages 1 and later remain unauthorized
    until an independent review of the Stage 0 instrument
    holds and a later Coordinator decision extends
    execution_authorized_stages. This approval does not
    authorize Stage 1 of EXP-ECDLP-daf1bb, does not
    authorize Stage 1 of EXP-ECDLP-0d1336, does not
    authorize Stage 1 of EXP-ECDLP-1aa0f8, does not
    authorize Stage 1 of EXP-ECDLP-79f8c4, does not
    authorize Stage 1 of EXP-ECDLP-628891, does not
    authorize Stage 1 of EXP-ECDLP-9e9536, does not
    authorize Stage 1 of EXP-ECDLP-90f602, does not
    authorize Stage 2 of EXP-ECDLP-4be480, does not
    authorize Stage 2 of EXP-ECDLP-6a97f4, does not
    authorize Stage 17 of EXP-ECDLP-420e73, does not
    authorize Stage 5 of EXP-ECDLP-a98ea9, does not
    classify W, and does not change H-ECDLP-a69bea,
    H-ECDLP-38f4b4, H-ECDLP-a23318, H-ECDLP-536b21,
    H-ECDLP-3f68f6, H-ECDLP-b51c3d, H-ECDLP-4afa77,
    H-ECDLP-2ac931, H-ECDLP-e9d9bb, H-ECDLP-77caa5,
    H-ECDLP-07c7c6, H-ECDLP-2ade73, or H-ECDLP-a3598b.
  execution_authorized_stages: [0]
  execution_authorized_decision: DEC-20260908-de0c09
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260908-994d0c
  source_proposal: IDEA-20260905-ab4a6e
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-de0c09 under the standing 2026-09-06
    user authorization. Stage 0 is the exact box
    membership calibrator. Factor-base census,
    relation yield, Groebner cost, C(p), and a
    CM-curve hunt are a later stage and are not
    run here.

  objective: >
    Compute brute-force Gaussian-integer
    box membership on one frozen family
    (REAL, KF, NULL) and decide whether
    the enumerative membership calibrator
    works. Stage 0 does not construct
    F_box on a curve, does not run a
    relation, and does not authorize
    Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL interval-slice
      residue is in the box; KF residue is
      outside the box; NULL non-split p is
      rejected; zero p and negative R
      rejected. Certificate kind none.
    formula: >
      D = -4. x is in the box iff p = 1
      mod 4, T^2+1 has a root r in F_p,
      and some |u|,|v| <= R satisfy
      u + r v ≡ x (mod p). REAL is p=13
      R=1 x=1. KF is p=13 R=1 x=2. NULL
      is p=7. FORCED Stage 0:
      fixture_pass, real_box_pass,
      known_false_out_pass, reject_invalid_pass,
      null_nonsplit_pass all true.
    source: >
      ledger/proposals/IDEA-20260905-ab4a6e.yaml
      proof_search_map.baseline_embedding and
      method_ceiling.nearby_object_control.
      Provenance internal; read in this design session.

  design_tightening_stage0_is_instrument_not_fbase: >
    IDEA-20260905-ab4a6e also flags a box
    factor base, relation yield, Groebner
    cost, C(p), and a CM-versus-generic
    curve hunt. Stage 0 does not construct
    F_box on a curve, does not enumerate
    points, and does not claim a factor-base
    advantage. The census and the four
    later arms are Stage 1+ objects.
    Membership arithmetic is the only
    Stage 0 arm. This is a disclosed
    tightening, not a silent change of
    the idea's claim.

  inputs:
    fixture:
      discriminant: -4
      real:
        id: REAL
        p: 13
        R: 1
        x: 1
        u: 1
        v: 0
        must_in_box: true
        role: real_interval_slice
      known_false:
        id: KF
        p: 13
        R: 1
        x: 2
        must_in_box: false
        role: known_false_out_of_box
      matched_null:
        id: NULL
        p: 7
        must_reject: true
        role: matched_null_nonsplit
      invalid:
        - id: P-zero
          p: 0
          must_reject: true
        - id: R-negative
          R: -1
          must_reject: true
      working_model: >
        Exact Gauss reduction membership
        for the D = -4 box on frozen
        triples. Not a factor base. Not a
        relation vector. Not a Groebner
        census. Not a CM-curve hunt.
      do_not_hunt_a_new_curve: true

  independent_variables:
    - object in the frozen family
    - whether p splits in Z[i]
    - whether x lies in the (2R+1)^2 image

  null_object:
    name: KF out-of-box residue p=13 R=1 x=2
    construction: >
      p splits and R=1. Residue 2 is not
      in the nine-element image. This is
      the known-false object for a
      "every F_p residue is a box member"
      reading.
    non_degeneracy_check: >
      known_false_out_pass must be true
      before any REAL membership is read
      as a measurement.
    dynamic_range_demonstration: >
      P-zero and R-negative must be
      rejected before membership is read
      as a census.

  controls:
    - KF residue outside the box (known-false / proves-too-much)
    - REAL interval-slice residue in the box
    - NULL non-split rejection
    - zero p and negative R rejection
    - exact discrete enumeration, no sampling
    - triples frozen before any membership is read

  metrics:
    primary:
      - fixture_pass boolean
      - real_box_pass boolean
      - known_false_out_pass boolean
      - reject_invalid_pass boolean
      - null_nonsplit_pass boolean
    secondary:
      - REAL root of T^2+1
      - KF image miss
      - NULL split status
      - wall-clock seconds and peak RSS

  heuristic_under_test: none

  scale_relevance:
    tier: toy
    justification: >
      Three frozen integer triples at D = -4.
      No transfer to a curve factor base,
      relation yield, Groebner cost, or
      cryptographic n.
    correspondence: null

  tail_checks:
    - REAL is the frozen triple p=13 R=1 x=1
    - KF is the frozen triple p=13 R=1 x=2
    - NULL is the frozen prime p=7
    - P-zero and R-negative are rejected

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 0 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: fixture_pass,
      real_box_pass, known_false_out_pass,
      reject_invalid_pass, and
      null_nonsplit_pass. A miss classifies
      the run failed_infrastructure if it is
      a size or encoding bug, otherwise it
      is a scoped falsification of P-S0-BOX.
    - Stages 1 and later are not authorized.
    - Do not hunt a new curve.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 0 is not in execution_authorized_stages
    - Changing the three triples after this freeze
    - Hunting a new curve because a frozen cell fails
    - Reading Stage 0 as a factor base, relation vector, Groebner census, or a decoder
    - Reading Stage 0 as an ECDLP advantage
    - Authorizing Stage 1 of EXP-ECDLP-daf1bb from this contract
    - Authorizing Stage 1 of EXP-ECDLP-0d1336 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-1aa0f8 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-79f8c4 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-628891 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-9e9536 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-90f602 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-4be480 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-6a97f4 from this contract
    - Authorizing Stage 17 of EXP-ECDLP-420e73 from this contract
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this contract
    - Editing EXP-ECDLP-a5f766 or H-ECDLP-a3598b
    - Changing H-ECDLP-a69bea, H-ECDLP-38f4b4, H-ECDLP-a23318, H-ECDLP-536b21, H-ECDLP-3f68f6, H-ECDLP-b51c3d, H-ECDLP-4afa77, H-ECDLP-2ac931, H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6, or H-ECDLP-2ade73

  success_criterion: >
    Stage 0 succeeds as a measurement when
    fixture_pass, real_box_pass,
    known_false_out_pass,
    reject_invalid_pass, and
    null_nonsplit_pass are true, and the
    run manifest carries certificate.kind
    none. Success is instrument
    reproduction, not a factor-base claim
    and not an attack.

  falsification_criterion: >
    A certified KF miss of out-of-box
    after fixture_pass is a scoped miss
    of P-S0-BOX. A certified REAL out-of-box
    after fixture_pass is a scoped miss of
    P-S0-BOX. Infrastructure bugs are not
    mathematics. Stage 0 does not test
    P-S1-FBASE.

  required_artifacts:
    - Stage 0 raw-result.json with the five gates
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt

  assigned_to: executor

  limitations:
    - Three frozen toy integer triples at D = -4.
    - Not a factor base. Not a relation vector.
    - Not a Groebner census. Not a CM-curve hunt.
    - No decoder. No cryptographic transfer.
    - No Stage 1 of daf1bb. No Stage 1 of 0d1336.
      No Stage 1 of 1aa0f8. No Stage 1 of 79f8c4.
      No Stage 1 of 628891. No Stage 1 of 9e9536.
      No Stage 1 of 90f602. No Stage 2 of 4be480.
      No Stage 2 of 6a97f4. No Stage 17 of 420e73.
      No Stage 5 of a98ea9.
    - Certificate kind none. No solve or attack.
    - W is not classified.
    - EXP-ECDLP-a5f766 remains another lane.
    - Do not hunt a new curve.
