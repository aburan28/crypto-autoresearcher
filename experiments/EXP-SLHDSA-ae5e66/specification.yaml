experiment:
  id: EXP-SLHDSA-ae5e66
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-4f67d5; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-4f67d5
  question_id: RQ-SLHDSA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Compute the exact upward closure of transcript-revealed Merkle node sets as a curve in signature
    count, against uniform-random and contiguous-subtree nulls at exactly matched revealed cardinality,
    swept for a crossover height
  objective: 'The one uncertainty a run reduces is whether the arrangement of the nodes a transcript
    reveals matters, or whether only their number does. Concretely: (i) how the upward closure of
    the revealed set grows with signature count at each enumerable height, measured exactly by fixed-point
    iteration with no hash, no probability and no sampling in the closure itself; (ii) whether that
    closure is larger than the closure of the same number of uniformly random node positions, which
    is the comparison that separates arrangement from quantity and which requires the null''s cardinality
    to be matched to the signal arm''s measured revealed count rather than to a computed one, since
    paths overlap; (iii) whether any advantage that exists is attributable to path structure specifically
    or merely to locality, which the contiguous-subtree null is built to separate, and at what height,
    if any, the signal and null curves become indistinguishable. A run reduces (i) to exact curves,
    (ii) to a difference with the null''s spread attached, and (iii) to a three-way comparison and
    a crossover height or an explicit statement that none occurs within the enumerable range. Coincidence
    of the curves is a complete outcome and is recorded as a measured obstruction with its resolution.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'At most, a completed run supports: at the tested heights and
      signature counts, the exact size of the upward closure of the transcript-revealed node set,
      the exact closure sizes of the two nulls at matched revealed cardinality, the one-away leaf
      counts, the root-known indicators, and the crossover height or its absence within the enumerable
      range. WHAT DOES NOT FOLLOW: nothing about any FIPS 205 parameter set or any deployed hypertree
      geometry; no security level, no attack, no forgery, no key recovery; nothing about secrets at
      all, since every node in this object is a public hash value and the closure never touches a
      secret; no statement about SHA-2 or SHAKE, since no hash is evaluated in the closure; no statement
      about what the literature contains; and nothing about the fault or memory-corruption claim class.
      A large closure is not a weakness and a small one is not a margin; both are combinatorial facts
      about a revelation pattern.'
  inputs:
    procedure: 'STAGE 0, freeze (zero compute): fix the closure rule and its asymmetry, the height
      and q grids, the cardinality-matching procedure, and the two null constructions, before any
      code runs. STAGE 1, closure (~2h human): fixed-point iteration over a bit array indexed by node
      position, with the singleton and single-signature gates written as tests first. STAGE 2, gates
      (~5min compute): singleton null must close to one node; signal arm must reach the root after
      one signature; |K| must be monotone in q. STAGE 3, signal arm (~30min compute): q on a logarithmic
      grid per height, uniform leaf selection, three seeds, recording measured revealed cardinality
      per draw. STAGE 4, nulls (~30min compute): uniform-random and contiguous-subtree arms drawn
      to exactly the measured cardinality of the matching signal draw, identical closure, same invocation,
      same seeds. STAGE 5, height sweep (~2h compute): h from 8 to 22, locating the crossover or establishing
      its absence. STAGE 6, leaf-source check (~30min compute): signal arm repeated with concrete
      truncated-hash leaf selection. STAGE 7, report (zero compute): three curves per height with
      spreads, one-away counts, saturation q markers, and the crossover finding.'
    instrument: 'Python 3.11 with numpy for the node bit array and the vectorized fixed-point closure,
      and for the band and spread arithmetic. random.Random for uniform leaf selection, uniform node
      selection and contiguous-subtree selection; hashlib for the truncated concrete leaf-selection
      arm only. No hash is evaluated inside the closure itself, which is a design property: the object
      is combinatorial and its result must be independent of any hash function. New single-file module
      under harness/ following the convention of harness/toycurve.py, executed through harness/runner.py
      so that seeds, parameters and the resolved inference block land in the run manifest. No Sage,
      no external cryptographic library, no network.'
    parameters: 'Tree height h from 8 to 22 inclusive, stepping by 2, with h up to 26 attempted only
      for the |K| curve and not for the full sweep. Signature count q on a logarithmic grid from 1
      to 2^{h-3} per height, capped at 4096, with the saturation q marked per height. Arms: signal
      (uniform leaf selection), signal (concrete truncated-hash leaf selection), uniform-random node
      null, contiguous-subtree null. Cardinality matching: nulls drawn to the exact measured distinct-node
      count of the corresponding signal draw, per q per seed, never to a computed count. Seeds: 3
      per arm per configuration. No sampling occurs inside the closure; every closure evaluation is
      exact.'
  controls:
  - Uniform-random-revelation null at exactly matched revealed cardinality, identical closure, same
    invocation, three seeds.
  - Contiguous-subtree null at matched cardinality, which shares the signal arm's locality without
    its path structure and separates locality from arrangement.
  - 'Single-signature root-closure check: the signal arm must reach the root after one signature by
    construction, validating the closure implementation.'
  - 'Singleton check: a null arm at cardinality one must close to exactly one node, validating that
    the closure does not over-propagate.'
  - Concrete-hash leaf selection arm alongside uniform leaf selection, confirming the pattern's effect
    does not depend on how leaves are chosen.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): A uniform-random-revelation arm: draw exactly the same number of distinct
    node positions uniformly at random from the whole tree, apply the identical upward closure, and
    measure the identical quantities, in the same process invocation and on the same seeds. Cardinality
    is matched exactly, not approximately, so the only difference between arms is arrangement. For
    the signal arm to mean anything, its closure size must exceed the null''s at equal revealed cardinality;
    if the two curves coincide, the recorded result is that the authentication-path arrangement confers
    no closure advantage over cardinality at that height, which is a measured obstruction with a number
    attached and is reported as the finding rather than as an absence. A second null reveals the same
    cardinality in random contiguous subtrees rather than uniformly, which is a stronger null because
    it shares the signal arm''s locality without sharing its path structure, and separates locality
    from path-specific arrangement.'
  independent_variables:
  - tree height h
  - signature count q
  - arm (signal-uniform / signal-concrete / uniform-random null / contiguous-subtree null)
  - seed
  metrics:
    primary:
    - '|K| as a curve in q, per arm and height'
    - difference in |K| between signal and each null at exactly matched revealed cardinality, with
      spread
    - one-away leaf count per arm and q
    - root-known indicator (signal) and root-known probability (nulls)
    - crossover height or an explicit statement of its absence within the enumerable range
    secondary:
    - measured distinct revealed-node count per signal draw, which drives the cardinality matching
    - saturation q per height
    - monotonicity check result on |K|
    - difference between uniform and concrete-hash leaf-selection signal arms
    - closure iteration counts and wall-clock per configuration
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The difference D = |K_signal| - |K_uniform-null| at exactly matched revealed cardinality,
      as a function of q, at each tested height.
    formula: 'No magnitude is pre-registered for D, deliberately and with a stated reason: the size
      of any path-arrangement advantage is the deliverable, and pre-registering it would make the
      comparison confirmatory. What is pre-registered is the definition and two forced gate values.
      D is defined with K the least fixed point of the operator that adds a node whenever both its
      children are present, seeded with the revealed set, and with the null''s revealed set drawn
      uniformly without replacement to the exact measured cardinality of the corresponding signal
      draw. The forced gates are: the signal arm''s root-known indicator equals 1 after one signature,
      by construction; and a null arm at revealed cardinality one closes to exactly one node. Failure
      of either gate voids the run before any D is read.'
    source: Pre-registered in the parent proposal IDEA-20260816-4f67d5 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at tree heights 8 to 22, with 26 attempted for a single curve. These are
      the heights at which the closure is computed exactly over the entire node set as a bit array,
      with no sampling and no approximation anywhere, which is the design''s reason for choosing them.
      Deployed hypertree geometries lie outside this range. The transfer assumption, stated and not
      established: that whether path arrangement confers closure advantage over matched cardinality
      is a property of the tree poset''s shape and of the ratio of revealed nodes to tree size, so
      that a crossover located at heights 8 to 22 describes the same phenomenon at larger heights
      at the corresponding ratio. That is an assumption about combinatorics rather than about security,
      and it is the weakest assumption in the contract because a monotone closure''s behaviour can
      change qualitatively with scale. Under AGENTS.md rule 4, no output is phrased as a statement
      about any deployed parameter set.'
    correspondence: null
  tail_checks:
  - 'Verify the singleton gate: a null arm at cardinality one closes to exactly one node.'
  - 'Verify the single-signature gate: the signal arm reaches the root after one signature at every
    height.'
  - Verify |K| is monotone nondecreasing in q in every arm.
  - Verify null cardinality equals the measured signal cardinality exactly, per draw, and log any
    mismatch as a fatal bookkeeping error.
  - Mark every data point beyond the saturation q for its height and exclude those points from the
    crossover determination.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt before reading any difference if either forced gate fails.
  - Halt the height sweep at h = 22 for the full four-arm comparison and attempt h = 26 for the signal
    |K| curve only, reporting the reduced scope.
  - Halt any configuration whose q exceeds its saturation point, recording the saturation rather than
    running past it.
  - Hard wall-clock stop at 6 CPU-hours; a stop is an infrastructure outcome and is never negative
    mathematical evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Exact closure curves for all four arms at every tested height, both forced gates
    passed, nulls matched to measured signal cardinality exactly, and either a located crossover height
    or an explicit statement with its resolution that no crossover occurs within the enumerable range.
  falsification_criterion:
  - 'Either forced gate fails: the closure is misimplemented and no difference may be read.'
  - '|K| decreases anywhere in q: the closure is not monotone and the implementation is wrong.'
  - 'Null cardinality does not exactly match the measured signal cardinality on any draw: the comparison
    is biased and that configuration is void.'
  - 'Signal and uniform null coincide within spread at every height: recorded as a measured obstruction
    with its height range and resolution, licensing later analyses to count revealed nodes and ignore
    arrangement.'
  - 'The contiguous-subtree null coincides with the signal arm while the uniform null does not: the
    effect is locality and must be reported as locality, not as path structure.'
  - 'Uniform and concrete-hash leaf-selection arms differ materially: leaf-index distribution confounds
    the measurement and the question routes to the randomizer-distribution contract.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-4f67d5
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The upward-only closure rule is a modelling decision the Coordinator must approve explicitly,
    since a wrongly permitted sideways or downward rule produces smooth, monotone, entirely wrong
    curves that no gate in the contract detects.
  - Whether one-away leaf count is the right second observable, or whether a different measure of
    near-determination serves better, needs a Coordinator ruling before freezing.
  - The structural claim that a signature reveals exactly the leaf plus h siblings per layer comes
    from a description this repository marks UNVERIFIED; a Coordinator must decide whether to proceed
    with the caveat carried into artifacts or to block on filing a primary source.
  - Whether the contiguous-subtree null is the right second null, or whether a depth-matched null
    (revealing nodes with the signal arm's depth distribution but random positions) would separate
    depth from arrangement more sharply, is an open design question the Coordinator should settle,
    since the confounder list identifies depth distribution as a live alternative explanation.
