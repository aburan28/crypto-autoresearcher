experiment:
  id: EXP-CANL-8ad6f8
  hypothesis_id: H-CANL-447177
  derived_from_idea: IDEA-20260807-761a8c
  question_id: RQ-CANL-63098f
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    The small-p artifact null for lane L9 - measured decay slope of the lift covering
    fraction against the ladder prime at a fixed enumeration box, with a rank-1 closed-form
    hard gate, five named null objects, and planted-positive and planted-negative detection
    in both required directions
  objective: >-
    The one uncertainty a run reduces is whether any height-derived L9 measurement can be
    believed at the scales this campaign can reach. A run establishes (i) whether the
    enumeration reproduces the rank-1 closed-form count exactly, which is a hard gate on
    everything downstream; (ii) the fitted slope of log rho_lift against log p on every arm
    at a fixed box with the global curve held fixed, whose forced value -1.00 is
    rank-independent and therefore a calibration rather than a measurement; (iii) the
    outcomes of five named nulls, each with the parameter that must destroy it; and (iv) the
    instrument's behaviour in BOTH required detection directions - it must recover a planted
    lift at 100 percent and must refuse a planted-unliftable target at 0 percent. The
    deliverable is a calibration certificate that every other L9 measurement must cite. No
    attack is proposed and no statement about complex multiplication, lifting or the ECDLP
    follows from any outcome.
  what_this_is_not:
  - >-
    Not an attack, not a lift construction for cryptographic parameters, not a distinguisher,
    and not a result about whether complex multiplication helps. It is an instrument
    calibration.
  - >-
    Not a validation of any L9 conclusion. A passing certificate removes one class of
    artifact; it endorses nothing. A failing certificate blocks every L9 conclusion drawn
    from the same pipeline.
  - >-
    Not a claim about cryptographic p. The decay law's behaviour beyond the ladder is
    arithmetic from the formula, never a measurement, and is labelled as such.
  - >-
    Not a status change to any hypothesis, evidence record or knowledge entry.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence.
    No run has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the executed enumeration box and ladder, on the executed
      global curves, the pipeline does or does not reproduce the rank-1 closed form exactly,
      does or does not fit slope -1.00 +/- 0.15 on each named arm, does or does not recover a
      planted lift and refuse a planted-unliftable target, and reports a measured sensitivity
      floor of 1/|S|. WHAT DOES NOT FOLLOW - no statement that complex multiplication does or
      does not assist lifting; no covering fraction at any prime outside the ladder; no
      attack and no security consequence; and specifically NOT that a downstream L9
      measurement is correct because this certificate passed.
  inputs:
    procedure: >-
      STAGE 0, minutes, HARD GATE - rank-1 closed-form validation. On a rank-1 curve with
      generator P0, the reduced height-bounded set is exactly the multiples [m] red(P0) with
      m^2 hhat(P0) <= B. The pipeline must reproduce that count as an EXACT INTEGER at every
      ladder point and every height bound, and the count must track sqrt(B). Any mismatch
      halts the line - a measured count failing to track sqrt(B) means the enumeration box is
      not covering the height ball and every downstream number is biased.
      STAGE 1, hours - fix the enumeration box x = u/w^2 with |u| <= U and 1 <= w <= W,
      declared in bits and frozen; build the ladder of at least five primes spanning at least
      three decades; measure rho_lift on six global curves (3 CM with class number 1, 3
      matched non-CM) at every ladder point and every height bound, with the SAME global
      curves reduced at each prime so r and Reg are held exactly fixed.
      STAGE 2, hours - run nulls N1 through N5 on the IDENTICAL pipeline with the identical
      box and ladder, in the same invocation as the signal arm.
      STAGE 3, minutes - plant and recover. For each global curve choose a global point with
      canonical height below the smallest ladder bound, set the target to its reduction, and
      confirm recovery at every ladder prime. Then plant a NEGATIVE - a target known not to
      be in the reduced set - and confirm the pipeline reports failure.
      STAGE 4, minutes - fit every slope with a jackknife interval per arm; compute the
      per-curve injectivity threshold and mark ladder points below it as censored rather than
      as data.
      STAGE 5, zero compute - emit the calibration certificate stating box, ladder, slopes per
      arm with intervals, null outcomes, planted-positive and planted-negative results, the
      sensitivity floor 1/|S|, and an explicit pass or fail per arm.
    instrument: >-
      Exact integer arithmetic throughout - the enumeration, the reductions, the counts and the
      denominators are integers, so the only statistical object in the package is the jackknife
      interval on a fitted slope. Global point enumeration is run ONCE per curve and reduced at
      every ladder point, which is what makes the ladder affordable - the reduction of integer
      coefficients modulo p is O(1) per point. No canonical lift is constructed anywhere.
      Recorded through harness/runner.py.
    parameters: >-
      Ladder primes 101, 1009, 10007, 100003, 1000003, each checked for good reduction per
      curve and dropped with a recorded reason otherwise. Six global curves - three CM with
      class number 1 and three non-CM matched on exhibited rank and on minimal discriminant
      within a factor 2 - plus a rank-1 curve for Stage 0 and a rank-0 CM curve for null N5.
      Eight height bounds per curve. Enumeration box (U, W) declared in bits in Stage 0 and
      identical across every arm; an arm using a different box is not comparable and must not
      be pooled. Slope acceptance band -1.00 +/- 0.15. Jackknife over ladder points for the
      slope interval.
  controls:
  - >-
    RANK-1 CLOSED FORM, HARD GATE, blocking - the instrument's own self-validation against a
    case with an exact answer. Decay parameter is the height bound B; the closed-form count
    must grow like sqrt(B) and the measured count must match it term by term as an integer.
    Failure halts the line before any other number is produced.
  - >-
    N1 MATCHED NON-CM CURVE - same exhibited rank, minimal discriminant within a factor 2,
    same ladder, same box. Destroys any claim attributing a covering fraction to complex
    multiplication. Decay parameter p.
  - >-
    N2 RANDOM LATTICE with matched regulator and a random surjection onto Z/N - same shape, no
    arithmetic. Destroys any claim that a covering EXPONENT is arithmetic rather than
    lattice-shape. Decay parameter is the rank; the exponent must move with r and with nothing
    else.
  - >-
    N3 SYNTHETIC ORDER ACTION - a random order-3 or order-4 Z-linear isometry of the
    Mordell-Weil lattice substituted for the genuine zeta action. Destroys any claim that the
    module structure rather than a lattice symmetry produced an effect. Decay parameter
    |D_E| - the genuine action's companion-height ratio must grow like sqrt(|D_E|) and the
    synthetic one's must stay O(1).
  - >-
    N4 TARGET RESHUFFLE - resample the discrete-log target k with the curve, the lift and the
    point held fixed. FORCED VALUE - every curve-only statistic unchanged, exactly. Adopted
    with attribution from lane L7 / RQ-TORS-8c7b79 rather than reinvented. A nonzero change is
    an implementation leak that would manufacture a spectacular false positive.
  - >-
    N5 RANK-0 TORSION-ONLY ARM - a rank-0 CM curve where the covering fraction is forced to
    |torsion| / N at every bound. Destroys any pipeline that reports non-trivial coverage where
    none can exist.
  - >-
    PLANTED POSITIVE, MUST FIRE - a global point of known small height whose reduction is the
    target. FORCED recovery rate 100 percent at every ladder prime. An instrument that cannot
    find a lift that is there cannot report that lifts are absent.
  - >-
    PLANTED NEGATIVE, MUST NOT FIRE - a target constructed outside the subgroup generated by
    the reductions of the exhibited generators, when that subgroup is proper. FORCED
    false-positive rate 0 percent. An instrument that finds a lift for an unliftable target is
    worse than useless.
  - >-
    ORDERING RULE - Stage 0's hard gate and the null battery are executed and their verdicts
    written before any CM-versus-N1 excess ratio is computed, so that no acceptance band can be
    adjusted once the CM numbers are known.
  independent_variables:
  - ladder prime p
  - arm - CM signal / N1 matched non-CM / N2 random lattice / N3 synthetic action / N4 reshuffled target / N5 rank-0
  - global curve identity, held fixed across the whole ladder
  - naive height bound B
  - exhibited rank r
  metrics:
    primary:
    - >-
      slope_per_arm - ordinary least squares slope of log rho_lift against log p at fixed
      height box, dimensionless, one value per arm per curve, with a jackknife interval over
      ladder points. FORCED VALUE -1.00 with the interval inside +/- 0.15.
    - >-
      rank1_closed_form_exact_match - fraction of (ladder point, height bound) cells where the
      measured integer count equals the closed-form integer count, dimensionless. FORCED 1.00.
    - >-
      planted_positive_recovery_rate - fraction of (curve, ladder point) cells where the planted
      global point is recovered, dimensionless. FORCED 1.00.
    - >-
      planted_negative_false_positive_rate - fraction of planted-unliftable targets for which a
      lift is reported, dimensionless. FORCED 0.00.
    - >-
      cm_over_n1_excess_ratio - rho_lift on the CM arm divided by rho_lift on the matched
      non-CM arm, dimensionless, per ladder point, reported together with the difference of the
      two fitted slopes.
    - >-
      n3_companion_height_ratio and its genuine-action counterpart, dimensionless, each as a
      function of |D_E|, with the fitted growth exponent in sqrt(|D_E|).
    - >-
      n4_curve_statistic_delta - the maximum absolute change in any curve-only statistic under
      target resampling, in the statistic's own units. FORCED 0 exactly.
    secondary:
    - >-
      rho_lift per (curve, p, B) as an exact integer numerator over an exact integer denominator,
      never as a float alone.
    - >-
      empirical maximum of |hhat - h_x/2| per curve, in canonical height units, which is
      HEUR-CANL-C2's measured quantity and the basis for declaring the arms comparable.
    - >-
      per-curve injectivity threshold, as a prime bound, and which ladder points fall below it
      and are therefore censored.
    - >-
      sensitivity floor 1/|S|, dimensionless, where |S| is the enumerated global point set size.
      Every "no excess" verdict must quote it.
    - >-
      n5 coverage on the rank-0 arm against its forced value |torsion| / N.
    - >-
      the enumeration box (U, W) in bits, the ladder, and every dropped (curve, p) pair with its
      reason.
  heuristic_under_test: HEUR-CANL-C1
  preregistered_prediction:
    quantity: >-
      The fitted slope of log rho_lift against log p per arm, and rho_lift at p = 101 on a
      rank-2 curve of regulator order 1.
    formula: >-
      log rho_lift = (r/2) log H - (1/2) log Reg - log p + const at fixed naive height bound H,
      so the slope against log p is EXACTLY -1 for every rank, every regulator, CM or not.
      Predicted -1.00 with a jackknife interval inside +/- 0.15 on every arm. rho_lift at
      p = 101 on a rank-2 curve with Reg of order 1 is predicted at a few percent, order 1 to 10
      percent - and that prediction IS the artifact, pre-registered so that when it appears
      nobody mistakes it for a result. Under the null that the pipeline is not measuring the
      covering fraction, the slope is unconstrained.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-761a8c, part (D), before any run under
      this contract exists. The percentages quoted there (4.5 percent at p = 101, 0.09 percent
      at p = 10^4, about 2e-8 at p = 2^30) are ARITHMETIC EVALUATIONS of the stated formula
      recorded during ideation, not measurements. Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      The ladder tops out at 10^6, which is where the naive-height enumeration remains exhaustive
      and the counts remain exact integers. That is the correct scale for this experiment because
      the quantity under test is a CALIBRATION whose forced value is scale-independent - the
      slope -1 is the same at every prime, so the informative measurement is the one that can be
      made exactly. The transfer to cryptographic p is explicitly NOT a measurement - it is
      arithmetic from the decay law, and the contract requires the certificate to say so on its
      face. The instrument's sensitivity floor 1/|S| is reported so that a downstream "no CM
      excess" is bounded rather than absolute.
    correspondence: null
  tail_checks:
  - >-
    Report the two ladder points with the largest slope residual per arm, alongside the computed
    injectivity threshold for that curve, since the residual is EXPECTED at the smallest primes
    and an unexpected large residual at a large prime is a different failure.
  - >-
    Report ladder ends explicitly as CENSORED - coverage saturating at the small end and no
    points found at the large end are both censored cells and must never be reported as
    measurements (AGENTS.md rule 5).
  - >-
    Report the slope refitted with each single ladder point removed, so a slope driven by one
    point is visible as such.
  - >-
    Report the empirical height-shift distribution per curve and the implied capture fraction; if
    arms differ by more than a factor 2, no cross-arm ratio may be reported until the arms are
    re-matched on |Delta|.
  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 8.0
    maximum_memory_gb: 8
    maximum_runs: 24
  stopping_rules:
  - >-
    HALT the entire package if the Stage 0 rank-1 closed form does not reproduce exactly. No
    other number in the package may be computed or reported.
  - >-
    HALT if the planted positive is not recovered at 100 percent, or the planted negative
    produces any false positive. The instrument fails a required detection direction and no L9
    negative may be reported from it.
  - >-
    Drop any (curve, p) pair without good reduction, or any curve with a large cofactor, with the
    reason recorded. Never drop silently.
  - >-
    Stop at the declared ladder, box, curve set and height bounds. No prime, curve or bound is
    added after any slope is seen, and the acceptance band is not revised after a fit.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - >-
    A run in which any null arm is missing, or in which a null was not executed in the same
    invocation and on the identical pipeline, box and ladder as the signal arm, is
    invalid_measurement - the comparison this contract exists to make was not made.
  - >-
    A run pooling arms measured under different enumeration boxes is invalid_measurement,
    regardless of what it observed.
  - >-
    A run reporting a covering fraction as a float without its exact integer numerator and
    denominator is completed_invalid.
  - >-
    A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: >-
    The calibration certificate PASSES when all of the following hold, each decidable from the
    primary metrics -
    (1) rank1_closed_form_exact_match is 1.00 at every cell and the closed-form count tracks
    sqrt(B);
    (2) slope_per_arm lies inside -1.00 +/- 0.15 on EVERY arm, including every null, at every
    ladder point above that curve's injectivity threshold;
    (3) planted_positive_recovery_rate is 1.00 and planted_negative_false_positive_rate is 0.00;
    (4) n4_curve_statistic_delta is exactly 0;
    (5) N5 coverage equals its forced value |torsion| / N;
    (6) the certificate reports the sensitivity floor 1/|S| and the per-curve height shift.
    Any other combination is a FAILING certificate, which blocks every L9 conclusion drawn from
    this pipeline until it is fixed.
  falsification_criterion:
  - >-
    The rank-1 closed form does not reproduce exactly. The enumeration is wrong; nothing in L9 may
    be reported until it is fixed. Infrastructure signal, not a mathematical negative.
  - >-
    Any arm's slope falls outside -1.00 +/- 0.15 above the injectivity threshold. HEUR-CANL-C1 is
    refuted for this pipeline at the tested scope, and the pipeline is not measuring what the
    decay law says it measures.
  - >-
    Null N3 reproduces the genuine action's companion-height growth. The CM effect is a lattice
    symmetry; every CM attribution in this lane is withdrawn. This is the most consequential
    negative the design admits.
  - >-
    Null N4 shows any curve-only statistic moving with the resampled target. Implementation leak;
    halt.
  - >-
    Null N5 shows non-trivial coverage on the rank-0 curve. The counter is including torsion or
    twists; halt.
  - >-
    Planted-positive recovery below 100 percent or planted-negative false positives above 0
    percent. The instrument fails in one of the two required directions.
  - >-
    The measured CM-versus-N1 excess is large at small p and decays to 1 across the ladder. The
    excess is the small-integer artifact, and any L9 record asserting a CM advantage from a single
    small p is refuted at the tested scope. This is a genuine negative FOR THOSE RECORDS and is
    the design's main intended finding.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
  - raw-result.json carrying every per-(curve, p, B, arm) exact integer count and denominator, not summaries
  - all five null arms' measurements plus the planted-positive and planted-negative results, in the same file as the signal arm
  - the Stage 0 rank-1 closed-form comparison, cell by cell, as integers
  - the per-curve injectivity thresholds and the list of censored ladder points
  - the enumeration box, the ladder, and every dropped (curve, p) pair with its reason
  - the machine-readable calibration certificate with an explicit pass or fail per arm and the sensitivity floor
  - the pre-registration text, written before the first run and hashed
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator drafting does not confer approval. This contract is review_required and is NOT
    approved; approved_by is null and execution_authorized is false. Approval is the user's gate
    because it authorizes execution and spends compute.
  - >-
    The enumeration box (U, W) must be fixed in bits before approval. It sets the sensitivity
    floor 1/|S| and therefore the strength of every negative the certificate can support; choosing
    it after seeing a coverage number would be fitting.
  - >-
    The six global curves must be named before approval, with their ranks, regulators, minimal
    discriminants and exhibited generators, so the CM and non-CM arms can be audited as matched
    before any measurement.
  - >-
    This experiment is declared BLOCKING for the other L9 measurement proposals
    (IDEA-20260807-44ba75, IDEA-20260807-6533fd). Approval should sequence it first or alongside
    them, never after, since its purpose is to decide whether their numbers can be believed.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260807-761a8c
    authored_at: '2026-08-25'
    note: >-
      The decay law, the forced slope -1.00 +/- 0.15, the five named nulls with their decay
      parameters, the two required detection directions, the rank-1 closed-form self-validation
      and the sensitivity floor 1/|S| are taken from the parent proposal's parts (B) through (D),
      its null_object_control and its minimal_test, restated as measurable quantities with units.
      Boilerplate identical across contracts by program rule comes from the fixed table. Budgets
      follow the parent's declared estimated_cost of medium implementation and low compute. No
      field is invented; a value the proposal did not supply is null or is a derivation gap.
  derivation_gaps:
  - >-
    The enumeration box (U, W) is left in bits by the proposal without a value. It must be derived
    from the target sensitivity - the floor is 1/|S| and |S| is set by U and W - rather than chosen
    for convenience, and that derivation is missing.
  - >-
    The proposal requires the CM and non-CM arms to be matched on rank and on minimal discriminant
    within a factor 2, but HEUR-CANL-C2's own falsification condition is a height-shift difference
    of more than a factor 2 across arms. Whether those two matching criteria are mutually
    achievable on real curves is not established and must be checked on the candidate curve list
    before approval.
  - >-
    The proposal's N2 (random lattice with matched regulator) has its decay parameter declared as
    rank, but the contract's slope test is rank-INDEPENDENT by construction. What exactly N2 must
    show, beyond slope -1, is therefore underspecified - the rank-dependence lives in the intercept
    the design refuses to claim, and the reconciliation is owed before approval.
  - >-
    The planted negative requires a target outside the subgroup generated by the reductions of the
    exhibited generators, which exists only when that subgroup is proper. The proposal does not say
    what to do when it is not, and a curve where the planted negative cannot be constructed must be
    declared out of scope in advance rather than skipped at run time.
  - >-
    The companion-height ratio's forced growth sqrt(|D_E|)/2 is attributed to IDEA-20260807-fd5a24
    and is not re-derived here. It must be transcribed with its derivation before approval, since
    the N3 verdict - the design's most consequential negative - depends entirely on it.
