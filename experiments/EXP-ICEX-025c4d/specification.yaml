experiment:
  id: EXP-ICEX-025c4d
  hypothesis_id: H-ICEX-068cec
  derived_from_idea: IDEA-20260828-2b2bb2
  question_id: RQ-JINV-8fc13a
  version: 1
  status: designed
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Cross-prime correlation of exactly computed relation-collection functionals for FIXED
    small-height global models reduced at twenty toy primes, against a per-prime matched-random
    null arm, a large-height nearby object, a five-model replication pack, a prime-gap control,
    and a CURVE-FREE fixed-seed object that reproduces the "one global object, many primes"
    shape with no elliptic curve
  objective: >-
    Reduce exactly one uncertainty: whether a fixed global integer model, reduced at many
    independent primes, leaves a correlated signature in this program's relation-collection
    functionals beyond a per-prime matched-random null. Every prior record under this question
    fixes a prime first and varies the local invariants at that prime; none fixes a global model
    and varies the prime, so the RQ's own fourth title clause has never been operationalised.
    The run also establishes whether the same correlation shape is produced by a non-curve
    object under the identical statistic, which decides whether any result may be stated about
    curves or about height at all.
  what_this_is_not:
    - >-
      Not an attack, not an algorithm, not a speedup. No discrete logarithm is solved and no
      certificate of a solve is produced.
    - >-
      Not a statement about any deployed or published curve. The global models are chosen by
      this program for the test and are not models of anyone's parameters.
    - >-
      Not a transport or multi-instance preprocessing measurement. Different primes give
      non-isogenous curves in general, so no transport reading applies and none is offered.
    - >-
      Not a retest of the lane's admissibility argument, which concerns endomorphisms acting on
      the group and does not reach a global arithmetic fact.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence.
      approved_by is null and no run has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: over the twenty declared toy primes and the declared height
      threshold, the five chosen small-height global models do or do not show a cross-prime
      correlation of the null-adjusted functional deviation beyond the permutation band, with
      the achieved resolution stated, relative to a matched-random null arm, a large-height
      control and a curve-free fixed-seed control. WHAT DOES NOT FOLLOW: nothing about any
      specific deployed curve, nothing at cryptographic scale, no exponent, and - if the
      curve-free arm correlates - nothing about elliptic curves or height at all.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, blocking, HARD GATE). Freeze and hash: the twenty primes with their
      spacing, the five small-height models, the large-height control, the curve-free seed, the
      height definition, the matching criteria for null draws, the number of null draws per
      prime, the exact functionals, the correlation statistic, the permutation scheme, and the
      resolution threshold per cell. Verify non-CM-ness of each small-height model at ten primes
      by direct point counting BEFORE the grid is run; a model whose discriminant repeats one
      small fixed value is replaced at this stage and only at this stage.
      STAGE 1 (null arm alone, blocking reproduction gate). Build the null-draw procedure and
      run it with NO fixed-global arm present: at each prime, draw the matched-random curves,
      compute the functionals, and form Y from independently drawn curves at each prime.
      Compute the cross-prime correlation of that arm and verify it is zero within the
      permutation band. Also run the SEED AUDIT here: assert that every null draw at every prime
      used a distinct seed derived from a declared lineage, and record the lineage.
      STAGE 2 (curve-free arm, blocking, runs before any curve of interest). Reduce the declared
      integer seed at each prime, expand it deterministically to a subset of Z/p of the matched
      cardinality with NO curve, no group law and no coordinate map, and score it with the same
      sumset-coverage functional against a matched-random subset null at each prime. Compute its
      cross-prime correlation and write it down before Stage 3.
      STAGE 3 (the measurement). For each of the five small-height models and the large-height
      control, reduce at every prime, compute the functionals EXACTLY by enumeration, form
      Y(p_i) against that prime's null draws, and compute the cross-prime correlation with an
      exact permutation p-value and Holm correction across the pack.
      STAGE 4 (covariate and shape checks). Compute the serial correlation of the discriminant
      sequence itself per model; compare the empirical distributions of the local discriminant
      and automorphism order between the small-height pack and the large-height control; report
      correlation as a function of prime spacing.
      STAGE 5 (zero compute). Emit the m by k grid, the four correlation columns, the achieved
      resolution per cell, and the explicit statement of which arms agreed with which.
    instrument: >-
      Pure Python integer arithmetic and an explicit affine group law under
      experiments/EXP-ICEX-025c4d/driver/. Functionals are computed by EXACT enumeration of the
      relevant sumsets; no sampled-target estimator is used anywhere, because sampling noise in
      the within-prime statistic would propagate into the cross-prime correlation and is exactly
      the confound this design cannot afford. Recorded through harness/runner.py.
    parameters: >-
      THE INSTANCE SET IS FIXED IN STAGE 0 AND EVERY ARM IS RUN ON THAT SAME SET OF PRIMES. k = 20
      primes spread across [2^20, 2^24] with recorded spacing. At each prime: 1 row per
      small-height model, 1 large-height row, 1 curve-free row, and at least 100 matched-random
      null draws with distinct seeds. Matching criteria: local fundamental discriminant,
      automorphism group order, group order, and factor-base density, each matched within a
      declared tolerance recorded per cell. THE MACHINE IS NAMED IN THE MANIFEST; timings are for
      budget accounting only and no conclusion rests on them.
  controls:
    - >-
      CURVE-FREE NULL OBJECT, MANDATORY AND BLOCKING (standing scope constraint from the
      pfdr-battery lane): a fixed declared integer seed reduced at each prime and expanded to a
      matched-cardinality subset of Z/p, with no elliptic curve constructed anywhere. It has the
      identical shape - one fixed global object, many independent reductions - and is scored by
      the identical statistic. FORCED: zero cross-prime correlation. If it correlates, the
      signature belongs to that shape and not to curves, and the height reading is unavailable
      in both directions.
    - >-
      NULL ARM ALONE, blocking reproduction gate: k independently drawn matched-random curves,
      fresh seed per prime, no shared global identity. FORCED: zero cross-prime correlation. This
      control can genuinely fail and its failure voids the instrument rather than the hypothesis.
    - >-
      SEED AUDIT, blocking: every null draw's seed lineage is recorded and asserted distinct. A
      seed reused across primes would fabricate exactly the correlation under test, which makes
      this the single cheapest way for the run to be wrong.
    - >-
      LARGE-HEIGHT NEARBY OBJECT: one fixed global model with large random coefficients, same k
      primes. Shares "one fixed global object, many primes" with the pack and shares nothing
      else. If it correlates, the height-specific claim is withdrawn.
    - >-
      REPLICATION PACK: five independently chosen small-height models, so that a curve-specific
      artifact is distinguishable from a height-class effect within the same run.
    - >-
      PRIME-GAP CONTROL: the correlation reported as a function of prime spacing, so that a
      correlation running through the size of p rather than the identity of the model is visible.
    - >-
      MATCHING AUDIT: the achieved matching tolerance on each of the four criteria reported per
      cell. An unmatched cell is reported as unmatched, never silently pooled.
  independent_variables:
    - arm type - curve-free fixed seed, matched-random null, small-height model, large-height model
    - which of the five small-height global models
    - prime index across the declared set, and prime spacing
    - functional - arity 2 coverage, arity 3 coverage, liftable density, decomposition efficiency
    - log naive height of the global model
  metrics:
    primary:
      - >-
        stat(model, p): the EXACT value of each relation-collection functional at each prime for
        each arm, as an integer pair (numerator, denominator) rather than a rounded rate.
        Dimensionless when formed as a ratio. Recording the integers is required so that a later
        reader can re-form any rate without rerunning.
      - >-
        null_distribution(p): the FULL set of at least 100 null-draw values of the same
        functional at that prime, archived in full. Reporting only its mean and standard
        deviation is prohibited: the z-score below is legitimate only if this distribution passes
        the declared shape check.
      - >-
        Y(model, p) = (stat - null_mean) / null_sd, dimensionless. LEGITIMATE ONLY IF the null
        distribution at that prime passes the declared shape check (skewness and kurtosis inside
        the pre-declared band). Where it does not, the contract requires the distribution-free
        alternative below and forbids the z-score.
      - >-
        rank(model, p): the rank of the fixed model's statistic within that prime's null draws,
        an integer in [0, n_null]. This is the DISTRIBUTION-FREE summary and is computed at every
        cell regardless, so that the headline can be recomputed on ranks if the shape check fails.
      - >-
        cross_prime_correlation: Spearman correlation of Y (and, separately, of rank) across the
        k primes, per arm, dimensionless in [-1, 1], with an EXACT permutation p-value over
        prime labels and Holm correction across the five-model pack.
      - >-
        cross_prime_correlation_null_arm and cross_prime_correlation_curve_free: the same
        statistic on the two blocking null arms. Both FORCED to 0 within the permutation band.
      - >-
        correlation_vs_log_height: slope of correlation magnitude against log H(A,B) across the
        pack plus the large-height control, with its permutation distribution.
    secondary:
      - >-
        serial_correlation_D0: serial correlation of the local fundamental discriminant sequence
        itself, per model, dimensionless. Reported separately because a correlated covariate is a
        different finding from a correlated functional.
      - >-
        The empirical distributions of the local discriminant and of the automorphism group order
        for the small-height pack versus the large-height control, compared as distributions and
        not as means.
      - >-
        correlation_vs_prime_gap: the correlation restricted to prime pairs binned by spacing.
      - >-
        Matching tolerance achieved per criterion per cell, and the count of null draws that met
        all four criteria.
      - >-
        The seed lineage for every null draw, and the assertion output of the seed audit.
      - >-
        Achieved resolution per cell: the half-width of the permutation band for the correlation
        statistic, so that a null is a bound and not an absence.
      - >-
        Wall-clock seconds and peak RSS per prime on the NAMED machine, for budget accounting.
  heuristic_under_test: HEUR-HGT-1
  preregistered_prediction:
    quantity: >-
      cross_prime_correlation for the null arm, the curve-free arm, each of the five small-height
      models and the large-height control; and correlation_vs_log_height.
    formula: >-
      Under H-null every correlation column is 0 within its exact permutation band, because the
      reduction map destroys the global arithmetic that height measures and the local
      discriminant sequence behaves like independent draws. The null arm and the curve-free arm
      are FORCED to 0 by construction and their failure is an instrument failure rather than a
      result. Under H-signal the five small-height columns are nonzero and share a sign, the
      large-height column and the curve-free column are 0, and correlation_vs_log_height is
      monotone.
      NO NUMERIC BAND IS WRITTEN HERE. The permutation bands are computed from the frozen design
      in Stage 0 before any measurement, because a band invented at contract-writing time would
      be a fabricated statistic.
    source: >-
      The two-branch structure, the per-prime matched null, the replication pack, the
      large-height nearby object, the prime-gap control and the seed audit are taken from
      IDEA-20260828-2b2bb2, read in full by TASK-20260904-8f2f95 on 2026-09-04. The Sato-Tate
      expectation behind H-null is RECALLED ONLY and is used to set an expectation, never as a
      bound. Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      Twenty primes in [2^20, 2^24] is set by the requirement that every functional be computed
      EXACTLY by enumeration: an estimated within-prime statistic would inject sampling noise
      into a cross-prime correlation, which is the one confound this design cannot absorb. THE
      TESTED SCALE IS THE CLAIMED SCALE. The transfer assumption that would be needed to go
      further - that twenty primes is enough for the equidistribution regime - is explicitly NOT
      met, and an H-null result is therefore scoped to "no signal at this prime count".
    correspondence: null
  tail_checks:
    - >-
      Report the largest single |Y| in the grid with its cell, since one extreme prime can carry
      a rank correlation across twenty points.
    - >-
      Recompute every correlation with each single prime removed (leave-one-out across all
      twenty), and report the range. A correlation that collapses when one prime is dropped is
      reported as unstable rather than as a signal.
    - >-
      Recompute every correlation on ranks as well as on z-scores, and report both. Disagreement
      between them localises the finding to the shape of the null distribution.
    - >-
      Report the number of null draws that met all four matching criteria per cell, and refuse
      any cell with fewer than 30, reporting the shortfall rather than a Y.
  replication:
    seeds:
      - 20260904
      - 20260907
      - 20260910
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 10
  stopping_rules:
    - >-
      HALT before Stage 3 if the null arm alone shows correlation outside its permutation band.
      No fixed-global number is reported until the instrument is repaired.
    - >-
      HALT before Stage 3 if the seed audit fails. A reused seed fabricates the effect under
      test.
    - >-
      If the curve-free arm correlates, CONTINUE the run but record in advance that no
      height-specific or curve-specific reading may be drawn from it, and report the result as an
      instrument finding.
    - >-
      STOP and request independent review, before writing any sentence asserting a height-driven
      signal, if multiple small-height models correlate while the large-height and curve-free
      arms do not.
    - >-
      Stop at the frozen prime set and model pack. No prime and no model is added after any
      correlation has been seen.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop
      and is never a negative result.
  invalidation_rules:
    - >-
      A timeout, crash or dependency failure makes the run failed_infrastructure and is NEVER
      negative mathematical evidence.
    - >-
      A run in which any null draw shares a seed with another prime's null draw is
      invalid_measurement.
    - >-
      A run in which any functional was estimated from sampled targets rather than enumerated
      exactly is invalid_measurement; the design's whole premise is that the within-prime
      statistic contributes no noise.
    - >-
      A run reporting Y at a cell whose null distribution failed the shape check, without also
      reporting the rank-based statistic, is invalid_measurement.
    - >-
      A run reporting a small-height correlation without the curve-free arm's value on the same
      prime set is invalid_measurement.
    - >-
      A run whose primes, models, matching criteria or permutation scheme differ from the frozen
      contract is a DIFFERENT experiment and needs a new contract.
  success_criterion: >-
    The run yields interpretable evidence when ALL of the following hold: (1) the null arm's
    cross-prime correlation lies inside its permutation band; (2) the seed audit passes with the
    lineage recorded; (3) the curve-free arm's correlation is reported on the same prime set and
    its verdict is stated explicitly; (4) every small-height model's correlation is reported with
    an exact permutation p-value, Holm-corrected across the pack, together with the achieved
    resolution half-width; (5) both the z-score and the rank versions of every correlation are
    reported; (6) the large-height control is reported on the identical prime set; (7) the full
    null distribution at every prime is archived, not only its mean and standard deviation;
    (8) the leave-one-out range of every correlation is reported.
  falsification_criterion:
    - >-
      Multiple small-height models correlate beyond the Holm-corrected band while the
      large-height control and the curve-free arm do not. H-null is falsified at this prime
      count; the record STOPS for independent review before stating a height-driven signal.
    - >-
      The curve-free arm correlates. The correlation belongs to the shape "one fixed object, many
      reductions" and NOT to elliptic curves or to height; the height reading is withdrawn.
    - >-
      Exactly one small-height model correlates. Read as a curve-specific artifact and reported
      at that size, with accidental near-CM and small conductor named as the candidate causes and
      checked; it does NOT support a height-class effect.
    - >-
      The null arm correlates or the seed audit fails. Instrument failure; no mathematical
      conclusion in either direction.
    - >-
      Every correlation's interval contains 0 but the achieved resolution is wider than the
      smallest effect that would matter. The run is INCONCLUSIVE and reports the resolution it
      achieved rather than a closure of the title clause.
  required_artifacts:
    - manifest.yaml with exact command, commit sha, dirty-tree state, resolved inference block, environment, and the NAMED machine
    - the Stage 0 frozen design and its hash - primes, models, matching criteria, permutation scheme, shape check, resolution thresholds
    - the non-CM verification output per small-height model at the ten screening primes
    - the null arm's cross-prime correlation, written and timestamped before any fixed-global arm was run
    - the seed lineage for every null draw and the seed audit's assertion output
    - the curve-free arm's full results on the identical prime set, written before Stage 3
    - raw-result.json with the exact integer functional values per arm per prime and the FULL null distribution per prime
    - both z-score and rank correlation columns with exact permutation p-values and Holm correction
    - the leave-one-out correlation ranges, the prime-gap breakdown, and the achieved resolution per cell
    - the serial correlation of the local discriminant sequence per model
    - wall-clock seconds and peak RSS per prime on the named machine
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not confer approval. status is designed, frozen is false,
      execution_authorized is false, approved_by is null.
    - >-
      Approval must fix the expansion rule for the curve-free arm. That arm is the control that
      decides whether the run may say anything about curves, and an expansion rule chosen after
      seeing the curve arms would destroy its value.
    - >-
      Approval must fix the resolution threshold per cell. With twenty primes the achievable
      resolution on a correlation is modest, and whether an H-null result is a closure or an
      inconclusive bound is decided by that number, not by the data.
  derivation_provenance:
    tool: coordinator-authored contract under TASK-20260904-8f2f95
    source_record: IDEA-20260828-2b2bb2
    authored_at: '2026-09-04'
    note: >-
      The tracked object, the per-prime matched null, the null-adjusted deviation, the
      replication pack, the large-height nearby object, the prime-gap control, the seed audit and
      the five falsification conditions are taken from the parent proposal and restated as
      measured quantities with units and decision rules. Added by this contract: the CURVE-FREE
      fixed-seed arm required by the standing scope constraint, the requirement that the
      within-prime functional be exact rather than sampled, the archived full null distribution
      with a shape check gating the legitimacy of the z-score, and the rank-based
      distribution-free alternative. No numeric band appears in this contract; all bands are
      derived in Stage 0.
  derivation_gaps:
    - >-
      Sato-Tate is asymptotic and twenty primes is not asymptotic. The expectation behind H-null
      is therefore a heuristic rather than a bound, and the contract measures the discriminant
      sequence's own serial correlation instead of relying on it.
    - >-
      The matching of null draws on four criteria simultaneously may be infeasible at some
      primes. The contract requires the achieved tolerance to be reported per cell and refuses
      cells with fewer than 30 matched draws, which means some cells may be dropped and the
      effective k reduced; that reduction is reported, never absorbed.
    - >-
      The curve-free expansion rule is a design choice with no canonical form. A different rule
      would be a different null. This is disclosed rather than presented as neutral, and the rule
      is frozen before any curve arm runs.
    - >-
      The height threshold |A|, |B| at most 5 is a convention. A different threshold would select
      a different pack, and the record cannot distinguish "small height" from "small
      coefficients" at this scale.
