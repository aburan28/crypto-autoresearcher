experiment:
  id: EXP-EQIC-f77123
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-5dfe4a
  question_id: RQ-EQIC-8cb959
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'CLOSURE WITH A NAMED OBSTRUCTION: on a prime-order subgroup every phi-IMAGE of a relation
    carries rank increment exactly ZERO, so no phi-stable factor base can reduce the NUMBER OF DECOMPOSITION
    SEARCHES; the only surviving levers are the unknown count (a constant r, already published) and
    the algebraic cost of the decomposition test -- with forward guidance naming the three classes
    of construction that escape the argument'
  status: draft
  objective: "(A) THE OBSTRUCTION, NAMED. Let G = <P> have PRIME order N, let phi be any endomorphism\
    \ of E defined over F_p, and let lambda in Z/N be the scalar by which phi acts on G (H-ENDO-001:\
    \ End(G) = Z/N because N is prime, so every endomorphism restricts to a scalar; for the j = 0\
    \ automorphism phi(x,y) = (zeta_3 x, y) the scalar satisfies lambda^2 + lambda + 1 = 0 mod N,\
    \ because 1 + phi + phi^2 = 0 in End(E)). Let a relation be any identity of the form\n  R_t =\
    \ sum_i eps_i Q_i,   with R_t = a_t P + b_t Q and Q_i in the factor\n  base, contributing the\
    \ equation\n  a_t + b_t k = sum_i eps_i * log(Q_i)   (mod N).\nThen applying phi to that identity\
    \ yields\n  phi(R_t) = sum_i eps_i phi(Q_i),  i.e.\n  lambda (a_t + b_t k) = sum_i eps_i lambda\
    \ log(Q_i)  (mod N),\nwhich is lambda TIMES the original equation. Since lambda is a unit mod\
    \ N (lambda^2 = -lambda - 1 and gcd(lambda, N) = 1 because N is prime and lambda != 0), the two\
    \ equations span the same one-dimensional subspace. THE RANK INCREMENT OF A phi-IMAGE RELATION\
    \ IS EXACTLY ZERO. This holds for every endomorphism, every factor base, every arity, and every\
    \ target, and it is unconditional given only that N is prime.\n(B) THE IMMEDIATE COROLLARY THAT\
    \ CLOSES THE NAIVE LANE. Whatever the factor base V, the number of INDEPENDENT relations obtainable\
    \ is bounded by the number of unknowns, and the number of DECOMPOSITION SEARCHES needed to obtain\
    \ them is (number of unknowns) / (probability a search succeeds). Making V phi-stable changes\
    \ the numerator, from |V| to |V| / r where r is the order of phi's action on x-coordinates, because\
    \ the logs of an orbit are determined by one representative. It does NOT change the denominator:\
    \ the probability that a random target decomposes over V is a function of |V| and the arity, not\
    \ of whether V is orbit-structured -- and on j = 0 curves that is not even a heuristic, since\
    \ the on-curve condition depends only on x^3 (IDEA-20260807-4d7e8e). Therefore, AT MATCHED |V|:\n\
    \  searches(phi-stable) / searches(random) = 1 / r  exactly,\n  and this is the whole effect.\
    \ Emitting phi(R) and phi^2(R) alongside R\n  produces r rows and 1 equation, so any metric counting\
    \ ROWS reads a\n  spurious extra factor of r.\n\n(C) WHY THIS IS A CLOSURE AND NOT A FATIGUE REPORT\
    \ (docs/inventor-protocol.md section 4). It has (i) a NAMED OBSTRUCTION -- End(G) = Z/N for prime\
    \ N, so the phi-action on the relation space is a scalar and fixes every subspace; (ii) an ARGUMENT\
    \ -- four lines, above, with no heuristic; and (iii) FORWARD GUIDANCE naming what remains open,\
    \ below. It is not \"we screened N mechanisms\". It states exactly which quantity cannot move\
    \ and why, and it is checkable by a reader in a minute.\n(D) FORWARD GUIDANCE: THE THREE CLASSES\
    \ THE ARGUMENT DOES NOT REACH. The argument uses exactly two hypotheses -- that N is prime, and\
    \ that a relation is a Z-linear identity among factor-base logs. Drop either and it fails:\n \
    \ CLASS 1 -- LEAVE THE PRIME-ORDER SUBGROUP. If relations are collected in\n    E(F_p) of order\
    \ h*N with cofactor h > 1, or in a group where End is not\n    Z/N, then phi is not a scalar and\
    \ phi-images can be independent. This is\n    the honest escape, and it is also why the argument\
    \ says nothing about\n    higher-genus Jacobians or about E(F_{q^n}) with n > 1 -- exactly the\n\
    \    settings in which the published endomorphism-index-calculus results live\n    (Tsakou-Ionica,\
    \ F_{q^n}, n > 1). Cost note: over prime-field ECDLP the\n    cryptographically relevant subgroup\
    \ IS prime-order by construction, so\n    this class is empty for the campaign's target family\
    \ and non-empty only\n    for the toy or structured instances.\n  CLASS 2 -- CHANGE WHAT A RELATION\
    \ IS. The argument bounds Z-LINEAR\n    relations among logs. A \"relation\" that is not of that\
    \ form -- a\n    multiplicative relation, a relation among x-coordinates as field\n    elements,\
    \ an algebraic identity used as a constraint rather than as a\n    row -- is outside its scope.\
    \ This is the class that\n    IDEA-20260807-1ea327, IDEA-20260807-eeb226 and IDEA-20260807-e57607\n\
    \    occupy: they change the ALGEBRAIC COST of finding a relation, which the\n    obstruction\
    \ does not bound at all.\n  CLASS 3 -- USE phi ON SOMETHING THAT IS NOT A POINT OF G. The obstruction\n\
    \    is about the action on G. phi also acts on the x-line, on the function\n    field, on E[l]\
    \ for l != N, on the isogeny graph, and on the curve\n    equation. Lanes L2, L5, L7 and L11 of\
    \ DECOMPOSITION.md occupy that\n    space, and this closure says nothing about them.\n  NOT A\
    \ CLASS, STATED SO IT IS NOT MISREAD AS ONE: \"use more endomorphisms\".\n  Adding r independent\
    \ endomorphisms adds r scalars, r coordinates and no\n  new congruence; the index stays N (H-ENDO-001).\n\
    \n(E) WHAT THIS RECORD DELIBERATELY DOES NOT CLOSE. It does not close L4. It closes ONE mechanism\
    \ inside L4 -- \"use phi to manufacture extra independent relations\" -- and it does so in order\
    \ to protect the lane's budget for the mechanisms in CLASS 2, which it explicitly leaves open.\
    \ It also does not declare any direction impossible: CLASS 1 and CLASS 3 name concrete settings\
    \ in which the same phi does produce independent relations."
  resource_label: R3 applied to points of G only, which is precisely why the mechanism closed here
    is inadmissible; the surviving classes named in claim (D) consume R1, R2 and R5 instead
  admissibility: inadmissible_generic_group
  admissibility_argument: 'FILED AS AN INADMISSIBLE MECHANISM WITH ITS OBSTRUCTION NAMED, per the
    BATCH-cb71b5 brief non-negotiable 1. The mechanism this record closes -- obtaining additional
    relations by applying phi to collected relations -- uses phi ONLY as a map on points of G. Producing
    phi(R) from R costs one scalar multiplication by lambda, which a generic-group simulator performs
    with group operations alone; this is exactly Oracle D of KN-FIND-b7e091, which is GGM-simulable
    and therefore closed at exponent 1/2 by Shoup''s bound. The closure in claim (A) is the concrete,
    quantitative form of that abstract closure for the relation-collection setting: not merely "no
    better than sqrt(N)" but "rank increment exactly 0". The proposals this record clears the way
    for (IDEA-20260807-1ea327, -eeb226, -5ddccf, -e57607) are admissible for the different reason
    that they operate on x-coordinates as field elements and on the polynomial system, which the simulator
    cannot touch.'
  reachability_gate: 'NOT APPLICABLE TO THE ARGUMENT, WHICH IS CURVE-INDEPENDENT: claim (A) holds
    for every curve with prime-order G, so no isogeny walking, no curve selection, and no T5 reachability
    cost enters. The one place reachability would bind is the CLASS 1 boundary instance, which is
    CONSTRUCTED (choose a curve with 3 | h) rather than reached, at cost O(1) trials. T4 does bind
    on the j = 0 specialisation used for the numerical exhibition, but the closure itself does not
    depend on j = 0.'
  inputs:
    procedure: 'THE CHEAPEST VALID DISCRIMINATOR IS STEP 2 AND IT COSTS SECONDS: on one 12-bit j =
      0 instance, form one relation''s reduced row and its phi-image''s reduced row and check the
      second equals lambda times the first over F_N, right-hand side included. That single check either
      exhibits the closure or destroys it. STEP 1 (lambda verification) is its precondition. STEP
      3 (the rank curve to full rank at one instance, reporting 3m rows against m searches) costs
      minutes and produces the reportable pair. STEP 4 (the CLASS 1 boundary on a cofactor-3 toy curve)
      costs an hour and is what makes the closure scoped rather than absolute; it is the only part
      that needs new instance-generation code. Anti-null and random-unit control are two extra lines
      each.'
    mechanism: 'This record''s "mechanism" is the argument itself, plus the minimal numerical check
      that the argument is not a transcription error.

      STEP 1 -- STATE THE SCALAR. For a generated j = 0 instance, compute lambda as a root of X^2
      + X + 1 mod N (two roots; pick the one matching the chosen zeta_3) and verify numerically that
      phi(P) == [lambda] P and phi(Q) == [lambda] Q with the harness point arithmetic. If this fails
      the instance is invalid, not the argument.

      STEP 2 -- EXHIBIT THE ZERO INCREMENT. Collect one genuine relation over a phi-stable base, form
      its reduced row over the m orbit unknowns (entry eps_i lambda^{c_i} at column j_i, right-hand
      side (a_t, b_t)), then form the reduced row of phi(R) and check by exact linear algebra over
      F_N that the second row equals lambda times the first, coordinate for coordinate and including
      the right-hand side. Repeat for phi^2. This is a two-line check and it converts claim (A) from
      an argument into an exhibited instance.

      STEP 3 -- EXHIBIT THE FULL-RANK CONSEQUENCE. Collect until the reduced system has rank m, recording
      the rank after every insertion, with orbit closure ON. The rank curve must rise by 1 on every
      base relation and by 0 on every closure row, and the total number of rows at full rank must
      be exactly 3m while the number of successful searches is exactly m. Report both numbers side
      by side; that pair IS the closure, made visible.

      STEP 4 -- EXHIBIT A CLASS-1 ESCAPE, so the closure''s boundary is not merely asserted. On a
      toy curve whose group is E(F_p) of order h*N with h divisible by 3 (deliberately chosen), collect
      relations in the FULL group rather than in G. There End(full group) is not Z/N, phi need not
      act as a scalar, and the phi-image row need NOT be a multiple of the original. Measure the rank
      increment. A nonzero increment there is not a contradiction; it is the boundary of the closure,
      exhibited, and it is what makes the closure a scoped statement rather than an impossibility
      claim.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - anti-null: a genuinely independent relation must give increment 1
  - random unit c in place of lambda must give increment 0
  - phi = identity fixture must give increment 0 trivially
  - 'CLASS 1 boundary: full group with 3 | h, where increment 1 must be reachable'
  - certificate re-verification of every collected relation
  - lambda verified numerically as phi(P) == [lambda] P on every instance
  - 'NULL OBJECT (from the proposal): MANDATORY AND SUPPLIED, and for a closure the null runs in the
    OPPOSITE direction from usual: the risk is not a spurious signal but a spurious ABSENCE, i.e.
    a rank meter that reports 0 increment because it is broken. MATCHED NULL (anti-null / planted
    signal): insert into the same rank meter, on the same instance, a relation that is genuinely independent
    -- a fresh decomposition of an unrelated target. The meter must report increment 1. A meter that
    reports 0 for both is measuring nothing and the closure is unsupported by measurement (though
    the argument stands on its own). DECAY PARAMETER: the cofactor h of the collection group in STEP
    4. As h grows through values divisible by 3 the phi-image rank increment must become ABLE to be
    nonzero; if it stays identically 0 even in the full group with 3 | h, the instrument is not distinguishing
    the two settings and STEP 4''s boundary exhibition is void. This is the decay parameter that must
    destroy the effect, run in reverse: the parameter whose increase must RESTORE independence. SECOND
    NULL: a random unit c in Z/N replacing lambda -- the row c * (row) must also give increment 0.
    This confirms the meter is detecting scalar multiplicity rather than something specific to lambda,
    which is the correct behaviour and separates the closure from a numerological coincidence about
    the particular value of lambda.'
  independent_variables: []
  metrics:
    primary:
    - rank increment per inserted row, labelled base / phi-image / control
    - rows at full rank and successful searches at full rank, as two integers
    - lambda, its minimal polynomial mod N, and the verification result
    - cofactor h and group order for the CLASS 1 instance
    secondary:
    - the exhibited counterexample row, if any, recorded verbatim
  heuristic_under_test: null
  preregistered_prediction:
    quantity: rank increment over F_N of a phi-image relation row, inserted after its source row
    formula: 'Exactly 0, at every instance, every arity, every base. Zero tolerance: this is an algebraic
      prediction, not a statistical one. A single counterexample at prime N would falsify claim (A)
      and would be the most significant observation the lane could produce.'
    source: pre-registered in IDEA-20260807-5dfe4a before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - lambda AMBIGUITY. X^2 + X + 1 has two roots mod N; the one matching the chosen zeta_3 must be
    selected, or STEP 2 will report a mismatch that looks like a falsification and is a sign error.
    The numerical check phi(P) == [lambda] P disambiguates and must be run first.
  - NON-PRIME N. If the harness's factorisation picks an n that is not actually prime, End(G) is not
    Z/N and the argument does not apply. The committed _generate_j0_instance takes n = max(sympy.factorint(order)),
    which is prime by construction, but the primality must be recorded per instance rather than assumed.
  - RIGHT-HAND SIDE OMISSION. If the row is stored without (a_t, b_t) -- which is the state DEC-20260727-009
    R3 records for this line of work -- then "row of phi(R) = lambda times row of R" is checked on
    an incomplete object and the check is not the one claimed. The right-hand side must be included.
  - SIGN CONVENTION. Negation acts trivially on x, so the sign eps_i is a choice of lift; an inconsistent
    choice between the source row and the phi-image row will break the scalar identity for reasons
    that have nothing to do with claim (A).
  - COFACTOR INSTANCE CONSTRUCTION. Finding a toy curve with 3 | h and a workable structure may require
    search; a failed search is a budget outcome, not a mathematical one.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'Exactly 0, at every instance, every arity, every base. Zero tolerance: this
    is an algebraic prediction, not a statistical one. A single counterexample at prime N would falsify
    claim (A) and would be the most significant observation the lane could produce.'
  falsification_criterion:
  - A phi-image row is NOT lambda times its source row over F_N at prime N. Claim (A) is false as
    stated; the record is superseded, not amended; and the instance is preserved verbatim because
    it would be the single most important artifact in this lane.
  - The anti-null reads 0. The rank meter is broken; no zero it reported is informative; the argument
    in claim (A) still stands on its own, but the record must state that its numerical exhibition
    failed.
  - No CLASS 1 instance can be constructed within budget. The boundary is then ASSERTED, not exhibited,
    and the record must label it so. This is a budget outcome under AGENTS.md rule 5 and is not evidence
    that the boundary does not exist.
  - Someone demonstrates a relation notion outside CLASS 2 that is nonetheless Z-linear in factor-base
    logs and gains from phi. That would mean the enumeration in claim (D) is incomplete, which is
    a defect in the forward guidance rather than in the obstruction, and it should be recorded as
    such.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-5dfe4a
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
