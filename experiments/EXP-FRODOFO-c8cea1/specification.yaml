experiment:
  id: EXP-FRODOFO-c8cea1
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-9bec34; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-9bec34
  question_id: RQ-FRODO-a2dbe2
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Calibration of a quantifier-order linter over binder-sequence encodings: false-positive
    rate on correct-by-construction statements, per-class detection rates against a four-class mutation
    catalogue, and a two-encoder human agreement measurement.'
  objective: 'One uncertainty is reduced: whether a syntactic quantifier-order check has enough power
    to be worth running, and whether the human encoding it depends on is reproducible. (i) DOES IT
    AVOID CRYING WOLF. On correct-by-construction statements across binder counts and edge densities,
    what is the false-positive rate, and is it low enough that the tool would not be silenced? (ii)
    DOES IT CATCH ANYTHING. Against the four named mutation classes, forward dependency edge, binder
    swap, witness moved earlier, and scope splitting, what is the per-class detection rate, and what
    is the rate on randomly shuffled binder orders as a coarse power floor? Both directions must be
    reported together, since an always-pass stub and an always-fail stub each score perfectly on one
    of them, and both stubs are run to fix the endpoints of the scale. (iii) IS THE ENCODING REPRODUCIBLE.
    Given one short prose reduction statement and two independent encoders working from the frozen
    format, how often do the binder orders and the edge sets agree? This bounds everything the tool
    can deliver and is the number most likely to sink it. No FrodoKEM statement is used and none is
    asserted about.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: for the frozen encoding format,
      the specific generator, the specific four-class mutation catalogue and the specific prose statement
      used, the linter achieved the measured false-positive rate, the measured per-class detection
      rates and the measured shuffled-order rate, and the two independent encodings agreed at the
      measured rate. WHAT DOES NOT FOLLOW: nothing about the soundness of any reduction, nothing about
      FrodoKEM, no security consequence, and no claim that the tool would detect defects outside the
      self-authored catalogue. A clean lint on any future statement will remain a syntactic observation
      about an encoding produced by a human, and this run does not license reading it as anything
      stronger.'
  inputs:
    procedure: 'STAGE 0, freeze the encoding format and register the four mutation classes and the
      uniformity-annotation convention before writing any code that consumes them. Cost: human. STAGE
      1, implement the three checks and the two stub linters (always-pass, always-fail). Cost: implementation.
      STAGE 2, implement the correct-by-construction generator with binder count and edge density
      as parameters, plus the nesting-required detector. Cost: implementation. STAGE 3, false-positive
      measurement over 1000 correct statements per (binder count, edge density) cell. Cost: minutes.
      STAGE 4, mutation calibration: 1000 statements per class per cell, per-class detection rates
      with binomial intervals. Cost: minutes. STAGE 5, shuffled-order power check over 1000 statements
      per cell. Cost: minutes. STAGE 6, stub endpoints through the identical harness. Cost: seconds.
      STAGE 7, human agreement: one short prose reduction statement, two independent encoders working
      from the frozen format without conferring, agreement computed on binder order and on edge set
      separately and jointly. Cost: human, no compute. STAGE 8, immutable run records via harness/runner.py
      including the frozen format, the catalogue and the resolved inference block.'
    instrument: 'Python 3 standard library only: dataclasses for the binder and edge representation,
      a hand-written topological check for forward edges rather than a graph library, so the check''s
      semantics are auditable in the record; random.Random with recorded seeds for the generator and
      the mutator; an exact Clopper-Pearson implementation for the rate intervals. The encoding format
      is a small JSON schema stored as a frozen artifact alongside the run. No Sage, no proof assistant,
      no external solver, no lattice estimator. Run manifests and resolved inference block through
      harness/runner.py; ids via tools/allocate_id.py.'
    parameters: 'Binder counts 4, 6, 8, 12; edge densities 0.1, 0.25, 0.5 of the maximum admissible
      backward edges; sorts drawn from the seven-element sort list; 1000 statements per cell for each
      of the correct arm, each of the four mutation classes, and the shuffled arm, giving 6 arms times
      12 cells times 1000 statements. Uniformity annotations present on half the generated statements.
      Two stub linters. Human agreement: 1 prose statement of at most 200 words, 2 independent encoders,
      no conferring, agreement scored by exact match on ordered binder list and by Jaccard similarity
      on the edge set.'
  controls:
  - Correct-by-construction statement generator, giving the false-positive rate.
  - Four-class mutation catalogue as the positive control, giving per-class detection rates.
  - Randomly shuffled binder orders as the coarse power check.
  - Two independent human encodings of one prose statement, giving the encoding agreement rate.
  - Nesting-required detector, reporting the fraction of generated statements a flat encoding cannot
    represent.
  - An always-pass and an always-fail stub linter run through the identical harness, establishing
    the endpoints of the detection and false-positive scales.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): CORRECT-BY-CONSTRUCTION statements, generated so that no forward edge
    and no uniformity violation exists, passed through the IDENTICAL linter in the same invocation
    as the mutated ones. The null must produce a false-positive rate at or near zero; a linter that
    flags correct statements is worse than no linter, because it will be silenced. The positive side
    of the same control is the mutation catalogue: each named mis-ordering must be detected at a measured
    rate, and a mutation class with a low detection rate is a stated blind spot rather than a hidden
    one. A third control is a SHUFFLED encoding whose binder order is randomly permuted, which should
    be flagged at a high rate; if random permutations are rarely flagged, the checks are too weak
    to matter regardless of the catalogue results.'
  independent_variables:
  - 'arm: correct, forward-edge mutation, binder-swap mutation, witness-moved-earlier mutation, scope-splitting
    mutation, shuffled order'
  - 'binder count: 4, 6, 8, 12'
  - 'edge density: 0.1, 0.25, 0.5'
  - 'linter: real, always-pass stub, always-fail stub'
  - presence of a uniformity annotation
  metrics:
    primary:
    - false-positive rate on the correct arm with binomial interval
    - detection rate per mutation class with binomial interval
    - detection rate on the shuffled arm
    - human encoding agreement on binder order (exact match) and on edge set (Jaccard)
    - fraction of generated statements flagged as requiring nesting
    secondary:
    - stub endpoint rates
    - rate dependence on binder count and edge density
    - which of the three checks fired, per detection
    - wall-clock for the full matrix
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The joint pair (false-positive rate on correct statements, detection rate on the forward-edge
      mutation class), and the shuffled-order detection rate as a power floor.
    formula: 'Registered before the run: false-positive rate at most 0.01 on the correct arm, where
      a false positive is any of the three checks firing on a statement generated to satisfy all three;
      forward-edge detection rate at least 0.95; scope-splitting detection rate at least 0.6; shuffled-order
      detection rate at least 0.8; always-pass stub false-positive rate exactly 0 and detection rate
      exactly 0; always-fail stub detection rate exactly 1 and false-positive rate exactly 1. Rates
      are reported per cell and pooled only after the per-cell values are shown.'
    source: Pre-registered in the parent proposal IDEA-20260816-9bec34 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The tested statements are synthetic binder sequences of 4 to 12 binders generated
      by this experiment, and the human agreement measurement uses one short prose statement. TRANSFER
      ASSUMPTION, stated plainly: detection and false-positive rates transfer to real statements only
      insofar as real statements resemble the generator''s output in binder count, edge density and
      defect distribution, which is precisely what a self-authored generator cannot establish. The
      rates are therefore properties of the calibration set, and the honest transferable output is
      the tool plus its measured blind spots, not the rates themselves.'
    correspondence: null
  tail_checks:
  - Report per-cell rates before any pooled rate, since a tool that fails only at high binder counts
    would be hidden by pooling.
  - Report which check fired for each detection, since a single check carrying every detection means
    the other two are inert.
  - Report the worst-performing mutation class explicitly as a stated blind spot rather than averaging
    it away.
  - Report the nesting-required fraction at the highest binder count, where it is expected to be largest.
  - Report the two encoders' disagreements individually rather than only as a rate, since the KIND
    of disagreement determines whether the format can be fixed.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report if either stub linter fails to produce its endpoint values, since the harness
    would be broken.
  - Halt the calibration if the false-positive rate on the smallest cell already exceeds the pre-registered
    threshold, and report that cell.
  - No compute cap is needed; the full matrix runs in minutes.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The false-positive rate on correct statements is at or below the pre-registered
    threshold in every cell, the forward-edge detection rate is at or above its threshold in every
    cell, the shuffled-order rate meets its floor, both stubs return their endpoint values, and the
    human agreement rate is reported with its disagreement kinds regardless of value.
  falsification_criterion:
  - The false-positive rate exceeds the pre-registered threshold in any cell.
  - The forward-edge detection rate falls below its threshold in any cell.
  - The shuffled-order detection rate falls below its floor, showing the checks lack power.
  - A stub linter fails to produce its endpoint values.
  - A large fraction of generated statements require nesting, so the flat format does not cover the
    domain.
  - The two independent encodings disagree on binder order more often than they agree, making a lint
    result a property of the encoder.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-9bec34
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The uniformity-annotation convention is described but not specified; a Coordinator must fix exactly
    what an encoder is asserting when annotating a claim as uniform in a sort, since the whole uniformity
    check depends on it.
  - The circularity between a self-authored generator and a self-authored checker is unresolved by
    this design; a Coordinator should decide whether an independently authored generator is required
    before the rates are treated as meaningful.
  - The prose statement used for the human agreement measurement is not chosen; it must not be a FrodoKEM
    statement, since none is filed, and the substitute must be selected by a Coordinator rather than
    by the encoders.
