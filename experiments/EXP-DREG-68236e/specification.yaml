          "quotient": "W_F,E is the least F2-linear subspace of B_<=E containing the eligible normalized core generators and closed under g -> NF_B(mu*g) for every squarefree monomial mu satisfying deg(g)+deg(mu)<=E. The degree budget is tested before normalization. Testing only deg(NF_B(mu*g))<=E defines an incompatible instrument and is a known-false semantic control.",
          "raw_one_shot": "U_F,E is the span of the products of each original generator by every permitted monomialmu with deg(mu)+deg(f_i)<=E, without closure feedback. For Q mode products are normalized after this degree-sum test. Report its basis and target intersections separately; U is not renamedV orW.",
