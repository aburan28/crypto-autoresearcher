# EXP-ECDLP-38d6a7
# Threshold arithmetic. No walk is run.
# Approved by DEC-20261003-838994.
experiment:
  id: EXP-ECDLP-38d6a7
  hypothesis_id: H-ECDLP-fe2646
  source_idea: IDEA-20261003-0c5564
  question_id: RQ-ECDLP-bc7a54
  version: 1
  title: Cleared values of the thresholds 1 and 1/2
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-838994
  objective: >-
    Check the values 2 and 1, the product 2, and the nearby gap 0.
  inputs:
    value_hi: 2
    value_lo: 1
    denominator: 2
    threshold_gap: 1
    threshold_product: 2
    threshold_sum: 3
    nearby_a: 1
    nearby_b: 1
    nearby_gap: 0
    nearby_product: 1
  controls:
    - >-
      Two times 1 is 2. Two times 1/2 is 1. Reporting both values
      as 1 drops the gap and invalidates the run.
    - >-
      Two exceeds one by 1. The product of the two values is 2.
      Their sum is 3.
    - >-
      Two readings of the lower value are both 1. Their gap is 0
      and their product is 1.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {clear, subtract}
  metrics:
    primary:
      - value_hi
      - value_lo
      - threshold_gap
      - implementations_agree
    secondary:
      - threshold_product
      - threshold_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Two times 1 is 2. Two times 1/2 is 1. The gap of two lower
      values is 0.
    formula: >-
      Multiply 1 by 2. Multiply 1/2 by 2. Subtract 1 from 2.
      Multiply 2 by 1. Subtract 1 from 1.
    source: >-
      IDEA-20261003-0c5564 writes the thresholds 1 and 1/2, read
      2026-10-03. The values, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No walk was run.
  scale_relevance:
    tier: toy
    justification: Two written thresholds. No transfer to a walk cost.
    correspondence: null
  tail_checks:
    - The product 2 and the nearby gap 0 are required. A check that stops at the value 2 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the value 2 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two times 1 is not 2.
    - Two times 1/2 is not 1.
    - The gap is not 1.
    - The product is not 2.
    - Both values are reported as 1, or a walk is run.
  success_criterion: >-
    Both runs agree that two times 1 is 2, that two times 1/2 is 1,
    and that 2 exceeds 1 by 1.
  falsification_criterion: >-
    The runs agree that the upper value is computed, and that value
    is not 2.
  required_artifacts:
    - experiments/EXP-ECDLP-38d6a7/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-38d6a7/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-38d6a7/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-38d6a7/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-38d6a7/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-38d6a7/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any walk, hint-family pricing, or scalar recovery.
    - Any claim that a threshold gap of 1 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
