experiment:
  id: EXP-AES-adf624
  hypothesis_id: H-AES-d677fa
  derived_from_idea: IDEA-20260805-01dfba
  question_id: RQ-AES-002
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Verifier-independence audit of the AES campaign's certificate gate: measured
    availability, measured linkage, and a layer-stratified mutation matrix with a
    known-dependent null read before the campaign pair and a layer-disjoint positive
    control read first
  objective: >-
    The one uncertainty a run reduces is how many INDEPENDENT verification layers
    actually back the campaign's certificate gate in the container a dispatched task
    runs in. A run establishes (i) whether the declared verifier pair is available at
    all in the dispatched interpreter, measured under a receipt rather than recalled;
    (ii) whether the two candidate verifiers share a crypto library, by linkage
    evidence and by a controlled experiment rather than by inference from import
    paths; (iii) the catch rate of the pair on single-bit mutations STRATIFIED BY
    RESIDENT LAYER, whose forced values are 0 under sharing and the full count under
    disjointness with nothing between; (iv) the 9-term S-box interpolation identity on
    every verifier's effective S-box, as a definition-level integrity check obtainable
    without trusting any implementation; and (v) the resulting independent_layer_count
    with its declared out-of-threat-model residual. NOTHING IN THIS CONTRACT IS A
    STATEMENT ABOUT AES AT ANY ROUND COUNT.
  what_this_is_not:
    - >-
      Not cryptanalysis. No distinguisher, no key recovery, no cost claim, no barrier
      claim, and no statement about AES at any round count. It audits the instrument
      that would adjudicate cryptanalysis.
    - >-
      Not an establishment that any verifier is CORRECT. Correctness is not testable
      from inside the stack being tested, and the contract refuses that reading in
      advance.
    - >-
      Not a status change to any AES hypothesis, evidence record, decision or goal, and
      not a promotion of any knowledge entry. A failure here is an infrastructure
      finding, never negative mathematical evidence (AGENTS.md rule 5).
    - >-
      Not a re-use of any figure measured outside the harness. Every value the parent
      proposal reports as session-measured is RE-TAKEN here under a receipt, and a
      discrepancy is reported rather than reconciled.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or
      evidence. No run has been executed under this contract.
  claim_ceiling:
    tier: instrument_audit
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: in THIS container on THIS date, the declared verifier
      pair was or was not available; the candidate verifiers did or did not share the
      crypto library on the linkage evidence obtained; and the pair's catch rate on the
      declared mutation set, per resident layer, was [values]. WHAT DOES NOT FOLLOW: no
      claim that any verifier is correct; no claim about AES; no claim about any other
      container or any other date; and specifically NOT that the residual beneath the
      interpreter has been addressed - it is declared out of the threat model and that
      declaration must travel with any certificate relying on this instrument.
  inputs:
    procedure: >-
      STAGE 0 (one shell invocation, seconds, RE-MEASUREMENT UNDER A RECEIPT): record
      the availability of the declared verifier pair, the installed package list, the
      command-line tool's version, and the presence of a compiler, its AES intrinsic
      support, and the numeric library - verbatim commands, exit codes and stdout. A
      discrepancy against the parent proposal is REPORTED, not reconciled. If the
      declared pair is available, hypothesis part (A1) is falsified at this line and the
      audit continues at STAGE 2 only.
      STAGE 1 (minutes, zero cryptanalysis): establish BY MEASUREMENT whether the two
      candidate verifiers share a crypto library - linkage inspection of the extension
      module, agreement of reported library version strings, and a controlled experiment
      in which one stack is pointed at a modified library while the other is not.
      Inference from import paths is not evidence and is not accepted here.
      STAGE 2 (minutes): build the from-specification verifier from the definition -
      inversion in GF(2^8) composed with the fixed affine map - check the specification's
      known answers, and compute the univariate interpolation of EVERY verifier's
      effective S-box, reporting the coefficient list.
      STAGE 3 (under an hour): the mutation matrix. Plant at least 32 single-bit
      mutations at each of four declared resident depths. Admit a mutation only after
      showing it changes a SINGLE-verifier output; record every discard with its reason.
      Read the POSITIVE CONTROL first, then the KNOWN-DEPENDENT NULL, and only then the
      campaign's declared pair.
      STAGE 4 (zero compute): report independent_layer_count, the declared residual, and
      the exact sentence the outcome licenses - together with the sentences it does not.
    instrument: >-
      Shell measurement recorded verbatim, plus pure Python 3.11. The from-specification
      AES verifier is written from the definition and shares no layer below the
      interpreter - no vendored tables, no extension module. Exact GF(2^8) arithmetic for
      the interpolation identity, with the identity re-derived symbolically rather than
      assumed. Recorded through harness/runner.py, so that every figure in the run record
      is a harness measurement and not a session recollection.
    parameters: >-
      Three verifier pairs: the campaign's DECLARED pair (or its substitute if the
      declared one is unavailable); a KNOWN-DEPENDENT pair, being the same command-line
      tool invoked through two different wrappers; and a LAYER-DISJOINT pair, being the
      from-specification implementation together with the command-line tool. Four
      resident mutation depths: one verifier's own wrapper; a wrapper shared by both; the
      shared crypto library; and the constant tables compiled into the from-specification
      verifier. At least 32 admitted mutations per (pair, depth) cell.
  controls:
    - >-
      POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR, read FIRST. The
      layer-disjoint pair must catch EVERY admitted mutation resident in either stack -
      forced value, the full count. If it does not, the instrument is broken and NO
      negative result may be reported at all, from any arm.
    - >-
      NULL OBJECT OF THE SAME SHAPE, AND IT CAN FAIL, read SECOND. The known-dependent
      pair - one command-line tool behind two wrappers - has forced values: shared-layer
      catch rate EXACTLY 0, known-answer pass rate EXACTLY 1. If this pair catches ANY
      shared-layer mutation, the harness is planting faults that are not actually shared,
      the layer model is wrong, and the whole audit is redesigned before the real arm is
      read.
    - >-
      VERDICT-ON-THE-NULL-FIRST. The frozen decision rule is executed on the
      known-dependent pair BEFORE the campaign's declared pair is looked at. If it emits
      the same label on both, the rule discriminates nothing and is rewritten first.
    - >-
      GRADED CONTROL, four resident depths, monotonicity reported. Catch rate must be
      monotone non-increasing in depth of sharing. A non-monotone profile localises an
      artifact in the mutation harness rather than leaving "the verifiers disagree
      sometimes" as the finding.
    - >-
      DEAD-CODE CONTROL, closing a named confound by construction. Every planted mutation
      is first shown to change a SINGLE-verifier run's output before it enters the pair
      comparison. A mutation that changes nothing is discarded and the discard is recorded
      with its reason - otherwise a catch rate of 0 could mean "shared layer" OR "dead
      code" and the two are indistinguishable.
    - >-
      LINKAGE-EVIDENCE CONTROL. Sharing is established by linkage inspection plus a
      controlled library-substitution experiment, never by inference from import paths.
      Where linkage cannot be determined, the run says so explicitly rather than guessing.
    - >-
      DEFINITION-LEVEL INTEGRITY CHECK. The 9-term S-box interpolation identity is
      computed on every verifier's effective S-box. It detects a single altered table byte
      with certainty and requires trusting no implementation, which is exactly the
      property the rest of the audit is trying to establish.
    - >-
      RE-MEASUREMENT CONTROL. Every value the parent proposal labels session-measured is
      re-taken at STAGE 0 under a receipt. A discrepancy between the record and the
      measurement is REPORTED, not reconciled - the record is not repaired to match.
    - >-
      ARCHIVE CHECK, zero compute. Enumerate any archived measurement of this observable
      in this repository, and record its ABSENCE as an absence rather than as a passed
      check.
  independent_variables:
    - 'verifier pair: campaign declared / known-dependent / layer-disjoint'
    - 'resident mutation depth: own wrapper / shared wrapper / shared library / compiled tables'
    - mutation index within a stratum
    - 'library substitution: unmodified / modified, in the STAGE 1 controlled experiment'
  metrics:
    primary:
      - name: declared_pair_availability
        units: boolean plus verbatim command, exit code and stdout
        computed_as: >-
          direct measurement in the dispatched task's interpreter at STAGE 0. Decides
          hypothesis part (A1) at the cost of one command.
      - name: shared_layer_catch_rate
        units: count out of the admitted mutation count in the stratum
        computed_as: >-
          number of admitted mutations resident in the shared crypto library that produce
          a DISAGREEMENT between the pair's two verdicts, over the admitted count in that
          stratum. Forced to 0 under sharing and to the full count under disjointness; an
          intermediate value refutes the layer model and is reported as such, NEVER
          rounded to the nearer endpoint.
      - name: wrapper_layer_catch_rate
        units: count out of the admitted mutation count in the stratum
        computed_as: >-
          same, for mutations resident ABOVE the shared layer, in one verifier's wrapper
          only. POSITIVE CONTROL, forced to the full count.
      - name: sbox_nine_term_identity
        units: >-
          count of nonzero coefficients, plus the exponent list, per verifier
        computed_as: >-
          exact univariate interpolation of each verifier's effective S-box over GF(2^8),
          with the full coefficient list reported. Forced value 9, at exponents {0} union
          {255 - 2^k : k = 0..7}.
      - name: independent_layer_count
        units: integer
        computed_as: >-
          number of layers not shared by the verifier pair the campaign finally declares,
          reported together with its out-of-threat-model residual. The minimum consistent
          with the criteria's word "independent" is 2.
    secondary:
      - name: known_answer_pass_rate
        units: fraction
        computed_as: >-
          per verifier and per pair, on the specification's known answers. Expected 1 for
          every unmutated verifier INCLUDING an identically-wrong pair, which is precisely
          why it is a secondary metric and not evidence of independence.
      - name: mutation_admission_log
        units: list
        computed_as: >-
          every planted mutation with how it was planted, whether it changed a
          single-verifier output, and the reason for any discard.
      - name: linkage_evidence
        units: verbatim tool output, or an explicit statement that linkage could not be determined
        computed_as: linkage inspection plus the controlled library-substitution experiment.
      - name: catch_rate_monotonicity
        units: verdict plus the four-point profile
        computed_as: catch rate against depth of sharing, with a monotone/non-monotone verdict.
      - name: container_state_receipt
        units: verbatim commands, exit codes and stdout
        computed_as: >-
          STAGE 0's full record, including any discrepancy against previously recorded
          container state, reported rather than reconciled.
  heuristic_under_test:
    id: HEUR-AES-d677fa-1
    formal_statement: >-
      LAYER MODEL. A verifier is a stack of deterministic layers; a fault resident in a
      shared layer yields identical outputs from both verifiers, hence catch probability
      exactly 0. For all admitted single-bit mutations at or below a shared layer.
    validation: >-
      Tested DIRECTLY by the known-dependent null pair, which must read exactly 0. An
      intermediate reading refutes the model. This is why the audit is decisive rather
      than statistical, and why an intermediate value is a finding rather than noise.
    second_heuristic:
      id: HEUR-AES-d677fa-2
      formal_statement: >-
        The AES S-box's univariate GF(2^8) interpolation has exactly 9 nonzero
        coefficients at exponents {0} union {255 - 2^k : k = 0..7}.
      validation: >-
        Re-derived symbolically in-harness from S = A o (x -> x^254) with A a
        GF(2)-affine map, and recomputed from every verifier's effective S-box with the
        coefficient list reported. It is proved, not assumed, and is not a distributional
        claim.
  preregistered_prediction:
    quantity: >-
      declared_pair_availability at STAGE 0, and shared_layer_catch_rate for the pair the
      campaign would actually use.
    formula: >-
      PREDICTED: the declared pair is unavailable, and the shared_layer_catch_rate is
      EXACTLY 0 while the known-answer pass rate is EXACTLY 1 - the signature of a control
      that cannot fail. Under the alternative that the verifiers are layer-disjoint, the
      shared_layer_catch_rate is EXACTLY the full count. No intermediate value is
      admissible under the layer model.
    source: >-
      Pre-registered in the parent proposal IDEA-20260805-01dfba (predictions, "EXACTLY
      0/32 if the two verifiers share libcrypto; EXACTLY 32/32 if they do not. No
      intermediate value is admissible under the mechanism") before any run under this
      contract exists. Never tuned to data.
  scale_relevance:
    tier: not_applicable
    justification: >-
      Scale is not a variable here. Verifying a key costs one encryption at any round
      count, which is why the instrument survives to the full round count trivially and
      why protecting it is worth minutes of shell. The audit's boundary is the CONTAINER
      and the DATE, not a parameter size, and the record is scoped to those instead.
    correspondence: null
    transfer_assumption: >-
      None offered. The result holds for this container on this date; another container is
      another measurement, and the contract says so rather than implying portability.
  tail_checks:
    - >-
      Report the catch rate per resident stratum, never pooled. Pooling four strata whose
      forced values are 0 and full produces an intermediate number that means nothing and
      would read as a nuanced finding.
    - >-
      Report every discarded mutation with its reason. A high discard rate in the shared
      stratum means the mutations are landing in dead code, and the catch rate from that
      stratum is uninterpretable.
    - >-
      Report the full S-box coefficient list per verifier, not only the count, since a
      correct count at wrong exponents would pass a count-only check.
    - >-
      Report explicitly if the shared library could not be mutated in-container. That is
      coverage not achieved (AGENTS.md rule 5) and is never a catch rate of 0.
    - >-
      Report any discrepancy between STAGE 0's measurement and previously recorded
      container state, as a discrepancy.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 32
    repeat_count: 3
    note: >-
      32 admitted mutations per (pair, stratum) cell, with the mutation SITES drawn from
      the declared seed streams so the mutation set is reproducible and is not chosen by
      hand. The forced values are 0 and the full count, so 32 is not a statistical power
      figure - it is a coverage figure, and its role is to make a single anomalous catch
      visible rather than to estimate a rate.
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 1.0
    memory_gb: 4
    maximum_memory_gb: 4
    maximum_runs: 10
  stopping_rules:
    - >-
      Stop and void every arm if the positive control does not fire at the full count.
    - >-
      Stop and redesign if the known-dependent null catches any shared-layer mutation, or
      if the frozen decision rule emits the same label on the null and on the campaign
      pair.
    - >-
      Stop the shared-layer arm and report COVERAGE NOT ACHIEVED if the crypto library
      cannot be mutated in-container. Never report that as a catch rate.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is
      a stop, never a negative result (AGENTS.md rule 5).
    - >-
      The decision rule, the mutation counts, the strata and the seeds are frozen before
      STAGE 3 and are not revised after any catch rate is observed.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence (AGENTS.md rule 5).
      A missing dependency is itself the audit's subject and is recorded as a measurement,
      not routed around.
    - >-
      A run whose null pair or positive control was not executed in the same invocation as
      the campaign pair is invalid_measurement: the comparison the contract exists to make
      was not made.
    - >-
      A run admitting mutations that were not first shown to change a single-verifier
      output is invalid_measurement - the dead-code confound was not closed.
    - >-
      A run establishing layer sharing by inference from import paths rather than by
      linkage evidence is invalid_measurement.
    - >-
      A run reporting any figure taken outside the harness as a measurement is
      completed_invalid.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment and
      requires a new contract; it is never a repair of this one.
  success_criterion: >-
    STAGE 0's receipt is complete, the positive control fires at the full count, the
    known-dependent null reads exactly 0 with a known-answer pass rate of 1, the decision
    rule discriminates between them, every admitted mutation passed the dead-code check,
    and the run reports shared_layer_catch_rate and wrapper_layer_catch_rate per stratum,
    the S-box coefficient list per verifier, and independent_layer_count with its declared
    residual. The hypothesis H-AES-d677fa is SUPPORTED if and only if the declared pair is
    unavailable AND the substitute pair's shared_layer_catch_rate is exactly 0 with
    linkage evidence confirming sharing.
  falsification_criterion:
    - >-
      The declared verifier pair imports successfully in the dispatched task. Part (A1) is
      wrong and is withdrawn; this record's framing is superseded by a new record, never
      edited.
    - >-
      The two candidate verifiers are measured NOT to share the crypto library, on linkage
      evidence and the controlled substitution experiment. Part (A2) is wrong at the
      tested layer and the audit reports a clean pass, which is a real and welcome result.
    - >-
      The positive control fires below the full count. Nothing negative may be reported;
      the outcome is an instrument defect.
    - >-
      An intermediate shared-layer catch rate. The two-valued layer model is falsified and
      the mechanism must be rewritten before any verdict is issued.
    - >-
      A verifier's effective S-box interpolation is not 9 terms at the stated exponents.
      HEUR-AES-d677fa-2 is wrong as stated and the integrity check it licenses is
      withdrawn.
    - >-
      The known-dependent null catches a shared-layer mutation. The harness is not
      planting shared faults; the audit is redesigned before anything is read.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment
    - the exact shell commands with their exit codes and stdout, verbatim, from STAGE 0
    - >-
      raw-result.json carrying per-mutation records - site, stratum, planting method,
      single-verifier effect, each verifier's verdict - and not summaries
    - the null pair's and the positive control's measurements, in the same file as the campaign pair
    - linkage evidence per verifier, or an explicit statement that linkage could not be determined
    - the 9-term interpolation result per verifier with the full coefficient list
    - the mutation admission log including every discard and its reason
    - >-
      the final declared verifier set with its independent_layer_count and its
      declared-out-of-threat-model residual, in the exact wording that must travel with
      any dependent certificate
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not approve. This contract is review_required and is NOT
      approved; approved_by is null and execution_authorized is false. Approval is the
      user's gate because it authorizes execution and spends compute.
    - >-
      The verdict-on-the-null-first rule is a HARD GATE: the decision rule must be shown to
      separate the known-dependent pair from the layer-disjoint pair before the campaign's
      pair is looked at. A rule that labels both identically discriminates nothing.
    - >-
      Any modification of a system library must be performed in a way that cannot affect
      other work in the container. If it cannot, the shared-layer arm is reported as
      coverage not achieved rather than executed unsafely.
    - >-
      The paired hypothesis is proof-oriented and carries a filled proof_search_map
      (KN-TECH-080); its observation-collision audit is why the raw agreement bit is not
      used and why mutations are stratified by resident layer.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260805-01dfba
    authored_at: '2026-08-25'
    note: >-
      Stages, controls and forced values are taken from the parent proposal's minimal_test
      and predictions. Every figure the parent labels SESSION-MEASURED is treated here as a
      CANDIDATE TO RE-MEASURE and never as a result; the contract re-takes all of them at
      STAGE 0 under a receipt, exactly as the parent itself requires. Budgets come from the
      parent's declared estimated_cost (implementation low, compute low). No field is
      invented; a value the proposal did not supply is null or is assigned to a stage.
  derivation_gaps:
    - >-
      Whether the crypto library can be modified in this container at all is unknown and
      decides whether the shared-layer arm exists. It must be settled at STAGE 1, and a
      read-only library is an infrastructure outcome rather than a measurement.
    - >-
      The precise mutation-planting mechanism per stratum is not specified. It is
      load-bearing - a mutation that cannot be planted at the intended depth silently moves
      the stratum - and must be written down and frozen before STAGE 3.
    - >-
      Which pair the campaign FINALLY declares is a Coordinator decision that this audit
      informs but does not make. The contract measures candidates; adopting one is a
      separate decision record.
    - >-
      The exact wording of the out-of-threat-model residual that must travel with dependent
      certificates is not fixed here. It should be drafted at STAGE 4 and reviewed, since a
      residual declared vaguely is a residual not declared.
