# EXP-AUXIN-25a29a
# Step-count arithmetic. No walk.
# Approved by DEC-20261002-c548c0.
experiment:
  id: EXP-AUXIN-25a29a
  hypothesis_id: H-AUXIN-a86953
  source_idea: IDEA-20260930-704e43
  question_id: RQ-AUXIN-f8d8c0
  version: 1
  title: Step-count arithmetic at 56 bits
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-c548c0
  objective: >-
    Check the stage-2 count 512, the power excess 1377017, the gain
    9984 over 4375, and the width-8 excess 14808 over 4375.
  inputs:
    bits: 56
    divisor: 65536
    sqrt_d: 256
    stage2_steps: 512
    stage2_power: 9
    c_m1: 84
    c_w4: 14
    c_w8: 7
    stage1_steps: 1310720
    pow_left: 9765625
    pow_right_low: 8388608
    pow_excess: 1377017
    pow_right_high: 16777216
    pow_short: 7011591
    g84_num: 9984
    g84_den: 4375
    g84_over_2: 1234
    g84_under: 516
    g7_num: 119808
    g7_den: 4375
    g7_over_24: 14808
    g7_over_27: 1683
    g7_under_28: 2692
    null_left_13: 4380480000
    null_right_13: 3234765625
    null_excess_13: 1145714375
    null_left_half: 1752192
    null_right_half: 19140625
    null_short_half: 17388433
  controls:
    - >-
      Twice 256 is 512. Reporting 256 stage-2 steps invalidates the
      run.
    - >-
      Five to the 10 exceeds 8 times 4 to the 10 by 1377017.
      Reporting a shortfall there invalidates the run.
    - >-
      The width-8 gain exceeds 24 by 14808 over 4375. Reporting that
      gain as at most 24 invalidates the run.
    - >-
      The null square at 7 additions exceeds the 13 over 100 square
      and falls short of the one-half square. Reporting that null
      gain as at most 13 over 100 invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {stage2, power, gain84, gain7, null}
    - route in {power_cross, reduced_fraction}
  metrics:
    primary:
      - stage2_steps
      - pow_excess
      - implementations_agree
    secondary:
      - g84_over_2
      - g7_over_24
      - null_excess_13
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The stage-2 count is 512. The power excess is 1377017. The
      gain at 84 additions exceeds 2 by 1234 over 4375. The gain at
      7 additions exceeds 24 by 14808 over 4375.
    formula: >-
      Compare twice 256 with 512. Compare 5 to the 10 with 8 times
      4 to the 10 and with 16 times 4 to the 10. Compare 9984 with
      2 times 4375 and with 12 times 4375 over 5. Compare 119808
      with 24 times 4375. Compare the two null squares.
    source: >-
      IDEA-20260930-704e43 states the stage-2 count 2 to the 9 and
      the gain 0.936 times 256 over 1.25 times c_step at 56 bits,
      read 2026-10-02. The products were computed in this design
      session. That computation is not a run. No curve was built.
  scale_relevance:
    tier: toy
    justification: One bit length and one divisor. No transfer to a walk.
    correspondence: null
  tail_checks:
    - The width-8 excess and both null signs are required. A check that stops at the stage-2 count is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the power excess 1377017 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The stage-2 count is not 512.
    - The power excess is not 1377017.
    - The width-8 gain is reported as at most 24.
    - The null gain at 7 additions is reported as at most 13 over 100.
    - A curve is built or a walk is run.
  success_criterion: >-
    Both runs agree that the stage-2 count is 512, that the power
    excess is 1377017, that the power shortfall is 7011591, that the
    gain at 84 additions exceeds 2 and falls short of 12 over 5, that
    the gain at 7 additions exceeds 24, and that the null square at 7
    additions exceeds 13 over 100 and falls short of one half.
  falsification_criterion: >-
    The runs agree that twice 256 is 512, and the power excess is
    not 1377017.
  required_artifacts:
    - experiments/EXP-AUXIN-25a29a/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-AUXIN-25a29a/runs/<RUN-ID>/command.txt
    - experiments/EXP-AUXIN-25a29a/runs/<RUN-ID>/stdout.log
    - experiments/EXP-AUXIN-25a29a/runs/<RUN-ID>/stderr.log
    - experiments/EXP-AUXIN-25a29a/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-AUXIN-25a29a/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any curve, walk, distinguished-point table, or measured step constant.
    - Any claim that a deployment is below rho.
    - Any transfer of these ratios to a 255-bit order.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
