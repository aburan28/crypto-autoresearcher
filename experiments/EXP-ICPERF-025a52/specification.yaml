experiment:
  id: EXP-ICPERF-025a52
  hypothesis_id: H-ICPERF-5f038b
  goal_id: GOAL-ICPERF-e6b6a4
  proposal_id: IDEA-20260915-5c407a
  version: 2
  title: >-
    Descent as a DAG: Stage A freezes the analytic pigeonhole crossover j*, Stage B
    measures the tree-to-DAG sharing ratio rho_j of a declared degree-decreasing
    descent over F_2[x] against a matched random branching null object
  status: draft
  status_history:
    - status: draft
      at: '2026-09-15'
      by: coordinator
      decision: DEC-20260915-674299
      note: >-
        Authored as the design deliverable for open ECC idea IDEA-20260915-5c407a
        (AGENTS.md "ECC comes first", instruction 3). Designing is not approving;
        approved_by stays null. See approval_preconditions.
    - status: draft
      at: '2026-09-15'
      by: coordinator
      version: 2
      correction: CORR-20260915-3965c1
      note: >-
        v1 -> v2. ADDITIVE AMENDMENT, never a rewrite of history: the v1 entry
        above stands unchanged and CORR-20260915-3965c1 preserves both values.
        Commit 3bf175a2c ("Fix ICPERF descent contract parameters", Cursor
        Agent) revised descent_rule.step, grid.target_degree and parameters.d_a
        in place after v1 had already merged to main in PR #1197, and added the
        frozen Stage A branching_model, but left version at 1. The mathematics
        of the fix is right and is retained: w = (a*t) mod f only reduces when
        deg(a*t) >= n, so the v1 bound d_a = 4*b could not force reduction for
        mid-tree targets with d_t << n -- mod f became a no-op, w = a*t kept
        the irreducible t as a factor, and the acceptance test "largest factor
        degree strictly less than d_t" could never pass. Drawing the multiplier
        degree from [n - d_t, d_a] with d_a = n - b - 1 and targets of degree
        n - 1 makes the interval non-empty for every grid cell with
        d_t >= b + 1. This bump exists so a later receipt cannot bind "v1"
        ambiguously to two different protocols; the contract remains
        status: draft, approved_by: null, and nothing here approves it.
  objective: >-
    Decide, for a declared and frozen descent rule over F_2[x] on a frozen grid,
    which of three regimes holds for the tree-to-DAG sharing ratio rho_j:
    R1 (rho_j = 1, the tree analysis is tight), R2 (rho_j constant > 1, a
    constant-factor engineering item), or R3 (rho_j growing in depth, so a cost
    model charging descent by tree size over-charges the attacker by a factor that
    grows). Produce observations only; the executor forms no conclusion, and no
    asymptotic claim is made, tested, or implied by this contract.
  design_rationale: >-
    The idea's arm 1 needs a descent deep enough for the phenomenon to appear, and
    this repository has no FFS-style descent (a filename-level check of tools/ and
    experiments/*/code/ found none; that is a cheap check, not an exhaustive one).
    Rather than commission a large implementation on an unmeasured premise, the
    contract puts the cheapest falsification first: Stage A computes the pigeonhole
    crossover level j* and the per-node acceptance probability ANALYTICALLY from
    exact irreducible counts, over the whole grid, before any descent runs. A grid
    cell whose predicted acceptance probability at K_try falls below the declared
    floor is declared infeasible IN ADVANCE and is not run. Freezing j* before
    Stage B is what turns P3 from a post-hoc coincidence into a pre-registered
    prediction, and it is the reason the two stages are one contract rather than two.
  descent_rule:
    frozen: true
    field: F_{2^n} = F_2[x]/(f), n prime, f the declared irreducible modulus recorded per cell
    factor_base: FB(b) = every monic irreducible polynomial of degree <= b
    step: >-
      Given a monic irreducible target t with deg t = d_t > b, draw a uniformly
      at random among b-smooth monic polynomials whose degree lies in
      [n - d_t, d_a] (sampled as a random multiset of FB(b) elements with total
      degree in that interval); compute
      w = (a * t) mod f; resample if w = 0; factor w over F_2[x]. ACCEPT iff every
      irreducible factor of w has degree <= max(b, ceil(alpha * d_t)) AND the
      largest factor degree is strictly less than d_t. On acceptance the emitted
      relation is log t = sum_{q | w} e_q log q - sum_{q | a} e_q log q, and the
      children of t are the distinct irreducible factors of w of degree > b.
      Recurse on each child; stop at degree <= b (factor base).
    termination: >-
      The node size measure is the degree and it decreases strictly along every
      edge by the acceptance rule, so the structure is acyclic and terminating for
      the same reason.
    determinism: >-
      The draw sequence at a node is seeded by H(global_seed || canonical_bytes(t)),
      so the relation chosen at a node is a deterministic function of the node.
      This is what makes the TREE unrolling computable exactly by path counting on
      the DAG instead of by re-solving, and it is declared as an assumption of
      H-ICPERF-5f038b rather than hidden in the implementation.
    node_failure: >-
      A node with no accepting draw within K_try is recorded as a descent failure
      with its draw count. Its target is excluded from rho_j aggregation, the
      exclusion count is reported per cell, and the failure is an infrastructure or
      parameter outcome under AGENTS.md rule 5 -- never evidence about sharing.
    not_claimed_to_be: >-
      This is NOT FFS special-q descent, NOT Joux's L(1/4) descent, NOT the
      Granger-Kleinjung-Zumbraegel quasi-polynomial descent, and NOT Diem's
      elliptic-curve recursion. It is a declared simplified degree-decreasing
      descent chosen because it is implementable, certifiable per relation, and
      deep. Every number is about this rule.
  inputs:
    grid:
      n: [61, 89, 127]
      b: [3, 4, 5]
      alpha: [0.6, 0.7, 0.8]
      targets_per_cell: 20
      target_degree: n - 1
    parameters:
      d_a: n - b - 1
      K_try: 100000
      memo_key: monic canonical byte form of the polynomial (frozen before any run)
      global_seed: 20260915
      target_seed: 20260915000 + 1000*n + target_index
      null_seeds: 20 per cell, 20260915500 + cell_index*100 + replicate_index
    moduli: >-
      experiments/EXP-ICPERF-025a52/code/moduli.json, produced by the
      implementation task and re-checked for irreducibility and degree by the
      independent checker. No modulus is transcribed from memory into this
      contract.
    code: >-
      experiments/EXP-ICPERF-025a52/code/{descent.py, dagmeasure.py, nullmodel.py,
      crossover.py, certcheck.py, summary.py} -- to be written under the
      implementation task named in dependencies; certcheck.py is written WITHOUT
      reading descent.py.
    engines_required: none (pure F_2[x] arithmetic; no solver, no external engine)
    prior_artifacts_consumed: none (this contract reuses no run of BATCH-51e2aa and touches no frozen ICPERF harness)
  stages:
    - id: STAGE-A
      kind: analytic, zero descent runs
      what: >-
        (1) Exact M_d = (1/d) * sum_{e | d} mu(e) 2^{d/e} for every degree d in
        every level window of every grid cell, cross-checked against direct
        enumeration for d <= 12. (2) The declared branching model: expected number
        of children per accepted relation and the per-level occurrence count T_j it
        implies. (3) j*(n, b, alpha) = the least level j at which the predicted T_j
        reaches M_j -- the pigeonhole crossover. (4) The predicted per-node
        acceptance probability, and the feasibility verdict per cell.
      branching_model: >-
        This model is frozen before Stage B and is not fitted to measurements.
        Let D = n - 1, D_j = ceil(alpha^j * D), W_0 = {D}, and for j >= 1 let
        W_j = {d : b < d <= D_j}. For a parent of degree d, set
        L(d) = min(d - 1, max(b, ceil(alpha * d))) and model the accepted w as uniformly
        distributed over nonconstant monic polynomials of degrees 1 through
        n - 1 whose irreducible factors all have degree <= L(d). With
        S_L(z) = product_{r=1..L}(1 - z^r)^(-M_r) and
        Z_L = sum_{m=1..n-1} [z^m] S_L(z), the expected number of distinct
        degree-r children is C(d,r) = M_r * (sum_{m=r..n-1} [z^(m-r)] S_L(z)) / Z_L
        for b < r <= L(d), and zero otherwise. Starting with N_0(D) = 1,
        compute N_{j+1}(r) = sum_d N_j(d) C(d,r), T_j = sum_{d in W_j} N_j(d),
        M_j = sum_{d in W_j} M_d, and B_j = T_{j+1}/T_j. Stop when D_j <= b;
        j* is the least j >= 1 with T_j >= M_j. The same recurrence is used
        for every cell, with no Stage B quantity entering Stage A.
      output: >-
        experiments/EXP-ICPERF-025a52/runs/<RUN>/stage_a/crossover_table.json,
        with its sha256 recorded in the Stage B manifest.
      ordering_rule: >-
        Stage B may not start until crossover_table.json exists and its hash is
        bound in the Stage B manifest. A Stage B result whose manifest lacks that
        hash is INVALID (see invalidation_rules), because j* would no longer be a
        pre-registered quantity.
      feasibility_rule: >-
        A cell whose predicted acceptance probability implies fewer than 10
        expected acceptances in K_try draws is declared INFEASIBLE in Stage A and
        is not run in Stage B. The declaration is recorded with its arithmetic. An
        infeasible grid is a Stage A result, not a failure.
    - id: STAGE-B
      kind: measurement
      what: >-
        For every feasible cell and every declared-seed target: build the descent
        DAG, compute U_j by distinct canonical form and T_j by path counting,
        report rho_j, the in-degree distribution of shared nodes, the measured
        depth, the branching-factor distribution, and the descent-failure count.
        Then run the memo-off control and the matched random branching null.
      output: results.jsonl, summary.json, task-report.md under the run directory
  controls:
    - id: C-ID
      what: >-
        Every emitted relation re-verified by certcheck.py with arithmetic written
        without reading descent.py: (a*t) mod f = w, w = product of reported
        factors with reported multiplicities, every reported factor irreducible, a
        b-smooth, and the largest factor degree strictly below d_t.
      pass: 100% of emitted relations verify; any failure stops the run and invalidates the instrument
    - id: C-MEMO-OFF
      what: >-
        The proves-too-much guard. The same instrument with the memo table
        DISABLED must report rho_j = 1.0 exactly at every level of every cell. An
        instrument that reports sharing with its cache off is measuring itself.
      pass: rho_j == 1.0 exactly, every level, every cell
    - id: C-MERGE
      what: >-
        Every memo hit asserts byte-equality of the two canonical forms. A merge of
        two non-identical forms is a hard stop, not a warning.
      pass: zero non-identical merges
    - id: C-NULL
      what: >-
        THE DECIDING CONTROL. A random branching process with the per-level
        branching-factor distribution measured from the real run and the exact
        per-level pool sizes M_j, children drawn uniformly from the level pool,
        >= 20 seeds per cell. Prediction P4 compares real rho_j against it.
      pass: reported with mean and standard deviation per level; no pass/fail, it is the comparison
    - id: C-POOL
      what: >-
        M_d by Moebius inversion cross-checked against direct enumeration of monic
        irreducibles for d <= 12.
      pass: exact agreement on every d <= 12
    - id: C-LOAD
      what: 1-minute load average recorded at every stage launch; rows launched above the declared quiet threshold are flagged
      pass: reported
  independent_variables:
    - cell (n, b, alpha)
    - level j within the descent
    - memo table on / off
    - real descent vs matched random branching process
  metrics:
    primary:
      - T_j (level-j node occurrences in the tree unrolling, by path counting)
      - U_j (distinct level-j nodes by canonical form)
      - rho_j = T_j / U_j, per target and as a per-cell median with seed spread
      - M_j (exact level pool size)
      - measured descent depth per target
    secondary:
      - in-degree distribution of shared nodes
      - branching-factor distribution per level
      - descent-failure count and K_try exhaustion rate per cell
      - wall seconds, peak RSS, load average at launch
  heuristic_under_test: HEUR-1
  preregistered_prediction:
    quantity: predictions P1-P4 of H-ICPERF-5f038b
    formula: >-
      rho_j = T_j / U_j; occupancy model U_j ~ M_j (1 - exp(-T_j / M_j));
      j* = least j with predicted T_j >= M_j, computed and hashed in Stage A
      BEFORE any Stage B measurement. P2 threshold rho_j >= 1.5 at the deepest
      level with >= 50 occurrences in a depth >= 4 cell; P3 window |j_2 - j*| <= 1
      with rho_j non-decreasing; P4 separation >= 2 standard deviations of the
      null's seed-to-seed spread.
    source: >-
      H-ICPERF-5f038b statement; M_d from the Moebius-inversion count of monic
      irreducibles over F_2 (standard, recalled, and recomputed in-repo by C-POOL
      rather than cited as support).
  scale_relevance:
    tier: toy
    justification: >-
      n <= 127 over F_2, factor-base degree bound b <= 5, a declared simplified
      descent rule, 20 targets per cell. The result is exact for these cells and
      this rule and transfers to nothing else without further work. It is not an
      elliptic-curve measurement and not an ECDLP result.
    correspondence: null
  tail_checks:
    - >-
      The in-degree distribution of shared nodes is compared against the null's,
      not only the mean rho_j: a matched mean with a different tail is itself a
      finding and must be reported rather than smoothed into the median.
    - >-
      The deepest level reached is reported with its occupancy count, so a rho_j
      computed on a handful of nodes cannot be mistaken for a measured regime.
  replication:
    seeds: [20260915]
    seed_note: >-
      One global seed with 20 declared per-target seeds per cell and >= 20 null
      seeds; the per-target spread is the error bar. An independent-seed
      replication is a successor task, not part of this contract.
    independent_instances: 20
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    stage_a_wall_clock_seconds: 600
    per_node_wall_clock_seconds: 30
    per_target_wall_clock_seconds: 300
    per_cell_wall_clock_seconds: 1800
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      Advisory under docs/research-budget-policy.md; GOAL-ICPERF-e6b6a4's campaign
      budget is unlimited because ICPERF is a declared ECC area. These values size
      stopping rules and machine headroom. The contract needs no solver and no
      external engine, so it does NOT compete with the machine-quiet requirement of
      EXP-ICPERF-66fd51; it must still respect the goal's max_concurrent of 2.
  stopping_rules:
    - C-ID fails on any relation: stop immediately, record the failing relation, run nothing further.
    - C-MERGE fails: stop immediately; a canonicalisation defect invalidates every rho_j.
    - Stage A declares every cell infeasible: stop after Stage A and report it as the result. Stage B is not run and no rho_j is claimed.
    - A per-cell wall-clock cap is reached: that cell stops, its partial results are kept and flagged, the next cell starts.
    - Total wall clock reached: stop, keep results.jsonl as the partial artifact, run summary.py, record which cells finished.
  invalidation_rules:
    - Stage B manifest missing the sha256 of stage_a/crossover_table.json, or carrying a hash that does not match the committed file.
    - results.jsonl absent or unparsable.
    - The memo-off control not run, or run on a different target set than the memo-on measurement.
    - Any cell whose reported M_j disagrees with the C-POOL recomputation.
    - manifest.yaml missing code.commit or the inference block.
  success_criterion: >-
    Stage A's crossover table exists, is hashed into the Stage B manifest, and
    declares feasibility per cell with its arithmetic; every feasible cell is
    either measured or recorded as a budget stop; summary.json evaluates P1-P4 with
    an explicit null where a prediction is undetermined; and the task report lists
    every unexpected observation (descent failures, K_try exhaustion, a level whose
    occupancy is too small to support a ratio, any null-model mismatch).
  falsification_criterion: >-
    Per H-ICPERF-5f038b: F0 if any of C-ID, C-MERGE or C-MEMO-OFF fails (instrument
    invalid, no rho_j means anything); F1 if rho_j <= 1.1 at every level of every
    feasible cell; F2 if rho_j is flat in j or first exceeds 2 more than one level
    away from j*; F3 if real and null rho_j are indistinguishable; F4 if descent
    failures dominate. The executor reports the values; the Coordinator decides.
  required_artifacts:
    - experiments/EXP-ICPERF-025a52/runs/<RUN-ICPERF-token>/manifest.yaml
    - experiments/EXP-ICPERF-025a52/runs/<RUN-ICPERF-token>/stage_a/crossover_table.json
    - experiments/EXP-ICPERF-025a52/runs/<RUN-ICPERF-token>/results.jsonl
    - experiments/EXP-ICPERF-025a52/runs/<RUN-ICPERF-token>/summary.json
    - experiments/EXP-ICPERF-025a52/runs/<RUN-ICPERF-token>/certificates/ (every emitted relation and its verification record)
    - experiments/EXP-ICPERF-025a52/runs/<RUN-ICPERF-token>/null_model/ (per-seed null outputs)
    - experiments/EXP-ICPERF-025a52/runs/<RUN-ICPERF-token>/environment.json
    - experiments/EXP-ICPERF-025a52/runs/<RUN-ICPERF-token>/task-report.md
    - experiments/EXP-ICPERF-025a52/runs/<RUN-ICPERF-token>/logs/
  required_artifacts_note: >-
    <RUN-ICPERF-token> is deliberately a placeholder. The run identifier is minted
    with `python3 tools/allocate_id.py --next run` by the session that approves this
    contract and is pinned in the approval decision; no identifier is invented here.
  assigned_to: executor
  assigned_to_note: >-
    The implementation does not exist and must be written under an
    executor-implementation task, then reviewed, and only then executed. The
    Coordinator does not write experiment implementation code. Stage A and Stage B
    are one contract but at least two tasks (implement + review, then run).
  approved_by: null
  approval_preconditions:
    - >-
      NOVELTY SCREEN (TASK-20260915-532164) returns, and its finding is recorded.
      IDEA-20260915-5c407a is novelty_status: unverified with every citation
      `recalled`; if the screen finds rho_j measured and published for a descent of
      this kind, or finds the published descent cost analyses already stated on the
      DAG rather than the tree, this contract is dominated or emptied of exponent
      content and should be superseded rather than approved.
    - >-
      An implementation task is minted and scoped, with its own write scope,
      budget and completion gate, and with certcheck.py written independently of
      descent.py.
    - >-
      A run identifier is minted through tools/allocate_id.py and pinned in the
      approval decision.
    - >-
      This contract and H-ICPERF-5f038b are committed and pushed on a branch with
      an open PR (TASK-20260915-60dc73), so that approval does not rest on
      uncommitted records.
  approval_basis_when_granted: >-
    Standing user authorization (AGENTS.md, 2026-09-06) covers approval once the
    protocol is complete; user confirmation is neither sought nor required. What is
    outstanding is protocol readiness, which is the Coordinator's responsibility and
    is enumerated above.
  dependencies:
    - TASK-20260915-60dc73 (snapshot archive of this contract and H-ICPERF-5f038b)
    - TASK-20260915-532164 (independent novelty / domination screen)
    - an implementation task, not yet minted
  independence_note: >-
    certcheck.py must be written from the descent rule and the field definition
    alone, without reading descent.py, so that relation verification is not a
    recomputation of the producer's own implementation. The blind re-derivation
    joint for any later review round is T_j: re-derived by path counting from the
    emitted DAG edge list alone, without reading dagmeasure.py.
  interpretation_limits:
    - A declared simplified descent over F_2[x], n <= 127, b <= 5, one seed family. Not FFS, not Joux, not GKZ, not Diem, not any elliptic curve.
    - rho_j is a lower bound on true sharing (canonicalisation can only under-merge here).
    - rho_j is measured under deterministic per-node relation choice; a re-randomising tree implementation builds a different tree.
    - A memoised descent trades time for memory; sum_j U_j is the memo table size and must be charged beside any time saving.
    - Nothing here is an asymptotic claim. Regime R3 at these depths licenses no exponent statement and triggers the promotion gates in agents/coordinator.md before anything of the sort could be entertained.
    - Descent failures and budget stops are censored observations; a rho_j computed over a cell with exclusions is reported with the exclusion rate, never as a point estimate.
