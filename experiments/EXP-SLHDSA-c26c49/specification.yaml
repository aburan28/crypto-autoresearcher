experiment:
  id: EXP-SLHDSA-c26c49
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-96af8d; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-96af8d
  question_id: RQ-SLHDSA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Differentially test two independently written scaled-down hypertree signers on their call
    traces, score a pre-registered structural mutation catalogue against both a trace detector and
    a verification-only detector, and measure the false-positive floor on identity mutations
  objective: 'The one uncertainty a run reduces is whether the instrument every other entry in this
    bucket depends on can see a structural defect, and how much of that seeing comes from the trace
    rather than from verification. Concretely: (i) whether two independently written signers agree
    on their full call traces under a declared order-equivalence on unmutated inputs, and if they
    do not, whether each disagreement resolves to a defect in one implementation or to an ambiguity
    in the structural description -- the second outcome being a finding about the description that
    blocks the bucket until settled; (ii) what fraction of a pre-registered structural mutation catalogue
    each detector catches, scored separately on the same events, and how many mutations each detector''s
    pre-classification predicted correctly, so the run scores a prediction rather than tabulating;
    (iii) what the false-positive floor is on identity-mutation pairs and on self-against-self runs
    with different seeds, without which no detection rate means anything. A run reduces (i) to a pass
    or a resolved disagreement list, (ii) to two rates plus a per-mutation table and a misclassification
    list, and (iii) to two measured floors. The most important single output is the list of mutations
    detected by neither detector, which is the honest statement of the instrument''s blindness.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'At most, a completed run supports: for this specific pair of
      implementations, this trace specification, this order-equivalence and this pre-registered mutation
      catalogue, the per-mutation detection outcomes for each detector, the aggregate rates, the false-positive
      floors, the block-localization accuracy, and the list of mutations detected by neither. WHAT
      DOES NOT FOLLOW: that either implementation is correct -- two implementations agreeing establishes
      agreement with each other and with a structural description this repository marks UNVERIFIED,
      and nothing about any standard; that the detection rate would hold for a different catalogue;
      anything about SLH-DSA''s security, any hash function, any parameter set, any attack, or any
      forgery; anything about what the literature contains; and nothing about the fault or memory-corruption
      claim class, notwithstanding the shared word mutation. A high detection rate licenses other
      entries in this bucket to proceed with a stated instrument-validity number attached; it licenses
      no cryptographic claim whatever.'
  inputs:
    procedure: 'STAGE 0, specification (zero compute, ~4h human): write the trace entry format, the
      order-equivalence relation, the fingerprint width, and the mutation catalogue with each mutation
      pre-classified by expected detector, all before any implementation exists. STAGE 1, independent
      implementations (~12h human, arranged across two sessions without shared code access): two signers
      against the same structural description, both strictly sequential and seed-deterministic. STAGE
      2, baseline differential (~30min compute): 10^3 signatures per toy parameter set, requiring
      trace equality under the equivalence and signature equality; resolve every disagreement to a
      defect or to a description ambiguity. STAGE 3, order-equivalence stress (~10min compute): apply
      a permitted sibling reordering and require no flag. STAGE 4, mutation run (~2h compute): each
      catalogue mutation applied to one implementation in turn, both detectors scored, crashes recorded
      as a separate outcome class rather than as detections. STAGE 5, nulls (~1h compute): identity-mutation
      pairs for the false-positive rate, and self-against-self at differing seeds for nondeterminism.
      STAGE 6, report (zero compute): per-mutation table, both rates, both floors, localization accuracy,
      misclassification list, and the detected-by-neither list.'
    instrument: 'Python 3.11 for both implementations, written independently but constrained to the
      same standard library surface so that a difference cannot arise from library behaviour: hashlib
      for SHA-256 and SHAKE-128 truncated to the toy output size, no third-party cryptographic library,
      no compiled extensions. blake2b at 64-bit digest size as the trace fingerprint function, chosen
      distinct from the signer''s own hash so a defect in one cannot mask itself in the other. numpy
      for rate arithmetic only. The trace comparator is a third module written against the STAGE 0
      specification and against neither implementation. All three live under harness/ following the
      single-file convention of harness/rho.py, and runs go through harness/runner.py so seeds, parameters
      and the resolved inference block land in the manifest. No Sage, no network.'
    parameters: 'Toy signer parameter sets: (h, d, a, k, w, n) over h in {4, 6}, d in {1, 2}, a in
      {2, 3}, k in {3, 4}, w in {4, 16}, n in {12, 16} bits, with all combinations run at the baseline
      differential and a fixed subset of four at the mutation stage. Baseline differential: 10^3 signatures
      per parameter set, fixed seeds. Mutation catalogue: 24 pre-registered structural mutations,
      each pre-classified as trace-detectable, verification-detectable, both, or neither, including
      at least three predicted detectable by neither. Identity-mutation null: 200 pairs. Self-against-self
      null: 200 runs at differing seeds per implementation. Trace fingerprint width: 64 bits, with
      the resulting collision probability over the longest trace reported.'
  controls:
  - 'Identity-mutation pairs: unmutated implementations through the identical detection pipeline,
    giving the false-positive rate for each detector separately.'
  - 'Self-against-self with different seeds: traces must differ only in fingerprint values, never
    in call structure, catching nondeterminism.'
  - Pre-classification of every mutation by expected detector, so the run scores a prediction rather
    than tabulating outcomes.
  - A deliberately invisible mutation (a hash constant change preserving all call identity and addressing),
    included so the instrument's blindness is measured rather than assumed away.
  - 'Order-equivalence stress: apply a permitted sibling reordering to one implementation and require
    the comparator not to flag it, checking the equivalence is not too fine.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Identity-mutation pairs: the identical detection pipeline run on N
    pairs where the applied mutation is the identity transformation, so the two implementations are
    unmutated and any reported difference is a false positive. The null must show a false-positive
    rate at the floor -- the contract sets a target below one percent and reports the measured value
    regardless -- and must show it separately for the trace detector and the verification detector.
    If the null false-positive rate is not at the floor, every detection rate in the contract is uninterpretable,
    because a detector that fires on unmutated pairs is measuring the harness rather than the mutation.
    A second null runs each implementation against itself with different seeds, where traces must
    differ only in fingerprint values and never in call structure, catching nondeterminism that would
    otherwise inflate the false-positive rate for a reason unrelated to either implementation.'
  independent_variables:
  - mutation identity from the pre-registered catalogue
  - detector (trace comparator / verification only)
  - toy parameter set
  - which implementation carries the mutation
  - seed
  metrics:
    primary:
    - per-mutation detection outcome, per detector
    - aggregate detection rate per detector over the catalogue
    - false-positive rate per detector on identity-mutation pairs
    - list and count of mutations detected by neither detector
    - agreement between pre-classification and observed detector per mutation
    secondary:
    - block-localization accuracy for detected mutations
    - crash outcomes recorded separately from detections
    - self-against-self call-structure equality at differing seeds
    - order-equivalence stress result
    - trace length per signature and fingerprint collision probability over the longest trace
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The false-positive rate of the trace comparator on identity-mutation pairs, defined
      as the fraction of unmutated implementation pairs on which the comparator reports any trace
      difference under the declared order-equivalence.
    formula: Predicted value below 0.01. With 200 identity-mutation pairs, the pre-registered decision
      rule is that the observed count of false positives must be at most 1, which is the largest count
      whose one-sided 95 percent upper bound on the underlying rate remains below 0.02; the measured
      rate is reported regardless of the rule's outcome. The companion pre-registration is that the
      trace comparator's aggregate detection rate over the 24-mutation catalogue is at least 0.8,
      that is at least 20 of 24 detected, with the per-mutation table published in full so that the
      aggregate is never quoted alone.
    source: Pre-registered in the parent proposal IDEA-20260816-96af8d before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at hypertree heights 4 to 6, one or two layers, FORS a of 2 to 3 and k
      of 3 to 4, Winternitz w of 4 or 16, hash outputs of 12 to 16 bits. These are the smallest parameters
      at which every distinct call type and every structural feature the mutation catalogue targets
      appears at least once, which is the only requirement an instrument-validity measurement has
      -- larger parameters would multiply the trace length without adding a structural feature to
      detect. The transfer assumption, stated and not established: that a detector validated on structural
      defects at these sizes detects the same defect classes at any size, since the defects are structural
      rather than numerical. That assumption is about software structure, not about cryptography,
      and no output of this contract is a statement about any deployed parameter set.'
    correspondence: null
  tail_checks:
  - Confirm both implementations are seed-deterministic by repeated identical runs before any comparison.
  - Confirm the order-equivalence does not flag a permitted sibling reordering.
  - Confirm crashes are recorded as a separate outcome class and are excluded from detection counts.
  - Report the fingerprint collision probability over the longest trace and confirm it is negligible
    relative to the false-positive floor.
  - Confirm the trace specification file predates both implementation files in version-control history,
    which is the only available evidence that the format was not tuned after the fact.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report a description-ambiguity finding if a baseline disagreement cannot be resolved
    to a defect in one implementation; the bucket is blocked until the Coordinator rules.
  - Halt and declare the pipeline uninterpretable if the identity-mutation false-positive rate exceeds
    the pre-registered rule.
  - Halt the mutation stage for any mutation that crashes both implementations, recording it as an
    untestable catalogue entry rather than a detection.
  - Hard wall-clock stop at 8 CPU-hours; a stop is an infrastructure outcome and is never negative
    mathematical evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Baseline trace and signature agreement between two independently written implementations
    across all parameter sets, a trace-comparator detection rate of at least 20 of 24 catalogue mutations,
    a false-positive count of at most 1 in 200 identity pairs, and a published per-mutation table
    including the full list of mutations detected by neither detector.
  falsification_criterion:
  - 'Identity-mutation false positives exceed the pre-registered rule for either detector: no detection
    rate is interpretable.'
  - 'Either implementation is nondeterministic at fixed seed: the differential test is void.'
  - 'The order-equivalence flags a permitted reordering: the equivalence is too fine.'
  - 'A baseline disagreement resolves to neither implementation but to an ambiguity in the structural
    description: reported as a finding about the description, blocking the bucket.'
  - 'The trace comparator''s detection rate does not exceed the verification detector''s: the extra
    machinery buys nothing and the recommendation is to drop it.'
  - 'More than a quarter of the catalogue is detected by neither detector: the instrument is blind
    to defect classes this bucket relies on, and that blindness is attached as a stated limit to every
    entry citing it.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-96af8d
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Author independence between the two implementations is procedural and cannot be enforced or verified
    from inside the contract; the Coordinator must arrange it explicitly and must record how, since
    a violated independence assumption produces a clean and worthless result.
  - The mutation catalogue is written by the same reasoning that designed the trace format and may
    over-represent detectable defects; a Coordinator should decide whether an independently authored
    catalogue is required, which would raise the cost substantially and the value correspondingly.
  - The structural description both implementations are written against is marked UNVERIFIED in this
    repository; the Coordinator must decide whether agreement against it is an acceptable basis for
    the rest of the bucket or whether a primary source must be filed as a KN-LIT entry first.
  - The declared order-equivalence relation needs a Coordinator ruling on which reorderings are permitted,
    since setting it too coarse hides real differences and too fine manufactures false positives,
    and no control in the contract detects the first failure.
