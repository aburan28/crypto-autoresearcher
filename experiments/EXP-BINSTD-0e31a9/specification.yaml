# EXP-BINSTD-0e31a9
# Certificate-rate arithmetic. No certificate check.
# Approved by DEC-20261003-9cde4c.
experiment:
  id: EXP-BINSTD-0e31a9
  hypothesis_id: H-BINSTD-95669d
  source_idea: IDEA-20261001-2b71e5
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Rate gaps at a sample of 50
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-9cde4c
  objective: >-
    Check the shortfall 50, the product 312500000, and the cell
    count 9.
  inputs:
    axis_count: 3
    cell_count: 9
    on_axis: 3
    off_axis: 6
    sample: 50
    floor_num: 99
    floor_den: 100
    floor_shortfall: 50
    floor_excess: 50
    crosstalk_num: 5
    crosstalk_den: 100
    two_shortfall: 50
    three_excess: 50
    one_excess: 50
    gap_product: 312500000
    hundredths_gap: 4
    n_count: 2
    slots: 300
  controls:
    - >-
      Ninety-nine times 50 is 4950. Forty-nine times 100 is 4900.
      Their difference is 50. Reporting 49 over 50 as meeting 99
      over 100 invalidates the run.
    - >-
      Fifty times 100 is 5000, which exceeds 4950 by 50. Five times
      50 is 250, and twice 100 is 200, so 2 over 50 falls short by
      50. Three times 100 is 300, which exceeds 250 by 50. One
      times 100 exceeds 50 by 50.
    - >-
      The product of the five gaps of 50 is 312500000. Five minus 1
      is 4. Three times three is 9, and 9 minus 3 is 6. Two times
      three times 50 is 300.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {floor, crosstalk, cells}
    - route in {cross_gap, cell_count}
  metrics:
    primary:
      - floor_shortfall
      - gap_product
      - implementations_agree
    secondary:
      - three_excess
      - cell_count
      - slots
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The shortfall of 49 over 50 against 99 over 100 is 50. The
      product of the five gaps is 312500000. The cell count is 9.
    formula: >-
      Subtract 49 times 100 from 99 times 50. Multiply that gap by
      itself four more times. Separately multiply three by three.
    source: >-
      IDEA-20261001-2b71e5 states the floor 0.99, the threshold
      0.05, and the sample 50, read 2026-10-03. The gaps were
      recomputed in this design session. That computation is not a
      run. No certificate was checked.
  scale_relevance:
    tier: toy
    justification: One written sample size and three axes. No transfer to a verifier.
    correspondence: null
  tail_checks:
    - The cell count 9 and the three-of-fifty excess 50 are required. A check that stops at the shortfall 50 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the shortfall 50 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The floor shortfall is not 50.
    - The product is not 312500000.
    - The cell count is not 9.
    - A certificate is checked, or 49 over 50 is reported as meeting the floor.
  success_criterion: >-
    Both runs agree that 99 times 50 minus 49 times 100 is 50, that
    the five gaps are each 50, that their product is 312500000, that
    three times three is 9, and that 9 minus 3 is 6.
  falsification_criterion: >-
    The runs agree that 99 times 50 is 4950, and 4950 minus 4900 is
    not 50.
  required_artifacts:
    - experiments/EXP-BINSTD-0e31a9/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-0e31a9/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-0e31a9/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-0e31a9/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-0e31a9/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-0e31a9/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any certificate check, planted fault, or relation source.
    - Any claim that the three seals fail independently.
    - Any comparison with rho.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
