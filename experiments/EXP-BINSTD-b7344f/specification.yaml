experiment:
  id: EXP-BINSTD-b7344f
  hypothesis_id: H-BINSTD-32867d
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-793fd8
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Portfolio V(β) floor algebra + W4 controlled-null CV on RC-1
    (HOLD-U-corrected 793fd8 reading)
  status: analyzed
  approved_by: DEC-20261001-362f47
  approved_at: '2026-10-01'
  analyzed_by: DEC-20261001-817681
  analyzed_at: '2026-10-01'
  analyzed_note: >-
    Stages 0-2 completed under TASK-20261001-8c14b5; evidence EV-BINSTD-2d34cb;
    decision support (scoped DO-1) DEC-20261001-817681.
  packaging_only: false
  approval:
    approved_by: DEC-20261001-362f47
    composing_decision: DEC-20261001-362f47
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Does NOT claim a break, rho
      competitiveness win, CDCL heavy tails, or exponent move. Stages 0-2
      only under HOLD-U-corrected scope.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stage 0: symbolic V(β) table + product-law floors (no ECDLP attack
      runs). Stage 1: W4 closure cost-shape on RC-1 controlled null.
      Stage 2: ICPERF schema + portfolio-hold writeup. No CDCL engines.
      No Amazon Bedrock.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    (A) Stage 0: derive/verify V(β)<=0 for concentrated IC at floor ratio
    ρ>=1; commit closed-form V(β) table on ρ×β grid; tabulate ECC2K-130
    product-law FREE-oracle floor ratios vs rho~2^60.81 at m in
    {2,3,4,5,8}; write methodological note that Stage 1 is a controlled
    null only (no CDCL).
    (B) Stage 1: measure CV, max/median, Hill alpha_tail (+bootstrap CI)
    of W4 per-instance int32 opcounts on RC-1 (400 unsat + 100 planted
    sat), sat/unsat separate, with random-V and random-dense controls;
    log infra exclusions.
    (C) Stage 2: write ICPERF distribution-column schema request; declare
    portfolio claim held at m<=3; do not authorize CDCL portfolio runs.
    Claim no break and no exponent move.

  class: heuristic_validation
  class_note: >-
    Mixed: Stage 0 is symbolic cost-model correction (HEUR-H0 derived);
    Stage 1 is heuristic-validation of HEUR-H1 (controlled-null CV on W4).
    Pre-registered predictions frozen before Stage 1. Measured vs modeled
    columns stay separate. Not an exponent-moving experiment.

  scope:
    included:
      - >-
        Stage 0: v-beta-table.yaml (ρ grid × β grid); derivation-note.md
        (t-1 >= ln t); product-law-floors.yaml (m in {2,3,4,5,8});
        preregistered-predictions.yaml; methodological-note.md (controlled
        null; no CDCL; no break) — BEFORE Stage 1.
      - >-
        Stage 1: wrap EXP-CERTBIN-e94b27 W4 closure; log int32 opcounts and
        wall time per target; CV / max/median / Hill+bootstrap; sat/unsat
        separate; random-V and random-dense controls; infra-exclusion rate.
      - >-
        Stage 2: icperf-distribution-schema.yaml; portfolio-hold.md
        (m<=3 held by Stage-0 arithmetic; m>=4 is arity/oracle, not
        portfolio); decide DO-1..DO-5.
    excluded:
      - Running WDSat / CryptoMiniSat / CaDiCaL / Macaulay2 (not installed)
      - Running a concurrent rho∪IC portfolio attack on any curve
      - Claiming Stage-1 CV as CDCL heavy-tail evidence
      - Claiming V(β*)>0 or a deployed-curve break / exponent move
      - Editing IDEA-20260922-793fd8 claim text
      - Limb (D) partial-FB rho jump-set experiments
      - AUXIN edits
      - Amazon Bedrock
      - Retuning CV thresholds after Stage 1 without protocol_amendment

  inputs:
    proposal: ledger/proposals/IDEA-20260922-793fd8.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-32867d.yaml
    review: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-793fd8.yaml
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/closure.py
      - experiments/EXP-CERTBIN-e94b27/impl/driver.py
      - experiments/EXP-CERTBIN-e94b27/impl/stats_exact.py
    findings:
      - knowledge/findings/KN-FIND-5a8d3e.md
    literature:
      - knowledge/literature/KN-LIT-096.md
    related:
      - docs/claims-and-verification.md
      - docs/inventor-protocol.md
      - docs/target-result-profile.md
      - RQ-ICPERF-94c86e (schema successor only; not executed here)
    cells:
      Stage0-symbolic:
        rho_grid: [1, 1.5, 2, 10, 100]
        beta_grid: '0.05..0.95 step 0.05'
        m_values: [2, 3, 4, 5, 8]
        rho_baseline_log2: 60.81
        field_bits_n: 131
      Stage1-RC1:
        curve: 'CERTBIN RC-1 F_2[t]/(t^17+t^3+1)'
        n: 17
        l: 9
        V_size: 512
        n_unsat: 400
        n_sat_planted: 100
        cv_null_threshold: 0.1
        cv_anomaly_threshold: 1.0
        hill_bootstrap: 10000
      Stage2-schema:
        schema_columns:
          - cv_per_attempt
          - max_over_median
          - hill_alpha_tail_with_ci
          - watchdog_exclusion_rate

  controls:
    - name: symbolic_corner_beta0
      object: V(0)=0 by construction — baseline embedding check
    - name: rho_grid_nonpositive
      object: >-
        For every ρ>=1 on the Stage-0 grid, max_β V(β) <= 0 within 1e-9
    - name: random_V_matched_dim
      object: >-
        Second random 9-dimensional subspace; same W4 stats — bounds
        instrument-intrinsic spread
    - name: random_dense_matched_shape
      object: >-
        Dense random GF(2) systems of matched matrix shape; if W4 PDP
        CV matches random-dense CV, no PDP-specific tail
    - name: sat_unsat_separate
      object: Never pool sat and unsat cost samples (RQ-ICPERF discipline)
    - name: infra_exclusion_log
      object: >-
        Watchdog/OOM/crash exclusions counted and reported; never silently
        dropped into the finished sample
    - name: certificate_kind_vocabulary
      object: >-
        Every run manifest result.certificate.kind is one of
        discrete_log | decomposition | key_recovery | none
    - name: no_break_guard
      object: No break / exponent / CDCL-tail / positive-portfolio claim

  independent_variables:
    - floor_ratio_rho
    - budget_share_beta
    - arity_m
    - target_set  # unsat_archived | sat_planted | random_V | random_dense
    - seed

  metrics:
    primary:
      - V_beta_table
      - max_V_per_rho
      - product_law_floor_log2
      - product_law_floor_ratio_vs_rho
      - cv_per_attempt
      - max_over_median
      - hill_alpha_tail
      - hill_alpha_ci
      - infra_exclusion_rate
    secondary:
      - wall_s
      - peak_rss_bytes
      - opcount_mean
      - opcount_median
      - termination_reason

  heuristic_under_test:
    - HEUR-BINSTD-32867d-H0
    - HEUR-BINSTD-32867d-H1

  preregistered_prediction:
    quantity: >-
      (A) For every ρ in {1,1.5,2,10,100} and β on the 0.05..0.95 grid,
      V(β) <= 0 (HEUR-H0 / HOLD-U closed form).
      (B) Product-law FREE-oracle floor / rho > 1 at m in {2,3} for
      ECC2K-130 (HOLD-U ~218 at m=3).
      (C) W4 CV < 0.1 on RC-1 sat and unsat sets (HEUR-H1 controlled null).
      (D) Infra-exclusion rate reported; no numeric prediction.
    formula: >-
      Concentrated-IC / exponential-rho: with mu_IC = ρ·mu_rho and budget
      share β to IC, V(β) = mu_rho - (mu_rho/(1-β))·(1 - exp(-ρ·(1-β)/β));
      V(β)<=0 for ρ>=1 reduces to t-1 >= ln t at t=1/β (HOLD-U).
      Product-law FREE-oracle floor ~ m·2^131 field-op lower bound on
      relation collection (program BRIEF / HOLD-U); ratio vs 2^60.81.
      HEUR-H1: CV = std/mean of per-instance int32 opcounts < 0.1.
    source: >-
      analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-793fd8.yaml
      (HOLD-U concrete_experiment + core_argument_check); H-BINSTD-32867d;
      IDEA-20260922-793fd8 Stage-0 structure (immutable claim text not
      edited — experimental reading corrected here).
    claim_tier: observational
    measured_vs_modeled: >-
      Stage-0 V(β) values and product-law floors are MODELED / derived
      (labeled as such). Stage-1 CV, max/median, Hill alpha, wall_s, RSS,
      infra-exclusion rate are MEASURED. Never mix in one column.

  scale_relevance:
    tier: toy
    justification: >-
      Stage 0 ECC2K-130 floors are arithmetic bounds at n=131 (no attack
      run). Stage 1 executes only at RC-1 n=17. No transfer of Stage-1 CV
      to CDCL engines or to deployed B sizes is claimed.
    correspondence: >-
      None exact between W4 closure CV and CDCL search tails — Stage 1 is
      deliberately a controlled null, not a correspondence experiment.

  sample_size_justification: >-
    Stage 1 uses the full archived KN-FIND-5a8d3e unsat set (400) plus
    100 planted sat targets (HOLD-U concrete_experiment). Expected finished
    count >> 1; Hill estimator at N~400 remains indicative-only (disclosed
    confounder) — primary decision metric is CV < 0.1, which is stable at
    these N. Bootstrap 10^4 resamples for alpha CI. Controls: >=100
    random-V and >=100 random-dense instances of matched shape (or match
    unsat count if cheaper; freeze in Stage 0 plan).

  tail_checks:
    - Max observed opcount / median (robust heavy-tail signature).
    - Jackknife leave-one-out sensitivity of CV to the single largest sample.
    - Infra-exclusion rate vs finished-sample CV (artifact tell if exclusions dominate).
    - Random-dense CV vs PDP CV (instrument-intrinsic vs PDP-specific).

  replication:
    seeds:
      - 2026100101
      - 2026100102
      - 2026100103
    independent_instances: >-
      Stage 0 is deterministic (seed-free). Stage 1 primary metrics use
      the fixed archived target sets (no random draw beyond planted-sat
      construction seeds 2026100101..03 if planting requires RNG).
      Control generators use the same seed block. Additional seeds only
      via protocol_amendment.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 20
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete when V(β) table, derivation note, product-law floors, preregistered-predictions, and methodological-note exist BEFORE Stage 1.
    - Stage 1 complete when CV / max/median / Hill(+CI) / infra-exclusion reported for sat, unsat, random-V, and random-dense.
    - Stage 2 complete when icperf-distribution-schema.yaml and portfolio-hold.md exist and DO-* is named.
    - Advisory wall-clock: checkpoint and report; never fabricate completion.
    - If W4 wrap is infeasible: record IMP-instrument and stop Stage 1 as infrastructure — do not invent CV.

  invalidation_rules:
    - Reporting Stage-1 CV before Stage-0 artifacts exist
    - Pooling sat and unsat cost samples
    - Claiming Stage-1 results as CDCL heavy-tail or positive portfolio evidence
    - Claiming break / exponent / deployed V(β*)>0
    - Retuning CV thresholds after Stage 1 without protocol_amendment
    - Silently dropping infra failures from the cost sample
    - timeout/crash/OOM → failed_infrastructure, not negative math evidence
    - Amazon Bedrock invocation attempted → abort
    - certificate.kind outside vocabulary → invalid run
    - Editing IDEA-20260922-793fd8 claim text
    - Editing foreign EXP-CERTBIN-e94b27 records in place

  success_criterion: >-
    Stage 0 artifacts committed before Stage 1.
    Decidable success paths: (DO-1) Stage-0 V<=0 for ρ>=1 AND floor>rho
    at m<=3 AND Stage-1 CV<0.1; OR (DO-2) Stage-0 hold stands AND Stage-1
    CV anomaly diagnosed as instrument finding; OR (DO-3) Stage-0
    derivation failure caught and repaired via amendment.
    Positive DO-1 does NOT authorize a CDCL portfolio experiment or
    deployed claim.

  falsification_criterion: >-
    Stage-0 grid V(β)>0 for ρ>=1 (DO-3); OR Stage-1 CV>1 reported as
    CDCL/portfolio evidence without diagnosis (protocol violation); OR
    any break/exponent/deployed-portfolio claim; OR sat/unsat pooling;
    OR infra exclusions silently dropped.

  required_artifacts:
    - experiments/EXP-BINSTD-b7344f/stage0/preregistered-predictions.yaml
    - experiments/EXP-BINSTD-b7344f/stage0/methodological-note.md
    - experiments/EXP-BINSTD-b7344f/stage0/v-beta-table.yaml
    - experiments/EXP-BINSTD-b7344f/stage0/derivation-note.md
    - experiments/EXP-BINSTD-b7344f/stage0/product-law-floors.yaml
    - experiments/EXP-BINSTD-b7344f/stage1/cost-shape-summary.yaml
    - experiments/EXP-BINSTD-b7344f/stage1/cv-by-set.yaml
    - experiments/EXP-BINSTD-b7344f/stage1/controls-summary.yaml
    - experiments/EXP-BINSTD-b7344f/stage1/infra-exclusions.yaml
    - experiments/EXP-BINSTD-b7344f/stage2/icperf-distribution-schema.yaml
    - experiments/EXP-BINSTD-b7344f/stage2/portfolio-hold.md
    - experiments/EXP-BINSTD-b7344f/runs/
    - experiments/EXP-BINSTD-b7344f/implementation/

  optimistic_assumptions_disclosed:
    - >-
      Product-law FREE-oracle floors are optimistic on oracle cost
      (oracle cost = 0 in the floor); bias direction: understates true
      IC floor → if even the free floor exceeds rho, the true floor does
      too. Labeled bound, not a prediction of achievable IC time.
    - >-
      Idealised V(β) ignores concurrent-execution memory/cache contention;
      any simulated positive V would be an upper bound — moot under
      ρ>=1 where V<=0.
    - >-
      Hill estimator at N~400 is biased/unstable; CV is the primary
      Stage-1 decision metric; alpha is indicative-only.
    - >-
      W4 controlled null does NOT transfer to CDCL; absence of engines is
      disclosed as IMP-no-cdcl, not as thin-tail evidence.

  memory_accounting: >-
    Dominant structures: W4 Macaulay/mutant matrices at RC-1 scale (same
    as EXP-CERTBIN-e94b27; historically <<1 GiB); opcount sample vectors
    of length <=500; Stage-0 tables negligible. peak_rss_bytes reported
    per Stage-1 run and reconciled against declared matrix buffers.
    No van Oorschot–Wiener tradeoff in this contract. Concurrent portfolio
    memory sum is disclosed as a reason portfolios are worse on memory
    even when V were positive — not measured here.

  certificate:
    kind_vocabulary:
      - discrete_log
      - decomposition
      - key_recovery
      - none
    stage0_kind: none
    stage1_cost_shape_kind: none
    optional_planted_sat_relation_kind: decomposition
    stage2_kind: none
    note: >-
      Primary Stage-1 deliverable is cost-shape statistics; manifests use
      certificate.kind none. If a planted sat target's closure is counted
      as a verified decomposition relation, use certificate.kind
      decomposition and re-verify on a fresh curve object. No discrete_log
      solutions are required; if a run claims a DLP solve anyway it must
      use discrete_log and re-verify [x]P=Q.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
