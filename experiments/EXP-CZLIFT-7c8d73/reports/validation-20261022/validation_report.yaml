  summary: >-
    Custody is exact (J1 holds). Every recorded metric recomputes exactly from raw-result.json on both seeds,
    and a full independent replay that uses a correct formal-group series reproduces all 3248 recorded rows.
    Two findings break joints. (1) The frozen control "pert_p (non-split) must never yield a construction",
    read as written, fails on both seeds: 8 pert_p constructions per seed, and the producer's checker never
    evaluates this control. Those 16 rows come from two pert_p lifts that are in fact split: exact
    v_p(j - j_cm) = 2 = 2e, and an independent construction gives p-torsion to z-valuation >= 21. The fault is
    in the class label, not the instrument (J2 breaks on the control). (2) The producer's log_F and exp_F are
    the identity mod z^7 on every curve. czlift_formal.formal_series truncates w at z^6 and then pads
    u = w/z^3 with zeros, so the true term (2A/5) z^5 is missing on the 18 of 29 curves with A != 0. The
    plan's literal blind quantity (A = 0) agrees exactly. Following the specification's curve family, it
    disagrees (J3 breaks). The defect cannot change any recorded number at precision 6, which the full
    replay confirms. PTM-1 holds on every genuinely non-split pert_p lift. Terminal verdict: failed.
    The receipts accurately record a computation, but that computation does not implement the specified
    instrument, and a frozen control fails as written. Any amendment or superseding run is the
    Coordinator's call.

