  blind_rederivation:
    joint: J3
    sealed_before_blind_from: true
    seal: experiments/EXP-CZLIFT-7c8d73/reports/validation-20261022/blind/SEAL.sha256 (sealed_at 2026-10-22T08:36:10Z; sha256 8652f97e9290aeac84656d38827298f66beec1b048494b0ad7a1e5297621c0e6)
    files:
      blind/blind_formal_log.py: a47329685a827c7e0a97a5984f253a69fbd097579fa24262e6cc19152e19bc89
      blind/blind_output.json: e7678deadc84a5ff91952790775be70f098d982ebd32c867dc815b5c3a776e4b
      blind/blind_stderr.log: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
    method: >-
      Silverman AEC IV: w from w = z^3 + A z w^2 + B w^3, omega = (z w' - w)/(2w) dz, log_F = integral of omega,
      exp_F = reversion. Exact over Q[A, B] to z^25. Self-checks: exp_F(log_F(z)) = z, mu_6 symmetry for A = 0
      (only z^n with n = 1 mod 6), the weight rule, and numeric additivity on E1(Q_p) by the chord law. A wrong
      log (z + z^3/3) fails additivity at valuation 3 (negative control). The search for anomalous j=0 primes was
      brute-force confirmed for p <= 200.
    plan_vs_specification_contradiction: >-
      The plan states the quantity for "y^2 = x^3 + B" but takes the curve family "as stated in
      specification.yaml". That family is harness.czlift.anomalous_cm_curves(1500): 29 curves y^2 = x^3 + A x + B,
      18 of them with A != 0, plus pert lifts of the j=0 curves with A = p r and A = p^2 r. Per the task, the
      specification is followed and both readings were sealed. The literal reading is
      blind_quantity_symbolic.reading_a. The specification reading is log_F_general_AB, whose z^5 coefficient
      is 2A/5.
    sealed_values:
      literal_reading_a_z0_to_z6: '[0, 1, 0, 0, 0, 0, 0]  (y^2 = x^3 + B, any B; p = 7, B = 5 mod 7^6)'
      literal_reading_b_z1_to_z7: '[1, 0, 0, 0, 0, 0, 3B/7]  (z^7 coefficient not 7-integral at p = 7)'
      specification_family_mod_z7: 'log_F = z + (2A/5) z^5 ; exp_F = z - (2A/5) z^5 ; next terms (3B/7) z^7, (2/3)A^2 z^9'
      anomalous_j0_curves: '(p, B) = (7,5) (19,10) (37,5) (61,2) (127,3) (271,12) (331,2) (397,6) (547,2) (631,3) (919,15)'
    comparison: experiments/EXP-CZLIFT-7c8d73/reports/validation-20261022/j3_compare.py -> j3_compare.out.json
    result_literal: >-
      AGREES. The producer's formal_series(ZpCurve(7, 6, 0, 5)).log_F = [0, 1, 0, 0, 0, 0, 0], equal to sealed
      reading_a. Reading b differs only because the producer truncates at z^6, which is consistent with the
      hypothesis assumption k = 6 < p. The 11 producer D=-3 curves are exactly the 11 (p, B) the blind search
      found.
    result_specification: >-
      DISAGREES on 18 of 29 curves, every A != 0 curve, in both log_F and exp_F, at the z^5 coefficient. Example:
      D=-11, p=223 has producer 0 and blind 2A/5 mod 223^6 = 73787097714279. The w series agrees mod z^7. The
      cause is in harness/czlift_formal.py formal_series: w is iterated only to z^k (N = k+1), then
      u = Series(w.c[3:] + [0, 0, 0]) pads u_4..u_6 with zeros where the true values are u_4 = A, u_6 = B, so u = 1
      and log_F = exp_F = z mod z^7. The docstring's claim "the series are exact mod p^k" is therefore false for
      A != 0. The plan's literal quantity cannot detect this: for A = 0, the mu_6 automorphism forces the
      z^2..z^6 coefficients to be 0, which coincides with the zero padding.
    impact_on_recorded_values: >-
      None measurable at precision 6. v_p(log_F(z)) = v_p(z) for v_p(z) >= 1 and p > 2. The missing term has
      valuation >= 5 + v(A) on non-split rows and >= 10 on split rows. The constructed P~ differs from the
      specified P^ - exp_F(lambda/p) only at z-valuation >= 5, which the precision-5 verification cannot see. The
      full replay with the correct series reproduces every recorded row.

  proves_too_much:
    id: PTM-1
    object: The pert_p (non-split) lift.
    verdict: holds
    evidence: >-
      On each seed, 456 of 464 pert_p rows are genuinely non-split: v_dj = 1 for e = 1, v_dj = 3 < 6 for e = 3.
      The independent replay finds v_p(z([p]P^)) = 1 on all 456, and 0 constructions are recorded on them, which
      is the expected signature. Mathematically no p-torsion lift can exist there. [p]E1 is contained in E2 for
      p > 2, so for any lift P^ + U the value z([p](P^ + U)) = z(T + [p]U) has valuation exactly 1.
    why_the_8_rows_per_seed_cannot_show_the_signature: >-
      The remaining 8 rows per seed (p=17 D=-67 on seed 20261009; p=223 D=-11 on seed 20261010) carry the
      pert_p label, but their lifts are split: exact v_p(j - j_cm) = 2 = 2e, from j_A r1 + j_B r2 = 0 mod p. On a
      split lift a p-torsion lift of every P exists, so the known-false conclusion is true there and the
      "no construction may verify" signature is mathematically impossible. The validator's own construction
      verifies p-torsion to z-valuation >= 21 on all 16 rows. The verified constructions on these rows are
      correct behaviour of the instrument, and the failure is in the producer's class label (reported under
      J2/C1).

  verdict: failed
  verdict_basis: >-
    J2 breaks: frozen control C1, evaluated as written on raw-result.json, fails on both seeds; the checker does
    not evaluate it; and the "independent" checker is the producer's own code path. J3 breaks on the
    specification reading: the series instrument's log_F/exp_F omit (2A/5) z^5 on 18 of 29 curves, so the
    computed lambda is not log_F(z([p]P^)) mod p^6 as specified (it differs at p^5 on 280 rows per seed). Custody
    (J1) holds, and every recorded metric value is exactly reproduced, including by an independent correct-series
    replay. A passed verdict would certify an instrument the receipts do not implement and a control the data
    violate as written. This verdict asserts nothing about H-CZLIFT-d3dc4b and authorizes nothing. Any amendment
    (relabelling pert_p by the j-rule or forcing v(dj) = 2e - 1; computing w through z^(k+3) before forming u) and
    any superseding run are for the Coordinator.

  limitations:
  - The replays are verifications under this report's folder, not trials or run records.
  - Sampling inputs were regenerated with producer functions (run.lift_classes, czlift.random_point, toycurve); the sampling procedure itself was not reimplemented. Every downstream computation is independent.
  - The archive receipts carry commit_sha null, bound in dispatch_queue.json's archive block. That file is outside the read scope and was not read, so the commit binding was not verified. Content binding was verified by hash.
  - Neither manifest records peak memory. dirty false is consistent with the source hashes at the run commit and cannot be re-verified otherwise.
  - Scope observation, outside the joints owned here (PD-1). harness.czlift.anomalous_cm_curves omits the class-number-one non-maximal order of discriminant -27 (j = -12288000), which has anomalous curves at p = 7, 61, 331, 547 (scope_check_d27.out.txt). The frozen family is still the 29 curves the specification names.
