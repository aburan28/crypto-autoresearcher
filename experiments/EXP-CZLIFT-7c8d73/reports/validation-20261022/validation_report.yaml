  control_checks:
  - control: "C1: pert_p (non-split) must never yield a construction; canonical, isomorphic and pert_p2 must always."
    evaluated_by_producer_checker: false
    result_as_written: FAIL on both seeds (negative half); positive half holds (0 missing constructions)
    rows: >-
      Seed 20261009 (RUN-CZLIFT-ac0be5): raw.curves[p=17, D=-67].rows[24..31], the first pert_p lift
      (A2=-85963476, B2=306775459068, r1=r2=12), with v_dj=2, v_log=2, constructed/verified/reduces true.
      Seed 20261010 (RUN-CZLIFT-8cd006): raw.curves[p=223, D=-11].rows[24..31], the first pert_p lift
      (A2=-51863, B2=9926015, r1=151, r2=209), with v_dj=2, v_log=2, constructed/verified/reduces true.
    diagnosis: >-
      For e = 1, run.lift_classes draws pert_p = (A + p r1, B + p r2) with r1, r2 random. Then
      j(E^) - j_cm = p (j_A r1 + j_B r2) mod p^2, so the lift is split (v >= 2 = 2e) whenever
      j_A r1 + j_B r2 = 0 mod p, which happens with probability about 1/p. The validator's exact computation
      gives v_p(j_A r1 + j_B r2) = 1 and v_p(j - j_cm) = 2 for both lifts. The expected number of such lifts per
      seed, sum over the e = 1 curves of 2/p, is 0.478; one per seed was observed. For e = 3, pert_p has
      A = p r with r a unit, so v(j) = 3 exactly and the lift is never split. The 16 rows are split lifts
      mislabelled pert_p. The instrument's constructions on them are correct (independent torsion to
      z-valuation >= 21). The frozen control's premise is false for these lifts, and the control was never
      evaluated by the checker. The receipts record the run valid and "check ok" without it.
  - control: "C2: The checker verifies log_F and exp_F are mutually inverse at the run precision."
    result_as_written: 'pass (check.py tests exp(log(z)) == z and log(exp(z)) == z at z = 3p + 5p^2 on D=-163, p=1019)'
    finding: >-
      Vacuous. The producer's log_F and exp_F are both exactly z mod z^7 on all 29 curves (j3_compare.out.json),
      and the identity is self-inverse, so this control cannot fail. check.py's comment says log_F "is additive on
      a formal point pair", but no additivity test exists. The validator's additivity test (own chord law in the
      (z, w) plane) fails for the producer's log_F mod p^6 at valuation 5 on every A != 0 curve tested
      (D=-11 p=223, 619; D=-67 p=17; D=-163 p=41). The blind log passes to valuation 25.
  - control: "C3: The j-distance rule is computed independently of the series (precision 8 j-invariant)."
    result: pass
    detail: >-
      run.measure_curve computes v_dj from ZpCurve(p, 8, A2, B2).j_invariant() with no series input. The
      validator's exact rational j reproduces all 3248 v_dj values, capped at 8.
  - control: "invalidation rule: the checker cannot reproduce its re-run subset from the recorded inputs."
    result: not triggered
    detail: >-
      The checker re-runs curves 1-2 (D=-3, p=7 and p=19) and they reproduce. The validator re-ran all 29 curves
      and they reproduce. The checker's subset has only A = 0 curves, where the series defect is masked by
      symmetry (see J3).
  - control: stopping rules
    result: pass (two output_validated receipts; no crash or timeout)
  - control: independence of the "independent checker"
    result: not independent
    detail: >-
      check.py imports run.measure_curve and run.summarize. Its summary check compares the producer's summarize
      with itself, and its reproduction uses the producer's code path. It is a replication check. The
      independent recomputations are this report's.
  - borderline_probes: >-
      No exclusions or silent drops: all 1624 rows are present per seed and the cell counts are exact. Rows at the
      rule threshold (v_dj = 2e): 472 (seed 20261009) and 464 (seed 20261010). Every one is split with
      v_log >= 2; this includes the 8 mislabelled pert_p rows per seed and, on seed 20261010, 8 pert_p2 rows that
      landed at v_dj = 3. Rows one below threshold (v_dj = 2e-1, e=1 pert_p): 280 per seed, all with v_log = 1
      and no construction. e=3 pert_p rows (v_dj = 3): 176 per seed, all with v_log = 1. The v_dj = 8 cap is
      reached only on canonical/isomorphic rows, where j equals j_cm exactly. v_log = 2 exactly occurs on 1148
      and 1145 rows. v_log histograms: {1: 456, 2: 1148, 3: 18, 4: 2} and {1: 456, 2: 1145, 3: 22, 4: 1}. The
      v_log >= k = 6 branch of p_torsion_lift (which returns P^ itself) is never exercised, and v_log = 0 never
      occurs. There are no fits, so there are no singular-fit cases.

