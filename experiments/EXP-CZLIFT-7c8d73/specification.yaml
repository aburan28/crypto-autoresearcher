experiment:
  id: EXP-CZLIFT-7c8d73
  hypothesis_id: H-CZLIFT-d3dc4b
  source_idea: IDEA-20261009-00514a
  question_id: RQ-CZLIFT-b9f765
  goal_id: GOAL-CZLIFT-1516d5
  version: 1
  title: 'Serre-Tate level-1 splitting by explicit construction: log_F / exp_F series, p-torsion lift built and
    verified, against the j-distance rule'
  status: approved
  frozen: true
  designed_at: '2026-10-09'
  approved_by: coordinator
  approval_decision: DEC-20261009-575cd3
  execution_authorized: true
  status_note: Frozen at version 1 and approved 2026-10-09 by DEC-20261009-575cd3 under AGENTS.md 'Standing user
    authorization' and the user's request of 2026-10-09 to design and execute all accepted angles; driver and checker
    smoke-tested before freezing. Approval asserts nothing about H-CZLIFT-d3dc4b.
  objective: On the 29 anomalous CM curves and four lift classes, compute v_p(log_F(z([p]P^))) from the formal-group
    series at precision 6, construct P~ = P^ - exp_F(log_F/p) when p^2 divides the log, verify [p]P~ = O and reduction,
    and compare the split flag with the j-distance rule.
  inputs:
    curves: harness.czlift.anomalous_cm_curves(1500), 29 curves
    lift_classes:
    - canonical
    - isomorphic
    - pert_p
    - pert_p2
    per_class: 2
    samples_per_cell: 8
    precision: 6
    seeds:
    - 20261009
    - 20261010
  controls:
  - pert_p (non-split) must never yield a construction; canonical, isomorphic and pert_p2 must always.
  - The checker verifies log_F and exp_F are mutually inverse at the run precision.
  - The j-distance rule is computed independently of the series (precision 8 j-invariant).
  independent_variables:
  - lift class
  - p, D
  metrics:
    primary:
    - rule_agreement
    - construction_verified_rate
    - construction_reduces_rate
    - nonsplit_with_construction
    secondary:
    - by_class frac_split
  heuristic_under_test: null
  preregistered_prediction:
    quantity: rule_agreement, construction_verified_rate, construction_reduces_rate, nonsplit_with_construction
    formula: rule_agreement = 1, construction_verified_rate = 1, construction_reduces_rate = 1, nonsplit_with_construction
      = 0 on both seeds
    source: H-CZLIFT-d3dc4b predictions
  scale_relevance:
    tier: toy
    justification: tested parameters as listed under inputs; no crypto-scale statement
    correspondence: null
  tail_checks:
  - every per-run primary metric is recorded so a near-miss on one seed can be compared with the other
  replication:
    seeds:
    - 20261009
    - 20261010
    independent_instances: 2
    replication_note: two trials; a prediction counts only if it holds on both
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1
  stopping_rules:
  - Stop after the two planned trials have output_validated receipts.
  - A crash or timeout is failed_infrastructure; never a metric value.
  invalidation_rules:
  - The checker cannot reproduce its re-run subset from the recorded inputs.
  success_criterion: 'On both seeds: rule_agreement = 1.0, construction_verified_rate = 1.0, construction_reduces_rate
    = 1.0, nonsplit_with_construction = 0.'
  falsification_criterion: On both seeds a sample where the series instrument and the j-distance rule disagree,
    or a split sample whose constructed lift fails verification.
  decision_impact:
    on_positive: H-CZLIFT-d3dc4b moves to supported after review; EXP-CZLIFT-17b7eb's rule gains an independent
      instrument and the explicit torsion construction is recorded as the witness of the Serre-Tate splitting.
    on_negative: A disagreement between the two instruments sends both to repair; neither reading is trusted until
      they agree.
  required_artifacts:
  - experiments/EXP-CZLIFT-7c8d73/runs/<RUN-ID>/manifest.yaml
  - experiments/EXP-CZLIFT-7c8d73/runs/<RUN-ID>/raw-result.json
  - experiments/EXP-CZLIFT-7c8d73/runs/<RUN-ID>/command.txt
  - experiments/EXP-CZLIFT-7c8d73/runs/<RUN-ID>/environment.json
  - experiments/EXP-CZLIFT-7c8d73/runs/<RUN-ID>/stdout.log
  - experiments/EXP-CZLIFT-7c8d73/runs/<RUN-ID>/stderr.log
  launcher:
    trial_plan: experiments/EXP-CZLIFT-7c8d73/trial-plan.json
    driver: experiments/EXP-CZLIFT-7c8d73/implementation/run.py
    checker: experiments/EXP-CZLIFT-7c8d73/implementation/check.py
    library:
    - harness/czlift.py
    - harness/czlift_formal.py
    - harness/czlift_run.py
    - harness/toycurve.py
  assigned_to: executor
  out_of_scope:
  - Any claim about a deployed curve.
