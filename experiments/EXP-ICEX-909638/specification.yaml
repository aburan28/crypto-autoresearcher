experiment:
  id: EXP-ICEX-909638
  hypothesis_id: H-ICEX-c3de6f
  version: 1
  title: >-
    Joint dependence of the coarsened division-polynomial residue ladder, with a
    duplicate-plant ladder and a curve-free matched-degree polynomial null
  status: draft
  objective: >-
    Measure the pairwise and joint dependence of the five coarsened
    division-polynomial statistics s_ell = chi_p(psi_ell(x)) for ell in
    {3, 5, 7, 11, 13} on a shared sample of uniformly drawn subgroup points, and
    report the effective independent count N_eff against the nominal count 5.
    The coarsening is declared because the raw residue ladder is a deterministic
    function of one field element, for which N_eff is 1 by construction and no
    alternative hypothesis can move it.
  inputs:
    curves: at least 5 toy prime-order curves at 20 to 28 bits
    points_per_curve: 20000
    ell_ladder: [3, 5, 7, 11, 13]
    statistic: Legendre symbol of psi_ell evaluated at the point x-coordinate
    duplicate_plant_k: [0, 1, 2]
  controls:
  - >-
    NAMED CONTROL C1, DUPLICATE PLANT LADDER, DEFECT OF KNOWN SIZE. The panel is
    re-run with k exact duplicates of s_3 appended, k in {1, 2}. Predicted
    magnitude, binding - N_eff must fall exactly k below the nominal count 5 + k,
    within +/- 0.25. The two-point ladder is the demonstrated dynamic range. A
    control that merely returns a number without matching both plants is not
    accepted.
  - >-
    NAMED CONTROL C2, INDEPENDENT SYNTHETIC PANEL, UPPER ANCHOR. Five
    independently generated three-valued variables matched on the observed
    marginal symbol distribution. Forced value - N_eff = 5.00 within +/- 0.25. A
    departure means the estimator is biased and every N_eff is inadmissible.
  - >-
    NAMED NULL C3, CURVE-FREE MATCHED-DEGREE POLYNOMIAL FAMILY, MANDATORY. Five
    uniformly random polynomials over F_p of degrees 4, 12, 24, 60 and 84,
    evaluated at uniformly drawn field elements under the identical Legendre
    coarsening. This object contains no elliptic curve. CONSEQUENCE PRE-STATED -
    if it reproduces the N_eff deficit within 0.25, the deficit is a property of
    polynomial degree and coarsening, and NOTHING from this experiment may be
    quoted as a statement about elliptic curves or the ECDLP.
  - >-
    NAMED NULL C4, RANDOM-FIELD-ELEMENT BASELINE. The same curve psi_ell
    polynomials evaluated at uniformly drawn elements of F_p rather than at
    x-coordinates of subgroup points. This separates dependence arising from the
    shared algebraic definitions from dependence arising from the point sample
    lying on the curve.
  - >-
    NAMED CONTROL C5, SHARED SAMPLE. All statistics are evaluated on one and the
    same point sample per curve, so measured dependence is not a sampling
    artifact.
  - >-
    NAMED CONTROL C6, ZERO CENSUS. Points with psi_ell(x) = 0 are counted and
    reported per ell rather than folded silently into the symbol distribution.
  independent_variables: [curve, ell_pair, duplicate_plant_k, sample_arm]
  metrics:
    primary:
    - effective_independent_count_n_eff_dimensionless
    - pairwise_normalised_mutual_information_matrix_dimensionless
    secondary:
    - total_correlation_in_bits
    - marginal_symbol_distribution_per_ell
    - zero_census_per_ell
    - bootstrap_confidence_intervals_for_n_eff
    - duplicate_plant_and_synthetic_panel_readings_beside_their_forced_values
    - curve_free_and_random_field_element_null_readings
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: >-
      N_eff, the effective independent count, defined as the participation ratio
      of the eigenvalue spectrum of the matrix of pairwise normalised mutual
      informations with unit diagonal, in units of statistics.
    formula: >-
      N_eff <= 4.0 with a bootstrap 95 percent interval excluding 4.0, on at
      least three of the five tested curves, while the independent synthetic
      panel returns 5.00 +/- 0.25 and each duplicate plant reduces N_eff by
      exactly k +/- 0.25.
    source: >-
      H-ICEX-c3de6f, HEUR-001 and predictions 1 to 3. The estimator and the band
      are frozen before any curve arm is run.
  scale_relevance:
    tier: toy
    justification: >-
      Toy prime-order curves at 20 to 28 bits with 20000 points each. The
      statistics take at most three values, so the estimator is far from
      saturated at this sample size; the number is a property of the declared
      coarsening at the tested curves and no transfer is claimed.
    correspondence: null
  tail_checks:
  - >-
    The most dependent pair is reported with its prime pair and its normalised
    mutual information, so a single dominant pair cannot hide inside a summary
    N_eff.
  - >-
    The curve with the lowest N_eff is reported individually with its invariants,
    to check whether a low count is a per-curve accident rather than a property
    of the ladder.
  replication:
    seeds: [1, 2, 3, 4, 5]
    independent_instances: 5
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 4
    maximum_memory_gb: 8
    maximum_runs: 60
  stopping_rules:
  - >-
    Stop a run at 600 s and record it as resource_exhaustion; the division
    polynomial of degree 84 is computed once per curve and evaluation is linear
    in the sample, so a timeout indicates an implementation fault rather than a
    cost.
  - >-
    Stop the experiment if the independent synthetic panel fails its forced
    value, before any curve arm is interpreted.
  invalidation_rules:
  - >-
    Failure of the k = 1 duplicate plant to move N_eff by 1.00 +/- 0.25
    invalidates every N_eff in the run.
  - >-
    Failure of the independent synthetic panel to return 5.00 +/- 0.25
    invalidates every N_eff in the run.
  - >-
    Any statistic evaluated on a sample not shared with the other statistics is
    invalid_measurement.
  - >-
    Any run in which a sampled point's scalar was retained or used invalidates
    that run; the discard is enforced mechanically and the enforcement is an
    artifact.
  success_criterion: >-
    The duplicate plants and the synthetic panel return their forced values;
    N_eff is at or below 4.0 with a bootstrap interval excluding 4.0 on at least
    three curves; and the curve-free matched-degree polynomial null does NOT
    reproduce the deficit.
  falsification_criterion: >-
    Any of the following falsifies H-ICEX-c3de6f within the tested scope - N_eff
    at or above 4.0 with its interval excluding 4.0 on at least three curves,
    meaning the coarsened statistics are effectively distinct here; or the
    curve-free matched-degree null reproducing the deficit, meaning the
    dependence is definitional. A duplicate-plant or synthetic-panel failure is
    not a mathematical result of either sign - it voids the instrument.
  required_artifacts:
  - curve parameters, generator, subgroup order and cofactor per instance
  - the shared point sample identifier and the mechanical scalar-discard receipt
  - psi_ell coefficient vectors per curve, with their degrees
  - the full symbol table per point per ell, or its hash plus a reproducible regeneration recipe
  - pairwise mutual-information matrix and the N_eff computation inputs
  - duplicate-plant, synthetic-panel, curve-free and random-field-element arm outputs
  - zero census per ell
  - per-run manifest, command, environment, git commit, stdout, stderr, validity status
  assigned_to: executor
  approved_by: null
