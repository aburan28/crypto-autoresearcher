# EXP-BINSTD-0409c9
# Stable-subspace orders. No tuple census.
# Approved by DEC-20261002-ed4050.
experiment:
  id: EXP-BINSTD-0409c9
  hypothesis_id: H-BINSTD-d35acf
  source_idea: IDEA-20261001-93e740
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Stable-subspace orders
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-ed4050
  objective: >-
    Compute the order of 2 modulo six primes, the stable-subspace
    counts, and the side of 16/17 against 0.94.
  inputs:
    orders: {17: 8, 23: 11, 31: 5, 41: 20, 131: 130, 163: 162}
    factors: {17: 2, 23: 2, 31: 6, 41: 2, 131: 1, 163: 1}
    subspaces: {17: 8, 23: 8, 31: 128, 41: 8, 131: 4, 163: 4}
    dims_17: [0, 1, 8, 9, 16, 17]
    dims_23: [0, 1, 11, 12, 22, 23]
    dims_31: [0, 1, 5, 6, 10, 11, 15, 16, 20, 21, 25, 26, 30, 31]
    dims_41: [0, 1, 20, 21, 40, 41]
    dims_131: [0, 1, 130, 131]
    dims_163: [0, 1, 162, 163]
    dim9_at_17: true
    dim9_at_131: false
    loss_num: 16
    loss_den: 17
    loss_above_94: true
    loss_below_95: true
  controls:
    - >-
      An order of 4 modulo 17 is the half-order. 2^4 is 16 modulo
      17, not 1. Reporting order 4 invalidates the run.
    - >-
      An order of 10 modulo 31 is twice the true order. 2^5 is 1
      modulo 31. Reporting 10 invalidates the run.
    - >-
      A subspace count of 64 at degree 31 drops the linear factor.
      The count is 128. Reporting 64 invalidates the run.
    - >-
      Dimension 9 at degree 131 is the degree-17 value. The
      degree-131 list is 0, 1, 130, 131. Reporting 9 there
      invalidates the run.
    - >-
      A loss of at most 0.94 is false. 16/17 is strictly above
      94/100 and strictly below 95/100. Reporting otherwise
      invalidates the run.
    - Two order routes. They must not import each other.
  independent_variables:
    - degree
    - route in {successive, divisor_check}
  metrics:
    primary:
      - order_31
      - subspaces_31
      - dim9_at_131
      - implementations_agree
    secondary:
      - loss_sides
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The order 5 modulo 31 and the subspace count 128.
    formula: >-
      The order is the least positive k with 2^k congruent to 1.
      The factor count is (n-1)/k. The subspace count is 2 to the
      power 1 plus that factor count. The dimensions are j k and
      j k + 1. The loss 16/17 is compared with 94/100 and 95/100
      by cross-multiplication.
    source: >-
      IDEA-20261001-93e740 states these orders and counts, and a
      loss of about 0.94 at degree 17, read 2026-10-02. The
      orders were computed in this design session. That
      computation is not a run. The loss is 16/17, strictly above
      0.94. No tuple census was run.
  scale_relevance:
    tier: toy
    justification: Six orders and one fraction. No transfer to a decomposition.
    correspondence: null
  tail_checks:
    - Degree 163 is required. Stopping after degree 131 and still reporting the degree-163 order is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other order route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the order modulo 31 is reported as 10, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The order modulo 17 is reported as 4.
    - The order modulo 31 is reported as 10.
    - The degree-31 subspace count is reported as 64.
    - Dimension 9 is reported at degree 131.
    - 16/17 is reported at most 0.94 or at least 0.95.
    - A solution-tuple census is reported.
  success_criterion: >-
    Both runs agree on the orders 8, 11, 5, 20, 130 and 162, the
    subspace counts 8, 8, 128, 8, 4 and 4, the six dimension lists,
    and the sides of 16/17. Dimension 9 stays in the degree-17 list
    and out of the degree-131 list. The order modulo 31 stays 5.
  falsification_criterion: >-
    The runs agree, the order modulo 31 stays 5, dimension 9 stays
    out of the degree-131 list, and any count differs from the
    preregistered table.
  required_artifacts:
    - experiments/EXP-BINSTD-0409c9/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-0409c9/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-0409c9/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-0409c9/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-0409c9/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-0409c9/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any solution-tuple census, symmetry-breaking rule, or curve search.
    - A claim that a Frobenius constraint is sound or unsound on instances.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
