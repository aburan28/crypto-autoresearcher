experiment:
  id: EXP-ICEX-87fbf7
  hypothesis_id: H-ICEX-ab1da2
  derived_from_idea: IDEA-20260830-f89eaf
  question_id: RQ-FBG-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    First measurement of rank-saturation overhead per factor-base geometry - seven arms by four
    group-order rungs, with the full rank staircase archived, a matched random baseline, a
    duplicated-column positive control forced infinite, a paired row-permutation recomputation, a
    second independent arithmetic path, and a CURVE-FREE row generator of identical row shape that
    fixes the scope of the baseline
  objective: >-
    Reduce exactly one uncertainty, and it is the one this program's own conservation finding names
    as uncaptured: whether structured factor-base geometries underperform ONLY through coverage, or
    ADDITIONALLY through rank degeneracy so that the two penalties compound. This repository holds
    zero measured rank values for any geometry, and a one-sided rank bound elsewhere in the program
    rests on a random-base baseline nobody has measured. The run produces that baseline with an
    interval, produces the per-geometry differences against it, and separates the two explanations,
    which make opposite predictions on the same battery.
    The run additionally establishes the SCOPE of the baseline. How many bounded-weight rows with a
    fixed row sum and shared right-hand-side blocks are needed to span is a question about that row
    model; the curve-free arm decides whether the measured baseline is a statement about
    elliptic-curve factor bases or about rows of that shape.
  what_this_is_not:
    - >-
      Not an attack, not a break, not a speedup. No solve is run, no solve time is reported and no
      linear-algebra method is benchmarked or compared.
    - >-
      Not a displacement-rank measurement. That is a different invariant, defined relative to a
      declared shift operator, and it answers a structured-solve question rather than a
      relation-count one.
    - >-
      Not a coverage measurement and not a substitute for one. kappa charges nothing for FINDING the
      decomposable targets; the two channels are reported side by side and never netted.
    - >-
      Not a certificate-bearing run. Relations are harvested by exact enumeration with known
      logarithms at toy scale, so no solve certificate exists and none is claimed.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence.
      approved_by is null.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: at the four tested rungs, over the seven panel arms, under the
      declared unknown set, harvest order and infinity budget, the rank-saturation overhead of each
      geometry does or does not differ from the matched random baseline by more than the stated
      per-rung resolution, and its trend across the rungs does or does not exclude zero. WHAT DOES
      NOT FOLLOW: no solve time, no speedup, no exponent, nothing about a different formulation of
      the index-calculus linear algebra, nothing at cryptographic scale, and - if the curve-free
      generator reproduces the baseline - nothing specific to elliptic-curve factor bases.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, blocking, HARD GATE). Fix in writing and hash: the unknown set at B+1;
      the harvest order; the infinity budget as a declared multiple of B+1 rows; the panel; the
      base-size rule per rung; the arity; the target-draw law; the per-rung RESOLUTION, since kappa is
      quantised in steps of one over B+1 and a global threshold would be below the resolution at the
      smallest rung; and the machine description. Verify each arm's constructed geometry against the
      committed source - a live harness path builds one named geometry under a different name and has
      NO seed dependence, so its intervals would be degenerate and reporting a seed interval for it is
      PROHIBITED. Re-read the committed finding and the committed battery artifact and record what
      they actually say about coverage, concentration and the observed effective-size drop.
      STAGE 1 (harvesting). At each rung, for each arm, each curve and each seed, draw targets with
      uniform independent coefficients, enumerate ALL decompositions of each decomposable target
      exactly, and append the rows in the declared order.
      STAGE 2 (rank staircase). Maintain the rank incrementally over the prime field and record the
      FULL STAIRCASE - rank as a function of rows appended - not merely the endpoint. Stop at full
      rank or at the infinity budget. Compute kappa.
      STAGE 3 (paired controls). Recompute kappa on a uniformly random permutation of the IDENTICAL
      row multiset, and recompute the rank through a second independent arithmetic path as a
      consistency check on the implementation.
      STAGE 4 (curve-free arm). Generate rows from a curve-free generator matched on row shape, weight
      bound, row sum, block size and block count, with no curve, no group law and no decomposition, and
      run Stages 2 and 3 on it identically.
      STAGE 5 (analysis). Report kappa per arm per rung with bootstrap intervals over curves and
      seeds, the differences against the matched random baseline, and the growth slopes with one Holm
      correction across the panel. Report the distinct-decomposable-target count and the rows-per-target
      concentration as the covariates that separate the two mechanisms.
    instrument: >-
      Exact decomposition enumeration on the existing counter plus an incremental rank over the prime
      field, under experiments/EXP-ICEX-87fbf7/driver/. NO Groebner basis is built and NO solver is
      invoked. A second, independently implemented arithmetic path recomputes every rank so that a
      modular or implementation accident cannot masquerade as a rank result. Recorded through
      harness/runner.py.
    parameters: >-
      THE INSTANCE SET IS FIXED IN STAGE 0 AND EVERY ARM - INCLUDING THE CURVE-FREE GENERATOR - IS
      MEASURED ON THE SAME RUNGS WITH THE SAME BASE-SIZE RULE, THE SAME TARGET COUNT AND THE SAME
      INFINITY BUDGET. Four rungs spanning at least a factor of sixty-four in group order; base size by
      the declared rule; arity three; four curves and four seeds per arm per rung. Per-rung resolution
      computed in Stage 0 from the base size. THE MACHINE IS NAMED and appears on every cost row;
      timings are for budget accounting only and no conclusion rests on them.
  controls:
    - >-
      CURVE-FREE ROW GENERATOR, MANDATORY AND BLOCKING (standing scope constraint from the
      pfdr-battery lane): rows of the same shape - nonnegative integer exponent vectors of the same
      bounded weight with the same fixed row sum, plus one extra column, emitted in blocks of the same
      size to reproduce the shared right-hand-side structure - generated with no curve, no group law
      and no decomposition. FORCED: kappa within the per-rung resolution of the matched random base. If
      it agrees, the baseline is a fact about the ROW MODEL and every statement about it must say so.
    - >-
      MATCHED RANDOM BASE, blocking, at identical negation-collapsed effective size, drawn in the same
      invocation at every rung. Every kappa is reported as a DIFFERENCE against it, never in isolation.
    - >-
      DUPLICATED-COLUMN POSITIVE CONTROL, BLOCKING: a base with two elements sharing an x-coordinate,
      for which kappa MUST be infinite. An instrument that cannot detect a rank deficiency it was
      handed cannot report an absence of one.
    - >-
      ROW-PERMUTATION RECOMPUTATION on the identical row multiset, paired per cell at no extra
      harvesting cost, separating a property of the base from a property of the harvest order. Its
      failure for the random arm VOIDS the comparison rather than merely qualifying it.
    - >-
      SECOND INDEPENDENT ARITHMETIC PATH for every rank, so that an implementation or modular accident
      cannot masquerade as a rank result.
    - >-
      EFFECTIVE-SIZE ACCOUNTING per arm with the negation-collapse fraction reported, since a committed
      battery observed a real collapse in the wild and an unnoticed one would produce a spurious
      infinity attributed to geometry.
    - >-
      DISTINCT-DECOMPOSABLE-TARGET COUNT per arm as a reported covariate, so an elevated kappa can be
      attributed to shared right-hand-side columns rather than to geometry when that is what the data
      say.
    - >-
      SEED-VARIATION AUDIT: arms built on a harness path with no seed dependence have identically zero
      spread across seeds. Reporting a seed interval for them is PROHIBITED and their determinism is
      recorded instead.
  independent_variables:
    - panel arm - matched random, high-bit interval, small height, coset union, concentrated small multiples, low-collision near-ceiling, duplicated column, curve-free row generator
    - group-order rung, four values
    - curve index and seed index within an arm and rung
    - row order - declared harvest order versus uniform random permutation of the identical multiset
    - arithmetic path - primary versus independent second implementation
  metrics:
    primary:
      - >-
        rows_to_full_rank(arm, curve, seed, rung): the integer number of harvested rows appended before
        the coefficient matrix attains rank B+1, or the censoring flag if the infinity budget was
        exhausted. THE RAW INTEGER IS THE MEASUREMENT; kappa is derived from it.
      - >-
        kappa = rows_to_full_rank divided by (B+1), dimensionless. Reported PER CELL with its
        censoring flag, and summarised across curves and seeds by the MEDIAN with a bootstrap
        interval. The mean is not a legitimate summary when any cell is censored, and a censored cell
        may never be silently dropped from a mean.
      - >-
        excess = rows_to_full_rank minus (B+1), an integer. The FULL DISTRIBUTION of the excess across
        cells is archived, because the baseline heuristic is a statement about that distribution's
        tail and not about its centre.
      - >-
        the FULL RANK STAIRCASE - rank as a function of rows appended - archived per cell. This is what
        lets a later reader re-scope the infinity budget without a rerun, and it is required precisely
        because the budget converts a large finite kappa into an infinity.
      - >-
        kappa_random per rung with a bootstrap interval over curves and seeds, dimensionless.
      - >-
        kappa_difference(arm, rung) = kappa for the arm minus kappa_random at the same rung, with an
        interval, evaluated against the PER-RUNG resolution.
      - >-
        kappa_curve_free per rung with its interval, and its difference against kappa_random. THE
        METRIC THAT FIXES THE SCOPE of everything else in the run.
      - >-
        kappa_duplicated_column: FORCED INFINITE. A finite value voids the run.
      - >-
        growth_slope(arm) = slope of kappa_difference against the logarithm of the group order across
        the four rungs, with a Holm correction across the panel and an interval. The only route by
        which the channel could be exponent-relevant.
      - >-
        permutation_agreement(arm, rung) = kappa under the declared order minus kappa under a random
        permutation of the identical multiset, dimensionless, FORCED inside the per-rung threshold for
        the random arm.
    secondary:
      - >-
        distinct decomposable targets contributing rows, per arm per rung, an integer count.
      - >-
        rows harvested per distinct target - the concentration covariate - reported as a distribution
        and not as a mean, since a concentrated geometry's whole point is a heavy right tail here.
      - >-
        effective size and negation-collapse fraction per arm.
      - >-
        rank agreement between the two arithmetic paths, per cell, as an exact match flag.
      - >-
        the per-rung quantisation resolution of kappa, computed in Stage 0 and reported beside every
        threshold.
      - >-
        the seed-variation audit outcome per arm, including which arms are deterministic by
        construction.
      - >-
        peak resident set and wall-clock seconds per rung on the named machine, for budget accounting.
      - >-
        the Stage 0 record: unknown set, harvest order, infinity budget, panel verification against the
        committed source, and the re-read values from the committed finding and battery artifact.
  heuristic_under_test: HEUR-RNK-1
  preregistered_prediction:
    quantity: >-
      kappa_random per rung; kappa_curve_free per rung; kappa_difference for every panel arm;
      kappa for the duplicated-column control; growth_slope per arm; and permutation_agreement.
    formula: >-
      kappa is at least 1 for every base by counting alone, with no assumption - that half is a
      derivation and not a prediction. kappa_random is at most the declared threshold above 1 at every
      rung and decreasing in the group order, since the failure probability of a few extra rows to span
      falls with the field size. kappa_curve_free equals kappa_random within the per-rung resolution.
      kappa_difference is no lower than the negative resolution for every arm - no rank advantage is
      available, because the ceiling is kappa_random itself. kappa for the duplicated-column control is
      infinite by construction, since two identical columns cap the rank at B. growth_slope has an
      interval containing zero for every arm, since kappa is a ratio to B+1. permutation_agreement is
      inside the per-rung threshold for the random arm.
      THE NUMERIC THRESHOLDS AND THE PER-RUNG RESOLUTIONS ARE COMPUTED AND HASHED IN STAGE 0 from the
      frozen base-size rule. None is transcribed here from any prior measurement.
    source: >-
      The definition of kappa, the four directional claims, the seven controls and the growth arm are
      taken from IDEA-20260830-f89eaf, read in full by TASK-20260904-8f2f95 on 2026-09-04. The
      coverage and concentration values that motivate the panel come from a committed finding and a
      committed battery artifact this session did NOT open; Stage 0 re-reads both and the run compares
      against what they actually say. The random-matrix rank statement behind the baseline is RECALLED
      ONLY and supports nothing; it is the reason the curve-free generator is an arm rather than an
      appeal. Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      Four rungs are chosen so that exact decomposition enumeration with known logarithms remains
      feasible, which is what makes relation collection a counting operation rather than a solver
      output and therefore makes kappa a clean measurement. THE TESTED SCALE IS THE CLAIMED SCALE. A
      growth slope over four rungs is a TREND WITH A WIDE INTERVAL, not an asymptotic rate, and the
      contract requires it to be reported as such.
    correspondence: null
  tail_checks:
    - >-
      Report the maximum excess observed across all draws against the predicted tail, not only the
      median: the baseline heuristic is a tail statement.
    - >-
      Report every cell that failed to reach full rank within the infinity budget INDIVIDUALLY, with
      its staircase, rather than averaging it away or dropping it.
    - >-
      Report the single largest paired permutation difference across the battery with its cell.
    - >-
      Report the rows-per-target distribution's upper tail for the concentrated arm, since that heavy
      tail is the proposed mechanism for an elevated kappa.
    - >-
      Recompute every growth slope with each single rung removed, since four rungs mean one can carry
      the whole slope.
  replication:
    seeds:
      - 20260904
      - 20260905
      - 20260906
      - 20260907
    independent_instances: 4
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 4
    maximum_memory_gb: 8
    maximum_runs: 12
  stopping_rules:
    - >-
      HALT the whole run if the duplicated-column positive control returns a finite kappa. Nothing else
      in the run is readable.
    - >-
      HALT every cross-geometry comparison if the permutation recomputation disagrees beyond the
      per-rung threshold for the RANDOM arm.
    - >-
      Stop appending rows at the declared infinity budget and record the censoring flag with the full
      staircase; do not extend the budget for a particular arm after seeing its staircase.
    - >-
      Apply thresholds PER RUNG at the Stage 0 resolution. At the smallest rung kappa is quantised
      coarsely, and a global threshold below that resolution is not a decision rule.
    - >-
      Stop at the frozen panel and rung list. No arm and no rung is added after any kappa has been
      seen.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop and
      is never a negative result.
  invalidation_rules:
    - >-
      A timeout, crash or dependency failure makes the run failed_infrastructure and is NEVER negative
      mathematical evidence.
    - >-
      A run reporting kappa without its full rank staircase is invalid_measurement; the staircase is
      what makes the infinity budget re-scopable.
    - >-
      A run reporting a mean kappa across cells that includes a censored cell, or that silently drops
      one, is invalid_measurement.
    - >-
      A run reporting a seed interval for an arm whose construction has no seed dependence is
      invalid_measurement.
    - >-
      A run reporting kappa for any geometry without kappa_random at the same rung from the same
      invocation is invalid_measurement.
    - >-
      A run reporting kappa without the curve-free generator's kappa at the same rung is
      invalid_measurement.
    - >-
      A run whose two arithmetic paths disagree on any rank is invalid_measurement until the
      disagreement is localised to one named implementation.
    - >-
      A run whose unknown set, harvest order, panel, base-size rule or infinity budget differs from the
      frozen contract is a DIFFERENT experiment and needs a new contract.
  success_criterion: >-
    The run yields interpretable evidence when ALL of the following hold: (1) the duplicated-column
    control is infinite at every rung; (2) the permutation recomputation agrees within the per-rung
    threshold for the random arm; (3) the two arithmetic paths agree on every rank; (4) kappa_random is
    reported per rung with a bootstrap interval and the per-rung resolution beside it; (5) the
    curve-free generator's kappa is reported at every rung with its difference against kappa_random;
    (6) every geometry's kappa is reported as a difference against kappa_random with an interval and a
    censoring flag; (7) the full rank staircase is archived for every cell; (8) the growth slopes are
    reported with Holm correction and leave-one-rung-out ranges; (9) the distinct-target count and the
    rows-per-target distribution are reported per arm.
  falsification_criterion:
    - >-
      The duplicated-column control returns a finite kappa. The rank computation or the unknown-set
      definition is wrong; NOTHING in the run is readable.
    - >-
      The permutation recomputation disagrees for the random arm. kappa is an artefact of harvest order
      and no cross-geometry comparison stands.
    - >-
      kappa_random exceeds its declared threshold at any rung. The baseline heuristic is falsified, the
      one-sided rank bound elsewhere in the program is withdrawn, and the channel REOPENS.
    - >-
      Some geometry's kappa is below kappa_random by more than the per-rung resolution. A rank
      ADVANTAGE exists; the no-advantage claim is contradicted and the question gains a live channel.
    - >-
      Every geometry's kappa is indistinguishable from kappa_random at every rung. The pure-coverage
      explanation is supported and the rank channel closes with a measured band - the intended
      deliverable, reported as a bound at a stated resolution and not as an absence.
    - >-
      A concentrated geometry's kappa is materially above kappa_random. The compounding explanation is
      supported; the scoped kill strengthens and base selection gains a disqualifying criterion.
    - >-
      A growth-slope interval excludes zero. The channel depends on the group order, which is the only
      route to exponent relevance, and it becomes the headline.
    - >-
      The curve-free generator's kappa differs from kappa_random beyond the resolution. The baseline is
      not a row-model fact; the difference between the two arms becomes the object worth explaining and
      the scope statement changes.
  required_artifacts:
    - manifest.yaml with exact command, commit sha, dirty-tree state, resolved inference block, environment and the NAMED machine
    - the Stage 0 frozen definitions - unknown set, harvest order, infinity budget, panel, base-size rule, per-rung resolutions - with their hash
    - the panel verification against the committed source, including which arms are deterministic by construction
    - raw-result.json with rows_to_full_rank and the censoring flag for every cell
    - the FULL rank staircase per cell, as raw rank-versus-rows arrays
    - kappa per arm, curve, seed and rung, with kappa_random and its bootstrap interval per rung
    - the curve-free generator's parameters, kappa and staircase at every rung
    - the duplicated-column control's result at every rung
    - the paired permutation recomputation for every cell, and the largest paired difference with its cell
    - the second arithmetic path's rank for every cell and the agreement flags
    - distinct decomposable targets and the rows-per-target distribution per arm per rung
    - effective size and negation-collapse fraction per arm
    - growth slopes with Holm correction and leave-one-rung-out ranges
    - peak resident set and wall-clock seconds per rung on the named machine
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not confer approval. status is draft, frozen is false,
      execution_authorized is false, approved_by is null.
    - >-
      Approval must confirm the infinity budget. It converts a large finite kappa into an infinity and
      thereby overstates the difference between a geometry needing slightly more than the budget and
      one needing slightly less; the full staircase is archived precisely so this choice is re-scopable,
      and approval should say so explicitly.
    - >-
      Approval must confirm the per-rung resolution thresholds. At the smallest rung kappa is quantised
      coarsely and a global threshold would be below the resolution, which would make a null at that
      rung meaningless.
    - >-
      Approval should confirm the curve-free generator's matching rule - row shape, weight bound, row
      sum, block size and block count. That arm fixes the scope of every statement in the run, and a
      matching rule chosen after seeing the curve arms would destroy its value.
  derivation_provenance:
    tool: coordinator-authored contract under TASK-20260904-8f2f95
    source_record: IDEA-20260830-f89eaf
    authored_at: '2026-09-04'
    note: >-
      The definition of kappa, the panel, the seven controls, the growth arm, the covariates and the
      falsification conditions are taken from the parent proposal and restated as measured quantities
      with units and per-rung decision rules. Added by this contract: the CURVE-FREE row generator
      required by the standing scope constraint, the requirement that the raw integer row count and the
      full excess distribution be archived rather than only the ratio, the prohibition on a mean that
      includes or silently drops a censored cell, and the per-rung application of every threshold at
      the Stage 0 quantisation resolution. No numeric threshold is transcribed here; all are derived in
      Stage 0.
  derivation_gaps:
    - >-
      The random-matrix rank statement behind the baseline is recalled, not read, and is not directly
      applicable: the rows lie in an affine hyperplane and rows from the same target share a column.
      The curve-free generator is the arm that substitutes for the missing theorem, and it measures
      rather than assumes.
    - >-
      The infinity budget is a convention. A geometry needing slightly more than the budget is recorded
      as infinite and as qualitatively different from one needing slightly less, which it is not. The
      staircase is published in full so this is repairable without a rerun.
    - >-
      Rows harvested from the same target share their last column, so a concentrated geometry's rows are
      correlated for reasons about CONCENTRATION rather than about geometry. The distinct-target
      covariate exists to separate these and must be reported with every elevated kappa.
    - >-
      kappa charges nothing for finding the decomposable targets. It is therefore not a cost and must
      never be netted against coverage; the honest quantity is the product, and this contract reports
      the two side by side rather than combining them.
    - >-
      At the smallest rung kappa is quantised coarsely, so the resolution there may exceed the effect
      the design is looking for. That rung's null is a bound at its own resolution and is reported as
      one.
