    - SRC-ICPERF-TRIMOSKA-WDSAT-2024 committed
    - A snapshot of this contract at its approved version before execution

  review_required: true
  review_note: >-
    Claim-relevant producer: it reports a fitted asymptotic exponent. An
    independent validator round plus a red-team pass on the fitting
    methodology and on the T_rel bookkeeping is owed before any evidence
    record is composed. No reviewer identifiers were allocated to this lane,
    so the review plan is not written here; writing it is a precondition of
    the round, not of the design.

  interpretation_limits:
    - >-
      Scoped to WDSat on S_4 Weil-descent instances over V = {deg x < l} at
      l <= 8, m - 1 = 3, on one Koblitz curve and one host. Nothing about
      Groebner engines, nothing about l >= 9, nothing about m != 3.
    - >-
      THE RHO COLUMN HERE IS DERIVED, NOT MEASURED, and is labelled as such on
      every row. It may not enter the boundary table as a measured cell. The
      measured rho column is ranked item (5) of GOAL-ICPERF-e6b6a4's
      next_action.
    - >-
      No wall-clock number enters any fit or any ratio. t_conf is reported for
      translation only and is flagged wherever loadavg exceeded 2.
    - >-
      A C-NULL pass licenses no attribution to structure. See the control's
      own scope bar and EV-ICPERF-390707 proves_too_much object 2.
    - >-
      Fitted exponents over three to five toy cells are measurements with
      standard errors, not asymptotic results. H-ICPERF-81de5c may reach
      `analyzed` on this contract and no further.
    - >-
      Reported literature timings are reproduced nowhere and enter no ratio;
      the Yokoyama et al. and Galbraith-Gebregiyorgis statements cited by
      H-ICPERF-81de5c are context, not comparators.
