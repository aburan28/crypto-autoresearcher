    - any seed derivation other than unsigned big-endian first eight bytes of SHA-256 over exact UTF-8 label
    - any D2/D5 draw shape, dtype, generator, bit generator, call count, or traversal order change
    - any D6 index draw shape, dtype, endpoint, pool order, generator continuity, or traversal order change
    - native-endian hashing without explicit little-endian normalization
    - any fixture raw-buffer or canonical-output hash mismatch
    - retaining part of a zero-scale D6 trial or substituting NaN, zero, or a sentinel statistic
    - including invalid D6 trials in any denominator, quantile, power, or detection-floor output
    - continuing past 100000 D6 attempts or treating the cap as E3, F4, or mathematical evidence
