  sole_blocker_repaired:
    id: O-INSTR-V5-1
    prior_problem: >-
      Production D2 and D6 PURPOSE tokens, D6 index-buffer construction,
      zero-scale handling, and a seeded D6 fixture admitted different mandatory
      reports from otherwise conforming implementations.
    disposition: repaired_by_exact_random_domain_and_fixture_contract_below
    repair_scope_only: true

  exact_random_domain_contract:
    implementation:
      package: numpy
      version: 2.4.0
      generator_constructor: numpy.random.Generator
      bit_generator_constructor: numpy.random.PCG64DXSM
      platform_byte_order_recorded: mandatory
      buffers_normalized_before_hashing: explicit_little_endian
    purpose_tokens_and_roots:
      d2_tail_expectation: 10577
      d5_loo_null: 3972
      d6_matched_symmetric_bootstrap: 115813
    allowed_purpose_tokens:
      - d2_tail_expectation
      - d5_loo_null
      - d6_matched_symmetric_bootstrap
    allowed_family_tokens: [p4001, p6007]
    aliases_case_or_whitespace_variants: prohibited
    old_v5_loo_null_token: prohibited
    seed_label:
      exact_grammar: 'EXP-INSTR-36c8cf|v6|purpose=<PURPOSE>|root=<ROOT>|n=<N>|family=<FAMILY>'
      encoding: UTF-8
      trailing_line_feed: prohibited
      PURPOSE: exact_allowed_token
      ROOT: canonical_base_10_unsigned_integer_no_leading_zero
      N: canonical_base_10_positive_integer_no_leading_zero
      FAMILY: exact_allowed_token
      label_sha256: SHA256_of_exact_UTF8_bytes
      derived_seed: unsigned_big_endian_integer_from_first_8_digest_bytes
      generator_reinitialized_for_each_purpose_family_and_rung: true
    common_recorded_fields:
      - exact_seed_label
      - label_sha256
      - derived_unsigned_64_bit_seed
      - purpose
      - root
      - n
      - family
      - NumPy_version
      - platform_byte_order
      - normalized_raw_buffer_sha256
      - canonical_output_object_sha256

    D2:
      purpose: d2_tail_expectation
      production_trials: 20000
      draw_call: 'Generator(PCG64DXSM(seed)).standard_normal((20000, n), dtype=numpy.float64)'
      array_shape: [20000, n]
      consumption_order: C_row_major_trial_then_observation
      raw_hash_buffer: explicit_little_endian_binary64_C_order_bytes
      statistic: v5_D2_per_trial_self_normalized_strict_lower_and_upper_counts
      aggregation: trial_order_then_lower_upper_then_frozen_rows
      nominal_n_times_13_over_260_remains_rejected_as_expectation: true
    D5:
      purpose: d5_loo_null
      production_trials: 20000
      draw_call: 'Generator(PCG64DXSM(seed)).standard_normal((20000, n), dtype=numpy.float64)'
      array_shape: [20000, n]
      consumption_order: C_row_major_trial_then_observation
      raw_hash_buffer: explicit_little_endian_binary64_C_order_bytes
      statistic: v5_D4_absolute_LOO_score_after_identical_selection
      quantiles: v5_nearest_rank_no_interpolation
    D6:
      purpose: d6_matched_symmetric_bootstrap
      production_valid_trials: 5000
      initial_draw_call: 'Generator(PCG64DXSM(seed)).integers(0, 2*n, size=(5000, n), dtype=numpy.uint64, endpoint=False)'
      initial_array_shape: [5000, n]
      consumption_order: C_row_major_trial_then_index
      raw_hash_buffer: explicit_little_endian_unsigned_64_C_order_bytes
      pool_order:
        - positive_centered_whole_13_vectors_in_ascending_frozen_seed_order
        - elementwise_negative_vectors_in_the_same_seed_order
      index_semantics: zero_based_index_into_the_exact_2n_pool
      per_trial_statistic: arithmetic_mean_of_13_bias_corrected_Fisher_G1_values
      binary64_evaluation_order:
        column_iteration: frozen_density_row_order_zero_through_12
        vectorization_across_columns: prohibited
        column_mean: numpy.mean(one_dimensional_column, dtype=numpy.float64)
        centered_values: numpy.subtract(column, column_mean, dtype=numpy.float64)
        m2: numpy.mean(numpy.multiply(centered_values, centered_values), dtype=numpy.float64)
        m3: >-
          numpy.mean(numpy.multiply(numpy.multiply(centered_values,
          centered_values), centered_values), dtype=numpy.float64)
        denominator: m2 ** numpy.float64(1.5)
        correction_factor: math.sqrt(n * (n - 1)) / (n - 2)
        column_G1: correction_factor * (m3 / denominator)
        aggregate: >-
          numpy.mean(binary64_array_of_13_column_G1_values_in_frozen_order,
          dtype=numpy.float64)
        observed_and_bootstrap_use_identical_order: true
      null_quantiles: nearest_rank_p05_p50_p95_no_interpolation
      detection_floor: p95_minus_p05_additive_aggregate_G1_shift_only
      zero_scale:
        predicate: any_one_of_13_resampled_columns_has_central_moment_m2_bits_0x0000000000000000
        trial_outcome: invalid_for_d6_zero_scale
        retained_columns: none
        included_in_quantiles_or_power_denominator: false
        invalid_count_reported: true
        numeric_or_NaN_substitution: prohibited
        replacement_draw_call: 'same_uninterrupted_Generator.integers(0, 2*n, size=(1, n), dtype=numpy.uint64, endpoint=False)'
        replacement_order: invalid_trial_encounter_order
        loop: repeat_one_row_draw_until_exactly_5000_valid_trials
        raw_buffer_hash: concatenation_of_initial_and_replacement_u8_rows_in_draw_order
        total_attempt_hard_cap: 100000
        hard_cap_outcome: diagnostic_failed_infrastructure
        E3_or_state_machine_effect: none

  canonical_fixture_serialization:
