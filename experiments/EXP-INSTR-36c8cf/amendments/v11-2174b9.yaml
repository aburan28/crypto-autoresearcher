    and every previously passing static matrix unchanged.

  changes:
    - id: V11-EXACT-THREE-FILE-INFERENCE-PROJECTION
      scope: control_plane_only
      description: >-
        Exact-bind orchestration/model-policies.yaml, orchestration/providers.yaml,
        and orchestration/model-bindings.yaml before deriving an immutable local
        projection containing only canonical_policy, policy_table, and effort_order.
    - id: V11-FINGERPRINTED-NESTED-IMPORT-REWRITE
      scope: control_plane_only
      description: >-
        AST-rewrite exactly one ImportFrom node with frozen AST SHA-256
        91e2936dfa8e8e26e6be503ed56f7e6c459d54ce6a03163da728c13e7889009f
        into a local load_inference_config assignment. Refuse any count or
        fingerprint drift and recursively require zero Import or ImportFrom
        nodes in the compiled projection.
    - id: V11-COLLECTOR-CAPTURED-PUBLIC-CONTROLS
      scope: control_plane_only
      description: >-
        Immediately after DiagnosticCollector construction, normalize strategies
        to exact supported strings and fault_fixture to None or exact validated
        FaultFixture. Malformed strategies map to ECOMP_LATEST_ONLY; malformed
        fixtures map to TYPE_COERCION; independent work continues; exactly one
        compiled-order final adjudication returns the complete deduplicated list.
    - id: V11-V10-PAYLOAD-AND-MATRIX-PRESERVATION
      scope: deterministic_static_verification
      description: >-
        Copy the exact v10 source payload as data, retain all inherited matrices,
        and preserve 1,363 source fields and 1,363 origin rows under their frozen
        canonical subdigests. No scientific or source field is changed.

