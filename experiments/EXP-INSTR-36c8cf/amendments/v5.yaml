    canonical_scalar_sha256: d8195c833ba3663d457ccc1589b71f9db3647a9aaddc32a8854887f1ba95c8fe
    verbatim_text: |-
      SAMPLER CONTROL, VERSION 2. THIS SUPERSEDES THE WORDING "targets_B (harness/exp_icinv_fullgroup.py), NEVER targets_uniform" WHEREVER IT APPEARS IN A GOAL-ENDO-001 DISPATCH ENVELOPE, HANDOFF OR TASK CARD FROM THIS DECISION ONWARD. IT EDITS NO COMMITTED RECORD: DEC-20260810-a4bec4 and every handoff already committed stand exactly as written, and this restatement supersedes them by reference in the way every correction in this campaign does. It must be transcribed VERBATIM into every future dispatch envelope in this campaign that draws a target.
      (a) EVERY NEW MEASUREMENT ARM USES exp_icinv_fullgroup.targets_B. targets_uniform is PROHIBITED for any new measurement arm, at any density row, in any contract of this campaign.
      (b) EXACTLY ONE EXCEPTION, AND IT IS NOT A LICENCE. A RE-MEASUREMENT OF A NAMED HISTORICAL REFERENCE RUN, at that run's own frozen parameters, for the sole purpose of characterising that run's own sampling variability or checking reproduction of it, USES THE REFERENCE RUN'S OWN SAMPLER, identified at run time from that run's own record and never assumed. Substituting a different sampler makes the object a different estimand and makes the reproduction check vacuous.
      (c) ANYTHING MEASURED UNDER (b) IS AN ADMISSIBILITY QUANTITY ONLY. It may not support any within-class, between-class, over-dispersion, curve-side or ECDLP claim in either direction, and it inherits the H-ICINV-6c7920 dispute wholesale: if that hypothesis is later supported, every quantity measured under (b) is an artifact of the sampler and any gate built on it certifies reproduction of a historical artifact and nothing more.
      (d) THE r-STRATIFICATION HALF OF THE CONTROL IS UNCONDITIONAL. Every measurement is stratified on r = #{x in F_p : x^3 + a x + b = 0} and the strata are reported wherever a target is drawn, under (a) and (b) alike. That reporting gates nothing.
      (e) AN EXECUTOR THAT FINDS AN ENVELOPE AND A FROZEN CONTRACT IN CONFLICT DECLARES THE CONFLICT BEFORE ANY MEASUREMENT, FOLLOWS THE FROZEN CONTRACT, ADDS NO UNDECLARED ARM, AND LEAVES THE ADJUDICATION TO THE COORDINATOR. That is what RUN-INSTR-36c8cf-phaseA-v2-57ca9a did and it is correct.
    execution_scope:
      new_SR3_measurement_arms: exp_icinv_fullgroup.targets_B
      future_Phase_B_or_JINV_measurement_arms: exp_icinv_fullgroup.targets_B
      sole_exception: named_historical_reference_remeasurement_at_its_own_frozen_parameters
      exception_sampler_source: historical_run_record_discovered_at_runtime
      exception_claim_scope: admissibility_only_with_H_ICINV_6c7920_dispute_inherited
      r_stratification: unconditional_and_non_gating
