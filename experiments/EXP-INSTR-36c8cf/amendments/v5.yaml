protocol_amendment:
  experiment_id: EXP-INSTR-36c8cf
  amendment_ordinal: 5
  version_from: 4
  version_to: 5
  filed_at: '2026-08-12'
  filed_by: coordinator
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-d7e255
  status: review_required
  approved_by: null
  approved_at: null
  recorded_by_decision: null
  claim_tier: toy
  applies_to: future_runs_only
  experiment_runs_authorized: 0
  supersedes_for_future_execution:
    - experiments/EXP-INSTR-36c8cf/amendments/v4.yaml

  purpose: >-
    Repair exactly the three protocol-integrity blockers found by the fresh
    independent review of amendment v4: make every retained diagnostic
    deterministic and fixture-bound, carry the campaign's five standing
    sampler controls into the executable contract with an exact digest, and
    explicitly remove the terminal parent's automatic T6/HEUR-INSTR-4
    inference. The reviewed v4 terminal-only 768-to-1536 E3 state machine is
    preserved. This proposal runs no experiment and has no scientific,
    execution, evidence, or research-status authority until its exact snapshot
    receives an independent PASS and a successor Coordinator decision.

  effective_contract_definition:
    base:
      specification: experiments/EXP-INSTR-36c8cf/specification.yaml
      approved_amendment: experiments/EXP-INSTR-36c8cf/amendments/v1.yaml
      reconciled_terminal_contract: experiments/EXP-INSTR-36c8cf/amendments/v4.yaml
    repair: experiments/EXP-INSTR-36c8cf/amendments/v5.yaml
    executable_interpretation: >-
      If this exact v5 snapshot is later approved, the future contract is the
      specification as amended by v1, the terminal-only state machine and
      unchanged fields restated by v4, and the deterministic replacements in
      v5. V4 remains an immutable, unapproved reviewed proposal and supplies no
      authority by itself. Whenever v5 conflicts with a diagnostic or
      interpretation clause in any v2/v3/v4 lineage, v5 governs future
      execution. No malformed or superseded parent text is parsed at run time.

