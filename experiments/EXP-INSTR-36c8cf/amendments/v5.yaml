      prior_finding: RT-INSTR-V4-05
      disposition: repaired_by_diagnostic_contract_and_conformance_fixture_below
      selected_tail_expectation: per_trial_self_normalized_gaussian_expectation
      rejected_as_expectation: n_times_13_over_260
      retained_for_audit_only: nominal_n_times_13_over_260_reference
      branching_authority: none
    standing_sampler_control:
      prior_finding: RT-INSTR-V4-06
      disposition: repaired_by_exact_source_binding_verbatim_text_and_handoff_digest_gate_below
      sampler_changed: false
    terminal_inference:
      prior_finding: RT-INSTR-V4-08
      disposition: automatic_T6_HEUR_INSTR_4_inference_superseded
      terminal_F4_effect: protocol_outcome_reserved_for_later_independent_review
      automatic_scientific_effect: none
    runtime_z_clarity:
      prior_finding: RT-INSTR-V4-07
      disposition: exact_rational_probability_is_the_only_source_of_truth

  frozen_terminal_contract:
    seed_ladder:
      rungs:
        - {rung: 1, total_seeds: 12, source: version_2_unchanged}
        - {rung: 2, total_seeds: 24, added_seed_range: [20260821, 20260832]}
        - {rung: 3, total_seeds: 48, added_seed_range: [20260833, 20260856]}
        - {rung: 4, total_seeds: 96, added_seed_range: [20260857, 20260904]}
        - {rung: 5, total_seeds: 192, added_seed_range: [20260905, 20261000]}
        - {rung: 6, total_seeds: 384, added_seed_range: [20261001, 20261192]}
        - {rung: 7, total_seeds: 768, added_seed_range: [20261193, 20261576]}
        - {rung: 8, total_seeds: 1536, added_seed_range: [20261577, 20262344]}
      nesting: cumulative_prefix
      extension_beyond_rung_8: prohibited
    families:
      execution_order: [p4001, p6007]
      rows_per_family: 13
      pooling_across_primes: prohibited
      p6007_reachable_only_after_p4001_terminal_pass: true
    estimator:
      per_seed_input: finite_binary64_variance_ratio
      mean: arithmetic_mean
      sample_standard_deviation:
        denominator: n_minus_1
        ddof: 1
      z:
        definition: inverse_standard_normal_cdf
        probability_numerator: 519
        probability_denominator: 520
        evaluation_time: runtime
        controlling_expression: Phi_inverse(519/520)
        decimal_input_or_transcription: prohibited
        derived_decimal_output_allowed: true
      interval: sample_mean_plus_or_minus_z_times_sample_standard_deviation
      half_width: z_times_sample_standard_deviation
    acceptance_rule:
      threshold: 0.05
      statistic: absolute_half_width_change_divided_by_previous_half_width
      rows_required: all_13_density_rows
      evaluation_count_per_family: 1
      evaluation_transition: 768_to_1536
      accepted_interval: unconditional_rung_8_interval_only
      comparison: less_than_or_equal
      early_acceptance: prohibited
      first_crossing: prohibited
      no_widening: true
      estimator_change: prohibited
      coverage_change: prohibited
      row_dropping: prohibited
    family_state_machine:
      - state: preflight
        on_source_contract_or_digest_mismatch: invalid_no_measurement
        on_host_load_above_limit: defer_without_run_id_or_artifacts
        on_budget_unavailable: failed_infrastructure_no_result
        on_pass: p4001_full_ladder
      - state: p4001_full_ladder
        action: measure_and_report_rungs_1_through_8
        diagnostic_transition_authority: none
        on_premise_failure: invalid_no_acceptance
        on_budget_stop: failed_infrastructure_no_acceptance
        on_complete: p4001_terminal_E3
      - state: p4001_terminal_E3
        evaluation: exactly_once_at_768_to_1536
        on_fail: terminal_F4_stop_no_p6007_no_gate
        on_pass: p6007_full_ladder
      - state: p6007_full_ladder
        action: measure_and_report_rungs_1_through_8_independently
        diagnostic_transition_authority: none
        on_premise_failure: invalid_no_acceptance
        on_budget_stop: failed_infrastructure_no_acceptance
        on_complete: p6007_terminal_E3
      - state: p6007_terminal_E3
        evaluation: exactly_once_at_768_to_1536
        on_fail: terminal_F4_no_joint_gate
        on_pass: separate_family_intervals_available_for_later_controls
    coverage:
      per_row_central_coverage: 259/260
      interval_endpoint_probabilities: [1/520, 519/520]
      downstream_single_family_realised_target: 0.048862
      two_family_joint_error_not_corrected: 0.095336
      joint_family_claim_without_new_amendment: prohibited
    cost_and_resource_contract:
      per_run_wall_clock_seconds: 14400
      total_cpu_hours: 24
      maximum_memory_gb: 8
      maximum_runs: 20
      start_load_limit:
        one_minute_load_max: 28
        reference_cores: 14
        exceeded_disposition: defer_without_run_id_or_artifacts
      rung_4_guard:
        predicted_fraction_of_wall_budget_max: 0.60
        exceeded_disposition: retained_partial_artifacts_and_failed_infrastructure
        scientific_effect: none

  deterministic_diagnostic_contract:
    authority: >-
      Every diagnostic below is emitted unconditionally for every reached rung
      and gates nothing. No diagnostic can accept, reject, stop, select a rung,
      widen an interval, change coverage or estimator, alter E3, promote
      evidence, or move any status. A diagnostic concern is a later independent
      review finding and possible future amendment only.
    common_representation:
      row_order: ascending_factor_base_size_as_frozen_by_amendment_v1
      seed_order: ascending_numeric_frozen_seed
      matrix_shape: n_seed_rows_by_13_density_columns
      numeric_domain: finite_IEEE_754_binary64
      nan_or_infinity: invalid
      derived_exact_float_encoding: lowercase_C99_hexadecimal_binary64_string
      integer_encoding: base_10_integer
      rational_encoding: reduced_numerator_slash_denominator_string
      canonical_mapping_order: lexicographic_UTF_8_key_order
      canonical_sequence_order: declared_order_never_resorted_except_where_explicit
      missing_value_mapping:
        status: not_applicable
        value: null
        reason: no_predecessor
      missing_value_substitutes_prohibited: [zero, empty_sequence, NaN, omitted_field, sentinel_string]
    sample_moments:
      definitions:
        m_k: '(1/n) * sum_i((x_i - mean)^k)'
        sample_skewness_G1: '(sqrt(n*(n-1))/(n-2)) * (m3/(m2^(3/2)))'
        sample_excess_kurtosis_G2: '((n-1)/((n-2)*(n-3))) * ((n+1)*(m4/(m2*m2)-3)+6)'
      minimum_n_for_G1: 3
      minimum_n_for_G2: 4
      zero_m2_status: not_resolvable_zero_scale
      coefficient_of_variation: sample_standard_deviation_divided_by_absolute_sample_mean
      zero_mean_status: not_resolvable_zero_denominator
      generative_skew_reference: two_times_coefficient_of_variation
    D1_half_width_change:
      previous_half_width: z_times_previous_sample_standard_deviation
      current_half_width: z_times_current_sample_standard_deviation
      relative_change: absolute_current_minus_previous_divided_by_previous
      model_noise_scale: one_divided_by_two_times_square_root_of_previous_n
      ratio: relative_change_divided_by_model_noise_scale
      zero_previous_half_width_status: not_resolvable_zero_denominator
      rung_1_fields:
        relative_change: {status: not_applicable, value: null, reason: no_predecessor}
        model_noise_scale: {status: not_applicable, value: null, reason: no_predecessor}
        ratio: {status: not_applicable, value: null, reason: no_predecessor}
    D2_split_tail:
      fitted_lower_endpoint: sample_mean_minus_z_times_sample_standard_deviation
      fitted_upper_endpoint: sample_mean_plus_z_times_sample_standard_deviation
      lower_observed_count: count_of_x_strictly_less_than_fitted_lower_endpoint
      upper_observed_count: count_of_x_strictly_greater_than_fitted_upper_endpoint
      equality_to_endpoint: not_an_exceedance
      family_observed_count: sum_in_frozen_row_order
      selected_expectation:
        name: per_trial_self_normalized_gaussian_expectation
        distribution: iid_standard_normal
        trials: 20000
        per_trial: >-
          Draw n values, fit that trial's own arithmetic mean and ddof-1 sample
          standard deviation, form that trial's own mean plus or minus the
          runtime Phi_inverse(519/520) times its sample standard deviation, and
          count strict lower and upper exceedances among those same n values.
        outputs:
          - arithmetic_mean_lower_count_per_row
          - arithmetic_mean_upper_count_per_row
          - arithmetic_mean_total_count_per_row
          - thirteen_times_each_per_row_expectation_as_family_reference
        aggregation_order: trials_then_lower_upper_then_frozen_rows
      rejected_nominal_reference:
        expression: n_times_13_divided_by_260
        meaning: nominal_family_total_if_interval_endpoints_were_known_constants
        required_output_name: nominal_known_endpoint_family_reference_rejected_as_expectation
        may_be_labelled_expected_count: false
        reason: fitted_endpoints_are_estimated_from_the_same_points
      branching_authority: none
    D3_finite_n_disclosure:
      c4_sample_sd_bias_factor:
        formula: 'sqrt(2/(n-1)) * Gamma(n/2) / Gamma((n-1)/2)'
        applied_to_estimator: false
      prediction_factor:
        formula: Student_t_inverse_cdf_df_n_minus_1_at_519_over_520_times_sqrt_1_plus_1_over_n
        report_ratio_to_runtime_z: true
        applied_to_estimator: false
    D4_leave_one_out:
      selection_base: maximum_absolute_deviation_from_full_sample_arithmetic_mean
      tie_break:
        first: smallest_numeric_seed
        second: earliest_position_in_frozen_seed_order
      excluded_point: selected_point_only
      loo_mean: arithmetic_mean_of_remaining_n_minus_1_values
      loo_sample_standard_deviation: ddof_1_over_remaining_n_minus_1_values
      signed_score: selected_value_minus_loo_mean_divided_by_loo_sample_standard_deviation
      absolute_score: absolute_value_of_signed_score
      in_sample_signed_score: selected_value_minus_full_mean_divided_by_full_ddof_1_sample_standard_deviation
      in_sample_absolute_score: absolute_value_of_in_sample_signed_score
      selected_side_from_signed_score:
        negative_signed_score: lower
        positive_signed_score: upper
        zero_signed_score: unreachable_selection_is_maximum_absolute_deviation
        allowed_labels: [lower, upper]
      reported_fields:
        - selected_seed
        - selected_position_zero_based
        - selected_side_from_signed_score
        - full_mean
        - full_sample_standard_deviation
        - loo_mean
        - loo_sample_standard_deviation
        - signed_score
        - absolute_score
        - in_sample_signed_score
        - in_sample_absolute_score
      zero_loo_scale_status: not_resolvable_zero_scale
      branching_authority: none
    D5_fresh_null:
      calibrated_statistic: D4_absolute_leave_one_out_score_after_identical_selection
      distribution: iid_standard_normal
      trials: 20000
      trial_order: row_major_trial_then_observation
      selection_and_ties: identical_to_D4_with_zero_based_observation_index_as_seed
      outputs: [nearest_rank_median, nearest_rank_p90, nearest_rank_p99, maximum]
      quantile_rule:
        sorted_ascending: true
        one_based_rank: ceiling_of_q_times_trial_count
        zero_based_index: ceiling_of_q_times_trial_count_minus_1
        interpolation: none
      zero_scale_trial: invalid_diagnostic_implementation
      reuse_of_one_rung_calibration_at_another_rung: prohibited
      branching_authority: none
    D6_correlation_aware_aggregate:
      observed_statistic: arithmetic_mean_of_13_per_row_G1_values
      null_name: matched_symmetric_whole_seed_vector_bootstrap
      construction: >-
        At the reached rung, subtract each column's sample mean from every
        whole 13-vector. Form a pool of the n centred vectors followed in the
        same seed order by their n elementwise negatives. For each bootstrap
        trial draw n pool indices with replacement, keeping each drawn
        13-vector intact, compute G1 separately in frozen row order, then take
        their arithmetic mean. This preserves cross-row coupling and makes the
        finite pool exactly symmetric without pooling density rows.
      trials: 5000
      pool_index_sampler:
        api: numpy_Generator_integers
        call: 'Generator.integers(low=0, high=2*n, size=n, dtype=uint64, endpoint=False)'
        bounds: low_inclusive_high_exclusive
        replacement: true
        one_call_per_trial: true
        trial_order: trials_in_ascending_index_then_the_n_indices_of_that_trial_in_order
        choice_or_any_other_api: prohibited
      critical_value:
        side: upper_one_sided
        alpha: 0.05
        statistic: nearest_rank_p95_of_null_aggregate
      detection_floor:
        name: additive_aggregate_statistic_shift_for_95_percent_power
        formula: null_p95_minus_null_p05
        quantiles: nearest_rank
        scope: additive_shift_of_the_aggregate_G1_statistic_only
        raw_distribution_or_per_row_skew_power_claim: prohibited
      outputs:
        - observed_13_row_mean_G1
        - matched_symmetric_null_p05
        - matched_symmetric_null_p50
        - matched_symmetric_null_p95
        - additive_aggregate_statistic_shift_for_95_percent_power
      historical_unqualified_detection_floor_label: superseded_by_this_exact_definition
      branching_authority: none
    deterministic_randomness:
      implementation_reference: numpy_2.4.0
      bit_generator: PCG64DXSM
      normal_sampler: standard_normal_binary64
      root_seeds:
        D2_tail_expectation: 10577
        D5_fresh_null: 3972
        D6_correlation_aware_aggregate: 115813
      derived_seed_label: EXP-INSTR-36c8cf|v5|PURPOSE|root=ROOT|n=N
      purpose_tokens:
        D2_tail_expectation: tail_expectation
        D5_fresh_null: loo_null
        D6_correlation_aware_aggregate: correlation_aware_aggregate
      seed_label_composition: >-
        PURPOSE is the purpose_tokens value for the diagnostic being seeded and
        ROOT is that diagnostic's root_seeds entry; no other token is
        admissible. The rung is carried by n=N. A measurement draw appends
        family_domain_suffix after |n=N; a conformance-fixture draw is
        family-independent and appends nothing, which is why the
        seeded_fresh_null label ends at |n=5.
      derivation: unsigned_big_endian_integer_from_first_8_bytes_of_SHA256_UTF8_label
      generator_reinitialized_per_purpose_family_and_rung: true
      family_domain_suffix: '|family=p4001_or_p6007'
      trial_draw_order: row_major_C_order
      record_required:
        - full_derived_seed_label
        - SHA256_of_seed_label
        - derived_unsigned_64_bit_seed
        - implementation_and_version
        - raw_binary64_draw_buffer_SHA256
      implementation_substitution: >-
        A substitute implementation is admissible only if it reproduces the
        exact fixture byte hashes and C99 hexadecimal outputs below. Otherwise
        the diagnostic implementation is invalid and no measurement starts.

