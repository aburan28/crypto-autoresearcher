  the_sampler_question_is_settled_elsewhere_and_is_recorded_here_for_the_executor: >-
    CONFLICT-1 IS ADJUDICATED BY DEC-20260810-5aeeaa AND NOT BY THIS FILE, AND THAT
    ADJUDICATION TAKES EFFECT ON THE COMMIT OF THAT DECISION REGARDLESS OF WHETHER
    THIS AMENDMENT IS EVER APPROVED. For this contract the operative consequence is:
    THE SR3 v3 CHARACTERISATION CONTINUES TO USE THE REFERENCE RUN'S OWN SAMPLER --
    exp_icinv.targets_uniform for EXP-ICINV-55c2d8 / RUN-ICINV-p4001-fixed --
    identified at run time from that run's own record and never assumed, because a
    reproduction control that substitutes a different sampler is not a reproduction.
    NOTHING MEASURED THROUGH targets_uniform MAY SUPPORT ANY WITHIN-CLASS OR
    CURVE-SIDE CLAIM IN EITHER DIRECTION; the characterised baseline inherits
    H-ICINV-6c7920's dispute wholesale; and every new measurement arm of this
    contract, in Phase B and everywhere else, uses targets_B. The r-stratification is
    unconditional and gates nothing. The five-clause restatement of the standing
    control is in DEC-20260810-5aeeaa.standing_control_restatement_v2 and must be
    transcribed verbatim into the dispatch envelope of any successor run.

