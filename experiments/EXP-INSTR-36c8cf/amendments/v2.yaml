protocol_amendment:
  experiment_id: EXP-INSTR-36c8cf
  amendment_ordinal: 2
  version_from: 2
  version_to: 3
  filename_convention_note: >-
    THE FILENAME IS v2.yaml BECAUSE THIS IS THE SECOND AMENDMENT TO THIS CONTRACT,
    NOT BECAUSE IT PRODUCES CONTRACT VERSION 2. The contract stands at version 2
    (specification.yaml version 1 as amended by amendments/v1.yaml); this amendment
    would produce version 3 IF IT IS EVER APPROVED. amendment_ordinal, version_from
    and version_to are the authority on which is which. The convention is the one
    stated in amendments/v1.yaml and it is restated here because the sibling file
    experiments/EXP-ICINV-4d33aa/amendments/v2.yaml names itself after its
    version_to and the two conventions would otherwise collide in a later reader's
    head.
  filed_at: '2026-08-10'
  filed_by: coordinator (GOAL-ENDO-001, BATCH-d7e255)
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-d7e255
  status: filed_pending_independent_validation_NOT_APPROVED
  claim_tier: toy
  recorded_by_decision: DEC-20260810-5aeeaa

  THIS_AMENDMENT_IS_NOT_APPROVED_AND_AUTHORIZES_NOTHING: >-
    READ THIS BEFORE ANYTHING ELSE. `approved_by` IS DELIBERATELY NULL. NO
    SUCCESSOR RUN OF EXP-INSTR-36c8cf MAY BE DISPATCHED ON THIS FILE. It becomes
    operative only when the two independent validations named in
    validation_required_before_approval have returned and a SUCCESSOR COORDINATOR
    DECISION approves, amends or withdraws it; a DISSENT from either blocks
    approval. Until then the contract remains at version 2 and the frozen ladder
    remains 12 / 24 / 48 exactly as amendment v1 change G3 E2 declares it. An
    executor that finds this file and no approving decision must refuse the work
    and say so.

  applies_to: >-
    FUTURE RUNS ONLY, AND ONLY IF APPROVED. RUN-INSTR-36c8cf-phaseA-v2-57ca9a IS
    NOT RE-SCORED, NOT RE-CLASSIFIED AND NOT EDITED. Its terminal state
    `completed_valid` stands, its F4 firing at p = 4001 stands as recorded, its
    accepted_rung stays null, its C-SELF-CONSISTENCY verdict stays `not_evaluated`,
    its p = 6007 family stays `not_measured`, and its rung 1, 2 and 3 measurements
    are not re-cut, not re-run and not re-scored (AGENTS.md rules 2 and 4). Any
    re-execution of the SR3 v3 characterisation is a NEW RUN UNDER A NEW RUN
    IDENTIFIER and the existing run directory is retained unchanged.

  reason: >-
    TWO COORDINATOR-SET NUMBERS IN THE SAME CHANGE OF AMENDMENT v1 WERE NOT JOINTLY
    SATISFIABLE, AND EXECUTION DISCOVERED IT. Change G3 declared the seed rungs
    12 / 24 / 48 (E2) and a 5% relative rung-to-rung half-width stability rule at
    every one of the thirteen density rows (E3). Neither was set against a noise
    model, exactly as neither was set against a cost measurement
    (DEC-20260810-56db2d limitations). The relative sampling noise of a
    standard-deviation estimate on a NESTED doubling of the seed set is about
    1/(2*sqrt(n_prev)), which is about 0.1443 at the 12 -> 24 transition and about
    0.1021 at 24 -> 48; requiring all thirteen rows to move by less than 5% at
    24 -> 48 therefore has probability of order 1e-4. THE RULE WAS EFFECTIVELY
    UNREACHABLE AT 48 SEEDS BY CONSTRUCTION. The measured outcome -- 1 of 13 rows
    within rule at rung 2, worst 0.3932 at fb = 22; 5 of 13 at rung 3, worst 0.2354
    at fb = 7 -- sits where that arithmetic predicts, at 2.72 and 2.31 standard
    deviations for a maximum over thirteen rows.

    THIS IS A DEFECT IN A PAIR OF COORDINATOR-SET PARAMETERS. IT IS NOT A DEFECT OF
    THE USER-CHOSEN FAMILY-WISE GATE, NOT A PROPERTY OF ANY INSTRUMENT AND NOT A
    FACT ABOUT ANY CURVE, CLASS, ISOGENY OR PRIME, IN EITHER DIRECTION, AT ANY
    SCALE. F4 firing is a protocol outcome and never negative evidence.

  the_freeze_question_confronted_rather_than_assumed: >-
    IS EXTENDING THE LADDER AFTER SEEING THAT IT FAILED THE SAME CLASS OF DEFECT AS
    WIDENING AN INTERVAL AFTER SEEING DATA? BOTH SIDES ARE ARGUED IN THE ADJUDICATING
    DECISION DEC-20260810-5aeeaa (adjudication_item_1) AND THE ANSWER IS CONDITIONAL,
    NOT FREE. The distinction relied on is that adding seeds changes only the
    PRECISION with which the reference run's own per-row mean and standard deviation
    are estimated, under an unchanged estimator at an unchanged coverage, and leaves
    the ACCEPTANCE REGION -- per-row central coverage 0.996154, family-wise 0.05 --
    untouched; whereas widening the interval or relaxing the 5% rule would move the
    acceptance region itself and IS FORBIDDEN. Two further properties carry the
    argument and both are made binding below: THERE IS NO VISIBLE DATUM TO FIT
    TOWARD (the data this gate will gate is a successor Arm A0 measurement of
    EXP-ICINV-4d33aa, an experiment that is PAUSED, whose amendment v3 is unwritten
    and whose successor run does not exist), and THIS FILE IS FILED BEFORE THE DATA
    IT GOVERNS EXISTS (rungs 4 and beyond, whose half-widths nobody has seen).

    THE OBJECTION IS RECORDED AT FULL STRENGTH RATHER THAN ANSWERED AWAY: E3 is
    wired into a FALSIFICATION criterion, and responding to a falsification by
    drawing more samples is optional stopping, which strips a rule of its falsifying
    power if it may be repeated. THAT IS WHY CHANGE E7 DECLARES A TERMINAL RUNG AND
    ITS TERMINAL OUTCOME IN ADVANCE, AND WHY THIS AMENDMENT IS NOT APPROVED BY THE
    SESSION THAT WROTE IT.

  the_5_percent_rule_survives_unchanged_and_that_is_load_bearing: >-
    THE 5% RELATIVE HALF-WIDTH THRESHOLD OF E3 IS NOT CHANGED, NOT RELAXED, NOT
    RESCALED AND NOT MADE ROW-DEPENDENT. It appears in this file only as a quotation
    of the frozen value. RELAXING IT TO FIT THE OBSERVED 0.2354 WOULD BE EXACTLY THE
    HULL-FITTING THIS WHOLE REDESIGN EXISTS TO PREVENT -- the same defect recorded
    for the superseded [1.3, 3.6] band, which EXP-ICINV-4d33aa amendment v2
    post_review_notes A5 shows to be the outward-rounded hull of the committed rows
    it gated, floor slack 0.020397 and ceiling slack 0.011900 -- and it is refused.
    Equally unchanged: the per-row central coverage 259/260, the per-row two-sided
    alpha 1/260, the family-wise target 0.05, the realised family-wise error
    0.048862, the interval quantiles 1/520 and 519/520, the mean +- z*sd estimator
    of E1 with z computed at run time, the A4 no-transcription rule, SR4 NO WIDENING,
    SR5 frozen scope, SR6 budget and SR7 no outcome shopping.

  changes:
    - id: E6
      field: inputs.sr3_amendment_v3.characterisation_procedure -- change G3 E2, the SEED RUNGS
      kind: extension_of_a_precision_ladder_acceptance_region_untouched
      decided_by: coordinator
      from: >-
        E2 as frozen by amendment v1: seed rungs 12, then 24, then 48. Rung 1 is the
        contract's twelve declared seeds; rung 2 adds 20260821 to 20260832
        inclusive; rung 3 adds 20260833 to 20260856 inclusive.
      to: |-
        THE LADDER CONTINUES BY PLAIN DOUBLING. Rungs 1, 2 and 3 are UNCHANGED and
        their seed sets are UNCHANGED. Five further rungs are declared, each ADDING
        to the previous rung's seed set so the ladder stays nested:

        rung 4 :   96 seeds, adding 20260857 to 20260904 inclusive   (48 new)
        rung 5 :  192 seeds, adding 20260905 to 20261000 inclusive   (96 new)
        rung 6 :  384 seeds, adding 20261001 to 20261192 inclusive  (192 new)
        rung 7 :  768 seeds, adding 20261193 to 20261576 inclusive  (384 new)
        rung 8 : 1536 seeds, adding 20261577 to 20262344 inclusive  (768 new)

        The seed blocks are contiguous integer ranges continuing the convention E2
        already established, so they are determined by the rung sizes and are not
        chosen. THE INTERVAL, ITS HALF-WIDTH AND THE EXTREME PER-SEED RATIOS ARE
        REPORTED AT EVERY RUNG REACHED, unchanged from E2, which is what keeps
        C-SEED-STABILITY a measurement rather than an assertion.
      what_this_does_not_change: >-
        IT CHANGES NO ACCEPTANCE REGION. The coverage, the estimator, the quantiles,
        the thirteen density rows, the target count T = 400, the family scope limit
        of one prime per family, and the 5% stability threshold are all untouched.
        Adding seeds changes only how precisely the reference run's own per-row mean
        and standard deviation are estimated.
      the_one_direction_of_effect_disclosed_rather_than_hidden: >-
        THE SAMPLE STANDARD DEVIATION IS SLIGHTLY BIASED LOW AND THE BIAS SHRINKS
        WITH n, SO A LONGER LADDER PRODUCES A MARGINALLY WIDER INTERVAL ON AVERAGE.
        The factor is c4(n); c4(48) is about 0.99473 and c4(1536) is about 0.99984,
        so the expected widening from rung 3 to rung 8 is about 0.5%. THAT IS A
        PERMISSIVE-DIRECTION EFFECT -- the same direction a hull-fit would move --
        AND IT IS DISCLOSED RATHER THAN CORRECTED, because applying a c4 correction
        would change the frozen estimator E1 after seeing data, which is precisely
        what is forbidden. It is about 0.5% against per-row half-widths of order
        0.5 to 1.4 and it does not depend on any observed value.

    - id: E7
      field: inputs.sr3_amendment_v3.characterisation_procedure -- change G3 E3, the TERMINATION of the ladder
      kind: addition_required_to_make_E6_not_be_optional_stopping
      decided_by: coordinator
      why_this_is_here_at_all: >-
        WITHOUT IT, "EXTEND WHEN IT FAILS" IS AN OPEN-ENDED SAMPLE-UNTIL-IT-PASSES
        LOOP AND THE OBJECTION IN the_freeze_question_confronted_rather_than_assumed
        WOULD BE CORRECT. THIS CHANGE IS THE CONDITION ON WHICH THE EXTENSION IS
        DEFENSIBLE AT ALL.
      to: |-
        T1. THE TERMINAL RUNG IS RUNG 8, 1536 SEEDS. The ladder is never extended
        beyond it under this contract, by this Coordinator or any successor, and no
        further amendment to this contract may lengthen it.

        T2. THE FIRST RUNG THAT MEETS THE UNCHANGED 5% RULE AT EVERY ONE OF THE
        THIRTEEN ROWS IS THE ACCEPTED RUNG, AND THE CHARACTERISATION STOPS THERE.
        The accepted interval is that rung's interval under the unchanged estimator.
        Continuing past a rung that met the rule -- to look for a narrower or a
        wider interval -- is OUTCOME SHOPPING under SR7 and makes the run INVALID.

        T3. THE TERMINAL OUTCOME IS DECLARED NOW, BEFORE THE DATA EXISTS, IN BOTH
        DIRECTIONS. If the 5% rule is not met at the 768 -> 1536 transition, then:
        F4 FIRES TERMINALLY; HEUR-INSTR-2 is not validated at any tested seed count
        up to 1536; the interval is NOT widened and the coverage is NOT changed;
        nothing is gated; the work STOPS; and the SR3 v3 GATE DESIGN GOES BACK TO
        THE USER, because the gate replacement was a USER decision recorded in
        DEC-20260810-a4bec4 and replacing it is not this Coordinator's to make. THE
        NAMED SUCCESSOR, so that a terminal negative names forward guidance rather
        than ending in a shrug (docs/inventor-protocol.md closure standard): replace
        the rung-to-rung stability heuristic with a DIRECT PRECISION CRITERION on
        the estimator itself -- for example requiring the relative standard error of
        the per-row standard deviation, about 1/sqrt(2*(n-1)), to fall below a
        declared value -- which is a function of the seed count ALONE and therefore
        cannot be fitted to any data; and, if validation V1 returns a heavy tail,
        replace the mean +- z*sd estimator itself, which is a gate redesign and a
        user decision. NEITHER SUCCESSOR IS ADOPTED HERE and neither may be adopted
        without its own versioned amendment filed before its data exists.

        T4. A BUDGET STOP IS NOT A TERMINAL OUTCOME AND IS NOT A PASS. If the frozen
        per-run budget (14400 s, 24 CPU-hours, 8 GB, 20 runs) is reached before the
        terminal rung, the run reports the rungs it completed, records the remainder
        as not_measured, and that is a BUDGET EVENT under AGENTS.md rule 5 -- never a
        pass, never a terminal F4, and never negative evidence about any instrument.

    - id: E8
      field: inputs.sr3_amendment_v3.characterisation_procedure -- the p = 6007 FAMILY
      kind: clarification_of_an_existing_rule_no_new_parameter
      decided_by: coordinator
      to: >-
        THE FAMILY ORDER AND THE FAMILY SCOPE LIMIT ARE UNCHANGED. p = 4001 is
        characterised first and p = 6007 second; each prime's thirteen rows is ONE
        family; the extended ladder and the unchanged 5% rule apply identically and
        independently to each; and nothing is pooled across primes. On acceptance at
        p = 4001 the characterisation proceeds to p = 6007 under the same ladder and
        the same terminal rung. THE MULTI-PRIME FAMILY IS STILL NOT CORRECTED: the
        G2 family_scope_limit stands verbatim, so requiring two primes to pass
        jointly carries a realised error of 1 - (1 - 0.048862)^2 = 0.095336, derived
        by exact arithmetic and not measured, and an across-prime family still
        requires its own versioned amendment to the contract that owns that gate.

    - id: E9
      field: reported metrics of the SR3 v3 characterisation -- a DIAGNOSTIC THAT GATES NOTHING
      kind: addition_declared_because_of_what_was_found_which_is_why_it_is_amended_and_not_slipped_in
      decided_by: coordinator
      to: |-
        D1. AT EVERY RUNG THE RUN ALSO REPORTS, PER ROW, THE MODEL-FREE NOISE SCALE
        1/(2*sqrt(n_prev)) FOR THAT TRANSITION, alongside the measured relative
        half-width change, and the ratio of the two. THIS GATES NOTHING. It exists
        so a reader can see whether the observed changes track the sampling noise of
        a standard-deviation estimate or exceed it, without recomputing it from the
        raw ratios.

        D2. AT EVERY RUNG THE RUN ALSO REPORTS, PER ROW, THE SAMPLE SKEWNESS OF THE
        PER-SEED VARIANCE RATIOS AND THE COUNT OF PER-SEED RATIOS FALLING OUTSIDE
        THAT ROW'S OWN FITTED INTERVAL, SPLIT BY SIDE (below the lower endpoint,
        above the upper endpoint), together with the expected count
        n_seeds * 13 / 260 under the Gaussian rule. THIS ALSO GATES NOTHING. It is
        the validation route HEUR-INSTR-3 was declared with, made explicit: if the
        listed extremes are visibly asymmetric or heavy-tailed relative to the
        fitted interval, that is reported as an instrument finding and the gate is
        redesigned under a further versioned amendment, never absorbed silently.
      why_this_needs_an_amendment_at_all: >-
        BECAUSE SR7 SAYS THE SET OF REPORTED METRICS MAY NOT DEPEND ON WHAT WAS
        FOUND, AND THIS ADDITION DOES DEPEND ON WHAT WAS FOUND. It is therefore
        declared as a versioned change, before the data it governs exists, rather
        than added quietly to a successor run. It is admissible because it moves no
        acceptance region, gates nothing, and is computed at every rung for every row
        regardless of outcome -- the selective-reporting hazard SR7 exists to prevent
        is absent by construction.
      what_is_NOT_done_to_the_existing_run: >-
        NEITHER DIAGNOSTIC IS RETROFITTED INTO RUN-INSTR-36c8cf-phaseA-v2-57ca9a.
        That run's artifacts are immutable. The corresponding arithmetic over its
        already-committed per-seed ratios is performed IN THE ADJUDICATING DECISION
        DEC-20260810-5aeeaa, where it is labelled an analysis by the Coordinator and
        not a run metric.

  declared_heuristic_HEUR_INSTR_4: >-
    NUMBERED AND STATED AS A HEURISTIC, NOT ASSUMED, BECAUSE THE ENTIRE EXTENSION
    RESTS ON IT: the rung-to-rung variation in the per-row interval half-width
    observed at rungs 1, 2 and 3 is ORDINARY SAMPLING NOISE IN A STANDARD-DEVIATION
    ESTIMATE, whose relative scale on a nested doubling is about 1/(2*sqrt(n_prev)),
    and it therefore shrinks as the ladder lengthens.
    ITS FALSIFICATION CONDITION: if the observed per-row relative changes at rungs 4
    and beyond do not shrink at the predicted rate -- specifically if the ratio
    reported by change E9 D1 stays materially above 1 as n grows -- HEUR-INSTR-4 is
    refuted, more seeds are the wrong repair, and the terminal outcome T3 applies
    without waiting for rung 8.
    ITS VALIDATION: the E9 D1 diagnostic at every rung, plus validation V1 below,
    which is required BEFORE this amendment may be approved rather than after.
    IT IS NOT ESTABLISHED BY THE RUN THAT MOTIVATED THIS AMENDMENT. See
    competing_explanation_not_excluded.

  competing_explanation_not_excluded: >-
    RECORDED AT FULL STRENGTH, BECAUSE IT IS THE REASON THIS FILE IS UNAPPROVED. AN
    ALTERNATIVE EXPLANATION FITS THE SAME DATA: the per-row sampling distribution of
    the variance-ratio statistic may be RIGHT-SKEWED OR HEAVY-TAILED, in which case
    the Gaussian tail rule HEUR-INSTR-3 is inadequate at coverage 259/260, the
    mean +- z*sd estimator is the wrong estimator, and NO NUMBER OF SEEDS FIXES THE
    GATE because the quantity being stabilised is not the quantity the gate needs.
    THE LIVE SIGNAL IN THE COMMITTED RUN, RECORDED AS AN OBSERVATION AND EXPLICITLY
    NOT AS A FINDING: at rung 3 two of the thirteen rows have their own extreme
    per-seed ratio outside their own fitted interval -- fb = 11, max 3.3358 against
    an upper endpoint 3.2614, and fb = 22, max 4.8231 against an upper endpoint
    4.5123 -- and BOTH are on the upper side with none on the lower. The expected
    exceedance count under the Gaussian rule is 13 * 48 / 260 = 2.4, so the COUNT is
    consistent and proves nothing; the one-sided pattern has probability 0.25 under
    symmetry and proves nothing alone. But both exceeding rows are among the rows
    failing the stability rule, and fb = 22 carries both the largest standard
    deviation (0.4675) and the worst rung-1-to-2 change (0.3932). DISCRIMINATING THE
    TWO EXPLANATIONS IS VALIDATION V1 AND IT IS A PRECONDITION OF APPROVAL.

  reachability_and_cost_derived_not_measured: >-
    DERIVED BY EXACT ARITHMETIC FROM THE FROZEN LADDER UNDER A DECLARED GAUSSIAN
    MODEL FOR THE STANDARD-DEVIATION ESTIMATOR, ASSUMING INDEPENDENT ROWS. THESE ARE
    NOT MEASUREMENTS AND THEY ARE NOT PREDICTIONS OF THE GATE'S OUTCOME.
    Probability that all thirteen rows move by less than 5%: about 1.2e-4 at
    24 -> 48; about 0.006 at 48 -> 96; about 0.095 at 192 -> 384; about 0.51 at
    384 -> 768; about 0.93 at 768 -> 1536. The thirteen rows share curves and share
    seed-independent sum sets, so they are positively correlated and these figures
    are FLOORS; a non-Gaussian tail voids them entirely.
    COST, ESTIMATED FROM THE MOTIVATING RUN'S OWN LOAD-OBSERVATION TIMELINE AND
    MARKED AS AN ESTIMATE: about 81 s for the fixed sum-set measurement phase over
    138 curves, and about 47 s to score 48 seeds across all thirteen rows, hence
    about 1 s per seed at the margin because the m = 3 sum sets are seed-independent
    and reused. A ladder to the terminal 1536 seeds is therefore of order 1.6e3 s
    against the frozen 14400 s per-run budget, roughly 11%. THIS IS A
    LINEAR-IN-SEEDS EXTRAPOLATION FROM ONE 128.234 s RUN ON A HOST AT LOAD AVERAGE
    42.00 / 28.71 / 21.59 ON 14 CORES AT START. E5 STANDS: THE BUDGET IS NOT
    INCREASED BY THIS AMENDMENT, and a budget stop is a budget event, never a pass.

  validation_required_before_approval:
    - >-
      V1. AN INDEPENDENT review-adversarial SESSION, in a session that did not
      originate this claim, that re-derives the noise arithmetic from
      RUN-INSTR-36c8cf-phaseA-v2-57ca9a's OWN per-seed variance ratios and returns a
      verdict on HEUR-INSTR-4 against competing_explanation_not_excluded: skewness
      and tail weight of the per-row distribution at all thirteen rows, whether the
      two upper-side exceedances at fb = 11 and fb = 22 are consistent with coverage
      259/260 under the Gaussian rule, and whether the observed rung-to-rung changes
      are consistent with 1/(2*sqrt(n_prev)). IF IT RETURNS THE HEAVY-TAIL
      EXPLANATION, THIS AMENDMENT MUST BE WITHDRAWN RATHER THAN APPROVED and the
      gate's ESTIMATOR redesigned, which is a user decision.
    - >-
      V2. A RED-TEAM PASS ON THE FREEZE QUESTION ITSELF: whether extending a declared
      ladder after a stability failure, under an unchanged 5% threshold, an unchanged
      coverage, an unchanged estimator, a declared terminal rung and a terminal
      outcome declared in advance, is discipline-preserving or is optional stopping
      in a uniform. The red team is asked specifically to attack changes E6 and E7 and
      the argument in the_freeze_question_confronted_rather_than_assumed.
    - >-
      A DISSENT FROM EITHER BLOCKS APPROVAL. It is not outvoted; it stands until a
      new Coordinator decision supersedes it on the merits.

  why_this_amendment_is_not_approved_on_filing: >-
    THE CAMPAIGN'S OWN PRECEDENT IS APPLIED RATHER THAN RE-ARGUED. Amendment v1 was
    approved on filing because its two repaired parameters were USER decisions and
    the defect was the plain absence of two numbers from a frozen file, machine-
    checked inside the run -- not an attribution review could overturn.
    EXP-ICINV-4d33aa amendment v2 was held UNAPPROVED pending two independent
    validations because it repaired defects in a contract the same Coordinator wrote
    AND its repair depended on an attribution a validator might overturn. THIS
    AMENDMENT IS THE SECOND CASE ON BOTH LIMBS: the ladder and the 5% threshold are
    COORDINATOR-SET (v1 change G3, decided_by coordinator), so the Coordinator role
    is repairing its own parameter after its own failure; and the repair depends
    entirely on HEUR-INSTR-4 over the competing explanation, which is exactly an
    attribution a validator can overturn. Approving it here would do in one step what
    the two-step exists to prevent.

