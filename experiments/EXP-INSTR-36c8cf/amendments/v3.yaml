      one prime's thirteen rows is one family and multi-prime evaluation is NOT
      corrected by that declaration.
    - >-
      Change G3 E1, the estimator: mean +- z*sd on the row's empirical mean and
      sample standard deviation, with z = Phi^{-1}(519/520) COMPUTED AT RUN TIME.
      Transcribing z, or any other reference value, into source at any precision
      remains PROHIBITED and makes the run INVALID (the standing A4 rule). NO c4 AND
      NO t-BASED CORRECTION IS APPLIED; both are reported by E13 D3 and neither is
      used.
    - >-
