      The 5% relative half-width stability threshold of E3, BYTE FOR BYTE. It appears
      in this file only as a quotation of the frozen value.
    - >-
      Change G2 in full: 13 rows gated, family-wise target 0.05, per-row two-sided
      alpha 1/260, per-row central coverage 259/260, realised family-wise error
