  the_F4_remedy_clause_reconciled_explicitly: >-
    THIS IS REPAIR R4's SECOND LIMB AND THE SILENCE V2 OBJ-7 IDENTIFIED IS ENDED.
    specification.yaml F4 has two clauses: an EVIDENTIARY one ("HEUR-INSTR-2
    refuted"), which AGENTS.md rule 6 confines to the tested scope and which
    DEC-20260810-5aeeaa correctly read narrowly as "not validated at 12, 24 or 48
    seeds"; and a REMEDY clause, "THE GATE IS REDESIGNED UNDER A NEW VERSIONED
    AMENDMENT before any successor run of EXP-ICINV-4d33aa is dispatched". THE REMEDY
    CLAUSE IS NOT SUPERSEDED BY v1's E3 AND IS NOT CONSTRUED AWAY. IT IS HONOURED:
    this amendment redesigns the gate's acceptance rule, replacing a five-look
    first-crossing stability test with a single evaluation at a terminus derived from
    the frozen coverage. Amendment v2 redesigned nothing and lengthened a ladder,
    which is why, on V2's reading and on this Coordinator's, it did not satisfy the
    remedy. The estimator itself is NOT redesigned, because that is a USER decision
    (DEC-20260810-a4bec4) and no evidence before this Coordinator requires it: V1
    found the mechanism to be noise, not shape.

  the_direct_precision_criterion_considered_and_why_it_is_not_adopted_alone: >-
    THIS IS REPAIR R4's FIRST LIMB, ANSWERED RATHER THAN DEFERRED. V2 OBJ-4 is right
    that a criterion of the form 1/sqrt(2*(n-1)) < 0.05 needs no ladder, no look and
    no freeze defence, and gives n >= 201 in closed form; it is also right that E3 at
    n = 48 (1/(2*sqrt(24)) = 0.10206) numerically tracks the closed form
    (1/sqrt(2*47) = 0.10314), so E3 is a noisy 13-row-maximum proxy for a computable
    quantity. IT IS NOT ADOPTED AS THE SOLE CRITERION FOR ONE REASON, STATED AS A
    REQUIREMENT AND NOT AS A PREFERENCE: it certifies the precision of the sd, and
    the gate's endpoints are 1/520 quantiles whose adequacy is governed by
    HEUR-INSTR-3, which precision on the sd does not touch. A ladder stopping at
    n = 201 or 384 has under one expected observation beyond an endpoint and makes
    v1's declared validation route for HEUR-INSTR-3 vacuous. THE CHARGE THAT THE
    EXTENSION BUYS 7.6x THE SEEDS FOR NO ADDITIONAL PRECISION IS ANSWERED: the extra
    seeds buy tail resolution and finite-n calibration (F-V1-2: realised tail
    probability 1.63x nominal at n = 48, 1.05x at 768, 1.04x at 1536), not sd
    precision. WHAT IS CONCEDED: the direct criterion is strictly better ON THE
    PRECISION AXIS and this amendment does not claim otherwise; T3 keeps it as the
    named successor if the terminal test fails.

  a_control_recommended_by_the_red_team_and_NOT_adopted_here_with_its_revisit_condition: >-
    RC-2, THE PAIRED targets_B COMPANION ARM, IS NOT DECLARED IN THIS AMENDMENT, AND
    THE RED TEAM MARKED IT "STRONGLY RECOMMENDED, NOT REQUIRED". Recording the refusal
    with its evidence, budget, boundary, successor and revisit condition rather than
    dropping it (AGENTS.md rule 9 / CLAUDE.md rule 9). WHY NOT NOW: this contract's
    job is admissibility, its cost model is a linear extrapolation from a single
    128 s run, the p = 6007 family has never been measured at any seed count, and
    running to a fixed terminus already removes the early-stopping saving. Doubling
    the per-seed work across two families against a 14400 s budget on a host observed
    between 18 and 116 load on 14 cores is a material budget-event risk, and a budget
    event costs the whole run. WHAT IS GIVEN UP, STATED HONESTLY: the committed
    three-seed contrast in RUN-ICINV-40622f already suggests the sampler effect is
    large at fb <= 13 and absent at fb >= 15, and a paired arm at up to 1536 seeds is
    the only thing in reach that would turn this admissibility exercise into
    information about H-ICINV-6c7920. THE REVISIT CONDITION, CONCRETE: when the
    successor run reports MEASURED per-seed marginal cost for both families under
    E14 C2, the paired targets_B companion is re-proposed -- as its own versioned
    amendment to this contract if the measured budget headroom allows, or as a
    declared arm of the H-ICINV-6c7920 lane, whichever the then-current Coordinator
    finds cheaper. IT IS NOT CLOSED AND IT IS NOT FORGOTTEN.

  the_sampler_question_is_settled_elsewhere_and_is_recorded_here_for_the_executor: >-
    CONFLICT-1 IS ADJUDICATED BY DEC-20260810-5aeeaa AND NOT BY THIS FILE, AND THAT
    ADJUDICATION IS UNDISTURBED: the red team examined it for convenience, found it
    PRINCIPLED AND CORRECT, and did not dissent on it. For this contract the operative
    consequence is unchanged: THE SR3 v3 CHARACTERISATION CONTINUES TO USE THE
    REFERENCE RUN'S OWN SAMPLER -- exp_icinv.targets_uniform for EXP-ICINV-55c2d8 /
    RUN-ICINV-p4001-fixed -- identified at run time from that run's own record and
    never assumed, because a reproduction control that substitutes a different sampler
    is not a reproduction. NOTHING MEASURED THROUGH targets_uniform MAY SUPPORT ANY
    WITHIN-CLASS OR CURVE-SIDE CLAIM IN EITHER DIRECTION; the characterised baseline
    inherits H-ICINV-6c7920's dispute wholesale; and every new measurement arm of this
    contract, in Phase B and everywhere else, uses targets_B. The r-stratification is
    unconditional and gates nothing. The five-clause restatement of the standing
    control is DEC-20260810-5aeeaa.standing_control_restatement_v2 and must be
    transcribed VERBATIM into the dispatch envelope of any successor run. THAT SCOPE
    LIMIT IS PROSPECTIVE; see DEC-20260810-95a741 for the ruling and its reasons.
    WHAT THIS GATE CERTIFIES, BLUNTLY: IMPLEMENTATION FIDELITY, NOT SCIENTIFIC
    CONTENT.

