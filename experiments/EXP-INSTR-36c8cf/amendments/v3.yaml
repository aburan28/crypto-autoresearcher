      competing_explanation_not_excluded, unchanged as a record of what was
      not yet known at filing; V1's report is the independent test of it
      this section anticipated.
    - >-
      The 5% relative half-width stability threshold of E3 (amendment v1),
      byte for byte. Change G2 in full (13 rows, family-wise 0.05, per-row
      coverage 259/260, quantiles 1/520 and 519/520). Change G3 E1, the
      mean +- z*sd estimator with z computed at run time; the standing A4
      no-transcription rule, now extended in spirit to D4's Monte Carlo
      calibration figures as well. Change G3 E4 and E5 (SR1's seeds
      unchanged; budget not increased by any amendment in this chain).
    - >-
      Changes G1, G4, G5 and G6 of amendment v1, in full.
    - >-
      SR4 NO WIDENING, absolutely. SR5 frozen scope, SR6 budget, SR7 no
      outcome shopping. Every invalidation rule of the frozen contract.
    - >-
      Blockers B1 (T5 walk-kernel bias ladder) and B2 (Phase B density rows)
      are UNCHANGED, UNRESOLVED and STILL BLOCKING. This amendment fills
      neither and writes no placeholder.
    - >-
      claim_tier toy. No attack, no exponent, no speedup, sota_delta zero on
      every axis.

  the_sampler_question_is_settled_elsewhere_and_is_recorded_here_for_the_executor: >-
    UNCHANGED FROM v2.yaml. CONFLICT-1 is adjudicated by DEC-20260810-5aeeaa
    and not by this file. The SR3 v3 characterisation continues to use the
    reference run's own sampler (exp_icinv.targets_uniform for
    EXP-ICINV-55c2d8 / RUN-ICINV-p4001-fixed), identified at run time and
    never assumed. Nothing measured through targets_uniform may support any
    within-class or curve-side claim in either direction; the characterised
    baseline inherits H-ICINV-6c7920's dispute wholesale; every new
    measurement arm of this contract uses targets_B. The five-clause
    restatement of the standing control is in
    DEC-20260810-5aeeaa.standing_control_restatement_v2 and must be
    transcribed verbatim into the dispatch envelope of any successor run.

  reachability_and_cost_figures_corrected_by_reference: >-
    V1 (VAL-20260810-eddc0c) independently re-derived DEC-20260810-5aeeaa's
    and v2.yaml's own reachability_and_cost_derived_not_measured figures and
    found an arithmetic defect at two of six future-facing transitions:
    24->48 recomputes to 2.98e-06 (stated 1.2e-04, ~40x off), 48->96
    recomputes to 1.64e-04 (stated 6.0e-03, ~37x off), and 96->192 recomputes
    to 5.79e-03 (silently absent from the original list). The other three
    transitions (192->384, 384->768, 768->1536) reproduce exactly as stated.
    THE QUALITATIVE CONCLUSION IS UNCHANGED -- if anything the corrected
    24->48 figure makes "effectively unreachable at 48 seeds by construction"
    MORE true, not less. ANY FUTURE CITATION OF THESE REACHABILITY FIGURES
    MUST USE V1's recomputed values (2.98e-06 / 1.64e-04 / 5.79e-03 / 9.47e-02
    / 5.13e-01 / 9.30e-01) rather than the original text. The nested-ladder
    sigma sequence itself (0.1443, 0.1021, 0.0722, 0.0510, 0.0361, 0.0255,
    0.0180) and the cost estimate (order 1.6e3 s to the terminal rung,
    roughly 11% of the 14400 s per-run budget, a linear extrapolation and
    not a measurement) are independently confirmed and unchanged.

