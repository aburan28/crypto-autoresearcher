      moves the construction stage's pass probability DOWN relative to amendment v2
      as filed and leaves Region 1 untouched.
    - >-
      IT DOES NOT TOUCH EXP-ICINV-4d33aa OR ITS SR3 GATE. RQ-ICINV-475b5e REMAINS
      PAUSED for that experiment on both of its standing grounds, and THIS AMENDMENT
      DOES NOT UNPAUSE THAT LANE.
    - >-
      It does not move any hypothesis status. H-INSTR-444c7b stays `specified`.
      H-ICINV-d5e351 stays `specified`. H-ICINV-6c7920 stays `specified` and is
      neither presumed true nor false. H-STR-002 stays `weakened`; pause condition P2
      is respected -- this contract builds no equivariant factor base and tests no
      phi-stable structure.
    - >-
      It does not discharge GOAL-ENDO-001 criterion C4, for the SR3 v3 gate or for
      anything else, and it meets no completion criterion.
    - >-
      It declares no planted-size ladder for the T5 walk kernel and no Phase B
      density grid. Those are blockers B1 and B2, still named and still not filled.
    - >-
      It makes no curve-side claim of any kind and asserts nothing about any
      instrument's quality. Nothing in it is evidence about any curve, class, isogeny,
      sampler or prime.
    - >-
      It does not validate HEUR-INSTR-2 or HEUR-INSTR-3, and it does not establish
      HEUR-INSTR-4.

