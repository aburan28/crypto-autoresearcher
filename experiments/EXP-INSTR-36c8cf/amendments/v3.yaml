protocol_amendment:
  experiment_id: EXP-INSTR-36c8cf
  amendment_ordinal: 3
  version_from: 2
  version_to: 3
  filename_convention_note: >-
    THE FILENAME IS v3.yaml BECAUSE THIS IS THE THIRD AMENDMENT TO THIS
    CONTRACT. version_from and version_to are UNCHANGED FROM v2.yaml (2 -> 3),
    NOT 3 -> 4, BECAUSE v2.yaml WAS NEVER APPROVED (approved_by: null) AND
    THEREFORE AUTHORIZED NOTHING AND MOVED THE CONTRACT NOWHERE: the contract
    remains frozen at version 2 until an amendment is actually approved. THIS
    FILE IS THAT APPROVAL. v2.yaml IS NOT EDITED AND IS NOT DELETED -- it
    remains on disk exactly as filed, immutable, and its own record of what
    was proposed and why it was not approved on filing stands unchanged. THIS
    FILE SUPERSEDES v2.yaml'S FILING BY BEING THE ONE THAT IS ACTUALLY ACTED
    ON, not by altering v2.yaml's text.
  filed_at: '2026-08-10'
  filed_by: coordinator (GOAL-ENDO-001, BATCH-d7e255)
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-d7e255
  status: filed_and_approved_supersedes_v2_filing_authorizes_the_ladder_extension
  claim_tier: toy
  recorded_by_decision: DEC-20260810-00ee9d

  relationship_to_v2_filing: >-
    v2.yaml's changes E6 (extend the seed ladder to rungs 4-8 by plain
    doubling), E7 (declare terminal rung T1 = 1536, first-pass-wins T2,
    bidirectional pre-declared terminal outcome T3, budget-stop-is-not-a-
    terminal-outcome T4), E8 (the p = 6007 family clarification), E9 (the D1
    noise-ratio and D2 in-sample exceedance diagnostics), the numbered
    heuristic HEUR-INSTR-4, and the section
    competing_explanation_not_excluded are ADOPTED VERBATIM BY REFERENCE TO
    v2.yaml, WHICH IS NOT RESTATED HERE, to avoid retyping seed ranges and
    figures that are already frozen, machine-checkable text in an immutable
    file. Nothing in E6-E9 is altered by this amendment. What v3 adds is
    THREE new changes (E10, E11, E12) and ONE correction to how condition (b)
    of DEC-20260810-5aeeaa is read going forward; what v3 does that v2 could
    not is APPROVE THE WHOLE PACKAGE FOR COMPUTE.

  THIS_AMENDMENT_IS_APPROVED_AND_AUTHORIZES_COMPUTE: >-
    READ THIS BEFORE ANYTHING ELSE, BECAUSE IT IS THE OPPOSITE OF v2.yaml'S
    OWN HEADER. `approved_by` IS coordinator, NOT NULL. A successor run of the
    SR3 v3 characterisation (rungs 4 through 8, or fewer if T2's first-pass-
    wins rule accepts an earlier rung) MAY be dispatched against contract
    version 2 as amended by v1 (approved) and by THIS FILE, subject to its own
    fresh Coordinator handoff with a non-null budget and completion gate
    (AGENTS.md rule 1: an approved contract without a handoff is not
    dispatched) and to the same host-load gating that applied to the Phase A
    dispatch (a sampling instrument whose seed count and wall-clock budget are
    part of what it measures cannot be run honestly on an oversubscribed
    host). This approval is recorded by DEC-20260810-00ee9d and rests on two
    already-returned, already-committed independent reviews
    (VAL-20260810-eddc0c, RT-20260810-b12e04); it is not contingent on any
    further review round. See why_this_amendment_is_approved_on_filing below
    for why that is consistent with, not an exception to, the campaign's own
    two-step precedent.

  applies_to: >-
    FUTURE RUNS ONLY. RUN-INSTR-36c8cf-phaseA-v2-57ca9a IS NOT RE-SCORED, NOT
    RE-CLASSIFIED AND NOT EDITED. Its terminal state `completed_valid` stands,
    its F4 firing at p = 4001 stands as recorded, its accepted_rung stays
    null, its C-SELF-CONSISTENCY verdict stays `not_evaluated`, its p = 6007
    family stays `not_measured`, and its rung 1, 2 and 3 measurements are not
    re-cut, not re-run and not re-scored (AGENTS.md rules 2 and 4). Any
    re-execution of the SR3 v3 characterisation is a NEW RUN UNDER A NEW RUN
    IDENTIFIER and the existing run directory is retained unchanged.

  reason: >-
    THE TWO INDEPENDENT VALIDATIONS DEC-20260810-5aeeaa AND v2.yaml REQUIRED
    HAVE RETURNED. V1 (validator, VAL-20260810-eddc0c) returned INCONCLUSIVE
    on HEUR-INSTR-4 versus the heavy-tail explanation -- NOT the literal
    "returns the heavy-tail explanation" trigger that would force withdrawal
    -- with a material, concretely demonstrated finding: the in-sample D2
    exceedance diagnostic (v2 change E9) self-masks exactly the kind of
    single-point tail excess it exists to catch, and V1 recommends a
    leave-one-out or externally-referenced fix "as a condition attached to,
    not a replacement for, extending the ladder" (V1's own words). V2
    (red-team, RT-20260810-b12e04) returned CONDITIONAL, directly attacked
    changes E6 and E7 and the T1-T4 termination mechanism, and could not
    break it; V2 registered one narrow, documentation-curable DISSENT on
    DEC-20260810-5aeeaa's own gloss of condition (b) ("no candidate arm value
    has been observed by anyone"), which is checkably false, while
    affirming v2.yaml's own narrower wording of the same condition ("the
    successor run does not exist") as accurate. Per DEC-20260810-5aeeaa's own
    rule, a dissent "stands until a new Coordinator decision supersedes it on
    the merits" and blocks approval until then. This amendment IS that
    supersession, together with the binding of V1's recommended diagnostic
    fix as a condition on the extension it governs.

  changes:
    - id: E10
      field: "DEC-20260810-5aeeaa adjudication_item_1, condition (b) as glossed there"
      kind: documentation_correction_of_a_false_absolute_claim
      decided_by: coordinator
      what_was_false: >-
        DEC-20260810-5aeeaa states "no candidate arm value has been observed
        by anyone. There is nothing this extension could be fitted to." That
        absolute claim is FALSE. experiments/EXP-ICINV-4d33aa/runs/
        RUN-ICINV-fg-primary-v2-p4001/ (batch BATCH-aa267f, contract_version
        2, class_role primary, status completed_valid, no SUPERSEDED.yaml
        marker) carries Arm A0's own committed per-row variance-ratio values
        at seed 20260807, T = 400, across the same thirteen frozen density
        rows this SR3 v3 characterisation gates, under
        exp_icinv.targets_uniform -- e.g. (fb, VR_pooled): (4, 1.1241),
        (11, 1.7603), (18, 3.0768), (22, 3.2411). This was independently
        found and verified by V2 (RT-20260810-b12e04, objection OBJ-1) by
        searching the committed record at the reviewed snapshot 60060084d,
        and independently re-confirmed by the Coordinator before this
        amendment was filed.
      what_remains_true: >-
        v2.yaml's OWN narrower wording of the same condition --
        "the data this gate will gate is a successor Arm A0 measurement of
        EXP-ICINV-4d33aa ... whose successor run does not exist" -- is
        ACCURATE and is not corrected by this change. No successor run of
        EXP-ICINV-4d33aa exists; RQ-ICINV-475b5e remains paused for that
        experiment and its own amendments/v3.yaml remains unwritten.
      the_corrected_reading: >-
        A visible, committed, same-units, same-rows number EXISTS
        (RUN-ICINV-fg-primary-v2-p4001's Arm A0 values), so "nothing to fit
        toward" is not literally true. It is nonetheless an UNRELIABLE
        anchor, not a nonexistent one, for two independent reasons that both
        travel forward: (i) it was measured under exp_icinv.targets_uniform,
        the sampler standing_control_restatement_v2 clause (a) prohibits for
        any NEW measurement arm -- any future Arm A0 remeasurement under
        EXP-ICINV-4d33aa's own unwritten amendments/v3.yaml must use
        targets_B instead, per that restated control; (ii) H-ICINV-6c7920
        (whether targets_uniform's over-dispersion is a sampler artifact) is
        UNRESOLVED and stays `specified`, neither presumed true nor false, so
        whether the old targets_uniform value is numerically close to what a
        future targets_B measurement would show is itself disputed and
        cannot be assumed. A reader (or a future Coordinator) could still be
        informally anchored by the visible number even though it should not
        be, which is exactly why the absolute "does not exist" claim needed
        correcting rather than being left to stand.
      what_this_does_not_change: >-
        This is a DOCUMENTATION correction to how condition (b) is read
        going forward. It does not reopen, re-run, or re-score
        RUN-ICINV-fg-primary-v2-p4001; it does not unpause EXP-ICINV-4d33aa;
        it does not alter DEC-20260810-5aeeaa's text (which stands
        uncorrected and is superseded on this one point by reference, per
        DEC-20260810-00ee9d); and it makes no claim, in either direction,
        about H-ICINV-6c7920.

    - id: E11
      field: "reported metrics of the SR3 v3 characterisation -- a DIAGNOSTIC THAT GATES NOTHING, added because of what V1 found"
      kind: addition_declared_because_of_what_was_found_which_is_why_it_is_amended_and_not_slipped_in
      decided_by: coordinator
      why_this_needs_an_amendment_at_all: >-
        SAME RULE v2.yaml's OWN CHANGE E9 INVOKES: SR7 forbids the reported
        metric set depending on what was found, so a diagnostic added because
        of a specific finding is declared as a versioned change, before the
        data it governs exists, rather than slipped into a successor run
        quietly.
      to: |-
        D3. AT EVERY RUNG REACHED (4 THROUGH 8), FOR ALL THIRTEEN DENSITY
        ROWS, THE RUN ALSO REPORTS A LEAVE-ONE-OUT (LOO) TAIL DIAGNOSTIC:
        for the row's single most extreme per-seed ratio (by absolute
        deviation from that row's own mean), recompute that row's mean and
        sd EXCLUDING the extreme point, score the excluded point against the
        resulting LOO interval (mean_loo +- z*sd_loo, same z as E1), and
        report the LOO z-score alongside the in-sample z-score the D2
        diagnostic of change E9 already reports. THIS GATES NOTHING and
        moves no acceptance region, exactly as D1 and D2 already do.

        D4. AT EVERY RUNG REACHED, THE RUN ALSO RUNS ITS OWN DISCLOSED,
        SEEDED MONTE CARLO NULL CALIBRATION AT THAT RUNG'S OWN SEED COUNT n:
        draw n i.i.d. N(0,1) values, compute the LOO z-score of the sample
        maximum, repeat for at least 20000 trials, and report the resulting
        empirical distribution's median, 90th, 99th percentile and maximum,
        together with the seed used. THIS IS COMPUTED AT RUN TIME AT EACH
        RUNG'S OWN n; V1's own disclosed n = 48 figures (median 2.345, 90th
        3.063, 99th 3.877) ARE NOT TRANSCRIBED INTO ANY LATER RUNG'S
        evaluation, in the same spirit as the standing A4 no-transcription
        rule for z. This calibration gates nothing.

        D5. FALSIFICATION CONTENT OF D3+D4, STATED NOW SO IT IS NOT A
        POST-HOC READING LATER: if, at fb = 18 or fb = 22 specifically, a
        NEW rung's LOO z-score (per D3) exceeds that rung's own D4-calibrated
        99th-percentile threshold, and this recurs at more than one rung
        among rungs 4-8, that is reported as evidence FOR the heavy-tail
        explanation (Explanation B) and TRIGGERS change E7's T3 "gate design
        goes to the user" path WITHOUT WAITING FOR RUNG 8, exactly as
        HEUR-INSTR-4's own falsification condition (v2.yaml's E9 D1) already
        does for the noise-scale question. A single rung's exceedance alone
        is NOT sufficient to trigger this (V1's own calibration puts a
        single-rung, single-row LOO deviation of this kind at roughly
        1-in-100 to 1-in-300 under the null, which is not rare enough on its
        own across five further rungs and thirteen rows to be dispositive);
        recurrence across more than one rung at the SAME row is the
        signal, mirroring V1's own finding that fb = 22's outlier is
        row-localized rather than a globally-hot seed.
      what_is_NOT_done_to_the_existing_run: >-
        NEITHER D3 NOR D4 IS RETROFITTED INTO RUN-INSTR-36c8cf-phaseA-v2-57ca9a.
        That run's artifacts are immutable. V1's own leave-one-out analysis
        over that run's already-committed per-seed ratios
        (VAL-20260810-eddc0c, single_row_outlier_analysis) is the validator's
        own analysis and is cited, not retrofitted as a run metric.

    - id: E12
      field: "reported metrics of the SR3 v3 characterisation at any rung accepted under T2"
      kind: addition_declared_because_of_what_was_found
      decided_by: coordinator
      to: >-
        WHEN (IF) A RUNG IS ACCEPTED UNDER change E7's T2, THE ACCEPTING
        RECORD ALSO REPORTS THAT RUNG'S INTERVAL'S ABSOLUTE HALF-WIDTH AT
        EVERY ONE OF THE THIRTEEN ROWS, beside its "5%-stabilised" verdict.
        THIS GATES NOTHING. "Stabilised" (rung-to-rung relative change under
        5%) and "narrow enough to be a useful admissibility gate" are two
        different questions; v2.yaml only addressed the first. This change
        makes the second visible to whoever reads the accepted interval,
        rather than leaving "stabilised" to be read alone as "useful."
      provenance: V2 (RT-20260810-b12e04, finding F-01, severity minor_informational).

  why_this_amendment_is_approved_on_filing: >-
    THE CAMPAIGN'S OWN PRECEDENT IS APPLIED, NOT SET ASIDE. v2.yaml was filed
    unapproved because its repaired parameters (the seed ladder and the 5%
    threshold's joint infeasibility) were COORDINATOR-SET and the repair
    (extend the ladder) rested on an attribution -- HEUR-INSTR-4 over the
    heavy-tail explanation -- that a validator could overturn. THAT
    ATTRIBUTION HAS NOW BEEN INDEPENDENTLY TESTED: V1 did not return the
    heavy-tail explanation (the explicit, literal withdrawal trigger was not
    met), and V2 directly attacked the T1-T4 mechanism the extension depends
    on and could not break it. This amendment's THREE CHANGES are not a
    further Coordinator repair of a Coordinator-set parameter resting on an
    unreviewed attribution: E10 documents a fact V2 itself found and
    verified; E11's diagnostic is V1's OWN recommended fix, adopted as V1
    itself framed it -- "a condition attached to, not a replacement for,
    extending the ladder" -- not a Coordinator invention requiring its own
    review; E12 is V2's own minor finding, adopted verbatim. None of the
    three moves the acceptance region, none of the three makes the gate
    easier to pass (E11 and E12 make a future "stabilised" reading MORE
    scrutinised, not less), and none rests on an attribution this
    Coordinator is making unilaterally. Approving this package therefore
    does not do in one step what the two-step exists to prevent; it is the
    two-step's intended output.

