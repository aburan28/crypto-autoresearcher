  what_this_file_is_and_what_happened_to_v2: >-
    READ THIS FIRST. AMENDMENT v2 IS SUPERSEDED AND WAS NEVER APPROVED. It stays
    on the record byte-unchanged with `approved_by: null`, exactly as filed
    (AGENTS.md rule 2: corrections supersede, never overwrite). Both independent
    validations it required have returned. V1 (validation_v1_noise_vs_tail.yaml,
    verdict `passed`, recommendation APPROVE, no dissent) settled the MECHANISM:
    the E3 instability is noise in the standard-deviation estimator and not a
    right-skewed or heavy-tailed per-row distribution, so more seeds are the right
    repair. V2 (red_team_v2_freeze.yaml, FINAL) DISSENTED on approving v2 AS FILED
    and listed eight repairs R1-R8 that would withdraw the dissent, three of them
    against conditions (a), (b) and (d) of the freeze argument in
    DEC-20260810-5aeeaa. THE TWO REVIEWS ARE NOT IN CONFLICT: V1 answers what is
    true about the data, V2 attacks what the record SAYS about why the extension is
    admissible. This file enacts the repairs. It changes the JUSTIFICATION of the
    ladder in ways that are restatement only, and it changes ONE FROZEN PARAMETER
    -- the acceptance rule T2 -- which is why it is a new versioned amendment and
    not an edit. The adjudication is DEC-20260810-95a741; read it for the
    objection-by-objection disposition.

  applies_to: >-
    FUTURE RUNS ONLY. RUN-INSTR-36c8cf-phaseA-v2-57ca9a IS NOT RE-SCORED, NOT
    RE-CLASSIFIED AND NOT EDITED. Its terminal state `completed_valid` stands, its
    F4 firing at p = 4001 stands as recorded, its accepted_rung stays null, its
    interval_stabilised stays false, its C-SELF-CONSISTENCY verdict stays
    `not_evaluated`, its p = 6007 family stays `not_measured`, and its rung 1, 2
    and 3 measurements are not re-cut, not re-run and not re-scored (AGENTS.md
    rules 2 and 4). RUN-INSTR-36c8cf-phaseA-2a5cd1 is untouched and remains
    `completed_invalid` with classification `specification_error`. Any re-execution
    of the SR3 v3 characterisation is a NEW RUN UNDER A NEW RUN IDENTIFIER.

  reason: >-
    TWO COORDINATOR-SET NUMBERS IN THE SAME CHANGE OF AMENDMENT v1 WERE NOT JOINTLY
    SATISFIABLE, AND EXECUTION DISCOVERED IT. Change G3 declared the seed rungs
    12 / 24 / 48 (E2) and a 5% relative rung-to-rung half-width stability rule at
    every one of the thirteen density rows (E3); neither was set against a noise
    model. The relative sampling noise of a standard-deviation estimate on a NESTED
    doubling is about 1/(2*sqrt(n_prev)), and requiring all thirteen rows to move
    by less than 5% at the 24 -> 48 transition has probability 2.981e-06. THE RULE
    WAS EFFECTIVELY UNREACHABLE AT 48 SEEDS BY CONSTRUCTION.

    THIS IS A DEFECT IN A PAIR OF COORDINATOR-SET PARAMETERS. IT IS NOT A DEFECT OF
    THE USER-CHOSEN GATE, NOT A PROPERTY OF ANY INSTRUMENT AND NOT A FACT ABOUT ANY
    CURVE, CLASS, ISOGENY, SAMPLER OR PRIME, IN EITHER DIRECTION, AT ANY SCALE. F4
    FIRING IS A PROTOCOL OUTCOME AND IS NEVER NEGATIVE EVIDENCE.

  corrected_reachability_table_superseding_two_entries_of_DEC_20260810_5aeeaa: >-
    RECORDED FIRST BECAUSE IT IS THE TABLE EVERY ARGUMENT BELOW USES, AND BECAUSE
    TWO OF ITS ENTRIES WERE PREVIOUSLY MISATTACHED BY ONE RUNG (V2 OBJ-3, F-V1-1;
    RE-DERIVED INDEPENDENTLY BY BOTH REVIEWERS AND AGREEING TO ALL QUOTED DIGITS).
    P(all thirteen rows move by less than 5% at the transition), under the declared
    Gaussian model for the standard-deviation estimator with independent rows:
    12 -> 24 = 4.245e-08; 24 -> 48 = 2.981e-06; 48 -> 96 = 1.644e-04;
    96 -> 192 = 5.789e-03; 192 -> 384 = 0.09465; 384 -> 768 = 0.51304;
    768 -> 1536 = 0.92980. DEC-20260810-5aeeaa stated "about 1.2e-4 at 24->48" and
    "about 0.006 at 48->96"; those are the 48 -> 96 and 96 -> 192 entries and are
    SUPERSEDED here. The true 24 -> 48 value is about forty times smaller than
    stated, so the error UNDERSTATED the decision's own case and no conclusion of
    that decision is overturned. The rows share curves and share seed-independent
    sum sets, so they are positively correlated and these are FLOORS on the pass
    probability; a non-Gaussian tail voids them.
    THE UNDERLYING NOISE SCALE 1/(2*sqrt(n_prev)) -- 0.14434, 0.10206, 0.07217,
    0.05103, 0.03608, 0.02552, 0.01804 for n_prev 12, 24, 48, 96, 192, 384, 768 --
    IS A LARGE-n APPROXIMATION AND IS OPTIMISTIC AT THE SMALL RUNGS. V1's direct
    Monte Carlo of the nested statistic gives 0.1873, 0.1156 and 0.0763 at n_prev
    12, 24 and 48, understated by 30%, 13% and 6%. The direction strengthens the
    reason for extending. Any successor quoting small-rung figures uses the
    simulated values.

  why_the_terminus_is_1536_DERIVED_FROM_A_REQUIREMENT_NOT_FROM_A_PASS_PROBABILITY: >-
    THIS IS THE REPAIR R3 DEMANDS AND IT IS THE HEART OF THIS AMENDMENT. Amendment
    v2 chose the terminal rung as the rung at which the rule being extended becomes
    overwhelmingly likely to pass (0.92980 per transition, 0.969 cumulative). A
    stopping point placed where a rule stops being able to fail is a bound at the
    edge of the rule's falsifying power, not a bound on looks. THE TERMINUS IS
    THEREFORE RE-DERIVED FROM A REQUIREMENT, AND THE REQUIREMENT IS STATED BEFORE
    ITS NUMBER.

    THE REQUIREMENT (TAIL RESOLUTION AT THE FROZEN COVERAGE). The gate's per-row
    acceptance interval is a central interval at coverage 259/260, so its endpoints
    ARE estimates of the 1/520 and 519/520 quantiles of the reference run's per-row
    sampling distribution. HEUR-INSTR-3 -- that a Gaussian tail is an adequate
    approximation there -- is the declared weak point of the whole construction, and
    amendment v1 declares its validation route to be the listed extremes at each
    row. A characterisation whose seed count yields fewer than about two expected
    observations beyond each endpoint has NO DIRECT EMPIRICAL INFORMATION about the
    quantile it reports, and its validation route is vacuous. THE REQUIREMENT
    ADOPTED: the terminal rung must give AT LEAST TWO EXPECTED PER-SEED
    OBSERVATIONS BEYOND EACH ENDPOINT, i.e. n/520 >= 2, i.e. n >= 1040. The ladder
    doubles from 12, so THE FIRST RUNG SATISFYING IT IS 1536, at which n/520 =
    2.954. That is the terminus, and it is a function of the FROZEN coverage 259/260
    and the FROZEN doubling schedule ALONE. No observed value enters it.

    THE ALTERNATIVE REQUIREMENT IS NAMED RATHER THAN HIDDEN, AND IT GIVES A
    DIFFERENT ANSWER. V2 OBJ-4's direct precision criterion -- relative standard
    error of the per-row sample sd, about 1/sqrt(2*(n-1)), below 5% -- gives
    n >= 201 and hence a terminus of 384. IT IS NECESSARY AND NOT SUFFICIENT, FOR A
    REASON THAT IS MEASURED AND NOT ARGUED: it certifies the PRECISION of the sd
    while the gate's endpoints are 1/520 QUANTILES, and V1 finding F-V1-2 shows a
    second, larger finite-n effect on the interval itself -- because both the mean
    and the sd are estimated, mean +- z*sd UNDER-COVERS out of sample, with realised
    two-sided tail probability 0.00627 at n = 48 against a nominal 0.003846 (1.63x),
    0.00404 at n = 768 (1.05x) and 0.00398 at n = 1536 (1.04x), exact factor
    t_(n-1)(519/520)*sqrt(1+1/n) against the frozen z = 2.8905115606917384,
    equal to 3.0727 at n = 48. A criterion on the sd alone does not see that, and it
    does not see the tail at all. At 384 seeds the expected count beyond an endpoint
    is 0.738 and the endpoints are pure extrapolation.

    THE HONEST CONCESSION, RECORDED BECAUSE THIS IS THE WEAKEST JOINT IN THE
    RESTATEMENT. Two candidate requirements were available and the one adopted is
    the one that reproduces the terminus amendment v2 already filed. That is stated
    plainly rather than presented as forced. Three things make it admissible and
    they are checkable rather than rhetorical: (i) the requirement is a function of
    the frozen coverage and the frozen schedule and cannot be fitted to any observed
    value; (ii) it is filed before the data it governs exists -- rungs 4 through 8
    have never been drawn; (iii) it is adopted TOGETHER WITH change E11 T2, which
    moves the construction stage's own pass probability DOWN, not up (see
    the_two_acceptance_regions_named_separately). A repair that makes the gate
    HARDER to satisfy is not a repair chosen to make an observed failure disappear.

    WHAT THE LADDER STILL CANNOT DO, WHICH IS V2'S METHOD-CEILING ATTACK AND IT
    STANDS. 2.954 expected observations beyond an endpoint is the first rung at
    which the data can speak to the quantile AT ALL; it is not enough to VALIDATE
    HEUR-INSTR-3 with comfort, and this amendment does not claim that it is. Rung 8
    makes the E9 D2 tail check non-vacuous. It does not make it powerful.

  the_two_acceptance_regions_named_separately: >-
    THIS IS REPAIR R2, AND CONDITION (a) OF DEC-20260810-5aeeaa IS RESTATED AS
    APPLYING TO ONE OF THEM ONLY. There are two acceptance regions in this protocol.

    REGION 1, THE DOWNSTREAM ARM TEST: per-row central coverage 259/260, per-row
    two-sided alpha 1/260, family-wise target 0.05, realised family-wise 0.048862,
    interval quantiles 1/520 and 519/520, and the mean +- z*sd estimator. THIS
    REGION IS UNTOUCHED BY THIS AMENDMENT AND BY v2 BEFORE IT, and condition (a) is
    TRUE OF IT AND ONLY OF IT.

    REGION 2, THE CONSTRUCTION STAGE'S OWN PASS RULE: E3, wired into falsification
    criterion F4, which decides whether an interval exists at all. THIS AMENDMENT
    MOVES IT AND THE MOVEMENT IS DISCLOSED WITH ITS NUMBER. Under the FROZEN v1
    ladder 12/24/48 the probability that the ladder ever produces an accepted
    interval is 3.0e-6. Under AMENDMENT v2 AS FILED -- extended ladder with a
    first-crossing accept rule over five new looks -- it is 0.969 analytic, and V1's
    bootstrap replay of the frozen schedule on the run's own seed-columns measures
    0.9482. Under THIS AMENDMENT -- extended ladder with a SINGLE evaluation at the
    pre-declared terminus -- it is 0.92980 analytic and 0.882 measured. So this
    amendment is ANTI-PERMISSIVE RELATIVE TO v2 AS FILED at the construction stage:
    P(terminal F4) rises from 0.031 analytic / 0.052 measured to 0.070 analytic /
    0.118 measured. It remains hugely permissive relative to the unreachable frozen
    ladder, and that is the disclosure v2 owed and did not make: the disclosed c4
    effect (+0.517% on half-widths, c4(48) = 0.9946954, c4(1536) = 0.9998372) is
    five orders of magnitude smaller than the effect that was not named.

    THE c4 EFFECT REMAINS DISCLOSED AND UNCORRECTED, AND THE OTHER FINITE-n EFFECT
    IS NOW DISCLOSED BESIDE IT. c4 is a function of n alone, cannot be tuned to any
    observed value, and correcting it would change the frozen estimator E1 after
    seeing data. The second effect (F-V1-2, above) runs the OTHER WAY and is larger
    at n = 48, so the NET finite-n direction of the estimator at the tested rungs is
    ANTI-permissive. Neither is corrected here. Both are now REPORTED at every rung
    by change E13 D3. Changing the estimator remains a USER decision, because the
    user selected this gate (DEC-20260810-a4bec4).

  condition_b_restated_as_the_verified_claim: >-
    THIS IS REPAIR R1. DEC-20260810-5aeeaa condition (b) said "THERE IS NO DATA TO
    FIT TOWARD ... no candidate arm value has been observed by anyone." THAT
    CONDITION IS FALSE ON THE COMMITTED RECORD AND IS WITHDRAWN. V2 located, and the
    archiving session independently re-verified, 39 committed Arm A0 per-row variance
    ratios on exactly this gate's grid in
    experiments/EXP-ICINV-4d33aa/runs/RUN-ICINV-40622f/cell-aggregates.json (p = 4001,
    T = 400, the thirteen frozen rows, seeds 11235813 / 20260807 / 20260808), and
    showed that the ceiling of the SUPERSEDED [1.3, 3.6] band is one of them:
    3.6 - 0.011900 = 3.5881 = primary|A0|seed=20260807|T=400|fb=18 =
    3.5881004922763506 exactly. A campaign that fitted a band to those numbers cannot
    say they are invisible.

    THE VERIFIED CLAIM THAT REPLACES IT, WHICH V2 CHECKED RATHER THAN ASSUMED:
    candidate values of the gated statistic ARE committed and visible, and NO CHOICE
    OF TERMINAL RUNG ADMITS OR EXCLUDES ANY OF THEM AT THE RUNGS MEASURED. All 39
    lie inside the fitted interval at rungs 1, 2 and 3; zero admission flips across
    the three measured rungs; minimum margin to the nearer endpoint 0.2444
    half-widths (fb = 5, seed 11235813), median about 0.71. Because the disclosed c4
    effect is strictly WIDENING, a longer ladder cannot exclude any of them by that
    route, and excluding the tightest would require the fb = 5 interval to contract
    by about 24% against a per-rung noise scale of at most 7.2% from rung 4 onward.
    The floor slack figure 1.320397 was NOT located in the committed artifacts and
    is recorded as UNCHECKED and not claimed.

  the_freeze_question_restated_with_the_conditions_repaired: >-
    THE QUESTION IS WHETHER EXTENDING A LADDER AFTER SEEING THAT IT FAILED IS THE
    SAME CLASS OF DEFECT AS WIDENING AN INTERVAL AFTER SEEING DATA. The answer
    remains conditional and the conditions are now these, replacing (a)-(d) of
    DEC-20260810-5aeeaa:

    (a') REGION 1 IS NOT MOVED. The coverage, the alpha, the family-wise target, the
    quantiles and the estimator are untouched. Adding seeds changes only how
    precisely the SAME population quantity is estimated.

    (b') CANDIDATE VALUES ARE VISIBLE AND ARE NOT MOVED ACROSS THE BOUNDARY BY THE
    LADDER CHOICE. Stated as the verified claim above, with its margins.

    (c') THIS FILE IS FILED BEFORE THE DATA IT GOVERNS EXISTS. Rungs 4 through 8
    have never been drawn. The rungs that HAVE been seen are not re-scored, not
    re-cut and not re-run.

    (d') THE LADDER IS DETERMINISTIC AND TERMINATES. Necessary, and NOT sufficient
    on its own -- V2 OBJ-5 is accepted in full.

    (e') THE TERMINUS IS DERIVED FROM A STATED REQUIREMENT, not from the pass
    probability of the rule being extended. See the derivation above.

    (f') THE RULE IS EVALUATED ONCE, AT THAT TERMINUS. This is change E11 T2 and it
    is what removes the optional-stopping surface rather than bounding it. Written
    with explicit quantifiers, the protocol is now: FOR ALL data, THERE EXISTS a
    pre-declared terminus n* = 1536, derived from the frozen coverage, at which the
    rule is evaluated. The witness is not selected after seeing an outcome.

    (g') REGION 2's MOVEMENT IS DISCLOSED WITH ITS NUMBER, and this amendment moves
    it in the ANTI-permissive direction relative to v2 as filed.

  what_would_have_been_forbidden_and_is_not_done: >-
    RELAXING THE 5% RULE TO FIT THE OBSERVED 0.2354 IS EXACTLY THE HULL-FITTING THIS
    REDESIGN EXISTS TO PREVENT AND IT IS NOT DONE. Neither is widening the interval,
    changing the coverage from 259/260, changing the family-wise target from 0.05,
    changing the estimator, applying a c4 or t-based correction to it after seeing
    data, dropping the noisiest rows from the family, accepting a rung that did not
    meet the rule, or computing a self-consistency verdict against a non-accepted
    interval. The 5% threshold appears in this file ONLY as a quotation of the frozen
    value.

  changes:
    - id: E10
      field: inputs.sr3_amendment_v3.characterisation_procedure -- change G3 E2, the SEED RUNGS
      kind: extension_of_a_precision_ladder_region_1_untouched
      decided_by: coordinator
      relation_to_v2: >-
        SUBSTANTIVELY IDENTICAL TO AMENDMENT v2 CHANGE E6, RE-ENACTED HERE BECAUSE
        v2 WAS NEVER APPROVED AND ITS CHANGES THEREFORE HAVE NO FORCE. The rung
        sizes and the seed blocks are the same integers.
      from: >-
        E2 as frozen by amendment v1: seed rungs 12, then 24, then 48. Rung 1 is the
        contract's twelve declared seeds; rung 2 adds 20260821 to 20260832
        inclusive; rung 3 adds 20260833 to 20260856 inclusive.
      to: |-
        THE LADDER CONTINUES BY PLAIN DOUBLING. Rungs 1, 2 and 3 are UNCHANGED and
        their seed sets are UNCHANGED. Five further rungs are declared, each ADDING
        to the previous rung's seed set so the ladder stays nested:

        rung 4 :   96 seeds, adding 20260857 to 20260904 inclusive   (48 new)
        rung 5 :  192 seeds, adding 20260905 to 20261000 inclusive   (96 new)
        rung 6 :  384 seeds, adding 20261001 to 20261192 inclusive  (192 new)
        rung 7 :  768 seeds, adding 20261193 to 20261576 inclusive  (384 new)
        rung 8 : 1536 seeds, adding 20261577 to 20262344 inclusive  (768 new)

        The seed blocks are contiguous integer ranges continuing the convention E2
        already established, so they are determined by the rung sizes and are not
        chosen. THE INTERVAL, ITS HALF-WIDTH AND THE EXTREME PER-SEED RATIOS ARE
        REPORTED AT EVERY RUNG REACHED, unchanged from E2.
      what_this_does_not_change: >-
        IT DOES NOT MOVE REGION 1. The coverage, the estimator, the quantiles, the
        thirteen density rows, the target count T = 400, the family scope limit of
        one prime per family and the 5% threshold are all untouched.

    - id: E11
      field: inputs.sr3_amendment_v3.characterisation_procedure -- change G3 E3, the TERMINATION and ACCEPTANCE rule
      kind: FROZEN_PARAMETER_CHANGE_relative_to_amendment_v2_anti_permissive_at_the_construction_stage
      decided_by: coordinator
      why_this_is_the_one_parameter_that_moves: >-
        BECAUSE A REQUIREMENT ON THE TERMINUS THAT DOES NOT BIND THE ACCEPTED RUNG
        IS VACUOUS, AND THAT IS WHAT FORCES A NEW AMENDMENT RATHER THAN A
        RESTATEMENT. Amendment v2 T2 accepts the FIRST rung meeting the 5% rule. Under
        the tail-resolution requirement adopted above, an interval accepted at rung 5
        (192 seeds) would carry 0.369 expected observations beyond each endpoint and
        would fail the very requirement that justifies the terminus. The
        justification and v2's acceptance rule are therefore inconsistent, and the
        acceptance rule is what gives way. Removing the first-crossing rule ALSO
        removes V2 OBJ-6's selection surface: the reported rung-8 interval,
        half-width, extremes and diagnostics are UNCONDITIONAL, computed and reported
        whatever E3 does, so there is no conditioning on a stability event in the
        reported quantity at all. A single pre-declared binary test remains, which is
        an ordinary falsification test and not optional stopping.
      to: |-
        T1. THE TERMINAL RUNG IS RUNG 8, 1536 SEEDS, DERIVED FROM THE TAIL-RESOLUTION
        REQUIREMENT n/520 >= 2 AT THE FROZEN COVERAGE 259/260. The ladder is never
        extended beyond it under this contract, by this Coordinator or any successor,
        and no further amendment to this contract may lengthen it. T1's self-binding
        is not the operative bar; T6 is.

        T2. THE LADDER RUNS TO RUNG 8 IN EVERY CASE AND THE 5% RULE IS EVALUATED
        ONCE, AT THE 768 -> 1536 TRANSITION. If it is met at every one of the
        thirteen rows, THE ACCEPTED INTERVAL IS RUNG 8's INTERVAL under the unchanged
        estimator. If it is not, T3 applies. THERE IS NO EARLY ACCEPTANCE AND NO
        FIRST-CROSSING RULE. This SUPERSEDES amendment v2 T2 and amendment v1 change
        G3 E3's "may stop at a rung" permission. Rungs 4 through 7 are MEASURED AND
        REPORTED IN FULL and gate nothing; stopping the ladder early at a rung that
        happens to meet the rule is OUTCOME SHOPPING under SR7 and makes the run
        INVALID.

        T3. THE TERMINAL OUTCOME IS DECLARED NOW, BEFORE THE DATA EXISTS, IN BOTH
        DIRECTIONS. If the 5% rule is not met at the 768 -> 1536 transition, then:
        F4 FIRES TERMINALLY; HEUR-INSTR-2 is not validated at any tested seed count
        up to 1536; the interval is NOT widened and the coverage is NOT changed;
        nothing is gated; the work STOPS; and the SR3 v3 GATE DESIGN GOES BACK TO
        THE USER, because the gate replacement was a USER decision recorded in
        DEC-20260810-a4bec4. THE NAMED SUCCESSORS, so that a terminal negative names
        forward guidance rather than ending in a shrug: (i) replace the rung-to-rung
        stability heuristic with a DIRECT PRECISION CRITERION on the estimator, about
        1/sqrt(2*(n-1)) below a declared value, a function of the seed count ALONE;
        and (ii) if the rung-8 tail diagnostics show the extremes are asymmetric or
        heavy relative to the fitted interval, replace the mean +- z*sd estimator
        itself, which is a gate redesign and a user decision. NEITHER SUCCESSOR IS
        ADOPTED HERE and neither may be adopted without its own versioned amendment
        filed before its data exists.

        T4. A BUDGET STOP IS NOT A TERMINAL OUTCOME AND IS NOT A PASS. If the frozen
        per-run budget (14400 s, 24 CPU-hours, 8 GB, 20 runs) or the E14 cost guard
        is reached before the terminal rung, the run reports the rungs it completed,
        records the remainder as not_measured, and that is a BUDGET EVENT under
        AGENTS.md rule 5 -- never a pass, never a terminal F4, and never negative
        evidence about any instrument.

        T5. EARLY TERMINATION ON A REFUTED PREMISE, CARRIED FORWARD FROM
        HEUR-INSTR-4's OWN FALSIFICATION CONDITION. If the E13 D1 ratio -- measured
        relative half-width change divided by the model noise scale for that
        transition -- stays materially above 1 as n grows across rungs 4 and beyond,
        HEUR-INSTR-4 is refuted, more seeds are the wrong repair, and T3 applies
        WITHOUT waiting for rung 8. That is a pre-declared stop on a REFUTED premise
        and not a stop on an outcome; it can only end the ladder without an accepted
        interval, never with one.

        T6. A TERMINAL F4 AT RUNG 8 IS DECLARED IN ADVANCE AS EVIDENCE AGAINST
        HEUR-INSTR-4, AND IT FORECLOSES ANY FURTHER EXTENSION AS A MATTER OF
        EVIDENCE RATHER THAN BY SELF-BINDING. Under the declared model a terminal F4
        at rung 8 has probability 0.070 (analytic) or 0.118 (V1's bootstrap of the
        run's own data); under the competing explanation -- a per-row distribution
        whose rung-to-rung changes do not shrink -- it is likely. Observing it is
        therefore evidence for the competing explanation and against the sole
        justification for extending, so a successor Coordinator asked to extend
        again must first explain why a refuted premise licenses more of the same.
        THE EXTENSION ALSO CONVERTS F4 FROM A TEST WITH NO POWER INTO A TEST WITH
        POWER: under the frozen 12/24/48 ladder F4 fired with probability ~1 under
        BOTH explanations and discriminated nothing, which is exactly why its firing
        is refused as evidence; at rung 8 its outcome discriminates them. That, and
        not the reachability table, is the strongest reason to extend.

    - id: E12
      field: inputs.sr3_amendment_v3.characterisation_procedure -- the p = 6007 FAMILY
      kind: clarification_of_an_existing_rule_no_new_parameter
      decided_by: coordinator
      relation_to_v2: substantively identical to amendment v2 change E8, re-enacted.
      to: >-
        THE FAMILY ORDER AND THE FAMILY SCOPE LIMIT ARE UNCHANGED. p = 4001 is
        characterised first and p = 6007 second; each prime's thirteen rows is ONE
        family; the extended ladder, the single terminal evaluation and the
        unchanged 5% rule apply identically and independently to each; and nothing
        is pooled across primes. On acceptance at p = 4001 the characterisation
        proceeds to p = 6007 under the same ladder and the same terminal rung. THE
        MULTI-PRIME FAMILY IS STILL NOT CORRECTED: the G2 family_scope_limit stands
        verbatim, so requiring two primes to pass jointly carries a realised error
        of 1 - (1 - 0.048862)^2 = 0.095336, derived by exact arithmetic and not
        measured, and an across-prime family still requires its own versioned
        amendment to the contract that owns that gate. THE p = 6007 FAMILY HAS NEVER
        BEEN MEASURED AT ANY SEED COUNT AND ITS COST IS UNKNOWN; see E14.

    - id: E13
      field: reported metrics of the SR3 v3 characterisation -- DIAGNOSTICS THAT GATE NOTHING
      kind: addition_declared_because_of_what_was_found_which_is_why_it_is_amended_and_not_slipped_in
      decided_by: coordinator
      relation_to_v2: >-
        D1 and D2 are amendment v2 change E9 re-enacted. D3 and D4 are NEW and come
        from V1 finding F-V1-2 and V1's stated limitations respectively.
      to: |-
        D1. AT EVERY RUNG THE RUN REPORTS, PER ROW, THE MODEL-FREE NOISE SCALE
        1/(2*sqrt(n_prev)) FOR THAT TRANSITION, alongside the measured relative
        half-width change, and the ratio of the two. THIS GATES NOTHING except
        through T5, which can only stop the ladder without an interval.

        D2. AT EVERY RUNG THE RUN REPORTS, PER ROW, THE SAMPLE SKEWNESS AND EXCESS
        KURTOSIS OF THE PER-SEED VARIANCE RATIOS AND THE COUNT OF PER-SEED RATIOS
        FALLING OUTSIDE THAT ROW'S OWN FITTED INTERVAL, SPLIT BY SIDE. THIS GATES
        NOTHING. THE EXPECTED COUNT IS REPORTED AS THE SELF-NORMALISED ONE AND NOT
        AS n_seeds*13/260: the endpoints are estimated from the same points, so
        n_seeds*13/260 treats them as known constants and is wrong. At n = 48 the
        correct Gaussian-null expectation measured by V1 is 1.57 total (0.784 upper,
        0.789 lower) against the 2.4 previously quoted, so the two observed
        exceedances sat ABOVE expectation rather than below it. The run reports the
        realised in-sample rate and states the expectation model it used.

        D3. AT EVERY RUNG THE RUN REPORTS THE FINITE-n CALIBRATION FACTORS OF THE
        FROZEN ESTIMATOR, WHICH ARE FUNCTIONS OF n ALONE AND CANNOT BE FITTED TO ANY
        DATA: the c4(n) bias factor of the sample sd, and the out-of-sample
        prediction factor t_(n-1)(519/520)*sqrt(1+1/n) beside the frozen
        z = 2.8905115606917384, with their ratio. NEITHER IS APPLIED. Reporting them
        is the disclosure the two reviews jointly established was missing; correcting
        the estimator after seeing data is forbidden and is a USER decision.

        D4. AT EVERY RUNG THE RUN REPORTS THE AGGREGATE (13-ROW MEAN) SAMPLE
        SKEWNESS AND ITS CORRELATION-AWARE CRITICAL VALUE AT THAT n, together with
        the per-row coefficient of variation and the value 2*CV that the contract's
        own generative model predicts for the skewness of a variance-ratio statistic.
        THIS GATES NOTHING. It exists because V1's aggregate test at n = 48 has
        detection floor about skew 0.30 (power 0.709 there, 0.948 at 0.45) and CANNOT
        SPEAK BELOW IT; at rung 8 that floor falls by about sqrt(32), so the ladder
        closes its own residual uncertainty and a reader can see that it did.
      why_this_needs_an_amendment_at_all: >-
        BECAUSE SR7 SAYS THE SET OF REPORTED METRICS MAY NOT DEPEND ON WHAT WAS
        FOUND, AND THIS ADDITION DOES DEPEND ON WHAT WAS FOUND. It is declared as a
        versioned change before the data it governs exists. It is admissible because
        it moves no acceptance region, gates nothing (except T5, which can only
        stop), and is computed at every rung for every row regardless of outcome.
      what_is_NOT_done_to_the_existing_run: >-
        NO DIAGNOSTIC IS RETROFITTED INTO RUN-INSTR-36c8cf-phaseA-v2-57ca9a. That
        run's artifacts are immutable. Arithmetic over its already-committed per-seed
        ratios lives in DEC-20260810-5aeeaa, in the two review reports of
        TASK-20260810-c98659, and in DEC-20260810-95a741, labelled as analysis and
        never as a run metric.

    - id: E14
      field: execution preconditions and cost accounting for the extended ladder
      kind: addition_no_acceptance_region_moves
      decided_by: coordinator
      to: |-
        C1. LOAD PRECONDITION, DECLARED BECAUSE THE COST MODEL IS AN EXTRAPOLATION
        FROM ONE 128.234 s RUN ON AN OVERSUBSCRIBED HOST (load average
        42.00 / 28.71 / 21.59 on 14 cores at start). The run RECORDS the 1-, 5- and
        15-minute load averages and the core count in load-observations.json at
        start and at every rung boundary. IT DOES NOT START if the 1-minute load
        average exceeds 28 on 14 cores (twice the core count). Declining to start on
        that ground is a DISPATCH DEFERRAL: it consumes no run identifier, produces
        no artifacts, is not a budget event, is not a result, and is never negative
        evidence about anything.

        C2. MEASURED COST IS REPORTED, NOT EXTRAPOLATED. The run reports measured
        wall seconds for the fixed sum-set phase and measured marginal seconds per
        seed, PER FAMILY, and reports memory beside time. The standing estimate is
        about 81 s fixed and about 1 s per seed at p = 4001, giving about 1.6e3 s to
        rung 8 for that family alone against a 14400 s per-run budget; THAT IS AN
        ESTIMATE AND NOT A MEASUREMENT, and the p = 6007 family has never been
        measured at any seed count, so the honest statement of expected cost is
        "about 1.6e3 s for p = 4001 plus an unmeasured p = 6007 family".

        C3. COST GUARD. If, at the completion of rung 4, the measured marginal
        per-seed cost implies that completing rung 8 for the family in progress would
        consume more than 60% of the frozen 14400 s per-run budget, the run STOPS at
        the last completed rung, records the remainder as not_measured, and that is a
        BUDGET EVENT under T4 -- never a pass, never a terminal F4, never negative
        evidence. The guard is declared before the data and is evaluated once, at
        rung 4, on a quantity that cannot be chosen.

  declared_heuristic_HEUR_INSTR_4: >-
    NUMBERED AND STATED AS A HEURISTIC, NOT ASSUMED, BECAUSE THE EXTENSION RESTS ON
    IT: the rung-to-rung variation in the per-row interval half-width observed at
    rungs 1, 2 and 3 is ORDINARY SAMPLING NOISE IN A STANDARD-DEVIATION ESTIMATE,
    whose relative scale on a nested doubling is about 1/(2*sqrt(n_prev)), and it
    therefore shrinks as the ladder lengthens.
    ITS FALSIFICATION CONDITION: if the observed per-row relative changes at rungs 4
    and beyond do not shrink at the predicted rate -- specifically if the E13 D1
    ratio stays materially above 1 as n grows -- HEUR-INSTR-4 is refuted, more seeds
    are the wrong repair, and T5/T3 apply.
    ITS VALIDATION STATUS, UPDATED BY THE TWO REVIEWS AND STATED WITH ITS LIMITS:
    V1 tested the competing explanation directly and found FOR HEUR-INSTR-4. Replaying
    this frozen schedule and the UNCHANGED E3 rule on 5000 bootstrap replicates of the
    run's own seed-columns gives P(stabilise by 1536) = 0.9482; against a MATCHED
    SYMMETRIC null holding each row's mean, variance AND kurtosis fixed while forcing
    skew to zero it is 0.9472, a difference of +0.0010 against a Monte-Carlo se of at
    most 0.0100. REMOVING SKEW ENTIRELY CHANGES THE GATE'S BEHAVIOUR BY NOTHING. The
    ~1.8 pp gap to a Gaussian reference (0.9656) is excess KURTOSIS, worth about two
    points of stabilisation probability at the terminal rung. HEUR-INSTR-4 IS NOT
    THEREBY ESTABLISHED: this is one unreplicated run at one prime, the bootstrap
    cannot see a tail beyond the 1-in-48 quantile, and systematic skew below about
    0.30 is not excluded. Rungs 4 through 8 are where it is actually tested, and T5
    and T6 declare in advance what a failure means.

  the_competing_explanation_and_what_the_reviews_did_to_it: >-
    RECORDED AT FULL STRENGTH BECAUSE IT WAS THE REASON v2 WAS UNAPPROVED, AND
    RECORDED WITH WHAT IS NOW KNOWN. The alternative is that the per-row sampling
    distribution of the variance-ratio statistic is RIGHT-SKEWED OR HEAVY-TAILED, in
    which case HEUR-INSTR-3 is inadequate at coverage 259/260, mean +- z*sd is the
    wrong estimator, and no number of seeds fixes the gate.
    WHAT V1 ESTABLISHED AGAINST IT, ON THE COMMITTED DATA. (1) The statistic is a
    RATIO OF QUADRATIC FORMS and has no reason to be symmetric: under the contract's
    own generative model its skewness is 2*CV exactly, which at the measured per-row
    CV of 0.083-0.148 predicts per-row skew 0.166-0.296, mean 0.2108. The observed
    mean per-row skew is 0.1811, BELOW the model's own prediction. A GAUSSIAN IS THE
    WRONG-SHAPE NULL OBJECT FOR THIS STATISTIC. (2) The two upper-side exceedances at
    rung 3 are confirmed as fact (fb = 11 max 3.3357628 against upper endpoint
    3.2613729, fb = 22 max 4.8231 against 4.5123, different argmax seeds, genuinely
    two events) and EMPTY AS EVIDENCE: P(at least 2, all upper) is 0.099 against a
    Gaussian null and 0.365 against the shape-correct null. (3) The tail does NOT
    keep extending: fb = 22's maximum lives in rung 2, and rung 3's 24 fresh seeds
    produced no new upper extreme in that row at all; dropping its single largest
    point takes its skew from 1.079 to 0.406 and its excess kurtosis from 2.296 to
    -0.054. ONE OUTLYING SEED IN 624 OBSERVATIONS IS NOT A DISTRIBUTIONAL SHAPE.
    (4) "Both exceeding rows are among the rows that fail the stability rule" carries
    no information: 8 of 13 rows fail, so P = 0.359, and the largest rung-3
    instability is fb = 7 at 0.2354 whose excess kurtosis is +0.017.
    WHAT REMAINS UNEXCLUDED AND IS NOT REPORTED AS ABSENT: systematic skew below
    about 0.30, and any pathology beyond the 1-in-48 quantile. E13 D2 and D4 at rungs
    4 through 8 are where those close.

  unchanged_and_still_frozen:
