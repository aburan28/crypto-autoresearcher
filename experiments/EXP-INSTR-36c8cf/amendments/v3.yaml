  filename_convention_note: >-
    THE FILENAME IS v3.yaml BECAUSE THIS IS THE THIRD AMENDMENT TO THIS CONTRACT.
    version_from IS 2 AND NOT 3 BECAUSE AMENDMENT v2 WAS NEVER APPROVED: the
    contract has stood at version 2 (specification.yaml version 1 as amended by
    amendments/v1.yaml) continuously, so this amendment starts from the same place
    v2 did and produces version 3. amendment_ordinal, version_from and version_to
    are the authority on which is which. The convention is amendments/v1.yaml's and
    is restated because the sibling file experiments/EXP-ICINV-4d33aa/amendments/
    v2.yaml names itself after its version_to.
