  supersedes_for_future_execution:
    - experiments/EXP-INSTR-36c8cf/amendments/v3.yaml

  purpose: >-
    Restore one parseable and unambiguous future execution contract after the
    PR 331 conflict resolution combined two materially different v3 lineages
    into an unparsable file without adjudicating their stopping semantics. This
    amendment preserves all three v3 byte sequences as immutable provenance,
    reconstructs from the last unambiguous effective version 2, and selects one
    terminal-only rule while retaining the other lineage's useful diagnostics
    as unconditional reports. It authorizes no run until an exact snapshot has
    received fresh independent review and a successor Coordinator decision.

  effective_contract_definition:
    base:
      specification: experiments/EXP-INSTR-36c8cf/specification.yaml
      approved_amendment: experiments/EXP-INSTR-36c8cf/amendments/v1.yaml
      resulting_version_before_v3_lineages: 2
    reconciliation: experiments/EXP-INSTR-36c8cf/amendments/v4.yaml
    executable_interpretation: >-
      The future version-4 contract is the specification as amended by v1 and
      this complete reconciliation. Amendment v2 and every v3 lineage remain
      historical inputs and are not independently executable. When this file
      says a version-2 field is unchanged, the specification-plus-v1 value is
      authoritative; no text is inherited from the malformed merged v3.

  immutable_lineage:
    terminal_only_parent:
      commit: 1a8d7364309da9568b50a97d17ff3b4c685a9c9f
      path: experiments/EXP-INSTR-36c8cf/amendments/v3.yaml
      sha256: 03b06727cf2c5db69b8068d796250026e8f36e97490a001c9d4454938591a560
      size_bytes: 47399
      strict_yaml_parse: pass
      decision: DEC-20260810-95a741
      distinguishing_semantic: terminal_only_E3_at_768_to_1536
    diagnostic_rich_parent:
      commit: df8b396ce0543370f240b88ec6245e073c056247
      path: experiments/EXP-INSTR-36c8cf/amendments/v3.yaml
      sha256: 8d4fbc76d15040de9be73ce52a1d49d28380a443992768035da0843418d96353
      size_bytes: 23598
      strict_yaml_parse: pass
      decision: DEC-20260810-00ee9d
      distinguishing_semantic: first_pass_acceptance_plus_LOO_and_fresh_null_diagnostics
    conflict_resolution:
      commit: ff8cb8fd54ed914df1ab3af967f770e7a336dfc7
      merged_to_main_by: daaba6d16e6a40d9041f1da3910f10cee933c4cb
      path: experiments/EXP-INSTR-36c8cf/amendments/v3.yaml
      git_blob: 521793b82cb5f4db048a2ccbcd1312f4e7acdd1e
      sha256: 0926a2f84d4959029a9ed61ad20e744d093b7664853cc628053449b22d03b876
      size_bytes: 47975
      strict_yaml_parse: fail
      parse_failure: >-
        PyYAML ParserError: while parsing the block mapping beginning at line
        1, expected a block end but found a sequence entry at line 690 column
        1, beginning with DEC-20260810-95a741.
      disposition: immutable_non_executable_history
    preservation_rule: >-
      None of these paths, commits, blobs, decisions, or historical run records
      is edited, relabelled, rescored, or made authoritative by implication.

  decisions_reconciled:
    - DEC-20260810-95a741
    - DEC-20260810-00ee9d
  decision_relationship: >-
    Both decisions remain immutable and are cited for their distinct reviewed
    contributions. Neither is silently treated as superseding the other in
    full. A successor decision may approve only the exact snapshot of this v4.

  reconciliation_matrix:
    contract_source:
      terminal_only_parent: complete v3 proposal from effective version 2
      diagnostic_rich_parent: narrower v3 proposal from effective version 2
      selected: reconstruct_from_effective_version_2_plus_explicit_v4_changes
      reason: >-
        The merged v3 cannot be parsed, and wholesale adoption of either parent
        would suppress the other parent's reviewed contribution.
    amendment_status:
      terminal_only_parent: approved_by_DEC_20260810_95a741
      diagnostic_rich_parent: approved_by_DEC_20260810_00ee9d
      selected: pending_fresh_snapshot_review_and_successor_decision
      reason: >-
        Parent approvals do not bind this new reconciliation or cure the merged
        file. v4 starts review_required with null approval fields.
    visible_candidate_values:
      terminal_only_parent: >-
        Candidate Arm A0 values exist; no rung choice moved them across the
        observed boundary, with the disputed sampler caveat preserved.
      diagnostic_rich_parent: >-
        Corrects the false absolute claim that no candidate value had been
        observed, while treating the old targets_uniform values as unreliable.
      selected: diagnostic_rich_correction_with_terminal_parent_caveats
      binding_text: >-
        Committed same-row Arm A0 values exist and can anchor a reader. They
        were produced under targets_uniform, which is prohibited for new
        measurement arms, and H-ICINV-6c7920 remains unresolved. They are not
        used to choose a rung, threshold, estimator, interval, or outcome.
    seed_ladder:
      terminal_only_parent: [12, 24, 48, 96, 192, 384, 768, 1536]
      diagnostic_rich_parent: [12, 24, 48, 96, 192, 384, 768, 1536]
      selected: [12, 24, 48, 96, 192, 384, 768, 1536]
      reason: both parents agree and the extra-rung data do not yet exist
    acceptance_and_stopping:
      terminal_only_parent: evaluate_E3_once_at_768_to_1536
      diagnostic_rich_parent: first_rung_meeting_E3_may_accept
      selected: evaluate_E3_once_at_768_to_1536
      rejected:
        - first_crossing_acceptance
        - first_pass_acceptance
        - accepting_or_selecting_a_rung_from_diagnostics
        - extending_beyond_1536
      reason: >-
        A tail-resolution justification for n=1536 is inconsistent with
        accepting an earlier rung, and first crossing adds an avoidable
        optional-stopping surface.
    p_6007_family:
      terminal_only_parent: mandatory_second_family_after_p4001_acceptance
      diagnostic_rich_parent: inherited_version_2_obligation
      selected: mandatory_second_family_after_p4001_acceptance
      reason: >-
        The families remain separate and unpooled. p=6007 has not been measured
        and its unmeasured cost is explicit.
    diagnostics:
      terminal_only_parent:
        - noise_scale_and_relative_half_width_ratio
        - per_row_skew_kurtosis_and_split_tail_counts
        - finite_n_c4_and_prediction_factor_disclosure
        - aggregate_skew_and_correlation_aware_detection_floor
        - measured_cost_and_load
      diagnostic_rich_parent:
        - leave_one_out_extreme_score
        - seeded_fresh_gaussian_null_calibration
        - accepted_interval_absolute_half_width
      selected: union_of_both_parent_diagnostic_sets
      authority: unconditional_reports_only
      rejected:
        - diagnostic_triggered_acceptance
        - diagnostic_triggered_early_stop
        - diagnostic_selected_rung
        - diagnostic_interval_widening
        - diagnostic_threshold_or_estimator_change
      reason: >-
        The additional diagnostics expose method ceilings and tail behaviour,
        but they are not a second decision rule. Any concerning diagnostic is
        reported and reserved for independent review after the terminal
        protocol outcome.
    heur_instr_4_d1_early_stop:
      terminal_only_parent: >-
        E11 T5 applies T3 without acceptance and stops the ladder before rung 8
        when the D1 noise-scale ratio stays materially above 1.
      diagnostic_rich_parent: >-
        Retains the version-2 HEUR-INSTR-4 falsification text carrying the same
        D1-triggered early stop.
      selected: rejected_no_data_dependent_early_stop
      reason: >-
        A D1-triggered stop is a diagnostic branching to a terminal disposition,
        which contradicts diagnostics_branching_authority none and the fixed
        768 to 1536 terminus. The D1 ratio remains an unconditional report and a
        material ratio above 1 is a review finding, never a stop.
    cost_and_load_controls:
      terminal_only_parent: explicit_load_precondition_measured_cost_and_rung4_guard
      diagnostic_rich_parent: inherited_budget_boundary
      selected: terminal_parent_controls_with_budget_stop_classified_infrastructure
    historical_runs:
      both_parents: immutable_no_rescore
      selected: immutable_no_rescore
    research_authority:
      both_parents: future_instrument_contract_only
      selected: zero_runs_until_fresh_v4_approval_and_separate_dispatch

  frozen_changes:
    seed_ladder:
      rungs:
        - {rung: 1, total_seeds: 12, source: version_2_unchanged}
        - {rung: 2, total_seeds: 24, added_seed_range: [20260821, 20260832]}
        - {rung: 3, total_seeds: 48, added_seed_range: [20260833, 20260856]}
        - {rung: 4, total_seeds: 96, added_seed_range: [20260857, 20260904]}
        - {rung: 5, total_seeds: 192, added_seed_range: [20260905, 20261000]}
        - {rung: 6, total_seeds: 384, added_seed_range: [20261001, 20261192]}
        - {rung: 7, total_seeds: 768, added_seed_range: [20261193, 20261576]}
        - {rung: 8, total_seeds: 1536, added_seed_range: [20261577, 20262344]}
      nesting: cumulative
      extension_beyond_rung_8: prohibited
      terminus_derivation: >-
        The frozen central coverage is 259/260, whose endpoints are the 1/520
        and 519/520 quantiles. Requiring at least two expected per-seed
        observations beyond each endpoint gives n/520 >= 2, hence n >= 1040;
        1536 is the first rung on the frozen doubling ladder that satisfies it.

    acceptance_rule:
      threshold: five_percent_relative_rung_to_rung_half_width_stability
      rows_required: all_13_density_rows
      evaluation_count_per_family: 1
      evaluation_transition: 768_to_1536
      accepted_interval: rung_8_interval_only
      early_acceptance: prohibited
      first_crossing: prohibited
      no_widening: true
      estimator_change: prohibited
      coverage_change: prohibited
      row_dropping: prohibited
      terminal_pass: >-
        At every one of the thirteen rows, the unchanged E3 relative
        half-width-stability statistic is at most 5 percent on the 768 to 1536
        transition. The accepted interval is the unconditional rung-8 interval.
      terminal_fail: >-
        If any row fails, F4 fires terminally for that family; HEUR-INSTR-2 is
        not validated up to 1536; no interval is admitted or widened; no arm is
        gated; and the design returns to the user through a new amendment.

    family_state_machine:
      premise_failure_definition: >-
        A premise failure is a contract-integrity failure only: a source,
        contract, seed-range, grid, estimator, coverage, or ladder value that
        does not match its frozen recorded value, or a required artifact that
        cannot be produced. It is never data-dependent. No measured or
        diagnostic quantity, including the D1 noise-scale ratio and the retired
        HEUR-INSTR-4 / E11 T5 early stop, can raise it.
      states:
        - state: preflight
          requirements:
            - exact_source_and_contract_hashes_recorded
            - host_load_recorded_and_within_predeclared_start_limit
            - frozen_budget_available
          on_failure: dispatch_deferral_or_failed_infrastructure_no_result
        - state: p4001_full_ladder
          action: measure_and_report_every_rung_1_through_8
          diagnostics_branching_authority: none
          on_premise_failure: invalid_no_acceptance
          on_budget_stop: failed_infrastructure_no_acceptance
        - state: p4001_terminal_E3
          action: evaluate_once_at_768_to_1536
          on_fail: terminal_F4_stop_no_p6007_no_gate
          on_pass: continue_to_p6007_full_ladder
        - state: p6007_full_ladder
          action: measure_and_report_every_rung_1_through_8_independently
          pooling_with_p4001: prohibited
          diagnostics_branching_authority: none
          on_premise_failure: invalid_no_acceptance
          on_budget_stop: failed_infrastructure_no_acceptance
        - state: p6007_terminal_E3
          action: evaluate_once_at_768_to_1536
          on_fail: terminal_F4_no_gate
          on_pass: both_family_intervals_available_for_separate_downstream_controls
      quantifier_order: >-
        FOR EVERY dataset generated under the frozen ladder, the two families
        and their terminal rung are fixed before observation. There exists no
        data-dependent rung witness. Diagnostics are emitted for every reached
        rung and have no transition into an accepting state.

    unconditional_diagnostics:
      every_rung_every_row:
        - interval_and_absolute_half_width
        - relative_half_width_change
        - model_noise_scale_1_over_2_sqrt_n_previous
        - ratio_of_change_to_model_noise_scale
        - sample_skewness
        - sample_excess_kurtosis
        - fitted_interval_tail_count_split_by_side
        - c4_sample_sd_bias_factor_not_applied
        - t_prediction_factor_and_ratio_to_frozen_z_not_applied
        - per_row_coefficient_of_variation_and_twice_CV_prediction
        - leave_one_out_score_of_most_extreme_seed
        - in_sample_score_of_same_seed
      every_rung_family_aggregate:
        - thirteen_row_mean_skewness
        - correlation_aware_critical_value_and_detection_floor
      fresh_null_calibration:
        distribution: iid_standard_normal
        sample_size: current_rung_seed_count
        trials_minimum: 20000
        outputs: [median, p90, p99, maximum]
        seed_recording: mandatory
        reuse_of_n48_values_at_later_rungs: prohibited
      authority: >-
        All diagnostics are reported regardless of E3 and gate nothing. They
        cannot accept, reject, stop, select a rung, widen an interval, change
        coverage, change the estimator, or alter the terminal verdict. A method
        concern becomes a review finding and possible future amendment only.

    family_and_error_boundary:
      p4001_and_p6007_separate: true
      thirteen_rows_per_family: true
      pooling_across_primes: prohibited
      downstream_region_coverage: 259/260
      downstream_per_row_two_sided_alpha: 1/260
      downstream_single_family_realised_target: 0.048862
      two_family_joint_error_not_corrected: 0.095336
      joint_family_claim_prohibited_without_new_amendment: true

    cost_and_resource_contract:
      per_run_wall_clock_seconds: 14400
      total_cpu_hours: 24
      maximum_memory_gb: 8
      maximum_runs: 20
      start_load_limit:
        one_minute_load_max: 28
        reference_cores: 14
        exceeded_disposition: defer_without_run_id_or_artifacts
      measured_cost_outputs:
        - fixed_sum_set_wall_seconds_per_family
        - marginal_wall_seconds_per_seed_per_family
        - memory_beside_time
        - load_at_start_and_every_rung_boundary
      rung_4_guard: >-
        At completion of rung 4, if measured marginal per-seed cost predicts
        that completing rung 8 for the family in progress would consume more
        than 60 percent of the per-run wall-clock budget, stop with retained
        partial artifacts and failed_infrastructure. This is never F4, a pass,
        or mathematical evidence.

  unchanged_and_still_binding:
    - specification objective, inputs, controls, metrics, and claim ceiling except where v1 or this v4 explicitly changes them
    - amendment-v1 thirteen-row density grid and T=400
    - frozen estimator and z value 2.8905115606917384
    - 5 percent E3 stability threshold
    - downstream 259/260 central coverage and no-widening rule
    - source pinning and baseline reproduction obligations
    - NULL-C admissibility boundaries
    - CONFLICT-1 adjudication and sampler-control restatement
    - p4001 then p6007 family order and no cross-prime pooling
    - every stopping, invalidation, artifact, and reporting obligation not explicitly reconciled above
    - SR7 no outcome shopping
    - no retrospective change to either historical RUN-INSTR record

  invalidation_rules_added:
    - accepting or selecting any rung before rung 8
    - evaluating E3 anywhere other than the 768 to 1536 transition for acceptance
    - allowing any diagnostic to branch to pass, fail, acceptance, early stop, widening, or rung selection
    - omitting any reached rung or any unconditional diagnostic after starting a family, except a recorded infrastructure stop or a recorded premise failure as defined in frozen_changes.family_state_machine.premise_failure_definition
    - stopping the ladder before rung 8 on any measured or diagnostic quantity, including the retired HEUR-INSTR-4 / E11 T5 D1 noise-scale early stop
    - pooling p4001 and p6007 or treating their intervals as one corrected family
    - editing or parsing around the malformed v3 instead of using this standalone reconciliation
    - changing the estimator, z value, coverage, threshold, rows, seeds, or terminus without a new prior amendment

  historical_run_boundary:
    immutable_runs:
      - RUN-INSTR-36c8cf-phaseA-2a5cd1
      - RUN-INSTR-36c8cf-phaseA-v2-57ca9a
    rescored: false
    reclassified: false
    retrofitted_diagnostics: false
    evidence_changed: false

  authority_boundary:
    amendment_approved: false
    authorized_experiment_runs: 0
    rerun_authorized: false
    execution_authorized: false
    experiment_status_transition: none
    hypothesis_status_transition: none
    goal_status_transition: none
    batch_status_transition: none
    goal_edit: none
    scientific_interpretation: none
    knowledge_promotion: none
    ecdlp_attack_or_speedup_claim: false
    breakthrough_claim: false
    downstream_jinv_phase_b_unblocked: false

  review_requirements:
    exact_snapshot_required: true
    independent_role: red-team
    requested_policy: review-adversarial
    reasoning_effort: xhigh
    independent_session_required: true
    verdicts: [PASS, REVISE, DISSENT]
    material_ambiguity_requires: REVISE
    approval_requires_unqualified_PASS: true

  next_action_if_approved: >-
    Return to the no-compute EXP-JINV-bd141d Phase-B actual-geometry control
    contract: freeze planted-signal detection floor and whole-thirteen-row
    matched-null false-positive behaviour before any JINV execution. N18,
    C-TRANSPORT and the second-matched-N claim ceiling remain separate blockers.

