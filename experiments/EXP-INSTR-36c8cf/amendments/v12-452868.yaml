  reason: >-
    Additively repair only the terminal v11 public-boundary findings
    O-INSTR-V11-1, O-INSTR-V11-2, and O-INSTR-V11-3. Require exact built-in
    strategy-container admission before any hook-bearing operation, detach one
    new tuple snapshot with no caller-container reread, deeply normalize exact
    FaultFixture, ResolutionFailure, and diagnostic values into immutable
    internal records, and contain nested merge failure locally in the collector
    before the sole global adjudication. Preserve the complete v11/v10 payload,
    import-free inference projection, custody checks, and inherited matrices.

  changes:
    - id: V12-EXACT-STRATEGY-ADMISSION-AND-ONE-SNAPSHOT
      scope: control_plane_only
      description: >-
        Check type(strategies) is list or type(strategies) is tuple before bool,
        len, traversal, indexing, membership, equality, formatting, repr, str,
        or mutation hooks. Reject subclasses as ECOMP_LATEST_ONLY with zero hook
        calls, then traverse an admitted exact built-in exactly once into one new
        tuple and validate and use only that tuple.
    - id: V12-DEEP-EXACT-PUBLIC-FIXTURE-DETACHMENT
      scope: control_plane_only
      description: >-
        Check exact FaultFixture and ResolutionFailure types before field reads,
        capture each allowed field once, admit only exact list or tuple diagnostic
        containers and exact dict rows, validate exact scalar types, allowed keys,
        priority, and duplicates, and retain only frozen internal snapshots.
        Rejected subclasses execute no attribute, traversal, formatting, or
        mutation hook.
    - id: V12-LOCAL-NESTED-MERGE-CONTAINMENT
      scope: control_plane_only
      description: >-
        Make DiagnosticCollector.merge_nested consume only a detached immutable
        failure snapshot. A separate local capture_nested boundary converts an
        exception raised from merge_nested while a ResolutionFailure branch is
        already active into a compiled typed diagnostic and continues to exactly
        one final_adjudication call.
    - id: V12-EXHAUSTIVE-PUBLIC-EQUIVALENCE-MANIFEST
      scope: deterministic_static_verification
      description: >-
        Materialize expected-versus-observed strategy, fixture, failure,
        diagnostics-container, diagnostics-row, hook, TOCTOU, sys.modules,
        second-traversal, nested-merge, and multi-fault composition cells. Trace
        every v12-owned resolved field while preserving the exact 1,363 inherited
        source fields and 1,363 inherited origin rows under their frozen digests.

