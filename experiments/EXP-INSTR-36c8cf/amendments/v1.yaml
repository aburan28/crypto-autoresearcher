    - >-
      Every invalidation rule, including the prohibition on editing
      harness/exp_icinv.py, the prohibition on planting into synthetic data, the
      prohibition on using NULL-C for any within-class contrast in either
      direction, the prohibition on presenting a not_measured cell as a pass, and
