    - >-
      The A4 no-transcription rule and the A6 source-provenance precondition: every
      reference value read from its record at run time and bound by a
      source_sha256, every executed source file hash-pinned, and
      tools/check_run_source_provenance.py --strict passing.
    - >-
      The budget block in full (14400 s per run, 24 CPU-hours, 8 GB, 20 runs), the
      twelve declared seeds for SR1, the four independent control geometries, and
      the requirement that results are never pooled across geometries.
    - >-
      claim_tier toy. No attack, no exponent, no speedup, sota_delta zero on every
      axis.

