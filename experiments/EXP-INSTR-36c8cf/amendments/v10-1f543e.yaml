  reason: >-
    Additively repair O-INSTR-V9-1 without modifying v9 or any earlier byte:
    construct one immutable-compiled-order diagnostic collector as the first
    public resolve object, normalize every later fallible stage through typed
    capture, continue semantically independent stages, merge nested diagnostic
    lists, and permit exactly one final compiled adjudication after collection.
    This is a static control-plane repair only.

  changes:
    - id: V10-PUBLIC-ENTRY-COLLECTOR-FIRST
      scope: control_plane_only
      description: >-
        Public resolve constructs DiagnosticCollector directly from the
        immutable 25-code COMPILED_PRIORITY before root resolution, source or
        dependency reads, strict parsing, input generation, lineage, Git,
        receipt or queue loading, dispatcher loading or selection, custody,
        nested resolution, output derivation, or materialized comparison.
    - id: V10-TYPED-STAGE-CAPTURE
      scope: control_plane_only
      description: >-
        Every fallible public-entry stage is captured with a declared default
        diagnostic, ResolutionFailure diagnostic lists are merged with their
        nested phase and detail retained, and independent stages continue
        after a captured failure. Prerequisite-dependent branches record a
        typed unavailable contradiction without aborting unrelated stages.
    - id: V10-SOLE-FINAL-ADJUDICATION
      scope: control_plane_only
      description: >-
        Diagnostics are deterministically deduplicated and sorted under the
        compiled priority table. DiagnosticCollector.final_adjudication is the
        only selector or raiser and is invoked exactly once at the end of each
        public resolve call.
    - id: V10-SIDE-EFFECT-FREE-DEPENDENCY-LOAD
      scope: control_plane_only
      description: >-
        V9 is consumed only as exact-bound data and is never imported or
        executed. The exact pinned dispatcher is parsed into an AST definition
        namespace after imports and the main guard are removed; its trusted
        definitions execute without module import, sys.modules mutation,
        bytecode, temporary files, or repository state. Dispatcher selection
        and all Git verification remain captured read-only operations.
    - id: V10-PUBLIC-NEGATIVE-MATRIX
      scope: deterministic_static_verification
      description: >-
        All 16 custody mutations replay through exact public resolve under
        latest_entry and ordered_entry for 32 cells. Two temporal collision
        classes replay under both strategies for four cells. Every cell emits
        the declared compiled-order winner, the complete deterministic
        diagnostic list, and no raw exception.
    - id: V10-FROZEN-PAYLOAD-WRAP
      scope: source_payload_preservation
      description: >-
        The complete merged v9 scientific/source payload is copied from exact
        data bytes, not recomputed by a research runtime. Exactly 1,363
        source_fields and 1,363 origin rows retain the frozen canonical
        subdigests while v10 adds only control-plane composition metadata.

