  resolver_contract:
    generic_deep_merge: prohibited
    last_write_wins_by_document_order: prohibited
    prose_inheritance: prohibited
    implicit_key_ownership: prohibited
    semantic_value_equality_as_conflict_resolution: prohibited
    executor_selected_precedence: prohibited
    latest_entry_strategy: >-
      Load exact snapshot-bound v7 first as the only entry point, validate its
      terminal custody, then load exactly the six ordered sources it names and
      resolve only through this ownership and override table. Loading v7 alone
      or treating its substantive protocol as self-contained returns
      ECOMP_LATEST_ONLY before measurement.
    ordered_entry_strategy: >-
      Load the same exact six sources by order_index 0 through 5 and apply only
      the enumerated ownership and override entries. No unlisted overlap may be
      selected by order.
    mandatory_pre_measurement_steps:
      - strict_parse_each_included_YAML_with_duplicate_key_rejection
      - verify_exact_path_sha256_size_and_unique_contiguous_order_index
      - verify_exact_version_roles_and_version_chain
      - reject_every_excluded_fingerprint
      - expand_owned_prefixes_to_every_resolved_leaf
      - require_exactly_one_owner_for_every_resolved_leaf
      - require_every_override_to_match_one_enumerated_edge_and_scope
      - reject_unresolved_or_type_coercion_masked_conflicts
      - preserve_all_v6_RNG_fixtures_and_v5_non_RNG_semantics
      - compute_latest_entry_and_ordered_entry_contracts_and_origin_traces
      - require_byte_identical_contract_trace_and_trace_SHA_convergence
    source_value_preservation:
      preserve_parsed_numeric_type: true
      preserve_parsed_numeric_value: true
      integer_float_coercion: prohibited
      decimal_rational_normalization: prohibited
      lexical_normalization_to_erase_conflict: prohibited
      NaN_or_infinity: prohibited
    canonical_origin_trace:
      row_fields:
        - resolved_field_path
        - owner_source_id
        - owner_source_sha256
        - override_predecessor_source_id
        - override_predecessor_field_path
        - value_type
        - value
      absent_override_predecessor: null
      row_order: ascending_UTF8_resolved_field_path
      object_serialization: json.dumps_sort_keys_true_separators_comma_colon_ensure_ascii_false_allow_nan_false
      encoding: UTF-8
      trailing_line_feed: prohibited
      hash: SHA256_of_exact_serialized_UTF8_bytes
      type_tags:
        mapping: object
        sequence: array
        string: string
        integer: integer
        float: float
        boolean: boolean
        null: null
      requirement: >-
        The resolver records and compares the canonical origin trace and its
        SHA-256. An implementation may not claim convergence from a hash alone;
        it must retain the exact trace preimage and resolved contract bytes.

