          below frozen_terminal_contract, deterministic_diagnostic_contract,
          deterministic_conformance_fixture, standing_sampler_control_custody,
          terminal_T6_and_HEUR_INSTR_4_disposition, historical_run_boundary,
          unchanged_and_still_binding, or authority_boundary restates its
          semantic subject. A restated subject has v5 as its sole owner; v4 is
          its override predecessor in the origin trace.
      amendment_v5:
        owns:
          - /protocol_amendment/frozen_terminal_contract/**
          - /protocol_amendment/deterministic_diagnostic_contract/**
          - /protocol_amendment/deterministic_conformance_fixture/**
          - /protocol_amendment/standing_sampler_control_custody/**
          - /protocol_amendment/terminal_T6_and_HEUR_INSTR_4_disposition/**
          - /protocol_amendment/historical_run_boundary/**
          - /protocol_amendment/unchanged_and_still_binding/**
        binding_invariants:
          standing_sampler_scalar_length_bytes: 2163
          standing_sampler_scalar_encoding: UTF-8_without_trailing_line_feed
          standing_sampler_scalar_sha256: d8195c833ba3663d457ccc1589b71f9db3647a9aaddc32a8854887f1ba95c8fe
          terminal_E3_transition: 768_to_1536
          terminal_E3_evaluations_per_reached_family: 1
          diagnostics_branching_authority: none
          automatic_T6_HEUR_INSTR_4_inference: superseded
        legacy_v5_regression_fixture:
          path: /protocol_amendment/deterministic_conformance_fixture/seeded_fresh_null/**
          disposition: preserve_as_non_production_regression_fixture
          production_RNG_authority: false
      amendment_v6:
        owns:
          - /protocol_amendment/exact_random_domain_contract/**
          - /protocol_amendment/canonical_fixture_serialization/**
          - /protocol_amendment/seeded_conformance_fixtures/**
        rule: >-
          Own only the exact O-INSTR-V5-1 RNG, domain, buffer, zero-scale,
          replacement-stream, and fixture repair. No other v5 semantic subject
          is removed, weakened, or re-owned by v6.
      amendment_v7:
        owns:
          - /protocol_amendment/controlling_v6_disposition/**
          - /protocol_amendment/executable_composition/**
          - /protocol_amendment/non_executable_exclusions/**
          - /protocol_amendment/field_ownership/**
          - /protocol_amendment/allowed_overrides/**
          - /protocol_amendment/resolver_contract/**
          - /protocol_amendment/static_conformance_fixtures/**
          - /protocol_amendment/v6_fixture_preservation/**
          - /protocol_amendment/failure_contract/**
          - /protocol_amendment/authority_boundary/**
        rule: Own composition and zero-authority metadata only.
    common_record_metadata:
      fields:
        - experiment_id
        - amendment_ordinal
        - version_from
        - version_to
        - filed_at
        - filed_by
