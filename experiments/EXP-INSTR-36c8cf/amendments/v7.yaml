          - /protocol_amendment/unchanged_and_still_frozen/**
          - /protocol_amendment/affected_runs/**
          - /protocol_amendment/what_this_amendment_does_not_do/**
          - /protocol_amendment/approval_scope_limit/**
        rule: Own only v1's explicit contract changes and their exact boundaries.
      amendment_v4:
        owns:
          - /protocol_amendment/immutable_lineage/**
          - /protocol_amendment/decisions_reconciled/**
          - /protocol_amendment/decision_relationship/**
          - /protocol_amendment/reconciliation_matrix/**
          - /protocol_amendment/frozen_changes/**
        v5_restatement_rule: >-
