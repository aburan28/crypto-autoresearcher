    leaves_owned_by_prefix: true
    exact_owner_count_per_resolved_field: 1
    overlap_without_enumerated_override: invalid_before_measurement
    source_namespaces_retained_for_provenance_only: true
    sources:
      specification:
        owns:
          - /experiment/**
        rule: >-
          Own every base default unless an executable semantic field is
          explicitly replaced by a v1 change, a v4 reconciliation selected and
          restated below v4, or a v5 terminal restatement. Source-record
          metadata is retained in the origin trace and is not silently merged.
      amendment_v1:
        owns:
          - /protocol_amendment/changes/**
          - /protocol_amendment/the_freeze_is_intact_for_G2_and_this_is_the_load_bearing_property
