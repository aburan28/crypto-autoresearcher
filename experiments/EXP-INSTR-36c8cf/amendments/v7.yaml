          - /protocol_amendment/executable_composition/**
          - /protocol_amendment/non_executable_exclusions/**
          - /protocol_amendment/field_ownership/**
          - /protocol_amendment/allowed_overrides/**
          - /protocol_amendment/resolver_contract/**
