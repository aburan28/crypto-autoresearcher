    v6. This additive proposal freezes one ordered, byte-bound source manifest,
    exhaustive source-field ownership, an enumerated v6-over-v5 RNG override,
    deterministic resolver and origin-trace rules, and static fail-closed
    fixtures. It changes no v5 or v6 substantive protocol field, runs no
    experiment, and grants no execution, Phase-B, scientific, evidence,
    knowledge, source, goal, status, JINV, ECDLP, or breakthrough authority.

