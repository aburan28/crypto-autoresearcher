experiment:
  id: EXP-INSTR-36c8cf
  hypothesis_id: H-INSTR-444c7b
  question_id: RQ-INSTR-f8faa0
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-d7e255
  version: 1
  status: approved
  claim_tier: toy
  retrospective: false
  retrospective_note: >-
    THIS IS A PRE-REGISTRATION. No run of EXP-INSTR-36c8cf exists at the time of
    writing and the runs/ directory does not yet exist. Every planted size, every
    null construction and every threshold below is frozen before execution and
    may be changed only by a versioned protocol_amendment filed under
    experiments/EXP-INSTR-36c8cf/amendments/ BEFORE the affected data is
    generated. NOTHING IN THIS FILE IS A MEASUREMENT.

  title: >-
    Two-directional instrument control -- planted-signal detection AND
    matched-null rejection -- for every statistic EXP-JINV-bd141d and
    EXP-VOLC-9f5571 rely on, run at THEIR ACTUAL GEOMETRY; and delivery of the
    reference-run per-density-row sampling characterisation without which the
    redesigned SR3 gate (protocol_amendment v3) cannot be evaluated.

  objective: >-
    MAKE THIS BATCH'S NEGATIVES CITABLE AND ITS POSITIVES ADMISSIBLE, AND DELIVER
    THE ONE MEASUREMENT THE REDESIGNED SR3 GATE NEEDS BEFORE IT CAN BE EVALUATED
    AT ALL. An instrument that cannot detect a planted signal cannot support a
    negative; one that fires on a matched null cannot support a positive. Both
    directions are GOAL-ENDO-001 criterion C4, and this contract is where they
    are discharged for BATCH-d7e255.

    WHY THIS IS BLOCKING, AND FOR WHAT. This campaign has already lost two
    conclusions to instruments rather than to mathematics: the isogeny-class
    no-information reading, withdrawn because NULL-C is a between-class MEAN
    detector, and the 94.7%-of-ceiling walk result, withdrawn because it rested
    on a single draw while the 8-seed mean sat on the ceiling (BATCH-cb71b5
    what_was_withdrawn). NULL-C is DISQUALIFIED for ANY within-class contrast by
    its own committed characterisation -- power 1.00 at a 0.9% shift, median
    p = 0.0590 at zero planted shift (red_team_notes.md section 5) -- and that
    disqualification is INHERITED here, not re-litigated. This contract is
    BLOCKING for EXP-JINV-bd141d and EXP-VOLC-9f5571. It is NOT blocking for
    EXP-ICINV-e0cd8f, which computes exact symbolic invariants and uses no
    statistic: criterion C4 governs instruments that estimate, and that one does
    not estimate.

    WHY GEOMETRY IS WHAT MUST BE HELD FIXED. The campaign's own detection-bound
    table shows the chi-square dispersion floor moving from variance-ratio 1.250
    at n = 138, T = 400 to 1.300 at n = 98, to 1.355 at n = 72, T = 300, to 3.668
    at n = 3, T = 300 (red_team_notes.md section 6). Power is a strong function
    of stratum size and the maximal-order stratum is always the smallest. A
    control run at a convenient geometry therefore says nothing about the same
    statistic at the geometry it will be used at, and this contract runs EVERY
    control at the ACTUAL geometry declared by the two blocked contracts,
    reporting one detection floor and one false-positive rate per (statistic,
    geometry, density row) cell.

    THE SR3 GATE REDESIGN, CARRIED BY THIS CONTRACT. The version-1/version-2 SR3
    gate of EXP-ICINV-4d33aa required Arm A0's per-density-row variance ratio to
    lie LITERALLY inside a frozen [1.3, 3.6] band. Independent review established
    that this band IS THE OUTWARD-ROUNDED HULL OF THE COMMITTED ROWS IT GATES --
    floor slack 0.020397, ceiling slack 0.011900 -- so the acceptance region was
    fitted to the data it gates with under 2% margin and legitimate sampling
    variation is expected to cross it (EXP-ICINV-4d33aa amendment v2,
    post_review_notes A5). THE USER HAS SELECTED, from the three candidates named
    in DEC-20260809-de11f9, THE REPLACEMENT OF LITERAL BAND MEMBERSHIP BY A
    STATISTICAL COMPARISON AGAINST THE REFERENCE RUN'S OWN SAMPLING UNCERTAINTY.
    That choice is recorded in DEC-20260810-a4bec4. ITS COST IS RECORDED HONESTLY
    AND IS NOT MINIMISED: the gate cannot be evaluated until the reference run's
    per-density-row sampling variance has been characterised; that
    characterisation does not exist today; producing it is additional work; and
    it therefore DELAYS the successor run of EXP-ICINV-4d33aa and, through the C4
    block, EXP-JINV-bd141d and EXP-VOLC-9f5571, relative to the cheaper
    interior-rows option that was also on the table. The user's reason for
    preferring it to that cheaper option is NOT KNOWN TO THIS CONTRACT and is
    therefore not stated, inferred or invented.

    WHAT THE SR3 REDESIGN DOES NOT MEAN. EXP-ICINV-4d33aa terminated INVALID
    twice, at version 1 and at version 2, and BOTH TERMINATIONS WERE
    ADMISSIBILITY FAILURES IN THE GATE. Per the Coordinator's own independent
    check recorded in DEC-20260809-de11f9, they bear on NEITHER H-ICINV-6c7920
    NOR EV-ENDO-10109d. A run that never reached an outcome state decides nothing
    (AGENTS.md rule 5). Redesigning the gate is not a re-adjudication of either
    record, and no reader may infer from this contract that anything has been
    decided about the campaign's headline finding.

  inputs:
    statistic_inventory:
      source: >-
        FIXED BY THE OTHER TWO CONTRACTS, NOT BY THIS ONE. The statistics to be
        characterised are exactly those EXP-JINV-bd141d and EXP-VOLC-9f5571
        declare. If either contract adds a statistic, this contract must
        characterise it before that statistic supports any conclusion; that is
        what "blocking" means here.
      items:
        - "per-class mean of decomposition_rate_m2 and decomposition_rate_m3"
        - "per-level mean and sd of the same, within a class"
        - "liftable_density and decomposition_efficiency, per class and per level"
        - "the within-class chi-square dispersion statistic used for the level contrast"
        - "the rank correlation of class-mean rate against |D_0| across classes"
        - "the exact permutation rank used for the single-vertex |Aut| arm"
        - "the walk-length distribution summary used for the T5 gate"
    geometries:
      rule: >-
        Every control is run at the ACTUAL geometry of use -- the real class
        counts, the real enumerated per-level vertex counts, the real r-stratum
        sizes, the real target counts and the real density rows. A control at a
        convenient geometry does not discharge criterion C4.
      items:
        - "between-class: the 51 conductor-1 classes of the N = 19507 family, at their real class sizes and r compositions"
        - "within-class: the enumerated per-level vertex counts of the conductor-arm classes at ell = 3 and ell = 107"
        - "single-vertex: the 37-vertex t = 211, p = 19717 class, at n = 1 against 36"
        - "T5 walk: the Velu-constructed 107-volcano of that same class"
      dependency_note: >-
        The real geometries are produced by Stage 1 of EXP-JINV-bd141d and
        EXP-VOLC-9f5571 (family construction, class census, Velu volcano). This
        contract therefore runs AFTER those Stage 1 gates and BEFORE any verdict
        in those contracts is read. The sequencing is stated here so the
        dispatching handoff can express it as a dependency rather than a hope.
    planting_rule:
      into: >-
        REAL MEASURED VALUES from the target design, never synthetic data, so the
        null distribution retains the real data's own structure -- its r
        composition, its stratum sizes and its per-curve heterogeneity.
      constructions:
        - "between-class: a monotone shift in |D_0| of declared size added to the per-class means"
        - "within-class: a per-level shift of declared size added to one level's per-vertex values"
        - "single-vertex: a shift of declared size applied to the designated crater vertex only"
        - "T5 walk: a declared bias imposed on the walk kernel"
      sweep: >-
        The planted size is swept DOWNWARD until detection fails; the smallest
        detected size is reported as that cell's DETECTION FLOOR. Sizes are
        declared before execution and are NEVER adjusted after seeing a result.
    matched_nulls:
      constructions:
        - "between-class: class labels permuted so |D_0| carries no information, with class sizes and r composition preserved exactly"
        - "within-class: an f = 1 class of the same matched-order family -- no level axis by construction -- split into two arbitrary declared halves of the same sizes as the real levels"
        - "single-vertex (PSEUDO-CRATER): an arbitrary NON-crater vertex of the t = 211 class designated as the crater, exercising the rank statistic at exactly n = 1 against the same 37-member distribution"
        - "T5 walk: an unbiased kernel against the declared biased kernel"
      requirement: >-
        Each null has the SAME SHAPE as the object under test and differs only in
        carrying no signal. Each is run at EVERY declared density row.
    null_c_status:
      within_class: >-
        DISQUALIFIED, INHERITED, NOT RE-TESTED. exp_icinv.permutation_null is a
        between-class MEAN detector with power 1.00 at a 0.9% shift and median
        p = 0.0590 at zero planted shift (red_team_notes.md section 5). It may
        not be used for any within-class contrast in this batch in either
        direction.
      between_class: >-
        A SEPARATE QUESTION, ANSWERED AFRESH HERE. Power and false-positive
        behaviour do not transfer across designs, and the matched-order family
        annihilates exactly the confound NULL-C was shown to be maximally
        sensitive to. NULL-C is not presumed admissible for EXP-JINV-bd141d's
        between-class arm merely because that confound is gone.
    sr3_amendment_v3:
      status: >-
        THE SUBSTANCE OF PROTOCOL_AMENDMENT v3 TO EXP-ICINV-4d33aa IS CARRIED BY
        THIS CONTRACT. The formal versioned amendment file
        experiments/EXP-ICINV-4d33aa/amendments/v3.yaml must be authored and
        committed in a Coordinator ledger archive BEFORE any successor run of
        EXP-ICINV-4d33aa is dispatched; it is named as a next action of
        DEC-20260810-a4bec4 and is NOT created by this file.
      change: >-
        SR3 no longer requires literal membership of the frozen [1.3, 3.6] band.
        It requires the candidate arm's per-density-row variance ratio to lie
        inside a declared central interval of the REFERENCE RUN'S OWN empirical
        sampling distribution at that row.
      why_the_old_gate_is_replaced: >-
        The band is the outward-rounded hull of the committed rows it gates --
        floor slack 0.020397, ceiling slack 0.011900 -- so it was fitted to the
        data it gates with under 2% margin (EXP-ICINV-4d33aa amendment v2,
        post_review_notes A5). It is a hull edge, not an independent threshold.
      decided_by: >-
        THE USER, this session, selecting from the three candidates named in
        DEC-20260809-de11f9. Recorded in DEC-20260810-a4bec4. This is a user
        decision, not a Coordinator inference.
      rationale_for_the_choice: >-
        NOT KNOWN TO THIS RECORD. The user's reason for preferring this option
        over the cheaper interior-rows option was not stated to the Coordinator
        and is therefore not reconstructed, inferred or invented here.
      cost: >-
        The gate is NOT evaluable until the reference run's per-density-row
        sampling distribution exists. It does not exist today. Producing it is
        additional work delivered by this contract, and it DELAYS
        EXP-JINV-bd141d and EXP-VOLC-9f5571 relative to the interior-rows option.
        Recorded as a cost, not argued against.
      characterisation_procedure: >-
        For each density row: re-measure the reference run at ITS OWN frozen
        parameters (its declared factor-base sizes, target count, sampler, class
        selection rule) across the declared seed set; record the empirical
        sampling distribution of the variance-ratio statistic AT THAT ROW; and
        report the declared central interval together with interval width as a
        function of seed count, so stability is visible rather than asserted. The
        exact m = 3 sum sets are seed-independent and are computed once and
        reused, which is what bounds the cost.
      no_widening_rule: >-
        If a faithful re-measurement of the reference run falls outside its own
        interval, THE INTERVAL IS NOT WIDENED. The Coordinator is told, and the
        gate is redesigned under a new versioned amendment or the successor run
        is not dispatched. Widening a threshold after seeing it fail is precisely
        the move this campaign's rules exist to prevent.
      reference_run_identification: >-
        The run ids the redesigned gate compares against are NAMED EXPLICITLY in
        the run record and every value read from them is bound by a
        source_sha256. Transcribing a reference value into source at any
        precision is PROHIBITED and makes the run INVALID
        (EXP-ICINV-4d33aa amendment v2 change A4, CORR-20260807-a24675).
    source_constraints: >-
      harness/exp_icinv.py is READ ONLY and MUST NOT BE EDITED. New control
      driver over it and over harness/exp_icinv_fullgroup.py,
      harness/isogeny_class.py and harness/toycurve.py. Run manifests must pin
      the hash of every source file executed
      (harness/runner.py:source_provenance, audited by
      tools/check_run_source_provenance.py --strict) -- the standing A6
      precondition carried from EXP-ICINV-4d33aa amendment v2, which is BLOCKING.

  controls:
    - >-
      C-NULLC-REPRODUCTION. From the committed p = 4001 rate_m3 values, reproduce
      NULL-C's published power profile -- median p = 0.0590 at delta = 0, power
      0.08 at delta = 0.002, power 1.00 at delta = 0.005 and above, 12
      repetitions per cell. This establishes that the control harness exercises
      the same statistic the red team exercised. Failure makes the run INVALID.
    - >-
      C-PSEUDO-CRATER. The rank statistic exercised at n = 1 against the same
      37-member distribution using an arbitrary NON-crater vertex. If the
      pseudo-crater is flagged extreme more often than the declared level allows,
      the |Aut| arm of EXP-JINV-bd141d cannot be read at all.
    - >-
      C-ARBITRARY-HALVES. An f = 1 class of the matched-order family, which has
      no level axis by construction, split into two arbitrary declared halves of
      the same sizes as the real levels.
    - >-
      C-LABEL-PERMUTATION. Class labels permuted so |D_0| carries no information,
      with class sizes and r composition preserved exactly.
    - >-
      C-DOWNWARD-SWEEP. The planted size is swept downward to the detection floor
      rather than tested at one convenient size.
    - >-
      C-SEED-STABILITY. Interval width reported as a function of seed count for
      the SR3 v3 characterisation, so stability is visible rather than asserted.
    - >-
      C-SELF-CONSISTENCY. A faithful re-measurement of the reference run at its
      own parameters compared against its own interval.
    - >-
      C-NUISANCE-DIRECTION. For each statistic, the nuisance direction it is
      known or suspected to be sensitive to is exercised explicitly -- for
      NULL-C, a pure mean shift with no structure -- and its response reported, so
      "passed a control" cannot be confused with "measures the intended
      quantity".

  independent_variables:
    - "statistic under characterisation"
    - "geometry of use (class counts, per-level vertex counts, stratum sizes, target counts)"
    - "factor-base density row"
    - "planted effect size (swept downward)"
    - "null construction (label permutation, arbitrary halves, pseudo-crater, unbiased kernel)"
    - "seed count, for the SR3 v3 interval-stability check"

  metrics:
    primary:
      - "detection floor: smallest planted size detected, per (statistic, geometry, density row)"
      - "false-positive rate on the matched null, per (statistic, geometry, density row)"
      - "NULL-C power-profile reproduction from the committed p = 4001 values"
      - "NULL-C median p at zero planted shift on the MATCHED-ORDER between-class geometry"
      - "SR3 v3: per-density-row empirical sampling distribution of the variance-ratio statistic for the reference run, with its declared central interval"
      - "SR3 v3: interval width as a function of seed count"
      - "SR3 v3 self-consistency: whether a faithful re-measurement falls inside its own interval"
    secondary:
      - "nuisance-direction response per statistic"
      - "pseudo-crater flag rate at n = 1"
      - "arbitrary-halves flag rate per density row"
      - "per-cell coverage table listing every (statistic, geometry, density row) as measured or not_measured"
      - "wall-clock and memory per control cell, for successor budgeting"

  heuristic_under_test: HEUR-INSTR-1
  heuristic_under_test_note: >-
    HEUR-INSTR-1 (planting into real measured values and permuting their labels
    yields a null preserving the real data's structure) is validated by the
    matched-null false-positive measurements and by the nuisance-direction
    control. HEUR-INSTR-2 (the reference run's empirical per-row sampling
    distribution is an adequate reference for the redesigned SR3 gate) is
    validated by C-SEED-STABILITY and C-SELF-CONSISTENCY. Both are validated
    inside this experiment; neither is assumed.

  preregistered_prediction:
    quantity: >-
      For every (statistic, geometry, density row) cell: the detection floor and
      the matched-null false-positive rate. For the SR3 v3 gate: the reference
      run's per-density-row sampling interval, its width as a function of seed
      count, and whether a faithful re-measurement falls inside it.
    formula: >-
      NO NUMERIC EFFECT SIZE IS PREDICTED FOR ANY CELL AND NONE IS INVENTED,
      BECAUSE THE ACTUAL GEOMETRIES ARE NOT YET ENUMERATED. The qualitative
      predictions fixed here are: (1) THE DETECTION FLOOR RISES SHARPLY AS THE
      STRATUM SHRINKS and is worst at the maximal-order level -- the campaign's
      own table gives variance-ratio floors 1.250 at n = 138 T = 400, 1.355 at
      n = 72 T = 300 and 3.668 at n = 3 T = 300, so the crater stratum is
      expected to be the least resolvable cell in the batch; (2) THE MATCHED-NULL
      FALSE-POSITIVE RATE IS AT OR BELOW THE DECLARED NOMINAL LEVEL in every
      cell, and materially above it disqualifies that statistic at that geometry;
      (3) NULL-C'S MEDIAN p AT ZERO PLANTED SHIFT SHOULD MOVE TOWARD 0.5 on the
      matched-order geometry, relative to the committed 0.0590, because the
      residual class effect that value reflects came from #E and #E is identical
      by construction in this family -- a median p that stays near 0.0590 means a
      class effect survives that the construction was supposed to annihilate, and
      that is an instrument finding reported as one; (4) THE SR3 v3 INTERVAL
      WIDTH STABILISES with seed count and a faithful re-measurement of the
      reference run falls inside its own interval. Prediction (1) is qualitative
      and directional only; no threshold is set from data.
    source: >-
      coordination/goals/GOAL-ENDO-001/batches/BATCH-cb71b5/reviews/red-team/red_team_notes.md
      sections 5 and 6; experiments/EXP-ICINV-4d33aa/amendments/v2.yaml
      post_review_notes A5; analysis/endomorphism-isogeny-decomposition/MATCHED-ORDER-DESIGN.md
      sections 3 and 4 (E4); ledger/goals/GOAL-ENDO-001/goal.yaml criterion C4
      and pause condition P1; DEC-20260810-a4bec4 for the SR3 v3 selection.

  scale_relevance:
    tier: toy
    justification: >-
      Instruments only, exercised on toy-scale objects: the committed p = 4001
      class (~12 bits) and the N = 19507 matched-order family (~14.25 bits). NO
      CURVE-SIDE CLAIM IS MADE AT ANY SCALE. A detection floor and a
      false-positive rate measured here apply to exactly the geometry they were
      measured at and transfer to no other, which is the entire point of the
      contract rather than a limitation of it.
    correspondence: null
    correspondence_note: >-
      No sampling correspondence is used. Nulls are exact permutation
      constructions on real measured values, and the SR3 v3 characterisation is a
      direct seed sweep of the reference measurement.

  tail_checks:
    - >-
      SMALLEST-STRATUM CELL. The cell at the smallest stratum -- expected to be
      the crater -- is reported explicitly with its floor, not folded into an
      average across strata.
    - >-
      NULL TAIL. The full distribution of the matched-null statistic is reported
      per cell, not merely its exceedance rate, so a heavy tail is visible.
    - >-
      SR3 v3 INTERVAL TAILS. The extreme per-seed variance ratios at each density
      row are listed, so the interval's endpoints can be seen rather than
      trusted.
    - >-
      NOT-MEASURED LEDGER. Every (statistic, geometry, density row) cell the
      budget did not reach is listed explicitly as not_measured, together with the
      lane conclusion it thereby BLOCKS. An unmeasured control is not a passed
      control.

  replication:
    seeds: [20260810, 20260811, 11235813, 20260812, 20260813, 20260814, 20260815, 20260816, 20260817, 20260818, 20260819, 20260820]
    seeds_note: >-
      Twelve seeds. The SR3 v3 interval requires enough seeds for its width to
      stabilise, and interval width against seed count is itself a reported
      metric so the choice is auditable rather than asserted. The exact m = 3 sum
      sets are seed-independent and are computed once and reused, which is what
      makes a twelve-seed sweep affordable.
    independent_instances: 4
    independent_instances_note: >-
      Four distinct control geometries: the between-class matched-order geometry,
      the within-class per-level geometry, the single-vertex 37-member geometry,
      and the T5 walk geometry. Each is characterised separately; results are
      never pooled across geometries, because non-transfer across geometries is
      the finding this contract exists to make usable.

  budget:
    wall_clock_seconds_per_run: 14400
    total_cpu_hours: 24
    maximum_memory_gb: 8
    maximum_runs: 20
    budget_provenance: >-
      COORDINATOR-SET. MATCHED-ORDER-DESIGN.md states no budget for E4. These
      figures bound the task and are not derived from any measurement.
      Exhausting them is a budget event under AGENTS.md rule 5, reported as such,
      and an unreached control cell BLOCKS its lane conclusion rather than
      passing it.
    dominant_cost: >-
      The twelve-seed sweep for the SR3 v3 reference characterisation and the
      downward planted-size sweeps across every (statistic, geometry, density
      row) cell. Sum sets are computed once and reused across seeds, which is a
      contract requirement rather than an optimisation.

  stopping_rules:
    - >-
      SR1 REPRODUCTION GATE, RUNS FIRST. Reproduce NULL-C's published power
      profile from the committed p = 4001 values. Failure means the control
      harness is not exercising the same statistic; STOP, run INVALID, return the
      defect. Do not characterise anything.
    - >-
      SR2 GEOMETRY DEPENDENCY. Do not run any geometry-specific control before
      the corresponding Stage 1 of EXP-JINV-bd141d or EXP-VOLC-9f5571 has emitted
      the real geometry (family construction, class census, Velu volcano). A
      control at an assumed geometry does not discharge criterion C4.
    - >-
      SR3 DOWNWARD SWEEP. Planted sizes are swept downward from the declared
      maximum to the declared minimum. Stop a sweep when detection fails and
      record that size as the floor; do not restart a sweep with different sizes
      after seeing a result.
    - >-
      SR4 NO WIDENING. If the SR3 v3 self-consistency check fails, STOP and
      report to the Coordinator. Do not widen the interval, do not change the
      coverage, and do not proceed to gate anything with it.
    - >-
      SR5 FROZEN SCOPE. Stop at the declared statistics, geometries, density
      rows, planted sizes and seeds. No extension without a versioned
      protocol_amendment filed BEFORE the extra data is generated.
    - >-
      SR6 BUDGET. On exceeding wall_clock_seconds_per_run, stop that run and
      record status failed_infrastructure with partial artifacts retained. Per
      AGENTS.md rule 5 this is never negative evidence about any instrument and
      never a pass; the affected cells are recorded as not_measured and BLOCK
      their lane conclusions.
    - >-
      SR7 NO OUTCOME SHOPPING. Every floor, rate and interval is computed by the
      frozen rule inside the run and written to the run record. None is selected
      afterwards and the set of reported metrics does not depend on what was
      found.

  invalidation_rules:
    - >-
      Planting into synthetic data rather than into real measured values.
    - >-
      Adjusting a planted size, a nominal level, or an interval coverage after
      seeing a result.
    - >-
      Widening the SR3 v3 interval in response to a failed self-consistency
      check.
    - >-
      Using NULL-C for any within-class contrast, in either direction.
    - >-
      Reporting a control at a geometry other than the actual geometry of use, or
      presenting a not_measured cell as a pass.
    - >-
      Any edit to harness/exp_icinv.py; any run manifest that does not pin the
      hash of every source file executed.
    - >-
      Any reference value quoted from a committed record without being read from
      that record at run time and bound by a source_sha256. Transcription at any
      precision is prohibited.
    - >-
      Any curve-side conclusion of any kind appearing in the output of this
      experiment. It characterises instruments; a curve claim here means the
      scope was exceeded.

  success_criterion: >-
    THE CONTRACT SUCCEEDS WHEN EVERY DECLARED CELL IS CHARACTERISED IN BOTH
    DIRECTIONS AND THE SR3 v3 REFERENCE CHARACTERISATION IS DELIVERED -- not when
    a particular instrument turns out to be good. Concretely, ALL of the
    following hold: (1) SR1 passes; (2) for every (statistic, geometry, density
    row) cell declared by EXP-JINV-bd141d and EXP-VOLC-9f5571, a measured
    detection floor and a measured matched-null false-positive rate are reported,
    with any cell the budget did not reach listed explicitly as not_measured
    together with the lane conclusion it BLOCKS; (3) the pseudo-crater,
    arbitrary-halves, label-permutation and nuisance-direction controls are all
    reported; (4) NULL-C's admissibility for the between-class matched-order
    contrast is characterised afresh, including its median p at zero planted
    shift on that geometry; (5) the SR3 v3 per-density-row sampling distribution
    is delivered with its central interval, its width against seed count, and its
    self-consistency verdict; and (6) the report states plainly that the
    superseded [1.3, 3.6] band was the outward-rounded hull of the committed rows
    it gated (floor slack 0.020397, ceiling slack 0.011900) and that this -- not
    a failure of the campaign's finding -- is why literal band membership is being
    replaced, together with the cost the chosen replacement imposes. A statistic
    that FAILS either direction is a successful outcome of this contract: the
    deliverable is a blocked lane conclusion with a named replacement statistic
    and its cost, not a pass.

  falsification_criterion: >-
    F1 NULL-C's published power profile is not reproduced from the committed
    values -- the control harness is not exercising the same statistic; run
    INVALID, returned as a defect, and not a finding about any instrument. F2 A
    statistic fails the DETECTION direction at every planted size the lane could
    plausibly care about, at some geometry of use -- it cannot support a negative
    there; every lane conclusion quoting it is BLOCKED and GOAL-ENDO-001 pause
    condition P1 applies to it. F3 A statistic fails the REJECTION direction,
    firing on its matched null materially above the nominal level (HEUR-INSTR-1
    refuted at that geometry) -- it cannot support a positive; every lane
    conclusion quoting it is BLOCKED. F4 The SR3 v3 interval does not stabilise
    with seed count, or a faithful re-measurement of the reference run falls
    outside its own interval (HEUR-INSTR-2 refuted) -- the redesigned gate is not
