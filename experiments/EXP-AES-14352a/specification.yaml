experiment:
  id: EXP-AES-14352a
  hypothesis_id: H-AES-f32922
  derived_from_idea: IDEA-20260910-321d6a
  source_idea_ids:
    - IDEA-20260910-321d6a
  question_id: RQ-AES-003
  goal_id: GOAL-AES-003
  version: 1
  title: >-
    Stage-1 friend-pair random-suppression ablation on a fixed related-differential /
    zero-difference predicate P_RD for AES-128 at r=5, adjudicated only vs REF-A/B/C
  status: approved
  frozen: true
  approved_by: coordinator
  approval_decision: DEC-20260910-8469ab
  approval_basis: >-
    Standing user authorization in AGENTS.md (2026-09-06): ideas/experiments always
    approved once protocol is complete. Coordinator records protocol approval; no
    per-idea user confirmation. Protocol completeness checked for Stage 1
    (inputs, controls, metrics, seeds/replication N>=16, budget, stopping/
    invalidation, success/falsification, required artifacts, CM-3 accounting).
  assigned_to: executor
  scientific_execution_authorized: true
  scientific_execution_scope: >-
    Stage 1 ONLY (decisive cheap ablation). Stage 0 optional smoke is authorized
    as non-claim scaffolding. Stage 2 CM-3 end-to-end cost vs REF-B is NOT
    authorized until a superseding Coordinator decision after Stage 1 shows
    preferential random suppression.
  execution_authorized: true
  evidence_eligible: false
  execution_admission:
    currently_admitted: false
    requirements:
      - Verified snapshot archive of H-AES-f32922, EXP-AES-14352a, DEC-20260910-8469ab, TASK-20260910-1cd30e on a published branch/PR
      - Implementation under experiments/EXP-AES-14352a/implementation/ with FIPS-197 pin receipt against aes_reduced.py
      - Trial plan / runner entry for Stage 1 frozen before scientific runs
      - Fresh Executor claim via tools/goal_lanes.py before launch
  launch_gate:
    blocks_scientific_run_until:
      - >-
        Implementation of P_RD, F_fp, controls, and instrumentation exists under
        experiments/EXP-AES-14352a/implementation/ (not present at design time;
        TASK-20260910-1cd30e produces it).
      - Snapshot archive of this frozen contract is verified (parent archives).
      - Stage-1 trial plan names exact commands, seeds 2026091001..2026091016, and artifact paths.
    does_not_block_protocol_approval: true
    note: >-
      scientific_execution_authorized is true because the Stage-1 scientific
      protocol is complete and frozen. Implementation is still required before
      /run can execute; that is an Executor deliverable, not a missing protocol field.

  objective: >-
    Reduce the uncertainty whether a PROGRAM-LOCAL friend-pair filter F_fp
    preferentially suppresses ACCEPT on a matched 10-round AES control relative
    to AES-128 at r=5 when conjoined with a fixed related-differential /
    zero-difference predicate P_RD. Stage 1 measures ACCEPT rates for P_RD alone
    and P_RD AND F_fp on AES-r=5 and on the 10-round null, N>=16 independent keys,
    with pre-registered query budget, and records control FPR in bits. Positive:
    program-adjudicable excess + preferential random suppression (vs REF-B
    ablation). Negative: non-discriminating friend filter for this P_RD — equally
    first-class. NO published-frontier margin (RQ-AES-003 R3).

  what_this_is_not:
    - Not a reproduction of Shin's exchanged-boomerang claim or Yan's ACP figures.
    - Not a full-round or deployed-AES claim; toy / reduced-round ceiling only.
    - Not a comparison to any published ACC/ACP as a completion margin (R3).
    - Not Stage-2 authorization; CM-3 end-to-end vs REF-B is gated.
    - Not evidence until runs exist under this contract; no results are invented here.
    - Not related-key / known-key completion under RQ-AES-003.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      On THIS machine, THIS pinned FIPS-197 harness, AES-128 single-key at r=5
      (graded spot arms at r in {4,5,6} and null at r=10): measured ACCEPT counts
      and rates for P_RD and P_RD AND F_fp on AES and control; measured control
      FPR with bit resolution; ablation ratios; HEUR-FP1/HEUR-FP2 pass/fail under
      pre-registered bands; optional Stage-0 smoke labelled program-local. WHAT
      DOES NOT FOLLOW: any published-frontier margin; r=6 survival claim; full-round
      AES; key recovery; Stage-2 CM-3 baseline until separately authorized.
    explicitly_not_supportable_under_any_outcome: >-
      Published ACP/ACC margins; full-round AES statements; related-key completion;
      asymptotic exponent claims.

  inputs:
    procedure: >-
      STAGE 0 (OPTIONAL smoke, not the claim): implement a minimal friend-pair
      check on a known exchange pattern; confirm the control-side fully-active
      pattern rate moves in the direction Shin's POINTER suggests; label
      PROGRAM-LOCAL; do not assert published ACC.
      STAGE 1 (DECISIVE, cheap): (1) Pin harness against FIPS-197 KATs using
      aes_reduced.py (sha256
      2c76f3e5db83ec2500ce1010a392a135869d8b9dd1a534af817e06f15babb447) before any
      measurement. (2) Freeze P_RD byte sets, F_fp exchange bound, and adaptive
      query schedule; hash-commit the schedule. (3) Run NULL / ABLATION / SIBLING
      / GRADED controls with verdict-on-null-first: commit control verdicts before
      reading AES r=5 primary arms. (4) For each of N=16 keys: measure ACCEPT
      counts for P_RD alone and P_RD AND F_fp on AES-r=5 and on matched 10-round
      AES at identical data/kind/budget; record query counts by kind, wall clock,
      peak RSS. (5) Emit primary statistics and HEUR-FP1/HEUR-FP2 checks.
      STAGE 2 (GATED — not authorized by this contract): if Stage 1 shows
      preferential random suppression, freeze CM-3 instrumentation and measure
      end-to-end cost vs REF-B (same P_RD, no F_fp) on the same machine under a
      superseding approval.
    instrument: >-
      Pinned GOAL-AES-001 pure-Python FIPS-197 harness:
      coordination/goals/GOAL-AES-001/batches/BATCH-001/tasks/TASK-20260731-602/aes_reduced.py
      (MODULE_SHA256 2c76f3e5db83ec2500ce1010a392a135869d8b9dd1a534af817e06f15babb447),
      admitted by DEC-20260731-011 / RQ-AES-003 scope.pin. Defect set travels with
      the harness (H-2, H-4, ER-5, ER-7, ER-8, V-804-4, V-804-5, KN-FIND-029 escape
      classes). Recorded through harness/runner.py or an EXP-local runner that
      emits equivalent manifests. AES-NI path not required for Stage 1; if used,
      must re-pin against the same KATs and be labelled separately.
    parameters:
      cipher: AES-128
      key_bits: 128
      threat_model: single-key adaptive CP/CC
      rounds_primary: 5
      rounds_graded: [4, 5, 6]
      rounds_null: 10
      n_keys_stage1: 16
      seeds: [2026091001, 2026091002, 2026091003, 2026091004, 2026091005, 2026091006, 2026091007, 2026091008, 2026091009, 2026091010, 2026091011, 2026091012, 2026091013, 2026091014, 2026091015, 2026091016]
      p_rd: >-
        Single fixed program-local related-differential / zero-difference ACCEPT
        predicate on named byte sets after r rounds; exact byte masks and
        difference pattern declared in implementation README and hash-committed
        before Stage 1 AES arms. Re-derived from exchange / related-differential
        lineage IDEA-20260807-4ee607 / IDEA-20260828-82676b — not from unread PDF
        internals.
      f_fp: >-
        Bounded inverse-diagonal exchange search for a PROGRAM-LOCAL friend
        certificate; exchange count and misaligned sibling (+1 mod 4) declared
        in implementation before runs.
      query_budget: >-
        Pre-registered per-key adaptive query budget (plaintext + ciphertext
        kinds counted separately); frozen in trial plan before AES primary arms.
      primary_statistic: >-
        AES−control ACCEPT gap for (P_RD AND F_fp) at r=5; one-sided p < 0.01
        under pre-registered binomial/Poisson model.

  controls:
    - kind: null_object
      name: REF-C-style / 10-round AES null
      design: >-
        NULL: 10-round AES-128 at identical data/kind/query budget; forced
        near-null ACCEPT under HEUR-FP1; FPR measured, not assumed. Verdict
        committed before AES r=5 primary arms (verdict-on-null-first).
    - kind: ablation_ref_b
      name: P_RD without F_fp
      design: >-
        ABLATION / REF-B self-baseline: measure P_RD alone on AES and control at
        the same budget; joint ACCEPT is compared to this arm. Stage 1 records
        rates; Stage 2 (gated) records CM-3 cost vs this baseline.
    - kind: sibling_geometry
      name: misaligned inverse-diagonal exchange
      design: >-
        SIBLING: misaligned inverse-diagonal exchange tables (offset +1 mod 4);
        predicted null excess — isolates geometry of F_fp from the related-
        differential signal.
    - kind: graded_rounds
      name: r in {4,5,6} spot arms
      design: >-
        GRADED: excess must not increase with r (inventor-protocol §3 artifact
        tell). Spot arms only; r=6 extension is out of scope as a survival claim.
    - kind: ordering
      name: verdict-on-null-first
      design: >-
        Adaptive query schedule hash-committed; null/sibling/ablation control
        verdicts committed before AES r=5 primary ACCEPT rates are read.
    - kind: pin
      name: FIPS-197 harness pin
      design: >-
        Before measurement: full-round KATs agree with aes_reduced.py pin
        (sha256 2c76f3e5db83ec2500ce1010a392a135869d8b9dd1a534af817e06f15babb447)
        under a second independent check (pycryptodome and/or openssl CLI as
        available). Pin failure is infrastructure stop, never negative math.

  independent_variables:
    - name: round_count
      values: [4, 5, 6, 10]
      note: Primary claim at r=5; graded {4,5,6}; null at 10.
    - name: predicate_arm
      values: [P_RD_alone, P_RD_and_F_fp, F_fp_alone_optional]
    - name: exchange_alignment
      values: [aligned_friend_tables, misaligned_plus1_mod4]
    - name: key_seed
      values: [2026091001, 2026091002, 2026091003, 2026091004, 2026091005, 2026091006, 2026091007, 2026091008, 2026091009, 2026091010, 2026091011, 2026091012, 2026091013, 2026091014, 2026091015, 2026091016]

  metrics:
    primary:
      - >-
        accept_rate_aes_r5_joint: ACCEPT count and rate for (P_RD AND F_fp) on
        AES-128 r=5 across N=16 keys, with Wilson or exact binomial CI.
      - >-
        accept_rate_control_r10_joint: same for matched 10-round AES control.
      - >-
        aes_minus_control_gap: primary statistic; one-sided p-value under
        pre-registered binomial/Poisson model; control FPR in bits in the same
        sentence.
      - >-
        ablation_ratio_control: rate(P_RD AND F_fp)/rate(P_RD) on control.
      - >-
        ablation_ratio_aes: rate(P_RD AND F_fp)/rate(P_RD) on AES-r=5.
      - >-
        heur_fp1_product_check: control joint vs product rate(P_RD)×rate(F_fp)
        relative error.
      - >-
        heur_fp2_odds_ratio: association odds-ratio AES vs control.
    secondary:
      - measured FPR on control for P_RD alone and joint, with bit resolution
      - graded excess at r in {4,5,6}
      - sibling (misaligned) excess at r=5
      - CM-3 accounting fields for Stage 1 (wall clock, peak RSS, query counts by kind) even though Stage-2 cost comparison is gated
      - per-arm key digest and seed
      - Stage-0 smoke outputs if run (labelled non-claim)

  heuristic_under_test: HEUR-FP1
  heuristic_under_test_secondary: HEUR-FP2

  cost_model_disclosure:
    model: CM-3
    unit: >-
      One r-round AES-128 encryption of one block on the pinned FIPS-197
      harness, key schedule amortised (stated); friend-search adaptive queries
      charged in the same unit via measured conversion or direct r-round counts.
    measured_vs_modelled: >-
      Stage 1 rates, FPR, wall clock, peak RSS, and query counts are MEASURED.
      REF-A 2^127 is DEFINITIONAL, not measured. Stage 2 end-to-end CM-3 cost
      vs REF-B is gated and must be measured end-to-end when authorized — never
      modelled as a published-figure substitute.
    optimistic_assumptions:
      - >-
        Key schedule amortised in primary Stage-1 accounting. DIRECTION OF BIAS:
        lowers charged cost of repeated queries under one key; must be stated
        beside any CM-3 figure.
      - >-
        Friend-search expected cost estimated from measured attempt counts, not
        assumed success probability. DIRECTION OF BIAS if success only is
        reported: understates cost — forbidden; charge attempts.
    memory_accounting: >-
      Peak RSS MEASURED per Stage-1 invocation; analytic size of exchange tables
      stated in implementation README and reconciled.
    hidden_overhead: >-
      Friend search multiplies query cost; charged in CM-3, never hidden in
      success-probability-only accounting (IDEA target_complexity.hidden_overhead).
    standardized_parameter_sets: >-
      (k=128, r=5) primary; graded r in {4,5,6}; null r=10. Affected scope:
      reduced-round AES-128 distinguisher objects on this harness only. Safe
      scope: full-round / deployed AES — no claim transfers.
    adjudication_only:
      - REF-A
      - REF-B
      - REF-C

  preregistered_prediction:
    quantity: >-
      AES−control ACCEPT gap for (P_RD AND F_fp) at r=5; preferential random
      suppression via ablation ratios; HEUR-FP1 multiplicative prediction on
      control; HEUR-FP2 odds-ratio AES > control.
    formula: >-
      Primary: one-sided p < 0.01 for AES rate > control rate under pre-registered
      binomial/Poisson, with control FPR in bits. Secondary: ablation_ratio_control
      < ablation_ratio_aes. HEUR-FP1: |joint - product| / product within band
      (falsify if >3× beyond sampling error). HEUR-FP2: odds_ratio_aes >
      odds_ratio_control within error.
    source: IDEA-20260910-321d6a predictions and heuristic_assumptions (HEUR-FP1, HEUR-FP2)

  scale_relevance:
    tier: toy
    justification: >-
      Reduced-round AES-128 only, N=16 keys Stage 1, single machine, program-local
      predicates. No transfer to full-round AES. Published figures are POINTERS
      under R3, never margins.
    correspondence: null

  tail_checks:
    - Report per-key ACCEPT counts, not only aggregates.
    - Report ablation ratios separately on AES and control.
    - Report graded r={4,5,6} excess individually; non-decay voids reading.
    - Report sibling misaligned arm; unexpected excess localises geometry bug.
    - Never tune P_RD / F_fp thresholds after seeing AES primary outcomes.

  replication:
    seeds: [2026091001, 2026091002, 2026091003, 2026091004, 2026091005, 2026091006, 2026091007, 2026091008, 2026091009, 2026091010, 2026091011, 2026091012, 2026091013, 2026091014, 2026091015, 2026091016]
    independent_instances: 16
    note: >-
      Stage 1 requires N>=16 independent keys (IDEA minimal_test). Each seed
      derives one key and its adaptive transcript under the frozen schedule.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 8
    maximum_runs: 32
    maximum_workers: 1
    protection_note: >-
      Memory is machine protection. Time/CPU estimates are advisory under
      docs/research-budget-policy.md. Scientific N=16 keys is frozen and not a
      budget veto.

  stopping_rules:
    - Stop if FIPS-197 pin fails; report infrastructure, never a distinguisher negative.
    - Stop if null/sibling controls were not committed before AES primary arms.
    - Stop if adaptive schedule was not hash-committed before AES arms.
    - Stop at maximum_runs or memory protection; checkpoint partial cells as infrastructure.
    - Do not retune P_RD / F_fp after seeing AES outcomes; amendments are additive only.
    - Do not enter Stage 2 under this contract.

  invalidation_rules:
    - Timeout, crash, or OOM => failed_infrastructure; never negative mathematical evidence.
    - Citing recalled published ACC/ACP as a completion margin => invalid_measurement (R3).
    - Mixing measured and modelled costs in one Stage-1 primary column => invalid_measurement.
    - Missing null, ablation, sibling, or graded arm in the same invocation set => invalid_measurement.
    - Parameters differing from this frozen contract => different experiment; new contract required.
    - Overwriting specification.yaml or prior run receipts => evidence-integrity failure.

  success_criterion: >-
    Stage 1 success (program-adjudicable positive): ALL of (1) FIPS-197 pin
    passed; (2) N=16 keys completed for AES-r=5 and 10-round control under
    frozen schedule; (3) AES joint ACCEPT rate exceeds control with one-sided
    p < 0.01 under the pre-registered model AND control FPR stated in bits in
    the same sentence; (4) ablation_ratio_control < ablation_ratio_aes
    (preferential random suppression); (5) graded excess does not increase with
    r; (6) sibling misaligned arm shows no material excess; (7) required
    artifacts present. Meeting (1)–(7) authorizes requesting Stage 2 — it does
    not itself authorize Stage 2.

  falsification_criterion:
    - >-
      Stage 1 falsification (scoped negative, first-class): friend filter
      suppresses AES and control by statistically indistinguishable factors, OR
      control FPR(joint) not below control FPR(P_RD), OR HEUR-FP2 odds-ratio
      AES ≤ control within error — composition path closed for this P_RD.
    - >-
      Artifact tell: excess fails to decay from r=5 to r=6 to r=10 — void the
      reading; do not promote as a distinguisher.
    - >-
      HEUR-FP1: control joint differs from product by >3× beyond sampling error
      — joint thresholds void under HEUR-FP1.

  required_artifacts:
    - manifest.yaml (command, commit sha, dirty-tree, inference block, environment)
    - fips197_pin_receipt.json (KAT agreement vs aes_reduced.py sha256)
    - frozen_query_schedule.json (+ sha256 commitment timestamp)
    - stage1_accept_counts.json (per-key, per-arm AES and control)
    - stage1_primary_stats.json (gap, p-value, FPR bits, ablation ratios, HEUR checks)
    - controls_receipt.json (null, ablation, sibling, graded verdicts; ordering attestation)
    - cm3_stage1_accounting.json (wall clock, peak RSS, query counts by kind)
    - stdout/stderr and exact commands
    - complete failures and exceptions (retained)

  write_scope:
    - experiments/EXP-AES-14352a/implementation/
    - experiments/EXP-AES-14352a/runs/

  stages:
    - id: stage0_optional_smoke
      authorized: true
      claim_status: non_claim_scaffolding
      purpose: Program-local friend-pair smoke on control-side pattern rates.
    - id: stage1_decisive_ablation
      authorized: true
      claim_status: adjudicable_vs_REF_ABC
      purpose: Preferential random-suppression test for P_RD AND F_fp at r=5.
    - id: stage2_cm3_vs_ref_b
      authorized: false
      gated_on: Stage 1 preferential random suppression + superseding Coordinator decision
      purpose: End-to-end CM-3 cost baseline vs REF-B on the same machine.

  derivation_provenance:
    tool: coordinator subagent, /design-experiment under standing user authorization
    source_record: IDEA-20260910-321d6a
    authored_at: '2026-09-10'
    note: >-
      Stages, controls, predictions, heuristics HEUR-FP1/HEUR-FP2, falsifiers, and
      REF-A/B/C adjudication are taken from IDEA-20260910-321d6a. FIPS-197 pin path
      and sha256 from RQ-AES-003 / GOAL-AES-001 harness. No run results invented.

  recorded_at: '2026-09-10T17:45:00Z'
