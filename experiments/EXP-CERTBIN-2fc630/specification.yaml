# EXP-CERTBIN-2fc630
# Trace-membership class sizes. No oracle.
# Approved by DEC-20261002-e81831.
experiment:
  id: EXP-CERTBIN-2fc630
  hypothesis_id: H-CERTBIN-e94d68
  source_idea: IDEA-20260926-a79052
  question_id: RQ-CERTBIN-836ce2
  version: 1
  title: Trace-membership class sizes
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-e81831
  objective: >-
    Count Tr(x + a + x^{-2}) on the nonzero elements of two binary
    fields. Reject an equal split. Subtract the written floor
    exponents.
  inputs:
    fields:
      - {n: 5, modulus: 37, nonzero: 31, a0_tr0: 21, a0_tr1: 10, difference: 11}
      - {n: 17, modulus: 131081, nonzero: 131071, field_trace_zeros: 65536, a0_tr0: 65485, a0_tr1: 65586, a1_tr0: 65586, a1_tr1: 65485, difference: 101}
    odd_nonzero: true
    half_field: 65536
    gap_hundredths: 777
    gap_above_770: true
    gap_below_780: true
    reduced_gap_hundredths: 677
    reduced_gap_positive: true
  controls:
    - >-
      An equal split of the 131071 nonzero elements is false. That
      count is odd. Reporting equal classes invalidates the run.
    - >-
      A satisfying count of 65536 at n = 17 and a = 0 is false.
      The trace-zero class has 65485 elements. Reporting 65536
      invalidates the run.
    - >-
      The floor gap at most 7.7 bits is false. 777 is strictly
      above 770. Reporting that invalidates the run.
    - >-
      A one-bit reduction putting the floor at or below rho is
      false. 677 is strictly above 0. Reporting that invalidates
      the run.
    - Two field routes. They must not import each other.
  independent_variables:
    - field
    - route in {trace_count, repeat_module}
  metrics:
    primary:
      - class_sizes
      - difference
      - equal_split_rejected
      - implementations_agree
    secondary:
      - gap_hundredths
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Two class sizes at n = 17 and one difference at n = 5.
    formula: >-
      The membership bit is the field trace of x + a + x^{-2} for
      nonzero x. Trace is the sum of the Frobenius orbit. The
      nonzero count 2^n-1 is odd. The floor gap in hundredths is
      6858-6081. Subtracting 100 hundredths leaves 677.
    source: >-
      IDEA-20260926-a79052 states the identity and says the
      condition holds for exactly half the nonzero elements, read
      2026-10-02. The class sizes were counted in this design
      session on the two named moduli. That count is not a run.
      The two classes are unequal. No oracle was run.
  scale_relevance:
    tier: toy
    justification: Two field counts. No transfer to an attempt cost.
    correspondence: null
  tail_checks:
    - The n = 17 field is required. Stopping after n = 5 and still reporting the n = 17 classes is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other field route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the n = 17 classes are reported equal, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The n = 17 classes are reported equal.
    - The a = 0 trace-zero class is reported as 65536.
    - The floor gap is reported at most 7.7 bits.
    - The one-bit-reduced gap is reported nonpositive.
    - An oracle or a refutation share is reported.
  success_criterion: >-
    Both runs agree on the n = 5 classes 21 and 10, the n = 17
    classes 65485 and 65586 at a = 0, the swapped pair at a = 1,
    the difference 101, the field-trace count 65536, and the gaps
    777 and 677. The classes stay unequal. The gap 777 stays
    strictly above 770 and strictly below 780.
  falsification_criterion: >-
    The runs agree, the classes stay unequal, the reduced gap stays
    positive, and any class size differs from the preregistered
    table.
  required_artifacts:
    - experiments/EXP-CERTBIN-2fc630/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CERTBIN-2fc630/runs/<RUN-ID>/command.txt
    - experiments/EXP-CERTBIN-2fc630/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CERTBIN-2fc630/runs/<RUN-ID>/stderr.log
    - experiments/EXP-CERTBIN-2fc630/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CERTBIN-2fc630/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any oracle, refutation share, or attempt-cost measurement.
    - A claim that the filter helps or does not help.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
