experiment:
  id: EXP-EWALK-36ab1f
  hypothesis_id: H-EWALK-29cb90
  derived_from_idea: IDEA-20260807-18d2f7
  question_id: RQ-EWALK-8fa147
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    The quotient ladder with both degenerate ends - enumerative verification of class counts and orbit
    structure at toy size, separately instrumented per-step canonicalisation and per-collision
    disambiguation counters measuring the charged gain against a forced 1/sqrt(h) decay, a baseline
    reproduction of the 0.886 negation constant, and a subfield-curve proves-too-much control the
    argument must FAIL to bound
  objective: >-
    The one uncertainty a run reduces is which cost actually bounds the equivalence-class lane, and
    therefore what a closure of it would be a closure OF. A run establishes (i) by direct enumeration
    at toy size that the full endomorphism-action quotient has exactly 2 classes, that scalar orbits
    are free of size ord(lambda), that orbit sums are the point at infinity, and that the h = 2
    quotient has (N-1)/2 + 1 classes; (ii) from SEPARATE instrumented counters, the measured charged
    gain of an enumeratively canonicalised quotient as h varies, against the forced 1/sqrt(h) decay -
    the measurement that supports or refutes the claim that per-step canonicalisation alone binds;
    (iii) the measured spurious candidate-collision count, which is the assumption the conditional
    payoff rests on; (iv) reproduction of the 0.886 baseline constant at h = 2; and (v) a subfield or
    Koblitz nearby object where the argument MUST fail to bound the observed gain. The primary written
    deliverable is the ladder with both degenerate ends, the two-threshold cost analysis, the
    conditional payoff stated WITH its unmet prerequisite, and an explicit OPEN or CLOSED status per
    rung. No attack is proposed, no exponent is moved, and the conditional N^{1/3} is not a claim.
  what_this_is_not:
  - >-
    Not an attack, not an algorithm, not a speedup, and not a claim that any exponent moves. Every
    realisable rung is at exponent 1/2 with a constant factor at most sqrt(6) over F_p.
  - >-
    NOT a claim that a cheap large-order orbit invariant exists, and NOT a claim that none exists. The
    open rung is written as OPEN, and getting that quantifier wrong in either direction is the single
    most likely way this contract could do harm.
  - >-
    Not a closure of the lane. The endomorphism-resource part is bounded; the encoding-resource question
    it surfaces is handed on with its payoff attached and is not settled here.
  - >-
    Not a statement about extension fields, subfield curves, composite orders or supersingular curves,
    where the analysis does not apply - which the nearby-object control demonstrates rather than asserts.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has
    been executed under this contract.
  claim_ceiling:
    tier: toy_plus_derivation
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - on the executed toy curves, the enumerated class counts, orbit sizes and
      orbit sums take stated values; the instrumented charged gain under enumerative canonicalisation takes
      stated values as h varies; the spurious-collision count takes a stated value; the h = 2 constant
      reproduces 0.886; and the subfield nearby object exceeds sqrt(6) as it must. Plus the written ladder
      and its derivations. WHAT DOES NOT FOLLOW - no exponent claim of any kind; nothing about whether a
      cheap invariant exists; and specifically NOT the N^{1/3} figure, which is the value of an OPEN rung
      conditional on an object not known to exist and may not be quoted without that prerequisite.
  inputs:
    procedure: >-
      STAGE 0, zero compute, and it is the entire primary deliverable - write the ladder with each rung
      carrying its subgroup H, its order h, the realisability of its action and at what cost, the
      canonicalisation cost, the resulting gain, and the curve condition it requires; the two-threshold cost
      analysis with per-step and per-collision accounting written SEPARATELY and their thresholds computed;
      the conditional payoff calculation with its prerequisite unmet and labelled; the generic-group
      consistency argument written carefully enough to be independently audited; and the candidate-invariant
      failures with an explicit statement that they are not exhaustive. Quantifier discipline is enforced -
      the open rung is written as OPEN.
      STAGE 1, minutes, known-answer checks on one or more toy curves - enumerate and verify that the
      full-scalar quotient has exactly 2 classes; that scalar orbits have size ord(lambda) and partition G
      minus the identity freely; that the orbit sum is the point at infinity for every orbit; and that the
      h = 2 quotient has (N-1)/2 + 1 classes. Each is a one-line prediction and each fails loudly if wrong.
      STAGE 2, minutes - the INSTRUMENTED WALK. Run a distinguished-point walk on the quotient for
      h in {2, 3, 4, 6, 8, 12} with enumerative canonicalisation, with THREE SEPARATE counters - group
      operations spent on walk steps, on canonicalisation, and on collision resolution. Report the charged
      gain (baseline operations divided by total charged operations) against the forced 1/sqrt(h), and report
      the spurious candidate-collision count per run.
      STAGE 3, minutes - the h = 2 baseline reproduction against the frozen 0.886 convention, to three
      decimal places, and the symbolic check sqrt(pi)/2 = 0.8862269.
      STAGE 4, minutes, PROVES-TOO-MUCH CONTROL - the same instrumented walk on a subfield or Koblitz curve
      where a cheaply computable map of order above 6 exists. The measured charged gain there MUST exceed
      sqrt(6). If the ladder's cost model bounds it too, the model proves too much and is void.
      STAGE 5, zero compute - file the generic-group simulability question as an explicit oracle-class audit
      request, and file the invariant-rational-function question with the encoding-resource lanes, with the
      payoff attached. The cheapest decisive action in the whole design is the simulability request - a
      simulator would close the rung at zero compute.
    instrument: >-
      Exhaustive enumeration on toy curves for the class counts and orbit structure, so those checks are exact
      integer statements. An instrumented distinguished-point walk with THREE separate group-operation
      counters - step, canonicalisation, collision resolution - which is the whole point, since pooling them is
      the confusion this contract exists to remove. Pure Python; no algebra system required. Recorded through
      harness/runner.py.
    parameters: >-
      Toy prime-order curves over prime fields with p > 3, small enough that G can be enumerated exhaustively;
      at least two distinct curves so an implementation fault can be separated from a refutation. Scalar orders
      h in {2, 3, 4, 6, 8, 12} for the instrumented sweep, with lambda of the stated multiplicative order
      constructed explicitly. Distinguished-point rate declared in Stage 0 and held fixed across h. At least
      20 independent walk seeds per h so the charged gain has a spread. One subfield or Koblitz curve for the
      proves-too-much control, with its cheap map named.
  controls:
  - >-
    DEGENERATE END ONE, h = 1 - no quotient. FORCED gain exactly 1.0. A derivation predicting a gain here would
    be manufacturing an effect.
  - >-
    DEGENERATE END TWO, h = N-1 - the full scalar action. FORCED exactly 2 classes and ZERO usable information.
    Both ends must be checked, because a ladder that gains at either end is not modelling the quotient at all.
  - >-
    BASELINE REPRODUCTION, h = 2 - the negation walk must reproduce 0.886 sqrt(N) to three decimal places,
    against both the frozen convention and the symbolic sqrt(pi)/2 = 0.8862269. Failure voids every rung.
  - >-
    DECAY REQUIREMENT, the artifact tell - the net charged gain under enumerative canon must DECAY monotonically
    as 1/sqrt(h), while the gain under FREE canon grows as sqrt(h). A cost model in which the gain does not
    respond to h in opposite directions under the two canon assumptions is not charging canonicalisation at all,
    and that is this design's canonical artifact tell.
  - >-
    PROVES-TOO-MUCH CONTROL, MUST FAIL TO BE BOUNDED - a subfield or Koblitz curve where a cheaply computable
    map of order above 6 exists and the corresponding speedup is classical. The measured charged gain there must
    EXCEED sqrt(6), and the ladder's argument must be seen not to bound it. An argument that also bounds this
    object proves too much and is void regardless of its other numbers.
  - >-
    SECOND-CURVE REPLICATION - every Stage 1 enumeration check is run on at least two distinct toy curves, so a
    failure can be attributed to an implementation fault or to a genuine refutation rather than left ambiguous.
  - >-
    COUNTER SEPARATION, checked - the three group-operation counters must sum to the total charged operations
    and must be reported separately in every row. A run reporting only a total has not made the measurement the
    contract exists to make.
  - >-
    QUANTIFIER AUDIT, zero compute, blocking on the written deliverable - the ladder document is checked against
    its own quantifier_order block, in particular that it does NOT assert the non-existence of a cheap invariant.
    A document that does is rejected and rewritten before anything else is reported.
  independent_variables:
  - the scalar subgroup order h
  - canonicalisation regime - enumerative versus hypothetical free
  - curve family - prime-field ordinary versus subfield or Koblitz nearby object
  - walk seed
  metrics:
    primary:
    - >-
      class_count_full_scalar_quotient - the number of equivalence classes under the full scalar action, by
      exhaustive enumeration, an integer. FORCED exactly 2.
    - >-
      orbit_size_and_freeness - the measured orbit size for each lambda against ord(lambda), and the count of
      nonzero fixed points, integers. FORCED ord(lambda) and 0 respectively.
    - >-
      orbit_sum_identity_violations - the number of orbits whose sum is not the point at infinity, an integer.
      FORCED 0.
    - >-
      charged_gain(h) - baseline group operations divided by total charged group operations under enumerative
      canonicalisation, dimensionless, per h, with a spread over walk seeds. FORCED to decay as 1/sqrt(h).
    - >-
      counter_split(h) - group operations attributed to walk steps, to canonicalisation, and to collision
      resolution, reported SEPARATELY and required to sum to the total. This is the measurement that separates
      COST 1 from COST 2.
    - >-
      h2_constant - the measured leading constant of the h = 2 negation walk, dimensionless. FORCED 0.886 to
      three decimal places.
    - >-
      subfield_charged_gain - the measured charged gain on the nearby-object curve, dimensionless. FORCED
      STRICTLY ABOVE sqrt(6) = 2.449.
    secondary:
    - >-
      spurious_collision_count per run per h - the number of candidate class collisions requiring disambiguation,
      an integer. Predicted O(1); growth in h falsifies the conditional payoff's assumption.
    - >-
      class_count per rung against the predicted (N-1)/h + 1, by enumeration, integers.
    - >-
      the derived gain per rung reported in TWO SEPARATE COLUMNS, free-canon and enumerative-canon, never mixed.
    - >-
      the curve condition each rung requires - the discriminant value and the congruence on p.
    - >-
      explicit OPEN or CLOSED status per rung, with the open one labelled by its resource class.
    - >-
      the written generic-group consistency argument, as an artifact submitted for independent audit rather than
      as a result.
  heuristic_under_test: HEUR-EWALK-29C-2
  preregistered_prediction:
    quantity: >-
      charged_gain(h) under enumerative canonicalisation; class_count_full_scalar_quotient; h2_constant; and
      subfield_charged_gain.
    formula: >-
      charged_gain(h) = 1/sqrt(h) under enumerative canonicalisation, decaying monotonically, below 1 for every
      h >= 2 and below 0.5 by h = 4; while under free canonicalisation the gain would be sqrt(h), growing - the
      two must move in OPPOSITE directions in h or the cost model is not charging canonicalisation.
      class_count_full_scalar_quotient = 2 exactly. Class count at scalar order h = (N-1)/h + 1 exactly.
      h2_constant = sqrt(pi)/2 = 0.8862269 to three decimals. subfield_charged_gain strictly above
      sqrt(6) = 2.449. spurious_collision_count is O(1) in h.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-18d2f7, parts (B) and (C), its null_object_control and
      its predictions block, before any run under this contract exists. The 0.886 convention is this program's
      frozen baseline and the value 0.8862269254527579 is recorded in a staged artifact rather than recalled.
      The N^{1/3} balance is recorded in the same proposal as a CONDITIONAL DERIVATION with an unmet prerequisite
      and is deliberately NOT among the quantities this run measures.
  scale_relevance:
    tier: toy
    justification: >-
      The enumeration checks require the whole group to be enumerable, which caps the toy order; the instrumented
      gain measurement requires many completed walks, which caps it again. Both are appropriate, because every
      quantity measured here is EXACT or SCALE-FREE - a class count is an integer identity, the charged gain
      1/sqrt(h) has no N-dependence, and the 0.886 constant is asymptotic in a way that toy sizes approach
      closely enough for a three-decimal check. What toy scale CANNOT do is say anything about the open rung,
      whose object is a function on a fixed curve and whose existence is not a scale question at all. That
      asymmetry is why the contract's most valuable action - the simulability audit - costs no compute.
    correspondence: null
  tail_checks:
  - >-
    Report the charged gain per seed, not only its mean, since a gain claim resting on one lucky walk would be
    invisible in an average.
  - >-
    Report the maximum spurious-collision count observed, not only the mean, because the conditional payoff's
    assumption is about the count being bounded rather than small on average.
  - >-
    Report the counter split at the largest h measured, where canonicalisation should dominate; a split that does
    not shift toward canonicalisation as h grows means the counters are not attributing correctly.
  - >-
    Report the enumeration checks on both toy curves separately, so that agreement is a replication and
    disagreement localises to a curve.
  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1.0
    maximum_memory_gb: 4
    maximum_runs: 10
  stopping_rules:
  - >-
    HALT and report if any Stage 1 enumeration check fails on both toy curves - the ladder's arithmetic is wrong
    and no rung is reportable.
  - >-
    HALT the cost-model conclusion if the three counters do not sum to the total charged operations. The
    measurement the contract exists to make was not made.
  - >-
    REJECT the written deliverable, before any measurement is reported, if the quantifier audit finds it asserting
    the non-existence of a cheap invariant. Rewrite first.
  - >-
    Stop at the declared h set, the declared distinguished-point rate and the declared seed count. No h is added
    after a gain is seen.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop, never a negative
    result (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    A timeout, crash or dependency failure makes the run failed_infrastructure and is NEVER negative mathematical
    evidence (AGENTS.md rule 5).
  - >-
    A run reporting a charged gain without the three-way counter split is invalid_measurement - a pooled total
    cannot separate per-step canonicalisation from per-collision disambiguation, which is the entire subject.
  - >-
    A run whose free-canon and enumerative-canon gain columns are mixed, or reported in one column, is
    completed_invalid.
  - >-
    A run that omits the subfield nearby-object control is invalid_measurement, because without it a cost model
    that proves too much cannot be detected.
  - >-
    A written deliverable that states or implies that no cheap large-order orbit invariant exists is
    completed_invalid regardless of its measurements, since it converts an open problem into a fabricated closure.
  - >-
    A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires a new contract;
    it is never a repair of this one.
  success_criterion: >-
    The run succeeds when ALL of the following hold, each decidable from the primary metrics -
    (1) class_count_full_scalar_quotient is exactly 2 on both toy curves;
    (2) orbit sizes equal ord(lambda) with zero nonzero fixed points, and orbit_sum_identity_violations is 0;
    (3) class counts match (N-1)/h + 1 exactly at every measured h;
    (4) h2_constant reproduces 0.886 to three decimal places;
    (5) charged_gain(h) decays monotonically and matches 1/sqrt(h) within the seed spread at every measured h,
    with the counter split showing canonicalisation dominating as h grows;
    (6) subfield_charged_gain is strictly above 2.449 AND the written argument is seen not to bound it;
    (7) spurious_collision_count is reported per h with its maximum;
    (8) the written ladder carries an explicit OPEN or CLOSED status per rung and passes the quantifier audit.
  falsification_criterion:
  - >-
    class_count_full_scalar_quotient exceeds 2 on any prime-order instance. The top-of-ladder closure is FALSE and
    the scalar image is not all of Z/N, which would contradict the record's basic premise.
  - >-
    An orbit of size other than ord(lambda), or one fixing a nonzero point, or a nonzero orbit sum. The
    corresponding closure is false and every class count in the ladder is wrong.
  - >-
    charged_gain(h) does not decay as 1/sqrt(h) under enumerative canonicalisation. The two-threshold separation -
    this record's main contribution - is unsupported. The counters must be checked first, and if they are sound
    this is a genuine negative for the cost model.
  - >-
    h2_constant misses 0.886. The ladder's arithmetic is wrong and every rung is void.
  - >-
    The argument as written also bounds the subfield nearby object, or subfield_charged_gain does not exceed
    sqrt(6). PROVES TOO MUCH, or the instrument cannot see a real classical speedup. Either way the reasoning is
    void, not merely the numbers.
  - >-
    spurious_collision_count grows with h. HEUR-EWALK-29C-2 is falsified, the conditional payoff's balance shifts
    downward, and every future citation of the conditional figure must carry the measured growth.
  - >-
    A generic-group simulator for the encoding-dependent orbit-label oracle is exhibited. HEUR-EWALK-29C-1 is
    falsified, the open rung is CLOSED, and the lane finishes with a strong obstruction rather than a cost
    argument. This is named as the most valuable possible refutation of the hypothesis and costs no compute.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
  - the written ladder document - every rung with H, h, realisability and cost, canonicalisation cost, gain, curve condition, and explicit OPEN or CLOSED status
  - the two-threshold cost analysis with per-step and per-collision accounting written separately and their thresholds computed
  - the conditional payoff calculation with its unmet prerequisite stated in the same sentence as the figure
  - the generic-group consistency argument, submitted as an artifact for independent audit and flagged as unaudited
  - raw-result.json carrying the three-way counter split per (h, seed), the enumeration check results per curve, and the spurious-collision counts
  - the subfield nearby-object arm's measurements, in the same file as the prime-field arm
  - the quantifier audit's verdict on the written deliverable
  - the filed audit request for the simulability question and the filed hand-off of the invariant-function question with its payoff attached
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator drafting does not confer approval. This contract is review_required and is NOT approved;
    approved_by is null and execution_authorized is false. Approval is the user's gate because it authorizes
    execution and spends compute.
  - >-
    The written deliverable makes a generic-group NON-SIMULABILITY argument. That argument must be routed to
    independent audit as a condition of approval - it is the hypothesis's weakest link by the parent proposal's
    own estimate, and a simulator found there would close the lane at zero compute.
  - >-
    The conditional N^{1/3} figure must never appear in any summary without its unmet prerequisite in the same
    sentence. Approval should make that an explicit reporting condition, because quoting it bare would be a
    serious overclaim and is the most likely way this work is misread.
  - >-
    The subfield or Koblitz curve used for the proves-too-much control, and its cheap map, must be named before
    approval. Chosen afterwards, it could be selected to pass.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260807-18d2f7
    authored_at: '2026-08-25'
    note: >-
      The ladder, the two degenerate ends, the two-threshold cost separation, the forced 1/sqrt(h) decay under
      enumerative canon, the 0.886 baseline reproduction, the subfield nearby-object control that the argument
      must fail to bound, and the quantifier discipline around the open rung are taken from the parent proposal's
      claim, proof_search_map, null_object_control and minimal_test, restated as measurable quantities with units.
      The parent proposal's optional Stage 6 known-answer checks are promoted here into a blocking Stage 1,
      because a written ladder whose class counts were never enumerated is an assertion rather than a result.
      Budgets follow the parent's declared low implementation and low compute.
  derivation_gaps:
  - >-
    The generic-group non-simulability argument is the record's weakest link, is explicitly flagged as requiring
    independent audit by its own author, and is carried here as an artifact rather than a finding. Until it is
    audited, the consistency of the conditional payoff with the generic-group bound is UNESTABLISHED, and this
    contract cannot establish it.
  - >-
    The candidate-invariant failures are not exhaustive and the parent proposal says so. This contract therefore
    cannot support any statement about whether a cheap invariant exists, and its success criterion deliberately
    contains no such item.
  - >-
    The instrumented sweep uses h in {2, 3, 4, 6, 8, 12}, but h = 4 and h = 6 have FREE canonicalisation only on
    curves with specific discriminants, while h = 8 and h = 12 have no cheap action at all on a generic curve. The
    contract measures the ENUMERATIVE-canon gain uniformly, which is well defined at every h, but the free-canon
    column is available only at the rungs whose curve condition holds, and the parent proposal does not specify
    which curves to use for those. It must be fixed before approval.
  - >-
    The distinguished-point rate is not specified by the proposal and materially affects the spurious-collision
    count, which is the quantity HEUR-EWALK-29C-2 concerns. It is declared in Stage 0 here but the CHOICE is owed
    before approval.
  - >-
    The parent proposal notes that on subfield and Koblitz curves cheap large-order maps do exist and the
    corresponding speedups are classical. That fact makes the proves-too-much control possible, but it also means
    the open rung's premise - that no such map exists over F_p - is a statement about F_p specifically that this
    contract records rather than establishes.
