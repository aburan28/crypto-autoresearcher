protocol_amendment:
  id: PA-ECDLP-ac7e8b-v2-2-custody-replay-closure
  experiment_id: EXP-ECDLP-ac7e8b
  version_from: '2.1'
  version_to: '2.2'
  recorded_at: '2026-09-08'
  triggering_review: TASK-20260908-77c865
  disposition: >-
    Additive prospective custody repair. No implementation, fixture, runtime or
    scientific run has occurred; implementation and execution remain unauthorized.
  timeout_authority_target:
    required_payload: [experiment_id,campaign_id,attempt_id,root_ordinal,terminal_code,causal_event_sha256,final_identity_commitment_sha256,authorized_before_registry_ordinal,coordinator_record_id,coordinator_record_sha256]
    acceptance: >-
      TIMEOUT_CENSORED is valid only when every payload value exactly matches the
      final receipt and its registry position, the cited record is Coordinator
      authored and hash-valid, and its authorization precedes the terminal event.
    reject: [cross_root_authority_replay, wrong_terminal_code, late_authority, final_identity_mismatch]
  rank_owner_and_slot_inventory:
    process_binding: >-
      rank_owner_id and process_incarnation_id must reference one immutable
      registry launch hash plus cgroup/process identity digest. A different launch
      requires a Coordinator-authorized handover hash before its first update.
    coverage: >-
      Every sealed root/component/phase slot has exactly one receipt status. An
      omitted EC slot must cite a preceding terminal causal-event hash. The final
      rank inventory is rebuilt from this complete slot inventory and independently
      checks each relation status before accepting a rank-state transition.
    reject: [process_label_reuse, missing_component_slot, unjustified_omission, relation_status_reclassification]
  cpu_io_interval_accounting:
    canonical_source: >-
      Every CPU/IO coordinate names counter_source_id, monotonic counter start/end,
      clock domain, launch hash and immutable trace digest. For one source, accepted
      intervals form a disjoint ordered partition; vectors are canonical endpoint
      differences and aggregate once over the source range.
    reject: [overlapping_cumulative_cpu, overlapping_cumulative_io, duplicate_counter_range, noncanonical_difference]
  wall_interval_accounting:
    canonical_scope: >-
      Every active wall interval names common_monotonic_clock_domain, start_ns,
      end_ns, launch hash and reporting_scope_id. Reported stage/campaign wall is
      one union over all intervals in that scope; per-process unions are diagnostics
      and cannot be added to it.
    reject: [cross_provenance_wall_alias, cross_process_overlap_summed, mismatched_clock_domain]
  future_admission_controls: [cross_root_timeout_replay, process_label_reuse, sealed_EC_slot_omission, overlapping_cpu_io_ranges, cross_provenance_wall_overlap]
  does_not: [approve_implementation, approve_execution, change_hypothesis_or_goal, create_scientific_evidence]
