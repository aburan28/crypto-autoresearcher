protocol_amendment:
  id: PA-ECDLP-ac7e8b-v2-6-component-inventory-closure-e3815f
  experiment_id: EXP-ECDLP-ac7e8b
  version_from: '2.5'
  version_to: '2.6'
  recorded_at: '2026-09-08'
  triggering_review: TASK-20260908-5f236e
  correction_record: CORR-20260908-e3815f
  disposition: >-
    Additive prospective schedule-key repair. It fixes the exact component
    ordinal map and phase eligibility that v2.5 required but the frozen
    appendix only counted. No implementation, fixture, runtime, receipt, or
    scientific run exists; implementation and execution remain unauthorized.
  schedule_component_inventory:
    inventory_schema_version: sdeg_schedule_component_inventory_v1
    canonical_component_descriptor:
      exact_keys: [family, ordinal]
      family_enum: [calibrator, planted_positive, main_decomposition, baseline]
      ordinal_type: JSON integer
      no_extra_keys: true
    family_to_ordinal_map:
      calibrator:
        ordinal_range: [0, 24]
        derivation: >-
          ordinal = 5 * program_index + multiplier_index, where program_index
          follows the appendix calibration.programs order and multiplier_index
          follows calibration.multipliers order.
        entries:
          - {ordinal: 0, program_id: schoolbook, multiplier: 1}
          - {ordinal: 1, program_id: schoolbook, multiplier: 2}
          - {ordinal: 2, program_id: schoolbook, multiplier: 4}
          - {ordinal: 3, program_id: schoolbook, multiplier: 8}
          - {ordinal: 4, program_id: schoolbook, multiplier: 16}
          - {ordinal: 5, program_id: square, multiplier: 1}
          - {ordinal: 6, program_id: square, multiplier: 2}
          - {ordinal: 7, program_id: square, multiplier: 4}
          - {ordinal: 8, program_id: square, multiplier: 8}
          - {ordinal: 9, program_id: square, multiplier: 16}
          - {ordinal: 10, program_id: inverse, multiplier: 1}
          - {ordinal: 11, program_id: inverse, multiplier: 2}
          - {ordinal: 12, program_id: inverse, multiplier: 4}
          - {ordinal: 13, program_id: inverse, multiplier: 8}
          - {ordinal: 14, program_id: inverse, multiplier: 16}
          - {ordinal: 15, program_id: add, multiplier: 1}
          - {ordinal: 16, program_id: add, multiplier: 2}
          - {ordinal: 17, program_id: add, multiplier: 4}
          - {ordinal: 18, program_id: add, multiplier: 8}
          - {ordinal: 19, program_id: add, multiplier: 16}
          - {ordinal: 20, program_id: division_neg_power, multiplier: 1}
          - {ordinal: 21, program_id: division_neg_power, multiplier: 2}
          - {ordinal: 22, program_id: division_neg_power, multiplier: 4}
          - {ordinal: 23, program_id: division_neg_power, multiplier: 8}
          - {ordinal: 24, program_id: division_neg_power, multiplier: 16}
      planted_positive:
        entries:
          - {ordinal: 0, target: R_plant, method: EC_decomposition}
      main_decomposition:
        entries:
          - {ordinal: 0, arm: EC}
          - {ordinal: 1, arm: curve_free_null}
      baseline:
        entries:
          - {ordinal: 0, method: rho}
          - {ordinal: 1, method: BSGS}
    phase_eligibility:
      relation_collection_node_phases: [warmup, primary, profile]
      warmup: every component descriptor in family_to_ordinal_map is eligible.
      primary: every component descriptor in family_to_ordinal_map is eligible.
      profile: >-
        Every component descriptor is eligible if and only if the resolved root
        mode is timing. No profile schedule node exists for a counting root.
      admission: >-
        Not a relation_collection schedule-node phase. Admission controls are
        separately declared future admission artifacts and must not appear in
        sealed_schedule_inventory or target_registry stage entries.
    required_schedule_node_inventory_validation: >-
      Before hashing an inventory row, validate its closed component descriptor
      against family_to_ordinal_map; validate its family-specific named fields
      against the unique mapped entry; resolve root_ordinal to its deterministic
      load/mode from the frozen rotated schedule; and validate phase_eligibility.
      The complete inventory is the exact cartesian construction over every
      sealed campaign and root, each permitted component descriptor, and each
      permitted phase. Reject an omitted tuple, extra tuple, alternate ordinal
      base, ordinal outside the map, a family/name mismatch, profile for a
      counting root, admission phase, or an inventory row that does not match
      its canonical schedule_node_key before inventory_sha256 or any target
      registry hash is computed.
  integration_with_v2_5:
    replaces: >-
      v2.5.wall_interval_accounting.schedule_node_key.component and the
      v2.5 sealed_schedule_inventory validation rule only as necessary to bind
      their formerly implicit family-specific inventory.
    preserved: >-
      V2.5 closed locator schemas, physical-counter semantic uniqueness,
      canonical JSON rules, target-registry exact keys, and all prior direct
      alias protections remain in force.
  future_admission_controls:
    - calibrator_ordinal_25_rejected
    - calibrator_ordinal_0_to_24_exact_map
    - alternate_calibrator_ordinal_base_rejected
    - calibrator_program_multiplier_map_mismatch_rejected
    - profile_phase_for_counting_root_rejected
    - admission_phase_as_relation_collection_node_rejected
    - missing_or_extra_component_inventory_tuple_rejected
  does_not: [approve_implementation, approve_execution, change_hypothesis_or_goal,
    create_scientific_evidence]
