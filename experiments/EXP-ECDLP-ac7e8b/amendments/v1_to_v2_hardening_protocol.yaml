protocol_amendment:
  id: PA-ECDLP-ac7e8b-v1-to-v2-hardening
  id_allocation_provenance: >-
    Protocol-amendment identifiers are not allocated by tools/allocate_id.py.
    This deterministic label is unique for EXP-ECDLP-ac7e8b version 1 to 2;
    the authoring handoff ID is independently random-allocated and checked.
  experiment_id: EXP-ECDLP-ac7e8b
  hypothesis_id: H-ECDLP-004445
  version_from: 1
  version_to: 2
  authoring_task: TASK-20260908-73c89b
  amended_at: '2026-09-08'
  triggering_decision: DEC-20260908-ec4a02
  predecessor_specification: experiments/EXP-ECDLP-ac7e8b/specification.yaml
  predecessor_sha256: 87c47b87963ec3baad66b0c2bed87d194712be73535f5038764c12c60a3eb656
  disposition: >-
    This is an additive repair proposal. It does not approve implementation or
    execution. The v1 record and all prior reports remain immutable; v2 can be
    used only after a fresh, source-bound independent hardening round and a
    later Coordinator decision.
  preserved:
    scientific_instances: 20 instances for each of the ten fixed cells
    root_schedule: 1600 sealed roots, 800 in each mode
    component_schedule: 48000 warmup plus 48000 primary plus 24000 profile evaluations
    scientific_execution_authorized: false
    implementation_authorized: false
    hypothesis_status: proposed
    certificate_kind: none
    scientific_observations: []
  normative_precedence:
    - This amendment governs every future v2 implementation interface listed below.
    - The v1 specification and protocol appendix describe the reviewed predecessor.
    - A conflict in a listed interface is resolved by this amendment; other v1 fields remain unchanged.

  pairing_and_statistics:
    pair_identity:
      pair_id: >-
        SHA256 of JCS object {experiment_id:"EXP-ECDLP-ac7e8b",version:"2",
        cell_id,instance_index,load,component,stage_set:"relation_collection+verification",
        fixture_sha256,work_input_sha256,algorithm_sha256,source_sha256}; mode,
        attempt_id, segment_id, phase, and profile order are excluded.
      profile_audit_id: >-
        SHA256 of JCS object {pair_id,phase:"profile",mode:"timing",
        profile_stage_set:"relation_collection+verification",profile_input_sha256}.
      cardinality: >-
        Each primary pair has exactly one complete counting primary row and one
        complete unprofiled timing primary row with the same pair_id, input and
        source hashes, plus exactly one timing profile audit with profile_audit_id.
        Duplicate, absent, cross-hash, mode-mismatched, or phase-mismatched joins
        are implementation-admission failures.
      required_row_keys: [pair_id, profile_audit_id, fixture_sha256, work_input_sha256, algorithm_sha256, source_sha256, stage_set_id]
    primary_estimand:
      stage_set_id: relation_collection_plus_independent_verification_v1
      T_primary: >-
        The exact union length in ns of the unprofiled timing-mode primary
        producer relation_collection interval and independent verifier interval
        for this pair_id. Worker startup/import, burner-ready wait, warmup,
        profile, inter-process gaps, serialization, baselines, controls and all
        other workflow intervals are outside T_primary and remain separately
        retained resource stages.
      W_primary: >-
        The exact integer weighted sum M+S+100*I+A of the labeled producer_Fp
        and verifier_Fp counting-mode primary vectors over exactly the T_primary
        stage set for the same pair_id. Producer-only and verifier-only vectors
        are retained diagnostics and cannot replace their labeled sum.
      profile_rule: >-
        Profile audits are count-disabled, contribute no estimator clock or W,
        and measure the same named stage set on a fresh timing worker. Their
        only primary role is boundary eligibility and perturbation reporting.
    tolerance_and_intervals:
      tau: {numerator: '1', denominator: '20'}
      comparison: >-
        All load-bearing comparisons use exact rational outward log intervals.
        No binary64 value, formatted decimal, epsilon, or rounded display decides
        a boundary. Refine collectively through 512 bits; unresolved comparison
        is inconclusive. Agreement is closed within [-tau,+tau]; disagreement
        is strict beyond one common boundary on both estimate and interval.
      bootstrap: >-
        Retain exactly 2000 status rows for every requested edge statistic, with
        index-vector references, undefined_count, and reason counts. Any undefined
        point, endpoint slope, or resample makes the interval endpoints null and
        the delta category inconclusive; finite survivors are never renumbered,
        imputed, trimmed, or used for ranks 50/1950.
    eligibility_and_edges:
      complete_eligible: 20 valid positive paired T_primary/W_primary observations and 20 valid profile fractions.
      profile_excluded: >-
        A complete size excluded solely because the median of its 20 exact profile
        fractions is strictly greater than 1/2. Equality is eligible.
      incomplete: >-
        Any fixture, timing, count, profile, validity, censoring, or positivity
        loss. It makes its family/arm/load slope panel unavailable; it cannot be
        removed to form a survivor panel.
      retained_panel: >-
        Only complete profile_excluded sizes may be omitted. At least four complete
        eligible sizes are required. Local slopes use adjacent cells in the retained
        ordered set; every gap-spanning edge records both endpoint IDs/bits and all
        intervening profile exclusions. An incomplete cell can never create an edge.
      profile_attachment: >-
        Boundary eligibility uses the corresponding main EC or curve-free component,
        family, arm, load and size. Missing or invalid profile data is incomplete,
        not implicitly eligible.
    fixed_target_inventory:
      load_series:
        - main_relation_collection_EC
        - main_relation_collection_curve_free
        - calibrator_program_multiplier_pairs
        - planted_positive_decomposition
        - rho_baseline
        - BSGS_baseline
      load_rule: >-
        Each listed size/arm/component series needs the same 20 valid fixture indices
        at loads 0,1,2,4. Timing monotonicity and load4/load0>=3/2 are evaluated
        only on those declared series. Missing data yields unavailable/inconclusive,
        not target failure. Count invariance uses counting-root vectors only.
      drift_rule: >-
        Drift is only the load-0 main-relation T_primary/W_primary ratio, separately
        for S3/EC, S3/curve_free, S4/EC, and S4/curve_free. It requires all intended
        family sizes complete regardless of profile exclusion. Require positive ratios,
        weak monotonicity and exact max/min>2; report increasing, decreasing,
        flat/both, nonmonotone, or inconclusive without selecting a subset.
      inference_scope: >-
        Bootstrap intervals are descriptive per-edge intervals. No familywide,
        portfolio-wide, or global significance claim is licensed.

  lifecycle_and_costs:
    normal_root_topology: >-
      For every root and each of 30 components: one fresh producer process is
      spawned, performs the phase, exits and is reaped before one fresh
      independent verifier process is spawned, performs verification, exits and
      is reaped. Warmup, primary and (timing-only) profile are distinct component
      phases and share no worker. Counting roots therefore start/reap 120 workers
      (30 warmup plus 30 primary producer/verifier pairs); timing roots start/reap
      180 (the preceding plus 30 profile pairs). Each producer-to-verifier handoff
      has one serialized-public-output record. A profile worker performs profiling;
      no helper, sidecar, overlap, or seventh process is permitted.
    segment_receipt_schema:
      schema: sdeg_v2_segment_receipt
      required: [experiment_id, version, attempt_id, root_ordinal, segment_id, predecessor_segment_id, launch_sha256, checkpoint_sha256, artifact_sha256, resume_from_sha256, receipt_kind, terminal, terminal_code, causal_root_id, segment_chain_head]
      rules: >-
        A checkpoint has receipt_kind=segment and terminal=false. It preserves the
        attempt ID and has one predecessor or null for the first segment. A final
        receipt has receipt_kind=final, terminal=true and names the complete linear
        segment-chain head. The validator rejects missing/multiple finals, segment
        receipts presented as final, changed attempt IDs on resume, and incomplete
        or forked chains. Exactly 1600 sealed roots yield exactly 1600 activated
        roots and exactly 1600 final root receipts.
    terminal_authority:
      checkpoint: >-
        A catchable 3600-second watchdog is a nonterminal machine checkpoint only;
        segment receipt records machine_checkpoint_origin=true and
        asserts_no_campaign_budget_exhaustion=true.
      implementation_failure: >-
        Automatic final only with recorded machine/validator event and causal root.
        Maps root/task to failed_implementation; experiment and goal remain active
        with an impediment and no scientific assertion.
      infrastructure_failure: >-
        Automatic final with machine event; maps root/task to failed_infrastructure.
        It is not mathematical evidence and leaves experiment/goal authority unchanged.
      resource_exhaustion: >-
        Maps root/task to resource_exhaustion only for a frozen non-time machine cap;
        it neither cancels a goal nor exhausts campaign budget.
      timeout_censored: >-
        A discretionary terminal requires a pre-existing Coordinator disposition or
        new amendment authorizing it. The imported cancelled_by_budget mapping is
        retained only as historical adapter metadata, with both machine_checkpoint_origin
        and asserts_no_campaign_budget_exhaustion fields.
      finite_completion: >-
        RELATION_VALID, RELATION_INVALID and NO_RELATION_WITHIN_BUDGET retain the
        imported terminal meanings; the last is the frozen algorithmic search bound,
        never a CPU/campaign-budget claim.
      uncatchable_death: >-
        Retain durable segments; if no valid final can be constructed, record an
        infrastructure or implementation failure with the observed death event and
        do not restart from favorable data.
    failed_first_calibration_matrix:
      causal_root: >-
        Write launch/guard/binding rows, completed calibration and fault rows through
        the first failure, its validator result and hashes; emit omitted rows for every
        downstream planted/main/baseline component and every remaining phase.
      remaining_roots: >-
        Actually start each sealed root, perform startup/guard/binding checks, record
        supervisor/burner administrative resources, execute zero scientific components,
        emit all nominal-phase rows as omitted with causal_root_id, then emit one final
        IMPLEMENTATION_FAILURE receipt. Only the imported synthetic conditional retry
        may be NOT_ACTIVATED.
    rank_and_shared_cost_ownership:
      rank_state: >-
        One fixture campaign has one rank-owner process. Each accepted row records
        input_state_sha256, accepted_row_sha256, output_state_sha256, owner_id and
        serialized update cost. Checkpoints/finalization append to one linear hash
        chain. Summary ranks reference it. An optional final recomputation is a
        distinct verifier computation with independent typed resources.
      shared_objects: >-
        Supervisor, burners, setup, fault audit, bootstrap/summary computation,
        exclusions/load/drift, conservation aggregation, report generation and
        artifact hashing each have exactly one owner object, resource vector and
        allocation fractions including explicit unallocated share. CPU/IO sum once,
        wall intervals union once, and memory is reported by domain plus aggregate
        peak. Referencing a shared object cannot copy its cost.

  certificate_hardening:
    imported_contract:
      path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-002/tasks/TASK-20260722-012/certificate_contract.yaml
      sha256: 1ca204a0e16e88012892a0867aab5ea82d388fdfa1b0474938a0e2c8cffd8d9f
      required_in_next_review_packet: true
      scope: >-
        Full byte-verified contract, including literal hash domains, required fields,
        JCS/decimal canonicalization, terminal vocabulary, ownership fields and all
        nine mutation gates; a digest alone is insufficient.
    deterministic_f5_controls:
      columns: [C000=P=(0,1), C001=-P=(0,4), C002=-2P=(1,2), C003=2P=(1,3), C004=4P=(3,2), C005=-4P=(3,3)]
      cases:
        - {id: negative_summand_positive_target_alias, relation: 'P=2P+(-P)', row_mod_7: [6,1,0,1,0,0]}
        - {id: negative_target_alias, relation: '-P=2P+4P', row_mod_7: [0,6,0,1,1,0]}
        - {id: target_summand_cancellation, relation: '2P=2P+P+(-P)', row_mod_7: [1,1,0,0,0,0]}
      retained_controls: [planted_T_T, planted_T_T_T, clean_F5_rank, wrong_prime_rank]
      rejection_mutations:
        - replace_negative_signed_ID_with_positive_partner => SIGNED_COLUMN_OR_GROUP_SUM_MISMATCH
        - add_duplicate_target_encoding_under_new_ID => COLUMN_SCHEMA_DUPLICATE_ENCODING
        - omit_aliased_target_subtraction => CERTIFICATE_ROW_MISMATCH
      classification: >-
        Admission controls only. They do not alter the 20 random instances, create a
        scientific observation, or assert an attack/certificate result.
    artifact_additions: [pairing-audit.jsonl, profile-eligibility.jsonl, receipt-chain.jsonl, rank-state-chain.jsonl, shared-cost-owners.jsonl, certificate-hardening-controls.jsonl]

  future_gates:
    hardening_review: >-
      Fresh independent source-bound reviews must cover the changed statistics,
      lifecycle/cost, and certificate joints. A reviewer receives the exact amended
      packet and may not be credited with reviewing prior absent bytes.
    implementation_admission: >-
      After a later approval, independently test pair cardinality, phase separation,
      component reconciliation, profiler conservation, raw paired recomputation,
      bootstrap indexing, practical-equivalence known-false cases, receipt mutations,
      rank ownership and all deterministic certificate mutations. These are not
      scientific runs.
    execution: >-
      A separate locked execution authorization, snapshot archive and independent
      evidence review remain required after implementation admission.
  does_not:
    - Approve implementation or scientific execution.
    - Change H-ECDLP-004445, GOAL-SDEG-001, or any prior review verdict.
    - Re-run, rescore, or rewrite a frozen artifact.
    - Turn protocol/admission outcomes into cryptanalytic evidence.
