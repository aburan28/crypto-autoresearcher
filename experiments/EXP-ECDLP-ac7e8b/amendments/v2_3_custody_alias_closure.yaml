protocol_amendment:
  id: PA-ECDLP-ac7e8b-v2-3-custody-alias-closure-f973b3
  experiment_id: EXP-ECDLP-ac7e8b
  version_from: '2.2'
  version_to: '2.3'
  recorded_at: '2026-09-08'
  triggering_review: TASK-20260908-87c933
  correction_record: CORR-20260908-f973b3
  disposition: >-
    Additive prospective custody repair for the two v2.2 alias constructions.
    No implementation, fixture, runtime or scientific run has occurred;
    implementation and execution remain unauthorized.
  cpu_io_interval_accounting:
    canonical_physical_counter_binding: >-
      A counter_source_id resolves to exactly one sealed counter-source binding
      with tuple (launch_sha256, cgroup_or_process_identity_digest,
      counter_namespace, clock_domain). The tuple is the canonical identity:
      two source IDs resolving to equal tuples are aliases and are rejected;
      no source ID may resolve to more than one tuple.
    trace_binding: >-
      Every immutable trace binds its resolved counter-source tuple and the
      identities and ordered values of its samples. A differently serialized
      subset, superset, or re-encoding of samples for the same tuple is another
      trace representation, not another counter source.
    aggregate_rule: >-
      For each canonical counter-source tuple, collect every accepted CPU or IO
      interval from every trace representation that resolves to it. Those
      intervals must form one complete disjoint ordered partition over each
      reported counter range; aggregation occurs exactly once from its canonical
      endpoint differences. A coordinate is rejected if its source label is
      unresolved, aliased, or leaves an overlapping/unaccounted interval.
    reject: [counter_source_alias, noncanonical_counter_binding,
      trace_representation_as_new_source, cross_trace_counter_overlap,
      incomplete_counter_interval_inventory]
  wall_interval_accounting:
    canonical_reporting_scope_binding: >-
      Every reporting_scope_id resolves to exactly one sealed tuple
      (experiment_id, campaign_id, target_kind, target_id,
      common_monotonic_clock_domain), where target_kind is stage or campaign.
      For one target tuple exactly one reporting scope exists; two identifiers
      resolving to it are aliases and are rejected.
    complete_inventory_and_union: >-
      Every active interval contributing to a reported stage or campaign must
      cite that target's canonical reporting scope. The report seals its complete
      contributing-interval inventory and computes its wall total only as the
      union of that inventory on the named common monotonic clock domain.
    sum_precondition: >-
      Separately reported scope totals may be added only for distinct sealed
      target tuples with an explicit, independently checked temporal-disjointness
      proof over their complete common-clock interval inventories. A stage total
      never adds process diagnostics, and a campaign total is its own union
      rather than a sum of overlapping stage or process reports.
    reject: [reporting_scope_alias, noncanonical_reporting_scope_binding,
      scope_split_for_one_target, incomplete_wall_interval_inventory,
      cross_scope_overlap_summed, missing_temporal_disjointness_proof]
  future_admission_controls:
    - direct_cross_root_timeout_replay
    - different_launch_rank_owner_label_reuse
    - sealed_EC_slot_omission
    - two_trace_encodings_for_one_physical_cpu_io_counter
    - overlapping_common_clock_intervals_split_by_reporting_scope
  does_not: [approve_implementation, approve_execution,
    change_hypothesis_or_goal, create_scientific_evidence]
