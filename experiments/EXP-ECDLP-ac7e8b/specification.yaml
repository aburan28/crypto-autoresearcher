  controls:
    - Exact five calibration programs and count formulas for all four event types at every multiplier/fixture/load/mode; independent blind count derivation and deliberate omission/duplication/relabel/output-corruption detection.
    - Bit-identical counting vectors across load and identical paired public outputs/certificates under the same arithmetic algorithm; warmup/measured determinism and actual dtype/backend assertions before interpretation.
    - Complete matched curve-free support/degree/variable/sparsity controls under the same solver; independent full S3/S4 construction/ideal certificates.
    - Actual planted-positive full S3/S4 solver control at targetmT before main work in every job, with known all-T tuple independently verified. Main randomQ explicitly excludes that singleton planted target but may have other decompositions.
    - Certified same-public-subgroup rho and BSGS baselines, full costs and independent recovered-log verification, never access planted secret.
    - All nine imported conservation controls, including legal three-point F7 relation certificates whose wrong-field rank differs, evaluated before measurements and after aggregation.
  metrics:
    primary: [exact_typed_counter_agreement, per_family_local_timing_slopes, per_family_local_weighted_operation_slopes, paired_slope_delta, paired_delta_interval, count_invariance_under_load, timing_load_monotonicity, highest_load_factor, sign_unspecified_monotone_wall_per_W_drift]
    secondary: [raw_producer_Fp_vector, raw_verifier_Fp_vector, rank_Fell_vector, stage_CPU_wall_memory_IO, full_resource_vector, timing_profile_boundary_fraction, profiling_sink_perturbation, finite_relation_outcomes, independent_rank_gain, baseline_costs, calibration_fault_results, excluded_sizes, fixture_rejections, certificate_bytes]
    scope: Exact definitions, pairings, medians, actuallogp coordinates, weights,2000shared-bootstrap indices and interval rules are in the appendix. Full resource vectors preserve named stages and shared ownership; W is supplementary and never scalarizes the ICEX numerator.
  preregistered_prediction:
    exact_counts: All calibration formulas hold and same-input counting vectors are bit-identical across0/1/2/4burners.
    load_time: Valid timing medians are nondecreasing across load and highest/zero-load>=1.5; failure is a finite target failure, not guaranteed infrastructure invalidity.
    drift: At load0 wall/W across sizes is monotone in either direction and max/min>2; separate from the paired-slope decision.
    slopes: Test whether timing and supplementary weighted-count local slopes agree within the fixed practical tolerance0.05 on the same retained panel; no presumed result.
  heuristic_under_test:
    - id: H1
      statement: Finite timing/count slopes and wall/W drift can differ materially even under an exactly calibrated declared arithmetic algorithm, while load perturbs time but not logical counts.
      supporting_results: []
      validation_plan: Complete paired full-panel measurements and independent checks, preserving all raw vectors, profile exclusions, nulls, baselines and non-field costs.
      falsification_scope: Failure of any finite target is localized to its declared arm/family/load/panel; no universal machine-dependence or EC-causality conclusion.
  tail_checks:
    - Every rejected fixture, complete tuple/sign search, baseline restart, missing/censored component and excluded size remains in artifacts; no favorable replacements or survivor-only means.
    - Timing-mode boundary fraction>0.5 excludes the stated size summary only, with all raw data preserved. Each family/arm/load needs four eligible sizes and20complete pairs/size for slope inference.
    - All bootstrap draws and undefined results are retained; no removal of tails, adaptive sample addition or changing weights/methods after results.
  budget:
    enforcement: advisory
    advisory_scope: Time/CPU estimates only. Exact samples, one active job, six-process tree, aggregate8GiB and machine watchdogs remain binding.
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 8
    maximum_workers: 6
    maximum_runs: 1600
    process_checkpoint_seconds: 3600
    maximum_groebner_degree_cap: null
    degree_amendment: Explicit prospective replacement of the inherited degree32 cap, incompatible with initial degree48/64/80 generators. Requires this protocol's independent review/approval; preserves memory censoring and the separate governing32bit tier bound.
  stopping_rules:
    - Complete the fixed full schedule; incomplete fixture admission blocks the affected full-panel inference rather than reducing samples or changing outcomes.
    - Stop before EC/null/baseline execution on the first failed exact calibration; planted-positive control must pass before main work. Retain omitted components and genuine start-and-abort IMPLEMENTATION_FAILURE receipts for remaining sealed roots, never invent NOT_ACTIVATED roots. Other failed certificate/coverage/backend/conservation controls also stop interpretation; repair needs an additive reviewed amendment.
    - Exhaustive decomposition and bounded rho search have the exact finite terminal meanings specified in appendix; absence is not a global negative.
    - Wall/memory events preserve immutable checkpoint segments or honest terminal failure. They neither exhaust a campaign nor authorize postseal samples; all schedules have exactly one eventual final receipt per sealed node.
  success_criterion: >-
    A valid complete study preserves all fixed instances/components, passes
    exact calibration/coverage/certificate/conservation controls, and reports
    every paired metric with sufficient-size gates. Scientific targets are
    reported separately: count invariance, load factor/monotonicity, signed
    monotone wall/W drift and mutually exclusive paired-slope categories.
    Completion does not require a favorable hypothesis outcome, and review
    is required before any claim reliance.
  invalidation_rules:
    - Any exact calibration/fault-control, coefficient-route, private-domain, mode-output, planted-positive, independent certificate or conservation failure invalidates the affected instrument/comparison and activates the frozen stop/receipt policy.
    - Wrong seed/fixture/code/verifier/schema binding, secret shortcut, unreviewed backend substitution, unowned or double-counted work, unsupported arithmetic route or postseal sample modification invalidates the affected evidence.
    - Timing-mode library-boundary fraction above0.5 excludes the specified size from slope fits only; it does not prove missing arithmetic or invalidate all raw counters. Missing/censored data and insufficient eligible sizes remain incomplete/inconclusive.
    - Valid failures of load/drift targets or slope disagreement are scientific finite outcomes, not automatic infrastructure or implementation failures. Profiling/burner costs and modified-algorithm overhead remain disclosed.
  falsification_criterion: >-
    Exact independently localized count/coverage/certificate defects invalidate
    the instrument; valid complete data failing a finite load/drift target
    give a scoped negative for that target. Paired delta/interval entirely
    outside the practical +/-0.05 band is DISAGREEMENT, both inside is
    AGREEMENT, other valid configurations INCONCLUSIVE. Missing/censored
    data or fewer than four eligible sizes are not scientific rejection.
  artifacts:
