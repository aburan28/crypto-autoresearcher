    affordability leaf-count table (Stages 0–1 arithmetic only)
  status: approved
  approved_by: DEC-20261003-4da874
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261003-4da874 under AGENTS.md standing
    user authorization (2026-09-06). No Magma/Sage/AUXIN/Bedrock. No CDCL.
    No ECC2K-130 solve. No n>=131 attack. No rho claim. Proposal Stages 2–5
    (anchor run, m=4 cell, m=5 cell) not authorized.
  approval:
    approved_by: DEC-20261003-4da874
    composing_decision: DEC-20261003-4da874
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 freezes affordability table, forward-condition disclaimer,
      dependency gate on IDEA-20260922-7ab503, and closed-form pin.
      Stage 1 independently recomputes leaf counts/ratios/admissibility;
      writes RESULTS.md with exactly one O-* label. No Magma/Sage. No
      AUXIN. No Bedrock. No CDCL.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether the Stage-0-frozen leaf-count affordability table from
    IDEA-20260922-493606 evaluates exactly under independent recomputation
    (O-ARITH-OK) or fails (O-ARITH-FAIL); deliver exactly one O-* label from
    H-BINSTD-0f9bf7.

  class: measurement
  class_note: >-
    Arithmetic measurement / corollary of already-filed closed forms. Not an
    exponent-moving breakthrough; no ECDLP attack; no CDCL cell under this card.

  scope:
    included:
      - Stage 0 freeze of affordability table, disclaimer, dependency gate, pin.
      - Stage 1 independent recomputation + RESULTS.md with one O-* label.
    excluded:
      - Any CDCL / CNF-XOR / Magma / Sage solve.
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Proposal Stages 2–5 (anchor reproduction run, m=4/m=5 cells).
      - Editing IDEA-20260922-493606 claim text or GOAL-ECDLP2M-001.yaml.
      - Treating infra failure as mathematical evidence.
      - Claiming rho competitiveness from a completed arithmetic check.

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-6cca48/trial-plan-v1.json
    trial_plan_twin: experiments/EXP-BINSTD-6cca48/trial-plan.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-6cca48/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-6cca48/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-6cca48/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-6cca48/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. trial-plan.json is a byte-twin
      of trial-plan-v1.json.

  inputs:
    seed: 20261003493606
    source_idea: ledger/proposals/IDEA-20260922-493606.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-0f9bf7.yaml
    closed_forms:
      - IDEA-20260904-3c7a91
      - IDEA-20260922-7ab503
      - IDEA-20260904-b40e6d
      - IDEA-20260904-96c4f3
    cells:
      - {id: anchor_m3_l8, m: 3, l: 8, mu: 1, n: null, predicted_leaves: 2796203}
      - {id: null_m4_l8_n37, m: 4, l: 8, mu: 1, n: 37, predicted_leaves: 178956971}
      - {id: koblitz_m4_l8_n37, m: 4, l: 8, mu: 37, n: 37, predicted_leaves: 4836675}
      - {id: null_m5_l6_n29, m: 5, l: 6, mu: 1, n: 29, predicted_leaves: 8947849}
      - {id: koblitz_m5_l6_n29, m: 5, l: 6, mu: 29, n: 29, predicted_leaves: 308547}

  controls:
    - name: ctl_independent_recompute
      definition: >-
        Stage-1 checker and Stage-1 driver recompute 2^{m*l}/(factorial(m)*mu)
        from (m,l,mu) alone without copying frozen predicted_leaves into the
        arithmetic path.
    - name: ctl_closed_form_source_pin
      definition: Stage-0 pin of the closed-form evaluation function hash must match live source at Stage 1.
    - name: ctl_forward_condition_disclaimer
      definition: >-
        Stage-0 freezes the no-rho / forward-condition disclaimer before any
        Stage-1 outcome is written.
    - name: ctl_no_cdcl_under_stages_01
      definition: Stages 0–1 launch no solver; any CDCL artifact under this card is protocol invalid.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_recompute]
    - name: cell_id
      levels: [anchor_m3_l8, null_m4_l8_n37, koblitz_m4_l8_n37, null_m5_l6_n29, koblitz_m5_l6_n29]

  metrics:
    primary:
      - name: leaf_count_table_match
        unit: boolean
        definition: True iff every cell's recomputed leaves equals frozen predicted_leaves.
      - name: admissibility_all_ok
        unit: boolean
        definition: True iff m(l-1)<=n for every cell that names n.
    secondary:
      - name: ratio_koblitz_m4_to_anchor
        unit: dimensionless
        definition: leaves(koblitz_m4) / leaves(anchor_m3)
      - name: ratio_null_m4_to_anchor
        unit: dimensionless
        definition: leaves(null_m4) / leaves(anchor_m3)
      - name: wall_clock_seconds
        unit: seconds
        definition: Measured wall clock (reported; not a pre-committed claim).
      - name: peak_rss_bytes
        unit: bytes
        definition: Peak RSS if available (secondary).

  heuristic_under_test: HEUR-BINSTD-493606-H1

  preregistered_prediction:
    quantity: >-
      Exactly the five frozen leaf counts and two admissibility truths listed
      in inputs.cells; ratios ≈1.729 and 64.0 respectively.
    formula: >-
      N_conf(l,m,|G|) = round(2^{m*l} / |G|) with |G| = m! * mu
      (nearest-integer; IDEA-20260922-493606 (B)/(D));
      admissible iff n is null or m*(l-1) <= n.
    source: >-
      ledger/proposals/IDEA-20260922-493606.yaml sections (B)/(D)/(E);
      frozen before Stage 1 in stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy_derivation
    justification: >-
      Integer arithmetic only under Stages 0–1. No transfer to n≥131 or any
      attack table is claimed. Later CDCL cells (not authorized) would still
      be toy claim-tier.
    correspondence: null

  measured_vs_modeled:
    measured:
      - leaf_count_table_match
      - admissibility_all_ok
      - ratio_koblitz_m4_to_anchor
      - ratio_null_m4_to_anchor
    modeled:
      - predicted_leaves (closed-form evaluation; labeled modeled until Stage-1 match)
    note: >-
      Stage-0 numbers are modeled evaluations of cited closed forms; Stage-1
      match converts them into independently rechecked derivation artifacts.

  optimistic_assumptions_disclosed:
    - assumption: >-
        IDEA-20260922-7ab503 H1 (μ realization at m=4) is NOT required for
        Stages 0–1 arithmetic; it IS required before any later CDCL m=4 cell.
      bias_direction: >-
        Approving Stages 0–1 does not license reading O-ARITH-OK as evidence
        that an m=4 CDCL cell will complete.
    - assumption: N_conf law extrapolates to m=4,l=8 without fresh CDCL measurement.
      bias_direction: >-
        Leaf counts are upper-bound search sizes under the cited law; real
        CDCL may abort earlier on memory (infrastructure, not math evidence).

  memory_accounting:
    dominant_structure: constant-size integer table
    analytic_peak: O(1)
    measured_peak_rss_bytes: null
    note: Peak RSS is secondary; not required to decide O-*.

  tail_checks:
    - Any single cell mismatch voids O-ARITH-OK (O-ARITH-FAIL).
    - Closed-form pin mismatch voids arithmetic claims (O-ARTIFACT).

  replication:
    seeds: [20261003493606]
    independent_instances: 1
    note: >-
      Deterministic under frozen table. Re-running Stage 1 must reproduce
      the same O-* label. No CDCL replication under this card.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.2
    maximum_memory_gb: 1
    maximum_runs: 3
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen stage0/*.json artifacts.
    - Stage 1 complete with recompute-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-BINSTD-0f9bf7.
    - maximum_runs = 3.
    - Do not open proposal Stages 2–5 under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock/CDCL used as success path under Stages 0–1 → protocol invalid.
    - Closed-form pin drift → O-ARTIFACT; do not read table as support.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming rho competitiveness or deployed insecurity → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with affordability table, disclaimer, dependency
    gate, and closed-form pin; Stage 1 produces leaf_count_table_match and
    admissibility_all_ok (or a named O-ARTIFACT/O-IMPEDIMENT stop); RESULTS.md
    names exactly one O-* label from H-BINSTD-0f9bf7 with cited artifacts.

  falsification_criterion: >-
    Any of: closed-form pin drift; recomputed leaf count ≠ frozen prediction;
    admissibility failure on a named cell; a claimed break/exponent/rho win
    under this card.

  required_artifacts:
    - experiments/EXP-BINSTD-6cca48/trial-plan-v1.json
    - experiments/EXP-BINSTD-6cca48/trial-plan.json
    - experiments/EXP-BINSTD-6cca48/stage0/affordability-table.json
    - experiments/EXP-BINSTD-6cca48/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-6cca48/stage0/forward-condition-disclaimer.json
    - experiments/EXP-BINSTD-6cca48/stage0/closed-form-pin.json
    - experiments/EXP-BINSTD-6cca48/stage1/
    - experiments/EXP-BINSTD-6cca48/RESULTS.md
    - experiments/EXP-BINSTD-6cca48/runs/<RUN-BINSTD-*>/
    - experiments/EXP-BINSTD-6cca48/implementation/run.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
