experiment:
  id: EXP-ICPERF-515ae3
  version: 1
  title: Prime63 three-arm m=2 planted solver-to-certificate diagnostic
  goal_id: GOAL-ICPERF-e6b6a4
  question_id: RQ-ICPERF-94c86e
  hypothesis_id: H-ICPERF-05021b
  batch_id: BATCH-5bfb57
  status: review_required
  approved_by: null
  execution_authorized: false
  frozen: true
  designed_at: '2026-10-19'
  designed_by: coordinator
  designed_by_decision: DEC-20261019-786a95
  objective: >-
    Measure whether the archived prime-field 63-bit m=2 coset, random and small-x
    planted systems produce independently checked full-point certificates under
    the fixed 600-second per-cell solver cap, while validating process-tree
    monitoring and raw phase custody. This is a bounded instrument diagnostic;
    it does not rank factor bases or measure a complete ECDLP pipeline.
  predecessor:
    design_decision: DEC-20261018-b9e38b
    source_archive_task: TASK-20261018-36e690
    producer_release_task: TASK-20261018-7368da
    chronology_correction: CORR-20261018-c66b81
    prior_run: RUN-ICPERF-7ed866
    note: >-
      The nine-file source snapshot preceded producer release; the correction
      preserves that chronology. This protocol binds exact bytes and makes no
      claim that the old archive met its release-before-snapshot precondition.
  scope:
    curve: archived short-Weierstrass prime-field curve
    p: '9223372021248595841'
    subgroup_order_r: '9223372018953067627'
    subgroup_order_bits: 63
    base_size_per_arm: 475
    arity_m: 2
    arms: [coset, random, small_x]
    cells: [coset-m2, random-m2, small_x-m2]
    encoders: {coset: quadratic_lift, random: direct, small_x: direct}
    target_rule: separately planted point for each arm; no cross-arm common-target runtime or yield comparison
    natural_targets: 0
  input_bindings:
    integration_launcher:
