      path: /Volumes/SSD990/cryptanalysis/third_party/sage-binary/sage
      sha256: b190e6cec5027031be752260d9b21a8e23f11a313cc620e5dcd1be28390643c1
  schedule:
    order: [monitor-null, coset-m2, random-m2, small_x-m2]
    scientific_calls: 3
    no_adaptive_selection: Every positive is fixed before execution; no result changes the next input, base or cap.
    request_sha256:
      coset-m2: 9a172c65375c2d2dc2d73f6232fa52fa281afade4fcb76e00fbbbf32f35ecb91
      random-m2: 04e7668f12afb5769ce9f6c8b2e25eb052854c28a846e5e92ab4d19c39291c01
      small_x-m2: 88258142099602ebfe156af11f9843e25411b49b6db5675950c4192de27347ee
  controls:
    - Inject an unreadable-live-root child before science; a missing monitor fault invalidates monitoring and stops later cells.
    - Recompute archived planted witnesses independently as exact polynomial roots, base members, signed curve points and full target sums.
    - Reject altered polynomial root, base point, sign, curve point and target point objects in independent checker tests.
    - Reject a unit-ideal or certified-no-solution response contradicted by a checked planted witness.
    - Preserve all three scheduled cells, including explicit unattempted or censored classifications after an early stop.
    - Use identical backend bytes, one worker, model guard and resource caps in all three scientific calls.
  metrics:
    primary:
      - Per-cell attempted or unattempted state and terminal classification.
      - Number of planted full-point certificates independently verified, censored, invalid and unattempted.
      - Per-cell solver wall and CPU seconds, sampled process-tree RSS, scratch peak and minimum free bytes.
      - Phase trace with reported Groebner degree or matrix dimensions only if instrumented; absent measurements remain null.
    secondary:
      - Equation and variable counts, quotient lower bound, root count, false-root categories and raw byte hashes.
      - Monitor-null fault detection, raw trace coverage, host and Sage identity, command and source hashes.
  budget:
    enforcement: fixed sample and machine watchdog; ECC campaign spending remains uncapped
    maximum_runs: 1
    maximum_workers: 1
    scientific_calls: 3
    per_cell_wall_seconds: 600
    total_wall_seconds: 2100
    sampled_process_tree_rss_bytes: 8589934592
    scratch_bytes: 8589934592
    initial_free_bytes: 17179869184
    minimum_free_bytes: 8589934592
    model_cap: 64
  stopping_rules:
    - Refuse before task output or Sage if approved plan, source/input hashes, exact ready selector, published claim, supervisor launch or owner/epoch binding fails.
    - Stop before science when the monitor-null control fails; preserve the fault and all unattempted cells.
    - Stop each scientific call at its fixed wall, memory or scratch guard; retain raw bytes and a censor classification.
    - At total wall cap, retain every remaining unattempted cell with an explicit reason.
    - Stop interpretation on any false accepted root, missing raw custody or positive witness contradiction.
    - Never retry in this run directory; any retry needs a new run ID and prospective authorization.
  invalidation_rules:
    - Changed source, inputs or Sage bytes invalidate admission.
    - Missing raw request, phase trace, stdout, stderr, receipt, archive member or claimed response invalidates custody.
    - An accepted root without exact polynomial, base, lift, sign and full-point checks is invalid.
    - A no-solution assertion for a checked planted witness is an instrument contradiction.
    - Monitor failure, crash, timeout, memory, scratch and model caps are infrastructure or bounded censored outcomes.
  decision_impact:
    on_positive: >-
      A checked planted certificate supports bounded solver-to-certificate
      feasibility for that exact arm and m=2 input. It justifies a separately
      frozen natural common-target and full-cost experiment; it does not
      establish relation yield, factor-base superiority or E2E speedup.
    on_negative: >-
      A valid at-cap failure weakens only the corresponding 600-second planted
      feasibility prediction. A censor or invalid instrument leaves it
      unresolved and triggers exact monitor/solver repair before a successor.
    on_monitor_fault: Preserve infrastructure evidence, stop science and repair monitor custody.
    on_contradictory_no_solution: Preserve basis and witness, invalidate the instrument and replay before any new trial.
  success_criterion: >-
    The monitor-null control detects the fault, all three fixed planted calls
    are attempted or explicitly safety-censored, and each attempted successful
    response passes independent full-point verification with complete raw custody.
    This criterion concerns bounded interface feasibility only.
  falsification_criterion: >-
    A reproducible accepted root failing independent checks invalidates the
    interface. A valid at-cap planted failure refutes only its exact bounded
    feasibility prediction, not the archived point identity or wider IC method.
  required_artifacts:
    - experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/launch.json
    - experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/execution-receipt.json
    - experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/command.txt
    - experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/environment.json
    - experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/stdout.log
    - experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/stderr.log
    - experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/check.stdout.log
    - experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/check.stderr.log
    - experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/manifest.yaml
    - experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/raw-result.json
    - experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/diagnostic/receipt.json
    - experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/diagnostic/raw.tar.gz
  archive_rule: >-
    The diagnostic raw tar and receipt preserve every fixed attempt's request,
    phase trace, stdout, stderr and present response with hashes. The run
    archive task binds all supervisor files and declared diagnostic artifacts
    before independent review. Failed and censored output remains recorded.
  approval_preconditions:
    - Commit and push this draft, exact source closure, goal head and matching open-lane sidefile on the protocol branch.
    - Freeze one exact trial plan, executor handoff, queue, archive coverage and review plan with no scientific calls.
    - Obtain experiment_preapproval.py --packet approvable true for prospective approved bytes.
    - Commit and archive the Coordinator approval decision under standing user authorization; then require newest_experiments.py execution_state ready.
    - Publish a live owner/epoch lane claim and pass ordinary dispatch admission before any trial.
  assigned_to: executor
  interpretation_limits:
    - Three separately planted targets do not provide a matched natural-target factor-base comparison.
    - The 600-second m=2 diagnostic is a distinct instrument follow-up, not a rewrite of the prior 300-second m=2..8 panel.
    - Sampled RSS cannot bound an unobserved transient peak.
    - Natural relation yield, useful rank, linear algebra, target descent, complete cold and online cost, and matched rho remain unmeasured.
    - Prime-field observations do not transfer to ordinary binary or Koblitz curves without separate evidence.
  citations:
    - {source: 'research/icperf_prime63_m2_diagnostic_integration_20261018/diagnostic_packet.json', provenance: internal, verified_by: 'Coordinator source review 2026-10-19'}
