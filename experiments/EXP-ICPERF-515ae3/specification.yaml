    phase:
      path: research/icperf_prime63_monitor_phase_20261018/phase.py
      sha256: f91b6725c83e4aec3340080ca14a091c66a4e9e12f29ac9042d54f853a3262d0
    instrumented_backend:
      path: research/icperf_prime63_monitor_phase_20261018/instrumented_backend.py
      sha256: ad90753f42135bc2aeb0c3af12acf85289ae46b3ecc85afec8babafad2179c82
    wide_backend:
      path: research/icperf_prime_wide_backend_retry_20261017/backend.py
      sha256: 30f9310997833836b0ca7a080a84b5b4b2fcc4231167045d9636596dbd46b7c5
