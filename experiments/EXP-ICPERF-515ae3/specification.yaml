  variable_ledger:
    independent:
    - name: arm_bundle
      levels:
      - coset-m2
      - random-m2
      - small_x-m2
    factors:
    - name: field_and_subgroup
      treatment: fixed
      value: p=9223372021248595841; r=9223372018953067627
      how: One archived curve and subgroup for all fixed inputs.
    - name: base_size_and_arity
      treatment: fixed
      value: B=475; m=2
      how: Bound in each archived request.
    - name: factor_base
      treatment: measured
      how: Different archived base per named arm; its exact identity is recorded, with no isolated base-effect inference.
    - name: target
      treatment: measured
      how: Separately planted target per arm is archived and checked; no common-target comparison.
    - name: encoder
      treatment: measured
      how: Archived coset quadratic lift and direct random/small-x encoders co-vary with arm.
    - name: equation_shape
      treatment: measured
      how: Equation/variable counts and request hashes are recorded per arm; shape co-varies with encoder.
    - name: source_backend_and_order
      treatment: fixed
      value: SHA-bound source, backend, flags, term order and model cap 64
      how: One frozen source/input manifest and execution plan governs all calls.
    - name: schedule_and_caps
      treatment: fixed
      value: monitor-null then coset/random/small_x; one worker; 600 s/cell; 2100 s total; 8 GiB guards
      how: Frozen order and supervisor limits apply to every scheduled cell.
    - name: host_load
      treatment: measured
      how: Recorded as descriptive telemetry; it cannot change exact acceptance or custody predicates.
    comparisons:
    - id: C-custody
      arms:
      - run_archive
      differs_in: []
      design: absolute
    - id: C-coset
      arms:
      - coset-m2
      differs_in: []
      design: absolute
    - id: C-random
      arms:
      - random-m2
      differs_in: []
      design: absolute
    - id: C-smallx
      arms:
      - small_x-m2
      differs_in: []
      design: absolute
    - id: C-cross-arm
      arms:
      - coset-m2
      - random-m2
      - small_x-m2
      differs_in:
      - factor_base
      - target
      - encoder
      - equation_shape
      design: confounded
      reason: Separately planted targets and bases, with quadratic-lift versus direct encodings and different equation
        shapes; descriptive only.
    aa_not_applicable: Decisive C-custody and C-cell predicates are exact byte/hash, finite-field and full-point
      checks. No timing, RSS, cap, yield or cross-arm comparison supports or refutes a hypothesis in this diagnostic;
      noisy telemetry is secondary and censored at its guard.
    crosses_map: false
