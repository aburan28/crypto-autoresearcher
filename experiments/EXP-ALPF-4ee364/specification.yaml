experiment:
  id: EXP-ALPF-4ee364
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-c65293; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-c65293
  question_id: RQ-ALPF-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Reconstruct the ALPF campaign's screened-cell design matrix from its committed analysis tables,
    estimate effective cell independence by within-level permutation, and report the chance-survivor
    distribution for a campaign of that exact shape.
  objective: 'The one uncertainty a run reduces is how many screened cells the archived ALPF campaign''s
    headline maximum was taken over, and how independent those cells were. Stated as parts: (i) how
    many cells does the committed record actually contain, recovered by parsing the analysis tables
    of all 32 imported packages into factor coordinates and verdicts, with unparseable packages listed
    rather than imputed; (ii) how independent are those cells, estimated by permuting verdicts within
    each factor level 10000 times and comparing the resulting fire-count variance against the binomial
    variance full independence implies, yielding a design effect and an effective cell count; (iii)
    given a per-cell null fire rate supplied from a companion measurement and swept across a plausible
    range, what is the full distribution of the number of cells a campaign of this exact grid shape
    would report as survivors when nothing is there. Reducing these lets a future ALPF campaign choose
    its grid size deliberately, with no cryptographic computation involved at any stage.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: the parseable portion
      of the archived ALPF campaign contained N cells with the reported factor structure, its design
      effect was D, and under a per-cell null rate r the chance-survivor count has the reported distribution.
      What does NOT follow: that the archived positive is or is not a chance finding, since this entry
      re-measures nothing and the archived records are immutable toy-tier evidence; that any multiplicity
      correction should be applied to a committed record; that the campaign was well or badly designed;
      and no attack, speedup or security consequence of any kind. The forward sizing table is a design
      constraint for future toy-scale ALPF campaigns and nothing more.'
  inputs:
    procedure: 'STAGE 0 (cost: 0 compute, ~half a day human): enumerate the 32 imported packages from
      ledger/evidence/EV-ALPF-001.yaml and open each analysis.md. STAGE 1 (cost: ~1 day human, minutes
      compute): write a parser extracting factor coordinates and verdicts from the markdown tables,
      run it, and run a second independent manual extraction pass on a 20 percent sample; list disagreements.
      STAGE 2 (cost: minutes): tabulate raw cell count, per-factor level counts and the nesting structure.
      STAGE 3 (cost: minutes): run 10000 within-level permutations, compute fire-count variance and
      the design effect, and derive the effective cell count. STAGE 4 (cost: minutes): generate 10000
      synthetic campaigns of the identical grid shape at each null rate from 0.01 to 0.20 in steps
      of 0.01 and record the chance-survivor distribution per rate. STAGE 5 (cost: 0): report the
      archived observed survivor count against each distribution, descriptively. STAGE 6 (cost: 0):
      emit the sizing table giving, per null rate, the maximum cell count keeping the expected chance-survivor
      count below 1.'
    instrument: Python 3 only, no Sage and no cryptographic computation. A markdown-table parser written
      directly against the archived analysis.md files under experiments/EXP-ALPF-*/; a hand-written
      permutation resampler in pure Python; harness/runner.py for the run manifest, seeds and the
      inference block; templates/research-records.md consulted for how to report the design matrix
      as an artifact. The parser is committed alongside its output so the extraction is reproducible
      and auditable.
    parameters: 'Packages: all 32, EXP-ALPF-001 through EXP-ALPF-032, as listed in EV-ALPF-001. Factors
      extracted: curve label, representation, field bit size, factor-base size, trace value where
      present. Permutations: 10000 within-level. Synthetic campaigns: 10000 per null rate. Null-rate
      sweep: 0.01 to 0.20 in steps of 0.01. Verdict categories: fires/quiet primary, with survivor/negative/inconclusive
      recorded separately and inconclusive analysed both as a third category and as a non-fire, both
      reported. Manual re-extraction sample: 20 percent of parsed cells.'
  controls:
  - Within-level permutation null preserving the observed marginal fire rate, over the same design
    matrix.
  - Independent-Bernoulli synthetic campaigns at the supplied per-cell rate, matched to the exact
    grid shape.
  - Null-rate sensitivity sweep from 0.01 to 0.20 so no conclusion is hostage to a single value.
  - 'Parseability control: counted and uncounted packages reported separately, uncounted ones listed
    by id.'
  - 'Verdict-extraction control: two independent extraction passes over the same tables, with disagreements
    listed rather than silently reconciled.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a synthetic campaign of the identical design shape
    in which every verdict is drawn independently at a specified per-cell null rate, generated 10000
    times. The IDENTICAL counting and maximum-taking procedure runs over it in the same invocation.
    For the comparison to mean anything the null campaigns must reproduce the archived grid dimensions
    exactly -- same factor levels, same nesting, same cell count -- and the rate must be measured
    rather than assumed; if no measured per-cell null rate is available the entry reports the design
    matrix and design effect only and refuses to report an expected chance-survivor count at all.
    A second null permutes the archived verdicts within factor levels, preserving the observed marginal
    fire rate and destroying only the association with factor coordinates, which isolates whether
    fires cluster by representation.'
  independent_variables:
  - assumed per-cell null fire rate
  - verdict-categorisation rule (inconclusive as third category vs as non-fire)
  - resampling scheme (within-level permutation vs independent Bernoulli)
  - package subset (table-carrying vs all parseable)
  metrics:
    primary:
    - raw screened cell count, total and per package
    - design effect from within-level permutation
    - effective independent cell count
    - chance-survivor count distribution per null rate
    secondary:
    - per-factor level counts and the nesting description
    - parser-versus-manual extraction disagreement rate on the 20 percent sample
    - list of unparseable packages by id
    - sensitivity of the design effect to the verdict-categorisation rule
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The effective number of independent screened cells in the archived ALPF campaign, and
      the expected number of chance survivors for a campaign of that shape.
    formula: 'design_effect = Var_perm(number of fires) / (N * r * (1 - r)), with N the raw cell count
      and r the observed marginal fire rate; effective_N = N / design_effect; expected chance survivors
      E(r) = effective_N * r, reported alongside the full simulated distribution rather than as a
      point estimate alone. Pre-registered predictions: N >= 150 over the parseable packages, design_effect
      >= 1.5, and effective_N / N <= 0.5. No prediction is pre-committed for the parseable fraction
      of the 32 packages.'
    source: Pre-registered in the parent proposal IDEA-20260816-c65293 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The object is the archived toy-scale campaign''s own design, at 13 to 17 bit primes
      and factor-base sizes 3 to 9 as recorded. No transfer to any other scale is involved because
      no algebra is computed: the entry measures a property of a committed grid. The forward sizing
      table is explicitly scoped to future toy-scale ALPF campaigns of similar shape and carries no
      extrapolation to medium or cryptographic parameters.'
    correspondence: null
  tail_checks:
  - Report the upper tail of the chance-survivor distribution, not just its mean, since a campaign
    headline is a maximum and maxima live in tails.
  - Report the packages contributing the most cells individually, since one wide table can dominate
    the count.
  - Report every cell where parser and manual extraction disagreed, in full.
  - Report the design effect computed on each factor separately as well as jointly, since one factor
    may carry all the non-independence.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop and report a partial design matrix if fewer than half the packages parse, with no campaign-level
    expectation claimed.
  - Stop the null-rate sweep at any rate where the expected chance-survivor count exceeds the raw
    cell count, which indicates a parameter error.
  - Hard stop at 1 CPU-hour; this entry is not compute-bound.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: A design matrix covering the table-carrying packages is emitted as a committed
    artifact, with a design effect from 10000 permutations and a chance-survivor distribution reported
    across the full null-rate sweep.
  falsification_criterion:
  - Design effect at or below 1.1, falsifying the non-independence claim.
  - Fewer than half the packages parseable, voiding the campaign-level expectation.
  - Parser-versus-manual disagreement above 5 percent on the sample.
  - Permutation and Bernoulli nulls indistinguishable, making the design effect unmeasurable.
  - Expected chance-survivor count below 0.1 at the supplied null rate, closing the multiplicity question.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-c65293
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Whether INCONCLUSIVE cells count as screened cells at all is a definitional choice a Coordinator
    must make before the count means anything; both conventions are computed but the headline needs
    one.
  - The per-cell null fire rate must come from a companion measurement; if that is not approved first,
    this contract must be approved in its degraded form producing design matrix and design effect
    only.
  - Whether cells screened but unreported can be bounded from the archived source scripts under experiments/EXP-ALPF-*/source/
    needs a Coordinator decision.
  - The exchangeability assumption underlying within-level permutation should be stated explicitly
    per factor, since it is questionable for factor-base size.
