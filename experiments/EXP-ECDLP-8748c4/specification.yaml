experiment:
  id: EXP-ECDLP-8748c4
  hypothesis_id: H-ECDLP-30a2a1
  question_id: RQ-ECDLP-002
  goal_id: null
  version: 1
  status: draft
  claim_tier: toy
  title: >-
    Exact symbolic construction of the degree-3 generalised summation relation
    at m = 3, with the degree-2 Semaev polynomial as a forced-value baseline,
    the Galois closure of the cover as a scope check on KN-FIND-a1f3c2, and a
    genus-2 curve-free null that must reproduce the multiplicity and cycle-type
    signature while failing to produce any summation relation at all

  objective: >-
    Decide whether a factor base indexed by a degree-3 map E -> P^1 admits a
    generalised summation relation at m = 3, and if so measure its per-variable
    degree and Newton polytope exactly, against the degree-2 relation at the
    same m. Separately, decide whether the Galois closure of that degree-3
    cover is contained in an elementary abelian 2-group, which is the exact
    scope boundary of KN-FIND-a1f3c2. NO COST, REACH, YIELD OR EXPONENT
    QUANTITY IS MEASURED OR CLAIMED BY THIS CONTRACT.

  independent_variables:
    - name: map_degree_d
      values: [2, 3, 4]
    - name: prime_p
      values: [65537, 1048583, 16777259]
    - name: divisor_class
      values: >-
        8 effective classes per degree per prime, drawn by a rule frozen in the
        run manifest before any curve is read

  inputs:
    curve_family: ordinary short Weierstrass over F_p, p greater than 3
    curves_per_prime: 8
    m: 3
    window_size_B: 64
    windows_per_prime_per_degree: 1000
    elimination_convention: >-
      Resultant elimination in the variable order fixed in the run manifest;
      the order is frozen before the first degree-3 computation and its hash is
      recorded on every run.
    arithmetic: exact over Z and over F_p, no floating point

  metrics:
    primary:
      - name: per_variable_degree_of_eliminated_relation
        unit: degree (dimensionless non-negative integer)
        definition: >-
          The maximum exponent of any single summation variable in the fully
          expanded eliminated relation at m = 3, per map degree d.
      - name: newton_polytope_vertex_set
        unit: set of integer exponent vectors (dimensionless)
        definition: >-
          The vertex set of the convex hull of the exponent vectors of the
          eliminated relation, reported in full, per map degree d.
      - name: galois_group_of_closure
        unit: group name (categorical)
        definition: >-
          The Galois group of the Galois closure of u_D over F_p(t), identified
          from the empirical Frobenius cycle-type distribution over 1000 fibres
          and confirmed by factoring the fibre polynomial over F_p.
    secondary:
      - name: fibre_multiplicity_ratio
        unit: points per window element (dimensionless ratio, both sides counted
          as F_p-rational points over F_p-rational window elements)
        definition: >-
          The count of F_p-rational points of u_D^{-1}(W) divided by the count
          of F_p-rational elements of W, at matched W.
      - name: degree_4_primitivity_fraction
        unit: fraction of sampled classes (dimensionless)
        definition: >-
          The fraction of sampled degree-4 divisor classes whose map admits a
          factorisation through a degree-2 map, decided symbolically.
      - name: symbolic_wall_clock_seconds
        unit: seconds
        definition: >-
          Reported for budget accounting only. Never used as an inference.

  controls:
    - name: C-BASELINE-D2
      kind: forced-value baseline
      blocking: true
      description: >-
        At d = 2 the construction must return the standard fourth Semaev
        polynomial as an EXACT POLYNOMIAL IDENTITY in Z[x1,x2,x3,A,B], not as a
        matching support count. Per-variable degree must be exactly 4. A
        mismatch voids every degree-3 number in the run.
    - name: C-CURVE-FREE-GENUS2
      kind: curve-free null, REQUIRED
      blocking: true
      description: >-
        A degree-3 map from a genus-2 curve over the same F_p to P^1, at
        matched fibre size, run through the identical multiplicity and
        cycle-type measurement. PRE-STATED CONSEQUENCE, RECORDED BEFORE THE
        RUN. The multiplicity ratio and the cycle-type distribution MUST be
        statistically indistinguishable from the elliptic arm, because both are
        properties of a degree-3 cover and use no group law. If they are, the
        report must state in terms that neither quantity is evidence about
        elliptic curves or the ECDLP. If instead the genus-2 arm differs, the
        implementation is measuring something other than the cover and every
        multiplicity and monodromy number in the run is void.
    - name: C-RELATION-EXISTENCE
      kind: proof, not an arm
      blocking: false
      description: >-
        The generalised summation relation is defined by P_1 + ... + P_m = R
        and therefore does not exist for the genus-2 null, which carries no
        group law on its points. This is recorded as a derivation rather than
        run as an arm; the curve-bound content of the whole experiment is
        exactly the part the null cannot reach.
    - name: C-SHUFFLED-RELATION
      kind: planted null with dynamic range
      blocking: true
      description: >-
        Replace the group-law constraint by a random ternary algebraic relation
        on P^1 of matched total degree and matched fibre structure, and run the
        identical elimination. PREDICTED MAGNITUDE, PRE-REGISTERED. The
        eliminated per-variable degree of the shuffled arm must differ from the
        genuine degree-3 value by at least 1. If the shuffled arm reproduces
        the genuine per-variable degree exactly at every cell, the polytope is a
        function of the elimination convention and the fibre size alone, the
        measurement is curve-free after all, and C2 of the hypothesis is not
        being tested by this instrument.
    - name: C-PRIMITIVITY-D3-IS-A-THEOREM
      kind: recorded proof replacing a degenerate arm
      blocking: false
      description: >-
        A degree-3 map cannot factor through a degree-2 map, since degrees of
        maps of curves multiply and 2 does not divide 3. The source proposal's
        "the family is empty because every primitive map factors through the
        Kummer quotient" falsifier is therefore forced false at d = 3 and
        cannot fire. IT IS NOT LOOSENED, IT IS MOVED: the primitivity question
        is measured at d = 4, where 4 = 2 times 2 makes the factorisation
        available, and the degree-4 primitivity fraction is a reported
        secondary metric for exactly that reason.
    - name: C-CONVENTION-FREEZE
      kind: instrument freeze
      blocking: true
      description: >-
        The elimination variable order and the expansion convention are hashed
        into the run manifest before the first degree-3 run and asserted
        identical across every arm. A convention change mid-run makes every
        degree comparison meaningless.

  heuristic_under_test: HEUR-001

  preregistered_prediction:
    quantity: >-
      The per-variable degree of the eliminated generalised summation relation
      at d = 3, m = 3, and the Galois group of the Galois closure of the
      degree-3 cover.
    formula: >-
      per-variable degree strictly greater than 4; Galois group equal to S_3 or
      A_3, in either case not contained in any elementary abelian 2-group;
      fibre multiplicity ratio equal to d within 3.00 plus or minus 0.29 at
      d = 3.
    source: >-
      Degree bound: the degree-2 value 4 is the committed per-variable degree
      of the fourth Semaev polynomial, reproduced as C-BASELINE-D2 in this same
      run. Monodromy: KN-FIND-a1f3c2 derives C_2^(m-2) from the quadratic
      extensions y_i^2 = f(x_i) of the degree-2 cover, so it makes no
      prediction at d = 3 and the generic-cover expectation S_3 stands in its
      place. Multiplicity: HEUR-001 of H-ECDLP-30a2a1.

  band_non_degeneracy_analysis: >-
    COMPUTED BEFORE THE BANDS WERE FIXED, AS REQUIRED BY THE TASKING BRIEF.
    (1) THE MULTIPLICITY BAND CAN MOVE. Under the alternative that fibres are
    rational at a rate materially below the Chebotarev rate, the ratio moves to
    a value away from 3; the binomial standard error of the per-fibre rational
    point count over 1000 windows is at most sqrt(3)/sqrt(1000) = 0.055, so
    3 sigma is 0.164 and the band of 0.29 is 5.3 sigma wide, which absorbs the
    O(B^(-1/2)) Weil term at p = 65537 without being so wide that a genuine
    d = 2 answer (ratio 2) could hide inside it. The separation between the
    d = 2 and d = 3 values is 1.00, i.e. 18 sigma. NON-DEGENERATE.
    (2) THE MONODROMY BAND CAN MOVE, AND THE ALTERNATIVE IS REACHABLE. S_3 and
    A_3 are distinguished by whether any transposition appears among 1000
    sampled Frobenius cycle types; under A_3 the probability of observing a
    transposition is exactly 0, and under S_3 the expected count of
    transpositions is 500. An elementary abelian 2-group answer would show
    cycle types of order dividing 2 only. All three outcomes are observable at
    the declared sample size. NON-DEGENERATE.
    (3) ONE SOURCE DISCRIMINATOR WAS FORCED AND HAS BEEN REPAIRED, NOT
    LOOSENED. The source proposal's falsifier "every primitive degree-d map is
    found to factor through the Kummer quotient, so the family is empty" cannot
    fire at d = 3, because map degrees are multiplicative and 2 does not divide
    3. Rather than widen a threshold, the cell is MOVED to d = 4 and reported
    as degree_4_primitivity_fraction, where the factorisation 4 = 2 times 2 is
    genuinely available and the discriminator has range.
    (4) THE PER-VARIABLE DEGREE BAND CAN MOVE IN BOTH DIRECTIONS. The
    alternative to "strictly greater than 4" is any value in {2, 3, 4}, all of
    which are representable outputs of the same elimination, and the shuffled
    relation control establishes that the instrument does produce different
    integers on different inputs.
    (5) UNDERPOWERED CELL, DECLARED. Nothing in this contract can decide
    whether the d-fold factor-base gain outruns the degree loss, because that
    comparison requires the reach functional named E1-01 in the source
    proposal, which this coordinator session could not resolve to a committed
    record. That cell is declared UNDESIGNED rather than answered weakly, and
    the required input is named: a committed record defining E1-01 and its
    threshold.

  scale_relevance:
    tier: toy
    justification: >-
      Symbolic algebra over Z and exact arithmetic at three primes from 2^16 to
      2^24. The per-variable degree and Newton polytope of a symbolic relation
      are p-independent and transfer exactly; the monodromy and multiplicity
      measurements are at the tested primes and curves only and transfer
      nowhere without a further argument. No cryptographic-scale statement is
      made or implied.
    correspondence: null

  tail_checks:
    - >-
      The empirical Frobenius cycle-type distribution must match the conjugacy
      class proportions of the identified group; for S_3 that is 1/6 identity,
      1/2 transpositions, 1/3 three-cycles, and the observed counts over 1000
      fibres must lie inside a chi-squared 99 percent region on 2 degrees of
      freedom. A mismatch invalidates both the monodromy identification and the
      multiplicity measurement, since they are read from the same sample.
    - >-
      The rarest observed cycle type per curve is reported individually against
      its predicted probability, not absorbed into the chi-squared statistic.

  replication:
    seeds: [20260904, 20260905, 20260906]
    independent_instances: 24

  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 24
    maximum_workers: 1

  stopping_rules:
    - >-
      If the degree-3 elimination at m = 3 has not terminated within 900
      seconds on a single cell, stop that cell and record it as
      feasibility_exhausted. Under AGENTS.md rule 5 that is an infrastructure
      outcome and is never evidence that the relation does not exist.
    - >-
      If C-BASELINE-D2 fails, stop the entire run before any degree-3 cell is
      attempted.
    - >-
      If C-CONVENTION-FREEZE detects a hash mismatch, stop immediately.

  invalidation_rules:
    - The elimination convention hash differs between any two arms.
    - >-
      The curve-free genus-2 null produces a multiplicity or cycle-type
      distribution distinguishable from the elliptic arm, which would mean the
      instrument is not measuring the cover.
    - >-
      Any degree or polytope is reported from a cell whose expansion did not
      complete, or from a floating-point computation.
    - >-
      Any reported per-variable degree is obtained under a variable order other
      than the frozen one.

  success_criterion: >-
    C-BASELINE-D2 passes as an exact polynomial identity; the degree-3
    generalised summation relation is constructed at m = 3 on at least 20 of
    the 24 declared cells; its per-variable degree and Newton polytope are
    reported exactly per cell; the Galois group of the degree-3 closure is
    identified on every cell with the tail check passing; and the degree-4
    primitivity fraction is reported. The success criterion is the production
    of these exact objects, NOT any particular value of them.

  falsification_criterion: >-
    C2 of H-ECDLP-30a2a1 is falsified if the degree-3 relation's per-variable
    degree is less than or equal to 4 on a majority of completed cells. C3 is
    falsified if the degree-3 Galois closure is contained in an elementary
    abelian 2-group on every completed cell. HEUR-001 is falsified if the
    measured multiplicity ratio at d = 3 lies outside 3.00 plus or minus 0.29
    at any tested prime. A failure of C-SHUFFLED-RELATION to differ by at least
    one degree from the genuine arm falsifies the claim that this instrument
    measures anything curve-bound, and in that case no conclusion of any kind
    may be drawn from the polytope.

  required_artifacts:
    - the frozen elimination convention and its hash, recorded before run 1
    - per cell, the fully expanded eliminated relation as an exact polynomial
    - per cell, the per-variable degree and the full Newton polytope vertex set
    - per cell, the 1000 sampled Frobenius cycle types as raw counts
    - the genus-2 curve-free null outputs, at the same sample size
    - the shuffled-relation control outputs, per cell
    - the exact d = 2 baseline identity check, as a symbolic zero certificate
    - the degree-4 primitivity decision per sampled class, with its witness
    - run manifest per AGENTS.md artifact policy, including seeds and versions

  limitations:
    - >-
      UNTESTABLE AT REACHABLE SCALE, STATED PLAINLY. Whether a degree-3
      indexing improves any solve-stage cost is not testable by this contract
      or, on the evidence available to this session, by any contract this
      program can currently write: the comparison runs through the reach
      threshold the source proposal calls E1-01, which was not resolved to a
      committed record here. This contract deliberately measures only the
      algebraic inputs to that comparison.
    - >-
      TWO OF THE THREE PRIMARY SIGNATURES ARE CURVE-FREE BY CONSTRUCTION.
      Fibre multiplicity and Frobenius cycle type are reproduced by any
      degree-3 cover of P^1, and the genus-2 arm is run precisely to make that
      visible in the data rather than only in the prose. Neither may be cited
      as a statement about elliptic curves or the ECDLP.
    - >-
      Eight divisor classes per degree per prime is a sample of the moduli of
      degree-d maps, not a census of it. No universality statement in either
      direction is available at this sample size, and the method ceiling of
      H-ECDLP-30a2a1 says so.
    - >-
      The d^m branch ambiguity per candidate is a real cost that grows with d.
      It is not measured here and its omission is not a claim that it is small.
    - >-
      Scope: ordinary short-Weierstrass curves over prime fields at p in
      {65537, 1048583, 16777259}, m = 3, resultant elimination in one frozen
      order, degree-2 to degree-4 maps. Nothing transfers to binary or
      extension fields, to other m, to other elimination orders, or to
      cryptographic parameters.

  assigned_to: executor
  approved_by: null
