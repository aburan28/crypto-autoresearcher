  accepted_review_finding_coverage:
    S4V-01:
      implementation: >-
        The production admission path loads only hash-pinned local copies of the canonical dispatch and
        review-plan validators plus their declared configuration dependencies. It validates every task in the
        claimed and admitted queues on deep copies, accepts equivalent inline and path-bound plans only when they
        equal the precommitted plan, validates all plan subsections, freezes the complete claimed review declaration
        except state and lease bookkeeping, and checks every declared handoff digest against both the attested read
        digest and reviewed Git blob. Claim, release, archive and authority ancestry and every output hash remain exact.
      fixed_cases:
        - standard_holds_lifecycle_reachable
        - inline_only_plan_reachable
        - path_only_plan_reachable
        - wrong_handoff_binding_digest_rejected
        - missing_nested_plan_rejected
        - wrong_inline_plan_rejected
        - empty_plan_control_rejected
        - claimed_declaration_mutation_rejected
        - extra_invalid_queue_task_rejected
    S4V-02:
      implementation: >-
        streaming.py writes deterministic JSON/JSON-as-YAML, JSONL, CSV and file copies through guarded fragments
        no larger than 64 KiB. Each final artifact streams directly into its owned staging file and is hashed during
        that pass. Completed cells, scientific certificates, partial certificates, fixture history and diagnostics
        stay in append-only spools; memory retains one current bounded cell and the compact 96-cell decision reducer.
        Integer mapping keys are rejected rather than silently changed by JSON-as-YAML.
      fixed_cases:
        - artifact_serialization_chunk_guarded
        - publication_io_chunk_guarded
        - large_lazy_payload_chunked
        - large_string_guard_opportunities
        - json_yaml_integer_keys_rejected
    S4V-03:
      implementation: >-
        custody.finalize_run is the one lower-level finalizer used by production and fixed tests. It streams and
        verifies the payload, durably renames it, closes complete payload-duration timing, then durably publishes
        runtime-custody/<run_id>/operational-completion.json. The companion excludes its own duration and self-hash.
        Companion failure quarantines the payload, the original typed stop retains secondary custody failures, and
        temporary progress cleanup occurs only after both required durable records exist.
      fixed_cases:
        - finalizer_success_stable_companion
        - payload_rename_failure_quarantines
        - companion_failure_quarantines_payload
        - companion_failure_preserves_primary_type
        - cleanup_failure_retains_custodies
        - publication_cancel_type_preserved
        - publication_resource_type_preserved
    S4V-04:
      implementation: >-
        future_cell constructs and retains all seven frozen assignments, RNG counter ends and bucket counts before
        reducing occupancy once. A mismatch retains assignments_completed:7 and null_censuses_started:0 and stops.
        Only a valid assignment set enters the separate seven-arm null-census loop; relabel and scalar-certificate
        immediate stops and assignment-preparation cost remain unchanged.
      fixed_cases:
        - occupancy_immediate_stop
        - relabel_immediate_stop
        - failed_certificate_retained_before_stop
