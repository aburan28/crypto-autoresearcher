  accepted_review_finding_coverage:
    F-01:
      finding: Singular frozen candidates must be discarded and recorded without aborting lexicographic selection.
      implementation: fixture_scan checks the discriminant before Curve construction, records a rejection certificate, and continues within the fixed candidate range.
      regression: test_03 and test_04; final static fixture-accumulator regression test_26.
    F-02:
      finding: The constant-O control must be an all-start reset-map census, not an asserted Boolean.
      implementation: constant_o_census executes the two-step reset transition, retains every repeated-O collision, and requires zero nonzero denominators and zero solves.
      regression: test_05 on three fixed mock labels only.
    F-03:
      finding: Failed certificates and named-control failures must invalidate a measurement; fruitless denominators are different.
      implementation: collision_census classifies verified_solution, fruitless_denominator, and failed_certificate; reduce_validity combines every coordinate/null certificate and named control before status selection.
      regression: test_06, test_07, test_12, and test_13.
    F-04:
      finding: The future package must have real provenance, manifest fields, and canonical companions.
      implementation: artifact_bytes includes nonempty execution provenance, measured resources, validity/certificate semantics, command.txt, environment.json, raw-result.json, and the integrity inventory.
      regression: test_20 plus static driver coverage inspection; no future package was published.
    F-05:
      finding: Cancellation/resource stops must retain partial fixture/start/cell work and use operational classifications.
      implementation: ProgressSink fsyncs append-only selection/rejection/start/cell records and a count checkpoint; run_future_pipeline maps cancellation, resource exhaustion, and infrastructure failures separately and retains partial package data.
      regression: final targeted test_19 uses one fixed mock partial certificate and checks its durable staging line/count.
    F-06:
      finding: Enforce process-group memory, bounded cancellation checks, one worker, and measured resource costs; do not retain superseded routine wall/CPU cap semantics.
      implementation: Guard checks current process-group RSS at 8 GiB in every future loop; ResourceMeter records total and stage CPU/wall values, including a partial active stage. The execution plan explicitly labels historical wall/CPU values advisory under the amendment.
      regression: final targeted test_24 statically checks the process-group guard and advisory-policy statement.
    F-07:
      finding: Canonical future publication must be atomic and leave a typed failure receipt on I/O failure.
      implementation: atomic_publish writes and fsyncs a sibling staging tree, verifies all hashes/set membership, renames only the complete tree, and moves a failed staging tree with publication-failure.json under runs/incomplete.
      regression: test_23 is a static path check; no RUN directory was made.
    F-08:
      finding: Canonical custody must retain rejected fixtures, cost components, Cayley gap, and one all-u finite decision.
      implementation: artifact_bytes serializes accepted/rejected fixtures, per-arm operation/success/cost components, control and certificate records, separate Cayley gaps, availability, per-u inputs, and global_decision.
      regression: test_08 through test_11 and test_14 through test_18.
    F-09:
      finding: Launch admission must verify review semantics and a reachable archive, not merely arbitrary path/hash bytes.
      implementation: verify_review_admission parses the receipt/report, verifies report/task/hash/snapshot/PASS semantics against a reachable archive commit; verify_launch_admission binds all real authority and source/runtime/resource bytes before the future runner is reachable.
      regression: test_21 and test_22 exercise only fail-closed absence/incomplete-admission paths; no trust root, key, signature, lock, review verdict, or run identifier was created.
