protocol_amendment:
  experiment_id: EXP-ECDLP-651b94
  approved_by: DEC-20260907-38017a
  recorded_at: '2026-09-07'
  applies_to: Future execution only; original specification, implementation and independent reports remain immutable.
  source_specification:
    path: experiments/EXP-ECDLP-651b94/specification.yaml
    sha256: 97b44f40c8f9d52a587cf4fd9788dd391e42ce5c6dab8ec212a8af34cdfa4eee
  source_review_snapshot: aeea9f8ad3ed455baa88d01ebb1853617d5956c1
  scientific_changes:
    availability: 'An inferential cell is available exactly when the coordinate arm has Zcoord>0 and the sum of
      useful successes over all seven null arms is positive. A zero-success individual null arm does not censor
      a pooled-side cell: retain and charge all its work. If either total denominator is zero, retain the raw counts
      and mark the cell unavailable, never impute or delete it.'
    pooled_null: Cnull=sum_j Wnull_j / sum_j Znull_j. Ccoord=Wcoord/Zcoord. d=log(Cnull/Ccoord). Do not average
      per-null ratios.
    positive: All 96 held-out cells are available and all named validity controls pass; each of three u arms has
      mean d>=log(1.20) over its 32 cells and each of its four curve means is strictly positive.
    negative: All 96 held-out cells are available, all named validity controls pass, and every held-out d<=0.
    otherwise: Inconclusive, with all unavailable cells and validity/operational causes retained. No threshold,
      seed, sample count, curve or coordinate is changed.
  operational_policy:
    wall_cpu: The historical routine total/stage wall and CPU estimates are advisory under AGENTS.md. Measure total
      and per-stage wall/CPU honestly; do not invalidate or stop solely because those estimates are exceeded. No
      stagnation restriction is activated.
    machine_protection: 8GiB process group, one worker, explicit cancellation and any separately justified process
      watchdog remain enforceable. Check inside long loops and preserve progress. Watchdog/cancellation/resource
      stops are operational incomplete outcomes, never evidence against the hypothesis.
    publication: Add command.txt, environment.json and raw-result.json to the nine experiment-specific files as
      required by the existing ledger schema. Bind actual executing revision, command, environment, metrics, certificate
      semantics and artifact hashes. Prepare in a same-filesystem staging directory, verify and atomically publish;
      preserve typed infrastructure failure receipts if publication fails.
  authority: Standing user authorization permits this complete prospective clarification and implementation correction.
    It does not approve the current implementation or authorize this zero-run task to measure.
