  stopping_rules:
    - "Stop on exact relabelling, occupancy or scalar certificate failure; preserve all data as invalid."
    - "Any stage CPU/wall or8GiB process-group RSS limit => partial/inconclusive, never shorter-collision evidence."
    - "Stop at frozen matrix; no tuning or new mechanism generated from held-out anomalies within this experiment."
  invalidation_rules:
    - "Wrong coefficient recurrence or collision denominator, hidden target scalar used by producer, omitted fruitless starts or illegal seed/curve selection."
    - "Cayley spectrum failure invalidates calibration; never transfer its gap to F. Step work and wall-time columns must remain distinct."
  success_criterion: "Complete valid four-curve panel and all32 finite held-out cells per u; all three u satisfy mean d>=log(1.20) and positive mean for each fixed curve. Nominates only a finite coordinate diagnostic for independent review, not a population effect."
  falsification_criterion: "Complete valid finite panel and d<=0 in every held-out cell for all three u. No coordinate-work advantage is present in this finite panel. Positive and negative criteria are mutually exclusive; every other pattern, including mixed signs or missing/zero-yield cells, is inconclusive."
  decision_branches:
    positive: "Independently rederive useful-work statistic from definitions and replay certificates; only then design a separate mechanism/scale study if missing user proposal is supplied and admission cleared."
    negative: "Record all cell ratios and exact finite boundary; keep the missing user idea open. No global spectral/random-walk closure or confidence exclusion."
    inconclusive: "Report missing cells, infinite costs or intermediate effects. Do not tune against held-out data; require a new precommitted hypothesis for any anomaly follow-up."
  tail_checks:
    - "Report zero-success starts/arms and maximum cycle and tail lengths; they remain charged even when no solution is possible under that fixed partition."
  overlap:
    nearest:
      - "EXP-EWALK-18e4d4"
      - "IDEA-20260905-f3ce04"
    difference: "Reuse existing exact useful-collision census design where possible; this fixes x-mod3 occupancy shuffles and separates Cayley calibration from deterministic rho. No novelty or prior-result verification is claimed."
  operation_count_rule: "The primary diagnostic counts one group addition or doubling as one transition operation and separately counts verification group operations. Record multiplication/squaring/inversion counts only for instrumented arithmetic; opaque backend counts unavailable. A primary diagnostic gain is not a CPU or memory advantage."
  randomness:
    hash: "SHA256, UTF-8 bytes of JSON.stringify([experiment_id,purpose,[p,A,B,r,k,u,arm],seed,counter]); JSON has no whitespace; integers decimal; unused numeric tuple fields0; seed and counter are nonnegative integers. Read digest as unsigned256-bit big-endian integer. Separate counter starts0 for each complete tuple excluding counter."
    uniform: "To draw uniform integer in[0,n), reject digest >= floor(2^256/n)*n; increment counter on every digest including rejection; accepted output is digest mod n. For n=1 output0 and consume one digest. No platform PRNG or modulo-biased draws."
    purposes: "Use exactly query for input scalars, control for random control scalars, field_x for extension point coordinates, target for spectral target scalar, shuffle for Fisher-Yates. Each list follows increasing query/control/coordinate index. Arm is0 except shuffled partitions1..7. Scalar timing seed is the declared seed. Fixture selection has no randomness."
    shuffle: "Fisher-Yates starts from canonical sorted input and for i=n-1 down to1 draws j uniformly in[0,i], then swaps entries i,j. Curve subgroup point order is infinity first, then increasing integer x and y; extension coefficient-vector order is increasing integer sum_j a_j p^j."
    pairing: "For query/control/field_x/target streams, use original unscaled curve coefficients A,B with u=0 and arm=0 so coordinate models share the same underlying sampled inputs. For shuffle use original A,B and actual u in1,2,3 and actual arm1..7. In all cases k is actual embedding degree for character experiment and0 otherwise. Counter persists globally for each complete stream tuple across all calls; never reset between draws. Spectral target is selected once per fixture/seed before any u or shuffle. Volcano floor-specific A,B are original normalized floor coefficients; query lists for coordinate variants are exact transports of the same samples."
  evidence_eligibility_note: "evidence_eligible:false describes this unexecuted design record. Future run evidence eligibility requires an explicit committed approval/lock that names this frozen specification and its permitted claim scope; no results are forbidden merely because their prospective design was not itself evidence."
  verification_cost: "For each candidate nonzero-denominator collision, recover a_hat with extended-Euclid inversion modulo r and verify [a_hat]G=Q using explicit left-to-right binary double-and-add, initialized O. For each binary digit execute one doubling, followed by one addition if digit1; count every executed addition/doubling including identity calls. Scalar inversion and comparison costs are reported separately in CPU and integer-operation columns, not hidden in group-operation v_s. No optimized library multiplication may replace this counted verifier. A failing candidate is retained, counted and invalidates the certificate control."
