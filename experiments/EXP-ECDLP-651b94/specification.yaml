  id: "EXP-ECDLP-651b94"
  hypothesis_id: "H-ECDLP-3a1c90"
  source_proposal: "IDEA-20260905-f3ce04"
  title: "Coordinate rho-partition control with separate Cayley spectral calibration"
  objective: "Provide a complete reusable control for the truncated spectral idea. Measure useful relation yield of a fixed coordinate-dependent rho map against shuffled occupancy-matched assignments. The Cayley spectrum is a correctness calibration only; the experiment makes no spectral claim about a deterministic rho map."
  inputs:
    fixtures: "For b in[9,11], enumerate the first32 primes p>=2^b and curves y²=x³+x+B, B=0..31, lexicographically. Discard singular and supersingular curves. Let r be the largest prime divisor of N in[127,509] with v_r(N)=1 and r!=p. Select first two eligible distinct p per b before any graph/partition measurement. G is first nonzero [N/r]P from points ordered by(x,y), x<=min(p-1,4095). Certify order and enumerate G exactly by repeated addition."
    seeds: "Seed numbers606300..606315 inclusive; indices0..7 exploratory control checks,8..15 held out. SHA256 rejection sampling with domain-separated strings experiment/fixture/seed/purpose/counter supplies every integer. Archive complete stream specification. For each seed select a in1..r-1, Q=[a]G. Only isolated verifier/reference receives a; rho transition receives G,Q,r and point coordinates."
    partitions: "For u=1,2,3 conjugate equation,G,Q by (x,y)→(u²x,u³y). At infinity set c(O)=0; otherwise c(R)=integer(x(R)) mod3. Define F(R)=R+G if c=0, R+Q if c=1, [2]R if c=2. For each cell make seven independent uniformly shuffled assignments of the same multiset of c-values to the canonical lexicographically sorted point list, via SHA256 rejection-sampled Fisher-Yates. Shuffles preserve branch counts, not the original transition graph."
    unavailable_fixture: "Fewer than two distinct-p fixtures per b, point search cap or invalid subgroup => incomplete/inconclusive; do not widen r,p or permit supersingular substitutions."
    baseline_calibration: "Build symmetric lazy K on all r points with weights1/2 stay and1/8 for±G,±Q. Degenerate coincident moves add weights. Separately build labelled cyclic reference from a only in verifier. This is a reversible doubly stochastic operator; λ1=1 and gap=1-max(nonconstant eigenvalues). r prime and G nonzero ensure connectedness. Do not compute a purported rho gap from this formula."
  controls:
    - id: "cayley_exact"
      description: "All entries nonnegative, row/column sums1 within1e-12; eigenvalue multiset matches Fourier formula within1e-10 using128-bit arithmetic. For t=0,1,2,4,8,16,32 compare point-basis distribution from O to inverse-Fourier distribution in total variation within1e-10. Report actual total variation, not an inferred DLP benefit."
    - id: "relabel"
      description: "Apply one seeded bijection simultaneously to state names and the fixed transition/coefficient action table. First-collision length and useful relation count must be exactly identical. This identity is only an instrument control; shuffled partitions are a different operation."
    - id: "known_false"
      description: "Replace F by the constant O map with tracked coefficients reset to(0,0). Every repeated O collision has ΔB=0 and must be fruitless; any reported solve fails control. Also modify one candidate recovered scalar by1 modr and require independent curve certificate failure."
    - id: "occupancy"
      description: "Every shuffled partition has exactly the same three bucket counts as the coordinate arm. Report counts and seven null results individually, retaining zero-yield arms."
    - id: "coordinate"
      description: "Frozen u=1,2,3 are separate primary comparisons. A positive in one coordinate model only is representation-specific and falls into inconclusive for the robust effect hypothesis."
  independent_variables:
    - "four fixed curves"
    - "target/partition seed"
    - "u=1,2,3"
    - "coordinate assignment versus seven occupancy-matched shuffles"
  metrics:
    primary:
      - "For each curve/seed/u/arm enumerate all r starts R0=[s]G with known initialization(A0,B0)=(s,0), s=0..r-1. Stop each at first repeated point, at most r+1 transitions. Update coefficients by the matching +G,+Q or doubling rule. Let w_s be actual group additions+doublings through that repeat; let v_s be scalar-verification group operations for nonzero ΔB; let z_s=1 iff ΔB!=0 and a_hat=(A_old-A_new)/(B_new-B_old) verifies [a_hat]G=Q. C=sum_s(w_s+v_s)/sum_s z_s, infinity if no success. This charges fruitless work under uniform-start restart; group adds/doubles are reported separately as well."
      - "Cnull pools all seven shuffles: sum their work / sum their successes, not mean of per-shuffle ratios. d=log(Cnull/Ccoord); any infinity makes that inferential cell unavailable but remains in raw results."
    secondary:
      - "Mean first-repeat length, useful fraction, fixed points, two-cycles, component sizes, max tail/cycle length and full collision certificates."
      - "Fully charged measured CPU and wall per diagnostic, including subgroup enumeration, shuffle construction, partition queries, collision table memory, all rejected starts and verification; separate from primary step diagnostic."
      - "Cayley gap and measured total-variation curve only in separately named reversible calibration. No rho eigen-gap, singular-gap mixing bound, stationary-uniformity claim or inferential p-value."
  analysis_plan: "Freeze F and all thresholds before either seed set. Held-out set is4 curves*8 seeds=32 cells per u. No exploratory seed data may select a curve, u, partition rule or metric. Report every raw d and their equal-weight mean for each u and each fixed curve. Primary decision is the exact finite-panel threshold, not a statistical test: no sign-flip test, bootstrap, p-value or confidence interval is computed or claimed. All32 finite cells per u are required; retain every infinity and report it as an unavailable inferential cell rather than silently deleting it. Finite empirical summaries do not establish randomness, independence beyond the stated sampling procedure, or curve-population behavior."
  preregistered_prediction:
    quantity: "Robust finite held-out coordinate-partition diagnostic"
    formula: "For each u, mean of32 d>=log(1.20), and within each of the four curves mean d>0. Ratio1.20 means20% speedup or16.7% less work, not20% cost reduction."
    source: "Coordinator control hypothesis H-ECDLP-3a1c90, not the missing user mechanism. Cayley Fourier identity is a prospective mathematical control."
