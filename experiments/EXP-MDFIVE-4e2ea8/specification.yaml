experiment:
  id: EXP-MDFIVE-4e2ea8
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-9b3b6b; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-9b3b6b
  question_id: RQ-MDFIVE-6870c1
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Measure forward and backward single-bit difference wavefronts through MD5's step function
    and its exact inverse, with XOR and rotation ablations and a random-bijection null, over 8 starting
    steps and 8 bit positions.
  objective: 'The run reduces one uncertainty: whether MD5''s step function diffuses a state difference
    differently in the two directions, and if so whether the difference is attributable to carry direction.
    As parts: (i) it establishes, by a 10^6-sample round trip, that the backward computation implemented
    here is the exact inverse, without which no backward measurement means anything; (ii) it produces
    mean support-growth curves in both directions, per round and per starting bit position, with variances
    and position histograms, so that a separation can be judged against sampling noise rather than
    eyeballed; (iii) it decides the mechanism question by ablation, since an XOR-ablated MD5 has no
    carries and a rotation-ablated MD5 has no positional shift, and the two ablations between them
    attribute any observed separation to one, the other, or neither. The run reduces no uncertainty
    about attack cost in either setting and produces no path, no collision and no preimage. If the
    curves coincide, the direction-asymmetry reading of the bucket''s central question is closed with
    a number and a scope, which is a first-class deliverable under docs/inventor-protocol.md section
    4 and is recorded as an obstruction with its measured value, not as a fatigue report.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: for full MD5 as specified, under
      single-bit state perturbations at the declared starting steps and bit positions, the mean difference-support
      curve forward differs from the curve backward by at most X bits at step k, with the ablations
      attributing that difference as measured. What does NOT follow: nothing about the cost of finding
      a preimage or a collision, nothing about whether an attacker can exploit a slower wavefront
      in either direction, nothing about structured or multi-bit differences, and nothing about any
      other hash function.'
  inputs:
    procedure: STAGE 0 implement MD5's forward step and its exact inverse, validate the forward implementation
      against RFC 1321 test vectors, and round-trip 10^6 random (state, word) pairs; cost minutes,
      any failure halts. STAGE 1 declare the starting steps, bit positions, sample counts and the
      definition of saturation, before any measurement; cost is review time. STAGE 2 run the forward
      arm over the declared grid; cost seconds to minutes in vectorised numpy. STAGE 3 run the backward
      arm over the identical grid with the identical sample seeds, so the two arms differ only in
      direction. STAGE 4 run the random-bijection null over the same grid and sample count in the
      same invocation. STAGE 5 run the XOR ablation and the rotation ablation. STAGE 6 aggregate means,
      variances, histograms and saturation step counts; compute the maximum curve separation and its
      bootstrap interval. STAGE 7 repeat the inverse round trip to confirm no state corruption occurred
      during the run. STAGE 8 emit the manifest and the raw per-cell arrays.
    instrument: Python 3.11 with numpy for vectorised 32-bit modular arithmetic over sample batches,
      run under harness/runner.py so seeds, wall-clock ceiling and the resolved inference block land
      in the run manifest. A purpose-written RFC 1321 MD5 exposing per-step state and an exact per-step
      inverse, cross-validated against hashlib.md5 on the published test vectors and on 10^6 random
      messages. The random-bijection null uses a 128-bit permutation built from a fixed wide-block
      construction seeded by the message word, implemented in the same file so both arms share the
      measurement code exactly. No Sage, no external cryptanalysis library.
    parameters: 'Starting steps t in {0, 8, 16, 24, 32, 40, 48, 56} covering all four rounds. Starting
      bit positions in {0, 3, 7, 15, 23, 27, 30, 31} within the perturbed word, chosen to span low,
      middle and high positions relative to carry direction. Propagation depth k = 1..12 in each direction.
      Samples: 10^4 per (t, bit, direction) cell, giving 8 x 8 x 12 x 10^4 = 7.68 x 10^6 measured
      supports per direction. Nulls and ablations at identical grid and sample count. Round-trip validation:
      10^6 pairs, twice. Saturation threshold: mean support >= 64 bits.'
  controls:
  - Random-bijection null with a message-keyed 128-bit permutation, identical measurement, same invocation.
  - XOR-ablated MD5 isolating carry contributions while preserving rotations.
  - Rotation-ablated MD5 with all rotation amounts set to zero, isolating rotation contributions while
    preserving carries.
  - Round-restricted arms so the four different nonlinear functions F, G, H, I are not silently averaged
    together.
  - An inverse-correctness round trip over 10^6 random pairs, run before and after the measurement
    to catch state corruption.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls run in the same invocation. First, a random-bijection null:
    replace MD5''s step by a state-size-preserving random bijection built from a keyed permutation
    over 128 bits, keyed by the message word, and run the identical forward and backward measurement.
    It must show saturation within one or two steps in both directions and no direction asymmetry,
    since a random bijection has no carry direction. Second, an XOR-ablated MD5 in which every modular
    addition becomes XOR: it must show zero carry-driven asymmetry while preserving all rotation structure.
    For the signal arm to mean anything, MD5''s forward and backward curves must separate by more
    than the random-bijection null''s sampling band, and that separation must shrink materially under
    the XOR ablation; if it does not shrink, the effect exists but the named mechanism is refuted.'
  independent_variables:
  - 'direction: forward versus backward'
  - starting step index t
  - starting bit position within the word
  - propagation depth k
  - 'arm: MD5, XOR-ablated, rotation-ablated, random-bijection null'
  metrics:
    primary:
    - mean difference-support size per (direction, t, bit, k)
    - maximum absolute forward-backward curve separation across k = 1..8
    - steps to saturation per direction
    - ratio of separation under XOR ablation to separation unablated
    secondary:
    - variance of support size per cell
    - bit-position occupancy histogram at k in {1, 2, 4, 8}
    - separation observed in the random-bijection null
    - per-round breakdown across F, G, H, I
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The maximum absolute separation between the forward and backward mean-support curves
      over k = 1..8, and its ratio under the XOR ablation.
    formula: 'Sep = max over k in 1..8 of the absolute difference between the mean forward support
      weight and the mean backward support weight after k steps, in bits, averaged over the declared
      (t, bit) grid, where the weight is the Hamming weight of the 128-bit state XOR. Predicted: Sep
      >= 3 bits for MD5; Sep under the XOR ablation at most half of Sep; Sep in the null at most 0.5
      bits.'
    source: Pre-registered in the parent proposal IDEA-20260816-9b3b6b before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: The measurement runs on full MD5 with its real 128-bit state, its real rotation
      constants and its real nonlinear functions, so nothing is scaled down and no size extrapolation
      is made. The toy designation refers only to compute cost. The one transfer assumption, stated
      plainly, is that a statistic measured under uniformly random states and message words describes
      the function in a way that remains meaningful under the highly non-uniform states an actual
      attack would visit; this record does not assume that transfer holds and claims nothing that
      depends on it.
    correspondence: null
  tail_checks:
  - Inverse round trip must pass before and after the measurement, on 10^6 pairs each time.
  - The random-bijection null must saturate within 2 steps in both directions; failure indicates a
    broken null.
  - Rotation-ablated MD5 must show a position histogram with no positional shift; otherwise the ablation
    is not doing what it claims.
  - Bootstrap the separation over 1000 resamples and require the interval to exclude the null band
    before reporting an effect.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt on any inverse round-trip failure.
  - Halt if the forward implementation fails an RFC 1321 test vector.
  - Fix sample counts before the run; do not extend a cell after seeing its separation.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The forward-backward separation exceeds 3 bits with a bootstrap interval excluding
    the random-bijection null band, and drops to at most half that value under the XOR ablation, with
    both round-trip validations passing and the full grid reproduced from the manifest seeds.
  falsification_criterion:
  - Separation below 3 bits across the whole grid.
  - Bootstrap interval for the separation overlaps the random-bijection null band.
  - XOR ablation leaves the separation above half its unablated value, refuting the carry mechanism.
  - Random-bijection null itself shows separation above 0.5 bits.
  - Per-round breakdown shows the separation confined to one round in a way that vanishes when that
    round is excluded, indicating a nonlinear-function artefact rather than a direction effect.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-9b3b6b
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must approve the random-bijection null construction, since a poorly chosen 128-bit
    permutation could itself carry a direction bias and would invalidate the whole comparison.
  - The definition of saturation and the choice of k range need fixing before approval, because a
    k range that reaches saturation censors the comparison and one that stops too early misses the
    effect.
  - Whether per-round arms should be reported separately or pooled must be decided in advance to avoid
    post-hoc subgroup selection.
