experiment:
  id: EXP-FBG-b23342
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-d35a3e; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-d35a3e
  question_id: RQ-FBG-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Two-sided coverage battery: four exponent-defined and four x-line-defined factor-base geometries
    at matched size on toy prime-order curves, exact multiset counting, matched random null and random-exponent
    provenance control in one invocation'
  objective: 'The one uncertainty a run reduces is whether the coordinate a geometry is defined in
    - exponent group versus x-line - predicts its coverage excess against a matched random base, and
    at what membership cost each side buys its excess. Stated in parts: (i) SEPARATION - measured
    over four geometries per side at matched size on the same curves with the identical exact counter,
    do the two sides'' coverage excess distributions separate outside their permutation-null bands,
    or do they overlap, in which case the coordinate of definition is not the organising variable
    and the existing family-name taxonomy is not improved by this re-indexing; (ii) PROVENANCE VALIDITY
    - does a random exponent set, which is exponent-side by construction but carries no designed structure,
    sit at the null, since if it does not then the exponent-side pipeline itself manufactures excess
    and no comparison between the sides can be read; (iii) COST PAIRING - what is the measured per-candidate
    membership cost on each side, so that any excess is reported next to what it costs to build the
    base rather than alone. A run cannot reduce uncertainty about relation yield in a running index
    calculus, about index-calculus cost against the generic square-root baseline, about behaviour
    at cryptographic sizes, or about whether some untested x-line geometry could reach the ceiling.
    It also cannot support any statement that a direction is impossible. The deliverable is a table
    of eight geometries plus two controls with exact coverage, excess ratio, bootstrap and permutation
    intervals, effective size after negation collapse, and measured membership cost.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A completed run could support at most this: on the named toy
      prime-order curves at the stated N values, at base size B equal to ceiling of (6N) to the one-third
      power and arity m equal to 3, with exact counting over the complete target space, the eight
      named geometries and two controls have the reported exact coverage values and the reported excess
      ratios against a matched random base of identical nominal size, with the reported intervals,
      and the two coordinate-of-definition groups do or do not separate. WHAT DOES NOT FOLLOW: nothing
      about relation yield, relation rank, or independence in a real index-calculus run; nothing about
      the cost of point decomposition or of linear algebra; nothing about whether index calculus beats
      the generic square-root method over prime fields; nothing about any geometry not built here;
      nothing about behaviour at any size beyond those tested; no claim that x-line geometries cannot
      show excess, only that the tested ones did or did not; and no attack, break, speedup or security
      consequence of any kind. An exponent-side excess in particular supports nothing operational,
      because that base''s discrete logarithms are known by construction.'
  inputs:
    procedure: 'STAGE 0, curve and table (cost: seconds per curve). Generate prime-order toy curves
      via harness/toycurve.py, verify order primality, Hasse interval membership and that N times
      G is the identity, and build the full discrete-logarithm table, checking it is a bijection.
      STAGE 1, construction (cost: minutes). Build four exponent-side geometries (Sidon-style, arithmetic
      progression, multiplicative coset, greedy low-collision) and four x-line-side geometries (high-bit
      interval, low-bit interval, quadratic-residue x, cubic-image x), each at 1.2B then trimmed to
      exactly B under two independent trimming rules. Instrument every construction to count field
      operations per candidate. STAGE 2, controls (cost: seconds). Draw the matched random base and
      the random exponent set in the same process under recorded seeds. STAGE 3, exact counting (cost:
      the dominant cost, order N times B squared per cell). For every base compute the exact multiset-sum
      count vector over all N targets, verify the closed-form total equals binomial(B+m-1, m), and
      derive coverage. STAGE 4, nulls (cost: 200 times STAGE 3 per cell for permutations, reduced
      by reusing the count structure). Bootstrap intervals over curves and seeds, permutation band
      over base labellings. STAGE 5, effective size (cost: seconds). Compute negation-collapsed effective
      size per base. STAGE 6, report (cost: 1 hour human). Emit the table with every control result
      printed beside its signal cell.'
    instrument: Python 3 with harness/toycurve.py for exact curve arithmetic, discrete-logarithm table
      construction and the certificate-style verification it already provides; numpy for the count
      vectors and the permutation loop; harness/runner.py for the run manifest and the inference block.
      No Sage. The exact counter is written fresh but validated against brute force on a small subcase
      and against the closed-form total on every cell, mirroring the verification discipline recorded
      in the frozen battery's evidence record.
    parameters: 'Curves: at least 4 generated prime-order curves per size. Sizes: N near 2^12, 2^14
      and 2^16 for the full contract, N near 2^14 alone for the minimal arm. Base size: B equal to
      ceiling of (6N) to the one-third power, matching the frozen battery''s convention, giving B
      near 46 at 2^16. Arity: m equal to 3. Geometries: 8, plus 2 controls, times 2 trimming rules,
      times 4 seeds, times 4 curves, times 3 sizes - 960 cells for the full contract, 80 for the minimal
      arm. Permutation draws: 200 per cell. Target space: complete, no sampling. Locus degree for
      the cubic-image x-line family: 3. Coset order for the multiplicative coset family: the largest
      divisor of N minus 1 below B.'
  controls:
  - Matched random base of identical size B drawn in the same invocation and measured by the identical
    counter.
  - Random exponent set of size B - exponent-side provenance, no designed structure - which must sit
    at the null.
  - 'Trimming-order control: each geometry built at 1.2B and trimmed to B under two independent trimming
    rules, reported separately.'
  - Exact-counting verification against brute force on a small subcase, reproducing the frozen battery's
    own counter check.
  - 'Closed-form total check: the summed multiset count over all targets must equal binomial(B+m-1,
    m) exactly for every base, which is a per-cell integrity test that costs nothing.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The mandatory null is a MATCHED RANDOM BASE: B distinct group elements
    drawn uniformly without replacement from the same group, in the same invocation, measured by the
    identical exact counter, with the identical coverage definition. For the signal arm to mean anything
    the null must reproduce two known quantities: mean multiset count per target equal to binomial(B+m-1,
    m) divided by N exactly, and coverage at or below min(1, mean). A second null is required on the
    provenance side: a RANDOM EXPONENT SET, which is exponent-side by provenance but carries no designed
    structure, and which must land at the null coverage. If a random exponent set shows excess, the
    excess is an artifact of the exponent-side construction pipeline rather than of geometry, and
    the entire side comparison is void.'
  independent_variables:
  - coordinate of definition (exponent side or x-line side)
  - geometry family within side (4 per side)
  - group size N
  - trimming rule
  - curve instance
  metrics:
    primary:
    - exact coverage per cell
    - coverage excess ratio against the matched random null
    - bootstrap confidence interval on the excess ratio
    - permutation-null band from 200 label permutations
    - measured per-candidate membership cost in field operations
    secondary:
    - effective base size after negation collapse and deduplication
    - closed-form total check residual per cell
    - realizability flag per geometry
    - trimming-rule agreement rate
    - maximum multiset count on any single target, as a concentration diagnostic
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The coverage excess ratio per geometry, grouped by coordinate of definition, and the
      excess of the random-exponent provenance control.
    formula: 'Coverage of a base D is the number of targets t in the group with at least one size-m
      multiset from D summing to t, divided by N. The excess ratio is that coverage divided by the
      coverage of the matched random base of identical nominal size measured in the same invocation.
      Predicted: the maximum excess ratio over the exponent-side arm is at least 1.05; every x-line-side
      excess ratio has a family-wise interval containing 1.00; the random-exponent control has an
      excess ratio whose interval contains 1.00. Independently forced and checked, not predicted:
      the summed multiset count over all targets equals binomial(B+m-1, m) exactly for every base
      regardless of geometry, so mean yield ratio is exactly 1.000000 and is used only as an integrity
      check.'
    source: Pre-registered in the parent proposal IDEA-20260816-d35a3e before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are N near 2^12 to 2^16, B near 29 to 46, arity 3, on at least
      4 generated prime-order curves per size, with exact counting over the complete target space
      so there is no sampling error in the primary metric. The transfer assumption is stated and is
      weak: nothing here extrapolates to cryptographic sizes, because the object requires a full discrete-logarithm
      table and because coverage at these sizes sits in a regime where the ceiling min(1, mean) is
      not yet saturating. The only cross-scale statement the contract permits is the direction of
      the trend across the three tested sizes, reported with its slope and interval and explicitly
      labelled as a three-point trend at toy scale, not an exponent.'
    correspondence: null
  tail_checks:
  - The smallest tested N, where coverage is closest to saturating and excess ratios compress toward
    1.
  - The largest tested N, where the exact enumeration is most expensive and any counter bug would
    surface as a closed-form total residual.
  - Geometries whose negation-collapsed effective size differs most from B, which is where the matched-size
    control is weakest.
  - Curves where the multiplicative coset family cannot reach size B because N minus 1 has no suitable
    divisor, which must be reported as an infeasible cell rather than silently substituted.
  - The single target carrying the maximum multiset count in each cell, checked by brute force.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - 'Halt and report if the random-exponent provenance control shows excess outside its null band
    at any size: the pipeline manufactures signal and no side comparison can be read.'
  - 'Halt and report if any closed-form total residual is nonzero: the counter is wrong and every
    number in the run is void.'
  - Per-cell wall-clock budget of 1800 seconds and total budget of 96 cell-hours for the minimal arm;
    a cell exceeding it is recorded as infeasible, which under AGENTS.md rule 3 is not negative mathematical
    evidence.
  - Stop the full contract after the minimal arm if the two sides do not separate at N near 2^14,
    and report the overlap.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All cells pass the closed-form total check with zero residual and the brute-force
    counter check; the random-exponent provenance control sits within its null band; and the run reports,
    for each of the eight geometries, an exact coverage excess ratio with bootstrap and permutation
    intervals, a negation-collapsed effective size, and a measured membership cost - whether or not
    the two sides separate.
  falsification_criterion:
  - The random-exponent provenance control shows excess outside its null band.
  - An x-line-side geometry attains excess at or above the best exponent-side geometry, refuting the
    coordinate split as the organising variable.
  - No exponent-side geometry exceeds an excess ratio of 1.05 at any tested size, refuting the premise
    that the ceiling is approachable at these parameters.
  - Any closed-form total residual is nonzero.
  - The two trimming rules give opposite verdicts for the same geometry at the same size.
  - Negation-collapsed effective sizes differ systematically between the two sides, in which case
    the matched-size control is confounded and the side comparison is reported as uninterpretable
    rather than as a result.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-d35a3e
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - 'The correct definition of matched size is not settled here: nominal B, negation-collapsed effective
    B, or matched multiset count binomial(B+m-1, m). A Coordinator must fix one as primary before
    approval, or require all three to be reported with the verdict stated under each.'
  - The trimming rule for reducing a 1.2B construction to exactly B is not derived; two rules are
    specified but neither is argued to be structure-preserving.
  - Whether the Bose-Chowla style exponent-side construction as reimplemented here reproduces the
    1.1071 figure recorded in the frozen evidence record's red-team objection is a port-fidelity obligation
    a Coordinator should require before the exponent arm is read as calibrated.
  - The realizability flag needs a precise definition of what counts as a membership test, since a
    loose definition makes every geometry realizable.
