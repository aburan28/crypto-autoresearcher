experiment:
  id: EXP-ALBIN-006
  hypothesis_id: H-ALBIN-006
  version: 1
  title: 'Autolab binary-field BIN-EXP-006: m scaling'
  status: approved
  objective: 'Archive Autolab experiment `bin_exp006` (binary-field ECDLP) as an immutable harness reproduction
    package. Source finding: BIN-NR-003 (capstone) identified the |FB|²≈2^{2n/3} sparse-linear-algebra
    stage as the obstruction for fixed m=3. The Petit–Quisquater subexponential heuristic escapes it by
    **growing m** (≈n^{1/3}), which shrinks |FB|≈2^{n/m} and the LA exponent 2n/m. This experiment asks
    the directly-measurable version: **at FIXED n, does increasing m shrink the IC/rho gap (toward a crossover)
    or does the per-relation solving cost rise faster?** For n∈{31,41}, m∈{2,…,6}, we measure EXACT |FB|
    (enumerated) and '
  inputs:
    source_repo: /Volumes/Volume/autolab
    source_commit: dca04ac33e9ffcfc51edb3ae7e7bd558b1962d95
    source_id: bin_exp006
    import_tool: tools/port_autolab_experiments.py
    port_tag: autolab-port-20260731
  controls:
  - Preserve original Autolab scripts/logs/result artifacts under source/
  - Do not re-interpret Autolab negatives as universal impossibility
  - Certificate kind=none unless independently re-verified in-harness
  independent_variables:
  - source_id
  metrics:
    primary:
    - import_complete
    - source_artifact_sha256
    secondary:
    - source_result_present
    - source_script_present
  scale_relevance:
    tier: toy
    justification: Autolab campaigns are predominantly toy/feasibility scale; this import does not raise
      the claim ceiling.
    correspondence: null
  replication:
    seeds:
    - historical
    independent_instances: 1
  budget:
    wall_clock_seconds_per_run: 1
    total_cpu_hours: 0
    maximum_memory_gb: 1
    maximum_runs: 1
  stopping_rules:
  - Single historical import run; no re-execution in this experiment
  invalidation_rules:
  - Missing source result artifact
  - Mutating runs/ after import (supersede with new RUN id instead)
  success_criterion: Harness package contains specification, analysis, implementation, and one RUN with
    the six required companion artifacts, linked to a hypothesis under the area research question.
  falsification_criterion: Import package fails tools/validate_ledger.py schema checks, or source artifacts
    cannot be located at the pinned Autolab commit.
  required_artifacts:
  - specification.yaml
  - implementation.md
  - analysis.md
  - runs/<RUN>/manifest.yaml
  - runs/<RUN>/command.txt
  - runs/<RUN>/environment.json
  - runs/<RUN>/stdout.log
  - runs/<RUN>/stderr.log
  - runs/<RUN>/raw-result.json
  assigned_to: executor
  approved_by: coordinator
