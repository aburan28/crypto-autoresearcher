experiment:
  id: EXP-PFDR-4bfc6f
  hypothesis_id: H-PFDR-e02f3b
  question_id: RQ-PFDR-ae2fba
  idea_id: IDEA-20260903-751062
  version: 1
  recorded_at: '2026-09-03'
  drafted_under_task: TASK-20260903-b5d2ae
  battery_position: 5 of 6
  title: >-
    Mechanism separation of the recorded EXP-ALPF-011 prime-field early fall
    on the exact archived builders: the |FB| = 4..8 ladder with the shrink
    test, the S_4-scrambled null, the random-membership null, the Weil S_3
    positive control, planted versus random targets, and two cross-checked
    meters
  status: review_required
  approved_by: null
  assigned_to: executor
  objective: >-
    Classify the two archived prime-field 'early fall' signals quoted by
    EV-ALPF-001 and RQ-PFDR-ae2fba into the four mechanisms of
    H-PFDR-e02f3b (M1 genuine; M2 membership-only shared factor; M3
    CRT/unit-ideal; M4 output-degree proxy) with one invocation on the
    EXACT archived builders, so that the RQ's degree column is read from a
    validated meter with a matched null rather than from a Section-5
    auto-verdict. STAGE 0 (zero compute, hard gate): the induction of claim
    (B), the three syzygies, the D_reg table by hand, the archive check of
    all 16 e-ring cells, and a written comparison of EV-ALPF-001's two
    quoted lines against the archived files' own final sections. STAGE 1:
    reconstruct the inline ALPF leading-form meter from EXP-ALPF-009/010/013
    sources AND run the shared F_p meter in ordinary-monomial mode; cross-
    check both on POS-A / NEG-1 / NEG-2 and on the 16 archived e-ring, 16
    power-sum and 16 x-ring cells, which must reproduce integer for integer.
    STAGE 2: the exact e-ring and power-sum builders at |FB| in {4..8},
    three curves, three primes, planted and random targets, with NULL-S4,
    NULL-FB, the generic twin, POS-C and the gate's shrink test in one
    invocation; Q1 alongside; the weighted-grading arm reported separately.
    STAGE 3 (zero compute): a DRAFT superseding evidence note for the
    Coordinator, citing EV-ALPF-001 and editing nothing, stating the
    four-mechanism classification per archived arm; the Coordinator alone
    writes any evidence record. Budget note: budgets are at or above the
    template floors; matrices have at most 66 columns per degree but Sage
    Groebner calls and 200-target enumerations per cell dominate; the run
    granularity is one (|FB|, p) cell over all curves, targets and arms.
  inputs:
    builders: 'experiments/EXP-ALPF-011/source/round006_exp010_validated_resweep.sage: build_S4_poly, rewrite_S4_in_e_coords, build_fb_constraints_e_ring (and the power-sum builder), run unmodified at seed 42 for the archived cells'
    ladder: '|FB| in {4, 5, 6, 7, 8}; p in {4079 (the archived 13-bit Solinas a = -3 curve), a 17-bit random prime-order curve, a 23-bit prime-order curve}; three curves; seeds 42 (archive), 43, 44'
    targets: 'planted decomposable targets (vdim >= 1, certificate by independent point addition) and random targets (unit-ideal fraction reported); 200 random targets per (|FB|, p) for the unit-ideal enumeration over k^3 triples with no Groebner call'
    grading: 'standard deg e_i = 1 (primary, the archived convention giving profile [2, 2, 2, 4] at |FB| = 4); weighted deg e_i = i reported separately as a convention check'
    meters: >-
      (i) the inline ALPF leading-form meter reconstructed from
      EXP-ALPF-009/010 (round005 copies) and EXP-ALPF-013 (meter_local /
      meter_gated, with the series.list() D_reg fix); the file EXP-ALPF-011
      load()ed (round005_meter_validation.sage) is ABSENT from the archive
      and this absence is reported as a finding. (ii) REQUIRED INPUT (shared
      prerequisite, DEC-20260903-8cdf8d next_actions item 1): the F_p port
      of experiments/EXP-SBRG-60c55e/driver/macaulay.py in ordinary-monomial
      mode (3 free variables e_1, e_2, e_3; leading-form projection; the
      localization / shrink test), with (a) the p = 2 known answer against
      KN-FIND-006 and (b) the planted-syzygy positive control passed in the
      same manifest lineage. Both meters run on every cell and must agree.
    frozen_prediction_file: 'd_ff = |FB| - 1 (3, 4, 5, 6, 7); D_reg = 4, 5, 7, 8, 10; kernel dimension 3 at d_ff; shrink test 0; NULL-S4 identical; NULL-FB no fire; unit-ideal rate 1 - 8 k^3 / p per (k, p)'
    sage: 'Sage is required; if unavailable at dispatch the task is failed_infrastructure'
  controls:
    - id: CTRL-ARCHIVE-REPRODUCTION
      blocking: true
      object: 'the 16 archived e-ring, 16 power-sum and 16 x-ring cells at seed 42'
      forced_disposition: >-
        Profiles ([2, 2, 2, 4] at |FB| = 4, [3, 3, 3, 4] at |FB| = 5),
        d_ff (3, 4 e-ring; 10, 12 x-ring) and D_reg reproduced integer for
        integer by BOTH meters before any new cell is read. A mismatch halts
        the line as a reconstruction finding.
    - id: CTRL-METER-CROSSCHECK
      blocking: true
      object: 'inline ALPF meter versus the F_p port on every cell, and both on POS-A / NEG-1 / NEG-2'
      forced_disposition: >-
        Agreement on d_ff, D_reg, fires and kernel dimension at every cell;
        a disagreement is visible rather than silently inherited and voids
        the cell until localized.
    - id: NULL-S4
      blocking: true
      object: 'the exact e-ring membership generators with S4sym replaced by a uniformly random polynomial of total degree 4 in (e_1, e_2, e_3); 5 seeds'
      forced_disposition: >-
        d_ff = |FB| - 1, kernel 3, shrink test 0 -- identical to the Semaev
        arm (M2 signature).
    - id: NULL-FB
      blocking: true
      object: 'the exact S4sym with the membership generators replaced by three random forms of degree |FB| - 2 with no shared factor; 5 seeds'
      forced_disposition: >-
        No fire (d_ff = D_reg) at every cell; a fire is M1 by another
        route.
    - id: CTRL-GENERIC-TWIN
      blocking: true
      object: 'random system on the exact degree profile (section 8''s control, re-run)'
      forced_disposition: >-
        No fire.
    - id: POS-C-WEIL-S3
      blocking: true
      object: 'EXP-ALPF-013''s Weil-restricted S_3 over F_{p^2} (both components) and its synthetic gate-POS'
      forced_disposition: >-
        The gate PASSES (fires AND localization on summation rows) in the
        same invocation; a method that cannot separate POS-C from the e-ring
        may not report a classification.
    - id: CTRL-TARGET-ARM
      blocking: true
      object: 'planted (vdim >= 1) versus random targets'
      forced_disposition: >-
        The leading-form meter is indifferent; Q1 and vdim are not: random
        targets give the unit ideal at the HEUR-001 rate, planted targets
        give Q1 <= 2 at m = 3 by CRT; Q1 must not track the Macaulay d_ff.
    - id: CTRL-DECAY-LADDER
      blocking: true
      object: '|FB| = 4..8'
      forced_disposition: >-
        Under M2 the gap D_reg - d_ff is 1, 1, 2, 2, 3 and d_ff = |FB| - 1;
        a gap constant in |FB| is the artifact tell of an instrument and is
        reported first.
    - id: CTRL-P-INDEPENDENCE
      blocking: false
      object: 'the 23-bit cell'
      forced_disposition: >-
        Same integers as at 13 and 17 bits (nothing in the construction
        depends on p); small-p accidental common roots at 13 bits are what
        this cell excludes.
    - id: CTRL-CONFOUNDERS-NAMED
      blocking: false
      object: >-
        (i) the CRT / complete-splitting artifact of IDEA-20260830-cb8e46
        is mechanism M3 itself: random targets at these sizes give the unit
        ideal, so every ideal-invariant reading of the archive was of the
        unit ideal; planted targets are used for the leading-form and Q1
        arms and random targets only for the unit-ideal fraction. (ii) the
        output-degree proxy of IDEA-20260807-899c5e is mechanism M4 itself:
        Q1 is recorded as a covariate to calibrate EXP-ALPF-001's reading,
        never as d_ff. (iii) grading convention (weighted arm reported, not
        pooled). (iv) meter provenance (the imported file is absent; two
        reconstructions run).
      forced_disposition: >-
        Named; two of the four are the mechanisms under test and are
        separated by design.
  independent_variables:
    - '|FB| in {4, 5, 6, 7, 8}'
    - 'prime / curve in the three-value ladder'
    - 'arm: e-ring Semaev | NULL-S4 | NULL-FB | generic twin | POS-C | x-ring | power-sum'
    - 'target: planted | random'
    - 'grading: standard | weighted'
    - 'meter: inline ALPF | F_p port'
  metrics:
    primary:
      - 'd_ff, D_reg, fires, nontriv_full, nontriv_fb, gate_passes per (cell, arm, meter)'
      - 'kernel dimension at d_ff per arm'
      - 'shrink test nontriv_full - nontriv_fb at d_ff on the e-ring Semaev arm'
      - 'NULL-S4 and NULL-FB fires and d_ff per cell'
      - 'archived-cell reproduction table (16 + 16 + 16) and per-cell meter agreement'
      - 'four-mechanism classification per archived arm'
    secondary:
      - 'Q1 and vdim per cell, planted and random targets; unit-ideal fraction per (k, p) with binomial interval against 1 - 8 k^3 / p'
      - 'weighted-grading arm results'
      - 'frozen Stage 0 prediction file and signed residuals'
      - 'wall time, peak RSS per cell; certificate pass/fail per planted target'
  heuristic_under_test: 'HEUR-001 (unit-ideal probability) of H-PFDR-e02f3b through the enumeration arm; the main M1-M4 classification through the shrink test and nulls'
  preregistered_prediction:
    quantity: >-
      d_ff, D_reg and the localization bit on the exact e-ring builders
      across |FB| = 4..8, and the behaviour of the two nulls.
    formula: >-
      d_ff = |FB| - 1 = 3, 4, 5, 6, 7 with kernel dimension 3 and shrink
      test 0 at every (|FB|, p, curve); D_reg = 4, 5, 7, 8, 10 (first
      non-positive coefficient of (1 - t^{k-2})^3 (1 - t^4) / (1 - t)^3);
      NULL-S4 identical to the Semaev arm; NULL-FB and the generic twin do
      not fire; POS-C passes the gate; unit-ideal fraction on random targets
      within the binomial 99 percent interval of 1 - 8 k^3 / p; Q1 <= 2 on
      planted targets and not tracking d_ff.
    source: >-
      IDEA-20260903-751062 claim (B) (the recurrence and the three
      syzygies), (C) (the four-mechanism signatures) and its P1-P5;
      EXP-ALPF-011 section 8 and EXP-ALPF-013's gate table as archived
      priors. Fixed on 2026-09-03 before any run; never adjusted afterward.
  scale_relevance:
    tier: toy
    justification: >-
      p <= 2^23, |FB| <= 8, m in {2, 3}, the archived representations only;
      no transfer to other coordinates, F4 behaviour or cryptographic scale
      is claimed. The statement 'no recorded prime-field early fall involving
      S_{m+1}' is about this program's archive under the derivation.
    correspondence: 'none; direct computation at the tested primes on the archived builders'
  tail_checks:
    - >-
      The number of (k, p) cells whose unit-ideal fraction falls outside the
      99 percent interval, reported rather than the best cell.
    - >-
      Any cell where the two meters disagree, with the disagreeing integer
      and the localized cause.
    - >-
      The largest |FB| at which the shrink test is nonzero on any arm, if
      any, with its NULL-S4 comparison.
  replication:
    seeds:
      - 'archived reproduction seed 42; new-cell seeds 43, 44'
      - 'null seeds 7, 11, 13, 17, 19 per (cell, arm)'
      - 'random-target seeds 1..200 per (k, p) for the unit-ideal enumeration'
    independent_instances: >-
      3 curves x 3 primes x 5 |FB| = 15 (curve, |FB|) cells per arm (the
      archived curve at 13 bits plus two new prime-order curves), 5 null
      seeds per null arm, 200 random targets per (k, p). Justification: the
      prediction is a forced exact integer per cell, so one disagreeing
      cell refutes; three independent curves satisfy the minimum; 200
      targets resolve the unit-ideal rate to about 0.03 per cell.
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 12
    maximum_memory_gb: 8
    maximum_runs: 30
    maximum_workers: 1
    notes: >-
      One run = one (|FB|, p) cell over all curves, arms, targets and both
      meters (15 cells) plus the archive-reproduction run and re-runs;
      Sage Groebner calls at |FB| <= 8, m = 3 are seconds per cell, the
      200-target enumeration is k^3 <= 512 triples per target. Above the
      template floors.
  stages:
    - id: stage-0-derivation-and-archive-check
      purpose: 'the induction, the D_reg table, the 16/16 archive check, the EV-ALPF-001 comparison'
      dominant_operation: writing
      machine_compute: none required
    - id: stage-1-meters
      purpose: 'reconstruct the inline meter; run the F_p port; cross-check on controls and archived cells'
      dominant_operation: exact rank and Sage
      machine_compute: minutes
    - id: stage-2-ladder
      purpose: '|FB| = 4..8, three curves, three primes, all arms, both targets, both gradings'
      dominant_operation: Sage Groebner and exact rank
      machine_compute: hours
    - id: stage-3-draft-note
      purpose: 'draft superseding evidence note for the Coordinator (no record written)'
      dominant_operation: writing
      machine_compute: none required
  stopping_rules:
    - >-
      Stop before Stage 2 if the archived cells do not reproduce integer for
      integer on both meters, or if the meters disagree on any control;
      record the reconstruction finding and the absent-file finding.
    - >-
      If the shrink test is strictly positive at any |FB| >= 5 on the
      Semaev arm, run NULL-S4 at that cell with all 5 seeds and the next
      |FB| before any other cell (M1 candidate, routed to review).
    - >-
      Stop when all planned cells have a terminal state; no iteration or
      tuning.
  invalidation_rules:
    - >-
      A timeout, OOM, Sage crash or missing Sage is failed_infrastructure
      and is never evidence about the mechanism.
    - >-
      A run whose F_p meter has not passed the p = 2 known answer and the
      planted-syzygy positive control in the same manifest lineage is
      invalid; a run whose inline meter has not passed POS-A / NEG-1 / NEG-2
      is invalid.
    - >-
      A cell where the two meters disagree is void until the disagreement
      is localized to one named implementation.
    - >-
      A planted target whose certificate fails invalidates the draw; a Q1
      reading on a random target with vdim = 0 is the unit-ideal reading and
      may not be quoted as a degree.
    - >-
      Any pooling of the weighted-grading arm with the standard arm
      invalidates the pooled number.
  success_criterion: >-
    Decidable from the primary metrics: the archived cells reproduce, the
    meters agree, and each archived arm receives exactly one mechanism
    label by the pre-registered signatures. The EXPECTED labels are M2 for
    ALPF-011's e-ring and power-sum (d_ff = |FB| - 1, shrink test 0,
    NULL-S4 identical, NULL-FB silent, POS-C passing) and M3/M4 for
    ALPF-001's m = 2 symmetric arm (Q1 low, unit or near-unit ideal, not
    tracking d_ff); together they establish that, under the derivation, no
    prime-field early fall involving S_{m+1} has been recorded in this
    program. This changes no status: the Coordinator writes any superseding
    evidence record only after independent review of the draft note.
  falsification_criterion: >-
    ANY of: F1 -- the exact builders do not reproduce the archived profiles
    or integers (reconstruction finding; the line halts); F2 -- d_ff !=
    |FB| - 1 at some cell (the induction is wrong at that k, or S_4
    contributes a lower syzygy, tested next by the shrink test); F3 -- the
    shrink test strictly positive at some |FB| >= 5, absent on NULL-S4 and
    persisting at |FB| + 1 (a genuine summation-involving early fall in
    e-coordinates -- M1 -- routed to independent review before it is
    named); F4 -- NULL-FB fires (M1 by another route); F5 -- Q1 tracks the
    Macaulay d_ff on planted targets (the M4 classification of EXP-ALPF-001
    is withdrawn). Each is a negative outcome decidable from the metrics.
  required_artifacts:
    - 'experiments/EXP-PFDR-4bfc6f/runs/<run-id>/manifest.yaml (command, commit, dirty-tree hash, environment incl. Sage version, seeds, parameters, grading, meter identities, inference block, timing, peak RSS, per-file sha256)'
    - 'experiments/EXP-PFDR-4bfc6f/runs/<run-id>/raw-result.json (per cell per arm per meter: d_ff, D_reg, fires, nontriv_full, nontriv_fb, gate_passes, kernel dimension, Q1, vdim, unit-ideal counts; certificate results)'
    - 'experiments/EXP-PFDR-4bfc6f/runs/<run-id>/stdout.log and stderr.log'
    - 'experiments/EXP-PFDR-4bfc6f/stage0-derivation.md (the induction, the three syzygies, the D_reg table, the 16/16 archive check, and the EV-ALPF-001-versus-archive comparison)'
    - 'experiments/EXP-PFDR-4bfc6f/stage0-predictions.yaml (frozen before any run; sha256 in every manifest)'
    - 'experiments/EXP-PFDR-4bfc6f/analysis.md (reproduction table, meter agreement table, ladder tables per arm, unit-ideal table, classification per archived arm, verdict against the frozen criteria)'
    - 'experiments/EXP-PFDR-4bfc6f/evidence-supersession-draft.md (DRAFT for the Coordinator; cites EV-ALPF-001; edits nothing; proposes no status change)'
  interpretation_limits:
    - >-
      A control-class contract: it classifies archived signals; it moves no
      exponent, mounts no attack, and does not close KN-OPEN-002.
    - >-
      Scoped to the archived representations at m in {2, 3}, |FB| <= 8,
      p <= 2^23; the archive-integrity finding (absent meter file) is
      reported as a floor.
  id_allocation_provenance: >-
    EXP-PFDR-4bfc6f pre-allocated by the tasking Coordinator in
    TASK-20260903-b5d2ae (fifth experiment id, in order). No state was
    scanned for a next free number.
  yaml_parse_disclosure: >-
    Written by the Coordinator subagent without an interpreter; every prose
    value is a folded block scalar or a quoted scalar; no tabs; no duplicate
    keys to the author's reading. The orchestrator must run the strict parse
    and tools/validate_ledger.py before this contract is relied on.
