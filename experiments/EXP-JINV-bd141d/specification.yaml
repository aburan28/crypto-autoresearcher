experiment:
  id: EXP-JINV-bd141d
  hypothesis_id: H-JINV-5a0b9e
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-d7e255
  version: 1
  status: approved
  claim_tier: toy
  retrospective: false
  retrospective_note: >-
    THIS IS A PRE-REGISTRATION. No run of EXP-JINV-bd141d exists at the time of
    writing and the runs/ directory does not yet exist. Every threshold,
    definition and prediction below is frozen before execution and may be changed
    only by a versioned protocol_amendment filed under
    experiments/EXP-JINV-bd141d/amendments/ BEFORE the affected data is
    generated. NOTHING IN THIS FILE IS A MEASUREMENT. In particular, the family
    inventory quoted throughout is DERIVED IN THE DESIGN SESSION, has no run
    record, and is re-derived by this experiment's own Stage 1.

  title: >-
    Relation density against CM discriminant on a matched-order family --
    N = 19507 held identically fixed across every isogeny class -- plus the one
    place in this program where |Aut| separates from |D_0|: the depth-1
    107-volcano at t = 211, p = 19717, D = -3 * 107^2. Two contrasts, reported
    separately and never pooled.

  objective: >-
    MEASURE RELATION-COLLECTION DENSITY AGAINST THE CM FUNDAMENTAL DISCRIMINANT
    WITH THE GROUP ORDER ANNIHILATED AS A CONFOUND RATHER THAN MODELLED. Every
    between-class result this campaign has produced was voided by the #E
    confound, and its between-class detector NULL-C was shown to be a
    between-class MEAN detector with power 1.00 at a 0.9% shift
    (red_team_notes.md section 5) -- maximally sensitive to exactly that
    confound. The repair is structural, not statistical. Writing N = p + 1 - t
    gives D = t^2 - 4p = (t - 2)^2 - 4N; FIXING N and sweeping t (with
    p = N + t - 1 required prime) produces a family in which every class has
    #E(F_p) = N EXACTLY while D, hence D_0 and f, sweeps freely. There is no
    covariate to adjust and no matching procedure to get wrong.

    ARM 1 -- THE |D_0| ARM (BETWEEN-CLASS, CONDUCTOR PINNED). At N = 19507
    (prime) the design document reports 59 such classes and ~2000 curves, of
    which 51 lie at f = 1 and carry 46 distinct fundamental discriminants (five
    values hit twice by trace pairs, a free internal replication check) spanning
    |D_0| = 1299 to 78027. Since N(alpha_min) ~ |D_0|/4 at f = 1, this is the
    only clean realisation available to this campaign of the hoped-for signal
    "N(alpha_min) down => relation density up". Measure
    decomposition_rate_m2, decomposition_rate_m3, liftable_density and
    decomposition_efficiency against |D_0| across those 51 classes, at every
    density row of the frozen grid, stratified by r.

    ARM 2 -- THE |Aut| ARM (WITHIN ONE CLASS, SEPARATE AND NEVER POOLED). The
    class t = 211, p = 19717, D = -34347 = -3 * 107^2 is a depth-1 107-volcano
    with ONE crater vertex at j = 0 (End = Z[zeta_3], |Aut| = 6) and, per the
    design document's cross-check against
    h(-3 * 107^2) = 107 * (1 + 1/107) / 3 = 36, thirty-six floor vertices at
    generic j with |Aut| = 2 -- same class, same N, same p, same t. ACROSS
    classes |Aut| = 6 and |D_0| = 3 are perfectly confounded and can never be
    separated; INSIDE this class they separate exactly, and this is the only such
    place in this program. Because gcd(107, 19507) = 1 with N prime, T1 transport
    carries the ECDLP between the crater and floor arms WITH THE SAME k, so the
    two arms are two representations of one instance.

    CARRIED CAVEAT, BINDING. The class sizes quoted above are class numbers of
    orders. For D_0 in {-3, -4} the Deuring correspondence weights j = 0 by 1/3
    and j = 1728 by 1/2, so a class number is NOT a vertex count. THE AUTHORITY
    ON THE EXACT VERTEX COUNT OF THE t = 211 CLASS IS THE CAMPAIGN'S OWN
    HURWITZ-KRONECKER ENUMERATION (harness/isogeny_class.py:class_census), not
    the class-number formula and not the design document. The run reports the
    enumerated count independently, and a discrepancy is a finding about the
    enumeration reported as one.

    WHAT THIS EXPERIMENT DOES NOT DO. It does not run the within-class volcano-
    level contrast, which belongs to EXP-VOLC-9f5571 and may not be pooled with
    these results. It claims no attack, no exponent and no speedup: on the
    |Aut| = 6 curve any ratio at or below sqrt(6) ~ 2.449 is BASELINE CALIBRATION
    under KN-TECH-018 and is recorded as such. It does not adjudicate
    H-ICINV-6c7920 in either direction -- it simply declines to reuse the sampler
    that hypothesis disputes.

  inputs:
    family_construction:
      matched_order_N: 19507
      identity: "D = t^2 - 4p and N = p + 1 - t give D = (t - 2)^2 - 4N"
      admissibility: "p = N + t - 1 must be prime; the class must be ordinary"
      verification_required: >-
        #E(F_p) = 19507 is verified PER CURVE, not per class, by direct point
        counting or by an order certificate on a generator; a single failure
        makes the run INVALID.
      expected_inventory_from_design_document:
        classes_total: 59
        classes_at_f1: 51
        distinct_D0_at_f1: 46
        D0_hit_twice_count: 5
        abs_D0_min: 1299
        abs_D0_max: 78027
        conductor_arm: [1, 3, 107]
        curves_total_approx: 2000
      inventory_provenance: >-
        DERIVED IN THE DESIGN SESSION BY A SCRIPT. No run record, no manifest, no
        independent verification. Stage 1 re-derives the whole family under an
        immutable run record. NOTHING in any decision rule may depend on these
        figures until that run exists; disagreement terminates the run
        PREMISE-FAILED.
      completeness_gate: >-
        isogeny_class.class_census must return agrees: true for every class used.
        Any disagreement makes the run INVALID.
    aut_arm_class:
      t: 211
      p: 19717
      discriminant: -34347
      factorisation: "-3 * 107^2"
      crater_expected: "1 vertex, j = 0, End = Z[zeta_3], |Aut| = 6"
      floor_expected: "36 vertices, generic j, |Aut| = 2"
      class_number_crosscheck: "h(-3 * 107^2) = 107 * (1 + 1/107) / 3 = 36"
      vertex_count_authority: >-
        The Hurwitz-Kronecker enumeration, NOT the class number, because Deuring
        weights j = 0 by 1/3 and j = 1728 by 1/2.
      crater_identification: >-
        By explicit Velu 107-isogeny structure. two_torsion_x_count and
        ell_subgroup_count(., 2) are PROHIBITED as crater or level proxies: they
        are the same computation and resolved 2 of 5 levels on the committed
        p = 4001 class (red_team_notes.md section 10).
      transport: >-
        gcd(107, 19507) = 1 with N prime, so T1 carries (E, P, Q, k) between
        crater and floor with the SAME k. Verified explicitly in the run on at
        least one transported instance per arm, with a certificate.
    sampler:
      required: "harness/exp_icinv_fullgroup.py:485 targets_B -- [u]P + [v]G2, u uniform on [0,n1), v uniform on [0,n2)"
      support_certificate: >-
        The sampler's support is certified EQUAL to the enumerated point set of
        E(F_p) on every measured curve. A single failure terminates the run
        PREMISE-FAILED.
      prohibited: >-
        exp_icinv.targets_uniform is PROHIBITED in every arm. Its support is the
        cyclic subgroup <G>, so on r = 3 curves the estimand is uniform on at
        most half the group, and H-ICINV-6c7920 (status `specified`, live, NOT
        adjudicated) holds that the campaign's entire reported over-dispersion
        follows from this. THIS CONTRACT TAKES NO POSITION ON THAT HYPOTHESIS. It
        declines to reuse a sampler whose estimand is under dispute, which is the
        only way to keep this experiment's result independent of that
        adjudication.
    stratification:
      variable: "r = #{x in F_p : x^3 + a x + b = 0}, values in {0, 1, 3}"
      requirement: >-
        Every headline statistic is reported PER STRATUM as well as pooled, and
        each class's r composition is reported. If the sign of an association
        differs between strata, the pooled figure is WITHDRAWN and only the
        stratified figures are reported.
    density_grid:
      factor_base_rule: "exp_icinv.factor_base_fixed_size (first `size` liftable x from 0)"
      sweep_required: true
      saturated_row_alone_prohibited: >-
        On the committed p = 4001 class the within-class over-dispersion decays
        from 2.037 at density 0.5306 to 0.930 at density 0.0234
        (red_team_notes.md section 4) and the batch that produced the campaign's
        headline ran only the saturated row. A conclusion drawn from one density
        row is not a conclusion about the curves.
      operating_density_target: 0.16666666
      operating_density_note: "1/m! for m = 3"
    dependent_variables:
      - decomposition_rate_m2
      - decomposition_rate_m3
      - liftable_density
      - decomposition_efficiency
    definition_recording_required: >-
      The run must record the exact definition and source location of every
      dependent variable it computes, so a later reader can reconstruct the
      estimand without reading this contract.
    pooling_prohibition: >-
      The |D_0| arm and the |Aut| arm are reported SEPARATELY and are never
      pooled into one model, one table or one test. Results from this contract
      and from EXP-VOLC-9f5571 are likewise never pooled.
    instrument_gate:
      blocking: true
      rule: >-
        BLOCKING under GOAL-ENDO-001 criterion C4. No conclusion may be drawn
        from any statistic that has not passed BOTH directions of
        EXP-INSTR-36c8cf at the ACTUAL geometry of use -- the real class counts,
        the real r-stratum sizes, the 37-vertex |Aut| arm, and the actual density
        rows. NULL-C is not presumed admissible here merely because the #E
        confound is annihilated: it was characterised on a different design and
        must be re-characterised on this one or it may not be used.
    source_constraints: >-
      harness/exp_icinv.py MUST NOT BE EDITED. New driver and new module over
      harness/isogeny_class.py, harness/toycurve.py and
      harness/exp_icinv_fullgroup.py. Run manifests must pin the hash of every
      source file executed (harness/runner.py:source_provenance, audited by
      tools/check_run_source_provenance.py --strict) -- the standing A6
      precondition carried from EXP-ICINV-4d33aa amendment v2, which is BLOCKING.

  controls:
    - >-
      C-FAMILY. Per-curve verification that #E(F_p) = 19507 exactly, plus a
      Hurwitz-Kronecker completeness certificate for every class used. This is
      the control that makes the whole design work; without it the confound is
      not annihilated, merely assumed away.
    - >-
      C-SUPPORT. targets_B support certified equal to the enumerated E(F_p) on
      every measured curve.
    - >-
      C-TRACEPAIR. The five fundamental discriminants hit TWICE by distinct trace
      pairs are a free internal replication set: same D_0, same N, different t,
      different p. If the within-pair spread is comparable to the spread across
      the whole |D_0| range, the |D_0| axis is NOT RESOLVABLE at this design's
      precision and no trend claim may be made in either direction.
    - >-
      C-RESIDUAL-P. The same statistics are reported against p as well as against
      |D_0|, because p = N + t - 1 varies across the family even though N does
      not, and p and D_0 are algebraically linked through t. A |D_0| trend
      equally explained by p is NOT attributable to the endomorphism ring and the
      record must say so.
    - >-
      C-STRATUM. Full r-stratified reporting with per-class r composition.
    - >-
      C-DENSITY. The full density sweep; the saturated row is never reported
      alone.
    - >-
      C-BASELINE-IDENTITY. On the committed p = 4001, t = 30 class under
      targets_B, reproduce the identity mean_rate ~= |3V|/#E at every declared
      density row to within the exact enumeration tolerance. This checks the
      sum-set enumeration and the density accounting, and is deliberately chosen
      to be a quantity H-ICINV-6c7920 does not contest.
    - >-
      C-PSEUDO-CRATER. For the |Aut| arm, the rank statistic is exercised at
      n = 1 against the same 37-member distribution using an arbitrary NON-crater
      vertex designated as crater. Delivered by EXP-INSTR-36c8cf; this contract
      may not read its own |Aut| result until that control has been reported.
    - >-
      C-TRANSPORT-CERT. At least one explicit T1 transport of an ECDLP instance
      between crater and floor of the t = 211 class, with a certificate
      re-verified independently of the transport code
      (docs/claims-and-verification.md).

  independent_variables:
    - "|D_0|, the absolute fundamental discriminant, across the 51 conductor-1 classes at fixed N"
    - "|Aut| in {2, 6}, within the single t = 211 class only"
    - "factor-base density (the swept grid)"
    - "r in {0, 1, 3}, as a stratification variable"
    - "arity m in {2, 3}"

  metrics:
    primary:
      - "class-mean decomposition_rate_m3 per class, per density row, per r stratum"
      - "class-mean decomposition_rate_m2 per class, per density row, per r stratum"
      - "rank correlation of class-mean rate against |D_0| across the 51 f = 1 classes, per density row, with its exact permutation distribution over class labels"
      - "rank of the single j = 0 crater vertex among all enumerated vertices of the t = 211 class, per statistic, per density row, with its exact one-sided permutation probability"
      - "liftable_density per curve and per class"
      - "decomposition_efficiency per curve and per class"
    secondary:
      - "within-trace-pair difference for each of the five doubly-hit D_0 values, per density row"
      - "the same rank correlation computed against p instead of |D_0| (residual covariate check)"
      - "per-class r composition"
      - "enumerated vertex count of the t = 211 class against the class-number cross-check 1 + 36 = 37"
      - "crater/floor ratio on the |Aut| arm expressed against sqrt(6) ~ 2.449"
      - "targets_B support-certificate outcome per curve"
      - "wall-clock and memory per class, for successor budgeting"

  heuristic_under_test: HEUR-JINV-1
  heuristic_under_test_note: >-
    HEUR-JINV-1 (targets_B support equals E(F_p) on every measured curve) is
    validated inside this experiment by the per-curve support certificate.
    HEUR-JINV-2 (the between-class statistic detects a planted |D_0| trend at
    this geometry and rejects a matched null) is NOT validated here: it is
    validated by EXP-INSTR-36c8cf, which is BLOCKING for this contract under
    GOAL-ENDO-001 criterion C4.

  preregistered_prediction:
    quantity: >-
      The monotone association between class-mean relation density and |D_0|
      across the 51 conductor-1 classes at identically fixed N = 19507, measured
      per density row and per r stratum; and, separately, the exact rank of the
      single j = 0 crater vertex within its own 37-vertex class.
    formula: >-
      IF THE ENDOMORPHISM-NORM MECHANISM IS REAL, class-mean relation density
      DECREASES monotonically in |D_0|, since N(alpha_min) ~ |D_0|/4 at f = 1 and
      the hoped-for signal is "N(alpha_min) down => relation density up"; the
      trend survives the density sweep and has the same sign in every r stratum.
      THE CAMPAIGN'S OWN STANDING PREDICTION IS THE OPPOSITE AND IS THE NULL
      HERE: DECOMPOSITION.md section 5 prediction 1 holds that relation YIELD
      depends on N and factor-base size only, and N is identical by construction
      in this family, so the pre-registered expectation is NO TREND. NO EFFECT
      SIZE IS STATED BECAUSE THE DESIGN DOCUMENT GIVES NONE AND NONE IS INVENTED
      HERE: the admissible threshold is the detection floor EXP-INSTR-36c8cf
      measures at this exact geometry, and no association smaller than that floor
      may be reported as a trend. FOR THE |Aut| ARM the prediction is structural
      and derived, not statistical: the crater has ONE vertex, so under a
      permutation of the 37 class members the SMALLEST ATTAINABLE one-sided
      p-value is 1/37 = 0.02703, attained only at a strict extreme. That is the
      arm's resolution ceiling, computed before execution; the arm can never
      distinguish a large effect from a moderate one and must be reported as a
      rank, never as a difference of means and never with a confidence interval
      on n = 1.
    source: >-
      analysis/endomorphism-isogeny-decomposition/MATCHED-ORDER-DESIGN.md
      sections 3, 4 (E2) and 5; DECOMPOSITION.md section 3 (T1, T4) and section 5
      prediction 1; KN-TECH-018 for the sqrt(6) automorphism-discount baseline;
      red_team_notes.md sections 4, 5 and 6 for the committed density-decay,
      NULL-C power and detection-floor tables.

  scale_relevance:
    tier: toy
    justification: >-
      One matched group order N = 19507 (~14.25 bits), primes p = N + t - 1 near
      2^14.3, ~2000 curves, exact m = 2 and m = 3 sum-set enumeration. NO
      TRANSFER IS CLAIMED to a second N, to any larger scale, to relation-
      collection COST as opposed to density, or to the ECDLP in the prime-order
      subgroup. The design document's own standard for calling a |D_0| trend real
      requires reproduction at a SECOND matched N, which this contract does not
      budget; any positive finding here is therefore UNREPLICATED BY CONSTRUCTION
      and capped at `preliminary`, and the cap is set before execution so it
      cannot be argued away afterwards.
    correspondence: null
    correspondence_note: >-
      No sampling correspondence is used to reach scale. Every curve is
      enumerated directly and every group order is verified per curve. The
      Deuring correspondence appears only in the WEIGHTING CAVEAT for D_0 = -3,
      not as a device for reaching parameters.

  tail_checks:
    - >-
      EXTREME-CLASS LISTING. The classes at both ends of the |D_0| range, and any
      class whose statistic is an outlier relative to the family, are listed
      individually with t, p, D, D_0, class size and r composition.
    - >-
      TRACE-PAIR TAIL. The five doubly-hit D_0 values are reported individually,
      not summarised, so a reader can see the replication directly.
    - >-
      CRATER TAIL. The single j = 0 vertex's per-statistic values are reported
      against the full 36-value floor distribution, not against its mean.
    - >-
      DENSITY TAIL. The lowest and highest density rows are reported explicitly
      alongside the operating row, so a trend that exists only at saturation is
      visible as such.
    - >-
      SUPPORT-CERTIFICATE TAIL. Any curve whose targets_B support certificate is
      not an exact set equality is listed individually; there must be none.

  replication:
    seeds: [20260810, 20260811, 11235813]
    seeds_note: >-
      Seeds govern the target draw only. The exact m = 2 and m = 3 sum sets are
      seed-independent and must be computed ONCE per (curve, factor-base size)
      and reused across every seed, density row and statistic; recomputation per
      seed is prohibited and is what makes three seeds nearly free.
    independent_instances: 51
    independent_instances_note: >-
      The 51 conductor-1 classes are the independent instances of the |D_0| arm,
      with five internal replicate pairs. The |Aut| arm has exactly ONE instance
      and is reported as such. A SECOND matched N -- the design document's own
      standard for calling a trend real -- is NOT in this contract.

  budget:
    wall_clock_seconds_per_run: 21600
    total_cpu_hours: 48
    maximum_memory_gb: 8
    maximum_runs: 24
    budget_provenance: >-
      COORDINATOR-SET. MATCHED-ORDER-DESIGN.md states no budget for E2. These
      figures bound the task and are not derived from any measurement.
      Exhausting them is a budget event under AGENTS.md rule 5, reported as such,
      and never as a null result.
    dominant_cost: >-
      Exact m = 3 sum-set enumeration over ~2000 curves at #E = 19507, ~4 s^3
      point additions per (curve, factor-base size). Computed once per (curve,
      size) and reused across seeds, density rows and statistics; that reuse is a
      contract requirement, not an optimisation.

  stopping_rules:
    - >-
      SR1 FAMILY GATE, RUNS FIRST. Re-derive the whole N = 19507 family and
      compare against the design document's inventory. Verify #E = 19507 per
      curve and obtain a Hurwitz-Kronecker completeness certificate per class. On
      disagreement, terminate PREMISE-FAILED, report the disagreement, and do not
      measure anything.
    - >-
      SR2 SUPPORT GATE. Certify targets_B's support equals E(F_p) on every
      measured curve before any rate is recorded. A single failure terminates the
      run PREMISE-FAILED.
    - >-
      SR3 INSTRUMENT GATE, BLOCKING. Do not read or report any |D_0|-arm or
      |Aut|-arm verdict until EXP-INSTR-36c8cf has delivered, at the ACTUAL
      geometry of this design, a detection floor and a false-positive rate for
      every statistic used. An unmeasured control cell BLOCKS its conclusion; it
      does not pass it.
    - >-
      SR4 BASELINE IDENTITY GATE. Reproduce mean_rate ~= |3V|/#E on the committed
      p = 4001, t = 30 class under targets_B at every declared density row before
      any N = 19507 measurement is interpreted. Failure makes the run INVALID and
      returns it to the executor as a defect.
    - >-
      SR5 FROZEN GRID. Stop at the declared N, classes, factor-base sizes,
      density rows, target counts and seeds. NO additional N, class, density row
      or seed without a versioned protocol_amendment filed BEFORE the extra data
      is generated.
    - >-
      SR6 BUDGET. On exceeding wall_clock_seconds_per_run, stop that run and
      record status failed_infrastructure with partial artifacts retained. Per
      AGENTS.md rule 5 this is never negative mathematical evidence and never a
      verdict.
    - >-
      SR7 NO OUTCOME SHOPPING. Every verdict is computed by the frozen rule
      inside the run and written to the run record. It is not selected afterwards
      and the set of reported metrics does not depend on which verdict fired.
    - >-
      SR8 BASELINE PAUSE. If any crater/floor ratio on the |Aut| arm exceeds
      sqrt(6) ~ 2.449, STOP and escalate: GOAL-ENDO-001 pause condition P3
      requires an independent review-adversarial session before any record states
      the excess, and review-breakthrough at max effort before any record calls
      it a break.

  invalidation_rules:
    - >-
      Any use of exp_icinv.targets_uniform in any arm.
    - >-
      Any use of exp_icinv.permutation_null (NULL-C) that has not first been
      re-characterised at this design's geometry by EXP-INSTR-36c8cf, or any use
      of it for a within-class contrast at all.
    - >-
      Reporting only the saturated density row, or omitting the density sweep.
    - >-
      Omitting r stratification, or reporting a pooled figure whose stratified
      components disagree in sign.
    - >-
      Pooling the |D_0| arm with the |Aut| arm, or pooling any result here with
      EXP-VOLC-9f5571.
    - >-
      Using two_torsion_x_count or ell_subgroup_count(., 2) to identify the
      crater of the t = 211 class.
    - >-
      Using the class number rather than the Hurwitz-Kronecker enumeration as the
      authority on the t = 211 vertex count.
    - >-
      Any curve with #E(F_p) != 19507, or any class without a completeness
      certificate.
    - >-
      Any edit to harness/exp_icinv.py; any run manifest that does not pin the
      hash of every source file executed.
    - >-
      Any reference value quoted from a committed record without being read from
      that record at run time and bound by a source_sha256. Transcription at any
      precision is prohibited (EXP-ICINV-4d33aa amendment v2 change A4,
      CORR-20260807-a24675).
    - >-
      Any statement of an |Aut|-arm effect as a difference of means, or with a
      confidence interval computed on n = 1.

  success_criterion: >-
    THE CONTRACT SUCCEEDS WHEN BOTH ARMS ARE MEASURED AND REPORTED WITH THEIR
    CONTROLS DISCHARGED AND THEIR OWN RESOLUTION STATED -- not when a particular
    direction is observed. Concretely, ALL of the following hold: (1) SR1-SR4
    pass; (2) all four dependent variables are measured on every class of the
    |D_0| arm at every density row of the frozen grid, stratified by r; (3) the
    rank correlation against |D_0| is reported per density row WITH its exact
    permutation distribution AND alongside the detection floor EXP-INSTR-36c8cf
    measured at this geometry, with no association below that floor described as
    a trend; (4) the trace-pair replication (C-TRACEPAIR) and the residual-p
    check (C-RESIDUAL-P) are reported at every density row; (5) the |Aut| arm is
    reported as an exact rank out of the ENUMERATED class size with its exact
    one-sided permutation probability, its 1/37 resolution ceiling restated, and
    any ratio expressed against the sqrt(6) automorphism-discount baseline; (6)
    at least one T1 transport certificate between crater and floor is emitted and
    independently re-verified; and (7) the run emits ONE of three frozen verdicts
    per arm, computed inside the run: TREND-DETECTED (association exceeds the
    measured detection floor at a majority of density rows with consistent sign
    across r strata AND survives C-TRACEPAIR and C-RESIDUAL-P), NO-TREND
    (association below the floor at a majority of rows), or NOT-RESOLVABLE
    (within-trace-pair spread comparable to the across-range spread, or a
    required control cell not measured). TREND-DETECTED is capped at
    `preliminary` regardless of size, because reproduction at a second matched N
    is the design's own standard and is not in this contract.

  falsification_criterion: >-
    F1 Stage 1 fails to reproduce the family -- class count, conductor-1 count,
    distinct-D_0 count, |D_0| range, or the t = 211 class structure disagrees with
    the design document. PREMISE-FAILED; H-JINV-5a0b9e is withdrawn as
    mis-specified rather than refuted, and the disagreement is reported as a
    finding about the design document. F2 Any curve has #E(F_p) != 19507 or any
    class fails its completeness certificate -- the confound-annihilation premise
    fails; run INVALID, returned as a defect. F3 targets_B's certified support is
    not the full group on some measured curve (HEUR-JINV-1 refuted) --
    PREMISE-FAILED. F4 THE MAIN NEGATIVE, AND IT IS A RESULT: no monotone |D_0|
    association survives the density sweep in either the m = 2 or m = 3 statistic,
    at a design whose detection floor EXP-INSTR-36c8cf has established. Then
    DECOMPOSITION.md section 5 prediction 1 is STRENGTHENED under the one design
    that removes its main confound, and the |D_0| axis of RQ-JINV-8fc13a is closed
