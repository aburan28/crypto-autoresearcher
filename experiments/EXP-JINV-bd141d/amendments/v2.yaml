    source_loading_rule: >-
      Load and hash-check these four paths at run time. Read only their named
      structural fields. A missing path, hash mismatch, row mismatch, count
      mismatch, unexpected r stratum, or changed vertex geometry makes the
      control invalid_before_measurement; it is never repaired by transcription.

  statistics_contract:
    base_variables:
      - decomposition_rate_m2
      - decomposition_rate_m3
      - liftable_density
      - decomposition_efficiency
    decomposition_efficiency_expansion: [decomposition_efficiency_m2, decomposition_efficiency_m3]
    derived_tests:
      - per_row_Spearman_rank_correlation_against_abs_D0
      - five_trace_pair_differences
      - per_row_Spearman_rank_correlation_against_p
      - aut_single_vertex_exact_rank
      - aut_strict_extreme_indicator
    decomposition_efficiency_definition: >-
      For arity m, rate_m times N divided by combinations_with_repetition(2s,m),
      using the corresponding measured rate and the frozen factor-base size s.
      It is derived from the raw rate and receives no separate planting.
    liftable_density_definition: >-
      For each curve and row, let W be one plus the largest x examined by
      factor_base_fixed_size while collecting the first s liftable x values.
      The primitive source vector is the ordered sequence of actual records
      (x, is_liftable) for x in [0,W). liftable_density is the count of true
      source records divided by W. W and every primitive record are retained.
    no_statistic_omission: >-
      Every listed base variable, both efficiency arities, every derived test,
      both arms where mathematically defined, and all thirteen rows must have a
      measured planted floor and matched-null disposition. Undefined cells are
      explicitly not_applicable with a mathematical reason; missing cells block.

  source_record_planting:
    principle: >-
      Plant only by deterministic replacement or relabelling of actual primitive
      source records from the same enumerated curve and row, followed by the
      unchanged production aggregation. Never assign a metric, rank, p-value,
      class mean, correlation, verdict, or synthetic output directly.
    prohibited:
      - synthetic_output_tables
      - direct_metric_or_p_value_assignment
      - editing_historical_run_bytes
      - changing_factor_base_size_or_target_count
      - using_NULL_C_for_a_within_class_contrast
      - choosing_rungs_seeds_signs_or_statistics_after_results_are_seen
    primitive_sources:
      decomposition_m2: >-
        The actual 400 target-point records and exact m=2 sum-set membership for
        the same curve and row. A replacement point must be an actual enumerated
        E(F_p) point from that curve, selected from the exact hit pool or exact
        non-hit pool; its full point identity and pool membership are retained.
      decomposition_m3: >-
        The actual 400 target-point records and exact m=3 sum-set membership for
        the same curve and row, with the same within-curve actual-point rule.
      liftable_density: >-
        The actual ordered (x,is_liftable) records from the same curve's full
        field. A replacement draws an actual x record from the required true or
        false pool of that curve; source and destination identities are retained.
      efficiency: derived_only_from_corresponding_planted_rate
    plant_count_ladder:
      unit: primitive_source_record_replacements_per_400_target_equivalents
      rungs_descending: [32, 16, 8, 4, 2, 1]
      target_fraction_percent: [8.0, 4.0, 2.0, 1.0, 0.5, 0.25]
      both_signs_required: true
      exhaustion_high: at_or_above_32_unresolved
      exhaustion_low: below_1_unresolved
    class_weighting:
      abs_D0_rank: midrank_ascending_over_51_classes
      centered_weight_formula: "2 * (midrank - 1) / 50 - 1"
      replacement_count_formula: >-
        floor(k*abs(weight)) plus one exactly when the deterministic hash-derived
        fractional draw is below fractional_part(k*abs(weight)); cap at the
        available opposite-pool size. Pool exhaustion makes that replicate and
        cell invalid, never silently clips the declared plant.
      positive_sign: higher abs_D0 receives more hit/true records and lower abs_D0 more nonhit/false records
      negative_sign: higher abs_D0 receives more nonhit/false records and lower abs_D0 more hit/true records
      expected_monotonicity: signed_Spearman_correlation_increases_with_rung_size
      trace_pair_constraint: classes sharing abs_D0 receive identical centered weight before deterministic within-class rounding
    aut_weighting:
      high_orientation: replace crater primitive records toward hit/true pools; floor vertices remain unplanted
      low_orientation: replace crater primitive records toward nonhit/false pools; floor vertices remain unplanted
      both_orientations_reported_separately: true
      aggregate_aut_verdict: prohibited
      scientific_tail_selection: prohibited
    nuisance_direction_controls:
      reversed_abs_D0_sign: mandatory
      monotone_p_rank_plant_at_same_rungs: mandatory_and_reported_separately
      trace_pair_equal_weight_check: mandatory
      row_reversal: mandatory
      response_requirement: >-
        Report the full response. A statistic responding equally to intended
        abs_D0 and nuisance-p planting is not specific enough for a later
        endomorphism interpretation, even if its generic detection floor passes.

  deterministic_randomness:
    algorithm: sha256_sort_without_replacement
    byte_rule: utf8_labels_and_canonical_compact_json_source_ids
    order_rule: sort ascending by SHA256(label || 0x00 || source_id), then by source_id
    fractional_draw_rule: unsigned_big_endian_integer_from_first_8_sha256_bytes_divided_by_2_pow_64
    labels:
      target_draw: "EXP-JINV-bd141d|v3|target|seed=TARGET_SEED|class=CLASS|row=ROW"
      plant: "EXP-JINV-bd141d|v3|plant|stat=STAT|arm=ARM|sign=SIGN|k=K|rep=REP|class=CLASS|row=ROW"
      whole_grid_null: "EXP-JINV-bd141d|v3|null|rep=REP|target_seed=TARGET_SEED"
      pseudo_crater: "EXP-JINV-bd141d|v3|pseudo-crater|vertex=VERTEX|stat=STAT|row=ROW|orientation=ORIENTATION"
    plant_replicates: 200
    matched_null_replicates: 20000
    target_draw_seeds_unchanged: [20260810, 20260811, 11235813]
    seed_or_algorithm_substitution: prohibited_without_new_amendment_and_review
    required_recording:
      - every_full_label
      - every_label_sha256
      - ordered_source_ids
      - replacement_maps
      - raw_null_permutations_or_their_canonical_sha256_and_replay_fixture

  d0_whole_grid_inference:
    null_unit: one_synchronous_permutation_of_the_whole_51_class_label_vector
    coupling_rule: >-
      Null replicate b uses the same 51-class permutation at all thirteen rows,
      for every D0 statistic, target seed, trace-pair view, and nuisance view.
      Curve records and class membership remain intact. This preserves cross-row,
      cross-statistic, trace-pair, and nuisance coupling.
    row_independent_permutations:
      permitted_as: diagnostic_only
      controlling_authority: none
    per_row_statistic: signed_Spearman_rho
    row_threshold_statistic: seventh_largest_signed_rho_across_the_thirteen_rows
    operating_row_requirement: signed_one_row_statistic_must_reject_at_the_controlling_family_level
    family_statistic: >-
      The maximum across all D0 base variables and both efficiency arities of
      their seventh-largest signed row statistic, with the same synchronous
      permutation supplying every component. This maximum is the multiplicity-
      controlling statistic; per-variable values remain reported.
    p_value: "(1 + count(null_family_statistic >= observed_family_statistic)) / 20001"
    alpha: 0.05
    equality: nonrejection
    sign_rule: at_least_seven_rows_have_the_declared_plant_sign_and_none_of_the_retained_rows_is_silently_dropped
    all_rows_retained: true

  detection_floor:
    detected_replicate_requires:
      - controlling_whole_grid_p_value_at_or_below_0.05
      - operating_row_signed_statistic_in_declared_direction
      - at_least_7_of_13_rows_in_declared_direction
      - complete_cell_and_artifact_coverage
    power_estimator: detections_divided_by_200_plant_replicates
    confidence_interval: two_sided_Wilson_95_percent
    pass_threshold:
      estimated_power_at_least: 0.90
      Wilson_lower_bound_at_least: 0.80
    floor_definition: >-
      The smallest predeclared replacement-count rung passing every criterion at
      the operating row and at least seven of thirteen rows. Floors are separate
      by statistic, arm, and sign/orientation; no pooling is allowed.
    unresolved_rules:
      no_success_at_32: at_or_above_ladder_maximum_blocks
      no_failure_at_1: below_ladder_minimum_reported_without_substitution
      missing_cell: blocks

  matched_null_false_positive:
    d0_null: synchronous_whole_51_class_label_permutation
    d0_trials: 20000
    d0_flag: controlling_family_p_value_at_or_below_0.05
    d0_interval: two_sided_Wilson_95_percent
    d0_pass: Wilson_upper_bound_at_or_below_0.075
    d0_nominal_level: 0.05
    aut_null: exact_enumeration_of_each_of_37_vertices_as_pseudo_crater
    aut_orientations: [strict_high, strict_low]
    aut_flag: designated_vertex_is_the_unique_strict_extreme_in_that_orientation
    aut_reference_probability: 1/37
    aut_pass: at_most_one_flag_out_of_37_per_orientation
    aut_ties: not_strict_and_not_flagged
    aut_alpha_0_05_substitution: prohibited
    matched_shape_requirement: >-
      Nulls use the same source arrays, class sizes, r=0-only geometry, density
      rows, target count, seeds, statistics, and aggregation code as the planted
      cells. Only the declared label or pseudo-crater designation changes.

  coverage_and_disposition:
    expected_d0_rows_per_statistic_and_sign: 13
    expected_aut_rows_per_statistic_and_orientation: 13
    d0_statistics:
      - decomposition_rate_m2
      - decomposition_rate_m3
      - liftable_density
      - decomposition_efficiency_m2
      - decomposition_efficiency_m3
    aut_statistics: same_five_statistics_where_primitive_pools_exist
    required_derived_outputs:
      - all_five_trace_pair_differences_per_row_statistic_sign_and_rung
      - residual_p_correlation_per_row_statistic_sign_and_rung
      - intended_vs_nuisance_direction_response
      - operating_lowest_and_highest_row_tables
      - every_row_even_when_not_detected
    whole_grid_labels: [instrument_pass, instrument_blocked, resource_incomplete, failed_infrastructure, invalid]
    instrument_pass: every_mandatory_cell_has_a_floor_or_below-minimum_bound_and_matched_null_passes
    instrument_blocked: any_at-or-above-maximum_floor_or_false-positive_gate_failure_or_missing_cell
    resource_incomplete: budget_exhausted_with_valid_partial_artifacts
    failed_infrastructure: timeout_crash_or_environment_failure
    invalid: source_hash_geometry_support_algorithm_schema_or_replay_failure
    no_outcome_shopping: one_predeclared_disposition_is_emitted_regardless_of_direction

  future_run_budget:
    wall_clock_seconds_per_run: 21600
    total_cpu_hours: 48
    maximum_memory_gb: 8
    maximum_runs: 24
    experiment_runs_authorized_by_this_amendment: 0
    reuse_requirements:
      - exact_m2_and_m3_sum_sets_computed_once_per_curve_and_row
      - primitive_source_pools_reused_across_target_seeds_plants_and_nulls
      - whole_grid_permutations_reused_across_rows_and_statistics
      - pseudo_crater_enumeration_reuses_the_same_37_vertex_source_arrays
    preflight_cost_gate: >-
      Before materializing any plant replicate, time and size the unplanted
      primitive-source construction for one lowest, operating, and highest row.
      Extrapolate with the declared counts. If the upper estimate exceeds 80
      percent of 48 CPU-hours or 8 GB, stop resource_incomplete and request a
      separate prospective rebudget decision. Do not omit cells or widen budget.
    budget_exhaustion_is_scientific_evidence: false

  future_required_artifacts:
    - manifest.yaml
    - command.txt
    - environment.json
    - stdout.log
    - stderr.log
    - source-bindings.json
    - geometry-binding.json
    - primitive-source-records.json
    - primitive-source-records.sha256
    - replacement-maps.json
    - deterministic-labels.json
    - planted-cell-results.json
    - matched-null-whole-grid-results.json
    - pseudo-crater-enumeration.json
    - per-cell-floor-table.json
    - per-cell-false-positive-table.json
    - tracepair-controls.json
    - residual-p-controls.json
    - nuisance-direction-controls.json
    - whole-grid-disposition.json
    - resource-cost-report.json
    - replay-fixtures.json
    - verdict.json
  canonical_artifact_rules:
    json: UTF8_RFC8259_sorted_keys_compact_one_terminal_LF
    yaml: strict_duplicate_key_rejection
    floating_point: lowercase_C99_hexadecimal_binary64_for_authoritative_values
    path_hashes: SHA256_full_bytes_required
    partial_hashes: prohibited
    deterministic_replay: >-
      A fresh process must reproduce every label, source selection, replacement
      map, permutation, aggregate, p-value numerator, confidence interval, floor,
      and disposition from the manifest and primitive records alone.

  stopping_and_invalidation:
    - Source or geometry mismatch stops invalid_before_measurement.
    - A required hit, nonhit, true, or false primitive pool that cannot supply a declared plant stops that cell invalid; it may not be clipped or substituted.
    - A missing statistic, arm, row, sign, orientation, seed, replicate, null, nuisance control, or artifact blocks the whole-grid disposition.
    - Any direct metric assignment, synthetic output plant, historical-byte edit, or within-class NULL-C use makes the control invalid.
    - Any adaptive rung, tail, statistic, seed, row, or threshold choice after reading results makes the control invalid.
    - Timeout or crash is failed_infrastructure; budget exhaustion is resource_incomplete; neither is mathematical or scientific evidence.
    - N18/C-TRANSPORT is not attempted and remains blocking after an instrument pass.
    - No JINV scientific interpretation is permitted until a second matched N satisfies the original claim ceiling.

