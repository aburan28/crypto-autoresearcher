    additional_rows_targets_or_target_seeds: prohibited
    operating_row_selection: >-
      After source-only density computation and before any planted or null
      statistic is read, choose the unique factor-base row whose unplanted
      pooled m=3 source-set density |3V|/N is closest to 1/6. Break an exact tie
      toward the smaller factor_base_size. Record all thirteen distances. This
      rule uses geometry only, never a test statistic or outcome.

