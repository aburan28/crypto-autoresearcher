    the future v7 first terminals without changing the exact 122-entry legacy
    mutation suite or any reviewed v5 byte. This is static protocol integrity
    only; resource_incomplete and every execution, transport, N18, second-N,
    one-N, historical, scientific, status, closure, and breakthrough boundary
    remain controlling.

