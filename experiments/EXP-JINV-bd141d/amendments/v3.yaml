    integer_randomized_rounding: >-
      For exact nonnegative rational q=n/d, emit floor(q)+1 exactly when
      draw_u64*d < (n mod d)*2^64; otherwise emit floor(q). No floating-point
      comparison governs a replacement count.

  repair_matrix:
    - row: 1
      terminal_blocker: target_seed_breaks_synchronous_whole_grid_null
      report_objection: O-JINV-PB-1
      supersedes_v2_clause: deterministic_randomness.labels.whole_grid_null
      prospective_repair: >-
        Replace the seed-bearing v3 null label with exactly
        EXP-JINV-bd141d|v4|d0-null|bank=BANK|rep=REP, where BANK is reference or
        outer. One permutation of the exact canonical 51 class IDs governs every
        row, statistic, seed, sign, trace-pair, p-rank, and row-order view.
      fixture: permutation_coupling
      status: repaired_definition_pending_fresh_review
    - row: 2
      terminal_blocker: source_record_replacement_exposure_is_not_localized
      report_objection: O-JINV-PB-2
      supersedes_v2_clause: source_record_planting.class_weighting.replacement_count_formula
      prospective_repair: >-
        Apply each primitive plant separately to each curve and row, separately
        to each target seed for target-dependent primitives, each rung, sign or
        orientation, and replicate. Select actual same-curve source and opposite-
        pool destination records without replacement under the frozen hash order.
      fixture: unequal_class_per_curve_pairing
      status: repaired_definition_pending_fresh_review
    - row: 3
      terminal_blocker: variable_W_is_not_normalized_to_400_target_equivalents
      report_objection: O-JINV-PB-2
      supersedes_v2_clause: source_record_planting.plant_count_ladder
      prospective_repair: >-
        Preserve k replacements for every 400-record target vector. For a
        liftability vector of length W, use exact q=k*abs(weight)*W/400 for D0
        and p-rank, and q=k*W/400 for the Aut crater, followed by the one frozen
        randomized-rounding rule.
      fixture: w_over_400_rounding
      status: repaired_definition_pending_fresh_review
    - row: 4
      terminal_blocker: aut_detection_floor_has_no_aut_predicate
      report_objection: O-JINV-PB-3
      supersedes_v2_clause: detection_floor.detected_replicate_requires
      prospective_repair: >-
        Define Aut detection per row, statistic, rung, replicate, and orientation
        after equal-weight three-seed aggregation: the actual crater must be the
        unique strict maximum for strict_high or unique strict minimum for
        strict_low. Every tie is nondetection.
      fixture: aut_detection
      status: repaired_definition_pending_fresh_review
    - row: 5
      terminal_blocker: null_false_positive_reference_bank_is_undefined
      report_objection: O-JINV-PB-4
      supersedes_v2_clause: matched_null_false_positive.d0_null
      prospective_repair: >-
        Use disjoint 20,000-member reference and outer banks. Every observed,
        planted, and outer family statistic is ranked only against reference;
        FPR is the Wilson interval of outer flags only. No self-ranking,
        cross-fitting, or outer-as-reference use is permitted.
      fixture: d0_reference_outer_composition
      status: repaired_definition_pending_fresh_review
    - row: 6
      terminal_blocker: aggregation_pooling_nuisance_plants_and_specificity_are_incomplete
      report_objection: O-JINV-PB-5
      supersedes_v2_clause: nuisance_direction_controls
      prospective_repair: >-
        Freeze equal-weight three-seed aggregation, equal-curve operating-row
        pooling, complete increasing and decreasing midrank-p plants, a strictly
        positive Wilson specificity margin, and a deterministic row-order
        invariance control. The undefined v2 row_reversal plant is prospectively
        superseded rather than silently completed.
      fixtures:
        - three_seed_aggregation
        - p_rank_specificity
        - row_order_invariance
      status: repaired_definition_pending_fresh_review
    - row: 7
      terminal_blocker: end_to_end_cost_and_artifact_volume_are_not_bound
      report_objection: O-JINV-PB-6
      supersedes_v2_clause: future_run_budget.preflight_cost_gate
      prospective_repair: >-
        Bind every source-derived cardinality, mapping context, replacement-pair
        upper bound, null and pseudo-crater cell, interval, serialization byte,
        replay visit, storage, I/O, memory, wall, CPU, and shard gate in the
        static worksheet. Apply resource_incomplete before materialization when
        any cap or preflight fails.
      fixture: v3_cost_worksheet
      status: exact_resource_incomplete_disposition_pending_fresh_review

