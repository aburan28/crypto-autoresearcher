    by O-JINV-V4-1 and O-JINV-V4-2. Protocol v5 freezes one collision-complete
    RFC8259 compact-array key grammar for every source and derived record used
    by the row-order control, proves the old seven-field fixture key collides on
    a two-class, two-curve, two-rung source-ID-only adversarial object, derives
    both factor-base orders independently with equal canonical hashes, and
    cross-binds the D0 null-bank row-statistic cardinality to exactly 2,600,000
    everywhere. It changes no reviewed v3 byte, authorizes no implementation or
    execution, preserves resource_incomplete, and creates no empirical,
    mathematical, JINV, transport, ECDLP, status, closure, or breakthrough
    claim.

