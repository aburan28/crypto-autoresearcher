# EXP-BINSTD-d55dbe
# Square-band arithmetic. No walk.
# Approved by DEC-20261003-7be334.
experiment:
  id: EXP-BINSTD-d55dbe
  hypothesis_id: H-BINSTD-39050f
  source_idea: IDEA-20261001-833e78
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Square gaps around twice n
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-7be334
  objective: >-
    Check the gap 2, the product 1170, and the cross gap 14.
  inputs:
    twice_17: 34
    twice_23: 46
    twice_31: 62
    below_34: 9
    above_34: 2
    below_46: 10
    above_46: 3
    below_62: 13
    above_62: 2
    below_product: 1170
    above_product: 12
    band_short: 3
    band_excess: 3
    artifact_gap: 14
    n_gap: 6
    r_fixed: 20
    seed_floor: 10
  controls:
    - >-
      Five squared is 25, and 34 minus 25 is 9. Six squared is 36,
      and 36 minus 34 is 2. Reporting 34 as a square invalidates the
      run.
    - >-
      Forty-six minus 36 is 10, and 49 minus 46 is 3. Sixty-two
      minus 49 is 13, and 64 minus 62 is 2. The product of 9, 10,
      and 13 is 1170. The product of 2, 3, and 2 is 12.
    - >-
      Twenty minus 17 is 3, and 23 minus 20 is 3. Three times 20
      minus 2 times 23 is 14. Twenty-three minus 17 is 6.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {squares, band, artifact}
    - route in {difference, product}
  metrics:
    primary:
      - above_34
      - below_product
      - implementations_agree
    secondary:
      - artifact_gap
      - above_product
      - n_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Thirty-six exceeds 34 by 2. The product of 9, 10, and 13 is
      1170. Three times 20 exceeds 2 times 23 by 14.
    formula: >-
      Subtract 25 from 34 and 34 from 36. Multiply 9, 10, and 13.
      Subtract 2 times 23 from 3 times 20.
    source: >-
      IDEA-20261001-833e78 states the n list 17, 23, 31, the band
      from 0.85 to 1.15, and the factor 1.5, read 2026-10-03. The
      squares were recomputed in this design session. That
      computation is not a run. No walk was run.
  scale_relevance:
    tier: toy
    justification: Three listed n values and one written band. No transfer to a walk.
    correspondence: null
  tail_checks:
    - The product 12 and the cross gap 14 are required. A check that stops at the gap 2 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the gap 2 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The gap above 34 is not 2.
    - The product is not 1170.
    - The cross gap is not 14.
    - A walk is run, or 34 is reported as a square.
  success_criterion: >-
    Both runs agree that 36 minus 34 is 2, that 34 minus 25 is 9,
    that the product of 9, 10, and 13 is 1170, that the product of
    2, 3, and 2 is 12, and that 3 times 20 minus 2 times 23 is 14.
  falsification_criterion: >-
    The runs agree that 6 squared is 36, and 36 minus 34 is not 2.
  required_artifacts:
    - experiments/EXP-BINSTD-d55dbe/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-d55dbe/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-d55dbe/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-d55dbe/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-d55dbe/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-d55dbe/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any walk, collision search, or iteration count.
    - Any claim that a walk constant matches a square root.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
