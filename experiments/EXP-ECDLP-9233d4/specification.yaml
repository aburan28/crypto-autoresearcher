# EXP-ECDLP-9233d4
# Digit-count arithmetic. No curve point is added.
# Approved by DEC-20261004-7e7a95.
experiment:
  id: EXP-ECDLP-9233d4
  hypothesis_id: H-ECDLP-b80fc1
  source_idea: IDEA-20261004-84bf57
  question_id: RQ-ECDLP-002
  version: 1
  title: Doubling count and addition count of the integer 33554431
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-7e7a95
  objective: >-
    Check the counts 25, 24, and 24, the product 14400, and the nearby gap 0.
  inputs:
    bit_length: 25
    doublings: 24
    additions: 24
    length_gap: 1
    doubling_gap: 0
    digit_product: 14400
    digit_sum: 73
    nearby_a: 24
    nearby_b: 24
    nearby_gap: 0
    nearby_product: 576
  controls:
    - >-
      The bit length is 25. The doubling count is 24. The addition
      count is 24. Reporting the addition count as 25 drops the gap
      against the bit length and invalidates the run.
    - >-
      Twenty-five exceeds twenty-four by 1. Twenty-four equals
      twenty-four, so that gap is 0. The product of 25, 24, and 24
      is 14400. Their sum is 73.
    - >-
      Two readings of the addition count are both 24. Their gap is
      0 and their product is 576.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {bits, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - additions
      - implementations_agree
    secondary:
      - digit_product
      - digit_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The integer 33554431 has bit length 25, 24 doublings, and 24
      additions. The gap of two addition counts is 0.
    formula: >-
      Read the bit length 25. Count 24 doublings. Count 24 additions.
      Multiply 25, 24, and 24. Subtract 24 from 24.
    source: >-
      IDEA-20261004-84bf57 states the counts 25, 24, and 24, read
      2026-10-04. The gaps, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 14400 and the nearby gap 0 are required. A check that stops at the bit length 25 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the addition count 24 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 25.
    - The doubling count is not 24.
    - The addition count is not 24.
    - The product is not 14400.
    - The addition count is reported as 25, or a curve point is added.
  success_criterion: >-
    Both runs agree that the bit length is 25, that the doubling
    count is 24, that the addition count is 24, and that the product
    of those three counts is 14400.
  falsification_criterion: >-
    The runs agree that the addition count is computed, and that
    count is not 24.
  required_artifacts:
    - experiments/EXP-ECDLP-9233d4/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-9233d4/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-9233d4/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-9233d4/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-9233d4/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-9233d4/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a digit-count gap moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
