experiment:
  id: EXP-POLYMAC-591c3e
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-9a1ae2; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-9a1ae2
  question_id: RQ-POLYMAC-7c89e4
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Six-cell factorial over field type crossed with authentication-key constraint, with matched
    surviving cardinality and a random-subset transport null, measuring constraint-adjusted optimal
    forgery probability by exhaustive root-set intersection
  objective: The uncertainty reduced is whether the key constraint present in one deployed construction
    and absent in the other explains any measured difference between them, or whether the field does.
    (i) Build a constrained arm in the field that has no deployed constraint, at matched surviving
    cardinality, under three different transport rules, so the constraint can be varied independently
    of the field for the first time in this program. (ii) Measure, exactly and by exhaustion, the
    maximum root-set intersection with each cell's surviving key set, and convert it to a constraint-adjusted
    effect whose defining property is that a pure cardinality reduction produces exactly one. (iii)
    Validate that property in the same invocation with a random-subset transport in both fields, since
    the adjusted effect is meaningless if the null is not exactly one. The run then reports the factorial's
    interaction term with its exact value and its prime-sweep spread. It does not reduce uncertainty
    about deployed clamping, about key generation, or about any adaptive forger.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: at n in {12, 16}, with the declared
      toy clamping mask, the declared transport rules and the pinned primes, the constraint-adjusted
      optimal forgery probability of the hash layer takes the tabulated value in each of the six cells,
      and the field-by-constraint interaction is the tabulated number with the tabulated prime-sweep
      spread. WHAT DOES NOT FOLLOW: nothing about the deployed clamping mask; nothing about ChaCha20-Poly1305
      or AES-GCM; no claim that clamping helps or hurts security; no transfer of the interaction term
      to any other parameter set; and no inference about key generation, which this contract does
      not model at all.'
  inputs:
    procedure: 'STAGE 0 (cost: hours, human): freeze the three transport rules, the toy clamping mask,
      the adjustment formula and the primes. STAGE 1 (cost: seconds): construct all six surviving
      key sets and assert their cardinalities are equal to C; halt on mismatch. STAGE 2 (cost: minutes
      per cell): enumerate the achievable difference-coefficient family per L, compute root-set bitmaps
      over the full key space, intersect with each cell''s surviving-set bitmap, record maxima. STAGE
      3 (cost: seconds): compute raw probabilities and constraint-adjusted effects per cell. STAGE
      4 (cost: seconds): check the random-subset cells are exactly one; if not, stop and report an
      instrument result. STAGE 5 (cost: minutes): repeat stages 1 to 4 over the five-prime sweep and
      both widths. STAGE 6 (cost: seconds): fit and report main effects, interaction, and spread;
      emit the manifest.'
    instrument: Python 3 standard library. Binary field by shift-and-XOR with pinned reduction polynomial;
      prime field with native int. Surviving key sets and root sets both as Python int bitmaps so
      intersection is a single bitwise AND and cardinality is a popcount. Achievable-difference enumeration
      shared with the ratio-surface contract as a common module so the two records cannot silently
      diverge. Manifest and inference block via harness/runner.py. No Sage, no network.
    parameters: 'n in {12, 16}. Five largest primes below 2^n per width. L in {2, 4, 8}. q = 1. Surviving
      cardinality C set by the toy clamping mask at each width and matched exactly across all six
      cells. Transports: bit-mask, subgroup (nearest subgroup order to C, with the cardinality mismatch
      reported rather than hidden), random-subset with 32 independent draws. Achievable-difference
      family capped at 2^18 members per (cell, L). Three fixed seeds for the random draws with all
      other results required seed-independent.'
  controls:
  - Random-subset transport in both fields, same cardinality, same code path, same invocation - the
    null.
  - Subgroup transport in both fields as an algebraically-compatible bracket.
  - Unconstrained cells in both fields as the factorial baseline.
  - Five-prime sweep per width so that the prime-selection accident is visible as a spread rather
    than hidden in a point estimate.
  - 'Cardinality assertion: every cell''s surviving set is counted and asserted equal to C before
    measurement, and a mismatch halts the cell.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The RANDOM-SUBSET TRANSPORT is the null and it runs in the same invocation
    as every signal cell: a uniformly random subset of the key space with exactly the surviving cardinality
    C, in each field, processed by the identical enumeration. For the ablation to mean anything the
    null must show a constraint-adjusted effect of exactly ONE to within the enumeration''s exact
    discreteness - because a random subset of cardinality C is by construction a pure cardinality
    reduction and nothing else. If the random-subset transport shows a departure from one, the adjustment
    formula is wrong and no cell in the factorial is interpretable. If the bit-mask transport matches
    the random-subset transport, the finding is that clamping is cardinality-only at these parameters,
    and that is a complete and useful result.'
  independent_variables:
  - field type (binary extension, prime)
  - constraint type (none, bit-mask, subgroup, random-subset)
  - message length L
  - choice of prime within a width
  metrics:
    primary:
    - surviving cardinality per cell
    - maximum root-set-intersection cardinality per (cell, L)
    - raw optimal forgery probability per cell
    - constraint-adjusted effect per cell
    - field-by-constraint interaction term
    secondary:
    - prime-sweep spread per reported effect
    - subgroup-transport cardinality mismatch against C
    - spread across the 32 random-subset draws
    - wall clock per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The constraint-adjusted effect E(cell) and the interaction term I = (E_prime_bitmask
      minus E_prime_none) minus (E_binary_bitmask minus E_binary_none).
    formula: 'E(cell) = (maximum over achievable differences of the cardinality of roots intersected
      with S_cell) divided by the cardinality of S_cell, divided again by the same quantity computed
      in the cell''s unconstrained arm, so that a constraint acting only by cardinality gives E =
      1 exactly. Predicted: E = 1 exactly in both random-subset cells, to within enumeration discreteness.
      No value is pre-committed for the bit-mask cells or for I, and the reason is recorded: no prior
      exists here that was not invented.'
    source: Pre-registered in the parent proposal IDEA-20260816-9a1ae2 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: n in {12, 16} is where the surviving key sets and the full key space are both enumerable,
      so every cell's number is exact and the only spread is from swept design choices. No extrapolation
      to deployed widths is offered; the fourth cell in particular has no deployed counterpart at
      any width, so the contract's transfer assumption is explicitly nil and the result is a statement
      about an operator studied in isolation.
    correspondence: null
  tail_checks:
  - C equal to the full key space (no constraint) must give E exactly 1 in every cell
  - C equal to a single key must give a degenerate E that the code handles explicitly rather than
    dividing by a near-zero denominator
  - the subgroup transport at a width where no subgroup order is near C must be reported as unavailable
    rather than approximated silently
  - the largest L, where the difference polynomial degree approaches the surviving cardinality, must
    be checked for saturation of the intersection
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - halt if any cell's surviving cardinality does not equal C
  - halt interpretation if the random-subset cells are not exactly E = 1
  - cap total wall clock at 2400 seconds; on exceeding, drop the n = 16 prime sweep to two primes
    and record the reduction
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All six cells complete at matched cardinality in one invocation, both random-subset
    cells give E exactly 1, and the interaction term is reported with its exact value and its prime-sweep
    spread.
  falsification_criterion:
  - random-subset cells give E different from 1
  - cell cardinalities not matched
  - interaction term below the prime-sweep spread, so the design cannot separate constraint from field
    here
  - any root-set cardinality exceeding the polynomial degree
  - the bit-mask transport cannot be constructed at cardinality C in the binary arm
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-9a1ae2
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must rule on the transport notion - matched cardinality versus matched entropy
    versus matched bit positions - since the fourth cell is defined by that choice.
  - The adjustment formula needs Coordinator ratification; the random-subset null tests it but does
    not choose it.
  - Whether the subgroup transport's unavoidable cardinality mismatch is acceptable, or the transport
    should be dropped, is a Coordinator decision.
  - This contract should not be approved before the padding-and-encoding entry in this batch reports,
    because unmatched achievable-difference families in the unconstrained cells would confound the
    baseline.
