# EXP-BINSTD-d9c48f
# Recompute the ECC2K-130 Koblitz order and gcd(4, l).
# Primality is a frozen-witness Miller-Rabin label, not a proof.
# Approved by DEC-20261001-cced5f.
experiment:
  id: EXP-BINSTD-d9c48f
  hypothesis_id: H-BINSTD-854a0b
  source_idea: IDEA-20260922-e3048d
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Sylow-coprimality arithmetic for the ECC2K-130 Koblitz order
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-cced5f
  objective: >-
    Enumerate points of y^2 + xy = x^3 + 1 over F_2, run the trace recurrence
    to degree 131, and check N = 4l, gcd(4, l) = 1, and floor(log2(l)) = 129.
    Miller-Rabin uses a frozen witness list and must be labeled probable.
    The synthetic integer 2l must fail the cofactor-4 test.
  inputs:
    curve: y^2 + xy = x^3 + 1
    field_degree: 131
    predicted:
      order_over_F2: 4
      trace_t1: -1
      trace_t131: -22283658519494248867
      group_order_N: 2722258935367507707729280517973639940516
      prime_subgroup_l: 680564733841876926932320129493409985129
      gcd_4_l: 1
      bit_length_l: 130
      floor_log2_l: 129
    miller_rabin_witnesses: [2, 3, 5, 7, 11, 13, 23, 29]
    synthetic_control: 2l
  controls:
    - >-
      Synthetic 2l. cofactor_is_4 must be false. Reporting cofactor_is_4 true
      invalidates the run.
    - Two recurrence implementations. They must not import each other.
    - primality_status must be the string probable_prime_frozen_witnesses. The string proven_prime invalidates the run.
  independent_variables:
    - recurrence implementation
    - integer under test, N versus 2l
  metrics:
    primary:
      - order_over_F2
      - trace_t131
      - group_order_N
      - prime_subgroup_l
      - gcd_4_l
      - floor_log2_l
      - bit_length_l
      - primality_status
      - synthetic_cofactor_is_4
      - implementations_agree
    secondary:
      - miller_rabin_witnesses_used
  heuristic_under_test: null
  preregistered_prediction:
    quantity: N, l, gcd(4, l), and the two bit-length conventions.
    formula: >-
      t_n = t1*t_{n-1} - 2*t_{n-2}, t0 = 2, t1 = -1, N = 2^131 + 1 - t_131,
      l = N/4.
    source: >-
      IDEA-20260922-e3048d claim (A) for the gcd, and the recurrence in
      analysis/frobenius-orbit-ecc2k130/orbit_fb_ecc2k130.py part_a. The
      integers were produced by a design-time Python recurrence on 2026-10-01.
      That script was not this experiment and did not execute the Sage file.
  scale_relevance:
    tier: crypto
    justification: >-
      Degree 131 is the ECC2K-130 field. The work is an integer recurrence
      and a Miller-Rabin test on one 130-bit integer.
    correspondence: null
  tail_checks:
    - Both implementations must print l in full, not a truncated decimal.
  replication:
    seeds: []
    independent_instances: 1
    replication_note: Deterministic. The second run is the second recurrence.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If primality_status is proven_prime or the synthetic control passes as cofactor 4, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either implementation imports the other.
    - synthetic_cofactor_is_4 is true.
    - primality_status is proven_prime.
    - The output claims a builder is restricted or unrestricted, or claims a discrete logarithm.
  success_criterion: >-
    Both runs agree on every predicted integer, gcd_4_l is 1, floor_log2_l is
    129, bit_length_l is 130, primality_status is probable_prime_frozen_witnesses,
    and synthetic_cofactor_is_4 is false.
  falsification_criterion: >-
    The implementations agree, the synthetic control fails the cofactor-4
    test, primality is not labeled proven, and at least one of N, l, the gcd,
    or floor(log2(l)) differs from the preregistered value, or a frozen
    witness declares l composite.
  required_artifacts:
    - experiments/EXP-BINSTD-d9c48f/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-d9c48f/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-d9c48f/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-d9c48f/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-d9c48f/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-d9c48f/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - The Stage 0 builder code-read.
    - Toy yield measurements in Stages 1 and 2.
    - A deterministic primality proof.
