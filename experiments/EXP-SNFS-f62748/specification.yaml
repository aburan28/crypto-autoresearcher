experiment:
  id: EXP-SNFS-f62748
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-b7a34b; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-b7a34b
  question_id: RQ-SNFS-005666
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Max-over-K null calibration and freeze receipt for the SNFS detectability battery: identical-generator
    replicate pairs, a spiked power control, and a threshold surface over battery size and sample
    size'
  objective: 'The one uncertainty a run reduces is how large a separation a K-statistic battery produces
    when nothing is there, which is the number every later detectability record needs and none can
    produce after the fact. (i) Is the null exact as constructed: across many independent replicate
    pairs drawn from one honest generator with fabricated labels, does every individual statistic
    sit at chance, since a single statistic that does not voids the entire calibration and points
    at either the generator or the scoring path. (ii) What is the inflated threshold: what is the
    distribution of the maximum separation over the K frozen statistics, and its alpha-quantile T,
    at each point of a grid over battery size and sample size, so that a later record using a subset
    of the battery or a different sample size can read its own threshold rather than borrowing one.
    (iii) Does the calibration have power and how redundant is the battery: do deliberately spiked
    replicate pairs land above T, demonstrating the threshold can be exceeded when a real difference
    exists, and how far does the observed maximum distribution fall below the independence prediction,
    which quantifies the effective battery size against the nominal one. All three come from one score
    matrix and require no trapdoored prime to exist.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal claim a run could support is: for this frozen battery,
      this generator, these sample sizes and this scoring path, the null distribution of the maximum
      separation is as measured, T at the declared quantiles is as reported, the effective battery
      size is as estimated, and spiked replicates exceed T as shown. What does NOT follow: nothing
      whatever about trapdoors, special forms, detectability or any parameter set; and specifically,
      exceeding T in a later experiment is not evidence of detection, since generator attribution
      and accidental base rates remain to be charged separately.'
  inputs:
    procedure: 'STAGE 0, seconds: write the battery, the separation measure and the sample-size grid,
      hash the file and record the receipt before any prime is generated. STAGE 1, minutes: implement
      the honest generator and the scoring path, and unit-test the separation measure against hand-computed
      cases. STAGE 2, the bulk, tens of minutes: generate 2M independent samples of N primes each
      with distinct recorded seeds. STAGE 3, minutes: compute the K by M score matrix and the per-pair
      maxima. STAGE 4, seconds: read T at the declared quantiles and run the nested-subset sweep over
      K and the sample-size sweep over N. STAGE 5, minutes: generate and score the spiked replicate
      pairs. STAGE 6, seconds: estimate the effective K by comparing the observed maximum distribution
      against the independence prediction. STAGE 7, minutes: run the label-symmetry and seed-independence
      checks. STAGE 8: emit the threshold surface, the hash receipt and the run manifest.'
    instrument: Pure Python 3.11 standard library only; numpy, sympy, gmpy2 and fpylll are absent
      here and Sage is excluded by contract. random.Random with explicit per-sample seeding, a shared
      Miller-Rabin over pow, statistics and a hand-written bootstrap, hashlib for the freeze receipt,
      json for the threshold surface. New module harness/snfs_battery_null.py holds the battery, the
      generator, the separation measure, the replicate driver and the spiked control; harness/runner.py
      records the manifest and the inference block.
    parameters: 'Prime bit size n = 64, with a replicate at n = 96 to check size dependence. Battery
      size K up to 20 with nested subsets at K in {2,5,10,15,20}. Sample size N per arm in {500, 1000,
      2000}. Replicate pairs M = 100 at each grid point, from 2M independent samples. Spiked pairs:
      10 per grid point, using an incremental-search generator against a resampling generator. Quantiles
      alpha in {0.05, 0.01}. Bootstrap resamples 1000 for every interval. Total wall-clock cap 3600
      seconds.'
  controls:
  - The spiked-replicate arm, which must exceed T and demonstrates the calibration has power.
  - Per-statistic chance verification across replicates, which must hold for every statistic individually.
  - A label-symmetry check, swapping A and B within each pair, which must leave every separation unchanged
    in magnitude.
  - A seed-independence check, confirming no correlation between replicates sharing adjacent seeds.
  - A nested-subset sweep over K to confirm T is monotone increasing in K, which it must be by construction.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The entire experiment IS a null-object control, which creates an unusual
    obligation: it needs its own control to show it has power. That control is a spiked replicate,
    in which one arm is drawn from a deliberately different generator so that a known separation exists,
    and the calibration must place that replicate far above T. Without the spiked arm, a T computed
    from a broken pipeline that always returns chance would look perfect. The null must therefore
    show two things: all per-statistic separations at chance across replicates, and the spiked replicate
    exceeding T at the declared quantile.'
  independent_variables:
  - battery size K
  - sample size N per arm
  - prime bit size n
  - replicate index
  - spiked versus unspiked pair
  metrics:
    primary:
    - empirical distribution of the maximum separation over K per grid point
    - T at alpha in {0.05, 0.01} per grid point
    - per-statistic mean separation with bootstrap interval
    - spiked-replicate separation relative to T
    - effective K against nominal K
    secondary:
    - monotonicity of T in K
    - stability of T across disjoint halves of the replicate set
    - label-symmetry check residual
    - wall-clock seconds and peak memory
    - battery hash and generation timestamps
  heuristic_under_test: null
  preregistered_prediction:
    quantity: T(K, N, alpha), the alpha-upper-quantile of the maximum over K frozen statistics of
      the two-sample separation between two samples drawn from the identical generator.
    formula: Under independence and an approximately Gaussian per-statistic null with standard deviation
      sigma(N), the prediction is T(K,N,alpha) = 0.5 + sigma(N) times z(1 - alpha/K), the Bonferroni-style
      form, and the effective K is defined as the value K_eff solving the same equation with the observed
      T. The prereg statement is that measured T lies at or below the independence prediction, since
      correlation can only reduce it, and any measured T above it indicates a broken null rather than
      a discovery.
    source: Pre-registered in the parent proposal IDEA-20260816-b7a34b before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Prime size 64 bits with a 96-bit replicate, sample sizes up to 2000 and battery
      sizes up to 20, chosen so the full replicate design fits in an hour of pure-Python time, which
      is what makes it feasible to run BEFORE the campaign rather than after. No transfer to other
      sizes is claimed: T is explicitly a function of K, N, the scoring path and the generator, and
      the specification requires re-measurement rather than extrapolation whenever any of those changes,
      with the n = 96 replicate included solely to document how strongly the surface moves with prime
      size.'
    correspondence: null
  tail_checks:
  - Inspect the replicate pairs producing the largest maxima and confirm they are not driven by a
    single statistic that is broken.
  - Check the extreme tail of the per-statistic distributions for heavy tails that would make the
    bootstrap intervals optimistic.
  - Check the smallest sample size, where the separation measure is noisiest and T is largest.
  - Inspect spiked pairs that fail to exceed T, since those bound the calibration's power.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Abort if any per-statistic mean separation deviates from chance beyond its bootstrap band, since
    the null is then broken.
  - Stop at the 3600-second total cap and report the grid points completed rather than interpolating
    the rest.
  - Abort if the label-symmetry check fails.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Every grid point reports T at both quantiles with a stability check across disjoint
    replicate halves, every statistic is verified at chance, the spiked control exceeds T, and the
    effective K is reported alongside the nominal K, with the freeze receipt timestamped before the
    first prime.
  falsification_criterion:
  - Any statistic deviates from chance across replicates, voiding the calibration.
  - T is non-monotone in K, indicating an implementation error.
  - Spiked replicates fail to exceed T, showing the threshold has no demonstrated power.
  - T differs materially between disjoint halves of the replicate set, showing it is not estimable
    at this M.
  - Measured T exceeds the independence prediction, which is impossible under a correct null and indicates
    a broken construction.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-b7a34b
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The battery itself is not specified here beyond its size; the Coordinator must fix the K statistics
    and hash them, since T is meaningless without the exact battery it was measured for.
  - The Gaussian approximation behind the Bonferroni prereg form is convenient rather than justified
    for an area-under-the-curve statistic, and a Coordinator may require a permutation-based prediction
    instead.
  - Whether T should be measured per prime size or once and reused is left open; the n = 96 replicate
    exists to inform that ruling but does not settle it.
