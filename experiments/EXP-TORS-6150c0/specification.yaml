# =============================================================================
# EXP-TORS-6150c0 — version 1, approved by DEC-20261006-542d0d.
# Frozen measurement of the order-3 coset collision count in
# IDEA-20261006-507d69. Success is the idea's prediction: at least one
# unordered pair of distinct nontrivial <T>-cosets shares M. A finished
# pair count of 0, with at least two cosets and the controls passing,
# is the concrete negative. This design session did not enumerate a
# point and did not count a collision. No discrete logarithm is
# authorized. Source idea bytes are copied unchanged from
# origin/design/frob-1e54b5-theta.
# =============================================================================
experiment:
  id: EXP-TORS-6150c0
  hypothesis_id: H-TORS-0bd4f8
  question_id: RQ-TORS-8c7b79
  source_idea: IDEA-20261006-507d69
  version: 1
  title: >-
    Collision count of successive x-difference multisets on cosets of
    one rational order-3 point
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261006-542d0d
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null.
      Approval does not assert that M collides, and it does not assert
      that a collision is more than a birthday count.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Scan primes from 13 through 200, keep the first nonsingular
      prime with a rational point of order exactly 3, freeze that
      point, partition nontrivial cosets, count colliding multisets,
      and draw 500 x-shuffles. Do not change the equation, the order,
      or the shuffle count. Do not search for a discrete logarithm.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether, on y^2 = x^3 + 2x + 3 at the first eligible prime,
    the number of unordered pairs of distinct nontrivial cosets of <T>
    with the same successive x-difference multiset is at least 1. A
    finished count of 0 under the gates below is the concrete negative.
    No faster discrete logarithm is in scope.

  inputs:
    A: 2
    B: 3
    model: y^2 = x^3 + 2x + 3
    p_min: 13
    p_max: 200
    torsion_order: 3
    shuffles: 500
    central_tail_each_side: 25
    curve_search: >-
      An integer q with 13 ≤ q ≤ 200 is prime when no integer d with
      2 ≤ d and d*d ≤ q divides q. Scan such primes in increasing
      order. The model is singular at p when (275 mod p) is 0. Skip
      singular primes. On a nonsingular prime, search for T as specified
      below. Keep the first prime that has such a T. Record every
      earlier nonsingular prime that had no order-3 point as a skipped
      prime, and do not compute M there. Do not score a second prime.
    point_at_infinity: >-
      The point at infinity is a sentinel, written O. It has no x and
      no y. It is not an affine point.
    addition: >-
      Residues are in {0, 1, ..., p-1}. For affine P = (x1, y1) and
      Q = (x2, y2): if x1 ≠ x2, the slope λ is (y2 - y1) times the
      modular inverse of (x2 - x1), x3 is (λ*λ - x1 - x2) mod p, and
      y3 is (λ*(x1 - x3) - y1) mod p. If x1 = x2 and (y1 + y2) mod p
      is 0, the sum is O. If x1 = x2 and y1 = y2 and y1 = 0, the sum
      is O. If x1 = x2 and y1 = y2 and y1 ≠ 0, the slope λ is
      (3*x1*x1 + 2) times the modular inverse of (2*y1), x3 is
      (λ*λ - 2*x1) mod p, and y3 is (λ*(x1 - x3) - y1) mod p. P + O
      and O + P equal P. O + O equals O. A sum that the cases do not
      name is an instrument failure.
    order_3_point: >-
      Scan x from 0 through p-1 and, for each x, y from 0 through p-1.
      Keep (x, y) when (y*y - (x*x*x + 2*x + 3)) mod p is 0. For each
      such point T in that order, let D be T+T. Accept T when D is
      affine and D+T is O. The first accepted T is frozen. Do not
      switch to a later point. If the scan ends with no accepted T,
      this prime has no rational point of order exactly 3.
    cosets: >-
      List every affine point by the same double loop. The identity
      coset is {O, T, 2T} and is not scored. The nontrivial points are
      the affine points other than T and 2T, sorted by x ascending
      then y ascending. Walk that list. For the first still-unused
      point P, set P1 = P+T and P2 = P1+T. Require P1 and P2 affine,
      distinct from each other and from P, present in the unused list,
      and P2+T = P. Remove P, P1, and P2 from the unused list. That
      triple is one coset, represented by P. A failed requirement is
      group_law_failed and stops the partition.
    multiset: >-
      For a coset (P, P1, P2), the three differences are
      (x(P1) - x(P)) mod p, (x(P2) - x(P1)) mod p, and
      (x(P) - x(P2)) mod p, each in {0, 1, ..., p-1}. Sort them into
      a nondecreasing triple. Two cosets collide when their triples
      are equal. The pair count is the number of unordered pairs of
      distinct cosets with equal triples.
    difference_sum: >-
      The three unsorted differences of every scored coset sum to 0
      mod p. Any other sum is difference_sum_failed. The claim is not
      scored. A bad sum is not a pair count of 0.
    identity_exclusion: >-
      No scored coset contains O, T, or 2T. A leak is identity_leak.
      The claim is not scored.
    shuffle: >-
      Let L be the nontrivial affine points in the same sorted order,
      and let N be the length of L. A shuffle permutes a copy of their
      x-coordinates and leaves the coset membership on the point
      index. For shuffle s from 0 through 499, and for k from N-1 down
      to 1, let j be the integer formed by the first 8 bytes of
      SHA-256 of the UTF-8 string EXP-TORS-6150c0|xshuffle|{s}|{k},
      big-endian, reduced modulo (k+1). Swap positions k and j. The
      string has no trailing newline. Differences are then computed
      from the shuffled x labels of the three point indices. The
      group-law x-coordinates are not reused inside a shuffle.
    central_band: >-
      Sort the 500 shuffle collision counts into a nondecreasing
      sequence v_1 through v_500, one-based. The central 90 percent is
      the closed interval from v_26 through v_475. The group-law count
      C lies outside that band when C < v_26 or C > v_475. The band
      is a flag. It does not change the reading row. Do not call a
      library percentile helper.
    birthday_gap: >-
      For each shuffle let R_s be the number of distinct triples. Let
      R_hat be the sum of the R_s divided by 500, and let C_hat be the
      sum of the shuffle collision counts divided by 500, both as
      exact rationals. Let B be n*(n-1)/(2*R_hat) when R_hat is
      positive. HEUR-1 is mismatched when the absolute value of
      C_hat - B exceeds one quarter of the maximum of B and 1. A
      mismatch does not change the reading row and is not a pair count
      of 0. A floating-point comparison voids the run.

  controls:
    - id: group-law
      statement: >-
        2T is affine, 3T is O, and every scored triple cycles under
        translation by T. A failure stops scoring and is not a pair
        count of 0.
    - id: difference-sum
      statement: >-
        The three differences of every scored coset sum to 0 in F_p.
        A failure stops scoring and is not a pair count of 0.
    - id: identity-exclusion
      statement: >-
        The scored cosets do not contain O, T, or 2T.
    - id: x-shuffle-null
      statement: >-
        500 Fisher-Yates shuffles of the affine x-coordinates on the
        frozen coset partition. The pair-count claim is the group-law
        count. The shuffle band is recorded beside it.
    - id: skipped-primes
      statement: >-
        Nonsingular primes before the selected p that have no rational
        order-3 point are counted and not scored.

  independent_variables:
    - prime p in increasing order from 13 through 200, stopping at the first eligible model
    - shuffle index s in {0, ..., 499}
    - stream in {group_law, shuffle}

  metrics:
    primary:
      - id: colliding_pair_count
        statement: >-
          The integer number of unordered pairs of distinct nontrivial
          cosets with equal sorted difference triples.
    secondary:
      - id: selected_prime
        statement: selected p, x(T), y(T), and the number n of nontrivial cosets
      - id: skipped_primes
        statement: how many earlier nonsingular primes had no order-3 point
      - id: shuffle_band
        statement: v_26, v_475, and whether the group-law count lies outside that closed interval
      - id: birthday_gap
        statement: C_hat, R_hat, B, and whether HEUR-1 is mismatched
      - id: unique_fraction
        statement: the fraction of nontrivial cosets whose triple is unique

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 compares the shuffle mean with the birthday quantity. A
    mismatch is a flag. Do not relabel a mismatch as a pair count of 0,
    and do not relabel a pair count of 0 as a mismatch.

  preregistered_prediction:
    quantity: >-
      The number of unordered pairs of distinct nontrivial <T>-cosets
      with equal successive x-difference multisets, on the first
      eligible prime.
    formula: >-
      The pair count is at least 1, with n at least 2, the group-law
      cycle closed, every difference triple summing to 0, and the
      identity coset excluded. The concrete negative is a finished pair
      count of 0 under those same gates. Source idea
      IDEA-20261006-507d69, prediction minimum_effect at least 1.
    source: >-
      IDEA-20261006-507d69. The birthday comparison is the finite
      uniform model named in that idea's H1. KR-RHO-13bf67, opened in
      this session, is the complexity baseline and does not predict the
      pair count.

  scale_relevance:
    tier: toy
    justification: >-
      One curve and the first prime at most 200. No transfer to a
      larger prime, to another equation, or to a walk is assumed. Five
      percent of 500 shuffles is 25 draws on each side, so the band is
      an order statistic with an expected tail count above 1. The curve
      contributes one pair count.
    correspondence: null

  tail_checks:
    - Record the maximum of the 500 shuffle collision counts beside v_475.
    - >-
      Record whether the group-law count lies outside the central band.
      That flag does not change the row.

  replication:
    seeds:
      - EXP-TORS-6150c0|xshuffle|{s}|{k}
    independent_instances: 1
    null_draws: 500
    note: >-
      One is the number of primes scored. Five hundred is the frozen
      null sample from the source idea.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
    scientific_shuffles: 500
    budget_note: >-
      One run manifest covers one prime and 500 shuffles. Wall-clock
      and CPU figures are advisory and null. The 2 GB memory figure is
      machine protection. A watchdog expiry is failed_infrastructure,
      not a pair count of 0.

  stopping_rules:
    - Stop the prime scan at the first eligible prime.
    - Stop after that prime's controls and 500 shuffles are recorded, when the row needs them.
    - Do not scan a later prime once a row has been named.
    - A timeout voids the run. It does not fill a pair count of 0.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - An equation other than y^2 = x^3 + 2x + 3 voids the run.
    - Scoring more than one prime voids the run.
    - A floating-point birthday comparison voids the run.
    - group_law_failed, difference_sum_failed, and identity_leak are instrument rows. They are not a pair count of 0.
    - Switching T after the first accepted point voids the run.

  success_criterion: >-
    An eligible prime exists, n is at least 2, the group-law cycle
    closes, every difference triple sums to 0, the identity coset is
    excluded, and the colliding-pair count is at least 1. This is the
    prediction of IDEA-20261006-507d69. It is reachable as a failure
    when the finished pair count is 0 under those same gates.

  falsification_criterion: >-
    The eligible prime is fully scored, the controls pass, n is at
    least 2, and the colliding-pair count is 0. That finished count is
    the concrete negative. No eligible prime, and fewer than two
    nontrivial cosets, are the other negatives named with the source
    idea. None of these is an infrastructure event.

  required_artifacts:
    - experiments/EXP-TORS-6150c0/runs/RUN-*/manifest.yaml
    - experiments/EXP-TORS-6150c0/runs/RUN-*/stdout.txt
    - experiments/EXP-TORS-6150c0/runs/RUN-*/stderr.txt
    - experiments/EXP-TORS-6150c0/runs/RUN-*/cosets.csv
    - experiments/EXP-TORS-6150c0/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: no_order3_prime
      when: no prime with 13 ≤ p ≤ 200 is nonsingular and has a rational point of order exactly 3
    - id: group_law_failed
      when: a candidate T or a coset triple fails the group-law cycle
    - id: difference_sum_failed
      when: a scored triple's three differences do not sum to 0 in F_p
    - id: identity_leak
      when: a scored coset contains O, T, or 2T
    - id: too_few_cosets
      when: the earlier gates pass and n is less than 2
    - id: collides
      when: the earlier gates pass, n is at least 2, and the pair count is at least 1
    - id: separates
      when: the earlier gates pass, n is at least 2, and the pair count is 0
  reading_rule: >-
    Name exactly one row, the first whose condition holds in the order
    listed. collides is the only success row. separates is the concrete
    negative. no_order3_prime and too_few_cosets are the other negatives.
    group_law_failed, difference_sum_failed, and identity_leak are not
    pair-count evidence. Record p or none, n, the pair count, v_26,
    v_475, the band flag, and attack_claimed false beside the row.
    Those fields do not change the row.
