experiment:
  id: EXP-SHATWO-f18b6e
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-714bcb; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-714bcb
  question_id: RQ-SHATWO-f196c7
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Two-sided planted-signal gate for the step-reduced SHA-256/16 search instrument: recovery
    rate against a monotone difficulty ladder and false-positive rate against provably unsatisfiable
    twins'
  objective: 'The one uncertainty a run reduces is whether the frozen search instrument used by every
    frontier measurement in this bucket is capable of supporting either a negative or a positive reading.
    (i) It measures the recovery rate r(d): the fraction of instances containing a solution planted
    by forward construction on which the instrument returns a certificate-verified assignment within
    the frozen budget, at each level of a monotone difficulty knob, so that any later null result
    at difficulty d can be read against the instrument''s own detection power at d rather than against
    an assumption. (ii) It measures the false-positive rate f(d) on unsatisfiable twins built as the
    byte-identical CNF plus one unit clause contradicting a bit the planted solution forces, with
    unsatisfiability confirmed independently, so that any later SAT answer is read against a measured
    zero rather than against trust in an encoder. (iii) It applies the inventor-protocol section 3
    decay test by requiring r(d) to fall as difficulty rises, so that a flat recovery curve - the
    signature of an instrument satisfying its own predicate trivially - withdraws the licence instead
    of reassuring. A run does NOT reduce uncertainty about whether the instrument can find UNPLANTED
    characteristics, which is a strictly harder task this contract does not measure and does not claim.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support: for the named encoder
      build, the named solver version, the frozen budget, word width 16 and the declared step count
      and difficulty ladder, the instrument recovered planted solutions at the emitted rates and returned
      SAT on independently confirmed unsatisfiable twins at the emitted rate, with the emitted replicate
      spread. WHAT DOES NOT FOLLOW: that the instrument can find characteristics nobody planted, which
      is a different and harder task; that any frontier number produced by this instrument is correct,
      since a gate licenses a reading rather than validating it; that a decaying recovery curve is
      evidence about SHA-256 rather than about the instrument; and nothing whatsoever about SHA-256
      at any step count, full 64-step SHA-256, HMAC-SHA-256, or any deployed system.'
  inputs:
    procedure: 'STAGE 0 (hours, human): write and hash the preregistration - width, step count, difficulty
      ladder definition, instance counts, seeds, and the three decision thresholds. STAGE 1 (hours,
      human): implement the planting construction - choose free schedule words, evaluate forward with
      an independently written SHA-256/16, read off the step-reduced predicate - and verify every
      planted assignment against a second implementation before encoding. STAGE 2 (hours, human and
      machine): build the twins by adding one contradicting unit clause, and confirm unsatisfiability
      with a second solver on all twins and by exhaustive enumeration at w = 8 on a calibration subset.
      STAGE 3 (minutes, machine): pilot at the lowest difficulty to set the frozen budget so that
      r is neither 0 nor 1, and freeze it. STAGE 4 (the bulk, hours machine): run planted, twin and
      matched-random-CNF arms at every difficulty level, five seeds each, at the frozen budget, with
      every returned assignment verified. STAGE 5 (minutes): emit r(d), f(d), random-arm rate, replicate
      spreads, TIMEOUT counts as budget outcomes, and the pass or fail licence with the run manifest
      carrying encoder hash, solver version, seeds and resolved inference block.'
    instrument: Python 3.11 for the planting construction, encoder driver and harness; PySAT with
      a pinned CaDiCaL or Kissat build as the instrument under test, and a second pinned solver of
      different lineage for independent unsatisfiability confirmation; two independently written pure-Python
      SHA-256/16 implementations for planting and for certificate verification; exhaustive enumeration
      in plain Python at w = 8 for the calibration subset; harness/runner.py for manifests, deterministic
      seeds and the inference block. No computer-algebra system and no Sage.
    parameters: 'Word width 16, block 16 words = 256 bits, one step count fixed in the middle of the
      intended frontier ladder. Difficulty ladder: number of forced-zero output-difference bits at
      5 levels spanning the range from easily recovered to rarely recovered, set by the pilot. Instances:
      100 planted and 100 twins per difficulty level; 100 matched random-CNF instances per level.
      Seeds 201..205 per instance. Frozen budget set by the pilot so that r at the lowest level is
      between 0.6 and 0.95. Calibration subset for exhaustive confirmation: 20 twins at w = 8.'
  controls:
  - Unsatisfiable-twin arm at every difficulty level, byte-identical CNF plus one contradicting unit
    clause, same invocation.
  - Independent unsatisfiability confirmation of every twin by a second solver, and by exhaustive
    enumeration on a calibration subset at the smallest width.
  - Matched random-CNF arm with equal variable and clause counts.
  - Certificate verification of every returned assignment against an independently written reduced-width
    implementation.
  - Replicate seeds at every cell, with the spread reported so that a rate difference smaller than
    the spread is not read as a decay.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The unsatisfiable twins ARE the null object, and they run in the same
    invocation through the identical encoder and solver: each is the byte-identical CNF of a planted
    instance plus one unit clause contradicting a bit that the planted solution forces, so it is unsatisfiable
    by construction and its unsatisfiability is independently confirmed by a second solver, and by
    exhaustive enumeration at the smallest tested width. A second null runs alongside: random CNF
    instances with matched variable and clause counts, on which the SAT rate must be far below the
    signal arm''s. For the gate to license anything, the twin arm must show f(d) = 0 at every level,
    and the random-CNF arm must not match the signal arm''s recovery rate; if random instances are
    solved as often as planted ones, the instrument is solving something other than the intended predicate.'
  independent_variables:
  - planted difficulty level d (forced-zero output-difference bits)
  - arm (planted, unsatisfiable twin, matched random CNF)
  - seed
  metrics:
    primary:
    - recovery rate r(d) with replicate spread
    - false-positive rate f(d) on twins
    - SAT rate on matched random CNF
    - certificate verification rate of returned assignments
    secondary:
    - variable and clause counts per arm and level
    - wall-clock and peak memory per invocation
    - TIMEOUT counts per cell recorded as budget outcomes
    - independent unsatisfiability confirmation status per twin
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The drop in recovery rate from the lowest to the highest difficulty level in the planted
      arm, and the false-positive rate on the unsatisfiable twins pooled across all levels.
    formula: 'drop = r(d_min) - r(d_max), where r(d) is the fraction of the 100 planted instances
      at level d, pooled over 5 seeds, on which the instrument returned an assignment that decodes
      and verifies against an independent SHA-256/16 within the frozen budget. Frozen thresholds:
      PASS requires drop >= 0.2 AND f = 0.0 exactly on all 500 twins AND the matched random-CNF SAT
      rate at most one fifth of r(d_min). Any other outcome is FAIL and withdraws the instrument''s
      licence for this bucket.'
    source: Pre-registered in the parent proposal IDEA-20260816-714bcb before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at word width 16 with a 256-bit block and a single mid-ladder step count,
      which is a toy object chosen so the gate is cheap enough to re-run whenever the encoder or solver
      changes. The transfer assumption stated and not tested: that an instrument gated at w = 16 is
      the same instrument at other widths, which is true of the code but not necessarily of its behaviour,
      so any contract at a different width must cite its own gate run rather than this one. No extrapolation
      to w = 32 or to full SHA-256 is made or permitted.'
    correspondence: null
  tail_checks:
  - Report the per-seed recovery counts, not only the pooled rate, so a seed-dependent instrument
    is visible.
  - Check the lowest difficulty level, where r must not be 1.0 exactly, since a saturated bottom rung
    cannot show decay.
  - Check the exhaustive-enumeration calibration subset at w = 8 against the second solver's unsatisfiability
    verdict; any disagreement is a fatal construction fault.
  - Report TIMEOUT counts separately from UNSAT counts at every cell, since conflating them is the
    exact error AGENTS.md rule 3 forbids.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and FAIL immediately on the first twin that returns SAT and is independently confirmed unsatisfiable.
  - Halt and FAIL if any returned assignment in the planted arm fails independent verification.
  - Stop at the 5 preregistered difficulty levels; do not add levels after seeing the curve.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The instrument is scored PASS only if drop >= 0.2, f = 0.0 on all independently
    confirmed twins, the matched random-CNF SAT rate is at most one fifth of r(d_min), and every returned
    assignment verifies - and a FAIL is an equally complete deliverable, because it names the exact
    difficulty level and failure mode at which the instrument stops behaving and thereby withdraws
    the licence from the other contracts in this bucket by run id.
  falsification_criterion:
  - Any independently confirmed unsatisfiable twin returns SAT, falsifying encoder semantics.
  - r(d) is flat within replicate spread across the ladder, falsifying the instrument by the section
    3 decay test.
  - The matched random-CNF arm is solved at a rate comparable to the planted arm, falsifying the claim
    that the instrument solves the intended predicate.
  - r(d_min) is near zero, falsifying the instrument's ability to license any negative reading at
    any difficulty.
  - A second solver disagrees with the constructed unsatisfiability of any twin, falsifying the twin
    construction and voiding the null arm.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-714bcb
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The planted-versus-unplanted asymmetry is acknowledged but not quantified anywhere in this contract;
    a Coordinator must decide whether a gate that cannot bound it is sufficient to license the other
    contracts, and record that decision.
  - The difficulty knob conflates constraint count with constraint structure, and no argument is offered
    that a knob separating them exists.
  - The frozen budget is set by a pilot rather than derived, so PASS is defined relative to a budget
    chosen to make the bottom rung non-saturated.
