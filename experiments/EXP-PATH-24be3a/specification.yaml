experiment:
  id: EXP-PATH-24be3a
  hypothesis_id: H-PATH-7fdef7
  question_id: RQ-ICEX-001
  goal_id: GOAL-PATH-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Four-stage identifiability audit of the frozen single-cell exponent
    estimator alpha = log(C)/log(ell): STAGE 0 is a zero-compute reading gate
    that can end the line, STAGE 1 is pen-and-paper algebra, STAGE 2 is a
    synthetic planted-(alpha_0, kappa) oracle in seconds, and STAGE 3 runs real
    Pollard rho and BSGS as the null objects whose exponent is known to be
    exactly 1/2.

  objective: >-
    Decide whether the exponent estimator frozen in ic_exponent_protocol
    version ICEX-e2e-exponent-1.0.0-review identifies the asymptotic exponent
    alpha_0 at the protocol's own sealed toy scales, or whether its output is
    displaced by a constant-factor term log(kappa)/log(ell) that its
    replica-based confidence interval cannot see. The decision matters to
    GOAL-PATH-001 because that estimator is the instrument named in this goal's
    PRIMARY completion criterion. Both outcomes are deliverables: a refutation
    of the objection vindicates the frozen protocol at the tested scales, and a
    confirmation prices a repair before the tier series commissions the two
    measurement packages that would feed it.

  what_this_is_not:
    - Not an ECDLP attack, an index-calculus pipeline, a relation collection, a decomposition search, or a discrete-logarithm computation of any kind.
    - Not an execution of GOAL-ICEX-001. No ICEX fixture is materialised, no fixture_sha256 is minted, no SDEG / RELN / MONO feed is read, and no alpha is minted for any index-calculus pipeline. The "NO ICEX MEASUREMENT AUTHORIZED" pin on GOAL-ICEX-001 is untouched by this contract.
    - Not an edit, amendment, correction, supersession, or status change of the frozen protocol, of EV-ICEX-001, or of any goal record. The frozen protocol is immutable.
    - Not a claim that the frozen protocol is invalid as a whole. Four of the five clauses of PRED-ALPHA-EXCLUDES-HALF-TOY are outside this contract's scope and are neither tested nor challenged.
    - Not an exponent, asymptotic, cost, crypto-scale, or deployed-scheme claim. No exponent is moved.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has happened.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: that the frozen single-cell estimator's expectation is
      alpha_0 + (log_2 kappa + E log_2 X)/b on the tested algorithms at
      b in {8,10,12,16,20,32}; that its replica CI's half-width scales as
      sd(log_2 X)/(b sqrt(R)) so the critical replica count is b-invariant;
      that measured Pollard rho and BSGS return alpha_hat != 1/2 at every tested
      cell with the measured sign; and that a two-cell slope estimator recovers
      a planted alpha_0 for every planted kappa at the tested noise levels.
      A run CANNOT support any statement about index-calculus cost, about
      whether alpha < 1/2 for any real pipeline, about any curve above 32 bits,
      about crypto scale, or about ECDLP hardness in either direction.

  inputs:
    field_bits: [8, 10, 12, 16, 20, 32]
    planted_alpha_0: [0.34, 0.40, 0.45, 0.50, 0.55]
    planted_log2_kappa: [-8, -2, 0, 2, 8]
    planted_noise_law: >-
      C = kappa * ell^{alpha_0} * X with X = sqrt(-2 ln U), U uniform on (0,1)
      - a Rayleigh(1) multiplicative factor, chosen because it is the shape the
      rho walk length is expected to have, so the synthetic and real arms are
      comparable. The law is declared here and is NOT tuned after any
      observation.
    replica_sweep: [3, 10, 30, 100, 300, 1000]
    charged_ops_per_walk_step: [1, 2]
    primary_coordinate: group_operations_add_dbl_mixed_add
    secondary_coordinates: [memory_words, cpu_time_ns]
    master_seed: 20260805
    domain: EXP-PATH-24be3a/v1
    seed_derivation_rule: >-
      Every random quantity is derived deterministically as
      int(SHA256(ascii(domain || "|" || label || "|" || decimal(bits) || "|" ||
      decimal(counter)))) interpreted big-endian unsigned, where label is one of
      "prime", "curve-a", "curve-b", "walk-start", "walk-branch", "synth",
      "bsgs-target". The counter advances by exactly one per digest consumed.
      master_seed enters as the ASCII decimal prefix of domain. A third party
      reproduces every instance bit-for-bit from this rule alone.
    curve_construction: >-
      Per bit size b: p is the first prime found by scanning odd candidates
      upward from L + 1 + 2*(h mod 2^(b-2)) with L = 2^(b-1) and
      h = int(SHA256(seed("prime", b, 0))), using deterministic trial division;
      if the scan reaches 2^b without a prime the cell terminates as
      CONSTRUCTION_FAILURE and no fallback is permitted. The curve is the first
      (a_t, b_t) = (SHA256(seed("curve-a",b,t)) mod p,
      SHA256(seed("curve-b",b,t)) mod p) in increasing t with nonzero
      discriminant, with #E(F_p) computed by exhaustive character summation, and
      with a prime subgroup order ell dividing #E(F_p) and satisfying
      ell > 2^(b-2). If no eligible t <= 65535 exists the cell terminates as
      CONSTRUCTION_FAILURE. ell, p, a, b, #E(F_p) and the generator are recorded
      and hash-committed before any measurement.
    environment_measured_this_session: >-
      In this container `import numpy` SUCCEEDS at version 2.4.6 and
      `import sage` FAILS with ModuleNotFoundError, so src/ic_first_fall_fast.py
      does not import. This contract requires NEITHER: it must run in pure
      Python with the standard library alone, and any use of numpy must be
      optional and recorded. THE ANGLE-BRIEF RECORDS TWO SCOUTS DISAGREEING ON
      THIS POINT; the measurement above is this session's own and is what the
      contract binds to.

  independent_variables:
    - field_bits b
    - planted alpha_0 (synthetic arm only)
    - planted log_2 kappa (synthetic arm only)
    - replica count R
    - charged group operations per walk step c (real arm only)
    - estimator (pointwise versus two-cell slope)

  metrics:
    primary:
      - id: M1
        name: alpha_hat_pointwise_minus_truth
        definition: >-
          log_2(C)/b minus the planted alpha_0 (synthetic arm) or minus 1/2
          (real rho and BSGS arms, whose exponent is 1/2 by assumption
          HEUR-EST-3's reference point), per cell, per replica.
      - id: M2
        name: alpha_slope
        definition: >-
          (log_2 Cbar(b2) - log_2 Cbar(b1))/(b2 - b1) using per-cell replica
          means Cbar, over the ladder span b1 = 8 to b2 = 32 and over the
          protocol's own sealed span b1 = 8 to b2 = 16, both reported.
      - id: M3
        name: R_star
        definition: >-
          The smallest replica count R in the sweep at which a two-sided 95 per
          cent Student-t interval on the replica alphas at a single cell
          excludes 1/2, per cell, for real rho and for real BSGS. Reported as
          ">1000" when no sweep point achieves it.
    secondary:
      - id: M4
        name: kappa_hat_and_noise
        definition: >-
          Measured log_2 kappa_hat = mean_r(log_2 C_r) - (1/2)*b and measured
          sd_r(log_2 C_r), per cell, per algorithm, per charge convention c.
      - id: M5
        name: ci_half_width_vs_R
        definition: >-
          Student-t half-width and interval centre as a function of R over the
          sweep, at a fixed cell.
      - id: M6
        name: sign_table
        definition: >-
          sign(alpha_hat - 1/2) for real rho at c = 1 versus c = 2, per cell.
      - id: M7
        name: power_law_check
        definition: >-
          Ordinary least squares slope and residuals of log_2 Cbar on b across
          the full ladder, per algorithm; the direct test of HEUR-EST-3.
      - id: M8
        name: memory_coordinate_alpha
        definition: >-
          The same pointwise estimator applied to the memory coordinate for
          BSGS, whose memory exponent is also 1/2, reported to show the bias is
          coordinatewise and not specific to time.

  heuristic_under_test: HEUR-EST-1
  heuristic_under_test_note: >-
    HEUR-EST-1 (the multiplicative, scale-free noise factorisation) is the
    heuristic this contract validates directly, via M4 and M7. HEUR-EST-2 (the
    stability of the log-noise distribution) is tested by M4 across cells, and
    HEUR-EST-3 (power-law behaviour at toy scale) by M7. All three are named on
    the hypothesis and none is assumed silently.

  preregistered_prediction:
    quantity: >-
      M1 on the synthetic arm, per cell, per planted (alpha_0, kappa).
    formula: >-
      E[M1] = (log_2 kappa + E[log_2 X]) / b, with E[log_2 X] = 0.0835 for the
      declared Rayleigh(1) noise law. Concretely, for kappa = 2^{-8} and
      ignoring the small noise offset, M1 = -1.0000, -0.8000, -0.6667, -0.5000,
      -0.4000, -0.2500 at b = 8, 10, 12, 16, 20, 32.
    source: >-
      H-PATH-7fdef7 mechanism STEP 2 and STEP 3, derived in-record from the
      logarithm of a product. The value E[log_2 X] = 0.0835 and
      sd(log_2 X) = 0.9254 for Rayleigh(1) are SCOUT-COMPUTED outside the
      harness in this session and MUST be re-derived in-harness at Stage 2
      before they are used; they are declared here so the prediction is fixed,
      not so they are trusted.
  second_preregistered_prediction:
    quantity: M3 (critical replica count) across cells for real Pollard rho.
    formula: >-
      R* satisfies t_{R-1,0.975} * sd(log_2 X)/sqrt(R) < |log_2 kappa_rho +
      E log_2 X|, in which b has cancelled. PREDICTION: R* is INVARIANT in b,
      with max(R*)/min(R*) <= 4 across the six cells.
    source: H-PATH-7fdef7 mechanism STEP 3.

  arms_and_controls:
    treatment: >-
      The frozen pointwise estimator alpha_hat = log_2(C)/b with the protocol's
      replica Student-t interval, applied to the synthetic planted oracle across
      the full (alpha_0, kappa, b) grid.
    measured_null: >-
      REAL POLLARD RHO on the constructed toy curves, at every cell, at both
      charge conventions c = 1 and c = 2, with R = 1000 replicas at each cell.
      Its exponent is 1/2 by construction. FORCED VALUE DERIVED BEFORE THE RUN:
      alpha_hat = 1/2 + log_2(kappa_rho)/b with kappa_rho measured in the same
      run, and the Student-t interval excluding 1/2 once R exceeds the
      b-invariant R*. THIS NULL CAN FAIL: if the interval contains 1/2 at every
      cell at every R up to 1000, the bias is empirically negligible at the
      sealed scales and the hypothesis's clause (C-C) is refuted.
    second_measured_null: >-
      REAL BSGS on the same fixtures. Exponent also 1/2, but a different kappa
      and a genuinely different memory profile. Its role is to check that the
      measured bias tracks kappa rather than the identity of the algorithm: the
      two nulls must give DIFFERENT alpha_hat at the same cell, and the
      difference must equal (log_2 kappa_rho - log_2 kappa_bsgs)/b to within
      replicate error.
    positive_control: >-
      THE SLOPE ESTIMATOR ON THE SYNTHETIC ARM. It MUST recover every planted
      alpha_0 in {0.34, 0.40, 0.45, 0.50, 0.55} for every planted kappa in
      {2^-8, 2^-2, 1, 2^2, 2^8}, within
      2 * sqrt(2) * sd(log_2 X)/((b2-b1) sqrt(R)). IF IT DOES NOT, THE HARNESS
      IS BROKEN AND NO NEGATIVE RESULT ABOUT THE INCUMBENT ESTIMATOR MAY BE
      REPORTED AT ALL. This is the sensitivity demonstration; its comparator and
      threshold are declared here, before the run.
    second_positive_control: >-
      THE INCUMBENT'S OWN EXACT SLICE. At (alpha_0, kappa, noise) = (0.5, 1,
      none) the pointwise estimator must return EXACTLY 0.5 at every cell. This
      is the baseline-reproduction check: the contract must show the incumbent
      is correct where it is correct, before showing where it is not.
    graded_control_1: >-
      SIX INTERIOR POINTS, MONOTONICITY REPORTED. At fixed
      (alpha_0, kappa) = (0.5, 2^-8), sweep b over {8,10,12,16,20,32}.
      PREDICTED |M1| = 8/b, STRICTLY DECREASING: 1.0000, 0.8000, 0.6667, 0.5000,
      0.4000, 0.2500. A bias that does NOT decay as 1/b localises the failure to
      a non-power-law cost term rather than to the constant factor, and is a
      different, separately reportable finding.
    graded_control_2: >-
      THE PARAMETER MEANT TO DESTROY THE EFFECT IS THE REPLICA COUNT. Sweep R
      over {3,10,30,100,300,1000} at a fixed cell on real rho and report the
      interval centre and half-width. PREDICTED: half-width falls as 1/sqrt(R)
      while the centre moves by less than 20 per cent of its distance from 1/2,
      so the false exclusion becomes MORE confident with more data. A quantity
      that fails to decay when the destroying parameter grows is the canonical
      artifact tell (docs/inventor-protocol.md section 3); here the tell is
      inverted and is measured directly.
    ordering_control: >-
      The null arm is generated, measured, hash-committed and its verdict
      recorded BEFORE any synthetic treatment cell is examined. The frozen
      decision rule is executed on the null first. If it emits the same label on
      the null and on the treatment, it discriminates nothing and must be
      rewritten before the treatment arm is read.
    comparability_policy: >-
      Cross-contract comparison to any ICEX artefact, to any SDEG/RELN/MONO
      package, or to any prior EXP-* is FORBIDDEN. A shared numerical seed does
      not imply stream, curve, or output equivalence. Comparison may be made
      only by a separately registered comparator contract naming both domains,
      both streams, the statistic, and the failure disposition.

  scale_relevance:
    tier: toy
    justification: >-
      The core identity alpha_hat = alpha_0 + log(kappa)/log(ell) +
      log(u)/log(ell) is algebra and does not depend on scale; the toy runs
      CHECK a derivation rather than extrapolate one. What is genuinely
      scale-limited is the empirical part: kappa_rho, sd(log_2 X) and the
      power-law quality of the cost curve are measured only at b <= 32, and the
      contract's hard boundary is the frozen protocol's own hard_cap_bits of 32.
      Conclusions about real index-calculus cost curves DO NOT TRANSFER from
      here, because rho's cost is a much better-behaved power law than an
      index-calculus cost is expected to be at toy scale, and the contract says
      so rather than implying otherwise.
    correspondence: >-
      null. Instances are sampled directly; no correspondence trick is used and
      none is claimed.

  tail_checks:
    - >-
      The empirical distribution of log_2 X for real rho is compared against the
      declared Rayleigh(1) shape at each cell, including the upper tail, since a
      heavy log-tail would inflate sd(log_2 X) and change R*.
    - >-
      The single largest observed replica cost at each cell is compared against
      its predicted extreme-value probability under the fitted noise law; a
      systematic excess is reported as evidence against HEUR-EST-2 rather than
      absorbed.
    - >-
      Residuals of the OLS fit in M7 are inspected for curvature in b; curvature
      is the signature of a non-power-law term and is reported whether or not it
      changes the verdict.

  replication:
    seeds: [20260805, 20260806, 20260807]
    independent_instances: 3
    seed_note: >-
      Three independent master seeds regenerate the entire fixture set
      (primes, curves, walks) from scratch, not merely the walks. A conclusion
      that holds at one master seed and not the others is reported as
      seed-dependent rather than as a result.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 4
    maximum_memory_gb: 2
    maximum_runs: 12
    stage_budgets:
      stage0_wall_clock_seconds: 1800
      stage0_compute: zero; reading and recording only
      stage1_wall_clock_seconds: 3600
      stage1_compute: zero; closed-form algebra only
      stage2_wall_clock_seconds: 300
      stage3_wall_clock_seconds: 3600
    budget_note: >-
      The expected rho walk at b = 32 is of order 2^16 steps, so 1000 replicas
      at six cells is comfortably inside the stage-3 budget in pure Python. If
      it is not, the run reports what it covered rather than failing.

  stopping_rules:
    - >-
      SR1 (STAGE 0, TERMINAL): if the frozen protocol is found on careful
      re-reading to specify a cross-cell fit rather than a pointwise evaluation,
      STOP. The objection does not apply as stated; record that finding and end
      the contract. This is the cheapest possible termination and it runs first.
    - >-
      SR2 (STAGE 1, TERMINAL): if the bias identity or the CI cancellation fails
      symbolic checking, STOP. No compute is spent.
    - >-
      SR3: if the second positive control fails - the pointwise estimator does
      not return exactly 0.5 at (alpha_0, kappa, noise) = (0.5, 1, none) - STOP
      and repair the implementation. Nothing may be reported until it passes.
    - >-
      SR4: if the primary positive control fails - the slope estimator cannot
      recover a planted alpha_0 - STOP. No negative about the incumbent may be
      reported.
    - >-
      SR5: if real rho's measured slope (M7) falls outside 0.500 +/- 0.02, STOP.
      The instrument cannot confirm a known exponent and no conclusion follows.
    - >-
      SR6: the run reports what it covered. A truncated replica sweep is
      reported as truncated, with the achieved R per cell, and is never
      presented as a completed sweep.

  invalidation_rules:
    - >-
      Any curve or prime construction reaching its terminal rule is
      CONSTRUCTION_FAILURE for that cell; the cell is dropped and reported as
      dropped. No fallback prime, curve, or bit size is permitted.
    - >-
      Any rho walk that fails to find a collision within 64 * sqrt(ell) steps is
      recorded as a censored observation, reported as such, and EXCLUDED from
      the log-mean with the censoring rate stated. Silent truncation is
      invalidating.
    - >-
      Any post-hoc change to the noise law, the replica sweep, the planted grid,
      the charge conventions, or the decision thresholds after any Stage-2 or
      Stage-3 number has been observed requires a versioned protocol amendment
      with confirmatory_status exploratory_only, and is never an edit.
    - >-
      A measured value used to justify a change to a preregistered prediction
      invalidates that prediction. EV-IC-002 is this program's own precedent for
      a criterion revised after the prior criterion was observed to fail.

  infrastructure_failure_disposition: >-
    A timeout, crash, out-of-memory, missing dependency, or import failure is
    INFRASTRUCTURE SIGNAL AND IS NEVER NEGATIVE MATHEMATICAL EVIDENCE
    (AGENTS.md rule 5). Specifically: if pure-Python curve arithmetic proves too
    slow at b = 32, the correct outcome is a reported partial ladder with the
    achieved cells, NOT a conclusion that the estimator is fine at 32 bits. If
    an optional numpy path is unavailable, the run must still complete without
    it; an unavailable optional dependency is recorded and is not a failure. No
    infrastructure outcome may be cited for or against H-PATH-7fdef7.

  success_criterion: >-
    DECIDABLE, WITH A REACHABLE NEGATIVE. Exactly one of three branches is
    emitted; none is a failure.
    BRANCH CONFIRMED: (a) M1 on the synthetic arm matches (log_2 kappa +
    E log_2 X)/b within 2 standard errors at every cell of the grid; AND (b) the
    slope estimator recovers every planted alpha_0 within its declared band
    (positive control PASSED); AND (c) real Pollard rho's Student-t interval
    excludes 1/2 at at least four of the six cells at some R <= 1000; AND (d)
    M3 is b-invariant with max/min <= 4; AND (e) real rho's OLS slope is
    0.500 +/- 0.02. The deliverable is the measured bias table, the measured
    R*(b), the measured sign table at c = 1 versus c = 2, and the priced repair
    R > 50 * sd(log_2 X)^2 evaluated at the MEASURED sd.
    BRANCH REFUTED: real rho's interval contains 1/2 at every cell at every
    R <= 1000, or M1 does not match the predicted bias. The frozen estimator is
    vindicated at the tested scales; the deliverable is that statement with its
    exact boundary (b <= 32, these algorithms, these noise levels) and the
    explicit note that the algebra of clause (C-A) may still hold while its
    empirical consequence does not.
    BRANCH NOT-APPLICABLE: SR1 fires at Stage 0. The deliverable is the recorded
    reading of the protocol and a note that the pointwise reading was available
    and should be closed off explicitly in any successor protocol version.
    EVERY BRANCH MUST ALSO EMIT: the four-of-five clause statement (that this
    contract tests one clause of PRED-ALPHA-EXCLUDES-HALF-TOY and not the other
    four), and FORWARD GUIDANCE naming what remains open - whether the slope
    estimator's replica budget fits inside this goal's 86400-second campaign
    budget, whether the coordinatewise-dominance clause alone can carry
    completion clause 1, and whether a ratio-based criterion is better
    conditioned than either estimator. A branch emitted without the forward
    guidance HAS NOT FINISHED.

  falsification_criterion: >-
    F1: Stage 0 finds a cross-cell fit was intended - the hypothesis is void as
    stated. F2: the synthetic bias is not (log_2 kappa + E log_2 X)/b - the core
    identity is wrong and the hypothesis is withdrawn by superseding record.
    F3: real rho's CI contains 1/2 at every cell at every R <= 1000 - clause
    (C-C) is refuted. F4: R* falls sharply with b (max/min > 4) - the
    b-cancellation is wrong, extending the ladder DOES fix the problem, and the
    recommendation changes from "replace the estimator" to "extend the ladder".
    F5 (POSITIVE CONTROLS): the slope estimator fails to recover a planted
    alpha_0, or the incumbent fails to return 0.5 on its exact slice, or real
    rho's slope is outside 0.500 +/- 0.02 - the instrument is broken and NO
    negative may be reported at all.
    F6 (NOT A FALSIFICATION, FIXED BEFORE THE RUN AND NOT SELECTABLE AFTER): if
    real rho's cost is not affine in b, the FIRST reading is that the power-law
    model does not apply at these scales, which limits the PROPOSED REPAIR at
    least as much as the incumbent; only the SECOND reading is that the
    incumbent is biased. The report must state which of the two it is claiming.

  required_artifacts:
    - the Stage-0 record: the verbatim quotation of per_coordinate_formula and confidence_interval_rule with file path and line numbers, and the recorded reading
    - the Stage-1 derivation, written out and independently checked, of the bias identity, the CI cancellation, and the slope variance
    - the in-harness re-derivation of E[log_2 X] and sd(log_2 X) for the declared noise law, superseding the SCOUT-COMPUTED values
    - per-cell fixture commitments: p, a, b, #E(F_p), ell, generator, and their SHA-256
    - raw per-replica costs for every arm, cell, seed and charge convention, machine-readable
    - M1 through M8 tables with seeds and standard errors
    - the null-arm verdict, hash-committed with a timestamp before any treatment cell was read
    - the positive-control pass/fail records, reported before any negative statement
    - the graded-control monotonicity tables for b and for R
    - the priced repair: R > 50 * sd(log_2 X)^2 at the measured sd, with the wall-clock estimate it implies
    - the environment record: python version, whether numpy was importable, whether sage was importable, verbatim

  blocking_nulls:
    - >-
      This contract was written by an agent with no authority to approve it and
      no shell session bound to the execution environment. Instrument paths and
      SHA-256 values are to be recorded by the Executor at setup; this record
      does not compute them and does not assert them.
    - >-
      The values E[log_2 X] = 0.0835 and sd(log_2 X) = 0.9254 quoted in
      preregistered_prediction were computed in a scratch interpreter outside
      the harness in this session. They are SCOUT-COMPUTED, are not a run, and
      MUST be re-derived in-harness at Stage 2 before use.
    - >-
      The Pollard rho location constants sqrt(pi/4) and sqrt(pi/2) referenced by
      the hypothesis are RECALLED, UNVERIFIED. No source was read. kappa_rho is
      MEASURED here; nothing in the contract depends on either constant being
      correct.

  assigned_to: executor
  approved_by: null
  approval_note: >-
    Deliberately null and MUST remain null until a Coordinator approves.
    AGENTS.md rule 1 gives this field exactly one legitimate value and this
    contract is status review_required.

  inference:
    requested_policy: research-deep
    resolved_model_id: claude-opus-5
    reasoning_effort: null
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the policy aliases in
      orchestration/model-policies.yaml. Recorded, never silently substituted
      (AGENTS.md rule 11).
    degraded_allowed: false
    degraded_requirements: []
    model_verified: false
    model_verified_reason: >-
      No adapter probe receipt exists for this session.
