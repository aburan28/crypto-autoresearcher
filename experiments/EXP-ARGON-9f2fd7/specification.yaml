experiment:
  id: EXP-ARGON-9f2fd7
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-444f00; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-444f00
  question_id: RQ-ARGON-141710
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Symbolic ranking-flip surface of the additive area-time cost model for a declared memory-reducing
    strategy family, with per-parameter excursion factors, quantifier-order audit, and two forced-outcome
    symbolic controls
  objective: The one uncertainty a run reduces is whether the AT model's verdict -- that no memory-reducing
    strategy costs less than the honest evaluator -- is stable in the model's own unmeasured parameters,
    or whether it turns on one of them. (i) The existence question is answered by solving the two
    declared cost functions for equality and exhibiting the flip surface as an explicit inequality
    in named parameters, or by showing no such surface exists within the declared ranges. (ii) The
    sensitivity question is answered by computing, per parameter, the multiplicative excursion from
    its conventional value to the surface with the others held fixed, and ranking the parameters by
    that factor, which converts a vague concern about model dependence into an ordered table. (iii)
    The quantifier question, required by inventor-protocol section 8 audit three, is answered by reporting
    both the fixed-f and the optimized-f surfaces, since a ranking claim quantified over all strategies
    is a different claim from one evaluated at a single reduction factor, and the difference between
    the two surfaces is the measurement of that gap. The analysis implements no strategy, runs no
    attack, costs no compute, and produces no statement about the security or adequacy of any parameter
    set.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: for the declared additive
      AT cost function and the declared parameterized memory-reducing strategy family with its declared
      recomputation exponent and declared optimization range for f, the ranking between honest evaluator
      and strategy changes exactly on the stated surface, the named parameters require the stated
      multiplicative excursions from their declared conventional values to cross it, and the two symbolic
      controls behave as reported. WHAT DOES NOT FOLLOW: nothing about whether any real strategy achieves
      the family''s costs, since none is implemented; nothing about any adversary''s actual advantage;
      nothing about the correctness of the AT model, since verdict instability is an identifiability
      property and not an error; nothing about multiplicative or hierarchical cost models, which are
      out of scope; and nothing about the safety, adequacy or preferability of any Argon2 parameter
      set, which the contract forbids.'
  inputs:
    procedure: 'STAGE 0 (cost: hours of human time, zero compute): declare the cost functions, the
      strategy family, the recomputation exponent, the optimization range for f, and the conventional
      values of every parameter, marking each conventional value as either sourced or declared-without-source.
      STAGE 1 (cost: hours): derive the flip surface at fixed f, symbolically, with dimensional analysis
      on every line. STAGE 2 (cost: hours): derive it again by an independent route and reconcile
      any disagreement before proceeding. STAGE 3 (cost: low): optimize over f within the declared
      range and derive the second surface; report the difference as the quantifier-order audit. STAGE
      4 (cost: low): compute the per-parameter excursion factors and rank them. STAGE 5 (cost: low):
      apply the identical algebra to the no-memory-hardness null, which must yield an empty surface,
      and to the maximal-depth design, which must yield a surface far from conventional values. STAGE
      6 (cost: low): state the method ceiling explicitly -- the strongest claim this analysis could
      support under ideal parameter knowledge -- and record it as a conditional ranking, never as
      an attack. No compute, no machine, no data of any kind.'
    instrument: Pen-and-paper symbolic derivation recorded in plain text with every step written out,
      plus an independent second derivation by a different route; optional verification of the closed-form
      solutions with Python 3 and sympy purely as an algebra checker, with the human derivation remaining
      the primary artifact and sympy never used to generate a result that was not derived by hand
      first. Dimensional analysis performed explicitly on every equation. No Sage. No harness run
      is required and no run manifest is produced, since there is no execution to record.
    parameters: 'Model parameters: c_mem and c_comp with their ratio as the primary axis, the amortization
      horizon, and the memory-charging granularity. Design parameters t, m, p entering symbolically,
      with the two RFC 9106 recommended tuples substituted at the end as illustrative points rather
      than as tested cases. Strategy family: memory-reduction factor f ranging over a declared interval,
      duration factor g(f), recomputation blowup h(f) with a declared exponent and at least two alternative
      exponents carried through so the conclusion''s dependence on it is visible. Two symbolic controls:
      constant-memory iterated-hash design, maximal-depth design. No numeric data, no measurements,
      no seeds, and no inputs of any kind.'
  controls:
  - No-memory-hardness null design with a forced empty flip surface, worked in the same algebra.
  - Maximal-depth design with a flip surface required to lie far from conventional values, at the
    opposite extreme.
  - Two independent derivations of the flip surface by different routes, since a zero-compute record
    has no runtime check to catch an algebra error.
  - Dimensional analysis on every equation, which catches a large class of errors for free.
  - Both the fixed-f and the optimized-f surfaces reported, since their difference is the quantifier-order
    audit rather than a detail.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a design with no memory hardness at all -- a cost
    function in which memory does not appear, such as an iterated-hash evaluator with constant memory.
    The IDENTICAL symbolic analysis is applied to it, in the same document and by the same algebra,
    and it must produce a degenerate flip surface: there is nothing to reduce, so no memory-reducing
    strategy exists and the ranking is stable under every parameter excursion. If the analysis reports
    a nontrivial flip surface for the null object, the algebra is wrong or the strategy family is
    under-constrained, and the whole record is invalid. A second control at the opposite extreme --
    a maximal-depth design where any memory reduction forces proportional recomputation -- must produce
    a flip surface far from conventional values. For the Argon2 analysis to mean anything, both controls
    must behave, and both are executed in the same invocation, which for a zero-compute symbolic record
    means the same worksheet with the same symbols.'
  independent_variables:
  - the memory-to-computation price ratio c_mem/c_comp
  - the declared recomputation exponent in h(f)
  - the memory-reduction factor f, optimized over a declared range
  - the amortization horizon
  metrics:
    primary:
    - the flip surface as an explicit inequality in named parameters
    - per-parameter multiplicative excursion factor from conventional value to the surface
    - the difference between the fixed-f and optimized-f surfaces
    - the rank position of the parameters this lane's planned experiments measure
    secondary:
    - control outcome for the constant-memory null design
    - control outcome for the maximal-depth design
    - the stated method ceiling
    - sensitivity of the surface to the two alternative recomputation exponents
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The smallest per-parameter multiplicative excursion factor required to flip the AT model's
      ranking, and which parameter attains it.
    formula: Flip surface defined by min over f in the declared range of C_strat(f) = C_honest, where
      C_honest = c_mem * m * T + c_comp * t * m and C_strat(f) = c_mem * (m/f) * T * g(f) + c_comp
      * t * m * h(f). Excursion factor E_k for parameter k is the smallest lambda >= 1 such that scaling
      k by lambda or by 1/lambda, others fixed at conventional values, crosses the surface. Predicted
      min over k of E_k below 10, attained at c_mem/c_comp. Constant-memory null forced to an empty
      surface.
    source: Pre-registered in the parent proposal IDEA-20260816-444f00 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'No scale is tested because nothing is executed; the analysis is symbolic in t,
      m and p, and the two RFC 9106 recommended tuples are substituted only as illustrative points
      at the end. The transfer assumption that must be stated is different in kind from the other
      records in this batch: the conclusion transfers to any parameters at which the declared cost
      functions and strategy family are the right description, and to no parameters at which they
      are not. Since neither g nor h has been measured anywhere in this repository, that domain of
      validity is currently unknown, and the record must say so rather than implying the symbolic
      result holds everywhere.'
    correspondence: null
  tail_checks:
  - Carry at least two alternative recomputation exponents through the entire derivation, since the
    conclusion's dependence on that single declared number is the record's largest exposure.
  - Check the surface's behaviour as f approaches both ends of its declared range, where a term may
    vanish or diverge and the algebra may be degenerate.
  - Check the substituted RFC recommended tuples individually rather than only the symbolic form,
    since a surface can be far from conventional values in general and close at one specific point.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and reconcile before proceeding if the two independent derivations disagree at any stage.
  - Halt if the constant-memory null yields a nonempty surface, since the algebra is then wrong and
    no downstream statement is admissible.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both independent derivations agree, both symbolic controls behave as required,
    and the flip surface, the per-parameter excursion table, the fixed-versus-optimized-f difference,
    and the method ceiling are all recorded with the strategy family and its exponent declared in
    the same document -- irrespective of whether any excursion factor turns out small.
  falsification_criterion:
  - No parameter has an excursion factor below 10, refuting the record's central claim and certifying
    the verdict as stable at zero compute.
  - The constant-memory null yields a nonempty flip surface.
  - The two independent derivations disagree irreconcilably.
  - The most sensitive parameter is one this lane already plans to measure.
  - The fixed-f and optimized-f surfaces coincide identically, showing the quantifier-order concern
    does not apply to this model.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-444f00
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The strategy family's g and h are declared, not measured, and nothing in this repository measures
    them; a Coordinator must decide whether a purely conditional result is admissible or whether the
    family must first be grounded by a companion measurement.
  - Conventional values for c_mem/c_comp and the amortization horizon may have no citable source in
    this environment; the Coordinator must rule on whether declared-without-source values are acceptable
    and how they are labelled in the record.
  - Whether the additive cost form is the model this question's security argument actually uses, as
    opposed to a multiplicative or hierarchical form, must be settled against KN-LIT-7f3c21 before
    approval, since auditing the wrong functional form produces a confident irrelevant surface.
  - The declared optimization range for f is not justified here and needs a physical argument, since
    an unbounded range admits meaningless reductions.
