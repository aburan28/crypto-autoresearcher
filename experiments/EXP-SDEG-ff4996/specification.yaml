# =============================================================================
# EXP-SDEG-ff4996 — version 1, approved by DEC-20261006-1c08b6.
# Frozen measurement of the peak-nonzero comparison in
# IDEA-20261006-6bb2ec. Success is the idea's prediction: over eight
# complete F_61 targets the support-matched median of peak ratios is
# at least 1/2, and the dense median is at most 1/2. A finished
# support-matched median strictly below 1/2 is the concrete negative.
# This design session did not build a matrix and did not record a
# nonzero count. No discrete logarithm is authorized.
# Source idea bytes are copied unchanged from
# origin/design/mlkem-0e9abf-isometry.
# =============================================================================
experiment:
  id: EXP-SDEG-ff4996
  hypothesis_id: H-SDEG-34cff4
  question_id: RQ-SDEG-001
  source_idea: IDEA-20261006-6bb2ec
  version: 1
  title: >-
    Peak nonzero count of one F_61 S_3 Macaulay matrix against
    support-matched and dense controls
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261006-1c08b6
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null.
      Approval does not assert that the peak is support-priced, and it
      does not assert that reduction fill-in sets the memory term.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Search one ordinary curve over F_61, draw one factor base of
      size 8, score eight targets, build the support-matched and dense
      arms, run the twenty-system tail, recompute the eight Semaev
      matrices with a second build, and name exactly one reading row.
      Do not change the thresholds 1/2 and 2. Do not search for a
      discrete logarithm.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether, on one ordinary curve over F_61 with B = 8, the
    median over eight targets of peak_nnz(S_3) divided by the
    support-matched peak is at least 1/2, and the median against the
    dense peak is at most 1/2. A finished support-matched median
    strictly below 1/2 is the concrete negative. No faster discrete
    logarithm is in scope.

  inputs:
    prime: 61
    cardinality: 8
    summation_polynomial: S_3
    targets: 8
    draw_cap: 32
    macaulay_degree: 8
    h1_replicates: 20
    curve_search: >-
      Scan integers A from 1 upward and, for each A, scan integers
      Bcoef from 1 upward. The model is y^2 = x^3 + A x + Bcoef over
      F_61. Skip the model when 4 A^3 + 27 Bcoef^2 = 0. Count points
      by summing, over x in {0, 1, ..., 60}, one plus the Legendre
      symbol of x^3 + A x + Bcoef, then add the point at infinity.
      The trace is t = 62 - #E. Skip the model when t = 0. Keep the
      first model that remains, in (A, Bcoef) lexicographic order.
      Record A, Bcoef, #E, and t before any matrix is built. Let n be
      the largest prime factor of #E. Let G be the first affine point,
      scanning x from 0 and taking the smaller y in {0, ..., 60},
      whose order is n. The subgroup is <G>.
    summation_polynomial_formula: >-
      S_3(x1, x2, x3) = (x1 - x2)^2 x3^2
      - 2*((x1 + x2)*(x1*x2 + A) + 2*Bcoef)*x3
      + (x1*x2 - A)^2 - 4*Bcoef*(x1 + x2).
      This is the short-Weierstrass polynomial printed in
      coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-642cf5/v1_blind_rederive.py,
      which this design session opened. Specialize x3 to the target
      abscissa xT and expand over F_61. A and Bcoef are the curve
      coefficients. The two membership polynomials are m1(x1) and
      m2(x2).
    membership: >-
      For a factor base b1, ..., b8 of distinct field elements, the
      membership polynomial is m(X) = product (X - bi), monic of
      degree 8. m1 is m in the variable x1 and m2 is m in the variable
      x2. Field equations x_i^61 - x_i are omitted. They are not rows.
    factor_base_draw: >-
      Liftable abscissae are the x in {0, 1, ..., 60} whose Legendre
      symbol of x^3 + A x + Bcoef is 0 or 1. Shuffle that list with
      Fisher-Yates. The random integer at step k is the first 8
      bytes, as a big-endian integer, of SHA-256 of the UTF-8 string
      EXP-SDEG-ff4996|base|0|{k}. The factor base is the first 8
      elements after the shuffle. Each abscissa is lifted to one
      affine point by taking the smaller y in {0, ..., 60}. If fewer
      than 8 liftable abscissae exist, the run is incomplete and is
      not a negative.
    target_draw: >-
      Draw scalars uniformly from {1, 2, ..., n-1}. The scalar at
      draw j is SHA-256 of the UTF-8 string EXP-SDEG-ff4996|target|{j}
      reduced modulo n-1, plus 1. The target is that scalar times G.
      A draw is complete when the Semaev matrix, the support-matched
      matrix, and the dense matrix each have a positive peak_nnz and
      a positive initial_nnz, and the dense initial_nnz is strictly
      greater than the Semaev initial_nnz. Continue until eight
      complete targets have been scored, or until 32 draws have been
      attempted, whichever comes first. Hits and misses are pooled.
      The primary medians do not drop a class.
    label: >-
      A target T is a hit if and only if some ordered pair of distinct
      lifted base points sums, under the elliptic curve law, to T or
      to -T. Otherwise it is a miss. The labeler is point addition.
      The solver is not the labeler. The label is recorded for the
      optional split and is not an input to the primary medians.
    columns: >-
      Columns are the monomials in x1, x2 of total degree at most 8.
      Order them by grevlex with x1 > x2, higher monomial first:
      higher total degree precedes lower total degree, and at equal
      total degree the larger exponent of x1 precedes. Column 0 is
      the highest monomial.
    rows: >-
      Let d_s be the total degree of the expanded specialized S_3.
      Let d1 and d2 be the total degrees of m1 and m2, each 8 when
      the leading term does not cancel. Multipliers are the monomials
      whose total degree is at most 8 minus the generator degree,
      listed in the same grevlex order from low degree to high. Rows
      are, in order, every multiplier times the specialized S_3, then
      every multiplier times m1, then every multiplier times m2.
      Each row is the coefficient vector of that product on the
      frozen columns.
    solver: >-
      Gaussian elimination over F_61 on that matrix. initial_nnz is
      the number of nonzero entries before the first row operation.
      Start at pivot_row 0. For each column from 0 upward, search
      rows from pivot_row downward for the smallest index whose entry
      in that column is nonzero. If none exists, skip the column. If
      the pivot row is not that index, swap the two rows. Scale the
      pivot row so the pivot entry is 1. Then, for every other row
      whose entry in the pivot column is nonzero, subtract the
      appropriate multiple of the pivot row, and after that single
      row update recompute the number of nonzero entries in the whole
      matrix. peak_nnz is the maximum of initial_nnz and every count
      taken after a row update. A zero denominator, a missing count,
      or a dense initial_nnz that is not strictly greater than the
      Semaev initial_nnz after one redraw voids that draw. A void is
      not a ratio of 0.
    support_matched: >-
      For each complete target, copy the monomial support of the
      expanded specialized S_3, of m1, and of m2. Each copied
      monomial receives a coefficient in {1, 2, ..., 60}, namely
      SHA-256 of the UTF-8 string
      EXP-SDEG-ff4996|matched|{target_index}|{generator}|{monomial_index}
      reduced modulo 60, plus 1. generator is s, m1, or m2.
      monomial_index enumerates that generator's support in the
      frozen grevlex order. Build and eliminate the Macaulay matrix
      by the same row and column rules.
    dense_arm: >-
      The dense matrix has the same row count and the same column
      index set as that target's Semaev matrix. Entry (i, j) is
      SHA-256 of the UTF-8 string
      EXP-SDEG-ff4996|dense|{target_index}|{i}|{j} reduced modulo 61.
      If its initial_nnz is not strictly greater than the Semaev
      initial_nnz, redraw once with the suffix |retry on that string.
      If the redraw still fails the inequality, the draw is void.
      Eliminate with the same algorithm.
    ratio_tests: >-
      On eight complete targets, sort the support-matched ratios
      peak_nnz(S_3) / peak_nnz(matched) ascending. Compare ratios by
      cross-multiplication. Break ties by target_index ascending.
      Let a and b be the targets in positions 4 and 5 of that order,
      counting from 1. Let cross = M_b * S_a + M_a * S_b and let
      prod = M_a * M_b, where S is the Semaev peak and M is the
      matched peak. The median is at least 1/2 when cross >= prod,
      at most 2 when cross <= 4 * prod, strictly above 2 when
      cross > 4 * prod, and strictly below 1/2 when cross < prod.
      The same rule with dense peaks D, on the dense-ratio order,
      says the dense median is at most 1/2 when cross_d <= prod_d
      and strictly above 1/2 when cross_d > prod_d. All comparisons
      are exact integer comparisons.
    initial_ratio: >-
      The same median test on peak_nnz(S_3) / initial_nnz(S_3). The
      median is at least 2 when that cross is at least 4 times that
      product. When this holds and the support-matched median lies
      in the closed interval from 1/2 to 2, set initial_retired true.
      The reading row does not change.
    second_build: >-
      A second run of the same elimination recomputes initial_nnz
      and peak_nnz for every scored Semaev matrix. Each integer must
      match the first build. A mismatch voids the cell as an
      instrument failure. It is not a median below 1/2.
    h1_arm: >-
      Draw 20 support-matched systems on the monomial support of the
      first scored target, with coefficients from SHA-256 of
      EXP-SDEG-ff4996|h1|{rep}|{generator}|{monomial_index} reduced
      modulo 60, plus 1. Record their peak_nnz values. Let S be the
      sum of the 4th and 5th Semaev peaks in ascending order, and let
      R be the sum of the 10th and 11th of these twenty peaks. HEUR-1
      fails when R > 2 * S or S > 2 * R. Record the failure beside
      the reading row. It does not change the row.
    split: >-
      When the eight scored targets contain at least four hits and
      four misses, repeat the two median tests inside each class and
      record them. The primary row still uses the pooled eight. When
      either class has fewer than four, record split_reported false.
      That is not incomplete.

  controls:
    - id: support-matched
      statement: >-
        One support-matched system per scored target, same monomial
        support, fresh nonzero coefficients. The primary separator
        is the median peak ratio against this arm.
    - id: dense-matrix
      statement: >-
        One dense matrix per scored target, same rows and columns,
        no forced zero. Its initial_nnz must exceed the Semaev
        initial_nnz. The sparse-memory reading requires the median
        peak ratio against this arm to be at most 1/2.
    - id: second-build
      statement: >-
        The second elimination of each scored Semaev matrix must
        match initial_nnz and peak_nnz. A mismatch voids the cell.
    - id: h1-tail
      statement: >-
        Twenty support-matched systems on the first target's support.
        The tail statistic is the maximum of those twenty peaks
        divided by their median. HEUR-1 fails when their median lies
        outside a factor of 2 of the Semaev median. The failure is
        recorded and is not the concrete negative.

  independent_variables:
    - target draw index
    - class in {hit, miss}, recorded and not used by the primary median
    - arm in {S_3, support-matched, dense, h1}
    - solver build in {first, second} on the Semaev matrices

  metrics:
    primary:
      - id: median_ratios
        statement: >-
          The integer tests for the support-matched median against
          1/2 and against 2, and for the dense median against 1/2,
          on the eight complete targets.
    secondary:
      - id: class_counts
        statement: hit count and miss count among the eight targets
      - id: initial_ratio
        statement: >-
          Whether the median of peak_nnz / initial_nnz on the Semaev
          arm is at least 2, and the flag initial_retired
      - id: h1_factor
        statement: >-
          Whether the twenty-system median lies within a factor of 2
          of the Semaev median, and the maximum of the twenty divided
          by that twenty-system median
      - id: audit_match
        statement: >-
          Whether every scored Semaev initial_nnz and peak_nnz matches
          across the two builds
      - id: split_ratios
        statement: >-
          The same two median tests inside each class, when both
          classes have at least four members

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 says twenty support-matched peaks and the eight Semaev
    peaks share a median up to a factor of 2. The source idea's
    prediction is the paired per-target median, which can succeed
    on a target-by-target ratio while HEUR-1 fails on the unpaired
    twenty. Record that failure. Do not relabel the reading row
    because of it.

  preregistered_prediction:
    quantity: >-
      Median over eight F_61 targets of peak_nnz(S_3) /
      peak_nnz(support-matched), and median of peak_nnz(S_3) /
      peak_nnz(dense).
    formula: >-
      Support-matched median in the closed interval from 1/2 to 2,
      or strictly above 2, and dense median at most 1/2. The
      concrete negative is a finished support-matched median
      strictly below 1/2. A finished dense median strictly above
      1/2, with the support-matched median at least 1/2, is the
      other named negative. Source idea IDEA-20261006-6bb2ec,
      prediction minimum_effect.
    source: >-
      IDEA-20261006-6bb2ec. KR-IC-5a43e5 supplies the degree pattern
      and was opened. It does not predict either ratio. The explicit
      polynomial was opened in v1_blind_rederive.py.

  scale_relevance:
    tier: toy
    justification: >-
      The single prime 61 and B = 8 only. No transfer to
      cryptographic p, to larger B, or to S_4 is assumed. A
      factor-of-two matrix count here is a toy memory coordinate.
    correspondence: null

  tail_checks:
    - >-
      On the twenty support-matched systems, record the maximum
      peak_nnz divided by the median of those twenty.
    - >-
      Record the eight Semaev peak_nnz values and the eight
      initial_nnz values, so a median carried by one target is
      visible.

  replication:
    seeds:
      - EXP-SDEG-ff4996|base|0|{k}
      - EXP-SDEG-ff4996|target|{j}
      - EXP-SDEG-ff4996|matched|{target_index}|{generator}|{monomial_index}
      - EXP-SDEG-ff4996|dense|{target_index}|{i}|{j}
      - EXP-SDEG-ff4996|h1|{rep}|{generator}|{monomial_index}
    independent_instances: 8
    h1_replicates: 20
    note: >-
      Eight is the number of scored targets. Twenty is the HEUR-1
      replicate count. The draw cap of 32 is a frozen scientific
      sample bound. Drawing stops early once eight targets are
      complete.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 8
    maximum_runs: 1
    maximum_workers: 1
    scientific_systems_cap: 124
    budget_note: >-
      One run manifest covers at most 32 target draws, three matrices
      on each draw, 20 HEUR-1 systems, and a second build of 8 Semaev
      matrices. The cap is 124 matrices. The draw stops earlier when
      eight targets are complete. Wall-clock and CPU figures are
      advisory and null. The 8 GB memory figure is machine protection.
      A watchdog expiry is failed_infrastructure, not a median below
      1/2.

  stopping_rules:
    - Stop drawing when eight targets are complete.
    - Stop drawing after 32 attempts even if fewer than eight targets are complete.
    - Stop the run when the draw has stopped, the 20 HEUR-1 systems are scored, and the second build has finished.
    - A timeout on one matrix voids that draw. It does not fill a peak of 0 and it does not stop the other draws.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - A singular model or a trace-zero model that was scored voids the run.
    - A field equation that was included voids the run.
    - A monomial order other than the frozen grevlex voids the run.
    - A second-build mismatch voids the run and is not a median below 1/2.
    - A missing initial_nnz or peak_nnz voids that draw.
    - Fewer than 8 liftable abscissae voids the run and is not a negative.
    - A zero peak on a required arm voids that draw and is not a ratio of 0.
    - A dense initial_nnz that does not exceed the Semaev initial_nnz after the one redraw voids that draw.

  success_criterion: >-
    Eight targets are complete, the second build matches every scored
    Semaev initial_nnz and peak_nnz, the support-matched median is at
    least 1/2, and the dense median is at most 1/2. The closed
    interval from 1/2 to 2 is the support-priced reading. A median
    strictly above 2 is the fill-in reading. Equality with 2 is the
    shared endpoint and is still success. This is the prediction of
    IDEA-20261006-6bb2ec. It is reachable as a failure.

  falsification_criterion: >-
    The eight targets are complete, the second build matches, and the
    support-matched median is strictly below 1/2. That finished ratio
    is the concrete negative: both named readings are false. When the
    support-matched median is at least 1/2 and the dense median is
    strictly above 1/2, the dense-column reading is also a negative.
    Neither outcome is an infrastructure event.

  required_artifacts:
    - experiments/EXP-SDEG-ff4996/runs/RUN-*/manifest.yaml
    - experiments/EXP-SDEG-ff4996/runs/RUN-*/stdout.txt
    - experiments/EXP-SDEG-ff4996/runs/RUN-*/stderr.txt
    - experiments/EXP-SDEG-ff4996/runs/RUN-*/peaks.csv
    - experiments/EXP-SDEG-ff4996/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: support_priced
      when: >-
        eight targets complete, audit matches, prod <= cross < 4 * prod,
        and cross_d <= prod_d
    - id: endpoint_two
      when: >-
        eight targets complete, audit matches, cross = 4 * prod, and
        cross_d <= prod_d
    - id: fill_in
      when: >-
        eight targets complete, audit matches, cross > 4 * prod, and
        cross_d <= prod_d
    - id: extra_sparsity
      when: >-
        eight targets complete, audit matches, and cross < prod
    - id: dense_excess
      when: >-
        eight targets complete, audit matches, cross >= prod, and
        cross_d > prod_d
    - id: incomplete
      when: >-
        fewer than eight complete targets after the draw cap, a
        required transcript is void, or the audit mismatches
  reading_rule: >-
    Name exactly one row. support_priced, endpoint_two, and fill_in
    are the only success rows. extra_sparsity is the concrete
    negative. dense_excess is the other negative named by the source
    idea. incomplete is not evidence about the peak. If extra_sparsity
    and dense_excess could both apply, name extra_sparsity. Record
    both integer crosses, both products, the class counts, the
    initial_retired flag, and the HEUR-1 pass or fail beside the row.
    Those fields do not change the row.
