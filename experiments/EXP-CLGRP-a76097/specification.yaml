experiment:
  id: EXP-CLGRP-a76097
  hypothesis_id: H-CLGRP-ab2748
  derived_from_idea: IDEA-20260809-83cbc7
  question_id: RQ-CLGRP-66ab7f
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    The class-group structural case table - enumerate the sub-cases from the discriminant's
    factorization, construct and composition-verify a witness form for each, and evaluate every
    named countermeasure as a predicate on every cell, against an exhaustive small-discriminant
    baseline and a prime-discriminant control
  objective: >-
    The one uncertainty a run reduces is whether the failure cases of the low-order and
    adaptive-root assumptions in class groups can be enumerated from public data, instantiated
    with explicit witnesses, and checked against every named countermeasure - or whether some
    cell survives. A run establishes, per discriminant in a declared class: the enumerated case
    set predicted from the factorization; the exhaustively computed two-torsion where the
    discriminant is small enough for that; the constructed witness form for each case and its
    order VERIFIED by direct composition; and, per cell, whether each named countermeasure removes
    it, evaluated as a predicate. No group order is computed for any deployed parameter, no
    assumption is broken, and no security verdict is recorded.
  what_this_is_not:
    - >-
      Not an attack and not a break of any assumption. Constructing a witness of small known order
      in a class group whose structure is public is a structural exercise, not a cryptanalytic one.
    - >-
      Not an evaluation of any deployed system or parameter set. A witness is a statement about the
      group, and the deliverable says so in every row.
    - >-
      Not a completeness claim outside the declared discriminant class. Exhaustiveness is asserted
      only where it is checked and the boundary is restated in every deliverable.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
      under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope. At the enumerated discriminants, the structural case set is exactly
      the reported one; each case has the reported constructed witness whose order was verified by
      composition; and each cell is or is not removed by each named countermeasure as that
      countermeasure was written as a predicate. WHAT DOES NOT FOLLOW. No statement that the case
      list is complete outside the declared discriminant class; no statement that a countermeasure
      removing a case here removes it at any larger discriminant; no security claim about any
      deployed hidden-order group; and specifically NOT that a surviving cell, if one appears, is an
      attack on anything - it is an unremoved structural case at the discriminants tested.
  inputs:
    procedure: >-
      STAGE 0, zero compute, ORDERING CONTROL. Declare and hash the discriminant class over which
      exhaustiveness will be claimed, the enumeration rule, and each countermeasure written as an
      explicit PREDICATE on a witness form. A countermeasure that cannot be written as a predicate is
      recorded NOT EVALUABLE at this stage, before any cell is seen, so it cannot later be treated as
      a passing column.
      STAGE 1, seconds, HARD GATE. Known-answer tests for form composition and reduction on
      discriminants whose class group structure is computable by exhaustive reduction. Composition
      must be established correct before any witness order is trusted, because the witness order is
      the only check on the enumeration and a broken composition would make it agree with anything.
      STAGE 2, seconds, BASELINE REPRODUCTION GATE. At every discriminant in the exhaustive
      sub-range, compare the enumeration's predicted case set against the exhaustively computed
      two-torsion as SETS, not counts. A mismatch halts the run.
      STAGE 3, seconds. Across the declared discriminant class spanning varied factorization
      structures, enumerate the cases, construct the explicit witness form per case, and VERIFY each
      order by direct repeated composition. Record predicted and verified orders side by side.
      STAGE 4, seconds. The PRIME-DISCRIMINANT control: at least one prime discriminant, where the
      enumeration must return the minimal case set. Report the case count against the number of
      prime factors across the whole class.
      STAGE 5, seconds. Evaluate every countermeasure predicate on every cell and emit the full
      case-by-countermeasure table, with each cell marked removed, surviving, or not evaluable.
      STAGE 6, zero compute. State the declared class boundary explicitly, report the surviving-cell
      count, and - if it is nonzero - flag the surviving cells for independent re-verification before
      any finding is recorded.
    instrument: >-
      Python 3.11 with exact integer arithmetic; no external algebra dependency. A new standalone
      driver under experiments/EXP-CLGRP-a76097/driver/ implements binary quadratic form composition
      and reduction, order verification by repeated composition, ambiguous-form enumeration from the
      discriminant's factorization, exhaustive class group computation for the small sub-range, and
      the countermeasure predicates. Nothing under harness/ is modified. Recorded through
      harness/runner.py.
    parameters: >-
      A declared class of small discriminants spanning factorization structures from prime through
      several prime factors, fixed and hashed at Stage 0. An exhaustive sub-range small enough for
      the whole class group to be computed by reduction. At least one prime discriminant. Countermeasures
      as predicates: working in a quotient; restricting to a subgroup; choosing prime discriminants.
      Each cell keyed by the discriminant divisor generating the ambiguous form together with the
      verified order, never by order alone.
  controls:
    - >-
      COMPOSITION KNOWN-ANSWER TESTS, mandatory and blocking. Order verification is the only check
      on the enumeration, so a composition implementation that is wrong would make the verification
      agree with any prediction. Established before Stage 3 or nothing is trusted.
    - >-
      EXHAUSTIVE BASELINE. At small discriminants the full class group is computed by reduction and
      its two-torsion is compared as a SET against the enumeration's prediction. Count agreement is
      not enough - two distinct case sets can have the same size.
    - >-
      PRIME-DISCRIMINANT CONTROL / NEARBY OBJECT. At a prime discriminant the enumeration must return
      the minimal case set. If it returns the same count as for a highly composite discriminant, it is
      not tracking the factorization and every coverage claim is void.
    - >-
      NULL OBJECT OF THE SAME SHAPE. A form of the SAME discriminant that is NOT ambiguous, run through
      the identical order-verification path. Its verified order must NOT be the small predicted order;
      if the verifier reports small order for a non-ambiguous form, it is reporting a property of the
      code and not of the case.
    - >-
      CELL KEYING BY STRUCTURE, not by order, so two distinct structural cases producing forms of equal
      order do not silently merge into one row and inflate coverage.
    - >-
      COUNTERMEASURE PREDICATES DECLARED FIRST at Stage 0, so no countermeasure can be reinterpreted
      after a surviving cell appears.
  independent_variables:
    - discriminant, spanning factorization structures from prime to several prime factors
    - structural case within a discriminant
    - 'countermeasure: quotient / subgroup restriction / prime discriminant'
    - 'arm: ambiguous witness / non-ambiguous null form'
  metrics:
    primary:
      - >-
        Predicted case set per discriminant, as an explicit set of structural keys. Computed from the
        discriminant's factorization by the declared enumeration rule.
      - >-
        Exhaustively computed two-torsion set per discriminant in the small sub-range, as an explicit
        set. Computed by full class group reduction, independently of the enumeration.
      - >-
        Set agreement between the two, a boolean per discriminant plus the symmetric difference when
        it is not empty.
      - >-
        Verified witness order per cell, an integer, obtained by repeated composition, reported beside
        the enumeration's predicted order.
      - >-
        Cell status per case-by-countermeasure pair, one of removed, surviving, or not_evaluable.
      - >-
        Surviving-cell count, an integer. Zero is the predicted value; any positive value is the
        high-value outcome and triggers independent re-verification.
    secondary:
      - >-
        Case count against number of prime factors of the discriminant, reported as a table, with the
        prime-discriminant row identified.
      - >-
        Null-arm verified order for the non-ambiguous form of the same discriminant.
      - >-
        Count of countermeasures recorded not evaluable at Stage 0, since a non-predicate countermeasure
        is a gap in the table rather than a passing column.
      - >-
        Wall-clock milliseconds per witness construction and per order verification, to substantiate the
        parent proposal's claim that this is cheap.
      - >-
        The declared discriminant class boundary, restated in the deliverable.
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The set agreement between the predicted case set and the exhaustively computed two-torsion; the
      agreement between predicted and composition-verified witness orders; the case count as a function
      of the number of prime factors; and the surviving-cell count.
    formula: >-
      Predicted EXACT set equality at every discriminant in the exhaustive sub-range. Predicted 100
      percent agreement between predicted and verified orders. Predicted case count strictly increasing
      in the number of prime factors and MINIMAL at a prime discriminant, which is why prime
      discriminants are a countermeasure at all. Predicted surviving-cell count exactly zero. Under the
      null that the enumeration is not driven by the factorization, the case count is flat across
      factorization structures and the prime-discriminant control fails.
    source: >-
      Pre-registered in the parent proposal IDEA-20260809-83cbc7, predictions and controls blocks,
      before any run under this contract exists. The genus-theory rule the enumeration implements is
      RECALLED and unread, which is why Stage 2 checks it against exhaustive computation rather than
      trusting it.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at small discriminants because the design's central check - comparing the enumeration
      against an exhaustively computed class group - is only possible where the whole group is
      computable. That overlap IS the design: the enumeration is only ever validated where it can be
      checked. The transfer assumption, that an enumeration rule validated at small discriminants
      continues to hold at larger ones, is a property of the underlying classical theory and is NOT
      established by this run; the contract therefore scopes every claim to the declared discriminant
      class and makes no statement about deployment-sized discriminants.
    correspondence: null
  tail_checks:
    - >-
      Report the symmetric difference, not only a boolean, whenever the predicted and exhaustive case
      sets disagree, since which case was missed is the whole diagnostic content.
    - >-
      Report every cell whose verified order differs from its predicted order, with both forms, since
      one such cell falsifies the enumeration and a summary count would hide which.
    - >-
      Report the discriminant with the largest case count and confirm it has the most prime factors; an
      inversion there means the enumeration is keyed on something other than the factorization.
    - >-
      Report every countermeasure recorded not_evaluable together with the reason, since an unevaluable
      countermeasure silently converts a surviving cell into an empty one.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
    replication_note: >-
      The computation is deterministic given a discriminant, so seeds vary only the order in which
      candidate forms are generated and the choice of non-ambiguous null forms. Identical results across
      seeds is the expected outcome and a difference across seeds is an implementation defect, not
      variance.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 4
    maximum_runs: 8
  stopping_rules:
    - >-
      Halt if the composition known-answer tests fail. No witness order may be trusted and nothing
      downstream is produced.
    - >-
      Halt if the predicted case set differs from the exhaustively computed two-torsion anywhere in the
      small sub-range. The enumeration rule is wrong and larger discriminants are not attempted.
    - >-
      Halt the coverage arm if the prime-discriminant control does not return the minimal case set.
    - >-
      Stop at the declared discriminant class. Extending the class after seeing a surviving cell would
      be a protocol amendment requiring its own record.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop, never
      a negative result, under AGENTS.md rule 5.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure and
      is NEVER negative mathematical evidence.
    - >-
      A run whose countermeasure predicates were written or altered after any cell was evaluated is
      invalid_measurement.
    - >-
      A run whose cells are keyed by order rather than by structural case is invalid_measurement, because
      distinct cases would have merged and the coverage count would be wrong in the safe-looking direction.
    - >-
      A run whose null arm - the non-ambiguous form of the same discriminant - was not executed in the same
      invocation is invalid_measurement.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT experiment and requires a new
      contract; it is never a repair of this one.
  success_criterion: >-
    The run is successful when the composition known-answer tests pass, the predicted and exhaustive case
    sets are compared as sets at every discriminant in the small sub-range with any symmetric difference
    reported, every enumerated case carries a constructed witness whose order is reported both as predicted
    and as composition-verified, the case count against number of prime factors is reported with the
    prime-discriminant row identified, and the full case-by-countermeasure table is emitted with every cell
    marked removed, surviving or not_evaluable and with the declared class boundary restated. Success means
    a DECIDABLE run. H-CLGRP-ab2748 is confirmed only if, in addition, set equality holds everywhere,
    verified orders agree with predictions in 100 percent of cells, the prime discriminant is minimal, and
    the surviving-cell count is zero.
  falsification_criterion:
    - >-
      Any composition-verified witness order differs from its predicted order. Limb G2 is FALSE; the
      enumeration as instantiated is wrong, no table is emitted, and the disagreement is the reported result.
    - >-
      The predicted case set differs from the exhaustively computed two-torsion at any small discriminant.
      Limb G1 is FALSE; the enumeration rule is wrong.
    - >-
      The case count does not increase with the number of prime factors, or the prime discriminant is not
      minimal. The enumeration is not tracking the factorization; the run set is VOID and no coverage claim
      is available.
    - >-
      The null arm - a non-ambiguous form of the same discriminant - is reported with the small predicted
      order. The order verifier is reporting a property of the code rather than of the case; the run set is
      VOID.
    - >-
      At least one cell survives every named countermeasure. Limb G3 is FALSE. This is the HIGH-VALUE
      outcome, is recorded only after independent re-verification with the surviving witness archived, and
      is stated as a structural statement at the discriminants tested rather than as a break of anything.
    - >-
      Exhaustiveness cannot be established within the declared class. Limb G1's completeness limb is
      UNRESOLVED; the table is emitted as explicitly partial with its boundary stated, and no coverage claim
      is made over the remainder.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model and inference block,
      and environment.
    - >-
      The Stage 0 hash of the declared discriminant class, the enumeration rule, and every countermeasure
      predicate, written before any measurement.
    - >-
      raw-result.json carrying every discriminant, predicted case set, exhaustive case set, constructed
      witness form, predicted order and verified order, not summaries.
    - >-
      The full case-by-countermeasure table with every cell marked removed, surviving or not_evaluable.
    - >-
      Every surviving cell's witness form in a form that permits independent re-verification without rerunning
      this driver.
    - >-
      The null-arm measurements, in the same file as the signal arm.
    - >-
      The composition known-answer test transcript.
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution, and under this engagement approval is the USER's
      gate because it authorizes execution and spends compute. This contract is review_required and is NOT
      approved; approved_by is null and execution_authorized is false.
    - >-
      The countermeasure predicates must be fixed at approval time. A countermeasure left in prose until run
      time can absorb any witness, which would make the coverage claim unfalsifiable - the single most likely
      way this contract silently becomes a claim.
    - >-
      If any cell survives, the result must go to independent re-verification BEFORE any evidence or decision
      record cites it. The parent proposal itself requires this and it is carried here as a gate.
  derivation_provenance:
    tool: coordinator subagent, design-experiment step
    source_record: IDEA-20260809-83cbc7
    authored_at: '2026-08-25'
    note: >-
      The enumeration-from-factorization claim, the constructed-witness requirement, the order-verification
      control, the prime-discriminant control and the surviving-cell criterion come from the parent proposal's
      claim, predictions and controls blocks. The exhaustive small-discriminant baseline gate, the requirement
      to compare case SETS rather than counts, the non-ambiguous null form, the structural cell keying and the
      not_evaluable countermeasure status are coordinator additions made so that the coverage claim is
      decidable and cannot be inflated by merged cases or prose countermeasures. Budgets come from the parent's
      declared small implementation and negligible compute.
  derivation_gaps:
    - >-
      The genus-theory enumeration rule is RECALLED and unread in the parent proposal. This contract does not
      resolve that - it checks the rule against exhaustive computation at small discriminants instead, which is
      a weaker but executable substitute. A run that disagrees at Stage 2 cannot say whether the rule or the
      implementation is wrong without a source.
    - >-
      The countermeasure list is taken from the parent proposal and is not established to be the complete set
      of deployed countermeasures. The table's columns are therefore what was named, not what exists, and the
      deliverable must say so.
    - >-
      The declared discriminant class is not supplied by the parent and must be fixed by a Coordinator before
      approval. Choosing it after seeing where a cell survives would make the completeness claim meaningless.
    - >-
      Whether the exhaustive sub-range is large enough to exercise discriminants with several prime factors is
      unverified at authoring time. If it is not, the baseline gate validates the enumeration only in the
      few-factor regime and the contract must report that restriction rather than a general validation.
