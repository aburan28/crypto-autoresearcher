    composing_decision: DEC-20261001-3ca1f8
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Does NOT claim a break, factor base,
      or rho competitiveness. Structural certificate column only.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stage 0 cyclotomic census + Phi_130(2) valuation; Stage 1 n=17 Lemma L
      toy with nulls; Stage 2 n=131 T_0 prediction + analytic unknowns/slot.
      No curve ECDLP runs. No Amazon Bedrock.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    (A) Enumerate {k<=20000: 131|Phi_k(2)} and confirm {130,17030} with
    phi 48, 6240; modulus-swap p=17 → {8,136,2312}.
    (B) Compute Phi_130(2), verify 409368176241571 = 131×3124947910241
    with v_131=1 and 2^65+1 cross-check.
    (C) Run n=17 Lemma L toy: dim=8, Frobenius-stable, equals ker m_t(sigma);
    random-b null unstable >=9/10; order-15 null reported; basis-relabel OK.
    (D) Run n=131 instance: dim=130 equals T_0; record analytic
    unknowns/slot 17030 vs 131; decide outcomes A/B/C from frozen rules.

  class: measurement
  class_note: >-
    Structural-certificate / arithmetic measurement. Not a smoothness
    heuristic-validation CDF experiment and not a cryptanalytic cost-model.
    Measured field/cyclotomic quantities stay separate from HEUR-H1 null
    probability. No exponent-moving claim.

  scope:
    included:
      - >-
        Stage 0: cyclotomic-divisor-set.yaml (expect {130,17030});
        phi-values.yaml (48, 6240); Phi_130_factorisation.yaml
        (value, cofactor, v_131=1, 2^65+1 check); modulus-swap-p17.yaml
        ({8,136,2312}); preregistered-predictions.yaml BEFORE Stage 1/2
        claims; methodological-note.md (no curve ECDLP; certificate.kind=none).
      - >-
        Stage 1: implement torus_row.py n=17 toy; report dim, stability,
        equality with ker m_t(sigma) for both Phi_17 factors; 10 random-b
        nulls; 10 order-15 nulls; basis-relabel invariance; seeds recorded.
      - >-
        Stage 2: n=131 instance predicting dim=130=T_0; analytic
        unknowns-per-slot comparison (>=17030 vs 131); optional composite-
        field path for F_(2^17030); write stage2 report.
    excluded:
      - Any scientific ECDLP / GHS / decomposition attack at n >= 131
      - Claiming a break or any curve's attack cost
      - Claiming Couveignes–Lercier primary text was read
      - AUXIN edits
      - Amazon Bedrock
      - Treating timeout/OOM as outcome A/B/C
      - Editing IDEA-20260926-6f2601 claim text

  inputs:
    proposal: ledger/proposals/IDEA-20260926-6f2601.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-41d8b2.yaml
    open_problem: knowledge/open-problems/KN-OPEN-095df5.md
    four_subspace_proposal: ledger/proposals/IDEA-20260918-9abf42.yaml
    orbit_union_finding: knowledge/findings/KN-FIND-47da4e.md
    ggmp_literature: knowledge/literature/KN-LIT-0d9d28.md
    optional_gf2n: experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
    related:
      - AV census companion (date-token 20260926-5c26f9) — interpretation limit only
      - toy-moduli companion (date-token 20260926-80209d) — unrelated instrument
    cells:
      Stage0-cyclotomic:
        p: 131
        a: 2
        k_max: 20000
        expected_k_set: [130, 17030]
        expected_phi: [48, 6240]
        expected_Phi_130: 409368176241571
        expected_cofactor: 3124947910241
        expected_v_131: 1
        modulus_swap_p17_expected: [8, 136, 2312]
      Stage1-toy-n17:
        n: 17
        ord_n_2: 8
        ambient_bits: 136
        predicted_dim: 8
        predicted_stable: true
        random_b_trials: 10
        order15_trials: 10
        stable_subset_sum_dims: [0, 1, 8, 9, 16, 17]
      Stage2-n131:
        n: 131
        ord_n_2: 130
        ambient_bits: 17030
        predicted_dim: 130
        predicted_equals: T_0
        analytic_unknowns_per_slot_lower: 17030
        onehot_bits: 131

  controls:
    - name: modulus_swap_p17
      object: >-
        Same Stage-0 script with 131 replaced by 17 must return
        {8,136,2312} for k<=20000 (ord_17(2)=8).
    - name: random_b_null
      object: >-
        Random b in F_(2^136)^* without torsor relation predicted NOT
        Frobenius-stable in >=9 of 10 trials (HEUR-H1 calibration).
    - name: order15_null
      object: >-
        t of order 15 (not prime order n) as hypothesis check; report
        stability/dim without claiming Lemma L on that fibre.
    - name: basis_relabel
      object: >-
        Change of F_2-basis of F_(2^17) leaves dim and stability unchanged.
    - name: phi130_crosscheck
      object: >-
        Phi_130(2) equals (2^65+1)/(8193×11) = 409368176241571.
    - name: certificate_kind_vocabulary
      object: >-
        Every run manifest result.certificate.kind is one of
        discrete_log | decomposition | key_recovery | none.
    - name: no_break_guard
      object: No break / attack-cost / ECC2K-130 claim.

  independent_variables:
    - modulus_p
    - k_max
    - toy_n
    - target_n
    - null_kind  # torsor | random_b | order15
    - field_impl  # gf2n_reuse | self_contained | composite_field

  metrics:
    primary:
      - cyclotomic_k_set
      - phi_values
      - v_131_Phi_130
      - toy_n17_dim
      - toy_n17_frobenius_stable
      - toy_n17_equals_ker_mt
      - random_b_stable_count
      - n131_dim
      - n131_equals_T0
    secondary:
      - wall_s
      - peak_rss_bytes
      - field_impl_used
      - basis_relabel_invariant
      - analytic_unknowns_per_slot
      - termination_reason

  heuristic_under_test:
    - HEUR-BINSTD-41d8b2-H0
    - HEUR-BINSTD-41d8b2-H1

  preregistered_prediction:
    quantity: >-
      (A) {k<=20000: 131|Phi_k(2)} = {130,17030}; phi 48, 6240.
      (B) Phi_130(2)=409368176241571; v_131=1; cofactor 3124947910241.
      (C) n=17: dim=8, stable, equals ker m_t(sigma); random-b stable
      count <=1/10.
      (D) n=131: dim=130 equals T_0.
      (E) Analytic unknowns/slot >=17030 vs 131 one-hot bits.
    formula: >-
      Phi_k(2)=∏_{d|k}(2^d-1)^{μ(k/d)}; p|Phi_k(a)⇔k=p^j ord_p(a) (recalled,
      tested); Lemma L: tau_t-stable W ⇒ Frobenius-stable ev_b(W);
      deg-1 on Res ⇒ T_0 at n=131.
    source: >-
      IDEA-20260926-6f2601 Parts 1–4; IDEA-20260918-9abf42; KN-OPEN-095df5;
      H-BINSTD-41d8b2.
    claim_tier: observational
    measured_vs_modeled: >-
      Cyclotomic sets, valuations, dimensions, stability flags, null counts,
      wall_s, and peak_rss are MEASURED. HEUR-H1 2^-8 stability cap and the
      analytic 17030 unknowns/slot rank count are MODELED/analytic priors —
      never written into a measured column as if observed from a solver run.
      Timeout is infrastructure, not a measured exclusion or certificate.

  scale_relevance:
    tier: medium
    justification: >-
      Exact arithmetic at the cryptographic extension degree n=131 for the
      cyclotomic/Lemma-L certificate, with a near-zero-run toy at n=17.
      Not a curve attack; contribution is a structural certificate column.
    correspondence: >-
      Direct finite-field / cyclotomic computation; no Deuring sampling.
      F_(2^17030) may be realised as the composite F_(2^130)·F_(2^131).

  tail_checks:
    - Any unexpected k with 131|Phi_k(2) inspected for Moebius/bug before C.
    - Any stable random-b image inspected for accidental torsor relation.
    - Both irreducible factors of Phi_17 checked for ker equality.
    - If Stage 2 OOM, record infrastructure — do not invent dim=130.

  replication:
    seeds: [20261001, 20261002]
    independent_instances: >-
      Deterministic cyclotomic Stage 0 (seed-free). Stage 1 nulls use two
      seeds; basis-relabel is an independent invariance replication.
      Modulus-swap p=17 is a nearby-object replication of Stage 0 logic.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 8
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete when cyclotomic set, Phi_130 factorisation, modulus-swap, predictions, and methodological note are written.
    - Stage 1 complete when toy report + null counts + basis-relabel are written — OR infrastructure failure recorded.
    - Stage 2 complete when n=131 dim/T_0 report and analytic unknowns comparison are written — OR infrastructure failure recorded.
    - Advisory wall-clock: checkpoint and report; never fabricate A/B/C.

  invalidation_rules:
    - Claiming outcome A with Stage 0/1/2 mismatch to preregistered quantities
    - timeout/crash/OOM → failed_infrastructure, not negative math evidence
    - Amazon Bedrock invocation attempted → abort
    - certificate.kind outside vocabulary → invalid run
    - Claiming Couveignes–Lercier primary text was read when it was not
    - Editing source IDEA claim text

  success_criterion: >-
    Stage 0: set {130,17030}, valuation 1, modulus-swap match committed.
    Stage 1: toy dim/stability/ker equality and null counts reported —
    deciding A vs B from predefined rules when Stages 0–2 complete.
    Stage 2: n=131 dim and T_0 equality reported (or infrastructure).
    Decidable without attack runs.

  falsification_criterion: >-
    Outcome C (phi(k)<48); OR outcome B (toy fails stability/dim);
    OR n=131 dim ≠ 130 when Stage 2 completes validly.
    Timeout is NOT falsification of the certificate.

  required_artifacts:
    - experiments/EXP-BINSTD-f14cbb/stage0/cyclotomic-divisor-set.yaml
    - experiments/EXP-BINSTD-f14cbb/stage0/phi-values.yaml
    - experiments/EXP-BINSTD-f14cbb/stage0/Phi_130_factorisation.yaml
    - experiments/EXP-BINSTD-f14cbb/stage0/modulus-swap-p17.yaml
    - experiments/EXP-BINSTD-f14cbb/stage0/preregistered-predictions.yaml
    - experiments/EXP-BINSTD-f14cbb/stage0/methodological-note.md
    - experiments/EXP-BINSTD-f14cbb/stage1/lemma-L-toy-n17.yaml
    - experiments/EXP-BINSTD-f14cbb/stage1/nulls-random-b.yaml
    - experiments/EXP-BINSTD-f14cbb/stage1/nulls-order15.yaml
    - experiments/EXP-BINSTD-f14cbb/stage1/basis-relabel.yaml
    - experiments/EXP-BINSTD-f14cbb/stage2/lemma-L-n131.yaml
    - experiments/EXP-BINSTD-f14cbb/stage2/unknowns-per-slot.yaml
    - experiments/EXP-BINSTD-f14cbb/runs/*/manifest.yaml
    - experiments/EXP-BINSTD-f14cbb/runs/*/raw-result.json
    - experiments/EXP-BINSTD-f14cbb/runs/*/stdout.log

  procedure:
    stage0:
      - Implement Moebius product for Phi_k(2); scan k<=20000 for 131|Phi_k(2).
      - Write cyclotomic-divisor-set.yaml and phi-values.yaml.
      - Factor Phi_130(2); write Phi_130_factorisation.yaml with 2^65+1 check.
      - Run modulus-swap p=17; write modulus-swap-p17.yaml.
      - Write preregistered-predictions.yaml BEFORE Stage 1/2 outcome claims.
      - Write methodological-note.md (no ECDLP; certificate.kind=none; Bedrock ban).
    stage1:
      - Implement n=17 torsor fibre solve b^(2^120-1)=t in F_(2^136)^*.
      - Compute V={Tr_(F_(2^136)/F_(2^17))(c b): c in F_(2^8)}; report dim/stability/ker.
      - Run 10 random-b and 10 order-15 nulls; write null YAMLs.
      - Basis-relabel control; write basis-relabel.yaml.
    stage2:
      - n=131 instance (composite-field allowed); predict dim=130=T_0.
      - Write lemma-L-n131.yaml and analytic unknowns-per-slot.yaml.
      - On OOM/timeout: termination_reason=failed_infrastructure; do not invent A.

  optimistic_assumptions:
    - assumption: >-
        F_(2^17030) Stage 2 finishes within advisory 2h via composite-field
        arithmetic without storing dense 17030-bit intermediates everywhere
      bias_direction: >-
        Underestimates wall-clock / memory if naive GF(2^n) is used;
        mitigated by advisory budget + composite-field amendment path —
        never by claiming A on timeout
    - assumption: >-
        Recalled cyclotomic-divisor lemma holds on k<=20000 (operationally tested)
      bias_direction: >-
        If wrong, Stage 0 produces outcome C rather than silent A

  memory_accounting: >-
    Dominant structures: cyclotomic integers (small), F_(2^136) elements for
    Stage 1, and composite-field / sparse representation for Stage 2.
    Expected peak RSS under 4 GiB if composite-field is used; report measured
    peak_rss_bytes. No attack-scale table memory. Naive dense F_(2^17030)
    bitvectors are out of budget — use composite field or record infrastructure.

  assigned_to: executor
  dominated_by: >-
    KN-FIND-47da4e orbit-union parameterisation dominates the torus
    description on unknowns for the same set; matched rho on ECC2K-130
    unaffected. Certificate column only.
  sota_delta:
