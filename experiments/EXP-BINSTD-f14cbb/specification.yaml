    memory: Unchanged for attack surfaces.
    data_queries: N/A; prices KN-OPEN-095df5 torus row with exact numbers.
  impediments_declared:
    - id: IMP-F2-17030-arith
      what_is_blocked: >-
        Completion of Stage 2 n=131 image measurement within advisory
        wall-clock/memory if naive field arithmetic is used
      condition: >-
        Peak RSS projects >4 GiB or wall-clock >7200s on Stage 2
      clears_when: >-
        Composite-field path implemented and documented, OR
        protocol_amendment accepts analytic-only Stage 2 with Stage 1 as
        the sole empirical Lemma L check, OR longer advisory budget accepted
      recheck: >-
        Inspect stage2 termination_reason and peak_rss_bytes
      asserts_nothing_about: >-
        Correctness of Lemma L or Part 1; infrastructure ≠ outcome B/C
    - id: IMP-CL-primary-unread
      what_is_blocked: >-
        Placing Couveignes–Lercier's torus smoothness basis exactly as
        ev_b(W) vs non-stable orbit-union form
      condition: Couveignes–Lercier primary text not read in this program
      clears_when: >-
        A retrieved citation with verified_by after an agent reads the paper
      recheck: Search corpus for Couveignes–Lercier retrieved provenance
      asserts_nothing_about: >-
