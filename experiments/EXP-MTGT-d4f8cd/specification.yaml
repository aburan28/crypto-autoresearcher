experiment:
  id: EXP-MTGT-d4f8cd
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-406fef
  question_id: RQ-MTGT-2cabee
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE CORRECT MULTI-TARGET BASELINE, AND WHY THE ISOGENY CLASS EXACTLY TIES IT AND CANNOT
    BEAT IT: transport reduces "M targets spread over M classmates" to "M targets on one curve", turning
    the naive M*sqrt(N) into Kuhn-Struik''s sqrt(M*N) -- an improvement of sqrt(M) over the WRONG
    baseline and of exactly ZERO over the right one -- after which the class is fully consumed and
    Yun''s tight generic Theta(sqrt(M*N)) bound applies unchanged; the live and UNPLOTTED question
    this exposes is the single-curve PREPROCESSING-times- MULTI-TARGET frontier, where a store-growth
    argument gives M^{1/2}*N^{1/3} time at M*N^{1/3} memory and the class contributes nothing at all'
  status: draft
  objective: "(A) THE BASELINE MOST AMORTISATION CLAIMS GET WRONG. Solving M discrete logs in one\
    \ group of order N does NOT cost M*sqrt(N). Kuhn-Struik-style multi-target rho shares one distinguished-point\
    \ store across all M walks and costs ~sqrt(M*N) in total, i.e. ~sqrt(N/M) per target, which DECREASES\
    \ in M. The corpus records this baseline explicitly: analysis/o2-sum-compatible-filters/claim_a_adjudication.md\
    \ carries the Kuhn-Struik reference as verified (2026-08-01) and uses sqrt(T*N) as the comparison\
    \ column, and its section 3 Attack 5 records the exact failure mode this record is written to\
    \ prevent -- IDEA-20260731-010's headline (\"amortised per-target exponent falls below 1/2\")\
    \ was judged \"true and uninteresting\" because its baseline was 0.886*sqrt(N) single-target rho\
    \ rather than Kuhn-Struik. KN-LIT-4091 further reports a TIGHT GENERIC LOWER BOUND of the same\
    \ order for the multiple-discrete-logarithm problem, so sqrt(M*N) is a floor for generic methods\
    \ and not merely the best known algorithm. ANY L13 AMORTISATION CLAIM MUST BE SCORED AGAINST sqrt(M*N).\n\
    (B) WHAT TRANSPORT ACTUALLY DOES TO THE MULTI-TARGET PROBLEM, STATED AS A REDUCTION. Kuhn-Struik's\
    \ sharing requires all M targets IN ONE GROUP: the shared object is a distinguished-point store,\
    \ and a stored DP on E_i is meaningless for a walk on E_j because the walks are in different groups\
    \ with different encodings. So if the M targets are spread one per classmate, Kuhn-Struik does\
    \ NOT apply as stated and the naive cost is M*sqrt(N). Transport repairs exactly that: by T1 applied\
    \ to the dual isogeny, the instance (E_j, P_j, Q_j) pulls back to (E_1, phi-hat(P_j), phi-hat(Q_j))\
    \ with THE SAME k, at a cost of two isogeny evaluations. Pull all M targets back and run one Kuhn-Struik\
    \ computation on E_1. Total:\n    C_class = sqrt(M*N) group operations + M*(C_build/M + 2*c_eval)\
    \ field ops\n            = sqrt(M*N) + O(L*ell^3) + 12*M*L*ell,\nwhere the isogeny construction\
    \ is amortised over all targets sharing a path. THE REDUCTION IS EXACT AND THE CONCLUSION IS DEFLATIONARY:\n\
    \  versus the WRONG baseline M*sqrt(N): a factor sqrt(M) improvement;\n  versus the RIGHT baseline\
    \ sqrt(M*N): a factor of exactly 1, i.e. NONE.\nThe class does not beat the multi-target frontier.\
    \ It restores access to it.\n(C) WHY IT CANNOT DO BETTER, WHICH IS THE CLOSURE HALF. After the\
    \ pullback, all M targets live in ONE prime-order group G on ONE curve E_1. Every remaining piece\
    \ of isogeny structure acts on G either as a scalar (if it is an endomorphism -- H-ENDO-001) or\
    \ as an isomorphism onto another group whose targets have already been pulled back (IDEA-20260807-5cabfc).\
    \ Neither supplies any information about G beyond the group law, so the post-pullback problem\
    \ is a plain M-instance generic DLP and KN-LIT-4091's tight generic Theta(sqrt(M*N)) applies unchanged.\
    \ THE ISOGENY STRUCTURE IS FULLY CONSUMED BY THE PULLBACK. This is the named obstruction for the\
    \ multi-target half of L13 and it is why the honest headline is a tie.\n(D) THE QUESTION THIS\
    \ EXPOSES, WHICH IS LIVE AND WHICH THIS PROGRAM HAS NEVER PLOTTED. Both baselines above are advice-free.\
    \ The genuinely open comparison is PREPROCESSING TIMES MULTI-TARGET on ONE curve, and it is not\
    \ in the corpus. A store-growth argument -- MY OWN ARITHMETIC, labelled as a heuristic below,\
    \ not a citation -- gives:\n  With a Bernstein-Lange-style store of S known-log distinguished\
    \ points, a\n  single target costs T ~ sqrt(N/S) (this is the S*T^2 ~ N relation). Process\n \
    \ targets in sequence and ADD each walk's distinguished points to the store.\n  After j targets\
    \ the store is ~S + j*T_j, so T_j ~ sqrt(N/(S + j*T_j)).\n  Starting from S = N^{1/3}, T_1 = N^{1/3},\
    \ so the store DOUBLES on the first\n  target; after j targets the store is ~j*N^{1/3} and T_j\
    \ ~ N^{1/3}/sqrt(j).\n  Summing, total time ~ 2*M^{1/2}*N^{1/3} at peak memory ~M*N^{1/3}.\nCompare:\
    \ Kuhn-Struik at M^{1/2}*N^{1/2} with a store of order the same sqrt(M*N)*theta. The preprocessed\
    \ scheme is FASTER by N^{1/6} in time -- which is not a violation of KN-LIT-4091 because that\
    \ bound is for generic algorithms WITHOUT preprocessing, and it is not a violation of Corrigan-Gibbs--Kogan\
    \ because that bound is stated per-target for a single instance. WHETHER A JOINT (S, M, T) LOWER\
    \ BOUND OF THE FORM S*T^2 = Omega~(M*N) OR SIMILAR EXISTS IS [open] IN THIS CORPUS and is the\
    \ single most valuable thing this record could send downstream. CRUCIALLY FOR L13: that entire\
    \ question lives on ONE CURVE. The isogeny class contributes exactly zero to it. So the lane's\
    \ honest position is that its interesting neighbour is a single-curve question it does not own.\n\
    (E) THE MEMORY AXIS, WITHOUT WHICH (D) IS DISHONEST. M^{1/2}*N^{1/3} time at M*N^{1/3} memory\
    \ is not obviously better than M^{1/2}*N^{1/2} time at small memory. Under Wiener full-cost accounting\
    \ (KN-TECH-035, KN-LIT-094), a sqrt(N)-element table gives BSGS a full cost of N^{2/3+o(1)} despite\
    \ N^{1/2} processor steps, precisely because large memory cannot be reached in unit time; parallel\
    \ collision search keeps its advantage because per-processor storage stays small. The same correction\
    \ must be applied here before the N^{1/6} time gap is called an improvement, and this record requires\
    \ that both schemes be plotted in the AT product, not in step counts alone."
  resource_label: 'R8 primary (multi-instance structure: M targets, and the accounting regime that
    makes them cheaper together than apart), R4 (the isogeny graph supplies the pullback that makes
    the M targets co-located).'
  admissibility: admissible
  admissibility_argument: 'The pullback applies phi-hat to points of G_j, which taken alone is exactly
    what the DECOMPOSITION.md section 2 filter closes. It is admissible here for the same reason as
    IDEA-20260807-a127ab and with the same honesty: the advantage is not extracted from phi''s action
    on any single group but from the MODEL, in which M targets initially sit in M distinct encoded
    groups and the isogeny graph identifies those encodings. A generic simulator handed M independent
    encodings cannot manufacture that identification. And -- the honest half -- the admissible resource
    buys exactly a return to the already-known sqrt(M*N), which is why this record''s sota_delta against
    the correct baseline is zero. An admissible resource that recovers the baseline and nothing more
    is the expected outcome and is recorded as such.'
  reachability_gate: 'T5 INSTANTIATED. The pullback requires a path from each target''s curve E_j
    to the chosen hub E_1 -- SPECIFIED endpoints, hence vectorization, hence p^{1/4+o(1)} field operations
    per distinct source curve (see heuristic H1 of IDEA-20260807-a127ab for the argument and its concrete-versus-asymptotic
    split). The gate''s position here is BETTER than in the preprocessing record, for a reason worth
    stating: the multi-target computation already costs sqrt(M*N) >= N^{1/2}, and path-finding costs
    M*p^{1/4+o(1)}, so path-finding is dominated whenever M*p^{1/4} < sqrt(M*N), i.e. whenever M <
    N^{1/2} -- which is every regime in which the multi-target problem is even posed. THE GATE IS
    NOT BINDING FOR THIS RECORD, asymptotically or concretely, which is the opposite of the preprocessing
    case and is a genuine structural difference between the two halves of L13. At toy scale the class
    is fully enumerable and paths are found by breadth-first search.'
  inputs:
    procedure: 'STAGE 0 (zero compute): the reduction in (B) and the closure argument in (C), written
      out. If a reviewer breaks (C), the lane has a target and the experiment changes. STAGE 1 (minutes,
      THE CHEAPEST VALID DISCRIMINATOR): Step 1''s same-curve M ladder at one toy prime. Fitting 0.5
      +/- 0.05 versus 1.0 settles in seconds whether the harness has the right baseline at all, and
      a program that cannot reproduce sqrt(M*N) has no business scoring an amortisation claim. STAGE
      2 (minutes): Step 3, the failed direction. Cross-curve store sharing must produce chance collisions.
      STAGE 3 (low hours): Steps 2, 4, 5 -- the full three-way comparison and the mu decay sweep.
      STAGE 4 (hours): Step 6''s S sweep and Step 7''s AT accounting.'
    mechanism: 'STEP 1 -- IMPLEMENT THE RIGHT BASELINE FIRST. Build multi-target rho with a shared
      distinguished-point store on ONE toy curve and verify empirically that total cost scales as
      sqrt(M*N) and not as M*sqrt(N), across M in {1, 2, 4, 8, 16, 32}. Fit the exponent of M; require
      0.5 +/- 0.05. Without this the lane has no correct baseline and every later comparison is void.
      STEP 2 -- THE NAIVE CROSS-CURVE COST. Place one target on each of M classmates. Run per-curve
      single-target rho. Record M*sqrt(N). STEP 3 -- THE FAILED DIRECTION, MEASURED ON PURPOSE. Attempt
      to share a distinguished-point store ACROSS curves without transport: build the store on E_1
      and let walks on E_j test membership against it. Predicted: zero useful collisions beyond chance.
      This is the measurement that shows WHY the reduction must move targets and not stores, and it
      is cheap. STEP 4 -- THE PULLBACK. Transport all M targets to E_1 by certified dual isogenies
      (certificates per IDEA-20260807-0e8977) and run one Kuhn-Struik computation. Record group operations,
      field operations for the pullback, and peak store size, separately. STEP 5 -- THE COMPARISON.
      Plot Step 2, Step 4 and the Step 1 same-curve baseline together against M. Predicted: Step 4
      lies ON the Step 1 curve plus an additive pullback term, and BELOW Step 2 by sqrt(M). STEP 6
      -- THE PREPROCESSED VARIANT OF (D). Seed the store with S known-log distinguished points before
      processing targets, sweep S in {0, N^{1/4}, N^{1/3}, N^{2/5}}, and fit total time against M
      and S. Test the store-growth prediction total ~ 2*M^{1/2}*N^{1/3} at S = N^{1/3}. Report peak
      memory for every cell. STEP 7 -- AT ACCOUNTING. Recompute every comparison as an area-time product
      with the store charged as occupied hardware (KN-TECH-035) and report whether any time advantage
      survives.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - matched single-target rho at M = 1 (baseline reproduction)
  - cross-curve store sharing without transport (the failed direction)
  - M curves of the same order in different classes (nearby-object control)
  - randomly populated store of identical size
  - mu decay sweep between the two baselines
  - certificates on every recovered k against the ORIGINAL instance
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. THE NULL FOR "TRANSPORT ENABLED THE
    SHARING" IS STEP 3: the identical multi-target computation with the M targets left on their own
    curves and the store shared anyway. Under the null the cross-curve collision rate must equal chance,
    and the total cost must revert to M*sqrt(N). SECOND NULL: M targets placed on M curves of the
    same order N but in DIFFERENT isogeny classes, where no pullback exists -- cost must be M*sqrt(N)
    with no arm able to improve it. THIRD NULL, for the store itself: a randomly populated store of
    identical size, which must produce no useful collisions. DECAY PARAMETER: mu, the fraction of
    the M targets that are actually pulled back (the remainder left in place). Total cost must interpolate
    between sqrt(M*N) at mu = 1 and M*sqrt(N) at mu = 0, and specifically must behave as sqrt(mu*M*N)
    + (1-mu)*M*sqrt(N). A total cost that fails to rise as mu falls means the measured saving is not
    coming from the pullback and the run set is void.'
  independent_variables: []
  metrics:
    primary:
    - total and per-target group operations per arm per M
    - field operations for pullback, counted separately from group operations
    - peak store size in entries and bytes, per arm
    - fitted exponent of M with confidence interval, per arm
    secondary:
    - AT product per arm per cell
    - collision counts in the failed-direction arm against the chance rate
    - wall clock and peak memory per run
  heuristic_under_test: null
  preregistered_prediction:
    quantity: fitted exponent of M in same-curve multi-target rho total cost
    formula: 0.50 +/- 0.05 over M in {1..32}. Outside that band the baseline implementation is wrong
      and nothing downstream may be compared to it.
    source: pre-registered in IDEA-20260807-406fef before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - SMALL-M INDISTINGUISHABILITY. At M = 4, sqrt(M*N) and M*sqrt(N) differ by only a factor 2. The
    full ladder to M = 32 and enough seeds are required or the two hypotheses are not separable.
  - DISTINGUISHED-POINT RATE. The store's growth and the collision rate both depend on theta, the
    DP rate. theta must be frozen before Stage 1 and held identical across arms; a per-arm theta silently
    changes the memory axis.
  - FRUITLESS CYCLES under negation. Negation-based speedups introduce fruitless cycles whose handling
    differs between single- and multi-target walks. Either use negation everywhere or nowhere, declared
    in advance.
  - PULLBACK OVERHEAD AT TOY SCALE. O(L*ell^3) field operations is negligible at p = 2^{256} and NOT
    negligible at p = 2^{16}. Toy measurements will show the transported arm losing on absolute cost;
    that is a scale artifact and must not be reported as a finding about the reduction.
  - Group operations versus field operations. As in IDEA-20260807-a127ab, a measured per-machine conversion
    factor is required and every conclusion must survive a factor-2 perturbation of it.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 0.50 +/- 0.05 over M in {1..32}. Outside that band the baseline implementation
    is wrong and nothing downstream may be compared to it.
  falsification_criterion:
  - The same-curve multi-target fit is not 0.5 +/- 0.05. The baseline is wrong and the record's entire
    comparison is void until it is fixed. This is an instrument outcome, not a mathematical one.
  - The transported cross-curve arm beats the same-curve arm by more than 10%. Section (C) is false,
    the class supplies post-pullback structure, and the result requires review-breakthrough review
    (AGENTS.md rule 12).
  - Cross-curve store sharing produces above-chance collisions without transport. Contradicts the
    Class II analysis; requires replication before any interpretation.
  - The mu sweep does not interpolate between sqrt(M*N) and M*sqrt(N). The measured saving is not
    attributable to the pullback and the arm is void.
  - The preprocessed scheme's M-dependence fits M^{1/2}*N^{1/2} rather than M^{1/2}*N^{1/3}. Heuristic
    H1 (store growth) is refuted; section (D)'s open question changes shape and the record says so
    rather than retro-fitting.
  - Budget exhaustion before the M ladder completes. INFRASTRUCTURE outcome (AGENTS.md rule 5); not
    evidence about any baseline.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
