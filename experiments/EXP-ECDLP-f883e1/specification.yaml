    residue of affine y calibrator.

  objective: >
    Evaluate the exact identity that on
    p=19, A=1, B=-1, P=(2,3) one has
    [2]P=(16,11), chi_3(y)=7 and
    chi_3(y')=1, and rejects the nearby
    invariance claim that chi_3(y')=7,
    on one frozen family (REAL, KF,
    NULL). Stage 0 does not form a real
    Gamma orbit, does not run a unary-
    closure census, does not run Miller
    or Tate, and does not authorize
    Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL has
      chi_3(y)=7, chi_3(y')=1; KF
      invariance claim rejected
      because chi_3(y')=1; NULL empty
      character rejected; y=0
      rejected as the zero fibre.
      Certificate kind none.
    formula: >
      Affine doubling then u^6.
      REAL: P=(2,3), [2]P=(16,11),
      chi_3(y)=7, chi_3(y')=1.
      KF: claim chi_3(y')=7, actual 1,
      rejected as a generic
      doubling-character target.
    claim_tier: observational

  inputs:
    fixture:
      real_curve:
        p: 19
        A: 1
        B: -1
        P: [2, 3]
        P2: [16, 11]
        must_chi: 7
        must_chi_prime: 1
      known_false:
        kind: constant_chi_prime
        claimed_chi_prime: 7
        must_chi_prime: 1
        must_reject: true
      matched_null:
        kind: empty_character
        must_reject: true
      invalid:
        - {y_zero: true, point: [2, 0], must_reject: true, zero_fibre: true}

  controls:
    - name: known_false_constant
      object: KF claim chi_3(y') equals 7
    - name: matched_null
      object: empty character
    - name: invalid_y_zero
      object: y=0 zero fibre

  independent_variables:
    - point
    - affine_chart
  metrics:
    primary:
