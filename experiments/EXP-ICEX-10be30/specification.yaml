experiment:
  id: EXP-ICEX-10be30
  hypothesis_id: H-ICEX-c1a164
  derived_from_idea: IDEA-20260811-8783a5
  question_id: RQ-PAIR-21313f
  batch_id: BATCH-d6838c
  version: 1
  title: >-
    EXHAUSTIVE EMBEDDING-DEGREE ENUMERATION OVER A PRIME LADDER SIZED TO AN AGGREGATE
    EXPECTED COUNT OF 25- with the predicted mean corrected from the upper bound
    2B^2/sqrt(N) to the EXACT Sigma over k DIVIDING N-1 of phi(k) times the admissible
    trace fraction, a null family whose predicted count is exactly zero by
    construction, a planted pairing-friendly pair the enumerator must return, two
    order implementations because a partial factorisation biases toward the
    prediction, and no curve constructed anywhere
  status: draft
  objective: >-
    (A) THE UNCERTAINTY. The campaign matched-order design instance is N = 19507 with
    59 isogeny classes. Whether any of those classes has a small embedding degree -
    which would contaminate every cost measurement made on the family - is exactly
    checkable in seconds from the factorisation of N - 1 alone, and has not been
    checked.
    (B) THE FIRST CORRECTION, WHICH CHANGES THE PREDICTED MEAN. The source writes the
    attainable small-order count as Sigma over k at most B of phi(k), at most B^2/2.
    THAT IS AN UPPER BOUND ATTAINED ONLY WHEN EVERY k AT MOST B DIVIDES N - 1. Since
    the multiplicative group modulo a prime N is cyclic of order N - 1, elements of
    order exactly k exist only when k divides N - 1, so the attained count is
        |R_B(N)| = Sigma over k DIVIDING N - 1 with k at most B of phi(k),
    and the exact Poisson mean is lambda(N, B) = |R_B(N)| * A(N)/(N - 1) with A(N)
    the number of admissible traces. FOR THE SOURCE OWN NULL FAMILY, N - 1 = 2q WITH
    q PRIME, R_B IS EXACTLY {+1, -1} AND THE PREDICTED COUNT IS EXACTLY ZERO for
    every B below q. Comparing such an N against 2B^2/sqrt(N) would read as a
    systematic deficit for a reason that has nothing to do with equidistribution.
    (C) THE SECOND CORRECTION, A POWER COMPUTATION DONE BEFORE THE LADDER IS CHOSEN.
    At 15-bit N the expected count at B = 6 is of order 0.4 per prime; at 30-bit N it
    is of order 0.002. TWENTY PRIMES SPREAD ACROSS 2^15 TO 2^30 GIVE AN AGGREGATE OF
    ORDER ONE, AND A FACTOR-2 BAND ON A POISSON VARIABLE OF MEAN ONE CANNOT FIRE.
    THE LADDER IS THEREFORE SIZED HERE, BEFORE ANY COUNT IS OBSERVED, so that the sum
    of the EXACT lambda(N, B) reaches AT LEAST 25 at the smallest tested B - roughly
    63 primes at 15 bits - at which point a factor-2 deviation is about 2.5 standard
    deviations.
    (D) THE DESIGN-INSTANCE CHECK, EXACT. 19506 = 2 * 3 * 3251 with 3251 prime, so
    the attainable embedding degrees are exactly the eight divisors {1, 2, 3, 6,
    3251, 6502, 9753, 19506} with NOTHING BETWEEN 6 AND 3251. Exactly six residues
    have order dividing 6, two of them the exceptional +1 and -1, excluded for
    concrete arithmetic reasons- t = 0 is supersingular and out of ordinary scope,
    and t = 2 forces p = 19508, which is even and not prime. PREDICTION- all 59
    classes have k_emb at least 3251. THE PRIOR RISK IS REAL- four non-exceptional
    small-order residues among 19506, against an admissible trace window of roughly
    559, gives about an 11 percent chance that one lands in the window.
    (E) WHAT IS NOT DONE. NO CURVE IS CONSTRUCTED ANYWHERE. The entire experiment is
    integer arithmetic modulo N. No attack is proposed, no exponent is moved, and no
    statement about any deployed system is made.
  inputs:
    cost_unit: >-
      THERE IS NO COMPUTATIONAL COST METRIC. k_emb, B, N, t, |R_B(N)|, A(N) and every
      count are INTEGERS. lambda(N, B) is an EXPECTED COUNT, dimensionless. The
      observed-over-predicted ratio is COUNT OVER COUNT. WALL-CLOCK SECONDS ARE
      RECORDED FOR BUDGET ONLY and enter no statistic.
    unit_discipline: >-
      BINDING. Every value carries a tag in {integer, count, dimensionless,
      probability, seconds}. Cross-tag arithmetic requires a named recorded
      conversion. Both sides of every ratio are counts. NO QUANTITY IN THIS CONTRACT
      IS A TIME DIVIDED BY ANYTHING.
    predicted_mean: >-
      THE PREDICTED MEAN IS THE EXACT lambda(N, B) = |R_B(N)| * A(N)/(N - 1) WITH
      |R_B(N)| = Sigma over k DIVIDING N - 1 with k at most B of phi(k). The bound
      2B^2/sqrt(N) is REPORTED AS A REFERENCE LINE ONLY and is never used as the
      comparison target, because it is attained only when every k at most B divides
      N - 1.
    order_computation: >-
      BLOCKING. ord_N(t - 1) is computed by FULLY FACTORING N - 1 and testing
      prime-power quotients, in TWO INDEPENDENT IMPLEMENTATIONS. An order computation
      with an incomplete factorisation silently returns a MULTIPLE of the true order
      and would systematically UNDER-report small k_emb, biasing the result TOWARD
      the prediction. This is therefore blocking rather than advisory.
    frozen_before_execution: >-
      The sized prime ladder and the lambda computation that sized it, the B values,
      the null family and contrast family definitions, the planted construction and
      its known embedding degree, the exclusion rules for t = 0 and t = 2, the
      factor-2 aggregate band, and the requirement that the aggregate expected count
      reach 25. NONE MAY CHANGE AFTER ANY COUNT IS OBSERVED - in particular the
      ladder may not be extended after seeing a count.
    procedure: >-
      STAGE 0 (LADDER SIZING, zero data, blocking). For candidate primes, factor
      N - 1, compute |R_B(N)| exactly, estimate A(N) from the Hasse and primality
      conditions, and CHOOSE THE LADDER so that the summed lambda(N, B) is at least
      25 at the smallest tested B. RECORD THE LADDER AND THE SIZING COMPUTATION
      BEFORE ANY COUNT IS OBSERVED.
      STAGE 1 (planted-construction control, blocking). Include a constructed pair
      (N, t) with a KNOWN small embedding degree. THE ENUMERATOR MUST REPORT IT AT
      EXACTLY THE CONSTRUCTED VALUE. Failure marks the enumerator VOID.
      STAGE 2 (design instance, exact and separate). At N = 19507- factor 19506,
      list the eight divisors, enumerate every admissible t with p = N + t - 1 prime
      and negative discriminant, compute ord_N(t - 1) in both implementations, and
      LIST EVERY ATTAINED EMBEDDING DEGREE WITH ITS TRACE. Re-derive the class count
      from the enumeration rather than assuming the design-note figure.
      STAGE 3 (ladder enumeration). For every N on the sized ladder, the same
      enumeration, tabulating counts with k_emb at most B for B in {2, 3, 4, 6, 12},
      and reporting A(N) alongside every count.
      STAGE 4 (null and contrast families). Primes with N - 1 = 2q, q prime, where
      the predicted count is EXACTLY ZERO; and primes with N - 1 highly composite at
      matched size, where it is strictly positive. Report both against their own
      exact lambda.
      STAGE 5 (aggregate test). Compare the aggregated observed count against the
      aggregated EXACT lambda, per B, with the factor-2 band, ONLY at B values whose
      aggregate expected count reaches 25; a B whose aggregate falls short is
      reported as UNDERPOWERED and no verdict is issued for it.
      STAGE 6 (report). The N = 19507 table in full; the ladder table with A(N) on
      every row; the null and contrast family comparison; the aggregate test with its
      power statement; the planted-construction outcome; the cross-implementation
      agreement; and the re-derived class count against the design-note figure.
    mechanism: >-
      STEP 1. One enumerator, one order module with two independent implementations,
      one reporting path, applied identically to the design instance, the ladder, the
      null family, the contrast family and the planted pair.
      STEP 2. t = 0 and t = 2 are excluded FOR STATED ARITHMETIC REASONS and COUNTED-
      t = 0 is supersingular for p greater than 3 and outside ordinary scope; t = 2
      forces p = N + 1, which is even for odd N and hence not prime. They are not
      excluded by the model.
      STEP 3. A(N) is reported alongside every ratio because the primality
      requirement on p = N + t - 1 thins the trace set NON-UNIFORMLY and could
      correlate with t modulo small primes; absorbing it into a ratio would hide the
      thinning.
      STEP 4. Every row is reported as (N, factorisation of N - 1, divisor list,
      |R_B(N)| per B, A(N), t, p, discriminant sign, k_emb from implementation 1,
      k_emb from implementation 2, count with k_emb at most B, lambda(N, B), the
      2B^2/sqrt(N) reference line, wall seconds).
    instrument: >-
      Pure integer arithmetic- complete factorisation of N - 1, primality testing of
      p = N + t - 1, Euler totient sums over divisors, and multiplicative order by
      prime-power quotient testing, implemented twice independently. NO CURVE IS
      CONSTRUCTED, NO GROUP OPERATION IS PERFORMED, AND NO PAIRING IS COMPUTED.
      Memory is O(sqrt(N)) integers if the trace list is retained, O(1) streaming.
  controls:
    - >-
      CONTROL 1, PLANTED PAIRING-FRIENDLY CONSTRUCTION (blocking, planted signal of
      KNOWN size). A constructed pair (N, t) with a known small embedding degree,
      included in the corpus. THE ENUMERATOR MUST REPORT IT AT EXACTLY THE
      CONSTRUCTED VALUE. AN ENUMERATOR THAT MISSES A CONSTRUCTED PAIRING-FRIENDLY
      INSTANCE IS VOID AND EVERY ZERO IT REPORTS IS MEANINGLESS. This is the
      two-directional control the lane requires.
    - >-
      CONTROL 2, NULL FAMILY WITH A COMPUTED FLOOR OF ZERO (blocking). Primes with
      N - 1 = 2q, q prime, where R_B is exactly the two exceptional residues and the
      predicted count is EXACTLY ZERO for every B below q. Paired against a
      CONTRAST FAMILY with N - 1 highly composite at matched size, where the
      predicted count is strictly positive. A FORCED SEPARATION with an exact floor
      on one side. If the instrument finds the same count in both, IT IS NOT READING
      THE FACTORISATION OF N - 1 and every result is void.
    - >-
      CONTROL 3, TWO INDEPENDENT ORDER IMPLEMENTATIONS (blocking). At least one
      factoring N - 1 completely. An incomplete factorisation returns a MULTIPLE of
      the true order and biases the result TOWARD the prediction, which is why this
      is blocking rather than advisory.
    - >-
      CONTROL 4, DIVISOR CONSISTENCY. Every attained embedding degree must DIVIDE
      N - 1. A value that does not is an implementation error and CANNOT be a
      mathematical outcome.
    - >-
      CONTROL 5, POWER GATE ON THE AGGREGATE TEST. The factor-2 verdict is issued
      only at B values whose aggregated exact lambda reaches 25. A B falling short is
      reported UNDERPOWERED with its aggregate, and no verdict is issued for it.
    - >-
      CONTROL 6, ADMISSIBLE-TRACE ACCOUNTING. A(N) reported alongside every count and
      every ratio, so the non-uniform thinning from the primality condition is
      visible.
    - >-
      CONTROL 7, DESIGN-NOTE VERIFICATION. The 59-class figure at N = 19507 is
      RE-DERIVED from the enumeration rather than assumed, because the design note
      marks it as derived rather than committed.
    - >-
      NOTE ON THE CURVE-FREE STATUS, RECORDED AS A PROOF RATHER THAN AN ARM. k_emb is
      ord_N(t - 1), a function of two integers, and no curve is constructed anywhere
      in this contract. A curve-free null would be the IDENTICAL COMPUTATION, so
      running one would prove nothing. PRE-DECLARED AND FROZEN- NO OUTCOME OF THIS
      EXPERIMENT IS AN ELLIPTIC-CURVE STATEMENT beyond the cited arithmetic fact that
      N dividing the group order forces p congruent to t - 1 modulo N.
  independent_variables:
    - prime N, over the sized ladder between 2^15 and 2^30, plus the design instance 19507
    - embedding-degree threshold B in {2, 3, 4, 6, 12}
    - family in {sized ladder, null N-1 = 2q, contrast highly composite N-1, planted construction}
    - order implementation, two independent
  metrics:
    primary:
      - >-
        count of admissible traces with k_emb at most B, per N per B (count)
      - >-
        aggregated observed count against aggregated EXACT lambda(N, B), per B
        (count over count)
      - >-
        the set of attained embedding degrees at N = 19507, with the trace for each
        (set of integers)
    secondary:
      - complete factorisation of N - 1 and its divisor list, per N
      - |R_B(N)| computed exactly as a divisor-restricted totient sum, per N per B
      - admissible-trace count A(N), per N
      - the 2B^2/sqrt(N) upper-bound reference line, reported and never used as the target
      - per-admissible-trace embedding degree from both implementations
      - null-family and contrast-family counts against their own exact lambda
      - planted-construction detection flag and the value returned
      - re-derived class count at N = 19507 against the design-note figure
      - excluded-trace counts for t = 0 and t = 2, with the reason
      - wall-clock seconds per N, for budget accounting only
  heuristic_under_test: HEUR-KEMB-1
  preregistered_prediction:
    quantity: >-
      The number of admissible traces at a fixed prime N whose corresponding curve
      family has embedding degree at most B, enumerated exhaustively.
    formula: >-
      Poisson with the EXACT mean lambda(N, B) = |R_B(N)| * A(N)/(N - 1) where
      |R_B(N)| = Sigma over k DIVIDING N - 1 with k at most B of phi(k). At
      N = 19507- eight divisors {1, 2, 3, 6, 3251, 6502, 9753, 19506}, |R_6| = 6 of
      which two are the exceptional residues, and the predicted count with k_emb at
      most 6 is EXACTLY ZERO. Null family with N - 1 = 2q- predicted count exactly
      zero for every B below q. Aggregate agreement within a factor 2, tested only
      where the aggregate expected count reaches 25.
    source: >-
      Exact arithmetic performed in this contract- the cyclicity of the
      multiplicative group modulo a prime, the Hasse bound, and the factorisation
      19506 = 2 * 3 * 3251 with 3251 prime, verified by trial division against every
      prime up to 57. The published density result on small embedding degree is
      RECALLED AND UNREAD and supports nothing; it is the reason no novelty is
      claimed for the substance.
  scale_relevance:
    tier: toy
    justification: >-
      N between 2^15 and 2^30, where the FULL trace range is enumerable and no
      sampling is required, which is exactly what makes the answer complete for each
      tested N rather than statistical. TRANSFER IS NOT CLAIMED to cryptographic N-
      at 256-bit N the Hasse window contains about 2^129 integers and exhaustive
      enumeration IS NOT REACHABLE AT ANY SCALE THIS PROGRAM CAN SPEND. Stated rather
      than the claim being quietly shrunk.
    correspondence: null
  tail_checks:
    - >-
      The LARGEST observed count over the ladder against the Poisson maximum, and
      separately the NUMBER OF PRIMES WITH A NONZERO COUNT against its Poisson
      prediction. The aggregate mean alone would hide a single N carrying every hit.
    - >-
      The Poisson comparison uses the EXACT POISSON TAIL rather than a normal
      approximation, since the per-N mean is small.
    - >-
      The distribution of attained embedding degrees is reported in full at
      N = 19507, not only the count below 6, so the divisor-gap prediction is visible.
  replication:
    seeds: >-
      The enumeration is DETERMINISTIC and requires no seeds. Replication here is the
      TWO INDEPENDENT ORDER IMPLEMENTATIONS and the aggregation over the sized prime
      ladder, both declared in the run manifest before stage 2.
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 10
  stopping_rules:
    - >-
      Stage 0 must complete and record the sized ladder BEFORE any count is observed.
      THE LADDER MAY NOT BE EXTENDED AFTER SEEING A COUNT.
    - >-
      Stage 1 planted-construction failure HALTS the run and marks the enumerator
      VOID.
    - >-
      An N whose N - 1 cannot be completely factored within its budget is DROPPED
      FROM THE LADDER AND RECORDED, and the aggregate lambda is recomputed for the
      achieved ladder before any verdict.
    - >-
      Total wall-clock at the declared cap; remaining primes recorded as NOT
      ATTEMPTED with the achieved aggregate lambda stated.
  invalidation_rules:
    - >-
      A count compared against 2B^2/sqrt(N) rather than against the exact lambda
      invalidates the verdict.
    - >-
      A verdict issued at a B whose aggregate expected count is below 25 invalidates
      that verdict.
    - >-
      An order computed without the complete factorisation of N - 1 in at least one
      implementation invalidates the run, because the bias is toward the prediction.
    - >-
      An attained embedding degree not dividing N - 1 invalidates the implementation.
    - >-
      A ratio reported without its admissible-trace count A(N) invalidates the row.
    - >-
      Extending the ladder after observing a count invalidates the aggregate test.
    - >-
      Excluding t = 0 or t = 2 without recording the count and the arithmetic reason
      invalidates the enumeration.
  success_criterion: >-
    Stage 0 records a ladder whose aggregate exact lambda reaches 25 at the smallest
    tested B; the planted construction is detected at its constructed value; both
    order implementations agree everywhere; every attained degree divides N - 1; the
    null family returns exactly zero and the contrast family returns its computed
    lambda; the N = 19507 table lists every attained degree with its trace and the
    class count is re-derived; and the aggregate test is reported with its power
    statement. Success is a COMPLETE ENUMERATION WITH ITS CONTROLS FIRING.
  falsification_criterion: >-
    A class at N = 19507 with k_emb at most 6 falsifies the design-instance
    prediction and is immediately interesting, since it would be an unconstructed
    pairing-friendly ordinary curve at toy size. Aggregated counts above twice the
    aggregated EXACT lambda, at an aggregate expected count of at least 25, falsify
    the equidistribution heuristic and would matter for curve-selection guidance. A
    missed planted construction VOIDS the enumerator. An attained degree not dividing
    N - 1 is an implementation error and cannot be a mathematical outcome. The two
    families showing the same count means the instrument is not reading the
    factorisation of N - 1.
  required_artifacts:
    - exact command, git commit and dirty-tree state, environment and versions
    - the stage 0 ladder-sizing computation and the frozen ladder, recorded before any count
    - the frozen parameter file with the B values, family definitions, planted pair, exclusion rules and the factor-2 band
    - per-N complete factorisation of N - 1 with its divisor list
    - per-N exact |R_B(N)| as a divisor-restricted totient sum, per B
    - per-N admissible-trace count A(N) and the excluded t = 0 and t = 2 counts with reasons
    - per-admissible-trace embedding degree from BOTH implementations, with the agreement count
    - per-N and per-B counts with k_emb at most B, against the exact lambda and against the reported 2B^2/sqrt(N) reference line
    - the full N = 19507 table listing every attained embedding degree with its trace, and the re-derived class count against the design-note figure
    - the null-family and contrast-family tables against their own exact lambda
    - the aggregate test with its exact Poisson tail and its power statement per B
    - the planted-construction detection record with the value returned
    - dropped-prime and not-attempted inventory with the recomputed achieved aggregate lambda
    - stdout, stderr, timestamps, resource measurements
    - inference block- requested policy, backend, resolved model id, effort, fallback, degraded requirements
  assigned_to: executor
  approved_by: null
  limitations:
    - >-
      TOY TO MEDIUM SCALE, claim_tier toy. NO ATTACK, NO EXPONENT, NO SPEEDUP,
      sota_delta zero. MOV and Frey-Ruck are classical and nothing here is novel as
      an attack route.
    - >-
      THE PRACTICAL CONTENT IS A NEGATIVE- that the matched-order family the campaign
      intends to use is not contaminated by pairing-vulnerable classes, which is a
      PREREQUISITE for reading a cost measurement on it and is not itself a result
      about the ECDLP.
    - >-
      THE OBJECT IS CURVE-FREE BY CONSTRUCTION and no curve is built anywhere. That is
      recorded as a PROOF rather than discharged by a curve-free arm, since such an
      arm would be the identical computation. PRE-DECLARED- NO OUTCOME IS AN
      ELLIPTIC-CURVE STATEMENT beyond the cited arithmetic fact that N dividing the
      group order forces p congruent to t - 1 modulo N.
    - >-
      DOMINATED BY THE PUBLISHED LITERATURE on the substance; the improbability of
      small embedding degree is already established asymptotically and the
      attribution here is RECALLED and unverified. Recorded as domination rather than
      as novelty.
    - >-
      NO CONCLUSION ABOUT THE LAW MAY BE DRAWN FROM N = 19507 ALONE - only about that
      family - because at 15-bit N the predicted count is of order 1. The sized ladder
      exists precisely for that reason.
    - >-
      EXHAUSTIVE ENUMERATION IS NOT REACHABLE AT CRYPTOGRAPHIC N- the Hasse window at
      256-bit N contains about 2^129 integers. NO TRANSFER IS CLAIMED and at that
      scale only a sampling design applies. Stated rather than the claim being quietly
      shrunk.
    - >-
      Factoring N - 1 is free at these sizes and is a GENUINE COST at cryptographic
      scale; no cheapness is claimed there.
    - >-
      The primality requirement on p = N + t - 1 thins the trace set non-uniformly, so
      A(N) is reported alongside every ratio.
    - >-
      k_emb is constant on an F_p-isogeny class, so this axis is closed within a class
      by identity; reaching a small-k_emb curve means changing the trace and hence the
      problem instance, which is not a move available to an attacker.
  yaml_parse_disclosure: >-
    Written by a Coordinator subagent without an interpreter. Every prose value is
    a folded block scalar; no tabs; no duplicate keys to the author reading. THIS
    AGENT COULD NOT RUN A STRICT YAML PARSE OR tools/validate_ledger.py AND DID
    NOT DO SO; the orchestrating session must run both before this contract is
    reviewed.
