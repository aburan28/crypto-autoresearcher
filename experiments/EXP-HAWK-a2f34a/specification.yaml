experiment:
  id: EXP-HAWK-a2f34a
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-HAWK-c7a551
  question_id: RQ-HAWK-001
  goal_id: GOAL-HAWK-001
  batch_id: null
  batch_id_note: >-
    No batch is assigned. GOAL-HAWK-001's current_batch_id is BATCH-002, which
    is closed, and its goal record states that "a conforming BATCH-003 dispatch
    queue - receipts inside their own archive commits - is owed before any batch
    that dispatches workers". This contract is filed as a design for a future
    batch and claims no batch membership.

  title: >-
    Sieve-free exact-integer certification of the tau-cocycle lattice: four
    forced values, one positive control that can fail, three nulls, and an
    optional toy key-recovery certificate

  objective: >-
    If separately approved, frozen and authorized, construct the cocycle lattice
    Lambda_B^(tau) from the PUBLIC key alone at ring degrees n in {4, 8, 16, 32}
    using the linear system derived in H-HAWK-c7a551, and compare four
    pre-declared integer invariants against the values that Proposition 4.5 of
    KN-LIT-7592 forces, alongside one positive control and three nulls. This is
    an INSTRUMENT AND VERIFICATION contract. It proposes no attack, computes no
    cost, and is designed so that its cheapest stage can end the whole line.

  what_this_is_not:
    - >-
      Not an attack on HAWK, not a key-recovery claim at any deployed parameter,
      and not an assessment of HAWK's security in either direction.
    - >-
      Not a verification of Theorem 5.1 (the n/2 + 1 SVP-dimension claim), which
      concerns a block-reduction algorithm this contract does not implement.
    - >-
      Not a verification of Proposition 4.5 itself, which is a statement about
      all n; at most it checks four consequences of it at four toy degrees.
    - >-
      Not a cost, gate-count, memory, asymptotic or exponent measurement of any
      kind. No cost model is used anywhere in this contract.
    - >-
      Not a reproduction of HAWK key generation. The Round-3 specification is
      UNREAD; keys are HAWK-SHAPED (arbitrary short elements of SL_2(R)), which
      is sufficient because the claim under test quantifies over all of SL_2(R),
      and is insufficient for anything else.
    - >-
      Not an approval, a freeze, an execution authorization, a run, an observed
      output, or evidence. No number in this file was measured; the forced
      values are arithmetic on a claimed isometry.
    - >-
      Not a discharge of RQ-HAWK-001's source-acquisition constraint or of
      GOAL-HAWK-001's next_action. Both are Coordinator matters and this
      contract pre-empts neither.

  claim_ceiling: >-
    TIER: toy. The exact scope a completed run could support: that a lattice
    constructed by the linear system frozen below, at n in {4, 8, 16, 32}, from
    keys drawn by the declared deterministic rule, on one instrument lineage,
    does or does not have the four invariants printed below; and, if the
    optional Stage 4 runs, that a secret basis was recovered and certified by
    the exact identity B'* B' = Q at n <= 16 with brute-force enumeration
    standing in for the source's block reduction. NOTHING ABOVE toy MAY BE
    ASSERTED. In particular no outcome establishes any statement about HAWK-256,
    HAWK-512 or HAWK-1024, about the SVP dimension, about gate counts, or about
    Proposition 4.5 as a theorem. AGENTS.md rule 7 and RQ-HAWK-001's own
    claim_tier_ceiling both apply and neither is relaxed here.

  source_provenance:
    primary_source: knowledge/literature/KN-LIT-7592.md
    reading_depth: >-
      Abstract, introduction and technical overview only, by TASK-20260802-004.
      The entry's own "Not verified here" section lists Lemma 4.1, Lemma 4.3,
      Proposition 4.5, Theorem 5.1, Proposition D.2 and Theorem 6.1 as NOT
      verified by this program. Every structural statement this contract tests
      is therefore RELAYED AT ONE REMOVE.
    verbatim_fragments: >-
      coordination/goals/GOAL-HAWK-001/batches/BATCH-001/tasks/TASK-20260802-004/
      disclosed_attack_transcription.md, a pdfminer.six extraction which
      EV-HAWK-001 records as leaving "at least four damaged renderings
      unmarked". The sentence this contract relies on is prose, the least
      damage-prone class; that is a mitigation, not a discharge.
    derived_not_cited: >-
      THE DEFINING LINEAR SYSTEM BELOW IS THIS PROGRAM'S OWN DERIVATION
      (H-HAWK-c7a551, steps 1-2). It is NOT quoted from the source, whose
      Lemmas 4.1 and 4.3 were not read. A mismatch is FIRST evidence against the
      derivation and only SECOND evidence about the source, and that ordering is
      frozen here, before any run.

  inputs:
    ring:
      definition: R_n = Z[x]/(x^n + 1)
      n_values: [4, 8, 16, 32]
      ell_values: [3, 4, 5, 6]
      conductor: m = 2^ell, n = phi(m) = m/2
      basis: power basis 1, x, ..., x^{n-1}, coefficients as Python ints
    galois:
      tau: tau(x^j) = (-1)^j x^j
      c: c(1) = 1 and c(x^j) = -x^{n-j} for 1 <= j <= n-1
      c_tau: computed as the composite of the two above; never defined separately
      F: the subfield fixed by <c, tau>, of degree n/4 over Q
      trace_evaluation: >-
        Tr_{F/Q}(z) is evaluated as Tr_{K/Q}(z)/4 for z in F, and
        Tr_{K/Q}(sum a_j x^j) = n * a_0 for the power basis of Z[x]/(x^n+1).
        VALID ONLY IF z lies in F, which is CHK-3 and is checked per basis
        element, never assumed.
    key_generation:
      rule: >-
        B is a product of k = 6 elementary matrices over R_n. For i = 1..6, if i
        is odd set E_i = [[1, u_i], [0, 1]], else E_i = [[1, 0], [u_i, 1]], and
        B = E_1 E_2 E_3 E_4 E_5 E_6. Every E_i has determinant 1, so B lies in
        SL_2(R_n) BY CONSTRUCTION with no NTRU solve, no lattice reduction and
        no rejection step. This is a deliberate design choice: it removes every
        dependency on absent packages from key generation.
      short_element_rule: >-
        u_i = sum_{j=0}^{n-1} e_j x^j with e_j in {-1, 0, 1}, drawn by the seed
        rule below with the mapping byte mod 3 -> {-1, 0, 1} in that order.
      keys_per_n: 20
    null_arms:
      NULL_1_random_hermitian: >-
        Q' = [[q11, q12], [c(q12), q22]] with q11 = q22 = D a positive rational
        integer and q12 = sum e_j x^j, e_j in {-1,0,1} by the same seed rule.
        D is set to 4*n*(n+1), which exceeds the operator norm bound of the
        off-diagonal block by construction, so Q' is positive definite WITHOUT a
        numerical check. Q' is generically NOT of the form B* B with det B = 1.
      NULL_1b_non_unimodular_twist: >-
        Q'' = U* Q U with U = [[1 + x, 0], [0, 1]]. Its determinant is 1 + x,
        whose field norm is prod_{z^n = -1} (1 + z) = (-1)^n * ((-1)^n + 1) = 2
        for even n, so 1 + x is NOT a unit of R_n and U is NOT unimodular --
        this is checked arithmetically in the run and not assumed. Q'' is
        therefore a genuine positive-definite Hermitian Gram matrix of a rank-2
        module of a DIFFERENT covolume, matched in shape and entry size to the
        treatment arm, on which the cocycle argument of H-HAWK-c7a551 step 1
        (which used det B = 1) must fail. NOTE THE DESIGN CHOICE: a UNIMODULAR
        twist would be useless as a null, because U in SL_2(R) maps a valid
        instance to a valid instance and PC-1 would pass by construction --
        which is exactly the "control that cannot fail" pattern KN-TECH-1a5b7e
        catalogues. Applies at n >= 8.
      NULL_2_graded: >-
        Q_e = Q + e * E with E = [[2, x + c(x)], [c(x + c(x)), 2]] a fixed
        Hermitian integer perturbation and e in {0, 1, 2, 4, 8}. Five points,
        monotonicity in e reported.
    master_seed: 20260805
    domain: EXP-HAWK-a2f34a/v1
    seed_derivation_rule: >-
      All randomness is derived deterministically. For a stream labelled L at
      degree n, arm A and counter t, form the ASCII byte string
        domain || "|" || L || "|" || decimal(n) || "|" || A || "|" || decimal(t)
        || "|" || decimal(master_seed)
      and take SHA-256 of it. Coefficient bytes are consumed from the digest in
      big-endian order, one byte per coefficient, refreshing the digest by
      incrementing t when exhausted. A third party reproduces every instance
      bit-for-bit from (domain, L, n, A, t, master_seed) alone. No system
      entropy, no time, no PID, and no floating point enters any stream.
    stream_labels:
      - key       (treatment key material u_i)
      - nullq     (NULL-1 off-diagonal q12)
      - perturb   (unused; E is fixed, listed so a reader knows it is not sampled)

  frozen_lattice_definition:
    design_status: declared_only_not_implemented_or_observed
    conditions: >-
      Lambda := { Y = [[a, b], [c, d]] in M_2(R_n) :
                  (L1) tau(a) - d = 0,
                  (L2) tau(d) - a = 0,
                  (L3) tau(b) + b = 0,
                  (L4) tau(c) + c = 0,
                  (L5) Q Y - ((c tau)(Y))^T tau(Q) = 0 }.
      (L1)-(L4) are the adj-pattern conditions of H-HAWK-c7a551 step 1;
      (L5) is the linearised public condition of step 2. All five are Z-linear
      in the 4n integer coordinates of Y.
    assembly: >-
      Stack (L1)-(L5) into an integer matrix M of size at most 8n x 4n and
      compute ker_Z(M) by integer Hermite normal form with the pivot order
      "leftmost non-zero column, smallest absolute pivot, ties broken by lowest
      row index". The pivot order is part of the frozen definition because the
      HNF basis is reported.
    gram: >-
      G_ij = (1/2) * (Q^(tau)(v_i + v_j) - Q^(tau)(v_i) - Q^(tau)(v_j)) for the
      HNF basis {v_i}, with Q^(tau)(Y) = Tr_{K/Q}(det Y)/4. G must be an
      integer matrix; a non-integer entry is invalid_measurement, not a result.
    enumeration: >-
      Fincke-Pohst over G with an exact rational Cholesky, target squared norms
      n/4 and n/2, with a NODE BUDGET of 10^8 visited nodes per (n, arm). Budget
      exhaustion is reported as an infrastructure outcome with the node count,
      NEVER as a value of F3 or F4 and never as evidence about the hypothesis.

  arms_and_controls:
    treatment: >-
      For each n and each of the 20 declared keys: build Lambda from Q = B* B,
      compute F1 (rank), F2 (det G), F3 and F4 (theta coefficients), and record
      whether V_tau = B^{-1} tau(B) lies in Lambda with Q^(tau)(V_tau) = n/4 and
      V_tau congruent to I mod 2.
    measured_null: >-
      NULL-1 (random Hermitian, 20 draws per n): rank of Lambda built from Q'.
      FORCED VALUE DERIVED BEFORE THE RUN: strictly below n, predicted exactly 0.
      This null CAN FAIL -- if it returns n, the rank is a property of the
      linear-algebra shape and not of the key, and F1 is struck from the
      forced-value set before any treatment number is interpreted.
    second_null: >-
      NULL-1b (NULL_1b_non_unimodular_twist, n >= 8, 20 draws per n): PC-1 rate.
      FORCED VALUE: exactly 0/20, because the cocycle argument used det B = 1.
      Its purpose is to show that the positive control is sensitive to
      unimodularity and not merely to Q being Hermitian.
    graded_control: >-
      NULL-2 (five points, e in {0, 1, 2, 4, 8}, 5 keys per point per n): rank
      of Lambda built from Q_e. FORCED VALUE: n at e = 0, strictly below n at
      every e >= 1, and non-increasing in e. Monotonicity is REPORTED, not
      merely checked. A rank that does not decay as e grows is the canonical
      artifact tell (docs/inventor-protocol.md section 3) and voids the
      instrument.
    positive_control: >-
      PC-1 (the effect MUST appear): V_tau in Lambda, Q^(tau)(V_tau) = n/4,
      V_tau == I (mod 2), at 20/20 keys for every n. IF PC-1 FAILS, THE
      INSTRUMENT IS BROKEN AND NO NEGATIVE RESULT MAY BE REPORTED FROM ANY OTHER
      ARM. Threshold declared here, before any run, and exact rather than a rate.
    instrument_self_tests: >-
      CHK-3: c(det v_i) - det v_i = 0 for every HNF basis element (det v_i lies
      in F). CHK-4: G positive definite by exact leading-principal-minor signs.
      CHK-5: G is an integer matrix. Any failure halts before F2-F4 are
      computed.
    ordering_control: >-
      NULL-1, NULL-1b, NULL-2 and the three self-tests are executed, recorded
      and SHA-256 hash-committed IN FULL before any treatment invariant is
      computed or looked at. The frozen decision rule is then executed on the
      null outputs first. If the rule emits the same verdict on null and
      treatment it discriminates nothing and must be rewritten before the
      treatment arm is read. Absence of the null-first commitment is
      invalid_measurement.
    comparability_policy: >-
      No cross-contract comparison is permitted. In particular no number here
      may be compared to any figure in KN-LIT-7592, KN-OPEN-028 or the BATCH-001
      transcription, because those are relayed gate counts and blocksizes in
      cost models this contract does not use. Comparison to EXP-HAWK-c8231a is
      permitted ONLY through the shared frozen instrument definition and only
      for cells that name the same n, arm and involution.

  metrics:
    primary:
      - F1, the exact Z-rank of Lambda, per arm per n.
      - F2, the exact integer determinant of G, per arm per n.
      - F3, the exact count of lattice vectors of squared norm n/4, per n.
      - F4, the exact count of lattice vectors of squared norm n/2, per n.
      - PC-1 pass count out of 20 per n.
    secondary:
      - Key-to-key spread of each of F1-F4 across the 20 draws (reported FIRST).
      - NULL-1 rank distribution; NULL-1b PC-1 rate; NULL-2 rank versus e.
      - CHK-3, CHK-4, CHK-5 boolean results per n.
      - Enumeration node counts and whether the node budget was reached.
      - HNF basis, G, and their SHA-256 digests, per n per arm.
      - If Stage 4 runs: the certificate check B'* B' == Q, per key.

  preregistered_prediction:
    quantity: The quadruple (F1, F2, F3, F4) at n = 4, 8, 16, 32 on the treatment arm.
    formula: >-
      F1 = n; F2 = (n/4)^{n/2+1} * (n/2)^{n/2-1}; F3 = 2*(n/2+1) = n + 2;
      F4 = 4*C(n/2+1, 2) + 2*(n/2-1) = n^2/2 + 2n - 2.
    values:
      n_4:  {F1: 4,  F2: 2,                                     F3: 6,  F4: 14}
      n_8:  {F1: 8,  F2: 2048,                                  F3: 10, F4: 46}
      n_16: {F1: 16, F2: 549755813888,                          F3: 18, F4: 158}
      n_32: {F1: 32, F2: 2596148429267413814265248164610048,    F3: 34, F4: 574}
    source: >-
      Derived in IDEA-20260805-6eac55 and H-HAWK-c7a551 from the reported
      isometry Lambda ~ sqrt(n/4) Z^{n/2+1} (+) sqrt(n/2) Z^{n/2-1}, and
      recomputed in the drafting session from the closed forms above. NOT
      MEASURED. No tolerance: these are integer identities and the comparison is
      equality.
    additional:
      PC-1: 20/20 at every n.
      NULL-1 rank: 0 at 20/20, and in any case strictly below n.
      NULL-1b PC-1 rate: 0/20 at every n >= 8.
      NULL-2 rank: n at e=0; strictly below n at e in {1,2,4,8}; non-increasing.
      key_to_key_spread: exactly one distinct value per invariant per n.

  stages_and_termination:
    stage_0:
      cost: zero compute, under 15 minutes
      content: >-
        Independently recompute the four closed forms and the printed values.
        A discrepancy ends the contract before any code is written.
      can_terminate: true
    stage_1:
      cost: seconds, n = 4 only
      content: >-
        Build Lambda at n = 4 (a system of at most 32 x 16 integers), compute
        F1, and run PC-1. THIS IS THE CHEAPEST DECISIVE GATE AND IT RUNS FIRST.
      can_terminate: true
      termination_rule: >-
        IF PC-1 FAILS AT n = 4, STOP. Report the derivation, the exact failure
        mode, and a named request for the statements of Lemma 4.1 and Lemma 4.3.
        Make no statement about Proposition 4.5.
    stage_2:
      cost: seconds to minutes
      content: F1, F2, CHK-3, CHK-4, CHK-5 at all four n, all arms, 20 keys.
      can_terminate: true
    stage_3:
      cost: minutes; n = 32 subject to the node budget
      content: F3 and F4 by exact enumeration.
      can_terminate: false
    stage_4:
      cost: hours, OPTIONAL, OUTSIDE THE SUCCESS CRITERION
      content: >-
        Toy certified recovery at n <= 16: among the F3 shortest vectors select
        the two with Y == I (mod 2); take V; form the kernel sublattice
        {y in R^2 : tau(y) = V^{-1} y}; find a short vector by enumeration;
        assemble a candidate B'; CERTIFY by the exact integer identity
        B'* B' == Q.
      authorization: >-
        NOT AUTHORIZED BY THIS CONTRACT. Stage 4 requires a separate committed
        Coordinator authorization in addition to approval of the contract, and
        its result is toy-tier regardless of outcome.

  replication:
    planned_runs: 1
    seeds: >-
      Every instance is derived from master_seed 20260805 through the seed
      derivation rule; the "seeds" of this contract are the counters t, which
      run 0..19 per (n, arm) for keys and nulls and 0..4 per (n, e) for the
      graded arm. A replication is a re-execution with master_seed 20260806,
      which is DECLARED HERE so that a replicator does not choose one after
      seeing results.
    interpretation: >-
      One run is an instrument-validation attempt. It cannot by itself support,
      reject or validate Proposition 4.5, any SVP-dimension claim, or any
      statement about HAWK beyond the toy scope declared above.

  budget:
    maximum_runs: 1
    maximum_wall_seconds: 21600
    maximum_cpu_seconds: 21600
    maximum_peak_rss_bytes: 4294967296
    maximum_workers: 1
    maximum_enumeration_nodes_per_cell: 100000000
    maximum_total_disk_bytes: 2147483648
    no_network: true
    dependencies: >-
      Python 3 standard library only. numpy 2.4.6 is present in this container
      (verified this session) and MAY be used for non-load-bearing diagnostics
      only; NO EXACT RESULT MAY DEPEND ON FLOATING POINT. sympy, sage, fpylll
      and PARI/GP are ABSENT (verified this session) and the contract is
      designed to need none of them. A run that discovers it needs one of them
      is an infrastructure signal and a contract defect, not a result.

  stopping_rules:
    - Do not execute unless separately approved, frozen, archived and authorized.
    - Stop at Stage 1 if PC-1 fails at n = 4.
    - Stop before Stage 3 if CHK-3, CHK-4 or CHK-5 fails at any n.
    - Stop before the treatment arm if the null-first hash commitment is absent.
    - Stop at a cell boundary on wall-clock, CPU, RSS or node-budget exhaustion.
    - >-
      Stop and escalate to independent review before writing anything if F1 and
      F2 pass while F3 or F4 fails, since that outcome would be framed as
      contradicting an external result and AGENTS.md rule 12 then applies.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any use of floating point in a value reported as exact.
    - Any non-integer entry in G, or any Gram matrix that fails CHK-5.
    - Any treatment invariant computed or inspected before the null commitment exists.
    - Any change to the frozen lattice definition, the seed rule, or the preregistered values after any measured number has been observed, other than through a versioned protocol_amendment recorded as exploratory_only.
    - Any comparison of a number produced here to a relayed gate count or blocksize.

  infrastructure_failure_disposition: >-
    A timeout, a crash, an out-of-memory condition, a missing dependency, or
    enumeration node-budget exhaustion is reported as INFRASTRUCTURE SIGNAL with
    its measured values (elapsed seconds, peak RSS, node count, the missing
    module name) and is NEVER negative mathematical evidence about
    H-HAWK-c7a551, about Proposition 4.5, or about any HAWK claim (AGENTS.md
    rule 5). This disposition is stated explicitly because the enumeration is
    ASYMMETRIC: if the hypothesis holds the tree is nearly branch-free, and if
    it does not the tree may blow up -- so budget exhaustion is weakly
    correlated with the hypothesis being false and MUST NOT be read as evidence
    for that. The correct report is "F3/F4 not determined at this cell, node
    budget reached at N nodes".

  success_criterion: >-
    Only positive disposition: PC-1 passes 20/20 at every n; CHK-3, CHK-4 and
    CHK-5 pass at every n; the null-first commitment exists; NULL-1 returns rank
    strictly below n at 20/20; NULL-1b returns 0/20; NULL-2's rank is n at e = 0
    and strictly below n and non-increasing for e >= 1; the key-to-key spread of
    each invariant is exactly one distinct value; and F1, F2, F3, F4 equal the
    preregistered values at n = 4, 8 and 16, with n = 32 reported but OUTSIDE
    the gate because it is node-budget-bound. THIS DISPOSITION ESTABLISHES ONLY
    the toy-scope statement in claim_ceiling. It establishes no attack, no cost,
    no exponent, and nothing about deployed HAWK parameters.
  falsification_criterion: >-
    The contract falsifies H-HAWK-c7a551 over its declared boundary if PC-1
    passes 20/20 and all three self-tests pass and the nulls behave as forced,
    AND any of F1-F4 differs from its preregistered value at n = 4, 8 or 16.
    THE REPORTING ORDER IS FROZEN HERE: such a result is stated FIRST as a
    falsification of this program's derived defining system and only SECOND as a
    question about the source, and the report must name which of the diagnostic
    signatures it matches (F1 = 2n means a missing public constraint; F2 wrong
    with F1 right means the length form; F3 or F4 wrong with F1 and F2 right
    means the splitting). If instead PC-1 fails, NOTHING IS FALSIFIED except the
    derivation, and no statement about the source may be made at all.

  scale_relevance:
    tier: toy
    why_conclusions_transfer: >-
      F1-F4 are consequences of an algebraic isometry whose statement does not
      depend on n, so agreement at n = 4, 8, 16 is a CHECK OF A DERIVATION
      rather than an extrapolation from small instances. That is the only sense
      in which anything here transfers.
    stated_limit: >-
      Nothing else transfers. Deployed HAWK has n in {256, 512, 1024}; this
      contract reaches 32. No cost, exponent, blocksize or security statement
      may be derived from any outcome, and Stage 4's recovery, if it runs, is a
      toy recovery with brute-force enumeration substituting for the source's
      block reduction and is labelled one on every citation.

  required_artifacts_if_later_authorized:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - The null-arm outputs and their SHA-256 commitment, timestamped before any treatment output.
    - Per (n, arm, key): the constraint matrix digest, the HNF basis, G, and F1-F4.
    - CHK-3/CHK-4/CHK-5 results and the enumeration node counts per cell.
    - Key-to-key spread table, reported before the comparison against preregistered values.
    - Full seed transcript sufficient to regenerate every instance bit-for-bit.
    - Manifest, environment (including the numpy/sympy/sage/fpylll presence check), exact command, stdout, stderr, timings, peak RSS.
    - Execution report stating which stage terminated the run and why.
    - Snapshot archive followed by independent Validator and Red Team review before any evidence record.

  approval_requirements:
    - Independent review confirms the derived lattice definition is internally consistent and that its failure modes are separated as claimed.
    - Independent review confirms that no arm can produce a statement above the declared claim ceiling.
    - Coordinator separately approves and freezes without editing this draft.
    - Stage 4 requires an additional, separately committed authorization.
  approval_status: >-
    Pending review. No approved_by field is present because this contract is not
    approved and only the Coordinator may approve it (AGENTS.md rule 1).
