# EXP-GFPN-a43c4a
# Interval exponents. No kangaroo.
# Approved by DEC-20261002-632d69.
experiment:
  id: EXP-GFPN-a43c4a
  hypothesis_id: H-GFPN-9c5a1f
  source_idea: IDEA-20260920-a05ca7
  question_id: RQ-GFPN-c01af8
  version: 1
  title: Interval exponents against the rho factor
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-632d69
  objective: >-
    Check the four interval exponents, the ratio against the rho
    factor, and the constant-17/10 bounds.
  inputs:
    widths: [320, 256, 254, 200]
    exponents: [161, 129, 128, 101]
    rho_num: 443
    rho_den: 500
    ratio_num: 1000
    ratio_den: 443
    ratio_above_two_num: 114
    ratio_above_two_den: 443
    fifth_low: 34123111620886
    fifth_high: 31250000000000
    tenth_low: 582193373345722589095712498
    tenth_high: 976562500000000000000000000
    written_rho_low_num: 1598
    written_rho_low_den: 10
    written_rho_high_num: 1599
    written_rho_high_den: 10
    log_low_num: 3
    log_low_den: 4
    log_high_num: 4
    log_high_den: 5
    threshold_low_num: 1272
    threshold_low_den: 5
    threshold_high_num: 509
    threshold_high_den: 2
    written_threshold: 255
    factor_num: 17
    factor_den: 20
    factor_log_low_num: -1
    factor_log_low_den: 4
    factor_log_high_num: -1
    factor_log_high_den: 5
    jump_30: 16384
    jump_40: 524288
  controls:
    - >-
      The full-width exponent is 161. Reporting 159.8 invalidates
      the run.
    - >-
      The ratio is 1000/443. Reporting it as 2 invalidates the run.
    - >-
      The constant-17/10 threshold lies strictly below 509/2.
      Reporting it as 255 invalidates the run.
    - >-
      Twice the fifth power of 443 exceeds the fifth power of 500.
      Reporting the opposite invalidates the run.
    - >-
      The jump at width 2 to the 30 is 16384. Reporting 32768
      invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - width in {320, 256, 254, 200}
    - route in {shift, product}
  metrics:
    primary:
      - exponent_320
      - ratio_over_rho
      - implementations_agree
    secondary:
      - threshold_band
      - jump_30
      - fifth_comparison
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The exponent 161 and the ratio 1000/443.
    formula: >-
      For even k the constant-2 cost is 2 to the power 1 plus k over
      2. Dividing the k equal to 320 cost by 443/500 times 2 to the
      160 gives 1000/443. The rho-factor logarithm sits between 159.8
      and 159.9 because the fifth-power and tenth-power comparisons
      go opposite ways. The constant 17/10 has logarithm between 3/4
      and 4/5.
    source: >-
      IDEA-20260920-a05ca7 states the k-to-bits row, read 2026-10-02.
      The powers were computed in this design session. That
      computation is not a run. No kangaroo was executed. The
      recalled interval papers named in the proposal were not opened.
  scale_relevance:
    tier: toy
    justification: Four even widths. No transfer to a running herd.
    correspondence: null
  tail_checks:
    - The width-200 row is required. Stopping at width 254 and still reporting the exponent 101 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the full-width exponent is reported as 159.8, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The full-width exponent is reported as 159.8.
    - The ratio is reported as 2.
    - The constant-17/10 threshold is reported as 255.
    - The fifth-power comparison is reversed.
    - The jump at width 2 to the 30 is reported as 32768.
    - A kangaroo, a herd, or a sampling audit is reported.
  success_criterion: >-
    Both runs agree that the exponents are 161, 129, 128 and 101,
    that the ratio is 1000/443, that the rho-factor logarithm lies
    strictly between 159.8 and 159.9, that the constant-17/10
    threshold lies strictly between 1272/5 and 509/2, and that the
    jump halves are 16384 and 524288.
  falsification_criterion: >-
    The runs agree, the full-width exponent stays 161, and any
    factor differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-GFPN-a43c4a/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-GFPN-a43c4a/runs/<RUN-ID>/command.txt
    - experiments/EXP-GFPN-a43c4a/runs/<RUN-ID>/stdout.log
    - experiments/EXP-GFPN-a43c4a/runs/<RUN-ID>/stderr.log
    - experiments/EXP-GFPN-a43c4a/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-GFPN-a43c4a/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any kangaroo, herd, or distinguished-point walk.
    - Any audit of a scalar sampler or a deployment.
    - Any claim that a secret is narrower than the group order.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
