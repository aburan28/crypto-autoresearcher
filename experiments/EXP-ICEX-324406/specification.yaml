experiment:
  id: EXP-ICEX-324406
  hypothesis_id: H-ICEX-267ebc
  derived_from_idea: IDEA-20260807-291968
  question_id: RQ-ECDLP-002
  batch_id: BATCH-d6838c
  version: 1
  title: >-
    MEASURE THE RELATION MATRIX AS A FIRST-CLASS OBJECT- rank logged after every
    certified relation at four field sizes, against a support-matched random
    sparse null over the SAME modulus, with rank reported PER PRIME FACTOR because
    the one committed fixture has a composite group order, a planted block
    structure of known size that the exponent fit must detect, and the source
    oversampling band replaced because its null value is itself 1.000
  status: draft
  objective: >-
    (A) THE UNCERTAINTY. FINDING-PF-IC-001 places the prime-field index-calculus
    cost in the |F|-size linear algebra rather than in the solving degree. No
    record measures, over prime fields, the oversampling factor, the row-weight
    distribution, the rank profile as relations accumulate, the solve exponent on
    real harvested matrices, or the matrix memory footprint. Every ICEX and ECDLP
    comparison in this repository carries an ASSUMED c_LA * B^omega term.
    (B) WHAT IS BUILT. One harvester and one matrix recorder over four field sizes
    at a fixed harvest parameter, logging the rank after EVERY certified relation
    until saturation, with three arms sharing one field-operation counter and one
    memory probe- (REAL) the harvested matrix; (NULL) a support-matched random
    sparse matrix over the same modulus with the same dimensions and row-weight
    distribution; (PLANT) a block-diagonal matrix of known structure whose solve
    exponent is known in advance.
    (C) THE TWO DESIGN DEFECTS THIS CONTRACT REPAIRS, BOTH STATED BEFORE THE
    DESIGN.
      DEFECT 1, A WIDTH-ZERO BAND. The source pre-registers the oversampling
      factor as -any value stably above 1.0-. For a random matrix over a large
      field the expected rows to reach rank B-1 is B-1 plus a vanishing excess, so
      the null value IS essentially 1.000 and the band has zero width on the wrong
      side- noise alone crosses it. REPLACED BY the DIFFERENCE rho_real - rho_null
      measured in the same run, with departure at 0.15 and agreement at 0.05,
      sized to a per-cell standard error of about 0.02 obtained with at least 10
      harvest seeds per cell.
      DEFECT 2, AN ILL-POSED FORCED VALUE. The source proposes the forced value
      -rank must be exactly B-1, never B-. The one committed fixture,
      EV-SEMAEV-b3db54, has p = 1009 with GROUP ORDER N = 951 = 3 * 317, which is
      COMPOSITE. Gaussian elimination mod a composite modulus does not compute a
      field rank and the gate is not well posed without naming the ring. REPLACED
      BY rank reported PER PRIME FACTOR of the group order via the Chinese
      remainder decomposition, with the modulus named on every rank row, and with
      the B-1 gate required to EXHIBIT its kernel vector rather than assert it.
    (D) WHAT IS NOT DECIDED. RQ-ECDLP-002 in either direction; the headline of
    FINDING-PF-IC-001, which is not revised; and anything at cryptographic factor
    base size, which is unreachable.
  inputs:
    cost_unit: >-
      SOLVE COST IS COUNTED IN FIELD OPERATIONS in the named modulus, by an
      explicit counter shared across all three arms. WALL-CLOCK SECONDS ARE
      RECORDED FOR BUDGET ACCOUNTING ONLY and never enter a fit, a ratio or a
      comparison. MEMORY is reported as counted STORED NONZEROS and separately as
      allocator-level BYTES, side by side, neither substituted for the other. NO
      QUANTITY IN THIS CONTRACT IS A WALL-CLOCK FIGURE DIVIDED BY AN OPERATION
      COUNT.
    unit_discipline: >-
      BINDING. Every value carries a tag in {field_ops, stored_nonzeros, bytes,
      relations, seconds, dimensionless}. Cross-tag arithmetic requires a named
      recorded conversion. Both sides of every ratio carry the same tag- the
      oversampling ratio is relations over relations, the exponent difference is
      dimensionless over dimensionless, the memory comparison is bytes against
      bytes and nonzeros against nonzeros.
    modulus_discipline: >-
      BLOCKING AND ENFORCED. The group order N is factored per instance and
      recorded. Rank, kernel and solve are computed and reported PER PRIME FACTOR,
      with the modulus printed on every row. A rank or solve figure without its
      modulus is INADMISSIBLE OUTPUT and the harness refuses to emit one. This
      requirement exists because the only committed fixture has N = 951 = 3 * 317.
    certificate_discipline: >-
      Every harvested relation carries a certificate re-verified independently of
      the collector, per docs/claims-and-verification.md. An uncertified relation
      is DISCARDED AND COUNTED and never enters the matrix. The count of discarded
      relations is reported per cell.
    frozen_before_execution: >-
      The harvest parameter beta = 1/m, the arity m = 3, the field-size ladder,
      the seed lists, the bands 0.15 and 0.05 on P1 and 0.35 and 0.15 on P2, the
      B < 32 fit-exclusion rule, the two named solvers, and the planted block
      count k = 4. None may change after any cell runs.
    procedure: >-
      STAGE 0 (blocking regression, minutes). Reproduce the committed fixture-
      p = 1009, N = 951, B = 54, harvest to the committed 59 relations under the
      recorded convention, run Gaussian elimination mod N and require EXACTLY 45
      of 54 factor-base logs solved with 9 unsolvable. Report the same computation
      per prime factor 3 and 317 alongside, as the modulus-discipline row. A
      mismatch on the composite-modulus figure HALTS the run.
      STAGE 1 (null construction check). For each cell, build the support-matched
      random sparse null from the REAL matrix measured dimensions and row-weight
      histogram, and verify by a two-sample test that the null weight histogram
      matches the real one. This is a CONSTRUCTION CHECK, is reported as such, and
      is excluded from the departure count. A mismatch means the null is wrong and
      the run is INVALID.
      STAGE 2 (main harvest). At field bits 12, 16, 20 and 24 with beta fixed,
      harvest certified relations, LOGGING THE RANK PER PRIME FACTOR AFTER EVERY
      APPENDED RELATION, until rank B-1 is attained over every prime factor or the
      per-cell budget is exhausted. At least 10 independent harvest seeds per
      cell. Record the rank-versus-relations curve, the oversampling factor rho,
      the row-weight histogram, peak stored nonzeros and peak bytes.
      STAGE 3 (solve exponent). Solve each saturated system with BOTH named
      solvers, counting field operations, on the REAL, NULL and PLANT arms at
      matched dimension and weight, at least 5 seeds per cell. Fit the exponent by
      log-log regression of field operations against B over B in
      {16, 40, 101, 256}, EXCLUDING cells with B below 32 by the rule declared
      here.
      STAGE 4 (planted defect). Build block-diagonal matrices with k = 4 equal
      blocks at each cell dimension and weight and fit their exponent. The
      pipeline MUST report an exponent at least 0.5 below the null at k = 4.
      STAGE 5 (forced-value gate). At saturation, over each prime factor, test
      whether the rank is B-1 or B and EXHIBIT the kernel vector when it is B-1.
      Report both readings when it is B, without assuming either.
      STAGE 6 (report). Emit the five metric tables, the departure counts against
      their bands, the censored-cell inventory, and the discarded-relation counts.
    mechanism: >-
      STEP 1. One harvester, one matrix recorder, one field-operation counter, one
      allocator probe, one seed list. The NULL arm and the PLANT arm consume the
      SAME recorder, counter, probe and solvers as the REAL arm and differ only in
      where their rows come from.
      STEP 2. The matrix recorder appends one certified relation at a time and
      recomputes the rank incrementally per prime factor, so the
      rank-versus-relations curve is exact and reproducible from the relation
      stream and its seed.
      STEP 3. Peak memory is measured with an allocator-level probe rather than
      estimated. A memory figure derived from the model being tested would be
      circular and is forbidden.
      STEP 4. Every row is reported as (arm, field bits, B, modulus, seed,
      relations appended, rank, field operations, stored nonzeros, bytes, solver,
      wall seconds), never as a scalar.
    instrument: >-
      The existing relation harvester plus a matrix recorder and an
      allocator-level memory probe. Largest object- a 256 by 256 matrix over the
      largest prime factor of N at bits 24, plus its relation stream; well under
      the memory cap. Two solvers are named in the manifest before the run- one
      dense elimination and one sparse solver - and their profiles are reported
      separately and never merged.
  controls:
    - >-
      CONTROL 1, CURVE-FREE SUPPORT-MATCHED NULL (blocking, and the arbiter of
      what may be said). A random sparse matrix over the SAME modulus with the
      SAME dimensions and the SAME row-weight distribution, containing no curve,
      no group and no factor base. PRE-STATED CONSEQUENCE, FROZEN HERE- if every
      statistic matches the null within its agreement band, the harvested relation
      matrix is generic for its shape, the assumed c_LA * B^omega term is
      justified, and NO RESULT OF THIS EXPERIMENT MAY BE QUOTED AS A STATEMENT
      ABOUT ELLIPTIC CURVES OR THE ECDLP.
    - >-
      CONTROL 2, COMMITTED REGRESSION FIXTURE (blocking). EV-SEMAEV-b3db54 at
      p = 1009, N = 951, B = 54- exactly 45 of 54 factor-base logs solved from 59
      relations. A mismatch means this harness is not the one that produced the
      only committed prime-field IC run and nothing downstream is admissible.
    - >-
      CONTROL 3, PLANTED BLOCK STRUCTURE OF KNOWN SIZE (blocking). Block-diagonal
      matrices with k = 4 equal blocks at matched dimension and weight. REQUIRED
      MAGNITUDE- a fitted solve exponent at least 0.5 below the support-matched
      null. A control that merely returns a number proves nothing; this one has a
      known answer and must produce it. If the planted structure is not detected,
      every negative in this experiment is VOID and the run is INVALID.
    - >-
      CONTROL 4, NULL CONSTRUCTION CHECK (blocking, reported, NOT counted as
      evidence). The null row-weight histogram must match the real one, since the
      null is built to match it. Agreement here is a construction check;
      disagreement means the null is wrong and the run is INVALID.
    - >-
      CONTROL 5, FORCED-VALUE RANK GATE WITH AN EXHIBITED WITNESS. At saturation
      the rank per prime factor is B-1 and the kernel vector is EXHIBITED, or the
      rank is B and both readings are reported without either being assumed.
    - >-
      CONTROL 6, TWO SOLVERS. Dense elimination and a sparse solver on every
      matrix, reported separately with the solver named, because their memory
      profiles differ by orders of magnitude and a merged figure calibrates
      nothing.
  independent_variables:
    - field bits in {12, 16, 20, 24}, hence B in approximately {16, 40, 101, 256}
    - arm in {REAL harvested, NULL support-matched random, PLANT block-diagonal}
    - solver in {dense elimination, sparse}
    - prime factor of the group order (rank and solve are reported per factor)
  metrics:
    primary:
      - >-
        oversampling difference rho_real - rho_null, rho = relations at first
        attainment of rank B-1 divided by B-1 (dimensionless, relations over
        relations)
      - >-
        fitted solve exponent difference omega_real - omega_null over B, from
        FIELD-OPERATION counts (dimensionless)
      - >-
        rank-versus-relations curve per prime factor, per cell, per seed
    secondary:
      - row-weight histogram, real and null, per cell (counts)
      - peak stored nonzeros and peak allocator bytes per cell per solver
      - discarded uncertified relation count per cell
      - planted-block fitted exponent and its gap to the null (dimensionless)
      - forced-value rank gate outcome and the exhibited kernel vector per factor
      - wall-clock seconds per run, for budget accounting only
  heuristic_under_test: HEUR-RELMAT-1
  preregistered_prediction:
    quantity: >-
      The oversampling factor at first attainment of rank B-1, and the fitted
      solve exponent in B, each for the harvested matrix and for a support-matched
      random sparse matrix over the same modulus.
    formula: >-
      rho_null approximately 1.000 plus a vanishing excess for a random matrix
      over a large field; departure declared at rho_real - rho_null above 0.15,
      agreement at absolute difference at most 0.05. Exponent departure at
      |omega_real - omega_null| above 0.35, agreement at most 0.15. Planted k = 4
      block structure must fit at least 0.5 below the null.
    source: >-
      The classical statement that a uniformly random matrix over a field of order
      q reaches full rank with an expected row excess summing 1/(q^i - 1) over
      i >= 1, which vanishes for the large prime factors here. Used to SIZE A
      BAND, not to make a claim. The 0.15 departure threshold is anchored to the
      committed fixture, where 59 relations against 54 unknowns had NOT saturated,
      giving rho at least 1.113.
  scale_relevance:
    tier: toy
    justification: >-
      Field bits at most 24 and B at most 256. The dimensionless quantities - the
      oversampling difference and the exponent difference - are the parts with any
      chance of transferring; the absolute memory figures and every wall-clock
      number are properties of this implementation at these sizes. TRANSFER
      ASSUMPTION, STATED- that the SIGN of a real-minus-null difference is stable
      as B grows. Its magnitude is not claimed to be, and the fit reports the
      trend with its interval rather than a point value.
    correspondence: null
  tail_checks:
    - >-
      The maximum row weight per cell against the null maximum, since a heavy tail
      in the real supports is exactly the structure the mean histogram cannot see.
    - >-
      The number of relations appended AFTER rank B-1 that still increase nothing,
      reported per cell, as the direct check on whether harvesting is producing
      dependent rows at a rate the null does not.
  replication:
    seeds: >-
      At least 10 independent harvest seeds per cell for the oversampling metric
      and at least 5 per cell for the exponent fit, listed explicitly in the run
      manifest before stage 2. The same seed list drives the REAL and NULL arms so
      the comparison is paired.
    independent_instances: 10
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 20.0
    maximum_memory_gb: 8
    maximum_runs: 60
  stopping_rules:
    - >-
      A cell whose harvest does not reach rank B-1 within its per-run budget is
      recorded as CENSORED with the budget, the relations appended and the rank
      reached per prime factor. Censoring is an infrastructure receipt under
      AGENTS.md rule 5 and is NEVER evidence about the matrix.
    - >-
      Stage 0 regression failure HALTS the run before any other stage.
    - >-
      Stage 1 null-construction failure marks the run INVALID.
    - >-
      Total wall-clock at the declared cap; remaining cells are recorded as NOT
      ATTEMPTED rather than as failures.
  invalidation_rules:
    - >-
      Any relation entering the matrix without an independently reverified
      certificate invalidates the cell.
    - >-
      A rank, kernel or solve figure emitted without its modulus invalidates the
      run.
    - >-
      The planted block structure not detected at the required magnitude
      invalidates the whole run, because a pipeline blind to a known structure
      cannot certify the absence of an unknown one.
    - >-
      Any arm using a counter, probe or solver not shared with the others
      invalidates the comparison.
    - >-
      A memory figure derived from the cost model rather than measured by the
      allocator probe invalidates the memory table.
  success_criterion: >-
    The stage 0 fixture reproduces 45 of 54; the null construction check passes;
    the planted block structure is detected at least 0.5 below the null; and the
    five metric tables are emitted at all four sizes with their bands evaluated
    and the modulus named on every row. Success here is the EXISTENCE OF THE
    MEASUREMENT with its controls, not a particular direction of the result.
  falsification_criterion: >-
    Every statistic matches the support-matched null within its agreement band at
    all four sizes. Then the relation matrix is generic for its shape, the
    assumed c_LA * B^omega term is justified by measurement, and by the
    pre-stated consequence NOTHING HERE MAY BE QUOTED AS AN ELLIPTIC-CURVE OR
    ECDLP STATEMENT. Separately- a departure exceeding a band must be replicated
    at a second size before it is described as anything.
  required_artifacts:
    - exact command, git commit and dirty-tree state, environment and versions
    - the frozen parameter file with beta, m, the field ladder, the seed lists, the bands and the solver names
    - per-instance group order with its prime factorisation
    - per-relation certificate and its independent reverification result
    - rank-versus-relations curve per prime factor per cell per seed
    - the oversampling table with rho_real, rho_null and their difference with standard errors
    - the exponent fit outputs in FIELD OPERATIONS with intervals, per arm per solver
    - the planted-block arm output and its gap to the null
    - row-weight histograms for real and null, per cell
    - peak stored nonzeros and allocator bytes per cell per solver
    - forced-value rank gate outcome with the exhibited kernel vector per factor
    - censored and not-attempted cell inventory with budgets and ranks reached
    - discarded uncertified relation counts
    - stdout, stderr, timestamps, resource measurements
    - inference block- requested policy, backend, resolved model id, effort, fallback, degraded requirements
  assigned_to: executor
  approved_by: null
  limitations:
    - >-
      TOY SCALE, field bits at most 24 and B at most 256. THE c_LA * B^omega TERM
      AT CRYPTOGRAPHIC FACTOR-BASE SIZE IS NOT TESTABLE AT ANY SCALE THIS PROGRAM
      CAN REACH, since a cryptographic base is 2^40 or larger and neither the
      harvest nor the solve is within any reachable budget. Stated here rather
      than the claim being quietly shrunk.
    - >-
      A measured c_LA replaces an assumed one and can move cost comparisons in
      EITHER direction, including against index calculus. It is not an attack and
      moves no exponent.
    - >-
      Nothing here revises the headline of FINDING-PF-IC-001; it measures the term
      that finding says dominates.
    - >-
      IF THE SUPPORT-MATCHED NULL MATCHES, NOTHING HERE IS AN ELLIPTIC-CURVE
      STATEMENT. Pre-stated so it cannot be renegotiated after the data.
    - >-
      Rank over a composite modulus is NOT field rank. Every rank figure is per
      prime factor with the modulus named.
    - >-
      At B = 16 constants dominate any exponent fit; those cells are measured and
      reported but excluded from every fit BY A RULE DECLARED BEFORE THE RUN.
    - >-
      claim_tier toy. No attack, no exponent moved, sota_delta zero. Dominated by
      Pollard rho at exponent 1/2 on every row.
  yaml_parse_disclosure: >-
    Written by a Coordinator subagent without an interpreter. Every prose value is
    a folded block scalar; no tabs; no duplicate keys to the author reading. THIS
    AGENT COULD NOT RUN A STRICT YAML PARSE OR tools/validate_ledger.py AND DID
    NOT DO SO; the orchestrating session must run both before this contract is
    reviewed.
