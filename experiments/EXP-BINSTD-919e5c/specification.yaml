# EXP-BINSTD-919e5c
# Replay-band arithmetic. No trace.
# Approved by DEC-20261003-f5292f.
experiment:
  id: EXP-BINSTD-919e5c
  hypothesis_id: H-BINSTD-9cc4af
  source_idea: IDEA-20261001-c35b2a
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Replay band versus the batch floor
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-f5292f
  objective: >-
    Check the sum 100, the cross gap 3, and the product 18.
  inputs:
    n_17: 17
    n_19: 19
    ell: 3
    cells: 2
    batch_floor: 50
    slots: 100
    accept_hundredths: 80
    null_hundredths: 20
    half_hundredths: 50
    hundredths_sum: 100
    accept_equal_gap: 0
    null_equal_gap: 0
    half_equal_gap: 0
    accept_half_gap: 3
    half_null_gap: 3
    hundredths_gap: 60
    n_gap: 2
    factor: 2
    gap_product: 18
    n_product: 323
    n_sum: 36
  controls:
    - >-
      Two times 50 is 100. Eighty plus 20 is 100. Reporting the sum
      as different from 100 invalidates the run.
    - >-
      Four times 100 minus 5 times 80 is 0. One times 100 minus 5
      times 20 is 0. One times 100 minus 2 times 50 is 0. Four times
      2 minus 5 times 1 is 3. One times 5 minus 2 times 1 is 3.
    - >-
      Eighty minus 20 is 60. Nineteen minus 17 is 2. The product of
      3, 3, and 2 is 18. Seventeen times 19 is 323. Seventeen plus
      19 is 36.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {bands, cross, product}
    - route in {difference, product}
  metrics:
    primary:
      - hundredths_sum
      - gap_product
      - implementations_agree
    secondary:
      - accept_half_gap
      - hundredths_gap
      - n_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Eighty plus 20 is 100. Four times 2 exceeds 5 by 3. The
      product of 3, 3, and 2 is 18.
    formula: >-
      Add 80 and 20. Subtract 5 times 1 from 4 times 2. Multiply 3,
      3, and 2. Subtract 2 times 50 from 1 times 100.
    source: >-
      IDEA-20261001-c35b2a states the n list 17 and 19, the dimension
      3, the batch floor 50, and the bands 0.5, 0.8, and 0.2, read
      2026-10-03. The products were recomputed in this design
      session. That computation is not a run. No trace was learned.
  scale_relevance:
    tier: toy
    justification: Two listed n values and three written bands. No transfer to a wall time.
    correspondence: null
  tail_checks:
    - The product 18 and the cross gap 3 are required. A check that stops at the sum 100 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the sum 100 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The hundredths sum is not 100.
    - The cross gap is not 3.
    - The product is not 18.
    - A trace is learned, or 4 over 5 is reported as 1 over 2.
  success_criterion: >-
    Both runs agree that 80 plus 20 is 100, that twice 50 is 100,
    that 4 times 2 minus 5 times 1 is 3, that 1 times 5 minus 2 times
    1 is 3, and that the product of 3, 3, and 2 is 18.
  falsification_criterion: >-
    The runs agree that 80 plus 20 is computed, and that sum is not
    100.
  required_artifacts:
    - experiments/EXP-BINSTD-919e5c/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-919e5c/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-919e5c/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-919e5c/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-919e5c/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-919e5c/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any trace, F4 run, or wall-time ratio.
    - Any claim that replay cuts a batch cost.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
