experiment:
  id: EXP-ECDLP-ba780a
  hypothesis_id: H-ECDLP-9a49a8
  version: 1
  title: >-
    Conservation-law detector for post-archival record rewrites - S1/S2/S3 over
    the committed history with commit 5de2db97 as the required known positive,
    the documented mechanical reshape and a legal superseding correction as
    matched nulls that must stay silent, four planted-edit classes on synthetic
    histories, and a flat-versus-rising sensitivity sweep at 1, 2, 5 and 20
    planted flips that distinguishes conservation from magnitude thresholding
  status: draft
  status_note: >-
    DRAFT. Not review_required and not approved. Coordinator design freeze
    converting IDEA-20260808-90c7ab into a testable protocol under
    TASK-20260904-43152a. Not snapshot-committed, not independently reviewed, NO
    RUN AUTHORIZED. Read-only with respect to the repository: no phase of this
    contract edits, rewrites or repairs any record.
  objective: >-
    Measure whether a value-multiset conservation predicate detects post-archival
    record rewrites without flagging legitimate mechanical reshapes or legal
    superseding corrections, establish its sensitivity floor at four planted-flip
    levels, and report the previously unmeasured baseline count of records whose
    values changed after birth, with the coverage fraction of the history
    examined.
  inputs:
    canonicalization_rule: >-
      Each record is parsed as YAML and reduced to the MULTISET of its scalar
      leaves, with nesting and key ordering discarded and numeric representation
      normalized to a canonical parsed form, so that string-level reformatting
      cannot change the projection. The rule is written to
      results/canonicalization.md and hashed before any commit is walked.
    signals: >-
      S1: a record's scalar value multiset changes in a commit later than its
      birth commit with no superseding record minted in that commit.
      S2: an evidence or decision record gains or alters numeric fields in a
      commit that adds zero files under a run-artifact path predicate, where that
      predicate is declared explicitly in results/canonicalization.md.
      S3: an archive receipt's declared record set differs from the commit's
      actual changed paths.
    disclosure_field_handling: >-
      S2 must distinguish ADDED disclosure fields from ALTERED claim fields. The
      declared rule is written before the run: an ADDITION of a leaf whose key
      path is absent in the parent version, where no existing leaf's value
      changed, is a DISCLOSURE ADDITION and does not fire S2; any change to an
      existing leaf's value does fire. Both counts are reported separately.
    known_positive: >-
      Commit 5de2db97, which per the committed correction rewrote three records
      93 minutes after archival in a 6-file change of 694 insertions and 213
      deletions adding zero run records. Its parent archival commit is a325d824.
  controls:
    - id: CTRL-KNOWN-POSITIVE
      description: >-
        BLOCKING KNOWN POSITIVE. Commit 5de2db97 MUST fire S2. The firing must
        name the three rewritten records and must report the value-multiset delta
        for each.
      failure_meaning: >-
        Failure invalidates the instrument entirely; NO other verdict it produces
        is admissible.
    - id: NULL-DOCUMENTED-RESHAPE
      description: >-
        NAMED MATCHED NULL, CAN FAIL. The documented mechanical reshape whose own
        note asserts that no field's VALUE was changed must NOT fire S1. The
        record's reshape note is quoted verbatim into the run package and used as
        ground truth.
      failure_meaning: >-
        A detector that flags legitimate reshapes will be switched off within a
        week and is useless regardless of its sensitivity. If it fires here,
        either the reshape was not pure or the canonicalization is wrong, and
        BOTH outcomes are reportable and must be distinguished by inspecting the
        multiset delta element by element.
    - id: NULL-LEGAL-PATH
      description: >-
        SECOND NAMED NULL. A value change accompanied by a superseding record
        minted in the SAME commit must NOT fire. This is the legal correction
        path the contract requires, and penalizing it would penalize compliance.
      failure_meaning: >-
        If it fires, the instrument punishes exactly the behaviour the program
        mandates, and it may not be deployed.
    - id: CTRL-PLANTED-CLASSES
      description: >-
        FOUR PLANTED EDIT CLASSES ON SYNTHETIC HISTORIES, each with a declared
        required outcome fixed before the run: (a) a value flipped with no
        superseding record - MUST FIRE; (b) a value flipped WITH a superseding
        record minted in the same commit - MUST NOT FIRE; (c) a pure reshape
        preserving all values - MUST NOT FIRE; (d) a reshape that ALSO flips one
        value - MUST FIRE. Class (d) is the hard case and the shape of the real
        incident.
      failure_meaning: >-
        Any class returning the wrong outcome localizes the defect to that class
        and voids the corresponding signal.
    - id: CTRL-SENSITIVITY-SWEEP
      description: >-
        DEMONSTRATED DYNAMIC RANGE WITH PLANTED DEFECTS OF KNOWN SIZE, AND THE
        DISCRIMINATING CONTROL OF THIS CONTRACT. Plant exactly 1, 2, 5 and 20
        flipped values inside an otherwise legitimate large change, at least 20
        independent synthetic histories per level. Detection rate is measured per
        level. PRE-REGISTERED REQUIREMENT: the rate must be FLAT AT 1.0 across
        all four levels.
      failure_meaning: >-
        A detection rate that RISES with the number of planted flips means the
        detector is thresholding on change MAGNITUDE rather than on the
        conservation law - the wrong mechanism, and a pre-registered
        falsification of the design rather than a tuning problem. This control is
        what demonstrates the instrument responds to the DEFECT and not to the
        SIZE of the change containing it.
    - id: CTRL-COVERAGE-REPORT
      description: >-
        The fraction of the history actually examined is computed and reported
        with every result: records that do not parse, ranges with evidence of
        rebasing, and commits outside the examined window are all counted as
        UNCOVERED, itemized by path and range.
      failure_meaning: >-
        A firing count without a coverage fraction is uninterpretable, and an
        unresolvable range reported as clean would be a false negative presented
        as a result.
    - id: CTRL-READ-ONLY
      description: >-
        The driver is read-only with respect to the repository and the run
        manifest asserts it made no write outside its own experiment directory.
      failure_meaning: >-
        A detector that repairs what it finds would repeat the original defect;
        historical firings are handled by superseding records only.
  independent_variables:
    - 'signal, in {S1, S2, S3}'
    - 'history, in {committed real history, synthetic planted histories}'
    - 'planted edit class, in {a, b, c, d}'
    - 'planted flip count, in {1, 2, 5, 20}'
  metrics:
    primary:
      - >-
        S1, S2 and S3 firing counts over the committed history, integers, each
        firing itemized by record id, commit sha and value-multiset delta.
      - >-
        boolean: did commit 5de2db97 fire S2, with the three record ids and their
        deltas.
      - >-
        boolean per null: did NULL-DOCUMENTED-RESHAPE or NULL-LEGAL-PATH fire.
      - >-
        detection rate per planted-flip level, dimensionless in [0,1], with the
        number of synthetic histories per level.
      - >-
        per-class outcome on CTRL-PLANTED-CLASSES, four rows against four
        declared required outcomes.
      - >-
        total records whose value multiset changed after birth, as a count and as
        a fraction of records examined.
      - >-
        coverage fraction of the history examined, dimensionless, with the
        uncovered set itemized.
    secondary:
      - 'count of DISCLOSURE ADDITIONS distinguished from ALTERED claim fields, reported separately.'
      - 'every reshape in the real history whose multiset changed by a small number of elements, listed individually - these are precisely the reshapes-that-also-edited, the hardest and most important class.'
      - 'per-run wall clock and peak memory.'
  heuristic_under_test: HEUR-RESHAPE-1
  preregistered_prediction:
    quantity: >-
      The detection rate as a function of the number of planted flipped values.
    formula: >-
      Detection rate = 1.0 at every planted level, i.e. FLAT in the flip count,
      because the projection changes as soon as one value changes and is
      insensitive to how many do. A monotonically rising rate is the signature of
      magnitude thresholding and falsifies the mechanism.
    source: >-
      Derived in H-ECDLP-9a49a8 from the algebraic invariance of the leaf
      multiset under re-nesting. Not a distributional claim.
  scale_relevance:
    tier: null
    justification: >-
      NO MEASUREMENT AT ANY MATHEMATICAL SCALE. This is repository
      instrumentation. `tier` is null rather than `toy` because a scale label
      would falsely imply a measurement about a curve. The relevant limit is
      COVERAGE, not scale, and it is reported with every result.
    correspondence: null
  tail_checks:
    - >-
      Every reshape in the real history whose multiset changed by a SMALL number
      of elements is reported individually, because that is exactly the
      reshape-that-also-edited class and a pooled count would hide it.
    - >-
      The synthetic history at the 1-flip level with the largest legitimate
      change surrounding it is reported individually, as the hardest single case
      of the sensitivity floor.
    - >-
      The largest single uncovered range, reported with its reason, so that a
      clean sweep cannot be quoted without its blind spot.
  replication:
    seeds:
      - 'RUN-ECDLP-ba780a-1 (Phase 1: read-only sweep of the committed history, all three signals, known positive and both nulls): deterministic over history; recorded seed 20260904101'
      - 'RUN-ECDLP-ba780a-2 (Phase 2: synthetic histories, four planted edit classes): master seed 20260904102'
      - 'RUN-ECDLP-ba780a-3 (Phase 3: sensitivity sweep at 1, 2, 5, 20 planted flips): master seed 20260904103'
    independent_instances: 20
    replication_note: >-
      SEEDS POLICY. RUN-1 is deterministic over the real history and consumes no
      randomness; its recorded seed fixes reporting order only. RUN-2 and RUN-3
      generate synthetic histories from their declared master seeds, and the
      driver records the derivation rule, every derived seed, and the exact
      planted edit (record id, key path, prior value, planted value) for every
      synthetic history in the run manifest, so a reviewer can confirm what was
      planted rather than taking the detection rate on trust.
      `independent_instances: 20` is the per-level floor of synthetic histories
      in RUN-3. No seed may change after a run; a re-seeded protocol is a NEW
      contract.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 8
    maximum_runs: 3
    budget_feasibility_note: >-
      The sweep is linear in commits times records touched and streams over
      commits, so memory is negligible and a full-history pass is minutes. Wall
      clock and memory are at the template floors and are not the binding
      constraint; if the history is large enough that RUN-1 approaches the cap,
      the stopping rule requires it to report the uncovered range explicitly
      rather than silently truncating.
  stopping_rules:
    - >-
      ST-1 PER-RUN CAP. 600 seconds and 8 GB per run; on approaching the cap the
      run STOPS and reports the exact commit range and record set NOT examined,
      which is then counted in the uncovered fraction.
    - >-
      ST-2 STOP AND REPORT ON UNPARSEABLE STATE. A record that does not parse at
      some revision is recorded as UNCOVERED at that revision with its path; the
      driver does not attempt repair, does not guess, and does not fire.
    - >-
      ST-3 NO INTERPRETATION AND NO REPAIR. The run package emits firings and
      counts only. It must NOT edit any record, must not open any correction,
      must not write an evidence or decision record, and must not characterize
      any firing as fabrication.
    - >-
      ST-4 CANONICALIZATION FREEZE. The canonicalization rule and the
      run-artifact path predicate are frozen and hashed by RUN-1. A run that
      finds them awkward reports the case and STOPS; it does not adjust them.
  invalidation_rules:
    - >-
      INV-KNOWN-POSITIVE. Commit 5de2db97 does not fire S2: the instrument is
      broken and the entire run set is INVALID.
    - >-
      INV-RESHAPE-NULL. NULL-DOCUMENTED-RESHAPE fires S1: the detector is
      over-strict; INVALID for deployment, and the multiset delta must be
      itemized so that "impure reshape" and "wrong canonicalization" can be
      distinguished.
    - >-
      INV-LEGAL-NULL. NULL-LEGAL-PATH fires: the instrument penalizes contract-
      compliant corrections; INVALID.
    - >-
      INV-MAGNITUDE. The detection rate RISES with the planted flip count: the
      mechanism is magnitude thresholding and the design is INVALID as specified.
    - >-
      INV-REBASE. A range shows evidence of rebasing: it is reported as
      UNRESOLVABLE and excluded from every count, never reported as firings.
    - >-
      INV-WRITE. The driver made any write outside its own experiment directory:
      the run is INVALID and its outputs are discarded.
    - >-
      INV-INFRASTRUCTURE. A crash or git failure is recorded with its terminal
      status and IS INFRASTRUCTURE SIGNAL, never a firing.
  success_criterion: >-
    S1. Commit 5de2db97 fires S2 and names the three rewritten records;
    NULL-DOCUMENTED-RESHAPE and NULL-LEGAL-PATH both stay silent;
    CTRL-PLANTED-CLASSES returns the four declared outcomes including the hard
    class (d); CTRL-SENSITIVITY-SWEEP is FLAT at 1.0 across all four flip levels;
    and the full-history counts are emitted with an explicit coverage fraction and
    an itemized uncovered set. S1 MET means the conservation predicate is a usable
    standing detector at the measured sensitivity floor over the covered range. IT
    IS A CONTRACT-COMPLIANCE INSTRUMENT AND NOT A CRYPTOGRAPHIC RESULT.
  falsification_criterion: >-
    F1. The detection rate RISES with the planted flip count. The mechanism is
    magnitude thresholding rather than conservation and the design is wrong -
    this is the sharpest falsification available and it is decided purely from
    CTRL-SENSITIVITY-SWEEP. F2. NULL-DOCUMENTED-RESHAPE fires: the projection is
    not reshape-invariant, HEUR-RESHAPE-1 is falsified, and the detector is
    unusable until fixed. F3. Commit 5de2db97 does not fire: instrument broken,
    nothing reportable. F4. The false-positive rate from legitimate disclosure
    additions is high enough to make the detector unrunnable: reported as a
    DESIGN COST requiring a schema change to mark disclosure blocks, explicitly
    NOT as a refutation of the conservation law. F5, DECLARED IN ADVANCE AND
    BINDING UNDER EVERY OUTCOME: no output of this experiment may be quoted as a
    statement about elliptic curves or the ECDLP, no firing may be characterized
    as fabrication, and no firing may be repaired by editing the record that
    fired.
  required_artifacts:
    - experiments/EXP-ECDLP-ba780a/driver/conservation_detector.py
    - experiments/EXP-ECDLP-ba780a/driver/synthetic_history.py
    - experiments/EXP-ECDLP-ba780a/results/canonicalization.md
    - experiments/EXP-ECDLP-ba780a/results/canonicalization_hash.txt
    - experiments/EXP-ECDLP-ba780a/results/firings.json
    - experiments/EXP-ECDLP-ba780a/results/coverage.json
    - experiments/EXP-ECDLP-ba780a/results/sensitivity_sweep.json
    - experiments/EXP-ECDLP-ba780a/results/planted_manifest.json
    - experiments/EXP-ECDLP-ba780a/results/summary.json
    - experiments/EXP-ECDLP-ba780a/results/seed_env_manifest.yaml
    - experiments/EXP-ECDLP-ba780a/runs/RUN-ECDLP-ba780a-1/manifest.yaml
    - experiments/EXP-ECDLP-ba780a/runs/RUN-ECDLP-ba780a-1/results.json
    - experiments/EXP-ECDLP-ba780a/runs/RUN-ECDLP-ba780a-1/stdout.log
    - experiments/EXP-ECDLP-ba780a/runs/RUN-ECDLP-ba780a-2/manifest.yaml
    - experiments/EXP-ECDLP-ba780a/runs/RUN-ECDLP-ba780a-2/results.json
    - experiments/EXP-ECDLP-ba780a/runs/RUN-ECDLP-ba780a-2/stdout.log
    - experiments/EXP-ECDLP-ba780a/runs/RUN-ECDLP-ba780a-3/manifest.yaml
    - experiments/EXP-ECDLP-ba780a/runs/RUN-ECDLP-ba780a-3/results.json
    - experiments/EXP-ECDLP-ba780a/runs/RUN-ECDLP-ba780a-3/stdout.log
  required_artifacts_note: >-
    results/planted_manifest.json records, for every synthetic history, the
    record id, key path, prior value and planted value of each planted edit, so a
    reviewer can confirm what was planted rather than accepting a detection rate
    on trust. results/coverage.json itemizes every uncovered path and commit
    range with its reason. results/canonicalization.md and its hash are written
    by RUN-1 before any commit is walked and are referenced in all three
    manifests.
  run_plan:
    - id: RUN-ECDLP-ba780a-1
      description: 'Phase 1 read-only sweep of the committed history: S1/S2/S3, CTRL-KNOWN-POSITIVE, NULL-DOCUMENTED-RESHAPE, NULL-LEGAL-PATH, CTRL-COVERAGE-REPORT'
    - id: RUN-ECDLP-ba780a-2
      description: 'Phase 2 synthetic histories: CTRL-PLANTED-CLASSES, four declared classes including the reshape-that-also-flips'
    - id: RUN-ECDLP-ba780a-3
      description: 'Phase 3 sensitivity sweep at 1, 2, 5, 20 planted flips, at least 20 histories per level, flat-versus-rising test'
  provenance:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    independent_session: false
    independent_review_status: 'NOT YET REQUESTED. Contract is at `draft`.'
    design_session_verification_note: >-
      The Coordinator subagent that wrote this contract opened
      ledger/corrections/CORR-20260727-007.yaml by pattern search on 2026-09-04
      and read its defect (b) block verbatim, CONFIRMING every detail the source
      proposal reports: both commit shas and timestamps, the 82-file archival
      commit, the 6-file / 694-insertion / 213-deletion rewrite 93 minutes later,
      the zero run records, and the inversion of the conclusion. It also read the
      block's statement that the correction does NOT allege fabrication. It did
      NOT open the evidence record carrying the documented reshape note, and the
      experiment must open it and quote that note as ground truth for the reshape
      null.
  source_refs:
    - ledger/hypotheses/H-ECDLP-9a49a8.yaml
    - ledger/proposals/IDEA-20260808-90c7ab.yaml
    - ledger/corrections/CORR-20260727-007.yaml
    - ledger/questions/RQ-INSTR-f8faa0.yaml
    - AGENTS.md
    - docs/inventor-protocol.md
  assigned_to: executor
  approved_by: null
