experiment:
  id: EXP-ICEX-640aef
  hypothesis_id: H-ICEX-51881a
  derived_from_idea: IDEA-20260815-f4c398
  question_id: RQ-QRE-6dba8c
  batch_id: BATCH-fced88
  version: 1
  title: >-
    SEVEN-POINT REPRODUCTION OF THE COUNTING LAYER AND AN EMPTY SENSITIVITY
    RANKING AS THE DELIVERABLE- evaluate the recorded logical-qubit and
    Toffoli closed forms against all seven recorded simulated data points,
    check the point-addition-times-2n identity symbolically, then perturb
    every named error-correction assumption and report the movement, which is
    predicted to be exactly zero because neither closed form contains any of
    them; with the source's non-curve RSA row as the control and a hard
    prohibition on emitting any physical-resource, wall-clock, timeline or
    policy figure
  status: draft
  objective: >-
    (A) THE UNCERTAINTY. This program cites a 256-bit ECDLP quantum resource
    figure it has never recomputed. The uncertainty reduced is whether the
    figure reproduces from its own stated closed forms, and - the part that
    matters - WHICH of its named inputs it is actually a function of.
    (B) WHY THE ANSWER IS PREDICTABLE AND WHY THE RUN IS STILL WORTH MAKING.
    The source states its model is FAULT-FREE, so the sensitivity ranking is
    predicted EMPTY. Running it converts that from an inference someone must
    re-derive from a caveat sentence into a committed, checkable artifact -
    and an empty ranking is the strongest available statement that any
    citation of this figure as bearing on error-correction assumptions is
    outside its scope.
    (C) THE THREE LAYERS, KEPT SEPARATE. The COUNTING layer (closed forms
    against the simulated table) is reproduced here. The CIRCUIT-SYNTHESIS
    layer (reversible arithmetic, interpolation methodology, simulations) is
    NOT reproduced and is not reproducible from the publication description
    within this budget; the corpus entry records it was not checked there
    either. The ERROR-CORRECTION layer is ABSENT from the source entirely.
    Reporting the first as a reproduction of the pipeline would be the silent
    gap-filling the source proposal names as its own dominant confounder, and
    the contract's invalidation rules forbid it.
    (D) WHAT IS NOT DECIDED. Whether the source's numbers are correct;
    anything about hardware or quantum feasibility; and - per RQ-QRE-6dba8c
    constraint 4 - any date, timeline, arrival probability or policy
    recommendation, none of which may appear in any artifact.
  inputs:
    cost_unit: >-
      THREE UNITS, DECLARED AND NEVER COMBINED- LOGICAL QUBITS (count),
      TOFFOLI GATES (count), TOFFOLI DEPTH (count). No scalar formed by
      adding or dividing across them is emitted. NO PHYSICAL-QUBIT COUNT, NO
      SECONDS, NO WALL CLOCK, AND NO PHYSICAL-QUBIT-SECOND FIGURE MAY BE
      PRODUCED UNDER THIS CONTRACT, because the source contains no
      error-correction layer from which one could be derived; that assembly
      belongs to EXP-ICEX-b8c865 and is blocked there on a second filed
      source.
    unit_discipline: >-
      BINDING AND ENFORCED. Every value carries a tag in {logical_qubits,
      toffoli_gates, toffoli_depth, bits, dimensionless}. The harness refuses
      any cross-tag arithmetic. A ratio is formed only between two values of
      the SAME tag and is reported as dimensionless with both operands'
      tag printed. The qubit law is evaluated in EXACT INTEGER ARITHMETIC-
      it is a linear form with a ceiling of a base-2 logarithm and has no
      floating-point content, so a floating-point evaluation of it is itself
      a defect. The Toffoli law is evaluated at declared precision with the
      precision recorded.
    feasibility_gate: >-
      THE HARNESS REFUSES TO EMIT A NUMBER IT CANNOT SOURCE. Reported as
      UNEVALUABLE with the missing input named, never valued- any perturbed
      input that does not appear in either recorded closed form (its movement
      is EXACTLY ZERO and is reported as zero, never as a small number
      produced by a substituted model); any physical-resource or
      time-denominated figure; any constant with no filed source
      (RQ-QRE-6dba8c constraint 3); and any n outside the seven recorded rows
      when a SIMULATED value is being compared against (there is none to
      compare with, and interpolating one and calling it a reproduction is
      the defect this gate exists to stop). Filling an unevaluable cell with
      a plausible value produces a confident reproduction of something the
      source did not say.
    procedure: >-
      STAGE 0 (zero compute, minutes, HARD GATE). Evaluate the qubit law
      9n + 2*ceil(log2 n) + 10 in exact integer arithmetic at all seven
      recorded n and compare against the recorded simulated qubit counts.
      ALL SEVEN MUST MATCH EXACTLY, with zero tolerance. Then check the
      identity 2n * (224 n^2 log2 n + 2045 n^2) = 448 n^3 log2 n + 4090 n^3
      symbolically. Either failure halts the record as a transcription error.
      STAGE 1 (zero compute, minutes). Evaluate the Toffoli law at all seven
      recorded n and report the residual against each recorded simulated
      count as a signed percentage. All seven must lie within 5 percent.
      STAGE 2 (minutes). The one-at-a-time sensitivity pass over code
      distance, cycle time, physical error rate, distillation scheme and
      connectivity. For each, report the movement in LOGICAL QUBITS and in
      TOFFOLI GATES. Predicted exactly zero for all five; a nonzero movement
      means an assumption was introduced that the source did not state and
      the ranking is void until it is removed and named.
      STAGE 3 (minutes). The sensitivity pass over the inputs that DO appear-
      n alone - reported as the movement per unit change in n, which is the
      only nonempty row of the ranking.
      STAGE 4 (non-curve control). The same reproduction and sensitivity
      behaviour on the source's RSA-3072 comparison row, with its Toffoli
      figure reported as the BRACKET the corpus entry records (the ePrint
      text and table give 1.86e13; the published version's summary quotes
      1.5e14) and never as a point.
      STAGE 5 (zero compute). The under-specified-step list- every step of
      the source's pipeline that cannot be reproduced from its description,
      named explicitly, with the circuit-synthesis layer listed in full as
      out of reach rather than approximated.
    mechanism: >-
      STEP 1. Encode each recorded closed form as a function of n only, with
      its unit tag, and each recorded simulated data point as a
      (n, value, unit_tag, source_ref) tuple read from the filed entry.
      STEP 2. Compare law against data point per row and emit the residual;
      the qubit comparison is an exact integer equality test, not a
      tolerance test.
      STEP 3. Implement the perturbation pass so that perturbing an input
      that does not appear in the function is STRUCTURALLY a no-op, and
      assert that the emitted movement is exactly zero rather than merely
      small. An implementation in which a perturbation could produce a small
      nonzero movement has substituted a model for the source's.
      STEP 4. Run the same code path on the RSA row.
      STEP 5. Emit the under-specified-step list from a checklist of the
      pipeline stages the source describes, marking each reproduced / not
      attempted / not reproducible-from-description.
    instrument: >-
      A pure-Python derivation-aid script- exact integer arithmetic for the
      qubit law, declared-precision floating point for the Toffoli law, and a
      symbolic check of the point-addition identity. No quantum simulation,
      no circuit synthesis, no curve arithmetic, no network access at run
      time. The filed KN-LIT entry is the only input and its sha256 is
      recorded.
  controls:
    - >-
      CONTROL 1, SEVEN-POINT REPRODUCTION (blocking). Not two points but all
      seven recorded rows- 110, 160, 192, 224, 256, 384, 521. Matching one
      number could be coincidence; matching seven with a two-parameter law
      cannot.
    - >-
      CONTROL 2, THE INTERNAL CONSISTENCY IDENTITY (blocking). The
      point-addition law times 2n must equal the total law identically. This
      is a zero-cost check of the EXTRACT against itself and is independent
      of the simulated data.
    - >-
      CONTROL 3, NON-CURVE CONTROL (REQUIRED under the standing scope
      constraint of pfdr-battery-20260904). The source's own RSA-3072
      comparison row- a different hard problem, costed by the same authors
      under the same conventions. The counting layer reads no curve, so the
      reproduction machinery and the empty sensitivity ranking must behave
      identically there. PREDICTED- they do. Consequence stated in advance-
      if so, the finding is about a costing pipeline and not about elliptic
      curves.
    - >-
      CONTROL 4, THE STRUCTURAL NO-OP ASSERTION. A perturbation of an input
      absent from the closed form must produce EXACTLY zero movement, not a
      small one. A small nonzero movement is the signature of a substituted
      model and voids the ranking.
    - >-
      CONTROL 5, EXACT-INTEGER CONTROL. The qubit law is evaluated in exact
      integer arithmetic; a floating-point evaluation that rounds to the
      right answer is not a reproduction of an integer identity and is
      rejected.
    - >-
      CONTROL 6, BRACKETED RSA FIGURE. The corpus entry records a
      disagreement between the source's ePrint table (1.86e13) and the
      published version's summary (1.5e14) for the RSA-3072 Toffoli count.
      Both are carried; selecting one silently is forbidden.
  independent_variables:
    - n in {110, 160, 192, 224, 256, 384, 521}
    - perturbed input in {code distance, cycle time, physical error rate, distillation scheme, connectivity, n}
    - instance in {ECDLP rows, non-curve RSA-3072 control row}
    - source version for the RSA row, in {ePrint table figure, published summary figure}
  metrics:
    primary:
      - >-
        reproduced LOGICAL QUBIT count per n against the recorded simulated
        count, with an EXACT equality verdict (no tolerance)
      - >-
        reproduced TOFFOLI GATE count per n against the recorded simulated
        count, with a signed percentage residual
      - >-
        the point-addition identity check, symbolic, pass or fail
      - >-
        movement in LOGICAL QUBITS and in TOFFOLI GATES per perturbed input,
        predicted exactly zero for every error-correction input
      - >-
        the sensitivity ranking, which is predicted to contain exactly one
        nonzero row (n) and to be otherwise EMPTY
    secondary:
      - the non-curve RSA control rows, with the Toffoli figure as a bracket
      - the under-specified-step list with each pipeline stage marked reproduced / not attempted / not reproducible-from-description
      - the unevaluable-cell table with the missing input named
      - sha256 of the filed input entry and the declared floating-point precision
  heuristic_under_test: HEUR-QRE-REP-1
  preregistered_prediction:
    quantity: >-
      The reproduction residuals of the two recorded closed forms against the
      seven recorded simulated data points, and the movement of each headline
      figure under each perturbed input.
    formula: >-
      Logical qubits = 9n + 2*ceil(log2 n) + 10, PREDICTED EXACT at all seven
      rows against 1014, 1466, 1754, 2042, 2330, 3484, 4719. Toffoli gates =
      448 n^3 log2(n) + 4090 n^3, PREDICTED WITHIN 5 PERCENT at all seven
      rows against 9.44e9, 2.97e10, 5.30e10, 8.43e10, 1.26e11, 4.52e11,
      1.14e12; hand-derived residuals, to about 1 percent and with this
      script as the authority, are about +0.5, +1.6, 0.0, +1.2, +2.2, -0.6,
      +0.9 percent. Identity- 2n*(224 n^2 log2 n + 2045 n^2) =
      448 n^3 log2 n + 4090 n^3, PREDICTED EXACT. Sensitivity- PREDICTED
      EXACTLY ZERO movement for code distance, cycle time, physical error
      rate, distillation scheme and connectivity.
    source: >-
      KN-LIT-099 as filed in this corpus (citation_verified 'read', ePrint
      simulation table reproduced in the entry), read in full under
      TASK-20260904-e87737. No unopened source is relied on.
  scale_relevance:
    tier: crypto
    justification: >-
      The costed parameter set includes 256-bit prime-field ECDLP, a
      cryptographic parameter, but THE TIER LABEL DESCRIBES THE PARAMETER AND
      NOT THE EVIDENCE- no instance is constructed, no circuit is simulated,
      no hardware is used, and nothing here validates the source's counts.
      The evidence value is exactly that of the filed table plus exact
      arithmetic on it. TRANSFER ASSUMPTIONS- none, because nothing is
      transferred; the reproduction is source-specific by construction and
      the corpus entry's own unchecked-content boundary is inherited
      unchanged.
    correspondence: null
  tail_checks:
    - >-
      THE LARGEST n (521) carries the largest absolute residual in the
      Toffoli law and is reported separately, since a systematic residual
      growing in n would indicate the interpolation is being mis-evaluated
      rather than merely approximate.
    - >-
      THE SMALLEST n (110) is where the ceiling term in the qubit law is
      least aligned with a power of two (ceil(log2 110) = 7) and is therefore
      the sharpest test that the ceiling is being applied at all rather than
      approximated by log2 n.
    - >-
      THE RSA ROW'S BRACKET is reported at both endpoints, and any statement
      whose truth differs between the two endpoints is labelled
      version-dependent and may not be quoted without the endpoint.
    - >-
      ANY NONZERO SENSITIVITY MOVEMENT, however small, is inspected
      individually and halts the ranking; smallness is not a defence, because
      the predicted value is exactly zero.
  replication:
    seeds: []
    seeds_note: >-
      THE COMPUTATION IS DETERMINISTIC AND SAMPLES NOTHING- it is exact
      arithmetic on a filed table, so there is no seed to declare and the
      list is empty by construction rather than by omission. Two executions
      at the same inputs must be BIT-IDENTICAL; any difference is an
      infrastructure failure under AGENTS.md rule 5. Reproducibility is bound
      by the sha256 of the filed input entry and the declared floating-point
      precision, both recorded per run.
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.25
    maximum_memory_gb: 8
    maximum_runs: 4
    maximum_workers: 1
  stopping_rules:
    - >-
      Stop immediately if any of the seven qubit rows fails to reproduce
      exactly.
    - >-
      Stop immediately if the point-addition identity fails.
    - >-
      Stop immediately if any perturbation of an absent input produces a
      nonzero movement.
    - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  invalidation_rules:
    - >-
      A run emitting any PHYSICAL-QUBIT, SECONDS, WALL-CLOCK or
      physical-qubit-second figure is INVALID- the source has no
      error-correction layer and such a figure would be manufactured.
    - >-
      A run emitting any date, timeline, arrival probability or policy
      recommendation is INVALID under RQ-QRE-6dba8c constraint 4.
    - >-
      A run reporting a reproduction of the CIRCUIT-SYNTHESIS layer, or
      describing the counting-layer reproduction as a reproduction of the
      pipeline, is INVALID.
    - >-
      A run filling an under-specified pipeline step with a plausible value
      rather than listing it is INVALID.
    - >-
      A run evaluating the qubit law in floating point rather than exact
      integer arithmetic is INVALID.
    - >-
      A run using a constant with no filed source is INVALID under
      RQ-QRE-6dba8c constraint 3.
    - >-
      A run reporting a sensitivity figure without its declared range is
      INVALID under RQ-QRE-6dba8c constraint 5.
    - >-
      A timeout, crash or dependency failure makes the run
      failed_infrastructure and is never a finding about the source
      (AGENTS.md rule 5).
  success_criterion: >-
    The contract SUCCEEDS when all seven qubit rows reproduce exactly, all
    seven Toffoli rows reproduce within 5 percent, the point-addition
    identity holds, the sensitivity movement for every error-correction input
    is reported as exactly zero, the non-curve RSA control behaves
    identically with its Toffoli figure bracketed, and the
    under-specified-step list is emitted with the circuit-synthesis layer
    listed as out of reach. Success is the production of the reproduction
    table and the (predicted empty) ranking; a NONEMPTY ranking would also be
    a successful run and a more surprising one.
  falsification_criterion:
    - >-
      F1. Any of the seven qubit rows fails to reproduce exactly. HALT-
      transcription or extraction error, an infrastructure outcome under
      AGENTS.md rule 5, never a finding about the paper.
    - >-
      F2. Any Toffoli row exceeds a 5 percent residual. Same treatment,
      unless the residual pattern is systematic in n, in which case it is
      reported as a finding about the EXTRACT rather than about the paper.
    - >-
      F3. The point-addition identity fails. The extract is internally
      inconsistent; halt and reconcile before anything is quoted from it.
    - >-
      F4 (falsifies the hypothesis's headline prediction). Any
      error-correction input produces a nonzero movement in either headline
      figure. An assumption the source did not state has been introduced; the
      ranking is void until it is removed and named, and this is the silent
      gap-filling the contract exists to detect.
    - >-
      F5. The non-curve RSA control behaves differently from the curve rows.
      Something curve-specific entered the counting layer undeclared.
    - >-
      F6. Everything holds. Then this program has a committed, checkable
      record that the 256-bit figure it cites is a FAULT-FREE LOGICAL count
      depending on n alone, with exactly zero sensitivity to every
      error-correction assumption - which is simultaneously the reproduction
      and the scope statement, and which is precisely the gap
      EXP-ICEX-b8c865 is blocked on.
  required_artifacts:
    - manifest.yaml with exact command, git commit, dirty-tree state, environment, declared floating-point precision, and the sha256 of the filed input entry
    - raw-result.json with every reproduced value, its recorded reference value, its residual and its unit tag
    - the exact-integer qubit comparison table, seven rows, with equality verdicts
    - the symbolic point-addition identity check
    - the sensitivity table with the movement per perturbed input, including the exact zeros
    - the non-curve RSA control rows with the bracketed Toffoli figure at both endpoints
    - the under-specified-step list with every pipeline stage marked reproduced / not attempted / not reproducible-from-description
    - the unevaluable-cell table with the missing input named per cell
  interpretation_limits:
    - >-
      REPRODUCES THE COUNTING LAYER ONLY. The reversible-arithmetic
      constructions, the interpolation methodology and the circuit
      simulations are NOT reproduced and are NOT REPRODUCIBLE FROM THE
      PUBLICATION DESCRIPTION WITHIN THIS BUDGET; the corpus entry records
      that they were not checked there either. THIS IS THE PART THAT IS NOT
      TESTABLE AT REACHABLE SCALE, and it is listed rather than approximated.
    - >-
      AN EMPTY SENSITIVITY RANKING IS NOT A ROBUSTNESS STATEMENT. It says the
      estimate does not contain the assumptions in question, which is the
      opposite of reassurance for anyone quoting it about error correction.
    - >-
      NO PHYSICAL-RESOURCE OR TIME-DENOMINATED FIGURE IS PRODUCED HERE, and
      any such figure requires a second filed source; that assembly is
      EXP-ICEX-b8c865's and is blocked there.
    - >-
      NO DATE, TIMELINE, ARRIVAL PROBABILITY OR POLICY RECOMMENDATION may
      appear in any artifact (RQ-QRE-6dba8c constraint 4).
    - >-
      A SENSITIVITY RANKING IDENTIFIES DEPENDENCE, NEVER CORRECTNESS.
    - >-
      THE SOURCE IS A 2017 ESTIMATE AND A REPRODUCTION IS A STATEMENT ABOUT
      THAT ESTIMATE, not about present hardware. Since no timeline may be
      recorded, this is a scope statement and not a forecast.
    - >-
      IF THE NON-CURVE CONTROL BEHAVES IDENTICALLY, as predicted, the finding
      is about a costing pipeline and not about elliptic curves.
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      NOT APPROVED. DRAFT, designed under TASK-20260904-e87737; execution
      requires a separate Coordinator approval decision. A message from any
      agent is not an approval.
    - >-
      RQ-QRE-6dba8c constraint 1 requires two filed primary
      resource-estimation sources before a PIPELINE OUTPUT is recorded. This
      contract records no pipeline output- it reproduces one filed source's
      own closed forms against that same source's own data points, and emits
      no physical-resource figure. Whether that distinction satisfies the
      constraint is a COORDINATOR JUDGEMENT TO BE MADE AT APPROVAL and is not
      assumed here; if it does not, this contract is blocked exactly as
      EXP-ICEX-b8c865 is.
    - >-
      Stage 0 is a HARD GATE and runs before any other output.
  id_allocation_provenance: >-
    EXP-ICEX-640aef was pre-allocated by the tasking Coordinator session and
    supplied in TASK-20260904-e87737's constraints, verified free across the
    identifier union before use. This agent has no shell and allocated no
    identifier.
  yaml_parse_disclosure: >-
    Written by a Coordinator subagent without an interpreter; every prose
    value is a folded block scalar or a quoted scalar; no tabs; no duplicate
    keys to the author's reading. THIS AGENT COULD NOT RUN A STRICT YAML
    PARSE OR tools/validate_ledger.py and did not do so; the orchestrating
    session must run both before this contract is relied on. The arithmetic
    in the preregistered prediction was performed by hand, is stated to about
    1 percent, and names the Stage 0 script as the authority.
