experiment:
  id: EXP-PAIR-21437a
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-464ff8
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE CM ENDOMORPHISM IS NOT A DISTORTION MAP, AND THE EXCEPTION IS EXACTLY CHARACTERISED
    - on an ordinary prime-field curve every geometric endomorphism commutes with Frobenius and therefore
    preserves the rational N-torsion eigenline, so phi acts on G as a scalar lambda and e_N(P, phi(P))
    = e_N(P,P)^lambda = 1 for every phi and every P; the single case in which the argument does not
    apply is pi acting as a scalar on the whole of E[N], which forces E[N] subset E(F_p), hence N
    | p-1 (embedding degree 1) AND N^2 | #E(F_p), a pair of conditions no cryptographic curve satisfies'
  status: draft
  objective: '(A) THE QUESTION THIS LANE MUST ANSWER FIRST. A distortion map for the cryptographic
    subgroup G = <P> of order N would be an endomorphism psi with psi(P) not in <P>. It is the whole
    reason supersingular curves are pairing-friendly, because it converts the identically trivial
    Weil self-pairing into the non-degenerate modified pairing e(P, psi(P)). The campaign''s admissibility
    filter (DECOMPOSITION.md section 2, H-ENDO-001) says every endomorphism acts on a prime-order
    subgroup as a scalar. This proposal turns that statement into a complete, quantified closure for
    the pairing route, and - the part that is not already on the record - it characterises the exact
    hypothesis under which the argument runs and what curve would have to look like for it to fail.

    (B) THE ARGUMENT, IN FOUR STEPS, EACH ELEMENTARY. (B1) E/F_p ordinary means End_{F_p-bar}(E) tensor
    Q is an imaginary quadratic field, hence End_{F_p-bar}(E) is a COMMUTATIVE ring - an order O in
    K = Q(sqrt(D)), D = t^2 - 4p. This is the Deuring ordinary/supersingular dichotomy and it is the
    only external input. (B2) The Frobenius pi lies in O. Commutativity gives psi.pi = pi.psi for
    EVERY psi in O, including endomorphisms that are a priori only defined over an extension. Therefore
    psi maps ker(pi - 1) into ker(pi - 1). (B3) G = E[N] intersect ker(pi - 1). If pi is NOT the scalar
    1 on E[N], this kernel is cyclic of order N, so psi restricted to G is an endomorphism of a cyclic
    group of prime order, i.e. multiplication by some lambda_psi in Z/N. In particular psi(P) IS in
    <P>: no distortion map exists. (B4) The Weil pairing is alternating, e_N(P,P) = 1. Hence e_N(P,
    psi(P)) = e_N(P, [lambda_psi]P) = e_N(P,P)^{lambda_psi} = 1, identically, for every psi in O and
    every P in G. The CM endomorphism phi, the GLV endomorphism, and every element of the order all
    give 1.

    (C) THE EXCEPTIONAL CASE, STATED EXACTLY - THIS IS THE INCREMENT. Step (B3) needs pi to be non-scalar
    on E[N]. The only way (B2) fails to pin psi down is pi acting as a scalar c on E[N]. Since G is
    non-zero and G is contained in ker(pi - 1), that scalar must be c = 1, i.e. E[N] is contained
    in E(F_p) - the FULL N-torsion is rational. Two consequences follow immediately from the Weil
    pairing and from Lagrange: E[N] subset E(F_p) forces mu_N subset F_p, i.e. N | p - 1, i.e. EMBEDDING
    DEGREE 1; and it forces N^2 | #E(F_p). A curve used for ECDLP has #E = h.N with h small and N^2
    not dividing #E, so the exception is unreachable there. Note also that pi non-semisimple with
    eigenvalue 1 (the Jordan-block case, possible when p = 1 mod N but E[N] not rational) is NOT an
    exception - ker(pi - 1) is still one-dimensional and (B3) still runs. So the exception is precisely
    "full rational N-torsion", not merely k = 1.

    (D) WHAT THIS DOES AND DOES NOT CLOSE. It closes, unconditionally and with no heuristic, the entire
    family "compose the Weil pairing with an endomorphism of E to obtain a self-pairing on G computable
    from one point". It does NOT close the Tate self-pairing, which is not alternating and which IDEA-20260807-30868b
    handles by a different argument; it does not close pairings between G and a subgroup of E(F_{p^k})
    not equal to G, which IS the classical MOV/Frey-Ruck transfer and needs a second point; and it
    says nothing about supersingular curves, where End is a quaternion order, non-commutative, and
    (B2) fails at its first line - which is exactly why distortion maps exist there.'
  resource_label: R7 (pairings into F_{p^k}) nominally, composed with R3 (End(E) as a ring). The finding
    of this record is that the composition annihilates the R7 escape and returns the mechanism to
    the closed R3-on-G regime.
  admissibility: inadmissible_generic_group
  admissibility_argument: The pairing itself is a genuine non-generic resource - it maps G into a
    different group, and KN-FIND-b7e091 does not cover it. But the proposed mechanism uses phi ONLY
    by applying it to points of G, which is the exact pattern DECOMPOSITION.md section 2 declares
    inadmissible on its face. The composite e(P, phi(P)) collapses through H-ENDO-001's scalar action
    to e(P,P)^lambda, and the Weil pairing kills it. So the R7 escape is real and the R3 step re-enters
    the generic regime and destroys it. Filed as a recorded closure with the obstruction named, per
    the brief's rule 1.
  reachability_gate: NOT APPLICABLE AS A SEARCH, AND THE REASON IS THE RESULT. This proposal does
    not move between curves. It is worth recording why no move helps - the obstruction is a property
    of End(E) being commutative, which holds for EVERY ordinary curve in the isogeny class and indeed
    for every ordinary curve over any prime field. There is no curve to walk to, at any cost, so T5's
    dichotomy (common enough to hit, or locally detectable) does not even arise. The only curves with
    the property are supersingular, and supersingularity is a class invariant (fixed by t), so it
    is unreachable by F_p-isogeny from an ordinary class.
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE): write the derivation and obtain Charles 2006/128.
      STAGE 1 (minutes): on 200 toy ordinary curves with p in [2^16, 2^20], N || #E, k > 1, verify
      pi(P) = P and e_N(P, pi(P)) = 1 using the instrument of IDEA-20260807-e7eb5d. STAGE 2 (HARD
      GATE, minutes): the supersingular positive control. STAGE 3 (hours): search for the exceptional
      curve (N | p-1 and N^2 | #E for small N) and exhibit the failure of (B3) on it.'
    mechanism: 'STEP 1 - WRITE THE ARGUMENT (zero compute). Produce (B1)-(B4) and (C) as a two-page
      derivation with the quantifier order explicit, naming Deuring''s dichotomy as the single external
      input and marking it as textbook-standard but not transcribed into this corpus. STEP 2 - STAGE-0
      LITERATURE OBLIGATION. Obtain Charles ePrint 2006/128 in a readable form and record its exact
      exceptional-case characterisation in a new knowledge/literature note. Two outcomes, both useful
      - it agrees with (C), in which case this record''s increment is a re-derivation and should be
      downgraded to a corpus transcription; or it differs, in which case one of the two is wrong and
      finding out which is the deliverable. STEP 3 - MECHANICAL VERIFICATION AT TOY SCALE (low compute,
      uses the instrument of IDEA-20260807-e7eb5d). For toy ordinary curves with N || #E and k > 1,
      enumerate the small-norm elements of O = Z[pi] (multiplication by m, and pi itself, which is
      the CM endomorphism available with no additional machinery on any curve), evaluate psi(P), and
      check two things numerically - that psi(P) = [lambda]P for a recovered lambda, and that e_N(P,
      psi(P)) = 1. Report the recovered lambda alongside the eigenvalue predicted by the characteristic
      polynomial of pi mod N, which for psi = pi must be lambda = 1 exactly. STEP 4 - THE EXCEPTION,
      CONSTRUCTED (low compute). Search toy p for an ordinary curve with E[N] contained in E(F_p)
      for a small prime N - i.e. N | p-1 and N^2 | #E - and verify on it that (B3) genuinely fails,
      that some endomorphism moves P off <P>, and that a non-trivial self-pairing appears. If the
      exception cannot be exhibited, the closure is UNCONTROLLED and must be reported as such, because
      a closure whose exceptional case cannot be produced has not been shown to be a real boundary.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - supersingular y^2 = x^3 + x over F_p, p = 3 mod 4, with the standard distortion map - must give
    a non-trivial pairing
  - an ordinary curve with full rational N-torsion - must give a non-trivial value or (C) is wrong
  - an ordinary curve with k > 1 - must give exactly 1
  - a deliberately broken pairing (final exponentiation omitted) - must be caught by the positive
    control returning a value outside mu_N
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, and for a closure the null runs in the
    opposite direction from usual - the instrument must be shown capable of DETECTING a distortion
    map where one exists, or "we found none" means nothing. POSITIVE CONTROL (matched object of the
    same shape): the supersingular curve y^2 = x^3 + x over F_p with p = 3 mod 4, whose distortion
    map psi(x,y) = (-x, i.y) with i^2 = -1 in F_{p^2} is textbook. On it the identical pipeline MUST
    return e_N(P, psi(P)) not equal to 1. If it does not, every negative in this record is an instrument
    artifact. DECAY PARAMETER: the dimension of the pi-eigenspace containing G, which is 1 for ordinary
    curves with N || #E and 2 in the exceptional case and on supersingular curves where pi^2 = -p
    acts with a repeated eigenvalue on E[N] over F_{p^2}. As that dimension DROPS from 2 to 1 the
    non-trivial self-pairing must vanish EXACTLY, not gradually. Any curve reported with eigenspace
    dimension 1 and a non-trivial self-pairing is an instrument failure, and the first thing to check
    is the final exponentiation.'
  independent_variables: []
  metrics:
    primary:
    - recovered lambda_psi per (curve, psi) and its agreement with the predicted eigenvalue
    - e_N(P, psi(P)) per triple, reported as an element of F_{p^k} with its order
    - pass or fail of each named control
    - the (p, N,
    secondary: []
  heuristic_under_test: null
  preregistered_prediction:
    quantity: 'fraction of (ordinary toy curve, endomorphism psi, point P) triples with e_N(P, psi(P))
      not equal to 1, over curves with N || #E and k > 1'
    formula: EXACTLY ZERO out of every triple tested, with no tolerance. A single non-trivial value
      is either a refutation of (B) or an instrument bug, and the record commits in advance to treating
      the instrument as the first suspect and to running the positive control before reporting.
    source: pre-registered in IDEA-20260807-464ff8 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - Endomorphism availability. On a generic ordinary curve the only cheaply evaluable endomorphisms
    are the integers and pi itself, and pi acts as 1 on G by construction, so a test that uses only
    pi is nearly vacuous. The test must include curves with small |D| (j = 0, j = 1728) where a genuine
    non-integer, non-Frobenius endomorphism is explicit, or it measures almost nothing.
  - Field of definition of the pairing. For k > 1 the Weil pairing value lives in F_{p^k}, and at
    toy scale k can be large enough that F_{p^k} arithmetic is infeasible. The test must select toy
    curves with SMALL k deliberately - which does not weaken the conclusion, because the claim is
    that the value is 1 for all k, and small k is the case most likely to produce a non-trivial value.
  - Confusing "no distortion map for G" with "no distortion map at all". The claim is about the rational
    eigenline only.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACTLY ZERO out of every triple tested, with no tolerance. A single non-trivial
    value is either a refutation of (B) or an instrument bug, and the record commits in advance to
    treating the instrument as the first suspect and to running the positive control before reporting.
  falsification_criterion:
  - 'Any ordinary toy curve with N || #E and k > 1 on which some endomorphism gives e_N(P, psi(P))
    not equal to 1, surviving the instrument controls. That refutes (B) and would be the most important
    observation in the campaign.'
  - The supersingular positive control returning 1. Instrument failure under AGENTS.md rule 5, never
    mathematical evidence, and nothing is reported.
  - Charles 2006/128 characterising the exceptional cases differently from (C). One of the two is
    wrong; the record is superseded, not amended.
  - Failure to construct any exceptional curve at toy scale, which leaves the closure boundary unexhibited
    and caps the claim at "no counterexample found in the tested family".
