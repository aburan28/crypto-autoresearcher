  protocol_deviations:
    - >-
      This experiment was previously dispatched to a different Executor
      session that was interrupted mid-run by an account-wide HTTP 429
      rate-limit on 2026-09-07 (~03:38 UTC), leaving RUN-PMA4-001-a/b/c with
      raw-result.json/summary.json/logs but no manifest.yaml,
      command.txt, or environment.json, and RUN-PMA4-001-d with only its
      driver script (no output at all), documented honestly in
      runs/INCOMPLETE.md by that session. This session independently
      re-executed RUN-PMA4-001-a, -b, and -c from the unmodified run
      scripts left behind and confirmed their outputs reproduce
      bit-for-bit against the interrupted session's uncommitted results
      (identical except timing fields) before treating any of their data
      as trustworthy, per this task's explicit instruction to re-verify
      rather than simply trust prior partial work.
    - >-
      experiments/EXP-PMA-001/implementation/driver_core.py (shared
      per-instance orchestration used by RUN-PMA4-001-b/c; not one of the
      three frozen required_artifacts implementation files) was modified
      to pass through Module A's own already-computed
      predicate_triple_certificates on each instance record, so that
      RUN-PMA4-001-d could report the obstruction_witnesses secondary
      metric named in specification.yaml's metrics.secondary (previously
      omitted). No decision logic was added or changed; RUN-PMA4-001-b and
      -c were re-executed after this change and every classification
      count (per field, per label) was confirmed identical to the
      pre-change run before and after, since the added field is purely
      additive.
    - >-
      experiments/EXP-PMA-001/runs/RUN-PMA4-001-d/run_d.py, as left by the
      interrupted prior session, had never successfully executed (no
      raw-result.json existed for it) because of a pre-existing path bug
      (RUNS_DIR was built as parents[1]/"runs", double-appending "runs"
      and pointing at a nonexistent directory). This session fixed the
      path construction (RUNS_DIR = parents[1]) and added the three
      metrics.secondary fields specification.yaml names but the original
      script omitted: obstruction_witnesses, degenerate_branch_count,
      exceptional_locus_count, and per_stage_wall_clock_seconds (read from
      each upstream stage's own already-recorded elapsed_seconds). The
      frozen falsification-classification logic (direction 1, direction 2,
      non-vacuity, success_criterion_met) was not touched.
    - >-
      F_3's parameter box (allowed_values = [2, ..., q-1] for q=3) has
      exactly one element ({2}), so every d_S in every F_3 instance is
      forced to 2 and all 18 F_3 "instances" (8 grid + 2 perturbed + 8
      widened) are numerically the same single prescribed table. This is a
      genuine executability tension in the frozen contract for the
      smallest tested field, disclosed by the interrupted prior session in
      grid_data.py's own module docstring and confirmed, not introduced,
      by this session; F_3's grid was executed exactly as the frozen rule
      dictates. See analysis.md's "Scope and transfer-assumption
      disclosure" for its effect on interpreting the agreement statistic.
  runs:
    completed:
      - id: RUN-PMA4-001-a
        status: completed_valid
        path: experiments/EXP-PMA-001/runs/RUN-PMA4-001-a/
        result: >-
          overall_self_check_pass = true (6/6 checks passed): formal
          square-root and predicate self-test cross-agreement (Module A vs
          Module B) on 8 hand-built cases across F_3/F_5/F_7/Q; positive
          control (genuine 4x4 matrix over F_7) judged
          NOT_OBSTRUCTED_BY_THIS_GATE by the predicate and EXISTS with
          16/16 reverified witness by the decider; char-2 refusal control
          passed for F_2 and F_4; degeneracy-fixture (q_ij=0) branched
          DEGENERATE in both modules as required.
      - id: RUN-PMA4-001-b
        status: completed_valid
        path: experiments/EXP-PMA-001/runs/RUN-PMA4-001-b/
        result: >-
          Finite-field grid (F_3, F_5, F_7), 46 instances total (18 + 18 +
          10, widening triggered for F_3 and F_5). F_3: 18/18
          agreement_compatible_confirmed. F_5: 18/18 false_compatibility
          (falsification direction 2 -- see analysis.md). F_7: 10/10
          agreement_obstructed_confirmed, non-vacuous.
      - id: RUN-PMA4-001-c
        status: completed_valid
        path: experiments/EXP-PMA-001/runs/RUN-PMA4-001-c/
        result: >-
          Q(t) grid: 6/6 agreement_obstructed_confirmed, no widening
          needed, non-vacuous. Groebner cross-check subsample (4
          instances, sympy 1.14.0): 4/4 agree with the decider, 0
          disagree.
      - id: RUN-PMA4-001-d
        status: completed_valid
        path: experiments/EXP-PMA-001/runs/RUN-PMA4-001-d/
        result: >-
          Aggregated a/b/c. predicate_bruteforce_agreement = 34/52 =
          0.6538461538461539. nonvacuous_obstruction_count = 16.
          false_obstruction_count = 0. false_compatibility_count = 18.
          existence_witness_verification_failures = 0. All four controls
          pass. success_criterion_met = false (false_compatibility_count
          != 0). any_upstream_artifact_incomplete = false.
    invalid: []
    failed: []
  observations:
    - >-
      Frozen prediction reference: specification.yaml
      preregistered_prediction.formula (predicate_bruteforce_agreement =
      1.0 exactly; nonvacuous_obstruction_count >= 1;
      false_obstruction_count = 0; false_compatibility_count = 0; char-2
      refusal). Full comparison table and instance-count reconciliation:
