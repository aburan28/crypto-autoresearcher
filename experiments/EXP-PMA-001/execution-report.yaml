      run outcome, not an infrastructure failure or invalid measurement:
      the decider's NOT_EXISTS verdict carries a complete 8-branch
      exhausted log per CTRL-PMA4-GROUND-TRUTH's pass_condition. Recorded
      per agents/executor.md item 12 as an observation preserved exactly
