    - >-
      Comparison statistics (measured, not modeled):
      predicate_bruteforce_agreement = 0.6538461538461539 (target 1.0);
      nonvacuous_obstruction_count = 16 (target >=1, met);
      false_obstruction_count = 0 (target 0, met);
      false_compatibility_count = 18 (target 0, NOT met);
      existence_witness_verification_failures = 0 (target 0, met).
    - >-
      Tail check: not applicable -- this is a deterministic exhaustive
      grid over a fixed, frozen instance-generation rule with no sampling
      distribution; specification.yaml defines no tail-check procedure for
      this experiment, and none is fabricated here.
    - >-
      Controls: CTRL-PMA4-GROUND-TRUTH pass, CTRL-PMA4-CHAR2 pass,
      CTRL-PMA4-DEGENERACY pass, CTRL-PMA4-GROEBNER pass (4/4 agree, 0
      disagree). Detail: analysis.md.
    - >-
      Per agents/executor.md item 13, no conclusion is drawn here about
      whether the divisor-parity obstruction predicate (or H-PMA-001) is
      supported, refuted, validated, or closed. The falsification
      criterion's direction-2 clause fired on this grid (see below); that
      is reported as a comparison-statistic outcome, not as a
      hypothesis-status determination, which is reserved for
      /review-evidence.
  anomalies:
    - >-
      Falsification direction (2) fired: 18 instances, all in field F_5's
      grid, are false_compatibility -- predicate verdict
      NOT_OBSTRUCTED_BY_THIS_GATE (all three anchor discriminants square in
