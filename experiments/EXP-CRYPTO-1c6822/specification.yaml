# EXP-CRYPTO-1c6822
# Parser gate for the factor-base meter. No solve.
# Approved by DEC-20261001-92f749.
experiment:
  id: EXP-CRYPTO-1c6822
  hypothesis_id: H-CRYPTO-f68ccf
  source_idea: IDEA-20260921-da1896
  question_id: RQ-CRYPTO-001
  version: 1
  title: Frozen grammar gate for one factor-base meter row
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-92f749
  objective: >-
    Accept one hand-written identity row and reject three mutants. Do not
    solve a polynomial system.
  inputs:
    classes:
      - algebraic_predicate
      - power_residue_coset
      - oracle_described
      - target_dependent_ball
    required_controls:
      - identity
      - random_label
      - generic_relabelled_Z_nZ
      - matched_random
    good_fixture:
      class: algebraic_predicate
      sigma: translation_by_factor_base
      scope_tier: toy
      controls: [identity, random_label, generic_relabelled_Z_nZ, matched_random]
      identity_L: 0
      identity_b: 1
    mutants:
      - {id: missing_scope, drop: scope_tier}
      - {id: coordinate_dependent, class: coordinate_dependent}
      - {id: bad_identity_L, identity_L: 1}
  controls:
    - The bad_identity_L mutant must be rejected. Accepting it invalidates the run.
    - A fifth class name, not in the frozen list, must be rejected.
    - Two parsers. They must not import each other.
  independent_variables:
    - fixture id
    - parser implementation
  metrics:
    primary:
      - good_fixture_accepted
      - mutant_rejected_count
      - fifth_class_rejected
      - implementations_agree
    secondary:
      - rejection_reasons
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Accept/reject decisions on four fixtures and one extra class name.
    formula: >-
      Accept if and only if class is in the four names, scope_tier is toy,
      all four controls are present, and identity_L = 0 and identity_b = 1.
    source: >-
      IDEA-20260921-da1896 claim text, read 2026-10-01. EV-FB-001 was not
      opened. No recorded yield band is a target of this contract.
  scale_relevance:
    tier: toy
    justification: >-
      The only accepted scope_tier is toy. No factor base is built.
    correspondence: null
  tail_checks:
    - The fifth class name is a single extra token, not a missing field. It must still be rejected.
  replication:
    seeds: []
    independent_instances: 4
    replication_note: Deterministic fixtures. The second run is the second parser.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If a mutant is accepted, mark the attempt invalid as an instrument failure only when the parsers disagree. If they agree and accept a mutant, that is a falsification.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either parser imports the other.
    - Any output reports a solve time, a yield, or a discrete logarithm.
  success_criterion: >-
    Both parsers agree, the good fixture is accepted, all three mutants are
    rejected, and the fifth class name is rejected.
  falsification_criterion: >-
    The parsers agree and the good fixture is rejected, or any mutant or the
    fifth class name is accepted.
  required_artifacts:
    - experiments/EXP-CRYPTO-1c6822/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CRYPTO-1c6822/runs/<RUN-ID>/command.txt
    - experiments/EXP-CRYPTO-1c6822/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CRYPTO-1c6822/runs/<RUN-ID>/stderr.log
    - experiments/EXP-CRYPTO-1c6822/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CRYPTO-1c6822/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Groebner or SAT solves.
    - Reproduction of EV-FB-001 bands.
    - The CERTBIN pricing design withheld in DEC-20261001-92f749.
