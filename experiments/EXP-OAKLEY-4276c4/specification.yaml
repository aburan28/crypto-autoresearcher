# EXP-OAKLEY-4276c4
# Stage-0 subfield four-sum census for H-OAKLEY-d18d58.
# Frozen before the official run.
experiment:
  id: EXP-OAKLEY-4276c4
  hypothesis_id: H-OAKLEY-d18d58
  source_idea: IDEA-20261007-36251a
  question_id: RQ-OAKLEY-264353
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Ordered four-sum image of the subfield factor base at p=5
  status: approved
  frozen: true
  designed_at: '2026-10-12'
  approved_by: coordinator
  approval_decision_id: DEC-20261012-e8b785
  execution_authorized: true
  objective: >-
    On one quintic-tower sibling, count the distinct affine points that
    arise as an ordered sum of four subfield factor-base points, and
    compare that count with C(36, 5). Do not time a solver and do not
    choose a factor-base class.
  inputs:
    modulus: "z^25 + z^3 + 1"
    curve: "y^2 + x*y = x^3 + z"
    a: 0
    b: z
    p: 5
    subfield: "elements fixed by x |-> x^32"
    factor_base: "affine points whose x-coordinate lies in the subfield, both y-coordinates when two exist"
    tuples: "ordered 4-tuples of factor-base points, repetition allowed"
    predicted_count: 376992
    denominator: 33554432
    factor_agree: 2
    factor_withdraw: 4
    named_future_run_slot: RUN-OAKLEY-524738
  controls:
    - >-
      z is primitive for this modulus, the subfield has 32 elements and
      is closed, and z lies outside it. Failure invalidates the cell.
    - >-
      The first three factor-base points with nonzero x satisfy the
      negation, doubling, and associativity identities. The checker
      repeats the curve equation for the recorded point and its double
      with schoolbook multiplication.
  independent_variables:
    - the frozen modulus, curve, and subfield factor base, not chosen after a count
  metrics:
    primary:
      - measured_count
      - within_factor_2
      - beyond_factor_4
    secondary:
      - factor_base_size
      - planted_ok
  heuristic_under_test: >-
    IDEA-20261007-36251a heuristic H2, read at this cell as an ordered
    four-sum image of size C(q+4, 5) with q = 32.
  preregistered_prediction:
    quantity: >-
      measured_count is the number of distinct affine points equal to
      P1+P2+P3+P4 for factor-base points Pi. The predicted count is
      C(36, 5) = 376992. The ratio is measured_count / 376992.
    formula: >-
      Agreement is a ratio in [1/2, 2]. Withdrawal is a ratio strictly
      below 1/4 or strictly above 4. The planted identities must hold
      for either reading.
    source: >-
      IDEA-20261007-36251a states agreement within a factor 2, and
      withdrawal past a factor 4, for the p=5 decomposition probability
      against C(q+4, 5)/N. The denominator 2^25 cancels in the ratio.
      Both factors were written before the census was computed.
  scale_relevance:
    tier: toy
    justification: >-
      One binary field of degree 25, the subfield arm only, and a
      count rather than a charged solver time. No transfer to p=7 or
      to the Oakley endpoints.
    correspondence: null
  tail_checks:
    - >-
      measured_count is at most the fourth power of the factor-base
      size. A larger count means the scan was not that enumeration.
    - >-
      A factor base of size below 2, or fewer than three points with
      nonzero x, invalidates the cell.
  replication:
    seeds: []
    independent_instances: 1
    named_future_run_slot: RUN-OAKLEY-524738
    replication_note: >-
      One deterministic census. The idea's random subspaces and random
      targets are not drawn.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 180
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one valid manifest for RUN-OAKLEY-524738.
    - Do not add a subspace class, a prime, or a solver in this contract.
    - A count that meets neither factor criterion is the recorded result. Do not change 2 or 4.
  invalidation_rules:
    - The planted field or addition identities fail.
    - The modulus, curve, or subfield definition differs from this specification.
    - The factor base has fewer than two points.
    - A timeout, crash, or missing count.
  success_criterion: >-
    The manifest is valid, planted_ok is true, and measured_count /
    376992 lies in [1/2, 2], including the endpoints.
  falsification_criterion: >-
    The manifest is valid, planted_ok is true, and measured_count /
    376992 is strictly below 1/4 or strictly above 4.
  decision_impact:
    on_positive: >-
      Record that this ordered four-sum image sits within a factor of
      2 of C(36, 5). Do not price a solver and do not rank the other
      subspace classes from this pass alone.
    on_negative: >-
      Record that this reading of H2 misses C(36, 5) by more than a
      factor of 4. Do not treat H2 as confirmed for ordered four-sums,
      and do not start the four-class timing sweep from this manifest.
  required_artifacts:
    - experiments/EXP-OAKLEY-4276c4/runs/RUN-OAKLEY-524738/manifest.yaml
    - experiments/EXP-OAKLEY-4276c4/runs/RUN-OAKLEY-524738/raw-result.json
  assigned_to: executor
  launcher:
    trial_plan: experiments/EXP-OAKLEY-4276c4/trial-plan.json
    driver: experiments/EXP-OAKLEY-4276c4/implementation/run.py
    checker: experiments/EXP-OAKLEY-4276c4/implementation/check.py
  out_of_scope:
    - Frobenius-stable, trace-structured, and random subspaces.
    - p=7, solver time, memory, and yield per charged second.
    - The Oakley endpoint fields of degree 155 and 185.
    - Any deployed curve, any private key, and any claim of an attack cost.
