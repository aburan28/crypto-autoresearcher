# EXP-BINSTD-85e74f
# Whole-field coefficient arithmetic. No factor base.
# Approved by DEC-20261002-f5f6a9.
experiment:
  id: EXP-BINSTD-85e74f
  hypothesis_id: H-BINSTD-ae6634
  source_idea: IDEA-20260926-1db0e8
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Whole-field coefficient arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-f5f6a9
  objective: >-
    Check the three quotients by 262, the logarithm bounds, and the
    factorial comparison.
  inputs:
    twice_131: 262
    power_gap: 256
    reduced_num: 128
    reduced_den: 131
    product_128_131: 16768
    square_131: 17161
    product_gap: 393
    attempt_exact_vs_written: 128
    residual_exact_vs_written: 128
    prefactor_exact_vs_written: 128
    log_low_num: 803
    log_low_den: 100
    log_high_num: 804
    log_high_den: 100
    factorial_12: 479001600
    fact_log_low_num: 28835
    fact_log_low_den: 1000
    fact_log_high_num: 28836
    fact_log_high_den: 1000
    written_fact_log_num: 288
    written_fact_log_den: 10
    ratio_num: 524288
    ratio_den: 467775
    supply_product: 8791261184
    supply_excess: 8312259584
  controls:
    - >-
      Twice 131 is 262. Reporting another scale invalidates the run.
    - >-
      The attempt coefficient equals 2^59 times 128/131. Reporting it
      as exactly 2^59 invalidates the run.
    - >-
      The stored-residual coefficient equals 2^58 times 128/131.
      Reporting it as exactly 2^58 invalidates the run.
    - >-
      The prefactor equals 2^124 times 128/131. Reporting it as exactly
      2^124 invalidates the run.
    - >-
      The logarithm of 12! lies strictly above 28835/1000. Reporting it
      as at most 288/10 invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {coefficients, factorial}
    - route in {reduction, products}
  metrics:
    primary:
      - attempt_coefficient
      - implementations_agree
    secondary:
      - prefactor
      - factorial_gap
      - log_262
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The attempt coefficient is 2^59 times 128/131.
    formula: >-
      Twice 131 is 262. Then 2^8 / 262 reduces to 128/131. Multiplying
      by 2^59, by 2^58, and by 2^124 recovers 2^67 / 262, 2^66 / 262,
      and 2^132 / 262. The factorial 12! is 479001600, and 2^29 exceeds
      it.
    source: >-
      IDEA-20260926-1db0e8 states the written powers, read 2026-10-02.
      The quotients were computed in this design session. That
      computation is not a run. No factor base was built.
  scale_relevance:
    tier: toy
    justification: Three integer quotients and one factorial. No transfer to a search.
    correspondence: null
  tail_checks:
    - The factorial excess 8312259584 is required. A check that stops at 12! and skips the base-2^8 comparison is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If 262 is not twice 131, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - 262 is reported as something other than twice 131.
    - A coefficient is reported as exactly 2^59, 2^58, or 2^124.
    - The logarithm of 12! is reported as at most 288/10.
    - The logarithm of 262 is reported as outside 803/100 and 804/100.
    - A factor base is built or an oracle is run.
  success_criterion: >-
    Both runs agree that 262 is twice 131, that each of the three
    coefficients equals the written power of two times 128/131, that
    the logarithm of 262 lies strictly between 803/100 and 804/100, and
    that 2^25 times 262 exceeds 479001600 by 8312259584.
  falsification_criterion: >-
    The runs agree, 262 stays twice 131, and the attempt coefficient
    is not 2^59 times 128/131.
  required_artifacts:
    - experiments/EXP-BINSTD-85e74f/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-85e74f/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-85e74f/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-85e74f/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-85e74f/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-85e74f/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any factor base, large-prime graph, or oracle.
    - Any summation polynomial or Artin-Schreier reduction.
    - Any claim that a search beats a walk.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
