  limitations:
    - >-
      THIS MEASURES THE INSTRUMENT, NOT THE MATHEMATICS. No claim about ECDLP,
      the Semaev map, any cost or any exponent follows from it in either
      direction. It produces error bars, which is precisely what the cited
      evidence records lack.
    - >-
      NARROWER THAN THE SOURCE PROPOSAL, DELIBERATELY AND WITH THE REASON STATED.
      The proposal's headline is that one control re-scopes four evidence
      records. This contract covers the statistics produced by the committed
      EXP-LPF-001 driver, whose implementation was read at design time. STAT-CHI
      and STAT-KS1 of EV-EQD-001 and the EV-YIELD-e1adbf / ca4b02 / 7c3195 ratios
      are NOT covered, because their pipelines were not read and naming their
      metrics in a frozen contract would be inventing them. The gap is a declared
      deliverable (successor_scope_report), not a silent omission.
    - >-
      TWO SIZES, NEVER POOLED, NOTHING CLAIMED ELSEWHERE. HEUR-IVAR-1 is recorded
      with no support so that no reader inherits it.
    - >-
      A VARIANCE ESTIMATE FROM k INSTANCES HAS ITS OWN WIDE INTERVAL. At k = 20
      a true ratio of 1.2 is not resolvable at all and a ratio of 1.5 sits about
      three standard errors from 1. Every number carries its interval and
      unresolved is a reportable outcome.
    - >-
      NO TRANSITION IS PERFORMED. Re-scoping an evidence record, correcting a
      band, or superseding a reading rule are Coordinator acts on new records.
      This contract supplies the measurement such a decision would cite.
    - >-
      THE MOTIVATING QUOTATIONS WERE NOT RE-OPENED BY THE DESIGNING COORDINATOR.
      They are carried at the source proposal's provenance and are re-verified by
      C-C-DECISION-READBACK as a run artifact before any reading is issued.

  overlap_declaration:
    - >-
      WITH EXP-ECDLP-a1c262 (H-ECDLP-d2aa2c), WHICH READS THE SAME STATISTICS.
      NOT A DUPLICATE, BY CONSTRUCTION: that contract holds the SAMPLE FIXED and
      varies the REFERENCE; this one holds the REFERENCE FIXED and varies the
      CURVE INSTANCE. They are the two orthogonal decompositions of the same
      archived departure and together they separate reference error from instance
      variance. EACH IS THE OTHER'S CONTROL: C-C-SEED-2301-REGRESSION here is
      THAT contract's pipeline-drift control and its failure blocks both; and
      that contract's selected reference is the one under which THIS contract's
      reference-dependent SECONDARY column must be re-read. To keep them
      separable, this contract's PRIMARY metrics are RAW, reference-free spreads,
      so its finding does not move if the reference changes.
    - >-
      WITH EXP-ECDLP-96b5d3 (H-ECDLP-6c52c0). That contract QUOTES the two-term
      optimum B* = N**(1/(m+1)), which rests on the mean-yield convention whose
      instance-level error bars this lane measures. THE DEPENDENCY RUNS ONE WAY:
      if this contract re-scopes the yield convention, that contract's threshold
      table is re-read at the new B* by a superseding record and never by an
      edit. Nothing here validates that contract and nothing there validates this
      one.

