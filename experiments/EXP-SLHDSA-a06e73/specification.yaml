experiment:
  id: EXP-SLHDSA-a06e73
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-f9bfbd; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-f9bfbd
  question_id: RQ-SLHDSA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Measure the joint distribution of per-layer forgery indicators in a scaled-down layered signer
    against an independent-seed, independent-digest control signer, sweeping which input is shared
    and reporting pairwise dependence against the control's measured zero point
  objective: 'The one uncertainty a run reduces is whether the minimum-over-layers composition, which
    two records in this repository name and both scope out, rests on an independence that holds at
    parameters where it can be observed. Concretely: (i) whether a bias-corrected pairwise mutual-information
    estimator reads zero within band on an independent-seed control signer at the achieved rare-event
    marginals, which is the gate that decides whether the composition question is measurable at all
    with this design and which is worth answering first because a failure ends the contract cheaply
    with an instrument result; (ii) whether the shared-seed, shared-digest signer shows any pairwise
    excess over that control''s measured zero point at matched marginals, across all layer pairs and
    with a stated multiple-comparison correction; (iii) whether any such excess attributes to a named
    shared component, by sweeping seed-shared-only, digest-shared-only and both-shared as three configurations,
    since an excess appearing only when both are shared and in neither singly would be unattributed
    and must be reported as such. A run reduces (i) to a pass or fail with bands, (ii) to a per-pair
    excess with bands, and (iii) to a three-configuration attribution table. Measuring no excess anywhere
    is the expected outcome and a complete one.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'At most, a completed run supports: at the tested toy parameter
      sets and output sizes, with the frozen layer-confined event definitions and attempt budgets,
      the per-layer marginal firing rates, the bias-corrected pairwise mutual information and phi
      correlation in each arm, the shared-minus-control excess per pair, and the attribution of any
      excess across the three shared-component configurations. WHAT DOES NOT FOLLOW: nothing about
      any FIPS 205 parameter set; no security level and no validation or invalidation of any composition
      figure for any scheme; no attack, no forgery, no weakness; no statement about SHA-2 or SHAKE;
      no statement about what the literature contains; and nothing about the fault or memory-corruption
      claim class. The shrinking of output sizes that makes the question askable also confines the
      answer entirely to the shrunken regime, and no extrapolation is offered or implied. Holding
      non-target layers ideal biases the measurement toward independence, so a null result is weaker
      than its band suggests and is reported with that direction stated.'
  inputs:
    procedure: 'STAGE 0, freeze (zero compute, ~5h human): fix the layer-confined event definitions,
      attempt budgets, the marginal window, the three shared-component configurations, the bias-correction
      method and the multiple-comparison correction, before any code runs. STAGE 1, dependency check
      (~30min): confirm the companion null harness has cleared its self-consistency battery, since
      layer confinement depends on it; block if not. STAGE 2, control signer (~5h human): build the
      independent-seed, independent-digest signer and verify by call-trace comparison that it differs
      only in those draws. STAGE 3, marginal tuning pilot (~1h compute): 10^4 trials per candidate
      output-size assignment until every layer marginal lands in the 10^-3 to 10^-1 window, tuning
      output sizes and never budgets. STAGE 4, control gate (~3h compute): 10^6 trials of the control
      arm alone; estimate all pairwise mutual informations with bias correction and bootstrap bands;
      halt the contract with an instrument result if any pair fails to read zero. STAGE 5, shared
      arms (~9h compute): three configurations at 10^6 trials each, same invocation as a control replicate,
      marginals matched and verified. STAGE 6, report (zero compute): per-pair excesses with bands
      and correction, attribution table, bias residuals, marginal table.'
    instrument: Python 3.11. The toy signer, the layer-confined attempt harness and the ideal-oracle
      backend are imported from the companion null-harness module under harness/, a stated dependency
      rather than a reimplementation. numpy for trial accumulation and the joint contingency tables;
      an in-repository Miller-Madow-style bias-corrected mutual-information estimator written for
      this contract, with bootstrap bands over 10^3 resamples, so the estimator's behaviour is inspectable
      rather than delegated to a library default. hashlib for the truncated concrete hash backends;
      random.Random for the independent per-layer seed and digest draws in the control arm. Executed
      through harness/runner.py so seeds, parameters and the resolved inference block land in the
      run manifest. No Sage, no external cryptographic library, no network.
    parameters: 'Toy signer: per-layer hash output sizes tuned individually in the range 8 to 14 bits
      so that each layer''s marginal falls in the 10^-3 to 10^-1 window; h in {4, 6}; d in {1, 2};
      a in {2, 3}; k in {3, 4}; w in {4, 16}, giving between three and six layer indicators. Trials:
      10^6 per arm per configuration, three seeds. Arms: independent-seed-and-digest control, seed-shared-only,
      digest-shared-only, both-shared. Attempt budget per layer: fixed in STAGE 0 and never retuned,
      since retuning budgets would change the events. Bootstrap: 10^3 resamples per estimate. Multiple
      comparisons: the pair count is fixed in STAGE 0 at (d+2 choose 2) per parameter set and a Holm
      correction is applied across it.'
  controls:
  - Independent-seed, independent-digest signer arm, identical structure and budgets, same invocation,
    providing the measured zero point for every pairwise estimate.
  - Shared-component sweep as three configurations (seed only, digest only, both), so any excess attributes
    to a named shared input rather than to sharing in general.
  - Call-trace comparison between the shared and independent signers, requiring identical call sequences
    so only the draws differ.
  - Bootstrap bands on every mutual-information and correlation estimate, with the finite-sample bias
    correction's residual reported rather than absorbed.
  - 'Marginal-matching check: the shared and control arms must have per-layer marginals agreeing within
    band, since mutual-information bias depends on the marginals and a comparison at mismatched marginals
    is meaningless.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): An independent-seed, independent-digest signer: identical in structure,
    call sequence and attempt budgets, differing only in that each layer draws its own seed and its
    own digest block independently. Executed in the same invocation, on the same trial count and the
    same seeds for the trial loop. In that arm the layers are independent by construction, so every
    pairwise mutual information estimate must be zero within its band and every phi correlation must
    be zero within its band. That arm is not decoration: it is the measurement''s zero point, because
    finite-sample mutual information is biased upward for rare events by an amount that depends on
    the marginals, and quoting a shared-seed mutual information against a theoretical zero rather
    than against the control''s measured zero would manufacture a signal. If the control arm''s estimates
    are not zero within band after bias correction, the estimator is unusable at these marginals and
    no shared-seed number may be reported.'
  independent_variables:
  - shared-component configuration (none / seed / digest / both)
  - layer pair
  - toy parameter set and per-layer output sizes
  - seed
  metrics:
    primary:
    - per-layer marginal firing rate, all arms
    - bias-corrected pairwise mutual information with bootstrap band, all arms
    - pairwise phi correlation with band, all arms
    - shared-minus-control excess per pair, per configuration, after multiple-comparison correction
    - attribution table across the three shared-component configurations
    secondary:
    - bias-correction residual per estimate
    - marginal-matching check between shared and control arms
    - call-trace equality between shared and independent signers
    - joint contingency tables in full for every pair
    - wall-clock and trial counts per arm
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The bias-corrected pairwise mutual information between every pair of layer indicators
      in the independent-seed, independent-digest control arm.
    formula: Predicted value zero within the bootstrap band. The estimator is the plug-in mutual information
      of the two-by-two joint contingency table with a Miller-Madow bias correction of (m - 1)/(2N
      ln 2) bits, where m is the number of nonzero cells and N = 10^6 is the trial count, and the
      band is the 2.5th to 97.5th percentile of 10^3 bootstrap resamples. The pre-registration is
      that every pair in the control arm has zero inside its band after correction; failure on any
      pair halts the contract with an instrument result. No value is pre-registered for the shared
      arms, and the shared-arm comparison is defined as the excess over the control arm's measured
      value at matched marginals, never over a theoretical zero.
    source: Pre-registered in the parent proposal IDEA-20260816-f9bfbd before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at per-layer hash output sizes of 8 to 14 bits, hypertree heights 4 to
      6, one or two layers, FORS a of 2 to 3 and k of 3 to 4. These sizes are chosen for one reason
      and it is stated plainly: they are the only sizes at which per-layer forgery indicators fire
      often enough for a joint distribution to be estimated at all. At any realistic size every indicator
      is zero in every trial and the question cannot be asked, not because it is uninteresting but
      because it is unobservable. The transfer assumption is therefore the weakest in this batch and
      is stated as such rather than defended: that whatever dependence structure the shared seed and
      shared digest induce among layers is present in the shrunken regime and would be present, in
      the same direction, at larger sizes. The contract offers no evidence for that assumption, notes
      explicitly that shrinking may itself create dependence that does not exist at larger sizes,
      and under AGENTS.md rule 4 phrases no output as a statement about any deployed parameter set.'
    correspondence: null
  tail_checks:
  - Verify every per-layer marginal lies in the pre-registered window before any joint estimate is
    computed.
  - Verify marginals agree between the shared and control arms within band before any excess is computed.
  - Report the bias-correction residual alongside every estimate rather than absorbing it.
  - Verify call-trace equality between the shared and independent signers beyond the seed and digest
    fields.
  - Publish the full joint contingency table for every pair, so that any excess can be inspected as
    counts rather than as a derived statistic.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt the contract with an instrument result if any control-arm pair fails to read zero within
    band after bias correction; this is the gate and it is checked before any shared arm runs.
  - Halt any configuration whose marginals leave the pre-registered window, retuning output sizes
    and never attempt budgets, and record the retuning.
  - Halt the entire contract if the companion null harness has not cleared its self-consistency battery.
  - Hard wall-clock stop at 24 CPU-hours; a stop is an infrastructure outcome and is never negative
    mathematical evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: A control arm reading zero within band on every layer pair after bias correction,
    marginals inside the pre-registered window and matched across arms, and per-pair shared-minus-control
    excesses reported with bootstrap bands, the multiple-comparison correction applied, and the three-configuration
    attribution table published alongside full contingency tables.
  falsification_criterion:
  - 'The control arm shows nonzero pairwise mutual information beyond band: the estimator cannot resolve
    dependence at these marginals; the contract ends with an instrument result and no composition
    claim.'
  - 'Marginals fall outside the window or differ between arms beyond band: the comparison is void
    at that configuration.'
  - 'Call traces differ between shared and independent signers beyond the seed and digest fields:
    the arms differ in more than the shared input.'
  - 'An excess appears only in the both-shared configuration with no interaction mechanism nameable:
    reported as unattributed, explicitly not as a composition finding.'
  - 'An excess survives correction but its direction reverses across parameter sets: reported as unstable
    and not as a dependence measurement.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-f9bfbd
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The layer-confined event definitions are the contract's dominant risk and must be written and
    approved by the Coordinator before freezing; a definition asymmetry between arms manufactures
    correlation that no downstream control in this contract can detect.
  - Whether holding non-target layers ideal is acceptable, given that it biases the measurement toward
    independence, is a Coordinator scoping decision; the alternative -- attacking layers jointly --
    changes the object entirely and would need its own contract.
  - The choice of bias-correction method is consequential at rare-event marginals and the Coordinator
    should decide whether the Miller-Madow correction is adequate or whether a second estimator must
    be run in parallel as a cross-check.
  - This contract depends on the companion null harness and on the layer-confined attempt definitions
    that other entries in this bucket establish; the Coordinator must sequence them and must not approve
    this one first.
