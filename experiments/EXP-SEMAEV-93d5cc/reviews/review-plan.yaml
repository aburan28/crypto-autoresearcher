    reviewers_may_read: [the run directories, the frozen specification, trial plan, hypothesis, approval decision, this plan, the archived runs named in the specification]
    reviewers_may_not_read: [the run report under reports/run-*, any draft evidence record or analysis]
    lifted_for: []
  joints:
  - task_id: TASK-20261018-83a561
    assigned_to: TASK-20261018-83a561
    role: validator
    joint: run_integrity_and_controls
    scope: receipts, arms.tar.gz member hashes, arm provenance and fingerprints, CTRL-LEGACY-REPRO per cell, conclusion-field extraction
    attack_plan: >-
      (1) Show an arm ran the other arm's S4 (fib_child lines, installed
      fingerprints). (2) Show compare.extract misreads an archived field
      (re-extract one per cell by hand from the archived JSON). (3) Show the
      legacy control passes vacuously (empty common prefix, zero records).
      (4) Show a dependency cell read the wrong arm's upstream output.
    known_false_controls: [arm_swap, empty_common_prefix, wrong_dependency_arm]
