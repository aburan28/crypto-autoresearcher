    assigned_to: TASK-20261018-83a561
    quantity: the exact S4 term count mod p for one ICINV curve and the free-symbol set of the legacy S4
    parameters: "p = 4001, (a, b) of the first control curve; y^2 = x^3 + a x + b"
    blind_from: [statement and parameters only; Res_t(S3(x1,x2,t), S3(x3,x4,t)) computed independently, not via arms.py or harness/semaev.py]
