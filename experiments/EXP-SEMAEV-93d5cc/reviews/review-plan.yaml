    paths: [experiments/EXP-SEMAEV-93d5cc/specification.yaml, experiments/EXP-SEMAEV-93d5cc/trial-plan.json, ledger/hypotheses/H-SEMAEV-94dab2.yaml, ledger/decisions/DEC-20261018-a7a0fd.yaml]
