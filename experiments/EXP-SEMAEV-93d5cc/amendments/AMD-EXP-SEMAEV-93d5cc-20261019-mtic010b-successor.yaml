  trigger: >-
    The session's worker process restarted at about 00:37 UTC on 2026-10-19,
    13 minutes into the seventh trial (mtic-010b, RUN-SEMAEV-500a81, started
    00:24:00 UTC). The restart killed the supervisor and both arm processes.
    The trial wrote launch.json, command.txt, environment.json, both arms'
    partial stdout (ablation descents up to target 6 legacy, target 5
    repaired) and their copied inputs, but no raw-result.json, manifest,
    arms.tar.gz or execution receipt, so tools/experiment_execution.py
    reads it needs_reconciliation. Trials 1-6 are output_validated and
    unaffected.
  findings:
  - The interruption is infrastructure (process loss), not an outcome of either arm; no aggregation (K*, regime) was computed by the attempt.
  - The frozen stopping rule allows a repeat under a new id only after a supervisor-recorded failure before either arm produced output; this attempt had partial arm output and no supervisor record, so it cannot be repeated inside EXP-SEMAEV-93d5cc.
  - No rerun is possible under its frozen run id, and tools/experiment_preapproval.py refuses an already approved experiment.
  changes:
  - No byte of this experiment's specification, trial plan or implementation changes.
  - RUN-SEMAEV-500a81 is preserved as written, an interrupted non-evidence attempt; its partial ablation lines are not read as a result.
  - The mtic-010b cell, unchanged (same program, frozen instances, seeds, caps, arms, controls and conclusion rules), moves to the one-trial successor EXP-SEMAEV-88c46c (RUN-SEMAEV-980e8c), which reads this experiment's output-validated RUN-SEMAEV-2a8498 (mtic-007) and RUN-SEMAEV-fcd67c (mtic-008) as its dependencies.
  scientific_protocol_unchanged: true
  scientific_protocol_note: >-
    Cell, inputs, arms, controls, tolerance and conclusion fields are the
    parent's. Disclosed: before the successor was frozen the coordinator had
    read trials 1-6 and the interrupted attempt's partial logs (every
    ablation solve so far capped at 60 s in both arms). The successor's
    CTRL-LEGACY-REPRO and conclusion fields are frozen as the parent's and
    cannot be tuned to that knowledge.
