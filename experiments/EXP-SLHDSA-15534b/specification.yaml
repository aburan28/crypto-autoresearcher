experiment:
  id: EXP-SLHDSA-15534b
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-62210e; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-62210e
  question_id: RQ-SLHDSA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Implement and self-validate an address-keyed lazily sampled random-oracle backend for a scaled-down
    hypertree signer, reporting two-ideal-arm agreement, arm-order invariance, call-trace equality
    and the tweak-materialization curve
  objective: 'The one uncertainty a run reduces is whether this bucket can have controls at all in
    the sense docs/inventor-protocol.md section 3 requires, namely a null arm executable in the same
    invocation as its signal arm. Concretely: (i) whether two independently seeded instances of the
    lazily sampled oracle backend agree within Monte-Carlo band on every metric this bucket defines,
    and whether reversing their execution order leaves every number identical, which together are
    the minimum evidence that the harness carries no state across arms and is the precondition for
    every other entry here; (ii) whether the number of distinct tweaks the backend materializes per
    signature matches the structural call count computed by hand before any run, since a mismatch
    means the signer''s call structure differs from the structural description this repository marks
    UNVERIFIED and is a finding about that description; (iii) how sensitive downstream metrics are
    to the table-key definition, run at three candidate definitions in parallel, since the key is
    a modelling decision disguised as an implementation detail and its spread must be carried by everything
    built on it. A run reduces (i) to pass-or-fail with bands, (ii) to an integer comparison, and
    (iii) to a reported spread per metric.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'At most, a completed run supports: at the tested toy parameter
      sets, that two independently seeded instances of this specific backend agree within the stated
      bands on the listed metrics, that arm order does not change results, that call traces are identical
      between ideal and concrete backends, the measured tweak-materialization and reuse curves, and
      the spread across three table-key definitions. WHAT DOES NOT FOLLOW: nothing about SLH-DSA''s
      security, nothing about whether any real hash behaves ideally, no security level, no attack,
      no forgery, no statement about SHA-2 or SHAKE, no statement about any FIPS 205 parameter set,
      no statement about what the literature contains, and nothing about the fault or memory-corruption
      claim class. A harness that agrees with itself is internally consistent and nothing more; in
      particular a harness returning a constant would also agree with itself, which is why a uniformity
      check accompanies the agreement check and why neither alone is claimed to establish correctness.'
  inputs:
    procedure: 'STAGE 0, freeze (zero compute, ~3h human): define the three candidate table-key structures,
      hand-compute the structural call count per signature per toy parameter set, enumerate which
      bucket metrics are order-sensitive and therefore excluded from the self-consistency battery,
      and register the bands. STAGE 1, backend (~5h human): implement the lazily sampled oracle behind
      the same interface as the concrete backends; implement the call-trace recorder; enforce the
      table cap with a refusal rather than eviction. STAGE 2, self-consistency (~1h compute): two
      independently seeded ideal arms, all admitted metrics, 10^5 samples each, three seeds, one invocation.
      STAGE 3, order and generator checks (~30min compute): reversed arm order requiring identical
      numbers; second pseudorandom generator requiring agreement within band. STAGE 4, trace equality
      (~20min compute): ideal versus concrete call-trace comparison, requiring identical call-type
      and address sequences. STAGE 5, materialization curve (~1h compute): tweak creation and hit
      counts per signature over transcripts to 2^14 signatures, all parameter sets. STAGE 6, key-definition
      sweep (~2h compute): all three key structures in parallel across the admitted metrics, spread
      reported per metric.'
    instrument: Python 3.11. A dict-backed lazily sampled oracle keyed by a canonical byte encoding
      of the address structure plus public seed plus call input; random.Random and secrets.SystemRandom
      as the two independent sampling generators; hashlib for SHA-256 and SHAKE-128 truncated backends
      used only in the call-trace comparison arm; numpy for band arithmetic; sys.getsizeof and an
      explicit entry counter for the table cap. The toy signer and the backend interface are a new
      single-file module under harness/, following the existing control-module pattern of harness/ctrl_valueshuffle.py
      and harness/run_blocknull.py, executed through harness/runner.py so seeds, parameters and the
      resolved inference block land in the run manifest. No Sage, no external cryptographic library,
      no network.
    parameters: 'Toy signer: hash output n in {8, 12, 16} bits; hypertree height h in {4, 6, 8}; layers
      d in {1, 2}; FORS a in {2, 3}, k in {2, 3, 4}; Winternitz w in {4, 16}. Transcript lengths:
      2^6 to 2^14 signatures on a logarithmic grid. Self-consistency battery: 10^5 samples per metric
      per arm per seed, three seeds, two independently seeded ideal instances. Generators: two. Table-key
      definitions: three (coarse = address type only; structural = full address plus seed; fine =
      full address plus seed plus call input). Table cap: 2^24 entries, enforced by refusal. Arms
      per run: ideal-A, ideal-B, concrete (trace comparison only).'
  controls:
  - Second independently seeded ideal arm, all bucket metrics, same invocation.
  - Arm-order reversal, requiring bit-identical numbers.
  - Two different pseudorandom generators for the oracle sampling, requiring agreement within band.
  - Call-trace comparison between the ideal arm and a concrete arm, requiring identical sequences
    of call types and addresses so that only the returned values differ.
  - Three candidate table-key definitions (coarse, structural, fine), run in parallel, with the spread
    across them reported rather than one chosen silently.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): This entry is itself a control, so its null is inverted and stated
    explicitly: the object that must be run against it is a second, independently seeded instance
    of itself. Two ideal arms, different seeds, identical parameters, identical transcript structure,
    every metric this bucket defines, in the same invocation. The requirement is that all metrics
    agree within their Monte-Carlo bands and that the between-instance spread is no larger than the
    between-seed spread within a single instance. If two ideal arms disagree, the harness carries
    state across arms and no signal-versus-null comparison in this bucket is admissible until it does
    not. A second, sharper check: run the arms in reverse order and require identical numbers, which
    catches shared caches and generator reuse that seed variation alone would hide.'
  independent_variables:
  - ideal-arm instance and its seed
  - arm execution order
  - sampling generator
  - table-key definition
  - toy parameter set and transcript length
  metrics:
    primary:
    - pairwise metric disagreement between ideal-A and ideal-B with bands
    - arm-order-reversal difference per metric
    - tweak-materialization count per signature and its curve against transcript length
    - call-trace equality between ideal and concrete arms
    - spread across the three table-key definitions per metric
    secondary:
    - tweak-reuse (table hit) count per signature
    - uniformity check on sampled oracle outputs
    - table entry count at each transcript length and distance to the cap
    - generator-versus-generator agreement
    - wall-clock per arm and table memory footprint
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The maximum, over all admitted bucket metrics and all toy parameter sets, of the absolute
      disagreement between ideal arm A and ideal arm B.
    formula: Predicted value zero within the Monte-Carlo band. For a metric that is a mean of N =
      10^5 bounded samples with sample standard deviation s, the pre-registered two-sided 99 percent
      band is 2.576 * s * sqrt(2/N), the factor sqrt(2) accounting for the difference of two independent
      arms. The pre-registration is that every admitted metric's A-versus-B disagreement lies inside
      its own band, and separately that the arm-order-reversal difference is exactly zero for every
      metric, since order reversal introduces no additional sampling and any nonzero difference is
      state leakage rather than noise.
    source: Pre-registered in the parent proposal IDEA-20260816-62210e before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at hash outputs of 8 to 16 bits, hypertree heights 4 to 8, one or two hypertree
      layers, FORS a of 2 to 3 and k of 2 to 4, Winternitz w of 4 or 16, over transcripts to 2^14
      signatures. These are chosen as the smallest parameters at which every distinct call type in
      a hypertree signer appears at least once and at which the oracle table stays far below its cap,
      so the null is exact rather than truncated. The transfer assumption, stated and not established:
      that a harness validated as internally consistent at these sizes remains internally consistent
      at any larger size for which the table does not reach its cap, which is an engineering claim
      about the implementation and not a claim about cryptography. No output of this contract is a
      statement about any deployed parameter set, and under AGENTS.md rule 4 none is phrased as one.'
    correspondence: null
  tail_checks:
  - Uniformity check on the sampled oracle outputs, so that a degenerate backend returning constants
    cannot pass the agreement check.
  - Table entry count reported against the cap at every transcript length, with refusal rather than
    eviction if reached.
  - Call-trace equality verified element by element, not by summary statistics.
  - Hand-computed structural call count compared against the first-signature materialization count
    at every parameter set.
  - Confirm no module-level cache or shared generator exists anywhere in the modules this bucket touches,
    by an explicit code audit recorded in the run report.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and declare the harness unusable if two ideal arms disagree beyond band on any admitted metric.
  - Halt if arm-order reversal changes any number, and report the leaking component.
  - Halt at the table cap rather than evicting, recording the refusal boundary as a signature count
    per parameter set.
  - Hard wall-clock stop at 8 CPU-hours; a stop is an infrastructure outcome and is never negative
    mathematical evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Two independently seeded ideal arms agreeing within band on every admitted metric,
    arm-order reversal changing nothing, call traces identical to the concrete arm, the uniformity
    check cleared, and the tweak-materialization curve reported with its comparison against the hand-computed
    structural count.
  falsification_criterion:
  - 'Two ideal arms disagree beyond band: harness unusable, no entry in this bucket may cite it.'
  - 'Arm-order reversal changes any number: state leakage, same consequence.'
  - 'Call traces differ between ideal and concrete arms: backend substitution alters control flow
    and the arms are not comparable.'
  - 'The uniformity check fails: the backend is not sampling as claimed, and agreement between arms
    is worthless.'
  - 'The three key definitions disagree materially with no principled selection among them: the control''s
    semantics are underdetermined and every downstream comparison must carry the spread, which is
    reported rather than resolved.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-62210e
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The correct table-key structure is a modelling decision the Coordinator must rule on, or explicitly
    decline to rule on, before freezing; the contract runs three candidates but cannot itself decide
    which is the intended domain separation.
  - The list of order-sensitive metrics to exclude from the self-consistency battery must be settled
    in STAGE 0, and getting it wrong in either direction either hides leakage or manufactures a false
    failure.
  - The hand-computed structural call count depends on a structural description this repository marks
    UNVERIFIED; a Coordinator must decide whether a mismatch is reported as a finding about the description
    or blocks the run.
  - Whether this harness should be a shared module that other contracts in this bucket import, with
    the coupling that implies, or duplicated per contract, is an architectural decision with real
    consequences for whether a single bug invalidates several runs at once.
