  completion_gate:
    all_planned_runs_terminal: true
    missing_runs_explained: "none missing; 4 of 4 planned runs reached a terminal status"
    required_artifacts_present: true
    raw_data_and_summaries_agree: true
    raw_summary_agreement_note: >-
      Every summary.json is generated mechanically from its run's raw.json. The
      one derived table that raw.json lost to a key collision (PD-9, AN-7) is
      recomputed from recorded inputs and cross-checks exactly against the
      values the same raw.json records inside gate_decision.criteria.
    result_reproduces_from_recorded_command_and_revision: true
    no_ledger_status_changed_by_executor: true
    no_commit_made_by_executor: true
    passed: true

  executor_assessment:
    protocol_complete: true
    data_quality: limited
    data_quality_rationale: >-
      The n=32 arm is complete, controlled and exactly reproducible: 30
      instances, 15/15 training/held-out split enforced in code, all seven
      controls attested, exact-equality checks passing with zero deviation, and
      a byte-identical re-execution. It is nonetheless LIMITED, not good: (a)
      the n=64 arm produced no measurement at all, so half the frozen success
      criterion is unevaluated; (b) 15 held-out instances give wide binomial
      intervals (the 0.600 known-answer rate has a 95% Wilson interval of
      [0.357, 0.802]); (c) the vector-count grid is powers of two, so the 8.0x
      ratio is grid-resolved only; (d) the charged-work ratio is decided by a
      ~0.5% remainder on top of an m-independent LLL floor, and the labelled
      modelled alternative moves the orbit-versus-permutation comparison across
      its 1.0 bit threshold.
    requires_rerun: false
    rerun_note: >-
      No re-run of an executed run is warranted or permitted; a corrected run
      would need a new run ID. If the Coordinator wants the n=64 arm, it needs a
      NEW experiment or amendment with an environment providing a real lattice
      backend (fpylll/Sage) or a stronger reduction, since dimension 248 is out
      of reach of pure-Python LLL inside this budget.
    interpretation: >-
      NOT PROVIDED. The Executor records observations only. Whether these
      statistics support, weaken, or refute H-MLKEM-007 or HEUR-001 is for
      /review-evidence under Coordinator authority.
