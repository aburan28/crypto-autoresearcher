  protocol_deviations:
    - id: PD-1
      kind: context_flag
      statement: >-
        EXP-MLKEM-007.goal_id is GOAL-MLKEM-001, whose ledger status is
        closed_at_budget. The experiment's own approval (approved / frozen /
        approved_by: coordinator, and handoff TASK-20260727-012 authorised by
        DEC-20260727-002) is independent and current, so execution was
        authorised. Flagged for the Coordinator to record rather than discover
        at review; not resolved by the Executor.
    - id: PD-2
      kind: environment
      statement: >-
        The execution host provides CPython 3.11.15 and the standard library
        only. numpy, fpylll, sympy and Sage are absent and the frozen budget
        sets network_operations: none, so nothing could be installed. All
        lattice reduction, scoring and statistics are pure Python. This bounds
        the reachable parameters (PD-3) and is the direct cause of the
        RUN-MLKEM-027 outcome.
    - id: PD-3
      kind: reduced_search_space
      statement: >-
        The frozen orbit-subset size cap is 32. Shift-invariance of the guess
        block forces |G| = |J| = n/d_shift, and the candidate space is 3^|G|;
        at n=32 the only computationally reachable choice under PD-2 is
        |G| = |J| = 4 (81 candidates, fully enumerated). Admissible orbit
        subsets therefore have size <= 4 rather than <= 32. No threshold was
        changed: the frozen n=32 gate (r_eff >= 2.0, >= 2x vector-count
        reduction) remains attainable with |J| = 4, and both were in fact met.
        Rationale and arithmetic are in implementation.md section 3.
    - id: PD-4
      kind: artifact_naming
      statement: >-
        The frozen required_artifacts list names raw.json, summary.json,
        stdout.txt, stderr.txt; docs/evidence-and-reproducibility.md names
        raw-result.json, stdout.log, stderr.log. Both name sets are produced in
        every run directory; the docs-named files are byte-identical copies and
        every file's SHA-256 is recorded in the run manifest.
    - id: PD-5
      kind: inference_policy
      statement: >-
        The handoff sets inference.fallback_allowed: false, but this Claude Code
        harness cannot resolve the GPT-5.6 policy aliases in
        orchestration/model-policies.yaml (CLAUDE.md, "Model policy note"), so
        the executor-implementation policy was served by a Claude model. Every
        manifest records requested_policy: executor-implementation, the resolved
        model identifier, fallback_used: true, degraded_allowed: false, and
        model_verified: false (no `orchestration.adapter doctor --probe` was
        run). Recorded as a deviation rather than treated as authorised.
    - id: PD-6
      kind: contract_ambiguity_interpretation
      statement: >-
        The n32_gate stage stop_rule groups three conditions under the label
        correlated_reindexing, while outcome_classification.precedence assigns an
        exact-check disagreement to invalid_implementation_or_instrumentation and
        a work ratio >= 1 to non_bottleneck_local_gain. Applied: the stage stop
        rule governs STOPPING, the precedence list governs CLASSIFICATION (first
        match wins). No threshold was altered. Moot in practice: all three gate
        conditions passed.
    - id: PD-7
      kind: contract_ambiguity_interpretation
      statement: >-
        Two frozen metric phrases admit more than one reading and were pinned in
        implementation.md section 6 BEFORE any run, with BOTH readings
        pre-registered and both reported at every grid point, so no post-hoc
        choice was possible. (a) "50 percent layer success at matched held-out
        false-positive rate": threshold = (1-alpha) quantile of the pooled
        held-out wrong-candidate standardised scores, alpha = 1/80, which
        matches FPR across rules by construction. (b) "held-out false-positive
        rate of GLS divided by naive unweighted averaging at the same vectors
        and threshold": primary reading = matched pool size and matched held-out
        detection rate 0.5; secondary reading = matched pool size and the common
        standardised threshold tau = 3.0.
    - id: PD-8
      kind: work_reuse
      statement: >-
        The 30 reduced dual bases were built and charged once in RUN-MLKEM-025
        and reused by RUN-MLKEM-026 through a hashed cache
        (reduced-bases-n32.json, sha256 7d89cbae048f94b7...). Both run records
        carry the path and hash. The reduction work is charged in full in the
        cost accounting; it is not charged twice.
    - id: PD-9
      kind: implementation_defect_recorded
      statement: >-
        RUN-MLKEM-026 wrote its per-rule charged-work table under the key
        "charged_work", which the driver's writer then overwrote with the
        aggregate Work counters. The table was NOT re-measured by re-running the
        run (run records are immutable): RUN-MLKEM-028 recomputes it from the
        recorded charged_work_context and the recorded m50 values using the same
        frozen charged_work() function, and cross-checks it against the two
        values RUN-MLKEM-026 itself recorded in gate_decision.criteria. The
        cross-check agrees exactly (292,105,468 and 293,491,916); the agreement
        flag is in analysis/cost_accounting.json.raw_summary_crosscheck.
    - id: PD-10
      kind: gate_path_taken
      statement: >-
        The n=32 gate PASSED, so the specification's cancelled_by_budget /
        gate_stop path for RUN-MLKEM-027 did not apply. RUN-MLKEM-027 was
        executed under its frozen stage budget and terminated in
        resource_exhaustion. Both are terminal statuses; no planned run is
        missing.

