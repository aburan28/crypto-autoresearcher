        r_eff_relative_deviation_at_m2048: 0.0011045858712925136
        r_eff_deviation_below_frozen_0_50: true
        naive_unweighted_averaging_matches_gls_on_held_out: true
        adjudication: >-
          NOT PERFORMED. The Executor reports the frozen prediction reference and
          the comparison statistics only; whether HEUR-001 is supported or
          falsified is for the Reviewer and Coordinator.
    - id: OBS-8
      outcome_classification_under_frozen_precedence:
        evaluated_in: RUN-MLKEM-028 (analysis/gate_decision.json, run raw.json)
        first_match: fusion_no_advantage
        per_class:
          invalid_implementation_or_instrumentation: false
          covariance_control_failed: false
          known_answer_baseline_failed: false
          correlated_reindexing: "false at the n=32 limb; the n=64 limb is UNEVALUATED"
          fusion_no_advantage: true
          generic_batching: "true under the counted_exact cost model (not reached; fusion_no_advantage precedes it)"
          non_bottleneck_local_gain: false
          structural_information_gain_candidate: "not reached"
        scope: >-
          Every threshold was evaluated at n=32 only. The n=64 thresholds of the
          frozen success criterion (r_eff >= 4.0, >= 4x vector-count reduction
          for a subset of size <= 32) were NOT measured; no value is inferred for
          them. This record asserts nothing about n=64.
        note: >-
          This is the mechanical output of the frozen precedence rule applied to
          the measured statistics. It is not a judgement that H-MLKEM-007 is
          supported, refuted, weakened or promising; that judgement belongs to
          /review-evidence under Coordinator authority.
    - id: OBS-9
      n32_gate_decision:
        held_out_r_eff: 3.9828313527627914
        held_out_r_eff_min: 2.0
        held_out_r_eff_pass: true
        exact_equality_pass: true
        charged_work_gls: 292105468
        charged_work_unfused: 293491916
        fused_work_lower_than_unfused: true
        gate_pass: true
        consequence: RUN-MLKEM-027 was executed rather than cancelled

  anomalies:
    - id: AN-1
      kind: unexpected_observation
      statement: >-
        Held-out orbit-score effective rank is 3.983 of a maximum 4.000 (99.6%),
        i.e. the wrong-candidate orbit scores are very nearly uncorrelated. The
        mechanism's stated premise (H-MLKEM-007.mechanism: orbit scores are
        "correlated reindexings of shared vector material", so naive
        independence weighting is invalid) is not what was measured at these toy
        parameters. Recorded as an observation; no conclusion drawn.
    - id: AN-2
      kind: unexpected_observation
      statement: >-
        Because the estimated covariance is near-diagonal with near-equal
        variances, the fitted GLS weights are within 3% of uniform at every grid
        point and the covariance-aware rule reduces numerically to the naive
        unweighted mean it was supposed to beat.
    - id: AN-3
      kind: unexpected_observation
      statement: >-
        The size-matched random signed-permutation control performs WORSE than
        the unfused baseline (m50 1024 vs 512), not merely equal. Mechanism:
        being size-matched, the control comprises the identity element plus 3
        non-commuting signed permutations, whose scores carry no signal and
        dilute the single informative element.
    - id: AN-4
      kind: unexpected_observation
      statement: >-
        No rule exceeds a held-out success rate of 0.733 at any vector count up
        to 2048, i.e. roughly a quarter of held-out instances are never
        recovered however many vectors are used. Consistent with instances whose
        guess-block coordinates take low-prior CBD values (P(+-3) = 1/64), which
        caps the achievable per-instance signal-to-noise ratio independently of
        m. Recorded; not corrected for.
    - id: AN-5
      kind: unexpected_observation
      statement: >-
        The shuffled-orbit-label negative control shows a heavier-than-Gaussian
        upper tail: held-out FPR at the standardised threshold tau = 3.0 is
        0.0058-0.0117 versus 0.00135 for a normal. Relevant to any later use of
        Gaussian tail approximations for these scores.
    - id: AN-6
      kind: instrumentation
      statement: >-
        Exact re-verification of the reduced bases (integer Gram + exact-rational
        Gram-Schmidt, sharing no floating-point state with the solver) found
        marginal float64 drift: seed 1 has 1 size-reduction violation with
        max|mu| = 0.501352 against the 0.5 bound and 1 Lovasz violation, seed 16
        has 0 size violations and 1 Lovasz violation; the effective delta
        actually satisfied is 0.989888 / 0.989961 against the requested 0.99.
        Immaterial: every residual, phase index and weight used by the
        measurement is computed over the integers or exact rationals, the
        exact-equality control passes with zero deviation, and pool norms are
        measured directly (465-933 at n=32).
    - id: AN-7
      kind: implementation_defect
      statement: >-
        Output key collision in RUN-MLKEM-026's raw.json (see PD-9). Detected
        after the run completed; resolved by deterministic recomputation in
        RUN-MLKEM-028 with an exact cross-check against RUN-MLKEM-026's own
        recorded gate values, not by re-running an immutable run record.
    - id: AN-8
      kind: development_note
      statement: >-
        The first version of the LLL output verifier used float64 Gram-Schmidt
        and reported spurious size-reduction and Lovasz violations at dimension
        124. It was replaced with the exact-rational verifier BEFORE any run
        executed. Recorded so no reader mistakes the exact verifier's small
        residual findings (AN-6) for the earlier spurious ones.
    - id: AN-9
      kind: infrastructure
      statement: >-
        RUN-MLKEM-027 consumed its entire 1700 s stage budget without completing
        one of 30 required lattice reductions. Recorded as resource_exhaustion
        with zero evidence value.

