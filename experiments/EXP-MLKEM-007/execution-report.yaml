  observations:
    - id: OBS-1
      metric: orbit_score_effective_rank
      scope: n=32, selected orbit subset {0,8,16,24}, reference vector count 2048
      measured:
        training_r_eff: 3.987235596868607
        held_out_r_eff: 3.9828313527627914
        maximum_possible: 4.0
        relative_train_holdout_deviation: 0.0011045858712925136
      frozen_gate_threshold: ">= 2.0 (n=32)"
      across_grid: "held-out r_eff in [3.9690, 3.9968] at every vector count from 4 to 2048"
      note: >-
        Observation, not interpretation: the wrong-candidate orbit-score
        covariance is nearly diagonal with nearly equal variances
        (diagonal ~0.67-0.75; off-diagonals -0.028 to +0.005 at m=2048).
    - id: OBS-2
      metric: short_vector_count_for_50_percent_layer_success
      scope: n=32, held-out seeds 16-30, matched held-out FPR alpha = 1/80
      measured:
        m50_unfused_single_orbit: 512
        m50_unweighted_mean: 64
        m50_gls_covariance_aware: 64
        m50_random_signed_permutation: 1024
        m50_shuffled_orbit_labels: null
        ratio_unfused_over_gls: 8.0
      frozen_gate_threshold: ">= 2.0x (n=32)"
      grid_resolution_caveat: >-
        The vector-count grid is 4,8,16,32,64,128,256,512,1024,2048, so the
        measured ratio 8.0 is a grid-resolved value; held-out success was 0.467
        for GLS already at m=16 and 0.467 for the unfused baseline at m=256, so
        the underlying ratio is bracketed but not resolved more finely.
    - id: OBS-3
      metric: held_out_false_positive_rate_gls_vs_unweighted
      scope: n=32, held-out seeds, both pre-registered readings (PD-7)
      measured:
        matched_detection_reading_ratio_at_m64: 1.000
        matched_detection_reading_ratio_across_grid: "0.995, 1.255, 1.000, 1.000, 1.000, then GLS and unweighted both measure 0 false positives at m >= 128"
        standardised_threshold_tau_3_reading_ratio: "1.000 at every vector count"
      frozen_threshold: "GLS must be at least 2x lower, i.e. ratio <= 0.5"
      note: >-
        The fitted GLS weights are [0.2567, 0.2586, 0.2427, 0.2420] at m=2048
        and within 3% of uniform at every grid point, so the GLS rule and the
        naive unweighted mean coincide numerically. Held-out success curves for
        the two rules are identical at 9 of 10 grid points (they differ only at
        m=8: 0.200 vs 0.267).
    - id: OBS-4
      metric: total_charged_score_work_ratio
      scope: n=32, each rule at its own held-out operating point
      measured_label: counted_exact (LLL and sieve terms measured)
      measured:
        gls_over_unfused: 0.9952760266146479
        charged_work_gls_at_m64: 292105468
        charged_work_unfused_at_m512: 293491916
        charged_work_unweighted_mean_at_m64: 292067004
        charged_work_random_signed_permutation_at_m1024: 296536828
      frozen_threshold: "< 1 for materiality"
      regime_caveat: >-
        ~291.6M of the ~293M charged units are the m-independent LLL floor, so
        the ratio is driven by a ~0.5% m-dependent remainder. A separately
        labelled MODELED alternative that re-charges reduction proportionally to
        m (a sieve-dominated regime) gives ratio 0.127 for GLS. The frozen
        decision uses the counted_exact figure above; the modeled figure is
        reported only so the measured result is not mistaken for a
        regime-independent one.
    - id: OBS-5
      metric: true_orbit_vs_random_signed_permutation_gain
      scope: n=32, frozen toy cost model
      measured_label: counted_exact
      measured:
        gls_projected_gain_bits_vs_unfused: 0.0068314013896972085
        random_signed_permutation_projected_gain_bits_vs_unfused: -0.014890523502919506
        difference_bits: 0.021721924892616713
      frozen_threshold: ">= 1.0 bit"
      modeled_alternative_label: modeled
      modeled_alternative:
        gls_gain_bits: 2.977069125962081
        permutation_gain_bits: -1.0124000094689534
        difference_bits: 3.9894691354310344
      note: >-
        Both figures are reported; the frozen classification uses the
        counted_exact one. The two readings fall on opposite sides of the 1.0
        bit threshold, and that fact is itself an observation.
    - id: OBS-6
      controls_summary:
        CTRL-KNOWN-ANSWER: "PASS - unfused single-orbit baseline recovers the planted layer top-1 on 9/15 training instances (0.600) at the reference vector count 2048; frozen pass condition >= 0.5"
        CTRL-COVARIANCE-MODEL: "PASS - exact signed-permutation structure holds for every orbit element at n=32 and n=64; max chi-square 5.047 (n=32) and 10.668 (n=64) against the df=6, alpha=0.001 critical value 22.458; all first- and second-moment checks inside +-4 standard errors"
        CTRL-FUSION-ABLATION: "MEASURED at every grid point on identical vectors, thresholds and instances (see OBS-3)"
        CTRL-RANDOM-SIGNED-PERMUTATION: "MEASURED, fixed before the secret from its own derivation path, guess-block preserving, own GLS fit (see OBS-2, OBS-5)"
        CTRL-SHUFFLED-ORBIT-LABELS: "PASS - held-out success rate 0.000 at every one of the 10 vector counts; m50 undefined; no held-out gain"
        CTRL-EXACT-EQUALITY: "PASS - 192 exact residual comparisons (batched negacyclic correlation vs scalar <v, X^j b>, mod q), 37,632 exact phase-index comparisons (mod P), 37,632 exact Fraction weight comparisons, and a maximum float relative deviation of 0.0 against a 1e-9 tolerance"
        CTRL-SEED-DISCIPLINE: "PASS - the set of seeds read by any fitting phase (covariance_fit, subset_selection, threshold_pinning, calibration) contains no held-out seed in any run; attested in every manifest"
    - id: OBS-7
      heur_001_comparison_statistics:
