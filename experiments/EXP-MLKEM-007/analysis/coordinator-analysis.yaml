    this is recorded as an open item in DEC-20260803-9b3d40.next_actions.

  # ------------------------------------------------------------------
  # 0. Validity determination -- performed BEFORE any interpretation
  # ------------------------------------------------------------------
  validity:
    verdict: ADMISSIBLE_WITH_RECORDED_DEFECTS
    checks:
      run_count: >-
        4 planned, 4 terminal (3 completed_valid, 1 resource_exhaustion), 0
        missing; matches specification.yaml#replication.expected_run_count = 4.
      required_artifacts: >-
        38 declared by the frozen specification; snapshot receipt records 0
        missing; every file carries a SHA-256 in its run manifest and in the
        receipt.
      manifest_schema: >-
        All four manifests carry exact command, commit and dirty state,
        environment and dependency versions, seeds and derivation paths,
        inference block, timestamps, resource measurements, stdout/stderr,
        raw and summary, validity status. Schema-complete.
      seed_discipline: >-
        30 frozen seeds, 1-15 training / 16-30 held-out, split before any
        fitting. ctrl_seed_discipline in every manifest reports
        held_out_seeds_read_by_fitting_phases: [] and violations: []. RUN-026
        records the fitting phases reading exactly seeds 1-15.
      seed_integrity: >-
        RUN-026 re-derives all 30 planted layers from the recorded derivation
        paths using the sampler alone (no scoring, fusion or covariance state);
        30/30 layers, candidate indices and secret hashes match.
      raw_summary_agreement: >-
        Every summary.json is generated from its run's raw.json. One disclosed
        exception, PD-9/AN-7, below.
      control_comparability: >-
        All five fusion rules measured on identical instances, identical
        vectors, identical thresholds, at all ten grid points. CTRL-KNOWN-ANSWER,
        CTRL-COVARIANCE-MODEL, CTRL-EXACT-EQUALITY, CTRL-SHUFFLED-ORBIT-LABELS
        and CTRL-SEED-DISCIPLINE PASS; CTRL-FUSION-ABLATION and
        CTRL-RANDOM-SIGNED-PERMUTATION measured at every grid point.
      determinism: >-
        gate32 re-executed from the recorded command and revision into a
        scratch directory: orbit-scores.json byte-identical; in raw.json only
        wall-clock and resource fields differ. This is determinism, NOT
        independent replication.
      certificates: >-
        certificate.kind is `none` on all four runs, confirmed by direct read
        of each manifest's result.certificate. No discrete-log solve and no
        factor-base relation is claimed anywhere in this experiment, so there
        is nothing to certify. Recorded rather than assumed.
      coordinator_arithmetic_spot_checks:
        - "r_eff = (tr Sigma)^2 / tr(Sigma^2) recomputed from the archived held-out covariance at m=2048: 3.98283, matching the recorded 3.9828313527627914."
        - "charged-work ratio 292105468 / 293491916 = 0.995276, matching."
        - "log2(293491916 / 292105468) = 0.006831 bits, matching."
        - "orbit minus permutation: 0.006831 - (-0.014891) = 0.021722 bits, matching."
        - "m50 ratio 512 / 64 = 8.0, matching."
    disclosed_integrity_exception:
      id: PD-9 / AN-7
      finding: >-
        RUN-026's raw.json lost its per-rule charged-work table to an output
        key collision; that key holds the driver's aggregate counters instead.
        The table was NOT re-measured (run records are immutable) but
        recomputed by RUN-028 from the recorded charged_work_context with the
        same frozen charged_work() function, and cross-checked against the two
        values RUN-026's own raw.json records under gate_decision.criteria
        (292,105,468 and 293,491,916). The cross-check agrees exactly.
      coordinator_ruling: >-
        ACCEPTABLE WITH DISCLOSURE. The decisive figures are traceable to the
        immutable raw output. Recorded as a packaging defect: the recomputed
        table nevertheless appears inside RUN-026's own manifest.yaml and
        summary.json, i.e. a derived quantity absent from that run's raw output
        is carried in that run's own manifest, labelled by charged_work_note.
        Future packaging must keep derived recomputations in the analysis run's
        artifacts only.
    recorded_but_not_a_defect: >-
      RUN-026's own gate_decision.criteria.exact_equality_pass is null; the
      value true in analysis/gate_decision.json is imported from RUN-025's
      CTRL-EXACT-EQUALITY attestation (192 exact residual comparisons, 37,632
      exact phase-index comparisons, 37,632 exact Fraction weight comparisons,
      maximum float relative deviation 0.0 against a 1e-9 tolerance). The gate
      limb is discharged by a prior run in the same package: traceable and
      correct, but cross-run rather than within-run provenance.

  # ------------------------------------------------------------------
  # 1. OBSERVATION -- measurements only, no thresholds, no interpretation
  # ------------------------------------------------------------------
  observation:
    O-1_effective_rank: >-
      n=32, subset {0,8,16,24}, m=2048. Training r_eff 3.987236; held-out
      3.982831; maximum possible 4.000; relative train/held-out deviation
      0.0011. Held-out r_eff in [3.9690, 3.9968] at every one of the ten vector
      counts. Held-out wrong-candidate covariance near-diagonal with near-equal
      variances: diagonal 0.693-0.799, off-diagonals -0.0344 to +0.0186.
    O-2_fitted_weights: >-
      Held-out-evaluated GLS weights at m=2048 are [0.256679, 0.258563,
      0.242732, 0.242026]. Maximum relative deviation from uniform 3.43 percent,
      at every grid point. (The execution report's OBS-3 says "within 3
      percent"; the archived weights give 3.43 percent. Recorded for precision;
      it changes nothing.)
    O-3_m50: >-
      Short vectors for 50 percent held-out layer success at matched held-out
      FPR alpha = 1/80: unfused single orbit 512; naive unweighted mean 64;
      GLS covariance-aware 64; random signed permutation 1024; shuffled orbit
      labels never reaches 50 percent (null). Grid is powers of two 4..2048, so
      these are grid-resolved: GLS already reaches 0.467 held-out success at
      m=16 and the unfused baseline reaches 0.467 at m=256.
    O-4_fpr_gls_vs_unweighted: >-
      Both pre-registered readings (PD-7) reported at every grid point.
      Matched-detection reading at m=64: GLS 0.005, unweighted 0.005, ratio
      1.000; across the grid 0.995, 1.255, 1.000, 1.000, 1.000, then both rules
      measure zero false positives at m >= 128. Standardised-threshold
      (tau = 3.0) reading: ratio 1.000 at every one of the ten vector counts.
      Held-out success curves identical at 9 of 10 grid points; they differ only
      at m=8, where the UNWEIGHTED MEAN is higher (0.267, 4/15) than GLS
      (0.200, 3/15).
    O-5_charged_work: >-
      counted_exact, each rule at its own held-out operating point: GLS
      292,105,468 (m=64); unweighted mean 292,067,004 (m=64); unfused
      293,491,916 (m=512); random signed permutation 296,536,828 (m=1024).
      Ratio GLS/unfused 0.995276. Of ~293 M charged units, 291,736,456 are the
      m-independent LLL floor.
    O-6_projected_bits: >-
      counted_exact: GLS vs unfused +0.006831 bits; permutation vs unfused
      -0.014891 bits; difference 0.021722 bits. modeled sieve-dominated
      alternative (LLL and sieve re-charged proportionally to m): GLS
      +2.977069, permutation -1.012400, difference 3.989469 bits.
    O-7_controls: >-
      CTRL-KNOWN-ANSWER: unfused baseline recovers the planted layer top-1 on
      9/15 training instances (0.600) at m=2048; frozen pass condition >= 0.5;
      95 percent Wilson interval [0.357, 0.802]. CTRL-COVARIANCE-MODEL: exact
      signed-permutation structure holds for every orbit element at n=32 and
      n=64; maximum chi-square 5.047 (n=32) and 10.668 (n=64) against the df=6,
      alpha=0.001 critical value 22.458; all first- and second-moment checks
      inside +-4 standard errors. CTRL-SHUFFLED-ORBIT-LABELS: held-out success
      0.000 at every one of the ten vector counts; m50 undefined; no held-out
      gain. CTRL-EXACT-EQUALITY: maximum float relative deviation 0.0.
      CTRL-SEED-DISCIPLINE: no held-out seed read by any fitting phase.
    O-8_heur_001_statistics: >-
      Held-out/training fused null variance ratio at m=2048: 1.0919 (frozen
      band: factor 2). r_eff relative deviation 0.0011 (frozen bound 0.50).
      Naive unweighted averaging matches GLS on held-out instances: true.
    O-9_n64_arm: >-
      RUN-MLKEM-027, status resource_exhaustion. Projected dual lattice
      dimension 248. ZERO of 30 required LLL reductions completed within the
      frozen 1700 s stage budget; the first attempt consumed 1699.996 s without
      finishing. No n=64 metric of any kind was emitted. Corroborated by
      RUN-025's bounded n=64 feasibility probe, which did not complete the same
      reduction in 240 s. Host is pure CPython 3.11.15, standard library only;
      numpy, fpylll, sympy and Sage absent; frozen budget sets
      network_operations: none.
    O-10_anomalies: >-
      AN-3: the size-matched random signed-permutation control performs WORSE
      than the unfused baseline (m50 1024 vs 512) -- being size-matched it
      comprises the identity plus 3 non-commuting signed permutations whose
      scores carry no signal and dilute the one informative element. AN-4: no
      rule exceeds 0.733 held-out success at any vector count up to 2048;
      roughly a quarter of held-out instances are never recovered however many
      vectors are used. AN-5: the shuffled-label null shows a
      heavier-than-Gaussian upper tail -- held-out FPR at tau = 3.0 is
      0.0058-0.0117 versus 0.00135 for a normal. AN-6: exact-rational
      re-verification of the reduced bases found marginal float64 drift
      (effective delta 0.98989 / 0.98996 against the requested 0.99; one
      size-reduction and two Lovasz violations across 30 bases), immaterial
      because every residual, phase index and weight used by the measurement is
      computed over the integers or exact rationals.

  # ------------------------------------------------------------------
  # 2. COMPARISON -- measurements against the frozen thresholds
  # ------------------------------------------------------------------
  comparison:
    freeze_attestation: >-
      Thresholds quoted from specification.yaml and H-MLKEM-007.yaml as frozen
      at approval. No threshold was altered before, during or after execution:
      amendments_requested 0, amendments_applied 0, rescoring_of_completed_runs
      none.
    n32_gate:
      verdict: PASSED
      limbs:
        held_out_r_eff: "threshold >= 2.0; measured 3.982831; MET"
        exact_equality: "scalar = batched; maximum relative deviation 0.0; MET (via RUN-025)"
        fused_work_lower: "strict; 292,105,468 < 293,491,916; MET"
      consequence: >-
        RUN-MLKEM-027 was EXECUTED, not recorded cancelled_by_budget /
        gate_stop. The specification's gate-stop path did not apply (PD-10).
    n32_full_criterion:
      m50_ratio: "threshold >= 2x; measured 8.0x (grid-resolved); MET"
      charged_work_ratio: "threshold < 1; measured 0.995276; MET"
      gls_vs_unweighted_fpr: >-
        threshold <= 0.5; measured 1.000 under the matched-detection reading
        and 1.000 under the tau=3.0 reading; NOT MET under BOTH pre-registered
        readings.
      orbit_vs_permutation_bits: >-
        threshold >= 1.0 bit; measured 0.021722 bits on the frozen counted_exact
        decision metric; NOT MET. The labelled `modeled` sieve-dominated
        alternative gives 3.989469 bits, on the other side of the threshold.
    n64_thresholds:
      verdict: UNEVALUATED
      statement: >-
        r_eff >= 4.0 and >= 4x vector-count reduction for at least one selected
        subset of size <= 32 were NOT MEASURED. RUN-MLKEM-027 produced no
        measurement of any kind. Under AGENTS.md rule 5 and the specification's
        own stopping rules a resource exhaustion is an infrastructure outcome
        with ZERO evidence value. These thresholds are neither met nor failed
        and no value is inferred for them. Half the frozen success criterion is
        UNEVALUATED, NOT FAILED.
    outcome_classification:
      executor_first_match: fusion_no_advantage
      coordinator_verdict: >-
        CONFIRMED. Each antecedent re-derived from the archived artifacts.
      per_class:
        invalid_implementation_or_instrumentation: "false -- exact equality passes, seed discipline passes, all required artifacts present"
        covariance_control_failed: "false -- chi-square and moment checks pass at n=32 and n=64"
        known_answer_baseline_failed: "false -- 0.600 >= 0.5"
        correlated_reindexing: >-
          false at the n=32 limb (3.983 >= 2.0). The n=64 limb of the same
          frozen disjunction is UNEVALUATED; that disjunct is neither true nor
          false, and the class is established at n=32 only.
        fusion_no_advantage: "TRUE -- ratio 1.000 against a required <= 0.5"
        generic_batching: >-
          antecedent true (0.0217 < 1.0 bit) but not reached, since
          fusion_no_advantage precedes it. See limitation L-4: the matched
          antecedent must NOT be read as "the orbit behaves like a random
          permutation".
        non_bottleneck_local_gain: "false -- 0.995276 < 1"
        structural_information_gain_candidate: "not reached"
    heur_001_adjudication:
      note: >-
        The Executor deliberately did not adjudicate (OBS-7:
        "adjudication: NOT PERFORMED"). Adjudication is the Coordinator's.
      disjunct_1_fpr_outside_factor_2_band: "NOT triggered -- variance ratio 1.0919, within factor 2 at every grid point"
      disjunct_2_r_eff_deviation_ge_50_percent: "NOT triggered -- maximum deviation 0.56 percent"
      disjunct_3_naive_averaging_matches_gls: "TRIGGERED -- identical at 9 of 10 grid points; FPR ratio 1.000 under both readings"
      verdict: >-
        HEUR-001 IS FALSIFIED AS WRITTEN, at n=32 with the selected subset of
        size 4, by disjunct (3) alone.
      what_did_not_happen: >-
        The covariance model transferred from training to held-out essentially
        perfectly: disjuncts (1) and (2) are comfortably inside their bands.
        The heuristic's stated subject -- transfer -- held. The disjunct that
        fired says the model was UNNECESSARY, which is a different failure.
        That the frozen wording bundled "does not transfer" with "is not
        needed" is a drafting defect and is recorded as one. It is NOT grounds
        to reinterpret the trigger after the fact, and no amendment is made:
        success criteria are never changed after observing outcomes without a
        versioned protocol_amendment.

  # ------------------------------------------------------------------
  # 3. INFERENCE
  # ------------------------------------------------------------------
  inference:
    scope_of_every_statement_below: >-
      Synthetic MLWE over Z_3329[X]/(X^n+1) at n = 32 ONLY, module rank k = 2,
      centered-binomial eta = 3, layer prime p = 3, one layer, shift parameter
      d_shift = 8, orbit subset {0,8,16,24} of size 4, pool of the 2048
      shortest vectors from an LLL(delta=0.99)-reduced projected q-ary dual
      basis at lattice dimension 124, 15 held-out instances, pure-CPython
      solver, 6000 s / 2.0 CPU-hours / 4 GB budget. claim_tier: toy.
    I-1_covariance_term_contributes_nothing_and_the_reason_is_derivable: >-
      The wrong-candidate orbit-score covariance is near-diagonal with
      near-equal variances (r_eff 3.983 of a maximum 4.000, i.e. 99.6 percent).
      GLS weights are Sigma^{-1}1/(1'Sigma^{-1}1), which equal uniform weights
      exactly when Sigma has constant row sums; here they deviate from uniform
      by at most 3.43 percent, and the GLS statistic reduces numerically to the
      naive unweighted mean it was required to beat. The archived refutation
      note computes from the archived held-out covariance that an ORACLE GLS
      estimator -- one given the true Sigma for free -- reduces the fused null
      standard deviation by 0.297 percent relative to uniform weighting,
      whereas a 2x reduction in tail false-positive rate at tau = 3.0 requires
      about 6.4 percent. The frozen >= 2x criterion was unreachable at the
      measured covariance by a factor of about 22 in the standard-deviation
      budget -- not a marginal miss. The realised estimator did not even
      capture the 0.297 percent: fitted on 15 training instances, its held-out
      null variance is 0.0258 percent HIGHER than uniform's, i.e. estimation
      noise exceeded the attainable gain. proof_status: derivation.
    I-2_the_vector_count_gain_is_averaging_not_covariance_awareness: >-
      Averaging k near-independent equal-variance scores divides the null
      variance by k; with k = 4 the predicted m50 gain is 4x, and the observed
      grid-resolved 8x brackets that prediction (the underlying ratio is
      bracketed between roughly 4x and 16x by the power-of-two grid). The naive
      unweighted mean -- the ablation control -- attains the identical m50 of
      64 at strictly LOWER charged work (292,067,004 vs 292,105,468; the GLS
      rule additionally pays 38,464 covariance-estimation operations). The
      covariance-aware rule is weakly Pareto-dominated by its own ablation at
      every measured grid point, and strictly dominated on charged work and at
      m=8.
    I-3_the_isometry_carries_signal_the_fusion_rule_does_not: >-
      This is the sharpest honest statement the data support. The size-matched
      random signed-permutation control reaches m50 1024 against the true
      orbit's 64 -- a 16x difference -- because 3 of its 4 elements carry no
      signal and dilute the one that does (AN-3), whereas all four orbit
      elements are signal-preserving. The shuffled-label null is flat at 0.000
      success everywhere, so the measured effect is not an instrument artifact
      (docs/inventor-protocol.md, "controls before belief"). What the
      experiment refutes at this configuration is the COVARIANCE-AWARE FUSION
      limb, not the isometry-reuse premise.
    I-4_heur_001: >-
      HEUR-001 is falsified as written at this configuration, by the "naive
      averaging matches GLS" disjunct only. Its transfer disjuncts held with
      wide margins.
    I-5_nothing_inferred_at_n64_and_the_existential_is_under_tested: >-
      H-MLKEM-007 quantifies over "at least one selected orbit subset of size
      at most 32". Under the frozen implementation, shift invariance of the
      guess block forces |G| = |J| = n/d_shift, and with the frozen d_shift = 8
      the only computationally reachable choice at n=32 in a pure-Python
      environment was |J| = 4, giving 81 enumerable candidates (PD-2, PD-3).
      The existential was evaluated at ONE point of an admissible range up to
      32, and the restriction came from the execution host, not from the
      mathematics. Under AGENTS.md rule 5 an infrastructure-driven restriction
      of a search space cannot be converted into a negative result about the
      part of the space that was never searched.
    I-6_consequent_decision: >-
      weaken, NOT reject_scoped. A scoped rejection confined to (n=32,
      d_shift=8, |J|=4, this pool construction) would have been defensible on
      the artifact hierarchy -- a derivation-grade refutation artifact exists,
      level 2 of the three levels in docs/claims-and-verification.md -- and it
      is declined on two grounds stated rather than implied: (a) this is a
      SINGLE EXECUTION, and the byte-identical re-run establishes determinism,
      not independent replication; (b) the derivation is conditional on the
      MEASURED Sigma, itself one measurement at one pool construction and one
      d_shift, so it does not bound what Sigma looks like elsewhere in the
      frozen parameter space. Rejecting a theory deserves the same skepticism
      as confirming one.

  # ------------------------------------------------------------------
  # 4. LIMITATION
  # ------------------------------------------------------------------
  limitation:
    L-1_scale: >-
      claim_tier toy: synthetic MLWE at n in {32, 64}, q = 3329, k = 2, lattice
      dimension 124 at the only ring size that produced data. It says NOTHING
      WHATEVER about ML-KEM-512, ML-KEM-768 or ML-KEM-1024. No standardized
      parameter set was attacked, no estimator was run, no BKZ at scale was
      performed, no asymptotic claim is made or implied. Per the phrasing rule
      in docs/evidence-and-reproducibility.md: no improvement meeting the
      predefined threshold was observed over the tested instances, parameters,
      solver and resource budget.
    L-2_half_the_protocol_produced_no_data: >-
      The n=64 arm is UNEVALUATED, not failed. Every statement is scoped to
      n=32. The correlated_reindexing class's n=64 limb is neither true nor
      false.
    L-3_regime_sensitivity_primary_unresolved_confound: >-
      The orbit-vs-permutation metric straddles its own threshold: 0.0217 bits
      measured (counted_exact, the frozen decision metric) versus 3.989 bits
      under the labelled modeled sieve-dominated alternative, against a 1.0-bit
      criterion. The frozen cost model is dominated by an m-independent LLL
      floor (291.7 M of ~293 M charged units), so the ENTIRE charged-work
      comparison is decided by a ~0.5 percent m-dependent remainder. The
      total_charged_score_work_ratio < 1 criterion, which was MET at 0.995276,
      is met by that same remainder. Whether either metric would keep its
      verdict in a sieve-dominated regime is NOT DETERMINED by this experiment.
    L-4_generic_batching_must_not_be_read_by_its_name: >-
      Its frozen antecedent (orbit minus permutation < 1.0 bit) is satisfied,
      but the underlying vector-count data show the true orbit and the
      size-matched permutation are NOT equivalent objects (m50 64 vs 1024, a
      16x difference). The antecedent fires because the frozen counted_exact
      cost model, dominated by an m-independent reduction floor, cannot see a
      16x vector-count difference -- not because the orbit behaves like a
      random permutation. This does not change the first-match classification
      (fusion_no_advantage precedes it) and it bounds what any record may
      assert about "generic batching" here.
    L-5_statistical_power: >-
      15 held-out instances give wide binomial intervals: the 0.600
      known-answer rate has a 95 percent Wilson interval of [0.357, 0.802]. The
      m50 grid is powers of two, so the 8.0x ratio is grid-resolved only. The
      m=8 GLS-vs-ablation difference (3/15 vs 4/15) is one instance and is not
      a measured effect.
    L-6_search_space_bound: >-
      Orbit subsets of size > 4 were never evaluated at n=32 (PD-3), and the
      cap came from the pure-Python host (PD-2). Alternative d_shift values,
      which would admit |J| = 8 or 16, were not swept.
    L-7_tail_model: >-
      AN-5 records a heavier-than-Gaussian upper tail in the null (FPR
      0.0058-0.0117 at tau = 3.0 versus 0.00135 for a normal). The refutation
      note's step from standard-deviation budget to false-positive-rate budget
      uses a Gaussian tail; a heavier tail makes the required standard-deviation
      reduction LARGER, so that step is conservative in the direction of the
      conclusion. The variance computation itself uses no tail model.
    L-8_achievement_ceiling: >-
      AN-4: no rule exceeds 0.733 held-out success at any vector count up to
      2048; about 25 percent of held-out instances are never recovered,
      consistent with guess-block coordinates taking low-prior CBD values
      (P(+-3) = 1/64). This caps achievable per-instance signal-to-noise
      independently of m and was not corrected for.
    L-9_inference_policy_defect_PD5: >-
      Every manifest records requested_policy executor-implementation,
      fallback_used true, degraded_allowed false, model_verified false, while
      the frozen handoff TASK-20260727-012 sets fallback_allowed false. The
      substitution was UNAUTHORISED and is NOT retroactively authorised (see
      DEC-20260803-9b3d40, ruling PD-5). It does not void the measurements: the
      frozen protocol is deterministic, every reported quantity is produced by
      archived code rather than by model judgement, and the gate32 stage
      reproduces byte-identically. No claim in this analysis or in
      EV-MLKEM-c47a1e rests on model judgement.
    L-10_authorization_chain_defect_PD1_extended: >-
      EXP-MLKEM-007.goal_id is GOAL-MLKEM-001, whose status is closed_at_budget
      since 2026-07-24 with next_action "None under this goal ... no seventh
      batch is authorized". Separately, and NOT flagged by the Executor, the
      handoff's authorized_by DEC-20260727-002 does not cover this task:
      DEC-20260727-002 is a GOAL-ECDLP-001 budget / BATCH-009 decision whose
      target_ids are GOAL-ECDLP-001, BATCH-009 and TASK-20260727-002..006, and
      it names no ML-KEM record. Additionally the identifier TASK-20260727-012
      is occupied twice: by ledger/handoffs/TASK-20260727-012.yaml (this
      experiment's executor handoff) and by
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/reviews/TASK-20260727-012/
      (a red-team review cited in DEC-20260727-008.evidence_refs). See
      DEC-20260803-9b3d40 ruling PD-1: execution was legitimate on the archived
      frozen approval; the chain defects are recorded for correction; and this
      adjudication does NOT reopen GOAL-MLKEM-001.
    L-11_what_this_does_not_bear_on: >-
      Nothing here bears on side-channel, fault, or oracle-dependent attacks,
      on MLWE hardness in general, or on the carry-aware LaMS layer derivation
      and commit-pinned matched baseline that DEC-20260722-003 requires; those
      remain open prerequisites and are not discharged. The corrected ePrint
      2026/279 isometric gains (approximately 0-0.8 bit per EV-MLKEM-001) bound
      the plausible headroom for this family, and no result here may be
      paraphrased as improving a standardized matched baseline.

  # ------------------------------------------------------------------
  # 5. Pareto position (docs/inventor-protocol.md)
  # ------------------------------------------------------------------
  pareto:
    dominated_by: >-
      unweighted_mean (CTRL-FUSION-ABLATION). At n=32 it attains the identical
      m50 (64), the identical held-out FPR under both pre-registered readings,
      and strictly lower charged work (292,067,004 vs 292,105,468), while
