  experiment_id: EXP-MLKEM-007
  hypothesis_id: H-MLKEM-007
  task_id: TASK-20260727-012
  run_ids: [RUN-MLKEM-025, RUN-MLKEM-026, RUN-MLKEM-027, RUN-MLKEM-028]
  claim_tier: toy
