  scope:
    included:
      - Stage 0, zero compute. The capacity certificate and its four control readings, as guarded code (CODE-CERT).
      - Stage 0, zero compute. The ideal k-list CEILING table at k in 4, 8, 16, 32, with and without orbit unknowns, the gap and closure lines in both named ambients, the (C3) and (C4) floors with their ambients, and the ceiling-model threshold arithmetic.
      - Stage 0, zero compute. The Koblitz orders and admissibility; the sample-size table; the exact-quotient audit (CODE-AUDIT) and the degeneracy audit (CODE-DEGEN), both re-run at S0-6 against their frozen C-4 tables.
      - Stage 1. Run-level controls (PC-CERT-1 to PC-CERT-4, PC-1, PC-5, PC-6c, PC-7, PC-7c, PC-16, PC-16b, PC-16d, PC-18, PC-11 to PC-14), the PC-16c lead guard, and the per-cell gate (PC-8, PC-2, PC-3, PC-4, PC-4b, PC-6a, PC-6b, PC-6d, PC-9), with the two absorbed calibration rows; issue_clearance (PC-10).
      - Stage 2. The declared arms keyed by role on the ladder cells at N^(1/3) and N^(1/4), on the fixed-alphabet cells at M = 16 and on the ordinary cell, ten seeds, ten stratified shuffles per seed, the exact-saturated null, the held-out labels RLFAM, XCO1 and XCO2, the IR-2 positivity check and the used-cell image of every EXACT reading.
      - Stage 3. The per-role classification along the ladder (L1 to L3) with one verdict and one L2 interval per declared Koblitz role, PC-15, PC-17, SR-6 as revised and the HEUR-B2 held-out tests.
      - The HEUR-B1 validation by direct pair-sum counting on the primary cell, as committed code (CODE-HB1).
    excluded:
      - Any k-tree run at deployed parameters. ECC2K-130 appears only as Stage 0 arithmetic.
