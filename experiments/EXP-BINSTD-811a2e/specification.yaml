      - Sampling Stage 2 from the target subgroup 4E (RR-1 route (b)), declined in version 3 and carried.
      - The Koblitz cells at n = 29 and 31 (inadmissible), and n = 41 at N^(1/3) and N^(1/4) (priced and declined).
      - Any statement about the AUXIN census, RUN-FROB or EXP-FROB-30006a, or any EXP-QSP-70b731 run.

