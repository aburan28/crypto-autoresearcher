experiment:
  id: EXP-FRODOFO-2ffb29
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-32c366; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-32c366
  question_id: RQ-FRODO-a2dbe2
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Target-hit growth exponent of a multi-target hash search at toy digest widths, salted versus
    unsalted versus salt-ignoring, with a pre-registered closed-form breakpoint and a distinct-salt-count
    degradation sweep.
  objective: 'One uncertainty is reduced: whether the effect of a hash-input salt on multi-target
    amortization appears as a locatable transition in a measurable counting object, and whether its
    location is predicted in advance by a closed form. (i) IS THE RIG CLEAN. Does the salt-ignoring
    arm, which has identical input length and identical salt distribution but ignores salt when matching,
    reproduce the unsalted growth curve within sampling error? Does the single-target control show
    no transition? Does the sampled curve agree with the exact expectation from the one-step recurrence?
    Any failure voids every downstream number. (ii) WHERE IS THE TRANSITION. On the salted arm, fitting
    a segmented model with a free breakpoint below saturation, where does the growth exponent change
    and by how much, and how far is that from the closed form registered before the run? (iii) HOW
    DOES IT DEGRADE. Sweeping the number of distinct salt values independently of salt length from
    one to the full target count, what is the shape of the growth-exponent degradation curve? No claim
    about FrodoKEM is made or attempted, and no primary source is required.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: at digest widths 20 to 32
      bits, for the stated target counts, seeds and query budgets, a multi-target hash search exhibited
      the measured growth exponents per arm, a breakpoint at the measured location with the stated
      interval, agreement or disagreement with the pre-registered closed form by the measured amount,
      and the measured degradation curve versus distinct-salt count. WHAT DOES NOT FOLLOW: nothing
      about FrodoKEM, nothing about its 2025 revision, nothing about any real digest width, no bit-security
      figure for any scheme, no adversary cost, and no statement that salting does or does not improve
      any scheme''s security. Every frequency measured is a property of the toy widths and does not
      transfer.'
  inputs:
    procedure: 'STAGE 0, register the closed-form breakpoint derivation as a frozen artifact BEFORE
      any code runs, with its balls-in-bins argument written out. Cost: human, no compute. STAGE 1,
      build the target generator, the salt-distribution controller with distinct-salt count as a direct
      parameter, the query process and the segmented-regression fitter. Cost: implementation. STAGE
      2, uniformity gate on the target generator; failure halts. Cost: minutes. STAGE 3, three-arm
      run at w = 24, 4096 targets, ten seeds, query budget spanning three decades below saturation,
      all arms in one invocation with disjoint seed streams. Cost: a few CPU-hours. STAGE 4, analytic
      cross-check of every sampled point against the recurrence expectation. Cost: minutes. STAGE
      5, digest-width sweep at w in {20, 24, 28, 32} to test breakpoint movement. Cost: several CPU-hours,
      dominated by w = 32. STAGE 6, distinct-salt sweep at w = 24 over a frozen ladder of distinct-salt
      counts. Cost: several CPU-hours. STAGE 7, immutable run records via harness/runner.py with seeds,
      budgets and resolved inference block.'
    instrument: Python 3 with hashlib for digest generation and the standard library dict as the target
      table; random.Random with recorded disjoint seed streams; statistics and a hand-written segmented
      least-squares fitter with a free breakpoint, so that no external fitting library's defaults
      silently choose the breakpoint. numpy permitted for the counting loops only, with a stdlib fallback
      required to produce identical counts and checked to do so on a small budget. No Sage, no lattice
      estimator, no external computer-algebra system. Run manifests, seeds and resolved inference
      block through harness/runner.py; ids via tools/allocate_id.py.
    parameters: Digest widths w in {20, 24, 28, 32}. Target counts U times C in {1, 256, 4096, 65536},
      with U and C reported separately as {1x1, 16x16, 64x64, 256x256}. Salt lengths s in {0, 8, 16,
      32} bits with distinct-salt count swept independently over the frozen ladder {1, 2, 4, 16, 64,
      256, 1024, 4096}. Query budgets up to 2^28 at w = 24 and 2^30 at w = 32, capped by the saturation
      detector at 60 percent of targets hit. Ten seeds per configuration, disjoint streams. Segmented
      fit on log2 axes with the breakpoint free and bootstrapped over 1000 resamples.
  controls:
  - Salt-ignoring null arm with identical input length and identical salt distribution, run in the
    same invocation.
  - Single-target control, for which no transition can exist.
  - Digest-uniformity test on the target generator, reported before any growth exponent.
  - Saturation detector, with all slope fits restricted to the pre-saturation region and the excluded
    region reported.
  - 'Digest-width sweep as the structural tell: the breakpoint must move with w as the closed form
    requires.'
  - 'Analytic cross-check: exact expectation computed from the recurrence, compared against the sampled
    curve at every measured point.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Salt-ignoring arm: targets carry a salt field of the identical length
    and identical distribution, but the matching rule ignores it, run through the IDENTICAL query
    process and the IDENTICAL measurement in the same invocation. This null must reproduce the unsalted
    growth curve to within sampling error, which isolates the partition effect from the mere presence
    of a longer hash input. If the salt-ignoring arm shows the transition, then the transition is
    produced by the rig''s input formatting rather than by partitioning, and the signal arm means
    nothing. A second null uses a single target (U times C equal to one), for which the growth exponent
    must be that of a plain preimage search and no transition can exist; a transition there is a rig
    bug.'
  independent_variables:
  - 'arm: unsalted, salted, salt-ignoring null, single-target control'
  - digest width w in {20, 24, 28, 32}
  - target count U times C
  - number of distinct salt values among live targets
  - seed index
  metrics:
    primary:
    - distinct targets hit versus query count, per arm
    - fitted growth exponent below saturation with bootstrap interval
    - breakpoint location in log2 queries with bootstrap interval
    - absolute error against the pre-registered closed-form breakpoint
    - growth exponent as a function of distinct-salt count
    secondary:
    - digest uniformity statistic of the target generator
    - fraction of query budget excluded as saturated
    - maximum deviation of the sampled curve from the recurrence expectation
    - wall-clock and peak memory per configuration
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The breakpoint location on the salted arm and the growth-exponent difference between
      the salted and unsalted arms below saturation.
    formula: 'Registered before the run: with N live targets partitioned across D distinct salt values
      and digest width w, the expected distinct targets hit after Q queries is N times (1 minus (1
      minus 2^-w)^(Q/D)) under uniform salt assignment, giving a growth exponent near 1 while Q/D
      is far below 2^w and a breakpoint at log2 Q equal to w plus log2 D. The measured breakpoint
      is predicted to fall within 1.0 of w plus log2 D, and the unsalted arm (D = 1) is predicted
      to show growth exponent at least 0.9 while the fully salted arm (D = N) shows at most 0.6, both
      measured below the saturation cutoff.'
    source: Pre-registered in the parent proposal IDEA-20260816-32c366 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at digest widths 20 to 32 bits with at most 65536 targets, which is enumerable
      and permits an exact analytic cross-check. This is many orders of magnitude below any real digest
      width, deliberately, because the object of study is the SHAPE of the transition and its location
      relative to w plus log2 D, not any absolute cost. TRANSFER ASSUMPTION, stated and not assumed
      benign: the breakpoint formula is scale-free in w by construction, so its FORM is expected to
      transfer while every absolute query count is a toy artifact; and the whole measurement assumes
      the multi-target structure is that of independent uniform digests, which is a modelling choice
      that no real scheme is claimed here to satisfy.'
    correspondence: null
  tail_checks:
  - Report the saturation-excluded fraction per configuration, since a fit performed mostly on saturated
    data is meaningless.
  - Report the maximum rather than mean deviation of the sampled curve from the recurrence expectation.
  - Report results at the smallest distinct-salt counts separately, since the degradation curve is
    expected to be poorly resolved there and pooling would hide it.
  - Report the seed-to-seed spread of the breakpoint location, not only the bootstrap interval, since
    bootstrap intervals over one seed understate variability.
  - Report behaviour at the largest w where the query budget is a smaller multiple of 2^w, since the
    fit region shrinks there.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt and report if the digest-uniformity gate fails.
  - Halt and report if the salt-ignoring null arm differs from the unsalted arm beyond sampling error,
    since every downstream number would be void.
  - Cap total wall clock at eight CPU-hours across all configurations; a cap hit is an infrastructure
    outcome and is never negative mathematical evidence, and the configurations completed are reported
    as such.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All rig gates pass, a breakpoint is located on the salted arm with a bootstrap
    interval narrower than the pre-registered tolerance, its location agrees with w plus log2 D within
    1.0 in log2 queries, the salted and unsalted growth exponents separate at the pre-registered margin,
    and the breakpoint moves with w as the closed form requires.
  falsification_criterion:
  - The salt-ignoring null arm differs from the unsalted arm.
  - The single-target control shows a breakpoint.
  - The measured breakpoint disagrees with w plus log2 D by more than 1.0 in log2 queries.
  - The breakpoint does not move with digest width.
  - No breakpoint is detectable at any distinct-salt count below saturation.
  - The sampled curve deviates from the recurrence expectation beyond the stated tolerance.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-32c366
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The closed-form breakpoint assumes uniform salt assignment across targets; a Coordinator must
    decide whether a non-uniform assignment ladder is also required, since real distinct-salt distributions
    would not be uniform.
  - The saturation cutoff at 60 percent of targets hit is proposed, not derived; it must be fixed
    before approval and cannot be adjusted after seeing a fit.
  - Whether this rig should later be bound to any filed FrodoKEM specification is explicitly out of
    scope and depends on RQ-FRODO-a2dbe2 constraint 1; the sequencing decision belongs to the Coordinator.
