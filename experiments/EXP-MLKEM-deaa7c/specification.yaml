experiment:
  id: EXP-MLKEM-deaa7c
  hypothesis_id: H-MLKEM-731e03
  derived_from_idea: IDEA-20260821-46c09f
  question_id: RQ-MLKEM-003
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Exact-rational lower-hull computation over the readable set of SVP (memory-exponent, time-exponent)
    pairs, emitting one hull per named reading cell and the integer |B minus A| only after a
    convex-by-construction null, a calibrated false-positive interval, and a continuum plus k-grid-density
    control that can declare the headline an artifact
  objective: >-
    The one uncertainty a run reduces is whether this lane's memory methodology -- charging memory by a
    scalar PRICE -- is a complete instrument, or whether it is systematically blind to algorithms that win
    only under a hard BUDGET. The two explanations differ in the value of ONE INTEGER computed from a
    table of published constants. A run establishes (i) the corpus's own (m, t) pairs enumerated with an
    explicit EXCLUSION LIST, emitted before any external reading so the two contributions are separable;
    (ii) the exact-rational lower hull per named reading cell, with per-point on-hull/off-hull status and
    exact off-hull distance in exponent units and in bits at three committed dimensions; (iii) the
    price-selectable set A, the budget-selectable set B, and |B minus A| per reading; (iv) the continuum
    and k-grid-density controls, which can declare that integer a discretisation artifact and strike it;
    and (v) the classical and quantum HULL slopes and their gap ratio. NO ATTACK IS IMPLEMENTED, NO
    INSTANCE IS SOLVED, NOTHING IS MEASURED in the cryptanalytic sense; the dominant cost is READING
    primary sources, and the reading is owed anyway.
  what_this_is_not:
    - >-
      Not an attack, not a solve, not a measurement of any lattice quantity. Every number is arithmetic on
      published asymptotic exponents whose o(d) terms are unbounded.
    - >-
      Not a concrete-cost statement at any dimension. Expressing an exponent gap in bits at a committed
      effective sieve dimension is a convention-internal device for expressing SIZE and is labelled as
      such wherever it appears.
    - >-
      Not a correction to any committed record. Observing that a committed price-based charge lives inside
      the price parameterisation is a SCOPE statement about it, and no status change is proposed.
    - >-
      Not a physical-admissibility claim about the quantum rows. Those are taken at face value so that a
      sibling record attacking their admissibility can be read against this one.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has
      been executed under this contract.
  claim_ceiling:
    tier: model_arithmetic
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: "over the readable set S, under reading cell X and after the continuum
      control, exactly n points are budget-optimal at some achievable m0 and price-optimal at no alpha,
      with off-hull distances D in exponent units", plus the hull slopes and their ratio per reading. WHAT
      DOES NOT FOLLOW: nothing about concrete cost at d = 385 or d = 825; nothing about points excluded for
      want of a read source; nothing about whether the quantum rows are physically admissible; and no FIPS
      parameter set is affected or cleared. A point whose status flips across any named reading is
      UNDECIDED and may not be reported as on-hull or off-hull.
  inputs:
    procedure: >-
      STEP 0, CORPUS FIRST, ZERO COMPUTE AND OWED BEFORE ANYTHING ELSE. Enumerate every (m, t) pair
      already recorded in the corpus and emit the INCLUSION and EXCLUSION lists BEFORE any reading of
      external primary text, so the corpus contribution is separable from the web contribution. Every row
      enters S or enters the exclusion list WITH A REASON. STEP 1, REPLACE EVERY RECALLED EXPONENT WITH A
      READ ONE. Read the primary sources and record, per point, the exact (m, t) pair, the MEMORY MODEL
      (classical bits, QCRAM bits, qubits -- not interchangeable and not to be plotted on one axis without
      a declared conversion), the tuple size k, and whether o(d) is additive or multiplicative in the
      exponent. Any point whose source cannot be read is EXCLUDED and recorded as excluded, NOT estimated.
      Priority order for reading, by how much the answer moves: the unread quantum memory exponent first,
      then the quantum anchor's reading ambiguity, then the classical 2-sieve's memory reading, then the
      enumeration constant. STEP 2, THE CONTINUUM AND THE GRID, DECLARED BEFORE ANY HULL IS COMPUTED. Read
      the body of the tuple-sieve source for the parametric (m(k,.), t(k,.)) curve for arbitrary tuple
      size, and the corresponding quantum curve where one exists, recording the parametric form verbatim
      with its page. If the body cannot be obtained, record that and carry the declared consequence. STEP
      3, THE NULLS FIRST. Run NULL-1 (linear tradeoff, must return all-on-hull) and NULL-2 (convex plus
      noise, at least 8 draws, giving the false-positive interval), and emit the classification rule's
      verdict on BOTH before touching S. STEP 4, THE HULL. Compute the exact lower-left hull of S in EXACT
      RATIONALS per reading cell; emit per-point status and off-hull distance in exponent units and in
      bits at the three committed dimensions. STEP 5, THE TWO SELECTION MAPS. Sweep alpha over a grid in
      [0,1] recording the price minimiser; sweep m0 over a grid covering [0, 0.30] recording the budget
      minimiser; emit A, B and B minus A per reading. NOT REPORTABLE UNTIL STEP 6 HAS RUN. STEP 6, NULL-4.
      Arm 4a instantiates the continuum from Step 2, samples it densely, recomputes |B minus A| against it,
      and reports the discrete and continuum answers SIDE BY SIDE. Arm 4b recomputes |B minus A| at at
      least three k-grid densities and REPORTS whether it is monotone in density rather than assuming it.
      STEP 7, THE ABLATIONS. Recompute S with the pre-2025 quantum 3-tuple time exponent substituted, and
      separately with the corpus quantum memory-frontier point REMOVED, reporting both differences; the
      second ablation is the one that withdrew the parent record's original headline and it is run
      EXPLICITLY rather than asserted. STEP 8, THE SENSITIVITY REGION over the four named uncertain inputs,
      with every point whose status flips across any named reading labelled UNDECIDED.
    instrument: >-
      One script, under one hour of single-core arithmetic. No sieve, no lattice, no instrument rebuild, no
      seed drawn. EXACT RATIONAL ARITHMETIC THROUGHOUT, not floating point, because the margins at stake
      (about 0.004 classically and about 0.001 quantumly under the relevant readings) are within a few ulps
      of the error a naive orientation test makes. A memory-model column prevents classical bits, QCRAM
      bits and qubits being silently plotted on one axis. Recorded through harness/runner.py.
    parameters: >-
      Reading cells: the product of the two named classical readings of the 2-sieve's memory coordinate and
      the two named quantum readings of the anchor's memory coordinate -- four cells, one hull each, NEVER
      a single hull. alpha grid over [0, 1]; m0 grid covering [0, 0.30]. At least three k-grid densities
      where readable. At least 8 NULL-2 draws. Off-hull distances expressed in exponent units and in bits
      at the three committed effective sieve dimensions 385.084530 / 590.132012 / 825.235330, the latter
      labelled a size convention and not a cost. The enumeration constant carried as TWO named values -- the
      recalled one and the in-lane calibrated one -- because part of the answer's sign is decided by which
      is adopted.
  controls:
    - >-
      NULL-1, THE CONVEX-BY-CONSTRUCTION FAMILY: apply the identical hull code to a point set drawn from an
      exactly linear log-log tradeoff sampled at 20 values of m. Every point of a linear curve is on its
      own lower hull, so the test MUST return all-on-hull with zero off-hull distance. CAN IT FAIL: yes,
      and this is the specific failure it is built to catch -- a floating-point orientation test on
      nearly-collinear points is exactly how a 0.004 margin gets misclassified. If NULL-1 reports any point
      off-hull, the implementation is wrong and NO result is reported.
    - >-
      NULL-2, THE CALIBRATED FALSE-POSITIVE RATE: draw point sets from a strictly convex curve plus
      Gaussian noise of declared magnitude, at the same cardinality as S, over at least 8 draws, since a
      generated comparator is a measurement and needs a sample size. This supplies the false-positive rate
      to quote beside any off-hull verdict. CAN IT FAIL: yes -- if the observed off-hull count on S is
      INSIDE the interval NULL-2 produces at the sigma implied by the exponents' own uncertainty, then S is
      indistinguishable from a convex set with noise and NO non-convexity is reportable.
    - >-
      NULL-3, THE FORCED-VALUE DERIVATION, EMITTED PER READING BECAUSE ITS PREMISE IS NOT UNCONDITIONAL:
      the coordinate extremes of S are forced on-hull under every reading and carry NO information; a point
      dominated under one classical reading is forced off-hull there while under the other reading it is a
      hull vertex. The forced set is therefore emitted PER READING, and a run that reports a
      reading-dependent fact as a forced one, or a forced fact as a finding, is INADMISSIBLE.
    - >-
      NULL-4a, THE CONTINUUM ARM: instantiate the parametric tuple-sieve tradeoff curve, sample it densely,
      recompute the lower hull and |B minus A| against the continuum, and report both answers side by side.
      DECLARED IN ADVANCE: A POCKET THAT VANISHES UNDER THE CONTINUUM IS AN ARTIFACT OF DISCRETISATION AND
      IS NOT REPORTABLE AS A FINDING, whatever its size in bits on the discrete set.
    - >-
      NULL-4b, THE DENSITY SWEEP: recompute |B minus A| at at least THREE k-grid densities and REPORT
      whether it is monotone in density rather than assuming it. Two endpoints do not establish a
      direction. A |B minus A| that GROWS with density is the signature of a continuum being chopped; flat
      or shrinking is the signature of a real pocket.
    - >-
      VERDICT ON THE NULL ARM FIRST: the classification rule (on-hull / off-hull / UNDECIDED) is emitted on
      NULL-1 and NULL-2 BEFORE S is classified. If it emits the same labels on the convex null as on S, it
      discriminates nothing.
    - >-
      UNIT TEST: the alpha = 0 price minimiser must equal the global time minimiser.
    - >-
      ROUNDING SELF-CHECK: every illustrative figure carried over from the parent record is recomputed from
      unrounded inputs and any disagreement is reported.
    - >-
      ABLATION CONTROLS: the pre-2025 quantum time exponent as the before-picture of the external
      ingredient's insertion, and the corpus quantum memory-frontier point removed as the before-picture of
      the corpus insertion.
    - >-
      MEMORY-MODEL COLUMN preventing classical bits, QCRAM bits and qubits being silently plotted on one
      axis; the classical and quantum hulls are computed and reported SEPARATELY.
  independent_variables:
    - >-
      reading cell, the product of the two named classical readings and the two named quantum readings
    - price parameter alpha, over a grid in [0, 1]
    - memory budget m0, over a grid covering [0, 0.30]
    - k-grid density, over at least three levels
    - >-
      point-set ablation, one of full S, S with the pre-2025 quantum time exponent, or S with the corpus
      quantum memory-frontier point removed
    - >-
      enumeration constant, one of the two named in-repo values
  metrics:
    primary:
      - >-
        B_minus_A, units a non-negative integer, computed as the number of points of S that are
        budget-optimal at some m0 on the grid AND price-optimal at no alpha on the grid, reported PER
        READING CELL and only AFTER the continuum arm
      - >-
        B_minus_A_continuum, units a non-negative integer, computed identically against the densely sampled
        parametric curve, reported side by side with the discrete value
      - >-
        B_minus_A_by_k_grid_density, units a non-negative integer per density level, with an explicit
        monotonicity statement across at least three levels
      - >-
        off_hull_distance, units exponent units (exact rational) and bits at each of the three committed
        dimensions, computed per point per reading cell as the exact vertical distance to the lower hull
    secondary:
      - >-
        hull_membership_status, units one of on-hull, off-hull or UNDECIDED, per point per reading cell,
        with UNDECIDED assigned to any point whose status flips across a named reading
      - >-
        the full S table with source and page per exponent, the memory model per point, and the EXCLUSION
        LIST with a reason per excluded point
      - >-
        A, the price-selectable set, and B, the budget-selectable set, per reading cell
      - >-
        NULL-1 verdict, units a boolean plus any off-hull distance found on a linear set (which must be
        zero)
      - >-
        NULL-2 false-positive interval over at least 8 draws, units a count interval at the declared sigma
      - >-
        classical and quantum HULL SLOPES between the two named memory coordinates, and their gap ratio,
        per reading cell, computed against hull values and never against individual points
      - >-
        before/after hull under each of the two declared ablations
      - >-
        the sensitivity region over the four named uncertain inputs, with the UNDECIDED list
      - >-
        crossing dimensions: the dimension at which each point enters or leaves the hull, since hull
        membership depends on d only through the enumeration point whose t grows like log d
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      |B minus A| after the continuum arm, per reading cell; and the classical-minus-quantum gap ratio
      computed against hull values.
    formula: >-
      Predicted, before any run: |B minus A| after the continuum arm is small and its SIGN is what the
      batch decides; a single surviving point refutes the completeness of the price parameterisation and
      zero vindicates it. The classical 3-tuple point's off-hull distance is about 0.004 under one
      classical reading and STRICTLY ON-HULL under the other, so the prediction is that its status is NOT
      ROBUSTLY SIGNED and the honest verdict is UNDECIDED until the 2-sieve memory and the enumeration
      constant are read. The quantum 3-tuple point's hull status is predicted UNCHANGED across the
      pre-2025/2025 substitution under one quantum reading (both off-hull) and changed by less than half a
      bit under the other, i.e. UNDECIDED. The gap ratio is predicted strictly above 1.0 under every named
      reading, i.e. the quantum advantage WIDENS as the memory budget tightens; the three readings computed
      by the parent record give values spanning roughly 1.3 to 6.5, and the specific value is NOT
      predicted -- only the direction is.
    source: >-
      Pre-registered in the parent proposal IDEA-20260821-46c09f, whose predictions block states each
      minimum effect above and which EXPLICITLY WITHDRAWS its own original headline (that the 2025 quantum
      result flipped an algorithm from price-invisible to price-selectable) on arithmetic performed before
      any compute, once a corpus point its first screen could not match was admitted. That withdrawal is
      carried here rather than hidden, and the withdrawn magnitude 2.75 for the gap ratio is replaced by a
      direction-only prediction. Never tuned to data.
  scale_relevance:
    tier: not_applicable
    justification: >-
      There is no experimental scale here: the object is a finite set of published asymptotic exponents and
      the operations on it are exact rational arithmetic. What replaces scale relevance is READING
      COVERAGE: the deliverable's validity is bounded by how many of the point set's exponents were read
      from primary sources rather than recalled, and by which reading cell is in force. That is why the
      exclusion list is a first-class artifact and why one hull is emitted per reading cell.
    correspondence: >-
      None. Expressing exponent gaps in bits at the three committed effective sieve dimensions is a size
      convention, not a correspondence to concrete cost, and is labelled as such at every occurrence.
  tail_checks:
    - >-
      Report every off-hull distance in EXACT RATIONALS as well as in bits, since the decisive margins are
      about 0.004 and about 0.001 and a rounded report is not decidable.
    - >-
      Report the points nearest the hull from above AND from below, since a point 0.001 below the hull and
      one 0.001 above it are the same measurement to within the readings' own uncertainty.
    - >-
      Report the NULL-2 interval's own tails, not only its centre, since the off-hull count on S is scored
      against that interval and a marginal exclusion must be visible as marginal.
    - >-
      Report the crossing dimension at which each point enters or leaves the hull, since hull membership
      depends on d through the enumeration point and a status quoted at one d is not a status.
    - >-
      Report every excluded point with its reason and its known coordinate, so that the single largest gap
      in S -- an unread quantum memory exponent that could dominate the anchor outright -- is visible
      rather than absent.
  replication:
    seeds:
      - 20260821
      - 20260822
      - 20260823
    independent_instances: 3
  budget:
    wall_clock_seconds: 3600
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 1.0
    memory_gb: 4
    maximum_memory_gb: 4
    maximum_runs: 8
  stopping_rules:
    - >-
      Step 0 (corpus enumeration and exclusion list) is emitted BEFORE any external reading, so the two
      contributions remain separable. This ordering is not negotiable after the fact.
    - >-
      Run NULL-1 and NULL-2 BEFORE S is classified. If NULL-1 reports any point of a linear tradeoff as
      off-hull, STOP; the implementation is wrong and nothing is reported.
    - >-
      |B minus A| is NOT REPORTED until NULL-4 has run. If neither NULL-4 arm can run -- the parametric
      form is unobtainable and fewer than four k values can be read -- |B minus A| is declared UNCONTROLLED
      FOR DISCRETISATION and is not a finding; only the price/budget theorem survives as a deliverable.
    - >-
      Any point whose source cannot be read is EXCLUDED and recorded as excluded. It is never estimated and
      never carried with a recalled coordinate.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. A budget exhaustion is a stop, never
      a negative result (AGENTS.md rule 5).
    - >-
      The reading cells, the alpha and m0 grids, the k-grid densities and the classification rule are
      frozen before any hull is computed and are not revised afterwards.
  invalidation_rules:
    - >-
      A timeout, crash or dependency failure makes the run failed_infrastructure and is NEVER negative
      mathematical evidence (AGENTS.md rule 5). A failed source fetch is such a failure and its consequence
      is an EXCLUSION, not an estimate.
    - >-
      A run computing the hull in FLOATING POINT rather than exact rationals is invalid_measurement: the
      decisive margins are within a few ulps of a naive orientation test's error.
    - >-
      A run emitting a SINGLE HULL rather than one per named reading cell is invalid_measurement, because
      the reading ambiguities are load-bearing and change the answer's sign.
    - >-
      A run reporting |B minus A| WITHOUT the NULL-4 continuum or density arm having run is
      invalid_measurement; the number is uncontrolled for discretisation.
    - >-
      A run that plots classical bits, QCRAM bits and qubits on ONE memory axis without a declared
      conversion is invalid_measurement: it committed a category error.
    - >-
      A run that ESTIMATES an unread exponent rather than excluding the point is invalid_measurement, and
      this hypothesis has already been shown wrong once for exactly that reason.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires a new
      contract; it is never a repair of this one.
  success_criterion: >-
    The run succeeds as a MEASUREMENT when all of the following hold and are reported: the corpus
    enumeration and exclusion list are emitted before any external reading; every included exponent is read
    from a primary source or a verbatim corpus record, and every unread point appears on the exclusion list
    with a reason; NULL-1 returns all-on-hull with zero off-hull distance on an exactly linear tradeoff and
    NULL-2 returns a false-positive interval over at least 8 draws, both emitted BEFORE S is classified;
    the hull is computed in exact rationals with one hull per named reading cell; per-point status and
    exact off-hull distance are reported in exponent units and in bits at the three committed dimensions;
    A, B and |B minus A| are reported per reading; NULL-4's continuum and density arms have run, or
    |B minus A| is explicitly declared UNCONTROLLED; both declared ablations are reported before and after;
    and the sensitivity region names every UNDECIDED point. Each is decidable from the primary metrics
    above. Note explicitly: |B minus A| = 0 and |B minus A| = 3 are BOTH successes of the measurement; the
    criterion is completeness, and the scientific verdict is read from the falsification criteria below.
  falsification_criterion:
    - >-
      |B minus A| is EMPTY after the continuum arm. THE HYPOTHESIS'S METHODOLOGICAL CLAIM IS REFUTED: the
      price parameterisation is complete over the readable algorithm set, the lane's price sweeps need no
      repair, and this is a clean negative that STRENGTHENS the sibling price-swept record. Substantial
      prior probability is placed on this outcome.
    - >-
      |B minus A| is non-empty on the discrete grid but EMPTY on the continuum arm, or increases
      monotonically with k-grid density. The pockets are manufactured by discretisation, the headline
      integer is an ARTIFACT and nothing about non-convexity is reportable.
    - >-
      Neither NULL-4 arm can run. |B minus A| is reported as UNCONTROLLED and is not a finding; only the
      price/budget theorem survives. This outcome is made likely by an already-failed source fetch and is
      declared here rather than discovered by a reviewer.
    - >-
      The off-hull count on S lies inside NULL-2's calibrated interval. S is indistinguishable from a convex
      set given its own exponent uncertainty; no non-convexity is reportable at any dimension.
    - >-
      NULL-1 reports any point of a linear tradeoff as off-hull. The hull implementation is wrong, nothing
      is reported, and an arithmetic defect is recorded.
    - >-
      The classical-minus-quantum gap ratio against hull values is at or below 1. The quantum advantage
      SHRINKS rather than grows under a memory budget and part (C) is reversed -- a more interesting result
      than the predicted direction.
    - >-
      Fewer than three distinct memory values can be read. The hull is degenerate, convexity is vacuous,
      and the run reports that the question could not be tested.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model and inference
      block, environment, and the frozen reading cells, grids and classification rule
    - >-
      the full S table with source and page per exponent, the memory model per point, and the EXCLUSION
      LIST carrying every unread coordinate with its reason
    - >-
      hull membership and exact off-hull distance per point, per reading cell, in exponent units and in
      bits at the three committed dimensions
    - >-
      A, B and B minus A per reading, plus |B minus A| on the continuum and at three k-grid densities with
      the monotonicity statement
    - >-
      NULL-1's verdict and NULL-2's false-positive interval over at least 8 draws, emitted before S was
      classified
    - >-
      classical and quantum hull slopes and the gap ratio, per reading, computed against hull values
    - >-
      the before/after hull under both declared ablations
    - >-
      the sensitivity region over the four named uncertain inputs, with the UNDECIDED list
    - >-
      the pre-registration text with the withdrawn headline recorded as withdrawn, written before the first
      run and hashed
    - >-
      certificate kind none; no solve, relation or distinguisher is claimed
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator authorship does not confer approval. This contract is review_required and is NOT
      approved; approved_by is null and execution_authorized is false (AGENTS.md rule 1). Approval is the
      user's gate because it authorizes execution and spends compute.
    - >-
      The dominant cost is READING primary sources, not compute. A coordinator should decide before
      approval whether the required reads are reachable in this environment, since the parent record's own
      attempt to fetch the load-bearing parametric curve FAILED and the declared consequence of that
      failure is that the headline integer becomes unreportable.
    - >-
      The two reading ambiguities must be listed by name in the frozen contract before approval, since the
      contract forbids emitting a single hull and a run that resolved them silently would not be auditable.
    - >-
      This contract proposes NO status change to any committed record. Any reading of its output as a
      correction to a committed evidence record is out of scope and must be refused.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment lifecycle steps 3-5
    source_record: IDEA-20260821-46c09f
    authored_at: '2026-08-25'
    note: >-
      Every metric, control, threshold and falsification condition is transcribed from the parent
      proposal's parts (A)-(E), mechanism Stages 0-4, null_object_control (NULL-1 through NULL-4),
      predictions and falsification_conditions blocks. The parent record's own WITHDRAWAL of its original
      headline -- performed on arithmetic before any compute, after a corpus point its first grep could not
      match was admitted -- is carried here as a pre-registered prediction of UNCHANGED status rather than
      quietly dropped, and the withdrawn gap-ratio magnitude is replaced by a direction-only prediction.
      The exact-rational requirement, the per-reading-cell hull emission and the exclusion-list-as-artifact
      rule come from the parent's own assumptions. Boilerplate identical across contracts by program rule
      comes from a fixed table. Budgets come from the parent's declared estimated_cost and its own
      statement that the whole computation is under one hour of single-core arithmetic.
  derivation_gaps:
    - >-
      THE PARAMETRIC TUPLE-SIEVE CURVE IS THE LOAD-BEARING UNREAD INPUT. The parent record's attempt to
      fetch the source body FAILED and local copies were absent from its worktree. Without it NULL-4a
      cannot run, and if fewer than four k values can be read NULL-4b cannot either, in which case
      |B minus A| is unreportable by the contract's own rule. Whether the source is reachable in the
      execution environment must be settled BEFORE approval.
    - >-
      The unread quantum memory exponent of one corpus-recorded sieve is the single largest gap in S. If it
      is at or below the anchor's, it dominates the anchor outright and every quantum number is recomputed.
      Its point is EXCLUDED until read, and the contract's quantum conclusions are conditional on that
      exclusion.
    - >-
      The classical 2-sieve's memory coordinate and the quantum anchor's memory coordinate are each carried
      as two named readings because the corpus and the recollection disagree. These are carried as reading
      cells rather than resolved, which is honest but means the contract may return UNDECIDED as its
      principal verdict; a coordinator should accept that possibility before approval.
    - >-
      The enumeration constant exists in this repository at two different values, and the sign of the
      classical 3-tuple point's off-hull distance is decided by which is adopted. Both must be carried as
      named values in the sensitivity region, not as an interval around one of them.
    - >-
      The declared conversion between classical bits, QCRAM bits and qubits is NOT supplied. The contract's
      default is to segregate the hulls, but whether the two 3-tuple points (one QRAM-model, one
      classical-plus-QCRAM) belong on the same axis is itself a Step-1 decision that must be declared
      before approval rather than made during the run.
    - >-
      NULL-2's sigma -- the noise magnitude standing for the exponents' own uncertainty -- is not derived.
      It must be declared before approval, since the false-positive interval that decides whether any
      non-convexity is reportable is a function of it.
