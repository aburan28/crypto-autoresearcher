experiment:
  id: EXP-QRUOV-0436d5
  hypothesis_id: H-QRUOV-e0fb7b
  derived_from_idea: IDEA-20260805-8d9ac0
  question_id: RQ-QRUOV-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    The ell-cancellation audit: exact-integer verification of two forced invariance identities across
    the QR-UOV descent, with a deliberately mismatched null baseline the instrument must flag, a
    matched plain-UOV positive control forced to ratio 1.000, and a seven-point ell sweep carrying
    three different pre-registered growth laws
  objective: >-
    The single uncertainty a run reduces is whether the matched extension-field-UOV baseline and
    QR-UOV share their attack exponents exactly, and whether any quantity fails to be invariant across
    the descent. A run establishes (i) the exponent invariance residual, forced to exactly 0 at every
    declared parameter set and across a 10^4-point random integer sweep; (ii) the ell-independence of
    the shape ratio, forced exactly; (iii) the intersection-applicability flag per declared set, where
    a single set with V < 2M FALSIFIES a relayed explanation and is the most informative available
    outcome; (iv) the haystack exponent ratio, forced to exactly ell, which is the one quantity that
    DOES vary across the descent; and (v) an exhaustive integer enumeration showing whether generic
    meet-in-the-middle over the reduced haystack ever beats the solver. The deliverable is the audited
    baseline table the goal declares as a prerequisite. NO ATTACK IS PROPOSED and no exponent is moved.
  what_this_is_not:
  - >-
    NOT an attack, a speedup, or a security claim about QR-UOV at any parameter set. The audit is
    forbidden from proposing an attack; it audits the MEASUREMENT that attacks are compared against.
  - >-
    NOT a closure of the lane. The MITM disposal closes GENERIC ENUMERATION ONLY, and structure-aware
    attacks over the extension are named as open rather than described as mined.
  - >-
    NOT a table of numbers filled from memory. Numeric columns are sourced with a locator or marked
    unavailable, and a symbolic-only deliverable is a legitimate and materially weaker outcome that
    must be labelled as such.
  - >-
    NOT applicable to the reducible-defining-polynomial case, which is a different object entirely.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: derivation
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - under the parameter semantics as READ (or, failing that,
      symbolically), the two invariance identities hold or fail exactly, the applicability flag takes
      a stated value per declared set, the haystack ratio takes a stated value, the cofactor takes
      stated values at both omega endpoints, and the MITM enumeration is exhaustive over the declared
      integer ranges. WHAT DOES NOT FOLLOW - no security claim about QR-UOV or about extension-field
      UOV; no statement that the lane is exhausted; no cost figure beyond what the recalled cost forms
      supply, and those are conditional on a reading that may fail; and specifically NOT that the
      reduced haystack is unspendable by any method, only by generic enumeration and MITM.
  inputs:
    procedure: >-
      STAGE 0 (reading, zero compute) - obtain the QR-UOV parameter table and the definitions of V, M,
      ell, n and m VERBATIM with a locator, in the declared source-preference order. If no
      specification can be obtained after that order is exhausted, RECORD THAT and proceed with a
      SYMBOLIC-ONLY table, marking every numeric column unavailable rather than inventing values.
      STAGE 1 (seconds, DECISIVE) - verify the two identities exactly, symbolically and over a 10^4
      random integer sweep; and independently re-derive the solver and intersection-attack cost
      statements from a primary source, RECORDING QUOTATIONS. A failure of either identity ENDS the
      audit. STAGE 2 (seconds) - compute the null object and the positive control FIRST and
      hash-commit them; then the full cost table at BOTH omega values, both haystack columns, and the
      MITM flag by exhaustive enumeration over the declared integer ranges. STAGE 3 (seconds) - the
      graded ell sweep, reporting three quantities against their three different pre-registered growth
      laws. STAGE 4 (zero compute) - write the Pareto comparison across time, memory and data/queries
      for every row, stating which rows are dominated by which, with a memory entry per row or an
      explicit UNKNOWN.
    instrument: >-
      Exact integer arithmetic in Python. No solver, no computer-algebra system, no floating point in
      any identity check. The random sweep uses a recorded seed. Network at Stage 0 and Stage 1 only,
      for source retrieval, with every fetch outcome including failures recorded. Recorded through
      harness/runner.py.
    parameters: >-
      Every declared QR-UOV parameter set, read or marked unavailable. A 10^4-point random sweep over
      integer triples (V, M, ell) with a recorded seed, for the identity check. Cofactor reported at
      omega = 2.37 AND omega = 3, always both. Graded ell sweep over {1, 2, 3, 4, 5, 6, 8} at fixed
      (V, M). Exhaustive MITM enumeration over 1 <= M <= 16 and 1 <= V <= 256.
  controls:
  - >-
    NULL OBJECT, MUST BE ABLE TO FAIL. A DELIBERATELY MISMATCHED baseline - UOV over the extension at
    (N, M) = (V + M, M ell) rather than (V + M, M), the wrong descent that confuses equation count
    with oil dimension. FORCED VALUE DERIVED BEFORE THE RUN: its exponent is ell (V + M - 2 M ell),
    NEGATIVE for ell at least 2 over a wide range, hence manifestly not a matched baseline. The
    comparison instrument MUST flag this arm as mismatched. If it does not - if the pipeline reports
    the mismatched baseline as comparable - the instrument cannot detect a wrong baseline and NO
    matched-baseline claim may be made from it.
  - >-
    POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR. Plain UOV at (q, n, m) with n = (V
    + M) ell and m = M ell, where the ell-cancellation MUST hold by construction because it is the
    SAME base-field system. The table must report exponent ratio exactly 1.000 against the QR-UOV row.
    If the instrument reports anything else, the arithmetic pipeline is broken and NO conclusion may
    be drawn from any other row.
  - >-
    GRADED CONTROL, FOUR OR MORE INTERIOR POINTS, MONOTONICITY REPORTED. Fix (V, M) and sweep ell over
    {1, 2, 3, 4, 5, 6, 8}. Report (a) the solver exponent, which must grow EXACTLY LINEARLY in ell with
    slope (V - M); (b) the haystack ratio, which must EQUAL ell; (c) the linear-algebra cofactor, which
    must grow as ell^{omega - log_2 3}. THREE QUANTITIES WITH THREE DIFFERENT PRE-REGISTERED GROWTH
    LAWS IN THE SAME PARAMETER is a much sharper test than any one of them - a bug that fakes one law
    will not fake all three.
  - >-
    ORDERING CONTROL. The null (mismatched-baseline) arm and the positive control are computed and
    hash-committed BEFORE any QR-UOV row is read.
  - >-
    ARCHIVE CHECK, zero compute. Record that no prior experiment, evidence, run or knowledge record
    exists in this area for these observables. The absence is recorded AS AN ABSENCE, not presented as
    a passed check.
  - >-
    OMEGA-ENDPOINT CONTROL. The cofactor is reported at BOTH omega = 2.37 and omega = 3, always, and
    neither is preferred. A cofactor claim that can be tuned by choosing omega is not a claim.
  - >-
    SOURCE-PROVENANCE GATE. Every numeric column is either QUOTED with a locator or marked
    UNAVAILABLE. A table read as rigour when it was filled from memory is the single most damaging
    outcome available here, and this gate is what prevents it.
  - >-
    EXHAUSTIVE-NOT-SAMPLED ENUMERATION. The MITM-versus-solver comparison is a complete integer
    enumeration over the declared ranges, so its verdict is exact rather than statistical.
  independent_variables:
  - 'presentation: base-field versus extension-field, across the descent'
  - 'ell, over the graded sweep {1, 2, 3, 4, 5, 6, 8} at fixed (V, M)'
  - 'omega, at 2.37 and 3'
  - 'object: QR-UOV row / matched plain-UOV positive control / deliberately mismatched null baseline'
  - '(M, V) over the exhaustive MITM enumeration range'
  metrics:
    primary:
    - >-
      exponent_invariance_residual - integer, (n - 2m) minus ell (V - M), evaluated exactly at every
      declared parameter set and at 10^4 randomly drawn triples. FORCED EXACTLY 0 at every point.
    - >-
      shape_ratio_ell_dependence - the partial derivative of n/m with respect to ell, evaluated
      symbolically. FORCED EXACTLY 0.
    - >-
      intersection_applicability_flag - boolean per declared parameter set, the truth value of V < 2M.
      Pre-registered FALSE everywhere; a single TRUE falsifies the relayed explanation as stated.
    - >-
      haystack_exponent_ratio - dimensionless, log_q of the base-field candidate count divided by
      log_q of the extension candidate count, per declared set. FORCED EXACTLY ell up to the
      Gaussian-binomial o(1).
    - >-
      mitm_beats_solver_flag - boolean per (M, V) over the exhaustive enumeration. Pre-registered
      FALSE for every M at least 2, TRUE only for M = 1 with V > 2.
    secondary:
    - >-
      linear_algebra_cofactor - dimensionless, ell^{omega - log_2 3}, reported at BOTH omega endpoints
      per declared set.
    - >-
      null_object_mismatch_flag - boolean, whether the instrument flagged the deliberately mismatched
      baseline as mismatched. FORCED TRUE.
    - >-
      positive_control_ratio - dimensionless, the exponent ratio between the matched plain-UOV row and
      the QR-UOV row. FORCED EXACTLY 1.000.
    - >-
      graded_sweep_growth_laws - the three measured growth laws over the ell sweep against their three
      pre-registered forms, with every consecutive difference reported.
    - >-
      source_provenance_per_column - QUOTED with locator, or UNAVAILABLE. No third value.
    - >-
      per-row memory entry and Pareto disposition across time, memory and data/queries, with an
      explicit UNKNOWN where the recalled cost statement carries no memory figure.
  heuristic_under_test: HEUR-QRUOV-BASE-2
  preregistered_prediction:
    quantity: >-
      The exponent invariance residual, the shape-ratio ell-dependence, the applicability flag per
      declared set, the haystack exponent ratio, and the exhaustive MITM verdict.
    formula: >-
      exponent_invariance_residual EXACTLY 0 at every declared set and at 10^4 random triples;
      shape_ratio_ell_dependence EXACTLY 0; intersection_applicability_flag FALSE at every declared set
      (V at least 2M); haystack_exponent_ratio EXACTLY ell, and at least 3 wherever ell is at least 3;
      mitm_beats_solver_flag FALSE for all M at least 2 and TRUE only for M = 1 with V > 2. Over the
      graded sweep, the solver exponent linear in ell with slope (V - M), the haystack ratio equal to
      ell, and the cofactor growing as ell^{omega - log_2 3}.
    source: >-
      Pre-registered in the parent proposal IDEA-20260805-8d9ac0, whose predictions block states each
      of these forced values including the clause that a single declared set with V < 2M is the most
      informative outcome available. Fixed before any reading and never tuned to data. The relayed
      explanation being tested is ABSTRACT-ONLY and is treated as a falsifiable target, not an
      authority.
  scale_relevance:
    tier: full_parameters
    justification: >-
      The identities are exact statements about integer parameters and hold at whatever parameter sets
      the specification declares, including deployed ones, with no extrapolation - which is why the
      audit is worth running at essentially zero compute. The MITM enumeration is EXHAUSTIVE over the
      declared integer ranges rather than sampled, so its verdict carries no sampling uncertainty
      either. What does NOT survive to any scale is the INTERPRETATION: the exponent columns rest on
      recalled cost forms that have not been read, and the entire audit is conditional on the defining
      polynomial being irreducible and on the parameter semantics being as assumed.
    correspondence: >-
      The descent between the base-field and extension-field presentations is a change of presentation
      of the SAME object, which is precisely why comparing shape-derived quantities across it is a
      valid audit and why any failure of invariance would localise a real difference.
  tail_checks:
  - >-
    Report every identity residual as an exact INTEGER over the whole random sweep, and report the
    sweep's seed and range, so a zero residual cannot be a sampling artifact of a narrow range.
  - >-
    Report the applicability flag for EVERY declared set individually. A single set with V < 2M is the
    finding and an aggregate would hide it.
  - >-
    Report the cofactor at BOTH omega endpoints in every row. A single-omega cofactor is tunable and
    is not a claim.
  - >-
    Report the haystack ratio as an exponent ratio only, never as an absolute count, since the
    Gaussian binomial is exact only up to a bounded factor which cancels in the ratio.
  - >-
    Report every consecutive difference in the ell sweep for all three quantities, so a law holding on
    average but breaking at one rung is visible.
  - >-
    Report the null and positive-control values FIRST in the deliverable, matching the order in which
    they were computed and committed.
  - >-
    Report a memory entry per row or an explicit UNKNOWN. A cost table with no memory column repeats a
    corpus-wide failure and is invalid under this contract.
  replication:
    seeds:
    - 20260825
    - 20260826
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.2
    maximum_memory_gb: 2
    maximum_runs: 6
  stopping_rules:
  - >-
    STOP if either identity fails at any parameter set or anywhere in the random sweep. The assumed
    parameter semantics are wrong, the audit is redirected, and that is the deliverable.
  - >-
    STOP if the positive control does not report exponent ratio exactly 1.000, or if the null object is
    not flagged as mismatched. The instrument is broken and nothing may be reported.
  - >-
    STOP the numeric table if the specification cannot be obtained after the declared source order is
    exhausted; deliver the SYMBOLIC-ONLY table with every numeric column marked unavailable, and label
    that outcome as materially weaker in the headline.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. A budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    A network failure, timeout, crash or dependency failure makes the run failed_infrastructure and is
    NEVER a mathematical result (AGENTS.md rule 3). Inability to fetch a parameter table yields a
    symbolic-only deliverable, not a negative finding.
  - >-
    A run that fills any numeric column from recalled parameters rather than from a quoted source or an
    UNAVAILABLE marker is completed_invalid (AGENTS.md rule 5).
  - >-
    A run in which any QR-UOV row was read before the null object and the positive control were
    hash-committed is completed_invalid. The ordering is the control.
  - >-
    A run reporting the cofactor at a single omega is invalid_measurement.
  - >-
    A run reporting a cost table with no memory column and no explicit UNKNOWN per row is
    invalid_measurement.
  - >-
    A run that presents the MITM disposal as closing the lane, rather than closing generic enumeration
    only, is completed_invalid - that is the premature-closure failure the inventor protocol treats as
    symmetric with overclaiming.
  - >-
    A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires a new
    contract.
  success_criterion: >-
    Stage 0 produces either the parameter table and definitions quoted with a locator, or a recorded
    statement of which sources were tried and what each returned; the null object is flagged as
    mismatched and the positive control reports exponent ratio exactly 1.000, both hash-committed
    before any QR-UOV row; the exponent invariance residual and the shape-ratio ell-dependence are
    exactly 0 at every declared set and across the 10^4-point sweep; the haystack exponent ratio is
    exactly ell; the graded ell sweep exhibits all three pre-registered growth laws with every
    consecutive difference reported; the MITM enumeration is exhaustive over the declared ranges; and
    the full cost table is emitted at both omega endpoints with a memory entry or explicit UNKNOWN per
    row and a Pareto disposition per row.
  falsification_criterion:
  - >-
    Either identity fails at any parameter set or anywhere in the random sweep. The assumed parameter
    semantics are wrong; the audit STOPS and is redirected. This is the cheapest possible failure and
    it is a complete deliverable.
  - >-
    Some declared QR-UOV parameter set has V < 2M. The relayed explanation for QR-UOV's survival is
    then WRONG AS STATED, the reason it survives is something else, and that becomes the new question.
    Pre-declared as the most informative outcome available in this record.
  - >-
    A primary source states a solver or intersection cost incompatible with the recalled form. The
    recalled form is withdrawn and every derived column recomputed; the record is superseded, never
    edited. The identities survive and only the interpretation changes.
  - >-
    The positive control does not report exponent ratio exactly 1.000. The arithmetic pipeline is
    broken; NOTHING may be reported.
  - >-
    The null object is NOT flagged as mismatched. The instrument cannot detect a wrong baseline, so no
    matched-baseline claim may be made from it.
  - >-
    The haystack ratio is not ell. Either the Gaussian-binomial estimate or the module count is wrong
    and the second half of the record is void.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
  - the QR-UOV parameter table and the definitions of V, M, ell, n and m quoted with a locator, or a recorded statement of which sources were tried and what each returned
  - raw-result.json carrying the exact integer residual of both identities at every parameter set and over the full random sweep, with the sweep's seed and range
  - verbatim quotations, with locators, of the solver and intersection cost statements, or a recorded failure to obtain them
  - the null-object and positive-control values, hash-committed before any QR-UOV row and reported first
  - the full cost table with every column at omega = 2.37 AND omega = 3
  - the V < 2M flag per declared parameter set, individually
  - the exhaustive MITM-versus-solver enumeration over the declared integer ranges
  - a Pareto disposition per row across time, memory and data/queries, with a memory entry or explicit UNKNOWN
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval and the user's authorization are required before execution. This contract is
    review_required and is NOT approved; approved_by is null and execution_authorized is false
    (AGENTS.md rule 1).
  - >-
    The proof_search_map on H-QRUOV-e0fb7b must be audited before implementation, per KN-TECH-080 and
    the Coordinator's proof-oriented dispatch gate.
  - >-
    Stage 0's source-preference order must be fixed in writing before approval, and the
    source-provenance gate enforced in the task card. A table that reads as rigour and was filled from
    memory is the single most damaging outcome available here.
  - >-
    The task card must state that the MITM disposal closes GENERIC ENUMERATION ONLY. Presenting it as
    a lane closure is a contract violation, and the Coordinator's closure gate would in any case
    require a measured obstruction with error bars over the scope claimed.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260805-8d9ac0
    authored_at: '2026-08-25'
    note: >-
      The five forced values, the mismatched-baseline null, the matched plain-UOV positive control, the
      seven-point graded ell sweep with its three distinct growth laws, the ordering control and the
      archive check are taken from the parent proposal's predictions and minimal_test.controls blocks.
      The source-provenance gate, the omega-endpoint control and the per-row memory requirement are
      Coordinator additions required by AGENTS.md rules 4 and 5 and by the parent's own confounders
      block, which names omega shopping and 'a table reads as rigour' as the live risks. Boilerplate
      identical across contracts by program rule comes from the fixed table. Every parameter figure the
      parent recalled is treated here as a reading task, never as an input.
  derivation_gaps:
  - >-
    The QR-UOV parameter semantics are RECALLED and UNVERIFIED. Almost every risk in this contract is
    that risk. Stage 0 exists for it and Stage 1's identity check detects it, but if Stage 0 fails the
    deliverable is symbolic-only and materially weaker, and which deliverable was produced must appear
    in the headline.
  - >-
    Both recalled cost statements - the solver cost form and the intersection applicability threshold -
    are load-bearing for the exponent and applicability COLUMNS but not for the identities. If no
    primary source can be obtained, those columns are conditional and must be labelled so rather than
    reported flat.
  - >-
    The declared MITM enumeration ranges (M up to 16, V up to 256) are the parent's and are not derived
    from any parameter set. If a declared set falls outside them the enumeration is incomplete for that
    set and must be extended, not extrapolated.
  - >-
    The audit is entirely conditional on the defining polynomial being irreducible. The reducible case
    is a different object and belongs to a separate contract; nothing here transfers to it.
  - >-
    The haystack observation identifies unspent structure and the MITM disposal closes only generic
    enumeration. What remains open - a MinRank or intersection variant formulated over the extension,
    where the variable count drops by a factor ell before the modelling degree is chosen - is named as
    forward guidance and is NOT costed here.
