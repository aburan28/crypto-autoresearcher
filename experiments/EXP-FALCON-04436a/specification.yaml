experiment:
  id: EXP-FALCON-04436a
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-63811b; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-63811b
  question_id: RQ-FNDSA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Level-resolved accumulated rounding error in a tree-structured sampler, fitting its growth
    exponent in tree depth and reporting the ratio between an interval-arithmetic certificate and
    the realized error on the same runs.
  objective: 'The uncertainty a run reduces is how loose a composed worst-case precision budget is
    relative to what a tree-structured sampler actually accumulates. In parts: (i) whether level-resolved
    instrumentation, running p-bit and exact rational arithmetic in lockstep, reads identically zero
    accumulated error in the exact-arithmetic null at every level and every replay, which is the precondition
    for any signal reading; (ii) whether the growth exponent of accumulated error standard deviation
    in tree depth separates between a biased-rounding arm forced toward 1.0 and a stochastic-rounding
    arm forced toward 0.5, and what the round-to-nearest-even signal arm returns between them; (iii)
    what the ratio of the interval-arithmetic certificate to the realized standard deviation is at
    each level, culminating at the deepest tested level, together with the fraction of replays where
    the realized error escaped the certificate, which must be zero. A run does not reduce uncertainty
    about deployed parameters, about output divergence, about any released implementation, or about
    security, and no stage computes such a quantity.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: for the designated intermediate quantity,
      the toy and synthetic bases built in this run, tree depths from 3 to 11, and mantissa widths
      in the tested grid, the accumulated error standard deviation takes the reported per-level values,
      its growth exponent takes the reported value with the reported interval, and the certificate-to-realized
      ratio takes the reported values. WHAT DOES NOT FOLLOW: nothing about output distribution divergence,
      because the sensitivity of the output law to this intermediate quantity is not measured here;
      nothing about FN-DSA parameter sets or any released implementation; nothing about whether any
      published or in-corpus certificate is incorrect, since looseness is not error; and nothing about
      security. A looseness ratio is a statement about two numbers computed in this run and about
      nothing else.'
  inputs:
    procedure: 'STAGE 0, cost under one hour: freeze the designated intermediate quantity, the second
      robustness quantity, the depth and precision grids, the rounding rules and the certificate definition.
      STAGE 1, cost about three days: instrument the toy sampler to run p-bit, exact rational and
      interval arithmetic in lockstep with per-level readout, and rewrite the end-to-end certificate
      as a level-resolved one. STAGE 2, cost minutes: run the exact-arithmetic null and the root-level
      control; HALT IF EITHER IS NONZERO. STAGE 3, cost about an hour: run the biased-rounding and
      stochastic-rounding bracketing arms at L = 11 on synthetic bases, 10^4 replays each, and fit
      beta; HALT IF THEY DO NOT SEPARATE BY 0.3. STAGE 4, cost about a day: run the signal arm across
      depths 3, 4, 5, 6, 7 on toy bases and 8 through 11 on synthetic bases, at mantissa widths 16,
      24 and 32, ten bases per cell, 10^4 replays per cell. STAGE 5, cost about two hours: compute
      the level-resolved certificate on the same runs and form the looseness ratio, checking containment
      on every replay. STAGE 6, cost under an hour: fit exponents, report ratios, lag-one increment
      correlations and all intervals.'
    instrument: 'Pure Python 3 running three arithmetics in lockstep: the shared p-bit mantissa emulator
      over Python integers, fractions.Fraction for the exact shadow, and a small affine-interval class
      implemented in-run for the certificate. numpy only for the log-log fits and the correlation
      estimates. Run manifests through harness/runner.py so seeds and the inference block are recorded.
      No Sage, no external computer algebra, no network.'
    parameters: Tree depths L in {3, 4, 5, 6, 7} from toy bases at dimensions 4 through 64, and L
      in {8, 9, 10, 11} from synthetic bases at dimensions 128 through 1024 that are explicitly not
      claimed to resemble keys. Mantissa widths p in {16, 24, 32}. Replays per cell 10^4. Ten independently
      generated bases per cell. Signal cells 9 depths x 3 precisions x 10 bases = 270. Bracketing
      arms 2 x 10^4 replays at L = 11. Exact-arithmetic null 10^3 replays at each depth, reduced because
      rational arithmetic is expensive. Second designated quantity run at a single cell, L = 11 and
      p = 24, as a robustness check.
  controls:
  - 'Exact-arithmetic null: identical instrumentation over exact rational arithmetic, accumulated
    error must be identically zero at every level and every replay.'
  - 'Root-level control: accumulated error at level zero must be exactly zero before any rounding
    occurs.'
  - Biased-rounding bracketing arm, round toward zero, must give beta near 1.0.
  - Stochastic-rounding bracketing arm, unbiased randomized rounding, must give beta near 0.5, with
    its per-increment mean verified consistent with zero.
  - 'Certificate-validity control: on every replay, verify the realized accumulated error lies inside
    the interval certificate at every level; a single violation invalidates the certificate implementation,
    not the measurement.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null arm runs the identical level-resolved instrumentation on a
    recursion executed entirely in exact rational arithmetic, where the accumulated relative error
    must be identically zero at every level over every replay. Any nonzero reading proves the instrumentation,
    not the arithmetic, is generating error. A second null runs the p-bit arm and compares its level-zero
    reading against zero, since no rounding has yet occurred at the root. The two bracketing positive
    controls are the biased-rounding arm, which must give beta near 1.0, and the stochastic-rounding
    arm, which must give beta near 0.5; without both separating, an intermediate measured beta is
    uninterpretable.'
  independent_variables:
  - tree depth level index l
  - mantissa width p
  - rounding rule, round-to-nearest-even versus toward-zero versus stochastic
  - basis index
  metrics:
    primary:
    - standard deviation of accumulated relative error per level with confidence interval
    - fitted growth exponent beta in depth per arm
    - certificate-to-realized ratio per level
    - fraction of replays with realized error outside the certificate
    secondary:
    - lag-one correlation of per-level increments
    - per-increment mean in the stochastic-rounding arm
    - maximum rational denominator bit-length in the exact shadow
    - wall-clock per replay per arithmetic
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The growth exponent beta of the standard deviation of accumulated relative error as
      a function of recursion depth, and the certificate-to-realized looseness ratio at the deepest
      tested level.
    formula: s(l) = A * l^beta, where s(l) is the standard deviation across replays of the accumulated
      relative error of the designated quantity after l levels. beta = 0.5 is forced in the stochastic-rounding
      arm by independent zero-mean increments and beta = 1.0 is forced in the toward-zero arm by systematically
      signed increments. The looseness ratio is defined as the interval certificate's half-width at
      level l divided by s(l), computed on the same replays.
    source: Pre-registered in the parent proposal IDEA-20260816-63811b before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Toy bases give depths 3 to 7 at dimensions 4 to 64; synthetic bases give depths
      8 to 11 at dimensions 128 to 1024, and those synthetic bases are constructed for depth alone
      and are NOT claimed to resemble FN-DSA keys, to have a realistic Gram-Schmidt profile, or to
      say anything about deployed parameters. TRANSFER ASSUMPTION, STATED: none to deployed parameters.
      The synthetic arm buys depth, which is the variable the exponent needs, and buys nothing else;
      any reading from it is a statement about a recursion of that depth and not about a lattice of
      that dimension.'
    correspondence: null
  tail_checks:
  - Verify certificate containment on every single replay, not on average, and report the count of
    violations which must be zero.
  - Report the per-level distribution's kurtosis and flag levels where the accumulated error is dominated
    by rare large events rather than by typical ones.
  - Refit beta excluding the shallowest and the deepest level separately and report both, since an
    exponent driven by one endpoint is not an exponent.
  - Report the second designated quantity's beta at the single robustness cell alongside the primary,
    and flag disagreement beyond 0.2.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt and report instrument failure if the exact-arithmetic null is nonzero at any level.
  - Halt at STAGE 3 and report instrument failure if the bracketing arms separate by less than 0.3
    in beta.
  - Halt the exact shadow at any cell where the rational denominator bit-length exceeds 10^6 and report
    the achieved depth limit rather than approximating the shadow.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The exact null reads identically zero, certificate containment holds on every
    replay, the two bracketing arms separate by at least 0.3 in fitted beta, and the signal arm's
    beta and the looseness ratio are each estimated with confidence half-widths below 0.2 and 25 percent
    respectively.
  falsification_criterion:
  - Nonzero exact-arithmetic null at any level.
  - Any certificate containment violation.
  - Bracketing arms separating by less than 0.3 in beta.
  - Signal-arm beta outside the interval 0.4 to 1.1.
  - Systematic curvature in the log-log residuals, meaning no single exponent describes the depth
    range.
  - Looseness ratio below 2.0 at L = 11 while beta is near 0.5, which is internally inconsistent.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-63811b
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The designated intermediate quantity is not named; the entire measurement is about it and the
    choice must be made and justified before freezing.
  - The level-resolved form of the interval certificate is a rewrite of an end-to-end construction
    and its correctness obligations are not stated here.
  - The synthetic deep-basis construction is described only as not-a-key; a Coordinator must decide
    what it must satisfy for the depth reading to be meaningful.
  - The relation between accumulated intermediate error and output distributional divergence is left
    entirely open, so the deliverable does not yet connect to the goal's stated target quantity.
