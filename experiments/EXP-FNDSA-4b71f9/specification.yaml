experiment:
  id: EXP-FNDSA-4b71f9
  hypothesis_id: H-FNDSA-c9cb32
  derived_from_idea: IDEA-20260801-010
  question_id: RQ-FNDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Bucket-conditioned goodness-of-fit probe of the FN-DSA Gaussian sampler against the ideal
    discrete Gaussian, with an exact-reference positive control, a five-rung perturbation ladder
    that measures the test's power curve, and a reported minimum detectable deviation
  objective: >-
    The one uncertainty a run reduces is whether the distributional-exactness assumption carrying
    FN-DSA's security argument survives a direct statistical test at a stated resolution, in a
    channel that has nothing to do with timing. A run establishes (i) whether the test is calibrated,
    by requiring the independently written exact reference sampler NOT to be rejected; (ii) whether
    the test has power, by requiring a deliberately perturbed sampler to be rejected and by measuring
    the full power curve over a five-rung perturbation ladder rather than asserting power at one
    point; (iii) the goodness-of-fit verdict on the real sampler, conditioned on call-parameter
    buckets so that the comparison target is a single ideal distribution rather than a mixture; and
    (iv) the minimum detectable deviation at the achieved sample size, which is the deliverable when
    the verdict is a non-rejection.
    No attack, break, key recovery or exploitability claim is made here or would follow from a run.
    Timing, power and electromagnetic channels are out of scope entirely. No statement is made about
    what the published literature contains.
  what_this_is_not:
    - >-
      Not an attack, a key recovery, a forgery, or a cryptanalytic result of any kind. It is a
      distributional measurement contract.
    - >-
      Not a timing or side-channel experiment. Nothing here observes execution time, power or
      emissions, and no statement about those channels follows in either direction.
    - >-
      Not a proof of sampler exactness. A non-rejection bounds the deviation at the achieved
      resolution and asserts nothing below it.
    - >-
      Not an exploitability claim. If a defect is found, whether it yields any attack is a separate
      question with its own contract.
    - >-
      Not a status change to any hypothesis, evidence record, decision or goal record, and not a
      promotion of any knowledge entry.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
      has been executed under this contract.
  claim_ceiling:
    tier: standardized_parameter_set_bounded_resolution
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - for the sampler implementation whose outputs were collected, at the
      filed specification's parameters and within the call-parameter buckets actually sampled, the
      goodness-of-fit test at the achieved sample size did or did not reject, with a measured minimum
      detectable deviation and a measured power curve. WHAT DOES NOT FOLLOW - no proof of exactness;
      no statement about deviations below the minimum detectable deviation; no statement about
      buckets not sampled; no exploitability claim in either direction; no statement about timing; and
      specifically NOT a transfer of the verdict to any other FN-DSA implementation, since the object
      tested is one implementation's output law.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, HARD GATE): fetch and file the FN-DSA specification from primary text
      under a run record. From the filed text, extract the sampler's call-parameter space, its
      support and any mandated truncation, and construct the ideal discrete Gaussian pmf for each
      bucket. Freeze the bucket definition, the binning rule, the test statistics, the rejection
      threshold, the perturbation ladder and the multiple-comparison correction, and hash them. None
      of these is revised after any p-value is seen.
      STAGE 1 (minutes, HARD GATE): compute each bucket's ideal pmf at two arithmetic precisions and
      require agreement to better than the test's resolution. An ideal that is not computed accurately
      enough to be compared against cannot be compared against.
      STAGE 2 (minutes to an hour, HARD GATE - POSITIVE CONTROL): run the whole pipeline on an
      independently written EXACT discrete Gaussian sampler, at the same bucket structure and the
      same sample size. Required outcome - no rejection. A rejection here means the binning,
      truncation, conditioning or ideal pmf is wrong; nothing downstream is admissible.
      STAGE 3 (an hour, HARD GATE - NEGATIVE CONTROL AND POWER CURVE): run the pipeline on a
      deliberately perturbed sampler at each of five declared perturbation sizes spanning at least
      two orders of magnitude. Record the rejection outcome and the p-value at each rung. Required -
      rejection at the largest rungs, non-rejection at the smallest, and a MONOTONE power curve in
      between. The smallest rung at which rejection occurs defines the minimum detectable deviation
      empirically, alongside its analytic estimate.
      STAGE 4 (an hour): the real sampler. Collect at least 10^6 conditioned samples per bucket from
      fresh seeds, compute the frozen statistics per bucket, and report the p-value per bucket with
      the frozen multiple-comparison correction applied across buckets. Report the pooled-across-
      buckets statistic separately and label it as the mixture comparison, which is NOT the test.
      STAGE 5 (minutes): independence diagnostics - autocorrelation of the output sequence at the
      declared lags, and the seed-interleaving comparison of within-seed against across-seed
      statistics. A failure here means no verdict is reportable.
      STAGE 6 (zero compute): report the three control outcomes, the per-bucket verdicts, the power
      curve, the minimum detectable deviation, and an explicit refusal statement for any deviation
      size below it.
    instrument: >-
      Python with numpy for the counting and arbitrary-precision arithmetic for the ideal pmf. The
      FN-DSA sampler under test is exercised through a seeded, non-timing observation hook that
      records outputs and their call parameters; it is not reimplemented here. The exact reference
      sampler and the perturbed sampler are written from their definitions in this contract's own
      module, by a dispatch separate from the one that writes the test statistics. Recorded through
      the program's run wrapper with a manifest.
    parameters: >-
      Bucket structure frozen in Stage 0 from the filed call-parameter space, with a declared minimum
      of 10^6 conditioned samples per bucket; binning of the support declared in Stage 0 with a
      minimum expected count per bin of 10 under the ideal, bins below that merged by a frozen rule;
      test statistics chi-square on the binned support and a discrete-adapted one-sample
      distribution-distance statistic, both declared in Stage 0; rejection threshold p below 1e-3 as
      pre-registered by the parent proposal; perturbation ladder of five sizes spanning at least two
      orders of magnitude, centred on the deviation the parent proposal names; declared
      autocorrelation lags and band; multiple-comparison correction across buckets frozen in Stage 0.
  controls:
    - >-
      POSITIVE CONTROL, blocking - an independently written EXACT discrete Gaussian sampler run
      through the identical pipeline at the identical bucket structure and sample size. It must NOT
      be rejected. This is the control that catches a wrong binning, a wrong truncation convention, a
      wrong conditioning, or a wrong ideal pmf, each of which would otherwise present as a
      distributional defect in the real sampler.
    - >-
      NEGATIVE CONTROL AND POWER CURVE, blocking - a deliberately perturbed sampler at five
      perturbation sizes. It must be rejected at the large rungs, and the power curve must be MONOTONE
      in perturbation size. A single perturbation point would establish that the test can reject
      something; the ladder establishes what it can reject, which is what the minimum detectable
      deviation means.
    - >-
      MIXTURE CONTROL - the same statistics computed on outputs POOLED across call-parameter buckets,
      reported alongside the conditioned result and labelled as not the test. Its purpose is to expose
      the specific false positive this design exists to exclude, namely a mixture being compared
      against one of its components.
    - >-
      IDEAL-PRECISION CONTROL, blocking - the ideal pmf recomputed at two arithmetic precisions, with
      agreement required to better than the test's resolution.
    - >-
      INDEPENDENCE DIAGNOSTICS, blocking - autocorrelation at declared lags within a pre-declared
      band, and no significant difference between within-seed and across-seed statistics. These test
      HEUR-FNDSA-GOF-1, which every p-value in this contract depends on.
    - >-
      FROZEN ANALYSIS PLAN - bucket definition, binning rule, statistics, threshold, ladder and
      multiple-comparison correction are hashed in Stage 0. A binning chosen after seeing a histogram
      is a fitted result, not a test.
  independent_variables:
    - 'sampler under test: real / exact reference / perturbed at each of five sizes'
    - call-parameter bucket
    - perturbation size on the negative-control ladder
    - 'conditioning: per-bucket (the test) versus pooled across buckets (the mixture control)'
  metrics:
    primary:
      - name: gof_p_value_real
        units: dimensionless probability in the closed interval 0 to 1, one per bucket
        computed: >-
          For each bucket, the p-value of each frozen statistic computed from the binned counts
          against the bucket's ideal pmf, with the frozen multiple-comparison correction applied
          across buckets. Reported per bucket and per statistic; never pooled into one number.
      - name: minimum_detectable_deviation
        units: >-
          total variation distance between the perturbed and ideal laws, dimensionless, in the closed
          interval 0 to 1
        computed: >-
          Two values reported side by side - the EMPIRICAL value, the smallest ladder rung at which
          the negative control is rejected at the declared threshold; and the ANALYTIC value derived
          from the sample size, bin count and threshold before the run. The empirical value is the
          headline; a large gap between the two is itself reported.
      - name: positive_control_outcome
        units: 'categorical: not_rejected / rejected, with its p-value'
        computed: >-
          The exact reference sampler's verdict through the identical pipeline. Required value is
          not_rejected.
      - name: power_curve
        units: rejection outcome and p-value at each of five perturbation sizes
        computed: >-
          The negative control's verdict at each ladder rung, with a monotonicity flag computed as
          whether the p-values are non-increasing in perturbation size.
    secondary:
      - name: autocorrelation_at_declared_lags
        units: dimensionless correlation coefficient per lag
        computed: Sample autocorrelation of the output sequence at each declared lag, against the pre-declared band.
      - name: seed_interleaving_statistic
        units: dimensionless, plus its p-value
        computed: >-
          The frozen statistic computed within each seed's stream versus computed across seeds, with
          the difference tested at the declared threshold.
      - name: mixture_control_p_value
        units: dimensionless probability in the closed interval 0 to 1
        computed: >-
          The same statistics on outputs pooled across buckets. Reported and explicitly labelled as
          not the test.
      - name: per_bin_residuals
        units: standardized residual per bin per bucket
        computed: >-
          Observed minus expected count divided by the square root of the expected count, per bin,
          reported in full so a rejection can be localised rather than only announced.
      - name: samples_per_bucket
        units: exact integer count
        computed: Number of conditioned samples actually collected per bucket, reported alongside the declared minimum.
      - name: merged_bin_count
        units: exact integer
        computed: Number of bins merged by the frozen low-expected-count rule, per bucket.
  heuristic_under_test:
    id: HEUR-FNDSA-GOF-1
    formal_statement: >-
      Conditioned on its call parameters, the sampler's outputs across fresh seeds are independent
      draws from a single fixed distribution on its support. Formally - for a fixed call parameter
      bucket b, the observed values X_1, .., X_n in bucket b are i.i.d. with a common law mu_b
      independent of the index and of the seed stream position.
    rigorous_side: >-
      None. This is the standard i.i.d. assumption underlying every goodness-of-fit statistic and is
      not proved. What is available is the diagnostic pair in Stage 5.
    validation_route: >-
      Autocorrelation at declared lags within a pre-declared band, and no significant within-seed
      versus across-seed difference. A failure of either means no p-value in this contract is
      calibrated and no verdict is reportable.
  preregistered_prediction:
    quantity: >-
      The triple (positive_control_outcome, power_curve, gof_p_value_real), together with
      minimum_detectable_deviation.
    formula: >-
      positive_control_outcome = not_rejected. power_curve rejects at the largest ladder rungs, does
      not reject at the smallest, and is monotone in perturbation size. gof_p_value_real is DECLARED
      OPEN in both directions - the parent proposal pre-registers that a p-value below 1e-3 with
      power at least 0.95 against a deviation of one standard-deviation scale constitutes a rejection
      signal, and it pre-registers BOTH a rejection and a non-rejection as reportable outcomes with
      different meanings. minimum_detectable_deviation is reported as a number in every case and is
      the deliverable when the verdict is a non-rejection. Under the null that the sampler is exact,
      gof_p_value_real is uniform on the unit interval across buckets, and that uniformity is itself
      checked and reported.
    source: >-
      Pre-registered in the parent proposal IDEA-20260801-010 (predictions and falsification_conditions
      blocks) before any run under this contract exists. The threshold p below 1e-3 and the power
      target 0.95 are the proposal's own values; the five-rung ladder, the bucket conditioning and the
      uniformity-of-p-values check are added by this contract and are frozen here before any run.
  scale_relevance:
    tier: standardized_parameter_set
    justification: >-
      The sampler is exercised at the filed specification's own parameters, not at a reduced scale,
      because the object under test is the output law of the real routine and a reduced-parameter
      sampler would be a different distribution. There is therefore no scale transfer assumption for
      the verdict. The binding limit is RESOLUTION, not scale - the sample size sets the smallest
      deviation the test can see, and that limit is reported as the minimum detectable deviation
      rather than absorbed into a conclusion.
    correspondence: >-
      Exact for the sampler under test; the exact reference and perturbed samplers are synthetic
      objects constructed at the same parameters so that the three arms are comparable.
  sample_size_justification: >-
    The sample size is derived from the smallest predicted probability the test must resolve rather
    than chosen for convenience. Let q_min be the smallest ideal bin probability retained after the
    frozen merging rule. The design requires the expected count in that bin to be at least a declared
    multiple M of 1, so the per-bucket sample size N satisfies N greater than or equal to M divided
    by q_min, with M frozen in Stage 0 and stated in the report. The declared floor of 10^6
    conditioned samples per bucket is the parent proposal's value and is a floor, not the derivation -
    where M divided by q_min exceeds it, the larger value binds, and where the resulting N exceeds
    the budget, the run reports the shortfall and the bins that could not be resolved rather than
    reporting a verdict over them.
  tail_checks:
    - >-
      Report the observed and expected counts in the extreme support bins explicitly, including any
      bin where the observed count is zero, with the expected count and the sample size. A zero count
      is reported as an upper bound with its sample size, never as a measured probability.
    - >-
      Report the largest standardized residual over all bins and buckets, and the bin it occurred in,
      since a rejection driven by one tail bin means something different from a rejection driven by
      the bulk.
    - >-
      Check the uniformity of the per-bucket p-values across buckets under the null, since a set of
      p-values that is not uniform when it should be indicates a systematic pipeline defect that no
      single bucket's verdict would show.
    - >-
      Report the exact count of merged bins per bucket, since aggressive merging raises p-values and
      would silently manufacture a non-rejection.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
    note: >-
      Each seed drives an independent collection of the full per-bucket sample. The three verdicts
      must agree; a verdict that flips across seeds at the declared threshold is reported as
      unstable and no directional statement is made.
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 4.0
    maximum_memory_gb: 8
    maximum_runs: 30
  stopping_rules:
    - Halt if the specification cannot be fetched and filed in Stage 0; the ideal distribution is not built from recall.
    - Halt if the ideal pmf disagrees between the two precisions at a level comparable to the test's resolution.
    - Halt if the positive control is rejected; report its p-value and the suspected binning or conditioning defect, and nothing else.
    - >-
      Halt before Stage 4 if the negative-control power curve is non-monotone or fails to reject at
      the largest rung; the test has no readable power and no verdict on the real sampler is
      admissible.
    - >-
      Stop at the frozen analysis plan. Bucket definition, binning, statistics, threshold, ladder and
      correction are fixed in Stage 0 and are never revised after a p-value is seen.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop,
      never a negative result (AGENTS.md rule 5).
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
      and is NEVER negative mathematical evidence (AGENTS.md rule 5).
    - >-
      A run whose positive or negative control arm was not executed in the SAME invocation as the
      real-sampler arm is invalid_measurement - the calibration the contract exists to establish was
      not established on the same pipeline.
    - >-
      A run in which any element of the frozen analysis plan was changed after a p-value was observed
      is invalid_measurement and requires a versioned protocol_amendment plus a fresh run; already
      executed runs are never silently re-scored.
    - >-
      A run whose independence diagnostics failed but which nevertheless reports a verdict is
      returned to the Executor as incomplete.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT experiment and requires a new
      contract; it is never a repair of this one.
  success_criterion: >-
    The run is successful when ALL of the following hold and are read off the predefined metrics:
    (1) the ideal-precision control agrees between the two precisions; (2) positive_control_outcome
    is not_rejected; (3) the power_curve rejects at the largest ladder rung, does not reject at the
    smallest, and its monotonicity flag is true; (4) the independence diagnostics fall inside their
    pre-declared bands; (5) samples_per_bucket meets the derived sample size, or the shortfall and
    the unresolvable bins are reported instead of a verdict over them; and (6) gof_p_value_real is
    reported per bucket with per_bin_residuals, alongside minimum_detectable_deviation and the
    mixture control.
    Note that (6) is satisfied in EITHER direction. Whether the real sampler is rejected is the
    finding, not a success condition, and the contract is designed so that a non-rejection is a
    number (the minimum detectable deviation) rather than a shrug.
  falsification_criterion:
    - >-
      The exact reference sampler is REJECTED - the test is mis-calibrated (binning, truncation,
      conditioning or ideal pmf), no verdict on the real sampler is admissible, and the run is
      INVALID rather than negative.
    - >-
      The perturbed sampler is NOT rejected at the largest ladder rung - the instrument has no power,
      every non-rejection it produced is void, and the run set is INVALID rather than reassuring.
    - >-
      The power curve is non-monotone in perturbation size - the statistic cannot be read
      directionally and no minimum detectable deviation may be reported.
    - >-
      The independence diagnostics fail - HEUR-FNDSA-GOF-1 is violated, the p-values are not
      calibrated, and no verdict is reportable until the sampling protocol changes.
    - >-
      The real sampler is REJECTED per bucket with a large standardized residual - the
      distributional-exactness assumption is violated at a size at least the minimum detectable
      deviation, the distributional surface is open, and the location of the defect is the
      deliverable. This is a negative for the assumption and is reported plainly, with no
      exploitability claim attached.
    - >-
      The real sampler is rejected ONLY in the pooled mixture control and in no bucket - the apparent
      defect is the mixture artifact and the pooled reading must be withdrawn.
  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved inference block and environment
    - the Stage 0 fetch receipt for the specification, with URL, HTTP status, byte count and sha256
    - the frozen analysis plan (buckets, binning, statistics, threshold, ladder, correction) with its hash, written before any collection
    - raw-result.json carrying per-bucket per-bin observed counts for every arm, not summaries
    - the positive-control and negative-control arms' measurements in the same file as the real-sampler arm
    - the ideal pmf at both precisions, with the agreement check
    - the power curve at all five rungs with p-values and the monotonicity flag
    - the independence diagnostics output
    - the derived sample size with q_min and the multiple M, and the achieved samples per bucket
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Approval is required before execution and is the USER's gate, because it authorizes execution
      and spends compute. This contract is review_required and NOT approved; approved_by is null and
      execution_authorized is false.
    - >-
      The frozen analysis plan must be reviewed by the Coordinator before Stage 4. Choosing a binning
      or a bucket definition after seeing a histogram is the single most likely way this contract
      would silently become a claim.
    - >-
      The exact reference sampler must be written by a dispatch separate from the one that writes the
      test statistics, or the positive control tests the statistics against themselves.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260801-010
    authored_at: '2026-08-25'
    note: >-
      Objective, statistics, controls and the rejection threshold are transcribed from the parent
      proposal's claim, predictions, minimal_test and controls blocks, and HEUR-FNDSA-GOF-1 is the
      proposal's heuristic_assumptions entry restated formally with its quantifiers. The
      bucket conditioning, the five-rung power ladder, the mixture control, the ideal-precision
      control, the uniformity-of-p-values check and the sample-size derivation from q_min are added
      here, because the proposal's design as written could have returned a confident non-rejection
      from a mixture comparison or from an under-powered test. Budgets come from the parent's
      declared estimated_cost (implementation medium, compute low) through the program's cost table.
  derivation_gaps:
    - >-
      The call-parameter bucket structure is NOT fixed in this contract and cannot be until the
      specification is filed in Stage 0. It is the single most load-bearing design choice here,
      because the ideal distribution is only well defined within a bucket, and the Coordinator must
      review it before Stage 4.
    - >-
      A Kolmogorov-Smirnov statistic as named by the parent proposal is defined for continuous
      distributions and is CONSERVATIVE on a lattice-valued sample, which would depress power. The
      exact discrete-adapted variant must be declared in Stage 0; carrying the continuous form
      unmodified would make the negative control harder to reject and the real sampler easier to
      clear.
    - >-
      The perturbation ladder's five sizes are specified as spanning two orders of magnitude around
      the parent proposal's named deviation, but the exact rung values and the perturbation's SHAPE
      (a shift, a width change, or a tail deformation) are not fixed here. Different shapes have
      different detectabilities, so the shape must be declared and ideally more than one shape run.
    - >-
      The multiple-comparison correction across buckets is named but not chosen. The choice affects
      the verdict directly and must be frozen in Stage 0 rather than selected afterwards.
    - >-
      Whether the observation hook that records seeded outputs perturbs the sampler's own randomness
      consumption is not established here. If it does, the observed law is not the deployed law, and
      that must be checked before Stage 4 rather than discovered afterwards.
