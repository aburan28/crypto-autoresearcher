# =============================================================================
# EXP-BINSTD-684a71 -- VERSION 1 (APPROVED by DEC-20261002-eaddc1) frozen
# contract for H-BINSTD-1447cf: HOLD-X10 instance-dependence lemma +
# known-log pool zero-sum census (Stages 0-4).
#
# Source: IDEA-20260926-beb5b6 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Consolidates IDEA-20260926-178821 and IDEA-20260926-b48c9d as class
# members (cited, not redesigned).
#
# ZERO RUNS in this design packet. Stages 0-4 authorized for executor
# TASK-20261002-ea5389. No AUXIN. Amazon Bedrock prohibited. NO break.
# NO attack. NO exponent. TW-03 / TW-10 carried into review, not closed here.
# =============================================================================
experiment:
  id: EXP-BINSTD-684a71
  hypothesis_id: H-BINSTD-1447cf
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260926-beb5b6
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    HOLD-X10: Stage-0 instance-dependence / zero-sum arithmetic freeze plus
    Stages 1-4 four-arm (Koblitz walk, ordinary walk, relabelled Z/(4l),
    random known-log) zero-sum census and 4-SUM-vs-rho operation counts at
    n=19
  status: approved
  approved_by: DEC-20261002-eaddc1
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-eaddc1
    composing_decision: DEC-20261002-eaddc1
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-4 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2, 3, 4]
    scientific_execution_authorized_note: >-
      Stage 0 freezes the lemma, relabelings, B=2^33 arithmetic, two-list
      bounds, and toy Poisson fixture. Stages 1-2 collect pools and run the
      exhaustive zero-sum census with verification. Stage 3 compares
      two-list 4-SUM to matched rho. Stage 4 writes the three-row reading
      and the n=131 Stage-0 row. No Magma/Sage. No AUXIN. No Bedrock. No
      ECC2K-130 solve. TW-03/TW-10 not closed under this card.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Freeze Stage-0 certificates (instance-dependence lemma, zero-sum
    arithmetic, m-SUM floor); measure zero-sum ratios of the Koblitz walk
    DP pool against Poisson and three controls at n=19; deliver exactly
    one O-* label from H-BINSTD-1447cf.

  class: measurement
  class_note: >-
    Control / heuristic-validation measurement of H_generic vs H_structured
    for walk-carried known-log pools. Closes or reopens the KN-OPEN-020
    target-dependent row. Not an exponent-moving breakthrough.

  scope:
    included:
      - >-
        Stage 0 (ZERO COMPUTE beyond tiny Python). Write
        stage0/preregistered-predictions.json and stage0/derivations-note.md
        freezing: instance-dependence lemma; class-(ii) relabelings;
        C(B,m)/l at B=2^33 and 2^35.5; two-list and 2-bit filter-cap
        bounds (≥2^{66} at m in {3,4}); toy fixture C(64,4)/130873≈4.9;
        H_generic bands [0.5,2] and [0.67,1.5]; B≤128 < sqrt(l).
      - >-
        Stage 1. Collect pools of B in {32,64,128} DPs per arm, 20 seeds;
        de-duplicate by point; record (a,b) per DP; write stage1/*.json.
      - >-
        Stage 2. Exhaustive zero-sum census m in {2,3,4}; curve-arithmetic
        verification of every zero-sum; bracket record; write stage2/*.json.
      - >-
        Stage 3. Two-list 4-SUM over B=128 and matched rho with negation +
        Frobenius classes to a certified solve, 50 seeds; ops counters;
        write stage3/*.json.
      - >-
        Stage 4. Three-row reading (H_generic / H_structured / artifact);
        n=131 row from Stage 0 alone; RESULTS.md with exactly one O-*
        label; memory beside time.
    excluded:
      - Any ECC2K-130 or deployed-n decomposition / m-SUM solve as a claimed result.
      - Magma/Sage/cypari2/AUXIN/Bedrock/WDSat as success path.
      - Editing IDEA-20260926-beb5b6 / 178821 / b48c9d claim text.
      - Editing shared GOAL-ECDLP2M-001.yaml.
      - Closing TW-03 or TW-10 under this card (review-breakthrough items).
      - Proposing or implementing a structured m-SUM solver.
      - Treating infra failure as evidence against H_generic.

  inputs:
    idea: ledger/proposals/IDEA-20260926-beb5b6.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-1447cf.yaml
    decision: ledger/decisions/DEC-20261002-eaddc1.yaml
    hold_decision: ledger/decisions/DEC-20260928-63addc.yaml
    consolidated_conjugate: ledger/proposals/IDEA-20260926-178821.yaml
    consolidated_gamma: ledger/proposals/IDEA-20260926-b48c9d.yaml
    filter_cap: ledger/proposals/IDEA-20260926-136bd3.yaml
    ball_sibling: ledger/proposals/IDEA-20260926-b6cc43.yaml
    reusable_impl_readonly:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - experiments/EXP-CERTBIN-e94b27/impl/common.py

  controls:
    - name: relabelled_Z4l_blocking
      description: >-
        Relabelled Z/(4*130873) with walk rule and DP predicate transported
        through a recorded bijection. Must sit on Poisson (blocking).
    - name: ordinary_16adding_null
      description: >-
        Same field, ordinary curve A=46693 B=306147 h=2; 16-adding walk;
        same DP weight bound. No-Z[τ] null.
    - name: random_knownlog_nonwalk
      description: >-
        Random known-log points not produced by any walk; size-matched B.
    - name: dedup_by_point
      description: >-
        De-duplicate pool by point before any count; repeats reported
        separately (separates cycles from structure).
    - name: curve_verification
      description: >-
        Every counted zero-sum and every rho solve re-verified by curve
        arithmetic; failure → O-ARTIFACT.
    - name: bracket_rate
      description: >-
        Fraction of zero-sums with sum b_i = 0 mod l must be ≈1/l;
        rate >1/1000 → O-ARTIFACT.
    - name: memory_beside_time
      description: Peak RSS and table sizes stated beside every time figure.

  independent_variables:
    - name: stage
      levels: [0_derivations, 1_pools, 2_census, 3_ops, 4_reading]
    - name: arm
      levels: [koblitz_walk, ordinary_16adding, relabelled_Z4l, random_knownlog]
    - name: B
      levels: [32, 64, 128]
    - name: m
      levels: [2, 3, 4]

  metrics:
    primary:
      - name: zero_sum_ratio
        unit: dimensionless
        definition: Exhaustive zero-sum m-subset count / (C(B,m)/l), per arm,m,B,seed.
      - name: bracket_vanishing_rate
        unit: fraction
        definition: Fraction of verified zero-sums with sum b_i = 0 mod l.
      - name: ops_4sum
        unit: table_operations
        definition: Instrumented two-list 4-SUM ops to first verified zero-sum (or exhaustion).
      - name: ops_rho
        unit: group_operations
        definition: Matched rho with classes to a certified solve on the same instance.
    secondary:
      - name: pool_dedup_repeats
        unit: count
        definition: Points removed by de-duplication, per arm/seed.
      - name: peak_rss_bytes
        unit: bytes
      - name: stage0_count_log2
        unit: bits
        definition: Recomputed log2 E[zero-sum m-subsets] at B=2^33; must match within 0.3 bit.

  heuristic_under_test: H-beb5b6-1
  preregistered_prediction:
    quantity: zero_sum_ratio (Koblitz walk / Poisson and / controls)
    formula: >-
      E[count] = C(B,m)/l; H_generic predicts ratio in [0.5,2] vs Poisson
      and in [0.67,1.5] vs both controls at m in {3,4}.
    source: >-
      IDEA-20260926-beb5b6 predictions + elementary Poisson counting;
      frozen in stage0/preregistered-predictions.json before Stage 1.

  scale_relevance:
    tier: toy
    justification: >-
      n=19 Koblitz/ordinary cells; B≤128. n=131 row is Stage-0 arithmetic
      under H_generic transfer only, labelled extrapolation.
    correspondence: null

  tail_checks:
    - >-
      Maximum zero_sum_ratio across seeds reported beside the mean; not
      averaged away.
    - >-
      Any seed with bracket_vanishing_rate >1/1000 flagged before aggregation.

  replication:
    seeds: [2026092601, 2026092602, 2026092603, 2026092604, 2026092605,
            2026092606, 2026092607, 2026092608, 2026092609, 2026092610,
            2026092611, 2026092612, 2026092613, 2026092614, 2026092615,
            2026092616, 2026092617, 2026092618, 2026092619, 2026092620]
    independent_instances: 20
    stage3_seeds: 50
    stage3_seed_rule: >-
      Separate PCG64 stream recorded in stage3/manifest.json; 50 independent
      (P,Q) instances at B=128 on the Koblitz arm only for ops comparison.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 8
    maximum_workers: 1

  stopping_rules:
    - Stage 0 arithmetic mismatch >0.5 bit → STOP as O-ARTIFACT before Stage 1.
    - Relabelled control off Poisson by >2× → STOP as O-ARTIFACT.
    - Any verification failure → STOP as O-ARTIFACT.
    - Wall-clock or memory ceiling → O-IMPEDIMENT; never negative evidence.
    - After Stages 0-4 complete or a named stop: write RESULTS.md with one O-*.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze.
    - Pool not de-duplicated before counts.
    - Claiming a structured m-SUM solver result under this card.
    - Using Magma/Sage/AUXIN/Bedrock/WDSat as the success path.
    - Editing idea claim text or GOAL-ECDLP2M-001.yaml.

  success_criterion: >-
    Stages 0-4 complete with artifacts present; RESULTS.md names exactly
    one of O-H-GENERIC, O-H-STRUCTURED, O-ARTIFACT, O-IMPEDIMENT; every
    primary metric recorded; Stage-0 bands frozen before Stage 1.

  falsification_criterion: >-
    H_generic falsified iff Koblitz/Poisson ratio outside [0.5,2] or
    Koblitz/control ratio outside [0.67,1.5] at m in {3,4}, replicated
    across ≥10 of 20 seeds and absent on both controls (→ O-H-STRUCTURED).
    Instrument falsified (→ O-ARTIFACT) on control-off-Poisson, bracket
    defect, or verification failure.

  required_artifacts:
    - stage0/preregistered-predictions.json
    - stage0/derivations-note.md
    - stage1/pools-manifest.json
    - stage2/census-summary.json
    - stage3/ops-comparison.json
    - stage4/reading.json
    - RESULTS.md
    - runs/<RUN-BINSTD-*>/manifest.yaml

  claim_tier_and_scope:
    claim_tier: toy
    statement: >-
      Control measurement of zero-sum structure of known-log DP pools at
      n=19 under four arms; Stage-0 pricing of the ECC2K-130 known-log-pool
      row under H_generic.
    sota_delta: zero on every ECDLP cost axis
    dominated_by: >-
      Parallel Pollard rho (≈2^{60.81} on ECC2K-130; ≈2^{7.7} at the toy
      cell) dominates the m-SUM route under H_generic.
    certificate_kind: none
    certificate_note: >-
      Zero-sum witnesses and rho solves are instrument checks, not claimed
      discrete-log results of the experiment's scientific claim.
    affected_vs_safe: No deployed curve is attacked or claimed broken.

  assigned_to: executor
  execution_authorized: true
  execution_authorized_note: >-
    In fact only after the design snapshot TASK-20261002-ed8b84 verifies
    against Git and the dispatch preconditions of TASK-20261002-ea5389 hold.
  frozen: true
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
