experiment:
  id: EXP-MCEGOP-3eeba9
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-2b2ccd; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-2b2ccd
  question_id: RQ-MCE-b38a8b
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exact fibre enumeration of the binary-Goppa parametrisation map at m=3 and bounded Monte
    Carlo out-of-orbit collision search at m in 4..5, measured against the closure of an explicitly
    declared trivial-equivalence generating set
  objective: 'One uncertainty is reduced: whether the trivial-equivalence quotient this program is
    required to declare actually exhausts the set of secret parametrisations consistent with a public
    code, at the only scales where the question can be answered. Stated in parts: (i) MACHINERY VALIDATION
    BY BRUTE FORCE -- at m=3, n=8, t=2, enumerate every parametrisation, group by canonical public
    code, and check that the declared group''s orbit sits exactly inside the enumerated fibre. This
    cell is degenerate as mathematics and decisive as engineering: without it, no classification of
    a Monte Carlo hit as in-orbit or out-of-orbit can be trusted. (ii) THE RATIO -- what is the exact
    fibre-to-orbit ratio at that cell, replicated across reference codes, and does a ratio above 1
    survive replication or dissolve as a smallness artefact? (iii) A STATED BOUND WHERE COUNTING IS
    IMPOSSIBLE -- at m in {4,5}, where exhaustive enumeration is out of reach by many orders of magnitude,
    what one-sided upper bound on out-of-orbit collision density does a sample of N independent draws
    support, and what is the achieved N? A bound with its sample size is an honest deliverable; a
    bound quoted without one is an absence claim, and this contract forbids that. Two nulls run alongside:
    a code outside the image of the map, where any hit voids the run, and a random alternant arm with
    the same declared group, which decides whether any measured effect belongs to the Goppa specialisation
    or to the alternant parametrisation.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A completed run could support exactly this: that at m=3, n=8,
      t=2, under the declared generating set and the declared canonicalisation, the enumerated fibres
      had the reported sizes and the orbit had the reported index inside them; and that at m in {4,5},
      N independent uniform draws produced the reported in-orbit and out-of-orbit hit counts, supporting
      the reported one-sided density bound at the achieved N. What does NOT follow: no key recovery
      and no search algorithm; no statement about the cost of finding a parametrisation at any scale;
      no key-space reduction for any scheme; nothing about Classic McEliece or any standardized parameter
      set; and specifically NOT the claim that the declared group is the whole fibre, which zero observed
      out-of-orbit hits cannot establish and which must always be reported as a bound with its N.'
  inputs:
    procedure: 'STAGE 0 (cost: hours, human). Declare and freeze the trivial-equivalence generating
      set, the canonicalisation, the sampling measure and N. STAGE 1 (cost: minutes). Implement the
      group action and compute the orbit of a reference parametrisation by closure; run the generator-ablation
      control. STAGE 2 (cost: minutes). Implement canonicalisation and verify invariance under random
      invertible row operations. STAGE 3 (cost: 10-60 minutes). Exact arm at m=3: enumerate all ordered
      supports and all monic degree-2 g, reject invalid ones, construct and canonicalise, and build
      the parametrisation-to-code dictionary. STAGE 4 (cost: minutes). Read off fibre sizes, check
      orbit containment exactly, compute the ratio for at least 20 distinct reference codes. STAGE
      5 (cost: 1-4 hours). Monte Carlo arm at m=4 and m=5: draw N = 10^7 parametrisations uniformly,
      canonicalise, count hits against a fixed reference code, classify each hit by orbit membership.
      STAGE 6 (cost: as STAGE 5). Run the random-code null and the random-alternant arm with identical
      N. STAGE 7 (cost: minutes). Compute Clopper-Pearson one-sided bounds at the achieved N and emit
      all raw counts. Total budget 8 CPU-hours, with the achieved N reported rather than the target
      asserted.'
    instrument: Python 3.11 standard library only (numpy absent, verified). Consumes harness/goppa_toy.py
      from proposal 1 for field arithmetic and construction; adds a group-action module implementing
      the declared generators, a canonicalisation routine returning a reduced row-space basis as a
      tuple of ints, itertools.permutations for the m=3 exact enumeration, a dict keyed by canonical
      form for grouping, and random.Random with domain-separated seeds for the Monte Carlo arm. Clopper-Pearson
      bounds computed from the standard beta-quantile identity implemented directly. No Sage, no external
      package, no network.
    parameters: 'EXACT ARM: m=3 (GF(8) from x^3+x+1), t=2, n=8, all 8! = 40320 ordered supports, all
      64 monic degree-2 polynomials, invalid ones rejected; at least 20 distinct reference codes analysed.
      MONTE CARLO ARM: m=4 (n=16, t=2) and m=5 (n=24 and n=32, t=2 and t=3), N = 10^7 draws per reference
      code, three reference codes per cell. NULLS: one random binary code outside the image per cell
      with the same N; one random alternant reference per cell with the same N. Generator-ablation:
      each declared generator removed in turn. Canonicalisation invariance check on 1000 random row
      operations.'
  controls:
  - 'Random-code null: Monte Carlo search against a code outside the image of Phi, which must yield
    zero hits.'
  - Random-alternant arm with the same declared group, as the competing-family explanation.
  - 'Brute-force ground truth at m = 3: the orbit must sit exactly inside the enumerated fibre.'
  - 'Canonicalisation determinism check: the same code presented under a random invertible row operation
    must canonicalise identically.'
  - 'Generator-ablation control: recompute the orbit with one declared generator removed, to show
    each generator contributes and the declared group is not over-specified.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls run in the same invocation. (1) RANDOM-CODE NULL: fix a random
    binary [n, k] code that is NOT in the image of Phi, and run the identical Monte Carlo collision
    search against it with the same N draws. The null must show ZERO hits: a parametrisation cannot
    generate a code outside the image, so any hit indicates a canonicalisation bug and voids the whole
    run. This is a strong, cheap correctness gate. (2) RANDOM-ALTERNANT NULL: run the identical fibre
    measurement on a random alternant code with a uniform multiplier, whose declared trivial-equivalence
    group is the same. If the alternant arm''s out-of-orbit collision bound is indistinguishable from
    the Goppa arm''s, then whatever is measured is a property of the alternant parametrisation and
    not of the Goppa specialisation, and every number must be labelled accordingly. For the exact
    arm at m = 3, the ground-truth fibre computed by brute force is itself the control on the orbit
    computation: the orbit must be a subset of the enumerated fibre, exactly, and any element of the
    orbit not in the fibre is a bug.'
  independent_variables:
  - field and code parameters (m, t, n)
  - arm (goppa | random-alternant | out-of-image null)
  - reference code index
  - generator-ablation condition
  metrics:
    primary:
    - exact fibre size per reference code at m=3
    - declared-orbit size
    - fibre-to-orbit ratio
    - out-of-orbit Monte Carlo hit count and its one-sided density bound at the achieved N
    secondary:
    - in-orbit hit count
    - achieved N per cell
    - random-code null hit count, required zero
    - canonicalisation invariance failures, required zero
    - orbit size under each generator ablation
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The fibre-to-orbit ratio at m=3, and the one-sided 95 percent upper bound on out-of-orbit
      collision density at m in {4,5}.
    formula: 'Phi(L,g) = canonical reduced basis of the GF(2) row space of the trace expansion of
      the t-by-n matrix with entries a_j^i / g(a_j). Fibre(C) = {(L,g) : Phi(L,g) = C}. Orbit(L0,g0)
      = closure of (L0,g0) under the declared generators. Ratio = |Fibre(Phi(L0,g0))| / |Orbit(L0,g0)|,
      pre-registered at exactly 1 with any deviation requiring replication across at least 20 reference
      codes. Out-of-orbit density bound = Clopper-Pearson one-sided 95 percent upper limit on p given
      h out-of-orbit hits in N draws, always reported as the pair (h, N).'
    source: Pre-registered in the parent proposal IDEA-20260816-2b2ccd before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The exact arm runs at m=3, n=8, t=2, which is the largest cell where full enumeration
      of 2.6 million parametrisations is affordable, and which yields k=2 -- degenerate, and stated
      as such rather than presented as representative. The Monte Carlo arm runs at m in {4,5} where
      enumeration is infeasible by roughly eight orders of magnitude, and produces a bound rather
      than a count; that limitation is the honest content of the arm and is reported as the pair (hits,
      N) everywhere. NO extrapolation to larger m is offered: the fibre structure at m=13 is not addressed,
      approached, or bounded by anything in this contract.'
    correspondence: null
  tail_checks:
  - Fibre-size outliers at m=3 (codes with unusually large or small fibres) are reported individually
    with their parametrisations rather than summarised.
  - Any Monte Carlo hit classified as out-of-orbit is inspected by hand and its parametrisation recorded
    in full, since a single such hit is the most informative possible observation.
  - The generator-ablation condition that changes the orbit least is reported, since a generator contributing
    nothing means the declaration is over-specified.
  - Codes at m=3 with no valid parametrisation other than the reference are reported as singleton-fibre
    cases and checked for canonicalisation error.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Abort if any orbit element fails to lie inside the enumerated fibre at m=3.
  - Abort if the out-of-image null registers any hit.
  - Cap total wall-clock at 8 CPU-hours and report the ACHIEVED N per cell rather than asserting the
    target N.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The m=3 exact arm completes, the orbit sits exactly inside every enumerated fibre,
    the fibre-to-orbit ratio is reported for at least 20 reference codes, the out-of-image null shows
    zero hits, and every Monte Carlo bound is reported as the pair (out-of-orbit hits, achieved N)
    with its Clopper-Pearson limit.
  falsification_criterion:
  - Any orbit element outside the enumerated fibre at m=3.
  - Any hit on the out-of-image null.
  - Canonicalisation not invariant under random invertible row operations.
  - A fibre-to-orbit ratio above 1 that fails to replicate across the 20 reference codes.
  - A declared generator whose removal leaves the orbit size unchanged.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-2b2ccd
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The trivial-equivalence generating set must be declared explicitly and frozen by the Coordinator
    before any run; every number this contract reports is conditional on it and it cannot be revised
    after results are seen.
  - Whether the m=3, k=2 cell is admissible as machinery validation given its degeneracy needs a ruling;
    the alternative is no exact arm at all and hence no ground truth for the Monte Carlo hit classification.
  - The sampling measure over parametrisations (uniform over ordered supports and monic squarefree
    g) is a choice that determines the reported density and must be frozen with its rationale.
  - Whether a single observed out-of-orbit hit would be reportable as a finding, or would require
    an independent replication first, should be decided in advance rather than after seeing one.
