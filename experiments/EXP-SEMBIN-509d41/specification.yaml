# =============================================================================
# EXP-SEMBIN-509d41 -- VERSION 1 (APPROVED by DEC-20261002-15b02c) frozen contract for H-SEMBIN-9af7e1:
# Semaev chaining-topology closure (GOAL-SEMBIN-cbf422 sub-objective 3).
# Source IDEA-20260913-c94e52 under RQ-SEMBIN-9fa4ba / GOAL-SEMBIN-cbf422.
#
# Stages 0-2. ZERO RUNS in this design packet. No Magma/Sage/AUXIN/Bedrock.
# Claim tier: control / closure + one-cell HEUR-TOP measurement. NO attack.
# NO exponent. Singular non-null success_criterion and falsification_criterion.
# =============================================================================
experiment:
  id: EXP-SEMBIN-509d41
  version: 1
  hypothesis_id: H-SEMBIN-9af7e1
  question_id: RQ-SEMBIN-9fa4ba
  source_idea: IDEA-20260913-c94e52
  related_idea_ids:
    - IDEA-20260918-c05e71
    - IDEA-20260913-9c54f9
  goal_id: GOAL-SEMBIN-cbf422
  designed_by_task: TASK-20261002-4a41e0
  snapshot_task: TASK-20261002-4a41e0
  executor_task: TASK-20261002-d67dd7
  title: >-
    Stage-0 freeze of (C1)-(C6) tables + HEUR-TOP predictions; Stage-1
    independent re-enumeration and DAG known-false control; Stage-2 HEUR-TOP
    cell at (n,t,k)=(16,5,4) path / cherry-caterpillar / balanced + null
  status: approved
  approved_by: DEC-20261002-15b02c
  approved_at: '2026-10-02'
  # Top-level frozen/execution_authorized are what tools/experiment_execution.py
  # load_plan reads (nested approval.* alone is not sufficient).
  frozen: true
  frozen_at: '2026-10-02'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized for /run admission under DEC-20261002-15b02c and
    live executor TASK-20261003-af0d91. Stage 2 remains on the original design
    card TASK-20261002-d67dd7 and is not admitted by trial-plan-v1.json.
    No Magma/Sage/AUXIN/Bedrock. Combinatorial Stage 1; Stage-2 HEUR-TOP is
    a later amendment.
  approval:
    approved_by: DEC-20261002-15b02c
    composing_decision: DEC-20261002-15b02c
    standing_authorization: >-
      AGENTS.md standing user authorization (2026-09-06). Protocol complete;
      Coordinator checked required fields (including singular
      success_criterion and falsification_criterion) before approving.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    execution_state: >-
      approved frozen contract; Stages 0-1 /run-admissible under
      TASK-20261003-af0d91 / trial-plan-v1.json
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    (1) Freeze Stage-0 worksheet: (C1) invariants, (C2) model-blindness
    reading, (C3)/(C4) sigma_top design figures, (C5) d_ff invariance, (C6)
    arity table labelled conditional on HEUR-ARITY, HEUR-TOP decision bands,
    DAG known-false sketch. (2) Stage-1: independently re-enumerate binary
    merge trees t=3..8, assert counts, recompute sigma_top extremes, write
    DAG counterexample. (3) Stage-2: build Weil-descended systems for path,
    cherry-caterpillar, balanced at (16,5,4) plus random-Boolean null;
    >=100 matched instances; decide PREDICTIVE/INERT/MISLEADING; emit exactly
    one O-* label. Observations only.

  claim_tier: control
  claim_tier_note: >-
    Closure of sub-objective 3 inside binary merge trees, plus one-cell
    HEUR-TOP meter test. No IC-vs-rho claim, no FIPS verdict, no exponent.
    Missing solver backend → O-IMPEDIMENT for Stage 2, never evidence against
    (C1)-(C5).

  inputs:
    proposal: ledger/proposals/IDEA-20260913-c94e52.yaml
    hypothesis: ledger/hypotheses/H-SEMBIN-9af7e1.yaml
    decision: ledger/decisions/DEC-20261002-15b02c.yaml
    question: ledger/questions/RQ-SEMBIN-9fa4ba.yaml
    goal: ledger/goals/GOAL-SEMBIN-cbf422.yaml
    related:
      - ledger/proposals/IDEA-20260918-c05e71.yaml
      - ledger/proposals/IDEA-20260913-9c54f9.yaml
      - knowledge/literature/KN-LIT-fa346d.md
      - knowledge/techniques/KN-TECH-b18366.md
      - inputs/SEMAEV-2015-310/
    off_limits:
      - Editing IDEA-20260913-c94e52 / c05e71 / 9c54f9 claim text.
      - Editing shared GOAL-SEMBIN-cbf422.yaml / GOAL-SEMBIN-5078bc.yaml.
      - Magma / Sage / AUXIN as success path.
      - Amazon Bedrock.
      - Deployed-curve ECDLP solves as claimed results.
      - Stage-2 at a second (n,t,k) under this card.
      - Citing sibling-only EXP/H identifiers not present on this branch as DEC target_ids.
      - Treating infra / missing-backend as evidence against (C1)-(C5).

  controls:
    - name: tree_count_double_factorial
      description: >-
        Enumerated labelled-tree counts must equal (2t-3)!! =
        3,15,105,945,10395,135135 for t=3..8; mismatch → O-ARTIFACT.
    - name: path_baseline_recovered
      description: >-
        Semaev's path recovered as a caterpillar shape; used as denominator
        of every sigma_top ratio.
    - name: dag_known_false
      description: >-
        Merge-DAG counterexample where auxiliaries ≠ t-2; if (C1) argument
        still goes through on DAGs, argument is wrong → O-ARTIFACT.
    - name: both_extremes
      description: min/path AND max/path reported at every Stage-1 (n,t,k).
    - name: t4_balanced_minimiser
      description: >-
        t=4 row (balanced IS minimiser) reported prominently; selective
        suppression forbidden.
    - name: random_boolean_null
      description: >-
        Stage-2 null: same slot-size profile, random Boolean polys of matched
        degree profile; separates sparse-LA from summation-polynomial structure.
    - name: reversed_monomial_order
      description: Every Stage-2 arm repeated under a reversed monomial order.
    - name: table2_path_calibration
      description: >-
        Path arm at related Table-2 scale records d_F4=4 and sat rate; absolute
        seconds need not match 2015 hardware.
    - name: backend_impediment_discipline
      description: Missing Groebner/Macaulay backend → O-IMPEDIMENT for Stage 2.
    - name: memory_beside_time
      description: Peak RSS stated beside every Stage-2 time figure.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_reenumerate, 2_heur_top]
    - name: tree_arity_t
      levels: [3, 4, 5, 6, 7, 8]
    - name: shape
      levels: [path, cherry_caterpillar, balanced, other_enumerated]
    - name: stage2_arm
      levels: [path, cherry_caterpillar, balanced, random_boolean_null]
    - name: field_degree_n
      levels: [16, 17, 21, 310, 571]

  primary_metrics:
    - name: invariant_hold_rate
      definition: >-
        Fraction of enumerated trees with equations=t-1, aux=t-2,
        N=(t-2)n+tk, three-var blocks=t-2; must be exactly 1.0.
    - name: sigma_top_min_over_path
      definition: sigma_top(min shape)/sigma_top(path) per (n,t,k) cell.
    - name: heur_top_verdict
      definition: Exactly one of PREDICTIVE / INERT / MISLEADING / SKIPPED_IMPEDIMENT.
    - name: outcome_label
      definition: Exactly one of O-CLOSURE / O-C1-FAIL / O-PROXY-MISLEAD / O-ARTIFACT / O-IMPEDIMENT.
    - name: certificate_tree_counts
      definition: Per-t labelled-tree counts; must equal (2t-3)!!.

  secondary_metrics:
    - name: sigma_top_max_over_path
      definition: sigma_top(max)/sigma_top(path) per cell.
    - name: spearman_sigma_vs_time
      definition: Spearman correlation across Stage-2 shapes (excl. null).
    - name: path_minimiser_median_time_ratio
      definition: median T(path)/median T(minimiser); proxy predicts ~1.331.
    - name: d_ff_and_max_step_degree
      definition: Per-instance first-fall and max step degree (covariates).
    - name: realised_monomial_count
      definition: Must match sigma_top arithmetic for each generated system.
    - name: peak_rss_bytes
      definition: Peak RSS beside every timed Stage-2 arm.
    - name: wall_clock_seconds
      definition: Per-instance and per-arm aggregate wall clock.
    - name: arity_charged_log2_table
      definition: Stage-0 frozen N(j)^{omega(j^2+1)} table; conditional on HEUR-ARITY.

  seeds_and_replication:
    master_seed: 20261002c94
    stage2_instances_per_arm: 100
    stage2_cell:
      n: 16
      t: 5
      k: 4
      N_boolean: 68
    stratification: 50/50 independently enumerated satisfiable / unsatisfiable
    cheapest_discriminator: >-
      Stage-1 re-enumeration alone decides O-C1-FAIL vs combinatorial
      half of O-CLOSURE; Stage 2 is the HEUR-TOP meter only.
    replication: >-
      Single primary replication under this card; seed and instance-set rule
      frozen in stage0/preregistered-predictions.json. Second (n,t,k) forbidden.

  budget:
    wall_clock_seconds: 28800
    memory_gb: 8
    maximum_runs: 3
    cpu_note: >-
      Advisory. Stage 0-1 are combinatorial (seconds of Python). Stage 2
      estimate under 8 CPU-hours including null and order repeat at N=68;
      freeze scientific sample counts; do not expand to a second cell or
      HEUR-ARITY validation under leftover wall clock.

  stopping_rules:
    - Stage 0 must freeze predictions before any Stage-1 metric is read as evidence.
    - Stage-1 tree-count mismatch or invariant failure → O-ARTIFACT / O-C1-FAIL; do not start Stage 2.
    - Missing Groebner/Macaulay backend → O-IMPEDIMENT for Stage 2; Stage-1 closure may still yield O-CLOSURE with heur_top_verdict=SKIPPED_IMPEDIMENT.
    - Stop Stage-2 at 100 matched instances per arm or 4 CPU-hours per arm, whichever first.
    - Do not run Stage 2 at a second (n,t,k) under this card.
    - After exactly one O-* is decided, stop.
    - Timeout / OOM / crash → failed_infrastructure / O-IMPEDIMENT; never negative evidence against (C1)-(C5).

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze invalidates subsequent stages.
    - Changing solver, monomial order, seed, curve, f, B, or instance list mid-arm without amendment invalidates Stage-2 ratios.
    - Suppressing the t=4 balanced-minimiser row is a reporting defect.
    - Any claim of speedup / exponent / FIPS break in RESULTS.md invalidates the scientific read (scope defect).
    - Citing sibling-only EXP/H not on this branch as binding evidence is forbidden.

  success_criterion: >-
    Decidable from the primary metrics before any run. The experiment SUCCEEDS
    as a measurement/closure (either scientific direction) when all of:
    (1) Stage 0 worksheet present with (C1)-(C6) tables, HEUR-TOP bands, and
    DAG sketch, frozen in stage0/preregistered-predictions.json before
    Stage 1; (2) Stage 1 re-enumeration artifacts present with
    certificate_tree_counts = (2t-3)!! and invariant_hold_rate = 1.0, OR
    exactly one of O-C1-FAIL / O-ARTIFACT named from Stage 1; (3) Stage 2
    completes with heur_top_verdict in {PREDICTIVE,INERT,MISLEADING} OR
    Stage 2 stops as O-IMPEDIMENT with heur_top_verdict=SKIPPED_IMPEDIMENT;
    (4) exactly one O-* label in RESULTS.md decidable from primary metrics
    alone; (5) peak RSS reported beside every timed Stage-2 figure (or
    Stage 2 skipped under O-IMPEDIMENT); (6) Magma / Sage / AUXIN / Bedrock
    were not used as the success path. Scientific direction (closure vs
    C1-fail vs proxy-mislead) is read from the O-* label and does not alter
    success-as-measurement.

  falsification_criterion: >-
    Stated before any run, scoped to the binary-merge-tree class and the
    Stage-2 cell (16,5,4). H-SEMBIN-9af7e1's invariance claim is falsified by O-C1-FAIL
    (any tree with auxiliaries≠t-2, equations≠t-1, or N≠(t-2)n+tk) or by a
    Stage-1 three-variable-block count ≠t-2. HEUR-TOP is falsified as a
    predictive meter by O-PROXY-MISLEAD (inverted median-time ordering vs
    sigma_top). Tree-count ≠ (2t-3)!!, DAG known-false control failure, or
    arm mismatch is O-ARTIFACT (instrument / enumeration defect): run void
    for affected stages; not directional evidence against Semaev's model.
    Timeout / crash / missing backend is O-IMPEDIMENT / failed_infrastructure,
    never negative mathematical evidence against (C1)-(C5). No outcome under
    this card asserts an IC-vs-rho, FIPS, or exponent claim.

  success_criteria:
    - Stage 0 worksheet frozen before Stage 1.
    - Stage 1 tree counts = (2t-3)!! and invariant_hold_rate = 1.0 (or O-C1-FAIL/O-ARTIFACT named).
    - Exactly one O-* label in RESULTS.md.
    - Stage 2 HEUR-TOP verdict recorded OR SKIPPED_IMPEDIMENT.
    - Memory reported beside Stage-2 time (if run).
    - No Magma/Sage/AUXIN/Bedrock used as success path.

  falsification_criteria:
    - Per H-SEMBIN-9af7e1 falsification_criteria (invariants, sigma_top extremes, HEUR-TOP inversion, tree-count, infra).

  required_artifacts:
    - experiments/EXP-SEMBIN-509d41/stage0/preregistered-predictions.json
    - experiments/EXP-SEMBIN-509d41/stage0/worksheet-note.md
    - experiments/EXP-SEMBIN-509d41/stage1/tree-census.json
    - experiments/EXP-SEMBIN-509d41/stage1/sigma-top-tables.json
    - experiments/EXP-SEMBIN-509d41/stage1/dag-known-false.md
    - experiments/EXP-SEMBIN-509d41/stage2/per-instance.jsonl
    - experiments/EXP-SEMBIN-509d41/stage2/arm-summaries.json
    - experiments/EXP-SEMBIN-509d41/runs/<RUN-SEMBIN-*>/
    - experiments/EXP-SEMBIN-509d41/RESULTS.md

  stages:
    - id: 0
      name: zero_compute_freeze
      description: >-
        Freeze (C1)-(C6) statements and design figures, HEUR-TOP decision
        bands, DAG sketch, seeds; write preregistered-predictions.json.
      compute: none
    - id: 1
      name: reenumeration_and_dag_control
      description: >-
        Independent Python re-enumeration t=3..8; assert invariants; recompute
        sigma_top tables; write DAG known-false control.
      compute: combinatorial
    - id: 2
      name: heur_top_cell
      description: >-
        Weil-descended systems at (16,5,4) for three shapes + null; >=100
        matched instances; decide PREDICTIVE/INERT/MISLEADING; emit O-*.
      compute: measurement
      cheapest_valid_discriminator: Stage-1 alone for combinatorial closure

  protocol_amendments_path: experiments/EXP-SEMBIN-509d41/amendments/
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
