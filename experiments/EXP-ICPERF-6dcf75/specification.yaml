# EXP-ICPERF-6dcf75
# Filter-threshold arithmetic. No matrix.
# Approved by DEC-20261002-38a236.
experiment:
  id: EXP-ICPERF-6dcf75
  hypothesis_id: H-ICPERF-888b38
  source_idea: IDEA-20260915-9191ed
  question_id: RQ-ICPERF-94c86e
  version: 1
  title: Filter-threshold arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-38a236
  objective: >-
    Check the cross gap 5, the cross gap 14, and the cycle counts 3
    and 0.
  inputs:
    noop_num: 23
    noop_den: 20
    floor_num: 3
    floor_den: 2
    half_gap: 14
    half_den: 40
    live_num: 6
    live_den: 5
    fifth_gap: 5
    fifth_den: 100
    nfs_low: 2
    nfs_gap: 17
    exact_fifth_num: 1
    exact_fifth_den: 20
    cycle_edges: 7
    cycle_vertices: 5
    cycle_components: 1
    cycle_count: 3
    tree_edges: 4
    tree_vertices: 5
    tree_components: 1
    tree_cycles: 0
  controls:
    - >-
      Six fifths exceeds 23/20 by 5 on the denominator 100. Reporting
      the two ceilings as equal invalidates the run.
    - >-
      Three halves exceeds 23/20 by 14 on the denominator 40. Reporting
      that gap as 0 invalidates the run.
    - >-
      One relation in twenty equals 1/20. Reporting it as strictly
      below 1/20 invalidates the run.
    - >-
      The cycle count on seven edges is 3 and the tree count is 0.
      Reporting the tree count as positive invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {ceiling, cycle}
    - route in {cross_product, formula}
  metrics:
    primary:
      - fifth_gap
      - tree_cycles
      - implementations_agree
    secondary:
      - half_gap
      - nfs_gap
      - cycle_count
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The cross gap on the denominator 100 is 5, and the tree cycle count is 0.
    formula: >-
      Compare 6 times 20 with 23 times 5, and 3 times 20 with 23 times
      2. The cycle count is edges minus vertices plus components.
    source: >-
      IDEA-20260915-9191ed states the ceilings 1.15, 1.5 and 1.2, the
      five-percent bound, and the cycle count E minus V plus C, read
      2026-10-02. The products were computed in this design session.
      That computation is not a run. No matrix was built.
  scale_relevance:
    tier: toy
    justification: Four rationals and two graphs. No transfer to a filter.
    correspondence: null
  tail_checks:
    - The tree cycle count 0 is required. A check that stops at the ceiling gaps is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the cross gap disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The cross gap on the denominator 100 is not 5.
    - 23/20 is reported as equal to 6/5.
    - One in twenty is reported as strictly below 1/20.
    - The tree cycle count is reported as positive.
    - A matrix is built or a filter is run.
  success_criterion: >-
    Both runs agree that the cross gap is 5, that the cross gap on the
    denominator 40 is 14, that one in twenty equals 1/20, and that the
    cycle counts are 3 and 0.
  falsification_criterion: >-
    The runs agree, the cross products are 120 and 115, and their
    difference is not 5.
  required_artifacts:
    - experiments/EXP-ICPERF-6dcf75/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ICPERF-6dcf75/runs/<RUN-ID>/command.txt
    - experiments/EXP-ICPERF-6dcf75/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ICPERF-6dcf75/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ICPERF-6dcf75/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ICPERF-6dcf75/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any relation matrix, hypergraph filter, or cycle search on a curve.
    - Any claim that filtering changes an exponent.
    - Any measured matrix weight.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
