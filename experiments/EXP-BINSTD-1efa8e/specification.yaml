# =============================================================================
# EXP-BINSTD-1efa8e -- VERSION 1 (APPROVED by DEC-20261002-11fcfd) frozen
# contract for H-BINSTD-958766: write-once-sharded reachability-table carrier
# + validator + six-case synthetic battery.
#
# Source: IDEA-20260922-6028ed under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Incorporates HOLD-F corrections (per-cell sharding; extended schema;
# ECC2K-130 hand row; seed only re-derived cells).
#
# ZERO RUNS in this design packet. Stages 0-4 authorized for executor
# TASK-20261002-366976. No AUXIN. Amazon Bedrock prohibited.
# NO break. NO attack. NO exponent claim. Infrastructure only.
# =============================================================================
experiment:
  id: EXP-BINSTD-1efa8e
  hypothesis_id: H-BINSTD-958766
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-6028ed
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Write-once-sharded reachability-table schema + validator + 6-case
    synthetic staleness battery (HOLD-F corrected)
  status: approved
  approved_by: DEC-20261002-11fcfd
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-11fcfd
    composing_decision: DEC-20261002-11fcfd
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-4 authorized. Stage 4 only
      proposes CI wiring; it does not merge workflow edits as a scientific
      claim.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2, 3, 4]
    scientific_execution_authorized_note: >-
      All stages are deterministic file I/O / hash / YAML checks. No curve
      arithmetic. No Magma/Sage. No AUXIN. No Bedrock. Stage 4 is a written
      proposal artifact only unless a separate Coordinator infra decision
      authorizes workflow edits.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Build the RQ-BINSTD maintained reachability-table carrier as write-once
    per-cell shards with a CI-style validator that catches the named
    Σ_ledger staleness modes at 6/6 on a synthetic battery, with 100%
    transcription fidelity on re-derived seed cells — or name the exact
    schema/battery gap that blocks CI proposal.

  class: tooling
  class_note: >-
    Infrastructure / instrumentation experiment. Carries
    HEUR-BINSTD-6028ed-H0 (finite Σ_ledger coverage). Not an
    exponent-moving breakthrough experiment; no ECDLP cost table produced.

  scope:
    included:
      - >-
        Stage 0. Freeze schema (per-cell fields including unit, m,
        floor_bits, budget_bits, rho_convention, provenance_tier,
        certificate, inputs, formula, extrapolation_distance,
        missing_quantity, matched_rho_row, ratio, superseded_by) and
        controlled missing_quantity vocabulary; write
        stage0/schema-freeze.md + stage0/preregistered-predictions.json.
      - >-
        Stage 1. Seed write-once cells under
        analysis/binstd-curve-audit/reachability/<curve>/<column>.yaml
        ONLY for independently re-derived arithmetic (review lane /
        CORR-20260922-81aeab / KN-LIT-661e97 / audit STRUCTURALLY_EMPTY
        certificates). Include ECC2K-130 hand row. All other cells
        NOT_YET_ASSESSED or omitted (omission ≡ NOT_YET_ASSESSED in the
        generated view). Single-file mutable YAML is FORBIDDEN as live store.
      - >-
        Stage 2. Implement tools/validate_reachability_table.py (schema,
        certificate hash, supersession, informational liveness) reusing
        validate_ledger supersession lookup; implement generated view
        rebuild; ensure generated view path is gitignored.
      - >-
        Stage 3. Six-case synthetic battery on SCRATCH COPIES only:
        (1) valid seed PASS; (2) one-byte certificate change FAIL named
        cell; (3) missing input id FAIL; (4) synthetic superseded input
        FAIL; (5) bad missing_quantity FAIL; (6) unrelated IDEA append
        PASS. Report per-case pass/fail with cell + pointer.
      - >-
        Stage 4 (contingent on 6/6). Write a CI-integration proposal note
        (do not merge workflow changes unless separately authorized).
    excluded:
      - Computing any new curve cost, genus, or decomposition floor beyond
        transcription of already re-derived numbers.
      - Magma/Sage/cypari2/AUXIN provisioning.
      - Amazon Bedrock.
      - Editing IDEA-20260922-6028ed claim text.
      - Editing shared GOAL-ECDLP2M-001.yaml.
      - Single shared mutable reachability_table.yaml as the live store.
      - Claiming break / exponent / deployed attack / unconditional insecurity.
      - Treating battery infra failure as mathematical evidence.

  inputs:
    proposal: ledger/proposals/IDEA-20260922-6028ed.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-958766.yaml
    question: ledger/questions/RQ-BINSTD-b6f698.yaml
    review: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-6028ed.yaml
    rho_convention: ledger/corrections/CORR-20260922-81aeab.yaml
    ecc2k130_params: KN-LIT-661e97
    audit_readme: analysis/binstd-curve-audit/README.md
    certificate_producers:
      - analysis/binstd-curve-audit/subfield_scan.py
      - analysis/binstd-curve-audit/subfield_certify.py
    validate_ledger_pattern: tools/validate_ledger.py
    seed_policy: >-
      Re-derived cells only (HOLD-F): thirteen matched-rho rows where
      arithmetic is independently available; GHS / subfield-rational /
      stable-subspace STRUCTURALLY_EMPTY on prime-degree rows with
      certificate pointers; ECC2K-130 decomposition floors m=2..8 from
      review ecc2k130_bearing product-law numbers. Everything else
      NOT_YET_ASSESSED. Do not seed from unreproduced 77bf31 prose alone
      without independent re-derivation.

  controls:
    - name: valid_seed_pass
      description: Case 1 — unmutated seeded shards must validate (blocking).
    - name: false_positive_unrelated_append
      description: Case 6 — unrelated ledger record must NOT fail validation (blocking).
    - name: scratch_copy_discipline
      description: All mutation cases operate on copies; never live shards or live certificates.
    - name: transcription_fidelity
      description: >-
        Human/Coordinator diff of seeded numbers vs independent re-derivation
        to 0.01 bit before trusting battery results.
    - name: sharding_control
      description: >-
        Live store is one write-once file per cell; a single mutable YAML
        live store is an invalidation.

  independent_variables:
    - name: mutation_case
      levels: [valid, cert_byte_flip, missing_input, superseded_input, bad_missing_quantity, unrelated_append]
    - name: cell_storage_layout
      levels: [write_once_per_cell]
      forbidden_levels: [single_mutable_yaml_live_store]
    - name: provenance_tier
      levels: [proposal_arithmetic, analysis, evidence]

  metrics:
    primary:
      - name: battery_pass_count
        unit: cases_out_of_6
        definition: Number of Stage-3 cases whose observed pass/fail matches the preregistered expectation.
      - name: transcription_fidelity
        unit: fraction
        definition: Seeded cells whose numeric fields match re-derivation within 0.01 bit.
      - name: per_case_named_failure
        unit: (case_id, cell_id, pointer)
        definition: For each FAIL case, the named cell and failing pointer string.
    secondary:
      - name: validator_runtime_seconds
        unit: seconds
        definition: Wall time of one full validation over seeded cells.
      - name: open_cell_liveness_hit_rate
        unit: fraction
        definition: Informational; planted OPEN cells flagged possibly-closeable.
      - name: peak_rss_bytes
        unit: bytes
        definition: Peak RSS of validator process (memory honesty; expected small).

  heuristic_under_test: HEUR-BINSTD-6028ed-H0

  preregistered_prediction:
    quantity: >-
      Pass/fail vector of the six synthetic-mutation cases and transcription
      fidelity of seeded cells.
    formula: >-
      Expect [PASS, FAIL, FAIL, FAIL, FAIL, PASS]; transcription_fidelity = 1.0;
      battery_pass_count = 6.
    source: >-
      IDEA-20260922-6028ed minimal_test Stage 3 + HOLD-F concrete_experiment
      (analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-6028ed.yaml);
      frozen before Stage 3 execution in stage0/preregistered-predictions.json.

  scale_relevance:
    tier: null
    justification: >-
      Not a cryptanalytic scale experiment. Carrier sized for ~180 cells of
      the RQ-BINSTD population; battery is six deterministic cases.
    correspondence: null

  tail_checks:
    - >-
      Any seeded cell without unit or provenance_tier fails schema (hard).
    - >-
      Generated view path must be listed in .gitignore (or equivalent
      local ignore committed with the implementation) before Stage 4.

  replication:
    seeds: []
    independent_instances: 1
    note: >-
      Deterministic battery; no RNG. Optional second machine re-run of Stage 3
      for instrument replication is allowed but not required for O-CARRIER-READY.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 300
    total_cpu_hours: 0.5
    maximum_memory_gb: 2
    maximum_runs: 5
    maximum_workers: 1
    note: >-
      Advisory only (docs/research-budget-policy.md). Scientific sample count
      is the fixed six-case battery — not expandable by leftover wall clock.

  stopping_rules:
    - >-
      SR-1. Stage 0 schema freeze complete before any seed write.
    - >-
      SR-2. If Stage 1 unmutated validation fails → stop as O-SCHEMA-GAP;
      do not run mutation cases until fixed (via amendment if schema changes
      after freeze — prefer fix before freeze lands).
    - >-
      SR-3. If battery_pass_count < 6 → stop as O-BATTERY-FAIL; name case;
      do not propose CI.
    - >-
      SR-4. On 6/6 + fidelity 1.0 → O-CARRIER-READY; Stage 4 proposal only.
    - >-
      SR-5. Advisory budget exhausted → O-IMPEDIMENT with measured quantity;
      never negative evidence against HEUR-BINSTD-6028ed-H0.
    - >-
      SR-6. Do not escalate carrier readiness into any ECDLP security claim.

  invalidation_rules:
    - Editing stage0/preregistered-predictions.json after Stage-0 freeze.
    - Using a single mutable YAML file as the live reachability store.
    - Seeding cells from unreproduced prose without independent re-derivation
      while labeling provenance_tier evidence.
    - Mutating live certificate artifacts or live ledger records during battery.
    - Provisioning Magma/Sage/cypari2/AUXIN as the success path.
    - Using Amazon Bedrock.
    - Editing IDEA-20260922-6028ed claim text or shared GOAL-ECDLP2M-001.yaml.
    - Overwriting a prior RUN-* directory.
    - Claiming break / exponent / deployed attack from this contract.
    - Wiring CI as a blocking check inside this executor card without a
      separate Coordinator infrastructure decision citing O-CARRIER-READY.

  success_criterion: >-
    ALL of: (1) Stage-0 freeze present; (2) write-once per-cell shards
    seeded under analysis/binstd-curve-audit/reachability/; (3) validator
    implements schema + hash + supersession (+ informational liveness);
    (4) generated view rebuild exists and is gitignored; (5)
    battery_pass_count = 6 with per-case named pointers on FAIL cases;
    (6) transcription_fidelity = 1.0; (7) RESULTS.md names exactly one
    O-* label; (8) no invalidation_rule fired. This delivers the
    RQ-BINSTD carrier; it does NOT claim any curve is broken.

  falsification_criterion: >-
    ANY of: (F1) battery_pass_count < 6 after a complete Stage-3 attempt
    (O-BATTERY-FAIL); (F2) unmutated seed fails validator (O-SCHEMA-GAP);
    (F3) transcription_fidelity < 1.0; (F4) live store is a single mutable
    YAML; (F5) Magma/Sage/AUXIN/Bedrock used as success path. Budget
    exhaustion is O-IMPEDIMENT, not falsification of HEUR-BINSTD-6028ed-H0.

  required_artifacts:
    - experiments/EXP-BINSTD-1efa8e/implementation/
    - experiments/EXP-BINSTD-1efa8e/stage0/schema-freeze.md
    - experiments/EXP-BINSTD-1efa8e/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-1efa8e/stage0/missing_quantity_vocabulary.yaml
    - tools/validate_reachability_table.py
    - analysis/binstd-curve-audit/reachability/
    - experiments/EXP-BINSTD-1efa8e/stage3/battery-report.json
    - experiments/EXP-BINSTD-1efa8e/stage4/ci-proposal.md
    - experiments/EXP-BINSTD-1efa8e/runs/
    - experiments/EXP-BINSTD-1efa8e/RESULTS.md

  procedure:
    stages:
      - id: S0-FREEZE
        text: >-
          Write schema-freeze.md, missing_quantity_vocabulary.yaml, and
          preregistered-predictions.json; ZERO seed cells before freeze.
      - id: S1-SEED
        text: >-
          Write per-cell shards (HOLD-F layout); ECC2K-130 hand row; only
          re-derived cells; provenance_tier proposal_arithmetic unless a
          stronger tier is justified by a cited evidence record.
      - id: S2-VALIDATOR
        text: >-
          Implement tools/validate_reachability_table.py + generated view
          rebuild; ensure gitignore for generated view.
      - id: S3-BATTERY
        text: >-
          Run six scratch-copy cases; write battery-report.json with
          per-case pass/fail and named cell/pointer on failures.
      - id: S4-PROPOSE
        text: >-
          If 6/6 and fidelity 1.0: write stage4/ci-proposal.md. Do not
          merge workflow edits under this card alone.
      - id: S-SUM
        text: >-
          Write RESULTS.md with exactly one O-* label; observations only;
          no ledger status edits.

  assigned_to: executor
  executor_handoff: TASK-20261002-366976
  snapshot_task: TASK-20261002-e2aabb

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
