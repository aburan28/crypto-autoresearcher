experiment:
  id: EXP-INCB-9c5974
  hypothesis_id: H-INCB-dc5010
  derived_from_idea: IDEA-20260807-490c34
  question_id: RQ-INCB-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Explaining a recorded deficit a one-sided gate could not see - the measured
    distribution of x(-P-Q) over lifting pairs against uniform and against the
    closed-form quadratic-residuosity weighting, propagated into the collinear-triple
    first moment, with a pre-registered sign test across five primes

  objective: >-
    The one uncertainty a run reduces - whether the 15 to 35 percent shortfall of EC
    collinear-triple richness below its own uniform-x first-moment prediction,
    consistent in sign in every fittable cell of EV-INCB-001 and recorded there as
    not explained, is a mechanical consequence of the lifting map or a curve-specific
    property. A run establishes (i) the empirical distribution of x(-P-Q) over ALL
    lifting x-pairs at five primes, compared against uniform on the x-set and against
    the closed-form quadratic-residuosity fibre-size weighting computed independently
    from the definition of the lift; (ii) the corrected first-moment triple-count
    prediction obtained by substituting the measured distribution, and the RESIDUAL
    deficit that survives it; and (iii) the pre-registered sign test of that residual
    across cells, which is the only admissible read given that the per-cell deficit is
    within about 2 SE. The random x-subset null already implemented in EXP-INCB-001
    runs first and unchanged, since it is what shows the instrument reports uniformity
    when uniformity holds. No attack, break, speedup or security consequence is
    claimed here or would follow from a run.

  what_this_is_not:
  - >-
    Not an attack, a factor-base yield improvement, or a cost statement. Pollard rho
    at exponent 1/2 dominates regardless and this contract adds no row.
  - >-
    Not a per-cell significance claim in either direction. The deficit is within about
    2 SE per cell and only its consistency in sign across cells is readable.
  - >-
    Not a dispute of EV-INCB-001's controlled negative on its intended gate. That gate
    asked only about an EXCESS; this contract takes the deficit as its object.
  - >-
    Not the character-sum / H-PSEUDO axis, which is a separate actively worked lane on
    a different statistic and a different object.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output or
    evidence. No run has been executed under this contract.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the five executed primes and the executed x-sets,
      the distribution of x(-P-Q) over lifting pairs has a stated chi-squared against
      uniform and against the closed-form weighting, the corrected first moment has a
      stated value, and the residual deficit has a stated magnitude and a stated sign
      pattern across cells. WHAT DOES NOT FOLLOW - no per-cell significance claim; no
      statement about primes not run; no attack cost; no statement about factor-base
      yield in an actual index-calculus pipeline; and specifically NOT that a surviving
      residual is usable for anything, which would require replication and a red-team
      pass first.

  inputs:
    procedure: >-
      STAGE 0 (zero compute, blocking). Pre-register the sign test - its cell list, its
      one-sided-versus-two-sided form, its threshold, and the minimum cell count of 5
      below which it is declared unreadable. Pre-register the residual tolerance that
      counts as fully accounted. Derive the closed-form quadratic-residuosity weighting
      symbolically from the definition of the lift and record the derivation. All fixed
      before any histogram exists, because a threshold or a weighting chosen afterwards
      would fit the deficit.
      STAGE 1 (null, run FIRST, per controls-before-belief). Run the identical histogram
      procedure on the random x-subset null already implemented in EXP-INCB-001. It must
      come out uniform to within its measured 0.69 SE. If it does not, the non-uniformity
      is an instrument property and the reading stops there.
      STAGE 2 (forced value, blocking). Compare the Stage 1 and Stage 3 histograms against
      the CLOSED-FORM residuosity weighting computed at Stage 0. The closed form is a
      prediction with no free parameters, so this is a forced value and not a fit.
      STAGE 3 (signal arm). At each of the five primes, build the x(-P-Q) histogram over
      ALL lifting x-pairs; report the chi-squared against uniform and against the closed
      form, with the conditioning of any fit checked first, since fit conditioning caused
      one spurious crossing in the original record.
      STAGE 4 (propagation). Substitute the measured distribution into the first-moment
      collinear-triple prediction, recompute it, and report the residual deficit per
      prime as an absolute count, as a fraction of the observed deficit, and in units of
      the per-cell standard error.
      STAGE 5 (sign test, executed exactly as pre-registered). Apply the Stage 0 sign test
      to the residual across the five cells. Report the cell count; if fewer than 5
      independent fittable cells were obtained, report UNREADABLE and stop.
      STAGE 6 (zero compute). Assemble the per-prime tables with no pooling, the corrected
      baseline formula, and the refusal statement for any quantity outside what was
      computed.
    instrument: >-
      The pipeline of experiments/EXP-INCB-001, reusing its random x-subset null unchanged,
      extended to emit the x(-P-Q) histogram over lifting pairs and to accept a supplied
      distribution in the first-moment triple-count formula. The closed-form residuosity
      weighting is computed by a separate routine written from the definition of the lift,
      sharing no state with the histogram code, so the forced-value check is independent.
      Recorded through harness/runner.py with instrument sha256 against the pinned
      EXP-INCB-001 instrument.
    parameters: >-
      The three primes of EXP-INCB-001 plus two further primes, all fixed at Stage 0, with
      the same curve family and the same factor-base x-sets. Histogram over ALL lifting
      pairs (P,Q) at each prime - complete enumeration, no sampling, at these sizes.
      Comparisons against uniform on the x-set and against the closed-form weighting.
      Sign test across the five cells, form and threshold fixed at Stage 0.

  controls:
  - >-
    PRIMARY NULL, mandatory and run FIRST - the random x-subset null of EXP-INCB-001, on
    which the same histogram must come out uniform to within its measured 0.69 SE. If it
    does not, the deficit is an instrument property and the reading stops there.
  - >-
    FORCED VALUE, blocking - the closed-form quadratic-residuosity fibre-size weighting,
    computed symbolically at Stage 0 from the definition of the lift with no free
    parameters, checked against the measured histogram BEFORE anything curve-specific is
    invoked.
  - >-
    INDEPENDENT-IMPLEMENTATION CONTROL - the closed-form weighting is computed by a
    routine sharing no state with the histogram code, so the forced-value check cannot be
    satisfied by a shared bug.
  - >-
    FIT-CONDITIONING CHECK, blocking - conditioning is re-checked before any fit, since
    fit conditioning produced one spurious crossing in EV-INCB-001 and was diagnosed there.
  - >-
    PRE-REGISTERED SIGN TEST - the analysis across cells is fixed at Stage 0 with a minimum
    of 5 independent fittable cells, because the per-cell deficit is within about 2 SE and
    only sign consistency is readable.
  - >-
    NO-POOLING RULE - results are reported per prime; small-prime effects dominate at the
    smallest cell and pooling would hide them.

  independent_variables:
  - prime p, five values
  - 'arm - EC lifting pairs versus random x-subset null'
  - 'comparison distribution - uniform on the x-set versus closed-form residuosity weighting'

  metrics:
    primary:
    - >-
      chi-squared statistic of the x(-P-Q) histogram against uniform on the x-set -
      dimensionless with its degrees of freedom reported - per prime per arm, computed on
      the complete enumeration of lifting pairs
    - >-
      chi-squared statistic of the same histogram against the closed-form residuosity
      weighting - dimensionless with degrees of freedom - per prime per arm; this is the
      forced-value comparison
    - >-
      residual deficit after correction - reported three ways per prime - as an absolute
      collinear-triple count, as a fraction of the originally observed 15 to 35 percent
      deficit, and in units of the per-cell standard error
    - >-
      sign-test outcome across cells - the number of cells, the number sharing the
      residual's sign, and the pre-registered test statistic and verdict, or the verdict
      UNREADABLE if fewer than 5 independent fittable cells were obtained
    secondary:
    - >-
      implied first-moment correction - the change in the predicted triple count caused
      by substituting the measured distribution for uniform, per prime
    - >-
      the full histogram per prime per arm, retained raw so a chi-squared cannot hide the
      shape
    - >-
      fibre-size census - the counts of x values with two, one and zero rational lifts,
      per prime, which is the closed form's input and must be reported so the forced value
      can be re-derived by a reader
    - >-
      fit conditioning number per fit, and the null's measured SE against the committed
      0.69 SE
    - >-
      wall time and peak memory per cell, and an explicit list of censored cells

  heuristic_under_test:
    id: HEUR-INCD-1
    formal_statement: >-
      The sign-consistency of the first-moment deficit across fittable cells is not itself
      a multiple-testing artifact - under the null that the uniform-x first moment is
      correct, each cell's deficit sign is an independent fair coin and all-same-sign has
      probability 2^{1-c} for c independent cells.
    tested_here: true
    how: >-
      By pre-registering the sign test at Stage 0 and by ADDING TWO FURTHER PRIMES before
      it is read, so that c is at least 5 and the binomial tail is at most 0.0625. Cells at
      the same prime are NOT independent and are not counted separately. If fewer than 5
      independent fittable cells are obtained the verdict is UNREADABLE, which is neither
      support nor refutation.

  preregistered_prediction:
    quantity: >-
      The residual deficit in the collinear-triple count after substituting the measured
      x(-P-Q) distribution into the first-moment prediction, per prime, in units of the
      per-cell standard error; and its sign pattern across the five cells.
    formula: >-
      Let T_obs be the observed collinear-triple count, T_unif the first moment under
      uniform x, and T_meas the first moment under the measured distribution. Deficit :=
      (T_unif - T_obs)/T_unif, recorded at 15 to 35 percent in EV-INCB-001. Residual :=
      (T_meas - T_obs)/T_meas. PREDICTED - |Residual| below the Stage 0 tolerance at every
      prime and its sign no longer consistent across the five cells. Under the null that
      the deficit is curve-specific rather than mechanical, Residual keeps the original
      sign at every prime and passes the sign test.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-490c34, whose predictions block
      requires the departure to be large enough to account for a 15 to 35 percent
      first-moment shortfall computed as an implied moment change rather than asserted, and
      whose honest_prior_of_survival records 0.7 that the residuosity weighting explains
      most or all of the deficit and 0.2 that a residual survives, before any run under
      this contract exists. Never tuned to data.

  scale_relevance:
    tier: toy
    justification: >-
      Executed at the three primes of EXP-INCB-001 plus two further toy primes, because the
      design requires COMPLETE ENUMERATION of lifting pairs so that the measured histogram
      carries no sampling error to confuse with the effect, and because comparability with
      the committed record is the basis of the whole reading. No transfer to larger p is
      claimed or used. The two added primes exist to give the sign test cells, not to
      extend scale.
    correspondence: null

  tail_checks:
  - >-
    Report the fibre-size census (x values with two, one and zero rational lifts) per prime,
    since the closed-form weighting is a function of it and a reader must be able to
    re-derive the forced value.
  - >-
    Report the histogram's smallest-count bins explicitly; a chi-squared driven by a handful
    of near-empty bins is not evidence of a shape and must be flagged.
  - >-
    Report the residual at the SMALLEST prime separately and flag it, since small-prime
    effects dominate there and it is the cell most likely to drive a sign pattern spuriously.
  - >-
    Report the null's measured SE at every prime against the committed 0.69 SE; a null that
    drifts is not the committed null.
  - >-
    Report the number of INDEPENDENT fittable cells explicitly, and refuse the sign test
    below 5.

  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3

  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 1.0
    maximum_memory_gb: 8
    maximum_runs: 20

  stopping_rules:
  - >-
    Stop immediately if the Stage 1 random x-subset null does not come out uniform to within
    its measured 0.69 SE - the non-uniformity would then be an instrument property.
  - >-
    Stop and report UNREADABLE if fewer than 5 independent fittable cells are obtained; do
    not run the sign test on fewer cells and do not substitute cells from the same prime.
  - >-
    Do not revise the Stage 0 sign test, its threshold, the residual tolerance or the
    closed-form weighting after seeing any histogram.
  - >-
    Stop at the five declared primes. Adding a prime after seeing a sign pattern is a
    different experiment and requires a new contract.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a
    stop, never a negative result (AGENTS.md rule 5).

  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run
    failed_infrastructure and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - >-
    A run whose null arm is missing, or whose null arm was not executed in the same
    invocation as the signal arm, is invalid_measurement.
  - >-
    A run whose closed-form residuosity weighting was computed by code sharing state with
    the histogram code is invalid_measurement - the forced value would then be checkable by
    a shared bug.
  - >-
    A run making a PER-CELL significance claim about the deficit is invalid_measurement; the
    per-cell effect is within about 2 SE and only the sign test is admissible.
  - >-
    A run pooling across primes is invalid_measurement.
  - >-
    A run whose parameters, sign test or tolerance differ from the frozen contract is a
    DIFFERENT experiment and requires a new contract; it is never a repair of this one.

  success_criterion: >-
    The Stage 1 null comes out uniform to within 0.69 SE at every prime, the closed-form
    weighting is derived and recorded at Stage 0 before any histogram, at least 5 independent
    fittable cells are obtained, and the run reports the x(-P-Q) histogram, both chi-squared
    statistics, the corrected first moment and the residual deficit in all three declared
    units at every prime, together with the pre-registered sign-test statistic and verdict.
    This criterion is decidable from the primary metrics alone and says nothing about which
    values those quantities take.

  falsification_criterion:
  - >-
    The corrected first moment accounts for the full deficit - |Residual| below the Stage 0
    tolerance at every prime and the sign no longer consistent across the five cells. The
    deficit is mechanical, the uniform-x baseline is superseded by the corrected one, and
    nothing curve-specific remains. This is the expected outcome and the corrected baseline
    is the deliverable.
  - >-
    The random x-subset null also shows the deficit. It is an instrument property and no
    reading of the signal arm is admissible.
  - >-
    The measured histogram is statistically indistinguishable from uniform at every prime.
    The named candidate cause is absent, the deficit has no explanation from this direction,
    and the record's mechanism is wrong even if its object was right.
  - >-
    Fewer than 5 independent fittable cells are obtained. The sign test is UNREADABLE and no
    conclusion in either direction may be recorded from this run.
  - >-
    The measured histogram is inconsistent with the closed-form residuosity weighting while
    still being non-uniform. The forced value did not fire, so the proposed mechanism is
    incomplete even if the corrected baseline is empirically better, and the two must not be
    conflated in any write-up.

  required_artifacts:
  - >-
    manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model and
    inference block, instrument sha256 against the pinned EXP-INCB-001 instrument, and
    environment. The manifest carries certificate kind none, the designated value for pure
    measurement runs, since no solve and no factor-base relation is produced.
  - >-
    raw-result.json carrying the full x(-P-Q) histogram per prime per arm and the complete
    fibre-size census - not summaries
  - >-
    the null arm's measurements, in the same file as the signal arm
  - >-
    the Stage 0 pre-registration text, written before any histogram exists and hashed,
    containing the sign test with its form and threshold, the residual tolerance, the minimum
    cell count, and the symbolic derivation of the closed-form residuosity weighting
  - >-
    the propagation output - T_unif, T_meas and T_obs per prime with the residual in all
    three declared units
  - >-
    fit conditioning numbers, the null's measured SE per prime, and an explicit list of
    censored cells

  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval is required before execution, and under this engagement approval is
    the USER's gate because it authorizes execution and spends compute. This contract is NOT
    approved - approved_by is null and execution_authorized is false (AGENTS.md rule 1).
  - >-
    The parent proposal is not proof-oriented and the paired hypothesis records
    not_applicable_reason on its proof_search_map, so no KN-TECH-080 audit is required before
    implementation. A surviving residual promoted into a structural claim about EC factor-base
    geometry would be proof-oriented, and would in any case require replication and a red-team
    pass first.
  - >-
    The sign test, its threshold, the residual tolerance, the minimum cell count and the
    symbolic residuosity derivation must all be recorded at Stage 0 before any histogram is
    built.

  derivation_provenance:
    tool: coordinator subagent, design-experiment lifecycle steps 3 to 5
    source_record: IDEA-20260807-490c34
    authored_at: '2026-08-25'
    note: >-
      Controls, metrics, staging and falsification conditions are taken from the parent
      proposal's minimal_test, null_object_control, confounders and falsification_conditions
      blocks. The sign test's minimum cell count of 5 and the two added primes come from the
      proposal's own HEUR-INCD-1 validation plan (pre-register the sign test and add two
      further primes before reading it) and are promoted here to blocking stopping rules.
      Committed values (15 to 35 percent deficit, excess ratio 0.75 to 1.0, null matching to
      at most 0.69 SE, the single fit-conditioning crossing) are quoted from EV-INCB-001 as
      that record's claims, not asserted here. Budgets come from the parent's declared
      estimated_cost (implementation low, compute low). No field is invented.

  derivation_gaps:
  - >-
    The two further primes are unspecified. They must be pinned at Stage 0, because primes
    chosen after seeing a sign pattern would select for the outcome.
  - >-
    The residual tolerance that counts as fully accounted is not given by the proposal. A
    Coordinator must fix it, and it should be derived from the per-cell standard error rather
    than chosen as a round number.
  - >-
    Whether the sign test is one-sided or two-sided is unsettled. The deficit's direction was
    observed before this contract was written, so a one-sided test in that direction is not
    a clean pre-registration; the safer choice is two-sided and the executor must record
    which was used and why.
  - >-
    Whether EXP-INCB-001's pipeline exposes lifting pairs, or must be re-run, is unknown to
    this contract. If it must be re-run, the cost is small at these primes but the
    reproduction of the committed deficit becomes a further blocking gate that this contract
    does not currently list.
  - >-
    The closed-form weighting is described as a first-order effect. If higher-order terms
    matter at the smallest prime, a mismatch there is expected rather than informative, and
    the executor must state the order of the closed form actually derived.
