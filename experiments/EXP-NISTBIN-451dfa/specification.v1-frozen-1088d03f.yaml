# =============================================================================
# EXP-NISTBIN-451dfa -- the 571 solving-degree surface cost_571(D, omega),
# reconciled to EXP-SEMBIN-992e73's exact block_n4w instrument at D = 4, read
# against the corrected matched-rho column, with the 283 proves-too-much
# control and claim (A) re-evaluated under the coherent baseline.
#
# Written by TASK-20260924-fda726 (lane A, BATCH-7d29e8, GOAL-ECDLP2M-001)
# under DEC-20260924-99ce20 S1 and design_conditions C1-C8.
#
# NOT APPROVED. status review_required, approved_by null. It is approved if and
# only if DEC-20260924-124667 is official with decision approve naming this
# experiment (block `approval` below). ZERO RUNS were performed to write it.
#
# OUTCOME DISCIPLINE. No AUXIN census value, reviewer finding value,
# RUN-FROB-627924 value or EXP-FROB-30006a outcome. Nothing under
# experiments/EXP-FROB-30006a/, experiments/EXP-QSP-70b731/runs/, the
# cursor/semaev ref or PR #1377 was read. No measured d'_F value is quoted.
# No statement about the security of any curve, standard or deployed system.
# =============================================================================
experiment:
  id: EXP-NISTBIN-451dfa
  hypothesis_id: H-NISTBIN-dec5e1
  version: 1
  title: >-
    The 571 solving-degree surface in Semaev 2015's frozen block_n4w cost
    instrument, extended in D by two readings that coincide with it at D = 4,
    against the corrected matched-rho column; with the 283 proves-too-much
    control and claim (A) re-evaluated under the coherent baseline
  status: review_required
  status_note: >-
    Designed, not approved. Every field approval requires is filled. The
    contract is frozen in the sense that the producer snapshot
    TASK-20260924-304b20 binds it by content; after approval any change is a
    versioned protocol_amendment under amendments/, never an edit.
  question_id: RQ-NISTBIN-06157b
  idea_id: IDEA-20260922-7d6d43
  goal_id: GOAL-ECDLP2M-001
  batch_id: BATCH-7d29e8
  lane: A
  specified_by_task: TASK-20260924-fda726
  review_plan_id: REVIEW-NISTBIN-20260924-7d29e8
  design_audit: coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-7d29e8/design/TASK-20260924-fda726/proof-search-map-audit.yaml
  experiment_class: cost-model measurement (derivation only; every reported number is MODELLED, none is measured)

  objective: >-
    Replace EXP-SEMBIN-992e73's point estimate at n = 571 by the surface
    cost_571(D, omega) inside the same frozen instrument, and locate the zero
    D*(omega) of the time-only margin against the corrected matched-rho column
    of K-571 and B-571, reading D* only after a frozen regression fixture has
    shown that the surface is the instrument at D = 4. Alongside it, run the
    283 proves-too-much control against the corrected column, re-evaluate
    claim (A) at every FIPS, Certicom and Oakley degree under the coherent
    baseline, and recompute (never cite) every figure the proposal computed in
    session. The decision this changes is how the reachability table records
    the 571 cell: as a conditional computed cost with a named cliff edge
    D*(omega) in the reconciled model, or as an unqualified point estimate;
    and which threshold GOAL-SEMBIN-fcb7a2's true-degree work would be read
    against.

  scope:
    in_scope:
      - IDEA-20260922-7d6d43 Part 1 (the surface) and Part 2 (reconciliation and the 283 control), under RQ-NISTBIN-06157b
      - claim (A) re-evaluation at D = 4 at every FIPS, Certicom and Oakley degree
      - recomputation of every proposal-session figure, labelled as illustrative and never as a result
    out_of_scope:
      - >-
        PART 3 IS NOT DESIGNED: the true, U-4-discharged solving-degree
        measurement of the m = 12 descended system, its toy ladder, its
        extrapolation and the random-system null. Under DEC-20260924-4f8a03 R2
        it is SEMBIN and SDEG work, named as a pointer to GOAL-SEMBIN-fcb7a2.
      - >-
        Any re-measurement or recomputation of a SEMBIN quantity. The coherent
        baseline of H-SEMBIN-97ea23 is cited from its records and shifted by a
        closed-form offset; its machinery is not re-run.
      - Any index-calculus-side Frobenius or orbit saving (FROB and lane B).
      - Any solver, Groebner, XL, SAT or F4 engine; any curve instantiation; any field arithmetic.

  # ---------------------------------------------------------------------------
  inputs:
    frozen_instrument:
      path: experiments/EXP-SEMBIN-81dc96/code/joint_balance.py
      sha256_expected: 95a069364e2cacea9de914694fb5cdb1c886929626144edeb8835fced8698f46
      sha256_provenance: >-
        As recorded by RUN-SEMBIN-a7a2f3 (raw-result.json, instrument.sha256).
        Not re-hashed by the design session, which had no shell. Stage 0
        re-hashes it and stops on a mismatch.
      status: >-
        EXP-SEMBIN-81dc96 is status analyzed, approved by DEC-20260913-ebd639,
        its run RUN-SEMBIN-aa5161 reviewed and composed under DEC-20260913-74e208.
      use: loaded read-only as a module; never edited, copied or re-implemented inside the primary path
    fixture_target:
      record: experiments/EXP-SEMBIN-992e73/runs/RUN-SEMBIN-a7a2f3/raw-result.json
      row: rows[n = 571].paper_convention_t_eq_m_stage1_only
      values: {log2_cost: 186.307, m_star: 12, t_star: 12}
      source_status: >-
        EXP-SEMBIN-992e73 is status SPECIFIED, NOT APPROVED, and
        RUN-SEMBIN-a7a2f3 is an unapproved derivation archived for
        auditability; its own specification says no evidence record may rest
        on it. It is used here ONLY as a reproduction target for the
        instrument's call path, never as evidence about any curve. The same
        value is recorded by the approved instrument run RUN-SEMBIN-aa5161
        (correction_2_charged_cofactor.curve_charged at n = 571, log2_cost
        186.307, m 12).
    curve_parameters:
      fips: >-
        inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md Appendix D.1.3 (decimal
        n = r and the preamble's cofactor rule), cross-checked against
        inputs/SAFECURVES-20260825/specs/sec2-v2.txt (hex n and h for
        sect163k1..sect571r1).
      certicom: >-
        inputs/CERTICOM-CHALLENGE-2009/ for orders and coefficients, and
        inputs/BAILEY-2009-541-ECC2K130/talk-35minutes_text.md for the degree
        list, as EXP-SEMBIN-992e73 read it. NOT READ by the design session
        (outside its read scope); Stage 0 confirms each row is present.
      oakley: >-
        inputs/RFC2409-OAKLEY-EC2N/ for the Third and Fourth Oakley groups
        (F_(2^155), F_(2^185)). NOT READ by the design session; Stage 0
        confirms presence.
      ecc2k130_convention_control: >-
        inputs/BAILEY-2009-541-ECC2K130/paper_fulltext.md lines 164-166 (the
        expression sqrt(pi l/(2 * 2 * 131)) * 1.069993, about 2^60.9) and lines
        1094-1096 (|E| = 4 l and l in decimal).
    coherent_baseline:
      records: [H-SEMBIN-97ea23, EV-SEMBIN-4125ec, EXP-SEMBIN-2c40bb, RUN-SEMBIN-3ae91c, DEC-20260915-fad1c1]
      use: >-
        Per-degree coherent (product-minimum) margins, per storage reading and
        per kappa, read as recorded and never recomputed. The design session
        read only H-SEMBIN-97ea23.
      sign_convention_warning: >-
        SEMBIN's cost records report margins as log2(rho side) minus
        log2(index-calculus side), positive meaning index calculus is cheaper.
        This contract uses index calculus minus rho, positive meaning rho is
        cheaper, as EXP-SEMBIN-992e73 does. Rule SN-1 below normalises.
    cross_check_records:
      - >-
        COST-SEMBIN-8d123b, for its time-only 409 margin (sign check SN-1) and
        its degree-5 sensitivity row at n = 409 (control C-XDEG). Not read by
        the design session; located by Stage 0.
    documents: [CORR-20260922-81aeab, KN-FIND-936151, EV-SEMBIN-1ca3c8, H-SEMBIN-97ea23, IDEA-20260922-7d6d43]

  # ---------------------------------------------------------------------------
  definitions:
    notation: >-
      n the extension degree; m the Semaev decomposition parameter, t = m;
      k = n/m (unceiled, the frozen default); log2 throughout.
    A: >-
      A(n, m) = k - log2 P(n, m, m, k) with P = 1 - exp(-2^(mk-n)/m!), eq. (11).
      Computed by the instrument as
      jb.stage_costs(n, m, m, jb.Model(solve="block_n4w", charge_cofactor=False))[0],
      i.e. stage 1 with the per-solve cost set to zero.
    W: >-
      W(n, D) = jb.log2_macaulay_width(n, D) = log2 of the sum over d = 0..D
      of binom(n, d).
    instrument_value: >-
      C_I(n, omega) = min over m in 2..min(30, n) of
      jb.stage_costs(n, m, m, jb.Model(solve="block_n4w", omega=omega))[0],
      first minimum on ties (strict less-than, ascending m), exactly as
      experiments/EXP-SEMBIN-992e73/code/curve_table.py stage1_only_min does.
      Equal to min over m of A(n, m) + 4 omega log2 n.
    reading_R_B: >-
      C_B(n, D, omega) = min over m of A(n, m) + D omega log2 n. Semaev's
      block-structured per-solve cost n^(4 omega) with the degree bound 4 of
      Assumption 1 replaced by D. PRIMARY reading.
    reading_R_M: >-
      C_M(n, D, omega) = min over m of A(n, m) + omega (W(n, D) - W(n, 4) + 4 log2 n).
      The degree-D Macaulay width of an n-variable block, normalised so that
      C_M(n, 4, omega) = C_I(n, omega) exactly. SECONDARY reading.
    reading_R_I: >-
      Illustrative, UNRECONCILED, the proposal's surface:
      C_Ill(D, omega) = l + omega log2 binom(nvar, D), with t* = m* of the
      instrument, l = ceil(n/t*) and nvar = t* l (571 gives l = 48,
      nvar = 576). At 283 the proposal wrote l ~ 31, nvar ~ 279; both
      l = 32, nvar = 288 and l = 31, nvar = 279 are computed there. Used ONLY
      in Stage 7. Never read for D*.
    rho: >-
      rho(c) = 0.5 log2(pi r / (4 k)) per curve c, r the prime order of the
      base point from the primary input, k the curve's own Frobenius class
      order. k = n for a Koblitz curve defined over F_2 used over F_(2^n);
      k = 1 for a curve not defined over a proper subfield. Where k is not yet
      established, k = 1 is admissible ONLY as an upper bound on rho under
      rule IR-3.
    margin: >-
      mu_R(c, D, omega) = C_R(n, D, omega) - rho(c). POSITIVE MEANS RHO IS
      CHEAPER. Same sign as EXP-SEMBIN-992e73.
    d_star: >-
      D*_R(c, omega) = the least integer D in 2..64 with mu_R(c, D, omega) > 0.
      Reported with mu at D* - 1 and at D*. If no D in 2..64 qualifies, the
      value is the token "no crossing at D <= 64". A crossing at D = 2 is
      reported as "D* <= 2".
    memory_columns: >-
      Beside every time figure: MR_B = D log2 n (Macaulay rows, R-B form);
      MR_M = W(n, D) (Macaulay rows, R-M form); MR_C8 = log2 binom(nvar, D)
      with nvar as in reading_R_I (the formula of DEC-20260924-99ce20 C8);
      dense entries 2 MR_B and 2 MR_M; relation store k* = n/m* (log2 count of
      relations, D- and omega-independent). Memory is modelled, not measured.
    coherent_shift: >-
      delta(c) = 0.5 (n - log2 r) + 0.5 log2 k + (log2 0.886 - 0.5 log2(pi/4)).
      The amount by which the corrected column lies below the vOW total-work
      column W = 0.886 * 2^(n/2) that H-SEMBIN-97ea23 charges. Applied as a
      closed-form offset to recorded coherent margins; nothing is recomputed.

  input_rules:
    - id: IR-1
      rule: >-
        NO MEASURED DEGREE OF ANY KIND IS AN INPUT. D is an integer grid
        variable 2..64 and nothing else. The code opens no file under any
        experiments/*/runs/ directory other than the two declared
        raw-result.json files and the coherent-baseline records, reads no
        field named or labelled as a degree, first fall degree, d_F, d'_F or
        degree of regularity, and has no command-line or configuration input
        for D. Every table column is labelled "D (grid variable, hypothetical
        solving degree)", never "degree" alone.
      why: >-
        A fake first fall degree d'_F read as the D that feeds the surface is
        the KN-FIND-936151 error (PTM-D). A correct protocol refuses it by
        rule, not in prose.
    - id: IR-2
      rule: >-
        PER-INSTANCE DISCHARGE REQUIREMENT, binding on any LATER record that
        overlays a degree on this surface, and on nothing in this contract. The
        overlaid value must be the SOLVING degree (the maximal degree reached
        by the solving computation, the analogue of Assumption 1's d_F4), not
        a first fall degree. A first fall degree may be offered only through
        a separately numbered heuristic equating it with the solving degree.
        A TRUE d_F must state which side each placement of S_fe is on. A FAKE
        d'_F is inadmissible unless, at that instance, the unreduced total
        degree of every product g_i f_i of the realising fake witness is
        recorded and max_i deg(g_i f_i) <= d'_F holds there (the U-4 recovery
        rule of KN-FIND-936151 section 4); even then it yields only
        d_F <= d'_F and is reported as discharged by that bookkeeping, never by
        Lemma 4. Any overlay from toy n to n = 571 is an extrapolation under H2.
      why: >-
        C4. Written after reading KN-FIND-936151, EV-SEMBIN-1ca3c8,
        H-SEMBIN-97ea23 and EXP-SEMBIN-992e73 RESULTS at source.
    - id: IR-3
      rule: >-
        r, h and the curve coefficients come only from the primary inputs
        named above. Where a row's r is not frozen in them, rho is replaced by
        the upper bound rho_ub = 0.5 log2(pi (2^n + 1 + 2^(n/2 + 1)) / 8)
        (h >= 2, k = 1); a positive margin against rho_ub decides DEAD by
        lemma L-UB, and a non-positive one leaves the row UNRESOLVED. Recalled
        values are never used.
    - id: SN-1
      rule: >-
        Every margin imported from a SEMBIN record is negated into this
        contract's sign convention. Stage 0 verifies the convention on one
        known pair before any import: COST-SEMBIN-8d123b's time-only margin at
        n = 409 must equal minus EXP-SEMBIN-992e73's margin_vs_vow_bits at 409
        (-37.781) to 0.01 bit. If the check fails or the record cannot be
        located, no SEMBIN margin is imported and every row that needs one is
        UNRESOLVED.

  baseline_rule:
    id: BR-1
    rule: >-
      Claim (A) counts degrees, at D = 4 and a stated omega and kappa. A degree
      n is LIVE iff for at least one curve at n the coherent margin, imported
      under SN-1 and shifted to the corrected column (margin + delta(c)), is
      negative under every storage reading SEMBIN records. It is DEAD iff for
      every curve at n either (a) that shifted coherent margin is
      non-negative under every storage reading, or (b) the time-only margin
      against the corrected column (or against rho_ub under IR-3) is positive,
      which implies a coherent loss by lemma L-MONO. Otherwise it is
      UNRESOLVED (including reading-dependent). THE NAIVE 2^(n/2) COLUMN NEVER
      ENTERS BR-1, and no time-only reading can make a degree LIVE.
    why: >-
      PTM-C. Under the time-only column, naive or corrected, 409 sits below
      rho already in EXP-SEMBIN-992e73 (-37.956 against naive), and the
      corrected column lies only 0.67 to about 5.5 bits below the naive one at
      409, so a rule admitting any time-only column resurrects 409 as a false
      second cell. Claim (A) rests on the coherent baseline or on nothing.

  # ---------------------------------------------------------------------------
  frozen_c2_fixture:
    canonical_copy: >-
      The design audit's frozen_c2_fixture block. This restatement is
      identical in every number; a discrepancy between the two is a defect to
      be reported, not resolved by the executor.
    model: >-
      experiments/EXP-SEMBIN-81dc96/code/joint_balance.py, sha256
      95a069364e2cacea9de914694fb5cdb1c886929626144edeb8835fced8698f46,
      loaded with importlib.util.spec_from_file_location as module "jb" and
      registered in sys.modules before exec_module (the dataclass needs it),
      as curve_table.py does. Model(solve="block_n4w", charge_cofactor=True)
      with every other field at its frozen default (k_reading "unceiled",
      omega 3.0, omega_prime 2.0, degree 4, yield_law "eq11"). Value =
      C_I(571, 3.0), stage 1 only, t = m, m in 2..30.
    target: 'log2 cost 186.307 with m* = 12 and t* = 12 (source and status under inputs.fixture_target)'
    tolerance: 'absolute 5.0e-4 bit on log2 cost, inclusive; exact on m* and t*'
    tolerance_basis: >-
      Stated before any evaluation. The target is recorded to three decimals,
      so a correct evaluation must round to it; 5.0e-4 is that rounding
      half-width and nothing looser. The instrument is deterministic, so
      nothing else justifies slack.
    pass_rule: >-
      PASS iff |C_I(571, 3.0) - 186.307| <= 5.0e-4 and the argmin is m = 12,
      t = 12. Also required, same rule: C_I(283, 3.0) against 147.649 with
      m* = 9 (RUN-SEMBIN-a7a2f3 row n = 283).
    gate: >-
      G2. Nothing downstream of Stage 2 is computed unless F1 passes. In
      particular no D* is computed, printed or written before F1, F2, G1 and
      G4 have all passed and gates.json records it.
    margins_at_fixture_point: >-
      Design figures, hand arithmetic in the audit sheet, to be reproduced by
      Stage 6. At D = 4, omega = 3 the model's stage-1 cost 186.3070 (Macaulay
      rows 2^36.63 under R-B, 2^32.04 under R-M; relation store 2^47.58) lies
      93.4401 bits below the corrected K-571 figure 279.7471 and 98.5188 bits
      below the corrected B-571 figure 284.8257. These are the fixture point
      of a model under Assumption 1's degree, NOT a verdict on the 571 cell.

  # ---------------------------------------------------------------------------
  procedure:
    - stage: 0
      name: custody and inputs
      steps: >-
        Hash joint_balance.py and stop unless it equals sha256_expected.
        Record the sha256 of every input file read. Read r and h for K-571,
        B-571, K-283, B-283 and every claim-(A) curve from the primary inputs;
        verify each FIPS decimal r equals the SEC 2 hex n as integers and
        each FIPS h equals the SEC 2 h; record bit lengths; verify
        h r lies in the Hasse interval [2^n + 1 - 2^(n/2 + 1), 2^n + 1 + 2^(n/2 + 1)].
        Establish k per curve and say how. Locate the coherent-baseline and
        cross-check records and run the SN-1 sign check.
    - stage: 1
      name: rho column (gate G1)
      steps: >-
        Compute rho(c) for every curve. Run C-RHOCONV. G1 passes iff every
        Stage-0 parameter check passes and C-RHOCONV passes.
    - stage: 2
      name: fixture (gate G2)
      steps: Evaluate frozen_c2_fixture exactly as frozen. Record in gates.json.
    - stage: 3
      name: extension identities and interface lemma (gate G3)
      steps: >-
        F2: for every omega in {2.0, 2.376, 2.807, 3.0} and n in {571, 283},
        |C_B(n, 4, omega) - C_I(n, omega)| <= 1e-9 and
        |C_M(n, 4, omega) - C_I(n, omega)| <= 1e-9. F3: the interface identity
        of lemma L-INT at D = 4 to 1e-9 at 571 (m 12, l 48, nvar 576) and 283
        (m 9, l 32, nvar 288). C-ARG: at every (D, omega, reading) cell of the
        surface grid the argmin over m equals the D = 4 argmin (12 at 571,
        9 at 283). G3 passes iff F2 and C-ARG pass. F3 failing does not fail
        G3; it withdraws R-M and every Stage-7 figure.
    - stage: 4
      name: proves-too-much controls (gate G4)
      steps: >-
        At D = 4, omega = 3, under R-B and R-M (identical there by F2),
        compute the time-only margin against the corrected column for K-283,
        B-283, K-163, B-163, K-233, B-233, ECC2K-130 and ECC2-131 (the
        declared Certicom degree 131). G4 passes iff every margin is positive.
        At every other omega on the grid the same margins are REPORTED, not
        gated, because the frozen evaluation exists only at omega = 3; any
        non-positive one triggers routing RT-4.
    - stage: 5
      name: claim (A)
      steps: >-
        At D = 4, for omega in {2.376, 2.807, 3.0} and every kappa SEMBIN
        records, apply BR-1 to every FIPS, Certicom and Oakley degree. Report
        per curve the time-only margins against the naive column (diagnostic),
        the corrected column, rho_ub where used, the imported coherent margin
        per storage reading, delta(c), and the class LIVE, DEAD or UNRESOLVED
        with the clause of BR-1 that decided it. Also report C_I at each degree
        under the ceiled k reading (C-CEIL), non-gating.
    - stage: 6
      name: the surface and D* (only if G1, G2, G3 and G4 have passed)
      steps: >-
        For c in {K-571, B-571}, R in {R-B, R-M} (R-M only if F3 passed),
        omega in {2.376, 2.807, 3.0} and, in a separate flagged block,
        omega = 2.0, and every integer D in 2..64: C_R, mu_R, and every
        memory column beside it. D*_R(c, omega) per the definition, with mu at
        D* - 1 and D*. The same surface for K-283 and B-283 as a nearby-object
        record. Classify the outcome (success_criterion.outcome_classes).
        Run C-IND and require agreement before writing any table.
    - stage: 7
      name: proposal-figure recomputation (C5)
      steps: >-
        Recompute every entry of the design audit's proposal_figure_register
        under reading R-I, against both the naive column the proposal used and
        the corrected column, and report each as agree or disagree with the
        proposal's stated value. Every figure in this stage is labelled
        "illustrative, unreconciled, R-I; not a result about any cell".
    - stage: 8
      name: report
      steps: >-
        raw-result.json, gates.json, RESULTS.md from output_templates only,
        manifest and digests. RESULTS.md states no sentence about the 571 cell
        other than the templated D* sentence.
  stage_order_enforcement: >-
    The D* function asserts on entry that gates.json exists and records G1, G2,
    G3 and G4 as passed, and raises otherwise; raw-result.json writes the gates
    block before the surface block. A run whose artifacts show a D* table with
    any gate not passed is invalid (invalidation rule V-6).

  # ---------------------------------------------------------------------------
  controls:
    - id: C-REPRO
      what: fixture F1 at 571 and 283 (frozen_c2_fixture)
      pass_criterion: see frozen_c2_fixture.pass_rule
      gating: G2
    - id: C-IDENT
      what: F2, R-B and R-M equal to the instrument at D = 4 at every omega on the grid
      pass_criterion: absolute difference <= 1e-9 bit in every cell
      gating: G3
    - id: C-INT
      what: F3, the numerical check of lemma L-INT at D = 4 (571 and 283)
      pass_criterion: >-
        illustrative value + M1 + M2 + omega M3(4) + M4 equals C_I(n, omega) to
        1e-9 bit, with M2 computed as log2 m! + (n - m k) + the eq. (11)
        correction, independently of the instrument's A
      gating: >-
        Not a gate for D*. Failure withdraws reading R-M and every Stage-7
        figure; D* is then read in R-B alone.
    - id: C-ARG
      what: argmin invariance of lemma L-ARG across the whole surface grid
      pass_criterion: m* = 12 at 571 and m* = 9 at 283 in every cell
      gating: G3 (a failure is an implementation defect)
    - id: C-RHOCONV
      what: >-
        Convention sanity check at ECC2K-130. With l from Bailey line 1096,
        k = 131 and h = 4, compute rho = 0.5 log2(pi l/(4 * 131)) and add
        log2(1.069993); compare with Bailey's printed 2^60.9 (line 166).
      pass_criterion: absolute difference <= 0.05 bit (the print precision of 60.9)
      why: >-
        Bailey's expression is sqrt(pi l/(2 * 2 * 131)) times a walk factor,
        which is the corrected convention at k = 131. The superseded
        sqrt(2k) convention is 0.5 bit off and fails this check by an order of
        magnitude.
      gating: G1
    - id: C-PARAM
      what: Stage-0 parameter checks (FIPS decimal equals SEC 2 hex, h agreement, bit length, Hasse interval)
      pass_criterion: every check true for every FIPS curve
      gating: G1
    - id: C-PTM
      what: the 283 proves-too-much control and PTM-B at 163, 233 and 131 (Stage 4)
      pass_criterion: every margin positive at D = 4, omega = 3
      gating: G4
    - id: C-IND
      what: >-
        An independently written routine that imports neither
        joint_balance.py nor the primary surface module recomputes A(n, m*)
        from exact integers (math.factorial, math.comb, fractions where
        needed), every C_B and C_M cell, every rho, every margin and every
        D*.
      pass_criterion: agreement <= 1e-6 bit on every cell and exact on every D* and every class label
      gating: required before any table is written
    - id: C-CEIL
      what: C_I at every claim-(A) degree under k_reading "ceiled", with its argmin
      pass_criterion: diagnostic, never gating; reported because Section 4.5.2 defines k = ceil(n/m) while Table 3 reproduces only from n/m
    - id: C-STAGE
      what: the total-cost convention (stage 1 plus stage 2 by log2_add) at D = 4 and at every D*, beside the stage-1 figure
      pass_criterion: diagnostic
    - id: C-XDEG
      what: >-
        Cross-check against the program's earlier degree sensitivity. At
        n = 409, omega = 3, compute C_B(409, 5, 3) - C_B(409, 4, 3) and
        C_M(409, 5, 3) - C_M(409, 4, 3), and set them beside COST-SEMBIN-8d123b's
        recorded degree-5 row as H-SEMBIN-97ea23 quotes it (+19.4 bits at
        n = 409), stating that record's metric.
      pass_criterion: >-
        Diagnostic. Reports which D-extension, if either, the earlier record
        used. It changes no gate and no prediction.
    - id: C-BR1
      what: baseline-rule audit
      pass_criterion: >-
        The code path that assigns LIVE reads no time-only column; verified
        by the validator from the code and by a unit test that sets every
        coherent margin to a missing value and confirms no degree becomes LIVE

  independent_variables:
    - D, integers 2..64 (grid variable; never an input read from data)
    - omega, in-domain {2.376, 2.807, 3.0}; out-of-domain {2.0} flagged
    - reading, R-B (primary) and R-M (secondary)
    - curve, K-571 and B-571 for the surface; K-283 and B-283 as nearby objects
    - degree, every FIPS, Certicom and Oakley degree, for claim (A) at D = 4

  metrics:
    primary:
      - D*_R(c, omega) for c in {K-571, B-571}, R in {R-B, R-M}, omega in-domain, with mu at D* - 1 and D*
      - the claim-(A) count under BR-1 at D = 4, omega = 3, kappa = 1, with every row's class and deciding clause
      - F1 value and argmin; F2 and F3 residuals; G1 to G4 outcomes
    secondary:
      - the full surface C_R and mu_R over the grid, with MR_B, MR_M, MR_C8, dense entries and relation store beside every time figure
      - the spread D*_M - D*_B per curve and omega
      - the out-of-domain omega = 2.0 block, flagged
      - claim (A) at omega = 2.376 and 2.807 and at every recorded kappa
      - C-CEIL, C-STAGE and C-XDEG diagnostics
      - Stage-7 proposal-figure recomputation with agree or disagree per figure

  heuristic_under_test: >-
    H1, at D = 4 only (instrument consistency through F1 and F2, proves-too-much
    through G4). H1's shape off D = 4 is not tested here; it is carried as the
    R-B/R-M bracket. H2 is not used. H3 and H4 are inherited; H4's convention is
    checked by C-RHOCONV.

  preregistered_prediction:
    quantity: >-
      (P-C) D*_R(c, omega) in the twelve in-domain cells; (P-A) the BR-1 LIVE
      set at D = 4, omega = 3, kappa = 1.
    formula: >-
      P-C: 12 <= D* <= 20 in all twelve cells. P-A: LIVE set = {571}, every
      other degree DEAD, none UNRESOLVED.
    source: >-
      IDEA-20260922-7d6d43 claims (A) and (C), whose band "D* ~ 12 to 20" is
      copied verbatim and not widened. Its session figures are NOT a source;
      they are recomputed in Stage 7.
    frozen_before_execution: true

  scale_relevance:
    tier: crypto
    justification: >-
      The parameters are the cryptographic-size labels n = 571 and 283 (and
      the claim-(A) degrees) inside a cost formula. Nothing is instantiated or
      measured at any size, so the tier describes parameter labels only.
      Transfer to any real solving computation is H1, which is validated here
      at D = 4 only; transfer to the true solving degree is H2 and Part 3.
    correspondence: null

  tail_checks:
    - margin at D* - 1 and at D* for every cell, so a crossing decided by a fraction of a bit is visible
    - the m* runner-up gap at 571 and 283 (the design audit records 0.040 bit to m = 13 at 571), invariant in D by L-ARG
    - C-CEIL and C-STAGE at the fixture point and at every D*
    - the out-of-domain omega = 2.0 block, never pooled with the in-domain cells

  replication:
    seeds: []
    seeds_note: Deterministic closed-form arithmetic; there is no randomness to seed.
    independent_instances: 2
    independent_instances_note: >-
      Two implementations that share no code (C-IND): the primary path, which
      loads the frozen instrument, and an exact-integer routine that loads
      neither. Agreement is required before any table is written.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.25
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_runs_note: >-
      One derivation run. A second run is admissible only after an
      infrastructure failure, with the first run's artifacts retained.
    maximum_workers: 1

  stopping_rules:
    - S-1 stop at the first failed gate among G1 to G4; write gates.json and the stages completed; compute no D*
    - S-2 stop if the instrument hash differs from sha256_expected; nothing is computed
    - S-3 stop if C-IND disagrees; no table is written; report both values
    - S-4 an infrastructure failure (crash, timeout, missing file) stops the run and is reported as failed_infrastructure, never as a result
    - S-5 no stage may be re-run with a changed tolerance, grid, reading or omega; any change is a protocol_amendment filed before a new run

  invalidation_rules:
    - V-1 instrument sha256 mismatch, or any edit, copy or re-implementation of joint_balance.py inside the primary path
    - V-2 any D value read from a file, argument or record (IR-1), or any column labelled only "degree"
    - V-3 r, h or coefficients taken from anything but the declared primary inputs, or a recalled value (IR-3)
    - V-4 a tolerance, grid, reading, omega set or prediction band changed after any evaluation
    - V-5 a SEMBIN margin imported without the SN-1 check, or a time-only column used to make a degree LIVE
    - V-6 a D* table present while gates.json records any of G1 to G4 as not passed, or a D* computed in any stage before 6
    - V-7 an R-I (illustrative) figure presented as a D* or as a result about any cell
    - V-8 any sentence in RESULTS.md about the 571 cell outside output_templates

  # ---------------------------------------------------------------------------
  success_criterion:
    protocol_success: >-
      The run is VALID iff S-2 and S-3 did not fire, G1 to G4 passed, C-IND
      agreed, and every required artifact exists. A valid run succeeds equally
      under every outcome class below; there is no outcome this contract is
      trying to reach.
    outcome_classes:
      basis: >-
        D*_lo and D*_hi are the minimum and maximum of D* over the twelve
        in-domain cells, "no crossing at D <= 64" counting as above 64.
      K1_near: D*_lo <= 11. P-C FALSIFIED (cliff nearer than the proposal's band).
      K2_teens: 12 <= D*_lo and D*_hi <= 20. P-C CONFIRMED in scope.
      K2x_straddle: 12 <= D*_lo <= 20 < D*_hi. P-C FALSIFIED (not robust across cells).
      K3_far: D*_lo >= 21 and every cell crosses at D <= 64. P-C FALSIFIED.
      K4_beyond: D*_lo >= 21 and at least one cell has no crossing at D <= 64. P-C FALSIFIED (the proposal's D* in the hundreds branch).
      A_confirmed: BR-1 LIVE set = {571}, no UNRESOLVED. P-A CONFIRMED in scope.
      A_second: a degree other than 571 LIVE. P-A FALSIFIED.
      A_dead571: 571 DEAD. P-A FALSIFIED.
      A_unresolved: no falsifying row and at least one UNRESOLVED. P-A NOT ESTABLISHED.
    decision_mapping: >-
      Per DEC-20260924-99ce20 S1 decision_it_changes. K1, K2 and K2x: the
      threshold lies within reach of plausible solving degrees, and Part 3 is
      pointed to GOAL-SEMBIN-fcb7a2 as the deciding measurement for the 571
      cell, with the interval [D*_B, D*_M] per omega as the threshold. K4: the
      cell stays conditional and Part 3 is not prioritised on its account.
      K3: the threshold is supplied to GOAL-SEMBIN-fcb7a2 without a priority
      claim, and the evidence review states which way it reads. Any class:
      the reachability table records the 571 cell as a conditional computed
      cost with the D* interval, never as an unqualified point estimate.
    negative_outcomes_exist: >-
      Yes. K1, K2x, K3, K4, A_second and A_dead571 each falsify part of the
      hypothesis in scope.

  falsification_criterion: >-
    H-NISTBIN-dec5e1 claim (C) is falsified in scope by any of K1, K2x, K3 or
    K4; claim (A) by A_second or A_dead571. The hypothesis is VOID, not
    falsified, when the run is invalid or G1, G2 or G4 fails. A failure of
    F3 withdraws R-M and the illustrative figures and does not falsify
    anything.

  routing:
    tier: review-breakthrough at max, non-degradable
    rules:
      - RT-0 the evidence review of every valid run of this experiment is at review-breakthrough at max, whatever the outcome class (tripwire T1 of DEC-20260924-99ce20)
      - RT-1 any output, sentence or reading that reads as E1 (index calculus below rho at 571 at the true solving degree) goes to its own review-breakthrough round at max
      - RT-2 any output, sentence or reading that reads as E2 (the 571 cell closed) goes to its own review-breakthrough round at max
      - RT-3 any verdict on the 571 cell beyond D*(omega) in the reconciled model assuming H1 goes to its own review-breakthrough round at max
      - RT-4 any degree other than 571 LIVE under BR-1, or with a non-positive corrected time-only margin at any omega including 2.0, goes to its own review-breakthrough round at max
      - RT-5 A_dead571 goes to its own review-breakthrough round at max
      - RT-6 if review-breakthrough at max cannot be served, the result stays un-promoted and the impediment is recorded on the active goal; the tier is never lowered and no review-adversarial session substitutes
    note: >-
      This contract has no input from which the true solving degree could be
      read, so E1 and E2 cannot be outputs of a valid run. RT-1 and RT-2 exist
      to catch wording.

  output_templates:
    d_star_sentence: >-
      In the reconciled block_n4w model at extension degree 571 (readings R-B
      and R-M, which coincide with the frozen EXP-SEMBIN-81dc96 instrument at
      D = 4), assuming H1, H3 and H4, the time-only cost first exceeds the
      corrected matched-rho figure of {curve} ({rho} bits) at D*_B = {x} and
      D*_M = {y} for omega = {w}, where D is a grid variable standing for a
      hypothetical solving degree. At D*_B the model's Macaulay matrix has
      2^{MR_B} rows under R-B and at D*_M 2^{MR_M} rows under R-M. This is a
      property of the cost model. It states nothing about the true solving
      degree of any system and nothing about the security of any curve.
    claim_a_sentence: >-
      Under baseline rule BR-1 at D = 4, omega = {w}, kappa = {kappa}, the
      LIVE set of the frozen cost model is {set}, with {u} degrees UNRESOLVED.
      This is a count at one parameter point of a cost model under
      Assumption 1's degree and is not a verdict on any cell.
    forbidden: >-
      Any sentence using "break", "weak", "vulnerable", "safe", "secure",
      "attack succeeds", "opens" or "closes" about any curve or cell.

  required_artifacts:
    - experiments/EXP-NISTBIN-451dfa/code/surface.py (primary path; loads the frozen instrument read-only)
    - experiments/EXP-NISTBIN-451dfa/code/independent_arith.py (C-IND; imports neither joint_balance.py nor surface.py)
    - experiments/EXP-NISTBIN-451dfa/code/test_rules.py (IR-1 refusal test, C-BR1 unit test, stage-order assertion test)
    - experiments/EXP-NISTBIN-451dfa/runs/RUN-*/gates.json (G1 to G4, F1 to F3, C-RHOCONV, C-PARAM, SN-1, written before any surface)
    - experiments/EXP-NISTBIN-451dfa/runs/RUN-*/raw-result.json (every table in definitions order, gates block first)
    - experiments/EXP-NISTBIN-451dfa/runs/RUN-*/independent-arithmetic.json
    - experiments/EXP-NISTBIN-451dfa/runs/RUN-*/manifest.yaml (command, git commit and dirty state, environment, input sha256 list, requested_policy, resolved model, fallback_used)
    - experiments/EXP-NISTBIN-451dfa/runs/RUN-*/stdout.log and stderr.log
    - experiments/EXP-NISTBIN-451dfa/runs/RUN-*/artifact-digests.json
    - experiments/EXP-NISTBIN-451dfa/RESULTS.md (from output_templates only)

  interpretation_limits:
    - >-
      Every number is modelled. D* is a property of Semaev 2015's cost model as
      frozen in EXP-SEMBIN-81dc96 and extended in D by R-B and R-M. It is not
      a measurement of any system and not a statement about any curve.
    - >-
      H1 is validated here only at D = 4. Its shape in D is bracketed by two
      readings, not validated. H1 includes Semaev's own conjecture that the
      block-structured estimate with block size n applies to system (5).
    - >-
      Optimistic for index calculus, each flagged: omega down to 2.376 assumes
      fast matrix multiplication on the Macaulay matrix; row weight, block
      count and the operation-unit conversion kappa are not charged (M5, M6
      and kappa in the audit sheet); eq. (11) yield is taken as realised (H3).
      Optimistic for rho: per-iteration cost and distinguished-point memory
      are not charged (H4, kappa = 1). The omega = 2.0 block is outside
      Semaev's stated domain and enters no prediction.
    - >-
      The index-calculus side is n-level and charges no Frobenius saving, so
      K-571 and B-571 differ only through their rho figure.
    - >-
      Time-only. The memory figure sits beside every time figure but is not
      charged. A memory-charged crossing degree is no later than the time-only
      D* when the index-calculus working set is at least 6n bits (L-MONO).
    - >-
      Claim (A) is a count at D = 4 and one omega. Its coherent reading is
      SEMBIN's, cited, and inherits H-SEMBIN-97ea23's caveats (degree 4
      unmeasured; HEUR-VOW-CURVE unread at source).
    - >-
      Oakley degrees are composite and admit subfield methods (GHS and
      others) that this model does not price. A DEAD Oakley row says only that
      Semaev's model loses there.
    - >-
      Nothing here is a statement about the security of any curve, standard
      or deployed system, in either direction.

  proof_search_map:
    location: >-
      The five KN-TECH-080 audits, the lemmas L-ARG, L-EXT, L-INT, L-MON,
      L-SPREAD, L-UB, L-MONO and L-ASM, and the frozen C2 fixture are in the
      design audit sheet named under design_audit. Summary follows.
    bottleneck: the degree bound 4 in the per-solve cost n^(4 omega), replaced by the axis D
    baseline_embedding: D = 4, omega = 3 reproduces the frozen 571 row (F1), and both readings equal the instrument there (F2)
    observation_collision: >-
      R-B and R-M coincide at D = 4 and diverge off it, so D* is an interval;
      a fake d'_F as D is excluded by IR-1
    quantifier_order: >-
      for each curve, reading and omega, D* is the least grid D with positive
      margin; nothing is quantified over the true solving degree
    method_ceiling: D*(omega) in the reconciled model, assuming H1
    nearby_object_control: the 283 control and PTM-B at 163, 233 and 131 (G4)
    strictness_and_interfaces: >-
      No strict improvement is claimed. Interfaces I1 to I6 each have a lemma
      or a rule (audit sheet, audit A5).

  # ---------------------------------------------------------------------------
  approval:
    approved_by: null
    approving_decision: DEC-20260924-124667
    rule: >-
      This contract is approved if and only if DEC-20260924-124667 is official
      (its ledger archive TASK-20260924-499d57 verified by
      tools/research_dispatch.py) with decision approve naming
      EXP-NISTBIN-451dfa. In every other case it is not approved, whatever any
      message says.
    basis_if_approved: >-
      AGENTS.md "Standing user authorization for ideas and experiments"
      (2026-09-06). Approval would assert nothing about the hypothesis, the
      571 cell, the true solving degree or any curve.
    status_advance: >-
      The status fields of this specification and of H-NISTBIN-dec5e1 are
      advanced by the first card of the successor execution batch, which
      declares these paths (DEC-20260924-f0a9c7 R4). This file is not edited to
      record approval.
  assigned_to: executor
  approved_by: null
  owner: coordinator
  created_at: '2026-09-24'
  runs_launched_by_design: 0
