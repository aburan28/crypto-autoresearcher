        version: 3
        defect: D-7 (DEC-20260924-124667; J5 Q0-01 under K-indeterminate, C2); disclosure extended under RD-3 and RD-8 (DEC-20260925-41f6dc)
        choice: >-
          The k-rounding reading of Semaev 2015's model is k = n/m (unceiled),
          the reading of the frozen instrument (Model field k_reading
          "unceiled") and of the fixture.
        textual_basis: >-
          The paper defines k = ceil(n/m) and evaluates its Section 4.5.2
          optimisation at k = n/m (DEC-20260924-124667 D-7, which transcribes
          inputs/SEMAEV-2015-310/paper_fulltext.md Section 4.5.2; that text is
          in the v1 read attestation, lines 1055-1124, and was not re-read by
          this session). The published text therefore does not determine the
          reading; MI-1 is a choice, not a transcription.
        direction: >-
          VERSION 3 (RD-8). The ceiled reading LOWERS the stage-1 cost. At
          every claim-(A) degree the minimum over m of the ceiled stage-1 cost
          lies below the MI-1 minimum (audit sheet CB-2 output kreading_table,
          all fifteen degrees), and at n = 571 the ceiled A(571, m) lies below
          the MI-1 A(571, m) at 29 of the 29 grid values of m (CB-2 output
          A_571_summary; design figures, allowed session computation C-4). This is the sense of Semaev's "at most":
          his evaluation at k = n/m is stated as an upper bound ("at most m!
          2^(n/m) n^12" at omega = 3; DEC-20260924-124667 D-7 and the BATCH-b67954
          validator's reading of paper lines 1080-1091, attributed) on the
          stage-1 cost his paper defines with k = ceil(n/m).
        disclosed_consequence: >-
          VERSION 3 (RD-3, RD-8). Design figures, CB-2 output kreading_table
          (allowed session computation C-4; this producer's own figures, newly
          frozen as NF-05 and NF-06 of the revision worksheet), omega = 3,
          D = 4, stage 1, t = m, minimised over m in 2..30. AT n = 571 the
          ceiled reading moves C_I from 186.3070 (m* = 12) to 175.1383
          (m* = 15), 11.1686 bits LOWER, with memory beside both: Macaulay
          rows 2^36.63 (R-B form) or 2^32.04 (R-M form) under either reading
          (the block_n4w rows depend on neither m nor k), and the relation
          store moving from 2^47.58 to 2^39. AT THE 283 PASS-RULE TARGET it
          moves C_I from 147.6495 (m* = 9) to 141.5270 (m* = 10), 6.1225 bits
          LOWER, Macaulay rows 2^32.58 or 2^27.98 unchanged, relation store
          from 2^31.44 to 2^29. AT n = 359 it moves C_I from 159.5451
          (m* = 10) to 156.1046 (m* = 11), 3.4406 bits LOWER, Macaulay rows
          2^33.95 or 2^29.36 unchanged, relation store from 2^35.90 to 2^33.
          The move at each of the other twelve claim-(A) degrees, with its
          memory, is in the same table (every move is downward, 3.4406 to
          11.1686 bits over the fifteen degrees). The 571 move agrees with the figure
          DEC-20260924-124667 D-7 and R-J5 record (about 11.2 bits, m* 12 to
          15), and the 283 and 359 moves with the figures DEC-20260925-41f6dc
          R-J9 records from the BATCH-b67954 reviewers (6.12 bits lower, m 9
          to 10; 3.44 bits lower, m 10 to 11); those reviewer figures are
          cited attributed, provenance internal, and are not this producer's
          figures. Hence F1 identifies the frozen instrument's reading rather
          than a model determined by the published text, and every MI-1
          stage-1 cost at D = 4 lies above its ceiled counterpart.
        carried_into: >-
          VERSION 3 (N-J3-2, N-J3-3). H1 (H-NISTBIN-dec5e1 version_3), the
          per-m threshold D*(m) (d_star_of_m, which evaluates A(n, m) under
          MI-1 and reports the ceiled column C-CEIL-T beside it), the
          claim-(A) ceiled diagnostic C-CEIL-A, the ceiled values at the
          fixture point and at every D* (C-CEIL-D), and both output templates
          that state a D* or a threshold, each of which names MI-1 and
          C-CEIL-T in its own text.
        bias_of_the_handed_table: >-
          VERSION 3 (O-J4-1, RD-8). Because the ceiled A(571, m) is below the
          MI-1 A(571, m) at every m in the M-SET (direction above), the ceiled
          margin is below the MI-1 margin at every (D, m), so every entry
          D*_R(c, 3.0, m) of the MI-1 threshold table is NO LATER than the
          C-CEIL-T entry at the same m: the handed MI-1 table is biased toward
          EARLIER thresholds. Wherever the threshold is handed on, the
          C-CEIL-T column travels beside it with this sentence; the MI-1 table
          remains the only scored and gated reading.
    what_the_run_adds:
      version: 3
      defect: D-10 (DEC-20260924-124667; red team X-2); item (3) extended under RD-1 and item (4) restated under N-J3-4
      statement: >-
        Once F1 passes, P-C's outcome class is fixed by closed forms: under R-B,
        D*_B is the least D with A(571, 12) + D omega log2 571 > rho(c), and
        R-M is equally explicit. The run adds no information about P-C's class
        beyond those closed forms. What it adds is: (1) execution of the frozen
        instrument through the declared call path under custody (F1, F2, C-ARG),
        which hand arithmetic cannot certify; (2) an independent exact-integer
        implementation (C-IND) that must agree before any table is written;
        (3) claim (A), which needs primary-input reads of r and h at every row
        (including the four version-2 Certicom rows), the committed coverage
        check CB-1 run against the primary input (VERSION 3, RD-1), and
        imported coherent margins under the pinned slice, none of which is a
        closed form; (4) the per-m threshold table D*(m) over m with the
        C-CEIL-T column and memory beside every time figure, which is ITSELF a
        tabulation of closed forms (D*real_B(c, omega, m) = (rho(c) -
        A(571, m)) / (omega log2 571)) and so adds output in machine-checkable
        form, not information beyond the closed forms (VERSION 3, N-J3-4); and
        (5) machine-checkable artifacts under a manifest. Its value is
        verification and custody, not discovery, and no reader may present
        P-C's class as a finding the run produced beyond the closed forms.
    A: >-
      A(n, m) = k - log2 P(n, m, m, k) with P = 1 - exp(-2^(mk-n)/m!), eq. (11).
      Computed by the instrument as
      jb.stage_costs(n, m, m, jb.Model(solve="block_n4w", charge_cofactor=False))[0],
      i.e. stage 1 with the per-solve cost set to zero.
    W: >-
      W(n, D) = jb.log2_macaulay_width(n, D) = log2 of the sum over d = 0..D
      of binom(n, d).
    instrument_value: >-
      C_I(n, omega) = min over m in 2..min(30, n) of
      jb.stage_costs(n, m, m, jb.Model(solve="block_n4w", omega=omega))[0],
      first minimum on ties (strict less-than, ascending m), exactly as
      experiments/EXP-SEMBIN-992e73/code/curve_table.py stage1_only_min does.
      Equal to min over m of A(n, m) + 4 omega log2 n.
    reading_R_B: >-
      C_B(n, D, omega) = min over m of A(n, m) + D omega log2 n. Semaev's
      block-structured per-solve cost n^(4 omega) with the degree bound 4 of
      Assumption 1 replaced by D. PRIMARY reading.
    reading_R_M: >-
      C_M(n, D, omega) = min over m of A(n, m) + omega (W(n, D) - W(n, 4) + 4 log2 n).
      The degree-D Macaulay width of an n-variable block, normalised so that
      C_M(n, 4, omega) = C_I(n, omega) exactly. SECONDARY reading.
    reading_R_I: >-
      Illustrative, UNRECONCILED, the proposal's surface:
      C_Ill(D, omega) = l + omega log2 binom(nvar, D), with t* = m* of the
      instrument, l = ceil(n/t*) and nvar = t* l (571 gives l = 48,
      nvar = 576). At 283 the proposal wrote l ~ 31, nvar ~ 279; both
      l = 32, nvar = 288 and l = 31, nvar = 279 are computed there. Used ONLY
      in Stage 7. Never read for D*.
    rho: >-
      rho(c) = 0.5 log2(pi r / (4 k)) per curve c, r the prime order of the
      base point from the primary input, k the curve's own Frobenius class
      order. k = n for a Koblitz curve defined over F_2 used over F_(2^n);
      k = 1 for a curve not defined over a proper subfield. Where k is not yet
      established, k = 1 is admissible ONLY as an upper bound on rho under
      rule IR-3.
    margin: >-
      mu_R(c, D, omega) = C_R(n, D, omega) - rho(c). POSITIVE MEANS RHO IS
      CHEAPER. Same sign as EXP-SEMBIN-992e73.
    d_star: >-
      D*_R(c, omega) = the least integer D in 2..64 with mu_R(c, D, omega) > 0,
      at the model's optimising m* (12 at 571, 9 at 283; L-ARG). VERSION 2
      (D-4): this is D*_R(c, omega, m*) of d_star_of_m and is stated only
      inside restricted_model. Reported with mu at D* - 1 and at D*. If no D in
      2..64 qualifies, the value is the token "no crossing at D <= 64". A
      crossing at D = 2 is reported as "D* <= 2". VERSION 3 (O-J4-2): the
      value at m* is the SCORED CELL of prediction P-C, never the threshold
      handed on, which is the table of d_star_of_m.
    restricted_model:
      version: 3
      defect: D-4 (DEC-20260924-124667; red team TASK-20260924-e0a065 J3-M5, J3-M7, J3-M8); the M7 direction restated under RD-6 (DEC-20260925-41f6dc)
      option_taken: >-
        The RESTRICTED-MODEL option of D-4, not the envelope option. Every D*
        sentence, the decision mapping and any threshold handed to
        GOAL-SEMBIN-fcb7a2 are stated in "the dense, fixed-omega, block-size-n
        model": stage 1 = A(n, m) + S_R(n, D, omega) with S_R one of R-B and
        R-M, dense linear algebra at one fixed omega at every D, and Semaev's
        block size n at every D. D*_R(c, omega) is that model's threshold at
        its optimising m* = 12. Any threshold handed on is the curve
        D*_R(c, omega, m) over the M-SET (d_star_of_m), never one m.
      outside_the_model: >-
        VERSION 3 (RD-6). M5, row weight and sparsity: the effective
        linear-algebra exponent may fall toward Semaev's XL value 2 as the
        Macaulay matrix sparsifies with D, so for in-domain omega its
        omission places D* too EARLY. M7, the block-size exponent of H1a above
        D = 4: Semaev states block size n at degree 4 only; M7's DIRECTION IS
        CONDITIONAL and is stated only as m7_direction below (an M7 reading
        whose per-solve cost is at least R-B's at the R-B crossing places D*
        no later than R-B, and one whose cost is at most R-B's one degree
        below that crossing places it no earlier). M8, the optimising m under
        H2: when the degree depends on m the threshold is the curve D*(m),
        with D*(m) <= D*(m*) because A(571, m) >= A(571, m*) under MI-1. Each
        is named in the audit sheet's L-INT; none is carried by a reading or
        quantified here.
      m7_direction:
        version: 3
        defect: RD-6 (DEC-20260925-41f6dc; BA-J4-2 of the BATCH-b67954 red team)
        statement: >-
          CONDITIONAL. Let S_7(n, D, omega) be any M7 reading of the
          per-solve cost that is non-decreasing in D and equals S_B(n, D,
          omega) = D omega log2 n for D <= 4, and let D*_7(c, omega, m) be the
          least D in 2..64 with A(571, m) + S_7(571, D, omega) - rho(c) > 0.
          At each (c, m) at which D*_B = D*_B(c, omega, m) is an integer of at
          least 5: (a) IF S_7(571, D*_B, omega) >= S_B(571, D*_B, omega), THEN
          D*_7 <= D*_B (that crossing moves earlier or stays); (b) IF
          S_7(571, D*_B - 1, omega) <= S_B(571, D*_B - 1, omega), THEN
          D*_7 >= D*_B (it moves later or stays). Neither antecedent holds for
          every reading at every degree, so M7's direction is NOT determined
          by this contract. A reading that counts rows as Boolean monomials of
          degree at most D in the Boolean variable count of system (5),
          anchored to R-B at D = 4, grows faster than R-B per degree step only
          up to some degree and more slowly above it; the BATCH-b67954 red
          team (TASK-20260925-8e9c3e, BA-J4-2 and its computation C-02, as
          DEC-20260925-41f6dc RD-6 records it; provenance internal, a
          reviewer figure and not this producer's) reports that at 571,
          m = 12 it moves D* LATER than R-B for crossings at D >= 19. No
          sentence of this contract states a one-way direction for M7, and no
          M7 range endpoint is frozen.
        proof: >-
          S_7 is non-decreasing in D. (a) A(571, m) + S_7(D*_B) >= A(571, m) +
          S_B(D*_B) > rho(c), so the least D with a positive M7 margin is at
          most D*_B. (b) For every D <= D*_B - 1, S_7(D) <= S_7(D*_B - 1) <=
          S_B(D*_B - 1), and A(571, m) + S_B(D*_B - 1) <= rho(c) by the
          minimality of D*_B, so no D <= D*_B - 1 has a positive M7 margin.
      why_not_the_envelope: >-
        The envelope option needs further degree-extension readings (the red
        team's S_sp and S_hyb, "or better"), none stated in the published text.
        The envelope's width would then be set by which extensions are
        admitted, and "or better" has no closure, so it would bound the chosen
        readings rather than the model uncertainty: the defect J3 found in
        [D*_B, D*_M]. The restriction states one model, names what lies
        outside it, and keeps every D* a closed form that the blind
        re-derivation can reproduce under pinned readings.
    d_star_of_m:
      version: 3
      defect: D-4 and D-7 (card PA-6); the ceiled column named C-CEIL-T and handed beside under N-J3-3, O-J4-1 and RD-8
      m_set: every integer m in 2..30 (the frozen instrument's m grid)
      omega_set: '{3.0}, the only scored omega (D-6); no other omega enters this definition'
      readings: '[R-B, R-M], as written out in reading_R_B and reading_R_M'
      definition: >-
        For c in {K-571, B-571}, R in {R-B, R-M}, omega = 3.0 and each m in the
        M-SET: C_R(571, D, omega; m) = A(571, m) + S_R(571, D, omega), with
        A(571, m) under MI-1 (k = 571/m unceiled) and no minimisation over m.
        D*_R(c, omega, m) = the least integer D in 2..64 with
        C_R(571, D, omega; m) - rho(c) > 0, with the same tokens as d_star.
        Under R-B the margin is linear in D, and D*real_B(c, omega, m) =
        (rho(c) - A(571, m)) / (omega log2 571) is reported to 0.01 beside the
        integer value; R-M is defined at integer D only and has no real form.
        At m = m* the value is D*_R(c, omega).
      memory_beside: >-
        Beside every D*_R(c, omega, m): relation store 571/m (log2 count),
        Macaulay rows MR_B = D log2 571 and MR_M = W(571, D) at D* - 1 and D*,
        and dense entries twice those. Modelled, not measured.
      ceiled_column: >-
        VERSION 3 (N-J3-3, O-J4-1, RD-8). Column C-CEIL-T: beside each m, the
        same D*_R(c, omega, m) and D*real_B with A(571, m) under the ceiled
        reading k = ceil(571/m), with its relation store ceil(571/m) beside
        it. Non-gating and never scored. It IS handed on beside the MI-1
        table, with the sentence of MI-1.bias_of_the_handed_table, so that
        the MI-1 choice and its direction are visible at every m and a later
        reader can compare a measured degree at one k reading (IR-2).
      correspondence_note: >-
        Where the D = 4 margin is negative and no margin is exactly zero, the
        least integer D >= 4 with C_R >= rho(c) equals D*_R(c, omega, m); where
        the D = 4 margin is already positive it is 4, while D*_R reports the
        least D in 2..64. R-B is Semaev's block-size-n estimate with 4 replaced
        by D; R-M is specific to this contract and written out in reading_R_M.
      frozen_values: >-
        NONE. Version 3, like version 2, freezes no D*(m) value, no D* value
        and no C-CEIL-T value; every D* is computed only in Stage 6, after the
        gates. The two degree extensions R-B and R-M, not stated in the
        published text beyond degree 4, are written out in full in
        reading_R_B and reading_R_M.
    e1_e2:
      version: 3
      defect: D-8 S-13 (DEC-20260924-124667); E2 reconciled with H1's one-step tolerance under RD-5 (DEC-20260925-41f6dc)
      E1: >-
        Routing label, never an output of this contract: there EXISTS an m in
        the M-SET at which the true solving degree of the m-shape descended
        system at n = 571 (Semaev's d_F4 convention, IR-2) is below
        D*_R(c, omega, m) in the restricted model, under its numbered readings,
        assuming H1 and H5 (and H2, and H6 wherever a first fall degree is
        used; heuristic labels of H-NISTBIN-dec5e1 version_2).
      E2: >-
        VERSION 3 (RD-5). Routing label, never an output of this contract
        ("the 571 cell closed"): for EVERY m in the M-SET and under BOTH
        readings, the true solving degree D_true(m) at that m is AT LEAST
        D*_R(c, omega, m) + 1, in the restricted model, under its numbered
        readings, assuming H1 and H5 (and H2, and H6 wherever a first fall
        degree is used) TOGETHER WITH a lower edge on the per-solve cost at
        D_true(m), namely S at least S_R(571, D_true(m) - 1, omega), which H1
        (H-NISTBIN-dec5e1 version_3) does NOT assert and no record of this
        program states. RECONCILIATION WITH THE ONE-STEP TOLERANCE: with a
        per-solve cost no lower than the reading one degree step below the
        true degree, the least true degree at which the model margin is
        positive is D*_R + 1, not D*_R; hence the "+ 1". Because H1 version 3
        has no lower edge, E2 cannot be reached on this contract's account
        under H1 alone. A sentence that asserts closure from a true degree
        equal to D*_R(c, omega, m), at one m, under one reading, or without
        the named lower edge still READS AS E2 for routing (RT-2) and is also
        caught by RT-3. A comparison at one m, or under one reading, is
        neither E1 nor E2 as a conclusion.
    plausible_solving_degree:
      version: 2
      defect: D-8 S-10
      definition: >-
        An integer D with 4 <= D <= 20: from Assumption 1's d_F4 = 4 (the
        fixture degree) to the upper edge of the proposal's P-C band. A label
        for the decision mapping only; no solving degree of the m = 12 system
        has been measured (IR-1), so it asserts nothing about one.
    memory_columns: >-
      Beside every time figure: MR_B = D log2 n (Macaulay rows, R-B form);
      MR_M = W(n, D) (Macaulay rows, R-M form); MR_C8 = log2 binom(nvar, D)
      with nvar as in reading_R_I (the formula of DEC-20260924-99ce20 C8);
      dense entries 2 MR_B and 2 MR_M; relation store k* = n/m* (log2 count of
      relations, D- and omega-independent). Memory is modelled, not measured.
      VERSION 3 (RD-2). Beside a time figure of the instrument's macaulay4
      reading: MR_MAC = W(N5, D), with N5 = int(round(t k + max(t - 2, 0) n))
      the Boolean variable count of system (5) at chain length t as the
      frozen instrument computes it (joint_balance.py log2_solve_cost, read as
      text, never executed); beside a time figure of its f4_std reading:
      MR_F4 = D log2(n (t - 1)), the power form of that reading's per-solve
      cost, with the monomial form W(n (t - 1), D) beside it; dense entries
      twice each. Every memory figure is evaluated at its own time figure's
      (n, m, t, D, k reading, convention); a joint-convention figure sits at
      its own argmin, not at the block_n4w argmin.
    coherent_shift: >-
      delta(c) = 0.5 (n - log2 r) + 0.5 log2 k + (log2 0.886 - 0.5 log2(pi/4)).
      The amount by which the corrected column lies below the vOW total-work
      column W = 0.886 * 2^(n/2) that H-SEMBIN-97ea23 charges. Applied as a
      closed-form offset to recorded coherent margins; nothing is recomputed.

  input_rules:
    - id: IR-1
      rule: >-
        VERSION 2 (D-8 FD-IR1). NO RECORDED DEGREE ENTERS THE D AXIS OR ANY
        COST FORMULA. D is an integer grid variable 2..64 and nothing else;
        there is no command-line or configuration input for D, and no value
        read from any file, argument or record is ever assigned to D or used
        as an exponent, multiplier or term of any cost formula. The code opens
        no file under any experiments/*/runs/ directory other than the two
        declared raw-result.json files and the coherent-baseline records.
        Exactly two ROW SELECTORS read a degree-labelled field, and only to
        select a row, never as a value: (RS-1) BR-1's pinned_coherent_row
        selects the degree_bound_variants = 4 slice of the coherent-baseline
        records (H-SEMBIN-97ea23 test_boundary degree_bound_variants [4, 5, 6];
        record paths located by Stage 0); (RS-2) C-XDEG selects
        COST-SEMBIN-8d123b's degree-5 sensitivity row at n = 409 (field located
        by Stage 0 and recorded in gates.json). No field named or labelled as
        a first fall degree, d_F, d'_F or degree of regularity is read at all.
        Every table column is labelled "D (grid variable, hypothetical solving
        degree)", never "degree" alone.
      why: >-
        A fake first fall degree d'_F read as the D that feeds the surface is
        the KN-FIND-936151 error (PTM-D). A correct protocol refuses it by
        rule, not in prose.
    - id: IR-2
      rule: >-
        PER-INSTANCE DISCHARGE REQUIREMENT, binding on any LATER record that
        overlays a degree on this surface, and on nothing in this contract. The
        overlaid value must be the SOLVING degree in SEMAEV'S d_F4 CONVENTION
        (version 2, D-8 FD-CONV): the degree Semaev records as d_F4 for his
        experimental systems (Assumption 1, inputs/SEMAEV-2015-310/paper_fulltext.md
        lines 595-637 as the BATCH-7d29e8 red team TASK-20260924-e0a065 quotes
        them), which is 4 on systems where the degree-4 steps were followed by
        at most three further steps of degree 5, 6 and 7 that end with "No
        pairs to reduce". Those trailing steps do NOT raise the solving
        degree in this convention. The fixture anchors D = 4 to exactly this
        reading, so an overlay in any other convention (for example the
        maximal step degree, which can read up to 3 higher on the same data)
        is inadmissible until converted and the conversion is stated. It is
        not a first fall degree. A first fall degree may be offered only through
        a separately numbered heuristic equating it with the solving degree
        (VERSION 2, D-5 H2-U and D-8 FD-H2: that heuristic is H6 of
        H-NISTBIN-dec5e1 version_2; H2 itself admits no first-fall route).
        A TRUE d_F must state which side each placement of S_fe is on. A FAKE
        d'_F is inadmissible unless, at that instance, the unreduced total
        degree of every product g_i f_i of the realising fake witness is
        recorded and max_i deg(g_i f_i) <= d'_F holds there (the U-4 recovery
        rule of KN-FIND-936151 section 4); even then it yields only
        d_F <= d'_F and is reported as discharged by that bookkeeping, never by
        Lemma 4. Any overlay from toy n to n = 571 is an extrapolation under H2
        (whose n and k arguments version 2 states, D-5 H2-N) and, for the cost
        side, under H5. VERSION 3 (O-J6-2): a U-4 recovery record also states,
        for the d_F it bounds, whether the field equations are members of the
        true system (U-3 of KN-FIND-936151 section 4), that is, the true-side
        placement of S_fe, so that a reader knows which true degree is
        bounded; this is a disclosure under the finding's own exported rule
        ("state which SIDE a placement is on, every time") and adds no
        condition to its boxed recovery rule. VERSION 3 (O-J4-3): an overlaid
        degree measured on a system whose factor base has integer dimension
        k = ceil(n/m) is compared with the C-CEIL-T entry at the same m (one k
        reading at the comparison), with the MI-1 entry and the sentence of
        MI-1.bias_of_the_handed_table beside it (H2, H-NISTBIN-dec5e1
        version_3).
      why: >-
        C4. Written after reading KN-FIND-936151, EV-SEMBIN-1ca3c8,
        H-SEMBIN-97ea23 and EXP-SEMBIN-992e73 RESULTS at source.
    - id: IR-3
      rule: >-
        r, h and the curve coefficients come only from the primary inputs
        named above. Where a row's r is not frozen in them, rho is replaced by
        the upper bound rho_ub = 0.5 log2(pi (2^n + 1 + 2^(n/2 + 1)) / 8)
        (h >= 2, k = 1); a positive margin against rho_ub assigns the class
        MODEL-CLASS-RHO by lemma L-UB, and a non-positive one leaves the row
        UNRESOLVED. Recalled values are never used.
    - id: SN-1
      rule: >-
        Every margin imported from a SEMBIN record is negated into this
        contract's sign convention. Stage 0 verifies the convention on one
        known pair before any import: COST-SEMBIN-8d123b's time-only margin at
        n = 409 must equal minus EXP-SEMBIN-992e73's margin_vs_vow_bits at 409
        (-37.781) to 0.01 bit. If the check fails or the record cannot be
        located, no SEMBIN margin is imported and every row that needs one is
        UNRESOLVED.
      memory_beside: >-
        VERSION 3 (RD-9). The -37.781 figure is a block_n4w stage-1 time-only
        margin at n = 409, D = 4, omega = 3, m* = t* = 11, under MI-1. Memory
        beside it at that point (CB-2 output fixture_points_MI1, n = 409):
        Macaulay rows 2^34.70 (R-B form), 2^30.11 (R-M form) or 2^30.22 (C8
        form, nvar = 418); dense entries 2^69.41, 2^60.22 or 2^60.45; relation
        store 2^37.18. The figure is used only as a sign check and enters no
        cost formula.

  baseline_rule:
    id: BR-1
    rule: >-
      Claim (A) counts degrees, at D = 4 and a stated omega and kappa. A degree
      n is MODEL-CLASS-IC iff for at least one curve at n the coherent margin,
      imported under SN-1 and shifted to the corrected column (margin +
      delta(c)), is negative under every storage reading SEMBIN records. It is
      MODEL-CLASS-RHO iff for every curve at n either (a) that shifted
      coherent margin is non-negative under every storage reading, or (b) the
      time-only margin against the corrected column (or against rho_ub under
      IR-3) is positive, which implies a coherent loss by lemma L-MONO.
      Otherwise it is UNRESOLVED (including reading-dependent). THE NAIVE
      2^(n/2) COLUMN NEVER ENTERS BR-1, and no time-only reading can make a
      degree MODEL-CLASS-IC.
    class_tokens:
      version: 2
      defect: D-8 S-12 (DEC-20260924-124667 R-X3)
      MODEL-CLASS-IC: >-
        At D = 4, the stated omega and kappa, in the frozen cost model, the
        coherent index-calculus figure lies below the corrected matched-rho
        figure for some curve at the degree under all four storage readings.
        Replaces version 1's LIVE.
      MODEL-CLASS-RHO: >-
        The complementary class under clause (a) or (b). Replaces version 1's
        DEAD.
      UNRESOLVED: the third class, as unresolved_reading defines it.
      rule: >-
        Each token is the class of a degree in a cost model at one parameter
        point and never a cell status. The program's cell-status words are not
        used for it: no output of this contract uses the word "live" or the word
        "decides" (forbidden list in output_templates).
    pinned_coherent_row:
      version: 2
      defect: D-2 (DEC-20260924-124667; J1 O-J1-2 and J4 PTM-C-SLICE)
      rule: >-
        BR-1 imports exactly one coherent slice per (degree, storage reading):
        cofactor 1 (cofactor_grid entry 1); label-unseparated (the n-level row,
        not a curve_labels_separated row); degree bound 4
        (degree_bound_variants entry 4); k reading unceiled_n_over_m_as_in_table3
        (MI-1); omega equal to the omega being scored; kappa as stated in the
        claim-(A) metric (1 for the primary count); metric the coherent
        product-minimum (own_curve_product_minimum), never a time-only column;
        and each of the four named storage readings dense_row_echelon,
        semaev_sparse, rows_times_cols_dense and nonzeros_with_index_sparse
        (names as H-SEMBIN-97ea23 test_boundary lists them). "Every storage
        reading" in BR-1 means exactly these four.
      exact_n_only: >-
        A margin is imported only where the record states it at that exact
        extension degree. A crossover degree, an interpolation between
        recorded degrees or a margin at a neighbouring n is not an import; the
        row is then UNRESOLVED with the missing input named.
    multi_match_rule:
      version: 3
      defect: N-J1-2 (DEC-20260925-41f6dc, non-breaking); additive, the pinned values of pinned_coherent_row unchanged
      rule: >-
        H-SEMBIN-97ea23 test_boundary also carries store_log2_grid,
        processors_log2_grid, memory_budget_log2_grid, budget_readings and
        alpha_grid, which pinned_coherent_row does not name; whether any of
        them indexes the recorded product-minimum margin is not determined by
        H-SEMBIN-97ea23 alone. If, for one (degree, storage reading), MORE THAN
        ONE recorded row satisfies every pinned field, no row is chosen: the
        import for that (degree, storage reading) is refused, the row is
        UNRESOLVED, and every matching row is listed with the field on which
        the matches differ. No minimum, maximum, average, first match or other
        selection is ever made. If exactly one row matches, it is imported. If
        none matches, exact_n_only applies.
    unresolved_reading:
      version: 2
      defect: D-1 (pre-registered UNRESOLVED-row reading)
      rule: >-
        UNRESOLVED means BR-1 cannot classify the row from the declared inputs
        (coherent margin missing at that exact n, coherent sign differing
        across the four storage readings, SN-1 failed, or r or h not settled
        under IR-3 or readings CR-1 to CR-3). An UNRESOLVED row is reported
        as UNRESOLVED with the missing or conflicting input named and its
        diagnostic time-only margins beside it; it is never imputed,
        interpolated or recomputed (no SEMBIN quantity is re-measured), never
        counted as MODEL-CLASS-IC or as MODEL-CLASS-RHO, and it makes P-A NOT
        ESTABLISHED (A_unresolved) when no falsifying row exists. An UNRESOLVED
        row whose diagnostic time-only margin is non-positive at the scored
        omega is listed separately in the claim-(A) table with a pointer to the
        SEMBIN record family whose margin at that exact degree would classify
        it. Every added version-2 row (79, 89 and 359) is read under this rule
        like every other row.
      pre_registered_expectation: >-
        Design expectation, not a result: at 359 the diagnostic time-only
        margin is non-positive at every grid omega (audit sheet WC3; about
        -16.66 bits for ECC2-353 and -15.04 for ECC2K-358 at omega 3, with
        Macaulay rows 2^33.95 under R-B or 2^29.36 under R-M and relation store
        2^35.90 at m* = 10). Whether a coherent-baseline record states a margin
        at exactly n = 359 is not known to this design session, which read only
        H-SEMBIN-97ea23. If none does, 359 is UNRESOLVED and P-A can reach at
        best A_unresolved; that outcome is pre-registered here, before any
        evaluation, and is not a reason to drop the row.
    unresolved_level_pin:
      version: 3
      defect: N-J1-1 (DEC-20260925-41f6dc, non-breaking); additive, no class rule changes
      rule: >-
        A_unresolved, A_confirmed and P-A count DEGREES, as BR-1,
        success_criterion.outcome_classes and P-A's frozen minimum_effect
        state. A row that BR-1 cannot classify makes its DEGREE UNRESOLVED
        only if BR-1 cannot classify the degree: a degree with at least one
        curve MODEL-CLASS-IC is MODEL-CLASS-IC whatever the class of its other
        curves (BR-1), and a degree is MODEL-CLASS-RHO only if every curve at
        it satisfies clause (a) or (b). "No falsifying row" in
        unresolved_reading means no falsifying degree (A_second or A_rho571),
        and "at least one UNRESOLVED" in A_unresolved means at least one
        UNRESOLVED degree. Every UNRESOLVED row is still reported with its
        missing input named, whatever its degree's class.
    why: >-
      PTM-C. Under the time-only column, naive or corrected, 409 sits below
      rho already in EXP-SEMBIN-992e73 (-37.956 against naive, a design
      artifact under DEC-20260918-4b7e21, not a result; at D = 4 the model's
      Macaulay rows at 409 are 2^34.70 in R-B form or 2^30.11 in R-M form,
      design figures in the audit sheet W8.1 and WC8), and the corrected column lies
      only 0.67 to about 5.5 bits below the naive one at 409, so a rule
      admitting any time-only column resurrects 409 as a false second cell.
      Claim (A) rests on the coherent baseline or on nothing.

  # ---------------------------------------------------------------------------
  frozen_c2_fixture:
    canonical_copy: >-
      The design audit's frozen_c2_fixture block. This restatement is
      identical in every number; a discrepancy between the two is a defect to
      be reported, not resolved by the executor.
    model: >-
      experiments/EXP-SEMBIN-81dc96/code/joint_balance.py, sha256
      95a069364e2cacea9de914694fb5cdb1c886929626144edeb8835fced8698f46,
      loaded with importlib.util.spec_from_file_location as module "jb" and
      registered in sys.modules before exec_module (the dataclass needs it),
      as curve_table.py does. Model(solve="block_n4w", charge_cofactor=True)
      with every other field at its frozen default (k_reading "unceiled",
      omega 3.0, omega_prime 2.0, degree 4, yield_law "eq11"). Value =
      C_I(571, 3.0), stage 1 only, t = m, m in 2..30.
    target: >-
      log2 cost 186.307 with m* = 12 and t* = 12 (source and status under
      inputs.fixture_target). Memory beside it (VERSION 3, RD-9 C8 sweep; not
      part of the identification, tolerance or pass rule): Macaulay rows
      2^36.63 (R-B form) or 2^32.04 (R-M form), relation store 2^47.58.
    tolerance: 'absolute 5.0e-4 bit on log2 cost, inclusive; exact on m* and t*'
    tolerance_basis: >-
      Stated before any evaluation. The target is recorded to three decimals,
      so a correct evaluation must round to it; 5.0e-4 is that rounding
      half-width and nothing looser. The instrument is deterministic, so
      nothing else justifies slack.
    pass_rule: >-
      PASS iff |C_I(571, 3.0) - 186.307| <= 5.0e-4 and the argmin is m = 12,
      t = 12. Also required, same rule: C_I(283, 3.0) against 147.649 with
      m* = 9 (RUN-SEMBIN-a7a2f3 row n = 283). Memory beside both targets
      (VERSION 3, RD-9 C8 sweep; not part of the rule): at 571 Macaulay rows
      2^36.63 (R-B form) or 2^32.04 (R-M form) and relation store 2^47.58; at
      283 Macaulay rows 2^32.58 or 2^27.98 and relation store 2^31.44.
    memory_beside_pass_rule_targets: >-
      VERSION 2 (D-3). Beside 186.307 at n = 571: Macaulay rows 2^36.63 (R-B
      form) or 2^32.04 (R-M form), relation store 2^47.58. Beside 147.649 at
      n = 283: Macaulay rows 2^32.58 (R-B form, 4 log2 283) or 2^27.98 (R-M
      form, W(283, 4)), relation store 2^31.44 (k* = 283/9). Design figures
      (audit sheet W4.9, W5.7).
    model_identification: >-
      VERSION 2 (D-7). F1 identifies the frozen instrument's reading, not a
      model determined by the published text: the k-rounding reading is the
      numbered model-identification choice MI-1 (definitions.model_identification_choices),
      and F1 passing establishes only that the call path returns the frozen
      instrument's value under MI-1. VERSION 3 (RD-8): MI-1 is used at BOTH
      pass-rule targets; its consequence at each of them (571 and 283), with
      its direction and the memory beside it, is disclosed in
      MI-1.disclosed_consequence, and F1 is evaluated under MI-1 only.
    gate: >-
      G2. Nothing downstream of Stage 2 is computed unless F1 passes. In
      particular no D* is computed, printed or written before F1, F2, G1 and
      G4 have all passed and gates.json records it.
    margins_at_fixture_point: >-
      Design figures, hand arithmetic in the audit sheet, to be reproduced by
      Stage 6. At D = 4, omega = 3 the model's stage-1 cost 186.3070 (Macaulay
      rows 2^36.63 under R-B, 2^32.04 under R-M; relation store 2^47.58) lies
      93.4401 bits below the corrected K-571 figure 279.7471 and 98.5188 bits
      below the corrected B-571 figure 284.8257. These are the fixture point
      of a model under Assumption 1's degree, NOT a verdict on the 571 cell.

  # ---------------------------------------------------------------------------
  procedure:
    - stage: 0
      name: custody and inputs
      steps: >-
        Hash joint_balance.py and stop unless it equals sha256_expected.
        Record the sha256 of every input file read. COVERAGE CHECK. (a)
        CERTICOM, VERSION 3 (RD-1), control C-COVER: extract code block CB-1
        from the audit sheet by its pinned extraction method
        (code_blocks.extraction_method), write the extracted bytes unchanged
        to experiments/EXP-NISTBIN-451dfa/code/certicom_coverage.py, verify
        that file's sha256 equals CB1_REFERENCE_SHA256 (control C-COVER) and
        stop if it does not (SR-6); import it read-only and call
        certicom_coverage(appendix_text, stage5_certicom_rows) with the full
        unmodified text of inputs/CERTICOM-CHALLENGE-2009/challenge-2009_text.md
        and the Stage-5 Certicom row list as (curve label, m) pairs exactly as
        Stage 5 will use it. CB-1 scans the whole of Appendix A independently
        of certicom_rows, counts binary curves only (ECC2 and ECC2K labels),
        and returns PASS only if it finds exactly the frozen binary-curve count
        at the frozen degree count and the Stage-5 list holds exactly those
        (label, m) pairs, each once. Its verdict, reasons, parsed set, the
        extracted file's sha256 and the Stage-5 list passed to it are written
        to gates.json under G1. (b) FIPS AND OAKLEY (version 2, D-1): build
        the claim-(A) rows of every binary curve of FIPS 186-4 D.1.3 and of
        the two RFC 2409 EC2N groups from those primary inputs themselves and
        compare them, as a set of (degree, curve) pairs, with the Stage-5 row
        list; G1 fails on any row present in a primary input and absent from
        Stage 5, and on any Stage-5 row absent from every primary input.
        Presence of listed rows is not coverage. Read r and h for K-571,
        B-571, K-283, B-283 and every claim-(A) curve from the primary inputs;
        verify each FIPS decimal r equals the SEC 2 hex n as integers and
        each FIPS h equals the SEC 2 h; record bit lengths; verify
        h r lies in the Hasse interval [2^n + 1 - 2^(n/2 + 1), 2^n + 1 + 2^(n/2 + 1)].
        Establish k per curve and say how. Locate the coherent-baseline and
        cross-check records and run the SN-1 sign check.
    - stage: 1
      name: rho column (gate G1)
      steps: >-
        Compute rho(c) for every curve. Run C-RHOCONV. G1 passes iff every
        Stage-0 parameter check passes, C-RHOCONV passes, and (VERSION 3,
        RD-1) C-COVER returns PASS from the CB-1 bytes at CB1_REFERENCE_SHA256
        and the FIPS and Oakley coverage of Stage 0 (b) holds.
    - stage: 2
      name: fixture (gate G2)
      steps: Evaluate frozen_c2_fixture exactly as frozen. Record in gates.json.
    - stage: 3
      name: extension identities and interface lemma (gate G3)
      steps: >-
        F2: for every omega in {2.0, 2.376, 2.807, 3.0} and n in {571, 283},
        |C_B(n, 4, omega) - C_I(n, omega)| <= 1e-9 and
        |C_M(n, 4, omega) - C_I(n, omega)| <= 1e-9. F3: the interface identity
        of lemma L-INT at D = 4 to 1e-9 at 571 (m 12, l 48, nvar 576) and 283
        (m 9, l 32, nvar 288). C-ARG: at every (D, omega, reading) cell of the
        surface grid the argmin over m equals the D = 4 argmin (12 at 571,
        9 at 283). G3 passes iff F2 and C-ARG pass. F3 failing does not fail
        G3; it withdraws R-M and every Stage-7 figure.
    - stage: 4
      name: proves-too-much controls (gate G4)
      steps: >-
        VERSION 2 (D-6). At D = 4, omega = 3, under R-B and R-M (identical
        there by F2), compute the time-only margin against the corrected
        column for K-283, B-283, K-163, B-163, K-233, B-233, ECC2-238 and
        ECC2K-238. Certicom degree 239 replaces version 1's 131 because it is
        the least convenient known-truth Certicom degree (the smallest positive
        design margin among the Certicom rows EXP-SEMBIN-992e73 tabulates:
        +21.51 bits for ECC2-238, +25.46 for ECC2K-238, audit sheet WC3, with
        Macaulay rows 2^31.60 under R-B and relation store 2^26.56 beside them;
        the red team TASK-20260924-e0a065 named 239 as the stronger gate). G4
        passes iff every margin is positive. omega = 3 is the ONLY scored omega
        (P-C is scored there alone), so the control is gated at every omega at
        which D* is scored. At every other grid omega the same margins are
        REPORTED, never gated, and compared with routing.rt4_expectation_table;
        only a sign that differs from that table triggers RT-4. VERSION 3
        (O-J5-2): every G4 margin is evaluated under MI-1 only; the ceiled
        reading never enters G4 (V-11), and its slack is disclosed under
        control C-PTM.
    - stage: 5
      name: claim (A)
      steps: >-
        At D = 4, for omega in {2.376, 2.807, 3.0} and every kappa SEMBIN
        records, apply BR-1 (with, VERSION 3, multi_match_rule and
        unresolved_level_pin) to every row of the Stage-0 coverage-checked row
        set: FIPS {163, 233, 283, 409, 571} (ten curves), every Certicom row
        of inputs.curve_parameters.certicom_rows (fifteen curves at
        {79, 89, 97, 109, 131, 163, 191, 239, 359}) and Oakley {155, 185}:
        fifteen distinct degrees (VERSION 2, D-1). Report per curve the
        time-only margins against the naive column (diagnostic), the corrected
        column, rho_ub where used, the imported coherent margin per storage
        reading, delta(c), the Macaulay rows and relation store beside every
        time figure, and the class MODEL-CLASS-IC, MODEL-CLASS-RHO or
        UNRESOLVED with the clause of BR-1 that assigned it. Also report C_I at
        each degree under the ceiled k reading (C-CEIL-A, VERSION 3 N-J3-3),
        non-gating. VERSION 3 (O-J5-1): the claim-(A) tables at omega 2.376
        and 2.807 are written in separate blocks, each flagged "unscored: no
        working nearby-object control at this omega (D-6)", and enter no
        prediction and no outcome class; P-A and the A outcome classes are
        scored at omega = 3 only.
    - stage: 6
      name: the surface and D* (only if G1, G2, G3 and G4 have passed)
      steps: >-
        For c in {K-571, B-571}, R in {R-B, R-M} (R-M only if F3 passed), the
        SCORED omega 3.0, and every integer D in 2..64: C_R, mu_R, and every
        memory column beside it. D*_R(c, 3.0) per the definition, with mu at
        D* - 1 and D*. Then the threshold table D*_R(c, 3.0, m) for every m in
        the M-SET, with D*real_B, the memory columns and the C-CEIL-T column of
        d_star_of_m (VERSION 2, D-4; VERSION 3 N-J3-3, O-J4-1: with the
        sentence of MI-1.bias_of_the_handed_table at the head of the table).
        In separate UNSCORED blocks, each
        flagged "unscored: no working nearby-object control at this omega
        (D-6)": the same surface and table at omega 2.376 and 2.807, and at
        the out-of-domain omega 2.0. No unscored block enters any prediction,
        outcome class or threshold handed on. The same omega-3 surface for
        K-283 and B-283 as a nearby-object record. Report the ceiled values at
        the fixture point and at every scored D* (C-CEIL-D, VERSION 3 N-J3-3),
        non-gating. Classify the outcome (success_criterion.outcome_classes).
        Run C-IND and require agreement before writing any table.
    - stage: 7
      name: proposal-figure recomputation (C5)
      steps: >-
        Recompute every entry PF-1 to PF-9 of the proposal_figure_register
        (carried unchanged, C5 discipline: canonical text in the version-1
        design audit named in prior_versions, sha256
        8936f77d632414246c5f03db40e2035cb6a04691ac63576a9fb53bf095c6f605,
        restated with the memory figure beside every time figure in the
        version-3 audit sheet, VERSION 3 RD-9) under reading R-I, with the
        memory figure beside every time figure, against both the naive column the proposal used and
        the corrected column, and report each as agree or disagree with the
        proposal's stated value. Every figure in this stage is labelled
        "illustrative, unreconciled, R-I; not a result about any cell".
    - stage: 8
      name: report
      steps: >-
        raw-result.json, gates.json, RESULTS.md from output_templates only,
        manifest and digests. RESULTS.md states no sentence about the 571 cell
        outside output_templates (version 2, D-8 S-9; consistent with V-8).
  stage_order_enforcement: >-
    The D* function asserts on entry that gates.json exists and records G1, G2,
    G3 and G4 as passed, and raises otherwise; raw-result.json writes the gates
    block before the surface block. A run whose artifacts show a D* table with
    any gate not passed is invalid (invalidation rule V-6).

  # ---------------------------------------------------------------------------
  controls:
    - id: C-REPRO
      what: fixture F1 at 571 and 283 (frozen_c2_fixture)
      pass_criterion: see frozen_c2_fixture.pass_rule
      gating: G2
    - id: C-IDENT
      what: F2, R-B and R-M equal to the instrument at D = 4 at every omega on the grid
      pass_criterion: absolute difference <= 1e-9 bit in every cell
      gating: G3
    - id: C-INT
      what: F3, the numerical check of lemma L-INT at D = 4 (571 and 283)
      pass_criterion: >-
        illustrative value + M1 + M2 + omega M3(4) + M4 equals C_I(n, omega) to
        1e-9 bit, with M2 computed as log2 m! + (n - m k) + the eq. (11)
        correction, independently of the instrument's A
      gating: >-
        Not a gate for D*. Failure withdraws reading R-M and every Stage-7
        figure; D* is then read in R-B alone.
    - id: C-ARG
      what: argmin invariance of lemma L-ARG across the whole surface grid
      pass_criterion: m* = 12 at 571 and m* = 9 at 283 in every cell
      gating: G3 (a failure is an implementation defect)
    - id: C-RHOCONV
      what: >-
        Convention sanity check at ECC2K-130. With l from Bailey line 1096,
        k = 131 and h = 4, compute rho = 0.5 log2(pi l/(4 * 131)) and add
        log2(1.069993); compare with Bailey's printed 2^60.9 (line 166).
      pass_criterion: absolute difference <= 0.05 bit (the print precision of 60.9)
      why: >-
        Bailey's expression is sqrt(pi l/(2 * 2 * 131)) times a walk factor,
        which is the corrected convention at k = 131. The superseded
        sqrt(2k) convention is 0.5 bit off and fails this check by an order of
        magnitude.
      gating: G1
    - id: C-PARAM
      what: Stage-0 parameter checks (FIPS decimal equals SEC 2 hex, h agreement, bit length, Hasse interval)
      pass_criterion: every check true for every FIPS curve
      gating: G1
    - id: C-COVER
      version: 3
      defect: RD-1 (DEC-20260925-41f6dc; J1 D-1 residue)
      what: >-
        The Certicom coverage check of procedure stage 0 (a): code block CB-1
        of the audit sheet, extracted by the pinned method, written to
        experiments/EXP-NISTBIN-451dfa/code/certicom_coverage.py, digest
        checked, and called on the unmodified primary input and the Stage-5
        Certicom row list.
      reference_digest: >-
        CB1_REFERENCE_SHA256 =
        7e76be311e2063e3235f527d6abccb0165ca53865810bf1c3204b102f9269574
        (9282 bytes; allowed session computation C-1), the sha256 of the UTF-8 bytes of
        the CB-1 source string extracted by the pinned method; the same value
        is code_blocks.CB-1.reference_sha256 of the audit sheet.
      pass_criterion: >-
        The extracted file's sha256 equals CB1_REFERENCE_SHA256 AND
        certicom_coverage() returns verdict PASS: exactly the frozen count of
        binary curves (labels ECC2 and ECC2K) in Appendix A at the frozen
        count of distinct degrees, every block read, and the Stage-5 Certicom
        list equal to that set of (label, m) pairs, each once.
      design_time_check: >-
        Run under the card's allowed session computation C-3 on the
        unmodified inputs (PASS) and on in-memory copies of the row list:
        fifteen single-row omissions, one spurious row and one mislabelled
        degree, each FAILING (audit sheet session_computations C-3, output
        verbatim).
      gating: G1
    - id: C-PTM
      what: >-
        The 283 proves-too-much control (PTM-A) and PTM-B at 163, 233 and the
        least convenient known-truth Certicom degree 239 (ECC2-238, ECC2K-238),
        Stage 4 (VERSION 2, D-6: 239 replaces 131)
      pass_criterion: every margin positive at D = 4, omega = 3, the only scored omega
      gating: G4
      unscored_omega: >-
        At 2.376, 2.807 and 2.0 the same margins are reported and compared with
        routing.rt4_expectation_table, never gated; the design expectation is
        that K-283 and B-283 are non-positive at 2.376 and 2.0 and that every
        233 and 239 row is non-positive at 2.0, which is why no D* at those
        omegas is scored.
      ceiled_slack: >-
        VERSION 3 (O-J5-2). G4 is gated under MI-1 only (procedure stage 4;
        V-11). Under the ceiled reading its slack is much smaller: the
        BATCH-b67954 red team (TASK-20260925-8e9c3e, objection O-J5-2;
        provenance internal, a reviewer figure and not this producer's)
        reports B-283 at +0.70 bit at omega 3 under the ceiled k, turning
        non-positive for omega below about 2.978 (memory beside that margin
        at the ceiled m* = 10: Macaulay rows 2^32.58 or 2^27.98, relation
        store 2^29; CB-2 output kreading_table). This producer's own ceiled
        figure is C_I(283, 3.0) = 141.5270 at m* = 10 under the ceiled reading
        (CB-2 output kreading_table; Macaulay rows 2^32.58 or 2^27.98,
        relation store 2^29), against 147.6495 at m* = 9 under MI-1 (relation
        store 2^31.44). A successor contract that changes the k reading
        inherits that slack; this contract neither gates nor scores the
        ceiled reading.
    - id: C-IND
      what: >-
        An independently written routine that imports neither
        joint_balance.py nor the primary surface module recomputes A(n, m*)
        from exact integers (math.factorial, math.comb, fractions where
        needed), every C_B and C_M cell, every rho, every margin and every
        D*.
      pass_criterion: agreement <= 1e-6 bit on every cell and exact on every D* and every class label
      gating: required before any table is written
    - id: C-CEIL-A
      version: 3
      defect: N-J3-3 (the first of the three outputs version 2 labelled C-CEIL; this entry carries version 2's C-CEIL definition)
      what: C_I at every claim-(A) degree under k_reading "ceiled", with its argmin (procedure stage 5)
      pass_criterion: diagnostic, never gating; reported because Section 4.5.2 defines k = ceil(n/m) while Table 3 reproduces only from n/m; enters no class and no RT-4 sign
    - id: C-CEIL-T
      version: 3
      defect: N-J3-3, O-J4-1
      what: the threshold table's ceiled column (definitions.d_star_of_m.ceiled_column, procedure stage 6)
      pass_criterion: diagnostic, never gating or scored; handed on beside the MI-1 table with the bias sentence of MI-1
    - id: C-CEIL-D
      version: 3
      defect: N-J3-3
      what: the ceiled values at the fixture point and at every scored D* (tail_checks, metrics.secondary)
      pass_criterion: diagnostic, never gating
    - id: C-STAGE
      what: the total-cost convention (stage 1 plus stage 2 by log2_add) at D = 4 and at every D*, beside the stage-1 figure
      pass_criterion: diagnostic
    - id: C-XDEG
      what: >-
        Cross-check against the program's earlier degree sensitivity. At
        n = 409, omega = 3, compute C_B(409, 5, 3) - C_B(409, 4, 3) and
        C_M(409, 5, 3) - C_M(409, 4, 3), and set them beside COST-SEMBIN-8d123b's
        recorded degree-5 row as H-SEMBIN-97ea23 quotes it (+19.4 bits at
        n = 409), stating that record's metric. Memory beside (version 2,
        D-3): the degree-5 step at 409 raises Macaulay rows from 2^34.70 to
        2^43.38 under R-B and from 2^30.11 to 2^36.46 under R-M (design
        figures, audit sheet W11; recomputed by CB-2, output degree_steps).
        VERSION 3 (RD-9): those are the Macaulay rows beside the quoted +19.4
        bits if it is a degree-5 step of either reading; the record's own
        memory figure, if it states one, is reported beside it by Stage 6. The
        row is selected by row selector RS-2 of IR-1 and its degree label
        never enters a cost formula.
      pass_criterion: >-
        Diagnostic. Reports which D-extension, if either, the earlier record
        used. It changes no gate and no prediction.
    - id: C-BR1
      what: baseline-rule audit (extended in version 2, D-2; item (e) added in version 3, N-J1-2)
      pass_criterion: >-
        (a) The code path that assigns MODEL-CLASS-IC reads no time-only
        column; verified by the validator from the code and by a unit test
        that sets every coherent margin to a missing value and confirms no
        degree becomes MODEL-CLASS-IC. (b) MIS-SLICE REFUSAL: unit tests that offer, one at a
        time, a coherent row with cofactor 2 or 4, a label-separated row, a
        degree_bound_variants 5 or 6 row, a ceil_n_over_m row, a row at an
        omega other than the scored one, a row at a kappa other than the
        declared one, and a row from a storage reading outside the four named
        in pinned_coherent_row; each must be refused (row UNRESOLVED, refusal
        logged), never imported. (c) TIME-ONLY REFUSAL: a unit test that
        offers a time-only margin labelled as coherent, and one that offers a
        coherent margin at a neighbouring n; both must be refused. (d) A
        unit test that a missing margin yields UNRESOLVED, never
        MODEL-CLASS-RHO or MODEL-CLASS-IC (unresolved_reading). (e)
        VERSION 3 (N-J1-2, N-J1-1): MULTI-MATCH REFUSAL, a unit test that
        offers two rows matching every pinned field and differing only on an
        unpinned axis (alpha, store, processors, memory budget or budget
        reading); it must be refused under multi_match_rule (row UNRESOLVED,
        both rows and the differing field logged), never resolved by any
        selection; and a unit test that a degree with one curve
        MODEL-CLASS-IC and another curve UNRESOLVED is MODEL-CLASS-IC at the
        degree level (unresolved_level_pin).

  independent_variables:
    - D, integers 2..64 (grid variable; never an input read from data)
    - >-
      omega (VERSION 2, D-6): SCORED {3.0}, the only omega at which P-C is
      scored and the nearby-object control (G4, PTM-B) is gated; UNSCORED
      in-domain {2.376, 2.807}, reported in flagged blocks and entering no
      prediction, class or threshold; out-of-domain {2.0}, flagged
    - reading, R-B (primary) and R-M (secondary)
    - >-
      m (VERSION 2, D-4): the M-SET, every integer 2..30, for the threshold
      table D*_R(c, 3.0, m) of definitions.d_star_of_m; the scored cells use
      the model's m* (12 at 571)
    - curve, K-571 and B-571 for the surface; K-283 and B-283 as nearby objects
    - >-
      degree, every FIPS, Certicom and Oakley degree (fifteen distinct
      degrees, listed in procedure stage 5), for claim (A) at D = 4

  metrics:
    primary:
      - >-
        (VERSION 2, D-6) D*_R(c, 3.0, m*) in the FOUR scored cells, c in
        {K-571, B-571}, R in {R-B, R-M}, omega = 3, m* = 12, with mu, MR_B or
        MR_M and the relation store beside the margin at D* - 1 and D*
      - >-
        (VERSION 2, D-4) the threshold table D*_R(c, 3.0, m) over the M-SET
        (definitions.d_star_of_m), with D*real_B and the memory beside every
        entry, and (VERSION 3, N-J3-3, O-J4-1) the C-CEIL-T column beside it;
        this table, never a single m, is the threshold handed on
      - >-
        the claim-(A) count under BR-1 at D = 4, omega = 3, kappa = 1 over the
        fifteen degrees, with every row's class token (MODEL-CLASS-IC,
        MODEL-CLASS-RHO or UNRESOLVED) and the clause of BR-1 that assigned it
      - F1 value and argmin; F2 and F3 residuals; G1 to G4 outcomes, with (VERSION 3, RD-1) C-COVER's verdict and digest under G1
    secondary:
      - the full surface C_R and mu_R over the grid, with MR_B, MR_M, MR_C8, dense entries and relation store beside every time figure
      - the spread D*_M - D*_B per curve at omega = 3 and per m in the threshold table
      - the UNSCORED flagged blocks at omega 2.376 and 2.807 and the out-of-domain omega = 2.0 block (D-6), none of which enters a prediction, class or threshold
      - claim (A) at omega = 2.376, 2.807 and 2.0 (reported against routing.rt4_expectation_table, in flagged unscored blocks, VERSION 3 O-J5-1) and at every recorded kappa
      - C-CEIL-A, C-CEIL-T, C-CEIL-D, C-STAGE and C-XDEG diagnostics (VERSION 3, N-J3-3)
      - Stage-7 proposal-figure recomputation with agree or disagree per figure

  heuristic_under_test: >-
    VERSION 3 (D-5 H1-C carried; RD-5; N-J2-2). NO heuristic is validated by
    this contract. What the contract checks is INSTRUMENT CONSISTENCY: F1 and
    F2 show that the surface reproduces the frozen instrument at D = 4, and G4
    (proves-too-much at the known-truth degrees, the least convenient being
    239) shows that the instrument does not declare an index-calculus win
    where one is known not to exist. Neither is evidence that H1 holds at
    n = 571 (the transfer is H5) or at any D above 4. H1 (H-NISTBIN-dec5e1
    version_3) asserts an UPPER EDGE only, the per-solve cost at most S_B one
    degree step above D; it asserts no lower edge, so R-M is a second reading
    of the per-solve cost carried by the contract and not a bound in either
    direction (RD-5). H2 and H6 are not used by any output of this contract;
    they enter only a later reading of a measured degree against the
    threshold (E1, E2, IR-2). H3 and H4 are inherited; H4's convention is
    checked by C-RHOCONV.

  preregistered_prediction:
    version: 2
    defects: D-6 (P-C scored at omega 3 only), D-1 (P-A degree list), D-8 S-12 (tokens), D-4 (restricted model)
    quantity: >-
      (P-C) D*_R(c, 3.0, m*) in the FOUR scored cells, c in {K-571, B-571} and
      R in {R-B, R-M}, at omega = 3 and m* = 12, inside the restricted model;
      (P-A) the BR-1 MODEL-CLASS-IC set at D = 4, omega = 3, kappa = 1 over the
      fifteen degrees FIPS {163, 233, 283, 409, 571}, Certicom {79, 89, 97,
      109, 131, 163, 191, 239, 359} and Oakley {155, 185}, every curve of
      procedure stage 5 at its degree.
    formula: >-
      P-C: 12 <= D* <= 20 in all four scored cells. P-A: MODEL-CLASS-IC set =
      {571}, every other of the fifteen degrees MODEL-CLASS-RHO, none
      UNRESOLVED.
    unscored_note: >-
      Version 1 scored P-C in twelve cells (three in-domain omegas). Version 2
      scores it at omega = 3 only (D-6): the flagged blocks at 2.376 and 2.807
      are reported, compared with nothing in this prediction, and cannot
      confirm or falsify P-C. The band is the proposal's and is not re-fitted
      to the change in cell count.
    p_a_expectation_disclosure: >-
      Pre-registered before any evaluation (baseline_rule.unresolved_reading):
      the added degree 359 may have no coherent record at exactly n = 359, in
      which case P-A can reach at best A_unresolved. The prediction is the
      proposal's claim (A) as stated and is not weakened to anticipate that.
    source: >-
      IDEA-20260922-7d6d43 claims (A) and (C), whose band "D* ~ 12 to 20" is
      copied verbatim and not widened. Its session figures are NOT a source;
      they are recomputed in Stage 7.
    frozen_before_execution: true

  scale_relevance:
    tier: crypto
    justification: >-
      The parameters are the cryptographic-size labels n = 571 and 283 (and
      the claim-(A) degrees) inside a cost formula. Nothing is instantiated or
      measured at any size, so the tier describes parameter labels only.
      VERSION 2 (D-5 H1-C, H1-S): transfer to any real solving computation is
      H1 over the toy range together with the separately numbered transfer H5
      to n = 571 (H-NISTBIN-dec5e1 version_2; VERSION 3, RD-5: both restated
      in its version_3 block, H1 with an upper edge only). Neither is validated here: the
      contract checks instrument consistency at D = 4 only (F1, F2, G4).
      Transfer to the true solving degree is H2 and H6, and Part 3.
    extrapolation_span: >-
      Design figures, hand arithmetic, H1-S as RQ-NISTBIN-06157b asks. The
      span the red team TASK-20260924-e0a065 reports for Semaev's own
      measurements (its reading of the paper, cited as the reviewer's and not
      re-read here): n <= 21 with one row at 40, t <= 6, at most 60 Boolean
      variables, first fall degree D = 4 only. The span this contract uses:
      n = 571 at m = t = 12, n(t - 1) = 6281 Boolean variables, D over 2..64.
      Ratios: 571/21 = 27.2 in n (571/40 = 14.3 against the single larger row),
      6281/60 = 104.7 in variable count, and in D a measured span of one value
      (D = 4) against a used span of 63 values. Memory beside it: at n = 571,
      D = 4, the Macaulay rows are 2^36.63 under R-B (2^32.04 under R-M) and the
      relation store 2^47.58, against at most 60 variables at the measured end.
    correspondence: null

  tail_checks:
    - margin at D* - 1 and at D* for every scored cell and every threshold-table entry, so a crossing within a fraction of a bit of zero is visible, with the Macaulay rows and relation store beside both margins
    - >-
      the m* runner-up gap at 571 and 283 (the prior-version design audit
      records 0.040 bit to m = 13 at 571), invariant in D by L-ARG; memory
      beside it (design figures, hand arithmetic): relation store
      2^(571/12) = 2^47.58 at m* = 12 against 2^(571/13) = 2^43.92 at m = 13,
      so the runner-up moves the time by 0.040 bit and the relation store by
      3.66 bits (Macaulay rows at D = 4 are m-independent: 2^36.63 under R-B,
      2^32.04 under R-M); the threshold table over the M-SET (D-4) reports D*
      at m = 13 in any case
    - C-CEIL-D (VERSION 3, N-J3-3) and C-STAGE at the fixture point and at every D*
    - the unscored omega 2.376 and 2.807 blocks and the out-of-domain omega = 2.0 block, never pooled with the scored omega = 3 cells (D-6)

  replication:
    seeds: []
    seeds_note: Deterministic closed-form arithmetic; there is no randomness to seed.
    independent_instances: 2
    independent_instances_note: >-
      Two implementations that share no code (C-IND): the primary path, which
      loads the frozen instrument, and an exact-integer routine that loads
      neither. Agreement is required before any table is written.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.25
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_runs_note: >-
      One derivation run. A second run is admissible only after an
      infrastructure failure, with the first run's artifacts retained.
    maximum_workers: 1

  stopping_rules:
    - SR-1 stop at the first failed gate among G1 to G4; write gates.json and the stages completed; compute no D*
    - SR-2 stop if the instrument hash differs from sha256_expected; nothing is computed
    - SR-3 stop if C-IND disagrees; no table is written; report both values
    - SR-4 an infrastructure failure (crash, timeout, missing file) stops the run and is reported as failed_infrastructure, never as a result
    - SR-5 no stage may be re-run with a changed tolerance, grid, reading or omega; any change is a protocol_amendment filed before a new run
    - SR-6 stop if the sha256 of experiments/EXP-NISTBIN-451dfa/code/certicom_coverage.py differs from CB1_REFERENCE_SHA256 (control C-COVER); nothing after the hash checks is computed
  stopping_rules_note: >-
    VERSION 3 (DEC-20260925-41f6dc non-breaking item "reused stopping-rule
    ids"). The version-2 ids S-1 to S-5 collided with the D-8 item labels S-3
    and S-4 (and with the S-n family of D-8 labels generally) and are renamed
    SR-1 to SR-5 with unchanged text; SR-6 is new (RD-1). Every
    cross-reference in this file uses the new ids. Labels "D-8 S-n" (for
    example S-9, S-10, S-12, S-13) remain D-8 item labels.

  invalidation_rules:
    - V-1 instrument sha256 mismatch, or any edit, copy or re-implementation of joint_balance.py inside the primary path
    - V-2 any D value read from a file, argument or record (IR-1), or any column labelled only "degree"
    - V-3 r, h or coefficients taken from anything but the declared primary inputs, or a recalled value (IR-3)
    - V-4 a tolerance, grid, reading, omega set or prediction band changed after any evaluation
    - V-5 a SEMBIN margin imported without the SN-1 check or outside pinned_coherent_row, a coherent row selected among several matches (VERSION 3, multi_match_rule), or a time-only column used to make a degree MODEL-CLASS-IC
    - V-9 (VERSION 2, D-6, D-4) an unscored-omega block (including, VERSION 3 O-J5-1, the claim-(A) tables at 2.376 and 2.807) entering a prediction, an outcome class or the threshold table, or a threshold handed on at a single m
    - V-6 a D* table present while gates.json records any of G1 to G4 as not passed, or a D* computed in any stage before 6
    - V-7 an R-I (illustrative) figure presented as a D* or as a result about any cell
    - V-8 any sentence in RESULTS.md about the 571 cell outside output_templates
    - V-10 (VERSION 3, RD-1) G1 recorded as passed without a C-COVER verdict PASS from the CB-1 bytes at CB1_REFERENCE_SHA256, or with a Stage-5 Certicom row list that differs from the list passed to CB-1
    - V-11 (VERSION 3, O-J6-1, O-J5-2, N-J3-3) a C-CEIL-A, C-CEIL-T or C-CEIL-D value entering G4, RT-4, a class, a scored cell, an outcome class or the MI-1 threshold table

  # ---------------------------------------------------------------------------
  success_criterion:
    protocol_success: >-
      The run is VALID iff SR-2, SR-3 and SR-6 did not fire, G1 to G4 passed,
      C-IND agreed, and every required artifact exists. A valid run succeeds
      equally under every outcome class below; there is no outcome this
      contract is trying to reach.
    outcome_classes:
      basis: >-
        VERSION 2 (D-6, D-4): D*_lo and D*_hi are the minimum and maximum of D*
        over the FOUR scored cells (K-571 and B-571 under R-B and R-M at
        omega = 3, m* = 12, inside the restricted model), "no crossing at
        D <= 64" counting as above 64. The unscored omega blocks, the C-CEIL
        columns (VERSION 3, V-11) and the threshold table over the M-SET
        assign no class.
      K1_near: D*_lo <= 11. P-C FALSIFIED (cliff nearer than the proposal's band).
      K2_teens: 12 <= D*_lo and D*_hi <= 20. P-C CONFIRMED in scope.
      K2x_straddle: 12 <= D*_lo <= 20 < D*_hi. P-C FALSIFIED (not robust across cells).
      K3_far: D*_lo >= 21 and every cell crosses at D <= 64. P-C FALSIFIED.
      K4_beyond: D*_lo >= 21 and at least one cell has no crossing at D <= 64. P-C FALSIFIED (the proposal's D* in the hundreds branch).
      A_confirmed: BR-1 MODEL-CLASS-IC set = {571} over the fifteen degrees, no UNRESOLVED degree (VERSION 3, unresolved_level_pin). P-A CONFIRMED in scope.
      A_second: a degree other than 571 MODEL-CLASS-IC. P-A FALSIFIED.
      A_rho571: >-
        571 MODEL-CLASS-RHO. P-A FALSIFIED. (Version 1 named this class
        A_dead571; renamed under S-12 so that no class name carries a cell-status
        word. The class, its condition and its routing are unchanged.)
      A_unresolved: no falsifying degree and at least one UNRESOLVED degree (VERSION 3, unresolved_level_pin). P-A NOT ESTABLISHED.
    decision_mapping: >-
      VERSION 3 (D-8 S-10, D-4; RD-6, RD-7, the K2x wording item, O-J4-1). Per
      DEC-20260924-99ce20 S1 decision_it_changes, and only inside the
      restricted model. "Plausible solving degree" means an integer D with
      4 <= D <= 20 (definitions.plausible_solving_degree), a label and not a
      claim about any system. The omega = 2.0 block and the unscored omega
      blocks count toward no outcome class and no mapping. K1, K2 and K2x: at
      least the lowest scored D*, D*_lo, lies in the plausible range (in K2x
      the highest, D*_hi, lies above it), and Part 3 is pointed to
      GOAL-SEMBIN-fcb7a2 as the measurement against which the threshold is
      read, in the restricted model, under its numbered readings, assuming H1
      and H5. That measurement would bear on the 571 cell only inside that
      model and would not by itself settle the cell. The threshold handed on
      is the MI-1 table D*_R(c, 3.0, m) over the M-SET for both curves and
      both readings, never a value at one m, with the C-CEIL-T column beside
      it and the sentence of MI-1.bias_of_the_handed_table (every MI-1 entry
      is no later than its C-CEIL-T entry). K3: the same table is supplied to
      GOAL-SEMBIN-fcb7a2 without a priority claim, and the evidence review
      states which way it reads. K4: the cell stays conditional and Part 3 is
      not prioritised on this contract's account, because in the model the
      scored threshold lies above every plausible solving degree. K4 REVISIT
      CONDITION (CLAUDE.md rule 9; VERSION 3, RD-7): a Coordinator decision
      citing the new record reopens the K4 deprioritisation as soon as any of
      these holds AFTER the decision that records the deprioritisation: (i)
      DEGREE-GROWTH EVENT: a record committed after that decision that is
      not a GOAL-SEMBIN-fcb7a2 true-degree record (those are (iii)), namely a
      validated evidence record of any goal, a knowledge finding, or a primary
      source archived under inputs/ with provenance, reports for a Semaev
      summation-polynomial descent system of the shape of system (5), at any
      (n, m), a solving degree in the d_F4 convention of IR-2, discharged as
      IR-2 requires, that exceeds Assumption 1's bound 4; such a record is
      evidence that the true degree grows with the system, which makes the
      Part 3 measurement more worth making; (ii) a successor contract writes
      out an M7 or M8 reading as a numbered reading (M8 can only move D*
      earlier, D*(m) <= D*(m*); M7's direction is conditional,
      definitions.restricted_model.m7_direction, so the revisit fires
      whichever way the numbered reading moves D*, and the reopening decision
      states which way it reads); (iii) GOAL-SEMBIN-fcb7a2 posts a true
      solving-degree record for the descended system at any toy-ladder n.
      None of (i) to (iii) is a function of this run's own threshold table,
      so none is fixed true or fixed false by the closed forms of
      definitions.what_the_run_adds (D-10). Any class: the reachability table
      records the 571 cell as a conditional computed cost with the D*
      interval and the threshold table (with C-CEIL-T beside it), never as an
      unqualified point estimate.
    negative_outcomes_exist: >-
      Yes. K1, K2x, K3, K4, A_second and A_rho571 each falsify part of the
      hypothesis in scope.

  falsification_criterion: >-
    H-NISTBIN-dec5e1 claim (C) is falsified in scope by any of K1, K2x, K3 or
    K4; claim (A) by A_second or A_rho571. The hypothesis is VOID, not
    falsified, when the run is invalid or G1, G2 or G4 fails. A failure of
    F3 withdraws R-M and the illustrative figures and does not falsify
    anything. VERSION 2 (D-5 H1-V): no outcome of this contract falsifies a
    heuristic. H1's falsification condition is external and stated at
    toy-ladder n only, and (VERSION 3, RD-5) one-sided: a measured per-solve
    cost above H1's upper edge (H-NISTBIN-dec5e1 version_3); a failure of F1,
    F2 or G4 is an instrument-consistency failure that VOIDS the run and is
    never read as evidence against H1, H5 or any other numbered heuristic.
    Every falsification above is of a prediction inside the restricted model
    at omega = 3, not of the true solving degree or of any curve.

  routing:
    tier: review-breakthrough at max, non-degradable
    rules:
      - RT-0 the evidence review of every valid run of this experiment is at review-breakthrough at max, whatever the outcome class (tripwire T1 of DEC-20260924-99ce20)
      - RT-1 any output, sentence or reading that reads as E1 (definitions.e1_e2; VERSION 2, D-8 S-13) goes to its own review-breakthrough round at max
      - RT-2 any output, sentence or reading that reads as E2 (definitions.e1_e2, with its every-m quantifier, its restricted-model scope and, VERSION 3 RD-5, its one-step tolerance and named lower edge; a closure sentence lacking any of them still reads as E2) goes to its own review-breakthrough round at max
      - >-
        RT-3 (VERSION 3, N-J2-2) any verdict on the 571 cell beyond D*(m) in
        the reconciled model, under its numbered readings, assuming H1 (with
        H5) goes to its own review-breakthrough round at max; a reading of a
        measured degree against D*(m) also assumes H2 (and H6 wherever a first
        fall degree is used) and is E1 or E2 territory (RT-1, RT-2)
      - >-
        RT-4 (VERSION 2, D-8 RT4-CERTAIN; VERSION 3, N-J2-3, O-J6-1) any
        degree OTHER THAN 571 that is MODEL-CLASS-IC under BR-1, or any degree
        other than 571 whose corrected time-only margin sign, read from the
        MI-1 figure only and never from C-CEIL-A, at any grid omega, 2.0
        included, DIFFERS from the pre-registered sign in
        rt4_expectation_table below, goes to its own review-breakthrough round
        at max; a sign equal to the table's pre-registered sign does not fire
        RT-4
      - RT-5 A_rho571 goes to its own review-breakthrough round at max
      - RT-6 if review-breakthrough at max cannot be served, the result stays un-promoted and the impediment is recorded on the active goal; the tier is never lowered and no review-adversarial session substitutes
    rt4_expectation_table:
      version: 3
      defect: D-8 RT4-CERTAIN (DEC-20260924-124667); the MI-1-only quantity under O-J6-1 (DEC-20260925-41f6dc)
      quantity: >-
        sign of the corrected time-only margin (C_I(n, omega) at D = 4 under
        MI-1, never the ceiled C-CEIL-A column, minus the corrected rho,
        rho_ub for Oakley) for EVERY curve at the degree, at each grid omega;
        "+" positive (the rho figure is cheaper), "-" non-positive. Design
        figures, hand arithmetic (audit sheet WC3), pre-registered before any
        evaluation; margin(omega) = margin(3) - 4 (3 - omega) log2 n.
      omega_order: [3.0, 2.807, 2.376, 2.0]
      signs:
        '79': [+, +, +, +]
        '89': [+, +, +, +]
        '97': [+, +, +, +]
        '109': [+, +, +, +]
        '131': [+, +, +, +]
        '155': [+, +, +, +]
        '163': [+, +, +, +]
        '185': [+, +, +, +]
        '191': [+, +, +, +]
        '233': [+, +, +, '-']
        '239': [+, +, +, '-']
        '283': [+, +, '-', '-']
        '359': ['-', '-', '-', '-']
        '409': ['-', '-', '-', '-']
        '571': ['-', '-', '-', '-']
      near_zero_entries: >-
        Entries within 2 bits of zero, where a sign different from the table
        is most likely and is still an RT-4 trigger: 283 at 2.807 (B-283 about
        +0.54; rows 2^32.58, relation store 2^31.44), 239 at 2.376 (about +1.79
        for ECC2-238; rows 2^31.60, relation store 2^26.56).
      memory_beside: >-
        omega moves time only. At D = 4, per degree in the order above, the
        R-B Macaulay rows are 2^(4 log2 n) = 2^25.22, 25.90, 26.40, 27.07,
        28.13, 29.10, 29.39, 30.13, 30.31, 31.46, 31.60, 32.58, 33.95, 34.70,
        36.63 and the relation store at the model's m* is 2^(n/m*) = 2^13.17,
        14.83, 16.17, 18.17, 18.71, 22.14, 23.29, 23.13, 23.88, 25.89, 26.56,
        31.44, 35.90, 37.18, 47.58. R-M anchors the TIME to R-B at D = 4 but
        its rows are 2^W(n, 4), smaller: 2^27.98 at 283, 2^29.36 at 359,
        2^30.11 at 409 and 2^32.04 at 571 (audit sheet WC8); the R-B rows are
        the memory figure stated at every degree.
      disclosure: >-
        The entries at 233, 239, 283 and 409 agree with values the red team
        TASK-20260924-e0a065 reports, which this session read before computing
        its own (informed, not blind); every figure here is this session's
        hand arithmetic and none is a reviewer's value.
      rule: >-
        A non-positive entry is RT-4-neutral: a time-only sign never assigns a
        claim-(A) class (BR-1). RT-4 fires on a sign DIFFERENT from this table,
        at any degree other than 571 and any grid omega. VERSION 3 (O-J6-1):
        the sign is read from the MI-1 figure only. Under the ceiled column
        some signs would differ (at 283 and 2.807, 233 and 2.376, 239 and
        2.376, as the BATCH-b67954 red team's objection O-J6-1 reports;
        provenance internal, a reviewer finding), which is why the ceiled
        column never feeds RT-4 (V-11).
    note: >-
      This contract has no input from which the true solving degree could be
      read, so E1 and E2 cannot be outputs of a valid run. RT-1 and RT-2 exist
      to catch wording.

  output_templates:
    d_star_sentence: >-
      VERSION 3 (D-4, D-5 H1-S; O-J4-2, N-J3-2). In the reconciled block_n4w
      model at extension degree 571, restricted to the dense, fixed-omega,
      block-size-n model (readings R-B and R-M, which coincide with the frozen
      EXP-SEMBIN-81dc96 instrument at D = 4; sparsity M5, the block-size
      exponent M7 and the optimising m under H2 M8 lie outside it), under its
      numbered readings, including MI-1 (k = n/m unceiled; under the ceiled
      reading of column C-CEIL-T the values are {x_ceil} and {y_ceil}, no
      earlier), assuming H1 with its transfer H5, H3 and H4, the time-only
      cost at m* = 12 first exceeds the corrected matched-rho figure of
      {curve} ({rho} bits) at D*_B = {x} and D*_M = {y} for omega = 3, where D
      is a grid variable standing for a hypothetical solving degree. This m*
      value is the SCORED CELL of prediction P-C, not the threshold: the
      threshold is the table over m of threshold_sentence, and by M8 no entry
      of that table is later than this value. At D*_B the model's Macaulay
      matrix has 2^{MR_B} rows under R-B and at D*_M 2^{MR_M} rows under R-M,
      beside a relation store of 2^{RS}. The measurements behind H1 span, as
      the red team TASK-20260924-e0a065 reads Semaev 2015, n <= 21 (one row at
      40), at most 60 Boolean variables and D = 4; this sentence extrapolates
      by 27.2 times in n, 104.7 times in variable count and from one degree to
      {x} and {y} (H5). This is a property of the cost model. It states
      nothing about the true solving degree of any system and nothing about
      the security of any curve.
    threshold_sentence: >-
      VERSION 3 (D-4; N-J3-2, O-J4-1). In the same restricted model, under the
      same numbered readings and assumptions, with k = n/m unceiled (MI-1),
      the least grid degree at which the time-only cost exceeds the corrected
      matched-rho figure of {curve} at omega = 3 is D*_R({curve}, 3.0, m) for
      each m in 2..30, tabulated in {table_path} with the Macaulay rows and
      relation store beside every entry and with the same quantity under the
      ceiled reading (column C-CEIL-T) beside it. Every MI-1 entry is no later
      than its C-CEIL-T entry, so the MI-1 table is biased toward earlier
      thresholds. This table is the threshold, and it is a property of the
      cost model over m; no entry at one m is a threshold by itself.
    claim_a_sentence: >-
      Under baseline rule BR-1 at D = 4, omega = {w}, kappa = {kappa}, the
      MODEL-CLASS-IC set of the frozen cost model over the fifteen degrees is
      {set}, the MODEL-CLASS-RHO set is {rho_set}, and {u} degrees are
      UNRESOLVED ({unresolved_list}, each with its missing input named). This
      is a count at one parameter point of a cost model under Assumption 1's
      degree and is not a verdict on any cell.
    forbidden: >-
      VERSION 2 (D-8 S-12, R-X3): any sentence using "break", "weak",
      "vulnerable", "safe", "secure", "attack succeeds", "opens" or "closes"
      about any curve or cell; any unscoped use of "live", "dead", "decides",
      "deciding" or "decisive" (a use is scoped only when it names the
      restricted model, the parameter point and the numbered assumptions in
      the same sentence, and no template here needs one); any sentence that
      states or implies E1 or E2 (definitions.e1_e2); and any statement of a
      threshold at a single m.

