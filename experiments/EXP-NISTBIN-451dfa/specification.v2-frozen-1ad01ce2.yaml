  interpretation_limits:
    - >-
      Every number is modelled. D* is a property of Semaev 2015's cost model as
      frozen in EXP-SEMBIN-81dc96 and extended in D by R-B and R-M. It is not
      a measurement of any system and not a statement about any curve.
    - >-
      VERSION 2 (D-5 H1-C). No heuristic is validated here. The contract
      checks instrument consistency at D = 4 only (F1, F2, G4). H1's shape in D
      is carried by two readings whose interval is not a bound (H1-L), and its
      transfer from the toy range to n = 571 is the separately numbered H5.
      H1 includes Semaev's own conjecture that the block-structured estimate
      with block size n applies to system (5).
    - >-
      VERSION 2 (D-4). Every D* and the threshold table are stated inside the
      restricted model (definitions.restricted_model): dense, fixed omega,
      block size n. Three multipliers lie outside it (audit sheet L-INT).
      M5, sparsity of the Macaulay matrix: its omission places D* too EARLY
      for in-domain omega, because a sparse solve would lower the
      index-calculus cost and so move the crossing to a larger D (version 1
      stated the opposite direction; corrected under D-4). M7, the block-size
      exponent above D = 4: F4 row-count growth faster than R-B would place
      D* EARLIER than R-B. M8, the optimising m under H2: A(571, m) >=
      A(571, m*) at every m, so D*(m) <= D*(m*) and a true optimising m other
      than m* can only move the crossing earlier; this is why the threshold is
      handed as D*(m) over m.
    - >-
      Optimistic for index calculus, each flagged: omega down to 2.376 assumes
      fast matrix multiplication on the Macaulay matrix (reported, unscored,
      D-6); block count and the operation-unit conversion kappa are not
      charged (M6 and kappa in the audit sheet); eq. (11) yield is taken as
      realised (H3). VERSION 2 (D-4): row weight (M5) is no longer listed
      here; at in-domain omega its omission is pessimistic for index calculus
      and places D* too early (restricted-model limit above).
      Optimistic for rho: per-iteration cost and distinguished-point memory
      are not charged (H4, kappa = 1). The omega = 2.0 block is outside
      Semaev's stated domain and enters no prediction.
    - >-
      The index-calculus side is n-level and charges no Frobenius saving, so
      K-571 and B-571 differ only through their rho figure.
    - >-
      Time-only. The memory figure sits beside every time figure but is not
      charged. A memory-charged crossing degree is no later than the time-only
      D* when the index-calculus working set is at least 6n bits (L-MONO).
    - >-
      Claim (A) is a count at D = 4 and one omega over fifteen degrees. Its
      coherent reading is SEMBIN's, cited through pinned_coherent_row, and
      inherits H-SEMBIN-97ea23's caveats (degree 4 unmeasured; HEUR-VOW-CURVE
      unread at source). A class token is the class of a degree in a cost
      model at one parameter point, never a cell status (S-12).
    - >-
      Oakley degrees are composite and admit subfield methods (GHS and
      others) that this model does not price. A MODEL-CLASS-RHO Oakley row
      says only that, under BR-1 at that parameter point, Semaev's model costs
      more than the rho_ub figure there.
    - >-
      Nothing here is a statement about the security of any curve, standard
      or deployed system, in either direction.

  proof_search_map:
    location: >-
      The five KN-TECH-080 audits, the lemmas L-ARG, L-EXT, L-INT, L-MON,
      L-SPREAD, L-UB, L-MONO and L-ASM, and the frozen C2 fixture are in the
      design audit sheet named under design_audit. Summary follows.
    bottleneck: >-
      VERSION 2 (D-8 S-4): the per-solve cost n^(4 omega) of block_n4w, whose
      degree bound 4 is replaced by the axis D. The degree bound is one of
      several modelling inputs of comparable leverage at 571, not the one
      integer on which the margin rests: one R-B degree step costs 27.47 bits
      at omega 3 and multiplies the Macaulay rows by 571 (9.16 bits); moving
      omega from 3 to 2.376 moves the D = 4 time by 22.86 bits and no memory;
      and the reading choice between block_n4w and macaulay4 moves it by 26.75
      bits (213.0618 against 186.307, prior-version audit OC-4; macaulay4's
      memory is not derivable in this design). Design figures, hand arithmetic.
    baseline_embedding: >-
      D = 4, omega = 3 reproduces the frozen 571 row, 186.307 at m* = 12 (F1),
      with Macaulay rows 2^36.63 under R-B (2^32.04 under R-M) and a relation
      store of 2^47.58 beside it; both readings equal the instrument's time
      there (F2)
    observation_collision: >-
      R-B and R-M coincide at D = 4 and diverge off it, so D* is an interval;
      a fake d'_F as D is excluded by IR-1
    quantifier_order: >-
      VERSION 2 (D-4, S-13): for each curve, each reading, the scored omega = 3
      and each m in the M-SET, D*_R(c, 3.0, m) is the least grid D with
      positive margin; an E2-type statement would need EVERY m and BOTH
      readings (definitions.e1_e2); nothing is quantified over the true
      solving degree
    method_ceiling: >-
      D*(m) in the reconciled model, under its numbered readings, assuming H1
      (with H5), inside the dense, fixed-omega, block-size-n model
    nearby_object_control: >-
      VERSION 2 (D-6): the 283 control (PTM-A) and PTM-B/G4 at 163, 233 and
      239, where 239 (ECC2-238, ECC2K-238) is the least convenient known-truth
      Certicom degree and replaces 131; gated at omega = 3, the only scored
      omega
    strictness_and_interfaces: >-
      No strict improvement is claimed. Interfaces I1 to I6 each have a lemma
      or a rule (audit sheet, audit A5).

