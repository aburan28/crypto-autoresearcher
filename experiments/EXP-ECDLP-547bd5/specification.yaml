# EXP-ECDLP-547bd5
# Width-count arithmetic. No graph is built.
# Approved by DEC-20261003-c4f635.
experiment:
  id: EXP-ECDLP-547bd5
  hypothesis_id: H-ECDLP-c553e5
  source_idea: IDEA-20261001-e1fcbf
  question_id: RQ-ECDLP-002
  version: 1
  title: Bag size versus width
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-c4f635
  objective: >-
    Check the width 0, the unit sum 2, and the gap 2229.
  inputs:
    bag_size: 1
    minus_one: 1
    bag_width: 0
    unit_sum: 2
    unit_prod: 1
    unit_excess: 1
    row_count: 12
    nearest_count: 13
    row_excess: 1
    citation_count: 6
    row_quot: 2
    corpus: 2241
    corpus_gap: 2229
    corpus_quot: 373
    corpus_rem: 3
  controls:
    - >-
      The width of a size-1 bag is 0. Reporting the width as the
      bag size 1 drops that width and invalidates the run.
    - >-
      The two unit effects sum to 2 and their product is 1. Two
      exceeds one by 1.
    - >-
      The rows_checked list has 12 entries. The nearest list has
      13 entries, and 13 exceeds 12 by 1. The citation list has 6
      entries. Twelve divided by 6 is 2.
    - >-
      2241 exceeds 12 by 2229. 2241 divided by 6 is 373 remainder
      3. Reporting the row count as 13 drops the gap to 2228.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {width, units, corpus}
    - route in {subtract, count}
  metrics:
    primary:
      - bag_width
      - unit_sum
      - corpus_gap
      - implementations_agree
    secondary:
      - row_count
      - nearest_count
      - corpus_quot
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width of a size-1 bag is 0. The two unit effects sum to
      2. 2241 exceeds 12 by 2229.
    formula: >-
      Subtract 1 from the bag size 1. Add the two unit effects.
      Subtract 12 from 2241. Divide 12 by 6. Divide 2241 by 6.
    source: >-
      IDEA-20261001-e1fcbf states the width rule as bag size minus
      one, two unit minimum effects, a rows_checked list, a nearest
      list, a citation list, and the corpus count 2241, read
      2026-10-03. No field prime is named as an integer. The counts
      were recomputed in this design session. That computation is
      not a run. No graph was built.
  scale_relevance:
    tier: toy
    justification: One written width rule and one written corpus count. No transfer to an ECDLP exponent.
    correspondence: null
  tail_checks:
    - The unit sum 2 and the gap 2229 are required. A check that stops at the width 0 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the width 0 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The width is not 0.
    - The unit sum is not 2.
    - The gap is not 2229.
    - The width is reported as 1, or a graph is built.
  success_criterion: >-
    Both runs agree that the width of a size-1 bag is 0, that the
    two unit effects sum to 2, that 13 exceeds 12 by 1, and that
    2241 exceeds 12 by 2229.
  falsification_criterion: >-
    The runs agree that the width of a size-1 bag is computed, and
    that width is not 0.
  required_artifacts:
    - experiments/EXP-ECDLP-547bd5/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-547bd5/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-547bd5/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-547bd5/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-547bd5/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-547bd5/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any graph construction, rank computation, or scalar multiplication.
    - Any claim that a width of 0 moves an ECDLP exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
