    - experiments/EXP-HZM-001/runs/RUN-HZM-001-a/sources/arxiv_2607.09814v1.pdf
    - experiments/EXP-HZM-001/runs/RUN-HZM-001-a/sources/arxiv_2607.09814v1.html
    - experiments/EXP-HZM-001/runs/RUN-HZM-001-d/manifest.yaml
    - experiments/EXP-HZM-001/runs/RUN-HZM-001-d/command.txt
    - experiments/EXP-HZM-001/runs/RUN-HZM-001-d/environment.json
    - experiments/EXP-HZM-001/runs/RUN-HZM-001-d/stdout.log
    - experiments/EXP-HZM-001/runs/RUN-HZM-001-d/stderr.log
    - experiments/EXP-HZM-001/runs/RUN-HZM-001-d/raw-result.json
    - experiments/EXP-HZM-001/runs/RUN-HZM-001-d/summary.json
    - experiments/EXP-HZM-001/runs/RUN-HZM-001-d/aggregate_and_classify.py
    - ledger/hypotheses/H-HZM-001.yaml (read-only; status unchanged)
  executor_assessment:
    protocol_complete: true
    protocol_complete_note: >-
      Complete for the branch the specification itself pre-registered:
      Stage 1 (manuscript alignment) ran to a terminal outcome and its
      pre-registered stop correctly prevented Stages 2/3 from opening.
      "protocol_complete: true" here means "the specified stopping
      behavior was correctly followed to its terminal state," not "all 4
      planned runs executed" -- those are different claims, and the
      distinction is recorded above under protocol_deviations rather than
      conflated.
    data_quality: good
    data_quality_note: >-
      RUN-HZM-001-a's finding is a primary-source-verified textual/LaTeX
      extraction with an accompanying symbolic algebra sanity-check
      (sympy), not a noisy empirical measurement; there is no sampling
      uncertainty to report. RUN-HZM-001-d correctly propagates that
      finding with no data-quality loss.
    requires_rerun: false
    requires_rerun_note: >-
      No rerun is indicated by this Executor. A future amendment could
      re-pin H using the manuscript's own base l=2*L and re-open Stages
      2/3 under a corrected formula pair; that is a Coordinator decision
      (protocol amendment), not a rerun of this experiment as specified.
  claim_tier_compliance: >-
    claim_tier: toy throughout. No standardized-curve, key-recovery, or
    crypto-scale claim is made or implied. No toy-scale enumeration was
    even performed, since the pre-registered Stage 1 stop fired first; the
    only computation performed was a text/LaTeX extraction, a symbolic
    algebra identity check, and (outside the formal protocol scope) an
    isolated smoke test of the required implementation modules on ad hoc
    instances. certificate.kind: none throughout (no solve/relation claim
    at any point).
  no_ledger_status_changed: true
  no_hypothesis_or_goal_status_changed: true
