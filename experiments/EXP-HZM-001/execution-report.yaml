execution_report:
  experiment_id: EXP-HZM-001
  goal_id: GOAL-CRYPTO-001
  hypothesis_id: H-HZM-001
  dispatch_authorization:
    decision_id: DEC-20260906-e4a2f7
    note: >-
      This dispatch cites DEC-20260906-e4a2f7 as the real Coordinator
      approval, per its own status_enactment_note in specification.yaml and
      per this task's explicit instruction. TASK-20260727-009's
      `authorized_by: "DEC-20260727-002"` field remains exactly as
      committed (immutable, known-false per DEC-20260807-5adc24) and is
      NOT relied upon as authorization here; that handoff was used only
      for its objective/inputs/constraints/budget/deliverables content.
  implementation_commit: 53aac6d8875a3c5badd66cbd753a25027621f0f3
  requested_policy: executor-implementation
  requested_reasoning_effort: medium
  resolved_model_id: claude-sonnet-5
  resolved_model_id_note: >-
    Genuine self-report from this session's own Claude Code runtime system
    context (model ID claude-sonnet-5, "Sonnet 5"). No fallback occurred.
  protocol_deviations:
    - >-
      Only 2 of the 4 planned runs (RUN-HZM-001-a, RUN-HZM-001-d) were
      opened. RUN-HZM-001-b (formal 9-config x 3-seed toy enumeration grid)
      and RUN-HZM-001-c (formal brute-force control subset + primary-gate
      charged-cost ledger) were never opened, because
      CTRL-HZM-MANUSCRIPT-ALIGNMENT failed in RUN-HZM-001-a and
      specification.yaml's own pre-registered stopping_rules[0] explicitly
      forbids opening them in this branch: "Stop the experiment as
      inconclusive_misalignment if CTRL-HZM-MANUSCRIPT-ALIGNMENT fails; a
      toy run is never opened on unaligned formulas." This is the
      specification's own designed third branch (see
      falsification_criterion(a) and RT-20260723-303), not an
      under-execution of the protocol. The original TASK-20260727-009
      handoff's completion_gate literally expects "exactly 4 planned runs
      reach a terminal status," written before this specific branch's
      run-count consequence was made explicit; this deviation is recorded
      per agents/executor.md's "record every deviation" requirement rather
      than silently reconciled.
    - >-
      required_artifacts lists per-run signature_enumeration.py,
      cost_ledger.py, and brute_force_control.py outputs that presuppose
      the enumeration stage runs. Because that stage was never opened
      (see above), these three modules were written as genuine, working
      code under experiments/EXP-HZM-001/implementation/ (satisfying the
      required_artifacts path) and unit-smoke-tested in isolation on ad hoc
      instances outside the formal protocol grid
      (experiments/EXP-HZM-001/implementation/SELFTEST.md), but were never
      invoked as part of a formal 9-config/27-instance measurement. No
      claim is made from the smoke test; it exists only to confirm the
      required-artifact code is functional, not vaporware.
  runs:
    completed:
      - id: RUN-HZM-001-a
        status: completed_valid
        path: experiments/EXP-HZM-001/runs/RUN-HZM-001-a/
        result: >-
          CTRL-HZM-MANUSCRIPT-ALIGNMENT FAIL. The manuscript's displayed q/M
          formulas use base l' (post-halving reduced kernel dimension); its
          displayed H formula uses base l = 2*l' (pre-halving full kernel
          dimension), in the same subsection (4.1) two sentences apart.
          specification.yaml's pinned identity H=M*d/(L+1) requires M and H
          to share one base L, which the manuscript's own equations do not.
          Independently reproduces the RT-20260723-303 (RT303-O3) concern
          against the primary source, not merely the snapshot quote.
          CTRL-HZM-WORKED-EXAMPLE: control_unavailable (no fully
          parameterized worked example located in the manuscript).
      - id: RUN-HZM-001-d
        status: completed_valid
        path: experiments/EXP-HZM-001/runs/RUN-HZM-001-d/
        result: >-
          Aggregated RUN-HZM-001-a's finding; applied specification.yaml's
          decision rule; recorded experiment_level_classification =
          inconclusive_misalignment; recorded all primary/secondary metrics
          as not_measured/not_applicable with explicit reasons (no
          enumeration or cost-ledger run was ever opened).
    invalid: []
    failed: []
    never_opened:
      - id: RUN-HZM-001-b
        reason: >-
          specification.yaml stopping_rules[0] fired in RUN-HZM-001-a
          (CTRL-HZM-MANUSCRIPT-ALIGNMENT FAIL); "a toy run is never opened
          on unaligned formulas."
      - id: RUN-HZM-001-c
        reason: >-
          Same stopping_rules[0] firing; the brute-force control subset and
          primary-gate cost ledger presuppose an opened enumeration stage.
  observations:
    - >-
      Frozen prediction reference: specification.yaml preregistered_prediction
      (q(N,L,d)=1-(1-1/N)^M, M=binom(L+d,d), H=binom(L+d,d-1)=M*d/(L+1)),
      identically restated in the immutable snapshot
      coordination/goals/GOAL-CRYPTO-001/batches/BATCH-003/tasks/TASK-20260723-301/candidate_report.yaml.
    - >-
      Comparison statistic (manuscript-alignment control, not a
      count/cost comparison): the manuscript's displayed M/q formula base
      (l') and H formula base (l=2*l') differ, verified via exact LaTeX
      source extraction from the arXiv HTML rendering of
      arXiv:2607.09814v1 (Sections 4.1, 6, 8). No tail check applies: no
      enumeration distribution was ever generated to check a tail against.
    - >-
      This is a manuscript-alignment / formula-anchoring audit outcome, not
      a heuristic-validation empirical comparison; HEUR-001's occupancy law
      itself was not tested against any measured distribution, because no
      toy enumeration was performed. No conclusion is drawn here about
      whether HEUR-001 or H-HZM-001 is supported or refuted.
  anomalies:
    - >-
      The pinned formula misalignment found in RUN-HZM-001-a was not
      previously confirmed against the primary manuscript (only against
      the immutable snapshot quote, per RT-20260723-303's RT303-O3
      objection, which flagged the CONCERN but had not itself re-fetched
      the manuscript). This run's direct retrieval of arXiv:2607.09814v1
      (both PDF and HTML) confirms the concern is real at the primary
      source, not a snapshot-transcription artifact. Recorded per
      agents/executor.md's "record every deviation, infrastructure
      failure, and unexpected observation" requirement -- this counts as
      an unexpected observation (the audit was expected by RT-20260723-303
      to plausibly reveal misalignment, but its EXACT nature -- a base-2
      factor from the manuscript's own l vs l' notation -- was not
      previously pinned down).
    - >-
      Untracked files from concurrent, unrelated agent work were present in
      the shared git working tree during both runs (paths disclosed in
      each run's manifest.yaml `code.untracked_files_present_at_run_time`).
      None touch any file this experiment reads or writes; `git diff
      --stat` against HEAD shows zero modifications to any tracked file
      throughout both runs. Disclosed per the dirty-tree recording
      discipline in docs/evidence-and-reproducibility.md and
      agents/executor.md item 3.
  artifact_paths:
    - experiments/EXP-HZM-001/specification.yaml
    - experiments/EXP-HZM-001/manuscript_alignment.md
    - experiments/EXP-HZM-001/analysis.md
