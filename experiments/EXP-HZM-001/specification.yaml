experiment:
  id: EXP-HZM-001
  hypothesis_id: H-HZM-001
  goal_id: GOAL-CRYPTO-001
  version: 1
  title: >-
    Manuscript-aligned static cost audit and toy enumeration of the published
    defect-scaled hyperplane-signature zero-minor ECDLP route
  status: paused
  status_enactment_note: >-
    Enacted 2026-08-08 by the Coordinator: DEC-20260807-5adc24 (2026-08-07)
    paused this experiment for a fabricated/misattributed approval citation,
    but this status field was never updated to reflect that decision until
    now. Found during a survey for approved-but-unrun experiments to
    dispatch; this experiment was correctly excluded from that dispatch as a
    result of finding this gap, not despite it. Prior value: approved.
  frozen: true
  approved_by: coordinator
  approved_at: '2026-07-27'
  claim_tier: toy
  objective: >-
    Decide whether the published defect-scaled hyperplane-signature
    zero-minor route survives the GOAL-CRYPTO-001 sub-rho cost gate under
    its own pinned formulas. Stage 1 pins the manuscript source: extract the
    displayed success law q(N,L,d) = 1-(1-1/N)^M, candidate mass
    M = binom(L+d, d), signature mass H = binom(L+d, d-1) = M*d/(L+1), and
    the stopping rule from the pinned publication, recording exact equation
    anchors; misalignment ends the experiment as inconclusive_misalignment
    (per RT-20260723-303; no toy run is opened). Stage 2 implements the
    defect-scaled signature enumeration at toy scale and counts candidate
    completions, processed signatures, and zero minors. Stage 3 compares
    measured counts and charged cost against the pinned formulas, with a
    published-worked-example cross-check and a brute-force minor-evaluation
    control. Both outcomes are possible: gate survival (formulas track
    within the declared factor and charged cost is strictly below the frozen
    rho bound at both primary gate sizes) or falsification (systematic
    deviation beyond the factor, or charged cost at/above the bound). The
    prior audit's expected outcome is falsification of gate survival.
  source_proposal: IDEA-20260723-002
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: >-
      Per-trial enumeration counts (candidate completions, signatures
      processed) and charged expected per-target work of the defect-scaled
      zero-minor route, compared against the frozen Pollard-rho comparison
      bound.
    formula: >-
      q(N,L,d) = 1-(1-1/N)^M <= min(1, M/N); M = binom(L+d, d);
      H = binom(L+d, d-1) = M*d/(L+1); charged expected per-target work
      >= H/q + setup + reconstruction + verification, with the audit's
      derived lower bound N*d/(L+1) = N^(1-o(1)) for L = Theta(log N);
      frozen rho bound = ceil(N^(1/2)) group-operation-equivalents per
      solved target.
    source: >-
      Defect-scaled formulas: Mahalanobis, "A Guess and Determine Attack on
      the Elliptic Curve Discrete Logarithm Problem", arXiv:2607.09814v1
      (2026), as quoted in the immutable snapshot
      coordination/goals/GOAL-CRYPTO-001/batches/BATCH-003/tasks/TASK-20260723-301/candidate_report.yaml.
      Mechanism prior art: Mahalanobis-Mallick-Abdullah, "A Las Vegas
      algorithm to solve the elliptic curve discrete logarithm problem",
      INDOCRYPT 2018, IACR ePrint 2018/134; Abdullah-Mahalanobis, "Minors
      solve the elliptic curve discrete logarithm problem", arXiv:2310.04132
      (cited in the 2026 manuscript as the Experimental Mathematics 2025
      publication "A zero minor solves the elliptic curve discrete
      logarithm problem"). Pollard-rho comparison bound: this program's
      KN-TECH-005 / KN-LIT-011 baseline convention.
  scale_relevance:
    tier: toy
    justification: >-
      Toy-scale enumeration validates only the correspondence between the
      pinned formulas and the route's actual count/cost behavior at the
      tested sizes; the asymptotic N^(1-o(1)) conclusion remains a
      conditional algebra statement from the pinned formulas, not a toy
      measurement. No result here is crypto-tier (AGENTS.md rule 7), and a
      gate survival authorizes only independent theorem review.
    correspondence: null
  inputs:
    pinned_publications:
      defect_formula_source:
        ref: 'Mahalanobis, "A Guess and Determine Attack on the Elliptic Curve Discrete Logarithm Problem", arXiv:2607.09814v1 (2026)'
        quoted_in: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-003/tasks/TASK-20260723-301/candidate_report.yaml
        alignment_rule: >-
          RUN-HZM-001-a records the exact displayed-equation anchors for q,
          M, H, and the stopping rule, mapping each to one outer trial, one
          defect choice, and one early-stop branch. Network access, if any,
          is source retrieval only; if the manuscript cannot be retrieved,
          the formulas as quoted in the immutable snapshot are the frozen
          source, and alignment_source: snapshot_quote is recorded and
          disclosed in every downstream artifact.
      mechanism_prior_art:
        - 'Mahalanobis, Mallick, and Abdullah, "A Las Vegas algorithm to solve the elliptic curve discrete logarithm problem", INDOCRYPT 2018, IACR ePrint 2018/134'
        - 'Abdullah and Mahalanobis, "Minors solve the elliptic curve discrete logarithm problem", arXiv:2310.04132 (Experimental Mathematics 2025 as cited in the 2026 manuscript)'
    toy_instances:
      generator: harness.toycurve with recorded seeds [1, 2, 3]
      subgroup_order_bits: [8, 12, 16]
      grid: "(L,d) in {8,12,16} x {1,2,3} (9 configs), L matched to instance bits; 3 seeded instances per config"
      primary_gate_sizes: [[12, 1], [16, 1]]
      brute_force_control_subset: "all d at L=8 plus d in {1,2} at L=12"
    frozen_cost_ledger:
      charged_stages: [sampled_point_generation, evaluation_matrix_construction, left_kernel_and_reductions, defect_loop, signature_construction, duplicate_storage_or_streaming, failed_outer_restrictions, zero_minor_reconstruction, final_group_equality_verification]
      frozen_rho_bound: ceil(N^(1/2)) group-operation-equivalents per solved target (KN-TECH-005 baseline convention)
      conversion_rule: polylog bit-cost factors are recorded but never used to change the compared N-exponents
  controls:
    - id: CTRL-HZM-MANUSCRIPT-ALIGNMENT
      method: Exact equation anchors for q, M, H, and the stopping rule are recorded from the pinned publication (or the disclosed snapshot-quote fallback); H = M*d/(L+1) is re-derived algebraically.
      pass_condition: q, M, and H are mapped to one outer trial, one defect choice, and one stopping rule; otherwise the experiment stops as inconclusive_misalignment before any enumeration run.
    - id: CTRL-HZM-WORKED-EXAMPLE
      method: Cross-check the formula implementation on at least one fully parameterized published worked example from the pinned publications; the executor records the exact source (paper, section, parameters) at execution time.
      pass_condition: The implementation reproduces the example's counts and zero minor exactly; if no fully parameterized worked example can be located, record control_unavailable and classify the experiment inconclusive (success cannot be claimed).
    - id: CTRL-HZM-BRUTE-FORCE
      method: On the frozen control subset, independently enumerate all defect choices and evaluate minors directly (no signature hashing), counting zero minors by definition.
      pass_condition: Zero discrepancies between signature-search counts and brute-force minor evaluation on every subset instance.
    - id: CTRL-HZM-CERTIFICATE
      method: Every accepted duplicate signature reconstructs an exact zero minor and the final public group equality is reverified with independent code.
      pass_condition: zero_minor_certificate_reverification_failures = 0.
  independent_variables:
    - matrix_dimension_L: "L in {8, 12, 16}, matched to toy subgroup order bits"
    - defect_d: "d in {1, 2, 3}"
    - instance_seed: "seeds 1-3 per config (curve/instance generation only; enumeration is deterministic given the instance)"
  metrics:
    primary:
      - candidate_completion_count_ratio: measured completions divided by binom(L+d,d) per config (tracking target within [1/2, 2])
      - signature_enumeration_count_ratio: measured signatures processed divided by binom(L+d,d-1) per config (tracking target within [1/2, 2])
      - charged_expected_work_vs_rho_bound: charged expected per-target work at the primary gate sizes (12,1) and (16,1) versus ceil(N^(1/2)) (survival requires strictly below at both)
      - zero_minor_certificate_reverification_failures: count (target 0)
      - brute_force_control_zero_minor_discrepancies: count (target 0)
    secondary:
      - measured_zero_minor_hit_rate_vs_occupancy_law: per-trial zero-minor counts against q = 1-(1-1/N)^M (HEUR-001 audit signal)
      - per_stage_charged_operations: operation counts per frozen ledger stage
      - failed_outer_trials: expected and observed retries per success
      - peak_live_field_elements: memory proxy for the signature table
      - manuscript_alignment_anchors: recorded equation/section anchors, or the snapshot_quote disclosure
      - worked_example_source: exact paper/section/parameters of the located example
  replication:
    seeds: [1, 2, 3]
    seed_policy: >-
      Seeds drive toy-curve/instance generation only and are recorded per
      run; the enumeration and all counts are deterministic given an
      instance. Three independent seeded instances per (L,d) config.
    independent_instances: 27
    planned_runs:
      - id: RUN-HZM-001-a
        purpose: "Manuscript alignment audit: pin q/M/H/stopping-rule anchors, re-derive H = M*d/(L+1), freeze the cost ledger and rho comparison bound, locate the published worked example."
      - id: RUN-HZM-001-b
        purpose: Implement the defect-scaled signature enumeration at toy scale; run the 9-config x 3-seed grid; measure completion/signature counts against the pinned formulas; worked-example cross-check.
      - id: RUN-HZM-001-c
        purpose: Brute-force minor-evaluation control on the frozen subset; certificate reverification; charged-cost ledger evaluation at the primary gate sizes.
      - id: RUN-HZM-001-d
        purpose: Aggregate metrics, apply outcome classification, write analysis and execution report.
    expected_run_count: 4
  budget:
    wall_clock_seconds_per_run: 1800
    total_wall_clock_seconds: 6300
    total_cpu_hours: 1.75
    maximum_memory_gb: 4
    maximum_runs: 4
    stages:
      - id: manuscript_alignment_audit
        wall_clock_seconds: 1800
        stop_rule: If q/M/H cannot be aligned to one trial/defect/stopping rule, record inconclusive_misalignment and stop the experiment; no enumeration run is opened.
      - id: enumeration_grid_and_formula_check
        wall_clock_seconds: 1800
        stop_rule: Stop at 1800s and record the completed configs as partial; a worked-example control failure stops the stage and invalidates the measurement.
      - id: brute_force_control_and_cost_ledger
        wall_clock_seconds: 1800
        stop_rule: Stop at 1800s recording the completed subset; unfinished control instances are cancelled_by_budget and the control gate is reported as incomplete.
      - id: analysis_and_classification
        wall_clock_seconds: 900
        stop_rule: Stop without interpretation if any required artifact is incomplete.
  stopping_rules:
    - Stop the experiment as inconclusive_misalignment if CTRL-HZM-MANUSCRIPT-ALIGNMENT fails; a toy run is never opened on unaligned formulas.
    - Stop and record failed_infrastructure on any crash of the enumeration module; a crash is not evidence for or against the hypothesis (AGENTS.md rule 5).
    - Stop at 1800s per run and 6300s total wall clock; record remaining planned work as cancelled_by_budget.
    - Stop after the four planned runs; no exploratory fifth run.
    - Stop before any standardized-curve execution, key recovery, or real-target work; none is authorized at any point.
  invalidation_rules:
    - Any run missing its manifest, exact command, environment, stdout, stderr, or raw-result file is invalid (run-integrity failure, not a scientific result).
    - Any run with a dirty code revision in its manifest is invalid.
    - A worked-example or brute-force control mismatch invalidates the measurement (implementation unsoundness), not the hypothesis.
    - Unaligned or snapshot-quoted formula anchors presented as manuscript-aligned invalidate the affected runs.
    - Control failure is NOT invalidation of run integrity; it is recorded as the corresponding inconclusive or falsification outcome.
  success_criterion: >-
    The route survives the gate: measured completion and signature counts
    track the pinned formulas within a factor of 2 at every tested (L,d)
    config (9 configs across 3 L sizes, satisfying the >= 2 parameter sizes
    requirement), all four controls pass, and the charged expected
    per-target work is strictly below the frozen Pollard-rho comparison
    bound ceil(N^(1/2)) at BOTH primary gate sizes (12,1) and (16,1).
    Survival triggers only independent theorem review of the pinned
    manuscript; nothing further is authorized.
  falsification_criterion: >-
    Either (a) systematic deviation: measured counts depart from the pinned
    formulas beyond the factor of 2 at any tested config -- the
    manuscript-alignment premise fails and the cost claim is recorded
    inconclusive_misalignment per RT-20260723-303; or (b) the route's
    charged operation-level work at either primary gate size meets or
    exceeds the frozen Pollard-rho comparison bound -- the route is closed
    as non-sub-rho under its own published model (the prior audit's
    expected outcome). Infrastructure failure falsifies nothing.
  required_artifacts:
    - experiments/EXP-HZM-001/specification.yaml
    - experiments/EXP-HZM-001/implementation/signature_enumeration.py
    - experiments/EXP-HZM-001/implementation/cost_ledger.py
    - experiments/EXP-HZM-001/implementation/brute_force_control.py
    - experiments/EXP-HZM-001/manuscript_alignment.md
    - experiments/EXP-HZM-001/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-HZM-001/runs/<RUN-ID>/command.txt
    - experiments/EXP-HZM-001/runs/<RUN-ID>/environment.json
    - experiments/EXP-HZM-001/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-HZM-001/runs/<RUN-ID>/summary.json
    - experiments/EXP-HZM-001/runs/<RUN-ID>/stdout.log
    - experiments/EXP-HZM-001/runs/<RUN-ID>/stderr.log
    - experiments/EXP-HZM-001/analysis.md
    - experiments/EXP-HZM-001/execution-report.yaml
    - ledger/hypotheses/H-HZM-001.yaml
  assigned_to: executor
  inference_receipt:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: null
    fallback_used: false
    authorization_ref: null
