  heuristic_validation_checks:
    pre_registered_prediction: >-
      specification.yaml's preregistered_prediction block (q, M, H formulas,
      source citation) is part of the frozen contract, approved
      2026-07-27, re-approved with a fresh Coordinator review
      2026-09-06 (DEC-20260906-e4a2f7), both strictly before RUN-HZM-001-a
      executed (2026-09-06T16:50:29Z per its manifest.timing). No
      post-hoc-fitting risk: the prediction long predates the source
      retrieval that tested it against.
    sample_integrity: "not_applicable — no enumeration or sampling was ever performed; Stage 1's manuscript-alignment stop fired before Stage 2 (enumeration) could open. The manifest correctly records seed=null for both runs."
    empirical_cdf_recomputation: not_applicable — no empirical distribution exists to recompute; runs_never_opened for RUN-HZM-001-b/c is honestly and consistently recorded in execution-report.yaml, both run manifests, RUN-HZM-001-d's raw-result.json, and analysis.md, with no field anywhere silently substituting a placeholder number.
    correspondence_validity: not_applicable — no substitute-sampling correspondence (e.g. Deuring) is used or claimed by this experiment.
    scale_binding: >-
      scale_relevance.tier: toy is declared in specification.yaml with an
      explicit transfer-assumption disclaimer ("the asymptotic N^(1-o(1))
      conclusion remains a conditional algebra statement... not a toy
      measurement"). No scale claim beyond this is made anywhere in the
      reviewed artifacts; moot in any case since no toy computation
      occurred at all (correctly disclosed as such in analysis.md section 3).
    statistical_signal_null_control: >-
      not_applicable. AGENTS.md/inventor-protocol.md's "controls before
      belief" rule (a reported correlation/bias/excess needs a null-object
      control that decays under a destroying parameter) governs a
      STATISTICAL signal. Nothing measured here is statistical: the
      manuscript-alignment finding is a textual/LaTeX-markup extraction
      plus one exact symbolic algebra identity, not a sampled distribution,
      correlation, or excess. There is no parameter whose increase should
      make a base-symbol mismatch "decay," and no signal-vs-null comparison
      applies to this kind of finding. Independently re-verifying the exact
      quoted text against the primary source (done above, via two separate
      extraction paths) is the correct analogue of a null-object control
      for a textual claim, and was performed.

  cost_model_checks:
    unit_declaration: not_applicable — no concrete cost table is produced by this experiment; RUN-HZM-001-c (which would compute charged_expected_work_vs_rho_bound) was never opened.
    optimistic_assumptions_flagged: not_applicable — same reason.
    memory_alongside_time: not_applicable — same reason.
    cost_bookkeeping_per_attempt_x_inverse_success_probability: not_applicable — same reason; no per-target work total is claimed anywhere in the reviewed artifact set.
    smoke_test_cost_number_scope_check: >-
      implementation/SELFTEST.md's cost_ledger.py smoke-test output
      (N=257, L=8, d=1: "charged_expected_signatures = 29.003, rho_bound =
      17, survives_rho_gate = False") is explicitly labeled "MODELED,
      spec formula" and "not part of the EXP-HZM-001 protocol" in the same
      document, and is not referenced by analysis.md, manuscript_alignment.md,
      or execution-report.yaml's classification anywhere. Confirmed by
      direct grep across all four documents that this number does not
      leak into any scored conclusion. No cost-model overclaim found.

  proof_architecture_checks:
    applicability: >-
      not_applicable. H-HZM-001 audits a published external mechanism
      against this program's own sub-rho cost gate (asymptotic_claim: null,
      novelty_status: known per interpretation_limits); it is not a
      proof-oriented proposal of a new theorem, reduction, or certificate
      family under KN-TECH-080's scope, and H-HZM-001.yaml correctly
      carries no proof_search_map block (nor a not_applicable_reason
      stub for one) — consistent with templates/research-records.md's
      framing that proof_search_map is required for proof-oriented
      hypotheses specifically, which this is not.

  inventor_protocol_section6_ladder: >-
    not_applicable. Section 6's ladder (isolate/measure each complexity
    assumption; run the whole pipeline at reduced scale with the claimed
    speedup as a MEASURED ratio; classify any real-scale cheat; exercise
    the reproducibility pointer) governs a claimed speedup that cannot be
    executed at target scale. No speedup claim was reached here at all:
    the experiment terminated at Stage 1 (manuscript alignment), before
    any cost or count measurement, so there is no speedup number — measured
    or extrapolated — to check against this ladder. This is the correct,
    honest absence, not a missing step: falsification_criterion(a) fired,
    not falsification_criterion(b) (the sub-rho cost comparison), and the
    reviewed artifacts consistently say so.

  claim_tier_and_scope_discipline:
    verdict: no_overclaim_found
    checks_performed: >-
      Grepped analysis.md, manuscript_alignment.md, execution-report.yaml,
      and both runs' raw-result.json/manifest.yaml for language asserting
      HEUR-001 or H-HZM-001's truth beyond the manuscript-alignment
      finding (patterns: "H-HZM-001 is", "HEUR-001 is", "proves",
      "demonstrates that the", "confirms that ECDLP", "solves ECDLP",
      "breaks ECDLP"). The only match was execution-report.yaml's own
      explicit DISCLAIMER ("this Executor makes no determination of
      whether HEUR-001 or H-HZM-001 is supported or refuted"), not an
      overclaim. analysis.md section 4 (Limitation) and
      manuscript_alignment.md's closing paragraph both explicitly scope
      the finding to "whether specification.yaml's pinned formula pair
      corresponds one-to-one to the manuscript's displayed equations" and
      explicitly disclaim any conclusion about the manuscript's underlying
      algorithm, H-HZM-001, or HEUR-001. certificate.kind: none and
      claim_tier: toy are consistent and correctly stated everywhere.
      ledger/hypotheses/H-HZM-001.yaml's status (approved) and
      ledger/goals/GOAL-CRYPTO-001 are unchanged by this commit (verified
      via `git show 54aa83b92 --stat`, which does not list either path).

  limitations:
    - >-
      This review is a general independence check, not a joint-scoped
      review under a Coordinator-authored review_plan (none exists for
      this task at review time); it therefore reports a whole-artifact
      verdict rather than a single owned joint, per the task's own
      instructions rather than per agents/validator.md's "Working under a
      review plan" section, which does not apply here.
    - >-
      Did not independently re-verify every one of the manuscript's ~15
      pages against every possible alternative reading of "H"; the
      independent verification covered the four passages the executor
      cited plus the two additional passages (Notations, Section 8's
      second hashtable-length sentence) checked on this reviewer's own
      initiative. A more exhaustive search for a fifth reading cannot be
      ruled out but is unlikely to reverse a FAIL verdict that is already
      over-determined by three independently-confirmed base-mismatched
      quotes.
    - >-
      Did not independently re-run or inspect implementation/{signature_
      enumeration,cost_ledger,brute_force_control}.py for code quality;
      these modules carry no evidentiary status under this experiment
      (SELFTEST.md, confirmed above) and were only checked for existence
      and for not leaking into the classification.
    - >-
      I inadvertently re-ran runs/RUN-HZM-001-a/alignment_audit.py in place
      during independent verification and created a stray output file;
      both are fully disclosed and corrected under procedural_note above,
      with byte-identical sha256 confirmation that no committed artifact
      was altered.
    - >-
      This repository is a shared, concurrently-edited worktree; at review
      time `git status` showed unrelated staged changes to
      experiments/EXP-JMV-004/ from other concurrent session(s). Confirmed
      these do not intersect any path this review reads or writes.

  verdict: passed
  verdict_rationale: >-
    Every claim in the task's admissibility narrative was independently
    reproduced from primary sources, not merely re-read from the
    executor's own script output: (1) the exact manuscript quotes and
    LaTeX markup for q/M (base l') versus H (base l=2*l', Section 4.1,
    two sentences apart) were independently located and extracted from
    both the cached HTML and the cached PDF via two separate tools,
    matching the executor's anchors byte-for-byte, and a further,
    executor-unreported third passage (Section 8's own second "hashtable
    length" sentence, base l', choose d rather than d-1) independently
    corroborates and sharpens the same misalignment finding; (2) both
    cached source files' sha256 hashes were recomputed directly and match
    raw-result.json exactly; (3) run.code.commit
    (53aac6d8875a3c5badd66cbd753a25027621f0f3) is a real, HEAD-reachable
    commit whose content matches its stated purpose; (4) both run
    manifests carry a genuine inline environment: mapping, byte-identical
    to their environment.json, and the repository's own
    tools/validate_ledger.py runs with zero new errors attributable to
    EXP-HZM-001; (5) stopping_rules[0]'s text is present verbatim in the
    frozen specification, CTRL-HZM-MANUSCRIPT-ALIGNMENT's pass_condition
    correctly evaluates to FAIL given the independently-confirmed
    manuscript text, and the resulting never-opening of RUN-HZM-001-b/c is
    corroborated by both an absence of any b/c artifacts and by
    H-HZM-001.yaml's own PRE-EXISTING falsification_conditions (committed
    before this run executed), ruling out post-hoc rationalization; (6) no
    artifact anywhere asserts anything about HEUR-001's or H-HZM-001's
    truth beyond the narrow manuscript-alignment finding, claim_tier and
