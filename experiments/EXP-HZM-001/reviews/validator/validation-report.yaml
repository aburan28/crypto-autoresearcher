      independently_reconfirmed: true
      verdict: correct
      finding: >-
        Two independent cross-checks beyond re-reading specification.yaml's
        stopping_rules[0] text: (1) directory listing confirms no
        RUN-HZM-001-b/c artifacts exist anywhere, ruling out a silent
