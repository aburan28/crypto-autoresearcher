  metric_recomputations:
    - id: MANUSCRIPT-ANCHOR-1-Q-SUCCESS-LAW
      method: >-
        Independently opened sources/arxiv_2607.09814v1.html (NOT via
        alignment_audit.py's own extraction logic — direct Python string
        search + manual context read of the raw HTML/LaTeX markup) and
        located the displayed equation immediately after "the probability
        estimate is roughly" (Section 8).
      result: >-
        Exact <annotation encoding="application/x-tex"> payload:
        `1-\left(1-\dfrac{1}{\mathtt{p}}\right)^{\binom{\ell^{\prime}+\mathtt{d}}{\mathtt{d}}}`.
        Base symbol is \ell^{\prime} (l-prime), unambiguously. Cross-checked
        against `pdftotext`'s independent rendering of the same equation in
        the cached PDF ("roughly ... (l'+d choose d) ... 1-(1-1/p)"), which
        also shows the primed base. Two independent extraction paths
        (structured LaTeX from HTML, plain-text layout from PDF) agree.
      matches_reported: true
    - id: MANUSCRIPT-ANCHOR-2-H-HASHTABLE-SECTION-4.1
      method: >-
        Independently located "the table A' is the hashtable ... has a
        maximum length of" in the raw HTML, read >2000 characters of
        surrounding context directly (not just the isolated marker match).
      result: >-
        Exact <annotation encoding="application/x-tex"> payload for the
        immediately preceding matrix-A-size clause:
        `(\ell^{\prime}+\mathtt{d})\times\mathtt{d}` (primed). Exact payload
        for the H/hashtable-max-length clause, two sentences later in the
        SAME sentence/paragraph:
        `\binom{\ell+\mathtt{d}}{\mathtt{d}-1}` — plain `\ell`, no prime
        superscript at all. Confirmed by `pdftotext` independently:
        "...the creation of the matrix A which is of size (l'+d) x d. Then
        the table A is the hashtable and which is derived from A and has a
        maximum length of [l+d choose d-1]." Both extraction paths confirm
        the base-symbol switch within one sentence.
      matches_reported: true
    - id: MANUSCRIPT-NOTATIONS-2L-PRIME-EQUALS-L
      method: >-
        Independently located Section 1.1's Notations paragraph (not one
        of the executor's four cited anchors, but load-bearing for
        interpreting them) and read the exact displayed identity.
      result: >-
        `<math alttext="2\ell^{\prime}=\ell">` — i.e. the manuscript's own
        Notations paragraph states 2*l' = l explicitly and unconditionally,
        confirming l' and l are DISTINCT, non-interchangeable symbols
        throughout (l = 2*l', the pre-halving full kernel dimension; l' the
        post-halving reduced dimension), exactly as manuscript_alignment.md
        states. Also independently confirmed the immediately preceding
        clause "...is of size l x 2l" (matrix K's dimensions), matching the
        claimed l x 2l kernel-matrix size.
      matches_reported: true
    - id: ALGEBRAIC-IDENTITY-BLIND-RECOMPUTE
      method: >-
        Independently re-derived (own sympy session, not alignment_audit.py's
        embedded check) whether binom(n,d)*d/(n-d+1) == binom(n,d-1), plus a
        numeric spot-check over n in 3..9, d in 1..n-1 using Python's
        math.comb.
      result: "Symbolic difference simplifies to exactly 0; all numeric spot checks pass. Confirms the spec's H=M*d/(L+1) identity is algebraically sound ONLY when M and H are read as sharing one base n=L+d — it does not by itself say anything about whether the manuscript's OWN M and H share a base, which is the separate factual question the anchors above answer (they do not)."
      matches_reported: true
    - id: SECTION-8-THIRD-HASHTABLE-FORMULA-INDEPENDENT-FINDING
      method: >-
        Not requested by the task, but found while reading Section 8 in
        full to verify Anchor 1's context: the Conclusion (Section 8) ALSO
        states, in a separate sentence from the q formula, "The length of
        this hashtable is [binom]" — describing what it calls "the
        hashtable" a second time, independently of Section 4.1's "table A'"
        sentence.
      result: >-
        Exact tex payload: `\binom{\ell^{\prime}+\mathtt{d}}{\mathtt{d}}`
        — i.e. Section 8 calls "the hashtable"'s length
        C(l'+d,d), which is NOT the Section 4.1 "table A'" formula
        C(l+d,d-1) the executor's audit anchored as H; it is instead
        numerically identical to M itself (the candidate-mass formula).
        This is an ADDITIONAL internal inconsistency in the primary source
        beyond the one the executor's audit reported: the manuscript uses
        the word "hashtable" for two objects with two different displayed
        length formulas (C(l+d,d-1) in 4.1 vs C(l'+d,d) in Section 8),
        neither of which is the spec's assumed single quantity H sharing a
        base with M. This STRENGTHENS rather than undermines the
        CTRL-HZM-MANUSCRIPT-ALIGNMENT FAIL verdict; it does not change any
        conclusion in the reviewed artifacts, which anchored the (correct,
        verified) Section 4.1 quote and did not need this second passage to
        reach FAIL. Recorded here as an independent corroborating
        observation, not a defect in the executor's work.

