# EXP-ECDLP-4fd825
# Window-endpoint arithmetic. No character sum is evaluated.
# Approved by DEC-20261003-838354.
experiment:
  id: EXP-ECDLP-4fd825
  hypothesis_id: H-ECDLP-954cae
  source_idea: IDEA-20261003-cd1903
  question_id: RQ-ECDLP-bc7a54
  version: 1
  title: Cleared numerators of 3/4 and 1/2
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-838354
  objective: >-
    Check the numerators 3 and 2, the product 6, and the nearby gap 0.
  inputs:
    numerator_hi: 3
    numerator_lo: 2
    denominator: 4
    numerator_gap: 1
    numerator_product: 6
    numerator_sum: 5
    nearby_a: 2
    nearby_b: 2
    nearby_gap: 0
    nearby_product: 4
  controls:
    - >-
      Four times 3/4 is 3. Four times 1/2 is 2. Reporting both
      numerators as 2 drops the gap and invalidates the run.
    - >-
      Three exceeds two by 1. The product of the two numerators is
      6. Their sum is 5.
    - >-
      Two readings of the lower numerator are both 2. Their gap is
      0 and their product is 4.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {clear, subtract}
  metrics:
    primary:
      - numerator_hi
      - numerator_lo
      - numerator_gap
      - implementations_agree
    secondary:
      - numerator_product
      - numerator_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Four times 3/4 is 3. Four times 1/2 is 2. The gap of two
      lower numerators is 0.
    formula: >-
      Multiply 3/4 by 4. Multiply 1/2 by 4. Subtract 2 from 3.
      Multiply 3 by 2. Subtract 2 from 2.
    source: >-
      IDEA-20261003-cd1903 writes the window endpoints 3/4 and
      1/2, read 2026-10-03. The numerators, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No character sum was evaluated.
  scale_relevance:
    tier: toy
    justification: Two written endpoints. No transfer to an agreement bound.
    correspondence: null
  tail_checks:
    - The product 6 and the nearby gap 0 are required. A check that stops at the numerator 3 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the numerator 3 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Four times 3/4 is not 3.
    - Four times 1/2 is not 2.
    - The gap is not 1.
    - The product is not 6.
    - Both numerators are reported as 2, or a character sum is evaluated.
  success_criterion: >-
    Both runs agree that four times 3/4 is 3, that four times 1/2
    is 2, and that 3 exceeds 2 by 1.
  falsification_criterion: >-
    The runs agree that the upper numerator is computed, and that
    numerator is not 3.
  required_artifacts:
    - experiments/EXP-ECDLP-4fd825/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-4fd825/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-4fd825/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-4fd825/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-4fd825/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-4fd825/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any character sum, agreement count, or scalar recovery.
    - Any claim that a numerator gap of 1 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
