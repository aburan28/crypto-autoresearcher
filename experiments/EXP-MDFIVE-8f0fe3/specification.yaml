    EXECUTED from the task card and handoff, which remain the frozen
    originals.
  objective: >-
    Decide, BEFORE ANY CONSTRUCTION REDESIGN, which of three objects is the
    binding defect for the batch-5 negative: the SEED (cheap re-draw), the
    CRITERION (cheap, RC-3), or the CONSTRUCTION (expensive). The routing
    answer is the terminal deliverable of the execution report.
  construction:
    source: harness/run_md4_ceiling_v2.py R1_SEP10 (imported verbatim; the batch-5 instrument is read-only)
    parameters:
      primitive: [md4, md5]
      i_word: 2
      j_word: 12
      S: 8
      p: 3
      m: 12
      k: 20
      k_gate: 4
      k_ctl_po5: 6
    seed_schedule: 100 fixed-word seeds 20260821..20260920 per primitive (module default)
    target_seed_rule: 'target_seed := fixed-word seed (declared pairing)'
  independent_variables:
    - fixed_word_seed (the sweep variable)
    - primitive (md4 vs md5, identically-bounded arm)
    - object (primary vs null, RC-5 pairing)
  metrics:
    - distinct_fwd_32bit and distinct_fwd_12bit per seed (distribution, not point value)
    - distinct_bwd_32bit and distinct_bwd_12bit per seed (distribution, not point value)
    - ctl_po5_k1_k2_6 raw candidate count per seed (declared ceiling 4)
    - rc4 surviving (y XOR z) mask positions per seed (pre-gate filter, recorded)
    - recorded adjudication on every observed-vs-predicted integer departure beyond declared tolerance
  heuristics:
    - id: HEUR-H3
      statement: 'uniformity of the fixed-word draws over the 2^12 low space: high-mask pair duplicates and target-low pair duplicates counted and compared to the birthday expectation (~19.3 for 100 draws)'
      status: 'numbered_and_tested (O-6 of EV-MDFIVE-b0def7, 0 high-mask duplicates, 16 low-pair duplicates; NOT falsified)'
  binding_contract_terms:
    a: 'injectivity criterion distinct >= (1 - eps) * 2^k at BOTH 32-bit and window resolution, declared eps = 0.25 (threshold 12 of 16), declared_tolerance = 1, fixed before acquisition'
    b: 'recorded adjudication on every observed-vs-predicted integer departure beyond declared tolerance, even when the pass criterion is met'
    c: 'measured-or-modeled label on every threshold, including the CONTROLS'
    d: 'uniformity premise numbered as a heuristic (HEUR-H3) and tested'
    e: 'held-fixed value applied inside gate_direction_A so the gate can fail'
    f: 'code_path_fingerprint in the manifest and an armed explicit deadline (120 s per sweep run, 120 s per null-object run)'
    g: 'primitive qualifier on every control'
    h: 'null-object control (non-multiplexer additive mixer of the same shape) paired with every distinct-count measurement'
  controls:
    - RC-5 null object (same shape, three inputs, one output, one non-multiplexer mixer), both primitives, both resolutions
    - smoke-a/smoke-b determinism double-run (3 seeds, two fresh processes, byte-identity required except wall_seconds)
    - batch-5 seed 20260821 reproduction (cross-batch consistency of the shared code path)
  run_plan: >-
    Four production runs (primary/null x md4/md5, 100 seeds each, 120 s
    armed ceiling each) plus the two smoke runs; measured wall-clock under
    1 s per production run. MD4 FIRST; MD5 only inside the identically-
    bounded sweep arm (SC-1 lineage).
  budget:
    wall_clock_seconds: 1500
    memory_gb: 4
    maximum_runs: 5
  stopping_rules:
    - A halt at a declared ceiling is reported truthfully with the ceiling named (SC-7); unspent ceilings reported unspent, never reallocated
    - A timeout, crash, or implementation failure is infrastructure signal, never a negative mathematical result (rule 5; SC-7)
  invalidation_rules:
    - Any clobber of an archived run directory invalidates the affected record (immutability)
    - A construction change (step algebra, split point, matching quantity) would invalidate the batch-5 comparison and void the routing question this experiment exists to answer
  success_criterion: >-
    A per-primitive DISTRIBUTION of the declared metrics over >= 100
    fixed-word seeds with all eight contract terms honored, ending in a
    routing answer (SEED / CRITERION / CONSTRUCTION) with its evidence. A
    degenerate distribution is a RESULT, not a failure: a second, sharper
    measurement of the same obstruction, recorded under the inventor
    protocol's closure standard.
  falsification_criterion: >-
    The routing answer is falsified at the review round: if >= 50% of the
    >= 100 seeds reach the declared injectivity threshold at 12-bit on
    either primitive, the seed-lottery reading is not excluded and the
    routing must be revisited (the coordinator prior's declared falsifier,
    review-plan-87c429.yaml). The observed distributions (EV-MDFIVE-b0def7
    O-1/O-2) do not meet that bar for MD4 (1/100) and DO meet it for MD5
    (65/100), which the closing decision records as an overturn of the
    prior's MD5 limb (DEC-20260822-d7c2d0 F-3).
  required_artifacts:
    - harness/run_md4_seed_sweep.py (new sibling module; batch-5 instrument read-only)
    - tests/test_harness.py additive block (append-only, batch-5 convention)
    - six run directories (6 artifacts each) under the executor task directory
    - execution-report.yaml ending with the routing answer
    - derived-analysis-b6.json (labeled DERIVED; no new random draws)
  claim_ceiling: analyzed
  interpretation_limits:
