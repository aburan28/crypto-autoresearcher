experiment:
  id: EXP-FRODOFO-1978c5
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-7b9457; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-7b9457
  question_id: RQ-FRODO-a2dbe2
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Certified interval propagation of a correctness-error range through synthetic reduction
    bounds: monotonicity verdicts, three degenerate nulls, and measurement of the dependency-problem
    inflation factor against occurrence count and range width.'
  objective: 'One uncertainty is reduced: how much of the width of an interval-propagated bit-security
    figure is real uncertainty and how much is an artifact of interval arithmetic. (i) IS THE PIPELINE
    SOUND AND TIGHT AT THE DEGENERATE POINTS. Does a zero-width input interval produce a bit-for-bit
    degenerate output equal to point evaluation? Does a bound containing the correctness error exactly
    once produce an inflation factor of exactly one? Does a bound not containing it at all produce
    an output width independent of the input width? All three are gates and any failure voids the
    rest. (ii) HOW DOES INFLATION GROW. Across synthetic bounds with one, two, four and eight occurrences
    and input ranges from degenerate to three binary orders of magnitude wide, what is the ratio of
    the naive endpoint width to the densely certified true width, and is it monotone in both occurrence
    count and range width? (iii) WHERE DOES AN INTERVAL STOP MEANING ANYTHING. At what input-range
    width does the inflation factor exceed a stated threshold, so that a later batch knows the maximum
    range worth propagating? No transcription is used and no claim about FrodoKEM is made.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: for the four synthetic bounds,
      the stated input-range ladder, the stated sampling grid and exact rational arithmetic, the pipeline
      satisfied or failed the three degenerate gates as reported, and the inflation factor took the
      measured values as a function of occurrence count and range width. WHAT DOES NOT FOLLOW: nothing
      about FrodoKEM, no bit-security interval for any real scheme, no statement about any published
      correctness error or bit-security figure, no probability attached to any interval, and no security
      consequence of any kind. In particular, measuring that inflation is small on synthetic bounds
      does not license treating a future real interval as tight; the monotonicity certificate for
      that bound would have to be established separately.'
  inputs:
    procedure: 'STAGE 0, implement exact rational interval arithmetic with explicit endpoint ordering
      and a recorded per-term monotonicity verdict field. Cost: implementation. STAGE 1, degenerate
      gates: zero-width input, single-occurrence bound, symbol-absent bound. Any failure halts. Cost:
      seconds. STAGE 2, build four synthetic bounds with 1, 2, 4 and 8 occurrences of the correctness
      error, the last two with mixed increasing and decreasing terms, and derive per-term monotonicity
      verdicts symbolically, recording each. Cost: human plus minutes. STAGE 3, naive endpoint propagation
      across the input-range ladder. Cost: seconds. STAGE 4, certified enclosure computation where
      verdicts are mixed. Cost: minutes. STAGE 5, dense sampling of the true range at the stated grid
      resolution, with the monotone-piece decomposition used to bound what the grid could have missed.
      Cost: minutes. STAGE 6, inflation-factor computation and curve fitting against occurrence count
      and range width. Cost: seconds. STAGE 7, endpoint-order check on a certified-decreasing bound.
      Cost: seconds. STAGE 8, immutable run records via harness/runner.py with the synthetic bounds,
      verdicts, grid and resolved inference block.'
    instrument: 'Python 3 standard library: fractions.Fraction for exact rational endpoints so the
      zero-width gate is bit-for-bit, a hand-written interval class with explicit endpoint ordering
      and a monotonicity-verdict field attached per term, and a hand-written dense sampler. Symbolic
      monotonicity verdicts are derived by hand and entered as recorded data rather than inferred
      by a computer-algebra system, so that an unestablished verdict cannot be silently optimistic.
      No Sage, no floating point anywhere on the evaluation path, no lattice estimator. Run manifests
      and resolved inference block via harness/runner.py; ids via tools/allocate_id.py.'
    parameters: 'Four synthetic bounds with 1, 2, 4 and 8 occurrences of the correctness error among
      4 to 10 total terms, exponents on the half-integer lattice from minus two to plus three, constants
      spanning 2^0 to 2^60. Input-range ladder: widths of 0, 2^0.1, 2^0.5, 2^1, 2^2, 2^3 in multiplicative
      span around a central correctness-error value of 2^-140. Dense sampling grid: 4096 points per
      range, log-spaced, with the monotone-piece bound reported. Other inputs held at a frozen central
      point. All arithmetic exact rational, denominators reduced every operation.'
  controls:
  - Zero-width input null, requiring bit-for-bit degenerate output.
  - Single-occurrence bound, requiring inflation exactly one.
  - Symbol-absent bound, requiring output width independent of input width.
  - Densely sampled true range with a stated grid resolution, as the reference for the inflation factor.
  - Per-term monotonicity certificate, recorded per parameter set rather than assumed.
  - 'Endpoint-order check: for a bound certified decreasing, the output endpoints must swap relative
    to the input, which catches an implementation that ignores direction.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): ZERO-WIDTH INPUT: propagate a degenerate interval whose endpoints coincide
    at the published input value, through the IDENTICAL pipeline, in the same invocation. The output
    must be a degenerate interval equal bit for bit to the point evaluation of the same bound at the
    same value. Any widening is a pure artifact of the arithmetic implementation and voids every non-degenerate
    result, so this null is a gate rather than a comparison. A second null propagates an interval
    through a bound in which the correctness error appears exactly once, where the true range is available
    in closed form and the inflation factor must be exactly one; a factor above one there localizes
    an implementation defect. A third null uses a bound not containing the correctness error at all,
    whose output interval must be degenerate regardless of the input width.'
  independent_variables:
  - 'synthetic bound, by occurrence count of the correctness error: 1, 2, 4, 8'
  - input-range width across the six-step ladder
  - 'propagation method: naive endpoint, certified enclosure, dense sampling'
  - presence of mixed-direction terms
  - sampling grid resolution
  metrics:
    primary:
    - output interval endpoints and width per configuration and per method
    - inflation factor, naive width divided by certified true width
    - zero-width null output width
    - per-term monotonicity verdicts and non-monotone term count
    - input-range width at which the inflation factor first exceeds the stated threshold
    secondary:
    - monotone-piece bound on what the sampling grid could have missed
    - maximum rational denominator size encountered
    - endpoint-order check outcome
    - wall-clock per method
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The inflation factor as a function of occurrence count and input-range width, and the
      three degenerate gate outcomes.
    formula: 'Registered before the run: zero-width input gives output width exactly 0; single-occurrence
      bound gives inflation factor exactly 1.0, where the factor is the naive endpoint width divided
      by the densely certified true width; four-occurrence bound at an input range spanning 2^2 gives
      inflation at least 1.5; at least 80 percent of adjacent range-width ladder steps increase the
      inflation factor for each bound with more than one occurrence; symbol-absent bound gives output
      width exactly 0 at every input width.'
    source: Pre-registered in the parent proposal IDEA-20260816-7b9457 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested on four self-authored synthetic bounds of 4 to 10 terms, because no FrodoKEM
      transcription is filed and RQ-FRODO-a2dbe2 constraint 1 forbids designing against one. TRANSFER
      ASSUMPTION, stated plainly: the degenerate gates transfer unchanged, since they are properties
      of the arithmetic implementation rather than of any bound. The inflation curve transfers only
      insofar as a real bound''s occurrence structure resembles the synthetic ones, which is unknown
      and unknowable here, so the curve is quotable as guidance on the maximum range worth propagating
      and never as a bound on a real interval''s tightness.'
    correspondence: null
  tail_checks:
  - Report the monotone-piece bound on what the sampling grid could have missed, since the certified
    true width is only as good as that bound.
  - Report the widest configuration separately, since exact rational denominators grow fastest there
    and a slowdown could tempt a fallback.
  - Report the inflation factor at the narrowest nonzero range, where it should be close to one and
    where a deviation would indicate an implementation defect rather than the dependency problem.
  - Report the non-monotone term count per bound alongside every inflation number, since the two are
    expected to be linked.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report if any of the three degenerate gates fails.
  - Halt and report if dense sampling finds a value outside the certified enclosure, since that is
    an unsoundness and takes priority over every other result.
  - Cap total wall clock at two CPU-hours; a cap hit is an infrastructure outcome and never negative
    mathematical evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All three degenerate gates pass exactly, dense sampling never escapes the certified
    enclosure, and the inflation factor is exactly one at single occurrence, exceeds 1.5 at four occurrences
    over a 2^2 input range, and increases monotonically in range width on at least 80 percent of ladder
    steps.
  falsification_criterion:
  - The zero-width null produces a positive output width.
  - The single-occurrence bound shows inflation above one.
  - The symbol-absent bound's output width depends on input width.
  - Dense sampling finds a value outside the certified enclosure.
  - The inflation factor does not grow with occurrence count.
  - The endpoint-order check fails on a certified-decreasing bound.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-7b9457
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The input range on the correctness error is a free parameter here and its principled source is
    RQ-FRODO-3260cc's recomputation, which has not run; a Coordinator must decide whether this contract
    may proceed with an arbitrary illustrative range or must wait, and the record must not imply the
    range means anything.
  - Per-term monotonicity verdicts are entered by hand; a Coordinator must decide what evidence is
    required for a verdict, since an optimistic verdict silently converts an unsound propagation into
    a confident-looking interval.
  - The synthetic bounds are self-authored and their occurrence structure drives the headline curve;
    whether an independently authored bound set is required before the curve is quoted as guidance
    is a Coordinator decision.
