experiment:
  id: EXP-ECDLP-6147b4
  hypothesis_id: H-ECDLP-84ca6a
  question_id: RQ-INSTR-f8faa0
  goal_id: null
  version: 1
  status: draft
  claim_tier: not_applicable
  title: >-
    Verification protocol for artifact-hash integrity across the committed
    ledger, with the proposed transition-fraction statistic retained only as a
    negative control because it scores 0.115 on the very placeholders it was
    designed to catch, and a parity-class distinct-symbol statistic replacing it
    with a computed decay ladder

  objective: >-
    THIS IS A VERIFICATION PROTOCOL. WHAT IS CHECKED: every artifact hash claim
    in the committed ledger. AGAINST WHAT REFERENCE: the declared hash algorithm
    for length and alphabet; the uniform-nibble null for structure; and the file
    at the bound commit for recomputation. WHAT RESULT FAILS IT: a hash of the
    wrong length or alphabet, a hash whose minimum parity-class distinct-symbol
    count is at or below the threshold, or a hash that does not recompute where
    recomputation is available. SECONDARY OBJECTIVE, DECLARED UNDERPOWERED: the
    per-role sensitivity and escape-correlation calibration of the review
    pipeline, whose required sample size is stated rather than approximated.

  independent_variables:
    - name: detector_stage
      values: [D1_length_and_alphabet, D2_proposed_transition_fraction,
        D2prime_parity_class_distinct_count, D3_recomputation]
    - name: string_class
      values: [genuine_corpus_digest, known_placeholder, decay_ladder_k]
    - name: decay_ladder_k
      values: [0, 5, 10, 20, 40]

  inputs:
    corpus: every artifact hash claim in the committed ledger
    declared_algorithm_source: >-
      READ FROM THE RECORD, never assumed. D1's length constant follows the
      declared algorithm and a record declaring something other than SHA-256
      changes it.
    known_placeholders:
      - d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4
      - a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1
      - b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2
      - c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3
    placeholder_source_record: EV-ECDLP-65b004
    D2prime_threshold: 8
    null_parity_class_mean_distinct: 13.84
    null_parity_class_sd_distinct: 1.15

  metrics:
    primary:
      - name: D1_failures
        unit: hash claims (dimensionless non-negative integer)
        definition: >-
          Count of hash claims whose length or alphabet disagrees with the
          declared algorithm. DISCLOSED DEBT: reported exactly, with the
          offending record identifiers listed.
      - name: D2prime_statistic
        unit: distinct symbols (dimensionless integer in 1 to 16)
        definition: >-
          The minimum over the two positional parity classes of the number of
          distinct hex symbols that class uses.
      - name: D3_verdict
        unit: categorical, one of matches, mismatches, path_absent
        definition: >-
          Recomputation of the hash of the named path at the bound commit,
          against the recorded value.
    secondary:
      - name: D2_proposed_statistic
        unit: fraction of adjacent transitions (dimensionless)
        definition: >-
          The fraction of adjacent nibble transitions matching the best affine
          successor rule x maps to x + c mod 16. RETAINED ONLY AS A NEGATIVE
          CONTROL. See C-D2-IS-REFUTED.
      - name: D3_coverage
        unit: fraction of hash claims (dimensionless)
        definition: >-
          The fraction whose named path exists at the bound commit, so that
          recomputation is available at all.
      - name: per_role_sensitivity
        unit: fraction of planted defects detected (dimensionless)
        definition: >-
          Per role, per defect class. UNDERPOWERED as declared; reported with
          its interval and with the required sample size alongside.

  controls:
    - name: C-MATCHED-NULL-GENUINE
      kind: matched null, blocking
      blocking: true
      description: >-
        Every genuine digest already committed in this corpus, run through D1
        and D2 prime. NONE MAY FIRE. A detector that flags real hashes is worse
        than none. The empirical MINIMUM of the D2 prime statistic over all
        genuine digests, not its mean, is what sets the usable threshold, and
        the smallest resolvable false-positive rate is one over the number of
        digests.
    - name: C-D2-IS-REFUTED
      kind: pre-computed refutation retained as a negative control
      blocking: true
      description: >-
        THE SOURCE PROPOSAL'S SECOND-STAGE STATISTIC IS FALSIFIED IN ADVANCE BY
        DIRECT COMPUTATION AND IS NOT SIMPLY RE-THRESHOLDED. Expanding the first
        placeholder gives 61 adjacent-nibble transitions whose most frequent
        difference occurs 7 times, so the best-affine-successor fraction is
        7/61 = 0.115, NOT the asserted 1.0. For a genuine 62-nibble digest the
        maximum over 16 rules has expectation about 0.125, so the placeholder
        lies INSIDE the null and a threshold at 0.5 could never fire. The
        proposal's implicit model of the string is wrong: it is not a rotation
        of a fixed successor rule but two interleaved cycles, odd nibble
        positions running through the six symbols a to f and even positions
        through the ten symbols 0 to 9, with period 30 pairs. D2 is therefore
        computed and reported for every string as a NEGATIVE CONTROL THAT MUST
        NOT FIRE, and a D2 value above 0.5 on any placeholder would falsify this
        refutation and must be reported as such.
    - name: C-DECAY-LADDER
      kind: planted defect of known size with predicted magnitudes
      blocking: true
      description: >-
        Substitute k uniformly random nibbles into the filler, for k in
        {0, 5, 10, 20, 40}. THE D2 PRIME STATISTIC MUST TAKE THE PREDICTED
        VALUES 6.0, 7.5, 8.8, 10.8 and 13.3, monotone increasing, crossing the
        threshold of 8 between k = 5 and k = 10. A statistic that does not decay
        when the structure it claims to detect is destroyed is the canonical
        artifact tell, and the predicted magnitudes are stated so the control
        can fail rather than merely trend.
    - name: C-FALSE-POSITIVE-LOOKALIKES
      kind: over-strictness control
      blocking: true
      description: >-
        Plant non-defects that look suspicious: a legitimate mechanical reshape,
        and a legitimately changed file giving a different hash at a later
        commit. A pipeline that flags these is over-strict, which is a distinct
        defect and is reported separately.
    - name: C-SANDBOX-AND-SEALED-MANIFEST
      kind: process-safety gate, load-bearing
      blocking: true
      description: >-
        Planted defects live ONLY in sandbox copies under a declared plant
        manifest, sealed before any review and revealed after the verdicts. NO
        PLANTED ARTIFACT MAY EVER BE COMMITTED TO THE LEDGER. An instrument that
        injected false records into the evidence chain would itself be a
        fabrication vector, and this control is what prevents that.
    - name: C-ROLE-BLIND
      kind: independence control for the calibration arm
      blocking: true
      description: >-
        Identical packages to every role with the plant manifest sealed until
        all verdicts are in, so any correlation measured is correlation and not
        information leakage between roles.
    - name: C-ALGORITHM-FROM-RECORD
      kind: unit gate
      blocking: true
      description: >-
        D1's length and alphabet constants are read from each record's declared
        algorithm, never assumed to be SHA-256. A record declaring another
        algorithm is checked against that algorithm's constants or is reported
        as undeclared.

  heuristic_under_test: HEUR-001

  preregistered_prediction:
    quantity: >-
      The D2 prime statistic on the four known placeholders and on the corpus's
      genuine digests, and its value along the decay ladder.
    formula: >-
      Placeholders exactly 6. Genuine digests at least 9, with null mean
      16 times (1 minus (15/16)^31) = 13.84 and standard deviation 1.15, so the
      threshold of 8 sits 5.1 standard deviations below the null mean and the
      per-digest false-positive probability is about 1.7 times 10^-7 per parity
      class. Decay ladder 6.0, 7.5, 8.8, 10.8, 13.3 at k equal to 0, 5, 10, 20,
      40.
    source: >-
      The occupancy distribution for 31 uniform draws from 16 symbols supplies
      the null moments; the coupon-collector expectation
      6 plus 10 times (1 minus (15/16)^(k/2)) supplies the ladder. The
      placeholder value 6 is read directly off the strings, whose odd parity
      class uses only a to f.

  band_non_degeneracy_analysis: >-
    COMPUTED BEFORE THE THRESHOLD WAS FIXED, AND IT OVERTURNED THE SOURCE
    PROPOSAL'S PRIMARY STATISTIC.
    (1) THE PROPOSED STATISTIC HAS ZERO POWER AGAINST THE EXACT DEFECT IT WAS
    DESIGNED FOR. Expanding the first placeholder,
    d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4, into its 61
    adjacent-nibble transitions gives a difference multiset in which the most
    frequent value occurs 7 times. The best-affine-successor fraction is
    therefore 7/61 = 0.115. A uniformly random 62-nibble string has, per rule,
    a match count with mean 61/16 = 3.81 and standard deviation 1.89, so the
    maximum over 16 rules sits near 7 to 8 matches, i.e. a fraction near 0.125.
    THE PLACEHOLDER IS INSIDE THE NULL. At the proposed threshold of 0.5 the
    detector would never fire on any of the four strings, and no threshold that
    fires on them would leave the genuine digests alone, because they occupy
    the same value.
    (2) THE REPAIR IS A DIFFERENT STATISTIC, NOT A DIFFERENT THRESHOLD. The
    strings are two interleaved cycles: odd nibble positions run through
    a, b, c, d, e, f and even positions through 0 to 9, with the pair sequence
    repeating with period 30. The invariant that separates them is therefore the
    ALPHABET USED PER PARITY CLASS, which is 6 and 10, against a null of 13.84
    plus or minus 1.15 for 31 uniform draws from 16 symbols.
    (3) THE REPAIRED BAND IS COMPUTED AND ITS FALSE-POSITIVE RATE IS STATED. At
    a threshold of 8 the null is 5.1 standard deviations away, giving about
    1.7 times 10^-7 per parity class per digest, about 3 times 10^-3 across two
    classes and a corpus of 10^4 digests. The placeholders score 6, which is 6.8
    standard deviations below the null mean and 1.7 below the threshold. Both
    directions have margin.
    (4) A DEFECT OF KNOWN SIZE FIRES AT A PREDICTED MAGNITUDE. The decay ladder
    has computed values 6.0, 7.5, 8.8, 10.8 and 13.3 at k equal to 0, 5, 10, 20
    and 40, crossing the threshold between k = 5 and k = 10, so the control can
    fail on magnitude and not merely on direction.
    (5) THE CALIBRATION ARM IS UNDERPOWERED AND ITS REQUIRED SIZE IS STATED
    RATHER THAN THE CLAIM SHRUNK. With per-role sensitivity near one half the
    independent joint-miss probability is 0.125 and an escape-correlation factor
    of 2 gives 0.25. Distinguishing those at three sigma needs
    n at least 9 times 0.1875 times 0.8125 divided by 0.125 squared = 88
    packages PER DEFECT CLASS, i.e. about 528 packages and about 1584
    role-reviews for a six-rung ladder. That exceeds any plausible batch budget
    in this program, so the arm is DECLARED UNDERPOWERED and any number it
    produces at a smaller size may not be used to choose between the two
    remedies it exists to distinguish.
    (6) A MINOR ARITHMETIC CORRECTION IS RECORDED. The source proposal's null
    standard deviation is computed for 63 transitions, i.e. a 64-nibble string.
    The actual placeholders are 62 nibbles with 61 transitions, so the correct
    per-rule standard deviation is
    sqrt(61 times (1/16) times (15/16)) divided by 61 = 0.031.

  scale_relevance:
    tier: null
    justification: >-
      Not a scaled measurement. The detector phase runs over the corpus as it
      stands and transfers to no other corpus. The calibration phase is a
      property of the sampled defect ladder and of the roles as configured.
    correspondence: null

  tail_checks:
    - >-
      Report the empirical MINIMUM of the D2 prime statistic over all genuine
      digests, individually with its record identifier. That minimum, not the
      mean, is what sets the usable threshold, and if it is at or below 8 the
      threshold must be revised before any placeholder is flagged.
    - >-
      Report the maximum of the proposed D2 statistic over all genuine digests
      and over the placeholders, so the refutation in C-D2-IS-REFUTED is visible
      in the data rather than only in this contract.

  replication:
    seeds: [20260904, 20260905, 20260906]
    independent_instances: 3

  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 8
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - >-
      Phase 1, the detector sweep over the committed ledger, is read-only and
      runs to completion first. It touches nothing and can only add information.
    - >-
      If C-MATCHED-NULL-GENUINE fires on any genuine digest, stop and withdraw
      D2 prime pending recalibration before any placeholder is flagged.
    - >-
      If C-DECAY-LADDER does not reproduce the predicted magnitudes within one
      standard deviation, stop; the statistic is not measuring the claimed
      structure.
    - >-
      The calibration phase does not start unless the sample size available
      meets the stated requirement of 88 packages per defect class. Running it
      smaller produces a number that cannot answer the question and is
      forbidden by this contract.

  invalidation_rules:
    - Any planted artifact appearing outside a sandbox copy.
    - Any plant manifest unsealed before all verdicts are in.
    - Any D1 check using assumed rather than declared algorithm constants.
    - Any escape-correlation number reported from fewer than the required
      packages per class.
    - Any use of D2, the refuted statistic, as a positive detector.

  success_criterion: >-
    Phase 1 completes: D1, D2, D2 prime and D3 are evaluated for every artifact
    hash claim in the committed ledger; the four known placeholders are flagged
    by D1 and by D2 prime and NOT by D2; no genuine digest is flagged by either;
    the decay ladder reproduces its predicted magnitudes; and D3's coverage
    across the corpus is reported. The calibration phase succeeds only if it
    runs at the required sample size, and is otherwise reported as not run.

  falsification_criterion: >-
    HEUR-001 is falsified if any genuine corpus digest scores 8 or below on
    D2 prime. HEUR-002 is falsified if the decay ladder is not monotone or does
    not cross the threshold between k = 5 and k = 10. The REFUTATION OF D2
    recorded in this contract is itself falsified if any placeholder scores
    above 0.5 on the proposed transition-fraction statistic, in which case the
    computation here is wrong and must be corrected before D2 is retired.

  required_artifacts:
    - the per-claim table of D1, D2, D2 prime and D3 results across the ledger
    - the empirical distribution of D2 prime over genuine digests, with its
      minimum and the identifier of the record achieving it
    - the four placeholders' D2 and D2 prime values, exhibiting the refutation
    - the decay ladder results against the predicted magnitudes
    - the false-positive lookalike results, reported separately
    - D3's coverage fraction and the list of claims whose path is absent
    - the sealed plant manifest and the sandbox paths, with a check that no
      planted artifact reached the ledger
    - an explicit record that the calibration arm is underpowered, with its
      required sample size, if it is not run
    - run manifest per AGENTS.md artifact policy

  limitations:
    - >-
      NOT A CRYPTOGRAPHIC CLAIM AND NOT AN ACCUSATION. This is an instrument
      about this program's own process. No curve and no cryptographic object
      appears, so the curve-free-null requirement is discharged by construction.
    - >-
      D1 AND D2 PRIME ARE FILLER DETECTORS, NOT FABRICATION DETECTORS. A hash
      fabricated from a genuine-looking random string defeats both. Only D3
      addresses the general case, and its coverage is measured here precisely
      because it may be low.
    - >-
      UNDERPOWERED ARM, DECLARED WITH ITS REQUIRED SIZE. The escape-correlation
      calibration needs about 88 planted packages per defect class, about 1584
      role-reviews across a six-rung ladder. Below that it cannot distinguish
      the sensitivity remedy from the differentiation remedy, which is the
      entire reason for measuring it.
    - >-
      Reviewers who learn plants exist change behaviour, so any measured
      sensitivity is an UPPER bound on unprimed sensitivity, and capture-
      recapture with heterogeneous defect classes yields a FLOOR on undetected
      defects, never an estimate.
    - >-
      EV-ECDLP-65b004's substantive numbers are NOT invalidated by the hash
      defect; the record itself says they were independently spot-checked. Only
      the hash-based integrity claim is affected, and this contract must not be
      cited as impugning anything else in it.
    - >-
      Scope: the committed ledger at the time of the run, the declared hash
      algorithms, and the sampled defect ladder.

  assigned_to: executor
  approved_by: null
