experiment:
  id: EXP-TORS-b91e22
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-bd5d91
  question_id: RQ-TORS-8c7b79
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE k-RESAMPLE NULL IS FORCED FOR EXACTLY THE STATISTICS L7 IS MOST TEMPTED TO MEASURE,
    SO IT IS NOT A NULL FOR THEM: build a two-layer instrument -- a STATIC INPUT-PROVENANCE GATE that
    mechanically refuses any statistic whose implementation never reads (P, Q), and the empirical
    k-resample null applied only to statistics that survive the gate -- with a graded planted-leak
    positive control that has three interior points, not two ends'
  status: draft
  objective: "(A) THE PROBLEM WITH THE LANE'S OWN MANDATED NULL, STATED PRECISELY. RQ-TORS-8c7b79\
    \ and the BATCH-cb71b5 brief mandate the canonical control \"resample k with the curve held fixed;\
    \ any statistic that still appears to correlate is an artifact.\" That control is correct and\
    \ necessary. It is also, for a large and important subclass of L7 statistics, FORCED -- and KN-TECH-1a5b7e\
    \ obligation 4 says a contrast whose value is derivable before the run carries no information\
    \ about the question, however cleanly it replicates. THE DERIVATION: let s be a statistic whose\
    \ implementation is a function of (p, a, b) alone -- the Elkies/Atkin classification, the factorisation\
    \ type of psi_ell, the kernel count kappa_ell, the volcano level, the class fingerprint, the Frobenius\
    \ eigenvalues on E[ell]. Under k-resampling with the curve fixed, s does not change AT ALL, so\
    \ the measured correlation between s and k is exactly the sampling noise of the correlation estimator\
    \ on a constant vector, i.e. identically zero variance in the s coordinate and hence a correlation\
    \ of zero or undefined. The null \"passes\" with probability 1, by construction, on every such\
    \ statistic, forever. Under KN-TECH-1a5b7e's checklist line `can_this_null_fail`, the honest answer\
    \ for these statistics is NO -- and that entry's own rule is that if a null cannot fail it is\
    \ not a null. CONSEQUENCE: running the k-resample null on a curve-only statistic and reporting\
    \ the resulting zero as a controlled negative would be recording an algebraic identity as an experimental\
    \ result. That is the specific failure this proposal exists to make impossible, and it is a live\
    \ risk because at least four proposals in this batch compute curve-only statistics.\n(B) LAYER\
    \ 1 -- THE STATIC INPUT-PROVENANCE GATE, WHICH COSTS NO COMPUTE AND RUNS FIRST. A statistic is\
    \ registered with the instrument as a callable plus a declared input signature. The gate does\
    \ three things mechanically:\n  G1 -- SIGNATURE CHECK: does the callable's declared signature\
    \ accept the\n    point data (P, Q) at all? If not, the statistic is CURVE-ONLY and is\n    stamped\
    \ k-independent by construction. No null is run. The verdict is\n    recorded as `k_independent_by_construction`,\
    \ which is a DIFFERENT verdict\n    from `null_passed` and must never be reported as the latter.\n\
    \  G2 -- TAINT CHECK: for statistics that do accept (P, Q), run the statistic\n    twice on the\
    \ same curve with two different points and assert the outputs\n    differ on at least one of a\
    \ declared battery of point pairs. A statistic\n    that accepts points and ignores them is curve-only\
    \ in disguise; the taint\n    check catches it empirically where the signature check cannot.\n\
    \  G3 -- SECRET-LEAK CHECK, and this one is a circularity guard rather than a\n    provenance\
    \ one: assert that the statistic's input path never receives k,\n    the harness ground truth,\
    \ or the discrete-log-solving oracle. The toy\n    harness stores k inside ECDLPInstance for verification\
    \ purposes\n    (harness/toycurve.py), which makes accidental leakage EASY, and a statistic\n\
    \    that reads k is measuring its own input. G3 is implemented by passing the\n    statistic\
    \ a redacted instance object that raises on any access to k.\nTHE GATE IS THE PROPOSAL'S PRIMARY\
    \ DELIVERABLE. It converts the lane's hard constraint -- \"a statistic computed from the curve\
    \ alone is independent of k by construction\" -- from a sentence in a brief into a mechanical\
    \ refusal, and it costs nothing.\n(C) LAYER 2 -- THE EMPIRICAL k-RESAMPLE NULL, APPLIED ONLY TO\
    \ SURVIVORS, WITH THE FULL KN-TECH-1a5b7e OBLIGATION SET FILLED. For a statistic s that passes\
    \ G1-G3, the null holds (E, P) fixed and resamples k, recomputing s(E, P, [k]P). Obligations,\
    \ in the entry's own order:\n  OBJECT REMOVED: the association between the statistic's value and\
    \ the\n    particular secret k. OBJECT PRESERVED (the list that matters more): the\n    curve,\
    \ the base point, the group order N, the cofactor structure, the\n    torsion data, the field\
    \ size, and the statistic's entire implementation.\n  STATISTIC: one entry per statistic, never\
    \ one per null.\n  STATISTIC_READS_THE_OBJECT: proved by G2, not asserted.\n  SENSITIVITY DEMONSTRATION:\
    \ the graded planted-leak family in (D), with a\n    NAMED comparator (the k-resample arm itself,\
    \ which is the arm the null is\n    about), a numeric threshold declared before the run, both\
    \ ends of the\n    dynamic range exhibited, and AT LEAST THREE INTERIOR POINTS with an\n    explicit\
    \ monotonicity report -- because KN-TECH-1a5b7e's own worked case\n    records a two-point gate\
    \ passing while the statistic was non-monotone in\n    between, so the instrument was fit to DETECT\
    \ a departure and unfit to SIGN\n    one.\n  FORCED VALUE: derived per statistic before the run.\
    \ For curve-only statistics\n    the forced value is zero and the gate refuses them; for point-reading\n\
    \    statistics the forced value must be computed and reported, and if it equals\n    the expected\
    \ observation the design is rejected before it runs.\n  ALTERNATIVE EXHAUSTIVENESS: the decision\
    \ rule emits LEAK, NO-LEAK, or\n    NEITHER, with the NEITHER branch and its action declared in\
    \ advance.\n\n(D) THE GRADED PLANTED-LEAK POSITIVE CONTROL, WHICH IS WHAT MAKES ANY NULL HERE\
    \ CITABLE. Define a family of synthetic statistics indexed by a leak fraction t in [0, 1]:\n \
    \ s_t(E, P, Q) = with probability t, the true low bit of k (available to the\n  control harness\
    \ only, never to a real statistic); with probability 1 - t, a\n  fresh uniform bit.\nAt t = 0\
    \ the statistic is pure noise and the instrument must return NO-LEAK. At t = 1 it is a perfect\
    \ one-bit leak and the instrument must return LEAK. The control is run at t in {0, 0.1, 0.25,\
    \ 0.5, 0.75, 1} -- four interior points -- and the instrument must be MONOTONE across them. THE\
    \ DETECTION THRESHOLD AT WHICH THE INSTRUMENT FIRST RETURNS LEAK IS THE INSTRUMENT'S SENSITIVITY,\
    \ and it is the number that every L7 null in this batch must be reported against: a null from\
    \ an instrument that cannot detect a 25 percent one-bit leak is a statement about the instrument's\
    \ blindness, not about the statistic. MAXIMAL-REMOVAL CONTROL (KN-TECH-1a5b7e mode 2): total removal\
    \ must be at least as extreme as partial removal and on the same side. Implemented by replacing\
    \ Q with a uniformly random point of G, which removes ALL of the k-association rather than re-randomising\
    \ it; the measured contrast there must be at least as large as under k-resampling and in the same\
    \ direction. If it is not, the null is inverted and every verdict is void.\n(E) WHY THIS IS NOT\
    \ MERELY HYGIENE. The instrument decides between two competing explanations for every null L7\
    \ produces: (i) the statistic genuinely carries no information about k, or (ii) the instrument\
    \ cannot see information about k at the effect size in question. Those are different claims with\
    \ different consequences, and no L7 negative in this batch can be told apart without the graded\
    \ control in (D). This proposal supplies the discrimination."
  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: 'ADMISSIBLE. This proposal consumes no non-generic resource and mounts no
    attack; it is an instrument in the sense of L14 (RQ-INSTR-f8faa0), applied to L7''s specific hard
    constraint. The admissibility filter of DECOMPOSITION.md section 2 does not bind because nothing
    here applies any map to points of G in order to gain an advantage -- the only maps applied to
    points are the statistics under test, and the instrument''s job is to characterise them, not to
    use them. The instrument''s OUTPUT, however, is what makes the other L7 proposals'' admissibility
    arguments checkable: a statistic that fails G1 is curve-only and its lane must say so, which is
    the mechanical form of the filter.'
  reachability_gate: 'NOT APPLICABLE, and stated rather than omitted. The instrument moves between
    no curves; every measurement holds (E, P) fixed by construction, which is the definition of the
    null it implements. T5 imposes no cost. One consequence for lanes that DO move between curves:
    a statistic evaluated after transport must be re-registered with the gate, because transport changes
    the curve and a statistic that was point-dependent on E may be curve-only on E'' if its implementation
    silently recomputes curve data. The gate is cheap enough to re-run per transport and the record
    recommends it.'
  inputs:
    procedure: 'STAGE 0 (zero compute): the forced-null derivation of claim (A), written out, and
      the four-verdict taxonomy. Complete without any run and already useful. STAGE 1 (hours): implement
      the registry and G1-G3; run G1-G3 over the statistics named in this batch''s L7 proposals; publish
      the verdict table. STAGE 2 (hours, HARD GATE): the graded planted-leak family at t in {0, 0.1,
      0.25, 0.5, 0.75, 1}, M in {100, 300, 1000, 3000}, >= 8 comparator ensemble draws. Report t*,
      monotonicity, and the derived-versus- observed false-positive rate. Nothing else in L7 is reported
      until this passes. STAGE 3 (minutes): maximal-removal control. STAGE 4 (minutes): the frozen
      t = 1 reproduction fixture. BUDGET: minutes to a couple of CPU-hours total; the instrument itself
      uses no division polynomials and no isogenies, so it has no ell-dependence and no ell <= 13
      cap. It runs at 16-24 field bits with N >> M asserted per cell.'
    mechanism: 'STEP 1 (implementation, low) -- the registry and the gate. A statistic is registered
      as (name, callable, declared_inputs, lane, owning proposal id). G1 inspects declared_inputs.
      G2 evaluates the callable on a declared battery of point pairs on a fixed curve. G3 passes a
      redacted instance whose `k` attribute raises on access, and asserts the callable completes.
      Output: one of four verdicts -- `k_independent_by_construction`, `constant_despite_reading_points`,
      `point_dependent_admitted`, `rejected_reads_secret`.

      STEP 2 (implementation, low) -- the k-resample harness. Given (E, P) and a registered point-dependent
      statistic, draw M >= 100 fresh k values with a recorded seed, compute s each time, and report
      the empirical distribution plus the association statistic against k declared per statistic in
      advance (the default is a permutation-tested mutual-information estimate on binned s, with the
      binning declared before the run).

      STEP 3 (the graded control, and this is the part that must not be skipped) -- implement s_t
      and run the whole pipeline at t in {0, 0.1, 0.25, 0.5, 0.75, 1}. Report: the emitted verdict
      at each t; whether the verdict sequence is monotone; the detection threshold t* at which LEAK
      is first emitted; and the false-positive rate of the decision rule, DERIVED before the run and
      CHECKED after (KN-TECH-1a5b7e mode 5).

      STEP 4 (the maximal-removal control) -- replace Q by a uniform random point of G and confirm
      the contrast is at least as extreme as under k-resampling and on the same side.

      STEP 5 (comparator replication) -- the k-resample arm is a GENERATED comparator, so per KN-TECH-1a5b7e
      mode 5 it must be replicated: at least 8 independent draws of the whole resample ensemble, with
      the interval reported rather than a single draw. A residual read against a single comparator
      draw is not admissible.

      STEP 6 (adoption) -- run G1-G3 over every statistic named in this batch''s L7 proposals and
      publish the verdict table. That table is the deliverable other lanes consume, and producing
      it costs minutes.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - t = 0 arm run FIRST, must emit NO-LEAK (blocking, mode-4 guard)
  - t = 1 arm, must emit LEAK (blocking, blindness guard)
  - four interior points with monotonicity report (blocking)
  - maximal removal, Q replaced by a uniform random point of G (blocking, mode-2 guard)
  - '>= 8 comparator ensemble draws with the interval reported (blocking, mode-5 guard)'
  - M-ladder decay check on the t = 0 arm (blocking)
  - N >> M assertion per cell
  - 'NULL OBJECT (from the proposal): MANDATORY AND SUPPLIED -- AND THIS PROPOSAL''S NULL IS ITS OWN
    INSTRUMENT TURNED ON ITSELF, which is the only honest option for a control proposal. MATCHED NULL
    OBJECT: the t = 0 arm of the graded planted-leak family -- a statistic of the identical shape
    (one bit, same call signature, same binning) that provably carries NO information about k. The
    instrument must return NO-LEAK there. KN-TECH-1a5b7e''s `verdict_on_the_null_arm` line is explicit
    that this arm is RUN FIRST; if it emits the same label as the real arm, the rule is in mode 4
    and is void. DECAY PARAMETER: the leak fraction t. The instrument''s association statistic must
    DECAY monotonically to the noise floor as t decreases to 0. A statistic that does not decay as
    the planted leak is removed is the canonical artifact tell (docs/inventor-protocol.md section
    3) and would mean the instrument is responding to something other than the leak. SECOND DECAY
    PARAMETER: the resample count M. The estimated association on the t = 0 arm must shrink like M^{-1/2}.
    If it does not, there is a fixed non-decaying component in the estimator, and KN-TECH-1a5b7e''s
    own algebra (excess = sqrt(1 + 2 M b^2 / k) for a fixed bias b) says that a contrast growing with
    M is one number reported many times, not evidence. CAN THIS NULL FAIL? YES -- and that is the
    test the lane''s mandated null itself fails on curve-only statistics, which is the whole point
    of claim (A). The graded control can fail at t = 1 (blindness), at t = 0 (false positive), or
    in between (non-monotonicity), and each failure has a distinct declared action.'
  independent_variables: []
  metrics:
    primary:
    - gate verdict per registered statistic, with the four-verdict taxonomy
    - t*, its interval, and the monotonicity flag
    - derived and observed false-positive rate of the decision rule
    - association statistic per (t, M), with comparator intervals
    secondary:
    - maximal-removal contrast versus k-resample contrast, signed
    - pass/fail of every gate control
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Verdict on the t = 0 arm (pure noise statistic), over >= 8 independent comparator ensembles,
      M = 1000
    formula: NO-LEAK on every ensemble draw, with the derived false-positive rate matching the observed
      rate to within its binomial interval. A single LEAK on the t = 0 arm at a rate exceeding the
      derived FPR puts the rule in KN-TECH-1a5b7e mode 4 and voids every verdict. BASIS - the FPR
      is DERIVED from the declared decision rule before the run; the derivation is part of the deliverable
      and is UNTESTED at the time of writing.
    source: pre-registered in IDEA-20260807-bd5d91 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - Choice of association statistic. k has no metric structure relevant to the group, so correlation-style
    statistics against integer k are close to meaningless; a binned mutual-information or permutation-tested
    contingency statistic is the declared default. A poorly chosen statistic will report NO-LEAK for
    everything including t = 1, which is why the t = 1 arm is blocking.
  - Small N at toy scale. If N is not much larger than M, resampling k approaches enumerating it and
    the resample ensemble is not independent of the base point structure. Asserted per cell.
  - Multiple statistics. Registering many statistics and reporting the most extreme verdict is a multiple-comparison
    error; the family-wise correction must be declared with the registry, before any statistic is
    run.
  - The redaction in G3 is a Python-level guard. It catches accidental reads and does not constitute
    a security boundary; a statistic that reconstructs k by solving the instance would pass G3 and
    is a CIRCULARITY failure that only a human reviewer catches. The record names this limit rather
    than implying the gate is complete.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: NO-LEAK on every ensemble draw, with the derived false-positive rate matching
    the observed rate to within its binomial interval. A single LEAK on the t = 0 arm at a rate exceeding
    the derived FPR puts the rule in KN-TECH-1a5b7e mode 4 and voids every verdict. BASIS - the FPR
    is DERIVED from the declared decision rule before the run; the derivation is part of the deliverable
    and is UNTESTED at the time of writing.
  falsification_criterion:
  - The t = 0 arm emits LEAK at a rate above the derived false-positive rate. The decision rule is
    in mode 4; every verdict it has emitted is void and the instrument is not delivered.
  - The t = 1 arm emits NO-LEAK. Total blindness; the instrument is not delivered and no L7 null in
    this batch may cite it.
  - The verdict sequence is non-monotone in t. The instrument may be used to DETECT but never to SIGN,
    and every downstream record must carry that restriction explicitly.
  - Maximal removal produces a smaller or oppositely signed contrast than k-resampling. Mode 2; the
    null is inverted and the design is withdrawn.
  - G1 stamps a statistic `k_independent_by_construction` that G2 shows to be point-dependent. The
    gate is unsound and must be fixed before use; a false curve-only stamp is the worst failure this
    instrument can have, because it suppresses a measurement that should have been run.
  - The t = 0 association does not decay as M^{-1/2}. A fixed estimator bias exists; the association
    statistic must be replaced before any null is reported.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-bd5d91
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
    than absent so a reader cannot mistake it for an overlooked one.'
