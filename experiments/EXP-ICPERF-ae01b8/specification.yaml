# EXP-ICPERF-ae01b8
# Cap-locus byte arithmetic. No archived row.
# Approved by DEC-20261002-bbae5a.
experiment:
  id: EXP-ICPERF-ae01b8
  hypothesis_id: H-ICPERF-23397f
  source_idea: IDEA-20260926-dacb83
  question_id: RQ-ICPERF-94c86e
  version: 1
  title: Cap-locus byte arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-bbae5a
  objective: >-
    Check the degree-4 binomials at 140 unknowns, the byte-product
    remainder, and the cap exponent bands.
  inputs:
    n_bool: 140
    c2: 9730
    c3: 447580
    c4: 15329615
    c4_factor_a: 35
    c4_factor_b: 139
    c4_factor_c: 23
    c4_factor_d: 137
    written_c4: 15331915
    written_c4_excess: 2300
    degree_at_most_2: 9871
    column_count: 15787066
    row_factor: 131
    row_count: 1293101
    product: 20414270831666
    product_mod_8: 2
    floor_bytes: 2551783853958
    ceil_bytes: 2551783853959
    row_log_low: 2030
    row_log_high: 2031
    col_log_low: 2391
    col_log_high: 2392
    byte_log_low: 4121
    byte_log_high: 4122
    log_scale: 100
    m5_bit_low: 3471
    m5_bit_high: 3472
    m5_byte_low: 3171
    m5_byte_high: 3172
    collapsed_bit_low: 2767
    collapsed_bit_high: 2768
    collapsed_byte_low: 2467
    collapsed_byte_high: 2468
    walk_low: 2671
    walk_high: 2672
    collapsed_walk_low: 1967
    collapsed_walk_high: 1968
    log2_131_low: 703
    log2_131_high: 704
    rho_gap_hundredths: 2527
    rho_shift_hundredths: 4063
    cap4_sum_low: 13558
    cap4_sum_high: 13559
    written_cap4: 3390
    cap6_sum_low: 14049
    cap6_sum_high: 14050
    written_cap6: 2342
    cap8_sum_low: 14629
    cap8_sum_high: 14630
    written_cap8: 1829
    cap5_sum_low: 13790
    cap5_sum_high: 13791
    written_cap5: 2758
    oracle_gap_low: 949
    oracle_gap_high: 951
    rho_margin_low: 891
    rho_margin_high: 892
  controls:
    - >-
      C(140, 4) is 15329615. Reporting 15331915 invalidates the run.
    - >-
      The row-column product leaves remainder 2 modulo 8. Reporting
      an integer quotient by 8 invalidates the run.
    - >-
      Both byte logarithms lie strictly above 4121/100 and strictly
      below 4122/100. Reporting a byte logarithm of at most 4121/100
      invalidates the run.
    - >-
      The uncollapsed byte logarithm lies strictly below 3172/100.
      Reporting it as at least 34 invalidates the run.
    - >-
      The collapsed byte logarithm lies strictly below 2468/100.
      Reporting it as 2470/100 invalidates the run.
    - >-
      Four times 3390 is 13560, which is above 13559. Reporting the
      m = 4 cap logarithm as 3390/100 invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {binomials, exponents}
    - route in {products, powers}
  metrics:
    primary:
      - column_count
      - byte_log_band
      - implementations_agree
    secondary:
      - product_remainder
      - cap_exponent_bands
      - rho_exponent_identity
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The column count 15787066 and the byte band from 4121/100 to 4122/100.
    formula: >-
      C(140, 4) is 35 times 139 times 23 times 137. The column count
      adds 1, 140, C(140, 2) and C(140, 3). The row count is 131 times
      the degree-at-most-2 count. The base-2 logarithm bands are the
      strict powers that bracket the hundredth scale. The cap exponent
      at arity m is (log2(m!) + 131) / m, compared in hundredths after
      clearing the denominator.
    source: >-
      IDEA-20260926-dacb83 states the column and the written
      hundredths, read 2026-10-02. The binomials and the powers were
      computed in this design session. That computation is not a run.
      No archived resident-set row was opened.
  scale_relevance:
    tier: toy
    justification: One binomial table at 140 unknowns and four cap exponents. No transfer to a built matrix.
    correspondence: null
  tail_checks:
    - The strict power brackets are required. A floor logarithm reported as the value is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If C(140, 4) is reported as 15331915, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - C(140, 4) is not 15329615.
    - The product remainder modulo 8 is not 2.
    - A byte logarithm is reported as at most 4121/100.
    - The m = 4 cap logarithm is reported as 3390/100.
    - An archived resident-set row is opened or a matrix is built.
  success_criterion: >-
    Both runs agree that C(140, 4) is 15329615, the column count is
    15787066, the product leaves remainder 2 modulo 8, both byte
    logarithms lie strictly between 4121/100 and 4122/100, the
    uncollapsed byte logarithm lies strictly between 3171/100 and
    3172/100, and the m = 4 cap sum lies strictly between 13558 and
    13559.
  falsification_criterion: >-
    The runs agree, C(140, 4) stays 15329615, and any factor differs
    from the preregistered table.
  required_artifacts:
    - experiments/EXP-ICPERF-ae01b8/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ICPERF-ae01b8/runs/<RUN-ID>/command.txt
    - experiments/EXP-ICPERF-ae01b8/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ICPERF-ae01b8/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ICPERF-ae01b8/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ICPERF-ae01b8/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any opening of an archived resident-set row.
    - Any matrix construction or rank computation.
    - Any claim that an oracle binds a memory budget on a real curve.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
