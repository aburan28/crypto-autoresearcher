experiment:
  id: EXP-SSIQ-975f7e
  hypothesis_id: H-SSIQ-85f1f1
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  source_idea: IDEA-20261006-14ca06
  version: 1
  designed_at: '2026-10-10'
  title: >-
    Complete finite scan of order-sensitive smooth factor prefixes
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-10'
  frozen: true
  execution_authorized: true
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261010-d6e558
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      One complete deterministic scan of 7-smooth integers D in
      (30, 180] at X=30, using only ascending and descending prime
      factor orders. No curve or isogeny is evaluated.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false
      applied: true
  claim_tier: toy
  objective: >-
    Decide the exact prediction in IDEA-20261006-14ca06: whether at
    least one 7-smooth D in (30, 180] has ascending and descending
    longest-prefix products differing by at least a factor of two,
    with exactly one corresponding cofactor strictly above 30.
    Record every eligible integer, even after the first qualifying D.
  inputs:
    B: 7
    X: 30
    first_D: 31
    last_D: 180
    allowed_primes: [2, 3, 5, 7]
    factorization: >-
      For each integer D from 31 through 180 inclusive, divide by
      2, 3, 5, and 7 repeatedly, retaining each factor occurrence.
      D is eligible exactly when the remaining quotient is 1.
    prefix_rule: >-
      Sort the retained multiset once in nondecreasing order and once
      in nonincreasing order. For each order choose the longest
      initial segment whose exact integer product is at most 30.
      Record that product P and the exact integer cofactor C = D/P.
    qualification_rule: >-
      A row qualifies exactly when max(P_ascending, P_descending)
      is at least 2*min(P_ascending, P_descending) and the Boolean
      values C_ascending > 30 and C_descending > 30 differ.
    driver: experiments/EXP-SSIQ-975f7e/implementation/run.py
    checker: experiments/EXP-SSIQ-975f7e/implementation/check.py
  controls:
    - id: eleven-exclusion
      statement: 11 is not 7-smooth and must be rejected by the factorizer.
    - id: thirty-boundary
      statement: 30 is 7-smooth but must not occur in the scored domain.
    - id: thirty-two-equality
      statement: D = 32 has factor multiset [2, 2, 2, 2, 2] and equal prefix products under both orders.
    - id: complete-domain
      statement: >-
        The driver scans every integer from 31 through 180, exactly
        150 candidates. The checker independently enumerates the
        same domain and requires the ordered raw list to contain
        exactly every eligible D, with no duplicate or omission.
    - id: exact-arithmetic
      statement: >-
        Every retained factor is in {2, 3, 5, 7}, its product equals
        D, each prefix divides D, and no floating-point arithmetic
        enters a predicate.
  independent_variables:
    - integer D in the complete fixed range 31 through 180
    - prime-factor order, ascending or descending on the same multiset
  metrics:
    primary:
      - id: qualifying_integer_count
        statement: >-
          Number of eligible D for which the factor-two prefix
          condition and opposite-side cofactor condition both hold.
      - id: qualifying_rows
        statement: >-
          Exact D, factor multiset, both prefix products, both
          cofactors, and both predicate values for each qualifying D.
    secondary:
      - id: eligible_integer_count
        statement: Number of 7-smooth integers in the fixed domain.
      - id: eligible_rows
        statement: >-
          The ordered arithmetic detail for every eligible integer,
          including nonqualifying ones. The checker independently
          rescans the full 150-integer domain.
      - id: control_results
        statement: >-
          Boolean pass or fail for each recorded control, with the
          D = 32 arithmetic in its eligible row.
  heuristic_under_test: null
  preregistered_prediction:
    quantity: qualifying_integer_count on the fixed complete domain
    formula: >-
      Success is qualifying_integer_count >= 1 with all controls
      passing. The concrete negative is qualifying_integer_count = 0
      after all 150 integers are classified and all controls pass.
    source: >-
      IDEA-20261006-14ca06, based on the prefix rule in the proof
      of Lemma 3.4 of the archived Wesolowski 2026 paper.
  scale_relevance:
    tier: toy
    justification: >-
      This is exhaustive exact arithmetic on 150 small integers.
      The values are not sampled isogeny degrees, and no transfer
      to another range or to cryptographic parameters is assumed.
    correspondence: Direct enumeration of the frozen integer domain.
  tail_checks:
    - >-
      Show the D = 32 equality row and the 11 and 30 control
      observations in the raw artifact.
    - >-
      Report the complete ordered list of eligible D and every
      qualifying row, so the count is reproducible from raw rows.
  replication:
    seeds: []
    independent_instances: 1
    future_run_slot: RUN-SSIQ-be0b59
    note: >-
      The scan is one deterministic complete instance with 150
      integer cells.
      A checker recomputes the predicates from the raw rows and
      compares the domain count and controls; no random seed is used.
  budget:
    enforcement: advisory
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One run covers the full fixed domain. A timeout or resource
      failure is infrastructure and supplies no mathematical count.
  stopping_rules:
    - >-
      Score the claim only after the driver scans every D from 31
      through 180, the eligible rows match the checker's independent
      enumeration, and all controls have been checked.
    - Continue through the full domain after the first qualifying D; never stop on a hit.
    - Do not change the range, factor order, or thresholds after execution begins.
  invalidation_rules:
    - A missing or duplicate domain row, a failed control, an inexact division, or an invalid factorization voids the count.
    - A timeout, crash, or incomplete output is failed infrastructure, not a zero count.
    - A row computed with a different prefix rule or floating-point comparison is invalid.
  success_criterion: >-
    All controls pass, all 150 integers are classified, and
    qualifying_integer_count is at least 1. The reported D values
    witness only the finite order-sensitive predicate.
  falsification_criterion: >-
    All controls pass, all 150 integers are classified, and
    qualifying_integer_count is exactly 0. A control failure,
    incomplete scan, or infrastructure failure is not this outcome.
  decision_impact:
    on_positive: >-
      A later evidence review may record that the chosen factor
      order changes which cofactor exceeds 30 on at least one
      integer in this fixed set. It can motivate a separate audit
      of the order choice under the paper's actual degree bound;
      it does not change a complexity claim.
    on_negative: >-
      A later evidence review may record that the proposed
      order-sensitive threshold event does not occur anywhere in
      this fixed set. It weakens only this finite proposal and
      leaves other ranges and the paper's degree bound unresolved.
  required_artifacts:
    - experiments/EXP-SSIQ-975f7e/runs/RUN-SSIQ-be0b59/manifest.yaml
    - experiments/EXP-SSIQ-975f7e/runs/RUN-SSIQ-be0b59/raw-result.json
  assigned_to: executor
