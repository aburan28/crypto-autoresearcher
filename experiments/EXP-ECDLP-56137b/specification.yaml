    sum x+y calibrator.

  objective: >
    Evaluate the exact identity that on
    p=19, A=1, B=-1, P=(2,3) one has
    [2]P=(16,11), S=x+y=5, S'=8, and
    rejects the nearby invariance claim
    that S'=5, on one frozen family
    (REAL, KF, NULL). Stage 0 does not
    form a real Gamma orbit, does not
    run a unary-closure census, does
    not run Miller or Tate, and does
    not authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL has
      S=5, S'=8; KF invariance claim
      rejected because S'=8; NULL
      empty sum rejected; y=0
      rejected. Certificate kind none.
    formula: >
      Affine doubling then S=x+y.
      REAL: P=(2,3), [2]P=(16,11),
      S=5, S'=8. KF: claim S'=5,
      actual 8, rejected as a generic
      affine-sum target.
    claim_tier: observational

  inputs:
    fixture:
      real_curve:
        p: 19
        A: 1
        B: -1
        P: [2, 3]
        P2: [16, 11]
        must_S: 5
        must_S_prime: 8
      known_false:
        kind: constant_S_prime
        claimed_S_prime: 5
        must_S_prime: 8
        must_reject: true
      matched_null:
        kind: empty_sum
        must_reject: true
      invalid:
        - {y_zero: true, point: [2, 0], must_reject: true}

  controls:
    - name: known_false_constant
      object: KF claim S' equals 5
    - name: matched_null
      object: empty sum
    - name: invalid_y_zero
      object: y=0 undefined doubling

  independent_variables:
    - point
    - affine_chart
  metrics:
    primary:
      - fixture_pass
      - real_sum_pass
      - known_false_constant_pass
      - reject_invalid_pass
      - null_empty_pass
    secondary: []
  primary_metrics:
