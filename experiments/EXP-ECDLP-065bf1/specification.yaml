# contract for H-ECDLP-0fd4b9: structural-width audit of direct encodings
# (IDEA-20261001-e1fcbf). Dual-route Python. ZERO RUNS in this design packet.
# Stages 0-1 authorized for executor TASK-20261003-93a634. No AUXIN.
# Amazon Bedrock prohibited. NO Magma/Sage success path. NO exponent.
# =============================================================================
experiment:
  id: EXP-ECDLP-065bf1
  hypothesis_id: H-ECDLP-0fd4b9
  question_id: RQ-ECDLP-002
  source_idea: IDEA-20261001-e1fcbf
  goal_id: GOAL-ECDLP-001
  version: 1
  title: >-
    Structural-width audit of affine vs projective known-scalar encodings
    on y^2=x^3+x+1 over F_17
  status: approved
  approved_by: DEC-20261003-c6641c
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261003-c6641c under AGENTS.md standing
    user authorization (2026-09-06). No Magma/Sage/AUXIN/Bedrock. No
    inverse solving. No exponent claim.
  approval:
    approved_by: DEC-20261003-c6641c
    composing_decision: DEC-20261003-c6641c
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 freezes cells, formula, dual-route [k]G fixtures and k=1 nearby
      object. Stage 1 measures affine/projective/perm/random-coeff diagnostics
      and writes RESULTS.md with exactly one O-* label.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether toy F_17 affine vs projective forward presentations show
    representation Δ≥1 and/or incidence-matched rank Δ≥1; deliver exactly
    one O-* label from H-ECDLP-0fd4b9.

  class: heuristic_validation
  class_note: >-
    Pre-registered diagnostic Δ bands on a public known-scalar instrument.
    Not an exponent-moving breakthrough; not an inversion experiment.

  scope:
    included:
      - >-
        Stage 0. Freeze preregistered-predictions.json (cells as a list with
        integer p,k) and fixtures.json (dual-route [2]G/[3]G, k=1 nearby).
      - >-
        Stage 1. Affine vs projective vs permutation vs random-coeff meters
        on k=2 and k=3; RESULTS.md with exactly one O-* label.
    excluded:
      - Inverse solving, discrete-log recovery, SAT/Groebner attack paths.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Any exponent-moving or cryptographic-curve transfer claim.
      - Editing IDEA claim text or GOAL-ECDLP-001/goal.yaml / GOAL-ECDLP2M-001.
      - Editing the frozen formula or cells after Stage-0 freeze.
      - Treating infra failure as mathematical evidence.

  execution_surface:
    trial_plan: experiments/EXP-ECDLP-065bf1/trial-plan.json
    command_stage0: >-
      python3 experiments/EXP-ECDLP-065bf1/implementation/run.py --stage 0
      --trial-plan experiments/EXP-ECDLP-065bf1/trial-plan.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-ECDLP-065bf1/implementation/run.py --stage 1
      --trial-plan experiments/EXP-ECDLP-065bf1/trial-plan.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. Twin meters are the
      dual-implementation control. {run_dir} substituted by supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20261001-e1fcbf.yaml
    hypothesis: ledger/hypotheses/H-ECDLP-0fd4b9.yaml
    p: 17
    A: 1
    B: 1
    k2: 2
    k3: 3
    G: [0, 1]
    delta_min: 1
    null_seed: 2026100303
    stage1_cells:
      - {id: toy_f17_k2, p: 17, k: 2}
      - {id: toy_f17_k3, p: 17, k: 3}

  controls:
    - name: twin_width_rank
      definition: meters width_a==width_b and rank_a==rank_b on every scored presentation.
    - name: ctl_dual_addition
      definition: elliptic.add_affine_a and add_affine_b agree on [k]G.
    - name: ctl_perm_iso
      definition: reverse-variable clone preserves n_vars, n_edges, width, rank.
    - name: ctl_random_coeff
      definition: same incidence, different coefficients; rank compared at fixed dimensions.
    - name: ctl_k1_nearby
      definition: dummy k=1 presentation greedy width ≤ 1.
    - name: ctl_witness
      definition: every affine/projective constraint vanishes at the public witness.
    - name: ctl_no_posthoc_formula_edit
      definition: Formula and cells frozen in preregistered-predictions.json before Stage 1.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_measure]
    - name: cell
      levels: [toy_f17_k2, toy_f17_k3]
    - name: presentation
      levels: [affine, projective, perm, random_coeff]

  metrics:
    primary:
      - name: n_vars_delta
        unit: count
        definition: '|n_vars_projective - n_vars_affine|'
      - name: width_delta
        unit: count
        definition: '|width_projective - width_affine| (greedy upper bound)'
      - name: incidence_rank_delta
        unit: count
        definition: '|rank_random_coeff - rank_affine| at equal dimensions'
      - name: twin_agreement
        unit: boolean
        definition: dual addition, width, and rank twins agree
    secondary:
      - name: max_degree
        unit: count
      - name: n_aux
        unit: count
      - name: wall_clock_seconds
        unit: seconds
      - name: peak_rss_bytes
        unit: bytes

  heuristic_under_test: HEUR-ECDLP-e1fcbf-H1

  preregistered_prediction:
    quantity: >-
      Representation Δ≥1 (n_vars/width/degree/aux) and/or incidence rank Δ≥1
      on frozen F_17 cells.
    formula: 'rep_diff := max(|n_vars|,|width|,|max_degree|,|n_aux|) >= 1'
    source: >-
      IDEA-20261001-e1fcbf predictions; frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Two public-known-scalar cells on one F_17 curve. No transfer to
      cryptographic prime-field ECDLP is claimed.
    correspondence: None. Toy diagnostic only.

  tail_checks:
    - Twin disagreement voids diagnostic claims (O-ARTIFACT).
    - perm_iso failure voids the table (O-ARTIFACT).
    - k=1 width >1 voids the instrument (O-ARTIFACT).
    - Witness residual ≠0 on affine/projective voids the table.

  seeds_and_replication:
    null_seed: 2026100303
    independent_instances: 2
    note: >-
      Cells k=2 and k=3 are independent instances. Dual addition plus twin
      width/rank meters are the replication instrument.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and fixtures.json.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-ECDLP-0fd4b9.
    - maximum_runs = 4.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin or perm_iso failure → O-ARTIFACT; do not read Δ as support.
    - Claiming an exponent move or discrete-log solve → protocol invalid.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.

  success_criterion: >-
    Stage 0 artifacts frozen with dual-route [k]G agreement and k=1 width≤1;
    Stage 1 produces per-cell diagnostics (or a named O-ARTIFACT/O-IMPEDIMENT
    stop); RESULTS.md names exactly one O-* label from H-ECDLP-0fd4b9 with
    cited artifacts.

  falsification_criterion: >-
    Any of: twin disagreement; perm_iso fail; post-hoc formula edit; k=1
    width>1; a claimed ECDLP solve/exponent under this card. (O-NO-DIFF and
    O-MIXED are valid scientific labels, not protocol fails.)

  required_artifacts:
    - experiments/EXP-ECDLP-065bf1/trial-plan.json
    - experiments/EXP-ECDLP-065bf1/stage0/preregistered-predictions.json
    - experiments/EXP-ECDLP-065bf1/stage0/fixtures.json
    - experiments/EXP-ECDLP-065bf1/stage1/
    - experiments/EXP-ECDLP-065bf1/RESULTS.md
    - experiments/EXP-ECDLP-065bf1/runs/<RUN-ECDLP-*>/
    - experiments/EXP-ECDLP-065bf1/implementation/run.py
    - experiments/EXP-ECDLP-065bf1/implementation/check.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
