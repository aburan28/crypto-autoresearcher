# =============================================================================
# EXP-DRINF-662e16 — version 1, approved by DEC-20261005-fe1718.
# Frozen count of geometric (T+1)-torsion: size 9 for Phi_T = tau + tau^2
# over F_3, size 3 for the Carlitz reduction Psi_T = tau. Prediction is
# fixed here, before any run. This design session counted no roots.
# Source idea IDEA-20261005-474802 is already on origin/main.
# =============================================================================
experiment:
  id: EXP-DRINF-662e16
  hypothesis_id: H-DRINF-cc79bb
  question_id: RQ-DRINF-6b5a9d
  source_idea: IDEA-20261005-474802
  goal_id: null
  version: 1
  title: >-
    Geometric (T+1)-torsion over F_3: size 9 for Phi_T = tau + tau^2,
    size 3 for the Carlitz reduction Psi_T = tau
  status: approved
  approved_by: DEC-20261005-fe1718
  approved_at: '2026-10-05'
  packaging_only: false
  approval:
    approved_by: DEC-20261005-fe1718
    approved_by_role: coordinator
    composing_decision: DEC-20261005-fe1718
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06: "all is
      approved. ideas/experiments should be always approved") because every
      field the design protocol requires is non-null. Approval does not assert
      that the kernel sizes are 9 and 3.
    implementation_authorized: true
    scientific_execution_authorized: true
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether the distinct geometric roots of the expanded rank-2
    polynomial number 9 and those of the expanded rank-1 polynomial number
    3, or whether a separable expansion has a different size. The
    assignment of each observation is the table mechanism_assignment. An
    inseparable expansion is withdrawn. A disagreement between the two
    count methods is invalid.

  inputs:
    field: F_3
    frobenius: tau sends x to x^3
    rank2:
      rule: Phi_T = tau + tau^2
      expansion_rule: >-
        Phi_1(x) = x. Phi_T(x) = x^3 + x^9. Phi_{T+1}(x) is the
        coefficient-wise sum of those two additive polynomials.
      predicted_polynomial: x + x^3 + x^9
      predicted_kernel_size: 9
    rank1:
      rule: Psi_T = tau
      expansion_rule: >-
        Psi_1(x) = x. Psi_T(x) = x^3. Psi_{T+1}(x) is the
        coefficient-wise sum.
      predicted_polynomial: x + x^3
      predicted_kernel_size: 3
      role: nearby_object_control
    literature_pin:
      note: knowledge/literature/KN-LIT-1515.md
      pdf_paths_named_in_the_note:
        - downloads/2601.02162v1 (1).pdf
        - downloads/2601.02162v1.pdf
      pdf_status_at_design: absent
      instruction: >-
        Record whether either PDF path exists at run time. If a PDF is
        present, read only far enough to compare the Carlitz formula it
        states with Psi_T = tau. Record agrees, disagrees, or not_found.
        Do not replace the frozen polynomials with a formula from memory.
        A missing PDF does not stop the count. A disagreement is recorded
        and the size verdict is then unsigned, because the name Carlitz
        would not match the object that was counted.
    forbidden:
      - Do not compute a Frobenius characteristic polynomial.
      - Do not enumerate isogeny classes.
      - Do not count roots of gcd(f, x^9 - x) as the primary metric.

  controls:
    - id: rank1-carlitz
      statement: >-
        The rank-1 expansion is the nearby object. Size 9 on that control,
        with derivative the constant 1, supports the mis-reading that every
        Drinfeld torsion is a square.
      pass_condition: agreed geometric root count 3, degree-1 coefficient 1, derivative the constant 1
      on_fail: >-
        If the derivative is the constant 1 and the agreed count is not 3,
        assign the negative row. If the derivative is not the constant 1,
        withdraw the example.
    - id: derivative
      statement: >-
        The formal derivative of each expanded polynomial is computed in
        characteristic 3, where the derivative of x^{3k} is 0. It must be
        the constant polynomial 1.
      pass_condition: both derivatives equal the constant 1
      on_fail: >-
        Withdraw the example. Do not interpret a zero derivative as a
        smaller kernel.
    - id: two-counts
      statement: >-
        Method A lists distinct roots in the splitting field. Method B,
        used only when gcd(f, f') = 1, sums the degrees of the irreducible
        factors over F_3. The two integers must agree on each polynomial.
      pass_condition: method A equals method B on both polynomials
      on_fail: >-
        The run is invalid. Do not pick the integer closer to the prediction.
    - id: not-f9
      statement: >-
        Also compute the number of distinct roots of gcd(f, x^9 - x) in
        F_9 and store it as f9_root_count. The primary metric is the
        splitting-field count. On F_9, x^9 = x, so the rank-2 polynomial
        collapses.
      pass_condition: f9_root_count is present and is not copied into the primary metric
      on_fail: A verdict that uses the F_9 count as the kernel size is invalid.

  independent_variables:
    - rank, in {1, 2}, with the module law frozen above
    - which root-count method is applied, on the same expanded polynomial

  metrics:
    primary:
      - id: rank2_geometric_kernel_size
        statement: >-
          Cardinality of the set of distinct roots of the expanded rank-2
          polynomial in its splitting field. Method A. Compared with method B.
      - id: rank1_geometric_kernel_size
        statement: >-
          The same cardinality for the expanded rank-1 polynomial.
      - id: degree1_coefficient
        statement: Coefficient of x in each expanded polynomial, an element of F_3.
    secondary:
      - id: derivative_is_one
        statement: Whether each formal derivative is the constant polynomial 1.
      - id: methods_agree
        statement: Whether method A and method B returned the same integer, per polynomial.
      - id: f9_root_count
        statement: Number of distinct roots of gcd(f, x^9 - x), per polynomial. Not the primary metric.
      - id: pdf_comparison
        statement: absent, agrees, disagrees, or not_found, for the Carlitz formula against Psi_T = tau.
      - id: expanded_polynomial
        statement: Coefficient vector of each expansion, low degree first, coefficients in {0, 1, 2}.

  heuristic_under_test: HA-1
  heuristic_under_test_note: >-
    HA-1 is the size prediction q^{r deg a} at this one element. Its
    failure is a negative result on this element, not a distributional
    law, and not an ECDLP exponent.

  preregistered_prediction:
    quantity: >-
      Distinct geometric root counts of the two expanded polynomials, and
      the degree-1 coefficient of each.
    formula: >-
      Rank 2: polynomial x + x^3 + x^9, size 9. Rank 1: polynomial
      x + x^3, size 3. Both degree-1 coefficients equal 1. A different
      agreed size, while the degree-1 coefficient is 1 and the derivative
      is the constant 1, is the negative.
    source: >-
      IDEA-20261005-474802 predictions, copied before any run of
      EXP-DRINF-662e16. This design session did not adjust the sizes
      after seeing roots, because it computed none. Drinfeld 1974 was
      not opened. The lattice reading stays provenance recalled and is
      not the source of the frozen integers. The integers come from the
      idea record.

  scale_relevance:
    tier: toy
    justification: >-
      The tested parameters are q = 3 and deg(T+1) = 1. A result at this
      element is not a result at larger degree, at another q, or at a
      cryptographic field. No extrapolation is authorized.
    correspondence: >-
      Direct expansion and root counting. No Deuring correspondence and
      no sampling equivalence is used.

  tail_checks:
    - >-
      There is no sampled tail. The census is two polynomials. The
      extreme check is the rank-1 control: size 9 there, with derivative
      the constant 1, is the mis-reading and is a negative, not a tail
      to be dropped.

  replication:
    seeds:
      - name: arithmetic
        algorithm: deterministic polynomial arithmetic over F_3
        seed: 0
        note: >-
          No random generator is consulted. seed 0 records that fact.
          Substituting a random sample of modules is forbidden.
    independent_instances: 2
    independent_instances_note: >-
      The rank-2 polynomial is the claim. The rank-1 polynomial is the
      control. They are not two samples of one distribution.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
    budget_note: >-
      Time and CPU figures are advisory machine-protection watches
      (docs/research-budget-policy.md). They do not cap the two frozen
      polynomials. maximum_runs is 2 so one infrastructure retry may take
      a new run id. Watch expiry is failed_infrastructure, never a
      negative mathematical result.

  procedure:
    expansion: >-
      Work in F_3[x]. Compute Phi_{T+1} and Psi_{T+1} by the expansion
      rules in inputs. Record every coefficient. Do not skip a zero
      coefficient in the middle of the vector.
    derivative: >-
      Differentiate formally. In characteristic 3 the derivative of
      x^{3k} is 0 and the derivative of x is 1. Record the resulting
      polynomial.
    method_A: >-
      Factor into irreducibles over F_3. Build a splitting field by
      always adjoining the lexicographically smallest irreducible factor
      of least degree, coefficients in {0, 1, 2}, low degree first.
      List every root of the original polynomial in that field and count
      the set. Include the root 0. Do not reduce exponents modulo 9
      except inside the separate F_9 column.
    method_B: >-
      If gcd(f, f') is 1, sum the degrees of the irreducible factors.
      If gcd(f, f') is not 1, method B is not run and the derivative
      control has already failed.
    f9_column: >-
      Compute gcd(f, x^9 - x) and count its distinct roots in F_9.
      Store the integer. Do not assign a mechanism row from it.
    mechanism_assignment:
      - observation: >-
          Both expanded polynomials equal the predicted polynomials, both
          derivatives are the constant 1, both degree-1 coefficients are
          1, method A agrees with method B, the rank-2 count is 9, and
          the rank-1 count is 3. pdf_comparison is absent, agrees, or
          not_found.
        assigns_to: >-
          Rank-difference reading on this element. Size 9 against size 3.
          Does not transfer to another element or another q.
      - observation: >-
          Both derivatives are the constant 1, both degree-1 coefficients
          are 1, method A agrees with method B, and at least one count
          differs from its prediction.
        assigns_to: >-
          Negative. The size claim fails on this element. A rank-1 count
          of 9 is the square mis-reading and is this same negative.
      - observation: >-
          A degree-1 coefficient is 0, or a formal derivative is not the
          constant 1.
        assigns_to: >-
          Withdrawn. The separability hypothesis failed. Inconclusive.
          Not a negative and not a smaller kernel.
      - observation: >-
          pdf_comparison is disagrees.
        assigns_to: >-
          The size integers are still reported. The verdict that they
          are the Carlitz comparison is unsigned. Not a size negative
          by itself.
      - observation: >-
          Method A and method B disagree, the F_9 count is used as the
          primary metric, a characteristic polynomial is computed, the
          watch expires, or a dependency is missing.
        assigns_to: >-
          Invalid or failed_infrastructure. Not evidence for either size.

  stopping_rules:
    - Stop when both polynomials have their coefficient vectors, derivatives, both counts or a recorded derivative failure, and the F_9 column.
    - Do not add a prime, an element, or a third module.
    - Watch expiry stops the run as failed_infrastructure.

  invalidation_rules:
    - A timeout, crash, memory abort, or missing dependency is failed_infrastructure and is not evidence against the hypothesis.
    - Using the F_9 root count as rank2_geometric_kernel_size or rank1_geometric_kernel_size invalidates the run.
    - Reporting a size when method A and method B disagree invalidates the run.
    - Computing a characteristic polynomial or an isogeny-class count invalidates the run. That is the other mechanism on this question.
    - Changing the pre-registered sizes after seeing roots is forbidden. A correction is a new amendment record, and existing runs are not re-scored against it.
    - A zero derivative reinterpreted as a kernel of size equal to the number of distinct roots in a non-separable factorization is invalid.

  success_criterion: >-
    The run is a success for the rank-difference reading exactly when the
    first row of mechanism_assignment holds: both polynomials match the
    prediction, both derivatives are the constant 1, the counts are 9 and
    3, and the two methods agree. Any other completed assignment is not
    this success.

  falsification_criterion: >-
    The size claim on this element is falsified when the second row of
    mechanism_assignment holds: derivative the constant 1, degree-1
    coefficient 1, methods agreeing, and a count other than 9 or other
    than 3. The third row falsifies nothing. The fifth row falsifies
    nothing.

  required_artifacts:
    - experiments/EXP-DRINF-662e16/runs/RUN-*/manifest.yaml
    - experiments/EXP-DRINF-662e16/runs/RUN-*/stdout.txt
    - experiments/EXP-DRINF-662e16/runs/RUN-*/stderr.txt
    - experiments/EXP-DRINF-662e16/runs/RUN-*/raw-result.json
    - experiments/EXP-DRINF-662e16/runs/RUN-*/verdict.yaml
  artifact_contents:
    raw-result.json: >-
      Per polynomial: coefficient vector, degree-1 coefficient, derivative,
      method A count, method B count or a statement that method B was not
      run, f9_root_count, and the factor degrees. Plus pdf_comparison.
    verdict.yaml: >-
      Exactly one assignment row from mechanism_assignment, or
      failed_infrastructure with a reason. The verdict quotes the row. It
      does not change hypothesis status.

  assigned_to: executor
  zero_runs_in_design: true
