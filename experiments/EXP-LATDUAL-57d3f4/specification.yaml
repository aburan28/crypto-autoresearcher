experiment:
  id: EXP-LATDUAL-57d3f4
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-f4ce0b; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-f4ce0b
  question_id: RQ-MLKEM-003
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Compute the coefficient-isometry orbit size for rings of equal degree, measure the recovery
    discount of matched module instances over each against a shared unstructured denominator, and
    test whether the discount tracks orbit size
  objective: 'The run reduces one uncertainty: whether the size of the coefficient-isometry orbit
    is the variable that organises the structure discount, or whether the discount is a property of
    the ring that orbit size does not capture. Stated as parts: (i) can g be computed and verified
    exactly for each candidate ring, by exhibiting generators and checking closure, and can at least
    two well-separated g values be realised at one degree within the reachable band; (ii) what is
    the measured discount for each ring against a shared matched unstructured denominator, and how
    does log discount relate to log g across the realised values; (iii) does the discount collapse
    in the orbit-inert null, where the isometries are broken but the dimension, modulus, secret, error
    and sample count are not, and how large is the residual spread among rings verified to have equal
    g. The run is not asked how large the discount is in bits, is not asked anything about deployed
    parameters, and is not asked to validate this program''s index-calculus analogy. A run that finds
    equal-g rings with materially different discounts is a complete and highly informative run: it
    refutes the single-integer representation at these parameters.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for the specific rings constructed,
      at the tested degree, dimension, modulus, secret and error laws and blocksize ceiling, the measured
      discounts against a shared unstructured denominator stood in the reported relation to the verified
      orbit sizes, with the orbit-inert null behaving as reported and the equal-g residual bounded
      as reported. WHAT DOES NOT FOLLOW: no bit-security figure, since no cost model is applied; no
      claim that the amortisation reading of KN-OPEN-026 is correct, since one consequence''s survival
      is not the reading''s establishment; no claim that this program''s index-calculus correspondence
      is real, which KN-OPEN-026 explicitly marks as the program''s own analogy; nothing about ML-KEM,
      FIPS 203, Kyber, Dilithium or any FHE scheme; and no extension to rings outside the constructed
      family.'
  inputs:
    procedure: 'STAGE 0 (cost: 0 compute, ~4h human). Construct and freeze the ring family: moduli,
      irreducibility proofs, exhibited isometry generators, verified group orders. This stage can
      fail outright and its failure is the reported construction obstruction. STAGE 1 (cost: low).
      Matched instance generation per seed across all rings plus the shared unstructured denominator
      plus the orbit-inert null. STAGE 2 (cost: high, dominant). Progressive BKZ plus Babai to exact
      recovery in every arm, recording beta* or censoring. STAGE 3 (cost: low). Discount per ring
      against the shared denominator, per seed, with paired intervals. STAGE 4 (cost: low). Regression
      of log2 discount on log2 g where three or more g values exist; two-point contrast otherwise,
      with the slope explicitly declined. STAGE 5 (cost: low). Orbit-inert null discount and equal-g
      residual spread. STAGE 6 (cost: low). Zero-error positive controls per ring. STAGE 7 (cost:
      low). Emit immutable run records through harness/runner.py with the ring definitions and the
      g verifications attached.'
    instrument: 'Python 3.11 standard library only; numpy, fpylll and Sage are absent from this environment
      and none is used. Polynomial arithmetic modulo the chosen modulus implemented with exact integer
      coefficient lists; irreducibility checked by exact factorisation over small primes plus a distinct-degree
      test implemented directly; isometry generators exhibited as explicit coefficient permutations
      with signs and verified closed by exhaustive composition. Lattice side: exact-integer q-ary
      construction, fractions.Fraction Gram-Schmidt, progressive BKZ, Babai decoding, exact comparison
      against the retained secret. Records through harness/runner.py.'
    parameters: 'degree d in {8, 16}; module rank k with n = k*d and n in {24, 32}; q in {769, 3329};
      m = 2n; centered binomial eta = 2; blocksize ceiling 24; ring family: the cyclotomic modulus
      of degree d, at least one monic irreducible non-cyclotomic modulus of the same degree with verified
      trivial isometry group, and where constructible one intermediate-g modulus; 60 seeds per ring
      per grid point; orbit-inert null derived by a one-coefficient seeded perturbation of the cyclotomic
      modulus with the perturbation magnitude recorded.'
  controls:
  - 'Orbit-inert null: ring A''s modulus perturbed to collapse the isometry group while preserving
    degree and irreducibility.'
  - 'Shared unstructured denominator: one matched unstructured arm per seed, used as the denominator
    for every ring''s discount so that ring comparisons do not inherit denominator noise.'
  - 'g-verification control: for each ring, g explicit isometries exhibited and verified closed under
    composition.'
  - 'Equal-g replication: where two distinct moduli with the same g exist, both are run, and their
    discount spread bounds the law''s residual.'
  - Zero-error positive control in every ring, where recovery must succeed at minimal blocksize.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The orbit-inert null, executed in the same invocation: an instance
    built over a modulus polynomial perturbed by a seeded change of one coefficient, chosen so that
    the polynomial retains its degree and its irreducibility but its coefficient-isometry group collapses
    to the trivial one, while the instance''s dimension, modulus, secret, error and sample count are
    unchanged. Nominal g is recorded as the unperturbed value and operational g is 1. The null must
    show the discount collapsing to that of the matched unstructured arm; if the discount survives
    when the isometries do not, the effect is not amortisation over the orbit and every slope fitted
    on the signal arm is an artifact, recorded as a controlled null under inventor-protocol section
    3. A second control confirms the g computation itself by exhibiting, for each ring, g explicit
    isometries and verifying they form a group of the stated order under composition.'
  independent_variables:
  - verified orbit size g
  - ring identity at fixed degree
  - cyclotomic degree d
  - lattice dimension n
  metrics:
    primary:
    - verified g per ring with generators and closure check
    - discount per ring against the shared unstructured denominator, with paired interval
    - slope of log2 discount against log2 g with interval, where fittable
    - orbit-inert null discount
    secondary:
    - beta* or censoring per instance
    - residual spread among equal-g rings
    - coefficient perturbation magnitude in the inert null
    - censoring fraction per ring
    - wall clock per instance
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The pair (log2 g, log2 discount) per ring at fixed degree, the fitted slope with a 95
      percent interval where three or more distinct g are realised, and the orbit-inert null's discount
      with its interval - reported together with the equal-g residual spread that bounds how much
      of any slope is attributable to g.
    formula: For ring R and seed i, discount_i(R) = beta*_i(unstructured shared denominator) / beta*_i(R).
      The amortisation law under test is log2 median_i discount(R) = c + rho * log2 g(R), with rho
      the prereg slope; rho near 1 is the pure-amortisation prediction, rho near 0 the ring-property
      prediction. The orbit-inert null's predicted discount is 1.00 with its interval containing 1.
      The equal-g residual is max over equal-g ring pairs of |log2 median discount(R1) - log2 median
      discount(R2)|, and the entry reports rho as uninterpretable whenever that residual exceeds rho
      times the realised log2 g range.
    source: Pre-registered in the parent proposal IDEA-20260816-f4ce0b before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Run at d in {8, 16}, n in {24, 32}, q in {769, 3329}, blocksize ceiling 24, in
      pure Python with no numpy and no fpylll available. Toy parameters are forced by requiring exact
      recovery ground truth in every ring arm simultaneously. The transfer assumption is stated as
      none, and is unusually weak here even within the toy tier: because rings of equal degree differ
      in many properties besides g, the result transfers only to the constructed family and only conditionally
      on the equal-g residual being small. Nothing is projected to any deployed parameter set, and
      no bit figure is produced anywhere in this contract.'
    correspondence: null
  tail_checks:
  - The non-cyclotomic ring arm, where coefficient growth may raise censoring relative to the cyclotomic
    arm and confound the comparison.
  - The orbit-inert null's perturbation extreme, where a larger perturbation buys a cleaner isometry
    collapse at the cost of a dirtier match.
  - Seeds where the shared unstructured denominator censors, which void the discount for every ring
    at that seed.
  - Equal-g ring pairs, examined individually rather than only in aggregate, since a single large
    discrepancy refutes the representation.
  - The smallest degree d = 8, where the isometry group may be too small for any g separation to exist.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop STAGE 0 and report a construction obstruction, naming every modulus attempted and its verified
    g, if fewer than two well-separated g values are realised at any degree.
  - Stop a ring arm at 60 seeds or 8 wall-clock hours, reporting achieved counts.
  - Decline the slope and report only the contrast if fewer than three distinct g values are realised.
  - Halt and report a g-verification defect if any exhibited generator set fails closure.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: g is verified by exhibited generators and closure for every ring, at least two
    well-separated g values are realised at one degree, and a discount with a paired interval of width
    at most 0.2 is reported for every ring against the shared denominator, alongside the orbit-inert
    null's discount and the equal-g residual - whatever relation between g and discount emerges.
  falsification_criterion:
  - 'g verification fails closure for any ring: every g is wrong and the design is void.'
  - 'Orbit-inert null retains a discount: the effect is not orbit amortisation and no slope is interpretable.'
  - 'Equal-g rings differ in discount by more than the stated residual: the single-integer representation
    is refuted at these parameters, which is the strongest usable outcome of the contract.'
  - 'Fewer than two distinct g values are constructible: a construction obstruction is reported with
    the rings attempted named, and no measurement follows.'
  - 'The slope interval contains zero across the realised range: orbit size does not organise the
    discount at these parameters.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-f4ce0b
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Whether monic irreducible non-cyclotomic moduli of degree 8 or 16 with verified trivial coefficient-isometry
    group can be constructed and used with the same q and the same primal embedding is not established;
    STAGE 0 may fail and a Coordinator should treat it as a gate rather than a stage.
  - The identification of coefficient spaces across different rings, which is what makes 'the same
    secret' meaningful across arms, is stated but not derived.
  - The coefficient perturbation defining the orbit-inert null changes the lattice as well as the
    isometries, and no derivation bounds how much; a Coordinator must decide whether a cleaner inert
    construction exists.
  - Whether a two-point contrast may be reported at all under docs/claims-and-verification.md, given
    that no slope is fittable from two points, is a claim-tier decision.
