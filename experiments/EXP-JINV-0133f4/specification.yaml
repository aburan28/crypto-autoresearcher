experiment:
  id: EXP-JINV-0133f4
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-d329e2
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'Index the factor base by the Aut-QUOTIENT coordinate on special-j curves (w = y^2 for j=0,
    w = x^2 for j=1728) and derive the resulting summation polynomial: the derivation predicts that
    the quotient multiplies BOTH the fibre size AND the per-variable degree by exactly r = |Aut|/2,
    so the trade is neutral per variable and the net effect is linear algebra divided by r^2 against
    relation collection multiplied by r^{m-1} - strictly worse than transporting relations in the
    x-coordinate, and the designated falsification test of the IDEA-20260807-f00729 closure'
  status: draft
  objective: "(A) THE CONSTRUCTION. On an ordinary curve with F_p-rational Aut of order 2r (r = 3\
    \ for j=0 with p congruent to 1 mod 3, r = 2 for j=1728 with p congruent to 1 mod 4), the quotient\
    \ E/Aut is a projective line and the quotient coordinate is explicit:\n  j=0  (y^2 = x^3 + b):\
    \  w = y^2 = x^3 + b. The fibre of w is\n    {(x, +-y) : x^3 = w - b} - three cube roots times\
    \ two signs = SIX\n    points, i.e. exactly one Aut-orbit.\n  j=1728 (y^2 = x^3 + a x): w = x^2.\
    \ The fibre is {(+-x, +-y)} - FOUR\n    points, exactly one Aut-orbit.\nA factor base indexed\
    \ by w therefore covers 2r points per element instead of the 2 points that an x-indexed element\
    \ covers. That is the whole appeal: the same point coverage with r times fewer unknowns.\n(B)\
    \ THE COST OF MAKING IT WORK, DERIVED. There is a summation polynomial in the quotient coordinate\
    \ and its degree is forced. Using the weighted homogeneity of S_3 at a=0 (weight 4 with deg(x)=1,\
    \ deg(b)=3), one has S_3(zeta x1, zeta x2, zeta x3) = zeta * S_3(x1,x2,x3) for zeta^3 = 1 [derived\
    \ in IDEA-20260807-477e40 claim (C)]. Define\n  Pi(x1,x2,x3) = product over u,v in {0,1,2} of\
    \ S_3(x1, zeta^u x2, zeta^v x3).\nThen Pi(zeta x1, x2, x3) = zeta^9 Pi = Pi, and likewise in x2\
    \ and x3, so Pi lies in F_p[x1^3, x2^3, x3^3] = F_p[w1 - b, w2 - b, w3 - b] and IS a polynomial\
    \ in the quotient coordinates. Its degree: 9 factors each of x1-degree 2 gives x1-degree 18, hence\
    \ degree 18/3 = 6 in x1^3, hence\n  DEGREE EXACTLY 6 = 2r IN EACH w_i.\nThe same computation at\
    \ j=1728 with 4 factors gives x1-degree 8, hence degree 4 = 2r in each w_i. [both derived in this\
    \ record; to be verified symbolically as the experiment's first act.] GENERAL FORM OF THE LAW:\
    \ the quotient multiplies the fibre size by r AND multiplies the per-variable degree by r. Exactly\
    \ r, in both places.\n(C) THE ACCOUNTING, AND IT COMES OUT NEGATIVE. Match point coverage: an\
    \ x-base of size B and a w-base of size B/r cover the same 2B points, so the decomposition probability\
    \ of a random target is the same and the number of ATTEMPTS per relation is the same.\n  LINEAR\
    \ ALGEBRA: B columns become B/r columns, so a dense or Wiedemann\n    solve costs r^2 times less.\
    \ Factor 9 (j=0), 4 (j=1728).\n  RELATIONS NEEDED: B becomes B/r, a factor r fewer.\n  COST PER\
    \ DECOMPOSITION ATTEMPT: the arity-m system has per-variable degree\n    2r instead of 2, so its\
    \ Bezout number goes from 2^m to (2r)^m, a factor\n    r^m more.\n  NET COLLECTION COST: (B/r)\
    \ relations x (same attempts) x (r^m per attempt)\n    = r^{m-1} times MORE than the x-coordinate\
    \ route.\nSo the quotient coordinate buys r^2 on linear algebra and pays r^{m-1} on collection:\
    \ a wash at m = 1 (meaningless), a factor-3 collection penalty at m = 2, a factor-9 penalty at\
    \ m = 3 for j=0. CRUCIALLY, THE COMPETITOR IS NOT UNSTRUCTURED INDEX CALCULUS. It is IDEA-20260807-f8a045's\
    \ route, which keeps the DEGREE-2 x-system and obtains the same r^2 linear-algebra saving by transporting\
    \ each found relation through phi - paying NOTHING extra on collection. Against that competitor\
    \ this proposal is worse by exactly r^{m-1} and it is worse for a reason that is structural, not\
    \ implementational.\n(D) WHY PROPOSE IT AT ALL, AND WHAT WOULD MAKE IT WIN. Because (C) is a prediction\
    \ and because there is one specific way it could be wrong. Pi factors: grouping the 9 factors\
    \ by the difference of the two shift indices gives Pi = Pi_0 Pi_1 Pi_2 with Pi_d = product over\
    \ u of S_3(x1, zeta^u x2, zeta^{u+d} x3), each of w1-degree 2 rather than 6. If any Pi_d were\
    \ itself a function of (w1,w2,w3) the effective degree would fall from 6 to 2, the r^m penalty\
    \ would vanish, and the quotient route would win outright by r^2 with no cost. The derivation\
    \ says this does NOT happen - Pi_d is sent to Pi_{d-1} by x2 -> zeta x2, so the Pi_d are conjugate\
    \ and individually not w-functions - but that derivation is exactly the kind of claim a symbolic\
    \ computation should be made to confirm rather than believed. THE TWO OUTCOMES, FIXED IN ADVANCE:\n\
    \  O1 Pi has w-degree exactly 2r and does not factor into w-functions. The\n    quotient-coordinate\
    \ route is strictly dominated by relation transport by\n    r^{m-1}, the IDEA-20260807-f00729\
    \ closure survives its designated test,\n    and lane L3's polynomial-level automorphism route\
    \ is closed with a\n    number attached. PREDICTED.\n  O2 Pi factors into w-functions of degree\
    \ below 2r. The closure's forward\n    guidance item G2 fires, the quotient IS worth using at\
    \ the polynomial\n    level, and this becomes the lane's first genuine mechanism - still a\n \
    \   constant (bounded by r^2 = 9), still not an exponent, but a real one.\n\n(E) WHAT IS CLAIMED\
    \ BEYOND THE sqrt(|Aut|) CONSTANT: NOTHING. Even outcome O2 caps at a factor r^2 <= 9 on the linear-algebra\
    \ stage of an algorithm that does not beat rho over prime fields. Filed as baseline calibration\
    \ and as a falsification test of a closure, never as an attack."
  resource_label: R1 and R2 - x- and y-coordinates as field elements, and the curve equation that
    defines the quotient map. The quotient coordinate w is field data; no map is applied to a point
    of G in order to extract a group-theoretic advantage.
  admissibility: admissible
  admissibility_argument: 'The mechanism replaces one field-valued factor-base index by another and
    computes a different polynomial. Nothing in it queries the group beyond ordinary point arithmetic,
    so H-ENDO-001''s scalar-action argument does not bind: that argument constrains what endomorphisms
    can do to the prime-order subgroup, whereas the quantity at stake here is the degree of a polynomial
    over F_p. KN-FIND-b7e091 closes oracles simulable by group operations and equality tests; the
    coefficients and degree of Pi are not such an output. Admissible - and predicted to lose anyway,
    which is a different and more useful fact than being inadmissible.'
  reachability_gate: 'NOT APPLICABLE AS A WALK - the curve is fixed and no isogeny is computed. T4
    bounds the reach as usual: the quotient coordinate of this proposal exists only when Aut has order
    above 2, which requires D_0 = -3 or D_0 = -4, and by T4 no curve outside those classes can be
    walked to one. So even outcome O2 would confer nothing on a generic curve at any price, and the
    mechanism is permanently confined to the family named in the scope statement of IDEA-20260807-51675e.'
  inputs:
    procedure: 'CHEAPEST VALID DISCRIMINATOR: STEPS 1 AND 2, WHICH ARE PURELY SYMBOLIC AND COST MINUTES.
      Form the nine-fold product for one j=0 curve over F_p[zeta]/(zeta^2+zeta+1), confirm it lies
      in F_p[x1^3,x2^3,x3^3], read off the degree in w, and factor it. Those two operations decide
      O1 versus O2 completely, and they decide it before a single relation is collected, a single
      solver is invoked, or a single line of the w-indexed pipeline (Step 4, the expensive part) is
      written. If the degree is 6 and the factors are conjugate, the route is dominated by r^{m-1}
      and Steps 4-5 become OPTIONAL confirmation rather than necessary work.'
    mechanism: 'STEP 1 (symbolic, minutes, HARD GATE). Verify (B) for j=0: form Pi = product over
      u,v of s3_expr(0,b) with x2 -> zeta^u x2, x3 -> zeta^v x3 over F_p[zeta]/(zeta^2+zeta+1), expand,
      and check that every monomial has x_i-degree divisible by 3 in each variable separately. Then
      substitute x_i^3 = w_i - b and report the exact degree in each w_i. Assert 6. If Pi is not a
      polynomial in the x_i^3, the derivation is wrong and the proposal ends here.

      STEP 2 (symbolic, minutes, THE DECIDING TEST). Factor Pi over F_p for three declared primes
      and over the function field F_p(b). For each irreducible factor, test whether it is invariant
      under x_i -> zeta x_i SEPARATELY in each variable - i.e. whether it is itself a function of
      the w''s. Predicted: only the full product is, and the three conjugate pieces Pi_0, Pi_1, Pi_2
      are not. A factor that IS a w-function and has degree below 6 is outcome O2 and halts the line
      for independent verification before anything else is run.

      STEP 3 (symbolic, minutes). Repeat Steps 1-2 for j=1728 with the four-fold product and w = x^2;
      assert degree 4. Two families agreeing with the derived law "degree = 2r" is much stronger evidence
      than one.

      STEP 4 (implementation, medium). Build the w-indexed decomposition solver: factor base of B/r
      quotient elements, system {Pi(w1, ..., wm, w_R) = 0, membership equations for each w_i}, solved
      with the same solver and the same settings as the x-indexed baseline. Every recovered decomposition
      is certified by lifting back to points and re-verifying the sum with harness/toycurve.py - the
      lift is r-fold ambiguous and the certificate must name the chosen lift, which is the practical
      face of the non-homomorphism.

      STEP 5 (measurement). On matched instances, measure four cost quantities for three arms - x-indexed
      baseline, x-indexed with relation transport (IDEA-20260807-f8a045''s route), and w-indexed -
      namely: attempts per relation, solver time per attempt, relations needed, and linear-algebra
      cost. Report the three arms'' totals in one table in a single unit (F_p multiplications), plus
      matched rho and matched BSGS.

      STEP 6 (the honest closing move). Whatever the outcome, state the w-indexed route''s cost as
      a RATIO TO THE RELATION-TRANSPORT ROUTE, not to unstructured index calculus. Reporting it against
      the weaker competitor would manufacture a speedup that the better-known method already has.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - r = 1 generic curve, which must reproduce S_3 exactly (N1)
  - x-indexed base of size B/r, unmatched coverage (N2)
  - fake 2r-to-1 index map, which must fail (N3)
  - the relation-transport arm, which is the true competitor
  - matched rho and matched BSGS on every instance
  - certificate verification by lifting every w-solution back to points
  - "NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. N1 THE r = 1 NULL: run the identical\
    \ construction on a GENERIC-j curve,\n  where the automorphism group is {+-1} and the \"quotient\
    \ coordinate\" is\n  just x. The construction must reduce EXACTLY to S_3 with degree 2 - i.e.\n\
    \  the machinery must return the baseline when there is no extra structure.\n  An implementation\
    \ that produces a degree-6 polynomial on a generic curve\n  is wrong and every number it produced\
    \ is void.\nN2 THE SIZE-MATCHED NULL: an x-indexed factor base of size B/r (NOT matched\n  on\
    \ coverage) run through the same solver, to separate \"fewer unknowns\" from\n  \"quotient structure\"\
    . The w-route must beat this arm on relation yield -\n  if it does not, its coverage claim in\
    \ (C) is false.\nN3 THE FAKE-QUOTIENT NULL: index the factor base by an arbitrary 2r-to-1\n  function\
    \ of x that is NOT the Aut-quotient, and attempt the same\n  construction. No summation polynomial\
    \ of degree 2r should exist, and the\n  pipeline must fail. Success here would mean the pipeline\
    \ is not using the\n  automorphism at all.\nDECAY PARAMETER: the arity m. The derived penalty\
    \ r^{m-1} GROWS with m. A measured penalty flat in m contradicts the Bezout accounting in (C)\
    \ and is the artifact tell; a penalty that shrinks with m would be outcome O2 arriving by a different\
    \ door and must be audited before it is believed."
  independent_variables: []
  metrics:
    primary:
    - per-variable degree of Pi in w, per family
    - full factorisation of Pi with per-factor invariance test
    - monomial count and Newton polytope of the w-system vs the x-system
    - attempts per relation, solver seconds per attempt, relations needed, LA cost - separately, for
      all three arms
    secondary:
    - certificate pass rate and lift-ambiguity resolution count
    - total F_p multiplications per arm, plus matched rho and BSGS
    - largest (p, m) reached per arm and the reason for the ceiling
  heuristic_under_test: null
  preregistered_prediction:
    quantity: per-variable degree of the quotient-coordinate summation polynomial at m=2
    formula: Exactly 6 for j=0 and exactly 4 for j=1728, against 2 in the x-coordinate. Any other
      value refutes the derivation in (B). This is the single number the proposal exists to produce.
    source: pre-registered in IDEA-20260807-d329e2 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - COVERAGE MATCHING IS THE WHOLE COMPARISON. A w-base of size B compared against an x-base of size
    B is not a fair test - it has r times the coverage. Every comparison is at matched coverage (B_w
    = B/r) and the unmatched arm is run only as control N2.
  - BEZOUT IS A PROXY. Solver cost is not the Bezout number. Both are reported; if they disagree,
    the measured time governs.
  - LIFT AMBIGUITY IS A REAL COST. Every w-solution must be lifted to points to become a relation,
    and the lift is r-fold ambiguous. That cost is charged to the w-route and not silently absorbed.
  - SMALL-p DEGENERACY. At small p the fibres can collide (w - b a cube of a repeated root, or w =
    0), collapsing orbits. Degenerate w values are enumerated and excluded.
  - COMPARING AGAINST THE WEAK COMPETITOR. Reporting the w-route's r^2 linear- algebra saving against
    unstructured index calculus, rather than against the transport route which already has it, would
    manufacture a speedup. Step 6 exists to prevent this and it is a reporting obligation, not a suggestion.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Exactly 6 for j=0 and exactly 4 for j=1728, against 2 in the x-coordinate. Any
    other value refutes the derivation in (B). This is the single number the proposal exists to produce.
  falsification_criterion:
  - Pi is not a polynomial in the x_i^3. The construction in (B) is wrong and the proposal ends at
    Step 1.
  - deg_w Pi is not 2r. The derived degree law is false; supersede this record before any cost claim
    is made.
  - 'An irreducible factor of Pi of degree below 2r is itself a w-function. Outcome O2: the route
    may win, IDEA-20260807-f00729''s guidance item G2 fires, and independent verification is mandatory
    before use.'
  - The r=1 null produces degree above 2. The instrument double-counts the sign; every number void.
  - The fake-quotient control succeeds. The construction is not using the automorphism; the framing
    is wrong and the record is superseded.
  - A w-level "solution" fails to lift to a certified point decomposition at a rate above 1 percent.
    The lift ambiguity is not being resolved correctly and no relation count is trustworthy.
  - The degree-6 system exceeds the solver budget before any relation is collected. INFRASTRUCTURE
    outcome under AGENTS.md rule 5 - and note it is itself weak evidence FOR the predicted penalty,
    but it may not be reported as mathematical evidence.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-d329e2
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
