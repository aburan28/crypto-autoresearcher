# EXP-ECDLP-65698a
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261004-3559a3.
experiment:
  id: EXP-ECDLP-65698a
  hypothesis_id: H-ECDLP-5809de
  source_idea: IDEA-20261003-7ed89b
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-8 table versus width-7 table
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-3559a3
  objective: >-
    Check the table sizes 128 and 64, the product 8192, and the nearby gap 0.
  inputs:
    width_hi: 8
    width_lo: 7
    table_hi: 128
    table_lo: 64
    table_gap: 64
    table_product: 8192
    table_sum: 192
    nearby_a: 64
    nearby_b: 64
    nearby_gap: 0
    nearby_product: 4096
  controls:
    - >-
      Two to the power 7 is 128. Two to the power 6 is 64. Reporting
      both tables as size 64 drops the gap and invalidates the run.
    - >-
      One hundred twenty-eight exceeds sixty-four by 64. The product
      of the two sizes is 8192. Their sum is 192.
    - >-
      Two width-7 tables each store 64. Their gap is 0 and their
      product is 4096.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-8 table stores 128 entries. The width-7 table stores
      64. The gap of two width-7 tables is 0.
    formula: >-
      Compute 2 to the power 7. Compute 2 to the power 6. Subtract
      64 from 128. Multiply 128 by 64. Subtract 64 from 64.
    source: >-
      IDEA-20261003-7ed89b states the widths 8 and 7 and the sizes
      128 and 64, read 2026-10-04. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 8192 and the nearby gap 0 are required. A check that stops at the size 128 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 128 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 7 is not 128.
    - Two to the power 6 is not 64.
    - The gap is not 64.
    - The product is not 8192.
    - Both tables are reported as size 64, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-8 table stores 128 entries, that
    the width-7 table stores 64, and that 128 exceeds 64 by 64.
  falsification_criterion: >-
    The runs agree that the width-8 table size is computed, and
    that size is not 128.
  required_artifacts:
    - experiments/EXP-ECDLP-65698a/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-65698a/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-65698a/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-65698a/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-65698a/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-65698a/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 64 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
