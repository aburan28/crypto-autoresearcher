experiment:
  id: EXP-MAYO-70f6c1
  hypothesis_id: H-MAYO-e034c2
  derived_from_idea: IDEA-20260805-258212
  question_id: RQ-MAYO-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Exact-arithmetic audit of the whipping dilation identities against the quoted MAYO
    specification, with a k = 1 null, plain-UOV and Rainbow positive controls, and a seven-point
    graded k sweep whose three quantities carry three different pre-registered growth laws
  objective: >-
    The single uncertainty a run reduces is whether MAYO's whipping acts on the parameter triple as
    the diagonal dilation (k, 1, k), and therefore which UOV attack family whipping moves. A run
    establishes (i) the verbatim whipped-map definition and parameter table from the specification,
    or a recorded statement of which sources were tried and what they returned; (ii) the five
    identity values per parameter set as EXACT INTEGERS, each scored against a forced value fixed
    before any reading; (iii) the k = 1 null, where every predicted ratio must be exactly 1; (iv)
    the plain-UOV and Rainbow positive-control classifications, where the intersection attack must
    come out IN RANGE; and (v) the seven-point k sweep, where the oil ratio must be FLAT and three
    other quantities must be exactly LINEAR with three derived slopes. No attack is proposed, no
    cost is computed, and no bit figure is derived from any ratio.
  what_this_is_not:
  - >-
    NOT an attack, a speedup, a key recovery, or a cost estimate. It is a parameter-level derivation
    audit at zero compute.
  - >-
    NOT a bit figure. Converting a dilated ratio into bits requires an underdetermined-MQ cost
    model, which this contract deliberately does not supply and which no run under it may assume.
  - >-
    NOT a claim about MAYO's security at any parameter set, and NOT a claim that whipping is
    security-neutral - only that it is neutral for attacks reading the parameter triple alone.
  - >-
    NOT a validation of any relayed literature figure. Any agreement with a corpus entry is recorded
    as a consistency check with no evidential weight.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: derivation
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - given the whipped-map definition as QUOTED from the specification,
      the five identities hold or fail as exact integer arithmetic at each declared parameter set,
      the k = 1 null returns 1, the two positive controls classify as in-range, and the k sweep
      exhibits the three declared growth laws. WHAT DOES NOT FOLLOW - no cost, no bit figure, no
      security statement about any MAYO parameter set, no claim that whipping is security-neutral,
      and specifically NOT that the underdetermination dilation of k costs the scheme any particular
      number of bits, which requires a cost model this contract does not have.
  inputs:
    procedure: >-
      STAGE 0 (reading, zero compute, MANDATORY BEFORE ANYTHING ELSE) - obtain the MAYO Round-3
      specification in the declared source-preference order and QUOTE the whipped map's definition
      and the parameter table VERBATIM with a locator, or record precisely which sources were tried
      and what each returned. If the definition cannot be obtained, the run proceeds SYMBOLICALLY
      ONLY and every numeric column is marked unavailable rather than filled from memory. STAGE 1
      (exact arithmetic, seconds, DECISIVE) - re-derive I0 through I4 against the quoted definition
      and evaluate the five predicted quantities per parameter set in exact integer arithmetic. If
      the definition does not match the assumed form, STOP and re-derive; the identities as written
      are then void and saying so IS the deliverable. STAGE 2 (seconds) - compute the k = 1 null and
      the two positive controls FIRST and hash-commit them before any MAYO treatment value is
      computed or looked at. STAGE 3 (seconds) - the graded k sweep at fixed underlying (n, m, o),
      reporting all four quantities at every rung and every consecutive difference, not only fitted
      slopes. STAGE 4 (seconds) - toy confirmation: build a toy whipped instance over a small field
      and compute the dimension of its whipped oil space by exact linear algebra, confirming it
      equals k o. STAGE 5 (zero compute) - assemble the table with BOTH the protective
      Kipnis-Shamir column and the adverse underdetermination column, and the explicit refusal to
      convert either into bits.
    instrument: >-
      Exact integer and rational arithmetic in Python's Fraction and int types; no floating point
      anywhere in the identity checks. Pure-Python exact linear algebra over a small field with log
      tables for the toy confirmation; no computer-algebra system. No solver, no randomness, no
      seeds. Network access is used at Stage 0 only, for specification retrieval, and every fetch
      outcome including failures is recorded. Recorded through harness/runner.py.
    parameters: >-
      Every declared MAYO parameter set, at whatever (q, n, m, o, k) the specification states -
      these are READ, never recalled. Positive controls at plain UOV Level I and at Rainbow, both
      with their parameters read or marked unavailable. Graded k sweep over k in {1, 2, 3, 4, 6, 9,
      12} at fixed underlying (n, m, o). Toy confirmation at a small field and small (n, m, o) with
      k at least 2.
  controls:
  - >-
    NULL OBJECT, FORCED VALUE DERIVED PRE-RUN, CAN FAIL. k = 1. Whipping with k = 1 is the identity
    dilation, so every predicted ratio must come out EXACTLY 1 and the whipped map must equal E_11
    P. If the derivation has smuggled in a k-dependence that does not vanish at k = 1, it shows here
    at zero cost. This is the cheapest available check that the dilation map is written correctly.
  - >-
    POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR. Plain UOV at Level I, where o
    equals m and n/o is below the recalled intersection threshold. The identities MUST classify it
    as intersection-attack IN RANGE. A second positive control, Rainbow, whose parameters the
    intersection attack is reported to have devastated, must ALSO come out in range. If the
    instrument classifies either as out of range, the applicability rule or the recalled threshold
    is wrong, and NO conclusion about MAYO may be reported.
  - >-
    GRADED CONTROL, SEVEN POINTS, FIVE INTERIOR, MONOTONICITY REPORTED. Hold the underlying (n, m,
    o) fixed and sweep k. Report n*/o*, d*_2, n* - 2o* and alpha* at each rung and every consecutive
    difference. PREDICTED - n*/o* FLAT at n/o (a horizontal line), and d*_2, n* - 2o* and alpha* all
    EXACTLY LINEAR in k with the derived slopes. A sweep that is flat where linearity is predicted,
    or linear where flatness is predicted, falsifies the dilation reading immediately. Three
    quantities with three different pre-registered laws in the same parameter is a far sharper test
    than any one of them - a bug that fakes one law will not fake all three.
  - >-
    ORDERING CONTROL. The null value and both positive-control values are computed, written down and
    hash-committed BEFORE any MAYO treatment value is computed or looked at.
  - >-
    ARCHIVE CHECK, zero compute. Record that no prior run, hypothesis or evidence record exists in
    area MAYO for this observable, so the absence is recorded AS AN ABSENCE and not presented as a
    passed check.
  - >-
    TOY OIL-DIMENSION CONFIRMATION. Build a toy whipped instance and compute the whipped oil space's
    dimension by exact linear algebra. FORCED - exactly k o. A larger value refutes I0 and is more
    interesting than the record.
  - >-
    SOURCE-PROVENANCE GATE. Every numeric parameter is either QUOTED with a locator or marked
    unavailable. A table built from recalled parameters is a symbolic exercise mislabelled as a
    measurement, and this gate is what prevents that.
  independent_variables:
  - 'MAYO parameter set, as declared in the specification'
  - 'k, over the graded sweep {1, 2, 3, 4, 6, 9, 12} at fixed underlying (n, m, o)'
  - 'object: whipped MAYO instance versus underlying UOV map versus plain UOV Level I versus Rainbow'
  - 'k'' , the number of maps in the intersection attack, at least 2 and 3'
  metrics:
    primary:
    - >-
      oil_ratio_dilation - dimensionless exact rational (n*/o*) divided by (n/o), computed in
      Fraction arithmetic per parameter set. Forced value exactly 1.
    - >-
      intersection_dimension_dilation - dimensionless exact rational d*_2 / d_2 = (2 o* - n*) / (2 o
      - n) per parameter set. Forced value exactly k.
    - >-
      sign_of_underlying_intersection_dimension - the integer 2o - n per declared MAYO parameter
      set, with its sign. Predicted negative everywhere.
    - >-
      underdetermination_dilation - dimensionless exact rational alpha* / alpha = (n*/m) / (n/m) per
      parameter set. Forced value exactly k. Reported together with the cross-scheme ratio of MAYO's
      alpha* to plain UOV's alpha at matched claimed level.
    - >-
      kipnis_shamir_exponent_dilation - dimensionless exact rational (n* - 2o*) / (n - 2o) per
      parameter set. Forced value exactly k, in the protective direction, and reported in the SAME
      table row as the adverse underdetermination dilation.
    secondary:
    - >-
      k_equals_1_null_residuals - the five ratios at k = 1, each forced to exactly 1.
    - >-
      positive_control_classification - boolean per control object, whether the intersection attack
      is classified in range. Forced true for plain UOV Level I and for Rainbow.
    - >-
      graded_sweep_consecutive_differences - exact integers at every rung, reported individually so
      a saturation or a kink is visible rather than averaged into a slope.
    - >-
      toy_whipped_oil_dimension - integer, forced to exactly k o.
    - >-
      source_provenance_per_column - QUOTED with locator, or UNAVAILABLE. No third value is allowed.
    - >-
      a memory column per attack family row, or an explicit UNKNOWN, so the table does not repeat
      the corpus-wide failure of charging wall clock only.
  heuristic_under_test: HEUR-MAYO-DIL-2
  preregistered_prediction:
    quantity: >-
      The five identity ratios per declared MAYO parameter set, and the three growth laws over the
      graded k sweep.
    formula: >-
      oil_ratio_dilation exactly 1.000; intersection_dimension_dilation exactly k;
      underdetermination_dilation exactly k; kipnis_shamir_exponent_dilation exactly k; 2o - n
      strictly negative at every declared set. Over the k sweep, n*/o* constant, and d*_2, n* - 2o*
      and alpha* each exactly linear in k with slopes d_2, (n - 2o) and n/m respectively. Under the
      null that the whipped map is not of the stated form, the identities are void and the
      deliverable is the recorded mismatch.
    source: >-
      Pre-registered in the parent proposal IDEA-20260805-258212, whose predictions block states all
      five forced values, including the risk clause that any parameter set with 2o at least n would
      be the single most important fact in the goal. Fixed before any reading and never tuned to
      data.
  scale_relevance:
    tier: full_parameters
    justification: >-
      The identities are exact statements about integer parameters, so they hold at whatever
      parameter sets the specification declares, including the deployed ones, with no extrapolation
      and no scale transfer - that is the whole reason the record is worth running at zero compute.
      The toy confirmation stage is toy by design and confirms only I0's oil-dimension count at
      small parameters; nothing else is read from it. What does NOT survive to any scale is any COST
      conclusion drawn from the identities, because converting a ratio into a cost requires a model
      this contract does not supply.
    correspondence: >-
      Not applicable. The identities are computed directly on the declared parameter triples; there
      is no proxy object.
  tail_checks:
  - >-
    Report every ratio as an exact rational, never as a decimal, so 'approximately 1' cannot pass
    for 'exactly 1'.
  - >-
    Report every consecutive difference in the k sweep individually, so a law that holds on average
    but breaks at one rung is visible rather than absorbed into a fitted slope.
  - >-
    Report 2o - n for EVERY declared parameter set individually, since a single set in range is the
    finding and an aggregate would hide it.
  - >-
    Report the source locator for every numeric input beside the number it produced, so a column
    built from an unavailable parameter cannot be read as measured.
  - >-
    Report the protective Kipnis-Shamir column and the adverse underdetermination column in the same
    row, always. A table carrying only one of them is incomplete by this contract's own standard and
    is invalid_measurement.
  replication:
    seeds:
    - not_applicable_deterministic
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.2
    maximum_memory_gb: 2
    maximum_runs: 6
  stopping_rules:
  - >-
    STOP at Stage 1 if the quoted whipped-map definition does not match the assumed form. The
    identities as written are void, and recording that IS the deliverable; they are not patched to
    fit.
  - >-
    STOP if the k = 1 null returns any ratio other than exactly 1. A k-dependence has been smuggled
    in and no treatment number is interpretable.
  - >-
    STOP if either positive control misclassifies. The applicability rule is wrong and no conclusion
    about MAYO may be reported.
  - >-
    STOP the numeric table if the specification cannot be obtained; proceed symbolically with every
    numeric column marked unavailable, and never fill one from memory.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. A budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    A network failure, timeout, crash or dependency failure makes the run failed_infrastructure and
    is NEVER a mathematical result (AGENTS.md rule 3). An inability to fetch the specification is an
    infrastructure outcome and yields a symbolic-only deliverable, not a negative finding.
  - >-
    A run that fills any numeric column from recalled parameters rather than from a quoted source or
    an UNAVAILABLE marker is completed_invalid (AGENTS.md rule 5).
  - >-
    A run in which any MAYO treatment value was computed or read before the null and the positive
    controls were hash-committed is completed_invalid. The ordering is the control.
  - >-
    A run that reports the underdetermination dilation without the Kipnis-Shamir dilation in the
    same row is invalid_measurement.
  - >-
    A run that converts any ratio into a bit figure is completed_invalid; that requires a cost model
    outside this contract.
  - >-
    A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires a
    new contract.
  success_criterion: >-
    Stage 0 produces either a verbatim quotation of the whipped-map definition and parameter table
    with a locator, or a recorded statement of which sources were tried and what they returned; the
    k = 1 null returns exactly 1 on all five ratios; both positive controls classify the
    intersection attack as in range; the graded k sweep exhibits a flat oil ratio and exactly linear
    d*_2, n* - 2o* and alpha* with the derived slopes; the toy confirmation returns whipped oil
    dimension exactly k o; and the five identity ratios come out exactly 1, k, k, k and negative
    2o - n at every declared parameter set, reported as exact rationals with source provenance per
    column.
  falsification_criterion:
  - >-
    The quoted whipped map is not of the stated form. Identities I2 through I4 are VOID as written
    and must be re-derived; the recorded mismatch is the deliverable and is the most likely single
    failure of the record.
  - >-
    oil_ratio_dilation is anything other than exactly 1, or the toy confirmation returns a whipped
    oil dimension larger than k o. I0 fails, whipping CREATES oil structure, and that is a far more
    important result than the record it refutes.
  - >-
    Any declared MAYO parameter set has 2o at least n. The 'whipping buys oil-geometry safety'
    reading is wrong for that set, the intersection attack is in range for its underlying map, and
    this is pre-declared as the single most important possible outcome.
  - >-
    underdetermination_dilation is anything other than exactly k. Either an arithmetic error or a
    whipped map whose equation count is not m.
  - >-
    The k = 1 null returns any ratio other than exactly 1, or a positive control misclassifies. The
    instrument is broken and NOTHING is reportable.
  - >-
    The graded sweep is flat where linearity is predicted or linear where flatness is predicted. The
    dilation reading is falsified and the failing rung localises the error.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
  - verbatim quotation of the whipped-map definition with its source locator, or a recorded statement of which sources were tried and what each returned
  - the parameter table (q, n, m, o, k) per MAYO parameter set with source locators, or UNAVAILABLE markers
  - raw-result.json carrying the five identity values per parameter set as exact rationals, not decimals
  - the k = 1 null and both positive-control values, hash-committed before any treatment value
  - the seven-rung k-sweep table with every consecutive difference
  - the toy whipped oil-dimension computation with its exact linear algebra trace
  - a memory column per attack-family row, or an explicit UNKNOWN
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval and the user's authorization are required before execution. This contract
    is review_required and is NOT approved; approved_by is null and execution_authorized is false
    (AGENTS.md rule 1).
  - >-
    The proof_search_map on H-MAYO-e034c2 must be audited before implementation, per KN-TECH-080 and
    the Coordinator's proof-oriented dispatch gate, since the hypothesis is a derivation.
  - >-
    Stage 0's source-preference order must be fixed in writing before approval, and the
    source-provenance gate enforced in the task card, since the single largest risk here is a table
    that looks measured and was filled from memory.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260805-258212
    authored_at: '2026-08-25'
    note: >-
      The five forced values, the k = 1 null, the plain-UOV and Rainbow positive controls, the
      seven-point graded sweep and the archive check are taken from the parent proposal's
      predictions and minimal_test.controls blocks. The source-provenance gate and the requirement
      that the protective and adverse columns appear in the same row are Coordinator additions
      required by AGENTS.md rules 4 and 5 and by the parent's own target_complexity block, which
      flags the missing memory column. Boilerplate identical across contracts by program rule comes
      from the fixed table. Every parameter figure the parent recalled is treated here as a reading
      task, never as an input.
  derivation_gaps:
  - >-
    Every MAYO and plain-UOV parameter figure is RECALLED and UNVERIFIED in the parent proposal.
    None may be used. The contract therefore has two very different deliverables depending on
    whether Stage 0 succeeds, and which one is produced must be stated in the headline rather than
    inferred from a table's completeness.
  - >-
    The intersection-attack applicability rule is HEUR-MAYO-DIL-2 and is recalled, not read. The
    positive controls are the sensitivity check on whatever rule is recovered, but if no primary
    source can be obtained the classification columns are conditional and must be labelled so.
  - >-
    The cross-scheme alpha ratio between MAYO and plain UOV at matched claimed level depends
    entirely on parameters that have not been read, and must never be quoted before Stage 0.
  - >-
    The memory column is required by this contract but the parent proposal supplies no memory figure
    for any recalled attack cost. UNKNOWN is the correct entry and must not be replaced by an
    estimate.
  - >-
    Whether O^k is the LARGEST subspace on which the whipped map vanishes is NOT settled here and is
    not assumed. If a larger oil space exists the whipped map is weaker than these identities say,
    and that question belongs to a separate contract.
