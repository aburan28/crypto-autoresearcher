# EXP-ECDLP-68ff8d
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261004-1c2528.
experiment:
  id: EXP-ECDLP-68ff8d
  hypothesis_id: H-ECDLP-4fca8e
  source_idea: IDEA-20261004-6a7365
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-16 table versus width-15 table
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-1c2528
  objective: >-
    Check the table sizes 32768 and 16384, the product 536870912, and the nearby gap 0.
  inputs:
    width_hi: 16
    width_lo: 15
    table_hi: 32768
    table_lo: 16384
    table_gap: 16384
    table_product: 536870912
    table_sum: 49152
    nearby_a: 16384
    nearby_b: 16384
    nearby_gap: 0
    nearby_product: 268435456
  controls:
    - >-
      Two to the power 15 is 32768. Two to the power 14 is 16384.
      Reporting both tables as size 16384 drops the gap and invalidates
      the run.
    - >-
      Thirty-two thousand seven hundred sixty-eight exceeds sixteen
      thousand three hundred eighty-four by 16384. The product of the
      two sizes is 536870912. Their sum is 49152.
    - >-
      Two width-15 tables each store 16384. Their gap is 0 and their
      product is 268435456.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-16 table stores 32768 entries. The width-15 table stores
      16384. The gap of two width-15 tables is 0.
    formula: >-
      Compute 2 to the power 15. Compute 2 to the power 14. Subtract
      16384 from 32768. Multiply 32768 by 16384. Subtract 16384 from 16384.
    source: >-
      IDEA-20261004-6a7365 states the widths 16 and 15 and the sizes
      32768 and 16384, read 2026-10-04. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 536870912 and the nearby gap 0 are required. A check that stops at the size 32768 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 32768 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 15 is not 32768.
    - Two to the power 14 is not 16384.
    - The gap is not 16384.
    - The product is not 536870912.
    - Both tables are reported as size 16384, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-16 table stores 32768 entries, that
    the width-15 table stores 16384, and that 32768 exceeds 16384 by 16384.
  falsification_criterion: >-
    The runs agree that the width-16 table size is computed, and
    that size is not 32768.
  required_artifacts:
    - experiments/EXP-ECDLP-68ff8d/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-68ff8d/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-68ff8d/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-68ff8d/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-68ff8d/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-68ff8d/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 16384 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
