experiment:
  id: EXP-CSIDH-999626
  hypothesis_id: H-CSIDH-73e6ab
  question_id: RQ-CSIDH-64343f
  source_idea: IDEA-20261005-1896e8
  goal_id: null
  goal_ids: []
  goal_ids_note: >-
    RQ-CSIDH-64343f names GOAL-CSIDH-001. This design does not edit that head
    and does not edit GOAL-ECDLP2M-001.yaml.
  prior_experiment: null
  version: 1
  title: >-
    Memory-cap ratio of one declared hidden-shift probe at p=419, against a
    memory-blind control
  status: approved
  approved_by: DEC-20261006-3cccf4
  approved_at: '2026-10-06'
  frozen: true
  frozen_at: '2026-10-06'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261006-3cccf4 under AGENTS.md standing
    user authorization (2026-09-06). No Magma/Sage. No quantum algorithm.
    No CSIDH-512 figure. No Bedrock. certificate.kind=none.
  approval:
    approved_by: DEC-20261006-3cccf4
    composing_decision: DEC-20261006-3cccf4
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete. Approval does not assert the hypothesis is
      true. Stages 0-1 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 freezes disc/formulas/controls before any form census. Stage 1
      enumerates reduced forms, evaluates C/C_blind, writes RESULTS.md with
      exactly one O-* label.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide, at disc=-419, whether C(1,2)/C(1,M_free) is an integer >=2
    against a memory-blind control that stays at 1, or whether M_free<4 so
    the cap does not bind. Emit exactly one O-* label from H-CSIDH-73e6ab.

  class: measurement
  class_note: >-
    Exact form census plus an integer cost-model instrument. Not a quantum
    security level and not a hidden-shift algorithm run.

  scope:
    included:
      - Stage 0 freeze of disc=-419, C/C_blind, twin enumerations, N=1 nearby object, O-* rules.
      - Stage 1 exhaustive twin census, C and C_blind at G in {1,2} and M in {2,M_free}, RESULTS.md with one O-* label.
    excluded:
      - Quantum algorithm execution or gate-level simulation.
      - CSIDH-512 / NIST-level security figures.
      - Peikert simulator or SQALE reproduction.
      - Magma / Sage / Bedrock as success path.
      - Editing IDEA-20261005-1896e8, GOAL-CSIDH-001.yaml, or GOAL-ECDLP2M-001.yaml.
      - Using disc=-4*419 as N.
      - Treating infra failure as mathematical evidence.

  execution_surface:
    trial_plan: experiments/EXP-CSIDH-999626/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-CSIDH-999626/implementation/run.py --stage 0
      --trial-plan experiments/EXP-CSIDH-999626/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-CSIDH-999626/implementation/run.py --stage 1
      --trial-plan experiments/EXP-CSIDH-999626/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface for tools/experiment_execution.py load_plan.
      implementation/run.py + check.py are the hash-bound sources.

  inputs:
    source_idea: ledger/proposals/IDEA-20261005-1896e8.yaml
    hypothesis: ledger/hypotheses/H-CSIDH-73e6ab.yaml
    question: ledger/questions/RQ-CSIDH-64343f.yaml
    literature: knowledge/techniques/KN-TECH-051.md
    certificate_kind: none
    disc: -419
    p: 419

  controls:
    - name: ctl_freeze_before_census
      definition: Stage-0 freeze exists before any Stage-1 form loop.
    - name: ctl_twin_enumeration
      definition: a-outer and b-outer exhaustive enumerations must agree on the form set.
    - name: ctl_disc_lock
      definition: Metric N is from disc=-419. Count at -4*419 is information-only.
    - name: ctl_blind
      definition: C_blind ratio between M=2 and M=M_free must be exactly 1.
    - name: ctl_oracle_scale
      definition: G->2G multiplies every C by 2 and leaves ratios unchanged.
    - name: ctl_n1_nearby
      definition: Forced N=1 must return ratio 1.
    - name: ctl_no_quantum_run
      definition: Zero quantum-circuit execution; integer probe only.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_census]
    - name: G
      levels: [1, 2]
    - name: M
      levels: [2, M_free]

  metrics:
    primary:
      - name: ratio_G1
        unit: dimensionless
        definition: C(1,2)/C(1,M_free)
      - name: blind_ratio
        unit: dimensionless
        definition: C_blind at M=2 over C_blind at M=M_free
      - name: reconstruction_ok
        unit: boolean
    secondary:
      - name: N
        unit: count
      - name: M_free
        unit: qubits-stand-in
      - name: n
        unit: integer
      - name: wall_clock_seconds
        unit: seconds

  heuristic_under_test: H1

  preregistered_prediction:
    quantity: >-
      Decision rules only. Numeric N is the measurement. O-SEPARATES iff
      enumerations agree, M_free>=4, ratio integer >=2, blind_ratio=1,
      G-scale ok, N=1 ratio=1. O-NO-BIND iff M_free<4.
    formula: >-
      n=max(1,ceil(log2(max(N,2)))); M_free=2^{ceil(sqrt(n))};
      C(G,M)=G*2^{ceil(sqrt(n))}*ceil(M_free/M);
      C_blind(G)=G*2^{ceil(sqrt(n))}.
    source: ledger/proposals/IDEA-20261005-1896e8.yaml; frozen in stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy_exact_integer
    justification: disc=-419 has a_max ~11; exhaustive. No transfer to CSIDH-512.
    correspondence: null

  tail_checks:
    - Twin disagreement is O-MISMATCH.
    - disc=-4*419 must not be N.
    - N=1 gap is O-N1-GAP (implementation), not a class-number result.

  seeds_and_replication:
    seeds: []
    independent_instances: 2
    note: Deterministic exhaustive census. Twin loop orders are the replication instrument. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 1
    maximum_runs: 3
    maximum_workers: 1

  stopping_rules:
    - Stage 0 freeze complete.
    - Stage 1 census + RESULTS.md with exactly one O-* label, or O-IMPEDIMENT.
    - maximum_runs = 3.
    - Do not run a quantum algorithm under this card.

  invalidation_rules:
    - Editing formulas after Stage-0 freeze → protocol invalid.
    - Using disc=-4*419 as N → O-WRONG-DISC.
    - Magma/Sage/Bedrock/quantum-circuit as success path → protocol invalid.
    - Twin disagreement → O-MISMATCH.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming a CSIDH-512 security level → protocol invalid.

  success_criterion: >-
    Stage 0 frozen before any census; Stage 1 produces certified N, M_free,
    C/C_blind tables, and RESULTS.md with exactly one O-* label from
    H-CSIDH-73e6ab.

  falsification_criterion: >-
    Twin disagreement; disc substitution; N=1 gap reported as O-SEPARATES;
    a claimed CSIDH-512 figure; post-hoc formula edit.

  required_artifacts:
    - experiments/EXP-CSIDH-999626/trial-plan-v1.json
    - experiments/EXP-CSIDH-999626/stage0/preregistered-predictions.json
    - experiments/EXP-CSIDH-999626/stage0/protocol-freeze.json
    - experiments/EXP-CSIDH-999626/stage0/worksheet-note.md
    - experiments/EXP-CSIDH-999626/stage1/census.json
    - experiments/EXP-CSIDH-999626/stage1/control-table.json
    - experiments/EXP-CSIDH-999626/RESULTS.md
    - experiments/EXP-CSIDH-999626/implementation/run.py
    - experiments/EXP-CSIDH-999626/implementation/check.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
