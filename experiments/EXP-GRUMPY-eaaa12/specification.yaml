    "methods": {
      "geometry": "For indices a,b,c>=0, b_a=aP, g_b=Q+bMP, h_c=2Q-c(M+1)P. At state(i,j,k), retain indices0..i,0..j,0..k INCLUSIVE. b0=O,g0=Q,h0=2Q are installed before any scheduled edge. This differs explicitly from the displayed publication endpoints; reproduce that distinct published finite set separately as a geometry checksum, not as this baseline.",
      "coverage": "C(i,j,k) is exact union moduloN of {a-Mb:0<=a<=i,0<=b<=j}, {(a+(M+1)c)*inv2:0<=a<=i,0<=c<=k}, and {Mb+(M+1)c:0<=b<=j,0<=c<=k}. Retain bitsets, not sum of cardinalities. Same-sequence collisions do not solve x; all increments nonzero and prefix indices<=K<N, including main and micro cells. Store cardinality and action marginal increments keyed by FULL prefix triple. Never merge states solely by equal cardinality.",
      "initial_setup": "Compute MP and (N-M-1)P independently by canonical left-to-right binary scalar multiplication, starting fromP for nonzero scalar, counting each doubling/addition; no free negation. Compute2Q with one addition. Initial O,P,Q are input/oracle objects; record initial three table insertions and cross-list comparisons separately. Check collisions among O,Q,2Q immediately, so x0 stops at setup. Setup costs are identical across candidate/RR and charged even for x0; no target-dependent shortcut. P scalar setup can be reused for U targets only when disclosed;2Q and initial-target tables remain per target.",
      "termination_proof": "For every main cell K>=M-1 and (M+1)K+1>=N: baby/first-giant intervals[-Mb,K-Mb],b0..K overlap/touch and contain at leastN consecutive integers, hence C(K,K,K)=Z/N. These are exact integer preflight checks. Micro K3,M1: third collision set{b+2c}=0..9, and first set=-3..3; their union mod11 or13 is full. No artificial terminal cost or truncated horizon is allowed. A state with no route to full coverage has value infinity, not0.",
      "bellman": "Let w(s)=N-|C(s)|. On the finite prefix lattice define integer W(s)=0 if C(s)=Z/N; otherwise W(s)=w(s)+min_a W(s+e_a) over legal coordinates<K. Missing finite successors yields infinity. Evaluate in reverse i+j+k order, lexicographic within layer; ties choose b then g then h. Exact optimal expected scheduled additions=W(0,0,0)/N. Total primary mean adds the identical setup additions. The policy is a single deterministic path along the surviving no-collision branch; it cannot depend on which unknown target remains. No history beyond the full fixed triple is omitted.",
      "certificate": "Archive exact coverage/cardinality, W and selected action for every state in compact row-major arrays embedded in certificates.json with N and radix-index declaration. For every finite nonterminal state checker verifies W(s)<=w(s)+W(t) on EVERY legal edge and equality on selected edge; terminal W0. For infinity states verify no finite successor and no full coverage. The selected finite path is a primal witness; feasible lower potentials with attained edge equalities prove optimum by telescoping. Independently recompute coverage from direct all-target list collisions, rather than trusting producer bitsets, on every main selected/RR path and all micro states; verify all main coverage bitsets via three explicit pair-set formula recurrences and random-access checks are not a substitute for complete edge validation.",
      "round_robin": "At each step extend b,g,h cyclically, skipping exhausted coordinates, and check against both other lists immediately after each insertion; stop per target at first cross collision. Compute exact mean by summing w(s)/N along the same fixed RR path until full coverage. Preserve identical inclusive starts, setup, group interface, no negation, memory and immediate-detection convention.",
      "micro_exhaustion": "For N11,13,M1,K3 enumerate every legal action WORD from(0,0,0) to its first full-coverage state, extending each coordinate at most3 and stopping at coverageN; no DP memoization in this independent enumerator. Compute each word mean from direct all-target collisions, archive all word costs and the minimum; it must equal Bellman W0/N exactly. This intentionally small horizon is a recurrence control, not a substitute for the twelve source main cells.",
      "all_target_execution": "For each main/micro cell and each x, run selected policy and RR against opaque-label add/equality oracle. Store returned collision pair, recoveredx using the linear coefficients and inverse of their nonzero Q-coefficient difference, and verify recoveredx*P=Q by canonical binary multiplication. Mean scheduled additions from these records must equal the exact coverage sum. Charge lookup probes, table entries, setup and scalar verification separately; verification cost may depend onx but is identically included for both policies. No oracle label inspection or direct scalar shortcut permitted in online code.",
      "published_slice": "As an additional baseline checksum for each main(N,M), construct publication section6 finite sets baby indices0..M-1, giant1 andgiant2 indices1..M with step M,M+1, and compare formula-covered x to direct pair equality for allx. This tests signs/endpoints; its success count is not forced to an asymptotic published constant.",
      "matched_null": "For each main cell and each seed, independently permute the N group labels in EACH sequence using SHA256(UTF8(decimal_seed+colon+sequence_name+colon+canonical_residue)) sorted by digest then residue. For targetx, each sequence entry receives its own permutation of its original group residue; define null coverage by literal cross-label equality for everyx. Optimize and evaluate RR on exactly the same null coverage/lattice. These objects do not respect one common group law and do not define valid DLP recovery; record schedule costs only. If a null terminal fails full coverage, value is infinity and report its surviving target set. Optimization gain on a null is expected generic scheduling behavior and must never be attributed to elliptic structure; no invented gain-decay threshold.",
      "label_transport": "For transport seeds apply ONE common permutation to all three sequence group labels and the add oracle; coverage, every W and recoveredx must be identical. This is an exact positive invariance check, distinct from independent sequence relabeling nulls.",
