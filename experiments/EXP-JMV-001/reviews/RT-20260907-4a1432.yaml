      Nearby-object check on the "single inserted digit" repair hypothesis
      (C1b-RESULT): I checked the repaired reading (8610311) against the
      SAME maximality criterion the un-repaired reading fails under, exactly
      as specification.yaml's own note anticipates -- 8610311 < 56498081,
      and 56498081 is already listed as an ordinary (non-P) factor on the
      same row, so the repaired reading would ALSO violate "P(c_pi) = largest
      prime factor" even though it satisfies the product identity exactly.
      This is the correct discriminating property to check (product identity
      alone is insufficient, per CTRL-FIG1-ROWCHECK) and I confirm
      specification.yaml's own prior analysis on this point rather than find
      a hole in it.
    - >-
      Quantifier-order check on OBJ-6: the D1 branch argument for P-256 is
      valid for EVERY order in EVERY imaginary quadratic field (it is just
      the definition of conductor), not merely for P-256's specific p,n --
      i.e. it is not a witness chosen after seeing this row's outcome. I
      confirmed this by deriving it in the fully general s/u form before
      touching P-256's actual numbers at all.

  narrowest_supported_statement: >-
    Control C1's MECHANICS -- an independent reviewer who did not produce the
