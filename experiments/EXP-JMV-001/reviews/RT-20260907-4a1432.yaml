  counterexample_or_mutation: >-
    All computations below were run fresh, in this review, without importing
    or reading experiments/EXP-JMV-001/runs/RUN-JMV-001-a/certificates/*.json
    or verify_certificates.py.

    (1) P-256, independent source for p/n: `openssl ecparam -name prime256v1
    -param_enc explicit -text -noout`, hex parsed programmatically (not by
    hand, after an initial hand-transcription of a similarly-obtained
    sect163k1 order caused a self-caught bit-length error, corrected before
    use). Result: p=115792089210356248762697446949407573530086143415290314
    195533631308867097853951, n=1157920892103562487626974469494075735299969
    55224135760342422259061068512044369 -- both independently cross-checked
    as equal to the commonly-published SEC2/FIPS hex strings for P-256, and
    both confirmed prime (sympy.isprime). t=p+1-n=89188191154553853111372247
    798585809583 (odd); d_pi=t^2-4p (odd, mod 4 = 1, so D1's u=1(mod4) branch
    applies, c_pi=s, matching D1's applicability note); -d_pi mod 9 = 3
    (matches the certificate's asserted value exactly, independently
    reproduced). Hasse bound and t!=0 sanity-checked (OBJ-6).

    (2) K-163, independent source for n_NIST and curve parameter a: `openssl
    ecparam -name sect163k1 -param_enc explicit -text -noout` gives A=1
    (so a=1, mu=(-1)^(1-1)=1), order n_NIST=584600654932361167281474175359
    8448348329118574063, cofactor=2. Lucas recurrence (t_0=2, t_1=1,
    t_k=t_(k-1)-2*t_(k-2)) to k=163 gives t_163=-4845466632539410776804317;
    derived order = 2^163+1-t_163 = 11692013098647223345629483507196896696
    658237148126, which equals EXACTLY cofactor*n_NIST (CTRL-ORDER-KOBLITZ,
    independently reproduced). d_pi=t_163^2-4*2^163; -d_pi is exactly
    divisible by 7 with c_pi=isqrt(-d_pi/7)=1824026374634505274957943 and
    7*c_pi^2 == -d_pi exactly (CTRL-CM-KOBLITZ, independently reproduced).
    c_pi / (45641*82153*56498081) = 8610311 EXACTLY (zero remainder),
    and 8610311 is prime (sympy.isprime).

    (3) 86110311 factored from scratch (sympy.factorint, no certificate
    file read): 86110311 = 3*7*367*11173, all four factors independently
    confirmed prime; product recomputed to equal 86110311 exactly.
    Compositeness of 86110311 is ALSO independently provable with zero
    library trust: digit sum 8+6+1+1+0+3+1+1=21, divisible by 3, hence
    86110311 is divisible by 3 and is not prime -- elementary, needs no
    factoring routine at all.

    (4) Direct visual read of the actual source: rendered PDF page 5 at
    600 dpi (`pdftoppm -f 5 -l 5 -r 600 -png`), cropped and 3x-upscaled
    (Lanczos) on exactly the K-163 P(c_pi) cell. The printed digit string is
    unambiguous: 8-6-1-1-0-3-1-1, i.e. "86110311" -- the SAME 8-digit string
    already held in this program's transcription (figure1_transcription.md),
    NOT the hypothesized 7-digit repair "8610311." This reading is
    independently cross-checked against a second, separate extraction
    channel, `pdftotext -layout` (a font/text-object code path, not a pixel
    render), which shows the identical digit string on the K-163 line
    (jmv-math-0411378v3-layout.txt line 189: "86110311"). Confidence: HIGH.
    I viewed the rendered image at native 600 dpi, further magnified 3x with
    high-quality resampling; the eight glyphs are crisp serif digits with
    clear stroke separation between the two "11" pairs, no smudging or
    ambiguity, and two structurally independent extraction mechanisms
    (pixel-render-then-read and text-layer-extraction) agree digit-for-digit.

    (5) K-409/K-571 row-boundary re-derivation (OBJ-1/OBJ-2): a=0 for both
    (OpenSSL sect409k1/sect571k1, A=0), so mu=-1; n_NIST for each
    independently obtained from OpenSSL explicit params (409-bit:
    330527984395124299475957654016385519914202341482140609642324395022880
    711289249191050673258457777458014096366590617731358671; 571-bit:
    193226876150862917234767594546599367214946366485321749932861762572575
    9571144780212268133978522706711834706712800825351461273674974066617311
    929682421617092503555733685276673), cofactor=4 for both. Lucas
    recurrence to m=409 and m=571 gives derived orders exactly equal to
    4*n_NIST in both cases (CTRL-ORDER-KOBLITZ). CTRL-CM-KOBLITZ exact for
    both. c_pi(K-409)=27200558982140686235006970440600674058217108588553
    475783236049, divided by 21262439877311*22431439539154506863, gives
    EXACTLY 57030553306655053533734286593 (prime) -- matching the single,
    complete, non-truncated line printed in the source (see OBJ-1's visual
    re-derivation of the row boundary). c_pi(K-571)=3565589651134062468781
    0845487372082980344185179452596885179918179218090432562595510057,
    divided by 3952463, gives EXACTLY the 79-digit concatenation of the
    source's three printed lines (9021184135396238924389891 +
    9451926768145189936450898 + 07769277009849103733654828039), also prime.
    Both rows' listed factors (21262439877311, 22431439539154506863,
    3952463) are independently confirmed prime.

  baseline_comparison: >-
    Not applicable in the ECDLP-attack sense; this experiment's own C2
    control forbids any attack framing, and this review confirms none is
    present anywhere I looked (provenance.json, figure1_transcription.md,
    transcription_fidelity.md all correctly disclaim any dlog/GRH
    implication). The relevant "baseline" here is methodological: is source
    identification (WebFetch abstract-page confirmation, then a direct PDF
    fetch, sha256-pinned) an adequate substitute for a human physically
    checking a library copy? I find it adequate for this task's narrow
    purpose (my own re-render and dual-channel text extraction from the SAME
    archived, hash-pinned bytes agree with each other and with provenance.json
    on every point except OBJ-1), but note the residual chain-of-custody gap
    in OBJ-7 rather than treat it as fully closed.

  heuristic_challenges:
    - >-
      Not applicable in the target-result-profile sense (no heuristic_under_
      test; this experiment is exact integer arithmetic, per its own
      replication.seed_note). The one place a probabilistic argument appears
      at all is the PAPER's OWN Section 6 heuristic estimate for the expected
      size of P(c_pi) under a "trace behaves like a uniformly distributed
      integer in the Hasse interval" model (jmv-math-0411378v3-layout.txt
      lines 910-922) -- this is the paper's own claim about typical curves,
      not a claim of this experiment, and EXP-JMV-001 does not use it or
      depend on it; I flag it only because it is a companion piece of
      context to Figure 1 that a fuller C1 pass would eventually want on
      record if this experiment's scope ever widens beyond exact arithmetic
      on the ten named curves.

  cost_model_challenges:
