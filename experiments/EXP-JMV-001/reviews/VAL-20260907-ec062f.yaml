  independence_note: >-
    I did not produce the held transcription (figure1_transcription.md), the
    run script (run_conductor_audit.py), or any certificate file under
    review. This session's retrieval of arXiv:math/0411378v3 into
    inputs/JMV-0411378-20260907/ was performed by the Coordinator in a prior
    turn of this same session lineage, before this review began; I treat
    that retrieval's own narrative (provenance.json's prose) as a claim to
