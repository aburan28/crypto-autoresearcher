  claim_boundary_check:
    result: pass
    detail: >-
      This report makes no statement about ECDLP difficulty, Theorem 1.1,
      Corollary 1.2, or GRH, and does not attach to GOAL-ECDLP-001 or
      GOAL-CRYPTO-001. Every claim above is scoped to (a) exact integer
      arithmetic on the ten named curves in curves_attempted, and (b) the
      transcription artifact's fidelity to the specific printed digits of
      Figure 1 as I read them on the retrieved, sha256-pinned PDF. Per this
      task's own instruction, I have avoided using "verified," "confirmed,"
      or "finding" to describe conclusions about arXiv:math/0411378v3's
      correctness or content (uses of those words above describe only that
      Control C1 itself, as a process, has now been performed, or a
      file-hash/integrity check on our own local copy, or a direct quotation
      of this program's own prior artifacts); comparisons between the held
      transcription and the source are worded as "matches," "identical,"
