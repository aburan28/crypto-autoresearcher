  overall_finding: >-
    Control C1 is now satisfied by an independent reviewer who did not
    produce the held transcription, using the actual retrieved and
    sha256-pinned arXiv:math/0411378v3 PDF. C1b's row-completeness and
    column-semantics check passes: the held transcription's row inventory
    (reconstructed from curves_attempted plus curves_not_attempted plus the
    explicit claim that P-224 is absent as a row) and its column-semantics
    reading both match what is printed on page 5, in the same order, with no
    dropped or added row. Every row the held transcription made a specific
    claim about is identical, digit for digit, to the source (P-224
    absence; P-256; K-163's listed factors and printed P(c_π); K-233;
    K-283); the three previously-gapped prime rows (P-192, P-384, P-521) are
    supplied for the first time (c_π=1, P(c_π)=1 each) without licensing any
    change to this run's own censored verdicts for them, per the frozen
    contract's own invalidation rule on c_π=1 claims from incomplete
    factorization. K-409 and K-571's "unusable due to line-wrap" gap is
    shown, by direct arithmetic test rather than assumption, to be a
    genuine source-side truncation for BOTH rows (not only K-409 as the
    provenance narrative implied) — the held transcription's practical
    conclusion for both rows is correct, and no verdict changes.
    Independently re-derived from the published p/n alone (not trusting the
    certificate file), the P-256 mod-9 identity reproduces exactly:
    -d_π mod 9 = 3. Independently re-derived (not trusting the certificate
    file), 86110311 = 3*7*367*11173 is composite, and the single-digit
    repair hypothesis (8610311) is arithmetically consistent with the run's
    derived c_π but is REFUTED as an explanation of what the source itself
    prints: the source's own page 5, read directly, prints "86110311", not
    "8610311." K-163's compositeness is therefore an anomaly this review
    traces to the source table itself, rather than to this program's own
    transcription. Per specification.yaml's own ruling, this reclassifies
    K-163 from a scouting-class control result to a C1-cleared row entering
    the same four-step promotion gate as P-256, and per the same ruling's
    part (e), P-256 and K-163 together are ONE joint observation for
    evidence-strength purposes, not two independent replications. No
    CTRL-FIG1-ROWCHECK verdict in the frozen cpi_table.csv requires
    revision.

