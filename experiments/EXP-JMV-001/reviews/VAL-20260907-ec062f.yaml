    (experiments/EXP-JMV-001/specification.yaml) and the specific control to
    execute (Control C1, its C1b implementation, and CTRL-FIG1-ROWCHECK).
    Flagged as a record-trail gap, not a defect of EXP-JMV-001 itself.
  experiment_id: EXP-JMV-001
  hypothesis_id: H-JMV-001
  question_id: RQ-JMV-001
  scope_note: >-
    THIS REPORT COVERS ONLY CONTROL C1 (SOURCE-TRANSCRIPTION CONTROL), ITS
