  independent_reading_of_source_recorded_first:
    method: >-
      Read the PDF directly with the Read tool's page-image rendering
      (pages 4-5, then page 5 alone) BEFORE re-reading
      figure1_transcription.md's specific claims in detail, then
      cross-checked the two-column table's exact digit strings against
      `pdftotext -layout` and plain `pdftotext` extractions of the same
      PDF (two independently-computed extractions of a born-digital,
      LaTeX-typeset PDF, not a scan — both agree with each other
      character-for-character in the region checked), reserving the
      raster image as the authority for row/column STRUCTURE and using the
      text-stream extraction as the authority for long digit strings my own
      eye is unreliable at reading off a compressed page render (see
      limitations for one instance where my own visual reading of a 29-digit
      string in a raster image disagreed with the text-stream extraction and
      I deferred to the text stream after cross-validating it two
      independent ways).
    row_inventory_as_read: >-
      Figure 1 (page 5) has 16 rows in this printed order: NIST P-192,
      NIST P-256, NIST P-384, NIST P-521, NIST K-163, NIST K-233,
      NIST K-283, NIST K-409, NIST K-571, NIST B-163, NIST B-233,
      NIST B-283, NIST B-409, NIST B-571, IPSec 3rdOG F_2^155,
      IPSec 4thOG F_2^185. There is no P-224 row anywhere in the table.
    header_as_read: >-
      "Curve | c_π (maximal conductor gap in isogeny class) | P(c_π) =
      largest prime factor of c_π" — read directly off the table header on
      page 5.
    caption_as_read: >-
      "Fig. 1. A table of curves recommended as international standards
      [16,36]. Note that the value of c_π for each of the standards curves
      is small (at most 3), except for the curves in the NIST K (Koblitz
      curve) family. ... Any curve with c_π = 1 has the property that its
      isogeny class consists of only one level." (page 5, directly below
      the table.)
    body_text_as_read: >-
      Page 4: "in Figure 1, we find that 10 out of the 11 randomly generated
      curves appearing in international standards documents have only one
      level" — the 4 P-rows + 5 B-rows + 2 IPSec rows = 11 non-Koblitz rows;
      the 5 K-rows are explicitly excluded from that count as deliberately
      selected, non-random curves. Recorded for completeness; this claim is
      about body text outside curves_attempted and is not analyzed further
      per claim_boundary.
    row_values_as_read_prime_rows: "P-192: 1, 1. P-256: 3, 3. P-384: 1, 1. P-521: 1, 1."
    row_values_as_read_koblitz_rows: >-
      K-163: 45641·82153·56498081·P(c_π), P(c_π) printed = 86110311.
      K-233: 5610641·85310626991·P(c_π), P(c_π) printed = 150532234816721999.
      K-283: 1697·162254089·P(c_π), P(c_π) printed = 1779143207551652584836995286271.
      K-409: 21262439877311·22431439539154506863·P(c_π), P(c_π) printed across
      two lines as "57030553306655053533734286593" then
      "9021184135396238924389891(contd)" — the second fragment itself ends in
      "(contd)" with no further digits anywhere else in the 26-page document
      (checked by grepping the full extracted text for "contd" and for
      re-occurrences of either fragment: neither reappears).
      K-571: 3952463·P(c_π), P(c_π) printed across two lines as
      "9451926768145189936450898(contd)" then "07769277009849103733654828039",
      also with no further continuation anywhere else in the document.

  row_completeness_and_column_semantics_check_C1b:
    result: pass
    row_count_and_labels_and_order: >-
      figure1_transcription.md's own row inventory is not a literal 16-row
      list, but IS reconstructable, exactly, from specification.yaml's
      inputs.curves_attempted (10 names, of which P-224 is stated as absent
      as a row) plus inputs.curves_not_attempted.rows (7 named B-/IPSec rows
      retained by name though out of runnable scope): 9 present attempted
      rows + 7 named-but-out-of-scope rows = 16, which is exactly the row
      count and label set I independently read off page 5, in the same
      order. The "P-224 absent" claim in particular is independently borne
      out: no P-224 row exists anywhere in the printed table. No dropped-row
      or added-row discrepancy was found — the leading alternative
      explanation for the P-256 anomaly that C1b exists to catch (a missing
      or shifted row) does not materialize.
    column_semantics: >-
      Held reading of P(c_π) ("the (claimed) largest prime factor of c_π")
      matches the printed header exactly ("P(c_π) = largest prime factor of
      c_π"). Held reading of the multi-factor rows' c_π
      ("product of listed_factors times P(c_π)") matches the printed
      "f_1·f_2·...·P(c_π)" format exactly for every K-row. One terminological
      nuance, not a defect: the printed header calls c_π the "maximal
      conductor gap in isogeny class," not verbatim "the conductor of Z[π]
      in O_K" (specification.yaml condition D1's phrasing); the caption's
      "any curve with c_π=1 ... isogeny class consists of only one level"
      is operationally consistent with D1/D2's conductor-and-divisor-count
      framing, which the Coordinator had already checked analytically at
      approval time (specification.yaml notes). Recorded for completeness,
      not treated as a semantic mismatch.

  numeric_content_check_C1_row_by_row:
    - row: P-192
      held_transcription_claim: "NO VALUE TRANSCRIBED (disclosed gap)"
      value_as_read_in_source: "c_π = 1, P(c_π) = 1"
      comparison: >-
        Not previously held; supplied here for the first time. Not
        contradicted by this run's own censored trial-division result
        (secondary_naive_square_part_below_bound = 1, i.e. no square factor
        found ≤ 10^6), but per specification.yaml's own invalidation rule
        ("c_π = 1 is a positive claim requiring a complete factorization;
        trial division to 10^6 finding no square factor is a censored
        negative and can never establish it") this run's OWN verdict for
        this row cannot be upgraded from censored/undecidable to reproduces
        on the strength of the source value alone — the run never completed
        the factorization of its own 184-bit residual cofactor.
      run_verdict_should_change: false
    - row: P-224
      held_transcription_claim: "stated absent from Figure 1"
      value_as_read_in_source: "no such row exists in the printed table"
      comparison: matches exactly.
      run_verdict_should_change: false
    - row: P-256
      held_transcription_claim: "c_π = 3, P(c_π) = 3"
      value_as_read_in_source: "c_π = 3, P(c_π) = 3"
      comparison: >-
        Identical, digit for digit, to what the held transcription claims.
        See metric_recomputations for the independent re-derivation of the
        mod-9 argument this row's "contradicts" verdict rests on.
      run_verdict_should_change: false
    - row: P-384
      held_transcription_claim: "NO VALUE TRANSCRIBED (disclosed gap)"
      value_as_read_in_source: "c_π = 1, P(c_π) = 1"
      comparison: same reasoning as P-192.
      run_verdict_should_change: false
    - row: P-521
      held_transcription_claim: "NO VALUE TRANSCRIBED (disclosed gap)"
      value_as_read_in_source: "c_π = 1, P(c_π) = 1"
      comparison: same reasoning as P-192.
      run_verdict_should_change: false
    - row: K-163
      held_transcription_claim: "listed_factors=[45641,82153,56498081], P(c_π) printed = 86110311"
      value_as_read_in_source: "listed_factors=[45641,82153,56498081], P(c_π) printed = 86110311"
      comparison: >-
        Identical, digit for digit (visually re-read on the page-5 image,
        where this 8-digit value is short enough to read directly without
        relying on text extraction, and cross-checked against both
        pdftotext extractions). See metric_recomputations for the
        independent compositeness re-derivation and the repair-hypothesis
        test.
      run_verdict_should_change: false
    - row: K-233
      held_transcription_claim: "listed_factors=[5610641,85310626991], P(c_π)=150532234816721999"
      value_as_read_in_source: "listed_factors=[5610641,85310626991], P(c_π)=150532234816721999"
      comparison: matches exactly (text-stream extraction, cross-checked two ways).
      run_verdict_should_change: false
    - row: K-283
      held_transcription_claim: "listed_factors=[1697,162254089], P(c_π)=1779143207551652584836995286271"
      value_as_read_in_source: "listed_factors=[1697,162254089], P(c_π)=1779143207551652584836995286271"
      comparison: matches exactly (text-stream extraction, cross-checked two ways).
      run_verdict_should_change: false
    - row: K-409
      held_transcription_claim: >-
        "listed_factors=[21262439877311,22431439539154506863], P(c_π)=NONE
        (line-wrapped into unusability)"
      value_as_read_in_source: >-
        listed_factors match exactly. P(c_π) is printed across two lines and
        the second line itself ends in "(contd)" with no further digits
        anywhere else in the 26-page document (grep-checked) — the value is
        genuinely incomplete in the source's own typesetting, not merely
        difficult for our own transcription to parse.
      comparison: >-
        The held transcription's practical conclusion (no usable P(c_π) for
        this row) is unaffected; its stated REASON ("line-wrapped into
        unusability") undersells the source-side cause — the print itself,
        not our copy of it, stops short of the complete digit string. This
        is a wording refinement, not a verdict change: the two listed
        integer factors are complete and unaffected, and this run's own
        divisibility check on them re-derives cleanly (see
        metric_recomputations).
      run_verdict_should_change: false
    - row: K-571
      held_transcription_claim: >-
        "listed_factors=[3952463], P(c_π)=NONE (line-wrapped into
        unusability, same reason as K-409)"
      value_as_read_in_source: >-
        listed_factor matches exactly. P(c_π) is printed across two lines
        with "(contd)" appearing at the end of the FIRST line rather than
        the second, which reads, on its face, as a plain mid-number line-wrap
        marker rather than a truncation marker. I tested the hypothesis that
        the two fragments simply concatenate to a complete value; the test
        FAILS (see metric_recomputations) — concatenating gives a number far
        too small to be consistent with this run's own derived c_π once
        multiplied by the listed factor, so the printed value is ALSO
        genuinely incomplete in the source, exactly like K-409, despite the
        different placement of "(contd)."
      comparison: >-
        Same conclusion as K-409: the held transcription's practical result
        (no usable P(c_π)) is correct for this row too, for the same
        source-side reason, once tested rather than assumed. This is a
        second wording refinement, not a verdict change.
      run_verdict_should_change: false

  metric_recomputations:
    - metric: "P-256: t, -d_π, and -d_π mod 9, from the published p and n in certificates/P-256_mod9.json"
      method: >-
        Fresh Python process (this session's scratchpad, not
        run_conductor_audit.py or verify_certificates.py). Used ONLY the
        p and n values printed in the certificate's `inputs` block, without
        trusting its `computed` block. Independently re-derived p a second
        way as a sanity check: p == 2**256 - 2**224 + 2**192 + 2**96 - 1,
        the standard public definition of the NIST P-256 prime field, which
        MATCHES the certificate's p exactly. (n was not independently
        re-derived from a second formula; it is used as printed in the
        certificate/JMV-run's own inputs and is the widely-published NIST
        P-256 group order.)
      result: >-
        t = 89188191154553853111372247798585809583 (odd);
        -d_π = 455213823400003756884736869668539463648899917731097708475249543966132856781915;
        -d_π mod 9 = 3. EXACT MATCH to every value in P-256_mod9.json's
        `computed` block, independently re-derived rather than copied.
        Argument: if 3 | c_π then 9 | c_π^2 | d_π, contradicting -d_π ≡ 3
        (mod 9); this holds regardless of the D1 s-vs-s/2 branch. Combined
        with the numeric_content_check above (source prints c_π = 3 for
        P-256, digit for digit as held), this row's "contradicts" verdict
        rests on an arithmetic identity I re-derived myself, not on trust
        in either the certificate file or the transcription.
    - metric: "K-163: compositeness of the printed P(c_π) = 86110311"
      method: sympy.factorint, fresh process, not trusting K-163_composite_P.json.
      result: >-
        factorint(86110311) = {3:1, 7:1, 367:1, 11173:1}; 3*7*367*11173 =
        86110311 exactly; is_prime(86110311) = False. Matches the
        certificate's claimed factorization exactly, independently
        re-derived.
    - metric: "K-163: single-digit repair hypothesis (8610311)"
      method: >-
        sympy.isprime(8610311) and direct multiplication against the
        listed_factors and the run's own derived c_π
        (1824026374634505274957943, taken from cpi_table.csv /
        transcription_fidelity.md, not recomputed from the Lucas recurrence
        in this review).
      result: >-
        is_prime(8610311) = True. 45641*82153*56498081*8610311 =
        1824026374634505274957943, EXACTLY equal to the run's derived c_π.
        45641*82153*56498081*86110311 (the value as actually printed) =
        18241789221316136032457943, a ratio of 10.000836322869175 over the
        derived c_π — matches transcription_fidelity.md's reported ratio
        exactly.
      but_the_source_prints_86110311_not_8610311: >-
        Both the page-5 raster image (an 8-digit value, short enough to read
        directly) and the text-stream extraction (cross-checked two
        independent ways) show "86110311", matching the held transcription
        exactly. The repair hypothesis is therefore refuted as an
        explanation for what is IN THE SOURCE: whatever caused the printed
        table to contain a composite value where a prime is claimed, it is
        not an extra digit inserted by this program's own transcription
        step. This is the single most consequential fact this review
        establishes.
    - metric: "K-571: concatenation-hypothesis test for the printed, line-wrapped P(c_π)"
      method: >-
        Concatenated the two printed line-fragments
        ("9451926768145189936450898" + "07769277009849103733654828039") into
        one 54-digit integer, multiplied by the listed factor 3952463, and
        compared to this run's own derived c_π for K-571
        (35655896511340624687810845487372082980344185179452596885179918179218090432562595510057,
        taken from cpi_table.csv, not recomputed from the Lucas recurrence
        in this review).
      result: >-
        listed_factor * concatenated_fragments =
        3735839082980344185179452596885179918179218090432562595510057
        (61 digits, 202 bits) vs. the run's derived c_π (86 digits, 285
        bits) — off by a factor on the order of 10^25, not a near-miss.
        HYPOTHESIS REFUTED: simple concatenation of the two printed
        fragments does not recover a value consistent with c_π, so K-571's
        printed P(c_π), like K-409's, is genuinely incomplete in the source
        itself, not merely a two-line value this program's transcription
        failed to stitch together correctly.
    - metric: "K-409 / K-571: divisibility of the listed (complete) integer factors into each row's own derived c_π"
      method: >-
        Using each row's derived c_π from cpi_table.csv (not recomputed
        from the Lucas recurrence in this review — CTRL-ORDER-KOBLITZ and
        CTRL-CM-KOBLITZ already pass for both rows per controls.json),
        computed c_π mod (listed factor(s)) and the residual cofactor's bit
        length.
      result: >-
        K-409: c_π mod (21262439877311 * 22431439539154506863) == 0;
        residual cofactor bit length = 96 — EXACT MATCH to cpi_table.csv's
        residual_cofactor_bitlength=96 for this row.
        K-571: c_π mod 3952463 == 0; residual cofactor bit length = 263 —
        EXACT MATCH to cpi_table.csv's residual_cofactor_bitlength=263 for
        this row. Both independently reproduce the run's own already-computed
        censored/undecidable verdict and divisibility_of_listed_factors
        check.

  control_checks:
    - id: C1
      name: SOURCE-TRANSCRIPTION CONTROL
      status_before_this_review: "NOT SATISFIED (per specification.yaml's status_at_approval)"
      result: this review constitutes C1's completion.
      detail: >-
        Performed by a reviewer (myself) who did not produce
        figure1_transcription.md, against the actual retrieved and
        sha256-pinned PDF, before recording any conclusion. Outcome: every
        row the held transcription made a specific numeric claim about
        (P-224 absence, P-256, K-163, K-233, K-283) matches the source
        exactly; every row it disclosed as a gap (P-192, P-384, P-521) is
        now filled in for the first time; both rows it treated as
        unusable-by-line-wrap (K-409, K-571) are shown, by direct arithmetic
        test rather than assumption, to be genuinely incomplete in the
        source's own typesetting for both rows, not only K-409.
    - id: C1b
      name: ROW-COMPLETENESS AND COLUMN-SEMANTICS CONTROL
      result: pass
      detail: See row_completeness_and_column_semantics_check_C1b above.
    - id: CTRL-FIG1-ROWCHECK
      name: Three-part Figure 1 row check, re-applied in light of C1
      result: >-
        No row's fig1_verdict in the frozen, immutable cpi_table.csv needs
        revision. P-256 and K-163 (both "contradicts", full three-part
        checks already applied by the run) are now C1-cleared: per
        specification.yaml's own coordinator_ruling_on_class_and_gate part
        (d), an arithmetically-impossible value that C1 shows to be
        source-accurate "becomes an erratum of the same class as P-256 and
        enters the [same promotion] gate" — it does not become a new,
        separate finding on the strength of this review alone, and I am not
        promoting it. K-233 and K-283 ("reproduces") are unaffected. P-192,
        P-384, P-521 ("censored/undecidable") are unaffected — the newly
        available source value (c_π=1 for each) does not license upgrading
        the run's own censored verdict, per the invalidation rule on
        reporting c_π=1 from an incomplete trial-division search. P-224
        ("censored/undecidable", used as the nearest enum bucket for "row
        absent from source") is unaffected. K-409 and K-571
        ("censored/undecidable", divisibility check only) are unaffected in
        verdict; only the stated REASON is refined (source-side truncation
        shown by direct test for both, not merely "line-wrapped" as an
        artifact-side description).
    - id: C1b-RESULT
      name: "K-163 transcription-fidelity control result — reclassification after C1"
      result: >-
        Per specification.yaml's own ruling part (d): since the source
        prints 86110311 (not 8610311), the "our own transcription typo"
        hypothesis that made K-163 a mere C1 control result at approval time
        is refuted by this review's direct reading of the source. K-163's
        status therefore changes from "scouting-class artifact defect" to
        "C1-cleared, same class as P-256" — entering the same four-step
        promotion gate as P-256, per ruling part (d).
    - id: joint_observation_discipline
      name: "Ruling part (e): P-256 and K-163 are one observation, not two"
      result: >-
        Both rows are now C1-cleared. Per specification.yaml's explicit
        ruling: "two rows of one figure, from one transcription, checked by
        one reviewer, are one observation" — not two independent
        replications. Any future record building on this review must state
        this as a single joint observation, worded as this program's own
        ruling anticipates ("the transcription-verified Figure 1 contains at
        least two arithmetically impossible entries"), never as two.
    - id: forbidden_actions_check
      name: KN-LIT / CORR- / promotion discipline
      result: pass
      detail: >-
        This report drafts no KN-LIT entry and emits no CORR- record, per
        specification.yaml's explicit prohibition and this task's own
        instruction. It reports C1's completion and its result and leaves
        promotion to the Coordinator's four-step gate.

