experiment:
  id: EXP-JMV-001
  hypothesis_id: H-JMV-001
  question_id: RQ-JMV-001
  version: 2
  supersedes: >-
    version 1 (status draft, hypothesis_id null, approved_by null). Version 1 is superseded,
    not corrected in place. Nothing was ever run under version 1; no run record, manifest, or
    evidence record exists for any version of this experiment.
  title: >-
    Conductor audit of the JMV Figure 1 curve set against a held transcription, with derived
    order controls.
  status: approved
  status_enactment_note: >-
    Enacted 2026-09-06 by the Coordinator: DEC-20260906-b083ce (2026-09-06)
    re-approved this experiment with a genuine, checkable Coordinator review,
    repairing the fabricated-citation defect DEC-20260807-5adc24 found on
    2026-08-07 (this record's own `approved_under` field below cites
    DEC-20260726-001/-003, which DEC-20260807-5adc24 found contain zero
    mentions of JMV). Any dispatch of this contract must cite
    DEC-20260906-b083ce as authorized_by. ledger/questions/RQ-JMV-001.yaml
    also carries this same fabricated citation and is not corrected by this
    note; see DEC-20260906-b083ce's own next_actions for the recommended
    CORR- record. Prior value: paused (enacted 2026-08-08, citing
    DEC-20260807-5adc24). No handoff record exists for this experiment; one
    must be authored citing DEC-20260906-b083ce before dispatch.
  approved_by: coordinator
  approved_at: "2026-07-26"
  approved_under: >-
    DEC-20260726-001 (approval; binding conditions C1, C2, D1, D2, D3) and DEC-20260726-003
    (path rulings: no CORR- record; four-step gate to any KN-LIT erratum; SCOUTING label
    mandatory until that gate completes). Version 2 is the version approved; version 1 was
    explicitly NOT approved.
  assigned_to: executor

  objective: >-
    Determine whether the Figure 1 table of arXiv:math/0411378v3, AS HELD IN THIS PROGRAM'S
    TRANSCRIPTION ARTIFACT, is reproducible from published curve parameters, and produce a
    verified c_pi / level-count table for the standards curves in scope. The deliverable is a
    per-row confirm/contradict/censored table plus counterexample certificates for any
    contradicted row. The deliverable is NOT a statement about the published paper: whether a
    contradicted row reflects the paper or our transcription is decided only by condition C1,
    by a reviewer who did not produce the transcription.

  claim_tier: crypto
  claim_boundary: >-
    Exact integer arithmetic about these exact named curves and about the transcription
    artifact archived with the run. Asserts nothing about the difficulty of dlog on these
    curves, nothing about Theorem 1.1 or Corollary 1.2, nothing about GRH, and nothing about
    any curve not listed in inputs.curves_attempted. The crypto tier here covers arithmetic on
    named cryptographic-size curves; it is not, and may not be described as, cryptanalytic
    validation of anything. A defect in a table confers no attack advantage of any kind.

  inputs:
    curve_source: NIST FIPS 186-2 (P-* and K-*), IETF RFC 2409 (IPSec Oakley groups)
    figure1_transcription_artifact: >-
      The Figure 1 values in scope are held ONLY as a plain-text paste, not as the source PDF.
      The paste as held contains no P-224 row, and its K-409/K-571 rows carry no P(c_pi) value.
      This artifact must be archived verbatim with the run (see controls C1 and required
      artifacts) and is itself an object under test, on equal footing with the paper.
    curves_attempted:
      - P-192
      - P-224
      - P-256
      - P-384
      - P-521
      - K-163
      - K-233
      - K-283
      - K-409
      - K-571
    curves_not_attempted:
      rows: [B-163, B-233, B-283, B-409, B-571, IPSec-3rdOG-F2^155, IPSec-4thOG-F2^185]
      status: not_attempted
      reason: >-
        Resolution of condition D3. These rows are DROPPED FROM THE RUNNABLE SCOPE but retained
        here by name so the row inventory stays auditable. Note the honest reason: the integer
        arithmetic (t = q + 1 - h*n, d_pi = t^2 - 4q) IS computable for them without any
        GF(2^m) implementation. What is NOT available is (i) any input-validation control -
        [n]G = O needs declared GF(2^m) arithmetic, which this experiment does not have and
        does not declare - and (ii) any CM positive control, since these are random binary
        curves with no analogue of the Koblitz d_pi = -7*c_pi^2 identity. Their c_pi would also
        be censored for the same factoring reason as the prime rows. Uncontrolled arithmetic on
        untrusted constants is not evidence, so computing these rows would add only risk. They
        return to scope only via a version 3 spec that names a GF(2^m) module or Sage and
        defines the order control over binary fields.
    trial_division_bound: 1000000
    conductor_definition: >-
      CONDITION D1, BINDING. c_pi is the CONDUCTOR of Z[pi] in O_K: the unique positive f with
      d_pi = f^2 * d_K and d_K a fundamental discriminant. It is NOT "the largest integer whose
      square divides d_pi". Writing d_pi = s^2 * u with u squarefree: c_pi = s if u = 1 (mod 4),
      else c_pi = s/2 (and in that branch s is necessarily even, since a discriminant is 0 or 1
      mod 4). Every reported c_pi, P(c_pi), and level count uses this definition. The naive
      square part s (or its part below the trial bound) may be reported ONLY as a clearly
      labelled secondary quantity.
    conductor_definition_applicability_note: >-
      Coordinator-verified, recorded so the executor does not re-derive it: the s vs s/2 branch
      does not bite on any row in scope. For a prime-field curve of odd prime order n, p is odd
      so p + 1 is even and t = p + 1 - n is odd, hence d_pi = t^2 - 4p is odd, s is odd, and
      u = d_pi = 1 (mod 4), so c_pi = s. For the Koblitz rows, d_K = -7 = 1 (mod 4) is already
      fundamental, so c_pi = sqrt(-d_pi/7) exactly whatever the parity of t. The run must still
      COMPUTE and REPORT the branch taken per row (t parity and nu_2(d_pi)) rather than assume
      it.

  controls:
    - id: C1
      name: SOURCE-TRANSCRIPTION CONTROL (binding; gates every conclusion in this experiment)
      requirement: >-
        Every statement taken from arXiv:math/0411378v3 that any conclusion depends on - here,
        the Figure 1 rows used, including the complete row inventory and the definition of the
        P(c_pi) column - must be archived verbatim in the run artifacts with version, section,
        and figure number, and must be checked against the source by a reviewer who did NOT
        produce the transcription, BEFORE any conclusion is recorded. This experiment's headline
        claims are claims about someone else's text; an unchecked transcription would manufacture
        a false erratum out of our own reading error.
      status_at_approval: >-
        NOT SATISFIED. No agent in this program has read arXiv:math/0411378v3. The paper is not
        in the corpus.
      coordinator_ruling_on_the_koblitz_agreement: >-
        RULING (2026-07-26), on whether exact agreement of the K-233 and K-283 rows with our
        transcription weakens this gate: IT DOES NOT WEAKEN IT, AND ON BALANCE IT STRENGTHENS
        IT. Three parts. (a) The agreement is a genuine and valuable POSITIVE CONTROL on the
        COMPUTATION: it is scouting evidence that the conductor computation, the Lucas
        recurrence, and the -7*c_pi^2 identity are jointly correct on the two most
        information-dense rows. Accepted as such. (b) It is a much weaker control on the
        TRANSCRIPTION. It shows the paste is faithful on the rows it contains and checks; it
        cannot show that no row was dropped, and the specific competing explanation for the
        P-256 discrepancy - a missing or shifted P-224 row - is precisely a dropped-row
        hypothesis, which a paste can satisfy while reproducing every row it does contain. There
        is also no transfer of confidence across blocks: the K-block rows are checkable because
        the Koblitz CM structure makes c_pi exactly computable, and the P-block rows have no
        such redundancy, so K-block fidelity is not evidence of P-block fidelity. (c) DECISIVE,
        and the reason the gate is now STRONGER than at approval: the K-163 row demonstrates
        that the artifact we hold is corrupt at digit level (see control C1b). The rate of
        demonstrable transcription defect in this artifact is no longer hypothetical - it is
        measured, and nonzero, on the only rows we can fully check. Under a demonstrated nonzero
        defect rate, attributing any remaining discrepancy to the paper rather than to the paste
        is unjustified. Note finally where the uncertainty actually sits: the arithmetic half of
        the P-256 claim (that these published p and n give -d_pi = 3 mod 9, hence 3 does not
        divide c_pi) is certain and re-checkable in one line. ALL of the residual uncertainty in
        the P-256 claim is transcription uncertainty. C1 is therefore not merely still gating -
        it is the ONLY open question in that claim.
    - id: C1b
      name: ROW-COMPLETENESS AND COLUMN-SEMANTICS CONTROL (implementation of C1)
      requirement: >-
        The archived transcription must record the COMPLETE row inventory of Figure 1 as held
        (row count, row labels, in printed order) and the transcription's reading of what the
        P(c_pi) column denotes. The C1 reviewer checks row count and row order against the
        source, not only the numeric content of individual rows. Rationale: a dropped row is
        invisible to any per-row check, and a dropped row is the leading alternative explanation
        for the P-256 result. A missing or ambiguous column semantics is likewise invisible to a
        per-row check and changes which of the two K-163 certificates applies.
    - id: C2
      name: CLAIM-TIER AND FRAMING DISCIPLINE
      requirement: >-
        No promotion of any result above the approved tier and no attack framing of any kind.
        Specifically: this run produces no ECDLP attack, no attack-cost improvement, and nothing
        bearing on GRH; it must not be written up as evading the D1 data-movement or BAR-AMORT-D2
        exponent-neutrality barriers, which concern attacks; and it must not be attached to
        GOAL-ECDLP-001 or GOAL-CRYPTO-001, from which RQ-JMV-001 is explicitly detached.
    - id: CTRL-ORDER-PRIME
      name: "Independent order check, prime rows"
      requirement: >-
        For each P-* row, verify G lies on the curve and [n]G = O before using n. Without this,
        a transcription error in our own curve constants is indistinguishable from a table
        error. A row failing this check yields no conclusion of any sign.
    - id: CTRL-ORDER-KOBLITZ
      name: "Derived order check, Koblitz rows (stronger than [n]G = O)"
      requirement: >-
        For E_a: y^2 + xy = x^3 + a*x^2 + 1 over F_2 with mu = (-1)^(1-a), Frobenius satisfies
        tau^2 - mu*tau + 2 = 0, so disc = mu^2 - 8 = -7, and the trace over F_2^m follows the
        INTEGER Lucas recurrence t_0 = 2, t_1 = mu, t_k = mu*t_(k-1) - 2*t_(k-2), with
        #E_a(F_2^m) = 2^m + 1 - t_m. Verify derived order == cofactor * n_NIST for all five
        K-rows. This DERIVES the group order from theory rather than trusting a published n, so
        it is strictly stronger than [n]G = O, which only confirms a published n against a
        published G. No binary-field arithmetic is required anywhere in this control; it is pure
        integer arithmetic. This resolves condition D3's warning that restricting scope would
        delete the pipeline's only positive control: it does not, and the substitute control is
        stronger than the one it replaces.
    - id: CTRL-CM-KOBLITZ
      name: "CM positive control, Koblitz rows"
      requirement: >-
        Verify d_pi = -7 * c_pi^2 exactly for all five K-rows, with c_pi = isqrt(-d_pi/7) and
        the square-root exactness asserted, not assumed. Failure invalidates the pipeline.
    - id: CTRL-HASSE
      name: Self-consistency
      requirement: "|t| <= 2*sqrt(q) for every attempted row, checked exactly."
    - id: CTRL-FIG1-ROWCHECK
      name: "Three-part Figure 1 row check (NEW in version 2; version 1 and the scouting script check only part (i))"
      requirement: >-
        For any row whose transcription carries a COMPLETE claimed factorization
        c_pi = f_1 * ... * f_j * P(c_pi), the run must perform ALL THREE of: (i) product identity,
        f_1*...*f_j*P == c_pi computed independently; (ii) primality of EVERY claimed factor
        including P(c_pi), by a stated primality routine; (iii) the maximality property,
        P(c_pi) == max over all prime factors, under the transcription's recorded reading of the
        column. For any row whose transcription carries an INCOMPLETE factorization (as held,
        K-409 and K-571 have no P(c_pi)), the run must instead check divisibility - each listed
        factor divides c_pi - and report the residual cofactor c_pi/(product of listed factors)
        with its bit length, CENSORED unless completely factored within budget. A row may be
        reported as "reproduces Figure 1" ONLY if every applicable check above passes; passing
        the product identity alone is NOT reproduction and must not be described as one.
    - id: C1b-RESULT
      name: "TRANSCRIPTION-FIDELITY CONTROL RESULT (scouting; the K-163 row)"
      status: "SCOUTING, NOT EVIDENCE, NOT A FINDING - see DEC-20260726-003 part D"
      requirement: >-
        The run must re-derive this from scratch and report it as a control result on the
        ARTIFACT, in the run's transcription-fidelity section, NOT as a Figure 1 finding. What
        scouting indicates: the K-163 row as pasted is internally inconsistent under both
        readings of the P(c_pi) column. Under the reading "P(c_pi) is the largest prime factor",
        the printed 86110311 is composite (3*7*367*11173) and so cannot be any prime factor -
        a certificate requiring NO curve data, NO conductor theory, and NO NIST constants. Under
        the reading "c_pi is the product of the listed factors times P(c_pi)", the printed
        product exceeds the derived c_pi by a factor of about 10 - a certificate requiring the
        derived c_pi and hence the curve data. Scouting further indicates that replacing the
        printed 86110311 by 8610311 - a single inserted digit - makes the product identity hold
        exactly, while STILL violating the maximality reading, because 8610311 < 56498081 and
        56498081 is already listed on that row as an ordinary factor. All three of these
        statements are separate and must be reported separately.
      coordinator_ruling_on_class_and_gate: >-
        RULING (2026-07-26), on whether the K-163 inconsistency is a second finding of the same
        class as the P-256 one and whether it shares the same promotion gate. IT IS NOT THE SAME
        CLASS, AND IT IS NOT A SECOND FINDING. (a) Superficially both are "a row of the artifact
        we hold is arithmetically impossible given published curve parameters", both exact, both
        certificate-bearing. (b) But they differ in what they are evidence FOR. K-163 has an
        identified, strictly more probable proximate cause INTERNAL to our own artifact: a
        one-digit edit repairs the row to exact product consistency, which is the signature of an
        OCR or retype error, not of a published error. The P-256 row has no such internal repair.
        (c) K-163's primary status is therefore a C1 CONTROL RESULT - a measured defect in our
        transcription - and its correct destination is the run's transcription-fidelity section
        and the C1 review packet, where it functions as the reason the paste cannot be trusted.
        It is not routed to the DEC-20260726-003 four-step erratum gate as an independent claim.
        (d) After C1 completes, K-163 becomes classifiable and only then: if the source prints
        8610311, K-163 was our error, there is no finding, and it remains on record as the
        demonstrated reason C1 was necessary; if the source prints 86110311, it becomes an
        erratum of the same class as P-256 and enters the SAME four-step gate as ONE joint claim
        with it. (e) Even in that case the two rows are NOT two replications for
        evidence-strength purposes: two rows of one figure, from one transcription, checked by
        one reviewer, are one observation. They would support a single KN-FIND worded as "the
        transcription-verified Figure 1 contains at least two arithmetically impossible entries",
        never two. (f) One asymmetry to carry forward: if C1 passes, the K-163 compositeness
        certificate is the STRONGER of the two, because it is refutable from the printed table
        alone and is immune to any error in our curve constants, whereas the P-256 certificate
        depends on the published p and n being correct as transcribed. In that event K-163, not
        P-256, is the headline row.

  independent_variables: [curve]

  metrics:
    primary:
      - t (exact), reported with parity
      - d_pi = t^2 - 4q (exact)
      - nu_2(d_pi), and nu_l(d_pi) for all primes l <= trial_division_bound
      - "conductor branch taken per row (u mod 4; c_pi = s or s/2), per condition D1"
      - "c_pi under the D1 conductor definition: exact where derivable, otherwise CENSORED with a stated lower-bound divisor and the residual cofactor's bit length"
      - "P(c_pi): reported only where the complete factorization of c_pi is established, otherwise CENSORED"
      - "level_count, per condition D2"
      - "per-row Figure 1 verdict in {reproduces, contradicts, censored/undecidable, not_attempted}, with the applicable checks from CTRL-FIG1-ROWCHECK enumerated"
    secondary:
      - naive square part s and its part below the trial bound, labelled as secondary
      - cofactor bit length where the factorization is incomplete
      - wall-clock per factorization attempt
      - "-d_pi mod 9 for every prime row (the P-256 certificate quantity, computed uniformly so P-256 is not singled out by construction)"
    level_count_definition: >-
      CONDITION D2, BINDING. level_count is the number of orders O with Z[pi] contained in O
      contained in O_K, i.e. the number of divisors of c_pi. It is CENSORED whenever the
      FACTORIZATION of c_pi is incomplete - which includes rows where c_pi itself is exactly
      known but unfactored (as held, K-409 and K-571). Exactness of c_pi does not license a
      level count. Any restatement of the "10 of 11 curves are single-level" reading inherits
      this censoring and must carry it explicitly.

  replication:
    seeds: []
    seed_note: "Fully deterministic exact integer arithmetic. No randomness, so seed integrity is not applicable; determinism is instead asserted by byte-identical re-execution of the run script on the archived inputs."
    independent_instances: 1

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 1
    maximum_memory_gb: 4
    maximum_runs: 5
    budget_provenance: >-
      Funded from the standalone RQ-JMV-001 track budget (2 CPU-hours, 10 runs total across
      EXP-JMV-001 and EXP-JMV-004 branch (a)). Consumes NO goal campaign budget; GOAL-ECDLP-001
      is paused with its three-batch budget exhausted and is not touched.

  stopping_rules:
    - "Hard cap per large factorization attempt (stated in the manifest before the run). On cap, record the cofactor, its bit length, and the effort spent, and STOP. Escalating factoring effort beyond the cap is out of budget and out of scope."
    - "The run STOPS at the table and the certificates. It does not write any conclusion about arXiv:math/0411378v3. Conclusions are written only after C1 completes, by the reviewer path in DEC-20260726-003."
    - "If the verbatim transcription artifact cannot be archived exactly as held (including its row inventory), STOP and report an infrastructure defect. Reconstructing or tidying the artifact destroys the object under test."
    - "On exhausting wall_clock_seconds_per_run, record partial per-row results with an explicit not_completed status per unfinished row and stop. A timeout is an infrastructure signal, never a negative result about any row."

  invalidation_rules:
    - "Any P-* row failing G-on-curve or [n]G = O invalidates that row's conclusion (bad input constants, not a table error). The row is reported as invalid, never as agreeing or disagreeing with Figure 1."
    - "Any K-* row whose derived order (Lucas recurrence) does not equal cofactor * n_NIST invalidates the pipeline. Fix before reporting any row, prime or Koblitz."
    - "Any K-* row failing d_pi = -7*c_pi^2 exactly invalidates the pipeline. Fix before reporting any row."
    - "Any Hasse violation invalidates the run."
    - "Reporting a censored factorization as c_pi = 1 invalidates the run. c_pi = 1 is a positive claim requiring a complete factorization; trial division to 10^6 finding no square factor is a censored negative and can never establish it."
    - "Reporting a level count for a row whose c_pi factorization is incomplete invalidates that row (condition D2), including rows where c_pi is exactly known but unfactored."
    - "Reporting any c_pi, P(c_pi), or level count computed under the naive square-part definition rather than the D1 conductor definition invalidates the run."
    - "Reporting any result of any sign for a row listed in inputs.curves_not_attempted invalidates the run. Those rows have no input-validation control and no CM control; silence is the only correct output for them."
    - "Describing a row as reproducing Figure 1 on the strength of the product identity alone, without the primality and maximality checks of CTRL-FIG1-ROWCHECK, invalidates that row's verdict."
    - "Any statement in any run artifact asserting that arXiv:math/0411378v3 contains an error, before the C1 review has been completed by a reviewer who did not produce the transcription, invalidates the run's analysis. The permitted formulation until then is exactly: THE TRANSCRIPTION WE HOLD IS INCONSISTENT WITH THESE CURVES' PARAMETERS."
    - "Use of the words verified, confirmed, or finding to describe any Figure 1 result before the DEC-20260726-003 four-step gate completes invalidates the run's analysis. An exact computation that no one has reviewed is scouting, not evidence."
    - "Emitting a CORR- record for any Figure 1 discrepancy invalidates the run and violates DEC-20260726-003 part A. CORR- records correct THIS program's own artifacts; no program record currently depends on Figure 1."

  success_criterion: >-
    A complete per-row table over inputs.curves_attempted of verified t, valuations, conductor
    branch, c_pi (exact or explicitly censored with a stated divisor and residual bit length),
    P(c_pi) and level count (exact or explicitly censored), and a Figure 1 verdict in
    {reproduces, contradicts, censored/undecidable} with the checks applied enumerated per row;
    PLUS the archived verbatim transcription artifact with its complete row inventory; PLUS a
    machine-checkable counterexample certificate for every row reported as contradicting. All
    four control families (CTRL-ORDER-PRIME, CTRL-ORDER-KOBLITZ, CTRL-CM-KOBLITZ, CTRL-HASSE)
    passing is a precondition, not a result.

  falsification_criterion: >-
    The recomputed P-256 row matches the transcription (9 | -d_pi, so 3 may divide c_pi), i.e.
    the scouting mod-9 result fails to reproduce; or the C1 review finds the source does not
    report c_pi = 3 for P-256, in which case the claim has no subject and is withdrawn rather
    than refuted; or a control failure invalidates the pipeline, in which case no row is
    evidence in either direction.

  certificate_discipline:
    required_form: >-
      Per DEC-20260726-003 part C, every contradicted row must be supported by a COUNTEREXAMPLE
      CERTIFICATE in the sense of docs/claims-and-verification.md: an explicit instance plus a
      one-line exact check that independent code re-verifies from scratch, with no reliance on
      this run's implementation.
    p256_certificate: >-
      Inputs: the published P-256 p and n, with G-on-curve and [n]G = O attested. Check:
      t = p + 1 - n; -d_pi = 4p - t^2; assert (-d_pi) mod 9 == 3. Derivation, which the
      certificate file must state so a reader need not reconstruct it: if 3 | c_pi then
      9 | c_pi^2 | d_pi, contradicting -d_pi = 3 (mod 9). The argument is independent of the
      D1 s-versus-s/2 branch, since 3 | c_pi implies 3 | s implies 9 | s^2 | d_pi either way.
    k163_certificates: >-
      TWO SEPARATE certificates, emitted separately and never merged. (i) COMPOSITENESS: assert
      86110311 == 3*7*367*11173, hence not prime. Depends on no curve data at all. (ii) PRODUCT:
      derive c_pi from the Lucas trace and the -7*c_pi^2 identity, and assert that the printed
      product differs from it. Depends on the curve data and on CTRL-ORDER-KOBLITZ passing.
    forbidden_basis: >-
      No certificate may rest on the trial-division search to 10^6, which is a censored negative
      and can never establish c_pi = 1. empirical_only is NOT an acceptable basis for asserting
      an error in a published table.

  required_artifacts:
    - experiments/EXP-JMV-001/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-JMV-001/runs/<RUN-ID>/raw.json
    - experiments/EXP-JMV-001/runs/<RUN-ID>/stderr.txt
    - experiments/EXP-JMV-001/runs/<RUN-ID>/analysis.md
    - experiments/EXP-JMV-001/runs/<RUN-ID>/cpi_table.csv
    - experiments/EXP-JMV-001/runs/<RUN-ID>/controls.json
    - "experiments/EXP-JMV-001/runs/<RUN-ID>/figure1_transcription.md  # C1/C1b: verbatim as held, complete row inventory, row order, stated P(c_pi) column semantics, provenance of the artifact, and an explicit UNCHECKED-AGAINST-SOURCE banner"
    - "experiments/EXP-JMV-001/runs/<RUN-ID>/transcription_fidelity.md  # C1b-RESULT: defects found in our own artifact, K-163 among them, stated as artifact defects not table findings"
    - "experiments/EXP-JMV-001/runs/<RUN-ID>/certificates/P-256_mod9.json"
    - "experiments/EXP-JMV-001/runs/<RUN-ID>/certificates/K-163_composite_P.json"
    - "experiments/EXP-JMV-001/runs/<RUN-ID>/certificates/K-163_product_mismatch.json"
    - "experiments/EXP-JMV-001/runs/<RUN-ID>/verify_certificates.py  # independent re-checker: reads only the certificate files and published constants, shares no code with the run script"
  manifest_requirements:
    - "inference block recording requested_policy from the handoff, the resolved model, and fallback_used per CLAUDE.md."
    - "Exact software versions (Python, sympy or replacement) and the factoring routine used, with its cap."
    - "Explicit statement that seeds are not applicable and why."

  notes:
    - "SCOPE NARROWING RECORDED (resolution of condition D3): 17 rows in version 1 -> 10 attempted rows in version 2, with 7 rows retained by name under an explicit not_attempted status. The rows were NOT silently deleted, because the row inventory is itself a controlled quantity under C1b and because the single-level census reading depends on it; a reader must be able to tell checked-and-absent from never-in-scope."
    - "VERSION 1's NOTE 'If the discrepancy stands, emit a CORR- record and a KN-LIT entry recording the erratum' IS REVOKED. DEC-20260726-003 part A rules out a CORR- record entirely, and the KN-LIT erratum is reachable only through the four-step gate in part B. Nothing in this experiment emits either."
