  seeds: []
  replication:
    seeds: []
    independent_instances: 2
  replication_plan: >-
    Two primes, two schedules, dual meters. Deterministic arithmetic; no RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 900
    wall_clock_seconds: 1800
    maximum_memory_gb: 2
    maximum_runs: 2
    maximum_workers: 1

  stopping_rules:
    - Stop after Stage 0 freeze hashes exist and Stage 1 writes one O-* label.
    - Dual mismatch stops the table as O-ARTIFACT (do not continue to M3).
    - A timeout is failed_infrastructure / O-IMPEDIMENT, not a mathematical miss.

  invalidation_rules:
    - Missing artifact paths invalidate the run.
    - Overwriting an existing run record invalidates the procedure.
    - JSON freeze files that key rows by string n invalidate the protocol.
    - Magma/Sage/AUXIN/Bedrock as a success path invalidates the run.
    - Scoring Stage-2 negation outcomes as Stage-1 evidence invalidates Stage 1.
    - Any ECDLP-solve or exponent claim invalidates the packet.

  success_criterion: >-
    Dual meters agree; sandwich holds at every integer n; E_num ≥ F_num on
    both schedules and both primes; BSGS overlap is 0 before saturation;
    RESULTS.md names exactly one of {O-SUPPORT-M12, O-FAIL-M1, O-FAIL-M2,
    O-ARTIFACT, O-IMPEDIMENT} (Stage 1) or O-STAGE0-OK (Stage 0).

  falsification_criterion: >-
    After a valid dual-agree sandwich, E_num < F_num (O-FAIL-M1) or BSGS
    overlap before saturation (O-FAIL-M2). Dual disagreement is O-ARTIFACT,
    not a floor refutation.

  required_artifacts:
    - raw-result.json
    - manifest.yaml
    - stage0/floor-table.json
    - stage0/preregistered-predictions.json
    - stage1/decomposition-rows.json
    - stage1/control-table.json
    - RESULTS.md

  execution_surface:
