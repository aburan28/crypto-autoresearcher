  objective: >-
    Decide M1 (E_num ≥ F_num and |C_n|≤P_n≤bound) and M2 (BSGS overlap 0
    before saturation) on frozen toys under dual meters; write exactly one
    O-* label.

  class: heuristic_validation
  class_note: >-
    Pre-registered floor inequalities on a generic-group instrument. Not an
    exponent-moving breakthrough; no ECDLP attack table.

  designed_by: coordinator
  designed_under_task: TASK-20261003-8613c9
  assigned_to: executor
  claim_tier: observational
  certificate:
    kind: none
  evidence_eligible: false

  scope:
    included:
      - Z/l additive group at l∈{101,257}
      - PLAIN matching
      - schedules bsgs_interleaved and grumpy_eq_s2
    excluded:
      - negation map / N-CROSS / N-ALL
      - E1/E2 delta_ovl at large ladder primes
      - elliptic-curve consistency arm
      - any field degree n≥131
      - Magma/Sage/AUXIN/Bedrock

  inputs:
    primes: [101, 257]
    schedules: [bsgs_interleaved, grumpy_eq_s2]
    convention: PLAIN
    mu: 1
    s: 2

  controls:
    - name: dual_covered_scans
      object: pair-product vs reversed-scan |C_n| must match
    - name: envelope_sandwich
      object: '|C_n| ≤ P_n ≤ AM-QM bound at every integer n'
    - name: bsgs_zero_overlap
      object: k=2 nearby object where overlap is 0 before saturation
    - name: list_rows_integer_n
      object: JSON freeze files are lists of rows with integer n fields
    - name: no_cas_no_bedrock
      object: pure Python; Bedrock never selected

  independent_variables:
    - prime_l
    - schedule_name

  metrics:
    primary:
      - name: E_ge_F
        unit: boolean
        definition: E_numerator ≥ F_numerator at each (l, schedule)
      - name: sandwich_ok
        unit: boolean
        definition: '|C_n| ≤ P_n ≤ envelope_bound at every integer n'
      - name: bsgs_overlap_before_sat
        unit: integer
        definition: count of n with P_n < l and C_n != P_n on BSGS
      - name: dual_agree
        unit: boolean
        definition: two covered scans return the same set
    secondary:
      - name: wall_clock_seconds
        unit: seconds
      - name: peak_rss_bytes
        unit: bytes

  primary_metrics:
    - E_ge_F
    - sandwich_ok
    - bsgs_overlap_before_sat
    - dual_agree
  secondary_metrics:
    - wall_clock_seconds
    - peak_rss_bytes

  heuristic_under_test: HEUR-GRUMPY-79c17d-H1

  preregistered_prediction:
    quantity: >-
      Dual meters agree; sandwich holds; E_num ≥ F_num; BSGS overlap is 0
      before saturation on l∈{101,257}.
    formula: >-
      P_n = sum_{i<j} n_i n_j; bound_3 = floor((n+3)^2/3); bound_2 =
      floor((n+2)^2/4); C_n = # unique x from cross-class pairs; F_num =
      sum_n max(0, l - bound); E_num = sum_n max(0, l - |C_n|).
    source: IDEA-20260930-79c17d Theorem F (internal); frozen in stage0/

  scale_relevance:
    tier: toy
    justification: >-
      Group orders 101 and 257 only. No transfer to cryptographic sizes or
      to field degree n≥131.
    correspondence: null

  tail_checks:
    - Dual disagreement voids mean claims (O-ARTIFACT).
    - Sandwich failure voids mean claims (O-ARTIFACT).
    - Dict-keyed-by-n JSON is a protocol defect (check.py FAIL).

  seeds_and_replication:
