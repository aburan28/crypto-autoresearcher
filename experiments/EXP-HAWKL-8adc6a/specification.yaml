experiment:
  id: EXP-HAWKL-8adc6a
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-b6de60; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-b6de60
  question_id: RQ-HAWK-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Fit the second-moment convergence exponent of HAWK-shaped signature transcripts against an
    in-run public-equivalent-basis floor and a lattice-independent estimator-can-fail null, at ring
    degrees 4 and 8.
  objective: 'The one uncertainty a run reduces is whether a HAWK-shaped signature transcript''s second-moment
    statistics converge to the secret Gram matrix at a rate distinguishable from what the lattice
    alone explains. Concretely: (i) whether an isometry-aware distance between the empirical second
    moment and the normalised secret Gram matrix admits a clean log-log fit in the number of signatures
    over at least two decades, with a bootstrap interval tight enough to distinguish exponents 0.05
    apart - if it does not, no leakage-rate statement of any kind is available at this scale and that
    is the finding; (ii) if it does, how that exponent compares to the exponent obtained by running
    the identical estimator on transcripts sampled with respect to a public-equivalent basis of the
    same lattice, which is the floor attributable to the lattice rather than to the secret; (iii)
    whether the estimator is capable of failing at all, established by a third arm of lattice-independent
    vectors with matched norms, whose fitted slope must be indistinguishable from zero. A run performs
    no key recovery, no forgery, no lattice reduction beyond the declared public-equivalent-basis
    derivation, and no timing measurement whatsoever. The intended downstream use is a single number
    with an error bar that a later session can re-scope, replacing the absence of any transcript measurement
    for this scheme family in this corpus.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for one or two HAWK-SHAPED
      instances at ring degree 4 (and 8 if budget permits), under one declared toy discrete-Gaussian
      sampler at one or two declared widths, the isometry-aware second-moment distance to the normalised
      secret Gram matrix decays with fitted exponent a with bootstrap interval I, and the same estimator
      on public-equivalent-basis transcripts gives exponent a-prime with interval I-prime, with a
      - a-prime equal to such-and-such. What does NOT follow: nothing about key recovery, forgery,
      distinguishing, or any security property of HAWK or of any scheme; nothing about HAWK''s actual
      sampler, which this program has not read; nothing about higher moments, adaptive queries or
      any other channel; nothing about ring degrees above those tested; and no conversion of the exponent
      into bits per signature unless the fitted model supports it, with the conversion''s assumptions
      listed if made.'
  inputs:
    procedure: 'STAGE 0 (cost: a day of human work, zero compute). Freeze the toy sampler and its
      width(s), the public-equivalent-basis derivation, the isometry-aware distance including the
      alignment group, the t-ladder, and the fitting protocol, in the specification. STAGE 1 (cost:
      minutes). Generate the HAWK-SHAPED instance(s) at ring degree 4 by the declared rule; derive
      the public-equivalent basis; verify both bases generate the same lattice by exact Hermite normal
      form comparison, and halt if they do not. STAGE 2 (cost: hours). Sample 20 independent transcripts
      of 10^6 vectors per arm by exact rejection, recording acceptance rates. STAGE 3 (cost: minutes).
      Compute M_t along the geometric t-ladder for every transcript, streaming, in exact rational
      arithmetic. STAGE 4 (cost: minutes). Isometry-aware distance to the normalised secret Gram matrix
      at each t; log-log fit per transcript; median and bootstrap interval per arm. STAGE 5 (cost:
      minutes). Shuffled-transcript control and estimator-can-fail null, same invocation. STAGE 6
      (cost: hours, optional). Repeat the whole design at ring degree 8 with t up to 10^5, only if
      STAGE 2''s acceptance rate permits. STAGE 7 (cost: minutes). Second width and second instance
      replicates. STAGE 8 (cost: minutes). Emit through harness/runner.py with seeds, acceptance rates,
      all fitted exponents, intercepts and intervals.'
    instrument: Python 3 with exact integer and rational arithmetic for the lattice and for M_t (fractions.Fraction
      or scaled integers); sympy for Hermite normal form in the same-lattice verification and for
      cyclotomic reduction; numpy used only for the log-log regression and bootstrap, never for the
      algebra; the rejection sampler is hand-written exact-integer enumeration in the harness. No
      external lattice library is required; no computer-algebra system and specifically no Sage. Instance
      generation follows the HAWK-SHAPED declared-rule discipline inherited from H-HAWK-c7a551 and
      the EXP-HAWK-a2f34a lineage; no HAWK key-generation procedure is used since the Round-3 specification
      is unread here. Runs, seeds and manifests through harness/runner.py.
    parameters: 'Ring degree n = 4 primary (dimension 8), n = 8 secondary (dimension 16) if throughput
      permits. Two HAWK-shaped instances per degree. Three arms: secret basis, public-equivalent basis,
      lattice-independent matched-norm. 20 independent transcripts per arm per instance. Transcript
      length 10^6 at n = 4, 10^5 at n = 8. Geometric t-ladder: 100, 316, 1000, ..., up to the transcript
      length, 9 to 13 points. Two declared sampler widths. Bootstrap resamples: 2000. All seeds declared
      in the specification.'
  controls:
  - 'Floor arm: public-equivalent-basis transcripts, identical sampler width, identical estimator,
    same invocation.'
  - 'Estimator-can-fail null: lattice-independent vectors with matched norm profile, same estimator,
    same invocation; must show zero slope.'
  - 'Shuffled-transcript control: reprocess the signal arm''s own vectors in a random order and confirm
    the exponent is unchanged, since the estimator must be order-independent by construction; a change
    indicates an implementation bug.'
  - 'Width-sensitivity control: repeat at a second declared sampler width and report both, since the
    convergence rate may be width-driven rather than basis-driven.'
  - 'Two independent instances: repeat the whole design on a second HAWK-shaped instance, so that
    no exponent rests on one lattice.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls, both executed in the same invocation as the signal arm through
    the same code path. Null one, the FLOOR: transcripts generated by sampling with respect to a public-equivalent
    basis of the same lattice - a declared reduced basis derivable from the public form - which by
    construction determines the same lattice and therefore the same limiting covariance, so any convergence
    it shows is attributable to the lattice, not the secret. Null two, the ESTIMATOR-CAN-FAIL control:
    transcripts of vectors drawn from a lattice-independent distribution with matched norm profile,
    where no convergence to the secret Gram should occur at all. For the signal arm to mean anything:
    null two must show NO convergence (fitted slope statistically indistinguishable from zero), proving
    the estimator is not converging by construction; and the signal arm''s fitted exponent must differ
    from null one''s by more than the sum of their bootstrap intervals. If the signal arm and null
    one have the same exponent, the transcript carries nothing about the secret beyond the lattice
    at this scale, and that is recorded as a controlled null.'
  independent_variables:
  - arm (secret basis, public-equivalent basis, lattice-independent null)
  - transcript length t along the geometric ladder
  - ring degree n in {4, 8}
  - sampler width (primary, secondary)
  - instance (two per degree)
  metrics:
    primary:
    - fitted log-log convergence exponent per arm with bootstrap 95 percent interval
    - signal-minus-floor exponent difference with a bootstrap interval on the difference
    - fitted slope of the lattice-independent null (must be indistinguishable from zero)
    - isometry-aware distance curve in t per arm
    secondary:
    - fitted intercept per arm
    - rejection-sampler acceptance rate and wall-clock per arm
    - exponent stability across sampler widths and across instances
    - shuffled-transcript control agreement
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Delta = a_signal - a_floor, the difference between the fitted log-log convergence exponents
      of the secret-basis arm and the public-equivalent-basis arm at ring degree 4, primary width.
    formula: 'For each arm, fit log D(t) = c + a log t by least squares over the geometric t-ladder,
      where D(t) is the isometry-aware relative Frobenius distance between M_t normalised to unit
      determinant and the normalised secret Gram matrix, minimised over the finite automorphism group
      of the lattice. Predicted: a_signal and a_floor are both near -0.5 and Delta is 0 within the
      bootstrap interval on Delta - i.e. the pre-registered prediction is the NULL, and the contract
      is written so that this outcome is a complete reportable result. |Delta| > 0.05 with intervals
      excluding zero is the alternative and would be reported as a measured difference at toy scale
      with no security interpretation attached.'
    source: Pre-registered in the parent proposal IDEA-20260816-b6de60 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Ring degree 4 (dimension 8) primary and ring degree 8 (dimension 16) secondary,
      chosen because exact rejection sampling and exact-rational second-moment accumulation are feasible
      there and the finite automorphism group needed for the alignment is computable. These are far
      below any deployed parameter. NO transfer assumption is made: the fitted exponent is reported
      per degree, and the only cross-degree statement permitted is whether it is stable between the
      two degrees tested. The declared toy sampler is a second and separate scope limit, since HAWK''s
      sampler is not held in this corpus; every conclusion is scoped to the declared sampler by name.'
    correspondence: null
  tail_checks:
  - Check the smallest t on the ladder, where D(t) is dominated by sampling noise and the fit must
    not be driven by those points; report the fit with and without the first two ladder points.
  - Check the largest t, where D(t) may hit a floor set by arithmetic precision rather than by statistics;
    report the precision used and whether the last points are precision-bound.
  - Check transcripts with anomalously low sampler acceptance, which may be drawn from a distorted
    region of the distribution.
  - 'Check the alignment step''s worst case: instances whose automorphism group is trivial, where
    alignment is a no-op, versus those with large groups, where it does real work; report exponents
    split by that.'
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt if the Hermite normal form check shows the public-equivalent basis does not generate the
    same lattice; the floor arm is then invalid and no signal number is reported.
  - Halt if the estimator-can-fail null shows a nonzero slope.
  - Halt the ring degree 8 arm if the rejection sampler cannot reach t = 10^5 within the wall-clock
    budget, and report a budget limit rather than any exponent.
  - Halt if the shuffled-transcript control changes the exponent.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run emits, per arm, per width and per instance, a fitted convergence exponent
    with a bootstrap interval and an intercept, together with the signal-minus-floor difference and
    its interval, with the estimator-can-fail null showing a slope indistinguishable from zero and
    the shuffled-transcript control showing no change - and reports whichever of null or difference
    obtained, both being complete results.
  falsification_criterion:
  - The signal and floor arms have indistinguishable exponents (the pre-registered expectation; a
    controlled null, fully reportable).
  - The estimator-can-fail null shows a nonzero fitted slope, voiding the estimator.
  - The distance curve admits no clean log-log fit over two decades, so no exponent exists to report
    at this scale.
  - The public-equivalent basis fails the same-lattice Hermite normal form check.
  - Exponents differ materially between the two sampler widths, making the measurement a property
    of the width.
  - The shuffled-transcript control changes the exponent.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-b6de60
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The public-equivalent-basis derivation is central and is not specified here beyond 'a declared
    deterministic reduction from the public form'; the Coordinator must fix it and must decide whether
    an approximate equivalence is admissible or whether exact same-lattice generation is required
    (this contract assumes the latter).
  - The toy sampler and its width are not derivable from anything in this corpus, since HAWK's sampler
    has not been read; the Coordinator must approve a declared substitute and accept that every conclusion
    is scoped to it.
  - Whether the second moment or some other statistic is the right observable depends on the sampler's
    symmetry properties, which the Coordinator must confirm for the chosen sampler before freezing.
  - No conversion from a fitted exponent to bits per signature is specified; if such a conversion
    is wanted, its derivation and assumptions must be added before approval rather than improvised
    at report time.
