experiment:
  id: EXP-ICINV-86e8bc
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-dc14b4
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'A ZERO-COMPUTE DECISION PROCEDURE THAT PREDICTS EVERY L1 MEASUREMENT BEFORE IT IS RUN: a
    cost functional is isogeny-class invariant whenever it factors through the ISOGENY CATEGORY --
    through the characteristic polynomial of Frobenius, equivalently through the rational Tate module
    -- and there are exactly two escape hatches, the INTEGRAL structure (group of points, Tate lattice,
    End as an order) and the PLANE EMBEDDING (the Weierstrass equation), so every candidate functional
    in the lane can be assigned a falsifiable invariance prediction in advance'
  status: draft
  objective: "(A) THE TEST, IN THREE QUESTIONS ASKED IN ORDER.\n  TEST A -- DOES C FACTOR THROUGH\
    \ THE ZETA FUNCTION? By Tate's isogeny\n    theorem over finite fields, two elliptic curves over\
    \ F_p are\n    F_p-isogenous if and only if they have the same characteristic\n    polynomial\
    \ of Frobenius x^2 - t x + p, equivalently the same #E(F_p),\n    equivalently V_ell(E) = T_ell(E)\
    \ tensor Q_ell are isomorphic as Galois\n    modules for one (hence every) ell != p. Therefore\
    \ ANY functional\n    expressible as a function of (p, t) alone -- equivalently of the zeta\n\
    \    function, equivalently of the rational Tate module with its Frobenius --\n    is a class\
    \ invariant, unconditionally and with no measurement.\n    VERDICT: INVARIANT. The axis is closed\
    \ for it.\n  TEST B -- DOES C DEPEND ON THE INTEGRAL STRUCTURE? An isogeny\n    phi : E -> E'\
    \ of degree d induces an injection T_ell(E) -> T_ell(E')\n    which is an isomorphism of Z_ell-LATTICES\
    \ only when ell does not divide\n    d. So the isogeny class contains genuinely different integral\n\
    \    structures, and everything computed from them can vary: the group\n    E(F_p) = O/(pi - 1)\
    \ up to isomorphism [Lenstra, citation to be\n    re-verified], hence the rational ell-torsion\
    \ for small ell, hence the\n    factorisation type of the division polynomials, hence End_{F_p}(E)\
    \ as an\n    ORDER (the volcano level) and h(End(E)). VERDICT: MAY VARY, and if it\n    varies\
    \ it varies ALONG THE VOLCANO -- which is the one place where\n    variation is locally detectable\
    \ and the T5 gate can be passed.\n  TEST C -- DOES C DEPEND ON THE PLANE EMBEDDING? A Weierstrass\
    \ equation is\n    not even an isomorphism invariant: (a, b) and (u^4 a, u^6 b) present the\n\
    \    same curve. So any functional reading coordinates varies ALREADY inside\n    one isomorphism\
    \ class. VERDICT: VARIES, BUT NOT BECAUSE OF THE CLASS --\n    the isogeny axis is the wrong axis\
    \ for it, and its correct null is the\n    gauge orbit (IDEA-20260807-6eb96b).\n\n(B) THE ONE-SIDED\
    \ POWER, STATED BEFORE ANYONE MISREADS IT. Test A is SUFFICIENT for invariance and NOT necessary.\
    \ A functional that does not visibly factor through (p, t) may still be invariant for a reason\
    \ the test cannot see -- IDEA-20260807-0ff796 is exactly such a case: the arity-2 relation count\
    \ is p - 1 - t, but one learns that only after discovering that the relation locus is F_p-isomorphic\
    \ to E, which no syntactic test predicts. So the procedure's verdicts are: TEST A PASSED means\
    \ PROVED INVARIANT; TEST A FAILED means NOT DECIDED, and the functional goes to Tests B and C\
    \ for a prediction that is a HYPOTHESIS, not a theorem. Any write-up that reports a Test-A failure\
    \ as \"predicted to vary\" without that qualifier is overclaiming.\n(C) THE PRE-REGISTERED PREDICTION\
    \ TABLE, which is the deliverable. Applying the three tests to the lane's declared candidate functionals:\n\
    \  f1 relation yield at arity 2, random factor base -- TEST A PASSED via\n    IDEA-20260807-0ff796's\
    \ derivation (value B^2(p-1-t)/p^2). INVARIANT.\n  f2 relation yield at a COORDINATE WINDOW --\
    \ TEST C: the window is not an\n    isomorphism invariant. VARIES BY GAUGE, not by class.\n  f3\
    \ solving degree / first-fall degree of the Semaev system -- TEST A\n    fails; TEST B applies\
    \ through the rational 2-torsion and the\n    transversality of the ideal (IDEA-20260807-0a3272,\
    \ IDEA-20260807-427cf3)\n    AND Test C applies through the window. PREDICTION: any genuine class\n\
    \    component is a two-level stratification by rational 2-torsion, riding on\n    top of a larger\
    \ gauge component.\n  f4 summation-polynomial support / nnz -- TEST C in form (it reads (a,b))\n\
    \    but the reading is only through the VANISHING pattern, which IS an\n    isomorphism invariant;\
    \ so it is gauge-invariant and reduces to\n    j in {0, 1728}. PREDICTION: constant on every class\
    \ with D_0 outside\n    {-3, -4}, two-valued otherwise (IDEA-20260807-8b9486).\n  f5 field-side\
    \ factor-base Fourier flatness -- TEST C applies (the set X_E\n    is a coordinate set) but the\
    \ ell-infinity norm is DILATION-INVARIANT, so\n    the gauge component is zero; and it is pinned\
    \ to a factor 3 by\n    Parseval/Weil regardless (IDEA-20260807-692e9b). PREDICTION: variation\n\
    \    of at most a factor 3 across ALL curves, so nothing class-specific can\n    be large.\n \
    \ f6 group-side flatness, the H-PSEUDO constant -- TEST A fails, TEST B does\n    not obviously\
    \ apply (DLs are preserved by transport), TEST C applies\n    through the window. PREDICTION:\
    \ gauge-dominated, but this is the one\n    functional where the procedure genuinely cannot predict,\
    \ because the\n    composite window-then-DL map is not covered by any of the three tests.\n  \
    \  That admission is the table's most useful entry.\n  f7 Macaulay rank profile / Hilbert function\
    \ -- TEST A fails; predicted\n    forced by (B, degrees) plus the transversality exception of\n\
    \    IDEA-20260807-427cf3, hence Test B via 2-torsion.\n  f8 embedding degree, group order, class\
    \ number of the ORDER O_K, D, D_0,\n    whether j = 0 occurs -- TEST A PASSED for all. INVARIANT,\
    \ and listed so\n    that no lane spends compute measuring them.\nEach row is a falsifiable prediction\
    \ registered before any run, and the table's value is that it converts eight fishing expeditions\
    \ into eight hypothesis tests.\n(D) THE TWO OUTCOMES. OUTCOME T (table holds): every L1 measurement\
    \ lands where the procedure predicts, the campaign gains a reusable decision rule, and the lane's\
    \ negative results acquire a mechanism rather than a shrug. OUTCOME X (some row fails): a functional\
    \ varies within a class in a way none of the three tests explains -- which means a fourth escape\
    \ hatch exists, and identifying it would be the single most valuable output of the entire lane.\
    \ OUTCOME X is what the record is fishing for and it is why the table is written down in advance\
    \ where it can be contradicted."
  resource_label: 'audit: consumes no resource. This is a classification of OTHER lanes'' resources.
    Rows in the table are labelled with the resource their functional consumes (R1, R2, R4, R5) but
    the procedure itself reads nothing and mounts nothing.'
  admissibility: admissible
  admissibility_argument: 'Vacuously admissible as an audit. Its relationship to the admissibility
    filter is the useful one: TEST A doubles as a cheap GGM check in one direction. If a functional
    factors through (p, t), then it is computable from the group order, which every algorithm knows
    for free, so it can carry no non-generic information whatsoever -- a strictly stronger statement
    than "it is class-invariant". Any lane proposing to exploit such a functional is closed before
    it costs anything, which is the same service RQ-GGMB-6eaabc provides for oracles and should be
    cross-checked with it.'
  reachability_gate: 'ADDRESSED AT THE LEVEL OF THE WHOLE LANE, WHICH IS THIS RECORD''S BEST CONTRIBUTION
    TO T5. The procedure''s Test B says that the ONLY class-varying data a functional can read is
    the INTEGRAL layer -- the volcano level, the group structure, the small-ell torsion. Every one
    of those is LOCALLY COMPUTABLE at a vertex in polylog(p): the level by counting rational ell-isogenies,
    the group structure by computing the group exponent, the torsion by factoring a division polynomial.
    THEREFORE, IF THE THREE-LAYER DECOMPOSITION IS COMPLETE (H1), THEN ANY GENUINE WITHIN-CLASS VARIANCE
    IS AUTOMATICALLY LOCALLY DETECTABLE AND THE T5 GATE IS AUTOMATICALLY PASSED -- route (R-local)
    of IDEA-20260807-c36472. That is a strong and previously unstated structural consequence: under
    H1, the reachability worry and the variance worry are not independent, and the campaign cannot
    end up in the awkward position of finding large variance it cannot reach. Conversely, if a variance
    is found that is NOT locally detectable, H1 is refuted and a fourth escape hatch exists. The two
    possible worlds are distinguished by the same measurement, which is why this entry belongs in
    the record.'
  inputs:
    procedure: 'STAGE 0 (zero compute, THE DELIVERABLE): write Step 1''s three facts with citation
      status, apply the tests, freeze the table of (C) with the refuting observation named per row,
      and write the (B) one-sided-power caveat and the nearby-object counterexample beside it. STAGE
      1 (minutes): the three misclassification nulls must receive three different labels. STAGE 2
      (minutes, shared instrument check): assert constancy of #E(F_p), t, D, embedding degree across
      every enumerated class. STAGE 3 (zero compute, deferred): score the table against the L1 records
      when they report; escalate failing rows as candidate fourth escape hatches, each with a named
      mechanism or an explicit "unexplained". The entire record costs under an hour and its value
      is that it must be done BEFORE the expensive records, not after.'
    mechanism: "STEP 1 -- STATE THE THREE FACTS PRECISELY, WITH CITATIONS.\n  (i) TATE'S ISOGENY THEOREM\
      \ (finite fields): for E, E' over F_q, E and E'\n  are F_q-isogenous iff #E(F_q) = #E'(F_q)\
      \ iff the characteristic\n  polynomials of Frobenius agree iff V_ell(E) ~= V_ell(E') as Galois\
      \ modules\n  for some (equivalently every) ell != char. Cited, not proved.\n  (ii) An isogeny\
      \ of degree d induces T_ell(E) -> T_ell(E') with cokernel of\n  order equal to the ell-part\
      \ of d; so integrally the lattices differ.\n  (iii) [Lenstra, citation to be re-verified] for\
      \ ordinary E with\n  End_{F_q}(E) = O, E(F_q) ~= O/(pi - 1) as O-modules, so the group\n  structure\
      \ is determined by the ORDER and therefore varies along the\n  volcano while the ORDER of the\
      \ group does not.\nEach fact is written with its exact statement and its citation status, and\
      \ any that fails re-verification removes exactly one row of the procedure.\nSTEP 2 -- APPLY\
      \ THE TESTS TO EVERY DECLARED FUNCTIONAL AND FREEZE THE TABLE. The table in (C) is written,\
      \ dated, and committed before any L1 measurement is read. Each row carries: the functional;\
      \ the test that decides it; the predicted verdict; the record that will test it; and the single\
      \ observation that would refute the row.\nSTEP 3 -- THE CHEAP EXHAUSTIVE CHECK OF TEST A'S ROWS.\
      \ Every row predicted INVARIANT by Test A is checked exhaustively at toy scale on complete classes\
      \ -- not because the theorem is in doubt but because a mismatch would reveal that the IMPLEMENTED\
      \ functional is not the one the table analysed, which is the realistic failure mode. Cost: one\
      \ pass over an enumeration another record is already paying for.\nSTEP 4 -- ADJUDICATION AFTER\
      \ THE LANE'S MEASUREMENTS. When IDEA-20260807-0ff796, -0a3272, -8b9486, -692e9b and -427cf3\
      \ report, each result is scored against its frozen row. Rows that hold are recorded as confirmed\
      \ predictions; rows that fail are escalated as candidate FOURTH ESCAPE HATCHES and each gets\
      \ a named mechanism hypothesis or an explicit \"unexplained\", which under docs/inventor-protocol.md's\
      \ closure standard is the only honest label for a variance with no mechanism.\nSTEP 5 -- FORWARD\
      \ GUIDANCE, WRITTEN NOW. If the table holds entirely, the lane's conclusion is: the only class-varying\
      \ data available to a cost functional is the INTEGRAL layer, i.e. the volcano; therefore the\
      \ campaign's remaining live surface is exactly L2 (RQ-VOLC-f6253b) and L7 (RQ-TORS-8c7b79, ell-torsion\
      \ as a Galois module), and every other lane is either measuring gauge or measuring a zeta-function\
      \ invariant. That is a concrete, named, forward-looking closure rather than a fatigue report."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - three misclassification nulls with known distinct labels
  - the class-enumeration constancy check (shared instrument)
  - the nearby-object counterexample (arity-2 relation count) published beside the table as the measure
    of the procedure's power
  - an explicit UNDECIDABLE row, demonstrating the procedure can abstain
  - "NULL OBJECT (from the proposal): MANDATORY, AND FOR A CLASSIFICATION PROCEDURE THE NULL IS AN\
    \ OBJECT THE PROCEDURE MUST GET WRONG IF IT IS NOT DISCRIMINATING. THE MATCHED NULL: a set of\
    \ DELIBERATELY MISCLASSIFIED functionals -- three quantities constructed so that the correct verdicts\
    \ are known in advance and are not all the same.\n  (n1) #E(F_p) itself: must be classified INVARIANT\
    \ by Test A. If the\n    procedure says anything else it is broken.\n  (n2) the integer a (the\
    \ Weierstrass coefficient) as a \"functional\": must\n    be classified VARIES BY GAUGE via Test\
    \ C, since u^4 a ranges over an\n    entire orbit.\n  (n3) the number of rational 3-torsion points:\
    \ must be classified MAY VARY\n    via Test B, since it is an integral-layer quantity.\nA procedure\
    \ that returns the same label on all three discriminates nothing (KN-TECH-1a5b7e mode 4) and must\
    \ be rewritten. THE DECAY PARAMETER: the fraction of the lane's functionals the procedure can\
    \ decide. As more composite functionals are added (window-then-DL, model-then-window), the decidable\
    \ fraction must FALL -- a procedure that confidently labels every composite is over-fitting its\
    \ own vocabulary, and f6 in the table is labelled UNDECIDABLE precisely to demonstrate that the\
    \ procedure can abstain."
  independent_variables: []
  metrics:
    primary:
    - the frozen table, dated, with predicted verdict and refuting observation per row
    - the labels assigned to n1, n2, n3
    - constancy check results per enumerated class
    - 'after Stage 3: rows held, rows failed, and the named mechanism or "unexplained" for each failure'
    secondary: []
  heuristic_under_test: null
  preregistered_prediction:
    quantity: null
    formula: null
    source: null
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - 'HIDDEN FACTORISATION. The worked failure: a functional that reads coordinates but equals a function
    of (p, t) by a geometric identity. The procedure produces FALSE "not decided" verdicts here, never
    false "invariant" verdicts -- the error is one-directional and that asymmetry must be stated,
    because it means the procedure is safe to use for closure and unsafe to use for prediction of
    variance.'
  - COMPOSITE FUNCTIONALS. Anything reading two layers (window then DL, model then window) is outside
    the vocabulary. Marked UNDECIDABLE, never forced.
  - SUPERSINGULAR CONTAMINATION. t = 0 classes over F_p have non-commutative endomorphism structure
    and are excluded; if the enumeration includes them the labels are wrong.
  - IMPLEMENTATION DRIFT. The table analyses an idealised functional; the executor measures an implemented
    one (e.g. a Groebner proxy from harness/semaev.py rather than a solving degree). A row can fail
    purely because the implemented quantity is not the analysed one, and Step 3's exhaustive check
    of the Test-A rows exists to catch exactly that.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: null
  falsification_criterion:
  - The three misclassification nulls receive the same label. The procedure discriminates nothing
    and must be rewritten before any row is used.
  - 'Some enumerated class has members with different #E(F_p) or t. The class enumeration is broken;
    this halts the entire lane, not just this record.'
  - Fewer than 6 of 8 table rows hold. The procedure lacks predictive power; the honest report is
    that the classification is descriptive rather than predictive, and it may not be used to allocate
    compute.
  - 'A functional varies within a class in a way no test explains (OUTCOME X). This FALSIFIES the
    completeness of the three-layer decomposition and is the record''s most valuable possible result:
    a fourth escape hatch exists and finding it becomes the campaign''s priority.'
  - Tate's theorem or the Lenstra citation fails re-verification. The corresponding test loses its
    foundation and the affected rows revert to undecided.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
