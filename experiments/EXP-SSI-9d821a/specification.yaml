experiment:
  id: EXP-SSI-9d821a
  version: 9
  schema: SSI-CANONICAL-v9
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: null
  hypothesis_note: >-
    Deliberate null: this is a design-only correction of the fixed-advice
    contract, not an executed test, an attack construction, or a cryptanalytic
    hypothesis transition.
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  batch_id: BATCH-1ab3b0
  source_proposal: ledger/proposals/IDEA-20260806-9c2f80.yaml
  direct_predecessor: EXP-SSI-16649a
  supersedes: EXP-SSI-16649a
  title: >-
    Canonical framed-byte, finite-control, and disjoint-cost contract for the
    fixed-advice classical OneEnd frontier
  objective: >-
    Replace the v8's prose-level physical intent with one byte grammar that a
    conforming implementation can serialize, parse, hash, charge, replay, and
    invalidate without consulting inherited clauses. The contract separates
    fixed-width table slots from length-bounded payload blobs, binds every
    pointer and digest, totalizes finite terminal behavior, and makes setup,
    query, memory, certificate, HNF/output, paired-null, C-pair, synthetic,
    and incumbent gates explicit. This remains design-only and cannot claim a
    lower bound, an attack, a security result, a changed exponent, or a result
    for any deployed system.
  claim_ceiling: >-
    At most a mechanically reviewable contract for the named finite
    construction and its controls. It cannot establish an all-advice lower
    bound, validate H-ADV-1 through H-ADV-4, transfer to EndRing, Isogeny,
    SQIsign, or CSIDH security, or make a positive SIDH/SIKE torsion-image
    claim.
  metrics:
    required: [validity_status, terminal_code, total_foe, memory_bytes, q_cap, break_even_q]
    note: >-
      These are output columns only. No metric is populated by this design
      record and no run is authorized.
  budget:
    wall_clock_seconds: 900
    memory_gb: 2
    maximum_runs: 0
    note: >-
      Zero runs are permitted by this design-only successor. A future
      Coordinator approval must issue a separate Executor handoff.
  success_criterion: >-
    Not applicable until this exact contract, the incumbent gate, and all
    independent review gates are satisfied; this record is not evidence-eligible.

  inputs:
    proposal: ledger/proposals/IDEA-20260806-9c2f80.yaml
    direct_predecessor_contract: experiments/EXP-SSI-16649a/specification.yaml
    predecessor_validator: coordination/goals/GOAL-SSI-001/batches/BATCH-726c16/reviews/TASK-20260809-d2b66e/validation_report.yaml
    predecessor_red_team: coordination/goals/GOAL-SSI-001/batches/BATCH-726c16/reviews/TASK-20260809-5ef381/red_team_report.md
    predecessor_evidence: ledger/evidence/EV-SSI-a5f9a7.yaml
    predecessor_decision: ledger/decisions/DEC-20260809-f5eca6.yaml
    incumbent_foe_gate: experiments/EXP-SSI-16649a/inputs/INCUMBENT-FOE-v1.yaml
    incumbent_foe_gate_sha256: c0cd6c84f386a833534f67e73e10862785a4911ff5dce870021add77187fbcf8
    c_pair_control_manifest: experiments/EXP-SSI-9d821a/controls/C-PAIR-REF-v4.yaml
    synthetic_control_manifest: experiments/EXP-SSI-9d821a/controls/SYNTHETIC-REF-v4.yaml
  lineage_rule: >-
    The input files above are immutable provenance only. No field, default,
    formula, width, terminal, or cost from v8 or an earlier contract is active
    here. A v9 field missing below is invalid, not inherited. This file is the
    only active SSI-CANONICAL-v9 schema.

  scope:
    problem: >-
      The instance is a canonically encoded supersingular j-invariant E over
      F_{p^2}. The target is classical OneEnd/EndRing path finding without a
      published secret torsion image, SQIsign transcript, or CSIDH secret.
      SIDH/SIKE torsion-image recovery is excluded as a positive target.
    advice_quantifier: >-
      For every p, a single ADVICE-COMMIT-v4 is generated and digest-committed
      before any target E, instance counter, or query seed is read. Its owner
      set and helper payload are independent of E. The scoped quantifier is
      forall p exists fixed A_p forall E in V_p.
    query_scope: >-
      A query uses the already committed advice and target manifest. A single
      attempt has at most L_steps=1048576 graph steps and A_MAX=32768 attempts
      per target. The query trace excludes setup/build events by phase tag; all
      per-query reads, probes, path transitions, HNF operations, output bytes,
      and terminal bytes are included.
    prohibited_claims:
      - all-advice lower bound
      - uncharged target or factor oracle
      - hidden preprocessing or memory
      - quantum query or quantum memory claim
      - deployed-parameter security conclusion

  canonical_wire:
    schema_id: SSI-CANONICAL-v9
    one_object_grammar: >-
      Every serialized object is exactly tag(u8)||version(u8)||payload_len(u32)
      ||payload(payload_len bytes). A local layout below describes payload bytes
      only. It is never a complete frame by itself. A digest preimage names
      complete framed bytes in order and never omits the 6-byte outer prefix.
    integer_widths:
      u8: {bytes: 1, range: [0, 255], encoding: unsigned_little_endian}
      u16: {bytes: 2, range: [0, 65535], encoding: unsigned_little_endian}
      u32: {bytes: 4, range: [0, 4294967295], encoding: unsigned_little_endian}
      u64: {bytes: 8, range: [0, 18446744073709551615], encoding: unsigned_little_endian}
      BI560: >-
        Exactly sign(u8)||magnitude(70 bytes little endian). Sign is 0 for
        nonnegative and 1 for negative; magnitude is minimally represented
        inside the fixed 70 bytes with all high zero bytes retained. Negative
        zero is invalid. Magnitude >=2^560 is overflow. BI560 is used for
        degrees, matrix entries, HNF scalars, witnesses, FOE, memory totals,
        q numerators/denominators, rational references, and every mathematical
        quantity not assigned a smaller fixed width below.
      SIGNED560: exact alias of BI560; the alias is used only for signed matrix
        and witness entries.
      digest: {bytes: 32, encoding: SHA256}
      bytestring: >-
        u32 byte_length followed by exactly byte_length bytes. A bytestring is
        rejected when byte_length exceeds the enclosing object's remaining
        payload or its named global maximum.
      curve_id: >-
        version(u8=1)||j0(field_bytes)||j1(field_bytes), with field_bytes fixed
        by the p row; no variable curve identifier occurs in a fixed record.
    frame_limits:
      payload_len_max: 4294967295
      object_bytes_max: 4294967301
      source_blob_bytes_max: 67108864
      helper_payload_bytes_max: 67108864
      certificate_bytes_max: 67108864
      trace_bytes_max: 67108864
      output_bytes_max: 8388608
      matrix_rows_max: 512
      matrix_columns_max: 512
      factor_count_max: 65535
      witness_count_max: 65535
      event_frame_bytes: 143
      event_count_max: 400000
      trace_header_bytes_max: 142
      overflow_precedence: >-
        Check fixed dimensions, multiplication/addition bounds, payload length,
        and digest preimage size in that order. The first failed check emits
        OVERFLOW and no later terminal or result may replace it.
    required_field_audit: >-
      Every scalar named in this document appears in the width inventory:
      tags/versions/codes use u8; byte lengths and factor counts use u32 or
      u16 as stated; indices, counts, capacities, offsets, and operation counts
      use u64 with explicit maxima; arithmetic, FOE, memory, q, and rational
      values use BI560. Any new field requires a versioned successor and may not
      silently use an inherited width.

  parameters:
    primes:
      - {label: SQISign-I, p_code: 1, p_expression: 5*2^248-1, field_bytes: 32, security_label_bits: 256}
      - {label: SQISign-V, p_code: 2, p_expression: 27*2^500-1, field_bytes: 64, security_label_bits: 512}
    fp2: >-
      u^2+1=0. Field elements are j0+j1*u, with coefficient order j0,j1,
      each coefficient in [0,p-1], and no noncanonical reduction during parse.
    limits:
      vertex_count_max: 4000000
      max_curve_id_bytes: 129
      owner_count_max: 8388607
      endpoint_pair_count_max: 262144
      helper_capacity_max: 524288
      target_count_max: 2000000
      selection_count: 4
      requested_owner_count_max: 16000
      builder_record_stride: 4096
      builder_record_bytes_max: 4090
      expression_bytes_max: 256
      endpoint_record_payload_max: 506
      endpoint_record_stride: 512
      endpoint_count_max: 7
      graph_steps_max: 1048576
      attempts_max: 32768
    derived_bound_checks:
      - vertex_count <= vertex_count_max and 6 + 1 + 4 + expression_bytes_max + 32 + 8 + vertex_count*max_curve_id_bytes + 32 <= frame_limits.object_bytes_max
      - owner_count <= min(vertex_count, owner_count_max)
      - endpoint_pair_count <= owner_count*owner_count and endpoint_pair_count <= endpoint_pair_count_max
      - helper_capacity = 1 << ceil_log2(max(2, 2*endpoint_pair_count)) and helper_capacity <= helper_capacity_max
      - target_count <= min(vertex_count, target_count_max)
      - target_count*selection_count*128 + 172 <= frame_limits.payload_len_max
      - helper_capacity*96 <= 67108864
      - payload_blob_bytes <= helper_payload_bytes_max
      - requested_owner_count*builder_record_stride + 6 <= frame_limits.object_bytes_max
      - requested_owner_count*builder_record_stride <= source_blob_bytes_max
      - every offset + length <= corresponding blob length
      - every matrix 8 + rows*columns*71 + 32 <= frame_limits.payload_len_max
      - event_count*event_frame_bytes + trace_header_bytes_max <= trace_bytes_max
      - witness_count*71 + 138 <= output_bytes_max
      - every BI560 magnitude < 2^560

    serialized_size_definitions:
      frame_prefix_bytes: 6
      vertex_manifest_bytes: >-
        6 + 1 + (4 + expression_bytes) + 32 + 8 + vertex_count*curve_id_bytes + 32;
        expression_bytes is the exact bytestring body length and curve_id_bytes is
        the exact fixed curve-id length for the selected p row.
      order_manifest_bytes: >-
        6 + 1 + 8 + owner_count*8 + 32 + (4 + generator_id_bytes) + 32 + 32 + 32 + 32.
        generator_id_bytes is the exact bytestring body length.
      helper_payload_blob_bytes: >-
        6 + payload_blob_bytes, where payload_blob_bytes is the exact payload
        length of the single framed helper payload blob.
      helper_frame_payload_bytes: >-
        1 + 8 + 8 + 2 + 32 + helper_capacity*96 +
        (4 + helper_payload_blob_bytes) + 32.
      index_frame_payload_bytes: >-
        1 + 32 + 32 + 32 + 32 + 8 + 1 + 2 +
        target_count*selection_count*128 + 32.
      source_generator_bytes: >-
        4 + source_generator_payload_bytes; this is the exact bytestring length
        charged for the generator source, including its u32 length field.
      peak_build_workspace_bytes: >-
        max(endpoint_candidate_buffer_bytes, endpoint_sort_buffer_bytes,
        helper_digest_buffer_bytes), with each component retained in the
        artifact's memory table and no unlisted allocator allowance.
      peak_index_build_workspace_bytes: >-
        max(selection_record_buffer_bytes, index_digest_buffer_bytes), with both
        exact component sizes retained in the artifact's memory table.
      incumbent_source_bytes: >-
        6 + incumbent_payload_bytes, the exact serialized length of the
        hash-bound INCUMBENT-FOE-v1 frame.
      endpoint_candidate_buffer_bytes: endpoint_pair_count_max*endpoint_record_stride
      endpoint_sort_buffer_bytes: endpoint_pair_count_max*endpoint_record_stride
      helper_digest_buffer_bytes: helper_payload_bytes_max
      selection_record_buffer_bytes: selection_count*128
      index_digest_buffer_bytes: 65536

  manifests:
    vertex_manifest:
      format: SSJ-MANIFEST-v4
      generation: >-
        Enumerate every (j0,j1) in [0,p-1]^2, evaluate exact S_p over F_{p^2},
        retain exact roots, reject duplicate curve_id, sort by curve_id, and
        serialize the resulting finite list. No estimate replaces the list.
      payload: >-
        p_code(u8)||expression(bytestring)||S_p_digest(32)||vertex_count(u64)||
        vertex_count*curve_id||manifest_digest(32). bytestring is u32 length
        followed by bytes.
      digest_preimage: frame(tag=0x10,version=4,payload_without_manifest_digest)||body_frames
      setup_events: [vertex_enumeration, polynomial_evaluation, duplicate_rejection, sort, serialize, digest]
    advice_commit:
      format: ADVICE-COMMIT-v4
      payload: >-
        p_code(u8)||advice_seed(32)||owner_generator_id(bytestring)||
        owner_generator_digest(32)||owner_count(u64)||owner_set_digest(32)||
        order_manifest_digest(32)||helper_digest(32)||target_independence_tag(u8=1)||
        advice_commit_digest(32)
      generation: >-
        advice_seed is committed before target selection. The owner generator
        consumes only p_code, the vertex manifest digest, advice_seed, and the
        fixed generator digest. It may not consume target_curve_id, instance,
        attempt, or selection code.
      digest_preimage: complete ADVICE-COMMIT-v4 frame excluding advice_commit_digest
    order_manifest:
      format: ORDER-MANIFEST-v4
      payload: >-
        p_code(u8)||owner_count(u64)||owner_count*owner_index(u64)||
        owner_set_digest(32)||generator_id(bytestring)||generator_digest(32)||
        generator_seed(32)||hnf_source_digest(32)||manifest_digest(32)
      canonical_order: owner_index ascending, with duplicate and out-of-range rejection
      digest_preimage: complete ORDER-MANIFEST-v4 frame excluding manifest_digest
      setup_events: [owner_generate, owner_sort, owner_duplicate_check, hnf_order_generate, serialize, digest]

  physical_contracts:
    c_helper:
      format: C-HELPER-v4
      design: >-
        The hash table contains fixed metadata slots only. Variable factor and
        matrix bytes live in one separately framed payload blob. A slot points
        into that blob and binds the exact range by offset, length, and digest.
      constants:
        slot_width_bytes: 96
        slot_count_width: u64
        key_width: 32
        payload_offset_width: u64
        payload_length_width: u32
      slot_payload: >-
        slot_tag(u8=0xC1)||state(u8=1)||pair_key(32)||owner_index(u64)||
        endpoint_index(u64)||payload_offset(u64)||payload_length(u32)||
        payload_digest(32)||reserved(u16=0). This is exactly 96 bytes.
      empty_slot: exactly 96 zero bytes; an empty slot has no key or pointer.
      payload_blob: >-
        A frame tag=0xC2, version=4, whose payload is a sequence of exactly
        payload_length bytes. Each occupied slot range points to one
        HELPER-PAYLOAD-v4 frame. Ranges are non-overlapping, in bounds, and
        sorted by offset; each range digest is SHA256(exact range bytes).
      helper_payload: >-
        HELPER-PAYLOAD-v4 payload is owner_index(u64)||endpoint_index(u64)||
        middle_degree(BI560)||factor_count(u16)||factor_count*factor(BI560)||
        matrix_digest(32)||matrix_frame(bytestring)||payload_flags(u8)||
        helper_payload_digest(32). The
        complete helper payload, including matrix bytes, is therefore bound by
        the slot pointer and digest; no hidden factor list exists.
      helper_payload_digest_preimage: >-
        helper_payload_digest is SHA256 of the complete HELPER-PAYLOAD-v4 frame
        excluding its final helper_payload_digest field. matrix_digest is the
        digest of the complete MATRIX-v4 frame excluding matrix_digest.
      key_generation: >-
        pair_key=SHA256(frame(tag=0xC3,version=4,p_code||owner_curve_id||
        endpoint_curve_id||owner_index(u64)||endpoint_index(u64))). The same
        preimage is used by builder and query; no second key domain exists.
      capacity: >-
        If A_C=endpoint_pair_count is zero, capacity=2. Otherwise capacity is
        the least power of two >=2*A_C. A_C<=262144 is checked before this
        operation, so capacity<=524288 and capacity*96<=67108864.
      insertion: >-
        Sort occupied records by pair_key, insert by linear probing from the
        low 64-bit integer of pair_key modulo capacity, compare all 32 key
        bytes, and charge every probe. Duplicate keys, full-table insertion,
        or pointer overlap emit OVERFLOW/INVALID_RECORD by the terminal table.
      helper_frame_payload: >-
        p_code(u8)||capacity(u64)||occupied_count(u64)||slot_width(u16=96)||
        payload_blob_digest(32)||slot_body(capacity*96 bytes)||
        payload_blob_frame(bytestring)||helper_digest(32)
      digest_preimage: complete C-HELPER-v4 frame excluding helper_digest
      memory_bytes: 6 + helper_frame_payload_bytes + source_generator_bytes + peak_build_workspace_bytes
      events: [helper_key_hash, helper_sort, helper_probe, helper_slot_compare, helper_payload_read, helper_payload_digest, helper_digest]
    target_selection_index:
      format: TARGET-SELECTION-INDEX-v4
      selection_map:
        format: SELECTION-MAP-v4
        entries: >-
          The exact payload is entry[0]||entry[1]||entry[2]||entry[3]||map_digest(32).
          Four fixed entries, one per selection_code 0..3. Each entry is
          selection_code(u8)||owner_role(u8)||endpoint_role(u8)||branch_code(u8)||
          certificate_role(u8). The map is [0: target-owner,next-endpoint,0,0],
          [1: target-owner,next-endpoint,1,1], [2: next-owner,target-endpoint,2,0],
          [3: next-owner,target-endpoint,3,1]. Role resolution is a deterministic
          u64 index function over the committed owner set and target index.
          map_digest(32) is the final payload field, so the payload is exactly
          20+32=52 bytes before the outer frame prefix.
        digest_preimage: complete SELECTION-MAP-v4 frame excluding map_digest;
          map_digest(32) is the final payload field
      query_key: >-
        query_key=SHA256(frame(tag=0xD2,version=4,p_code||target_manifest_digest||
        advice_commit_digest||target_index(u64)||selection_code(u8)||
        selection_map_digest||pair_key(32))). This is the only query-key domain,
        and its pair_key is exactly the C-helper key domain above.
      record_width_bytes: 128
      record_payload: >-
        record_tag(u8=0xD3)||target_index(u64)||selection_code(u8)||branch_code(u8)||
        pair_key(32)||payload_offset(u64)||payload_length(u32)||payload_digest(32)||
        query_key(32)||reserved(9 bytes). This is exactly 128 bytes.
      index_frame_payload: >-
        p_code(u8)||target_manifest_digest(32)||advice_commit_digest(32)||
        owner_set_digest(32)||selection_map_digest(32)||target_count(u64)||
        selection_count(u8=4)||record_width(u16=128)||records(target_count*4*128 bytes)||
        index_digest(32)
      record_order: (target_index ascending, selection_code ascending)
      generation: >-
        Resolve the selection map, derive the unique owner/endpoint indices,
        derive exactly the C-helper pair_key, perform the helper lookup, and
        serialize the pointer, digest, and query_key. The target manifest digest
        and selection map digest are in both header and query-key preimage.
      digest_preimage: complete TARGET-SELECTION-INDEX-v4 frame excluding index_digest
      lookup: binary search on the fixed record order; every comparison, read, pointer check, and digest check is charged
      memory_bytes: 6 + index_frame_payload_bytes + peak_index_build_workspace_bytes

  finite_builder:
    request_frame: >-
      BUILDER-REQUEST-v4 payload is p_code(u8)||advice_commit_digest(32)||
      request_id(u64)||requested_owner_count(u64)||request_seed(32)||
      vertex_manifest_digest(32)||order_manifest_digest(32)||request_digest(32).
      request_digest is SHA256 of the same payload with its final digest field
      omitted. The request contains no target or instance field.
    owner_record_stride: 4096
    endpoint_record_stride: 512
    endpoint_record: >-
      ENDPOINT-RECORD-v4 is an outer frame of exactly 512 bytes. Its 506-byte
      payload is endpoint_index(u64)||endpoint_curve_id(bytestring)||pair_key(32)||
      helper_payload_offset(u64)||helper_payload_length(u32)||helper_payload_digest(32)||
      endpoint_digest(32)||zero padding to exactly 506 bytes. The endpoint
      curve-id bytestring is bounded by max_curve_id_bytes and every padding byte
      is included in the frame digest. endpoint_count<=endpoint_count_max=7.
    owner_record: >-
      Each requested owner position emits exactly one 4096-byte stride. The
      first 6 bytes are the outer frame prefix; the framed payload is exactly
      4090 bytes and is owner_index(u64)||endpoint_count(u32)||
      endpoint_count*ENDPOINT-RECORD-v4 (each exactly 512 bytes)||record_digest(32)||
      zero padding to exactly 4090 bytes. record_digest is the final semantic
      field and covers the complete payload through the endpoint records but
      excluding record_digest and padding. The remaining bytes are deterministic
      zero padding. A short semantic record is never a short physical stride.
    builder_digest_preimage: >-
      record_digest covers the owner record payload through the endpoint records;
      terminal stream_digest covers request_frame||all fixed strides||terminal
      frame with stream_digest omitted.
    terminal_codes:
      0: ZERO_REQUEST
      1: COMPLETE
      2: FINITE_OWNER_EXHAUSTED
      3: CANDIDATE_CAP
      4: INVALID_RECORD
      5: OVERFLOW
      6: INFRASTRUCTURE_UNAVAILABLE
      7: REPLAY_IDENTITY_FAILURE
    terminal_precedence: [OVERFLOW, REPLAY_IDENTITY_FAILURE, INVALID_RECORD, INFRASTRUCTURE_UNAVAILABLE, CANDIDATE_CAP, FINITE_OWNER_EXHAUSTED, COMPLETE]
    zero_request_rule: >-
      requested_owner_count=0 emits ZERO_REQUEST before evaluating any other
      terminal condition; terminal_precedence applies only when the request is
      nonzero and two or more terminal conditions are simultaneously visible.
    null_record: >-
      For every position not retained, emit the same 4096-byte stride with
      record_tag=0xB2, position(u64), null_reason(u8), zero numeric fields,
      SHA256(empty) as record_digest, and zero padding. If a terminal occurs
      early, all remaining requested positions receive null records before the
      terminal frame. Thus S_eff=retained_count is explicit and no partial row
      or silently omitted owner exists.
    terminal_frame: >-
      BUILDER-TERMINAL-v4 payload is request_digest(32)||terminal_code(u8)||
      terminal_position(u64)||requested_count(u64)||emitted_count(u64)||
      retained_count(u64)||candidate_count(u64)||stream_digest(32)||
      terminal_reason(bytestring)||reserved(16 zero bytes). Its exact length is
      determined by the reason bytestring and its outer frame.
    terminal_identity: >-
      stream_digest=SHA256(request_frame||all fixed strides||terminal frame with
      stream_digest omitted). A terminal cannot be detached from request,
      seed, count, or position. FINITE_OWNER_EXHAUSTED is distinct from
      CANDIDATE_CAP and is emitted when the committed finite owner manifest is
      exhausted before requested_count.
    restart: >-
      A query attempt seed is SHA256(tag=0x90||version=4||advice_commit_digest||
      target_manifest_digest||target_index(u64)||attempt(u64)). Terminal
      COMPLETE/non-success may restart until A_MAX; INFRASTRUCTURE_UNAVAILABLE
      stops the run as infrastructure failure, never as mathematical evidence.

  arithmetic_and_memory:
    primitive_table:
      - {code: 1, name: field_add, unit_foe: 1}
      - {code: 2, name: field_mul, unit_foe: 1}
      - {code: 3, name: field_inv, unit_foe: 1}
      - {code: 4, name: byte_read_64, unit_foe: 1}
      - {code: 5, name: byte_write_64, unit_foe: 1}
      - {code: 6, name: hash_block_64, unit_foe: 1}
      - {code: 7, name: byte_compare_64, unit_foe: 1}
      - {code: 8, name: matrix_row_op, unit_foe: 1}
      - {code: 9, name: transition_check, unit_foe: 1}
      - {code: 10, name: output_serialize_64, unit_foe: 1}
    event_frame: >-
      EVENT-v4 payload is phase(u8)||event_code(u8)||operation_count(u64)||
      input_bytes(u64)||hash_blocks(u64)||byte_units(u64)||event_foe(BI560)||
      operand_digest(32). This fixed payload is 137 bytes and every complete
      outer event frame is 143 bytes. For each code, the declared count is
      checked against the rule table; an unlisted event is invalid.
    event_cost_rules:
      - {codes: [1, 2, 3, 8, 9], rule: event_foe=BI560(operation_count), input_bytes=0, hash_blocks=0, byte_units=0}
      - {codes: [4, 5, 7, 10], rule: byte_units=ceil(input_bytes/64), operation_count=byte_units, hash_blocks=0, event_foe=BI560(byte_units)}
      - {codes: [6], rule: hash_blocks=ceil((input_bytes+9)/64), operation_count=hash_blocks, byte_units=0, event_foe=BI560(hash_blocks)}
    phase_partition:
      setup_phase: 0
      query_phase: 1
      setup_events: [vertex_enumeration, order_manifest_build, advice_commit_build, helper_build, index_build, source_read, setup_digest]
      query_events: [index_read, helper_slot_read, helper_payload_read, certificate_read, graph_step, hnf_row_op, saturation_factor, trace_write, output_serialize, terminal_write]
      rule: >-
        T_setup is the sum of phase-0 events exactly once per ADVICE-COMMIT-v4.
        T_attempt is the sum of phase-1 events for one attempt. A query may read
        setup bytes, but that read is a phase-1 byte event and the setup build
        event is never repeated in T_q_run. No event may carry both phases.
    trace_sum: >-
      T_attempt is the exact BI560 sum of every phase-1 event in one attempt,
      including failed, null, terminal, certificate, HNF, and output events.
      W=T_attempt. For q_cap>0, T_q_run is E[W] under the declared finite
      attempt distribution and T_q=T_q_run/q_cap; q_cap=0 gives infinity.
      T_q_run is an expectation over attempts, never the cost of the setup
      phase and never the trace of one specially selected successful attempt.
    q_and_restart: >-
      q_cap is the probability that an independently seeded attempt emits a
      valid non-scalar OUTPUT-v4 before L_steps. Restart attempts are indexed
      0..A_MAX-1 and use the exact seed rule above. Censored attempts retain
      their complete trace and count in E[W]; they are not dropped.
    amortization: >-
      For Q targets using the same fixed advice, total=T_setup+Q*T_q. The
      least positive integer Q satisfying T_setup+Q*T_q <= Q*T_inc_foe is
      computed by integer cross multiplication only. If the incumbent is
      missing, q_cap=0, or T_inc_foe<=T_q, break_even_q is undefined.
    memory_live_ranges:
      - [vertex_manifest, stage0, 0, vertex_manifest_bytes]
      - [order_manifest, stage0, 1, order_manifest_bytes]
      - [helper_slots, stage0, 2, helper_capacity*96]
      - [helper_payload_blob, stage0, 3, helper_payload_blob_bytes]
      - [query_index, stage0, 4, index_frame_payload_bytes]
      - [certificate_mirror, query, 5, certificate_bytes_max]
      - [matrix_hnf_workspace, query, 6, matrix_rows_max*matrix_columns_max*71]
      - [event_trace, query, 7, trace_bytes_max]
      - [output_buffer, query, 8, output_bytes_max]
      - [incumbent_source, stage0, 9, incumbent_source_bytes]
    memory_rule: >-
      M_advice is the sum of all stage-0 retained buffers whose live ranges
      overlap; M_work is the maximum sum over stage-1 live ranges plus the
      retained advice buffers. Every named size is a serialized byte length
      from a frame, source receipt, or explicit global bound. No undefined
      header_bytes or external source buffer is free.
    incumbent: >-
      T_inc_foe is read only from the hash-bound INCUMBENT-FOE-v1 input. That
      artifact is currently pending_external_measurement with null values. The
      asymptotic p^(1/3+o(1)) label is not a FOE number. Missing or mismatched
      source, command, commit, digest, parameter, memory, or verification
      receipt emits INVALID_ACCOUNTING and forbids freeze.

  certificate_hnf_output:
    edge_certificate:
      format: EDGE-CERT-v4
      outer_payload: >-
        p_code(u8)||target_manifest_digest(32)||target_index(u64)||
        advice_commit_digest(32)||horizon(u64)||edge_count(u64)||
        path_bytes(u64)||provider_key_digest(32)||provider_receipt_frame(bytestring)||
        mirror_path(bytestring)||mirror_digest(32)||transition_root(32)||
        transition_frames(bytestring)||certificate_digest(32)
      transition_frame: >-
        EDGE-TRANSITION-v4 payload is source_index(u64)||destination_index(u64)||
        degree(BI560)||factor_count(u16)||factor_count*factor(BI560)||
        transition_witness_digest(32). Every transition is one complete frame;
        edge_count equals the number of frames and path_bytes equals their exact
        concatenated length.
      root: SHA256(concatenation of complete transition frame bytes in order)
      digest_preimage: complete EDGE-CERT-v4 frame excluding certificate_digest
      provider_authentication: >-
        PROVIDER-RECEIPT-v4 is a framed bytestring whose payload is
        provider_id(bytestring)||artifact_digest(32)||provider_public_key(32)||
        signature_message_digest(32)||signature(64)||receipt_digest(32). The
        receipt_digest is the final field and covers the receipt frame without
        receipt_digest. signature_message_digest is SHA256 of the exact
        certificate fields from p_code through mirror_digest followed by
        transition_root, excluding provider_receipt_frame itself; signature is
        Ed25519 over that digest. The pinned provider_key_digest must match the
        public key. A missing/invalid signature is INVALID_CERTIFICATE.
      mirror_rule: >-
        mirror_digest must equal SHA256(exact transition_frames bytes) and the
        local mirror must reproduce every byte. Provider timeout or missing
        mirror is INFRASTRUCTURE_UNAVAILABLE, not proof rejection.
      bounds: horizon<=graph_steps_max, path_bytes<=certificate_bytes_max, edge_count<=graph_steps_max
    matrix: >-
      MATRIX-v4 payload is rows(u32)||columns(u32)||entries in row-major order,
      each entry is exactly SIGNED560=sign(u8)||magnitude(70 bytes), followed by
      matrix_digest(32).
      Dimensions satisfy rows<=matrix_rows_max, columns<=matrix_columns_max,
      and the exact payload length is checked before allocation. matrix_digest is
      the final payload field and covers the frame excluding matrix_digest.
    hnf: >-
      HNF-RIGHT-ROW-v3 consumes MATRIX-v4 and emits one OP-LOG-v4 frame before
      each deterministic right-row operation. OP-LOG-v4 payload is op_code(u8)||
      row(u64)||column(u64)||scalar(SIGNED560)||factor_index(u32)||
      intermediate_digest(32)||op_digest(32), with op_digest the final field
      covering the frame without op_digest. Operations are in pivot row/column order; any
      alternate order is invalid. Every factor in the certificate is consumed
      in serialized order and saturation emits SATURATION-v4 frames with the
      factor, pre-digest, post-digest, and scalar classification. A
      SATURATION-v4 payload is factor_index(u32)||factor(BI560)||
      pre_matrix_digest(32)||post_matrix_digest(32)||scalar_class(u8)||
      saturation_digest(32), with the final digest covering the frame without
      saturation_digest.
    output: >-
      OUTPUT-v4 payload is branch_code(u8)||scalar_class(u8)||witness_count(u16)||
      witness_count*SIGNED560||matrix_digest(32)||op_log_digest(32)||
      saturation_digest(32)||output_digest(32). scalar_class 0 is non-scalar,
      1 scalar, 2 null, and 3 invalid. Only class 0 with a complete witness is
      success. The only positive path is index lookup -> helper payload ->
      certificate transitions -> MATRIX-v4 -> HNF-RIGHT-ROW-v3 -> saturation ->
      OUTPUT-v4; output_digest is the final field and covers the frame without
      output_digest. No branch may bypass a frame or operation log.

  controls:
    paired_replay:
      shared_trace: >-
        Treatment and matched null serialize identical REQUEST, index/helper
        reads, certificate, graph, matrix, HNF, saturation, and terminal event
        frames through the normalized pre-classification state. The shared trace
        excludes the final scalar_class, witness, and output_digest frame.
        TRACE-SHARED-v4 payload is request_digest(32)||event_count(u64)||
        complete phase-1 event frames||normalized_matrix_digest(32)||
        normalized_op_log_digest(32)||shared_trace_digest(32), with the final
        digest covering the payload without shared_trace_digest.
      identity_frame: >-
        FINAL-IDENTITY-v4 payload is shared_trace_digest(32)||identity_bit(u8)||
        final_output_digest(32). Only identity_bit and the final output bytes
        may differ. A differing shared_trace_digest invalidates the pair.
      continuation: >-
        Treatment success does not end the shared trace early; both arms consume
        the same event count and then classify. Censoring retains both full
        traces.
    branch_null:
      branch_map: >-
        Branch codes 0..3 are exactly the four SELECTION-MAP-v4 entries. For a
        target and branch, null_owner=SHA256(frame(tag=0xF1,version=4,
        advice_commit_digest||target_index||branch_code)) mod owner_count,
        with rejection of the treatment owner and one next-distinct draw using
        the same seed schedule. The null owner index, null mutation digest, and
        branch map digest are serialized in the shared request. No owner oracle
        or branch-specific shortcut is permitted.
    c_pair:
      manifest: experiments/EXP-SSI-9d821a/controls/C-PAIR-REF-v4.yaml
      generator: >-
        The finite null reference uses the same owner marginal, endpoint pair
        generator, C-HELPER-v4 payload blob, selection map, and query index as
        treatment, with a declared deterministic replicate seed list. Its rows
        are complete FRAME-C-PAIR-v4 records; iid substitution is forbidden.
      gate: >-
        The reference manifest digest, seed-list digest, replicate count,
        censoring limit, finite table digest, and generator source digest must
        match the run. Missing or mismatched reference is INVALID_CONTROL, not
        a negative result.
    synthetic:
      manifest: experiments/EXP-SSI-9d821a/controls/SYNTHETIC-REF-v4.yaml
      cell: >-
        SYN-CELL-v4 payload is cell_seed(32)||target_set_digest(32)||
        advice_size(u64)||q_num(BI560)||q_den(BI560)||setup_foe(BI560)||
        query_foe(BI560)||incumbent_num(BI560)||incumbent_den(BI560)||
        censor_limit(u64)||target_count(u64)||cell_digest(32). q_den and every
        rational denominator are positive; cell_digest covers all prior bytes.
      recurrence: >-
        The manifest fixes a deterministic target-set generator, q recurrence,
        censoring rule, and exact rational reference law. A cell is complete
        only when every target row is present; max aggregation is over the
        complete target set. No censored target may be silently dropped.

  proof_search_map:
    exact_baseline_reproduction: >-
      Reproduce the bound incumbent source at each declared prime row before
      any comparison; absent source remains a hard admission failure.
    observation_collision_search: >-
      Hash and compare two independently serialized copies of every frame,
      mutate each pointer/length/digest/terminal field once, and require that
      every mutation is rejected. This checks frame identifiability before data.
    quantifier_order: >-
      Verify the advice seed and owner manifest digest are committed without
      target, instance, or attempt fields, then inspect that query seeds are
      derived only after that commit.
    method_ceiling_nearby_control: >-
      Use the finite C-pair and synthetic manifests under exactly the same
      framed helper/index/trace grammar; passing controls assert only
      implementation consistency, not an SSI result.

  stopping_and_artifacts:
    hard_gates_before_freeze:
      - every object uses the one outer frame grammar
      - all fixed widths and derived bounds pass the field audit
      - helper slots, payload ranges, index records, and digests recompute exactly
      - finite builder emits complete strides, terminal code, and stream identity
      - phase-0 and phase-1 FOE/memory partitions are disjoint and complete
      - certificate signature/mirror, HNF/output path, replay, pair, and synthetic manifests bind
      - independently verified incumbent measurement exists
    stopping_rules:
      - stop on any malformed frame, out-of-range pointer, digest mismatch, overflow, or identity mismatch
      - stop after A_MAX attempts or L_steps graph steps per attempt
      - preserve complete traces for all censored attempts
      - provider or mirror unavailability is failed_infrastructure, never research evidence
    required_artifacts:
      - exact command, commit, clean/dirty state, environment, dependencies, and seeds
      - all framed input/output bytes and SHA256 digests
      - complete phase-separated event trace and live-range memory table
      - validity status, terminal code, and reason
      - requested policy, resolved model, model verification, and fallback/degraded fields
      - independent Validator and Red Team reports
    completion_gate:
      - direct inputs exist and parse
      - no inherited v8 clause is active
      - C-helper slot width and payload pointer grammar are arithmetically consistent
      - queue snapshot precedes independent review
      - execution_authorized remains false and frozen remains false
