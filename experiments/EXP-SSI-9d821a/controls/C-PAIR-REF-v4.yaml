control_reference:
  id: C-PAIR-REF-v4
  format: FRAME-C-PAIR-v4
  status: design_manifest_no_measurement
  experiment_id: EXP-SSI-9d821a
  purpose: >-
    Bind the finite dependent-null reference to the exact treatment generator,
    without asserting a measured distribution or a cryptanalytic result.
  seed_schedule:
    domain_tag: 0xC8
    version: 4
    seed: SHA256(frame(tag=0xC8,version=4,p_code||advice_commit_digest||replicate_index(u64)))
    replicate_count: 32
    seed_list_materialization:
      index_domain: exactly the u64 little-endian integers 0 through 31
      entry_encoding: >-
        seed[i] is the exact 32-byte SHA256 output of the seed expression above
        with replicate_index=i. The finite list is seed[0]||...||seed[31], in
        ascending i; it is not an iid draw and no implicit seed is allowed.
      seed_list_bytes: seed[0]||seed[1]||seed[2]||...||seed[31]
    seed_list_digest: SHA256(seed_list_bytes)
  finite_reference:
    owner_marginal: exact treatment owner generator
    endpoint_generator: exact treatment endpoint generator
    helper_format: C-HELPER-v4
    selection_map: SELECTION-MAP-v4
    query_index: TARGET-SELECTION-INDEX-v4
    censor_limit: 32768
    row_format: >-
      FRAME-C-PAIR-v4 payload is replicate_index(u64)||seed(32)||
      owner_set_digest(32)||endpoint_set_digest(32)||helper_digest(32)||
      index_digest(32)||shared_trace_digest(32)||terminal_code(u8)||
      attempt_count(u64)||total_foe(BI560)||memory_bytes(BI560)||row_digest(32).
      All 32 rows are required; no row is an implicit iid draw.
    row_digest_rule: >-
      row_digest is the final field and is SHA256 of the complete row frame with
      row_digest omitted. finite_table_digest is SHA256 of the 32 complete row
      frame bytes in replicate_index order.
  admission:
    measured_rows_present: false
    independent_verification_receipt: null
    missing_reference_is: INVALID_CONTROL
    freeze_allowed: false
