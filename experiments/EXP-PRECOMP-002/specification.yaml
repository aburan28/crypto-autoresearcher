experiment:
  id: EXP-PRECOMP-002
  status: proposed
  title: F4 trace replay across target points
  objective: >-
    Build an F4 trace on one target and replay its pair/reducer/monomial/matrix
    schedule on unseen targets from the same fixed-curve point-decomposition
    family, falling back to cold F4 whenever the trace is invalid.
  fixtures:
    field_bits: [11, 13, 16, 20, 24, 28, 32]
    curve_seeds: [1, 2, 3]
    trace_training_targets: 5
    holdout_targets: 200
    decomposition_arities: [2, 3]
  reusable_state:
    - critical_pair_order
    - reducer_choices
    - monomial_universe
    - Macaulay_layouts
    - pivot_schedule_when_valid
  metrics:
    primary: warm_speedup
    required:
      - trace_success_rate
      - cold_seconds
      - trace_build_seconds
      - replay_seconds
      - fallback_seconds
      - warm_seconds_including_fallback
      - cache_bytes
      - verification_failures
  accounting: >-
    Charge trace construction, serialization, deserialization, replay,
    validation, and all cold fallback work. Report conditional replay speedup
    separately from end-to-end expected warm speedup.
  controls:
    - cold F4 on every sampled holdout or a predeclared audited subset
    - exact solution/equivalence verification against original equations
    - planted SAT and known-UNSAT controls where feasible
  success_criterion: >-
    End-to-end median warm_speedup >=5 with trace_success_rate >=0.90 in at
    least two independent >=20-bit cells.
  strong_signal: >-
    End-to-end warm_speedup >=10 at >=0.95 trace success, or >=50 conditional
    replay speedup with no correctness failures.
  falsification_hook: >-
    End-to-end warm_speedup <2 at every completed >=20-bit size, or trace
    success falls below 0.5 with increasing n.
  depends_on: [EXP-PRECOMP-001]
