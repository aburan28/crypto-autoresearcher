experiment:
  id: EXP-FBG-f5a8d8
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-c9565d; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-c9565d
  question_id: RQ-FBG-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Planted-structure ladder calibration of the coverage-excess apparatus: twenty mixture rungs
    from matched random to a ceiling-attaining base, with a sham churn ladder and an f equal to zero
    null, at three group sizes'
  objective: 'The one uncertainty a run reduces is the smallest coverage excess this program''s factor-base
    measurement apparatus can resolve, at each group size, under the conventions the frozen battery
    used. Stated in parts: (i) LADDER VALIDITY - does a mixture of a matched random base with a ceiling-attaining
    structured base produce a coverage excess that rises monotonically with the mixture fraction,
    while a sham ladder of identical composition churn using random-to-random replacement stays flat,
    since without both of these the ladder measures churn and no floor can be read; (ii) FLOOR LOCATION
    - under a location rule fixed before any run, at what mixture fraction does the measured excess
    first clear both the family-wise interval and the permutation threshold, and what is the excess
    ratio there, reported per group size with its own interval; (iii) APPLICABILITY - do the interval
    and permutation conventions reproduced here match those the frozen battery used closely enough
    that the derived floor scopes that battery''s null verdicts, or does a convention difference appear
    that withdraws the applicability claim. A run cannot reduce uncertainty about whether any particular
    geometry has real structure, about relation yield in an index calculus, about solve cost, about
    execution timing or machine variance, or about behaviour at cryptographic sizes. It also cannot
    revise any recorded verdict. The deliverable is a floor constant per size, three curves per size,
    and an explicit statement of which recorded excesses lie above and below it.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A completed run could support at most this: on the named toy
      prime-order curves at the three stated group sizes, at base size B equal to ceiling of (6N)
      to the one-third power and arity 3, with exact counting over the complete target space and the
      stated interval and permutation conventions, the coverage-excess apparatus resolves effects
      at or above the reported floor and does not resolve effects below it, with the sham ladder confirming
      that composition churn alone produces no excess. WHAT DOES NOT FOLLOW: nothing about whether
      any geometry, tested or untested, possesses real structure; nothing about relation yield, relation
      rank, decomposition cost or linear-algebra cost; nothing about behaviour at sizes beyond those
      tested or under conventions other than those frozen here; no revision of any previously recorded
      verdict, which the floor scopes rather than overturns; nothing about the program''s execution
      cost model, machine variance or timing, none of which are measured; and no attack, break, speedup
      or security consequence. A floor exceeding the largest recorded excess supports only that the
      channel is under-resolved at those sizes, and specifically does not support any statement that
      structured geometries do not help.'
  inputs:
    procedure: 'STAGE 0, curves and tables (cost: seconds). Generate prime-order toy curves via harness/toycurve.py,
      verify order primality, Hasse membership and generator order, build discrete-logarithm tables
      and check bijectivity. STAGE 1, sources (cost: seconds to minutes). Construct the declared ceiling-attaining
      structured base and a matched random base at each size, recording realised sizes. STAGE 2, ladders
      (cost: seconds). Build the signal ladder at twenty mixture fractions and the sham ladder at
      the same twenty, deduplicating and topping up, recording realised composition per rung. STAGE
      3, counting (cost: dominant; order N times B squared per rung). Exact multiset-sum count vectors
      over the complete target space for every rung of both ladders, with the closed-form total check
      on each. STAGE 4, inference (cost: 200 permutations per rung plus bootstrap over 4 seeds and
      4 curves). Excess ratios, family-wise intervals and permutation p-values under the frozen conventions.
      STAGE 5, floor (cost: minutes). Apply the pre-committed location rule to find f_min per size
      and report the excess there with its interval. STAGE 6, applicability (cost: 2 human hours).
      Diff the reproduced conventions against those recorded for the frozen battery and state the
      applicability claim or withdraw it.'
    instrument: Python 3 with harness/toycurve.py for exact curve arithmetic, point generation and
      discrete-logarithm tables; numpy for count vectors and the permutation loop; harness/runner.py
      for run manifests, recorded seeds and the inference block. The interval and permutation code
      is written fresh and validated against the closed-form total on every cell and against brute-force
      counting on a small subcase. No Sage, no external statistical service, and no solver of any
      kind is invoked.
    parameters: 'Curves: 4 generated prime-order toy curves per size. Sizes: N near 2^12, 2^14 and
      2^16 for the full contract; N near 2^16 alone for the minimal arm. Base size: B equal to ceiling
      of (6N) to the one-third power. Arity: m equal to 3. Mixture ladder: 20 rungs at f equal to
      0.00, 0.05, ..., 1.00, on both signal and sham ladders. Seeds: 4 per rung. Permutation draws:
      200 per cell. Target space: complete, no sampling. Total cells for the full contract: 2 ladders
      times 20 rungs times 3 sizes times 4 curves times 4 seeds equals 1920; minimal arm 160 cells.'
  controls:
  - 'f equal to 0 arm: matched random base measured by the identical pipeline in the same invocation.'
  - 'Sham ladder: identical composition churn with random-to-random replacement, at all twenty rungs,
    in the same invocation.'
  - Fresh matched random base drawn per rung, so the denominator of the excess ratio is not shared
    across rungs.
  - Closed-form total check per cell - summed multiset count equals binomial(B+m-1, m) exactly - as
    a counter integrity test.
  - Replicate seeds and replicate curves, with the ladder rebuilt independently under each.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is the f equal to 0 arm - a matched random base of
    identical size measured by the identical counter with the identical interval and permutation machinery,
    drawn fresh in the same invocation. For the ladder to mean anything the null must return an excess
    ratio whose family-wise interval contains 1.00 and whose permutation p-value is uniform across
    replicate seeds; if the f equal to 0 arm shows excess, the apparatus has a bias and every floor
    derived from it is wrong. A second null is required: a SHAM LADDER in which the fraction f of
    elements is replaced not by structured elements but by other random elements, so composition changes
    exactly as in the signal ladder while structure does not. The sham ladder must stay flat at excess
    1.00 across all f. If it rises, the ladder measures churn rather than structure and the calibration
    is void.'
  independent_variables:
  - mixture fraction f across twenty rungs
  - ladder type (signal, with structured replacement, or sham, with random replacement)
  - group size N
  - curve instance and seed
  metrics:
    primary:
    - exact coverage per rung
    - coverage excess ratio against a freshly drawn matched random base
    - family-wise interval half-width per rung
    - permutation-null p-value per rung
    - f_min and the excess at f_min, per size
    secondary:
    - realised composition per rung after deduplication and top-up
    - closed-form total residual per cell
    - monotonicity violation count along the signal ladder
    - sham-ladder maximum deviation from 1.00
    - convention diff against the frozen battery's recorded conventions
  heuristic_under_test: null
  preregistered_prediction:
    quantity: 'The detection floor: the coverage excess ratio at the smallest mixture fraction whose
      measurement clears both the family-wise interval and the permutation threshold.'
    formula: 'Let e(f) be the coverage excess ratio at rung f and h(f) its family-wise interval half-width.
      Define f_min as the smallest f such that e(f) minus h(f) exceeds 1.00 AND the permutation p-value
      at f is below the corrected threshold AND the same holds at every rung above f. The floor is
      e(f_min). This rule is fixed before any run. Predicted, and checked rather than fitted: the
      sham ladder satisfies the absolute value of e_sham(f) minus 1.00 below h(f) at every rung; the
      f equal to 0 arm satisfies the same; and e(f) is nondecreasing in f with at most 1 of 20 rungs
      violating it outside its interval. The floor value itself is deliberately not predicted.'
    source: Pre-registered in the parent proposal IDEA-20260816-c9565d before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are N near 2^12 to 2^16 with B from 29 to 46 and arity 3 on
      4 curves per size with 4 seeds, exact counting over the complete target space so the primary
      metric carries no sampling error. Transfer assumptions, stated: the floor is a property of the
      apparatus at the tested sizes and under the frozen conventions, and transfers to another measurement
      only if that measurement shares both. Nothing extrapolates to cryptographic sizes; the reported
      cross-size statement is the floor''s trend across three points, labelled a three-point toy trend
      rather than a scaling law. The frozen battery ran at sizes up to about 2^18, so applying a floor
      measured at 2^16 to its 2^18 cells is an extrapolation the contract must either avoid by adding
      a 2^18 arm or state explicitly as an unverified transfer.'
    correspondence: null
  tail_checks:
  - The f equal to 0 and f equal to 1 rungs, the two ends where the ladder is most constrained.
  - The smallest tested size, where coverage saturation compresses the ladder most.
  - Rungs whose realised composition deviates most from nominal f after deduplication.
  - The single rung with the largest monotonicity violation, recomputed independently.
  - Cells where the ceiling-attaining source could not reach full size, reported as infeasible rather
    than substituted.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - 'Halt and report if the sham ladder deviates from 1.00 outside its intervals at two or more rungs:
    the apparatus responds to churn and no floor can be read.'
  - Halt and report if the f equal to 0 arm shows excess outside its interval.
  - Halt and report if any closed-form total residual is nonzero.
  - Per-cell wall-clock budget of 1800 seconds and a total budget of 200 cell-hours; exceeded cells
    are recorded infeasible, which is not negative mathematical evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The sham ladder is flat at 1.00 within intervals at every rung, the f equal to
    0 arm shows no excess, the signal ladder is monotone within the stated tolerance, and the run
    reports f_min and the floor excess with an interval at every tested size - including the case
    where no f clears the threshold, which is reported as the floor exceeding the maximum attainable
    excess.
  falsification_criterion:
  - The sham ladder rises with f, showing composition churn produces apparent excess.
  - The f equal to 0 null arm shows excess outside its interval, showing apparatus bias.
  - The signal ladder is non-monotone beyond the stated tolerance, voiding the interpolant.
  - Any closed-form total residual is nonzero, voiding the counter.
  - The reproduced conventions differ materially from the frozen battery's, withdrawing the applicability
    claim even if the floor itself is measured cleanly.
  - The ceiling-attaining source cannot be constructed at a tested size, making the calibration infeasible
    there rather than negative.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-c9565d
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The location rule for f_min is stated but its statistical properties are not derived; a Coordinator
    should decide whether a monotone-threshold rule of this kind needs a stated false-discovery characterisation
    before the floor is treated as a constant.
  - Which structured source is declared as the ceiling-attaining top end is not settled here, and
    the choice materially determines the ladder's shape.
  - Whether the reproduced interval and permutation conventions match the frozen battery's is an open
    port-fidelity obligation, complicated by that battery's validation notes recording an aggregation
    rule documented only in a code comment.
  - Whether a 2^18 arm is required so the floor covers the frozen battery's largest cells, rather
    than being extrapolated to them.
