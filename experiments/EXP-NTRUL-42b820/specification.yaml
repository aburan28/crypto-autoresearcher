experiment:
  id: EXP-NTRUL-42b820
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-f5ceb4; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-f5ceb4
  question_id: RQ-NTRU-9015ee
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Compute CRT factorisation profiles, idempotent norms and submodule lift-norm ratios for two
    NTRU ring shapes across forty moduli, with a matched random-element null and a toy-scale certified
    looseness check
  objective: The uncertainty reduced is whether the splitting of the ring modulo q supplies an NTRU
    lattice with genuinely dense low-rank sublattices, or only with long ones, and therefore whether
    ring shape can act on lattice density through this channel at all. (i) What are the factorisation
    degree profiles actually encountered for each tested ring across the modulus grid, since the nominal
    description of a ring shape and its behaviour at a particular q can differ and the profile must
    be measured rather than asserted; (ii) what is the distribution of rho, the ratio of the balanced
    representative of an idempotent multiple of the secret to the secret's own norm, across factors,
    secrets, rings and moduli, and does any rho approach one, which is the only case in which the
    CRT channel would supply a density advantage; (iii) how loose is rho as an upper bound, measured
    at lattice dimension twenty by certified enumeration of the actual shortest vector in one submodule,
    since without this the cheap arm is measuring its own proxy. The random-element null runs alongside
    throughout so that a rho distribution can be attributed to the idempotents rather than to the
    secret, which is the expected and least flattering reading.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable claim: for the tested rings, the tested
      modulus grid and the tested secret distribution, the factorisation profiles are as tabulated,
      the rho distributions have the reported medians and IQRs by factor and profile, the secret and
      random-element arms differ by the reported amount with its CI, and at n = 10 the balanced representative
      exceeds the certified shortest submodule vector by the reported factor. What does NOT follow:
      that the CRT channel is closed in general, since only one cheap representative and one toy dimension
      were checked; anything about reduction behaviour or attack cost; anything about deployed parameter
      sets; and anything about what published work says regarding split or inert rings.'
  inputs:
    procedure: 'STAGE 0, cost minutes: implement polynomial arithmetic modulo q, distinct-degree and
      equal-degree factorisation, and a re-multiplication verifier; gate the run on the verifier passing
      for every factorisation. STAGE 1, cost minutes: implement CRT idempotent construction and balanced-representative
      reduction; gate on the idempotent identity e_i^2 = e_i and sum e_i = 1 holding exactly in R_q.
      STAGE 2, cost tens of minutes: for both primary rings and the third confound-breaking ring,
      sweep 40 moduli, record degree profiles, idempotent norms, and rho for 100 sampled secrets per
      cell. STAGE 3, cost minutes: the random-element arm at 100 elements per cell, matched on norm.
      STAGE 4, cost minutes: the unstructured forced null, asserting no rho is emitted. STAGE 5, cost
      hours: at n = 10 and three moduli, certified exhaustive enumeration of the shortest vector in
      one selected submodule for 20 instances, giving the looseness ratio; enumeration is budget-capped
      and exhaustion is a budget outcome. STAGE 6, cost minutes: tabulate rho by ring, profile and
      factor degree with bootstrap CIs, and report the secret-versus-random separation.'
    instrument: Pure Python 3 with exact integer and modular arithmetic. Polynomial factorisation
      modulo q implemented directly rather than imported, so the verifier is genuinely independent
      of the factorer; the idempotent identities are checked exactly. The enumeration in STAGE 5 reuses
      the exact-integer enumerator specified for the minima-ladder contract in this same batch, including
      its completeness certificate. harness/runner.py for run wrapping, manifests and certificate
      re-verification. No Sage, no external computer-algebra dependency, no lattice-reduction library
      needed anywhere in this contract.
    parameters: 'Rings: x^12 - 1 (rich splitting), an irreducible degree-13 polynomial (inert-like
      shape), and a third degree-12 polynomial chosen to have a different splitting behaviour, included
      to break the degree-versus-shape confound. Moduli: 40 values, primes and prime powers, spanning
      2^7 to 2^17. Secrets: ternary weight round(2n/3), 100 per cell. Random-element arm: 100 per
      cell, norm-matched. STAGE 5: n = 10, three moduli, 20 instances, enumeration radius 3x the submodule
      representative norm with a node cap.'
  controls:
  - 'Unstructured matched q-ary lattice, structural forced null: the pipeline must report no CRT submodules
    and emit no rho.'
  - Random ring element of matched norm in place of the secret, quantitative null isolating whether
    rho sees the secret at all.
  - Factorisation verification by re-multiplication modulo q on every factorisation.
  - Repeated-factor detection with a pre-registered handling rule and published counts.
  - Certified-enumeration looseness check at n = 10, measuring the gap between the cheap bound and
    the truth rather than assuming it.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls, both run in the same invocation. The structural forced null:
    a matched unstructured q-ary lattice built from a uniform random matrix H mod q, which has no
    CRT submodule structure at all; the pipeline must report the absence and must not produce rho
    values, which gates the code against inventing structure. The quantitative null: for each ring
    and q, compute rho for a random ring element of the same norm as the secret in place of the secret.
    If a random element gives the same rho distribution as the secret, then rho measures the idempotent''s
    size and nothing about the secret, which is the likely outcome and must be stated as a controlled
    null rather than dressed up. For any claim that CRT structure interacts with the secret specifically,
    the secret arm must separate from the random-element arm.'
  independent_variables:
  - ring in the three-element declared set
  - modulus q over the 40-value grid
  - arm in {secret, norm-matched random element, unstructured forced null}
  - factor degree within a factorisation profile
  metrics:
    primary:
    - factorisation degree profile per (ring, q)
    - idempotent coefficient norm per factor
    - rho per factor per instance
    - median and IQR of rho by ring, profile and factor degree
    - looseness ratio at n = 10 with certificate status
    secondary:
    - count of moduli with repeated factors
    - verifier pass rate on factorisation
    - idempotent identity residuals, which must be exactly zero
    - wall-clock per cell
    - count of distinct degree profiles per ring across the grid
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The distribution of rho, the balanced-representative norm ratio of an idempotent multiple
      of the secret to the secret, per factor and ring; and its difference from the norm-matched random-element
      arm.
    formula: 'rho_i = ||balanced_rep(e_i * (f,g) mod q)|| / ||(f,g)||, where e_i is the CRT idempotent
      of the i-th irreducible factor of the defining polynomial modulo q and balanced_rep takes coefficients
      into (-q/2, q/2]. Predicted: median rho over all factors and secrets at least 10 in every tested
      cell, and the secret-arm minus random-element-arm difference having a bootstrap CI containing
      zero.'
    source: Pre-registered in the parent proposal IDEA-20260816-f5ceb4 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Rings of degree 12 and 13 for the arithmetic arm, lattice dimension 20 for the
      enumeration arm. The arithmetic arm could be run at deployed degrees at negligible cost and
      the contract permits reporting a degree-761 factorisation profile as a descriptive fact, but
      rho's interpretation depends on the looseness check that only exists at dimension 20, so any
      statement at larger degree is explicitly labelled as an unvalidated extension and carries no
      claim.
    correspondence: null
  tail_checks:
  - Moduli with repeated factors, handled by the pre-registered rule and reported separately.
  - The degree-1 factor x - 1 always present in x^n - 1, reported separately since its idempotent
    is atypical.
  - The largest factor degree in each profile, where rho may behave differently from the small factors
    and pooling would hide it.
  - Cells where enumeration in STAGE 5 exceeds the node cap, recorded as budget outcomes and excluded
    from the looseness ratio with counts published.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort if the factorisation verifier fails on any cell.
  - Abort if the idempotent identities do not hold exactly.
  - Cap STAGE 5 enumeration nodes per instance; exhaustion is a budget outcome under AGENTS.md rule
    3, never evidence about density.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All verifiers and identities pass, rho distributions are reported by ring, profile
    and factor degree with CIs, the secret-versus-random separation is reported with a CI, and the
    STAGE 5 looseness ratio is reported with certificate status on at least ten completed instances.
  falsification_criterion:
  - Any rho distribution with median below 2, falsifying the long-lift expectation and opening a route
    that needs immediate follow-up.
  - Secret arm separating from the random-element arm with a CI excluding zero, falsifying the secret-independence
    expectation.
  - STAGE 5 showing the certified shortest submodule vector orders of magnitude below the balanced
    representative, falsifying rho as a usable proxy.
  - Factorisation verifier or idempotent identity failure, invalidating the affected cells.
  - The unstructured forced null emitting rho values, invalidating the whole run.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-f5ceb4
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The choice between balanced and size-reduced representatives is not derived and must be fixed
    by the Coordinator before the sweep, since it moves rho by a constant factor.
  - 'Which submodule to enumerate in STAGE 5 needs to be specified: the smallest-degree factor, the
    largest, or a random one, chosen before data is seen.'
  - The handling rule for moduli with repeated factors must be written down in advance.
  - No derivation is offered that a balanced representative is within any stated factor of the submodule's
    true minimum; STAGE 5 measures it at one dimension only and the Coordinator should decide whether
    that suffices for approval.
