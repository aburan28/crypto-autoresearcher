# EXP-GRUMPY-240226
# Coverage-floor count arithmetic. No walk is run.
# Approved by DEC-20261003-26f2c7.
experiment:
  id: EXP-GRUMPY-240226
  hypothesis_id: H-GRUMPY-1bd5cc
  source_idea: IDEA-20260930-79c17d
  question_id: RQ-GRUMPY-964876
  version: 1
  title: Equal-class pair products
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-26f2c7
  objective: >-
    Check the product 972, the cross 4, and the cross 1.
  inputs:
    pair_lo: 3
    pair_mid: 12
    pair_hi: 27
    pair_product: 972
    budget_cross: 4
    gap_num: 1
    gap_den: 32
    rate_cross: 1
    square_cross: 1
    rate_sum: 5
  controls:
    - >-
      The product of 3, 12, and 27 is 972. A class split 3, 0, 0
      has pair product 0 and invalidates the run.
    - >-
      One fourth of 9/4 is 9/16. One third of 9/4 is 3/4. Three
      fourths exceeds 23/32 by 1/32. The cross is 4.
    - >-
      Four fifths exceeds 7/9 by cross 1. Four sevenths exceeds 5/9
      by cross 1. The rate numerators 1, 2, and 2 sum to 5.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {pairs, budget, rates}
    - route in {product, cross}
  metrics:
    primary:
      - pair_product
      - budget_cross
      - rate_cross
      - implementations_agree
    secondary:
      - square_cross
      - rate_sum
      - gap_den
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The product of 3, 12, and 27 is 972. The cross of 3/4 against
      23/32 is 4. The cross of 4/5 against 7/9 is 1.
    formula: >-
      Multiply 3, 12, and 27. Cross 3/4 with 23/32. Cross 4/5 with
      7/9. Cross 4/7 with 5/9.
    source: >-
      IDEA-20260930-79c17d states the three-class bound, the budget
      factor 9/4, the figure 23/32, the rates 1/5 and 2/5, and the
      floors sqrt(5)/3 and 2/sqrt(7), read 2026-10-03. The group
      order is not named as an integer. The products were recomputed
      in this design session. That computation is not a run. No walk
      was run.
  scale_relevance:
    tier: toy
    justification: Three equal-class totals and one written fraction 23/32. No transfer to a walk constant.
    correspondence: null
  tail_checks:
    - The cross 4 and the cross 1 are required. A check that stops at the product 972 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the product 972 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The product is not 972.
    - The budget cross is not 4.
    - The rate cross is not 1.
    - A class split 3, 0, 0 is reported, or a walk is run.
  success_criterion: >-
    Both runs agree that the product of 3, 12, and 27 is 972, that
    the cross of 3/4 against 23/32 is 4, that 3/4 exceeds 23/32 by
    1/32, and that the cross of 4/5 against 7/9 is 1.
  falsification_criterion: >-
    The runs agree that the product of 3, 12, and 27 is computed,
    and that product is not 972.
  required_artifacts:
    - experiments/EXP-GRUMPY-240226/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-GRUMPY-240226/runs/<RUN-ID>/command.txt
    - experiments/EXP-GRUMPY-240226/runs/<RUN-ID>/stdout.log
    - experiments/EXP-GRUMPY-240226/runs/<RUN-ID>/stderr.log
    - experiments/EXP-GRUMPY-240226/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-GRUMPY-240226/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any walk, collision search, or constant measurement.
    - Any claim that an overlap loss is forced.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
