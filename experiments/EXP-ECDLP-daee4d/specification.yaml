      instruction_date: '2026-09-06'
      quotation: 'all is approved. ideas/experiments should be always approved'
      renewed_user_approval_required: false

  objective: >-
    Decide, on two ordinary prime-order toys with N in (2^10, 2^12) excluding
    y^2=x^3+x+1, whether the x-rank overlap excess of the low-Hamming set W
    is at most 0.02 (O-FLOOR), exceeds 0.05 on both curves (O-EXCESS), or
    lands elsewhere (O-MIXED / O-CONTROL-FAIL / O-IMPEDIMENT).

  inputs:
    independent_variables:
      - name: curve_panel
        levels: two ordinary short-Weierstrass curves found by ascending p-search
      - name: N
        levels: prime order in (2^10, 2^12)
    controls:
      - scalar-ranking recovers overlap 1 with W
      - random subset of size |W| (seed 20261007) supplies null excess
      - negation quotient before counts
      - second ordinary curve
      - y^2 = x^3 + x + 1 excluded
    seeds:
      null_seed: 20261007

  metrics:
    primary:
      - name: excess
        definition: overlap_frac - |W|/N
    secondary:
      - name: null_excess
      - name: scalar_recover_frac

  outcomes:
    - O-FLOOR
    - O-EXCESS
    - O-MIXED
    - O-CONTROL-FAIL
    - O-IMPEDIMENT

  success_criteria:
    - Stage 0 writes protocol-freeze.json and preregistered-predictions.json
    - Stage 1 emits exactly one O-* label from the frozen vocabulary
    - census.json and control-table.json present unless O-IMPEDIMENT before census

  falsification_criteria:
    - O-EXCESS on both curves with scalar control recovering 1 falsifies H1 at this toy scale
    - O-CONTROL-FAIL voids the excess reading

  stopping_rules:
    - Stop after Stage 1 emits one O-* label
    - Stop with O-IMPEDIMENT on timeout/crash/missing Stage-0 freeze

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze invalidates the run
    - Using y^2=x^3+x+1 as a panel member invalidates the panel

  budget:
    wall_clock_seconds: 3600
    memory_gb: 1
    maximum_runs: 3

  required_artifacts:
    - experiments/EXP-ECDLP-daee4d/stage0/protocol-freeze.json
    - experiments/EXP-ECDLP-daee4d/stage0/preregistered-predictions.json
    - experiments/EXP-ECDLP-daee4d/stage1/census.json
    - experiments/EXP-ECDLP-daee4d/stage1/control-table.json
    - experiments/EXP-ECDLP-daee4d/runs/RUN-ECDLP-60a366/
    - experiments/EXP-ECDLP-daee4d/runs/RUN-ECDLP-48ecf7/
    - experiments/EXP-ECDLP-daee4d/RESULTS.md

  replication_plan:
    minimum_independent_runs: 1
    note: One Stage-0 / Stage-1 pair; second run id is infrastructure retry only.

  amazon_bedrock: NOT SELECTED
