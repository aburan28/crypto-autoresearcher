experiment:
  id: EXP-MQOM-bf568a
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-MQOM-a0a477
  question_id: RQ-MQOM-001
  goal_id: GOAL-MQOM-001
  title: >-
    Zero-slack audit of MQOM v2.1's Fiat-Shamir and grinding design equations:
    exact reconstruction of Table 6, the slack integers S_FS / S_5r / S_3r, a
    matched synthetic null with a pre-derived zero-rate, and a closed ledger of
    the terms the design inequality omits

  objective: >-
    If a later approval and execution authorization are granted, (a) reproduce
    every row of MQOM v2.1's proof-system parameter table from four closed forms
    in exact integer arithmetic, (b) evaluate the slack integers S_FS, S_5r and
    S_3r at all eighteen published instances against forced values derived
    before the run, (c) run a matched null whose zero-rate is pre-derived and
    which can fail, and (d) fill a ledger, closed before evaluation, of the six
    terms the design inequality does not carry, marking each derived,
    derivably-zero, or unresolved. The audit consumes NO signatures, NO oracle
    queries and essentially no compute.

  what_this_is_not:
    - Not a forgery, a forgery attempt, a forgery simulation, or any interaction with any MQOM implementation.
    - Not a key recovery, not an MQ solve, not a cryptanalytic attack of any kind.
    - Not a claim that MQOM fails any claimed security level, and not a claim that it meets one.
    - Not a statement about the QROM; MQOM v2.1's own security statement is ROM plus ICM.
    - Not a re-derivation or validation of the TCitH soundness theorem, which is granted throughout.
    - Not a statement about FAEST, SDitH, or any other MPCitH scheme.
    - Not a statement about any MQOM Round-3 parameter set; no Round-3 specification exists as of 2026-08-05.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling: >-
    Tier: toy in the vocabulary of docs/claims-and-verification.md, since the
    audit produces no measurement at any cryptographic scale and no certificate.
    The precise scope a completed run could support is: for MQOM v2.1's eighteen
    published instances, in the ROM plus ICM, granting the TCitH soundness
    theorem and the specification's 2/N per-repetition error, the published
    parameter table is reproduced exactly by four closed forms; the two design
    inequalities are met with exact equality; and the enumerated ledger of
    omitted terms resolves as reported, with its unresolved count stated. NO
    OUTCOME may establish a forgery cost, a break, an exponent, a crypto-scale
    conclusion, or a statement about any scheme other than MQOM v2.1.

  environment_preconditions:
    measured_this_session: >-
      python3 -c "import numpy" succeeds (numpy 2.4.6). "import sympy" fails
      (ModuleNotFoundError). "import sage" fails, so src/ic_first_fall_fast.py
      cannot be imported (its line 23 is "from sage.all import GF, Matrix").
    consequence_for_this_contract: >-
      NONE. Every computation here is exact integer arithmetic in the Python
      standard library (math.comb and integer division). No solver, no algebra
      system, no numpy is required. This contract is deliberately ordered first
      in GOAL-MQOM-001 for that reason.
    network: >-
      https://mqom.org (HTTP 200) and https://eprint.iacr.org/2026/629 abstract
      page (HTTP 200) were reached this session. eprint.iacr.org PDF endpoints
      return 403. If the network is unavailable at execution time, stage 0
      cannot complete and the run halts as failed_infrastructure; that is never
      negative mathematical evidence.

  inputs:
    specification_source:
      url: https://mqom.org/docs/mqom-v2.1.pdf
      fetched_this_session: true
      http_status: 200
      bytes: 707578
      version_string: "MQOM v2.1, dated 2025-09-22"
      extraction_method: >-
        Pure-zlib PDF stream decompression plus a regex over text-showing
        operators, written this session because pdftotext is absent and pypdf
        crashes on import. LOSSY: recovers text-showing operators only; table
        cells arrive in reading order; page numbers are NOT preserved.
      required_reverification: >-
        Stage 0 must re-verify every transcribed cell and every quoted sentence
        against the rendered PDF and supply page references. Until it does, no
        number in this contract may appear in an evidence record.
    published_table_6_transcription:
      note: >-
        Six distinct proof-system rows; each shared by the three base fields
        F_2, F_16, F_256, giving eighteen instances. Fields are
        (category, lambda, N, w, tau, eta_5r).
      rows:
        - [I, 128, 2048, 8, 12, 8]
        - [I, 128, 256, 9, 17, 16]
        - [III, 192, 2048, 12, 18, 12]
        - [III, 192, 256, 3, 27, 24]
        - [V, 256, 2048, 6, 25, 16]
        - [V, 256, 256, 4, 36, 32]
      mu_by_row_and_field:
        N2048: {gf2: 16, gf16: 4, gf256: 2}
        N256: {gf2: 8, gf16: 2, gf256: 1}
      m_equals_n:
        catI: {gf2: 160, gf16: 56, gf256: 48}
        catIII: {gf2: 240, gf16: 84, gf256: 72}
        catV: {gf2: 320, gf16: 116, gf256: 96}
      K_bits_by_N: {2048: 16, 256: 8}
    closed_forms:
      tau_pred: "ceil((lambda - w) / (log2(N) - 1))"
      eta_5r_pred: "lambda / log2(|K|)"
      eta_3r_pred: "m / mu"
      S_FS: "tau*(log2(N) - 1) + w - lambda"
      S_5r: "eta_5r*log2(|K|) - lambda"
      S_3r: "(m/mu)*log2(|K|) - lambda"
    null_arm_inputs:
      synthetic_sweep: >-
        For each published (lambda, N), let w range over the integers 1..24 and
        recompute tau_pred and S_FS at each w. Deterministic; no randomness and
        therefore no seed is required, which is stated explicitly rather than
        left as an omission.
      mqom_v1_table:
        url: https://mqom.org/docs/mqom-v1.0.pdf
        status: NOT FETCHED IN THIS SESSION; fetching is a stage-1 task and a failure to fetch is recorded, not worked around.
    external_source_to_retrieve:
      target: >-
        The multi-round Fiat-Shamir (Kales-Zaverucha style) forgery cost formula
        for 5-round MPCitH signatures. RECALLED AND UNVERIFIED; no paper was
        retrieved for the paired hypothesis.
      declared_source_order:
        - eprint.iacr.org abstract page for the relevant paper number, once identified by search
        - arXiv
        - author homepages
        - a conference proceedings version
        - re-derivation from scratch, which is acceptable and is preferred to citing from memory
      failure_disposition: >-
        If the order is exhausted without the formula, ledger line L3 is marked
        unresolved, the ledger is NOT summed, and the run still completes.
    seed_derivation_rule: >-
      NOT APPLICABLE AND SAID SO EXPLICITLY: every computation in this contract
      is deterministic and exact. There is no sampling, no randomness, and no
      seed anywhere. A third party reproduces every number bit-for-bit by
      evaluating the closed forms on the transcribed table. This is recorded as
      a positive property of the contract rather than as a missing field.

  arms_and_controls:
    treatment: >-
      Evaluate tau_pred, eta_5r_pred, eta_3r_pred, S_FS, S_5r and S_3r at all
      eighteen published instances, and compare against the transcribed table.
    measured_null: >-
      The synthetic w sweep at each published (lambda, N), plus the MQOM v1.0
      table if it can be fetched. FORCED VALUE DERIVED BEFORE THE RUN: in the
      synthetic sweep the number of w in 1..24 giving S_FS = 0 is exactly the
      number of w in that range with (lambda - w) divisible by (log2 N - 1),
      i.e. a rate of 1/10 at N = 2048 and 1/7 at N = 256. THIS NULL CAN FAIL: a
      rate of 1 means the statistic is a constant of the apparatus and the
      treatment arm's zeros carry no interpretation.
    ordering_control: >-
      The null arm is computed, its zero-rate recorded, and its digest committed
      to disk BEFORE any treatment value is computed or displayed. The verdict
      rule ("is this family tuned to the edge of its own inequality?") is
      executed on the null arm first and its output committed. Absence of that
      commitment invalidates the package.
    positive_control: >-
      Perturbation sensitivity. For MQOM2-L3-gf2-fast (w = 3, the smallest
      published grinding parameter), recompute S_FS with w replaced by w+1 and
      w-1, holding tau fixed. FORCED VALUE: S_FS must become exactly +1 and -1.
      IF THE PIPELINE DOES NOT RESPOND TO A ONE-BIT PERTURBATION OF A PUBLISHED
      PARAMETER, THE ARITHMETIC IS BROKEN AND NO RESULT MAY BE REPORTED FROM ANY
      STAGE.
    graded_control: >-
      At (lambda, N) = (128, 2048), sweep w over {6, 7, 8, 9, 10} and report
      (tau_pred, S_FS) at each of the five points. FORCED VALUES DERIVED BEFORE
      THE RUN: tau_pred = 13, 13, 12, 12, 12 and S_FS = 8, 9, 0, 1, 2
      respectively. Monotonicity within each tau plateau must be reported, and
      the single zero at w = 8 must be the only zero in the swept range. A flat
      or non-sawtooth response localises a ceiling-implementation bug rather
      than leaving "it did not work".
    nearby_object_control: >-
      The 3-round variant at the SAME parameter sets, where the hoped-for
      conclusion fails by construction: S_3r must be strictly positive
      everywhere and exactly 32, 96, 256 at MQOM2-L1-gf2/gf16/gf256-short-3r.
      An analysis returning zero slack for both variants is responding to the
      table's shape rather than to the design equations.
    comparability_policy: >-
      No comparison to IDEA-20260801-018 or to any future forgery-simulation
      contract is permitted from this package. That proposal measures an
      advantage by simulation; this one evaluates an arithmetic identity. A
      cross-contract comparison requires a separately registered comparator
      naming both objects, both statistics and the expected relation.

  metrics:
    primary:
      - Number of the eighteen published rows whose tau, eta_5r and eta_3r all equal their closed-form values (target 18).
      - S_FS at each of the eighteen instances (target exactly 0).
      - S_5r at each of the eighteen instances (target exactly 0).
      - S_3r at each of the eighteen instances (target strictly positive; 32/96/256 at the three named cells).
      - Null-arm zero-rate per (lambda, N) as an exact count over w in 1..24 (target 1/10 at N=2048, 1/7 at N=256).
      - Ledger: one line per omitted term L1..L6, each marked derived / derivably-zero / unresolved, with the unresolved count.
    secondary:
      - Binary answer with an algorithm-and-line citation on whether the 5-round batching challenge is global across the tau repetitions or drawn per repetition.
      - Graded w sweep values (tau_pred, S_FS) at the five declared points.
      - Positive-control perturbation results.
      - log2(u) for the relaxed-opening offset u = 2N(lambda/log2 lambda)^2 per instance, as a scale calibration.
      - Bad-set sensitivity tau*log2(3/2) per instance, reported as a sensitivity of the zero-slack design and never as a suspicion.
      - Verbatim quotations with page references for the two design equations, the Section 4.1 EUF-CMA sentence, and the Section 5 relaxed-opening sentence; or a recorded statement that they could not be re-obtained.
      - MQOM v1.0 null-arm slack profile, or a recorded fetch failure.

  preregistered_prediction:
    quantity: >-
      The slack integer S_FS = tau*(log2 N - 1) + w - lambda at each of the
      eighteen published MQOM v2.1 instances, and its companions S_5r and S_3r.
    formula: >-
      S_FS = tau*(log2 N - 1) + w - lambda with tau = ceil((lambda - w)/(log2 N
      - 1)); S_5r = eta_5r*log2|K| - lambda with eta_5r = lambda/log2|K|;
      S_3r = (m/mu)*log2|K| - lambda. Predicted values: S_FS = 0 and S_5r = 0 at
      all eighteen; S_3r > 0 at all eighteen and exactly 32, 96, 256 at the
      three named Category I short instances.
    source: >-
      MQOM v2.1 specification, Sections 2.1.4 and 3.1 (the two design equations)
      and Table 6 (the published parameters), READ this session with the
      lossy-extraction caveat recorded above. The predictions were DERIVED IN
      THIS SESSION in exact integer arithmetic before this contract was written
      and are frozen here; no value may be tuned after any stage output is seen.

  scale_relevance:
    tier: toy
    justification: >-
      The audit operates on published integers and on reading, so it is exact at
      the deployed parameter sets rather than extrapolated from a smaller one --
      which is unusual and is the reason to run it first. It is nevertheless
      tiered toy because it produces no measurement, no certificate and no
      execution of any algorithm, and because docs/claims-and-verification.md
      reserves higher tiers for certified computations. Conclusions transfer to
      the deployed parameter sets EXACTLY for the arithmetic identities (which
      are statements about those very parameters) and NOT AT ALL for anything
      requiring the truth of the granted TCitH theorem or of the ROM/ICM
      idealisations.
    correspondence: null

  stages:
    - id: S0
      name: source re-verification
      compute: zero
      can_terminate_run: true
      description: >-
        Re-verify Table 6 (all eighteen rows), the two design equations, the
        grinding paragraph, Algorithms 3 and 4, the Section 4.1 EUF-CMA
        sentence and the Section 5 relaxed-opening sentence against the rendered
        PDF, supplying page references. Cross-check the eighteen rows against
        the public benchmark table on https://mqom.org/ via the published
        signature-size formula. TERMINATES THE RUN if any cell disagrees.
    - id: S1
      name: null arm, then treatment arm
      compute: seconds
      can_terminate_run: true
      description: >-
        Compute and commit the synthetic null sweep and its zero-rate; attempt
        the MQOM v1.0 table; run the positive control and the graded control.
        Only then compute the treatment arm. TERMINATES THE RUN if the positive
        control fails or if the null zero-rate is 1.
    - id: S2
      name: challenge-structure reading
      compute: zero
      can_terminate_run: false
      description: >-
        Determine from Algorithm 3 and the ComputeP Alpha subroutine whether the
        5-round batching challenge is global or per repetition, with a citation.
        This is the cheapest decisive gate for ledger line L3.
    - id: S3
      name: ledger
      compute: zero
      can_terminate_run: false
      description: >-
        Fill L1..L6 with derived bit costs or explicit derivably-zero
        statements; attempt the external source order for the L3 formula;
        report the ledger with its unresolved count in the headline. A ledger
        with any unresolved line is NOT summed.
  cheapest_decisive_stage: >-
    S0 followed by S1. If the transcription is wrong the run ends in stage 0 at
    zero compute; if the positive control fails the run ends in stage 1 at zero
    compute. Both are declared as terminating.

  replication:
    seeds: []
    seeds_note: >-
      Empty by construction and stated explicitly: every computation is
      deterministic and exact, so replication means re-execution rather than
      re-sampling. Two independent re-implementations of the closed forms are
      required instead, and their outputs must agree bit-for-bit; a disagreement
      is an implementation defect and halts the package.
    independent_instances: 18
    planned_runs: 1

  budget:
    wall_clock_seconds_per_run: 10800
    total_cpu_hours: 0.05
    maximum_memory_gb: 1
    maximum_runs: 1
    network_access_required: true
    network_scope: >-
      https://mqom.org only, plus the declared external source order for the L3
      formula. No other host is contacted.

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, archived, and authorized.
    - Stop at stage 0 if any transcribed Table 6 cell disagrees with the rendered PDF.
    - Stop at stage 1 if the positive control does not move S_FS by exactly one bit under a one-bit perturbation of w.
    - Stop at stage 1 if the null arm's zero-rate is 1 at any (lambda, N); the statistic is then a constant of the apparatus and only a controlled null may be reported.
    - Stop before the treatment arm if the null arm's digest has not been committed.
    - Exhaust the declared external source order for the L3 formula at most once; do not retry indefinitely.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any treatment value computed or displayed before the null arm's digest is committed.
    - Any change to the closed forms, the ledger line list, or any forced value after a stage output has been seen.
    - Any ledger summed while containing an unresolved line.
    - Any citation of the L3 cost formula from memory rather than from a retrieved source or an in-package re-derivation.
    - Any statement about the QROM, about another MPCitH scheme, or about a Round-3 parameter set.

  success_criterion: >-
    This contract has no current success outcome because it is not authorized
    for execution. If a later, separately approved and frozen successor is
    executed, its only positive disposition is: stage 0 confirms the
    transcription with page references; the null arm's zero-rate matches its
    pre-derived value exactly and is committed first; the positive and graded
    controls fire as pre-derived; the treatment arm returns 18/18 on the
    reconstruction and S_FS = S_5r = 0 with S_3r > 0 at all eighteen instances;
    and the ledger is reported with every line marked and its unresolved count
    in the headline. THAT DISPOSITION ESTABLISHES NO FORGERY COST, NO BREAK, NO
    EXPONENT AND NO CRYPTO-SCALE CLAIM.

  falsification_criterion: >-
    Any published tau, eta_5r or eta_3r differing from its closed form; or any
    nonzero S_FS or S_5r at any instance; or S_3r zero at every instance. Any of
    these refutes H-MQOM-a0a477 as stated, and the refutation is recorded in a
    superseding record rather than by editing this contract or the hypothesis.

  outcomes:
    no_execution_authorization: >-
      The only current disposition: review_required draft; no run, no evidence,
      no mathematical inference.
    future_complete_audit: >-
      Only after separate approval, freezing, authorization and valid execution.
      Scoped as in claim_ceiling.
    controlled_null: >-
      If the null arm's zero-rate is 1, the correct and complete report is a
      controlled null: the slack functional is a constant of the apparatus and
      the treatment arm's zeros carry no interpretation. This is a first-class
      outcome, not a failure.
    complete_tight_ledger: >-
      If every ledger line resolves to zero or one bit, the correct report is
      that MQOM v2.1's soundness accounting is tight and complete within the
      audited scope. This is the most likely single outcome and is a first-class
      deliverable.
    infrastructure_or_integrity_failure: >-
      Network unavailability, an unfetchable PDF, or an unresolvable external
      source is an infrastructure signal reported as such. It is NEVER negative
      mathematical evidence against H-MQOM-a0a477 or against any statement about
      MQOM (AGENTS.md rule 5).

  required_artifacts_if_later_authorized:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - Page-referenced quotations of the two design equations, the grinding paragraph, the Section 4.1 EUF-CMA sentence and the Section 5 relaxed-opening sentence, or a recorded failure to obtain them.
    - SHA-256 of the fetched PDF and of the extracted text, with the fetch timestamp and HTTP status.
    - The committed null-arm output and digest, timestamped before the treatment arm's output.
    - The eighteen-row reconstruction table with published and predicted values side by side.
    - The S_FS / S_5r / S_3r table as exact integers.
    - The graded w sweep and the positive-control results.
    - The ledger with per-line markers and the unresolved count.
    - Two independent implementations' outputs and their agreement check.
    - Manifest, environment, exact commands, stdout, stderr, and an execution report.
    - Snapshot archive followed by independent validation and red-team review.

  approval_requirements:
    - Independent review confirms that the transcription, the closed forms, the null's forced zero-rate, and the ledger's closure before evaluation are all specified, reproducible and internally consistent.
    - Independent review confirms that no stage can produce a security statement about MQOM without a completed ledger.
    - Coordinator separately approves and freezes a future contract without editing this draft.
    - Separate authorization for execution after the approved frozen package is delivered.

  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved; only the Coordinator may approve (AGENTS.md rule 1).

  assigned_to: executor
