# EXP-BINSTD-8ce79d
# Toy-ladder arithmetic. No curve enumeration.
# Approved by DEC-20261002-e8808a.
experiment:
  id: EXP-BINSTD-8ce79d
  hypothesis_id: H-BINSTD-d810ae
  source_idea: IDEA-20260926-80209d
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Toy-ladder arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-e8808a
  objective: >-
    Check the eight orders, the cyclotomic values, the 35 pairs, and
    the two ceilings.
  inputs:
    primes: [17, 19, 23, 29, 31, 37, 41, 131]
    orders: [8, 18, 11, 28, 5, 36, 20, 130]
    euler: [4, 6, 10, 12, 4, 12, 8, 48]
    cyclotomic: [17, 57, 2047, 3277, 31, 4033, 205, 409368176241571]
    cofactors: [1, 3, 89, 113, 1, 109, 5, 3124947910241]
    stable_counts: [8, 4, 8, 4, 128, 4, 8, 4]
    stable_sum: 168
    pair_count: 35
    only_ladder_prime: 19
    count_25: 25
    count_19: 19
    count_20: 20
    square_196: 196
    bound_200: 200
    square_gap: 4
    product_28: 28
    disc_25: 25
    elliptic_square: 8
    elliptic_nine: 9
    elliptic_ceiling: 5
    weil_low: 256
    weil_mid: 288
    weil_high: 289
  controls:
    - >-
      The orders are 8, 18, 11, 28, 5, 36, 20 and 130. Reporting
      another order invalidates the run.
    - >-
      The box contains 35 pairs, and only 19 occurs among the seven
      ladder primes. Reporting 37 as a point count invalidates the run.
    - >-
      For a = 5, the square 196 is below 200 and the product 28 exceeds
      25. Reporting a feasible pair at a = 5 invalidates the run.
    - >-
      Since 8 is below 9, an elliptic count is at most 5. Reporting a
      count above 5 invalidates the run.
    - >-
      Since 288 lies strictly between 256 and 289, the surface Weil
      number lies strictly between 33 and 34. Reporting it as at most
      33 or at least 34 invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {orders, pairs}
    - route in {product, closed_form}
  metrics:
    primary:
      - pair_count
      - only_ladder_prime
      - implementations_agree
    secondary:
      - stable_sum
      - cyclotomic_130
      - weil_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The box contains 35 pairs and only the ladder prime 19.
    formula: >-
      A pair (a, b) is kept when a^2 is at least 4b and (b + 8)^2 is at
      least 8 a^2 with b + 8 nonnegative. The point count is 9 + 3a + b.
      The order of 2 is the least positive k with 2^k congruent to 1.
    source: >-
      IDEA-20260926-80209d states the ladder table, read 2026-10-02.
      The orders and the pairs were computed in this design session.
      That computation is not a run. No curve was enumerated.
  scale_relevance:
    tier: toy
    justification: Eight primes and one coefficient box. No transfer to a curve search.
    correspondence: null
  tail_checks:
    - The degree-130 cyclotomic value is required. A check that stops at the seven small primes is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the pair count is not 35, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - An order differs from the preregistered list.
    - The pair count is not 35.
    - A feasible pair at a = 5 is reported.
    - An elliptic count above 5 is reported.
    - The surface Weil number is reported as at most 33 or at least 34.
    - A curve is enumerated or a Jacobian search is run.
  success_criterion: >-
    Both runs agree that the eight orders are 8, 18, 11, 28, 5, 36, 20
    and 130, that the box contains 35 pairs, that only 19 occurs among
    the seven ladder primes, and that 288 lies strictly between 256 and
    289.
  falsification_criterion: >-
    The runs agree, the box stays at 35 pairs, and 19 is not the only
    ladder prime among the counts.
  required_artifacts:
    - experiments/EXP-BINSTD-8ce79d/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-8ce79d/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-8ce79d/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-8ce79d/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-8ce79d/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-8ce79d/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any curve enumeration, Jacobian search, or point count over an extension.
    - Any claim that the 35 pairs are isomorphism classes.
    - Any factor base or solver.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
