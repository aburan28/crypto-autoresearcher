experiment:
  id: EXP-AUXIN-3b16d3
  hypothesis_id: H-AUXIN-db3163
  derived_from_idea: IDEA-20261005-447d82
  source_idea_ids:
    - IDEA-20261005-447d82
  question_id: RQ-AUXIN-f8d8c0
  goal_id: GOAL-AUXIN-a93442
  version: 1
  title: >-
    Exact r-1 and r+1 Cheon divisor split on y^2=x^3+x+1 over F_10007
  status: approved
  frozen: true
  approved_by: coordinator
  approval_decision: DEC-20261006-34bca7
  approval_basis: >-
    AGENTS.md standing user authorization dated 2026-09-06 for ideas and
    complete experiment design. Coordinator checked protocol completeness
    (inputs, controls, metrics, replication, budget, stopping/invalidation,
    success/falsification, required artifacts). Approval is not evidence.
  assigned_to: executor
  scientific_execution_authorized: true
  scientific_execution_scope: >-
    Exact integer measurement ONLY. Count #E(F_10007) for y^2=x^3+x+1,
    factor N, set r to its largest prime factor, factor r-1 and r+1 by two
    independent implementations, and compute the pinned and null ratios.
    Do not run Cheon's algorithm, do not generate or consume [x^i]P, do not
    recover any discrete logarithm, do not audit any protocol.
  execution_authorized: true
  evidence_eligible: false
  execution_admission:
    currently_admitted: false
    requirements:
      - Verified snapshot archive of H-AUXIN-db3163, EXP-AUXIN-3b16d3, DEC-20261006-34bca7, TASK-20261006-38e130 on a published branch/PR
      - Implementation under experiments/EXP-AUXIN-3b16d3/implementation/ with two independent factorization paths that share no factorization code
      - Fresh Executor claim via tools/goal_lanes.py before launch
  launch_gate:
    blocks_scientific_run_until:
      - Snapshot of this frozen contract is verified
      - Two factorization implementations are present and do not share factorization code
    does_not_block_protocol_approval: true
    note: >-
      scientific_execution_authorized is true because the measurement
      protocol is complete. Implementation is an Executor deliverable.

  objective: >-
    Reduce the uncertainty whether the exact maximal admissible divisors of
    r-1 and r+1 for the pinned toy order separate the two Cheon
    closed-form shapes by a factor of at least 2, with a divisor-free null
    confirming the gap is divisor structure rather than formula artifact.
    Both a certified split and a certified failure to split are first-class
    outcomes.

  what_this_is_not:
    - Not an ordinary-ECDLP improvement. DEC-20260802-204's acquisition gate stands.
    - Not a Cheon execution, discrete-log recovery, or timing of group operations.
    - Not a protocol-supply audit and not a vulnerability report.
    - Not evidence until runs exist under this contract.
    - Not a statement about any deployed curve.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      On the pinned curve y^2=x^3+x+1 over F_10007 with the pinned r
      integer: certified factorizations of r-1 and r+1 from two agreeing
      implementations, the exact maximal admissible divisors, and the two
      closed-form values with their ratio, plus the null ratio at d=2.
      WHAT DOES NOT FOLLOW: any ordinary-ECDLP claim; any statement that a
      deployed system is weak or safe; any claim about curves not measured;
      any claim about protocols.
    explicitly_not_supportable_under_any_outcome: >-
      Ordinary ECDLP below rho; a vulnerability in any deployed curve or
      protocol; novelty of Cheon's algorithm; transfer to cryptographic scale.

  inputs:
    procedure: >-
      (1) Count N=#E(F_10007) for E: y^2=x^3+x+1 by exact enumeration over
      x in [0, 10007); check nonsingularity (4+27 != 0 mod 10007). (2)
      Factor N completely; set r to its largest prime factor and record the
      cofactor N/r. (3) Factor r-1 and r+1 completely by TWO independent
      implementations that share no factorization code. (4) Take d_minus as
      the largest divisor of r-1 in [2, floor(sqrt(r))] and d_plus as the
      largest divisor of r+1 in the same window. (5) Compute
      B_minus=sqrt(r/d_minus)+sqrt(d_minus), B_plus=sqrt(r/d_plus)+d_plus,
      B_rho=sqrt(r), the pinned ratio
      max(B_minus,B_plus)/min(B_minus,B_plus). (6) Construct r_null as the
      smallest prime >2^16 with (r_null-1)/2 and (r_null+1)/2 both prime;
      evaluate the same two shapes at d=2 on r_null and record the null
      ratio. (7) Record the largest admissible divisors of N-1 and N+1 as
      the wrong-integer control values; they are not the metric.
    instrument: >-
      Exact integer arithmetic (trial division suffices at this scale; any
      backend is recorded in the run manifest: name, version, command).
      Primality of r and of r_null factors by deterministic trial division
      to sqrt plus an independent second check. The second factorization
      path must not import the first factorizer; it may accept the integer
      and independently prove product and primality and recompute every
      derived quantity.
    parameters:
      curve: 'E: y^2=x^3+x+1 over F_10007'
      field_prime: 10007
      order_source: exact enumeration in the run (no external pin)
      divisor_window: '[2, floor(sqrt(r))]'
      closed_forms: >-
        B_minus=sqrt(r/d_minus)+sqrt(d_minus);
        B_plus=sqrt(r/d_plus)+d_plus; B_rho=sqrt(r); common O(log r) factor
        omitted from the ratio only.
      pinned_ratio_gate: 2
      null_ratio_gate: 1.25
      null_rule: smallest prime r_null>2^16 with (r_null±1)/2 both prime
    sources:
      - ledger/proposals/IDEA-20261005-447d82.yaml
      - ledger/hypotheses/H-AUXIN-db3163.yaml
      - ledger/questions/RQ-AUXIN-f8d8c0.yaml
      - knowledge/literature/KN-LIT-90e34c.md
      - knowledge/techniques/KN-TECH-0f24d0.md

  controls:
    - kind: divisor_free_null
      name: r_null at d=2 on both sides
      design: >-
        Construct r_null as the smallest prime greater than 2^16 such that
        (r_null-1)/2 and (r_null+1)/2 are both prime. Evaluate the same two
        closed forms at d_minus=d_plus=2. The null ratio must be strictly
        less than 1.25. A null ratio >= 1.25 falsifies the claim that a
        factor-2 pinned gap is caused by the pinned order's divisors.
    - kind: arithmetic_product
      name: factorizations multiply back
      design: >-
        For each of r-1 and r+1, the product of each implementation's
        reported prime factors equals the integer exactly. Any mismatch, or
        any disagreement between the two implementations on the factor
        multiset, invalidates the measurement.
    - kind: wrong_integer
      name: N±1 vs r±1
      design: >-
        The run also records the largest admissible divisors of N-1 and
        N+1. Those values are not the metric. If the reported ratio used
        N±1 divisors in place of r±1 divisors, the run is invalid.

  independent_variables:
    - name: integer_factored
      values: [r-1, r+1]
    - name: factorization_implementation
      values: [path_A, path_B]
    - name: branch
      values: [r-1-shape, r+1-shape, null-d2]

  metrics:
    primary:
      - N, r, and the cofactor N/r
      - complete prime factorizations of r-1 and r+1 from BOTH implementations
      - d_minus, d_plus, B_minus, B_plus, B_rho
      - pinned ratio max(B_minus,B_plus)/min(B_minus,B_plus)
      - null ratio at d=2 on r_null
      - r_null
      - exact-reconstruction pass/fail per integer per implementation
      - inter-implementation agreement per integer
    secondary:
      - wrong-integer control divisors of N-1 and N+1
      - nonsingularity check 4+27 != 0 mod 10007
      - wall-clock per integer and peak RSS
      - primality evidence for r and r_null factors

  heuristic_under_test: null
  preregistered_prediction:
    quantity: pinned ratio and null ratio on the stated integers
    formula: >-
      Pinned ratio = max(B_minus,B_plus)/min(B_minus,B_plus) with
      B_minus=sqrt(r/d_minus)+sqrt(d_minus) and
      B_plus=sqrt(r/d_plus)+d_plus at the maximal admissible divisors;
      null ratio the same shapes at d=2 on r_null. Predicted split: pinned
      ratio >= 2 with null ratio < 1.25.
    source: >-
      IDEA-20261005-447d82 claim (internal). Not tuned after any run; no
      run exists under this contract.

  scale_relevance:
    tier: toy
    justification: >-
      Single toy order: r is under 20 bits (N < 10007+2*sqrt(10007)+1).
      The quantity is exact at that integer; no transfer assumption is
      made and none is permitted by the interpretation limits.
    correspondence: null

  tail_checks:
    - Report r-1 and r+1 separately; a missing branch voids the row.
    - Report the cofactor N/r; a hidden small-r case must be visible.
    - Report N±1 control divisors labelled as controls, never as the metric.

  replication:
    seeds: []
    seeds_note: >-
      Not applicable: no random sampling is used. N comes from exact
      enumeration, r_null from a deterministic least-search, and
      factorization is exact. Determinism is carried by two independent
      implementations that must agree exactly, plus exact-reconstruction
      product checks.
    independent_instances: 1
    verification_passes:
      - path_A factors r-1 and r+1; product checks pass
      - path_B factors r-1 and r+1 independently; product checks pass
      - factor multisets of path_A and path_B agree exactly per integer
    note: >-
      The census is one scientific package (maximum_runs: 1). Disagreement
      between the paths invalidates the measurement; it is never resolved
      by voting or averaging.

  cost_model_disclosure:
    model: Cheon closed forms / KN-LIT-90e34c
    unit: >-
      Dimensionless ratio of closed-form values. The raw B_minus/B_plus are
      modeled group-operation counts up to a hidden constant; they are not
      measured on a curve.
    measured_vs_modelled: >-
      MEASURED: N, r, cofactor, factorizations, product checks,
      inter-implementation agreement, r_null, wall-clock, peak RSS.
      MODELLED: B_minus, B_plus, B_rho, and both ratios, which apply the
      frozen closed forms to the measured divisor lattice. The two never
      share one unlabeled column.
    optimistic_assumptions:
      - >-
        The two closed forms omit the O(log r) group-operation factor.
        DIRECTION OF BIAS: understates Cheon 2006-style operation counts
        if that factor is real. The primary success/falsification uses the
        ratio, where the common factor cancels by construction.
      - >-
        Treating O() as hiding only a constant. DIRECTION OF BIAS: may
        understate real implementation cost. This experiment does not run
        Cheon, so the bias does not affect the integer measurement.
    memory_accounting: >-
      Peak RSS MEASURED during enumeration and factoring. Analytic memory
      of Cheon tables O(max(sqrt(m/d), sqrt(d))) is MODELLED and not a
      metric of this experiment.
    hidden_overhead: >-
      None at this scale: enumeration over 10007 x-values and trial
      division below 2^20 terminate deterministically.
    standardized_parameter_sets: >-
      One pinned curve. Affected scope: none claimed. Safe scope: not a
      security statement about any curve or protocol.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
    protection_note: >-
      Memory and one-process workers are machine protection. Time/CPU
      estimates are advisory per docs/research-budget-policy.md and are not
      approval gates. The fixed scientific package is one measurement (two
      agreeing factorization paths); maximum_runs: 1 is binding.

  stopping_rules:
    - Stop if E is singular mod 10007; report failed_infrastructure in the run, never a mathematical negative.
    - Stop the measurement if the two factorization paths disagree and the disagreement survives re-execution; report the disagreement; do not interpret either factor list.
    - Stop at maximum_runs or memory protection; checkpoint completed integers.
    - Do not open a protocol-supply stage, a Cheon execution, or a second curve under this contract.

  invalidation_rules:
    - Timeout, crash, or OOM => failed_infrastructure; never a mathematical negative.
    - Reported divisors of N±1 in place of r±1 => invalid_measurement.
    - A single factorization path, or two paths sharing factorization code => invalid_measurement.
    - Omitting either the r-1 or the r+1 branch => incomplete measurement, not a negative.
    - Ordinary-ECDLP improvement or vulnerability language in the run report => invalid_measurement (question constraint).
    - Overwriting this specification or a prior run receipt => evidence-integrity failure.

  success_criterion: >-
    Measurement success: (1) N counted by exact enumeration with the
    nonsingularity check recorded; (2) r set to the largest prime factor of
    N with cofactor N/r recorded; (3) both factorization paths return the
    same factor multiset for r-1 and for r+1, each product reconstructing
    its integer exactly; (4) pinned ratio >= 2 with null ratio < 1.25 and
    all required artifacts present. A pinned ratio < 2 with the null gate
    met is a certified failure to split and is likewise a complete,
    successful measurement.

  falsification_criterion:
    - r<16, so the window [2, floor(sqrt(r))] is degenerate: claim fails on this curve.
    - The two factorizations of r-1 or of r+1 disagree, or either product fails to reconstruct: measurement void.
    - Pinned ratio strictly less than 2: the order does not separate the branches.
    - Null ratio at least 1.25: the factor-2 gap is a formula artifact; claim fails.
    - Reported divisors are of N±1 rather than r±1: run invalid.

  required_artifacts:
    - manifest.yaml
    - order.json (N, r, cofactor N/r, nonsingularity check, enumeration method)
    - factorizations.json (per integer, both implementations, factor multisets, primality evidence)
    - ratio.json (d_minus, d_plus, B_minus, B_plus, B_rho, pinned ratio, r_null, null ratio, N±1 control divisors)
    - independent_recompute.json (inter-implementation agreement, product checks)
    - environment.json
    - stdout.log
    - stderr.log
    - command.txt
    - execution-report.yaml

  write_scope:
    - experiments/EXP-AUXIN-3b16d3/implementation/
    - experiments/EXP-AUXIN-3b16d3/runs/

  stages:
    - id: stage0_order_count
      authorized: true
      claim_status: pin_only
      purpose: Enumerate #E(F_10007), pin N, r, and the cofactor.
    - id: stage1_divisor_ratio
      authorized: true
      claim_status: adjudicable_arithmetic_measurement
      purpose: Two-path factorization of r±1, null construction, and both ratios.
    - id: stage2_cheon_execution_or_protocol_join
      authorized: false
      gated_on: Separate design plus a superseding Coordinator decision
      purpose: Running Cheon or joining protocol supply. Not this experiment.

  derivation_provenance:
    tool: coordinator session, /design-experiment under standing user authorization
    source_record: IDEA-20261005-447d82
    authored_at: '2026-10-06'
    note: >-
      Curve, integers, closed forms, thresholds (pinned >= 2, null < 1.25),
      the three controls, and interpretation limits are taken from
      IDEA-20261005-447d82. Cost shapes from KN-LIT-90e34c; taxonomy gate
      from KN-TECH-0f24d0 and RQ-AUXIN-f8d8c0. No run results invented. No
      Cheon execution.

  recorded_at: '2026-10-06'
