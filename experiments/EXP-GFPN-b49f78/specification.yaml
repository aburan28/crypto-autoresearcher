# EXP-GFPN-b49f78
# Acceptance integers. No backend.
# Approved by DEC-20261002-b8a193.
experiment:
  id: EXP-GFPN-b49f78
  hypothesis_id: H-GFPN-b7288c
  source_idea: IDEA-20260920-68b279
  question_id: RQ-GFPN-c01af8
  version: 1
  title: Acceptance integers for the update count
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-b8a193
  objective: >-
    Check the per-update counts, the planted fraction, the Montgomery
    window, and the calibration ratio.
  inputs:
    batch_sizes: [4, 8, 16, 32, 64]
    update_num: [25, 45, 85, 165, 325]
    update_den: [4, 8, 16, 32, 64]
    excess_num: [5, 5, 5, 5, 5]
    excess_den: [4, 8, 16, 32, 64]
    b16_num: 85
    b16_den: 16
    dropped_factor_num: 81
    dropped_factor_den: 16
    dropped_gap_num: 1
    dropped_gap_den: 4
    planted_pass: 64
    planted_total: 64
    one_miss_num: 63
    one_miss_den: 64
    miss_gap_num: 1
    miss_gap_den: 64
    window_low: 50
    window_high: 60
    midpoint: 55
    ten_percent_low_num: 99
    ten_percent_low_den: 2
    ten_percent_high_num: 121
    ten_percent_high_den: 2
    window_gap_num: 1
    window_gap_den: 2
    ratio_low_num: 19
    ratio_low_den: 20
    ratio_high_num: 21
    ratio_high_den: 20
    ratio_halfwidth_num: 1
    ratio_halfwidth_den: 20
    order_low: 68719476736
    order_high: 1099511627776
    order_ratio: 16
    isolated_schoolbook: 25
    isolated_split: 15
    isolated_square: 15
  controls:
    - >-
      At batch 16 the update count is 85/16. Reporting 85 invalidates
      the run.
    - >-
      The count 5 plus 1/16 is 81/16. Reporting that as the update
      count invalidates the run.
    - >-
      A full suite is 64 of 64. Reporting 63 of 64 as a pass
      invalidates the run.
    - >-
      The written floor is 50. Reporting 99/2 as that floor
      invalidates the run.
    - >-
      The calibration ratio is 16. Reporting 1 invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - batch size
    - route in {sum, quotient}
  metrics:
    primary:
      - update_b16
      - window_floor
      - implementations_agree
    secondary:
      - planted_gap
      - order_ratio
      - dropped_factor
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The count 85/16 and the floor gap 1/2.
    formula: >-
      The update count is 5 plus 5 over the batch size, which is
      5 times the batch size plus 5, all over the batch size. Ten
      percent of 55 is 11/2, so the ten-percent band is 55 minus
      that and 55 plus that. The calibration ratio is 2 to the 40
      divided by 2 to the 36.
    source: >-
      IDEA-20260920-68b279 states the acceptance numbers, read
      2026-10-02. The fractions were computed in this design
      session. That computation is not a run. No backend was built.
  scale_relevance:
    tier: toy
    justification: Five batch sizes and two windows. No transfer to a running walk.
    correspondence: null
  tail_checks:
    - The batch-64 row is required. Stopping at batch 32 and still reporting 325/64 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the batch-16 count is reported as 85, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The batch-16 count is reported as 85.
    - The batch-16 count is reported as 81/16.
    - A planted pass is reported as 63 of 64.
    - The written floor is reported as 99/2.
    - The calibration ratio is reported as 1.
    - A backend, a walk, or a certificate is reported.
  success_criterion: >-
    Both runs agree that the update counts are 25/4, 45/8, 85/16,
    165/32 and 325/64, that 81/16 is 1/4 below the batch-16 count,
    that one miss leaves 63/64, that the written window sits 1/2
    inside the ten-percent band at each end, and that the
    calibration ratio is 16.
  falsification_criterion: >-
    The runs agree, the batch-16 count stays 85/16, and any factor
    differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-GFPN-b49f78/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-GFPN-b49f78/runs/<RUN-ID>/command.txt
    - experiments/EXP-GFPN-b49f78/runs/<RUN-ID>/stdout.log
    - experiments/EXP-GFPN-b49f78/runs/<RUN-ID>/stderr.log
    - experiments/EXP-GFPN-b49f78/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-GFPN-b49f78/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any backend, walk, or certificate check.
    - Any claim that an instrument is qualified.
    - Any timed step or word-product counter from a running field.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
