protocol_operations:
  id: EXP-SMTH-PILOT-001-AMEND-010
  task_id: TASK-20260801-119
  base_contract: >-
    Materialize the exact contract through EXP-SMTH-PILOT-001-AMEND-009 at
    SHA-256 b53e234bf0147445aa7c0a9b168de48e40bc74d4c0f8a8ec54c1fa389ee7ff9c,
    then apply these operations.
  operation_semantics: >-
    Replace requires an existing target; add requires an absent target. Array
    indices are zero based. Any failed precondition is invalid_integrity; no
    implicit merge applies.
  status: draft_review_required
  execution_authorized: false
  scientific_design_unchanged: true

  operations:
  - op: replace
    target_path: /required_artifacts/2
    literal_value: experiments/EXP-SMTH-PILOT-001/runs/RUN-SMTH-PILOT-002/manifest.yaml
  - op: replace
    target_path: /required_artifacts/3
    literal_value: experiments/EXP-SMTH-PILOT-001/runs/RUN-SMTH-PILOT-002/command.txt
  - op: replace
    target_path: /required_artifacts/4
    literal_value: experiments/EXP-SMTH-PILOT-001/runs/RUN-SMTH-PILOT-002/environment.json
  - op: replace
    target_path: /required_artifacts/5
    literal_value: experiments/EXP-SMTH-PILOT-001/runs/RUN-SMTH-PILOT-002/stdout.log
  - op: replace
    target_path: /required_artifacts/6
    literal_value: experiments/EXP-SMTH-PILOT-001/runs/RUN-SMTH-PILOT-002/stderr.log
  - op: replace
    target_path: /required_artifacts/7
    literal_value: experiments/EXP-SMTH-PILOT-001/runs/RUN-SMTH-PILOT-002/raw-result.json
  - op: add
    target_path: /successor_run_contract
    literal_value:
      run_id: RUN-SMTH-PILOT-002
      predecessor_run_id: RUN-SMTH-PILOT-001
      predecessor_terminal_status: failed_implementation_preconstruction
      predecessor_archive_commit: d3d4b5160cdbc638a9e91760e8b791a7a6b7e98e
      predecessor_failure_receipt: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/archives/TASK-20260801-113/preconstruction_failure_receipt.json
      predecessor_scientific_construction_started: false
      predecessor_factorizations: 0
      predecessor_verified_checkpoint_exists: false
      predecessor_resume_authorized: false
      predecessor_rerun_authorized: false
      predecessor_mathematical_evidence: false
      successor_maximum_invocations: 1
      successor_maximum_resume_count: 1
      attempt_accounting: >-
        RUN-SMTH-PILOT-001 consumed its sole authorized invocation and may never
        be resumed, rerun or overwritten. This amendment defines one fresh
        bounded invocation under RUN-SMTH-PILOT-002. The existing frozen_budget
        ceilings apply independently to that successor invocation; no ceiling,
        seed, object, statistic, certificate or scientific interpretation is
        enlarged.
      result_path_reuse_boundary: >-
        The six predecessor run-directory paths are immutable and excluded from
        the successor required-artifact roster. The shared result and
        certificate paths were not created by the predecessor and remain the
        only authorized result sinks after a separate implementation snapshot,
        independent PASS and Coordinator execution authorization.
      immutable_predecessor_paths:
      - experiments/EXP-SMTH-PILOT-001/runs/RUN-SMTH-PILOT-001/stdout.log
      - experiments/EXP-SMTH-PILOT-001/runs/RUN-SMTH-PILOT-001/stderr.log
      immutable_predecessor_sha256:
        experiments/EXP-SMTH-PILOT-001/runs/RUN-SMTH-PILOT-001/stdout.log: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        experiments/EXP-SMTH-PILOT-001/runs/RUN-SMTH-PILOT-001/stderr.log: fce9cbf8d3ceea7cea60ef8ff19d150e5f8e47ad61565eafcd273618bbce8919

  effective_contract_checks:
  - Materialized required_artifacts still contains exactly 139 unique paths.
  - Required-artifact indices 2 through 7 name RUN-SMTH-PILOT-002 and no materialized required artifact names RUN-SMTH-PILOT-001.
  - The implementation roster remains the exact same two paths.
  - The successor run-evidence roster remains the exact 137-path ordered set difference from AMEND-007.
  - The two committed predecessor logs are absent from both successor archive rosters and retain their recorded hashes.
  - RUN-SMTH-PILOT-001 is terminal, non-resumable and non-evidentiary; RUN-SMTH-PILOT-002 has at most one invocation and one infrastructure resume.
  - Null-only scope, all scientific counts, seed derivation, storage caps, archive gates and outcome ceiling remain unchanged.

  release_condition: >-
    Fresh independent committed-byte PASS is required before a Coordinator may
    authorize the implementation-only RUN-SMTH-PILOT-002 path rebind. That
    implementation repair then requires its own snapshot and independent PASS
    before any successor execution authorization. Pilot execution remains
    unauthorized.
