protocol_operations:
  id: EXP-SMTH-002-AMEND-009
  task_id: TASK-20260801-090
  base_contract: >-
    Materialize through EXP-SMTH-002-AMEND-008 at SHA-256
    a0e090cf8b38c5354656449e021847365614a32bd8e7ee690700e349eee125da,
    then apply these operations.
  operation_semantics: >-
    Replace requires an existing target; add requires an absent target. Any
    failed precondition is invalid_integrity; no implicit merge applies.
  status: draft_review_required
  execution_authorized: false
  scientific_design_unchanged: true

  operations:
  - op: replace
    target_path: /seed_roster_contract/independent_control
    literal_value: >-
      A validator expands all 52 descriptors independently, reproduces every
      stream hash and ordered_all_seed_bytes_sha256, and recomputes exactly
      2109444 distinct tuple-derived seeds with zero collisions without trusting
      producer counters.
  - op: add
    target_path: /seed_roster_contract/canonical_payload_hash_rule
    literal_value: >-
      canonical_payload_sha256 is lower-case hex SHA-256 of the canonical UTF-8
      JSON encoding of the complete seed-roster top-level object after omitting
      exactly the canonical_payload_sha256 key and value. No null placeholder,
      whitespace, trailing newline or other field is omitted. Verification
      repeats the same omission and encoding.

  superseded_nonoperative_amendment_text:
  - >-
    AMEND-008 independent_control phrase "48 descriptors" is superseded by the
    effective replacement above.
  - >-
    AMEND-008 effective_contract_checks phrase "2109440 seeds" was nonoperative
    explanatory text and is corrected to 2109444 by this amendment.

  effective_contract_checks:
  - All 52 descriptors expand to exactly 2109444 tuple-derived seeds.
  - Collision membership covers all 2109444 seeds including four prime seeds.
  - canonical_payload_sha256 has exactly one mechanically defined preimage.
  - No seed domain, value rule, scientific count, path, cap or authorization changed.

  release_condition: >-
    Fresh independent committed-byte PASS is required before implementation repair.
    Pilot execution remains unauthorized.
