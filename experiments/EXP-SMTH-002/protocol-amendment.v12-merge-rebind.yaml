protocol_amendment:
  id: EXP-SMTH-002-AMEND-012
  task_id: TASK-20260801-153
  recorded_at: '2026-08-01'
  purpose: merge_identifier_and_storage_reconciliation_only
  status: review_required
  execution_authorized: false
  scientific_runs_authorized: 0
  scientific_design_unchanged: true
  supersedes_for_merged_tree_interpretation:
  - EXP-SMTH-PILOT-001-AMEND-010
  - EXP-SMTH-PILOT-001-AMEND-011

  basis:
    main_rename_commit: e255eccd9c60ab10bf77242b941dc4267322a6c2
    main_head_merged: fb3e7b173db7310b95a2e32f906c22871785511d
    branch_head_merged: 60dd04ca62f429f680e4ca2da065b49e3155cd5f
    merge_base: 8752582c2f7c43820ecd2ec31c73e562cd421cbd
    explanation: >-
      Main assigned the schema-valid identifier EXP-SMTH-002 and renamed the
      experiment directory before the branch independently archived the
      successor contract, RUN-SMTH-PILOT-002 failed checkpoint, RSS diagnosis,
      repair and independent validation under the malformed aliases
      EXP-SMTHPILOT-001 and experiments/EXP-SMTH-PILOT-001. The merge preserves
      both ancestries. It does not edit an immutable run, receipt or review to
      pretend the main rename was known when those bytes were produced.

  alias_map:
    embedded_historical_experiment_id: EXP-SMTHPILOT-001
    canonical_experiment_id: EXP-SMTH-002
    embedded_historical_storage_prefix: experiments/EXP-SMTH-PILOT-001
    canonical_storage_prefix: experiments/EXP-SMTH-002
    embedded_historical_seed_domain: EXP-SMTH-PILOT-001/v1
    canonical_seed_domain: EXP-SMTH-002/v1
    interpretation_rule: >-
      The malformed values remain literal historical provenance in already
      committed RUN002, task, review and archive blobs. In the merged tree they
      refer to EXP-SMTH-002. New artifacts must use only the canonical values.

  immutable_relocation:
    relocation_only_path_count: 62
    relocation_map_sha256: db47cd1bfe77df2aace52a0cfc6b2753fc0d98c6c7972dfe6c4b81dae136c5d8
    map_preimage: >-
      Canonical compact JSON array, sorted by the old-tree path, of objects with
      source, target and Git blob keys for the two historical successor
      amendments, all results files and all run files moved from
      experiments/EXP-SMTH-PILOT-001/ to experiments/EXP-SMTH-002/.
    verification_rule: >-
      For every row, Git blob(branch parent:source) equals
      hash-object(merged-tree target). A path move is not a content correction.
    run_or_result_blob_content_modified: false
    historical_records_rewritten: false

  content_conflict_resolution:
    specification:
      selected_record: origin/main experiments/EXP-SMTH-002/specification.yaml
      sha256: 0eecb2d30a0e24cc78ed2a8fc8171c2e866767e90a9e848795f504e900cb6157
      reason: >-
        This is the schema-valid canonical base specification introduced by the
        rename. Later successor semantics remain separate amendments and do not
        overwrite this base record.
    implementation:
      selected_record: branch TASK-20260801-150 validated RSS-repair driver
      sha256: f8b9c8fbdb02d7c3c3350e636cbf590508bcce9c6d2cbd0350a199803ac1bb1a
      current_release_state: nonoperative_pending_canonical_rebind
      reason: >-
        Keeping the independently validated driver byte-for-byte preserves the
        repair evidence. Its old EXPERIMENT_ID, EXP_REL and DOMAIN make the
        repository binding fail closed at the renamed location. This merge does
        not silently change implementation bytes after validation.

  run_002_status:
    run_id: RUN-SMTH-PILOT-002
    terminal_status: failed_infrastructure_or_budget
    failure_class: resource_exhaustion_accounting_implementation
    resumed_or_retried_by_merge: false
    relabeled_or_backfilled: false
    scientific_evidence: false
    historical_manifest_experiment_id_rewritten: false
    historical_concurrent_rss_reconstructable: false
    immutable_manifest_handling:
      path: experiments/EXP-SMTH-002/runs/RUN-SMTH-PILOT-002/manifest.yaml
      sha256: 0302565c6b2210b5367fe63a86357cf2bc32a01eeb1ffc2626202aabb78f848e
      observed_format: terminal_results_json_without_top_level_run_envelope
      action: exact_hash_binding_in_tools_legacy_run_inventory
      rationale: >-
        The blob was already archived as the failed attempt's manifest. It is
        immutable and cannot be rewritten into the current run schema. The
        frozen-run inventory makes any future byte change a validation error
        while preventing this known schema debt from becoming a net-new PR
        failure.

  required_next_gates:
  - Independent committed-byte review of this amendment and the merge map.
  - >-
    A Coordinator authorization for an implementation-only canonical rebind of
    EXPERIMENT_ID, EXP_REL, DOMAIN, fixed-path assertions, documentation and
    protected-inventory path handling at experiments/EXP-SMTH-002.
  - A new implementation snapshot and independent review; RT146-C1 must not be rerun.
  - >-
    Any scientific successor requires a separate RUN-SMTH-PILOT-003 contract
    with a fresh run-specific, non-overwriting results namespace, independent
    contract review and explicit Coordinator execution authorization.

  prohibited_interpretations:
  - The merge completes or repairs RUN-SMTH-PILOT-002.
  - The merge validates a future run below the 4-GiB RSS cap.
  - The relocated partial null data tests HEUR-DS-1 or H-SMTH-001.
  - The merge supplies ECDLP, asymptotic or breakthrough evidence.
  - Frozen-run inventory registration validates the manifest semantics or the failed run.

  release_condition: >-
    This amendment is nonoperative for execution until an independent review is
    archived. Even after PASS, it authorizes only a separately scoped
    implementation rebind, never a pilot or scientific run.
