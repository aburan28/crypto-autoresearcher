protocol_operations:
  id: EXP-SMTH-002-AMEND-007
  task_id: TASK-20260801-077
  base_contract: >-
    Materialize the exact chain through EXP-SMTH-002-AMEND-006 at
    SHA-256 7f6caeb446f336daf9c4e1e096daab27492c831aed59502893011a9bec89ed7e,
    then apply these operations.
  operation_semantics: >-
    Add requires an absent target. Replace requires an existing target. Any
    failed precondition is invalid_integrity; no implicit merge applies.
  status: draft_review_required
  execution_authorized: false
  scientific_design_unchanged: true

  operations:
  - op: add
    target_path: /archive_ownership
    literal_value:
      complete_required_artifact_count: 139
      implementation_snapshot:
        exact_path_count: 2
        exact_paths:
        - experiments/EXP-SMTH-002/implementation/pilot_driver.py
        - experiments/EXP-SMTH-002/implementation/implementation.md
        timing: >-
          Authored, tested, snapshot-committed and independently reviewed before
          any successor execution authorization. These bytes become immutable.
        receipt: >-
          The implementation archival task adds its own exact receipt path,
          which is not a required experiment artifact.
      run_evidence_snapshot:
        exact_path_count: 137
        path_rule: >-
          Exact ordered set difference of the materialized 139 required_artifacts
          minus the two implementation_snapshot exact_paths. The future archival
          handoff must enumerate all 137 literal paths and the dispatcher must
          reject any missing, extra, reordered or implementation path.
        timing: After the one authorized run terminates.
        receipt: >-
          The run-evidence archival task adds its own exact receipt path, which
          is not a required experiment artifact.
      disjointness_gate: >-
        The two path sets are disjoint and their union equals required_artifacts.
        Git diff for the run-evidence commit must contain exactly its 137 paths
        plus its receipt and must not change either implementation path.
      review_gate: >-
        Independent implementation review binds the two-path snapshot commit and
        sink tests. Independent result validation binds the later 137-path run
        evidence snapshot. Neither role edits predecessor bytes.
  - op: replace
    target_path: /archive_phase/pre_run_baseline_gate/future_allowance_derivation
    literal_value:
      maximum_tracked_evidence_bytes: 1207959552
      maximum_archive_receipt_bytes: 1048576
      reserved_blob_framing_tree_commit_and_pack_bytes: 140991872
      exact_sum_bytes: 1350000000
      exact_evidence_scope: >-
        The later run-evidence commit changes exactly the 137 run paths plus one
        archival receipt. The two immutable implementation paths and every
        implementation/control/review commit must already be ancestors of
        execution_remote_head_sha. The tracked-byte allowance conservatively
        retains the full 139-path cap even though the two implementation blobs
        are excluded from the later commit.

  effective_contract_checks:
  - Implementation roster has exactly two unique paths.
  - Run-evidence roster is the exact 137-path set difference.
  - The two rosters are disjoint and their union has exactly 139 required paths.
  - Later evidence commit changes 137 run paths plus receipt, never implementation bytes.
  - Pack, disk, count, shard and null-only constraints remain unchanged.

  release_condition: >-
    Fresh independent committed-byte PASS is required before implementation
    authoring; implementation then requires its own snapshot and independent
    PASS before a successor execution authorization.
