protocol_operations:
  id: EXP-SMTH-002-AMEND-005
  task_id: TASK-20260801-069
  exact_materialization_chain:
    base_document:
      path: experiments/EXP-SMTH-002/specification.yaml
      pointer: /experiment
      sha256: dcf6ca00e2a367f7271e17e3c151286227dba46877b8621cd791109efca3391d
    value_document:
      path: experiments/EXP-SMTH-002/protocol-amendment.v2.yaml
      pointer: /protocol_amendment
      sha256: 471369a194c3341c9f7ebd21093765b06d7958b3981878eaacbf280285c0cfbd
    operation_documents_in_order:
    - path: experiments/EXP-SMTH-002/protocol-amendment.v3-operations.yaml
      pointer: /protocol_operations/operations
      id: EXP-SMTH-002-AMEND-003
      sha256: 509a8fb5ca5b6cb8cc9123942e351b80269ee5c2c5ea5471d21f985d9fce4f22
    - path: experiments/EXP-SMTH-002/protocol-amendment.v4-archive-safe.yaml
      pointer: /protocol_operations/operations
      id: EXP-SMTH-002-AMEND-004
      sha256: d4743dca38ad6822ed7fb98d92d8d2c8a6b7088987711e620cc40ae10a798b7f
    - path: experiments/EXP-SMTH-002/protocol-amendment.v5-archive-phase.yaml
      pointer: /protocol_operations/operations
      id: EXP-SMTH-002-AMEND-005
      sha256_binding: supplied_by_snapshot_TASK-20260801-070
  operation_semantics: >-
    Verify every frozen input digest. Deep-copy base_document, resolve AMEND-003
    value_from pointers only from value_document, then apply the three operation
    lists in the exact stated order. Replace requires an existing target and
    add requires an absent target. Any failed precondition is invalid_integrity.
  status: draft_review_required
  execution_authorized: false
  scientific_design_unchanged: true

  operations:
  - op: replace
    target_path: /factorization_pipeline/shard_policy
    literal_value:
      logical_records_per_shard: 32704
      shard_count_exact: 128
      maximum_compressed_bytes_per_shard: 8388608
      maximum_logical_bytes_per_record: 1024
      exact_filename_rule: shard-{index:03d}.jsonl.gz for index 0..127
      close_fsync_hash: >-
        Write to final path plus .partial, close and fsync, verify record count
        and 8-MiB compressed cap, atomically rename, fsync the directory, then
        record SHA-256 and byte/count fields before opening the next shard.
  - op: replace
    target_path: /frozen_budget
    literal_value:
      maximum_runs: 1
      maximum_resume_count: 1
      maximum_factorization_calls: 4186112
      maximum_primality_checks: 50233344
      maximum_primality_checks_per_integer: 12
      maximum_certificate_reconstructions: 4186112
      maximum_wall_seconds: 7200
      maximum_cpu_seconds: 28800
      maximum_peak_rss_bytes: 4294967296
      maximum_run_phase_disk_bytes: 1610612736
      maximum_tracked_certificate_shard_bytes: 1073741824
      maximum_other_tracked_artifact_bytes: 134217728
      maximum_untracked_temporary_bytes: 134217728
      reserved_run_filesystem_overhead_bytes: 268435456
      maximum_tracked_push_bytes: 1207959552
      maximum_individual_shard_bytes: 8388608
      maximum_individual_other_artifact_bytes: 33554432
      maximum_workers: 4
      maximum_process_output_handles: 8
      no_network_during_run: true
      run_phase_derivation: >-
        1 GiB shards + 128 MiB other tracked + 128 MiB temporary + 256 MiB
        filesystem overhead = 1.5 GiB. Archive storage is charged separately.
      stop_semantics: >-
        Crossing a run-phase physical, individual-object or aggregate-object
        cap yields failed_infrastructure_or_budget at the next record boundary.
        False certificates, collisions, oversize records or hash mismatches
        yield invalid_integrity. Neither outcome is mathematical evidence.
  - op: add
    target_path: /archive_phase
    literal_value:
      authorization_binding_required:
      - remote_name
      - remote_branch
      - pack_exclusion_ancestor_sha
      - authorized_snapshot_sha
      remote_base_rule: >-
        The successor authorization freezes an exact already-pushed ancestor for
        conservative pack exclusion and the reviewed snapshot SHA. Immediately
        before implementation, fetch the named remote branch, require both frozen
        SHAs to be ancestors of its head, require local HEAD to equal that fetched
        head, record it as execution_remote_head_sha, and require a clean index and
        worktree. Any mismatch preserves the hold and starts no run.
      concurrency: archive task runs alone
      maximum_incremental_archive_disk_bytes: 8589934592
      minimum_free_disk_bytes_before_run: 8589934592
      reservations:
        run_worktree_and_temporary_bytes: 1610612736
        loose_git_objects_bytes: 1610612736
        remote_relative_preflight_pack_bytes: 1500000000
        push_stream_or_second_pack_bytes: 1500000000
        index_tree_commit_logs_and_measurement_bytes: 536870912
        exact_reserved_sum_bytes: 6758096384
        headroom_within_archive_cap_bytes: 1831838208
      archival_sequence:
      - Verify all 139 required paths and their caps before staging.
      - Stage only paths declared by the future archival task and create its local evidence commit.
      - >-
        Fetch the frozen remote ref again and require it still equals
        execution_remote_head_sha; otherwise do not pack or push.
      - >-
        Generate a complete remote-relative pack for evidence_commit excluding
        pack_exclusion_ancestor_sha with git pack-objects --stdout --revs, save
        it under a fresh temporary path, and record exact bytes and SHA-256.
      - Require exact pack bytes to be at most 1500000000 before push.
      - >-
        Push only the evidence commit to the exact frozen remote branch. A pack
        preflight or push failure is failed_infrastructure_or_archive, never evidence.
      - Delete only the named temporary preflight pack after recording its receipt.
      pack_revision_input: >-
        Two newline-terminated revisions: evidence_commit then caret-prefixed
        pack_exclusion_ancestor_sha. No other positive revision is permitted.
      remote_limit_bytes: 2000000000
      preflight_pack_cap_bytes: 1500000000
      remote_limit_headroom_bytes: 500000000
      lfs_used: false
  - op: replace
    target_path: /controls
    literal_value:
    - First and last record of every shard are independently reconstructed.
    - Every certificate reconstruction result is true before shard acceptance.
    - Exact total and per-object counts match the frozen design.
    - Seed roster regeneration reproduces every stream hash with zero collisions.
    - An injected composite-as-prime certificate is rejected.
    - An injected one-byte shard mutation fails SHA-256.
    - Process output handles never exceed eight and certificate shards never exceed one.
    - A synthetic twelve-factor certificate is rejected if any alleged factor is composite.
    - A 1025-byte logical record is rejected before the writer.
    - Every shard is at most 8388608 bytes and has the exact frozen filename.
    - Aggregate shard bytes are at most 1073741824.
    - Every other artifact is at most 33554432 bytes and their aggregate is at most 134217728.
    - Total tracked pilot bytes are at most 1207959552 before staging.
    - Canonical seed-roster and shard-manifest SHA-256 values are independently reproduced.
    - The frozen exclusion SHA is a remote ancestor and the remote head remains unchanged through the run.
    - The complete remote-relative preflight pack is at most 1500000000 bytes.
    - Incremental archive disk usage never exceeds 8589934592 bytes.
  - op: replace
    target_path: /shard_manifest_contract
    literal_value:
      canonical_path: experiments/EXP-SMTH-002/results/certificates/shard_manifest.json
      exact_entries: 128
      entry_fields:
      - repository_relative_path
      - shard_index
      - first_record_index
      - last_record_index
      - record_count
      - compressed_bytes
      - logical_bytes
      - gzip_sha256
      aggregate_fields:
      - total_records
      - total_compressed_bytes
      - total_logical_bytes
      - exact_path_roster_sha256
      - every_object_below_github_limit
      - aggregate_below_tracked_cap

  effective_contract_checks:
  - Exact materialization uses four existing paths plus this self-document; no absent input is named.
  - Required artifacts remain exactly 139 paths, including the same 128 exact shards.
  - Scientific counts remain 32 arrays and 4186112 factorizations.
  - 128 times 8388608 equals 1073741824 certificate bytes.
  - 1073741824 plus 134217728 equals 1207959552 tracked bytes.
  - Run-phase reservations sum to 1610612736 bytes.
  - Archive reservations sum to 6758096384 bytes, leaving 1831838208 under 8589934592.
  - The 1500000000-byte exact pack cap leaves 500000000 bytes below the remote limit.
  - No curve, factor base, S3, source, plant, p-value, evidence or state mode exists.

  release_condition: >-
    Fresh independent committed-byte PASS plus a new Coordinator authorization
    freezing the exact remote binding is required before implementation or execution.
