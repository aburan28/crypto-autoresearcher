protocol_operations:
  id: EXP-SMTH-002-AMEND-004
  task_id: TASK-20260801-065
  base_contract: >-
    Effective contract obtained by applying EXP-SMTH-002-AMEND-003 to
    experiments/EXP-SMTH-002/specification.yaml.
  operation_semantics: >-
    Apply operations in listed order to a deep copy of base_contract. Replace
    requires the target to exist and replaces its entire value. Any failed
    precondition is invalid_integrity. No implicit merge applies.
  status: draft_review_required
  execution_authorized: false
  scientific_design_unchanged: true

  transport_binding:
    remote_kind: GitHub ordinary Git over HTTPS
    github_limits_source: https://docs.github.com/en/repositories/creating-and-managing-repositories/repository-limits
    enforced_single_object_limit_bytes: 104857600
    enforced_push_limit_bytes: 2000000000
    lfs_used: false
    shard_object_cap_bytes: 12582912
    other_individual_object_cap_bytes: 67108864
    aggregate_shard_cap_bytes: 1610612736
    aggregate_other_tracked_cap_bytes: 268435456
    aggregate_tracked_push_cap_bytes: 1879048192
    push_headroom_bytes: 120951808
    derivation: >-
      128*12582912 = 1610612736 shard bytes. Adding 268435456 other tracked
      bytes gives 1879048192, which is 120951808 below 2000000000. Every shard
      is 12 MiB and every other individual artifact is at most 64 MiB, both
      strictly below the 100-MiB object limit.

  operations:
  - op: replace
    target_path: /factorization_pipeline/shard_policy
    literal_value:
      logical_records_per_shard: 32704
      shard_count_exact: 128
      maximum_compressed_bytes_per_shard: 12582912
      maximum_logical_bytes_per_record: 1024
      exact_filename_rule: shard-{index:03d}.jsonl.gz for index 0..127
      close_fsync_hash: >-
        Write to the exact final repository-relative path plus suffix .partial,
        close and fsync, verify record count and compressed-byte cap, atomically
        rename to the final path, fsync its directory, then record SHA-256,
        compressed bytes, logical bytes and first/last indices before opening
        the next shard.
  - op: replace
    target_path: /writer_topology
    literal_value:
      workers: 4 factorization workers
      writer: >-
        Exactly one writer consumes a bounded 4096-record queue in sequential
        index order. Exactly one .partial or final gzip shard is open at once.
        No tar, bundle, pack or second copy of certificate bytes is created.
      bounded_queue_records: 4096
      maximum_simultaneously_open_certificate_shards: 1
      maximum_process_output_handles: 8
      repository_paths_are_final_evidence: true
  - op: replace
    target_path: /frozen_budget
    literal_value:
      maximum_runs: 1
      maximum_resume_count: 1
      maximum_factorization_calls: 4186112
      maximum_primality_checks: 50233344
      maximum_primality_checks_per_integer: 12
      maximum_certificate_reconstructions: 4186112
      maximum_wall_seconds: 7200
      maximum_cpu_seconds: 28800
      maximum_peak_rss_bytes: 4294967296
      maximum_total_disk_bytes: 2147483648
      maximum_tracked_certificate_shard_bytes: 1610612736
      maximum_other_tracked_artifact_bytes: 268435456
      maximum_untracked_temporary_bytes: 134217728
      reserved_git_worktree_and_index_overhead_bytes: 134217728
      maximum_tracked_push_bytes: 1879048192
      maximum_individual_shard_bytes: 12582912
      maximum_individual_other_artifact_bytes: 67108864
      maximum_workers: 4
      maximum_process_output_handles: 8
      no_network_during_run: true
      joint_safety_derivation: >-
        1.5 GiB certificate shards + 256 MiB other tracked artifacts + 128 MiB
        temporary bytes + 128 MiB Git worktree/index reserve = 2 GiB local disk.
        Tracked bytes are capped at 1.75 GiB, below the GitHub 2-GB push limit.
      stop_semantics: >-
        Crossing a physical, individual-object, aggregate-object or push cap
        yields failed_infrastructure_or_budget at the next record boundary.
        False certificates, seed collisions, record oversize or hash mismatch
        yield invalid_integrity. Neither outcome is mathematical evidence.
