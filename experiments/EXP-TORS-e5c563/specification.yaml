experiment:
  id: EXP-TORS-e5c563
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-6eab6a
  question_id: RQ-TORS-8c7b79
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE ELL-PRIMARY COPRIMALITY OBSTRUCTION FOR L7: every homomorphic ell-power-torsion invariant
    of an ECDLP instance vanishes identically on a prime-order subgroup G with ell != N, so ell-descent
    images, Kummer classes, reductions modulo ell*E(F_p), and Weil/Tate pairings of G against E[ell]
    are k-independent BY THEOREM rather than by measurement -- and the unique prime at which the obstruction
    is void is ell = N, which is exactly where the one known torsion-based total break of the prime-field
    ECDLP lives'
  status: draft
  objective: "(A) THE THEOREM. Let A = E(F_p), let N be a prime with N || #A, let G = A[N] = <P> be\
    \ the prime-order subgroup, and let Q = [k]P. Let ell be any prime with ell != N. Let M be any\
    \ abelian group of exponent dividing ell^m for some m >= 1, and let f: A -> M be any group homomorphism.\
    \ Then f(G) = {0}. PROOF: for R in G, the order of f(R) divides both N (the order of R) and ell^m\
    \ (the exponent of M), and gcd(N, ell^m) = 1, so f(R) = 0. In particular f(P) = f(Q) = 0 on every\
    \ instance, for every k. The map k |-> (f(P), f(Q)) is therefore CONSTANT, so it carries exactly\
    \ zero bits about k. This is elementary and unconditional; it needs no heuristic, no experiment,\
    \ and no scale qualification.\n(B) FOUR NAMED CORROLLARIES, EACH KILLING A CANDIDATE THIS LANE\
    \ WAS OPENED TO EXAMINE.\n  C1 -- REDUCTION MOD ell*E(F_p). Since gcd(ell, N) = 1, multiplication\
    \ by\n    ell is an automorphism of G, so G = [ell]G is contained in ell*A, hence\n    also in\
    \ ell^m * A for every m. Therefore P and Q both have image 0 in\n    A/ell*A. The \"position of\
    \ P modulo ell*E(F_p)\" named in the L7 brief is\n    the zero class on every instance.\n  C2\
    \ -- ell-DESCENT / KUMMER IMAGE. The ell-descent map on A factors through\n    A/ell*A, which\
    \ C1 shows annihilates G. For an ell-isogeny phi: E -> E'\n    the descent quotient E'(F_p)/phi(E(F_p))\
    \ has exponent dividing ell and is\n    therefore also annihilated on the image of G. The ell-descent\
    \ image of P\n    and of Q is trivial.\n  C3 -- WEIL AND TATE PAIRINGS BETWEEN G AND E[ell]. Take\
    \ P in E[N],\n    T in E[ell], and the Weil pairing e_{ellN} on E[ellN]. Bilinearity gives\n \
    \   e_{ellN}(P,T)^N = e_{ellN}([N]P, T) = 1 and\n    e_{ellN}(P,T)^{ell} = e_{ellN}(P, [ell]T)\
    \ = 1, so e_{ellN}(P,T) has order\n    dividing gcd(N, ell) = 1 and equals 1 identically. The\
    \ reduced Tate\n    pairing t_N(P, T) is 1 for the same reason: T lies in N*E(F_p) because\n \
    \   [N] is invertible on the ell-part, so T is trivial in E(F_p)/N*E(F_p).\n    Pairing the target\
    \ point against ell-torsion is identically trivial.\n  C4 -- THE ell-DIVISION FIELD OF THE POINT\
    \ IS CURVE-ONLY. By C1 there is\n    R_0 in E(F_p) with [ell^m]R_0 = P. Every ell^m-division point\
    \ of P has\n    the form R_0 + T with T in E[ell^m], so F_p(R_0 + T) = F_p(T). The\n    multiset\
    \ of fields of definition of the ell^m-division points of P equals\n    the multiset {F_p(T) :\
    \ T in E[ell^m]}, which depends on E only. The\n    Kummer extension attached to P is trivial,\
    \ so the field-of-definition\n    statistic of the point's division points is k-independent.\n\
    \n(C) WHERE THE OBSTRUCTION IS VOID, WHICH IS THE FORWARD GUIDANCE AND NOT A DECORATION. The proof\
    \ uses only gcd(N, ell^m) = 1. It says nothing at ell = N. And the one place in the recorded literature\
    \ where torsion at the group-order prime demolishes the prime-field ECDLP is exactly ell = N =\
    \ p: the anomalous (trace-one) curves, where #E(F_p) = p, the p-torsion structure supplies a globally\
    \ defined formal-group logarithm, and the ECDLP collapses to a division in O(log p) field operations\
    \ (KN-TECH-033, relaying KN-LIT-087/088/089). KN-TECH-033 states the general lesson this record\
    \ adopts verbatim: representations win exactly when the curve supplies a global structural coincidence,\
    \ and a proposal must NAME its coincidence. This record names the coincidence that the whole ell\
    \ != N lane is missing: coprimality is the obstruction, and only ell = N voids it.\n(D) HARD-CONSTRAINT\
    \ ENGAGEMENT (mandatory in this lane). Is the data point-dependent? The invariants in B1-B4 ARE\
    \ evaluated at the points P and Q, so they are point-dependent as expressions and publicly computable\
    \ without any discrete logarithm. The theorem's content is that they are CONSTANT in k anyway\
    \ -- the point-dependence is formal, not informational. This is why the lane's hard constraint\
    \ has to be stated as \"point-dependent AND non-constant on G\", and this record supplies the\
    \ exact criterion separating the two: a homomorphic invariant valued in an ell-primary group is\
    \ constant on G; only a NON-HOMOMORPHIC invariant can be non-constant, and IDEA-20260807-df906f\
    \ takes up exactly that complement.\n(E) WHAT THIS IS NOT. It is not a lower bound on the ECDLP.\
    \ It is not a statement about ell = N, about extension fields, about supersingular curves over\
    \ F_{p^2} (where End has rank 4 and the analysis differs), or about composite-order base points.\
    \ It closes ONE sub-family -- ell-primary homomorphic invariants, ell != N -- and it closes it\
    \ completely, which is more than a measurement of that sub-family could ever do."
  resource_label: 'audit: consumes no resource (the audited resource is R5)'
  admissibility: admissible
  admissibility_argument: 'This proposal mounts no attack and consumes no resource; it is an audit
    in the sense of L12 (RQ-GGMB-6eaabc), applied inside L7. It is admissible as a deliverable because
    it does not apply any endomorphism to points of G and claims no speedup. Its CONCLUSION is stronger
    than the admissibility filter itself: the filter says a G-only endomorphism oracle is generic-group
    simulable and therefore closed at exponent 1/2 (KN-FIND-b7e091, H-ENDO-001); this record says
    an ell-primary homomorphic invariant on G is not merely simulable but CONSTANT, i.e. it has zero
    entropy about k rather than sqrt(N)-bounded usefulness. Constant is strictly worse than simulable,
    and the distinction matters because a simulable oracle can still be part of a correct algorithm
    while a constant one cannot be part of any.'
  reachability_gate: 'NOT APPLICABLE AND STATED AS SUCH. This proposal moves between no curves: all
    four corollaries are evaluated on the single given curve E. T5 (the reachability gate of DECOMPOSITION.md
    section 3) therefore imposes no cost here. For completeness, the theorem is transport-stable:
    if phi: E -> E'' is an F_p-isogeny of degree coprime to N, then phi(G) is again of prime order
    N, so every corollary holds verbatim on E'' with no additional reachability cost. That stability
    is used by IDEA-20260807-053a55.'
  inputs:
    procedure: 'STAGE 0 (zero compute, the actual deliverable): write the derivation note with C1-C4
      and the boundary analysis. This is complete without any run. STAGE 1 (minutes): implement the
      three known-answer checks of STEP 2 on 5 seeds x {16, 20, 24} field bits, restricted to curves
      whose cofactor has a small prime factor ell in {3,5,7,11,13} so that E(F_p)[ell] is non-empty.
      STAGE 2 (minutes, HARD GATE): the ell = N baseline embedding on a small-embedding-degree fixture.
      Must return a non-trivial pairing. STAGE 3 (zero compute): record the forward-guidance list.
      Total budget: well under one CPU-hour. Division polynomials are NOT needed for this proposal;
      ell-torsion points are found by multiplying random points by #E/ell, which is cheap at these
      sizes.'
    mechanism: 'STEP 1 (zero compute) -- write out the four corollaries as a derivation note with
      each step justified by an elementary group-theoretic fact, in the form given in the claim. No
      literature dependency beyond the definitions of the Weil and Tate pairings.

      STEP 2 (minutes of compute, KNOWN-ANSWER INSTRUMENT TEST, not evidence for the theorem) -- on
      toy instances at 16-24 field bits generated by harness/toycurve.py, and for ell in {3,5,7,11,13}:
      (a) verify computationally that P and Q lie in ell*E(F_p) by exhibiting an explicit ell-division
      point, which is cheap because [ell^{-1} mod N]P is an ell-division point of P inside G itself;
      (b) verify that the reduced Tate pairing t_N(P, T) equals 1 for every T in E(F_p)[ell]; (c)
      verify that the Weil pairing e_{ellN}(P,T) equals 1. Purpose: these are KNOWN-ANSWER CHECKS
      on the instrument that IDEA-20260807-bd5d91 builds. A disagreement is an implementation bug,
      NEVER evidence against the theorem (AGENTS.md rule 5 applies to the instrument, and the theorem
      is not an empirical claim).

      STEP 3 (zero compute) -- record the boundary explicitly: the exact hypothesis used is gcd(N,
      ell) = 1. State the three ways it can fail in practice and what each implies: (i) ell = N (out
      of lane; MOV/Frey-Ruck territory, KN-TECH-032); (ii) the base point does not have prime order
      (Pohlig-Hellman, KN-TECH-030; a change of instance, not of algorithm); (iii) ell = N = p (anomalous,
      KN-TECH-033; total break). Nothing else voids it.

      STEP 4 (zero compute) -- forward guidance for the lane, which is the part a later agent will
      actually use. What remains open after this closure: (i) NON-HOMOMORPHIC point functionals derived
      from ell-torsion, taken up by IDEA-20260807-df906f; (ii) objects living on E[ell] itself rather
      than on G, where the group is (Z/ell)^2 and therefore has ell+1 proper subgroups and genuine
      lossy quotients -- these are the Elkies isogenies, taken up by IDEA-20260807-053a55 and IDEA-20260807-1d9c5f;
      (iii) everything at ell = N.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - ell = N boundary (must be non-trivial) -- blocking.
  - 'Composite-order base point control: on the same curve, take a generator of the full group E(F_p)
    (order h*N) instead of P, and confirm the projection to the ell-part IS non-trivial and DOES recover
    the scalar mod ell. This demonstrates the instrument can see a real leak when one exists and pins
    the exact hypothesis the theorem uses. It is Pohlig-Hellman and is labelled as such.'
  - 'A planted-positive: an artificially constructed map that is NOT a homomorphism (e.g. R |-> x(R)
    mod ell) must be seen to vary with k, so that a null result on the homomorphic family is not an
    instrument-wide null.'
  - 'NULL OBJECT (from the proposal): MANDATORY AND SUPPLIED, for the STEP 2 instrument only (the
    theorem itself is not an empirical claim and takes no control). MATCHED NULL OBJECT: the same
    pairing and division computations run at ell = N -- that is, t_N(P, T) for T in G itself, and
    the reduced Tate self-pairing -- where the value is NOT forced to 1 and generically is not. DECAY
    PARAMETER: ell/N coprimality, realised by sweeping ell over the divisors of #E(F_p): for every
    ell dividing the cofactor with ell != N the computed pairing must be 1, and at ell = N it must
    be non-trivial for at least one T. AN INSTRUMENT THAT RETURNS 1 EVERYWHERE, INCLUDING AT ell =
    N, IS MEASURING ITS OWN ZERO AND ITS ell != N OUTPUTS ARE VOID. This is the canonical artifact
    tell in this setting: a quantity that fails to change when the parameter that must change it does.'
  independent_variables: []
  metrics:
    primary:
    - t_N(P,T) and e_{ellN}(P,T) values per (seed, bits, ell, T)
    - the explicit ell-division point of P and its re-verification by [ell]
    - the ell = N boundary pairing value per fixture
    - the composite-order control's recovered scalar mod ell, verified against ground truth
    secondary:
    - pass/fail of every gate control
  heuristic_under_test: null
  preregistered_prediction:
    quantity: 'Reduced Tate pairing t_N(P, T) for T ranging over E(F_p)[ell], ell in {3,5,7,11,13}
      with ell | #E(F_p) and ell != N, at 16-24 field bits'
    formula: Exactly 1 (the identity of the target group) on 100 percent of cells. A single non-trivial
      value is an implementation error and halts the line; it is NOT evidence against the theorem.
      BASIS - derivation in this record; NOT measured anywhere in this campaign.
    source: pre-registered in IDEA-20260807-6eab6a before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - Cofactor structure at toy scale. At 16-32 bits a randomly generated curve frequently has a smooth
    cofactor, so E(F_p)[ell] is often non-trivial and the checks are runnable -- but the same smoothness
    makes accidental degeneracies more likely (KN-TECH-030 obligation 2, KN-TECH-033 hygiene). Every
    instance must record its factored group order.
  - Pairing implementation subtleties. The reduced Tate pairing requires exponentiation by (p^{k_emb}
    - 1)/N and the embedding degree must be computed, not assumed. An unreduced Tate pairing is only
    defined up to N-th powers and would produce meaningless comparisons.
  - Confusing "identically 1" with "1 on the sampled points". The theorem gives the former; the experiment
    can only exhibit the latter. The write-up must cite the derivation for the universal statement
    and the run only for the instrument's health.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Exactly 1 (the identity of the target group) on 100 percent of cells. A single
    non-trivial value is an implementation error and halts the line; it is NOT evidence against the
    theorem. BASIS - derivation in this record; NOT measured anywhere in this campaign.
  falsification_criterion:
  - A correctly implemented pairing returns a non-trivial value for e_{ellN}(P,T) or t_N(P,T) with
    ell != N on a curve satisfying the stated hypotheses. This contradicts an elementary theorem and
    must be treated as a suspected implementation error and replicated independently before being
    reported as anything else.
  - P is found NOT to lie in ell*E(F_p) on some instance with gcd(ell, N) = 1. Same disposition.
  - The ell = N boundary control returns 1 everywhere. The instrument is blind and the run set is
    INVALID rather than confirmatory (AGENTS.md rule 5).
  - The composite-order control fails to recover the scalar mod ell. The instrument cannot see a leak
    that provably exists, so its nulls are void.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
