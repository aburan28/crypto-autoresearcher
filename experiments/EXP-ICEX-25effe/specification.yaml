experiment:
  id: EXP-ICEX-25effe
  hypothesis_id: H-ICEX-ce964e
  derived_from_idea: IDEA-20260811-6034d0
  question_id: RQ-JINV-8fc13a
  batch_id: BATCH-d6838c
  version: 1
  title: >-
    EXACT SYMBOLIC FACTORISATION OF THE SUMMATION POLYNOMIALS ON THEIR OWN
    DEGENERATION DIVISOR, WITH THE ELIMINATION-DEGREE ARM GATED RATHER THAN BANDED-
    a first cheap gate decides whether the f_V-free elimination polynomial is the
    curve cubic, in which case its degree ratio is 1.000 BY CONSTRUCTION and the arm
    is recorded as a proof; the b = 0 candidate is settled by a machine-verified
    discriminant identity; a planted split of KNOWN type {2,2} must be detected; and
    every elimination statistic is stratified on the F_p-root count of the curve cubic
  status: draft
  objective: >-
    (A) THE UNCERTAINTY. Support is a combinatorial shadow that this lane own
    committed data shows moves Groebner time by under one percent and gb_size the
    WRONG WAY. Reducibility is different in kind- a genuine split of the summation
    polynomial makes the decomposition variety a union of components and every
    solver pays for the component it works on; a repeated factor makes the ideal
    non-radical; a drop in the elimination degree reduces the final univariate
    solve. Whether any of the eight j-line degeneration loci does any of these has
    never been computed.
    (B) THE TWO DESIGN DEFECTS THIS CONTRACT REPAIRS, BOTH COMPUTED BEFORE THE
    DESIGN.
      DEFECT 1, AN ARM WHOSE STATISTIC MAY BE CONSTANT BY CONSTRUCTION. The source
      pre-registers the elimination-polynomial degree ratio at EXACTLY 1.000 at all
      eight loci, with a drop below 1 as the escalation-worthy outcome.
      DEC-20260810-d70ece records the five-curve lead that the f_V-free elimination
      ideal was generated by the curve OWN CUBIC. If that holds, the elimination
      polynomial is x^3 + a x + b at EVERY curve, its degree is 3 everywhere, and
      the ratio is 1.000 identically - A BAND NO ALTERNATIVE CAN CROSS. THE ARM IS
      THEREFORE GATED- stage 1 decides the question cheaply, and if the answer is
      yes the arm is RECORDED AS A PROOF carrying no j-line content and is NOT RUN.
      DEFECT 2, A CANDIDATE THAT CAN BE SETTLED WITHOUT AN ENGINE. The source names
      b = 0 as one of two a priori candidates for a factorisation. With
      S_3 = (x1-x2)^2 x3^2 - 2((x1+x2)(x1 x2 + a) + 2b) x3
      + ((x1 x2 - a)^2 - 4 b (x1+x2)) and b = 0, the discriminant over four of the
      quadratic in x3 is
        [(x1+x2)(x1 x2 + a)]^2 - (x1-x2)^2 (x1 x2 - a)^2
        = [2 x1 (x2^2 + a)][2 x2 (x1^2 + a)]
        = 4 x1 x2 (x1^2 + a)(x2^2 + a),
      which is SQUAREFREE for nonzero a and therefore NOT A SQUARE, so S_3 at b = 0
      does not split over F_p[x1, x2]. The contract MACHINE-VERIFIES that identity in
      stage 2 rather than trusting it, and a = 0 becomes the single remaining a
      priori candidate.
    (C) WHAT IS BUILT. Exact symbolic factorisation in TWO independent engines over
    QQ(a,b) and over two named F_p, at the generic curve and at all eight loci via
    declared rational parametrisations avoiding their singular points; the
    squarefree-part degree; the elimination arm behind its gate, stratified on the
    F_p-root count r of the curve cubic; a planted split of known type; and ten
    random weight-12 null loci.
    (D) WHAT IS NOT DECIDED. Any cost consequence - NO TIME IS MEASURED. Anything
    about the deployed f_V-bearing system. Any isogeny-class statement. And no
    novelty is claimed, since external literature was NOT checked for prior
    publication of this question.
  inputs:
    cost_unit: >-
      THERE IS NO COST METRIC. Factorisation type is a MULTISET OF INTEGER DEGREES;
      the elimination and squarefree-part ratios are DEGREE OVER DEGREE and are
      dimensionless. WALL-CLOCK SECONDS ARE RECORDED FOR BUDGET AND CENSORING ONLY
      and enter no comparison, no ratio and no reported statistic.
    unit_discipline: >-
      BINDING. Every value carries a tag in {degree, multiset, field_name, count,
      dimensionless, seconds}. Cross-tag arithmetic requires a named recorded
      conversion, and the only ratios used are degree over degree. NO QUANTITY IN
      THIS CONTRACT IS A TIME DIVIDED BY ANYTHING.
    formulation: >-
      THE f_V-FREE SYSTEM IS PRIMARY, because the f_V-bearing elimination degree is
      pinned by the factor-base size and not by the curve. The f_V-bearing values are
      computed and reported SEPARATELY and are never presented as a curve functional.
    parametrisation: >-
      BLOCKING. Each locus is specialised through a RATIONAL PARAMETRISATION
      DECLARED BEFORE EXECUTION that AVOIDS THE SINGULAR POINT of the locus. Hitting
      the singular point fabricates a degeneration, and a run whose parametrisation
      passes through it is INVALID for that locus.
    field_of_definition: >-
      BLOCKING. Reporting -factors- without the FIELD over which it factors is
      meaningless. Every factorisation type carries the field of definition of each
      factor, and the full type over the ALGEBRAIC CLOSURE is reported, not only the
      Boolean irreducibility over the base.
    stratification: >-
      BLOCKING FOR THE ELIMINATION ARM. Every elimination splitting statistic is
      reported per stratum of r, the number of roots of x^3 + a x + b in F_p. AN
      UNSTRATIFIED ELIMINATION STATISTIC MAY NOT BE CITED, per the anticipation the
      committed decision requires a successor to make before execution.
    frozen_before_execution: >-
      The eight loci and their parametrisations, the ten random weight-12 null loci,
      the two engines, the two primes, the planted-split polynomial and its known
      type {2,2} on the locus and {4} off it, the r-strata, the gate criterion for
      the elimination arm, and the discriminant identity to be verified. None may
      change after any cell runs.
    procedure: >-
      STAGE 0 (locus re-derivation, blocking). Re-derive the eight loci from the
      S_m coefficient factorisation over QQ[a,b] rather than assuming the catalogue,
      and confirm S_3 has NO weight-12 coefficient factor so that the six weight-12
      loci are an m = 4 object.
      STAGE 1 (ELIMINATION GATE, blocking, cheap, DECIDES THE SHAPE OF THE RUN).
      Compute the f_V-free m = 3 elimination polynomial at the generic curve and at
      three random curves, and determine whether it EQUALS x^3 + a x + b. IF YES-
      record the elimination-degree ratio as 1.000 BY CONSTRUCTION, mark the arm A
      PROOF CARRYING NO j-LINE CONTENT, and DO NOT RUN IT AS AN ARM. IF NO-
      establish the generic elimination degree and run the ratio arm against it.
      Either way the outcome is a reported deliverable.
      STAGE 2 (DISCRIMINANT VERIFICATION, blocking, seconds). Verify symbolically
      over QQ(a) that the discriminant over four of S_3 at b = 0, as a quadratic in
      x3, equals 4 x1 x2 (x1^2 + a)(x2^2 + a), and that this is squarefree for
      nonzero a. A disagreement means the derivation in the objective is wrong and
      must be repaired before anything else is read.
      STAGE 3 (generic baseline, blocking). Factor S_3 and S_4 over QQ(a,b) and over
      F_p(a,b) at both primes in BOTH engines; report the per-variable degrees and
      the irreducibility certificate; check the elimination degree against the dense
      Bezout bound.
      STAGE 4 (the eight loci). Substitute each declared parametrisation and factor
      the specialised polynomial over the function field of the locus AND over its
      algebraic closure. Record the FULL factorisation type with multiplicities and
      fields of definition, and the squarefree-part degree.
      STAGE 5 (controls). C-PLANT-SPLIT with its known type; C-NULL-LOCUS at ten
      random weight-12 loci; C-R-STRATIFY on the elimination arm if it runs;
      C-ENGINE on every cell.
      STAGE 6 (report). Emit the factorisation-type table with multiplicities and
      fields, the squarefree-part ratio table, the elimination gate outcome and -
      only if the gate returned no - the elimination table stratified on r, the
      planted-split outcome, the null-locus table, and the engine agreement count.
    mechanism: >-
      STEP 1. Specialising a polynomial to a subvariety of its coefficient space can
      only do three things to its factorisation type- nothing, split it, or make it
      non-reduced. Which occurs is decided by whether the specialisation lands in the
      discriminant of the family. The loci were found by an unrelated criterion, so
      the prediction is negative.
      STEP 2. Where a finite group acts, an invariant can be a product over orbits,
      which is why a = 0 and b = 0 are the a priori candidates and the six weight-12
      loci are not. STAGE 2 REMOVES b = 0 FROM THAT LIST BY COMPUTATION.
      STEP 3. Two independent factorisation engines agree on every type. This is a
      genuinely available cross-check on this host, unlike graded Betti numbers, and
      a disagreement is an implementation error and never a result.
      STEP 4. Every row is reported as (arm, m, locus, parametrisation, p or QQ,
      engine, factorisation type with multiplicities, field of definition per factor,
      squarefree-part degree, elimination degree, r-stratum, wall seconds).
    instrument: >-
      Exact symbolic factorisation in two engines sharing no code path. NO MINIMAL
      FREE RESOLUTION AND NO BETTI TABLE IS REQUIRED, so the backend precondition
      that paused the predecessor contract does NOT bind this one - a deliberate
      design choice stated so the contract is dispatchable as it stands. S_4
      factorisation over a function field is the dominant cost; the stopping rule
      permits substituting a specialisation to a large prime field WITH A STATED LOSS
      OF CHARACTERISTIC-ZERO GENERALITY, recorded rather than hidden.
  controls:
    - >-
      C-ELIM-GATE (BLOCKING, cheap, and the repair of a possibly width-zero band).
      Determine whether the f_V-free m = 3 elimination polynomial is the curve cubic
      BEFORE running any elimination-ratio comparison. IF IT IS, the ratio is 1.000
      by construction, the arm is recorded as a PROOF and is not run, and the source
      pre-registered ratio is documented as a band no alternative could have crossed.
    - >-
      C-DISCRIMINANT (BLOCKING, seconds). Machine-verify that the discriminant over
      four of S_3 at b = 0 is 4 x1 x2 (x1^2 + a)(x2^2 + a) and that it is squarefree
      for nonzero a. This settles the b = 0 candidate analytically and leaves a = 0
      as the only a priori candidate.
    - >-
      C-PLANT-SPLIT (BLOCKING positive control with a KNOWN TYPE). A constructed
      polynomial with the same support as S_4 generically whose factorisation type is
      {2, 2} in x3 ONLY on a chosen weight-12 locus and {4} off it. THE METHOD MUST
      RETURN {2, 2} ON THE LOCUS AND {4} OFF IT - a demonstrated separation of two
      distinct multisets. A MISS, OR A HIT WITH THE WRONG TYPE, INVALIDATES EVERY
      NEGATIVE IN THIS EXPERIMENT.
    - >-
      C-NULL-LOCUS. Ten random weight-12 loci not among the eight, predicted
      irreducible at all, confirming that irreducibility is the generic outcome of
      specialising to such a locus. A factorisation at a random locus VOIDS every
      positive and the framing must be rewritten.
    - >-
      C-R-STRATIFY (BLOCKING for the elimination arm, if it runs). Every elimination
      splitting statistic reported per r-stratum. An unstratified elimination result
      may not be cited.
    - >-
      C-ENGINE. Two independent factorisation engines must agree on every
      factorisation type. Disagreement means nothing is established until reconciled.
    - >-
      C-PARAMETRISATION. Each locus parametrisation is declared before execution and
      is verified to avoid the singular point of its locus. A parametrisation passing
      through it fabricates a degeneration and invalidates that locus.
  independent_variables:
    - locus in {generic, a = 0, b = 0, the six weight-12 loci, ten random weight-12 null loci}
    - arity m in {3, 4}
    - ground field in {QQ(a,b), F_4001(a,b), F_q(a,b) for one prime above 2^20}
    - engine, two sharing no code path
    - r, the number of F_p-roots of the curve cubic, for the elimination arm
    - object in {S_m, the planted-split polynomial}
  metrics:
    primary:
      - >-
        factorisation type with multiplicities and field of definition per factor,
        per locus per m, over the algebraic closure (multiset of degrees)
      - >-
        squarefree-part degree ratio, locus over generic, per locus per m
        (dimensionless, degree over degree)
      - >-
        elimination gate outcome- whether the f_V-free m = 3 elimination polynomial
        is the curve cubic (boolean, with the polynomial exhibited)
    secondary:
      - elimination polynomial degree and F_p-splitting type per locus per r-stratum, ONLY if the gate returned no
      - the f_V-bearing elimination values, reported separately and never as a curve functional
      - planted-split detected type on the locus and off it
      - null-locus factorisation types at ten random weight-12 loci
      - the verified discriminant identity at b = 0
      - engine agreement count
      - characteristic-specific factorisations, labelled as such
      - wall-clock seconds per cell, for budget and censoring only
  heuristic_under_test: HEUR-FACT-1
  preregistered_prediction:
    quantity: >-
      The multiset of irreducible factor degrees of S_m over the algebraic closure
      at each degeneration locus, the squarefree-part degree, and - conditional on
      the gate - the elimination polynomial degree.
    formula: >-
      IRREDUCIBLE at all eight loci for m in {3, 4}; squarefree-part degree ratio
      EXACTLY 1.000 at all eight; elimination-degree ratio 1.000, WHICH IS EITHER A
      TEST OR A CONSTRUCTION DEPENDING ON THE GATE. At b = 0 irreducibility is
      DERIVED- the discriminant over four is 4 x1 x2 (x1^2 + a)(x2^2 + a), squarefree
      for nonzero a. Planted split must return {2,2} on its locus and {4} off it.
    source: >-
      This contract own derivation on the form of S_3 committed VERBATIM in
      IDEA-20260807-5ddccf claim (A); the locus catalogue and the S_4 block
      stratification in IDEA-20260811-a7c1df; and the five-curve elimination lead
      and its mandatory anticipation recorded in DEC-20260810-d70ece. All three
      records were read for this contract, the first as a declared partial read.
      Hilbert irreducibility supplies the genericity intuition and is RECALLED, not
      opened, and supports nothing.
  scale_relevance:
    tier: toy
    justification: >-
      Two primes, m in {3, 4}, one parametrisation per locus. Every quantity is an
      EXACT SYMBOLIC INVARIANT, so there is no statistical scale and no contention
      sensitivity. TRANSFER ASSUMPTION, STATED- the loci and coefficients are defined
      over QQ, so a characteristic-zero factorisation type transfers to all but
      finitely many p; a split appearing only modulo one p is labelled
      characteristic-specific and transfers nowhere.
    correspondence: null
  tail_checks:
    - >-
      The field of definition of every factor is reported, not only whether a factor
      exists, because -factors only after a field extension- and -factors- are
      different findings and only the second could ever bear on cost.
    - >-
      The multiplicity of every factor is reported, since a repeated factor changes
      the Groebner behaviour independently of the degree and is invisible to a bare
      irreducibility Boolean.
  replication:
    seeds: >-
      Seeded ten random weight-12 null loci and three random curves for the
      elimination gate, listed in the run manifest before stage 1. Symbolic
      computations are deterministic, so replication here means ENGINE AGREEMENT
      rather than repeated sampling.
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 12.0
    maximum_memory_gb: 16
    maximum_runs: 30
  stopping_rules:
    - >-
      Stage 0, 1, 2, 3 or the planted-split control failing HALTS the run at that
      point, with the stage that failed named.
    - >-
      If the S_4 factorisation over a function field exceeds budget, the stopping
      rule permits substituting a specialisation to a large prime field WITH A STATED
      LOSS OF CHARACTERISTIC-ZERO GENERALITY, recorded on every affected row rather
      than hidden.
    - >-
      A cell exceeding its wall-clock or memory cap is CENSORED with the mechanism
      named; under AGENTS.md rule 5 that is an infrastructure receipt and NEVER a
      statement that the polynomial is irreducible there.
    - >-
      Total wall-clock at the declared cap; remaining cells recorded as NOT
      ATTEMPTED.
  invalidation_rules:
    - >-
      A factorisation type emitted without the field of definition of each factor
      invalidates the row.
    - >-
      An elimination statistic emitted without its r-stratum invalidates the row.
    - >-
      A locus parametrisation passing through the singular point of its locus
      invalidates that locus.
    - >-
      C-PLANT-SPLIT missed, or detected with the wrong type, invalidates every
      negative in the experiment.
    - >-
      A factorisation at a random weight-12 null locus voids every positive.
    - >-
      Two engines disagreeing on a factorisation type invalidates that cell until
      reconciled.
    - >-
      Presenting an f_V-bearing elimination value as a curve functional invalidates
      the row.
  success_criterion: >-
    Stage 0 to stage 3 pass; the discriminant identity at b = 0 verifies; the
    elimination gate returns a definite yes or no with the polynomial exhibited; the
    planted split is detected with the correct type on and off its locus; the ten
    null loci are irreducible; both engines agree on every cell; and the
    factorisation-type and squarefree-part tables are emitted for all eight loci at
    m = 3 and, budget permitting, at m = 4. Success is the EXISTENCE OF THE EXACT
    TABLE WITH ITS CONTROLS FIRING, not a particular direction.
  falsification_criterion: >-
    S_3 or S_4 REDUCIBLE at any of the eight loci over the algebraic closure
    falsifies the negative prediction and requires second-engine replication and a
    field-of-definition determination before any description. A squarefree-part
    degree ratio below 1 at any locus means a repeated factor and a non-radical
    ideal. An elimination-degree drop, IF the gate returned no, is a direct cost
    channel and the one result in this lane that would deserve escalation. The gate
    returning YES documents that the source elimination band was width-zero and
    could never have fired. A missed planted split VOIDS every negative.
  required_artifacts:
    - exact command, git commit and dirty-tree state, environment and versions
    - the frozen parameter file with the eight loci, their parametrisations, the null loci, the engines, the primes, the planted polynomial and its known type, and the gate criterion
    - the stage 0 locus re-derivation from the S_m coefficient factorisation
    - the stage 1 elimination-gate record with the elimination polynomial exhibited at the generic curve and three random curves
    - the stage 2 symbolic verification of the discriminant identity at b = 0
    - the generic baseline factorisations and irreducibility certificates from both engines
    - per-cell raw records (arm, m, locus, parametrisation, field, engine, factorisation type with multiplicities, field of definition per factor, squarefree-part degree, elimination degree, r-stratum, seconds)
    - the planted-split outcome on the locus and off it, with the types returned
    - the null-locus factorisation table
    - the elimination table stratified on r, ONLY if the gate returned no
    - the f_V-bearing elimination values, separately labelled
    - characteristic-specific factorisations, labelled as such, with the prime named
    - censored and not-attempted inventory with mechanisms, and any characteristic-zero generality loss recorded per row
    - stdout, stderr, timestamps, resource measurements
    - inference block- requested policy, backend, resolved model id, effort, fallback, degraded requirements
  assigned_to: executor
  approved_by: null
  limitations:
    - >-
      THE b = 0 DISCRIMINANT COMPUTATION IS THE AUTHOR OWN HAND ARITHMETIC on a
      committed form of S_3 and is MACHINE-VERIFIED IN STAGE 2 rather than trusted.
      It shows the quadratic in x3 does not split over F_p[x1, x2] for nonzero a; it
      does NOT by itself settle irreducibility over every extension, which the
      contract computes separately.
    - >-
      IF THE ELIMINATION GATE RETURNS YES, THE ELIMINATION-DEGREE ARM IS A PROOF AND
      NOT A MEASUREMENT- the ratio is 1.000 at every curve by construction and
      carries no j-line content. The source pre-registered band could not have fired
      in that case, and that is documented as a design finding.
    - >-
      EVEN A POSITIVE IS NOT AN ATTACK. Any consequent gain is charged against the
      automorphism-discounted rho baseline, where a factor at or below sqrt(6) is
      baseline calibration, and this contract measures NO TIME and makes no cost
      claim.
    - >-
      THE RESULT IS ABOUT THE f_V-FREE FORMULATION ONLY. The deployed f_V-bearing
      system has its elimination degree pinned by the factor-base size, so nothing
      here transfers to it.
    - >-
      SPLITTING-TYPE VARIATION IS ATTRIBUTED TO r AND NOT TO THE LOCUS. Stratification
      is mandatory and blocking; an unstratified elimination result may not be cited.
    - >-
      A SPLIT APPEARING ONLY MODULO SOME p IS A CHARACTERISTIC-SPECIFIC EVENT and is
      labelled as one; small primes are especially prone.
    - >-
      EXTERNAL LITERATURE WAS NOT CHECKED for prior publication of the
      summation-polynomial factorisation question, so the outcome may already be
      known and no novelty is claimed.
    - >-
      claim_tier toy. No attack, no exponent, no speedup, sota_delta zero.
      Dominated by every row of the attack frontier, since no solver is produced.
  yaml_parse_disclosure: >-
    Written by a Coordinator subagent without an interpreter. Every prose value is
    a folded block scalar; no tabs; no duplicate keys to the author reading. THIS
    AGENT COULD NOT RUN A STRICT YAML PARSE OR tools/validate_ledger.py AND DID
    NOT DO SO; the orchestrating session must run both before this contract is
    reviewed.
