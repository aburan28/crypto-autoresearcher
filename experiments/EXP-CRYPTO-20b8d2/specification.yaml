# EXP-CRYPTO-20b8d2
# Tuple-sum image counts. No solver.
# Approved by DEC-20261002-075990.
experiment:
  id: EXP-CRYPTO-20b8d2
  hypothesis_id: H-CRYPTO-9557c5
  source_idea: IDEA-20260921-7822a4
  question_id: RQ-CRYPTO-001
  version: 1
  title: Tuple-sum image counts
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-075990
  objective: >-
    Count the sums of ordered pairs and triples from {0, 1, 3} in
    Z/17, and check the exact power ratios at n = 4096.
  inputs:
    modulus: 17
    elements: [0, 1, 3]
    pair_tuples: 9
    pair_image: 6
    pair_sums: [0, 1, 2, 3, 4, 6]
    combination_count: 3
    commutative_ceiling: 6
    triple_tuples: 27
    triple_image: 9
    triple_sums: [0, 1, 2, 3, 4, 5, 6, 7, 9]
    multiset_ceiling: 10
    zero_query_term: 0
    power_rows:
      - {m: 2, q: 64, value: 4096}
      - {m: 3, q: 16, value: 4096}
      - {m: 4, q: 8, value: 4096}
    square_rows:
      - {n: 4096, t: 64, square: 4096}
      - {n: 16384, t: 128, square: 16384}
      - {n: 65536, t: 256, square: 65536}
  controls:
    - >-
      A pair image of 3 is the combination count. The image has 6
      elements. Reporting 3 invalidates the run.
    - >-
      A pair image of 9 is the ordered-tuple count. The image has
      6 elements. Reporting 9 invalidates the run.
    - >-
      A triple image of 10 is the multiset ceiling, and 27 is the
      ordered-tuple count. The image has 9 elements. Reporting 10
      or 27 invalidates the run.
    - >-
      A positive zero-query term is false. The term is 0.
      Reporting a positive value invalidates the run.
    - >-
      A ratio other than 1 on any listed power row is false. Each
      Q^m equals 4096 and each T^2 equals its n. Reporting another
      ratio invalidates the run.
    - Two counting routes. They must not import each other.
  independent_variables:
    - arity
    - route in {ordered, sorted}
  metrics:
    primary:
      - pair_image
      - triple_image
      - power_ratio
      - implementations_agree
    secondary:
      - zero_query_term
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The pair image 6 and the triple image 9.
    formula: >-
      Ordered tuples from a set of size Q number Q^m. In an
      abelian group the sum depends only on the sorted tuple, so
      the image is at most the number of multisets. The zero-query
      power is 0. The listed roots satisfy Q^m = 4096.
    source: >-
      IDEA-20260921-7822a4 states the Q^m/n counting sketch, read
      2026-10-02. The image was enumerated in this design session.
      That enumeration is not a run. The pair image is 6, not 3
      and not 9. No solver was run.
  scale_relevance:
    tier: toy
    justification: One image and three powers. No transfer to a success probability.
    correspondence: null
  tail_checks:
    - The triple image is required. Stopping after pairs and still reporting the triple image is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other counting route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the pair image is reported as 3 or as 9, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The pair image is reported as 3 or as 9.
    - The triple image is reported as 10 or as 27.
    - The zero-query term is reported positive.
    - Any listed power ratio is reported different from 1.
    - A solver success probability is reported.
  success_criterion: >-
    Both runs agree on the pair sums {0, 1, 2, 3, 4, 6}, the
    triple image 9 with sums {0, 1, 2, 3, 4, 5, 6, 7, 9}, the
    zero-query term 0, and the six exact ratios 1. The pair image
    stays 6.
  falsification_criterion: >-
    The runs agree, the pair image stays 6, the triple image stays
    9, and any count differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-CRYPTO-20b8d2/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CRYPTO-20b8d2/runs/<RUN-ID>/command.txt
    - experiments/EXP-CRYPTO-20b8d2/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CRYPTO-20b8d2/runs/<RUN-ID>/stderr.log
    - experiments/EXP-CRYPTO-20b8d2/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CRYPTO-20b8d2/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any solver, generic-group simulation, or class closure.
    - A claim that the counting bound holds or fails as a theorem.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
