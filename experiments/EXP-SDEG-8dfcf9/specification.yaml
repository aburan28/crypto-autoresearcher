        "determinants": "Use exact fraction-free Bareiss with the first nonzero row in the pivot column and row-swap parity, saving previous pivot. Each quotient must reconstruct its numerator exactly. If no pivot exists determinant=0 with elimination trace. Over F_p[W] nonzero means polynomial nonzero; scalar specialization is handled separately. Independent checker uses determinant expansion for matrices dimension<=6 and fraction-free elimination with independently implemented polynomial division above that; all checking costs recorded.",
