# EXP-AUXIN-0aaa04
# Ceiling fraction. No factorisation.
# Approved by DEC-20261002-51a0f9.
experiment:
  id: EXP-AUXIN-0aaa04
  hypothesis_id: H-AUXIN-d135d6
  source_idea: IDEA-20260930-6bde2d
  question_id: RQ-AUXIN-f8d8c0
  version: 1
  title: Ceiling fraction at cap 2 to the 29
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-51a0f9
  objective: >-
    Check the fraction 225 over 508, the cross gap 44, and the
    square excess 1.
  inputs:
    bits: 254
    cap_power: 29
    numerator: 225
    denominator: 508
    low_thousandths: 442
    high_thousandths: 443
    cross_excess_low: 464
    cross_gap_high: 44
    half_cap: 268435456
    high_num: 17
    high_den: 12
    high_square: 289
    high_twice: 288
    high_gap: 1
    low_num: 7
    low_den: 5
    low_square: 49
    low_twice: 50
    low_gap: 1
  controls:
    - >-
      254 minus 29 is 225. Reporting another numerator invalidates
      the run.
    - >-
      The fraction falls short of 443 over 1000 by the cross gap 44.
      Reporting it as at least 443 over 1000 invalidates the run.
    - >-
      Seventeen squared exceeds twice 144 by 1. Reporting 17 over 12
      at or below the square root of 2 invalidates the run.
    - >-
      Twice 25 exceeds 49 by 1. The dyadic difference is 268435456.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {ceiling, square_root_bracket, dyadic_half}
    - route in {cross_multiply, square_compare}
  metrics:
    primary:
      - cross_gap_high
      - high_gap
      - implementations_agree
    secondary:
      - cross_excess_low
      - low_gap
      - half_cap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The ceiling is 225 over 508. It exceeds 442 over 1000 by 464
      on the cross product and falls short of 443 over 1000 by 44.
      Seventeen squared exceeds twice 144 by 1.
    formula: >-
      Subtract 29 from 254 and compare 225 times 1000 with 442 times
      508 and with 443 times 508. Separately compare 17 squared with
      twice 12 squared, and 7 squared with twice 5 squared.
    source: >-
      IDEA-20260930-6bde2d states the example 0.443 at cap 2 to the
      29 and 254 bits, and a factor at most the square root of 2,
      read 2026-10-02. The products were recomputed in this design
      session. That computation is not a run. No order was factored.
  scale_relevance:
    tier: toy
    justification: One bit length and one cap. No transfer to a census.
    correspondence: null
  tail_checks:
    - The low bracket gap 1 and the dyadic difference are required. A check that stops at the gap 44 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the cross gap 44 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The numerator is not 225.
    - The ceiling is reported as at least 443 over 1000.
    - 17 over 12 is reported at or below the square root of 2.
    - An order is factored or a curve is pinned.
  success_criterion: >-
    Both runs agree that the ceiling is 225 over 508, that the cross
    excess over 442 over 1000 is 464, that the cross gap under 443
    over 1000 is 44, that the dyadic difference is 268435456, and
    that the two square gaps are 1.
  falsification_criterion: >-
    The runs agree that 254 minus 29 is 225, and the cross gap under
    443 over 1000 is not 44.
  required_artifacts:
    - experiments/EXP-AUXIN-0aaa04/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-AUXIN-0aaa04/runs/<RUN-ID>/command.txt
    - experiments/EXP-AUXIN-0aaa04/runs/<RUN-ID>/stdout.log
    - experiments/EXP-AUXIN-0aaa04/runs/<RUN-ID>/stderr.log
    - experiments/EXP-AUXIN-0aaa04/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-AUXIN-0aaa04/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any factorisation of an order, or any pinned curve.
    - Any claim that a Phi_k branch is best or never best.
    - Any supply-cap census.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
