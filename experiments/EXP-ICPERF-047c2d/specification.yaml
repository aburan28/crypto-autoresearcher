# EXP-ICPERF-047c2d
# Exchange-rate products. No closure count.
# Approved by DEC-20261002-b5f912.
experiment:
  id: EXP-ICPERF-047c2d
  hypothesis_id: H-ICPERF-16cf38
  source_idea: IDEA-20260926-c98e92
  question_id: RQ-ICPERF-94c86e
  version: 1
  title: Exchange-rate products
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-b5f912
  objective: >-
    Check the group order, the inversion count, the column product,
    the row ratio, and the three product-law values against the
    square root.
  inputs:
    group_order: 130412
    it_multiplications: 4
    it_squarings: 16
    addition_multiplications: 6
    addition_squarings: 17
    column_product: 547185664
    written_column: 550000000
    column_gap: 2814336
    word_count: 64
    live_tail_bits: 16
    pad_bits: 48
    ratio_num: 28631
    ratio_den: 4009
    ratio_remainder: 568
    written_ratio_num: 71
    written_ratio_den: 10
    ratio_gap_num: 1671
    ratio_gap_den: 40090
    square_mark: 160
    pi_compare_num: 102400
    pi_compare_den: 32603
    floor_m2_num: 48603
    floor_m2_den: 5
    floor_m3_num: 1621995
    floor_m3_den: 529
    floor_m4_num: 228881
    floor_m4_den: 128
    stack_low: 17352
    stack_high: 17604
  controls:
    - >-
      The column product is 547185664. Reporting 550000000 invalidates
      the run.
    - >-
      The square root is strictly above 160. Reporting it as 160
      invalidates the run.
    - >-
      The ratio 28631/4009 exceeds 71/10. Reporting the ratio as 71/10
      invalidates the run.
    - >-
      The m = 3 floor is strictly below 2 to the power 11.6. Reporting
      it as at least that power invalidates the run.
    - >-
      The word count is 64. Reporting 63 invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - cell in {m2, m3, m4}
    - route in {products, series}
  metrics:
    primary:
      - column_product
      - square_root_above_160
      - implementations_agree
    secondary:
      - ratio_gap
      - floor_m3
      - addition_multiplications
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The product 547185664 and the inequality against 160.
    formula: >-
      The column bound multiplies 2924, 2924 and 64. The inversion
      count is the floor of the base-2 logarithm of 16, plus the
      Hamming weight of 16, minus 1. The product-law value is m
      factorial times 130412, divided by B to the m minus 1, plus m
      times B squared. The circle-constant lower bound uses eight
      terms of the arctangent of 1/5 and three terms of the arctangent
      of 1/239, with the next term as a remainder bound, in the Machin
      combination. That lower bound exceeds 102400/32603.
    source: >-
      IDEA-20260926-c98e92 states the products and the square-root
      comparison, read 2026-10-02. The products and the Machin partial
      sum were computed in this design session. That computation is
      not a run. No closure was counted.
  scale_relevance:
    tier: toy
    justification: One matrix shape and three cells. No transfer to a counted closure.
    correspondence: null
  tail_checks:
    - The m = 4 floor is required. Stopping after m = 3 and still reporting 228881/128 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the column product is reported as 550000000, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The column product is reported as 550000000.
    - The square root is reported as 160.
    - The ratio is reported as 71/10.
    - The m = 3 floor is reported as at least 2 to the power 11.6.
    - The word count is reported as 63.
    - A closure count or a timed run is reported.
  success_criterion: >-
    Both runs agree that the group order is 130412, the inversion
    count is 4, the addition uses 6 multiplications and 17 squarings,
    the column product is 547185664, the ratio exceeds 71/10 by
    1671/40090, the square root is strictly above 160, and the three
    floors 48603/5, 1621995/529 and 228881/128 each exceed that
    square root.
  falsification_criterion: >-
    The runs agree, the column product stays 547185664, and any
    factor differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-ICPERF-047c2d/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ICPERF-047c2d/runs/<RUN-ID>/command.txt
    - experiments/EXP-ICPERF-047c2d/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ICPERF-047c2d/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ICPERF-047c2d/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ICPERF-047c2d/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any closure count, timed run, or exchange-rate measurement.
    - Any claim that a refutation is cheap or expensive.
    - Any transport of a constant from n = 17 to n = 131.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
