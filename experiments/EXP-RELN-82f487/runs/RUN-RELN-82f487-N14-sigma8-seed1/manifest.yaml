  stage: >-
    stage2_graph_build_and_training + stage3_scoring_nulls_and_permutation_retrain
    + stage4_gates_and_slope_fit + stage5_cost_instrumentation (partial: one
    cost-instrumentation measurement only)
  status: invalid_measurement
  status_note: >-
    Per agents/executor.md's failure taxonomy, invalid_measurement ("result
    exists but the metric is unreliable") rather than completed_valid,
    because this run hit a spec-defined BLOCKING stopping rule mid-protocol
    (see below) whose own text ("Stop the run if E/random and Z/N-random
    disagree beyond band at any rung") is not scoped to a single regime, so
    the run's result is not certified as decided science pending audit --
    NOT failed_infrastructure (nothing crashed, timed out, or was killed)
    and NOT negative_observation (per AGENTS.md rule 3 and this contract's
    own falsification_criterion, a pipeline fault is never evidence for or
    against the hypothesis). specification.yaml's own decision_paths
    vocabulary for this outcome is "inconclusive": this cell hit the
    E/random-vs-Z/N-random pipeline-fault stopping rule in regime F1,
    class gnn (rho difference 0.079 exceeds the tolerance band half-width
    0.064; Z/N-random F1/gnn also sits above its own selection-null band).
    Every OTHER gate on this cell passed (fixtures exact, static audit
    correctly rejects the planted leak, no label-permutation leak, no canary
    leak, Z/N-interval positive control at ceiling for both classes both
    regimes). Per AGENTS.md rule 3 and this contract's own
    falsification_criterion, a pipeline fault is NEVER evidence for or
    against H-RELN-10ad6b; this run's measurements are preserved in full
    (nothing discarded) and reported as inconclusive, not negative or
    positive. A single rung (2^14) also cannot fit the required log-log
    slope regardless of the pipeline-fault flag (needs >= 2 rungs).
