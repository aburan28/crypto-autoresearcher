    without a further run.
  artifact_binding: >-
    All future artifacts belong to a newly allocated immutable run
    directory under experiments/EXP-RELN-82f487/runs/. manifest.json binds
    the sha256 of this approved specification, of every input record, of
    every consumed EXP-RELN-f202be count vector, of every source/ file and
    serialized model, the commit, the exact commands, the resolved
    inference block (requested_policy, resolved model, fallback_used),
    runtime and dependency versions, per-stage wall time, peak RSS, and the
    approval lock's maximum_workers. No run directory is authorized now.

  later_review_requirements:
    - >-
      A committed Coordinator review_plan must precede any claim-changing
      review, declaring the prior (0.85 predicted branch), the owned joints
      (leak audit, selection null, lookup subtraction, slope fit),
      blindness, and the known-positive control (Z/N-interval).
    - >-
      Independent validator performs a BLIND re-derivation of lambda and rho
      on one cell from the count vector and the slice-membership table
      alone, without producer code, and checks the closed-form total, the
      fixtures, the seed integrity and the manifest hashes.
    - >-
      Red team attacks the selection-null design (density, target set,
      Holm family), the leak-audit design (import rules, node order,
      translate selection, base-summary features as a lookup channel), and
      the lookup-subtraction step.
    - >-
      Resolve review-adversarial at xhigh without silent downgrade;
      review-breakthrough at max is required only for a claimed break,
      i.e. an assertion that a surviving lift has ECDLP consequence, which
      this contract does not permit any run to make.

