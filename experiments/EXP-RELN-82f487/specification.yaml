experiment:
  id: EXP-RELN-82f487
  id_allocation_provenance: >-
    EXP-RELN-82f487 was pre-minted by the orchestrating session with
    tools/allocate_id.py and confirmed free with --check; this agent did not
    re-mint and did not scan state for a next free number.
  hypothesis_id: H-RELN-10ad6b
  version: 1
  title: >-
    Inductive graph-neural and gradient-boosted-tree decomposability
    predictor as an instrument on the four-arm panel with a growth arm,
    scored by the c5c614 lifts lambda and rho against the random-partition
    selection null, with a label-permutation null, a canary, a planted-leak
    check and a non-graph baseline
  status: review_required
  objective: >-
    Freeze a control-matched measurement of whether a LEARNED
    coordinates-only predicate on targets finds representation-decidable
    structure in the m = 3 decomposition-count vector of negation-closed
    x-interval bases on prime-order E/F_p beyond the exchangeable null, at
    toy scale, across N in {2^14, 2^16, 2^18, 2^20} (exhaustive labels) and
    2^24 (certified sample), and to read the answer off the fitted decay
    exponent of the top-sigma slice's excess of lambda and rho over the
    selection null against the two pre-registered values -1/2 (closed with
    a number) and 0 (alive), with the GNN-minus-trees difference and the
    predictor cost c_f measured alongside. A decaying lift is the predicted
    NULL outcome of H-RELN-10ad6b and is a valid, reportable result; a
    surviving lift's only permitted use is as INPUT to the
    symbolic-regression sibling (IDEA-20260906-1f6bfe / EXP-RELN-141a86)
    and to a proof attempt. No learned model's accuracy is a result. This
    contract is unapproved and authorizes zero executions.

  inputs:
    - ledger/hypotheses/H-RELN-10ad6b.yaml
    - ledger/proposals/IDEA-20260906-79ff48.yaml
    - ledger/proposals/IDEA-20260830-c5c614.yaml
    - ledger/questions/RQ-RELN-61638a.yaml
    - knowledge/findings/KN-FIND-007.md
    - docs/claims-and-verification.md
    - docs/research-budget-policy.md
    - >-
      EXHAUSTIVE-LABEL SOURCE, PRIMARY: the exact count vectors c_D of the
      exhaustive enumeration battery EXP-RELN-f202be (IDEA-20260906-d1494b),
      consumed only when a committed run of that contract supplies count
      vectors for the IDENTICAL curve (p, a, b, N), base seed, arm and
      frozen convention; their run IDs and sha256 are recorded in
      manifest.json and their closed-form total check is repeated here.
    - >-
      EXHAUSTIVE-LABEL SOURCE, FALLBACK: when no such committed count vector
      exists for a cell, Stage 1 of this contract enumerates c_D itself in
      source/enumerate_counts.py with the closed-form total check
      sum_r c_D(r) = C(B+2, 3) at deviation exactly 0 and an independent
      re-addition of 1000 uniformly sampled (target, multiset) pairs by the
      run wrapper. The manifest states per cell which source was used.
    - >-
      SAMPLED-RUNG LABELS at 2^24: a fixed sample of 163840 targets per
      (curve, base seed, arm), drawn by the target-sample seed, labelled by
      the Theta(B) lookup R - d in D + D over a sorted table of the
      B(B+1)/2 pair sums; every claimed decomposition carries its three base
      points as a certificate re-added independently by the wrapper.
    - >-
      CURVES: three prime-order short-Weierstrass curves y^2 = x^3 + a x + b
      over F_p per rung, generated by the curve seeds with p the first prime
      at or above 2^k (1 + j/64) for j the curve index and (a, b) drawn by
      seed until #E(F_p) is prime; the manifest records (p, a, b, N, P) per
      curve. Z/N arms use N equal to each curve's order.

  controls:
    - name: arm_E_x_interval_object
      construction: >-
        D = every point of E(F_p) whose x-coordinate lies in the interval
        [x0, x0 + L), x0 drawn by the base seed and L the smallest length
        giving exactly B_eff distinct x-values on the curve; negation-closed
        by construction, nominal size B = 2 B_eff; targets in D masked.
      expected: >-
        Under H1, excess of lambda and rho over the selection null inside the
        Holm-corrected band at every rung, or decaying with slope interval
        containing -1/2 and excluding 0. The alternative outcome (slope
        interval containing 0, excluding -1/2, controls in band) is the
        refuting branch and is equally reportable.
    - name: arm_E_random_matched
      construction: >-
        B_eff x-values drawn uniformly by the base seed from the x-values of
        E(F_p), both points over each x taken, so the base is negation-closed
        with the same nominal and effective size as the object arm; targets
        in D masked.
      expected: >-
        Excess inside band at every rung, and agreement with Z/N-random
        within band (nearby-object control). Disagreement beyond band is a
        pipeline fault and halts.
    - name: arm_ZN_interval_positive_control
      construction: >-
        Additive group Z/N with D = +-[1, B_eff], features computed on the
        residue r as if it were x (r, its low 4 bits, Legendre symbols of r
        and r + 1 mod N, the vector (1, r, r^2), translates r +- d_i for
        k = 8 fixed base elements); targets in D masked.
      expected: >-
        BLOCKING PASS THRESHOLD, half the conservation ceiling: lambda >= 4
        and rho >= 4 at sigma = 1/8, lambda >= 16 and rho >= 16 at
        sigma = 1/32, for every model class, regime and rung, on the worst
        training seed. Expected value 1/sigma because the sumset
        [-3 B_eff, 3 B_eff] has density below 1/32 at every rung. A class
        below threshold at a rung is UNINFORMATIVE there and no negative
        may be reported from it.
    - name: arm_ZN_random_negative_control
      construction: >-
        Z/N with D = +-{B_eff residues drawn uniformly from [1, (N-1)/2] by
        the base seed}; same features as the positive control; targets in D
        masked.
      expected: >-
        Excess inside band. If above band, the excess is the model's lookup
        capacity from reading D's coordinates; it is recorded with the
        measured c_f and SUBTRACTED from the E arms at matched class, regime,
        sigma and rung, never reported as structure.
    - name: arm_E_log_interval_canary
      construction: >-
        Small-multiples base D = {[+-j]P : j in [1, B_eff]} on the same
        curve, coordinates-only features, targets in D masked.
      expected: >-
        Excess inside band on every class, regime and rung. A lift above
        band is a leak of the logarithm or a DLP predictor; either halts the
        run for audit under IDEA-20260806-94676a's protocol before anything
        is reported.
    - name: random_partition_selection_null
      construction: >-
        Per cell (arm, rung, curve, base seed, class, regime, sigma), 1000
        uniformly random subsets of the masked held-out target set at the
        identical density sigma, drawn by the null seed; lambda and rho of
        each; the empirical 2.5 and 97.5 percentiles are the band. Copied
        from IDEA-20260830-c5c614 unchanged.
      expected: >-
        Band centred on 1 for lambda and rho. Every reported effect is an
        excess over this band; a raw lift is never reported.
    - name: analytic_exchangeable_null
      construction: >-
        E[rho] = 1 exactly for a partition independent of D (INV-3, H2), with
        Var(rho) approximately (1 - sigma) Delta / (mu sigma N_test), Delta
        the dispersion index measured exactly from the count vector, mu the
        conservation mean, N_test the masked held-out count; 2-sigma band
        computed per cell. Pre-computed reference at N_test = N/2, Delta = 1:
        about +-0.12 at 2^14 and +-0.015 at 2^20 for sigma = 1/32, +-0.055
        and +-0.007 for sigma = 1/8 (proposal arithmetic, replaced by the
        measured values).
      expected: >-
        Agreement with the empirical selection-null band on the random arms
        within 20 percent of the band half-width; disagreement means the
        sampler or the enumeration is wrong and halts.
    - name: label_permutation_null
      construction: >-
        Per (arm, rung, curve, base seed, class, regime), retrain the
        identical model on the identical graph and features with training
        labels permuted among training targets by the permutation seed
        (training seed 301 only), then score its held-out top-sigma slice.
      expected: >-
        Inside the selection-null band on EVERY arm including Z/N-interval.
        A permuted-label lift above band is a LEAK (a feature or the node
        order is a function of the logarithm) and halts the run.
    - name: planted_leak_check_of_the_audit
      construction: >-
        One diagnostic cell (2^14, curve 1, base seed 201, E/x-interval,
        trees, F0) deliberately adds log_P(R) mod 2 as a feature through the
        feature module; the static audit (source/leak_audit.py, which
        forbids the feature module from importing the scalar, the
        enumeration index or the label module) and the label-permutation
        null are both run on it.
      expected: >-
        The static audit REJECTS the planted feature module, and if the
        audit is bypassed for the diagnostic the permutation null shows the
        leak (permuted-label lift stays in band while the unpermuted planted
        model exceeds band on the canary). An audit that passes the planted
        leak is broken and no result from the run stands. Outputs of the
        diagnostic cell are never scored as evidence.
    - name: non_graph_tree_baseline
      construction: >-
        Gradient-boosted tree ensemble on exactly the features, splits,
        seeds and hyperparameter-selection protocol used by the GNN, with a
        matched wall-clock training budget per cell; frozen grid depth in
        {4, 6}, trees in {200, 500}, learning rate 0.05, selected on the
        validation split only.
      expected: >-
        GNN-minus-trees difference in excess lift within 2 sigma of the
        selection null on every arm and rung. A positive difference that
        replicates across >= 3 curves and >= 3 seeds and does not shrink
        with N is an instrument finding about g_theta, not about the curve.
    - name: inv6_theorem_arm_instrument_check
      construction: >-
        E/x-interval arm with regime F0 plus the 2-decomposability
        indicators of the 8 translates R - P_i (indicator computed by the
        label code path, supplied as a feature ONLY in this arm, and
        cost-disqualified by construction at 8 B lookups per target).
      expected: >-
        lambda >= 1.4 on the theorem slice at mu ~ 1 (theoretical value
        1 / Pr[c_D >= 1], about 1.5 to 1.6), every class and rung. Failure
        marks the E cells of that class and rung uninformative.
    - name: sigma_one_and_frozen_grammar_reproduction_slices
      construction: >-
        (i) sigma = 1 slice on every arm and rung; (ii) depth-1 tree on the
        Legendre feature and depth-k trees on the top-k bits of x, k in
        {1, 2, 3}, scored on the same count vectors as a direct
        implementation of c5c614's grammar members g1-g3 in a separate
        module (c5c614 is unrun, so reference values are computed in-run by
        the independent code path, never imported).
      expected: >-
        (i) rho = lambda = 1 to floating-point exactness and slice plus
        complement totals equal C(B+2, 3) with deviation exactly 0;
        (ii) equality to floating-point exactness. Any discrepancy halts the
        run as an implementation error and nothing is reported.
    - name: shuffled_seed_determinism_rerun
      construction: >-
        The cell (2^14, curve 1, base seed 201, all arms, both classes, F0)
        is re-run twice: once with every seed unchanged, once with only the
        node-shuffle seed changed (501 to 502).
      expected: >-
        Unchanged seeds give bit-identical metrics.json; the changed
        node-shuffle seed gives lambda and rho inside the bootstrap interval
        of the original cell, showing node order carries no information.
    - name: masked_forced_cluster_report
      construction: >-
        Targets r in D, masked from every trained and scored set, have their
        lift computed separately from the count vector on every arm.
      expected: >-
        Reported as the INV-2'' theorem (c_D(Q) >= B_eff for Q in D under the
        negation-closed convention), never as a discovery, and never merged
        into any scored cell.

  independent_variables:
    N_ladder:
      - 16384
      - 65536
      - 262144
      - 1048576
      - 16777216
    label_mode_by_rung:
      - exhaustive
      - exhaustive
      - exhaustive
      - exhaustive
      - certified_sample_163840
    sigma:
      - 0.125
      - 0.03125
    model_class:
      - gnn_inductive_message_passing_K3_width64
      - gradient_boosted_trees
    feature_regime:
      - F0
      - F1
    base_geometry_arm:
      - E_x_interval
      - E_random_matched
      - ZN_interval
      - ZN_random
      - E_log_interval_canary
    fixed:
      arity_m: 3
      base_size_rule: B_eff = ceil(ceil((6N)^{1/3}) / 2), nominal B = 2 B_eff
      convention: negation-closed base, unreduced size-3 multisets, targets in D masked
      split_by_target: 0.5 train / 0.1 validation / 0.4 held-out, independent seed
      translates_k: 8
      gnn_architecture: >-
        bipartite {base, relation, target} incidence graph on TRAINING
        targets only; K = 3 message-passing rounds; width 64; mean and sum
        aggregation; readout MLP on (features(R), pooled context); frozen
        grid learning rate in {1e-3, 3e-3}, up to 100 epochs with early
        stopping on the validation split; identical across arms
      feature_set_F0: >-
        x, y, low 4 bits of x and of y, Legendre symbols of x and of x + 1,
        the L(4 O) evaluation vector (1, x, y, x^2), x(R +- P_i) for k = 8
        base points fixed by the base seed; on Z/N arms the residue r stands
        in for x, y is absent, and translates are r +- d_i
      feature_set_F1: >-
        F0 plus base-summary features (16-bin histogram of x(D), the
        Legendre profile of D)
      holm_family_per_rung: >-
        all excess tests across 5 arms x 2 classes x 2 regimes x 2 sigma
        = 40 tests per rung

  metrics:
    primary:
      - >-
        lambda and rho of the top-sigma held-out slice per (arm, rung,
        curve, base seed, class, regime, sigma, training seed), computed
        exactly from the count vector and the slice membership, each with a
        1000-resample bootstrap 95 percent interval over held-out targets;
        training-set lift reported SEPARATELY and never as evidence.
      - >-
        Excess of lambda and of rho over the random-partition selection
        null per cell (median across the 27 replicates of a rung-arm cell,
        with the replicate spread), the Holm-corrected band, and the
        E-arm excess after subtracting the Z/N-random excess at matched
        class, regime, sigma and rung; reported both raw and in units of the
        rung's own band half-width.
      - >-
        Fitted slope of log(excess of rho, and of lambda, over the null)
        against log N on the E/x-interval arm over the rungs at which the
        excess is above band, per class, regime and sigma, by ordinary least
        squares with a bootstrap interval over the 27 replicates per rung;
        classified against the two pre-registered values -1/2 and 0 as
        contains -1/2 and excludes 0 / contains 0 and excludes -1/2 /
        contains both / not fittable because the excess is inside band at
        every rung.
      - >-
        GNN-minus-trees difference in excess lift per (arm, rung, regime,
        sigma) with its interval, and whether it shrinks with N.
    secondary:
      - >-
        Held-out AUC of the binary predictor c_D >= 1 per cell (reported,
        never a result).
      - >-
        Predictor evaluation cost c_f per target in point-addition
        equivalents (feature computation plus inference, converted by the
        in-process measured time of one point addition), the Theta(B) lookup
        cost per target, t_gen, and the Groebner solve time under its cap,
        as ratio distributions with inter-quartile ranges over >= 200
        targets per rung; derived admissible sigma floor and the ratio
        c_f / (B lookups).
      - >-
        Training cost per model (wall seconds, CPU seconds), peak RSS per
        job, graph size (relation nodes, edges) per cell.
      - >-
        Leak-audit outcomes: static audit verdict per feature module, the
        planted-leak diagnostic verdict, label-permutation lift per cell,
        canary lift per cell, shuffled-seed determinism verdict.
      - >-
        Reproduction fixtures: sigma = 1 values (required exactly 1),
        closed-form total residual per slice (required exactly 0),
        grammar-slice equality verdict.
      - >-
        Dispersion index Delta per arm and rung, the agreement statistic
        between the analytic and empirical null bands on the random arms,
        and the H2 autocovariance checks (maximum absolute autocovariance
        over lags against -M/N^2 with the finite-population correction).
      - >-
        Z/N-interval lift against the 1/sigma ceiling and the half-ceiling
        threshold per class, regime, rung and training seed (worst seed
        reported); theorem-arm lambda per class and rung.
      - >-
        Masked forced-cluster lift per arm and rung (theorem report).
      - >-
        Per-cell provenance: curve (p, a, b, N, P), base seed, training
        seed, split seed, node-shuffle seed, label source (EXP-RELN-f202be
        run ID and hash, or in-run enumeration), effective sizes, wall time.

  heuristic_under_test: H1
  preregistered_prediction:
    quantity: >-
      The excess over the random-partition selection null of the top-sigma
      held-out slice's rho and lambda on the E/x-interval arm, for every
      predictor in the frozen trained class, and its fitted log-log slope
      against N; the GNN-minus-trees difference; the Z/N-interval lift; the
      predictor cost ratio.
    formula: >-
      Under H1 the slice total is sigma C(B+2, 3) (1 + O(N^{-1/2+eps})), so
      excess(rho) = rho - rho_null ~ N^{-1/2+o(1)} and the fitted slope
      interval contains -1/2 and excludes 0 (or the excess is inside the
      band at every rung); GNN-minus-trees = 0 within band; Z/N-interval
      lambda = rho = 1/sigma at the ceiling with threshold 0.5/sigma;
      Z/N-random and E/random excess = 0 within band; c_f about 10 to 15
      point-addition equivalents against B lookups. The alternative the
      design discriminates is slope interval containing 0 and excluding
      -1/2 on E/x-interval with every control in band. Written before any
      run; adjustable only by a versioned protocol_amendment.
    source: >-
      IDEA-20260906-79ff48 sections (C), (D), predictions and
      heuristic_assumptions H1-H4, which reuse IDEA-20260830-c5c614's
      metrics, selection null and pre-registered exponents -1/2 and 0
      unchanged; the rigorous half is KN-FIND-007. Not an observed result.

  scale_relevance:
    tier: toy
    justification: >-
      N <= 2^20 with exhaustive labels and one certified sampled rung at
      2^24, m = 3, generated prime-order curves of 14 to 24 bits, B between
      48 and 466. A fitted exponent over five rungs is a toy-scale trend
      with a wide interval and is never quoted as an asymptotic rate; no
      transfer or extrapolation to cryptographic scale is claimed in any
      outcome, and closure is over the trained class, panel, regimes and
      range only.
    correspondence: null

  tail_checks:
    - >-
      The single largest excess across the 40-test panel at each rung
      against the max-of-40 order statistic of the selection null.
    - >-
      The worst training seed on the Z/N-interval positive control and on
      the theorem arm, per class and rung, against the thresholds.
    - >-
      The maximum absolute autocovariance of the count vector over all lags
      on the random arms against the Gaussian max-of-N envelope (H2).
    - >-
      The slowest observed c_f against the fastest observed Theta(B) lookup
      per rung (H3).
    - >-
      The dispersion index Delta of every arm against the Poisson value
      1 - 1/N, reported beside every lift.

  replication:
    seeds:
      curve_seeds: [101, 102, 103]
      base_seeds: [201, 202, 203]
      training_seeds: [301, 302, 303]
      split_seed: 401
      node_shuffle_seed: 501
      node_shuffle_seed_determinism_variant: 502
      selection_null_seed: 601
      label_permutation_seed: 701
      target_sample_seed_2_24: 801
      bootstrap_seed: 901
    independent_instances: >-
      Per rung: 3 generated curves (each Z/N arm run at that curve's N), 3
      base seeds per arm, 3 training seeds per model, giving 27 replicates
      per (arm, rung, class, regime, sigma) cell for the primary metrics;
      the label-permutation null uses training seed 301 only. 15 curves in
      total across the five rungs. The split is BY TARGET with the split
      seed, so no held-out target ever has an incident relation node in the
      training graph; targets in D are masked from every set; the
      2^24 rung's 163840-target sample is split 81920 / 16384 / 65536.
      Every seed is independent of every other and none is derived from the
      target-generation or enumeration order.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 172800
    total_cpu_hours: 400
    maximum_memory_gb: 16
    maximum_runs: 30
    maximum_workers: 4
  budget_interpretation: >-
    Advisory per docs/research-budget-policy.md: the wall-clock, CPU-hour
    and run-count figures are estimates for planning and reporting, not
    approval gates, and exceeding them is not a stop. A RUN is one (rung,
    curve) unit executing all arms, base seeds, classes, regimes and
    training seeds (15 runs), plus one Stage-5 cost run per rung (5), the
    planted-leak diagnostic (1), the determinism re-run (1), and reserve
    for failed_infrastructure re-runs in fresh run directories (8).
    maximum_memory_gb and maximum_workers are MACHINE PROTECTION: peak RSS
    is declared per job and a job exceeding 16 GB is killed and recorded as
    failed_infrastructure; maximum_workers = 4 is a placeholder sized to a
    conservative headroom assumption because this design session could not
    query the executing machine, must never exceed core count minus one,
    and is recorded in the approval lock and the manifest. The scientific
    sample counts (3 curves, 3 base seeds, 3 training seeds, 1000 null
    draws, 163840 sampled targets) are frozen and are not reducible under
    any budget.
  stage_budgets:
    - stage: stage0_freeze_and_static_audit
      wall_clock_seconds: 3600
    - stage: stage1_labels_and_certificates
      wall_clock_seconds: 14400
    - stage: stage2_graph_build_and_training
      wall_clock_seconds: 129600
    - stage: stage3_scoring_nulls_and_permutation_retrain
      wall_clock_seconds: 21600
    - stage: stage4_gates_and_slope_fit
      wall_clock_seconds: 1800
    - stage: stage5_cost_instrumentation
      wall_clock_seconds: 14400
    - stage: stage6_handoff_tables_and_report
      wall_clock_seconds: 1800

  stopping_rules:
    - >-
      Stop the run on any reproduction-fixture deviation (sigma = 1 not
      exactly 1, closed-form total residual nonzero, grammar-slice
      inequality); preserve every artifact produced; report nothing as
      evidence.
    - >-
      Stop the run on a label-permutation lift or a canary lift above band
      in any cell (LEAK); preserve artifacts; no cell of the run is readable
      until the leak is found and the run repeated in a fresh run directory.
    - >-
      Stop the run if the static audit passes the planted-leak diagnostic
      (the audit is broken).
    - >-
      Stop the run if E/random and Z/N-random disagree beyond band at any
      rung (pipeline fault).
    - >-
      Stop at a memory-cap kill or a process-watchdog expiry; record the
      partial cell set as failed_infrastructure; never score a partially
      trained model.
    - >-
      A Groebner solve attempt in Stage 5 exceeding its 120-second cap is
      recorded as a cap hit for timing purposes only; a cap hit is
      failed_infrastructure for that measurement and does not stop Stages
      1-4 or invalidate their outputs.
    - >-
      No hyperparameter, feature, architecture, sigma, seed, threshold or
      rung is added, removed or changed after the first cell runs except
      through a versioned protocol_amendment.

  invalidation_rules:
    - >-
      Any feature depends on a discrete logarithm, on the target-generation
      scalar, on the enumeration index, on node order or on any quantity
      the static audit forbids.
    - >-
      The label code path (enumeration, lookup, certificate check) shares an
      implementation with, or is importable from, the feature or model code
      path.
    - >-
      The Z/N-interval positive control is not recovered to at least half
      its ceiling by a model class at a rung: that class and rung are
      uninformative and no negative is reported from them (the run itself
      stands for the other cells).
    - >-
      The label-permutation null is above chance (above band) in any cell.
    - >-
      Hyperparameters were selected using held-out targets, or a held-out
      target has an incident relation node in the training graph.
    - >-
      The selection null was drawn at a density other than the reported
      slice's, or on a target set other than the masked held-out set.
    - >-
      Any claimed decomposition lacks a certificate that the wrapper
      re-verified, or the closed-form total check was skipped for a cell.
    - >-
      A timeout, out-of-memory kill, training divergence, solver crash or
      watchdog expiry is failed_infrastructure and is NEVER evidence for or
      against the hypothesis or any heuristic (AGENTS.md rule 3).
    - >-
      Observed cells, unexpected events, failed seeds, or costs are omitted
      or silently replaced; results are produced before frozen approval or
      detached from the approved specification hash.

  success_criterion: >-
    The experiment SUCCEEDS when, with all reproduction fixtures exact, the
    static audit rejecting the planted leak, every label-permutation and
    canary cell inside band, E/random agreeing with Z/N-random within band,
    and the Z/N-interval positive control at or above its half-ceiling
    threshold for at least one model class at every rung, the E/x-interval
    outcome is DECIDED for that class at both sigma by the primary metrics:
    EITHER (predicted branch) the lookup-subtracted excess of rho and of
    lambda is inside the Holm-corrected band at every rung, or its fitted
    slope interval contains -1/2 and excludes 0, for both regimes; OR
    (refuting branch) the slope interval contains 0 and excludes -1/2,
    replicated across the 3 curves and 3 training seeds at that rung set.
    Both branches are complete, reportable results; the predicted branch is
    the null outcome of H-RELN-10ad6b and is not a failure. The
    GNN-minus-trees difference and the c_f ratio are reported in either
    branch. This is a candidate toy-scale measurement requiring independent
    review and a Coordinator decision before any status change.
  falsification_criterion: >-
    H-RELN-10ad6b is FALSIFIED at toy scale over the trained class when the
    refuting branch above holds: the fitted slope interval of the
    lookup-subtracted E/x-interval excess contains 0 and excludes -1/2 for
    a model class and sigma, replicated across >= 3 curves and >= 3
    training seeds, with every control cell in band. That outcome is a
    replicated, control-matched existence witness for
    representation-decidable structure in c_D and its only permitted use is
    as input to EXP-RELN-141a86 and to a proof attempt; it is not an
    algorithm or an ECDLP claim. A slope interval containing both -1/2 and
    0 is underpowered and INCONCLUSIVE, reported with the number of
    additional rungs computed. An uninformative class (positive control
    below threshold), a leak halt, a pipeline fault, or any
    failed_infrastructure event is inconclusive and is never evidence
    against the hypothesis or any heuristic.

  decision_paths:
    positive: >-
      Predicted branch (decay or inside band, controls in band): Coordinator
      snapshot-archives the run, dispatches independent validation (blind
      re-derivation of lambda and rho on one cell) and red team, then a
      review-evidence decision may move H-RELN-10ad6b toward supported at
      toy scale over the trained class, records the measured exponent and
      band as an obstruction with a number, and issues forward guidance (a
      wider class, another feature regime, or m = 4 in a successor record).
      No ECDLP claim; no closure of RQ-RELN-61638a by this record alone.
    negative: >-
      Refuting branch (alive): Coordinator snapshot-archives the run and the
      three handoff tables, dispatches validation and red team with the
      leak audit and selection-null design as the named attack surfaces,
      and only after independent review issues a decision recording the
      existence witness, hands the tables to EXP-RELN-141a86 /
      IDEA-20260906-1f6bfe, and schedules a proof attempt against INV-4c
      plus a replication on fresh curves. Hypothesis status moves only by a
      committed decision; a single unreplicated run never moves it.
    inconclusive: >-
      Uninformative class, leak halt, pipeline fault, underpowered slope or
      failed_infrastructure: preserve immutable partial artifacts, name the
      failed gate or missing rung concretely, and re-dispatch as a fresh run
      directory or a versioned amendment; retain the hypothesis at its
      current status and RQ-RELN-61638a active.

