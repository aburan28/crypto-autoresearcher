experiment:
  id: EXP-EQLA-1d5636
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-add964
  question_id: RQ-EQLA-0d3f40
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE SIGN COCYCLE: an x-coordinate factor base only determines its points up to negation,
    so the phi-action on relation rows is a SIGNED permutation, and its sign class is a 1-cocycle
    - trivialisable for j=0 because H^1(C_3, {+-1}) vanishes, but FORCED to -1 around every orbit
    for j=1728 because phi^2 = [-1] - which means the plain 0/1 permutation operator the committed
    harness uses is right for one CM discriminant, wrong for the other, and the rows it builds drop
    the sign information entirely in both'
  status: draft
  objective: "(A) THE OBJECT EVERY x-COORDINATE FACTOR BASE ACTUALLY HAS. A factor base given by x-coordinates\
    \ x_1, ..., x_B determines each point only up to negation: lift_x(x_i) returns one of the two\
    \ points (x_i, +-y_i). Fix a lift P_i for each i. Let phi_x be the induced map on x-coordinates\
    \ and sigma the index permutation with x_{sigma(i)} = phi_x(x_i). Then phi(P_i) has x-coordinate\
    \ x_{sigma(i)}, so\n  phi(P_i) = epsilon_i * P_{sigma(i)},   epsilon_i in {+1, -1},\nand the equivariance\
    \ operator on relation rows is the SIGNED permutation Sigma with entries epsilon_i, not the 0/1\
    \ permutation matrix. The family (epsilon_i) is a 1-cochain and its class under re-choosing lifts\
    \ (epsilon_i -> epsilon_i * delta_{sigma(i)} / delta_i for signs delta) is a cohomology class\
    \ in H^1(C_g, {+-1}).\n(B) THE DICHOTOMY, WHICH IS EXACT AND DECIDES THE INSTRUMENT.\n  j = 0\
    \ (D_0 = -3), phi(x, y) = (zeta x, y), g = 3 on x-coordinates.\n    H^1(C_3, Z/2) = 0 because\
    \ gcd(3, 2) = 1, so EVERY sign cochain is a\n    coboundary: lifts can always be re-chosen to\
    \ make all epsilon_i = +1.\n    Constructively, and this is the whole fix: pick one lift per orbit\
    \ and\n    DEFINE the other two as phi(P) and phi^2(P). Consistency needs\n    phi^3 = 1, which\
    \ holds. Note the natural shortcut - phi preserves y, so\n    \"same y\" is exactly that convention.\
    \ The unsigned operator is therefore\n    CORRECT for j = 0, provided the lifts are chosen along\
    \ orbits.\n  j = 1728 (D_0 = -4), phi(x, y) = (-x, i y) with i^2 = -1, g = 2 on\n    x-coordinates,\
    \ and phi^2 = [-1] on points. Then for any choice of lifts,\n      phi^2(P_i) = epsilon_i epsilon_{sigma(i)}\
    \ P_i  and  phi^2(P_i) = -P_i,\n    so epsilon_i * epsilon_{sigma(i)} = -1 ALWAYS. The product\
    \ around every\n    orbit is -1; the class is the nontrivial element of H^1(C_2, Z/2) = Z/2\n\
    \    and CANNOT be trivialised by any lift choice. The correct operator\n    satisfies Sigma^2\
    \ = -I, not Sigma^2 = +I: it is a complex structure, not\n    an involution.\nCONSEQUENCE FOR\
    \ EVERY MEASUREMENT IN THE LANE'S HISTORY: the committed instrument builds Z as a 0/1 permutation\
    \ with Z[base][base+1] = 1 and cyclically (harness/endomorphism_la.py, the phi branch of `_measure_displacement_rank`).\
    \ That is the g = 3 unsigned operator. On a j = 1728 curve it is the WRONG operator - it commutes\
    \ with nothing the curve provides - and any structure statistic measured with it there is measuring\
    \ the wrong group.\n(C) THE SECOND, INDEPENDENT SIGN PROBLEM, WHICH AFFECTS j = 0 TOO. The relation\
    \ itself carries signs. A Semaev decomposition asserts that there EXIST signs with (+-)P_{i_1}\
    \ + ... + (+-)P_{i_m} + (+-)R = O; the summation polynomial vanishes for the x-coordinates and\
    \ the signs must be recovered separately. So a relation ROW over an x-coordinate factor base has\
    \ entries in {+1, -1}, not in {0, 1}. EV-STR-003 O-9 records that the committed harness builds\
    \ \"bare 0/1 incidence vectors\" and that no linear system with a right-hand side was ever assembled.\
    \ An unsigned row is not a linear equation about logarithms; it is an incidence indicator. Every\
    \ rank, displacement rank and deficiency in the lane's history was computed on incidence indicators.\
    \ That does not make those numbers wrong as measurements of what they measured; it means they\
    \ are not measurements of the linear system, and this record supplies the object that is.\n(D)\
    \ THE MEASURABLE PREDICTIONS, WHICH ARE SHARP AND CHEAP.\n  P-1. On j = 0 with lifts chosen by\
    \ an ARBITRARY convention (whatever\n    lift_x returns), the measured sign cochain has epsilon_i\
    \ = -1 on about\n    half of all indices. With lifts chosen ALONG ORBITS, it is +1\n    identically.\
    \ The difference is a single line of factor-base construction\n    and it is currently absent.\n\
    \  P-2. On j = 1728, no lift convention makes the cochain trivial: the\n    product around every\
    \ orbit is exactly -1, at 100% of orbits, at every\n    instance. A measured product of +1 at\
    \ any orbit falsifies (B) or\n    indicates phi was implemented as something other than (-x, i\
    \ y).\n  P-3. Using the unsigned operator where the signed one is correct changes\n    the measured\
    \ structure statistic. Quantitatively: for a genuinely\n    Sigma-equivariant matrix with Sigma^2\
    \ = -I, measuring displacement rank\n    against the unsigned Z gives a value near its generic\
    \ maximum, while\n    measuring against the signed Sigma gives a value near 0. The gap is the\n\
    \    full range of the statistic, which makes this the largest single\n    instrument effect available\
    \ in the lane and the cheapest to check.\n  P-4. Folding signed rows and unsigned rows gives DIFFERENT\
    \ informative\n    ranks. Predicted: the unsigned fold destroys the exact cancellation\n    1\
    \ + lambda + lambda^2 = 0 that produces the free relations of\n    IDEA-20260807-61049d wherever\
    \ a sign is wrong, so the measured\n    free-relation count on an arbitrarily-lifted base is about\
    \ (1/2)^{g-1} of\n    B/g rather than B/g - a factor 4 at g = 3 - and that discrepancy is a\n\
    \    direct, quantitative detector of lift inconsistency.\n\n(E) WHY THIS IS NOT A BUG REPORT.\
    \ It is a statement about which OBJECT the lane should be tracking. The Z[phi]-module structure\
    \ of a relation matrix is a module over Z[zeta_3] or Z[i], and those rings act on POINTS, not\
    \ on x-coordinates; the passage to x-coordinates is a quotient by {+-1} and the module structure\
    \ descends only up to that quotient, which is precisely what the cocycle measures. Getting the\
    \ operator right is a precondition for every other proposal in this lane, and getting it wrong\
    \ is a way to measure zero where there is structure and to measure structure where there is none."
  resource_label: 'R1 + R3. R1: the whole question is about x-coordinates as field elements and the
    two-to-one map from points to x-coordinates. R3: the sign is forced by the relation phi^2 = [-1]
    in End(E), which is a ring fact about the CM order (Z[i] has an element of order 4; Z[zeta_3]
    has one of order 3 and the difference in parity is the entire content of the dichotomy).'
  admissibility: admissible
  admissibility_argument: 'Admissible, and it is one of the few places in the lane where the resource
    is doing unambiguous work that a generic algorithm cannot do. The sign cocycle is computed from
    the CURVE EQUATION and the explicit formula for phi - it asks whether lift_x(zeta x) has the same
    y as lift_x(x), which is a field comparison, not a group operation. A generic algorithm holding
    opaque encodings would need a group operation per element to learn the same bit. The saving is
    one field comparison against one group operation per factor-base element: real, non-generic, and
    a constant factor on a preprocessing step. No exponent is claimed and none could come from here.'
  reachability_gate: 'T5''s isogeny-walk form does not apply: one curve at a time, no movement. T4
    binds and gives this record its sharpest scope statement, because the dichotomy is EXACTLY a statement
    about which isogeny class one is in: D_0 = -3 gives a trivialisable cocycle, D_0 = -4 gives a
    forced one, and D_0 anything else gives no cocycle at all because |Aut| = 2 and the x-action is
    trivial. None of these can be reached from another by any isogeny walk at any cost - the CM discriminant
    is a class invariant. So the record''s content is a partition of the prime-field curve universe
    into three permanently separated regimes, and a generic curve is in the third, where the lane
    is empty. Within the first two the good object is free: computing the cocycle costs one field
    comparison per factor-base element. SCOPE NOTE, not an attack claim: secp256k1 has a = 0 and is
    in the first regime.'
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE): archive the derivation of (A) and (B). STAGE 1
      (seconds, HARD GATE): verify phi^3 = identity on j = 0 and phi^2 = negation on j = 1728, on
      random points. STAGE 2 (seconds): measure the cocycle on arbitrarily-lifted bases, both discriminants.
      THIS IS THE WHOLE DECISIVE MEASUREMENT and it needs no relations, no ranks and no decomposition
      search. It is the single cheapest test in the entire L5 set. STAGE 3 (seconds): construct orbit-consistent
      lifts for j = 0, confirm all +1; attempt for j = 1728, confirm impossible. STAGE 4 (minutes):
      both operators against both lift conventions, all structure statistics, both discriminants.
      STAGE 5 (minutes): the frozen EXP-STR-003 arm-A reproduction check. STAGE 6 (hours): signed
      rows end to end, and the j = 1728 arm. STAGE 7 (minutes): NULL 1 planted class, NULL 2 random
      cochain, and the f-sweep decay test. STAGES 0-3 cost under a minute of compute and already settle
      the dichotomy; everything after is consequence management.'
    mechanism: 'STEP 1 (zero compute, derivation, archived first). Write out (A) and (B): the definition
      of the cochain, the coboundary action, the vanishing of H^1(C_3, Z/2), and the forced -1 for
      j = 1728 from phi^2 = [-1]. Four paragraphs, no compute.

      STEP 2 (seconds, the decisive measurement, and it needs no relations at all). For each toy instance:
      build the x-coordinate factor base by the committed rule; lift each x with the committed lift_x;
      compute epsilon_i by testing whether phi(P_i) equals P_{sigma(i)} or its negation. Report the
      fraction of epsilon_i = -1 and the product around every orbit. PREDICTED: about 1/2 negative
      on an arbitrarily-lifted j = 0 base, and product +1 around every orbit; about 1/2 negative on
      j = 1728 and product -1 around every orbit, at 100% of orbits. This measurement is a few lines
      of code, needs no decomposition search, and settles (B) outright.

      STEP 3 (seconds). Implement the orbit-consistent lift for j = 0: choose one lift per orbit and
      DEFINE the others as phi and phi^2 of it. Re-measure: predicted all epsilon_i = +1. Then attempt
      the same for j = 1728 and confirm it is impossible - the second element''s sign is forced opposite
      whatever the first is chosen to be. This is the constructive half of the cohomology statement
      and it is verified rather than asserted.

      STEP 4. Build BOTH operators and compare every structure statistic under each: the unsigned
      0/1 permutation Z (the committed one) and the signed Sigma. On j = 0 with orbit-consistent lifts
      they coincide, which is a consistency check. On j = 1728 they differ, and the prediction P-3
      says the difference is the full range of the statistic.

      STEP 5. Signed rows. Modify the decomposition recorder to store the RESOLVED SIGNS of each summand
      and the right-hand side, so that a relation row is a genuine linear equation. Recompute the
      folded matrix, the informative rank and the free-relation count with signed rows and with the
      committed unsigned rows, and report both. Prediction P-4 gives the expected discrepancy in the
      free-relation count, which is the cheapest detector of the problem.

      STEP 6. The j = 1728 arm end to end. Everything the lane has done for D_0 = -3 with g = 3, done
      for D_0 = -4 with g = 2 and the signed operator: orbit-closed base, signed rows, fold with lambda
      satisfying lambda^2 = -1, informative rank, block split into 2. This is the first time the lane
      would have a second CM discriminant, and it is the natural replication that distinguishes a
      mechanism from a coincidence.

      STEP 7. The null: the entire STEP 4 comparison on synthetic matrices with a PLANTED signed structure
      of declared class, from the generator of IDEA-20260807-1e673d extended with a sign parameter.
      The instrument must recover the planted class exactly.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - NULL 1 - synthetic matrices with planted sign class, must be recovered
  - NULL 2 - random sign cochain, giving the false-positive rate at even g
  - f-sweep over the fraction of orbit-consistent lifts, as the decay test on j = 0, with the explicit
    prediction that no decay occurs on j = 1728
  - generic-j curve (|Aut| = 2), where the cocycle must be vacuous
  - frozen EXP-STR-003 arm-A cells, which must reproduce exactly under the signed operator with orbit-consistent
    lifts
  - matched Pollard rho with negation and BSGS in group operations for the Pareto row, even though
    nothing is attacked
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. NULL 1 - MATCHED SYNTHETIC WITH PLANTED
    SIGN CLASS: matrices of identical shape, density and column-orbit partition, made equivariant
    under a signed permutation whose class is DECLARED (trivial or nontrivial). The instrument must
    recover the declared class at 100% of instances. This is the planted-positive requirement and
    it is what makes a measured class meaningful. NULL 2 - RANDOM SIGN COCHAIN: assign epsilon_i uniformly
    at random, unrelated to any curve. On an odd-order orbit its class must still be trivial (H^1
    vanishes), so the instrument must report "trivialisable" - and then the constructive trivialisation
    must actually succeed. On an even-order orbit a random cochain is nontrivial with probability
    1/2, which is the measured false-positive rate for "the curve forces the sign" and must be reported
    alongside any j = 1728 conclusion. DECAY PARAMETER: the fraction f of factor-base elements whose
    lift is chosen orbit-consistently, swept from 0 to 1. On j = 0 the count of epsilon_i = -1 must
    fall linearly from about B/2 at f = 0 to exactly 0 at f = 1; the free-relation count must rise
    from about (1/2)^{g-1} B/g to exactly B/g over the same sweep; and every statistic measured with
    the unsigned operator must converge to its signed value. A statistic that does not move as f goes
    from 0 to 1 is insensitive to the lift convention and cannot be affected by the sign, which is
    itself a useful negative and must be reported. ON j = 1728 THE DECAY MUST NOT HAPPEN: the orbit
    products must stay at -1 for every f. That asymmetry between the two discriminants, measured on
    the same pipeline, is the record''s central control.'
  independent_variables: []
  metrics:
    primary:
    - epsilon_i per index, per instance, per lift convention
    - orbit product of epsilon, per orbit, both discriminants
    - fraction of epsilon = -1, against the binomial(B, 1/2) prediction
    - all structure statistics under both operators and both conventions
    secondary:
    - free-relation count under both conventions
    - informative rank from signed rows and from unsigned rows, same harvest
    - planted-class recovery rate
    - f-sweep curves for every affected statistic
    - excluded fixed points, counted and recorded
    - EXP-STR-003 arm-A reproduction result, exact integers
  heuristic_under_test: null
  preregistered_prediction:
    quantity: fraction of epsilon_i = -1 on an arbitrarily-lifted j = 0 base
    formula: Near 1/2, within binomial noise for B trials. Near 0 would mean lift_x already respects
      phi (which would be worth knowing and would explain why the lane's j = 0 numbers behaved); near
      1 would mean it anti-respects it.
    source: pre-registered in IDEA-20260807-add964 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - lift_x MAY ALREADY BE CONSISTENT. If the harness's lift_x picks y by a rule that happens to commute
    with x -> zeta x (for instance because zeta x and x have square roots chosen by the same deterministic
    square-root algorithm with no dependence on x's representative), then all signs are already +1
    and the j = 0 half of this record is vacuous. That is a benign outcome and STAGE 2 detects it
    in seconds; it must be checked before any claim that committed numbers are affected.
  - 2-TORSION AND 3-TORSION FIXED POINTS. x = 0 is fixed by both actions. For j = 1728 the point (0,
    0) is 2-torsion and equals its own negative, so the sign is undefined there. Excluded and recorded.
  - SIGNS IN THE RELATION VERSUS SIGNS IN THE OPERATOR are two different problems (sections (B) and
    (C)) and they interact. A test that changes both at once cannot attribute the effect; STAGE 4
    and STAGE 6 vary them separately for exactly this reason.
  - j = 1728 CURVES HAVE 4 AUTOMORPHISMS BUT ONLY 2 ORBIT ELEMENTS ON x. The quotient by negation
    is already spent, so g = 2 on x-coordinates and the maximum block split is 2, not 4. Any accounting
    that uses |Aut| = 4 as the block count is wrong by a factor 2 and would inflate the claimed saving.
  - p = 1 mod 4 IS REQUIRED for i to exist in F_p, and 4 | N - 1 for lambda to exist mod N. Instances
    failing either are skipped and the skip recorded, or the j = 1728 arm silently loses power.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Near 1/2, within binomial noise for B trials. Near 0 would mean lift_x already
    respects phi (which would be worth knowing and would explain why the lane's j = 0 numbers behaved);
    near 1 would mean it anti-respects it.
  falsification_criterion:
  - Any j = 0 orbit has epsilon product -1. phi^3 = 1 fails as implemented; halt, because it invalidates
    the curve arithmetic used by the whole lane.
  - Any j = 1728 orbit has epsilon product +1. phi^2 = [-1] fails as implemented, or phi was built
    as something other than (-x, i y); halt and reconcile.
  - The orbit-consistent lift construction fails to make all j = 0 signs +1. The trivialisation argument
    is wrong or the construction is misimplemented; the record is superseded rather than amended.
  - The planted sign class is not recovered. The instrument cannot see the object and every class
    it reports is void.
  - The EXP-STR-003 arm-A cells do not reproduce under the signed operator with orbit-consistent lifts.
    Either the committed lifts were already orbit-consistent - which is checkable and would be a benign
    explanation - or the new operator is wrong. Until reconciled, no comparison with committed numbers
    is permitted.
  - 'Every structure statistic is insensitive to the lift convention on j = 0 (flat f-sweep). Then
    the signs do not matter for those statistics, which is a legitimate and useful negative: it would
    mean the lane''s committed j = 0 numbers are unaffected, and the record''s scope narrows to j
    = 1728.'
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
