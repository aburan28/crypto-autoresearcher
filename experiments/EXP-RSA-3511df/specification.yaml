experiment:
  id: EXP-RSA-3511df
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-RSA-68884a
  question_id: RQ-RSA-afe33c
  goal_id: GOAL-RSA-001
  batch_id: null
  batch_id_note: >-
    GOAL-RSA-001 is `draft` with current_batch_id null and has never been
    dispatched. A batch id is assigned by the Coordinator at dispatch, not by
    the proposing session.
  title: >-
    Zero-compute wiring-exponent gate for the NFS cost baseline: eight exact
    rational identities, a null object with no shared memory, a BSGS positive
    control that must fire, and a six-point graded theta ladder - run before
    any record figure is read and before any concrete cost table is built

  objective: >-
    Decide, at zero compute and before any expensive branch of GOAL-RSA-001 is
    opened, whether the one-parameter charging family of H-RSA-68884a stands.
    The gate is eight exact rational identities. It reproduces the classical
    GNFS optimum at theta = 0, reproduces this program's own established
    full-cost result for baby-step giant-step at theta = 1/3 as a positive
    control, requires a matched null with no shared memory to show no
    theta-dependence, and compares the theta = 1/2 endpoint against the only
    area-time figure this corpus holds. A failure at any gate is a RESULT that
    closes the campaign's most expensive branch before an extrapolation is
    built on an unvalidated model, which is exactly what GOAL-RSA-001's
    next_action asks the first gate to do.

  what_this_is_not:
    - Not a factorization, not a factoring record, not an attempt at one, and not a step toward one.
    - Not an attack on RSA and not a statement about the security of any deployed RSA key, of any key size, under any threat model.
    - Not a claim that any published record computation, announcement or paper is wrong.
    - Not an improvement to the number field sieve, to sieving, to filtering, to linear algebra, or to any stage of any factoring algorithm.
    - Not a claim that any exponent of the FACTORING PROBLEM moves. The exponent under discussion is an accounting exponent of a cost model.
    - Not a concrete cost statement at RSA-1024, RSA-2048, RSA-3072 or any other modulus size, and not authorization to build one. GOAL-RSA-001's next_action gates that table behind the record-reproduction result, which this contract does not supply.
    - Not a statement about batch NFS, special NFS, the discrete-logarithm descent stage, or any many-key amortized regime.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has happened.
    - Not a validation of HEUR-NFS-1, which every published NFS exponent including the classical one already assumes and which this contract does not test.

  claim_ceiling: >-
    TIER: medium, and the exact scope a passing run could support is: a
    closed-form family of HEURISTIC ASYMPTOTIC full-cost exponents for
    single-key GNFS, conditional on HEUR-NFS-1, HEUR-NFS-2 and HEUR-NFS-3,
    verified by exact rational identity at six values of theta, with two
    endpoints agreeing with independently stated figures (one classical, one
    relayed and unread). It could support the sentence "under the
    three-dimensional wiring convention this program has declared, single-key
    GNFS has heuristic full-cost exponent (2401/324)^(1/3) with optimal
    smoothness exponent (7/12)^(1/3)". It could NOT support any sentence about
    a concrete modulus, any sentence about a deployed key, any sentence about
    how much any real machine costs, any sentence identifying which theta
    describes reality, or any sentence about batch NFS. The tier is `medium`
    rather than `crypto` because the o(1) is uncontrolled at every finite size
    and because no record measurement is consumed by the gated stages; it is
    not `toy` because the objects are the asymptotics of a real algorithm at
    real parameterizations rather than a scaled-down instance.

  inputs:
    randomness: >-
      NONE. This contract has no random component, no seeds, and no sampling.
      The seed derivation rule required of stochastic contracts is therefore
      replaced by an EXACTNESS RULE, stated below, which serves the same
      purpose - a third party reproduces every number bit-for-bit.
    exactness_rule: >-
      Every gated quantity is computed as a Python fractions.Fraction and
      compared for exact equality against a Fraction literal. No floating-point
      value appears in any pass/fail decision. Decimals may be REPORTED, to six
      places, computed as float(Fraction)**(1/3) for cube roots only, and are
      never compared. Any gate that cannot be expressed as a rational equality
      is not a gate in this contract.
    theta_ladder: ['0', '1/6', '1/4', '1/3', '5/12', '1/2']
    theta_treatment: '1/3'
    theta_treatment_source: >-
      FIXED A PRIORI, BEFORE ANY EVALUATION, by this program's own declared
      full-cost convention in KN-TECH-035 and KN-TECH-057 (three-dimensional
      wiring, shared table of S entries imposes clock cycle S^(1/3)). theta is
      NOT fitted to anything and no procedure in this contract may select it
      from data.
    theta_endpoints_pinned: ['0', '1/2']
    theta_diagnostic_extra: '1'
    closed_forms_under_test:
      delta_cubed: '12 (1 + theta) / (2 + theta)^2'
      beta_cubed: '4 (2 + theta) / (9 (1 + theta)^2)'
      c_cubed: '4 (2 + theta)^4 / (9 (1 + theta)^2)'
      relation_identity: 'c(theta) = (2 + theta) beta(theta) = alpha(theta)'
    control_objects:
      null_object: >-
        NFS variant identical in every respect except that the linear-algebra
        stage holds O(1) shared state, i.e. S = L[o(1)] rather than L[beta].
      positive_control: >-
        Shanks baby-step giant-step in a group of order n: step count n^(1/2),
        shared table of n^(1/2) entries, charged as (table size)^theta.
      coherence_check: >-
        van Oorschot-Wiener parallel collision search, per-processor storage
        O(1), which KN-TECH-057 records as keeping its exponent under full
        cost. Reported as a COHERENCE CHECK on the charging rule and NOT as an
        independent control, because it is structurally the same statement as
        the null object; counting it twice would overstate the evidence.
    comparison_targets_not_authorities:
      classical_gnfs_exponent: '(64/9)^(1/3) = 1.922999, and (8/9)^(1/3) = 0.961500 for the smoothness bound'
      relayed_area_time_single_key: >-
        'L^1.976...+o(1)', quoted from knowledge/literature/KN-LIT-2663.md.
        THAT ENTRY IS NOT READ: it is a 2026-07-24 bulk-seeded record with null
        year, null venue and all four identifier fields null, whose own "Not
        verified here" section states claims are relayed from the abstract
        without independent verification, and whose "Relevance to this program"
        paragraph is about MOV/Frey-Ruck and GLV/GLS and plainly belongs to a
        different paper. It is a comparison target and never an authority.
      wiener_bsgs_full_cost: >-
        'n^(2/3+o(1))', quoted from knowledge/techniques/KN-TECH-035.md, which
        is in-corpus and READ. KN-LIT-094, the primary source KN-TECH-035
        cites, WAS NOT READ and nothing is attributed to it directly.
    record_figures_used_only_in_ungated_stage_3:
      status: UNVERIFIED SEARCH-EXCERPT MATERIAL, NOT USED IN ANY GATE
      source: >-
        The provenance block of ledger/questions/RQ-RSA-afe33c.yaml, which
        declares its own figures unverified and to be re-read from primary
        text.
      figures: >-
        RSA-250 at 829 bits, roughly 2700 core-years total, 130 / 2450 / 250
        core-years for polynomial selection / sieving / linear algebra on Intel
        Xeon Gold 6130 at 2.1 GHz, 8.7G raw and 6.1G unique relations, 405M
        rows at density 252 after merge; RSA-240 at 795 bits; a 795-bit
        prime-field discrete logarithm. The quoted phase figures SUM TO 2830,
        NOT 2700, and that discrepancy is a Stage-3 reporting item, not a gate.

  stage_order_and_which_stage_can_terminate:
    principle: >-
      Cheapest decisive gate first. Stages 1 and 2 require no network, no
      third-party library, no solver and no seeds, and either can end the whole
      line. Stage 3 is reporting only and is explicitly NOT gated, because
      RQ-RSA-afe33c's constraints forbid designing on unverified figures and
      because the ANGLE-BRIEF records an unresolved disagreement between two
      scouts about whether this container has numpy, sympy or Sage at all.
    stage_1:
      name: Independent symbolic re-derivation
      cost: under 30 minutes, zero compute
      terminates_run: YES
      content: >-
        Re-derive Steps 1 through 5 of H-RSA-68884a's mechanism from the
        parameterization, WITHOUT evaluating the closed forms, and obtain
        delta(theta), beta(theta), c(theta) independently. Then evaluate gates
        G1, G2, G7 and G8. Any failure terminates.
    stage_2:
      name: Controls first, then ladder, then treatment
      cost: seconds, exact rational arithmetic in a bare interpreter
      terminates_run: YES
      content: >-
        In this order and no other: (a) evaluate the NULL object across the
        whole ladder and commit the result; (b) evaluate the BSGS POSITIVE
        CONTROL at theta = 0 and theta = 1/3 and commit the result; (c) commit
        a hash of (a) and (b); (d) only then evaluate the treatment ladder and
        gates G3, G4, G5, G6.
    stage_3:
      name: Reporting and the charging-convention statement
      cost: writing
      terminates_run: NO
      content: >-
        Write the charging-convention statement (which theta this program
        declares for factoring, with the alternative and its cost recorded),
        the record-figure discrepancy note, and the forward guidance. This
        stage consumes no gate and asserts no record figure as verified.

  arms_and_controls:
    treatment: >-
      The charged NFS family at theta = 1/3, evaluated ONLY after the null and
      positive-control values are computed and hash-committed.
    measured_null: >-
      NULL OBJECT OF THE SAME SHAPE, FORCED VALUE DERIVED BEFORE ANY
      EVALUATION, AND IT CAN ACTUALLY FAIL. An NFS variant whose linear-algebra
      stage holds O(1) shared state (a hypothetical streamed-matrix Wiedemann
      that regenerates each row from its relation on the fly) has S = L[o(1)],
      so S^theta = L[o(1)] and the optimization must return
      c = (64/9)^(1/3) and beta = (8/9)^(1/3) FOR EVERY theta on the ladder,
      i.e. zero theta-dependence and zero comparator spread. THE FAILURE MODE
      THIS NULL DETECTS: if the optimization leaks a theta-dependence into a
      stage that stores nothing, the set-up is wrong and every treatment number
      is uninterpretable. This is not a decorative arm - the arithmetic
      genuinely can return a theta-dependent value if the balance condition is
      mis-stated.
    positive_control: >-
      NEARBY OBJECT WHERE THE EFFECT MUST APPEAR, WITH AN INDEPENDENTLY STATED
      ANSWER. Shanks baby-step giant-step under the identical S^theta rule:
      step count n^(1/2), table n^(1/2), so full cost n^(1/2 + theta/2), which
      is n^(1/2) at theta = 0 and EXACTLY n^(2/3) at theta = 1/3. KN-TECH-035
      states n^(2/3+o(1)) independently, attributing it to Wiener. IF THE
      MACHINERY DOES NOT RETURN n^(2/3), THE INSTRUMENT IS BROKEN AND NO
      NEGATIVE ABOUT NFS MAY BE REPORTED AT ALL - the reportable finding is the
      broken instrument.
    second_comparison_arm: >-
      The theta = 1/2 endpoint against KN-LIT-2663's relayed single-key
      area-time figure. Unlike the BSGS control this arm can fail for two
      distinct reasons - a wrong derivation or a wrong transcription in a
      demonstrably corrupted bulk-seeded entry - and BOTH must be reported. The
      contract forbids resolving the ambiguity without primary text.
    graded_control: >-
      SIX POINTS, FOUR INTERIOR, MONOTONICITY REPORTED. theta in {0, 1/6, 1/4,
      1/3, 5/12, 1/2}. c must be strictly increasing and beta strictly
      decreasing, with the exact cubes pre-declared in metrics. A break in
      monotonicity localizes the error to one theta interval instead of leaving
      "the closed form did not work". theta = 1 is additionally evaluated as an
      extreme diagnostic (c^3 = 9) and is reported outside the gate.
    ordering_control: >-
      The null arm and the positive-control arm are evaluated, written to disk,
      and SHA-256 committed BEFORE the treatment ladder is evaluated or looked
      at. Absence of that commitment invalidates the package. The frozen
      decision rule is additionally executed on the NULL first: if it emits the
      same verdict on the null as on the treatment, the rule discriminates
      nothing and must be rewritten before the treatment arm is read.
    comparability_policy: >-
      No comparison to any other experiment, corpus record, or record
      computation is authorized by this contract beyond the two named
      comparison targets. In particular, comparing c(theta) against
      KN-LIT-2663's BATCH figure L^1.704 per key is FORBIDDEN: it is a
      different regime (many keys, early-abort ECM) and the family does not
      cover it. Comparing c(theta) against any concrete core-year figure is
      FORBIDDEN: an L-notation exponent with uncontrolled o(1) does not
      determine a cost at any finite size.

  independent_variables:
    - theta, the exponent with which shared linear-algebra memory is charged, on the declared six-point rational ladder
    - object identity (charged NFS treatment / null NFS with O(1) shared state / BSGS positive control)

  metrics:
    primary:
      - >-
        G1. c(0)^3 from an INDEPENDENT re-derivation (not from evaluating the
        closed form). Required value EXACTLY 64/9.
      - >-
        G2. beta(0)^3 and delta(0)^3 from the same re-derivation. Required
        values EXACTLY 8/9 and EXACTLY 3.
      - >-
        G3. c(1/2)^3. Required value EXACTLY 625/81 (decimal 1.976052), to be
        compared against the relayed 1.976...+o(1).
      - >-
        G4. POSITIVE CONTROL. BSGS full-cost exponent at theta = 0 and
        theta = 1/3. Required values EXACTLY 1/2 and EXACTLY 2/3.
      - >-
        G5. NULL. c and beta of the O(1)-shared-state variant at all six ladder
        points. Required values EXACTLY (64/9)^(1/3) and (8/9)^(1/3) at every
        point, i.e. exactly zero spread across theta.
      - >-
        G6. GRADED LADDER. c^3 required EXACTLY 64/9, 28561/3969, 729/100,
        2401/324, 707281/93636, 625/81; beta^3 required EXACTLY 8/9, 104/147,
        16/25, 7/12, 464/867, 40/81; c strictly increasing, beta strictly
        decreasing.
      - >-
        G7. Symbolic demonstration that the smoothness factor of HEUR-NFS-1
        enters Step 2 identically for every theta, so that the difference
        c(theta) - c(0) does not depend on it.
      - >-
        G8. The residual of the Step-5 quadratic after substituting the
        stationary delta and the resulting beta. Required value EXACTLY 0 as a
        rational, identically in theta.
    secondary:
      - >-
        c(1/3)^3 = 2401/324 and beta(1/3)^3 = 7/12, the treatment values, which
        are PREDICTIONS of the family and have no external comparison target in
        this corpus.
      - >-
        The symmetric-charging alternative (both stages charged S^theta),
        required to return beta^3 = 8/9 and total exponent (2+theta)(8/9)^(1/3)
        = 2.243499 at theta = 1/3 and 2.403749 at theta = 1/2, reported so that
        the modelling choice is visible rather than silent.
      - >-
        theta = 1 diagnostic: c^3 = 9, c = 2.080084, beta^3 = 1/3.
      - >-
        The van Oorschot-Wiener coherence check, reported as ONE control with
        the null and not as a second independent success.
      - >-
        Deltas: c(1/3) - c(0) = 0.026617 (+1.38 per cent) and
        beta(1/3) - beta(0) = -0.125950 (-13.10 per cent); c(1/2) - c(0) =
        0.053053 (+2.76 per cent) and beta(1/2) - beta(0) = -0.171079
        (-17.79 per cent). Reported as accounting deltas and never as security
        deltas.

  heuristic_under_test: null
  heuristic_under_test_note: >-
    Deliberately null. This contract tests the ALGEBRA of the charging family,
    not any of H-RSA-68884a's three heuristics. HEUR-NFS-1 is not tested and
    cannot be by this design - it is assumed by the classical exponent this
    contract reproduces, and G7 exists precisely to show the results do not
    depend on it. HEUR-NFS-2's falsification is a Stage-0 reading question
    owned by a separate contract. HEUR-NFS-3's falsification needs record
    densities, which no gate here consumes. Naming a heuristic here would
    invite exactly the inference this contract cannot support.

  preregistered_prediction:
    quantity: >-
      The exact rational cube of the GNFS full-cost exponent as a function of
      the memory-charging exponent theta, together with the exact rational cube
      of the optimal smoothness exponent.
    formula: >-
      c(theta)^3 = 4 (2 + theta)^4 / (9 (1 + theta)^2) and
      beta(theta)^3 = 4 (2 + theta) / (9 (1 + theta)^2), with
      delta(theta)^3 = 12 (1 + theta) / (2 + theta)^2 and
      c(theta) = (2 + theta) beta(theta).
    source: >-
      Derived in H-RSA-68884a's mechanism from the standard NFS
      parameterization under HEUR-NFS-1..3. NOT taken from any publication; no
      theorem number, page, author or venue is asserted. The theta = 0
      specialization is the classical GNFS exponent and the theta = 1/2
      specialization is compared against a relayed figure, and BOTH
      comparisons are checks on this derivation rather than sources for it.
    frozen_before_execution: >-
      Yes. Every required value in metrics.primary is a rational literal
      written into this contract before any authorized execution exists, and
      the contract carries no free parameter that could be tuned to data.

  scale_relevance:
    tier: medium
    justification: >-
      The gated stages consume NO instance, NO measurement and NO record
      figure: they are exact identities about the asymptotics of a real
      algorithm at its real parameterization. That makes them scale-free in the
      sense that they are neither toy nor crypto - there is no scale in them at
      all. The tier is set to `medium` as the honest ceiling on what a passing
      run may be cited for, and the transfer LIMIT is stated bluntly: an
      L-notation exponent with an uncontrolled o(1) determines nothing at any
      finite modulus size, so conclusions DO NOT transfer to RSA-1024,
      RSA-2048 or RSA-3072, and this contract may not be cited in support of
      any statement at those sizes. GOAL-RSA-001's next_action gates that table
      behind the record-reproduction result, which is not this contract.
    correspondence: >-
      null - no sampling correspondence is used and none is needed; the objects
      are asymptotic parameter optima, not sampled instances.

  tail_checks:
    - >-
      Behaviour at theta = 1 (fully serial access to shared memory): c^3 must
      be exactly 9, c = 2.080084, which remains BELOW the naive L[1/3, 2] and
      is a sanity check that the family does not diverge at the extreme.
    - >-
      Behaviour as theta grows without bound: c(theta) ~ (4/9)^(1/3) theta^(2/3)
      must grow, and beta(theta) -> 0. A family in which beta failed to
      decrease toward zero as memory is priced ever higher would be the
      canonical artifact tell - a quantity that fails to decay when the
      parameter meant to destroy it increases - and would invalidate the model
      even if every gate passed.
    - >-
      Continuity and differentiability of c and beta on [0, 1], checked
      symbolically. A discontinuity would indicate the balance condition
      alpha = (2+theta) beta ceases to be the optimum somewhere on the ladder,
      which would restrict the family's validity to a sub-interval that must
      then be stated.

  replication:
    seeds: []
    seeds_note: >-
      Empty by construction: the contract has no random component. Replication
      is by INDEPENDENT RE-DERIVATION rather than by reseeding - Stage 1
      requires the closed forms to be obtained without evaluating them, and a
      second reviewer repeating Stage 1 from the parameterization alone is the
      replication. Exact rational arithmetic makes every reported number
      bit-identical across machines and interpreters.
    independent_instances: 2
    independent_instances_note: >-
      Two independent derivations are required: the one recorded in
      H-RSA-68884a and one produced during Stage 1 without consulting it. A
      single derivation checked against itself is not a replication.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 0.01
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
    no_network: true
    no_third_party_dependencies: true
    dependency_note: >-
      Python standard library only (fractions, math). NO numpy, sympy, Sage,
      fpylll, Singular or msolve. This is a hard requirement, not a
      preference: the ANGLE-BRIEF records an unresolved, explicitly
      un-adjudicated disagreement between two independent scouts about whether
      this container has numpy at all, and a gate that depended on the answer
      would be an infrastructure request rather than an experiment.

  stopping_rules:
    - Do not execute unless this contract is separately reviewed, approved, frozen, archived and execution-authorized by the Coordinator. It carries no approved_by field because it is not approved.
    - Stop immediately on G1 or G2 failing. The family does not reproduce the classical GNFS optimum and nothing downstream is meaningful.
    - Stop immediately on G4 failing. The instrument is broken and no negative about NFS may be reported.
    - Stop immediately on G5 failing. The optimization is mis-specified and every treatment number is void.
    - Stop before evaluating the treatment ladder if the null-and-control hash commitment is absent.
    - Stop if any gated quantity cannot be expressed as an exact rational, rather than substituting a floating-point tolerance.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any floating-point value entering a pass/fail decision.
    - Any evaluation of the treatment ladder before the null and positive-control commitment exists.
    - Any post-hoc adjustment to the closed forms, the ladder, the required rational values, or the theta treatment point after any evaluated number has been observed. Such an adjustment requires a versioned protocol amendment with exploratory-only confirmatory status and is never an edit to this file.
    - Any use of a record figure from RQ-RSA-afe33c's provenance block inside a gate. Those figures are unverified excerpt material and appear only in ungated Stage-3 reporting.
    - Any resulting record that cites c(theta) without beta(theta) beside it. Memory beside time is a constraint of RQ-RSA-afe33c and of docs/target-result-profile.md, and a time-only citation of this contract is inadmissible.
    - Any resulting record that makes a statement at a concrete modulus size, about batch NFS, about special NFS, or about a deployed key.

  success_criterion: >-
    All eight gates pass in the declared order with exact rational equality:
    G1 c(0)^3 = 64/9; G2 beta(0)^3 = 8/9 and delta(0)^3 = 3; G3 c(1/2)^3 =
    625/81 with its decimal agreeing to the three digits the relayed
    KN-LIT-2663 figure carries; G4 BSGS returns exactly 1/2 and exactly 2/3;
    G5 the null returns exactly (64/9)^(1/3) and (8/9)^(1/3) at every ladder
    point with zero spread; G6 the ladder matches all twelve pre-declared
    rationals with c strictly increasing and beta strictly decreasing; G7 the
    smoothness factor is shown symbolically to cancel in c(theta) - c(0); G8
    the Step-5 residual is exactly zero identically in theta. A pass supports
    ONLY the claim_ceiling statement above and, per falsification condition F8
    of H-RSA-68884a, is INCOMPLETE unless the package also emits the charging
    -convention statement naming which theta this program declares for
    factoring, with the symmetric alternative and its different exponents
    recorded beside it.

  falsification_criterion: >-
    Any of the following, each of which is a REPORTABLE RESULT and not a
    setback. (F1) G1 or G2 fails - the family does not reproduce the classical
    GNFS optimum and is withdrawn as a superseding record. (F2) G4 fails - the
    positive control does not return n^(2/3) at theta = 1/3; the instrument is
    broken and NO negative about NFS may be reported. (F3) G5 fails - the null
    shows theta-dependence. (F4) G6 fails - the ladder is non-monotone in c or
    in beta, or any of the twelve rationals is wrong. (F5) G8 fails - the
    residual is not identically zero, so the algebra is wrong away from the
    checked points. (F6) G3 fails - report BOTH candidate causes, a derivation
    error and a transcription error in a demonstrably corrupted bulk-seeded
    entry, and do not select between them without primary text. (F7) The tail
    check fails: beta does not decrease toward zero as theta grows, which is
    the canonical artifact tell and invalidates the model even if every gate
    passes.

  outcomes:
    no_execution_authorization: >-
      The only current disposition. This is a review_required draft; there is
      no run, no evidence, and no mathematical inference. Nothing in this file
      asserts that any computation has been performed.
    future_gate_pass: >-
      Only after separate approval, freezing, archival and execution
      authorization. Scoped to claim_ceiling; supports a charging convention
      for factoring and nothing else.
    future_gate_fail: >-
      A named negative with its exact boundary - which gate failed, at which
      theta, by how much - plus forward guidance naming what remains open. A
      count of failed gates without that boundary is a fatigue report and is
      not an acceptable output (docs/inventor-protocol.md section 4).
    infrastructure_or_integrity_failure: >-
      INFRASTRUCTURE SIGNAL, NEVER NEGATIVE MATHEMATICAL EVIDENCE. A missing
      interpreter, an unavailable module, a crash, a timeout, an exhausted
      budget, or an inability to retrieve any document is reported as an
      infrastructure or budget outcome and is NEVER evidence against
      H-RSA-68884a, against the charging family, or about the cost of factoring
      (AGENTS.md rule 5; GOAL-RSA-001 pause_conditions). The gated stages are
      deliberately designed to need only a bare Python interpreter so that this
      disposition is unlikely to be needed, and if it is needed the correct
      response is an infrastructure request, not a negative result.

  required_artifacts:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - The independent Stage-1 derivation, written out in full, produced without consulting H-RSA-68884a's mechanism, with the person or session that produced it named.
    - The null-arm and positive-control results, written to disk and SHA-256 committed, with a timestamp preceding the treatment evaluation.
    - A machine-readable table of all six ladder points with exact rational delta^3, beta^3, c^3 and their reported decimals, plus the theta = 1 diagnostic.
    - The symbolic G7 cancellation argument and the exact G8 residual.
    - The symmetric-charging alternative's exponents, reported alongside, so the modelling choice is visible.
    - The charging-convention statement required by H-RSA-68884a's F8.
    - Environment record, exact command, git commit and dirty-tree state, stdout, stderr, and a statement that no network was used.
    - An explicit statement of which record figures were NOT used in any gate, and why.

  approval_requirements:
    - Independent review confirms that every gate is an exact rational identity with no tunable tolerance and no free parameter.
    - Independent review confirms that the null object can actually fail and that the positive control's failure is correctly made fatal to any negative conclusion.
    - Independent review confirms that theta = 1/3 is fixed a priori by KN-TECH-035 / KN-TECH-057 and is not selected from data anywhere in the design.
