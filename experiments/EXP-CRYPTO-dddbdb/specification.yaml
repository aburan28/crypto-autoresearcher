experiment:
  id: EXP-CRYPTO-dddbdb
  hypothesis_id: H-CRYPTO-a405d4
  derived_from_idea: IDEA-20260805-52a0d1
  question_id: RQ-CRYPTO-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Scale-freeness of the Pollard-rho cost spread and the measured cost of one matched
    baseline - toy-scale coefficient of variation with a uniform-birthday positive
    control and a BSGS timing-noise null, plus a host-measured group-operation
    throughput and the resulting budget ratio at 96, 112 and 128 bits
  objective: >-
    The one uncertainty a run reduces is whether the empirical conjunct of
    GOAL-CRYPTO-001's completion criterion can be satisfied by measurement under the
    goal's own declared budget. A run establishes (i) the measured coefficient of
    variation of matched Pollard-rho iteration counts at four toy group orders, with an
    explicit flatness test in N, which is what decides whether the sample-size law
    n = 2.1446/eps^2 may be used at all; (ii) the measured sustained group-operation
    throughput on the execution host, which is the single empirical input to the budget
    arithmetic; and (iii) the resulting ratio of one matched rho baseline at 96, 112 and
    128 bits to the committed campaign budget, reported AS A FUNCTION of the measured
    throughput so the verdict does not hinge on one host. No 96-bit or larger rho run is
    executed - the point of the design is that the expensive thing is not run. No attack,
    break, speedup or security consequence is claimed here or would follow from a run.
  what_this_is_not:
  - >-
    Not an attack, a key recovery, a distinguisher, or a cryptanalytic result of any
    kind. It is a measurement of a cost distribution and a host throughput.
  - >-
    Not a claim, in either direction, about the difficulty of the ECDLP at any bit size,
    and not evidence about any curve or any mechanism.
  - >-
    Not a demonstration that GOAL-CRYPTO-001 is unachievable. It bears on one conjunct of
    one completion criterion under one declared budget.
  - >-
    Not an amendment to any goal record. Amending a goal's completion criteria or budget
    is a separate Coordinator decision that this contract neither makes nor presumes.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or
    evidence. No run has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at group orders 2^20 through 2^32, the implemented
      r-adding walk has a stated measured coefficient of variation with a stated trend in
      N; the execution host sustains a stated number of group operations per second at
      96-bit prime-field arithmetic; and the ratio of the closed-form 96/112/128-bit rho
      operation count divided by that throughput to the committed campaign budget takes a
      stated value. WHAT DOES NOT FOLLOW - no statement about rho's behaviour at
      cryptographic group orders beyond the measured flatness of cv; no statement about
      any other host's throughput; no security claim; and specifically NOT that any
      particular completion criterion should be amended, which is a Coordinator decision
      requiring its own record.
  inputs:
    procedure: >-
      STAGE 0 (zero compute) - re-derive cv = sqrt(4/pi - 1) and the sample-size law
      n = (z_0.975 + z_0.80)^2 cv^2 / eps^2 in the run log; read
      campaign_budget.total_wall_clock_seconds from the committed GOAL-CRYPTO-001 record
      and record the value and the file path; grep ledger/ and experiments/ for any
      existing costed matched-rho baseline at any bit size and record the search command
      and its result verbatim. If a costed baseline is found, the run stops and reports
      it. STAGE 1 (minutes) - uniform-birthday POSITIVE CONTROL at each group order,
      >= 2000 independent seeds, measuring cv where the Rayleigh model is exact by
      construction. STAGE 2 (minutes) - deterministic BSGS NULL on the same instances,
      measuring cv where the forced value is ~0. Stages 1 and 2 are analysed and their
      verdicts written before Stage 3 is read. STAGE 3 (minutes to an hour) - matched
      r-adding Pollard rho to completion at N in {2^20, 2^24, 2^28, 2^32}, >= 2000
      independent seeds per order, recording the full iteration count per run; compute cv
      per order with bootstrap intervals and regress cv on log2 N. STAGE 4 (minutes) -
      measure sustained 96-bit prime-field group operations per second per core on the
      execution host, with the code, method and host recorded. STAGE 5 (zero compute) -
      compute the budget ratio at 96, 112 and 128 bits from the closed-form operation
      count and the measured throughput, tabulated across throughputs 10^6 to 10^10; and
      rebuild the sample-size table from the MEASURED cv, alongside the derived one.
    instrument: >-
      Python 3.11, standard library plus numpy for summary statistics and bootstrap
      resampling with a frozen seed. NO Sage. Iteration counts are exact integers from an
      instrumented counter, never wall-clock, so that algorithmic spread and host timing
      noise are never mixed - the BSGS null exists to demonstrate that separation. The
      throughput measurement is the only wall-clock quantity in the package and is
      reported separately with the host recorded. All runs recorded through
      harness/runner.py.
    parameters: >-
      Group orders N in {2^20, 2^24, 2^28, 2^32}, prime order where available and the
      exact order recorded per cell. At least 2000 independent seeds per (arm, order),
      seeds derived deterministically from the declared replication seeds so the schedule
      is reproducible. r-adding walk with r = 20 partitions, recorded. Bit sizes for the
      budget arithmetic - 96, 112, 128, using the closed-form count sqrt(pi N / 4) with
      the constant shown explicitly in the output so a reader may substitute another
      normalisation. Throughput ladder for the reported table - 10^6, 10^7, 10^8, 10^9,
      10^10 operations per second per core, plus the measured value.
  controls:
  - >-
    POSITIVE CONTROL, MUST FIRE - a plain birthday collision search drawing uniform
    independent elements from the same group, no walk and no curve, where the Rayleigh
    model is exact by construction. FORCED VALUE cv = 0.5227, derived before the run. If
    the instrument does not return it there, the instrument is broken and NO conclusion
    may be drawn about rho's cv.
  - >-
    MATCHED NULL, CAN FAIL - the coefficient of variation of a deterministic baby-step
    giant-step run on the same instances. FORCED VALUE below 0.05, since BSGS's cost is a
    deterministic function of N varying only through where the answer sits in the
    enumeration. A large measured cv here means the pipeline is reading host noise rather
    than algorithmic spread, and every cv number in the package is void. This null is not
    decorative - it separates the one confusion that would invalidate the whole argument.
  - >-
    GRADED CONTROL, four interior points with the trend reported - cv at
    N in {2^20, 2^24, 2^28, 2^32}. The forced pattern is FLAT, not monotone, which
    inverts the usual artifact tell - here a quantity that FAILS TO STAY CONSTANT is the
    signal of trouble, because scale-freeness is the derived property. Both directions of
    departure are pre-registered as informative.
  - >-
    ARITHMETIC REPLICATION - every budget figure is computed independently by two
    different expressions, from the bit size and from the group-order integer, and
    required to agree to three significant figures before it is reported.
  - >-
    ORDERING RULE - the cv measurement and its two controls are completed and their
    verdicts written before any throughput figure is measured or any budget ratio is
    computed, so that no throughput number can be selected to make a ratio look decisive.
  - >-
    CORPUS CHECK, zero compute - the Stage 0 grep for an existing costed rho baseline is
    a falsifiable claim about the repository and is executed rather than asserted. Its
    command and output are recorded verbatim. Absence of a search result is not evidence
    that no prior work exists.
  independent_variables:
  - group order N
  - arm - matched r-adding Pollard rho / uniform birthday collision search / deterministic BSGS
  - assumed sustained throughput R, for the reported budget table
  - target bit size for the budget arithmetic
  metrics:
    primary:
    - >-
      cv_rho(N) - sample standard deviation divided by sample mean of the exact iteration
      counts, dimensionless, per group order, with a bootstrap 95 percent interval from
      2000 resamples.
    - >-
      cv_flatness_slope - ordinary least squares slope of cv_rho on log2 N across the four
      orders, dimensionless per bit, with its 95 percent interval. The forced value is 0.
    - >-
      cv_positive_control(N) - the same statistic computed on the uniform-birthday arm,
      dimensionless. Forced value sqrt(4/pi - 1) = 0.5227.
    - >-
      cv_bsgs_null(N) - the same statistic computed on the deterministic BSGS arm,
      dimensionless. Forced value below 0.05.
    - >-
      throughput_measured - sustained 96-bit prime-field elliptic-curve group operations
      per second per core, measured on the execution host, with host, code path and timing
      method recorded.
    - >-
      budget_ratio(b, R) - the closed-form rho operation count at bit size b divided by R,
      divided by the committed campaign_budget.total_wall_clock_seconds, dimensionless;
      reported at b in {96, 112, 128} for R in {10^6, 10^7, 10^8, 10^9, 10^10} and at the
      measured R.
    secondary:
    - >-
      sample_size_table_measured - n = (z_0.975 + z_0.80)^2 cv_measured^2 / eps^2 per arm,
      in runs, at eps in {1.00, 0.50, 0.20, 0.10, 0.05, 0.02}, one-sample and two-sample
      columns reported separately.
    - >-
      eps_single_comparison - the smallest relative advantage decidable by one matched
      comparison at power 0.80, computed from the MEASURED cv as sqrt(2.1446 * (cv/0.5227)^2).
    - >-
      mean iteration count per (arm, order) against sqrt(pi N / 2), reported so the
      normalisation constant is visible and not merged with the cv result.
    - >-
      core-years and wall-clock-seconds forms of the 96/112/128-bit baseline, reported
      separately, with the goal record's max_concurrent noted as the parallelism actually
      available under the declared budget.
    - >-
      Stage 0 corpus-grep command and verbatim output.
  heuristic_under_test: HEUR-CRYPTO-A405-1
  preregistered_prediction:
    quantity: >-
      cv_rho(N) at each of the four toy group orders and its slope against log2 N; and
      budget_ratio(96, R_measured).
    formula: >-
      cv_rho(N) = sqrt(4/pi - 1) = 0.522723 at every N, with the slope of cv on log2 N
      equal to 0. Predicted band 0.5227 +/- 0.05 per order and a slope interval containing
      0. budget_ratio(96, R) = (2^47.83 / R) / 21600, predicted greater than 100 at any R
      below 10^10; the pre-derived value is 1.16 x 10^3 at R = 10^7. Under the null that
      the walk's cost is not Rayleigh, cv is free to take any value and to trend with N.
    source: >-
      Pre-registered in the parent proposal IDEA-20260805-52a0d1, whose mechanism derives
      cv = sqrt(4/pi - 1) and the sample-size law before any run under this contract
      exists. The proposal's tabulated values are DERIVATIONS from those closed forms
      recorded during ideation, not measurements. Never tuned to data; a run that reports
      a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at group orders 2^20 to 2^32, where thousands of full rho runs are
      affordable and the cv can be measured directly. That affordability is the entire
      design - the quantity under test is claimed to be scale-FREE, so the informative
      measurement is exactly the one that can be repeated cheaply, and the transfer
      assumption is narrow and explicit - that a coefficient of variation measured flat
      across twelve bits of group order remains flat at 96 bits. The absolute cost figures
      at 96, 112 and 128 bits are NOT extrapolations of any measurement here; they are
      arithmetic from a closed-form operation count and a measured per-operation
      throughput, and the contract requires them to be labelled that way wherever they
      appear.
    correspondence: null
  tail_checks:
  - >-
    Report the empirical distribution of iteration counts per cell against the Rayleigh
    quantiles, with a Kolmogorov-Smirnov statistic, so that a cv that happens to match
    while the shape does not is visible.
  - >-
    Report the largest and smallest observed iteration counts per cell against their
    Rayleigh predicted probabilities, since cv is a bulk statistic and a heavy right tail
    would show first in the extremes.
  - >-
    Report the bootstrap interval width for cv per cell and refuse any cell whose interval
    is wider than 0.05, reporting the shortfall rather than a point estimate.
  - >-
    Report cv computed separately on the first and second halves of each seed stream, to
    expose a drift that a pooled estimate would hide.
  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 2.0
    maximum_memory_gb: 4
    maximum_runs: 12
  stopping_rules:
  - >-
    Stop and report if the Stage 0 corpus grep finds an existing costed matched-rho
    baseline at any bit size - the arithmetic has been done and the run reports it rather
    than re-deriving it.
  - >-
    Abort the package if the uniform-birthday positive control misses cv = 0.5227 by more
    than 0.05, and report the instrument failure rather than any cv or budget number.
  - >-
    Stop at the declared four group orders and the declared seed counts. No additional
    order is added after seeing a cv, and no seed count is extended to move an interval.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a
    stop, never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run
    failed_infrastructure and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - >-
    A run whose positive-control or null arm was not executed in the same invocation as
    the rho arm is invalid_measurement - the comparison this contract exists to make was
    not made.
  - >-
    A run reporting cv from wall-clock timings rather than exact iteration counts is
    invalid_measurement, because it cannot separate algorithmic spread from host noise.
  - >-
    A run that reports a budget ratio without a measured throughput, or that extrapolates
    a 96-bit cost from a toy timing rather than computing it from the operation count, is
    completed_invalid.
  - >-
    A run whose parameters differ from the frozen contract is a DIFFERENT experiment and
    requires a new contract; it is never a repair of this one.
  success_criterion: >-
    All four of the following hold, each decidable from the primary metrics -
    (1) cv_positive_control lies within 0.05 of 0.5227 at every group order;
    (2) cv_bsgs_null is below 0.05 at every group order;
    (3) cv_rho lies within 0.05 of 0.5227 at every group order AND the 95 percent interval
    of cv_flatness_slope contains 0;
    (4) budget_ratio(96, R_measured) exceeds 100, with R_measured recorded and the ratio
    also tabulated across the throughput ladder.
  falsification_criterion:
  - >-
    cv_rho departs from 0.5227 by more than 0.05 at any group order, or the
    cv_flatness_slope interval excludes 0, while both controls pass. The scale-free
    hypothesis is FALSE at the tested scope; the sample-size law must be rebuilt from the
    measured distribution and the invariance-to-normalisation argument is withdrawn.
  - >-
    budget_ratio(96, R_measured) is below 1. The central quantitative claim is false at
    the measured throughput and the hypothesis is rejected at the tested scope.
  - >-
    cv_bsgs_null is at or above 0.05. Timing noise dominates; every cv number in the
    package is void and the run returns to the Executor.
  - >-
    cv_positive_control misses 0.5227 by more than 0.05. The instrument is broken and
    nothing is reportable - infrastructure signal, not a negative result.
  - >-
    The Stage 0 grep finds a costed rho baseline in the committed records. The asserted
    gap does not exist and the hypothesis is superseded by a record citing that estimate.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
  - raw-result.json carrying every per-run iteration count, not summaries
  - the positive-control and null arms' measurements, in the same file as the rho arm
  - the Stage 0 derivation log, the committed budget value with its file path, and the verbatim grep command and output
  - the throughput measurement's code path, method, host description and raw timings
  - the budget table as a function of R, with the rho normalisation constant printed
  - the pre-registration text, written before the first run and hashed
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator drafting does not confer approval. This contract is review_required and is
    NOT approved; approved_by is null and execution_authorized is false. Approval is the
    user's gate because it authorizes execution and spends compute.
  - >-
    The rho normalisation convention (walk steps versus group operations; Floyd versus
    Brent versus distinguished points) must be fixed in writing before approval, because
    it changes every absolute figure while cancelling in cv, and a reader who merges the
    two halves gets a wrong number from a right derivation.
  - >-
    The throughput measurement method must be fixed before approval - which curve, which
    coordinate system, which field arithmetic - since it is the sole empirical input to
    the budget ratio.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260805-52a0d1
    authored_at: '2026-08-25'
    note: >-
      Metrics, controls, forced values and falsifiers are taken from the parent proposal's
      predictions, minimal_test and falsification_conditions and restated as measurable
      quantities with units. Boilerplate identical across contracts by program rule -
      invalidation rules, required artifacts, approval gate - comes from the fixed table.
      Budgets are set from the parent's declared estimated_cost of low implementation and
      low compute. No field is invented; a value the proposal did not supply is null or is
      recorded as a derivation gap.
  derivation_gaps:
  - >-
    The parent proposal reports its cv, sample-size and budget-ratio tables as values
    computed during ideation from closed forms. They are DERIVATIONS, not measurements,
    and this contract treats them only as pre-registered predictions. The run must
    recompute every one of them in Stage 0 and report any disagreement with the proposal
    as a defect in the proposal, not in the run.
  - >-
    The walk's parameter r (number of partitions in the r-adding walk) is not specified by
    the proposal and materially affects how closely a real walk approaches the uniform
    model. It is set to 20 here and must be confirmed or changed before approval; a
    measured cv that misses 0.5227 at small r would be a statement about r, not about the
    Rayleigh model.
  - >-
    The proposal's throughput figure of 10^7 operations per second per core is an
    engineering estimate for unspecified hardware. The contract measures it, but which
    implementation counts as the honest baseline (a naive Python curve, a C library, a
    vectorised batch) is a choice that moves the answer by orders of magnitude and must be
    fixed before approval rather than after.
  - >-
    Whether an eventual criterion amendment should also make the CHARGE single-valued is
    raised by the parent proposal by reference to IDEA-20260805-6253cf. That is out of
    scope for this contract and is named here so it is not silently absorbed.
