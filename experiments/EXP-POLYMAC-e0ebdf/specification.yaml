experiment:
  id: EXP-POLYMAC-e0ebdf
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-20e5d1; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-20e5d1
  question_id: RQ-POLYMAC-7c89e4
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Zero-compute proof-architecture audit of the pinned forgery bound: explicit quantifier-order
    rewrite, degenerate-parameter baseline reproduction, cross-field observation-collision search
    over the existing optima table, and a nearby-object method-ceiling check'
  objective: The uncertainty reduced is whether the bound, as this program pins and instantiates it,
    behaves as an identifying observable and whether its quantifier structure survives the way the
    program uses it. (i) Rewrite the pinned bound and the derived data limit with fully explicit quantifiers
    over key, message pair, adversary, query schedule and adaptivity, and diff the prefixes term by
    term, with injected wrong-prefix fixtures verifying that the diff procedure can detect the defect
    it exists for. (ii) Verify symbolically that at degenerate parameters the bound reduces to a hand-computable
    quantity, satisfying section 8's baseline-reproduction audit rather than asserting it. (iii) Group
    every setting on the existing toy optima table by instantiated bound value to within the resolution
    floor, and search the resulting fibres - especially cross-field ones - for pairs whose exactly
    measured optima differ, which would be a direct falsifier of identifiability. The run reduces
    no uncertainty about tightness, about deployed parameters, or about any external document.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: for the bound as pinned in this repository
      and instantiated on the declared toy grid, the quantifier prefixes are as recorded, the prefix
      diff shows exactly the listed mismatches or none, and the bound-value fibres on that grid are
      as tabulated with the listed collisions. WHAT DOES NOT FOLLOW: no claim that the bound is incorrect,
      since an upper bound may collide freely; no claim about any published proof, derivation, specification
      or library, none of which is examined; no claim about deployed parameters; no attack; and no
      claim that an absence of collisions on this grid implies identifiability anywhere else.'
  inputs:
    procedure: 'STAGE 0 (cost: hours, human): obtain the pinned bound statement from the Coordinator
      and the resolution floor table from the ladder contract; without both, halt and report the audit
      as not runnable. STAGE 1 (cost: hours, human): write both quantifier prefixes explicitly and
      diff them; run the 8 injected wrong-prefix fixtures through the same procedure. STAGE 2 (cost:
      an hour, human): perform the degenerate-parameter baseline reproduction symbolically against
      a hand computation. STAGE 3 (cost: seconds): group the existing optima table into fibres by
      bound value within the floor, both fields together. STAGE 4 (cost: minutes): within each multi-member
      fibre, compute the spread of measured optima and label collisions, preferring minimal-difference
      pairs and recording each pair''s difference vector. STAGE 5 (cost: minutes): apply the same
      grouping to the null column and label its collisions by their known mechanism. STAGE 6 (cost:
      an hour, human): state the method ceiling and apply the observable to the nearby object; record
      all four audits with status and reason. STAGE 7 (cost: minutes): emit the audit record and the
      fibre table.'
    instrument: Human symbolic work recorded in the proof_search_map block of templates/research-records.md
      for stages 1, 2 and 6; Python 3 standard library for the grouping and spread computation in
      stages 3 to 5, reading the optima and floor tables emitted by the other contracts in this batch.
      Injected wrong-prefix fixtures stored as text alongside the correct prefix. Manifest via harness/runner.py.
      No Sage, no network, no compute beyond a table pass.
    parameters: 'Input tables: the ratio-surface contract''s optima at n in {8, 12, 16, 20}, L in
      {1, 2, 4, 8, 16}, q in {1, 2, 4}, both fields plus the null column; the ladder contract''s resolution
      floor per (field, width). Fibre tolerance: exactly one resolution-floor unit, not a chosen value.
      Injected wrong-prefix fixtures: 8, each altering one quantifier''s position or scope. Minimal-difference
      preference: fibre pairs ranked by Hamming distance of their parameter vectors.'
  controls:
  - Injected wrong-quantifier fixtures, at least 8, which the prefix comparison must flag.
  - Null-arm fibre grouping, calibrating what an uninformative collision looks like.
  - Resolution floor from the ladder contract, without which fibre membership is undefined.
  - A degenerate-parameter hand computation for audit 1's baseline reproduction, checked symbolically.
  - Independent second reading of the prefix comparison by the red-team role, since a symbolic audit
    has no automatic check.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The random-function null is the nearby object for audit 4 and is executable
    in the same invocation as the signal arm, because the collision search runs over an already-computed
    table of optima that includes a null column. The audit applies the identical bound-value grouping
    to the null arm''s optima: since the null''s optimum has a known analytic form independent of
    L, its fibres must exhibit collisions trivially and by a known mechanism, which calibrates what
    a collision looks like when it is uninformative. For the signal arm''s collisions to mean anything,
    they must be of a different kind - two settings differing in achievable root structure, not merely
    two settings where the optimum was always going to be the same. A second control is a deliberately
    WRONG quantifier prefix, injected as a fixture, which the prefix comparison stage must flag; if
    it does not, the comparison procedure cannot detect the defect it exists to detect.'
  independent_variables:
  - field type (binary extension, prime, random-function null)
  - message length L
  - query count q
  - field bit width n
  metrics:
    primary:
    - quantifier prefix of the pinned bound and of the derived limit
    - count and description of prefix mismatches
    - fibre membership table by bound value within one floor unit
    - within-fibre spread of measured optima, and collision labels
    - status and reason for each of the four section 8 audits
    secondary:
    - fixture detection rate
    - count of cross-field versus within-field collisions
    - parameter-vector difference for each collision pair
    - null-column collision count and mechanism label
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The number of multi-member fibres containing at least one pair whose measured optima
      differ by more than one resolution-floor unit, split into cross-field and within-field counts;
      and the count of prefix mismatches.
    formula: 'A fibre is F(v) = { settings s : |B(s) - v| is at most one resolution-floor unit }.
      A collision in F(v) is a pair s1, s2 in F(v) with |P_opt(s1) - P_opt(s2)| greater than one resolution-floor
      unit. Predicted: the null column exhibits collisions by its known L-independence at every v
      where its fibre has more than one member; the injected wrong-prefix fixtures are detected at
      rate 1.'
    source: Pre-registered in the parent proposal IDEA-20260816-20e5d1 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The collision search runs on the existing toy grid at n at most 20, since that
      is where exact optima exist to compare. No extrapolation is made: an identifiability result
      on that grid is stated as a result on that grid. The quantifier audit is scale-free - it examines
      a formal statement, not a measurement - and is therefore the only part of this bucket that is
      not toy-limited, which is precisely why it is worth running first and cheaply.'
    correspondence: null
  tail_checks:
  - fibres of size one must be counted and reported, since a grid where most fibres are singletons
    weakens any collision found in the few that are not
  - the largest bound values, where the bound may saturate at one, must be excluded explicitly rather
    than forming a giant degenerate fibre
  - the smallest width, where the floor is coarsest, must be checked for whether its floor swamps
    the whole grid into one fibre
  - cross-field fibres must be checked for unit commensurability before being counted
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - halt and report not runnable if the bound is not pinned or the floor table is absent
  - halt the prefix stage if any injected fixture is missed, and repair the procedure before continuing
  - no compute budget is required; the human budget is capped at one working session with the independent
    second reading mandatory
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All four section 8 audits are recorded with an explicit status and reason, every
    injected fixture is detected, the fibre table is emitted for the full grid with cross-field and
    within-field collisions separately labelled, and the null column's collisions are labelled by
    mechanism.
  falsification_criterion:
  - an injected fixture is missed
  - the null column exhibits no collisions where its fibres have multiple members
  - the floor table is unavailable so fibres are undefined
  - the bound cannot be written as a determinate formal statement and the prefix audit is non-applicable
  - any of the four audits is omitted without a stated reason
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-20e5d1
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The bound must be pinned from primary text before any part of this audit can run; this is the
    same shared derivation gap as the rest of the batch and here it is an absolute precondition rather
    than an input.
  - The Coordinator must supply, or decline to supply, the derivation of a concrete data limit whose
    prefix is to be compared - without a second statement there is nothing to diff.
  - A ruling is needed on whether cross-field fibres are meaningful given unit commensurability, since
    the headline collision claim depends on it.
  - The independent second reading of the prefix diff must be assigned to a reviewer, since a symbolic
    audit has no automatic verification and a single-reader result is materially weaker.
