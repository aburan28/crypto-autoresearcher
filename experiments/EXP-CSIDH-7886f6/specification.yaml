# _goal_of(spec), which is this spec's goal_id GOAL-CSIDH-001 when
# present. Success is the source idea's prediction: the instrument
# checks pass and r = h at p = 83, N = 30. The concrete negative is
# that the instrument checks pass and r differs from h. This session
# did not compute h and did not compute the truncation; no enumeration of
# the claim discriminant was run. After this contract is approved and its
# trial plan frozen, the design session may smoke-test driver.py and
# check.py end-to-end in a throwaway directory outside the repository; no
# run record is created, no reading row is scored, and the supervised run
# RUN-CSIDH-db3ad8 remains the scored measurement. The file parses as
# YAML (yaml.safe_load was run on it). The driver
# experiments/EXP-CSIDH-7886f6/implementation/driver.py and the checker
# experiments/EXP-CSIDH-7886f6/implementation/check.py are written and
# compile; their machinery was validated on discriminants -163, -84, and
# -23 (known form counts 1, 4, 3), never on the claim discriminant -83.
# Approval is a separate act by the session Coordinator: designing is not
# approving.
# =============================================================================
