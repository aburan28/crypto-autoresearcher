    additional discriminant, any other truncation length, any security
    or cost claim, and any use of this measurement as a class-number
    formula proof.
  execution_authorized_decision: DEC-20261009-3452ab
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261009-3452ab
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      When a later decision approves this contract, work only on
      discriminant -83 with the 30-term truncation, the two form
      enumerations E1 and E2, and the three-discriminant
      fundamentality-labeling control (-83 fundamental, -84
      fundamental, -92 non-fundamental). Score r against h. Do not
      add a discriminant, do not extend the truncation, and do not
      claim a security level.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false
      applied: true
      applied_by_decision: DEC-20261009-3452ab
      note: >-
        Approval to perform this work asserts nothing about the
        hypothesis (AGENTS.md, standing user authorization).

  objective: >-
    Decide whether the nearest integer r to the 30-term truncation of
    the Dirichlet series for L(1, chi) at discriminant -83 equals the
    form count h. The concrete negative is that the instrument checks
    pass and r differs from h. No quantum oracle, no security level, and
    no CSIDH-512 extrapolation are in scope. Transfer assumption: none.

  inputs:
    discriminant: >-
      p = 83, D = -83. The discriminant is fundamental: 83 is prime and
      83 is congruent to 3 modulo 4.
    truncation: >-
      N = 30 terms. L30 is the sum of chi(n)/n for n from 1 to 30, as
      an exact rational (Fraction).
    form_convention: >-
      h is the number of reduced positive-definite binary quadratic
      forms [a, b, c] with b^2 - 4ac = -83 under the standard
      reduction conditions |b| <= a <= c, and b >= 0 when |b| = a or
      a = c, each form counted once. Identifying opposite forms twice
      changes h; the convention is fixed before the count.
    enumerations: >-
      E1 is a direct nested-loop enumeration over a, b, c ranges with
      the reduction inequalities. E2 is a second enumeration with a
      different loop structure and set-based deduplication. The two
      must agree on the form set and on h; a disagreement is an
      instrument failure that voids the run, never a scored row.
    kronecker: >-
      chi(n) is the Kronecker symbol (-83 / n) for n from 1 to 30,
      computed by a stated reciprocity-based routine. Control:
      chi(1) = 1.
    enclosures: >-
      sqrt(83) is enclosed in [SQRT_LO, SQRT_HI] and pi in [PI_LO,
      PI_HI], each a pair of explicit positive rationals with the
      denominator stated, chosen so the induced interval for
      S = (sqrt(83) / pi) * L30 has length strictly less than 1/2. The
      denominators are fixed in the driver and recorded in the run
      manifest. The sign of L30 is handled correctly when the enclosure
      is multiplied: if L30 < 0 the interval endpoints swap, and if
      L30 = 0 the interval is {0}.
    control_84: >-
      The driver separately enumerates the reduced forms of
      discriminant -84, records that count, and labels its
      fundamentality by the same criterion routine as -83.
      DESIGN-TIME CORRECTION of the source idea's premise: -84 =
      4*(-21) with -21 congruent to 3 modulo 4 and squarefree IS
      fundamental (the field discriminant of Q(sqrt(-21)), conductor
      1), so the source idea's demand that -84 be labeled
      non-fundamental is unsatisfiable by correct code. The idea's
      intent — explicit fundamentality labeling before any row is
      scored — is preserved by a three-discriminant labeling control:
      -83 and -84 must label fundamental, and -92 = 4*(-23) with
      -23 congruent to 1 modulo 4 (an order of conductor 2 in
      Q(sqrt(-23))) must label non-fundamental. Any mislabel voids
      the run.
    implementation: >-
      The driver is
      experiments/EXP-CSIDH-7886f6/implementation/driver.py and the
      checker is
      experiments/EXP-CSIDH-7886f6/implementation/check.py. Neither
      is written in this session; the paths are the frozen locations.

  controls:
    - id: chi-one-and-reduced-sum
      statement: >-
        chi(1) = 1, and L30 is a reduced rational. A non-reduced
        comparison voids the run.
    - id: enumeration-agreement
      statement: >-
        E1 and E2 must return the same form set and the same count h. A
        disagreement is an instrument failure that voids the run, never
        a scored row.
    - id: fundamentality-labeling
      statement: >-
        One criterion routine labels discriminants -83, -84, and -92
        before any -83 row is scored: -83 and -84 must label
        fundamental, and -92 (4*(-23), -23 congruent to 1 modulo 4,
        conductor 2 in Q(sqrt(-23))) must label non-fundamental. Any
        mislabel voids the run. This corrects the source idea's
        premise that -84 is non-fundamental: -84 = 4*(-21) with -21
        congruent to 3 modulo 4 is the fundamental discriminant of
        Q(sqrt(-21)); the idea's intent (explicit labeling) is
        preserved and strengthened.
    - id: invariant-factors-ignored
      statement: >-
        The invariant-factor list of the class group may be computed
        and must then be ignored: it is recorded as a secondary metric
        and is never the claim row. A write-up whose only outcome is
        that list is not this test.
    - id: interval-length-gate
      statement: >-
        The rational interval for S must have length strictly less than
        1/2, contain exactly one integer, and meet no integer plus
        1/2, before r is scored. A two-integer interval or a
        half-integer boundary is instrument_failure; no nearest integer
        is scored and the row is not a mismatch.

  independent_variables: []
  independent_variables_note: >-
    None varied. The experiment is a single deterministic measurement at
    one frozen instance: discriminant -83, 30-term truncation, one
    form-count convention. The independent variable set is empty by
    design.

  metrics:
    primary:
      - id: abs_diff
        statement: >-
          The absolute difference |r - h| when r is scored. The claim
          row is r = h against r different from h. The prediction is 0.
          The concrete negative is a positive difference with the
          instrument checks passed.
    secondary:
      - id: h_e1
        statement: the form count h from enumeration E1
      - id: h_e2
        statement: the form count h from enumeration E2
      - id: chi_table
        statement: >-
          the Kronecker symbol table chi(n) = (-83 / n) for n from 1
          to 30
      - id: L30
        statement: the partial sum L30 as an exact reduced rational
      - id: interval
        statement: >-
          the rational interval bounds for S and the interval length,
          with the endpoint distances to the nearest integer and to the
          nearest half-integer
      - id: r_or_failure
        statement: the nearest integer r, or instrument_failure
      - id: count_84
        statement: >-
          the discriminant -84 form count, with its computed
          fundamental label
      - id: label_92
        statement: >-
          the computed non-fundamental label of discriminant -92 with
          its reason (conductor 2 in Q(sqrt(-23)))
      - id: invariant_factors
        statement: >-
          the invariant-factor list of the class group if computed,
          ignored for scoring
      - id: timings
        statement: per-stage timings, recorded with no extrapolation

  heuristic_under_test: H1
  heuristic_under_test_note: >-
    H1 is the tail bound: the tail of L(1, chi) after 30 terms,
    multiplied by sqrt(83) / pi, has absolute value strictly less than
    1/2, so the nearest integer to the truncation equals the class
    number. The form count is the measurement.

  preregistered_prediction:
    quantity: >-
      The nearest integer r to the 30-term truncation of the Dirichlet
      series for L(1, chi) at discriminant -83, against the form count
      h. The quantity is |r - h| at p = 83 and N = 30.
    formula: >-
      r = h. The concrete negative is that the instrument checks pass
      and r is different from h. Neither h nor the truncation was
      computed before this formula was written.
    source: >-
      IDEA-20261006-3cc090 predictions block: metric absolute
      difference between the nearest integer r and the form count h,
      direction lower, minimum_effect equal to 0. The heuristic H1
      tail bound is the thing under test. The infinite-sum identity is
      recalled, not opened.

  scale_relevance:
    tier: toy
    justification: >-
      One discriminant, -83, and one truncation length, 30. No
      transfer assumption: the integer is not used at a 512-bit prime
      and is not a CSIDH-512 class number. The minimum effect is the
      idea's own 0.
    correspondence: >-
      Direct enumeration of reduced binary quadratic forms at one
      discriminant. No sampling correspondence is used.

  tail_checks:
    - >-
      The length of the rational interval for S is reported and must be
      strictly less than 1/2 before r is scored. A longer interval is
      instrument_failure, not a mismatch.
    - >-
      The distance from each interval endpoint to the nearest integer
      and to the nearest half-integer is recorded.
    - >-
      No term is added after seeing h. The truncation length 30 is
      frozen before the run.

  replication:
    seeds:
      - EXP-CSIDH-7886f6|claim|deterministic
    independent_instances: 1
    future_run_slot: RUN-CSIDH-db3ad8
    note: >-
      The measurement is deterministic. The replication plan names one
      future run slot, RUN-CSIDH-db3ad8, which the trial plan binds
      and this session does not launch. The E1/E2 enumeration
      agreement is the replication of the instrument.

  budget:
    enforcement: advisory
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One manifest covers the -83 row, the -84 control, and both
      enumerations. The 1 GB figure is machine protection for the form
      lists. A watchdog expiry is failed_infrastructure, not a value of
      the claim.

  stopping_rules:
    - Stop after one reading row is named.
    - Do not add terms after seeing h.
    - Do not widen the interval after seeing h, and do not rescore with new enclosures.
    - A timeout voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - The two enumerations disagree. The run is void, and the disagreed h is never used.
    - Any fundamentality label among -83, -84, -92 is wrong. The run is void.
    - L30 is not a reduced rational. The run is void.
    - >-
      The interval length is at least 1/2, or the interval contains
      two integers, or it meets an integer plus 1/2, and that row is
      scored as a mismatch. It is instrument_failure; no nearest
      integer is scored.

  success_criterion: >-
    The instrument checks pass (E1 and E2 agree on h, chi(1) = 1, L30
    is a reduced rational, the three-discriminant fundamentality
    labeling is correct (-83 fundamental, -84 fundamental, -92
    non-fundamental) before any -83 row is scored, and the rational
    interval for S has length strictly less than 1/2 and contains
    exactly one integer) and r = h. This is the prediction of
    IDEA-20261006-3cc090.

  falsification_criterion: >-
    The instrument checks pass and r is different from h. That positive
    difference |r - h| is the negative observation. An
    instrument_failure row (a two-integer interval, a half-integer
    boundary, an enumeration disagreement, or a wrong fundamentality
    label) is not this negative.

  decision_impact:
    on_positive: >-
      A later evidence review may record that the 30-term truncation
      names the form count at discriminant -83: a certified class
      number at a small CSIDH-like discriminant, a structure input for
      RQ-CSIDH-64343f. No knowledge entry is promoted from this record
      alone.
    on_negative: >-
      A later evidence review may record that the 30-term truncation
      has not settled at discriminant -83, closing only that
      discriminant and that truncation length, never the infinite sum.
      No structure input is recorded from the unsettled truncation.

  required_artifacts:
    - experiments/EXP-CSIDH-7886f6/runs/RUN-CSIDH-db3ad8/manifest.yaml
    - experiments/EXP-CSIDH-7886f6/runs/RUN-CSIDH-db3ad8/raw-result.json
    - experiments/EXP-CSIDH-7886f6/runs/RUN-CSIDH-db3ad8/forms-83.json
    - experiments/EXP-CSIDH-7886f6/runs/RUN-CSIDH-db3ad8/forms-84.json
    - experiments/EXP-CSIDH-7886f6/runs/RUN-CSIDH-db3ad8/reading.yaml

  assigned_to: executor
