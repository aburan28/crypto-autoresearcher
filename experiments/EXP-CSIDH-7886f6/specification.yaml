  hypothesis_id: H-CSIDH-10eb0a
  question_id: RQ-CSIDH-64343f
  goal_id: GOAL-CSIDH-001
  source_idea: IDEA-20261006-3cc090
  version: 1
  title: >-
    Nearest integer to the 30-term class-number truncation at
    discriminant -83
  status: approved
  status_note: >-
    Frozen at version 1 with approved_by: null by the design session;
