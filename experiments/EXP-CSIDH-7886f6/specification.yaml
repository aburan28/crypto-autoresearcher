  designed_at: '2026-10-09'
  frozen: true
  frozen_at: '2026-10-09'
  execution_authorized: true
  execution_authorized_note: >-
    Authorized scope: execute the single frozen deterministic trial
    class-number-truncation-83 under the trial plan (the two form
    enumerations E1 and E2 at discriminant -83, the 30-term truncation,
