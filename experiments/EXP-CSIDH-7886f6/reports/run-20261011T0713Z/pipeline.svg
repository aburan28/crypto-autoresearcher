<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">CSIDH successor execution pipeline</title>
  <desc id="desc">The supervisor admitted the plan, wrote eight generated files, and stopped before the driver because the macOS address-space pre-exec guard raised an exception. Five scientific artifacts were not produced.</desc>
  <rect width="900" height="260" fill="#ffffff"/>
  <style>text{font-family:Arial,sans-serif;fill:#17202a} .box{stroke:#34495e;stroke-width:2;rx:10} .ok{fill:#d5f5e3}.stop{fill:#f9e79f}.missing{fill:#f5b7b1}.arrow{stroke:#34495e;stroke-width:3;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34495e"/></marker></defs>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold">RUN-CSIDH-db3ad8 — recorded execution path</text>
  <rect class="box ok" x="30" y="75" width="180" height="105"/>
  <text x="120" y="105" text-anchor="middle" font-size="15" font-weight="bold">Admission</text>
  <text x="120" y="130" text-anchor="middle" font-size="13">plan v2 accepted</text>
  <text x="120" y="153" text-anchor="middle" font-size="12">epoch 1 claim</text>
  <text x="120" y="171" text-anchor="middle" font-size="12">coverage gate passed</text>
  <line class="arrow" x1="210" y1="127" x2="275" y2="127"/>
  <rect class="box ok" x="275" y="75" width="190" height="105"/>
  <text x="370" y="105" text-anchor="middle" font-size="15" font-weight="bold">Supervisor setup</text>
  <text x="370" y="130" text-anchor="middle" font-size="13">8 generated files</text>
  <text x="370" y="153" text-anchor="middle" font-size="12">launch + receipt</text>
  <text x="370" y="171" text-anchor="middle" font-size="12">logs created empty</text>
  <line class="arrow" x1="465" y1="127" x2="530" y2="127"/>
  <rect class="box stop" x="530" y="75" width="180" height="105"/>
  <text x="620" y="105" text-anchor="middle" font-size="15" font-weight="bold">Pre-exec guard</text>
  <text x="620" y="130" text-anchor="middle" font-size="13">RLIMIT_AS failure</text>
  <text x="620" y="153" text-anchor="middle" font-size="12">macOS ValueError</text>
  <text x="620" y="171" text-anchor="middle" font-size="12">driver not started</text>
  <line class="arrow" x1="710" y1="127" x2="760" y2="127"/>
  <rect class="box missing" x="760" y="75" width="110" height="105"/>
  <text x="815" y="105" text-anchor="middle" font-size="15" font-weight="bold">Output</text>
  <text x="815" y="130" text-anchor="middle" font-size="12">5 absent</text>
  <text x="815" y="151" text-anchor="middle" font-size="12">scientific</text>
  <text x="815" y="169" text-anchor="middle" font-size="12">artifacts</text>
  <text x="450" y="225" text-anchor="middle" font-size="12">Measured values: none. The diagram records execution custody and the stopping point only.</text>
</svg>
