experiment:
  id: EXP-ALPF-9859ff
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-6a7fa4; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-6a7fa4
  question_id: RQ-ALPF-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Proxy-versus-endpoint validation of the ALPF degree screen: meter d_ff and independently
    certify decompositions by exhaustive factor-base enumeration on the same toy instances, reporting
    prevalence, sensitivity and specificity per representation.'
  objective: 'The one uncertainty a run reduces is whether the algebraic degree the ALPF lane measures
    is associated with the decomposition it stands in for. Stated as parts: (i) what is the prevalence
    of certified decompositions over a factor base of a given size for uniformly random toy targets,
    established by exhaustive tuple enumeration with every candidate passed through harness/semaev.py''s
    independent verifier, since sensitivity and specificity are meaningless without a prevalence and
    no such rate is recorded in the lane; (ii) on the same instances in the same invocation, what
    is the 2x2 association between the screen''s fire verdict and certificate existence, per representation,
    with a Fisher exact test and a scrambled-verdict control confirming the test is calibrated on
    this design and this sparsity; (iii) is the association absent for the pullback representation
    whose archived rows show d_ff = D_reg = 1, a collapse leaving the verdict no room to discriminate,
    as EXP-ALPF-007''s committed table displays. Reducing these tells the lane what a fire actually
    predicts, using ground truth the harness can already verify.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: at these primes, factor-base
      sizes, arities and representations, the prevalence of certified decompositions was q, and the
      verdict''s association with certificate existence had the reported odds ratio, sensitivity and
      specificity. What does NOT follow: that any decomposition can be found efficiently -- the enumeration
      is exhaustive and deliberately slower than Pollard rho at these sizes, and its certificates
      are ground truth, never a solving result; that the degree proxy is invalid in general; that
      any archived ALPF verdict is wrong; that anything transfers to medium or cryptographic scale;
      and no attack, speedup or security consequence of any kind.'
  inputs:
    procedure: 'STAGE 0 (cost: 0 compute): fix the representation set, factor-base sizes and arity
      from the archived EXP-ALPF-011 and EXP-ALPF-007 tables. STAGE 1 (cost: ~1 day human): validate
      the tuple enumerator against known-good decompositions constructed by summing factor-base points,
      confirming it recovers every planted relation before any negative is trusted. STAGE 2 (cost:
      ~30 CPU-minutes): generate 100 toy instances per (prime, |FB|) with uniformly random targets
      using harness/toycurve.py. STAGE 3 (cost: ~1 CPU-hour): for each instance build every representation,
      meter d_ff with the shared Macaulay meter and record the verdict. STAGE 4 (cost: ~30 CPU-minutes):
      for each instance run the exhaustive enumeration, assemble candidate certificates and verify
      each with verify_decomposition_certificate; record enumeration completeness. STAGE 5 (cost:
      minutes): cross-tabulate, run Fisher exact per representation and pooled, and compute sensitivity
      and specificity against the measured prevalence. STAGE 6 (cost: minutes): run the scrambled-verdict
      control and print every discordant instance in full.'
    instrument: Python 3 only, no Sage. harness/toycurve.py for curve and instance generation and
      uniform target sampling; harness/semaev.py for s3_expr, s3_eval, s4_expr, build_factor_base,
      _find_decomposition and above all verify_decomposition_certificate as the independent verifier;
      a shared pure-Python Macaulay-rank meter over F_p for the proxy arm; a hand-written exhaustive
      tuple enumerator; a hand-written Fisher exact test so no dependency is added; harness/runner.py
      for manifests, seeds and the inference block.
    parameters: 'Primes: one 13-bit and one 17-bit prime, matching archived sizes. Factor-base sizes:
      |FB| = 5 and |FB| = 20, chosen to bracket a usable prevalence. Arity: 3, matching the m = 3
      archived rows. Representations: x-ring baseline, e-ring, power-sum and one pullback representation.
      Instances: 100 uniformly random targets per (prime, |FB|), giving 400 instances and 1600 metered
      representation cells. Enumeration: all C(|FB|, 3) triples with sign variants, 10 at |FB| = 5
      and 1140 at |FB| = 20, per target. Maximum Macaulay degree 14. Scrambled-verdict control: 200
      permutations.'
  controls:
  - Uniformly random targets with no planted decomposition, establishing the prevalence in the same
    invocation.
  - Scrambled-verdict control on the same instances, which must show no association.
  - Certificate verification by harness/semaev.py's independent verifier rather than by the enumerator
    that produced the candidate.
  - 'Enumeration-completeness assertion: tuples tested reported against the combinatorial total for
    the stated arity, per instance.'
  - Factor-base-size contrast at |FB| = 5 and |FB| = 20, so prevalence and association are each measured
    at two prevalences.
  - Representation contrast including at least one pullback representation, whose collapsed degrees
    predict null association.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a target point drawn uniformly at random from the
    group, with no planted decomposition, whose decomposability over the given base is whatever the
    base rate happens to be. The IDENTICAL proxy metering and the IDENTICAL exhaustive enumeration
    run on it in the same invocation. For the association to mean anything the null arm must establish
    the PREVALENCE, because sensitivity and specificity are uninterpretable without it and a proxy
    can look excellent purely by matching a prevalence near 0 or near 1. A second null is a scrambled-verdict
    control: the same instances with verdicts permuted, which must show no association, confirming
    the Fisher test is calibrated on this design and this sparsity.'
  independent_variables:
  - representation
  - factor-base size |FB|
  - prime size
  - arm (real verdict vs scrambled verdict)
  metrics:
    primary:
    - prevalence of certified decompositions per (prime, |FB|)
    - 2x2 verdict-by-certificate table per representation
    - Fisher exact p-value and odds ratio per representation and pooled
    - sensitivity and specificity of the verdict against the certificate endpoint
    secondary:
    - tuples enumerated versus combinatorial total per instance
    - certificate verification pass rate on candidates
    - full discordant-instance list
    - d_ff distribution split by certificate status
    - wall-clock seconds per instance for proxy and endpoint arms separately
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The association between the ALPF screen's fire verdict and the existence of a verified
      decomposition certificate on the same instance, together with the prevalence that association
      is conditioned on.
    formula: 'prevalence q = (# targets with at least one verified certificate) / 100 per (prime,
      |FB|). Association reported as the 2x2 odds ratio with a Fisher exact p-value; sensitivity =
      P(fire | certificate) and specificity = P(quiet | no certificate). Pre-registered predictions:
      the scrambled-verdict control gives an odds ratio indistinguishable from 1 at p > 0.05; the
      pullback representation gives an odds ratio indistinguishable from 1, since its archived rows
      show d_ff = D_reg = 1. No value is pre-committed for the prevalence or for the association of
      the algebraically sensible representations, and the reason is stated: both are precisely what
      the experiment exists to measure.'
    source: Pre-registered in the parent proposal IDEA-20260816-6a7fa4 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at 13-bit and 17-bit primes with |FB| in {5, 20} and arity 3, inside the
      archived ALPF parameter range. No transfer to medium or cryptographic scale is claimed. The
      endpoint arm''s exhaustive enumeration is affordable only at these sizes, and that affordability
      is itself why the tier is toy: the experiment states explicitly that this validation cannot
      be run where the answer would matter, which is the situation inventor-protocol section 6 describes,
      and it therefore claims step 2 of that ladder and not step 3.'
    correspondence: null
  tail_checks:
  - Print every discordant instance in full -- fired without certificate, and certificate without
    fire -- since these individual cases carry the mechanism.
  - Report instances where enumeration was incomplete, whose endpoint is unknown rather than negative.
  - Report the d_ff values of certificate-bearing instances individually, since a bimodal pattern
    would indicate two mechanisms.
  - Report any candidate that failed verification, individually, since that indicates an enumerator
    fault rather than a scientific result.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort before STAGE 3 if the enumerator fails to recover any planted relation in the STAGE 1 validation.
  - Resize the factor base and restart the arm, reporting the change, if prevalence is 0 or 1 at both
    tested |FB| values.
  - Hard stop at 4 total CPU-hours.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The enumerator recovers 100 percent of planted relations in validation, prevalence
    lies strictly between 0 and 1 at at least one tested factor-base size, and a 2x2 association with
    a Fisher exact test is reported for every representation.
  falsification_criterion:
  - Verdict and certificate independent at every representation.
  - Prevalence of 0 or 1 at both tested factor-base sizes.
  - Scrambled-verdict control showing association.
  - Any candidate failing verify_decomposition_certificate.
  - Enumeration incomplete on more than 5 percent of instances.
  - Pullback representation showing strong association, falsifying the collapsed-degree prediction.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-6a7fa4
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The sign and ordering conventions for the m = 3 Semaev relation as used by harness/semaev.py must
    be pinned by a Coordinator, since a convention error manufactures false negatives on the endpoint
    arm and would masquerade as a null association.
  - Whether |FB| = 20 is compatible with the archived representations' degree profiles, or changes
    them, must be checked before freeze; if it changes them, the proxy arm at |FB| = 20 measures a
    different profile and must be reported separately.
  - Whether a target admitting a decomposition of arity other than 3 counts as a certificate needs
    deciding; the default here is no, and that choice bounds the prevalence.
  - The relationship between this entry's certificate notion and the claim tiers in docs/claims-and-verification.md
    must be confirmed so no record can be read as a solve claim.
