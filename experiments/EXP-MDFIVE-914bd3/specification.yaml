experiment:
  id: EXP-MDFIVE-914bd3
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-e40ea1; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-e40ea1
  question_id: RQ-MDFIVE-6870c1
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Compute five candidate explanatory statistics on MD4 and MD5 through one uniform instrument,
    against shape-matched noise floors and step-count controls, and emit a pass or fail filter table
    with directions declared in advance.
  objective: 'The run reduces one uncertainty: whether any of the cheaply computable quantities this
    bucket has proposed actually distinguishes MD4 from MD5 in the direction the anchor question''s
    reported ordering demands. As parts: (i) it forces every candidate through one interface on one
    specification record, removing the possibility that a candidate looks good because it was implemented
    more carefully for one primitive than the other; (ii) it establishes a noise floor per candidate
    from shape-matched random specifications, so a cross-primitive difference is judged against the
    difference two random specifications of those shapes would show anyway; (iii) it separates step
    count from structure using a 48-step truncation of MD5 and a 64-step extension of MD4, which is
    the single most likely confound in any MD4-versus-MD5 comparison and the one that would otherwise
    let every candidate pass for the wrong reason. The run reduces no uncertainty about attack complexity,
    and it does not verify the ordering it assumes. A table in which nothing passes is a real outcome
    and is recorded as a measured obstruction naming the instruments and their resolution, with forward
    guidance toward quantities that could exceed the floor.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: under the frozen candidate list,
      the declared directions and the shape-matched null families, the named candidates exceed their
      noise floor with the demanded sign and the other named candidates do not, with the step-count
      controls attributing the stated fraction of each contrast. What does NOT follow: that a passing
      candidate is the mechanism, that a failing candidate is irrelevant to cryptanalysis, that MD4
      or MD5 has any particular security property, or that the assumed ordering between them is true.'
  inputs:
    procedure: STAGE 0 define a uniform primitive-specification record and instantiate MD5, MD4, truncated
      MD5 and extended MD4; cost hours of implementation. STAGE 1 freeze the candidate list and write
      down, for each, the direction the contrast must take and why, before any value is computed;
      cost is review time and it is the stage that makes the run falsifiable. STAGE 2 implement each
      candidate against the uniform interface and validate each on its own degenerate cases; cost
      hours. STAGE 3 compute every candidate on all four specifications; cost seconds to minutes.
      STAGE 4 generate 10^4 shape-matched null specifications per shape and compute every candidate
      across them in the same invocation; cost minutes, dominated by the wavefront candidate which
      runs at reduced sample count here. STAGE 5 add the dummy candidate and confirm it fails. STAGE
      6 assemble the verdict table with contrasts, floors, signs and attributions. STAGE 7 emit the
      manifest and the full per-candidate arrays so any later record can re-derive a verdict under
      a different floor.
    instrument: Python 3.11 with numpy, run under harness/runner.py for the manifest, seeds and wall-clock
      ceiling. The candidate implementations are the ones defined by the sibling records in this batch,
      imported rather than reimplemented, behind a single abstract primitive-specification dataclass
      carrying step count, schedule table, rotation table and nonlinear function selector. Validated
      RFC 1321 MD5 and an RFC 1320 MD4 implementation, each checked against their published test vectors,
      are needed only by the wavefront candidate. No Sage, no computer-algebra system, no solver.
    parameters: 'Four signal specifications: MD5 (64 steps, 4 rounds), MD4 (48 steps, 3 rounds), MD5
      truncated to 48 steps, MD4 extended to 64 steps. Five candidates plus one dummy. Null families:
      10^4 shape-matched specifications for each of the two shapes, seeds recorded. Wavefront candidate
      at reduced sampling for this table: 10^3 samples per cell over a 4 x 4 starting grid rather
      than the full 8 x 8. Noise floor band: central 90 percent of the cross-shape contrast distribution.'
  controls:
  - Shape-matched null families for both MD4's and MD5's shapes, evaluated by the identical instrument
    in the same invocation.
  - MD5 truncated to 48 steps, isolating step count from every other design difference.
  - MD4 extended to 64 steps by continuing its schedule pattern, the mirror-image control of the truncation.
  - Within-shape percentile reporting as a secondary null so a verdict driven by shape mismatch is
    visible.
  - A deliberately non-discriminating dummy candidate, such as output length in bits, which must fail
    the filter; if it passes, the filter is broken.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): For each candidate Q, a shape-matched null family is generated for
    MD5''s shape and for MD4''s shape separately, and the identical instrument computes Q across both
    families in the same invocation. The null must show the distribution of the cross-shape difference
    of Q between random members of the two families, which is the noise floor: if MD5-minus-MD4 for
    a candidate sits inside the central 90 percent of that floor, the candidate fails the filter for
    lack of signal rather than for wrong sign. For the whole exercise to mean anything, at least one
    candidate must exceed its floor and at least one must not; a table in which every candidate is
    inside the floor says the instruments are too coarse, and a table in which every candidate is
    outside it says the shapes differ so much that the contrast reads step count rather than structure,
    and both outcomes are recorded as such.'
  independent_variables:
  - 'primitive specification: MD5, MD4, truncated MD5, extended MD4, null sample'
  - candidate quantity identity
  - 'null family shape: MD5-shaped versus MD4-shaped'
  - 'floor definition: shape-matched cross-difference versus within-shape percentile'
  metrics:
    primary:
    - contrast Q(MD5) minus Q(MD4) per candidate
    - noise floor band per candidate
    - pass or fail verdict per candidate
    - fraction of contrast reproduced by the truncated-MD5 control
    secondary:
    - within-shape percentile of each primitive per candidate
    - verdict agreement between the two floor definitions
    - dummy-candidate verdict
    - extended-MD4 control contrast
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The number of candidates passing the filter, and the fraction of each passing contrast
      reproduced by the 48-step-truncated MD5 control.
    formula: 'Candidate Q passes if and only if the absolute contrast between Q(MD5) and Q(MD4) exceeds
      the 95th percentile of the same absolute contrast over paired null samples drawn from the two
      shapes, AND the sign of that contrast equals the pre-declared direction. Attribution A(Q) is
      the absolute contrast between Q(MD5 truncated to 48 steps) and Q(MD4), divided by the absolute
      contrast between Q(MD5) and Q(MD4). Predicted: between 1 and 4 candidates pass, and A(Q) at
      most 0.5 for at least one passing candidate.'
    source: Pre-registered in the parent proposal IDEA-20260816-e40ea1 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Every quantity is computed on the full real specifications of MD4 and MD5, so
      there is no reduced-size object and no size extrapolation in the signal arm. The wavefront candidate
      runs at reduced sample count for this table only, which trades statistical precision for breadth
      and is stated as such: its verdict here is a coarse sign-and-magnitude judgement, and its precise
      value comes from its own dedicated run rather than from this one.'
    correspondence: null
  tail_checks:
  - The dummy candidate must fail; a pass halts interpretation of the whole table.
  - Each candidate must reproduce its own dedicated-run value on MD5 to within its stated tolerance,
    or the uniform interface has changed the measurement.
  - Null contrast distributions must be centred near zero for shape-symmetric candidates; a nonzero
    centre indicates a shape bias to report.
  - Halving the null sample must not move any verdict.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt if any candidate cannot be defined on both shapes; record it as not-applicable rather than
    forcing a number.
  - Halt if either primitive implementation fails its published test vectors.
  - Freeze the candidate list and directions before STAGE 3 and do not amend them afterwards.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Between one and four candidates pass the filter with the pre-declared sign, the
    dummy candidate fails, and at least one passing candidate has at most half its contrast reproduced
    by the 48-step-truncated MD5 control, with the whole table reproducible from the manifest seeds.
  falsification_criterion:
  - Zero or five candidates pass.
  - The dummy candidate passes.
  - Every passing candidate has more than half its contrast reproduced by the truncation control.
  - The two floor definitions disagree on a majority of candidates.
  - Any candidate's value under the uniform interface differs from its dedicated-run value beyond
    tolerance.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-e40ea1
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must fix the pre-declared direction for each candidate, since some directions
    are not obvious and choosing them after seeing values would void the filter.
  - A ruling is needed on whether the assumed MD4-versus-MD5 ordering, which comes from an UNVERIFIED
    provenance block, may be used as a filter direction at all, or whether the filter should report
    magnitudes only.
  - The construction of shape-matched null specifications for MD4's shape needs specification, since
    its multiplicity profile of three uses per word admits several natural null families.
