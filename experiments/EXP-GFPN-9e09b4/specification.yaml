# EXP-GFPN-9e09b4
# Word-product counts and ratios. No walk.
# Approved by DEC-20261002-66eda0.
experiment:
  id: EXP-GFPN-9e09b4
  hypothesis_id: H-GFPN-929a68
  source_idea: IDEA-20260920-0d218c
  question_id: RQ-GFPN-c01af8
  version: 1
  title: Word-product counts and ratios
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-66eda0
  objective: >-
    Check the schoolbook product, the 2-plus-3 split, the fold by
    z to the 5 equals 3, and the step-count ratios.
  inputs:
    prime: 18446744069414584321
    left: [1, 2, 3, 4, 5]
    right: [6, 7, 8, 9, 10]
    schoolbook_muls: 25
    unfolded: [6, 19, 40, 70, 110, 114, 106, 85, 50]
    folded: [348, 337, 295, 220, 110]
    split_parts: [6, 3, 6]
    split_muls: 15
    square_count: 15
    schoolbook_step: 140
    split_step: 90
    prime_field_step: 330
    schoolbook_ratio_num: 33
    schoolbook_ratio_den: 14
    split_ratio_num: 11
    split_ratio_den: 3
    written_low_num: 12
    written_low_den: 5
    written_low_gap_num: 3
    written_low_gap_den: 70
    written_high_num: 37
    written_high_den: 10
    written_high_gap_num: 1
    written_high_gap_den: 30
    above_two_num: 5
    above_two_den: 14
    above_three_halves_num: 6
    above_three_halves_den: 7
    tolerance_schoolbook: 21
    tolerance_split_num: 27
    tolerance_split_den: 2
    tolerance_written: 14
    fifth_power: 39135393
    fifth_threshold: 34420736
    tenth_power: 25937424601
    tenth_low: 15479341056
    tenth_high: 30958682112
    batch_sizes: [4, 8, 16, 32, 64]
    share_sum_num: 31
    share_sum_den: 64
    batch_product: 1048576
  controls:
    - >-
      The schoolbook ratio is 33/14. Reporting it as 12/5 invalidates
      the run.
    - >-
      Fifteen percent of 90 is 27/2. Reporting that tolerance as 14
      invalidates the run.
    - >-
      The folded constant term is 348. Reporting the unfolded constant
      term 6 as the folded value invalidates the run.
    - >-
      The split uses 15 multiplications. Reporting 25 for the split
      invalidates the run.
    - >-
      The batch shares sum to 31/64. Reporting the sum as 1
      invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - multiplier in {schoolbook, split}
    - route in {direct, composed}
  metrics:
    primary:
      - folded_constant
      - schoolbook_ratio
      - implementations_agree
    secondary:
      - split_muls
      - tolerance_split
      - share_sum
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The folded row and the ratio 33/14.
    formula: >-
      The schoolbook loop multiplies every pair of coefficients. The
      split multiplies the low thirds in six products, the high pairs
      in three products, and the cross terms in six products. High
      coefficients of degree at least 5 are multiplied by 3 and added
      to the coefficient 5 degrees lower. The schoolbook step is 5
      times 25 plus 15. The split step is 5 times 15 plus 15. The
      prime-field step is 6 times 55.
    source: >-
      IDEA-20260920-0d218c states the word-product counts, read
      2026-10-02. The products were computed in this design session.
      That computation is not a run. No walk was executed.
  scale_relevance:
    tier: toy
    justification: One coefficient pair of length 5. No transfer to a timed step.
    correspondence: null
  tail_checks:
    - The tenth-power comparison is required. Stopping after the fifth power and still reporting 25937424601 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the schoolbook ratio is reported as 12/5, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The schoolbook ratio is reported as 12/5.
    - The split tolerance is reported as 14.
    - The folded constant term is reported as 6.
    - The split multiplication count is reported as 25.
    - The batch-share sum is reported as 1.
    - A walk or a timed step is reported.
  success_criterion: >-
    Both runs agree that the schoolbook product uses 25
    multiplications, the folded row is 348, 337, 295, 220, 110, the
    split uses 15 multiplications, the steps are 140, 90 and 330, the
    ratios are 33/14 and 11/3, 15 percent of 90 is 27/2, and the
    batch shares sum to 31/64.
  falsification_criterion: >-
    The runs agree, the folded constant term stays 348, and any
    factor differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-GFPN-9e09b4/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-GFPN-9e09b4/runs/<RUN-ID>/command.txt
    - experiments/EXP-GFPN-9e09b4/runs/<RUN-ID>/stdout.log
    - experiments/EXP-GFPN-9e09b4/runs/<RUN-ID>/stderr.log
    - experiments/EXP-GFPN-9e09b4/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-GFPN-9e09b4/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any walk, timed step, or 320-bit curve.
    - Any claim that one field is faster than another.
    - Any rho ruler in word products beyond the integer ratios.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
