# EXP-ECDLP-58b086
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261003-9a29fc.
experiment:
  id: EXP-ECDLP-58b086
  hypothesis_id: H-ECDLP-e7ce51
  source_idea: IDEA-20261003-1142ba
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-10 table versus width-9 table
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-9a29fc
  objective: >-
    Check the table sizes 512 and 256, the product 131072, and the nearby gap 0.
  inputs:
    width_hi: 10
    width_lo: 9
    table_hi: 512
    table_lo: 256
    table_gap: 256
    table_product: 131072
    table_sum: 768
    nearby_a: 256
    nearby_b: 256
    nearby_gap: 0
    nearby_product: 65536
  controls:
    - >-
      Two to the power 9 is 512. Two to the power 8 is 256. Reporting
      both tables as size 256 drops the gap and invalidates the run.
    - >-
      Five hundred twelve exceeds two hundred fifty-six by 256. The
      product of the two sizes is 131072. Their sum is 768.
    - >-
      Two width-9 tables each store 256. Their gap is 0 and their
      product is 65536.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-10 table stores 512 entries. The width-9 table stores
      256. The gap of two width-9 tables is 0.
    formula: >-
      Compute 2 to the power 9. Compute 2 to the power 8. Subtract
      256 from 512. Multiply 512 by 256. Subtract 256 from 256.
    source: >-
      IDEA-20261003-1142ba states the widths 10 and 9 and the sizes
      512 and 256, read 2026-10-03. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 131072 and the nearby gap 0 are required. A check that stops at the size 512 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 512 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 9 is not 512.
    - Two to the power 8 is not 256.
    - The gap is not 256.
    - The product is not 131072.
    - Both tables are reported as size 256, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-10 table stores 512 entries, that
    the width-9 table stores 256, and that 512 exceeds 256 by 256.
  falsification_criterion: >-
    The runs agree that the width-10 table size is computed, and
    that size is not 512.
  required_artifacts:
    - experiments/EXP-ECDLP-58b086/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-58b086/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-58b086/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-58b086/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-58b086/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-58b086/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 256 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
