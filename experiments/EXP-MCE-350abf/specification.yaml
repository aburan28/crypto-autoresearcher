experiment:
  id: EXP-MCE-350abf
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-MCE-efa9b2
  question_id: RQ-MCE-e65b3c
  goal_id: GOAL-MCE-001
  source_idea_id: IDEA-20260805-554b9d
  assigned_to: executor

  title: >-
    Review-required contract: exact Prange baseline at the five Classic
    McEliece parameter sets, and a basis-parametric full-cost re-ranking of the
    ISD family under B1..B5, with a mu-zeroed null and a BSGS/rho positive
    control

  objective: >-
    If separately approved, frozen and authorized, produce two artifacts that
    this repository does not contain and that GOAL-MCE-001, GOAL-HQC-001 and
    GOAL-SDITH-001 each name as their first deliverable. (A) An EXACT concrete
    Prange cost at the five Classic McEliece parameter sets, in arbitrary-
    precision integer arithmetic, reported simultaneously under five declared
    accounting bases, from parameters already transcribed and independently
    recomputed by this goal's own BATCH-001 -- needing no external source at
    all. (B) A basis-indexed ranking table for a declared finite list of ISD
    variants under those same five bases, with the number of ranking inversions
    between the memory-free basis B1 and the Wiener full-cost basis B5 as the
    primary metric, computed against a mu-zeroed null arm whose inversion count
    is forced to zero and a BSGS/Pollard-rho positive control whose inversion
    MUST appear.

  what_this_is_not:
    - Not an attack on Classic McEliece, HQC, SDitH, or any other scheme.
    - Not a claim that any scheme is weaker or stronger than its published estimates.
    - Not a decoding computation, a syndrome-decoding solve, a key recovery, or a distinguisher.
    - Not the adoption of any costing convention, and in particular NOT an adoption of or binding to ISD-FC-2026, which DEC-20260802-344883 D-6 and DEC-20260803-a5b9b1 D-3 establish is not adopted and which this goal may not bind to.
    - Not a new asymptotic result; every exponent used for a published variant is transcribed, never derived here, and no exponent value is asserted by this contract.
    - Not an improvement to any exponent for any adversary. The only thing that can move is WHICH published exponent is the appropriate baseline for a future comparison.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has happened.
    - Not a re-attempt at iacr:2026/1232's PDF by any route.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      TOY, and RQ-MCE-e65b3c's ceiling is unchanged and unwaived. A completed
      run could support exactly this and no more: (i) that the exact expected
      Prange iteration count at the five parameter sets of
      mceliece-spec-20221023.pdf section 7 takes the computed values, and that
      the closed form w*log2(n/(n-k)) is a strict lower bound on its logarithm
      there; (ii) that a declared finite list of published (time, memory)
      exponent pairs, in named regimes and at published operating points,
      induces the computed rankings under five named bases. It could NOT support
      any statement about the security of any scheme, about the best possible
      algorithm under any basis, about memory-restricted variants nobody
      transcribed, or about any parameter set at any scale beyond arithmetic on
      published numbers. EV-MCE-332f99 O-8's scoping consequence is carried on
      the face of every table: the ISO parameter-set list contains no
      mceliece348864 variant, so "standardized parameter sets" excludes the
      lowest-claimed-category set.

  environment_measured_not_assumed: >-
    Recorded because two scouting reports of this session disagreed and the
    disagreement was resolved by measurement rather than by preference.
    Measured on this container: python 3.11.15; numpy 2.4.6 PRESENT;
    sage ABSENT (ModuleNotFoundError); sympy ABSENT (ModuleNotFoundError);
    fpylll ABSENT (ModuleNotFoundError); src/ic_first_fall_fast.py fails to
    import for want of sage. NO STAGE OF THIS CONTRACT REQUIRES ANY ABSENT
    PACKAGE. Every computation is pure-Python arbitrary-precision integer and
    fractions.Fraction arithmetic. If a future executor finds a different
    environment, the difference is recorded in the manifest and is an
    infrastructure observation, never a mathematical one.

  inputs:
    concrete_parameter_sets:
      source: >-
        ledger/evidence/EV-MCE-332f99.yaml observation O-1, transcribed from
        mceliece-spec-20221023.pdf sections 3 and 7 by TASK-20260803-f3aece and
        independently recomputed 5/5 by TASK-20260803-409c5e. The executor
        re-reads (m, n, t) from that record and MUST reproduce the five exact
        rates 85/109, 35/48, 157/209, 5413/6960, 51/64 as a precondition before
        computing anything else. A mismatch halts the stage.
      derived_quantities: "k = n - m*t; w = t; redundancy n - k = m*t"
      names: [mceliece348864, mceliece460896, mceliece6688128, mceliece6960119, mceliece8192128]
    accounting_bases:
      B1: RAM word-operations, memory free and unbounded
      B2: bit-operations, memory free and unbounded
      B3: logic gates (one 2-input Boolean gate), memory free and unbounded
      B4: gates plus a declared multiplicative memory-access charge, the charge stated as a formula and varied over a declared set
      B5: Wiener full cost, hardware quantity times time occupied, memory counted as hardware
      basis_taxonomy_source: >-
        coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-0100a5/isd_costing_convention.md
        section 2.1, READ. The TAXONOMY only. No rule, rate or number is taken
        from that document, which states in its own section 0 that it contains
        no arithmetic and is not a source of numbers, and which is NOT ADOPTED.
      conversion_policy: >-
        Every conversion between bases is written as an explicit formula in the
        artifact, with its assumed word width, its assumed gates-per-bit-
        operation, and its assumed access charge stated as symbols with declared
        values. No conversion factor may be applied without appearing in the
        conversion table.
    variant_list:
      policy: >-
        The list is DECLARED AND FROZEN before any transcription begins and may
        not be extended after any number is read. Declared list: Prange, Lee-
        Brickell, Stern, Dumer, MMT, BJMM, May-Ozerov, Both-May. Each row
        carries: variant name, regime label, time exponent, memory exponent,
        per-iteration success-probability exponent where published, source
        identifier, page or table reference, and obtained status.
      absent_policy: >-
        A row whose numbers cannot be obtained is recorded as ABSENT with the
        routes tried and is EXCLUDED from every ranking. It is never estimated,
        never interpolated, and never filled from memory. An ABSENT row is an
        infrastructure observation.
      regime_labels: [full_distance, half_distance, constant_relative_weight, sublinear_weight]
      cross_regime_rule: >-
        Rows carrying different regime labels are NEVER compared. The ranking is
        computed once per regime label and a regime with fewer than three
        obtained rows produces no ranking.
    synthetic_inputs_needing_no_source:
      mu_ladder: "one fixed tau_0, with mu in {0.00, 0.25, 0.50, 0.75, 1.00} * tau_0"
      positive_control_pair: "BSGS and Pollard rho on a generic group of order N: step exponents 1/2 and 1/2; full-cost exponents 2/3 and 1/2 per KN-TECH-035"
      regime_sweep_points: "relative weight W = w/n at five or more points from the half-distance value down to t/n at mceliece6960119"
    seeds:
      policy: >-
        THIS EXPERIMENT IS FULLY DETERMINISTIC AND USES NO RANDOMNESS. There is
        no sampling, no simulation and no seeded stream anywhere in it, so there
        is no seed and none is fabricated. Reproducibility is by DECLARED
        CONSTRUCTION: given the same (m, n, t) triples and the same transcribed
        exponent table, every number in the output is a deterministic function
        of the inputs, and a third party reproduces the artifacts bit-for-bit by
        re-running the same code on the same declared inputs.
      required_commitment: >-
        SHA-256 of the canonical UTF-8 serialisation of (a) the five (m, n, t,
        k, w) tuples, one per line, and (b) the frozen variant list with its
        regime labels, recorded BEFORE any transcription begins.
    arithmetic_policy: >-
      Arbitrary-precision Python integers throughout. Binomial coefficients by
      exact integer products, never by floating-point gamma functions. Base-2
      logarithms of large integers computed as int.bit_length() plus a
      fractions.Fraction correction to a declared precision, never by float(x)
      on a number that overflows a double -- k*(n-k) reaches 8,373,911 bits at
      mceliece6960119 and a naive float call is an overflow, not a rounding.

  arms_and_controls:
    treatment: >-
      The transcribed variant list, ranked under each of B1..B5, per regime
      label, with the inversion count between B1 and B5 reported per regime.
    measured_null: >-
      NULL-MU-ZERO. The IDENTICAL variant list with every memory exponent set to
      0, run through the IDENTICAL ranking pipeline. FORCED VALUE, DERIVED
      BEFORE THE RUN: the inversion count between B1 and B5 is EXACTLY 0, as an
      integer, because with mu = 0 the full-cost exponent tau + mu equals the
      time exponent tau for every row and the two orderings are literally the
      same list. THIS NULL CAN FAIL -- a per-row wiring term, a sort
      instability, an off-by-one, or a tie-breaking rule that consults memory
      would each produce a nonzero -- and if it does fail, the pipeline
      manufactures inversions and NO number from any other arm may be reported.
    positive_control: >-
      CTRL-BSGS. The pair {BSGS, Pollard rho} on a generic group of order N,
      fed through the identical pipeline. REQUIRED OUTCOME, DECLARED BEFORE THE
      RUN: full-cost exponents 2/3 for BSGS and 1/2 for rho, each to within
      0.001, with the pair tied-or-BSGS-favoured under B1 and strictly
      rho-favoured under B5. This is the canonical published instance of exactly
      the phenomenon the experiment exists to detect (KN-TECH-035, relaying
      KN-LIT-094 which was NOT READ). IF IT FAILS, THE INSTRUMENT IS BROKEN AND
      NO NEGATIVE RESULT ABOUT ISD MAY BE REPORTED AT ALL.
    graded_control: >-
      CTRL-LADDER, five interior points, monotonicity reported. The synthetic mu
      ladder at fixed tau_0. FORCED: the count of ladder members beating a fixed
      Prange row under full cost is NON-INCREASING across mu in {0, 0.25, 0.5,
      0.75, 1.0}*tau_0, and equals at each point the count of members satisfying
      tau_0 + mu < tau_Prange. A non-monotone result localises the fault inside
      the comparator rather than leaving "it did not work".
    ordering_control: >-
      The null arm, CTRL-BSGS and CTRL-LADDER are computed, their outputs
      hashed, and those hashes committed BEFORE any transcribed exponent enters
      the pipeline. The pass/fail rule for each is written into this contract
      and is not revisable afterwards. A pipeline tuned after the real numbers
      are seen is not an instrument, and EV-IC-002 is this program's own
      precedent for a support verdict retracted because a criterion was revised
      after the prior criterion was observed to fail.
    comparability_policy: >-
      No number produced here may be compared with any number in
      GOAL-HQC-001's or GOAL-SDITH-001's artifacts without a separately
      registered comparator contract naming both bases, both regimes, both
      parameter sources and the comparison statistic. A shared basis LABEL does
      not imply a shared conversion table.

  independent_variables:
    - accounting basis, B1..B5
    - regime label, over the four declared values
    - relative weight W = w/n, over the declared sweep points
    - memory exponent mu, over the synthetic ladder

  metrics:
    primary:
      - >-
        FV-1 sign: sign of [log2 C(n,w) - log2 C(n-k,w)] - w*log2(n/(n-k)) at
        each of the five parameter sets, exact arithmetic.
      - >-
        n_inversions(B1, B5): the number of ordered variant pairs whose relative
        order under B1 differs from their order under B5, reported per regime
        label, on the treatment arm AND on the null arm.
      - >-
        The concrete Prange cost at each of the five parameter sets under each
        of the five bases, as an exact integer or an exact rational log2.
    secondary:
      - FV-1b relative gap (exact - approx)/exact at each parameter set.
      - FV-2 residual |mu_V - (tau_V - iota_V)| per list-based variant with a published success probability.
      - CTRL-BSGS full-cost exponents, to three decimals.
      - CTRL-LADDER member counts at the five mu points, with monotonicity stated as a boolean.
      - Graded regime sweep phi_V - phi_Prange as a function of W, with monotonicity and any crossing point to three significant figures.
      - Per-variant classification RESIDENT / STREAMING / UNCLASSIFIED with its textual basis (HEUR-FC-1).
      - Count of ABSENT rows and, for each, the routes tried.

  heuristic_under_test: HEUR-FC-2

  preregistered_prediction:
    quantity: >-
      Two quantities are pre-registered, and they are of different kinds, which
      is stated so neither is read as the other. (1) FV-1, a FORCED VALUE with a
      one-line proof. (2) n_inversions(B1, B5) on the treatment arm, a
      CONDITIONAL existential whose antecedent is an inequality on numbers not
      yet read.
    formula: >-
      (1) log2 N_it = sum_{i=0}^{w-1} log2((n-i)/(n-k-i)) and each factor is
      strictly increasing in i because d/di[(n-i)/(n-k-i)] = k/(n-k-i)^2 > 0 for
      k > 0; hence log2 N_it > w*log2(n/(n-k)) STRICTLY, at all five sets, with
      relative gap below 0.05.
      (2) n_inversions(B1, B5) >= 1 with (Prange, BJMM) among the inverted
      pairs, CONDITIONAL ON the transcribed numbers satisfying
      mu_BJMM > tau_Prange - tau_BJMM. NO EXPONENT VALUE IS ASSERTED ANYWHERE IN
      THIS CONTRACT. If the proviso fails, prediction (2) was conditional and is
      not falsified; the reported result is the negative table and its exact
      margins, which is the deliverable all three code-based goals named first.
      Null arm: n_inversions(B1, B5) = 0 EXACTLY, no tolerance.
    source: >-
      (1) derived in H-MCE-efa9b2 mechanism step 5, in this repository, from
      elementary calculus; no external citation. (2) derived in H-MCE-efa9b2
      mechanism steps 1-3 from the full-cost model as stated in KN-TECH-035,
      whose own source KN-LIT-094 was NOT READ and is not cited as an authority.

  scale_relevance:
    tier: toy
    justification: >-
      The concrete half is EXACT ARITHMETIC AT THE REAL PARAMETER SETS, not a
      scaled-down proxy, so it does not extrapolate -- but it is arithmetic on
      published parameters and a formula, not a measurement of any adversary, so
      it remains toy under RQ-MCE-e65b3c's ceiling and may never be presented as
      a security evaluation. The asymptotic half is a statement about published
      exponents in named regimes and transfers to no finite n at all: at
      n = 6960 an exponent difference of 0.005 is roughly 35 bits and an
      unextracted polynomial cofactor can be 30, so the asymptotic table and the
      concrete table are two separate artifacts and NEITHER MAY BE USED TO ARGUE
      THE OTHER. That prohibition is a stopping rule below, not advice.
    correspondence: >-
      null. There is no sampling correspondence and none is needed: nothing is
      sampled anywhere in this contract.

  tail_checks:
    - >-
      The exact log2 N_it at the SMALLEST parameter set (mceliece348864) and at
      the LARGEST (mceliece8192128) are both recomputed by a second, independent
      code path -- one using integer binomials and one using the sum-of-logs
      form -- and must agree to within one part in 10^9. A disagreement is an
      arithmetic-precision failure, not a result.
    - >-
      The Gaussian-elimination cost model is evaluated at its two declared
      extremes ((n-k)^2 * n and (n-k)^3) and both are reported, so the reader
      sees the span rather than one choice presented as the answer.
    - >-
      The FV-1 relative gap is reported alongside the crude bound
      w*log2((n)/(n-k-w)) as an upper companion, so the exact value is bracketed
      on both sides rather than only bounded below.

  replication:
    seeds: []
    seeds_note: >-
      EMPTY AND CORRECT. The experiment is deterministic and uses no randomness,
      so there is no seed to record and none is invented. Reproducibility is by
      declared construction plus the input hash commitment above.
    independent_instances: 5
    independent_instances_note: >-
      The five Classic McEliece parameter sets. Independent as inputs, not as
      random draws.
    interpretation: >-
      A single execution is a design-validation computation. It cannot support,
      reject or validate any claim about any scheme, and the only replication
      that matters here is INDEPENDENT RECOMPUTATION by a second reader, which
      is required below.

  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
    network: >-
      STAGE 1 AND STAGE 3 REQUIRE NO NETWORK AND MUST BE RUNNABLE WITH IT
      DISABLED. Stage 2 (transcription) requires network and is separately
      budgeted at 10800 wall-clock seconds. iacr:2026/1232's PDF is NOT
      re-attempted by any route.

  stage_order_and_termination:
    stage_0: >-
      Zero compute. Re-derive H-MCE-efa9b2 mechanism steps 1-4 on paper and have
      them attacked by the reviewer. THIS STAGE CAN TERMINATE THE ENTIRE LINE at
      no cost: a correct counterargument to FC >= M*T for resident memory, or to
      the parallelisation-invariance argument, kills the comparator and nothing
      further should be computed.
    stage_1: >-
      Pure-Python integers, seconds, no network. FV-1, FV-1b, the tail checks,
      and the concrete Prange baseline under all five bases. THIS STAGE IS
      DECISIVE FOR THE CONCRETE DELIVERABLE INDEPENDENTLY OF EVERYTHING
      DOWNSTREAM, and a FV-1 sign failure halts every later stage.
    stage_1b: >-
      Pure-Python, seconds, no network. The null arm, CTRL-BSGS and CTRL-LADDER,
      with their outputs hashed and committed BEFORE stage 2 begins.
    stage_2: >-
      Transcription, network, separately budgeted, and NOT AUTHORIZED BY THIS
      CONTRACT. Each row obtained is independently re-read by a second reader
      and the two readings are compared field by field before the row is
      admitted -- the transcription-fidelity discipline GOAL-HQC-001 BATCH-001
      established after its own RS-S3 minimum-distance error.
    stage_3: >-
      Pure-Python, seconds. phi per row, the basis-indexed ranking, the
      inversion counts, FV-2, and the graded regime sweep.
    cheapest_decisive_gate: stage_0, then stage_1

  stopping_rules:
    - Do not execute unless this contract is separately reviewed, approved, frozen, archived and explicitly authorized. Only the Coordinator approves (AGENTS.md rule 1); no approved_by field is present because this is not approved.
    - Stop the whole line at stage 0 if the full-cost derivation is refuted.
    - Stop before any ranking is computed if the null arm returns a nonzero inversion count.
    - Stop before any ranking is computed if CTRL-BSGS does not return 2/3 and 1/2 to within 0.001.
    - Stop the regime arm if the sweep is non-monotone or shows more than one sign change for any variant.
    - Stop stage 2 for a given row the moment the two independent readings disagree, and record the disagreement rather than adjudicating it inside the producing task.
    - Stop and report if fewer than three rows are obtained for a regime label; no ranking is computed for that regime.
    - Do not compute a single "the" ISD cost. Every number is emitted under all five bases or not at all.
    - Do not use the asymptotic table to argue anything about the concrete table, or the reverse.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any exponent value entered from memory rather than from an obtained source, or any ABSENT row filled by estimation or interpolation.
    - Any comparison between rows carrying different regime labels.
    - Any base-2 logarithm of a quantity exceeding double precision computed by a float call rather than by the declared exact method.
    - Any adoption of, or binding to, ISD-FC-2026 or any other costing convention.
    - Absence of the pre-transcription hash commitment, or any modification to the null arm or the controls after a transcribed number has been read.
    - Any conversion factor applied that does not appear in the conversion table.
    - Any statement about the security of Classic McEliece, HQC or SDitH anywhere in the produced artifacts.

  infrastructure_failure_disposition: >-
    A timeout, crash, missing dependency, unreachable source, HTTP 403, or
    exhausted budget is recorded as an INFRASTRUCTURE OBSERVATION with its exact
    symptom, and is NEVER negative mathematical evidence (AGENTS.md rule 5). In
    particular: a source that cannot be obtained produces an ABSENT row, not a
    zero, not an estimate and not a conclusion that the variant does not exist;
    and a blocked route is a recorded outcome. The eprint block on
    iacr:2026/1232 is already established as PATH-scoped and reproducible
    (EV-MCE-332f99 O-9) and is not to be re-tested here.

  success_criterion: >-
    This contract has NO CURRENT SUCCESS OUTCOME because it is not authorized for
    execution; its only present disposition is "review_required draft". If a
    separately approved, frozen and authorized successor is executed, its only
    positive disposition is a COMPLETE INSTRUMENT READOUT, defined as ALL of:
    (a) FV-1 strictly positive at 5 of 5 with FV-1b below 0.05 and both tail
    checks passing; (b) the null arm returning inversion count exactly 0;
    (c) CTRL-BSGS returning 2/3 and 1/2 to within 0.001 with the B1-to-B5 order
    change present; (d) CTRL-LADDER monotone non-increasing across all five mu
    points; (e) the concrete Prange baseline emitted at all five parameter sets
    under all five bases with every conversion factor stated as a formula;
    (f) a variant table in which every row is either fully obtained with a
    second reader's confirmation or explicitly ABSENT with routes tried; and
    (g) inversion counts reported per regime for the treatment arm.
    NOTE EXPLICITLY: the VALUE of the treatment inversion count -- zero or
    nonzero -- IS NOT PART OF THE SUCCESS CRITERION. A zero count is a complete,
    successful, reportable readout and is the negative closure all three
    code-based goals asked for. This is written into the criterion so that a
    negative cannot later be presented as a failed batch.

  falsification_criterion: >-
    The hypothesis H-MCE-efa9b2 is falsified by ANY of: FV-1 non-positive at any
    parameter set (falsifies H1-C and the concrete derivation); a correct
    counterargument at stage 0 to FC >= M*T or to parallelisation invariance
    (falsifies H1-A, the whole comparator); a published source located that
    already performs the full-cost or area-time re-costing of the ISD family
    (falsifies the novelty claim, which is then withdrawn in a superseding
    record); or a nonzero null-arm inversion count (falsifies the instrument,
    not the hypothesis, and blocks all reporting). A treatment inversion count
    of zero falsifies H1-B specifically and IS REPORTED AS THE PLANNED NEGATIVE
    with its obstruction (memory exponents small relative to the time
    advantage), its exact scope (these variants, these operating points, these
    regimes, these five bases), and its forward guidance (memory-restricted
    MMT/BJMM variants; KN-LIT-27f923 and KN-LIT-4388b3 quantum and hybrid
    resource estimates; KN-LIT-fa9bc8's sub-linear-weight analysis). A negative
    lacking any of those three components is a fatigue report under
    inventor-protocol section 4, its honest status is unverified, and it does
    not discharge this contract.

  required_artifacts:
    - The approved frozen specification and a freeze receipt binding its SHA-256.
    - The pre-transcription input hash commitment (five parameter tuples, frozen variant list).
    - Stage-1 output - exact log2 N_it per parameter set by two independent code paths, FV-1 sign and FV-1b gap, the concrete baseline under all five bases, and the full conversion table.
    - Stage-1b output - null-arm inversion count, CTRL-BSGS exponents, CTRL-LADDER counts, each with its hash committed before stage 2.
    - Stage-2 output - the variant table with per-row source, page or table reference, regime label, obtained/ABSENT status, both readers' readings, and the routes tried for every ABSENT row.
    - Stage-3 output - phi per row, five basis-indexed rankings, inversion counts per regime, FV-2 residuals, regime sweep with monotonicity.
    - The RESIDENT/STREAMING/UNCLASSIFIED classification per variant with its textual basis.
    - Complete manifest - exact commands, git commit and dirty-tree state, environment and dependency versions, resolved model identifier and probe status, stdout, stderr, timestamps, resource measurements, validity status and reason.
    - A snapshot archive followed by independent Validator and Red Team review, per GOAL-MCE-001 completion criterion 3.

  approval_requirements:
    - Independent review confirms that the null arm can actually fail, that CTRL-BSGS is a genuine sensitivity demonstration, and that no basis is adopted.
    - Independent review confirms that no exponent value appears anywhere in this contract and that the treatment prediction is stated as a conditional.
    - The Coordinator separately approves and freezes a successor contract without editing this draft.
    - Separate authorization is obtained before any network stage, and GOAL-MCE-001's committed next_action is not overridden by this contract.

  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved and only the Coordinator may approve it (AGENTS.md rule 1).
