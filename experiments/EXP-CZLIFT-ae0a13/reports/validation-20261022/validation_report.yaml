    - check: specification sha256 (7ace1b10...) in environment.json == trial-plan == file == snapshot receipt
      result: match
    - check: plan_sha256 in execution receipts == trial-plan.json bytes == snapshot receipt (e2f93bfb...)
      result: match
    - check: snapshot-receipt hashes of spec, run.py, check.py, czlift.py, czlift_run.py, toycurve.py, H-CZLIFT-6d4ed1.yaml vs HEAD
