      blind_stdout.txt: a86f9e099ef37fa1e8190d89d6bf17931a3cedb232d01b02f897a2c1eb6d8346
    statement_finding: >-
      review_plan.blind_rederivation.quantity names "two anomalous primes" and
      v_p(z([p]s_tor(P))), while the specification and hypothesis concern non-anomalous
      curves with n != p (anomalous curves are out of scope; EXP-CZLIFT-17b7eb). The
      Coordinator should correct the statement in any reissued plan.
    reading_A_literal_anomalous: >-
      j = 0, #E = p, at p in {61, 127, 271, 331, 397, 547}; primary two are 61 and 127. The
      spec formula is undefined (p is not invertible mod p^4). The integer CM model gives
      v_p(z([p]P^)) >= 2 for every Hensel start, so a split extension and a p-torsion lift T
      exists. T agrees between the two starts mod p^4 and is stable between working
      precision 5 and 6. [p]T = O, v_p(z([p]T)) >= 5 (working precision), and the
      homomorphism holds 8/8 per prime. The non-canonical lift y^2 = x^3 + p c x + B gives
      v_p(z([p]P^)) = 1. There is no producer counterpart.
    reading_B_spec_consistent: >-
      142 non-anomalous j = 0 curves over 43 primes, p = 1 mod 3 in [50, 600]; primary two
      are 67 and 577. F1 and F2 from two starts agree 4-way on every curve. [n]s_tor = O mod
      p^4; homomorphism 1136/1136; reduces to P; v_p(z([n]s_tor)) >= 4 (vanishes);
      v_p(z([n]P^)) = 1 on all 284 Hensel starts; literal v_p(z([p]s_tor)) = 0. F1 cost mean
      55.14 (validator convention), max 72, all within bound. In phase 2 the same sealed
      functions agree with the producer's s_tor on 1116/1116 replayed pairs.

  verdict: passed
  verdict_basis: >-
    The receipts are complete, hash-bound to a Coordinator-committed snapshot, produced by
    the frozen launcher at a commit descending from the freeze commit, and every frozen
    metric and control recomputes exactly from raw-result.json (and from a full independent
    replay). The deviations below change no recorded value and no criterion outcome. They
    are disclosed for the review-evidence step. This verdict makes the two receipts
    admissible evidence only.

  limitations:
    - >-
      Unregistered exclusion: 36 of 1152 attempted samples (19 + 17) were skipped (S = O at
      d2 = n-1) with no excluded count or reason in the manifest. This is outcome-independent
      and does not bias the metrics, but realized per-curve counts are below the
      specification's 16 on 12 curves per seed.
    - >-
      arm_difference.hensel_random z_score is null on seed 20261009 (0 successes in both
      arms). The frozen criterion "|z| <= 3" is not numerically evaluable on that entry as
      recorded. Its difference is 0.0.
    - >-
      The archived checker shares the producer's measure_curve and summarize and replays 2 of
      36 curves. Its exit 0 is not independent evidence; the validator's recomputation and
      full replay are.
    - >-
      The canonicity control's two Hensel starts differ in one p-adic digit and coincide on 5
      of 1116 rows. The independence from the start is supported by the validator's
      three-digit-random starts and the F2 projection.
    - >-
      Detection resolution: the frozen 4-sigma test cannot detect a section whose success
      rate is below about 1.8-3.0% (3.9x-4.7x the random rate) on one arm and seed. A
      negative result closes only leaks at least that large, at toy scale (p <= 600,
      k = 4, three structured sections).
    - >-
      The Teichmuller hom_prec2 excess on j = 0 curves is an unexpected secondary
      observation, attributed here to the order-3 automorphism, which is not otherwise
      verified.
    - >-
      Citation provenance: H-CZLIFT-6d4ed1 cites Katz (Serre-Tate local moduli) as recalled
      with verified_by null, for the canonical-lift role of the cm arm. The CM models are
      "recalled, not retrieved" but j-checked exactly. This is not load-bearing for receipt
      admissibility. It does bear on interpreting the arm comparison, which is not owned in
      this round (PD-1).
    - Environment lacks package versions (runtime_lock null) and peak memory; both are immaterial at toy scale but are recording gaps.
    - >-
      J3's literal statement (anomalous primes) does not match this contract, so the
      literal reading has no producer value to compare. Agreement is established for the
      spec-consistent reading only.
    - Interpretation and scope joints (what these measurements say about H2) are not owned by this report (PD-1); no red team ran.

