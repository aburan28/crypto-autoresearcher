    - check: resources
      result: >-
        Wall time 1.25 s and 0.96 s (driver monotonic bracket) against an advisory 600 s and
        a 900 s watchdog. No peak-memory record. Both are toy-scale runs.
    - check: coverage
      result: >-
        2/2 trials, 36/36 curves per seed. The specification's 16 samples per curve were
        attempted, but 557 of 576 and 559 of 576 pairs were measured; see the borderline
        probe in metric_recomputations.
    - check: invalidation rules
      result: >-
        harness.czlift.self_test() passes at HEAD (142 checks; harness bytes equal to the
        executing commit). tests/test_czlift.py: 5 passed. Both arms are non-empty. The
        checker reproduces the first curve of each arm, and the validator replay reproduces
        all 36 curves.

  metric_recomputations:
    - scope: both seeds, every metric in manifest.result.metrics (79 values per seed)
      method: validator code from raw-result.json rows (j2_recompute.py), written before reading check.py/run.py
      result: 0 mismatches after the frac_valuation_1 convention was identified (first pass preserved in j2_recompute_firstpass_*)
      conventions_identified:
        z_score: (success_rate - mean(1/p)) / sqrt(ref (1 - ref) / n); exact Poisson-binomial SE changes |z| by < 0.003
        arm_difference_z: pooled two-proportion z; undefined (recorded null) when pooled rate is 0
        frac_valuation_1: fraction of rows with vP == 1 (equals fraction ratio_defined in these data)
        identity_rate: all rows (identical to defined-rows rate; 0 identity failures)
        torsion_cost_within_bound: producer compares summed cost to summed bound; the validator also checked row-wise, with 0 violations and min slack 15 additions
    - seed: 20261009
      values: >-
        Five torsion rates 1.0 (0 failures of 557). identity_rate 1.0 for all sections and
        arms. Section z on each arm: hensel_random -1.274/-1.090; naive +1.878/-1.090;
        teichmuller -0.486/-1.090; max |z| 1.878. arm_difference z: hensel_random null
        (difference 0.0), naive 1.421, teichmuller 0.709. torsion_cost_mean_additions 58.0395.
    - seed: 20261010
      values: >-
        Five torsion rates 1.0 (0 failures of 559). identity_rate 1.0. Section z: hensel_random
        +0.079/-0.149; naive -1.379/-0.149; teichmuller -0.650/-0.149; max |z| 1.379.
        arm_difference z: -0.035, -1.446, -0.534. torsion_cost_mean_additions 55.2361.
    - criteria_evaluation_by_validator:
        success_criterion: >-
          Met on both seeds for every entry that is defined. The exception is
          arm_difference.hensel_random on seed 20261009, whose recorded z_score is null and so
          cannot be compared with 3. The difference is exactly 0.0 (0/371 vs 0/186). Under a
          reference-rate SE the z is 0.000. Whether null counts as |z| <= 3 is for the
          review-evidence step to decide.
        falsification_criterion: not triggered on either seed under any convention computed
    - borderline_probe: silent sample exclusion
      finding: >-
        run.py lines 87-88 skip a sample (continue) when Q, R2 or S is O or has y = 0. The
        instrumented replay shows every one of the 19 (seed 20261009) and 17 (seed 20261010)
        skipped samples is S = P + [d2]P = O with d2 = n-1. Expected counts under that rule
        are 13.84 and 20.72 (P(X >= 19) ~ 0.11). The rule depends only on d2, which drives
        the homomorphism check, and is independent of P, d and every section lift, so it
        does not bias the success, identity or z metrics. The specification does not state
        this exclusion, and the manifest has no excluded-sample count or reason; only
        pairs_total reveals it. 12 curves per seed have fewer than 16 rows (worst: p = 97,
        n = 11 with 10 rows). The rule lives in the frozen, hash-bound run.py approved with
        the trial plan, so this is a specification-documentation gap, not an executor
        deviation.
      raw_rows: listed per drop (arm, p, n, d, d2) in replay_probe_stdout.txt / replay_probe_output.json
    - borderline_probe: undefined ratios
      finding: >-
        The undefined-ratio rows are hensel_random 1+6, naive 3+4 and teichmuller 3+3 (seed
        20261009 + seed 20261010). All have vP = 2, vQ = 1, and all are counted as
        non-successes, as the tail check requires. Rows with vP = 1 and vQ = 2 are counted as
        defined ratio 0, with success iff d = 0 mod p, and none succeeded. Nothing has
        valuation >= 3 on a non-torsion section.

  control_checks:
    - control: two independent Hensel starts for s_tor (canonicity)
      result: >-
        canonicity_rate 1.0 on both seeds. Limitation: the two starts are x = x0 + p*eps with
        eps in [0, p), varying one p-adic digit, and coincide on 2 + 3 rows (eps1 == eps2).
        The validator's blind starts vary three digits (F1 and F2) and agree with the
        producer on every pair.
    - control: random_naive arm (arbitrary integer lift) vs cm_canonical arm
      result: >-
        Both arms present on both seeds; arm-difference z values as above. The cm arm's CM
        models are recalled from Cremona but checked by exact j-invariant (cm_self_test
        passes). The blind reading A independently shows that the integral j = 0 model
        behaves as the canonical lift at anomalous primes: v_p(z([p]P^)) >= 2 on the integer
        model and = 1 on y^2 = x^3 + p c x + B. That check covers D = -3 only.
    - control: tau-identity as an exact theorem
      result: identity_rate 1.0 on all sections, arms and seeds; 0 failures in 3 x 1116 section-rows
    - control: d in [2, n-2], compared mod p
      result: confirmed in run.py line 82 and in replayed rows; d = +-1 never sampled
    - control: independent checker
      result: >-
        check.py exits 0 on both runs. It is not independent of the producer: it imports
        run.py's measure_curve and summarize. It replays only the first curve of each arm
        (2 of 36), does not compare row counts with samples, and does not evaluate the
        success or falsification criteria. The validator's own recomputation and full replay
        cover these gaps and agree.
    - control: null object for the success-rate measurement
      result: >-
        The reference 1/p is analytic. hensel_random serves as the empirical null of the same
        shape, with 0/557 and 3/559 successes, consistent with 1/p. PTM-1 is the positive
        control at rate 1. At the frozen 4-sigma threshold the instrument flags only a
        section succeeding at >= 0.0180/0.0296 (cm/random, seed 20261009) or 0.0195/0.0301
        (seed 20261010), i.e. 3.9x-4.7x the random rate.
    - control: tail check homomorphism_rate_prec2 near 1/p for non-torsion sections
      result: >-
        No value is near 1, so no section accidentally equals s_tor. Unexpected observation,
        preserved: teichmuller cm_canonical is 0.0212 (8/378) on seed 20261010 against a 1/p
        reference near 0.005. The excess sits on j = 0 curves (3 vs 0.89 expected; 7 vs
        0.30). All 10 such rows have d2 a nontrivial cube root of unity mod n, and every j = 0
        row with such a d2 is a hit (3/3 and 7/7). This is consistent with the order-3
        automorphism (x, y) -> (zeta x, y) commuting with the Teichmuller lift. It is a
        secondary metric with no frozen criterion; the explanation is the validator's,
        verified only by that d2 coincidence.

  heuristic_validation_checks:
    - check: pre-registered prediction
      result: >-
        heuristic_under_test is null. The preregistered_prediction (torsion rates = 1,
        identity = 1, |z| <= 4, arm |z| <= 3, cost within bound) is in the specification
        frozen at 6756a756 (2026-10-09 16:02:21Z), before the runs started (16:04:30Z).
    - check: sample integrity and scale binding
      result: >-
        Sample count, seeds and procedure are in the manifest and command. Tier toy: p <= 600,
        n <= 613, precision 4. No crypto-scale statement is made. The scale limitation is
        stated in the specification.

  cost_model_checks:
    - check: unit and bookkeeping of torsion_cost_mean_additions
      result: >-
        The unit is complete projective additions over Z/p^4 (the Renes-Costello-Batina
        formula, counting doublings). Cost is mul_count(n) + mul_count(n^{-1} mod p^4) + 1,
        computed by formula; it equals the add calls of the producer's right-to-left
        double-and-add, which starts from O. On every pair it is exactly 2 more than the
        validator's left-to-right convention (initial O + A per scalar), a counting
        convention, not an error. Pooled mean over 1116 pairs is 56.64 (58.04 and 55.24 per
        seed), consistent with "about 56". Row-wise bound 2(bits(n)+bits(p^k))+1 holds on
        every row. Memory is not reported; this is not a cost-to-break table, so no
        inverse-success-probability bookkeeping applies.
