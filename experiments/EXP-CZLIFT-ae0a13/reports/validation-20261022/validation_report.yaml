  joint_summaries:
    J1: >-
      Custody intact. 59/59 hash checks match (every execution-receipt artifact_sha256
      entry, every ledger-receipt path_sha256 entry for both run dirs, every source hash in
      environment.json vs trial-plan.json vs the bytes at HEAD, the specification hash and
      the plan hash e2f93bfb... vs the snapshot receipt). Each run dir holds exactly the 10
      receipted files, none unlisted or missing. command.txt and launch.json argv equal the
      frozen trial-plan argv with {run_dir} substituted; trial ids, seeds (20261009,
      20261010), returncode 0 and check_returncode 0, status output_validated. Executing
      commit 03479a00 is a descendant of the freeze commit 6756a756 with no diff in harness/
      or experiments/EXP-CZLIFT-ae0a13 between them, and the five source files at 03479a00
      hash to the recorded values; run files unchanged from ledger archive 48c8727e to HEAD.
      Coverage: 2/2 planned trials; 36/36 curves (24 cm from a pool of 429 + 12 random at
      the 12 frozen primes), and the curve lists rebuilt from both seeds equal the raw lists.
      Deviation recorded under J2: 16 attempts per curve were made, but 19/576 and 17/576
      samples were skipped by an exclusion rule the specification does not state.
    J2: >-
      Every frozen success and falsification metric recomputes exactly from raw-result.json
      on both seeds: 79/79 compared values per seed, 0 mismatches, with my own code
      (j2_recompute.py) written before check.py or run.py were opened. The one first-pass
      difference was my convention guess: frac_valuation_1 = fraction(vP == 1) (equal to
      fraction ratio_defined), not fraction(vP == vQ == 1). It matches the record in 18/18
      cells, and the first pass is preserved. Manifest metrics equal raw metrics, and
      stdout.log is the raw subset. The checker receipt agrees, but the checker is not
      independent of the driver (see control_checks). A full instrumented replay reproduces
      557/557 and 559/559 rows byte-for-byte. Borderline probes: (a) 36 silent sample
      drops, all S = P + [d2]P = O (d2 = n-1), outcome-independent; (b) arm_difference
      hensel_random on seed 20261009 has z_score null (0/371 vs 0/186, pooled SE 0);
      (c) d = +-1 cannot occur (d drawn in [2, n-2]); (d) no ties or singular cases; every
      undefined-ratio row is vP=2, vQ=1 and counted as a non-success; there are no
      successes on undefined ratios.
    J3: >-
      The blind statement is internally inconsistent with the specification. It asks for
      "anomalous primes", but the specification requires a prime n != p dividing #E and
      excludes anomalous curves, and on an anomalous curve n^{-1} mod p^k is undefined. Both
      readings were derived and sealed before any blind_from path was opened (SEAL.sha256).
      Reading B, consistent with the specification (j = 0, non-anomalous, prime n | #E,
      n >= 11): the validator's s_tor via the spec formula F1 and via the independent
      projection F2 = [e]P^ (e = 1 mod #E, e = 0 mod p^3), two Hensel starts each, equals
      the producer's s_tor(P) mod p^4 on every replayed pair: 557/557 (seed 20261009) and
      559/559 (seed 20261010). On j = 0 curves alone this is 172/172 at
      p in {67,79,151,193,241,283,439,457,463,499,571} and 80/80 at p in {139,271,277,379,547}.
      Also agreeing: [n]s_tor = O mod p^4; the homomorphism (blind 1136/1136); and
      v_p(z([n]s_tor)) = 4 = k (blind min 4; producer torsion vP = vQ = 4 on all 1116 rows).
      The literal v_p(z([p]s_tor)) = 0 in reading B, because [p]s_tor is not a formal-group
      point. Reading A (literal, anomalous j = 0 at p in {61,127,271,331,397,547}) has no
      producer counterpart in this contract. It is reported as a sealed blind result only.
    PTM-1: >-
      The proves-too-much object behaves as required. s_leak(R) = s_tor(R) + [log_P R]T^,
      with T^ the fixed formal-group point z = p (and z = p^2), was pushed through the
      producer's own smart_ratio, its success rule (ratio == d mod p) and summarize().
      Success rate is 1.0 on cm_canonical and random_naive on both seeds (n = 371/186 and
      378/181; z = 291/171 and 274/167). The instrument therefore detects a planted leak and
      does not prove too much. In-control: the torsion section itself gives an undefined
      ratio (vP = vQ = 4) and success rate 0.0 on every row.

  artifact_checks:
    - check: execution-receipt artifact_sha256 vs sha256 of files (9 entries x 2 runs)
      result: 18/18 match
    - check: ledger-receipt path_sha256 vs files (10 files x 2 runs)
      result: 20/20 match; no file in either run dir is absent from the ledger receipt
    - check: environment.json source_sha256 == trial-plan source_sha256 == bytes at HEAD (5 files x 2 runs)
