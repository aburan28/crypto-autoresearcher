      result: command.txt == launch.json argv == trial-plan argv (run dir substituted) for both trials; check_argv equal
    - check: seeds
      result: 20261009 (RUN-CZLIFT-dab752) and 20261010 (RUN-CZLIFT-5b2581) agree across trial plan, command, manifest inputs and metrics
    - check: environment
      result: >-
        python 3.13.16 on linux x86_64, 4 CPUs. runtime_lock is null, so package versions
        (sympy, pyyaml) are not recorded; sympy is used only for primality and factoring at
