    - control: matched-lift comparison (same reduction mod p, canonical integral model vs perturbed lift A + p a1, B + p b1)
      status: run here (rt_probe part B). It replaces the confounded CM-vs-random arm comparison in any follow-up.
    - control: readout-agnostic statistic (multiplier set E_s = {d with g(dR)/g(R) independent of R}, plus an inverse-function scan of the residue)
      status: multiplier set run here (rt_probe B). The inverse-function scan is not run; it needs d and the residue recorded per row (O7).
    - control: null object of the same shape (random odd function on <P> with v = 2 w.p. 1/p), identical counting
      status: run here. 60 draws per curve, pooled; its mean is 0.997 of the analytic 1/p reference.
    - control: precision sweep k = 2,3,4,6,8 (the parameter the torsion degeneracy must track)
      status: >-
        Run here (rt_probe D). v(z([n] s_tor(P))) = k at every k on 3 curves, and v(z([n] naive(P)))
        stays at 1. The degeneracy tracks the precision, so it is not a saturation artifact.
    - control: positive control for the readout (validator s_leak) re-run in independent arithmetic
