    - citation: 'Deuring (1941); Lubin-Serre-Tate (1964); as stated in A. Chambert-Loir, "Compter (rapidement) le nombre de solutions d''equations dans les corps finis", Seminaire Bourbaki 968 (2006), arXiv math/0611584, section 3.2.1'
      record_provenance: not cited by the record; retrieved here
      found: >-
        Section 3.2.1 states: for ordinary E there is a unique lift for which End(lift) -> End(E) is
        an isomorphism, equivalently the only lift to which Frobenius lifts. Over a finite field this
        coincides with the canonical lift ([83] Lubin-Serre-Tate, [86] Messing). Section 3.2.3: the
        canonical subgroup is connected of rank p with an etale quotient. Satoh's method uses the
        lifted Verschiebung.
      delta: Supports the cm arm's "canonical" label through the Frobenius-lift criterion, which rt_probe C checks directly for j = 0.
    - citation: H2 source statement "Satoh's point counting uses exactly that asymmetry" (user, not a ledger citation)
      found: >-
        Satoh's method rests on the canonical lift's Frobenius/Verschiebung isogenies and the
        canonical subgroup of E[p] (Chambert-Loir, sections 3.2.1-3.2.3). That is a canonical
        structure on torsion points of the canonical lift, the opposite of "no canonical lift of
        points". I could not open Satoh's original paper (J. Ramanujan Math. Soc. 15 (2000) 247-270)
        or the Eurocrypt 2001 PDF (HTTP 403).
      delta: Not load-bearing. It supports R1's reading that the canonical lift does carry a canonical lift of torsion points.

  narrowest_supported_statement: >-
    Scope: ordinary E/F_p, p >= 5, a prime-order subgroup <P> of order n != p, any Z_p-lift E^.
    Proved (uniform in p; checked exactly on 1116 pairs at k = 4 and at k = 2..8 on 3 curves): there
    is exactly one homomorphic section of reduction over <P>, the n-torsion section s_tor. It is
    independent of the Hensel start and computable in at most 2(bits(n)+bits(p^k))+1 complete
    additions. The Smart functional z([n]s(R)) vanishes identically on it, and s_tor moves the DLP
    isomorphically into E^(Q_p)[n]. On the canonical (CM) lift it is also the limit of iterating the
    Frobenius lift (checked on 16/16 j = 0 curves). For every other section the Smart ratio equals
    the leading-digit tau-ratio. Consequently the H2 clause "a computable canonical section would be
    a full break" is false under every reading in which "canonical" constrains the section
    (homomorphic, filtration-splitting, scalar-, Frobenius- or End-equivariant). Under the remaining
    reading, "a section whose Smart residue recovers d", it is circular.
    Measured at toy scale only (50 <= p <= 600, 11 <= n <= 613, k = 4, 36 curves per seed; red-team
    exhaustive control on 71 distinct curves): for the hensel_random, naive and Teichmuller sections,
    the event "Smart ratio = d mod p" occurs at the random rate on CM-canonical and arbitrary integer
    lifts. The frozen test resolves excesses only of about 4.2-5.2x 1/p per arm and seed (80% power
    on both seeds near 6-8x). Excluded with power >= 0.989: a uniform identity-readout leak at the
    rho-parity rate p^-1/2. The red-team exhaustive control puts naive and Teichmuller within
    0.97-1.06x of a same-shape random-function null.
    Not shown: that the non-torsion sections carry no information about d (one readout tested;
    planted DL oracles pass it); that the curve lift does not matter (the arm test has no power, and
    the canonical j = 0 lift adds Aut(E^)-equivariance to the Teichmuller section); that every
    non-canonical section fails; anything about anomalous curves, global lifts, other sections or
    readouts, or cryptographic sizes.

  recommended_strength: >-
    Theorem-grade for the torsion-section facts, the tau-identity and the falsity of the full-break
    clause under constraining readings. Record these as a proved proposition with a proof sketch
    (Hensel uniqueness; Hom(Z/n, E^_1) = 0; [n](z) = n z + O(z^2)), with the runs and the validator's
    blind re-derivation as instrument confirmation. Do not record them as "supported at toy tier",
    and do not attach "at toy scope". Moderate, toy-scale empirical support for the three sections'
    identity-readout rate at 1/p, with the stated floors. No support for "no information about d"
    or for "the canonical curve lift contributes nothing" beyond the prime-to-p splitting theorem.
    The reason: the conclusion's force comes from the proof, the empirical clause has a 4-5x floor
