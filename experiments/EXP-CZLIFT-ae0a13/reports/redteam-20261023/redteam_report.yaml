      delta: >-
        The claim "CM curves with class number one lift as their integral model" is not a statement
        I could locate in Katz. It is Deuring's lifting theorem plus Lubin-Serre-Tate, which I
        verified in a secondary source (next entry). Re-cite it that way. It is not load-bearing for
