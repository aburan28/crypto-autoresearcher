  claim_under_review: >-
    REVIEW-CZLIFT-AE0A13-EVIDENCE-20261023 claim_under_review, which is the statement of
    H-CZLIFT-6d4ed1. For n != p the n-torsion section s_tor is a canonical, homomorphic section of
    reduction on <P> on any Z_p-lift. It is computable from any Hensel start in at most
    2(bits(n)+bits(p^k))+1 complete additions, and the Smart functional vanishes on it. Every other
    section's Smart ratio is its tau-ratio. The Hensel, naive and Teichmuller sections hit d mod p at
    the rate 1/p on the CM-canonical lift and on an arbitrary lift alike. Hence the user's clause "a
    computable canonical section would be a full break" is false as stated.

  joint_verdicts:
    R1: holds
    R2: breaks
    PTM-1: holds
  joint_summaries:
    R1: >-
      The torsion section is the object H2 asked for under every reading in which "canonical"
      constrains the section. Those readings are a homomorphic section, the splitting compatible with
      the formal-group filtration, a section equivariant under every [m], and the CM or special-j
      route that H2's own source statement names. In that last reading, on the Serre-Tate/Deuring
      canonical lift the Frobenius lifts, and iterating it from any lift converges to s_tor. I
      checked this on all 16 j = 0 curves (rt_probe part C). On all these readings it is the unique
      section with the property, not merely a trivial one. Only one reading escapes: "a section on
      which the Smart residue recovers d". Under it the H2 clause is circular, because such a section
      is a discrete-log oracle by definition, and the Hom-vanishing theorem shows it cannot be
      canonical in any of the senses above. Evidence can neither contradict nor confirm a tautology,
      so "contradicts" is the wrong verb for that reading only. The contradiction is a theorem
      (Hensel uniqueness plus Hom(Z/n, E^_1) = 0), not a toy-scope observation.
      DEC-20261009-9f9254's "Contradicted at toy scope" understates and misattributes it.
    R2: >-
      R2a, the per-section null for the identity readout, holds. The 1/p reference is right: a
      same-shape random-odd-function null gives 0.997 of the analytic sum of cells/p. The frozen
      floor is 4.2-5.2x the reference per arm and seed. The frozen rule fires on both seeds with
      power >= 0.989 against a uniform leak at r = p^-1/2, a rate matching Pollard rho. My exhaustive
      control over all base points and all d, 4,078,200 cells per section and lift, puts naive and
      Teichmuller at 0.98-1.03x the null pooled and 0.97-1.06x per arm (|z| <= 2.1).
      R2b, the arm comparison, breaks. The frozen rule (|z| > 3 on both seeds) fires with
      probability 0.035 even when the CM arm leaks at 10x the random rate, and reaches 0.9 only near
      20x. At that size the per-arm 4-sigma rule has already fired. The arms also differ in curve
      family, p, n and h, so a difference could not be attributed to the lift. It also misses a real
      canonical-lift effect. On all 16 j = 0 canonical lifts the Teichmuller section is exactly
      Aut(E^)-equivariant (multiplier set {-1, +-lambda, +-lambda^2}, Smart ratio at lambda = zeta
      mod p for every base point). On a perturbed lift of the same reduction the set collapses to
      {-1}.
      R2c, the breadth of the readout, breaks. Planted sections s_tor + [f(log_P R)]T with
      f(x) = n - x or x^2 mod n pass the frozen test on both arms and seeds (|z| <= 1.39), yet
      recover d on 99.0-100% of pairs. The breaking artifact therefore exists for the TEST: a family
      leaking at full rate passes it. It does not exist for the three tested natural sections, and no
      computable leaking section is exhibited.
    PTM-1: >-
      I ran the argument unchanged against s_leak = s_tor + [log_P R]T. My independent arithmetic
      reproduces the validator: success 1.0 and frozen z between +172 and +292 on both arms and seeds.
      The claim under review does not rely on any property s_leak shares. Its no-break step uses the
      degeneracy of the homomorphic section, and s_leak is neither homomorphic nor torsion. Its
      empirical step is measured, and s_leak fails it. The tau-identity is shared, but the claim draws
      no no-leak conclusion from it. The control does locate two surviving arguments in neighbouring
      records, and the Coordinator must not carry either one (see objections O1 and O2).
      RQ-CZLIFT-b9f765 decision_target (a) states the known-false conclusion verbatim.
      DEC-20261009-9f9254 infers "so no choice of lift removes it" from identity_rate = 1.0, and that
      inference goes through on s_leak.

  objections:
    - id: O1
      severity: blocking_for_closure_wording
      target: RQ-CZLIFT-b9f765 decision_target (a)
      text: >-
        "every non-canonical section recovers d at the random rate 1/p" is false. s_leak (validator
        PTM-1) and the planted leak_neg and leak_sq here are non-canonical sections that recover d at
        rate ~1. Closing the question through (a) as worded would record a known-false statement. Keep
        the measured scope: three named sections, the identity readout, toy scale.
    - id: O2
      severity: blocking_for_evidence_wording
      target: DEC-20261009-9f9254 user_hypothesis_clauses.noise_for_trace_not_one_comes_from_the_lift_choice
      text: >-
        The clause reads "identity_rate = 1.0 ... the canonical part contributes zero, so no choice of
        lift removes it". identity_rate = 1.0 also holds for s_leak, and s_leak is a choice of lift
        with zero noise. The "so" is where the argument survives on the known-false object. What the
        record supports: no homomorphic section removes the noise (every such section zeroes the
        signal), any section that removes it is a DL oracle, and the three tested choice-free sections
        do not remove it.
    - id: O3
      severity: wording
      target: DEC-20261009-9f9254 EXP-CZLIFT-ae0a13 claim_boundary
      text: >-
        "the asked-for computable canonical section ... carries no information about d" is wrong as
        stated. s_tor(Q) = [d] s_tor(P) (scalar_mult_equivariance_rate 1.0), so s_tor carries the
        whole discrete-log relation. It is the formal-logarithm functional that vanishes on it. Say:
        the Smart functional vanishes identically on s_tor, and s_tor moves the DLP isomorphically
        into E^(Q_p)[n], where it is no easier.
    - id: O4
      severity: wording
      target: DEC-20261009-9f9254 clauses serre_tate_gives_no_canonical_lift_of_points and a_computable_canonical_section_would_be_a_full_break
      text: >-
        Both are labelled "Contradicted at toy scope". Each is contradicted by a theorem that is
        uniform in p, and the runs check the instrument against it. Record them as proved, with a
        proof sketch, and keep "toy scope" for the measured success rates only. Also, the
        non-anomalous counterexample (s_tor exists on every lift) does not use Serre-Tate. The
        Serre-Tate-specific canonical lift of points is the Frobenius-iteration limit (rt_probe C),
        and for anomalous curves it is the p-torsion lift (VAL-20261022-31a388 reading A,
        EXP-CZLIFT-17b7eb).
    - id: O5
      severity: scope
      target: H-CZLIFT-6d4ed1 statement ("on the canonical curve lift and on an arbitrary lift alike") and mechanism ("the canonical curve lift ... contributes nothing")
      text: >-
        These hold for the success event ratio == d mod p. They are false as structural statements.
        The canonical j = 0 lift makes the Teichmuller section Aut(E^)-equivariant (rt_probe B, 16/16
        curves), and a perturbed lift of the same reduction does not. The frozen arm comparison has no
        power to see this or anything below about 12-20x the random rate (rt_power). Do not cite the
        arm comparison as evidence that the lift does not matter. Cite the theorem for the
        prime-to-p splitting and the matched control for the identity readout.
    - id: O6
      severity: scope
      target: H-CZLIFT-6d4ed1 mechanism ("A section recovering d would need tau(dP)/tau(P) = d for all d")
      text: >-
        Too narrow. Any efficiently invertible f with tau-ratio = f(d) recovers d (leak_neg, leak_sq
        in rt_probe A). The frozen success test reads only f = id.
    - id: O7
      severity: recording_gap
      target: experiments/EXP-CZLIFT-ae0a13/implementation/run.py row schema
      text: >-
        The raw rows record only booleans and valuations. They do not record d, d2, the base point or
        the residue, so no alternative readout can be evaluated without a replay. Any follow-up should
