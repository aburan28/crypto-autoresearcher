  counterexample_or_mutation: >-
    (1) Planted readout mutation (rt_probe A). s_f(R) = s_tor(R) + [f(log_P R)]T, with T = [n] of a
    random lift (v(z(T)) = 1). f(x) = n - x gives success 0.000-0.0026 and frozen z -1.39 to -0.55,
    with recovery 0.990-1.000. f(x) = x^2 mod n gives success 0.000-0.0026 and frozen z -1.32 to
    -0.67, with recovery 0.990-1.000. Both pass the frozen test on both arms and seeds, while an
    attacker who knows f recovers d with at most 4 candidates. These sections encode the DL (out of
    the tested set by the interpretation limits). They show what the test cannot see.
    (2) Natural, lift-specific structure missed by the frozen design (rt_probe B). On every j = 0
    integral CM model the Teichmuller section has Smart ratio(lambda) = zeta_p and ratio(lambda^2) =
    zeta_p^2, identically in the base point. Here lambda is the eigenvalue of rho(x,y) = (zeta x, y)
    on <P>. This holds on 16/16 curves and disappears on a perturbed lift of the same reduction. The
    frozen success test scores it as failure, and the arm test cannot detect it. It verifies and
    explains the validator's open Teichmuller hom_prec2 observation (VAL-20261022-31a388
    control_checks). The leaked information is the mu_6-orbit of d, with probability 4/(n-3) for a
    random d, which the automorphism-class speed-up of Pollard rho already uses.

  baseline_comparison: >-
    No attack algorithm is proposed, so there is no cost-to-break row and no dominated_by field to
    check. Charged honestly, a section "attack" costs O(log n + k log p) additions per attempt
    (55-58 complete additions over Z/p^4 here; record and validator agree). It succeeds with
    probability 1/p per re-randomized attempt (Q' = Q + [j]P), so the total expected cost is about
    p x 60 additions. Pollard rho needs about sqrt(pi n/4) group operations, or sqrt(pi n/12) on
    j = 0 curves using mu_6 classes. BSGS needs sqrt(n) time and memory. At toy n ~ 500, rho needs
    ~20 operations, less than one attempt. At n ~ p ~ 2^256 the 1/p-rate attempt costs ~2^264
    against rho's ~2^128, so it is dominated on every axis (time; memory O(1) for both; no extra
    data). The closest specialized baseline, Smart/Satoh-Araki/Semaev, applies only at n = p
    (EXP-CZLIFT-17b7eb). MOV/Frey-Ruck is untouched. The only structure found, the mu_6-orbit on
    canonical j = 0 lifts, is dominated by rho with automorphism classes. KN-LIT-7593 check: the
    torsion section's cost is charged (torsion_cost_mean_additions). No search dimension is
    eliminated, because the DLP is moved isomorphically, not reduced.

  heuristic_challenges:
    - >-
      heuristic_under_test is null, but the 1/p reference rests on an unnumbered random-model
      assumption: the Smart residue of a choice-free section is uniform on F_p and independent of d.
      Structured sections are not random functions. Negation-equivariance gives ratio = -1 at
      d = n-1 deterministically (excluded by design). The canonical j = 0 Teichmuller section is
      deterministic on the mu_6 orbit. State it as an explicit heuristic: uniform outside the
      Aut(E^)-orbit of d. The cheapest experiment that exposes a deviation is the multiplier-set
      test, run here: it found exactly Aut(E^) and nothing else on 71 curves, 2 lifts and 2 sections.
    - >-
      Validation scale: toy only (50 <= p <= 600, 11 <= n <= 613, k = 4). The exhaustive control
      does not change the scale.

  cost_model_challenges:
    - >-
      The cost bound 2(bits(n)+bits(p^k))+1 holds row-wise (validator) and is a construction cost,
      not a cost to break. k = 2 already suffices for the Smart functional, so at n ~ p ~ 2^256 the
      bound is about 1537 additions over Z/p^2. The bound is polynomial by proof, with no hidden
      overhead.
    - >-
      Total expected cost must be per-attempt cost x 1/success, as in baseline_comparison. No record
      states otherwise, but any evidence text must not quote the per-attempt cost alone as an attack
      cost.

  reduction_and_scope_challenges:
    - >-
      Katz, "Serre-Tate local moduli", LNM 868 (1981) 138-202 is provenance "recalled",
      verified_by null. It is cited for "CM curves with class number one lift as their integral
      model". The bibliographic data checks out. Katz's text was not accessible (see
      citations_checked). The CM-model statement is Deuring's lifting theorem: for ordinary E, the
      unique lift with End(lift) -> End(E) an isomorphism, equivalently the unique lift to which
      Frobenius lifts, is the canonical lift. I verified that statement in Chambert-Loir, Seminaire
      Bourbaki 968 (2006), section 3.2.1, citing Deuring 1941, Lubin-Serre-Tate 1964 and Messing.
      Cite Deuring/LST for the arm label. The citation is NOT load-bearing for s_tor, which exists
      on every lift. For j = 0, rt_probe C checks the Deuring criterion directly on all 16 models: a
      Frobenius lift exists. For D in {-11, -19, -43, -67, -163} the label rests on the exact
      j-invariant plus Deuring, with no direct endomorphism check.
    - >-
      Nearby object F_p^* (proves-too-much in scope). There the Teichmuller lift is the torsion
      section and the p-adic log vanishes on it, while naive integer lifts give Fermat-quotient noise
      for the p-adic log. The same naive lift powers index calculus through a global functional
      (factorization). Do not generalize to "lifting points to characteristic zero cannot help". The
      result covers the formal-logarithm functional only. Global lifts are H-CZLIFT-9a32e9.
    - >-
      Nearby object: anomalous curves (n = p). The argument needs n^{-1} mod p^k, an explicit
      separator, so it correctly does not apply. That is consistent with Smart succeeding on
      non-split lifts (EXP-CZLIFT-17b7eb).
    - >-
      Unstated S = O exclusion. I agree with the validator: the 36 drops depend only on d2 = n-1,
      independently of P, d and the lifts, so there is no bias. It lowers the realized pairs to
      557/576 and 559/576. My power analysis uses the realized rows.
    - Affected-vs-safe scheme lists are not applicable; no scheme claim is made.

  proof_architecture_challenges:
    - >-
      Observation fibre: fix the frozen readout (identity success near 1/p). Both the naive section
      (no leak) and leak_neg (a DL oracle) lie in that fibre. The missing separator is the readout
      functional, and a readout-agnostic statistic is required for any "no information" claim.
    - >-
      Quantifier order: the tau-identity is for all s, while the success-rate statement covers three
      tested s. RQ decision_target (a) and the DEC clause silently promote the second to "for all
      non-canonical s" (O1, O2).
    - >-
      Compositional invariant: delete "homomorphic" (or scalar- or Frobenius-equivariant) from
      "canonical", and uniqueness of the section and vanishing of the functional both fail
      immediately (s_leak). That component is load-bearing for R1. With it, the conclusion follows
      from Hom(Z/n, E^_1) = 0, E^_1 being torsion-free for p >= 3.

  obstruction_and_resource_reading:
    obstruction: >-
      For n != p, Hom(Z/n, E^(pZ_p)) = 0 (the formal group is pro-p and torsion-free for p >= 3).
      So the unique homomorphic section of reduction over <P> is s_tor, the formal-logarithm
      (Smart) functional vanishes on it, and on every other section it equals the tau-ratio.
      Equivalently, for l = n != p the n-torsion of a good-reduction lift is an unramified Galois
      module that reduces isomorphically to E[n]. Lifting adds nothing to the n-part.
    measured_quantity:
      - degeneracy_rate_torsion = 1.0 (1116/1116 pairs, v = k = 4). Red-team sweep: v tracks k = 2,3,4,6,8.
      - identity_rate = 1.0 (3 x 1116 section rows)
      - success_rate of hensel_random, naive and teichmuller at the 1/p reference (frozen floor 4.2-5.2x per arm and seed)
      - red-team exhaustive identity-readout success, naive and Teichmuller, 0.967-1.058x the random-function null over 4,078,200 cells per section and lift
      - red-team multiplier sets {-1} everywhere except mu_6 minus 1 for Teichmuller on the 16 canonical j = 0 lifts
      - red-team Frobenius-lift iteration converging to s_tor (16/16 j = 0 canonical lifts)
    closure_breadth_check: >-
      This is a real obstruction with an argument. It is not a fatigue report, because it does not
      count rejected mechanisms. The closure it supports is "no homomorphic or Frobenius/End/scalar-
      equivariant section yields the discrete log through the formal logarithm, at any p". What
      remains open: non-homomorphic computable sections read through non-identity functionals
      (only three sections and one readout tested), the global-lift route (H-CZLIFT-9a32e9), and
      anything at cryptographic size for the empirical clause.
    resource_reading:
      - >-
        Pohlig-Hellman / anomalous boundary. The obstruction says the formal-group route is a
        polynomial-time oracle for exactly the p-primary component of the group. The theory that
        takes this as its hypothesis is the anomalous attack (Smart; Satoh-Araki; Semaev), whose
        domain is n = p. EXP-CZLIFT-17b7eb measures that boundary. For prime-order n != p the
        domain is empty, so this is not a DL resource.
      - >-
        Canonical-lift Frobenius as a counting resource. The Frobenius lift that rebuilds s_tor here
        (rt_probe C) is the hypothesis of Satoh-type p-adic point counting (Chambert-Loir 2006,
        section 3.2, verified). It computes #E, not d.
      - >-
        Aut(E^)-equivariance on the canonical j = 0 lift is the hypothesis of the automorphism-class
        speed-up of Pollard rho, so the closest specialized baseline already owns it. Recalled and
        unchecked: Duursma-Gaudry-Morain 1999; Bos-Kaihara-Kleinjung-Lenstra-Montgomery 2010. Not
        load-bearing.
      - >-
        Cheap canonical lifting of prime-to-p torsion to Z_p is an input to p-adic methods for
        computing torsion fields and Galois representations. Recalled and unchecked (Mascot's p-adic
        method). Not load-bearing.
      - None of these is a DL resource. No candidate lane is warranted.
    spawned_ids: []

