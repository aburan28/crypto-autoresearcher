experiment:
  id: EXP-PRECOMP-010
  status: proposed
  title: Factor-base selection under warm-solver cost
  objective: >-
    Compare factor bases using verified relation throughput after reusable solver
    preprocessing, rather than decomposition probability or cold solve cost alone.
  fixtures:
    field_bits: [13, 16, 20, 24, 28]
    curve_seeds: [1, 2, 3]
    decomposition_arities: [2, 3]
    factor_base_families:
      - low_coordinate_window
      - random_coordinate_subset
      - solver_ranked_candidates_if_available
      - existing_harness_default
  metric_definition: >-
    warm_relation_rate = verified_relations / (charged_precompute/N + total_warm_seconds)
    for frozen amortization counts N in [10, 100, 1000].
  metrics:
    primary: warm_relation_rate
    required:
      - decomposition_probability
      - cold_relation_rate
      - warm_solve_seconds
      - reusable_state_bytes
      - precompute_seconds
      - break_even_target_count
      - degree_of_regularity_proxy
  controls:
    - same curve and target stream across factor-base families
    - equal factor-base cardinality within matched cells unless size is the swept variable
    - all relations independently verified
  success_criterion: >-
    A non-default factor-base family improves verified warm relation throughput
    by >=2x over the default in at least two >=20-bit cells without merely
    increasing factor-base size.
  strong_signal: >-
    The factor base selected by warm cost differs consistently from the one
    selected by decomposition probability alone and the advantage grows with n.
  falsification_hook: >-
    Rankings under cold and warm cost are identical within noise across the
    completed ladder.
  depends_on: [EXP-PRECOMP-002, EXP-PRECOMP-004, EXP-PRECOMP-005]
