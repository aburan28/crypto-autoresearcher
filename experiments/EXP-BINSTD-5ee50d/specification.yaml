# EXP-BINSTD-5ee50d
# Attempt-band arithmetic. No solver is timed.
# Approved by DEC-20261003-fe5096.
experiment:
  id: EXP-BINSTD-5ee50d
  hypothesis_id: H-BINSTD-29e602
  source_idea: IDEA-20261002-5ebfcd
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Hour cap versus the target floor
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-fe5096
  objective: >-
    Check the product 20, the cross 3, and the product 168.
  inputs:
    n_sum: 36
    n_product: 323
    n_gap: 2
    ell: 3
    cells: 2
    targets: 20
    cell_targets: 40
    hour_cap: 10
    hour_product: 20
    band_cross: 3
    null_cross: 8
    null_vs_half: 2
    excess_lo: 12
    excess_hi: 14
    excess_product: 168
    under_lo: 112
    under_hi: 114
    under_product: 12768
  controls:
    - >-
      Ten times 2 is 20, equal to the target floor. Reporting the
      hour cap as 20 invalidates the run.
    - >-
      The band factor 2 against one half has cross 3. The null ends
      5/4 and 3/4 have cross 8. Three fourths against one half has
      cross 2.
    - >-
      The n sum is 36 and the n product is 323. Two times 20 is 40.
      Twelve times 14 is 168. One hundred twelve times 114 is 12768.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {hour, band, excess}
    - route in {product, cross}
  metrics:
    primary:
      - hour_product
      - band_cross
      - excess_product
      - implementations_agree
    secondary:
      - null_cross
      - cell_targets
      - under_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Ten times 2 is 20. The band cross is 3. The product of 12 and
      14 is 168.
    formula: >-
      Multiply 10 by 2. Cross 2 with one half. Multiply 12 by 14.
    source: >-
      IDEA-20261002-5ebfcd states the n list 17 and 19, the dimension
      3, the target floor 20, the band factor 2, the null ends 0.75
      and 1.25, the threshold 5, and the hour cap 10, read
      2026-10-03. The products were recomputed in this design
      session. That computation is not a run. No solver was timed.
  scale_relevance:
    tier: toy
    justification: Two listed n values and one written target floor. No transfer to a wall time.
    correspondence: null
  tail_checks:
    - The cross 3 and the product 168 are required. A check that stops at the product 20 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the product 20 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The product is not 20.
    - The cross is not 3.
    - The excess product is not 168.
    - The hour cap is reported as 20, or a solver is timed.
  success_criterion: >-
    Both runs agree that 10 times 2 is 20, that the band factor 2
    against one half has cross 3, that 5/4 against 3/4 has cross 8,
    and that the product of 12 and 14 is 168.
  falsification_criterion: >-
    The runs agree that 10 times 2 is computed, and that product is
    not 20.
  required_artifacts:
    - experiments/EXP-BINSTD-5ee50d/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-5ee50d/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-5ee50d/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-5ee50d/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-5ee50d/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-5ee50d/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any solver timing, decomposition attempt, or wall-time ratio.
    - Any claim that one attempt is cheaper than two attempts.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
