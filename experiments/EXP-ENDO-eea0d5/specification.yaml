experiment:
  id: EXP-ENDO-eea0d5
  hypothesis_id: H-ENDO-58fc5c
  idea_id: IDEA-20260905-3c4579
  version: 1
  title: >-
    Truncated denominator-torsion profiles for three explicit modules
  status: approved
  objective: >-
    Decide H-ENDO-58fc5c by computing dim (I : d^infinity / I)_j for
    degrees 0 through 4 on the null, finite-length, and unbounded fixtures,
    and by counting preserved points after one boundary drop.
  inputs:
    coefficient_field: Q
    degree_window: 4
    fixtures:
      - name: null
        ring: Q[x]
        ideal: (0)
        denominator: 1
      - name: finite
        ring: Q[x]
        ideal: (x^2)
        denominator: x
      - name: unbounded
        ring: Q[x,y]
        ideal: (x^2)
        denominator: x
    points: [[0, 0], [1, 0]]
    dropped_locus: x = 0
  controls:
    - >-
      Null: d = 1. Every dimension in the window is 0. A positive
      dimension invalidates the run.
    - >-
      Finite length: Q[x]/(x^2) with d = x. Expected dimensions
      1, 1, 0, 0, 0.
    - >-
      Unbounded: Q[x,y]/(x^2) with d = x. Expected dimensions
      1, 2, 2, 2, 2, and the finite-length flag is false.
    - >-
      Known false: start with both points and delete the point with
      x = 0. The preserved count is 1. A count of 2 fails this control.
  independent_variables:
    - fixture name in {null, finite, unbounded}
  metrics:
    primary:
      - truncated_dimensions
      - finite_length_flag
      - preserved_point_count
    secondary:
      - annihilation_exponent
  heuristic_under_test: null
  preregistered_prediction:
    quantity: truncated dimensions and the preserved point count
    formula: >-
      Null dimensions are 0, 0, 0, 0, 0. Finite dimensions are
      1, 1, 0, 0, 0 with finite length. Unbounded dimensions are
      1, 2, 2, 2, 2 with finite length false. Preserved points equal 1.
    source: >-
      H-ENDO-58fc5c, from the two paper-domain modules named in
      IDEA-20260905-3c4579. No cubic model is included.
  scale_relevance:
    tier: toy
    justification: >-
      Each module is a quotient by (x^2) in at most two variables, and
      the window has five degrees. No transfer to a curve model is claimed.
    correspondence: null
  tail_checks: []
  replication:
    seeds: []
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after the three modules and the two-point drop.
    - Do not add a cubic model or a larger window.
  invalidation_rules:
    - The null profile is not identically zero.
    - A dimension is reported outside degrees 0 through 4 as if it were inside the window.
    - A finite-length flag is set from a bound past degree 4.
  success_criterion: >-
    The run is valid, the three dimension tuples and finite-length flags
    match the preregistered prediction, and the preserved point count is 1.
  falsification_criterion: >-
    The run is valid and either the finite and unbounded tuples agree on
    degrees 0 through 4, or any tuple disagrees with the prediction.
  required_artifacts:
    - experiments/EXP-ENDO-eea0d5/runs/<RUN-ID>/command.txt
    - experiments/EXP-ENDO-eea0d5/runs/<RUN-ID>/cells.json
    - experiments/EXP-ENDO-eea0d5/runs/<RUN-ID>/stdout.txt
    - experiments/EXP-ENDO-eea0d5/runs/<RUN-ID>/stderr.txt
  assigned_to: executor
  approved_by: coordinator
  approval:
    decision_id: DEC-20261005-c57735
    basis: >-
      AGENTS.md standing user authorization of 2026-09-06. This record
      freezes the protocol. It does not launch the executor.
    not_launched_because: >-
      GOAL-ENDO-001 next_action names only the EXP-JINV-bd141d preparation.
      Dispatch of TASK-20261005-682b64 waits for a Coordinator decision
      that releases this experiment.
