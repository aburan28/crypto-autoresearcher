experiment:
  id: EXP-EWALK-9c3a7b
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-59f5b7
  question_id: RQ-EWALK-8fa147
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE NEGATION-QUOTIENT SPEEDUP THIS PROGRAM HAS ACTUALLY MEASURED IS A CONDITIONAL-ON-SUCCESS
    NUMBER, AND CHARGING THE CENSORING MOVES IT THE WRONG WAY AND REVERSES ITS SIZE TREND: a renewal-reward
    estimator applied to the audited 16- and 18-bit artifacts gives a charged constant of AT LEAST
    1.0367 and 1.1025 against an ideal 0.8862, so the charged gain is AT MOST 1.191 and 1.160 against
    an ideal sqrt(2) = 1.4142 -- and the larger size is WORSE, which is the direction HEUR-RHO-2''s
    size-independence assumption forbids; this proposal builds the censoring-aware estimator, re-measures
    under it, and decides whether the fully charged negation gain is below sqrt(2), below the program''s
    own baseline, or below 1.0'
  status: draft
  objective: "(A) THE DEFECT, AND IT IS ALREADY AUDITED, NOT ALLEGED. The staged artifact inputs/h100_session/h040_rho_const.json\
    \ reports, for a negation-quotient rho walk with fruitless-cycle escape at 16 and 18 bits:\n \
    \ 16 bits (p = 47977, N = 48341): plain const_mean 1.2345 (200/200\n    successes, 0 escapes);\
    \ negation const_mean 0.9486, 183/200 successes,\n    17 runs terminated by `escape_overflow`,\
    \ mean 13.015 escapes per run.\n  18 bits (p = 215573, N = 215077): plain const_mean 1.2790 (200/200);\n\
    \    negation const_mean 0.9426, 171/200 successes, 29 `escape_overflow`,\n    mean 23.51 escapes\
    \ per run.\nREVIEW-H100-20260717 correction C5 states the defect in the program's own words: \"\
    The negation constants (0.949 / 0.943) are CONDITIONAL-ON-SUCCESS estimates: 17/200 and 29/200\
    \ negation runs ended in escape_overflow and were excluded. Censoring is reported in the artifact\
    \ but not in the ledger line.\" The plain-rho anchor is unaffected and its theory value 1.2533\
    \ lies inside both CIs, so the instrument was working; what is wrong is the ESTIMATOR, not the\
    \ data.\n(B) THE ARITHMETIC CONSEQUENCE, DERIVED AND LABELLED AS DERIVED. Under any restart-on-overflow\
    \ policy -- the only policy under which the walk is a usable algorithm -- the expected cost per\
    \ SOLVE is a renewal-reward quantity:\n  E[cost per solve] = E[cost | success] / P(success)\n\
    \                      + E[cost consumed by a failed attempt] * (1-P)/P.\nThe second term is non-negative\
    \ and the artifact does not let it be computed (the per-run operation counts for overflowed runs\
    \ are not separable in the staged file), so what follows is a RIGOROUS LOWER BOUND on the charge,\
    \ obtained by dropping it:\n  charged_const >= conditional_const / P(success).\n  16 bits: >=\
    \ 0.9486 / 0.915 = 1.0367.\n  18 bits: >= 0.9426 / 0.855 = 1.1025.\nBoth exceed the IDEAL negation\
    \ constant 0.8862 = sqrt(pi)/2, and both exceed 1.0. The implied charged gain against the plain\
    \ arm measured in the same artifact is therefore AT MOST\n  16 bits: 1.2345 / 1.0367 = 1.191.\n\
    \  18 bits: 1.2790 / 1.1025 = 1.160.\nagainst an ideal sqrt(2) = 1.4142. EVERY NUMBER IN THIS\
    \ PARAGRAPH IS ARITHMETIC ON AUDITED PUBLISHED VALUES UNDER A STATED POLICY. None of it is a measurement\
    \ by this program, none of it is a run, and it is presented as the motivation for a measurement\
    \ rather than as one.\n(C) THE SIZE TREND FLIPS, WHICH IS THE PART WORTH RUNNING. The UNCHARGED\
    \ ratios go 1.2345/0.9486 = 1.301 at 16 bits and 1.2790/0.9426 = 1.357 at 18 bits -- INCREASING\
    \ with size, consistent with a size-independent constant plus noise. The CHARGED bounds go 1.191\
    \ then 1.160 -- DECREASING with size, because the censored fraction rose from 8.5 to 14.5 percent.\
    \ If that direction is real it contradicts HEUR-RHO-2 of H-RHO-bc6ea6 (\"the fully charged cost\
    \ ratio ... is independent of N above a threshold size, so a ratio measured at N ~ 2^32, 2^40\
    \ and 2^48 transfers to cryptographic N\"), and it contradicts it in the most consequential way:\
    \ the quantity that would transfer to cryptographic N is not the one being estimated. Two readings,\
    \ both testable:\n  READING 1 -- the censored fraction is a fixed property of the escape\n   \
    \ budget and grows with N because the budget was held constant while\n    sqrt(N) grew. Then the\
    \ fix is to scale the escape budget with sqrt(N)\n    and the size trend disappears. This is the\
    \ boring, likely, and easily\n    checked reading, and confirming it is a real instrument result.\n\
    \  READING 2 -- the censored fraction grows with N even at a budget scaled\n    with sqrt(N),\
    \ because the fruitless-cycle structure gets worse. Then\n    the negation gain DEGRADES with\
    \ size, no constant transfers, and every\n    constant in the program's baseline convention is\
    \ scoped to the size it\n    was measured at. This is the interesting reading and it would be\
    \ a\n    finding about the baseline itself.\nDistinguishing them costs one sweep of the escape\
    \ budget and is the core of the minimal test.\n(D) THERE ALREADY EXISTS AN AUDITED MEASUREMENT\
    \ IN WHICH THE NEGATION-CLASS WALK IS FAR WORSE THAN PLAIN RHO. inputs/h100_session/h041_xonly_walk.json\
    \ measured an x-only (i.e. negation-class) walk WITHOUT fruitless-cycle escape at 16 and 17 bits:\
    \ useful_fraction 0.07 and 0.05, and effective_const_per_solve 2.2988 and 3.2189. REVIEW-H100-20260717\
    \ correction C8 states: \"'~2x worse than plain rho' undersells it: effective constants 2.30 and\
    \ 3.22*sqrt(N) are 1.83x and 2.57x the 1.2533 theory. All other numbers (239-439 two-cycles vs\
    \ null [0,2]; 5-7 percent useful collisions) verify.\" So the existence question -- can the negation\
    \ quotient ever be a NET LOSS? -- is already answered YES for an unescaped implementation, by\
    \ an audited measurement, with a factor between 1.83 and 2.57 against it. The open question this\
    \ proposal addresses is the ESCAPED implementation under FULL CHARGING, which is the one the baseline\
    \ convention claims.\n(E) WHAT IS BUILT, AND WHY IT IS A TOOLING CONTRIBUTION TO AN ALREADY APPROVED\
    \ EXPERIMENT. EXP-RHO-60da4f (approved 2026-08-06) has a stopping rule: \"a cell with more than\
    \ 10 percent censoring is reported as unresolved rather than being scored with the censored runs\
    \ dropped, since dropping them is exactly what produces a spurious win.\" That rule is correct\
    \ and it is also a RISK: the audited 18-bit cell censored at 14.5 percent, so an experiment inheriting\
    \ a similar escape budget could return a grid of UNRESOLVED cells and spend 240 CPU-hours producing\
    \ nothing scorable. A censoring-aware renewal estimator with an interval -- which is standard\
    \ survival analysis, not a new idea -- converts those cells from unresolved into bounded, and\
    \ it is a few dozen lines. This proposal delivers it, validated on planted data, before or alongside\
    \ that experiment."
  resource_label: R3 (End(E) as a ring -- the unit group {+-1}). The measurement itself consumes no
    resource beyond the automorphism it is calibrating.
  admissibility: inadmissible_generic_group
  admissibility_argument: INADMISSIBLE AND DELIBERATELY SO. The negation map is an automorphism of
    E applied to points of G; on a prime-order subgroup it acts as the scalar -1 (H-ENDO-001), and
    an oracle for it is Oracle D of KN-FIND-b7e091, which is generic-group simulable and hence closed
    at exponent 1/2 (KN-TECH-005). No exponent claim is made or possible. The value is entirely in
    calibrating the CONSTANT that this program's baseline convention asserts (0.886*sqrt(n), KN-TECH-006),
    because every other lane in GOAL-ENDO-001 and in GOAL-ECDLP-001 charges against that constant
    and it currently rests on a conditional-on-success estimate at 16 and 18 bits.
  reachability_gate: 'NOT APPLICABLE IN THE MOVEMENT SENSE -- this proposal never leaves the curve
    it starts on, uses only the negation automorphism which exists on every curve with p > 3, and
    therefore has no isogeny-walk cost at all. The gate is recorded rather than omitted because its
    triviality is itself the point: |Aut| = 2 is universally available, which is why the negation
    constant is baked into the program''s baseline convention and why getting it wrong is expensive
    across every lane.'
  inputs:
    procedure: 'STAGE 0 (minutes, zero compute): record the derived bounds 1.0367 and 1.1025 and the
      size-trend reversal, labelled as arithmetic on audited published values under a restart policy.
      STAGE 1 (hours, HARD GATE): implement the charged ratio estimator with a bootstrap interval;
      validate it on planted data across the censoring sweep; require the two estimators to agree
      at 0 percent censoring and to differ by 1/P elsewhere. STAGE 2 (hours, HARD GATE): extend harness/rho.py
      with a negation-class quotient walk and a memoryless escape rule; reproduce the plain-rho constant
      1.2533 within a pre-registered band at three toy sizes; run the no-escape positive control and
      confirm absorption. STAGE 3 (hours): the escape-budget sweep at three sizes, fixed budget and
      sqrt(N)-scaled budget, with the matched-seed un-quotiented null in the same run. STAGE 4 (minutes):
      report charged and conditional constants side by side, the censored fraction per cell, and the
      pre-registered verdict against 1.4142 / 1.0. THE CHEAPEST KILL IS STAGE 1: if the estimator
      cannot show the known bias on planted data, nothing downstream is interpretable and the line
      stops for the cost of an afternoon.'
    mechanism: "STEP 1 -- THE ESTIMATOR, WHICH IS STANDARD AND SHOULD BE STATED AS SUCH. Treat each\
      \ walk as one attempt of a renewal process with reward = solve. Let c_i be the charged cost\
      \ of attempt i and d_i in {0,1} the censoring indicator. The per-solve charged cost is estimated\
      \ by\n  Chat = (sum_i c_i) / (number of successes),\ni.e. TOTAL cost over ALL attempts including\
      \ failures, divided by successes. This is the ratio estimator; its interval comes from a nonparametric\
      \ bootstrap over attempts. Note what it does: it charges every operation actually performed,\
      \ so a censored attempt costs what it cost and buys nothing, which is what a real deployment\
      \ pays. The conditional-on-success mean is the special case obtained by deleting failed attempts,\
      \ and the difference between the two IS the quantity correction C5 identifies. Report BOTH,\
      \ always, side by side, never one alone.\nSTEP 2 -- PLANTED VALIDATION BEFORE ANY REAL NUMBER.\
      \ Generate synthetic attempt sets with a KNOWN per-solve cost and a KNOWN censoring fraction\
      \ swept over {0, 5, 10, 20, 40} percent. The estimator must recover the known value within its\
      \ interval at every censoring level, and the conditional-on-success estimator must visibly FAIL\
      \ to, by the predicted factor 1/P. An estimator that cannot show the bias on planted data cannot\
      \ be trusted to measure it on real data.\nSTEP 3 -- RE-ANALYSIS OF THE EXISTING AUDITED DATA,\
      \ WITH ITS LIMITS STATED. Apply the lower bound conditional_const / P(success) to the h040 cells\
      \ (which is all the staged file supports, since per-run costs for censored attempts are not\
      \ separable) and record 1.0367 and 1.1025 as BOUNDS, marked as arithmetic on published values\
      \ under a restart policy. Do not report them as measurements and do not report the full estimator\
      \ on data that cannot support it.\nSTEP 4 -- FRESH MEASUREMENT, WHICH IS WHERE THE ANSWER COMES\
      \ FROM. Re-run the negation-quotient walk in this program's own harness (harness/toycurve.py,\
      \ harness/rho.py extended with a class-quotient walk) at three sizes, with the escape budget\
      \ as the SWEPT VARIABLE: budget in {8, 16, 32, 64, 128} escapes and, separately, budget scaled\
      \ as alpha*sqrt(N) for alpha in {0.001, 0.01, 0.1}. Measure censored fraction, conditional constant,\
      \ charged constant, and the charged gain against a matched-seed un-quotiented arm.\n  READING\
      \ 1 fires if the censored fraction is flat in N at fixed\n  alpha*sqrt(N) budget.\n  READING\
      \ 2 fires if it grows in N even at scaled budget.\n\nSTEP 5 -- THE DECISION, PRE-REGISTERED.\
      \ Report the maximum charged gain over the budget sweep, per size, against three thresholds\
      \ stated in advance: 1.4142 (the ideal sqrt(2)), 1.0 (net loss), and the program's own implicit\
      \ claim that the baseline 0.886 is achieved (which requires charged gain 1.4142 exactly). State\
      \ which of the three the data supports, in those words."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - planted-censoring synthetic sets with known per-solve cost (blocking)
  - matched-seed un-quotiented arm, same curve/table/seeds/budget (blocking)
  - plain-rho constant reproduction against 1.2533 at three sizes (blocking)
  - no-escape positive control (must be absorbed)
  - both estimators reported side by side on every cell, never one alone
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, TWO PARTS. (1) PLANTED-CENSORING NULL
    WITH AN EXPLICIT DECAY PARAMETER. Synthetic attempt sets with known per-solve cost, censoring
    swept over {0, 5, 10, 20, 40} percent. THE DECAY PARAMETER IS THE CENSORING FRACTION: as it goes
    to 0 the gap between the charged and the conditional estimator must GO TO ZERO, and at 40 percent
    it must be about 1/0.6 = 1.67. An estimator whose two variants disagree at 0 percent censoring
    is broken; a pair whose disagreement does NOT grow with the censoring fraction is measuring something
    other than censoring and is the artifact tell. (2) MATCHED-SEED UN-QUOTIENTED NULL. The charged
    gain is always (charged cost of the un-quotiented arm) / (charged cost of the quotient arm) with
    identical curve, table, seeds and budget, measured in the same run -- never against a quoted literature
    constant. The 16/18-bit staged artifact already provides the pattern: its plain arm had 0 escapes
    and 200/200 successes, so its plain constant needs no charging correction and the entire correction
    falls on the quotient arm, which is exactly why the comparison is the dangerous one.'
  independent_variables: []
  metrics:
    primary:
    - charged per-solve constant with bootstrap interval, per cell
    - conditional-on-success constant with CI, per cell
    - censored fraction and total cost consumed by censored attempts
    - escape count distribution per run, including its tail
    secondary:
    - fully charged cost in F_p multiplications, curve model named
    - charged gain against the matched-seed null, per cell
    - fitted size trend of the charged gain across three sizes
  heuristic_under_test: null
  preregistered_prediction:
    quantity: gap between the charged per-solve constant and the conditional-on-success constant,
      on planted data
    formula: Equal to 1/P(success) within the bootstrap interval at every planted censoring level,
      and exactly 0 at 0 percent censoring. This is a known-answer test of the estimator and its failure
      halts the line.
    source: pre-registered in IDEA-20260807-59f5b7 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - ESCAPE BUDGET AS A HIDDEN PARAMETER. The censored fraction is a function of the budget, and the
    budget is a free implementation choice. Any charged constant reported without its budget is meaningless,
    and comparing two implementations at different budgets is comparing budgets.
  - RESTART POLICY. Restart-with-a-new-seed, restart-with-a-new-start-point and continue-with-a-perturbed-step
    all have different charged costs. The policy must be frozen and reported.
  - STAGED-ARTIFACT PROVENANCE. h040 and h041 are external session outputs with no manifest, commit,
    or environment record. They motivate the measurement; they cannot conclude it. Treating them as
    this program's runs would repeat the class of defect CORR-20260806-2f98f4 records.
  - SMALL-N EFFECTS. At 16-18 bits the rho length distribution is heavy-tailed and 200 runs give wide
    intervals; the audited CIs for the negation arm (0.877-1.023 and 0.873-1.014) straddle 1.0, so
    even the conditional constants are not sharply resolved there. Sample sizes must be set from a
    power calculation, not inherited.
  - UNIT SUBSTITUTION. Step counts versus field multiplications; the escape step is not the same cost
    as a walk step.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Equal to 1/P(success) within the bootstrap interval at every planted censoring
    level, and exactly 0 at 0 percent censoring. This is a known-answer test of the estimator and
    its failure halts the line.
  falsification_criterion:
  - The estimator fails the planted-censoring known-answer test. Instrument failure; nothing is reported
    and the line stops.
  - The harness cannot reproduce 1.2533 for plain rho within the pre-registered band. Instrument failure;
    no gain may be reported.
  - The charged gain reaches or exceeds 1.4142 at all three sizes with null controls passing. The
    shortfall claim is refuted; the negation map achieves its target under full charging, and the
    baseline convention is confirmed rather than corrected.
  - The censored fraction is flat in N at fixed budget (not scaled). Then the size-trend reversal
    derived from the staged artifact was an artifact of that session's budget choice, READING 1 fires,
    and the correct report is that HEUR-RHO-2 is undisturbed at m = 2. This is the likely outcome
    and is a genuine result, not a failure.
  - Crashes, timeouts or memory exhaustion. INFRASTRUCTURE outcome under AGENTS.md rule 5.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-59f5b7
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
