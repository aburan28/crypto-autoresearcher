# =============================================================================
# EXP-BINSTD-b2f621 -- VERSION 1 (APPROVED by DEC-20261002-fc1d84) frozen
# contract for H-BINSTD-a9d430: same-unit rho-tying exchange-rate instrument
# (budget_bits / gamma* / gamma_meas) with HOLD-F corrections.
#
# Source: IDEA-20260922-818b73 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Incorporates review corrections (same-cell QSP; KN-FIND-aa2efc floor;
# unit + mults_per_group_op; R=60.81).
#
# ZERO RUNS in this design packet. Stages 0-3 authorized for executor
# TASK-20261002-ee5aaa. No AUXIN. Amazon Bedrock prohibited.
# NO break. NO attack. NO exponent claim. Measurement instrument only.
# =============================================================================
experiment:
  id: EXP-BINSTD-b2f621
  hypothesis_id: H-BINSTD-a9d430
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-818b73
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Same-unit budget_bits/gamma* instrument: Stage-0 arithmetic + RC-1
    mults-per-group-op calibration (HOLD-F corrected)
  status: approved
  approved_by: DEC-20261002-fc1d84
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-fc1d84
    composing_decision: DEC-20261002-fc1d84
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-3 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2, 3]
    scientific_execution_authorized_note: >-
      Stage 0 is pure arithmetic on cited numbers. Stages 1-2 use archived
      RC-1 instances and existing Python instrumentation when available.
      No Magma/Sage. No AUXIN. No Bedrock. No new curve construction.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Freeze a same-unit rho-tying exchange-rate instrument for RQ-BINSTD
    reachability cells: reproduce HOLD-F-corrected Stage-0 arithmetic
    (family budget_bits + same-cell QSP gap), measure mults_per_group_op and
    gamma_meas on RC-1 archived targets, and emit an instrument spec suitable
    as a reachability-table column — or name the exact transcription / unit /
    dependency gap that blocks that column.

  class: measurement
  class_note: >-
    Cost-model / decision-instrument experiment. Carries
    HEUR-BINSTD-818b73-H1 (smoothness of toy gamma_meas readings). Not an
    exponent-moving breakthrough experiment; no ECDLP attack table produced.

  scope:
    included:
      - >-
        Stage 0 (ZERO COMPUTE beyond arithmetic). Write
        stage0/preregistered-predictions.json and stage0/instrument-spec.md
        freezing: R=60.81; floor formula; family budget_bits table for
        m in {2,3,4,5,6,8}; same-cell QSP restatement (>=49.19 bits from
        110 vs 60.81; cross-cell 133 labeled n'=66,m=2 only); unit vocabulary;
        citation of KN-FIND-aa2efc / EV-ICPERF-10c5fc as prior origin.
      - >-
        Stage 1. On RC-1 (n=17, m=2, l=9), count field multiplications for
        one group addition and for one W_4 (or structureless-oracle)
        refutation on identical archived instance bytes; report
        mults_per_group_op. Prefer read-only use of
        experiments/EXP-CERTBIN-e94b27/impl/; if unavailable, stop as
        O-INSTRUMENT naming the missing path.
      - >-
        Stage 2. Compute oracle_cost_per_attempt in group-op equivalents
        and gamma_meas = oracle_cost_per_attempt / toy_floor_per_attempt
        over the 144 archived RC-1 targets; report distribution (median,
        CV, min/max). Compare to gamma*(RC-1) from Stage-0 toy floor.
      - >-
        Stage 3. Write RESULTS.md with exactly one O-* label; write
        stage3/column-ready-note.md stating whether the instrument is ready
        to attach beside reachability-table cells (no GOAL/ledger status
        edits).
    excluded:
      - Designing or running IDEA-20260916-b84e2d's chain-system ladder
        (separate next_gate; not authorized here).
      - Magma/Sage/cypari2/AUXIN provisioning.
      - Amazon Bedrock.
      - Editing IDEA-20260922-818b73 claim text.
      - Editing shared GOAL-ECDLP2M-001.yaml.
      - Quoting the 133-bit QSP figure as the (n'=33,m=4) obstruction.
      - Claiming break / exponent / deployed attack / unconditional insecurity.
      - Treating infra failure as mathematical evidence.

  inputs:
    proposal: ledger/proposals/IDEA-20260922-818b73.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-a9d430.yaml
    question: ledger/questions/RQ-BINSTD-b6f698.yaml
    review: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-818b73.yaml
    prior_budget_finding: knowledge/findings/KN-FIND-aa2efc.md
    prior_budget_evidence: ledger/evidence/EV-ICPERF-10c5fc.yaml
    qsp_attempts_source: ledger/proposals/IDEA-20260916-3f7a1c.yaml
    rho_params: knowledge/literature/KN-LIT-661e97.md
    rho_lit: knowledge/literature/KN-LIT-096.md
    rc1_instrumentation: experiments/EXP-CERTBIN-e94b27/
    reachability_carrier_note: >-
      Column consumer is the reachability-table carrier designed from
      IDEA-20260922-6028ed (EXP-BINSTD-1efa8e on sibling branch / when
      merged). This contract does not edit that carrier.

  controls:
    - name: qsp_same_cell_reproduction
      description: >-
        Stage 0 must recover >=49.19-bit gap at (n'=33,m=4) from cited
        numbers only; 133-bit figure must be labeled cross-cell.
    - name: family_budget_reproduction
      description: >-
        Stage 0 budget_bits table must match review arithmetic within 0.01 bit.
    - name: structureless_oracle_null
      description: >-
        Brute-force pair enumeration on the same RC-1 instances as the
        structureless-oracle null (KN-FIND-aa2efc), when Stage 1-2 run.
    - name: floor_beside_gamma
      description: >-
        Report floor_bits beside every gamma*/budget_bits so a growing floor
        is never read as progress.
    - name: unit_field_required
      description: Every quoted gamma* carries unit and floor_citation.

  independent_variables:
    - name: stage
      levels: [0_arithmetic, 1_unit_calibration, 2_gamma_meas, 3_report]
    - name: arity_m_family_table
      levels: [2, 3, 4, 5, 6, 8]
    - name: rc1_target_index
      levels: '0..143 (archived; frozen)'

  metrics:
    primary:
      - name: qsp_same_cell_gap_bits
        unit: bits
        definition: attempts_bits_d3 - R at (n'=33,m=4); expected >=49.19 from citations.
      - name: family_budget_bits
        unit: bits
        definition: R - floor_bits(m) for each m; exact table in preregistered predictions.
      - name: mults_per_group_op
        unit: field_multiplications
        definition: Measured cost of one curve addition in the instrumented field.
      - name: gamma_meas_rc1
        unit: 'group-operation equivalents / toy-floor equivalents'
        definition: Distribution over 144 targets of oracle_cost_per_attempt / toy_floor_per_attempt.
    secondary:
      - name: oracle_cost_per_attempt
        unit: group-operation equivalents
        definition: Field mults of one refutation divided by mults_per_group_op.
      - name: gamma_star_rc1
        unit: dimensionless
        definition: 2^budget_bits(RC-1) from Stage-0 toy floor.
      - name: peak_rss_bytes
        unit: bytes
        definition: Peak RSS of Stage 1-2 process (memory honesty).

  heuristic_under_test: HEUR-BINSTD-818b73-H1

  preregistered_prediction:
    quantity: >-
      Stage-0 family budget_bits table and same-cell QSP gap; Stage-2
      gamma_meas distribution stability on RC-1.
    formula: >-
      budget_bits(m) = 60.81 - floor_bits(m) with floors
      [89.25, 68.58, 56.40, 48.44, 42.85, 35.61] at m=[2,3,4,5,6,8]
      → [none, none, 4.41, 12.37, 17.96, 25.20];
      qsp_same_cell_gap_bits = 110 - 60.81 = 49.19;
      Stage-2: no point prediction for gamma_meas median; stability
      requires max/min ratio ≤ 4 across the 144 targets on one host.
    source: >-
      analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-818b73.yaml
      concrete_experiment + KN-FIND-aa2efc / EV-ICPERF-10c5fc /
      IDEA-20260916-3f7a1c; frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      RC-1 is a toy calibration cell. ECC2K-130 family rows are arithmetic
      transcription of already-filed floors, not new crypto-scale solves.
      Transfer of gamma_meas from RC-1 to ECC2K-130 is NOT claimed; only the
      unit conversion (mults per group op) is intended to travel.
    correspondence: >-
      Same-unit conversion: field mults per group op measured on RC-1 host
      may be reused as a host-specific exchange rate when reading ECC2K-130
      oracle budgets; disclosed as host-bound, not curve-invariant.

  tail_checks:
    - >-
      Any gamma* quoted without unit or floor_citation fails the instrument.
    - >-
      Cross-cell 133-bit figure appearing as the (33,4) obstruction fails
      Stage 0.
    - >-
      gamma_meas within factor 4 of gamma*(RC-1) is a LIVE CANDIDATE signal
      (record's own Stage-2 interest) — report it; do not claim ECC2K-130
      reachability from that alone.

  replication:
    seeds: []
    independent_instances: 1
    note: >-
      Stage 0 deterministic. Stage 1-2 use frozen archived RC-1 targets
      (no new RNG). Optional second-host re-run of Stage 1 for unit
      stability is allowed but not required for O-INSTRUMENT-READY on one host.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1.0
    maximum_memory_gb: 4
    maximum_runs: 5
    maximum_workers: 1
    note: >-
      Advisory only (docs/research-budget-policy.md). Scientific sample count
      is the fixed 144 archived RC-1 targets — not expandable by leftover
      wall clock.

  stopping_rules:
    - >-
      SR-1. Stage 0 freeze complete before any RC-1 instrumentation.
    - >-
      SR-2. If Stage 0 reproduction fails → O-TRANSCRIPTION; do not run
      Stages 1-2 until corrected via amendment (prefer fix before freeze).
    - >-
      SR-3. If CERTBIN/RC-1 impl unavailable → O-INSTRUMENT with named path;
      Stage 0 artifacts alone may still ship as arithmetic deliverable.
    - >-
      SR-4. If gamma_meas max/min > 4 on one host → O-UNIT-UNSTABLE.
    - >-
      SR-5. On Stage 0 pass + Stages 1-2 stability → O-INSTRUMENT-READY.
    - >-
      SR-6. Advisory budget exhausted → O-IMPEDIMENT; never negative evidence.
    - >-
      SR-7. Do not escalate instrument readiness into any ECDLP security claim.

  invalidation_rules:
    - Editing stage0/preregistered-predictions.json after Stage-0 freeze.
    - Quoting 133-bit QSP figure as the (n'=33,m=4) obstruction.
    - Omitting KN-FIND-aa2efc / EV-ICPERF-10c5fc citations from the instrument spec.
    - Using R=60.9 without disclosing the 60.81 convention correction.
    - Provisioning Magma/Sage/cypari2/AUXIN as the success path.
    - Using Amazon Bedrock.
    - Editing IDEA-20260922-818b73 claim text or shared GOAL-ECDLP2M-001.yaml.
    - Overwriting a prior RUN-* directory.
    - Claiming break / exponent / deployed attack from this contract.
    - Designing/running IDEA-20260916-b84e2d under this card.

  success_criterion: >-
    ALL of: (1) Stage-0 freeze present with passing QSP same-cell and family
    budget_bits reproductions; (2) instrument-spec.md defines budget_bits,
    unit, floor_citation, gamma*, gamma_meas; (3) Stages 1-2 deliver
    mults_per_group_op and gamma_meas distribution OR a named O-INSTRUMENT
    stop after Stage 0; (4) if Stages 1-2 complete, max/min ratio ≤ 4;
    (5) RESULTS.md names exactly one O-* label; (6) no invalidation_rule
    fired. This delivers the exchange-rate instrument; it does NOT claim
    any curve is broken.

  falsification_criterion: >-
    ANY of: (F1) Stage-0 QSP gap <29.7 bits from cited numbers or family
    table mismatch >0.01 bit (O-TRANSCRIPTION); (F2) Stages 1-2 complete
    with max/min >4 (O-UNIT-UNSTABLE); (F3) Magma/Sage/AUXIN/Bedrock used
    as success path; (F4) 133-bit figure used as same-cell (33,4)
    obstruction. Budget exhaustion is O-IMPEDIMENT, not falsification of
    HEUR-BINSTD-818b73-H1.

  required_artifacts:
    - experiments/EXP-BINSTD-b2f621/implementation/
    - experiments/EXP-BINSTD-b2f621/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-b2f621/stage0/instrument-spec.md
    - experiments/EXP-BINSTD-b2f621/stage0/qsp-same-cell-reproduction.json
    - experiments/EXP-BINSTD-b2f621/stage0/family-budget-bits.json
    - experiments/EXP-BINSTD-b2f621/stage1/
    - experiments/EXP-BINSTD-b2f621/stage2/
    - experiments/EXP-BINSTD-b2f621/stage3/column-ready-note.md
    - experiments/EXP-BINSTD-b2f621/runs/
    - experiments/EXP-BINSTD-b2f621/RESULTS.md

  procedure:
    stages:
      - id: S0-FREEZE
        text: >-
          Write preregistered-predictions.json, instrument-spec.md,
          qsp-same-cell-reproduction.json, family-budget-bits.json;
          ZERO RC-1 instrumentation before freeze.
      - id: S1-UNIT
        text: >-
          Measure mults_per_group_op on RC-1 using archived instances /
          EXP-CERTBIN-e94b27/impl (read-only); write stage1/ report.
      - id: S2-GAMMA
        text: >-
          Compute gamma_meas distribution over 144 targets; write stage2/
          report with median/CV/min/max and gamma*(RC-1).
      - id: S3-REPORT
        text: >-
          Write RESULTS.md with exactly one O-* label and
          stage3/column-ready-note.md; observations only; no ledger
          status edits.
      - id: S-SUM
        text: >-
          Preserve raw manifests under runs/; cite RUN IDs.

  assigned_to: executor
  executor_handoff: TASK-20261002-ee5aaa
  snapshot_task: TASK-20261002-866280

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
