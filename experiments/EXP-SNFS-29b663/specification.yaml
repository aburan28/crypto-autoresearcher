experiment:
  id: EXP-SNFS-29b663
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-938a96; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-938a96
  question_id: RQ-RSA-afe33c
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Exhaustive bounded-box shape detector for composite moduli near perfect powers: planted
    and random semiprime arms, exact hit re-verification, and a measured coverage-versus-false-positive
    curve'
  objective: 'The one uncertainty a run reduces is what an exact negative detection statement costs
    and what it is worth, in the one setting where completeness over a declared box is affordable.
    (i) Is the tool complete on its own box: are planted composites of the declared shape detected
    without exception, and does every hit survive exact re-verification by recomputing the power,
    since a tool whose completeness is not demonstrated cannot support any negative statement at all.
    (ii) Does it predict its own noise: is the measured false-positive rate on random balanced semiprimes
    consistent with the counting estimate from the density of perfect powers, corrected for the semiprime
    restriction, because a tool whose error model is validated can be quoted with a false-positive
    rate rather than merely with a hit count. (iii) How does the exact statement degrade as it is
    strengthened: as the tolerance S and the exponent bound E grow, how fast does the false-positive
    rate rise against the coverage gained, which turns the choice of box from an arbitrary convention
    into a measured tradeoff and is the only part of the run that generalises. All three are answered
    from one pass over the same two arms.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: medium
    exact_scope_a_run_could_support: 'The maximal claim a run could support is: over the declared
      box, the detector decides membership exactly, its true-positive rate on planted instances is
      as measured, its false-positive rate on random balanced semiprimes is as measured and stands
      in the reported relation to the counting prediction, and the coverage-versus-noise curve is
      as plotted. What does NOT follow: nothing about moduli of shapes outside the box, nothing about
      any real, published or deployed modulus, nothing about factoring cost or security, and no statement
      that a negative detection means a modulus lacks structure.'
  inputs:
    procedure: 'STAGE 0, zero compute: derive the base-radius bound justifying delta and the counting
      estimate for accidental hits, including the semiprime correction, and record both before generation.
      STAGE 1, minutes: implement exact integer e-th roots by Newton iteration and validate exhaustively
      for all N below 10^6 and all e up to 20. STAGE 2, minutes: implement the box detector with mandatory
      exact re-verification of every hit. STAGE 3, tens of minutes: build the planted arm by searching
      s until N is a balanced semiprime, and the null arm as random balanced semiprimes, both with
      recorded seeds. STAGE 4, minutes: run the detector on both arms at the base box. STAGE 5, tens
      of minutes: sweep S over four doublings and E over {8, 16, 32, 64}, recording hit rates at each
      setting. STAGE 6, minutes: run the delta-zero, shape-mismatch and size-sweep controls. STAGE
      7, seconds: compare measured against predicted false-positive rates and emit the coverage-versus-noise
      curve and the run manifest.'
    instrument: Pure Python 3.11 standard library only; numpy, sympy, gmpy2 and fpylll are absent
      in this environment and Sage is excluded by contract. Arbitrary-precision int with a hand-written
      integer Newton nth-root, pow for exact verification, a shared Miller-Rabin for semiprime construction,
      statistics for summaries. New module harness/snfs_shapebox.py holds the root extractor, the
      box detector, the two samplers and the controls; harness/runner.py records the manifest and
      the inference block.
    parameters: Modulus bit sizes n in {64, 128, 256}. Exponent bound E in {8, 16, 32, 64}. Base radius
      delta in {0, 1, 2}. Tolerance S in {2^8, 2^12, 2^16, 2^20}. Planted arm 500 composites per size
      with e drawn from 2 to 8; null arm 500 random balanced semiprimes per size. Shape-mismatch arm
      200 composites of the form a r^e + s with a in {2,3,5}. Per-cell wall-clock cap 600 seconds.
  controls:
  - The random balanced semiprime null arm in the same invocation.
  - Exact re-verification of every hit by recomputing r^e and comparing to N, so no hit is reported
    on the strength of the root extraction alone.
  - A shifted-box control in which delta is set to zero, which must catch a strict subset of the hits
    and quantifies how much the radius contributes.
  - A shape-mismatch control planting N = a r^e + s with a > 1, which must be missed by the box detector,
    confirming the coverage boundary is real.
  - A size sweep at n in {64, 128, 256} to check that the false-positive rate follows the perfect-power
    density rather than a size artifact.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Random balanced semiprimes of the identical bit length, generated by
    the identical primality routine and scored by the identical detector in the same invocation, together
    with the counting prediction for the accidental hit rate. The null must show two things: that
    hits occur at approximately the predicted rate (2S+1) times the local density of perfect powers
    summed over e, so that the tool''s own error model is validated; and that every null hit, when
    inspected, is a genuine accidental nearness rather than a bug in the root extraction. If the null
    hit rate greatly exceeds prediction, the tool''s coverage statement is intact but its usefulness
    collapses, and that is reported as measured.'
  independent_variables:
  - modulus bit size n
  - exponent bound E
  - base radius delta
  - tolerance S
  - 'arm: planted, null, or shape-mismatch'
  metrics:
    primary:
    - true-positive rate on the planted arm
    - false-positive rate on the null arm per (E, delta, S)
    - measured-to-predicted false-positive ratio
    - coverage box cardinality E(2 delta + 1)
    - shape-mismatch detection rate, expected near zero
    secondary:
    - hit multiplicity per modulus
    - per-exponent hit breakdown
    - integer-power operations and wall-clock per modulus
    - re-verification failure count, expected zero
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The false-positive rate of the box detector on random balanced semiprimes at each (E,
      delta, S) setting.
    formula: FP(E,delta,S) is predicted as the sum over e from 2 to E of the probability that N lies
      within S of some e-th power with base within delta of the integer root, approximated by sum_e
      (2 delta + 1)(2S + 1) / gap_e(N), where gap_e(N) = (r0 + 1)^e - r0^e is approximately e N^(1
      - 1/e) is the local spacing of e-th powers near N, with a multiplicative correction for the
      restriction of N to balanced semiprimes. The dominant term is e = 2 and the prediction falls
      steeply with e.
    source: Pre-registered in the parent proposal IDEA-20260816-938a96 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: medium
    justification: 'Tested at 64, 128 and 256 bits. The detector''s cost does not grow with modulus
      size beyond big-integer arithmetic, so unlike every other contract in this batch there is no
      affordability barrier to the instrument itself at any size, and the size sweep exists only to
      check that the false-positive rate follows the perfect-power spacing rather than a size artifact.
      The transfer assumption is stated narrowly: the spacing formula gap_e(N) is exact arithmetic
      and is expected to hold at any n, but the semiprime correction is measured only at the tested
      sizes and may not be constant, so no false-positive rate is quoted outside them.'
    correspondence: null
  tail_checks:
  - Inspect every null hit individually and confirm the accidental nearness by exact arithmetic.
  - Inspect exponent 2 separately, since it dominates the hit rate and can mask the behaviour at larger
    e.
  - Inspect moduli with hit multiplicity above one, which indicate either a genuine multi-representation
    or a bug.
  - Check the largest S setting for saturation, where nearly every modulus hits and the tool becomes
    uninformative.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop a cell at its 600-second cap and record it as budget-truncated rather than as a result.
  - Abort if any hit fails exact re-verification, since the root extractor is then unsound and all
    rates are void.
  - Abort if any planted instance inside the box is missed.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Every (E, delta, S) cell reports true-positive and false-positive rates with
    exact hit re-verification, the counting prediction is compared against the measurement, and the
    coverage-versus-noise curve is emitted with its box parameters attached to every verdict.
  falsification_criterion:
  - A planted instance inside the box is missed.
  - Any hit fails exact re-verification.
  - The measured false-positive rate departs from the counting prediction by more than a factor of
    three at the base box.
  - The shape-mismatch arm is detected, showing the coverage boundary is misstated.
  - The false-positive rate fails to scale with S and with the derived spacing across the sweep.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-938a96
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The semiprime correction to the counting model is asserted to exist but not derived here, and
    the Coordinator must either derive it or require the prediction to be stated only for uniform
    integers.
  - The base-radius bound justifying delta needs to be written explicitly so that the completeness
    claim over the box is proved rather than assumed.
  - Whether this record belongs under RQ-RSA-afe33c or should be handed to GOAL-SNFS-001 is a genuine
    ownership question given the goal's non-duplication clause, and a Coordinator must rule before
    approval.
