protocol_amendment:
  experiment_id: EXP-PFDR-25057c
  version: 2
  amendment_kind: additive_protocol_completion
  approved_by: coordinator
  approval_decision_id: DEC-20260907-b18b6f
  source_binding:
    path: experiments/EXP-PFDR-25057c/specification.yaml
    sha256: b3d062f536345516a25274e514772de6c713dff3575a4b2fbd6b56b237b07184
    hypothesis_id: H-PFDR-d5f90f
    hypothesis_sha256: 221f985ed105aabd4a9fbbe0283c56f2f0c8ea4401deed06e77c1821eb609b79
    idea_id: IDEA-20260905-850460
    packet: coordination/design/BATCH-95c459/source-packet.json
  resolution_rule: >-
    Verify and inherit the entire original specification. Apply only the listed
    prospective administrative budget replacements, attach extensions as
    protocol_completion and conjoin all launch gates. Preserve every original
    formula, tuple, control, degree/matrix bound, metric, order, prediction,
    scientific count and outcome condition. This remains a full lower-and-upper
    ordinary last-fall experiment, not a substitute lower-bound-only task.
  field_changes:
    - {path: experiment.budget.wall_clock_seconds_per_run, operation: replace_prospectively, original_value: 1200, effective_value: null}
    - {path: experiment.budget.total_cpu_hours, operation: replace_prospectively, original_value: 4, effective_value: null}
    - {path: 'experiment.budget.stages[0].wall_clock_seconds', operation: replace_prospectively, original_value: 1200, effective_value: null}
    - {path: 'experiment.budget.stages[1].wall_clock_seconds', operation: replace_prospectively, original_value: 13200, effective_value: null}
    - {path: experiment.protocol_completion, operation: add, value_from: This amendment's extensions mapping.}
  budget_interpretation: >-
    Routine CPU/time estimates become advisory nulls under current policy; the
    historical 14400-second total is not a campaign limit. Preserve twelve
    groups, the native one-group stage and eleven target/null groups, 8 GiB,
    one worker, all degree caps and both matrix caps. Retain the documented
    1200-second supervisor checkpoint separately; expiry preserves evidence
    and requires additive continuation handling rather than campaign exhaustion.
  extensions:
    interfaces: coordination/design/BATCH-95c459/interfaces.md
    two_separate_metrics: Ordinary-ring certified last-fall interval and Boolean quotient d_layer profile; neither substitutes for the other.
    canonical_fixtures:
      native_controls:
        - {q: 3, variable_order: [w,x,y,z], generators: ['x^2-x', 'x*y-1', 'w^3-w', 'w^2*z^2-1'], predicted_dlf: 5}
        - {q: 5, variable_order: [w,x,y,z], generators: ['x^2-x', 'x*y-1', 'w^5-w', 'w^4*z^4-1'], predicted_dlf: 9}
      native_admission: Prime q in [3,5] with q!=2; exact four ordinary generators only. No curve p>3 gate or added field/digit equations.
      targets: p=257, s in [2,3,4], (a,b) in [(2,3),(5,7)]; plus p=263,s=2,(a,b)=(2,3).
      xR: Least integer x with square curve RHS found by exhaustive y including zero.
      target_formula: (x1-x2)^2*xR^2-2*((x1+x2)*(x1*x2+a)+2*b)*xR+(x1*x2-a)^2-4*b*(x1+x2)
      target_reduction: Substitute x_k=sum_i 2^i*z_(k,i), reduce every positive digit exponent to one to construct f, then place f in the ordinary ring without further Boolean reduction.
      ordinary_target_generators: '[f,z1^2-z1,...,z_(2s)^2-z_(2s)] in this exact order.'
      variants: [target, block_null, support_matched_null]
      block_null: '(Q1+1)*(Q2+1), Q_k=2*sum_(i<j)2^(i+j)*z_(k,i)*z_(k,j).'
      support_null: Rotate nonzero coefficients by one inside each degree slice ordered by ascending bitmask; empty/singleton slices unchanged; retain exact support and coincident aliases.
      target_admission: Prime p>3, nonsingular curve, 2^s<=p, exact reduced degree four; apply only to target-derived systems and their nulls.
      target_truth_checks: Independent full Boolean assignment tables and source polynomial reconstruction; rational-target flags kept separate.
    schedule:
      labeled_fixtures: 23
      scheduled_groups: 12
      ordering: Native q=3 then q=5 first; target systems sorted p,s,a,b, each with target/block/support variants in that order.
      group_rule: Twelve consecutive groups of at most two labels; group 1 contains the two native systems, groups 2-11 have two labels and group 12 has one.
      stage_groups: Native group 1 blocks target/null groups 2 through 12 until its original control conditions pass.
      seed: 0
      independent_instances: 0
      hash_deduplication: Preserve all per-label computations/checks and group positions; hash deduplication affects reporting or verified identical physical storage only, never scientific run elision or independent-instance counts.
    ordinary_algorithm:
      ring: Ordinary polynomial ring over the fixture field; no coefficient-side Boolean quotient reductions.
      variable_order: Target z1>...>z_(2s); native w>x>y>z.
      monomial_order: Degree-compatible grevlex, descending degree then descending grevlex; include the degree-zero constant.
      column_count: binomial(n+D,D).
      target_D_cap: 2*s+4
      native_D_cap: 10
      degrees: Every integer D from zero through its cap, subject only to declared resource/censoring branches; no early terminal inference from a plateau.
      initialization: Every original generator of degree at most D; retain the full source generator list for ideal tests.
      fixed_point: Exact normalized leftmost-pivot RREF; multiply every row of degree at most D-1 by each variable, reduce, and repeat complete passes until rank is stable at this D.
      derivations: All initial, row-operation and variable-multiplication derivations rooted in original F, with exact coefficients and declared polynomial degrees.
      max_columns: 20000
      max_entries: 25000000
      allocation_gate: Check logical shape before every next coefficient/augmented/certificate matrix; sparse storage does not evade caps. Refuse that matrix and retain certified prefix bounds.
    lower_certificate:
      witness: Nonzero g with deg(g)<k, g in completed V_F,k and g not in completed V_F,k-1.
      membership: Exact derivation DAG rooted in original generators and admitted degree-bounded operations.
      nonmembership: Independently verified augmented rank or separating functional on the entire earlier closed space.
      deterministic_selection: Examine low-degree RREF intersection rows in row order; retain all reported witnesses; never infer nonmembership against an incomplete earlier space.
      lower_bound: Maximum certified k, with zero as the default bound.
    upper_certificate:
      candidate: Nonzero rows of the completed closure RREF at D, in deterministic row order.
      required_checks:
        - Exact ideal equality with the entire original ordered F, including generators above D.
        - Every candidate row has a valid derivation into V_F,D.
        - All Buchberger pairs reduce to zero, in lexicographic row-index order with least-index eligible division.
        - The monomial order and division are degree-compatible and certify termwise degree bounds.
        - The computed V_F,D is a complete fixed point, with valid monotonicity and product-closure interface.
      lemma: >-
        Under these premises, division of any f in (F) expresses it by G with
        monomial-product degrees at most deg(f). For M=max(D,deg(f)), the
        V_F,M product closure therefore contains f. Definition 1.5 gives d_lf<=D.
      forbidden_shortcuts: [output_basis_degree, solving_degree, across_D_plateau, same_ideal_without_Groebner, quotient_onset_without_transfer]
      exactness: Report exact d_lf only when maximum certified lower equals minimum certified upper; otherwise [L,U] with null U if absent. L>U invalidates the certificates.
    quotient_meter:
      applicable: The 21 target-derived labeled fixtures only; native ordinary controls have an explicit not-applicable quotient status.
      degrees: Every D=4,...,2*s+4.
      maps: Exact U/T definitions and certificates in interfaces.md, including explicit empty top rows for D>2*s.
      predicted_target_onsets: {s2: 5, s3: 5, s4: 6}
      transfer: No equality with ordinary d_lf without a separate proved transfer statement.
    endpoint_reporting:
      native_predictions: Exact ordinary d_lf=5 and 9, with prefixes below the final fall remaining certified bounds only.
      target_ordinary_prediction: No numerical ordinary last-fall value is preregistered.
      fixed_p_comparison: At p=257 compare only certified endpoints for each fixed curve across the declared s values; retain target and null labels separately.
      interval_rule: For endpoint intervals [L1,U1],[L2,U2], a difference may have bounds [L2-U1,U2-L1] only when the needed endpoints exist; missing sides stay null. Exact finite difference requires exact endpoints.
      calibration: p=263,s=2 stays a separate fixed-s calibration, never an extra point in a p=257 growth fit.
      prohibited: No fitted slope, confidence interval, unbounded-family claim, or inequality inferred from censored points.
    proof_search_map:
      bottleneck: Complete ordinary closure and certified upper bounds distinguish last-fall from visible row drops or basis degree.
      baseline_embedding:
        parameter_slice: Exact Example 4.4 native ordinary q=3 and 5 systems, with no added equations.
        reproduction_check: Independently certify both lower witnesses and matching upper bounds 5 and 9 before interpreting the eleven target/null groups.
      observation_collision:
        observable: A stable row rank, output basis degree, or Boolean onset.
        distinct_preimage_search: Compare incomplete prefixes and different ordinary ideals; identical such observables do not identify d_lf.
      constructive_transforms:
        - {transform: observable_fiber, description: Rotate coefficients within exact support slices., proposed_object: support_matched_null, predicted_gain: None presumed; separates support from coefficient-specific behavior.}
      quantifier_order: For each fixed input and each completed D certify V_F,D; the all-f statement of the upper lemma is conditional on every explicit Groebner/division/membership premise.
      method_ceiling:
        strongest_certifiable_claim: Exact values or certified intervals for the finite original panels and finite fixed-p differences with certified endpoints.
        nearby_object_control: 'F={x^2,x^2-x}, G={x} defeats basis-degree-only upper bounds because x is not in V_F,1; conceptual audit only, not an added run.'
      proof_obligations:
        - {claim: The iterative finite procedure computes V_F,D, responsibility: correctness, owner: Separate closure checker with complete derivations and fixed-point test.}
        - {claim: Lower witnesses exclude V_F,k-1, responsibility: correctness, owner: Independent rank/separating-functional checker.}
        - {claim: The degree-compatible Groebner certificate implies d_lf<=D, responsibility: correctness, owner: Independent upper-certificate review under interfaces.md.}
        - {claim: Quotient and ordinary outputs remain distinct and resource-censored endpoints are not extrapolated., responsibility: scope, owner: Manifest/report checker.}
      not_applicable_reason: null
    artifacts:
      run_directory: experiments/EXP-PFDR-25057c/runs/<genuinely_allocated_RUN_ID>/
      root_filenames: [launch.json, terminal-receipt.json, manifest.yaml, command.txt, environment.json, stdout.log, stderr.log, input-bindings.json, execution-plan.json, fixture-index.json, raw-result.json, controls.json, bounds-table.json, endpoint-comparisons.json, payload-resources.json, omission-receipts.jsonl, execution-report.yaml, artifact-sha256.json]
      fixture_directory: fixtures/<fixed_label_01_through_23>/
      fixture_filenames: [input.json, admission.json, truth-table.jsonl, coefficient-check.json, ordinary-profile.json, quotient-profile.json, alias.json]
      ordinary_degree_directory: fixtures/<fixed_label>/ordinary/D-<two_digit_D>/
      ordinary_degree_filenames: [status.json, columns.json, initial-rows.json, closure-steps.jsonl, rref.json, derivations.json, lower-witnesses.jsonl, nonmembership.json, groebner.json, buchberger.jsonl, ideal-inclusions.json, upper-bound.json, bounds.json, resources.json]
      quotient_degree_directory: fixtures/<fixed_label>/quotient/D-<two_digit_D>/
      quotient_degree_filenames: [status.json, U.json, T.json, elimination-U.json, elimination-T.json, kernel-T.json, image-U-kernel-T.json, intersection-kernel.json, rank-certificate.json, rank-report.json, resources.json]
      exact_semantics: >-
        Index every expected path by completion/alias/censor/failure/omission
        state. Native truth-table and quotient files declare not applicable;
        do not invent Boolean native measurements. Unique inputs have explicit
        null alias.json; storage duplicates bind identical independently computed artifacts without skipping per-label work. Empty witness
        lists are explicit, not missing. Missing upper certificates are recorded
        as unavailable with failed premise or censor reason, never empty success.
        A censored degree retains status and last certified bounds without fake
        matrices. Hash all materialized files except the hash index itself; the
        archive binds that index. Retain every original artifact requirement.
      omitted_group_layout: experiments/EXP-PFDR-25057c/execution-plans/<actual_plan_id>/omissions/group-<01_through_12>.json
      omitted_group_rule: Bind fixed labels and exact native/control/resource/admission blocker; do not allocate a fictional executed run for an omission.
    runtime:
      supervisor: tools/audit_process.py
      guide: docs/first-fall-audit-repair.md
      guide_sha256: 3b440b357d8021b7ed628fe2df7095a1bbe8301434dc40d16de6a70d9b3465b0
      seconds: 1200
      native_setup_payload_seconds: 1200
      native_cpu_limit_seconds: 1200
      native_kill_cleanup_additional_seconds: 5
      docker_setup_payload_seconds: 1190
      docker_cleanup_reserve_seconds: 10
      memory_bytes: 8589934592
      workers: 1
      backend: Actual supported backend/image and all source hashes must be probed and frozen before fixture work; no availability is asserted.
      requirements: Guard preflight, exclusive early launch receipt, payload CPU/RSS, bounded cleanup and operational failure semantics in interfaces.md.
      docker_artifact_transport: Implement PFDR1 chunked stdout checkpoints and bounded allowlisted host extraction from interfaces.md; no assumed output mount, whole-log parse, lost partial degrees or shared-tool edits.
    outcome_completion:
      success: Original native exact-value and target/endpoint checks with independent decisive certificates; do not redefine success as lower bounds alone.
      finite_negative: A completed independently certified mismatch concerns only its precise finite prediction and domain.
      inconclusive: Unresolved bounds, unavailable decisive certificates, native control incompletion or resource censoring; no inferred ordinary degree.
      invalid: Wrong ring, omitted source equations, unsupported upper premise, inexact rank, independent disagreement, altered panels or undeclared missing artifacts.
      native_failure: Retain both attempted control receipts and omit later groups with reasons; do not interpret unmeasured targets or convert infrastructure failure into mathematics.
    execution_admission:
      execution_authorized: false
      prior_decision: DEC-20260907-b608b8
      prior_decision_sha256: b60852c1c33cdd5d0c34e533b647d2dd8717acf63707ea4bf33419674ee7c4b5
      required_native_successor: Resolve the source Definition 1.3 zero-slot issue, freeze a successor and obtain actual native audit measurements for groups 1 and 3.
      separate_disposition: Require a subsequent committed Coordinator disposition explicitly admitting these panels; ordinary-definition completeness does not waive that prerequisite.
      additional_gates: Archived and independently reviewed implementation, actual guard/backend preflight, frozen source/image/plan, valid claim, and genuinely allocated scientific launch lock.
  provenance:
    kind: internal
    verified_by: parent_control_plane/01a07d9c-ceb4-7892-ae01-260e4b5f0374
    access: Parent-transmitted source objects, hashes, primary reading and runtime API; elementary interface derivations by this Coordinator, without execution or independent source readback.
