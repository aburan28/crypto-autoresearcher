# EXP-DREG-4e87c0
# Syzygy-gate decision table. No matrix.
# Approved by DEC-20261002-9897ef.
experiment:
  id: EXP-DREG-4e87c0
  hypothesis_id: H-DREG-5c622e
  source_idea: IDEA-20260922-f7de2a
  question_id: RQ-DREG-c8ae8d
  version: 1
  title: Syzygy-gate decision table
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-9897ef
  objective: >-
    Reduce one explicit combination and apply the extra-fall
    acceptance rule to six gate rows.
  inputs:
    D: 2
    coeff_a: 1
    coeff_b: 3
    constant: -2
    degree_when_nonzero: 0
    char2_zero: true
    char3_nonzero: true
    char5_nonzero: true
    char7_nonzero: true
    accept_stored: 1
    accept_neighbor: 0
    accept_random: 0
    accept_gauges: 2
    one_gauge: 1
    empty_pairs: 0
    empty_acceptances: 0
    random_as_curve: 0
    ell_in: 2
    ell_out: [3, 5]
    order: 15
    gcd_2: 1
    gcd_3: 3
    gcd_5: 5
  controls:
    - >-
      The four-condition row is accept. The row with one gauge
      model is reject. Calling the one-gauge row an acceptance
      invalidates the run.
    - >-
      A missing stored tuple is reject. A neighbor fall count of 1
      is reject. A random fall count of 1 is reject. Calling any
      of those rows accept invalidates the run.
    - >-
      Zero supplied pairs give zero acceptances. Reporting an
      acceptance from the empty gate invalidates the run.
    - >-
      An unfinished neighbor is unmeasured. Recording it as a zero
      fall invalidates the run.
    - >-
      The combination is the constant -2. It is the zero polynomial
      in characteristic 2 and a degree-0 polynomial in
      characteristics 3, 5 and 7. Reporting a nonzero degree in
      characteristic 2 invalidates the run.
    - >-
      A random fall reported as a curve effect must have count 0.
      A count of 1 voids the batch.
    - >-
      Degree 2 is coprime to 15. Degrees 3 and 5 are not. Reporting
      degree 3 as coprime to 15 invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - gate row
    - route in {reduce, count}
  metrics:
    primary:
      - accept_row
      - one_gauge_reject
      - char2_zero
      - implementations_agree
    secondary:
      - empty_acceptances
      - gcd_2
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The accept row and the degree of the constant -2.
    formula: >-
      Subtract the two quadratics. The difference is the constant
      -2. Its degree is 0 when it is nonzero, and it is the zero
      polynomial when the characteristic divides 2. Accept an extra
      fall only when the stored bit is 1, both fall counts are 0,
      and the gauge count is at least 2. Every other supplied row
      is reject. Zero pairs give zero acceptances.
    source: >-
      IDEA-20260922-f7de2a states the accept-extra conditions and
      the empty gate, read 2026-10-02. The combination was reduced
      in this design session. That reduction is not a run. No
      matrix was built.
  scale_relevance:
    tier: toy
    justification: One combination and six rows. No transfer to a measured fall.
    correspondence: null
  tail_checks:
    - The characteristic-2 row is required. Stopping at characteristic 5 and still reporting a degree for the zero combination is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the one-gauge row is reported as accept, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The one-gauge row is reported as accept.
    - A row with a missing tuple, a neighbor fall, or a random fall is reported as accept.
    - The empty gate reports an acceptance.
    - An unfinished neighbor is recorded as a zero fall.
    - Characteristic 2 is reported as a nonzero combination.
    - The random-as-curve count is reported above 0.
    - A matrix or an outlier search is reported.
  success_criterion: >-
    Both runs agree that the four-condition row is accept, that
    the one-gauge row and the three failed rows are reject, that
    zero pairs give zero acceptances, that the constant -2 is zero
    in characteristic 2 and nonzero of degree 0 in characteristics
    3, 5 and 7, and that gcd(2, 15) is 1 while gcd(3, 15) and
    gcd(5, 15) are not.
  falsification_criterion: >-
    The runs agree, the four-condition row stays accept, and any
    row differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-DREG-4e87c0/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-DREG-4e87c0/runs/<RUN-ID>/command.txt
    - experiments/EXP-DREG-4e87c0/runs/<RUN-ID>/stdout.log
    - experiments/EXP-DREG-4e87c0/runs/<RUN-ID>/stderr.log
    - experiments/EXP-DREG-4e87c0/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-DREG-4e87c0/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any Macaulay matrix, kernel extraction, or outlier search.
    - Any claim that a scalar fall gap is a mechanism.
    - Reporting a random-system fall as a curve effect.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
