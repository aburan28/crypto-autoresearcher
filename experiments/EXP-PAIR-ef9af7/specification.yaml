# EXP-PAIR-ef9af7
# Toy class-polynomial constructor: degree, split traces, inert
# misses, one truncation, one conductor pair.
# Frozen before any run. The table is a prediction, not a result.
experiment:
  id: EXP-PAIR-ef9af7
  hypothesis_id: H-PAIR-6236da
  source_idea: IDEA-20261005-3a18d1
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-PAIR-001
  version: 1
  title: >-
    Named-cell trace verdicts for the class-polynomial constructor
  status: approved
  frozen: true
  designed_at: '2026-10-05'
  approved_by: coordinator
  approval_decision_id: DEC-20261005-5914b6
  objective: >-
    Recompute each named class polynomial, check its degree and
    coefficient bit length, and score the split, inert,
    truncation, and conductor cells by point counting both
    twists.
  inputs:
    weierstrass: >-
      j = 0 gives y^2 = x^3 + 1. j = 1728 gives y^2 = x^3 + x.
      Otherwise k = j / (1728 - j) and the model is
      y^2 = x^3 + 3*k*x + 2*k.
    degree_rows:
      - {D: -3, class_number: 1, degree: 1, max_coeff_bits: 1}
      - {D: -4, class_number: 1, degree: 1, max_coeff_bits: 11}
      - {D: -7, class_number: 1, degree: 1, max_coeff_bits: 12}
      - {D: -8, class_number: 1, degree: 1, max_coeff_bits: 13}
      - {D: -11, class_number: 1, degree: 1, max_coeff_bits: 16}
      - {D: -12, class_number: 1, degree: 1, max_coeff_bits: 16}
      - {D: -23, class_number: 3, degree: 3, max_coeff_bits: 44}
      - {D: -31, class_number: 3, degree: 3, max_coeff_bits: 51}
      - {D: -47, class_number: 5, degree: 5, max_coeff_bits: 84}
    split_cells:
      - {D: -7, p: 11, t: 4, v: 2, roots: 1}
      - {D: -7, p: 23, t: 8, v: 2, roots: 1}
      - {D: -7, p: 43, t: 12, v: 2, roots: 1}
      - {D: -7, p: 71, t: 16, v: 2, roots: 1}
      - {D: -8, p: 11, t: 6, v: 1, roots: 1}
      - {D: -8, p: 83, t: 18, v: 1, roots: 1}
      - {D: -8, p: 227, t: 30, v: 1, roots: 1}
      - {D: -8, p: 443, t: 42, v: 1, roots: 1}
      - {D: -11, p: 5, t: 3, v: 1, roots: 1}
      - {D: -11, p: 23, t: 9, v: 1, roots: 1}
      - {D: -11, p: 59, t: 15, v: 1, roots: 1}
      - {D: -11, p: 113, t: 21, v: 1, roots: 1}
      - {D: -23, p: 59, t: 12, v: 2, roots: 3}
      - {D: -23, p: 167, t: 24, v: 2, roots: 3}
      - {D: -23, p: 347, t: 36, v: 2, roots: 3}
      - {D: -23, p: 599, t: 48, v: 2, roots: 3}
      - {D: -31, p: 47, t: 8, v: 2, roots: 3}
      - {D: -31, p: 67, t: 12, v: 2, roots: 3}
      - {D: -31, p: 131, t: 20, v: 2, roots: 3}
      - {D: -31, p: 227, t: 28, v: 2, roots: 3}
      - {D: -47, p: 83, t: 12, v: 2, roots: 5}
      - {D: -47, p: 191, t: 24, v: 2, roots: 5}
      - {D: -47, p: 947, t: 60, v: 2, roots: 5}
      - {D: -47, p: 1811, t: 84, v: 2, roots: 5}
    inert_cells:
      - {D: -7, p: 13, roots: 1, norm_hits: 0}
      - {D: -7, p: 17, roots: 1, norm_hits: 0}
      - {D: -8, p: 13, roots: 1, norm_hits: 0}
      - {D: -8, p: 23, roots: 1, norm_hits: 0}
      - {D: -11, p: 13, roots: 1, norm_hits: 0}
      - {D: -11, p: 17, roots: 1, norm_hits: 0}
      - {D: -23, p: 37, roots: 1, norm_hits: 0}
      - {D: -23, p: 43, roots: 1, norm_hits: 0}
      - {D: -31, p: 37, roots: 1, norm_hits: 0}
      - {D: -31, p: 43, roots: 1, norm_hits: 0}
      - {D: -47, p: 67, roots: 1, norm_hits: 0}
      - {D: -47, p: 73, roots: 1, norm_hits: 0}
    second_counter_cells:
      - {D: -7, p: 11}
      - {D: -7, p: 23}
      - {D: -8, p: 11}
      - {D: -8, p: 83}
      - {D: -11, p: 5}
    truncation:
      D: -23
      p: 59
      t: 12
      exact_roots: 3
      half_bit_roots: 0
      short_modulus: 4194304
      short_roots: 0
      half_bit_rule: >-
        For each coefficient c, let a be its absolute value and
        s the floor of half its bit length. Replace c by
        sign(c) times (a right-shifted by s, then left-shifted
        by s). A zero coefficient stays zero.
      short_rule: >-
        Replace each coefficient by its remainder modulo
        4194304, then subtract 4194304 when that remainder
        exceeds 2097152.
    conductor:
      D_max: -3
      D_conductor: -12
      p: 7
      roots_max: [0]
      roots_conductor: [2]
      absolute_traces: [4, 4]
    predicted_split_matches: 24
    predicted_split_mismatches: 0
    predicted_inert_norm_hits: 0
    predicted_degree_mismatches: 0
    predicted_counter_disagreements: 0
  controls:
    - >-
      Class-number-1 rows -3, -4, -7, -8, and -11. A degree or
      trace mismatch there invalidates the pipeline.
    - >-
      Two constructions of each H_D must agree as elements of
      Z[X] before traces are scored. Disagreement invalidates
      that discriminant.
    - >-
      Second counter. On the five named split cells, the trace
      from the group-order routine and the trace from
      p + 1 + the sum of Legendre symbols of the cubic must
      agree. A disagreement voids the cell.
    - >-
      Both twists are counted on every split cell. Scoring one
      model only is invalid.
    - >-
      j = 0 appears in the conductor cell and is not entered in
      the 24-cell split rate.
  independent_variables:
    - arm in {degree, split, inert, truncation, conductor}
  metrics:
    primary:
      - split_matches
      - inert_norm_hits
      - truncation_root_counts
      - conductor_root_sets
    secondary:
      - degree_minus_class_number
      - max_coeff_bits
      - counter_disagreements
  heuristic_under_test: HEUR-CM-SPLIT-1
  preregistered_prediction:
    quantity: >-
      Split matches 24 of 24. Inert norm hits 0 of 12, with one
      root on each inert cell. Degree mismatches 0. At D = -23
      and p = 59 both altered polynomials have 0 roots. At p = 7
      the root sets are {0} and {2} and both absolute traces
      are 4.
    formula: >-
      A split match means 4p = t^2 - v^2 D and the two twist
      traces are exactly t and -t. An inert hit means
      (trace^2 - 4p) / D is a nonnegative square. Bit length is
      the bit length of the absolute value of the largest
      coefficient.
    source: >-
      IDEA-20261005-3a18d1, specialized to the cells named in
      inputs. The counts were computed in the design session
      and are not a run.
  scale_relevance:
    tier: toy
    justification: >-
      Class numbers at most 5 and primes at most 1811. No
      transfer to a cryptographic discriminant or to a prime
      of 28 bits.
    correspondence: null
  tail_checks:
    - >-
      The cell D = -47, p = 1811, t = 84 has five roots. Dropping
      the largest prime invalidates the split arm.
    - >-
      Each inert cell has one root. Treating a present root as
      an empty failure is not the inert prediction.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: >-
      Deterministic. One manifest per arm. The second instance
      is the second construction of H_D, not a second sample.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 5
    maximum_workers: 1
  stopping_rules:
    - Stop after five valid manifests, one per arm.
    - Do not add a discriminant or a prime.
    - Do not score a ramified prime.
  invalidation_rules:
    - The two constructions of H_D disagree.
    - Degree differs from the class number.
    - 4p is not t^2 - v^2 D on a listed split cell.
    - The second counter disagrees on a named cell.
    - A timeout, crash, or missing manifest.
  success_criterion: >-
    All five manifests are valid. Degree mismatches are 0 and
    the nine bit lengths match. Split matches are 24 and
    mismatches are 0. Inert norm hits are 0 and each inert cell
    has one root. Both altered polynomials at p = 59 have 0
    roots while the exact polynomial has 3. The conductor root
    sets are {0} and {2} and both absolute traces are 4.
    Counter disagreements are 0.
  falsification_criterion: >-
    The polynomials agree, the degrees match, the second
    counter agrees, and a split cell has twist traces other
    than {t, -t}, or an inert root solves the norm equation.
    A truncation that reproduces the three exact roots does not
    by itself meet this criterion; it fails the truncation
    prediction only. A conductor mismatch does not meet this
    criterion either.
  required_artifacts:
    - experiments/EXP-PAIR-ef9af7/runs/<run-id>/command.txt
    - experiments/EXP-PAIR-ef9af7/runs/<run-id>/stdout.txt
    - experiments/EXP-PAIR-ef9af7/runs/<run-id>/stderr.txt
    - experiments/EXP-PAIR-ef9af7/runs/<run-id>/result.json
  assigned_to: executor
  out_of_scope:
    - The Spearman regression on fundamental discriminants with absolute value at most 2000.
    - Any prime outside the named list, including the 16-bit, 20-bit, 24-bit, and 28-bit bins.
    - A pairing value, an embedding degree, or an MOV cost.
    - A discrete logarithm.
    - Editing any other PAIR or ECTD contract.
