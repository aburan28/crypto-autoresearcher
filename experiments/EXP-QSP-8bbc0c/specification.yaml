# EXP-QSP-8bbc0c
# Twisted-coefficient arithmetic. No matrix.
# Approved by DEC-20261002-0c82e1.
experiment:
  id: EXP-QSP-8bbc0c
  hypothesis_id: H-QSP-ddc103
  source_idea: IDEA-20260926-bc1cab
  question_id: RQ-QSP-f9bbdb
  version: 1
  title: Twisted-coefficient arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-0c82e1
  objective: >-
    Check the seven gcds, the cube shortfall 1600256, and the tail
    ratio 16.
  inputs:
    degree_bits: 33
    field_bits: 131
    degrees: [1, 2, 3, 4, 5, 6, 7]
    gcd: 1
    modulus: 263
    remainder: 68
    cofactor: 10350794431055162386718619237468234569
    fourth_power: 2401
    bound_power: 256
    bound_log: 8
    vacuous_gap_exponent: 33
    cube_base: 264
    cube: 18399744
    written_cube: 20000000
    shortfall: 1600256
    histogram: [62, 118, 60, 4]
    histogram_sum: 244
    histogram_ratio_den: 61
    tail_written: 12
    tail_square: 16
    tail_ratio: 16
    ceiling_exponent: 524
    kernel_index: 22
    ceiling_gap: 40
  controls:
    - >-
      Each gcd for d from 1 to 7 is 1. Reporting a larger gcd
      invalidates the run.
    - >-
      2^33 leaves remainder 68 modulo 263. Reporting another remainder
      invalidates the run.
    - >-
      264 cubed is 18399744, which is 1600256 below 20000000.
      Reporting the cube as at least 20000000 invalidates the run.
    - >-
      The tail 2^{-12} exceeds 2^{-16} by the factor 16. Reporting the
      two tails as equal invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gcd, cube}
    - route in {euclidean, powers}
  metrics:
    primary:
      - gcd
      - shortfall
      - implementations_agree
    secondary:
      - remainder
      - tail_ratio
      - histogram_sum
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Each of the seven gcds is 1, and the cube shortfall is 1600256.
    formula: >-
      The gcd is the Euclidean algorithm on 2^33 minus d and 2^131
      minus 1. The cube is 264 times 264 times 264. The tail ratio is
      2 to the power 16 minus 12.
    source: >-
      IDEA-20260926-bc1cab states the gcd condition, the cube near
      2 times 10^7, and the two tail expressions, read 2026-10-02. The
      gcds were computed in this design session. That computation is
      not a run. No matrix was built.
  scale_relevance:
    tier: toy
    justification: Seven gcds and one cube. No transfer to a rank census.
    correspondence: null
  tail_checks:
    - The histogram ratio 1/61 is required. A check that stops at the seven gcds is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If a gcd disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - Any gcd for d from 1 to 7 is not 1.
    - The remainder modulo 263 is not 68.
    - 264 cubed is reported as at least 20000000.
    - The tails 2^{-12} and 2^{-16} are reported as equal.
    - The cofactor is reported as certified prime.
    - A matrix is built or a kernel dimension is stated.
  success_criterion: >-
    Both runs agree that each of the seven gcds is 1, that 264 cubed
    is 1600256 below 20000000, that the histogram counts sum to 244,
    and that the tail ratio is 16.
  falsification_criterion: >-
    The runs agree, 263 divides 2^131 minus 1, and some d from 1 to 7
    has gcd not equal to 1.
  required_artifacts:
    - experiments/EXP-QSP-8bbc0c/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-QSP-8bbc0c/runs/<RUN-ID>/command.txt
    - experiments/EXP-QSP-8bbc0c/runs/<RUN-ID>/stdout.log
    - experiments/EXP-QSP-8bbc0c/runs/<RUN-ID>/stderr.log
    - experiments/EXP-QSP-8bbc0c/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-QSP-8bbc0c/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any 131 by 131 matrix, kernel dimension, or census.
    - Any claim that the cofactor is prime.
    - Any measured root count on a curve.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
