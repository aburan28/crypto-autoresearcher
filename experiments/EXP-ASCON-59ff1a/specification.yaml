experiment:
  id: EXP-ASCON-59ff1a
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-76f564; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-76f564
  question_id: RQ-ASCON-2dfd8b
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Tabulate an internally derived exact inner-collision expression against its own birthday
    asymptotic across capacities and session lengths, and validate it by direct simulation at toy
    capacities against random-function and biased-generator arms
  objective: 'The one uncertainty a run reduces is whether the asymptotic form of a duplex inner-collision
    count is an adequate substitute for the exact count at the parameters and data volumes that matter,
    and whether the exact count is right at all. Concretely: (i) across a grid of capacities from
    12 to 256 and session lengths from 2^4 to 2^80, evaluated in exact or high-precision arithmetic,
    what is the ratio between the exact finite-product collision probability and the birthday asymptotic
    derived from it in one stated step, and at what session length does that ratio first leave a declared
    tolerance band; (ii) at toy capacities 12 to 20, does a direct simulation under a genuine random
    function reproduce the exact expression within sampling error while departing measurably from
    the asymptotic, which is the only evidence the derivation is right rather than merely written;
    (iii) does the simulator detect a deliberately biased generator at its injected magnitude, without
    which the fit in (ii) would prove nothing. No security bound is claimed, no published bound is
    cited, and no deployment statement follows.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: under numbered idealisation
      assumptions stated in the record, the exact inner-collision probability at capacity c and q
      calls is the tabulated value, its ratio to the birthday asymptotic leaves the tolerance band
      at session length L(c), and at toy capacities 12 to 20 a random-function simulation matched
      the exact expression within 2 standard errors while a biased generator was detected at its injected
      magnitude. WHAT DOES NOT FOLLOW: that this expression is any published security bound or comparable
      to one; that it applies to a real permutation beyond the simulated capacities; that any rekeying
      interval, deployment practice, or device lifetime is implicated; that Ascon has any property
      whatsoever.'
  inputs:
    procedure: 'STAGE 0 (an hour): state and freeze the numbered idealisation assumptions and the
      tolerance band, hashing the statement into the run manifest. STAGE 1 (an hour): implement the
      exact finite product and derive the asymptotic from it in one recorded step; implement both
      in exact rational and high-precision arithmetic. STAGE 2 (seconds of CPU): evaluate both over
      the capacity-by-session-length grid, tabulate the ratio and locate the crossover per capacity;
      separately evaluate in double precision to show where floating point erases the gap. STAGE 3
      (half a day): implement the session simulator with exact inner-state repetition detection and
      an asserted session length. STAGE 4 (minutes of CPU): simulate 100000 sessions per toy capacity
      12 to 20 under three generators -- truncated real permutation, genuine random function, biased
      generator -- in the same invocation. STAGE 5 (minutes): compute measured frequencies, standard
      errors and deviations from exact and asymptotic; run the forced session-length-1 and length-2
      checks. STAGE 6 (minutes): emit tables, curves, seeds and the power calculation into the run
      record.'
    instrument: Python 3.11 with the fractions and decimal modules for exact and high-precision evaluation,
      numpy for the simulation loop, a pinned pure-Python permutation truncated to toy inner widths
      for the permutation arm, secrets or a seeded PRNG for the random-function arm; pytest for the
      forced checks; harness/runner.py for the manifest, seeds and inference block. No Sage, no computer
      algebra system, no solver.
    parameters: 'Capacity grid: 12, 14, 16, 18, 20 for the simulated range, plus 32, 64, 128, 192,
      256 for the symbolic tabulation. Session lengths: 2^4 through 2^80 in half-power steps for the
      symbolic grid; up to the collision regime for each toy capacity in simulation. Sessions per
      toy capacity: 100000, with a pre-run power calculation confirming the standard error is below
      the exact-minus-asymptotic gap at each simulated capacity. Injected excess for the biased generator:
      three declared magnitudes spanning one order of magnitude around the expected standard error.
      Tolerance band for the ratio: declared and frozen before the run. Two rate values for the rate-independence
      control.'
  controls:
  - Genuine random-function generator arm at matched inner width, same invocation, seed recorded,
    where the exact expression should fit best.
  - Biased-generator arm with a known injected excess collision probability, which the simulator must
    detect at the injected magnitude.
  - Exact-arithmetic versus double-precision evaluation of the same expression, demonstrating where
    floating point erases the gap being measured.
  - Session length 1, where the collision probability must be exactly 0, and session length 2, where
    it must be exactly 2^-c under the idealisation.
  - Capacity sweep at two rate values, confirming the expression depends on capacity alone as derived
    and not on the rate through some implementation path.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): TWO nulls, both executable in the same invocation. First, a GENUINE
    RANDOM FUNCTION on the inner state of the same width, replacing the permutation in the simulation:
    under the stated idealisation the exact expression should fit this arm best, so a poor fit here
    indicts the derivation or the simulator rather than the permutation. Second, a DELIBERATELY BIASED
    inner-state generator -- one that repeats a state with a known injected excess probability --
    whose measured collision frequency must exceed the exact expression by the injected amount, confirming
    the simulator can detect a departure at all. For the signal arm to mean anything, the random-function
    null must fit and the biased null must be caught; if the simulator fits everything, it discriminates
    nothing.'
  independent_variables:
  - capacity c
  - session length q
  - generator arm (truncated permutation / genuine random function / biased generator)
  - arithmetic precision (exact rational / high precision / double)
  - injected excess magnitude for the biased arm
  metrics:
    primary:
    - exact collision probability per grid point
    - ratio of exact to birthday asymptotic, and the crossover session length per capacity
    - measured collision frequency per generator arm per toy capacity with standard error
    - deviation of measured frequency from the exact expression, in standard errors
    secondary:
    - deviation of measured frequency from the asymptotic, in standard errors
    - grid region where double precision and exact arithmetic disagree
    - detection margin for each injected excess magnitude
    - sessions simulated, memory used for repetition detection, wall-clock
  heuristic_under_test: null
  preregistered_prediction:
    quantity: R(c, q), the ratio of the exact inner-collision probability to its birthday asymptotic,
      and L(c), the smallest session length at which R leaves the declared tolerance band.
    formula: 'Under numbered assumption 1 (inner states are independent uniform draws from a space
      of size N = 2^c), the exact no-collision probability after q calls is P_nc(c, q) = product over
      k = 0 to q-1 of (1 - k/N), so the exact collision probability is P(c, q) = 1 - P_nc(c, q); the
      birthday asymptotic derived from it in one step by expanding the logarithm to first order is
      A(c, q) = 1 - exp(-q(q-1)/(2N)). Then R(c, q) = P(c, q)/A(c, q), and L(c) = min { q : |R(c,
      q) - 1| > tol } with tol declared and frozen. Forced values: P(c, 1) = 0 exactly and P(c, 2)
      = 1/N exactly.'
    source: Pre-registered in the parent proposal IDEA-20260816-76f564 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The symbolic tabulation covers capacities up to 256, which is the parameter range
      that would matter, but it is a derivation and not a measurement, and the record labels it as
      such. The MEASURED range is capacities 12 to 20, chosen as the largest at which direct simulation
      reaches the collision regime within budget. The transfer assumption is stated explicitly: agreement
      between simulation and the exact expression at capacities 12 to 20 under a random function supports
      the derivation''s arithmetic, and supports nothing about a real permutation at capacity 256
      -- that extrapolation is a derivation extended beyond its measured range, and every table cell
      above capacity 20 carries that label.'
    correspondence: null
  tail_checks:
  - Session length 1, where collision probability must be exactly 0.
  - Session length 2, where it must be exactly 2^-c.
  - Session length exceeding the state space, where the exact product must be exactly 0 no-collision
    probability and the asymptotic must not be, a regime where the two forms differ maximally.
  - Smallest tested capacity 12, where the gap is largest and simulation is cheapest, used as the
    primary discrimination anchor.
  - Largest tested capacity 20, checked against the power calculation to confirm the sampling budget
    can still resolve the gap there.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt before simulation if the pre-run power calculation shows the standard error at any tested
    capacity exceeds the exact-minus-asymptotic gap there; reduce the capacity range rather than proceeding
    and reporting an unresolvable comparison.
  - Halt and report an instrument defect if the forced session-length-1 or length-2 values are not
    reproduced exactly.
  - Stop at 100000 sessions per capacity; do not extend after seeing the deviation, since extending
    until a fit appears would make the validation vacuous.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The forced values hold exactly, the power calculation passes, the random-function
    arm matches the exact expression within 2 standard errors at every tested toy capacity while departing
    from the asymptotic by more than 2 standard errors at the smallest capacities, the biased-generator
    arm is detected at each injected magnitude, and R and L are tabulated across the full symbolic
    grid with the extrapolation label applied above capacity 20.
  falsification_criterion:
  - The random-function arm departs systematically from the exact expression.
  - Any injected excess magnitude goes undetected.
  - The forced session-length-1 or length-2 values are not reproduced.
  - R never leaves the tolerance band anywhere on the grid, which is a complete negative result and
    is reported as the asymptotic being adequate over the tabulated range.
  - The simulator's repetition detection is found to truncate sessions silently, invalidating measured
    frequencies.
  - The expression is found to depend on the rate, contradicting the derivation.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-76f564
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The rate and capacity are not pinned here; the derivation is parameterised by capacity so the
    mathematics is unaffected, but converting session length to bytes requires the rate, and a Coordinator
    must decide whether to publish the byte axis at all before the specification is filed.
  - The idealisation assumptions are stated but their distance from a real permutation is not measured;
    a Coordinator must decide whether that gap must be addressed before this record's table may be
    cited by any other record.
  - The tolerance band for R is a judgement call that must be frozen by the Coordinator before the
    run.
  - The record deliberately refuses to compare its expression to any published bound; a Coordinator
    must confirm that this refusal is preserved in any downstream summary, since the temptation to
    write it as the sponge bound is the single most likely way this record gets misreported.
