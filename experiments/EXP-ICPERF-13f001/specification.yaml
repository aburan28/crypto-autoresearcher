experiment:
  id: EXP-ICPERF-13f001
  hypothesis_id: H-ICPERF-2c57cc
  goal_id: GOAL-ICPERF-e6b6a4
  version: 1
  title: >-
    PDP boundary row 2: the EXP-ICPERF-66fd51 phase structure re-run on the
    repaired instrument, with a measurable Groebner column, side-classified
    (E / twist) answer verification, an honest resident-set memory limit, and
    per-clause evaluability reporting
  status: draft
  status_history:
    - status: draft
      at: '2026-09-15'
      by: coordinator
      note: >-
        DESIGNED, NOT APPROVED. Drafted in BATCH-a33cda so that
        H-ICPERF-2c57cc has a declared validation experiment and so that the
        instrument repair has a declared consumer. Designing is not approving
        (AGENTS.md, ECC instruction 3); this contract sits at approved_by null
        until its approval_preconditions are discharged.
  successor_of: EXP-ICPERF-66fd51
  successor_note: >-
    Inherits phases A-E, the plan sizes, the certificate and null-object
    controls, the metric definitions and the interpretation limits of
    EXP-ICPERF-66fd51 BY REFERENCE. That contract stays `analyzed` and frozen
    and its two run packages are untouched. What differs is enumerated in
    `changes_from_predecessor`; nothing else is intended to differ, and a
    difference not listed there is a defect in this contract.
  approved_by: null
  approval_preconditions:
    - id: AP-1
      condition: >-
        The instrument acceptance of EXP-ICPERF-e21835 has PASSED on the
        judgement of a committed Coordinator decision over two independent
        validator reports (expected: DEC-20260915-927eaa at the close of
        BATCH-a33cda). Not the executor's self-report.
      why: >-
        RUN-ICPERF-305ca3 spent an eight-hour executor budget and returned a
        zero Groebner column for two independent instrument reasons, one of
        which (the emitted-script parse error) no memory limit could have
        rescued. Running 60 instances again before the instrument is
        independently accepted risks exactly that outcome at exactly that cost.
    - id: AP-2
      condition: >-
        The `slimgb` Singular configuration exists in this contract's code tree,
        with its own timeout key, and is exercised at least once. It is NOT part
        of the EXP-ICPERF-e21835 repair (see that contract's
        `inputs.engines_not_added_here`): adding an engine configuration is a
        protocol change to this row, and it is owed here.
      why: >-
        EV-ICPERF-390707 joint V2 measured `slimgb` computing the n15l5-1-S
        basis in 167.4 s where the contracted `std` exceeds 900 s, agreeing
        with Macaulay2 F4 on gb_size = 43, maxdeg = 2, non-unit. Without it the
        Singular column is a column of timeouts, which is a real observation
        about `std` and a poor one about Singular.
    - id: AP-3
      condition: >-
        The side-classified verifier (E / twist / neither, per answer) is
        implemented and its classifier reproduces EV-ICPERF-390707 joint V1's
        classification of the five n19l6-19-U answers as twist decompositions
        and its 30/30 certificate result.
      why: >-
        Q1 is stated in terms of a recorded side. A verifier that cannot record
        the side cannot evaluate Q1, and the frozen binec.py cannot: it accepts
        or rejects.
    - id: AP-4
      condition: >-
        Per-engine plan sizes, timeout keys and the expected censoring pattern
        for l = 6 Groebner rows are filled in from the accepted instrument's
        measured behaviour, and the resulting executor wall-clock estimate is
        recorded.
      why: >-
        The Groebner budget of the predecessor was set against a 6 GB RLIMIT_AS
        that aborted every row in seconds. Real F4 rows cost ~50 s at l = 5 and
        are expected to be censored at l = 6; the plan must be sized against
        measured behaviour rather than against the predecessor's failure mode.
    - id: AP-5
      condition: >-
        This lane holds a claim on GOAL-ICPERF-e6b6a4 (tools/goal_lanes.py) and
        the machine is quiet, per campaign_budget.max_concurrent_basis. This row
        is a timing benchmark and a co-running producer contaminates every cell.
      why: >-
        EV-ICPERF-390707 joint V5 measured 125 of 504 rows launched at loadavg
        > 2 in the predecessor. It found no verdict flipped, and also found that
        one cell became UNEVALUABLE under the load-exclusion test because phase
        D had no low-load control at all. A contaminated cell cannot be repaired
        after the fact.
  objective: >-
    Produce the second, INSTRUMENT-COMPLETE point-decomposition column of the
    RQ-ICPERF-94c86e boundary table on the authors' own 60 instances, with every
    column of the predecessor plus the two the predecessor could not record --
    the Groebner column and the per-answer curve side -- and evaluate Q1-Q6 of
    H-ICPERF-2c57cc. Observations only; the executor forms no conclusion.
  changes_from_predecessor:
    - id: CH-1
      what: >-
        Code tree is experiments/EXP-ICPERF-13f001/code/, derived from the
        ACCEPTED experiments/EXP-ICPERF-e21835/code/ and referenced by the
        sha256 values that contract's CODE_SHA256.json records.
      why: The predecessor's tree carries the four repaired defects.
    - id: CH-2
      what: >-
        Memory enforcement is a RESIDENT-SET watchdog at 8 GiB per child, with
        RLIMIT_AS unset. Every row records peak RSS, the limit, whether it was
        breached, and the polling interval.
      why: >-
        EV-ICPERF-390707 joint V2: RLIMIT_AS 6 GB aborted Groebner rows at 2.575
        GiB resident, and unconstrained peak RSS is 6.71-6.82 GiB -- above the
        predecessor's own 6 GB child budget. The limit kind AND its value both
        had to change.
    - id: CH-3
      what: >-
        Singular is run in TWO configurations, `std` (the predecessor's) and
        `slimgb`, with separate timeout keys; both are reported per cell and a
        censored `std` is reported beside a finishing `slimgb` rather than
        replaced by it.
      why: AP-2.
    - id: CH-4
      what: >-
        Answer verification records a SIDE per answer: on E, on the quadratic
        twist, or neither, with the trace values it decided on. A twist answer
        is a measured column value, not an unexpected observation.
      why: >-
        The owed restatement of P1 (H-ICPERF-cc4847 superseding_restatement_owed
        item 1), now Q1. A system encoding S_4 = 0 cannot distinguish E from its
        twist; the predecessor's verifier could only accept or reject.
    - id: CH-5
      what: >-
        Every prediction clause reports `evaluated: true|false` with a reason,
        every cell-quantified prediction reports an explicit `unevaluable: [...]`
        list, and a prediction with a nonempty unevaluable list reports
        `holds: null`.
      why: >-
        The three D3 reporting defects. Inherited from the accepted instrument
        rather than re-specified here.
    - id: CH-6
      what: >-
        n15l5-8-S is FLAGGED in the per-cell report as degenerate (32 roots
        against a handful elsewhere; EV-ICPERF-390707 joint V1 beyond_the_plan),
        and every median it enters is reported with and without it.
      why: >-
        A single degenerate instance in a 10-instance median is a disclosed
        property of the cell, not something a reader should have to rediscover.
    - id: CH-7
      what: >-
        Q6's mechanism attribution is REMOVED from the reported prediction. The
        row reports the null-versus-structured conflict ratio and nothing about
        what the ratio is a property of.
      why: >-
        The owed restatement item 2. EV-ICPERF-390707 proves_too_much object 2
        FAILED: relabelling the variable indices of a structured instance
        reproduces the gap. The design that would separate the two is
        IDEA-20260915-7ef636's and is NOT part of this contract.
    - id: CH-8
      what: A second null-object family, constant-matched (control C-NULL2), beside the predecessor's fair-coin nulls.
      why: >-
        EV-ICPERF-390707 joint V4: 0 of 18 nulls matched their template's
        constant-term count, all 18 in the same direction (0.510 against 0.823).
        The predecessor's `shape_matches_template` was correct under its own
        sizing tuple, which excludes the constant. Running both families lets
        the constant be checked as a variable rather than assumed irrelevant.
    - id: CH-9
      what: Per-engine solver statistics for the pure-CNF engines, or a recorded reason none exist.
      why: >-
        EV-ICPERF-390707 joint V3: `stats` is empty or absent for three engines
        of six, so a prediction stated in conflicts is evaluable for two.
  inputs:
    frozen_instances: >-
      inputs/TRIMOSKA-ECICB-2024/upstream/benchmarks/
      (SRC-ICPERF-TRIMOSKA-ECICB-2024; 60 instances x {INFO, ANF, CNF-XOR,
      Magma}), unchanged and byte-identical to the predecessor's inputs
    pure_cnf_regeneration: >-
      inputs/TRIMOSKA-ECICB-2024/upstream/XORtoCNF.sh, output hash-checked
      against UPSTREAM_SHA256SUMS.txt per instance (predecessor control C-REGEN)
    solver_source: >-
      inputs/TRIMOSKA-WDSAT-2024/upstream/src/, rebuilt per exact static sizing
      derived from each ANF (predecessor invalidation rule on MAX_ID retained)
    accepted_instrument:
      contract: EXP-ICPERF-e21835
      code_reference: experiments/EXP-ICPERF-e21835/code/CODE_SHA256.json
      note: >-
        The accepted tree is COPIED into this contract's code/ and its source
        hashes recorded, so this row's manifest names exactly the bytes it ran.
    engines_installed_on_host:
      - WDSat @ 61c6ff3 (rebuilt; gcc version recorded in environment.json)
      - Macaulay2 1.22, groebnerBasis Strategy=>"F4" over ZZ/2 with field equations, GRevLex
      - Singular 4.3.2, `std` over GF(2) with field equations, dp
      - Singular 4.3.2, `slimgb` over the same ideal (CH-3)
      - CryptoMiniSat 5.11.15 (CNF-XOR native, and pure CNF)
      - CaDiCaL 1.7.4 (pure CNF)
      - MiniSat 2.2.1 (pure CNF)
    engines_absent_and_not_substituted:
      - Magma F4
      - PolyBoRi/BRiAl
      - msolve (characteristic 2 unsupported; not run)
    curves: the single fixed Koblitz curve of the generator; n in {15, 17, 19}; l in {5, 6}; m-1 = 3
    code: experiments/EXP-ICPERF-13f001/code/ (to be populated from the accepted instrument; empty while this contract is draft)
  controls:
    - id: C-CERT
      what: all 30 shipped S certificates verified with independent arithmetic before any solver runs
      pass: 30/30; any failure stops the run before any solver
      inherited_from: EXP-ICPERF-66fd51
    - id: C-ANSWER-SIDE
      what: >-
        every SAT assignment returned by any engine is re-verified from its
        first m*l bits AND classified as a decomposition on E, on the quadratic
        twist, or neither, with the four trace values recorded
      pass: >-
        every recorded SAT answer carries a side in {E, twist} and its traces; a
        `neither` classification is an unexpected observation that stops nothing
        and is reported (it would falsify Q1, which is the Coordinator's call
        and not the executor's)
      replaces: EXP-ICPERF-66fd51 C-ANSWER
    - id: C-NULL
      what: matched random ANF of identical shape per template, fair-coin constant (the predecessor's family), WDSat default
      pass: shape_matches_template true on every null row, with the sizing tuple recorded
      inherited_from: EXP-ICPERF-66fd51
    - id: C-NULL2
      what: >-
        a second null family matching the template's CONSTANT-TERM COUNT as well
        as its degree profile, same seeds and same count as C-NULL
      pass: >-
        constant-term count equal to the template's on every row; both families
        reported per cell so the constant's effect is measured rather than
        assumed
      new_in: this contract (CH-8)
    - id: C-REGEN
      what: pure-CNF files regenerated with the vendored XORtoCNF.sh must hash-match the upstream manifest
      pass: hashcheck.match true on every phase-D row; a mismatch is recorded and the row still runs, flagged
      inherited_from: EXP-ICPERF-66fd51
    - id: C-UNSAT-CERT
      what: >-
        U-labelled instances are certified unsatisfiable only where a Groebner
        engine returns the unit ideal; otherwise UNSAT remains a solver report.
        The shipped U label is a RANDOM TARGET and is never a certificate.
      pass: reported per instance; no pass/fail
      inherited_from: EXP-ICPERF-66fd51
    - id: C-RSS
      what: >-
        every child's peak RSS, the watchdog limit, whether it was breached and
        the polling interval are recorded; a breach is a budget stop with its
        limit
      pass: reported on every row; a breach is never presented as a solver result
      new_in: this contract (CH-2)
    - id: C-LOAD
      what: 1-minute load average recorded at every launch; rows launched at loadavg > 2 flagged
      pass: reported, and the Groebner phase additionally reports its own CPU-per-wall ratio so a multi-threaded phase's self-inflicted load is distinguishable from contention
      inherited_from: EXP-ICPERF-66fd51, extended per EV-ICPERF-390707 joint V5
  independent_variables:
    - cell (n, l)
    - label (S / U)
    - engine and configuration (WDSat default / core_order / noncore_first / symmetry / gauss_elim; CMS cnf_xor; CMS/CaDiCaL/MiniSat pure_cnf; M2 F4; Singular std; Singular slimgb)
    - structured instance vs null object, and null family (C-NULL vs C-NULL2)
  metrics:
    primary:
      - SAT engines: conflicts (WDSat conf[0]; each engine's own counter where it prints one)
      - Groebner engines: engine-reported CPU seconds; basis size; maximal basis degree; unit-ideal flag; vdim where the engine reports it
      - per SAT answer: side in {E, twist, neither} with the deciding traces
    secondary:
      - wall seconds; child CPU seconds (user+sys); CPU-per-wall ratio; peak RSS (KB); rss_limit_breached; exit status; timeout flag; loadavg at launch
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Q1-Q6 of H-ICPERF-2c57cc, evaluated on per-cell medians over finished rows, S and U separately
    formula: >-
      Per H-ICPERF-2c57cc `predictions`. Medians exclude budget stops (timeouts
      and RSS-watchdog kills) and infrastructure exits, which are counted per
      (cell, label, engine, config). Thresholds: 1.0 exact (Q1), 0.1 (Q2),
      exact equality (Q3a), >= 2x (Q3b), >= 10x per (cell,label) independently
      (Q3c), >= 0.9x above a 0.05 s floor (Q4), >= 2x and [0.5, 2] (Q5), >= 10x
      where both finish (Q6). Every clause reports its own `evaluated` flag.
    source: >-
      H-ICPERF-2c57cc statement, with the Q3c reference ratios and the Q2
      Groebner reference timings taken from EV-ICPERF-390707 joints V2 and V3
      and fixed before this row runs.
  scale_relevance:
    tier: toy
    justification: >-
      n <= 19, l <= 6, one fixed Koblitz curve, one host. Exact for these cells
      and transfers to nothing without the later phases of GOAL-ICPERF-e6b6a4
      (relation search, linear algebra, descent, and a MEASURED rho column).
    correspondence: null
  tail_checks:
    - >-
      The Q3c cell nearest its threshold (n17l6/S, corrected all-10 ratio 10.396,
      i.e. 4% clearance) is reported with its per-instance spread, not only its
      median, so a threshold decided by one instance is visible as such.
    - >-
      Where a Groebner engine finishes on some but not all instances of a cell,
      the cell reports the finishing count beside the median, and the censored
      rows' limits, so a median over 2 of 10 rows cannot be read as a cell value.
  replication:
    seeds:
      - null-object seeds: 20260913*1000 + 100*n + id (predecessor's rule, retained so the two rows' nulls are comparable)
      - C-NULL2 seeds: the same, offset by a recorded constant, so each constant-matched null pairs with exactly one fair-coin null
    independent_instances: 60
  budget:
    enforcement: >-
      Per-invocation subprocess wall-clock timeout plus a RESIDENT-SET watchdog
      at 8 GiB per child; RLIMIT_AS unset. Phases ordered A,B,C,D,E so a stop
      leaves the most valuable data.
    wall_clock_seconds_per_run: 1800
    wall_clock_seconds_per_run_note: >-
      1800 is the largest single invocation (Macaulay2 F4 at l = 6, expected
      censored). Per-engine keys are AP-4 work and are not yet filled in.
    total_cpu_hours: null
    maximum_memory_gb: 10
    maximum_runs: 1
    maximum_workers: 1
    maximum_workers_note: >-
      Engines run sequentially. Macaulay2's F4 spawns its own threads inside
      one child (measured 3.4 CPU-seconds per wall second); the watchdog sums
      RSS over the child's process group and C-LOAD records the ratio so that
      self-inflicted load is not read as contention.
    executor_wall_clock_seconds: null
    executor_wall_clock_seconds_note: >-
      AP-4: sized from the accepted instrument's measured Groebner behaviour.
      The predecessor's 28800 is not carried over, because its Groebner phase
      aborted in seconds per row and therefore measured nothing about what the
      phase costs.
  stopping_rules:
    - C-CERT fails: stop before any solver, record which certificate failed and why.
    - A shipped instance file's hash differs from the frozen manifest: stop and report.
    - >-
      Executor wall clock reached: stop, keep results.jsonl as the partial
      artifact, run the reduction, and record which phases finished.
    - >-
      A phase's every row is a budget stop: continue to the next phase. The
      stops are data, and with an RSS watchdog they are now HONEST data about
      what the row needs.
  invalidation_rules:
    - results.jsonl absent or unparsable.
    - Any WDSat row whose reported MAX_ID differs from the ANF-derived value (mis-sized build).
    - A null-object row with shape_matches_template false, or a C-NULL2 row whose constant-term count differs from its template's.
    - A SAT answer with no recorded side.
    - manifest.yaml missing code.commit, the inference block, or the recorded rss_limit_gb and rss_poll_interval_s.
    - >-
      The code tree's sha256 values do not match the accepted instrument's
      recorded hashes for every file this contract did not deliberately extend.
  success_criterion: >-
    Every planned row is either finished or recorded as a budget stop with its
    limit; at least one Groebner engine finishes on the (15,5) cell and its row
    carries a parsed basis size, maximal degree and unit flag; every SAT answer
    carries a side; the reduction evaluates Q1-Q6 with an explicit `evaluated`
    flag per clause and `holds: null` where a prediction is unevaluable; and the
    task report lists every unexpected observation.
  falsification_criterion: >-
    Per H-ICPERF-2c57cc `falsification_conditions`. The executor reports the
    values; the Coordinator decides. A censored or watchdog-killed row is an
    infrastructure outcome and falsifies nothing.
  required_artifacts:
    - experiments/EXP-ICPERF-13f001/code/ with a recorded sha256 per file and its provenance from EXP-ICPERF-e21835
    - manifest.yaml, results.jsonl, summary.json, environment.json, task-report.md, plan.json, phase_log.txt
    - logs/ (stdout and stderr per invocation)
    - builds/*/config_used.json and make.log
    - null_objects/ for both families, and pure_cnf/*.hashcheck.json
    - answer_sides.json (per SAT answer: side, traces, deciding arithmetic)
  assigned_to: executor
  dependencies:
    - EXP-ICPERF-e21835 accepted by a committed Coordinator decision (AP-1)
    - H-ICPERF-2c57cc committed at `specified` or later
    - SRC-ICPERF-TRIMOSKA-ECICB-2024 and SRC-ICPERF-TRIMOSKA-WDSAT-2024 committed
    - A snapshot of this contract at its approved version before execution
  independence_note: >-
    The certificate arithmetic is inherited from binec.py, which the Coordinator
    wrote; EV-ICPERF-390707 joint V1 re-derived the 30 certificates
    independently at 30/30 under an LSB-first convention settled by the data, so
    that arithmetic now has one independent confirmation. The side classifier
    (CH-4) is NEW code and its acceptance (AP-3) is checked against that same
    independent result rather than against binec.py.
  interpretation_limits:
    - >-
      Seven engine configurations on one host; not Magma F4, not PolyBoRi, not
      l > 6. Reported literature timings are not reproduced and appear in no
      ratio.
    - >-
      WDSat is rebuilt with exact static constants per ANF; the authors' binary
      and constants are not reproduced.
    - >-
      The pure-CNF encoding is the authors' XORtoCNF.sh; a different XOR-to-CNF
      encoding could change every phase-D number.
    - >-
      No relation-yield, linear-algebra, descent or rho column exists in this
      row. The boundary at a cell exists only when every column is measured.
    - >-
      Q6 carries no mechanism reading and this row cannot supply one. The
      structure-versus-variable-order separation is IDEA-20260915-7ef636's
      design and is deliberately absent here.
    - >-
      A twist decomposition is a genuine relation for the TWIST. In any later
      relation-search column it must be counted on the correct curve or not at
      all; counting it for E would overstate the yield.
