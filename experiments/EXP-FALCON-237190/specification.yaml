experiment:
  id: EXP-FALCON-237190
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-0e6599; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-0e6599
  question_id: RQ-FNDSA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exact enumeration of a toy Klein sampler's output distribution under emulated p-bit arithmetic,
    sweeping mantissa width at dimensions 2, 4 and 8, with an exact-arithmetic null and an injected-bias
    positive control.
  objective: 'The single uncertainty a run reduces is whether an exact-ground-truth instrument for
    multi-dimensional sampler divergence exists at all within this program''s reach, and what it reads.
    In parts: (i) whether the output pmf of a Klein sampler over a toy lattice can be enumerated exactly
    in rational arithmetic with a tail bound small enough that the reported total variation is conclusive
    rather than swamped by truncation; (ii) whether an emulated p-bit implementation, compared against
    that exact pmf, produces a total variation varying systematically with p, and with what fitted
    slope of log2 TV against p at each dimension; (iii) whether the null arm, exact against exact
    under reordered summation, returns identically zero, which is the precondition for any signal
    reading to be interpretable. A run does not reduce uncertainty about deployed FN-DSA parameters,
    about the specification''s precision requirement, or about key recovery, and the contract is written
    so a run cannot be read that way: tested dimensions are three orders of magnitude below deployed
    and no extrapolation step exists anywhere in the procedure. The most valuable outcome for the
    program is arguably the negative one, a flat TV curve or a nonzero null, because either is a measured
    obstruction that redirects the other precision-oriented entries in this batch before any of them
    spends compute.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: for Klein/GPV nearest-plane sampling
      over the specific toy bases constructed in this run, at d in {2, 4, 8} and sigma in {1.5, 2,
      3}, the total variation between an emulated p-bit implementation and exact rational arithmetic
      takes the reported values, with the reported truncation tail bound, and its dependence on p
      has the reported fitted slope. WHAT DOES NOT FOLLOW: nothing about FN-DSA-512 or FN-DSA-1024,
      nothing about any FIPS document, nothing about any released implementation, nothing about the
      number of signatures needed to distinguish or recover anything, nothing about whether the observed
      slope persists at any untested dimension, and nothing about security. A total variation is a
      distance between two distributions; it is not an attack cost, and this run supplies no distinguisher
      computable from public data.'
  inputs:
    procedure: 'STAGE 0, cost under one hour: freeze every constant, the toy bases, widths, truncation
      radius, mantissa widths, rounding rule and tail-bound formula, before any code runs. STAGE 1,
      cost about one day of implementation and seconds of compute: implement the exact rational Klein
      pmf enumerator at d = 2 and validate that enumerated masses plus tail bound sum to one. STAGE
      2, cost about one day: implement the p-bit mantissa emulator over Python integers and validate
      it against native doubles at p = 53 on a frozen operation list. STAGE 3, cost minutes: run both
      null arms, exact versus reordered exact and p = 200 versus exact. STOP HERE IF EITHER NULL FAILS.
      STAGE 4, cost minutes: run the injected-bias positive control at delta in 1e-2, 1e-3 and 1e-4
      and check linearity. STAGE 5, cost minutes at d = 2, about an hour at d = 4, up to several hours
      at d = 8: sweep p over 8, 12, 16, 20, 24, 32, 40 and 53 at each dimension and width, five toy
      bases each. STAGE 6, cost under an hour: fit log2 TV against p, report slopes with residuals
      and every truncation bound alongside.'
    instrument: Pure Python 3 with fractions.Fraction for exact arithmetic and the standard library
      only for the emulator, implemented over Python integers with an explicit round-to-nearest-even
      rule at width p. numpy is used only for the final least-squares fit of log2 TV against p and
      never inside the exact path. Run records and manifests are produced through harness/runner.py
      so the inference block and seeds are recorded in the standard form. No Sage, no external computer
      algebra, no floating-point library outside the emulator, and no network access.
    parameters: Dimensions d in {2, 4, 8}. Widths sigma in {1.5, 2.0, 3.0}. Truncation radius 8 sigma,
      with control runs at 6 sigma and 10 sigma. Mantissa widths p in {8, 12, 16, 20, 24, 32, 40,
      53}, plus 200 for the convergence null. Five independently generated toy bases per (d, sigma)
      cell, giving 3 x 3 x 8 x 5 = 360 signal cells plus 90 null cells and 45 positive-control cells.
      Injected bias delta in {1e-2, 1e-3, 1e-4}. Sample size is not applicable in the signal arm because
      it enumerates rather than samples; enumerated support sizes are the analogous quantity and are
      expected to be order 10^2, 10^4 and 10^7 at d = 2, 4 and 8 at sigma = 2.
  controls:
  - 'Null arm one: exact versus exact under reordered exact summation, must read TV identically zero.'
  - 'Null arm two: p = 200 versus exact, must read TV below 2 to the power minus 150, demonstrating
    emulator convergence.'
  - 'Positive control: a deliberately biased sampler with one leaf normalizer perturbed by a known
    relative amount delta, whose TV against exact must track delta linearly for small delta.'
  - 'Truncation control: recompute every TV at 6 sigma and 10 sigma truncation and confirm stability
    within the reported tail bound.'
  - 'Basis control: repeat at a second toy basis with a different Gram-Schmidt norm profile to confirm
    the reading is not an artifact of one conditioning number.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null arm runs the IDENTICAL enumeration comparing the exact-arithmetic
    sampler against ITSELF under a different but mathematically equivalent evaluation order, for instance
    theta sums accumulated in ascending versus descending index order, both in exact rational arithmetic.
    The null must return TV exactly zero, bit for bit, for the signal arm to mean anything: any nonzero
    reading proves the enumeration pipeline, not the mantissa width, generates the difference. A second
    null runs the p-bit arm at p = 200 against the exact arm and must return TV below 2 to the power
    minus 150, establishing that the emulator converges to the exact reference as precision grows.'
  independent_variables:
  - mantissa width p
  - lattice dimension d
  - Gaussian width sigma
  - truncation radius in units of sigma
  - toy basis index
  metrics:
    primary:
    - exact total variation as a rational, to 20 significant digits
    - exact Kullback-Leibler divergence in bits
    - fitted slope of log2 TV against p with residual standard error
    - maximum pointwise log-density ratio over the enumerated support
    secondary:
    - enumerated support size
    - exact truncated tail mass bound
    - wall-clock per enumeration
    - peak memory per enumeration
    - maximum rational denominator bit-length encountered
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The slope of log2 of the total variation with respect to mantissa width p, at fixed
      dimension and width, over p = 8 to 24.
    formula: TV(p) = C(d, sigma) * 2^(-alpha * p), predicted alpha at least 1.0, so the fitted slope
      of log2 TV against p is at or below -1.0. C(d, sigma) is the precision-independent prefactor
      and is left free in the fit. The prediction is registered before any signal cell runs; the null
      and positive-control cells run first and cannot change it.
    source: Pre-registered in the parent proposal IDEA-20260816-0e6599 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested parameters are d in {2, 4, 8} and sigma in {1.5, 2.0, 3.0} on toy circulant
      bases constructed in-run. Deployed FN-DSA dimension is 1024 or 2048 and deployed sigma is of
      order 165, so the tested scale is three orders of magnitude below deployed in dimension and
      two in width. NO TRANSFER OR EXTRAPOLATION ASSUMPTION IS MADE. This contract deliberately contains
      no step mapping a toy reading to a deployed parameter; the dimension-scaling law such a transfer
      would require is the subject of a separate entry in this batch and is explicitly not measured
      here.
    correspondence: null
  tail_checks:
  - Recompute every reported TV at truncation radii 6 sigma and 10 sigma and require agreement within
    the stated tail bound.
  - Report the exact tail mass bound next to every TV value and flag any cell where the bound exceeds
    one tenth of the measured TV.
  - Check the maximum pointwise log-density ratio, dominated by the smallest-probability support points,
    separately from the aggregate TV.
  - Verify the enumerated masses plus tail bound sum to one in exact arithmetic in every cell.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt the entire run and report an instrument failure if either null arm fails at STAGE 3; no signal
    cell is executed or reported.
  - Halt the d = 8 ladder if a single cell exceeds four hours of wall clock, and report the achieved
    dimension ceiling as a measured fact rather than extrapolating past it.
  - Halt if the maximum rational denominator bit-length exceeds 10^6, and report the width at which
    that occurred.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both null arms pass, the positive control tracks the injected bias linearly,
    and the fitted slope of log2 TV against p is estimated at every cell with a residual standard
    error below 0.2 bits, whatever the value of that slope turns out to be.
  falsification_criterion:
  - Either null arm returns a nonzero or non-converging value, voiding the instrument.
  - The positive control fails to track the injected delta within a factor of two over the tested
    range.
  - The fitted slope of log2 TV against p is shallower than -0.5 across all cells, falsifying the
    registered geometric-decay law.
  - Truncation controls at 6 and 10 sigma disagree by more than the stated tail bound.
  - TV is identically zero in every signal cell, meaning the configuration cannot expose rounding
    and the contract's premise fails.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-0e6599
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The tail-bound formula for the truncated theta sum must be written out and checked by the Coordinator
    before freezing; the record asserts it exists but does not state it.
  - The construction rule for the toy circulant bases, in particular how their Gram-Schmidt norm profile
    is controlled, is unspecified and must be fixed before any cell runs.
  - The exact rounding rule the emulator applies to comparisons, as opposed to arithmetic, is not
    pinned down and changes what the implemented pmf even means.
  - The support-size estimate of 10^7 at d = 8 is an order-of-magnitude guess and needs a written
    derivation or a pilot count before the d = 8 ladder is authorized.
