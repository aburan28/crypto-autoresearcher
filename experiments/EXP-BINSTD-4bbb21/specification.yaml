# EXP-BINSTD-4bbb21
# Exact arithmetic certificate. Verdict on the five rows is OPEN.
# Approved by DEC-20261001-490023.
experiment:
  id: EXP-BINSTD-4bbb21
  hypothesis_id: H-BINSTD-b5d435
  source_idea: IDEA-20260922-8278db
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Regime certificate for the naive trace-zero cost at five composite ANSI rows
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-490023
  objective: >-
    Recompute (k-1)! and the regime class g/16 for k in {11, 13, 17, 19, 23},
    evaluate the naive bit expression as a logged formula, and emit verdict
    OPEN on every deployed row. A g = 2 control must be classified below.
  inputs:
    q_log2: 16
    rows:
      - {k: 11, g: 10, predicted_factorial: 3628800, predicted_regime: below}
      - {k: 13, g: 12, predicted_factorial: 479001600, predicted_regime: below}
      - {k: 17, g: 16, predicted_factorial: 20922789888000, predicted_regime: equal}
      - {k: 19, g: 18, predicted_factorial: 6402373705728000, predicted_regime: above}
      - {k: 23, g: 22, predicted_factorial: 1124000727777607680000, predicted_regime: above}
    control: {g: 2, log2_q: 16, predicted_regime: below}
  controls:
    - >-
      g = 2 nearby object. Regime class must be below. Classifying it as
      equal or above invalidates the run.
    - >-
      Two factorial implementations. One multiplies 1..n. The other multiplies
      n..1. They must not import each other.
    - >-
      The certificate verdict on the five deployed rows is the string OPEN.
      The strings BROKEN, cost_below_rho, and defined_cost invalidate the run.
  independent_variables:
    - k in {11, 13, 17, 19, 23}
    - control g = 2
  metrics:
    primary:
      - factorial_by_k
      - regime_class_by_k
      - implementations_agree
      - control_regime_class
      - verdict
    secondary:
      - naive_bit_expression
      - floor_log2_factorial
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Factorials and regime classes. Not a runtime.
    formula: >-
      regime class is below if g < 16, equal if g = 16, above if g > 16.
      naive_bit_expression = 16*(2 - 2/g) + log2(g!). Logged, not compared
      to rho.
    predicted_naive_bits_design_time_only:
      - {k: 11, value: 50.5911}
      - {k: 13, value: 58.1688}
      - {k: 17, value: 74.2501}
      - {k: 19, value: 82.7298}
      - {k: 23, value: 100.4746}
    source: >-
      IDEA-20260922-8278db claims (B) and (C). Design-time math.factorial
      matched the five integers and math.log2 matched the printed bits within
      0.1. The experiment recomputes both.
  scale_relevance:
    tier: crypto
    justification: >-
      The five k are the deployed composite-degree rows. The work is integer
      arithmetic on those parameters. No curve point is computed.
    correspondence: null
  tail_checks:
    - k = 23 uses 22!, the largest integer. Both implementations must match all digits.
  replication:
    seeds: []
    independent_instances: 5
    replication_note: Deterministic. The second run is the reverse-multiplication implementation.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - Disagreement or a bad control class stops the attempt as invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either implementation imports the other.
    - control_regime_class is not below.
    - verdict is anything other than OPEN on a deployed row.
    - The output claims a discrete logarithm or a break of a named curve.
  success_criterion: >-
    Both runs agree, every factorial matches predicted_factorial, every regime
    class matches predicted_regime, the control class is below, and verdict
    is OPEN on all five deployed rows.
  falsification_criterion: >-
    The implementations agree, the control class is below, verdict is OPEN,
    and at least one factorial or regime class differs from the preregistered
    table. That row's hand arithmetic is a negative result. It is still not
    a break of the curve.
  required_artifacts:
    - experiments/EXP-BINSTD-4bbb21/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-4bbb21/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-4bbb21/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-4bbb21/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-4bbb21/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-4bbb21/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Comparison with Pollard rho.
    - Literature retrieval of measured Gaudry costs.
    - Groebner or SAT solves at any arity.
