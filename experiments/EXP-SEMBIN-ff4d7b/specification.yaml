# EXP-SEMBIN-ff4d7b
# Binomial shapes of three published Macaulay cells. No matrix is built.
# Approved by DEC-20261001-30dd0f.
experiment:
  id: EXP-SEMBIN-ff4d7b
  hypothesis_id: H-SEMBIN-608181
  source_idea: IDEA-20260913-9ba7fc
  question_id: RQ-SEMBIN-fa2e3f
  version: 1
  title: Binomial shapes of three published cells
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-30dd0f
  objective: >-
    For the cells (40, 2, 2), (45, 2, 2) and (25, 3, 3), compute k, N,
    the degree-4 column counts, the two m = 2 degree-4 row counts, the
    n = 45 degree-5 shape, the equation excesses, and the bit-dense
    roundings. Reject 1640 rows at n = 40.
  inputs:
    cells:
      - {n: 40, m: 2, t: 2, k: 20, N: 40, columns_degree_4: 102091, rows_degree_4: 32840, excess: 0}
      - {n: 45, m: 2, t: 2, k: 23, N: 46, columns_degree_4: 179447, rows_degree_4: 48690, excess: -1}
      - {n: 25, m: 3, t: 3, k: 9, N: 52, columns_degree_4: 294204, written_rows_degree_4: 35800, excess: -27}
    degree_5_n45: {rows: 731790, columns: 1550201, nearest_gib: 132}
    hundredths_of_gib: [39, 102, 123]
    rejected_rows_n40: 1640
    row_formula_m2: n * sum of binom(N, i) for i from 0 through 2
    column_formula: sum of binom(N, i) for i from 0 through 4
  controls:
    - >-
      1640 rows at n = 40 is the degree-at-most-1 multiple count and is
      false for the degree-4 shape. Reporting it invalidates the run.
    - >-
      The n = 25 row count is an input copied from the proposal. Deriving
      it from the m = 2 row formula and still calling the result 35800
      invalidates the run.
    - Two binomial routes. They must not import each other.
  independent_variables:
    - cell
    - route in {recursive_binomial, multiplicative_formula}
  metrics:
    primary:
      - k_by_cell
      - N_by_cell
      - columns_degree_4
      - rows_degree_4_m2
      - degree_5_shape
      - hundredths_of_gib
      - nearest_gib_degree_5
      - rows_1640_rejected
      - implementations_agree
    secondary:
      - excess_by_cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Three column counts, two derived row counts, one degree-5 shape, and four rounded sizes.
    formula: >-
      k = ceil(n/m). N = n*(t-2) + k*t. Columns are binom(N, <=4).
      The m = 2 degree-4 rows are n * binom(N, <=2). The n = 45
      degree-5 rows are 45 * binom(46, <=3). A hundredth of a GiB is
      one bit-entry matrix size rounded by (rows*cols*100 + 2^32) // 2^33.
    source: >-
      IDEA-20260913-9ba7fc claim paragraphs C2 and C3, read 2026-10-01.
      The binomial sums were recomputed in this design session. That
      computation is not a run. No matrix was allocated. The n = 25 row
      count 35800 is copied from that paragraph and is not re-derived.
  scale_relevance:
    tier: toy
    justification: Binomial coefficients of arguments at most 52. No transfer to a rank or a solving degree.
    correspondence: null
  tail_checks:
    - The n = 25 column count is required. Stopping after the two m = 2 cells and still reporting 294204 is invalid.
  replication:
    seeds: []
    independent_instances: 3
    replication_note: Deterministic. The second run is the other binomial route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If 1640 is accepted as the n = 40 row count, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The n = 40 degree-4 row count is reported as 1640.
    - The n = 25 row count is reported as derived from the m = 2 formula.
    - A matrix allocation, a rank, or a Groebner basis is reported.
  success_criterion: >-
    Both runs agree on k, N, the three column counts, the two m = 2 row
    counts, the degree-5 shape 731790 by 1550201, the excesses 0, -1 and
    -27, the hundredths 39, 102 and 123, and the nearest GiB 132. The
    row count 1640 is rejected.
  falsification_criterion: >-
    The runs agree, 1640 is rejected, the n = 25 rows stay labeled as
    written, and any k, N, row, column, excess, or rounded size differs
    from the preregistered table.
  required_artifacts:
    - experiments/EXP-SEMBIN-ff4d7b/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-SEMBIN-ff4d7b/runs/<RUN-ID>/command.txt
    - experiments/EXP-SEMBIN-ff4d7b/runs/<RUN-ID>/stdout.log
    - experiments/EXP-SEMBIN-ff4d7b/runs/<RUN-ID>/stderr.log
    - experiments/EXP-SEMBIN-ff4d7b/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-SEMBIN-ff4d7b/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Building a Macaulay matrix or computing a rank.
    - Any solving-degree claim, including Assumption 1.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
