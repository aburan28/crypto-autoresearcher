experiment:
  id: EXP-CANL-108f26
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-ee6ef7
  question_id: RQ-CANL-63098f
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE REACHABILITY GATE OF THE CANONICAL LIFT, COSTED: h(D) = |D|^{1/2+o(1)} and |D| = 4p
    - t^2, so writing the canonical lift down through the Hilbert class polynomial costs |D|^{1+o(1)}
    = p^{1+o(1)} time and p^{1/2+o(1)} space -- the setup alone is p^{1/2} times the WHOLE rho attack
    -- and the only evasion is h(disc End) = O(1), a class that is cryptographically real (it contains
    j = 0 and j = 1728) but that the isogeny class cannot be walked into'
  status: draft
  objective: "(A) THE GATE. DECOMPOSITION.md T5 makes reachability a mandatory second gate for every\
    \ lane that moves between curves. L9 moves from E/F_p to its canonical lift, so it must pay for\
    \ that move before any height or rank argument is allowed to count. This record pays the bill.\n\
    (B) THE COST, WITH EXPONENTS. Let O = End_{F_p}(E), D_E = disc O, and h = h(D_E). Three facts\
    \ compose:\n  (i) SIEGEL: h(D) = |D|^{1/2 + o(1)}. So deg H_{D_E} = h = |D_E|^{1/2+o(1)}.\n  (ii)\
    \ The coefficients of H_D have logarithmic height Theta(sqrt(|D|) log|D|),\n       so the TOTAL\
    \ BIT SIZE of H_D is Theta(|D| log^{2+eps}|D|) =\n       |D|^{1+o(1)}. The output alone is that\
    \ large; no algorithm can beat\n       it while writing it down.\n  (iii) SUTHERLAND'S CRT METHOD\
    \ attains that bound: expected running time\n       O(|D|^{1+eps}) with O(|D|^{1/2+eps} log P)\
    \ space under GRH\n       (A. V. Sutherland, \"Computing Hilbert class polynomials with the\n\
    \       Chinese Remainder Theorem\", arXiv:0903.2785 / Math. Comp.;\n       VERIFIED VIA WEB SEARCH\
    \ 2026-08-07, ABSTRACT ONLY, FULL PAPER NOT\n       READ).\nFor a curve at the bottom of its volcano,\
    \ |D_E| = |D| = 4p - t^2, which is Theta(p) for the ~61% of curves with |t| <= sqrt(p). Therefore:\n\
    \    canonical-lift construction: p^{1 + o(1)} time, p^{1/2 + o(1)} space.\nAgainst parallel rho\
    \ at 0.886 sqrt(N) time and O(1) memory (KN-TECH-001, KN-TECH-006): THE SETUP COST FOR ONE CURVE\
    \ EXCEEDS THE ENTIRE ATTACK BY A FACTOR p^{1/2}, AND ITS SPACE ALONE MATCHES BSGS. The gate fails\
    \ at exponent 1 versus 1/2, which is worse than the failure mode RQ-CANL-63098f was set up to\
    \ examine -- the height argument never gets to run.\n(C) WHY THE p-ADIC ROUTE DOES NOT RESCUE\
    \ IT FOR PRIME FIELDS. The canonical lift over Z_p = W(F_p) is characterised by lifting Frobenius,\
    \ i.e. by Phi_p(J, J^sigma) = 0 with sigma = identity on Z_p, so J is a Z_p-root of the one-variable\
    \ polynomial Phi_p(X, X). Phi_p has degree p+1 in each variable and Theta(p^2) coefficients of\
    \ height Theta(p log p), so merely writing Phi_p down is p^{2+o(1)} -- WORSE than the class-polynomial\
    \ route. Satoh-style canonical lifting is efficient for F_{p^n} with p SMALL and n large, where\
    \ the modular polynomial in play is Phi_p for a small p; over a prime field with p large there\
    \ is no small prime to lift along. [open] THIS RECORD DOES NOT CLAIM THAT NO CHEAPER ROUTE EXISTS.\
    \ It claims that the two standard routes cost p^{1+o(1)} and p^{2+o(1)} respectively, and it makes\
    \ \"is there an algorithm computing j(canonical lift) to precision p^n for E/F_p in time p^{o(1)}\"\
    \ an explicit open question and a Stage-0 literature target. A positive answer would be a significant\
    \ result in its own right and would REOPEN this lane; that is why the question is written down\
    \ rather than assumed shut.\n(D) THE EVASION, NAMED EXACTLY. The bound in (B) is driven by |D_E|,\
    \ not by p. If |D_E| = O(1) then H_{D_E} is a FIXED polynomial of O(1) degree with O(1) coefficients\
    \ and the canonical lift is written down in polylog(p) time. Concretely h(D_E) = 1 for D_E in\
    \ {-3,-4,-7,-8,-11,-12,-16,-19,-27,-28,-43,-67,-163} and h <= 2 for a further known finite list.\
    \ This happens exactly when End_{F_p}(E) is the maximal order of a small-discriminant imaginary\
    \ quadratic field, i.e. when E sits at the CRATER of a volcano whose fundamental discriminant\
    \ is small: j = 0 (D_0 = -3, whenever p = 1 mod 3), j = 1728 (D_0 = -4, whenever p = 1 mod 4),\
    \ and the O(1) curves with j a root of a small H_{D_0}. IS THAT CLASS CRYPTOGRAPHICALLY RELEVANT?\
    \ YES, AND THE RECORD SAYS SO PLAINLY: secp256k1 is y^2 = x^3 + 7, a j = 0 curve, so its canonical\
    \ lift is a CM curve over Q with |D_E| = 3 and the reachability gate PASSES for it at polylog\
    \ cost. Many GLV and pairing-friendly curves are built by the CM method precisely to have small\
    \ |D_0| (DEC-20260806-160175 records the Hilbert-class-polynomial construction route in this program's\
    \ own corpus). NO ATTACK ON ANY OF THOSE CURVES FOLLOWS: passing the reachability gate only earns\
    \ the right to run the height argument, which IDEA-20260807-fd5a24 and IDEA-20260807-11b93d then\
    \ show yields a constant factor and no exponent, and IDEA-20260807-6533fd shows is dominated on\
    \ coordinate size alone.\n(E) AND THE EVASION IS NOT REACHABLE BY WALKING. DECOMPOSITION.md T4\
    \ (fact): fixing the isogeny class fixes t, hence fixes D = t^2 - 4p, hence fixes D_0. \"You cannot\
    \ walk to a j = 0 curve from a curve whose class does not already contain one.\" Within a class,\
    \ walking UP the volcano to the crater reduces |D_E| from |D_0|f^2 to |D_0| -- a genuine reduction\
    \ by up to f^2 -- but the floor is |D_0|, which is Theta(p) for a random class. So the volcano\
    \ gives a real but bounded improvement to the gate, and it is quantified here rather than asserted:\
    \ ascending the full conductor reduces the class-polynomial cost from |D_0 f^2|^{1+o(1)} to |D_0|^{1+o(1)},\
    \ a factor f^{2+o(1)}, and f^2 <= |D|/3 so the best case is p^{o(1)} -- which is attained only\
    \ when |D_0| = O(1), i.e. only in the class that already contained a small-discriminant curve."
  resource_label: R6 (lift to Z_p / characteristic zero -- the object being costed) and R3 (End(E)
    as a ring -- disc, class number, and volcano level are the cost parameters); R4 enters only through
    the T4/T5 walking argument in (E).
  admissibility: admissible
  admissibility_argument: 'This record consumes no group-oracle output at all: every quantity in it
    is a function of (p, t, D_0, f_E) and of published algorithm complexities. It cannot be simulated
    in the generic group model for the trivial reason that it computes nothing about the group --
    it computes the price of leaving it. That makes it admissible and also makes it, honestly, an
    AUDIT rather than an attack component. It is filed as a measurement because the gate it evaluates
    is mandatory for every other L9 proposal, and because a lane that skips it would report a height
    result whose setup cost already exceeded the attack it was compared against.'
  reachability_gate: 'THIS RECORD IS THE REACHABILITY GATE FOR LANE L9, and it reports FAIL for the
    generic curve and PASS for h(disc End) = O(1). Stated as T5 requires: (i) is a good object common
    enough to hit by random walking? NO -- the good set has density p^{-1+o(1)} among curves over
    F_p and, worse, is class-invariant: T4 fixes D_0, so a random walk inside the class never changes
    whether the class is good. (ii) Is goodness detectable by a LOCAL test at each step? YES, and
    cheaply: h(disc End) is computable in O(polylog p) from (p, t, f_E), and f_E is read off by counting
    rational ell-isogenies. So this lane is the unusual case where goodness IS locally detectable
    and the lane still dies -- not on detectability but on reachability, because the only move available
    (ascend the volcano) improves |D_E| by at most f^2 and cannot go below |D_0|, which the class
    fixed before the attacker arrived. COST OF THE ONE AVAILABLE MOVE: ascending f_E = f to 1 costs
    O(log p) isogeny steps (crater mixing, T5) and buys a factor f^{2+o(1)} off a p^{1+o(1)} bill.'
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE): confirm the five closed-form H_D values against
      a source; confirm the Sutherland complexity statement against the arXiv abstract already retrieved;
      record both with verification status. A failure here downgrades the record''s citations, not
      its arithmetic. STAGE 1 (minutes): exact reduced-form class number counting versus the analytic
      formula over |D| <= 4000. STAGE 2 (hours): complex-analytic H_D construction for |D| <= 400
      with mpmath; record degree, coefficient bit lengths, total size, wall clock; fit the size slope.
      STAGE 3 (minutes): Hensel lift on toy curves; verify H_D(j(E)) = 0 mod p and lift to p^8. STAGE
      4 (minutes): the evasion census over a ladder of p. STAGE 5 (zero compute): tabulate the gate
      at standardised sizes and charge against 0.886 sqrt(N); report both exponents.'
    mechanism: 'STEP 1 -- TABULATE THE GATE. For a ladder of toy p and, symbolically, for standardised
      sizes (160, 192, 224, 256, 384, 521 bits), compute |D| = 4p - t^2 for the realised t, factor
      D = D_0 f^2, and evaluate h(D_0 f_E^2) for each volcano level f_E | f, using the analytic class
      number formula h = sqrt(|D|) L(1, chi_D)/pi with L computed from a truncated Euler product (mpmath).
      Report h, deg H, and the predicted bit size Theta(|D| log^2 |D|) at every level.

      STEP 2 -- CROSS-CHECK h AGAINST EXACT COUNTING AT TOY SCALE. For |D| below a few thousand, count
      reduced binary quadratic forms of discriminant D exhaustively (elementary loop over |b| <= sqrt(|D|/3))
      and compare with the analytic value. This is the instrument check: any discrepancy means the
      L-value truncation is wrong and every downstream number is void.

      STEP 3 -- BUILD H_D DIRECTLY AT TOY SCALE AND MEASURE ITS ACTUAL SIZE. For |D| <= a few hundred,
      compute H_D by the complex-analytic method (sum over reduced forms of the j-value of the corresponding
      lattice, via the q-expansion of j with mpmath at sufficient precision), and record (a) deg H_D,
      (b) max coefficient bit length, (c) total bit length, and (d) wall clock. Fit total bit length
      against |D| in log-log; the predicted slope is 1. THIS IS THE MEASUREMENT THAT MAKES THE EXPONENT
      CLAIM FALSIFIABLE RATHER THAN QUOTED.

      STEP 4 -- VERIFY THE LIFT ACTUALLY LANDS. For a toy ordinary E/F_p with small |D|, check that
      H_D(j(E)) = 0 mod p, that j(E) is a simple root mod p, and Hensel-lift that root to a root of
      H_D in Z/p^n for n up to 8. That is the canonical lift''s j-invariant to precision p^8, computed
      the expensive way, and it is the ground truth against which any claimed cheap route in Step
      5 must be checked.

      STEP 5 -- THE OPEN QUESTION, MADE INTO AN EXPERIMENT RATHER THAN AN ASSERTION. Attempt the p-adic
      route on the same toy instances: form Phi_p(X,X) (feasible only for tiny p) and Hensel-lift
      its root; measure the cost and confirm it agrees with Step 4''s answer. Then record the measured
      cost ratio and extrapolate the two exponents. If any third route is found in the Stage-0 literature
      check, it is measured on the same fixtures.

      STEP 6 -- THE EVASION CENSUS. Count, over a ladder of p, how many curves over F_p have h(disc
      End) <= H_max for H_max in {1, 2, 4, 8, 16}. The predicted count is sum over small D_0 of h(D_0)
      * (twists), i.e. O(1) per D_0 and O(H_max^{2+o(1)}) in total, against ~p curves -- a fraction
      p^{-1+o(1)}. Report the measured fraction and its decay slope.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - Closed-form H_D positive control (|D| in {-3,-4,-7,-8,-11}).
  - Random monic polynomial null of matched degree and coefficient size.
  - Exact reduced-form counting as an independent check on h.
  - Rho and BSGS baselines at the same N (KN-TECH-001, KN-TECH-006, KN-TECH-031).
  - 'NULL OBJECT (from the proposal): MANDATORY. NULL OBJECT for the cost measurement: a random monic
    integer polynomial of the SAME degree h(D) with coefficients of the same bit length, subjected
    to the identical size and Hensel-lifting measurements. The null isolates "the cost is a function
    of the polynomial''s shape" from "the cost is a function of D". PREDICTION: the null matches on
    size and on Hensel cost, and DIFFERS on construction cost (the null is free to write down; H_D
    is not). If the null also matches on construction cost, the measurement is not measuring class-polynomial
    construction at all. DECAY PARAMETER: |D|. The measured total bit length of H_D must GROW like
    |D|^{1+o(1)}; the fraction of curves with h <= H_max must DECAY like p^{-1+o(1)}. A fraction that
    fails to decay as p grows is the canonical artifact tell and would mean the census is counting
    twists or isomorphism classes inconsistently. POSITIVE CONTROL: |D| in {-3,-4,-7}, where H_D is
    known in closed form (X, X - 1728, X + 3375). The instrument must return exactly those.'
  independent_variables: []
  metrics:
    primary:
    - h(D), deg H_D, max coefficient bits, total bits, per |D|
    - Fitted size slope with interval
    - Hensel lift success and residual at each precision
    - Evasion-class fraction per p with decay slope
    secondary:
    - Wall clock and peak memory per cell
    - Null-arm values for every metric
  heuristic_under_test: null
  preregistered_prediction:
    quantity: fitted slope of log(total bit size of H_D) against log|D| over the toy range |D| <=
      400
    formula: Predicted 1.0 with a fit interval excluding 0.5. A slope near 0.5 would mean only the
      degree, not the coefficient height, is growing, and the size argument would be wrong.
    source: pre-registered in IDEA-20260807-ee6ef7 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - Precision in the complex-analytic construction. Under-precision produces wrong coefficients that
    still look plausible; the closed-form control and an integrality check on every coefficient are
    mandatory.
  - Conflating H_D with a class-invariant polynomial (Weber functions and the like) whose coefficients
    are smaller by a constant factor in the exponent's cofactor. That changes constants, not the exponent
    1, and any measurement must state which polynomial it built.
  - Twist and isomorphism-class counting in the evasion census. Six sextic twists of a j = 0 curve
    are six curves with the same |D_E|; whether they are counted once or six times changes the fraction
    by a constant and must be declared.
  - The ineffective o(1) in Siegel. It forbids any statement about a specific finite p being "provably
    past the crossover"; only the exponent is claimed.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Predicted 1.0 with a fit interval excluding 0.5. A slope near 0.5 would mean
    only the degree, not the coefficient height, is growing, and the size argument would be wrong.
  falsification_criterion:
  - The fitted size slope is materially below 1. The class polynomial is smaller than claimed and
    the gate's exponent falls; the record is superseded with the measured exponent.
  - Exact and analytic class numbers disagree. Instrument failure; nothing reported.
  - A route is found (Stage 0 literature, or Stage 5) computing the canonical lift for prime-field
    E in p^{o(1)}. THE GATE PASSES, this record's central negative is withdrawn, and the lane's priority
    rises sharply. This is pre-registered as the outcome that would matter.
  - The evasion-class fraction does not decay with p. The good set is larger than argued and the T4
    unreachability claim needs re-examination.
  - The closed-form positive control fails. No negative may be reported from any arm.
  - Wall clock exceeds budget before any |D| is resolved. INFRASTRUCTURE outcome under AGENTS.md rule
    5, recorded as such, not as evidence.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
