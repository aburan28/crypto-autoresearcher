experiment:
  id: EXP-PNEXT-624f41
  hypothesis_id: H-PNEXT-8f9166
  goal_id: GOAL-PFDR-fd09e0
  version: 1
  title: Equivalent point encodings and certified coefficient-SAT pruning
  status: review_required
  objective: Compare equivalent prime-field point encodings and exact coefficient-SAT pruning with independent
    finite model checks and separate instrumented costs.
  inputs:
    config: experiments/EXP-PNEXT-624f41/config.json
  input_bindings:
    source: []
    fixtures: []
  controls:
    aa:
      present: true
      comparison: C-AA
      not_applicable_reason: null
    positive:
      present: true
      arm: positive_controls
      expected_detection: Known satisfiable/unsatisfiable affine PC fixtures and valid polynomial Bezout/root
        fixtures exercise the intended explanation and root paths.
      not_applicable_reason: null
    negative:
      present: true
      arm: negative_controls
      null_population:
        description: Deterministic corrupted certificates and satisfiable systems that must not be refuted;
          exact finite invalid/no-root controls.
        generator: Frozen synthetic integrity controls, independent of scientific fixture outcomes.
        n: 1
        why_n: Aggregate fixed exact synthetic checks; no statistical null inference.
        matched_on:
        - arithmetic
        - certificate format
        - checker path
      not_applicable_reason: null
  independent_variables: &id001
  - name: encoding
    levels:
    - quartic
    - membership
    - quadratic
  - name: coefficient_pruning
    levels:
    - leaf_sat
    - prefix_univariate_gcd
    - exhaustive_reference
  metrics:
    primary:
    - id: subcells
      name: subcells
      unit: integer
      kind: exact
      definition: Number of explicitly present raw subcells represented by the aggregate arm.
      source: Frozen export_results.py extraction from hash-bound raw payloads
      aggregation: per_row
      resolution: one integer
      uncertainty: none_exact
    - id: verification_pass
      name: verification pass
      unit: integer
      kind: exact
      definition: One only when sealed native receipt and relevant independent package checks pass.
      source: Frozen export_results.py extraction from hash-bound raw payloads
      aggregation: per_row
      resolution: one integer
      uncertainty: none_exact
    - id: search_complete
      name: search complete
      unit: integer
      kind: exact
      definition: Number of subcells whose producer explicitly records complete search.
      source: Frozen export_results.py extraction from hash-bound raw payloads
      aggregation: per_row
      resolution: one integer
      uncertainty: none_exact
    - id: search_censored
      name: search censored
      unit: integer
      kind: exact
      definition: Number of subcells whose producer explicitly records capped/censored search; never UNSAT.
      source: Frozen export_results.py extraction from hash-bound raw payloads
      aggregation: per_row
      resolution: one integer
      uncertainty: none_exact
    - id: models_found
      name: models found
      unit: integer
      kind: exact
      definition: Number of produced search models in the arm-specific coefficient or coordinate domain,
        not pooled across domains.
      source: Frozen export_results.py extraction from hash-bound raw payloads
      aggregation: per_row
      resolution: one integer
      uncertainty: none_exact
    secondary:
    - id: certificate_bytes
      name: certificate bytes
      unit: integer
      kind: exact
      definition: Serialized proof bytes explicitly reported by the producer; absent telemetry remains
        absent.
      source: Frozen export_results.py extraction from hash-bound raw payloads
      aggregation: per_row
      resolution: one integer
      uncertainty: none_exact
    - id: reference_models
      name: reference models
      unit: integer
      kind: exact
      definition: Exact independently enumerated coordinate or coefficient reference count, separately
        by package.
      source: Frozen export_results.py extraction from hash-bound raw payloads
      aggregation: per_row
      resolution: one integer
      uncertainty: none_exact
    - id: control_pass
      name: control pass
      unit: integer
      kind: exact
      definition: Number of required synthetic checks reporting true.
      source: Frozen export_results.py extraction from hash-bound raw payloads
      aggregation: per_row
      resolution: one integer
      uncertainty: none_exact
    - id: control_fail
      name: control fail
      unit: integer
      kind: exact
      definition: Number of required synthetic checks reporting false.
      source: Frozen export_results.py extraction from hash-bound raw payloads
      aggregation: per_row
      resolution: one integer
      uncertainty: none_exact
  scale_relevance:
    tier: toy
    justification: p17,p97 fixed finite domains, no transfer or asymptotic inference.
    correspondence: null
  replication:
    seeds:
    - 17
    independent_instances: 1
  budget:
    enforcement: advisory
    maximum_memory_gb: 4
    maximum_workers: 1
    maximum_runs: 1
  stopping_rules:
  - Execute exactly106 encoding cells and6 coefficient cells with all4 respective arms and controls once,
    serially. No outcome-based scaling or target replacement.
  - Encoding cap degree2/256rows/128SATcandidates/512PCcalls yields censored search without implying UNSAT;
    independent complete census remains separate.
  - Coefficient inventory checks cap83521 leaves and4913 prefixes percell protect exact scope; a cap or
    mismatch preserves incomplete status and cannot certify UNSAT.
  - Certificate, model-set, chart-union, source or input mismatch invalidates the affected comparison;
    retain raw cells and no silent rerun.
  invalidation_rules:
  - Source/config mismatch, missing/duplicate fixture or arm, oracle-based clause steering, false certificate,
    dropped squarefree exceptional chart, failed required control, or inconsistent model set.
  success_criterion: Exact declared finite model, explanation and squarefree chart checks all agree; retain
    bounded search censoring and phase counts separately. This does not support a performance claim.
  falsification_criterion: Any checked model mismatch, unsound clause, false certificate or missing squarefree
    chart refutes the respective finite implementation assertion. Incomplete execution is UNKNOWN.
  decision_impact:
    on_positive: Report finite checks and retain unresolved performance obligations; no automatic hypothesis
      promotion.
    on_negative: Record exact affected variant/counterexample; preserve data and require additive correction
      before any rerun.
  variable_ledger:
    independent: *id001
    factors:
    - name: public_inputs
      treatment: fixed
      value: experiments/EXP-PNEXT-624f41/config.json
      how: The same fixed curves, targets, coefficient domains and cosets within each package.
    - name: caps
      treatment: fixed
      how: Same bounded PC policy and SAT limits across encoding arms; coefficient domain fully enumerated
        with defensive inventory caps.
    - name: nuisance_order
      treatment: fixed
      how: Quadratic A/A reverses polynomial order only; coefficient A/A reverses prefix schedule only.
    - name: reference_visibility
      treatment: fixed
      how: Independent census is verification-only and never supplies clauses or search order.
    - name: accounting
      treatment: fixed
      how: Identical named primitive/event units compared within each phase; no composite universal work
        total.
    comparisons:
    - id: C-EQUIV
      arms:
      - quartic
      - membership
      - quadratic
      - quadratic_aa
      differs_in: []
      design: absolute
      threshold: Complete reconstructed model sets equal the independent group oracle on every fixed finite
        cell; bounded search models sound, complete status exact.
    - id: C-COEFF
      arms:
      - leaf_sat
      - prefix_univariate_gcd
      - exhaustive_reference
      - aa_reverse_prefix
      differs_in: []
      design: absolute
      threshold: Exact coefficient models equal in all arms; Bezout/clauses valid; recovered squarefree
        relations plus fallback equal complete independent point oracle.
    - id: C-ENC-COUNT
      arms:
      - quartic
      - quadratic
      differs_in:
      - encoding
      design: one_factor
    - id: C-MEMBER-COUNT
      arms:
      - quartic
      - membership
      differs_in:
      - encoding
      design: one_factor
    - id: C-COEFF-COUNT
      arms:
      - leaf_sat
      - prefix_univariate_gcd
      differs_in:
      - coefficient_pruning
      design: one_factor
    - id: C-AA
      arms:
      - quadratic
      - quadratic_aa
      differs_in:
      - nuisance_order
      design: aa
    - id: C-COEFF-AA
      arms:
      - prefix_univariate_gcd
      - aa_reverse_prefix
      differs_in:
      - nuisance_order
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: ENCODING
    first_recorded_in: coordination/prime_sat_followup_20261029/design-notes.md
    written_at: '2026-10-29'
    data_seen:
    - EXP-PFIVE-e26798 same public curves/targets; prior p17 coefficient census
    sample_status: in_sample
    overlap: Mechanism-motivated calibration on previously seen fixtures, no held-out performance criterion.
  - prediction: COEFFICIENT
    first_recorded_in: coordination/prime_sat_followup_20261029/design-notes.md
    written_at: '2026-10-29'
    data_seen:
    - EXP-PFIVE-e26798 same public curves/targets; prior p17 coefficient census
    sample_status: in_sample
    overlap: Mechanism-motivated calibration on previously seen fixtures, no held-out performance criterion.
  - prediction: COUNTS
    first_recorded_in: coordination/prime_sat_followup_20261029/design-notes.md
    written_at: '2026-10-29'
    data_seen:
    - EXP-PFIVE-e26798 same public curves/targets; prior p17 coefficient census
    sample_status: in_sample
    overlap: Mechanism-motivated calibration on previously seen fixtures, no held-out performance criterion.
  required_artifacts:
  - manifest.yaml
  - raw-result.json
  - encoding.json
  - coefficients.json
  - encoding-cells.jsonl
  - coefficient-cells.jsonl
  - execution-receipt.json
  - launch.json
  - environment.json
  - check.stdout.log
  - check.stderr.log
  - export.json
  - reports/report.md
  - reports/diagram.svg
  - reports/report.pdf
  assigned_to: executor
  approved_by: null
  frozen: false
  execution_authorized: false
  execution_plan:
    protocol_hashes: {}
    trial_plan: experiments/EXP-PNEXT-624f41/trial-plan.json
    queue: coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-a99822/dispatch_queue.json
