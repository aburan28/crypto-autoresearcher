experiment:
  id: EXP-SSI-be32d2
  hypothesis_id: H-SSI-072490
  idea_id: IDEA-20261004-e4c461
  version: 1
  title: >-
    Depth-two j-invariant label collision on three CSIDH-shaped toy primes
  status: approved
  objective: >-
    Decide H-SSI-072490 by exhaustive enumeration of the depth-two
    3-isogeny and 5-isogeny neighborhoods of j = 1728 at p = 59, 419, and
    659, once with the public state equal to the j-invariant and once with
    the CSIDH ideal direction published.
  inputs:
    primes: [59, 419, 659]
    prime_shapes:
      59: 4*3*5 - 1
      419: 4*3*5*7 - 1
      659: 4*3*5*11 - 1
    base_curve: y^2 = x^3 + x
    base_j: 1728
    degrees: [3, 5]
    depth: 2
    label_pairs: ordered pairs from {3, 5}
  controls:
    - >-
      Positive: publish the CSIDH ideal (l, pi - 1) or its conjugate with
      the codomain. Secret-side composition and the public action are both
      computed. Any disagreement invalidates the run.
    - >-
      Negative: the public state is only the codomain j-invariant. Hidden
      labelings are the kernel choices not recoverable from that j-invariant.
    - >-
      Nearby: one-step neighbor enumeration with no second label. It may
      list neighbors. It is not scored as a two-step action.
    - >-
      Quotient: before a conflict is counted, identify curves with their
      Galois conjugates and quotient by automorphisms and by the dual of
      the edge just traversed.
  independent_variables:
    - prime in {59, 419, 659}
    - degree in {3, 5}
    - public state in {j-invariant only, j-invariant plus ideal direction}
  metrics:
    primary:
      - conflicting_unlabeled_fiber_count
      - oriented_composition_disagreement_count
    secondary:
      - public_view_fiber_sizes
      - endpoint_isomorphism_checks
      - one_step_neighbor_count
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      conflicting unlabeled fibers per (prime, degree) cell, and oriented
      composition disagreements per cell
    formula: >-
      Unlabeled fiber count is at least 1 on at least one of the six cells.
      Oriented disagreement count is 0 on every cell. The counts are exact
      enumeration totals, not tail probabilities.
    source: >-
      H-SSI-072490, specializing the collision statement in
      IDEA-20261004-e4c461. No distribution law is being fit.
  scale_relevance:
    tier: toy
    justification: >-
      The six cells are small enough that every kernel sequence of length
      two is listed. Nothing in the result is claimed at a larger prime.
    correspondence: null
  tail_checks: []
  replication:
    seeds: []
    independent_instances: 6
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after the six cells and the one-step nearby control are recorded.
    - Do not extend the prime set, the degree set, or the depth.
  invalidation_rules:
    - The oriented control reports a composition disagreement on any cell.
    - A cell is sampled instead of fully enumerated.
    - A conflict is counted without an isomorphism check of the endpoints.
    - The run uses a prime, degree, curve, or depth outside the inputs block.
  success_criterion: >-
    The run is valid, every cell has oriented_composition_disagreement_count
    equal to 0, and the sum of conflicting_unlabeled_fiber_count over the
    six cells is at least 1. Each counted conflict is stored as a
    certificate naming both labelings, the shared j-invariant, and the two
    non-isomorphic depth-two codomains.
  falsification_criterion: >-
    The run is valid and the sum of conflicting_unlabeled_fiber_count over
    the six cells is 0.
  required_artifacts:
    - experiments/EXP-SSI-be32d2/runs/<RUN-ID>/command.txt
    - experiments/EXP-SSI-be32d2/runs/<RUN-ID>/cells.json
    - experiments/EXP-SSI-be32d2/runs/<RUN-ID>/certificates.json
    - experiments/EXP-SSI-be32d2/runs/<RUN-ID>/stdout.txt
    - experiments/EXP-SSI-be32d2/runs/<RUN-ID>/stderr.txt
  assigned_to: executor
  approved_by: coordinator
  approval:
    decision_id: DEC-20261005-fb3a2e
    basis: >-
      AGENTS.md standing user authorization of 2026-09-06. This record
      freezes the protocol. It does not launch the executor.
    not_launched_because: >-
      GOAL-SSI-2fa82a next_action still requires the C-star symbolic
      interface. Dispatch of TASK-20261005-1a3601 waits for a Coordinator
      decision that releases this experiment.
