# EXP-OAKLEY-7f73ef
# Stage-0 subfield hit count for H-OAKLEY-020f90.
# Frozen before the official run.
experiment:
  id: EXP-OAKLEY-7f73ef
  hypothesis_id: H-OAKLEY-020f90
  source_idea: IDEA-20261007-ece173
  question_id: RQ-OAKLEY-264353
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Subfield x-coordinates hit by four-point factor-base sums at p=5
  status: approved
  frozen: true
  designed_at: '2026-10-12'
  approved_by: coordinator
  approval_decision_id: DEC-20261012-f74f8d
  execution_authorized: true
  objective: >-
    On one degree-25 sibling, count how many of the 32 subfield
    x-coordinates occur as the x-coordinate of an ordered sum of four
    factor-base points. Compare that count with 1/120 using a
    three-standard-deviation binomial band. Do not fit an exponent.
  inputs:
    modulus: "z^25 + z^3 + 1"
    curve: "y^2 + x*y = x^3 + z"
    a: 0
    b: z
    p: 5
    population: "the 32 subfield elements"
    predicted_probability: "1/120"
    band: "(120 * hit_count - 32)^2 <= 9 * 32 * 119"
    named_future_run_slot: RUN-OAKLEY-326307
  controls:
    - >-
      z is primitive, the subfield has 32 elements and is closed, and
      z lies outside it. The first three nonzero-x factor-base points
      satisfy negation, doubling, and associativity. Failure invalidates
      the cell.
    - >-
      The checker repeats the curve equation for the recorded point and
      its double with schoolbook multiplication.
  independent_variables:
    - the frozen modulus, curve, and subfield population, not chosen after a count
  metrics:
    primary:
      - hit_count
      - within_three_sd
      - beyond_three_sd
    secondary:
      - factor_base_size
      - planted_ok
  heuristic_under_test: >-
    IDEA-20261007-ece173 heuristic H2 at the p=5 rung: the decomposition
    fraction against 1/5!, read here as a hit rate on the subfield.
  preregistered_prediction:
    quantity: >-
      hit_count is the number of subfield x-coordinates that equal the
      x-coordinate of at least one ordered four-point factor-base sum.
      The population size is 32. The predicted probability is 1/120.
    formula: >-
      Agreement is (120 * hit_count - 32)^2 <= 34272, which is three
      binomial standard deviations. The negative reading is the same
      square strictly above 34272. The planted identities must hold
      for either reading.
    source: >-
      IDEA-20261007-ece173 says a mismatch with 1/120 beyond binomial
      error invalidates the counting. The square 9 * 32 * 119 was fixed
      before the hit count was computed. At this population a deficit
      cannot leave the band; only an excess can.
  scale_relevance:
    tier: toy
    justification: >-
      One degree-25 field and a 32-element population. No p=7 rung,
      no alpha fit, and no endpoint extrapolation.
    correspondence: null
  tail_checks:
    - >-
      hit_count is at most 32. A larger count means the scan left
      the subfield.
    - >-
      A factor base of size below 2, or fewer than three points with
      nonzero x, invalidates the cell.
  replication:
    seeds: []
    independent_instances: 1
    named_future_run_slot: RUN-OAKLEY-326307
    replication_note: >-
      One deterministic census. No random target list is drawn.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one valid manifest for RUN-OAKLEY-326307.
    - Do not add a rung, a solver, or an exponent fit in this contract.
    - A count outside the band is the recorded result. Do not change 34272.
  invalidation_rules:
    - The planted field or addition identities fail.
    - The modulus, curve, or population differs from this specification.
    - The factor base has fewer than two points.
    - A timeout, crash, or missing count.
  success_criterion: >-
    The manifest is valid, planted_ok is true, and
    (120 * hit_count - 32)^2 is at most 34272.
  falsification_criterion: >-
    The manifest is valid, planted_ok is true, and
    (120 * hit_count - 32)^2 is strictly above 34272.
  decision_impact:
    on_positive: >-
      Record that the subfield hit count sits within three binomial
      standard deviations of 1/120. Do not fit alpha and do not publish
      an endpoint interval from this pass alone.
    on_negative: >-
      Record that the count misses 1/120 by more than three standard
      deviations. Do not treat H2 as confirmed at p=5, and do not start
      the two-rung fit from this manifest.
  required_artifacts:
    - experiments/EXP-OAKLEY-7f73ef/runs/RUN-OAKLEY-326307/manifest.yaml
    - experiments/EXP-OAKLEY-7f73ef/runs/RUN-OAKLEY-326307/raw-result.json
  assigned_to: executor
  launcher:
    trial_plan: experiments/EXP-OAKLEY-7f73ef/trial-plan.json
    driver: experiments/EXP-OAKLEY-7f73ef/implementation/run.py
    checker: experiments/EXP-OAKLEY-7f73ef/implementation/check.py
  out_of_scope:
    - The p=7 rung, alpha fits, cap doubling, and endpoint extrapolations.
    - Solver time, memory, and charged cost per relation.
    - The Oakley endpoint fields and any claim of an attack cost.
