  version: 1
  title: SCOPE RECORD A - THE CAUSAL DIRECTION BETWEEN CM DISCRIMINANT AND EMBEDDING DEGREE IS THE
    OPPOSITE OF THE ONE THE LANE'S TITLE SUGGESTS - small |D| does NOT produce small k, because k
    = ord_N(t-1) is a function of (N, p) alone; what is true is that every known small-k CONSTRUCTION
    (MNT, Barreto-Naehrig, Cocks-Pinch, Freeman, KSS) solves a CM equation and thereby CONSTRAINS
    D, so pairing-friendliness and CM structure are correlated by construction and not by causation;
    deliver the family-by-family table that states this and names, for each family, whether D is forced,
    free, or Pell-constrained
  status: draft
  objective: "(A) THE IDENTITY THAT ORGANISES THE WHOLE LANE. For a prime N dividing #E(F_p) = p +\
    \ 1 - t, reduce mod N to get p = t - 1 (mod N). Hence the embedding degree is\n    k = ord_N(p)\
    \ = ord_N(t - 1),\nthe multiplicative order of (t-1) modulo N. Two immediate readings. (i) k is\
    \ a function of the TRACE and the subgroup order and of nothing else - not of D_0, not of the\
    \ class number, not of j, not of the conductor, not of the volcano level. Curves with |D_0| =\
    \ 3 (j = 0) have no more claim to a small k than any other curve at the same (p, N). (ii) When\
    \ N > 2 sqrt(p) + 1 the residue p mod N is LITERALLY the small integer t - 1 (or N + t - 1), of\
    \ absolute value at most 2 sqrt(p) + 1. So the embedding degree of a near-prime-order curve is\
    \ the order of a SMALL integer modulo a large prime, which is the exact regime of the classical\
    \ theorems on multiplicative order (used in IDEA-20260807-6c7540) and is why small k is rare rather\
    \ than impossible.\n(B) WHAT IS ACTUALLY TRUE ABOUT CM FAMILIES, STATED AS THE DELIVERABLE. Pairing-friendly\
    \ curves are CONSTRUCTED, and the construction is what ties them to CM. Every known method fixes\
    \ a target k, then solves the CM equation D.y^2 = 4p - t^2 for small |D| so that the Hilbert class\
    \ polynomial of discriminant D is computable and the curve can be written down. The correlation\
    \ runs construction -> D, never D -> k. The table this record delivers, with one row per family,\
    \ each row carrying (target k, whether D is forced or free, the rho-value #E vs field size, and\
    \ the mechanism that forces D) -\n  - Barreto-Naehrig - k = 12, D = -3 FORCED (j = 0), rho = 1;\n\
    \  - MNT - k in {3, 4, 6}, D arises from a PELL equation and is\n    effectively unconstrained\
    \ in size but must be found by solving it,\n    rho = 1;\n  - Cocks-Pinch - k arbitrary, D essentially\
    \ FREE (chosen first), rho\n    approximately 2 - the freedom in D is paid for in field size;\n\
    \  - Freeman - k = 10, D variable;\n  - KSS and BLS families - fixed small k, D typically -3 or\
    \ small;\n  - Scholl's isolated-curve variant of the CM method (KN-LIT-608) -\n    deliberately\
    \ produces prime-field curves with LARGE embedding degree\n    under Bateman-Horn, i.e. the same\
    \ CM machinery pointed the other way.\nThe deliverable is that table with each cell sourced, plus\
    \ the explicit statement of (A) that makes it interpretable rather than a list.\n(C) WHY THIS\
    \ IS A SCOPING RECORD AND NOT AN ATTACK. Nothing here proposes to attack anything. It exists because\
    \ RQ-PAIR-21313f asks \"which CM families have exploitably small embedding degree\", and the correct\
    \ answer - \"the question has a false presupposition, and here is the true structure behind the\
    \ correlation that motivates it\" - is a deliverable only if it is written down with the families\
    \ enumerated and the causal direction argued. A lane that answers \"none\" without the table is\
    \ a fatigue report.\n(D) THE ONE PLACE THE CAUSAL ARROW DOES POINT FROM CM TO k, AND IT IS NEGATIVE.\
    \ Given a target k, the CM equation D.y^2 = 4p - t^2 must have a solution with |D| small enough\
    \ for the class polynomial to be computable - class number h(D) grows like |D|^{1/2+o(1)}, so\
    \ |D| is capped in practice at around 10^7 to 10^{10} depending on method. That is a constraint\
    \ the CONSTRUCTOR faces, not a property an existing curve has. It bounds what a designer can build,\
    \ which is why it belongs in the affected/safe split of IDEA-20260807-98a970 rather than in an\
    \ attack."
  resource_label: R7 (pairings into F_{p^k}), consumed in SCOPING MODE ONLY - the record maps where
    R7 is non-empty and mounts no attack. Touches R3 (End(E) as a ring) only to state that the discriminant
    does NOT determine k.
  admissibility: admissible
  admissibility_argument: Admissible but vacuously so - a scoping record consumes no resource against
    any instance and therefore cannot be inadmissible under the H-ENDO-001 filter. It is recorded
    as admissible so the campaign's resource table stays complete, and the record is explicit that
    admissibility here carries no implication that an attack exists.
  reachability_gate: NOT A MOVE BETWEEN CURVES, AND THE RECORD EXPLAINS WHY NO SUCH MOVE EXISTS. Reaching
    a pairing-friendly curve from a given curve would require changing (p, N), which no F_p-isogeny
    does. Reaching one by CONSTRUCTION is easy and is what the table catalogues, but construction
    is a designer's operation on an empty input, not an attacker's operation on a given instance.
    The distinction is the whole content of the affected/safe split - a designer can build small k,
    an attacker cannot walk to it. T5 is therefore answered "unreachable at any cost" for the attacker
    and "free" for the designer.
  inputs:
    procedure: 'STAGE 1 (zero compute): derive (A); run the BN fixture reproduction check. STAGE 2
      (hours, no compute): build the table from sources, each cell with its verification status. STAGE
      3 (under one CPU-hour): the two nulls - 500 j = 0 curves at toy p with random trace (k must
      be large) and, for each of 50 toy isogeny classes, all discoverable class members (k must be
      constant). STAGE 4 (zero compute): write the causal-direction statement with both collision
      witnesses.'
    mechanism: STEP 1 (zero compute) - derive and record the identity k = ord_N(t-1) with its two
      readings, and the corollary that k is independent of every CM datum at fixed (p, N). STEP 2
      (literature, medium effort) - build the table. Primary source for the taxonomy is Freeman, Scott
      and Teske, "A Taxonomy of Pairing-Friendly Elliptic Curves", Journal of Cryptology 23(2):224-280,
      2010, doi:10.1007/s00145-009-9048-z (existence, authors, venue and DOI confirmed by web search
      on 2026-08-07; the paper itself was NOT read in this session and every figure taken from it
      must be marked as relayed until it is). Secondary sources already in this corpus - KN-LIT-1023
      (Pairing-Friendly Elliptic Curves - Revisited), KN-LIT-313 (Boxall, heuristics on the density
      of pairing-friendly classes at fixed k and fixed D), KN-LIT-608 (Scholl, isolated curves resistant
      to MOV), KN-LIT-2223 (a short list of curves resistant to special TNFS). Each row must name
      its source and its verification status. STEP 3 (low compute) - CONSTRUCT one toy instance per
      family where feasible at p <= 2^32, to make the table executable rather than bibliographic.
      A toy BN-shaped curve (D = -3, k = 12) and a toy Cocks-Pinch curve with a chosen D are the two
      that matter, because they are the positive controls every other proposal in this lane needs.
      STEP 4 (zero compute) - state the causal direction explicitly, with the counterexample pair
      that proves it - two curves at the same (p, N) with very different D and identical k, and two
      curves with the same D = -3 and wildly different k. Both pairs are producible at toy scale and
      both are required.
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - D-matched, trace-unmatched null - small k must NOT appear
  - trace-matched, D-unmatched null - k must be identical
  - random-curve arm at the same p, for the KS comparison
  - a deliberately constructed small-k toy curve, which the pipeline must classify as small-k (else
    the instrument cannot see the thing it is scoping)
  - 'NULL OBJECT (from the proposal): MANDATORY. The null object is a MATCHED RANDOM CURVE at the
    same p and the same |D_0| as each tabulated pairing-friendly family member - same CM discriminant,
    same j-invariant class, but a trace not produced by the construction. Its embedding degree must
    be LARGE. The decay parameter is |D_0|-matching itself - as one matches the CM data of a pairing-friendly
    curve more and more closely while NOT matching its trace, the small embedding degree must FAIL
    TO APPEAR. If small k persists in the D-matched-but-trace-unmatched null, then D really does drive
    k, (A) is wrong, and this record is refuted. That is the whole discriminating content of the record
    and it is cheap - a few hundred toy curves with j = 0. SECOND NULL - a curve with the same trace
    but a different D (different conductor level in the same isogeny class); its k must be IDENTICAL,
    since (p, N) are unchanged. These two nulls pull in opposite directions and together pin the causal
    arrow.'
  independent_variables: []
  metrics:
    primary:
    - k per curve, computed exactly at toy scale by factoring N-1
    - the (p, t,
    - KS statistic between the D-matched arm and the random arm
    - the table, with a verification status per cell
    secondary:
    - both collision witnesses, exhibited explicitly
  heuristic_under_test: null
  preregistered_prediction:
    quantity: k for curves matched on |D_0| (including j = 0 and j = 1728) to a pairing-friendly family
      but not on trace, at toy p
    formula: Indistinguishable from the k of a fully random curve at the same p - specifically, the
      empirical distribution of log k must not differ from the random-curve control by more than a
      Kolmogorov-Smirnov statistic at the 0.05 level over at least 500 curves per arm. A significant
      difference refutes (A).
    source: pre-registered in IDEA-20260807-653dda before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - Selection bias in the literature. Published pairing-friendly curves are the ones somebody wanted,
    so the observed (k, D) correlation in any list of published curves is a sampling artifact. This
    is precisely the confounder the D-matched null is designed to break, and no table cell may be
    interpreted causally without it.
  - 'Cofactor effects. The identity k = ord_N(t-1) is exact for any prime N | #E, but the SIMPLIFICATION
    "p mod N is literally t - 1" needs N > 2 sqrt(p) + 1. At toy scale with large cofactors that fails
    and the residue wraps. Every reported instance must record its cofactor.'
  - Conflating k = ord_N(p) with ord_{#E}(p) or with the order of p modulo the full group order. Only
    the prime subgroup order matters and only it may be used.
  - Relayed figures. Several table cells will come from abstracts. A cell whose status is "relayed"
    must never be used as a decision threshold.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Indistinguishable from the k of a fully random curve at the same p - specifically,
    the empirical distribution of log k must not differ from the random-curve control by more than
    a Kolmogorov-Smirnov statistic at the 0.05 level over at least 500 curves per arm. A significant
    difference refutes (A).
  falsification_criterion:
  - The D-matched-but-trace-unmatched arm exhibiting systematically smaller k than the random arm.
    That refutes (A) and would mean the CM discriminant does influence the embedding degree - the
    single most surprising outcome available in this lane.
  - k varying within an isogeny class. Arithmetically impossible; indicates a point-counting or order-computation
    bug; halt.
  - The BN fixture failing to reproduce k = 12 from ord_N(t-1). Either the identity or the transcribed
    parameters are wrong; resolve before any table cell is published.
  - A construction family found that fixes k small with D genuinely unconstrained. That would refute
    (B)'s organising claim and is a positive result for the taxonomy.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
