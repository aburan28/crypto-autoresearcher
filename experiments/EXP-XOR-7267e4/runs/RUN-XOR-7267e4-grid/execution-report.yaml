  protocol_deviations:
    - >-
      NONE to the frozen scientific protocol (curve/factor-base rules,
      charge model, controls, arm mechanics) -- Arms A and B are the frozen
      full_grid.py functions imported unchanged (CTRL-BLOB verified,
      independently recomputed sha256 matches the hash cited in
      EV-ECDLP-65b004 and in EXP-XOR-62b256/EXP-XOR-019343's own
      baseline_sha256 fields); Arm D is a thin wrapper calling the frozen
      arm_c_random_predictor unchanged and relabeling its result, since that
      function already implements exactly the "same table, Q=|F| queries
      drawn uniformly from F_p, collision-free within run" mechanism
      H-XOR-a227dc's own mechanism section defines for Arm D.
    - >-
      INTERPRETATION, not deviation: specification.yaml uses "cell" at two
      different granularities across sections (independent_variables and
      replication define cell=(p,b), 8 total; the stopping_rules block's own
      first bullet defines "24 cells (4 primes x 2b x [A,B,D])"=(p,b,arm),
      24 total, then the very next bullet's early-exit condition compares
      C_D vs C_B "in the first 4 cells" -- a comparison only meaningful at
      (p,b) granularity, since C_D and C_B are both arm-specific quantities
      requiring the SAME (p,b) to compare). Resolved as (p,b) groups (the
      only coherent reading for this specific comparison); documented here
      rather than silently assumed.
    - >-
      ARTIFACT NAMING RECONCILIATION: specification.yaml's own
      required_artifacts and TASK-20260808-e6022f's deliverables both name
      "manifest.json" and "raw-results.json" (plural); this session's direct
      instructions and docs/evidence-and-reproducibility.md's canonical
      reproduction-package schema both name "manifest.yaml" and
      "raw-result.json" (singular), and the most recent sibling precedent in
      this lineage (EXP-XOR-019343) used the latter. Both were produced:
      manifest.yaml (primary, narrative-rich) plus manifest.json (a faithful
      PyYAML-derived JSON transcription of the identical data), and
      raw-result.json (primary, written by charged_grid.py) plus
      raw-results.json (a byte-identical copy, same sha256). No governing
      document's literal artifact list is left unmet by this choice.
    - >-
      implementation.md was NOT written as a separate file: this session's
      direct instructions prohibit writing report/summary/findings/analysis
      .md files, since the parent agent reads this execution_report
      directly rather than files. The equivalent narrative content
      (protocol deviations, implementation decisions, interpretive notes)
      is instead carried in manifest.yaml's narrative fields, in
      charged_grid.py's own docstrings/comments (an archived, hashed
      artifact), and in this execution_report.

  runs:
