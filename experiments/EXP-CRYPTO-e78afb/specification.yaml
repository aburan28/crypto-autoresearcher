experiment:
  id: EXP-CRYPTO-e78afb
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-CRYPTO-f5cf88
  question_id: RQ-CRYPTO-001
  goal_id: GOAL-CRYPTO-001
  assigned_to: executor
  title: >-
    Review-required contract: blind sensitivity and specificity audit of
    GOAL-CRYPTO-001's committed Gate A / Gate B discovery-readiness rubric, with
    planted positives, three matched nulls failing at three distinct fields, a
    seven-point ablation ladder, a five-item baseline fixture, and a nulls-first
    ordering rule -- zero compute

  objective: >-
    If separately approved, frozen and authorized, measure what the goal's own
    screening instrument does when it is given inputs whose correct verdicts are
    known in advance. Execute the rubric AS COMMITTED, blind, against a frozen
    input set of three planted positives, three matched nulls, two
    scope-boundary probes, a seven-point ablation ladder, and the five committed
    BATCH-013 entries as a reproduction fixture. Report the pass rate on each
    arm, the field that produced every FAIL, and the exact number of records the
    goal's screen has examined across all thirteen batches. THIS DRAFT IS A
    DESIGN PROPOSAL. No run has occurred and none is authorized.

  what_this_is_not:
    - Not an ECDLP experiment. No curve, no group, no arithmetic, no algorithm, no attack, and no cost or complexity claim of any kind.
    - Not a candidate mechanism, and not evidence that any admissible mechanism exists. A defect in a screen is a fact about the screen.
    - Not a retraction, revision, contradiction or reopening of any EV-CRYPTO record, any batch disposition, the red-team confirmation RT-20260731-001, or any Coordinator decision.
    - Not a proposal to change GOAL-CRYPTO-001's objective, completion criteria, budget, status or next_action; only the Coordinator may do that (AGENTS.md rule 1).
    - Not a statistical estimate. Six scored items support an existence demonstration and nothing more; no rate produced here may be quoted as a probability.
    - Not a claim that the screening sessions applied the rubric as written; the audit executes the WRITTEN rubric and can measure nothing else.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling:
    tier: toy
    tier_note: >-
      "toy" is used here in its ceiling sense only, as the lowest tier the
      vocabulary offers, because this package produces NO evidence about the
      ECDLP at any scale whatsoever. It is a METHODOLOGICAL MEASUREMENT of a
      document-scoring procedure. Recording it at toy rather than inventing an
      off-vocabulary tier string is deliberate: this session's scouting reports
      that 76 of 229 evidence records use off-vocabulary tiers and that
      tools/validate_ledger.py skips the ceiling check when the string is not in
      {toy, medium, crypto}, so an invented tier would silently disable the very
      check that keeps this package honest.
    exact_scope_a_run_could_support: >-
      The measured verdicts of ONE written rubric on ONE frozen eight-item
      blinded set plus one seven-point ablation ladder, scored by two independent
      scorers, together with an exact count of records screened across thirteen
      batches. Nothing about the ECDLP, nothing about the literature, nothing
      about any mechanism, and no cost, exponent or security statement. It may
      never be cited in a complexity claim.

  inputs:
    rubric_source: >-
      coordination/goals/GOAL-CRYPTO-001/batches/BATCH-013/tasks/TASK-20260731-001/discovery_readiness_screen.yaml
      -- the six Gate A fields and the seven Gate B fields, transcribed verbatim
      into the frozen scoring rule. If the other twelve batch directories contain
      a DIFFERENT rubric, every version found is recorded and the audit is run
      against the BATCH-013 version with the divergences reported.
    input_set:
      positives:
        - "P1: Pohlig-Hellman on a smooth-order subgroup."
        - "P2: the trace-one / anomalous prime-field curve attack (Smart; Satoh-Araki; Semaev line)."
        - "P3: the MOV / Frey-Ruck pairing transfer at small embedding degree."
      scope_probes:
        - "P4: Gaudry-Semaev-Diem index calculus for E(F_{q^n}), n > 1 -- NOT prime-field."
        - "P5: GHS Weil descent over composite binary fields -- NOT prime-field."
      nulls:
        - "N1: descent through a randomly chosen degree-3 rational map, no rationality or degree condition -- forced FAIL at relation_or_direct_solve_predicate."
        - "N2: a gain stated as a direction with no magnitude -- forced FAIL at falsifiable_claimed_metric_gain_and_direction."
        - "N3: a verbatim re-fingerprint of an already-screened mechanism with the vocabulary changed -- forced FAIL at semantic_distinction_from_prior_CRYPTO_routes."
      ablation_ladder: >-
        P2 with exactly j of its six Gate A fields degraded to the null register,
        j = 0..6, in ONE ordering fixed and committed before scoring. Seven
        points.
      baseline_fixture: >-
        The five entries BATCH-013 actually screened (eprint-2024-1923,
        eprint-2026-280, eprint-2026-106, eprint-2026-1244,
        classical-priors-reaffirmed), re-scored from their recorded fingerprints.
    fingerprint_authoring_rule: >-
      Each positive's fingerprint is written from a PRIMARY STATEMENT of the
      mechanism obtained in Stage 0, and its faithfulness is confirmed by a
      reviewer who is not the author. All three positives are RECALLED, NOT
      READ, at the time this contract is written; a positive that cannot be
      substantiated is DROPPED, and if fewer than two survive the audit is
      reported BLOCKED ON SOURCE ACCESS rather than run underpowered.
    blinding_rule: >-
      All proper nouns, author names, dates, venues, citations and identifiers
      are removed. Items are relabelled I1..I8 by a seeded permutation and
      presented as an unordered list. The unblinding key is written to a file
      whose sha256 is committed BEFORE the first verdict is written.
    master_seed: 8815034
    domain: "EXP-CRYPTO-e78afb/v1"
    seed_derivation_rule: >-
      permutation = Fisher-Yates over the 8 items using the byte stream
      sha256(utf8(domain + "|perm|" + decimal(counter))), counter advancing once
      per drawn byte, big-endian unsigned interpretation, rejection-sampled to
      avoid modulo bias. The ablation field ordering is drawn by the same rule
      with label "ablate". Both permutations are recorded, so a third party
      reproduces the presentation exactly.
    scorers: >-
      Two independent scorers, neither of whom authored the input set. Under this
      harness "independent" means separate sessions with no shared transcript;
      the resolved model identity is recorded and, if both resolve to the same
      model, that fact is recorded as a limitation on independence rather than
      concealed (AGENTS.md model policy; the goal-closure-quorum note records the
      same one-backend condition).
    environment_measured_this_session: >-
      python3 3.11.15; numpy 2.4.6 imports; sympy and sage do not. Recorded for
      completeness only -- THIS CONTRACT REQUIRES NO CODE AND NO DEPENDENCY.

  stages:
    - id: S0
      name: "Corpus read and sourcing (reading, zero compute)"
      terminating: true
      description: >-
        Open all thirteen batch directories; extract every screen, verdict,
        checked-record list and coverage block; count the total distinct records
        screened. Obtain a primary statement for each planted positive.
        TERMINATES THE RUN if a committed PASS verdict is found anywhere in the
        thirteen batches -- the sensitivity question is then already answered by
        committed data and the audit reports that instead of manufacturing it.
        Also terminates if fewer than two positives can be substantiated.
    - id: S1
      name: "Freeze (writing, zero compute)"
      terminating: false
      description: >-
        Write the input set; transcribe the scoring rule verbatim; commit by hash
        the unblinding key, the permutations, the per-null forced failing field,
        and the ablation field ordering. Nothing may be added or edited after
        this stage.
    - id: S2
      name: "Baseline fixture (scoring, zero compute)"
      terminating: true
      description: >-
        Re-score the five committed BATCH-013 entries. TERMINATES THE RUN if
        agreement is below 5 of 5: the audit would be executing a different
        rubric than the campaign did, and no comparison with the thirteen
        batches would be admissible.
    - id: S3
      name: "Null arm, scored and committed FIRST"
      terminating: true
      description: >-
        Score N1, N2, N3. Commit the verdicts and their field attributions by
        hash before the positive arm is opened. TERMINATES THE RUN if a null
        passes -- that finding is complete on its own.
    - id: S4
      name: "Positive arm and scope probes"
      terminating: false
    - id: S5
      name: "Ablation ladder, j = 0..6"
      terminating: false
    - id: S6
      name: "Unblinding, identification-rate report, and write-up"
      terminating: false
  cheapest_decisive_stage: >-
    S0. Reading thirteen already-committed directories can end the entire audit
    at zero cost if a PASS verdict already exists. S2 is the next decisive gate
    and S3 the next. The ordering S0..S6 is part of the contract and may not be
    reordered; in particular the positive arm may never precede the null arm.

  arms_and_controls:
    treatment: >-
      The three planted positives P1, P2, P3, scored blind at Gate A and Gate B.
    positive_control: >-
      THE PLANTED POSITIVES ARE THEMSELVES THE POSITIVE CONTROL. Forced value
      3 of 3 PASS at Gate A, derived from the six-field list before any scoring.
      THE EFFECT MUST APPEAR HERE. If it does not, no negative conclusion about
      the literature may be drawn from any of the thirteen batches, and the
      audit's report must say exactly that rather than softening it.
    measured_null: >-
      N1, N2, N3 -- same six fields, same register of language, same
      specificity, no mathematical content. Forced value 0 of 3 PASSES, WITH
      ATTRIBUTION TO THREE DISTINCT PRE-ASSIGNED FIELDS. The null can genuinely
      fail: a passing null means the screen is a rubber stamp, and a 0/3 with
      the wrong attribution means the screen rejects for reasons other than the
      fields it names. Both are reported as findings, not as successes.
    graded_control: >-
      THE ABLATION LADDER, seven interior points j = 0..6 on P2 in a committed
      field ordering. Required shape: PASS at j = 0, FAIL at j = 6, monotone, no
      return to PASS. Report the flip index. Non-monotonicity refutes HEUR-SCR-1
      and shows the committed gate description is incomplete, which localizes the
      defect to a field instead of leaving "the screen is strict".
    nearby_object_control: >-
      P4 and P5 -- genuine mechanisms that beat generic baselines on their
      classes but are NOT prime-field, so the CORRECT verdict is a SCOPE
      rejection. Required: their FAIL must be attributed to target_dependence and
      NOT to relation_or_direct_solve_predicate, i.e. distinguishable from a
      null's FAIL. This is the arm on which the audit's own thesis can be
      embarrassed, and it is included for that reason: if the rubric separates
      scope from content cleanly, it is a better instrument than H-CRYPTO-f5cf88
      supposes, and the report says so.
    baseline_reproduction_control: >-
      The five committed BATCH-013 entries, re-scored. Required 5 of 5 exact
      agreement including recorded per-field reasons where recorded.
    ordering_control: >-
      Baseline fixture, then nulls, then positives, then ablation. Each arm's
      verdicts are hash-committed before the next arm is opened. If the scoring
      rule emits the same label on the null arm and the positive arm, it
      discriminates nothing and must be rewritten before the ablation ladder is
      run.
    blinding_control: >-
      Seeded permutation, hash-committed key, and a POST-HOC IDENTIFICATION-RATE
      report from each scorer. A rate at or above 0.5 downgrades the sensitivity
      figure to a rubric-plus-scorer measurement; it does not suppress the
      result and it may not be omitted.
    inter_scorer_control: >-
      Two independent scorers on the full set. Majority disagreement means the
      rubric is not an instrument, and that finding REPLACES the sensitivity
      measurement rather than blocking it.
    comparability_policy: >-
      No comparison to any other goal's screening artifacts, and no comparison of
      these verdicts to the campaign's verdicts beyond the five-item fixture. A
      cross-goal screen comparison requires a separately registered comparator
      contract.

  independent_variables:
    - the arm (positive / null / scope probe / fixture)
    - the number of degraded fields j, for the ablation ladder
    - the gate (A or B)
    - the scorer

  metrics:
    primary:
      - "Gate A pass rate on P1-P3 (forced 3/3) and on N1-N3 (forced 0/3), with per-item field attribution for every FAIL."
      - "Gate B pass rate on P1-P3 (forced 0/3) with per-item field attribution, classified as artifact-demanding or mechanism-describing."
      - "Baseline fixture agreement with the five committed BATCH-013 verdicts (required 5/5)."
      - "Ablation ladder verdicts j = 0..6 with monotonicity verdict and flip index."
    secondary:
      - "Total distinct records screened across all thirteen batches, with per-batch breakdown from the committed coverage blocks."
      - "Scope-probe attribution: whether P4/P5 fail at target_dependence and are distinguishable from nulls."
      - "Inter-scorer agreement rate, item by item."
      - "Post-hoc identification rate per scorer on the eight blinded items."
      - "Whether Gate A has been pointed at inputs/h100_session/ by any batch (expected: no), recorded as a coverage observation."

  heuristic_under_test: HEUR-SCR-1

  preregistered_prediction:
    quantity: >-
      Gate A pass rate on positives; Gate A pass rate and field attribution on
      nulls; Gate B pass rate on positives; ablation monotonicity and flip index;
      baseline fixture agreement.
    formula: >-
      Derived from the committed field lists, not from a model. Gate A's six
      fields are all properties OF A MECHANISM and are readable off any faithful
      description, so a faithful positive fills all six -> PASS. Gate B's seven
      fields demand ARTIFACTS produced only by implementing the mechanism, and no
      literature record carries them -> FAIL. Each null is constructed to leave
      exactly one Gate A field unfillable -> FAIL at that field.
    source: >-
      coordination/goals/GOAL-CRYPTO-001/batches/BATCH-013/tasks/TASK-20260731-001/discovery_readiness_screen.yaml,
      read in full in the ideation session that produced this contract. This is
      the only source underlying the prediction, and it is a committed
      repository artifact rather than a citation.
    values_registered_before_execution: >-
      Gate A on positives: 3/3 PASS. Gate A on nulls: 0/3 PASS, failing at
      relation_or_direct_solve_predicate (N1),
      falsifiable_claimed_metric_gain_and_direction (N2) and
      semantic_distinction_from_prior_CRYPTO_routes (N3) respectively. Gate B on
      positives: 0/3 PASS, every FAIL at an artifact-demanding field. Ablation:
      PASS at j = 0, FAIL at j = 6, monotone. Fixture: 5/5. Records screened
      total: NO VALUE PREDICTED -- twelve of thirteen batch directories were
      listed and not opened in the originating session, and guessing the number
      would be fabrication.

  scale_relevance:
    tier: toy
    justification: >-
      There is no scale axis here at all -- the object is a document-scoring
      procedure, not a mathematical structure, so nothing transfers across scale
      because nothing is being scaled. The measurement is exact at the only size
      that exists: the committed rubric and the frozen input set. This is stated
      rather than left implicit so that no reader infers a scaling argument.
    correspondence: null

  tail_checks:
    - "Both scorers re-score the three nulls after unblinding; a verdict that changes on unblinding is reported as a blinding failure for that item."
    - "Check that the ablation flip index is consistent with the null attributions: the field whose degradation flips the verdict earliest should be among the fields the nulls were built to violate. An inconsistency indicates the rubric's effective and written structures differ."
    - "Check that no two items with identical six-field status received different verdicts (a direct HEUR-SCR-1 falsifier)."

  replication:
    seeds: [8815034]
    independent_instances: 2
    independent_instances_note: >-
      Two independent scorers over the identical frozen set. This is the only
      replication available: there is one rubric and one input set, and
      re-drawing the input set would be a different experiment.

  budget:
    wall_clock_seconds_per_run: 18000
    total_cpu_hours: 0
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    compute: "zero -- reading and scoring only; no code is executed"
    network: >-
      Required only in S0 to substantiate the three planted positives. If
      unavailable, unsubstantiated positives are DROPPED and, if fewer than two
      remain, the audit is reported BLOCKED ON SOURCE ACCESS.

  stopping_rules:
    - Do not execute unless this contract is separately reviewed, approved, frozen, archived and explicitly authorized. It is review_required and carries no approved_by field.
    - Stop at S0 and report if a committed PASS verdict is found in any of the thirteen batches.
    - Stop at S0 and report BLOCKED if fewer than two planted positives can be substantiated from primary sources.
    - Stop at S2 if baseline fixture agreement is below 5 of 5.
    - Stop at S3 if any null passes Gate A; that finding is complete on its own.
    - Stop and report if the two scorers disagree on a majority of items; the rubric is not an instrument and that replaces the measurement.
    - Stop at the wall-clock ceiling and report the stage reached.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any item added, edited or withdrawn after S1's freeze hash is written.
    - The positive arm scored, viewed or discussed before the null arm's verdicts are hash-committed.
    - The unblinding key opened before the last verdict is written.
    - A scorer who authored any part of the input set.
    - Any per-null forced failing field assigned or revised after a verdict is seen.
    - A scoring rule that departs from the committed rubric text; any interpretive gap must be recorded as an underdetermination finding rather than resolved by invention.
    - Any edit to any existing repository record; this package writes only under its own task directory.

  success_criterion: >-
    This draft has NO current success outcome because it is not authorized for
    execution. If a separately approved, frozen successor is executed, its only
    positive disposition is a COMPLETE MEASUREMENT: the five-item fixture
    reproduces 5/5; the null arm is scored and committed before the positive arm;
    every arm's verdicts and field attributions are recorded; the ablation ladder
    is reported with its monotonicity verdict; the identification rate and
    inter-scorer agreement are reported; and the thirteen-batch screened-record
    count is stated with its breakdown. NOTE THAT COMPLETENESS, NOT DIRECTION, IS
    THE SUCCESS CONDITION: an outcome of 3/3 positives passing (the screen is
    sound) and an outcome of 0/3 (the screen is insensitive) are BOTH successful
    runs of this contract, and the contract is written so that neither is a
    disappointment.

  falsification_criterion: >-
    H-CRYPTO-f5cf88 is falsified conjunct by conjunct: S1 by any planted positive
    failing Gate A; S2 by any null passing Gate A, or by a 0/3 whose field
    attribution does not match the three pre-assigned fields; S3 by any planted
    positive PASSING Gate B, or by a Gate B failure attributed to a
    mechanism-describing rather than an artifact-demanding field. A baseline
    fixture failure, a blocked source, or a scorer-independence failure falsifies
    NOTHING -- it invalidates or scopes the measurement, and an infrastructure or
    access failure is never negative evidence (AGENTS.md rule 5).

  outcomes:
    no_execution_authorization: >-
      THE ONLY CURRENT DISPOSITION: review_required draft; no run, no scoring, no
      evidence, no statement about the screen.
    screen_validated: >-
      Positives pass Gate A, nulls fail with correct attribution, ladder
      monotone. The instrument is demonstrably sensitive and specific and the
      thirteen dispositions are STRENGTHENED. Reported as a positive result about
      the campaign.
    screen_insensitive: >-
      A planted positive fails Gate A. The dispositions are SCOPED to "no
      candidate visible to this screen". No disposition is retracted, no checked
      record is implied admissible, and no closure is reopened. The report MUST
      carry the exact tested scope, the field that produced the failure, and the
      two named successors: restructure Gate B so a Gate-A-pass with an artifact
      gap routes to an implementation task, and point Gate A at the unscreened
      internal reservoir in inputs/h100_session/.
    rubber_stamp: >-
      A null passes Gate A. The screen was not filtering on that axis; reported
      with the field that let it through.
    rubric_underdetermined: >-
      Scorers disagree on a majority of items. The committed rubric is not an
      instrument; this finding replaces the sensitivity measurement and is itself
      a first-class result about the goal's committed artifacts.
    infrastructure_or_source_failure: >-
      Unavailable network or unobtainable primary statements are SOURCE-ACCESS
      SIGNALS, never negative evidence about the screen, about the literature, or
      about H-CRYPTO-f5cf88 (AGENTS.md rule 5).

  required_artifacts:
    - Frozen approved specification and a freeze receipt binding its sha256.
    - The frozen input set, the committed permutations, the committed unblinding key hash, and the committed per-null forced-field assignments, all timestamped before the first verdict.
    - Stage 0 notes: every batch directory opened, every screen found, every coverage block, the running count, and the substantiation status of each planted positive.
    - Baseline fixture scoring sheet with the five committed verdicts alongside the re-scored verdicts.
    - Null-arm scoring sheet with its pre-commitment hash and timestamp, written before the positive arm was opened.
    - Positive-arm, scope-probe and ablation scoring sheets, per scorer.
    - Unblinding record, identification-rate report, and inter-scorer agreement table.
    - Manifest with environment, resolved model identity per scorer, session independence status, timings, and validity status with reason.
    - The final report, containing the exact tested scope, the field attribution of every FAIL, and, if the outcome is negative, the two named successors.

  approval_requirements:
    - Independent review confirms the input set is fair, the null attributions are derived from the rubric text and not from expected verdicts, the ordering and blinding controls are enforceable, and the stop rules are complete.
    - A reviewer who did not author the input set confirms each positive fingerprint is faithful to its primary source.
    - Coordinator separately approves and freezes a successor contract without editing this draft.
    - Explicit execution authorization is granted after the approved frozen package is delivered.
  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved, and only the Coordinator may approve (AGENTS.md rule 1).
