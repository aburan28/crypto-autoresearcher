experiment:
  id: EXP-AEADC-4db1f5
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-3b00b0; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-3b00b0
  question_id: RQ-AEADC-8db132
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Enumerate a twelve-cell generic-composition matrix on a 4-bit miniature AEAD and decide six
    finite predicates per composition by exhaustion, with witnesses, against a pre-registered table
    and a random-function null column
  objective: 'The one uncertainty a run reduces is whether the routing choices of a generic AEAD composition
    -- ordering, nonce placement, associated-data placement -- separate finite, decidable predicates
    at a size where the answer is exhaustive rather than argued. Concretely: (i) how many of the six
    declared predicates take different answers across the twelve compositions, and which routing move
    flips each, since a predicate that never flips has separated nothing and a predicate that flips
    at a single move has located the routing decision it depends on; (ii) do the decided answers agree
    with the table derived by hand and pre-registered before the enumerator exists, since a disagreement
    falsifies a composition argument and is the highest-value outcome available; (iii) is the table
    a composition property, established by requiring the random-function null column to show exactly
    the answers pure counting forces, the degenerate positive control to yield its witness, and the
    real-primitive column to be identical to the ideal-permutation column. A run therefore returns
    either a separating table with witnesses, or the measured fact that a 4-bit miniature cannot separate
    the matrix, which fixes the size at which the next attempt must be made.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for the twelve declared miniature
      compositions at 4-bit block width, over all keys, nonces, associated data of at most two blocks
      and messages of at most two blocks, the six declared predicates were decided with the reported
      answers and the listed minimal witnesses, and the null and control columns behaved as reported.
      What does NOT follow: nothing about any security notion, since the six predicates are finite
      shadows and not the notions; nothing about AES-GCM, ChaCha20-Poly1305, CCM or any named construction;
      no attack, break or security consequence of any kind; no guidance about which composition is
      preferable, which this record explicitly declines to give; and nothing about compositions, widths
      or input lengths outside the enumerated space.'
  inputs:
    procedure: 'STAGE 0, zero compute, days of human effort: fix the routing notation, enumerate the
      twelve compositions, state the six predicates with explicit quantifier order, and derive the
      expected table by hand; hash the file. STAGE 1, minutes: implement the seeded 4-bit keyed permutation
      and keyed authenticator and validate them. STAGE 2, hours of human effort: implement one routing
      interpreter so that all twelve compositions are data rather than code, and validate round-trip
      decryption for every composition on the entire input space. STAGE 3, tens of minutes: enumerate
      the full input space per composition and store all outputs. STAGE 4, minutes: decide the six
      predicates per composition by direct search, emitting minimal witnesses. STAGE 5, minutes: run
      the random-function null column and the degenerate positive control through the identical decision
      code. STAGE 6, minutes: rerun one column with a pinned real primitive and diff. STAGE 7, zero
      compute: emit the decided table, the disagreement count against pre-registration, the per-predicate
      flip moves and both control columns into an immutable run record via harness/runner.py.'
    instrument: 'Python 3, standard library only: a seeded lazily-sampled keyed permutation on 4-bit
      blocks, a seeded keyed authenticator on 4-bit blocks, one routing interpreter consuming declared
      routing data, an exhaustive enumerator, and a predicate decision module written against the
      stage-0 quantifier statements. A pinned pure-Python block cipher restricted to 4-bit blocks
      by a declared reduction supplies the real-primitive column, with its reduction recorded. Manifest
      emission and seeding through harness/runner.py, following harness/ctrl_valueshuffle.py. No Sage,
      no solver, no network.'
    parameters: 'Block width 4 bits. Key space 16 values. Nonce space 16 values. Associated data of
      0, 1 or 2 blocks over all values. Messages of 1 or 2 blocks over all values. Twelve compositions:
      three orderings crossed with four nonce-and-associated-data routings. Six predicates. One random-function
      null column. One degenerate positive control. One real-primitive column at the encrypt-then-authenticate
      ordering with the base routing. Full input space per composition is at most 2^20 tuples, enumerated
      completely.'
  controls:
  - Random-function null column with predicate answers predicted from pure counting before the run.
  - Degenerate positive control whose authenticator ignores the nonce, which must yield a witness
    for the nonce-independence predicate.
  - Pre-registered hand-derived table, hashed before any code runs.
  - Shared routing interpreter, so all twelve compositions run identical code differing only in declared
    routing data.
  - Real-primitive column, diffed against the ideal-permutation column.
  - 'Round-trip validation: every composition must decrypt correctly on all enumerated inputs before
    predicates are decided.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two arms in the same invocation, sharing the identical decision code.
    NULL ARM: a random-function composition, in which the twelve routings are replaced by a single
    seeded random map from the whole input tuple to the output, which has no composition structure
    at all; every predicate must be decided against it, and its column must show exactly the answers
    that pure counting predicts -- coincidences appear at the rate the input and output sizes force
    and nowhere else. If any predicate returns an answer for the null that differs from its counting
    prediction, the decision procedure is reading something other than the composition. POSITIVE CONTROL:
    one deliberately degenerate composition whose authenticator ignores the nonce entirely, which
    must return a witness for the nonce-independence predicate; if it does not, the search cannot
    find witnesses and every exhaustive absence in the table is uninformative.'
  independent_variables:
  - composition ordering
  - nonce routing
  - associated-data routing
  - predicate
  - primitive slot occupant
  metrics:
    primary:
    - decided answer per cell across the seventy-two cells
    - minimal witness per failing cell, emitted as bytes
    - count of cells disagreeing with the pre-registered table
    - number of predicates separating at least two compositions
    - routing move at which each predicate first flips
    secondary:
    - null-column answers against their pure-counting predictions
    - positive-control witness presence
    - count of cells moving between primitive columns
    - round-trip decryption failures per composition
    - enumeration wall-clock and stored table size per composition
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The predicate answers of the random-function null column, and the round-trip correctness
      of every composition.
    formula: For the null column, with input tuple space of size N and output space of size M, the
      expected number of colliding input pairs under a uniformly random map is N(N-1)/(2M), so the
      output-coincidence predicate is predicted to answer yes whenever N exceeds M and the expected
      count exceeds one, and no otherwise; the nonce-independence predicate is predicted to answer
      yes with probability 1 minus (1 minus 1/M) raised to the number of nonce-varying pairs, evaluated
      exactly in stage 0. Round-trip correctness is predicted to hold for all enumerated inputs in
      every one of the twelve compositions, without exception, and a single failure voids that composition's
      column.
    source: Pre-registered in the parent proposal IDEA-20260816-3b00b0 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'A 4-bit miniature with at most two-block inputs is chosen as the largest instantiation
      whose entire input space can be enumerated for all twelve compositions in one run, so every
      predicate answer is exhaustive rather than sampled. The transfer assumption is stated and refused:
      routing structure is combinatorial and the twelve compositions would be defined identically
      at any width, but a predicate answer at 4 bits is a statement at 4 bits, and this contract projects
      nothing to larger widths. The known width artifact -- coincidences forced by the input space
      exceeding the output space -- is measured directly by the null column and reported per predicate,
      so a reader can tell which cells are composition effects and which are counting effects.'
    correspondence: null
  tail_checks:
  - Cells answering yes are checked for witnesses that differ only in an unused coordinate, which
    would be a degenerate witness and is reported separately.
  - Compositions with zero-length associated data are checked separately, since the empty case is
    where routing differences are most likely to collapse.
  - Predicates answering no are re-decided with the input bound reduced by one block, which must still
    answer no, confirming the answer is not an artifact of the bound.
  - The largest input tuples are checked for enumeration truncation.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report the decision procedure invalid if the degenerate positive control returns no witness.
  - Halt if any composition fails round-trip decryption on the enumerated space.
  - Cap total enumeration at four core-hours; report compositions completed by name and list any incomplete
    column as missing rather than as an answer.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: A completed seventy-two-cell table in which every composition passes round-trip
    decryption, the positive control yields its witness, the null column matches its counting predictions,
    and at least three predicates take different answers across at least two compositions with minimal
    witnesses recorded.
  falsification_criterion:
  - All six predicates return identical answers across all twelve compositions, meaning the miniature
    separates nothing.
  - The positive control returns no witness.
  - The null column departs from its pure-counting predictions.
  - A composition fails round-trip decryption.
  - Cells move between the ideal-permutation and real-primitive columns.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-3b00b0
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The six predicates are described in prose and must be written with explicit quantifier order and
    an agreed input bound before approval, since ambiguous quantifiers make cells decidable two ways.
  - The four nonce-and-associated-data routings are named as a count, not enumerated; the Coordinator
    must fix them, and an omitted routing makes the matrix silently incomplete.
  - The reduction that restricts a real block cipher to 4-bit blocks for the primitive column is asserted
    and must be specified, since a poor reduction would manufacture a spurious column difference.
  - No argument is given that 4 bits is the right width rather than the merely affordable one; the
    uniformity falsification condition is the only protection against it being too small.
