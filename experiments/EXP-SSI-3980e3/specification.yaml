experiment:
  id: EXP-SSI-3980e3
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-SSI-bdc41f
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  source_proposal: IDEA-20260805-d66193
  title: >-
    Quantifier-order and input-encoding adjudication of two 2026 endomorphism-ring
    complexity claims, with a same-paper compatibility null and a synthetic inconsistent
    positive control, and a dated sourced baseline sentence as the floor deliverable

  objective: >-
    If separately approved, frozen and authorized, rewrite two 2026 complexity claims about
    supersingular endomorphism-ring recovery with explicit quantifier prefixes, place each on
    a declared five-rung ladder of input encodings, and report the rung. The claims differ by
    an exponential factor (p^{1/3+o(1)} versus a relayed poly(log p)) and this goal's entire
    matched baseline depends on which is about which input. The floor deliverable, produced
    in every outcome including a total network failure, is a dated and sourced baseline
    sentence for the supersingular endomorphism problem, carrying its conditionality
    verbatim, to replace KN-OPEN-013's 2026-07-23 snapshot.

  what_this_is_not:
    - Not a computation, not a measurement, not an implementation, not an attack.
    - >-
      NOT AN ASSESSMENT OF WHETHER EITHER PAPER IS CORRECT. "The paper is wrong" is NOT AN
      ADMISSIBLE OUTPUT of this contract, in either direction. Only a rung assignment, the
      two control verdicts, the consequence chain's verification status, and the baseline
      sentence are admissible.
    - Not evidence about ePrint 2026/1586, including not evidence that it exists.
    - Not a status change to KN-OPEN-013/014/015, KN-TECH-024/025/028/029/050, H-SSI-001, or the closed orientation lane.
    - >-
      Not a reopening of the orientation lane closed by DEC-20260804-3677f1 / EV-SSI-8aaad0.
      Oriented input appears only as rung G3 of an input ladder, which is a different role
      from a mechanism, and a reviewer may reject even that reuse.
    - Not approval, freezing, execution authorization, a run, an observation, or evidence.
    - Not an operational action of any kind against any deployed or candidate scheme.

  claim_ceiling: >-
    TIER derivation. A completed run could support, at most: a rung assignment on a declared
    ladder for two theorem statements, two control verdicts, a binary verification status for
    one recalled reduction, and a dated sourced baseline sentence. It could NOT support any
    statement about the truth of either claim, any complexity bound, any exponent, any
    measurement, or any security conclusion. A branch-B outcome (see outcomes) is NOT a
    result of this contract: it is a TRIGGER for independent `review-breakthrough` review at
    max effort under AGENTS.md rule 12, a tier this contract does not provide and does not
    claim.

  environment_check_performed_at_design_time:
    measured_in_this_session_outside_the_harness: true
    numpy: "2.4.6 present"
    sympy: "absent"
    sage: "absent"
    consequence: >-
      Irrelevant: this contract performs no computation. Stages 0, 2 and 3 need neither
      network nor compute; stage 1 needs one HTTP GET. The executor re-records the checks in
      the manifest regardless.

  inputs:
    claim_1_source: >-
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md -- FROZEN IN-REPO AND READ IN FULL AT
      DESIGN TIME. Sections 1, 1.1, 1.3, 1.4, 1.5 and 4.1 are the transcription source.
      Externally identified by the 2026-08-05 sweep as ePrint 2026/1486; that identification
      is RELAYED and nothing in this contract depends on it.
    claim_2_source: >-
      ePrint 2026/1586 -- NOT READ, NOT FETCHED AT DESIGN TIME. Everything about it is
      RELAYED from the 2026-08-05 scouting brief, which itself labels the item ABSTRACT ONLY
      and states the body was not read. Stage 1 attempts the ABSTRACT page only. The brief
      records (RELAYED, to be re-established in-harness) that ePrint abstract pages return
      HTTP 200 while `eprint.iacr.org/YYYY/NNNN.pdf` returns 403.
    ladder_of_input_encodings:
      G1: "j(E) alone, E a uniformly random supersingular curve over F_{p^2}."
      G2: "j(E) together with one non-scalar endomorphism in efficient representation."
      G3: "j(E) together with an orientation by an order of small discriminant."
      G4: "an abstract maximal order O in B_{p,infinity}, with the promise that O = End(E) for some E."
      G5: "a special curve: j = 1728, a curve of known CM, or an F_p-rational curve."
      off_ladder: >-
        PERMITTED AND REQUIRED TO BE AVAILABLE. If the source's hypotheses match none of
        G1-G5, a sixth rung is declared and described rather than forcing a fit. Forcing a fit
        is an invalidation.
    provenance_label_vocabulary: [READ, ABSTRACT_ONLY, RELAYED, RECALLED_UNVERIFIED, NOT_OBTAINED]
    master_seed: null
    seed_note: >-
      NO RANDOMNESS. The only stochastic element in the design is the ORDER in which the two
      control pairs are presented to the auditing agent (see blinding_control), which is fixed
      by a declared constant order rather than a seed so that the package is reproducible
      exactly.

  arms_and_controls:
    treatment: >-
      Rewrite CLAIM-1 and CLAIM-2 with explicit forall/exists prefixes and an explicit input
      alphabet; assign each a rung; apply the fork of H-SSI-bdc41f.
    measured_null: >-
      NULL OBJECT OF THE SAME SHAPE, forced verdict derived pre-run, CAN FAIL: Theorem 1.1
      (complexity p^{1/3+o(1)}) versus Theorem 1.5 (every supersingular E admits an isogeny
      to E^{(p)} of degree at most (p/2)^{1/3}) OF THE SAME, READ PAPER. FORCED VERDICT:
      COMPATIBLE, because Theorem 1.5 bounds a DEGREE for every curve while Theorem 1.1
      bounds a RUNNING TIME, and they quantify over different objects. THIS NULL CAN GENUINELY
      FAIL: the two statements share the exponent 1/3, share the objects E and E^{(p)}, and
      conflating a degree bound with a time bound is the exact error available to a careless
      procedure. If the procedure returns INCONSISTENT here it manufactures contradictions
      and NOTHING ELSE MAY BE REPORTED.
    positive_control: >-
      THE INSTRUMENT MUST FIRE: the synthetic pair
      P1 = "End(E) is computable in poly(log p) for all supersingular E/F_{p^2} given j(E)"
      P2 = "the supersingular isogeny problem requires p^{1/3-o(1)}".
      REQUIRED VERDICT: INCONSISTENT, with the connecting-ideal + KLPT reduction named as the
      reason. If the procedure returns COMPATIBLE here it cannot detect a real contradiction,
      the instrument is blind, and no verdict from the treatment arm is admissible.
    baseline_embedding_control: >-
      Rung G2 is the slice where the two claims MUST agree: the READ paper's own algorithm
      outputs a non-scalar endomorphism (section 1.4, "the composition [phi-hat] o phi is an
      endomorphism of E"), and from such an endomorphism the full ring is recoverable by
      standard means. A procedure that reports the claims as contradictory at G2 has failed
      its own baseline embedding and is halted.
    graded_control: >-
      Report a contentiousness verdict at EVERY rung G1-G5, not only at the assigned rung.
      Five points, three interior. PRE-REGISTERED: the verdict sequence is MONOTONE in the
      amount given -- more given cannot make a poly(log p) claim more contentious. A
      non-monotone sequence means the procedure is not responding to the amount given and its
      rung assignment is uninterpretable.
    ordering_control: >-
      Stage 0 -- the ladder, the observation collision, the consequence chain, and BOTH
      control verdicts -- is written and HASH-COMMITTED BEFORE any network fetch. The fork
      therefore cannot be tuned to whatever the abstract says.
    blinding_control: >-
      The two control pairs are presented to the auditing agent WITHOUT labels indicating
      which is the null and which is the positive control, in the fixed order
      (positive-control pair, null pair), and the agent records a verdict for each before the
      labels are revealed. This is a weak blind and is declared as such: the pairs are
      distinguishable on inspection by anyone who has read this contract, so the control
      guards against carelessness, not against motivated reasoning.
    provenance_control: >-
      EVERY SENTENCE of the output carries exactly one provenance label from the declared
      vocabulary. An unlabelled sentence is an INTEGRITY FAILURE of the package, not a
      stylistic lapse.
    comparability_policy: >-
      No number from this contract may be compared to any number in any other experiment
      without a separately registered comparator contract. This contract produces no numbers
      other than transcribed exponents.

  independent_variables:
    - rung (G1..G5, plus a declared off-ladder rung)
    - statement (CLAIM-1 / CLAIM-2 / null pair / positive-control pair)
    - stage (0 offline / 1 networked / 2 offline / 3 offline-or-networked)

  metrics:
    primary:
      - given_level: the assigned rung for CLAIM-2, with the verbatim hypothesis sentence that places it there.
      - null_control_verdict (required COMPATIBLE) with its stated reason.
      - positive_control_verdict (required INCONSISTENT) with the reduction named.
      - >-
        branch: A (input above G1) / B (input is G1) / UNADJUDICATED (stage 1 UNRUN or source
        structurally different from the relay).
    secondary:
      - the verdict at every rung G1-G5 and the monotonicity check.
      - consequence_chain_status: verified / unverified, reported BEFORE the fork is applied.
      - the CLAIM-1 and CLAIM-2 quantifier prefixes as written, each with a provenance label.
      - the observation-collision statement (OBJECT-X versus OBJECT-Y) and whether the statement separates them.
      - the dated sourced baseline sentence.
      - stage-1 HTTP status, URL, and byte count, or the UNRUN record.

  preregistered_prediction:
    quantity: >-
      The rung of the input-encoding ladder at which CLAIM-2's stated hypotheses are
      satisfied, and the joint-consistency verdict that follows.
    formula: >-
      Joint consistency holds if and only if NOT both claims sit at G1, GIVEN the
      connecting-ideal + KLPT polynomial-time reduction (HEUR-QUANT-2). If that reduction is
      unverified, the conclusion weakens from "at most one can hold" to "the two are in
      tension" and the branch-B language is removed from the output.
    source: >-
      Derived in H-SSI-bdc41f mechanism steps (A)-(C). CLAIM-1's prefix is transcribed from
      the READ frozen text. HEUR-QUANT-2 is RECALLED AND UNVERIFIED and NO SOURCE FOR IT WAS
      READ; verifying it is stage 3.
    prior_fixed_before_any_fetch: >-
      G4 (an abstract maximal order is given) is the single most likely rung. G1 is the
      branch-B outcome, whose prior is 0.02 as recorded in IDEA-20260805-d66193. THE
      PREDICTION IS NOT THAT G4 IS RIGHT -- it is that a rung is assignable and that the
      assignment is supported by a quoted hypothesis sentence. An audit that names a rung
      without quoting the sentence that places it there has not produced its deliverable.

  scale_relevance:
    tier: derivation
    justification: >-
      The audit is about statements, not about instances, so scale does not enter and no
      transfer question arises. What DOES transfer, and is the reason the contract exists, is
      the baseline: this goal's matched baseline for the supersingular endomorphism problem is
      a cryptographic-scale quantity, and it is currently pinned by a 2026-07-23 snapshot in
      KN-OPEN-013 that the frozen in-repo input already postdates. A dated sentence is a
      derivation, not a measurement, and is labelled so.
    correspondence: null

  tail_checks:
    - >-
      CLAIM-1's transcription must carry ALL of: the exponent p^{1/3+o(1)}, the equal memory
      cost, the Las Vegas character, Heuristic 1 verbatim (including
      u = log(p/2)/(3 log B) and the uniformity range
      (log p)^eps < u < (log p)^{1-eps}), the superpolynomial o(1) disclosure, and the
      affected/safe scope lists. A transcription missing any of these is incomplete.
    - >-
      The baseline sentence must be REJECTED by review if it presents p^{1/3+o(1)} as
      unconditional. Presenting a heuristic-conditional result as unconditional is forbidden
      by docs/target-result-profile.md and is an invalidation here.
    - >-
      The affected/safe scope lists must be transcribed verbatim, including the paper's own
      statement that CSIDH and all group-action constructions are "safe from the attack"
      because "other cryptanalytic algorithms dominate the security analysis of these
      schemes" -- because that sentence bounds what any branch-B outcome would and would not
      imply.

  replication:
    seeds: []
    independent_instances: 1
    interpretation: >-
      Replication here means a SECOND AGENT independently performing the rung assignment from
      the same transcribed statements WITHOUT sight of the first agent's verdict. Agreement is
      the replication; re-reading the same file by the same agent is not. If the two agents
      assign different rungs, THE DISAGREEMENT IS THE RESULT and is reported as such rather
      than adjudicated by a third pass.

  budget:
    wall_clock_seconds_per_run: 21600
    total_cpu_hours: 0.05
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    no_network: false
    network_scope: >-
      Stage 1 only: a single HTTP GET to the ePrint ABSTRACT page for 2026/1586. The PDF
      endpoint is NOT to be fetched (the brief records it as 403 and repeated attempts are
      not a research activity). Stages 0, 2, 3 are offline except that stage 3 MAY attempt one
      retrieval for HEUR-QUANT-2's source.

  stages_cheapest_first:
    - >-
      STAGE 0 (zero compute, ZERO NETWORK, AND IT ALONE PRODUCES THE FLOOR DELIVERABLE):
      transcribe CLAIM-1 with explicit quantifiers from the frozen in-repo text; build the
      G1-G5 ladder with a verdict at each rung; state the observation collision; derive the
      consequence chain and label HEUR-QUANT-2 RECALLED; run the null and positive controls;
      write the dated baseline sentence. Hash-commit all of it. THIS IS THE STAGE THAT CAN
      TERMINATE THE RUN: if either control fails, the package stops here and reports the
      instrument failure.
    - >-
      STAGE 1 (network, ~1 hour, MAY REPORT UNRUN): fetch the ABSTRACT page for ePrint
      2026/1586 and transcribe its theorem statement verbatim with its "given". Record HTTP
      status, URL and byte count. On failure, record UNRUN under AGENTS.md rule 5.
    - >-
      STAGE 2 (zero compute): place CLAIM-2 on the ladder, apply the fork, and write the
      branch. If stage 1 is UNRUN, the branch is UNADJUDICATED and stage 0's output stands
      unchanged.
    - >-
      STAGE 3 (zero compute, one optional retrieval): confirm or refute HEUR-QUANT-2 against
      KN-TECH-025 / KN-TECH-028 or a primary source, and adjust the fork's stated strength
      accordingly.

  stopping_rules:
    - >-
      Do not execute unless this contract is separately reviewed, approved, frozen, archived
      and explicitly authorized. It is `review_required` and carries no approved_by.
    - Stop at stage 0 if the null control returns INCONSISTENT or the positive control returns COMPATIBLE.
    - Stop at stage 0 if the G2 baseline-embedding control reports the claims as contradictory there.
    - Do not fetch the PDF endpoint. Do not retry stage 1 more than three times.
    - >-
      Stop at stage 2 and record UNADJUDICATED rather than assigning a rung from the relay if
      stage 1 is UNRUN. Assigning a rung from the relay is an invalidation.
    - >-
      If the branch is B, STOP. Write the trigger record and route to independent
      `review-breakthrough` at max under AGENTS.md rule 12. This contract performs no further
      analysis and draws no conclusion in that case.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any output sentence lacking a provenance label.
    - Any rung assigned without a quoted hypothesis sentence supporting it.
    - Any rung assigned from the relay rather than from a fetched source.
    - Any output containing the sentence "the paper is wrong", or any equivalent, in either direction.
    - Any statement presented as established about ePrint 2026/1586 while its status is RELAYED or NOT_OBTAINED.
    - Any baseline sentence that drops Heuristic 1's conditionality or the superpolynomial o(1) disclosure.
    - Any alteration of the ladder or the fork after stage 1's content is seen.
    - Any operational action, key recovery, or parameter recommendation.

  success_criterion: >-
    This contract has NO current success outcome because it is not authorized for execution;
    its only current disposition is `review_required`. IF a separately approved, frozen and
    authorized successor is executed, its single positive disposition is: the null control
    returns COMPATIBLE with its reason stated; the positive control returns INCONSISTENT with
    the reduction named; the G2 baseline embedding holds; a verdict is recorded at every rung
    G1-G5 and the sequence is monotone; HEUR-QUANT-2's verification status is reported BEFORE
    the fork is applied; a rung (or a declared off-ladder rung) is assigned to CLAIM-2 with a
    quoted supporting sentence, OR the branch is recorded UNADJUDICATED with stage 1's UNRUN
    reason; a second agent's independent rung assignment is recorded and agrees or is reported
    as a disagreement; and the dated sourced baseline sentence is produced WITH its
    conditionality. THAT DISPOSITION ESTABLISHES A STATEMENT-LEVEL AUDIT AND A DATED BASELINE
    AND NOTHING ELSE -- no measurement, no attack, no exponent, no security claim, and no
    fact about either paper's correctness.

  falsification_criterion: >-
    The audit's method is falsified if the null control returns INCONSISTENT on the
    same-paper pair, or the positive control returns COMPATIBLE on the synthetic pair, or the
    rung verdicts are non-monotone in the amount given -- in any of which cases the
    instrument is broken and no verdict is admissible in either direction. H-SSI-bdc41f's
    fork is weakened (not falsified) if HEUR-QUANT-2 cannot be verified. The record's premise
    is falsified if stage 1 finds that ePrint 2026/1586 does not exist or is structurally
    different from the relay, in which case the ladder is applied to whatever is actually
    there and the relay is recorded as inaccurate.

  outcomes:
    no_execution_authorization: >-
      The only current disposition. A review_required draft; no run, no evidence, no
      conclusion.
    branch_A_input_above_G1: >-
      The claims are compatible and the reconciliation is located in the input. This is NOT a
      closure of anything: it produces a NEW, precisely stated open problem -- produce the
      G-level input cheaply for uniformly random j, or prove it cannot be produced -- and that
      forward guidance is MANDATORY in the output (inventor protocol section 4). Reporting
      branch A without it means the audit has not finished.
    branch_B_input_is_G1: >-
      NOT A RESULT OF THIS CONTRACT. It is a TRIGGER: the package stops, writes a trigger
      record, and routes to independent `review-breakthrough` review at max effort under
      AGENTS.md rule 12, which may not be degraded and which this session does not provide.
      No conclusion, no parameter recommendation, and no operational action follows from this
      contract.
    unadjudicated: >-
      Stage 1 UNRUN. The structural deliverable (ladder, collision, consequence chain, both
      controls, dated baseline sentence) stands; the specific claim is recorded UNADJUDICATED
      and is NEVER recorded as refuted.
    infrastructure_or_integrity_failure: >-
      A network failure, a 403, a missing page, or a tooling failure is an INFRASTRUCTURE
      OUTCOME under AGENTS.md rule 5. It is reported as infrastructure signal and is NEVER
      negative mathematical evidence against H-SSI-bdc41f, against either paper, or against
      any proposition about isogeny hardness.

  required_artifacts_if_later_authorized:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - >-
      Stage 0's complete output -- ladder, per-rung verdicts, observation collision,
      consequence chain, both control verdicts, baseline sentence -- hash-committed with a
      timestamp strictly preceding any network activity.
    - CLAIM-1's verbatim transcription with section references and a provenance label.
    - >-
      Stage 1's fetch log: URL, HTTP status, byte count, timestamp, and either the verbatim
      abstract or an UNRUN record naming what was attempted.
    - The rung assignment with its quoted supporting sentence, or the UNADJUDICATED record.
    - The second agent's independent rung assignment, recorded without sight of the first.
    - HEUR-QUANT-2's verification status and the source consulted, or a record that none was obtained.
    - The dated sourced baseline sentence with its conditionality and scope lists.
    - A provenance audit confirming every output sentence carries a label.
    - Command, git commit and dirty state, environment and versions, stdout, stderr, timings.
    - Snapshot archive followed by independent validation and red-team review.

  approval_requirements:
    - >-
      Independent review confirms that "the paper is wrong" is structurally unavailable as an
      output and that only rung assignments, control verdicts, a chain status and a baseline
      sentence can be produced.
    - >-
      Independent review confirms that the null control can genuinely fail, i.e. that a
      careless procedure would plausibly flag Theorem 1.1 against Theorem 1.5.
    - >-
      Independent review confirms the branch-B stopping rule routes to rule-12 review and
      draws no conclusion.
    - >-
      Independent review confirms that the orientation-lane closure is respected: G3 appears
      only as an input rung and no oriented mechanism is proposed.
    - Coordinator separately approves and freezes a contract without editing this draft.
    - User separately authorizes execution after receiving the approved frozen package.

  approval_status: >-
    Pending review. No `approved_by` field is present because this contract is not approved,
    and only the Coordinator may approve it (AGENTS.md rule 1).

  assigned_to: executor
