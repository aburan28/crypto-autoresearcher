# EXP-BINSTD-5c7cb9
# Ceiling binomials, weights, and the factor-m gap. No search.
# Approved by DEC-20261002-d21f44.
experiment:
  id: EXP-BINSTD-5c7cb9
  hypothesis_id: H-BINSTD-46f3dd
  source_idea: IDEA-20260922-c2bbe6
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Ceiling binomials and the factor-m rate gap
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-d21f44
  objective: >-
    Count unordered subsets at the two written ceilings. Compare the
    raw powers with the divided quotients. Check weights, addition
    counts, component yields, and the factor-m cross-multiplication.
    Reject the power quotient as a subset count.
  inputs:
    cells:
      - m: 3
        B: 200
        binomial: 19900
        power: 40000
        factorial_m_minus_1: 2
        power_quotient: 20000
        power_minus_binomial: 100
        weight: 4
        additions: 1
        factorial_m: 6
        field_power: 8000000
        field_power_remainder: 2
        rate_times_B: 4000000
        scaled_product: 24000000
        unscaled_cross: 8000000
      - m: 4
        B: 40
        binomial: 9880
        power: 64000
        factorial_m_minus_1: 6
        power_quotient_floor: 10666
        power_remainder: 4
        weight: 6
        additions: 2
        factorial_m: 24
        field_power: 2560000
        field_power_remainder: 16
        identity_product: 61440000
    comparisons:
      raw_m4_exceeds_raw_m3: true
      divided_m4_below_20000: true
      binomial_gap: 10020
      quotient_gap_numerator: 28000
      quotient_gap_above_9333: true
      quotient_gap_below_9334: true
      excess_numerator: 2360
      excess_above_786: true
      excess_below_787: true
    components:
      - {k: 1, relations: 0}
      - {k: 2, relations: 1}
      - {k: 5, relations: 4}
  controls:
    - >-
      Reporting the m = 3 subset count as 20000 is false. That report
      invalidates the run.
    - >-
      Reporting 64000 divisible by 6, or the divided m = 4 quotient at
      least 20000, is false. Either report invalidates the run.
    - >-
      Reporting weight 2 at m = 3, or 2 point additions at m = 3, is
      false. Either report invalidates the run.
    - >-
      Reporting that a size-1 component yields a relation is false.
      That report invalidates the run.
    - >-
      Reporting 4000000*6 equal to 8000000 is false. That report
      invalidates the run.
    - Two integer routes. They must not import each other.
  independent_variables:
    - ceiling
    - route in {binomial, repeat_module}
  metrics:
    primary:
      - binomials
      - weights
      - additions
      - component_yields
      - factor_m_bits
      - power_quotient_rejected_as_subset_count
      - implementations_agree
    secondary:
      - quotient_gap_bracket
      - excess_bracket
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Two binomials, two weights, three component yields, and the factor-m bits.
    formula: >-
      The subset count is the binomial C(B, m-1). The raw power is
      B**(m-1). Weight is 2*(m-1). Additions are m-2. A component of
      size k yields k-1 relations. The product of the m = 3 power
      quotient and B, multiplied by m!, equals m times B**m. Compare
      by cross-multiplication, not by floating point.
    source: >-
      IDEA-20260922-c2bbe6 ceilings, weight, addition count, and rate
      formulas, read 2026-10-02. The integers were recomputed in this
      design session. That computation is not a run. The power
      quotient is not the subset count. No search was run.
  scale_relevance:
    tier: toy
    justification: Integer checks of written ceilings. No transfer to a relation yield.
    correspondence: null
  tail_checks:
    - The m = 4 cell is required. Stopping after m = 3 and still reporting the m = 4 remainder is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other integer route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the m = 3 subset count is reported as 20000, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The m = 3 subset count is reported as 20000.
    - 64000 is reported divisible by 6.
    - Weight 2 is reported at m = 3.
    - Two point additions are reported at m = 3.
    - A size-1 component is reported to yield a relation.
    - 4000000*6 is reported equal to 8000000.
    - A curve search or a relation yield is reported.
  success_criterion: >-
    Both runs agree on both binomials, both raw powers, both weights,
    both addition counts, the three component yields, the m = 4
    remainder 4, the quotient-gap bracket, the excess bracket, and
    the factor-m bits. The m = 3 subset count stays 19900. The scaled
    products match and the unscaled m = 3 comparison stays unequal.
  falsification_criterion: >-
    The runs agree, every invalidator stays rejected, and any
    binomial, weight, yield, remainder, or factor-m bit differs from
    the preregistered table.
  required_artifacts:
    - experiments/EXP-BINSTD-5c7cb9/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-5c7cb9/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-5c7cb9/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-5c7cb9/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-5c7cb9/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-5c7cb9/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any curve search, hash table, or union-find timing.
    - A claim that near misses add relations or that the supply beats rho.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
