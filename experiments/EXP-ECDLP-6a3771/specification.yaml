# EXP-ECDLP-6a3771
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261004-ab4aef.
experiment:
  id: EXP-ECDLP-6a3771
  hypothesis_id: H-ECDLP-89d8bf
  source_idea: IDEA-20261004-0d125e
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-26 table versus width-25 table
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-ab4aef
  objective: >-
    Check the table sizes 33554432 and 16777216, the product 562949953421312, and the nearby gap 0.
  inputs:
    width_hi: 26
    width_lo: 25
    table_hi: 33554432
    table_lo: 16777216
    table_gap: 16777216
    table_product: 562949953421312
    table_sum: 50331648
    nearby_a: 16777216
    nearby_b: 16777216
    nearby_gap: 0
    nearby_product: 281474976710656
  controls:
    - >-
      Two to the power 25 is 33554432. Two to the power 24 is 16777216.
      Reporting both tables as size 16777216 drops the gap and invalidates
      the run.
    - >-
      Thirty-three million five hundred fifty-four thousand four hundred
      thirty-two exceeds sixteen million seven hundred seventy-seven
      thousand two hundred sixteen by 16777216. The product of the two
      sizes is 562949953421312. Their sum is 50331648.
    - >-
      Two width-25 tables each store 16777216. Their gap is 0 and their
      product is 281474976710656.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-26 table stores 33554432 entries. The width-25 table stores
      16777216. The gap of two width-25 tables is 0.
    formula: >-
      Compute 2 to the power 25. Compute 2 to the power 24. Subtract
      16777216 from 33554432. Multiply 33554432 by 16777216. Subtract 16777216 from 16777216.
    source: >-
      IDEA-20261004-0d125e states the widths 26 and 25 and the sizes
      33554432 and 16777216, read 2026-10-04. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 562949953421312 and the nearby gap 0 are required. A check that stops at the size 33554432 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 33554432 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 25 is not 33554432.
    - Two to the power 24 is not 16777216.
    - The gap is not 16777216.
    - The product is not 562949953421312.
    - Both tables are reported as size 16777216, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-26 table stores 33554432 entries, that
    the width-25 table stores 16777216, and that 33554432 exceeds 16777216 by 16777216.
  falsification_criterion: >-
    The runs agree that the width-26 table size is computed, and
    that size is not 33554432.
  required_artifacts:
    - experiments/EXP-ECDLP-6a3771/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-6a3771/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-6a3771/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-6a3771/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-6a3771/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-6a3771/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 16777216 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
