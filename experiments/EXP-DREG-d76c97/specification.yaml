experiment:
  id: EXP-DREG-d76c97
  hypothesis_id: H-DREG-45c58f
  question_id: RQ-DREG-c8ae8d
  proposal_id: IDEA-20260922-221a70
  version: 1
  title: >-
    One odd-prime ell-isogeny: rebuilt Semaev new_falls versus the cleared
    degree-ell pullback
  status: approved
  objective: >-
    On the first ordinary short-Weierstrass edge the frozen search accepts,
    assign exactly one of the labels M, C, N, or U by comparing new_falls
    supports of the domain system E, the rebuilt codomain system (R), and
    the cleared pullback (P). The pre-registered prediction is label M,
    including cleared degree ratios equal to ell. This is an identity and
    profile check on one toy edge. It is not a class census.
  inputs:
    normative_definitions: this file, section frozen_protocol
    field: >-
      Odd prime p. Short Weierstrass y^2 = x^3 + a*x + b over F_p.
      Require b*(4*a^3 + 27*b^2) != 0. This product also skips the locus
      b = 0. Ordinary means the trace t = p + 1 - point_count(E) satisfies
      t != 0 mod p.
    search: >-
      Deterministic, fixed before any degree is computed, and not retuned
      after degrees are seen. Primes in increasing order from 101 through
      211 inclusive. For each prime, a from 0 through p-1, and for each a,
      b from 0 through p-1. Skip curves that fail the product test or the
      ordinary test. For each remaining curve, try ell = 3, then ell = 5,
      then ell = 2. The first tuple that passes the edge gates is the edge.
      Do not replace it if a degree ratio is later not ell. If no tuple
      passes by p = 211 inclusive, the label is U with reason no-edge, and
      the run stops. Do not continue to a larger prime.
    corrected_kernel_condition: >-
      The kernel is cyclic of order ell and is generated by an F_p-rational
      point, so ell divides the point count. IDEA-20260922-221a70 says "ell
      coprime to the group order". That phrase is impossible for this kernel
      and is not the gate. Let N_E be the largest prime factor of the point
      count. The gate is gcd(ell, N_E) = 1, so phi is an isomorphism on a
      subgroup of order N_E. Record both the point count and N_E.
  controls:
    - id: GAUGE
      description: >-
        One frozen scalar u = 2 in F_p. It is not 1. Scale E by the standard
        change x = u^2 x', y = u^3 y', giving a_g = a*u^{-4} and
        b_g = b*u^{-6}, same j. Rebuild the same factor-base system on that
        model and record its new_falls vector at degrees 1 through 6. The
        gauge is not allowed to change the label by itself. If its new_falls
        vector differs from E, or its summation certificate fails, the label
        is U with reason gauge, and M, C, and N are not assigned.
    - id: RANDOM-MAP
      description: >-
        One rational map of the same bidegree as the reduced f/g, coefficients
        from random.Random(20260922), rejected once if it equals f/g, then
        kept. Record whether the ordered triple of cleared total degrees
        matches (P). A match means the pattern is degree arithmetic, not
        isogeny structure. The match does not by itself assign C, and it
        does not change M, N, or U.
    - id: HOMOMORPHISM
      description: >-
        phi of the kernel generator is the point at infinity. phi(P+Q) =
        phi(P)+phi(Q) on the frozen rational point set. The codomain point
        count equals the domain point count. The reduced x-map has degree
        ell. Failure of this gate means that candidate is not an edge.
        Exhausting the search is label U with reason no-edge.
  independent_variables:
    - which presentation is ranked, among E, (R), and (P)
    - the total degree D inside that presentation's cap
  metrics:
    primary:
      - outcome_label, exactly one of M, C, N, U
      - >-
        for each of the three generators, source total degree, cleared total
        degree, and whether the cleared degree equals ell times the source degree
      - whether the positive new_falls supports satisfy the M set equalities
    secondary:
      - p, a, b, ell, codomain a', b', point count, N_E, and trace
      - new_falls(D), falls(D), and the three ranks at every required degree
      - d_ff and d_lf_obs for E, for (R), and for (P), or none
      - whether the gauge vector equals E
      - whether the random map's cleared degree triple equals (P)
      - which scaled degrees ell*D lie above the cap of (P)
  heuristic_under_test: >-
    HEUR-45c58f-H2 is the degree-ratio identity under test, not a theorem.
    HEUR-45c58f-H1 is the cap-tracking claim. This contract records d_lf_obs
    and does not compute a solving degree, so it cannot confirm or refute H1
    by an elimination.
  preregistered_prediction:
    quantity: >-
      The outcome label of the first accepted edge, and the three cleared
      generator degree ratios
    formula: >-
      Label M. For every generator, cleared total degree = ell * source total
      degree. Positive new_falls support of (R) = support of E. Positive
      new_falls support of (P) = {ell*D : D in the support of E and ell*D <= D_max_P}.
    source: >-
      H-DREG-45c58f. The ratio identity is HEUR-45c58f-H2, restated from
      IDEA-20260922-221a70 and checked here, not taken from an opened paper.
      The new_falls identity is restated in frozen_protocol from
      IDEA-20260916-4b7c1e. The prediction is written before any run and is
      not adjusted afterward.
  scale_relevance:
    tier: toy
    justification: >-
      One ordinary curve over a prime from 101 through 211, summation
      polynomials in two variables, caps 6 and at most 12. There is no
      transfer to a cryptographic prime. A toy label is not an ECDLP exponent.
    correspondence: null
  tail_checks:
    - >-
      A new_falls value of 0 at every finished degree inside a cap is not a
      report that new_falls is 0 above that cap. State this separately for
      E, for (R), and for (P).
    - >-
      d_lf_obs is the maximum finished degree inside the cap with new_falls
      strictly positive, or none. It is a lower bound inside the cap. It is
      not a last-fall theorem and not a claim about degrees above the cap.
    - >-
      If some D in the positive support of E has ell*D above D_max_P, that
      scaled degree is listed as unmeasured. It is not imputed, and it is
      not treated as a zero.
  replication:
    seeds:
      - 20260922
    independent_instances: 1
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - >-
      Stop when the first tuple passes the edge gates, then compute degrees
      and ranks only for that edge, its gauge, and its one random map.
    - >-
      Stop with label U and reason no-edge if p = 211 is passed with no
      accepted tuple. Do not search a larger prime.
    - >-
      Do not replace the accepted edge because a degree ratio is not ell or
      because the label is not M.
    - One protocol execution. maximum_runs is 1.
  invalidation_rules:
    - >-
      A required matrix does not return an exact full-column rank. Label U
      with reason unfinished. Do not impute a large degree.
    - >-
      falls(D) or new_falls(D) is negative on E, (R), (P), or the gauge.
      Label U with reason negative. That is an instrument failure, not a drop.
    - >-
      Subset-column ranks are not admissible. A run that reports them is
      label U with reason subset-rank, not evidence.
    - >-
      The gauge new_falls vector differs from E, or the gauge summation
      certificate fails. Label U with reason gauge. Do not assign M, C, or N.
    - >-
      The summation certificate fails on E or on (R) for the accepted edge.
      Label U with reason summation-certificate. Do not read the ranks.
    - >-
      No point of order ell is found on a curve whose point count is divisible
      by ell. Label U with reason point-search, and stop. The search is
      exhaustive, so a miss is an instrument failure.
    - >-
      A candidate fails the homomorphism gate, the point-count match, the
      codomain product test, or the degree-ell test of f/g. That candidate
      is not an edge. Continue the search.
    - >-
      Generator total degrees are recorded before any rank is computed. Ranks
      computed before that degree table exists are not admissible, and the
      label is U with reason degree-table-order.
    - Label U is neither success nor falsification.
  success_criterion: >-
    The label is M, every cleared generator total degree equals ell times
    the source total degree, the gauge new_falls vector equals the vector
    of E, and every required matrix on E, (R), (P), and the gauge finished.
  falsification_criterion: >-
    Falsification is label C, or label N, or a recorded generator degree
    table on an accepted edge in which at least one cleared total degree is
    not ell times the source total degree. That degree-table case withdraws
    HEUR-45c58f-H2 even when a later rank step assigns label U. Label U with
    reason unmatched and every cleared ratio equal to ell falsifies nothing
    about the ideals. Label U with no accepted degree table, including
    no-edge, point-search, and a summation-certificate failure before degrees
    are recorded, is neither success nor falsification.
  required_artifacts:
    - experiments/EXP-DREG-d76c97/runs/<RUN-ID>/metrics.json
    - experiments/EXP-DREG-d76c97/runs/<RUN-ID>/report.md
    - experiments/EXP-DREG-d76c97/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-DREG-d76c97/runs/<RUN-ID>/certificates.json
  assigned_to: executor
  approved_by: coordinator
  claim_ceiling:
    tier: toy
    forbids:
      - an ECDLP exponent
      - equating new_falls with degree of regularity
      - equating d_lf_obs with the HKPY last-fall degree
      - treating an unfinished matrix as evidence that a degree is large
      - a class-census conclusion from this one edge
      - a new factor base

frozen_protocol:
  id: PROTOCOL-EXP-DREG-d76c97-v1
  not_the_characteristic_2_ladder: >-
    EXP-DREG-dd668d, EXP-DREG-ab3fee, EXP-DREG-6de989, and EXP-DREG-c3e8c9
    freeze a characteristic-2 F_4 boolean ladder for RQ-DREG-d7b6d6. This
    contract does not use that ladder, that field, boolean Weil descent,
    grevlex solving degree, or a random enrichment of a graph ideal. The
    meter here is new_falls on an odd-prime short-Weierstrass model.
  edge_gates:
    - The product b*(4*a^3 + 27*b^2) is nonzero, and the trace is not 0 mod p.
    - ell is 3, 5, or 2, tried in that order, and ell divides the point count.
    - N_E is the largest prime factor of the point count, and gcd(ell, N_E) = 1.
    - >-
      The kernel generator is the first affine point in lex order of (x, y),
      with x then y in 0..p-1, such that ell times the point is infinity and
      the point is not infinity. Ell prime makes that the order.
    - >-
      The codomain is short Weierstrass over the same field, its product test
      passes, and its point count equals the domain point count.
    - >-
      phi of the kernel generator is infinity. On the frozen point set, phi
      preserves addition. The frozen point set is every rational point when
      the point count is at most 16, otherwise infinity first and then the
      first 15 affine points in the same lex order, for 16 points in all.
      Check every ordered pair from that set.
    - >-
      The implementation outputs f, g in F_p[T] with g monic, gcd(f, g) = 1,
      and x(phi(Q)) = f(x(Q))/g(x(Q)) for every affine rational Q outside
      the kernel. The degree max(deg f, deg g) equals ell.
  presentations:
    ring: F_p[x1, x2]
    h: 3
    generators:
      - S_3(x1, x2, x_R), with x_R a field element
      - x1^h - 1
      - x2^h - 1
    x_R_rule: >-
      x_R = 2 when 2 is not a root of T^h - 1. Otherwise x_R is the smallest
      integer in 0..p-1 that is not a root. The same rule, hence the same
      element, is used on E, on (R), and on the gauge.
    summation_polynomial: >-
      Build S_3 by elimination from the chord-and-tangent group law on the
      stated short-Weierstrass model. Do not treat an unchecked closed form
      as the definition. Certify vanishing on relation triples, and certify
      that the polynomial is not the zero polynomial.
    relation_triples: >-
      Points are ordered with infinity first, then affine points by
      increasing x and then increasing y, as integers in 0..p-1. A relation
      pair (P, Q) has P, Q, and P+Q all affine, and the third x-coordinate
      is the x-coordinate of -(P+Q). If the point count is at most 40, test
      every such pair. If the point count is greater than 40, test the first
      20 pairs in that enumeration. Fewer than 20 pairs when the point count
      is greater than 40 is label U with reason summation-certificate.
      The same rule applies to E, to (R) on the codomain, and to the gauge.
    nonzero_check: >-
      In lex order of (i, j, k) in 0..p-1, evaluate S_3 until a nonzero value
      appears. If none appears, S_3 is the zero polynomial and the certificate
      fails.
    rebuilt_R: >-
      (R) uses the codomain coefficients (a', b'), the same h, the same x_R
      rule, and the same three generator shapes. It is not the pullback.
    pullback_P: >-
      Substitute x |-> f/g into each generator F of E. With d1 and d2 the
      partial degrees of F in x1 and x2, the cleared polynomial is
      sum c_ij * f(x1)^i * g(x1)^{d1-i} * f(x2)^j * g(x2)^{d2-j}.
      Do not divide out a nonconstant common factor. Record the total degree
      of each cleared polynomial before any rank. The ratio test is integer
      equality of that total degree with ell times the source total degree.
      The zero polynomial and a source of total degree 0 make the ratio fail.
      Spot-check the clearing identity at the five smallest field elements
      where g is nonzero, or at all such elements if fewer than five exist.
  new_falls:
    source: >-
      Restated from IDEA-20260916-4b7c1e so this contract does not depend on
      that idea being approved. Rows of M_D are m*f_i for monomials m with
      deg(m*f_i) <= D. Columns are all monomials of total degree <= D.
    definitions:
      - >-
        falls(D) = rank(M_D) - rank(M_D restricted to the columns of total
        degree exactly D).
      - >-
        new_falls(D) = falls(D) - rank(M_{D-1}), and rank(M_0) = 0. No
        degree-0 matrix is built.
      - >-
        new_falls(D) < 0, or falls(D) < 0, is an instrument failure. Label U.
        It is not a drop.
      - d_ff = min { D : new_falls(D) > 0 }, or none.
      - >-
        d_lf_obs = max { D <= D_max : new_falls(D) > 0 }, or none. It is a
        lower bound inside the cap, not a last-fall theorem, and not the
        HKPY last-fall degree.
    caps:
      D_max_E: 6
      D_max_R: 6
      D_max_gauge: 6
      D_max_P: min(ell*6, 12)
    required_degrees: every integer D from 1 through that presentation's cap
    column_listing: >-
      List columns by increasing total degree, and within a degree by grevlex
      with x1 > x2. The ranks use the full column set and the exact-degree
      column set. Order inside a degree is not a scientific variable. This
      grevlex listing is not a grevlex solving-degree computation.
    unfinished: >-
      If any required matrix on E, (R), (P), or the gauge does not return its
      exact rank, the label is U for the whole edge. Do not impute a large
      degree. Degrees above a cap are not required matrices. They stay
      unmeasured.
  supports:
    S_of: '{ D in 1..D_max : new_falls(D) > 0 }'
    in_cap_scaled_E: '{ ell*D : D in S(E) and ell*D <= D_max_P }'
    scaled_P: >-
      The set of D/ell for D in S(P). Equality with S(R) holds only when
      every D in S(P) is divisible by ell and the image set equals S(R).
  label_precedence:
    - >-
      U first, with these reasons in order: no-edge; point-search;
      summation-certificate; unfinished; negative; subset-rank;
      degree-table-order; gauge; random-map degree table missing. Any one
      of them assigns U and stops the label rule. M, C, and N are not assigned.
    - >-
      Else M, if all three of the following hold. S(R) equals S(E). S(P)
      equals the in-cap ell-scaled support of E. Every cleared generator
      total degree equals ell times the source total degree.
    - >-
      Else C, if (P) still equals that in-cap ell-scaled support, and at
      least one drop holds. A drop holds only when both d_lf_obs(R) and
      d_lf_obs(E) are integers and the first is strictly smaller, or both
      d_ff values are integers and d_ff(R) is strictly smaller. If either
      side is none, that comparison is false.
    - >-
      Else N, if the positive-fall set of (R) equals S(P) after dividing by
      ell, in the sense of scaled_P above. N is the label when the ratio
      test failed, or when the sets meet only after scaling and not under
      M's stricter equalities. If M's two set equalities and the ratio test
      all hold, the label is M, not N, even though scaling would also match.
    - >-
      Else U with reason unmatched. The matrices finished and the supports
      fit none of M, C, or N. This U falsifies nothing about the ideals.
  random_map_draw:
    generator: random.Random(20260922) from CPython, method randrange only
    shape: >-
      Numerator coefficients of degrees 0 through deg(f)-1 are randrange(p).
      The leading numerator coefficient is randrange(1, p). Denominator
      coefficients of degrees 0 through deg(g)-1 are randrange(p). The
      denominator leading coefficient is 1. Draw numerator low to high, then
      denominator low to high.
    rejection: >-
      Reduce by making the denominator monic and removing a constant unit
      content, then compare with f/g. If they are equal, draw once more with
      the same generator state and keep the second draw even if it also
      equals f/g. Do not reject a third time.
    comparison: >-
      Clear denominators in the same way as (P), without a rank. Record
      whether the ordered triple of total degrees equals the triple for (P).
  group_law: >-
    Affine chord and tangent on y^2 = x^3 + A*x + B. Infinity is the
    identity. (x, y) + (x, -y) is infinity. For a doubling with y != 0,
    lambda = (3*x^2 + A) * (2*y)^{-1}. For distinct x-coordinates,
    lambda = (y2 - y1) * (x2 - x1)^{-1}. Then x3 = lambda^2 - x1 - x2 and
    y3 = lambda*(x1 - x3) - y1. A point with y = 0 has order 2.
  not_this_experiment:
    - a class census, or a claim about outcomes O1, O2, or O3
    - a syzygy witness for a fall
    - the characteristic-2 boolean ladder and its grevlex solving degree
    - a rerun of DEC-20260716-003 as the primary result
    - a new factor base
    - an ECDLP exponent, or a walk charged against Pollard rho
