    totals: >-
      Budgeted wall-clock about 3100 seconds (52 minutes) at tau = 40 ns;
      about 1700 seconds at 20 ns; the 7200-second envelope breaks near 105
      ns (110.6 ns with the pilot figures). Measured pilot projection at tau
      = 14 ns: about 17 minutes. Budgeted total CPU about 8000 core-seconds.
      Peak memory about 2 GB in the heavy trials (declared per-process
      address-space guards memory_mb 2048 / 4096 / 4096 / 4096 / 8192 / 8192
      / 8192 / 2048 for t1 to t8); peak_rss_bytes in a manifest is the
      per-process maximum, not summed over workers.
    dependency_semantics: >-
      A failed or unresolved t2 or t3 prevents t4 to t7 (and t8). A failed
      t4 to t7 prevents t8. No trial is rerun until its result looks
      favourable; a retry needs a new immutable run id and additive
      authorization.
