  manifest_fields: >-
    Each manifest.yaml records the exact command, git commit, environment
    (python, numpy, sympy or gmpy2 versions, cpu count, memory), seeds used,
    per-stage timings (including measured seconds per triple), and
    peak_rss_bytes. Each raw-result.json holds the per-member records (arm,
    cell, member index, p, A, B, N, a, b, t, d, twisted, p mod 120, B_size,
    T, coverage counts of the member base and of all 200 random bases, M0
    loop counters, histogram recount integers, window width, scan ratios,
    label checks), the control results, and the instance-list sha256. The
    post-run report, graph and PDF required by the research-visuals skill
    are produced after t8 by the run skill from these records; they are not
    trial artifacts.
  stopping_rules:
    - >-
      Stop after exactly one valid manifest and raw-result.json for each of the
      eight run ids. No ninth run, no extra cell, no extra members, no extra
      random bases and no larger N is added after any observation.
    - >-
      A failed gate (t2 or t3) stops the plan: dependent trials are not
      launched, and the recorded fact is "instrument failed", not a negative
      mathematical result.
    - >-
      If the sieve gives M_c < 8 the cell is UNDERPOWERED; the cell is never
      enlarged, merged (except by the pre-registered rule P1), or
      resampled to reach 8.
    - >-
      A timeout, crash or implementation failure is infrastructure signal;
      it is not a result, it is not retried silently, and a retry uses a new
      run id with the same seeds and parameters.
    - >-
      The planned 2-hour wall clock is advisory: exceeding it does not stop a
      running trial, it is reported. Exceeding 2 hours at the pre-freeze
      check (see cost_model) lowers the C24 top edge before freeze.
  invalidation_rules:
    - "I1 Run count is not 8, a manifest is missing a required field (command, git commit, environment, seeds, timings, peak_rss_bytes), or an artifact is absent or empty."
    - "I2 M0 fails anywhere: a loop counter differing from binomial(B+2,3), a histogram total differing from it, or the histogram nonzero count differing from the seen[] count (integer equality, no tolerance)."
    - "I3 The brute-force counter check shows any difference in any c(r) (60 cases)."
    - "I4 Curve validity: p or N composite, Hasse violated, [N]P != O, a root of f in F_p, wrong twist, FAM formulas p = 5t^2+19t+19 or N = 5t^2+18t+20 violated, j != -96^3 for FAM or N-A, j = -96^3 for N-B, 4p != a^2+19b^2 or b = a+2 for N-A, an N-A or N-B prime outside the cell band or repeated."
    - "I5 Labelling: any [l(Q)]g != Q, or any sampled triple whose point sum differs from [l_i+l_j+l_k]g."
    - "I6 qr_window control: any N-B pool with R_pool outside [1.98, 2.02] or R_wrong outside [0.96, 1.04], the full-period point-count identity failing on any scanned curve, or any lifted y with y^2 != f(x)."
    - "I7 Sensitivity control: fewer than 7 of 8 planted curves detected (rank p = (1+k)/201 <= 0.01, ties against the planted base) in any cell, pooled planted ratio off the known value by more than max(0.10 percent, 3 standard errors), or pooled two-sided planted randomization p > 0.001."
    - "I8 Seed integrity: a duplicated or missing rng stream, a random base with repeated classes, duplicated instances, seeds in a manifest differing from the frozen list, instance-list sha256 differing between trials, or member counts differing from the sieve/quotas."
    - "I9 Raw and summary disagree: the independent recomputation in check.py (coverage of 3 members per arm and cell by a second code path: pure-Python set at C16 and C20, sort-based unique at C24) differs from the recorded coverage, or any table in t8 differs from its recomputation from the raw per-member records."
    - "I10 (flag, reviewer decides, not an automatic void) measured null standard deviation outside 0.75x to 1.33x of 1.4/sqrt(N) in any cell; F_p windows requiring a scan beyond p in the base definition."
    - "I11 Any change to the frozen code, constants or seeds after approval without a protocol_amendment."
  pre_freeze_disclosure:
    purpose: >-
      Plain facts about what was seen before this contract is frozen, so that
      a reviewer can judge what is pre-registered and what is not.
    facts:
      - >-
        The implementer ran trials t2 and t3 end to end on the real frozen
        seeds as a smoke test, in scratch space only. experiments/
        EXP-CMFB-cea1d2/runs/ is empty.
      - >-
        Instrument-gate numbers seen: planted-base detection at C16 was
        exactly 7 of 8 (one curve at rank p 3.5 percent); the C20 pooled
        planted ratio was 1.01091 against the known 1.01247, i.e. 0.156
        percent against a tolerance of 0.173 percent; the measured null
        standard deviation was 2.5 to 3.0 times the draft formula.
      - >-
        Trials t4 to t7 (the measurement trials) were NOT run on the real
        seeds. They were smoke-tested only on shifted seeds (offset 1000,
        K = 20) and on a mini-study at bands 2^14 to 2^18.
      - >-
        The t1 inventory dry run on the real instance list gave FAM members
        C16 = 4, C20 = 10, C24 = 13 (deterministic; instance-list sha256
        38cf55093614d8f8761e392d75e17ae5f0266e50b69b7abd58d6f01c3b2fa314).
        Predicted 3 / 8 / 14; Bateman-Horn with q < 10^5 gives 3.11 / 8.01 /
        14.42. Rule P1 is not applied; C16 is UNDERPOWERED; C20 and C24 are
        powered by member count.
      - >-
        The gate thresholds were NOT changed in response to the seen t3
        numbers. The only quantitative revision after the smoke test is the
        null standard deviation constant, from the draft occupancy value to
        1.4 / sqrt(N), justified by the independent shifted-seed data
        (measured over formula ratio 2.4 to 2.75).
      - >-
        The gate numbers above are therefore known before the official run,
        and the official t3 is deterministic (same seeds, same code): it will
        reproduce them. The planted-ratio tolerance is marginal at C20 on
        these seeds (0.156 percent against 0.173 percent) and the C16
        detection count is exactly at the minimum of 7 of 8; a gate failure
        on rerun is not a surprise and a pass is not independent evidence of
        sensitivity beyond what was already seen.
  implementation_conventions:
    note: >-
      Conventions fixed by the implementation and recorded here so that the
      frozen contract and the code agree. They add no degree of freedom.
    rng:
      label_check_triples: "stream index 203 (labelling check triples)"
      order_test_points: "seed 7008, stream 1 (twist and order test points)"
      shanks_mestre: "seed 7010, stream 0 (N-B order search)"
      n_a_member_indexing: "N-A members are indexed u = 0..h-1 for the uniform stratum and theta = h..2h-1 for the theta stratum, where h is half of the stratum quota"
      bootstrap_and_randomization: >-
        numpy Generator from rng(seed 7006 for bootstrap, 7007 for
        randomization, cell, arm, stream, 0) with stream ids: CI 0, fam_na 1,
        fam_natheta 2, na_nb 3, slope 4
      tie_break: "stream 202 with the member id j"
      brute_force: "SeedSequence([7009, N, B, kind, 0])"
      random_base_recipe: "exactly as in the docstring of count.random_labels"
    instances:
      n_a_theta_stratum: "phi uniform on [acos 0.25, acos 0.20]"
      not_a_family_prime: "p' is not in {5t^2 + 19t + 19 : t odd}"
      pooled_c18_control_band: "(2^14, 2^15]"
      control_curve_disjointness: "N-B-ctrl curves are disjoint from the N-B curves of the same cell"
      twist_list: "squarefree n only, in the same order, with the same first d such that (d/p) = -1"
      instance_draw_cap: "at most 2,000,000 attempts per instance draw loop"
    analysis:
      equal_size_ties: "ties in rank statistics between equal-size items are broken uniformly in member rank p"
      block_length: "the moving-block bootstrap block length is reduced to n when n < 3"
    manifest:
      dirty: "the git dirty flag is computed as in harness/runner.py"
      peak_rss_bytes: "per-process maximum over the trial, not summed over workers"
  claim_ceiling:
    growth_and_power_up_front: >-
      With the realized FAM member counts 4 / 10 / 13 only C20 and C24 can be
      powered (C16 is UNDERPOWERED), and a slope needs at least 3 powered
      cells. So NO slope claim and NO MATERIAL lead is possible in this
      experiment. The most it can deliver is a null at resolution 0.5 percent
      or a sub-threshold level lead in at most two cells.
    ceiling: >-
      Coverage and qr_window scan efficiency of the small-x base for
      crater-type D=-19 curves (family and non-family) and random curves, at
      toy sizes 2^14 < p <= 2^25, m = 3, unsigned multisets, targets uniform
      over Z_N, in the integral charts stated.
    what_follows:
      - >-
        If NULL_AT_RESOLUTION: the exact coverage ratio of the small-x base is
        within +-0.5 percent of a matched random base in the tested arms and
        powered cells, the yield identity holds exactly, and the qr_window
        scan efficiency is 2.0 +- 0.02 on generic curves; the coverage and
        scan-efficiency channels carry no effect above 0.5 percent at those
        sizes for this base and this chart.
      - >-
        If a lead: a distinguishable coverage or scan-efficiency effect of the
        stated size and arm pattern at the stated cells, requiring
        replication; nothing about growth unless 3 powered cells exist.
    what_does_not_follow:
      - "Nothing about the 53-bit pair p = 5947698030651343 (log2 p = 52.4), its crater, its floor, or any prime near that size: the largest cell is 27 bits smaller and there is no growth arm of 3 powered sizes."
      - "Nothing about solver cost, relation rank, linear algebra, descent, or any end-to-end attack cost (the yield is conserved; coverage headroom is bounded by min(1, mean) and the cost gain by 1.582)."
      - "Nothing about other bases (Sidon-type bases reach +10.7 percent in EV-FBG-001), other charts (random isomorphic charts, other models), other m, signed conventions, restricted targets, or the floor curve (End = Z[pi])."
      - "A null is a statement at resolution 0.5 percent, not at zero; the planted control resolves +0.3 to +3.3 percent, not smaller effects."
  unverified_items:
    - >-
      tau (seconds per enumerated triple) with numpy: 40 ns is budgeted; the
      implementer's C20 pilot measured 13.0 to 14.0 ns and the pre-freeze
      inequality passes (see cost_model.pre_freeze_pilot_result); the
      break-even for 2 hours is about 105 to 110 ns.
    - >-
      FAM member counts per cell are a hand Bateman-Horn estimate (local
      factors only for q <= 43); the exact sieve decides. Expected: C16
      about 3 (UNDERPOWERED), C20 about 8 (borderline), C24 about 14. The t1
      dry run gave 4 / 10 / 13 (see pre_freeze_disclosure). Consequence: at
      most 2 powered cells, so no slope claim.
    - >-
      Planted-effect sizes (+3.3, +1.3, +0.5 percent on the control curves,
      +0.3 percent at 2^25) and B, T values in the cost table were computed by hand from the
      Poisson law and exact integer cube roots and must be recomputed by the
      script; B and T were hand-checked at N = 2^18 against EV-FBG-001
      (B = 117, mu = 1.0445 against recorded 1.0436).
    - >-
      The Shanks-Mestre style order search for N-B must be implemented with a
      uniqueness check; the acceptance rate (prime orders about 10 percent)
      and its running time are unmeasured.
    - >-
      Python 3.8+ pow(x, -1, p), numpy int64 products below 2^50 (p <= 2^25),
      availability of a prime-testing helper (sympy or own Miller-Rabin),
      and availability of a C compiler (optional) are assumed, not checked.
    - >-
      The 4-worker multiprocessing determinism (results independent of
      worker count) is by construction of the rng streams but must pass
      parallel.verify_determinism before approval; RLIMIT_AS guards of 4096
      to 8192 MB per process with numpy and 4 workers are unverified; the
      container is assumed to have at least 8 GB RAM and 4 cores.
    - >-
      The path convention by which a later trial reads artifacts of an
      earlier trial (experiments/EXP-CMFB-cea1d2/runs/<RUN-ID>/) versus the
      {run_dir} template of the supervisor: the plan above has later trials
      recompute instances from seeds and only compare sha256; t8 reads the
      earlier run directories by their fixed paths. Verify against
      tools/experiment_execution.py.
    - >-
      The statement that every curve with j = -96^3 over F_p has End = O_K,
      and that E_0 reduces to a curve whose order is N or 5 v^2, is standard
      CM theory (class number one) recalled, not re-derived; the run checks
      the order, trace identity and j per curve.
    - >-
      Whether the integral point (7, 1) of E_0 (f(7) = 1) and any other
      small-x point with f(x) a perfect square create additive relations in
      the base: expected negligible (at most a handful of points among B);
      not measured.
  confounders:
    - "too few FAM members per cell (UNDERPOWERED rule); the family arm cannot be enlarged"
    - "base-size rounding (B is an integer; mu = T/N between 1.00 and 1.07, exact per curve)"
    - "pseudo-replication across t (moving-block bootstrap; randomization test uses independent members)"
    - "p mod small primes and reciprocity of f(x) at small x in the small-integer chart (p mod 120 recorded; exploratory only)"
    - "chart type: twisted FAM and N-A charts have larger integral coefficients than N-B (twisted flag recorded)"
    - "within-cell size mismatch between the family density (upper end) and the log-uniform null arms (mean log2 p reported per arm and cell)"
    - "angle of the Frobenius: FAM sits at a/(2 sqrt p) = 0.2236; controlled by the N-A-theta stratum"
  out_of_scope:
    - "p above 2^25, the cell C28, and any claim about the 53-bit pair, its floor, or the lift to Q."
    - "The floor curve (End = Z[pi]) and any curve of conductor above 1 in the endomorphism-ring sense; N-C other class-number-one discriminants."
    - "Any base other than the small-x liftable window; random isomorphic charts; Montgomery, Edwards and Hessian models; m other than 3."
    - "Solver cost, summation polynomials, relation rank, linear algebra, descent."
    - "Any model call, any network access, and any edit of an existing record."
