      on_positive restates the existing on_null reading (the preregistered
      prediction survives as NULL_AT_RESOLUTION at delta = 0.5 percent).
      on_negative restates the existing on_lead reading and adds deficits.
      The on_lead wording was shortened to point at on_negative; the
      requirement of a growth arm of at least 3 powered cells is kept in
      on_negative.
  not_changed:
