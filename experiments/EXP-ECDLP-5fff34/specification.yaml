# EXP-ECDLP-5fff34
# Digit-count arithmetic. No curve point is added.
# Approved by DEC-20261004-b54e80.
experiment:
  id: EXP-ECDLP-5fff34
  hypothesis_id: H-ECDLP-7a290e
  source_idea: IDEA-20261004-6626fa
  question_id: RQ-ECDLP-002
  version: 1
  title: Doubling count and addition count of the integer 134217727
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-b54e80
  objective: >-
    Check the counts 27, 26, and 26, the product 18252, and the nearby gap 0.
  inputs:
    bit_length: 27
    doublings: 26
    additions: 26
    length_gap: 1
    doubling_gap: 0
    digit_product: 18252
    digit_sum: 79
    nearby_a: 26
    nearby_b: 26
    nearby_gap: 0
    nearby_product: 676
  controls:
    - >-
      The bit length is 27. The doubling count is 26. The addition
      count is 26. Reporting the addition count as 27 drops the gap
      against the bit length and invalidates the run.
    - >-
      Twenty-seven exceeds twenty-six by 1. Twenty-six equals
      twenty-six, so that gap is 0. The product of 27, 26, and 26
      is 18252. Their sum is 79.
    - >-
      Two readings of the addition count are both 26. Their gap is
      0 and their product is 676.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {bits, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - additions
      - implementations_agree
    secondary:
      - digit_product
      - digit_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The integer 134217727 has bit length 27, 26 doublings, and 26
      additions. The gap of two addition counts is 0.
    formula: >-
      Read the bit length 27. Count 26 doublings. Count 26 additions.
      Multiply 27, 26, and 26. Subtract 26 from 26.
    source: >-
      IDEA-20261004-6626fa states the counts 27, 26, and 26, read
      2026-10-04. The gaps, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 18252 and the nearby gap 0 are required. A check that stops at the bit length 27 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the addition count 26 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 27.
    - The doubling count is not 26.
    - The addition count is not 26.
    - The product is not 18252.
    - The addition count is reported as 27, or a curve point is added.
  success_criterion: >-
    Both runs agree that the bit length is 27, that the doubling
    count is 26, that the addition count is 26, and that the product
    of those three counts is 18252.
  falsification_criterion: >-
    The runs agree that the addition count is computed, and that
    count is not 26.
  required_artifacts:
    - experiments/EXP-ECDLP-5fff34/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-5fff34/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-5fff34/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-5fff34/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-5fff34/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-5fff34/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a digit-count gap moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
