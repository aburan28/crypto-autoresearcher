# EXP-BINSTD-475138
# Degree-sum arithmetic. No order is invented.
# Approved by DEC-20261003-796fbd.
experiment:
  id: EXP-BINSTD-475138
  hypothesis_id: H-BINSTD-9080d5
  source_idea: IDEA-20261001-262544
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Five written degrees
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-796fbd
  objective: >-
    Check the sum 1328, the span 192, and the gap product 4194304.
  inputs:
    degree_count: 5
    degree_sum: 1328
    degree_span: 192
    gap_a: 32
    gap_b: 64
    gap_sum: 192
    gap_prod: 4194304
    degree_prod: 1113951567872
    closed_rows: 6
    closed_excess: 1
    run_ceiling: 4
    count_over_runs: 1
    minimum_leave: 1
    rows_left: 4
    fabricated: 0
    count_over_zero: 5
  controls:
    - >-
      The five degrees 176, 208, 272, 304, and 368 sum to 1328.
      Reporting the count as 6, or as 4, drops the count 5 and
      invalidates the run.
    - >-
      368 exceeds 176 by 192. The gaps 32, 64, 32, and 64 sum to
      192 and multiply to 4194304. The product of the five
      degrees is 1113951567872.
    - >-
      Six exceeds five by 1. Five exceeds 4 by 1. The written
      minimum 1 leaves 4. The fabricated count is 0, and five
      exceeds 0 by 5.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {sum, span, gaps}
    - route in {add, subtract}
  metrics:
    primary:
      - degree_sum
      - degree_span
      - gap_prod
      - implementations_agree
    secondary:
      - degree_count
      - degree_prod
      - rows_left
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The five degrees sum to 1328. 368 exceeds 176 by 192. The
      four gaps multiply to 4194304.
    formula: >-
      Add 176, 208, 272, 304, and 368. Subtract 176 from 368.
      Multiply 32, 64, 32, and 64.
    source: >-
      IDEA-20261001-262544 states the five degrees 176, 208,
      272, 304, and 368, the closed-row count 6, the run ceiling
      4, the minimum 1, and the fabricated count 0, read
      2026-10-03. No curve order is named as an integer. The
      sums were recomputed in this design session. That
      computation is not a run. No standard was retrieved.
  scale_relevance:
    tier: toy
    justification: Five written degrees and two written counts. No transfer to a divisibility.
    correspondence: null
  tail_checks:
    - The span 192 and the gap product 4194304 are required. A check that stops at the sum 1328 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the sum 1328 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The sum is not 1328.
    - The span is not 192.
    - The gap product is not 4194304.
    - The count is reported as 6 or as 4, or an order is invented.
  success_criterion: >-
    Both runs agree that the five degrees sum to 1328, that 368
    exceeds 176 by 192, that the four gaps multiply to 4194304,
    and that six exceeds five by 1.
  falsification_criterion: >-
    The runs agree that the five degrees are summed, and that
    sum is not 1328.
  required_artifacts:
    - experiments/EXP-BINSTD-475138/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-475138/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-475138/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-475138/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-475138/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-475138/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any standard retrieval, order invention, or divisibility test.
    - Any claim that a sum of 1328 decides a row.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
