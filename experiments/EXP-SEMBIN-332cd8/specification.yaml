# EXP-SEMBIN-332cd8
# Boolean degrees of S_3 and of x1*S_3 on two toy fields.
# Approved by DEC-20261001-70dcbe.
experiment:
  id: EXP-SEMBIN-332cd8
  hypothesis_id: H-SEMBIN-ce58bc
  source_idea: IDEA-20260913-449d2b
  question_id: RQ-SEMBIN-fa2e3f
  version: 1
  title: Boolean degrees of S_3 and of x1 times S_3
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-70dcbe
  objective: >-
    On F_2^3 and F_2^4, compute the maximum algebraic-normal-form degree
    of the polynomial-basis coordinates of S_3 and of x1*S_3, both with
    three variables and with every constant third argument. Reject a
    three-variable product degree of 4.
  inputs:
    B: 1
    formula: (x1*x2 + x1*x3 + x2*x3)^2 + x1*x2*x3 + B
    fields:
      - {n: 3, modulus_integer: 11, poly_exponents: [3, 1, 0]}
      - {n: 4, modulus_integer: 19, poly_exponents: [4, 1, 0]}
    predicted:
      three_variable_degree: 3
      three_variable_product_degree: 3
      naive_sum_three_variable: 4
      constant_degree: 2
      constant_product_degree: 3
      naive_sum_constant: 3
    basis: polynomial_low_bit_first
  controls:
    - >-
      The three-variable product degree 4 is false. Reporting it
      invalidates the run.
    - >-
      Skipping any constant third argument and still reporting the
      constant-argument degrees invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - n in {3, 4}
    - third argument in {variable, every field element}
    - route in {truth_table, repeat_module}
  metrics:
    primary:
      - three_variable_degree_by_n
      - three_variable_product_degree_by_n
      - constant_degree_by_n_and_z
      - constant_product_degree_by_n_and_z
      - product_degree_4_rejected
      - implementations_agree
    secondary:
      - naive_sums
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Two degrees on the three-variable system and two degrees for every constant.
    formula: >-
      Boolean degree is the largest Hamming weight of a monomial with a
      nonzero algebraic-normal-form coefficient, maximized over the n
      output bits.
    source: >-
      inputs/SEMAEV-2015-310/paper_fulltext.md section 4.5, the degree
      display after the sentence that coordinate Boolean functions of
      S_3 have total degree 3, read 2026-10-01. The degrees were
      recomputed in this design session on both fields and on every
      constant in the n = 3 field plus z in {0, 1, 2} at n = 4. That
      computation is not a run. The frozen table then requires every
      constant at both n. No F4 trace was read.
  scale_relevance:
    tier: toy
    justification: Truth tables of at most 12 bits. No transfer to the paper's n = 12 through 16 tables.
    correspondence: null
  tail_checks:
    - n = 4 is required. Stopping at n = 3 and still reporting the n = 4 degrees is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic module.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the three-variable product degree is reported as 4, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - three_variable_product_degree is 4 on either field.
    - Any constant third argument is omitted.
    - A Groebner basis or a Magma step trace is reported.
  success_criterion: >-
    Both runs agree. On both fields the three-variable degrees are 3 and
    3. For every constant third argument the degrees are 2 and 3. The
    naive sums are 4 and 3. The product degree 4 is rejected.
  falsification_criterion: >-
    The runs agree, the product degree is not 4, every constant was
    tested, and any degree or naive sum differs from the preregistered
    table.
  required_artifacts:
    - experiments/EXP-SEMBIN-332cd8/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-SEMBIN-332cd8/runs/<RUN-ID>/command.txt
    - experiments/EXP-SEMBIN-332cd8/runs/<RUN-ID>/stdout.log
    - experiments/EXP-SEMBIN-332cd8/runs/<RUN-ID>/stderr.log
    - experiments/EXP-SEMBIN-332cd8/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-SEMBIN-332cd8/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Magma F4, Kosters' step degree, and the DREG rank statistic.
    - Assumption 1 at the paper's tabulated n.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
