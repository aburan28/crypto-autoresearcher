experiment:
  id: EXP-ICINV-5a775f
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-c36472
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE T5 REACHABILITY GATE, RE-COSTED AND THEN MEASURED: transporting a specified class member
    is AFFORDABLE at Otilde(p^{1/4}), so T5 does not die on transport cost as DECOMPOSITION.md states
    -- it dies on IDENTIFICATION, which costs h ~ p^{1/2} functional evaluations unless goodness is
    common, locally detectable during an isogeny walk, or predictable from a cheap vertex invariant;
    and the decisive measurement is the one-step autocorrelation of every candidate functional along
    an ell-isogeny walk'
  status: draft
  objective: "(A) THE CORRECTION TO THE COST ACCOUNTING, AND IT CHANGES THE LANE'S CONCLUSION. DECOMPOSITION.md\
    \ T5 states that reaching a SPECIFIED curve is the vectorization problem, \"hard, ~sqrt(h) ~ p^{1/4}\
    \ classically at best\", and concludes \"the lane dies on cost even if the variance is large\"\
    . The second clause does not follow from the first. The baseline this campaign charges against\
    \ is 0.886 sqrt(N) ~ p^{1/2} group operations (KN-TECH-001, KN-TECH-006). A transport cost of\
    \ Otilde(p^{1/4}) is a SQUARE ROOT OF THE BASELINE -- asymptotically free. An attacker who knows\
    \ the address of a good curve can pay p^{1/4} to get there and still be within o(1) of whatever\
    \ the destination costs. THE TRANSPORT COST IS NOT THE BARRIER.\n(B) WHERE THE BARRIER ACTUALLY\
    \ IS. The F_p-isogeny class has h ~ H(t^2 - 4p) ~ sqrt(|D|) ~ p^{1/2} members (the Kronecker class\
    \ number). To find the MINIMISER of a cost functional C over the class by brute force costs h\
    \ evaluations of C, i.e. at least p^{1/2} times the cost of one evaluation -- already at or above\
    \ the rho baseline before a single relation is collected. So the live question is not \"can I\
    \ get there\" but \"can I FIND WHICH ONE without enumerating them all\". Three escape routes exist\
    \ and only three:\n  (R-common) GOODNESS IS COMMON: a constant fraction of the class is within\n\
    \    epsilon of the minimum. Then a random walk of O(log p) small-ell steps\n    (rapid mixing\
    \ of the Cl(O)-Cayley graph under GRH) lands on a good curve\n    with constant probability, and\
    \ the total cost is polylog.\n  (R-local) GOODNESS IS LOCALLY DETECTABLE: C(E') is predictable\
    \ from data\n    computable at the current vertex in time polylog(p) -- e.g. from the\n    number\
    \ of rational ell-isogenies (the volcano level), the rational\n    torsion structure, or C(E)\
    \ itself plus the step. Then hill-climbing\n    works and costs (walk length) x (local test).\n\
    \  (R-address) GOODNESS HAS A CLOSED-FORM ADDRESS: the good curve is\n    identifiable a priori,\
    \ e.g. j = 0 when D_0 = -3. Then transport at\n    Otilde(p^{1/4}) suffices and the gate is PASSED.\n\
    If none of the three holds, the minimiser is unreachable and the lane dies -- on identification,\
    \ not on transport.\n(C) THE FOURTH DIRECTION, WHICH IS FREE AND WHICH THE DECOMPOSITION DOES\
    \ NOT LIST. The reachable set is not only the isogeny class. Applying an F_p-ISOMORPHISM costs\
    \ O(log p) field operations: (a, b) -> (u^4 a, u^6 b) with (x, y) -> (u^2 x, u^3 y). This moves\
    \ the coordinate-defined factor base by a dilation X_E -> u^2 X_E (IDEA-20260807-6eb96b) while\
    \ changing nothing the class fixes. So THE GAUGE ORBIT IS REACHABLE AT ZERO COST and, unlike the\
    \ class, needs no isogeny at all. If any cost functional's variance lives in the gauge direction,\
    \ its minimiser is trivially reachable and T5 is irrelevant. This record therefore costs BOTH\
    \ directions.\n(D) THE CEILING ON GAUGE OPTIMISATION, DERIVED BEFORE MEASUREMENT. For a window\
    \ factor base X_E cap [0, W), the gauge orbit realises the counts |X_E cap u^{-2}[0, W)| over\
    \ (p-1)/2 dilates. Each is W/2 + O(sqrt(p) log p) by Weil. Modelling the dilates as independent\
    \ centred draws of scale sqrt(W)/2 gives a maximum of W/2 + sqrt(W log p / 2) (1 + o(1)), so the\
    \ best achievable relative gain in factor-base size is\n    1 + sqrt(2 log p / W) (1 + o(1)) ->\
    \ 1,\ni.e. SUBCONSTANT, vanishing as W grows. And the SEARCH for the best dilate costs one multiplicative\
    \ convolution over F_p^*, O(p log p) by FFT, which is p^{1/2} times the rho baseline. So gauge\
    \ optimisation is doubly dominated: the prize vanishes and the search costs more than the attack.\
    \ That is a quantitative closure of direction (C), stated before any run, and the experiment's\
    \ job is to test whether the observed maximum matches the prediction (no structure) or exceeds\
    \ it (structure in the dilation orbit, which would be the one interesting outcome and would connect\
    \ to the multiplicative-energy questions in KN-TECH-016).\n(E) THE DECISIVE MEASUREMENT FOR (R-local),\
    \ WHICH IS CHEAP AND WHICH NOBODY HAS RUN. Define, for a candidate functional C and a small prime\
    \ ell, the ONE-STEP AUTOCORRELATION\n    rho_ell(C) = corr( C(E), C(E') ) over F_p-rational ell-isogenies\n\
    \                 phi : E -> E' inside one class.\nHill-climbing is possible only if rho_ell is\
    \ materially positive, or if some cheap vertex statistic predicts C. Three outcomes, all meaningful:\n\
    \  rho_ell ~ 1: C is essentially constant along the walk -- consistent with\n    class invariance\
    \ (the L1 closure branch), and the walk buys nothing\n    because there is nothing to climb.\n\
    \  rho_ell ~ 0 with Var(C) > 0: C varies but is UNPREDICTABLE one step ahead.\n    Then the class\
    \ is a rugged landscape with no gradient, (R-local) fails,\n    and the only surviving route is\
    \ (R-common) -- which is then tested\n    directly by asking what fraction of members lie within\
    \ epsilon of the\n    minimum.\n  rho_ell materially positive with Var(C) > 0: a GRADIENT EXISTS.\n\
    \    Hill-climbing is viable and the campaign has a target. This is the only\n    branch in which\
    \ L1 produces something an attacker could use, and it is\n    the branch this measurement exists\
    \ to detect."
  resource_label: 'R4 (the isogeny graph and the class-group action: the walk moves between curves,
    which is invisible to any oracle acting on G) + R2 (the curve equation, which is what the functional
    reads at each vertex).'
  admissibility: admissible
  admissibility_argument: 'Walking the ell-isogeny graph changes the CURVE, not the points of G; a
    generic-group algorithm has no way to produce a different curve equation because the equation
    is not among its oracle outputs. This is exactly the R4 line of DECOMPOSITION.md section 2 and
    it escapes KN-FIND-b7e091, whose closed oracles (incidence, endomorphism-image) return group elements.
    It also escapes H-ENDO-001, which says every endomorphism acts on G as a scalar: true, and irrelevant
    here, because nothing in this record applies an endomorphism to a point of G in order to gain
    information. The instance is transported by T1 solely so that the SAME k can be attacked on a
    different equation. CAVEAT RECORDED HONESTLY: admissibility of the resource does not make the
    direction useful; (D) closes the free direction quantitatively and (B) shows the expensive direction
    is gated on identification.'
  reachability_gate: 'THIS RECORD IS THE REACHABILITY GATE. Its verdict per functional is one of:
    R-ADDRESS (the good curve has a closed-form address, e.g. j = 0 when D_0 = -3; transport at Otilde(p^{1/4})
    suffices; GATE PASSED, and note that this is the branch IDEA-20260807-8b9486 lands in); R-COMMON
    (a constant fraction of the class is good; a polylog random walk suffices; GATE PASSED); R-LOCAL
    (a polylog-computable vertex statistic predicts C; hill-climbing works; GATE PASSED); R-GAUGE
    (the variance is in the free isomorphism direction; no isogeny needed at all; GATE PASSED but
    the prize is bounded by (D) at 1 + sqrt(2 log p / W), which is subconstant); or UNREACHABLE (identification
    costs h ~ p^{1/2} functional evaluations, which is at or above the 0.886 sqrt(N) baseline before
    a single relation is collected; GATE FAILED, with identification named as the obstruction rather
    than transport). The pre-registered expectation is UNREACHABLE for the yield and Groebner functionals,
    R-ADDRESS with a constant-factor prize for the j = 0 / j = 1728 case, and R-GAUGE with a subconstant
    prize for the window functionals.'
  inputs:
    procedure: 'STAGE 0 (zero compute, THE PRIMARY DELIVERABLE): write the Step 1 cost table with
      every row cited or marked [open], and state explicitly whether transport or identification is
      the binding constraint. This alone discharges the lane''s obligation to address T5 and costs
      nothing. STAGE 1 (hours): build one complete toy class at p ~ 2^13 and its ell-isogeny graph
      for ell in {2, 3}; run the VOLCANO-LEVEL POSITIVE CONTROL -- rho_ell(level) must be high. If
      it is not, the graph construction is wrong and nothing else is measured. STAGE 2 (hours): measure
      rho_ell for every candidate functional against the 16-draw rewired null; report intervals. STAGE
      3 (hours): the distribution question of Step 4 and the local- predictor regression of Step 5,
      each against its own null. STAGE 4 (~1 hour): the gauge-ceiling forced-value check of Step 6
      by FFT. STAGE 5 (zero compute): assemble the verdict per functional as (R-common | R-local |
      R-address | UNREACHABLE), with the identification cost stated for each. Stage 0 is free and
      is the item to run first; Stage 1''s positive control is the cheapest way to discover the instrument
      does not work.'
    mechanism: 'STEP 1 -- THE COST ACCOUNTING, ZERO COMPUTE, WRITTEN FIRST. Tabulate, for the ordinary
      F_p case: class size h ~ sqrt(|D|) ~ p^{1/2}; cost of one small-ell step (Velu on a rational
      ell-torsion kernel found from the division polynomial) as poly(ell, log p); cost of a uniformly
      random class member as O(log p) steps under GRH-conditional rapid mixing of the Cl(O) Cayley
      graph; cost of a SPECIFIED class member as Otilde(sqrt(h)) = Otilde(p^{1/4}) group-action evaluations
      by collision search, marked [open] pending re-verification against the archived primary source
      at inputs/ECTD-TESKE-20260731/sources/galbraith-iso.pdf; cost of the gauge orbit as O(log p)
      per element and O(p log p) to optimise over it by FFT. Compare every row against 0.886 sqrt(N).
      This table is the deliverable even if every measurement below returns null.

      STEP 2 -- BUILD THE WALK AT TOY SCALE. At p in [2^12, 2^14], enumerate a complete class (as
      in IDEA-20260807-0ff796 Step 2). For small ell in {2, 3, 5, 7}, build the ell-isogeny graph
      on the class by evaluating the classical modular polynomial Phi_ell(j, j'') over F_p, or --
      to avoid depending on stored modular polynomials -- by directly computing rational ell-isogenies
      with Velu from kernels obtained by factoring the ell-division polynomial. Both routes are pure-Python
      feasible at these p; the second is slower but self-contained and is the fallback.

      STEP 3 -- MEASURE rho_ell(C) FOR EVERY CANDIDATE FUNCTIONAL. Candidates: window relation yield;
      window solving-degree proxy from harness/semaev.py (Groebner basis size and maximum total degree,
      labelled as implementation-bound proxies exactly as that module requires); first-fall proxy;
      the H-PSEUDO flatness constant at a window (IDEA-20260807-692e9b); the rational-2-torsion stratum
      (IDEA-20260807-0a3272). For each, compute the Pearson and Spearman correlation of C over all
      rational ell-isogeny edges of the class, with the edge set enumerated exhaustively rather than
      sampled.

      STEP 4 -- MEASURE (R-common) DIRECTLY. For each functional, compute the full within-class distribution
      and report the fraction of members within epsilon of the minimum for epsilon in {1%, 5%, 10%}
      of the class range. If that fraction is a constant bounded away from zero and the class range
      itself is bounded away from zero after the gauge correction, (R-common) holds and a random walk
      suffices. This is a distribution question, not a search question, and it is answered by the
      same enumeration.

      STEP 5 -- MEASURE (R-local) BEYOND AUTOCORRELATION. Regress C on the cheap vertex statistics:
      number of rational ell-isogenies at the vertex (the volcano level indicator), #E[2](F_p), #E[3](F_p),
      the group structure invariant n_1 in E(F_p) ~= Z/n_1 x Z/n_2, and the root count of f. Report
      R^2. A local predictor with R^2 above 0.3 that is computable in polylog(p) is a PASSED (R-local)
      gate for that functional.

      STEP 6 -- THE GAUGE CEILING TEST. For >= 30 curves, compute the exact distribution of |X_E cap
      u^{-2}[0,W)| over ALL u by one multiplicative convolution (O(p log p) FFT), and compare the
      observed maximum against the derived prediction W/2 + sqrt(W log p / 2). Report the ratio. This
      is the forced-value check for direction (C) and it either confirms the closure in (D) or exposes
      structure.

      STEP 7 -- TRANSPORT CERTIFICATES THROUGHOUT. Every isogeny used must come with the re-verifiable
      certificate that the transported instance still satisfies Q'' = [k] P'' and that deg(phi) is
      coprime to N, checked independently in harness/toycurve.py. A transport that fails is an infrastructure
      failure under AGENTS.md rule 5.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - volcano-level indicator as a POSITIVE control for rho_ell -- BLOCKING
  - rewired-graph null, >= 16 draws, reported as an interval
  - random-permutation null for the local-predictor regression
  - derived forced value W/2 + sqrt(W log p / 2) for the gauge maximum
  - rho baseline reproduction on the untransported instance
  - transport certificates on every edge used
  - 'NULL OBJECT (from the proposal): MANDATORY. THE MATCHED NULL FOR rho_ell IS A RANDOM REWIRING:
    keep the same class, the same multiset of C-values, and the same edge COUNT, but rewire the ell-isogeny
    edges uniformly at random. rho_ell on the rewired graph is the null distribution and it is a GENERATED
    comparator, so it is drawn >= 16 times and reported as an interval, never as a point (KN-TECH-1a5b7e
    mode 5). DECAY PARAMETER: the walk length. A genuine local gradient must DECAY with the number
    of steps -- corr(C(E_0), C(E_s)) must fall toward the rewired null as s grows, at a rate consistent
    with the mixing time. A correlation that does NOT decay with s is measuring a global property
    of the class (or a bug in the enumeration), not a local gradient, and is the canonical artifact
    tell. SECOND NULL, for Step 6: the observed maximum over dilates against the derived W/2 + sqrt(W
    log p / 2), with both arms scored against the reference model rather than against each other.
    THIRD NULL, for Step 5: regress C on a RANDOM permutation of the vertex statistics; the R^2 obtained
    there is the floor any claimed predictor must clear.'
  independent_variables: []
  metrics:
    primary:
    - rho_ell per (functional, ell), Pearson and Spearman, with the rewired interval
    - correlation decay corr(C(E_0), C(E_s)) versus walk length s
    - class-range and gauge-range of every functional, side by side
    - fraction within 1%, 5%, 10% of the class minimum
    secondary:
    - R^2 of the local-predictor regression and of its permuted null
    - observed/derived ratio of the gauge maximum
    - the Step 1 cost table with every exponent and its citation status
  heuristic_under_test: null
  preregistered_prediction:
    quantity: rho_ell(C), the one-step autocorrelation of each candidate functional over all rational
      ell-isogeny edges of a complete toy class, against a 16-draw rewired-graph null interval
    formula: 'PRE-REGISTERED: rho_ell is inside the rewired null interval for the yield and Groebner-proxy
      functionals (no gradient), and OUTSIDE it, high, for the volcano-level indicator (the positive
      control). Any functional whose rho_ell exceeds the null interval''s upper end by more than the
      interval''s own width is a (R-local) candidate and triggers Step 5.'
    source: pre-registered in IDEA-20260807-c36472 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - DOUBLE-COUNTED EDGES. An ell-isogeny and its dual are two edges but one relation; counting both
    inflates rho_ell mechanically. Edge multiplicity must be declared and the rewired null must match
    it exactly.
  - SMALL CLASSES. At p = 2^12, h may be under 20; correlations then have enormous error bars and
    the rewired null is nearly as wide as the range. Class size is reported beside every correlation.
  - GAUGE LEAKAGE. If each class member is measured at an arbitrary gauge representative, gauge variance
    enters the class arm and depresses rho_ell. Every vertex must be measured at a CANONICAL representative
    (e.g. the lexicographically least (a, b) in its orbit) or averaged over >= 8 gauge draws, and
    which convention was used must be recorded.
  - MIXED ell. Pooling 2-isogeny and 3-isogeny edges mixes two different volcano structures. Correlations
    are reported per ell.
  - SOLVER NOISE. The Groebner proxies from harness/semaev.py are implementation-bound (that module
    says so explicitly) and their run-to-run variance may exceed any class effect. Repeat measurements
    per vertex and report the within-vertex variance before any between-vertex correlation.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'PRE-REGISTERED: rho_ell is inside the rewired null interval for the yield and
    Groebner-proxy functionals (no gradient), and OUTSIDE it, high, for the volcano-level indicator
    (the positive control). Any functional whose rho_ell exceeds the null interval''s upper end by
    more than the interval''s own width is a (R-local) candidate and triggers Step 5.'
  falsification_criterion:
  - The volcano-level positive control shows rho_ell near the rewired null. The isogeny graph is wrong;
    nothing is measured and no verdict is issued.
  - Some functional shows rho_ell far above the rewired null AND a correlation that does not decay
    with walk length. That combination is the artifact tell, not a discovery, and it points at a bug
    in edge enumeration.
  - The gauge maximum exceeds the derived prediction by more than 20%, reproducibly. Then (D)'s independence
    model is wrong, the derived ceiling is void, and the gauge direction must be re-costed from scratch.
  - A local predictor with R^2 > 0.3 computable in polylog(p) is found. This is the branch that FALSIFIES
    the record's own expectation, passes the (R-local) gate, and hands the campaign a target. It also
    triggers GOAL-ENDO-001 pause condition P3 before anything is written down as a speedup.
  - The class at reachable p is too small (< 20 members) for any correlation to have power. SCOPE
    limitation, reported as such; not evidence of unreachability.
  - The [open] p^{1/4} transport figure fails re-verification against the archived source. Then (A)'s
    correction to T5 is withdrawn and the record is superseded; the identification argument in (B)
    survives independently, because it does not use the transport exponent at all.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-c36472
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
