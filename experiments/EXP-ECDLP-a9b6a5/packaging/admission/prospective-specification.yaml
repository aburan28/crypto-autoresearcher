    and exceptional branches; no omission and no early rank stop.
  - Historical reference raw custody resolved from canonical content pointers; no
    fabricated claim that native hashes alone imply rehydration or independent remote
    GET.
  metrics:
    primary:
    - Per-curve attempted statuses and accepted rows, with rejected/alias reason counts
      summing to2293760.
    - Actual U, rank(M), rank([M|b]), nullity and consistency modulo r after public
      projection; right-kernel basis, pivot and row certificates.
