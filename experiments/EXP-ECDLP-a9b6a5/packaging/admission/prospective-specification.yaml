  controls:
  - Independent public input and prime/order/generator/EC1/prefix verification before
    target stream; this may compute public anchors but no unknown-log table.
  - 'Old-eight embedding: every old tuple/options descriptor maps into m16, with same
    source lift, interpolation and canonical geometry under label transport; old accepted
    witnesses if any embed. Existing reference has zero accepted rows, so that empirical
    witness check is vacuous and must be stated; use a planted positive prefix witness
    to test the code path.'
  - 'Transported-encoding A/A: fixed atom permutation and lift/deck/sign transport
    preserve E1 source equations, acceptance semantics, projected matrices up to signed
    column permutation, ranks and U. This is algebraic validation of the existing
    stream, not an extra selected scientific branch arm.'
  - 'Proves-too-much controls on separate planted/copy files: false source a+1, modified
    lift, dropped/duplicated status, altered branch digest, incorrect known anchor/U/pivot/kernel,
    broken prefix/source order and pointer/custody hash; all must be rejected.'
