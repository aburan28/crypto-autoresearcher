  decision_impact:
    valid_nonzero_or_rank_change: After independent review, report exact finite change;
      a separately designed constructor/cost question may follow, with no immediate
      hypothesis promotion.
    valid_zero_or_deficient: Retain exact status distribution and finite nullspace;
      consider a separately frozen single constructor/base change. No universal rank
      obstruction or security inference.
    invalid_or_infrastructure: Record exact defect/censored coverage and repair additively;
      no mathematical conclusion.
    anomaly: Preserve unexpected cells/counters and independently check them before
      interpretation.
    on_positive: If the finite new-width stream has accepted rows or changed useful
      rank, report exact conditional observations after independent validity review;
      only a separately frozen study may test complete cost or recovery.
    on_negative: If the finite new-width stream has zero rows or deficient rank, retain
      every status and finite nullspace; consider one separately designed constructor/base
      change without universal obstruction or security inference.
