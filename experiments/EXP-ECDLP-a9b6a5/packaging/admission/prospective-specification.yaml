      location if any; full enumeration continues regardless.
    - Input order/base construction, source lifting, interpolation, residual/normalization,
      hashing, matrix/certificate/checker and artifact delivery operation vectors;
      wall/CPU/peakRSS/cache/bytes recorded separately.
    - Transport-control and independent replay coverage, negative-control failures,
      missing arithmetic/cost/custody coverage.
    cost_labels: Counts measured by an actual instrumented run are labeled measured;
      4587520 and branch cardinalities are derived. No pre-run estimate is a measured
