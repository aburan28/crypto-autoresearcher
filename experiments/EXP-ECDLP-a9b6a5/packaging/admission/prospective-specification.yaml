  factor_base_protocol:
    reference_m: 8
    candidate_m: 16
    prefix: The m16 factor_base[0:8] point and native-lift records are byte-for-byte
      the old eight entries. Hash the prefix and exact old-to-new maps. Retain old
      EC1/curve UID and P, but distinguish the new factor-base/fixture UID.
    extension: Append the next eight eligible distinct pi1 norm classes using the
      existing fixtures.describe lexicographic rational-point order, canonical square
      root/orientation and distinct norm-x rule exactly. Preserve inherited x=0 atom/lift
      in the old prefix; the unchanged constructor rejects x=0 interpolation branches
      explicitly. Do not introduce a nonzero-lift eligibility criterion. No acceptance,
      rank or known-log selection. If the deterministic rule cannot extend to sixteen,
      retain construction trace as implementation/input failure; no replacement curve.
    public_exposure: Use exactly public a=1..64 on both widths; derive all +/-[a]P
      images independently. Remove every signed-known anchor from projected unknowns,
      merge equal/opposite norm columns and retain native-to-projected map. Actual
      U is observed/derived from public inputs, never set to m or m-1.
    source_order: Materialize once the original seed0 source shuffle from the old
      m8 fixture UID and prior config domain. Reuse that exact order in m16, independently
      of the new base/fixture UID. Bind the array and original order derivation.
    branches: Lexicographic combinations(range(m),3) and lexicographic product(range(4),repeat=3).
      Options retain the old deck/hyperelliptic sign conventions. Enumerate all tuples/options
      even on unliftable sources.
    constructor: Unchanged source lift, cubic interpolation, residual quadratic, exceptional-chart
      tests, squarefree/endpoint checks, canonical alias law and principal-divisor/source
      equation. No large-prime repair, new anchor, alternative chart, adaptive branches,
      tuple selection, target oracle or hidden log table.
    alias_scope: Reset seen sets exactly as in the old per-curve/arm collector; compare
      semantic descriptor/canonical keys under explicit old8-to-new16 atom transport.
      Branch numerical indices are width-dependent and are not an embedding proof.
