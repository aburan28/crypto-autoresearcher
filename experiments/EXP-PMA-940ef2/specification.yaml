experiment:
  id: EXP-PMA-940ef2
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-d5d520; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-d5d520
  question_id: RQ-PMA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Machine-check the frozen EXP-PMA-001 parameter box for arithmetic satisfiability over each
    declared constant field, validate the checker against constructed satisfiable and unsatisfiable
    nulls, and sweep every experiment specification
  objective: 'The one uncertainty a run reduces is whether the frozen EXP-PMA-001 contract can be
    instantiated at all over its declared finite fields, before any compute is spent on the mechanism
    it was written to test. Concretely: (i) it decides, per declared field, whether fifteen pairwise-distinct
    admissible d_S values exist, emitting a counting certificate for every negative verdict and an
    independently verified witness assignment for every positive one, so the verdict is checkable
    rather than asserted; (ii) it forces the ambiguity in the frozen distinctness clause into the
    open by computing and reporting the verdict under both readings, rather than silently adopting
    one, which is the difference between an audit and an opinion; (iii) it establishes whether the
    checker itself is trustworthy, by running it against at least 200 synthetic specifications with
    constructed ground truth and requiring zero misclassifications in both directions, with false
    UNSATISFIABLE treated as the fatal direction. A subordinate outcome is a fleet sweep measuring
    how many of the repository''s experiment specifications expose a parameter box a small constraint
    vocabulary can read at all. The run reduces NO uncertainty about divisor parity, about principal-minor
    assignment, or about any mathematical claim; a defect it finds is repaired by amendment, not by
    revising the mechanism.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for the frozen text
      of experiments/EXP-PMA-001/specification.yaml and ledger/hypotheses/H-PMA-001.yaml as committed,
      a per-field satisfiability verdict on the extracted parameter-box constraints under each of
      two explicitly stated readings, each negative verdict carrying a counting certificate and each
      positive verdict carrying an independently verified witness; plus a measured misclassification
      rate of the checker on constructed nulls; plus a count of how many experiment specifications
      expose an extractable parameter box. What does NOT follow: nothing about whether divisor parity
      obstructs PMA4, nothing about the correctness of IDEA-20260726-012, nothing about whether a
      repaired contract would succeed, nothing about constraints outside the extracted vocabulary
      (which are listed as unchecked), and no attack, speedup or security consequence.'
  inputs:
    procedure: 'STAGE 0 (cost: an hour, human, zero compute): fix the constraint vocabulary -- variable
      family, domain, exclusion set, distinctness scope -- and write down both candidate readings
      of the frozen distinctness clause before running anything. STAGE 1 (cost: seconds): parse the
      two frozen records, extract the constraint set, and print it verbatim beside its source lines.
      STAGE 2 (cost: seconds): per declared field, compare required distinct-variable count against
      available domain size; emit UNSATISFIABLE with a counting certificate or SATISFIABLE with a
      witness. STAGE 3 (cost: seconds): independently verify every emitted witness against every extracted
      constraint with a separate routine. STAGE 4 (cost: minutes): generate at least 200 synthetic
      specifications with constructed ground truth from a declared seed, run the identical parser
      and solver, and count misclassifications in both directions. STAGE 5 (cost: seconds): recompute
      stages 2 and 3 under the alternative reading and report both verdict tables side by side. STAGE
      6 (cost: minutes): sweep every experiments/*/specification.yaml, report the parse and verdict
      histogram and the OUT_OF_SCOPE constraint list. STAGE 7 (cost: minutes, human): write the run
      record; if any verdict is UNSATISFIABLE, state on its face that the mechanism is untouched.'
    instrument: Python 3 with the standard library plus a YAML parser for reading the frozen records;
      a small hand-written constraint representation (variables, finite domain, pairwise-distinct
      and exclusion constraints) solved by counting, with a brute-force assignment search used only
      for the witness at k = Q restricted to a declared finite candidate pool. A separate, deliberately
      naive witness verifier written independently of the solver. harness/runner.py for the run manifest
      and seed discipline. No Sage, no SMT solver, no computer algebra system -- the arithmetic is
      counting.
    parameters: 'Target records: experiments/EXP-PMA-001/specification.yaml and ledger/hypotheses/H-PMA-001.yaml
      as committed. Variables per instance: 15 (one d_S per nonempty subset of a four-element index
      set). Declared fields: F_3, F_5, F_7 and Q. Admissible domain size per finite field: q - 2,
      i.e. 1, 3, 5. Readings tested: (R1) distinctness binds pairwise across all fifteen d_S; (R2)
      distinctness binds only within the four singleton subsets. Witness candidate pool at k = Q:
      the integers 2 through 40. Null arm: at least 200 synthetic specifications, at least 80 constructed
      satisfiable and at least 80 constructed unsatisfiable, variable counts drawn from 2 to 30 and
      domain sizes from 1 to 40, from a declared seed. Fleet sweep: all experiments/*/specification.yaml
      present at the frozen base commit.'
  controls:
  - 'Null arm: at least 200 synthetic specification files of the same shape with constructed ground
    truth, half satisfiable and half not, run through the identical parser and solver in the same
    invocation.'
  - 'Hand-construction control: for every field the audit calls SATISFIABLE, it must emit an explicit
    witness assignment, and an independent routine must verify the witness satisfies every extracted
    constraint.'
  - 'Ambiguity control: the audit must report the alternative reading of the distinctness clause and
    its verdict under that reading, so a single reading is never presented as the contract''s meaning.'
  - 'Out-of-scope control: constraints the vocabulary cannot express (nondegeneracy of the resulting
    discriminants, pole non-collision) are enumerated and reported as unchecked, never folded into
    a SATISFIABLE verdict.'
  - 'Parser fidelity control: the extracted constraint set is printed verbatim alongside the source
    lines it came from, so a reader can check the extraction rather than trust it.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The identical parser and identical solver are run against a null: a
    set of synthetically generated specification files of the same shape, with the same field list
    and the same constraint vocabulary, but with variable counts drawn so that half are satisfiable
    by construction and half are unsatisfiable by construction, generated from a declared seed. The
    null must show the audit recovering the constructed ground truth with zero false UNSATISFIABLE
    verdicts and zero false SATISFIABLE verdicts across at least 200 synthetic specifications. If
    the audit misclassifies any synthetic case, its verdict on the real frozen contract carries no
    weight and the record says so. A false UNSATISFIABLE is the fatal direction, because it would
    slander a real contract.'
  independent_variables:
  - declared constant field in {F_3, F_5, F_7, Q}
  - reading of the distinctness clause in {R1 pairwise across all fifteen, R2 singletons only}
  - 'arm: real frozen specification versus synthetic null specification'
  - specification identity, across the fleet sweep
  metrics:
    primary:
    - per-field satisfiability verdict for EXP-PMA-001 under each reading
    - 'counting certificate per negative verdict: required distinct count versus available domain
      size'
    - witness assignment plus independent verification result per positive verdict
    - null-arm false UNSATISFIABLE count (fatal direction, target 0)
    - null-arm false SATISFIABLE count (target 0)
    secondary:
    - number of experiment specifications parsed and number with an extractable parameter box
    - fleet verdict histogram
    - OUT_OF_SCOPE constraint list per specification
    - agreement or disagreement between readings R1 and R2, per field
    - 'parser fidelity check result: extracted constraints versus verbatim source lines'
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The per-field satisfiability verdict for the frozen EXP-PMA-001 parameter box under
      reading R1, and the checker's misclassification rate on constructed nulls.
    formula: Under R1, verdict(F_q) equals SATISFIABLE if and only if q - 2 is at least 15, i.e. q
      at least 17; hence UNSATISFIABLE at q = 3, 5, 7 with certificates 1 < 15, 3 < 15, 5 < 15, and
      SATISFIABLE at k = Q with an explicit fifteen-element witness. Checker misclassification rate
      on the null arm equals 0 in both directions across at least 200 synthetic specifications.
    source: Pre-registered in the parent proposal IDEA-20260816-d5d520 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The tested parameters are exactly the fifteen prescribed d_S variables, four declared
      constant fields, two readings, and at least 200 synthetic null specifications. There is no extrapolation
      of any kind: the verdict is a counting statement about a specific committed file at a specific
      commit, and it transfers to no other contract except through the fleet sweep, which re-runs
      the identical check rather than extrapolating. The one assumption that could carry beyond the
      tested scope is that the constraint vocabulary is adequate, and that is measured directly by
      the OUT_OF_SCOPE list rather than assumed.'
    correspondence: null
  tail_checks:
  - Every SATISFIABLE verdict must be accompanied by a witness that the independent verifier accepts;
    a SATISFIABLE verdict without a verified witness is downgraded to OUT_OF_SCOPE.
  - Synthetic null cases with domain size exactly equal to variable count (the boundary) are over-represented
    in the null arm, since that is where an off-by-one in the checker would live.
  - Cases where the frozen text names a domain other than the constant field are flagged and inspected
    by hand rather than decided by the counter.
  - Any specification in the fleet sweep whose extracted constraint set is empty is inspected to confirm
    it genuinely has no parameter box rather than an unparsed one.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Withhold the real verdict entirely if the null arm produces any misclassification in either direction.
  - Halt and report a parser defect if the extracted constraint set does not match the printed verbatim
    source lines.
  - Halt the fleet sweep at any specification that crashes the parser, recording the file rather than
    skipping it silently.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The null arm runs at least 200 synthetic specifications with zero false UNSATISFIABLE
    and zero false SATISFIABLE, and the frozen EXP-PMA-001 parameter box receives a per-field verdict
    under both readings, each negative verdict carrying a counting certificate and each positive verdict
    carrying an independently verified witness.
  falsification_criterion:
  - Any false UNSATISFIABLE on the null arm.
  - Any false SATISFIABLE on the null arm.
  - A hand construction produces fifteen pairwise-distinct admissible d_S over F_3, F_5 or F_7, contradicting
    the counting certificate.
  - Extracted constraints disagree with the printed verbatim source lines.
  - Readings R1 and R2 give identical verdicts at every field, showing the claimed ambiguity is not
    load-bearing.
  - A SATISFIABLE verdict is emitted without a witness the independent verifier accepts.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-d5d520
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must rule on which reading of the frozen distinctness clause is authoritative;
    the audit deliberately does not, and the whole verdict at q = 5 and q = 7 turns on it.
  - The Coordinator must decide whether the d_S domain is the constant field k or something larger
    such as k[t]; the frozen text is the only evidence and it must be read, not inferred.
  - If the verdict is UNSATISFIABLE, the repair route needs specifying -- amend the parameter box,
    raise the finite fields to q at least 17, or restrict the prescribed subset family -- and each
    repair changes what the mechanism is being tested on, which is a Coordinator judgement and not
    an audit output.
  - The constraint vocabulary's scope must be frozen before the fleet sweep, since a vocabulary tuned
    after seeing the fleet would make the OUT_OF_SCOPE count meaningless.
