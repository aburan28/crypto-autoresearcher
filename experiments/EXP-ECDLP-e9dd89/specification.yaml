  status_note: >
    Frozen at version 1 and approved 2026-09-13 by
    DEC-20260913-b3491f under the standing 2026-09-06
    user authorization. Stage 0 is the exact
    elementary-symmetric coefficient-sketch calibrator.

  objective: >
    Evaluate the exact identity that on
    S={1,2} one has e1=3, and rejects
    the nearby claim that a constant
    sketch e1=0 canonicalizes the set,
    on one frozen family (REAL, KF,
    NULL). Stage 0 does not form a
    real Gamma orbit and does not
    authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL has
      e1=3; KF constant-sketch claim
      rejected because e1=3; NULL
      empty set rejected; empty
      selected-coefficient list
      rejected. Certificate kind
      none.
    formula: >
      Expand (X-1)(X-2)=X^2-3X+2.
      REAL: e1=3. KF: claim e1=0,
      actual e1=3, rejected as a
      generic coefficient-sketch
      target.
    claim_tier: observational

  inputs:
    fixture:
      real_set:
        elements: [1, 2]
        must_e1: 3
        must_poly: [1, -3, 2]
      known_false:
        kind: constant_sketch
        claimed_e1: 0
        must_e1: 3
        must_reject: true
      matched_null:
        kind: empty_set
        must_reject: true
      invalid:
        - {empty_selected_coefficients: true, must_reject: true}

  controls:
    - name: known_false_constant
      object: KF claim e1 equals 0
    - name: matched_null
      object: empty set
    - name: invalid_empty_coeffs
      object: empty selected-coefficient list

  independent_variables:
    - elements
    - selected_coefficients
  metrics:
    primary:
      - fixture_pass
      - real_e1_pass
      - known_false_constant_pass
      - reject_invalid_pass
      - null_empty_pass
    secondary: []
  primary_metrics:
    - fixture_pass
    - real_e1_pass
    - known_false_constant_pass
    - reject_invalid_pass
    - null_empty_pass
  secondary_metrics: []
  seeds: [8]
  replication_plan: >
    One Stage 0 run. Deterministic
    exact integer tables. No sampling.
  budget:
    wall_clock_seconds: 120
    memory_gb: 2
    maximum_runs: 1
  stopping_rules:
    - Stop after the five gates are recorded.
    - A timeout is failed_infrastructure, not a mathematical miss.
  invalidation_rules:
    - Missing artifact paths invalidate the run.
    - Overwriting an existing run record invalidates the procedure.
  success_criterion: >
    All five Stage 0 gates true and
    certificate kind none on the
    frozen REAL / KF / NULL toys.
  falsification_criterion: >
    After fixture_pass, any REAL
    e1 miss or KF-constant accept at
    the frozen toys.
  success_criteria:
    - All five gates true and certificate kind none.
  falsification_criteria:
    - After fixture_pass, any REAL table miss or KF accept.
  required_artifacts:
    - raw-result.json
    - execution-report-s0.yaml
    - implementation/stage0_coeffsk.py
  dependencies:
    - H-ECDLP-2b270e
    - DEC-20260913-b3491f
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
  scientific_boundary: >
    Stage 0 P-S0-COEFFSK only. Not
    nested LHW. Not Esser-May. Not
    Semaev. Not a P1553 recurrence.
    Not a factor-base. Not Velu. Not
    a Gamma orbit. Not a rho beat.
    No Stage 1 of EXP-ECDLP-e9dd89.
    No Stage 1 of EXP-ECDLP-bb5ef7.
