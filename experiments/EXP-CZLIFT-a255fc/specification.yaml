# EXP-CZLIFT-a255fc -- small rational points versus E(F_p) coverage.
# H-CZLIFT-9a32e9 / RQ-CZLIFT-b9f765 / GOAL-CZLIFT-1516d5.
# Approved by DEC-20261009-a3797d under the standing user authorization.
experiment:
  id: EXP-CZLIFT-a255fc
  hypothesis_id: H-CZLIFT-9a32e9
  question_id: RQ-CZLIFT-b9f765
  goal_id: GOAL-CZLIFT-1516d5
  version: 1
  title: >-
    Census of rational points of naive height <= 10^5 (3 x 10^5 on the
    replication) on the rank-0..7 minimal-conductor ladder and quadratic
    twists, with growth exponent, uniform-reduction coverage ratio, H_half(p)
    scaling and twist gain
  status: approved
  frozen: true
  designed_at: '2026-10-09'
  approved_by: coordinator
  approval_decision: DEC-20261009-a3797d
  execution_authorized: true
  status_note: >-
    Frozen at version 1 and approved 2026-10-09 by DEC-20261009-a3797d under
    AGENTS.md "Standing user authorization" after the Coordinator's
    readiness check. Approval asserts nothing about H-CZLIFT-9a32e9. The
    rank labels are recalled; a ninth ladder curve (the recalled rank-8
    model) was dropped before freezing because no rational point of height
    <= 10^5 exists on the recalled equation, which means the equation was
    misremembered, not that the rank is wrong. Later changes are versioned
    amendments under amendments/.
  objective: >-
    For each ladder curve enumerate every rational point of naive height
    H(x) = max(|a|, d^2) <= hmax by a seven-modulus quadratic-residue sieve
    plus an exact integer square test; record N_E(H) on the grid
    10, 30, ..., hmax; the slope of log N_E against log log H; for 16 primes
    of good reduction between 101 and 20000 the number of distinct residues
    of those points in E(F_p) at each grid height against the uniform model
    N_p(1 - (1 - 1/N_p)^N); the smallest grid height covering half of
    E(F_p); and for the first four ladder curves and D in {-1, 2, -3, 5,
    -7, 13} the twist points of height <= twist_hmax, their union coverage
    at primes where D is a square, and its ratio to the uniform model.
  inputs:
    curves: [11a1, 37a1, 389a1, 5077a1, 234446a1, 19047851a1, 5187563742a1, 382623908456a1]
    ainvs: 'frozen in implementation/run.py CURVES'
    ranks_recalled: [0, 1, 2, 3, 4, 5, 6, 7]
    hmax: {main: 100000, replication: 300000}
    twist_hmax: 30000
    twist_curves: 4
    twist_D: [-1, 2, -3, 5, -7, 13]
    n_primes: 16
  controls:
    - 'Rank-0 curve 11a1: N_E(H) must be constant (5 points) at every H; a growing count would mean a search defect.'
    - 'The uniform model is computed from the same N and N_p the observed count uses; the ratio is 1 under the null by construction.'
    - 'Every sample point in the record is re-verified on its curve by the checker; the first two curves are re-counted at H = 300 by a slow scalar search.'
    - Primes of bad reduction are excluded by the discriminant, computed from the a-invariants.
  independent_variables:
    - curve (rank 0..7)
    - height bound H on the grid
    - prime p
    - twist discriminant D
  metrics:
    primary:
      - coverage_ratio_median, coverage_ratio_frac_above_1p5, coverage_ratio_frac_below_0p5
      - growth_slopes.<curve>.measured against predicted r/2
    secondary:
      - h_half_scaling.<curve>.slope against 2/r
      - twist_union_ratio_median, twist_union_ratio_frac_above_1p5
      - per-curve counts, coverage cells, h_half tables
  heuristic_under_test: HEUR-CZLIFT-UNIFORM
  preregistered_prediction:
    quantity: coverage ratio distribution and growth slopes
    formula: >-
      coverage_ratio_median in [0.8, 1.2] and coverage_ratio_frac_above_1p5
      < 0.05; |growth slope - r/2| <= 1 for every curve with N_E(hmax) >= 20;
      twist_union_ratio_median in [0.8, 1.2].
    source: H-CZLIFT-9a32e9 predictions (Neron growth; uniform reduction model).
  scale_relevance:
    tier: toy
    justification: 'heights to 3 x 10^5 and primes to 20000; the growth exponent is read on a short range and the coverage model is tested where N <= 0.9 N_p.'
    correspondence: null
  tail_checks:
    - 'Cells with N >= 30 and modelled coverage <= 0.9 only; saturated cells cannot discriminate.'
    - 'h_half_scaling needs at least 3 resolved primes per curve; low-rank curves are expected to resolve none at these heights, which is itself the obstruction.'
  replication:
    seeds: []
    independent_instances: 2
    replication_note: deterministic enumeration; the replication trial extends hmax to 3 x 10^5 on the ladder without twists.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 1.5
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1
  stopping_rules:
    - Stop after the two planned trials have output_validated receipts.
    - A crash or timeout is failed_infrastructure; it is never a value of any metric.
  invalidation_rules:
    - A recorded sample point fails its curve equation under the checker.
    - The slow re-count at H = 300 disagrees with the sieve count on either of the first two curves.
    - 11a1 shows a height-dependent count.
  success_criterion: >-
    On the main trial: coverage_ratio_median in [0.8, 1.2],
    coverage_ratio_frac_above_1p5 < 0.05, every growth slope within 1 of
    r/2 for curves with N_E(hmax) >= 20, twist_union_ratio_median in
    [0.8, 1.2]; and the replication trial reproduces the coverage and slope
    conditions at hmax = 300000.
  falsification_criterion: >-
    On both trials any of: coverage_ratio_median outside [0.8, 1.2];
    coverage_ratio_frac_above_1p5 >= 0.05; a growth slope off r/2 by more
    than 1 on a curve with N_E(hmax) >= 20; twist_union_ratio_median outside
    [0.8, 1.2].
  decision_impact:
    on_positive: >-
      H-CZLIFT-9a32e9 moves to supported at toy tier after review and the
      counting form of the global-lift obstruction (polynomially many small
      points, uniformly spread, exponential height to reach a residue) is
      promoted as a finding with the measured constants.
    on_negative: >-
      A growth-slope failure first re-examines the recalled rank label of the
      offending curve (a correction record), then the search; a coverage
      excess above the uniform model on both trials opens a follow-up with a
      red-team card, since structured reduction of small points is exactly
      the resource a global-lift attack would need.
  required_artifacts:
    - experiments/EXP-CZLIFT-a255fc/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CZLIFT-a255fc/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CZLIFT-a255fc/runs/<RUN-ID>/command.txt
    - experiments/EXP-CZLIFT-a255fc/runs/<RUN-ID>/environment.json
    - experiments/EXP-CZLIFT-a255fc/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CZLIFT-a255fc/runs/<RUN-ID>/stderr.log
  launcher:
    trial_plan: experiments/EXP-CZLIFT-a255fc/trial-plan.json
    driver: experiments/EXP-CZLIFT-a255fc/implementation/run.py
    checker: experiments/EXP-CZLIFT-a255fc/implementation/check.py
    library: [harness/czlift_run.py]
  assigned_to: executor
  out_of_scope:
    - Computing ranks or Mordell-Weil bases; constructing high-rank curves.
    - Number fields of degree above 2.
    - The xedni dependence test itself (lifting r points to one curve and testing linear dependence), named as a successor.
