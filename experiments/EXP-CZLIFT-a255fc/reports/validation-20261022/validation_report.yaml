  joint_findings:
    J1: >-
      Holds. All 20 run files (10 per run) hash to their execution-receipt artifact_sha256 entries
      and their ledger-receipt path_sha256 entries; 0 of 20 mismatch. The two receipts hash to the
      values the dispatch queue binds to commits 6756a756 and 48c8727e, and both commits are
      ancestors of HEAD. command.txt and launch.json equal the trial-plan argv with {run_dir}
      substituted. Hashes of the spec, plan and sources match the trial plan, environment.json,
      the manifest and the snapshot receipt. Both trials ran; there is no extra, missing or
      duplicated run or artifact. One revision record is inconsistent (not material, see
      artifact_checks AC-5). The manifests have no files_sha256 block, so the hash carriers are
      execution-receipt.json and the ledger receipt.
    J2: >-
      Breaks, narrowly, on a frozen control. The arithmetic does not break. Every frozen success
      and falsification metric recomputes exactly (bit-identical floats) from raw-result.json on
      both runs, using my own code written and sealed before reading check.py. A first-principles
      replay that shares no code with the producer reproduces all 64 counts and 1024 coverage
      cells per run up to H = 3e4, and all 172 twist rows. However, frozen control 1 ("11a1: N_E(H)
      must be constant (5 points) at every H") and invalidation rule 3 ("11a1 shows a
      height-dependent count") both fire as written on the raw rows: raw.curves[0].counts["10"] = 3
      against 5 at every other grid height, in both runs. Yet both manifests record valid: true,
      invalid_reason: null, and neither the driver nor check.py evaluates this control. The count 3
      is mathematically correct (the points of height <= 10 are O, (5,5), (5,-6); x = 16 has
      height 16), and my sealed blind search reproduces it. The defect is therefore in the frozen
      wording, which no correct search can satisfy on a grid starting at H = 10, together with a
      receipt that silently omits the check. The "independent checker" imports the driver
      (import run as driver) and re-derives the summary with driver.summarize, so its agreement is
      a self-consistency check, not an independent one.
    J3: >-
      Holds. Sealed blind values (SEAL.sha256, 2026-10-22T08:07:34Z): N_E(300) = 5 and N_E(1000) = 5
      for 11a1; N_E(300) = 21 and N_E(1000) = 23 for 37a1. Every recorded value is identical in
      both runs. All 38 recorded 11a1/37a1 grid counts agree with the blind slow search
      (H <= 1e4) and with a blind group-law enumeration (H <= 3e5). The blind N_p for 37a1 is 99
      at p = 101 and 1057 at p = 1009, which equals the producer's curve_order_mod_p. The blind
      model agrees with the producer's model_distinct to within 8.3e-13 (exact rational against
      float). The producer's prime list never contains 101 or 1009 (strict sympy.nextprime starts
      at 103), so this comparison evaluates the producer's functions at those primes; the formula
      is identical on all 304 recorded 37a1 cells (max abs diff 0.0).
    PTM-1: >-
      Breaks; the instrument proves too much. A planted set of N distinct residues gives a ratio
      near 1 at small N/N_p: 1.0147 at N/N_p = 0.03 and 1.0505 at 0.10 on 37a1 at p = 1009. The
      plan's expected signature (ratio > 1.2 at small N/N_p) does not appear, and cannot: for any
      point set the ratio is at most min(x,1)/(1-e^-x) = 1 + x/2 + O(x^2), with x = N/N_p, and
      exceeds 1.2 only for x > 0.376. I placed the maximally spread planted set on exactly the
      frozen cells and ran it through the producer's own summarize(). It reports median 1.0514
      with frac_above_1.5 = 0.027 (main), and 1.0548 with 0.032 (replication). Both pass the
      frozen success criterion (median in [0.8,1.2], frac_above_1.5 < 0.05), so the known-false
      conclusion is accepted. Only the lower side is seen: a clustered planted set gives median
      0.016 and frac_below_0.5 = 1.0.

