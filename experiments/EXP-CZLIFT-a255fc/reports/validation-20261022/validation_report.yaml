  metric_recomputations:
    - id: MR-1
      metric: coverage_cells, coverage_ratio_median, coverage_ratio_frac_above_1p5, coverage_ratio_frac_below_0p5
      definition_used: cells with n_points >= 30 and model_distinct <= 0.9 N_p (spec tail_checks); ratio = distinct / (N_p (1 - (1 - 1/N_p)^N)); median = statistics.median
      RUN-CZLIFT-74f172: {recorded: [693, 1.033039818679393, 0.0, 0.0], recomputed: [693, 1.033039818679393, 0.0, 0.0], exact: true}
      RUN-CZLIFT-490b33: {recorded: [785, 1.033250098309885, 0.0, 0.0], recomputed: [785, 1.033250098309885, 0.0, 0.0], exact: true}
      note: >-
        The producer takes the upper median ratios[n//2]. That equals the conventional median here
        only because every cell count (693, 785, 129) is odd; it is a latent definitional
        difference. Manifest metrics equal raw-result metrics on both runs.
    - id: MR-2
      metric: growth_slopes (OLS of log N_E on log log H)
      definition_used: grid H in [100, hmax] (hypothesis prediction range); the producer also drops counts < 3, which removes nothing
      result: >-
        All 16 values (8 curves x 2 runs) are bit-identical to the recorded ones. Recomputed
        |slope - r/2| on the main run: 37a1 0.035, 389a1 0.008, 5077a1 0.079, 234446a1 0.034,
        19047851a1 0.190, 5187563742a1 0.163, 382623908456a1 0.319. On the replication: 0.017,
        0.001, 0.091, 0.035, 0.210, 0.126, 0.280. Every in-scope curve (N_E(hmax) >= 20) is within
        1. 11a1 (N_E = 5) is exempt.
      exact: true
    - id: MR-3
      metric: h_half per (curve, p) and h_half_scaling slope (log log H_half on log p, >= 3 resolved primes)
      result: >-
        h_half recomputes with the "distinct >= N_p/2" convention on all curves and both runs.
        Scaling slopes are bit-identical: 5 curves on each run (5077a1 0.5896, 234446a1 0.4154,
        19047851a1 0.4056, 5187563742a1 0.3747 main / 0.3638 rep, 382623908456a1 0.3197 / 0.3116).
        All lie within [0.5, 2] x 2/r.
      exact: true
    - id: MR-4
      metric: twist_cells, twist_union_ratio_median, twist_union_ratio_frac_above_1p5 (main run only; the replication has twist_curves 0 and records null)
      definition_used: n_base_points + n_twist_points >= 30 and model_union <= 0.9 N_p
      RUN-CZLIFT-74f172: {recorded: [129, 1.0035889640776232, 0.0], recomputed: [129, 1.0035889640776232, 0.0], exact: true}
      row_checks: 172 rows equal the 172 expected (D a nonzero square mod p) with no missing row. model_union, ratio, gain and union bounds are consistent, n_base equals counts[30000], and distinct_base equals the coverage cell.
    - id: MR-5
      metric: first-principles row inputs
      result: >-
        The discriminant recomputes from the ainvs for all 8 curves, and no listed prime divides
        one. N_p is recounted independently (Legendre sum) for all 128 (curve, p) pairs with 0
        mismatches. model_distinct, ratio_to_model and coverage are consistent on every row. counts
        and distinct are monotone in H, and distinct <= min(N, N_p). All 88 sample points per run
        satisfy the completed-square equation with gcd(a,d) = 1.
      exact: true
    - id: MR-6
      metric: independent replay (no producer code) of counts and distinct residues
      result: >-
        I re-enumerated every point of height <= 30000 on all 8 curves by scalar search. Per run
        this matches 64 of 64 grid counts and 1024 of 1024 coverage cells' distinct (8 curves x 16
        primes x 8 heights). I re-enumerated twist points (x rational, D*R(x) a square, height
        <= 30000) for 4 curves x 6 D; all 172 twist rows match in n_base, n_twist, distinct_base,
        distinct_twist and distinct_union. Not replayed: rows at H = 1e5 (main) and at 1e5 and 3e5
        (replication), i.e. 128 and 256 rows, of which 95 and 187 are frozen cells.
      exact: true
    - id: MR-7
      metric: borderline probes (definitions, ties, exclusions)
      results:
        - Filter boundaries. No coverage cell has N = 30 or modelled coverage exactly 0.9. The variants N > 30 and coverage < 0.9 give identical metrics, so nothing is silently dropped at the threshold.
        - Ties. No ratio sits at 0.5 or 1.5. The range is [0.8533, 1.4262] on the main run and [0.8501, 1.4577] on the replication.
        - Prime range. The spec says "16 primes between 101 and 20000"; the frozen implementation uses 103..20011, because sympy.nextprime is strict. p = 20011 lies outside the frozen range and supplies 46/693 and 53/785 frozen cells. Without it the median is 1.0389 (main) and 1.0393 (replication). Frozen outcome unchanged.
        - Cell domain. The spec is internally inconsistent, since tail_checks says "modelled coverage <= 0.9" while scale_relevance and HEUR-CZLIFT-UNIFORM say "N <= 0.9 N_p". The producer used the former, which admits cells up to N/N_p = 2.28. Under the latter there are 621 cells with median 1.0265 (main) and 698 cells with median 1.0264 (replication). Frozen outcome unchanged.
        - Twist point at infinity. N_union = n_base + n_twist counts O twice. The frozen text writes N_E + N_{E^D}, so the producer followed it, but control 2 ("same N the observed count uses") holds only up to this +1. All 43 37a1 twist rows have N = 29 + 1 = 30 and enter the metric only through the duplicated O; 151 of 172 twist rows have no twist point but O. Counting O once gives 86 cells and median 1.0242, against 1.0036. Frozen outcome unchanged.
        - Height-10 point. Including H = 10 in the 11a1 fit would give slope 0.217, but 11a1 is exempt (N_E < 20).
        - h_half tie. 389a1 at p = 103 has distinct exactly N_p/2 at H = 1000; the ">= half" convention applies. 389a1 has 1 resolved prime, so the scaling metric is unaffected.
        - d = +-1. The denominator d ranges over d >= 1 by construction. Integral points (d = 1) are present in the samples, and the replay reproduces them, so nothing is dropped.
    - id: MR-8
      metric: frozen success and falsification criteria evaluated on recomputed values
      result: >-
        On both runs: coverage median in [0.8,1.2] true; frac_above_1.5 < 0.05 true; every slope
        within 1 true. On the main run, twist median in [0.8,1.2] is true under every variant above
        (0.9906 to 1.0242). These are observations; per PTM-1 the upper-side coverage conditions
        cannot fail on these cells.

  control_checks:
    - control: "1. Rank-0 curve 11a1: N_E(H) must be constant (5 points) at every H"
      outcome: >-
        FAILS as written on both runs at H = 10 (count 3); 5 at every H >= 30. The data is
        correct (blind and replay). The control cannot hold on the frozen grid for a correct
        search. No driver or checker code evaluates it, and the manifests record valid: true.
      status: breaks (contract/receipt inconsistency; not a search defect)
    - control: 2. Uniform model from the same N and N_p as the observed count
      outcome: >-
        Holds on every coverage row (N = n_points, N_p independently recounted). On twist rows N
        double-counts O (+1), as the frozen formula N_E + N_{E^D} itself does; sized in MR-7.
      status: holds (twist off-by-one disclosed)
    - control: 3. Checker re-verifies every sample point; first two curves re-counted at H = 300 by slow scalar search
      outcome: >-
        Holds. 88 of 88 sample points per run verify under my own check. The H = 300 recounts
        (5, 21) match the raw counts, and my sealed blind search gives the same. The checker's
        slow count shares g_exact with the driver; my blind count does not. The sample is the 12
        lowest-height points only.
      status: holds
    - control: 4. Primes of bad reduction excluded by the discriminant from the a-invariants
      outcome: Holds. Discriminants recompute from the ainvs, no listed prime divides 6*disc for any curve, and 16 primes per curve are retained.
      status: holds
    - control: "Invalidation rules: (1) sample point fails its equation; (2) slow H=300 recount disagrees; (3) 11a1 height-dependent count"
      outcome: (1) does not fire. (2) does not fire. (3) FIRES as written on both runs (counts 3 -> 5 between H = 10 and 30) and is not evaluated by any producer code.
      status: breaks

  blind_rederivation:
    quantity: N_E(H) for 11a1 and 37a1 at H = 300 and 1000 by slow scalar search; N_p (1 - (1 - 1/N_p)^N) for 37a1 at p = 101 and 1009 with own N_p
    sealed: {file: experiments/EXP-CZLIFT-a255fc/reports/validation-20261022/blind/SEAL.sha256, at_utc: '2026-10-22T08:07:34Z',
             blind_rederive.py: 4617b2c406cf2503035bdf08203762bb15e4d508105bb3e3a06ed0900a68376a,
             blind_output.json: 731ed3db337296179cf394e37c84ec0b5da6e52c594df765e59d93e07687b006}
    assumptions: >-
      The spec defers the a-invariants to implementation/run.py (blind-from). I used the Cremona
      minimal models 11a1 = [0,-1,1,-10,-20] and 37a1 = [0,0,1,-1,0] from general knowledge.
      Phase 2 confirmed these are the producer's ainvs. I assumed the grid 10, 30, 100, ...; the
      producer uses the same grid.
    blind_values:
      N_E: {11a1: {'300': 5, '1000': 5}, 37a1: {'300': 21, '1000': 23}}
      N_p_37a1: {'101': 99, '1009': 1057}
      model_37a1: {'p101_N21': 19.008526368292824, 'p101_N23': 20.616354172133892,
                   'p1009_N21': 20.80250987552101, 'p1009_N23': 22.76222100225554}
      internal_crosscheck: slow search equals group-law enumeration (multiples of (0,0); 5-torsion of 11a1) at every H <= 1e4
    recorded_values: {11a1: {'300': [5, 5], '1000': [5, 5]}, 37a1: {'300': [21, 21], '1000': [23, 23]}, producer_N_p_at_101_1009: [99, 1057]}
    agreement: exact on counts and N_p; model within 8.3e-13
    comparison_artifact: experiments/EXP-CZLIFT-a255fc/reports/validation-20261022/j2_probes_j3_compare_output.json

  proves_too_much:
    object: PTM-1, a planted set of N distinct residues of E(F_p), fed to the producer's coverage-ratio instrument (run.model_distinct, run.summarize)
    known_false_conclusion: Any point set covers E(F_p) at the uniform-reduction rate.
    expected_failure_signature: ratio > 1.2 at small N/N_p
    observed:
      concrete_37a1_p1009: {N_p: 1057, ratio_at_N_over_Np: {'0.030': 1.0147, '0.100': 1.0505, '0.300': 1.1570, '0.375': 1.1985,
                            '0.500': 1.2700, '0.874': 1.4995, '1.000': 1.5815}}
      analytic_ceiling_any_point_set: >-
        The ratio is at most min(x,1)/(1-e^-x), x = N/N_p. It reaches 1.2 at x = 0.3764 and 1.5
        at x = 0.8742, peaks at 1.5820 at x = 1, and falls back to 1.5 at x = ln 3 = 1.0986.
      on_frozen_cells_via_producer_summarize:
        RUN-CZLIFT-74f172: {planted_max_spread: {median: 1.0514390516021028, frac_above_1p5: 0.027417027417027416},
                            planted_clustered: {median: 0.015952098847562584, frac_below_0p5: 1.0},
                            cells_any_set_could_exceed_1p2: 159/693, cells_any_set_could_exceed_1p5: 19/693}
        RUN-CZLIFT-490b33: {planted_max_spread: {median: 1.054776430881404, frac_above_1p5: 0.03184713375796178},
                            planted_clustered: {median: 0.015438497629053702, frac_below_0p5: 1.0},
                            cells_any_set_could_exceed_1p2: 183/785, cells_any_set_could_exceed_1p5: 25/785}
    shows_expected_signature: false
    meaning: >-
      At the frozen cells (median N/N_p = 0.10; 74.7 percent of cells have N/N_p < 0.376), the
      upper-side coverage criteria cannot be violated by any point set. The median can never
      exceed 1.2, and frac_above_1.5 can never reach 0.05 (ceiling 2.7 and 3.2 percent). The
      instrument detects only clustering (deficit), not excess spreading. This is a structural
      property of the ratio, not an implementation bug.
    null_object_calibration:
      method: >-
        N independent uniform draws from the N_p residues per frozen cell (the model's own null,
        E[distinct] = model), summarized by the producer's summarize(). 200 replicates,
        numpy default_rng seed 20261022.
      RUN-CZLIFT-74f172: {null_median_of_medians: 1.0017135915476074, null_95pct: [1.0009581763398658, 1.0023251097773536],
                          observed_median: 1.033039818679393, null_reps_ge_observed: 0/200}
      RUN-CZLIFT-490b33: {null_median_of_medians: 1.0016028914787505, null_95pct: [1.0007418152569716, 1.0022054388687436],
                          observed_median: 1.033250098309885, null_reps_ge_observed: 0/200}
      observation_not_conclusion: >-
        The observed median lies outside the null band on both runs. It sits about 63 percent
        (main) and 60 percent (replication) of the way from the null centre (1.0017, 1.0016) to
        the maximal-spread value (1.0514, 1.0548). 394/693 (main) and
        437/785 (replication) frozen cells are already maximally spread (distinct = min(N, N_p)),
        including every 37a1 row: 144/144 and 160/160. Caveat: the null replicates draw cells
        independently, while real cells are nested in H, so the null band understates the
        spread of the median. Interpreting this for H2 belongs to the review-evidence round
        (PD-1).
    artifacts: [experiments/EXP-CZLIFT-a255fc/reports/validation-20261022/ptm1_planted.py, experiments/EXP-CZLIFT-a255fc/reports/validation-20261022/ptm1_output.json]

  heuristic_validation_checks:
    - check: pre-registered prediction
      result: >-
        The uniform model N_p(1-(1-1/N_p)^N), the [0.8,1.2] / 1.5 / 5 percent thresholds and the
        r/2 and 2/r predictions are frozen in spec v1 and H-CZLIFT-9a32e9 (commit 6756a756,
        16:02:21Z), before the first run started at 16:05:02Z.
      status: pass
    - check: sample integrity
      result: >-
        Enumeration is exhaustive and deterministic (no seeds), with parameters in the manifest.
        raw-result.json does not carry the point sets (12 samples per curve only), so `distinct`
        cannot be recomputed from raw. I replayed it independently up to H = 3e4 (MR-6).
      status: pass_with_limitation
    - check: null-object control and decay
      result: >-
        The producer ran no null object; the analytic model stands in for it. The PTM-1 null
        calibration and planted control show the ratio sits near 1 for any spread set while
