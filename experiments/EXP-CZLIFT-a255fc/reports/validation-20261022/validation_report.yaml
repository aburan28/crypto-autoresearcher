    they stand, however: a frozen control and its invalidation rule (11a1 "constant 5 at every H"
    / "height-dependent count") fire as written on both runs, while the receipts record the runs
    valid without evaluating them. Not `failed` or `invalid`, because the fired rule
    contradicts mathematics (N_E(10) = 3 is a fact, so no correct search can satisfy the wording
