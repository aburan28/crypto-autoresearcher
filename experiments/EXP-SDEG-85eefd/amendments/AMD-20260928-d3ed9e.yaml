# AMD-20260928-d3ed9e -- protocol amendment of EXP-SDEG-85eefd, protocol
# version 3 -> 4. Additive: no earlier file is edited. Approved by
# DEC-20260928-48a648. Rules on the three items the independent
# implementation audit (TASK-20260928-796dfe, finding F-1/F-2) found unruled,
# and requires five small driver fixes before admission. Execution stays NOT
# admitted.
protocol_amendment:
  amendment_id: AMD-20260928-d3ed9e
  experiment_id: EXP-SDEG-85eefd
  hypothesis_id: H-SDEG-489b76
  version_from: 3
  version_to: 4
  authored_by: coordinator
  authored_at: '2026-09-28'
  approved_by: coordinator
  approval_decision: DEC-20260928-48a648
  batch_id: BATCH-656ba1

  pre_data_status_disclosure: >-
    No protocol-labelled query has run. HOWEVER, while checking the scaling
    code the validator ran B0/B1/B2 on 9 random targets of its own (not
    protocol labels, non-members only, unamortized) and recorded, under rule
    8: B1 total W_query slope ~0.797 (W_fixed_xR = 52,488 at every size),
    B0 W slope ~0.594, beta_elim(interval_x) ~0.598, beta_elim(progression)
    ~0.198 (validation_report.yaml lines 134-135). The Coordinator read these
    values before writing this amendment. They are not evidence. To keep the
    rulings below independent of them, each ruling ACCEPTS THE READING THAT
    WAS ALREADY IMPLEMENTED AND DISCLOSED BEFORE THE OBSERVATION, and none
    changes a threshold, statistic or outcome mapping. This disclosure must be
    carried into the evidence record and the red-team plan.

  precedence: >-
    Protocol version 4 = specification.yaml + AMD-20260926-3479cf +
    AMD-20260928-7ce387 + this file; this file governs where they differ.

  rulings:
    - item: D-1 / F-1 (B1 pseudo-remainder form)
      ruling: >-
        Accept the field-form pseudo-remainder (division by the leading
        coefficient via one field inversion) in place of fraction-free
        Bareiss/Collins steps. The subresultant sequence and the decision are
        identical; the charged work per triple is about 9|T| rather than
        about |T|^2/2. This is the CHEAPER reading of B1's cost, so it can only
        move beta_work(B1) toward outcome A, never manufacture outcome B. The
        fraction-free cost is not measured and not reported.
    - item: OQ-17
      ruling: >-
        Accept as implemented: a member query's decision cost is charged
        through the end of the first hitting triple in lexicographic order.
    - item: OQ-18
      ruling: >-
        Accept as implemented: the 0.02 flat-trend test applies to total W.
        Outcome A separately requires W_triple's upper CI < 0.30 (v3 OQ-1).
    - item: OQ-19
      ruling: >-
        Copy-back is a pull from the Mac (pod_sync.sh pull) after each cell;
        the run package becomes official only through the snapshot archive.

  required_fixes_before_admission:
    - id: FX-1
      text: >-
        The driver must admit only a decision whose id is passed explicitly
        and which carries execution_admission.currently_admitted: true for
        EXP-SDEG-85eefd; mentioning the experiment is not enough.
    - id: FX-2
      text: >-
        The Linux load check fails CLOSED: if the cgroup cpu.max cannot be read
        or parsed, refuse to start.
    - id: FX-3
      text: >-
        Any B0/B1 hit-triple set mismatch is a procedure defect that stops the
        run, like a decision disagreement.
    - id: FX-4
      text: >-
        Per-cell peak memory is measured per cell (fresh worker process per
        cell, or a documented per-cell RSS method), not inherited from an
        earlier cell in a reused worker.
    - id: FX-5
      text: >-
        Run manifests carry requested_policy, resolved model, reasoning_effort,
        fallback_used and degraded_requirements per AGENTS.md artifact policy.

  affected_runs: []
  confirmatory_status: >-
    Confirmatory with the disclosed exposure above; no threshold or mapping
    was changed after it.
