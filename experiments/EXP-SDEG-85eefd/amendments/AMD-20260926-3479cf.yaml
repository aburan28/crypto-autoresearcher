  pre_registered_analysis_note:
    kind: observation_collision_audit
    statement: >-
      Coordinator pre-data analysis, recorded so the run can confirm or refute
      it. For target R and factor-base x-set V (all x in V liftable, so every
      factor-base point lies in E(F_p)), the radical of the backward
      elimination ideal I_R = <S5(u,X3,X4,X5,x(R)), f_V(X3), f_V(X4), f_V(X5)>
      intersected with F_p[u] has as roots exactly the x-coordinates of the
      F_p-rational points R + e3*P3 + e4*P4 + e5*P5 (e_i = +-1, P_i over V).
      Its degree is therefore the size of that point set, about
      (4/3)|V|^3 before collisions, i.e. beta_elim ~ 3/5 by counting alone.
      By contrast the degree of the first nonzero subresultant of (F_T, b)
      against the forward table F_T measures the NUMBER OF HITS (output size),
      not query cost, and is near zero on decomposable targets by
      construction. That is the "successful-subset loophole" of
      IDEA-20260909-f13026 outcome (B). Consequently beta_sub may not
      discharge the gate; only charged work can.
    asserts_nothing_about: >-
      Measured values. This is a prediction to be tested, not a finding.

  changes:
    - id: C-1
      field: inputs.curve_rule / inputs.curve_seeds / inputs.field_bits
      new: >-
        Nine frozen fixtures: L in {8, 16, 32} x curve seed in {1, 2, 3}.
        For each L the prime p is P1480's (p = 32801, 1048609, 33554593,
        all with L | p-1). Seed 1 is P1480's curve verbatim; seeds 2 and 3
        are derived by the v2 hash rule in ic_leads_fixtures_v2.py
        (SHA256 of 'EXP-SDEG-85eefd/v2|curve|L<L>|<seed>|<counter>', first
        admitted counter). Admission: j not in {0,1728}, nonsingular, #E prime,
        not anomalous, not supersingular, embedding degree > 20. Group order
        q = #E. Exact values are the "EXP-SDEG-85eefd" entries of
        ic_leads_fixtures_v2.json. Nominal field_bits [16, 20, 24] become
        actual 15/20/25-bit primes (q ~ L^5); the deviation is disclosed and
        is required for the subgroup deck. Seed-1 group orders reproduce
        P1480's (32479, 1047539, 33563891).
      fixture_artifacts:
        generator: experiments/EXP-SDEG-85eefd/amendments/ic_leads_fixtures_v2.py
        generator_sha256: bde44afb3e14c34d97bf50c154456565d12f0b5a1d33d63b473f0f4124b1f3b2
        values: experiments/EXP-SDEG-85eefd/amendments/ic_leads_fixtures_v2.json
        values_sha256: 543f49ca5304f4e61085305ca2ea01ccc0085298db26368d7362f96b1b6a5a45
        reproduction_rule: >-
          Before any scientific run the executor re-runs the generator and
          byte-compares its output to the frozen JSON; a mismatch is a
          procedure defect (stop).
    - id: C-2
      field: inputs.factor_base_rule
      new: >-
        Three decks per fixture, each a set V of liftable x-coordinates; the
        factor base is {P in E(F_p) : x(P) in V} (both signs). |V| is recorded.
        interval_x: the smallest L liftable x >= 0 (A1's "x-coordinates on
        the line"). subgroup_x: liftable elements of the order-L subgroup of
        F_p^* (P1480's deck; |V| may be < L). random_x: matched null, |V|
        equal to interval_x's, drawn without replacement from all liftable x
        by SHA256 of 'EXP-SDEG-85eefd/v2|random_x|L<L>|<seed>|<i>' with
        rejection sampling.
    - id: C-3
      field: membership definition
      new: >-
        m = 5. Target R is a member iff R = e1*P1 + ... + e5*P5 with P_i in the
        factor base, e_i = +-1 (repetition allowed). Serial split per A1:
        forward table T = {u : S3(x1,x2,u) = 0, x1,x2 in V} with
        F_T(u) = prod_{u in T}(u - v) squarefree; backward polynomial for a
        triple (x3,x4,x5) in V^3 is b(u) = S5(u,x3,x4,x5,x(R)) (degree <= 8
        in u). S3 is P1480's formula
        (u-v)^2*x^2 - 2*((u+v)*(u*v+a)+2*b)*x + (u*v-a)^2 - 4*b*(u+v);
        S4/S5 are obtained by resultant elimination of the intermediate
        coordinate and are checked against point arithmetic on 1000 random
        tuples per fixture before use (a failed identity stops the run).
    - id: C-4
      field: backends
      new:
        B0_mitm_calibration: >-
          Precompute T (charged once, amortized over the fixture's queries and
          also reported unamortized). Per query, for each unordered triple in
          V^3 compute the <= 8 candidate u values by point arithmetic
          x(R - e3*P3 - e4*P4 - e5*P5) and look them up in a hash set of T.
          Expected beta_work ~ 3/5. This is the proves-too-much control: if the
          pipeline reports B0 below the gate, the meter is broken.
        B1_subresultant_prs_A1: >-
          The A1 backend as specified: per triple, subresultant PRS of
          (F_T, b) in u with fraction-free (Bareiss/Collins) steps and
          early-abort at the first vanishing subresultant; no composed
          resultant is ever formed. Decision = some triple has
          deg gcd(F_T, b) >= 1; witness u verified by exact S5 evaluation
          and point arithmetic.
        B2_eliminant_degree_meter: >-
          Computes deg rad(I_R cap F_p[u]) exactly as the number of distinct
          x(R + e3*P3 + e4*P4 + e5*P5) (C-3 analysis note) and cross-checks it
          at L = 8 against a Sage/Singular elimination of I_R. Diagnostic
          only; its work is not a query cost.
        arithmetic_rule: >-
          Charged paths (B0, B1) use the implementation's own instrumented
          F_p arithmetic; every multiplication, inversion (charged as 1 mult
          plus a counted extended-gcd step count) and hash probe is counted.
          Sage/PARI may be used only by independent verifiers and B2's L=8
          cross-check. The Z3 version mismatch (installed 5.1.0 vs P1480's
          4.15.4) is moot because no SAT/SMT backend is used.
    - id: C-5
      field: trial plan
      new: >-
        Per fixture x deck: 32 queries, 16 planted positives (R = sum of 5
        signed factor-base points with indices and signs drawn by SHA256 of
        'EXP-SDEG-85eefd/v2|planted|L<L>|<seed>|<deck>|<j>|<k>') and 16 random
        targets (R = k*G, k drawn by '.../random|...' mod q). 9 fixtures x 3
        decks x 32 = 864 queries per backend. Every query runs under B0 and
        B1; B2 runs on all 864. Exact A5 oracle: exhaustive enumeration of
        5-multisets of signed factor-base points decides every query at every
        size (at most C(2|V|+4, 5) per deck); any B0/B1/oracle disagreement
        is a procedure defect (stop).
    - id: C-6
      field: metrics.primary
      new: >-
        beta_work := slope of log W versus log q across L = 8, 16, 32, where W
        is charged per-query work of the backend; reported for the median and
        for the worst query per (L, deck), pooled over the 3 seeds, with 95%
        bootstrap CIs (2000 resamples, resampling queries within cells, seed
        'EXP-SDEG-85eefd/v2|bootstrap'). Computed separately on
        (i) successful queries (oracle says member), (ii) unsuccessful, and
        (iii) all. Secondary: beta_elim (B2 degree), beta_sub (log_q of the
        degree of the first nonzero subresultant, B1), P(success) per cell,
        conditioning ratio rho_c = median W(successful) / median W(all).
        Units: alpha = 5 * beta (alpha in L, beta in q).
    - id: C-7
      field: success / falsification mapping
      new:
        outcome_A_promotion: >-
          ALL of: beta_work(B1, all queries, worst) upper CI < 0.30 on
          interval_x; per-size B1 medians non-increasing or flat in L; B1
          below the random_x deck's beta_work; B0 calibration within
          [0.5, 0.7]; oracle agreement 100%; every witness verified.
        outcome_B_scoped_close: >-
          beta_work(B1, all queries) lower CI >= 0.30 with calibration passing:
          scoped NEGATIVE RESULT closing the subresultant-PRS backend for
          RT-1476 at these fixtures, reporting rho_c, beta_sub and beta_elim
          so the successful-subset reading is visibly separated from cost.
        inconclusive: >-
          CI straddles 0.30, or calibration fails (procedure defect, not
          evidence).
        forbidden_reading: >-
          A beta_sub or successful-subset-only beta_work below 0.30 is NOT
          outcome A.
    - id: C-8
      field: controls (made concrete)
      new:
        matched_null: random_x deck, same |V|.
        known_structure_positive: >-
          progression deck: V = x-coordinates of {k*G : k = 1..L}. Sums of
          three factor-base points take O(L) values, so beta_elim must come
          out near 1/5; the pipeline must report beta_elim < 0.30 on it. Its
          factor-base logs are known by construction, so it is never an IC
          result.
        known_false_gate: B0 must fail outcome A (beta_work ~ 3/5).
        baseline: >-
          Pollard rho with negation map, r = 32 adding walk, fruitless-cycle
          handling, 64 targets per fixture (k from '.../rho|...'); report
          group operations / sqrt(q) against 0.886.
        accounting_audit: >-
          An independent checker recomputes W from the operation log of 10%
          of queries (selected by SHA256) and rejects any receipt that zeroes
          aborted triples, table construction or hash probes.
    - id: C-9
      field: budget / execution_admission
      new: >-
        maximum_memory_gb 8, maximum_workers 1 and maximum_runs 1 unchanged
        (one run covers all 9 fixtures). Per-query watchdog 3600 s wall; a
        watchdog stop is an infrastructure incompletion charged at the cap as
        a LOWER bound in (iii) and never scored as a member/non-member.
        execution_admission.currently_admitted stays false. Additional
        machine-protection admission precondition (user instruction
        2026-09-26, "run nothing until load drops"): at claim time the
        15-minute load average must be <= 14 (hw.ncpu), the system volume
        must have >= 5 GiB free and the repository volume >= 20 GiB free.
        Record the three readings in the run manifest.

