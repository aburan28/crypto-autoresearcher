# AMD-20260928-7ce387 -- PRE-DATA protocol amendment of EXP-SDEG-85eefd,
# protocol version 2 -> 3. Additive: specification.yaml and
# AMD-20260926-3479cf are NOT edited. Approved by DEC-20260928-6b03c5.
# Rules on the implementation's open questions (TASK-20260928-c7aad3,
# implementation_report.yaml OQ-1..OQ-16) and moves the charged run to a
# declared remote execution host. Execution stays NOT admitted.
protocol_amendment:
  amendment_id: AMD-20260928-7ce387
  experiment_id: EXP-SDEG-85eefd
  hypothesis_id: H-SDEG-489b76
  version_from: 2
  version_to: 3
  authored_by: coordinator
  authored_at: '2026-09-28'
  approved_by: coordinator
  approval_decision: DEC-20260928-6b03c5
  batch_id: BATCH-656ba1

  pre_data_status: >-
    No scientific run exists. The only executions so far are smoke checks at
    L = 8, seed 1, under labels in the 'smoke|EXP-SDEG-85eefd/v2' namespace,
    reporting identities and backend agreement. No beta, slope or per-size
    work statistic was computed, so none of these rulings can have been
    tuned to data.

  precedence: >-
    Protocol version 3 = specification.yaml + AMD-20260926-3479cf +
    this file; this file governs where they differ.

  rulings:
    - oq: OQ-1
      ruling: >-
        W for B1 is the TOTAL charged work, including the S5 specialization
        (forming b(u) is part of the A1 query). Because the per-query fixed
        specialization at x(R) (about 52,488 mults) dominates at L = 8 and
        biases a three-point slope DOWNWARD, outcome A additionally requires
        beta_work computed on W_triple := W minus that per-query fixed
        specialization term to have upper CI < 0.30 as well. Outcome B uses
        total W. Both slopes are always reported.
    - oq: OQ-4
      ruling: >-
        Primary W is the DECISION cost: the query stops at the first verified
        hit in the deterministic lexicographic triple order
        (W_query_to_first_hit); non-members pay full enumeration. Full-
        enumeration W is reported as secondary. rho_c is computed on the
        primary W. Outcome A's "all queries, worst" statistic is governed by
        non-members, so this reading opens no successful-subset loophole.
    - oq: OQ-9
      ruling: >-
        "Non-increasing or flat": each per-size median of log W / log q (the
        per-size beta estimate) may exceed the previous size's by at most
        0.02. The other literal readings stand: comparison with random_x uses
        (all, worst) point estimates; outcome B needs both median and worst
        lower CIs >= 0.30; calibration uses B0 (interval_x, all, median) in
        [0.5, 0.7].
    - oq: OQ-5
      ruling: Accept the driver default (split method on all L = 8 queries; literal FGLM on every |V| <= 4 query and the first query of each other L = 8 cell).
    - oq: OQ-6
      ruling: Accept the explicit point-at-infinity element in T; membership with repetition allowed includes P1 = -P2.
    - oq: [OQ-2, OQ-3, OQ-7, OQ-8, OQ-10, OQ-11, OQ-12, OQ-13, OQ-14, OQ-15, OQ-16]
      ruling: >-
        Accept the literal readings exactly as written in
        implementation_report.yaml (unit weights; per-deck amortization, with
        unamortized also reported; seed-label shapes; ascending V; beta_sub
        and fit abscissa as described; watchdog op count as a flagged lower
        bound; progression deck handling; witness verification excluded from
        W; R = O handling; rho walk details). They are now frozen.

  execution_host:
    change: >-
      Charged B0/B1/B2(split)/oracle/rho cells run on the user-provided RunPod
      pod (container id 839460d1abea, Ubuntu 24.04, Python 3.12, cgroup CPU
      quota 23.8, 251 GiB RAM, direct TCP SSH). Sage-dependent steps (fixture
      reproduction and B2's literal FGLM cross-check) run on the repository
      Mac. Each run manifest records the host that produced each cell.
    c9_precondition_on_pod: >-
      At claim time on the pod: 15-minute load <= 23 (floor of the cgroup CPU
      quota), >= 20 GiB free on the run volume, >= 5 GiB free on /. The Mac
      precondition of AMD-20260926-3479cf C-9 applies only to the Sage steps
      run there. Each query runs single-threaded, so per-query work counts
      are host-independent and unaffected by parallelism; wall-clock is
      recorded but is not the metric. On the pod only, maximum_workers is
      raised from 1 to 16 independent cell processes (machine headroom on a
      23.8-CPU quota; memory cap 8 GB per process, 128 GB total). maximum_runs
      stays 1: one run covering all cells.
    durability: >-
      The pod's disk is ephemeral: raw results are copied back to
      experiments/EXP-SDEG-85eefd/runs/ after each cell, and are official
      only after the Coordinator snapshot archive.

  affected_runs: []
  confirmatory_status: Confirmatory; all rulings frozen before any data.
