  v3_changes:
  - id: V3-1
    ruling: OQ-1, OQ-4
    change: cellrun records carry W (primary, decision cost + amortized share), W_full (full enumeration
      + share, secondary), W_fixed_xR (B1's charged specialization at x(R); 0 for B0) and W_triple = W
      - W_fixed_xR. backends.b1_query reports W_components.fixed_xR_specialization. For a watchdog-stopped
      B1 query W_fixed_xR is recomputed on a fresh counter (cellrun.fixed_xR_cost).
    files:
    - backends.py
    - cellrun.py
  - id: V3-2
    ruling: OQ-1, OQ-4, OQ-9
    change: 'analysis.compute_metrics reports beta_work (primary W), beta_work_full (secondary) and beta_work_triple
      (B1). rho_c uses primary W. outcome A adds B1_triple_all_worst_upper_ci_lt_gate; outcome B uses
      total primary W. Flat check: per-size median of log W / log q (per_L[*].median_logW_over_logq) may
      rise by <= FLAT_TOL = 0.02; applied to B1 (interval_x, all) and to the known-false B0 gate. Both
      slopes are always in the outcome block.'
    files:
    - analysis.py
    - tests/test_analysis.py
  - id: V3-3
    ruling: OQ-4
    change: accounting audit recomputes W (prefix of the op log through the lexicographically first hit
      triple), W_full and W_triple/W_fixed_xR from the op log; a receipt reporting full enumeration as
      a member's decision cost is rejected.
    files:
    - audit.py
  - id: V3-4
    ruling: execution_host
    change: 'hostinfo.py: host-aware C-9. Linux: /proc/loadavg 15-min load <= floor(quota/period) from
      /sys/fs/cgroup/cpu.max (os.cpu_count() if ''max''), run volume >= 20 GiB, / >= 5 GiB. macOS: load
      <= 14, / >= 5 GiB, repo volume >= 20 GiB. Every part manifest records host identity (hostname, container
      id, cgroup cpu quota, python, numpy, psutil, platform).'
    files:
    - hostinfo.py
    - driver.py
  - id: V3-5
    ruling: execution_host
    change: 'driver.py --mode charged|sage|merge|full. charged: identity, decks, oracle, B0, B1, B2, no-Sage
      B2 split (b2split.py), witness replay, rho -> runs/<RUN>/charged/. sage (Mac): fixture reproduction
      + literal FGLM -> runs/<RUN>/sage/ (decks/targets regenerated deterministically). merge: cross-part
      consistency (run id, plan sha, decision, namespace, implementation sha256 per file, no sage import
      in the charged process), FGLM vs B2 per query, audit, metrics, C-7 mapping, cell_provenance.json
      with per-cell host. No charged module imports sage (AST test).'
    files:
    - driver.py
    - celltask.py
    - b2split.py
    - tests/test_hosts_split.py
  - id: V3-6
    ruling: execution_host (maximum_workers 16 on the pod)
    change: charged part runs identity, cell and rho tasks in up to 16 spawn processes on Linux (1 elsewhere,
      enforced); each task is single-threaded (BLAS/OpenMP thread env = 1), writes only its own file,
      and results are sorted before aggregation. Per-process 8 GiB peak-RSS guard (backends._mem_guard).
      No new task starts after a defect or task error. Optional --after-cell-cmd hook for copy-back; pod_sync.sh
      pull copies a charged part back.
    files:
    - driver.py
    - celltask.py
    - pod_sync.sh
  - id: V3-7
    ruling: n/a (plan header only)
    change: trial-plan-v2.json keeps its name (no cell, query, label or draw changed); header now protocol_version
      3, amendment_v3 path/sha256, per-host C-9 rules and execution_hosts. check_plan also verifies amendment_v3_sha256
      and protocol_version == 3.
    files:
    - make_trial_plan.py
    - trial-plan-v2.json
    - fixtures.py
  - id: V3-8
    ruling: verification
    change: smoke.py --no-sage and --out-dir; writes canonical per-query op counts (opcounts.json, sorted,
      compact JSON) for the cross-host identity check; runs the no-Sage split on every smoke query.
    files:
    - smoke.py
    - cellrun.py
