  deviations:
  - id: D-1
    what: Pseudo-remainder computed as lc(b)^(delta+1) * (F_T mod b) using one charged inversion, not
      by term-by-term fraction-free scaling.
    why: Over F_p the values are identical coefficient for coefficient; the literal term-by-term form
      rescales the whole remainder at each of ~|T| steps (quadratic in |T|) and would charge an artifact
      of the representation rather than the PRS. The subresultant exact divisions by g*h^delta are multiplications
      by charged inverses.
  - id: D-2
    what: Forward table built by point arithmetic x(P1 +- P2) rather than by solving the quadratic S3(x1,
      x2, u) = 0.
    why: Same set by Semaev's theorem; smoke checks S3(x1, x2, u) = 0 for every table entry. Cost is charged
      in both cases.
  - id: D-3
    what: B2 Sage cross-check runs the literal Singular elimination (GB degrevlex + FGLM to lex) on a
      subset of L = 8 queries and a Sage 'split' eliminant (rad lcm over V^3 of the S5 specializations)
      on all L = 8 queries.
    why: Literal elimination costs ~10 min/query at |V| = 8 (see OQ-5).
  - id: D-4
    what: driver.py has a --smoke-dry-run mode (smoke namespace, L8-s1, output confined to implementation/smoke/).
    why: Only way to exercise the driver's run path without a scientific run.
  - id: D-5
    what: Smoke cell JSONs omit per-triple op logs; the accounting audit ran on all smoke receipts in
      memory.
    why: Repository volume repeatedly reached 0 bytes free during the task (infrastructure_incidents).
  - id: D-6
    what: The final smoke and driver dry-run ran with TMPDIR=/private/tmp/sdeg-agent (system disk) instead
      of the requested /Volumes/SSD990/.tmp-agent.
    why: Sage failed with ENOSPC creating a temp file on /Volumes/SSD990 (0 bytes free); the system disk
      had ~20 GB free at that time. Only Sage's small temp files go there.
  - id: D-7
    what: B2's split cross-check on the charged host uses b2split.py (plain Python over F_p, uncharged,
      derived S5 only) and compares by 'deg rad == |X| and rad vanishes on every x in X' instead of listing
      the radical's roots.
    why: No Sage on the pod; for a squarefree rad the two conditions are equivalent to root-set equality.
      The Sage split method remains in sage_b2_crosscheck.py and the Mac smoke compares both.
  - id: D-8
    what: On Linux the per-process memory guard is peak RSS (ru_maxrss) > 8 GiB checked once per i3 iteration,
      not a psutil current-RSS poll.
    why: Peak RSS is the stricter bound and needs no extra dependency; checked at the same points as on
      the Mac.
  open_questions:
  - id: OQ-1
    topic: How b(u) = S5(u, x3, x4, x5, x(R)) is formed and charged in B1
    literal_reading_implemented: 'Charged Horner specialization of the dense 9^5 S5 array: x(R) once per
      query (52,488 mults), x3 per i3 (5,832 each), x4 per (i3, i4) (648 each), x5 per triple (72).'
    consequence: 'Modeled: at L = 8 these terms are the majority of B1''s per-query W; at L = 32 a small
      share. A large fixed term at the smallest size lowers a 3-point log-log slope, i.e. biases beta_work(B1)
      DOWNWARD, toward the 0.30 gate. B1 records W_components (S5_specialization vs prs_and_rest) so the
      split is visible, but the protocol does not say which W enters beta_work. Needs a Coordinator ruling
      (e.g. keep literal; or charge only the PRS; or charge a sparse specialization) BEFORE the run.'
    status: ruled
    ruled_by: AMD-20260928-7ce387 (DEC-20260928-6b03c5)
    ruling: B1 W is total (incl. S5 specialization); outcome A must also pass on W_triple = W minus the
      per-query fixed x(R) specialization; both slopes always reported.
  - id: OQ-2
    topic: Weights inside W
    literal_reading_implemented: W = mul + inv + gcd_steps + probes, unit weights ('inversion charged
      as 1 mult plus a counted extended-gcd step count'). All components stored separately.
    status: ruled
    ruled_by: AMD-20260928-7ce387 (DEC-20260928-6b03c5)
    ruling: Literal reading accepted as written; now frozen.
  - id: OQ-3
    topic: Amortization base for table (and deck-construction) cost
    literal_reading_implemented: Amortized over the deck's 32 queries (T depends on the deck), also reported
      unamortized. 'fixture's queries' could be read as 96/128 per fixture. Deck construction is charged
      under spec v1 charging_rule ('Charge FB construction').
    status: ruled
    ruled_by: AMD-20260928-7ce387 (DEC-20260928-6b03c5)
    ruling: Literal reading accepted as written; now frozen.
  - id: OQ-4
    topic: Full triple enumeration vs stop at first hit
    literal_reading_implemented: B0 and B1 enumerate every triple ('for each unordered triple'); W_query_to_first_hit
      (deterministic lexicographic triple order) is recorded too. rho_c depends strongly on this choice
      (full enumeration makes W nearly class-independent).
    status: ruled
    ruled_by: AMD-20260928-7ce387 (DEC-20260928-6b03c5)
    ruling: Primary W = decision cost (W_query_to_first_hit; non-members pay full enumeration); full-enumeration
      W secondary; rho_c on primary W.
  - id: OQ-5
    topic: Coverage of B2's L = 8 Sage/Singular cross-check
    literal_reading_implemented: 'Driver default: ''split'' on all 384 L = 8 queries; literal ''fglm''
      on every |V| <= 4 query and the first query of every other L = 8 cell (--b2-fglm-per-cell 1). Full
      literal coverage would cost roughly 50-60 h of Singular time at the measured smoke rate.'
    status: ruled
    ruled_by: AMD-20260928-7ce387 (DEC-20260928-6b03c5)
    ruling: Driver default accepted (split on all L = 8 queries; FGLM on every |V| <= 4 query and the
      first query of each other L = 8 cell).
  - id: OQ-6
    topic: Point at infinity in the forward set
    literal_reading_implemented: T carries an explicit INF element (U = P - P), seen by B0 as a backward
      point equal to O and by B1 as a degree drop of b(u). Without it B0/B1 disagree with the exact oracle
      on every target that is a signed 3-sum (repetition allowed), which C-5 makes a stop.
    status: ruled
    ruled_by: AMD-20260928-7ce387 (DEC-20260928-6b03c5)
    ruling: Explicit point-at-infinity element in T accepted; P1 = -P2 allowed.
  - id: OQ-7
    topic: Seed-label shapes the amendment elides or omits
    literal_reading_implemented: 'random target ''<ns>|random|L<L>|<seed>|<deck>|<j>'' (deck included
      by analogy with planted); rho target ''<ns>|rho|L<L>|<seed>|<t>''; rho walk multipliers and start
      ''<ns>|rho_walk|L<L>|<seed>|<t>|<restart>.<j>{c,d}''; identity tuples ''<ns>|identity|L<L>|<seed>|<i>|<field>'';
      audit selection ''<ns>|audit|<query_id>''; query index j = 0..15 per kind. Planted term: r = uniform(label,
      2|V|), index r // 2, sign + iff r even. A single-label draw in the 2^256 rejection zone raises (p
      < 2^-250).'
    status: ruled
    ruled_by: AMD-20260928-7ce387 (DEC-20260928-6b03c5)
    ruling: Literal reading accepted as written; now frozen.
  - id: OQ-8
    topic: Ordering of V
    literal_reading_implemented: Sorted ascending for every deck; fixes planted index mapping and triple
      order.
    status: ruled
    ruled_by: AMD-20260928-7ce387 (DEC-20260928-6b03c5)
    ruling: Literal reading accepted as written; now frozen.
  - id: OQ-9
    topic: Statistics used inside the C-7 conditions
    literal_reading_implemented: 'A: ''B1 below the random_x deck''s beta_work'' compares (all, worst)
      point estimates; ''medians non-increasing or flat'' is implemented as non-increasing (no tolerance
      for ''flat''). B: both the median and the worst beta_work(B1, all, interval_x) lower CIs >= 0.30.
      Calibration: B0 (interval_x, all, median) point estimate in [0.5, 0.7].'
    status: ruled
    ruled_by: AMD-20260928-7ce387 (DEC-20260928-6b03c5)
    ruling: 'Flat: each per-size median of log W / log q may exceed the previous size''s by at most 0.02.
      Other literal readings stand.'
  - id: OQ-10
    topic: beta_sub definition
    literal_reading_implemented: Per query D = sum over triples of deg gcd(F_T, b) (the number of hits);
      beta_sub = slope of log median D on log q per class; undefined (not zero) when a median is 0, which
      is expected for non-members.
    status: ruled
    ruled_by: AMD-20260928-7ce387 (DEC-20260928-6b03c5)
    ruling: Literal reading accepted as written; now frozen.
  - id: OQ-11
    topic: Abscissa of beta fits
    literal_reading_implemented: Mean log q over the pooled queries at each L (the three seeds' q differ).
    status: ruled
    ruled_by: AMD-20260928-7ce387 (DEC-20260928-6b03c5)
    ruling: Literal reading accepted as written; now frozen.
  - id: OQ-12
    topic: Watchdog stop 'charged at the cap as a LOWER bound'
    literal_reading_implemented: The cap is in seconds and W is in operations; the op count at the stop
      is recorded as a flagged lower bound in class (iii); no seconds-to-ops conversion is invented.
    status: ruled
    ruled_by: AMD-20260928-7ce387 (DEC-20260928-6b03c5)
    ruling: Literal reading accepted as written; now frozen.
  - id: OQ-13
    topic: Progression control deck queries
    literal_reading_implemented: 32 queries per fixture (labels with deck 'progression'), run under B0,
      B1, B2 and the oracle; excluded from primary beta_work; beta_elim(progression) < 0.30 checked.
    status: ruled
    ruled_by: AMD-20260928-7ce387 (DEC-20260928-6b03c5)
    ruling: Literal reading accepted as written; now frozen.
  - id: OQ-14
    topic: Witness verification cost
    literal_reading_implemented: Excluded from W (certification by independent verifier code).
    status: ruled
    ruled_by: AMD-20260928-7ce387 (DEC-20260928-6b03c5)
    ruling: Literal reading accepted as written; now frozen.
  - id: OQ-15
    topic: Random target R = O (k = 0 mod q, probability 1/q per query)
    literal_reading_implemented: 'Handled: B1 uses S4(u, x3, x4, x5); B0/B2/oracle handle O natively.'
    status: ruled
    ruled_by: AMD-20260928-7ce387 (DEC-20260928-6b03c5)
    ruling: Literal reading accepted as written; now frozen.
  - id: OQ-16
    topic: Rho walk details
    literal_reading_implemented: Partition index x mod 32; every visited canonical point stored; fruitless
      cycle escape by doubling the cycle's min-x point; walk + escape group ops / sqrt(q) reported against
      0.886; precompute reported separately.
    status: ruled
    ruled_by: AMD-20260928-7ce387 (DEC-20260928-6b03c5)
    ruling: Literal reading accepted as written; now frozen.
  open_questions_v3:
  - id: OQ-17
    question: 'Decision cost of a member stops at the END of the first hit triple (B0: all 8 sign candidates
