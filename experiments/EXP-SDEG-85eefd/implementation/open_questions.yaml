open_questions_v3:
- id: OQ-17
  question: 'Decision cost of a member stops at the END of the first hit triple (B0: all 8 sign candidates
    of that triple probed; B1: the full PRS of that triple), and the per-cell amortized share is added
    to the decision cost as to the full cost. Literal reading of ''stops at the first verified hit in
    the lexicographic triple order''; confirm.'
  impact: small constant per member query; no effect on non-members, which govern (all, worst).
- id: OQ-18
  question: The flat criterion is applied to the (interval_x, all) per-size median of log W / log q for
    B1 total W only, not additionally to W_triple. The ruling adds only the upper-CI condition for W_triple;
    confirm that flatness is not also required on W_triple.
  impact: could change an outcome-A verdict only if W_triple per-size betas rise by > 0.02 while its slope
    CI stays < 0.30.
- id: OQ-19
  question: 'Copy-back ''after each cell'': the pod cannot reach the Mac, so the implementation offers
    (a) --after-cell-cmd on the pod and (b) pod_sync.sh pull RUN-ID run from the Mac (e.g. in a loop).
    Which mechanism the Coordinator uses is operational, not in the code.'
  impact: durability only.
