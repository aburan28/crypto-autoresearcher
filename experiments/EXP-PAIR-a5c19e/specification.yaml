experiment:
  id: EXP-PAIR-a5c19e
  hypothesis_id: H-PAIR-04cff7
  derived_from_idea: IDEA-20260809-15e1cd
  question_id: RQ-PAIR-f2e31f
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Certified end-to-end discrete logarithm at three small tower-field sizes of one
    fixed shape, with per-phase operation counts, per-phase peak memory, and the
    measured-versus-modelled ratio reported as a trend rather than a point
  objective: >-
    The one uncertainty a run reduces is whether this program can own a calibration
    anchor for tower-field discrete-logarithm cost instead of inheriting one. A run
    establishes, at three field sizes sharing one tower shape: whether the pipeline
    returns an exponent whose certificate re-verifies independently; the operation
    count and peak memory attributable to each of polynomial selection, relation
    collection, linear algebra and individual logarithm, together with the
    unattributed remainder; the dimensionless ratio of observed to modelled cost per
    phase, with the model transcribed from a primary source before any run; and the
    slope of that ratio against field size, which is the calibration proper. No
    attack is claimed, no deployed parameter set is evaluated, and no security
    consequence follows from any outcome.
  what_this_is_not:
    - >-
      Not an attack on any deployed pairing-friendly curve and not a security
      evaluation of any parameter set. Small-field discrete logarithms are routine;
      the deliverable is the anchor, not the computation.
    - >-
      Not an extrapolation. No number produced here is evaluated at a deployment-sized
      field by this contract, and any later extrapolation is a separate record with
      its own stated transfer assumptions.
    - >-
      Not a validation of the asymptotic model. Three toy sizes cannot confirm an
      asymptotic expression; they can only measure the ratio against it over the
      range executed.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run has
      been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope. At the three executed field sizes with the executed
      tower shape, solver and budget, the certified exponent was or was not obtained;
      each phase carried a stated operation count and peak memory with a stated
      unattributed remainder; and the observed-to-modelled ratio per phase took stated
      values with a stated slope against size. WHAT DOES NOT FOLLOW. No cost figure at
      any field size not executed; no validation of the asymptotic model outside the
      executed range; no security level for any deployed curve; and specifically NOT
      that the measured slope continues beyond the largest executed size, which is a
      separate extrapolation requiring its own approval and its own evidence.
  inputs:
    procedure: >-
      STAGE 0, reading, BLOCKING, zero compute. Transcribe the per-phase asymptotic
      cost model from a primary source with a quoted excerpt, a page reference and a
      content hash, and record the exact expression to be evaluated per phase. Declare
      the operation unit per phase. If no primary source can be obtained, the
      calibration arm is reported UNRUN under AGENTS.md rule 5, only the measured
      columns are emitted, and no ratio is reported anywhere.
      STAGE 1, minutes. Build the tower at the smallest size, run the known-answer
      self-consistency arm - take a random known power of the generator and recover
      its exponent through the identical pipeline - and require the pipeline to return
      the known exponent exactly. A failure ends the run.
      STAGE 2, hours. Full pipeline at the smallest size across the declared seeds,
      with per-phase instrumentation active. Emit the certificate and re-verify it in
      the separate verifier.
      STAGE 3, hours. Repeat Stage 2 at the middle size.
      STAGE 4, hours, the budget-dominant stage. Repeat Stage 2 at the largest size.
      A size that does not complete inside its share of the budget is recorded as a
      budget outcome with its partial per-phase counts, never as a negative result.
      STAGE 5, zero compute. Emit the anchor table with measured and modelled columns
      kept separate, the unattributed-fraction column, the per-phase peak-memory column
      reconciled against the analytic size of the dominant structure, and the fitted
      ratio-trend slope per phase with intervals.
    instrument: >-
      Python 3.11 with numpy for linear algebra over the appropriate ring; NO
      dependency on any solver whose internals cannot be instrumented per phase. A new
      standalone driver under experiments/EXP-PAIR-a5c19e/driver/ implements the tower
      arithmetic, polynomial selection, relation collection, linear algebra and the
      individual logarithm, each behind an instrumented boundary that records operation
      counts and peak resident bytes for that phase alone. A SEPARATE re-verifier,
      importing only the tower arithmetic and not the solver, checks each claimed
      exponent by exponentiation. Recorded through harness/runner.py.
    parameters: >-
      Tower shape fixed at k = 6, built as a degree-2 extension of a degree-3
      extension, identical at all three sizes. Base primes of approximately 8, 12 and
      16 bits, giving fields of approximately 48, 72 and 96 bits; the exact primes are
      selected before the first run, recorded in the manifest, and not changed
      afterwards. Target element of known prime-order subgroup at each size. Three
      seeds per size. Operation unit is one base-field multiplication, counted per
      phase.
  controls:
    - >-
      SELF-CONSISTENCY, mandatory and blocking. At every size, recover the logarithm
      of a random KNOWN power through the identical pipeline and require the known
      exponent to be returned. An instrument that cannot recover a planted answer
      cannot support any measurement, and a failure voids that size entirely.
    - >-
      INDEPENDENT CERTIFICATE RE-VERIFICATION. Every claimed exponent is re-verified
      by exponentiation in a module that shares no state with the solver, per
      docs/claims-and-verification.md. A certificate that fails makes the run
      completed_invalid.
    - >-
      PHASE ISOLATION. Relation collection, linear algebra and individual logarithm
      are timed, counted and memory-profiled separately, because the model is stated
      per phase and a merged number cannot calibrate it. The unattributed remainder is
      reported as its own column rather than distributed across phases.
    - >-
      NULL OBJECT OF THE SAME SHAPE. A field of the same total bit size but a
      DIFFERENT tower shape - the prime field of matched size - run through the
      matched-cost baseline. The per-phase ratios must differ between the two; if the
      instrument returns the same ratio profile for a genuinely different shape, it is
      measuring the implementation rather than the field and no shape-specific claim
      may be made.
    - >-
      MODEL DECLARED FIRST. The modelled column is computed from the Stage 0
      transcription and committed BEFORE the measured column is looked at, so no
      modelled value can be tuned toward an agreeable ratio.
    - >-
      ANALYTIC MEMORY RECONCILIATION. The dominant data structure of the linear-algebra
      phase is sized analytically from the relation count and the ring, and the measured
      peak resident bytes are reported beside that size, not instead of it.
  independent_variables:
    - base field size, three levels at fixed tower shape
    - 'phase: polynomial selection / relation collection / linear algebra / individual logarithm'
    - seed
    - 'field shape: k = 6 tower / matched-size prime field (null arm)'
  metrics:
    primary:
      - >-
        Certificate verification result per size and seed, boolean. Computed by the
        independent re-verifier exponentiating the recovered exponent and comparing
        against the target element.
      - >-
        Operation count per phase per size, in base-field multiplications. Computed by
        an in-phase counter incremented at the arithmetic boundary, reported per phase
        with the unattributed remainder as a separate entry.
      - >-
        Unattributed cost fraction per size, dimensionless. Computed as total counted
        operations minus the sum of the per-phase counts, divided by total counted
        operations.
      - >-
        Observed-to-modelled ratio per phase per size, dimensionless. Computed as the
        measured operation count divided by the Stage 0 model expression evaluated at
        the same parameters, reported with a seed-derived interval and NEVER quoted
        without naming its phase.
      - >-
        Ratio-trend slope per phase, dimensionless. Computed as the least-squares slope
        of log ratio against log field size across the three sizes, with an interval
        from the seed spread.
    secondary:
      - >-
        Peak resident bytes per phase per size, measured, reported beside the
        analytically derived size of that phase's dominant structure.
      - >-
        Wall-clock seconds per phase per size, reported separately from operation
        counts and never substituted for them.
      - >-
        Relation count collected and the rank of the resulting system per size, since a
        rank-deficient system inflates the relation-collection phase without inflating
        its useful output.
      - >-
        Null-arm per-phase ratio profile at the matched-size prime field.
      - >-
        Count of sizes that did not complete inside their budget share, with their
        partial per-phase counts.
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The observed-to-modelled ratio per phase at each of the three sizes, and the
      fitted slope of log ratio against log field size per phase.
    formula: >-
      Predicted order-of-magnitude agreement at best, with the relation-collection
      ratio closer to 1 than the linear-algebra ratio at every size. Predicted ratio
      NOT constant across sizes - at least one phase's slope interval excludes zero.
      Under the null that the model's constants already absorb the size dependence at
      this scale, every phase's slope interval contains zero and the ratio is flat,
      which the parent proposal records in advance as the surprising and more valuable
      outcome. Predicted unattributed cost fraction below 0.15 at every completed size.
    source: >-
      Pre-registered in the parent proposal IDEA-20260809-15e1cd, predictions block,
      before any run under this contract exists. The MODELLED column additionally
      depends on the Stage 0 transcription, which is itself frozen before the measured
      column is computed.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at approximately 48, 72 and 96 total field bits, far below any deployed
      pairing target, because the anchor's purpose is to pin constants where the whole
      computation is completable and certifiable. The tower SHAPE is held fixed at the
      deployed shape's structure so that the size dependence is isolated from the shape
      dependence; that is the design's only claim to relevance and it is a claim about
      what the measurement isolates, not about what it predicts. The transfer
      assumption - that a ratio trend measured over 48 to 96 bits says anything about
      deployment-sized fields - is NOT made by this contract and is explicitly out of
      scope.
    correspondence: null
  tail_checks:
    - >-
      Report the longest single phase at each size against the median across seeds; a
      phase whose spread across three seeds exceeds a factor 4 has an unstable cost and
      its ratio may not be quoted as a point.
    - >-
      Report the rank deficiency of the relation system per size; a deficient system
      means relation collection was charged for relations that did not contribute.
    - >-
      Report the memory high-water mark of the largest size against the analytic size
      of the dominant structure; a factor above 4 means the dominant structure was
      mis-identified and the memory column is not calibrating what it claims.
    - >-
      Report every phase whose operation count is zero or missing, since a silently
      un-instrumented phase appears as unattributed cost and would otherwise be read as
      a small phase.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 8.0
    maximum_memory_gb: 16
    maximum_runs: 24
  stopping_rules:
    - >-
      Abort the size if the known-answer self-consistency arm returns a wrong exponent;
      that size produces no measurement.
    - >-
      Abort the calibration arm entirely if Stage 0 cannot transcribe the model from a
      primary source; emit the measured columns only and report the ratio arm UNRUN.
    - >-
      Stop a size at its budget share and record it as a budget outcome with partial
      per-phase counts. Do not extend the budget to force completion, and do not report
      the incompletion as a hardness result.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion
      is a stop, never a negative result, under AGENTS.md rule 5.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence.
    - >-
      Any claimed exponent whose certificate fails independent re-verification makes
      the run completed_invalid, per docs/claims-and-verification.md.
    - >-
      A run whose per-phase instrumentation was inactive, or whose null arm was not
      executed in the same invocation as the signal arm, is invalid_measurement.
    - >-
      A run whose modelled column was computed after the measured column was inspected
      is invalid_measurement, because the ordering control is the only thing preventing
      a tuned ratio.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT experiment and
      requires a new contract; it is never a repair of this one.
  success_criterion: >-
    The run is successful when, at every size that completes, a certified exponent is
    obtained and re-verified independently, the self-consistency arm passes, per-phase
    operation counts and peak memory are reported with the unattributed fraction, and
    - if Stage 0 succeeded - the per-phase observed-to-modelled ratios and the fitted
    trend slopes are reported with intervals. Success means a DECIDABLE run. The
    hypothesis H-PAIR-04cff7 is confirmed only if, in addition, all three sizes
    complete, the unattributed fraction is below 0.15 everywhere, and at least one
    phase's slope interval excludes zero.
  falsification_criterion:
    - >-
      A certificate fails independent re-verification, or the self-consistency arm
      returns a wrong exponent. The pipeline is wrong; the run set is INVALID, not
      negative, and no anchor is reportable from it.
    - >-
      The unattributed cost fraction exceeds 0.15 at any completed size. Limb A2 of the
      hypothesis is FALSE - the phases did not separate and no per-phase calibration
      exists. Only a total-cost anchor may be reported.
    - >-
      Every phase's ratio-trend slope interval contains zero. Limb A3 is FALSE; the
      ratio is flat over the tested range and a single-size anchor would have been
      sufficient. This is a genuine negative and is recorded as one.
    - >-
      The null arm at the matched-size prime field returns the same per-phase ratio
      profile as the tower arm within intervals. The instrument is measuring the
      implementation rather than the field shape, and no shape-specific statement may be
      made from any arm.
    - >-
      No certified exponent at any size within budget. Limb A1 is UNRESOLVED on
      infrastructure grounds under AGENTS.md rule 5; the calibration is recorded as
      unavailable and every later extrapolation by this goal must say so. This is not a
      mathematical negative.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model
      and inference block, environment, the selected primes, and the declared operation
      unit per phase.
    - >-
      raw-result.json carrying every per-phase, per-seed, per-size measurement, not
      summaries.
    - >-
      The solution certificate for every claimed exponent, plus the independent
      re-verifier's transcript.
    - >-
      The Stage 0 transcription of the cost model with its quoted excerpt, page
      reference and content hash, or a recorded failed-fetch receipt.
    - >-
      The frozen modelled column, hashed before the measured column was computed.
    - >-
      The null-arm measurements, in the same file as the signal arm.
    - >-
      The analytic sizing of each phase's dominant data structure, beside the measured
      peak.
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution, and under this engagement
      approval is the USER's gate because it authorizes execution and spends compute.
      This contract is review_required and is NOT approved; approved_by is null and
      execution_authorized is false.
    - >-
      Stage 0 is BLOCKING for the calibration arm. Approval to run the measured columns
      does not authorize reporting any ratio without a transcribed primary source.
    - >-
      This is a cost-model measurement contract, so the measured and modelled columns
      must be reviewed as separate columns; a reviewer who finds them mixed in any
      deliverable should reject the deliverable rather than reconcile it.
  derivation_provenance:
    tool: coordinator subagent, design-experiment step
    source_record: IDEA-20260809-15e1cd
    authored_at: '2026-08-25'
    note: >-
      The parent proposal is short and specifies the design at the level of three
      sizes, one shape, per-phase separation and a certificate. The phase list, the
      operation unit, the 0.15 unattributed-fraction bound, the trend-slope statistic,
      the null arm at matched size and the ordering control are coordinator additions
      made to render the parent's falsification conditions decidable from stated
      metrics; each is flagged in derivation_gaps where it is a tolerance rather than a
      derived quantity. Budgets come from the parent's declared cost of medium
      implementation and compute hours at the largest size.
  derivation_gaps:
    - >-
      The cost model itself is NOT in this contract. The parent proposal's only source
      reference is recalled and unread. Stage 0 is therefore blocking, and a run that
      cannot complete it produces measured columns and no ratios at all.
    - >-
      The 0.15 unattributed-fraction bound is a coordinator-set tolerance, not derived.
      It is pre-registered here so it cannot be adjusted after the measurement.
    - >-
      The exact base primes and the polynomial-selection strategy are left to be fixed
      before the first run and recorded in the manifest; different strategies have
      different constants and a strategy changed mid-run makes the three sizes
      incomparable.
    - >-
      The linear-algebra method (whether a sparse iterative method or dense elimination)
      is not fixed here and materially changes both the operation count and the memory
      column. A Coordinator must fix it before approval, because choosing it after
      seeing the smallest size's cost would make the trend an artifact of the choice.
    - >-
      Whether the individual-logarithm phase should be charged its own descent
      sub-phases is unsettled; if it is not decomposed, its ratio mixes two modelled
      terms and must be labelled as a merged phase rather than reported as one.
