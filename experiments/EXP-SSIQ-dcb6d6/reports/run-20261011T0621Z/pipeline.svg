<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">SSIQ successor execution pipeline</title>
  <desc id="desc">The published admission and launch record were reached, but the Sage process stopped at the pre-exec guard before scientific output or checker output.</desc>
  <style>
    .box { stroke: #263238; stroke-width: 2; rx: 14; }
    .pass { fill: #d9f2e6; }
    .written { fill: #e3eefb; }
    .stop { fill: #fde2e2; }
    .missing { fill: #f3f0e5; }
    .label { font: 22px sans-serif; fill: #17202a; text-anchor: middle; }
    .small { font: 17px sans-serif; fill: #37474f; text-anchor: middle; }
    .arrow { stroke: #546e7a; stroke-width: 3; marker-end: url(#arrow); }
    .dash { stroke: #9e9e9e; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#546e7a"/>
    </marker>
  </defs>
  <rect x="20" y="28" width="1160" height="370" fill="#ffffff" stroke="#cfd8dc" stroke-width="2" rx="18"/>
  <text x="600" y="62" class="label" style="font-weight:bold">EXP-SSIQ-dcb6d6 · RUN-SSIQ-e489dd</text>
  <rect class="box pass" x="55" y="125" width="235" height="135"/>
  <text x="172" y="170" class="label">Published</text>
  <text x="172" y="201" class="label">admission</text>
  <text x="172" y="232" class="small">dispatcher + claim passed</text>
  <line class="arrow" x1="290" y1="192" x2="335" y2="192"/>
  <rect class="box written" x="340" y="125" width="235" height="135"/>
  <text x="457" y="170" class="label">Launch record</text>
  <text x="457" y="201" class="label">written</text>
  <text x="457" y="232" class="small">launch.json + receipt</text>
  <line class="arrow" x1="575" y1="192" x2="620" y2="192"/>
  <rect class="box stop" x="625" y="125" width="235" height="135"/>
  <text x="742" y="170" class="label">Pre-exec guard</text>
  <text x="742" y="201" class="label">stopped</text>
  <text x="742" y="232" class="small">RLIMIT_AS preexec_fn</text>
  <line class="dash" x1="860" y1="192" x2="905" y2="192"/>
  <rect class="box missing" x="910" y="125" width="235" height="135"/>
  <text x="1027" y="170" class="label">Scientific stage</text>
  <text x="1027" y="201" class="label">not reached</text>
  <text x="1027" y="232" class="small">no manifest/raw/check result</text>
  <text x="600" y="345" class="small">Recorded receipt: infrastructure_error · “Exception occurred in preexec_fn” · no scientific process output</text>
</svg>
