<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">SSIQ Linux run pipeline and stop point</title>
  <desc id="desc">Run RUN-SSIQ-16ccff passed dispatch and supervisor startup, entered the implementation, then stopped in Sage isogeny enumeration with a field coercion TypeError. Raw result and independent check artifacts were not produced.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#102a43" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="620" fill="#f7fafc"/>
  <text x="60" y="55" font-family="sans-serif" font-size="28" font-weight="700" fill="#102a43">SSIQ Linux successor run: execution path</text>
  <text x="60" y="84" font-family="sans-serif" font-size="16" fill="#52606d">RUN-SSIQ-16ccff · EXP-SSIQ-dcb6d6 · observation record, not an evidence review</text>

  <g filter="url(#shadow)">
    <rect x="60" y="145" width="190" height="100" rx="12" fill="#d9f2e6" stroke="#2f855a" stroke-width="2"/>
    <text x="155" y="180" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#22543d">Admission</text>
    <text x="155" y="207" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#22543d">passed</text>

    <rect x="300" y="145" width="190" height="100" rx="12" fill="#d9f2e6" stroke="#2f855a" stroke-width="2"/>
    <text x="395" y="180" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#22543d">Linux supervisor</text>
    <text x="395" y="207" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#22543d">started</text>

    <rect x="540" y="145" width="190" height="100" rx="12" fill="#d9f2e6" stroke="#2f855a" stroke-width="2"/>
    <text x="635" y="180" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#22543d">Implementation</text>
    <text x="635" y="207" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#22543d">entered</text>

    <rect x="780" y="125" width="300" height="140" rx="12" fill="#fff5f5" stroke="#c53030" stroke-width="3"/>
    <text x="930" y="164" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#742a2a">Sage enumeration</text>
    <text x="930" y="192" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#742a2a">failed at ℓ = 3</text>
    <text x="930" y="218" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#742a2a">Rational Field → GF(53) coercion</text>
    <text x="930" y="242" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#742a2a">TypeError</text>
  </g>

  <path d="M250 195 H300" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M490 195 H540" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M730 195 H780" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M930 265 V350" stroke="#c53030" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="660" y="365" width="540" height="150" rx="12" fill="#fffaf0" stroke="#b7791f" stroke-width="2"/>
    <text x="930" y="402" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#744210">Recorded artifact boundary</text>
    <text x="690" y="432" font-family="sans-serif" font-size="15" fill="#744210">✓ stdout.log and stderr.log retained</text>
    <text x="690" y="458" font-family="sans-serif" font-size="15" fill="#744210">✗ raw-result.json and manifest.yaml absent</text>
    <text x="690" y="484" font-family="sans-serif" font-size="15" fill="#744210">— checker not started; no measured values</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="365" width="520" height="150" rx="12" fill="#edf2f7" stroke="#718096" stroke-width="2"/>
    <text x="320" y="402" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#2d3748">Run accounting</text>
    <text x="90" y="432" font-family="sans-serif" font-size="15" fill="#2d3748">Requested: 1 · completed: 0 · failed: 1</text>
    <text x="90" y="458" font-family="sans-serif" font-size="15" fill="#2d3748">Timed out: 0 · samples: 0</text>
    <text x="90" y="484" font-family="sans-serif" font-size="15" fill="#2d3748">Elapsed wall time (derived): 11.740 s</text>
  </g>

  <text x="60" y="575" font-family="sans-serif" font-size="14" fill="#52606d">Figure 1. Pipeline diagram from recorded supervisor events; the run stopped before any SSIQ census quantity was emitted.</text>
</svg>
