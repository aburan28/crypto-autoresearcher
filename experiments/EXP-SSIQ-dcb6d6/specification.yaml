experiment:
  id: EXP-SSIQ-dcb6d6
  hypothesis_id: H-SSIQ-4baf2b
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  source_idea: IDEA-20261007-20ae4e
  version: 1
  designed_at: '2026-10-10'
  title: >-
    Geometric kernel-polynomial degree and codomain-j census at F_53
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-10'
  frozen: true
  execution_authorized: true
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261010-21d5d6
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      One geometric outgoing kernel census on each frozen curve in
      characteristic 53, using only prime degrees 3, 5, and 7.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false
      applied: true
  claim_tier: toy
  objective: >-
    Enumerate every geometric outgoing cyclic kernel of prime order
    3, 5, and 7 from the fixed target and null curves in
    characteristic 53. Compare the target's total kernel-polynomial
    degree S with the number J of distinct codomain j-invariants.
    The null is reported with the same procedure but does not choose
    the target reading row.
  inputs:
    base_field: F_53
    geometric_field: >-
      An exact Sage algebraic closure of F_53, with the Sage version,
      defining polynomial, and embeddings of every finite subfield
      used to encode an output coefficient or j value recorded in the raw
      result. Kernel and codomain equality is tested in that same
      closure, not by comparing decimal or truncated strings.
    target_curve:
      equation: y^2 = x^3 + x + 6
      a: 1
      b: 6
      discriminant_factor_mod_53: 22
    null_curve:
      equation: y^2 = x^3 + 2x + 3
      a: 2
      b: 3
      discriminant_factor_mod_53: 10
    prime_degrees: [3, 5, 7]
    scope: >-
      All geometric outgoing separable isogenies with cyclic kernel
      of order ell, modulo post-composition by an isomorphism. The
      row key is (curve arm, ell, monic kernel polynomial). A dual
      or reversed edge is not an additional outgoing kernel.
    enumeration: >-
      Use exact Sage prime-degree isogeny enumeration over the
      algebraic closure, inspect each actual kernel polynomial and
      codomain, and compare exact j-invariants in the common
      closure. Do not replace enumeration with the ell+1 count or
      use only modular-polynomial roots as kernel rows: different
      kernels can share a codomain j. Record the exact polynomial
      and exact j representation in a form the checker can replay.
    driver: experiments/EXP-SSIQ-dcb6d6/implementation/run.py
    checker: experiments/EXP-SSIQ-dcb6d6/implementation/check.py
  controls:
    - id: nonsingular
      statement: >-
        Check 4*a^3+27*b^2 modulo 53 equals 22 for the target and
        10 for the null; either zero or a mismatch voids the arm.
    - id: complete-geometric-kernels
      statement: >-
        On each arm, exhibit exactly ell+1 distinct monic kernel
        polynomials for each ell: 4 at 3, 6 at 5, and 8 at 7.
        Count polynomials, not distinct codomain j values.
    - id: kernel-degree-and-order
      statement: >-
        Every row has a separable cyclic kernel of order ell, its
        monic polynomial has degree (ell-1)/2, and the isogeny
        degree is ell. A mismatch voids the arm.
    - id: codomain-verification
      statement: >-
        For every row, check the exact codomain j obtained from its
        exhibited isogeny against the degree-ell modular-polynomial
        relation. A failed check voids the row rather than altering
        its j value. A modular-polynomial root without its kernel
        remains insufficient to create a row.
    - id: null-symmetry
      statement: >-
        The null uses the same closure, degree set, enumeration,
        row key, completeness and codomain checks as the target.
  independent_variables:
    - curve arm, target or null
    - prime degree ell in {3, 5, 7}
  metrics:
    primary:
      - id: target_S
        statement: Sum of monic kernel-polynomial degrees over all target rows.
      - id: target_J
        statement: Number of distinct target codomain j values in the common closure.
      - id: target_threshold_comparisons
        statement: >-
          Exact integer comparisons of target_S against
          3*max(1,target_J) and 4*max(1,target_J).
    secondary:
      - id: null_S_and_J
        statement: The same S and J for the null, reported without a success threshold.
      - id: per_degree_kernel_counts
        statement: Actual distinct kernel count and expected ell+1 on each arm.
      - id: complete_row_table
        statement: >-
          Arm, ell, exact monic kernel polynomial, kernel degree,
          isogeny degree, exact codomain j, and validation flags for
          every outgoing kernel.
      - id: field_and_resource_record
        statement: >-
          Exact finite-field construction and embeddings, Sage
          version, wall time, CPU time, and peak memory.
  heuristic_under_test: HEUR-1
  preregistered_prediction:
    quantity: target_S divided by max(1,target_J), compared exactly in integers
    formula: >-
      Positive if target_S >= 4*max(1,target_J). Negative if
      target_S <= 3*max(1,target_J). Strictly between those bounds
      is inconclusive. All readings require complete valid censuses
      on target and null and passing instrument controls.
    source: IDEA-20261007-20ae4e
  scale_relevance:
    tier: toy
    justification: >-
      One curve and one same-shape null in characteristic 53, with
      only degrees 3, 5, and 7. No transfer to larger primes or to
      the conditional p^{1/3+o(1)} time and memory exponent is made.
    correspondence: >-
      Direct exact enumeration of all geometric cyclic kernels in
      the algebraic closure; no sampled curve distribution.
  tail_checks:
    - >-
      Report all target and null row keys and the collision classes
      of equal codomain j, so J can be recomputed without a
      modular-polynomial root count.
    - >-
      Report per-degree count 4, 6, and 8 for both arms, along with
      the individual kernel-polynomial degree checks.
  replication:
    seeds: []
    independent_instances: 1
    future_run_slot: RUN-SSIQ-9fe433
    note: >-
      This is one deterministic complete census. The separate
      checker recomputes S, J, and the threshold comparisons from
      the raw rows; no random seed is used.
  budget:
    enforcement: advisory
    maximum_memory_gb: 4
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      Memory and process bounds protect the machine. A watchdog or
      resource stop is infrastructure, never a target inequality.
  stopping_rules:
    - Finish all three prime-degree cells on both curves before scoring the target.
    - Do not stop at a codomain collision or after one threshold appears determined.
    - Keep the curve equations, geometric scope, degrees, and thresholds fixed.
  invalidation_rules:
    - Any missing or duplicate kernel, failed ell+1 count, nonmonic or wrong-degree kernel polynomial, or failed codomain check voids its arm and the target comparison.
    - A timeout, crash, memory abort, or non-reconstructible field representation is infrastructure, not a negative result.
    - Counting a modular-polynomial root as a kernel without an exhibited kernel polynomial invalidates the row.
  success_criterion: >-
    Both geometric censuses are complete, every control passes,
    and target_S >= 4*max(1,target_J).
  falsification_criterion: >-
    Both geometric censuses are complete, every control passes,
    and target_S <= 3*max(1,target_J). A failed control or incomplete
    census is not this negative.
  inconclusive_criterion: >-
    Both geometric censuses are complete and valid, but
    3*max(1,target_J) < target_S < 4*max(1,target_J).
  decision_impact:
    on_positive: >-
      A later evidence review may record a kernel-polynomial degree
      sum at least four times the number of codomain labels for the
      specified target and degrees. This is a finite representation
      measurement and changes no time or memory exponent.
    on_negative: >-
      A later evidence review may record that the proposed ratio
      fails at this target and these degrees, weakening only the
      finite collision prediction in H-SSIQ-4baf2b.
    on_inconclusive: >-
      A later evidence review records the exact ratio and keeps the
      hypothesis unresolved at its frozen thresholds.
  required_artifacts:
    - experiments/EXP-SSIQ-dcb6d6/runs/RUN-SSIQ-9fe433/manifest.yaml
    - experiments/EXP-SSIQ-dcb6d6/runs/RUN-SSIQ-9fe433/raw-result.json
  run_report: >-
    After the run records are sealed and pushed, the run session
    creates its observation report, quantitative graph with source,
    and inspected PDF in a fresh experiments/EXP-SSIQ-dcb6d6/reports/
    run-<UTC timestamp>/ directory under the research-visuals skill.
    These derived files are not added to the sealed run directory.
  assigned_to: executor
