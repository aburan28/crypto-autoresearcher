# EXP-SSIQ-fd9875
# Thinning-count arithmetic. No divisor set is enumerated.
# Approved by DEC-20261003-5ad460.
experiment:
  id: EXP-SSIQ-fd9875
  hypothesis_id: H-SSIQ-310450
  source_idea: IDEA-20260930-0d7c7d
  question_id: RQ-SSIQ-9702af
  version: 1
  title: List exponent versus one fourth
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-5ad460
  objective: >-
    Check the cross 1, the difference 1/6, and the quotient 500.
  inputs:
    list_cross: 1
    square_cross: 1
    gap_num: 1
    gap_den: 6
    twelfth_cross: 6
    pareto_cross: 8
    pareto_gap_den: 2
    illustration: 1000
    floor: 5
    excess: 995
    nearby: 2
    illustration_quot: 500
  controls:
    - >-
      The cross of 1/3 against 1/4 is 1. Reporting the list exponent
      as 1/4 drops that cross and invalidates the run.
    - >-
      Two thirds minus one half is 1/6. The cross of 2/3 against 1/2
      is 1. The cross of 1/6 against 1/12 is 6. Seven fourths exceeds
      five fourths by cross 8, and the difference is 1/2.
    - >-
      One thousand exceeds 5 by 995. One thousand divided by 2 is
      500. The nearby split count is 2.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {exponent, pareto, illustration}
    - route in {cross, divide}
  metrics:
    primary:
      - list_cross
      - gap_den
      - illustration_quot
      - implementations_agree
    secondary:
      - twelfth_cross
      - pareto_cross
      - excess
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The cross of 1/3 against 1/4 is 1. Two thirds minus one half
      is 1/6. One thousand divided by 2 is 500.
    formula: >-
      Cross 1/3 with 1/4. Subtract 1/2 from 2/3. Divide 1000 by 2.
      Cross 7/4 with 5/4.
    source: >-
      IDEA-20260930-0d7c7d states the exponents 1/3, 1/4, 1/6, and
      1/12, the factors 7/4 and 5/4, the illustration 1000, the
      floor 5, and the nearby split count 2, read 2026-10-03. The
      prime is not named as an integer. The products were recomputed
      in this design session. That computation is not a run. No
      divisor set was enumerated.
  scale_relevance:
    tier: toy
    justification: Four written exponents and one written illustration count. No transfer to a gain.
    correspondence: null
  tail_checks:
    - The difference 1/6 and the quotient 500 are required. A check that stops at the cross 1 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the cross 1 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The list cross is not 1.
    - The difference is not 1/6.
    - The quotient is not 500.
    - The list exponent is reported as 1/4, or a divisor set is enumerated.
  success_criterion: >-
    Both runs agree that the cross of 1/3 against 1/4 is 1, that 2/3
    minus 1/2 is 1/6, that 7/4 exceeds 5/4 by cross 8, and that 1000
    divided by 2 is 500.
  falsification_criterion: >-
    The runs agree that the cross of 1/3 against 1/4 is computed,
    and that cross is not 1.
  required_artifacts:
    - experiments/EXP-SSIQ-fd9875/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-SSIQ-fd9875/runs/<RUN-ID>/command.txt
    - experiments/EXP-SSIQ-fd9875/runs/<RUN-ID>/stdout.log
    - experiments/EXP-SSIQ-fd9875/runs/<RUN-ID>/stderr.log
    - experiments/EXP-SSIQ-fd9875/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-SSIQ-fd9875/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any divisor enumeration, list generation, or gain measurement.
    - Any claim that a list exponent moves.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
