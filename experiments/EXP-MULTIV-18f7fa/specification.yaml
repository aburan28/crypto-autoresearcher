experiment:
  id: EXP-MULTIV-18f7fa
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-0f7694; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-0f7694
  question_id: RQ-QRUOV-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Dose-response sweep of quotient-ring structure inside a single toy UOV key: first-fall degree
    and solver cost against the number of A-linear blocks, with the zero-dose arm as the internal
    null.'
  objective: 'The uncertainty reduced is whether quotient-ring structure acts on key-recovery difficulty
    as a threshold or as a gradient at toy parameters. Stated as parts: (i) the run constructs keys
    at eleven structure doses from a single generator, so the unstructured null is the j = 0 point
    of the same curve and cannot differ from the structured arms for any reason except dose, which
    is what a separately built matched instance can never guarantee; (ii) it measures, per key, the
    count of independent derived A-multiplication equations, the Macaulay rank profile up to a pre-fixed
    degree cap, the first-fall degree, and solver cost in field operations, so that a cost effect
    without a degree effect is distinguishable from a genuine algebraic effect; (iii) it checks the
    j = 0 arm against the independently derived plain-UOV expectation recorded in H-UOV-4d1377, which
    makes the instrument self-validating, and checks the full-dose arm against the m*ell derived-equation
    count recorded in IDEA-20260808-c959c7, which anchors the other endpoint. The run recovers no
    key of any deployed scheme, claims no exponent, and produces one curve with intervals whose shape
    - flat, stepped, or graded - is the entire deliverable.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supported scope is: at the named toy (q, ell, V,
      M) with one solver lineage and one planted-oil-module protocol, the first-fall degree and measured
      solver cost of the derived key-recovery system behave as the reported curve in the structure
      dose, with stated intervals over 30 keys per dose. What does NOT follow: nothing about deployed
      QR-UOV parameter sets; no attack, no exponent, and no security consequence; no claim that a
      threshold located here is located anywhere else; and, if the curve is flat, no claim that structured
      compression is security-neutral - only that no dose effect was measurable at these parameters
      with this instrument.'
  inputs:
    procedure: 'STAGE 0, construction freeze (cost: human): fix the W-pairing, the block layout, the
      planting protocol and the degree cap in the run log before any key is generated. STAGE 1, generator
      build (cost: medium): one generator taking dose j as an argument, producing every arm including
      j = 0; unit tests confirm the j = 0 output has no A-linear block and the full-dose output has
      only A-linear blocks. STAGE 2, certificate gate (cost: seconds per key): verify by exhaustive
      evaluation that the planted oil module is annihilated; a key failing this is discarded and counted,
      never silently replaced. STAGE 3, instrument checks (cost: minutes): j = 0 arm against the plain-UOV
      expectation, full-dose arm against the m*ell equation count; abort on either mismatch. STAGE
      4, main sweep (cost: hours): 11 doses by 30 keys by 3 field sizes by 2 algebra dimensions, interleaved
      and paired-seeded. STAGE 5, controls (cost: hours): pattern-only arm at every dose. STAGE 6,
      analysis (cost: minutes): per-dose intervals, monotonicity test, slope fit for the equation
      count, and the threshold location or its absence.'
    instrument: Python 3 with exact F_q arithmetic via precomputed tables for q in {7, 11, 13}; polynomial
      arithmetic modulo f implemented directly; Macaulay matrix construction and rank by Gaussian
      elimination over the field tables, written for this experiment and shared identically by all
      arms; solver cost counted as field operations by an instrumented elimination routine rather
      than measured in seconds. No computer algebra system and no Sage. Driven by harness/runner.py
      for seeds, manifests and the inference block; the derived-equation counter is a separate module
      that sees only the public map.
    parameters: q in {7, 11, 13}; ell in {2, 3}; V in {4, 5}; M = 2; dose j from 0 to V(V+1)/2 in
      unit steps (11 doses at V = 4, 15 at V = 5); 30 independently seeded keys per (q, ell, V, M,
      j) cell; Macaulay degree cap 4 at V = 4 and 3 at V = 5; oil module of A-rank M planted identically
      in every arm. Total keys bounded at 30 * 11 * 3 * 2 = 1980 at V = 4 plus the V = 5 slice, with
      the pattern-only control doubling the count.
  controls:
  - Zero-dose arm (j = 0) as the built-in null, interleaved with every other dose in the same invocation.
  - 'Pattern-only control: blocks that share entries in the A-linear pattern but with entries drawn
    at random rather than from A, isolating sparsity and repetition from algebra.'
  - 'Fixed-oil-module control: identical planted oil module dimension across all doses, so the planting
    cannot vary with j.'
  - 'Seed-interleaving control: doses are run in randomized order with paired seeds so that machine
    state cannot correlate with j.'
  - 'Full-dose anchor: the j = maximum arm''s derived equation count must match the m*ell forced value
    recorded in IDEA-20260808-c959c7, or the construction is wrong.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is the j = 0 key: same field, same flattened dimensions,
    same planted oil module, same generator, same derivation code, differing only in that no block
    is A-linear. It is executed in the same invocation as every other dose, in interleaved order.
    For the signal arm to mean anything, the j = 0 arm must reproduce the plain-UOV first-fall degree
    already characterised by H-UOV-4d1377''s semi-regularity prediction to within its interval; if
    the zero-dose arm does not match the independently derived plain-UOV expectation, the instrument
    is measuring something else and no dose effect may be read. A second null replaces the A-linear
    blocks with random symmetric blocks that merely SHARE entries in the same pattern, giving a structure-shaped
    but algebra-free arm.'
  independent_variables:
  - structure dose j
  - field size q
  - algebra dimension ell
  - arm (structured, pattern-only control)
  - variable count V
  metrics:
    primary:
    - first-fall degree
    - Macaulay rank profile by degree
    - count of independent derived A-multiplication equations
    - solver cost in field operations
    secondary:
    - annihilation certificate pass rate
    - per-dose dispersion across keys
    - discarded-key count and reasons
    - wall clock per cell recorded as cost only
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The first-fall degree of the derived key-recovery system as a function of the structure
      dose j, and the count of independent derived A-multiplication equations as a function of j.
    formula: 'Predicted equation count: N(j) = j * (ell - 1) exactly, up to the saturation ceiling
      m*ell recorded in IDEA-20260808-c959c7, so N(j) = min(j*(ell-1), m*ell). Predicted degree law:
      D(j) is nonincreasing in j with D(0) equal to the plain-UOV semi-regular first-fall degree at
      the flattened dimensions, namely the index of the first non-positive coefficient of the series
      [(1 - z^2)^M / (1 - z)^N]_+ with M and N the flattened equation and variable counts. The predicted
      step location is not pre-committed and is the quantity being located.'
    source: Pre-registered in the parent proposal IDEA-20260816-0f7694 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at q <= 13, ell <= 3, flattened variable counts at most 15, chosen so every
      planted oil module is verifiable exhaustively and every Macaulay matrix at the degree cap fits
      comfortably in memory. The transfer assumption, stated explicitly and not relied upon: none
      is made. The curve is claimed only at these parameters, and any reader wanting a deployed-parameter
      statement must treat the extrapolation as unmeasured and open.'
    correspondence: null
  tail_checks:
  - dose j = 1, the minimal nonzero structure, where a threshold model predicts no effect and a gradient
    model predicts a small one
  - dose at the saturation ceiling where N(j) stops growing, whose location is forced by m*ell
  - ell = 2 versus ell = 3 at matched flattened dimensions, since the predicted slope depends on ell
  - the largest q tested, where q-analogue coincidences are weakest
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - abort if the j = 0 arm fails its plain-UOV instrument check
  - fix the Macaulay degree cap in advance and never raise it mid-run; hitting the cap is reported
    as a cost bound and never as negative mathematical evidence
  - stop the sweep at V = 5 if V = 4 wall clock exceeds four hours per field size
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Every dose from 0 to the maximum yields 30 certified keys with a measured first-fall
    degree and solver cost, both endpoints pass their independent instrument checks, and the resulting
    curve is reported with intervals whatever its shape.
  falsification_criterion:
  - The j = 0 arm disagrees with the plain-UOV expectation beyond its interval.
  - The full-dose derived-equation count disagrees with the forced m*ell ceiling.
  - The equation count is not linear in j below saturation.
  - The pattern-only control reproduces the structured arm's effect at full dose.
  - The curve is flat across all doses, falsifying the dose-effect claim at the tested scope.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-0f7694
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Whether a key with mixed A-linear and free blocks is a legitimate object of study or an artifact
    with no scheme-level meaning is a judgement a Coordinator must make explicitly before approval.
  - The planting protocol for an oil module that must be simultaneously A-linear on some blocks and
    unconstrained on others is sketched but not derived; it may not exist at every dose, and the contract
    needs that settled.
  - RQ-QRUOV-001 constrains experiment design pending primary sources; approval must state whether
    this counts as a construction-conditional measurement.
