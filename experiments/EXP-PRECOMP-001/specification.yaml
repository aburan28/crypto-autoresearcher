experiment:
  id: EXP-PRECOMP-001
  status: proposed
  title: Cross-target structural overlap in prime-field point decomposition
  objective: >-
    Quantify what fraction of Groebner/F4 solver structure remains identical
    when only the target point changes on a fixed ordinary prime-field curve.
  predecessor_evidence: [EXP-FCP-002, EXP-FCP-003, DEC-20260726-003]
  fixtures:
    field_bits: [11, 13, 16, 20, 24, 28, 32]
    curve_seeds: [1, 2, 3]
    targets_per_cell: 200
    decomposition_arities: [2, 3]
    target_policy: random plus planted decomposable targets where needed
  capture:
    - monomial_support_by_degree
    - critical_pair_sequence
    - Macaulay_dimensions_and_sparsity
    - reducer_selection
    - pivot_columns
    - basis_supports
    - degree_of_regularity_proxy
  metrics:
    primary: structural_reuse_fraction
    secondary: [pair_overlap, reducer_overlap, pivot_overlap, support_overlap, cold_seconds]
  controls:
    - fixed curve/factor-base/order/solver within each cell
    - target is the only changing input inside a comparison cell
    - independently verify every solution against the original system
  success_criterion: >-
    Median structural_reuse_fraction >= 0.80 at any >=20-bit cell and does not
    decrease monotonically over the next two larger completed sizes.
  strong_signal: median structural_reuse_fraction >= 0.95
  falsification_hook: >-
    Median reuse <=0.50 across all completed >=20-bit cells with no component
    showing an increasing trend.
  required_outputs: [raw-event-traces, summary.json, analysis.md]
  depends_on: []
