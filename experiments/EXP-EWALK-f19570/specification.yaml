experiment:
  id: EXP-EWALK-f19570
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-59fed3
  question_id: RQ-EWALK-8fa147
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'MIXING, NOT SPACE: on the Aut-quotient the step may choose WHICH orbit element to translate,
    as a function of the class, giving r*|Aut| distinct well-defined class maps from r stored table
    points -- so the walk should reach Teske''s ideal collision constant at a table |Aut| times smaller,
    while the derived fruitless-2-cycle rate 1/(|Aut|*r) is UNCHANGED by the same construction; the
    two predictions point in opposite directions, are measured in one run, and the honest ceiling
    is that the entire mixing axis is worth at most the ~20 percent Teske headroom that this program''s
    baseline has ALREADY SPENT, so the deliverable is table memory at fixed constant, not speed'
  status: draft
  objective: "(A) THE CONSTRUCTION, AND WHY IT IS WELL DEFINED WHERE THE OBVIOUS VARIANT IS NOT. On\
    \ the quotient by Aut of order m, a step must map classes to classes. The obvious \"apply phi\
    \ then translate\" map A |--> phi(A) + T_s is NOT well defined on classes: for sigma in Aut, phi(sigma\
    \ A) + T = sigma phi(A) + T, and sigma X + T is not Aut-related to X + T. What IS well defined\
    \ is to canonicalise FIRST and then choose an orbit element by a function of the class:\n  A |-->\
    \ sigma_{e([A])}( canon(A) ) + T_{s([A])},\nwhere canon is the canonical-representative map, s(.)\
    \ is the usual r-branch partition of classes, and e(.) is a SECOND partition of classes into m\
    \ cells selecting one of the m automorphisms. Every ingredient is a function of the class, so\
    \ the map descends to G/Aut and is memoryless in the sense van Oorschot-Wiener parallelisation\
    \ requires (KN-TECH-006). Exponent bookkeeping is unchanged in kind: canon contributes a known\
    \ scalar and sigma_e contributes a known scalar, so (a, b) |--> (u a + c_s, u b + d_s) with u\
    \ the product of the two known scalars mod N.\n(B) THE EFFECTIVE-BRANCH-COUNT CLAIM, WHICH IS\
    \ THE POINT AND IS SHARP. The map above realises r*m distinct affine class maps while storing\
    \ only r group elements. Teske's result, as recorded in KN-TECH-006, is that well-chosen r-adding\
    \ walks reach the ideal random-walk constant and that Pollard's original 3-branch map is about\
    \ 20 percent worse. So the claim is an EQUIVALENCE, pre-registered as an exact comparison rather\
    \ than as a vague improvement:\n  the orbit-choice quotient walk with r table points has the same\n\
    \  collision constant, within the bootstrap band, as the plain quotient\n  walk with r*m table\
    \ points.\nAt m = 6 that is a SIX-FOLD reduction in table size at equal walk quality. It is falsified\
    \ by a single (r, m) cell where the two disagree beyond the band.\n(C) THE DERIVED NULL INSIDE\
    \ THE SAME EXPERIMENT, POINTING THE OTHER WAY. Redo the immediate-undo derivation of IDEA-20260807-6355c6\
    \ for the orbit-choice map. With nu = sigma_{e([A])}, B = nu canon(A) + T_s, canon(B) = rho B,\
    \ and mu = sigma_{e([B])} rho, the next output is\n  C = mu nu canon(A) + mu T_s + T_{s'}.\n[C]\
    \ = [A] requires (mu nu - tau) canon(A) = -(mu T_s + T_{s'}) for some tau in Aut. The generic\
    \ branch is tau = mu nu together with T_{s'} = -mu T_s, an equation in the table alone. With a\
    \ generic (non Aut-stable) table this needs mu = -1 and s' = s. But rho is still the canon-selected\
    \ automorphism, still uniform on Aut and independent of e([B]), so P(mu = -1) = 1/m exactly as\
    \ before, and\n  rate = 1/(m r), UNCHANGED.\nTHIS IS A DERIVED NULL, NOT A HOPE. The orbit choice\
    \ is predicted to improve mixing and to leave the 2-cycle rate alone. A measured change in the\
    \ cycle rate refutes the (B1) branch model that both this record and IDEA-20260807-6355c6 rest\
    \ on, and that refutation would be the more valuable outcome because it would mean the dominant\
    \ cycle mechanism is not the one either record models.\n(D) THE CEILING, STATED BEFORE THE EXPERIMENT\
    \ SO IT CANNOT BE INFLATED AFTERWARDS. Mixing changes the CONSTANT, never the exponent (KN-TECH-005),\
    \ and the constant is bounded on both sides:\n  - Above, by the ideal random-map value 1.2533*sqrt(M)\
    \ on a class set of\n    size M = N/m. No memoryless walk collides sooner than a random map in\n\
    \    any way that helps, and IDEA-20260806-37eab9 derives the achievable\n    band as [1, ideal],\
    \ a factor strictly under 1.3.\n  - Practically, by the fact that THE HEADROOM IS ALREADY SPENT.\
    \ KN-TECH-006\n    records that Teske's r-adding walks REACH the ideal constant, about 20\n  \
    \  percent better than the 3-branch map. At r >= 20 this proposal's\n    mixing gain is therefore\
    \ EXACTLY ZERO on the collision constant, by\n    construction, and saying so up front is what\
    \ distinguishes this from a\n    proposal that would discover it after spending a batch.\n  So\
    \ the collision-constant gain is: up to about 20 percent at r in\n  {2, 3, 4}, converging to 0\
    \ as r approaches 20, and 0 beyond. The\n  DELIVERABLE IS NOT SPEED. It is table size: a factor\
    \ m fewer stored\n  points at equal quality, which is a memory and cache-locality constant in\n\
    \  exactly the deployment where rho constants are actually paid -- the\n  record computation of\
    \ KN-LIT-097 ran 3 rho cores per Spartan-6 FPGA and\n  up to 576 FPGAs, where per-core table storage\
    \ is a hard area constraint.\n\n(E) WHAT THIS IS NOT. Not an exponent claim. Not a space-size\
    \ claim: M is still N/m and the sqrt(m) ceiling of IDEA-20260807-ebcae6 is untouched. Not a claim\
    \ that the orbit choice is free: sigma_e costs 1-2 field multiplications on a j = 0 curve and\
    \ must be charged, and at m = 2 it costs a conditional negation and is nearly free but also nearly\
    \ pointless, since r*2 rarely crosses the Teske threshold from below."
  resource_label: R3 (End(E) as a ring -- its unit group Aut, used here as a source of step-map diversity
    rather than as a source of space reduction).
  admissibility: inadmissible_generic_group
  admissibility_argument: 'INADMISSIBLE. Every use of the automorphism is an application to points
    of G, which on a prime-order subgroup is multiplication by a known scalar (H-ENDO-001) and is
    exactly Oracle D of KN-FIND-b7e091, generic-group simulable and closed at exponent 1/2 (KN-TECH-005).
    Sharpened for this record: the orbit-choice map is a MEMORYLESS FUNCTION OF THE GROUP ELEMENT
    composed with known scalar multiplications and one group addition, so a generic-group simulator
    reproduces it step for step at O(log N) overhead per step. Nothing here escapes the model, and
    nothing is claimed to. The record is filed as a recorded closure with an obstruction named, plus
    a measurable constant-and-memory question inside the closed family, which is the brief''s stated
    legitimate deliverable for lane L6.'
  reachability_gate: DOES NOT MOVE BETWEEN CURVES. The construction runs on whatever curve it is given
    and its magnitude is set by |Aut| of that curve, which by T4 is fixed by the isogeny class through
    D_0. On a generic curve m = 2 and the effective-branch gain is a factor 2 in table size, which
    at r >= 10 is below measurement resolution; the mechanism is only interesting on the D_0 in {-3,
    -4} classes, and those are reachable only if the target is already in one -- 0 isogeny steps,
    or unreachable at any cost. As with the rest of L6 the reachability question is degenerate, and
    it is recorded rather than omitted so that the campaign's T5 accounting stays complete.
  inputs:
    procedure: 'STAGE 0 (zero compute): derivations, the r >= 20 zero-gain boundary, and the external-literature
      check on negation-map step-map engineering. STAGE 1 (hours, HARD GATE): implement; unit-test
      well-definedness over 10^4 points per family; verify the e = identity byte-identical regression
      against arm A. STAGE 2 (hours): the paired equivalence measurement on J0 (m = 6) at r in {2,
      3, 4} against arm A at r in {12, 18, 24}. THIS IS THE CHEAPEST DECISIVE CELL: m = 6 maximises
      the effect and small r is where Teske''s penalty is largest, so if the mechanism does not show
      there it does not exist. STAGE 3 (hours): the r = 96 zero-gain control and the cycle-rate null,
      both in the same runs. STAGE 4 (hours): charging and the net table-size-versus-arithmetic report.'
    mechanism: "STAGE 0 (zero compute). Write the well-definedness identity canon(sigma A) = canon(A)\
      \ and the exponent update (a, b) |-> (u a + c_s, u b + d_s); derive the effective-branch-count\
      \ claim (B) and the cycle-rate null (C); state the r >= 20 zero-gain boundary from KN-TECH-006\
      \ so no reader expects a speed win there.\nSTAGE 1 (implementation, HARD GATE). Extend the quotient\
      \ walk with a second partition e(.) into m cells. Unit-test well-definedness by asserting that\
      \ all m orbit elements of a random point produce the identical next class, over at least 10^4\
      \ random points on each of the three curve families. A single failure is an implementation defect\
      \ and blocks everything.\nSTAGE 2 (the equivalence measurement, the core). On GEN (m = 2), J1728\
      \ (m = 4) and J0 (m = 6), measure the empirical collision constant steps/sqrt(N/m) for:\n  arm\
      \ A: plain quotient walk with table size r, r in {2, 3, 4, 6, 8, 12,\n    16, 20, 24, 32, 48,\
      \ 96};\n  arm B: orbit-choice quotient walk with table size r, same grid.\nPRE-REGISTERED COMPARISON:\
      \ arm B at r must match arm A at r*m within the bootstrap band, at every r for which r*m is\
      \ in the grid. Report the paired differences, not two separate curves.\nSTAGE 3 (the derived\
      \ null, in the same runs). Instrument the immediate-undo events in both arms and compare the\
      \ measured 2-cycle rate against the derived 1/(m r) for BOTH arms. Pre-registered: the two arms\
      \ agree. A difference beyond a factor 1.5 refutes the (B1) model.\nSTAGE 4 (charging). Report\
      \ fully charged cost in F_p multiplications with the curve model named, including the sigma_e\
      \ evaluation and the normalisation inversion that canon requires, so the table-size saving is\
      \ reported net of the arithmetic it costs. A table-size win that costs more per step than it\
      \ saves in cache traffic is not a win and the record must be able to say so."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - arm A at r*m, paired on identical seeds (blocking)
  - e = identity byte-identical regression to arm A (blocking)
  - well-definedness unit test over all m orbit elements (blocking)
  - random-oracle class walk at the ideal constant (blocking)
  - r = 96 zero-gain nearby-object control
  - derived cycle-rate null in both arms
  - 'NULL OBJECT (from the proposal): MANDATORY, AND THIS PROPOSAL CARRIES ITS NULL INSIDE ITS OWN
    PREDICTIONS. (1) THE MATCHED PLAIN-TABLE NULL: arm A at table size r*m, run on the same curve,
    same seeds, same DP granularity, in the same batch. THE DECAY PARAMETER IS r. As r grows past
    the Teske threshold (about 16-20) the measured advantage of arm B at r over arm A at r MUST DECAY
    TO ZERO, because arm A is then already at the ideal constant and there is nothing left to gain.
    An advantage that persists at r = 96 is the canonical artifact tell -- it would mean arm B is
    beating the ideal random map, which IDEA-20260806-37eab9''s band derivation forbids, so it falsifies
    the instrument rather than the band. (2) THE DERIVED CYCLE-RATE NULL: the 2-cycle rate must be
    the SAME in both arms, at 1/(m r). This is a null the mechanism itself predicts, so the experiment
    cannot be read as confirmatory on both axes at once. (3) RANDOM-ORACLE WALK on classes, realising
    the ideal constant by construction, as the absolute reference both arms are measured against.'
  independent_variables: []
  metrics:
    primary:
    - collision constant steps/sqrt(N/m) with bootstrap interval, per arm, per r, per m, per size
    - stored-point count per arm (exact, not statistical)
    - realised distinct class-map count, measured rather than assumed
    - joint empirical distribution of (e_t, s_t), to test independence
    secondary:
    - per-step immediate-undo rate per arm
    - fully charged per-step cost in F_p multiplications, curve model named
    - censored fraction per cell, charged not dropped
  heuristic_under_test: null
  preregistered_prediction:
    quantity: collision constant of arm B at table size r versus arm A at table size r*m, paired on
      identical seeds
    formula: 'EQUAL within the bootstrap band at every (r, m) with r*m in the grid. This is an equivalence
      prediction: a difference beyond the band at any cell falsifies the effective-branch-count claim.
      Pre-registering it as an equality rather than an inequality is deliberate -- it is the only
      form that can fail in both directions.'
    source: pre-registered in IDEA-20260807-59fed3 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - PARTITION CORRELATION. If e and s are derived from the same hash bits, the realised map count
    is below r*m and the equivalence fails for reasons of implementation rather than mathematics.
    Measured directly via the joint distribution.
  - NORMALISATION COST. canon requires affine coordinates, hence an inversion; whether it is charged
    per step or amortised by simultaneous inversion changes the per-step comparison by more than the
    effect. Convention frozen before Stage 2.
  - TABLE-SIZE UNITS. "Table size" must be reported as stored GROUP ELEMENTS and as bytes, since arm
    B stores r points but also needs the e-partition evaluation; a byte comparison that omits the
    latter flatters arm B.
  - SMALL-r VARIANCE. At r = 2 the rho length distribution is very heavy-tailed; medians with bootstrap
    intervals, not means, and cells with overlapping intervals are reported as indistinguishable.
  - x-COORDINATE CLASS COUNTING would make m = 4 look like m = 2 and halve the predicted effect on
    J1728 (IDEA-20260807-ebcae6 observation collision).
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'EQUAL within the bootstrap band at every (r, m) with r*m in the grid. This is
    an equivalence prediction: a difference beyond the band at any cell falsifies the effective-branch-count
    claim. Pre-registering it as an equality rather than an inequality is deliberate -- it is the
    only form that can fail in both directions.'
  falsification_criterion:
  - The well-definedness unit test fails on any curve. Implementation defect; nothing is reported.
  - arm B at r does not match arm A at r*m within the band at any tested cell. The effective-branch-count
    claim is false as stated and the record is superseded rather than amended.
  - arm B shows a collision-constant gain at r = 96. Instrument failure, by the band derivation of
    IDEA-20260806-37eab9.
  - The measured 2-cycle rate differs between arms beyond a factor 1.5. The (B1) branch model is wrong;
    report the measured rates and the cycle-length histograms as the finding.
  - The realised distinct class-map count is materially below r*m, i.e. e and s are correlated. The
    construction is degenerate for that partition choice; report which choices degenerate.
  - Crashes, timeouts, memory exhaustion. INFRASTRUCTURE outcome under AGENTS.md rule 5, never negative
    mathematical evidence.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-59fed3
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
    than absent so a reader cannot mistake it for an overlooked one.'
