experiment:
  id: EXP-ICEX-a0b21a
  hypothesis_id: H-ICEX-8d9e17
  version: 1
  title: >-
    Within-curve and between-curve variance decomposition of the RQ-SIG-001
    cascade statistic at D = 3 and D = 4, with a blocking degeneracy gate and a
    graded planted between-curve offset
  status: draft
  objective: >-
    Measure the non-rewritable low-degree F5 signature count, and #G* against the
    generic m * d^{m-1}, on at least 20 curves from the declared panel with at
    least 5 generation seeds each, at D = 3 and D = 4; decompose the variance
    into within-curve and between-curve components with intervals; and compute
    the curve count a stated effect size would require at D >= 6. The raw
    low-degree syzygy counts H-SIG-001 records as 1 at D3 and 8n/3 at D4 are
    determined by n and are therefore NOT the tracked statistic, because their
    between-curve variance is zero by construction.
  inputs:
    curves: at least 20 from the declared generic plus CM panel, enumerated at approval
    generation_seeds_per_curve: 5
    degrees: [3, 4]
    n: held fixed within a variance cell, at the lane's declared values
    statistic: >-
      non-rewritable low-degree F5 signature count, and #G* against the generic
      m * d^{m-1}
    declared_effect_size_for_sizing: frozen at approval, in statistic units
  controls:
  - >-
    BLOCKING GATE G0, DEGENERACY CHECK, RUN FIRST. The between-curve sample
    variance of the tracked statistic is computed across the first 20 curves at
    D = 3 before anything else is reported. If it is exactly zero, the experiment
    TERMINATES as design-infeasible and reports that. A zero here is not the
    finding that few curves suffice; it means the statistic is constant by
    construction and no alternative hypothesis could move the sizing.
  - >-
    NAMED CONTROL C1, WITHIN-CURVE REPLICATION OVER SEEDS. Replication is over
    system-generation seeds, not over repeated solves of a fixed instance, since a
    deterministic engine returns an identical count on an identical instance and a
    repeat-run null would have zero variance.
  - >-
    NAMED CONTROL C2, DETERMINISM FORCED VALUE. One instance is solved twice with
    identical inputs. Forced value - identical statistic. This separates engine
    nondeterminism from genuine seed variation.
  - >-
    NAMED CONTROL C3, PLANTED BETWEEN-CURVE OFFSET, GRADED DEFECT OF KNOWN SIZE.
    A synthetic per-curve offset drawn from a normal distribution with standard
    deviation 1x and then 3x the measured within-curve standard deviation is
    injected into the recorded statistic and the decomposition re-run. Predicted
    magnitude, binding - the recovered between-curve variance matches the injected
    variance within a factor 2 at 1x, and its 95 percent interval excludes zero at
    3x. The two-point ladder is the demonstrated dynamic range.
  - >-
    NAMED NULL C4, MATCHED RANDOM SYSTEMS ACROSS THE SAME CURVE COUNT. Random
    systems of matched shape, giving the null condition's own between-curve
    variance, which may itself be large. CURVE-FREE by construction. CONSEQUENCE
    PRE-STATED - if this arm reproduces the between-curve spread, the spread is a
    property of system shape and nothing from this experiment may be quoted as a
    statement about the curve family, elliptic curves or the ECDLP.
  - >-
    NAMED CONTROL C5, COMPONENT SEPARATION. Variance components are reported
    separately with intervals and never combined into a single total.
  independent_variables: [curve, generation_seed, degree]
  metrics:
    primary:
    - within_curve_variance_component_in_squared_statistic_units
    - between_curve_variance_component_in_squared_statistic_units
    - required_curve_count_at_the_declared_effect_size_dimensionless
    secondary:
    - non_rewritable_signature_count_per_curve_per_seed_per_degree
    - hash_g_star_against_generic_m_times_d_to_the_m_minus_one
    - confidence_intervals_for_both_variance_components
    - planted_offset_recovery_at_1x_and_3x_beside_the_injected_values
    - matched_random_system_between_curve_variance
    - degeneracy_gate_reading_at_d3
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: >-
      The between-curve variance component sigma_b squared and the within-curve
      component sigma_w squared of the non-rewritable low-degree signature count,
      both in squared statistic units, at D = 3 and D = 4, and the required curve
      count C computed from them at the declared effect size delta.
    formula: >-
      sigma_b squared <= sigma_w squared at both degrees; sigma_b squared at
      D = 4 no more than 3 times its value at D = 3; and C = (z_{0.975} +
      z_{0.80})^2 * (sigma_b squared + sigma_w squared / R) / delta squared with R
      the number of seeds per curve, reported with the interval induced by the
      component intervals.
    source: >-
      H-ICEX-8d9e17, HEUR-001 and predictions 3 to 5. The effect size delta and
      the seed count R are frozen at approval and are not tuned after the
      components are seen.
  scale_relevance:
    tier: toy
    justification: >-
      D = 3 and D = 4 only, at the lane's declared toy parameters. The sizing is
      transferred to D >= 6 under an explicitly unjustified extrapolation, and
      that transfer assumption is the design's stated weak point rather than an
      aside. Between-curve variance at D >= 6 is NOT measured here and is not
      reachable within this budget.
    correspondence: null
  tail_checks:
  - >-
    The curves with the most extreme statistic at each degree are reported with
    their shared invariants, so an outlier curve family is separable from a
    genuine spread.
  - >-
    The D = 4 between-curve component is reported beside the D = 3 component with
    their ratio, since a ratio above 3 is the falsification of HEUR-001 and would
    be invisible in a pooled summary.
  replication:
    seeds: [1, 2, 3, 4, 5]
    independent_instances: 20
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 60
    maximum_memory_gb: 24
    maximum_runs: 250
  stopping_rules:
  - >-
    Stop a cell at 3600 s or 24 GB and record it as unmeasured with its reason. A
    missing cell is reported and never imputed into a variance component.
  - >-
    Stop the experiment at the degeneracy gate if the D = 3 between-curve sample
    variance is exactly zero.
  - >-
    Stop adding curves once 20 have completed both degrees at all 5 seeds; report
    unreached curves as unreached.
  invalidation_rules:
  - >-
    A variance component computed with within-curve replication taken from
    repeated solves of a fixed instance rather than from generation seeds is
    invalid_measurement.
  - >-
    Failure of the planted-offset control at 1x or 3x invalidates every component
    in the run.
  - >-
    A determinism-control disagreement invalidates every component until the
    nondeterminism is characterised.
  - >-
    A required-curve-count figure reported without the intervals of both
    components is invalid_measurement.
  - >-
    Any variance component computed over cells that include an unmeasured cell is
    invalid_measurement.
  success_criterion: >-
    The degeneracy gate passes; the determinism control is exact; the planted
    offset is recovered within a factor 2 at 1x and separated from zero at 3x;
    the between-curve component is at or below the within-curve component at both
    degrees with the D4-to-D3 ratio at or below 3; and a required curve count is
    reported with its interval and compared against what the lane can afford.
  falsification_criterion: >-
    Within-curve variance dominating with the between-curve interval including
    zero means the statistic is too noisy per curve and the lane must improve it.
    A D4-to-D3 between-curve variance ratio above 3 falsifies HEUR-001 and means
    low-degree sizing under-powers the D >= 6 study. A required curve count
    exceeding what the lane can afford means the planned D >= 6 conclusion is
    currently unreachable. A degeneracy-gate or planted-control failure voids the
    design rather than producing a result. NO outcome here may be cited for or
    against H-SIG-001, which is supported_scoped under DEC-20260717-002.
  required_artifacts:
  - the enumerated curve panel with invariants, and the generation seeds per curve
  - per-curve per-seed per-degree statistic values, raw
  - degeneracy-gate reading at D = 3, recorded before any other result
  - determinism control pair
  - planted-offset control outputs at 1x and 3x beside the injected variances
  - matched random-system curve-free arm outputs under the identical code path
  - variance components with intervals, reported separately, never as a total
  - required curve count with its induced interval and the declared effect size
  - unmeasured-cell ledger with reasons
  - per-run manifest, command, environment, git commit, stdout, stderr, validity status
  assigned_to: executor
  approved_by: null
