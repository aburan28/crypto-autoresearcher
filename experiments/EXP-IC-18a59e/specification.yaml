experiment:
  id: EXP-IC-18a59e
  hypothesis_id: H-IC-bcc2eb
  version: 1
  title: factorbase exact finite-field lattice interface experiment
  status: review_required
  frozen: false
  objective: Run the complete prescribed factorbase finite schedule and preserve certificates, adverse controls,
    zero yields and instrument limits.
  inputs:
    prospective_protocol_path: research/lattice_ic_experiments_20261015/coordinator/prospective-protocols.json
    source_main: 7f11ebacb149fe7936ff45b6bdeff2918ad0edf9
    parameters:
      target:
      - 97
      - 0
      - 2
      alpha_x: 35
      auxiliary:
      - 97
      - 1
      - 0
      depths:
      - 0
      - 1
      - 2
      - 3
      tuple_lengths:
      - 2
      - 3
      target_law: all G targets including O for oracle; separate affine targets for polynomial interfaces
      rank2_control:
        p: 5
        quadratic:
        - 1
        - 1
        A: 0
        B: 1
        torsion_prime: 3
        alpha: (z*x,y)
      coset_schedule: Every rational finite nonkernel coset, represented by lex first A in its rational fiber, for
        each d0..3; exact full rational-fiber census, no postselection. Report original first-coset slice separately.
        Preserve empty target bases and duplicate actual-base histograms with correct denominator.
    protocol_panels:
    - For target alpha=(35x,y), verify cube root condition, alpha on all G and unique nonzero lambda from alpha(P)=lambdaP,
      plus allG action; do not assign scalar to nonstable cyclic lines.
    - "Auxiliary C_a y\xB2=x\xB3+a*x, a0=1,a_next=-4a; maps(x+a/x,y(1-a/x\xB2)). Enumerate all rational points and\
      \ complete rational composite kernel; require kernel size2^d for complete rational-kernel cells. Smaller rational\
      \ kernel is an explicit inadmissible complete-kernel cell, with separately labeled rational-fiber census retained."
    - "Choose lex first A with Phi(A) finite and A outside kernel per d; list full rational coset and lifts. Compare\
      \ target bases using exact list, independently expanded rational map incl numerator/denominator, and quadratic\
      \ chain x_j*x_{j+1}=x_j\xB2+a_j with rational auxiliary y lifts. Require equality of actual target point sets\
      \ before any cost comparison. No isogeny from auxiliary curve to target asserted."
    - Also export catalog of every finite image fiber at all d in canonical image order for the combined panel.
      Preserve kernel/pole branch and separate P1-only x-fiber (no rational-lift requirement) as adverse controls.
    - For every admitted rational finite nonkernel coset, record full actual base and all-target ordered m2/3 tuple
      histogram, valid point witnesses and paid membership/relation work; include empty bases. Report lex first-coset
      slice separately. Orbit-complete each actual base under certified alpha, recording actual M,U, exact raw and
      reduced rank modr; transformed-only copies contribute at most one quotient dimension per original family.
      Target R is a public point label, not a verifier scalar/log column. Newly generated decompositions may add
      rank; no table of verifier point logs is supplied to the candidate. All-G admission/census enumeration is
      charged toy setup, not unknown-scalar recovery.
    - "Enumerate all rational order3 cyclic lines on E/F25 y\xB2=x\xB3+1; alpha=(z*x,y) with z\xB2+z+1=0. Test every\
      \ line and retain nonstable-line rejection."
    - 'Rank accounting clarification: report homogeneous R=O base-row rank and per-fixed-R augmented quotient rank
      separately, with dimensions. Distinct target-label columns cannot be pooled and called new useful rank for
      a fixed ECDLP; no verifier a/log table is supplied. The transformed-family rank check acts on the entire row
      and its target orbit weight. Any pooled diagnostic is explicitly labeled as such and excluded from useful-rank
      scoring.'
    route_interfaces: research/lattice_ic_experiments_20261015/coordinator/route-interfaces.md
    user_intake: research/lattice_ic_experiments_20261015/intake.md
  controls:
  - same-base explicit list
  - identity alpha
  - size-matched seeded random base
  - random coordinate labels and relabeled cyclic generic-group control
  - transformed-only rows versus genuinely fresh decompositions
  - nonstable torsion line
  - kernel/pole fiber retained projectively
  - P1 roots without auxiliary rational lifts
  independent_variables:
  - target
  - alpha_x
  - auxiliary
  - depths
  - tuple_lengths
  - target_law
  - rank2_control
  metrics:
    primary:
    - kernel and stable subgroup admission
    - list/expanded/chain exact base-set equality
    - actual M,U and full target decomposition histogram
    - new quotient-rank yield per paid attempt, explicit zero-rank cells
    secondary:
    - Exact case coverage and explicit adverse/inadmissible/instrument-stop counts
    - Per-phase operations,time,RSS; unpriced_work and source/manifest provenance
  scale_relevance:
    tier: toy
    justification: Synthetic explicitly enumerated finite fields and bounded integer boxes; no crypto transfer.
    correspondence: null
  replication:
    seeds:
    - 1729
    independent_instances: 0
    plan: One deterministic frozen finite schedule, seeded controls only; no independent replication asserted.
  budget:
    enforcement: advisory
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
  - Exactly one finite prescribed schedule; no adaptive target/curve/box replacement.
  - Dimension/bit caps, dependency absence or machine protection stop retain incomplete case and logs; never mathematical
    refutation.
  invalidation_rules:
  - Missing controls, mismatched source/spec/plan hashes or changed parameters.
  - Accepted invalid field/point/ring/lattice/root certificate; wrong denominator or improper affine O handling.
  - Oracle/planted truth injected into candidate solver or uncharged extraction described as candidate success.
  success_criterion: Prescribed coverage and mandatory integrity/control checks complete, with every valid negative/zero
    yield and derived instrument-stop explicit. This is trial integrity, not support or improvement.
  falsification_criterion: Empty bases/zero new rank are measured results, not infrastructure failures; inconsistent
    same-base certificates are invalid and cannot justify any scientific conclusion.
  required_artifacts:
  - raw-result.json
  - manifest.yaml
  - stdout.log
  - stderr.log
  - check.stdout.log
  - check.stderr.log
  - command.txt
  - environment.json
  - launch.json
  - execution-receipt.json
  assigned_to: executor
  approved_by: null
  execution_authorized: false
  implementation_path: tools/lattice_ic_factorbase.py
  candidate_argv:
  - python3
  - tools/lattice_ic_factorbase.py
  - --seed
  - '1729'
  - --output-dir
  - '{run_dir}'
  candidate_check_argv:
  - python3
  - tools/lattice_ic_factorbase.py
  - --check
  - '{run_dir}/raw-result.json'
  output_contract:
    schema_version: lattice-ic-factorbase/v1
    required_top_level:
    - schema_version
    - direction
    - seed
    - parameters
    - cases
    - checks
    - limitations
    - work_accounting
    - instrument_scope
    exact_numbers: Canonical integers/normalized rationals and field coefficient tuples; no floating certificates.
    case_fields:
    - id
    - panel
    - status
    - inputs
    - observables
    - certificates
    - work
    - limits
  interpretation_limits:
  - Synthetic tiny fields only; no asymptotic extrapolation, novelty or performance claim.
  - Development tests are software checks, not admitted scientific evidence.
  - Hypothesis remains proposed until specification/approval; no scientific promotion without independent review.
  approval_missing:
  - Committed implementation and complete source closure hashes
  - Bound canonical trial plan, actual executor handoff and source snapshot Git verification
  - Protocol completeness audit and prospective newest_experiments ready check; no approval before ready
  idea_ids:
  - IDEA-20261015-1e8145
  added: '2026-10-15'
  scientific_scope_sharpening: Prospectively fixed exact panel before implementation or observations.
