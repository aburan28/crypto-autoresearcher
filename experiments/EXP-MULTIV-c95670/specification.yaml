experiment:
  id: EXP-MULTIV-c95670
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-7fe6c0; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-7fe6c0
  question_id: RQ-MAYO-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exhaustive rank census of the MAYO signing linear system at toy parameters, with a matched
    uniform random matrix null and a planted-defect positive control, over a small sweep in the whipping
    factor k.
  objective: 'The one uncertainty a run reduces is whether MAYO''s signing-side linear system behaves,
    at toy parameters, like a uniform random matrix of the same shape. Stated as parts: (i) it measures
    the exact rank histogram of L_v over an exhaustively enumerated vinegar space at one cell and
    over sampled vinegars at larger cells, so that the full-rank (signing-success) probability is
    known with an exact interval rather than assumed; (ii) it runs the identical rank routine over
    uniform random matrices of the identical shape in the same invocation, so that the null is executable
    rather than described, and it checks the null arm against a closed-form q-rank law that is computable
    without any experiment, which makes the instrument self-validating; (iii) it sweeps the whipping
    factor k at fixed underlying parameters so that any deviation can be tested for the decay that
    inventor-protocol section 3 requires of genuine structure, and reports whether the deviation decays,
    stays flat, or grows. The run does not attempt any key recovery, does not construct any forgery,
    does not exercise any implementation, and does not touch the repeated-vinegar object owned by
    H-MAYO-c0ddab. Its output is three histograms, two distances, one closed-form comparison, and
    a per-cell integer margin, all at toy tier.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: at the named toy cells
      (q, n, m, o, k), with the in-repo emulsifier and the recalled signing shape, the rank distribution
      of the signing linear system either does or does not differ from the matched uniform random
      matrix law by more than the stated envelope, with a measured signed deviation and an exact interval.
      What does NOT follow: nothing about any deployed MAYO parameter set, nothing about the security
      of the whipping transform, nothing about signing time, retry behaviour, or side channels in
      any real implementation, and no claim that agreement with the null implies whipping is free
      on the key-recovery side, which this run does not measure and cannot see.'
  inputs:
    procedure: 'STAGE 0, reading and shape fixing (cost: human, hours, no compute): record in the
      run log the exact signing shape used, flagged UNVERIFIED, since no specification is read by
      the harness. STAGE 1, instrument build (cost: low): exact GF(q) tables, one rank routine, one
      histogram routine, unit tests with forced values including zero-row and zero-column cases. STAGE
      2, null calibration (cost: minutes): draw uniform random matrices of each shape and check the
      measured full-rank frequency against the closed-form q-rank law; abort the whole run if this
      check fails. STAGE 3, exhaustive cell (cost: minutes): enumerate every vinegar at q=4, n=5,
      m=3, o=2, k=2 for each of 32 keys and record exact histograms. STAGE 4, sampled cells (cost:
      low, bounded): sample 10^5 vinegars per cell across the parameter grid. STAGE 5, controls (cost:
      low): random-change-of-basis control, planted-defect positive control, shuffled-label calibration,
      k=1 anchor. STAGE 6, analysis (cost: minutes): total variation distances, exact permutation
      p-values, per-cell margins, and the decay-in-k table.'
    instrument: Python 3 only. Exact F_q arithmetic via precomputed log/antilog tables for q in {2,4,8,16}
      written for this experiment; integer numpy arrays for index bookkeeping only, never for field
      arithmetic. Rank by Gaussian elimination over the field tables. Driven by harness/runner.py
      so the manifest records seeds, the resolved inference block, and the parameter grid. No computer
      algebra system, no Sage, no external solver.
    parameters: q in {2, 4, 8, 16}; underlying (n, m, o) with o < m so that whipping is load bearing,
      specifically (n, m, o) in {(5,3,2), (6,4,2), (7,4,3), (8,5,3)}; k in {1, 2, 3, 4}; 32 independent
      keys per cell; exhaustive vinegar enumeration at the single cell (q=4, n=5, m=3, o=2, k=2) giving
      4^10 = 1048576 vinegars per key; 10^5 sampled vinegars per key at every other cell; 10^6 null
      matrices per shape.
  controls:
  - Uniform random matrix null of identical shape, same code path, same invocation.
  - 'Random-change-of-basis control: apply a uniformly random invertible n by n matrix to the oil
    space before whipping, holding all dimensions fixed; the rank histogram must be invariant.'
  - 'Degenerate emulsifier positive control: substitute an emulsifier with a deliberately planted
    rank defect and confirm the measurement detects the induced rank drop, so a null result is not
    merely instrument blindness.'
  - 'Shuffled-label control: recompute the discrimination statistic after randomly permuting the arm
    labels, to calibrate the permutation test''s own envelope.'
  - 'k = 1 control: at k = 1 the whipped map is the underlying small-oil UOV map and the full-rank
    probability must be near zero when o < m, which is a sanity anchor with a forced value.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a uniform random matrix over F_q of shape m by k*o,
    drawn and rank-computed in the identical code path in the same invocation, with the same RNG discipline
    and the same rank routine. For the signal arm to mean anything the null arm must reproduce the
    classical q-rank law prod_{i=0}^{m-1}(1 - q^{i-k o}) for full rank to within its own exact sampling
    envelope; if the null arm does not reproduce a law that is exactly computable in closed form,
    the rank routine or the sampler is wrong and no signal-arm number may be read at all. A second
    null, structure-preserving, draws L_v for a random n by n change of basis applied to the oil space,
    holding shape fixed.'
  independent_variables:
  - whipping factor k
  - field size q
  - underlying parameter triple (n, m, o)
  - arm (signal, uniform-random null, basis-change control, planted-defect positive)
  metrics:
    primary:
    - exact rank histogram of L_v
    - measured full-rank probability with exact binomial interval
    - total variation distance to the matched null histogram
    - exact permutation p-value on arm labels
    secondary:
    - closed-form q-rank law value at each shape
    - surjectivity margin k*o - m
    - per-key histogram dispersion before pooling
    - wall-clock per cell recorded as cost, never as evidence
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The probability that the signing linear system L_v has full rank m, per cell, and its
      signed deviation from the closed-form uniform random matrix value.
    formula: 'Predicted full-rank probability for an m by N matrix uniform over F_q, with N = k*o:
      P(N, m, q) = prod_{i=0}^{m-1} (1 - q^{i-N}). Frozen values include P(4,3,4) = (1 - 4^{-4})(1
      - 4^{-3})(1 - 4^{-2}) = 0.9541015625 to ten digits, and P(2,3,4) = 0 because N < m forces rank
      deficiency. The pre-registered prediction is that the measured signal-arm value equals P(N,
      m, q) to within the exact binomial interval at every cell.'
    source: Pre-registered in the parent proposal IDEA-20260816-7fe6c0 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested at q <= 16 and k*o <= 12, chosen so that one cell is exhaustively enumerable
      and therefore carries zero sampling error. No transfer to deployed MAYO parameters is asserted
      or attempted; the only extrapolation offered is the trend in q and k, reported as a table of
      measured values rather than as a fitted law, and any reader wanting a deployed-parameter statement
      must treat that as an open extrapolation with no evidence here.
    correspondence: null
  tail_checks:
  - behaviour at k*o = m exactly, where the full-rank probability is smallest and any deviation is
    largest
  - behaviour at k*o much greater than m, where the null predicts probability indistinguishable from
    1 and any measured shortfall is conspicuous
  - q = 2, where the q-analogue corrections are largest
  - the k = 1 anchor with o < m, where the forced value is a near-zero full-rank probability
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - stop the whole run if the null arm fails to reproduce the closed-form law within its exact interval
  - cap total wall clock at four hours across all cells; an exceeded cap is a cost report and never
    negative mathematical evidence
  - stop adding cells once the deviation table is flat across two consecutive k values at every q
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Every arm executes in one invocation, the null arm reproduces the closed-form
    q-rank law within its exact interval, and each cell yields a full-rank probability with an interval
    and a signed deviation, whichever direction that deviation takes.
  falsification_criterion:
  - Null arm deviates from the closed-form q-rank law beyond its exact interval, which voids the instrument.
  - Planted-defect positive control is not detected at its known defect size.
  - Basis-change control shifts the histogram, which would mean the measurement depends on a coordinate
    choice it should be blind to.
  - Signal and null histograms agree everywhere, which falsifies the existence of any whipping-induced
    signing-side structure at the tested scope and is recorded as a controlled null with its numbers.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-7fe6c0
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The signing shape is recalled and UNVERIFIED; a Coordinator must decide whether Stage 0 may proceed
    under RQ-MAYO-001's constraint that no experiment be designed until primary sources are filed,
    or whether the contract is approved explicitly as a shape-conditional measurement.
  - The exact emulsifier to use is not fixed by this proposal beyond pointing at IDEA-20260805-74e78c's
    notation; the Coordinator must freeze one.
  - Whether 32 keys per cell is enough to separate key-to-key from vinegar-to-vinegar variance is
    not derived and should be set by a pilot.
