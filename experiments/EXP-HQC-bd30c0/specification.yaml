experiment:
  id: EXP-HQC-bd30c0
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-HQC-d46460
  question_id: RQ-HQC-001
  goal_id: GOAL-HQC-001
  title: >-
    Review-required contract: the evaluation-character audit of HQC's error
    vector - an exhaustive zero-compute identity gate, a matched i.i.d. null,
    and a six-point graded truncation ladder against the forced curve
    (1 - 2p*)^l
  assigned_to: executor

  objective: >-
    If separately approved, frozen and authorized, establish four things in
    increasing cost order: (i) that HQC's ambient ring has exactly two CRT
    factors at all three published parameter sets, by computing ord_n(2);
    (ii) that the weight of the full-length error vector e' has parity fixed at
    w_e mod 2, by exhaustive enumeration at n = 7 and by 1e6 samples per
    reduced cell; (iii) that the parity bias of the code-relevant prefix decays
    as exactly (1 - 2p*)^l per truncated coordinate, measured against a forced
    curve derived before any sampling; and (iv) how much of the measured
    block-weight dependence at each cell is NOT accounted for by that channel -
    the residual, which is the quantity GOAL-HQC-001's queued BATCH-004
    measurement needs and does not currently isolate. This is an instrument and
    confounder-control contract, not an attack.

  what_this_is_not:
    - Not an attack on HQC, not a key recovery, not a chosen-ciphertext procedure, and not a decapsulation of anything.
    - Not a claim that HQC's decoding failure rate is wrong, higher, or lower than published. No DFR is measured at any published parameter set.
    - Not a measurement at HQC's own parameters. The published sets enter only through zero-compute derivations (ord_n(2), l, p*).
    - Not a security-level statement, a cost claim, an exponent claim, or a statement about any deployed system.
    - Not a status change for assumption A5, A17, any evidence record, or the goal's next_action. Only the Coordinator changes status (AGENTS.md rule 1).
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has happened.
    - Not a replacement for the queued BATCH-004 joint-moment design. It supplies a control that design lacks; it does not supersede it.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      A run could support, at most: (a) that ord_n(2) = n - 1 at
      n in {17669, 35851, 57637} - an exact arithmetic fact, scale-free;
      (b) that w(e') = w_e mod 2 held in every one of the enumerated and
      sampled instances at n in {1019, 2027, 4099} and n = 7, under an exact
      uniform fixed-weight sampler; (c) that the measured prefix parity bias
      agreed with (1 - 2p*)^l at l in {0..4} to within 4/sqrt(N) at those
      cells; (d) an upper bound on the non-character residual AT THOSE CELLS,
      AT N = 1e6, ABOVE THE DECLARED FLOOR. It could not support any statement
      about HQC-1/3/5's decoding failure rate, IND-CCA2 margin, or security
      level, and no evidence record derived from it may assert above tier toy
      (RQ-HQC-001's ceiling, AGENTS.md rule 7).

  environment_declaration:
    checked_on: '2026-08-05'
    python: "3.11.15"
    numpy: "2.4.6 (import succeeds)"
    sympy: "ABSENT (ModuleNotFoundError)"
    scipy: "ABSENT (ModuleNotFoundError)"
    note: >-
      Checked directly in this container rather than inherited, because two
      independent scouting sweeps in this session disagreed about whether numpy
      is present. No stage of this contract requires sympy, scipy, Sage, or any
      network access. If a later stage is found to need an absent dependency,
      that is an INFRASTRUCTURE REQUEST and is reported as infrastructure
      signal, never as negative mathematical evidence (AGENTS.md rule 5).

  inputs:
    published_parameter_sets_derivation_only:
      HQC-1: {n: 17669, n1: 46, n2: 384, w: 66, w_r: 75, w_e: 75}
      HQC-3: {n: 35851, n1: 56, n2: 640, w: 100, w_r: 114, w_e: 114}
      HQC-5: {n: 57637, n1: 90, n2: 640, w: 131, w_r: 149, w_e: 149}
      provenance: >-
        SPEC Table 5 as transcribed and image-verified in
        coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-6344ed/dfr_model_transcription.md.
        STAGE 0 RE-READS TABLE 5 FROM THE PRIMARY PDF rather than trusting the
        transcription, because a neighbouring table in the same document
        carried an error worth 50.7 bits at NIST-5 (the RS-S3 minimum distance
        49 against four derivations of 59; DEC-20260802-344883 D-2, resolved in
        CORR-20260802-3ae664).
    reduced_cells:
      n_candidates: [1019, 2027, 4099]
      primitivity_requirement: "ord_n(2) = n - 1, verified in-harness; a failing candidate is replaced by the next larger primitive prime and the replacement is recorded in the manifest"
      nonprimitive_control_n: 1013
      weight_rule: >-
        w = round(alpha_w * sqrt(n)), w_r = w_e = round(alpha_r * sqrt(n)) with
        alpha_w = 66/sqrt(17669) = 0.4965900... and alpha_r =
        75/sqrt(17669) = 0.5643068..., preserving SPEC A7's stated regime
        w = alpha sqrt(n). The rounded integers are recorded per cell.
    exhaustive_gate_cell: {n: 7, w: 2, w_r: 2, w_e: 3}
    truncation_ladder_l: [0, 1, 2, 3, 4, 5]
    samples_per_arm_per_cell: 1000000
    measurement_floor_rule: >-
      floor = 8/sqrt(N) = 0.008 at N = 1e6. A ladder point whose FORCED value
      lies below the floor is REPORTED but is NOT counted as a test and may not
      appear in any pass/fail tally.
    master_seed: 20260805
    seed_derivation_rule: >-
      Every random draw is derived from
      SHA-256(ASCII of "EXP-HQC-bd30c0/v1" || "|" || arm || "|" ||
      decimal(n) || "|" || decimal(sample_index) || "|" || stream_label),
      interpreted big-endian unsigned. arm is exactly "treatment" or "null";
      stream_label is exactly one of "x", "y", "r1", "r2", "e", "iid". Fixed
      weight vectors are drawn by Fisher-Yates partial shuffle on
      {0..n-1} consuming digest bytes in order, which is exactly uniform over
      weight-w vectors; i.i.d. Bernoulli(p*) bits are drawn by comparing a
      64-bit digest slice against floor(p* * 2^64) with p* held as an exact
      Fraction and the comparison done in integers. A third party reproduces
      every instance bit-for-bit from this rule and the master seed.

  independent_variables:
    - truncation length l in {0,1,2,3,4,5}
    - reduced cell n in {1019, 2027, 4099} plus the non-primitive control 1013
    - arm in {treatment, null}

  arms_and_controls:
    treatment: >-
      Exact uniform fixed-weight draws of x, y (weight w), r1, r2 (weight w_r),
      e (weight w_e); e' formed as the XOR of the two sparse cyclic
      convolutions x*r2 and r1*y with e, computed on supports by w.w_r index
      additions mod n into a parity accumulator - never by dense polynomial
      multiplication.
    measured_null: >-
      NULL-IID. n independent Bernoulli(p*) coordinates, p* computed exactly
      for the SAME cell from the transcribed Prop 6.1.1 and Eq. (2). Matched on
      length, on crossover probability, on sample count and on the identical
      truncation ladder; differing ONLY in that the fixed-weight and
      convolution structure is removed. FORCED VALUE DERIVED BEFORE THE RUN:
      parity_fixed_fraction = 0.5 + (1-2p*)^n / 2, indistinguishable from 0.5.
      THIS NULL CAN FAIL - if it returns a fixed parity the generator has
      inherited structure it should not have, and every comparison in the
      package is void.
    positive_control: >-
      CTRL-L0. The l = 0 cell of the treatment arm, where the character
      constraint is algebraically total. FORCED VALUE B_hat(0) = 1.000 exactly.
      Declared threshold before the run: B_hat(0) >= 0.9999. IF THE INSTRUMENT
      DOES NOT FIRE HERE, WHERE THE TRUE EFFECT IS MAXIMAL, NO NEGATIVE RESULT
      MAY BE REPORTED FROM ANY CELL OF THIS PACKAGE (inventor protocol
      section 3). This is a sensitivity demonstration with a named comparator
      and a pre-declared threshold, not a decoration.
    graded_control: >-
      CTRL-LADDER. The six truncation levels l = 0..5 measured on the IDENTICAL
      samples, against the forced curve (1 - 2p*)^l computed before any
      sampling. Monotone strict decrease is required across the tested range.
      Reporting the shape localises a failure: a plateau at small l means the
      instrument saturates; a plateau at large l means a second channel
      survives truncation; a uniformly displaced level means p* was computed
      for the wrong cell. "It did not work" is not an admissible outcome.
    nearby_object_control: >-
      CTRL-NONPRIM. One cell at n = 1013 with ord_n(2) < n - 1 (verified, not
      assumed), where R has more than two CRT factors. The parity identity must
      STILL hold there (chi_1 exists for every n) while the uniqueness clause
      of H-HQC-d46460 C1 must NOT. This separates "the identity" from "the
      closure", which are two claims that would otherwise be reported as one.
    ordering_control: >-
      The NULL arm is generated, measured, hash-committed (sha256 over the
      canonical results record) and written to disk BEFORE any treatment sample
      is drawn. The frozen decision rule is then executed on the null FIRST.
      If the rule emits the same verdict on the null as it later does on the
      treatment, it discriminates nothing and must be rewritten before the
      treatment arm is read. Absence of the null commitment is
      invalid_measurement.
    archive_check: >-
      ZERO COMPUTE. GOAL-HQC-001 has executed ZERO runs across three batches
      (runs_authorized was 0 throughout; the BATCH-003 validator confirmed the
      no-run gate independently). There is therefore no archived measurement of
      this or any observable to compare against, and that absence is recorded
      here rather than reported as a passed check.
    comparability_policy: >-
      No number produced here may be compared to any figure in EV-HQC-9906b9,
      EV-HQC-6fd5b1 or EV-HQC-0e9116, none of which reports a measurement.
      Cross-cell comparison within this package is permitted only for the
      quantities the contract declares cell-comparable (B_hat(l)/(1-2p*)^l
      ratios and the residual ratio); raw biases at different cells are NOT
      comparable because p* differs.

  stages_cheapest_first:
    - stage: 0
      name: reading
      compute: zero
      can_terminate_run: true
      content: >-
        Re-read SPEC section 4.1 and section 6.1 from the primary PDF. Resolve
        whether w is the weight of EACH of x and y or the TOTAL weight of the
        pair; quote the sentence verbatim with a page reference. Re-read
        Table 5. Search the external decryption-failure literature for a prior
        statement of the parity identity; record the result either way. IF THE
        TOTAL-WEIGHT READING HOLDS, the package halts here and reports the
        modified identity rather than proceeding on the ambiguous reading.
    - stage: 1
      name: exact algebra
      compute: "seconds, exact integers"
      can_terminate_run: true
      content: >-
        Compute ord_n(2) at n in {17669, 35851, 57637} and at every reduced
        cell, by factoring n - 1 and testing prime divisors. Compute
        l = n - n1 n2 at the three published sets. Enumerate ALL admissible
        (x, y, r1, r2, e) at the n = 7 gate cell and verify
        w(e') = w_e mod 2 without exception. A single counterexample, or
        ord_n(2) != n - 1 at a published set, terminates the run with the
        corresponding finding.
    - stage: 2
      name: model reproduction
      compute: "seconds, exact rationals"
      can_terminate_run: true
      content: >-
        Recompute p-tilde from the transcribed Prop 6.1.1 and p* from Eq. (2)
        as exact Fractions at the three published sets, and compare against
        SPEC Table 9 (0.3398) and Table 11 (0.3618, 0.3725). Compute p* for
        each reduced cell. FAILURE TO REPRODUCE DISQUALIFIES THE INSTRUMENT and
        no sampling result may be read.
    - stage: 3
      name: sampling and ladder
      compute: "minutes"
      can_terminate_run: false
      content: >-
        Null arm first (generated, measured, committed), then treatment. 1e6
        samples per arm per cell; parity_fixed_fraction at full length and
        B_hat(l) for l = 0..5 on the identical samples.
    - stage: 4
      name: residual isolation
      compute: "minutes"
      can_terminate_run: false
      content: >-
        On the same samples, compute the block-weight joint-moment excess over
        its binomial value at each truncation level (blocks of size n2_reduced
        chosen so the prefix divides evenly), and report residual_ratio(l)
        against the forced curve.

  metrics:
    primary:
      - parity_fixed_fraction per arm per cell at full length
      - B_hat(l) per arm per cell for l in 0..5, beside the forced (1-2p*)^l
      - residual_ratio(l) with its standard error, treatment minus null
    secondary:
      - ord_n(2) at every n used, with the factorisation of n-1 recorded
      - l = n - n1 n2 at the three published sets
      - p-tilde and p* as exact Fractions and as decimals, per set and per cell
      - the n = 7 exhaustive enumeration count and its zero-exception verdict
      - the resolved SPEC section 4.1 weight reading, quoted with a page reference
      - monotonicity verdict across the ladder, per cell per arm
      - the CTRL-NONPRIM verdict separating identity from uniqueness

  heuristic_under_test: HEUR-HQC-CHI-2

  preregistered_prediction:
    quantity: >-
      B(l), the parity bias of the weight of the first n - l coordinates of e'
      relative to the class w_e mod 2.
    formula: >-
      B(l) = (1 - 2p*)^l exactly, with p* = 2p~(1-p~)(1 - w_e/n) +
      ((1-p~)^2 + p~^2)(w_e/n) and p~ given by SPEC Prop 6.1.1. Companion
      forced values, derived before any run: parity_fixed_fraction = 1 exactly
      on treatment at l = 0; 0.5 + (1-2p*)^n/2 on the null; ord_n(2) = n - 1 at
      all three published sets; p* = 0.339788 / 0.361804 / 0.372489 there.
    source: >-
      DERIVED IN H-HQC-d46460 mechanism steps 2 and 4 from the transcribed SPEC
      model. The bias identity for a XOR of l independent Bernoulli(p) bits is
      elementary and is derived in that record; NO EXTERNAL CITATION IS
      ASSERTED FOR IT. The p* values were computed in the generation session
      that wrote this contract and are pre-registered, not measured; stage 2
      re-derives them in-harness and the contract is disqualified if it cannot.

  scale_relevance:
    tier: toy
    justification: >-
      Two different transfer arguments, and they must not be conflated. The
      ALGEBRAIC results (ord_n(2), the parity identity, the CRT factor count)
      are exact statements that hold at every n including the published ones,
      and stage 1 evaluates them AT the published parameters directly - so they
      transfer by being computed there rather than by extrapolation. The
      MEASURED results (the ladder, the residual) are at n <= 4099 and DO NOT
      transfer: the residual bound is a statement about those cells at N = 1e6
      above the declared floor and nothing more. The rarity wall EV-HQC-0e9116
      established (T_req about 1/DFR: 3.4e41 / 6.8e59 / 8.4e79 trials at the
      three levels) is unchanged by this contract and is not challenged by it.
    correspondence: >-
      null - direct sampling at reduced parameters. NO correspondence trick is
      used and none is claimed. The relation between reduced and published
      cells is the weight-scaling rule w = alpha sqrt(n) taken from SPEC A7,
      which preserves the regime the model states it operates in and is NOT a
      proof that the residual behaves the same way.

  tail_checks:
    - >-
      The forced curve is checked at BOTH ends: at l = 0 where the bias is 1
      (the positive control) and at the largest l above the floor where it is
      nearest the noise level. A model that fits the middle and misses either
      end is describing a trend, not a mechanism.
    - >-
      The null arm's parity_fixed_fraction is compared to 0.5 at four standard
      errors, i.e. the tail of the binomial rather than its bulk, because the
      failure mode being hunted is a small systematic offset and not a large
      one.
    - >-
      Cell-to-cell consistency: B_hat(l)/(1-2p*)^l must be statistically
      indistinguishable from 1 across all three cells at each tested l. A
      cell-dependent ratio indicates a small-n artifact in the tail
      distribution and is reported as such rather than averaged away.

  replication:
    seeds: [20260805, 20260806, 20260807]
    independent_instances: 3
    interpretation: >-
      Three independent seed streams per cell per arm. The seed-to-seed spread
      of every reported statistic is reported BEFORE any comparison against the
      forced curve is reported. If the spread is comparable to the deviation
      from the forced curve, the deviation is noise and must be reported as
      noise, not as a finding.

  budget:
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 3
    maximum_memory_gb: 4
    maximum_runs: 3
    no_network_after_stage_0: true

  stopping_rules:
    - Do not execute unless this contract is separately reviewed, approved, frozen, archived, and authorized by a committed Coordinator decision. GOAL-HQC-001's committed next_action directs BATCH-004 elsewhere and this contract does not override it.
    - Halt at stage 0 if SPEC section 4.1 resolves to the total-weight reading; report the modified identity and stop.
    - Halt at stage 1 on any counterexample to the parity identity, or if ord_n(2) is not n-1 at a published set.
    - Halt at stage 2 if p* does not reproduce SPEC Tables 9 and 11.
    - Halt before the treatment arm if the null arm has not been generated, measured and hash-committed.
    - Halt on any budget, memory, or wall-clock exhaustion, reporting it as infrastructure signal.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - The null arm returning a fixed parity - the null is not a null and the package is void.
    - Missing null-before-treatment commitment, missing seed derivation record, or any sample not reproducible from the master seed.
    - B_hat(0) below 0.9999 on the treatment arm - the instrument cannot see a total effect and no negative may be reported.
    - Any post-hoc change to the forced curve, the floor rule, the thresholds, or the cell list after any stage-3 number has been observed. Such a change requires a versioned protocol amendment with confirmatory_status exploratory_only and is never an edit.
    - Comparison of a number from this package against any figure in an existing HQC evidence record, none of which reports a measurement.

  success_criterion: >-
    This contract has NO current success outcome because it is not authorized
    for execution. If a later, separately approved and frozen successor is
    executed, its only positive disposition is: stage 0 resolves the weight
    reading to the symmetric form with a quoted page reference; stage 1 returns
    ord_n(2) = n - 1 at all three published sets and zero exceptions in the
    n = 7 enumeration; stage 2 reproduces SPEC's p* at all three sets; the null
    arm returns 0.5 within four standard errors; CTRL-L0 returns B_hat(0) >=
    0.9999; the ladder matches (1 - 2p*)^l within 4/sqrt(N) at every point
    above the floor with strict monotone decrease; CTRL-NONPRIM confirms the
    identity while failing the uniqueness clause; and the residual ratio is
    reported with its standard error at every level. THAT DISPOSITION
    ESTABLISHES NO HQC SECURITY CLAIM, NO DFR CLAIM AT ANY PUBLISHED PARAMETER
    SET, AND NO EXPONENT.

  falsification_criterion: >-
    Any of: a counterexample to the parity identity at any cell; the null arm
    showing a fixed parity; B_hat(0) below threshold; a ladder point deviating
    from the forced curve by more than 4/sqrt(N) above the floor consistently
    across seeds and cells; or failure to reproduce SPEC's p*. The FOURTH of
    these is the productive one: a systematic ladder departure refutes
    HEUR-HQC-CHI-2 and simultaneously exhibits a non-character dependence
    channel in the truncated tail, which is the most valuable outcome the
    contract can produce and is pre-registered as such so it cannot be
    reported as a surprise.

  planned_negative_disposition: >-
    PRE-REGISTERED, because a contract whose negative outcome is unusable is
    not an instrument. If every ladder point matches the forced curve and the
    residual ratio does too, the character channel accounts for the whole
    measured block-weight dependence at these cells, and the deliverable is
    (a) the parameter-selection rule for BATCH-004 - choose reduced parameters
    whose (1-2p*)^l matches the level being modelled, and report B(l) beside
    every joint moment - and (b) a bounded negative on the residual WITH ITS
    EXACT BOUNDARY (n in {1019, 2027, 4099}, N = 1e6, floor 0.008, three
    seeds). A negative that does not emit both has not finished.

  infrastructure_failure_disposition: >-
    A timeout, an out-of-memory kill, a missing dependency, an API session
    limit, or any crash is recorded as INFRASTRUCTURE SIGNAL with its exact
    cause and is NEVER negative mathematical evidence about H-HQC-d46460 or any
    HQC proposition (AGENTS.md rule 5). This goal has already lost one producer
    pair to an API session limit (BATCH-003, TASK-20260802-853bad and
    TASK-20260802-ecba30); those cards were preserved as failed and the work
    was redone under new ids with instructions to re-derive rather than
    inherit. The same handling applies here, and partial stage results are
    reported as partial rather than completed.

  required_artifacts_if_later_authorized:
    - Frozen approved specification with a freeze receipt binding its sha256.
    - Stage 0 reading record with verbatim quotations and page references, or an explicit statement that the PDF could not be obtained and by which routes.
    - Exact-integer transcript for ord_n(2) including the factorisation of n-1, and for l at the three published sets.
    - The complete n = 7 exhaustive enumeration record with its instance count and zero-exception verdict.
    - p-tilde and p* as exact Fractions with the code path that produced them, beside SPEC's printed values.
    - Null-arm results and their sha256 commitment, written before any treatment sample.
    - Per-arm per-cell per-seed raw counts sufficient to recompute every reported statistic.
    - The forced curve tabulated beside every measurement, with the floor marked.
    - Manifest, environment, exact command, git commit and dirty-tree state, stdout, stderr, resource measurements, and the inference block (requested policy, resolved model, fallback, probe status).
    - Snapshot archive followed by independent Validator and Red Team sessions.

  approval_requirements:
    - Independent review confirms the null is matched and can fail, the positive control can fail, the ladder floor is honest, and the forced curve is derived rather than fitted.
    - Independent review confirms that no stage claims anything above tier toy and that the damping numbers appear in every statement of the identity's consequence.
    - Coordinator separately approves and freezes a contract without editing this draft.
    - A committed Coordinator decision authorizes execution; GOAL-HQC-001's current next_action does not.

  approval_status: >-
    Pending review. No approved_by field is present because this contract is
    not approved and only the Coordinator may approve it (AGENTS.md rule 1).
