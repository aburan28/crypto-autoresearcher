steps:
- id: S01-trials
  kind: trials
  title: Execute the frozen cold polynomial trial once
  explain: Use the unchanged plan and checker under the live root owner claim; preserve
    all recorded outputs and stop on every failure. The86400second operational timeout
    matches the existing1440minute authority ceiling.
  plan: experiments/EXP-IC-b75e3a/trial-plan.json
  engine: supervisor
  claim:
    ttl_minutes: 1440
  timeout_seconds: 86400
  validity:
    files:
    - path: raw-result.json
      json: true
      assertions:
      - pointer: /schema_version
        equals: 1
      - pointer: /direction
        equals: polynomial
      - pointer: /cases
        type: array
      - pointer: /work_accounting/resource/peak_rss_bytes
        type: integer
      - pointer: /checks
        type: object
    - path: manifest.yaml
  by_trial:
    exact-finite-field-seed1729:
      files:
      - path: raw-result.json
        json: true
        assertions:
        - pointer: /seed
          equals: 1729
        - pointer: /parameters
          equals: *id001
  controls: []
  replay:
    mode: exempt
    exempt_reason: This authority permits one costly complete cold grid and no automatic
      second full-grid invocation. Nested case records contain nondeterministic measured
      costs; the runbook field selector cannot express the full deterministic per-case
      semantic projection. Audit replay coverage is absent, not replaced by parameter-only
      comparison. Native checker and later full independent reviews remain required;
      no execution proof is claimed.
  on_invalid: stop
  on_failure:
  - when:
      timed_out: true
    class: resource_exhaustion
    action: stop
  - when:
      exit_code: 2
    class: infrastructure_error
    action: stop
  - when:
      exit_code: 3
    class: implementation_error
    action: stop
  - when:
      exit_code: 130
    class: infrastructure_error
    action: stop
  - when:
      validity: false
    class: invalid_measurement
    action: stop
  tell_on_failure: Report the tool-recorded terminal class, preserve all files, and
    stop this session without retry or reopen.
