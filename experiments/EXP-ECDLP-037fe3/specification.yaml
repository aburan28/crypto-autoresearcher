experiment:
  id: EXP-ECDLP-037fe3
  hypothesis_id: H-ECDLP-4ce467
  version: 1
  title: >-
    VERIFICATION PROTOCOL - the arity-2 known-answer gate on the two-term
    extension-field cost model, with a decoy-row control that gives the
    transcription procedure demonstrated dynamic range and a computed
    demonstration that the incumbent sign-valued gate is degenerate
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260904-ae82ce

  record_kind: verification_protocol
  record_kind_note: >-
    THIS IS AN AUDIT, NOT AN EXPERIMENT, and it is specified as one on
    purpose. There is no measured physical or computational quantity beyond
    exact rational arithmetic; the object checked is a transcribed literature
    exponent against a committed cost model. The contract therefore states
    WHAT ARTIFACT IS CHECKED, AGAINST WHAT REFERENCE, AND WHAT RESULT FAILS
    IT, and it carries the same control obligations - a named null, a
    demonstrated dynamic range, a decision rule - that a measurement would.
    Forcing it into an experiment shape would add a fictitious measurement
    and would not add rigour.

  objective: >-
    Evaluate, for the first time at the arity this question's decision target
    lives at, the known-answer gate on the lane's shared two-term
    point-decomposition cost model: does a transcribed primary-source
    exponent for index calculus on the Weil restriction of E/F_{q^n},
    admissible at n = 2, agree with the model's prediction q^{4/3} = N^{2/3},
    or does it give Otilde(q) = Otilde(N^{1/2}) and thereby show the model
    overcharges by exactly N^{1/6} at arity 2? Three declared outcomes, all
    complete: OVERCHARGE, CORROBORATED, or GATE UNRUN AT THE DECISION ARITY.
    This contract is DRAFT and confers no execution authority.

  artifact_under_check: >-
    The exponent 2n/(n+1) predicted by the two-term charge instantiated at
    N = q^n, m = n, subfield-line factor base of size Theta(q), decomposition
    oracle of cost q^{o(1)}, linear algebra c_LA*B^2; evaluated at n = 2,
    where it reads q^{4/3} = N^{2/3}.

  reference_standard: >-
    A TRANSCRIBED PRIMARY-SOURCE exponent, admissible only if it carries ALL
    FIVE of: (1) a verbatim quoted excerpt; (2) a content hash and the URL or
    DOI it was fetched from; (3) the unit it is stated in, with the
    conversion to the other unit shown; (4) its validity range in n or g,
    quoted from the source rather than inferred; (5) an OBJECT LABEL from the
    source's own wording, one of {class-group genus g, Weil-restriction
    extension degree n, double-large-prime variant}. An exponent missing any
    of the five is INADMISSIBLE and is recorded as such rather than scored.

  preregistered_prediction:
    quantity: >-
      D(n) = (model exponent in units of q) - (transcribed exponent in units
      of q), a dimensionless rational, evaluated at every n in the
      transcribed validity range, with the n = 2 cell as the deliverable.
    formula: >-
      D(n) = 2n/(n+1) - (2 - 2/n) = 2/(n(n+1)), giving 1/3 at n = 2, 1/6 at
      n = 3, 1/10 at n = 4, 1/15 at n = 5, 1/21 at n = 6. In units of N the
      n = 2 gap is exactly 1/6.
    source: >-
      Elementary algebra, verified symbolically and numerically to 1e-12 in
      Stage 0 of this protocol. The transcribed side has no formula and is
      whatever an admissible source says.

  inputs:
    internal_checks: >-
      (i) the conservation identity at B = q, N = q^n, m = n, which must
      return exactly 1/n! for n = 2..8; (ii) the discrepancy identity above.
      Both blocking, both requiring no external source.
    retrieval_order: >-
      Declared in advance and in the order of observed accessibility, so a
      later session does not repeat a known-failing fetch: (1) the openly
      hosted ePrint PDFs named in the source proposal; (2) the arXiv full
      text of the trace-zero-variety index-calculus paper; (3) the Gaudry
      JSC article; (4) the de Gruyter complexity-bounds paper at DOI
      10.1515/jmc-2019-0029.
    known_retrieval_failures: >-
      Recorded by the source session and carried here so they are not
      repeated blind: HTTP 403 from ScienceDirect, HTTP 405 from the de
      Gruyter page, a 303 authorization redirect from SpringerLink, and
      undecoded binary from one PDF fetch. These are INFRASTRUCTURE outcomes
      under AGENTS.md rule 5 and are not evidence about the mathematics.

  independent_variables:
    - "n, the extension degree, over the transcribed validity range"
    - "unit of the exponent (q versus N), carried as two columns on every row"
    - "object label of the transcribed exponent"
    - "gate form: rational-valued signed discrepancy versus the incumbent sign-valued gate"

  null_object:
    name: >-
      NULL-1, THE THREE PLANTED DECOY ROWS - a control with a demonstrated
      dynamic range, scored before any real transcription is scored; and
      NULL-2, THE INCUMBENT SIGN GATE - the degenerate null this protocol
      exists to replace, evaluated rather than described.
    construction: >-
      NULL-1. Three synthetic rows are constructed by this contract, with
      their correct verdicts fixed here in advance.
      DECOY-A: an exponent Otilde(q^{2-2/g}) stated for class groups of
      non-singular curves of fixed genus g >= 2, in units of q, valid for all
      g >= 2. CORRECT VERDICT: INADMISSIBLE - OBJECT MISMATCH. The index is a
      genus, not an extension degree, and scoring it at "n = 2" is exactly
      the observation collision this gate exists to survive.
      DECOY-B: an exponent numerically equal to the wanted one but asserted
      by its source only for n >= 3. CORRECT VERDICT: INADMISSIBLE - OUTSIDE
      VALIDITY RANGE AT n = 2. Evaluating it at n = 2 is the single most
      likely way to manufacture a FALSE falsification of the model.
      DECOY-C: a correctly-labelled Weil-restriction exponent at n = 2,
      stated in units of N rather than q. CORRECT VERDICT: ADMISSIBLE after
      the declared conversion, and it must be scored, not rejected.
      NULL-2. The incumbent sign-valued gate - does the accounting return
      worse-than-rho at every n - is EVALUATED, by exact arithmetic, on both
      candidate n = 2 readings: the model's N^{2/3} and the recalled
      literature's N^{1/2}, against rho's N^{1/2}.
    non_degeneracy_check: >-
      THE POINT OF NULL-2 IS THAT IT IS DEGENERATE, AND THE PROTOCOL PROVES
      IT RATHER THAN ASSERTING IT. At n = 2 neither candidate reading beats
      rho - one ties at N^{1/2}, one loses at N^{2/3} - so the sign gate
      returns PASS on both and its acceptance band at the decision arity has
      WIDTH ZERO. A discriminator that returns the same verdict on both
      hypotheses it is supposed to separate cannot fire, which is why three
      consecutive records could defer it at no cost. This computation is
      BLOCKING and runs before anything else, because if the sign gate does
      fire on one reading then this record's premise is wrong and the whole
      protocol is re-scoped downward.
      NULL-1, by contrast, is checked to be NON-degenerate: its three rows
      have three DIFFERENT correct verdicts (two distinct rejection reasons
      and one acceptance), so a procedure that always accepts and a procedure
      that always rejects both fail it, and only a procedure that
      discriminates on object label, on validity range, and on unit passes.
    dynamic_range_demonstration: >-
      NULL-1 IS the dynamic-range demonstration for the transcription
      procedure: three planted rows of known and distinct correct verdicts,
      each of which must be returned exactly. A procedure that admits DECOY-A
      or DECOY-B has no power to reject a mis-scoped source; a procedure that
      rejects DECOY-C has no power to accept a correct one stated in the
      other unit. In either case NO REAL TRANSCRIPTION MAY BE SCORED BY IT
      and the protocol stops. Separately, the rational-valued gate's own
      dynamic range is the predicted trajectory 2/(n(n+1)), which spans
      0.3333 at n = 2 down to 0.0476 at n = 6 - a factor of 7 across the
      declared range, so the instrument's response to its own knob is itself
      checkable.
    curve_free_null: >-
      NOT APPLICABLE AS AN ARM, BECAUSE THE ENTIRE PROTOCOL IS CURVE-FREE BY
      CONSTRUCTION, AND THAT IS RECORDED HERE RATHER THAN OMITTED. No
      elliptic curve, no group, no factor base and no polynomial system is
      constructed at any stage; the protocol manipulates rational exponents
      and quoted text. There is therefore no signature a non-curve object
      could reproduce, because there is no curve-derived signature at all.
    pre_declared_consequence: >-
      DECLARED IN ADVANCE AND BINDING. Because the protocol is curve-free by
      construction, NO OUTCOME OF IT - not OVERCHARGE, not CORROBORATED, not
      UNRUN - may be quoted as a statement about elliptic curves, about the
      ECDLP, or about the hardness of any instance. Every outcome is a
      statement about the arithmetic of a committed cost model and about what
      the literature asserts and over what range. In particular, OUTCOME A
      does NOT establish that any prime-field exponent is achievable; it
      establishes only that a specific model overcharges at a specific
      instantiation, and every downstream citation must carry that scope.

  controls:
    - >-
      INTERNAL-ONLY CONTROL (blocking, runs first): the 1/n! cross-check and
      the discrepancy identity, neither of which needs an external source. If
      the gate cannot pass its own internal checks, no transcription is
      attempted.
    - >-
      NULL-2, THE INCUMBENT-GATE DEGENERACY COMPUTATION (blocking, runs
      second). See null_object.
    - >-
      NULL-1, THE THREE DECOY ROWS (blocking, runs third, before any real
      source is scored). See null_object.
    - >-
      UNIT CONTROL: every exponent recorded in BOTH q and N units with the
      conversion shown. A gate evaluated in mixed units is void, and this is
      the most likely failure mode of the whole exercise.
    - >-
      OBJECT-IDENTIFICATION CONTROL: genus g versus extension degree n versus
      large-prime variant, labelled per row from the source's own wording.
    - >-
      VALIDITY-RANGE CONTROL: a source asserting its exponent only for n >= 3
      may NOT be evaluated at n = 2. This is forbidden in writing here.
    - >-
      NEGATIVE-RETRIEVAL CONTROL: every failed fetch recorded with its URL
      and HTTP status code, so absence of transcription is never mistaken for
      absence of a result.
    - >-
      BINARY-FIELD NEARBY-OBJECT CONTROL: if a binary-field exponent is
      transcribable, feed it through the same model and check whether the
      discrepancy follows the same 2/(n(n+1)) trajectory. If it does not, the
      discrepancy is a property of the field rather than of the charge and
      the gate's diagnostic value collapses - a real way for this protocol to
      fail, stated in advance.
    - >-
      RE-READ CONTROL (blocking): the incumbent gate's exact wording and the
      lane's two inherited-gate records are RE-READ and quoted verbatim by
      the executing agent rather than taken from this contract's relay, since
      the degeneracy demonstration turns on that wording.

  metrics:
    primary:
      - "D(n) = (model exponent in q) - (transcribed exponent in q) at each admissible n; dimensionless rational; compared against 2/(n(n+1)) to 1e-12"
      - "the n = 2 cell verdict; categorical, exactly one of {OVERCHARGE (transcribed N^{1/2}), CORROBORATED (transcribed N^{2/3} or worse), UNRUN (no admissible source at n = 2)}"
      - "incumbent sign-gate verdict on each of the two candidate n = 2 readings; binary PASS/FAIL; FORCED PASS on both"
      - "decoy-row scoring: returned verdict versus correct verdict for DECOY-A, DECOY-B, DECOY-C; categorical, three exact matches required"
    secondary:
      - "conservation cross-check values against 1/n! at n = 2..8; dimensionless probabilities; residuals to 1e-12"
      - "discrepancy identity residuals at n = 2..8; dimensionless; to 1e-12"
      - "per source: verbatim quoted excerpt, content sha256, URL or DOI, HTTP status, retrieval timestamp"
      - "per row: object label, exponent in q, exponent in N, validity range in n or g, large-prime usage yes/no"
      - "the list of failed retrievals with status codes and URLs"
      - "subsumption assessment of DOI 10.1515/jmc-2019-0029 against the lane's internal m = 2 result; categorical in {SUBSUMES, PARTIALLY SUBSUMES with the delta stated, DOES NOT SUBSUME, NOT OBTAINED}, with a quoted excerpt and hash where obtained"
      - "binary-field nearby-object row, if transcribable, with its own D(n)"
      - "wall-clock seconds spent on retrieval, reported so the cost of the deferral is on the record"

  heuristic_under_test: HEUR-GATE-1

  scale_relevance:
    tier: null
    justification: >-
      NO SCALE TIER APPLIES because nothing is computed on any instance. The
      protocol evaluates rational exponents and transcribed text. Recording
      the tier as null rather than as toy is deliberate: labelling it toy
      would imply a measurement at small parameters that could in principle
      be repeated at larger ones, and there is no such measurement here.
    correspondence: null

  tail_checks:
    - "The n = 2 row and the LARGEST transcribed n are the two rows most likely to come from different objects; each must carry its own verbatim excerpt rather than being inferred from a general statement elsewhere in the source."
    - "Any row whose object label differs from its neighbours splits the table in two; a range spanning two object labels is NEVER fitted jointly."
    - "The single largest |D(n) - 2/(n(n+1))| residual across the table, reported individually."

  replication:
    seeds: []
    independent_instances: 0
  seeds_policy: >-
    NO RANDOMNESS IS USED ANYWHERE IN THIS PROTOCOL, so the seeds list is
    empty by construction rather than by omission. Reproducibility instead
    rests on content hashes: every transcribed excerpt carries the sha256 of
    the bytes it was read from and the URL and timestamp of the fetch, so a
    later session can verify it read the same object. The identity checks are
    deterministic exact arithmetic and reproduce bit for bit.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 1
    maximum_memory_gb: 8
    maximum_runs: 3
    maximum_workers: 1
  budget_note: >-
    The compute is seconds of exact rational arithmetic; the wall clock is
    sized to RETRIEVAL, which is the whole cost of this protocol and which
    three consecutive records have deferred. The 8 GB memory figure is the
    schema floor and is not approached. maximum_runs 3 allows one internal-
    checks run, one retrieval-and-scoring run, and one repair run after a
    recorded infrastructure failure.

  stopping_rules:
    - "STAGE 0 HARD GATE, zero external input: the 1/n! cross-check and the discrepancy identity. A failure is an internal algebra error; the protocol STOPS and routes to a correction record before any bibliographic effort is spent."
    - "STAGE 1 HARD GATE: the incumbent-gate degeneracy computation. If the sign gate FAILS on either candidate reading, this record's premise is wrong; the protocol STOPS and is re-scoped downward."
    - "STAGE 2 HARD GATE: the three decoy rows. Any mis-scored decoy stops the protocol; no real transcription may be scored."
    - "Retrieval is time-boxed by the declared wall clock. Exhausting it without an admissible n = 2 source terminates in OUTCOME C, GATE UNRUN, which is a completed protocol and not a failure."
    - "A fetch returning 403, 405, a redirect to an authorization endpoint, or undecoded binary is recorded with its status and the next source in the declared order is attempted; it is never recorded as evidence about the mathematics."

  invalidation_rules:
    - "Any execution while status is not approved, or while execution_authorized is false."
    - "Scoring an exponent that is missing any of the five admissibility elements."
    - "Evaluating a source's exponent outside the validity range the source itself states."
    - "Comparing exponents in mixed units, or emitting a row with only one unit column."
    - "Promoting a `recalled` reference to `retrieved` because it appears in a committed record. Provenance is upgraded only by an agent that actually read the source, in a new record naming itself."
    - "Reporting OUTCOME C as a negative result about the mathematics rather than as an infrastructure outcome."
    - "Any post-hoc change to the three decoy rows, their correct verdicts, or the three declared n = 2 outcomes. A change requires a versioned protocol_amendment before the affected rows are re-scored."

  success_criterion: >-
    The protocol SUCCEEDS - independently of which of the three outcomes it
    reaches - when: both internal identity checks pass to 1e-12; the
    incumbent-gate degeneracy computation is recorded with its two forced
    PASS verdicts; all three decoy rows are scored exactly as pre-registered;
    every retrieval attempt is recorded with its URL and status code; the
    gate table is emitted with both unit columns, an object label and a
    validity range on every row; and the n = 2 cell is reported as exactly
    one of the three declared outcomes with its supporting excerpt and hash,
    or as UNRUN with the list of sources attempted.

  falsification_criterion: >-
    THE MODEL IS FALSIFIED AT ARITY 2 (OUTCOME A) if an admissible source
    valid at n = 2 gives Otilde(q) = Otilde(N^{1/2}); the signed discrepancy
    is then exactly 1/3 in q and 1/6 in N, and no m = 2 no-go derived from
    this model may be quoted until the model is repaired. THE MODEL IS
    CORROBORATED AT ARITY 2 (OUTCOME B) if an admissible source valid at
    n = 2 gives N^{2/3} or worse. THE GATE IS UNRUN (OUTCOME C) if no
    admissible source covers n = 2. THE INSTRUMENT IS VOID if an identity
    check fails, if a decoy row is mis-scored, or if the discrepancy across
    n >= 3 does not track 2/(n(n+1)). THIS RECORD'S OWN PREMISE IS FALSIFIED
    if the incumbent sign-valued gate fails on either candidate n = 2
    reading, in which case the sharpening is unnecessary and the record is
    re-scoped downward.

  required_artifacts:
    - "The Stage 0 identity-check output with residuals at n = 2..8."
    - "The Stage 1 incumbent-gate degeneracy table: two readings, two verdicts, the arithmetic shown."
    - "The Stage 2 decoy-row scoring table: three rows, returned verdict against correct verdict."
    - "The gate table: one row per (source, object, n) with model exponent in q, transcribed exponent in q, signed discrepancy, predicted 2/(n(n+1)), both exponents restated in N, validity range, object label, excerpt, hash."
    - "The retrieval log: every URL attempted, HTTP status, timestamp, bytes received, extraction success or failure."
    - "The subsumption verdict on DOI 10.1515/jmc-2019-0029 with a quoted excerpt and hash, or an explicit NOT OBTAINED with the status codes."
    - "One line per affected sibling record stating the consequence of the outcome for it, written as a PROPOSAL to the Coordinator and never as a status change."
    - "A knowledge/literature note per source actually opened, with every unverified claim marked as such."
    - "Run manifest with exact command, git commit and dirty-tree state, environment, requested policy, resolved model identifier and probe status, stdout and stderr, wall clock."

  assigned_to: executor

  limitations:
    - >-
      NOT A STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP under any outcome.
      See null_object.pre_declared_consequence, which is binding.
    - >-
      The gate tests a formula at one instantiation and transfers nothing to
      prime fields. A passed gate is not a validated model.
    - >-
      The prime-field factor base has no subfield description at all, which
      is the largest interpretive gap in the two-term programme and is not
      touched here.
    - >-
      OUTCOME C is reachable and is not a defect of the design. If it fires,
      the classes remaining for obtaining a known-answer check at arity 2 are
      named as forward guidance - the binary-field slice at n = 2,
      hyperelliptic genus-2 class groups, and constructing an internal known
      answer by exhaustive solve at a size where every algorithm runs to
      completion - and none of them is closed by this protocol.
    - >-
      Every external number currently reaching this lane is recalled from a
      search summary that no agent in this program has verified. The whole
      purpose of this protocol is to change that for exactly one number.
    - >-
      No status change, no approval, and no assignment of downstream work is
      performed by this contract.
