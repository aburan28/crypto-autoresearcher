# EXP-ECDLP-6491b4
# Three evaluations of (P*T + T*T + 1)/n. No generic-group sampling.
# Approved by DEC-20261001-5707b9.
experiment:
  id: EXP-ECDLP-6491b4
  hypothesis_id: H-ECDLP-4cf0ce
  source_idea: IDEA-20260920-a92b0f
  question_id: RQ-ECDLP-bc7a54
  version: 1
  title: Three cells of the query-bounded success bound
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-5707b9
  objective: >-
    Evaluate (P*T + T*T + 1)/n at n = 101 for (P, T) in {(0, 0), (0, 10),
    (2, 3)}. Label a claimed success of 1 at (0, 0) as above the floor.
  inputs:
    n: 101
    cells:
      - {P: 0, T: 0, predicted: "1/101"}
      - {P: 0, T: 10, predicted: "1/1"}
      - {P: 2, T: 3, predicted: "16/101"}
    leak_claim: {P: 0, T: 0, claimed_success: "1/1"}
  controls:
    - The leak claim is labeled above_floor. Labeling it inside_bound invalidates the run.
    - Two arithmetic implementations. They must not import each other.
  independent_variables:
    - cell
    - implementation
  metrics:
    primary:
      - bound_by_cell
      - leak_label
      - implementations_agree
    secondary:
      - numerator_by_cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Three reduced fractions and one leak label.
    formula: numerator = P*T + T*T + 1, bound = numerator/n.
    source: >-
      IDEA-20260920-a92b0f displayed bound, read 2026-10-01. The three
      fractions were reduced by hand in this design session. That reduction
      is not a run. No generic-group sampler was built.
  scale_relevance:
    tier: toy
    justification: One modulus, 101. No sampling and no transfer.
    correspondence: null
  tail_checks:
    - The cell P = 2, T = 3 uses the cross term P*T. Dropping it and still reporting 16/101 is invalid.
  replication:
    seeds: []
    independent_instances: 3
    replication_note: Deterministic cells. The second run is the other arithmetic.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the leak claim is labeled inside_bound, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either implementation imports the other.
    - leak_label is not above_floor.
    - A sampled success rate or a discrete logarithm is reported.
  success_criterion: >-
    Both runs agree, the three bounds are 1/101, 1/1, and 16/101, and the
    leak claim is labeled above_floor.
  falsification_criterion: >-
    The runs agree, the leak claim is above_floor, and any reduced bound
    differs from its preregistered fraction.
  required_artifacts:
    - experiments/EXP-ECDLP-6491b4/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-6491b4/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-6491b4/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-6491b4/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-6491b4/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-6491b4/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Generic-group sampling and fitted exponents.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
