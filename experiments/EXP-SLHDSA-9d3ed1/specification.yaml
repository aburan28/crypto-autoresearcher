# EXPERIMENT CONTRACT -- EXP-SLHDSA-9d3ed1 (review_required, unapproved, zero runs).
experiment:
  id: EXP-SLHDSA-9d3ed1
  hypothesis_id: H-SLHDSA-8727f8
  derived_from_idea: IDEA-20261018-eef811
  question_id: RQ-SLHDSA-001
  goal_id: GOAL-SLHDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Domination grinding under two WOTS encodings at w in {4,16}
  objective: >-
    Whether the encoding choice changes the per-query one-time forgery probability at equal
    signature length, and whether exact counts predict it.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: >-
      Python 3 + NumPy, hashlib SHAKE256, exact DP counter in Python; harness writes per-cell
      JSON
    parameters: >-
      w in {4,16}; len1 in {8,16}; constant-sum target chosen so total chain count matches
      len1+len2 of the checksum arm; 512 revealed vectors per cell; 2^22 grinding queries
      per vector; q in {1,2,4}
    procedure: >-
      1. Freeze encodings and DP counter. 2. Generate revealed vectors from signing random
      messages. 3. Grind and count dominations. 4. Compute exact DP probabilities. 5. Bin
      by checksum quantile, compute ratios and bootstrap CIs. 6. Run controls.
  controls:
  - >-
    null: random revealed vectors drawn uniformly from the code space rather than from signatures
    (removes signature-induced checksum skew)
  - >-
    positive: planted encoding with the checksum removed, where domination probability must
    be orders of magnitude higher
  - 'A/A: the checksum arm run under two disjoint seed blocks'
  independent_variables:
  - encoding
  - signature_count_q
  metrics:
    primary:
    - worst-quartile domination probability ratio
    - log2 measured/exact per cell
    secondary:
    - median-quartile ratio
    - digit-marginal chi-square
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: p_dom ratio checksum/constant-sum, worst quartile, q=1
    formula: exact DP count of dominating vectors divided by code size, per encoding
    source: combinatorial count; KN-LIT-6265 encoding definition
  scale_relevance:
    tier: toy
    justification: >-
      w and len1 reduced; transfer assumption: ratio is a property of the encoding counts,
      not of n
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 4
    maximum_memory_gb: 4
    maximum_runs: 24
  stopping_rules:
  - stop when all cells reach relative SE below 5%
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - a cell whose digit marginal fails chi-square at p<0.001 is invalid
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    Success if C1 shows ratio >= 2 outside the AA1 noise floor (P1) and C3 shows agreement
    within 0.1 bit (P2).
  falsification_criterion: >-
    Falsified if C1 ratio lies within the AA1 noise floor, or C3 shows any cell off by more
    than 0.1 bit (P1, P2 fail).
  decision_impact:
    on_positive: >-
      File a hypothesis that the FIPS 205 checksum encoding leaves a measurable domination
      margin relative to constant-sum and price it in the hypertree forgery model.
    on_negative: >-
      Record the encodings as forgery-equivalent at equal size and drop encoding from the
      slack model.
  variable_ledger:
    independent:
    - name: encoding
      levels:
      - base_w_checksum
      - constant_sum
    - name: signature_count_q
      levels:
      - '1'
      - '2'
      - '4'
    factors:
    - name: seed_block
      treatment: randomized
      value: seed blocks A and B, disjoint master seeds
      how: >-
        two disjoint master seeds derived by SHAKE256 from a frozen label; every arm run under
        both
    - name: run_order
      treatment: randomized
      value: cell order shuffled
      how: permutation from seed
    comparisons:
    - id: C1
      arms:
      - checksum q=1
      - constant_sum q=1
      differs_in:
      - encoding
      design: one_factor
    - id: C2
      arms:
      - checksum q=1
      - checksum q=4
      differs_in:
      - signature_count_q
      design: one_factor
    - id: C3
      arms:
      - measured vs exact DP, all cells
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - checksum q=1 seed-block A
      - checksum q=1 seed-block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-eef811.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-eef811.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P3
    first_recorded_in: ledger/proposals/IDEA-20261018-eef811.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml with frozen parameters, seeds, code commit and tool versions
  - raw-result.json with per-trial records and verification flags
  - per-cell domination counts CSV
  - exact DP tables JSON
  - ratio-by-quantile SVG and PDF report
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
