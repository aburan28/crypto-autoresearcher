experiment:
  id: EXP-ICINV-e0cd8f
  hypothesis_id: H-ICINV-d5e351
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-d7e255
  version: 1
  status: approved
  claim_tier: toy
  retrospective: false
  retrospective_note: >-
    THIS IS A PRE-REGISTRATION. No run of EXP-ICINV-e0cd8f exists at the time of
    writing and the runs/ directory does not yet exist. Every threshold, every
    definition and every prediction below is frozen before execution and may be
    changed only by a versioned protocol_amendment filed under
    experiments/EXP-ICINV-e0cd8f/amendments/ BEFORE the affected data is
    generated. NOTHING IN THIS FILE IS A MEASUREMENT.

  title: >-
    Exact symbolic Semaev geometry across one complete isogeny class -- S_3 and
    S_4 monomial support, singular locus, Betti table and Castelnuovo-Mumford
    regularity of the f_V-FREE Jacobian ideal, and elimination-polynomial
    factorisation -- on all 138 curves of the Hurwitz-certified class p = 4001,
    t = 30, D = -59 * 16^2. Deterministic: no sampling, no target draw, no null
    object, no p-value.

  objective: >-
    DECIDE, BY EXACT COMPUTATION AND NOT BY STATISTICS, WHETHER THE SEMAEV
    GEOMETRY OF A CURVE IS AN ISOGENY-CLASS INVARIANT. For every one of the 138
    curves in the already-enumerated, Hurwitz-Kronecker-certified ordinary class
    at p = 4001, t = 30, D = t^2 - 4p = -15104 = -59 * 16^2, compute exactly:
    (i) the monomial support of S_3 and of S_4; (ii) the singular locus of the
    Semaev variety S_m = 0 and its dimension and degree; (iii) the graded Betti
    table and the Castelnuovo-Mumford regularity of the ideal generated by S_m
    AND ITS PARTIAL DERIVATIVES; (iv) the degree and the F_p-factorisation type
    of the elimination polynomial of that same ideal. Compare the resulting exact
    multisets across the class, and against a size-matched control set of random
    ordinary curves at the same prime drawn from outside the class.

    WHY THE FACTOR-BASE MEMBERSHIP POLYNOMIALS f_V ARE REMOVED FROM THE IDEAL --
    THE CENTRAL DESIGN DECISION OF THIS CONTRACT, STATED PLAINLY. The committed
    harness builds, for the m = 3 test (harness/semaev.py:92-121), the ideal
    < S_3(x1, x2, x_R), f_V(x1), f_V(x2) > with f_V(x) = prod_{v in V} (x - v).
    Those two membership polynomials are univariate of degree |V| and by
    themselves already generate a zero-dimensional radical ideal of degree |V|^2
    in shape position. The curve enters only through S_3, which is bidegree
    (2,2). CONSEQUENCE: THE SOLVING DEGREE IS PINNED BY |V| AND NOT BY THE CURVE,
    so curve-to-curve variation in any degree-of-regularity quantity is
    structurally near-zero in that formulation before any statistics are done
    (MATCHED-ORDER-DESIGN.md section 2). This is not speculation -- it is the
    standing explanation of the campaign's own most puzzling committed pair
    (red_team_notes.md section 11): the S_3 monomial support really does drop
    13 -> 9 at j = 0 and 13 -> 10 at j = 1728, exact and hand-verified, a 23-31%
    reduction in the algebraic object -- and the Groebner time moves by only
    -0.44% and -0.67%, with gb_size for j = 1728 moving the WRONG WAY at +3.41%.
    The observation collision is real and exact and does not survive projection
    onto the cost functional, because the cost functional is dominated by f_V.
    REMOVING f_V IS THEREFORE WHAT MAKES THE MEASURED OBJECT A FUNCTIONAL OF THE
    CURVE AT ALL. It is also, by the same argument, what makes any result here
    NON-TRANSFERABLE to the solving time of the formulation the harness actually
    runs, and this contract asserts no such transfer.

    ORDER IN THE BATCH. This is the batch's FIRST and CHEAPEST contract. It does
    NOT depend on the SR3 gate and it is NOT blocked by EXP-INSTR-36c8cf under
    GOAL-ENDO-001 criterion C4, because it computes no statistic: there is
    nothing for a two-directional instrument control to control. Its outcome is
    decisive both ways per T3 -- constancy across the class closes the d_reg axis
    with a named obstruction, and variation hands the campaign
    min_{E' ~ E} C(E') and promotes EXP-JINV-bd141d and EXP-VOLC-9f5571.

  inputs:
    class_under_test:
      p: 4001
      t: 30
      discriminant: -15104
      fundamental_discriminant: -59
      conductor: 16
      expected_member_count: 138
      provenance: >-
        Already enumerated and certified complete against the Hurwitz-Kronecker
        mass formula in BATCH-cb71b5 (what_survived_review, third item). The run
        re-emits the enumeration under its own immutable record and compares.
      true_volcano_levels_reference: >-
        {0: 3, 1: 9, 2: 18, 3: 36, 4: 72}, built by Velu and matching
        h(D_0 f'^2) exactly (red_team_notes.md section 10). Used ONLY as a
        reporting covariate; this contract does not rebuild the volcano.
      special_j_absent_by_T4: >-
        D_0 = -59, so j = 0 (which requires D_0 = -3) and j = 1728 (which
        requires D_0 = -4) do NOT occur anywhere in this class, and a_i != 0 !=
        b_i on every member.
    control_set:
      size: 138
      construction: >-
        Random ordinary curves at p = 4001 drawn from traces OTHER than t = 30,
        with the drawn traces and the RNG seed recorded in the run record. Same
        prime, same Weierstrass family, same symbolic pipeline, same grading,
        same monomial order. It differs from the class in exactly one respect: it
        is not one isogeny class.
      purpose: >-
        NEARBY-OBJECT CONTROL. Constancy on the class is informative only if the
        control set is NOT equally constant. If both multisets are singletons,
        the constancy is a property of S_3's shape and not of the isogeny class,
        and no closure is licensed.
    ideal_definition:
      formula: "I_m(E) = < S_m , d S_m / d x_1 , ... , d S_m / d x_m >"
      f_V_prohibition: >-
        NO factor-base membership polynomial may appear in ANY ideal computed by
        this experiment. Including one makes the run INVALID. This is the
        contract's defining constraint and is not a preference.
      grading: >-
        DECLARED, NOT DERIVED. For Betti tables and regularity the ideal is
        homogenised with respect to a new variable x0 and resolved over
        F_p[x0, x1, ..., x_m] with the standard grading. A Betti table is not
        defined without a grading, and a successor comparing against these
        numbers must use this one.
      affine_vs_projective: >-
        The singular locus and its dimension and degree are computed on the
        UN-HOMOGENISED ideal. Homogenisation can add components at infinity, and
        conflating the two would make a difference at infinity look like a
        difference between curves. Both are reported; neither substitutes for the
        other.
      elimination_polynomial: >-
        The monic generator of I_m ^ F_p[x_m]. Where that elimination ideal is
        the zero ideal, the run records "empty" together with the dimension of
        the projection. NO DEGREE IS INVENTED in that case.
      monomial_order: degrevlex
    arities:
      required: 3
      secondary: 4
      secondary_scope: >-
        For m = 4 the monomial support and the singular locus are REQUIRED; the
        Betti table and regularity are a secondary and may be reported as
        not_computed if the declared budget is exhausted. A not_computed cell is
        a BUDGET statement under AGENTS.md rule 5 and is never reported as
        constancy.
    gauge_recheck: >-
      Every invariant is recomputed on (u^4 a, u^6 b) for a recorded random u per
      curve, with the induced weighted change of variables. Disagreement is an
      implementation defect, not a curve difference.
    computer_algebra_backend:
      requirement: >-
        A backend capable of minimal free resolutions over F_p. THE CAMPAIGN'S
        EXISTING HARNESS CANNOT DO THIS: it is pure Python over sympy, which
        computes no Betti tables. The executor declares and records the exact
        backend and version (Macaulay2, Singular, or Sage driving one of them) in
        the run manifest.
      cross_check_backend: >-
        A SECOND, independent backend, used on a declared subsample of at least
        20 curves that includes every curve on which any difference is claimed.
      absence_is_infrastructure: >-
        Absence of a working backend is a TERMINAL INFRASTRUCTURE STOP reported
        under AGENTS.md rule 5. It is never a mathematical result and never
        evidence that the invariants are constant.
    source_constraints: >-
      harness/semaev.py and harness/exp_icinv.py MUST NOT BE EDITED. New code
      goes in a new module so every already-committed run stays reproducible.
      Run manifests must pin the hash of every source file executed
      (harness/runner.py:source_provenance, audited by
      tools/check_run_source_provenance.py --strict).

  controls:
    - >-
      C-CONTROL-SET. The 138 random ordinary curves at p = 4001 from outside the
      class, identical pipeline. DETERMINISTIC comparison of exact multisets; no
      p-value is computed and none is admissible.
    - >-
      C-GAUGE. Every invariant recomputed on a randomly gauge-transformed model
      of each curve. Disagreement is an implementation defect and makes the run
      INVALID.
    - >-
      C-BACKEND. Second-backend cross-check on at least 20 curves including every
      curve carrying a claimed difference.
    - >-
      C-ORDER. Betti numbers, regularity, singular-locus dimension and degree are
      order-independent by theory; the run recomputes them under a second
      monomial order on the cross-check subsample. A dependence is an
      implementation defect, reported as one, and never as a curve difference.
    - >-
      C-KOSZUL. The regular-sequence condition on the m+1 Jacobian generators is
      tested and reported per curve. If it holds everywhere, a constant Betti
      table is a function of the generator degrees alone -- a Koszul degeneration
      -- and carries no information about the isogeny class. It is then reported
      as a degeneration, never as invariance.
    - >-
      C-CENSUS. The class enumeration re-emitted by the run must agree with the
      committed 138-member Hurwitz-Kronecker-certified census. Disagreement
      terminates the run PREMISE-FAILED and is reported as a defect in a
      certified artifact.
    - >-
      C-SUPPORT. Symbolic re-derivation of the support counts 13 (generic), 9
      (a = 0) and 10 (b = 0) before any class-wide computation.

  independent_variables:
    - "the curve (a_i, b_i), i.e. its position in the isogeny class"
    - "the true 2-volcano level of the curve, {0,1,2,3,4}, used only as a reporting covariate"
    - "arity m in {3, 4}"
    - "class membership: the target class versus the random-curve control set"

  metrics:
    primary:
      - "S_3 monomial support count, per curve"
      - "graded Betti numbers beta_{i,j} of the homogenised f_V-free Jacobian ideal at m = 3, per curve"
      - "Castelnuovo-Mumford regularity of that ideal, per curve"
      - "dimension of the affine singular locus of S_3 = 0, per curve"
      - "degree of the affine singular locus of S_3 = 0, per curve"
      - "degree of the elimination polynomial of the f_V-free ideal at m = 3, per curve"
      - "F_p-factorisation type of that elimination polynomial (partition of its degree), per curve"
      - "number of DISTINCT values of each of the above across the 138-curve class"
      - "number of DISTINCT values of each of the above across the 138-curve control set"
    secondary:
      - "S_4 monomial support count, per curve"
      - "dimension and degree of the singular locus of S_4 = 0, per curve"
      - "graded Betti numbers and regularity at m = 4, per curve (may be not_computed on budget)"
      - "regular-sequence (Koszul) indicator for the Jacobian generators, per curve"
      - "contingency table of each primary invariant against true 2-volcano level"
      - "wall-clock and memory per curve per invariant, for successor budgeting"

  heuristic_under_test: null
  heuristic_under_test_note: >-
    NO HEURISTIC IS UNDER TEST. H-ICINV-d5e351 carries an explicitly empty
    heuristic_assumptions list: the experiment computes exact symbolic invariants
    of explicit polynomials over F_p on a completely enumerated set of curves,
    so there is no sampling distribution to model, no tail to check and no
    random-model justification to validate. The field is present and explicitly
    null so a reader cannot mistake an omitted field for an overlooked one.

  preregistered_prediction:
    quantity: >-
      The number of DISTINCT values taken by each of the four invariant families
      across the 138 curves of the class, and across the 138-curve control set.
    formula: >-
      S_3 monomial support = 13 on all 138 class members EXACTLY. This is DERIVED,
      not expected: T4 fixes D_0 = -59, so j = 0 (D_0 = -3) and j = 1728
      (D_0 = -4) are absent and a_i != 0 != b_i on every member; the support count
      of S_3 = (x1-x2)^2 x3^2 - 2((x1+x2)(x1 x2 + a) + 2b) x3 + ((x1 x2 - a)^2 -
      4b(x1+x2)) is 3 + 4 + 1 + 3 + 2 = 13 generically, 9 when a = 0 and 10 when
      b = 0, and depends on nothing else. FOR THE OTHER THREE FAMILIES NO
      DIRECTION IS PREDICTED AND NO FIGURE IS INVENTED: the design document
      states that both constancy and variation are decisive and does not predict
      which occurs, so the preregistered quantity is the distinct-value count
      itself, reported as an exact multiset, together with the same count on the
      control set. DECOMPOSITION.md section 5 prediction 1 records the campaign's
      standing qualitative expectation of small but non-zero within-class
      variance in Groebner PROXIES; it is not a quantitative prediction about
      these invariants and is not treated as one.
    source: >-
      T4 and the hand-verified support derivation in
      coordination/goals/GOAL-ENDO-001/batches/BATCH-cb71b5/reviews/red-team/red_team_notes.md
      section 11; MATCHED-ORDER-DESIGN.md sections 1, 2 and 4 (E1);
      DECOMPOSITION.md section 3 (T3, T4) and section 5.

  scale_relevance:
    tier: toy
    justification: >-
      One prime p = 4001 (~12 bits), one trace t = 30, one isogeny class of 138
      curves, arities m = 3 and m = 4, symbolic computation over F_p. NO TRANSFER
      IS CLAIMED to any other prime, class, arity, grading, or to the deployed
      f_V-bearing formulation, and none may be inferred. The result, in either
      direction, is scoped to exactly the parameters listed here.
    correspondence: null

  tail_checks:
    - >-
      EXTREME-CURVE LISTING. Every curve whose invariant differs from the class
      mode is listed individually with its (a, b), its j-invariant, its true
      2-volcano level, and its gauge-recheck and second-backend results. A
      difference reported only as a count is incomplete.
    - >-
      DEGENERATE-GEOMETRY CHECK. Curves whose singular locus is empty, or whose
      Jacobian ideal is the unit ideal, or whose elimination ideal is zero, are
      listed explicitly rather than absorbed into a summary statistic.
    - >-
      CONTROL-SET SPREAD. The full multiset of control-set invariant values is
      reported, not merely its cardinality, so a reader can see whether the
      control is spread or concentrated.
    - >-
      m = 3 VERSUS m = 4 CONSISTENCY. Where both are computed, any curve on which
      m = 3 is constant and m = 4 is not (or vice versa) is listed explicitly.

  replication:
    seeds: [20260810]
    seeds_note: >-
      The computation is DETERMINISTIC. The single recorded seed governs only two
      auxiliary random choices -- the gauge parameters u per curve and the draw of
      the 138-curve control set -- and is recorded so both are reproducible. It
      does not affect any primary invariant.
    independent_instances: 1
    independent_instances_note: >-
      One isogeny class, computed exhaustively. There is no sampling and hence no
      replication in the statistical sense; reproducibility is bit-exact
      re-execution from the recorded enumeration, plus the second-backend
      cross-check on at least 20 curves.

  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 6
    maximum_memory_gb: 8
    maximum_runs: 8
    budget_provenance: >-
      COORDINATOR-SET. MATCHED-ORDER-DESIGN.md states no budget for E1. These
      figures bound the task; they are not derived from any measurement.
      Exhausting them is a budget event under AGENTS.md rule 5, reported as such,
      and never as evidence that an invariant is constant.
    dominant_cost: >-
      138 minimal free resolutions at m = 3 and, if attempted, 138 at m = 4. Each
      resolution is computed ONCE per curve and reused across every invariant
      derived from it; recomputing per invariant is prohibited.

  stopping_rules:
    - >-
      SR1 SUPPORT GATE, MINUTES, RUNS FIRST. Symbolically re-derive the support
      counts 13 / 9 / 10 and compute the S_3 support on all 138 class members. If
      the derivation fails, or any member's support is not 13, STOP and report
      the defect. Do not compute a single resolution.
    - >-
      SR2 CENSUS GATE. Re-emit the class enumeration and compare with the
      committed 138. On disagreement, terminate PREMISE-FAILED and report the
      disagreement as a defect in a certified artifact.
    - >-
      SR3 BACKEND GATE. Declare and record both computer-algebra backends and
      their versions before any resolution is computed. Absence of a working
      backend is a terminal infrastructure stop, recorded as
      failed_infrastructure, never as a result.
    - >-
      SR4 CONTROL FIRST. The control-set multisets are computed and WRITTEN TO
      THE RUN RECORD before the class multisets are read for interpretation.
      Null-first ordering is part of the protocol, not a convenience
      (docs/inventor-protocol.md).
    - >-
      SR5 FROZEN SCOPE. Stop at the declared prime, class, arities, grading and
      monomial order. No additional prime, class, arity or grading without a
      versioned protocol_amendment filed BEFORE the extra data is generated.
    - >-
      SR6 BUDGET. On exceeding wall_clock_seconds_per_run, stop that run and
      record status failed_infrastructure with partial artifacts retained. Per
      AGENTS.md rule 5 this is never negative mathematical evidence and never a
      verdict.
    - >-
      SR7 NO OUTCOME SHOPPING. The comparison verdicts (number of distinct values
      per invariant, per set) are computed inside the run and written to the run
      record. They are not selected by a human afterwards, and the set of
      reported metrics does not depend on which verdict fired.

  invalidation_rules:
    - >-
      Any factor-base membership polynomial f_V appearing in any computed ideal.
      This is the contract's defining constraint.
    - >-
      Any edit to harness/semaev.py or harness/exp_icinv.py.
    - >-
      A run manifest that does not pin the hash of every source file executed
      (the standing A6 precondition carried from EXP-ICINV-4d33aa amendment v2).
    - >-
      Any reference value quoted from a committed record without being read from
      that record at run time and bound by a source_sha256. Transcription at any
      precision is prohibited (EXP-ICINV-4d33aa amendment v2 change A4,
      CORR-20260807-a24675).
    - >-
      Betti numbers, regularity, singular-locus dimension or degree depending on
      the monomial order in the computed output.
    - >-
      Any invariant reported without its gauge recheck, or any claimed difference
      without its second-backend cross-check.
    - >-
      Any p-value, null-object test, permutation test or dispersion statistic
      appearing anywhere in the output. This contract computes no statistics; one
      appearing means the scope was exceeded.
    - >-
      Any reported quantity derived from an incomplete enumeration of the class.

  success_criterion: >-
    THE CONTRACT SUCCEEDS WHEN THE COMPARISON IS DECIDED, IN EITHER DIRECTION,
    WITH ITS CONTROLS DISCHARGED -- not when a particular direction is observed.
    Concretely, ALL of the following hold: (1) SR1 and SR2 pass; (2) all four
    primary invariant families are computed at m = 3 on all 138 class members and
    on all 138 control-set members, with every value gauge-rechecked; (3) the
    second-backend cross-check agrees on at least 20 curves including every curve
    carrying a claimed difference; (4) the Koszul indicator is reported per curve;
    (5) the exact multisets of distinct values are reported for both sets, with
    every deviating curve listed individually; and (6) the run emits ONE of two
    frozen verdicts, computed inside the run: CLASS-INVARIANT (exactly one
    distinct value per family across the class) or CLASS-VARYING (at least one
    explicitly exhibited pair of class members differing in at least one family,
    surviving gauge and backend checks). CLASS-INVARIANT licenses a closure of the
    d_reg axis of RQ-ICINV-475b5e for THESE functionals, at THIS class, under THIS
    grading and monomial order -- and only if the control set is NOT equally
    constant and the Koszul indicator does not explain it. CLASS-VARYING licenses
    min_{E' ~ E} C(E') as a campaign target and NOTHING ELSE: it is a variance
    result, T5 is binding, and the reachability gate is discharged in
    EXP-VOLC-9f5571, not here.

  falsification_criterion: >-
    F1 The support re-derivation fails, or any class member's S_3 support is not
    13, or the re-emitted census disagrees with the committed 138 -- terminate
    PREMISE-FAILED, report the defect, H-ICINV-d5e351 untouched in either
    direction. F2 All four families are constant on the class AND the control set
    exhibits the SAME single values -- the constancy is a property of S_3's shape,
    not of the isogeny class, and NO closure is licensed; this REFUTES the closure
    reading. F3 Constancy is explained by a Koszul degeneration (regular sequence
    on every member) -- reported as a degeneration, not as invariance. F4 Any of
    the four order-independent quantities depends on the monomial order --
    implementation defect, run INVALID, returned to the executor. F5 A claimed
    difference does not survive the gauge recheck or the second-backend
    cross-check -- withdrawn as an artifact and reported as one. F6 PLANNED
    NEGATIVE: if the verdict is CLASS-INVARIANT, the deliverable must include the
    NAMED obstruction, the exact scope of the closure, the control comparison, the
    Koszul test, and concrete forward guidance naming what remains open (at
    minimum: another conductor, another D_0, and m = 4). A negative naming no
    successor has not finished and its honest status is unverified
    (docs/inventor-protocol.md closure standard).

