    - experiments/EXP-ICINV-e0cd8f/runs/<RUN-ID>/command.txt
    - experiments/EXP-ICINV-e0cd8f/runs/<RUN-ID>/environment.json
    - experiments/EXP-ICINV-e0cd8f/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ICINV-e0cd8f/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ICINV-e0cd8f/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ICINV-e0cd8f/runs/<RUN-ID>/class-census.json
    - experiments/EXP-ICINV-e0cd8f/runs/<RUN-ID>/support-derivation.json
    - experiments/EXP-ICINV-e0cd8f/runs/<RUN-ID>/per-curve-invariants.json
    - experiments/EXP-ICINV-e0cd8f/runs/<RUN-ID>/control-set-invariants.json
    - experiments/EXP-ICINV-e0cd8f/runs/<RUN-ID>/gauge-recheck.json
    - experiments/EXP-ICINV-e0cd8f/runs/<RUN-ID>/backend-crosscheck.json
    - experiments/EXP-ICINV-e0cd8f/runs/<RUN-ID>/koszul-indicator.json
    - experiments/EXP-ICINV-e0cd8f/runs/<RUN-ID>/verdict.json
    - experiments/EXP-ICINV-e0cd8f/runs/<RUN-ID>/backend-provenance.json

