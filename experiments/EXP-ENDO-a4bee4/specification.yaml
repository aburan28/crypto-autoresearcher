      "radius": "X_r is the least positive integer X with X^(2r)>=N. Use exact integer arithmetic. Main MITM radius is X_r; H1 radii are floor(c*X_r), c in {1/2,1,2,4}. Radius zero contains only the zero vector and has zero nonzero witnesses.",
      "MITM": "Enumerate all left tuples a in [-X,X]^r in lexicographic order with the last coordinate fastest. Incremental mixed-radix recursion computes the full point sum a_i*phi_i(P), its public scalar A=sum a_i*lambda_i mod N, and the tuple; charge every addition, reset and map evaluation. Store every tuple in buckets keyed by the full point encoding, preserving tuple order. Stream right tuples b in the same order and look up -sum b_i*phi_i(Q). Exclude the all-zero pair. Record the first ordinary collision, then continue until B=sum b_i*lambda_i mod N is nonzero; recover k=-A/B and independently verify [k]P=Q. Charge every preceding tuple, lookup, degenerate collision and recovery attempt. A completed box without a useful collision is useful_not_found, not a DLP solve. Report left-build plus right-prefix cost to each endpoint and the separate complete-pass cost, continuing the same scan rather than rerunning visited steps. Inspect bucket candidates in deterministic order. No x-only equality, free deduplication or secret-dependent shortcut.",
      "extra_variants": "Matched compressed-shadow MITM uses identical inputs, radius and ordering, but retains only the first tuple and multiplicity per left point key. Charge all tuple generation, compression, reconstruction and verification. Compare actual useful cost and memory with the primary full-tuple variant; neither is asserted to be the globally best algorithm.",
