      "reuse": "EXP-ECDLP-252b09 consumes only the verified source-run snapshot TASK-20260908-4cbaa8, binding this shared object and specification SHA256, source commit, full cell keys and artifact hashes. Reuse common measurements without duplicate execution. The consumer adds 12-bit inputs using this law in its own declared artifacts. This producer is independently runnable.",
