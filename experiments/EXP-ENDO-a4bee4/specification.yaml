      "cell_id": "ENDO-SHARED-v1-{family}-b{bits}-s{seed}-{map_arm}-r{r}",
      "randomness": "SHA256 of UTF-8 ENDO-SHARED-v1|family|bits|seed|tag|counter, with counter incremented for each 32-byte block. Use unbiased rejection sampling for every finite range and explicit full-point encodings.",
      "curve_law": "Choose initial odd p uniformly among odd integers in [2^(bits-1),2^bits). Examine the first 128 primes at or above p within this bit band; require p=1 mod 3 for J0 and p=1 mod 4 for J1728. For each p examine 64 seeded coefficient candidates: J0 has a=0,b!=0; J1728 has a!=0,b=0; GEN excludes j=0 and j=1728. Reject singular, anomalous H=p, and supersingular p|(p+1-H) cases. Compute exact H=#E with pinned Sage/PARI and its largest prime factor N; require N>=2^(bits-4). For each candidate try 4096 seeded uniform x lifts in order, selecting canonical y=min(y,p-y), and P=[H/N]R. Accept the first P!=O with [N]P=O. Independently verify primality and point equations. Missing eligible fixtures in this finite pool remain ineligible. No selection by scalar, minimum or measured cost.",
      "challenge": "Draw k uniformly from 1..N-1 using tag challenge and set Q=[k]P. Store k only in private checker truth, never solver input. Reuse the same curve, seed and challenge across r, map arms and consumer experiments.",
      "maps": {
        "J0": "Choose the least integer zeta>1 with zeta^3=1 mod p; phi(x,y)=(zeta*x,y). Select lambda among roots of L^2+L+1 mod N by checking [lambda]P=phi(P), and verify Q too. Prefix [id,phi,phi^2,id]: r<=2 is an independent basis prefix, r=3 is algebraically dependent, r=4 repeats identity. All are genuine cheap maps; four independent endomorphisms are never claimed.",
        "J1728": "Choose the least positive i with i^2=-1 mod p; psi(x,y)=(-x,i*y). Select the root lambda of L^2+1 mod N by its action on P. Prefix [id,psi,-id,-psi] has independent basis size two and dependent higher prefixes.",
        "GEN": "Primary r=1 is identity. Separate redundant controls use [id,Frob_p,id,Frob_p] for r=2..4; these maps are all identity on F_p-rational points. List length is not independent rank.",
        "SYNTHETIC": "For each curve/seed choose one four-entry vector with lambda_1=1 and the other lambdas uniform in F_N^*. Use its prefixes for r=1..4, so coordinate-count comparisons retain existing maps. Evaluate actual scalar maps [lambda_i] on P and Q by binary scalar multiplication and charge all work. These are synthetic augmentation controls, not free extra endomorphisms. Label geometry-only comparisons separately."
      },
