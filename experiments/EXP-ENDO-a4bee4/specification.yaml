    "methods": {
      "kernel": "The checker defines the full lattice L={v in Z^(2r):c*v=0 mod N}, including zero; only minima and witness counts exclude zero. Set c=(lambda_1,...,lambda_r,k*lambda_1,...,k*lambda_r), with c_1=1. Use rows N*e_1 and e_j-c_j*e_1 for j=2..2r as an explicit integer basis; independently compute HNF, Smith form and determinant with exact unimodular transformations. Verify kernel membership and index N. An incorrect eigenvalue changes the curve action and geometry but does not remove the unit coefficient. Keep k, c, HNF and LLL entirely in the checker process.",
      "minima": "Report the ordinary L-infinity minimum separately from the useful minimum, which requires B=sum b_i*lambda_i !=0 mod N. A verified unit vector proves an ordinary minimum of one in repeated-map or algebraic-relation cases. Otherwise exact-arithmetic LLL with delta=3/4 supplies only an upper bound. Obtain a useful upper bound by embedding an exact r=1 useful witness (norm <=ceil(sqrt(N))) into 2r coordinates; improve it only with checked LLL combinations whose coefficients lie in [-2,2]. Test integer-box feasibility by bisection from zero to the certified upper bound: enumerate both half-tuples exactly and match their modular shadows, excluding zero and, for useful minima, B=0. A negative-radius certificate includes complete half-shadow histograms and an independently recomputed zero count; an infeasible radius L-1 plus a witness at L certifies the minimum. Dimensions 6/8 retain certified bounds if the 8 GiB checkpoint interrupts enumeration. Never insert an upper bound as an exact minimum in a fit.",
      "pigeonhole_control": "For X=ceil(N^(1/(2r))), (X+1)^(2r)>N. Two points of {0,...,X}^(2r) share an image, so their nonzero difference lies in [-X,X]^(2r). This establishes ordinary existence, not equality of the minimum with X or useful recovery. Do not equate continuous volume with a discrete count.",
      "MITM": "Run both shared-component MITM variants in fresh processes receiving only serialized public inputs. An 8 GiB checkpoint preserves partial lists and costs. A complete box with no useful witness is a valid finite outcome. Report work to first ordinary collision, work to first useful recovery, and full-pass work separately; only independently verified nonzero-B recoveries solve DLP. No HNF, hidden k, expected witness, minimum or census hint enters the solver. Audit public dataflow and fresh-process inputs against shared_component.interface_firewall before measurements; record the audit and exact serialized public input hashes in certificates.json.",
      "H1_census": "For every J0/J1728/GEN primary, redundant or synthetic scalar prefix r=1..4, every base seed at 16/20 bits and every c in {1/2,1,2,4}, compute exact counts for ALL k=1..N-1. Let f_L(t) count a in [-L,L]^r with sum lambda_i*a_i=t mod N. Ordinary count C_k=sum_t f_L(t)*f_L(-k*t)-1; useful count U_k=sum_{t!=0} f_L(t)*f_L(-k*t). Thus C_k-U_k=f_L(0)^2-1, a forced uninformative contribution. Report the literal Poisson mean (2L+1)^(2r)/N alongside the exact conditional mean. Compute all-k counts by multiplicative cyclic cross-correlation on F_N^*, verifying the primitive generator and sign indexing. At 24/28/32 bits use 50 frozen uniform k values per curve, including the original independent uniform challenge plus 49 fresh values; retain duplicates. Evaluate the same exact formulas with hash-histogram dot products. Do not rerun a public MITM for each census scalar.",
      "H1_certification": "Enumerate half-tuples when (2L+1)^r<=2^24; otherwise form f_L by exact cyclic polynomial convolution of the coordinate sums sum_{a=-L}^L x^(lambda_i*a mod N). Charge external-memory work and I/O. For all-k cross-correlation use multiplicative arrays of length N-1, linear convolution and exact cyclic folding. NTT primes 998244353, 1004535809 and 469762049 may be used only at supported transform lengths, with CRT modulus product exceeding 2*(2L+1)^(2r); otherwise use exact integer convolution, never rounded FFT. Check every histogram total, nonnegativity and symmetry f(t)=f(-t); compare direct complete tuple counts at N=5,7,11. Independently check 50 fixed k dot products for each larger census cell. A transform disagreement invalidates dependent counts; non-Poisson counts do not. Memory checkpoints preserve the full outstanding c=4 obligation. The direct small-N control panel is frozen in inputs.parameters.H1_small_exact_controls, with the same exact radius convention and complete k domain.",
      "H1_statistics": "For each curve/r/c, compare the complete count histogram (16/20 bits) or 50-scalar sample (larger sizes) with the literal Poisson mean, fitting no parameter. Merge high-count bins deterministically until expected counts are at least five; require at least three bins, otherwise label low_power. Use Pearson alpha=0.01 only for sampled comparisons; a full finite-population census reports a discrepancy statistic and distances without an iid superpopulation p-value. Nonzero witnesses occur in +/- pairs, so parity is an explicit diagnostic. The c=1 ordinary zero-count fraction must be zero where the exact pigeonhole certificate applies; useful zero fractions are unrestricted. Report extreme counts, the Poisson tail at probability 1/sample_count, and the repeated-map contribution.",
      "H2": "Use the same curve law for J0/J1728 at all five bit sizes and seeds 1..50: 500 declared curve cells, with the first five seeds reused from the primary panel. Verify the actual eigenvalue action, retain both quadratic roots and the selected lambda/N. Apply per-family and pooled KS comparisons against continuous uniform at alpha=0.01 without fitting. Retain repeated curves or subgroup orders and report a deduplicated diagnostic separately. Compare independent uniform nonzero scalar controls with the same N. Forced algebraic relations and selected-root conventions remain explicit; H2 is not needed for the unit-coefficient index. At every r=1..4 record ordinary/useful minimum-to-N^(1/(2r)) ratios or certified intervals on all 500 curves, including the smallest observed ratio.",
      "random_sublattice": "For each primary N and r, sample five independent uniform nonzero coefficient vectors in F_N^(2r) and normalize the first nonzero coefficient to one. Every projective class has N-1 preimages, so this samples index-N kernels uniformly. Also sample every pivot chart j=0..2r-1 with five independent uniform tails, zeros before j, and coefficient j equal to one. Weight chart j by (N-1)*N^(2r-j-1)/(N^(2r)-1) for global estimates; the unweighted chart mixture is not uniform. Construct and check each basis exactly. Public point-image MITM measures ordinary collisions for these abstract kernels, not DLP recovery; compare like endpoints. Separately compare paired synthetic-lambda DLP arms with the same hidden k and all scalar-map work charged. Report matched ratios and 95% seed-level bootstrap intervals using 2000 resamples and seed 2026090840. A distributional difference is a source outcome, not automatic instrument failure.",
      "collapse": "Preserve the source divisor control: for prime N, its only proper positive divisor is d=1, giving the whole integer lattice, index one and ordinary minimum one, with no nontrivial DLP claim. Add a labelled composite control M=d*e, d=nextprime(2^(bits/2-1)), e=nextprime(16*d), at all five sizes, seeds 1..5 and r=1..4, using a unit-coefficient congruence modulo d. Verify index d<M and all collisions exactly. Score cost<sqrt(M) as a finite source performance prediction, not a correctness gate at every r. These composite kernels are not prime-order ECC instances.",
      "rho": "On all 75 primary curves, run 32 independent repetitions for quotient orders g=1, g=2 and the full automorphism group (g=6 for J0, g=4 for J1728); reuse GEN g=2 rather than duplicating it. Verify every automorphism, eigenvalue and actual orbit size. Normalize to the lexicographically least full point in each orbit and multiply its (a,b) coefficients by the same public scalar. Use 32 seeded adding increments uP+vQ, selected by the hash of the canonical point. A distinguished point has t leading zero hash bits, t=max(0,floor(0.5*log2(N)-log2(log2(N)))). Start each chain with uniform a,b; store endpoint, coefficients and start. Cap a chain at 8*2^t transitions. Detect repeats among the last eight canonical points; escape by doubling and canonicalizing with exact coefficient updates, charging every escape. Endpoint collisions recover k using b1-b2; a zero denominator causes a charged restart. Cap each repetition at 16*ceil(sqrt(N)) transitions and record censoring with cost lower bounds. Charge starts, scalar multiplication, normalization, hashes, escapes, lookups, endpoint storage and verification. Compare ideal iterations sqrt(pi*N/(2*g)) and the literal source 0.886*sqrt(N/g) separately. Report all 32 outcomes, means/SE where uncensored, and bootstrap intervals; a 20% disagreement is not automatically invalid. Encode O as a dedicated point tag distinct from affine points. Every automorphism fixes O; choose the identity multiplier by convention, never infer a unique scalar from its orbit. On reaching O, test the current relation a+b*k=0: recover only if b!=0 and verify; otherwise record the degenerate endpoint and restart with its full cost. The checker also replays these O cases.",
      "BSGS": "On each of the 75 primary curves, run matched BSGS with h=ceil(sqrt(N)), full-point baby keys jP for j=0..h-1 and giant points Q-i*hP in deterministic order. Recover and verify k. Count all setup, lookup, group and storage costs without access to hidden k. Reuse each baseline across r and controls.",
      "cost_and_fits": "Keep a coordinatewise cost vector: group additions/doublings, field operations for maps, scalar setup, integer/HNF/LLL/enumeration work and operand sizes, hashes, joins, entries, bytes, CPU, wall time, RSS and I/O. For M3 freeze one group addition or doubling as one operation, reporting other coordinates separately. Checker geometry is excluded from attacker information but included separately in the full audit cost. M2 uses exact ordinary minima in OLS y=log(minimum)/log(N) against x=1/(2r), by family/size and pooled within map class: slope [0.85,1.15], R^2>=0.90. Useful fits are separate; intervals never masquerade as exact minima. M3 reports mean and median operation counts/sqrt(N), the literal nondecreasing sequence, r4/r1>=4, r1 in [0.5,2], and matched BSGS within factor two. Historical 15% slack and 2^(r+1) constants are auxiliary only. Cross-size log-cost/log-N fits use all five sizes and seed-bootstrap 95% intervals; fewer than four completed sizes are inconclusive. The source memory polylog is unspecified: report sqrt(N)/(log2(N))^2 as the new finite operationalization, alongside the source symbolic assertion and historical sqrt(N)/16. Compare entries, bytes and RSS, without asserting global Pareto domination."
    },
