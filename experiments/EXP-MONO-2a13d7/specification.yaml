experiment:
  id: EXP-MONO-2a13d7
  version: 1
  status: completed
  status_note: >-
    Executed (2 runs, 2026-08-30), reviewed independently (validator +
    red-team), and archived as EV-MONO-d90e9c / DEC-20260830-509678. See
    those records for the disposition; this field records lifecycle
    status only, not the scientific outcome.
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-08-30'
  coordinator_approval_rationale: >-
    APPROVED under the identical precedent already established and
    user-confirmed for the sibling contract EXP-MONO-4c7479 (see that
    contract's own `coordinator_approval_rationale`): this is a small,
    standalone experiment under the classic lifecycle
    (docs/task-lifecycle.md steps 3-7), not a GOAL-MONO-001 campaign batch.
    It draws on no part of that goal's exhausted campaign_budget
    (`batch_id: null`, permanently, not pending assignment), opens no
    batch, and does not touch GOAL-MONO-001's dispatch_queue.json. On
    approval_requirements item 1 (scope): confirmed -- this contract
    targets the symmetric base at m=3 only, tests an exact-arithmetic
    stratum-count identity, and asserts no relation-rate content, so it
    does not fall under GOAL-MONO-001's next_action prohibition (which is
    scoped to the generic-fibre census as a relation-rate probe). On item
    2 (budget): resolved by the standalone-lifecycle branch of that
    requirement's own stated either/or, exactly as for EXP-MONO-4c7479,
    without re-litigating the user confirmation already obtained for that
    precedent-setting sibling contract. Items 3-5 (independent review of
    the O(p) method, the pre-registration ordering, and excluded-strata
    accounting) are NOT satisfied by this approval and remain live gates
    on the Executor's submitted implementation, checked by the
    independent validator/red-team round before any evidence record is
    written.
  hypothesis_id: H-MONO-0f9170
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  batch_id: null
  batch_id_note: >-
    No batch is asserted, for the same reason as the sibling contract
    EXP-MONO-4c7479 (see its `batch_id_note`/`coordinator_approval_rationale`):
    GOAL-MONO-001 is `paused` with its campaign budget exhausted
    (maximum_batches: 3, BATCH-003 was the third). This contract does not
    draw on that campaign budget, opens no batch, and does not touch
    GOAL-MONO-001's dispatch_queue.json or campaign accounting. It targets
    the SYMMETRIC base at m=3 only, asserts no relation-rate content, and is
    not the generic-fibre census GOAL-MONO-001's `next_action` rejects (that
    rejection is scoped to the census AS A RELATION-RATE PROBE, at every m --
    a different object and a different use than the exact-arithmetic
    per-instance count comparison run here). Approval, if granted, is through
    the standalone experiment lifecycle (docs/task-lifecycle.md steps 3-7),
    exactly as for EXP-MONO-4c7479.

  title: >-
    Stage 0 (curve enumeration + matched-pair pre-registration), Stage 1
    (exhaustive dual-check of the seven exact stratum-count closed forms),
    and Stage 3 (matched-pair equality + non-vacuity control) of
    IDEA-20260830-9761f0's minimal_test, at p=101 and p=211, against
    H-MONO-0f9170's (p,t,Z)-completeness claim for the m=3 symmetric-base
    Semaev cover.

  objective: >-
    At toy scale, scoped strictly to p in {101,211}: (i) exhaustively
    enumerate all non-singular short-Weierstrass curves at each prime,
    computing (t, Z, j, order-3 point count) for each, and using this table
    to find matched non-isomorphic curve pairs with equal (t,Z) BEFORE any
    base-point enumeration -- the pre-registration; (ii) select a small
    deterministic Stage-1 panel guaranteed to cover Z in {0,1,3} and to
    include at least one matched pair per prime; (iii) exhaustively classify
    every base point (e1,e2) in F_p^2 for each panel curve into the seven
    strata and compare against the closed forms of H-MONO-0f9170, requiring
    EXACT integer agreement; (iv) run the matched-pair equality test and its
    non-vacuity control. Now approved, frozen and execution_authorized
    (see `coordinator_approval_rationale`); as of approval, no run has
    happened yet, no observation is reported, and nothing here is
    evidence.

  scope_decision: >-
    The source proposal IDEA-20260830-9761f0's `minimal_test` has four
    stages (0: curve enumeration + pre-registration at p in {101,211,1009};
    1: exhaustive census at p=101,211; 2: p=1009, exhaustive if affordable
    else declared-sampled; 3: matched-pair equality + controls). ONLY p in
    {101,211} ARE IN SCOPE HERE, across Stages 0, 1, and 3. Stage 2 (p=1009)
    is explicitly OUT OF SCOPE and named as `future_work`, matching the
    sibling contract EXP-MONO-4c7479's prime choice for direct
    comparability and keeping this contract's headline prediction EXACT
    rather than downgrading any cell to a statistical one (the source
    proposal's own `confounders` names this exact risk of "sampling at
    p=1009" and this contract avoids it entirely by not attempting that
    cell). The cross-prime panel-spread-decay-like-1/p prediction (needs 3+
    primes) is also OUT OF SCOPE and named as `future_work`.

  what_this_is_not:
    - Not a discrete-logarithm computation, not an ECDLP attack, not relation collection.
    - >-
      Not an ECDLP cost, runtime, asymptotic, exponent, cryptographic-scale,
      or deployed-scheme claim, in either direction.
    - >-
      Not a closure of KN-OPEN-009, RQ-MONO-001, or GOAL-MONO-001; not a
      status change to any of them, to KN-FIND-a8990a, or to H-MONO-0b3def.
      Coordinator authority alone (AGENTS.md rule 1).
    - >-
      Not the m>=4 census GOAL-MONO-001's `next_action` forbids commissioning
      in the generic-fibre-cycle-type instrument's form: this contract is
      m=3 only and asserts no relation-rate content.
    - >-
      Not a claim about m>=4, about characteristic 2 or 3, about singular
      curves, or about j=0/j=1728 curves (deliberately excluded, see
      `curve_panel_note`).
    - >-
      Not yet executed and not evidence: approved and frozen as of
      2026-08-30 (see `coordinator_approval_rationale`), but no run has
      happened at the time this contract was written.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: that on the declared enumeration and the deterministic
      Stage-1 panel selected from it, at each of p=101 and p=211, every one
      of the seven measured stratum counts agreed or disagreed exactly with
      its closed form in (p,t,Z); that the internal sum checks passed or
      failed exactly; that at least one matched non-isomorphic pair per
      prime was or was not found, and if found, whether its seven-tuples
      agreed exactly and whether it differed on the control invariants. The
      (p,t,Z)-completeness claim itself rests on the derivation in
      H-MONO-0f9170's mechanism (a closed-form algebraic identity), which
      this run CHECKS rather than establishes by scale.
    what_no_outcome_can_support: >-
      No outcome establishes anything about m>=4, p=1009, relation rates, or
      the factor-base sublocus. No outcome converts to a cost, exponent, or
      crypto-scale claim. No outcome closes KN-OPEN-009, RQ-MONO-001, or
      GOAL-MONO-001. Toy evidence is never crypto-scale evidence (AGENTS.md
      rule 7).

  inputs:
    field_bits_note: >-
      p=101 (7 bits) and p=211 (8 bits). Every run manifest MUST carry
      field_bits for both primes tested in that run.
    primes: [101, 211]
    m: 3
    curve_construction: >-
      SHORT WEIERSTRASS y^2 = x^3 + A x + B over F_p, p in {101, 211}, A and
      B ranging over the FULL range 0..p-1 x 0..p-1 (p^2 pairs at each
      prime: 10,201 at p=101, 44,521 at p=211), retaining a curve iff
      4A^3+27B^2 != 0 mod p (non-singular). No isomorphism-class reduction is
      applied; the enumeration is over raw (A,B) coefficient pairs exactly as
      the source proposal specifies ("about p^2 Weierstrass pairs"). The
      Executor MUST independently re-verify the disc_check for every
      retained curve; a construction failure is `failed_infrastructure`,
      never mathematical evidence (AGENTS.md rule 5).
    curve_invariants_per_curve: >-
      For EVERY retained (A,B) at each prime, compute all four of:
      (a) t via the character-sum method: t = -sum_{x=0}^{p-1} chi(f(x) mod p),
      chi the Legendre symbol chi(a) = 0 if a=0 mod p, else
      pow(a,(p-1)//2,p) normalized to +-1 (using #E(F_p)=p+1+sum_x chi(f(x))
      and t=p+1-#E(F_p)); (b) Z, the count of x in the same sweep with
      f(x)=0 mod p (a free byproduct of the same O(p) loop); (c) j-invariant,
      j = 1728 * 4A^3 * inverse(4A^3+27B^2, p) mod p, O(1); (d) order-3 point
      count = 1 + sum over roots x0 in F_p of the 3-division polynomial
      psi_3(x) = 3x^4 + 6Ax^2 + 12Bx - A^2 (mod p) of (2 if f(x0) is a
      nonzero square mod p, else 0 if f(x0) is a non-square, else -- an
      anomaly, logged separately and excluded from the count, not silently
      dropped -- if f(x0)=0 mod p, since a genuine order-3 point cannot
      coincide with a 2-torsion point). psi_3's roots are found by testing
      all p residues in the SAME O(p) sweep as (a)/(b), so (a)-(d) together
      cost O(p) per curve, not more.
    curve_invariants_cost_confirmation: >-
      See `curve_enumeration_cost_note` below: the Coordinator confirms the
      source proposal's "about p^2 Weierstrass pairs, trivially affordable"
      characterization IS correct at these primes, PROVIDED point-counting
      uses the O(p) character-sum method above rather than any O(p^2)
      point-by-point enumeration. This confirmation, and the explicit
      method, are this contract's answer to that open question; an
      Executor substituting a slower method (e.g. testing all p^2 (x,y)
      pairs per curve for group-order computation) would blow the budget and
      must not do so.
    curve_panel_note: >-
      j=0 (A=0), j=1728 (B=0), CM curves, and curves with full rational
      2-torsion are DELIBERATELY OUT OF SCOPE for the Stage-1 exhaustive
      census panel (see `future_work`), matching the sibling contract's
      exclusion for the same reasons (nontrivial honest verification of a CM
      discriminant at these tiny primes; not needed to decide the primary
      metrics). They are NOT excluded from the Stage-0 curve enumeration
      itself (which sweeps every (A,B), including A=0 or B=0, since
      excluding them would require extra bookkeeping for no benefit); they
      are excluded only from Stage-1 PANEL SELECTION. If a matched pair
      cannot otherwise be found within budget among non-special curves at a
      given prime, the Executor documents this and does NOT fall back to a
      j=0/1728 pair without a protocol amendment.
    panel_eligibility_filter: >-
      The operational form of `curve_panel_note`, applied to EVERY curve
      chosen by Stage 0 steps (4) and (5): a retained (A,B) is
      PANEL-ELIGIBLE iff A != 0 mod p (excludes j=1728), B != 0 mod p
      (excludes j=0), and t != 0 (excludes the supersingular curves, which
      are the only CM curves distinguishable at these primes beyond
      j=0/1728). Because the coefficient sweep starts at A=0 and then B=0,
      the lexicographically smallest candidate in any cell or Z class is
      typically one of the EXCLUDED models; the filter is applied BEFORE the
      lexicographic minimum is taken, never after. The 3 fixed sibling
      curves of `curve_panel_committed_from_sibling` are exempt (they are
      committed for baseline comparability and are already non-special).
      One declared exception: the Z=3 coverage curve of step (5)
      necessarily has full rational 2-torsion, since Z=3 IS that condition;
      it is selected under this filter's other three conditions and its
      full 2-torsion is a disclosed property of that panel slot, not a
      violation of the exclusion, which otherwise governs matched-pair
      selection.
    base_construction: >-
      Identical to EXP-MONO-4c7479's `base_construction` for the split/inert
      classification of D = e1^2-4e2 mod p; reused verbatim (F_p sqrt for
      split, fixed F_{p^2} = F_p[w]/(w^2-d) basis for inert) EXCEPT that this
      contract's classification does NOT require lifting t1,t2 into F_{p^2}
      arithmetic at all for the inert case (see `stage1_classification`
      below) -- computing D and, when needed, t1,t2 in F_p (split case only)
      is sufficient.

  stage0_curve_enumeration_and_prereg:
    procedure: >-
      For each p in {101,211}: (1) enumerate all non-singular (A,B), compute
      the four invariants above for each, forming a table keyed by (A,B) with
      columns (t, Z, j, order3_count); (2) group curves by (t,Z) into cells;
      (3) for each cell with >=2 curves, test EVERY pair within the cell for
      non-isomorphism over F_p: (A,B) and (A',B') are ISOMORPHIC over F_p iff
      there exists u in F_p^* with A' = u^4 A mod p and B' = u^6 B mod p (the
      standard criterion for j != 0, 1728, which is guaranteed here since
      those curves are excluded from panel selection); a pair failing this
      test for every u in F_p^* is a MATCHED NON-ISOMORPHIC PAIR; (4) from
      the matched pairs found among PANEL-ELIGIBLE curves only (see
      `panel_eligibility_filter`), DETERMINISTICALLY select at least one per
      prime by lexicographically smallest (A,B),(A',B') tuple among cells
      whose two curves also differ in AT LEAST ONE of {j, order3_count} --
      the non-vacuity pre-check, run before Stage 1 -- preferring (if any
      qualify) a cell containing one of the Z-coverage curves selected in the
      next step; (5) separately, for each Z in {0,1,3} not already
      represented among curves selected so far, deterministically select the
      lexicographically smallest PANEL-ELIGIBLE (A,B) in the table with that
      Z value (any t); (6) emit, for every curve selected into the Stage-1 panel
      (union of steps 4-5, plus the 3 fixed sibling curves per prime named in
      `curve_panel_committed_from_sibling` below), the seven CLOSED-FORM
      predicted stratum counts computed from its own (p,t,Z) -- this table is
      the pre-registration and MUST be emitted and archived BEFORE any
      base-point (e1,e2) is enumerated in Stage 1.
    terminates_the_cell_if: >-
      No matched non-isomorphic pair with equal (t,Z) is found at a prime
      (the enumeration is exhaustive over all p^2 curves, so this is a
      genuine, decisive negative for that prime, not a sampling artifact):
      that prime's matched-pair test is reported as an instrument outcome
      (HEUR-TZ-2's falsification_condition), and Stage 1's residual check
      and Z-coverage panel still proceed at that prime using only the
      Z-coverage and sibling curves.
    curve_panel_committed_from_sibling: >-
      The 3 (A,B) pairs per prime from EXP-MONO-4c7479's
      `curve_panel_committed` -- {A:1,B:1}, {A:2,B:3}, {A:4,B:1} at each of
      p=101 and p=211 -- are INCLUDED in the Stage-1 panel at each prime
      regardless of their (t,Z) cell, for direct baseline comparability
      (reproducing the sibling contract's own class-density measurements on
      the SAME curves, this time checked against the exact closed forms
      rather than forced densities). The Executor re-verifies each
      disc_check independently, exactly as the sibling contract requires.
    panel_size_bound: >-
      At most 3 (sibling) + 3 (Z-coverage, upper bound; fewer if the sibling
      curves already cover a Z value) + 2 (one matched pair) = at most 8
      distinct curves per prime, at most 16 total. Overlaps are collapsed
      (a curve satisfying two roles is counted once). This panel size is
      declared explicitly because Stage 1's cost scales with panel size
      times p^2, and 16 x 44,521 =~ 712,336 worst-case base-point
      classifications is well inside budget (see `cost_note`).

  stage1_classification:
    procedure: >-
      For each panel curve, for every (e1,e2) in F_p^2: (1) D = e1^2-4e2 mod
      p; if D==0, stratum (double-root, excluded, expected exactly p total,
      no further classification); (2) chi_D = Legendre(D,p); if chi_D=+1
      (split): t1,t2 = (e1 +- sqrt(D)) * inverse(2,p) mod p via a fixed
      F_p modular square root (Tonelli-Shanks or the p=3 mod 4 shortcut,
      whichever the Executor's environment sqrt routine implements -- state
      which); f1=f(t1) mod p, f2=f(t2) mod p; if f1==0 or f2==0: stratum
      (A4) ramified-A (excluded from A1-A3, counted separately); else
      chi1=Legendre(f1,p), chi2=Legendre(f2,p): both +1 -> (A1) identity;
      both -1 -> (A3) sigma1sigma2; mixed -> (A2) {sigma_i}; (3) if chi_D=-1
      (inert): compute c0 DIRECTLY from (e1,e2) via
      c0 = e2^3 + A e2(e1^2-2e2) + B(e1^3-3e1e2) + A^2 e2 + A B e1 + B^2 mod
      p (the same polynomial EXP-MONO-4c7479's arm (b) computes; NO lift to
      F_{p^2} is performed); if c0==0 mod p: stratum (B2) ramified-B
      (expected exactly 1 such point when Z=1, else 0); else
      chi_c0=Legendre(c0,p): +1 -> (B1) block-swap involution; -1 -> (B3)
      four-cycle. This is O(1) work per base point (a constant number of
      modular multiplications plus at most one Legendre symbol and, in the
      split case, one modular square root), giving O(p^2) per panel curve.
    independence_from_sibling_arms: >-
      This classification is DELIBERATELY SIMPLER than EXP-MONO-4c7479's
      dual arm(a)/arm(b) point-lifting machinery: it needs no F_{p^2} or
      F_{p^4} arithmetic because the quantity under test here is the STRATUM
      COUNT, not the realized permutation, and the inert-case class is
      already decidable from a single F_p Legendre symbol of c0 (see
      H-MONO-0f9170 mechanism). This simplification is licensed by
      H-MONO-0b3def's own P3 metric, which already established (per-instance,
      FORCED 1.000, at p in {101,211}) that the character-triple recipe
      agrees exactly with the fully-computed group action; re-deriving that
      agreement here would be redundant, not a stronger check.
    optional_cross_check: >-
      NOT REQUIRED, but the Executor MAY spot-check a small deterministic
      sample of points (e.g. the first 200 (e1,e2) per panel curve in
      lexicographic order) against EXP-MONO-4c7479's arm (a) implementation
      (adapted to read t,Z,j from this contract's curves) as an additional
      sanity check. A disagreement there would be reported as an instrument
      inconsistency between the two contracts' implementations and would
      block interpretation of BOTH until resolved; its absence does not
      strengthen the primary result, which rests on the exact-integer
      residual check below.
    excluded_strata_never_pooled: >-
      The double-root stratum (exactly p, always), (A4) ramified-A, and
      (B2) ramified-B are EACH reported and internally sum-checked
      separately, and NEVER pooled into the five primary classes (A1,A2,A3,
      B1,B3) or into each other.

  stage3_matched_pair_and_controls:
    matched_pair_equality_test: >-
      For each matched non-isomorphic pair selected in Stage 0 (per prime,
      if one was found): run Stage 1's full census on BOTH curves (already
      required since both are panel members); compare the resulting
      seven-tuples EXACTLY, integer by integer. FORCED: 0 difference on all
      seven, conditional on the non-vacuity control below passing.
    non_vacuity_control: >-
      MANDATORY. The matched pair's j values and order-3 point counts
      (already computed in Stage 0) are compared; the pair MUST differ on at
      least one. If it does not, the equality test at that prime is reported
      as VACUOUS and NO conclusion (positive or negative) may be drawn from
      it -- this is a hard invalidation rule, not a soft caveat.
    internal_sum_checks_forced_and_free: >-
      Per panel curve: (A1)+(A2)+(A3)+(A4) == C(p,2) exactly;
      (B1)+(B2)+(B3) == p(p-1)/2 exactly; double-root stratum count == p
      exactly. All three checked before any closed-form comparison is
      interpreted; a failure here is an implementation defect voiding that
      cell (never counted as evidence against H-MONO-0f9170).
    baseline_reproduction: >-
      On the 3 sibling-panel curves per prime (already included, see
      `curve_panel_committed_from_sibling`): compute S^2+N^2-(p-Z) from this
      contract's own (A1),(A3) counts (doubled/corrected for the
      ordered-vs-unordered map per H-MONO-0f9170's proof_search_map
      `baseline_embedding`) and require exact agreement with
      KN-FIND-a8990a's committed Theorem B closed form. A framework that
      cannot reproduce the committed number term for term is not embedding
      the baseline.

  stage_order_and_terminating_stage:
    principle: Cheapest decisive gate first.
    stage_0:
      name: >-
        curve enumeration, invariant table, matched-pair search, panel
        selection, and closed-form pre-registration
      compute: "seconds to low minutes; see cost_note"
      terminates_a_prime_if: >-
        No matched non-isomorphic pair with equal (t,Z) is found anywhere in
        the exhaustive enumeration at that prime -- reported as an instrument
        outcome for that prime's matched-pair half of the claim, per
        HEUR-TZ-2's falsification_condition; Stage 1 still proceeds at that
        prime for the residual and Z-coverage checks.
    stage_1_and_3:
      name: >-
        exhaustive base-point census on the selected panel, internal sum
        checks, closed-form residual comparison, baseline reproduction, and
        the matched-pair equality/non-vacuity test
      compute: "seconds to low minutes; see cost_note"
      terminates_the_run_if: >-
        Any internal sum check fails (implementation defect; void the cell,
        never evidence). Otherwise the run completes and all metrics are
        reported.

  metrics:
    primary:
      - >-
        R1: per-curve, per-stratum integer residual between the measured
        seven counts and their closed forms, on every panel curve at both
        tested primes. FORCED 0 on every stratum, every curve.
      - >-
        R2: matched-pair seven-tuple difference (per stratum, integers), for
        each matched pair found, conditional on the non-vacuity control
        passing. FORCED 0 on all seven.
      - >-
        R3: the three internal sum checks (case A to C(p,2), case B to
        p(p-1)/2, double-root to p), per panel curve. FORCED exact.
    secondary:
      - Non-vacuity control outcome per matched pair (j difference, order-3-count difference).
      - Baseline-reproduction check outcome on the 3 sibling-panel curves per prime.
      - Curve-invariant table summary (t, Z, j, order3_count) for the full enumeration, per prime.
      - Stage-0 matched-pair census: number of matched non-isomorphic pairs found per (t,Z) cell, per prime, including cells with none.
      - Panel selection transcript: exactly which (A,B) were selected and why, per role (sibling / Z-coverage / matched-pair).
      - Curve construction transcript (p, A, B, disc_check) per panel curve.
      - Wall time, peak memory, and operation counts per stage, per prime.

  preregistered_prediction:
    - quantity: >-
        Stage-0 identity: M = (p^2+2p-t^2-Z')/2 - (p-Z) counts case-B
        elements with f a nonzero square in F_{p^2}
      value: exact term-by-term equality, checked symbolically before Stage 1
      formula: >-
        Derived from #E(F_{p^2}) = p^2+1-(t^2-2p) and the fact that F_p^* is
        contained in the squares of F_{p^2}^* for p odd.
      source: H-MONO-0f9170 mechanism; cited from IDEA-20260830-9761f0.
    - quantity: R1 (primary)
      value: "0 exactly, every stratum, every curve, both primes"
      formula: "the seven closed forms of H-MONO-0f9170 in (p,t,Z)"
      source: H-MONO-0f9170 predictions item 1 / falsification_conditions item 1.
    - quantity: R2 (primary)
      value: "0 on all seven, per matched pair, conditional on non-vacuity"
      formula: "completeness claim: seven-tuple is a function of (p,t,Z) alone"
      source: H-MONO-0f9170 predictions item 2 / falsification_conditions item 2.
    - quantity: R3 (primary)
      value: "C(p,2); p(p-1)/2; p -- exact, every panel curve"
      formula: "case-A/case-B/double-root partition of F_p^2"
      source: H-MONO-0f9170 mechanism (internal sum checks).
    - quantity: baseline reproduction
      value: "S^2+N^2-(p-Z), exact agreement with KN-FIND-a8990a Theorem B"
      formula: "case-A counts restricted to the ordered base"
      source: H-MONO-0f9170 proof_search_map.baseline_embedding.reproduction_check.

  seeds_and_reproducibility:
    fully_seed_free: >-
      Every computation in this contract -- curve enumeration, invariant
      table, matched-pair search, panel selection, Stage-1 census, and all
      controls -- is DETERMINISTIC: it iterates exhaustively over every
      (A,B) and every (e1,e2) in F_p^2, and every panel-selection rule
      above is a fixed lexicographic tie-break with no randomness. No seed
      is consumed anywhere. Two runs on the same code and inputs must
      produce bit-identical outputs at every stage.
    master_seeds: []
    master_seed_use: >-
      Not applicable; see `fully_seed_free`. This differs from
      EXP-MONO-4c7479, whose random-quartic null control DID consume seeded
      randomness -- that control is not part of this contract's scope.

  replication:
    planned_runs: 2
    seeds: []
    interpretation: >-
      Every metric in this contract is exhaustive and deterministic by
      construction (see `fully_seed_free`): any run-to-run difference in any
      metric is an implementation defect (non-determinism bug), not sampling
      noise, and voids the cell. Two runs are still required, per the
      program's standard replication floor, to catch exactly that class of
      defect (e.g. dependence on dict/set iteration order, an unseeded
      timing-based branch, or an environment-dependent modular-sqrt
      algorithm choice) rather than to average over any distribution.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1.0
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
    below_template_floor_rationale: >-
      Following EXP-MONO-4c7479's precedent: templates/research-records.md's
      stated budget floors (wall_clock_seconds_per_run >= 600,
      maximum_memory_gb >= 8) are sized to avoid truncating a real
      computation to an arbitrary small window. This contract sets a smaller
      wall-clock cap (1800s, above the 600s single-tool-window floor, and
      larger than the sibling's 1200s to cover the ADDED curve-enumeration
      step) and a much smaller memory cap (1GB) because the actual work,
      while larger than the sibling's, is still small: see
      `curve_enumeration_cost_note` and `cost_note`.
    curve_enumeration_cost_note: >-
      CONFIRMING THE SOURCE PROPOSAL'S "trivially affordable" CLAIM
      EXPLICITLY, NOT BY ASSUMPTION. Point-counting per curve via the
      character-sum method (`curve_invariants_per_curve` (a)) is O(p), not
      O(p^2): it is a single pass over x in F_p computing one Legendre
      symbol per x (and folding in the O(p) psi_3 root search and Z-count
      for free in the same pass). Total curve-enumeration cost per prime is
      therefore O(p^3): p=101 gives 101^2 curves x 101 = 1,030,301 inner-loop
      iterations; p=211 gives 211^2 x 211 = 9,393,931. Each iteration is a
      handful of modular multiplications plus one `pow(a, (p-1)//2, p)` call
      (fast at these sizes, a few hundred nanoseconds in CPython's C-level
      modexp) plus a small-degree polynomial evaluation for psi_3. At a
      conservative pure-Python throughput of roughly 3-5 microseconds per
      inner-loop iteration (accounting for interpreter overhead well beyond
      the raw arithmetic cost), p=211's curve enumeration is on the order of
      30-50 seconds, and p=101's is under 10 seconds. This is COMFORTABLY
      inside the stated 1800s-per-run cap with wide margin, and does NOT
      require any point-counting method faster than the naive O(p)
      character sum (e.g. no baby-step-giant-step or Schoof's algorithm is
      needed at this scale). A naive O(p^2) point-by-point enumeration
      (testing every (x,y) pair for group membership) would instead cost
      O(p^4) total across all curves at a prime -- about 1.98x10^9
      operations at p=211 -- which WOULD risk the budget; the O(p)
      character-sum method above is REQUIRED, not merely preferred, and an
      Executor implementation using the slower method is a defect to be
      returned, not a valid but slow run.
    cost_note: >-
      Stage 1's panel-based census is the SAME order of magnitude as the
      sibling contract's: at most 16 panel curves total (8 per prime, worst
      case, see `panel_size_bound`) x up to 44,521 base points at p=211,
      giving at most about 712,000 base-point classifications across both
      primes, each O(1) modular arithmetic (see `stage1_classification`).
      This is trivially seconds of pure Python, well inside budget even
      stacked with the curve-enumeration cost above; the combined
      1800s-per-run cap and 1.0 total-CPU-hour budget are generous margins,
      not tight estimates, mirroring the sibling contract's own framing.

  environment_preconditions:
    requirement: >-
      Pure Python 3 standard library only: integer arithmetic, `pow(x, e,
      m)` for modular exponentiation, modular inverse, and Legendre-symbol
      evaluation; a single fixed modular-square-root routine for the split
      case (state which of Tonelli-Shanks or the p=3-mod-4 shortcut is used,
      and use the SAME one for both tested primes for consistency, noting if
      p mod 4 differs between 101 and 211 requiring the general routine).
      NO F_{p^2} or F_{p^4} arithmetic is required for this contract's
      primary metrics (unlike the sibling EXP-MONO-4c7479). NO sympy, NO
      sage, NO numpy, NO g6k, NO fpylll are required for any primary metric.
    if_a_precondition_fails: >-
      Any interpreter failure, a curve construction failing its disc_check,
      or a non-terminating search is `failed_infrastructure` and is reported
      as infrastructure signal, NEVER as negative mathematical evidence
      against H-MONO-0f9170 (AGENTS.md rule 5).

  infrastructure_failure_disposition: >-
    Any timeout, crash, memory-cap breach, or construction failure is
    recorded with its exact cause and classified `failed_infrastructure` or
    `invalid`. Such an outcome supports and weakens NOTHING and may not be
    cited as evidence about the completeness claim or the ECDLP.

  stopping_rules:
    - >-
      This contract is now approved, frozen and execution_authorized
      (approved_by: coordinator, 2026-08-30; see
      `coordinator_approval_rationale`). Do not execute any FUTURE
      amendment to this contract unless it is likewise separately
      reviewed, approved, frozen and authorized.
    - >-
      Stop a prime's matched-pair interpretation (report an instrument
      outcome, not a completeness result) if Stage 0's exhaustive
      enumeration finds no matched non-isomorphic pair with equal (t,Z) at
      that prime.
    - >-
      Stop the matched-pair equality test's interpretation (report vacuous,
      draw no conclusion) if the non-vacuity control fails.
    - Stop the whole run's interpretation if any internal sum check fails.
    - Stop on any budget breach, reporting it as infrastructure signal.

  invalidation_rules:
    - Any execution while `frozen`, `execution_authorized`, or `evidence_eligible` is false.
    - Any missing curve-construction transcript, disc_check value, or panel-selection transcript.
    - Any run manifest lacking field_bits for both tested primes.
    - Any cell reporting R1/R2 without separately reporting the excluded-strata counts.
    - Any Stage-1 census run on a curve before Stage 0's pre-registered closed-form table for that curve has been emitted and archived.
    - >-
      Any report of the matched-pair equality result (R2) without its
      accompanying non-vacuity control outcome.
    - >-
      Any post-hoc change to a pre-registered closed form, panel-selection
      rule, or tie-break after any Stage-1 number has been observed. Such a
      change requires a versioned protocol amendment marked
      exploratory_only and is never a silent edit.
    - >-
      Any use of an O(p^2)-per-curve or slower point-counting method in
      Stage 0 without a protocol amendment re-justifying the budget.

  success_criterion: >-
    THIS CONTRACT IS NOW APPROVED AND EXECUTION_AUTHORIZED; no run has
    happened yet, so no outcome is reported here. When executed, its
    positive disposition is: Stage 0's M
    identity check passes symbolically; a matched non-isomorphic pair is
    found and selected at each tested prime; R1 = 0 on every stratum of
    every panel curve at both primes; R3's three internal sums are exact
    everywhere; R2 = 0 on all seven for each matched pair, with the
    non-vacuity control passing (differing on j and/or order-3 count); the
    baseline-reproduction check against KN-FIND-a8990a Theorem B holds
    exactly on the 3 sibling-panel curves per prime. THAT DISPOSITION
    SUPPORTS EXACTLY the scoped statement in `claim_ceiling` and nothing
    more.

  falsification_criterion: >-
    Any of: (a) the Stage-0 M identity failing symbolically; (b) R1 != 0 on
    any stratum of any panel curve at either prime; (c) R3 failing on any
    panel curve; (d) a found matched pair with R2 != 0 on any stratum while
    its non-vacuity control passes; (e) the baseline-reproduction check
    failing on the sibling-panel curves; (f) a Z=0 curve exhibiting any
    (A4)/(B2) point, or a Z=3 curve's (A4)/(B2) count disagreeing with its
    forced value.

  outcomes:
    no_execution_authorization: >-
      SUPERSEDED BY APPROVAL 2026-08-30 (see `coordinator_approval_rationale`);
      retained to show the pre-approval disposition this contract carried
      while `review_required`. Before approval: no run, no observation, no
      evidence, no inference.
    future_controlled_confirmation_toy: >-
      The expected outcome per the derivation: R1=0, R2=0 (conditional on
      non-vacuity), R3 exact, and baseline reproduction holds at both
      primes, corroborating (not proving -- that rests on the derivation)
      H-MONO-0f9170 at toy scale.
    future_deviation_found: >-
      Any falsification_criterion item triggers with the sum checks passing.
      Escalated to independent review-adversarial per AGENTS.md rule 12
      before any hypothesis-status change is considered; not reported as a
      routine negative.
    future_matched_pair_not_found: >-
      Stage 0's exhaustive enumeration finds no qualifying matched pair at a
      tested prime. Reported as an instrument outcome (HEUR-TZ-2's
      falsification_condition), not as evidence for or against completeness;
      R1/R3 and the Z-coverage checks still proceed and are interpreted
      normally at that prime.
    instrument_failure: >-
      The non-vacuity control fails for every found matched pair at a
      prime, or an internal sum check fails. Inconclusive instrument signal
      for the affected metric only; never evidence.
    infrastructure_or_integrity_failure: >-
      See `infrastructure_failure_disposition`. Never mathematical evidence.

  scale_relevance:
    tier: toy
    justification: >-
      p in {101,211} only; m=3 only; at most 8 panel curves per prime, all
      generic short-Weierstrass (no CM, j=0, j=1728, or full-2-torsion
      curves in the Stage-1 panel). The closed-form claim is scale-free by
      derivation for every p>3 and every non-singular curve; a toy run
      CHECKS specific numerical consequences rather than establishing them
      by scale. Nothing here transfers to cryptographic-scale p, and nothing
      here addresses m>=4.
    correspondence: null

  tail_checks:
    - >-
      The sparsest-populated (t,Z) cell used for the matched-pair selection
      at each prime is reported explicitly (how many curves it contained),
      as the honest tail check on HEUR-TZ-2's feasibility assumption.
    - >-
      Whichever of Z in {0,1,3} has the fewest raw (A,B) representatives at
      a given prime is reported, as the tail check on Z-coverage panel
      selection.

  future_work:
    - >-
      Stage 2: p=1009, exhaustive if the O(p) character-sum method's actual
      measured throughput at p in {101,211} supports extrapolating an
      affordable p=1009 curve-enumeration cost (about 1009^3 =~ 1.03x10^9
      inner-loop iterations, which is NOT confirmed affordable by this
      contract and would need its own re-verified environment/cost
      estimate), or by a declared uniform sample with its own stated
      binomial error if not; this downgrades that cell's residual
      prediction from exact to statistical, per the source proposal's own
      `confounders`.
    - >-
      The cross-prime panel-spread-decay-like-1/p prediction, requiring a
      third (or more) ladder point.
    - >-
      The j=0, j=1728, CM, and full-rational-2-torsion legs of the
      matched-pair search (the source proposal's own prediction 2 names "at
      least one pair involving j=0 or j=1728 where such a pair exists" as
      part of its full test; deferred here for the same construction-honesty
      reasons as the sibling contract's curve panel).
    - >-
      HEUR-TZ-3's cross-record comparison against IDEA-20260805-90df50's
      m=4 root-coincidence rate: a dedicated future experiment, not this one.
    - >-
      Should Stage 1 reveal any deviation (falsification_criterion items
      b-f), a proof-of-concept re-derivation task checking the specific
      failing step of H-MONO-0f9170's mechanism before any hypothesis-status
      change, per the Coordinator's proof-oriented dispatch gate
      (agents/coordinator.md).

  required_artifacts:
    - Frozen approved specification with a freeze receipt binding its SHA-256.
    - >-
      Stage-0 curve-invariant table (t, Z, j, order3_count) for EVERY
      retained (A,B) at both primes, retained in full, not summarized.
    - >-
      Stage-0 matched-pair census: every (t,Z) cell with >=2 curves, its
      curve count, and whether a non-isomorphic pair within it was found and
      selected, including cells reported as containing none.
    - >-
      Pre-registered closed-form table for every Stage-1 panel curve,
      EMITTED AND ARCHIVED BEFORE any base-point enumeration for that curve
      -- this ordering is itself an invalidation rule if violated.
    - >-
      Per-base-point classification log for every Stage-1 panel curve,
      RETAINED IN FULL: for every (e1,e2) in F_p^2, the character values
      (chi_D, and chi1/chi2 or chi_c0 as applicable), the stratum assigned,
      and the running per-stratum tally. Estimated size: well under the
      sibling contract's ~1.65x10^5-row log even at the worst-case 16-curve
      panel (at most ~712,000 rows total, a few MB as compact CSV/NDJSON).
    - Seven-count tables per panel curve (measured vs closed-form, with exact integer residuals).
    - Internal sum-check results per panel curve (all three, exact values).
    - Matched-pair equality report per prime (found/not-found; if found, the seven-tuple comparison and the non-vacuity control outcome).
    - Baseline-reproduction check output on the 3 sibling-panel curves per prime.
    - Panel-selection transcript (which curves, which role, why).
    - Curve construction transcript (p, A, B, disc_check) per panel curve.
    - Run manifests carrying field_bits, git commit, dirty-tree state, environment, resolved model identifier and probe status, per run.
    - Command, stdout, stderr, timings, peak RSS, and an execution report.
    - Snapshot archive followed by independent validation and red-team review.

  approval_requirements:
    - >-
      Coordinator confirms this contract does not fall under GOAL-MONO-001's
      `next_action` prohibition on commissioning a generic-fibre census (see
      `batch_id_note`); if the Coordinator judges otherwise, the correct
      disposition is to refuse this contract.
    - >-
      GOAL-MONO-001 is `paused` with its campaign budget exhausted;
      execution requires either a fresh budget grant from GOAL-PATH-001 and
      a Coordinator batch assignment, or approval through the standalone
      experiment lifecycle exactly as for EXP-MONO-4c7479.
    - >-
      Independent review confirms the O(p) character-sum point-counting
      method is actually what the submitted implementation uses for Stage 0
      (not a slower O(p^2)-or-worse method that would risk the budget).
    - >-
      Independent review confirms the ordering invariant: that the
      pre-registered closed-form table for each panel curve was emitted and
      archived strictly before that curve's Stage-1 base-point enumeration.
    - >-
      Independent review confirms the excluded-strata accounting: that the
      double-root stratum, (A4), and (B2) are counted separately, never
      pooled into R1/R2/R3's five primary classes or into each other.

