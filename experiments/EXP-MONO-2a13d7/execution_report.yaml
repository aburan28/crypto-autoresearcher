          double_root: 101
          A4_ramified_A: 100
          B2_ramified_B: 1
          Z_of_curve: 1
          forced_check: "Z=1 implies B2 forced exactly 1 -- MATCHES; A4 forced Z(p-Z)+C(Z,2)=1*100+0=100 -- MATCHES"
        - prime: 101
          panel_curve: {A: 4, B: 1}
          double_root: 101
          A4_ramified_A: 297
          B2_ramified_B: 0
          Z_of_curve: 3
          forced_check: "Z=3 implies A4 forced 3*98+3=297 -- MATCHES; B2 forced (Zprime-Z)/2=(3-3)/2=0 -- MATCHES"
        - prime: 211
          panel_curve: {A: 1, B: 2}
          double_root: 211
