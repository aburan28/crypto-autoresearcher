experiment:
  id: EXP-SIDECH-8598df
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-7b5bcf; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-7b5bcf
  question_id: RQ-ECDSA-87625f
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Compute exact posterior entropy of a toy scalar under m operation-word observations as a
    function of scalar-blinding width, and fit the accumulation law, with a forced-saturation control
    at zero blinding and two structural nulls.
  objective: 'The one uncertainty a run reduces: whether scalar blinding changes how information about
    the secret ACCUMULATES across observations, or only how much a single observation carries. Concretely:
    (i) does the zero-blinding arm saturate exactly, meaning the joint information over m identical
    traces equals the single-trace value at every m, since this is forced by construction and is the
    only check that the multi-trace posterior machinery is not manufacturing accumulation; (ii) do
    both nulls behave exactly as derived -- an independent word leaving the posterior at full entropy
    with a fitted exponent of exactly zero, and a mask-then-unmask arm reproducing the zero-blinding
    curve bit-identically at every blinding width -- which together separate the measured effect from
    the harness''s own blinding code path; (iii) given (i) and (ii), do the accumulation curves for
    different blinding widths separate at all, and if so what exponent does each support and with
    what residuals. The run answers these and stops. It recovers no scalar, constructs no attack and
    produces no cost.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: ''for this scalar-multiplication
      routine at this toy group order, with an ASSUMED operation-word observer and ideal independent
      blinding randomness, the per-trace information and the accumulation curve are as tabulated against
      blinding width, with zero-blinding saturating exactly and both nulls flat.'' What does NOT follow:
      that any operation word is observable on any device; that any real blinding implementation behaves
      this way, since ideal randomness is assumed; that an accumulation exponent implies any number
      of traces for a real recovery; that anything transfers to 256-bit curves, where the ratio of
      blinding width to order differs in kind; and anything about the security of ECDSA or any deployed
      system. A large exponent is NOT an attack and a small one is NOT a proof that blinding works.'
  inputs:
    procedure: 'STAGE 0 (cost: ~1 hour): fix the toy group order, the routine, the operation-word
      convention, and the blinding widths; write the assumed-observation statement into the contract.
      STAGE 1 (cost: ~2 hours): implement the exact single-trace likelihood table -- for each k and
      each r, the emitted word -- and the posterior update in Fraction arithmetic. STAGE 2 (cost:
      seconds): b=0 forced-saturation check and both nulls, before any sweep. STAGE 3 (cost: minutes
      CPU): sweep b in {0,1,2,3,4} and m up to 256 at a 12-bit order, recording posterior entropy
      at every m. STAGE 4 (cost: ~30 minutes CPU): repeat at a 16-bit order for the b values that
      remain enumerable, and record explicitly the b at which enumerability is lost. STAGE 5 (cost:
      minutes): fit both candidate accumulation families, report both residual sets, select by residual,
      compute traces-to-one-bit per b. STAGE 6 (cost: minutes): run the cross-instrument check against
      the companion operation-word enumeration at the b=0, m=1 cell, and emit the run record with
      conventions, seeds, the enumerability boundary and both nulls.'
    instrument: 'Python 3 standard library: fractions.Fraction for exact posterior and entropy arithmetic,
      collections.Counter for word-fibre accumulation with the word itself as key so no hash collision
      is possible, itertools for enumeration. numpy for the curve fitting and residual reporting only.
      The scalar-multiplication operation-word emitter is shared with the companion proposal in this
      batch, deliberately, so the cross-instrument check is meaningful. harness/toycurve.py for the
      reference routine used in the emitter-fidelity check; harness/runner.py and src/crypto_autoresearcher/runner.py
      for run-record emission and seed recording. No Sage. No timing, cache or physical measurement
      enters any reported metric.'
    parameters: 'Toy group orders: 12-bit primary, 16-bit secondary. Blinding widths b in {0, 1, 2,
      3, 4}, with the enumerability boundary recorded per order. Trace counts m from 1 to 256 in a
      geometric ladder plus every integer up to 16. Routine: naive binary double-and-add (primary)
      and w-NAF at w=4 (secondary), so the accumulation law can be compared across two observations
      of different coarseness. Nulls: independent word with matched length distribution, and mask-then-unmask,
      both at every (b, m). Arithmetic: Fraction exact with a float cross-check at 1e-12. Fit families:
      alpha*log(m) + c, and a saturating exponential; both fitted, both residual sets reported.'
  controls:
  - Independent-word null with matched length distribution, run through the identical posterior and
    fitting code.
  - Mask-and-unmask null, which must reproduce the b=0 curve at every b.
  - b=0 forced-saturation control.
  - 'Cross-instrument control: the b=0, m=1 cell must reproduce the exact conditional entropy computed
    by the companion operation-word enumeration proposal in this batch, to the last bit.'
  - 'Exact-arithmetic control: posterior entropies computed in Fraction and in float, agreement to
    1e-12.'
  - 'Fit-family control: both the logarithmic and the saturating family are fitted and both sets of
    residuals reported, with selection by residual and not by preference.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls in the same invocation. (i) INDEPENDENT-WORD NULL: replace
    each observed word by one drawn independently of k with the same length distribution, and run
    the identical posterior-update and fitting code. The posterior entropy must remain exactly H(k)
    at every m and the fitted alpha must be exactly 0; a nonzero alpha means the fitting procedure
    manufactures accumulation from noise and no signal fit is reportable. (ii) MASK-AND-UNMASK NULL:
    apply blinding with a fresh r and then immediately remove it before the observation is formed,
    so the machinery runs at every b but the observation is the unblinded one; the resulting curve
    must be bit-identical to the b=0 curve at every b, which shows the measured effect comes from
    the blinding''s presence in the observation and not from the harness''s blinding code path. Both
    nulls are executed with the same seeds and the same code as the signal arm.'
  independent_variables:
  - blinding width b
  - trace count m
  - group order bit-length
  - routine (double-and-add, w-NAF w=4)
  - arm (signal, independent-word null, mask-then-unmask null)
  metrics:
    primary:
    - I(k ; W) per trace at each b
    - posterior entropy of k against m at each b
    - fitted accumulation exponent alpha with residuals for both families
    - traces-to-one-bit at each b
    secondary:
    - both null curves
    - cross-instrument agreement at b=0 and m=1
    - enumerability boundary in b per group order
    - Fraction versus float discrepancy
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The posterior entropy of k as a function of trace count m at each blinding width, and
      the accumulation exponent fitted from it.
    formula: 'One forced law and one structural bound are pre-committed. Forced: at b=0 the blinding
      factor is constant, every trace emits the same word, and the posterior after m traces equals
      the posterior after one, so H(k | W_1..W_m) = H(k | W_1) exactly at every m and the fitted alpha
      is exactly 0. Structural bound: for any b, the joint information over m traces is at most m
      times the per-trace information and at most H(k), so the accumulation curve is squeezed between
      a saturating ceiling at H(k) and a linear envelope; the run reports where the measured curve
      sits between them at every m, as a fraction, which is a scale-free summary comparable across
      b and across routines. The exponent alpha itself is NOT pre-committed, and the reason is that
      it is the quantity the experiment exists to measure; pre-committing a value would give the fit
      a target and the fit is already the softest step in the pipeline.'
    source: Pre-registered in the parent proposal IDEA-20260816-7b5bcf before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Group orders of 12 and 16 bits with blinding widths up to 4 bits, chosen because
      that is exactly the regime where k and k + r*n remain enumerable and every posterior is exact
      rather than estimated. Deployed curves are 256 bits with blinding widths of the order of 32
      to 64 bits, a regime this method cannot reach at all: the enumeration is exponential in the
      order''s bit-length and the record states the boundary explicitly rather than extrapolating
      past it. NO transfer to deployed parameters is claimed. What does transfer unconditionally is
      structural: the b=0 saturation, the two null behaviours, and the linear-envelope-and-ceiling
      bound hold at any order by derivation and are reported as such.'
    correspondence: null
  tail_checks:
  - Inspect the largest m at the largest b, where the posterior is flattest and Fraction-to-float
    conversion is least stable.
  - Inspect the b value adjacent to the enumerability boundary, where an exact computation silently
    becomes an approximate one if the boundary is misdetected.
  - Inspect the m=1 cell at every b against the direct single-trace computation, which must agree
    exactly.
  - Inspect the fit residuals at small m, where both candidate families are least distinguishable.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt before any sweep if the b=0 arm fails to saturate exactly or if either null moves; report
    a computational fault and run nothing further.
  - Stop at m=256 and at b=4; do not extend either in search of a cleaner fit.
  - Halt at any b where the blinded scalar leaves the enumerable range, record the boundary, and report
    no fitted exponent at or beyond it.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The b=0 arm saturates exactly, both nulls remain flat as derived, the cross-instrument
    check agrees to the last bit, and exact accumulation curves with fitted exponents and residuals
    are produced for every enumerable b at both group orders.
  falsification_criterion:
  - The b=0 arm does not saturate exactly.
  - The independent-word null shows posterior entropy below H(k) at any m, or a nonzero fitted alpha.
  - The mask-then-unmask null differs from the b=0 curve anywhere.
  - The cross-instrument check at b=0, m=1 disagrees with the companion enumeration.
  - The measured accumulation curve exceeds the linear envelope or the H(k) ceiling anywhere.
  - Both fit families leave residuals large enough that no exponent is supported, in which case raw
    curves are reported and no alpha is claimed.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-7b5bcf
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The two candidate accumulation families are chosen by convenience and a Coordinator must decide
    whether selection by residual is adequate or whether a third family is required.
  - Ideal independent blinding randomness is assumed; the contract does not say how a defective generator
    would be modelled, and that is the case most likely to matter.
  - The enumerability boundary in b is stated as a run-time detection rather than derived in advance,
    so the reachable parameter range is not known before the run.
  - No bridge is specified from an accumulation exponent to a trace count for recovery, so the number
    produced cannot yet be consumed by any cost model in this program.
