# EXPERIMENT CONTRACT -- EXP-HQC-b6e6db (review_required, unapproved, zero runs).
experiment:
  id: EXP-HQC-b6e6db
  hypothesis_id: H-HQC-fb97e6
  derived_from_idea: IDEA-20261018-c8bf9b
  question_id: RQ-HQC-001
  goal_id: GOAL-HQC-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Per-key DFR tail with boosting
  objective: Whether weak keys exist and are detectable.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: C reduced HQC with IS estimator
    parameters: n=2003; 10^4 keys; 10^6 boosted ciphertexts per key; SPRT thresholds alpha=beta=0.05
    procedure: 1. Keys. 2. Per-key IS DFR. 3. Tail statistics. 4. SPRT simulation.
  controls:
  - 'null: same measurement with shuffled key labels (permutation null)'
  - 'positive: planted weak keys with clustered support'
  - 'A/A: two seed blocks of ciphertexts per key'
  independent_variables:
  - ciphertexts
  - key_population
  metrics:
    primary:
    - p99/median
    secondary:
    - SPRT queries
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: p99/median
    formula: dispersion from additive energy model (IDEA-20260805-15258a)
    source: internal
  scale_relevance:
    tier: toy
    justification: 'reduced n; transfer: dispersion shape'
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 120
    maximum_memory_gb: 16
    maximum_runs: 30
  stopping_rules:
  - stop at 10^4 keys
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - key with IS weight overflow excluded and reported
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: Success if C1 shows p99/median >= 4 beyond the AA1 noise floor (P1) and
    SPRT <= 2^10 (P2).
  falsification_criterion: Falsified if C1 shows p99/median <= 1.5.
  decision_impact:
    on_positive: File a weak-key multi-key attack cost model.
    on_negative: Record per-key DFR as concentrated under boosting at reduced n.
  variable_ledger:
    independent:
    - name: ciphertexts
      levels:
      - boosted
      - random
    - name: key_population
      levels:
      - random
      - planted_weak
    factors:
    - name: seed_block
      treatment: randomized
      value: seed blocks A and B, disjoint master seeds
      how: >-
        two disjoint master seeds derived by SHAKE256 from a frozen label; every arm run under
        both
    comparisons:
    - id: C1
      arms:
      - boosted random
      - random random
      differs_in:
      - ciphertexts
      design: one_factor
    - id: C2
      arms:
      - boosted random
      - boosted planted_weak
      differs_in:
      - key_population
      design: one_factor
    - id: C3
      arms:
      - permutation null
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - boosted random seed-block A
      - boosted random seed-block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-c8bf9b.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-c8bf9b.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml with frozen parameters, seeds, code commit and tool versions
  - raw-result.json with per-trial records and verification flags
  - per-key DFR CSV
  - tail plot SVG
  - PDF
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-HQC-b6e6db/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-c8bf9b.
    standing_authorization: >-
      AGENTS.md 'Standing user authorization' lets the Coordinator approve once the contract
      is complete and runnable; no user re-approval is required.
