# EXP-BINSTD-8fc9e9
# Product-space dimension table. No solver.
# Approved by DEC-20261002-eee40a.
experiment:
  id: EXP-BINSTD-8fc9e9
  hypothesis_id: H-BINSTD-b17afd
  source_idea: IDEA-20260926-120d6a
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Product-space dimension table
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-eee40a
  objective: >-
    Apply min(k*(l-1)+1, 131) on the five named cells. Compare the
    (5, 23) sum with 3 times 115. Place the three toy factors between
    the half-tenth powers. Reject saturation at k = 5 on (8, 20).
  inputs:
    cap: 131
    cells:
      - {m: 5, l: 23, dims: [23, 45, 67, 89, 111], sum: 335, ml: 115, excess: 204, saturated_k: []}
      - {m: 5, l: 28, raw_last: 136, dims: [28, 55, 82, 109, 131], sum: 405, ml: 140, excess: 274, saturated_k: [5]}
      - {m: 6, l: 22, dims: [22, 43, 64, 85, 106, 127], sum: 447, ml: 132, excess: 316, saturated_k: []}
      - {m: 6, l: 24, raw_last: 139, dims: [24, 47, 70, 93, 116, 131], sum: 481, ml: 144, excess: 350, saturated_k: [6]}
      - {m: 8, l: 20, k5: 96, k6: 115, raw_k7: 134, raw_k8: 153, sum: 667, ml: 160, excess: 536, first_saturated_k: 7}
    ratio_523:
      sum: 335
      plain: 115
      three_times: 345
      above_29_tenths: true
      below_3: true
    group:
      twice_131: 262
      five_factorial: 120
      equal: false
    toys:
      - {l: 4, dims: [4, 7, 10], sum: 21, gap: 9, factor: 3072}
      - {l: 5, dims: [5, 9, 13], sum: 27, gap: 12, factor: 24576}
      - {l: 6, dims: [6, 11, 16], sum: 33, gap: 15, factor: 196608}
    six_to_the_fifth: 7776
    two_to_the_thirteenth: 8192
    thirty_six_above_thirty_two: true
  controls:
    - >-
      Saturation at k = 5 on (8, 20) is false. The dimension is 96.
      Reporting 131 there invalidates the run.
    - >-
      Reporting the (5, 23) sum at least 3 times 115 is false.
      335 is strictly below 345. That report invalidates the run.
    - >-
      Reporting 262 equal to 5! is false. 5! is 120. That report
      invalidates the run.
    - >-
      Reporting 6*2^15 at least 2 to the power 17.6 is false.
      7776 is strictly below 8192. That report invalidates the run.
    - >-
      Reporting the l = 4 factor at most 2 to the power 9.6 is false.
      3072 is strictly above that power. That report invalidates
      the run.
    - Two integer routes. They must not import each other.
  independent_variables:
    - cell
    - route in {min_formula, repeat_module}
  metrics:
    primary:
      - capped_sums
      - excesses
      - k5_below_131
      - factor_brackets
      - three_times_rejected
      - implementations_agree
    secondary:
      - group_order_bits
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Five sums, five excesses, and three factor brackets.
    formula: >-
      The unreduced dimension is k*(l-1)+1. Cap it at 131, or at 17
      on the toy cells. The sum is the sum of the capped dimensions.
      The excess is that sum minus 131. The toy factor is 6 times
      2 to the power (sum minus m*l). Compare powers by
      cross-multiplication. 6 to the fifth against 2 to the 13th
      places a factor strictly below gap-plus-2.6. 36 against 32
      places it strictly above gap-plus-2.5.
    source: >-
      IDEA-20260926-120d6a names the five cells and the sums 335 and
      405. The remaining sums, the (8, 20) index, and the factor
      brackets were recomputed in this design session. That
      computation is not a run. The written l = 4 exponent 9.6 is
      below the exact factor. No system was solved.
  scale_relevance:
    tier: toy
    justification: Integer dimension counts. No transfer to a solution count.
    correspondence: null
  tail_checks:
    - The (8, 20) cell is required. Stopping after (5, 28) and still reporting k = 5 there is invalid.
  replication:
    seeds: []
    independent_instances: 5
    replication_note: Deterministic. The second run is the other integer route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If k = 5 at (8, 20) is reported as 131, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - k = 5 at (8, 20) is reported as 131.
    - The (5, 23) sum is reported at least 345.
    - 262 is reported equal to 120.
    - 7776 is reported at least 8192.
    - The l = 4 factor is reported at most 2 to the power 9.6.
    - A symmetrised system or a solution count is reported.
  success_criterion: >-
    Both runs agree on the five sums, the five excesses, the unreduced
    tails 136 and 139, the (8, 20) fifth dimension 96, the first
    saturating index 7, the inequality of 262 and 120, and the three
    factor brackets. k = 5 at (8, 20) stays below 131. The (5, 23)
    sum stays strictly below 345.
  falsification_criterion: >-
    The runs agree, k = 5 at (8, 20) stays at 96, 262 stays unequal
    to 120, and any sum, excess, dimension, or factor bracket differs
    from the preregistered table.
  required_artifacts:
    - experiments/EXP-BINSTD-8fc9e9/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-8fc9e9/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-8fc9e9/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-8fc9e9/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-8fc9e9/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-8fc9e9/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any symmetrised solve, lift, or solution count.
    - A claim that symmetrisation fails or succeeds as an attack.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
