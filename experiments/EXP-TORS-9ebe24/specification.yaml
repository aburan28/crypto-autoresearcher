experiment:
  id: EXP-TORS-9ebe24
  hypothesis_id: H-TORS-9851f8
  derived_from_idea: IDEA-20260807-6eab6a
  question_id: RQ-TORS-8c7b79
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Known-answer calibration of the ell-primary torsion instrument against the coprimality vanishing
    theorem - trivial values at ell different from N with re-verifiable division-point certificates,
    a blocking non-trivial ell = N boundary control, a Pohlig-Hellman leak control, and a planted
    non-homomorphic functional that must vary in k
  objective: >-
    The deliverable of the parent proposal is a DERIVATION, and it is complete without any run. The
    one uncertainty a run reduces is therefore about the INSTRUMENT the sibling records in this lane
    will use, and about how strong a scoped closure that instrument can support. A run establishes
    (i) whether the instrument can see a non-trivial pairing at all, by requiring a non-trivial
    reduced Tate pairing on a small-embedding-degree fixture at ell = N - the blocking calibration
    without which every trivial value it reports is uninterpretable; (ii) whether it can see a leak
    that provably exists, by requiring the composite-order base point control to recover the scalar
    modulo ell and match ground truth; (iii) whether its variation detector works, by requiring a
    deliberately non-homomorphic functional to vary over the swept scalars; and (iv) the measured
    obstruction quantity itself - the number of distinct observable values taken by each candidate
    invariant over at least 32 distinct scalars per instance, predicted to be exactly 1 at every ell
    different from N, with an ell-division-point certificate per cell that the run wrapper
    re-verifies independently.
    No attack, key recovery, speedup or security consequence is claimed here or would follow from a
    run. No lower bound on the ECDLP is claimed. No statement is made about ell = N beyond using it
    as a calibration.
  what_this_is_not:
    - >-
      Not an attack, a lower bound, a hardness result, or a cryptanalytic result of any kind. It is a
      derivation plus an instrument-calibration contract.
    - >-
      Not evidence FOR the vanishing theorem. The theorem is elementary and unconditional and is
      carried by the archived derivation note; a run can only exhibit its value on sampled instances
      and show that the instrument would have seen a different value had one existed.
    - >-
      Not a statement about ell = N, about extension fields, about supersingular curves over
      F_{p^2}, about composite-order base points, or about non-homomorphic functionals.
    - >-
      Not a status change to any hypothesis, evidence record, decision or goal record, and not a
      promotion of any knowledge entry.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
      has been executed under this contract.
  claim_ceiling:
    tier: toy_instrument_calibration
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the executed toy field sizes, for the executed primes ell and
      the executed swept scalars, each named candidate invariant took exactly one value across all
      swept scalars, each ell-division-point certificate re-verified, and the instrument
      demonstrably could have detected a non-trivial pairing and a genuine leak because it did so on
      the two calibration arms. WHAT DOES NOT FOLLOW - the universal theorem, which comes from the
      derivation note and never from the run; anything about ell = N; anything about non-homomorphic
      functionals; anything about the cost of the ECDLP; and specifically NOT that a lane closure may
      cite these runs alone, since the closure's universal quantifier is carried by the derivation.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, THE ACTUAL DELIVERABLE): write and archive the derivation note carrying
      the vanishing theorem and its four consequences C1 to C4, with every step justified by an
      elementary group-theoretic fact, plus the explicit boundary analysis naming the three ways the
      coprimality hypothesis can fail and what each implies. This artifact is complete without any
      run and must be archived BEFORE any decision rests on it.
      STAGE 1 (minutes): known-answer checks at ell different from N. On 5 seeds at each of 16, 20
      and 24 field bits, restricted to curves whose cofactor has a prime factor ell in
      {3, 5, 7, 11, 13} - (a) exhibit an explicit ell-division point of P inside G, namely the
      multiple of P by the inverse of ell modulo N, and emit it as a certificate; (b) compute the
      reduced Tate pairing of P against every point of E(F_p) of order ell, with the embedding degree
      computed rather than assumed; (c) compute the Weil pairing of P against ell-torsion. Repeat all
      of (a) to (c) at every one of at least 32 distinct scalars k, recording the observable per
      scalar so that constancy is measured rather than asserted.
      STAGE 2 (minutes, HARD GATE): the ell = N boundary embedding. On a fixture with small embedding
      degree, compute the reduced Tate pairing of P against a point of G itself over the extension
      field. Required - a NON-TRIVIAL N-th root of unity for at least one argument. GATE.
      STAGE 3 (minutes, HARD GATE): the composite-order control. On the same curve take a generator
      of the full group of order h times N, project to the ell-part, recover the scalar modulo ell,
      and compare against ground truth. Required - exact agreement. This is Pohlig-Hellman and is
      labelled as such. GATE.
      STAGE 4 (minutes, HARD GATE): the planted non-homomorphic functional. Evaluate a deliberately
      non-homomorphic map of a point - for instance the x-coordinate reduced modulo ell - over the
      same swept scalars. Required - strictly more than one distinct value. GATE.
      STAGE 5 (zero compute): report the per-cell observable counts, the certificate re-verification
      outcomes, the three gate verdicts, and the forward-guidance list naming what remains open after
      this closure.
    instrument: >-
      Python with arbitrary-precision integers; the toy instance generator and the pairing routines
      are the shared lane instrument, and x(P - R)-style shifted computations, where used, go through
      the SAME code path as their unshifted counterparts. Division polynomials are NOT required -
      ell-torsion points are obtained by multiplying random points by the group order divided by ell.
      Every claimed ell-division point is emitted as a certificate and re-verified by the run wrapper
      through an independent scalar multiplication, per docs/claims-and-verification.md. Recorded
      through the program's run wrapper with a manifest.
    parameters: >-
      Field sizes 16, 20 and 24 bits; 5 seeds each; ell in {3, 5, 7, 11, 13} restricted per instance
      to those dividing the group order and different from N; at least 32 distinct scalars k per
      instance, drawn from a declared seed stream disjoint from the instance seed; the ell = N
      boundary fixture selected for small embedding degree and recorded with its embedding degree;
      the composite-order control on the same curves using a generator of the full group. Every
      instance records its fully factored group order.
  controls:
    - >-
      ell = N BOUNDARY CONTROL, blocking - the reduced Tate pairing on a small-embedding-degree
      fixture must return a NON-TRIVIAL N-th root of unity. An instrument that returns the trivial
      value everywhere, including where a non-trivial value provably exists, is measuring its own
      zero and every ell different from N output it produced is void.
    - >-
      COMPOSITE-ORDER LEAK CONTROL, blocking - with a base point of composite order h times N on the
      same curve, the projection to the ell-part must be non-trivial and must recover the scalar
      modulo ell, matching ground truth exactly. This demonstrates the instrument can see a real leak
      and pins the exact hypothesis the theorem uses, namely the greatest common divisor of the base
      point's order with ell.
    - >-
      PLANTED NON-HOMOMORPHIC POSITIVE, blocking - a deliberately non-homomorphic functional of the
      point must take strictly more than one value over the swept scalars, so that a null on the
      homomorphic family is not an instrument-wide null.
    - >-
      CERTIFICATE RE-VERIFICATION - every claimed ell-division point is multiplied by ell by an
      independent code path and must return the original point. A division point the transport code
      merely believed it produced is not a certificate.
    - >-
      EMBEDDING-DEGREE COMPUTATION - the embedding degree is computed per fixture and recorded, never
      assumed. An unreduced Tate pairing is defined only up to N-th powers and would make every
      comparison meaningless; the reduction exponent is recorded per fixture.
    - >-
      FACTORED-ORDER RECEIPT - every instance records its fully factored group order, since toy-scale
      smooth cofactors both enable these checks and make accidental degeneracies more likely.
  independent_variables:
    - prime ell, over {3, 5, 7, 11, 13} restricted to divisors of the group order different from N
    - scalar k, over at least 32 distinct values per instance
    - field size in bits
    - 'invariant family: ell-division class / reduced Tate against ell-torsion / Weil against ell-torsion / planted non-homomorphic functional'
    - 'base point order: prime N (the theorem) versus composite h times N (the Pohlig-Hellman control)'
    - 'ell relative to N: different (the theorem) versus equal (the boundary control)'
  metrics:
    primary:
      - name: distinct_observable_values_over_k
        units: exact integer count of distinct values
        computed: >-
          For each (instance, ell, invariant family) cell, the number of DISTINCT values the
          invariant takes across the at least 32 swept scalars k. Predicted exactly 1 for every
          homomorphic family at ell different from N, and strictly greater than 1 for the planted
          non-homomorphic functional. This is the quantity a scoped closure of this candidate family
          would be measured as.
      - name: boundary_pairing_nontriviality
        units: 'categorical: non_trivial / trivial, with the pairing value and the embedding degree'
        computed: >-
          The reduced Tate pairing value at ell = N on the small-embedding-degree fixture, with the
          embedding degree and the reduction exponent recorded. Required outcome is non_trivial for
          at least one argument.
      - name: composite_order_scalar_recovery
        units: 'categorical per instance: recovered_and_matches / recovered_and_mismatches / not_recovered'
        computed: >-
          The scalar modulo ell recovered by projecting the composite-order base point's instance to
          the ell-part, compared against ground truth. Required outcome is recovered_and_matches on
          every instance.
      - name: division_point_certificate_pass_count
        units: exact integer count over exact integer count of cells
        computed: >-
          Number of emitted ell-division-point certificates that re-verify when multiplied by ell
          through an independent code path, over the number emitted. Required equality.
    secondary:
      - name: pairing_values_per_cell
        units: field element in the appropriate extension, recorded exactly
        computed: >-
          The Weil and reduced Tate pairing values per (seed, bits, ell, torsion point, scalar),
          recorded in full rather than as a pass/fail, so a single anomalous value can be located.
      - name: planted_functional_value_spread
        units: exact integer count of distinct values
        computed: Distinct values of the planted non-homomorphic functional over the swept scalars, per instance.
      - name: factored_group_order
        units: factorisation of the group order per instance
        computed: Recorded per instance, with h and N identified and N verified prime and exactly dividing.
      - name: embedding_degree_per_fixture
        units: exact integer
        computed: Computed per fixture rather than assumed, and reported alongside every Tate pairing value.
      - name: instances_excluded
        units: exact integer with reason codes
        computed: >-
          Number of generated instances excluded because no admissible ell divides the group order,
          or because the primality or exact-division check on N failed, with per-reason counts.
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The tuple (distinct_observable_values_over_k, boundary_pairing_nontriviality,
      composite_order_scalar_recovery, planted_functional_value_spread).
    formula: >-
      distinct_observable_values_over_k = 1 EXACTLY, on 100 percent of cells, for every homomorphic
      invariant family at every ell different from N, with the ell-division-point certificate
      re-verifying in every cell. boundary_pairing_nontriviality = non_trivial on at least one
      fixture. composite_order_scalar_recovery = recovered_and_matches on every instance.
      planted_functional_value_spread strictly greater than 1. BASIS - the first is a derivation in
      the parent record and has NOT been measured anywhere in this campaign; the second is classical
      and is used here as a known-answer calibration, likewise never measured in this campaign; the
      third is Pohlig-Hellman; the fourth is a construction.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-6eab6a (predictions block) before any run
      under this contract exists. The sweep over at least 32 scalars, and the recasting of "constant
      in k" as the countable metric distinct_observable_values_over_k, are added by this contract and
      are frozen here before any run.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at 16 to 24 field bits, far below any deployed parameter set. That is adequate BECAUSE
      the quantity under test is an algebraic identity whose value at toy scale is the value the
      definition gives, not an approximation to a larger-scale value - and because the universal
      statement is carried by the derivation note rather than by the runs. The toy scale is in fact
      what makes the two calibration arms affordable at all - a small-embedding-degree fixture and an
      exhaustible ell-part. No transfer assumption is made and none is needed; the run's role is to
      calibrate an instrument, and the instrument's calibration is asserted only at the sizes tested.
    correspondence: null
  tail_checks:
    - >-
      Report the full per-scalar observable list for at least one cell per (bits, ell) pair, not only
      the distinct-value count, so a reviewer can see that the sweep was actually performed.
    - >-
      Report every cell in which the number of ell-torsion points of E(F_p) is 1, since a cell with no
      non-trivial second argument is vacuous and would inflate the pass count.
    - >-
      Report the number of instances excluded by the primality and exact-division checks, with
      reasons, since silent exclusion would turn a filtered instance set into an apparent universal.
    - >-
      Report the embedding degree and the reduction exponent for every Tate pairing computed, since
      an unreduced pairing is only defined up to N-th powers and would produce a spurious trivial
      value.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
      - 20260828
      - 20260829
    independent_instances: 5
    note: >-
      Any cell reporting a non-trivial value at ell different from N must additionally be replicated
      by an INDEPENDENT implementation before it is reported as anything other than a suspected
      implementation error.
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1.0
    maximum_memory_gb: 4
    maximum_runs: 20
  stopping_rules:
    - Do not run any stage before the Stage 0 derivation note is archived; the note is the deliverable and the runs calibrate an instrument for it.
    - Halt if the ell = N boundary control returns the trivial value on every fixture; report the fixtures tried and their embedding degrees, and nothing else.
    - Halt if the composite-order control fails to recover the scalar modulo ell; the instrument cannot see a provable leak.
    - Halt if the planted non-homomorphic functional is constant over the swept scalars.
    - >-
      Stop at the declared sweep - 3 field sizes, 5 seeds, the admissible ell set, at least 32
      scalars. The scalar count is frozen before Stage 1 and is not raised after seeing a result.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop,
      never a negative result (AGENTS.md rule 5).
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
      and is NEVER negative mathematical evidence (AGENTS.md rule 5).
    - >-
      A run whose boundary, composite-order or planted-positive arm was not executed in the SAME
      invocation as the signal arms is invalid_measurement - the calibration was not established on
      the pipeline that produced the numbers.
    - >-
      Failure to construct a small-embedding-degree fixture at the executed sizes is an
      INFRASTRUCTURE outcome, not a blindness finding; the run is incomplete and is re-dispatched, or
      the fixture is constructed and explicitly labelled as constructed.
    - >-
      Any ell-division-point certificate that fails independent re-verification makes the run
      completed_invalid (docs/claims-and-verification.md).
    - >-
      A run whose parameters differ from this contract is a DIFFERENT experiment and requires a new
      contract; it is never a repair of this one.
  success_criterion: >-
    The run is successful when ALL of the following hold and are read off the predefined metrics:
    (1) the Stage 0 derivation note is archived before any run; (2) boundary_pairing_nontriviality =
    non_trivial on at least one fixture, with its embedding degree and reduction exponent recorded;
    (3) composite_order_scalar_recovery = recovered_and_matches on every instance;
    (4) planted_functional_value_spread is strictly greater than 1 on every instance;
    (5) division_point_certificate_pass_count equals the number of certificates emitted; and
    (6) distinct_observable_values_over_k is reported for every (instance, ell, invariant family)
    cell, together with the full per-scalar observable list for at least one cell per (bits, ell)
    pair.
  falsification_criterion:
    - >-
      The ell = N boundary control returns the trivial value on every fixture - THE INSTRUMENT IS
      BLIND, every trivial value it reported at ell different from N is uninterpretable, and the run
      set is INVALID rather than confirmatory. No closure may cite it.
    - >-
      The composite-order control fails to recover the scalar modulo ell - the instrument cannot see
      a leak that provably exists, so its nulls are void.
    - >-
      The planted non-homomorphic functional is constant over the swept scalars - the variation
      detector is broken and a null on the homomorphic family cannot be distinguished from an
      instrument-wide null.
    - >-
      distinct_observable_values_over_k is greater than 1 at any cell with ell different from N whose
      per-instance hypotheses (N prime and exactly dividing, P of order exactly N, ell different from
      N) are all verified - this contradicts an elementary theorem and is treated as a SUSPECTED
      IMPLEMENTATION ERROR, replicated by an independent implementation, and only if it survives
      that is the derivation note itself - most likely its pairing normalisation or its
      division-point bookkeeping - reported as wrong, with the record superseded rather than amended.
    - >-
      Any ell-division-point certificate fails re-verification - the run is completed_invalid and no
      value from it is admissible.
  required_artifacts:
    - the Stage 0 derivation note, archived before any run, carrying the theorem, C1 to C4, and the boundary analysis
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved inference block and environment
    - raw-result.json carrying every per-scalar observable for every cell, not distinct-value counts alone
    - the boundary, composite-order and planted-positive arms' measurements, in the same file as the signal arms
    - every ell-division-point certificate and its independent re-verification outcome
    - the embedding degree and reduction exponent per fixture
    - the factored group order per instance and the excluded-instance list with reason codes
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Approval is required before execution and is the USER's gate, because it authorizes execution
      and spends compute. This contract is review_required and NOT approved; approved_by is null and
      execution_authorized is false.
    - >-
      The parent proposal is PROOF-ORIENTED and carries a proof_search_map. Per KN-TECH-080 and the
      Coordinator's proof-oriented dispatch gate, that map must be audited before implementation -
      specifically its baseline embedding (the ell = N slice and its frozen fixture), its observation
      collision (the total collision that IS the closure), its quantifier order, and its nearby-object
      control (the composite-order base point).
    - >-
      The Stage 0 derivation note must be archived as a committed artifact BEFORE any decision cites
      it. This is the exact gap the lane has recorded previously, where a derivation lived only inside
      a review report.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260807-6eab6a
    authored_at: '2026-08-25'
    note: >-
      The theorem, its four consequences, the boundary analysis, the three calibration controls and
      the predicted values are transcribed from the parent proposal's claim, mechanism, predictions,
      minimal_test and null_object_control blocks. What this contract ADDS is the recasting of
      "constant in k" into the countable metric distinct_observable_values_over_k measured over an
      explicit sweep of at least 32 scalars, because the proposal's prediction of a constant was
      otherwise not decidable from any listed metric, and because a scoped closure needs an
      obstruction with a measured quantity and a scope rather than a prose assertion. Budgets come
      from the parent's declared estimated_cost (implementation low, compute low) through the
      program's cost table.
  derivation_gaps:
    - >-
      The exact pairing normalisation convention is not fixed here. C3's correctness depends on it,
      and the parent proposal itself puts its residual risk in the pairing conventions of C3 and the
      division-point bookkeeping of C4. The convention must be fixed against the committed instrument
      before Stage 1.
    - >-
      Whether the ell = N boundary fixture may be a constructed supersingular toy curve, rather than
      an ordinary curve found by search, is left open by the parent proposal. It must be settled
      before Stage 2, and if a constructed fixture is used it must be labelled as such in every
      report, since the theorem's declared family is ordinary curves.
    - >-
      The 32-scalar sweep size is the Coordinator's choice, derived from the need for
      distinct_observable_values_over_k to be a non-vacuous count rather than from a power
      calculation. A reviewer who wants a stronger statement about constancy must fund a larger sweep
      by amendment before the run.
    - >-
      C4, the division-field statistic, is asserted in the hypothesis but no metric in this contract
      measures it. Either a metric must be added before approval or C4 must be declared
      derivation-only and excluded from the run's scope explicitly, so that a later reader does not
      take the run as having checked it.
