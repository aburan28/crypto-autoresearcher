experiment:
  id: EXP-ICEX-7caca4
  hypothesis_id: H-ICEX-652b0d
  version: 1
  title: >-
    Propagation defect in bits over a division-polynomial-free projection panel,
    against a closed-form curve-free random-relabelling null, with forced-value
    controls at computed magnitudes and declared underpowered cells
  status: draft
  objective: >-
    Measure D_k(pi) = H(pi_k-step image | inputs) in BITS for every member of a
    frozen projection panel over six primes from 2^16 to 2^28 at three curves per
    prime, and report the GAP BELOW the closed-form random-relabelling null rather
    than the distance above zero, because the rigidity theorem forecloses zero for
    every lossy member. The panel excludes division polynomials, which belong to
    IDEA-20260807-df906f. The comparison threshold applies only in cells whose
    closed-form null is at least 0.30 bits; cells below that are reported as
    underpowered with their computed power.
  inputs:
    primes: six values from 2^16 to 2^28 with the curve order prime
    curves_per_prime: 3
    samples_per_member_per_curve: 10000000
    depths: [1, 2, 3, 4, 5, 6, 7, 8]
    panel:
    - P0 identity on (x, y), lossless control
    - P1 Kummer quotient, x only, quotient by plus-minus one
    - P2 quadratic character of x
    - P3 d-th power residue symbol of x for d dividing p - 1, d in {3, 5, 7} where available
    - P4 top t bits of the integer representative of x, t in {1, 2, 4, 8}
    - P5 bottom t bits of x, same t
    - P6 x mod m for m in {3, 5, 7, 11}
    - P7a constant twist-side bit chi(x^3 + a x + b), recorded as a proof not an arm
    - P7b the P^1 coordinate map R maps to x(R), a re-coordinatisation of the Kummer map
    - P8 the r-way partition index of an r-adding walk, r in {16, 32, 64}
    - P9 the indicator of a window x in [0, B) for B in {n/2, n/4, n^{3/4}, n^{1/2}}
    excluded_by_construction: division polynomials at any index
  controls:
  - >-
    NAMED NULL N1, CLOSED-FORM RANDOM-RELABELLING NULL, CURVE-FREE AND MANDATORY.
    Z/n with a uniformly random bijective labelling preserving each member's
    fiber-size profile; the defect is then computable EXACTLY from the fiber sizes
    with no simulation. Closed-form values computed before the run - 0.000 for the
    identity, 2.000 bits for any fiber-size-2 member such as the Kummer quotient,
    1.000 bit for the quadratic character, log2(d) for the d-th power residue
    symbol, t bits for a t-bit window, log2(m) for x mod m, log2(r) for the walk
    partition index, and the binary entropy H_2(B/n) for the window indicator. The
    null is ALSO simulated at the same N, and any disagreement between simulated
    and closed-form values is reported BEFORE any signal is read. CONSEQUENCE
    PRE-STATED - a member matching this curve-free null establishes only that the
    projection behaves like a fiber-matched projection of a generic cyclic group,
    and a below-null gap reproduced by the Z/n object at matched fiber profile is
    a fiber-geometry artifact; neither may be quoted as an elliptic-curve or
    ECDLP statement.
  - >-
    NAMED CONTROL N2, KUMMER FORCED-VALUE POSITIVE, DEFECT OF KNOWN SIZE. The
    Kummer quotient must return exactly 1.000 +/- 0.01 bits against a closed-form
    null of 2.000 bits, a gap of exactly 1.000 bit derived from the biquadratic
    differential-addition relation - given x(X) and x(Y) the unordered pair
    {x(X + Y), x(X - Y)} is determined, carrying exactly one bit of ambiguity,
    while a random relabelling with fibers of size 2 sends the four preimage sums
    to four generically distinct fibers. PREDICTED MAGNITUDE AND DYNAMIC RANGE,
    STATED - a 1.000-bit gap is 50 estimator standard errors at 0.02 bits and 6.7
    times the 0.15-bit decision threshold, which is what demonstrates that the
    threshold is inside the instrument's range rather than outside it.
  - >-
    NAMED CONTROL N3, LOSSLESS TRAPS. The identity must return 0.000 +/- 0.01
    against a null of 0.000. The P^1 coordinate map P7b must return 1.000 +/- 0.01
    - EQUAL to the Kummer value, not zero, because on E modulo plus-minus one the
    map R to x(R) is a bijection onto its image and is therefore the Kummer map in
    other coordinates.
  - >-
    RECORDED AS A PROOF, NOT AN ARM - P7a, the constant twist-side bit. For every
    R in E(F_p) away from 2-torsion, x(R)^3 + a x(R) + b is a nonzero square, so
    this bit is CONSTANT on <P>. Its defect and its null are both identically
    zero by construction, it has no discriminating power at any parameter, and no
    outcome on it is an elliptic-curve statement. It is reported with this
    reasoning and is not used as a trap.
  - >-
    NAMED CONTROL N4, STRUCTURAL TELL ON THE WALK PARTITION INDEX. The closed-form
    null is exactly log2(r), so the measured defect must RISE toward 4.000, 5.000
    and 6.000 bits as r goes 16, 32, 64. A defect flat in r is the artifact
    signature; the 2-bit range across the ladder is this member's demonstrated
    dynamic range.
  - >-
    NAMED CONTROL N5, COMPOSITE-ORDER FIXTURE, DEFECT OF KNOWN SIZE. On a
    deliberately composite-order group, the reduction to the large-prime part is
    lossy AND exactly propagating. Forced value - 0.000 +/- 0.01 against a nonzero
    closed-form null of about 2 log2(cofactor) bits. This is the slice where
    rigidity's hypothesis is dropped, and an estimator that cannot reproduce it
    has not identified primality as load-bearing.
  - >-
    NAMED CONTROL N6, SYNTHETIC KNOWN-ENTROPY CALIBRATION. The estimator is run on
    synthetic distributions of KNOWN entropy matched to each panel member's fiber
    profile, at N/10, N and 10N, with measured bias and variance reported against
    the analytic values.
  - >-
    NAMED CONTROL N7, EXHAUSTIVE VERSUS SAMPLED. At the two smallest primes both
    the exhaustive and the sampled defect are computed for every member and their
    difference is reported and carried forward as the stated transfer assumption.
  - >-
    NAMED CONTROL N8, MANDATORY MATCHED ATTACK CONTROLS. Pollard rho and BSGS on
    one instance per prime, reported in group operations and in memory, so the
    walk-partition defect is priced against the walk it prices and no number is
    stated in isolation.
  - >-
    NAMED CONTROL N9, POWER LEDGER. For every cell the closed-form null is
    reported beside the estimator standard error, and any cell whose null is below
    0.30 bits is marked UNDERPOWERED with its computed power. Such a cell is never
    reported as matching the null.
  independent_variables: [prime, curve, panel_member, depth_k, partition_count_r, window_size_B, bit_window_width_t, modulus_m, residue_degree_d]
  metrics:
    primary:
    - propagation_defect_d_k_in_bits_per_member_per_curve_with_bootstrap_interval
    - gap_below_the_closed_form_null_in_bits
    - survival_depth_per_member_integer
    secondary:
    - closed_form_null_defect_per_member_in_bits
    - simulated_null_defect_and_its_disagreement_with_the_closed_form_in_bits
    - fiber_size_profile_and_compression_ratio_per_member
    - chain_rule_gap_d_8_versus_eight_times_d_1_in_bits
    - walk_partition_defect_against_r
    - composite_order_fixture_defect_in_bits
    - estimator_bias_and_variance_against_synthetic_known_entropy_in_bits
    - exhaustive_versus_sampled_difference_at_the_small_primes_in_bits
    - matched_pollard_rho_and_bsgs_group_operations_and_memory
    - per_cell_power_ledger
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: >-
      For each panel member, the difference D_1(pi) minus the closed-form
      random-relabelling null for that member's fiber-size profile, in BITS.
    formula: >-
      The difference is 0.000 +/- 0.05 bits for every member except the Kummer
      pair, for which D_1 = 1.000 against a null of 2.000 giving a difference of
      exactly -1.000 bits. A difference at or below -0.15 bits for any other
      member, reproducible at two primes and surviving the structural tell, is the
      positive signal, and the rule applies only where the closed-form null is at
      least 0.30 bits.
    source: >-
      H-ICEX-652b0d, prediction 2, with the closed-form nulls derived from the
      fiber-size profiles and the Kummer value from the biquadratic
      differential-addition relation.
  scale_relevance:
    tier: toy
    justification: >-
      Six primes from 2^16 to 2^28 at three curves per prime. The disclosed
      toy-scale bias runs toward a FALSE POSITIVE - at 16 to 24 bits a
      small-codomain projection's image is a much larger fraction of <P> than at
      256 bits - so a toy-scale null is the conservative outcome and a toy-scale
      positive needs the field-bit ladder to be believed at all. The
      cryptographically interesting window B = p^{1/2} is out of reach at
      N = 1e7 and is declared underpowered rather than shrunk.
    correspondence: null
  tail_checks:
  - >-
    The smallest measured gap-below-null across the whole panel is reported with
    its fiber profile, since a below-null reading could reflect the estimator's
    interaction with a heavy-tailed fiber profile rather than curve structure.
  - >-
    For every member the fitted slope of the gap against log p is reported with
    its interval, since a monotone trend refutes sign transfer for that member and
    would be invisible in a pooled number.
  replication:
    seeds: [1, 2, 3]
    independent_instances: 18
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 40
    maximum_memory_gb: 16
    maximum_runs: 60
  stopping_rules:
  - >-
    Stop a run at 3600 s and record it as resource_exhaustion; a partial sample
    is reported with its ACTUAL N and its widened interval, never padded to 1e7.
  - >-
    Stop the sweep at the largest prime whose three curves fit the CPU budget;
    report larger primes as unreached, never extrapolated.
  - >-
    Stop the whole experiment if any forced-value control fails, before any signal
    is read.
  invalidation_rules:
  - >-
    Failure of the Kummer control to return 1.000 +/- 0.01 bits invalidates the
    run.
  - >-
    A nonzero identity reading, or a P^1 coordinate reading other than 1.000
    +/- 0.01, invalidates the run.
  - >-
    A composite-order fixture reading other than 0.000 +/- 0.01 invalidates the
    run.
  - >-
    A closed-form versus simulated null disagreement above 0.02 bits invalidates
    every gap in the run.
  - >-
    A gap reported at the 0.15-bit threshold in a cell whose closed-form null is
    below 0.30 bits is invalid_measurement, because the threshold exceeds the
    statistic's range there.
  - >-
    A defect reported without its fiber-size profile is invalid_measurement.
  success_criterion: >-
    All forced-value controls return their computed magnitudes; the closed-form
    and simulated nulls agree within 0.02 bits; the estimator calibrates below
    0.01 bits of bias; the walk-partition defect rises toward log2(r) across the r
    ladder; and every panel member other than the Kummer pair matches its
    closed-form null within 0.05 bits at every depth and every prime in the cells
    whose null is at least 0.30 bits. That outcome is a MEASURED OBSTRUCTION and
    is the expected result, not a failure.
  falsification_criterion: >-
    A member below its closed-form null by at least 0.15 bits, in a cell whose
    null is at least 0.30 bits, reproducible at two primes and surviving the
    structural tell, falsifies the panel-wide null within the tested scope and is
    the positive signal. A monotone trend of the gap against log p with a
    confidence interval excluding zero refutes HEUR-003 for that member. A lossy
    member returning 0.000 contradicts the rigidity theorem and is an
    implementation error until independently replicated, never a result. A
    control failure voids the instrument rather than producing a result of either
    sign, and an underpowered cell is reported as underpowered rather than as a
    null.
  required_artifacts:
  - the frozen panel definition, dated before any measurement
  - curve parameters, order, primality certificate and cofactor per instance
  - exact fiber-size profile per member per curve, computed rather than sampled
  - closed-form null values with the arithmetic that produced them
  - simulated null values at the same N and their disagreement with the closed form
  - D_1 through D_8 per member per curve with bootstrap intervals and the actual N used
  - forced-value control readings beside their computed magnitudes
  - composite-order fixture output with its cofactor and its nonzero null
  - synthetic known-entropy calibration outputs at N/10, N and 10N
  - exhaustive-versus-sampled comparison at the two smallest primes
  - matched Pollard rho and BSGS readings in group operations and memory, one instance per prime
  - per-cell power ledger with every underpowered cell marked and its computed power
  - per-run manifest, command, environment, git commit, stdout, stderr, validity status
  assigned_to: executor
  approved_by: null
