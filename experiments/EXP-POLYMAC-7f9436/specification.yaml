experiment:
  id: EXP-POLYMAC-7f9436
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-51869a; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-51869a
  question_id: RQ-POLYMAC-7c89e4
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exhaustive root-set enumeration of optimal forgery probability in matched scaled-down GHASH
    and Poly1305 analogues, with a random-function null arm and a composite-modulus positive control,
    reported as the ratio to the instantiated bound
  objective: 'The one uncertainty a run reduces is whether the gap between the forgery bound and the
    best achievable forgery is the same in a binary extension field and a prime field when the construction
    is otherwise matched. Stated as parts: (i) obtain P_opt exactly, by enumerating the accepted-key
    set of every achievable difference polynomial over the full key space, for both arms at n in {8,
    12, 16, 20} and L in {1, 2, 4, 8, 16}, so that the primary quantity is a counted cardinality and
    not an estimate; (ii) instantiate the bound at exactly those parameters from a single pinned formula
    and form the ratio R, so that the deliverable is a gap and not a restatement; (iii) run the identical
    pipeline against a uniformly random keyed function and against a composite-modulus ring in the
    same invocation, so that the flatness of the null arm in L and the anomalous root counts of the
    ring arm certify that the enumerator measures what it claims before any field comparison is read.
    The run reduces uncertainty about the instrument as much as about the constructions, and both
    are recorded. It does not reduce uncertainty about deployed parameters at all.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: at the declared analogue parameters
      (n at most 20, pinned irreducible polynomial, pinned prime, pinned padding rule, idealised uniform
      mask), the measured optimal forgery probability of the hash layer stands in ratio R to the instantiated
      bound, with R tabulated per (L, q, n) and per field, alongside a null arm. WHAT DOES NOT FOLLOW:
      nothing about GHASH, Poly1305, AES-GCM or ChaCha20-Poly1305 at their real field sizes; nothing
      about any deployed data limit, rekeying interval, or library default; no claim that either bound
      is loose or tight where it is applied; no attack, break, or speedup of any kind; and no inference
      from the toy n-values to n = 128 or n = 130 other than a labelled projection carrying its own
      error statement.'
  inputs:
    procedure: 'STAGE 0 (cost: hours, human): freeze the two analogues, the padding rules, the scaling
      rule and the enumerable strategy family in the specification, and record the pinned bound formula
      as a derivation gap for the Coordinator. STAGE 1 (cost: minutes): implement both digests twice
      - once optimised, once as a naive reference - and cross-check on 10^5 random inputs per arm;
      abort on any mismatch. STAGE 2 (cost: minutes at n at most 16, under an hour at n = 20): for
      each arm, each n, each L, enumerate the achievable difference-coefficient family, compute each
      member''s accepted-key bitmap by evaluating at all 2^n keys, and record the maximum popcount.
      STAGE 3 (cost: minutes): compose q queries by bitmap union over the declared family and record
      the maximum union popcount for q in {1, 2, 4}. STAGE 4 (cost: seconds): instantiate B and compute
      R per point. STAGE 5 (cost: same as stages 2 to 4): repeat every stage for the random-function
      null arm and the composite-modulus arm, in the same process, writing all arms to one manifest.
      STAGE 6 (cost: minutes): emit the run manifest with the resolved inference block and the per-arm
      tables.'
    instrument: 'Python 3 standard library only for the mathematics: carry-less multiplication over
      GF(2^n) implemented with integer shifts and XOR against a pinned reduction polynomial, prime-field
      arithmetic with native int and a pinned prime, accepted-key sets as Python int bitmaps for O(1)
      union by bitwise OR. Run records and the inference block via harness/runner.py following the
      existing manifest convention used by harness/run.py. numpy permitted for tabulation only. No
      Sage, no external CAS, no network access.'
    parameters: 'Binary arm: GF(2^n) for n in {8, 12, 16, 20}, pinned irreducible trinomial or pentanomial
      per n, recorded in the specification. Prime arm: the largest prime below 2^n for the same n
      values, block width n-2 bits with a forced high bit. Message lengths L in {1, 2, 4, 8, 16} blocks.
      Query counts q in {1, 2, 4}. Achievable-difference family: all coefficient vectors of weight
      at most 2 plus the declared fully-split constructions, capped at 2^18 members per (arm, n, L).
      Key enumeration is exhaustive: all 2^n keys, and for the prime arm all p keys. Null arm: 32
      independent random keyed functions per (n, L). Composite arm: m equal to the product of the
      two largest primes below 2^(n/2). Seeds: 3 fixed seeds, results required identical.'
  controls:
  - 'Null arm: uniformly random keyed function of the same output width, identical enumeration path,
    same invocation.'
  - Composite-modulus arm over Z_m of the same bit width, whose zero divisors must produce root-set
    cardinalities exceeding the polynomial degree - a positive control that the root counter can detect
    anomalous root counts at all.
  - 'Degree-0 known-answer gate: at L = 0 the difference polynomial is a constant and the accepted-key
    set is empty or the whole space; the measured value must be exactly 0 or exactly 1 with no intermediate
    result.'
  - 'Seed replication: the mask draws and any tie-breaking in the maximisation are seeded, and the
    whole run is repeated at three seeds with identical exhaustive results required, since exhaustive
    quantities must not depend on a seed.'
  - Cross-implementation check of both digest functions against independently written naive reference
    implementations inside the same file, on random inputs, before any measurement.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null arm replaces the polynomial-evaluation digest with a uniformly
    random function of the same interface and output width - implemented in the same process as a
    keyed table drawn once per key from the system RNG - and runs the IDENTICAL enumeration, maximisation
    and ratio computation. For the signal arm to mean anything the null must show: the accepted-key
    set for any fixed forgery has expected cardinality independent of L, so the null''s R must be
    flat in L; and the union over q queries must grow linearly in q with no degree ceiling. If the
    null instead shows an L-dependent R, the enumeration or the bound instantiation is wrong and the
    signal arm is uninterpretable. A second null, a ring arm over Z_m with m composite of the same
    bit width, is included because zero divisors change root counts: it must show root-set cardinalities
    exceeding the degree, and if it does not, the root-counting code is not measuring what it claims.'
  independent_variables:
  - field type (binary extension, prime, random-function null, composite ring)
  - field bit width n
  - message length L in blocks
  - query count q
  metrics:
    primary:
    - maximum accepted-key-set cardinality per (arm, n, L, q)
    - P_opt as an exact rational
    - instantiated bound B at the same parameters
    - R = P_opt / B
    - R_binary - R_prime at matched log-cardinality
    secondary:
    - null-arm R and its variation across L
    - composite-arm maximum root count minus degree
    - enumeration size actually used versus the cap
    - wall-clock per stage per arm
  heuristic_under_test: null
  preregistered_prediction:
    quantity: R(L, q, n) per arm, and the difference R_binary - R_prime at matched log-cardinality,
      together with the null arm's variation of R across L.
    formula: 'R = P_opt / B, where P_opt is the exhaustively maximised probability that at least one
      of q verification queries is accepted over the uniform key and uniform mask, and B is the instantiated
      forgery bound at the same (L, q, field size) from the single formula pinned in the specification.
      Predicted: R at most 1 in both field arms at every point, exactly; null-arm R constant in L
      to within 5 percent relative. No value is pre-committed for R_binary - R_prime, and the reason
      is recorded: this record holds no numeric prior by design.'
    source: Pre-registered in the parent proposal IDEA-20260816-51869a before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are n in {8, 12, 16, 20}, which is where exhaustive enumeration
      over the entire key space is possible and where forgery probability is therefore counted rather
      than estimated. The transfer assumption to the deployed field sizes is NOT made: no extrapolation
      to n = 128 or n = 130 is offered as evidence anywhere in the contract, and the n-ladder is included
      precisely so that the presence or absence of an n-trend is visible as data. If R drifts monotonically
      with n, that drift is reported as an open quantity, not converted into a projection.'
    correspondence: null
  tail_checks:
  - L = 0 degenerate case must give exactly 0 or exactly 1 accepted-key fraction with no intermediate
    value
  - L equal to the field size, where the difference polynomial can in principle vanish identically,
    must be handled explicitly and not silently counted as a full-space root set
  - q equal to the number of distinct achievable differences, where the union saturates, must show
    the union popcount stop growing
  - smallest n = 8 must be checked against a fully independent brute-force script that enumerates
    keys and messages jointly with no algebraic shortcut
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - halt the whole run and report an instrument failure if the naive-versus-optimised digest cross-check
    mismatches on any input
  - halt if the achievable-difference enumeration reaches the 2^18 cap before the maximum stabilises,
    and report a lower bound on P_opt rather than a value
  - cap total wall clock at 3600 seconds per arm; on exceeding it, drop n = 20 and report the completed
    ladder
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All four arms complete in one invocation, the null arm's R is flat in L to within
    5 percent relative, the composite arm shows root counts exceeding the degree, and R is tabulated
    for both field arms at every declared (L, q, n) with R at most 1 everywhere.
  falsification_criterion:
  - null-arm R varies with L by more than 5 percent relative
  - R exceeds 1 in a field arm
  - accepted-key-set cardinality exceeds the difference polynomial degree in a field arm
  - the exhaustive results differ across the three seeds
  - the pinned bound formula cannot be instantiated at any tested n, making R undefined at this scale
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-51869a
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The bound formula B is deliberately absent from this record and must be supplied by the Coordinator
    from a KN-LIT entry read from primary text, with its exact statement, its hypotheses, and whether
    it is stated per-query or per-forgery-attempt.
  - The enumerable strategy family for q greater than 1 needs a Coordinator ruling on whether adaptive
    forgers are in scope at all; the contract as written measures the non-adaptive union.
  - Matched-scale rule between a prime of bit width n and an extension field of degree n must be fixed
    - matched n or matched log-cardinality - before any comparison is read.
  - Whether the idealised uniform mask is an acceptable substitution for the mode's masking step,
    or whether a keyed-PRF surrogate must be used, is a Coordinator decision affecting what the run
    is about.
