  revise_fixes_20260912:
    task_id: TASK-20260912-2100f6
    source_review: coordination/design/BATCH-bb548b/reviews/TASK-20260908-30ce59/implementation-review.yaml
    findings_addressed: [C6, C8, C9, C11, C12]
    summary:
      C6: >-
        arithmetic.py point_add's generic-branch Y3 line corrected: the first
        product's second multiplicand is now B.sub(X3, counters) (i.e. B-X3),
        matching specification.yaml's literal common_z_formula
        "Y3=M(j,B-X3)-M(V1,C-B)" token for token. The second product
        (V1*(C-B)) is unchanged. M/S counts unaffected (still 2 M for this
        line, 12 M + 4 S for a generic full ADD overall) -- pure formula fix.
      C8: >-
        Branch (b) chosen: scalar_multiply's docstring now states explicitly
        that normalization is a deliberate caller responsibility, not part of
        this routine's own charged-count contract -- it returns the raw,
        unnormalized Jacobian point, and a caller must call normalize()
        explicitly to obtain canonical affine coordinates and to charge the
        3M+1S+1I normalization cost. scalar_multiply_null and
        scalar_multiply_planted inherit the same documented contract. No
        return type, call site, or behavior changed; this is a documentation-
        only resolution, chosen over branch (a) to avoid widening this fix
        task's scope with a return-type change and downstream call-site
        review for code that has zero real callers today (this is still a
        zero-run implementation).
      C9: >-
        Branch (a) chosen (completed the routine, not the gap-note branch):
        added point_add_planted, point_double_planted, and
        scalar_multiply_planted to arithmetic.py, structurally mirroring
        point_add/point_double/scalar_multiply respectively, with every
        top-level M call site routed through planted_mul instead of
        FieldElement.mul (S and I call sites unchanged). This was judged NOT
        materially more involved than a direct mirror: point_add/
        point_double take a bound `counters` object already, and the planted
        variants simply also take a bound `sink_state` buffer alongside it,
        with no other structural change needed. All three new functions are
        exported in __all__.
      C11: >-
        rho.py EndpointTable.insert_if_absent's probe loop now compares the
        occupant's stored (x, y) endpoint against the candidate slot's (x, y)
        at each occupied probed index, returning (False, occupant)
        immediately on an actual match, and continuing to probe only on a
        genuine mismatch. The unreachable post-loop
        "if idx in self.slots: return False, ..." line is removed (it is now
        subsumed by the in-loop check). The capacity guard and resize-
        refusal RuntimeErrors are unchanged in wording and trigger condition.
      C12: >-
        driver.py check_cgroup_admission now takes a required `job_type`
        parameter ("rho" or "arithmetic") selecting between the two required
        cpu.max strings via REQUIRED_CPU_MAX_BY_JOB_TYPE ("300000 100000" /
        "100000 100000"), with a new refusal branch comparing the cpu.max
        readback against the selected required string and a refusal_reason
        distinct from all pre-existing ones. The pids.max check now requires
        `pids_max == REQUIRED_PIDS_MAX` exactly (was `pids_max is None or
        pids_max > REQUIRED_PIDS_MAX`, which wrongly accepted 1 or 2).
        memory.max, memory.swap.max, and path-existence checks are
        byte-for-byte unchanged.
    no_new_execution: >-
      Only python3 -m py_compile was run against the three edited files
      (arithmetic.py, rho.py, driver.py) under this fix task; no function
      from any of the six .py files was imported in a way that calls it, and
      no guarded entry point (construct_pocklington_certificate,
      construct_reduced_curve_fixture, run_worker, run_coordinator, main) was
      invoked. See preparation-report.yaml's revise_fix_verification section
      for the non-executing self-check recorded for each of the five
      findings.

