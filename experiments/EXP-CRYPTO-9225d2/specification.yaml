experiment:
  id: EXP-CRYPTO-9225d2
  hypothesis_id: H-CRYPTO-830d47
  question_id: RQ-CRYPTO-001
  version: 1
  title: Fixed GOE counting ruler with cross-host controls and a descriptive rho calibration
  status: approved
  frozen: true
  approved_by: coordinator
  approval_decision_id: DEC-20260907-1ccb1a
  scientific_execution_authorized: false
  evidence_eligible_before_review: false
  supersedes_experiment: EXP-CRYPTO-3703fb
  derived_from_idea: IDEA-20260801-001
  objective: >-
    Test a fully specified conventional field-operation ruler for reproducible
    logical accounting, detect a planted multiplication overhead, and compare
    three fixed reduced-order rho panels with their declared random-map model.
    Preserve timing and memory as separate measurements. Produce nine conditional
    256-bit resource rows without executing a 256-bit discrete logarithm search.
  inputs:
    source_paths:
      - ledger/proposals/IDEA-20260801-001.yaml
      - ledger/hypotheses/H-CRYPTO-b2c203.yaml
      - experiments/EXP-CRYPTO-3703fb/specification.yaml
      - ledger/hypotheses/H-CRYPTO-830d47.yaml
      - ledger/decisions/DEC-20260907-1ccb1a.yaml
      - coordination/design/BATCH-bb548b/source-packet.json
    source_commit: 669811b648
    source_binding: Exact original hashes are supplied by the parent source packet and must be verified before canonical archival and again at admission.
    access_provenance: Parent-transmitted source reads; this Coordinator did not run source commands, fixtures, or tests.
  execution_gate:
    - Exact canonical contract, decision, implementation and dependencies are committed and archived with verified hashes.
    - A genuine separately claimed scientific execution handoff and locked 40-job plan are required; the implementation handoff permits zero runs.
    - An independently authored checker and count predictor receive implementation review before any measurements.
    - Fixture certificates, two distinct physical hosts, three required environments, and the exact executable are bound in admission.json before timing.
    - Missing infrastructure is UNRUN or INCONCLUSIVE, with a retained receipt; standing authorization does not manufacture a host, review, fixture, or measurement.
    - Any claim-changing review has a preregistered independent review-adversarial plan, with blinded count re-derivation and a known-false control, before that review runs.
  scale_relevance:
    tier: crypto
    correspondence: null
    justification: secp256k1 arithmetic is real 256-bit arithmetic; rho uses only the three specified special supersingular subgroups. The 256-bit search rows are modeled.
  independent_variables:
    seeds: [20260825, 20260826, 20260827, 20260828, 20260829, 20260830, 20260831, 20260901, 20260902, 20260903]
    scalar_routines: [reference, planted, null]
    environments: [A_boot_1, B_boot_1, A_boot_2]
    rho_order_bits: [40, 48, 56]
    modeled_workers: [1, 2, 256]
    modeled_dp_bits: [104, 112, 120]
  controlled_variables:
    scalar_count_per_seed_routine_environment: 256
    operand_pairs_per_seed_primitive_environment: 4096
    field_primitives: [M, S, I]
    warmup_batches_per_cell: 1
    timed_repeats_per_cell: 5
    repeat_policy: Same exact input bytes; repeat number is not a new independent sample. All invocation counts are retained, with a designated first timed repeat for headline exact-count comparisons.
    arithmetic_processes_per_job: 1
    rho_processes_per_job: 3
    rho_lanes: 2
    rho_environment: A_boot_1
    compiler_optimization_boundary: Count explicit field API calls, not instructions. Use the same immutable executable and flags in all environments; retain timing perturbation from instrumentation.
  experimental_unit:
    logical_jobs: 40
    arithmetic_jobs: 10
    arithmetic_physical_routine_cells: 90
    primitive_physical_cells: 90
    rho_jobs: 30
    timed_scalar_invocations: 115200
    warmup_scalar_invocations: 23040
    timed_primitive_invocations: 1843200
    warmup_primitive_invocations: 368640
    rho_recoveries_planned: 30
    modeled_rows: 9
    independent_replication: Ten declared seed inputs per rung; no independence claim for repeated timings, routines sharing inputs, boots, or deterministically generated curves.
    accounting_note: One arithmetic logical job includes its nine routine cells and nine primitive cells across all three environments. Physical launch and checkpoint receipts do not create extra scientific jobs.
  ordering:
    jobs: Arithmetic bundles by the listed seed order, then rho by increasing rung and listed seed order. Model rows follow all required measured panels.
    arithmetic_cells: Environment order A_boot_1, B_boot_1, A_boot_2; primitives M,S,I followed by routines reference,planted,null. Warmup precedes timed repeats 0 through 4.
    within_cell: Ascending input index; no selection of fastest repeat and no replacement seeds.
  replication:
    seeds: [20260825, 20260826, 20260827, 20260828, 20260829, 20260830, 20260831, 20260901, 20260902, 20260903]
    independent_instances: 10
    interpretation: Ten seed-indexed inputs per rung; not ten independent curves. Timed repeats and boots are paired technical measurements, with no statistical independence asserted.
  preregistered_prediction:
    instrument: Exact counts agree with the independent predictor on every input/environment/repeat; all output checks pass.
    planted: Exact count identity and its rational weighted factor hold; the inherited relative-error window is at most 0.10.
    host_and_boot: Exact input-bound count equality implies the retained 0.02 windows, with no prediction of equal wall times.
    rho: Each complete ten-seed rung mean divided by sqrt(pi*N/2)+2/theta lies in [0.8,1.2]; this is a finite descriptive target, not a claimed high-probability theorem.
  heuristic_under_test:
    - id: H1
      statement: The specified three-way walk behaves sufficiently like a random map with useful endpoint collisions for the declared finite mean-step window.
      supporting_results: []
      validation_plan: Complete the fixed 30 recoveries with all restarts/unused work charged and compare each rung separately; independent review distinguishes finite departure from a theorem contradiction.
      falsification_scope: A valid complete mean outside the window fails this finite calibration target only.
    - id: H2
      statement: Ideal hash DP density and ideal parallel propagation justify C+m/theta as a conditional model, while actual synchronized costs may be larger.
      supporting_results: []
      validation_plan: Record empirical DP density, long trails, useful collision fraction, lane overshoot and synchronization costs without fitting the frozen parameters.
      falsification_scope: Observed departures qualify the model rows; ten seeds do not establish or refute a universal distribution.
  tail_checks:
    - Retain all ten samples per rung, sorted transition counts, min/median/max and mean; no tail trimming, resampling or post-hoc confidence intervals.
    - Record every trail ending at 20/theta, every useless collision and every checkpoint; compare long-trail behavior descriptively to the sourced approximate exp(-20) random-map expectation.
    - Missing or censored recoveries leave the rung window inconclusive; do not compute a passing mean from survivors.
  deterministic_bytes:
    hash: SHA-256
    integer_encoding: Unsigned fixed-width big-endian; u32 for lengths and indices, u64 for declared seeds and rejection counters, 32 bytes for field/scalar values.
    encoding: Each domain string is UTF-8 prefixed by its u32 byte length. Other variable byte strings are similarly length-prefixed. Tuples concatenate their encoded fields in the stated order.
    domain_parameters: In the stated domain templates replace k, lane and coefficient with decimal rung bits, decimal lane 0 or 1, and the ASCII letter a or b, respectively; decimal fields have no leading zeros. The slash separators are literal. A domain without placeholders is literal UTF-8.
    draw: >-
      For domain, seed, index, and counter j starting at zero, interpret
      SHA256(encode(domain)||u64(seed)||u32(index)||u64(j)) as a 256-bit integer h.
      To draw in [0,L-1], reject h >= floor(2^256/L)*L and return h mod L.
      Every rejection is recorded. Draw nonzero values as 1+draw(L-1).
    scalar_domains: reference uses GOE9225/reference/scalar; planted reuses reference bytes; null uses GOE9225/null/scalar. Scalars lie in [1,N-1].
    operand_domains: GOE9225/primitive/left and GOE9225/primitive/right, nonzero modulo p; each primitive uses the same declared pair list, with S and I using its left operand.
    point_encoding: Identity is 0x00 followed by 64 zero bytes; finite affine point is 0x01 followed by x and y as canonical 32-byte residues. Reject noncanonical encodings.
    overflow: Mathematical counters use arbitrary-precision integers. Before exceeding a fixed-width serialization/index field, checkpoint and declare encoding-capacity censoring; never wrap a counter or silently change the domain. Any extension requires an additive plan/encoding amendment and preserves prior attempts.
  arithmetic:
    curve:
      name: secp256k1
      p_hex: FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEFFFFFC2F
      a: 0
      b: 7
      generator_x_hex: 79BE667EF9DCBBAC55A06295CE870B07029BFCDB2DCE28D959F2815B16F81798
      generator_y_hex: 483ADA7726A3C4655DA4FBFC0E1108A8FD17B448A68554199C47D08FFB10D4B8
      order_hex: FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141
      cofactor: 1
    field_api:
      M: One multiplication of two canonical residues and reduction modulo p.
      S: One square and reduction modulo p; it is a separate API operation, never a nested counted M.
      I: >-
        Invert a nonzero canonical residue using extended Euclid on (p,a),
        with quotient floor(r0/r1), simultaneous remainder/coefficient updates,
        and canonical final coefficient modulo p. Charge one I at the API
        boundary; internal integer multiplications/divisions are separately
        logged integer work, never additional field M/S counts. Zero is an error.
      linear_operations: Addition, subtraction, negation, small-integer scaling and canonical reduction are separately counted. Constants 2,3,8 use explicit additions/doublings, never silently counted as field M.
      validation: Every operation outputs its canonical residue. No operand-is-one optimization removes a declared M/S call.
    coordinate_convention: Affine x=X/Z^2,y=Y/Z^3; identity uses a distinct tag, not an unchecked arbitrary triple.
    scalar_algorithm: >-
      For every scalar use exactly 256 bits, most significant first. Start R=O;
      for every bit set R=DOUBLE(R), then if bit=1 set R=ADD(R,(Gx,Gy,1)).
      Normalize the final R once. This is variable-time binary multiplication,
      not a constant-time or optimized co-Z ladder.
    addition:
      identity: Return the other point after validating its tag; count the branch and copies but no field calls.
      rescale_finite: >-
        Compute z1sq=S(Z1),z2sq=S(Z2),z1cube=M(z1sq,Z1),z2cube=M(z2sq,Z2),
        U1=M(X1,z2sq),V1=M(Y1,z2cube),U2=M(X2,z1sq),V2=M(Y2,z1cube),Z=M(Z1,Z2).
        These seven M and two S are charged even for a coordinate equal to one.
      exceptional_after_rescaling: >-
        If U1=U2 and V1=V2, DOUBLE the original first point, retaining the rescale
        cost. If U1=U2 and V1=-V2, return O, retaining the rescale cost; the
        equality branch takes precedence when both Y values are zero and its
        doubling returns O. Any remaining same-X case is invalid input.
      common_z_formula: >-
        h=U2-U1; j=V2-V1; A=S(h); B=M(U1,A); C=M(U2,A); D=S(j);
        X3=D-B-C; Y3=M(j,B-X3)-M(V1,C-B); Z3=M(Z,h).
        Generic common-Z work is five M and two S; generic full ADD is twelve M
        and four S before output normalization.
    doubling:
      exceptional: O returns O; finite Y=0 returns O before polynomial calls. Count branch/copy work.
      polynomial: >-
        XX=S(X); YY=S(Y); YYYY=S(YY); ZZ=S(Z);
        V=2*(S(X+YY)-XX-YYYY); W=3*XX+a*ZZ^2; T=S(W)-2*V;
        X3=T; Y3=M(W,V-T)-8*YYYY; Z3=S(Y+Z)-YY-ZZ.
      specializations: >-
        This is the EFD dbl-2007-bl polynomial. For secp256k1 a=0 omit only
        ZZ^2, retaining ZZ for Z3, giving one M and seven S. For the reduced
        rho curves a=1 compute Z4=S(ZZ),W=3*XX+Z4, giving one M and eight S.
        No multiplication by a is introduced in these two specializations.
    normalization: For finite output compute zi=I(Z),z2=S(zi),z3=M(z2,zi),x=M(X,z2),y=M(Y,z3), including Z=1. Charge three M, one S, one I; O has no inversion.
    planted:
      definition: >-
        Replace each top-level M(a,b) by two separate M API evaluations, compare
        the two products, and feed both serialized results into an ordered
        SHA-256 integrity sink before returning the first. Do not duplicate
        operations inside S or I. Retain the sink and comparison counts.
      exact_count_identity: M_planted=2*M_reference, S_planted=S_reference, I_planted=I_reference for the same input and branch trace.
      expected_factor: (2*M_reference+S_reference+100*I_reference)/(M_reference+S_reference+100*I_reference)
      optimizer_boundary: Logical API duplication is the claim. Machine-code review and consumed outputs document any optimizer reuse; no claim of doubled machine multiplication latency.
    checker:
      arithmetic: Separately authored affine formulas using slope inversion, independent field arithmetic, and independent scalar-loop implementation. No producer point routines or count traces may be imported.
      exceptional_controls: O+O, O+G, G+O, G+(-G), G+G, DOUBLE(O), and the order-two point (0,0) on each reduced a=1 curve; compare each to independent affine arithmetic. They are fixed checks inside fixture admission, not extra rho samples.
      count_predictor: Independently implement the declared branch/formula cost recurrence from public inputs; do not consume measured counters or producer operation traces until the predictor report is frozen.
      blinding: >-
        Before the blind reviewer starts, archive a packet containing only
        the unplanted API/formula definitions, actual scalar inputs, opaque
        per-input M/S/I outputs for all routines, and the request to derive
        baseline counts and estimate overhead by opaque label. Exclude the
        full hypothesis/specification, planted source, multiplier, label map
        and earlier reports. Freeze the reviewer report before revealing the
        mapping and exact expected factor; a different unblinded checker then
        evaluates that factor. Preserve a read-access attestation. A reviewer
        already exposed to the multiplier is ineligible for the blind role.
  goe_ruler:
    units: Conventional field-multiplication units
    M_weight: 1
    S_weight: 1
    I_weight: 100
    multiplication_units_per_GOE: 16
    formula: raw_GOE=(M+S+100*I)/16
    exact_representation: Integer numerator and denominator 16; compare counts and ratios as exact rationals before rendering decimals.
    excluded_from_scalar_ruler_but_charged: Field additions/reductions/constants, integer/scalar work, hashes, comparisons, copies, allocation, serialization, setup, checking, cache/memory traffic, wall time, CPU time, RSS, certificate and artifact bytes.
    primitive_reporting: Five times and their min/median/max per primitive cell, counts and all input hashes. Empirical S/M and I/M timing ratios are diagnostics; they never refit the frozen 1/1/100 ruler after observation.
  hosts:
    required: Two genuinely distinct physical hosts A and B with ISA-compatible identical executable/image; A_boot_2 is an isolated guest reboot on A with the same physical host ID and a different guest boot ID.
    prohibition: Never reboot the user's physical host; two containers on the same physical host do not satisfy A and B.
    timing: Monotonic nanosecond wall clock and process CPU nanoseconds around each full batch, recording resolution and implementation. Report all five repeats and warmup separately; no subtraction of checker/setup costs from total work.
    resource_sampling: Payload process peak RSS plus a declared OS sampling method and interval, allocation/table bytes where available, and host-wide context separately. Docker client RSS is not payload RSS.
    admission_fields: [source_commit, source_dirty_state, executable_sha256, image_sha256, interpreter_or_compiler_version, backend_versions, build_flags, ISA, physical_host_IDs, OS_versions, guest_boot_IDs, clock_methods, RSS_method, dependency_hashes, fixture_certificate_hashes, implementation_review_refs, independent_checker_review_refs]
    missing_environment: Record every affected physical cell UNRUN and the concrete infrastructure defect; do not substitute an emulated identity or average available hosts into completion.
  rho:
    group_construction:
      procedure: >-
        For k=40,48,56 enumerate odd integers N from the least odd N>=2^(k-1),
        ascending by two, with N<2^k. Select the first N for which both N and
        p=4*N-1 have deterministically checked primality certificates. Use
        E:y^2=x^3+x over F_p. Search x from zero upward; require a nonzero
        quadratic-residue RHS, choose the least canonical square root y,
        form P=(x,y), G=[4]P, and skip only G=O. Require G!=O and [N]G=O.
      prime_certificates: Complete recursively checked factorization-based Pocklington certificates, with trial-division base cases below 65536; retain all factors, witnesses and full-factor product checks. Search/certification failure is an admission impediment, never a different fixture choice.
      square_root: Since p=3 mod 4, compute r=RHS^((p+1)/4), verify r^2=RHS, and choose min(r,p-r). This generator work is charged and separately checked.
      curve_order_obligation: >-
        A prospective certificate proves #E=p+1=4N using the character-sum
        point-count identity and cancellation of x and -x, including x=0,
        from p=3 mod 4 and chi(-1)=-1. This design does not claim that proof
        has been executed or checked. Prime N, G!=O and [N]G=O independently
        certify the subgroup order once the curve and group laws are checked.
      unavailable: No admissible N before 2^k, missing primality/order certificate, or checker disagreement makes the rung UNRUN/INCONCLUSIVE. No favorable replacement curve.
      scope: This is a special supersingular family. No negation, endomorphism or automorphism quotient is applied; generic-curve transfer is unproved.
      admission_lock: Realized curve/generator/certificate bytes are hash-pinned before measurements and identical for all seeds of that rung.
    secret_and_start_inputs:
      secret: Draw h in [1,N-1] using domain GOE9225/rho/secret/k and the declared seed; construct Q=[h]G in a separate fixture process. The solver receives only curve,G,Q and opaque walk material, never h or the generator's secret file.
      limitation: These are reproducible planted benchmarks, not adversarially hidden secrets from a party possessing generation seeds. Checker isolation and solver source review must show no secret-derived shortcut.
      starts: For each lane and trail index draw a,b in [0,N-1] by domain GOE9225/rho/start/k/lane/coefficient, seed, trail index and the fixed rejection rule. Construct X=[a]G+[b]Q; allow O. Record start cost separately from transition count.
      walk_key: SHA256(encode(GOE9225/rho/walk/k)||u64(seed)); shared by both lanes, fixed for the job. No lane-specific transition or DP function.
    transition:
      partition: >-
        Hash encode(GOE9225/rho/partition)||walk_key||point_encoding||u64(j)
        with j from zero; accept the first integer h<floor(2^256/3)*3 and use
        h mod 3. Charge rejection hashes. This eliminates modular bias under
        the declared ideal-hash model, not a proof that SHA-256 is random.
      branches: 0 maps (X,a,b) to (X+Q,a,b+1); 1 maps to (2X,2a,2b); 2 maps to (X+G,a+1,b), coefficients reduced mod N.
      point_step: Embed affine inputs at Z=1, apply the fixed ADD/DOUBLE formulas with the appropriate a, and normalize after every transition. Charge all exceptions exactly; coefficient work and hashing stay separate.
      dp: First d bits of SHA256(encode(GOE9225/rho/DP)||walk_key||point_encoding) are zero, with d=12,16,20 for k=40,48,56. Check only after transitions, not on newly drawn starts.
      theta: 2^(-d), a random-hash density assumption; also report realized DP counts and empirical density without replacing the frozen model.
    schedule: >-
      Two actual worker processes execute one transition each per round under
      a coordinator barrier; then process endpoints in lane order 0 then 1.
      Assign lane IDs before spawning, tag messages with round/lane IDs, and
      refuse a missing, repeated or out-of-order round. If lane 0 solves, the already executed
      lane 1 transition remains counted. A completed endpoint ends that trail
      and a new start is drawn before its next transition. Stop after the
      first independently verified recovery. No trail replay is needed for
      coefficient recovery.
    parallel_accounting: Three processes including the coordinator, one scientific job at a time. Charge IPC framing, synchronization, normalization, aggregate CPU, communication bytes and wall time. Lockstep wall time is measured parallel execution; ideal round formulas do not subtract synchronization overhead. Review must verify scheduling determinism before launch.
    endpoint_collision: >-
      For stored (a,b) and new (c,d) at the same affine endpoint, if d-b != 0
      return (a-c)/(d-b) mod N and independently verify [h]G=Q. If d=b, retain
      the useless collision, keep the earliest stored endpoint and restart
      the arriving lane. Distinguish full point equality from table-hash collision.
    independent_check: >-
      Retain one row per trail with its start coefficients, ordered transition
      digest, step count, endpoint/censor reason and all DP/round events. The
      independent affine checker replays every completed trail from its public
      start and frozen walk law, checking the digest, endpoints, coefficient
      recurrence, first qualifying DP and long-trail stopping point. It also
      reconstructs coordinator event order and the recovery. Replay is a
      verification expense within the same logical job, not solver transitions
      or additional independent samples; charge its wall/CPU/hash/memory work
      separately and in total job work. No solver trail replay is required
      merely to recover h from a stored endpoint collision.
    long_trails: After exactly 20*2^d transitions without a DP endpoint, record and end the trail, then restart the same lane at its next trail index. A DP on that final step takes precedence. All transition work remains charged.
    table:
      key: Full canonical affine endpoint; deterministic open addressing with linear probing and SHA-256 table hash, retaining earliest endpoint on equality.
      slot_bytes: 256
      layout: x[32], y[32], a[32], b[32], trail_ID[16], transition_count[8], lane[4], status[4], endpoint_hash[32], zero_padding[64]; integers big-endian. Identity uses status; unused coordinates are zero.
      capacity: Start at 1024 slots, double before load would exceed one half, maximum 8388608 slots (2 GiB); retained old/new arrays during resize count toward the 8 GiB process protection.
      cap_behavior: Checkpoint before forbidden growth, retain all endpoints and a censored receipt. No unrecorded eviction or reseeding. Further disposition requires an additive execution plan, not an automatic negative result.
    model:
      convention: No negation quotient. C=sqrt(pi*N/2), m=2, theta=2^(-d).
      total_transition_prediction: C+m/theta
      parallel_round_prediction: C/m+1/theta
      assumptions: Random mapping, useful collision fraction near one, ideal DP distribution and perfect two-lane scheduling; starts, useless collisions, long trails and lane-order overshoot are measured separately and remain in actual total transitions.
      reporting: Retain all ten transition observations, mean, min, median, max, individual ratio, restart/useless counts and timing/resources. No confidence interval, asymptotic inference or universal constant estimate from ten fixed seeds.
  model_256:
    group_order: secp256k1 order N stated above
    scenarios: Cartesian product m=[1,2,256],d=[104,112,120], ordered by m then d.
    grid_rationale: Prospectively span table-heavy, smaller-table and propagation-heavy regimes under an explicit memory cap. The initial illustrative d=[16,32,64] grid would focus only on enormous tables; no rows were evaluated to choose this replacement. Actual measured rho DP bits remain 12,16,20.
    arithmetic: >-
      Use the exact affine-normalized rho step, not scalar-multiplication GOE.
      Generic addition is 15M+5S+I and a=0 doubling is 4M+8S+I.
      Under equal branch probabilities the generic mean is (34M+18S+3I)/3,
      hence 22/3 GOE per transition. Exceptional branches, start generation,
      coefficient work and all hash/normalization costs remain explicit rows
      or unresolved symbolic terms; no unmeasured exception rate is set to zero.
    formulas: >-
      C=sqrt(pi*N/2); L=C+m*2^d total transitions; R=C/m+2^d parallel rounds;
      E=theta*L expected endpoints including propagation tails. Set the modeled
      slot count to the least power of two >= max(1024,2*ceil(E)); each slot
      has the exact 256-byte layout. Retain E as a modeled occupancy rather
      than a measured peak. Peak storage includes table, two arrays during
      resize where applicable, m lane states, stacks, buffers and archives.
    cost_rows: >-
      Report transition GOE L*22/3 plus separately quantified start and
      exception corrections; total/parallel steps; expected stored endpoints;
      table bytes; memory byte-rounds as the declared constant-reservation
      upper planning proxy table_bytes*ceil(R), not measured occupancy integral;
      actual symbolic lane workspace; endpoint communication 256*E payload
      bytes plus an explicitly unknown transport overhead; hash calls with
      rejection and probing terms; time estimates conditional on measured
      primitives with their source cells and no unsupported network price.
    feasibility: >-
      Mark infeasible under the 8 GiB process setting whenever even table bytes
      exceed it; unknown remaining costs cannot turn infeasible into feasible.
      The model still reports infeasible rows. Formula use assumes DP trails
      and storage permit the declared random-map schedule; saturation, theta
      near degenerate regimes, limited network throughput and table contention
      are disclosed limitations, not fitted-away overhead.
    optimism: Perfect parallelism and free network latency understate elapsed time; omitted private workspaces understate memory; ideal random mapping/useful collisions may understate work. The fixed I/S weights can over- or understate time, so direction is not assumed.
    calibrated_label_gate: Only eligible for the phrase descriptively calibrated on these three rungs when every instrument gate and all three ten-seed mean windows pass. Otherwise conditional uncalibrated model; no 256-bit attack claim in either case.
  controls:
    - Exact independent affine output and count predictor checks for every scalar input, every repeated count, and all named exceptional cases.
    - Planted overhead uses its exact rational factor and independent counts, with blinded report commitments before label release.
    - Null uses its own distinct scalar stream and independent predictor; differing Hamming weights are not instrument failures.
    - The same exact input/executable is counted on A and B and on two guest boots of A; raw count equality is mandatory, even if rounded 2-percent windows pass.
    - Measured field ratios remain separate from fixed conventional weights; equal logical counts with different times is the required observation-collision audit.
    - Reduced curve prime/order certificates, secret separation, all recovered logarithms, DP collisions and restart accounting are checked independently.
    - The 0.886*sqrt(N) negation-quotient convention is an inadmissible ruler for this unquotiented walk; 1.253...*sqrt(N) is the corresponding collision convention before DP propagation.
  metrics:
    primary: [exact_M_S_I_per_input, raw_GOE_rational, independent_count_disagreement, output_correctness, maximum_per_seed_cross_host_discrepancy, maximum_per_seed_cross_boot_discrepancy, planted_factor_relative_error, rho_total_transition_counts, rho_rung_mean_ratio]
    secondary: [all_repeat_wall_ns, all_repeat_CPU_ns, payload_peak_RSS_bytes, primitive_time_ratios, extra_integer_and_hash_work, field_addition_counts, setup_and_start_costs, DP_counts, endpoint_table_peak_bytes, useless_collisions, long_trail_restarts, serialization_bytes, checkpoint_bytes, certificate_bytes, model_resource_vector]
    discrepancy_definition: For each seed and routine compare the summed designated-repeat raw GOE of corresponding hosts/boots as abs(G1-G2)/min(G1,G2). All values are positive; report maximum across seeds separately per routine, preserving the original statistic.
    planted_error_definition: abs(observed_GOE_ratio/independently_predicted_ratio-1); exact count identity remains the stricter integrity gate.
    rho_mean_definition: Arithmetic mean of all ten total transition counts divided by C+2/theta, evaluated with a recorded high-precision pi/square-root implementation and interval-enclosed comparison at threshold boundaries.
  budget:
    enforcement: advisory
    advisory_scope: Time and CPU estimates only; fixed scientific counts, one scientific job at a time, one arithmetic process or three rho processes, table cap and aggregate 8 GiB memory protection remain binding.
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 8
    maximum_workers: 3
    maximum_runs: 40
    process_checkpoint_seconds: 3600
    checkpoint_reason: Bound an unattended process/cleanup interval and preserve recoverable state; this is not a research spending cap or a scientific transition cutoff.
  runtime:
    contract: >-
      Before fixture/timing work, a separately reviewed launcher writes exclusive
      launch.json before resource setup, redirects stdout/stderr, and writes
      receipt.json on every catchable exit. Linux execution requires a delegated
      cgroup v2 containing the coordinator and all workers, applies and reads
      back memory.max=8*2^30, memory.swap.max=0, and pids.max sufficient for the
      three single-threaded processes with no additional descendants. Freeze
      pids.max=3; refuse numerical libraries that spawn extra threads. Set
      cpu.max to 300000 100000 for rho or 100000 100000 for arithmetic.
      Apply per-process RLIMIT_AS=8*2^30 as an additional guard; it is not
      the aggregate memory guarantee. Do not impose a CPU-time research cap.
      The coordinator reads cgroup memory.peak, memory.events and aggregate
      cpu.stat before cleanup. Missing delegation/readback refuses admission;
      this contract does not assert an existing launcher supports these controls.
      A 3600-second wall watchdog
      requests a checkpoint and then terminates; cleanup can take five further
      seconds. A missing receipt after SIGKILL remains an incomplete attempt.
    environment: >-
      Identical ISA-compatible Linux guest executable/image on both physical
      hosts; native unsupported hosts require an admitted Linux guest. Record
      actual identities and capabilities; no claim of availability is made here.
      No network access during payload work, no image pull, and read-only source.
      Use an explicitly provisioned writable attempt directory; a launcher
      lacking durable output access fails preflight. Do not assume an existing
      container supervisor provides such a mount or modify shared tools in the
      implementation-only task.
    continuation: >-
      Attempt directories are exclusive. Checkpoints bind RNG counters, both
      lanes, endpoint table, input and code hashes, accumulated counters and
      timing. Resume the same logical job only under a recorded remaining-work
      disposition and compatible lock, preserving all attempts. A checkpoint
      never restarts the sample from a favorable seed and never exhausts the campaign.
    failed_measurement: Retain authenticated completed batches/trails and mark incomplete timing cells censored; never convert an uncatchable or nonzero exit into zero measured work.
  stopping_rules:
    - Finish the exact 40 logical jobs and nine conditional model rows; no adaptive extra samples or favorable replacements.
    - Stop affected measurement and preserve evidence on first failed correctness/count/control check; remaining jobs receive explicit omitted/inadmissible receipts until an additive repair and readmission.
    - Rho terminates only on independently verified recovery or a retained infrastructure/checkpoint/memory event; long-trail thresholds restart a trail, not the job.
    - Watchdog expiry preserves progress and prompts a concrete remaining-work disposition; no campaign budget exhaustion or mathematical refutation follows.
  invalidation_rules:
    - Wrong group/formula/encoding, missing required certificates, reused unreviewed checker code, secret shortcut, count mismatch, planted-control failure, or unrecorded input/executable drift invalidates the affected instrument result.
    - Missing host, boot, payload telemetry, decisive measurement, or archive is incomplete/inconclusive rather than a mathematical failure.
    - A timing difference at identical logical counts does not invalidate counting and does not prove performance equivalence.
  success_criterion: >-
    Complete all required physical cells and all 30 verified rho recoveries,
    pass every exact instrument/control check, retain independently verified
    reports, and satisfy the inherited reporting windows: maximum per-seed
    host and boot discrepancies <=0.02, planted relative factor error <=0.10,
    and each of the three complete ten-seed rho mean ratios in [0.8,1.2].
    This is finite instrument compatibility and descriptive model calibration only.
  falsification_criterion: >-
    An exact independently localized count/output contradiction refutes the
    tested instrument implementation. With valid instruments and complete
    data, failure of a fixed reporting window is a negative finite calibration
    outcome for that row/panel, not a refutation of random-map theory, generic
    rho constants, or cryptographic security. Missing data or ambiguous threshold
    intervals are INCONCLUSIVE, never counted as passing or failing.
  outcomes:
    positive: All exact gates and complete finite windows pass; publish the scoped finite calibration label after independent review only.
    negative: Valid complete data fail a stated descriptive window; localize the row, preserve all samples and withhold calibrated extrapolation.
    invalid: An instrument/certificate/control defect prevents interpreting that measurement.
    inconclusive: Required cells, telemetry, certificates, reviews or threshold decisions are missing; list exact remaining work.
    mixed: Report arithmetic, each rho rung, and each model feasibility row separately; no averaging away a failed or incomplete component.
  artifacts:
    run_root: experiments/EXP-CRYPTO-9225d2/runs/<allocated-run-id>/
    layout: >-
      A later execution plan allocates all run and attempt IDs. Each logical job
      uses the exact files below; keyed tables contain every required cell or an
      explicit not-applicable/omitted row. No dynamically fragmented per-input
      file tree is required. Every attempt preserves launch/log/receipt bytes;
      final bundles hash-bind all contributing attempts and admission data.
    required_files: [manifest.yaml, launch.json, receipt.json, command.txt, environment.json, stdout.log, stderr.log, admission.json, inputs.json, fixture-certificates.json, count-results.jsonl, primitive-timings.jsonl, scalar-checks.jsonl, rho-trails.jsonl, rho-result.json, resource-samples.jsonl, control-results.json, predictor-report.json, blind-label-commitment.json, model-rows.json, checkpoint-index.json, artifact-sha256.json, execution-report.yaml]
    binary_checkpoints: Exact named checkpoint.bin per exclusive attempt, optional only when no checkpoint is reached; checkpoint-index.json records absence or its hash, byte length and completed-work boundary.
    summary_root: experiments/EXP-CRYPTO-9225d2/summary/<execution-plan-id>/
    summary_files: [manifest.yaml, job-bindings.json, arithmetic-summary.json, rho-summary.json, model-rows.json, controls-summary.json, resource-summary.json, artifact-sha256.json, execution-report.yaml]
    summary_ownership: The later scientific execution/archive handoffs explicitly own this fixed summary directory alongside the 40 run roots. It is a deterministic aggregation within the 40-job plan, not another scientific sample or run. Exactly nine model rows occur here, keyed by (m,d); job-local model-rows.json records not_applicable with the summary path, never duplicated modeled observations.
    absent_component: An arithmetic job has explicit rho not-applicable records and conversely; missing required work is never encoded as not applicable.
    archive_manifest: Bind source/dependency/fixture/code/input hashes, actual model identity if exposed and verification status, command, dirty state, time/resource scope, status, certificate kind and all artifact hashes. No invented runtime or launch values.
  required_artifacts: [manifest.yaml, launch.json, receipt.json, command.txt, environment.json, stdout.log, stderr.log, admission.json, inputs.json, fixture-certificates.json, count-results.jsonl, primitive-timings.jsonl, scalar-checks.jsonl, rho-trails.jsonl, rho-result.json, resource-samples.jsonl, control-results.json, predictor-report.json, blind-label-commitment.json, model-rows.json, checkpoint-index.json, artifact-sha256.json, execution-report.yaml]
  assigned_to: executor
  interpretation_limits:
    - Fixed 1/1/100 weights define a conventional count ruler, not a measured equality of machine costs.
    - No constant-time, best-implementation, universal group-operation, GJM-ladder, ECDLP exponent or security claim.
    - This special reduced subgroup family and ten seeds per rung do not establish generic-curve transfer or a universal probabilistic theorem.
    - Model assumptions and time/memory/data costs remain visible; passing finite controls is not a proof of a 256-bit attack cost.
