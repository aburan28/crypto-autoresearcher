# EXP-ECDLP-63d2fd
# Equation-count arithmetic. No point is counted.
# Approved by DEC-20261003-6e7a6c.
experiment:
  id: EXP-ECDLP-63d2fd
  hypothesis_id: H-ECDLP-870cdb
  source_idea: IDEA-20261003-3bf443
  question_id: RQ-ECDLP-623a32
  version: 1
  title: Jacobi equations versus a short-Weierstrass equation
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-6e7a6c
  objective: >-
    Check the equation counts 2 and 1, the product 2, and the nearby gap 0.
  inputs:
    count_hi: 2
    count_lo: 1
    equation_gap: 1
    equation_product: 2
    equation_sum: 3
    nearby_a: 1
    nearby_b: 1
    nearby_gap: 0
    nearby_product: 1
  controls:
    - >-
      A Jacobi intersection writes 2 equations. A short-Weierstrass
      model writes 1 equation. Reporting both as 1 drops the gap
      and invalidates the run.
    - >-
      Two exceeds one by 1. The product of the two counts is 2.
      Their sum is 3.
    - >-
      Two short-Weierstrass models each write 1 equation. Their gap
      is 0 and their product is 1.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {count, subtract}
  metrics:
    primary:
      - count_hi
      - count_lo
      - equation_gap
      - implementations_agree
    secondary:
      - equation_product
      - equation_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The Jacobi intersection writes 2 equations. The
      short-Weierstrass model writes 1. The gap of two
      short-Weierstrass models is 0.
    formula: >-
      Count 2 Jacobi equations. Count 1 short-Weierstrass
      equation. Subtract 1 from 2. Multiply 2 by 1. Subtract 1
      from 1.
    source: >-
      IDEA-20261003-3bf443 states the counts 2 and 1, read
      2026-10-03. The gap, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No point was counted.
  scale_relevance:
    tier: toy
    justification: Two written models. No transfer to a point count.
    correspondence: null
  tail_checks:
    - The product 2 and the nearby gap 0 are required. A check that stops at the count 2 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the count 2 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The Jacobi count is not 2.
    - The short-Weierstrass count is not 1.
    - The gap is not 1.
    - The product is not 2.
    - Both models are reported as writing 1 equation, or a point is counted.
  success_criterion: >-
    Both runs agree that the Jacobi intersection writes 2
    equations, that the short-Weierstrass model writes 1, and
    that 2 exceeds 1 by 1.
  falsification_criterion: >-
    The runs agree that the Jacobi equation count is computed,
    and that count is not 2.
  required_artifacts:
    - experiments/EXP-ECDLP-63d2fd/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-63d2fd/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-63d2fd/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-63d2fd/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-63d2fd/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-63d2fd/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any count of a point or scalar recovery.
    - Any claim that an equation-count gap of 1 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - Any reading of these counts as written parameters.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
