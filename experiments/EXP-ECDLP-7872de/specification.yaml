experiment:
  id: EXP-ECDLP-7872de
  hypothesis_id: H-ECDLP-8f9cce
  question_id: RQ-ECDLP-002
  version: 1
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    VERIFICATION PROTOCOL - path-level blast-radius map for the two confirmed
    properties of shared harness/semaev.py, with a swept defect reintroduction,
    a no-Semaev tracer null, and a curve-free import-graph fixture

  objective: >-
    If separately approved, authorized and executed, determine which committed
    run records in this repository actually depend on the confirmed s4_expr
    variable-collision defect, classify every one of them at PATH level into four
    exclusive classes, and re-run the cheapest conclusion-changing candidate at
    its own archived parameters under a corrected implementation. Separately, and
    scoped as a CONFOUND CHECK rather than an error audit, determine which
    committed comparisons across curves with different cofactors could be
    affected by whole-curve factor-base sampling.

  verification_protocol:
    artifact_checked: >-
      Every committed run record whose manifest records an invocation that could
      reach harness.semaev.s4_expr or harness.semaev.build_factor_base, plus the
      two shared functions themselves.
    reference_checked_against: >-
      For the s4_expr property - the exact-witness identity, that the fourth
      summation polynomial evaluated at a genuine witness where three points sum
      to the target must be exactly zero. This is an independent mathematical
      reference, not a comparison against another implementation.
      For the factor-base property - the target's own subgroup order and
      cofactor, recorded per instance, against the sampling domain the code
      actually used.
    result_that_would_fail_it: >-
      A committed run whose recorded parameters produce a nonzero exact-witness
      residual under the archived code AND whose headline number changes when
      re-run under the corrected code. That fails the archived record and
      requires a superseding correction elsewhere.
    what_a_pass_means: >-
      A pass means only that the tested archived parameters happened to be immune
      to the defect. It does NOT mean the defect is harmless, and it does not
      extend to any record classified UNTRACEABLE.

  what_this_is_not:
    - Not a mathematical experiment. It produces no ECDLP claim of any kind and no new result about any curve.
    - Not an audit of an error in build_factor_base. KN-OPEN-5b3a08 records whole-curve sampling as the historically standard construction and declines to call it wrong; this contract scopes it as a confound check and inherits no stronger characterisation.
    - Not an edit of harness/semaev.py. The corrected implementation is used only inside the re-run arm and lives beside the shared file.
    - Not a correction record. If a committed conclusion changes, the supersession is a Coordinator action taken elsewhere.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling: >-
    Tier NOT APPLICABLE - no claim about any mathematical object is made or can
    be derived. The exact scope a completed run could support is a per-record
    classification of this repository's own committed artifacts, plus one re-run
    outcome at one archived parameter set.

  falsifiable_prediction: >-
    PRE-REGISTERED BEFORE EXECUTION AND NEVER TUNED TO THE DATA.
    (1) A committed record confirmed by direct file read not to reach
    harness.semaev classifies as UNAFFECTED.
    (2) With the defect reintroduced at exactly k of N tested witnesses, the
    exact-witness checker reports exactly k nonzero residuals at every k in the
    sweep, including exactly 0 at k = 0 and exactly N at k = N.
    (3) The tracer's class assignments on a curve-free fixture with matched
    import-graph shape agree with the assignments the graph implies.
    (4) At least one archived run in the enumerated exposure set is traceable at
    path level.
    (5) The four class counts sum to the enumerated exposure-set total, with no
    record in two classes and none in none.

  measured_quantities:
    - name: exposure_set_size
      definition: >-
        Number of committed run directories enumerated by direct listing as
        reaching, or possibly reaching, either shared function.
      units: run records (integer)
    - name: class_counts
      definition: >-
        Count of records in each of the four exclusive classes -
        affected_conclusion_changing, affected_conclusion_robust, unaffected,
        untraceable.
      units: run records (integer, four values summing to exposure_set_size)
    - name: untraceable_by_age
      definition: Count of UNTRACEABLE records broken out by archive date.
      units: run records per date bucket (integer)
    - name: witness_residual_count
      definition: >-
        Number of tested witnesses at which the fourth summation polynomial
        evaluates to a nonzero field element, out of N tested.
      units: witnesses (integer out of integer)
    - name: rerun_headline_delta
      definition: >-
        The change in the re-run record's own headline number between its
        archived value and its value under the corrected implementation at the
        identical archived parameters.
      units: as recorded by that experiment, reported in its own units alongside a dimensionless relative change
    - name: cofactor_table
      definition: >-
        Per affected comparison, the subgroup order and cofactor of each curve
        involved, and whether the comparison crosses differing cofactors.
      units: integers, plus a boolean per comparison

  metrics:
    primary: [class_counts, witness_residual_count, rerun_headline_delta, untraceable_by_age]
    secondary: [exposure_set_size, cofactor_table]

  null_and_control_objects:
    - id: NULL-NOSEMAEV
      name: no-Semaev tracer null
      construction: >-
        A committed record confirmed BY DIRECT FILE READ at Stage A not to import
        or reach harness.semaev, passed through the identical tracer. THE RECORD
        IS SELECTED AT STAGE A AND NAMED IN THE RUN REPORT; this contract
        deliberately names no specific identifier, because the authoring agent
        opened no candidate and naming one unread would be exactly the kind of
        inherited characterisation this batch forbids.
      forced_value: classifies as UNAFFECTED
      non_vacuity: >-
        Genuinely capable of failing - a tracer keying on filename substrings, on
        directory position, or on a transitive import it does not distinguish
        from a reached call will classify it as affected.
    - id: PLANT-DEFECT
      name: swept deliberate reintroduction
      construction: >-
        The corrected implementation with the variable-collision defect
        reintroduced on exactly k of N tested witnesses, k swept over
        {0, 1, 4, 16, N}, N at least 200.
      forced_value: >-
        The exact-witness checker reports EXACTLY k nonzero residuals at every k,
        with zero tolerance at both endpoints.
      non_vacuity: >-
        THIS IS THE DEMONSTRATED-DYNAMIC-RANGE CONTROL. A checker that fires once
        on a fully broken build has shown it detects PRESENCE. Sweeping k forces
        it to measure SIZE, which is the only thing that makes a later report of
        a small or absent effect interpretable. Without it, the finding "the
        defect was latent at these parameters" is unsupportable.
    - id: NULL-CURVEFREE-GRAPH
      name: curve-free import-graph fixture
      construction: >-
        A synthetic fixture repository containing NO elliptic-curve code at all,
        reproducing the exposure set's import and call graph shape - same module
        depth, same transitive-import pattern, same mix of reached and unreached
        calls - passed through the identical tracer.
      forced_value: >-
        The tracer's class assignments on the fixture match the assignments the
        graph structure implies, exactly.
      non_vacuity: >-
        Capable of failing in both directions, and it is the only control that
        establishes the tracer's verdicts are attributable to the call graph.
      consequence_pre_declared: >-
        IF THE TRACER'S VERDICTS DIFFER BETWEEN THE FIXTURE AND THE REAL
        REPOSITORY AT MATCHED GRAPH SHAPE, it is reading something other than the
        call graph and its output is not attributable. INDEPENDENTLY AND
        UNCONDITIONALLY - the tracer's output is a statement about an IMPORT
        GRAPH, and nothing derived from it may be quoted as a statement about
        elliptic curves or the ECDLP. That holds whether or not the fixture check
        passes, and is written here so it cannot be reframed afterwards.

  scope_gate: >-
    The tracer output is a statement about this repository's call graph. The
    exact-witness residual is a statement about one polynomial identity at one
    parameter set. NEITHER IS A STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP, and
    every quoted number carries that on its face.

  independent_variables: [record_identity, code_path, witness_index, reintroduction_count, fixture_or_real]

  preregistered_prediction:
    quantity: class_counts, witness_residual_count across the sweep, rerun_headline_delta
    formula: >-
      Classification is by path-level reachability of the defective call from the
      manifest's recorded invocation. The exact-witness residual is the value of
      the fourth summation polynomial at the coordinates of a genuine witness,
      which must be exactly the zero element of the field.
    source: ledger/hypotheses/H-ECDLP-8f9cce.yaml predictions P1 through P6
    values_frozen_here:
      reintroduction_sweep: [0, 1, 4, 16, N]
      witnesses_per_check: at least 200
      class_partition_requirement: exclusive and exhaustive over the enumerated exposure set
      untraceable_headline_threshold: more than half the exposure set makes untraceability the primary finding
      exposure_enumeration_method: direct directory listing at Stage A, never a frozen specification's claim

  decision_rule_that_falsifies: >-
    THE RECORD'S CENTRAL CLAIM IS FALSIFIED IF no archived run in the exposure
    set is traceable at path level - the exposure cannot be determined at all,
    which is a serious reproducibility finding and becomes the primary result -
    OR if the reintroduced defect provably changes nothing at every traceable
    archived parameter set, meaning the blast radius is smaller than feared.
    THE RECORD'S CENTRAL CLAIM IS SUPPORTED IF at least one traceable archived
    run's exact-witness residual is nonzero under the archived code and its
    headline number changes on re-run.
    THE RUN IS INVALID, and no verdict of either kind may be reported, if
    NULL-NOSEMAEV classifies as affected, if PLANT-DEFECT does not return exactly
    k at every k, or if the class counts do not partition the exposure set.

  stages:
    - id: SA
      name: exposure enumeration and tracer construction
      terminates_run: false
      description: >-
        Enumerate the exposure set by DIRECT DIRECTORY LISTING, never from a
        frozen specification's claim about how many runs exist. Identify the
        exact defective code paths. Select and read the NULL-NOSEMAEV candidate
        directly and name it in the report.
    - id: SB
      name: tracer validation
      terminates_run: true
      description: >-
        NULL-NOSEMAEV and NULL-CURVEFREE-GRAPH. A misclassification on either
        ENDS the run; no classification is admissible from an unvalidated tracer.
    - id: SC
      name: checker validation, swept
      terminates_run: true
      description: >-
        PLANT-DEFECT at every k. Failure to return exactly k ENDS the run; no
        latency finding is reportable from a checker with no demonstrated dynamic
        range.
    - id: SD
      name: classification
      terminates_run: false
      description: >-
        Classify every enumerated record at PATH level into exactly one of the
        four classes. UNTRACEABLE IS NEVER FOLDED INTO UNAFFECTED. Break the
        untraceable count out by archive date.
    - id: SE
      name: cheapest re-run
      terminates_run: false
      description: >-
        Re-run the single cheapest record classified
        affected_conclusion_changing, at its own archived parameters, under the
        corrected implementation, and report the headline delta.
    - id: SF
      name: cofactor confound table
      terminates_run: false
      description: >-
        For every committed comparison across curves with differing cofactors
        that used the shared factor-base builder, record the subgroup orders and
        cofactors and flag the comparison. NO CORRECTNESS CLAIM IS MADE about the
        sampling itself.

  replication:
    seeds: [0, 1, 2]
    independent_instances: 200
    seeds_per_cell: 3
    seeds_policy: >-
      The witness sets are addressed by (curve_parameters, witness_index,
      replicate) and their seeds are derived deterministically as a SHA-256 over
      the ASCII bytes of the domain string, those fields, and the declared master
      seed, reduced to 64 bits. The domain string is EXP-ECDLP-7872de/v1. THE
      RE-RUN ARM DOES NOT USE THESE SEEDS - it uses the ARCHIVED record's own
      recorded seeds and parameters verbatim, because the whole point is to
      re-run what was actually run; substituting fresh seeds there would answer a
      different question. The master seed is fixed in the frozen contract before
      any execution and is never re-drawn.
    determinism_requirement: >-
      The exact-witness residual for a fixed witness under a fixed implementation
      must be reproducible bit-for-bit. Any cell failing this is INVALID.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 20
    maximum_memory_gb: 8
    maximum_runs: 40
    maximum_workers: 1
    note: >-
      Sized to the work. Tracing dominates in effort and not in compute; the
      re-run arm's cost is whatever the archived record's own budget was, and if
      that exceeds this contract's ceiling the re-run is deferred with its cost
      reported rather than truncated.

  stopping_rules:
    - NULL-NOSEMAEV classifies as affected -> STOP, tracer is wrong, no classification admissible.
    - NULL-CURVEFREE-GRAPH assignments differ from the graph-implied ones -> STOP, tracer is not attributable.
    - PLANT-DEFECT does not return exactly k at any k -> STOP, no dynamic range, no latency finding reportable.
    - The cheapest affected record's own budget exceeds this contract's ceiling -> DEFER the re-run, report its cost, do not truncate it.
    - Class counts do not partition the exposure set -> STOP, tracer defect.

  invalidation_rules:
    - Any record classified UNAFFECTED that is in fact UNTRACEABLE is invalid. Conflating them is the single error that would make this audit falsely reassuring.
    - Any classification made at file level rather than path level is invalid.
    - Any exposure set enumerated from a frozen specification's claim rather than by direct listing is invalid.
    - Any re-run performed with fresh seeds rather than the archived record's own parameters is invalid.
    - Any statement that whole-curve factor-base sampling is an ERROR is invalid; the referenced open problem declines that characterisation and this contract inherits its scope.
    - Any edit to an archived run record is a contract violation, not an invalidation - corrections supersede (AGENTS.md core rule 4).
    - Any ECDLP or mathematical claim drawn from this contract is invalid on its face.

  success_criterion: >-
    ALL of - (a) the exposure set enumerated by direct listing with its size
    recorded; (b) NULL-NOSEMAEV classifies as unaffected; (c)
    NULL-CURVEFREE-GRAPH matches the graph-implied assignments; (d) PLANT-DEFECT
    returns exactly k at every k in the sweep; (e) every enumerated record placed
    in exactly one of the four classes, with the counts partitioning the set and
    the untraceable count broken out by date; (f) the cheapest
    conclusion-changing candidate re-run at its archived parameters, or its
    deferral recorded with its cost; (g) the cofactor confound table produced.
    Finding that the defect was latent everywhere, or that most records are
    untraceable, are both SUCCESSFUL runs of this contract; only failing (a)
    through (e) is unsuccessful.

  falsification_criterion: >-
    No archived run traceable at path level, OR the reintroduced defect provably
    changing nothing at every traceable archived parameter set. In the first case
    the finding is that this program cannot determine its own exposure; in the
    second the blast radius is smaller than feared. Secondary falsifiers of the
    DESIGN rather than the hypothesis - a misclassifying tracer, an
    unattributable tracer, or a checker without dynamic range. In every case the
    failing control is named and forward guidance names the next object.

  required_artifacts:
    - the enumerated exposure set with the directory listing that produced it
    - per-record classification with the manifest evidence for each, at path level
    - the untraceable count broken out by archive date
    - the NULL-NOSEMAEV record's identity and the direct-read evidence for selecting it
    - the curve-free fixture, its graph-implied assignments, and the tracer's assignments side by side
    - exact-witness residual counts at every reintroduction level
    - the re-run's archived parameters, archived headline number, and corrected headline number
    - the cofactor confound table
    - the corrected implementation as a separate file; harness/semaev.py unmodified and its hash recorded before and after
    - exact commands, git commit, dirty-tree state, environment and dependency versions
    - stdout and stderr

  scale_relevance:
    tier: toy
    justification: >-
      Every record in the exposure set is toy-scale. The audit bounds the
      exposure of what was actually run and nothing beyond it.
    correspondence: null

  limitations:
    - >-
      Maps the consequences of a known defect. PRODUCES NO MATHEMATICAL RESULT,
      no cost model, no exponent and no ECDLP claim of any kind.
    - >-
      Scoped to the two recorded properties and to the TRACEABLE subset of
      committed records. An untraceable record is reported as untraceable and
      nothing about it is asserted in either direction.
    - >-
      THE FACTOR-BASE ARM IS A CONFOUND CHECK, NOT AN ERROR AUDIT. Whole-curve
      sampling is recorded as the historically standard construction; this
      contract checks its statistical interaction with cofactor size in
      cross-curve comparisons and asserts nothing about correctness.
    - >-
      A pass on the re-run means only that those archived parameters were immune.
      It does not extend to other parameters and it does not extend to any
      untraceable record.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY RATHER THAN SILENTLY
      SHRUNK - whether either property would matter at cryptographic parameters
      cannot be determined here, because every exposed run is toy-scale and no
      larger instance is reachable.
    - >-
      Changes no record's status. Any correction, supersession or transition
      arising from a changed conclusion is a Coordinator decision made elsewhere.

  infrastructure_failure_disposition: >-
    A timeout, crash, missing dependency, or an archived record whose environment
    cannot be reconstructed is INFRASTRUCTURE SIGNAL, recorded as such with its
    cause. It is NEVER negative mathematical evidence, and an unreconstructable
    environment makes its record UNTRACEABLE rather than unaffected (AGENTS.md
    core rule 5).

  assigned_to: executor

  authorization_note: >-
    This contract is status draft, is not frozen, and carries approved_by null.
    Only the Coordinator may approve, freeze or authorize execution (AGENTS.md
    rule 1). Written under TASK-20260904-c0edda, which is DESIGN ONLY. It
    supersedes no contract, edits no record, and does not modify
    harness/semaev.py.
