experiment:
  id: EXP-PRECOMP-005
  status: proposed
  title: Macaulay matrix template reuse
  objective: >-
    Cache only target-independent Macaulay matrix structure by degree and
    measure the benefit of rebuilding field values directly into a frozen sparse
    layout versus ordinary symbolic preprocessing.
  fixtures:
    field_bits: [11, 13, 16, 20, 24, 28, 32]
    curve_seeds: [1, 2, 3]
    holdout_targets: 200
    decomposition_arities: [2, 3]
  variants:
    - cold_f4
    - cached_columns_and_rows
    - cached_sparsity_layout
    - cached_layout_plus_pair_and_reducer_selection
  cached_state:
    - ordered_column_monomials
    - row_source_labels
    - sparse_index_arrays
    - degree_boundaries
    - optional pair_and_reducer_schedule
  metrics:
    primary: symbolic_preprocessing_speedup
    required:
      - matrix_build_seconds
      - total_solve_seconds
      - cache_build_seconds
      - cache_bytes
      - nonzero_count
      - layout_reuse_fraction
      - verification_failures
  controls:
    - numerical coefficients are regenerated for every target
    - identical linear-algebra backend between cold and cached variants
    - exact result verification against original equations
  success_criterion: >-
    Cached layout reduces median matrix-construction plus symbolic-preprocessing
    time by >=5x and total solve time by >=2x in two >=20-bit cells.
  strong_signal: >-
    Total-solve speedup >=5x while matrix shape/layout reuse remains >=0.95 as n increases.
  falsification_hook: >-
    Symbolic preprocessing is <10% of cold solve time at all completed cells or
    layout reuse falls below 0.5 at larger sizes.
  depends_on: [EXP-PRECOMP-001]
