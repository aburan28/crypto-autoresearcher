experiment:
  id: EXP-ARGON-f2d827
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-3effe4; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-3effe4
  question_id: RQ-ARGON-141710
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exhaustive comparison of a candidate interval dynamic program, an exact brute-force solver,
    and the incumbent greedy heuristic for minimum depth-reducing set on the chain-plus-one-backward-arc
    graph class at sizes small enough to enumerate
  objective: 'The one uncertainty a run reduces is whether the depth-reducing-set measurements this
    entire lane depends on must remain heuristic upper bounds or can be made exact by exploiting the
    structural narrowness of the Argon2 lane graph. (i) The exactness question is answered by running
    a candidate interval dynamic program against a brute-force minimum on every instance of the class
    at sizes small enough to enumerate exhaustively, without stopping early on agreement, so the output
    is either a minimized counterexample with its size or the statement that none exists below n=23.
    (ii) The mechanism question -- whether any observed exactness comes from the class''s narrowness
    or from something else -- is answered by two nulls: random members of the same class, and out-of-class
    graphs with two backward arcs per node on which the DP is expected to fail. (iii) The bias question,
    which pays for the run regardless of the other two, is answered by executing the incumbent greedy
    heuristic on the identical instances and reporting the distribution of its ratio to the true minimum,
    a quantity that appears nowhere in this repository and that every existing rho prediction in this
    lane implicitly assumes something about. The run measures no Argon2 graph at deployed or recommended
    parameters and produces no security statement of any kind.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: over the enumerated and sampled
      instances of the stated structural class at n from 6 to 22 and depth targets L in the declared
      sweep, the candidate interval DP agreed with brute-force minimum in the reported fraction of
      cases, the smallest disagreement occurred at the reported n with the reported minimized instance,
      the incumbent greedy heuristic exceeded the true minimum by the reported ratio distribution,
      and the two nulls behaved as reported. WHAT DOES NOT FOLLOW: agreement up to n=22 is not a proof
      of exactness at any larger n and must never be cited as one; a counterexample does not show
      that no polynomial exact algorithm exists for the class; the measured greedy bias at n<=22 does
      not transfer to the q values this lane uses without a separate argument; and nothing whatsoever
      follows about Argon2''s security, about any parameter set, or about any adversary.'
  inputs:
    procedure: 'STAGE 0 (cost: hours of human time, zero compute): write the structural class definition,
      the DP state and transition, the brute-force pruning rules, and the sweep plan as a pre-registration
      file, and verify by construction that every p=1 Argon2 lane graph lies in the class. STAGE 1
      (cost: low): implement the naive unpruned brute-force enumerator. STAGE 2 (cost: low): implement
      the pruned brute-force solver and validate it against the naive one on every instance at n up
      to 14; do not proceed on any disagreement. STAGE 3 (cost: low): implement the candidate interval
      DP. STAGE 4 (cost: low): import the incumbent greedy heuristic with the same tie-breaking rule
      used elsewhere in this lane. STAGE 5 (cost: the compute bound, hours at n=22): run all three
      solvers on exhaustive instances for n from 6 to 12 and 10000 sampled instances per n from 13
      to 22, across the L sweep. STAGE 6 (cost: negligible): run both nulls through the identical
      code. STAGE 7 (cost: low): minimize any counterexample found, serialize it in full, and report
      the agreement rates and the greedy ratio distribution. No Argon2 measurement, no attack, no
      credential data.'
    instrument: Python 3 for the DP, the greedy heuristic and the harness, with the brute-force enumerator
      written in C for the n=18 to 22 range where Python would not finish; exact integer arithmetic
      everywhere, no floating point in any primary metric; instance serialization to plain JSON so
      any mismatch is independently re-checkable by a third party without re-running anything; harness/runner.py
      for seeding, parameter capture and manifests. The greedy heuristic is imported with the identical
      tie-breaking rule used by the rest of this lane rather than reimplemented, so the measured bias
      applies to the instrument actually in use. No Sage, no computer-algebra system, no external
      graph library for the core solvers.
    parameters: 'Graph sizes n from 6 to 22. Exhaustive enumeration of the chain-plus-at-most-one-backward-arc
      class for n from 6 to 12; 10000 uniformly sampled in-class instances per n for n from 13 to
      22, with declared seeds. Depth targets L at one half, one quarter and one eighth of native depth
      n-1, rounded down. Argon2-shaped arm: Argon2i, Argon2d and Argon2id arc patterns generated at
      the same n, ten synthetic input draws each for the data-dependent variants. Null one: 10000
      uniform in-class instances per n, same code path. Null two: 5000 out-of-class instances per
      n with exactly two backward arcs per node. No password, credential, leaked corpus or third-party
      dataset at any stage.'
  controls:
  - Brute-force solver validated against a naive unpruned enumerator at n up to 14 before it is used
    as ground truth for anything.
  - Random members of the same structural class as the null object of the same shape, run through
    identical code.
  - Out-of-class two-backward-arc graphs, where the DP is expected to fail, testing that the structural
    narrowness is load-bearing.
  - The greedy heuristic run on the same instances, so the lane's existing instrument is measured
    against ground truth in the same experiment at no extra cost.
  - Depth target L swept rather than fixed, since exactness may be threshold-dependent.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls, both run through the identical DP and brute-force code paths
    in the same invocation. NULL ONE, the random member of the class: graphs drawn uniformly from
    chain-plus-one-uniform-backward-arc on the same n, which is the random object of the same shape.
    The DP-versus-brute-force agreement rate on these must be reported alongside the Argon2-shaped
    instances; if the DP is exact only on Argon2-shaped graphs and fails on random members of the
    same class, that is a much weaker and much more fragile result than exactness on the class, and
    the distinction is invisible without this null. NULL TWO, a class the DP must provably fail on:
    graphs with two backward arcs per node, outside the claimed structural class, where the DP is
    expected to be wrong. If the DP happens to be exact there too, the claimed structural narrowness
    is not what is doing the work and the whole mechanism story is wrong. For the signal to mean anything,
    null one must show agreement rates comparable to the Argon2-shaped arm and null two must show
    disagreements.'
  independent_variables:
  - n, the graph size, from 6 to 22
  - L, the depth target, at one half, one quarter and one eighth of native depth
  - instance family, in {exhaustive in-class, sampled in-class, Argon2-shaped, out-of-class two-arc}
  - solver, in {interval DP, pruned brute force, incumbent greedy}
  metrics:
    primary:
    - DP-versus-brute-force agreement rate per n, per L and per instance family
    - smallest counterexample size n, or an explicit statement that none was found below 23
    - greedy-versus-brute-force removal-set-size ratio, distribution with mean, median and maximum
    - DP agreement rate on the out-of-class null relative to the in-class rate
    secondary:
    - number of instances enumerated or sampled per cell
    - pruned-versus-naive brute-force agreement at n up to 14
    - wall clock per solver per n
    - size of the minimized counterexample and the structural feature it exhibits
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The agreement rate between the candidate interval DP and the exact brute-force minimum
      on the chain-plus-one-backward-arc class, and the ratio of the incumbent greedy heuristic's
      output to that exact minimum.
    formula: Agreement rate A(n, L) = |{instances where DP output equals brute-force minimum}| / |{instances
      tested}|. Greedy ratio G = greedy removal-set size divided by brute-force minimum removal-set
      size, reported as a distribution over instances. Predicted A >= 0.95 on Argon2-shaped instances
      at all tested n and L; predicted mean G >= 1.10; predicted out-of-class A lower than in-class
      A by at least 0.10.
    source: Pre-registered in the parent proposal IDEA-20260816-3effe4 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at n from 6 to 22, which is four to sixteen binary orders below the per-lane
      block counts this lane''s other contracts use and far below either RFC 9106 recommended tuple.
      That is not a limitation to be apologized for but the design: exhaustive comparison against
      a true minimum is only possible where every subset can be enumerated, and a claim of exactness
      is worth nothing unless checked against ground truth. The transfer assumption is stated sharply
      and is NOT relied on by the primary deliverable: agreement at n<=22 does not establish exactness
      at larger n, and the greedy-bias ratio measured at these sizes is not asserted to hold at the
      q values this lane uses. Both are labelled as open in the record.'
    correspondence: null
  tail_checks:
  - Inspect the instances with the largest greedy-to-minimum ratio individually, since a heavy tail
    matters more to this lane than the mean.
  - Inspect every DP mismatch by hand rather than only counting them, since one structurally informative
    counterexample outweighs a hundred numerically similar ones.
  - Inspect behaviour at the smallest L, one eighth of native depth, where removal sets are largest
    and the DP's state is most stressed.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt everything if the pruned brute-force solver disagrees with the naive enumerator at any n
    up to 14, since ground truth would then be unreliable.
  - Do not stop the sweep early on agreement; run the full n range regardless, because the deliverable
    is the smallest counterexample size and early stopping would fabricate it.
  - Stop and report partial results if wall clock exceeds six hours, recording which n completed;
    incompleteness is a budget outcome and is never reported as absence of a counterexample.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The pruned brute-force solver validates against the naive enumerator, all three
    solvers complete the full n and L sweep on all four instance families, and the agreement rates,
    the smallest counterexample or its documented absence below n=23, and the greedy ratio distribution
    are reported -- irrespective of whether the DP turns out exact.
  falsification_criterion:
  - A counterexample is found, falsifying the exactness claim at the reported n.
  - DP agreement on Argon2-shaped instances falls below 0.95.
  - DP agrees equally on the out-of-class null, falsifying the structural-narrowness mechanism.
  - Pruned brute force disagrees with the naive enumerator at any n up to 14.
  - Mean greedy ratio falls below 1.02, removing the motivation for an exact method entirely.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-3effe4
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The DP state is specified informally here as a pair; the Coordinator must fix the exact state,
    transition and base case in the contract, because an under-specified state cannot be falsified
    -- a failed run could always be blamed on the wrong DP.
  - The brute-force pruning rules must be written down and argued sound before implementation, not
    tuned afterward, since unsound pruning corrupts ground truth in the same direction as a wrong
    DP.
  - Whether uniform sampling from the in-class distribution is the right sampler above n=12, or whether
    adversarial instance generation should replace it, is unresolved and materially affects the counterexample
    search.
  - Whether a proof obligation should be opened as a KN-OPEN record if no counterexample is found
    is a Coordinator decision this record does not pre-empt.
