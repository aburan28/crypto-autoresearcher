# EXP-MONO-1da7be
# Frobenius image of the signed-sum fibre over the symmetric base.
# Frozen before any run. The orders below are a prediction, not a result.
experiment:
  id: EXP-MONO-1da7be
  hypothesis_id: H-MONO-a82b4a
  source_idea: IDEA-20261005-ddbf31
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  version: 1
  title: >-
    Signed-sum wreath image on six curves at p=101
  status: approved
  frozen: true
  designed_at: '2026-10-05'
  approved_by: coordinator
  approval_decision_id: DEC-20261005-f31688
  objective: >-
    For each frozen curve, take the first 64 good symmetric base
    points, let Frobenius act on the four signed sums, and record
    the order of the permutation group, the number of 4-cycles,
    and whether every permutation preserves the inverse-pair
    partition.
  inputs:
    prime: 101
    modulus: "z^8 + 2"
    field: "F_101[z] / (z^8 + 2)"
    sampler: "u = (37*k + 11) mod 10201; e1 = u mod 101; e2 = u // 101"
    sample_size: 64
    ordinary_panel:
      - {A: 1, B: 1, role: ordinary, point_count: 105, psi_order: 8, input_order: 8, four_cycles: 15, partition_breaks: 0, indices_consumed: 65}
      - {A: 2, B: 3, role: ordinary, point_count: 96, psi_order: 8, input_order: 8, four_cycles: 15, partition_breaks: 0, indices_consumed: 66}
      - {A: 4, B: 1, role: ordinary, point_count: 112, psi_order: 8, input_order: 8, four_cycles: 24, partition_breaks: 0, indices_consumed: 68}
      - {A: 1, B: 2, role: ordinary, point_count: 100, psi_order: 8, input_order: 8, four_cycles: 14, partition_breaks: 0, indices_consumed: 65}
    artifact_panel:
      - {A: 0, B: 1, role: artifact, j: 0, supersingular: true, point_count: 102, psi_order: 8, input_order: 8, four_cycles: 15, partition_breaks: 0, indices_consumed: 66}
      - {A: 1, B: 0, role: artifact, j: 1728, supersingular: false, point_count: 100, psi_order: 8, input_order: 8, four_cycles: 13, partition_breaks: 0, indices_consumed: 73}
    null_quartic:
      modulus_index: "u = (37*k + 11) mod 104060401"
      polynomial: "c0 + c1*T + c2*T^2 + c3*T^3 + T^4, base-101 digits of u, low degree first"
      separable_count: 64
      type_3_plus_1: 20
      indices_consumed: 64
  controls:
    - >-
      Input fibre. The same 64 base points, permuting the four
      points lying over the unordered pair. Order 8 is required
      on every curve. A smaller order invalidates that curve.
    - >-
      Null quartic. Sixty-four separable monic quartics from the
      frozen index. Twenty have irreducible-factor degrees
      {1, 3}. Zero such factorizations invalidate the batch.
    - >-
      Partition. Each Psi permutation is checked against the
      two pairs of equal x-coordinates. A break is a result,
      not a dropped sample.
    - >-
      Square-root field. The discriminant is tested in
      F_{p^8}. Rejecting a discriminant that is not a square
      in F_p drops the swap class and is an invalid instrument.
    - >-
      Artifact separation. j=0 and j=1728 are reported and are
      not counted in the ordinary tally.
  independent_variables:
    - curve in the six frozen (A, B) pairs
    - role in {ordinary, artifact}
  metrics:
    primary:
      - psi_order
      - four_cycles
      - partition_breaks
    secondary:
      - input_order
      - point_count
      - null_type_3_plus_1
      - indices_consumed
  heuristic_under_test: H1
  preregistered_prediction:
    quantity: >-
      Psi image order 8 on each ordinary curve, four-cycle
      counts 15, 15, 24, and 14, and partition breaks 0.
      Artifact four-cycle counts are 15 and 13. The null has
      20 factorizations of type 3+1.
    formula: >-
      A good index has four distinct input points and four
      distinct signed sums, none at infinity. Frobenius is the
      p-power map on coordinates. Cycle type is labelling
      independent. The group order is the order of the
      subgroup of S_4 generated by the 64 permutations.
    source: >-
      IDEA-20261005-ddbf31, specialized to p=101 and to the
      curves named in inputs. The counts were computed in the
      design session and are not a run.
  scale_relevance:
    tier: toy
    justification: >-
      One 7-bit prime and fibre size 4. No transfer to a
      cryptographic prime or to m greater than 3.
    correspondence: null
  tail_checks:
    - >-
      The curve (4, 1) has 24 four-cycles. Dropping that curve
      invalidates the batch.
    - >-
      The null count is 20. A rerun that emits zero
      factorizations of type 3+1 does not decide the panel.
  replication:
    seeds: ["lcg-37-11"]
    independent_instances: 1
    replication_note: >-
      Deterministic. One manifest per curve. The null quartic
      is recomputed in every manifest.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 6
    maximum_workers: 1
  stopping_rules:
    - Stop after six valid manifests, one per frozen curve.
    - Do not add a prime, a curve, or a sample size.
    - Do not replace a dropped discriminant class by resampling inside F_p squares.
  invalidation_rules:
    - The input-fibre order is not 8.
    - The null type 3+1 count is not 20.
    - The point count differs from the frozen table.
    - A sample whose Frobenius image misses the four-point set is counted as bad, and any positive bad count invalidates the cell.
    - A timeout, crash, or missing manifest.
    - A four-cycle count differs while the Psi order is still 8. That mismatch does not falsify the wreath reading.
  success_criterion: >-
    All six manifests are valid. Each ordinary curve has Psi
    order 8, partition breaks 0, and four-cycle counts
    15, 15, 24, 14 in panel order. Each artifact curve has Psi
    order 8, partition breaks 0, and four-cycle counts 15 and
    13. Every input order is 8 and every null count is 20.
  falsification_criterion: >-
    The input orders are 8, the null count is 20, the point
    counts match, and an ordinary curve has Psi order other
    than 8 or a positive partition-break count. An artifact
    mismatch does not meet this criterion. A four-cycle count
    mismatch with Psi order still 8 does not meet it either.
  required_artifacts:
    - experiments/EXP-MONO-1da7be/runs/<run-id>/command.txt
    - experiments/EXP-MONO-1da7be/runs/<run-id>/stdout.txt
    - experiments/EXP-MONO-1da7be/runs/<run-id>/stderr.txt
    - experiments/EXP-MONO-1da7be/runs/<run-id>/result.json
  assigned_to: executor
  out_of_scope:
    - The ordered base of IDEA-20261005-70b25b.
    - Any prime other than 101.
    - Any curve outside the six frozen pairs.
    - Inertia along the drop locus. This contract does not claim that Frobenius generates the geometric image.
    - A relation rate, a factor base, or a discrete logarithm.
    - Editing H-MONO-0b3def or EXP-MONO-4c7479.
