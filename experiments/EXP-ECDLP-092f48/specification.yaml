experiment:
  id: EXP-ECDLP-092f48
  hypothesis_id: H-ECDLP-f9aa58
  version: 1
  title: >-
    THE SHAM CURVE - a paired three-arm Groebner timing experiment with an
    ALGEBRAIC null of the same shape but no curve behind it, gated on host load,
    preceded by a pilot arm that MEASURES the minimum detectable effect before
    the bands are fixed, with a four-level planted-cost-difference ladder as the
    blocking sensitivity control, a per-cell ideal dimension-and-degree
    admissibility gate, and a reproduction gate run at p = 1009 where the
    committed timing pair was actually measured
  status: draft
  status_note: >-
    DRAFT. Not review_required and not approved. Coordinator design freeze
    converting IDEA-20260811-18bbf9 into a testable protocol under
    TASK-20260904-43152a. Not snapshot-committed, not independently reviewed, NO
    RUN AUTHORIZED. This is the only high-compute contract in the batch and the
    only one that measures time; the host-load gate below is BLOCKING, not
    advisory.
  objective: >-
    Supply the missing control on the campaign's most-cited cost measurement by
    running the identical cost measurement on two points of a single fibre of the
    support map (the sham and the genuinely special system) and on a point
    outside it (the generic system), under one paired protocol, and to report the
    campaign's first stated MINIMUM DETECTABLE EFFECT for a Groebner cost
    comparison. Budget is sized to the WORK - a pilot power arm plus a paired
    three-arm design over several generic curves, several densities, two monomial
    orders and two formulations - and exceeds the template floors.
  goal_binding_unresolved: >-
    IDEA-20260811-18bbf9 declares goal_id GOAL-ENDO-001. The design session
    checked the tree on 2026-09-04 and found NO ledger/goals/GOAL-ENDO-001.yaml,
    although coordination/goals/GOAL-ENDO-001 exists. The goal binding is
    recorded as UNRESOLVED and the Coordinator must resolve it before dispatch.
  inputs:
    reproduction_gate_configuration: >-
      p = 1009 with the committed factor-base configuration, m = 3. THIS PRIME IS
      CHOSEN DELIBERATELY AND DIFFERS FROM THE SOURCE PROPOSAL: the committed
      timing pair the gate must reproduce is recorded in the red-team notes as
      coming from a p = 1009 run, so reproducing it at p = 4001 would not be a
      reproduction. The verbatim committed figures are copied into the run
      manifest for comparison.
    main_arm_configuration: >-
      p = 4001, m = 3, degeneration loci with vanishing coefficient blocks of the
      two smallest declared sizes; m = 4 only for the two largest weight-12
      blocks and only if the memory cap permits. At least 5 distinct generic
      curves per cell, so the quantifier over curves is actually tested. Factor-
      base density swept over at least 3 values bracketing 1/m!, because the
      committed over-dispersion is recorded as decaying with density and a single
      saturated row is not admissible.
    arms: >-
      ARM-G, the untouched generic system; ARM-S, THE SHAM - the same system with
      exactly the monomials of the degeneration block deleted, same monomial
      positions otherwise, generic coefficients; ARM-X, the system of a genuine
      curve on the locus at the same prime. Identical factor bases, identical
      targets, identical monomial order, identical budget across arms, PAIRED
      over at least 20 seeds.
    formulations: >-
      Both the membership-free and the membership-bearing formulations are run
      and reported in SEPARATE tables, because only the membership-free one is a
      curve functional and the other's solving degree is pinned by the
      factor-base size.
    target_sampling: >-
      If any arm draws targets it must use the full-group target sampler, never
      the sampler that draws only from the cyclic subgroup, whose estimand is
      disputed by a hypothesis at status `specified`. Reusing the disputed
      sampler would measure two different estimands on the two halves of every
      configuration. The sampler used is recorded per arm.
  controls:
    - id: NULL-ARM-S-SHAM
      description: >-
        NAMED NULL OBJECT, AND THE DELIVERABLE OF THIS CONTRACT. ARM-S is a
        polynomial with the special-j SUPPORT PATTERN and GENERIC COEFFICIENT
        VALUES. It is a null of exactly the right shape - same monomial
        positions, same variable count, same degree - and it is CURVE-FREE by
        construction: it is not the summation system of any curve and consumes no
        curve resource. NON-DEGENERACY IS CHECKED, NOT ASSUMED: the number of
        deleted monomials in the block is reported per cell, and a cell with an
        empty block is inadmissible, so the null provably differs from ARM-G in
        support.
      failure_meaning: >-
        CONSEQUENCE DECLARED IN ADVANCE. If ARM-S reproduces ARM-X's cost while
        both differ from ARM-G (OUTCOME A), the effect is reproduced by an object
        with no curve behind it, and NOTHING measured may be quoted as a
        statement about elliptic curves or the ECDLP - the correct reading is a
        combinatorial statement about support. If ARM-S differs from BOTH
        (OUTCOME D) the sham is not a valid null and the run is INVALID rather
        than informative.
    - id: CTRL-SENSITIVITY-LADDER
      description: >-
        BLOCKING POSITIVE CONTROL WITH DEMONSTRATED DYNAMIC RANGE. Plant genuine
        cost differences of FOUR known sizes - approximately 1, 3, 10 and 30
        percent - by a declared mechanism (reducing the factor-base size by
        declared factors chosen so the expected cost change is computable), and
        measure the paired design's detection probability at each. Predicted
        detection probabilities and the mechanism's expected cost change are
        written to results/forced_values.yaml BEFORE the run.
      failure_meaning: >-
        Detection must rise monotonically and reach 1.0 at the largest planted
        size. Failure to detect the largest means the instrument is blind and
        EVERY null in this contract is void. Detection already at 1.0 for the
        smallest means the declared band is far too wide and must be restated
        before the main run. A single boolean sensitivity check would establish
        neither; the ladder is what demonstrates the instrument's response to a
        defect of known size.
    - id: CTRL-PILOT-MDE
      description: >-
        MEASURE THE POWER BEFORE FIXING THE BANDS. A pilot arm of 40 repetitions
        of an identical input, reporting the empirical distribution of solve
        time, its coefficient of variation, and the resulting minimum detectable
        effect at the declared seed count. If the achieved MDE exceeds the
        declared 3 percent band, the band is WIDENED BEFORE the main run and the
        widening is recorded in a versioned amendment.
      failure_meaning: >-
        A null on a timing measurement is only as good as its power. A band
        narrower than the achieved MDE would make "no difference" unfalsifiable
        and the run uninterpretable.
    - id: CTRL-DIMENSION-ADMISSIBILITY
      description: >-
        BLOCKING. Ideal dimension and degree computed per arm per cell, by
        staircase from a Groebner basis, and required EXACTLY EQUAL across arms
        for the cell to be admissible.
      failure_meaning: >-
        A cell failing is DROPPED AND COUNTED, never silently retained. The count
        of dropped cells is itself informative about how violent the deletion is,
        and if most cells at a deletion size fail, those arms are dropped.
    - id: CTRL-HOST-LOAD
      description: >-
        BLOCKING INFRASTRUCTURE GATE. Host load is recorded FROM A BOUND SOURCE,
        never by hand, before and after every run, and must be below a declared
        threshold. The threshold and the recorded load figures that motivate it
        are read at run time from the committed decision that recorded them, and
        quoted into the run manifest.
      failure_meaning: >-
        Above the threshold, the run is an INFRASTRUCTURE RECEIPT and never a
        null result. This is a timing contract on a host with documented
        oversubscription, and a prior correction in this repository corrected an
        unsourced load-average triple, which is why the source binding is
        mandatory.
    - id: CTRL-REPRODUCTION-GATE
      description: >-
        Re-run the committed j = 0 versus generic pair AT p = 1009, where the
        committed pair was measured, and confirm the SIGN and ORDER OF MAGNITUDE
        of the recorded -0.44 percent timing and +1.02 percent basis-size ratios,
        and separately the j = 1728 pair's -0.67 and +3.41 percent.
      failure_meaning: >-
        If the committed pair does not reproduce, the timing instrument has
        drifted and NO comparison in this contract is admissible.
    - id: CTRL-MONOMIAL-ORDER
      description: >-
        Two monomial orders are run. A cost conclusion that flips with the order
        is a conclusion about the order, and is reported as such.
      failure_meaning: >-
        An order-dependent conclusion presented as an algebraic one would be a
        scope error.
    - id: CTRL-NULLC-EXCLUDED
      description: >-
        The campaign's between-class mean detector is EXPLICITLY NOT USED, and the
        run package must state so. It is a between-class detector by its own
        committed characterisation and this design has no classes in it at all.
      failure_meaning: >-
        Applying a between-class detector to a design with no classes would
        produce a number with no referent.
  independent_variables:
    - 'arm, in {ARM-G generic, ARM-S sham, ARM-X special}'
    - 'degeneration locus / deleted coefficient block, with the block size recorded per cell'
    - 'generic curve identity, at least 5 per cell'
    - 'factor-base density, at least 3 values bracketing 1/m!'
    - 'monomial order, 2 values'
    - 'formulation, in {membership-free, membership-bearing}'
    - 'decomposition length m, in {3, 4 where memory permits}'
  metrics:
    primary:
      - >-
        Groebner solve time per arm per seed, in nanoseconds, reported as a FULL
        DISTRIBUTION and never as a point estimate, with the paired ratio
        sham-over-generic and special-over-generic and their 95 percent paired
        confidence intervals.
      - >-
        basis size per arm per seed, a count of basis elements, with the paired
        ratio and its interval.
      - >-
        ideal dimension (integer) and ideal degree (integer) per arm per cell,
        exact.
      - >-
        the maximum-degree PROXY per arm, reported under its true name as a proxy
        and explicitly NOT as a degree of regularity.
      - >-
        sensitivity detection probability at each of the four planted effect
        sizes, dimensionless.
      - >-
        the achieved MINIMUM DETECTABLE EFFECT from the pilot arm, as a percent
        of mean solve time - the quantity the campaign has never established for
        any Groebner comparison.
    secondary:
      - 'host load average before and after each run, from a bound source, with the source named.'
      - 'dropped-cell count and reasons, per deletion size.'
      - 'block size (number of deleted monomials) per cell, to demonstrate the null is non-degenerate.'
      - 'the reproduction-gate ratios at p = 1009 beside the committed figures.'
      - 'per-arm per-seed peak memory, and the m = 4 memory ceiling actually reached.'
      - 'target sampler used per arm.'
  heuristic_under_test: HEUR-SHAM-2
  preregistered_prediction:
    quantity: >-
      The paired ratios of Groebner solve time and basis size between the three
      arms.
    formula: >-
      No formula. PRE-REGISTERED READING, FIXED BEFORE THE DATA EXISTS:
      OUTCOME A - ARM-S indistinguishable from ARM-X and both differ from ARM-G:
      the effect is PURELY COMBINATORIAL, support is the whole story, and the
      curve-free reading binds.
      OUTCOME B - ARM-S indistinguishable from ARM-G and both differ from ARM-X:
      a COEFFICIENT-VALUE effect exists that support cannot explain.
      OUTCOME C (PREDICTED) - all three indistinguishable within the stated
      detectable effect: there is no cost effect of either kind, and the committed
      pair is confirmed with a control for the first time.
      OUTCOME D - ARM-S differs from BOTH: the sham is not a valid null and the
      run is INVALID, not informative.
    source: >-
      IDEA-20260811-18bbf9's three-way reading, adopted unchanged, with OUTCOME D
      retained as an invalidation branch rather than a result.
  scale_relevance:
    tier: toy
    justification: >-
      p = 1009 for the reproduction gate and p = 4001 for the main arms, m = 3
      primarily. NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY: whether
      special-j support affects solve cost at cryptographic p cannot be tested by
      this design or by any reachable extension of it, because the solve itself
      is the bottleneck. The contract measures at the two stated primes and
      asserts nothing beyond them; it does not shrink the claim to something
      measurable and then present it as the original question.
    correspondence: null
  tail_checks:
    - >-
      The single cell with the largest absolute paired ratio deviation from 1.000
      in each arm is reported individually with its curve, locus, density, order
      and formulation, so a near-miss on the band is visible even when the
      pre-registered criterion is met overall.
    - >-
      The distribution's upper tail per arm - the slowest 5 percent of seeds - is
      reported separately, since a mean can hide a heavy tail in a timing
      measurement.
    - >-
      The dropped cells at the largest deletion size are reported individually
      with their dimension and degree, since heavy dropping there is the expected
      failure mode of the sham construction.
  replication:
    seeds:
      - 'RUN-ECDLP-092f48-1 (CTRL-PILOT-MDE: 40 repetitions of one identical input, power measurement): master seed 20260904131'
      - 'RUN-ECDLP-092f48-2 (CTRL-REPRODUCTION-GATE at p = 1009, both committed pairs): master seed 20260904132'
      - 'RUN-ECDLP-092f48-3 (CTRL-SENSITIVITY-LADDER at four planted effect sizes): master seed 20260904133'
      - 'RUN-ECDLP-092f48-4 (main paired three-arm design, m = 3, order 1, both formulations): master seed 20260904134'
      - 'RUN-ECDLP-092f48-5 (main paired three-arm design, m = 3, order 2, both formulations): master seed 20260904135'
      - 'RUN-ECDLP-092f48-6 (m = 4 arms on the two largest blocks, memory permitting): master seed 20260904136'
    independent_instances: 20
    replication_note: >-
      SEEDS POLICY, AND IT IS LOAD-BEARING HERE BECAUSE THE DESIGN IS PAIRED.
      Each run declares one master seed; the driver derives every per-seed value
      from it and records the derivation rule and all derived seeds in the
      manifest. ARM-G, ARM-S and ARM-X at seed index i within a cell see the SAME
      derived seed, the same factor base, the same targets and the same order, so
      the three are directly comparable per seed and the ratios are paired rather
      than pooled. `independent_instances: 20` is the per-cell seed floor stated
      in H-ECDLP-f9aa58; the pilot arm additionally uses 40 repetitions of one
      input. No seed may change after a run. If the pilot arm forces the band to
      widen, that widening is a versioned protocol_amendment recorded BEFORE
      RUN-4, never an edit to this file and never an adjustment afterwards.
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 24
    maximum_memory_gb: 16
    maximum_runs: 6
    maximum_workers: 1
    budget_feasibility_note: >-
      Sized to the WORK and above the template floors. The main runs cover, per
      run, at least 5 generic curves times at least 2 loci times at least 3
      densities times 3 arms times 20 seeds times 2 formulations, each a Groebner
      solve at p = 4001, plus per-cell dimension and degree computations by
      staircase. `maximum_workers: 1` is declared deliberately: this is a TIMING
      contract on a host with documented oversubscription, so the run must not
      create descendants that would contend for cores and corrupt the very
      measurement being taken. If m = 4 arms exceed the 16 GB cap they are
      dropped and the drop is reported, never traded against the timing gate.
  stopping_rules:
    - >-
      ST-0 LOAD GATE, BLOCKING AND FIRST. Host load is read from the bound source
      before every run. Above the declared threshold the run does not start; if it
      rises above the threshold during a run, the run STOPS and its partial output
      is an INFRASTRUCTURE RECEIPT, never a null.
    - >-
      ST-1 ORDER OF RUNS, BLOCKING. RUN-1 (pilot power) and RUN-2 (reproduction
      gate) and RUN-3 (sensitivity ladder) all complete and pass BEFORE RUN-4
      starts. No main-arm result may be read if any of the three has not passed.
    - >-
      ST-2 PER-RUN CAP. 3600 seconds and 16 GB per run; on approaching the cap
      the run STOPS and names every cell not reached, with its reason.
    - >-
      ST-3 STOP AND REPORT ON AMBIGUITY. If a degeneration block, a density, a
      formulation or the target sampler cannot be resolved unambiguously from this
      contract, the Executor STOPS AND REPORTS rather than choosing.
    - >-
      ST-4 NO INTERPRETATION. Observations only. The run package must not state
      which outcome fired, must not write an evidence or decision record, and
      must not touch any hypothesis status.
    - >-
      ST-5 NO CORRECTNESS STATISTIC ON THE SHAM. The driver must not compute a
      decomposition rate, a relation rate, or any correctness statistic on ARM-S.
      ARM-S solves no ECDLP instance and its solutions are not decompositions;
      only its COST is comparable.
  invalidation_rules:
    - >-
      INV-SENSITIVITY. CTRL-SENSITIVITY-LADDER fails to detect the largest
      planted effect: the instrument is blind, the run is INVALID and NO null may
      be reported.
    - >-
      INV-REPRODUCTION. CTRL-REPRODUCTION-GATE does not reproduce the committed
      pair's sign and order of magnitude at p = 1009: the instrument has drifted
      and the whole comparison is inadmissible.
    - >-
      INV-DIMENSION. A cell whose ideal dimension or degree differs across arms
      is DROPPED and counted; if most cells at a deletion size are dropped, those
      arms are dropped entirely.
    - >-
      INV-LOAD. Host load above the declared threshold at any point in a run: the
      run is an infrastructure receipt, never a result (AGENTS.md rule 5).
    - >-
      INV-BAND-AFTER-DATA. Any band widened AFTER a main-arm measurement exists:
      INVALID. Widening is permitted only between the pilot arm and RUN-4 and only
      as a recorded versioned amendment.
    - >-
      INV-SAMPLER. Any arm using the disputed subgroup-only target sampler:
      INVALID for that arm, because the two halves would measure different
      estimands.
    - >-
      INV-INFRASTRUCTURE. A timeout, crash, resource exhaustion or engine failure
      is recorded with its terminal status and IS INFRASTRUCTURE SIGNAL, NEVER
      negative evidence about H-ECDLP-f9aa58 or HEUR-SHAM-1 or HEUR-SHAM-2.
  success_criterion: >-
    S1. CTRL-PILOT-MDE reports an achieved MDE at or below the band actually used;
    CTRL-REPRODUCTION-GATE reproduces the committed pair at p = 1009;
    CTRL-SENSITIVITY-LADDER is monotone and reaches 1.0 at the largest planted
    size; every reported cell passes CTRL-DIMENSION-ADMISSIBILITY; host load stays
    below threshold throughout; and the paired ratios for both sham-over-generic
    and special-over-generic have 95 percent confidence intervals containing
    1.000 within their declared bands, in both formulations and both orders. S1
    MET IS OUTCOME C: no cost effect of either kind at the tested parameters, the
    committed pair confirmed WITH A CONTROL for the first time, and a stated
    minimum detectable effect attached. S1 MET IS A BOUND AT THE STATED
    DETECTABLE EFFECT, NEVER AN ABSENCE, and it licenses no statement about
    cryptographic scale.
  falsification_criterion: >-
    F1 (OUTCOME A). ARM-S and ARM-X agree with each other and both differ from
    ARM-G beyond the band. Support is the whole story. NOTE THE SCOPE CONSEQUENCE,
    DECLARED IN ADVANCE: ARM-S is not a curve, so an effect reproduced by ARM-S is
    reproduced by a curve-free object and NOTHING may be quoted as a statement
    about elliptic curves or the ECDLP. F2 (OUTCOME B). ARM-S agrees with ARM-G
    and ARM-X differs beyond the band. A coefficient-value effect exists that
    support cannot explain, and it escalates to independent review. F3 (OUTCOME
    D, VOIDING RATHER THAN FALSIFYING). ARM-S differs from both: the sham is not a
    valid null, most likely because the deletion changed the ideal's dimension or
    degree; INVALID. F4, VOIDING: any invalidation rule fires, in particular a
    blind sensitivity ladder, a failed reproduction gate, or a load excursion. F5,
    BINDING UNDER EVERY OUTCOME: no correctness statistic computed on ARM-S may be
    reported, and no result here may be presented as an attack, a speedup, or a
    weakening of ECDLP security.
  required_artifacts:
    - experiments/EXP-ECDLP-092f48/driver/build_arms.py
    - experiments/EXP-ECDLP-092f48/driver/paired_solve.py
    - experiments/EXP-ECDLP-092f48/driver/host_load.py
    - experiments/EXP-ECDLP-092f48/results/forced_values.yaml
    - experiments/EXP-ECDLP-092f48/results/pilot_mde.json
    - experiments/EXP-ECDLP-092f48/results/reproduction_gate.json
    - experiments/EXP-ECDLP-092f48/results/sensitivity_ladder.json
    - experiments/EXP-ECDLP-092f48/results/membership_free_table.json
    - experiments/EXP-ECDLP-092f48/results/membership_bearing_table.json
    - experiments/EXP-ECDLP-092f48/results/dropped_cells.json
    - experiments/EXP-ECDLP-092f48/results/host_load_log.json
    - experiments/EXP-ECDLP-092f48/results/summary.json
    - experiments/EXP-ECDLP-092f48/results/seed_env_manifest.yaml
    - experiments/EXP-ECDLP-092f48/runs/RUN-ECDLP-092f48-1/manifest.yaml
    - experiments/EXP-ECDLP-092f48/runs/RUN-ECDLP-092f48-1/results.json
    - experiments/EXP-ECDLP-092f48/runs/RUN-ECDLP-092f48-1/stdout.log
    - experiments/EXP-ECDLP-092f48/runs/RUN-ECDLP-092f48-2/manifest.yaml
    - experiments/EXP-ECDLP-092f48/runs/RUN-ECDLP-092f48-2/results.json
    - experiments/EXP-ECDLP-092f48/runs/RUN-ECDLP-092f48-2/stdout.log
    - experiments/EXP-ECDLP-092f48/runs/RUN-ECDLP-092f48-3/manifest.yaml
    - experiments/EXP-ECDLP-092f48/runs/RUN-ECDLP-092f48-3/results.json
    - experiments/EXP-ECDLP-092f48/runs/RUN-ECDLP-092f48-3/stdout.log
    - experiments/EXP-ECDLP-092f48/runs/RUN-ECDLP-092f48-4/manifest.yaml
    - experiments/EXP-ECDLP-092f48/runs/RUN-ECDLP-092f48-4/results.json
    - experiments/EXP-ECDLP-092f48/runs/RUN-ECDLP-092f48-4/stdout.log
    - experiments/EXP-ECDLP-092f48/runs/RUN-ECDLP-092f48-5/manifest.yaml
    - experiments/EXP-ECDLP-092f48/runs/RUN-ECDLP-092f48-5/results.json
    - experiments/EXP-ECDLP-092f48/runs/RUN-ECDLP-092f48-5/stdout.log
    - experiments/EXP-ECDLP-092f48/runs/RUN-ECDLP-092f48-6/manifest.yaml
    - experiments/EXP-ECDLP-092f48/runs/RUN-ECDLP-092f48-6/results.json
    - experiments/EXP-ECDLP-092f48/runs/RUN-ECDLP-092f48-6/stdout.log
  required_artifacts_note: >-
    results/forced_values.yaml is written before any main-arm measurement and
    holds the four planted effect sizes with their predicted detection
    probabilities, the declared bands, and the block size per cell.
    results/pilot_mde.json holds the measured coefficient of variation and the
    achieved minimum detectable effect, and any band widening it forces is
    recorded as a versioned amendment BEFORE RUN-4. results/host_load_log.json
    records the bound source, the threshold, and the load before and after every
    run. Per-seed timing distributions live inside each run's results.json; no
    point estimate is reported without its distribution.
  run_plan:
    - id: RUN-ECDLP-092f48-1
      description: 'CTRL-PILOT-MDE: 40 repetitions of one identical input; measure the coefficient of variation and the achieved MDE; widen the band by amendment if required'
    - id: RUN-ECDLP-092f48-2
      description: 'CTRL-REPRODUCTION-GATE at p = 1009: reproduce both committed j = 0 and j = 1728 versus generic pairs'
    - id: RUN-ECDLP-092f48-3
      description: 'CTRL-SENSITIVITY-LADDER: four planted cost differences of approximately 1, 3, 10 and 30 percent, detection probability per level'
    - id: RUN-ECDLP-092f48-4
      description: 'main paired three-arm design at p = 4001, m = 3, monomial order 1, both formulations, all densities and curves'
    - id: RUN-ECDLP-092f48-5
      description: 'main paired three-arm design, monomial order 2, otherwise identical to RUN-4 (CTRL-MONOMIAL-ORDER)'
    - id: RUN-ECDLP-092f48-6
      description: 'm = 4 arms on the two largest blocks, memory permitting; dropped and reported if the 16 GB cap is reached'
  provenance:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    independent_session: false
    independent_review_status: 'NOT YET REQUESTED. Contract is at `draft`.'
    design_session_verification_note: >-
      The Coordinator subagent that wrote this contract located and read the
      committed j = 0 and j = 1728 timing lines VERBATIM in
      coordination/goals/GOAL-ENDO-001/batches/BATCH-cb71b5/reviews/red-team/
      red_team_notes.md on 2026-09-04, confirming every figure the source
      proposal cites, AND establishing that the pair comes from a p = 1009 run -
      which the proposal does not state and which is why the reproduction gate
      here is set at p = 1009 rather than the proposal's p = 4001. It confirmed
      by glob that NO ledger/goals/GOAL-ENDO-001.yaml exists. It did NOT open the
      host-load decision record, the harness source carrying the degree-proxy
      annotation, the target-sampler source, the disputed hypothesis, or the
      committed run's raw results; every claim about those is scheduled for
      verification at run time, not asserted here.
  source_refs:
    - ledger/hypotheses/H-ECDLP-f9aa58.yaml
    - ledger/proposals/IDEA-20260811-18bbf9.yaml
    - coordination/goals/GOAL-ENDO-001/batches/BATCH-cb71b5/reviews/red-team/red_team_notes.md
    - ledger/questions/RQ-JINV-8fc13a.yaml
    - docs/claims-and-verification.md
    - docs/inventor-protocol.md
  assigned_to: executor
  approved_by: null
