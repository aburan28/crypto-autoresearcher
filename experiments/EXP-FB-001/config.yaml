experiment_id: EXP-FB-001
status: contract_not_run
claim_tier: toy
research_lane: factor_base_lab

hypothesis: >-
  Structured x-coordinate factor bases may produce a reproducible Pareto
  improvement over matched-cardinality random controls in true decomposition
  yield and/or Semaev-system solve cost. Any positive result remains model-bound
  until rank, target descent, and end-to-end cost gates pass.

curves:
  field_bits: [20, 24, 28, 32]
  smoke_seeds_per_size: 3
  evidence_seeds_per_size: 20
  target_source: deterministic_independent_multiples
  targets_per_curve: 100

factor_bases:
  scopes:
    - full_curve
    - target_subgroup
  required_families:
    - interval
    - qr_window
    - multiplicative_subgroup_or_coset
    - sparse_polynomial_predicate
    - random_matched
  optional_families:
    - centered_interval
    - polynomial_image
    - bit_window
  requested_sizes:
    - sqrt_scale_quarter
    - sqrt_scale_half
    - sqrt_scale_one
  require_realized_size_match: true

controls:
  matched_random: true
  affine_relocations_per_winner: 16
  held_out_curves: true
  fresh_targets: true
  target_blinding: true
  charge_preprocessing: true

decomposition:
  lengths: [2, 3]
  exact_ground_truth:
    m2: ec_group_two_sum
    m3: bounded_mitm
  sign_handling: both_lifts
  count_only_verified_ec_relations: true

semaev:
  baseline_module: harness.semaev
  m2_path: measure_s3_decomposition
  initial_solver: sympy_groebner
  solver_order: grevlex
  label_basis_max_degree_as_proxy: true
  record:
    - polynomial_count
    - variable_count
    - input_max_degree
    - monomial_count
    - groebner_seconds
    - groebner_basis_size
    - groebner_basis_max_degree
    - peak_rss_mb
    - timeout

relation_gate:
  enabled: true
  record:
    - relations_seen
    - unique_relations
    - row_weight
    - marginal_rank_gain
    - matrix_rank
    - matrix_columns

blind_descent_gate:
  enabled: true
  freeze_factor_base: true
  freeze_solver_settings: true
  freeze_preprocessing: true
  held_out_targets: true
  charge_all_online_work: true

baselines:
  - matched_random_factor_base
  - harness_semaev_seeded_factor_base
  - pollard_rho
  - bsgs_or_mitm_when_applicable
  - existing_groebner_instrumentation

selection:
  strategy: pareto
  maximize:
    - decomposition_yield
    - verified_relations_per_second
    - independent_relations_per_second
  minimize:
    - solver_seconds
    - peak_memory
    - realized_factor_base_size
    - blind_descent_cost
  strongest_anomaly: higher_yield_and_lower_solver_cost_at_matched_size

promotion_gates:
  - matched_cardinality_random_control
  - affine_or_placement_control
  - held_out_curve_control
  - exact_point_relation_verification
  - marginal_rank_control
  - blind_target_descent
  - preprocessing_charged
  - three_size_minimum_scaling_sweep
  - rho_bsgs_mitm_comparison
  - independent_red_team

followups:
  - EXP-FB-002
  - EXP-FB-003
  - EXP-FB-004
  - EXP-FB-005
  - EXP-FB-006
