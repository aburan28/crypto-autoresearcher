# EXP-ECDLP-f33d1f
# Digit-count arithmetic. No curve point is added.
# Approved by DEC-20261004-51b798.
experiment:
  id: EXP-ECDLP-f33d1f
  hypothesis_id: H-ECDLP-b9be3e
  source_idea: IDEA-20261004-0af424
  question_id: RQ-ECDLP-002
  version: 1
  title: Doubling count and addition count of the integer 511
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-51b798
  objective: >-
    Check the counts 9, 8, and 8, the product 576, and the nearby gap 0.
  inputs:
    bit_length: 9
    doublings: 8
    additions: 8
    length_gap: 1
    doubling_gap: 0
    digit_product: 576
    digit_sum: 25
    nearby_a: 8
    nearby_b: 8
    nearby_gap: 0
    nearby_product: 64
  controls:
    - >-
      The bit length is 9. The doubling count is 8. The addition
      count is 8. Reporting the addition count as 9 drops the gap
      against the bit length and invalidates the run.
    - >-
      Nine exceeds eight by 1. Eight equals eight, so that gap is 0.
      The product of 9, 8, and 8 is 576. Their sum is 25.
    - >-
      Two readings of the addition count are both 8. Their gap is
      0 and their product is 64.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {bits, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - additions
      - implementations_agree
    secondary:
      - digit_product
      - digit_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The integer 511 has bit length 9, 8 doublings, and 8
      additions. The gap of two addition counts is 0.
    formula: >-
      Read the bit length 9. Count 8 doublings. Count 8 additions.
      Multiply 9, 8, and 8. Subtract 8 from 8.
    source: >-
      IDEA-20261004-0af424 states the counts 9, 8, and 8, read
      2026-10-04. The gaps, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 576 and the nearby gap 0 are required. A check that stops at the bit length 9 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the addition count 8 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 9.
    - The doubling count is not 8.
    - The addition count is not 8.
    - The product is not 576.
    - The addition count is reported as 9, or a curve point is added.
  success_criterion: >-
    Both runs agree that the bit length is 9, that the doubling
    count is 8, that the addition count is 8, and that the product
    of those three counts is 576.
  falsification_criterion: >-
    The runs agree that the addition count is computed, and that
    count is not 8.
  required_artifacts:
    - experiments/EXP-ECDLP-f33d1f/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-f33d1f/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-f33d1f/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-f33d1f/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-f33d1f/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-f33d1f/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a digit-count gap moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
