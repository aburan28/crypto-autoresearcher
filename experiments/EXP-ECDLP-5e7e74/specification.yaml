experiment:
  id: EXP-ECDLP-5e7e74
  hypothesis_id: H-ECDLP-7cd883
  proposal_id: IDEA-20260909-4c5ee9
  question_id: RQ-ECDLP-002
  goal_ids:
  - GOAL-ECDLP-001
  - GOAL-ICEX-001
  version: 1
  title: 'Prym S: paired companion-selector ablation'
  designed_at: '2026-10-19'
  status: review_required
  objective: Test the exact prospective PO003 auxiliary-sum histogram selector against an identical generator and
    compatible current IC pipeline; separate finite candidate informativeness, scoped useful-row cost, and full
    recovery cost.
  inputs:
    design_brief: research/prym_experiment_design_20261019/brief.md
    prior_intake: research/prym_relation_followup_20261019/README.md
    problem: problems/prym-assisted-source-labelled-router.md
    proposal: ledger/proposals/IDEA-20260909-4c5ee9.yaml
    archive_task_id: TASK-20261019-84755b
    depends_on:
    - 'EXP-ECDLP-ad0ffe: source correctness, no leakage, canonical rank and constructor bytes independently verified'
    baseline: 'Two named comparisons: (i) exact same PO003 generator with identity selector, a finite engineering
      diagnostic; (ii) the current independently verified compatible IC pipeline for any programme-success claim.
      Bind source hashes, protocol and artifacts before approval; historical PO003 recovery is calibration only.
      If current IC cannot expose this interface, record compatibility gap. Do not equate a gain over a historical
      rank-deficient variant with a current IC gain.'
    holdout_panel: Eight fresh W fixtures only if W validation passes, each with three paired seeds [0,1,2]; these
      are a fixed finite diagnostic panel, not an independent test of the final E-stage population. Never use them
      to tune a selector and then call their measurements holdout.
    candidate_stream: For each of eight admitted fresh W fixtures and seeds [0,1,2], freeze 2^16 distinct canonical
      train candidates and 2^16 distinct canonical holdout candidates under the exact PO003 tuple stream. Hash complete
      descriptors before acceptance inspection. Alias or finite-support exhaustion is inconclusive, never permission
      to replace a curve or shrink samples after looking at outcomes.
    freeze_before_trials:
    - exact candidate generator and descriptor law
    - all base points/norm columns and target/challenge identity
    - selector source/dependencies/model bytes, parameters and public feature builder
    - baseline cost weights, operation instrumentation and recovery-neutral rank quota
    - permutation and split-product label construction, seed domains and allowed advice
    selector_status: Explicit prospective component exists at research/prym_experiment_design_20261019/companion_selector.py.
      It is not integrated with the PO003 generator, canonicalizer, baseline, metering or execution launcher; no
      scientific trial has run.
  controls:
  - 'C-S-aa: two identity-selector arms consume identical descriptors and base; vary only run-order nuisance (AB
    then BA by seed) and compare canonical rank/operation vectors.'
  - 'C-S-selector: baseline identity versus frozen real companion selector; fixed candidate stream/base/rank quota/memory/target/work
    units.'
  - 'C-S-permuted: real versus permuted training-acceptance labels with identical public features, selector code,
    sample sizes and charged generation.'
  - 'C-S-split: real geometric companion versus matched-dimension split-product companion with independent auxiliary
    points/labels and transported source points. Cancellation without informative source routing must not be read
    as advantage.'
  - 'C-S-coordinate: source coordinate-isomorphism arm transports the exact factor base and labels; it does not
    reselect an easier base.'
  - 'C-S-recall: fixed-pool truth census detects false rejects and branch-dependent rank loss; census truth is withheld
    from the attack.'
  independent_variables:
  - 'selector information: identity/real/permuted/split product'
  - fixture and seed
  metrics:
    primary:
    - charged relation-stage work to canonical rank U in C-S-selector, with all costs and same quota (S-stage units
      from the frozen current baseline)
    - all-attempt useful-row rate, final canonical rank, and rank gained per operation vector
    - fixed-pool precision and recall against independent full census; label/selector acquisition cost reported
      separately
    secondary:
    - difference real/permuted/split product at matched recall and full charged stage cost
    - cold-start and declared-target amortized costs; no end-to-end speedup label
    - peak RSS bytes/live state, rejected descriptors and false negatives
    - A/A canonical equality and operation ratio; wall time/CPU diagnostic only
  replication:
    seeds:
    - 0
    - 1
    - 2
    independent_instances: 8
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: null
    maximum_workers: 1
  stopping_rules:
  - Exactly 65536 distinct training and 65536 distinct holdout candidates per instance/seed. Cost pipelines stop
    at U or the holdout end; no extend-until-success, changed selector or replenished stream. Archive finite-domain/support
    exhaustion as inconclusive.
  - Freeze model and training/permutation/canonicalization before holdout. Never tune on holdout census. Any changed
    feature or selector needs a new frozen holdout and amendment.
  - Any failed A/A, source-witness, leakage or rank-control gate withholds dependent benefit/attribution labels.
  invalidation_rules:
  - Selector accesses census truth, target secret, future expensive-stage output, or a feature with uncharged acquisition.
  - Different descriptors/base, rank target, memory allowance, timeout/censoring or baseline cost scope across arms.
  - Reports census precision/recall as end-to-end S improvement, or treats seeds as independent curves.
  - Current baseline evidence is absent, historical-only or not compatible with this same-pipeline ablation.
  success_criterion: 'P-S-stage/C-S-selector: after exact C-S-aa and W control release, all frozen paired pipelines
    reach U, every fresh curve mean and total stage work improve under the defined accounting. P-S-specific/C-S-permuted
    and C-S-split additionally isolate genuine companion dependence. This is a measured relation-stage gain only;
    complete S success requires E.'
  falsification_criterion: 'P-S-stage/C-S-selector: real selector fails rank U, loses useful rows without compensating
    charged work, or does not improve the fixed-panel stage cost after all acquisition costs. P-S-specific/C-S-permuted
    or C-S-split: matching control gains remove Prym-specific attribution; they do not erase a valid generic engineering
    improvement. Gate failure is instrument invalidity.'
  required_artifacts:
  - 'manifest.json: exact command, clean committed revision, protocol/input/dependency hashes, hardware, field encoding,
    curve UID, subgroup and factor-base UIDs, policy/model provenance, timestamps and process-group resources'
  - stdout.txt and stderr.txt; immutable raw-result.json and per-attempt event stream, including rejects/duplicates/errors
  - verification.json from an independently implemented checker, with every failed check retained
  - report.md, graph.svg plus source, and inspected report.pdf; source-linked limits and no promoted claim without
    review
  - canonical-orbits.jsonl, split-assignment.jsonl and full attempted-enumeration trace including alias/exception
    rejects
  - training.jsonl, sealed-holdout-census.jsonl, frozen-selector-model.json and null-permutation.json with digests
  assigned_to: executor-implementation
  approved_by: null
  approval_blockers:
  - Selector arithmetic/model component exists, but integrated PO003 tuple generator, geometric-alias canonicalizer,
    exceptional-divisor row checker and public-source leakage audit are not implemented/bound.
  - No exact current independently verified compatible IC baseline/protocol/cost model is bound; PO003 cannot substitute.
  - W source/rank/leakage gates, immutable candidate streams, fresh fixture identities and permutation/split-product
    labels are not archived.
  - Full census and paired-pipeline launchers, cost instrumentation, independent checker, native plan/runbook/handoff/archive
    and approvable=true admission are missing.
  execution_authority: None. Exact prospective bytes must pass native experiment_preapproval approvable=true; committed
    approval/archive and newest_experiments execution_state=ready precede the run skill. No retrospective approval.
  cost_accounting:
    complete_work: Retain a vector of raw field operations by field, elliptic/Jacobian additions and multiplications,
      polynomial arithmetic/factorization, comparisons/hash operations, matrix operations and bytes moved. Do not
      add unlike units without a frozen weight model. S is the current matched baseline protocol's complete weighted
      operation count, with its weights bound before approval. Wall time and CPU are secondary diagnostics.
    charge:
    - public instance/cover search including rejected candidates
    - map construction, normalization, factor-base generation, advice/training and tuning
    - all candidate generation, failed lifts, branch enumeration and rejected tuples
    - companion labels, selector evaluation, row normalization, witness/source checks and independent-rank maintenance
    - linear algebra, target descent, recovery, and final source verification
    accounting_scope: Both cold-start and genuinely amortized totals; no free offline table, oracle, secret witness
      or uncharged rejected stream. Reference/checker work is reported separately and cannot be supplied to the
      attack.
    memory: Record peak process-group RSS bytes plus peak live algebraic words/table entries and serialized advice
      bytes. A 2 GiB guard protects headroom; any guard stop is censored infrastructure, not a complete successful
      solve.
  interpretation_limits:
  - 'Design only: no scientific run, measured gain, new asymptotic exponent, novelty certificate or security conclusion.'
  - The unsourced historical 32-cover quotation is not an input catalog; no identification or completeness claim
    is made.
  - P1546 remains a scoped fixed-branch counting gate; this design does not execute or reopen the IDEA-002 frozen
    contract.
  - A cover, Frobenius overlap, auxiliary cancellation or faster known-scalar multiplication alone does not solve
    ECDLP.
  - Missing code, access, admission or verification is an implementation/infrastructure impediment, not mathematical
    falsification.
  - Historical PO003 direct variant was rank-deficient; repaired variants recovered at unfavorable cost. A better
    FB-hit rate does not repair rank or demonstrate current IC improvement.
  - The delegated draft producer stopped before returning a complete revision; the parent Coordinator completed
    and validated this prospective design. This is not an independent science review.
  decision_impact:
    on_positive: Freeze the exact qualifying selector and complete pipeline for fresh blind E-stage instances; report
      stage scope only. A generic improvement may proceed with its accurate engineering attribution.
    on_negative: Record exact selector false negatives/label overhead/unchanged rank bottleneck; require a different
      cheap public feature or constructor before repeating.
    on_inconclusive: Resolve generator/canonicalizer/current-baseline interface or control failure and finite-support
      limitations. Neither a standalone component nor candidate informativeness is measured recovery benefit.
  preregistered_predictions:
  - id: P-S-stage
    quantity: Paired charged relation-stage work
    prediction: An informative cheap selector retains enough independent rank and costs less to rank U than identity
      after charging all labels/rejects/preparation; no minimum effect or guaranteed power is assumed.
  - id: P-S-specific
    quantity: Dependence on actual companion information
    prediction: A Prym-specific benefit also survives real versus permuted/split controls; equal gains in those
      controls indicate a generic selector effect.
  scale_relevance:
    tier: toy
    justification: Finite implementation/algorithm experiments; no transfer to secp256k1 or P-256.
    correspondence: null
  selector_api:
    prepare: prepare(public_curve_cover, frozen_base, public_candidate_schema, seed)->public_state with charged
      construction/advice bytes
    label: label(public_candidate, public_state)->companion_features, charging all arithmetic; no unknown source/target
      scalar or future success bit
    select: select(public_candidate, companion_features, public_state)->KEEP|REJECT plus deterministic reason; any
      state update/training is specified and frozen
    acceptance_boundary: The selector runs before the baseline expensive operation it proposes to skip. Its features
      may not call that operation, a target-log oracle, full row checker or future result without charging it.
    permutation_control: In training order permute acceptance labels using a frozen SHA256 sort permutation of candidate
      IDs with domain prym-S-null and seed, retaining counts and all training effort. Fit same model rule. Do not
      permute holdout outcomes or tune the permutation. Bind exact permutation bytes before execution.
    identity_control: Always KEEP; no labels or secret access. Its wrapper overhead is measured/charged equally
      when comparing two identity arms.
  two_phase_protocol:
    phase_0_training: Generate, canonicalize and check 65536 distinct training candidates; train the exact real
      and shuffled-label models, charge all preprocessing and model generation, then freeze model hashes.
    phase_1_fixed_pool: Isolated independent truth census over exactly 65536 fresh canonical holdout candidates.
      Exact finite-pool precision/recall and native projected rank profiles are diagnostic, not attack input or
      end-to-end advantage.
    phase_2_paired_pipeline: Replay identity, real and null selector arms from fresh process state on the identical
      holdout stream, stopping at canonical rank U or finite end. Charge actual generator work, train costs for
      cold-start candidate arm, label acquisition, filters, failed attempts, normalization and rank. Expensive work
      genuinely skipped is not charged as performed. Full-rank baseline repairs, such as an anchor or large-prime
      policy, remain byte-identical across arms.
    quota: U is actual distinct unknown columns after legitimate public anchors as in W. Rows or both-residual-FB
      acceptance alone are insufficient. If any arm fails U retain partial costs/rank; no cost-to-full-rank win.
      Informativeness can still be reported as finite diagnostic.
    amortization: Primary cold-start single target. A separate exact target count is required to amortize training;
      no unlimited-target extrapolation.
  statistics:
    unit: Curve/fixture is the unit; the three paired seeds are within-instance repeats and are never counted as
      24 independent curves. The panel is fixed/finite.
    summary: For each curve report all paired seed ratios and arithmetic mean cost per arm; also sum complete stage
      work over the fixed panel. No asymptotic fit or population confidence claim from this panel.
    aa_release: For identical descriptor/state inputs the canonical rows, rank and raw operation counts of identity
      A/A must match exactly. Run-order wall-time spread is reported but cannot establish a stage-work gain.
    decision_rule: A stage-gain gate requires all paired arms reach rank U and real selector cost be strictly lower
      than identity for every curve mean and for the panel total, exceeding any nonzero A/A count discrepancy (a
      count discrepancy instead invalidates instrument release). Genuine companion attribution additionally requires
      real outperform permuted and split controls under the same gate; otherwise classify any observed stage improvement
      as a generic selection/engineering effect.
    confidence_interval: Precision/recall on the fully censused fixed pools are exact finite-pool quantities, with
      no sampling CI. Independent instance-level confidence intervals and four-size multiplicity are reserved for
      E. This stage does not claim a statistical power guarantee.
  prediction_provenance:
  - prediction: P-S-stage
    first_recorded_in: experiments/EXP-ECDLP-5e7e74/specification.yaml
    written_at: '2026-10-19'
    data_seen:
    - path: inputs/refs/experiments/ecdlp_isogeny/po_transfer_003_result.md
      measured: Imported historical toy relation/rank/recovery/cost observations; read by parent intake, not replayed
        here.
    - path: research/prym_relation_followup_20261019/README.md
      measured: Earlier chat F43 point-count/Frobenius diagnostic was seen; it is not native run evidence.
    sample_status: out_of_sample
    overlap: No measurements on the future frozen holdout challenge set have been seen.
  - prediction: P-S-specific
    first_recorded_in: experiments/EXP-ECDLP-5e7e74/specification.yaml
    written_at: '2026-10-19'
    data_seen:
    - path: inputs/refs/experiments/ecdlp_isogeny/po_transfer_003_result.md
      measured: Imported historical toy relation/rank/recovery/cost observations; read by parent intake, not replayed
        here.
    - path: research/prym_relation_followup_20261019/README.md
      measured: Earlier chat F43 point-count/Frobenius diagnostic was seen; it is not native run evidence.
    sample_status: out_of_sample
    overlap: No measurements on the future frozen holdout challenge set have been seen.
  variable_ledger:
    independent:
    - name: selector_information
      levels:
      - identity
      - real
      - permuted
      - split-product
    factors:
    - name: candidate_stream
      treatment: fixed
      value: 65536 distinct canonical train + 65536 distinct canonical holdout descriptors per curve/seed
      how: Hash stream before selector/census access; same ordered prefixes in every arm.
    - name: source_base_rank_quota
      treatment: fixed
      value: canonical base and U from W
      how: Transport exact base; verify rank modulo the same r.
    - name: source_encoding
      treatment: fixed
      value: original/coordinate-isomorphic only in control
      how: Transport all source and base points.
    - name: run_order
      treatment: randomized
      value: AB/BA by fixed seed
      how: Only nuisance changed in identity A/A.
    - name: seed
      treatment: randomized
      value:
      - 0
      - 1
      - 2
      how: Pair all arms; retain within-curve grouping.
    - name: selector_bytes
      treatment: fixed
      value: companion_selector.py component supplied; integrated generator/canonicalizer and hashes still required
      how: Same code for real/permuted labels, no post-census tuning.
    - name: memory_and_parallelism
      treatment: fixed
      value: 2 GiB, one worker
      how: Same guards; no uncharged helper process.
    - name: weights_and_baseline
      treatment: fixed
      value: pending current verified protocol
      how: No conversion of raw units after data.
    - name: host_load
      treatment: measured
      value: manifest
      how: Wall time secondary only.
    comparisons:
    - id: C-S-selector
      arms:
      - identity
      - real
      differs_in:
      - selector_information
      design: one_factor
    - id: C-S-permuted
      arms:
      - real
      - permuted
      differs_in:
      - selector_information
      design: one_factor
    - id: C-S-split
      arms:
      - real
      - split-product
      differs_in:
      - selector_information
      design: one_factor
    - id: C-S-coordinate
      arms:
      - original
      - transported coordinates
      differs_in:
      - source_encoding
      design: one_factor
    - id: C-S-aa
      arms:
      - identity-A
      - identity-A2
      differs_in:
      - run_order
      design: aa
    crosses_map: true
  transfer_obligations:
  - map: Companion label construction without loss of source-labelled row semantics
    kind: other
    source: Public native relation candidate stream
    destination: Real/permuted/split-product companion feature stream and original E rows
    preserves:
    - same source subgroup, base, target and row-verification equation
    - no secret scalar access
    changes:
    - which expensive attempts are executed
    - label/preparation costs and rejected useful rows
    controls:
    - kind: identity_map
      comparison: C-S-aa
    - kind: matched_random
      comparison: C-S-split
    assessment: research/prym_experiment_design_20261019/protocol_summary.json
    assessment_key: transfer_assessments.S
  candidate_selector:
    family:
      C: y^2=x^6+A*x^2+B
      E1: Y^2=U^3+A*U+B
      E2: V^2=W^3+A*W^2+B^2
      pi2: (W,V)=(B/x^2,B*y/x^3)
    module: research/prym_experiment_design_20261019/companion_selector.py
    public_feature: 'Before residual quadratic solve, sum pi2 of the four interpolation points: one negative known-source
      lift and three signed frozen FB lifts. Bucket infinity separately; otherwise bucket (Legendre(W), floor(16*W/p))
      with canonical integer W.'
    exception_policy: Reject x=0/infinite interpolation inputs, repeated abscissae, degenerate interpolation, invalid
      points and exceptional leading terms under a frozen enumerator rule; charge every attempted candidate and
      exception. Never use the residual outcome to build this feature.
    identity_fields:
    - curve_uid
    - source_scalar
    - lambda
    - signed_fb_lift_ids
    canonicalization: Before hashing, normalize effective source coefficient lambda*a mod r (lambda=1 representative),
      sort signed FB lift IDs, and choose the lexicographically least full identity in the known simultaneous deck/hyperelliptic
      involution orbit. Include actual source/base lift choices in canonical IDs. Different encodings of one geometric
      event share one partition. Independent W checker tests these equivalences. This upstream canonicalizer is
      not implemented by candidate_digest.
    split: 'SHA256 of sorted-key compact canonical JSON identity: even last hex nibble train, odd holdout. Reject
      duplicates within a partition; no geometric alias may occur in both partitions.'
    training: Exactly 65536 distinct training candidates per curve/seed, determined without inspecting outcomes.
      Baseline checker acceptance means both residual E1 endpoints lie in exact frozen FB and the public source-labelled
      row verifies; do not use ground-truth logarithms. Calibration acceptance is not automatically independent
      rank.
    fit: For each nonempty bucket score (hits+1)/(attempts+2) as exact rational. Retain ceil(nonempty_bucket_count/4)
      highest scores, ties by canonical bucket string. Reject unseen bins. Store and hash model before reading holdout
      outcomes.
    holdout: Exactly 65536 distinct canonical holdout candidates per curve/seed. An isolated baseline census supplies
      evaluation truth only; attack never receives holdout truth. Run the paired full pipeline separately for actual
      charged cost.
    permutation: In training order permute acceptance labels using a frozen SHA256 sort permutation of candidate
      IDs with domain prym-S-null and seed, retaining counts and all training effort. Fit same model rule. Do not
      permute holdout outcomes or tune the permutation. Bind exact permutation bytes before execution.
    meaning: Tests one public feature as a fixed-generator engineering candidate; no argument presently predicts
      useful information or net saving. This stays inside fixed-branch scope and does not supply a compact P1546-escaping
      router.
  goal_id: GOAL-ECDLP-001
