# =============================================================================
# EXP-CERTBIN-3f06d1 -- REPLICATION (DEC-20260923-f25b97 NA-4; KN-OPEN-3c8f51
# resolution item 4) of the Stage-1 primary cell of EXP-CERTBIN-4e92d7 and of
# its "1 in R_4" rate, on further curves and a random V, under a v2 protocol
# that preregisters every Stage-1 review lesson (RC-2, RC-3, OBJ-3, OBJ-4,
# OBJ-6, OBJ-9, F-J2-1..4, F-J3-1, R-1).
#
# Replication is a precondition of any future closure of regime-A replay
# (DEC-20260923-f25b97 NA-6) and of any KN-FIND on Lemmas 1-3.
#
# ID PROVENANCE (disclosed): EXP-CERTBIN-3f06d1 and RUN-CERTBIN-6d92b5 minted
# WITHOUT A SHELL (random tokens, grep checked only). TASK-20260924-d3a90c runs
# allocate_id.py --check first.
#
# CLAIM TIER: toy. sota_delta zero; oracle A (per attempt) and parallel rho
# dominate. Not an ECDLP cost claim.
# =============================================================================
experiment:
  id: EXP-CERTBIN-3f06d1
  version: 1
  hypothesis_id: H-CERTBIN-a73f1c
  hypothesis_role: >-
    PRIMARY: replication of H-CERTBIN-a73f1c's Stage-1 claims (DR-1 direction,
    E2 falsified, C1/Proposition S) at new cells. H-CERTBIN-a73f1c is weakened
    and immutable; this contract edits nothing in it. Its evidence decision may
    move it only through a new Coordinator decision.
  secondary_hypothesis_ids: [H-CERTBIN-7c3a18, H-CERTBIN-5e71c9]
  secondary_hypothesis_note: >-
    H-CERTBIN-7c3a18 (full hull rank KR1, TS1R, P-C3) and H-CERTBIN-5e71c9 C2
    and C3 (the "1 in R_4" rate and the x(2E) modulation) are tested here too.
  question_id: RQ-CERTBIN-836ce2
  question_ids: [RQ-CERTBIN-836ce2, RQ-ICPERF-94c86e]
  proposal_id: IDEA-20260923-5d0b8e
  source_decision: DEC-20260923-f25b97 (NA-4)
  replicates: EXP-CERTBIN-4e92d7 / RUN-CERTBIN-3b7e05 (EV-CERTBIN-6c3e0a)
  run_id: RUN-CERTBIN-6d92b5
  goal_ids: []
  goal_ids_note: No goal head is edited. No batch queue exists for this lane.
  title: >-
    Replication of the regime-A Stage-1 cell (n = 17, m = 2, l = 9, D in
    {3, 4}) on a new h = 2 curve, a new h = 4 curve and a random 9-dimensional
    V on the Stage-1 curve: strict-trace instability, the replay-form rank law
    on the target hull, restated hazard heuristic TS1R, and the degree-4
    Macaulay refutation rate with its x(2E) split.
  status: approved
  frozen: true
  execution_authorized: true
  execution_authorized_note: In fact only after TASK-20260924-d3a90c verifies; until then TASK-20260924-9f15a2 may not launch.
  assigned_to: executor
  approved_by: coordinator
  approved_at: '2026-09-24'
  approval_decision: DEC-20260924-8e2f47
  approval_basis: >-
    Standing user authorization (AGENTS.md, 2026-09-06) and the user's
    explicit approval of NA-4 on 2026-09-24. The readiness finding is
    DEC-20260924-8e2f47's. Approval asserts nothing about any hypothesis.

  objective: >-
    Decide whether the Stage-1 findings are properties of the (n = 17, m = 2,
    l = 9) regime-A family or of one curve and one V: (1) the DR-1 direction
    (T_strict unsat retention < 0.5 for every unsat and modal reference); (2)
    the exact obstruction K_rank on the hull = dim W (fixed-schedule survival
    set a single point); (3) TS1R on distinct hull-rank-increasing pivots;
    (4) the degree-4 Macaulay refutation rate on unsat subgroup targets
    against Stage-1's 0.839 [0.799, 0.875], with nulls near 0 and the x(2E)
    modulation on uniform x_R.

  claim_tier_and_scope:
    claim_tier: toy
    statement: >-
      Replication at n = 17 (f = t^17 + t^3 + 1), m = 2, l = 9, D in {3, 4},
      with the Stage-1 fixed-shape Macaulay elimination, at three cells: R1
      (new random ordinary curve, h = 2, polynomial V), R2 (new random ordinary
      curve, h = 4, polynomial V), R3 (Stage-1 curve A = 97044, B = 126251 with
      a uniformly random 9-dimensional V).
    sota_delta: zero on every ECDLP cost axis
    dominated_by: >-
      Parallel Pollard rho with the negation map (about 160 group operations
      at q near 2^15). Per attempt at m = 2: oracle A (2^9 = 512 quadratic
      root-findings), which decides satisfiability and returns the solutions,
      dominates the D = 4 Macaulay solve (OBJ-9). FES GPU exhaustive search
      (KN-LIT-287) and WDSat not compared.
    certificate_kind: unsatisfiability_certificate (instrument only; PS0')
    affected_vs_safe: No deployed or standardized curve is touched or affected.

  # ---------------------------------------------------------------------------
  # OBJECT (Stage-1 definitions unless stated; the executor implements exactly)
  # ---------------------------------------------------------------------------
  object:
    field: F_{2^17} = F_2[t]/(t^17 + t^3 + 1), as in EXP-CERTBIN-4e92d7 (irreducibility re-checked in C-SELF).
    cells:
      R1: >-
        Curve drawn from S_curve = 2026092410101: draw (A, B) uniformly with
        B != 0 in draw order, count #E exactly (EXP-CERTBIN-4e92d7
        object.curve), accept the first with #E = 2q, q prime. V = {deg < 9}.
      R2: >-
        Curve drawn from S_curve = 2026092410201: accept the first (A, B) with
        #E = 4q, q prime, and (A, B) != (97044, 126251). V = {deg < 9}.
      R3: >-
        Curve = the Stage-1 curve and its P, Q, k_Q, read from
        experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05/curve.json
        (sha256-checked against the TASK-20260923-c2e57b receipt). V drawn
        from S_V = 2026092410301: draw 9 x 17 matrices over F_2 with iid
        Bernoulli(1/2) entries until one has rank 9; V is its row space and
        its basis b_0..b_8 is the reduced row echelon form with columns in the
        order t^16, t^15, ..., t^0. Record the basis.
    unknowns: >-
      x_1 = sum_{j<9} v_j b_j and x_2 = sum_{j<9} v_{9+j} b_j, with b_j = t^j
      in R1/R2 and the drawn basis in R3. Everything downstream (descent,
      Macaulay, orders, pivot rule, traces, replay, strata) is the Stage-1
      definition with this substitution. Degenerate stratum: x_R in V (a
      linear-algebra membership test in R3).
    subgroup_points: >-
      R1/R2: P and Q from the cell's S_pts stream (2026092410102 and
      2026092410202) by the Stage-1 rule with the cell's h. R3: Stage-1 P, Q.
    target_hull: >-
      Per family: H = the affine hull of the non-degenerate test targets'
      r-vectors, h_0 = the lowest-idx target, W = span of (r - h_0), W^perp its
      annihilator. dim W and whether 0 is in H are recorded. tau_j = Tr(t^j)
      is computed and recorded (Tr(x) = <tau, r>).
    x2E_membership: >-
      A point R is in 2E(F) iff [#E/2] R = O (the 2-Sylow subgroup of an
      ordinary binary curve is cyclic). For an x in x(E), x is in x(2E) iff a
      point with that x-coordinate passes the test. Used for the F-RANDX split
      into x(2E), x(E) minus x(2E), and the twist (x not in x(E)).
    replay_forms: >-
      As Stage 1: e_k(r) = a_{k,0} + <a_k, r> by replaying the op log on
      M_D(E^0) and M_D(E^j). K_sampled, K_exact, K_rank over F_2^n, and
      K_rank_hull = rank({a_k restricted to W}) per reference and D.
      Survival coset on the hull: Sigma_H = {r in H : e_k(r) = 1 for all k},
      computed exactly (dimension and, if <= 2^10 points, its elements).

  seeds:
    generator: numpy.random.Generator(numpy.random.PCG64(seed)), one generator per stream
    formula: >-
      seed(cell c, stream s) = 2026092410000 + 100*c + s, with c = 1 (R1),
      2 (R2), 3 (R3) and s = 01 curve (R1, R2) or V (R3), 02 points (R1, R2
      only), 03 ref, 04 test, 05 plant, 06 randx_ref, 07 randx_test,
      08 nullF2_ref, 09 nullF2_test, 10 nullAff_draw1.
    table:
      R1: {S_curve: 2026092410101, S_pts: 2026092410102, S_ref: 2026092410103, S_test: 2026092410104, S_plant: 2026092410105, S_randx_ref: 2026092410106, S_randx_test: 2026092410107, S_nullF2_ref: 2026092410108, S_nullF2_test: 2026092410109, S_nullAff_draw1: 2026092410110}
      R2: {S_curve: 2026092410201, S_pts: 2026092410202, S_ref: 2026092410203, S_test: 2026092410204, S_plant: 2026092410205, S_randx_ref: 2026092410206, S_randx_test: 2026092410207, S_nullF2_ref: 2026092410208, S_nullF2_test: 2026092410209, S_nullAff_draw1: 2026092410210}
      R3: {S_V: 2026092410301, S_ref: 2026092410303, S_test: 2026092410304, S_plant: 2026092410305, S_randx_ref: 2026092410306, S_randx_test: 2026092410307, S_nullF2_ref: 2026092410308, S_nullF2_test: 2026092410309, S_nullAff_draw1: 2026092410310}
    S_selftest: 2026092410099
    seed_rule: >-
      Frozen here. No stream is re-seeded, skipped or reordered after any
      output. Every rejection (curve, V rank, duplicate x_R, R = O, degenerate
      reference) is counted and recorded.

  families_per_cell:
    - {id: F-S3, role: primary, instances: 'References from S_ref (first 3 unsat and first 2 sat, Stage-1 reference_rule), 1000 test targets from S_test without replacement in x_R, excluding references.'}
    - {id: F-S3-REV, role: 'replicate (row order), with a real failure condition (C-REV)', instances: 'The F-S3 references and the 200 lowest-idx F-S3 targets, row order reversed.'}
    - {id: F-PLANT, role: 'control (planted solutions)', instances: '200 targets z = x(P_1 + P_2), P_i uniform from the enumerated F_V, Stage-1 rule.'}
    - {id: F-RANDX, role: 'control (uniform x; hull and x(2E) split)', instances: 'Own references from S_randx_ref and 1000 distinct uniform x_R from S_randx_test; also scored against the F-S3 references (secondary).'}
    - {id: F-AFF-1, role: 'null (same-support random affine; one draw per cell)', instances: 'Stage-1 construction from S_nullAff_draw1, paired with the F-S3 target r-bytes; references by the Stage-1 rule under its own classification.'}
    - {id: F-NULLF2, role: 'null (same-support random F_2)', instances: 'Stage-1 construction; own references and 1000 targets.'}
  reference_rule: As EXP-CERTBIN-4e92d7 reference_rule, per cell and family.
  modal_reference_rule: As EXP-CERTBIN-4e92d7 modal_reference_rule, per cell, family and D.
  design_time_sizing_note: >-
    Stage 1 had 386 unsat of 993 non-degenerate F-S3 targets (h = 4). The
    unsat fraction on an h = 2 curve or a random V is not assumed; arms are
    measured and SR-3 flags any arm under 100. The rate comparison needs no
    more than Stage 1 had: an unsat arm near 380 gives a CP95 half-width near
    0.04, against a Stage-1 interval of width 0.076.

  # ---------------------------------------------------------------------------
  # CONTROLS -- each with a stated FAIL condition
  # ---------------------------------------------------------------------------
  controls:
    - {id: C-FIX, what: 'D = 3: 323 x 988; D = 4: 2924 x 4048, per cell.', fails_if: 'any mismatch; STOP (INV-1).'}
    - id: C-SELF
      what: >-
        Stage-1 C-SELF items per cell (modulus, field axioms, point counting,
        S_3 against point addition, descent against direct evaluation,
        Macaulay rows against naive multiplication, half-trace), plus: the R3
        basis has rank 9 and V-membership agrees with brute force on 10^4
        random elements; the [#E/2] x(2E) test agrees with a brute-force halving
        search on 200 random points per cell.
      fails_if: any item fails; STOP (INV-1).
    - id: C-PROV
      what: >-
        impl/ is copied from experiments/EXP-CERTBIN-4e92d7/impl/ (reviewed in
        REVIEW-CERTBIN-20260923-c51f07) with every change listed in
        impl/impl-provenance.json (source sha256, unified diff, reason).
        Regression: the replication code run on the STAGE-1 cell (Stage-1
        curve and V, the 5 archived F-S3 references and the 20 lowest-idx
        archived F-S3 targets, x_R read from targets-F-S3.jsonl.gz) reproduces
        the archived rank, "1 in R_D", four trace hashes and replay
        first-zero indices at D = 3 and 4.
      fails_if: any mismatch; the run is void (INV-2).
    - {id: C-ORACLE, what: 'Oracle A and oracle B agree on s for every curve-algebra instance; nulls use oracle B.', fails_if: 'any disagreement; arm-dependent metrics void (INV-3).'}
    - {id: C-WIT, what: 'Every Boolean solution re-verified directly in F_{2^17} and on the 17 equations; every F-PLANT target has s >= 1.', fails_if: 'any failure; INV-3.'}
    - {id: C-AFF, what: 'E(r) = E^0 + sum_j r_j E^j for every affine-route instance; direct replay equals the affine formula for 20 targets per family and every reference.', fails_if: 'any mismatch; M2, K and K_rank void for the family (INV-4).'}
    - id: C-FORMS
      what: >-
        Replaces C-UNIF (F-J2-2: it could not fail when K_rank = n). For EVERY
        target of F-S3, F-PLANT and F-RANDX and every reference at D in {3, 4},
        the exact forms predict the first replay-zero index (the first k with
        e_k(r_t) = 0), and it equals the index found by direct replay on the
        20 C-AFF targets and by the forms-evaluation path on all targets.
      fails_if: any mismatch; M2, K_rank and TS1R void for the family (INV-4).
    - id: C-SURV
      what: >-
        Exact survival identity: per reference, family and D, the number of
        targets surviving the whole fixed replay equals the number of targets
        lying in the exactly computed coset Sigma (and Sigma_H on the hull).
      fails_if: any mismatch; INV-4.
    - id: C-HZERO
      what: Lemma 3 identity. Every pivot dependent modulo span{a_j, j < k} + W^perp has h_k = 0 exactly.
      fails_if: any nonzero hazard there; INV-4 (instrument, never evidence about TS1R).
    - id: C-TR
      what: >-
        On each cell's curve, by enumeration over all x in F_{2^17}: x in x(2E)
        iff Tr(x) = Tr(A). Counts are recorded.
      fails_if: >-
        any x violates it. Consequence: the recalled hull prediction is false
        on that curve; the MEASURED hull is used anyway (no invalidation), and
        the failure is reported as data.
    - {id: C-DET, what: 'The references and the 200 lowest-idx F-S3 targets of each cell re-eliminated at both D in a SEPARATE process; T_ops hashes compared.', fails_if: 'any mismatch; the run is void (INV-5).'}
    - {id: C-PASS, what: 'Column-pass pivot set equals row-pass leading-column set, and |Z_D| = R_D - rank_D, on every instance.', fails_if: 'any failure; INV-5.'}
    - id: C-PROPS
      what: >-
        Three INDEPENDENT failure modes (F-J2-4):
        - PS0: every row of M_D vanishes at every Boolean solution (sat arm);
        - PS1: no satisfiable instance has 1 in R_D (all families, both D);
        - PS0' (F-J2-1): for the 30 lowest-idx unsat F-S3 targets with 1 in
          R_4 per cell, an explicit certificate (a set of rows (mu, k),
          deg mu <= 2, whose XOR is 1) verified by verifier/verify_cert.py, a
          module importing nothing from impl/, which rebuilds f_k with its own
          F_{2^17} arithmetic.
        PS2 and PS3 are recorded as IMPLIED checks, not counted as controls.
      fails_if: any PS0, PS1 or PS0' failure; the instrument is falsified and the run is void (INV-6).
    - id: C-REV
      what: >-
        F-S3-REV (F-J2-3: it now has a failure condition). Row permutation
        leaves the row space invariant, so rank_D, the pivot-column set and
        "1 in R_D" must be identical per instance under reversal. T_strict
        retention under reversal is reported as DATA.
      fails_if: any per-instance difference in those three; the run is void (INV-5).
    - id: C-NULLS
      what: >-
        (F-J2-3: it now has failure conditions.) The null families run the
        identical code path (module sha256 recorded per family). F-AFF-1:
        supp(E'^j) is contained in supp(E^j) and the fraction of ones on the
        support lies in its exact two-sided 99.9% Binomial(|supp|, 1/2) band.
        F-NULLF2: every instance's support is contained in U_k, and the pooled
        fraction of ones lies in its exact 99.9% band.
      fails_if: a code-path hash differs or a support or band check fails; null comparisons (M3, RR-5 nulls) void.

  independent_variables:
    - cell (R1, R2, R3)
    - family (F-S3, F-S3-REV, F-PLANT, F-RANDX, F-AFF-1, F-NULLF2)
    - D in {3, 4}
    - granularity in {T_rank, T_set, T_strict, T_ops}
    - reference (3 unsat, 2 sat, modal)
    - arm (unsat, sat; degenerate separately)

  metrics:
    primary:
      - id: M1
        name: strict_retention_unsat
        definition: As EXP-CERTBIN-4e92d7 M1, per cell (Clopper-Pearson in exact arithmetic). retention_family = max over the 3 unsat references and the modal.
      - id: M1f
        name: first_divergence
        definition: >-
          (OBJ-6, co-primary with M1.) f_div per target and reference (Stage-1
          secondary definition), with the median per arm and the fraction with
          f_div <= 0.01. Retention alone cannot separate early from late
          divergence (J5 O2); f_div can.
      - id: M1k
        name: hull_rank
        definition: >-
          (OBJ-6, co-primary.) Per reference and D: K_rank over F_2^n,
          K_rank_hull, dim W, whether 0 is in H, and dim Sigma_H =
          dim W - K_rank_hull.
      - id: M2R
        name: ts1r_evaluation
        definition: >-
          (RC-2.) HEUR-CERTBIN-TS1R's evaluation set E per cell and family at
          D = 4 (D = 3 secondary): hull-rank-increasing pivots with
          |S_k| >= 100, deduplicated by (a_k + W^perp, S_k); m, the per-
          measurement h_k with its exact 99.9% band, o, and
          P[Bin(m, 0.001) >= o] in exact arithmetic. Also n_rep (hull-dependent
          pivots with S_k >= 100) and a check that all of them have h = 0.
      - id: M-R4
        name: one_in_R4_rate
        definition: >-
          Per cell and family, the fraction of the unsat arm with 1 in R_4
          (and R_3), with CP95 in exact arithmetic; for F-RANDX split into
          x(2E), x(E) minus x(2E), and twist. D* distribution per arm.
      - id: M3
        name: affine_null_ratio
        definition: >-
          At D = 4 and T_strict, numerator retention_family(F-S3), denominator
          retention_family(F-AFF-1). PRECEDENCE (F-J3-1), FIRST MATCHING RULE
          APPLIES:
          (1) numerator count 0 AND denominator count 0: "not estimable";
              E1's [0.5, 2] clause "not evaluable"; E2's >= 10x clause "not met";
          (2) numerator count 0, denominator > 0: ratio 0; E2 not met;
          (3) numerator >= 1, denominator 0: lower bound numerator / CP95
              upper bound of the denominator;
          (4) otherwise: point estimate with a bootstrap 95% interval (10^4
              resamples, seed S_selftest).
      - id: M4
        name: trace_entropy
        definition: As Stage 1, reported with the note that saturation at log2 N makes it uninformative when every family saturates.
      - id: M5
        name: instrument_checks
        definition: Pass/fail for every control above, with violating instances. The count of controls that CAN fail is reported (all of them here).
    secondary:
      - K / rank, K_exact, K_sampled, and the predicted 2^{-K_rank} beside the measured fixed-schedule retention on uniform targets (F-RANDX) and |Sigma_H intersected with T| / |T| on curve targets.
      - T_set, T_rank and T_ops retention; the strict own-elimination hazard; sat-arm retention; cross-family scores.
      - Saving ratios and sizes exactly as Stage 1 (identity check saving_set = C_D R_D / rank_D^2).
      - P_sat, rational_flag rate, degenerate count, rejection counts.
      - Wall time and peak RSS per cell and phase.
    primary_unit: GF(2) full-row XOR operations (as Stage 1)

  preregistered_prediction:
    quantity: >-
      The replication predictions of H-CERTBIN-a73f1c (P1, P4, P5 direction;
      E2 falsified), H-CERTBIN-7c3a18 (PC-1..PC-4) and H-CERTBIN-5e71c9 (PA-4,
      PA-5).
    formula: >-
      Per cell: retention_family < 0.5 (predicted <= 0.01); K_rank_hull =
      dim W for every reference; median f_div <= 0.1 in both arms; TS1R
      consistent with Binomial(m, 0.001); "1 in R_4" CP95 overlaps
      [0.799, 0.875]; null CP95 upper <= 0.05; x(2E) rate above off-x(2E)
      with exact one-sided Fisher p < 0.01.
    source: >-
      The three hypothesis records, fixed before any run of this contract;
      Stage-1 values from EV-CERTBIN-6c3e0a.
  heuristic_under_test: HEUR-CERTBIN-TS1R
  heuristics_also_read: [HEUR-CERTBIN-KR1, HEUR-CERTBIN-RD1]
  scale_relevance:
    tier: toy
    justification: >-
      n = 17 at three new cells. No statement about other n (TS3 untested) or
      any Certicom size; those are extrapolation.
    correspondence: null
  tail_checks:
    - >-
      EXACT ARITHMETIC (RC-3): every binomial, Poisson and hypergeometric tail
      and every CP bound is computed with exact integer / rational arithmetic
      or log-space summation at >= 50 significant digits, reported as log10.
      numpy/scipy floating survival functions are not used below 1e-12.
    - >-
      TS1R extremes: the minimum and maximum h over E against their exact
      99.9% bands (already in M2R); no misapplied null (OBJ-2): the tail is
      computed only over hull-rank-increasing measurements, never over forced
      zeros.
    - Fixed-schedule survival on F-RANDX against 2^{-K_rank} with an exact binomial band (only where K_rank < n makes it non-degenerate; otherwise recorded as determined by the identity).

  replication:
    seeds: see seeds.table
    independent_instances: 'about 17,000 (3 cells x (6 references x 4 families + 1000 x 4 families + 200 + 200))'
    plan: >-
      Cross-curve (R1 h = 2, R2 h = 4) and cross-V (R3) replication of the
      Stage-1 cell, each with its own nulls, planted arm, row-order check and
      separate-process determinism check.

  # ---------------------------------------------------------------------------
  # DECISION RULES (fixed now; applied mechanically per cell, D = 4 primary)
  # ---------------------------------------------------------------------------
  decision_rules:
    - {id: RR-1, rule: 'DR-1 replication. "DIRECTION REPLICATES" at a cell iff T_strict unsat retention < 0.5 for all 3 unsat references and the modal; otherwise "FAILS TO REPLICATE".'}
    - {id: RR-2, rule: 'KR1 / PC-1. "HULL RANK FULL" at a cell iff K_rank_hull = dim W for every reference at D = 4 (D = 3 reported). Otherwise "REVISIT TRIGGER FIRES" (DEC-20260923-f25b97 NA-6), with dim Sigma_H and |Sigma_H intersected with T| per reference.'}
    - {id: RR-3, rule: 'P5 replication. "EARLY DIVERGENCE REPLICATES" iff the median f_div <= 0.1 in both arms against every unsat reference.'}
    - {id: RR-4, rule: 'TS1R per cell (HEUR-CERTBIN-TS1R): SUPPORTED iff m >= 5 and P[Bin(m, 0.001) >= o] >= 0.001; FALSIFIED iff m >= 5 and that probability < 0.001; NOT EVALUABLE iff m < 5.'}
    - {id: RR-5, rule: '"1 in R_4" rate per cell (F-S3 unsat arm): "REPLICATES" iff its CP95 interval overlaps [0.799, 0.875]; "HIGHER" or "LOWER" iff disjoint, by side. "NULLS CLEAN" iff the CP95 upper bound of each null unsat-arm rate is <= 0.05.'}
    - {id: RR-6, rule: 'x(2E) modulation per cell (F-RANDX unsat arm): x(2E) rate against the pooled x(E) minus x(2E) and twist rate, exact one-sided Fisher test. "MODULATION REPLICATES" iff p < 0.01; "ABSENT" iff p >= 0.2; otherwise "WEAK".'}
    - {id: RR-7, rule: 'E2 per cell: FALSIFIED iff retention_family < 0.5 or M3 (with its precedence) < 10 or rule (1)/(2) of M3 applies. SUPPORTED iff retention_family >= 0.5 and M3 >= 10 and K <= 1.'}
    - {id: RR-8, rule: 'Instrument: every control in M5 passes, or its invalidation rule applies before any verdict is issued.'}
    - id: RR-9
      rule: >-
        Composite verdicts (mechanical; the Coordinator decides official
        status separately).
        H-CERTBIN-a73f1c: "REPLICATED (direction and obstruction)" iff RR-1
        and RR-2 hold at all three cells; "DIRECTION REPLICATED, OBSTRUCTION
        NOT" iff RR-1 holds at all cells and RR-2 fails at some cell; "NOT
        REPLICATED" iff RR-1 fails at any cell.
        H-CERTBIN-5e71c9 C2: "RATE REPLICATES" iff RR-5 REPLICATES with NULLS
        CLEAN at all three cells; "RATE CURVE- OR V-DEPENDENT" iff any cell is
        HIGHER or LOWER (the cell and side named).
        H-CERTBIN-7c3a18: KR1 per RR-2; TS1R per RR-4 at each cell.
    - {id: RR-10, rule: 'Primary verdicts: RR-1, RR-2, RR-3 and RR-5 at D = 4 on F-S3. Every D = 3, T_set, T_rank, T_ops, cross-family or REV reading is secondary.'}

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    watchdog_seconds: 86400
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 2
    maximum_workers: 1
    budget_note: >-
      CERTBIN is ECC; research time is unbudgeted. The watchdog (24 h with
      checkpoint and --resume) and the 4 GB cap are machine protection.
      maximum_runs = 2: one run plus one INFRASTRUCTURE re-run, the failed
      attempt retained. One worker (the machine is shared with up to two other
      CERTBIN executors; DEC-20260924-8e2f47 concurrency).
    dominant_cost: >-
      D = 4 eliminations, about 0.45 s each at Stage-1 timing, over about
      17,000 instances, plus replays: roughly 3-5 h in total (estimate only).

  stopping_rules:
    - {id: SR-1, rule: 'Counts are fixed. No early stopping, extension or trimming on results.'}
    - {id: SR-2, rule: 'C-SELF, C-FIX or C-PROV failure stops the run before any frozen stream is drawn; the failed attempt is retained.'}
    - {id: SR-3, rule: 'An arm with fewer than 100 non-degenerate targets is reported with its intervals and flagged UNDERPOWERED; never resampled.'}
    - {id: SR-4, rule: 'A reference shortfall is recorded and the family runs with the references found.'}
    - {id: SR-5, rule: 'Watchdog expiry, crash or OOM: checkpoint (one per cell, phase, family and D) and resume. Never a result.'}

  invalidation_rules:
    - {id: INV-1, rule: 'C-FIX or C-SELF failure: void (stop).'}
    - {id: INV-2, rule: 'C-PROV failure: void (the copied instrument no longer reproduces the reviewed Stage-1 instrument).'}
    - {id: INV-3, rule: 'C-ORACLE or C-WIT failure: every arm-dependent metric void, all families of that cell.'}
    - {id: INV-4, rule: 'C-AFF, C-FORMS, C-SURV or C-HZERO failure: M2R, K, K_rank and K_rank_hull void for the affected family (all affine-route families if in shared code).'}
    - {id: INV-5, rule: 'C-DET, C-PASS, C-REV failure or a nesting violation: void.'}
    - {id: INV-6, rule: 'C-PROPS failure: the instrument is falsified; void; not evidence about any hypothesis.'}
    - {id: INV-7, rule: 'A void run is an implementation failure (AGENTS.md core rule 5).'}

  success_criterion: >-
    Every control passes (C-TR may fail as data); every cell and family
    reports every primary metric at both D, or names each missing cell and
    why; RR-1..RR-10 each return a verdict or "not evaluable" with its reason.
    Replication and non-replication are both successes.
  falsification_criterion: >-
    - H-CERTBIN-a73f1c's DR-1 direction fails to replicate at a cell per RR-1.
    - H-CERTBIN-7c3a18 KR1 is falsified at a cell per RR-2; TS1R per RR-4;
      P-C3 per RR-1.
    - H-CERTBIN-5e71c9 C2 (HEUR-CERTBIN-RD1) is falsified at a cell per RR-5
      (HIGHER or LOWER); C3 is not supported at a cell per RR-6 (ABSENT).
    NOT falsification: a void run, a watchdog expiry, an underpowered arm.

  coordinator_prior: >-
    Written before any run; nothing from any new cell has been seen.
    (a) RR-1 replicates at all three cells (about 95%): the Stage-1
        instability was at step 0 or 1 and does not look curve-specific.
    (b) RR-2 holds at all three cells (about 90%). A shortfall is likeliest
        on the random V (R3), where the forms' structure changes most.
    (c) TS1R is SUPPORTED where evaluable (about 70%); m may be small (about
        3 hull-rank-increasing pivots per reference pass |S_k| >= 100).
    (d) "1 in R_4": R2 (h = 4) REPLICATES (about 60%); R1 (h = 2) is the
        least certain (about 45%), because the x(2E) modulation suggests the
        cofactor matters; R3 (random V) could move either way (about 50%).
    (e) The x(2E) modulation replicates at R2 (about 70%), less sure at R1.
    Most likely to be overturned: (d) at R1 or R3.

  proof_search_map_audit:
    performed_by: coordinator (DEC-20260924-8e2f47), before approval
    baseline_fixture: C-PROV reproduces archived Stage-1 values on 25 Stage-1 instances before any new cell is drawn; C-FIX dimensions.
    observation_collision: Trace-class sizes and H(T) per family (Stage-1 design); duplicate targets excluded by sampling without replacement in x_R.
    quantifier_order: FOR each cell (curve / V fixed from frozen seeds before any target), FOR each reference (drawn before any target) -- exact for RR-2, empirical for RR-1/RR-3/RR-5.
    method_ceiling: >-
      Three cells at n = 17 cannot establish transfer in n. The
      nearby-object controls are F-AFF-1 and F-NULLF2 (same support, no S_3
      algebra) and F-RANDX (no curve membership).
    verdict: No audit failure. Approved.

  attention_contract:
    decisive_evidence: RR-1, RR-2 and RR-5 at the three cells.
    positive_next_decision: >-
      REPLICATED (direction and obstruction): the Stage-1 obstruction becomes
      eligible for the NA-6 closure path (review-breakthrough round at max,
      then an obstruction block over the replicated scope), and Lemmas 1-3 for
      a KN-FIND. RATE REPLICATES: the rate may be quoted as characteristic of
      the n = 17, l = 9 family (KN-OPEN-3c8f51 item 4 met).
    negative_next_decision: >-
      NOT REPLICATED, or HULL RANK short: regime-A replay reopens at that cell
      (NA-6 revisit) and Stage 3 is reranked for P-GPU. RATE CURVE- OR
      V-DEPENDENT: the rate is quoted per curve / V only, and the dependence
      becomes part of KN-OPEN-3c8f51 item (A).
    inconclusive_decision: An UNDERPOWERED arm or a void cell gets a same-seed infrastructure re-run (run 2), not new seeds.
    local_ambiguity_rule: Anything not covered is recorded "not evaluable" with its reason; no threshold is added after data.
    peripheral_exclusions: [n != 17, Koblitz form, m = 3, regime B, F4 traces]
    rerank_trigger: Completion triggers the CERTBIN rerank (DEC-20260924-8e2f47 NA-6).

  execution:
    entry_point: experiments/EXP-CERTBIN-3f06d1/impl/driver.py
    selftest: experiments/EXP-CERTBIN-3f06d1/impl/selftest.py
    verifier: experiments/EXP-CERTBIN-3f06d1/verifier/verify_cert.py
    interpreter: python3 with numpy 2.4.6 (DEC-20260923-4d7a19 R-2); record versions in environment.json
    trial_plan: experiments/EXP-CERTBIN-3f06d1/trial-plan-v1.json
    trial_plan_rule: Written from this specification alone before any frozen stream is drawn (after C-PROV); no drawn value; sha256 in the manifest.
    command: >-
      python3 experiments/EXP-CERTBIN-3f06d1/impl/selftest.py --out
      experiments/EXP-CERTBIN-3f06d1/runs/RUN-CERTBIN-6d92b5/selftest.json &&
      python3 experiments/EXP-CERTBIN-3f06d1/impl/driver.py --spec
      experiments/EXP-CERTBIN-3f06d1/specification.yaml --plan
      experiments/EXP-CERTBIN-3f06d1/trial-plan-v1.json --stage1-run
      experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05 --run-id
      RUN-CERTBIN-6d92b5 --out experiments/EXP-CERTBIN-3f06d1/runs/RUN-CERTBIN-6d92b5
      [--resume]
    determinism_command: >-
      python3 experiments/EXP-CERTBIN-3f06d1/impl/driver.py --spec
      experiments/EXP-CERTBIN-3f06d1/specification.yaml --plan
      experiments/EXP-CERTBIN-3f06d1/trial-plan-v1.json --stage1-run
      experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05 --run-id
      RUN-CERTBIN-6d92b5 --out experiments/EXP-CERTBIN-3f06d1/runs/RUN-CERTBIN-6d92b5
      --phase determinism
    verify_command: >-
      python3 experiments/EXP-CERTBIN-3f06d1/verifier/verify_cert.py --certs
      experiments/EXP-CERTBIN-3f06d1/runs/RUN-CERTBIN-6d92b5/ps0prime-certificates.jsonl.gz
      --cells experiments/EXP-CERTBIN-3f06d1/runs/RUN-CERTBIN-6d92b5/cells.json
      --out experiments/EXP-CERTBIN-3f06d1/runs/RUN-CERTBIN-6d92b5/ps0prime-verification.json
    phases:
      - 0 selftest, fixture, C-PROV on the Stage-1 cell
      - 1 per cell - curve or V, points, references and targets of every family, oracles, witnesses, C-TR
      - 2 per cell - F-S3 at D = 3, 4 (eliminations, row pass, op logs, affine forms, hull), F-PLANT
      - 3 per cell - F-RANDX
      - 4 per cell - F-AFF-1
      - 5 per cell - F-NULLF2
      - 6 per cell - F-S3-REV (200)
      - 7 C-DET (separate process, --phase determinism)
      - 8 PS0' certificate extraction, then the verifier as a separate process (verify_command)
      - 9 aggregation, decision rules, run report (--resume)
    output_bound: >-
      Per-target gzipped JSONL with trace hashes only; full op logs for the
      F-S3 references only; total package under 80 MiB.
    dispatch_note: No batch queue exists; the executor launches the commands above under TASK-20260924-9f15a2 after TASK-20260924-d3a90c verifies.

  constraints:
    - No deployed curve is an attack instance; no discrete logarithm is attempted.
    - A timeout, crash or restart is execution status, never evidence.
    - EXP-CERTBIN-4e92d7 is read only; its impl/ is copied, never edited or imported.

  artifact_paths:
    - experiments/EXP-CERTBIN-3f06d1/specification.yaml
    - experiments/EXP-CERTBIN-3f06d1/trial-plan-v1.json
    - experiments/EXP-CERTBIN-3f06d1/impl/
    - experiments/EXP-CERTBIN-3f06d1/verifier/
    - experiments/EXP-CERTBIN-3f06d1/runs/RUN-CERTBIN-6d92b5/

  required_artifacts:
    - trial-plan-v1.json; impl/impl-provenance.json; selftest.json; cprov.json (C-PROV comparison)
    - 'cells.json (per cell - curve A, B, order #E, h, q, P, Q, rejections; V basis; tau; hull data per family)'
    - column-order and row-order files for D = 3, 4 (shared across cells) and references.json per cell
    - F-S3-reference-oplogs-<cell>-D{3,4}.jsonl.gz
    - targets-<cell>-<family>.jsonl.gz (Stage-1 per-target fields plus x2E class and hull membership)
    - pivot-hazards-<cell>.json (per reference, D and pivot - a_k, hull-rank-increasing flag, S_k, zeros, h_k, exact band)
    - ps0prime-certificates.jsonl.gz and ps0prime-verification.json
    - cell-summary.json (M1, M1f, M1k, M2R, M-R4, M3, M4 per cell, family and D); instrument-checks.json; decision-rules.json; sizing.json
    - manifest.yaml, raw-result.json, command.txt, environment.json, stdout.log, stderr.log
    - run-report.md (each RR verdict with cell, granularity and D; which predictions held; which prior parts (a)-(e) were overturned; the claim tier and scope verbatim)

  claim_tier_and_review:
    review_required: true
    default: >-
      review-adversarial. A validator re-derives, blind (no impl/, no run
      output), rank_4, "1 in R_4", T_strict against the 3 unsat references and
      K_rank_hull on a 50-target F-S3 subsample per cell from extracted
      instance inputs; a comparator task compares. A red team attacks the hull
      accounting, TS1R's deduplication and the rate comparison. The
      review_plan is written after TASK-20260924-58c4d1 verifies.
    escalation: >-
      If the evidence decision would close regime-A replay (NA-6) it needs a
      review-breakthrough round at max first; this contract's review is not
      that round.

  dependencies: []
  dependencies_note: >-
    None. It may run concurrently with EXP-CERTBIN-e94b27. DEC-20260923-f25b97
    NA-4 allowed sharing instrument code with NA-3 only once reviewed; it
    shares none (it copies the already-reviewed Stage-1 impl instead).

  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    fallback_reason: >-
      DEC-20260923-4d7a19 R-1 forward rule: same-session Claude Code subagents
      inherit the session model; per-role model selection is process-level.
      Not a tier downgrade.
    degraded_allowed: false
    independent_session_required: false
