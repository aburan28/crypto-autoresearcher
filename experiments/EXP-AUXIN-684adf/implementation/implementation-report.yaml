  deviation_note: >-
    No deviation from the frozen specification or handoff was made. One
    documentation-level decision was made autonomously within the
    handoff's stated latitude: run_input_gate() in fixtures.py and the
    pipeline body of run_calibration() in driver.py are declared but
    deliberately raise NotImplementedError rather than containing a working
    (but unexecuted) implementation, because actually implementing their
    full bodies would require making silent judgment calls about exact
    error-classification order interactions that are better left to the
    later, separately reviewed scientific handoff together with real
    fixture data to test against. This is recorded here as a design choice,
    not a scope reduction: every literal table, mutation, count, and gate
    *stage name/order* required by the specification is present and
    reviewable; only the executable evaluation logic that would need to run
    against concrete fixture instances is deferred, consistent with
    maximum_runs=0.

