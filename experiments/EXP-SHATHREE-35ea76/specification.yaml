experiment:
  id: EXP-SHATHREE-35ea76
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-6ddf4e; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-6ddf4e
  question_id: RQ-SHATHREE-cd2cb2
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exhaustive difference distribution table and solution-set geometry of the 5-bit chi map,
    converted to an exact per-active-row degrees-of-freedom charge, against random 5-bit permutation
    and random 5-bit function nulls
  objective: The single uncertainty a run reduces is whether the cost an internal differential pays
    at Keccak's only nonlinear step is a structured, exactly computable quantity or a generic one
    indistinguishable from a random 5-bit map. (i) It establishes by complete enumeration -- no sampling,
    no seed, no residual statistical uncertainty -- the full 32x32 difference distribution table of
    chi, the exact solution set of every admissible transition, and whether those sets are affine
    subspaces, which is the property that makes a compact charge function exist at all. (ii) It converts
    that geometry into an exact per-row charge c(d, e) = 5 - log2|S(d, e)| in bits and a marginal
    cheapest charge c_min(d), replacing the implicit constant-per-active-row assumption that this
    repository's companion active-row contract would otherwise carry unexamined; the mispricing between
    the two models is reported in bits. (iii) It reads all of that against 1000 random 5-bit permutations
    and 1000 random 5-bit functions enumerated by the identical code path in the same invocation,
    so that a claim of chi-specific structure is separated from the generic behaviour of any small
    nonlinear map. The run reduces uncertainty about the COST UNIT of every downstream internal-differential
    statement in this bucket, and about nothing else.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: ''the 5-bit chi map of Keccak-f[1600]
      has the following exhaustively computed DDT; the following fraction of its admissible transitions
      have affine solution sets of the recorded dimensions; the resulting per-row degrees-of-freedom
      charge takes the following exact values; and this charge does (or does not) separate from a
      random 5-bit permutation null at the recorded quantile.'' What does NOT follow: any trail probability,
      any collision complexity, any statement that charges compose additively across rows or rounds,
      any statement about full-round SHA-3, and any security consequence whatsoever.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes). Transcribe the 5-bit chi map from FIPS 202; validate by recomposing
      the full 24-round permutation and matching hashlib digests for all four SHA-3 digest sizes.
      Abort on mismatch. STAGE 1 (cost: milliseconds). Enumerate all 32 inputs; build the 32x32 DDT
      by counting x with chi(x) XOR chi(x XOR d) = e for every (d, e). STAGE 2 (cost: milliseconds).
      For each nonzero cell, materialise S(d, e) explicitly; test affineness by translating to the
      origin and checking XOR closure over the span; record dimension when affine, full set otherwise.
      STAGE 3 (cost: milliseconds). Emit c(d, e) = 5 - log2|S(d, e)|, the marginal c_min(d), the maximum
      DDT entry, and the differential branch number. STAGE 4 (cost: ~1 min, requires companion deviation
      vectors). Decompose D_r into 320 row differences per round r = 1..8; aggregate sum of c_min(d)
      over active rows; emit the degrees-of-freedom curve in bits. STAGE 5 (cost: seconds). Recompute
      the same curve under the constant-charge model and report the difference in bits per round.
      STAGE 6 (cost: ~1 min). Run stages 1-3 for 1000 random 5-bit permutations and 1000 random 5-bit
      functions plus the two degenerate anchors; emit null distributions and the quantile of chi within
      them; emit the run manifest with seeds.'
    instrument: Python 3.11; pure-Python 5-bit map enumeration over integers 0..31; the validated
      pure-Python Keccak-f[1600] for the recomposition control; hashlib for digest validation; numpy
      for the DDT array and null distributions; a hand-written GF(2) span routine for the affineness
      test. No Sage. Manifests, seeds and the inference block via harness/runner.py.
    parameters: 'Chi domain GF(2)^5, all 32 inputs, all 32 input differences, all 32 output differences
      -- complete enumeration, sample size is the entire space. Null arms: 1000 random permutations
      of GF(2)^5 and 1000 random functions GF(2)^5 -> GF(2)^5, PCG64 seeds 1..2000 declared in advance,
      plus the identity and one random affine bijection as anchors. Aggregation stage over deviation
      vectors for rounds r = 1..8 and all four digest sizes.'
  controls:
  - 1000 random 5-bit permutations, identical enumeration code path.
  - 1000 random 5-bit functions (non-bijective), to separate 'permutation' from 'chi'.
  - 'Identity map anchor: must give charge zero for d = e and no reachable e != d.'
  - 'A random affine bijection anchor: must give |S(d, e)| = 32 for exactly one e per d and zero elsewhere,
    charge exactly 0 bits -- a hard correctness check on the charge definition.'
  - 'Recomposition control: rebuild the full Keccak permutation from the tabulated chi and re-match
    hashlib digests, so the table cannot drift from the map it claims to describe.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Identical stages 1-3 applied, in the same invocation and by the same
    code path, to (i) 1000 uniformly random permutations of GF(2)^5, (ii) 1000 uniformly random functions
    GF(2)^5 -> GF(2)^5, and (iii) the 5-bit identity and a random affine bijection as degenerate anchors.
    For the chi result to mean anything, chi''s charge distribution -- in particular the fraction
    of (d, e) pairs with affine solution sets and the spread of c_min(d) -- must lie outside the central
    90 percent of the random-permutation null. If chi''s charges look like a random 5-bit permutation''s,
    the recorded result is a controlled null: chi is expensive in the generic way and the internal-differential
    cost carries no chi-specific structure.'
  independent_variables:
  - input difference d in GF(2)^5
  - output difference e in GF(2)^5
  - map arm in {chi, random permutation, random function, identity, affine bijection}
  - round index r for the aggregation stage
  metrics:
    primary:
    - DDT count for every (d, e)
    - affineness verdict and dimension per nonzero cell
    - charge c(d, e) in bits
    - marginal c_min(d) for all 31 nonzero d
    - aggregated degrees-of-freedom charge per round in bits
    secondary:
    - maximum DDT entry
    - differential branch number of chi
    - null quantile of chi's affine fraction
    - bits of mispricing versus the constant-charge model per round
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The fraction A of nonzero DDT cells whose solution set is an affine subspace of GF(2)^5,
      and the marginal charge function c_min(d).
    formula: 'c(d, e) := 5 - log2 |S(d, e)| where S(d, e) = {x in GF(2)^5 : chi(x) XOR chi(x XOR d)
      = e}, measured in bits and equal to zero exactly when every input realises the transition. c_min(d)
      := min over reachable e of c(d, e). Predicted: A >= 0.9, and c_min(d) is a nondecreasing function
      of the Hamming weight of d up to at most one inversion. Predicted anchor values, forced by definition
      and used as correctness checks: for the identity map c(0, 0) = 0 and no other cell is nonzero;
      for any affine bijection c(d, e) = 0 for exactly one e per d.'
    source: Pre-registered in the parent proposal IDEA-20260816-6ddf4e before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The measured object is the actual 5-bit chi map of the standardised Keccak-f[1600]
      at full fidelity, enumerated exhaustively -- there is no reduction and no sampling. It is labelled
      toy because it measures one step in isolation and because the aggregation stage uses a linear-surrogate
      deviation vector from the companion contract. Transfer assumption stated explicitly: the per-row
      charge transfers to a multi-round trail ONLY under an independence assumption this contract
      does not establish and explicitly flags.'
    correspondence: null
  tail_checks:
  - The DDT rows must each sum to 32; any row not summing to 32 voids the enumeration.
  - The d = 0 row must have all mass at e = 0.
  - The affine-bijection anchor must give charge identically zero on its support.
  - Recomposition of the full permutation from the tabulated chi must reproduce hashlib digests bit-for-bit.
  - The maximum DDT entry must be at most 32 and at least 2 for a non-affine map; a maximum of 32
    at a nonzero d would mean chi is affine, contradicting its role.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort if stage 0 hashlib validation fails.
  - Fixed 2000 null draws with no adaptive extension.
  - Total wall-clock ceiling 30 minutes; a timeout is a budget outcome, never negative mathematical
    evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run is successful if the complete DDT, the affineness verdicts, the charge
    matrix, the marginal charges and the full null distributions are emitted with all tail checks
    passing -- whether or not chi separates from the null.
  falsification_criterion:
  - Any DDT row fails to sum to 32.
  - Fewer than half of nonzero cells have affine solution sets.
  - c_min is constant across all nonzero d.
  - The affine-bijection anchor produces a nonzero charge.
  - chi's affine fraction and c_min spread both fall inside the random-permutation null central 90
    percent band -- controlled null.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-6ddf4e
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The composition rule for aggregating per-row charges across rows and rounds is not derived here
    and a Coordinator must decide whether the aggregation stage may be approved at all before an independence
    argument exists.
  - The choice of random 5-bit permutations as the null is weak for a map selected for implementation
    cost; a degree-2 quadratic-map null would be sharper and needs specifying.
  - Whether c_min, mean charge or max charge is the operative cost is undetermined; all three are
    reported and the Coordinator must pick one before any downstream contract consumes it.
