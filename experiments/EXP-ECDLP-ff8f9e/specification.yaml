experiment:
  id: EXP-ECDLP-ff8f9e
  hypothesis_id: H-ECDLP-26fd90
  proposal_id: IDEA-20260921-b03306
  source_idea_ids: [IDEA-20260921-b03306]
  question_id: RQ-CRYPTO-001
  goal_id: GOAL-CRYPTO-001
  version: 1
  title: >-
    Partition (lambda, PGL_2-stability) profile: the t != 0
    level-character combined norms for the natural M-level partitions
    (popcount at M = 2/4/16/64, residue at M = 4/16) on the census's
    primary ladder, with a random-partition Parseval control, Moebius
    batteries on two representatives, and the 0.39-reproduction
    comparison against the character-construction reading.
  status: approved
  assigned_to: executor
  approved_by: coordinator
  approval_decision: DEC-20260921-49e0f1
  approval_basis: >-
    AGENTS.md standing user authorization of 2026-09-06; Coordinator
    protocol-completeness check passed. Budget advisory; 8 GiB memory
    ceiling machine protection only.
  recorded_at: '2026-09-21'
  inference:
    requested_policy: executor-implementation
    runtime: null
    resolved_model_id: null
    model_verified: false
    reasoning_effort: null
    fallback_used: false
    degraded_requirements: []
    session_identity: null
    provenance_note: >-
      Designed and executed in the top-level coordinator session under
      the respective role contracts (role-runtime outage, AWS
      DescribeInstances AuthFailure, recorded in DEC-20260921-4d1b40).
  scale_relevance:
    tier: toy
    justification: >-
      The census's primary ladder verbatim; exact computation; readings
      feed necessary-condition gates only.
    correspondence: null

  observable_definition:
    note: >-
      For a partition g: F_p -> {0..M-1} with levels A_0..A_{M-1} and
      probability-normalised level indicators v_c = 1_{A_c}/|A_c|, the
      partition observable is the t != 0 level-character combined norm
      ||g||_{1,*} = max over t in {1..M-1} of sum over k != 0 of
      |g-hat_t(k)|, where g-hat_t(k) = sum over c of
      omega^{t*c} * v-hat_c(k) with omega = exp(2*pi*i/M) (complex
      roots of the level index t; frozen). This is ffe1df's own battery
      object and the quantity f68c7f's A(v) consumes; the census
      measured only single sets. lambda is fitted on log||g||_{1,*}
      vs log p. The M = 2 partition is a single set (the popcount-parity
      level set, i.e. the digit-character run's VT row), serving as the
      bridge that must reproduce the census/character readings.

  rows:
    - id: POP2
      construction: >-
        M = 2 popcount partition (parity levels); the bridge row -- its
        lambda must reproduce RUN-ECDLP-ee15df's VT reading on the same
        ladder within 2SE.
    - id: POP4
      construction: M = 4 popcount partition, levels = popcount mod 4.
    - id: POP16
      construction: M = 16 popcount partition, levels = popcount mod 16
        (the ffe1df battery's own M; the 0.39-reproduction row).
    - id: POP64
      construction: M = 64 popcount partition, levels = popcount mod 64.
    - id: RES4
      construction: M = 4 residue partition, levels = x mod 4.
    - id: RES16
      construction: M = 16 residue partition, levels = x mod 16.
    - id: POP16M
      construction: >-
        The M = 16 popcount partition composed with the frozen-hash
        Moebius map (stream SHA256(EXP-ECDLP-ff8f9e:C03:moebius:POP16:
        <counter>); the level function is evaluated on the permuted
        domain, pole rule as the census battery).
    - id: RES4M
      construction: as POP16M with the RES4 stream.
    - id: C02P16
      construction: >-
        Random-partition control at M = 16: levels assigned by the
        frozen sign stream (SHA256(EXP-ECDLP-ff8f9e:C02P:sign:A:<block>),
        16 levels from 4 bits per digest block); analytic level 0.5
        (each g-hat_t is a random-phase combination of random-set
        indicators at density 1/16, so the combined norm sits at the
        partition Parseval level lambda = 0.5 with an M-dependent
        constant).
    - id: C02P16B
      construction: as C02P16 with seed set B (seed agreement, top-8
        subfit window per the cross-ratio run's disclosed correction).
    - id: C01
      construction: v = 1/p everywhere (level-set endpoint; the
        partition observable is trivially zero for the one-level
        partition and is not applied to C01; C01 is retained as the
        transform's endpoint check with its set reading).

  ladder:
    note: The census's frozen primary ladder VERBATIM.
    primes: [4099, 8209, 16411, 32771, 65537, 185369, 524309, 1482919, 4194319, 16777259]

  controls:
    - POP2 bridge: reproduces RUN-ECDLP-ee15df's VT lambda (0.4063 +-
      0.0079) within 2SE on the same primes.
    - C02P16 at the partition Parseval level 0.5 +-(2SE + 0.02), with
      C02P16B seed agreement on the top-8 subfit.
    - vhat(0) = 1 within 1e-9 for every level indicator of every ok
      partition cell.
    - The t-combination identity checked numerically at one prime:
      g-hat_t(k) = sum_c omega^{tc} v-hat_c(k) to 1e-9.
    - Checker battery: naive O(p^2) DFT spot at the smallest prime and
      a second independently structured chirp-z at a mid prime on one
      level indicator and one t-combination, agreement 1e-9.

  independent_variables:
    - partition family and M (popcount 2/4/16/64, residue 4/16)
    - Moebius composition (POP16, RES4)
    - prime (frozen ladder)

  primary_metrics:
    - fitted lambda of log||g||_{1,*} per partition with SE, jackknife.
    - level difference delta = lambda(partition) - lambda(C02P16) with
      combined SE (convention-free).
    - Moebius deviation on the two representatives beyond 2SE.
    - the 0.39-reproduction reading: lambda(POP16) point estimate
      against [0.36, 0.42] with the VT (character) reading cited.

  verdict_vocabulary:
    - stable_above_random: Moebius stable AND delta > 2SE (candidate;
      replicate before any use)
    - unstable: Moebius deviation beyond 2SE on a representative
    - stable_flat: Moebius stable AND |delta| <= 2SE
    - unresolved: guard failures or missing cells
    - void_control_failure: any control failure voids the run

  stopping_rules:
    - First failed control halts dependent reads and marks the run void
      with the defective control named.
    - Memory above 8 GiB checkpoints the cell resource_exhaustion with a
      continuation pointer (machine protection only).
    - No row, prime, seed, or rule change after any cell outcome.

  invalidation_rules:
    - Composite-length surrogate DFT or a non-canonical normalisation.
    - The POP2 bridge failing to reproduce the VT reading silently
      absorbed instead of voiding.
    - Level indicators not probability-normalised (vhat(0) != 1).
    - The t-combination computed in F_p roots instead of the frozen
      complex roots of the level index.

  success_criterion: >-
    The single frozen run completes all partition cells (10 rows x 10
    primes), all controls pass (POP2 bridge, C02P16 level with seed
    agreement, vhat(0)=1 per level, the t-combination identity, the
    checker spots), and every partition carries one of the frozen
    verdicts with its delta and battery reading on record, plus the
    0.39-reproduction comparison statement either way.

  falsification_criterion: >-
    Any control failure voids the run (infrastructure, never
    mathematical evidence). A partition reading stable AND above the
    partition Parseval level is the positive outcome and triggers
    replicate, not support. All-flat-or-unstable extends the census
    negative from sets to partitions at the measured scope, leaving the
    non-set escape hatch (IDEA-20260921-4af08b) as the synthetic lane's
    remaining direction. The hypothesis's prediction that POP16
    reproduces the ffe1df band is falsified if it reads outside it with
    passing controls -- recorded with both constructions side by side.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
