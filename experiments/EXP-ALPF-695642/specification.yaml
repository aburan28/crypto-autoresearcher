experiment:
  id: EXP-ALPF-695642
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-fe3526; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-fe3526
  question_id: RQ-ALPF-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Compose measured false-positive rate, detection power and assumed base rate into a posterior-odds
    surface for a fired ALPF cell, and attribute discrimination across the screen's four pipeline
    stages by ablation with a coin-screen null.
  objective: 'The one uncertainty a run reduces is what a Coordinator should conclude from a fired
    ALPF cell. Stated as parts: (i) does the composition code behave, verified by running the identical
    procedure on a null screen that fires independently of the instance at a matched marginal rate,
    whose posterior surface must equal the prior odds at every base rate within Monte Carlo error,
    since a composition that fails this is producing arithmetic artifacts rather than decision information;
    (ii) over the plausible ranges of false-positive rate and detection power, and over a base-rate
    axis from 0.001 to 0.5 declared as a free parameter rather than assumed, where does the posterior-odds-equals-one
    contour lie per degree profile, and how sensitive is it to the input intervals; (iii) reimplementing
    the archived screen as four separable stages -- meter self-validation gate, degree-profile computation,
    first-fall comparison, cost comparison against rho -- and verifying the reimplementation reproduces
    the archived verdicts, how much does each stage contribute to discrimination when ablated, and
    is any stage measurably inert. Reducing these gives the lane a stated decision rule in place of
    an implicit one.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: under the stated input
      measurements and their intervals, for these profiles, the posterior odds that a fired cell is
      real are as reported across the base-rate axis, and the per-stage ablation contributions are
      as tabulated. What does NOT follow: that any base rate is the right one, since none has been
      measured; that any particular fired cell is or is not real; that the screen should be trusted
      or discarded; that the stage decomposition is the only valid one; and no attack, speedup or
      security consequence of any kind. A posterior surface is conditional arithmetic whose inputs
      are named, and it becomes a decision only when a Coordinator declares a prior on the record.'
  inputs:
    procedure: 'STAGE 0 (cost: 0 compute): collect the three input measurements with their intervals
      if committed; otherwise declare them swept parameters and record that this is the degraded form.
      STAGE 1 (cost: minutes): implement the composition and the Monte Carlo propagation; run the
      null screen and require its surface to equal the prior odds. STAGE 2 (cost: minutes): compute
      the posterior surface over the (fpr, power, base rate) grid per profile and extract the odds-equals-one
      contour with intervals. STAGE 3 (cost: ~1 day human): reimplement the archived screen as four
      separable stages and verify it reproduces the archived cell verdicts from the transcribed tables.
      STAGE 4 (cost: ~1 CPU-hour): for each stage, recompute fpr and power on the existing instance
      data with that stage bypassed, and with that stage replaced by a matched coin, and recompute
      the surface. STAGE 5 (cost: minutes): report per-stage contribution as the contour shift with
      a bootstrap interval, plus the cumulative ablation sequence. STAGE 6 (cost: 0): emit the follow-up
      decision table keyed to a declared base rate.'
    instrument: Python 3 only, no Sage and no new cryptographic computation. A hand-written Bayes
      composition and Monte Carlo propagator in pure Python; the stagewise screen reimplementation
      built on the shared pure-Python Macaulay-rank meter module and harness/semaev.py, reusing instance
      data generated by the companion measurements rather than regenerating it; harness/runner.py
      for manifests, seeds and the inference block; templates/research-records.md for how the decision
      table is recorded as an artifact.
    parameters: 'Base-rate grid: 0.001 to 0.5 on 50 log-spaced points. False-positive rate sweep:
      0.01 to 0.30 on 30 points. Power sweep: 0.05 to 0.99 on 30 points. Profiles: the same set as
      the companion null-rate measurement, at minimum [4,4,4,12], [2,2,2,4] and [2,3,4,12]. Monte
      Carlo: 20000 draws per grid point, repeated at 40000 for the convergence control. Stages ablated:
      4, individually and in cumulative sequence. Bootstrap: 1000 resamples for contour intervals.
      Null screen: matched marginal fire rate, 10000 synthetic cells.'
  controls:
  - Null screen firing independently of the instance at the matched marginal rate, whose posterior
    surface must equal the prior odds everywhere.
  - 'Stage-replacement control: each ablated stage replaced by a coin of matched fire rate rather
    than removed, separating information loss from marginal-rate change.'
  - 'Archived-verdict reproduction: the stagewise reimplementation must reproduce the archived cell
    verdicts before any ablation is trusted.'
  - 'Monte Carlo convergence control: the surface recomputed at two Monte Carlo sample sizes with
    the difference reported.'
  - 'Input-degradation control: the composition rerun with each input replaced by its interval endpoints,
    so the surface''s sensitivity to input uncertainty is visible.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a screen whose fire decisions are drawn independently
    of the instance, at the measured marginal fire rate -- a coin of the right bias. The IDENTICAL
    composition and IDENTICAL ablation procedure run on it in the same invocation. For the composition
    to mean anything the null screen must produce a posterior surface identically equal to the prior
    odds at every base rate, and every ablation must move it by zero within Monte Carlo error. If
    the null screen''s surface departs from the prior, the composition code is wrong and no result
    may be reported. A second null re-runs the ablation with a stage replaced by a coin of matched
    fire rate rather than removed, which distinguishes ''this stage carries information'' from ''removing
    this stage changes the pipeline''s marginal fire rate''.'
  independent_variables:
  - assumed base rate
  - input false-positive rate
  - input detection power
  - ablated pipeline stage
  - ablation mode (removed vs replaced by matched coin)
  metrics:
    primary:
    - posterior-odds surface per profile
    - odds-equals-one contour per profile with Monte Carlo interval
    - per-stage discrimination contribution with bootstrap interval
    - null-screen surface deviation from the prior odds
    secondary:
    - archived-verdict reproduction rate of the stagewise reimplementation
    - surface sensitivity at each input interval endpoint
    - Monte Carlo convergence difference between 20000 and 40000 draws
    - cumulative-ablation sequence contributions
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The minimum base rate at which a fired ALPF cell has posterior odds above 1 of being
      real, per degree profile, and each pipeline stage's contribution to that contour.
    formula: 'posterior_odds(profile, pi) = (power(profile) * pi) / (fpr(profile) * (1 - pi)), with
      power and fpr drawn from their measured posteriors in the Monte Carlo. The contour is pi* (profile)
      = fpr / (fpr + power) obtained by setting the odds to 1, reported with its propagated interval.
      Stage contribution = pi*(ablated) minus pi*(full), bootstrapped. Pre-registered predictions:
      the null screen yields posterior_odds = pi / (1 - pi) at every point within Monte Carlo error;
      at least one of the four stages has a contribution indistinguishable from zero. No value is
      pre-committed for pi* itself, because it is a direct function of measurements not yet made.'
    source: Pre-registered in the parent proposal IDEA-20260816-fe3526 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: The inputs are measurements at 13 to 17 bit primes with archived toy factor-base
      sizes, so every output is scoped to that regime. No transfer to medium or cryptographic scale
      is assumed or claimed, and the base-rate axis is explicitly a declared parameter rather than
      an estimate transported from anywhere. The decision table is stated to apply to toy-scale ALPF
      follow-up decisions only.
    correspondence: null
  tail_checks:
  - Report the surface at the input intervals' extreme endpoints, since a contour that is robust at
    the centre and unstable at the edges is not usable.
  - Report the ablation whose contribution has the widest bootstrap interval, since an unresolved
    stage is more informative than a confidently inert one.
  - Report any grid point where the Monte Carlo produced a degenerate odds value (division by a near-zero
    fpr draw), individually.
  - Report the cells the stagewise reimplementation failed to reproduce, individually, since these
    bound the ablation's validity.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort if the null-screen surface departs from the prior odds beyond Monte Carlo error.
  - Report only the parameter-swept surface and skip the ablation if the stagewise reimplementation
    fails to reproduce more than 10 percent of archived verdicts.
  - Hard stop at 2 total CPU-hours; this entry is not compute-bound.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The null screen reproduces the prior odds everywhere, a posterior surface and
    odds-equals-one contour with intervals are reported for every profile, and a per-stage ablation
    table with bootstrap intervals is emitted or explicitly skipped with its reason.
  falsification_criterion:
  - Null-screen surface departing from the prior odds.
  - Measured power equal to the measured false-positive rate, making the posterior equal to the prior
    at every base rate.
  - Stagewise reimplementation failing to reproduce the archived verdicts.
  - All four stage contributions indistinguishable from zero.
  - Odds-equals-one contour above base rate 0.5 for every profile.
  - Input intervals wide enough that the contour spans the whole base-rate axis.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-fe3526
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The four-stage decomposition of the archived screen must be agreed by a Coordinator against experiments/EXP-ALPF-006/
    and EXP-ALPF-010/ before any ablation is meaningful, since a different decomposition attributes
    differently.
  - Whether this contract may be approved in its degraded parameter-swept form, before the companion
    measurements exist, is a Coordinator decision and changes what the run delivers.
  - The independence assumption between screened cells is known to be violated per the multiplicity
    entry; a Coordinator must decide whether to compose with the effective cell count instead of the
    raw one.
  - Who declares the base rate, and where it is recorded so it cannot be chosen after seeing the surface,
    needs a stated procedure before approval.
