experiment:
  id: EXP-TORS-6e93c6
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-c98c3d
  question_id: RQ-TORS-8c7b79
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: THE ELKIES/ATKIN SPLIT PATTERN AS A K-INDEPENDENT ISOGENY-CLASS FINGERPRINT -- stated up
    front to carry zero information about k, and proposed instead as (i) a polylog class-membership
    sieve that replaces O(sqrt(p)) point counting in the enumeration L1 requires, and (ii) a cost
    predictor telling the campaign in advance which curves are cheap to walk from
  status: draft
  objective: "(A) THE K-INDEPENDENCE, STATED FIRST AND WITHOUT QUALIFICATION, BECAUSE THE LANE'S HARD\
    \ CONSTRAINT DEMANDS IT. For each prime ell != p, the classification of ell as Elkies (X^2 - tX\
    \ + p has a root mod ell, equivalently t^2 - 4p is a square mod ell), Atkin (no root), or ramified\
    \ (ell divides t^2 - 4p) is a function of (t, p, ell) ALONE. The factorisation type of psi_ell\
    \ over F_p and the Galois-module structure of E[ell] are likewise determined by the action of\
    \ Frobenius, whose characteristic polynomial is X^2 - tX + p. NONE of these reads P or Q. Therefore\
    \ the whole Elkies/Atkin fingerprint is a CURVE-ONLY statistic and is INDEPENDENT OF k BY CONSTRUCTION.\
    \ No experiment is needed to establish that and none is proposed; the static provenance gate of\
    \ IDEA-20260807-bd5d91 would reject any k-correlation study of this statistic before it ran. This\
    \ record therefore does not ask whether the fingerprint leaks k. It asks what else it is worth.\n\
    (B) IT IS AN ISOGENY-CLASS INVARIANT, WHICH IS WHAT MAKES IT A FINGERPRINT. Two curves over F_p\
    \ are F_p-isogenous exactly when they have the same number of points, hence the same trace t (Tate).\
    \ Since the Elkies/Atkin classification depends only on (t, p, ell), the ENTIRE PATTERN over any\
    \ set of primes is CONSTANT ON AN F_p-ISOGENY CLASS. So the pattern is a necessary condition for\
    \ class membership: if E and E'' disagree at any ell, they are in different classes. This is [fact]\
    \ and follows from DECOMPOSITION.md T4 (\"fixing the class fixes t\").\n(C) USE 1 -- A CLASS-MEMBERSHIP\
    \ SIEVE, WITH THE ARITHMETIC DONE HONESTLY. L1 (RQ-ICINV-475b5e) is the campaign's gating lane\
    \ and its decisive test requires ENUMERATING A WHOLE TOY ISOGENY CLASS. The naive route is to\
    \ compute #E for every candidate curve: harness/toycurve.py offers order() at O(p) and order_bsgs()\
    \ at O(sqrt(p)) scalar multiplications. The fingerprint route is:\n  - For each ell in L = {3,5,7,11,13},\
    \ build psi_ell over F_p once per curve\n    (degree (ell^2-1)/2, i.e. 4, 12, 24, 60, 84) and\
    \ factor it over F_p.\n  - Elkies detection: a Galois-stable order-ell subgroup exists exactly\
    \ when a\n    degree-(ell-1)/2 kernel polynomial divides psi_ell; found by testing which\n   \
    \ products of irreducible factors have a root set closed under the x-only\n    group law.\n  -\
    \ For Elkies ell, the eigenvalue lambda in F_ell can be pinned by testing the\n    eigenvalue\
    \ relation on the kernel, giving t ≡ lambda + p/lambda mod ell.\n    This determines t mod ell\
    \ EXACTLY.\n  - For Atkin ell, the split degree of psi_ell constrains t mod ell to a proper\n\
    \    subset. This record marks the exact Atkin constraint as [open] -- it is\n    standard SEA\
    \ material but is NOT re-derived here, and the sieve's declared\n    strength uses ONLY the Elkies\
    \ primes.\nCOST ARITHMETIC, stated as inequalities rather than as a promised speedup. Per curve\
    \ the fingerprint costs O(sum_ell ell^2 * polylog p) field operations -- polynomial in log p and\
    \ independent of p's size in the leading term -- versus O(sqrt(p)) group operations for order_bsgs.\
    \ At p ~ 2^32 that is roughly a few thousand field operations against ~65536 scalar multiplications,\
    \ so the per-curve screen is cheaper by orders of magnitude at exactly the sizes this campaign\
    \ runs. The sieve's SELECTIVITY is the measured quantity: a candidate curve survives only if its\
    \ t mod ell agrees with the target class at every Elkies ell, and the retention rate is predicted\
    \ to be about prod_{Elkies ell in L} (1/ell). With an expected 2 to 3 Elkies primes among {3,5,7,11,13}\
    \ (see H1), the typical modulus is a product like 3*7 = 21 or 3*7*13 = 273, so the predicted retention\
    \ is between roughly 1/21 and 1/1001, with 1/15015 as the best case when all five are Elkies.\
    \ THE RANGE IS WIDE AND IS REPORTED AS A RANGE; a single figure would be dishonest.\n(D) USE 2\
    \ -- A COST PREDICTOR FOR OTHER LANES. The number and identity of Elkies primes determines which\
    \ small-ell transports (IDEA-20260807-053a55) are available from a given curve, hence the branching\
    \ factor of any isogeny walk (IDEA-20260807-631e80), hence the cost of L2's volcano construction.\
    \ A curve with zero Elkies primes among the declared L admits NO cheap small-ell transport at\
    \ all and is a dead end for those lanes. Knowing this BEFORE spending a walk budget is the predictor's\
    \ value. This is also, for completeness, the classical role of Elkies primes: they are what makes\
    \ SEA subexponential rather than exponential in log p, and the least Elkies prime is bounded by\
    \ (2 log 4q + 4)^2 under GRH (KN-LIT-1175, relayed from abstract).\n(E) TWO OUTCOMES, BOTH DELIVERABLES.\n\
    \  OUTCOME 1 -- the sieve's measured retention rate matches prod 1/ell over the\n    Elkies primes.\
    \ The fingerprint is a working, quantified screen and the\n    campaign gains a tool with a known\
    \ selectivity, which is what L1 needs to\n    size its enumeration budget.\n  OUTCOME 2 -- the\
    \ retention rate is materially worse than predicted. Then\n    either the eigenvalue pinning is\
    \ not determining t mod ell as claimed\n    (an implementation or theory error, which the frozen\
    \ fixture will localise)\n    or the candidate curve population is not behaving like uniform t,\
    \ which is\n    itself a fact about harness/toycurve.py's generator that every other lane\n  \
    \  needs to know. Both are useful; neither is a non-event."
  resource_label: R5
  admissibility: admissible
  admissibility_argument: 'ADMISSIBLE AS A RESOURCE USE, WITH ZERO ATTACK VALUE CLAIMED. The fingerprint
    reads E[ell] as a Galois module -- the factorisation of psi_ell over F_p and the existence of
    Frobenius eigenvectors -- which is field-level data that the generic group oracle does not supply
    and cannot simulate: a GGM simulator holding only group handles has no access to psi_ell at all.
    So R5 genuinely escapes the generic model here. The escape buys nothing about k, and the record
    says so in claim (A) rather than trading on the admissibility label. This is the case the DECOMPOSITION.md
    filter does not directly cover: a resource can escape the generic model and still be useless for
    key recovery because it never touches the point. Recording that as a distinct outcome category
    is part of the contribution.'
  reachability_gate: 'REQUIRED AND ANSWERED, because the sieve''s purpose is to support movement between
    curves. IS A GOOD OBJECT REACHABLE, AND AT WHAT COST? The fingerprint is NOT a reachability tool
    -- it identifies the CLASS, not a curve within it, and by claim (B) it is constant on the class,
    so it can never guide a walk toward a particular curve. Under T5 that places it firmly on the
    "global address" side of the dichotomy for within-class navigation: useless. Where it DOES bear
    on reachability is one level up, as a NECESSARY-CONDITION FILTER on which candidate curves are
    even in the class before any walk is attempted, and as the predictor of how many small-ell transports
    exist from a given curve (STEP 5), which is the branching factor every walk cost depends on. Stating
    that it cannot guide within-class navigation is as important as stating what it can do, because
    "fingerprint" invites exactly the wrong inference.'
  inputs:
    procedure: 'STAGE 0 (zero compute): write the k-independence statement (claim A) and the class-invariance
      argument (claim B). Both are complete without any run and both are required outputs regardless
      of what follows. STAGE 1 (hours): implement psi_ell and the two Elkies tests; run the 100-percent
      agreement check. HARD GATE. STAGE 2 (hours): eigenvalue pinning with the exact-t cross-check
      on the ell=3 frozen fixture, then across the grid. HARD GATE at ell = 3. STAGE 3 (hours): the
      sieve measurement -- retention and precision at |L| = 1..5, against the random-fingerprint null,
      at 20/24/28 field bits, with a declared candidate population of at least 200 curves per cell.
      STAGE 4 (minutes): construct false-positive pairs by choosing congruent traces, confirming the
      method ceiling empirically. STAGE 5 (hours): the predictor table for downstream lanes. BUDGET:
      ell capped at 13 (deg psi_13 = 84) because polynomial factorisation cost, not field size, is
      the driver in pure Python; the whole line is sized at a few CPU-hours and no cell exceeds 28
      field bits.'
    mechanism: 'STEP 1 -- build psi_ell over F_p for ell in {3,5,7,11,13} (shared code with IDEA-20260807-df906f
      and IDEA-20260807-053a55; degrees 4, 12, 24, 60, 84).

      STEP 2 -- classify each ell: compute t exactly at toy scale via harness/toycurve.py''s order()/order_bsgs(),
      then test whether t^2 - 4p is a square, a non-square, or zero mod ell. Independently, factor
      psi_ell over F_p and search for a Galois-stable order-ell kernel. THE TWO ROUTES MUST AGREE
      ON EVERY CURVE: Elkies by the trace test if and only if a rational kernel exists. That agreement
      is a cross-check the implementation gets for free and is the single most valuable instrument
      control in this proposal, because it validates the kernel-extraction code that IDEA-20260807-053a55
      depends on.

      STEP 3 -- eigenvalue pinning for Elkies ell: for a rational kernel C with kernel polynomial
      h_C, find lambda in F_ell with Frobenius acting on C as multiplication by lambda, by testing
      x(pi(T)) = x([lambda]T) for a root T of h_C, i.e. comparing x^p mod h_C against the lambda-th
      division-polynomial x-coordinate expression mod h_C. Then t ≡ lambda + p*lambda^{-1} mod ell.
      Cross-check against the exactly known t. AT TOY SCALE THIS CROSS-CHECK IS AVAILABLE AND IS MANDATORY
      -- it is the reason to do this at toy scale at all, because at cryptographic scale t is what
      one is trying to compute and no check exists.

      STEP 4 -- the sieve measurement: fix a target class by choosing one curve E_0 and computing
      its fingerprint. Draw a large population of random curves over the same p. Report (i) the fraction
      surviving the fingerprint screen, (ii) the fraction of survivors that are ACTUALLY in the class
      (verified by exact point counting), and (iii) the total wall clock of the screened enumeration
      versus the unscreened one. Metric (ii) is the precision and metric (i) is the retention; a sieve
      with high retention and low precision has failed even if it is fast.

      STEP 5 -- the predictor table: for 50 curves per field size, record the number and identity
      of Elkies primes among L, and the resulting available transport branching factor. Hand this
      table to L1, L2, L13 and IDEA-20260807-631e80 as the budgeting input.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - random-fingerprint null with matched label marginals (blocking)
  - fingerprint invariance across a verified transport (blocking)
  - trace-test versus kernel-test agreement (blocking)
  - eigenvalue pinning against exactly known t (blocking)
  - constructed false-positive pair (method-ceiling demonstration)
  - anomalous and smooth-order curve exclusion per KN-TECH-034 before any timing
  - 'NULL OBJECT (from the proposal): MANDATORY AND SUPPLIED. MATCHED NULL OBJECT: a RANDOM FINGERPRINT
    of the same shape -- assign each curve a vector of |L| labels drawn from the same marginal distribution
    as the real Elkies/Atkin labels (estimated from the population) but INDEPENDENT of the curve.
    Screening on the random fingerprint must retain a fraction equal to the product of the label match
    probabilities and must have PRECISION EQUAL TO THE CLASS''S BASE RATE -- i.e. it must find no
    true class members beyond chance. If the real fingerprint''s precision does not exceed the random
    fingerprint''s, the sieve is doing nothing and the tool is worthless. DECAY PARAMETER: the number
    of primes |L| in the fingerprint. The real fingerprint''s precision must RISE toward 1 as |L|
    grows from 1 to 5, because each additional Elkies prime multiplies the constraint on t. A precision
    that is flat in |L| is the canonical artifact tell -- it would mean the screen is keying on something
    other than t. SECOND CONTROL, in the opposite direction: two curves KNOWN to be in the same class
    (constructed by applying one verified Elkies transport from IDEA-20260807-053a55) must have IDENTICAL
    fingerprints at every ell. A fingerprint that differs across a verified isogeny is not a class
    invariant and the tool is broken.'
  independent_variables: []
  metrics:
    primary:
    - class_ell per (curve, ell) by both routes, with agreement flag
    - pinned lambda and derived t mod ell versus exact t
    - retention and precision per |L| per field size, with the random-fingerprint null
    - wall clock, screened versus unscreened, per field size
    secondary:
    - Elkies-prime count distribution over the curve population
    - available transport branching factor per curve
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Agreement between the trace-based Elkies test (t^2 - 4p a square mod ell) and the rational-kernel
      existence test, over 50 curves x 5 primes x 3 field sizes
    formula: 100 percent agreement. A single disagreement is an implementation error in the kernel
      extraction and blocks IDEA-20260807-053a55 as well. BASIS - standard (Elkies condition equals
      existence of a Frobenius eigenvector on E[ell] equals existence of a Galois-stable order-ell
      subgroup); used here as a KNOWN-ANSWER CALIBRATION and NOT re-derived.
    source: pre-registered in IDEA-20260807-c98c3d before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - The ramified case ell | (t^2 - 4p) is neither Elkies nor Atkin in the clean sense and must be
    a third label. Folding it into either side corrupts both the classification and the retention
    arithmetic.
  - Curve-generator bias. harness/toycurve.py picks p and then searches deterministically for a curve
    with a usable subgroup; the resulting trace distribution is NOT guaranteed uniform, and the sieve's
    measured retention is a joint property of the sieve and the generator. Any figure must name the
    generator and its seeds.
  - Base rate. If the target class is large relative to the candidate population, precision is high
    for trivial reasons. The class size must be reported alongside precision or the number is uninterpretable.
  - Pure-Python constants. The screened-versus-unscreened timing compares a polynomial-arithmetic
    cost against a scalar-multiplication cost in the same interpreter; the crossover point is an artefact
    of the implementation and does not transfer to a compiled or Sage-based harness. Stated with every
    timing.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 100 percent agreement. A single disagreement is an implementation error in the
    kernel extraction and blocks IDEA-20260807-053a55 as well. BASIS - standard (Elkies condition
    equals existence of a Frobenius eigenvector on E[ell] equals existence of a Galois-stable order-ell
    subgroup); used here as a KNOWN-ANSWER CALIBRATION and NOT re-derived.
  falsification_criterion:
  - The trace test and the kernel test disagree on any curve. Implementation error; the line halts
    and IDEA-20260807-053a55's kernel extraction is implicated too.
  - A verified Elkies transport changes the fingerprint. Then either the transport is not an isogeny
    or the fingerprint is not a class invariant; both are hard failures and neither is a mathematical
    result until replicated.
  - Pinned lambda gives t mod ell disagreeing with the exactly known t. STEP 3 is wrong; the sieve's
    selectivity claim is withdrawn.
  - Retention is flat in |L| or precision does not exceed the random-fingerprint null. The sieve is
    not working and the tool is not delivered. This is a real possible negative and it is the reason
    the null is blocking.
  - Screened enumeration is SLOWER than unscreened at every tested size. The tool is dominated by
    the incumbent and should not be adopted; this is a legitimate and informative negative, recorded
    with the measured constants.
  - Degree-84 factorisation exceeds the wall-clock budget at 28 bits. INFRASTRUCTURE outcome under
    AGENTS.md rule 5; the declared ell ladder is reduced and the reduction is recorded, not read as
    a mathematical result.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
