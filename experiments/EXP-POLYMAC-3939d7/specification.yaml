experiment:
  id: EXP-POLYMAC-3939d7
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-5a8d47; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-5a8d47
  question_id: RQ-POLYMAC-7c89e4
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exhaustive survivor-set collapse curves under a self-supplied repeated-nonce model in toy
    binary-field and prime-field polynomial MACs, with a per-nonce key-refresh arm and a random-function
    generic null
  objective: The uncertainty reduced is what the nonce-misuse failure looks like as a shape rather
    than as a word, and whether that shape is a property of the polynomial construction or of the
    authentication key persisting across nonces. (i) Compute, exhaustively over the full key space,
    the nested sequence of surviving key candidates as repeated-nonce pairs accumulate, for many independently
    self-generated transcripts, so the primary quantity is a counted cardinality distribution rather
    than an estimate. (ii) Run a per-nonce key-refresh arm whose survivor curve must be exactly flat,
    which is simultaneously the persistence control and the experiment's own leak detector - any shrinkage
    there means the transcript generator reveals more than it should and no other number in the run
    may be read. (iii) Run a random-function generic null on the same axes to establish how much of
    the observed collapse is generic information accumulation and how much is the degree ceiling of
    the polynomial structure. The run does not measure, estimate or project the cost of key recovery
    in any deployed construction.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: at n in {12, 16}, for the declared
      toy constructions and the self-supplied repeated-nonce model with an idealised mask, the surviving-candidate
      distribution as a function of r and L is exactly the tabulated one, the key-refresh arm is flat,
      and the generic null differs from the signal arms by the tabulated amount. WHAT DOES NOT FOLLOW:
      nothing about AES-GCM, ChaCha20-Poly1305 or any protocol; no cost of key recovery at deployed
      parameters; no claim that any deployment repeats nonces; no attack, and no statement about any
      traffic other than the traffic this experiment generated for itself.'
  inputs:
    procedure: 'STAGE 0 (cost: hours, human): freeze the misuse model, the mask-cancellation convention,
      the persistence-arm definition and the transcript count; record the mask-cancellation question
      as a derivation gap. STAGE 1 (cost: seconds): assert the code path has no external input capability
      and record that assertion in the manifest. STAGE 2 (cost: minutes): generate 2000 transcripts
      per (field, L) with self-generated keys and messages, up to r = 8. STAGE 3 (cost: minutes):
      compute nested survivor sets by bitmap intersection over the full key space, recording cardinality
      after each r and asserting the true key is always present. STAGE 4 (cost: minutes): run the
      key-refresh arm identically and assert flatness. STAGE 5 (cost: minutes): run the generic null
      identically. STAGE 6 (cost: seconds): emit distributions, medians, r-to-uniqueness values, and
      the manifest.'
    instrument: Python 3 standard library. Binary field by shift-and-XOR with pinned reduction polynomial,
      prime field with native int. Survivor sets as Python int bitmaps so intersection is a bitwise
      AND and cardinality is a popcount. Transcript generation from secrets or a seeded PRNG recorded
      in the manifest, entirely internal. Difference-polynomial construction shared with this batch's
      enumeration module. Manifest and inference block via harness/runner.py. No Sage, no network,
      no external data of any kind.
    parameters: 'Widths n in {12, 16}, both fields, five primes per width for the prime arm. Message
      lengths L in {2, 4, 8}. Repeated-nonce pairs r from 1 to 8. Transcripts: 2000 per (field, L,
      arm). Arms: signal (persistent authentication key), key-refresh (fresh authentication key per
      nonce), generic null (random-function digest). Seeds: 3 fixed seeds with the distributions required
      stable across them to within their sampling intervals.'
  controls:
  - 'Key-refresh arm: authentication key redrawn per nonce, survivor curve must be exactly flat.'
  - 'Generic null: random-function digest, transcripts generated identically, no degree ceiling expected.'
  - 'Degree assertion after r = 1: survivor count at most the difference polynomial degree in every
    field-arm transcript.'
  - 'Self-generation assertion: the run records that no input file, network fetch or external key
    material was read, and the code path has no such capability.'
  - Both fields through one code path with the field as a parameter, so the persistence arm and the
    field arm cannot be confounded by implementation.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The generic null runs in the same invocation: transcripts generated
    under a random-function digest of the same output width, where each pair is consistent with a
    uniformly random subset of keys of the expected generic size, and the survivor set shrinks at
    a rate with no degree ceiling. For the signal arm to mean anything, the null must show the generic
    shrinkage rate and must NOT show the degree-ceiling plateau; if the null also plateaus, the plateau
    is an artifact of the intersection code rather than of polynomial structure. The second control
    is the key-refresh arm, which is a null for persistence specifically: with a fresh key per nonce
    the survivor curve must be FLAT at the full key space, and any shrinkage there is a leak in the
    experiment''s own construction that would invalidate every signal number.'
  independent_variables:
  - field type (binary extension, prime, random-function null)
  - key persistence (persistent, per-nonce refresh)
  - number of repeated-nonce pairs r
  - message length L
  metrics:
    primary:
    - survivor-set cardinality after each r, per transcript
    - median survivor count against r per (field, L, arm)
    - r at which the median survivor count reaches 1
    - key-refresh arm survivor curve (required flat)
    secondary:
    - full survivor-count distribution including tails
    - fraction of transcripts where the true key remains in the survivor set (required 1)
    - generic null survivor curve
    - seed-to-seed stability of the medians
    - wall clock per arm
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The median surviving-candidate count S(r) as a function of the number of repeated-nonce
      pairs, per field, per length, per arm; and r_unique, the smallest r at which the median S(r)
      equals 1.
    formula: 'S(r) is the cardinality of the intersection over the r observed pairs of the root sets
      of their difference polynomials, taken over the full key space. Predicted: S(1) is at most the
      difference polynomial degree exactly in both field arms; the key-refresh arm satisfies S(r)
      equal to the full key space for every r; the generic null satisfies S(r) approximately |key
      space| * 2^(-r * tag width) with no plateau.'
    source: Pre-registered in the parent proposal IDEA-20260816-5a8d47 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'n = 12 and 16, chosen because the survivor set is a subset of an enumerable key
      space so every cardinality is counted exactly and the whole distribution including its tail
      is available. No extrapolation to deployed widths is made and none is offered: the contract
      states its numbers as properties of the tested widths, and the r-to-uniqueness value in particular
      is expected to depend on width in a way this contract does not model and does not project.'
    correspondence: null
  tail_checks:
  - r = 0 must give the full key space in every arm
  - transcripts where the difference polynomial is identically zero (both messages equal) must be
    excluded explicitly and counted, not silently intersected as the full space
  - the upper tail of the survivor distribution at each r must be reported, since the median can reach
    1 while a nontrivial fraction of transcripts remain ambiguous
  - L = 2, where the degree ceiling is tightest, must be checked in closed form against a hand computation
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - halt immediately if the true key is ever absent from a survivor set
  - halt if the key-refresh arm shows any shrinkage
  - stop increasing r once the median reaches 1 and the upper decile has stopped moving, recording
    the r at which that occurred
  - cap total wall clock at 3600 seconds; on exceeding, drop n = 16 and record the reduction
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All three arms complete in one invocation at both widths, the key-refresh arm
    is exactly flat, the true key is present in every survivor set, and the survivor-count distribution
    against r is emitted per field and length with its tails.
  falsification_criterion:
  - key-refresh arm shows shrinkage
  - true key absent from any survivor set
  - survivor count after one pair exceeds the polynomial degree
  - generic null shows a degree-ceiling plateau
  - signal and null curves coincide within the resolution floor, which refutes the algebraic-collapse
    framing at these parameters
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-5a8d47
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Whether the repeated-nonce difference cancels the mask exactly in each full construction is a
    specification question that must be answered from primary text before the toy convention is blessed;
    the contract assumes it by construction and flags it.
  - The Coordinator must confirm that the persistence arm as defined refreshes only the authentication
    key and nothing else, since a second changed variable would invalidate the control.
  - A ruling is needed on whether the survivor-count curve may be reported at all alongside the deployed
    constructions' names, given the bucket's prohibition on deployment advice; the contract proposes
    naming the constructions only in the analogue definition.
  - The resolution floor from the ladder contract in this batch should be available before this run
    so that the signal-versus-null comparison has a threshold.
