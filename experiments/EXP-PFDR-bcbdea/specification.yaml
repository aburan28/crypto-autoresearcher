      "original_ideal": {
        "ring": "R=F_p[d_(i,j)], n=m*s. Q=(d_k^2-d_k for k=1,...,n). Original ordered generating list G=(these n Boolean constraints in variable order, h(d_1),...,h(d_m), F). I=(G). Retain the raw expanded generator list and a separate canonical multilinear normal form modulo Q, together with exact reduction witnesses.",
        "S3": "S3(u,v,w)=(u-v)^2*w^2-2*((u+v)*(u*v+A)+2*B)*w+(u*v-A)^2-4*B*(u+v).",
        "S4": "S4(u,v,w,z)=det of the formal 4 by 4 Sylvester matrix in a fresh t for S3(u,v,t) and S3(w,z,t), each formal t-degree two. Form this polynomial over the universal coefficient ring before simultaneous substitution of field/curve/X_i/x_R. Keep the determinant and every factor; no leading-coefficient cancellation, squarefree-part replacement or specialization-dependent degree reduction. Store the formal construction and substitution map.",
        "F": "For affine target R, F=S_(m+1)(X_1,...,X_m,x_R). Coordinates for -R and R coincide; after algebraic recovery enumerate every rational sign lift and retain exactly sums equal to the selected signed R. O is a separately scheduled exceptional target with m=2 relation polynomial X_1-X_2 and m=3 polynomial S3(X_1,X_2,X_3), followed by the same exact sign/group filter.",
        "radicality_lemma": "Modulo Q, the idempotents delta_a over a in {0,1}^n are mutually orthogonal, sum to 1, and evaluation identifies R/Q with the product of 2^n copies of F_p. Every ideal of this product is a product of 0/F_p factors. Consequently R/I is the product over satisfying digit assignments, is radical, all its geometric points are F_p-rational and dim_Fp(R/I) equals the number of distinct algebraic digit roots. This textual elementary derivation is a design lemma, not an independently reviewed or machine-checked proof.",
