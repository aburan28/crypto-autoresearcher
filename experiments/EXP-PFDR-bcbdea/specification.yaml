        "source": "Roune, f4.pdf, three-page primary author algorithm exposition, actually retrieved/read. The original Faugere 1999 paper remains a failed-retrieval pointer and is not relied on for an unexamined optimization or performance claim. This comparison is against the precisely specified implementation, not the globally best optimized F4."
