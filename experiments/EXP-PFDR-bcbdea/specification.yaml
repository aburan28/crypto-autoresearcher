        "resultant_slice": "For m=2 enumerate admitted first digit/x label, specialize the formal S3 in the second label and test all admissible second x values; for m=3 enumerate first two x labels, specialize formal S4 and test every final admitted x. Record polynomial construction/evaluation plus signs/group recovery. This deterministic resultant-root loop gives a matched baseline without an external factorization oracle. Never specialize before the universal S4 determinant."
