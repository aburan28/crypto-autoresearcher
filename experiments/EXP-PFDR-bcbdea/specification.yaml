      "digits_and_bases": {
        "s_rule": "s in [3,4,5] is the number of binary digits per x coordinate; m in [2,3] is the number of affine factor-base points in an ordered decomposition sum P_i=R. There are n=m*s prime-field variables d_(i,j), j=0,...,s-1, values 0 or 1, and X_i=sum_j 2^j d_(i,j). These are explicit F_p bit constraints, not an F_2 calculation, XOR rule, Boolean Weil descent, or omitted interval membership.",
        "interval_family": "D_s={0,...,2^s-1}, with 2^s<p. A_s={x in D_s : x^3+A*x+B is a square in F_p, including zero}. V_s contains every affine rational lift at those x, once per (x,y); O excluded. Since prime odd group order precludes rational nontrivial 2-torsion, y=0 is absent in admitted main curves but still covered by generic checker fixtures.",
        "random_family": "Let k=|A_s|. Hash-order all rational affine x values by H(domain,b,curve,s,\"random-base\",x), choose the first k distinct x values; lift all signs. Assign their increasing x values bijectively to digit labels 0,...,k-1; other 2^s-k labels are forbidden. This comparison matches cardinality and signs; its label-to-x map is an explicitly constructed multilinear lookup, not the interval linear map, and its setup/degree cost is included. Never claim an identical-generator comparison between the two base families; within each family all solver arms receive identical generators.",
        "membership": "For each digit label a define delta_a(d)=product_j (d_j if a_j=1 else 1-d_j). Let h(d)=1-sum_{a admitted}delta_a(d). h=0 selects exactly the allowed labels on {0,1}^s. Interval X is the linear digit map; random-family X=sum_{a admitted}x_a*delta_a(d), with value 0 on forbidden labels whose h is nonzero. Build both maps and explicit original polynomials before any quotient reduction; charge expansion and membership acquisition.",
        "order": "Variables d_(1,0)>...>d_(1,s-1)>d_(2,0)>...>d_(m,s-1). Grevlex: larger total degree is larger; at equal degree compare exponent vectors from the last variable, and the monomial with smaller exponent at the last difference is larger. Coefficients canonical mod p; monomial exponent vectors are immutable explicit tuples."
