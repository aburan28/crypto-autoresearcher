    "baselines": {
      "F4": {
        "name": "Deterministic instrumented F4 method on identical original G and grevlex",
        "definition": "Use the raw ordered original generators, without replacing them by known roots, a reduced basis, nf_Q or a different presentation at input. Make nonzero generators monic in order and retain source witnesses. Maintain all unprocessed unordered critical pairs. Select all pairs of minimum total degree of their leading-monomial lcm, ordered by insertion indices. Form their exact S-polynomials. Symbolic preprocessing repeatedly takes the greatest not-yet-processed support monomial, chooses the earliest current basis reducer whose leading monomial divides it, and adds that monomial multiple and all newly encountered support. Build the full sparse coefficient matrix with every encountered column in descending grevlex; all other ambient columns are known zero. Exact deterministic RREF uses the first nonzero row at each column, monic pivots, no numerical tolerance. Add every new leading-pivot polynomial not already in the leading ideal, with its source witness and new critical pairs. No heuristic pair deletion; zero pairs are recorded. End only when every pair is processed; reduce to the unique monic reduced grevlex basis and independently check all original-generator reductions, all basis membership witnesses and all S-pair reductions to zero.",
        "normal_set": "Derive B_grevlex from the complement of the leading ideal using an increasing monomial frontier and exact divisibility tests. Finiteness is guaranteed by Q but dimension is discovered, not supplied. Build every canonical border reduction, source witness, multiplication matrix and the same complete certificate and bit-eigenspace/group recovery as the adaptive arm. A unit basis requires the identical explicit 1-in-I certificate.",
