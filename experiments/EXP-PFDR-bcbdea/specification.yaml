      "generic_group": {
        "task": "DLP controls solve R=[k]P on exactly each selected curve and target, a different task from decomposition. Do not divide a decomposition cost by rho/BSGS and call the result an ECDLP speedup; no relation-collection/rank/descent/linear-algebra algorithm is supplied here.",
        "BSGS": "t=ceil(sqrt(N)); store ([j]P,j) for j=0,...,t-1, canonical point dictionary with smallest j. For i=0,...,t scan R-[i*t]P, verify each candidate k=i*t+j mod N and return first verified equality. Charge construction, lookup, storage and final multiplication.",
        "rho": "Use a 16-adding walk. For restart r, hash-to-uniform coefficients (a_j,b_j) mod N for j=0..15 and steps a_j*P+b_j*R; choose step index by the first four bits of SHA256 canonical current point plus fixed domain. Start with hashed (a,b). Floyd cycle detection carries both coefficients; a collision solves (b-b_prime)k=a_prime-a mod N only if denominator nonzero, and verifies [k]P=R. At most N+1 Floyd iterations per restart, charging every slow/fast advance and eight restarts; all setup/failed walks are charged. After eight failures run fresh BSGS and charge fallback, preserving the rho-failure row. These are finite deterministic controls, not an empirical proof of generic sqrt(N) asymptotics.",
        "relabel_control": "Apply a deterministic bijective hash permutation to the same point labels in the independent incidence census and verify tuple/yield invariance. The main claim is algebra-only, so no group-information-gain statistic is promoted. A later generic-group-escape claim would need a separately reviewed relabelled Z/NZ protocol."
