    "algorithm": {
      "name": "Adaptive support-budget border closure, version 1",
      "information_boundary": "Solver may read only public instance generators, p, ordered variable list, fixed source specification and its own charged intermediate data. It cannot read F4 output, dimension/root oracle, target stratum, calibration/holdout labels or sibling control outcomes. Public-instance dependence is allowed and fully charged. All full ambient monomial metadata, rank queries, searches and rejected candidates count.",
      "ambient": "A=R/Q with squarefree monomial universe U of size 2^n, ordered grevlex. nf_Q reduces exponents >0 to 1 with an explicit polynomial witness. Maintain an exact full-column sparse RREF row space K contained in I/Q, each row carrying a witness in original G. Missing sparse entries are certified zero; no support-column restriction may remove possible columns. Initial K is the span of nf_Q(h_i) and nf_Q(F).",
      "support_budget": "Initial permitted product-row nnz q=min(2^n,n+1). At each closure batch, accumulate into the persistent queue all nf_Q(d_k*r) for each newly observed RREF row r, with witness, excluding exact row/variable digest pairs already processed. Defer, never discard, rows whose raw product nnz exceeds q. When every remaining product is deferred, replace q by min(2^n,2*q); if no products remain, closure is exhausted. Budget is a scheduling parameter; construction of rejected/deferred products still counts. Replacing an RREF row does not delete its deferred products: their row/variable fingerprints stay queued until processed or the fixed fallback ends search.",
      "candidate_search": "Attempt 1 uses initial K. Rebuild a candidate after each subsequent closure batch, for at most 16 attempts total. Start B={1}, provided 1 is independent modulo K; if 1 is in K take the unit branch. Frontier comprises squarefree monomials outside B whose every immediate divisor belongs to B. Repeatedly choose an independent frontier monomial modulo K+span(B), minimizing (sum_k nnz(nf_K(nf_Q(d_k*b))), nnz(nf_K(b)), total degree, exponent bitmask). Each score and exact independence query is charged. Add that monomial and recompute frontier. Permanently reject a dependent frontier monomial for this candidate. For attempt k, stop adding when |B| reaches cap_k=min(2^n,(n+1)*2^(k-1)), or when no independent eligible monomial remains. The cap is frozen before any outcome and is not an oracle for the quotient dimension. This greedy set need not span A/K; inability to reduce its full border is a recorded candidate failure, never presumed completeness. The squarefree bitmask tie break is sum_(k=1)^n exponent_k*2^(k-1), in the frozen variable order. This finite frontier cap starts with a small candidate and permits charged border extension; it avoids assuming that the first relation space must already span the entire ambient quotient.",
      "candidate_test": "Construct the full original-ring border. Solve each beta-sum_b c_b*b in K modulo Q using exact linear algebra; coefficients are unique because B is independent modulo K. Failure to express any beta ends the candidate test with the first unresolved border in increasing grevlex order. If all reduce, build the matrices, check complete border, commutators, cyclic basis identities, source containment witnesses and every original-generator annihilator. Accept only the full certificate. The independent checker verifies every accepted certificate; rejected candidates retain all work and diagnostics.",
      "closure_batch": "After a failed attempt, process at most max(1,n*(rank(K)+1)) queue proposals, the quota fixed at batch start. First insert any nonzero commutator defect polynomial sum_b c_b*b with its derived source witness, then process queued products. A product has priority 0 if its support intersects the first unresolved border normal form or first commutator defect support, otherwise 1; remaining order is (priority, raw nnz, total degree, SHA256 canonical row, variable index). Insert only independent rows, renormalize exact RREF and add newly encountered RREF-row products without deleting older deferred entries. All visited/deferred/zero/dependent products and RREF updates count. If quota ends, candidate search restarts even when K did not grow; this is still an attempt. A complete closure with failed certificate is preserved as an algorithm failure and triggers fallback, not an assertion about the ideal.",
      "fallback": "First valid candidate returns; there is no cost- or nnz-based postselection. If 16 attempted candidates fail, or closure is exhausted without an acceptable basis, invoke a fresh execution of the exact matched F4 arm on the same original G, then canonical grevlex border certificate and recovery. Charge every previous attempt plus the full fallback. The source <=4-candidate prediction is evaluated afterward and is not a stopping cap. No unscheduled repair, stochastic retry or candidate-17 extension.",
      "random_staircase_control": "Run three additional fixed schedules per original instance. Use the identical K closure, support rules, attempt count, certificate and fallback, replacing the candidate frontier score by H(domain,\"random-staircase\",rep in [0,1,2],instance-key,attempt,monomial), with monomial order tie break. The chosen order is only over the currently eligible independent frontier. Each schedule is a separate fully charged arm, never pooled by selecting its best outcome.",
      "termination_and_ceiling": "Finite 16 candidate schedule, finite 2^n ambient and finite deterministic F4/Buchberger fallback give a mathematical termination route over a field. Operational memory failure can censor execution. No bound below generic quotient-dimension or F4 growth is proved; full closure can approach dense 2^n by 2^n algebra, and witnesses can exceed this storage. A small output matrix does not bound discovery cost."
    },
    "recovery": {
      "procedure": "Given a verified nonzero quotient, recursively split its vector space in variable order. At digit k, compute intersections of the current invariant subspace with ker(M_k) and ker(M_k-Id) by exact Gaussian elimination; retain every nonzero child in order 0 then 1. At depth n each surviving joint eigenspace must have dimension exactly one in this radical Boolean family. Emit its digit assignment once and directly evaluate every original G. Failure of splitting/spanning, dimension-one leaves or G evaluation invalidates the instrument. All subspace construction, eigenspace calculations and rejected branches are charged.",
      "extensions": "No extension-field arithmetic is needed: Boolean idempotents split over F_p. An implementation invoking an extension or general root oracle is out of protocol until amended. F4 uses the same bit-eigenspace recovery after its canonical quotient certificate.",
      "point_reconstruction": "Decode each digit block by the frozen interval or random lookup X, enumerate all rational y roots in increasing integer order, and test every ordered signed tuple by independent group addition against the exact signed target. Enumerate square roots by a charged precomputed curve table whose full construction is accounted for. Keep only identical tuple duplicates once, recording their multiplicity; do not quotient by global sign or permutation in the primary ordered output.",
      "exceptional_rows": "Tag tuples with repeated points, repeated x, inverse pairs, doubling branches or intermediate O; record both all-tuples and generic/no-tag subsets without changing the target primary population. Target O has a separate fixed exceptional row for every cell/base and is never pooled into affine SAT/UNSAT means. No exceptional point is silently omitted.",
      "loss_and_branching": "The complete certified coordinate-labelled multiplication action loses zero information on the finite algebraic root set. For each partial digit branch store exact fibre cardinality (subspace dimension) and L=log2(cardinality), with counts authoritative and logarithms derived. Store verified child count b at every digit/sign/recovery node, maximum b, signed preimages per x tuple, tuple duplicate counts and witness bytes separately. These are finite recovery fibres, not a group-translation quotient or generic-group information gain."
