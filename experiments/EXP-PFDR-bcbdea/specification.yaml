    "raw_artifact_contract": {
      "serialization": "UTF-8 strict JSON/JSONL, decimal integers or exact rational {numerator,denominator}, canonical exponent vectors and sorted field-polynomial terms; reject duplicate keys, NaN/Infinity and ambiguous -0 encodings. Each JSONL record has unit ID, cell key, target slot, base family, arm, stage, seed-domain/counter and ordinal. Streamed files are finalized once; witnesses can reference prior acyclic records by digest.",
      "instance_key": "[b,curve_slot,m,s,base_family,phase,stratum,target_slot,arm,control_replicate]; actual p,A,B,N,P,V,R and original generator hashes appear in inputs. Missing slots receive explicit unavailable records with the frozen key.",
      "manifest": "Canonical run ID/EXP/H/source/spec/plan/lock/grant/task/claim/runtime/source-snapshot pins, actual start/stop/process/resource facts, exact intended/attempted/completed/invalid/censored counts and artifact hashes. No inferred model verification, timing or success. Every run remains an immutable record on partial failure.",
      "candidate_log": "Every attempt ordinal, K rank, support budget, frontier/rejected monomials, rank query/score counts, queue proposals/deferred/zero/independent rows, B order, border completeness, commutator/annihilator outcomes, source witness IDs, stage costs and reason accepted/rejected/fallback. Include all 16 scheduled attempts if reached; first acceptance ends adaptive search. Record cap_k and whether frontier growth stopped at capacity or dependence.",
      "certificate_log": "Full matrix/border data or lossless content-addressed chunks within witnesses.jsonl; exact source and border reduction DAGs, checker result, unit-ideal witness when applicable, dimension and all cyclic/commutator tests. No mere root-set fingerprint substitutes for a certificate.",
      "solution_log": "Every algebraic digit root with multiplicity semantics, decoded x values, every rational sign branch, independent point checks, retained ordered tuples, canonical duplicate counts and exceptional tags. Store rejected branches and precise reason.",
      "oracle_separation": "oracle.jsonl and stratum/complete-root labels are produced/read only by isolated scheduling/checker stages. The solver input channel contains public G and parameters only. Implementation records read/import boundaries; independent QA checks intentional oracle-leak probes. Oracle computation is recorded and charged, never reused as free adaptive input.",
      "coverage": "Expected keys are expanded from the sealed schedule before execution. Reconcile every expected original/null/control/diagnostic key with one completed, unavailable, invalid, censored or unattempted record. No fabricated empty success, duplicated trial, replacement target or zero-valued timeout.",
      "artifact_index": "Hash and byte-length every raw output except the index itself; manifest/receipt/index cyclic fields use explicit non-self-binding boundaries and external snapshot binding. Parent verifies actual run snapshot commit/parent/path set after all writes stop."
