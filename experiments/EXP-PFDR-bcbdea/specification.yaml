    "definitions": {
      "field_and_curves": {
        "p_rule": "For b in [12,16,20], p is the least prime >=2^(b-1), certified by exhaustive trial division through floor(sqrt(p)); b denotes bit length, not exact real log2(p). Search only through 2^b-1; if no certified prime is found, retain that unavailable bit-length block rather than changing b.",
        "curve_rule": "Fix A=1. Scan B=0,1,...,p-1. Retain the first three pairwise different B for which 4A^3+27B^2 !=0 mod p, N=#E(F_p) is prime, and trace p+1-N !=0. Count N exactly as 1+sum_x(1+chi(x^3+A*x+B)); certify N prime by trial division. These are three ordinary curves, without any solver-cost or target-yield filter. If fewer than three exist, retain each missing curve slot and report incomplete coverage; no replacement field or A.",
        "subgroup": "N prime, G=E(F_p), cofactor 1, P lexicographically first affine point (canonical integer x then y); every nonidentity point has order N. Assert [N]P=O by the independent group checker. This explicit prime-order subfamily is a design choice within the source generic ordinary family; it does not reuse the neighbor full-group/nonprime sample.",
        "point_model": "Short Weierstrass affine pairs plus a distinct O tag. Coefficients canonical integers 0..p-1. Point addition: identity branches first; x equal and y1+y2=0 yields O; otherwise usual secant or tangent slope, reduced modulo p. All divisions require nonzero denominator, and each taken exceptional branch is logged.",
