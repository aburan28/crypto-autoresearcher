experiment:
  id: EXP-JINV-d91f98
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-778375
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: Small |D_0| makes the Hilbert class polynomial, the CM ideal factorisation of (pi - 1), and
    Lenstra's O-module structure E(F_p) = O/(pi-1) all cheaply COMPUTABLE - and this proposal argues,
    and then measures, that their entire publicly usable output on a prime-order subgroup is the single
    GLV eigenvalue lambda, so the CM ring supplies a DESCRIPTION whose effectivisation is DLP-equivalent
  status: draft
  objective: "(A) WHAT SMALL |D_0| ACTUALLY MAKES CHEAP. Four things, each with a cost.\n  A1 THE\
    \ HILBERT CLASS POLYNOMIAL. H_{D_0}(X) has degree h(D_0). For the nine\n    class-number-one discriminants\
    \ -3, -4, -7, -8, -11, -19, -43, -67, -163\n    it is LINEAR, so j is a single known integer (H_{-3}\
    \ = X, so j = 0;\n    H_{-4} = X - 1728). For class number two it is quadratic. General cost of\n\
    \    computing H_D is quasi-linear in |D| by the standard CRT/floating-point\n    methods; at\
    \ |D_0| <= 163 it is free. So for small |D_0| the set of\n    possible j-invariants with that\
    \ CM order is a KNOWN, TINY, EXPLICIT SET.\n  A2 THE CORNACCHIA DECOMPOSITION. End_{F_p}(E) =\
    \ O_{D_0} forces\n    4p = t^2 + |D_0| f^2 with t the trace; both t and f are recoverable in\n\
    \    polynomial time from p and D_0 by Cornacchia's algorithm. For D_0 = -3\n    this is the classical\
    \ 4p = L^2 + 27M^2 form and it is what makes the six\n    sextic twists' group orders computable\
    \ WITHOUT point counting.\n  A3 THE IDEAL ABOVE N. Since h(D_0) = 1 for D_0 in {-3,-4}, O is a\
    \ PID.\n    The prime ideal n dividing (pi - 1) with norm N is generated by an\n    explicit element\
    \ beta in O obtained by Cornacchia from 4N = u^2 +\n    |D_0| v^2. beta is an ENDOMORPHISM OF\
    \ DEGREE N whose kernel is exactly\n    the prime-order subgroup G.\n  A4 LENSTRA'S CM STRUCTURE.\
    \ For an ordinary E with End(E) = O there is an\n    O-module isomorphism E(F_p) = O/(pi - 1).\
    \ This gives the group structure\n    and, restricted to G, presents G as O/n.\n\n(B) THE OBSTRUCTION,\
    \ STATED SHARPLY, AND IT IS THE POINT OF THE PROPOSAL. Every item in (A) is a statement about\
    \ the curve or about an abstract module. The moment any of it is applied to POINTS OF G it collapses\
    \ to one scalar:\n  - beta from A3 has kernel G, so beta acts on G as multiplication by 0.\n \
    \   Writing beta = (u + v*omega') in a fixed Z-basis {1, omega'} of O and\n    letting lambda\
    \ be the action of omega' on G, \"beta acts as 0\" reads\n    u + v*lambda = 0 mod N, which SOLVES\
    \ FOR lambda and returns exactly the\n    GLV eigenvalue already available as a root of L^2 +\
    \ L + 1 (D_0 = -3) or\n    L^2 + 1 (D_0 = -4). The ideal structure therefore returns the eigenvalue\n\
    \    and nothing else. [derived in this record.]\n  - A4's isomorphism is not effective: exhibiting\
    \ the map O/(pi-1) -> E(F_p)\n    requires knowing the O-module generator's image, and inverting\
    \ it on a\n    given point IS the discrete logarithm. Making Lenstra's isomorphism\n    explicit\
    \ is DLP-equivalent, so it cannot be an ingredient of a DLP\n    algorithm without circularity.\n\
    \  - H-ENDO-001 supplies the general reason: G has prime order N, End(G) =\n    Z/N, so every\
    \ endomorphism acts as a scalar and adding endomorphisms to\n    the witness lattice adds COORDINATES\
    \ BUT NO CONGRUENCE - the index stays\n    exactly N for every rank r.\nTHE NAMED OBSTRUCTION:\
    \ O has Z-rank 2, so its image in End(G) = Z/N is the subring generated by 1 and lambda, which\
    \ is all of Z/N; a subring of Z/N imposes no congruence on k. Every element of the CM ring is\
    \ therefore a known scalar, and known scalars are exactly what the generic group model already\
    \ provides (KN-FIND-b7e091, oracle D).\n(C) SO WHY MEASURE ANYTHING. Because (B) is an ARGUMENT\
    \ and the program's standard is that an argument plus a measurement is a closure while an argument\
    \ alone is a hypothesis. Two things in (B) are checkable at toy scale and one of them could fail:\n\
    \  C1 THE INDEX CLAIM. Build the witness lattice augmented not by\n    endomorphisms (H-ENDO-001's\
    \ design) but by IDEAL DATA: rows encoding\n    beta, the ideal norm N, the conductor f, and the\
    \ Cornacchia pair (u,v).\n    Compute its Hermite normal form index in Z^{2r}. Predicted EXACTLY\
    \ N,\n    for every cell, on every instance. An index strictly below N would mean\n    the CM\
    \ ideal structure supplies a congruence that endomorphism-image\n    data does not - which would\
    \ be a genuine break of the lane's central\n    obstruction and would have to be replicated independently\
    \ before being\n    reported as anything but a suspected bug.\n  C2 THE CIRCULARITY CLAIM. Implement\
    \ Lenstra's isomorphism explicitly at\n    toy scale and MEASURE what it costs. Predicted: the\
    \ only implementation\n    that produces the map runs a discrete logarithm, so its cost tracks\n\
    \    matched rho within a constant. A route that produces the map in time\n    materially below\
    \ sqrt(N) refutes (B) and is the interesting event.\n\n(D) WHAT IS CLAIMED BEYOND THE sqrt(|Aut|)\
    \ CONSTANT: NOTHING, AND THE PROPOSAL PREDICTS ITS OWN NEGATIVE. It is filed as a recorded closure\
    \ with a named obstruction, per the batch brief's instruction that an inadmissible proposal is\
    \ still a legitimate deliverable. The deliverable is the exact cost table for (A1)-(A4) and the\
    \ exact statement of what each buys, so that no later record in this campaign has to re-derive\
    \ it."
  resource_label: 'R3 - End(E) as a RING: ideals, norms, class group, and the Hilbert class polynomial.
    The proposal consumes R3 and argues that R3''s image in End(G) is the whole obstruction.'
  admissibility: inadmissible_generic_group
  admissibility_argument: 'DECLARED INADMISSIBLE, ON PURPOSE, AND FILED ANYWAY. The resource R3 is
    genuinely non-generic as long as it stays on the curve: the ideal factorisation of (pi-1), the
    conductor f, and H_{D_0} are all invisible to a generic group oracle. But every USE of that resource
    in this proposal ends by applying an element of O to a point of G, and there it becomes multiplication
    by a publicly computable scalar - which is exactly Oracle D of KN-FIND-b7e091, shown GGM-simulable
    and therefore closed at exponent 1/2, and exactly H-ENDO-001''s scalar-action argument. The proposal
    is admitted to the ledger as a CLOSURE RECORD whose value is the named obstruction in claim (B)
    plus the two falsifiable checks C1 and C2 that could overturn it. If C1 fires (index strictly
    below N), the admissibility verdict flips and the lane reopens; that is the only route by which
    this record becomes an attack, and it is stated in advance.'
  reachability_gate: 'NOT APPLICABLE AS A WALK: the curve is fixed. But T4 governs the family''s availability:
    End(E) = O_{-3} forces j = 0 and vice versa, so a curve whose class does not already contain a
    j = 0 curve can never be walked to one and can never acquire the cheap CM data of (A). The cost
    of ACQUIRING small |D_0| is therefore infinite, not merely large, and the affected family is fixed
    at curve-generation time. Note the corollary for L3''s cost accounting: the four cheap items in
    (A) are cheap only for the curves that already have them, so there is no "convert a hard curve
    into an easy one" step anywhere in this lane.'
  inputs:
    procedure: 'CHEAPEST VALID DISCRIMINATOR: STEP 1, WHICH COSTS NO COMPUTE AT ALL. Write beta =
      (u + v*sqrt(D_0))/2 from Cornacchia on 4N = u^2 + |D_0| v^2, impose beta|_G = 0, solve for lambda,
      and compare with the independently computed root of L^2 + L + 1 = 0 mod N on one 16-bit j=0
      instance. If the two agree, the ideal above N has been shown to return exactly the eigenvalue
      already known, and the closure argument in (B) has its load-bearing step verified for the price
      of one Cornacchia call and one quadratic root. If they disagree, the derivation is wrong and
      no further work is warranted until it is fixed. Step 3''s index measurement is the next cheapest
      and is the only one that could overturn the closure.'
    mechanism: 'STEP 1 (zero compute, symbolic). Write out the derivation in (B) explicitly for D_0
      = -3 and D_0 = -4: fix the Z-basis of O, express beta from Cornacchia, impose beta|_G = 0, and
      check that the resulting congruence on lambda is exactly the root of L^2 + L + 1 (resp. L^2
      + 1). If this fails to reproduce the known GLV eigenvalue, the derivation is wrong and the record
      is superseded before anything is run.

      STEP 2 (low compute). Verify Lenstra''s structure statement E(F_p) = O/(pi-1) at toy scale by
      comparing the abstract group structure of O/(pi-1) (computed from the Z-lattice of pi-1 in O
      by Smith normal form) with the actual group structure of E(F_p) (computed by point counting
      and factoring). Report agreement rate across the instance grid. Disagreement means either the
      hypotheses of the theorem are not met on those instances (e.g. End(E) is not the maximal order)
      or the implementation is wrong; both are recorded, and the maximality of End(E) is checked separately
      by confirming that the conductor of Z[pi] in O equals f from Cornacchia.

      STEP 3 (the index measurement, C1). Build the IDEAL-AUGMENTED witness lattice: coordinates for
      (a, b) as usual, plus coordinates encoding the action of beta, of pi, and of the conductor-scaled
      elements. Compute the Hermite normal form and its index in the ambient Z^{2r}. Record the index
      per cell. PREDICTED EXACTLY N. Include a PLANTED POSITIVE CONTROL: an artificial row that genuinely
      does collapse the index (e.g. a row asserting k = k_0 mod q for a small q dividing nothing),
      which the instrument must detect. An instrument that misses the planted collapse produces void
      negatives.

      STEP 4 (the circularity measurement, C2). Implement two routes to Lenstra''s isomorphism: (i)
      the naive route, which computes discrete logarithms and is therefore trivially DLP-cost; (ii)
      any candidate route that uses only the ideal data (beta, f, the Cornacchia pair, H_{D_0}) and
      the group operations. Measure both in point additions against matched rho and matched BSGS on
      the identical instance. Predicted: route (ii) does not exist, i.e. every attempt reduces to
      route (i). Any route (ii) beating rho by more than a constant is the interesting event and halts
      the line for independent review.

      STEP 5 (the cost table, and it is a deliverable in itself). Tabulate, for |D_0| in {3, 4, 7,
      8, 11, 19, 43, 67, 163} and for a class-number-two ladder and for a generic |D_0|: h(D_0), deg
      H_{D_0}, the cost of computing H_{D_0}, the cost of Cornacchia, whether beta is a single generator
      (PID) or needs an ideal basis, and - the column that matters - WHAT IS PUBLICLY COMPUTABLE ABOUT
      G FROM EACH. Predicted: the last column reads "lambda" in every row, including the generic one
      where lambda does not exist and the column reads "nothing".'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - matched generic-|D_0| curve at the same p (N1)
  - planted index collapse (N2)
  - wrong-discriminant arm (N3)
  - composite-order subgroup nearby-object control
  - matched rho and matched BSGS on every instance, same operation unit
  - maximality check on End(E) before any Lenstra comparison, reported per instance
  - "NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. N1 MATCHED GENERIC-|D_0| CURVE at the\
    \ same p with N of the same bit length,\n  for which A1-A4 are all computationally out of reach\
    \ (h(D) is large,\n  H_D is not computable, no small Cornacchia form). Every metric in Steps\n\
    \  2-4 is run on it. The predicted result on the generic curve is that\n  everything about G is\
    \ exactly as hard - which is the whole finding.\nN2 PLANTED INDEX COLLAPSE (Step 3). An artificial\
    \ congruence inserted into\n  the lattice that genuinely lowers the index. The instrument MUST\
    \ detect it.\n  Failure voids every index-equals-N negative.\nN3 WRONG-DISCRIMINANT ARM. Run the\
    \ Cornacchia and ideal machinery with the\n  WRONG D_0 (say -4 on a j=0 curve). It must fail to\
    \ produce a consistent\n  beta. An instrument that produces a plausible-looking eigenvalue from\
    \ the\n  wrong discriminant is not reading the curve.\nDECAY PARAMETER: |D_0|, swept over the\
    \ class-number-one ladder {3,4,7,8,11,19,43,67,163}, then class number two, then generic. Any\
    \ quantity that is claimed to come from \"small |D_0|\" must DECAY along that ladder. A quantity\
    \ that is flat across |D_0| = 3 to 163 and then jumps at generic is not tracking |D_0| at all\
    \ - it is tracking \"was constructed by the CM method\" - and that is the canonical artifact tell\
    \ for this lane."
  independent_variables: []
  metrics:
    primary:
    - HNF index of the ideal-augmented lattice, per cell
    - the derived lambda and the independently computed lambda, exact integers
    - Smith normal form of O/(pi-1) vs measured E(F_p) structure
    - conductor f from Cornacchia vs conductor from t^2 - 4p factorisation
    secondary:
    - point additions for every route in Step 4, plus matched rho and BSGS
    - the Step 5 cost table, all columns, including the generic row
    - pass/fail of N1, N2, N3 and the composite-order control
  heuristic_under_test: null
  preregistered_prediction:
    quantity: ideal-augmented witness lattice HNF index, all cells
    formula: Exactly N on 100 percent of cells. A single cell with index strictly below N, with the
      eigenvalue control and the wrong-discriminant control both passing, refutes the closure and
      reopens the lane. Independent replication is mandatory before such a cell is reported as anything
      but a suspected implementation error.
    source: pre-registered in IDEA-20260807-778375 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - NON-MAXIMAL End(E). If End(E) is a non-maximal order, the ideal above N may not be principal,
    beta may not exist as a single generator, and the Lenstra comparison changes. Maximality is checked
    per instance and non-maximal instances are reported in a separate stratum, not pooled.
  - TWISTS. The six sextic twists of a j=0 curve have different traces and lie in DIFFERENT isogeny
    classes. Comparing across twists without saying so would compare different groups. The twist is
    recorded with every instance.
  - CIRCULARITY BY ACCIDENT. Any implementation that uses Q while computing a "publicly computable"
    scalar has silently smuggled in the answer. Step 1's audit obligation exists for this and it is
    checked mechanically, by confirming Q is not read on the code path.
  - SMALL N. At toy scale N can be small enough that the quadratic L^2 + L + 1 = 0 mod N has degenerate
    behaviour (e.g. N = 3). Instances with N < 2^10 are excluded from the eigenvalue arm.
  - CLASS NUMBER ONE IS A FINITE LIST. Nothing about h(D_0) = 1 generalises; at |D_0| beyond 163 the
    class number grows and H_D is no longer trivially computable. Every statement about "small |D_0|"
    names the exact discriminant it was measured at.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Exactly N on 100 percent of cells. A single cell with index strictly below N,
    with the eigenvalue control and the wrong-discriminant control both passing, refutes the closure
    and reopens the lane. Independent replication is mandatory before such a cell is reported as anything
    but a suspected implementation error.
  falsification_criterion:
  - Step 1's derived lambda differs from the root of L^2 + L + 1 = 0 mod N. The derivation in (B)
    is wrong; supersede this record.
  - Any cell has ideal-augmented HNF index strictly below N with all controls passing. The closure
    is refuted and the lane reopens; mandatory independent replication before reporting.
  - A route to Lenstra's isomorphism is found whose cost is below 0.5 x matched rho. The circularity
    claim is refuted; halt for review.
  - The planted index collapse is NOT detected. Every index-equals-N result is VOID rather than negative,
    and the run set is invalid.
  - The wrong-discriminant arm produces a consistent beta. The instrument is not reading the curve;
    all numbers void.
  - Point counting or Hermite normal form exceeds budget at the largest size. INFRASTRUCTURE outcome
    under AGENTS.md rule 5, never negative mathematical evidence.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
