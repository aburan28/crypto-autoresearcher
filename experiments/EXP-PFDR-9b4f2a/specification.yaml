experiment:
  id: EXP-PFDR-9b4f2a
  hypothesis_id: H-PFDR-3c7d1e
  version: 1
  title: >-
    Rank-r GAP successor to the rank-1 lattice-describable closure: exact
    Jochemsz-May reach of the degree-graded substituted summation polytope
    (r = 1..4) against the unchanged index-calculus demand curve, paired with a
    real-LLL planted-root attainment measurement on the same substituted system
  status: review_required
  objective: >-
    Decide, on the one lever that analysis/smallroot-reach/CLOSURE.md section 6
    item 1 and IDEA-20260903-81a943's third falsification_condition name as the
    live open edge, whether the rank-1 closure of the lattice-describable
    factor-base family extends to rank r >= 2 generalized arithmetic progressions.
    The comparison is controlled by construction: |V| = B is unchanged so the
    demand curve eps_required(m,w) = (w + 1/2 + 1/(2(m-1)))/(w+1) is unchanged
    (KN-FIND-007), and prod(bounds) per slot = (B^{1/r})^r = B is unchanged so the
    normalisation prod(bounds) <= p^(eps * #equations) and the information ceiling
    eps = 1 are unchanged. ONLY the Newton polytope moves. The experiment therefore
    has exactly two jobs, and it is not interpretable with one of them missing.
    ARM A measures where the polytope bound goes. ARM B measures whether real
    lattice reduction goes anywhere near it. A result that reports Arm A alone --
    "eps_available > eps_required, family alive" -- is refused by this contract as
    an overclaim, because the predicted Arm A values for r >= 2 lie ABOVE the
    information-theoretic ceiling, where the Jochemsz-May bound certifies nothing
    at all and eps -> 1 is precisely the lattice-density-1 regime in which
    low-density subset-sum attacks are known to fail.
    Both outcomes are informative and neither is assumed. Supply at or below demand
    for every tested r EXTENDS the rank-1 closure to rank r <= 4, a strengthening.
    Supply above demand WITH Arm B confirming attainment opens a live attack lane
    and is a claim requiring independent review-breakthrough validation and a red
    team pass before any statement is made.
    Budget note: this contract sits at the template floors (3600 s per run, 8 GB)
    because Arm A is seconds-to-minutes of exact combinatorics and Arm B's cost is
    dominated by a small number of LLL reductions whose dimension is capped below.

  arms:
    -
      id: ARM-A
      name: exact polytope reach of the substituted support
      kind: computation
      decisive_for: P1, P2 of H-PFDR-3c7d1e
      description: >-
        For each rank r in {1,2,3,4}, each block polynomial (S_3 at l = 2, S_4 at
        l = 3), and each substitution convention, construct the substituted support
        and compute the Jochemsz-May extended-strategy reach exactly, extrapolated
        t -> infinity in 1/t by the same Richardson step the committed instrument
        uses. Report the exact polytope alongside the number: support size,
        per-variable degrees, per-group degree profile, lattice dimension |M_0| at
        each t used, and the extrapolation residual. Compare against the UNCHANGED
        demand curve over the declared (m,w) grid.
        Conventions, both required:
          SUB-EXACT  (primary)   x_i^{e_i} -> every monomial of total degree exactly
                                 e_i in slot i's r variables. This is the degree-
                                 graded substitution with the a_{i,0} offset absorbed
                                 by classical Coppersmith recentering. At r = 1 it is
                                 the identity on the support, which is what makes the
                                 r = 1 cell a sharp calibration.
          SUB-AFFINE (secondary) per-group downward closure, i.e. total degree <= e_i,
                                 the offset NOT absorbed.
        The reported supply is max over the two conventions (conservative toward the
        attack), with both values carried separately; a convention may never be
        selected after seeing which is larger for a specific cell without a
        protocol_amendment.
        Implementation requirement (the feasibility claim of the hypothesis):
        because the substitution is degree-graded, Minkowski powers commute with it,
        supp_sub(f^j) = { alpha : group-degrees(alpha) in supp(f^j) }, so every
        Jochemsz-May quantity is a closed combinatorial count over the ORDINARY
        3-variable (resp. 4-variable) Minkowski power the committed instrument
        already computes: the number of alpha with group degrees e is
        prod_i C(e_i + r - 1, r - 1); the coordinate sums follow from
        e_i * N(e) / r by within-group symmetry; the shift-set terms
        |M_k| - |M_k ^ M_{k+1}| follow from the same count with the leading
        monomial's per-group degrees subtracted. This fast path MUST be cross-checked
        against brute-force enumeration in 3r variables at every (r,t) where brute
        force completes inside its stopping rule, and the two must agree EXACTLY.
    -
      id: ARM-B
      name: planted-root recovery with real LLL on the substituted system
      kind: empirical
      decisive_for: P3 of H-PFDR-3c7d1e and HEUR-R1
      description: >-
        Sweep the total bound exponent up to and past the Arm A bound and measure the
        largest volume at which a planted root is ACTUALLY recovered. This is the
        decisive arm: it can only move the supply side DOWN, and it is the only
        instrument in this contract that can speak to what remains once the polytope
        bound exceeds the information ceiling.
        Two sub-arms, both required:
          B1 generic coefficients: random coefficients mod p on exactly the
             substituted S_3 support, planted root installed by fixing the constant
             monomial's coefficient (the same device the committed univariate probe
             uses). Directly matched to the Arm A object.
          B2 true curve coefficients: sample a rank-r GAP, sample u-vectors, form
             x1,x2,x3; sample a; solve S_3(x1,x2,x3) = 0 for b, which is LINEAR in b
             with coefficient -4(x3 + x1 + x2) (skip and resample when that vanishes).
             The resulting y^2 = x^3 + a x + b is a genuine curve carrying a genuine
             three-term relation, so the planted instance is real rather than
             synthetic. The induced (a,b) distribution is NOT uniform and that is a
             declared caveat, which is exactly why B1 exists beside it.
        The comparison metric is the ATTAINMENT RATIO: the measured recovery
        threshold divided by the Jochemsz-May bound computed for THE SAME LATTICE AT
        THE SAME FINITE t. The t -> infinity Arm A value is reported alongside but is
        never the denominator; no finite experiment can test it.

  inputs:
    frozen_reference_values:
      s3_support_size: 13
      s3_reach_rank1_extended: 0.840814
      s4_support_size: 439
      s4_reach_rank1_extended: 0.413684
      full_box_s3_reach: 0.75
      eps_required_formula: (w + 1/2 + 1/(2*(m-1))) / (w+1)
      welded_lever: l = ceil((m+w)/(w+1))
      rank1_best_margin: -0.0481 at (m,w) = (4,2)
      information_ceiling: 1.0
    source_artifacts:
      - analysis/smallroot-reach/CLOSURE.md
      - tools/smallroot_reach.py
      - tests/test_smallroot_reach.py
      - ledger/proposals/IDEA-20260903-81a943.yaml
      - ledger/proposals/IDEA-20260808-c31f1c.yaml
      - ledger/questions/RQ-PFDR-ae2fba.yaml
      - ledger/hypotheses/H-PFDR-3c7d1e.yaml
    environment:
      lattice_reduction: python-flint, flint.fmpz_mat.lll
      unavailable_and_not_to_be_assumed: fpylll
      exact_arithmetic: python fractions.Fraction and int only in Arm A
    immutability_constraint: >-
      tools/smallroot_reach.py MUST NOT be modified. It backs a merged analysis note
      and its ten tests are the regression gate for this experiment. New code lives in
      tools/smallroot_reach_rank.py and imports it.

  controls:
    -
      id: C1
      name: rank-1 calibration (baseline reproduction)
      procedure: >-
        Run the full substitution machinery at r = 1 under SUB-EXACT on (i) the full
        box [0,2]^3 and (ii) the true 13-monomial S_3 support, and at r = 1 on the
        recomputed S_4 support.
      passes_if: >-
        full box 0.7500 +- 0.02; sparse S_3 0.8408 +- 0.002; S_4 0.4137 +- 0.002.
      catches: >-
        Any defect in the substitution, expansion, shift-set or extrapolation code. At
        r = 1 SUB-EXACT is the identity on the support, so a miss is an IMPLEMENTATION
        DEFECT and is never reported as a discovery.
    -
      id: C2
      name: univariate Coppersmith control (calibration against a theorem)
      procedure: >-
        Run the empirical planted-root pipeline on degree-d univariate congruences for
        d in {2,3,4} at the same p sizes and the same success convention used in
        Arm B, reusing the committed probe path as the reference implementation.
      passes_if: >-
        empirical reach within 0.05 of 1/d for every d, on every seed.
      catches: >-
        A broken Arm B pipeline. This calibrates the empirical arm against a THEOREM
        rather than against itself; without it, an Arm B number is uninterpretable in
        either direction.
    -
      id: C3
      name: random-polytope null at matched monomial count and degree
      procedure: >-
        For each reported Arm A cell, draw at least 30 random supports with the same
        monomial count, the same per-variable degree bound, and the same group
        structure (same number of variables per group), and compute the same reach.
      passes_if: >-
        The substituted-S_3 value exceeds the 95th percentile of the null draws in the
        r = 1 cell, and the null distribution for each r is reported in full.
      catches: >-
        "Reach is just a function of how many monomials there are." If the null covers
        the measured value, eps is reporting cardinality and the rank comparison
        carries no information about GAP structure.
    -
      id: C4
      name: algebraic-independence check in Arm B
      procedure: >-
        For every successful recovery, record the number of reduced basis vectors whose
        norm lies below the Howgrave-Graham bound, the number of the corresponding
        polynomials that vanish at the planted root, the rank of their Jacobian at that
        root, and whether elimination (resultants or a Groebner basis on the small
        system) actually isolates the root.
      passes_if: >-
        Reported for every cell, success or failure. This control does not gate; it
        MEASURES HEUR-R1, which is the entire heuristic content of the reach.
      catches: >-
        A "recovery" that is a lucky single-vector hit rather than an attained reach,
        and the exact failure mode the Jochemsz-May heuristic is known to suffer as
        the lattice approaches density 1.
    -
      id: C5
      name: degenerate-GAP control
      procedure: >-
        For every sampled rank-r GAP, measure |V| directly by testing injectivity of
        (u_1..u_r) -> a_0 + sum a_j u_j on the u-box (exhaustively at toy sizes,
        otherwise by exact collision counting over the sampled box), and compare to
        nominal B. Additionally spot-check yield invariance: decomposition counts for a
        rank-r GAP versus an interval at matched measured |V| at the smallest p, against
        the KN-FIND-007 band.
      passes_if: >-
        Every GAP entering a reported cell has |V| >= 0.9 B; fewer than 10 percent of
        draws are excluded; the exclusion count is reported.
      catches: >-
        A rank-r GAP whose generators are not independent has |V| < B, which silently
        breaks the demand side of the comparison -- the entire "one side fixed" premise.
        A degenerate GAP averaged in rather than excluded would fabricate the control.
    -
      id: C6
      name: fast-path versus brute-force enumeration equivalence
      procedure: >-
        Compute every Arm A quantity twice at each (r,t) where brute force completes:
        once by direct enumeration of the substituted support and its Minkowski powers
        in 3r variables, once by the group-graded combinatorial identity.
      passes_if: >-
        Exact equality of s_p, every s_i, and every |M_k| and |M_k ^ M_{k+1}|.
      catches: >-
        An error in the group-graded identity, which is the load-bearing implementation
        claim that makes r >= 2 computable at all.
    -
      id: C7
      name: support-realization control (HEUR-R3)
      procedure: >-
        For at least 5 sampled generator sets per rank, expand the substituted S_3
        symbolically over F_p and compare the realised support to the predicted
        group-graded set.
      passes_if: >-
        Realised support equals the predicted set for every sample.
      catches: >-
        Coefficient cancellation making Arm A's polytope the wrong object for the
        coefficients Arm B actually uses; a single failure rescopes both arms.
    -
      id: C8
      name: coefficient-structure control (B1 versus B2)
      procedure: >-
        Compare the measured recovery thresholds of the generic-coefficient sub-arm B1
        and the true-curve sub-arm B2 at matched (r, t, p, bound grid).
      passes_if: >-
        Thresholds agree within one grid step, or the discrepancy is reported as a
        structural observation rather than absorbed into a mean.
      catches: >-
        A coefficient dependence that the polytope-only assumption of
        IDEA-20260808-c31f1c explicitly denies. This assumption is tested here, not
        inherited silently.
    -
      id: C9
      name: demand-invariance control
      procedure: >-
        Recompute eps_required(m,w) over the whole grid with the committed instrument
        and assert it is bit-identical to the rank-1 table; assert in the run summary
        that the per-slot bound product under substitution is B, i.e. r * (beta/r) =
        beta, and that #equations = w + 1 is unchanged.
      passes_if: >-
        All assertions hold and eps_required(m,0) == m/(2(m-1)) exactly, as in the
        committed test.
      catches: >-
        A silent renormalisation that would make the two sides of the comparison
        incommensurable -- the single easiest way to manufacture a spurious crossing.
    -
      id: C10
      name: information-bound sentinel
      procedure: >-
        Every reported supply value carries both the raw computed eps and
        min(eps, 1.0); any cell with raw eps > 1 is flagged polytope_non_binding: true
        and is excluded from all margin arithmetic.
      passes_if: >-
        No margin anywhere in the deliverable is computed from a raw eps above 1.
      catches: >-
        The interpretation trap: a bound above the information-theoretic ceiling read
        as an attainable reach. See interpretation_guard.

  independent_variables:
    - rank r in {1, 2, 3, 4}
    - 'block polynomial: S_3 (l = 2), S_4 (l = 3)'
    - 'substitution convention: SUB-EXACT, SUB-AFFINE'
    - 'Jochemsz-May multiplicity t (Arm A: extrapolated t -> infinity; Arm B: t in {1,2})'
    - arity m in {4,5,6,8,12,16,24,32} and kept windows w in [0, m-2] (demand grid)
    - total bound exponent beta on the 0.05..1.00 grid (Arm B sweep)
    - seed
    - 'sub-arm: B1 generic coefficients, B2 true curve coefficients'

  metrics:
    primary:
      - >-
        A1 eps_available_rank[r][block][convention]: exact Jochemsz-May extended
        reach of the substituted polytope, t -> infinity, with the Richardson
        residual reported.
      - >-
        A2 margin[r][m][w] = min(eps_available_rank[r], 1.0) - eps_required(m,w);
        best margin per r and overall, with the rank-1 row required to reproduce
        -0.0481 at (m,w) = (4,2).
      - >-
        A3 polytope_binding[r]: false when raw eps_available_rank[r] > 1.0, i.e. the
        Jochemsz-May argument has ceased to constrain the family at that rank.
      - >-
        B1 empirical_reach[r][t][sub-arm]: the largest total bound exponent at which
        the planted root is recovered in at least 80 percent of trials (the success
        convention of the committed probe).
      - >-
        B2 attainment_ratio[r][t][sub-arm] = empirical_reach[r][t] divided by the
        Jochemsz-May bound for the SAME lattice at the SAME finite t.
      - >-
        B3 independent_short_vectors[r][t] and jacobian_rank_at_root[r][t] and
        elimination_solved_rate[r][t]: the direct measurement of HEUR-R1.
    secondary:
      - substituted support size and per-group degree profile per (r, block, convention)
      - lattice dimension |M_0| and Richardson extrapolation residual per Arm A cell
      - random-polytope null distribution (min, median, 95th percentile, max) per cell
      - measured |V| per sampled GAP, degeneracy exclusion counts, yield spot-check
      - realised-versus-predicted substituted support per sampled generator set
      - LLL wall-clock and peak RSS per Arm B cell; aborted-cell inventory
      - univariate control residuals |empirical - 1/d| per d and seed
      - B1 versus B2 threshold discrepancies in grid steps
      - fast-path versus brute-force agreement inventory (cells checked, cells skipped)

  heuristic_under_test: HEUR-R1

  preregistered_prediction:
    quantity: >-
      eps_available for the degree-graded (SUB-EXACT) rank-r substituted all-S_3
      configuration, t -> infinity, under the normalisation
      prod(bounds) <= p^(eps * #equations); and the corresponding S_4 quantity.
    formula: >-
      From the centroid form of the Jochemsz-May asymptotic reach,
      eps = n^2 / ((n+1) * sum_i c_i), and the continuous centroid
      (2/(r+1), ..., 2/(r+1)) of the group simplex {alpha in R^r_{>=0} : sum alpha <= 2}:
      for S_3 with all three slots substituted, n = 3r and sum_i c_i = 3 * 2r/(r+1),
      hence
        eps_naive(r) = 3r(r+1) / (2(3r+1)),
      giving 3/4 = 0.7500 (r=1), 9/7 = 1.2857 (r=2), 9/5 = 1.8000 (r=3),
      30/13 = 2.3077 (r=4).
      For S_4 (four slots, per-slot degree 4, simplex {sum alpha <= 4}, centroid
      4/(r+1)), n = 4r and sum_i c_i = 16r/(r+1), hence
        eps_naive_S4(r) = r(r+1) / (4r+1),
      giving 2/5 = 0.4000, 6/9 = 0.6667, 12/13 = 0.9231, 20/17 = 1.1765 for r = 1..4.
      PREDICTED RELATIONS, frozen before any run:
        (i)  r = 1 must reproduce exactly the committed full-box values 0.7500 (S_3)
             and 0.4000 (S_4) on full-box supports, and 0.8408 (S_3) and 0.4137 (S_4)
             on the true sparse supports. This is the calibration, not a result.
        (ii) measured sparse eps_available_rank(r) >= eps_naive(r) for every r,
             because sparsity may only raise the reach, as it did at r = 1
             (0.8408 > 0.7500).
        (iii) eps_available_rank(r) > 1.0 for every r >= 2 on S_3, and for r = 4 on
             S_4, i.e. the Jochemsz-May polytope analysis STOPS BEING THE BINDING
             CONSTRAINT from rank 2 onward and the information bound takes over.
        (iv) attainment_ratio < 1 at r = 2 on at least two independent seeds while
             the univariate control reproduces 1/d.
    source: >-
      Derived in ledger/hypotheses/H-PFDR-3c7d1e.yaml (mechanism, items 1-2) from the
      Jochemsz-May full-box closed form eps = 2n/(d(n+1)), which is
      tools/smallroot_reach.py:jm_reach_closed_form and is verified against the exact
      shift-lattice sum by
      tests/test_smallroot_reach.py::test_jm_limit_matches_closed_form_full_box and,
      against Coppersmith's univariate theorem, by
      test_jm_calculator_reproduces_coppersmith. The centroid form reduces to it at
      c_i = d/2. The r = 1 calibration targets 0.7500/0.8408/0.4137 are the committed
      values of analysis/smallroot-reach/CLOSURE.md section 3. This prediction is
      FROZEN: it is never tuned after observing any outcome, and any change requires a
      versioned protocol_amendment in experiments/EXP-PFDR-9b4f2a/amendments/.

  scale_relevance:
    tier: toy
    justification: >-
      Arm A is exact combinatorics on Newton polytopes and carries no field size at
      all: it produces heuristic EXPONENTS under a declared normalisation, and its
      scale-freeness is a property of the convention, not evidence of transfer.
      Arm B runs at log2 p in {24, 32, 40} with lattice dimension capped at 512 and
      multiplicity t in {1,2}, which is toy by
      docs/claims-and-verification.md (max field bit size <= 32 is toy; the 40-bit
      cell is reported separately and does not upgrade the tier of the conclusion).
      TRANSFER ASSUMPTIONS, stated because they are assumptions and not results:
      (a) the Jochemsz-May reach is p-independent in the asymptotic convention, so
      Arm A's numbers are read as exponents rather than as measurements at any scale;
      (b) attainment measured at toy p and t in {1,2} with python-flint LLL is NOT
      claimed to transfer to cryptographic p, to larger t, or to stronger reduction
      (BKZ); a failure to attain at toy scale is a scoped negative observation and a
      success at toy scale would be a lead requiring escalation, not a result at scale.
    correspondence: null

  tail_checks:
    - >-
      Extrapolation stability: for each Arm A cell, the Richardson estimates at t and
      t/2 must differ by less than 0.01, and the sequence beta_max(t) must be monotone
      decreasing in t. A non-monotone or unstable cell is reported as unstable and
      excluded from the decision table rather than averaged.
    - >-
      Rank monotonicity: eps_available_rank must be non-decreasing in r for a fixed
      block and convention. A decrease contradicts the mechanism's account of the
      substitution and is a defect signal, not a finding.
    - >-
      Ceiling sanity: the raw eps_available_rank(r) for r >= 2 must exceed 1 by a
      margin larger than the extrapolation residual, otherwise the crossing is not
      resolved by the instrument and is reported as unresolved.
    - >-
      Howgrave-Graham consistency at the Arm B threshold: at the largest beta where
      recovery still succeeds, the recovered vector's norm must lie below the
      Howgrave-Graham bound for that lattice. A recovery whose vector is above the
      bound is luck, not attainment, and is excluded from empirical_reach.
    - >-
      Failure-side check: at one grid step ABOVE the measured threshold the recovery
      rate must fall below 20 percent. A threshold with no failure above it means the
      sweep did not reach the boundary and the cell is reported as censored.

  replication:
    seeds: [11, 29, 47]
    independent_instances: 3
    notes: >-
      Every stochastic cell (GAP sampling, coefficient sampling, planted roots, random
      polytope nulls, univariate control) is run under all three seeds independently,
      5 trials per (seed, beta) point, i.e. 15 trials per grid point. Arm A is
      deterministic apart from the random-polytope null and requires no seed except
      for that control. A cell reported on fewer than two seeds is preliminary and may
      not enter the decision table.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 12
    maximum_memory_gb: 8
    maximum_runs: 24
    maximum_workers: 1

  stopping_rules:
    - >-
      Arm A cell cap: any single exact cell exceeding 900 s wall clock is stopped and
      recorded status not_computed. Its modelled centroid value may be reported ONLY in
      a separate column explicitly labelled modelled, never in the measured column and
      never in a margin.
    - >-
      Brute-force cross-check cap: the enumeration reference is attempted only where it
      completes within 300 s and 4 GB; beyond that the cell is recorded
      brute_force_skipped with its reason, and the fast path stands on the cells where
      the equivalence was checked.
    - >-
      Arm B lattice cap: lattice dimension is capped at 512; any construction exceeding
      it is skipped and recorded dimension_capped. Any single LLL call exceeding 300 s
      is aborted and the cell recorded failed_infrastructure.
    - >-
      Arm B sweep: ascend the beta grid from 0.05; stop a cell after two consecutive
      grid points at recovery rate below 20 percent following the highest point at or
      above 80 percent, or on reaching beta = 1.00.
    - >-
      Rank ladder: run r = 1 and r = 2 to completion first in both arms. r = 3 and
      r = 4 are attempted in that order and are best-effort in Arm B; a partial rank
      ladder is a complete result provided r = 1 and r = 2 completed.
    - >-
      Run cap: 3600 s per run and 12 CPU-hours in total. On exhaustion the executor
      stops and reports partial coverage with the exact cells completed; it does not
      extend the budget, and it does not substitute a modelled value for a measured one.

  invalidation_rules:
    - >-
      Any calibration gate fails (C1 r = 1 values, C2 univariate 1/d, C9 demand
      invariance, or tests/test_smallroot_reach.py not green unmodified): the affected
      arm is INVALID, the run set returns to the executor with the defect listed, and
      no number from it is interpreted in either direction.
    - >-
      C6 fast-path versus brute-force disagreement at any checked cell: Arm A is
      invalid in full, because the group-graded identity is the load-bearing
      implementation claim.
    - >-
      C7 realised support differs from the predicted group-graded support for any
      sampled generator set: both arms are rescoped before interpretation; Arm A's
      polytope is then not the object Arm B is solving.
    - >-
      Any GAP with measured |V| < 0.9 B included in a reported cell: that cell is
      invalid. Exclusion must happen before aggregation, never by averaging.
    - >-
      A planted root that does not re-verify: the run wrapper re-substitutes the
      planted values into the constructed polynomial mod p with code independent of the
      constructor and confirms it vanishes; a failure is invalid_measurement, not a
      negative observation.
    - >-
      A margin anywhere in the deliverable computed from a raw eps above 1.0: the
      deliverable is invalid (C10 / interpretation_guard).
    - >-
      Any LLL timeout, crash, OOM, or missing dependency: recorded as
      failed_infrastructure. It is NEVER negative mathematical evidence about reach,
      attainment, HEUR-R1, or the hypothesis (AGENTS.md rule 3).
    - >-
      Any modification of tools/smallroot_reach.py, or any change to the frozen
      preregistered_prediction, without a versioned protocol_amendment in
      experiments/EXP-PFDR-9b4f2a/amendments/: the run set is invalid.
    - >-
      Manifest, seed, or raw/summary disagreement: run counts below the declared
      replication, missing seeds, or a summary value not reproducible from the raw
      records invalidates the affected cells.

  success_criterion: >-
    The experiment SUCCEEDS AS A MEASUREMENT, and its pre-registered prediction is
    confirmed, when ALL of the following hold on committed artifacts:
    (S1) every calibration gate passes: C1 (full box 0.7500 +- 0.02; sparse S_3
         0.8408 +- 0.002; S_4 0.4137 +- 0.002), C2 (univariate within 0.05 of 1/d on
         every seed), C6 (exact fast-path/brute-force agreement on every checked cell),
         C7, C9, and tests/test_smallroot_reach.py green unmodified;
    (S2) Arm A returns exact values for r in {1,2,3,4} on S_3 under both conventions,
         with eps_available_rank(r) >= eps_naive(r) for every r and
         raw eps_available_rank(r) > 1.0 for every r in {2,3,4} by more than the
         extrapolation residual;
    (S3) the S_4 ladder is reported for every r whose cell completed, with uncomputed
         cells recorded not_computed;
    (S4) Arm B returns a decidable empirical_reach and attainment_ratio for r in {1,2}
         on at least two independent seeds in BOTH sub-arms B1 and B2, each passing
         the Howgrave-Graham consistency and failure-side tail checks;
    (S5) C3, C4, C5, C8, C10 are reported in full, including null distributions,
         independence counts, and degeneracy exclusion counts.
    Confirmation of the prediction is (S2) plus attainment_ratio < 1 at r = 2 on at
    least two seeds. Note explicitly: confirmation here means the rank-1 CLOSURE
    ARGUMENT does not extend, NOT that an attack exists.

  falsification_criterion: >-
    The pre-registered prediction is FALSIFIED, with all calibration gates passing, by
    any one of:
    (F1) eps_available_rank(r = 2, SUB-EXACT, S_3) <= 1.0. The polytope bound still
         binds at rank 2, the CLOSURE.md comparison remains meaningful there, and the
         margin sign is read directly from A2: a negative margin for every tested r
         EXTENDS the rank-1 closure to rank r <= 4, which is a strengthening and a
         fully acceptable, informative outcome;
    (F2) measured sparse eps_available_rank(r) < eps_naive(r) at any r >= 2 while the
         r = 1 calibration passes, contradicting the mechanism's account of what the
         substitution does to the polytope;
    (F3) eps_required(m,w), the normalisation, or measured yield at matched |V| is
         found to change under substitution (C9, C5), so the comparison was never
         controlled and no margin may be reported;
    (F4) attainment_ratio >= 1 at r >= 2 on two or more independent seeds with C2
         passing -- real LLL reaching the Jochemsz-May bound in the regime where that
         bound exceeds the information ceiling. This is the outcome that opens a live
         attack lane; it is NOT reported as a result by the executor and routes
         immediately to independent review-breakthrough validation and a red-team pass
         on the lattice construction, the recovery check, and the density accounting;
    (F5) HEUR-R3 fails (C7), so Arm A's polytope is the wrong object.

  decision_rule: >-
    Read in this order, and only from committed artifacts:
    (1) If any invalidation rule fired, there is no result: the run set returns to the
        executor with the concrete defects listed. An invalid or incomplete run set is
        not evidence.
    (2) Otherwise compute the reported supply as
        eps_supply_reported(r) = min(max over conventions of eps_available_rank(r), 1.0)
        and the margin against the unchanged eps_required(m,w).
    (3) If eps_supply_reported(r) < eps_required(m,w) for every tested (m,w,r): the
        rank-1 closure EXTENDS to rank r <= 4 at the tested scale. Direction supports
        the closure; strength at most preliminary from a single arm and at most
        replicated with three seeds; scope is the tested grid, conventions, block sizes
        and budget. An adverse transition on any hypothesis requires a refutation
        artifact per docs/claims-and-verification.md, and Arm A's exactness makes a
        derivation note the appropriate level -- empirical_only would understate it.
    (4) If eps_supply_reported(r) >= eps_required(m,w) somewhere, the margin ALONE
        decides nothing, because under the prediction the supply column saturates at
        the ceiling for r >= 2 by construction. The decision then rests entirely on
        Arm B:
          (4a) attainment_ratio < 1 and empirical_reach < eps_required for every tested
               cell: the residual obstruction is ATTAINMENT, not the polytope. This is
               a NEW and different obstruction from the rank-1 one and must be recorded
               as its own measurement (obstruction block: quantity attainment_ratio,
               value with error bars, scope = tested r, t, p, solver, budget), with the
               rank-1 closure explicitly NOT extended by argument, only unbroken by
               measurement at the tested scale.
          (4b) empirical_reach >= eps_required on two or more seeds: a live attack lane
               is open. No conclusion is published from this contract. The Coordinator
               opens an independent review-breakthrough validation task and a red-team
               task on the lattice construction, the recovery verification, the density
               accounting, and the yield side, and only then decides.
        (4c) Arm B censored, capped, or infrastructure-failed in every cell: the result
             is INCONCLUSIVE. Arm A alone cannot discriminate between "the family is
             open" and "the bound is unattainable", and saying so plainly is the
             decision.
    (5) In every branch the conclusion is scoped to: the tested ranks, the tested
        (m,w) grid, S_3 and S_4 only, binary addition trees, the two declared
        substitution conventions, python-flint LLL at t in {1,2}, log2 p in {24,32,40},
        and this budget.

  interpretation_guard: >-
    THE TRAP THIS CONTRACT EXISTS TO PREVENT. eps_naive(2) = 9/7 > 1 and the measured
    value is predicted to be larger still. A value above 1 does NOT mean the attack
    works and is NOT a reach. It means the Jochemsz-May polytope argument can no longer
    close the family, and the binding question moves to whether real lattice reduction
    ATTAINS anything near the information bound. eps -> 1 is exactly lattice density 1,
    the regime in which low-density subset-sum lattice attacks are known to fail, so
    the prior is that it does not.
    Therefore, binding on every deliverable, run summary, evidence record, and
    downstream statement derived from this contract:
      - No margin may be computed from a raw eps above 1. Report both the raw value and
        min(eps, 1.0), with polytope_non_binding: true.
      - The phrase "eps_available > eps_required, family alive" is REFUSED. A family is
        alive only on an Arm B attainment measurement at or above eps_required,
        replicated across at least two independent seeds and independently reviewed.
      - "The polytope argument no longer binds" and "the family is open" are different
        statements about different objects. The first is what Arm A can show; the second
        is not.
      - Arm A alone may support at most a decision that the rank-1 closure ARGUMENT does
        not extend to rank r >= 2. It may never support a claim about ECDLP cost, an
        exponent, or dominated_by.

  claim_discipline:
    claim_tier: toy
    certificate_kinds:
      arm_a_runs: none (pure measurement; nothing is solved, so nothing is certified)
      arm_b1_runs: >-
        none, plus a mandatory independent re-substitution check that the recovered
        root satisfies the constructed congruence mod p using code disjoint from the
        solver; a failure is invalid_measurement.
      arm_b2_runs: >-
        decomposition. The planted instance is a genuine three-term relation on a
        genuine curve, so each B2 instance emits a decomposition certificate
        (target and summands) re-verified by independent curve arithmetic in the run
        wrapper. The certificate certifies that the INSTANCE is real; it certifies
        nothing about difficulty.
    dominated_by: >-
      Pollard rho / van Oorschot-Wiener at exponent 1/2, memory O(1). Unchanged by this
      experiment in every branch except 4b of the decision rule, and even there it
      changes only after independent review, never on this contract's own output.
    sota_delta: >-
      No attack delta. Methodological delta: computes the rank lever that
      analysis/smallroot-reach/CLOSURE.md section 6 item 1 leaves open and pairs it, in
      the same contract, with the attainment measurement section 6 item 4 asks for.
    asymptotic_claim_gates: >-
      Not applicable: this contract makes no asymptotic-complexity claim and no
      hypothesis here may move toward supported on it. Should branch 4b ever be
      reached, the four promotion gates (lemma decomposition, numbered heuristics with
      validation, concrete-cost table with honest overhead accounting, independent
      review-xhigh plus red team) all apply and none of them are discharged by anything
      in this contract.

  required_artifacts:
    - experiments/EXP-PFDR-9b4f2a/runs/<RUN-ID>/manifest.json (schema-complete, with the
      resolved inference block and the declared seeds)
    - experiments/EXP-PFDR-9b4f2a/runs/<RUN-ID>/raw-result.json (per-trial records,
      certificates where required by claim_discipline)
    - experiments/EXP-PFDR-9b4f2a/runs/<RUN-ID>/summary.json (every primary metric,
      every control verdict, every not_computed / capped / censored / skipped cell
      enumerated with its reason)
    - >-
      experiments/EXP-PFDR-9b4f2a/runs/<RUN-ID>/decision-table.json (the rank-r
      analogue of CLOSURE.md section 4: one row per (m, w, r, block, convention) with
      eps_required, raw eps_available, min(eps,1), margin, polytope_binding, alive flag)
    - tools/smallroot_reach_rank.py (new module; imports and does not modify
      tools/smallroot_reach.py)
    - tests/test_smallroot_reach_rank.py (must include the r = 1 calibration gates, the
      fast-path/brute-force equivalence, and the centroid closed-form check
      eps_naive(1) == 3/4)
    - >-
      analysis/smallroot-reach-rank-r/RANK-R.md (derivation note: the centroid form, the
      group-graded Minkowski identity, the two substitution conventions and why
      SUB-EXACT is the r = 1 calibration, and the honest statement of what an eps above
      1 does and does not mean). This is the refutation artifact if the outcome is
      adverse to any hypothesis, and it is archived BEFORE any decision relying on it.
    - a defects list instead of results if any invalidation rule fired

