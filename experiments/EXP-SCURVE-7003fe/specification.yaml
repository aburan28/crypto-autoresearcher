# EXP-SCURVE-7003fe
# Stage-0 trigger calibration for H-SCURVE-01f984.
# Frozen before the official run.
experiment:
  id: EXP-SCURVE-7003fe
  hypothesis_id: H-SCURVE-01f984
  source_idea: IDEA-20261007-bc5054
  question_id: RQ-SCURVE-7af163
  goal_id: GOAL-SCURVE-873d08
  version: 1
  title: >-
    Trace-one and embedding-degree triggers on three toy curves
  status: approved
  frozen: true
  designed_at: '2026-10-12'
  approved_by: coordinator
  approval_decision_id: DEC-20261012-684bf5
  execution_authorized: true
  objective: >-
    On three nonsingular short-Weierstrass curves, recompute the
    point count two ways and apply one predicate: TRIGGER when the
    trace is 1 or an embedding degree at most 12 exists. The two
    positives must trigger. The negative curve and the destroyed-trace
    null must not. Do not score M-221.
  inputs:
    embedding_bound: 12
    positive_anomalous: {p: 5, A: 3, B: 2}
    positive_embedding: {p: 5, A: 0, B: 1}
    negative: {p: 17, A: 3, B: 5}
    null: {trace: 0, order: 5, p: 5}
    named_future_run_slot: RUN-SCURVE-acab50
  controls:
    - >-
      Legendre and square-scan point counts agree, each curve is
      nonsingular, and each trace satisfies the Hasse bound
      |t| <= 2*floor(sqrt(p)). Failure invalidates the cell.
    - >-
      The null uses the same predicate on trace 0 and order 5, which
      removes the trace-one condition and blocks an embedding degree.
  independent_variables:
    - the curve role, from the frozen list, not chosen after a trigger bit
  metrics:
    primary:
      - matrix_holds
      - beyond_matrix
    secondary:
      - trace
      - order
      - planted_ok
  heuristic_under_test: >-
    IDEA-20261007-bc5054 calibration: verified positives trigger and
    the negative and the null do not, through one predicate.
  preregistered_prediction:
    quantity: >-
      A row triggers when its trace equals 1 or the field prime has
      multiplicative order dividing the group order at some degree
      from 1 to 12. The null is the pair (trace 0, order 5) over F_5.
    formula: >-
      The positive reading is both positives trigger and both the
      negative and the null do not. The negative reading is any other
      pattern, with the point-count controls holding.
    source: >-
      IDEA-20261007-bc5054 requires trigger rate 1 on positives and
      0 on the negative and the null. The embedding search bound 12
      was fixed with the curve list, before this driver was executed.
  scale_relevance:
    tier: toy
    justification: >-
      Primes 5 and 17 only. No 221-bit prime and no SafeCurves intake
      cell.
    correspondence: null
  tail_checks:
    - >-
      The embedding search stops at 12. A larger search is not this
      contract.
    - >-
      A singular curve invalidates the cell.
  replication:
    seeds: []
    independent_instances: 2
    named_future_run_slot: RUN-SCURVE-acab50
    replication_note: >-
      One deterministic pass. The two instances are the two point-count
      methods, not two random curves.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 30
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one valid manifest for RUN-SCURVE-acab50.
    - Do not add a curve, a bound, or an M-221 readout in this contract.
    - A missed matrix is the recorded result. Do not change the predicate.
  invalidation_rules:
    - The two point counts disagree.
    - A curve is singular or its trace breaks the stated Hasse check.
    - A timeout, crash, or missing trigger bit.
  success_criterion: >-
    The manifest is valid, planted_ok is true, both positives trigger,
    and the negative and the null do not.
  falsification_criterion: >-
    The manifest is valid, planted_ok is true, and a positive does not
    trigger or the negative or the null does.
  decision_impact:
    on_positive: >-
      Record that this predicate separates the two toy positives from
      the negative and the null. Do not read that as a safety verdict
      and do not score M-221 from this pass alone.
    on_negative: >-
      Record that the calibration matrix failed. Do not emit an M-221
      comparison from this manifest.
  required_artifacts:
    - experiments/EXP-SCURVE-7003fe/runs/RUN-SCURVE-acab50/manifest.yaml
    - experiments/EXP-SCURVE-7003fe/runs/RUN-SCURVE-acab50/raw-result.json
  assigned_to: executor
  launcher:
    trial_plan: experiments/EXP-SCURVE-7003fe/trial-plan.json
    driver: experiments/EXP-SCURVE-7003fe/implementation/run.py
    checker: experiments/EXP-SCURVE-7003fe/implementation/check.py
  out_of_scope:
    - M-221, SafeCurves intake cells, and any safety or vulnerability conclusion.
    - BN(2,254) itself, rho costs, and any claim of an attack.
