    product xy calibrator.

  objective: >
    Evaluate the exact identity that on
    p=19, A=1, B=-1, P=(2,3) one has
    Pi=x*y=6 and
    Pi'=x([2]P)*y([2]P)=5, and rejects
    the nearby claim that Pi'=6, on one
    frozen family (REAL, KF, NULL).
    Stage 0 does not form a real Gamma
    orbit, does not run a unary-closure
    census, and does not authorize
    Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL has
      Pi=6, Pi'=5; KF constant claim
      rejected because Pi'=5;
      NULL empty product rejected; y=0
      rejected. Certificate kind none.
    formula: >
      Affine doubling then product.
      REAL: P=(2,3), [2]P=(16,11),
      Pi=6, Pi'=5.
      KF: claim Pi'=6, actual 5,
      rejected as a generic
      doubling-product target.
    claim_tier: observational

  inputs:
    fixture:
      real_curve:
        p: 19
        A: 1
        B: -1
        P: [2, 3]
        P2: [16, 11]
        must_pi: 6
        must_pi_prime: 5
      known_false:
        kind: constant_pi_prime
        claimed_pi_prime: 6
        must_pi_prime: 5
        must_reject: true
      matched_null:
        kind: empty_product
        must_reject: true
      invalid:
        - {y_zero: true, point: [2, 0], must_reject: true}

  controls:
    - name: known_false_constant
      object: KF claim Pi' equals 6
    - name: matched_null
      object: empty product
    - name: invalid_y_zero
      object: y=0 doubling input

  independent_variables:
