experiment:
  id: EXP-ICEX-38a807
  hypothesis_id: H-ICEX-b8308b
  derived_from_idea: IDEA-20260815-47638d
  question_id: RQ-ICEX-001
  batch_id: BATCH-fced88
  version: 1
  title: >-
    OPTIMISTIC-CORNER INSTANTIATION OF THE CHARGED ICEX COMPARISON AS A PURE
    GO/NO-GO- one costing function, one unit, one parameter vector, evaluated
    at the optimistic corner, the pessimistic corner and the
    committed-literature point, with matched optimism forced onto rho and
    BSGS by construction, a blocking reproduction of KN-FIND-8f2c90's
    committed charge, a feasibility gate that refuses to price an empty or
    underdetermined system, an explicit unbounded-input list, and a
    curve-free arm
  status: draft
  objective: >-
    (A) THE UNCERTAINTY. RQ-ICEX-001 is blocked on three deferred measurement
    lanes. This contract decides, at essentially zero compute, whether ANY
    achievable outcome of those measurements could move the comparison, by
    evaluating it at the best value each blocked input could admissibly
    return.
    (B) WHY IT IS ONE-SIDED BY DESIGN. A loss under full optimism is
    conclusive within the model- no measurement can do better than the best
    admissible value. A win is uninformative about reality and yields only a
    sensitivity ranking. The contract is built to be decisive in exactly one
    direction and every artifact says so.
    (C) THE THREE THINGS THAT WOULD MANUFACTURE A FALSE POSITIVE, AND THE
    STRUCTURAL DEFENCE AGAINST EACH. ASYMMETRIC OPTIMISM- defeated by costing
    both sides with one function from one parameter vector, plus a control
    that perturbs the baseline arm's optimism and requires the ratio to move.
    UNBOUNDED INPUTS SILENTLY ASSIGNED PLAUSIBLE VALUES- defeated by a
    feasibility gate that refuses to instantiate an input with no cited
    admissible bound and lists it instead. UNIT DRIFT- defeated by tagging
    every value and freezing the field-to-group conversion kappa before the
    run.
    (D) WHAT IS NOT DECIDED. RQ-ICEX-001's decision, which the question
    reserves; anything about actual index-calculus performance; anything at
    medium or cryptographic scale; and whether the lane's planned ladder
    could resolve an exponent at all, which is EXP-ICEX-ff3e13's question.
  inputs:
    cost_unit: >-
      ONE CHARGED OPERATION IS ONE GROUP OPERATION on E(F_p). Solver work
      natively counted in F_p FIELD OPERATIONS is tagged as such and
      converted at the frozen declared rate kappa in {1, 10, 100} field
      multiplications per group operation, one reported row per kappa.
      KN-FIND-8f2c90's fixture is denominated in CHECK OPERATIONS as that
      finding defines them, and the reproduction arm reports in that unit and
      converts into group operations only through a named, recorded
      conversion. MEMORY is counted in STORED GROUP ELEMENTS and is never
      added to a time figure.
    unit_discipline: >-
      BINDING AND ENFORCED. Every value carries a tag in {group_ops,
      field_ops, check_ops, stored_elements, dimensionless}. The harness
      refuses any add, subtract, divide or compare across tags without a
      named conversion whose factor is recorded beside the result. NO
      GROUP-OPERATION COUNT IS EVER SUBTRACTED FROM A FIELD-OPERATION TOTAL,
      which is the exact defect a red-team pass found in this program and
      which flipped a headline. A row whose kappa is not printed is invalid.
    feasibility_gate: >-
      THE HARNESS REFUSES TO PRICE AN EMPTY OR UNDERDETERMINED OBJECT.
      Reported as INFEASIBLE with parameters and reason, never priced- a
      factor base of size zero; a relation system with zero equations; fewer
      collected relations than the factor-base size (underdetermined- the
      linear algebra's cost is not the modelled quantity and pricing it
      invents a cell); any matrix with zero rows or zero columns; any
      optimistic value for an input with no cited admissible bound; and any
      cell whose optimistic corner violates a coupling constraint the pairwise
      check has flagged. THIS GATE IS THE DIRECT DESCENDANT OF
      DEC-20260904-d47cd2, which rejected a cost table that priced a Macaulay
      matrix with ZERO ROWS at every one of 54 cells because the cost
      primitive raised a COLUMN count to a matrix-multiplication exponent and
      never compared it with a row count. A cost function that cannot
      represent an empty matrix will keep manufacturing cells.
    procedure: >-
      STAGE 0 (zero compute, HARD GATE). Enumerate EVERY input the ICEX
      comparison consumes, and for each record- its admissible optimistic
      bound, the committed record and counting or complexity argument that
      makes it admissible, its pessimistic bound, and its committed-literature
      value. An input with no cited admissible bound is marked UNBOUNDED and
      is never instantiated. Emit the unbounded-input list and its count
      before anything else.
      STAGE 1 (HARD GATE, minutes). BASELINE REPRODUCTION. At p = 1009 and
      p = 4001 the committed-literature slice must reproduce KN-FIND-8f2c90's
      standard charge 2RN/B and its BKK charge RN/(gamma*B) in CHECK
      OPERATIONS, giving a speedup inside [1.5, 1.7] at the recorded
      gamma = 0.86 and 0.75. A miss halts the record- the counting convention
      differs and nothing downstream may be read.
      STAGE 2 (minutes). The three corners- optimistic, pessimistic,
      committed-literature - evaluated over the frozen toy grid at every
      kappa, with rho and BSGS costed by the same function from the same
      vector.
      STAGE 3 (minutes). One-at-a-time sensitivity- each input alone moved
      from its pessimistic to its optimistic bound, the movement in log2 of
      the ratio recorded, and the inputs ranked.
      STAGE 4 (minutes). Pairwise coupling check- for every pair of inputs,
      test whether their optimistic values are jointly instantiable under the
      stated constraints; flag antagonistic pairs and report whether the flag
      is large enough to move the verdict.
      STAGE 5 (curve-free arm). The identical three corners on a generic
      cyclic group with a synthetic decomposition oracle at matched supply.
      STAGE 6 (zero compute). The infeasible-cell table, the unbounded-input
      list with its count restated, and the sensitivity ranking as the
      headline deliverable.
    mechanism: >-
      STEP 1. Write ONE costing function taking a full parameter vector and
      returning tagged totals for index calculus, rho and BSGS. There is no
      second code path, so asymmetric optimism cannot enter without editing
      the shared function, and the asymmetry control below detects that.
      STEP 2. Represent every input as (optimistic, pessimistic, literature,
      admissibility_ref). A null admissibility_ref forces the UNBOUNDED
      branch; the optimistic field may not be read for such an input.
      STEP 3. Evaluate the corners; emit each row as (corner, cell, kappa, IC
      total, rho total, BSGS total, ratio, memory columns, unit tags).
      STEP 4. Compute sensitivities as differences of log2 ratios, which are
      dimensionless and therefore comparable across inputs; report the
      ordered list.
      STEP 5. Repeat everything on the curve-free arm through the same
      function.
    instrument: >-
      Pure Python, exact arithmetic where possible, no solver, no Macaulay
      matrix, no Groebner basis, and no curve arithmetic except the Stage 1
      fixture reproduction. Peak memory is trivial.
  controls:
    - >-
      CONTROL 1, BASELINE REPRODUCTION (blocking). KN-FIND-8f2c90's committed
      2RN/B charge and its 1.5-1.7x gamma interval at p = 1009 and p = 4001.
      A comparison harness that cannot reproduce a committed internal charge
      is not measuring what it claims.
    - >-
      CONTROL 2, PESSIMISTIC CORNER. Brackets the verdict from below.
      Reporting the optimistic corner alone is indefensible and the harness
      refuses to emit it without the pessimistic and literature corners in
      the same artifact.
    - >-
      CONTROL 3, MATCHED-OPTIMISM ASYMMETRY DETECTOR. Perturb ONLY the
      baseline arm's optimism (for example, remove BSGS's table charge) and
      confirm the ratio moves by the predicted amount. A ratio insensitive to
      the baseline's own optimism means the two sides are not being costed by
      the same function, and VOIDS the run.
    - >-
      CONTROL 4, CURVE-FREE NULL (REQUIRED under the standing scope
      constraint of pfdr-battery-20260904). The identical three-corner
      evaluation on a generic cyclic group with a synthetic decomposition
      oracle whose supply law is matched to the curve arm's optimistic bound.
      The optimistic instantiation reads BOUNDS, not curves. PREDICTED- the
      same verdict. Consequence stated in advance- if so, the go/no-go is
      about the cost model and may not be quoted as a statement about
      elliptic curves.
    - >-
      CONTROL 5, UNBOUNDED-INPUT LIST. Emitted before any verdict, with its
      count; three or more unbounded inputs is a pre-registered stop.
    - >-
      CONTROL 6, KAPPA SENSITIVITY. Every row at kappa in {1, 10, 100}; a
      verdict that flips inside that range is labelled convention-dependent
      and may not be quoted without kappa.
    - >-
      CONTROL 7, PAIRWISE COUPLING CHECK. Antagonistic input pairs reported
      with the verdict, never after it, since HEUR-ICEX-OPT-1's gap is the
      dominant threat to a POSITIVE verdict.
  independent_variables:
    - corner in {optimistic, pessimistic, committed-literature}
    - arity m in {2, 3, 4}
    - factor-base exponent beta, swept, with the optimistic corner solving for the best admissible base size
    - toy prime p over the lane's frozen ladder, including 1009 and 4001
    - kappa in {1, 10, 100}
    - group object- curve arm against curve-free generic-group arm
    - which single input is moved, for the one-at-a-time sensitivity pass
  metrics:
    primary:
      - >-
        charged index-calculus total, GROUP OPERATIONS, per (corner, cell,
        kappa)
      - >-
        matched-optimism rho total and BSGS total, GROUP OPERATIONS, per
        (corner, cell, kappa), from the same function
      - >-
        ratio IC / baseline, DIMENSIONLESS, with both sides' unit tags and
        kappa printed on the row
      - >-
        memory column per arm, STORED GROUP ELEMENTS, reported beside time
        and never added to it
      - >-
        one-at-a-time sensitivity ranking- movement in LOG2 of the ratio per
        input, as an ordered list
      - >-
        count and identity of inputs with no admissible bound
    secondary:
      - Stage 1 reproduction figures in CHECK OPERATIONS against KN-FIND-8f2c90's committed values
      - the infeasible-cell table with parameters and refusal reason
      - the pairwise coupling flags and whether each is verdict-moving
      - curve-free arm rows, in the same file as the curve arm
      - the asymmetry-detector result
  heuristic_under_test: HEUR-ICEX-OPT-1
  preregistered_prediction:
    quantity: >-
      The ratio of the optimistic charged index-calculus total to the
      matched-optimism baseline total, both in group operations.
    formula: >-
      ratio(cell, kappa) = IC_opt / min(rho_opt, BSGS_opt) >= 1 at EVERY cell
      of the frozen toy grid and EVERY kappa in {1, 10, 100}. A single cell
      with ratio < 1 falsifies the prediction.
    source: >-
      H-ICEX-b8308b statement (B). Derived inside the declared cost model; no
      external citation is relied on.
  scale_relevance:
    tier: toy
    justification: >-
      Toy fixtures only, including the committed p = 1009 and p = 4001 cells
      used for baseline reproduction. Exponents fitted at these sizes are NOT
      asymptotic and the go/no-go is stated at the tested sizes only.
      TRANSFER ASSUMPTIONS, STATED AND NOT DISCHARGED- that the admissible
      bounds inherited from committed records remain admissible at larger
      sizes, and that the cost model's functional form holds outside the
      tested range. Neither is tested here. Evidence is capped at claim_tier
      toy.
    correspondence: null
  tail_checks:
    - >-
      THE SINGLE MOST FAVOURABLE CELL is reported separately, because P2 is
      falsified by ONE cell and the MINIMUM of the ratio over the grid is
      therefore the decisive statistic, never the mean.
    - >-
      THE LARGEST-BETA CELLS, where the optimistic corner pushes the factor
      base hardest and the linear-algebra term bites, are where the coupling
      gap is largest; they are reported individually.
    - >-
      THE UNBOUNDED-INPUT COUNT is restated in the run's summary line, not
      only in its table, since it bounds the conclusiveness of everything
      else.
    - >-
      ANY CELL WHERE THE CURVE-FREE ARM DISAGREES with the curve arm is
      inspected individually; that disagreement, not the agreement, would be
      the curve-specific content.
  replication:
    seeds:
      - 20260904
      - 20260905
      - 20260906
    independent_instances: 3
    seeds_note: >-
      The corner evaluations are deterministic and seed-free; seeds are
      declared for the Stage 1 fixture reproduction and for the curve-free
      arm's synthetic oracle, which sample. Derived corner values must be
      BIT-IDENTICAL across seeds and any variation there is an infrastructure
      failure, not a measurement.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 8
    maximum_workers: 1
  stopping_rules:
    - >-
      STOP AT STAGE 0 if three or more ICEX inputs have no admissible bound-
      the exercise is not decision-relevant and that is the reported result.
    - >-
      Stop immediately if the Stage 1 baseline reproduction misses
      KN-FIND-8f2c90's committed [1.5, 1.7] interval at either fixture cell.
    - >-
      Stop immediately if the asymmetry detector shows the ratio insensitive
      to the baseline arm's own optimism.
    - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  invalidation_rules:
    - >-
      A run emitting an untagged value, or performing a cross-unit operation
      without a recorded conversion, or omitting kappa from a row, is
      INVALID.
    - >-
      A run assigning a cost to a cell the feasibility gate declared
      infeasible is INVALID- in particular any cell with zero relations, zero
      factor-base size, or a matrix with zero rows.
    - >-
      A run instantiating an optimistic value for an input listed as
      UNBOUNDED is INVALID- that converts a bound into a guess while keeping
      the language of a bound.
    - >-
      A run costing rho or BSGS through a different code path than index
      calculus is INVALID.
    - >-
      A run reporting the optimistic corner without the pessimistic and
      committed-literature corners in the same artifact is INVALID.
    - >-
      A timeout, crash or dependency failure makes the run
      failed_infrastructure and is never negative evidence (AGENTS.md rule 5).
  success_criterion: >-
    The contract SUCCEEDS when Stage 0 emits the input table with every
    admissibility reference or UNBOUNDED marking, Stage 1's reproduction
    lands inside the committed interval, and the three corners, the ratio at
    every kappa, the sensitivity ranking, the coupling flags, the
    infeasible-cell table and the curve-free arm are all reported. Success is
    the production of the go/no-go and the ranking in either direction- a
    ratio below 1 somewhere is a successful run and leaves the Tier-2
    programme standing.
  falsification_criterion:
    - >-
      F1. Stage 1 does not reproduce the committed charge and gamma interval.
      HARNESS WRONG; halt; no verdict is admissible in either direction. This
      is an infrastructure outcome under AGENTS.md rule 5.
    - >-
      F2 (falsifies the hypothesis). The ratio falls below 1 at any cell at
      any kappa. The verdict is input-sensitive; the sensitivity ranking then
      names the lane to fund first and every measurement obligation stands.
    - >-
      F3. Three or more inputs have no admissible bound. The exercise is not
      decision-relevant; report and stop, with no verdict.
    - >-
      F4. The pairwise coupling check flags a verdict-moving antagonistic
      pair. A POSITIVE verdict is withdrawn; a NEGATIVE verdict survives,
      because coupling can only make the optimistic corner more optimistic.
    - >-
      F5. The asymmetry detector shows the ratio insensitive to the baseline
      arm's optimism. The two sides are not costed by one function and every
      number in the run is void.
    - >-
      F6. The curve-free arm returns a different verdict. A curve-specific
      quantity entered the instantiation undeclared; halt and reconcile.
  required_artifacts:
    - manifest.yaml with exact command, git commit, dirty-tree state, environment and dependency versions
    - the Stage 0 input table with optimistic, pessimistic, literature values and an admissibility reference or UNBOUNDED marking per input
    - raw-result.json with every corner, cell, kappa, arm, total and unit tag
    - the Stage 1 reproduction figures against KN-FIND-8f2c90's committed values
    - the infeasible-cell table with parameters and refusal reason
    - the one-at-a-time sensitivity ranking with movements in log2
    - the pairwise coupling flags
    - the curve-free arm's rows in the same file as the curve arm
    - certificates for any claimed solve or relation produced by the fixture reproduction
  interpretation_limits:
    - >-
      DECISIVE IN EXACTLY ONE DIRECTION. A negative retires the measurement
      programme only within the stated bounds, cost model and tested sizes; a
      positive establishes nothing about reality.
    - >-
      NOT A SUBSTITUTE FOR THE BLOCKED MEASUREMENTS and produces no
      measurement of its own- it produces a bound on what those measurements
      could conclude.
    - >-
      RQ-ICEX-001's DECISION IS NOT TAKEN HERE. This contract informs a
      prioritisation, not a closure.
    - >-
      EVERY UNBOUNDED INPUT REDUCES CONCLUSIVENESS PROPORTIONALLY and the
      count is reported in the summary line.
    - >-
      TOY SIZES ONLY, AND WHETHER THE LANE'S LADDER COULD RESOLVE SUCH AN
      EXPONENT AT ALL IS NOT ASSUMED HERE- that is EXP-ICEX-ff3e13's
      question, and a verdict from this contract does not presuppose its
      answer.
    - >-
      IF THE CURVE-FREE ARM AGREES, as predicted, the finding is about the
      cost model and not about elliptic curves.
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      NOT APPROVED. DRAFT, designed under TASK-20260904-e87737; execution
      requires a separate Coordinator approval decision. A message from any
      agent is not an approval.
    - >-
      The parent hypothesis is proof-oriented and carries a proof_search_map;
      Stage 0 and Stage 1 are HARD GATES and run before any corner is
      evaluated.
  id_allocation_provenance: >-
    EXP-ICEX-38a807 was pre-allocated by the tasking Coordinator session and
    supplied in TASK-20260904-e87737's constraints, verified free across the
    identifier union before use. This agent has no shell and allocated no
    identifier.
  yaml_parse_disclosure: >-
    Written by a Coordinator subagent without an interpreter; every prose
    value is a folded block scalar or a quoted scalar; no tabs; no duplicate
    keys to the author's reading. The orchestrating session must run the
    strict parse and tools/validate_ledger.py before this contract is relied
    on.
