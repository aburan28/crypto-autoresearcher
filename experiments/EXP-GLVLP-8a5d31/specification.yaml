experiment:
  id: EXP-GLVLP-8a5d31
  hypothesis_id: null
  hypothesis_id_note: >-
    Large-prime relation-graph experiment layered on the existing EC
    large-prime variation. The new object is a GLV orbit quotient with explicit
    Z/3 orientation labels; it does not treat orbit-collapsed vertices as equal
    points and it does not count invalid quotient cycles as relations.
  question_id: RQ-EQIC-8cb959
  related_question_ids:
    - RQ-RELN-001
    - RQ-EQLA-0d3f40
    - RQ-ICPERF-94c86e
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    GLV voltage-graph large-prime variation: quotient relation-graph vertices by
    C3 while preserving orientation and exact cycle liftability

  objective: >-
    Measure whether an order-3 GLV quotient reduces memory, graph-processing
    cost, or edges-to-independent-full-relation in a one/two-large-prime
    relation collector. The quotient is exact only when each partial-relation
    edge carries its GLV orientation, so a cycle is accepted only if its
    accumulated Z/3 voltage closes. The experiment explicitly measures the
    false-cycle rate of a naive orientation-free quotient as a negative control.

  predecessor_context:
    large_prime_baseline: >-
      Reuse the existing EC large-prime variation and its partial-relation
      verification rules (IDEA-20260731-012 / H-ICEX-87ad66 or their current
      superseding implementation). Do not alter the definition of a valid
      partial relation.
    GLV_factor_base: >-
      Factor-base and large-prime pools are unions of complete phi-orbits on
      j=0 curves. Every point can be written uniquely as phi^j(P_rep) within its
      free orbit, with j in Z/3, subject to explicit exceptional-orbit handling.

  quotient_graph:
    full_graph: >-
      Vertices are actual large-prime points (or the exact incumbent LP vertex
      objects); verified partial relations are edges with their ordinary factor
      base contribution.
    quotient_vertices: >-
      Replace each free GLV orbit {L,phi(L),phi^2(L)} by a canonical representative.
    edge_voltage: >-
      For an edge joining phi^a(U) to phi^b(V), store delta=b-a mod 3 under a
      fixed orientation convention, plus the transformed factor-base row needed
      to reconstruct the exact full edge.
    cycle_lift_rule: >-
      A quotient cycle is liftable to a closed cycle in the full graph only when
      the signed sum of edge voltages around the cycle is 0 mod 3. Accepted
      cycles are lifted explicitly and every resulting full relation is
      independently verified before entering the matrix.
    exceptional_policy: >-
      Non-free orbits, infinity, repeated LP points, loops, and multi-edges are
      tagged and handled by a frozen exact policy. They are never silently
      forced into length-3 orbit logic.

  arms:
    - id: ARM_FULL
      description: >-
        Incumbent large-prime graph on actual LP vertices with ordinary cycle
        detection and verified cycle-to-full-relation reconstruction.
    - id: ARM_GLV_VOLTAGE
      description: >-
        C3-orbit quotient graph with edge voltages and zero-voltage cycle gate.
    - id: ARM_GLV_NAIVE
      description: >-
        Deliberately discard edge voltages after orbit quotienting. This is a
        negative control: any nonliftable cycles it emits must fail full-relation
        verification and quantify the danger of naive quotienting.
    - id: CTRL_RANDOM_ORBITS
      description: >-
        Partition LP vertices into random size-3 buckets matched to the GLV orbit
        histogram and attach random Z/3 labels. Tests whether any graph benefit is
        generic vertex coarsening rather than GLV equivariance.

  inputs:
    procedure: >-
      Stage 0 reproduces the current full large-prime collector on frozen toy
      fixtures. Stage 1 constructs GLV orbit representatives and proves each
      stored orientation by direct phi application. Stage 2 streams the identical
      verified partial-relation edge sequence into all arms; graph algorithms may
      not influence relation generation. Stage 3 detects cycles online and in a
      final batch pass. ARM_GLV_VOLTAGE checks voltage closure before lift;
      ARM_GLV_NAIVE attempts the same lift without the gate and records failures.
      Stage 4 converts verified cycles to full relation rows and measures
      informative rank arrival on the folded GLV factor-base matrix.
    parameter_grid:
      bit_sizes: [12, 14, 16, 18, 20]
      large_prime_modes: [one_LP, two_LP]
      seeds: [20260918, 20260919, 20260920]
      edge_budgets: >-
        Frozen geometric ladder chosen before the run, with identical prefix
        lengths across arms so edges-to-cycle and edges-to-rank are comparable.
      LP_pool_sizes: >-
        At least three sizes per bit rung; GLV and full arms use the same physical
        LP point set before quotienting.

  controls:
    - >-
      Identical edge stream: relation generation runs once and its immutable
      verified edge stream is replayed into every graph arm.
    - >-
      Orbit orientation audit: every LP vertex round-trips
      rep + orientation -> original point exactly.
    - >-
      Cycle-lift audit: every accepted quotient cycle is lifted edge-by-edge to a
      closed full-graph cycle before matrix insertion.
    - >-
      ARM_GLV_NAIVE must produce invalid cycles whenever nonzero-voltage quotient
      cycles occur; if it never differs from the voltage arm, report that the
      tested stream had no discriminating cycles.
    - >-
      CTRL_RANDOM_ORBITS uses identical bucket sizes and graph code.
    - >-
      Final relation rows are folded using the same lambda orientation rules as
      EXP-GLVFB-5f287d and independently curve-verified.

  metrics:
    primary:
      - physical_LP_vertices_seen
      - quotient_LP_vertices_seen
      - graph_edges_seen
      - graph_bytes_peak
      - graph_update_seconds
      - cycle_detection_seconds
      - quotient_cycles_found
      - zero_voltage_cycles
      - nonzero_voltage_cycles
      - lifted_cycles_verified
      - invalid_naive_cycles
      - independent_full_relations
      - edges_to_first_verified_full_relation
      - edges_to_target_informative_rank
      - total_seconds_to_target_informative_rank
    secondary:
      - connected_components
      - cycle_rank_E_minus_V_plus_C
      - zero_voltage_cycle_fraction
      - orbit_collision_rate
      - loops_after_quotient
      - multiedge_multiplicity
      - average_cycle_length_full
      - average_cycle_length_quotient
      - relation_row_weight
      - folded_relation_row_weight
      - matrix_nnz
      - peak_total_bytes_graph_plus_matrix
      - charged_ratio_GLV_VOLTAGE_over_FULL

  benchmark_contract:
    incumbent: ARM_FULL
    existing_large_prime_reference: IDEA-20260731-012
    relation_reference: RQ-RELN-001
    icperf_reference: RQ-ICPERF-94c86e
    decision_metric: >-
      Edges and charged seconds to VERIFIED independent full relation / target
      informative rank, plus peak graph memory. Raw quotient cycle count is not
      a success metric.
    success_threshold: >-
      ARM_GLV_VOLTAGE must reduce peak graph memory by at least 25% and either
      edges-to-target-rank or graph-processing time by at least 20% versus
      ARM_FULL at two consecutive sizes, with identical verified final relation
      span. A memory-only win is reported as such and not called relation-yield
      improvement.
    independence_rule: >-
      Multiple quotient cycles that lift to scalar/GLV transforms of the same
      full relation are deduplicated before rank accounting.

  preregistered_predictions:
    - >-
      Vertex memory should approach a constant-factor reduction because free
      GLV orbits collapse three physical LP points to one representative.
    - >-
      Quotient cycle count will overstate useful relations unless voltage closure
      is enforced.
    - >-
      After enforcing zero voltage, the number of independent full relations may
      be close to the full graph; the likely gain is graph memory/lookup cost
      rather than a new relation probability.
    - >-
      Any claimed relation-yield gain must survive identical-edge-stream
      replay, proving it comes from recombination rather than changed harvesting.

  scale_relevance:
    tier: toy
    correspondence: >-
      The C3 quotient mathematics transfers to secp256k1-style GLV orbits, but
      LP graph occupancy and memory scaling are measured only on toy relation
      streams. No full secp256k1 relation campaign is implied.

  stopping_rules:
    - Stop if the incumbent full-graph fixture cannot be reproduced.
    - Stop if any GLV orbit orientation fails round-trip verification.
    - Preserve all nonzero-voltage and failed-lift cycles as first-class outputs.
    - Do not alter graph cycle policy or LP pool size after viewing cycle counts.
    - Keep relation-generation time separate because the edge stream is shared.

  invalidation_rules:
    - Any accepted quotient cycle that fails full-graph lift invalidates the voltage arm.
    - Any final relation failing independent curve verification invalidates the run.
    - Any arm seeing a different edge stream is not comparable.
    - Any rank metric counting GLV-transformed duplicate rows as independent is invalid.
    - Timeout, crash, or memory exhaustion is failed infrastructure, never negative evidence.

  success_criterion: >-
    Produce a prefix-by-prefix comparison of full, voltage-quotient, naive
    quotient, and random-bucket graphs, with exact cycle lifting, verified full
    relations, informative rank arrival, time, and memory accounting.

  falsification_criterion:
    - >-
      Zero-voltage filtering removes the apparent quotient cycle advantage,
      leaving no edges-to-rank improvement.
    - >-
      Graph memory shrinks but relation generation dominates end-to-end cost.
    - >-
      Random size-3 bucket controls reproduce the same graph-processing savings,
      showing no GLV-specific effect beyond generic coarsening.
    - >-
      Orientation metadata and lift verification consume the saved graph cost.

  required_artifacts:
    - specification.yaml
    - manifest.yaml
    - command.txt
    - environment.json
    - raw-result.json
    - edge-stream.jsonl
    - orbit-map.json
    - quotient-edge-stream.jsonl
    - cycle-events.jsonl
    - cycle-lift-verification.jsonl
    - rank-arrival.csv
    - graph-memory.csv
    - verification-report.json

  source_refs:
    - IDEA-20260731-012
    - H-ICEX-87ad66
    - RQ-RELN-001
    - RQ-EQIC-8cb959
    - EXP-GLVFB-5f287d
    - RQ-ICPERF-94c86e
    - research/ideas/glv_index_calculus_experiment_matrix.md

  assigned_to: executor
  approved_by: null
