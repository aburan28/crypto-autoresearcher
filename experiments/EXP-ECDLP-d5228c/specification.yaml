experiment:
  id: EXP-ECDLP-d5228c
  hypothesis_id: H-ECDLP-9a7267
  question_id: RQ-CLGRP-66ab7f
  goal_id: null
  version: 1
  status: draft
  claim_tier: toy
  title: >-
    Findability-exponent census for Cl(D)[l]: a 2000-discriminant Cohen-Lenstra
    calibration at 3-sigma bands recomputed from the sample size, a blocking
    l = 2 known-answer pair in both directions, a structureless abelian twin,
    and a route race restricted to the sizes where the cubic-form enumeration
    is arithmetically reachable at all

  objective: >-
    Fill the map eps(l, r, |D|) with measured entries where measurement is
    possible and derived entries where it is not, distinguishing the two
    typographically. Measure the empirical frequency of l dividing h(D) against
    Cohen-Lenstra, the l-rank distribution, the cost of certifying ABSENCE of
    l-torsion for l = 2 against odd l, and the pointwise cost of the reduced
    binary cubic form route. NO BREAK OF ANY DEPLOYED CONSTRUCTION IS SOUGHT,
    CLAIMED OR REACHABLE, AND EVERY STATEMENT IS ABOUT THE GROUP Cl(D).

  independent_variables:
    - name: l
      values: [2, 3, 5, 7]
    - name: discriminant_family
      values: [prime_D_minus_p_3_mod_4, composite_fundamental_t_at_least_2,
        structureless_abelian_twin]
    - name: route_race_size_bits
      values: [32, 40, 48, 56]
    - name: route
      values: [R1_index_calculus_then_exponentiate,
        R2_generic_structure_then_exponentiate,
        R3_pointwise_reduced_binary_cubic_forms]

  inputs:
    census_sample_size: 2000
    census_size_range_bits: [60, 80]
    cohen_lenstra_predictions: {l_3: 0.439874, l_5: 0.239600, l_7: 0.163180}
    binomial_standard_errors_at_n_2000: {l_3: 0.01110, l_5: 0.00954, l_7: 0.00826}
    three_sigma_bands_at_n_2000: {l_3: 0.0333, l_5: 0.0286, l_7: 0.0248}
    derived_rank_thresholds:
      l_3_at_1024_bits_vs_generic: 161.5
      l_3_at_2048_bits_vs_generic: 323.0
      l_5_at_1024_bits_vs_generic: 110.2
      l_3_at_1024_bits_vs_index_calculus: 257.1
    index_calculus_cost_at_1024_bits_log2: 104.5
    index_calculus_exponent_in_log2_D: 0.1021

  metrics:
    primary:
      - name: empirical_frequency_l_divides_h
        unit: fraction of sampled discriminants (dimensionless)
        definition: >-
          Count of sampled D with l dividing h(D), divided by the sample size,
          reported with an exact binomial interval per l.
      - name: l_rank_distribution
        unit: counts per rank value (dimensionless integers)
        definition: >-
          The full histogram of the l-rank over the census, per l, with the
          maximum observed reported separately.
      - name: route_wall_clock_and_operation_count
        unit: seconds, and group operations or candidate triples as applicable
        definition: >-
          Per route, per discriminant, per size. Operation counts are required
          alongside wall clock so an implementation asymmetry cannot be read as
          an exponent.
      - name: absence_certification_cost
        unit: seconds and operation count, with the certificate kind recorded
        definition: >-
          The cost of certifying that Cl(D)[l] is trivial, with the KIND of
          certificate recorded as one of genus_theory_certificate,
          whole_group_computation, or budget_exhaustion. Budget exhaustion is
          an infrastructure outcome and is never reported as a cost of
          certification.
    secondary:
      - name: fitted_exponent_per_route
        unit: exponent in log|D| (dimensionless)
        definition: >-
          Weighted least squares of log cost against log|D| over the FEASIBLE
          ladder only, with an interval and a residual-curvature test.
      - name: recomputed_threshold_table
        unit: rank (dimensionless)
        definition: >-
          The rank thresholds re-derived symbolically, reported alongside the
          value the source proposal's stated denominator 512 would give, so the
          unit correction is visible in the artifact.

  controls:
    - name: C-NULL1-KNOWN-ANSWER-POSITIVE
      kind: known-answer positive null
      blocking: true
      description: >-
        Composite fundamental discriminants with t at least 2, where an element
        of order 2 must be produced in polynomial time from the public
        factorisation. The pipeline MUST succeed essentially instantly. Failure
        voids everything.
    - name: C-NULL2-KNOWN-ANSWER-NEGATIVE
      kind: known-answer negative null, machine-checkable distinction
      blocking: true
      description: >-
        D = -p with p congruent to 3 mod 4, where Cl(D)[2] is provably trivial.
        The pipeline MUST certify ABSENCE in polynomial time via genus theory
        and must EMIT THE CERTIFICATE KIND as a machine-readable field. A
        pipeline that reports "not found within budget" here is reporting an
        infrastructure outcome as a mathematical one, which AGENTS.md rule 5
        forbids, and the run is void.
    - name: C-NULL3-STRUCTURELESS-TWIN
      kind: structure-free null, REQUIRED, consequence pre-stated
      blocking: true
      description: >-
        For each Cl(D) whose structure is computed, build a black-box abelian
        group with the SAME invariant factors and no arithmetic, and run the
        random-search route on it. PRE-STATED CONSEQUENCE: the costs must be
        identical, because random search uses nothing but the group law. If
        they differ, the search is exploiting class-group arithmetic, the
        h/l^r exponent is not what is being measured, and no findability
        exponent may be reported. This is the structure-free null that the
        standing scope constraint requires for a non-curve object.
    - name: C-NULL4-RANK-CALIBRATION
      kind: distribution calibration
      blocking: true
      description: >-
        The census frequencies against the recomputed Cohen-Lenstra values at
        the 3-sigma bands 0.0333, 0.0286 and 0.0248. A deviation is a finding
        about the deployed discriminant family, not about the heuristic, and is
        reported as such.
    - name: C-TARGET-EXISTENCE
      kind: blocking precondition on the route race
      blocking: true
      description: >-
        The route race runs ONLY on discriminants where the census has already
        PROVED an element of order 3 exists. Racing routes on a group with no
        target measures nothing, and a "not found" there is an infrastructure
        outcome under AGENTS.md rule 5.
    - name: C-AMORTIZED-VERSUS-POINTWISE
      kind: unit-parity gate
      blocking: true
      description: >-
        Route R3 is timed BOTH pointwise for a single target D and amortized
        over an enumerated range, and the two are reported separately and NEVER
        pooled. They are different quantities in different units and conflating
        them would invert this experiment's conclusion.
    - name: C-PLANTED-RANK-LADDER
      kind: positive control with predicted magnitude
      blocking: true
      description: >-
        Plant a defect of known size. Construct discriminants with KNOWN 3-rank
        r for r in {1, 2, 3} by a declared construction, and require the
        random-search route's measured trials-to-success to fall by the
        predicted factor 3^r within its geometric interval, namely by 3, 9 and
        27. A route whose cost does not fall by the predicted factor when the
        rank is raised is not measuring findability, and the run stops.
    - name: C-CONSTRUCTED-RANK-RECORD
      kind: literature verification obligation
      blocking: false
      description: >-
        The recalled record that the largest constructed imaginary quadratic
        3-ranks are single-digit is verified or corrected against a primary
        source, and the verifying agent is named. The margin statement depends
        on it and may not be quoted until it is discharged.

  heuristic_under_test: HEUR-001

  preregistered_prediction:
    quantity: >-
      The empirical frequency of l dividing h(D) over the census, and the
      fitted exponent of the pointwise cubic-form route over the feasible
      ladder.
    formula: >-
      Frequencies 0.439874, 0.239600 and 0.163180 for l equal to 3, 5 and 7,
      each within 3 sigma at n = 2000, namely 0.0333, 0.0286 and 0.0248.
      Pointwise R3 exponent 0.75 plus or minus 0.10.
    source: >-
      The Cohen-Lenstra product formula, with the three values recomputed from
      it; and the Julia-Hermite coefficient bound of order |D|^(1/4) on reduced
      binary cubic forms, giving about |D|^(3/4) candidate triples.

  band_non_degeneracy_analysis: >-
    COMPUTED BEFORE THE BANDS WERE FIXED.
    (1) A BAND IN THE SOURCE CONTRADICTED ITS OWN DECISION RULE AND HAS BEEN
    REPLACED BY THE COMPUTED VALUE, NOT LOOSENED. The source proposal states a
    band of plus or minus 0.025 for l = 3 at n = 2000 and separately a
    falsification rule at 3 sigma. At n = 2000 and p = 0.4399 the binomial
    standard error is sqrt(0.4399 times 0.5601 / 2000) = 0.01110, so 3 sigma is
    0.0333 and the stated 0.025 is 2.25 sigma, a two-sided false-alarm rate of
    2.4 percent per l and about 7 percent across three l. The band is set to
    the computed 3-sigma values.
    (2) THE MINIMUM DETECTABLE EFFECT IS STATED RATHER THAN IMPLIED. At n =
    2000 the census can detect a shift of 0.0333 in P(3 divides h), which is a
    7.6 percent relative departure from 0.4399. A 2 percent relative departure
    (0.0088 absolute) would need n at least 9 times 0.2464 / 0.0088^2 = 28,600
    discriminants. THE CELL IS THEREFORE DECLARED UNDERPOWERED FOR RELATIVE
    SHIFTS BELOW ABOUT 8 PERCENT, with the required sample size 28,600 stated,
    rather than the claim being quietly shrunk to what 2000 can see.
    (3) ONE GRID CELL OF THE SOURCE IS ARITHMETICALLY IMPOSSIBLE AND IS
    REMOVED, WITH THE COST STATED. Route R3 costs about |D|^(3/4) candidate
    triples. The source races routes at four sizes spanning 2^48 to 2^96. At
    |D| = 2^96 that is 2^72 candidate triples, about 4.7 times 10^21, i.e.
    about 150,000 years at 10^9 triples per second; at 2^64 it is 2^48, about
    2.8 times 10^14, i.e. about 78 hours. THE UPPER CELLS CANNOT BE RUN AT ALL.
    The ladder is therefore set to 32, 40, 48 and 56 bits, costing about 2^24,
    2^30, 2^36 and 2^42 triples, i.e. up to about 4.4 times 10^12 or roughly
    73 minutes at 10^9 per second, which fits the per-run budget. Sizes at 64
    bits and above are DECLARED UNREACHABLE with their costs, not attempted and
    silently skipped.
    (4) THE ROUTE-RACE EXPONENT BAND CAN MOVE AND ITS LIMIT IS SYSTEMATIC, NOT
    STATISTICAL. Over four rungs spanning 24 bits of |D| the statistical
    standard error on a fitted exponent at 10 percent cost scatter is under
    0.03, far inside the plus or minus 0.10 band, so the band is limited by
    model adequacy rather than by noise. Residual curvature and
    leave-one-rung-out prediction are therefore required alongside the fit, and
    a failed adequacy test is reported as such rather than absorbed into a
    wider interval.
    (5) A DEFECT OF KNOWN SIZE MUST FIRE AT THE PREDICTED MAGNITUDE. The
    planted-rank ladder requires the random-search cost to fall by exactly 3, 9
    and 27 at planted 3-ranks 1, 2 and 3. These are large, unambiguous factors
    and a route that does not show them is not measuring findability.

  scale_relevance:
    tier: toy
    justification: >-
      Census at 2^60 to 2^80 where full class group computation is feasible;
      route race at 2^32 to 2^56 where the cubic-form enumeration is reachable.
      Transfer assumption, STATED AND RECORDED AS UNJUSTIFIED: that rank
      statistics at these sizes describe 1024-bit and larger discriminants. The
      derived thresholds at 1024, 2048 and 3072 bits are DERIVATIONS from the
      cost model, are marked as such in every artifact, and are not security
      estimates.
    correspondence: >-
      The rank census exploits the fact that rank statistics need many small
      computations rather than few large ones, which is what makes a 2000-sample
      calibration possible at a size the cost-curve programme can never reach.
      That is a sampling correspondence and it is stated because it is doing
      real work.

  tail_checks:
    - >-
      The maximum observed l-rank per l against its predicted probability,
      reported individually and not absorbed into the histogram summary.
    - >-
      The longest single random search observed per discriminant against the
      geometric tail predicted by HEUR-002.
    - >-
      The largest relative deviation of a computed h(D) from the ERH-interval
      analytic estimate, as the testable proxy for HEUR-004.
    - >-
      The least-visited coset in the walk-endpoint distribution, as the tail
      check for HEUR-003.

  replication:
    seeds: [20260904, 20260905, 20260906, 20260907, 20260908]
    independent_instances: 2000

  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 24
    maximum_memory_gb: 8
    maximum_runs: 40
    maximum_workers: 1

  stopping_rules:
    - >-
      If C-NULL1 or C-NULL2 fails, stop before any odd-l measurement is taken.
    - >-
      If C-PLANTED-RANK-LADDER does not recover the factors 3, 9 and 27, stop;
      the route is not measuring findability.
    - >-
      If a route-race cell exceeds its per-run budget, stop that cell and
      record budget_exhausted. That is an infrastructure outcome under
      AGENTS.md rule 5 and is never evidence that the route is slow.
    - >-
      The route race runs only on target-existence-verified discriminants; a
      cell without a verified target is not started.

  invalidation_rules:
    - Any absence certification reported without its certificate kind.
    - Any absence reported by budget exhaustion and counted as a cost.
    - Any pooling of amortized and pointwise R3 timings.
    - Any route comparison reported on wall clock alone without operation counts.
    - Any attempt to fit the R3 exponent using a cell that did not complete.
    - Any derived threshold reported without its typographic mark distinguishing
      it from a measured entry.

  success_criterion: >-
    All four nulls and the planted-rank ladder pass; the census reports
    empirical frequencies with exact binomial intervals and a full rank
    histogram at n at least 2000; the absence-certification costs are reported
    with certificate kinds for l = 2 and odd l; the route race reports wall
    clock and operation counts per route per feasible size with amortized and
    pointwise R3 separated; and the eps(l, r, |D|) map is emitted with derived
    and measured entries distinguished typographically.

  falsification_criterion: >-
    HEUR-001 is falsified if any empirical frequency deviates from its
    predicted value by more than the computed 3-sigma band, or if an l-rank
    above 3 appears in the uniform sample. HEUR-002 is falsified if the
    structureless twin's random-search cost differs from the real group's
    beyond sampling error. The experiment is VOID if the l = 2 nearby-object
    control reports l = 2 as hard, or if absence at l = 2 is certified by
    budget exhaustion. An R3 exponent below 0.30 over the feasible ladder is a
    SCOPED METHODOLOGICAL FINDING about Cl(D) only, is escalated to adversarial
    review before any wider phrasing, and is explicitly not a break.

  required_artifacts:
    - the census: 2000 discriminants with h, l-rank per l, and invariant factors
    - empirical frequencies with exact binomial intervals and the rank histogram
    - the recomputed threshold table, including the value the denominator 512
      would give, so the unit correction is visible
    - the l = 2 positive and negative null outputs with certificate kinds
    - the structureless-twin comparison with its cost distributions
    - the planted-rank ladder results at planted 3-ranks 1, 2 and 3
    - route race wall clock and operation counts per route per feasible size
    - the amortized and pointwise R3 timings, separately
    - the eps(l, r, |D|) map with derived and measured entries marked
    - the primary-source verification or correction of the constructed-rank
      record, naming the verifying agent
    - run manifest per AGENTS.md artifact policy

  limitations:
    - >-
      NOT AN ECDLP EXPERIMENT AND NOT A CURVE EXPERIMENT. Every object is a
      class group of an imaginary quadratic order. The curve-free-null
      requirement is discharged by construction; the structure-free null the
      design does require, and runs blocking, is the black-box abelian twin.
    - >-
      UNTESTABLE AT DEPLOYED SCALE, STATED PLAINLY. No computation at a
      deployed discriminant size is attempted and none is reachable: full class
      group computation at 1024 bits is out of range, and the cubic-form route
      at 2^1024 would need about 2^768 candidate triples. The 1024-, 2048- and
      3072-bit thresholds are DERIVATIONS from a cost model and are not
      security estimates.
    - >-
      UNDERPOWERED CELL, DECLARED WITH ITS REQUIRED SAMPLE SIZE. At n = 2000
      the census cannot see a departure from Cohen-Lenstra smaller than about
      8 percent relative; resolving 2 percent would require about 28,600
      discriminants. The claim is not shrunk to fit the sample.
    - >-
      UNREACHABLE CELLS, DECLARED WITH THEIR COSTS. The route race is capped at
      56 bits because R3 costs about |D|^(3/4): 2^64 needs about 2.8 times
      10^14 triples and 2^96 about 4.7 times 10^21. Those sizes are not
      attempted and their absence is not a null result.
    - >-
      Every statement is about Cl(D) and none is about any system using it,
      per RQ-CLGRP-66ab7f's claim_tier_ceiling. No statement that a deployed
      parameter is adequate or inadequate may be derived from this experiment.
    - >-
      The Ellenberg-Venkatesh entry is carried as `recalled` with verified_by
      null, resolving the source proposal's own referred question: its
      verified_by text states it was not primary-read, so it does not meet the
      `retrieved` bar and may not discharge any heuristic here.
    - >-
      Cohen-Lenstra is a heuristic and the deployed family is a sub-family it is
      applied to by convention. The calibration null measures the convention
      rather than assuming it, and a deviation is a finding about the family.

  assigned_to: executor
  approved_by: null
