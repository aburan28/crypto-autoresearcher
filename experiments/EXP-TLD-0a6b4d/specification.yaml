experiment:
  id: EXP-TLD-0a6b4d
  hypothesis_id: H-TLD-f4c8ba
  version: 1
  title: >-
    Typed automatic lens discovery for the ECDLP: a frozen grammar, exhaustive
    trichotomy typing, and a forced-value pre-check whose refusal rate is a
    primary reported metric
  status: review_required
  objective: >-
    Freeze a grammar and depth bound; build the forced-value table with its four
    derived families and the F1-F7 rows; implement exhaustive trichotomy typing
    at toy N and reproduce F1-F7 and the x-coordinate lens exactly; generate and
    type the grammar; meter the survivors with the (L, b) meter; and report the
    achieved (type, L, b) region against the F1-F7 region, the refusal rate with
    a cited derivation per refusal, and per-cell coverage depth.
  experiment_class: tooling
  inputs:
    grammar: >-
      FROZEN BEFORE GENERATION and recorded in grammar.json. Alphabet: coordinate
      extractors (x, y, bit slices, Legendre symbol, field trace); arithmetic
      maps of bounded degree; quotients by declared subgroups or automorphisms;
      partition maps into r cells; small-degree isogeny and endomorphism
      evaluations. Composition depth bounded at D. Freezing it before generation
      is what makes the resulting count a coverage statement rather than a
      function of how long anyone kept typing.
    forced_value_table: >-
      Seeded with the four families derived at zero compute in H-TLD-f4c8ba
      (persistent homology; functorial embeddings; Kolmogorov/compression;
      approximate/interval arithmetic) plus one row per established family
      F1-F7. Every entry carries its derivation. The table is an input, not an
      output, and it is versioned with the grammar.
    N_range: toy prime-order subgroups up to roughly 2^16
    meter: >-
      The (L, b) meter of IDEA-20260802-002, consumed unchanged. This experiment
      is BLOCKED if that meter has not passed its own four calibration checks; it
      does not rebuild it.
  controls:
    - id: C1_x_coordinate_rediscovery
      description: >-
        The x-coordinate lens must be rediscovered by the generator with its
        exact calibrated triple: TYPE II, L = 1 bit, b = 2. BLOCKING: a generator
        that cannot recover a known answer is not evidence about unknown ones.
    - id: C2_family_reproduction
      description: >-
        F1-F7 must be typed mechanically at their correct types, with triples
        within the meter's declared tolerance. BLOCKING.
    - id: C3_known_powerful_seed
      description: >-
        Seed the grammar with a pairing transfer on a low-embedding-degree curve
        -- genuinely powerful, and not something the generator is supposed to
        find on its own. It must be typed correctly and placed OUTSIDE the
        generic region. BLOCKING: a generator that types a known-powerful lens as
        unremarkable cannot detect power.
    - id: C4_random_lens_null
      description: >-
        Random functions from the group to sets of each declared image size,
        typed and metered on the identical pipeline. Every reported "interesting"
        candidate must be compared against the random lens of the SAME image
        size; a candidate whose triple matches the random null is a random
        function with extra syntax.
    - id: C5_structure_destruction_null
      description: >-
        The entire pipeline run on a random cyclic group of the same order with
        an arbitrary opaque labelling and no curve structure. Any candidate
        scoring the same there was never using the curve. BLOCKING.
  independent_variables:
    - composition depth (1 to D)
    - grammar alphabet subset
    - N (several toy sizes)
    - type cell (I, II, III)
  metrics:
    primary:
      - >-
        forbidden_cell_count: candidates typed as deterministic under the FULL
        translation action and non-trivially lossy. Forced to 0 by the
        trichotomy; this is the instrument's self-check.
      - >-
        refusal_rate: fraction of generated candidates refused by the
        forced-value pre-check, each with its cited derivation. A PRIMARY metric,
        not an internal detail.
      - >-
        outside_region_count: candidates landing outside the (type, L, b) region
        occupied by F1-F7.
    secondary:
      - per-cell coverage depth across the three type cells
      - distinct triples versus candidates generated
      - achieved (type, L, b) region, plotted against the F1-F7 region
      - H for every TYPE I candidate, and b for every TYPE II candidate
      - within-triple versus across-triple spread of measured relation yield
        (the HEUR-TLD-1 test)
      - wall-clock and memory per stage
  measured_vs_modeled:
    measured:
      - types, triples, refusal counts, coverage depths, relation yields
    modeled:
      - the trichotomy's forced empty cell
      - the four derived forced values in the pre-check table
      - the survival-depth formula log(budget)/log(b) for TYPE II
    rule: measured and modeled never share a column; every refusal cites its derivation
  optimistic_assumptions:
    - >-
      The grammar is finite and shallow. BIAS: the achieved region is a function
      of the grammar, so an empty frontier may mean the grammar cannot express
      anything new. Direction: understates what exists. This is the dominant
      limitation and it is reported with every conclusion, not only here.
    - >-
      Branching is measured naively at O(N^2). BIAS: caps N at about 2^16, so
      lenses whose behaviour depends on bit-length may type differently at larger
      N. Mitigated by typing bit-length-dependent lenses at more than one N and
      flagging them.
    - >-
      The forced-value table is seeded with four families. BIAS: the refusal rate
      is a LOWER bound on what a mature table would refuse.
  optimistic_assumption_rule: >-
    Every conclusion is reported with its grammar version and depth bound in the
    same sentence, and an empty frontier is labeled a coverage statement about
    the grammar whose status as a closure is `unverified` unless a per-family
    obstruction accompanies it. The list above is reproduced in the results
    report with the direction of each bias.
  heuristic_under_test: HEUR-TLD-1
  preregistered_prediction:
    quantity: >-
      The number of generated candidates typed as deterministic under the full
      translation action while being non-trivially lossy.
    formula: >-
      Exactly 0, at any budget, because the trichotomy forces that cell empty.
    source: >-
      IDEA-20260806-c5d183's trichotomy, restated in H-TLD-f4c8ba. Frozen before
      execution. A non-zero count is not a discovery to be explained afterwards:
      it halts the run and is resolved as either a refutation of the trichotomy
      or a typing bug, before any other number is reported.
  scale_relevance:
    tier: toy
    justification: >-
      N up to 2^16 is where the full-translation determinism check and the
      branching measurement are EXHAUSTIVE, which is what makes typing exact
      rather than statistical -- and exactness is the whole reason the forced
      zero at the primary metric is a usable self-check. Nothing measured here
      transfers to cryptographic N; what would transfer is the trichotomy, which
      is a derivation and not an output of this experiment. Resulting evidence is
      capped at claim_tier toy.
    correspondence: null
  tail_checks:
    - >-
      The single candidate closest to the boundary of the F1-F7 region without
      crossing it, reported by name -- it is the most informative near-miss and
      the one worth hand analysis even in a null run.
    - >-
      The triple with the LARGEST number of syntactically distinct inhabitants,
      which measures how coarse the quotient is and bounds the "new triple = new
      family" reading.
    - >-
      The lens whose type changes between the smallest and largest tested N,
      which would show bit-length dependence and invalidate its single-N typing.
  replication:
    seeds: [31, 37, 41]
    independent_instances: 3
    note: >-
      Typing is exhaustive and deterministic, so seeds vary the curve and the
      subgroup, not the computation. Types must be IDENTICAL across seeds; a
      seed-dependent type indicates a bug. Seeds matter only for the random-lens
      null (C4), where they generate the null population.
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 150
    maximum_memory_gb: 16
    maximum_runs: 2000
  stopping_rules:
    - >-
      HALT immediately if forbidden_cell_count is non-zero. Resolve as trichotomy
      refutation or typing bug before anything else is reported.
    - >-
      HALT at C1 or C2 if the known answers are not reproduced.
    - >-
      Stop generation at the depth bound D. Do NOT extend the grammar mid-run:
      an extended grammar is a new experiment version and requires a
      protocol_amendment.
    - Stop at the CPU-hour cap; report per-cell coverage depth and name what was
      not reached.
  invalidation_rules:
    - Any BLOCKING control failing invalidates the achieved region.
    - >-
      A refusal recorded without its derivation invalidates the refusal rate,
      which is a primary metric.
    - >-
      A conclusion reported without its grammar version and depth bound is
      invalid regardless of its content.
    - >-
      Extending the grammar after seeing results, without an amendment,
      invalidates every count.
  success_criterion: >-
    C1-C5 pass; forbidden_cell_count is 0; the refusal rate is reported with a
    cited derivation per refusal; and the achieved (type, L, b) region is
    reported against the F1-F7 region with per-cell coverage depth and the
    grammar version. The experiment succeeds as an instrument whether or not any
    candidate lands outside the known region; it fails if a blocking control
    fails or if the forced zero is violated.
  falsification_criterion: >-
    H-TLD-f4c8ba is REFUTED if any candidate lands outside the F1-F7 region and
    survives hand analysis -- a candidate new attack family, escalated
    immediately and never reported from the generator alone. The trichotomy
    itself is refuted by a non-zero forbidden_cell_count that survives a typing
    audit, which is a larger result than anything else in this experiment.
    HEUR-TLD-1 is refuted independently if within-triple yield spread is
    comparable to across-triple spread, in which case the generator's output is
    downgraded to a coarse filter rather than discarded.
  required_artifacts:
    - frozen grammar.json with its version and depth bound
    - the forced-value table with a derivation per entry, versioned with the grammar
    - per-run manifest with command, commit, environment, seed, resolved model
    - full candidate log: generated, typed, refused (with derivation), metered
    - achieved (type, L, b) region and the F1-F7 region, plotted together
    - per-cell coverage depth across the three type cells
    - control outcomes C1-C5 with pass/fail
    - the within-triple versus across-triple yield comparison for HEUR-TLD-1
    - for every type cell with no inhabitant found, a named obstruction OR an
      explicit statement that none was found, labeled `unverified`
  assigned_to: executor
  approved_by: null
  approval_note: >-
    Status is review_required. 150 CPU-hours. Depends on the (L, b) meter of
    IDEA-20260802-002 existing and calibrated; if that meter has not been built,
    this experiment is blocked and should not be approved until it is.
