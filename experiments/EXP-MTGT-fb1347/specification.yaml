experiment:
  id: EXP-MTGT-fb1347
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-0e8977
  question_id: RQ-MTGT-2cabee
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE TRANSPORT NULL BATTERY: a five-arm dose-response instrument whose null for "transport
    preserved the table''s value" is a RANDOMLY RELABELLED TABLE OF IDENTICAL SIZE, whose decay parameter
    is the mixing fraction alpha of genuinely transported entries, and whose acceptance criterion
    is that retention be AFFINE IN alpha with slope 1 and intercept 1/N -- the instrument that EXP-ISADV-001
    lacked, and without which no retention number produced by this lane may be believed'
  status: draft
  objective: "(A) WHY AN INSTRUMENT PROPOSAL IS NEEDED HERE AND NOT ELSEWHERE. This lane's central\
    \ measurement is a RETENTION RATE: what fraction of a preprocessing table's value survives being\
    \ moved to another curve. Retention rates are the most artifact-prone quantity in this campaign,\
    \ for a specific reason: THE TRUE ANSWER IS AT ONE OF THE TWO ENDPOINTS. Group-valued preprocessing\
    \ retains 1.000; encoding-valued preprocessing retains the chance baseline (IDEA-20260807-e0ddc6).\
    \ An instrument that returns 1.000 because it is comparing an object with itself, or returns the\
    \ chance baseline because it silently failed to apply any map, produces EXACTLY THE EXPECTED NUMBER\
    \ while measuring nothing. That is not hypothetical: experiments/EXP-ISADV-001/ advice_transfer.py,\
    \ read in full for this batch, applies no isogeny anywhere in its computation and returned the\
    \ chance baseline, and its result was recorded as \"A2 weakened, scoped negative on transfer\"\
    \ (research_directions_20260718.md section 9.1; outputs/prior_proposals_digest.md). The number\
    \ was right and the reading was an over-read, and no control in that script could have caught\
    \ it -- its controls were a positive control on the SAME curve and a uniform-random negative,\
    \ neither of which tests whether a map was applied.\n(B) THE INSTRUMENT. Five arms, run on identical\
    \ instances, identical table size S, identical value predicate v, identical certification code\
    \ path:\n  ARM T (treatment): A' = {(phi(R_i), r_i)} for a CERTIFIED F_p-isogeny phi\n    with\
    \ gcd(deg phi, N) = 1.\n  ARM N1 (the mandated null): A' = {(sigma(R_i), r_i)} for sigma a uniformly\n\
    \    random bijection G -> G'. SAME SIZE, SAME SCALARS, NO MAP.\n  ARM N2 (scalar shuffle): A'\
    \ = {(phi(R_i), r_{pi(i)})} for pi a uniform\n    permutation. SAME POINTS AS ARM T, scrambled\
    \ logs.\n  ARM N3 (no-map, EXP-ISADV-001 reconstruction): A' built from an\n    independently\
    \ chosen generator on E' with no correspondence to P. This\n    arm EXISTS SO THAT THE PRIOR RESULT\
    \ CAN BE REPRODUCED INSIDE THE NEW\n    INSTRUMENT and shown to be a different arm from ARM T.\n\
    \  ARM P (planted positive): A' = A on the SAME curve (phi = identity).\n    Retention must be\
    \ 1.000 by construction; an instrument that fails here\n    is broken before any curve is changed.\n\
    ACCEPTANCE, PRE-REGISTERED: ARM P = 1.000; ARM T = 1.000; ARM N1 = ARM N2 = ARM N3 = 1/N, all\
    \ three statistically indistinguishable from each other. If ARM T does not separate from ARM N1\
    \ by more than 0.999 in retention, the instrument has not demonstrated that it can see transport\
    \ at all, and every downstream number in lane L13 is void.\n(C) THE DECAY TEST, WHICH IS THE PART\
    \ THAT MAKES IT A CONTROL AND NOT A CHECKLIST. Define ARM T(alpha): a table in which a uniformly\
    \ random alpha fraction of entries are transported by the true phi and the remaining 1 - alpha\
    \ are relabelled by a uniform sigma. Then, exactly,\n  E[retention(alpha)] = alpha * 1 + (1 -\
    \ alpha) * (1/N),\nan AFFINE function of alpha with slope 1 - 1/N and intercept 1/N. This is not\
    \ a heuristic prediction; it is arithmetic, and it gives the instrument a KNOWN-ANSWER CALIBRATION\
    \ CURVE rather than two endpoints. Sweep alpha in {0, 0.125, 0.25, 0.5, 0.75, 1}. Fit. Required:\
    \ slope in [0.95, 1.05], intercept below 2/N, R^2 >= 0.99. A retention that does not fall as alpha\
    \ falls is the canonical artifact tell (docs/inventor-protocol.md, controls before belief), and\
    \ here it has an exactly known target rather than a qualitative direction.\n(D) THE SECOND DECAY\
    \ AXIS, FOR THE CLASS II CLAIM. For encoding-valued predicates the claim is DESTRUCTION, and destruction\
    \ needs its own dose-response or it cannot be distinguished from \"the instrument never applied\
    \ a map\". Decay parameter: ell, the isogeny degree, swept over {1, 2, 3, 5, 7, 11} plus composite\
    \ paths of length L in {1, 2, 3}. At ell = 1 the map is an F_p-isomorphism x -> u^2 x and a DILATION-INVARIANT\
    \ predicate must retain EXACTLY, giving a rigorous positive control; at ell >= 2 retention must\
    \ fall to the chance baseline and STAY there. A Class II statistic that is at chance already at\
    \ ell = 1 proves the map was never applied -- which is precisely EXP-ISADV-001's failure mode,\
    \ now detectable.\n(E) THE CERTIFICATE LAYER. Every retention count is a count of entries passing\
    \ an INDEPENDENT check, not a count of entries the transport code believed it produced. The check\
    \ for a known-log entry is [r_i] phi(P) == phi(R_i), recomputed by a scalar multiplication that\
    \ does not call the transport routine. The check for the isogeny itself is: phi(P) != O, [N]phi(P)\
    \ == O, phi(Q) == [k]phi(P) for the known toy k, and deg phi as declared. Per docs/claims-and-verification.md\
    \ the wrapper re-verifies these independently of the solver. An arm whose isogeny certificate\
    \ fails is INVALID (AGENTS.md rule 5), never a negative."
  resource_label: 'audit: consumes no resource. The instrument exists to make the R8/R4 claims of
    IDEA-20260807-a127ab and IDEA-20260807-e0ddc6 citable; it asserts no mechanism of its own.'
  admissibility: admissible
  admissibility_argument: 'A control lane consumes no resource and therefore cannot fail the admissibility
    filter of DECOMPOSITION.md section 2 -- the filter closes lanes that claim an advantage from a
    GGM-simulable resource, and this lane claims no advantage. It is admissible in the same sense
    as L14 (RQ-INSTR-f8faa0): it is what makes the other lanes'' negatives mean anything. Recorded
    explicitly rather than left implicit, because a control that quietly reintroduces the treatment''s
    assumption is the most common way a null battery fails, and the arms above are constructed so
    that no arm depends on the transport routine being correct.'
  reachability_gate: 'MINIMAL. The battery needs one isogeny of small degree out of one curve, plus
    one F_p-isomorphism for the ell = 1 arm. No SPECIFIED classmate must be reached, so the vectorization
    hardness in T5 does not bind. Cost: one kernel-subgroup search plus one Velu construction per
    degree, O(ell^3) field operations in the conservative ordinary-curve model (research/JMV004_branch_a_scouting_20260726.md,
    labelled SCOUTING there and used here only as a conservative bound). At toy scale the class is
    fully enumerable so paths can be found by breadth-first search, and the gate is satisfied by construction.'
  inputs:
    procedure: 'STAGE 0 (minutes): ARM P on one toy curve at p ~ 1009 with S = 64. Must return 1.000.
      STAGE 1 (minutes, THE CHEAPEST VALID CHECK IN THE LANE): ARM N1 and ARM T on one ell = 2 isogeny,
      S = 64, 3 seeds. Two numbers. If the gap is not >= 0.999 the whole lane stops here at a cost
      of seconds. STAGE 2 (minutes): the alpha sweep and the affine fit. STAGE 3 (minutes): ARM N2,
      ARM N3, and the ell = 1 dilation control. STAGE 4 (minutes): Step 7 broken-map detection. STAGE
      5 (low hours): repeat the whole battery at p in {2^{12}, 2^{16}, 2^{20}} and 5 seeds, and archive
      it as the reusable fixture that every later L13 run must pass before its numbers are admitted.'
    mechanism: 'STEP 1 -- FREEZE THE VALUE PREDICATE AND THE CERTIFICATE. Before any run, write down
      v (known-log pairing; DP predicate; box membership) and the independent check for each. Freeze
      the encoding of a table entry. STEP 2 -- BUILD THE POSITIVE CONTROL FIRST. ARM P with phi =
      identity. Retention must be exactly 1.000 and the certificate path must be exercised. If not,
      stop. STEP 3 -- BUILD THE NULL FIRST, TREATMENT SECOND. Run ARM N1, N2, N3 before ARM T is implemented,
      and record their retentions. This ordering is deliberate: it prevents the treatment''s implementation
      from being tuned until it "beats" the null. STEP 4 -- CERTIFY THE ISOGENY. Only then construct
      phi and run its certificate (phi(P) order N, phi(Q) == [k]phi(P), declared degree). Record the
      certificate as an artifact. STEP 5 -- ARM T AND THE alpha SWEEP. Run ARM T(alpha) at the six
      declared alpha values, five seeds each. Fit retention against alpha; check slope, intercept,
      R^2 against the pre-registered thresholds. STEP 6 -- THE ell SWEEP for Class II predicates,
      with the ell = 1 dilation-invariance positive control. STEP 7 -- PLANTED-SIGNAL DETECTION IN
      THE ADVERSARIAL DIRECTION. Deliberately break the transport (e.g. use phi''s x-map but the wrong
      y, or use a map of degree sharing a factor with N) and confirm the instrument reports failure
      rather than silently producing high retention. An instrument that cannot detect a broken map
      is not a control. STEP 8 -- ADOPT H-MTIC-001''s NON-INTERFERENCE RECEIPT: content-hash the table
      before any target is disclosed, under permuted target order, and under a withheld target, and
      require equality.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - ARM P identity-map positive control
  - ARM N1 random relabelling, size-matched (THE mandated null)
  - ARM N2 scalar shuffle
  - ARM N3 no-map reconstruction of EXP-ISADV-001
  - ell = 1 dilation-invariance positive control
  - deliberately broken map (adversarial detection control)
  - H-MTIC-001 content-hash non-interference receipt
  - 'NULL OBJECT (from the proposal): THIS RECORD IS THE NULL OBJECT CONTROL. Restated so it is not
    lost in the body: the null for "transport preserved the table''s value" is A RANDOMLY RELABELLED
    TABLE OF IDENTICAL SIZE -- same S, same scalars, same value predicate, same certification code,
    uniform random bijection sigma: G -> G'' in place of phi|_G (ARM N1). The decay parameter is alpha,
    the mixing fraction of genuinely transported entries; retention must be affine in alpha with slope
    1 - 1/N and intercept 1/N, fitted with R^2 >= 0.99. A retention that fails to fall as alpha falls
    voids the run set. The battery''s own null is ARM P (identity map), which must return exactly
    1.000, and its own adversarial control is Step 7''s deliberately broken map, which must be detected.'
  independent_variables: []
  metrics:
    primary:
    - exact certificate pass COUNTS per arm per seed, not rates
    - fitted slope, intercept and R^2 of retention against alpha
    - isogeny certificate outcome per constructed phi
    - retention against ell and against path length L
    secondary:
    - broken-map detection outcome per injected fault
    - wall clock and peak memory per arm
  heuristic_under_test: null
  preregistered_prediction:
    quantity: ARM P retention (identity map)
    formula: EXACTLY 1.000. Anything else halts the line before ARM T runs.
    source: pre-registered in IDEA-20260807-0e8977 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - SELF-COMPARISON. The single most dangerous failure is a transport routine that returns its input,
    making ARM T identical to ARM P. Detected by requiring phi(P) != P and by checking that the j-invariant
    of E' differs from that of E.
  - CERTIFICATE PATH REUSE. If the check calls the same code that produced the transported point,
    retention is 1.000 by construction. Enforced by code review; the check must recompute [r]phi(P)
    from phi(P) alone.
  - SMALL N INFLATING THE NULL. At p ~ 101 the chance baseline 1/N ~ 0.01 is not negligible against
    S = 64. Minimum p for any reported figure is set so that S/N < 0.01.
  - SEED CORRELATION. Using the instance seed to draw both phi and sigma correlates treatment and
    null. Separate seed streams are mandatory and recorded.
  - ISOMORPHIC CLASSMATES. A toy class may contain curves that are F_p-ISOMORPHIC rather than genuinely
    isogenous, which silently makes ARM T an ell = 1 arm. j-invariants must be recorded per member
    and distinct.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACTLY 1.000. Anything else halts the line before ARM T runs.
  falsification_criterion:
  - ARM P returns anything other than 1.000. Instrument broken; nothing downstream is admitted.
  - ARM N1 passes above the Binomial(S*seeds, 1/N) 99% level. The certificate path is leaking; the
    battery is INVALID, not negative.
  - The ARM T minus ARM N1 gap is below 0.999. The instrument cannot see transport. This is the outcome
    that closes the lane on instrument grounds rather than on mathematics, and it must be reported
    as such.
  - The alpha fit misses the pre-registered band. Retention is not the mixture statistic it is claimed
    to be.
  - Any deliberately broken map goes undetected by the isogeny certificate.
  - Runs exceed budget before the battery completes. INFRASTRUCTURE outcome (AGENTS.md rule 5), recorded
    as such, not as a negative on transport.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-0e8977
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
