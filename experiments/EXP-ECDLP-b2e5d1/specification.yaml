experiment:
  id: EXP-ECDLP-b2e5d1
  hypothesis_id: H-ECDLP-9f3c7a
  derived_from_idea: IDEA-20260904-742c48
  question_id: RQ-ECDLP-165d4b
  goal_id: GOAL-ECDLP-001
  version: 1
  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approval_decision_id: DEC-20260908-e19a04

  title: >-
    Corrected endomorphism-evaluation cost for the orbit-canonicalisation rho
    lane: a microbenchmark plus a planted-cost dial at 16-28 bits, a
    smoothness census over split-factoring endomorphism norms, and a
    heuristic-validation norm-form smoothness sampling at 256- and 384-bit
    discriminants with no curve construction

  objective: >-
    Reduce the uncertainty of whether the endomorphism-orbit rho lane's
    ceiling, corrected for smooth split-factoring endomorphism evaluation
    cost, is still bounded by a small constant (Reading 1, strengthening the
    standing closure IDEA-20260901-6b63a4/C1) or whether a genuine
    constant-factor discount beyond sqrt(|Aut|) exists on some measurable
    cell (Reading 2). A run establishes: (i) gamma_min and gamma_aut per
    census curve at 16-28 bits, in charged group-addition units, with
    bootstrap CIs; (ii) whether a planted synthetic cost dial tracks the
    closed-form ceiling formula G_max = 1/(2*sqrt(gamma)); (iii) the joint
    smoothness/split-factorisation distribution of endomorphism norms at toy
    scale; and (iv) whether the norm-form smoothness heuristic HEUR-9f3c7a-01
    holds at 256- and 384-bit discriminants against a matched random-integer
    null, with an explicit tail check. NO ATTACK, NO EXPONENT CLAIM, AND NO
    DLP INSTANCE IS SOLVED BY THIS CONTRACT.

  what_this_is_not:
    - >-
      Not an attack, not an exponent claim. The best possible outcome under
      either reading is a constant-factor ceiling G_max on rho, never a
      change to the generic 1/2 exponent.
    - >-
      Not evidence about P-256, P-224, secp256k1 or any deployed curve; every
      measurement at 16-28 bits is toy scale and the 256/384-bit arm samples
      the norm form only, constructing no curve of that size.
    - >-
      Not a claim about the OPTIMALITY of Velu composition as an evaluation
      strategy; the corrected cost is a stated lower bound.
    - >-
      Not approval, execution authorization, or a run. No run has been
      executed under this contract; this specification records the frozen,
      approved protocol only.

  claim_ceiling:
    tier: toy for the microbenchmark, dial and smoothness census (16-28 bits); heuristic-validation for the 256/384-bit norm-form arm
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: for the tested census curves at 16-28 bits, a
      stated gamma_min and gamma_aut with CIs, a stated pass/fail of the
      planted-dial calibration, a stated smooth-split fraction per B, and a
      stated N_0; and, for the sampled 256/384-bit discriminants, a stated
      Kolmogorov-Smirnov distance from the Dickman-corrected prediction with a
      stated tail check. WHAT DOES NOT FOLLOW: anything about rho step counts
      on a real DLP instance beyond the charged microbenchmark itself; any
      statement about cryptographic-scale curves (only the norm form is
      sampled there, not a curve); any claim about the exponent of the ECDLP;
      any claim that Velu composition is cost-optimal.

  inputs:
    procedure: >-
      STAGE 0 (zero compute, blocking, reviewable before any run). Write out
      the derivations of the corrected cost, the ceiling formula G(h,gamma),
      and the break-even inequality by hand; verify symbolically that the
      unit case reproduces G(6,0.1)=1.53 and G(2,0.1)=1.29 (net of
      canonicalisation, matching KN-TECH-018's sqrt(|Aut|) family). Fix and
      freeze: the census prime list at 16, 20, 24 and 28 bits (the complete
      declared RQ-ECDLP-165d4b census set at those sizes, not a post hoc
      selection); the frozen cost-model hash (which operations are charged,
      at what unit cost); the B grid {100, 1000, 10000}; the dial settings
      {0.05, 0.10, 0.20, 0.50, 1.00}; the 256- and 384-bit discriminants
      (Delta = t^2 - 4p for one declared prime p at each size and one
      admissible trace t); the sample sizes (10^5 at 256 bits, 10^4 at 384
      bits); and the Kolmogorov-Smirnov threshold (95th percentile of the KS
      null at the declared sample size). All fixed and hashed before any
      enumeration or sampling.
      STAGE 1 (low compute, THE MICROBENCHMARK, decisive). On the frozen
      census curves at 16, 20, 24 and 28 bits, measure in the frozen cost
      model: c_step (one charged r-adding walk step); c_aut (applying the
      F_p-rational automorphism at j=0 and j=1728); c_velu(ell) for
      ell in {2,3,5,7,11,13}; and, for each curve, the cheapest applicable
      non-unit endomorphism found by Stage 2's norm-form search, together with
      its measured end-to-end application cost. gamma is measured as the
      DIFFERENCE of two end-to-end charged walk costs (quotient arm minus base
      arm) at matched seeds, divided by h -- never as an isolated map timing.
      Emit gamma_aut and gamma_min with bootstrap CIs per curve per bit size.
      STAGE 2 (low compute, THE SMOOTHNESS CENSUS). For each census curve,
      compute Delta_O and enumerate alpha = x + y*omega with N(alpha) <= X for
      the declared X; factor N(alpha) (trivial at toy scale); record
      P^+(N(alpha)), Omega(N(alpha)); check the split condition at every prime
      factor via the Kronecker symbol (Delta_O/ell) = +1, independently of the
      volcano-level data; and record h = ord_N(lambda_alpha). Emit the
      empirical joint distribution of (N(alpha), P^+, Omega, split-fraction,
      h) and, per alpha, the modelled gamma and G(h,gamma).
      STAGE 3 (low compute, THE PLANTED-DIAL CALIBRATION, blocking positive
      control). Inject a synthetic, fully charged "endomorphism" whose
      application cost is set by hand to gamma in {0.05, 0.10, 0.20, 0.50,
      1.00}, with a synthetic orbit of order h = 1/gamma and 200 replicates
      per setting; verify the measured net gain tracks G_max = 1/(2*sqrt
      (gamma)) within 15 percent, and that gamma=1.00 shows a net LOSS.
      STAGE 4 (low-medium compute, THE CRYPTOGRAPHIC-SCALE HEURISTIC
      VALIDATION, run the matched null FIRST). Draw 10^5 (resp. 10^4)
      uniformly random integers matched in size and congruence class mod 4 to
      the 256-bit (resp. 384-bit) norm-ball values, and compute the same
      B-smoothness statistics with the identical pipeline (NULL-1). Only after
      the null is recorded, sample 10^5 (resp. 10^4) pairs (x,y) uniformly in
      the norm ball N(alpha) <= X at the declared 256-bit and 384-bit
      discriminants; test B-smoothness by trial division to 10^6 then ECM to
      10^12; record P^+ exactly where fully resolved and as a lower bound
      otherwise, with the resolved fraction reported. Compare the empirical
      CDF of log(P^+(N(alpha)))/log(X) against the Dickman-de Bruijn rho(u)
      prediction with the genus-theory one-half split correction per prime
      factor, by Kolmogorov-Smirnov. Tail checks: the smoothest sample of the
      10^5 (resp. 10^4) against its predicted rate, and the largest observed
      P^+ against the predicted maximum of that many draws.
      STAGE 5 (low compute, THE ONE-STEP COST-ADDITIVITY CONTROL, tests
      HEUR-9f3c7a-02). On 200 declared paths per bit size with Omega between 1
      and 12 and ell in {2,3,5,7,11,13}, each evaluated end to end on 50
      points, compare the measured total cost against the sum of
      independently measured per-step c_velu(ell), reported as a ratio with
      bootstrap CI; report whether the ratio grows with Omega.
      STAGE 6 (nearby-object control, blocking). Repeat Stage 1's gamma
      measurement on a supersingular curve over F_{p^2} at a matched bit size,
      and verify gamma_min drops relative to the ordinary-curve measurement at
      the same bit size, while the ordinary-curve gamma_min stays above 1/4.
      STAGE 7 (zero compute, THE VERDICT). Assemble gamma_min, gamma_aut, the
      dial-calibration pass/fail, the smooth-split fraction table, N_0 (the
      threshold solving c_step*log(B)=c_0*B*log(N) at B=2 and the measured
      constants), the KS statistics and tail checks for both discriminant
      sizes, and the Reading 1/Reading 2 classification. Emit gamma_min as an
      obstruction record with units, error bars, the runs it is read from and
      the scope, per docs/inventor-protocol.md section 4's resource_check.
    instrument: >-
      harness/isogeny_class.py (velu_odd, velu_image, find_kernel_generator,
      rational_isogeny_count, fundamental_discriminant, hurwitz_class_number,
      cm_eigenvalues) for Stages 1-3, 5 and 6; a new bounded norm-form
      enumerator (exhaustive at 16-28 bits) and uniform norm-ball sampler for
      Stage 4; trial division to 10^6 plus ECM to 10^12 for Stage 4
      factorisation; a Dickman-rho evaluator written from its defining delay
      differential equation and checked against known values at small u
      before Stage 4 is read. Every kernel, isogeny edge and path claim is
      independently re-verified by code sharing no state with the producer.
      Recorded through harness/runner.py.
    parameters: >-
      MICROBENCHMARK/CENSUS -- census curves at 16, 20, 24, 28 bits (complete
      declared RQ-ECDLP-165d4b set at those sizes); B grid {100, 1000, 10000}.
      DIAL -- gamma in {0.05, 0.10, 0.20, 0.50, 1.00}, 200 replicates each.
      CRYPTOGRAPHIC ARM -- Delta at one declared 256-bit prime and one
      declared 384-bit prime, 10^5 and 10^4 samples respectively; trial
      division to 10^6, ECM to 10^12; matched random-integer null of equal
      size and congruence class, run first. COST-ADDITIVITY CONTROL -- 200
      paths per bit size, Omega in [1,12], ell in {2,3,5,7,11,13}, 50 points
      per path. NEARBY-OBJECT CONTROL -- one supersingular curve over F_{p^2}
      at a matched bit size.

  controls:
    - >-
      UNIT-CASE POSITIVE CONTROL (blocking): gamma_aut at j=0 and j=1728 must
      give G(6,gamma_aut) and G(4,gamma_aut) consistent with EV-ENDO-10109d's
      reported ratio-to-ceiling means (1.0043, sd 0.1128; 1.0442, sd 0.1059)
      within their reported sd.
    - >-
      PLANTED-DIAL POSITIVE CONTROL (blocking): measured net gain tracks
      G_max = 1/(2*sqrt(gamma)) within 15 percent at all five settings.
    - >-
      NEGATIVE CONTROL (blocking): the gamma=1.00 dial setting shows a
      measured net LOSS at every h tested.
    - >-
      INERT-FACTOR NULL (blocking): endomorphisms whose norm has an inert
      prime factor must NOT have the corrected cost model applied; the
      pipeline must fall back to Otilde(n) for them, and a report quoting the
      smooth cost for an inert alpha is invalid.
    - >-
      RANDOM-INTEGER SMOOTHNESS NULL (blocking, Stage 4): matched-size random
      integers must be drawn and scored BEFORE the elliptic norm-form data at
      each discriminant size; the elliptic values must differ from this null
      only in the genus-theory-predicted direction (the inert-prime one-half
      factor).
    - >-
      SUPERSINGULAR NEARBY-OBJECT CONTROL (blocking): gamma_min must drop
      there relative to the matched ordinary-curve measurement; a pipeline
      returning the same gamma_min on both is void.
    - >-
      MATCHED PARETO ROWS: charged rho (KN-TECH-006 convention) and charged
      BSGS with memory (KN-TECH-031) on a subsample of census curves.
    - >-
      KN-TECH-032/033/034 screens (embedding degree, anomalous, twist)
      recorded per curve in the same pass.
    - >-
      DECAY-PARAMETER CHECK: the modelled gamma lower bound
      c_0*B*log(N)/(c_step*h*log(B)) must GROW with N at fixed h; a bound flat
      in N is the section-3 artifact tell of docs/inventor-protocol.md and
      voids the reading.
    - >-
      CERTIFICATE CONTROL: every kernel, isogeny edge and path claim
      independently re-verified by code sharing no state with the producer;
      verification fraction must be 1.0.

  independent_variables:
    - endomorphism class (unit automorphism / non-unit split-smooth / non-unit with an inert or ramified factor / synthetic planted dial)
    - prime bit size (16, 20, 24, 28 for the toy arms)
    - smoothness bound B (100, 1000, 10000)
    - discriminant size for the heuristic-validation arm (256-bit, 384-bit)
    - arm (elliptic norm-form values versus matched random-integer null)
    - curve type (ordinary prime-field versus supersingular F_{p^2} nearby-object control)

  metrics:
    primary:
      - gamma_min and gamma_aut per curve per bit size, charged group-addition units, with bootstrap CIs
      - measured net gain versus predicted G_max=1/(2*sqrt(gamma)) per dial setting, with pass/fail against the 15 percent band
      - >-
        smooth-split fraction of endomorphism norms per B per bit size,
        compared against the Dickman-corrected prediction
      - N_0, the break-even threshold at B=2 and the measured (c_0, c_step), with CI
      - >-
        Kolmogorov-Smirnov distance between the empirical CDF of
        log(P^+(N(alpha)))/log(X) and the Dickman-corrected prediction, at
        256 and 384 bits, on the signal arm and on the matched null
      - certificate verification fraction (must be 1.0)
    secondary:
      - c_step, c_aut, c_velu(ell) in raw field operations with CIs
      - per-alpha table: N(alpha), P^+, Omega, split-fraction, h, modelled gamma, modelled G
      - measured-total-cost-to-summed-per-step-cost ratio per path (Stage 5), and whether it grows with Omega
      - resolved-factorisation fraction at 256/384 bits (ECM completeness)
      - smoothest observed sample at 256/384 bits versus its predicted rate (tail check)
      - largest observed P^+ versus the predicted maximum of the sample size (tail check)
      - wall clock and peak memory per stage; pass/fail of every blocking control

  heuristic_under_test:
    id: HEUR-9f3c7a-01
    formal_statement: >-
      NORM-FORM SMOOTHNESS. For alpha drawn uniformly from {alpha in O :
      N(alpha) <= X}, N(alpha) behaves, with respect to B-smoothness, like a
      uniformly random integer of size X conditioned on O's genus-theory local
      splitting conditions: Pr[N(alpha) B-smooth, every factor split] =
      (1/2+o(1))^Omega * u^{-u(1+o(1))}, u = log(X)/log(B), uniformly for
      (log X)^eps < u < (log X)^{1-eps}.
    tested_here: true
    scale_access: >-
      No curve is constructed. The norm form itself is the sampling oracle:
      fixing Delta = t^2-4p for a declared 256-bit (and separately 384-bit)
      prime p and admissible trace t, pairs (x,y) are drawn uniformly in the
      norm ball Q(x,y) <= X directly from the quadratic form, exactly mirroring
      the role the Deuring correspondence plays in the target-result-profile
      exemplar's section 4.2 -- it is what lets the heuristic be tested at
      cryptographic parameters without building any object of that size.
    transfer_assumption: >-
      Validated only at the sampled (Delta, X) pairs, stated explicitly.
      Nothing transfers to other discriminants, and the 16-28 bit toy columns
      (Stage 2) are instrument checks rather than evidence for the heuristic,
      because at those sizes almost every N(alpha) is smooth for any
      reasonable B.
    sample_size_justification: >-
      10^5 samples at 256 bits and 10^4 at 384 bits, matching the target-
      result-profile exemplar's own sample-size convention (100,000 at
      SQIsign NIST-I scale, 10,000 at NIST-V scale) for the same class of
      heuristic-validation test.
    comparison_metric: >-
      Kolmogorov-Smirnov distance between the empirical CDF of
      log(P^+(N(alpha)))/log(X) and the Dickman-corrected rho(u), computed
      identically on the signal arm and the matched random-integer null.
    tail_checks: >-
      The smoothest sample of the batch against its predicted rate rho(u),
      and the largest observed P^+ against the predicted maximum of that many
      draws -- the exemplar's own tail-check pattern, applied here.

  preregistered_prediction:
    quantity: >-
      gamma_min, gamma_aut, N_0, the smooth-split fraction per B, the
      dial-tracking ratio, and the KS distance from Dickman rho at 256/384
      bits.
    formula: >-
      G(h,gamma) = sqrt(h)/(1+h*gamma); G_max = 1/(2*sqrt(gamma)); necessary
      condition for a live non-unit branch: c_step*log(B) >= c_0*B*log(N);
      Pr[N(alpha) B-smooth, all split] = (1/2+o(1))^Omega * rho(u).
    source: >-
      Derived in Stage 0 of this contract from IDEA-20260901-6b63a4's T1
      (norm-order tradeoff), the standard Velu-composition evaluation
      accounting, and the Canfield-Erdos-Pomerance/Dickman-de Bruijn
      smoothness law composed with genus theory, as set out in
      H-ECDLP-9f3c7a's proof_search_map and heuristic_assumptions. Never
      tuned to observed data.

  scale_relevance:
    tier: toy for Stages 1-3, 5, 6; heuristic-validation (target-result-profile Part D) for Stage 4
    justification: >-
      Stages 1-3, 5 and 6 are executed at 16-28 bits because they require
      exact microbenchmarking and complete norm-form enumeration, which the
      hypothesis's structural predictions (gamma_min, the dial calibration)
      do not need cryptographic scale to test. Stage 4 reaches 256 and 384
      bits because the norm form is directly sampleable at that size without
      any curve; this is still far below deployed curve security levels and
      no transfer to a real ECDLP instance is claimed.
    correspondence: >-
      Stage 4's scale access comes from sampling the quadratic norm form
      Q(x,y) = N(x+y*omega) directly, which requires no point counting, no
      isogeny computation and no curve construction -- the correspondence
      that makes a cryptographic-size heuristic test affordable at all.

  tail_checks:
    - >-
      Report the smoothest sample at 256 and 384 bits against the
      rho-predicted probability of observing one that smooth at the tested
      sample size.
    - >-
      Report the largest observed P^+ against the predicted maximum of that
      many draws.
    - >-
      Report per-B raw smooth counts alongside the KS statistic so a bulk-
      driven KS pass cannot hide a tail disagreement.
    - >-
      Report the resolved-factorisation fraction (trial division plus ECM) at
      256/384 bits; an unresolved P^+ is reported as a lower bound, never
      imputed.

  replication:
    seeds: [20260908, 20260909, 20260910]
    independent_instances: 3
    note: >-
      The census enumeration (Stages 1-3) is deterministic complete
      enumeration at each declared prime; seeds affect the independent
      re-verification pipeline and the Stage 4/Stage 4-null sample draws. The
      planted dial (Stage 3) uses all three seeds for its 200 replicates per
      setting.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 14400
    total_cpu_hours: 24.0
    maximum_memory_gb: 8
    maximum_runs: 60
    maximum_workers: 1

  stopping_rules:
    - Stop immediately if the unit-case control cannot reproduce EV-ENDO-10109d's reported means within their reported sd.
    - Stop immediately if the certificate verification fraction falls below 1.0 on any kernel, edge or path claim.
    - Do not read the Stage 4 signal arm before the matched random-integer null has been executed in the same invocation.
    - Refuse (report as refused, not as agreement) any Stage 4 B-cell whose expected smooth count falls below 30.
    - Do not apply the corrected cost model to any alpha with an inert or ramified factor; fall back to Otilde(n) for it.
    - Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop under AGENTS.md rule 5, never a negative result.

  invalidation_rules:
    - A timeout, crash, memory exhaustion, factorisation failure or dependency failure is failed_infrastructure and is NEVER negative mathematical evidence (AGENTS.md rule 5).
    - A run measuring gamma as an isolated map timing rather than the difference of two end-to-end charged walk costs at matched seeds is invalid_measurement.
    - A run whose Stage 4 signal arm was executed without the matched null in the same invocation is invalid_measurement.
    - A run reporting a KS statistic at a B-cell whose expected smooth count is below the declared minimum of 30 is invalid_measurement at that cell.
    - A run applying the corrected cost model to an alpha with an inert or ramified ideal factor is invalid_measurement.
    - A run whose census enumeration at 16-28 bits is not COMPLETE at a declared prime is invalid_measurement for that prime's smooth-split fraction.
    - A run whose parameters differ from this frozen contract is a DIFFERENT experiment and requires a new contract or a versioned amendment.

  success_criterion: >-
    The unit-case control reproduces EV-ENDO-10109d's reported means within
    their reported sd; the planted dial tracks G_max=1/(2*sqrt(gamma)) within
    15 percent at all five settings with gamma=1.00 showing a net loss; the
    census enumeration is complete at every declared prime with gamma_min,
    gamma_aut and the smooth-split fraction table populated; the supersingular
    nearby-object control shows gamma_min dropping relative to the matched
    ordinary-curve measurement; the matched random-integer null and the
    signal arm both report a KS statistic against Dickman rho at 256 and 384
    bits with tail checks and refused cells listed; and the certificate
    verification fraction is 1.0. This criterion is decidable from the primary
    metrics alone and does not depend on which of Reading 1 or Reading 2 the
    values support.

  falsification_criterion:
    - >-
      Any curve shows a non-unit endomorphism with measured gamma < 0.25
      (Reading 2 -- escalates to independent validation and red-team review,
      does not by itself close the record).
    - The planted dial fails to track G_max within 15 percent at any setting.
    - The unit-case control cannot reproduce EV-ENDO-10109d's reported means within their sd.
    - The supersingular control shows the same gamma_min as the ordinary case.
    - >-
      The Stage 4 signal-arm KS distance exceeds the declared threshold at 256
      or 384 bits while the matched null does not -- HEUR-9f3c7a-01 is
      falsified at cryptographic scale.
    - Certificate verification fraction below 1.0 anywhere.

  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model and inference block, and environment
    - raw-result.json carrying every measured gamma, every enumerated alpha with its (N, P^+, Omega, split-fraction, h), every dial replicate, and every Stage 4 sample -- not summaries
    - the Stage 4 matched random-integer null's full results in the same file as the signal arm
    - the frozen Stage 0 pre-declaration text (prime list, cost-model hash, B grid, dial settings, discriminants, sample sizes, KS threshold), hashed before any run
    - independent re-verification certificates for every kernel, isogeny edge and path claim, produced by code sharing no state with the producer, with the verification fraction stated
    - the obstruction record for gamma_min per docs/inventor-protocol.md section 4, with units, error bars, the runs it is read from, the scope, and a resource_check reading
    - the per-B Stage 4 table: family size, expected smooth count, observed smooth count, KS statistic, refusal status, and the tail-check numbers

  assigned_to: executor
  approval_gate:
    - >-
      This contract carries a `hypothesis` with `asymptotic_claim.claim_kind:
      constant_factor`, not exponent_improvement; nothing in it may be
      promoted toward the four `supported` gates of AGENTS.md's
      asymptotic-complexity rule, since that rule governs exponent claims and
      this record makes none. This gate exists only to prevent the
      constant-factor result being overclaimed on report.
    - >-
      H-ECDLP-9f3c7a carries a filled proof_search_map (bottleneck, frozen
      baseline embedding, executed observation-collision search, explicit
      quantifier order, method ceiling with a nearby-object control, and
      proof obligations by responsibility), audited against KN-TECH-080 by
      this Coordinator before this contract's approval below.
    - >-
      A Reading 2 outcome (gamma_min < 0.25 anywhere) requires independent
      validation and red-team review BEFORE any use of the finding beyond
      this contract's own reporting; this contract's success_criterion does
      not depend on which reading obtains, so approval here is not an
      approval of any escalation.

  derivation_provenance:
    tool: coordinator subagent, /design-experiment lifecycle steps 3 to 5
    source_record: IDEA-20260904-742c48
    authored_at: '2026-09-08'
    note: >-
      Stages 0-2, 4 and the controls are taken directly from the parent
      proposal's mechanism (Stage 0-3 numbering there), null_object_control
      and minimal_test blocks. Stage 3 (the planted dial) and Stage 5 (cost
      additivity) are the proposal's own null_object_control POSITIVE
      CONTROL B and heuristic_assumptions H2 validation_plan, promoted to
      first-class experiment stages. Stage 6 (supersingular nearby object) is
      the proposal's proof_search_map method_ceiling control, promoted to a
      blocking experiment stage rather than left as a proof obligation only.
      Budget figures (24 CPU-hours, 8GB memory, 60 runs, 4-hour per-run wall
      clock) are the Coordinator's own conservative envelope around the
      proposal's own compute_budget_note ("under one hour at 16-20 bits" for
      the microbenchmark; "single-digit CPU-hours" for the 256-bit rung);
      these budget fields are advisory per current research-budget policy and
      do not gate approval. No field is invented beyond what the proposal or
      this Coordinator's own additions (explicitly marked above) state.

  derivation_gaps:
    - >-
      The exact 256-bit and 384-bit primes and admissible traces are not
      pinned by the parent proposal; they must be fixed at Stage 0 by the
      executor and hashed before Stage 4 sampling, following the same
      no-selection-after-seeing-outcomes discipline as the toy-scale prime
      list.
    - >-
      The exact frozen cost-model hash (which field operations are charged,
      at what unit cost, for c_step/c_aut/c_velu) is not specified beyond
      "one frozen cost model"; the executor must fix and hash it at Stage 0,
      consistent with KN-TECH-006's charged-rho convention.
    - >-
      Whether the declared census set has at least one curve per declared bit
      size with a non-unit endomorphism whose ideal factors into split primes
      of norm <= 10^4 is not known in advance; if none exists at a bit size,
      that size's smooth-split fraction cell must be reported as
      "zero observed, not zero predicted" rather than silently omitted.
