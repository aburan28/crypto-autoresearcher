experiment:
  id: EXP-ECDLP-da4ba3
  hypothesis_id: H-ECDLP-9e7a19
  proposal_id: IDEA-20260909-4c5ee9
  question_id: RQ-ECDLP-002
  goal_ids:
  - GOAL-ECDLP-001
  - GOAL-ICEX-001
  version: 1
  title: 'Prym G: toy fiber-product geometry and direct-transfer screen'
  designed_at: '2026-10-19'
  status: approved
  objective: Check an explicit newly generated finite cover panel and distinguish Frobenius screening
    from executable transfer and from auxiliary relation search.
  inputs:
    design_brief: research/prym_experiment_design_20261019/brief.md
    prior_intake: research/prym_relation_followup_20261019/README.md
    problem: problems/prym-assisted-source-labelled-router.md
    proposal: ledger/proposals/IDEA-20260909-4c5ee9.yaml
    archive_task_id: TASK-20261019-84755b
    runner: experiments/EXP-ECDLP-da4ba3/launch.py
    config: research/prym_experiment_design_20261019/geometry_inputs.json
    commands:
      generate:
      - python3
      - experiments/EXP-ECDLP-da4ba3/launch.py
      - --config
      - research/prym_experiment_design_20261019/geometry_inputs.json
      - --run-dir
      - '{run_dir}'
      check:
      - python3
      - experiments/EXP-ECDLP-da4ba3/independent_check.py
      - --config
      - research/prym_experiment_design_20261019/geometry_inputs.json
      - --run-dir
      - '{run_dir}'
    dependencies:
    - Python 3.12
    - SymPy
    - PyYAML
    - ReportLab
    curve_family: 'E: y^2=x^3+7; D: y^2=x^3+7, z^2=(x-a)(x-b); H: w^2=(x^3+7)(x-a)(x-b).'
    primes:
    - 11
    - 13
    - 17
    - 19
    - 23
    - 31
    - 43
    - 59
    selection_rule: At each p enumerate integer pairs 0<=a<b<p lexicographically; retain the first eight
      with (a^3+7)(b^3+7) nonzero modulo p. Record every inspected/rejected pair. Each h is monic squarefree
      and coprime to f. Total 64 NEW toy covers.
    strata: Record E trace and ordinary/supersingular status. j=0 is supersingular for some listed p;
      these cells are geometric instrument controls, not ordinary-curve attack evidence.
    field_rule: Fp uses canonical integers. Fp2 uses u+v*theta with theta^2 the least positive quadratic
      nonresidue; record that polynomial. Character is 0 at zero and otherwise z^((q-1)/2).
    enumeration_rule: 'Enumerate affine coordinates and add correct points at infinity: E and H each have
      one; D has two for monic quadratic h. Independently check N_D(q)=N_E(q)+N_H(q)-(q+1), q=p,p^2. Avoid
      deriving D counts from this identity in the counting arm.'
    frobenius_rule: t_E=p+1-N_E(p), s_E2=p^2+1-N_E(p^2). Check s_E2=t_E^2-2p. t_H=p+1-N_H(p), s_H2=p^2+1-N_H(p^2),
      c_H=(t_H^2-s_H2)/2. F_E(T)=T^2-t_E*T+p; F_H(T)=T^4-t_H*T^3+c_H*T^2-p*t_H*T+p^2. Require integral
      c_H. Compute rational polynomial gcd, exact factors and F_D_candidate=F_E*F_H.
    direct_screen: gcd_Q[T](F_E,F_H)=1 excludes an Fp algebraic homomorphism E->J(H); nontrivial gcd is
      compatibility, not a constructed evaluator. The natural anti-invariant projection kills pi^*(E)
      in either case. Auxiliary Route B remains open regardless of this gcd.
    verification_boundary: Fp/Fp2 give complete E/H Frobenius polynomials under the genus/reciprocity
      hypotheses. For genus-three D they check only two traces; the complete F_D is inferred from the
      geometric decomposition, not independently verified by those two counts. No Jacobian-map or subgroup-action
      tests are included.
    independent_checker: experiments/EXP-ECDLP-da4ba3/independent_check.py
  controls:
  - 'C-G-aa: repeat the exact panel with reverse field-element enumeration; counts, factors and rational
    gcd must be identical.'
  - 'C-G-synthetic: screen explicitly supplied monic shared/coprime polynomial pairs and a sign-malformed
    reciprocal polynomial; synthetic pairs certify the screen only.'
  - 'C-G-random: compare each chosen pair with the next eight eligible lexicographic pairs at the same
    p, same dimension and count pipeline; this is a matched structural diagnostic, not a claim that either
    set is random.'
  - The earlier F43 chat example and any identical cells are calibration-only; synthetic labels are unit
    controls, never evidence of a geometric map.
  independent_variables:
  - prime p
  - cover pair (a,b)
  - 'screen input class: fresh geometry/shared/coprime/malformed synthetic'
  metrics:
    primary:
    - exact count mismatch count (integer; target zero) in C-G-counts
    - incorrect shared/coprime screen classifications (integer; target zero) in C-G-synthetic
    secondary:
    - N_E,N_H,N_D over p and p^2 (points)
    - F_E,F_H rational factorization and gcd degree (polynomials/degree)
    - ordinary/supersingular flag and number of rejected cover pairs
    - operation vector, CPU seconds and peak RSS bytes; no speed comparison
  replication:
    seeds:
    - 0
    independent_instances: 64
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: null
    maximum_workers: 1
  stopping_rules:
  - Complete the fixed 64-cover census and all declared controls; no early stop for an interesting gcd.
  - Any arithmetic/control mismatch stops dependent interpretation, retains the partial census and opens
    an implementation correction.
  - Machine headroom guard stops are censored infrastructure; no new prime or replacement pair is chosen
    after results.
  invalidation_rules:
  - Curve singularity, incorrect extension field, wrong infinity count, derived rather than independent
    D count, or unrecorded input mutation invalidates affected cells.
  - A/A exact disagreement or a synthetic misclassification invalidates the screen instrument.
  - Do not claim full genus-three Frobenius verification from only Fp/Fp2 counts.
  success_criterion: 'P-G-counts and C-G-counts on non-overlapping fresh cells: all prescribed exact count
    identities hold, all C-G-synthetic classifications are correct, and C-G-aa agrees exactly. This validates
    the finite arithmetic screen only; it is not ECDLP progress.'
  falsification_criterion: 'P-G-counts and C-G-counts: a reproducible identity failure on a smooth, correctly
    encoded fresh cell challenges the stated geometric/counting implementation and requires independent
    derivation. A failure of C-G-aa or C-G-synthetic is instrument invalidity, not evidence against Prym-assisted
    ECDLP.'
  required_artifacts:
  - 'manifest.yaml: native command/revision, tracked dirty state, source/protocol/input hashes, versions/hardware,
    seeds, field encodings, curve IDs, explicit absent subgroup/factor-base IDs, policy provenance, timestamps,
    CPU and sampled process-group resources'
  - 'All native supervisor files: launch.json, execution-receipt.json, command.txt, environment.json,
    stdout.log, stderr.log, check.stdout.log, check.stderr.log'
  - Immutable raw-result.json, events.jsonl with inspected/rejected pairs, partial/error records and both
    fixed panels in both enumeration orders
  - 'verification.json: independent norm/Legendre Fp/Fp2 recount, transported A/A, synthetic shared/coprime/malformed
    controls, exact rational gcd and retained failures'
  - report.md, graph.svg, graph-source.json and report.pdf; inspect PDF before archive; observations only
  assigned_to: executor-implementation
  approved_by: DEC-20261019-486fa8
  approval_blockers: []
  execution_authority: Prospective final bytes only. The native probe grants no execution permission;
    committed Coordinator approval/archive, selector ready, and a published live science-task claim are
    required before run.
  cost_accounting:
    complete_work: Retain a vector of raw field operations by field, elliptic/Jacobian additions and multiplications,
      polynomial arithmetic/factorization, comparisons/hash operations, matrix operations and bytes moved.
      Do not add unlike units without a frozen weight model. S is the current matched baseline protocol's
      complete weighted operation count, with its weights bound before approval. Wall time and CPU are
      secondary diagnostics.
    charge:
    - public instance/cover search including rejected candidates
    - map construction, normalization, factor-base generation, advice/training and tuning
    - all candidate generation, failed lifts, branch enumeration and rejected tuples
    - companion labels, selector evaluation, row normalization, witness/source checks and independent-rank
      maintenance
    - linear algebra, target descent, recovery, and final source verification
    accounting_scope: Both cold-start and genuinely amortized totals; no free offline table, oracle, secret
      witness or uncharged rejected stream. Reference/checker work is reported separately and cannot be
      supplied to the attack.
    memory: Record peak process-group RSS bytes plus peak live algebraic words/table entries and serialized
      advice bytes. A 2 GiB guard protects headroom; any guard stop is censored infrastructure, not a
      complete successful solve.
  interpretation_limits:
  - 'Finite toy arithmetic scope: no measured gain, asymptotic exponent, novelty certificate or security
    conclusion.'
  - The unsourced historical 32-cover quotation is not an input catalog; no identification or completeness
    claim is made.
  - P1546 remains a scoped fixed-branch counting gate; this design does not execute or reopen the IDEA-002
    frozen contract.
  - A cover, Frobenius overlap, auxiliary cancellation or faster known-scalar multiplication alone does
    not solve ECDLP.
  - Missing code, access, admission or verification is an implementation/infrastructure impediment, not
    mathematical falsification.
  decision_impact:
    on_positive: Archive the exact finite cover table and map the Route A gcd strata; permit design of
      explicit map checks or auxiliary-route witnesses. Do not require overlap for Route B.
    on_negative: Localize geometry/formula/field failure with a second implementation before using these
      fixtures. Do not launch relation experiments on invalid arithmetic.
    on_inconclusive: Retain partial exact counts and record the specific implementation/admission gap;
      no transfer or attack label.
  preregistered_predictions:
  - id: P-G-counts
    quantity: Character-count decomposition and elliptic second-trace consistency
    prediction: Both exact identities hold on every fresh admitted cell; controls classify their supplied
      factor overlap correctly.
    kind: algebraic correctness; not a performance prediction
  scale_relevance:
    tier: toy
    justification: Finite implementation/algorithm experiments; no transfer to secp256k1 or P-256.
    correspondence: null
  prediction_provenance:
  - prediction: P-G-counts
    first_recorded_in: experiments/EXP-ECDLP-da4ba3/specification.yaml
    written_at: '2026-10-19'
    data_seen:
    - path: inputs/refs/experiments/ecdlp_isogeny/po_transfer_003_result.md
      measured: Imported historical toy relation/rank/recovery/cost observations; read by parent intake,
        not replayed here.
    - path: research/prym_relation_followup_20261019/README.md
      measured: Earlier chat F43 point-count/Frobenius diagnostic was seen; it is not native run evidence.
    sample_status: partially_in_sample
    overlap: The earlier F43 h=x(x-1) chat diagnostic overlaps this census. Other fresh cells have not
      been measured in this task; historical F43 is non-decisive calibration.
    decisive_scope: Only non-overlapping fresh cells explicitly tagged holdout; historical PO003 and the
      previously seen F43 diagnostic are calibration only.
  variable_ledger:
    independent:
    - name: geometry_cell
      levels: 64 declared covers; extra matched/synthetic controls
    factors:
    - name: field_encoding
      treatment: fixed
      value: canonical Fp and specified Fp2
      how: Use the same canonical encoding in each paired control.
    - name: enumeration_order
      treatment: fixed
      value: forward versus reverse only in A/A
      how: No change in the enumerated set.
    - name: formulas_and_infinity
      treatment: fixed
      value: explicit equations and infinity rules
      how: Freeze source/config hashes before approval.
    - name: screen_class
      treatment: crossed
      value: shared/coprime/malformed synthetic
      how: Run all supplied classes with the same gcd/checker.
    - name: host_load
      treatment: measured
      value: manifest
      how: Affects diagnostic timing only.
    comparisons:
    - id: C-G-counts
      arms:
      - counted geometry
      differs_in: []
      design: absolute
    - id: C-G-aa
      arms:
      - forward
      - reverse
      differs_in:
      - enumeration_order
      design: aa
    - id: C-G-synthetic
      arms:
      - synthetic screen
      differs_in: []
      design: absolute
    - id: C-G-random
      arms:
      - first8
      - next8
      differs_in:
      - geometry_cell
      design: one_factor
    crosses_map: true
  transfer_obligations:
  - map: Fiber-product quotient and inferred isogeny decomposition
    kind: cover
    source: E/Fp and D/Fp
    destination: E x J(H) over Fp
    preserves:
    - working field Fp
    - Frobenius factors subject to geometric hypotheses
    changes:
    - dimension, representation and factor decomposition
    - no unknown scalar returned
    controls:
    - kind: identity_map
      comparison: C-G-aa
    - kind: matched_random
      comparison: C-G-random
    assessment: research/prym_experiment_design_20261019/protocol_summary.json
    assessment_key: transfer_assessments.G
  goal_id: GOAL-ECDLP-001
