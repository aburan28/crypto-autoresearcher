experiment:
  id: EXP-RELN-e48d01
  hypothesis_id: H-RELN-a44c18
  derived_from_idea: IDEA-20260805-44bc0b
  question_id: RQ-RELN-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  duplication_note: >-
    STATED FIRST. H-PATH-89d1d0 already exists in the ledger for the SAME parent proposal
    IDEA-20260805-44bc0b, and that proposal names it as the carrier of its
    proof_search_map. This contract binds to H-RELN-a44c18 because the dispatching
    session assigned that identifier; the drafting coordinator subagent mints none. A
    COORDINATOR MUST ADJUDICATE the duplication under a decision record before this
    contract is approved.

  title: >-
    Zero-compute-first audit of the bounded-degree factor-base no-go by the coverage
    exponent chi and the description density delta - with NFS and Gaudry-Diem as the
    nearby objects where the conclusion is known false, a Bezout fixture, and a matched
    random subset built to show the diagnostic is necessary only

  objective: >-
    The one uncertainty a run reduces is whether the bounded-degree algebraic
    factor-base no-go separates on the clause it is read as separating on ("algebraically
    described") or on a single scalar (the coverage exponent chi), and whether the
    description density delta is the mechanism behind that separation. A run establishes
    (i) whether Theorem 1G's hypothesis is exactly chi <= 1 - epsilon, which is zero
    compute and can end the line; (ii) whether chi equals 1 for the NFS rational side
    independently of B, under an arity convention validated by exhaustive enumeration of
    B-smooth integers at toy M rather than assumed; (iii) whether chi equals 1 for the
    Gaudry/Diem construction from EXHAUSTIVELY ENUMERATED cardinalities at four small
    (q, n); (iv) whether delta separates the four families by the predicted orders; and
    (v) whether a size-matched uniformly random subset covers comparably at chi = 1,
    which would fix the diagnostic permanently as necessary and not sufficient. NO
    ATTACK, NO ALGORITHM, NO EXPONENT, and no status change to KN-OPEN-020 or to the
    theorem receipt follows from a run.

  what_this_is_not:
    - >-
      Not an attack, an algorithm, a factor-base proposal or a cost claim against any
      baseline. No relation is collected and no prime-field index calculus is made feasible.
    - >-
      Not a claim that the bounded-degree theorem is defective. Its hypothesis correctly
      excludes NFS and Gaudry-Diem and there is no contradiction.
    - >-
      Not a closure of KN-OPEN-020 and not a status change to it, to IDEA-20260801-021, to
      the theorem receipt, or to any decision citing them.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run has been
      executed under this contract.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE. Derivation tier for the counting statements - the
      equivalence of Theorem 1G's hypothesis with chi <= 1 - epsilon, chi_NFS = 1 by the
      definition of B-smooth, chi_GD = 1 by cancellation, and the linear-versus-logarithmic
      trade in delta. Toy tier for every measured cell - the enumerated cardinalities at
      the four (q, n), the smooth-integer counts at toy M, the Bezout check, and the
      coverage fractions. WHAT DOES NOT FOLLOW - nothing about whether a prime-field index
      calculus exists; no attack cost; no exponent; no statement about implicit-membership
      predicates, which delta does not charge; and no closure or status change for
      KN-OPEN-020, which this contract RESTATES at most.

  inputs:
    procedure: >-
      STAGE 1 (ZERO COMPUTE, CAN TERMINATE THE WHOLE LINE). Write chi and delta out by
      hand for the four declared families, check chi_NFS against the definition of
      smoothness, and assert symbolically that Theorem 1G's hypothesis
      Delta^m <= N^{1-epsilon} is the condition chi <= 1 - epsilon. If chi_NFS is not 1,
      or the equivalence fails, the audit is wrong and stops here at zero cost.
      STAGE 2 (seconds, exact integer arithmetic). Enumerate ALL B-smooth integers up to a
      toy M for a grid of B. Measure Psi(M, B), the EMPIRICAL ARITY DISTRIBUTION of
      B-smooth integers, and chi-hat. Verify chi-hat tends to 1 and is B-independent. This
      replaces the assumed arity convention with a measured one, which is the step a
      reviewer is most likely to attack.
      STAGE 3 (minutes, exact). Build E(F_{q^n}) at (q,n) in {(5,3),(7,3),(11,2),(13,2)}
      by exhaustive enumeration over an explicit polynomial basis. Compute |F|, N and |mF|
      for the subfield factor base AND for the size-matched random null over at least 20
      seeds, and compute chi and the coverage fraction for both.
      STAGE 4 (minutes, FIXTURES AND LADDERS). Run the Bezout fixture - explicit toy curve,
      explicit plane predicate of each declared degree, exhaustive enumeration of F,
      assert |F| <= 3d. Sweep the plane-predicate degree over {1,2,5,10,30,100} at fixed m
      and log2 N = 256 and report chi(d) and delta(d) as a monotone table.
      STAGE 5 (zero compute). Emit the four-family (chi, delta) table, the coverage
      comparison, and a one-page RESTATEMENT of KN-OPEN-020 quantified over chi with the
      three named escapes listed and explicitly NOT graded.
    instrument: >-
      Python 3.11, exact integer arithmetic, pure Python plus numpy. No Sage, no Groebner,
      no solver. E(F_{q^n}) enumerated exhaustively over an explicit polynomial basis;
      B-smooth integers enumerated exactly; sumsets computed exactly; delta computed from
      an explicit bit count of each predicate's description, with the counting rule written
      down before any family is evaluated. Recorded through harness/runner.py.
    parameters: >-
      Gaudry cells (5,3), (7,3), (11,2), (13,2). NFS toy M and a grid of B small enough for
      exhaustive smooth-integer enumeration. Plane-predicate degrees {1,2,5,10,30,100} at
      fixed m and log2 N = 256. Bounded-degree cells (m=2,d=10,64), (m=3,d=10,64),
      (m=4,d=30,256), (m=2,d=100,256). At least 20 random-null seeds per Gaudry cell.
      Arity convention for NFS declared at STAGE 1 and MEASURED at STAGE 2.

  controls:
    - >-
      NULL OBJECT, SAME SHAPE, FORCED VALUE PRE-DERIVED, CAN FAIL. A uniformly random
      subset R of G with |R| = |F| and the same arity m, on the same curve at the same
      cell. FORCED VALUE from balls-in-bins: |mR|/N ~ 1 - exp(-|R|^m / N), and
      chi(R) = chi(F) EXACTLY because chi depends only on cardinalities. IT CAN FAIL IN
      TWO INFORMATIVE DIRECTIONS: far below the prediction means the random sumset is
      structured and the counting is wrong; comparable to the subfield base - which is
      what is predicted - CONFIRMS that chi measures coverage only, and the record must
      carry that limit permanently.
    - >-
      POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR. The Gaudry subfield base at (7,3),
      a construction known to work as index calculus: its coverage MUST reach a constant
      fraction and its chi MUST come out at 1. If it does not, the enumeration code is
      wrong and NO conclusion about the bounded-degree family may be reported.
    - >-
      SECOND POSITIVE CONTROL, ZERO COMPUTE, ON THE READING OF THE THEOREM. An explicit
      plane predicate of small degree on an explicit toy curve, F enumerated exhaustively,
      |F| <= 3d asserted. That is Bezout, so it MUST hold; a violation means the interface
      has been misread and everything downstream is void.
    - >-
      GRADED CONTROL WITH FOUR INTERIOR POINTS, MONOTONICITY REPORTED. Sweep (q,n) and
      report chi and coverage as functions of |F|^m / N. PREDICTED: chi flat at 1.00 while
      coverage rises monotonically. A chi that drifts with the cell localises an error in
      the cardinality identifications rather than leaving "it did not work".
    - >-
      GRADED CONTROL ON THE PARAMETER MEANT TO DESTROY THE EFFECT. Sweep the
      plane-predicate degree and report chi(d) and delta(d). PREDICTED: chi rises only
      logarithmically in d while delta rises linearly. The gap between a logarithmic gain
      and a linear cost IS the mechanism, displayed as a monotone table rather than
      asserted as a slogan.
    - >-
      ARCHIVE CHECK, ZERO COMPUTE. Record the searches performed for a prior evaluation of
      the no-go against NFS as a NEGATIVE SEARCH RESULT, explicitly not as proof that the
      control was never run elsewhere.

  independent_variables:
    - 'family: NFS rational side / Gaudry-Diem subfield / bounded-degree plane predicate / matched random subset'
    - (q, n) for the Gaudry cells
    - B and M for the NFS enumeration
    - plane-predicate degree d
    - arity m
    - seed (matched random null only)

  metrics:
    primary:
      - >-
        chi per family per cell, computed as m log(Delta) / log(N) from cardinalities that
        were COUNTED at every measured cell, with the cardinalities reported beside it.
      - >-
        delta per family, computed as (bits to write the membership predicate) divided by
        |F|, under a bit-counting rule fixed before any family is evaluated.
      - >-
        Measured Psi(M, B) and the empirical ARITY DISTRIBUTION of B-smooth integers per
        B, with M and the enumeration method stated, from which chi-hat_NFS is computed.
      - >-
        Coverage fraction |mF|/N per Gaudry cell for the subfield base and |mR|/N for the
        matched random null over at least 20 seeds, with the null's mean and spread.
      - >-
        Bezout check outcome |F| <= 3d per degree on the explicit toy predicate, a boolean
        per degree with the enumerated |F| beside it.
      - >-
        chi(d) and delta(d) over the degree sweep, with the sign of each step, so
        logarithmic-versus-linear is read off a monotone table.
    secondary:
      - The degree d required for chi = 1 at 256 bits with m = 4, and the delta it implies.
      - The four worked bounded-degree cells' chi values, as exact arithmetic a reviewer can redo.
      - Enumerated |F| and N per (q, n), with the Hasse deviation of #E(F_{q^n}) from q^n.
      - The one-page restatement of KN-OPEN-020 quantified over chi, with the three escapes listed and ungraded.
      - The archive-check record, labelled a negative search result.
      - Wall time and peak memory per stage.

  heuristic_under_test: HEUR-RELN-2
  heuristic_under_test_note: >-
    STAGE 2 validates HEUR-RELN-2 of H-RELN-a44c18 - the smoothness-density statement
    log Psi(M,B)/log M tending to 1 - by EXHAUSTIVE enumeration of B-smooth integers at
    toy M across a grid of B, reporting the measured ratio against the model rather than
    citing the model. HEUR-RELN-3, the balls-in-bins sumset prediction for the random null,
    is validated at STAGE 3 by exact enumeration of |mR| over at least 20 seeds against its
    pre-registered band. Sample-size justification: the grid of B is chosen so that the
    SMALLEST Psi(M,B) to be resolved still contains at least several hundred enumerated
    integers, so the measured ratio is not dominated by counting noise, and the achieved
    minimum count is reported. Synthetic control on matched uniform objects: the
    size-matched random subset, present at every Gaudry cell.

  preregistered_prediction:
    quantity: >-
      chi for the NFS rational side across the B sweep; chi for Gaudry-Diem at the four
      enumerated cells; the delta separation at the 256-bit cell; and the coverage
      comparison between the subfield base and the size-matched random null.
    formula: >-
      chi_NFS = 1.000 exactly and independent of B, within the arity estimator's declared
      discretisation. chi_GD = 1.000 plus or minus 0.05 at every cell. delta separating by
      at least 6 orders of magnitude at the 256-bit cell - tending to 0 for NFS and Gaudry
      against at least 4.3e17 bits per element for a plane predicate at d = 2^64/3. Both
      coverage fractions exceeding 0.3 wherever |F|^m >= N, WITH THE POINT BEING THAT THEY
      AGREE, which fixes chi as necessary-only.
    source: >-
      Pre-registered in the parent proposal IDEA-20260805-44bc0b predictions block and
      restated in H-RELN-a44c18 before any run under this contract exists. The four worked
      bounded-degree cells (chi = 0.1533, 0.2300, 0.1014, 0.0643) are derived arithmetic
      stated in that proposal, not measurements, and are re-derived at STAGE 1. Never tuned
      to data.

  scale_relevance:
    tier: toy
    justification: >-
      Every measured cell is at group sizes below about 1000 and toy M, because the design
      COUNTS every cardinality entering chi rather than assuming it, and exhaustive
      counting is what makes the check a check. The headline statements are DERIVATIONS and
      are scale-free - chi_NFS = 1 is the definition of B-smooth, chi_GD = 1 is a
      cancellation - and may be cited as derivations at any scale. THE MEASURED CELLS ARE
      NOT AN EXTRAPOLATION: they are a check of a counting identity at a scale where the
      Hasse deviation is large, which is why the Gaudry tolerance is plus or minus 0.05 and
      why a cell below 0.9 withdraws the identification rather than being averaged away.
    correspondence: null

  tail_checks:
    - >-
      Report the smallest enumerated Psi(M,B) in the grid, so a chi-hat computed from a
      handful of integers is visible as such.
    - >-
      Report the Hasse deviation of #E(F_{q^n}) from q^n at every cell, since at these
      sizes it is a large relative deviation and it is what the chi tolerance is set for.
    - >-
      Report the random null's full range across seeds, not only its mean, since a coverage
      comparison judged on a mean can hide a bimodal null.
    - >-
      Report chi(d) and delta(d) step by step with signs; a logarithmic-versus-linear claim
      checked only at endpoints is not checked.

  replication:
    seeds: [20260825, 20260826, 20260827]
    independent_instances: 3
    repeat_count_per_cell: 1
    note: >-
      Every quantity on the treatment side is deterministic given the cell and is not
      repeated. Seeds vary the random null, of which at least 20 draws are taken per Gaudry
      cell; three seeds give three independent null ensembles as a stability check on the
      ensemble itself.

  budget:
    wall_clock_seconds: 1800
    wall_clock_seconds_note: Per run. total_cpu_hours bounds the whole contract.
    total_cpu_hours: 1.0
    memory_gb: 4
    maximum_runs: 20

  stopping_rules:
    - >-
      Stop the entire contract at STAGE 1 if chi_NFS is not 1 or the hypothesis equivalence
      fails, and report only that. This is the cheapest possible termination and it is the
      designed one.
    - >-
      Stop and report if the Bezout fixture fails; the interface has been misread and no
      downstream number is meaningful.
    - >-
      Stop and report if the Gaudry positive control fails; the enumeration is wrong and no
      negative about the bounded-degree family may be reported.
    - >-
      Stop at maximum_runs or total_cpu_hours. Budget exhaustion is a stop, never a negative
      result (AGENTS.md rule 5).

  invalidation_rules:
    - >-
      A timeout, crash or dependency failure makes the run failed_infrastructure and is
      NEVER negative evidence about any family.
    - >-
      A run in which the matched random null was not computed in the same invocation as the
      subfield arm is invalid_measurement; the coverage comparison this contract exists to
      make was not made.
    - >-
      A run reporting chi from ASSUMED cardinalities at any measured cell is
      invalid_measurement; every measured cell's |F|, N and |mF| must be counted.
    - >-
      A run whose delta bit-counting rule was fixed after any family was evaluated is
      invalid_measurement, because delta would then be a choice rather than a charge.
    - >-
      A run whose NFS arity convention was adjusted after seeing chi-hat is
      invalid_measurement; the convention is declared at STAGE 1 and measured at STAGE 2.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment and
      requires a new contract.

  success_criterion: >-
    ALL of the following, each decidable from the primary metrics. (1) STAGE 1 asserts the
    equivalence of Theorem 1G's hypothesis with chi <= 1 - epsilon, and chi_NFS = 1 under
    the declared arity convention. (2) The Bezout fixture holds at every declared degree.
    (3) The Gaudry positive control returns chi = 1.000 plus or minus 0.05 and coverage
    reaching a constant fraction at (7,3). (4) The matched random null was computed at
    every Gaudry cell over at least 20 seeds in the same invocation, and both coverage
    fractions are reported. (5) chi(d) and delta(d) are reported as monotone tables with
    per-step signs. A run meeting (1) to (5) is VALID, and its verdict on H-RELN-a44c18 is
    then read directly: (C2) is supported if chi_GD and chi_NFS are both 1 within tolerance;
    (C3) is supported only if delta separates the families by at least 6 orders of magnitude
    at the 256-bit cell; and (C4) is CONFIRMED - the diagnostic is necessary only - if the
    random null's coverage is comparable to the subfield base's.

  falsification_criterion:
    - >-
      chi_NFS not equal to 1 falsifies (C2)'s central comparison and the record is withdrawn
      by a superseding record.
    - >-
      Theorem 1G's hypothesis not being equivalent to chi <= 1 - epsilon falsifies (C1); the
      rewrite is wrong and everything downstream is void.
    - >-
      The Bezout fixture failing falsifies the reading of the interface; no conclusion may be
      reported from any arm.
    - >-
      The Gaudry positive control failing falsifies the INSTRUMENT; no negative about the
      bounded-degree family may be reported.
    - >-
      Measured |mR|/N outside the pre-registered balls-in-bins band falsifies HEUR-RELN-3;
      the null's forced value must be re-derived before the treatment arm is interpreted.
    - >-
      delta failing to separate the four families falsifies (C3); the description-density
      half is dead and only the chi rewrite survives, which is a weaker contribution and is
      reported as one.
    - >-
      Measured log Psi(M,B)/log M drifting away from 1 as B falls, in a way the model does
      not predict, falsifies HEUR-RELN-2 and the NFS arity identification with it.

  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment
    - the STAGE 1 zero-compute derivation, written out, including the symbolic equivalence assertion
    - >-
      raw-result.json with chi and delta per family per cell AND the cardinalities they were
      computed from, never chi alone
    - measured Psi(M,B) and the arity distribution per B, with M and the enumeration method stated
    - >-
      exhaustively enumerated |F|, N and |mF| per (q,n) cell for both the subfield base and
      the random null, with seeds, in the same file
    - the Bezout check per degree with the enumerated |F| beside it
    - the chi(d) and delta(d) sweep tables with per-step signs
    - >-
      the one-page restatement of KN-OPEN-020 quantified over chi, with the three named
      escapes listed and explicitly ungraded
    - the archive-check record, labelled a negative search result

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not approve. This contract is review_required and NOT
      approved; approved_by is null and execution_authorized is false. Approval is the
      USER's gate because it authorizes execution and spends compute.
    - >-
      DUPLICATION MUST BE ADJUDICATED FIRST against H-PATH-89d1d0, which the parent
      proposal names as its paired hypothesis.
    - >-
      The delta bit-counting rule must be fixed at approval, before any family is evaluated.
      A charge chosen after seeing which families it separates is not a charge.
    - >-
      A confirming outcome does NOT close KN-OPEN-020 and does not authorize a status change
      to it, to IDEA-20260801-021 or to the theorem receipt. Those are separate Coordinator
      decisions (AGENTS.md rule 1).

  derivation_provenance:
    tool: coordinator subagent, /design-experiment lifecycle steps 3-5
    source_record: IDEA-20260805-44bc0b
    authored_at: '2026-08-25'
    note: >-
      Every stage, control, prediction and forced value is taken from the parent proposal's
      mechanism, minimal_test, controls, predictions, heuristic_assumptions and
      falsification_conditions blocks. The four worked bounded-degree chi cells and the
      d >= 2^64/3 figure are DERIVED ARITHMETIC stated in that proposal and are re-derived
      at STAGE 1 rather than cited as measurements. The proposal's own session-run
      environment checks (numpy present, Sage absent) are not evidence and are not relied
      on beyond confirming the contract needs no CAS. Budgets come from the parent's
      estimated_cost (implementation low, compute low). No measurement, timing, run or
      citation is invented.

  derivation_gaps:
    - >-
      THE NFS ARITY CONVENTION m = u IS A MODELLING CHOICE, not a forced one, and a
      different convention changes chi. STAGE 2 measures the empirical arity distribution so
      the choice is defended by data, but a reviewer may still reject the identification, and
      the contract invites that rejection rather than hiding it.
    - >-
      NO NFS OR GAUDRY PAPER HAS BEEN READ by this program. If the recalled constructions are
      misdescribed, the nearby objects are misidentified and the whole comparison moves. Each
      construction is stated from its definition at STAGE 1 for exactly that reason.
    - >-
      delta DOES NOT CHARGE EVALUATION. An implicit-membership predicate can be short and
      expensive, and KN-OPEN-020's own text names implicit solvers as an open residual that
      delta does not touch. The contract isolates a different gap and says so.
    - >-
      The toy (q, n) cells have #E(F_{q^n}) deviating from q^n by the Hasse interval, which is
      a large relative deviation at that size. The plus-or-minus-0.05 tolerance is set for
      that, and the cells are a CHECK OF A COUNTING IDENTITY rather than an extrapolation.
