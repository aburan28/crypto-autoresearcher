# warnings: this program did not author, approve or execute this work. The
# record exists so EV-ICPERF-988da7's obstruction block can name the experiment
# its values are read from without inventing an identifier.
#
# WHAT A READER MUST NOT CONCLUDE. That this program approved it, that any
# validator or red team here has read it, or that its runs came from this
# harness. The binding to the actual work is BY CONTENT, in EV-ICPERF-988da7's
# external_provenance block.
#
# The one difference from the two earlier external records: this one was run
# under a protocol that was PRE-REGISTERED in the other repository before any
# cell ran (PROTOCOL.md, hash-bound below via the evidence record), with its
# hypotheses, frozen inputs, reference, success and stop conditions, and
# expected classification written down first. Deviations from that protocol
# were recorded before the affected cells ran and are listed here verbatim.
# =============================================================================
experiment:
  id: EXP-ICPERF-3fa3c7
  hypothesis_id: null
  hypothesis_id_note: >-
    Explicitly null, not omitted. The protocol carried its own pair of
    hypotheses (H1: the paper's construction transfers; H0: the paper's
    negative result transfers) and scored them, but neither is a hypothesis
    of this ledger. GOAL-ICPERF-e6b6a4's H-ICPERF-cc4847 and H-ICPERF-7d24fd
    are about engine comparison on the authors' instances and about a
    declared cost model; neither predicts anything this experiment measured,
    and attaching the record to one of them would assert a test that did not
    happen. This is the same restraint EXP-ICPERF-779f11 records.
  version: 1
  title: >-
    EXTERNAL: Hamming ideals (La Scala-Marchesin-Tiwari 2026) as a membership
    ideal for a Frobenius-stable, storage-free, weight-bounded factor base on
    the Koblitz curve K_0 over GF(2^n), and the paper's own ISD-like
    MultiSolve/OracleT search as a point-decomposition oracle, measured
    against the exhaustive (Prange-point) oracle at n = 7, 11, 13, 17, 19
  status: external_completed
  status_note: >-
    `external_completed` for the reason EXP-ICPERF-779f11 gives: the work is
    finished and content-bound, but this ledger's own status vocabulary
    carries an approval and review history this record does not have.
    approved_by is absent because no Coordinator approved it.
  external:
    repository: github.com/aburan28/crypto
    pull_request: "aburan28/crypto#1019"
    merge_commit: 4a5d9d5f0ef7331a350ea6c6cb42bc169d6379ab
    head_commit: 77ce8e722441c02d8f1686f76e35905f7b9a9980
    merge_discipline_note: >-
      Merged with a MERGE COMMIT, not squash, so the 60 underlying commits of
      the head stay reachable from main; verified with
      `git merge-base --is-ancestor` at the time of writing. Hashes were
      computed from origin/main at da8bc0a7648ce2dc1f0ca44142018e1db4a384e9,
      which contains the merge; none of the hashed files changed between the
      merge and that commit. Per CLAUDE.md the sha256 values in
      EV-ICPERF-988da7 are authoritative and the commit is advisory.
    directory: research/hamming_ideal_pdp_20260930/
    protocol: research/hamming_ideal_pdp_20260930/PROTOCOL.md
    result: research/hamming_ideal_pdp_20260930/RESULT.md
    note: research/notes/index-calculus/RESEARCH_HAMMING_IDEAL_PDP.md
    solver: research/hamming_ideal_pdp_20260930/hamming_pdp/  (standalone Rust crate, no dependencies)
    continuous_integration: >-
      .github/workflows/hamming-ideal-pdp.yml in that repository builds the
      crate, runs a brute-force self-test of the truncated-F4 verdicts on
      1,200 random Boolean systems (three seeds), replays the n = 7 cell
      against the frozen JSONL and requires it byte-identical on the counted
      fields (calls, xor_words, tame depths, manifest), and re-derives
      results/main/summary.json and diffs it against the committed file.
  objective: >-
    Test whether the Hamming-ideal construction of La Scala, Marchesin and
    Tiwari (KN-LIT-316c94) gives the point decomposition problem on
    K_0 : y^2 + xy = x^3 + 1 over GF(2^n) something the decomposition note in
    the same repository (RESEARCH_ECC2K130_DECOMPOSITION.md section 6) said
    prime n forbids: a Frobenius-stable factor base with an ALGEBRAIC
    membership test. In a normal basis {alpha^(2^i)} of GF(2^n) Frobenius is a
    cyclic shift of coordinates, so F_w = {P : wt_NB(x(P)) <= w} is
    pi-stable at every n, needs no storage (membership is a popcount), and by
    the paper has a membership ideal with O(n) auxiliary variables of degree
    at most floor(log2 n) + 1 (FC-Hamming) or quadratic with O(n log n)
    variables (C- and QFC-Hamming). The experiment measures whether that ideal
    makes a USEFUL decomposition oracle: Semaev's S_3 Weil-descended in
    normal-basis coordinates (n quadrics in 2n variables at m = 2) plus two
    copies of the Hamming ideal, solved by the paper's own MultiSolve with
    OracleT and a degree-truncated Boolean F4 (GroebnerSafe) in place of a
    Groebner engine with a wall-clock timeout, against the exhaustive oracle
    (for each P_1 in F test x(R - P_1) in F), which is the Prange point of
    this setting.
  hypotheses_as_registered:
    H1: >-
      With the weight constraint encoded as a C-, FC- or QFC-Hamming ideal
      and S_3 Weil-descended in normal-basis coordinates, MultiSolve answers
      "is R = P_1 + P_2 with P_i in F_w" correctly on every target, and the
      number of GroebnerSafe calls per target grows more slowly than the
      exhaustive candidate count |F_w| as n grows.
    H0: >-
      Tame calls occur only when nearly all coordinates of one summand have
      been assigned, so the oracle is the exhaustive oracle with a Groebner
      computation bolted onto each candidate, and the calls-per-target
      exponent in |F_w| is >= 1.
    expected: H0. The measurement decides.
  inputs:
    curve: "K_0 : y^2 + xy = x^3 + 1 over GF(2^n), a = 0, b = 1, cofactor 4"
    field_degrees: "n in {7, 11, 13, 17, 19}; 7 is a smoke size, the four primes 11..19 are the fit"
    reduction_polynomial: >-
      lowest-integer irreducible of degree n with constant term 1 (the
      find_irreducible convention of that repository's
      scripts/ecc2k130_point_decomposition.py)
    normal_basis: >-
      {alpha^(2^i)} for the smallest integer-encoded alpha whose conjugates
      are independent; recorded in every manifest; Frobenius = cyclic shift
      is self-checked at construction
    summands: m = 2 (one S_3 link; the quadratic case)
    weight_base: "F_w = {P : wt_NB(x(P)) <= w}, w = 2 at every n (see deviations)"
    subspace_base: >-
      random F_2-subspace V of dimension l = ceil(log2 #{x : wt(x) <= w}),
      seed-derived; F_V = {P : x(P) in V}; the repository's existing oracle
      shape, run through the SAME solver as the baseline row
    targets: >-
      seeds 0..23 at n <= 13 (24 targets) and 0..7 at n >= 17 (8 targets);
      even seeds planted (R = P_1 + P_2, P_i uniform in F_w), odd seeds
      uniform in the odd-order subgroup; EVERY target labelled by the
      exhaustive oracle for each base before the algebraic oracle ran
    encodings:
      - "SUB: subspace base, polynomial-basis coordinates (the repository's oracle shape, baseline)"
      - "MONO: control -- all degree-(w+1) monomials of each summand's coordinates, C(n, w+1) generators, the monomial ideal the paper's lifted presentations exist to avoid"
      - "C: C-Hamming, convolution presentation, quadratic, O(nL) auxiliary variables (paper Theorem 3.5)"
      - "FC: FC-Hamming, Lucas-factorised, O(n) auxiliary variables, degree <= L + 1 (paper Theorem 4.5)"
      - "QFC: QFC-Hamming, Lucas products given their own variables, quadratic, O(nL) variables (paper Section 5)"
    digit_constraints: >-
      wt <= w as the digit condition on the root elementary-symmetric-function
      variables: y_(2^k) = 0 for 2^k > w, plus the algebraic normal form of
      [sum_(2^k <= w) t_k 2^k > w] when w + 1 is not a power of two
      (w = 2: y_1 y_2 = 0)
    monomial_order: >-
      degrevlex, summand coordinates first (summand 1 then 2, decreasing
      index), auxiliary variables after, in tree order -- the paper's
      XRev-BitFold
    solver: >-
      MultiSolve with OracleT; GroebnerSafe = Boolean F4 truncated at pair
      degree d = 6, Gebauer-Moeller criteria, field pairs, eager linear
      propagation, with a budget of 2^28 row-word XORs per call and a
      2^26-word matrix cap in place of the paper's 20-minute timeout; tame
      iff the basis contains 1 or reduces to linear polynomials with at most
      2^12 common zeros, every zero verified against the original system and
      lifted to points; a direct check of the original system at fully
      assigned leaves makes completeness independent of the budget
    branching: >-
      summand-1 coordinates in index order, then summand 2; b = 0 before
      b = 1; a summand whose assigned ones reach w has its remaining
      coordinates forced to 0 (the paper's residual-weight bound); stop at
      the first verified decomposition
    per_target_cap: 2^13 GroebnerSafe calls; exceeding it is a retained timeout
  deviations_note: >-
    All four deviations below were recorded in RESULT.md before the affected
    cells ran, for runtime, not in response to any result. They are copied
    here so a reader of this ledger sees the run as executed, not as
    registered.
  deviations_from_protocol:
    - registered: w = 3 at n = 17, 19
      as_run: w = 2 at every n
      reason: >-
        with w = 3 a full tree has sum_(j<=3) C(19, j) = 1160 leaves at
        n = 19; at the observed cost per wild call that is days per cell
    - registered: 24 targets at every n
      as_run: 8 targets (seeds 0..7) at n = 17, 19
      reason: same
    - registered: tau = 2^30 XORs per call
      as_run: tau = 2^28 XORs per call plus a 2^26-word matrix cap
      reason: >-
        a wild call at 2^30 cost 15-20 s at n = 7 already; the budget sweep
        (results/tau/) measures the dependence
    - registered: none
      as_run: >-
        eager linear propagation and a direct check at fully assigned leaves
        inside GroebnerSafe
      reason: >-
        added after the first n = 19 test dropped a planted solution when the
        budget ran out at a leaf; the leaf check makes completeness
        independent of the budget
  controls:
    - >-
      Exhaustive oracle labels every target for every base BEFORE the
      algebraic oracle runs; correctness is oracle answer = label on every
      target and a verified decomposition on every "yes".
    - >-
      SUB row: the repository's existing subspace oracle shape run through
      the same MultiSolve/GroebnerSafe, so that solver strength is held fixed
      across the comparison.
    - >-
      MONO row: the naive monomial membership ideal with C(n, w+1)
      generators, so that the paper's lifted presentations are compared with
      the thing they are designed to replace.
    - >-
      Budget sweep (results/tau/): the same four n = 11 targets under 2^26,
      2^28 and 2^30 XORs per call, so the dependence of the tame depth on the
      engine budget is bounded rather than assumed.
    - >-
      Brute-force self-test of the truncated F4's tame/wild/inconsistent
      verdicts on 1,200 random 4-8 variable Boolean systems, run in CI.
  independent_variables:
    - field degree n
    - encoding (SUB, MONO, C, FC, QFC)
    - per-call XOR budget (sweep only)
  metrics:
    primary:
      - GroebnerSafe calls per target (the paper's unit), next to the exhaustive candidate count |F|
      - mean tame depth: number of summand coordinates fixed before GroebnerSafe returned a linear basis
      - fitted exponent of mean calls per target in |F_w| over n = 11, 13, 17, 19
    secondary:
      - elimination row-word XORs per call and per target (uncalibrated against curve operations)
      - budget-wild calls (wild verdicts from the budget or matrix cap rather than a completed non-linear basis)
      - wall time per target, as a practicality note only
  success_criterion: null
  success_criterion_note: >-
    Null in THIS ledger's sense: no Coordinator set a criterion. The protocol's
    own registered criterion for H1 was: (1) correctness on every target of
    every cell; (2) mean tame depth at most n - 3 on the weight cells at
    n >= 13; (3) the exponent of mean calls per target in |F_w|, fitted over
    n = 11, 13, 17, 19, below 0.8 for at least one of C, FC, QFC. Otherwise H0
    stands. It also listed what was inadmissible: changing w, d, tau, seeds or
    branching order after seeing results; dropping timed-out targets from the
    means; comparing first-solution cost against full-scan cost.
  falsification_criterion: null
  falsification_criterion_note: >-
    See success_criterion_note: H1's conditions (2) and (3) are the
    falsification target for H0, and were met by no encoding.
  replication:
    seeds: "0..23 at n <= 13; 0..7 at n >= 17"
    independent_instances: 0
    independent_instances_note: >-
      Zero in this program. In the other repository the n = 7 cell is
      replayed in CI on every push and required byte-identical on the
      counted fields; that is a reproducibility check of the frozen record,
      not an independent replication of the finding.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: null
    maximum_runs: null
    budget_note: >-
      Null because this program set no budget for work it did not commission.
      The other repository's runner used 4 parallel jobs on a 4-vCPU x86_64
      container; the whole campaign including the sweep took on the order of
      a day of wall time, and one container reclamation mid-campaign was
      survived by resume support (the solver unchanged, the n = 7 replay
      byte-identical).
  stopping_rules:
    - >-
      A correctness disagreement stops the run until the bug is found (a bug
      in the code, never a result). Two data-handling defects were found this
      way before any frozen record was used: a manifest line that wrote two
      fields into each other's slots (the campaign was restarted from scratch
      on the fixed binary), and a summary whose float last digits differed
      between hosts (now rounded to nine decimals).
    - >-
      A cell whose targets exceed the per-target cap on more than half of the
      targets is marked timeout and the next larger n is not run for that
      encoding. No cell hit this rule: zero timeouts anywhere.
  invalidation_rules:
    - any change to w, d, tau, seeds or branching order after seeing results
    - dropping timed-out targets from the means
    - comparing the algebraic oracle's first-solution cost against the exhaustive oracle's full-scan cost
  required_artifacts:
    - research/hamming_ideal_pdp_20260930/results/main/<n>_<ENC>.jsonl  (manifest line then one record per target)
    - research/hamming_ideal_pdp_20260930/results/main/summary.json  (derived; re-derived and diffed by CI)
    - research/hamming_ideal_pdp_20260930/results/main/manifest.json  (source and binary sha256, cells, host)
    - research/hamming_ideal_pdp_20260930/results/tau/*.jsonl and TABLE.md  (budget sweep)
    - research/hamming_ideal_pdp_20260930/RESULT.md  (verdict, deviations, tables, decision)
  scope:
    claim_tier: toy
    field_degrees: >-
      n = 7, 11, 13, 17, 19. Nothing at any cryptographic n; in particular
      nothing at 83 (the other repository's own ECC2K-130 confidence gate) or
      131.
    summands: m = 2 only. Neither m >= 3 nor the paper's GBDecode outer loop was run.
    weight: w = 2 only, at every n.
    solver: >-
      the producing session's own truncated Boolean F4, not Magma, M4GB or
      msolve. The budget sweep bounds the dependence on the engine at n = 11
      (16x the budget lowers the tame depth by one to two levels); it does
      not remove it.
    what_it_does_not_touch:
      - the security of any curve, in either direction
      - >-
        any end-to-end index-calculus cost: no S, no rho ratio, no relation
        matrix, no full DLP. RESULT.md labels the whole record a STAGE
        DIAGNOSTIC of one oracle.
      - >-
        the free-oracle floor and the orbit-collapse arithmetic of the
        decomposition note (sections 5.3 and 6), which are derived for any
        base of this shape and are unchanged by the experiment
  review_status:
    independent_review_in_this_program: none
    external_automated_review: >-
      Cursor Bugbot reviewed the producing pull request at its final head and
      posted a "Low Risk" summary; the session that produced the work does not
      record any defect finding from it, and none is claimed here. The two
      material defects (manifest field swap, host-dependent float digits) were
      found by the producing session itself before any frozen record was used
      and are disclosed in RESULT.md. This is not this ledger's independence
      check and is not presented as one.
  assigned_to: null
  assigned_to_note: >-
    Nobody in this program. The work was done in the other repository by a
    single agent session at the user's request.
  owner: coordinator
  created_at: '2026-09-30'
