# =============================================================================
# EXP-SEMBIN-d0d73b -- VERSION 1 (APPROVED by DEC-20261002-3b2d41) frozen
# contract for H-SEMBIN-15e815: Table-3 recharge / Assumption-1 relocation
# (Stages 0-3). Source IDEA-20260913-9c54f9 under RQ-SEMBIN-fa2e3f /
# GOAL-SEMBIN-5078bc.
#
# Cost-model re-derivation. ZERO RUNS in this design packet. Stages 0-3
# authorized for executor TASK-20261002-e71399. No Magma/Sage/AUXIN/Bedrock.
# NO curve attack. NO exponent.
# =============================================================================
experiment:
  id: EXP-SEMBIN-d0d73b
  hypothesis_id: H-SEMBIN-15e815
  question_id: RQ-SEMBIN-fa2e3f
  source_idea: IDEA-20260913-9c54f9
  goal_id: GOAL-SEMBIN-5078bc
  version: 1
  title: >-
    Stage-0 Table-3 baseline reproduction plus Stages 1-3 integer-k recharge,
    per-solve cost-law fit, (time, memory) frontier, and vOW / Petit-Quisquater
    controls under named degree-growth models
  status: approved
  approved_by: DEC-20261002-3b2d41
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-3b2d41
    composing_decision: DEC-20261002-3b2d41
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null, including
      singular success_criterion and falsification_criterion). Approval does
      not assert the hypothesis is true. Stages 0-3 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2, 3]
    scientific_execution_authorized_note: >-
      Stage 0 freezes Table-3 reproduction residuals and
      preregistered-predictions.json (blocking). Stage 1 recharges at integer
      k with m re-optimised and records crossover n* under each degree model.
      Stage 2 fits nested per-solve laws on the 21 Table 1-2 timings with
      bootstrap intervals and stated degrees of freedom. Stage 3 builds the
      (time, memory) frontier, vOW comparison at matched budgets, nearby-object
      Petit-Quisquater control, and null cost-law control; RESULTS.md names
      exactly one O-* label. Pure Python (+ optional numpy). No Magma/Sage.
      No AUXIN. No Bedrock. No deployed-curve solve.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether Semaev 2015's FIPS conclusion is robust once Table 3 is
    recharged at integer k under named degree-growth models with a fitted
    per-solve law and a memory column — i.e. whether Assumption 1's diagonal
    form is load-bearing — and deliver exactly one O-* label from
    H-SEMBIN-15e815.

  class: cost_model
  class_note: >-
    Cost-model / sensitivity analysis (target-result-profile concrete-cost
    table class). Relocates the load-bearing assumption; supplies memory
    under degree-growth. Not an exponent-moving breakthrough. Distinct from
    EXP-SEMBIN-f4a17b / 2c40bb (memory under d ≡ 4 held fixed).

  scope:
    included:
      - >-
        Stage 0 (ZERO COMPUTE beyond tiny Python). Reproduce Table 3 at
        d ≡ 4, non-integer k = n/m, omega = 3 against
        inputs/SEMAEV-2015-310/tables.yaml; write stage0/table3-residuals.json
        and stage0/preregistered-predictions.json freezing degree models,
        fit ladders, memory formulas, crossover definition, vOW constants,
        and O-* decision table BEFORE Stage 1.
      - >-
        Stage 1. Integer-k recharge: k = ceil(n/m), m re-optimised over
        [2, floor(n/2)], for each degree model in
        {4, 4+log2(k/20), 4+(k-20)/3, 4+sqrt(max(k-20,0)), fitted_placeholder};
        record stage-1/2 times, total, crossover n* vs 2^{n/2}, and the
        pinned-k_0 escape surface; write stage1/*.json.
      - >-
        Stage 2. Nested fits on the 21 Table 1-2 timings: time = C n^p,
        time = C N^p, time = C 2^{a k} n^{b}; cell-level bootstrap;
        explicit DoF per ladder (4 / 3 / 2 points); write stage2/fits.json.
      - >-
        Stage 3. (time, memory) frontier at n ∈ {163,233,283,310,409,571}
        over m ∈ [2, floor(n/2)]: relation store, dense and sparse working
        sets, max; memory-minimising m; vOW comparison at matched budgets
        {2^{40}, 2^{50}, 2^{60}, 2^{70}, 2^{80}} bits; Petit-Quisquater
        nearby-object control; null cost-law control; unit disclosure
        (field vs group ops); RESULTS.md with exactly one O-* label.
    excluded:
      - Magma/Sage/cypari2/AUXIN provisioning as the success path.
      - Amazon Bedrock.
      - Measuring solving degree d(.) (owned by IDEA-20260913-9ba7fc /
        EXP-SEMBIN-35bf67).
      - Re-litigating EXP-SEMBIN-f4a17b / 2c40bb rulings under d ≡ 4.
      - Editing IDEA-20260913-9c54f9 claim text.
      - Editing shared GOAL-SEMBIN-5078bc.yaml or GOAL-SEMBIN-cbf422.yaml.
      - Claiming break / exponent / FIPS-curve attack from this contract.
      - Treating infra failure as mathematical evidence against C1–C4.
      - Running any algebraic solve or curve instantiation.
      - Averaging disagreeing dual independent arithmetic checks.

  inputs:
    proposal: ledger/proposals/IDEA-20260913-9c54f9.yaml
    hypothesis: ledger/hypotheses/H-SEMBIN-15e815.yaml
    question: ledger/questions/RQ-SEMBIN-fa2e3f.yaml
    frozen_source: inputs/SEMAEV-2015-310/
    tables_fixture: inputs/SEMAEV-2015-310/tables.yaml
    paper_fulltext: inputs/SEMAEV-2015-310/paper_fulltext.md
    lit_semaev: knowledge/literature/KN-LIT-fa346d.md
    lit_galbraith_thread: knowledge/literature/KN-LIT-e77232.md
    open_memory: knowledge/open-problems/KN-OPEN-86e7e1.md
    prior_memory_exp: experiments/EXP-SEMBIN-f4a17b/specification.yaml
    prior_vow_exp: experiments/EXP-SEMBIN-2c40bb/specification.yaml
    vow_technique: knowledge/techniques/KN-TECH-006.md
    sibling_degree_surface: ledger/proposals/IDEA-20260913-9ba7fc.yaml

  controls:
    - name: table3_baseline_gate
      description: >-
        No derived table is reported unless Stage 0 reproduces every frozen
        Table 3 cell within 0.7% and n = 571 stage-1 within 0.01 bit of
        2^{186.3}. Failure → O-BASELINE-FAIL.
    - name: nearby_object_petit_quisquater
      description: >-
        Same frontier machinery applied to Petit-Quisquater's published
        n > 2000 threshold from parameters as relayed in the frozen paper's
        introduction; must recover that threshold. Failure → O-NEARBY-FAIL.
    - name: null_cost_law
      description: >-
        Deliberately wrong law (time constant in every parameter) through the
        same pipeline must produce a threshold that contradicts the paper's
        n > 310. Failure → O-ARTIFACT.
    - name: unit_disclosure
      description: >-
        Every row states whether "operation" means field or group operation;
        rho is group ops, eq. (15) is field ops — factor of order n disclosed.
    - name: dof_honesty
      description: >-
        Every fit states its degrees of freedom (4 / 3 / 2 point ladders);
        a 3-point 3-parameter fit is labelled not-a-test.
    - name: dual_arithmetic
      description: >-
        Stage 0 and Stage 3 memory/time figures checked by a second independent
        arithmetic path (or separately derived closed form); disagreement →
        O-ARTIFACT, never averaged.
    - name: prior_memory_citation
      description: >-
        Stage 3 cites EXP-SEMBIN-f4a17b / 2c40bb as the d ≡ 4 memory prior;
        this contract's novelty is degree-growth sensitivity, not a first
        memory column.
    - name: assumed_vs_measured_labels
      description: >-
        Every input in every table cell is labelled assumed | measured | cited.

  independent_variables:
    - name: stage
      levels: [0_baseline, 1_integer_k, 2_fits, 3_frontier]
    - name: n
      levels: [163, 233, 283, 310, 350, 400, 409, 450, 500, 571]
    - name: m
      levels: integer range [2, floor(n/2)]
    - name: omega
      levels: [2.376, 3.0]
    - name: omega_prime
      levels: [2.0, 3.0]
    - name: block_solver
      levels: [on, off]
    - name: degree_model
      levels:
        - constant_4
        - log2_growth
        - linear_kosters
        - sqrt_growth
        - fitted_exp_k
    - name: k_reading
      levels: [noninteger_n_over_m, ceil_n_over_m]
    - name: storage_reading
      levels: [dense, sparse_semaev]

  metrics:
    primary:
      - name: table3_max_rel_residual
        unit: fraction
        definition: Max relative residual of Stage-0 reproduction vs frozen Table 3.
      - name: crossover_n_star
        unit: integer
        definition: Smallest n where recharged method time < 2^{n/2} under a named model.
      - name: pinned_k0_beats_rho_at_571
        unit: boolean_per_model
        definition: Whether EXISTS k_0 such that pinned-k time at n = 571 < 2^{285.5}.
      - name: fit_exponent_N
        unit: dimensionless
        definition: Fitted p in time = C N^p with stated interval and DoF.
      - name: fit_exponent_a_k
        unit: dimensionless
        definition: Fitted a in time = C 2^{a k} n^{b} with stated interval and DoF.
      - name: memory_floor_bits
        unit: log2_bits
        definition: min_m max(relation_store, working_set) at n = 571 per storage reading.
    secondary:
      - name: integer_k_stage1_correction_bits
        unit: bits
        definition: log2(noninteger stage-1) − log2(integer-k stage-1) at n = 571, m = 12.
      - name: vow_time_at_matched_memory
        unit: log2_group_ops
        definition: vOW time at each matched memory budget.
      - name: affected_safe_scope
        unit: enum_per_budget_per_model
        definition: Which FIPS n ∈ {163,233,283,409,571} are affected vs safe.
      - name: wall_clock_seconds
        unit: seconds
        definition: Measured wall clock (reported; not a pre-committed claim).
      - name: peak_rss_bytes
        unit: bytes
        definition: Peak RSS of the derivation process.
      - name: termination_reason
        unit: enum
        definition: completed | timeout | crash | O-IMPEDIMENT.

  heuristic_under_test: H1; H2

  preregistered_prediction:
    quantity: >-
      Stage 0 reproduces Table 3; Stage 1 shows pinned-k escape under every
      named degree-growth model at n = 571 with n* ≥ 330 whenever d grows in k;
      Stage 2 fit upper interval on N-exponent below 9.5 and a ≥ 2; Stage 3
      sparse memory floor ≥ 2^{69} bits; nearby-object and null controls pass.
    formula: >-
      stage1 = m! · 2^{k} · C(k) with k = ceil(n/m) (integer) or n/m
      (baseline); stage2 = 2^{k · omega'}; C_const = n^{4 omega} (or
      [n(m-1)]^{4 omega} if block solver off); C_log = n^{4 omega} ·
      poly(d(k)) with d(k) = 4 + log2(k/20); C_lin with d(k) = 4 + (k-20)/3;
      relation_store = 2^{k} · (2n + m k) bits; dense_ws ≈ [sum_{i≤4} C(N,i)]^2
      bits; sparse_ws ≈ (n m)^4/24 · n^3/m bits; N = (m-2)n + k m.
    source: >-
      ledger/proposals/IDEA-20260913-9c54f9.yaml predictions + proof_search_map;
      inputs/SEMAEV-2015-310/tables.yaml; frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance: >-
    Analytical extrapolation to FIPS n ∈ {163..571} from published formulas
    and 21 toy timings (n ≤ 21). Transfer assumptions explicit: degree models
    are hypotheses; H2 sparse formulas assumed; no claim that any n > 45
    instance was solved. Toy fits do not measure d(.) at cryptographic scale.

  replication:
    stage0_note: Deterministic arithmetic; dual independent check required.
    stage2_bootstrap_resamples: 1000
    replication_plan: >-
      Stage 0–1 exhaustive over the frozen (n,m,model) grid. Stage 2 uses
      cell-level bootstrap with stated DoF. Stage 3 dual arithmetic on
      frontier extrema. maximum_runs = 1 scientific derivation package
      (re-runs only on infrastructure failure under amendment).

  budget:
    wall_clock_seconds: 3600
    memory_gb: 1
    maximum_runs: 1
    note: >-
      Advisory. Scientific grid above is frozen; CPU estimates are not
      rationing gates. RSS/wall-clock cap → O-IMPEDIMENT, never a C1–C4 result.

  stopping_rules:
    - SR-1. Stage 0 freeze (residuals + preregistered-predictions.json) before any Stage-1 derived table.
    - SR-2. If Stage 0 Table-3 gate fails → O-BASELINE-FAIL; stop before Stages 1–3 derived claims.
    - SR-3. If dual arithmetic disagrees → O-ARTIFACT; do not average.
    - SR-4. If nearby-object or null-law control fails → O-NEARBY-FAIL / O-ARTIFACT; still emit partial residuals.
    - SR-5. Budget abort / crash → failed_infrastructure / O-IMPEDIMENT; never negative evidence against C1–C4.
    - SR-6. Do not expand into algebraic degree measurement (9ba7fc's lane).

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze.
    - Reporting derived tables after a failed Stage-0 baseline gate.
    - Averaging disagreeing dual arithmetic checks.
    - Using Magma/Sage/AUXIN/Bedrock as the success path.
    - Claiming FIPS-curve break or exponent from this contract.
    - Treating missing numpy as falsification of C1–C4 (use stdlib or O-IMPEDIMENT).
    - Editing IDEA-20260913-9c54f9 or GOAL-SEMBIN-5078bc.yaml.
    - Quietly dropping the DoF / assumed-vs-measured labels.

  success_criterion: >-
    Stages 0–3 complete with artifacts present; RESULTS.md names exactly one
    of O-RECHARGED, O-C1-FALSE, O-C2-STABLE, O-C3-LAW-CONSISTENT,
    O-C4-FLOOR-FALSE, O-BASELINE-FAIL, O-NEARBY-FAIL, O-ARTIFACT,
    O-IMPEDIMENT; Stage-0 Table-3 residuals and preregistered-predictions.json
    frozen before Stage 1; every primary metric for executed stages recorded;
    dual arithmetic recorded on Stage 0 and Stage 3 extrema; nearby-object and
    null-law controls executed or named O-NEARBY-FAIL / O-ARTIFACT;
    assumed-vs-measured labels present on every reported table cell.

  falsification_criterion: >-
    C1 falsified (→ O-C1-FALSE) iff pinning k at every constant k_0 in the
    Stage-1 grid fails to beat 2^{n/2} at n = 571 under every named degree
    model. C2 falsified (→ O-C2-STABLE) iff crossover n* stays within 5 of 310
    under every model with d strictly increasing in k. C3 falsified
    (→ O-C3-LAW-CONSISTENT) iff the fitted N-exponent interval covers 9.5.
    C4 falsified (→ O-C4-FLOOR-FALSE) iff max(relation store, working set) at
    n = 571 admits a frontier point below 2^{60} bits under BOTH dense and
    sparse readings. Baseline falsified (→ O-BASELINE-FAIL) on Stage-0 Table-3
    mismatch. Modelling falsified (→ O-NEARBY-FAIL / O-ARTIFACT) if
    Petit-Quisquater nearby-object control fails or the null cost law fails to
    contradict the paper's threshold.

  required_artifacts:
    - stage0/table3-residuals.json
    - stage0/preregistered-predictions.json
    - stage0/dual-arithmetic-check.json
    - stage1/integer-k-recharge.json
    - stage1/pinned-k0-surface.json
    - stage2/fits.json
    - stage3/frontier.json
    - stage3/vow-comparison.json
    - stage3/nearby-object-pq.json
    - stage3/null-cost-law.json
    - RESULTS.md
    - runs/<RUN-SEMBIN-*>/manifest.yaml

  protocol_amendments: []
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
