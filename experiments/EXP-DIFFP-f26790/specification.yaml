experiment:
  id: EXP-DIFFP-f26790
  version: 1
  title: >-
    Replicate the per-instrument forced-cell re-admission control with an INDEPENDENT
    implementation, and build the consistent-pair flag-and-dv family: recompute the forcing
    predicate under each instrument's own projection, adjudicate the cells it re-admits, and
    construct the one named repair of null family (e)'s substantive retirement -- at census
    size zero
  status: approved
  status_note: >-
    APPROVED BY DEC-20260826-5aaddc, WHICH IS FILED AT ledger/decisions/DEC-20260826-5aaddc.yaml
    IN THE SAME OPENING PASS AS THIS CONTRACT, UNDER AN ID THE DRIVING SESSION MINTED AND
    `--check`ed FREE. THE AUTHORING COORDINATOR SUBAGENT HAS NO SHELL AND MINTED NOTHING.
    ONE CONDITION REMAINS AND IT IS THE DRIVING SESSION'S: TASK-20260826-82c660 MUST NOT BE
    DISPATCHED UNTIL DEC-20260826-5aaddc IS COMMITTED. A filed record that exists only in a
    working tree is not yet the approval, and a message saying a contract is approved is a
    pointer and never the approval. This is the mechanism BATCH-efcae7 pass 1 used for
    DEC-20260824-ad098e and BATCH-145531 used for DEC-20260825-1dc43c.
    FROZEN ON WRITING. No term below may be changed after a run of this contract exists except
    by a versioned protocol_amendment recorded as such.

  goal_id: GOAL-DIFFP-84d641
  batch_id: BATCH-171407
  question_id: RQ-DIFFP-a5c483
  frozen_by_task: TASK-20260826-fc9e5e
  frozen_at: '2026-08-26'
  assigned_to: executor
  executor_task: TASK-20260826-82c660
  approved_by: 'coordinator, DEC-20260826-5aaddc, BATCH-171407 opening'

  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL, AND THE IDENTIFIER THAT COULD HAVE FILLED IT WAS ALLOCATED AND IS
    RECORDED AS UNUSED RATHER THAN DROPPED. H-DIFFP-02525b was minted and `--check`ed free by
    the driving session and offered to this opening. THIS OPENING DECLINES TO MINT A HYPOTHESIS
    RECORD, on the merits and not for want of an identifier, and the argument is in
    DEC-20260826-5aaddc `the_disposition_of_H_DIFFP_02525b`. In one line: the falsifiable
    content of this batch is already carried by the PUBLICLY READABLE, FROZEN pre-registered
    predictions P-A..P-D below, which round 3 demonstrated are a stronger instrument than a
    sealed or ledger-side guess -- two of EXP-DIFFP-04082e's own pre-registrations were REFUTED
    and reported by the party they cost, and both reviewers could see that independently. A
    hypothesis record would add a status field to move without adding falsifiability, and the
    claim ceiling is `analyzed`. BATCH-145531 minted no hypothesis either and its close said so.
    H-DIFFP-02525b IS RECORDED AS ALLOCATED-AND-NEVER-SPENT AND MAY NOT BE USED FOR ANY OTHER
    RECORD, by the precedent DEC-20260824-257f35 set for DEC-20260825-7c7d58.

  prospective_amendments: []
  prospective_amendments_note: >-
    NONE. AMD-20260824-DIFFP-ACQ-1 stands unchanged and in force and is not amended by this
    contract: Tier A refused by every route, TIER B BLOCKED PENDING A GOAL-MD5-001 DECISION --
    BLOCKED, NOT CLOSED, with its named unblocking route intact -- Tier C permitted and not
    exercised. No task under this contract holds web_search and no acquisition of any tier is
    authorised. THE MD5 LANE IS BLOCKED, NOT CLOSED, and no record produced under this contract
    may state or imply that the MD5 arm is exhausted, deprioritised on the merits or screened
    out.
    ONE VERSIONED protocol_amendment IS OWED BY THIS CAMPAIGN AGAINST A DIFFERENT CONTRACT --
    EXP-DIFFP-04082e's CTL-GRAPH-NULL known answer, specified in full in DEC-20260824-257f35
    `protocol_amendment_owed`. IT IS NOT WRITTEN HERE AND IS NOT DISCHARGED BY THIS CONTRACT:
    it amends a contract this batch does not own the right to edit, it requires an identifier
    this opening does not hold, and it is routed in DEC-20260826-5aaddc `obligations_carried`
    so that it cannot be lost.

  objective: >-
    ONE EXECUTOR TASK, TWO ARMS, FOUR GATED RUNS, AT CENSUS SIZE ZERO, EXECUTING THE GOAL
    HEAD'S SINGLE RECORDED next_action WITHOUT RE-LITIGATING IT.
    ARM (a) -- RECOMPUTE THE FORCING PREDICATE PER INSTRUMENT. A cell is FORCED FOR INSTRUMENT
    I if and only if, under I's projection COMPOSED WITH the row's deletion, the projected key
    STILL RETAINS a component that determines the deleted one BY A DERIVATION-BACKED EDGE.
    Cells forced for I are excluded FOR I; cells NOT forced for I are ADJUDICATED FOR I. The
    arm REUSES the six cells BATCH-145531 excluded as forced_by_the_graph and the draw sets
    already built for the three constructible families d_message_difference, d_step_delta and
    d_block_index. IT CONSTRUCTS NOTHING NEW. It is A REPLICATION WITH AN INDEPENDENT
    IMPLEMENTATION of a control that has been run EXACTLY ONCE, by one session, with one
    implementation, returning 1 of 30 (RT-J8-4).
    ARM (b) -- BUILD THE CONSISTENT-PAIR FLAG-AND-dv FAMILY. Perturb the flag and the dv
    TOGETHER so that the pair stays MUTUALLY CONSISTENT -- for instance replacing the dv by a
    non-codeword AND setting the flag False -- which probes whether the instrument separates
    in-code from out-of-code objects at all, and which is THE ONLY NAMED REPAIR of null family
    (e)'s substantive retirement (DEC-20260824-257f35 R3-J7, rank 8 folded into rank 1).
    THE DELIVERABLE IS A PER-INSTRUMENT, PER-PRIMITIVE CELL TABLE WITH ITS DENOMINATORS AND
    EVERY EXCLUSION'S FORCING EDGE NAMED -- NEVER A PASS AND NEVER A BARE FRACTION.

  what_this_contract_explicitly_does_not_do: >-
    IT DOES NOT RE-RUN BATCH-145531 AND CHANGES NO COMMITTED NUMBER. IT ACQUIRES NOTHING,
    SEARCHES NOTHING OVER EITHER DIFFERENCE SPACE, MOVES NO EXPONENT AND CLAIMS NONE. IT DOES
    NOT REPAIR THE INSTRUMENT: VD-3, VD-4, the {E4}/{E5} zero-image result, OBJ-3, OBJ-4 and
    OBJ-10's repair half STAND OPEN AND UNREPAIRED, exactly as batches 1, 2 and 3 left them. It
    does not independently reconstruct the four unreplicated survivors O-D, O-C, O-C-prime and
    O-C-double-prime, whose revisit condition is this contract completing. It does not relocate
    the eleven pre-existing run directories of batches 1 and 2. It mints no IDEA-* identifier
    from TASK-20260824-873dc9's still-gated proposal set. AND IT DOES NOT CLOSE THE MD5 LANE.

  # ==================================================================
  inputs:
    - >-
      The committed adjudicator package under harness/diffpath/ INCLUDING adjudicator.py,
      controlpower.py, equivalence.py, pathobj.py, primitives.py and depgraph.py, plus
      harness/__init__.py and harness/runner.py -- READ-ONLY INPUTS. Recompute their digests
      yourself under CTL-FROZEN-4; any digest quoted in a committed record was measured by
      another session and is not this contract's measurement.
    - >-
      harness/diffpath/depgraph.py IS AN INPUT AND IS READ. It carries the committed forcing
      rule, the six forced cells, the family constructors and the draw sets that arm (a)
      REUSES. Reading the committed module is not a blindness violation; it is the substrate.
      WHAT IS FORBIDDEN IS SOMETHING ELSE ENTIRELY -- see H-1.
    - >-
      The EIGHT declared seeds inherited byte-identically from EXP-DIFFP-4b165f through
      EXP-DIFFP-04082e, with the top-level seed 84064107. NO NINTH SEED EXISTS OR MAY BE
      CREATED, and a ninth seed appearing anywhere is a STOP.
    - >-
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-e9d21a/constructions/rt_instruments.py
      and constructions/j8_results.json -- O-E IS REUSED FROM HERE, NOT REBUILT (IR-11). This
      is BATCH-efcae7's red-team directory, a CLOSED batch whose reviews are already composed
      into EV-DIFFP-b16b01 and DEC-20260824-c5bb72. It is NOT the forbidden path of H-1.
    - >-
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-145531/tasks/TASK-20260824-68ba87/offdiagonal-matrix-result.json
      and dependency-graph-result.json -- the six forced cells, their forcing edges, the 9/27
      exclusion split and the four derived-and-witnessed edges E1..E4. These are the PRODUCER's
      committed artifacts of a closed batch and are read.
    - >-
      ledger/evidence/EV-DIFFP-afd96c.yaml and ledger/decisions/DEC-20260824-257f35.yaml -- the
      obstruction block, the composed ruling, the ranking, the corrections owed and the
      statement of RT-J8-4 that this contract replicates. THE STATEMENT IS READ; THE
      IMPLEMENTATION IS NOT.
    - >-
      The corrections CORR-20260824-cc2d27, -e0088c, -c1c8b1, -a6fc43, -ad7f2c and
      CORR-20260826-f170d2 -- read them BEFORE quoting any integer from a batch-1, batch-2 or
      batch-3 artifact.
    - >-
      harness/runner.py -- every charged run goes through run_wrapped with an armed deadline,
      into experiments/EXP-DIFFP-f26790/runs/<RUN-ID>/.

  # ==================================================================
  the_forcing_predicate_stated_formally_so_it_can_be_implemented_from_the_statement:
    the_statement: >-
      LET K BE THE STRICT MEMBERSHIP KEY, DERIVED AT RUN TIME FROM THE COMMITTED SERIALISER AND
      NOT HARD-CODED. Let r be a depth-1 row, i.e. the deletion of exactly one component c(r)
      from K. Let I be an instrument, given as a PROJECTION pi_I on the serialised key. Then the
      cell (F, r) IS FORCED FOR I if and only if, in the key pi_I(K) with c(r) additionally
      deleted, THERE REMAINS a component d such that the graph carries a DERIVATION-BACKED edge
      d -> c(r) on the primitive under consideration. A cell forced for I is EXCLUDED FOR I. A
      cell not forced for I is ADJUDICATED FOR I.
    the_two_things_this_statement_fixes_and_they_are_named_because_they_are_the_whole_point: >-
      (1) THE PREDICATE IS EVALUATED ONCE PER INSTRUMENT, not once. The committed rule is
      computed under the HONEST key and is therefore instrument-independent, which is exactly
      why it cannot bound an instrument-dependent quantity (RT-J8-1, this round's O-P7).
      (2) THE EDGE MUST BE DERIVATION-BACKED. An `empirical_only` edge may not force a cell for
      any instrument, and an `edge_on_a_constant_column` may not either. 22 of the 36 edge
      verdicts are `empirical_only` and 22 of 22 sit on a constant column, so a rule that
      accepted any edge would force nearly everything.
    the_ambiguity_that_must_be_reported_rather_than_resolved_silently: >-
      "I'S PROJECTION COMPOSED WITH THE ROW'S DELETION" ADMITS TWO COMPOSITION ORDERS AND THE
      IMPLEMENTATION MUST STATE WHICH IT TOOK, MEASURE BOTH, AND REPORT BOTH FORCED SETS IF THEY
      DIFFER. If they agree, say so and say it was checked. IF THEY DIFFER, THE DIFFERENCE IS A
      FIRST-CLASS RESULT OF THIS BATCH and the count is reported under both orders, never under
      whichever gives the more interesting number. Choosing an order after seeing which gives a
      nonzero count is an IR-6 violation.

  # ==================================================================
  controls:
    CTL-FROZEN-4:
      what: >-
        Recompute the sha256 of every committed module under harness/diffpath/ plus
        harness/__init__.py and harness/runner.py BEFORE the first run and AFTER the last, and
        report both sets with the criterion set naming exactly which files it covers.
      known_answer: 'IDENTICAL BEFORE AND AFTER, 0 changed.'
      stop_on: 'any digest differing; name the file and stop.'
      note: >-
        THIS CONTRACT'S OWN NEW FILES -- harness/diffpath/readmit.py and
        tests/test_diffpath_readmit.py -- ARE REPORTED SEPARATELY AND ARE NEVER INSIDE THE
        CRITERION SET. A criterion set that contains the artifacts the contract requires the
        producer to create cannot be satisfied and would make the control vacuous.
    CTL-FORCE-PI:
      what: >-
        THE NULL-OBJECT CONTROL FOR THE NEW RULE, AND IT IS TWO-SIDED. Evaluate the
        per-instrument forcing predicate under the IDENTITY instrument (pi = identity, the
        honest key, no projection) and compare the resulting forced set, cell by cell, against
        the SIX cells BATCH-145531 excluded as forced_by_the_graph, read from
        offdiagonal-matrix-result.json.
      known_answer: >-
        EXACTLY EQUAL AS A SET AND CELL BY CELL, 6 of 6, with the forcing EDGE named for each
        and matching the committed edge. AND, on the other side, the forced set under O-E must
        NOT equal the identity forced set -- if the new rule returns the same forced set for
        every instrument it is the old rule under a new name and it measures nothing.
      stop_on: >-
        The identity forced set differing from the committed six in either direction; OR the
        forced set being invariant across all instruments in scope. EITHER IS A STOP AND NO
        RE-ADMITTED COUNT IS REPORTED.
      why_it_is_two_sided_and_the_limit_of_what_it_buys: >-
        The first side pins the new rule to the old one on the one case where the old rule is
        right. The second side proves the new rule can move at all. NEITHER SIDE SHOWS THAT THE
        PER-INSTRUMENT READING IS THE CORRECT GENERALISATION, only that it is A generalisation
        that agrees where it must and moves where it can, AND NO RECORD OF THIS BATCH MAY READ
        CTL-FORCE-PI PASSING AS EVIDENCE THAT THE QUANTIFIER IS RIGHT.
    CTL-READMIT:
      what: >-
        For each instrument in scope, adjudicate every cell NOT forced for that instrument,
        against the honest instrument and against the reused O-E, over the existing draw sets,
        reporting the per-cell verdict pair, the count of DIFFERING cells, the denominator, and
        the excluded-cell list with each exclusion's FORCING EDGE named.
      reported_as: >-
        A TABLE. Per instrument, per primitive, and separately at aggregate granularity, with
        every count beside its denominator. NEVER a fraction, never a pass, never a margin.
    CTL-READMIT-NULL:
      what: >-
        Run the identical per-instrument counting code path with two degenerate instruments --
        always_member and always_non_member -- and report the counts they produce.
      known_answer: >-
        always_member differs on every adjudicated cell where the honest instrument reports NOT
        DETECTED; always_non_member differs on every adjudicated cell where the honest
        instrument reports DETECTED.
      the_defect_this_control_inherits_and_must_report_rather_than_repeat: >-
        IN BATCH-145531 THE always_non_member ARM WAS ARITHMETICALLY PINNED AT 0, because the
        honest instrument reported DETECTED on ZERO of the nine adjudicated cells, so that arm
        COULD NOT FAIL and its met extreme was bookkeeping rather than a demonstration (D-10,
        RT-J8-2). THIS CONTRACT REQUIRES THE PRODUCER TO REPORT, AS A DECLARED FIELD AND NOT AS
        PROSE, WHETHER EACH ARM WAS PINNED -- `arm_was_arithmetically_pinned: true|false` with
        the count of honest-DETECTED cells that makes it so. AN ARM REPORTED AS MEETING ITS
        EXTREME WITHOUT THAT FIELD IS AN INCOMPLETE CONTROL.
      stop_on: 'either arm failing to meet its extreme where the extreme is not pinned.'
    CTL-PAIR-WF:
      what: >-
        The consistent-pair family passed through the committed well-formedness gate, TWO-SIDED:
        a consistently-perturbed pair (dv replaced by a non-codeword AND flag set False) must be
        ACCEPTED, and a deliberately INCONSISTENT pair (dv replaced by a non-codeword with the
        flag left True) must be REJECTED.
      known_answer: 'accepted on the consistent side, rejected on the inconsistent side, with per-primitive counts.'
      stop_on: >-
        The gate rejecting the consistent construction. THAT IS NOT A FAILURE OF THIS CONTRACT
        AND IT IS NOT A NULL RESULT: it is a DERIVED FACT ABOUT THE KEY FORMAT AND THE GATE, and
        it must be reported as NOT CONSTRUCTIBLE WITH ITS DERIVATION, naming the gate clause
        that rejected it, and NEVER as a family that produced zero detections.
    CTL-PAIR-DECL:
      what: >-
        The consistent-pair family's PERTURBATION DECLARATION reported as text, AND its ACTUAL
        moved-component set MEASURED per primitive by comparing serialised keys before and
        after, with any discrepancy between the declared and the measured set reported as a
        first-class finding.
      basis: >-
        DEC-20260824-257f35 C_4. The diagonal theorem's hypothesis was FALSE for the one family
        BATCH-145531 reused, because controlpower.perturb_message_difference HONESTLY RECOMPUTES
        in_linearized_code, so on sha1 the draw moves TWO key components and does not perturb
        exactly one. A family that declares one thing and moves another breaks every theorem
        instantiated on its declaration, and this control measures the declaration rather than
        trusting it.
    CTL-O-E-REUSE:
      what: >-
        O-E imported from the committed BATCH-efcae7 construction file with NO re-expression,
        and any mechanically necessary wrapper checked against constructions/j8_results.json's
        committed integers.
      known_answer: 'agreement on all 30 committed comparisons.'
      stop_on: 'any disagreement.'
    CTL-QUAR:
      what: >-
        Attestation of non-reading of coordination/goals/GOAL-MD5-001/quarantine/**, BY
        MECHANISM and never by intent, naming the mechanism and every filesystem traversal root
        used, and reporting the count of network requests made.
      known_answer: 'zero reads by every route; zero network requests.'
      stop_on: 'any read; a breach invalidates the run set under IR-1 and is reported to GOAL-MD5-001 as a cross-goal contamination finding.'
    CTL-INDEP:
      what: >-
        The independent-implementation attestation for arm (a), BY MECHANISM where a mechanism
        exists and BY AN HONEST BOOLEAN WHERE IT DOES NOT, with the difference stated.
      required_content: >-
        The exact forbidden path named; a run-time assertion that no module or file under it is
        present in the process; the list of every filesystem traversal root used; and an
        explicit statement of whether the non-reading is MECHANICALLY DEMONSTRATED or ATTESTED.
        NO TOOL IN THIS REPOSITORY CAN VERIFY THE BOOLEAN AND THE PRODUCER MUST SAY SO.

  # ==================================================================
  hard_terms:
    H-1: >-
      THE IMPLEMENTATION OF ARM (a) IS INDEPENDENT AND IS WRITTEN FROM THE STATEMENT. The
      producer MUST NOT open, read, import, copy, execute, diff or reconstruct anything under
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-145531/reviews/TASK-20260824-7d9f92/constructions/
      -- which is the exact directory holding rt3_rederive.py and rt3_objects.py, the ONE
      implementation that has ever computed this control. That path is a literal prefix and is
      declared in this contract, in the executor's task card and in its handoff. The forcing
      predicate is implemented from
      `the_forcing_predicate_stated_formally_so_it_can_be_implemented_from_the_statement` above.
      READING DEC-20260824-257f35 AND EV-DIFFP-afd96c IS REQUIRED AND IS NOT A VIOLATION: the
      STATEMENT, the cell identity and the integer 1 of 30 are committed research records and
      the producer must know what it is replicating. WHAT IS FORBIDDEN IS THE CODE.
    H-2: >-
      ARM (a) CONSTRUCTS NOTHING NEW. It reuses the six forced cells, the three constructible
      families and the draw sets already built, needs NO new seed, NO new family and NO
      acquisition. Any new construction in arm (a) is a deviation and is declared as one.
    H-3: >-
      EVERY EXCLUDED CELL CARRIES THE FORCING EDGE THAT EXCLUDES IT, PER INSTRUMENT AND PER
      PRIMITIVE, and every forcing edge cited is one of the four `derived_and_witnessed` edges.
      A cell excluded without a named edge is not excluded; it is unreported.
    H-4: >-
      EVERY EDGE, CELL, VERDICT AND COUNT CARRIES ITS PRIMITIVE SCOPE AND THE CENSUS
      COMPLETENESS BESIDE IT -- readable 0 / quarantined_not_read 1 / acquisition_gap 8, NEVER
      SUMMED, with shadow_planted 16 carried separately.
    H-5: >-
      NEVER A PASS AND NEVER A BARE FRACTION. Every count appears beside its denominator, its
      exclusion list and the reason for every exclusion.
    H-6: >-
      RUN THE NULL-OBJECT CONTROLS BEFORE YOU BELIEVE ANYTHING. If CTL-FORCE-PI's identity
      known-answer fails, or the forced set is invariant across instruments, NO RE-ADMITTED
      COUNT IS REPORTED AT ALL.
    H-7: >-
      EVERY EMITTED RULE TEXT MUST BE TRUE OF THE FUNCTION THAT EMITS IT. This is the D-2
      lesson: BATCH-145531's implemented R2 filtered candidates by an UNDECLARED restriction to
      one family by name while the emitted rule text said something more general, and the
      undeclared clause was load-bearing and moved the result toward the pre-registered target.
      A reader must be able to reproduce every cell from the artifact's own account of its rule.
    H-8: 'EMIT `null` AND NEVER 0 FOR AN UNMEASURED CELL, COLUMN, MODE OR INSTRUMENT.'
    H-9: 'NAME AGGREGATE KEYS AS AGGREGATES. An aggregate count and a per-primitive count are different quantities and are never merged.'
    H-10: >-
      RUN LOCATION IS A CONTRACT TERM: experiments/EXP-DIFFP-f26790/runs/<RUN-ID>/. The producer
      RUNS tools/validate_ledger.py AFTER its run directories exist AND BEFORE the snapshot
      archive, and records the output VERBATIM whether it passes or fails. If check_run rejects a
      manifest, DO NOT edit harness/runner.py and DO NOT hand-edit a manifest: write a
      manifest-supplement.yaml with the full AGENTS.md Artifact Policy field set, report the
      rejection verbatim as an INFRASTRUCTURE FINDING, and continue.
    H-11: >-
      RECORD OBSERVATIONS ONLY. Compose no verdict on whether the instrument is validated, on
      what the replication bought, on whether any path is new, or on either difference space.
      The composition is the ledger close's and no one else's.
    H-12: >-
      A PER-PRIMITIVE QUANTITY IS COMPUTED PER PRIMITIVE. This is the D-1 lesson: BATCH-145531's
      probing_profile() was computed ONCE over both primitives' draws and indexed inside the
      per-primitive loop, so both branches received an identical primitive-blind profile and one
      branch of one row carried five examples that were all the other primitive's. Any statistic
      indexed per primitive must be COMPUTED per primitive, and the producer must state for each
      emitted per-primitive field that it was.
    H-13: >-
      THE FORCED SET IS DERIVED, NOT INHERITED. Arm (a) derives its forced set per instrument and
      per primitive from the committed graph, and REPORTS THE DERIVATION. It does not adopt
      RT-J8-4's denominator of 30 and it does not adopt BATCH-145531's six-cell exclusion as a
      given for any instrument other than the identity one, where CTL-FORCE-PI checks it.
    H-14: >-
      THE WORDS `theorem`, `provable`, `provably` AND `impossible` MAY NOT BE USED OF ANY CLAIM
      RESTING ON AN `empirical_only` EDGE OR ON A SINGLE MEASUREMENT, in any artifact of this
      contract, except in a negation.
    H-15: >-
      BOTH ARMS' OUTCOMES ARE PRE-REGISTERED BELOW AND NEITHER MAY BE WRITTEN AS A SURPRISE
      AFTERWARDS. The producer reports the measurement; the interpretation of each outcome is
      already fixed in P-B and P-C and is not the producer's to choose.

  # ==================================================================
  preregistered_prediction:
    P-A:
      statement: >-
        UNDER THE IDENTITY INSTRUMENT, THE PER-INSTRUMENT FORCED SET EQUALS THE SIX CELLS
        BATCH-145531 EXCLUDED AS forced_by_the_graph, CELL BY CELL, WITH THE SAME FORCING EDGES.
      status_if_refuted: >-
        A STOP AND A FIRST-CLASS FINDING ABOUT THE RULE, NOT ABOUT THE INSTRUMENT. Either the
        committed six were wrong or the new rule is not a generalisation of the old one, and the
        producer reports which side the difference is on WITHOUT deciding it.
    P-B:
      statement: >-
        THE RE-ADMITTED DIFFERING-CELL COUNT UNDER AN INDEPENDENT IMPLEMENTATION. THIS CONTRACT
        DELIBERATELY DOES NOT PRE-REGISTER AN INTEGER FOR IT -- it is this round's BLINDED
        QUANTITY under BR-5 and no committed record of this batch predicts it -- BUT IT
        PRE-REGISTERS THE INTERPRETATION OF BOTH OUTCOMES, IN ADVANCE, SO THAT NEITHER CAN BE
        WRITTEN AS A SURPRISE.
      outcome_zero: >-
        IF THE RE-ADMITTED COUNT STAYS 0, THAT IS A RESULT AND IT IS RECORDED AS ONE: the family
        set genuinely cannot separate O-E from the honest instrument, BATCH-145531's 0 was NOT an
        exclusion artifact, the single differing cell RT-J8-4 reported DOES NOT REPLICATE under an
        independent implementation, and the differing-cell design is a diagnostic with NO POWER on
        this design -- which retires that design honestly and cheaply. It is NOT a failure of this
        batch and NOT a negative result about MD5, SHA-1 or any difference space.
      outcome_nonzero: >-
        IF THE COUNT IS NONZERO, THAT IS A RESULT AND IT IS RECORDED AS ONE: BATCH-145531's 0 was
        produced by an INSTRUMENT-INDEPENDENT EXCLUSION RULE and not by the instruments agreeing,
        and the exclusion rule was removing the only evidence of two-directional capacity in the
        matrix. The close must then name the cell, name the instrument whose blindness produced
        it, and NOT celebrate the integer.
      the_third_outcome_that_is_neither: >-
        A STOP UNDER CTL-FORCE-PI, CTL-O-E-REUSE OR ANY INVALIDATION RULE IS INFRASTRUCTURE
        SIGNAL OR A SPECIFICATION FINDING AND IS NEVER A MATHEMATICAL RESULT IN EITHER DIRECTION.
    P-C:
      statement: >-
        THE CONSISTENT-PAIR FAMILY IS CONSTRUCTIBLE UNDER CTL-WF.
      status_if_refuted: >-
        NOT CONSTRUCTIBLE IS A DERIVED FACT ABOUT THE KEY FORMAT AND THE GATE AND MUST BE REPORTED
        WITH ITS DERIVATION, naming the gate clause that rejects it. IT MAY NEVER BE REPORTED AS A
        FAMILY THAT PRODUCED ZERO DETECTIONS, and null family (e)'s direction is NOT thereby closed
        -- it would mean this campaign has no named repair left and the close owes a new one or an
        explicit argued retirement with its own obstruction block.
    P-D:
      statement: >-
        AT LEAST ONE CELL IN THE UNION OF THE RE-ADMITTED SET AND THE CONSISTENT-PAIR SET HAS THE
        HONEST INSTRUMENT AT DETECTED, GIVING THE CELL SET A DEMONSTRATED TWO-DIRECTIONAL CAPACITY
        FOR THE FIRST TIME IN THIS GOAL.
      why_it_is_pre_registered_separately: >-
        BECAUSE IT IS THE EXACT REVISIT CONDITION DEC-20260824-257f35 ATTACHED TO RANK 3, THE FIVE
        INSTRUMENT REPAIRS: "a cell set with a demonstrated TWO-DIRECTIONAL capacity exists -- one
        containing at least one cell the honest instrument reports as DETECTED, so that a
        regression could be seen in the DETECTED-to-NOT-DETECTED direction". If P-D holds, that
        revisit condition is MET and the repairs move to the front of the next ranking. If it
        fails, the condition is NOT met and the repairs stay behind measurement for a fourth round
        -- which is a ranking fact this batch measures rather than asserts.

  # ==================================================================
  independent_variables:
    - 'instrument: honest (identity), O-E (per-primitive-blind, reused), always_member, always_non_member.'
    - 'primitive: md5, sha1. Reported separately and never merged.'
    - 'row: the six depth-1 single-deletion rows, derived at run time from the committed serialiser.'
    - 'family: the three constructible families reused for arm (a), plus the consistent-pair family for arm (b).'
    - 'composition order: the two admissible readings of projection-composed-with-deletion, both measured.'

  metrics:
    - 'per_instrument_forced_set: the cell set forced for each instrument, per primitive, with each cell''s forcing edge.'
    - 'readmitted_cell_count: cells NOT forced for the instrument and therefore adjudicated, per instrument, per primitive, and at aggregate granularity named as aggregate.'
    - 'differing_cell_count: cells where the honest instrument and O-E give different verdicts over the re-admitted set, with the denominator beside it.'
    - 'consistent_pair_constructible: boolean, per primitive, with the gate clause named if false.'
    - 'consistent_pair_moved_components: the MEASURED moved-component set per primitive, beside the DECLARED one.'
    - 'honest_detected_cell_count: the number of adjudicated cells at which the honest instrument reports DETECTED -- the two-directional capacity quantity, and the field that decides whether an always_non_member arm is pinned.'
    - 'arm_was_arithmetically_pinned: boolean per degenerate arm, with the count that makes it so.'

  # ==================================================================
  run_location: 'experiments/EXP-DIFFP-f26790/runs/<RUN-ID>/'
  run_location_note: >-
    BR-12, AND IT IS NOW MEASURED RATHER THAN HOPED. EXP-DIFFP-04082e's five runs written at this
    root were DISCOVERED by tools/validate_ledger.py's glob and ACCEPTED by check_run at 0 errors
    and 0 warnings, driven directly and confirmed independently by TASK-20260824-e1062f. The
    producer nonetheless RE-MEASURES it for this contract's own runs and records the output
    verbatim, because the previous measurement is a fact about other runs.

  run_plan:
    - id: 'RUN-DIFFP-f26790-frozen-and-forcing-predicate'
      stage: 1
      what: 'CTL-FROZEN-4 pre-run digests; the per-instrument forcing predicate under every instrument in scope, both composition orders; CTL-FORCE-PI two-sided.'
      ceiling_seconds: 45
      gated_on: null
    - id: 'RUN-DIFFP-f26790-readmitted-cells'
      stage: 2
      what: 'CTL-READMIT over the cells not forced per instrument, honest versus O-E, per primitive, with denominators and forcing edges; CTL-O-E-REUSE.'
      ceiling_seconds: 75
      gated_on: 'stage 1 completing without a STOP.'
    - id: 'RUN-DIFFP-f26790-consistent-pair-family'
      stage: 3
      what: 'The consistent-pair family constructed; CTL-PAIR-WF two-sided; CTL-PAIR-DECL declared-versus-measured moved components.'
      ceiling_seconds: 60
      gated_on: null
    - id: 'RUN-DIFFP-f26790-pair-cells-and-null-object'
      stage: 4
      what: 'The consistent-pair cells adjudicated honest versus O-E; CTL-READMIT-NULL through the identical counting path with the pinning field; CTL-FROZEN-4 post-run digests.'
      ceiling_seconds: 75
      gated_on: 'stage 3 reporting the family CONSTRUCTIBLE. If it is not constructible, stage 4 runs the null-object and frozen halves only, and the pair-cell half is reported GATED-NOT-RUN with its gate named.'
  run_plan_arithmetic: '45 + 75 + 60 + 75 = 255 s of declared per-run ceilings, inside the task''s 330 s declared budget.'

  budget:
    wall_clock_seconds: 330
    memory_gb: 4
    maximum_runs: 4
    maximum_runs_definition: >-
      COUNTS CHARGED EXPERIMENT RUNS UNDER THIS CONTRACT -- a run directory under
      experiments/EXP-DIFFP-f26790/runs/, a RUN-* identifier, a manifest, an armed deadline and a
      consumed ceiling. IT DOES NOT COUNT script executions, read-only probes, adversarial
      constructions, cold re-derivations or unit-test invocations.
    unspent_ceilings: 'ARE REPORTED AS UNSPENT AND ARE NEVER REALLOCATED WITHOUT A VERSIONED protocol_amendment.'

  stopping_rules:
    - 'CTL-FROZEN-4 reporting any changed digest over its criterion set.'
    - 'CTL-FORCE-PI''s identity known-answer differing from the committed six cells in either direction.'
    - 'The per-instrument forced set being INVARIANT across every instrument in scope.'
    - 'CTL-O-E-REUSE disagreeing with j8_results.json on any of its 30 committed comparisons.'
    - 'A ninth seed appearing anywhere, or the eight declared seeds differing from the committed set.'
    - 'The run-time-derived strict key component list differing from the six names this contract assumes -- report the difference as a finding about the contract and stop.'
    - 'Any read of coordination/goals/GOAL-MD5-001/quarantine/** by any route.'
    - 'Any read of the H-1 forbidden path.'
    - 'A declared ceiling reached -- reported as INFRASTRUCTURE SIGNAL with the unspent portion of every other ceiling reported as unspent.'

  invalidation_rules:
    IR-1: 'Any read, parse, extraction, fetch or reconstruction of coordination/goals/GOAL-MD5-001/quarantine/** or the same CONTENT by any other route invalidates the run set and is reported to GOAL-MD5-001 as a cross-goal contamination finding.'
    IR-2: 'NO COMMITTED FILE UNDER harness/ MAY BE MODIFIED. Only harness/diffpath/readmit.py and tests/test_diffpath_readmit.py may be written. CTL-FROZEN-4 measures this and its failure is a STOP.'
    IR-3: 'NO NETWORK ACQUISITION BY ANY ROUTE. The executor holds run_commands and deliberately NOT web_search; fetching via the shell would route around a declared role boundary.'
    IR-4: 'NO SEARCH OVER EITHER DIFFERENCE SPACE, no collision attempt, no cost projection, no attack-complexity figure.'
    IR-5: 'NO CLAIM THAT ANY PATH IS NEW, at any tier, for either primitive, and no NON-MEMBER verdict written or implied as novelty.'
    IR-6: 'NO IN-RUN REPAIR AFTER SEEING DATA. Changing a family, a projection, a seed, a criterion, an exclusion rule, a composition order or the counting rule after observing an outcome requires a versioned protocol_amendment.'
    IR-7: 'Every run manifest carries code_path_fingerprint, an armed deadline and the LITERAL id EXP-DIFFP-f26790 at both run.experiment_id and run.inputs.parameters.experiment_id.'
    IR-8: 'RECORD OBSERVATIONS ONLY. The producer composes no verdict.'
    IR-9: 'IF THE WORK TURNS OUT TO BE VALIDATING A CHARACTERISTIC-SEARCH SOLVER RATHER THAN MEASURING THIS INSTRUMENT, STOP and report the observation for handoff to GOAL-MD5-001.'
    IR-10: 'THE LOAD-BEARING DELIVERABLE IS A PER-INSTRUMENT CELL TABLE, NEVER A PASS AND NEVER A BARE FRACTION.'
    IR-11: 'O-E IS REUSED from coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-e9d21a/constructions/rt_instruments.py and is NOT rebuilt; any mechanical re-expression is checked against j8_results.json and a disagreement is a STOP.'
    IR-12: 'THE H-1 FORBIDDEN PATH IS NOT READ. A read invalidates the INDEPENDENCE of arm (a) -- not its arithmetic -- and the batch reports the arm as a RE-EXECUTION rather than a replication, which is a downgrade of a label and not a discarding of a measurement.'
    IR-13: 'THE STRICT KEY COMPONENT LIST IS DERIVED AT RUN TIME FROM THE COMMITTED SERIALISER and never hard-coded from this contract. A difference from the six names is a STOP and a finding about the contract.'
    IR-14: 'coordination/goals/GOAL-DIFFP-84d641/sealed-priors/** IS NOT READ BY THE PRODUCER OR BY EITHER REVIEWER.'
    IR-15: 'NO RECORD PRODUCED UNDER THIS CONTRACT MAY STATE OR IMPLY THAT THE MD5 LANE IS CLOSED, EXHAUSTED, DEPRIORITISED ON THE MERITS OR SCREENED OUT.'
    IR-16: 'A TIMEOUT, CRASH, CEILING HALT, check_run REJECTION OR IMPLEMENTATION FAILURE IS INFRASTRUCTURE SIGNAL, never a negative mathematical result and never a finding about the instrument.'

  required_artifacts:
    - 'harness/diffpath/readmit.py -- the ONLY new module: the per-instrument forcing predicate implemented from the statement, the consistent-pair family constructor, the per-instrument cell selector, the degenerate instruments through the identical counting path, and the drivers. It imports the committed modules and modifies none.'
    - 'tests/test_diffpath_readmit.py -- a NEW dedicated test file covering the forcing predicate against the identity known-answer and against a moving instrument, the consistent-pair gate on both sides, and the counting rule against both degenerate instruments. NO EXISTING TEST FILE IS EDITED.'
    - 'forcing-predicate-per-instrument.json -- the forced set per instrument, per primitive, per composition order, with each cell''s forcing edge and the CTL-FORCE-PI two-sided result.'
    - 'readmitted-cells-result.json -- the per-cell verdict pair for every re-admitted cell, the differing count beside its denominator, the excluded list with reasons and edges, and the honest-DETECTED cell count.'
    - 'consistent-pair-family-result.json -- constructibility per primitive, the gate result on both sides, the declared perturbation text and the MEASURED moved-component set.'
    - 'consistent-pair-cells-result.json -- the per-cell table for the consistent-pair family, or the file written with status GATED-NOT-RUN, the gate named and nulls.'
    - 'readmit-null-object-result.json -- both degenerate instruments through the identical counting path, each with arm_was_arithmetically_pinned and the count that makes it so.'
    - 'frozen-recheck-4-result.json -- CTL-FROZEN-4 before and after, with this contract''s own required new artifacts reported SEPARATELY and never inside the criterion set.'
    - 'independence-attestation.json -- CTL-INDEP: the forbidden path named literally, the run-time assertion and its result, every traversal root used, and whether non-reading is MECHANICALLY DEMONSTRATED or ATTESTED.'
    - 'run-index.json -- a sha256 for every file of every executed run.'
    - 'execution-report.yaml -- headline is the per-instrument cell table and NEVER a pass; carrying the verbatim tools/validate_ledger.py output measured after the runs exist and before the snapshot; the quarantine attestation with its mechanism; the search_knowledge log verbatim; every deviation declared; unspent ceilings AS UNSPENT; and closing with the explicit statement that NO PATH IS CLAIMED NEW, NO SEARCH WAS RUN, NO SOURCE WAS ACQUIRED, NO COMMITTED INSTRUMENT WAS REPAIRED, AND THE MD5 LANE IS BLOCKED RATHER THAN CLOSED.'
  required_artifacts_note: >-
    EVERY DECLARED RESULT FILE IS WRITTEN EVEN IF ITS RUN IS GATED-NOT-RUN OR STOPPED, carrying
    that status, the gate that fired, and nulls rather than being absent. A declared artifact set
    that can go missing makes the archive fragile and that is why this clause exists.

  success_criterion: >-
    THE CONTRACT SUCCEEDS WHEN THE PER-INSTRUMENT FORCED SET, THE RE-ADMITTED CELL TABLE AND THE
    CONSISTENT-PAIR FAMILY'S CONSTRUCTIBILITY ARE ALL MEASURED AND REPORTED WITH THEIR
    DENOMINATORS, THEIR FORCING EDGES AND THEIR PRIMITIVE SCOPE, UNDER AN IMPLEMENTATION THAT
    DID NOT READ THE H-1 PATH, WITH CTL-FORCE-PI TWO-SIDED AND CTL-READMIT-NULL REPORTING ITS
    PINNING FIELD. SUCCESS IS INDEPENDENT OF THE VALUE OF THE COUNT. A re-admitted count of 0
    and a re-admitted count of 3 are both successes of this contract and neither is a score.
  falsification_criterion: >-
    THE CONTRACT IS FALSIFIED AS AN INSTRUMENT -- not the batch, the CONTRACT -- IF CTL-FORCE-PI
    FAILS EITHER SIDE: if the per-instrument rule does not reduce to the committed rule under the
    identity instrument, it is not a generalisation of it; and if it returns the same forced set
    for every instrument, it is the old rule under a new name and measures nothing. In either
    case NO RE-ADMITTED COUNT IS REPORTED and the finding is about the rule.

  interpretation_limits:
    - 'CLAIM CEILING `analyzed`, NEVER `supported`. No path is claimed new for either primitive at any tier and no cryptanalytic improvement of any kind is claimed.'
    - 'A PASSING CONTROL IS NOT AN IMPROVEMENT. A control suite that re-admits more cells is a better-understood instrument and is not a result about MD5 or SHA-1.'
    - 'WITH A READABLE CENSUS OF ZERO A NON-MEMBER VERDICT CARRIES NO INFORMATION ABOUT THE LITERATURE AT ALL, and the census completeness is stated beside every verdict cited, never summed.'
    - 'AN EVIDENCE STRENGTH OF `replicated` DESCRIBES HOW MANY IMPLEMENTATIONS PRODUCED A NUMBER, NEVER WHAT THE NUMBER MEANS.'
    - 'A DIFFERING-CELL COUNT OF ZERO AND A DIFFERING-CELL COUNT OF TEN ARE BOTH MEASUREMENTS AND NEITHER IS A SCORE.'
    - 'AGREEMENT BETWEEN THIS IMPLEMENTATION AND RT-J8-4 IS WEAKER EVIDENCE THAN DISAGREEMENT, because contamination pushes toward agreement and not away from it, and the close weights the two outcomes differently and says so.'
    - 'THE FOUR SUPPORTED-PROMOTION GATES OF agents/coordinator.md ARE NOT ATTEMPTED AND ARE STRUCTURALLY UNMET BY A BATCH OF THIS KIND. This goal carries no asymptotic-complexity claim and this contract proposes none.'

  scale_relevance: >-
    NONE IS CLAIMED AND THAT IS STATED RATHER THAN LEFT TO INFERENCE. This contract measures this
    program's own adjudication instrument at census size zero on a 16-entry synthetic shadow
    population. IT TRANSFERS TO NOTHING: not to another census, not to another adjudicator, not
    to permissive mode, not to another seed set, not to MD5, not to SHA-1, and not to any
    difference space. DEC-20260824-257f35 C_3 records what happened the last time a contract of
    this campaign wrote a short-form structural claim into a `scale_relevance` field addressed to
    a downstream consumer: the short form was FALSE AS WRITTEN and had to be corrected. This
    field therefore claims nothing at all.

  open_directions:
    - 'The four unreplicated survivors O-D, O-C, O-C-prime and O-C-double-prime, independently reconstructed -- rank 2 of DEC-20260824-257f35, whose revisit condition is this contract completing.'
    - 'The five instrument repairs VD-3, VD-4, the {E4}/{E5} zero-image result, OBJ-3 and OBJ-4 -- rank 3, whose revisit condition is P-D holding.'
    - 'Tier C SHA-1 acquisition under AMD-20260824-DIFFP-ACQ-1 -- rank 4, BLOCKED AND NOT CLOSED, revisit condition unchanged.'
    - 'The re-aimed observation-collision direction CTL-OBS (i) -- rank 5, whose revisit condition is a family set that populates cells the current one cannot, which is arm (b).'
    - 'The run-registration repair of the eleven pre-existing run directories -- rank 6.'
    - 'The five corrections and the one versioned protocol_amendment DEC-20260824-257f35 specifies in full -- rank 7, OWED rather than chosen.'
    - 'Permissive mode, unmeasured in both directions with its cells `null` and never 0; and the second seed set, named as unmeasured and not retired.'
