experiment:
  id: EXP-SIMSPK-ac655a
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-a96623; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-a96623
  question_id: RQ-SIMSPK-f6a6c0
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Cell-by-cell validation of a frozen closed-form differential weight oracle for SIMON-like
    AND rounds against exhaustive difference distribution tables across the entire rotation-constant
    space at word sizes 4 through 12, with a random-quadratic null the oracle must fail
  objective: 'A run reduces exactly one uncertainty: whether this campaign possesses a differential
    weight instrument that is exact rather than approximately right, and on which region of the rotation-constant
    space its exactness holds. Concretely it determines (i) the exact integer number of difference
    distribution table cells on which a closed form, frozen with a recorded hash before any comparison,
    disagrees with exhaustive ground truth, computed over every rotation triple at word sizes 4, 6,
    8 and 10 and over a declared sample at 12; (ii) whether the disagreeing triples are separated
    from the agreeing ones by a statable arithmetic condition on (a, b, c, n), or whether the honest
    output is an enumerated exception list; and (iii) whether the same closed form fails, as it must,
    on a random balanced quadratic function of matched quadratic-term count, which is the only available
    check that the form encodes AND structure rather than a generic property of quadratic maps. Secondary
    output is the key-independence check and the crossover word size at which exhaustive ground truth
    stops being computable in this environment. No hypothesis is minted, no status changes, and no
    multi-round claim is produced.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'At most, a run could support: for the round function form pinned
      in STAGE 0, at word sizes 4, 6, 8, 10 and the declared sample at 12, in pure CPython on this
      machine with the recorded seeds, (a) an exact integer count of disagreeing cells between the
      frozen closed form and exhaustive ground truth, per triple; (b) the exact list of triples exhibiting
      any disagreement and, if one exists, a stated arithmetic condition separating them; (c) a measured
      disagreement rate for the same form on a random quadratic null; and (d) a verified statement
      that one-round differential weights are invariant under the round key at the tested sizes. What
      does NOT follow: that the oracle is correct at n = 16, 24, 32, 48 or 64, which rests on the
      derivation''s algebra rather than on these runs; that trail weights compose additively across
      rounds, which is untested here; that any rotation triple is strong, weak, optimal or anomalous,
      since no ranking is computed; anything about any published expression; and anything about the
      security of any SIMON variant at any round count.'
  inputs:
    procedure: 'STAGE 0, pin the round-function form and validate a reference implementation against
      published test vectors; human cost 30 to 60 minutes, may fail, and failure is recorded as a
      named missing baseline rather than worked around. STAGE 1, derive the closed-form weight from
      first principles by writing the AND bitwise and classifying forced, free and coupled bit positions;
      write it and its stated validity condition to a preregistration file and record the file hash;
      human cost 2 to 4 hours, zero compute. STAGE 2, exhaustive tables at n = 4 and n = 6 for all
      triples; seconds. STAGE 3, exhaustive tables at n = 8 for all 512 triples; roughly 33 million
      round evaluations, minutes. STAGE 4, exhaustive tables at n = 10 for all 1000 triples; roughly
      1 billion evaluations, so this stage runs under a declared per-triple ceiling and a stated sampling
      rule if the ceiling binds, and any omitted region is named. STAGE 5, declared sample at n =
      12 with the sampling rule frozen in STAGE 1. STAGE 6, cell-by-cell comparison and condition
      extraction. STAGE 7, null arm: 32 random balanced quadratic maps per word size through the identical
      pipeline. STAGE 8, controls: key-independence at n = 8, degenerate linear triples, and a second
      independent brute-force implementation on a 10 percent subsample.'
    instrument: CPython 3.11 standard library only; numpy, z3, python-sat and pulp were checked and
      are absent in this environment on 2026-08-16, and Sage is excluded by contract. Words are Python
      integers with explicit masking; rotations are shift-and-mask; tables are flat lists of length
      2^{2n} at small n and streamed per input difference at n >= 10. The random quadratic null is
      generated from a seeded random.Random instance with the seed recorded in the manifest. Run manifest,
      seed handling and per-stage timing follow harness/runner.py conventions so the record carries
      the resolved inference block in the existing shape. Identifiers minted with tools/allocate_id.py
      --next.
    parameters: 'Word sizes n in {4, 6, 8, 10, 12}, constant spaces of size 64, 216, 512, 1000 and
      1728 triples respectively, exhaustive at n <= 10 and a declared uniform sample of 256 triples
      at n = 12 with the seed recorded. Input differences: all 2^n values per triple at n <= 10; at
      n = 12 a declared stratified sample of 512 input differences covering Hamming weights 1 through
      4 exhaustively and higher weights by sampling, with the omitted region named. Output differences:
      all 2^n. Null arm: 32 random balanced quadratic maps per word size, quadratic-term count matched
      to the AND round''s n terms. Key-independence control: 8 fixed nonzero round keys at n = 8.
      Second-implementation cross-check on a 10 percent subsample of triples at each word size. Per-triple
      wall-clock ceiling 60 seconds, total run ceiling 3600 seconds.'
  controls:
  - Random balanced quadratic null function with matched quadratic-term count, on which the oracle
    must fail, run in the same invocation.
  - Uniformly drawn rotation triples compared against the standardized triple, to detect a derivation
    tuned to the standardized case.
  - 'Key-independence control: tables recomputed under several fixed nonzero round keys at n = 8 and
    required to coincide exactly.'
  - 'Linear-part control: a degenerate triple making the AND vanish, for which the round is linear
    and every nonzero-probability cell must have weight exactly 0; failure indicates a table-construction
    fault.'
  - Preregistration hash of the closed form recorded before the first comparison, so the form cannot
    be adjusted to fit the tables.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two null objects, both executed in the same invocation as the signal
    arm. First, a uniformly drawn balanced quadratic vectorial Boolean function g on n bits with the
    same number of quadratic monomials as the AND round, built from a seeded generator: its exact
    difference distribution table is computed by the identical brute force, and the closed-form oracle
    is applied to it unchanged. The oracle MUST fail on this null, with a disagreement count comparable
    to the number of cells, because a closed form that also fits a random quadratic map is not capturing
    the AND structure and is fitting something generic about quadratic maps instead. Second, a rotation
    triple drawn uniformly from (Z/n)^3, which the oracle must handle exactly as well as it handles
    the standardized triple; systematically worse agreement on random triples than on the standardized
    one would indicate the derivation was tuned to the standardized case. For the signal arm to mean
    anything the first null must show near-total disagreement and the second must show agreement statistically
    indistinguishable from the standardized triple''s.'
  independent_variables:
  - word size n
  - rotation triple (a,b,c)
  - input difference alpha
  - arm (signal AND-round versus random-quadratic null)
  - round key value, for the key-independence control only
  metrics:
    primary:
    - disagreeing_cells as an exact integer, per triple and per word size
    - count of triples with any disagreement, per word size
    - null_arm disagreement rate
    - boolean key_independence_holds at n = 8
    secondary:
    - total_cells_compared per word size
    - agreement rate for the standardized triple versus uniformly drawn triples
    - crossover word size at which exhaustive ground truth exceeds the wall-clock ceiling
    - wall-clock seconds and peak resident memory per stage
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The number of difference distribution table cells on which the frozen closed-form weight
      disagrees with exhaustive brute force, restricted to rotation triples satisfying the validity
      condition stated in the same frozen file.
    formula: Predicted value exactly 0 on the covered subset. The predicted law is w(alpha, beta;
      a, b, c) = 2n minus the base-two logarithm of the number of x in {0,1}^n satisfying (S^a x AND
      S^b x) XOR (S^a(x XOR alpha) AND S^b(x XOR alpha)) XOR S^c alpha = beta, expressed by the closed
      form derived in STAGE 1 as a function of the Hamming weights of certain alpha-derived masks
      built from S^a alpha, S^b alpha and their overlaps, with the exact expression and its validity
      condition written to the preregistration file and hashed before STAGE 2 begins. Ground truth
      is the same quantity computed by exhaustive enumeration, which is definitional; any disagreement
      is charged to the closed form.
    source: Pre-registered in the parent proposal IDEA-20260816-a96623 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested word sizes are 4 through 12 against a family whose deployed word sizes
      are 16, 24, 32, 48 and 64. Coverage is exhaustive, not sampled, at n <= 10 over both the constant
      space and the cell space, so at those sizes the result is a complete check rather than a statistical
      estimate. The transfer assumption is stated rather than hidden: correctness at n >= 16 does
      NOT follow from these runs and rests entirely on the algebraic derivation in STAGE 1 being valid
      for all n, which the exhaustive checks corroborate but do not prove. Any downstream record using
      the oracle at n = 16 or above must carry that dependence explicitly, and the crossover word
      size at which exhaustive validation stops being available in this environment is reported so
      the boundary is a number rather than an impression.'
    correspondence: null
  tail_checks:
  - Impossible transitions, that is cells with zero solutions, are compared explicitly as weight infinity
    rather than skipped, because a closed form that is right on every possible transition and wrong
    about which are impossible is still wrong.
  - 'Zero input difference is handled explicitly: alpha = 0 must give beta = 0 with weight 0 and nothing
    else.'
  - Maximum-weight input differences, alpha with all bits set, are checked separately since they exercise
    every coupling simultaneously.
  - Degenerate triples with a = b, where the AND becomes idempotent, are reported as their own stratum.
  - The largest word size reached within budget is reported with its actual coverage rather than described
    as complete.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt and report an instrument fault if the degenerate linear-triple control produces any nonzero
    weight.
  - Halt a word size at its declared per-triple ceiling and record the triples not reached by name;
    a ceiling hit is a budget outcome and is never written as a statement that the oracle failed there.
  - Halt the whole run at 3600 seconds total wall clock and report the word sizes actually completed.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Zero disagreeing cells across every rotation triple satisfying the frozen validity
    condition at word sizes 4, 6, 8 and 10, together with a null-arm disagreement rate above 0.5 and
    a confirmed key-independence result at n = 8.
  falsification_criterion:
  - Any disagreeing cell on a triple the frozen validity condition claims to cover.
  - Null-arm disagreement rate below 0.5, indicating the closed form fits generic quadratic maps.
  - Key-independence failing at n = 8.
  - Disagreement between the two independent brute-force implementations on the cross-check subsample.
  - No arithmetic condition separating agreeing from disagreeing triples, which restricts the oracle
    to an enumerated list and must be recorded as a scope limitation rather than smoothed away.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-a96623
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The closed form itself is not supplied by this proposal; STAGE 1 must produce it and the Coordinator
    must confirm it was frozen and hashed before any table was inspected, since the entire validation
    is worthless if the form was tuned to the data.
  - The exact rotation direction convention and the exact round-function form must be pinned from
    a primary source; the RQ refuses to restate the constants and this proposal inherits that refusal,
    so approval requires the pinning to have succeeded or the missing-baseline record to exist.
  - The sampling rule for n = 12 must be fixed by the Coordinator in STAGE 1 and cannot be chosen
    after seeing the n = 10 results.
  - Whether round-independence for multi-round composition is in scope for a separate contract, or
    is to be carried as a named unverified convention by every downstream record, is a Coordinator
    decision this proposal does not make.
