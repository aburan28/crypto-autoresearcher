experiment:
  id: EXP-ALPF-a378ad
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-bd49b9; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-bd49b9
  question_id: RQ-ALPF-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Detection curve of the ALPF first-fall screen against graded planted syzygies and certified
    planted decompositions at fixed leading-form degree profile, with a matched no-plant null arm
    in the same invocation.
  objective: 'The one uncertainty a run reduces is the resolution of the ALPF screen: the smallest
    planted structure it reliably detects. Stated as parts: (i) can a decomposition-level plant be
    constructed and certified, that is, can a toy prime-field target point be built as an explicit
    sum of factor-base points such that harness/semaev.py''s verify_decomposition_certificate accepts
    the resulting certificate, establishing that the instance genuinely contains what the screen is
    meant to find; (ii) with the leading-form degree profile held byte-identical between arms, what
    is the screen''s detection probability as a function of the planted shared-factor degree g, and
    where does that probability cross 0.9 and where does it fall to the separately measured null rate;
    (iii) for each detected instance, does the observed first-fall degree coincide with the closed-form
    predicted syzygy degree d_i + d_j - g, or does the Hilbert series absorb the plant as EXP-ALPF-006
    recorded when 0 of 3 positive controls fired. Reducing these converts every quiet cell in the
    archived ALPF tables from an unqualified negative into a negative with an explicit exclusion threshold,
    and does so without asserting anything about real curves.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for this meter implementation,
      these profiles, these primes and this plant construction, the detection probability is p_hat(g)
      with the stated intervals, the matched null fired at rate q_hat, and the resolution is g_min.
      What does NOT follow: that any real prime-field curve carries structure at any magnitude; that
      a natural syzygy of degree g is as detectable as a planted one; that any ALPF negative is correct
      or incorrect; that any decomposition can be FOUND rather than constructed; and no attack, speedup,
      or security consequence whatsoever -- the planted decompositions cost nothing to find because
      they were built, and citing their existence as a solving result would be fabrication.'
  inputs:
    procedure: 'STAGE 0 (cost: 0 compute): fix the profile list and plant magnitudes from the archived
      EXP-ALPF-011 table; freeze the fixture. STAGE 1 (cost: ~1 day human, seconds compute): extend
      harness/toycurve.py instance generation to build a target point as an explicit sum of k factor-base
      points and emit the certificate; verify with harness/semaev.py verify_decomposition_certificate.
      STAGE 2 (cost: ~1 day human): implement the plant injector -- shared factor of degree g between
      two generators with degree compensation -- plus a programmatic assertion that planted and null
      arms have identical profiles. STAGE 3 (cost: seconds): reproduce the three published meter control
      rows; abort on mismatch. STAGE 4 (cost: ~1 CPU-hour): for each (profile, g in {1,2,3}, arm in
      {plant, null}), build 50 instances over 5 seed blocks and meter them in one process. STAGE 5
      (cost: ~15 CPU-minutes): repeat the smallest cell on a second curve family. STAGE 6 (cost: minutes):
      aggregate detection rates with Clopper-Pearson intervals, compute g_min, tabulate observed-minus-predicted
      first-fall degree, and emit per-profile scope qualifiers for every archived quiet cell.'
    instrument: Python 3 only, no Sage. harness/toycurve.py for curve and instance generation and
      the _seed_int seeding convention; harness/semaev.py for s3_expr/s4_expr, build_factor_base and
      verify_decomposition_certificate; a pure-Python Macaulay-matrix rank meter over F_p (the same
      implementation used for the null-rate measurement, shared as one module); harness/runner.py
      for run manifests and the inference block; sympy for polynomial factor injection and degree
      bookkeeping.
    parameters: 'Primes: one 13-bit and one 15-bit prime, matching the archived cells. Profiles: [2,2,2,4],
      [2,3,4,12] and [4,4,4,12] from the EXP-ALPF-011 table. Plant magnitudes: g in {1,2,3}, with
      g capped so that d_i + d_j - g stays at or above 1. Decomposition plants: k = 3 and k = 4 factor-base
      summands, |FB| in {4,5} as archived. Instances: 50 per (profile, g, arm) over 5 seed blocks
      of 10. Second curve family: 50 instances at the smallest cell only. Maximum Macaulay degree
      14. Total metered systems: 3 profiles x 3 magnitudes x 2 arms x 2 primes x 50 = 1800, plus 50
      replication and 3 control rows.'
  controls:
  - 'Matched null arm: identical construction with the shared factor replaced by an independent factor
    of the same degree, run in the same invocation.'
  - The three published meter control rows re-run in the same invocation, so the detection curve is
    anchored to the archived campaign.
  - 'Certificate control: verify_decomposition_certificate must accept every decomposition-level plant
    and must not be invoked as a claim on the null arm.'
  - 'Profile-invariance check: assert programmatically that the planted and null arms have byte-identical
    leading-form degree profiles before metering.'
  - 'Seed-block control: 5 disjoint seed blocks per cell so a detection rate is not a single-seed
    artifact.'
  - 'Curve-family control: repeat the smallest cell on a second, independently generated toy curve
    to show the resolution is not curve-specific.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is the identical Semaev system with the plant removed
    -- same curve, same factor base, same degree profile, same seed, with the shared factor replaced
    by an independently drawn factor of the same degree so no syzygy is created. Both arms are constructed
    by the same builder function differing in one boolean and are run through the same meter in one
    invocation. For the planted arm to mean anything, the null arm must be QUIET at a rate consistent
    with the separately measured per-profile null rate; if the null arm fires at a comparable rate
    the detection curve is uninterpretable and the correct record is a controlled null. Additionally
    the decomposition-level plant carries a checkable certificate: the null arm''s target point is
    drawn uniformly and its decomposition is NOT constructed, so certificate verification must succeed
    on the planted arm and must not be claimed on the null arm.'
  independent_variables:
  - planted shared-factor degree g
  - arm (plant vs matched null)
  - leading-form degree profile
  - number of factor-base summands k in the certified decomposition
  - curve family (primary vs replication)
  metrics:
    primary:
    - detection rate per (profile, g) with Clopper-Pearson 95 percent interval
    - matched-null fire rate per (profile)
    - resolution g_min, the smallest g with detection above 0.9
    - observed d_ff minus predicted syzygy degree per detected instance
    - certificate verification success rate on the planted decomposition arm
    secondary:
    - profile-identity assertion pass rate between arms
    - positive-dimensional instance fraction per cell
    - per-seed-block detection spread
    - wall-clock seconds per metered system
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The screen's detection probability as a function of planted shared-factor degree, and
      the resolution threshold derived from it.
    formula: 'detect(profile, g) = (instances with d_ff < D_reg_pred) / 50, with the plant defined
      as a common factor of degree g shared between generators i and j and the predicted first-fall
      degree defined as d_i + d_j - g. g_min(profile) = min{ g : detect(profile, g) > 0.9 }. Pre-registered
      prediction: detect at the maximum admissible g exceeds 0.9, matched-null fire rate stays below
      0.05, and for detected instances the observed d_ff equals d_i + d_j - g exactly. No prediction
      is pre-committed for g = 1, because EXP-ALPF-006 recorded 0/3 detection on plants that provably
      had syzygies.'
    source: Pre-registered in the parent proposal IDEA-20260816-bd49b9 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at 13-bit and 15-bit primes with |FB| in {4,5} and total degrees up to
      12, exactly the archived ALPF parameters. NO transfer to medium or cryptographic scale is assumed:
      the resolution g_min is asserted only for these profiles at these field sizes. The one stated
      transfer ASSUMPTION, flagged rather than hidden, is that a planted syzygy of degree g upper-bounds
      detectability of a natural syzygy of the same degree; this is used only to phrase the scope
      qualifier attached to archived quiet cells, and the qualifier states the assumption inline.'
    correspondence: null
  tail_checks:
  - Report instances where the plant was injected but the Hilbert function did not drop at the predicted
    degree, since that is the EXP-ALPF-006 absorption mode and is the most informative tail.
  - Report the maximum observed d_ff and the count of instances that hit the degree ceiling, which
    truncate detection.
  - Report per-seed-block detection spread so a single block cannot carry the result.
  - Report null-arm instances that fired, individually, with their seeds, since a matched-null fire
    is a construction defect rather than noise.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort before STAGE 4 if any published control row is not reproduced or if the profile-identity
    assertion fails on any constructed pair.
  - Stop a cell and mark it budget-truncated if 5 consecutive instances exceed 120 seconds of wall
    clock.
  - Hard stop at 4 total CPU-hours; report completed cells and mark the rest not-run.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Certificates verify on 100 percent of planted decompositions, profile identity
    holds on 100 percent of arm pairs, and a detection rate with a 95 percent interval no wider than
    0.15 is reported for every (profile, g) cell.
  falsification_criterion:
  - Detection rate indistinguishable from the matched-null rate at every tested g, in which case the
    screen has no resolving power at that profile and the result is recorded as a measured obstruction.
  - Matched-null fire rate exceeding the separately measured per-profile null rate, voiding the comparison.
  - Any certificate failing to verify on the planted decomposition arm.
  - Profile-identity assertion failing on any arm pair.
  - Non-monotone detection in g beyond the seed-block spread.
  - Failure to reproduce any published meter control row.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-bd49b9
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The degree-compensation scheme that keeps the profile fixed while injecting a degree-g shared
    factor must be written out explicitly for each listed profile; for [3,3,3,24] it may not exist
    and that profile may have to be dropped before approval.
  - Whether harness/semaev.py's build_factor_base can be driven to produce a factor base containing
    a chosen set of summands, as the certified plant requires, needs confirming against the source.
  - The closed-form predicted first-fall degree d_i + d_j - g assumes the shared factor is not itself
    in the ideal generated by the others; a Coordinator must state the genericity condition under
    which this holds.
  - The exclusion-threshold language attached to archived quiet cells needs a Coordinator-approved
    wording that carries the planted-vs-natural assumption inline.
