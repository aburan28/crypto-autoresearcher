# EXP-SATIC-a1343f
# Ladder-factor arithmetic. No solver.
# Approved by DEC-20261002-104be1.
experiment:
  id: EXP-SATIC-a1343f
  hypothesis_id: H-SATIC-82c48c
  source_idea: IDEA-20260920-18dc28
  question_id: RQ-SATIC-1ae57a
  version: 1
  title: Ladder-factor arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-104be1
  objective: >-
    Check the ladder mean 7, the end gap 2, and the base-2 logarithm
    of 4.
  inputs:
    ladder: [6, 7, 8]
    ladder_sum: 21
    ladder_count: 3
    ladder_mean: 7
    end_low: 6
    end_high: 8
    end_gap: 2
    unit_gap: 1
    cap: 4
    tolerance: 2
    cap_ratio: 2
    log_cap: 2
    log_tolerance: 1
    bit_gap: 1
    cap_excess: 2
  controls:
    - >-
      The ladder sum is 21 and the mean is 7. Reporting another mean
      invalidates the run.
    - >-
      The end gap is 2 and equals the sum of the two unit gaps.
      Reporting the end gap as 1 invalidates the run.
    - >-
      The cap 4 divided by the tolerance 2 is 2. Reporting the
      tolerance as 4 invalidates the run.
    - >-
      The base-2 logarithm of 4 is 2. Reporting that logarithm as 4
      invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {ladder, factor}
    - route in {sum, ends}
  metrics:
    primary:
      - ladder_mean
      - log_cap
      - implementations_agree
    secondary:
      - end_gap
      - cap_ratio
      - bit_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The ladder mean is 7 and the base-2 logarithm of 4 is 2.
    formula: >-
      Divide the sum 6 plus 7 plus 8 by 3, and average the ends 6 and
      8. The logarithm of 4 is the exponent of the power of two that
      equals 4. The cap divided by the tolerance is the ratio.
    source: >-
      IDEA-20260920-18dc28 states the ladder 6, 7, 8, the cap of 4,
      and the reproduction tolerance of 2, read 2026-10-02. The sums
      were computed in this design session. That computation is not a
      run. No solver was run.
  scale_relevance:
    tier: toy
    justification: Three indices and two factors. No transfer to a solver.
    correspondence: null
  tail_checks:
    - The bit gap 1 between the two logarithms is required. A check that stops at the ladder sum is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the ladder sum disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The ladder mean is not 7.
    - The end gap is reported as 1.
    - The reproduction tolerance is reported as 4.
    - The base-2 logarithm of 4 is reported as 4.
    - A solver is run or a fitted exponent is stated.
  success_criterion: >-
    Both runs agree that the ladder mean is 7, that the end gap is 2,
    that the cap ratio is 2, and that the base-2 logarithm of 4 is 2.
  falsification_criterion: >-
    The runs agree, the ladder sum is 21, and 21 divided by 3 is not 7.
  required_artifacts:
    - experiments/EXP-SATIC-a1343f/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-SATIC-a1343f/runs/<RUN-ID>/command.txt
    - experiments/EXP-SATIC-a1343f/runs/<RUN-ID>/stdout.log
    - experiments/EXP-SATIC-a1343f/runs/<RUN-ID>/stderr.log
    - experiments/EXP-SATIC-a1343f/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-SATIC-a1343f/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any SAT solver, CNF encoding, or fitted exponent.
    - Any claim that the three tricks compose.
    - Any measured solve time.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
