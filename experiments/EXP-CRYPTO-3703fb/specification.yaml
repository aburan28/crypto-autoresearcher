experiment:
  id: EXP-CRYPTO-3703fb
  hypothesis_id: H-CRYPTO-b2c203
  derived_from_idea: IDEA-20260801-001
  question_id: RQ-CRYPTO-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Installing the GOAL-CRYPTO-001 group-operation-equivalent ruler at secp256k1
    parameters - measured arithmetic cost with a cross-environment error bar, a
    planted-difference responsiveness control, and a strictly separated modelled
    memory-charged rho row
  objective: >-
    The one uncertainty a run reduces is whether this goal can own a shared cost
    denominator with a stated resolution. A run establishes four things. First, the
    GOE cost of a pinned reference scalar multiplication on secp256k1, with a
    seed-derived interval. Second, the agreement of that value across two independent
    execution environments and across two boots of one environment, which is the
    ruler's own error bar and the floor every future speedup claim must clear. Third,
    whether the ruler resolves a PLANTED cost difference of known size, which decides
    whether the instrument may be used to certify the absence of a difference. Fourth,
    a memory-charged parallel-rho row at secp256k1's order, emitted as an explicitly
    MODELLED number whose step-count constant is calibrated against completed rho runs
    at 40, 48 and 56 bits. No attack is mounted, nothing at 256-bit order is searched,
    and no security claim about secp256k1 is made or implied.
  what_this_is_not:
    - >-
      Not an attack, a solve, a distinguisher, or any cryptanalytic result. It is the
      installation of a measurement instrument.
    - >-
      Not a security claim about secp256k1 in either direction, and not a statement
      that any deployed parameter set is affected or safe beyond the explicit scope
      statement in the deliverable.
    - >-
      Not a search at 256-bit order. No discrete logarithm at secp256k1's order is
      attempted at any budget; the 256-bit rho row is modelled and is labelled so in
      every column it appears.
    - >-
      Not a measurement of any candidate mechanism. This contract measures the
      denominator only.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run has
      been executed under this contract.
  claim_ceiling:
    tier: crypto_size_arithmetic_only
    exact_scope_a_run_could_support: >-
      Maximal supportable scope. At secp256k1 parameters with the pinned reference
      routine, coordinate system and toolchain, one scalar multiplication costs a
      stated number of GOE with a stated interval; that value does or does not
      reproduce across the two executed environments to within a stated delta; the
      instrument does or does not recover a planted cost factor within 10 percent; and
      rho at 40, 48 and 56 bits does or does not exhibit the calibration constant
      within 20 percent. WHAT DOES NOT FOLLOW. No measured cost of any attack at
      secp256k1's order - that row is modelled; no security level for secp256k1 or any
      other curve; no claim about environments not executed; and no claim about any
      implementation other than the pinned reference and the deliberately modified
      variant.
  inputs:
    procedure: >-
      STAGE 0, zero compute. Pin and record the reference scalar-multiplication
      routine, coordinate system, toolchain flags and machine-image digest. Declare the
      GOE conversion table - how many GOE one field multiplication, one field squaring
      and one field inversion cost - BEFORE any measurement, because a conversion table
      chosen afterwards can produce any ratio.
      STAGE 1, minutes. Microbenchmark field multiplication, squaring and inversion at
      secp256k1's prime, 10 seeds, reporting counts and the derived GOE per scalar
      multiplication with its interval.
      STAGE 2, minutes. RESPONSIVENESS CONTROL. Run the identical pipeline against a
      deliberately modified scalar-multiplication routine whose field-multiplication
      count differs from the reference by a factor known by construction, and require
      the ruler to recover that factor within 10 percent.
      STAGE 3, minutes to an hour. Repeat Stages 1 and 2 in a second independent
      execution environment with the same pinned image, and in a second boot of the
      first environment. Report both deltas. If a second environment is unavailable,
      record the cross-environment arm UNRUN as infrastructure and report the cross-boot
      arm as the weaker substitute it is.
      STAGE 4, hours. Run parallel Pollard rho with distinguished points to completion
      at reduced orders of 40, 48 and 56 bits, 10 seeds each, recording mean step
      counts, peak stored entries, and the measured ratio to the calibration expression.
      STAGE 5, zero compute. Emit the ruler table with MEASURED and MODELLED columns
      strictly separated, the memory-charged rho row at secp256k1's order computed from
      the Stage 1 per-step GOE and the Stage 4 calibrated constant, every optimistic
      assumption listed with the DIRECTION of its bias, the time-memory tradeoff stated
      with its interpolation range, and an explicit affected-versus-safe scope statement
      saying that no deployed system is claimed affected by anything in this contract.
    instrument: >-
      A new standalone driver under experiments/EXP-CRYPTO-3703fb/driver/ containing the
      field arithmetic, the pinned reference scalar multiplication, the deliberately
      modified variant, the GOE accounting, and the distinguished-point rho harness. All
      compiler or interpreter flags are pinned in the image and recorded; link-time or
      flag drift between measurements makes the comparison invalid. Wall time is recorded
      but never reported as the ruler value. Recorded through harness/runner.py.
    parameters: >-
      secp256k1 at standard parameters for all arithmetic measurements. Reduced-order
      prime-field curves at 40, 48 and 56 bits for the rho calibration arm. Coordinate
      system Jacobian with co-Z arithmetic, pinned. Ten seeds per measurement. Two
      execution environments plus two boots of one of them. The planted modification's
      field-multiplication factor is fixed before Stage 2 and recorded in the manifest,
      and is NOT disclosed to the accounting code.
  controls:
    - >-
      RESPONSIVENESS / POSITIVE CONTROL, mandatory and blocking. The planted-difference
      arm. An instrument that cannot recover a known cost factor cannot certify that a
      candidate mechanism has no advantage, so a failure here voids every negative the
      ruler could produce.
    - >-
      NULL OBJECT OF THE SAME SHAPE. A second measurement of the UNMODIFIED reference
      routine under a different variable name and a fresh seed stream, expected to
      return a factor of 1 within the ruler's own interval. If it does not, the ruler is
      reporting differences that are not there and the responsiveness result is
      meaningless.
    - >-
      KNOWN-ANSWER CALIBRATION. Reduced-order rho runs at 40, 48 and 56 bits, where the
      search completes, checked against the classical step-count expression this program
      records in KN-TECH-001 and KN-TECH-006. The expression is a target this program
      did not choose, which is what makes it a check rather than a fit.
    - >-
      CROSS-ENVIRONMENT AND CROSS-BOOT ARMS, run from the same pinned image and binary
      so that any delta is attributable to the environment.
    - >-
      FLAG AND IMAGE PINNING, with the image digest recorded per measurement. A
      measurement whose recorded digest differs from another's is not comparable to it
      and is excluded rather than averaged in.
    - >-
      ORDERING CONTROL. The GOE conversion table is committed before any measurement is
      taken, so no conversion can be tuned toward a desired ruler value.
  independent_variables:
    - 'routine: pinned reference / deliberately modified variant / reference re-measured (null)'
    - 'environment: environment A / environment B / environment A second boot'
    - group order, at 40, 48, 56 bits for the rho calibration arm
    - seed
  metrics:
    primary:
      - >-
        GOE per reference scalar multiplication at secp256k1, in group-operation
        equivalents. Computed from the counted field operations times the committed
        conversion table, reported with the seed-derived interval.
      - >-
        Cross-environment GOE delta, dimensionless. Computed as the absolute difference
        of the two environments' GOE values divided by the smaller of the two, per seed
        and as a maximum over seeds.
      - >-
        Cross-boot GOE delta, dimensionless, computed the same way within one
        environment.
      - >-
        Planted-difference recovery error, dimensionless. Computed as the recovered cost
        factor divided by the factor planted by construction, minus 1.
      - >-
        Reduced-order rho constant deviation, dimensionless. Computed as the measured
        mean step count divided by the calibration expression evaluated at the same
        order, per order.
    secondary:
      - >-
        Measured field multiplication, squaring and inversion counts and their wall
        times, reported separately so that the conversion table can be re-applied by a
        reader who disagrees with it.
      - >-
        Peak stored distinguished points at each reduced order, measured, reported
        beside the analytic size of the distinguished-point store.
      - >-
        Null-arm recovered factor, expected 1 within the ruler's interval.
      - >-
        The modelled memory-charged rho row at secp256k1's order, with its formula, its
        measured input, its memory term and its parallelization term stated separately.
      - >-
        Recorded machine-image digest and flag set per measurement.
  heuristic_under_test: HEUR-CRYPTO-RULER-1
  preregistered_prediction:
    quantity: >-
      The maximum cross-environment GOE delta over the 10 seeds, the planted-difference
      recovery error, and the reduced-order rho constant deviation at each of 40, 48 and
      56 bits.
    formula: >-
      Predicted maximum cross-environment delta at most 0.02 relative, and likewise
      cross-boot. Predicted planted recovery error at most 0.10 in absolute value.
      Predicted rho constant deviation within 0.20 of 1 at every reduced order. Under
      the null that GOE accounting does not remove host dependence, the cross-environment
      delta tracks the wall-time delta rather than staying below 0.02, and
      HEUR-CRYPTO-RULER-1 is refuted.
    source: >-
      Pre-registered in the parent proposal IDEA-20260801-001, whose minimal_test
      requires reproducibility within 2 percent across hosts and whose
      HEUR-CRYPTO-RULER-1 states the 2 percent claim. The 10 percent responsiveness
      tolerance and the 20 percent rho-constant tolerance are coordinator additions,
      recorded here before any run and never adjusted afterwards.
  scale_relevance:
    tier: crypto_size_arithmetic_only
    justification: >-
      The ARITHMETIC is measured at genuine secp256k1 parameters, which is possible
      because measuring the cost of an operation does not require solving anything. The
      SEARCH is not: no rho at 256-bit order is executed here or anywhere in this
      program at any budget. The design therefore splits at exactly that line - measured
      arithmetic at deployed size, modelled step count from a constant calibrated at 40
      to 56 bits. The transfer assumption is explicit and narrow: that the step-count
      constant measured at 40 to 56 bits is the constant that applies at 256 bits. That
      assumption is the one thing the modelled row rests on, it is stated rather than
      buried, and it is what makes the row a bound rather than a prediction.
    correspondence: null
  tail_checks:
    - >-
      Report the maximum, not only the mean, of the per-seed cross-environment delta,
      since a ruler is used one measurement at a time and a good mean with a bad
      maximum is not reproducible.
    - >-
      Report the full distribution of rho step counts at each reduced order and the
      longest completed run against the predicted upper quantile, since the rho length
      is heavy-tailed and a mean alone hides that.
    - >-
      Report any measurement excluded for a mismatched image digest, and why, rather
      than silently dropping it.
    - >-
      Report the superpolynomial or lower-order terms the modelled row omits, and their
      direction, since a modelled attack cost that omits terms is an underestimate and
      must be labelled a bound.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
      - 20260828
      - 20260829
      - 20260830
      - 20260831
      - 20260901
      - 20260902
      - 20260903
    independent_instances: 10
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 4.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
    - >-
      Abort and report if the null arm - the reference re-measured - returns a factor
      outside the ruler's own interval, since the responsiveness result would then be
      uninterpretable.
    - >-
      Abort the cross-environment arm and record it UNRUN if a second independent
      environment with the same pinned image cannot be obtained. This is infrastructure,
      not a result.
    - >-
      Stop the rho calibration arm at 56 bits; larger reduced orders are outside this
      contract and require a new one.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion
      is a stop, never a negative result, under AGENTS.md rule 5.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence.
    - >-
      A run whose measurements carry differing machine-image digests or flag sets, and
      which nevertheless reports a cross-environment delta from them, is
      invalid_measurement.
    - >-
      A run whose GOE conversion table was written or altered after any measurement was
      inspected is invalid_measurement.
    - >-
      A deliverable in which a measured and a modelled number appear in the same column
      is rejected and the run is returned; the separation is the contract's central
      honesty requirement.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT experiment and
      requires a new contract; it is never a repair of this one.
  success_criterion: >-
    The run is successful when the GOE per reference scalar multiplication is reported
    with its interval, the cross-boot delta is reported and the cross-environment delta
    is either reported or recorded UNRUN with its reason, the planted-difference recovery
    error is reported, the reduced-order rho constant deviations are reported at all
    three orders, and the ruler table is emitted with measured and modelled columns
    separated, optimistic assumptions listed with their bias direction, memory as its own
    metric, and an explicit affected-versus-safe scope statement. Success means a
    DECIDABLE run. H-CRYPTO-b2c203 is confirmed only if, in addition, both deltas are at
    or below 2 percent, the recovery error is within 10 percent, and every rho constant
    deviation is within 20 percent.
  falsification_criterion:
    - >-
      The maximum cross-environment or cross-boot delta exceeds 2 percent. Limb R1 and
      HEUR-CRYPTO-RULER-1 are FALSE. The ruler is host-specific; the measured spread
      becomes this goal's error floor and every speedup ratio must be quoted with its
      host. This is a genuine negative and is recorded as one.
    - >-
      The planted-difference recovery error exceeds 10 percent, or the null arm returns
      a factor outside the ruler's interval. Limb R2 is FALSE, the instrument is VOID,
      and no negative about any candidate mechanism may be read from it.
    - >-
      Any reduced-order rho constant deviation exceeds 20 percent. Limb R3 is FALSE; the
      measured arithmetic columns stand but the modelled 256-bit row is WITHHELD, because
      its constant is not exhibited by this implementation.
    - >-
      The GOE values agree across environments while wall times differ by more than a
      factor 2 with no recorded hardware difference. Not a falsification, but an
      unexplained anomaly that must be preserved and explained before the ruler is used
      by any other record.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model
      and inference block, environment, machine-image digest and the full pinned flag set.
    - >-
      The GOE conversion table, hashed and committed before the first measurement.
    - >-
      raw-result.json carrying every per-seed, per-environment, per-routine measurement,
      not summaries.
    - >-
      The planted modification's construction and its factor, recorded so the
      responsiveness claim is independently checkable.
    - >-
      The null-arm measurements, in the same file as the signal arm.
    - >-
      The reduced-order rho raw step counts per seed, not only their means.
    - >-
      The ruler table with measured and modelled columns separated, the optimistic
      assumptions and their bias directions, the time-memory tradeoff with its
      interpolation range, and the affected-versus-safe scope statement.
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution, and under this engagement
      approval is the USER's gate because it authorizes execution and spends compute.
      This contract is review_required and is NOT approved; approved_by is null and
      execution_authorized is false.
    - >-
      The GOE conversion table must be fixed and committed at approval time. A table
      left open until run time defeats the ordering control that makes this measurement
      auditable.
    - >-
      This is a cost-model measurement contract. Its deliverable must be reviewed for
      measured-versus-modelled separation, optimistic-assumption disclosure with bias
      direction, first-class memory accounting, and hidden lower-order overhead honesty
      before any other record cites it.
  derivation_provenance:
    tool: coordinator subagent, design-experiment step
    source_record: IDEA-20260801-001
    authored_at: '2026-08-25'
    note: >-
      The 2 percent reproducibility tolerance, the two-host design, the pinned-flag
      control and the GOE unit come from the parent proposal's minimal_test and
      heuristic_assumptions. The responsiveness control with a planted factor, the null
      re-measurement arm, the reduced-order rho calibration and the strict
      measured-versus-modelled column separation are coordinator additions made so that
      the contract has an outcome that counts as negative and so that no 256-bit number
      is presented as measured. Budgets come from the parent's declared cost of medium
      implementation and low compute.
  derivation_gaps:
    - >-
      The parent proposal's falsification condition that experiments fail to CITE the
      ruler is a governance outcome about this program's future behaviour, not a
      property of any run, and is deliberately NOT carried into this contract. Adopting
      it would make the contract undecidable from its own metrics.
    - >-
      The GOE conversion table is not supplied by the parent and must be fixed by a
      Coordinator before approval. Choosing it after seeing the microbenchmarks is the
      single most likely way this contract would silently become a claim.
    - >-
      Whether the reference routine should be constant-time is unsettled. A
      constant-time ladder and a windowed non-constant-time ladder have materially
      different GOE and the ruler is meaningless if a later experiment silently uses the
      other one.
    - >-
      The availability of a second independent execution environment is unknown at
      authoring time. If it does not exist, R1 cannot be tested as stated and the
      cross-boot arm is a weaker substitute, which the contract requires be labelled as
      such rather than reported as a host comparison.
    - >-
      The 10 percent responsiveness and 20 percent rho-constant tolerances are
      coordinator-set, not derived. They are pre-registered so they cannot move after the
      measurement.
