  protocol_deviations:
    - >-
      derive_s4.py was not executed, because doing so rewrites files inside
      EXP-MONO-815525. Its symbolic claims were re-verified at run time by
      Stage-0 checks (0a) and (0a2) without sympy and without trusting
      derivation_checks.json. See stage_0.deviation.
    - >-
      Four curves at two primes were used, exceeding the minimum of two, so
      that the non-isogeny check is non-vacuous WITHIN each prime rather than
      only across primes.
    - >-
      Sample size exceeds the contract minimum of 10000 per curve: C1 and C2
      are exhaustive (1030301 base points each, the option the contract
      explicitly permits and prefers) and C3 and C4 use 100000 uniform draws
      each. Fixed before any Stage-1 result was observed; not adjusted after.
    - >-
      The five-class label uses the projective (degree-4 fibre) reading, with
      the (4 - deg Q_e) roots at T = infinity restored, because c_4 can vanish
      and leave an affine partition of 3 that is none of the contract's five
      classes. The literal affine pattern and deg_T Q_e are also recorded for
      every instance, so the choice is fully reversible.
    - >-
      Ramified (non-squarefree) instances are included in the pre-registered
      M3 exactly as specified and are disclosed separately; the
      squarefree-subset statistic is reported as M3b and labelled descriptive.
    - >-
      THREE EXECUTIONS, ALL DISCLOSED, NONE DISCARDED. The first was wrapped
      in /usr/bin/time -l, which exited 1 and wrote a sandbox error
      ("sysctl kern.clockrate: Operation not permitted") into stderr.log
      although the Python program itself completed normally. It was re-executed
      without that wrapper to obtain a clean stderr and a true exit code (0);
      the archived artifacts are from that second execution. A third execution
      to a scratch path was diffed field by field against the archived
      raw-result.json: every mathematical field was identical, the only
      differences being measured wall_seconds, cpu_seconds and peak_rss_bytes.
      No execution differed in any result and none was discarded for being
      unfavourable.
    - >-
      No git command was run and no commit sha is recorded, per the
      dispatching Coordinator's explicit instruction for this shared working
      directory. The run is bound instead by the sha256 map in the manifest,
      including the sha256 of the frozen specification it executed against.

