  # ==================================================================
  curves_and_isogeny_disclosure:
    n_curves: 4
    n_primes: 2
    contract_minimum: "2 non-isogenous ordinary curves, j not in {0,1728}, 2 primes in [101,2000]"
    criterion: >-
      Tate: two elliptic curves over the SAME F_p are isogenous over F_p iff
      they have equal group order, equivalently equal trace of Frobenius.
      Curves over different primes live over different fields and are not
      isogenous. #E was computed by exhaustive Legendre-symbol point count.
    curves:
      - {id: C1, p: 101,  A: 2, B: 3,  j: 74,  order: 96,   trace: 6,   cm_discriminant_t2_minus_4p: -368,  ordinary: true, j_not_special: true, nonsingular: true, mode: exhaustive}
      - {id: C2, p: 101,  A: 1, B: 35, j: 63,  order: 121,  trace: -19, cm_discriminant_t2_minus_4p: -43,   ordinary: true, j_not_special: true, nonsingular: true, mode: exhaustive}
      - {id: C3, p: 1009, A: 5, B: 7,  j: 459, order: 966,  trace: 44,  cm_discriminant_t2_minus_4p: -2100, ordinary: true, j_not_special: true, nonsingular: true, mode: random}
      - {id: C4, p: 1009, A: 2, B: 30, j: 929, order: 1072, trace: -62, cm_discriminant_t2_minus_4p: -192,  ordinary: true, j_not_special: true, nonsingular: true, mode: random}
    same_field_pairs:
      - {pair: [C1, C2], p: 101,  traces: [6, -19],  orders: [96, 121],   isogenous_over_Fp: false}
      - {pair: [C3, C4], p: 1009, traces: [44, -62], orders: [966, 1072], isogenous_over_Fp: false}
    cross_field_pairs_trivially_non_isogenous: [[C1, C3], [C1, C4], [C2, C3], [C2, C4]]
    any_isogenous_pair: false
    predecessor_error_avoided: >-
      EXP-MONO-815525 disclosed that its own C1 (p=101, A=2, B=3) and C5
      (p=101, A=37, B=29) both have order 96 / trace 6 and are therefore
      isogenous, so they were not independent. This run independently
      re-confirmed that during curve selection and deliberately avoided it:
      C1 here is EXP-MONO-815525's own C1, but its p=101 partner is a NEW
      curve (A=1, B=35, trace -19), not A=37/B=29. The run aborts as
      failed_infrastructure if any declared same-field pair has equal trace.

  # ==================================================================
  stage_1:
    name: unconditioned five-class census
    sampling_rule: >-
      UNCONDITIONED. (e1,e2,e3) taken EXHAUSTIVELY over all of F_101^3 in
      lexicographic order on C1 and C2, and drawn UNIFORMLY and independently
      from F_1009^3 on C3 and C4 (100000 draws each, ten times the contract
      minimum of 10000). There is NO filter on g's own factorization type --
      this is the entire correction relative to EXP-MONO-815525. g's type is
      RECORDED for every instance and cross-tabulated against the class label,
      but is never used to accept or reject a base point.
    only_exclusion:
      rule: "Res(g, f) = 0, with g = X^3 - e1 X^2 + e2 X - e3 and f = X^3 + A X + B"
      meaning: "g and f share a root in the algebraic closure; when f is irreducible this degenerates to g == f"
      implementation: >-
        Locally written Euclidean-algorithm resultant with full
        leading-coefficient bookkeeping, cross-checked against RC.pgcd on 2000
        probes per curve at Stage 0 (check 0f, PASS).

    accounting:
      base_points_drawn_pooled: 2260602
      excluded_resultant_zero_pooled: 10708
      Qe_identically_zero_pooled: 0
      classified_pooled: 2249894
      identity_drawn_equals_classified_plus_excluded_plus_zero: true

    # ---- M4: exclusion counts, disclosed exactly
    M4_exclusion_counts:
      pooled: 10708
      per_curve: {C1: 10301, C2: 1, C3: 101, C4: 305}
      exactness_check: >-
        On C1 the exhaustive count 10301 = p^2 + p - 1 with p=101, which is
        the exact number of monic cubics g sharing a root with an f that
        factors as (linear)(irreducible quadratic). On C2 it is exactly 1,
        the exact count when f is irreducible over F_p (the only monic cubic
        sharing a root with an irreducible cubic is that cubic itself). C3 and
        C4 are random-mode: 101 and 305 exclusions in 100000 draws, against
        densities of about 1/p and 3/p. All four are consistent with the
        exclusion rule being applied exactly as specified.

    # ---- M2: the complete five-class distribution
    M2_class_counts_pooled:
      "1^4": 106003
      "2+2": 265941
      "2+1+1": 562304
      "4": 562534
      "3+1": 753112
      total: 2249894
    M2_class_frequencies_pooled:
      "1^4": 0.047115
      "2+2": 0.118202
      "2+1+1": 0.249925
      "4": 0.250027
      "3+1": 0.334732
    M2_class_counts_per_curve:
      C1: {"1^4": 47218, "2+2": 119618, "2+1+1": 258964, "4": 250800, "3+1": 343400, total: 1020000, mode: exhaustive}
      C2: {"1^4": 50262, "2+2": 121770, "2+1+1": 253380, "4": 261590, "3+1": 343298, total: 1030300, mode: exhaustive}
      C3: {"1^4": 4232,  "2+2": 12390,  "2+1+1": 25033,  "4": 25143,  "3+1": 33101,  total: 99899,   mode: random}
      C4: {"1^4": 4291,  "2+2": 12163,  "2+1+1": 24927,  "4": 25001,  "3+1": 33313,  total: 99695,   mode: random}
    M2_class_frequencies_per_curve:
      C1: {"1^4": 0.046292, "2+2": 0.117273, "2+1+1": 0.253886, "4": 0.245882, "3+1": 0.336667}
      C2: {"1^4": 0.048784, "2+2": 0.118189, "2+1+1": 0.245928, "4": 0.253897, "3+1": 0.333202}
      C3: {"1^4": 0.042363, "2+2": 0.124025, "2+1+1": 0.250583, "4": 0.251684, "3+1": 0.331345}
      C4: {"1^4": 0.043041, "2+2": 0.122002, "2+1+1": 0.250033, "4": 0.250775, "3+1": 0.334149}

    no_class_discarded: true
    no_instance_discarded: true
    completeness_statement: >-
      Per-class, per-affine-pattern, per-deg_T, per-ramification and joint
      (g-type x class) counts are EXACT and COMPLETE for all 2249894
      classified instances, per curve and pooled. Full per-instance records
      are retained in raw-result.json for up to 60 instances per class per
      curve and up to 400 exclusions per curve; storing all 2249894 would
      exceed the contract's 20 MB disk budget by roughly two orders of
      magnitude. NOTHING IS DROPPED FROM ANY COUNT. C1 and C2 are exhaustive,
      so their per-instance data is fully regenerable with no randomness at
      all; C3 and C4 are regenerable from seed 20260904003 and the documented
      consumption order of the single random stream.

    descriptive_context_recorded_but_never_used_as_a_filter:
      deg_T_Qe_counts_pooled: {"3": 20509, "4": 2229385}
      deg_T_note: >-
        Q_e's leading coefficient c_4(e1,e2,e3) can vanish -- an anomaly
        EXP-MONO-815525 itself disclosed -- leaving Q_e of degree 3, whose
        affine factorization is a partition of 3 and therefore not one of the
        contract's five classes. The fibre nonetheless always has 4 points in
        P^1. The five-class label therefore restores the (4 - deg Q_e) roots
        at T = infinity as F_p-rational fibre points, exactly as
        EXP-MONO-815525's own `projective_degrees` statistic did. The literal
        affine pattern and deg_T Q_e are ALSO recorded for every instance, so
        a reviewer can reverse this choice completely.
      ramified_non_squarefree_Qe_pooled: 30676
      ramified_by_class_pooled: {"1^4": 15615, "2+2": 98, "2+1+1": 14963, "4": 0, "3+1": 0}
      ramified_note: >-
        A non-squarefree Q_e is a ramified fibre and does not carry a
        well-defined Frobenius conjugacy class. These instances are counted
        and disclosed but are NOT excluded from the pre-registered M3
        statistic below, which is computed over all classified instances
        exactly as the contract specifies.
      g_factorization_type_counts_pooled: {"1+1+1": 381721, "1+2": 1114960, "3": 753213}

  # ==================================================================
  # Stage 2 -- M3 and M1 are DISTINCT results and are NOT merged into a
  # single verdict (specification.yaml invalidation_rules, item 3).
  # ==================================================================
  stage_2_M3_frequency_match_statistic:
    what_this_is: >-
      The pre-registered frequency-match statistic ONLY. It is not, and must
      not be read as, a verdict on any subgroup; that is M1 below.
    frozen_predicted_density_source: "specification.yaml stage_2 / preregistered_prediction M3"
    frozen_predicted_density: {"1^4": 0.0416667, "2+2": 0.125, "2+1+1": 0.25, "4": 0.25, "3+1": 0.3333333}
    test: "Pearson chi-square goodness of fit, 4 degrees of freedom, no fitted parameters"
    critical_values: {"0.05": 9.4877, "0.01": 13.2767}
    chi_square_pooled: 2447.843653
    chi_square_per_curve:
      C1: {statistic: 1175.812894, n: 1020000, p: 101,  mode: exhaustive}
      C2: {statistic: 1765.875054, n: 1030300, p: 101,  mode: exhaustive}
      C3: {statistic: 4.375719,    n: 99899,   p: 1009, mode: random}
      C4: {statistic: 12.127970,   n: 99695,   p: 1009, mode: random}
    per_class_contribution_pooled:
      "1^4":   {observed: 106003, expected: 93745.5833,  term: 1602.680980}
      "2+2":   {observed: 265941, expected: 281236.7500, term: 831.896856}
      "2+1+1": {observed: 562304, expected: 562473.5000, term: 0.051078}
      "4":     {observed: 562534, expected: 562473.5000, term: 0.006507}
      "3+1":   {observed: 753112, expected: 749964.6667, term: 13.208232}
      note: >-
        These are the exact values from raw-result.json
        stage_2.M3_chi_square_pooled.terms. They sum to 2447.843653.
    observations_recorded_without_interpretation:
      - >-
        The pooled statistic 2447.84 on df=4 is far above the 0.01 critical
        value 13.28.
      - >-
        The excess is not spread across the five classes. Classes 2+1+1
        (0.249925), 4 (0.250027) and 3+1 (0.334732) match their predicted
        0.25, 0.25 and 0.333333 to within 1.4e-3 and contribute 13.266 of
        the 2447.844 total, while 1^4 alone contributes 1602.681 and 2+2
        contributes 831.897. The whole excess sits in 1^4 (over-represented,
        0.047115 vs 0.041667) and 2+2 (under-represented, 0.118202 vs
        0.125000).
      - >-
        The statistic is not uniform across curves. At p=1009 it is 4.38 (C3)
        and 12.13 (C4) on n ~ 100000; at p=101 it is 1175.81 (C1) and 1765.88
        (C2) on n ~ 1020000.
      - >-
        Two of the four curves are censused EXHAUSTIVELY over all of F_p^3, so
        for them the chi-square is not a sampling test at all: for any fixed
        nonzero bias it grows without bound with n. The Executor reports the
        pre-registered statistic unchanged and does not adjust it.
    M3b_squarefree_subset_descriptive:
      statistic: 978.266265
      n: 2219218
      status: >-
        DESCRIPTIVE SECONDARY, NOT the pre-registered statistic and NOT a
        replacement for it. Reported because Chebotarev density is a statement
        about unramified fibres and 30676 classified instances have a
        non-squarefree Q_e, all of them in classes 1^4 and 2+2 and 2+1+1.
    M3c_frequency_deviation_diagnostic:
      status: >-
        DESCRIPTIVE. Declared in the source before the full-scale run was
        executed. Does not adjust M3.
      abs_deviation_pooled: {"1^4": 0.005448, "2+2": 0.0067984, "2+1+1": 0.0000753, "4": 0.0000269, "3+1": 0.0013989}
      abs_deviation_per_curve:
        C1: {p: 101,  "1^4": 0.0046255, "2+2": 0.0077275, "2+1+1": 0.0038863, "4": 0.0041176, "3+1": 0.0033333}
        C2: {p: 101,  "1^4": 0.0071172, "2+2": 0.0068111, "2+1+1": 0.0040716, "4": 0.0038969, "3+1": 0.0001314}
        C3: {p: 1009, "1^4": 0.0006961, "2+2": 0.0009747, "2+1+1": 0.0005831, "4": 0.0016842, "3+1": 0.0019887}
        C4: {p: 1009, "1^4": 0.0013746, "2+2": 0.0029979, "2+1+1": 0.0000326, "4": 0.0007749, "3+1": 0.0008158}
      observation: >-
        The per-class absolute deviations are roughly 3 to 7 times smaller at
        p=1009 than at p=101 for classes 1^4 and 2+2. Recorded as observed;
        two primes cannot establish a rate and the Executor asserts none.

  # ==================================================================
  stage_2_M1_per_subgroup_existence_checks:
    what_this_is: >-
      Existence checks ONLY, one per named transitive subgroup of S_4,
      logically independent of the M3 statistic above and of each other. A
      subgroup is falsified as the monodromy group iff at least one observed
      instance lies in a factorization class that subgroup cannot realise.
      These are reported separately and are NOT merged with M3.
    transitive_subgroups_of_S4_considered: [C_4, V_4, D_4, A_4, S_4]
    checks:
      - subgroup: A_4
        order: 12
        cycle_types_realised: ["1^4", "2+2", "3+1"]
        classes_predicted_impossible: ["2+1+1", "4"]
        observed_counts_in_those_classes: {"2+1+1": 562304, "4": 562534}
        falsified_by_observed_presence: true
        note: "Both predicted-impossible classes are populated, each with over half a million witnesses."
      - subgroup: D_4
        order: 8
        cycle_types_realised: ["1^4", "2+1+1", "2+2", "4"]
        classes_predicted_impossible: ["3+1"]
        observed_counts_in_those_classes: {"3+1": 753112}
        falsified_by_observed_presence: true
        note: "D_4 contains no 3-cycles; 753112 observed instances factor as (irreducible cubic)(linear)."
      - subgroup: C_4
        order: 4
        cycle_types_realised: ["1^4", "2+2", "4"]
        classes_predicted_impossible: ["2+1+1", "3+1"]
        observed_counts_in_those_classes: {"2+1+1": 562304, "3+1": 753112}
        falsified_by_observed_presence: true
      - subgroup: V_4
        order: 4
        cycle_types_realised: ["1^4", "2+2"]
        classes_predicted_impossible: ["2+1+1", "4", "3+1"]
        observed_counts_in_those_classes: {"2+1+1": 562304, "4": 562534, "3+1": 753112}
        falsified_by_observed_presence: true
      - subgroup: S_4
        order: 24
        cycle_types_realised: ["1^4", "2+1+1", "2+2", "3+1", "4"]
        classes_predicted_impossible: []
        observed_counts_in_those_classes: {}
        falsified_by_observed_presence: false
    witnesses_recorded: >-
      raw-result.json stage_2.M1_per_subgroup_existence_checks carries, for
      each falsified subgroup, explicit witness instances with their exact
      (e1,e2,e3), full Q_e coefficient vector, projective factor degrees,
      squarefree flag and g factor type. Every witness class also has up to 60
      fully specified example instances per curve under
      stage_1.per_curve[*].class_examples.
    robustness_of_M1_to_the_ramification_question: >-
      Every falsification above is witnessed in classes whose observed counts
      remain in the hundreds of thousands after the 30676 ramified instances
      are set aside: classes 4 and 3+1 contain ZERO ramified instances at all,
      and class 2+1+1 retains 547341 unramified instances. No M1 verdict
      depends on a ramified fibre.
    robustness_of_M1_to_the_projective_reading: >-
      20509 of 2249894 instances have deg_T Q_e = 3 and so depend on the
      root-at-infinity convention. All M1 witness classes retain hundreds of
      thousands of instances with deg_T Q_e = 4 exactly, so no M1 verdict
      depends on that convention either.

  # ==================================================================
  stage_2_full_S4_systematic_absence_check:
    what_this_is: >-
      The contract's other falsification branch: full S_4 is falsified by
      systematic ABSENCE of a class it predicts should be common.
    classes_with_zero_observed_instances: []
    minimum_observed_class_count: 106003
    expected_counts_under_S4_pooled: {"1^4": 93745.58, "2+2": 281236.75, "2+1+1": 562473.50, "4": 562473.50, "3+1": 749964.67}
    full_S4_falsified_by_systematic_absence: false
    note: >-
      All five classes are populated on ALL FOUR curves individually as well
      as pooled; the smallest per-curve class count is 4232 (class 1^4 on C3).

  # ==================================================================
  additional_observations_recorded_not_interpreted:
    - id: OBS-1
      title: The five-class label is almost entirely determined by g's own factorization type
      detail: >-
        The complete joint cross-tabulation is in raw-result.json
        stage_1.per_curve[*].joint_g_type_by_class_counts. Pooled over all four
        curves: every instance with g IRREDUCIBLE landed in class 3+1 except
        101 instances (all on C2) that landed in 1^4; every instance with
        g = (linear)(irreducible quadratic) landed in 2+1+1 or 4 except 2551
        that landed in 1^4; and every instance with g SPLIT landed in 1^4 or
        2+2 except 12429 that landed in 2+1+1. Within the g = (linear)(irred
        quadratic) block the split between 2+1+1 and 4 is close to even on
        every curve (C1 251641 vs 250800; C3 24968 vs 25143). This pattern is
        the same partition of the five classes induced by the natural
        surjection S_4 -> S_4/V_4 = S_3. Recorded as a structural observation;
        the Executor draws no conclusion from it.
      operational_relevance: >-
        This is also the exact mechanism by which EXP-MONO-815525's
        g-irreducible conditioning selected class 3+1 with probability close
        to 1 and therefore carried no discriminating power, as its red-team
        report established by null-object control.
    - id: OBS-2
      title: Exact internal-consistency identities held
      detail: >-
        (i) On C1 the exhaustive count of irreducible g is 343400 =
        (101^3 - 101)/3, the exact number of monic irreducible cubics over
        F_101; on C2 it is 343399, i.e. that number minus the single excluded
        g = f. (ii) The exclusion counts match their exact predicted values
        (see M4_exclusion_counts.exactness_check). (iii) The accounting
        identity drawn == classified + excluded + identically_zero holds
        exactly at 2260602 = 2249894 + 10708 + 0.
    - id: OBS-3
      title: Ramification is confined to three classes
      detail: >-
        Of 30676 non-squarefree Q_e instances, 15615 are in class 1^4, 14963
        in 2+1+1 and 98 in 2+2 (all 98 on C1). Classes 4 and 3+1 contain no
        ramified instance at all, on any curve.

