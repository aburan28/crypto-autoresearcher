experiment:
  id: EXP-MONO-0e6e8f
  version: 1
  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-09-04'
  hypothesis_id: H-MONO-ebd400
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  coordinator_approval_rationale: >-
    APPROVED. This is DEC-20260904-858cdc's own named next_action: the
    unconditioned five-class Chebotarev census the Red Team identified as
    genuinely discriminating (unlike its predecessor EXP-MONO-815525,
    proven by an explicit null-object control to have zero discriminating
    power). Reuses EXP-MONO-815525's own already-independently-verified
    S_4/Q_e(T) construction unmodified; the only new content is the
    sampling design. Before approving, this Coordinator independently
    confirmed each named falsification branch is non-empty (per
    H-MONO-ebd400's own falsification_condition field, cross-checked
    against EXP-MONO-815525's own already-archived raw-result.json): class
    3+1 already has 681,538+ confirmed instances; the rejected-draw data
    the Red Team's own review disclosed (2,836 rejected g-reducible draws
    on C1 alone, containing genuine 2+2 and irreducible-quartic instances)
    confirms classes 2+2 and 4 are non-empty in principle. This addresses
    the exact design gap CORR-20260904-293257 disclosed in this
    Coordinator's own prior contract.

  title: >-
    Unconditioned five-class Chebotarev census of the m=4 symmetric-base
    Semaev cover: does the observed factorization-class distribution match
    full S_4, or does it show systematic absence of a class only full S_4
    predicts?

  what_this_is_not:
    - Not a discrete-logarithm computation, not an ECDLP attack, not relation collection.
    - Not an ECDLP cost, runtime, exponent, or cryptographic-scale claim.
    - >-
      Not IDEA-20260904-ad63fe's own full four-arm calibration ladder or
      exact matched-(t,Z) integer test -- those remain separate, larger,
      not-yet-approved work.
    - Not a claim about m != 4.
    - >-
      Not a repeat of EXP-MONO-815525's own g-irreducible-conditioned
      design, which is now proven to have zero discriminating power and is
      explicitly NOT reused here beyond its own underlying S_4 construction.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: whether, on the specific curves and primes tested, the
      observed five-class factorization distribution is consistent with
      full S_4 Chebotarev density, or whether it shows a specific,
      named-subgroup-consistent pattern of systematic absence. A pass is
      toy-scale supportive evidence for full S_4, not a proof for every
      curve; a named-subgroup match is a complete falsification of full
      S_4 at this scale, regardless of sample size, per the pre-checked
      falsification branches.
    what_no_outcome_can_support: >-
      No outcome supports any relation-rate, cost, exponent, or
      cryptographic-scale claim. No outcome resolves m != 4. No outcome by
      itself closes KN-OPEN-009.

  inputs:
    construction_reused: >-
      EXP-MONO-815525's own independently-verified Q_e(T) construction
      (implementation/derive_s4.py and run_census.py), reused UNMODIFIED.
      Load by file path; do not re-derive from scratch.
    domain: EXP-MONO-0e6e8f/v1
    curves: >-
      At least 2 independent, NON-ISOGENOUS ordinary curves (explicitly
      check and disclose isogeny class -- e.g. via trace and CM
      discriminant -- per EXP-MONO-815525's own review finding that two
      of its five curves were isogenous and hence not independent), j not
      in {0,1728}, at 2 independent toy primes in [101, 2000].
    base_point_construction: >-
      Draw (e1,e2,e3) UNIFORMLY from F_p^3, WITHOUT any filter on g's own
      factorization type (this is the entire correction relative to
      EXP-MONO-815525). EXPLICITLY EXCLUDE the degenerate case Res(g,f)=0
      (check and skip; disclose the exact count excluded).
    sample_size: >-
      At least 10,000 unconditioned base points per curve (20,000+ total
      across the 2 curves), or exhaustive enumeration over F_p^3 if p is
      small enough to make that cheaper (matching this session's own
      established preference for exhaustive over random search wherever
      affordable).

  stage_order:
    stage_0:
      name: reuse and re-verify Q_e(T)
      compute: seconds
      description: >-
        Load EXP-MONO-815525's own construction by file path. Re-run its
        own construction-verification checks (degree, ordered-base
        baseline reproduction, symmetry) as a sanity check before
        proceeding -- do not silently trust a prior artifact without
        re-confirming it loads and behaves identically.
    stage_1:
      name: unconditioned five-class census
      compute: minutes
      description: >-
        For each qualifying base point (Res(g,f) != 0, no other filter),
        determine g's own factorization type (for descriptive context) and
        factor Q_e(T) over F_p via the same squarefree/distinct-degree
        method already used and verified in EXP-MONO-815525. Classify into
        exactly one of the five S_4-conjugacy-class-matching patterns:
        1^4, 2+2, 2+1+1, 4 (irreducible quartic), 3+1. Record every single
        instance's exact classification -- no discarding, no summarizing
        away any instance.
    stage_2:
      name: report and compare against the pre-registered Chebotarev density
      compute: seconds
      description: >-
        Report the full five-class frequency distribution, per curve and
        pooled. Compare against the predicted S_4 density (1/24, 1/8, 1/4,
        1/4, 1/3) via a chi-square goodness-of-fit test. Separately and
        explicitly check EACH named subgroup's own falsification condition
        (does any instance appear in a class that subgroup predicts
        impossible?). Report both the frequency-match statistic AND the
        per-subgroup existence checks as distinct, separately meaningful
        results -- do not conflate them into a single verdict.

  metrics:
    primary:
      - "M1: per-subgroup falsification check -- for A_4, D_4, V_4, C_4 (and any other proper transitive subgroup with a nonempty predicted-impossible class), does any observed instance fall in a class that subgroup predicts impossible?"
    secondary:
      - "M2: the full five-class observed frequency distribution, pooled and per-curve."
      - "M3: chi-square goodness-of-fit statistic comparing M2 against the predicted full-S_4 density."
      - "M4: the exact count of Res(g,f)=0 exclusions, disclosed."

  preregistered_prediction:
    - quantity: M1
      value: "No falsification for any named subgroup would mean the observed support alone doesn't distinguish them from S_4; a falsification for a SPECIFIC subgroup rules that subgroup out completely."
      formula: "See falsification_condition in H-MONO-ebd400."
      source: H-MONO-ebd400.
    - quantity: M3
      value: "Chi-square consistent with full S_4 density (1/24,1/8,1/4,1/4,1/3) at conventional significance, under the full-S_4 hypothesis."
      formula: "Standard chi-square goodness-of-fit against S_4's own conjugacy-class-weighted Chebotarev density."
      source: Standard Chebotarev-census methodology; informally corroborated by the Red Team's own pilot (chi-square ~4.5-4.9) in the review round that named this design.

  replication:
    planned_runs: 1
    seeds: [20260904003]
    interpretation: >-
      Deterministic once curves, primes, and search order are fixed;
      exact reproducibility from the recorded curves and search order.

  budget:
    maximum_runs: 1
    maximum_wall_seconds: 1200
    maximum_cpu_seconds: 1200
    maximum_peak_rss_bytes: 268435456
    maximum_total_disk_bytes: 20971520
    maximum_workers: 1
    no_network: true

  environment_preconditions:
    consequence: NO CAS AND NO SOLVER IS REQUIRED. Pure Python, reusing EXP-MONO-815525's own verified implementation.
    if_a_precondition_fails: >-
      A missing interpreter, a failed Stage-0 re-verification, or an
      arithmetic exception is `failed_infrastructure`, never negative
      mathematical evidence (AGENTS.md rule 3).

  infrastructure_failure_disposition: >-
    Any crash or failed Stage-0 re-verification is recorded with its exact
    cause and classified `failed_infrastructure`. Supports and weakens
    NOTHING about H-MONO-ebd400 or IDEA-20260904-ad63fe.

  stopping_rules:
    - Do not execute unless separately reviewed, approved, frozen and authorized. (Satisfied here.)
    - Stop and report `failed_infrastructure` if Stage 0's own re-verification fails.
    - Do not silently discard a disconfirming instance in any class.

  invalidation_rules:
    - Any execution while frozen, execution_authorized or evidence_eligible is false.
    - Any post-hoc change to the sampling rule (e.g. adding a filter) after observing any Stage-1 result.
    - Any conflation of the M1 per-subgroup existence checks with the M3 frequency-match statistic into a single verdict.

  success_criterion: >-
    A run is well-formed evidence if: Stage 0's re-verification is
    reported pass/fail; Stage 1's exact per-instance classifications are
    reported for every tested base point (no silent discarding), with the
    exact exclusion count disclosed; Stage 2's per-subgroup falsification
    checks and frequency-match statistic are both reported, distinctly.

  falsification_criterion: >-
    Per H-MONO-ebd400's own falsification_condition: any single observed
    instance in a class a named proper subgroup predicts impossible
    (falsifies that subgroup), or systematic absence of a predicted-common
    class after the pre-registered minimum sample (falsifies full S_4).

  outcomes:
    consistent_with_full_s4_all_classes_populated: >-
      All five classes observed at frequencies consistent with the
      predicted S_4 density; no named subgroup's own falsification
      condition fires. Toy-scale supportive evidence for full S_4 at m=4.
    a_named_subgroup_is_falsified_by_unexpected_presence: >-
      Not applicable in this direction by construction (a subgroup is
      falsified by ABSENCE of a class IT predicts impossible but S_4
      predicts common -- i.e. by finding what should be there under S_4;
      this outcome name is retained for schema symmetry but its content is
      subsumed by the next outcome).
    full_s4_is_falsified_by_systematic_absence: >-
      A pre-registered minimum sample is reached with zero instances in a
      class full S_4 predicts should appear hundreds of times. Full S_4 is
      falsified; the specific subgroup consistent with the observed
      support (if any single one is) is identified and reported.
    infrastructure_or_construction_failure: See infrastructure_failure_disposition. Never mathematical evidence.

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_do_not: >-
      Toy scale only; no transfer to cryptographic scale or F_{q^n}. A
      pass at 2 curves/2 primes is toy-scale supportive evidence, not a
      proof for every curve.

  required_artifacts_if_later_authorized:
    - Frozen approved specification (this file).
    - Stage-0 re-verification outcome.
    - Run manifest, command, environment, raw-result.json with every tested instance's exact classification.
    - Independent Validator + Red Team review before any citation alongside IDEA-20260904-ad63fe's own broader claim.

  approval_requirements:
    - This contract IS DEC-20260904-858cdc's own named next_action.
    - Independent review confirms the per-subgroup falsification branches were genuinely checked non-empty BEFORE this contract's own approval (not merely asserted), and that Stage 1's sampling carries no undisclosed filter.

  approval_status: >-
    APPROVED 2026-09-04 by the Coordinator; see `coordinator_approval_rationale` above.

  source_refs:
    - ledger/hypotheses/H-MONO-ebd400.yaml
    - ledger/decisions/DEC-20260904-858cdc.yaml
    - ledger/evidence/EV-MONO-661ee4.yaml
    - experiments/EXP-MONO-815525/reviews/red-team/red-team-report.yaml
    - experiments/EXP-MONO-815525/implementation/derive_s4.py
    - experiments/EXP-MONO-815525/implementation/run_census.py

  inference:
    requested_policy: executor-implementation
    reasoning_effort: medium
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
