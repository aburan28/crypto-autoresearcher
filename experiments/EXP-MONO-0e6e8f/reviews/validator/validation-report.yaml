  # ==================================================================
  # J1 (part 1) -- BLIND re-derivation of the subgroup / conjugacy-class table
  # ==================================================================
  j1_subgroup_class_table:
    method: >-
      Enumerated all 24 permutations of {0,1,2,3} in my own code; bucketed by
      cycle type; PROVED each bucket is a single conjugacy orbit by conjugating
      a representative by all 24 elements and checking the orbit equals the
      bucket (so the five buckets are the conjugacy classes, not merely cycle
      types). Then closed each named subgroup from generators, verified its
      order, verified V_4 is a subgroup and is normal, and counted its
      intersection with each class. Independent of every Executor artifact.
    s4_conjugacy_classes:
      classes:
      - {label: '1^4',   meaning: identity,             size: 1, density: '1/24'}
      - {label: '2+1+1', meaning: transposition,        size: 6, density: '1/4'}
      - {label: '2+2',   meaning: double transposition, size: 3, density: '1/8'}
      - {label: '3+1',   meaning: 3-cycle,              size: 8, density: '1/3'}
      - {label: '4',     meaning: 4-cycle,              size: 6, density: '1/4'}
      total_checked: 24
      each_bucket_is_one_conjugacy_orbit: true

    my_table:
      S_4:
        order: 24
        class_counts: {'1^4': 1, '2+1+1': 6, '2+2': 3, '3+1': 8, '4': 6}
        realised: ['1^4', '2+1+1', '2+2', '3+1', '4']
        impossible: []
      A_4:
        order: 12
        construction: even permutations (sign computed by inversion count)
        class_counts: {'1^4': 1, '2+1+1': 0, '2+2': 3, '3+1': 8, '4': 0}
        realised: ['1^4', '2+2', '3+1']
        impossible: ['2+1+1', '4']
      D_4:
        order: 8
        construction: <(0 1 2 3), (0 2)>, order verified = 8
        class_counts: {'1^4': 1, '2+1+1': 2, '2+2': 3, '3+1': 0, '4': 2}
        realised: ['1^4', '2+1+1', '2+2', '4']
        impossible: ['3+1']
      C_4:
        order: 4
        construction: <(0 1 2 3)>
        class_counts: {'1^4': 1, '2+1+1': 0, '2+2': 1, '3+1': 0, '4': 2}
        realised: ['1^4', '2+2', '4']
        impossible: ['2+1+1', '3+1']
      V_4:
        order: 4
        construction: '{e,(01)(23),(02)(13),(03)(12)}; closure and normality both verified'
        class_counts: {'1^4': 1, '2+1+1': 0, '2+2': 3, '3+1': 0, '4': 0}
        realised: ['1^4', '2+2']
        impossible: ['2+1+1', '3+1', '4']

    proves_too_much_control:
      object: >-
        The plan's own control: apply the identical method to S_4 itself. If it
        reports any impossible class for S_4, the method is wrong.
      result: S_4 impossible classes = [] (empty)
      verdict: PASS
      note: >-
        All five classes are populated in S_4, so the method does not
        manufacture impossibilities. The failure signature named in the plan
        did not occur.

    comparison_against_the_record:
      record_source: >-
        experiments/EXP-MONO-0e6e8f/execution_report.yaml
        stage_2_M1_per_subgroup_existence_checks.checks (read at 23:38:03Z, after
        the table above was fixed), cross-checked against raw-result.json
        stage_2.M1_per_subgroup_existence_checks.
      classes_predicted_impossible:
        A_4: {record: ['2+1+1', '4'],          mine: ['2+1+1', '4'],          agree: true}
        D_4: {record: ['3+1'],                 mine: ['3+1'],                 agree: true}
        C_4: {record: ['2+1+1', '3+1'],        mine: ['2+1+1', '3+1'],        agree: true}
        V_4: {record: ['2+1+1', '4', '3+1'],   mine: ['2+1+1', '3+1', '4'],   agree: true}
        S_4: {record: [],                      mine: [],                      agree: true}
      cycle_types_realised:
        A_4: {record: ['1^4','2+2','3+1'],                mine: same, agree: true}
        D_4: {record: ['1^4','2+1+1','2+2','4'],          mine: same, agree: true}
        C_4: {record: ['1^4','2+2','4'],                  mine: same, agree: true}
        V_4: {record: ['1^4','2+2'],                      mine: same, agree: true}
        S_4: {record: ['1^4','2+1+1','2+2','3+1','4'],    mine: same, agree: true}
      discrepancies_found: none
      verdict: >-
        ZERO discrepancies. The record's impossible-class table and its
        realised-cycle-type lists are exactly correct group theory.

    provenance_of_the_record_s_table:
      finding: >-
        The frozen specification.yaml does NOT itself carry the per-subgroup
        impossible-class table; it pre-registers the M1 PROCEDURE and defers to
        H-MONO-ebd400. H-MONO-ebd400 explicitly pre-registers A_4 -> {2+1+1, 4},
        D_4 -> {3+1}, and V_4 -> "anything outside {1^4, 2+2}" (= {2+1+1, 4,
        3+1}); it writes "etc." for C_4 and does not spell C_4's list out. The
        C_4 entry ({2+1+1, 3+1}) is therefore produced at run time by the same
        program that classifies the fibres.
      why_it_matters: >-
        A table computed by the classifying program is not an independent
        prediction; a shared bug could in principle corrupt both. This is
        exactly the failure mode blind re-derivation exists to catch.
      resolution: >-
        My blind derivation reproduces C_4's list independently and it matches.
        No defect. Recorded so the Coordinator knows which single entry rested
        on run-time computation rather than on a pre-registered ledger record.

    strengthening_found_by_this_reviewer:
      observation: >-
        The M1 argument as written rules out four NAMED subgroups and then
        appeals to the transitive-subgroup lattice to conclude S_4 is the only
        survivor. That appeal is unnecessary. I enumerated all 30 subgroups of
        S_4 and found that EXACTLY ONE contains both a 4-cycle and a 3-cycle,
        namely S_4 itself.
      proof: >-
        If G <= S_4 contains an element of order 4 and an element of order 3
        then 4 | |G| and 3 | |G|, so 12 | |G|. The only subgroup of order 12 is
        A_4, which contains no 4-cycle. Hence |G| = 24 and G = S_4.
      consequence: >-
        A SINGLE observed class-`4` fibre together with a SINGLE observed
        class-`3+1` fibre already forces G = S_4, with no transitivity premise
        and no enumeration of named subgroups. This makes the M1 conclusion
        robust to the completeness question that J4 was assigned. I record it
        as a fact I computed; adjudicating J4 is not mine and I do not do so.
      also_computed: >-
        The transitive subgroups of S_4 fall into exactly 5 conjugacy classes,
        of orders 4 (C_4, 3 conjugates), 4 (V_4, normal, 1), 8 (D_4, 3), 12
        (A_4, 1) and 24 (S_4, 1) -- matching the record's
        `transitive_subgroups_of_S4_considered: [C_4, V_4, D_4, A_4, S_4]`.
        The other order-4 subgroups of S_4 (the three non-normal Klein groups
        such as {e,(01),(23),(01)(23)}) are INTRANSITIVE and so are correctly
        outside that list. Handed to J4; not adjudicated here.

  # ==================================================================
  # J1 (part 2) / blind_rederivation -- independent classification
  # ==================================================================
  blind_rederivation:
    quantity: >-
      The exact factorization classification of specific (curve, e1, e2, e3)
      instances drawn from raw-result.json (plan asks for >= 10; J1's attack
      plan asks for >= 30).
    instances_independently_classified: 1200
    coverage: >-
      All four curves x all five classes x 60 recorded instances each
      (C1/C2 at p=101, C3/C4 at p=1009), plus all 16 M1 witness instances,
      plus 600 additional random instances used for the two-route
      cross-check, plus a complete exhaustive re-run of C1 and C2
      (2,050,300 fibres). The classes used to falsify A_4, C_4 and D_4
      (2+1+1, 4, 3+1) are covered 60 instances per curve per class,
      i.e. 720 instances in the falsifying classes alone.
    mismatches: 0

    my_construction_route_A:
      description: >-
        My own sympy derivation from the group law, written without opening the
        Executor's stored tables. S_3 obtained by eliminating y1 then y2 from
        (y2-y1)^2 = (x1+x2+x3)(x2-x1)^2 against y_i^2 = f(x_i); confirmed the
        elimination equals (x1-x2)^4 * S_3^2 and that S_3 is symmetric.
        S_4 = Res_U(S_3(x1,x2,U), S_3(x3,x4,U)); confirmed degree 4 in each of
        x1..x4, 540 terms, invariance under all 24 permutations, and no
        extraneous factor. Q_e(T) obtained by symmetrising the T-coefficients
        in x1,x2,x3 and substituting s1,s2,s3 -> e1,e2,e3.
      result_c4: 'c_4 = (-A^2 + 2*A*e2 + 4*B*e1 + 4*e1*e3 - e2^2)^2'
    my_construction_route_B:
      description: >-
        A structurally different evaluation path that never uses the
        symmetrisation. For each (e1,e2,e3) I factor g = X^3-e1X^2+e2X-e3 over
        F_p, build the extension F_{p^d} = F_p[Z]/(m) carrying its roots
        (d in {1,2,3}: rational roots by trial; the conjugate pair of an
        irreducible quadratic as Z and Z^p; the roots of an irreducible cubic
        as Z, Z^p, Z^{p^2}), evaluate S_4(x1,x2,x3,T) coefficient-by-coefficient
        at the ACTUAL roots inside that extension, and assert each coefficient
        lands in F_p (which it must, by symmetry and Galois stability).
      cross_check: >-
        Route A vs Route B on 600 random (curve, e) instances spanning all four
        curves: 0 mismatches. Every one of the 1200 recorded class_examples was
        also computed by both routes: 0 mismatches. Symmetrisation is therefore
        not a single point of failure.
    my_factoriser:
      description: >-
        My own F_p polynomial arithmetic: squarefree decomposition (including
        the p-th-power branch) followed by distinct-degree factorisation via
        gcd(f, T^{p^d} - T), returning factor degrees WITH multiplicity;
        squarefreeness via deg gcd(f, f'); resultants by the Euclidean
        algorithm.
      self_test: >-
        1800 random and deliberately-non-squarefree polynomials over F_13,
        F_101 and F_1009 checked against sympy.polys.galoistools.gf_factor:
        0 mismatches on factor degrees and 0 on the squarefree flag.
        600 random resultants checked against sympy.resultant: 0 mismatches.
    my_vectorised_classifier:
      description: >-
        For the exhaustive sweep I additionally wrote a numpy classifier using
        rational-root multiplicities from Taylor coefficients plus the quartic
        discriminant's quadratic character (a squarefree quartic's Frobenius is
        even iff disc is a square in F_p, which separates class `2+2` from
        class `4`).
      self_test: >-
        1200 random grid points (600 per curve) cross-checked against the
        pure-Python factoriser above on class, squarefree flag and deg_T:
        0 mismatches.

    per_instance_result:
      checked_fields_per_instance: [Qe_coeffs_low_to_high, class, affine_degrees,
        projective_degrees, roots_at_infinity, degree_in_T, squarefree,
        g_factor_type, resultant_g_f]
      result: >-
        1200 / 1200 agree on every field. 16 / 16 M1 witness instances agree on
        every field and each is confirmed squarefree, i.e. an unramified fibre
        carrying a well-defined Frobenius conjugacy class.
      one_presentational_note: >-
        When deg_T Q_e = 3, raw-result.json stores `Qe_coeffs_low_to_high` as a
        length-4 list (the vanishing leading coefficient is truncated rather
        than written as 0). 100 of the 1200 examples are of this kind. This is
        cosmetic and self-consistent with the record's own `degree_in_T` and
        `roots_at_infinity` fields, which are both present and both correct;
        it is not an error. Recorded only so a later reviewer comparing
        coefficient vectors literally is not misled.

