  observation_handed_to_J3:
    why_recorded: >-
      Produced as a by-product of my exhaustive C1/C2 recomputation. It bears
      directly on J3's question and J3 cannot see my work, so leaving it out
      would waste it. It is offered as measurement, not as an answer; J3 owns
      the verdict.
    measurement: >-
      On the unramified locus the class is confined to the resolvent block
      exactly (0 violations in 2,020,198 fibres), so the five-class
      distribution factors as: branch probability (determined entirely by the
      factorization type of the monic cubic g) x within-branch split. Both
      factors deviate from the naive asymptotic in ways I measured exactly:
    branch_probabilities_are_exactly_combinatorial: >-
      The exact number of monic cubics over F_p by type is
      3-distinct-roots p(p-1)(p-2)/6, double+simple p(p-1), triple p,
      (linear)(irred quadratic) p^2(p-1)/2, irreducible (p^3-p)/3, summing to
      p^3 (= 166650 + 10100 + 101 + 510050 + 343400 = 1030301 at p=101). These
      differ from the asymptotic (1/6, 1/2, 1/3) by O(1/p), i.e. by about 3% at
      p=101 and 0.3% at p=1009 -- which alone predicts a deviation that shrinks
      by roughly a factor of 10 from p=101 to p=1009. C2's g-type counts
      (176851 / 510050 / 343399) are EXACTLY these combinatorial counts minus
      the single excluded g = f. This is not a probabilistic near-miss; it is
      an identity.
    within_branch_splits_on_the_unramified_locus:
      C1:
        'g splits (n=156800)':   '1^4 37280 vs 1/4-prediction 39200.0 (-1.224%); 2+2 119520 vs 117600.0 (+1.224%)'
        'g=1+2 (n=500000)':      '2+1+1 249200 vs 250000.0 (-0.160%); 4 250800 vs 250000.0 (+0.160%)'
        'g irreducible (n=343400)': '3+1 343400 vs 343400.0 (exact, 0.000%)'
      C2:
        'g splits (n=166650)':   '1^4 44880 vs 41662.5 (+1.931%); 2+2 121770 vs 124987.5 (-1.931%)'
        'g=1+2 (n=510050)':      '2+1+1 248460 vs 255025.0 (-1.287%); 4 261590 vs 255025.0 (+1.287%)'
        'g irreducible (n=343298)': '3+1 343298 vs 343298.0 (exact, 0.000%)'
    three_features_J3_may_find_diagnostic:
      - >-
        The g-irreducible branch is EXACT on both curves: every unramified
        fibre with g irreducible is class 3+1, with deviation identically zero.
        The entire M3 excess therefore lives in the two branches whose fibre
        splits within a V_4-coset, never in the 3-cycle branch.
      - >-
        The within-branch deviation FLIPS SIGN between C1 and C2 (1^4 is
        deficient on C1 and excessive on C2; 2+1+1 is deficient on both but 4
        is excessive by different amounts). Curve-dependent sign is the
        signature of a Weil-type O(1/sqrt(p))-scale arithmetic fluctuation
        rather than of a systematic classification asymmetry, which would have
        a fixed sign. It also explains why the 2+1+1-vs-4 imbalance nearly
        cancels in the pool (562304 vs 562534) while the 1^4-vs-2+2 imbalance
        does not.
      - >-
        Every exception to the resolvent-block law is non-squarefree, and the
        ramified fibres pile into 1^4 and 2+1+1 (pooled 15615 and 14963) with
        almost none into 2+2 (98, all on C1) and none at all into 4 or 3+1.
        Since M3 as pre-registered includes ramified fibres, part of the
        1^4-vs-2+2 term is a ramification-allocation effect rather than a
        Frobenius statistic at all -- but note that M3b, which removes them,
        still leaves 978.27, so ramification is not the whole story.
    what_I_did_not_do: >-
      I did not derive or bound the expected size of the finite-field
      correction, did not test the p-scaling (two primes cannot establish a
      rate), and form no view on whether the residual is benign. That is J3's
      joint.

