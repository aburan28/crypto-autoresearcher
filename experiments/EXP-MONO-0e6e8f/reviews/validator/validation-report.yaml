  # ==================================================================
  # J1 (part 4) -- a Frobenius-compatibility control the record did not run
  # ==================================================================
  additional_control_run_by_this_reviewer:
    name: resolvent-block law (S_4 -> S_4/V_4 = S_3)
    statement: >-
      The record's own OBS-1 notes that the five-class label is almost
      determined by g's factorization type, and that the pattern matches the
      surjection S_4 -> S_4/V_4 = S_3, but draws no conclusion and runs no
      check. That surjection sends {1^4, 2+2} -> identity, {2+1+1, 4} ->
      transposition, {3+1} -> 3-cycle. If g is (up to the construction's
      normalisation) the cubic resolvent of Q_e, then on every UNRAMIFIED fibre
      the class of Q_e is FORCED into the block named by g's factorization
      type. That is a necessary consistency condition on the classification,
      and a violation would be a direct classification or construction bug.
    result:
      C1: {unramified_fibres: 1000200, block_law_violations: 0}
      C2: {unramified_fibres: 1019998, block_law_violations: 0}
    verdict: PASS
    strength: >-
      2,020,198 exhaustively-checked unramified fibres with zero violations.
      Every apparent exception to the pattern that OBS-1 lists (C2's 101
      g-irreducible instances landing in 1^4, C1's 2459 g=(1+2) instances
      landing in 1^4, and the 12429 pooled g-split instances landing in
      2+1+1) is, without exception, a NON-SQUAREFREE Q_e -- I verified this
      exhaustively, not by sampling. On the unramified locus the law is exact.
    why_this_matters_for_J1: >-
      It is an independent, structurally different check that the recorded
      class labels are the genuine Frobenius cycle types rather than the output
      of a mislabelling. A classification bug that permuted or merged class
      labels would almost certainly break this law somewhere in two million
      fibres. It does not break anywhere.

  # ==================================================================
  # J1 -- robustness of the M1 falsifications
  # ==================================================================
  m1_robustness:
    concern: >-
      A factorization pattern certifies an element of the monodromy group only
      at a GOOD specialization. Two things could spoil that: (a) a
      non-squarefree Q_e (ramified fibre, no well-defined Frobenius class), and
      (b) the record's convention of restoring (4 - deg_T Q_e) roots at
      T = infinity when the leading coefficient c_4 vanishes. I checked both
      independently rather than accepting the record's assurance.
    exact_findings_C1_C2_from_my_own_exhaustive_sweep:
      note: >-
        Counts of fibres that are BOTH squarefree AND deg_T = 4, i.e. that
        depend on neither the ramification question nor the infinity
        convention.
      '2+1+1': {C1: 244216, C2: 243540, sum: 487756}
      '4':     {C1: 250800, C2: 261590, sum: 512390}
      '3+1':   {C1: 340022, C2: 339812, sum: 679834}
    pooled_lower_bounds_all_four_curves:
      method: total minus ramified minus deg_T=3 (a lower bound, since those two sets may overlap)
      '2+1+1': 537341
      '4':     562534
      '3+1':   746175
    verdict: >-
      Every M1 falsification survives BOTH restrictions with hundreds of
      thousands of witnesses. Class `4` contains no ramified fibre and no
      deg_T=3 fibre at all, on any curve. No M1 verdict depends on a ramified
      fibre or on the root-at-infinity convention. The record's own two
      robustness claims (`robustness_of_M1_to_the_ramification_question` and
      `robustness_of_M1_to_the_projective_reading`) are correct as stated, and
      I confirm them by independent computation rather than by reading them.

  # ==================================================================
  # J2 -- EXCLUSION-COUNT VERIFICATION
  # ==================================================================
  j2_exclusion_counts:
    my_derivation_from_first_principles:
      step_1: >-
        (e1,e2,e3) -> g = X^3 - e1 X^2 + e2 X - e3 is a BIJECTION from F_p^3
        onto the monic cubics over F_p, so counting excluded triples is
        counting excluded monic cubics.
      step_2: >-
        Res(g,f) = 0 <=> g and f share a root in the algebraic closure. Because
        g is in F_p[X], sharing a root with an irreducible factor q of f forces
        q | g. So the excluded set is the union over the irreducible factors q
        of f of A_q = { monic cubic g : q | g }.
      step_3: >-
        |A_q| = #{ monic h of degree 3 - deg q } = p^(3 - deg q).
      step_4: >-
        Inclusion-exclusion over the DISTINCT irreducible factors of f,
        discarding any intersection whose lcm has degree > 3 (no monic cubic is
        divisible by it). f is squarefree because E is nonsingular
        (4A^3 + 27B^2 != 0), so its irreducible factors are distinct and the
        inclusion-exclusion is over a genuine set.
      closed_forms:
        f_splits_into_3_distinct_linears: 3p^2 - 3p + 1
        f_is_linear_times_irreducible_quadratic: p^2 + p - 1
        f_is_an_irreducible_cubic: 1
    per_curve:
      C1:
        curve_params: {p: 101, A: 2, B: 3, mode: exhaustive}
        my_factorization_of_f: 'X^3 + 2X + 3 over F_101 = (linear)(irreducible quadratic); 4A^3+27B^2 = 73 != 0'
        my_predicted_count: 'p^2 + p - 1 = 10201 + 101 - 1 = 10301'
        my_independent_exact_enumeration: 10301
        recorded: 10301
        verdict: EXACT MATCH
      C2:
        curve_params: {p: 101, A: 1, B: 35, mode: exhaustive}
        my_factorization_of_f: 'X^3 + X + 35 over F_101 is IRREDUCIBLE; 4A^3+27B^2 = 52 != 0'
        my_predicted_count: '1 (the only monic cubic sharing a root with an irreducible cubic is that cubic itself)'
        my_independent_exact_enumeration: 1
        recorded: 1
        verdict: EXACT MATCH
      C3:
        curve_params: {p: 1009, A: 5, B: 7, mode: random, draws: 100000}
        my_factorization_of_f: 'X^3 + 5X + 7 over F_1009 = (linear)(irreducible quadratic)'
        my_exact_density: '(p^2 + p - 1)/p^3 = 1019089/1027243729 = 0.00099206'
        my_prediction: 'Binomial(100000, 0.00099206): mean 99.21, sd 9.96'
        recorded: 101
        z: '+0.180'
        verdict: CONSISTENT
      C4:
        curve_params: {p: 1009, A: 2, B: 30, mode: random, draws: 100000}
        my_factorization_of_f: 'X^3 + 2X + 30 over F_1009 SPLITS into 3 distinct linear factors'
        my_exact_density: '(3p^2 - 3p + 1)/p^3 = 3051217/1027243729 = 0.00297030'
