    That is a contract defect, not a result.
    J4: NO EVASION FOUND, AND THE M1 LOGIC IS STRONGER THAN THE RECORD CLAIMS.
    I brute-forced the entire subgroup lattice of S_4: 30 subgroups, 11
    conjugacy classes, exactly 5 transitive classes -- the record's list is
    complete and its realised-cycle-type table is correct for all five. But
    exactly ONE of all 30 subgroups meets all five conjugacy classes, so the
    transitivity premise is not needed at all. I did find three things the
    record does not contain: (i) two explicit null objects that reproduce the
    entire census -- one of them with no elliptic curve, no group law and no
