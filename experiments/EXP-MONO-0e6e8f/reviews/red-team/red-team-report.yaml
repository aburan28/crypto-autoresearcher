  proof_architecture_challenges:
    - id: PA-1
      name: observation-fiber attack
      run: >-
        Held the observable (the five-class label) fixed and varied the
        underlying object. Found preimages on both sides of the conclusion:
        E5 (uniform random quartic) and E6 (recipe on a random function) sit
        outside the intended object class yet produce identical observations.
      missing_separator: >-
        Nothing in the five-class label distinguishes the Semaev cover from a
        generic quartic. The separator that WOULD do it is the per-instance
        recipe (C3) -- checking that the class is the one (C3) predicts from g
        and the Legendre symbols, instance by instance, which fails immediately
        for a random quartic. The experiment records the joint table that makes
        this checkable (OBS-1) but does not compute the per-instance agreement
        rate. That is a one-line addition with real discriminating power.
    - id: PA-2
      name: quantifier-order attack
      run: >-
        The idea record is explicit and correct about quantifier order (its
        method_ceiling section distinguishes "FOR ALL E there exists a
        containing group" -- trivial -- from "FOR ALL E the realised element
        count is 24" -- measured). The experiment respects it. No witness is
        chosen after seeing an instance: the five classes and their predicted
        densities are frozen in the specification, the seed is fixed, and two
        curves are exhaustive.
      verdict: passes
    - id: PA-3
      name: boundary and strictness attack
      run: >-
        The old method (EXP-MONO-815525's g-irreducible conditioning) IS
        genuinely embedded as a boundary: it is the g-irreducible column of this
        census's joint table, and on that column the intransitive S_3 null and
        the real cover agree instance for instance (343,400 vs 343,400 on C1).
        The new design is STRICTLY better, not merely different: the two columns
        the old design discarded are exactly the ones that separate.
      verdict: passes -- this is the strongest structural feature of the design
    - id: PA-4
      name: method-ceiling attack
      run: >-
        The largest claim this instrument can support is the arithmetic
        monodromy of one cover at fixed (p,A,B), plus (with E3) the geometric
        one. It cannot reach any relation-rate, cost or exponent claim, cannot
        reach m != 4, and cannot reach unbounded p. The record's own
        claim_ceiling matches this. No headline exceeds the ceiling.
      verdict: passes
    - id: PA-5
      name: nearby-object attack
      run: >-
        Nearest object with the conclusion FALSE: the ordered base
        k(x1,x2,x3), where the monodromy is provably V_4 and classes 4, 3+1,
        2+1+1 are impossible by the degree cap (EV-MONO-efbd1c). The symmetric
        base does distinguish itself: classes 4 and 3+1 are observed with
        density 1/4 and 1/3. Second nearest: a nodal cubic (E7), which does NOT
        distinguish itself -- that one is not run and should be.
    - id: PA-6
      name: compositional-invariant attack
      run: >-
        Deleted each component of the record's argument in turn.
        Delete Stage 0 -> E4 (cover switching) becomes available and M1 fails.
        Delete the unconditioned sampling -> the predecessor's degeneracy
        returns and the test loses all power.
        Delete the Res(g,f) != 0 exclusion -> chi(f(t_i)) = 0 becomes possible
        and the character rule (and hence the exact law) breaks.
        Delete the projective root-at-infinity convention -> 20,509 instances
        (0.9%) get partition-of-3 labels; M1 survives, M3 shifts.
        Every component is load-bearing for something, and Stage 0 is
        load-bearing for M1 specifically. The strong invariant does imply the
        target.

  narrowest_supported_statement: >-
    For each of the four tested triples (p, A, B) = (101,2,3), (101,1,35),
    (1009,5,7), (1009,2,30), Frobenius elements of all five S_4 cycle types
    occur at unramified F_p-rational points of the m=4 symmetric-base Semaev
    cover. Since exactly one of the 30 subgroups of S_4 meets all five
    conjugacy classes, the ARITHMETIC monodromy of Q_e over F_p(e1,e2,e3) is
    the full S_4 for those four triples; adding the parity argument (E3) the
    GEOMETRIC monodromy is also S_4 for those four triples. The M3 chi-square
    of 2447.84 is NOT evidence against this and is NOT an unexplained anomaly:
    it is the sum of two O(1/p) effects with closed-form curve-dependent
    constants -- the exact finite-p class-count law of IDEA-20260904-ad63fe
    (C4), and the pooling of the inadmissible strata that same record named in
    advance as a confounder -- and against the exact finite-p null the
    statistic falls to 0.23 on C2's exhaustive 1,030,300-point census and 0.73
    on C4. Nothing here supports any claim about m != 4, other primes, other
    curves, F_{q^n}, relation rates, solver cost, any exponent, or KN-OPEN-009,
    and full S_4 is in any case the case index calculus already assumes, so
    this result removes an exceptional-locus hope rather than creating an
    attack.

