    (sd 6.3e-4 on class 1^4 against a predicted deviation of 6.5e-4). The real
    finding is upstream: the exact law was ALREADY WRITTEN DOWN as (C4) in the
    parent idea IDEA-20260904-ad63fe, and the specification froze the
    ASYMPTOTIC density as the M3 null anyway, while also pooling in the two
