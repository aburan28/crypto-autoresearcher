    per_class_counts: "EXACT and COMPLETE for all 2249894 classified instances, per curve and pooled."
    joint_counts: "EXACT and COMPLETE cross-tabulation of g's own factorization type against the five-class label, per curve."
    per_instance_records: >-
      BOUNDED, NOT COMPLETE. Storing all 2249894 individual instance records
      would exceed the specification's 20 MB disk budget by roughly two orders
      of magnitude. raw-result.json retains up to 60 fully specified instances
      per class per curve (e1,e2,e3, the full Q_e coefficient vector, affine
      and projective factor degrees, squarefree flag, g's factor type, and the
      resultant value) and up to 400 excluded base points per curve. NO
      INSTANCE IS DISCARDED FROM ANY COUNT: every one of the 2249894
      instances is counted in the exact per-class, per-affine-pattern,
      per-degree, per-ramification and joint tables, and the accounting
      identity drawn == classified + excluded + identically_zero holds
      exactly. Any instance can be regenerated exactly by re-running the
      recorded command.
    reconstruction: >-
      C1 and C2 are EXHAUSTIVE over F_101^3, so their per-instance data is
      fully reconstructible from the recorded command with no randomness at
      all. C3 and C4 are reconstructible from seed 20260904003 and the
      documented consumption order of the single random stream.

  protocol_deviations:
    - >-
      EXP-MONO-815525's derive_s4.py was NOT executed. Executing or importing
      it re-runs the sympy derivation and REWRITES six files inside
      experiments/EXP-MONO-815525/implementation/, which both the task card
      ("read-only -- do not copy or modify") and the write-scope constraint
      ("stay strictly inside experiments/EXP-MONO-0e6e8f/") forbid. Its
      symbolic claims were instead re-verified at run time WITHOUT sympy and
      WITHOUT trusting derivation_checks.json: Stage-0 check (0a) recomputes
      the degree of the STORED S_4 monomial table in each of x1..x4 (= 4,4,4,4)
      and (0a2) verifies the stored table is invariant under all 24
      permutations of x1..x4, both directly from the term table. The file's
      sha256 is recorded and matches EXP-MONO-815525's own archived manifest.
    - >-
      Four curves at two primes were used, exceeding the specified minimum of
      two curves at two primes, so that the non-isogeny check is non-vacuous
      WITHIN each prime rather than only across primes.
    - >-
      Sample size exceeds the specified minimum of 10000 per curve: C1 and C2
      are EXHAUSTIVE (1030301 base points each, the option the specification
      explicitly permits and prefers), C3 and C4 use 100000 uniform draws
      each. The sample size was fixed before any Stage-1 result was observed
      and was not adjusted afterwards.
    - >-
      The specification's five classes (1^4, 2+2, 2+1+1, 4, 3+1) are
      partitions of 4, but Q_e's leading coefficient c_4(e1,e2,e3) can vanish
      -- an anomaly EXP-MONO-815525 itself disclosed -- leaving Q_e of degree
      3 and its affine factorization a partition of 3, which is not one of the
      five. The classification therefore restores the (4 - deg Q_e) roots at
      T = infinity as F_p-rational points of the degree-4 fibre, exactly as
      EXP-MONO-815525's own `projective_degrees` statistic did, so that every
      instance receives exactly one of the five labels. The literal affine
      pattern and the degree of Q_e are ALSO recorded for every instance and
      reported per curve, so the choice is fully reversible by a reviewer.
      20509 of 2249894 pooled instances (0.91%) had deg Q_e = 3 (10100 on
      C1, 10200 on C2, 109 on C3, 100 on C4).
    - >-
      Non-squarefree (ramified) Q_e is recorded and counted per class but is
      NOT excluded from the pre-registered M3 chi-square, which is computed
      over all classified instances exactly as the contract specifies. A
      squarefree-subset chi-square is reported additionally as M3b and is
      explicitly labelled descriptive; it does not replace or adjust M3.
    - >-
      The first invocation of the run was wrapped in `/usr/bin/time -l`, which
      exited 1 and wrote a sandbox error ("sysctl kern.clockrate: Operation
      not permitted") into stderr.log even though the Python program itself
      completed normally. The run was re-executed WITHOUT that wrapper to
      obtain a clean stderr and a true exit code (0); the archived artifacts
      are from that second execution. A third execution to a scratch path
      confirmed byte-level identity of every mathematical field across
      executions (see `reproducibility`). All three executions are disclosed;
      none was discarded for being unfavourable, and none differed in any
      result.
    - >-
      No git command was run and no commit sha is recorded, per the
      dispatching Coordinator's explicit instruction for this shared working
      directory. See `code.commit_note`.

  anomalies:
    - >-
      The pre-registered M3 chi-square is 2447.84 on 4 degrees of freedom
      pooled, far above the 0.01 critical value of 13.28. It is NOT uniformly
      distributed across curves: C3 gives 4.38 and C4 gives 12.13 (p=1009,
      n~100000), while C1 gives 1175.81 and C2 gives 1765.88 (p=101,
      n~1020000). The excess is concentrated entirely in two classes: 1^4 is
      over-represented (0.047115 observed vs 0.041667 predicted) and 2+2 is
      under-represented (0.118202 vs 0.125000), while 2+1+1 (0.249925), 4
      (0.250027) and 3+1 (0.334732) match their predicted 0.25, 0.25 and
      0.333333 to within 1.4e-3. Recorded as observed. Whether this reflects
      a Chebotarev error term at a small prime, the ramification recorded in
      M2_ramified_by_class_pooled (which sits entirely in 1^4 and 2+1+1), or
      something else, is a Reviewer/Coordinator judgement, not the Executor's.
    - >-
      The per-curve absolute frequency deviations shrink markedly between the
      two primes: for class 1^4, 4.63e-3 (C1) and 7.12e-3 (C2) at p=101
      versus 6.96e-4 (C3) and 1.37e-3 (C4) at p=1009; for class 2+2, 7.73e-3
      and 6.81e-3 at p=101 versus 9.75e-4 and 3.00e-3 at p=1009. Recorded as
      observed, with the exact numbers in raw-result.json
      stage_2.M3c_frequency_deviation_diagnostic.
    - >-
      The five-class label is almost entirely determined by g's OWN
      factorization type, in exactly the pattern of the natural map
      S_4 -> S_4/V_4 = S_3. Pooled over all four curves, EVERY instance with g
      irreducible landed in class 3+1 except 101 instances on C2; EVERY
      instance with g = (linear)(irreducible quadratic) landed in 2+1+1 or 4
      except 2551 in 1^4; and EVERY instance with g split landed in 1^4 or 2+2
      except 12429 in 2+1+1. The full cross-tabulation is in raw-result.json
      per curve. Recorded as a structural observation; this is also the exact
      mechanism by which EXP-MONO-815525's g-irreducible conditioning selected
      class 3+1 with probability ~1 and therefore had no discriminating power.
    - >-
      Two exact internal-consistency identities held. (i) On C1 the exhaustive
      Res(g,f)=0 exclusion count is 10301 = p^2 + p - 1 with p=101, the exact
      count when f factors as (linear)(irreducible quadratic); on C2 it is
      exactly 1, the exact count when f is irreducible over F_p (the only
      monic cubic sharing a root with an irreducible cubic is that cubic
      itself). The two random-mode curves gave 101 and 305 exclusions in
      100000 draws against densities of about 1/p and 3/p. (ii) On C1 the
      exhaustive count of g irreducible is 343400 = (101^3 - 101)/3, the exact
      number of monic irreducible cubics over F_101; on C2 it is 343399,
      i.e. that number minus the single excluded g = f. Both are consequences
      of the exclusion rule and confirm it was applied exactly as specified.
    - >-
      Class 2+2 contains 98 ramified (non-squarefree) instances, all on C1,
      and classes 4 and 3+1 contain none at all. Recorded as observed.
