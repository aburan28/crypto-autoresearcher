  inputs:
    seed: 20260904003
    seed_source: "specification.yaml replication.seeds[0]"
    randomness_sources:
      - >-
        python random.Random(20260904003), a single stream consumed in a fixed
        order: (1) Stage-0 check (0e) g-irreducible symmetry probes, 10 per
        curve; (2) Stage-0 check (0f) resultant/gcd cross-check probes, 2000
        per curve; (3) Stage-1 uniform (e1,e2,e3) draws for the two p=1009
        curves C3 and C4, 100000 each.
      - >-
        NO other randomness. The Stage-1 census on C1 and C2 is EXHAUSTIVE over
        all 101^3 = 1030301 triples in lexicographic order and consumes no
        random numbers. Stage-0 checks (0a),(0b),(0c),(0d) are deterministic.
    parameters:
      curves:
        - {id: C1, p: 101,  A: 2, B: 3,  j: 74,  order: 96,   trace: 6,   cm_disc_t2_minus_4p: -368,  ordinary: true, mode: exhaustive}
        - {id: C2, p: 101,  A: 1, B: 35, j: 63,  order: 121,  trace: -19, cm_disc_t2_minus_4p: -43,   ordinary: true, mode: exhaustive}
        - {id: C3, p: 1009, A: 5, B: 7,  j: 459, order: 966,  trace: 44,  cm_disc_t2_minus_4p: -2100, ordinary: true, mode: random}
        - {id: C4, p: 1009, A: 2, B: 30, j: 929, order: 1072, trace: -62, cm_disc_t2_minus_4p: -192,  ordinary: true, mode: random}
      isogeny_check:
        criterion: >-
          Tate: two elliptic curves over the SAME F_p are isogenous over F_p
          iff they have equal group order, equivalently equal trace of
          Frobenius. Curves over different primes live over different fields
          and are not isogenous at all.
        same_field_pairs:
          - {pair: [C1, C2], p: 101,  traces: [6, -19],   orders: [96, 121],   isogenous: false}
          - {pair: [C3, C4], p: 1009, traces: [44, -62],  orders: [966, 1072], isogenous: false}
        cross_field_pairs_trivially_non_isogenous: [[C1, C3], [C1, C4], [C2, C3], [C2, C4]]
        any_isogenous_pair: false
        note: >-
          EXP-MONO-815525 disclosed that two of its five curves (its C1 p=101
          A=2 B=3 and its C5 p=101 A=37 B=29) both have order 96 / trace 6 and
          are therefore isogenous. This run independently re-confirmed that
          fact while selecting curves and deliberately avoided it: C1 here is
          EXP-MONO-815525's own C1, and its partner at p=101 is a NEW curve
          (A=1, B=35) with trace -19, not A=37/B=29.
      sampling_rule: >-
        UNCONDITIONED. (e1,e2,e3) is taken exhaustively over all of F_p^3 at
        p=101 and drawn uniformly and independently from F_p^3 at p=1009.
        There is NO filter on g's factorization type -- this is the entire
        correction relative to EXP-MONO-815525. The sole exclusion is the
        degenerate case Res(g, f) = 0.
      exclusion_rule: "Res(g, f) = 0, g = X^3 - e1 X^2 + e2 X - e3, f = X^3 + A X + B"
      random_samples_per_random_mode_curve: 100000
      spec_minimum_samples_per_curve: 10000

