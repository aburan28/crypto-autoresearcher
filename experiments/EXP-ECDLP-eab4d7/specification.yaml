    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-e9da97 under the standing 2026-09-06
    user authorization. Stage 0 is the exact
    coprime/embed N^2-th-root calibrator.
    Cubical identities, Tate, and the
    DL-spectrum are later stages and are
    not run here.

  objective: >
    Evaluate the exact integer identity
    that lambda |-> lambda^(N^2) is a
    bijection of F_p^* when gcd(N, p-1)=1
    and that the same construction
    rejects N | (p-1), on one frozen
    family (REAL, KF, NULL), and decide
    whether the N^2-th-root calibrator
    works. Stage 0 does not construct
    a cubical point and does not
    authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL p=19 N=5
      power table equals [1, 14, 2, 6,
      16, 9, 7, 8, 4, 15, 11, 12, 10,
      3, 13, 17, 5, 18] and unique
      N^2-th roots equal [1, 3, 14, 9,
      17, 4, 7, 8, 6, 13, 11, 12, 15,
      2, 10, 5, 16, 18]; KF embed
      p=19 N=3 is rejected; NULL empty
      c-list rejected; p=0 rejected.
      Certificate kind none.
    formula: >
      On F_p^*, the map lambda |->
      lambda^(N^2) is bijective iff
      gcd(N^2, p-1)=1, equivalently
      gcd(N, p-1)=1. For REAL p=19
      N=5, N^2=25, gcd(5,18)=1. The
      frozen power table of x^25 for
      x=1..18 is [1, 14, 2, 6, 16, 9,
      7, 8, 4, 15, 11, 12, 10, 3, 13,
      17, 5, 18]. The unique d with
      d^25 ≡ c (mod 19) for c=1..18
      is [1, 3, 14, 9, 17, 4, 7, 8, 6,
      13, 11, 12, 15, 2, 10, 5, 16,
      18]. Frozen KF: p=19 N=3 has
      gcd(3,18)=3 so N | (p-1) and
      the unique-root construction is
      rejected. NULL is the empty
      c-list. Invalid is p=0.
      FORCED Stage 0: fixture_pass,
      real_root_pass,
      known_false_embed_pass,
      reject_invalid_pass,
      null_empty_pass all true.
    source: >
      ledger/proposals/IDEA-20260906-86cc17.yaml
      Stage 0 hard gate (uniqueness of
      the N^2-th root). Provenance
      internal; read in this design
      session.

  design_tightening_stage0_is_instrument_not_audit: >
    IDEA-20260906-86cc17 Stage 0 here is
    a disclosed tightening: the F_p^*
    N^2-power-map bijectivity
    calibrator only, not the proposal's
    cubical lift, not G1-G4, not Tate,
    not a DL-spectrum. Exact integer
    identities are the only Stage 0 arm.

  inputs:
    fixture:
      field: F_p^*
      real_coprime:
        id: REAL
        kind: coprime
        p: 19
        N: 5
        gcd_N_pminus1: 1
        N2: 25
        must_power_table: [1, 14, 2, 6, 16, 9, 7, 8, 4, 15, 11, 12, 10, 3, 13, 17, 5, 18]
        must_roots: [1, 3, 14, 9, 17, 4, 7, 8, 6, 13, 11, 12, 15, 2, 10, 5, 16, 18]
        role: real_coprime_n2root
      known_false:
        id: KF
        kind: embed
        p: 19
        N: 3
        gcd_N_pminus1: 3
        must_reject: true
        role: known_false_embed
      matched_null:
        id: NULL
        kind: empty_c_list
        must_reject: true
        role: matched_null_empty_c_list
      invalid:
        - id: p-zero
          p: 0
          must_reject: true
      working_model: >
        Exact coprime/embed N^2-th-root
        calibrator on F_p^*.
        Not a cubical lift. Not Tate.
        Not a DL-spectrum. Not
        Coppersmith. Not Semaev S_m.
        Not Velu. Not a yield ratio k.
        Not a rho beat.
      do_not_construct_cubical: true
      do_not_eval_division_poly: true
      do_not_form_tate: true
      do_not_run_dl_spectrum: true
      do_not_run_coppersmith: true
      do_not_form_semaev: true
      do_not_run_velu: true
      do_not_claim_yield_k: true

  independent_variables:
    - object in the frozen family
    - whether gcd(N, p-1) equals 1
    - whether (p, N) is the frozen positive pair

  null_object:
    name: empty c-list at frozen field
    construction: >
      Replace the c-list by the empty
      set. The unique-root table is
      not read. This is the nearby-
      object control with the residue
      term removed.
    non_degeneracy_check: >
      known_false_embed_pass must be
      true before any REAL identity
      is read as a measurement.
    dynamic_range_demonstration: >
      p=0 must be rejected before an
      identity is read as a census.

  controls:
    - KF embed p=19 N=3 rejection (known-false / proves-too-much)
    - REAL p=19 N=5 frozen power table and unique-root table
    - NULL empty-c-list rejection of collapse
    - p=0 rejection
    - exact integer arithmetic, no floats
    - gcd frozen before any cubical point is constructed

  metrics:
    primary:
      - fixture_pass boolean
      - real_root_pass boolean
      - known_false_embed_pass boolean
      - reject_invalid_pass boolean
      - null_empty_pass boolean
    secondary:
      - REAL power table
      - REAL unique-root table
      - wall-clock seconds and peak RSS

  heuristic_under_test: none

  scale_relevance:
    tier: toy
    justification: >
      Frozen N^2-th-root identity at
      p=19 N=5 and embed reject at
      p=19 N=3. No transfer to a
      cubical lift, Tate, DL-spectrum,
      or cryptographic p.
    correspondence: null

  tail_checks:
    - REAL power table equals the frozen 18-tuple
    - REAL unique roots equal the frozen 18-tuple
    - KF embed p=19 N=3 is rejected
    - NULL empty c-list is rejected
    - p=0 is rejected

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 0 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: fixture_pass,
      real_root_pass,
      known_false_embed_pass,
      reject_invalid_pass, and
      null_empty_pass. A miss classifies
      the run failed_infrastructure if it is
      a size or encoding bug, otherwise it
      is a scoped falsification of P-S0-N2ROOT.
    - Stages 1 and later are not authorized.
    - Do not construct a cubical point.
    - Do not evaluate a division polynomial.
    - Do not form a Tate pairing.
    - Do not run a DL-spectrum.
    - Do not run Coppersmith.
    - Do not form Semaev S_m.
    - Do not run Velu.
    - Do not claim a yield ratio k.
    - No attack is run. Certificate kind none.

