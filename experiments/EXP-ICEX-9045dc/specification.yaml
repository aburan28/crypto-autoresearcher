experiment:
  id: EXP-ICEX-9045dc
  hypothesis_id: H-ICEX-c35cf3
  derived_from_idea: IDEA-20260809-1a5cb2
  question_id: RQ-PAIR-f2e31f
  batch_id: BATCH-d6838c
  version: 1
  title: >-
    PRICE THE TOWER-FIELD LINEAR-ALGEBRA MEMORY AND ANCHOR IT TO A CERTIFIED
    SMALL-TOWER LOGARITHM RUN HERE- a blocking KN-LIT acquisition gate that leaves
    every cost cell undetermined if it fails, per-phase operation and memory
    counters, TWO declared machine models with a 5-bit materiality threshold
    replacing a width-zero -nonzero- band, a non-tower control that must be
    reported side by side, and the deployment figure labelled a MODEL EVALUATION on
    every row
  status: draft
  objective: >-
    (A) THE UNCERTAINTY. RQ-PAIR-f2e31f states VERBATIM that linear algebra on the
    exTNFS relation matrix is the step whose memory is routinely quoted as feasible
    without being costed, and declares a scalar bit level with no memory statement
    INADMISSIBLE OUTPUT. What the implied matrix dimension and weight are, and how
    many bits the level moves when memory is charged, has not been computed by this
    program.
    (B) THE THREE DESIGN DEFECTS THIS CONTRACT REPAIRS, ALL STATED BEFORE THE
    DESIGN.
      DEFECT 1, A CONTROL WITH NO DATA. The source measured-versus-predicted
      control requires the matrix produced by -the runs of IDEA-20260809-15e1cd-.
      THAT RECORD IS AN UNCONVERTED PROPOSAL- status proposed, no hypothesis, no
      contract, no run. THE CONTROL CANNOT FIRE. The calibration is therefore
      INTERNALISED here as its own arm, at at least two sizes, each run to a
      CERTIFIED exponent.
      DEFECT 2, A WIDTH-ZERO BAND. The source predicts the effective-level movement
      is -nonzero and stateable- and falsifies on zero. ANY ROUNDING SATISFIES
      NONZERO. Replaced by MATERIAL AT 5 BITS OR MORE under at least one machine
      model and PREMISE FALSIFIED BELOW 1 BIT under BOTH.
      DEFECT 3, AN UNMARKED EXTRAPOLATION. At deployed parameters the implied
      matrix has of order 2^30 or more rows and CANNOT BE BUILT, MEASURED OR SOLVED
      AT ANY REACHABLE SCALE. Every deployment-parameter row is LABELLED A MODEL
      EVALUATION and, under the RQ claim ceiling, is never a statement that a
      deployed curve is broken or safe.
    (C) THE BLOCKING PRECONDITION. RQ-PAIR-f2e31f states VERBATIM that no cost
      claim may be recorded before the exTNFS reference and at least one
      pairing-curve key-size estimation paper are filed as KN-LIT entries. The
      source refs are RECALLED and unread. STAGE 0 IS ACQUISITION; IF IT FAILS,
      EVERY COST CELL IS undetermined AND A TABLE OF UNDETERMINED CELLS NAMING THE
      MISSING SOURCES IS THE DELIVERABLE. That is a legitimate result.
    (D) WHAT IS NOT DECIDED. Any security level of any deployed system; any
      statement that a curve is broken or safe; and the crypto-scale matrix, which
      is unreachable.
  inputs:
    cost_unit: >-
      OPERATIONS ARE COUNTED IN NAMED FIELD MULTIPLICATIONS IN A NAMED FIELD.
      MEMORY IS COUNTED IN BITS, measured by an allocator-level probe at each
      phase and reported as a peak. THE TWO ARE NEVER DIVIDED INTO EACH OTHER AND
      NEVER ADDED. An -effective bits- figure is the base-2 logarithm of a single
      COST computed from both under a DECLARED MACHINE MODEL, and every such figure
      carries the conversion that produced it. A row without its unit tags, its
      machine model and its conversion is INADMISSIBLE and the harness refuses to
      emit one.
    unit_discipline: >-
      BINDING AND THIS IS THE HIGHEST-RISK PART OF THIS CONTRACT. Every value
      carries a tag in {field_mults, bits, rows, weight, dimensionless, seconds}.
      Cross-tag arithmetic requires a named recorded conversion. THE
      MEASURED-VERSUS-PREDICTED RATIOS ARE ROWS OVER ROWS AND WEIGHT OVER WEIGHT.
      WALL-CLOCK SECONDS ARE FOR BUDGET ACCOUNTING ONLY and never enter any
      reported cost, ratio or bit level.
    machine_models: >-
      EXACTLY TWO, DECLARED BEFORE THE RUN, each specifying the cost of a field
      multiplication, the cost of a memory access as a function of the working-set
      size, and the available memory. Both are named on every cost row. Reporting
      one model only is inadmissible, because a single model reads as a property of
      the algorithm rather than of the model.
    certificate_discipline: >-
      BLOCKING, per the RQ constraint. Every recovered logarithm in the calibration
      arm is emitted as a certificate and re-verified by exponentiation in an
      INDEPENDENT implementation. A failure means the pipeline is wrong and NO
      LATER FIGURE IS ADMISSIBLE.
    frozen_before_execution: >-
      The tower shape, the calibration sizes, the two machine models, the operation
      and memory units, the 5-bit materiality threshold and the 1-bit falsifier,
      the per-phase separation requirement, the non-tower control parameters, and
      the acquisition path list for stage 0. None may change after any cell runs.
    procedure: >-
      STAGE 0 (ACQUISITION GATE, BLOCKING, zero compute). File the exTNFS reference
      and at least one pairing-curve key-size estimation paper as KN-LIT entries,
      read at source by the agent that files them. IF THIS CANNOT BE DONE, THE RUN
      PROCEEDS ONLY TO STAGE 1 AND STAGE 2, EVERY COST CELL IS RECORDED AS
      undetermined WITH THE MISSING SOURCE NAMED, and no cost claim is recorded.
      STAGE 1 (closed-form derivation, zero compute). From the model own smoothness
      bound, derive the factor-base size, the expected relation count, the matrix
      dimension and the average row weight, at the calibration sizes and at the
      declared deployment parameters. IF ANY OF THESE IS NOT COMPUTABLE IN CLOSED
      FORM, RECORD THAT THE MODEL IS UNDERSPECIFIED AND NAME THE MISSING
      SPECIFICATION; do not choose a convention after the fact.
      STAGE 2 (calibration, the internalised control). At at least two small tower
      sizes of the same tower shape, run the full pipeline - tower construction,
      polynomial selection, relation collection, linear algebra, individual
      logarithm - to a CERTIFIED exponent, with PER-PHASE operation counts and
      PER-PHASE peak memory. MEASURE the matrix dimension and average row weight
      actually produced.
      STAGE 3 (measured versus predicted). Report the ratio of measured to
      predicted dimension and weight at each calibration size, WITH ITS TREND
      ACROSS SIZES. A ratio that does not trend UNANCHORS the extrapolation.
      STAGE 4 (memory charge under two models). Compute the block-Wiedemann memory
      profile and the resulting (operations, memory) pair at the calibration sizes
      and at the deployment parameters, under BOTH declared machine models, and
      report the movement in effective level in BITS under each.
      STAGE 5 (non-tower control). The identical accounting on an ordinary
      prime-field sieve matrix at matched matrix size, reported side by side.
      STAGE 6 (report). Emit the per-phase cost table, the measured-versus-predicted
      table with its trend, the two-model (operations, memory) table with every row
      carrying its model and conversion, the non-tower comparison, the certificate
      results, and - for the deployment rows - the MODEL EVALUATION label.
    mechanism: >-
      STEP 1. One accounting module with per-phase operation counters and
      per-phase allocator-level memory probes, shared by the tower calibration arm
      and the non-tower control, so the comparison is not confounded by the
      accounting.
      STEP 2. The matrix is measured as a real allocated object- dimension and
      nonzero count read off the built matrix, never estimated from the model being
      tested. A figure derived from the model under test would be circular and is
      forbidden.
      STEP 3. Relation collection, linear algebra and descent are timed and
      memory-profiled SEPARATELY, because the model treats them separately and a
      merged number cannot calibrate it.
      STEP 4. The independent verifier for the recovered exponent shares no code
      with the solver.
      STEP 5. Every row is reported as (arm, size, phase, machine model, field
      multiplications, peak bits, matrix rows, average weight, effective bits,
      conversion used, certificate status, wall seconds), never as a scalar.
    instrument: >-
      A tower-field sieve pipeline at small sizes with per-phase counters and
      allocator probes, plus an independent exponent verifier and a non-tower
      control path. The largest object is the calibration relation matrix at the
      larger calibration size, sized to stay inside the declared memory cap; a cell
      that would exceed it is NOT ATTEMPTED and is recorded as out of range.
  controls:
    - >-
      CONTROL 1, INTERNALISED MEASURED-VERSUS-PREDICTED CALIBRATION (blocking, and
      the repair of a control that could not fire). The matrix parameters predicted
      at the calibration sizes must match the matrices ACTUALLY PRODUCED, with the
      ratio reported and its trend across at least two sizes. A mismatch that does
      not trend invalidates the extrapolation, WHICH IS THE POINT OF RUNNING THE
      CHECK AT SMALL SIZE FIRST.
    - >-
      CONTROL 2, TWO DECLARED MACHINE MODELS (blocking). The memory charge is
      reported under both so it is VISIBLY A FUNCTION OF THE MODEL rather than a
      constant of nature. Their difference is itself reported; a difference of zero
      between two genuinely different models must be investigated before either
      figure is quoted.
    - >-
      CONTROL 3, CERTIFICATE ON EVERY CALIBRATION LOGARITHM (blocking, RQ
      constraint). The recovered exponent re-verified by exponentiation in an
      independent implementation. A failure means no later figure is admissible.
    - >-
      CONTROL 4, SELF-CONSISTENCY. Recompute the logarithm of a random KNOWN power
      and confirm the pipeline returns the known exponent. A planted answer the
      pipeline must reproduce, rather than a number it merely returns.
    - >-
      CONTROL 5, PHASE ISOLATION (blocking). Relation collection, linear algebra
      and descent timed and memory-profiled separately. A merged figure cannot
      calibrate a model stated per phase and is inadmissible.
    - >-
      CONTROL 6, NON-TOWER CONTROL (blocking for interpretation). The identical
      accounting on an ordinary prime-field sieve matrix at matched size.
      PRE-STATED CONSEQUENCE, FROZEN HERE- if the memory charge and the
      effective-bit movement are the same for the non-tower object, the result is a
      statement about SIEVE-TYPE LINEAR ALGEBRA and NOT about pairing-friendly
      elliptic curves or the tower structure, and it may not be quoted as one.
    - >-
      CONTROL 7, ACQUISITION GATE. Every cost cell is undetermined until the KN-LIT
      entries exist. An undetermined cell is reported as undetermined with the
      missing source named, never as an estimate.
  independent_variables:
    - calibration size, at least two increasing tower-field sizes of the same shape
    - machine model, exactly two, declared before the run
    - arm in {tower calibration, non-tower prime-field control, deployment MODEL EVALUATION}
    - pipeline phase in {relation collection, linear algebra, descent}
  metrics:
    primary:
      - >-
        implied relation-matrix dimension (rows) and average row weight, predicted
        and measured, at each calibration size
      - >-
        movement in effective level when memory is charged, in BITS, under each of
        the two declared machine models
    secondary:
      - per-phase operation counts in named field multiplications
      - per-phase peak memory in bits, from an allocator-level probe
      - measured-over-predicted ratio for dimension and for weight, with its trend
      - the two-model difference in effective-bit movement
      - the non-tower control (operations, memory) pair at matched matrix size
      - certificate verification result per calibration logarithm
      - self-consistency known-power recovery result
      - the deployment-parameter pair, labelled MODEL EVALUATION on every row
      - wall-clock seconds per phase, for budget accounting only
  heuristic_under_test: HEUR-PAIRMEM-1
  preregistered_prediction:
    quantity: >-
      The relation-matrix dimension and average row weight implied by the model at
      the calibration sizes, against the matrices actually produced; and the number
      of bits by which the effective level moves when the linear-algebra memory is
      charged.
    formula: >-
      Dimension and weight derived in closed form from the model smoothness bound
      in stage 1 and frozen there before stage 2 runs. Effective-level movement
      MATERIAL at 5 bits or more under at least one machine model; PREMISE
      FALSIFIED below 1 bit under both. Measured-over-predicted ratios reported with
      their trend, with order-of-magnitude disagreement EXPECTED at small size.
    source: >-
      RQ-PAIR-f2e31f, read in full for this contract, which requires the
      (operations, memory) pair, the named machine model and the certified
      calibration. The underlying exTNFS cost model is RECALLED AND UNREAD by any
      agent in this program and is subject to the stage 0 acquisition gate; no
      numeric prediction is taken from it until that gate is discharged.
  scale_relevance:
    tier: toy
    justification: >-
      The calibration runs at small tower-field sizes chosen for completability,
      not for cryptographic relevance. THE DEPLOYMENT ROWS ARE A MODEL EVALUATION
      AND NOT A MEASUREMENT AT ANY TIER. TRANSFER ASSUMPTION, STATED- that the
      measured-over-predicted ratio trends predictably from the calibration sizes to
      the deployment parameters, which is a gap of many orders of magnitude and is
      the weakest step in the record. The interval is carried through and the
      extrapolation is labelled on every row.
    correspondence: null
  tail_checks:
    - >-
      The measured maximum row weight against the predicted average, not only the
      average, because the block-Wiedemann memory profile is driven by the heavy
      rows.
    - >-
      The peak memory at the moment of maximum working set, not the average, since
      an average memory figure understates the binding constraint.
  replication:
    seeds: >-
      Declared explicitly before stage 2. At least two independent instances per
      calibration size so the measured dimension and weight carry a spread rather
      than a point value.
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 24.0
    maximum_memory_gb: 16
    maximum_runs: 20
  stopping_rules:
    - >-
      Stage 0 acquisition failure does NOT halt the run- it restricts it. Stages 1
      and 2 proceed; every COST cell is recorded as undetermined with the missing
      source named; no cost claim is recorded.
    - >-
      A calibration size that does not reach a certified exponent within its budget
      is recorded as INCOMPLETE with its budget and its last completed phase. Under
      the RQ constraint that is a budget outcome about a solver and NEVER evidence
      about the curve.
    - >-
      A cell whose matrix would exceed the declared memory cap is NOT ATTEMPTED and
      is recorded as out of range, never estimated.
    - >-
      Total wall-clock at the declared cap; remaining cells recorded as NOT
      ATTEMPTED.
  invalidation_rules:
    - >-
      A cost row emitted without its unit tags, its machine model and its
      conversion invalidates the row.
    - >-
      A memory figure derived from the cost model rather than measured by the
      allocator probe invalidates the memory table, because it would be circular.
    - >-
      A merged per-phase figure invalidates the calibration.
    - >-
      An uncertified recovered exponent invalidates every figure derived from that
      run.
    - >-
      Reporting a single machine model invalidates the effective-bit table.
    - >-
      Reporting a deployment row without the MODEL EVALUATION label invalidates it.
  success_criterion: >-
    Stage 1 derives dimension and weight in closed form or names the missing
    specification; at least two calibration sizes reach certified exponents with
    per-phase costs and measured matrix parameters; the measured-versus-predicted
    ratio is reported with its trend; the effective-bit movement is reported under
    both machine models with their difference; and the non-tower control is
    reported side by side. If stage 0 fails, success is the undetermined-cell table
    with the missing sources named.
  falsification_criterion: >-
    Predicted matrix parameters disagreeing with the measured ones in a way that
    does not trend WITHDRAWS the extrapolation. An effective-level movement below 1
    bit under BOTH machine models FALSIFIES the premise that memory is a real
    constraint at these sizes, which is worth recording explicitly. Dimension or
    weight not computable in closed form means the MODEL IS UNDERSPECIFIED, which
    is the finding. The non-tower control reproducing the charge removes every
    pairing-curve reading of the result.
  required_artifacts:
    - exact command, git commit and dirty-tree state, environment and versions
    - the frozen parameter file with the tower shape, calibration sizes, both machine models, units, thresholds and the acquisition path list
    - the stage 0 acquisition record- KN-LIT entries filed, or the explicit undetermined-cell table naming every missing source
    - the stage 1 closed-form derivation, frozen before stage 2 runs
    - per-phase raw records (arm, size, phase, model, field multiplications, peak bits, rows, average weight, max weight, seconds)
    - the measured matrix dimension and nonzero count, read off the built matrix
    - certificates for every recovered exponent and their independent verification results
    - the self-consistency known-power recovery record
    - the measured-over-predicted table with its trend across sizes
    - the two-model (operations, memory) and effective-bit table, every row carrying its model and conversion
    - the non-tower control table at matched matrix size
    - the deployment-parameter rows, each labelled MODEL EVALUATION
    - incomplete, out-of-range and not-attempted cell inventory with reasons
    - stdout, stderr, timestamps, resource measurements
    - inference block- requested policy, backend, resolved model id, effort, fallback, degraded requirements
  assigned_to: executor
  approved_by: null
  limitations:
    - >-
      THE DEPLOYMENT-PARAMETER PAIR IS AN EXTRAPOLATION AND A MODEL EVALUATION,
      NEVER A COMPUTATION AND NEVER A SECURITY VERDICT. The implied matrix there has
      of order 2^30 or more rows and IS NOT BUILDABLE, MEASURABLE OR SOLVABLE AT ANY
      SCALE THIS PROGRAM CAN REACH. Stated rather than the claim being quietly
      shrunk to the calibration sizes.
    - >-
      NO COST CLAIM MAY BE RECORDED BEFORE THE KN-LIT ENTRIES EXIST. That is
      RQ-PAIR-f2e31f verbatim and it binds this contract absolutely. Until then
      every cost cell is undetermined by the question own rule.
    - >-
      A SCALAR BIT LEVEL WITH NO MEMORY STATEMENT IS INADMISSIBLE OUTPUT, and so is
      a pair without its machine model or a bit figure without its conversion.
    - >-
      OPERATIONS AND MEMORY ARE NEVER DIVIDED INTO EACH OTHER OR ADDED. Both sides
      of every ratio in this contract carry the same unit.
    - >-
      IF THE NON-TOWER CONTROL REPRODUCES THE CHARGE, NOTHING HERE IS A STATEMENT
      ABOUT PAIRING-FRIENDLY ELLIPTIC CURVES OR THE TOWER STRUCTURE. Pre-stated so
      it cannot be renegotiated after the data.
    - >-
      AN INCOMPLETE CALIBRATION IS A BUDGET OUTCOME ABOUT A SOLVER AND NEVER
      EVIDENCE ABOUT THE CURVE, per the RQ constraint and AGENTS.md rule 5.
    - >-
      The source proposal calibration dependency on IDEA-20260809-15e1cd cannot be
      satisfied - that record is an unconverted proposal with no contract and no
      runs - so the calibration is internalised here. That is a declared change from
      the source.
    - >-
      claim_tier is bounded by RQ-PAIR-f2e31f claim_tier_ceiling- cost-model and
      calibration claims only. No statement that any deployed curve is broken or
      safe may be recorded. No attack, no exponent moved, sota_delta zero.
  yaml_parse_disclosure: >-
    Written by a Coordinator subagent without an interpreter. Every prose value is
    a folded block scalar; no tabs; no duplicate keys to the author reading. THIS
    AGENT COULD NOT RUN A STRICT YAML PARSE OR tools/validate_ledger.py AND DID
    NOT DO SO; the orchestrating session must run both before this contract is
    reviewed.
