# EXP-BINSTD-de9d5c
# Ratio-band arithmetic. No walk.
# Approved by DEC-20261003-aae0df.
experiment:
  id: EXP-BINSTD-de9d5c
  hypothesis_id: H-BINSTD-2fb4ba
  source_idea: IDEA-20261001-ae7005
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Ratio band versus the walk floor
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-aae0df
  objective: >-
    Check the width 30, the cross gap 17, and the product 1200.
  inputs:
    n_17: 17
    n_19: 19
    n_23: 23
    walk_floor: 30
    arms: 2
    cells: 6
    band_lo: 85
    band_hi: 115
    band_width: 30
    side_gap: 15
    lo_equal_gap: 0
    hi_equal_gap: 0
    nineteen_gap: 17
    run_budget: 40
    budget_excess: 10
    slots_one_arm: 90
    slots_both: 180
    n_gap_lo: 2
    n_gap_hi: 4
    span_product: 8
    n_span: 6
    gap_product: 1200
    n_sum: 59
    n_product: 7429
  controls:
    - >-
      One hundred fifteen minus 85 is 30. One hundred minus 85 is 15,
      and 115 minus 100 is 15. Fifteen plus 15 is 30. Reporting the
      width as different from 30 invalidates the run.
    - >-
      Eighty-five times 20 minus 17 times 100 is 0. One hundred
      fifteen times 20 minus 23 times 100 is 0. Seventeen times 20
      minus 17 times 19 is 17.
    - >-
      Forty minus 30 is 10. Three times 30 is 90, and 6 times 30 is
      180. Two times 4 is 8. The product of 15, 10, and 8 is 1200.
      Seventeen times 19 times 23 is 7429. Twenty-three minus 17 is 6.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {band, cross, product}
    - route in {difference, product}
  metrics:
    primary:
      - band_width
      - gap_product
      - implementations_agree
    secondary:
      - nineteen_gap
      - budget_excess
      - n_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      One hundred fifteen exceeds 85 by 30. Seventeen times 20
      exceeds 17 times 19 by 17. The product of 15, 10, and 8 is 1200.
    formula: >-
      Subtract 85 from 115. Subtract 17 times 19 from 17 times 20.
      Multiply 15, 10, and 8. Subtract 17 times 100 from 85 times 20.
    source: >-
      IDEA-20261001-ae7005 states the n list 17, 19, 23, the walk
      floor 30, the run budget 40, and the band from 0.85 to 1.15,
      read 2026-10-03. The products were recomputed in this design
      session. That computation is not a run. No walk was run.
  scale_relevance:
    tier: toy
    justification: Three listed n values and one written band. No transfer to an iteration ratio.
    correspondence: null
  tail_checks:
    - The product 1200 and the cross gap 17 are required. A check that stops at the width 30 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the width 30 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The band width is not 30.
    - The cross gap is not 17.
    - The product is not 1200.
    - A walk is run, or 17 over 19 is reported as 17 over 20.
  success_criterion: >-
    Both runs agree that 115 minus 85 is 30, that 15 plus 15 is 30,
    that 85 times 20 minus 17 times 100 is 0, that 17 times 20 minus
    17 times 19 is 17, and that the product of 15, 10, and 8 is 1200.
  falsification_criterion: >-
    The runs agree that 115 minus 85 is computed, and that difference
    is not 30.
  required_artifacts:
    - experiments/EXP-BINSTD-de9d5c/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-de9d5c/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-de9d5c/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-de9d5c/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-de9d5c/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-de9d5c/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any walk, distinguished point, or iteration count.
    - Any claim that a halving step beats a doubling step.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
