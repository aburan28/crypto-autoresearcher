# EXP-FROB-a3708f
# Arity-ledger arithmetic. No fibre.
# Approved by DEC-20261002-739e60.
experiment:
  id: EXP-FROB-a3708f
  hypothesis_id: H-FROB-24c252
  source_idea: IDEA-20261002-cad44c
  question_id: RQ-FROB-7d8dd4
  version: 1
  title: Arity-ledger arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-739e60
  objective: >-
    Check that 6725 is 58811 below 65536, that the least power of 6725
    meeting 2 to the 131 is 11, and that the least power of 39201 is 9.
  inputs:
    ceiling_g5: 6725
    ceiling_g6: 39201
    two_16: 65536
    gap_g5: 58811
    gap_g6: 26335
    cube_g5: 304142328125
    cube_gap_g5: 281170834382531
    cube_g6: 60240898037601
    cube_gap_g6: 221234078673055
    image_g5: 2433138625000
    image_gap_g5: 2249366675060248
    image_g6: 481927184300808
    image_gap_g6: 1769872629384440
    arity_g5: 11
    excess_g5: 1269652881827680977747301674424267778136477
    short_g5: 2533058170941775590910713042162885926023
    arity_g6: 9
    excess_g6: 215889899586099175796247020002458965701153
    short_g6: 2716682236851616105872759109986991458047
    semaev_g5: 512
    semaev_g6: 128
    phi8: 17
    variable_mark: 68
  controls:
    - >-
      6725 is 58811 below 65536. Reporting 6725 as at least 65536
      invalidates the run.
    - >-
      The 10th power of 6725 is short of 2 to the 131 by
      2533058170941775590910713042162885926023, and the 11th exceeds it
      by 1269652881827680977747301674424267778136477. Reporting arity 3
      as that least power invalidates the run.
    - >-
      The 8th power of 39201 is short by
      2716682236851616105872759109986991458047, and the 9th exceeds 2
      to the 131 by 215889899586099175796247020002458965701153.
    - >-
      Eight times each cube stays below 2 to the 51. Two to the 9 is
      512 and two to the 7 is 128.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - route in {successive_product, direct_power}
  metrics:
    primary:
      - gap_g5
      - arity_g5
      - arity_g6
      - implementations_agree
    secondary:
      - image_gap_g5
      - semaev_g5
      - phi8
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      6725 is 58811 below 65536, the least power is 11, and the least
      power of 39201 is 9.
    formula: >-
      Subtract each ceiling from 65536. Cube each ceiling and compare
      with 2 to the 48, then multiply by 8 and compare with 2 to the 51.
      Multiply successively until the product meets 2 to the 131.
    source: >-
      IDEA-20261002-cad44c states the ceilings 6725 and 39201 and the
      arities 11 and 9, read 2026-10-02. The powers were computed in
      this design session. That computation is not a run. No fibre was
      built.
  scale_relevance:
    tier: toy
    justification: Integers at the written ceilings. No transfer to a curve.
    correspondence: null
  tail_checks:
    - The shortfall of the 10th power is required. A check that stops at the 11th power is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the gap 58811 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - 6725 is not 58811 below 65536.
    - The least power of 6725 is not 11.
    - The least power of 39201 is not 9.
    - Arity 3 is reported as the least covering arity.
    - 6725 is reported as at least 65536.
    - A fibre is built or a field is constructed.
  success_criterion: >-
    Both runs agree that 6725 is 58811 below 65536, that the least
    power of 6725 is 11 with the written excess and shortfall, that
    the least power of 39201 is 9 with the written excess and
    shortfall, and that two to the 9 is 512.
  falsification_criterion: >-
    The runs agree that 2 to the 16 is 65536, and 6725 is not 58811
    below it.
  required_artifacts:
    - experiments/EXP-FROB-a3708f/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-FROB-a3708f/runs/<RUN-ID>/command.txt
    - experiments/EXP-FROB-a3708f/runs/<RUN-ID>/stdout.log
    - experiments/EXP-FROB-a3708f/runs/<RUN-ID>/stderr.log
    - experiments/EXP-FROB-a3708f/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-FROB-a3708f/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any fibre, field basis, or Weil descent.
    - Any claim that arity 11 is an attack cost.
    - Any measured Boolean variable count.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
