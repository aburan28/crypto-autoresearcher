experiment:
  id: EXP-ECDLP-933c10
  hypothesis_id: H-ECDLP-f79c89
  version: 1
  title: >-
    Factor-base scope audit - the cofactor denominator and the
    small-multiples coverage collapse, against a matched random
    subgroup-scoped null, a Sidon positive control, a planted-defect ladder,
    and a curve-free null on Z/M
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260904-ae82ce

  objective: >-
    Decide, by exhaustive enumeration at toy scale, whether the ratio of mean
    decomposition yields between the harness's two factor-base scopes is
    exactly the curve cofactor h (prediction P1), and whether the harness's
    target_subgroup base suffers a coverage collapse of order B relative to a
    matched RANDOM subgroup-scoped base (prediction P2). The deliverable is a
    construction recommendation with numbers attached and a standing screening
    rule - report the group the sums live in with every yield number. This
    contract is DRAFT and confers no execution authority.

  preregistered_prediction:
    quantity: >-
      (i) R_yield = mean decomposition yield of the target_subgroup base
      divided by that of the full_curve base, at matched B and m = 2, with
      targets ranging over the complete order-N subgroup in BOTH arms;
      dimensionless. (ii) R_cov = coverage divided by mean yield for the
      harness target_subgroup base at m = 2; dimensionless.
    formula: >-
      R_yield = h exactly, where h = M/N with M the curve order and N the
      order of the target subgroup. R_cov = 2/B exactly, from the count that
      at m = 2 an interval exponent set 1..B makes the decomposable targets
      exactly rP with r in -2B..2B (coverage 4B/N) against a mean of 2B^2/N.
      Both are point predictions with no fitted parameter.
    source: >-
      R_yield from KN-FIND-007's conservation identity applied with the
      generated subgroup's order in the denominator. R_cov from elementary
      counting over Z/N for an interval exponent set, with the exact m = 2
      partner set {x(R + P_v), x(R - P_v)} supplied by the complete-splitting
      statement of KN-FIND-a8990a Theorem C as relayed in
      IDEA-20260829-c6e7a4.

  inputs:
    curves: >-
      12 toy short-Weierstrass curves at p in {2^10, 2^12, 2^14}, p > 3,
      selected to span h across roughly 1-4, 100-300 and 2000-4000, with the
      exact group order, N, h and full group structure COMPUTED per curve and
      recorded, never assumed.
    factor_base_sizes: "B in {4, 8, 16, 32}"
    arity: "m = 2"
    targets: >-
      the COMPLETE order-N subgroup in every arm; exhaustive, never sampled,
      so there is no sampling error in any reported mean or coverage.
    sign_convention: >-
      frozen before any cell and identical in every arm; recorded as a field
      of every cell record. The 2^m signed-multiset factor is applied
      identically in both arms or it manufactures a factor 4 at m = 2.
    excluded_cells: "any cell with B >= N/4, excluded BEFORE the run"

  independent_variables:
    - "factor-base construction arm (a) full_curve, (b) harness target_subgroup, (c) matched random subgroup-scoped, (d) Bose-Chowla Sidon in the subgroup"
    - "B in {4, 8, 16, 32}"
    - "curve, and through it the cofactor h"
    - "ambient object: elliptic curve arm versus curve-free Z/M arm"

  null_object:
    name: >-
      NULL-A, THE MATCHED RANDOM SUBGROUP-SCOPED BASE. Blocking, and the
      deliverable of this lane.
    construction: >-
      A uniformly random B-subset of the x-coordinates of the order-N
      subgroup generated by P, at the same B, the same group and the same
      sign convention as the harness target_subgroup base, implemented for
      this test and NEVER by editing harness/semaev.py. It shares the SCOPE
      (sums stay inside the order-N subgroup) and differs only in the
      GEOMETRY (random subset versus consecutive multiples), so it is the
      unique arm that separates the two candidate causes of a coverage
      collapse.
    non_degeneracy_check: >-
      REQUIRED AND CHECKED BEFORE ANY CELL IS READ. The null must be able to
      differ from the treatment. Here it can, and by a computable amount: the
      predicted values of coverage-divided-by-mean are 2/B for the harness
      base and near min(1, mean)/mean for the null, which at B = 32 differ by
      a factor of order B/2 = 16 and at B = 4 by a factor of order 2. The
      band is therefore NOT width zero at any declared cell, and the
      discriminator can fire. The Stage 0 gate computes both predicted values
      per cell symbolically and ABORTS the cell if they differ by less than a
      factor 2, since at such a cell the arm has no resolving power and a
      null result there would mean nothing. Cells at B = 4 are expected to be
      near that threshold and are reported separately from B >= 8.
    dynamic_range_demonstration: >-
      A PLANTED-DEFECT LADDER of three defects of KNOWN size, each of which
      must fire at its predicted degree before any arm is interpreted.
      D1 TRUNCATION - build the base at 0.9B and report it as B; PREDICTED:
      the exact-identity check deviates by exactly
      2^m*binom(B+m-1,m) - 2^m*binom(floor(0.9B)+m-1,m), a forced integer
      computed before the run.
      D2 SIGN-CONVENTION DROP - count positive lifts only; PREDICTED: every
      mean falls by exactly the factor 2^m = 4 at m = 2.
      D3 INTERVAL SHIFT - replace the exponent set 1..B by K+1..K+B with
      K = floor(N/3); PREDICTED: the mean is UNCHANGED (conservation) and
      coverage-divided-by-mean is UNCHANGED at 2/B, because a shifted
      interval is still an interval. D3 is the negative rung of the ladder:
      an instrument that reports a change here is responding to the LOCATION
      of the base rather than to its additive structure, and its P2 finding
      is void.
      A battery that misses any of D1, D2 or fires on D3 has not demonstrated
      dynamic range and reports nothing.
    curve_free_null: >-
      REQUIRED, AND IT IS THE MOST IMPORTANT ARM IN THIS CONTRACT. Both
      predictions are statements about a subset of a finite cyclic group and
      its 2-fold signed sumset; no property of an elliptic curve enters
      either derivation. RUN THE IDENTICAL BATTERY ON Z/M, with a subgroup of
      index h, and with the four arms replaced by their exact analogues -
      (a) a random B-subset of Z/M, (b) the interval 1..B inside the
      index-h subgroup, (c) a random B-subset of the index-h subgroup,
      (d) a Bose-Chowla Sidon set in that subgroup - at matched M, h, B and
      m, targets the complete index-h subgroup.
    pre_declared_consequence: >-
      DECLARED IN ADVANCE, BEFORE ANY CELL RUNS, AND BINDING. If the
      curve-free Z/M arm reproduces P1 within its 5 percent band AND P2
      within its factor-B/4 band, then NOTHING measured by this experiment
      may be quoted as a statement about elliptic curves, about Semaev
      decomposition, or about the ECDLP. The honest headline in that case is
      that the harness's target_subgroup construction is an interval in a
      cyclic group and behaves like one, and every downstream citation must
      carry that scope. Only a MEASURED DIFFERENCE between the curve arm and
      the curve-free arm, exceeding both bands, is quotable as curve content,
      and any such difference is routed to independent review before
      interpretation rather than reported as a finding.

  controls:
    - >-
      NULL-A MATCHED RANDOM SUBGROUP-SCOPED BASE (blocking). See null_object.
      Without it a coverage collapse cannot be attributed to small multiples
      rather than to subgroup restriction.
    - >-
      MATCHED-h CONTROL (blocking, the can-return-zero check): at least two
      curves with h in {1, 2}, where P1 predicts NO yield difference between
      the scopes. An instrument that reports a difference where the
      derivation says there is none is broken and every other number in the
      run is inadmissible.
    - >-
      SIDON POSITIVE CONTROL (blocking, the upper rung): a Bose-Chowla base
      must attain coverage near min(1, mean), reproducing KN-FIND-007's
      measured ratio 1.1071 within 10 percent. A battery that cannot detect
      the KNOWN good geometry has no power and its collapse finding means
      nothing.
    - >-
      PLANTED-DEFECT LADDER D1, D2, D3 (blocking). See null_object.
    - >-
      EXACT-IDENTITY CHECK per cell against 2^m*binom(B+m-1,m) divided by the
      ORDER OF THE SUBGROUP GENERATED BY V, with that order COMPUTED per cell
      rather than assumed. Deviation must be exactly 0.
    - >-
      CURVE-FREE Z/M ARM (blocking) with the pre-declared consequence above.
    - >-
      SEED-PATH ASYMMETRY DISCLOSURE: the harness seed argument is consumed
      only on the full_curve path, so the target_subgroup base has no seed
      variation and its spread across seeds is identically zero. Reporting a
      seed spread for that arm is PROHIBITED by this contract.

  metrics:
    primary:
      - "R_yield = mean yield (target_subgroup) / mean yield (full_curve), at matched B and m, targets the complete order-N subgroup in both arms; dimensionless; compared against h with a 5 percent band"
      - "R_cov = coverage / mean yield for the harness target_subgroup base at m = 2; dimensionless; compared against 2/B"
      - "R_cov_null = coverage / mean yield for NULL-A at matched B and group; dimensionless; the ratio R_cov_null / R_cov must exceed B/4"
      - "identity_deviation = |measured total multiset count - 2^m*binom(B+m-1,m)| per cell; ABSOLUTE INTEGER COUNT of size-m signed multisets; required exactly 0 on every clean cell"
    secondary:
      - "exact mean yield per arm and cell; dimensionless count of decompositions per target"
      - "exact coverage per arm and cell; dimensionless fraction of the N targets in [0,1]"
      - "multiplicity histogram and concentration statistic (max multiplicity divided by mean) per arm; dimensionless"
      - "order and structure of the subgroup generated by V, per cell; integer order plus invariant factors"
      - "curve order M, subgroup order N, cofactor h per curve; integers"
      - "Sidon control coverage ratio against the 1.1071 reference; dimensionless"
      - "absolute log-ratio error of the corrected model 2^m*binom(B+m-1,m)/(h*N) and of the uncorrected (B/N)^2 model against the three decomposition probabilities quoted verbatim from KN-OPEN-5b3a08 Q2; dimensionless"
      - "planted-defect ladder: fired / did not fire per defect per cell, with the measured deviation against the forced integer"
      - "curve-free Z/M arm: R_yield and R_cov, and their differences from the curve arm; dimensionless"
      - "variance-to-mean ratio of the multiplicity histogram per arm; dimensionless"
      - "residual correlation between h and N across the selected curve set; Spearman rho, dimensionless"
      - "peak RSS in GiB and wall-clock seconds per cell"

  heuristic_under_test: HEUR-FB-1

  scale_relevance:
    tier: toy
    justification: >-
      p at most 2^14, B at most 32, m = 2, exhaustive over the complete
      target set so that every reported mean and coverage is exact rather
      than estimated. NO TRANSFER TO CRYPTOGRAPHIC SCALE IS CLAIMED OR
      LICENSED, and the cryptographic-scale form of P1 is EMPTY rather than
      merely untested: standardised curves have h in {1,2,4,8}, and at h = 1
      the predicted ratio is exactly 1. This is stated here so that a
      measured ratio of order 10^4 at 24 bits is never read as a
      cryptographic quantity.
    correspondence: null

  tail_checks:
    - "Every cell whose generated subgroup is PROPER is reported individually with its index and EXCLUDED from the ratio computation rather than averaged over."
    - "The maximum observed multiplicity in the NULL-A arm against the Poisson upper tail at 1/1000."
    - "The observed count of zero-decomposition targets against exp(-mean), the coverage bound instantiated."
    - "The cells nearest the B >= N/4 exclusion boundary, reported separately, since the interval reading of the exponent set is weakest there."
    - "The B = 4 cells, where NULL-A and the harness base are least separated, reported apart from B >= 8."

  replication:
    seeds: [1, 2, 3, 4, 5]
    independent_instances: 12
  seeds_policy: >-
    Five declared seeds, fixed in this contract before execution and never
    re-drawn after seeing an outcome. Seeds govern ONLY the full_curve base,
    the matched random subgroup base and the curve-free random arms; the
    harness target_subgroup base and the Sidon base are deterministic and
    their reported seed spread is identically zero BY CONSTRUCTION, which is
    disclosed rather than reported as a measurement. Every cell record
    carries (curve, B, arm, seed) and the RNG algorithm and its state, so any
    cell is independently reproducible. A cell re-run under a new seed is a
    NEW cell, never a replacement.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 6
    maximum_memory_gb: 8
    maximum_runs: 6
    maximum_workers: 1
  budget_note: >-
    Sized to the work, not to a tool window. Exhaustive enumeration over a
    subgroup of order at most 2^14 with B at most 32 is at most 2^14 * 32
    point additions per cell and the largest object held is a histogram of N
    counters, well under 200 MB; the 8 GB figure is the schema floor and is
    not expected to be approached. Peak RSS is a required reported metric
    precisely so the envelope prediction can fail.

  stopping_rules:
    - "Stage 0 is a HARD GATE with zero compute: re-read build_factor_base's target_subgroup branch in the committed source and confirm the exponent set is the interval 1..B up to x-collisions. If a later commit has changed it (for instance by shuffling), the small-multiples diagnosis does not apply, the run STOPS, and the record is re-scoped before anything else executes."
    - "Stage 0 also computes, per cell, the predicted separation between the harness base and NULL-A; cells where the predicted separation is below a factor 2 are ABORTED as having no resolving power."
    - "The planted-defect ladder runs BEFORE the main battery. If D1 or D2 fails to fire, or D3 fires, the run STOPS and reports an instrument failure."
    - "Any cell whose exact-identity check deviates from 0 halts every arm; nothing is reported from that run."
    - "A cell exceeding the per-cell memory or wall-clock envelope is recorded as not computable in budget and is an INFRASTRUCTURE stop under AGENTS.md rule 5, never evidence."

  invalidation_rules:
    - "Any execution while status is not approved, or while execution_authorized is false."
    - "Comparing arms whose target sets differ; both arms must range over the SAME order-N subgroup."
    - "Applying different sign conventions in the two arms."
    - "Editing harness/semaev.py to implement the random subgroup base; the null must be implemented separately so the harness path under audit is the one measured."
    - "Reporting a seed spread for the deterministic target_subgroup or Sidon arms."
    - "Including a cell with B >= N/4, or a cell whose generated subgroup is proper, in any ratio."
    - "Any post-hoc change to the 5 percent band, the factor-B/4 threshold, or the forced planted-defect integers. A change requires a versioned protocol_amendment record before the affected cells are re-read."

  success_criterion: >-
    The run is SUCCESSFUL as a measurement (independently of which way the
    predictions fall) when: every blocking control passes - matched-h shows
    no difference, the Sidon control reaches the ceiling, the planted-defect
    ladder fires on D1 and D2 and not on D3, and the exact-identity check is
    0 in every clean cell; at least 200 clean cells are recorded across at
    least 10 curves; and R_yield, R_cov, R_cov_null and the curve-free arm's
    counterparts are reported with their bands for every cell. A run meeting
    this criterion is admissible evidence whatever the verdict on P1 and P2.

  falsification_criterion: >-
    P1 IS FALSIFIED if R_yield lies within 5 percent of 1 rather than of h in
    a majority of clean cells at h >= 100. P2 IS FALSIFIED if
    R_cov_null / R_cov is below B/4, and specifically if it is within a
    factor 2 of 1, in a majority of clean cells at B >= 8. THE DIAGNOSIS
    INVERTS if NULL-A also collapses, i.e. R_cov_null itself falls below
    min(1, mean)/mean by more than a factor 4. THE INSTRUMENT IS VOID if the
    Sidon control misses the ceiling, if the matched-h control reports a
    difference, if any planted defect misbehaves, or if the exact-identity
    check is nonzero. THE SCOPE COLLAPSES TO A NON-CURVE STATEMENT if the
    curve-free Z/M arm reproduces both predictions within their bands, and in
    that case the pre-declared consequence in null_object binds absolutely.

  required_artifacts:
    - "Stage 0 receipt quoting the committed target_subgroup branch verbatim, with the file sha256 at the time of reading."
    - "The three decomposition probabilities and three cofactors of KN-OPEN-5b3a08 Q2 quoted verbatim from the committed entry, with its sha256, before the corrected model is instantiated against them."
    - "Per-cell records: curve, p, M, N, h, group structure, generated-subgroup order, B, arm, seed, sign convention, exact mean, exact coverage, multiplicity histogram, identity deviation."
    - "The planted-defect ladder table: defect, forced integer, measured value, fired yes/no, per cell."
    - "The curve-free Z/M table with the same columns as the curve arm."
    - "The corrected-versus-uncorrected log-ratio error table at the three sizes."
    - "Run manifest with exact command, git commit and dirty-tree state, environment and dependency versions, RNG algorithm and seeds, requested policy, resolved model identifier and probe status, stdout and stderr, peak RSS, wall clock."
    - "A written construction recommendation naming which scope, which geometry, and the measured yield and coverage cost of each - the deliverable."

  assigned_to: executor

  limitations:
    - >-
      TOY SCALE ONLY. Nothing transfers to cryptographic parameters, and the
      cryptographic form of P1 is empty at h = 1 rather than untested.
    - >-
      Scoped to m = 2 in every measured arm. The denominator argument is
      arity-independent; the coverage count is m = 2 only.
    - >-
      A verdict on P1 and P2 does not validate or invalidate any committed
      number in any prior experiment. Any such consequence requires its own
      correction record and Coordinator decision.
    - >-
      This contract does not address the s4_expr audit item of
      KN-OPEN-5b3a08, which is separate and still open.
    - >-
      The P2 diagnosis rests on a reading of a MUTABLE source file. Stage 0's
      re-read is what keeps that reading current; if the file has changed,
      the diagnosis is re-scoped rather than forced.
    - >-
      No attack, no exponent, no algorithm, in either direction.
