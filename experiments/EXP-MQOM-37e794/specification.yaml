experiment:
  id: EXP-MQOM-37e794
  hypothesis_id: H-MQOM-43932c
  derived_from_idea: IDEA-20260805-7abf04
  question_id: RQ-MQOM-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    The zero-slack audit - exact integer reconstruction of the published parameter table, the slack
    integers of both design inequalities, a matched null family run and committed BEFORE the signal
    arm, a one-bit responsiveness control, and a ledger of omitted terms with an unresolved count
  objective: >-
    The one uncertainty a run reduces is whether this signature design carries any reserve against the
    terms its own soundness inequalities omit. A run establishes six things, all by exact integer
    arithmetic or by documented reading. First, whether the published repetition counts are reproduced
    exactly by the design equation. Second, the slack integers of both design inequalities at every
    published instance. Third, the slack of the variant whose corresponding parameter is FORCED rather
    than freely chosen, which is the asymmetry that separates deliberate tuning from a ceiling that
    happens to round. Fourth, the slack distribution on matched null families that satisfy the same
    inequality without having been tuned to it, computed and committed BEFORE the published family is
    looked at. Fifth, whether the instrument moves by exactly one under a one-bit perturbation of a
    published parameter. Sixth, a ledger of the omitted terms, each marked derived, derivably zero, or
    unresolved, with the unresolved count in the headline. NO PREDICTION IS MADE for the ledger's total.
    No forgery is attempted, no signature is produced, no oracle is queried, and no security verdict is
    recorded.
  what_this_is_not:
    - >-
      Not an attack, a forgery, a distinguisher, or a break. Zero compute is spent on any cryptographic
      operation; the audit consumes zero signatures and zero oracle queries.
    - >-
      Not a claim that the scheme fails any claimed security level. The ledger's total is pre-registered
      as unknown and may be zero, and a ledger with unresolved lines may not be summed at all.
    - >-
      Not an accusation against the designers. A design tuned to the edge of its own inequality is a
      legitimate and efficient choice; the audit records the consequence, not a fault.
    - >-
      Not a statement in any quantum-accessible-oracle model, and not a statement about any specification
      version other than the one audited.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run has been executed under
      this contract.
  claim_ceiling:
    tier: arithmetic_audit
    exact_scope_a_run_could_support: >-
      Maximal supportable scope. The published repetition counts are or are not reproduced by the design
      equation; the slack integers take stated exact values at stated instances; the forced-parameter
      variants carry stated slacks; the null families' slack distribution has a stated spread and zero rate;
      the instrument does or does not respond to a one-bit perturbation; and the ledger has these lines with
      these markers and this unresolved count. WHAT DOES NOT FOLLOW. No statement that the scheme provides
      fewer bits than claimed - that requires a completed ledger with every line derived, and even then is
      scoped to this version and this oracle model; no statement in any quantum model; and no bit cost for
      any line resting on an unretrieved formula.
  inputs:
    procedure: >-
      STAGE 0, reading, zero compute, BLOCKING. Re-verify the published parameter table, both design
      equations, the sentence deferring the formal unforgeability proof, and the relaxed-opening offset
      against the RENDERED specification document, with quoted excerpts and page references. Cross-check the
      published instances against the designers' own public benchmark table through the published size
      formula. If the table as previously extracted is wrong, STOP and rewrite; no stage may proceed on
      extracted text.
      STAGE 1a, arithmetic, minutes, NULL ARM FIRST. Compute the slack distribution on the null families -
      the prior version's parameter table by the same designers, and a synthetic sweep in which the grinding
      parameter ranges over its admissible values with the repetition count recomputed by the ceiling formula
      - and COMMIT the result with a hash BEFORE the published family is computed or looked at.
      STAGE 1b, arithmetic, minutes. Compute the predicted repetition count and all three slack integers for
      every published instance in exact integer arithmetic.
      STAGE 1c, minutes. The RESPONSIVENESS CONTROL: perturb the grinding parameter of the published row with
      the smallest such parameter by plus and minus one with the repetition count held fixed, and require the
      slack to move by exactly plus and minus one.
      STAGE 1d, minutes. The GRADED CONTROL: at one fixed security-parameter and challenge-size pair, sweep
      the grinding parameter over at least five consecutive values and report the repetition count and slack
      at each, with the predicted sawtooth shape stated before the run and the observed shape compared to it.
      STAGE 2, reading, zero compute. Determine from the specification's algorithms whether the first-phase
      batching challenge is GLOBAL across the repetitions or drawn PER REPETITION, and record the answer with
      an algorithm-and-line citation. This single reading decides whether the split-repetition ledger line
      closes at one bit or requires a full optimization; it is the cheapest decisive gate and runs first after
      Stage 0.
      STAGE 3, derivation, zero compute. Fill the remaining ledger lines with derived bit costs or explicit
      derivably-zero statements, in ONE declared convention for what a claimed level means, leaving the
      salt-and-seed line to its own separate record rather than double-counting it. Report the ledger with its
      unresolved count in the headline.
    instrument: >-
      Exact integer arithmetic in pure Python under experiments/EXP-MQOM-37e794/driver/; no floating point
      anywhere in the slack computation, since the whole content is integer equality. A documented reading
      stage produces quoted excerpts with page references from the rendered document, or a recorded
      could-not-obtain receipt. Nothing under harness/ is modified. Recorded through harness/runner.py.
    parameters: >-
      Specification version 2.1 and only that version. Three slack functionals: the Fiat-Shamir slack, the
      five-round batching slack, and the three-round batching slack whose corresponding parameter is forced by
      the packing. Null families: the prior version's parameter table, and a synthetic sweep of the grinding
      parameter from 1 to 24 at each published security-parameter and challenge-size pair. Graded sweep at one
      fixed pair over five consecutive grinding values. One declared convention for the meaning of a claimed
      level, fixed at Stage 0 and used for every ledger line.
  controls:
    - >-
      NULL FAMILY ARM, RUN AND COMMITTED BEFORE THE SIGNAL ARM. Families satisfying the same inequality without
      having been tuned to it. FORCED VALUE derived before the run: in the synthetic sweep the fraction of
      grinding values giving zero slack is exactly the reciprocal of one less than the log challenge size, and the
      observed fraction must match that to within the exact count. THIS NULL CAN FAIL - if the sweep returns zero
      for every grinding value, the statistic is a constant of the apparatus and the headline is void.
    - >-
      RESPONSIVENESS / POSITIVE CONTROL, MANDATORY. A one-bit perturbation of a published grinding parameter must
      move the slack by exactly one. If the instrument does not respond to a one-bit perturbation of a published
      parameter, the arithmetic pipeline is broken and NO negative result may be reported from any stage.
    - >-
      GRADED CONTROL with at least three interior points and the response shape stated before the run. The
      repetition count must step exactly where the ceiling's numerator crosses a multiple of one less than the log
      challenge size, and the slack must trace the complementary sawtooth. A monotone or flat response localizes a
      bug in the ceiling implementation rather than leaving an unlocated anomaly.
    - >-
      VERDICT-ON-THE-NULL-FIRST. The frozen decision rule - is this family tuned to the edge - is executed on the
      null arm and committed BEFORE the published arm is read. If it emits the same verdict on both, the rule
      discriminates nothing and must be rewritten before the published arm is looked at.
    - >-
      ARCHIVE CHECK, zero compute. List every prior archived measurement of this observable in this corpus. The
      parent proposal records that none exists; that unavailability is recorded rather than claimed as a passed check.
    - >-
      READING-BEFORE-DERIVING. Stage 2's structural reading precedes Stage 3's derivations, so no ledger line is
      derived under an assumption the specification settles.
  independent_variables:
    - 'family: published parameter table / prior version table / synthetic grinding sweep'
    - 'slack functional: Fiat-Shamir / five-round batching / three-round batching'
    - grinding parameter, swept in the null and graded arms
    - 'perturbation: none / plus one / minus one'
  metrics:
    primary:
      - >-
        Repetition-count reproduction count, an integer out of six. Computed as the number of distinct published
        rows whose published repetition count equals the ceiling formula evaluated in exact integers.
      - >-
        Fiat-Shamir slack integer per published instance, an exact integer. Computed as the repetition count times
        one less than the log challenge size, plus the grinding parameter, minus the security parameter.
      - >-
        Five-round batching slack integer per published instance, an exact integer.
      - >-
        Three-round batching slack integer per published instance, an exact integer. Predicted strictly positive;
        this is the asymmetry metric.
      - >-
        Null-family zero rate and slack spread. Computed as the fraction of swept grinding values giving zero slack,
        against the forced fraction, plus the range and distinct-value count of the null slack distribution.
      - >-
        Responsiveness-control displacement, an integer that must equal plus one and minus one respectively.
    secondary:
      - >-
        The eighteen-instance reproduction table with published and predicted repetition counts side by side.
      - >-
        The graded sweep table with the repetition count and slack at each swept grinding value, and an explicit
        verdict on whether the observed shape matches the pre-registered sawtooth.
      - >-
        The first-phase challenge structure, a boolean with an algorithm-and-line citation.
      - >-
        The ledger: one row per omitted term, each marked derived, derivably zero, or unresolved, with a bit cost
        where derived.
      - >-
        The unresolved-line count, which must appear in the headline of any record citing this run.
      - >-
        Verbatim quotation of the sentence deferring the formal unforgeability proof, with a page reference, or a
        recorded statement that it could not be re-obtained.
      - >-
        The relaxed-opening offset computed per parameter set, as a calibration of the scale at which such offsets
        arrive.
  heuristic_under_test: HEUR-MQOM-SLACK-2
  heuristic_under_test_note: >-
    HEUR-MQOM-SLACK-1 is explicitly NOT load-bearing and is established by direct evaluation in the same run. The
    field names the heuristic that carries the INTERPRETATION - that six exact zeros indicate deliberate tuning
    rather than coincidence - which the null arm tests directly.
  preregistered_prediction:
    quantity: >-
      The repetition-count reproduction count; the three slack integers at every published instance; the null
      family's zero rate; and the responsiveness displacement.
    formula: >-
      Predicted repetition-count reproduction EXACTLY 6 of 6 distinct rows. Predicted Fiat-Shamir slack EXACTLY 0 and
      five-round batching slack EXACTLY 0 at all eighteen published instances. Predicted three-round batching slack
      STRICTLY POSITIVE at all eighteen. Predicted null zero rate equal to the reciprocal of one less than the log
      challenge size at each shape, hence strictly below 1, with nonzero spread. Predicted responsiveness displacement
      exactly plus and minus one. Under the null that the statistic is a constant of the apparatus, the synthetic sweep
      returns zero slack at EVERY grinding value and the framing is void. NO PREDICTION is made for the ledger total;
      predicting it would be predicting the answer.
    source: >-
      Pre-registered in the parent proposal IDEA-20260805-7abf04, whose mechanism block derives every forced value in
      the proposing session from the published table and whose predictions block states them as minimum effects. These
      are DERIVED PREDICTIONS of that record, computed from numbers obtained through a lossy extractor, which is exactly
      why Stage 0 re-verification is blocking. No run has been executed here.
  scale_relevance:
    tier: arithmetic_audit
    justification: >-
      The audit is performed at the scheme's REAL published parameters - the security levels, challenge sizes and
      grinding parameters as specified - because the object is an exact integer identity in published numbers rather than
      a computation whose cost scales. There is therefore no toy-to-deployed gap and no transfer assumption in the
      arithmetic. The gap that does exist is EVIDENTIARY rather than one of scale: the numbers came through a lossy text
      extraction, so the entire audit is scoped to a table that Stage 0 must re-verify against the rendered document
      before any stage proceeds.
    correspondence: null
  tail_checks:
    - >-
      Report the null slack distribution's full value counts, not only its zero rate, since a distribution that is
      nonzero but concentrated on one nonzero value is a different object from a spread one.
    - >-
      Report every published instance's slack individually, not a summary, since the headline is an exact identity at
      every one and a single exception restates it.
    - >-
      Report the graded sweep's step locations against the predicted ones, since a step in the wrong place localizes a
      ceiling implementation bug that a matching endpoint would hide.
    - >-
      Report every ledger line marked unresolved with the reason it is unresolved, and refuse to sum any ledger
      containing one.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
    replication_note: >-
      The arithmetic is fully deterministic, so the three instances are a determinism check rather than a variance
      estimate; seeds vary only the order of the synthetic sweep. Any disagreement across instances is an implementation
      defect and invalidates the run.
  budget:
    wall_clock_seconds_per_run: 300
    total_cpu_hours: 0.1
    maximum_memory_gb: 2
    maximum_runs: 6
  stopping_rules:
    - >-
      STOP at Stage 0 if the re-verified table disagrees with the extracted one. The record is rewritten against the
      re-verified table before any number is computed.
    - >-
      STOP if the responsiveness control fails. Nothing negative may be reported from any stage.
    - >-
      STOP the interpretation arm if the null family returns zero slack at every swept value; record the controlled null
      and emit no positive reading.
    - >-
      Do NOT carry the salt-and-seed line here; it belongs to its own record and double-counting it would inflate the
      ledger.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop, never a negative
      result, under AGENTS.md rule 5.
  invalidation_rules:
    - >-
      A timeout, crash or dependency failure makes the run failed_infrastructure and is NEVER negative mathematical
      evidence. A failure to obtain the rendered document is likewise infrastructure and blocks the audit rather than
      producing a result.
    - >-
      A run in which the published arm was computed or inspected before the null arm was committed is
      invalid_measurement; the ordering is the only thing that makes the null a control rather than a comparison.
    - >-
      A run whose responsiveness or graded control is missing is invalid_measurement.
    - >-
      A run that sums a ledger containing an unresolved line is invalid_measurement, and any record citing such a sum is
      rejected.
    - >-
      A run whose parameters or specification version differ from this contract is a DIFFERENT experiment and requires a
      new contract; it is never a repair of this one.
  success_criterion: >-
    The run is successful when Stage 0's re-verification is completed with quoted excerpts and page references or is
    recorded as failed, the null arm is computed and committed before the published arm, all three slack integers are
    reported at every published instance beside the reproduction table, the responsiveness and graded controls are
    reported, the first-phase challenge structure is answered with a citation, and the ledger is emitted with every line
    marked and with its unresolved count in the headline. Success means a DECIDABLE run. H-MQOM-43932c is confirmed only
    if, in addition, six of six rows reproduce, the Fiat-Shamir and five-round slacks are exactly zero everywhere, the
    three-round slacks are strictly positive, the null zero rate is strictly below 1 with nonzero spread, and the
    responsiveness control moves by exactly one.
  falsification_criterion:
    - >-
      Any published repetition count differs from the ceiling formula. The reconstruction is wrong; the hypothesis is
      SUPERSEDED rather than patched and no slack is reported.
    - >-
      Any published instance has strictly positive Fiat-Shamir or five-round slack. The headline is false as stated and
      is restated as zero slack at a counted subset of the instances.
    - >-
      The synthetic null sweep returns zero slack at every grinding value. The statistic is a CONSTANT OF THE APPARATUS;
      the framing collapses to an observation about ceilings and is recorded as a controlled null with no positive
      interpretation.
    - >-
      The responsiveness control fails to move the slack by exactly one. The arithmetic pipeline is broken; the run set
      is VOID and nothing may be reported from it.
    - >-
      The three-round slacks are also zero. The free-versus-forced asymmetry is absent and the tuned-to-the-edge reading
      loses its support even if the zeros survive.
    - >-
      Stage 2's reading finds the query count already inside the bound, the phases already combined additively, and the
      first-phase challenge global. The three most consequential ledger lines close at zero or one bit, the total is
      small, and the accounting is tight and complete. This is the MOST LIKELY SINGLE OUTCOME, is a complete reportable
      result, and is pre-registered here so it cannot be reframed after the fact.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model and inference block, and
      environment.
    - >-
      The Stage 0 re-verification transcript with quoted excerpts and page references, or a recorded could-not-obtain
      receipt.
    - >-
      The committed null-arm result, hashed BEFORE the published arm was computed.
    - >-
      raw-result.json carrying every per-instance slack and reproduction value as exact integers, not summaries.
    - >-
      The responsiveness and graded control measurements, in the same file as the signal arm.
    - >-
      The first-phase challenge structure answer with its algorithm-and-line citation.
    - >-
      The ledger, one row per omitted term, each marked derived, derivably zero or unresolved, with the unresolved count.
    - >-
      The declared convention for the meaning of a claimed security level, fixed at Stage 0.
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution, and under this engagement approval is the USER's gate because it
      authorizes execution and spends compute. This contract is review_required and is NOT approved; approved_by is null
      and execution_authorized is false.
    - >-
      Stage 0 is BLOCKING. Approval to run does not authorize computing any slack from extracted rather than re-verified
      text.
    - >-
      The declared convention for what a claimed security level means must be fixed at approval time. Without it the
      ledger's lines are not on one scale and their sum is meaningless.
    - >-
      Any deliverable asserting a shortfall in a claimed level must be rejected unless every ledger line is marked derived,
      and even then it is scoped to this specification version and this oracle model.
  derivation_provenance:
    tool: coordinator subagent, design-experiment step
    source_record: IDEA-20260805-7abf04
    authored_at: '2026-08-25'
    note: >-
      The slack functionals, the forced values, the null families with their derived zero fractions, the responsiveness and
      graded controls, the verdict-on-the-null-first ordering, the ledger's line list and its three markers, and the refusal
      to predict the ledger total all come from the parent proposal's mechanism, predictions, minimal_test and controls
      blocks. Every numeric value in this contract is attributed to that record as a DERIVED PREDICTION of the proposing
      session, computed from a lossily extracted table, never as a measurement of this contract. Coordinator additions are
      the determinism framing of replication, the explicit prohibition on summing a ledger with unresolved lines as an
      invalidation rule rather than a note, and the requirement that the level convention be fixed at approval. Budgets come
      from the parent's declared low implementation and negligible compute.
  derivation_gaps:
    - >-
      The split-repetition ledger line rests on a RECALLED, UNVERIFIED cost formula that no agent in this program has
      retrieved. The line carries no number until it is retrieved or re-derived, and the ledger may not be summed while it is
      unresolved.
    - >-
      Every number in the parent record came through a lossy text extractor. Stage 0 exists solely to remove that exposure
      and the audit is worthless without it.
    - >-
      The convention for what a claimed security level means - a per-query probability, a total forgery work, or a bit
      security after a tightness loss - is used in at least three ways in this area. The ledger must fix ONE explicitly and
      restate every line in it, or its sum is meaningless. The contract requires this at approval and does not choose it here.
    - >-
      Producing an arithmetic observation about a submitted scheme is cheap and reads as rigour. The graded control and the
      pre-committed null exist precisely so that a tuned-to-the-edge conclusion costs something to reach, and a reviewer
      should check that they were run before reading the headline.
    - >-
      This contract is scoped to one specification version. When a later version appears, every number must be recomputed
      against it; carrying any figure forward without that recomputation is out of scope and is not authorized by this
      contract.
