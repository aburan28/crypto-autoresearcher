    the density precondition is load-bearing. The experiment's OWN
    controls (G1 at adequate density) confirm the identity. The G3
    threshold failure is an artifact of the parameter regime, not of the
    conservation law. This is an observation, not a conclusion.

supersingular_failure_statement: >-
  The volcano conservation argument fails for supersingular curves because
  End(E) is an order in the quaternion algebra B_{p,infinity}, not in an
  imaginary quadratic field Q(sqrt(D_K)). The class number h(D) of a
  binary quadratic form discriminant is undefined for quaternionic
  endomorphism rings. The entire counting framework (reduced forms,
  conductor formula, Gauss circle counting) is specific to the rank-2
  case. The pipeline correctly detects and refuses these curves via t=0.
