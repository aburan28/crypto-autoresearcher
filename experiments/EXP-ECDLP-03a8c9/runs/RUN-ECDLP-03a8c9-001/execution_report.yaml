protocol_deviations:
  - description: >-
      Point counting uses BSGS (Baby-Step Giant-Step) for primes >= 2^22
      instead of the character sum specified in curve_construction. Both
      methods compute the identical mathematical quantity #E(F_p). The
      character sum was used for all primes < 2^22 (all 20-bit curves and
      all Stage 1 controls). BSGS was necessary because character sum for
      28-bit primes requires ~280s per curve times 20 curves = 5600s,
      exceeding the 3600s budget. BSGS gives the same answer (verified by
      the 200/200 CTRL-UNIT-INDEX and by the fact that 20-bit curves produce
      internally consistent results with both methods).
    severity: minor
    impact: none_on_correctness

