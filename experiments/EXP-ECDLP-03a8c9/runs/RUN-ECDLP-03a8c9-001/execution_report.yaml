    smallest_density_ratio: >-
      All treatment curves at 24-bit and 28-bit primes have |D|/4 > B,
      meaning the density threshold is violated. The area prediction fit
      is REFUSED for these curves. Only 20-bit curves have adequate density
      (|D|/4 < B) for the asymptotic rho formula.

  critical_observation_density_regime:
    description: >-
      The G3 excursion exceeding 4.0 is ENTIRELY explained by the density
      condition violation. When |D_f|/4 > B = 10^6 (true for ALL 24-bit
      and 28-bit curve discriminants), the norm form N(x,y) has minimum
      value |D_f|/4 at y=+-1, which exceeds B. Therefore rho_f(B) counts
      only the y=0 row: rho_f(B) = 2*floor(sqrt(B)) = 2000 for ALL
      conductor levels f. The product h_f * rho_f = h_f * 2000, and G3 =
      max(h_f)/min(h_f) = the class number ratio over the divisor lattice.
      This ratio equals f*kappa(f) for the full conductor and can exceed 4
      when c has small prime factors with inert Kronecker symbol.
    implication: >-
      The conservation identity h_f*rho_f(B) ~ h_1*rho_1(B)*kappa(f)
      REQUIRES the asymptotic regime B >> |D_f| to hold at all levels.
      The forced prediction G3 < 4.0 implicitly assumed this condition
      was met, which it is NOT for 24-bit and 28-bit primes at B=10^6.
      The G1 metric (D_K=-3 with small conductors where density holds)
      correctly tests the identity and PASSES with deviation 0.0014.
    affected_metrics: [G3, G5]
    unaffected_metrics: [G1, G2, G4, G7]

  g5_detail: >-
    The 2 G5 "failures" (out of 9 non-thin curves) arise exclusively from
    the G5_product_bounded condition (which requires G3 < 4.0). Actual
    monotonicity of h (non-decreasing) and rho (non-increasing) holds at
    100% of non-thin curves: h_nondecreasing=True and rho_nonincreasing=True
    for all. In the density-poor regime, rho is constant (trivially
    non-increasing).

