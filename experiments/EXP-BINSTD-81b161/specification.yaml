  objective: >-
    After EV-BINSTD-f1d8e2, decide whether raised dimVV/N_var floors on a
    new (17,4) catalog make the legacy Spearman 0.70 band reachable by
    permutation or random-Boolean same-shape nulls (instrument question).
    Do not re-test Weil uniqueness on 3×2 support.

  class: heuristic_validation
  class_note: >-
    Pre-registered null-reachability of a Spearman band on an encoding-size
    instrument. Not an exponent-moving breakthrough; no ECDLP attack table.

  scope:
    included:
      - >-
        Stage 0. Freeze support-seeking catalog for (17,4) and
        product-rank-escape catalog for (17,3) (≥48, ≤128); freeze
        preregistered-predictions.json (legacy band 0.70 as null target,
        seeds 2026100350/51/52, floors 5/4, package_scope={(17,4)},
        diagnostic escape rule, Stage-2 auth, encoder pin); twin self-check.
      - >-
        Stage 1. Measure twin dimVV and twin N_var on (17,3) diagnostic and
        (17,4) package; PACKAGE admission floors on (17,4) only
        (≥5 dimVV, ≥4 N_var); diagnostic label on (17,3); write
        panels/control-table/RESULTS.md. No package O-SUPPORT/O-FAIL-BAND.
      - >-
        Stage 2. When (17,4) floors met: permutation dimVV null +
        random-Boolean matched-catalog null vs 0.70; write
        stage2/null-results.json and append Stage-2 section to RESULTS.md.
    excluded:
      - Re-running EXP-BINSTD-4b846c (seed 2026100340), EXP-BINSTD-9b18fc
        (2026100330), EXP-BINSTD-16ee30 (2026100320), or EXP-BINSTD-5b2fd0
        (2026100317).
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Re-testing Weil uniqueness vs 0.70 on 3×2 support.
      - Reading package O-SUPPORT/O-FAIL-BAND or O-STRUCTURE-SPECIFIC-FAIL-BAND
        as this card's HEUR.
      - Editing IDEA claim text or GOAL-ECDLP2M-001.yaml.
      - Editing the 0.70 null-target after Stage-0 freeze.
      - Treating infra failure as mathematical evidence.
      - Using parent 3×2 floors as admission.
      - Promoting KN-FIND.

