  inputs:
    source_idea: ledger/proposals/IDEA-20261003-a60107.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-af1faf.yaml
    predecessor_evidence: EV-BINSTD-f1d8e2
    predecessor_decision: DEC-20261003-4bb57d
    predecessor_experiment: EXP-BINSTD-4b846c
    legacy_spearman_band: 0.70
    catalog_seed: 2026100350
    bootstrap_seed: 2026100351
    null_seed: 2026100352
    bootstrap_reps: 200
    null_reps: 200
    min_catalog: 48
    max_catalog: 128
    admission_floor_dimVV: 5
    admission_floor_Nvar: 4
    forbidden_catalog_seeds: [2026100317, 2026100320, 2026100330, 2026100340]
    package_cells:
      - {n: 17, ell: 4}
    diagnostic_cells:
      - {n: 17, ell: 3}
    stage1_cells:
      - {n: 17, ell: 3}
      - {n: 17, ell: 4}

  controls:
    - name: twin_dimVV
      definition: >-
        product_space.dim_vv_path_a == dim_vv_path_b on every measured V.
    - name: twin_Nvar
      definition: >-
        encode_s3 N_var path A == path B (independent linear elim) on every
        measured V.
    - name: ctl_fixed_dim_V
      definition: Every catalog entry has exactly ℓ basis elements (dim ℓ).
    - name: ctl_frozen_V_catalog
      definition: Catalog frozen in stage0/v-catalog.json before Stage 1.
    - name: ctl_no_posthoc_band_edit
      definition: Legacy band 0.70 frozen in preregistered-predictions.json.
    - name: ctl_admission_floors_before_null
      definition: >-
        ≥5 distinct dimVV and ≥4 distinct N_var required on package cell
        (17,4) before any Stage-2 null verdict; else O-INCONCLUSIVE.
        Diagnostic (17,3) does not gate.
    - name: ctl_diagnostic_17_3_independent_of_package
      definition: >-
        O-ESCAPE-OK-17-3 / O-INSTRUMENT-BOUNDARY-17-3 recorded independently.
    - name: ctl_not_prior_catalog_rerun
      definition: >-
        catalog_seed not in {2026100317, 2026100320, 2026100330, 2026100340};
        check.py refuses prior seed reuse.
    - name: null_permutation_dimVV
      definition: >-
        Stage 2: shuffle observed dimVV against fixed N_var (same-shape null).
    - name: null_random_boolean_matched_catalog
      definition: >-
        Stage 2: independent draws from observed dimVV support (matched
        cardinality); no Weil product-space structure.

  independent_variables:
    - name: stage
      levels:
        - 0_support_seeking_freeze
        - 1_enriched_floors_and_diagnostic
        - 2_null_ceiling_vs_legacy_band
    - name: cell
      levels: ['(17,3)-diagnostic', '(17,4)-package']
    - name: V_shape_family
      levels:
        - poly
        - geometric
        - product_rank_boost
        - sparse
        - support_seeking_random

  metrics:
    primary:
      - name: admission_floors_met_17_4
        unit: boolean
        definition: ≥5 distinct dimVV and ≥4 distinct N_var on package cell (17,4).
      - name: null_ci95_hi_vs_legacy_band
        unit: dimensionless
        definition: >-
          95% upper CI of Spearman ρ under permutation and random-Boolean
          same-shape nulls, compared to frozen 0.70.
      - name: diagnostic_17_3_outcome
        unit: categorical
        definition: O-ESCAPE-OK-17-3 or O-INSTRUMENT-BOUNDARY-17-3 (or O-ARTIFACT).
      - name: stage2_null_outcome
        unit: categorical
        definition: O-NULL-REACHES-LEGACY-BAND or O-NULL-CEILING-BELOW-LEGACY.
      - name: twin_agreement
        unit: boolean
        definition: Both twin meters agree on every measured V.
    secondary:
      - name: calibrated_band_B_cal
        unit: dimensionless
        definition: max(permutation ci95_hi, random-Boolean ci95_hi).
      - name: spearman_rho_disclosed
        unit: dimensionless
        definition: Observed Weil-catalog ρ; disclosed, not package HEUR.
      - name: bootstrap_ci_95_disclosed
        unit: interval
      - name: distinct_dimVV
        unit: integer
      - name: distinct_Nvar
        unit: integer
      - name: catalog_size
        unit: integer
      - name: wall_clock_seconds
        unit: seconds
      - name: peak_rss_bytes
        unit: bytes

  heuristic_under_test: HEUR-BINSTD-81b161-H1-NULLCEIL

  preregistered_prediction:
    quantity: >-
      After (17,4) admission floors (≥5 distinct dimVV, ≥4 distinct N_var),
      permutation-null OR random-Boolean matched-catalog null 95% upper CI
      of Spearman ρ(dim(V·V), N_var) ≥ 0.70. Independently: (17,3)
      product-rank escape yields O-ESCAPE-OK-17-3 or
      O-INSTRUMENT-BOUNDARY-17-3. Observed Weil ρ is disclosed only.
    formula: >-
      N_var = |nonlinear_support \ pivots| after F_2 Gaussian elimination
      of pure-linear equations from Weil-descended S_3; dim(V·V) via twin
      product-space ranks; (17,4) catalog by support-seeking diversity;
      (17,3) by product-rank-escape; Stage-2 same-shape nulls as frozen.
    source: >-
      IDEA-20261003-a60107 / EV-BINSTD-f1d8e2 follow-up; frozen before
      Stage 1 in stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Encoding-size instrument on n=17 only under this card. No transfer of
      a Spearman band into an n≥131 attack is claimed.
    correspondence: null

  tail_checks:
    - Twin disagreement voids null claims (O-ARTIFACT).
    - (17,4) admission floor failure → package O-INCONCLUSIVE (null not authorized).
    - Prior catalog seed reuse → protocol invalid / check.py FAIL.
    - Diagnostic (17,3) boundary does not restore package HEUR.
    - Stage-2 without (17,4) floors → O-IMPEDIMENT (gate), not a null result.
    - Package O-SUPPORT/O-FAIL-BAND vs 0.70 is a protocol invalid label.

  seeds_and_replication:
    catalog_seed: 2026100350
    bootstrap_seed: 2026100351
    null_seed: 2026100352
    bootstrap_reps: 200
    null_reps: 200
    independent_instances: 2
    note: >-
      Package cell (17,4) and diagnostic cell (17,3) are measured together;
      package HEUR uses Stage-2 nulls on (17,4) only. Twin meters are the
      replication instrument for each V. Seeds differ from 4b846c
      (2026100340/41/42), 9b18fc (2026100330/31), 16ee30 (2026100320/21),
      and 5b2fd0 v1 (2026100317/18).

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 10800
    total_cpu_hours: 6.0
    maximum_memory_gb: 2
    maximum_runs: 6
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and v-catalog.json.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - Stage 2 complete with stage2/null-results.json when Stage-1 authorizes, OR named O-IMPEDIMENT if gate fails.
    - RESULTS.md names package O-* from H-BINSTD-af1faf, diagnostic_17_3_outcome, and Stage-2 null when run.
    - maximum_runs = 6.
    - Do not re-run EXP-BINSTD-4b846c, EXP-BINSTD-9b18fc, EXP-BINSTD-16ee30, or EXP-BINSTD-5b2fd0 v1.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin failure → O-ARTIFACT; do not read null as support.
    - Package null outcome without (17,4) admission floors → protocol invalid.
    - Re-using catalog seeds 2026100317, 2026100320, 2026100330, or 2026100340 → protocol invalid.
    - Emitting package Weil uniqueness O-SUPPORT/O-FAIL-BAND under this card → protocol invalid.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an n≥131 exponent move → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with twin_ok true on probes and catalog_size
    ≥48 on Stage-1 cells; Stage 1 produces O-STAGE1-FLOORS-MET or
    O-INCONCLUSIVE (or named O-ARTIFACT/O-IMPEDIMENT) plus
    diagnostic_17_3_outcome; Stage 2 produces null_outcome when authorized
    (or O-IMPEDIMENT if gate fails); RESULTS.md names package O-* from
    H-BINSTD-af1faf plus diagnostic and null labels with cited artifacts.

  falsification_criterion: >-
    Any of: twin disagreement; post-hoc band edit; package null verdict
    without (17,4) floors; prior catalog re-run; package Weil uniqueness
    band labels; a claimed break/exponent under this card.
    (O-NULL-CEILING-BELOW-LEGACY, O-INCONCLUSIVE, and
    O-INSTRUMENT-BOUNDARY-17-3 are valid scientific negatives of the
    reachability prediction, not protocol fails.)

  required_artifacts:
    - experiments/EXP-BINSTD-81b161/trial-plan-v1.json
    - experiments/EXP-BINSTD-81b161/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-81b161/stage0/v-catalog.json
    - experiments/EXP-BINSTD-81b161/stage1/
