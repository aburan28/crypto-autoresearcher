experiment:
  id: EXP-ECDLP-de5206
  hypothesis_id: H-ECDLP-140a4d
  question_id: RQ-SIG-001
  version: 1
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    The D at or above 6 null the SIG lane owes, built as an independently
    generated matched-shape random system at each degree - with a zero-spread
    degeneracy stop, a swept planted cascade, and the null's own degree
    dependence reported as a first-class quantity

  objective: >-
    If separately approved, authorized and executed, measure the SIG lane s
    cascade statistic against a null that is generated INDEPENDENTLY AT EACH
    DEGREE from shape alone, so that the cascade s apparent persistence is
    separated from the null s own degree dependence. GOAL-SIG-001 s committed
    next_action reads, verbatim, "Protocol repair PASS (SIG-D6-NULL-RECAL-v2).
    Defer calibration executor until campaign capacity prioritizes D>=6 null
    recalibration; keep D<=5 cascade admissible." The obligation is therefore
    established program state and this contract is its discharge, not a new
    proposal to create one.

  what_this_is_not:
    - Not an exploitability test. If an excess survives, its exploitability needs its own cost table and this contract supplies none.
    - Not a replacement for the lane's admitted D at or below 5 baseline, which stays admissible and is the overlap check.
    - Not a discrete-logarithm computation, relation collection, or any ECDLP attack.
    - Not a status change to H-SIG-001, GOAL-SIG-001 or any other record.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling: >-
    Tier TOY, unraisable by any downstream citation. The exact scope a completed
    run could support is - at the tested curve, at the degrees actually reached,
    the Semaev cascade statistic does or does not exceed an independently
    generated matched-shape null by more than that null s own seed spread. It
    cannot support a statement about degrees not reached, about other curves, or
    about exploitability.

  falsifiable_prediction: >-
    PRE-REGISTERED BEFORE EXECUTION AND NEVER TUNED TO THE DATA.
    (1) The null s seed-to-seed spread is strictly greater than 0 at every
    degree.
    (2) A cascade planted at known size s is detected at EVERY swept s, with the
    measured magnitude monotone in s and matching the predicted magnitude within
    the seed spread.
    (3) The new independently generated null agrees with the lane s admitted
    D at or below 5 baseline within generation variance in the overlap.
    (4) The null s OWN cascade statistic as a function of degree is reported as a
    standalone quantity with its spread - the quantity an extrapolated baseline
    would have hidden.
    (5) BOUNDED is declared if the excess at D = 6 is within the null s own seed
    spread at D = 6; SURVIVING if it exceeds twice that spread; otherwise
    INCONCLUSIVE.

  measured_quantities:
    - name: cascade_statistic_sem
      definition: The lane's declared cascade statistic on the Semaev system at degree D.
      units: syzygy generators (dimensionless integer count)
    - name: cascade_statistic_null
      definition: >-
        The same statistic on an independently generated matched-shape random
        system at degree D, per null seed.
      units: syzygy generators (dimensionless integer count)
    - name: null_seed_spread
      definition: >-
        max minus min of cascade_statistic_null over the null seeds at a degree.
        REPORTED BEFORE ANY EXCESS IS COMPUTED.
      units: syzygy generators (integer)
    - name: cascade_excess
      definition: cascade_statistic_sem minus the mean of cascade_statistic_null at the same degree.
      units: syzygy generators (integer, signed)
    - name: null_degree_dependence
      definition: >-
        The mean null statistic as a function of degree, and its first
        difference between adjacent degrees.
      units: syzygy generators, and syzygy generators per degree
    - name: planted_detection_magnitude
      definition: >-
        Measured increase in the statistic after planting a cascade of declared
        size s, against the pre-computed predicted increase.
      units: syzygy generators (integer)
    - name: unmatched_shape_dimensions
      definition: >-
        The explicit enumeration, per degree, of every shape dimension the null
        does NOT match.
      units: categorical list

  metrics:
    primary: [cascade_statistic_sem, cascade_statistic_null, null_seed_spread, cascade_excess, null_degree_dependence]
    secondary: [planted_detection_magnitude, unmatched_shape_dimensions]

  null_and_control_objects:
    - id: NULL-MATCHED
      name: independently generated matched-shape random system at each degree
      construction: >-
        At each degree D, generate random systems matched to the Semaev system on
        variable count, degree sequence, sparsity and field, with NO curve
        structure anywhere in the generator, and with every generation parameter
        at that D derived ONLY from the Semaev system s shape at that D. NO
        PARAMETER IS FITTED, TUNED OR SELECTED USING DATA MEASURED AT ANY OTHER
        DEGREE, and that independence must be auditable from the run record.
      forced_value: none - the arm IS the reference
      non_vacuity: >-
        Enforced by NULL-SPREAD below. A reference with zero spread is a constant
        masquerading as a distribution.
      curve_free_status: >-
        THE REFERENCE IS ITSELF CURVE-FREE BY CONSTRUCTION. See
        consequence_pre_declared.
    - id: NULL-SPREAD
      name: zero-spread degeneracy stop
      construction: >-
        At least 3 independently seeded null generations at every degree, spread
        computed and reported before any excess.
      forced_value: spread strictly greater than 0 at every degree
      non_vacuity: >-
        THIS IS THE CONTROL THAT PREVENTS A WIDTH-ZERO DISCRIMINATOR. If the
        generator produces the same statistic for every seed, the excess is a
        comparison against a constant, its uncertainty is undefined, and no
        BOUNDED verdict from it means anything. That degree is stopped and
        reported.
    - id: PLANT-CASCADE
      name: swept planted cascade in a random system
      construction: >-
        A cascade of declared size s planted into a matched-shape random system,
        s swept over at least 4 values spanning an order of magnitude, with the
        predicted statistic increase computed before the run.
      forced_value: >-
        Detected at every s, monotone in s, matching the predicted magnitude
        within the seed spread.
      non_vacuity: >-
        THIS IS THE DEMONSTRATED-DYNAMIC-RANGE CONTROL. A statistic that cannot
        see a cascade it was told about cannot report the absence of one, and a
        statistic that fires only at the largest planted size cannot report a
        small excess as absent.
    - id: CONTROL-OVERLAP
      name: agreement with the lane's admitted D at or below 5 baseline
      construction: >-
        At every degree where both the new null and the lane s admitted baseline
        exist, compare them directly. The baseline s values are resolved from
        committed artifacts at Stage 0, never taken from prose.
      forced_value: agreement within measured generation variance
      non_vacuity: >-
        Genuinely capable of failing, and its failure is a finding about the
        EXISTING baseline rather than about this experiment.

  consequence_pre_declared: >-
    THE NULL ARM IS CURVE-FREE BY CONSTRUCTION AND THE CONSEQUENCE IS FIXED IN
    ADVANCE. If the Semaev arm and the matched curve-free arm are
    indistinguishable at every degree actually reached, then the cascade at those
    degrees is a property of systems of that SHAPE, and NOTHING from this
    experiment may be quoted as a statement about elliptic curves or the ECDLP.
    This contract records that as the more likely outcome at D = 6 before
    execution, so that it cannot be reframed as a surprise afterwards.

  independent_variables: [degree, arm, null_seed, planted_cascade_size]

  preregistered_prediction:
    quantity: cascade_excess at each degree, against null_seed_spread at that degree
    formula: >-
      excess(D) = statistic_sem(D) minus mean over seeds of statistic_null(D).
      BOUNDED if excess(6) is within spread(6). SURVIVING if excess(6) exceeds
      2 times spread(6). Otherwise INCONCLUSIVE.
    source: ledger/hypotheses/H-ECDLP-140a4d.yaml predictions P1 through P6
    values_frozen_here:
      degrees: [4, 5, 6]
      null_seeds_per_degree: 3
      spread_required: strictly greater than 0
      bounded_rule: excess within spread at D = 6
      surviving_rule: excess greater than 2 times spread at D = 6
      planted_sizes: at least 4 values spanning an order of magnitude

  decision_rule_that_falsifies: >-
    THE RECORD IS FALSIFIED, and its central claim rejected in scope, IF the
    cascade excess at D = 6 EXCEEDS twice the null s seed spread there, with
    every control passing and the curve-free consequence not triggered. The
    cascade then survives an independently generated matched null at D = 6 and
    the lane s question stands on much better footing.
    THE RECORD IS SUPPORTED IN SCOPE IF the excess at D = 6 is within the seed
    spread, with every control passing. The cascade is bounded at the tested
    scope.
    THE RUN IS INVALID, and no verdict of either kind may be reported, if the
    null spread is exactly 0 at a degree, if the planted cascade is not detected
    at every swept size, or if the overlap check fails and is unresolved.

  stages:
    - id: S0
      name: baseline resolution and shape specification
      terminates_run: false
      description: >-
        Resolve the lane s admitted D at or below 5 baseline values from
        committed artifacts, or mark them UNRESOLVED. Specify the matched shape
        fully and ENUMERATE every dimension the null does not match. An
        unenumerated mismatch invalidates the comparison at that degree.
    - id: S1
      name: null generation and spread
      terminates_run: true
      description: >-
        Generate the null independently at each degree and report the seed spread
        BEFORE anything else. Zero spread at a degree stops that degree.
    - id: S2
      name: planted cascade sweep
      terminates_run: true
      description: >-
        PLANT-CASCADE at every declared size. Failure to detect at any size, or
        non-monotone detection, ENDS the run; no negative is reportable from an
        instrument with no demonstrated dynamic range.
    - id: S3
      name: overlap check
      terminates_run: true
      description: >-
        Compare the new null against the admitted baseline where both exist.
        Disagreement beyond generation variance BLOCKS the lane and is reported
        as a finding about the existing baseline.
    - id: S4
      name: D = 5 rung
      terminates_run: false
      description: Both arms at D = 5, paired, with the null's own value reported separately.
    - id: S5
      name: D = 6 rung
      terminates_run: false
      description: >-
        Both arms at D = 6. If either arm does not complete inside the per-cell
        budget, the degree is reported as failed_infrastructure with its resource
        trace and NO negative is derived from it.
    - id: S6
      name: verdict
      terminates_run: false
      description: >-
        Report the null s own degree dependence first, then the excess per
        degree, then the frozen decision rule and the curve-free consequence
        verdict.

  replication:
    seeds: [0, 1, 2]
    independent_instances: 3
    seeds_per_cell: 3
    seeds_policy: >-
      Every null system is addressed by (degree, seed_index, planted_size) and
      its seed is derived deterministically as a SHA-256 over the ASCII bytes of
      the domain string, those fields in that order, and the declared master
      seed, reduced to 64 bits. The domain string is EXP-ECDLP-de5206/v1. THE
      DERIVATION USES THE DEGREE AS AN INPUT AND NOTHING MEASURED AT ANY OTHER
      DEGREE, which is what makes the per-degree independence auditable from the
      run record rather than asserted in prose. The master seed is fixed in the
      frozen contract before any execution and is never re-drawn.
    determinism_requirement: >-
      Re-running any tuple must reproduce the identical system hash and the
      identical cascade statistic. Any cell failing this is INVALID.

  budget:
    wall_clock_seconds_per_run: 21600
    total_cpu_hours: 200
    maximum_memory_gb: 16
    maximum_runs: 60
    maximum_workers: 1
    note: >-
      Sized to the work. Solving matched-shape random systems at D = 6 is the
      binding constraint and the recorded reason this work was deferred; the
      D = 6 cells dominate the budget entirely. If they exhaust it, that is
      infrastructure, not a result.

  stopping_rules:
    - Null seed spread is exactly 0 at a degree -> STOP that degree, report a degenerate null, compute no excess there.
    - PLANT-CASCADE not detected at any swept size, or non-monotone -> STOP, instrument not fit for purpose, no negative reportable.
    - Overlap disagreement beyond generation variance -> STOP, report the disagreement as a finding about the existing baseline; the lane is blocked until it is resolved.
    - Either arm exhausts the per-cell budget at a degree -> STOP that degree, report failed_infrastructure with the largest degree reached; NEVER extrapolate the lower-degree null to fill the gap.
    - Solver timeout asymmetry between arms at a degree -> that degree's comparison is WITHDRAWN as a measurement against a non-measurement.

  invalidation_rules:
    - Any null parameter at a degree that was fitted, tuned or selected using data from another degree invalidates that degree. This is the exact confound the contract exists to prevent.
    - Any excess reported without the null seed spread reported first is invalid.
    - Any excess reported at a degree with an unenumerated unmatched shape dimension is invalid.
    - Any negative derived from a budget-exhausted or timed-out cell is invalid on its face.
    - Any quoted number lacking the curve-free consequence verdict on its face is invalid.
    - Any statement about exploitability, about degrees not reached, or about cryptographic scale drawn from this contract is invalid on its face.

  success_criterion: >-
    ALL of - (a) every reached degree has a null seed spread strictly greater
    than 0; (b) the planted cascade is detected at every swept size with monotone
    magnitude; (c) the overlap check agrees within generation variance, or its
    disagreement is reported as the finding; (d) the null s own degree dependence
    is reported as a standalone quantity with its spread; (e) every unmatched
    shape dimension is enumerated per degree; (f) the frozen decision rule is
    applied at the highest degree reached and a verdict of BOUNDED, SURVIVING or
    INCONCLUSIVE is assigned, with the curve-free consequence verdict alongside.
    Reaching INCONCLUSIVE, or reaching only D = 5 because D = 6 exhausted budget,
    is a SUCCESSFUL run of this contract provided the infrastructure receipt is
    complete; only failing (a) through (e) is unsuccessful.

  falsification_criterion: >-
    A cascade excess at D = 6 exceeding twice the null s seed spread, with every
    control passing and the curve-free arm distinguishable from the Semaev arm.
    H-ECDLP-140a4d s central claim is then rejected in the tested scope.
    Secondary falsifiers of the DESIGN rather than the hypothesis - a degenerate
    null, an undetected planted cascade, an unresolved overlap disagreement, or
    an unreachable D = 6. In every case the failing degree and arm are named, and
    forward guidance names the next object.

  required_artifacts:
    - results.json with both arms' statistics per degree, per seed
    - null seed spread per degree, written before any excess is computed
    - the null's own degree dependence as a standalone table
    - planted-cascade predicted and measured magnitudes at every size
    - overlap comparison against the admitted baseline, with the baseline's provenance (run receipt, source comment, or unresolved)
    - the full enumeration of unmatched shape dimensions per degree
    - the audit trail showing each degree's null parameters derived only from that degree's shape
    - artifact manifest with hashes and a rebuild receipt
    - exact commands, git commit, dirty-tree state, environment and dependency versions
    - peak resident memory, wall clock and CPU time per cell
    - stdout and stderr

  scale_relevance:
    tier: toy
    justification: >-
      One curve, degrees 4 to 6. Nothing transfers to the degrees an actual
      decomposition attack would need.
    correspondence: null

  limitations:
    - >-
      Calibrates a baseline. Decides the cascade question only within the tested
      degree range, on the tested curve, under one solver.
    - >-
      A bounded verdict at D = 6 is scoped to D = 6 and does not close the lane
      at higher degrees.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY RATHER THAN SILENTLY
      SHRUNK - whether the cascade persists at the degrees an actual attack would
      need is beyond any budget this program can grant. The contract reports the
      largest degree it reached and leaves the rest open rather than narrowing
      the claim to fit what it could afford.
    - >-
      The matched-shape null is ASSUMED admissible, not proved admissible. A
      vanishing excess bounds the cascade against THIS null, not against every
      possible reference.
    - >-
      If D = 6 is unreachable, the lane's blocking question is unanswerable by
      this route and that is what is reported - never an extrapolated null and
      never a negative.
    - >-
      Changes no record's status.

  infrastructure_failure_disposition: >-
    A timeout, crash, out-of-memory or missing dependency is INFRASTRUCTURE
    SIGNAL, recorded as failed_infrastructure with its cause and the largest
    degree reached. It is NEVER negative mathematical evidence and never counts
    toward the falsification criterion (AGENTS.md core rule 5). This clause is
    load-bearing here - the D = 6 cells are the ones most likely to hit it.

  assigned_to: executor

  authorization_note: >-
    This contract is status draft, is not frozen, and carries approved_by null.
    Only the Coordinator may approve, freeze or authorize execution (AGENTS.md
    rule 1). Written under TASK-20260904-c0edda, which is DESIGN ONLY. It
    supersedes no contract, edits no record, and does not alter GOAL-SIG-001's
    next_action or any committed checkpoint.
