experiment:
  id: EXP-EWALK-4e2a3c
  hypothesis_id: H-EWALK-f9ebe4
  derived_from_idea: IDEA-20260821-cae674
  question_id: RQ-EWALK-8fa147
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Recovering the committed ceiling result's resolution and its counter's event definition - a zero-compute
    power and entry-rate recomputation, a planted-cycle positive control, a trivial-automorphism null, an
    escape-disabled arm, a branch-count decay control, and an instrumented entries-escapes-fatal probe on
    byte-identical seeds
  objective: >-
    The one uncertainty a run reduces is whether the committed automorphism-quotient result can say anything
    about a cycle tax in either direction. A run establishes six things, the first three at essentially zero
    compute. First, the standard error, minimum detectable effect and required sample size of the committed
    ratio-to-ceiling statistic, recomputed from the committed standard deviations with the formula and the
    significance level and power stated. Second, the frozen walk's branch count, step function and realised
    step counts read from the committed artifacts, and the analytic per-step entry rate and zero-count
    probability computed from them. Third, whether the committed raw artifacts reproduce the committed summary
    values exactly. Fourth, whether a walk instance constructed to force a fruitless cycle increments the
    counter. Fifth, the separate per-step counts of entries, escapes and fatal terminations under an
    instrumented copy on byte-identical seeds. Sixth, the counter's reading on a trivial-automorphism curve,
    on an escape-disabled walk, and across a swept branch count. No attack is proposed and no exponent moves.
  what_this_is_not:
    - >-
      Not an attack and not a rho improvement. No walk is proposed, no exponent moves, and the automorphism
      discount remains a constant factor on the square-root exponent throughout.
    - >-
      Not evidence that the walk pays a cycle tax. Demonstrating that an instrument is underpowered is evidence
      that the committed run cannot say either way, which is a different and weaker statement.
    - >-
      Not a re-run of the committed experiment and not a replacement of it. The committed record stands; this
      contract measures its resolution and its counter's event definition.
    - >-
      Not a modification of the committed walk implementation. It is READ, its branch count and step function are
      recorded, and the instrumented copy is a separate driver.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run has been executed under this
      contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope. At the committed prime with the committed seed count, the committed instrument
      excludes a cycle tax larger than the recomputed minimum detectable effect in each arm and no smaller one;
      the seed count required to resolve a one-percent effect is a stated number; the counter does or does not
      increment on a forced cycle; and the instrumented copy reports stated entry, escape and fatal counts on
      byte-identical seeds. WHAT DOES NOT FOLLOW. NOT that the walk attains the ceiling - no design at this sample
      size can support that; NOT that the walk pays a tax, which underpowering cannot show; NOT anything at
      cryptographic scale; and NOT anything about a different escape strategy, which has a different rate and a
      different tax.
  inputs:
    procedure: >-
      STEP 1, ZERO COMPUTE, and it may settle most outcomes on its own. Recompute the standard error, the minimum
      detectable effect and the required sample size from the committed standard deviations and seed count, stating
      the formula, the significance level and the power. Read the frozen walk's branch count, step function and
      realised step counts out of the committed run artifacts. Compute the analytic per-step entry rate and the
      probability of an all-zero count at that rate. Confirm the committed sample layout - how many seeds on how
      many curves per arm - before quoting any binomial arithmetic. Reproduce the committed summary values exactly
      from the committed raw artifacts as a regression fixture.
      STEP 2, minutes. PLANTED-CYCLE POSITIVE CONTROL. Construct an instance in which a fruitless two-cycle is
      forced - choose the partition index so that two consecutive steps select the same branch on the same orbit -
      and assert that the counter increments. Report the increment or the failure, and archive the constructed
      instance.
      STEP 3, minutes. NEGATIVE CONTROLS. Run the identical counter on a generic curve with trivial automorphism
      structure, and on a walk with the escape mechanism DISABLED. Report both readings.
      STEP 4, hours. COUNTER-SEMANTICS PROBE. Instrument a copy that records entries, escapes and fatal
      terminations separately per step, together with the counter's TEST PLACEMENT in the step loop, and re-run the
      same twenty seeds on the same two curves at the same prime with byte-identical seed derivation. Report all
      three series and the placement.
      STEP 5, minutes. DECAY CONTROL. Sweep the branch count over the declared set at fixed prime and fixed orbit
      size, 200 walks per point, and fit the exponent of the measured entry rate against the reciprocal branch
      count.
      STEP 6, minutes. MATCHED BASELINE. Re-measure the unquotiented collision-search step count on identical seeds
      in the same run, since the reported statistic is a ratio and a carried-forward denominator is not a comparison.
      STEP 7, OPTIONAL AND ONLY IF STEPS 1 TO 6 LEAVE THE TAX QUESTION LIVE. The large-seed run that would reach a
      one-percent minimum detectable effect, BUDGETED AND COSTED IN ADVANCE rather than started, and requiring its
      own approval before it is executed.
    instrument: >-
      Python 3.11 with numpy. A new standalone driver under experiments/EXP-EWALK-4e2a3c/driver/ containing the
      instrumented copy of the walk, the planted-cycle constructor, the trivial-automorphism and escape-disabled
      arms, the branch-count sweep, and the analysis. The committed walk implementation is READ and its commit sha
      recorded, but is NOT modified. All costs are reported in GROUP OPERATIONS rather than wall time, since
      instrumenting a walk changes its per-step wall cost and a wall-time tax would be measuring the
      instrumentation. Recorded through harness/runner.py.
    parameters: >-
      The committed prime at 17 bits and the same two special curves as the committed run. Twenty seeds per arm with
      BYTE-IDENTICAL seed derivation to the committed run, so any difference is attributable to the instrumentation
      rather than to the draw. Branch-count sweep over 4, 8, 16, 32 and 64 at fixed prime and orbit size, 200 walks
      per point. Two-sided significance at 0.05 with power 0.80, with the formula stated. A bootstrap minimum
      detectable effect computed alongside the normal-approximation one.
  controls:
    - >-
      PLANTED-CYCLE POSITIVE CONTROL, MANDATORY AND BLOCKING. An instrument that cannot detect a planted signal
      cannot support a negative. If the counter does not increment on a forced cycle, no negative may be recorded
      from this counter anywhere in the campaign.
    - >-
      NULL OBJECT. A generic curve with trivial automorphism structure, where the orbit-induced cycle mechanism this
      counter is named for does not exist in the same form; the counter must read at its floor. A non-zero reading
      there at the same rate means it is measuring something else.
    - >-
      ESCAPE-DISABLED ARM, which separates the wrong-semantics explanation from the others BY CONSTRUCTION: if the
      counter records unescaped cycles, disabling escape must make the count jump.
    - >-
      DECAY CONTROL over the branch count. A non-decaying entry rate VOIDS the counter regardless of every other arm.
    - >-
      MATCHED BASELINE. The unquotiented collision search re-measured on identical seeds in the SAME run, since the
      reported statistic is a ratio and an unmatched denominator is not a comparison.
    - >-
      BIT-IDENTICAL SEED DERIVATION between the committed run and the instrumented copy, so any difference is
      attributable to the instrumentation.
    - >-
      COUNTER PLACEMENT RECORDED, not only the counts. Where in the step loop the counter's test sits determines
      which preimage it sees, and without the placement Step 4 would reproduce the same ambiguity in a new file.
    - >-
      GROUP-OPERATION ACCOUNTING rather than wall time, since instrumenting changes per-step wall cost and the
      measured tax would otherwise be the instrumentation.
  independent_variables:
    - 'arm: committed run re-read / instrumented copy / planted-cycle control / trivial-automorphism null / escape-disabled'
    - branch count, swept over the declared set
    - curve, the two committed special curves plus one generic curve
    - seed
  metrics:
    primary:
      - >-
        Standard error, minimum detectable effect and required sample size per arm, in ratio-to-ceiling units.
        Computed from the committed standard deviation and seed count with the formula, significance level and power
        stated, and reported alongside a bootstrap minimum detectable effect.
      - >-
        Branch count, step function description, realised step counts, analytic per-step entry rate and the
        probability of an all-zero count, read and computed from the committed artifacts.
      - >-
        Planted-cycle counter increment, an integer, pass or fail with the constructed instance archived.
      - >-
        Entries, escapes and fatal terminations per walk under the instrumented copy, three separate series on
        byte-identical seeds, together with the counter's test placement in the step loop.
      - >-
        Fitted decay exponent of the measured entry rate against the reciprocal branch count, dimensionless, over the
        swept range.
      - >-
        Matched unquotiented step count on identical seeds, and its relative agreement with the committed denominator.
    secondary:
      - >-
        Counter reading on the trivial-automorphism null and on the escape-disabled arm.
      - >-
        Regression-fixture agreement between the committed raw artifacts and the committed summary values, exact.
      - >-
        Dispersion of the per-walk counts against a binomial at the fitted rate, as the over-dispersion check for the
        entry model.
      - >-
        Empirical distribution of the committed step counts against the rho-length law on the quotient's class count,
        with a Kolmogorov-Smirnov distance and the longest observed walk against the predicted upper quantile.
      - >-
        Group operations spent inside escapes versus outside, as the additive tax expression.
      - >-
        Artifact manifest with hashes, seeds and a from-scratch rebuild receipt.
  heuristic_under_test: HEUR-EWALK-H2
  heuristic_under_test_note: >-
    HEUR-EWALK-H1, the rho length law on the quotient, is validated by the SAME run through the step-count distribution
    metric and its tail check. The field names the entry model, because it is the heuristic the zero-count argument
    rests on and the one the decay control can void outright.
  preregistered_prediction:
    quantity: >-
      The recomputed minimum detectable effect per arm; the required sample size for a one-percent effect; the
      planted-cycle increment; the instrumented mean entries per walk; the analytic entry rate from the frozen branch
      count; and the fitted decay exponent.
    formula: >-
      Predicted minimum detectable effect at least 0.06 in ratio units in both arms, computed as the two-sided
      significance quantile plus the power quantile, times the standard error. Predicted required sample size at least
      500 per arm for a one-percent effect at the observed standard deviation. Predicted planted-cycle increment at
      least 1, deterministically. Predicted instrumented mean entries above 5 per walk selects the wrong-semantics
      explanation; below 0.5 with the control passing selects the wrong-reference-rate explanation. Predicted analytic
      rate above one in sixty-four makes the committed zeros impossible under entry-counting semantics; below one in
      five thousand makes them expected. Predicted decay exponent in 0.7 to 1.3. Under the null that the committed
      instrument was adequately powered, the recomputed minimum detectable effect is at most 0.01 and the power claim
      is false.
    source: >-
      Pre-registered in the parent proposal IDEA-20260821-cae674, whose claim and predictions blocks derive the standard
      errors, the minimum detectable effects, the required sample size and the zero-count probabilities in the proposing
      session from the committed record's own reported values. These are DERIVED PREDICTIONS of that record, computed
      from committed numbers; no run has been executed here. The recalled sub-one-percent literature figure is a POINTER
      and the arithmetic does not depend on it.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at the committed prime of 17 bits on the committed two curves, because the object is the committed run's
      own resolution and its counter's event definition - both properties of THAT run and THAT implementation, which can
      only be measured where that run lives. Sample-size justification is derived from the smallest effect to be
      resolved: reaching a one-percent minimum detectable effect at the observed standard deviation requires roughly
      fifty times the committed seed count, and that number is the decision-relevant output rather than any mean. The one
      transfer assumption in the design is in the decay arm - extrapolating the fitted rate exponent from the swept
      branch counts to whatever branch count the frozen walk uses - and it is stated explicitly and reported with the
      fit rather than assumed.
    correspondence: null
  tail_checks:
    - >-
      Report a BOOTSTRAP minimum detectable effect alongside the normal-approximation one, since the statistic is a ratio
      of heavy-tailed variables and the normal formula is an approximation. The direction matters and is conservative for
      the claim: a heavier tail makes the true minimum detectable effect LARGER.
    - >-
      Report the longest observed walk against the predicted upper quantile of the rho-length law, which is where the
      heavy tail bites.
    - >-
      Report the maximum per-walk entry count against the binomial's upper quantile at each swept branch count, since
      clumping the entry model does not capture would show there first.
    - >-
      Report whether the two arms share seeds; if they do, their errors are correlated and the two minimum detectable
      effects are NOT independent evidence, which must be stated rather than left implicit.
    - >-
      Report the counter's test placement in the step loop verbatim, since the placement determines which preimage it sees
      and counts alone reproduce the ambiguity.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
    replication_note: >-
      The instrumented copy additionally re-runs the COMMITTED twenty seeds with byte-identical derivation; those are not
      new draws but a matched re-measurement, and they are reported separately from the three fresh instances.
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1.0
    maximum_memory_gb: 4
    maximum_runs: 20
  stopping_rules:
    - >-
      Stop after Step 1 and report if the zero-compute arithmetic settles the question - if the analytic rate from the
      frozen branch count is decisive and the step counts show the walks were segments, no runs are needed at all, and
      that is the cheapest possible outcome.
    - >-
      Halt if the committed raw artifacts do not reproduce the committed summary values exactly; that divergence is a
      correction-record matter and blocks interpretation of everything downstream.
    - >-
      Halt the interpretation of every counter arm if the planted-cycle control fails; no negative may be recorded from
      this counter.
    - >-
      DO NOT start the large-seed run of Step 7 under this contract. It is budgeted and costed in advance and requires its
      own approval; starting it here would spend compute this contract did not authorize.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop, never a negative result,
      under AGENTS.md rule 5.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure and is NEVER negative
      mathematical evidence.
    - >-
      A run whose instrumented copy did not use byte-identical seed derivation to the committed run is invalid_measurement
      for the comparison arm, since any difference would then be attributable to the draw.
    - >-
      A run whose planted-cycle control, trivial-automorphism null or escape-disabled arm was not executed in the same
      invocation as the signal arm is invalid_measurement.
    - >-
      A run reporting a tax in WALL TIME rather than group operations is invalid_measurement, because instrumenting the
      walk changes its per-step wall cost.
    - >-
      A run that does not record the counter's test placement is invalid_measurement, because the counts alone cannot
      separate the two preimages.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT experiment and requires a new contract; it is never a
      repair of this one.
  success_criterion: >-
    The run is successful when the standard error, minimum detectable effect (normal and bootstrap) and required sample
    size are reported per arm with the formula and the significance level and power; the branch count, step function,
    realised step counts, analytic entry rate and zero-count probability are reported from the committed artifacts; the
    regression fixture is reported; the planted-cycle increment is reported pass or fail with the instance archived; the
    entries, escapes and fatal series and the counter's test placement are reported on byte-identical seeds; the
    trivial-automorphism null, the escape-disabled arm and the fitted decay exponent are reported; and the matched
    unquotiented denominator is re-measured and compared. Success means a DECIDABLE run. H-EWALK-f9ebe4's claim A is
    confirmed only if, in addition, the recomputed minimum detectable effect exceeds 0.06 in both arms and the required
    sample size exceeds 500 per arm; claim B is RESOLVED - to one of its four explanations - only if the planted control
    passes, the decay exponent is in range, and the matched denominator agrees within 2 percent.
  falsification_criterion:
    - >-
      The recomputed minimum detectable effect is at most 0.01. Claim A is FALSE; the committed run does bound the cycle
      tax at the scale that matters and the lane's calibration is adequate. A clean, cheap, fully available negative.
    - >-
      The planted cycle increments the counter, the instrumented copy still reports near-zero entries, and the analytic
      rate from the frozen branch count is below roughly one in five thousand. Claim B's anomaly EVAPORATES; the zeros are
      correct and the deliverable is the corrected reference rate.
    - >-
      The planted cycle does NOT increment the counter. A further instrument defect; every fruitless-cycle number in the
      campaign becomes attempted-and-inconclusive and no negative may be read from any of them.
    - >-
      The entry rate does not decay as the branch count increases. The counter measures an artifact and NO reading of it
      supports anything, regardless of every other arm.
    - >-
      The re-measured unquotiented denominator disagrees with the committed one by more than 2 percent. The ratio was not
      matched; the ceiling comparison must be redone before any other arm is interpreted.
    - >-
      The committed raw artifacts do not reproduce the committed summary values exactly. A correction-record matter;
      nothing downstream is interpretable and the divergence is the reported result.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model and inference block, environment,
      and the commit sha of the committed walk implementation as read.
    - >-
      The Step 1 arithmetic with the formula, significance level and power written out, and the committed sample layout as
      read from the artifacts.
    - >-
      raw-result.json carrying every per-walk entry, escape and fatal count and every per-walk step count, not summaries.
    - >-
      The constructed planted-cycle instance, archived so the control is independently re-checkable.
    - >-
      The counter's test placement in the step loop, recorded verbatim.
    - >-
      The trivial-automorphism null and escape-disabled arm measurements, in the same file as the signal arm.
    - >-
      The branch-count sweep with the fitted decay exponent and its interval.
    - >-
      The matched unquotiented step counts on identical seeds.
    - >-
      A costed, unstarted budget for the large-seed run of Step 7, so that a later approval decision has a number rather
      than an estimate.
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution, and under this engagement approval is the USER's gate because it
      authorizes execution and spends compute. This contract is review_required and is NOT approved; approved_by is null
      and execution_authorized is false.
    - >-
      The executor must confirm the campaign's pre-registered per-step entry rate from the FROZEN contract that declared
      it, not from a secondary summary, before using it as the reference in any arm. The parent proposal explicitly flags
      that it read this only as a one-line digest claim.
    - >-
      Step 7's large-seed run is NOT authorized by this contract. It is costed here and requires its own approval.
    - >-
      If the planted-cycle control fails, the resulting instrument-defect finding bears on other committed records in this
      campaign and must be routed to a correction record rather than absorbed into this experiment's evidence.
  derivation_provenance:
    tool: coordinator subagent, design-experiment step
    source_record: IDEA-20260821-cae674
    authored_at: '2026-08-25'
    note: >-
      The power arithmetic, the zero-count argument, the four explanations, the planted-cycle control, the
      trivial-automorphism null, the escape-disabled arm, the decay control, the matched-baseline requirement and the
      byte-identical seed derivation all come from the parent proposal's claim, minimal_test, controls and predictions
      blocks. Every numeric prediction is attributed to that record as a DERIVED PREDICTION computed from the committed
      evidence record's own reported values, never as a measurement of this contract. Coordinator additions are the
      group-operations accounting rule as an invalidation rather than a note, the requirement to record the counter's test
      placement, and the explicit exclusion of the large-seed run from this authorization. Budgets come from the parent's
      declared low implementation and low compute.
  derivation_gaps:
    - >-
      The committed sample layout - how many seeds on how many curves per arm - must be read off the committed run before
      the binomial arithmetic is quoted anywhere. The parent proposal states this as an assumption and it is a Step 1
      prerequisite here, not a finding.
    - >-
      Whether the committed walks are full collision-search walks or distinguished-point segments is UNRESOLVED and
      determines whether the step count used in the zero-count arithmetic is right at all. The committed step counts settle
      it at zero compute and Step 1 must do so before Step 4 is funded.
    - >-
      The campaign's pre-registered entry rate is known to the parent proposal only as a one-line digest claim; the frozen
      contract that declared it has not been opened. Using it as the reference without that confirmation would repeat the
      failure this contract exists to expose.
    - >-
      The recalled literature figure for the wasted-iteration fraction is a POINTER and no agent in this program has opened
      the source. If the real tax is larger, the required sample size shrinks and the obstruction is milder; the arithmetic
      is independent of it, but the framing of what scale matters is not.
    - >-
      Whether the two arms share seeds is unknown at authoring time. If they do, the two minimum detectable effects are not
      independent evidence, and the contract requires that be reported rather than left implicit.
