# EXP-ECDLP-bbecba
# Doubling-count arithmetic. No curve point is doubled.
# Approved by DEC-20261003-a1b8a3.
experiment:
  id: EXP-ECDLP-bbecba
  hypothesis_id: H-ECDLP-b9d0ff
  source_idea: IDEA-20261003-8b842f
  question_id: RQ-ECDLP-002
  version: 1
  title: Bit length and doublings of 8
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-a1b8a3
  objective: >-
    Check the length 4, the doubling count 3, and the nearby gap 0.
  inputs:
    value: 8
    bit_length: 4
    doublings: 3
    additions: 0
    length_gap: 1
    length_product: 12
    count_sum: 7
    nearby_a: 3
    nearby_b: 3
    nearby_gap: 0
    nearby_product: 9
  controls:
    - >-
      The integer 8 has bit length 4. Reporting that length as 3
      drops the excess 1 and invalidates the run.
    - >-
      The doubling count from 1 to 8 is 3. The addition count is 0.
      Four exceeds three by 1. The product of 4 and 3 is 12. The
      sum of 4, 3, and 0 is 7.
    - >-
      Two readings of 8 each have 3 doublings. Their gap is 0 and
      their product is 9.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {length, doublings, nearby}
    - route in {count, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - nearby_gap
      - implementations_agree
    secondary:
      - additions
      - length_product
      - count_sum
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The bit length is 4. The doubling count is 3. The doubling
      gap of two readings of 8 is 0.
    formula: >-
      Count the bits of 8. Count the doublings from 1 to 8.
      Subtract 3 from 4. Multiply 4 by 3. Add 4, 3, and 0.
      Subtract 3 from 3.
    source: >-
      IDEA-20261003-8b842f states the integer 8, the length 4, and
      the doublings 3, read 2026-10-03. The product and the sum
      were recomputed in this design session. That computation is
      not a run. No curve point was doubled.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a curve doubling.
    correspondence: null
  tail_checks:
    - The product 12 and the nearby gap 0 are required. A check that stops at the length 4 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the length 4 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 4.
    - The doubling count is not 3.
    - The addition count is not 0.
    - The product of 4 and 3 is not 12.
    - The bit length is reported as 3, or a curve point is doubled.
  success_criterion: >-
    Both runs agree that the bit length is 4, that the doubling
    count is 3, that the addition count is 0, and that 4 exceeds
    3 by 1.
  falsification_criterion: >-
    The runs agree that the bit length is computed, and that
    length is not 4.
  required_artifacts:
    - experiments/EXP-ECDLP-bbecba/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-bbecba/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-bbecba/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-bbecba/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-bbecba/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-bbecba/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any doubling of a curve point or scalar recovery.
    - Any claim that a length gap of 1 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
