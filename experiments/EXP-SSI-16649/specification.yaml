experiment:
  id: EXP-SSI-16649
  version: 8
  schema: SSI-CANONICAL-v8
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: null
  hypothesis_note: >-
    Deliberate null: this is a design contract for a pre-registered advice
    frontier, not an executed test of a hypothesis or an attack construction.
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  batch_id: BATCH-726c16
  source_proposal: ledger/proposals/IDEA-20260806-9c2f80.yaml
  supersedes: EXP-SSI-e29417
  supersession_note: >-
    Additive successor. The v7 record and all earlier records remain immutable
    lineage and are not active schema input. This record defines one fresh
    canonical contract and makes no observation, security, exponent, novelty,
    or completion claim.
  title: >-
    Canonical byte and cost contract for the fixed-advice classical OneEnd
    frontier
  objective: >-
    Define one finite, byte-recomputable contract for the named fixed-advice
    constructions in IDEA-20260806-9c2f80. Every input, helper, query index,
    event, certificate, matrix, output, control, memory term, and FOE operand
    must be generated by the fields below. If later approved, frozen, and
    executed, the result may report conditional accounting rows only; it may
    not claim an all-advice lower bound, implement an unapproved isogeny
    attack, transfer to deployed security, or move a hardness exponent.
  claim_ceiling: >-
    Design-only until a Coordinator freeze decision follows successful review.
    A later run could evaluate only the pre-registered finite construction and
    its controls under this contract. It cannot establish H-ADV-1 through
    H-ADV-4, a cryptanalytic breakthrough, a lower bound over all advice, or a
    security claim for SQIsign, CSIDH, EndRing, Isogeny, or SIDH/SIKE.

  inputs:
    proposal: ledger/proposals/IDEA-20260806-9c2f80.yaml
    direct_predecessor: experiments/EXP-SSI-e29417/specification.yaml
    predecessor_validator: coordination/goals/GOAL-SSI-001/batches/BATCH-5a886c/reviews/TASK-20260809-f3ef91/validation_report.yaml
    predecessor_red_team: coordination/goals/GOAL-SSI-001/batches/BATCH-5a886c/reviews/TASK-20260809-9e3c34/red_team_report.md
    predecessor_evidence: ledger/evidence/EV-SSI-08a98f.yaml
    predecessor_decision: ledger/decisions/DEC-20260809-e4f385.yaml
    source_paper: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
    incumbent_foe_gate: experiments/EXP-SSI-16649/inputs/INCUMBENT-FOE-v1.yaml
  lineage_rule: >-
    Files named in inputs are read for provenance and duplication review only.
    Their clauses, field names, defaults, and formulas are not active in this
    experiment. Only SSI-CANONICAL-v8 below is operational. If a historical
    clause conflicts with this namespace, this namespace wins; a missing v8
    field is invalid rather than inherited from a predecessor.

  scope:
    problem: >-
      The instance is a canonically encoded supersingular j-invariant E over
      F_{p^2}. The positive target is classical OneEnd/EndRing path finding
      with no published secret torsion images, SQIsign transcript, or CSIDH
      secret. SIDH/SIKE torsion-image recovery is excluded as a positive target.
    advice_quantifier: >-
      For each declared prime p, A_p is fixed before E is selected and may
      depend on p but not E. The scoped statement is forall p exists fixed A_p
      forall E in V_p. No per-query regeneration of advice is permitted.
    target_set: >-
      V_p is the finite set emitted by SSJ-ENUM-v1 below. Every cardinality is
      the post-deduplication cardinality of the committed manifest, not an
      asymptotic replacement by p.
    query_cost: >-
      For E and attempt randomness omega, W(E,omega) is the complete integer
      FOE event sum emitted by the canonical trace. q(E) is the probability of
      an admissible explicit non-scalar output before the attempt cap. q=0
      yields infinity; otherwise T_q(E)=E[W]/q and T_q=max_E T_q(E). A finite
      run reports the cap and censoring separately and never substitutes an
      observed average for this worst-case definition.
    prohibited_claims:
      - all-advice lower bound
      - deployed-parameter security estimate
      - positive SIDH/SIKE torsion-image result
      - uncharged oracle, preprocessing, memory, or quantum query

  canonical_schema:
    schema_id: SSI-CANONICAL-v8
    precedence:
      active_namespace: SSI-CANONICAL-v8
      historical_inputs_are_lineage_only: true
      conflict_rule: >-
        A field or formula is valid only if it is defined exactly once in this
        namespace. No v1, v6, v1.1, or v2 field is implicitly inherited. Any
        historical compatibility projection must be generated from this
        schema, hash-bound, and cannot add fields or alter bytes.
      freeze_gate: >-
        frozen may become true only after the snapshot, Validator, and Red Team
        independently confirm that every required field has one encoding,
        generator, bound, and cost. The missing incumbent measurement is a hard
        gate; it cannot be waived by a design review.
    encoding:
      byte_order: little_endian_for_unsigned_integers
      signed_integers: >-
        Encode sign separately as one byte 0x00 positive or zero, 0x01
        negative, followed by a minimally encoded unsigned magnitude. Negative
        zero is invalid.
      u8: one unsigned byte
      u16: two unsigned bytes, little endian, range 0..65535
      u32: four unsigned bytes, little endian, range 0..4294967295
      u64: eight unsigned bytes, little endian, range 0..2^64-1
      biguint: >-
        A 70-byte little-endian magnitude with no leading zero bytes except
        canonical zero as 70 zero bytes. Values >=2^560 are overflow. Every
        integer in the field inventory below uses biguint, including degrees,
        counts, matrix entries, HNF entries, witnesses, FOE, rational
        numerators/denominators, target indices, and memory bytes.
      digest: SHA256 returns exactly 32 bytes; digest comparison is constant-time
      bytestring: length is a u32 followed by exactly that many bytes
      tag: one u8; a tag not listed in a table is invalid
      frame: >-
        Every object is tag || version(u8) || payload_len(u32) || payload. The
        payload length is checked before allocation and is at most 2^32-1.
        Digest preimages name the complete concatenation in field order.
    global_limits:
      max_payload_bytes: 4294967295
      max_biguint_bits: 560
      max_attempts: 32768
      max_steps_per_attempt: 1048576
      max_event_records: 8388608
      max_certificate_bytes: 67108864
      max_matrix_rows: 1048576
      max_matrix_columns: 1048576
      max_path_bytes: 67108864
      max_query_records: 4294967295
      overflow_result: invalid_overflow
    field_inventory:
      all_fields: >-
        The complete field inventory is: p, p_code, curve identifiers, vertex
        counts, owner counts, target counts, selection counts, every degree and
        degree factor, all matrix dimensions and entries, HNF entries, witness
        coordinates, branch and target indices, slot capacities and indices,
        probe counts, byte lengths, path horizons, event counters, FOE values,
        memory bytes, q numerators and denominators, rational-reference
        numerators and denominators, Q, and all terminal counters. Each uses
        the canonical biguint unless its table explicitly says fixed u8/u16/u32
        tag/version. Omission of any declared operand is invalid.

  parameters:
    prime_instances:
      - label: SQISign-I
        p_expression: 5*2^248-1
        p_code: 1
        exact_bit_length: 251
        security_label_bits: 256
        field_bytes: 32
      - label: SQISign-V
        p_expression: 27*2^500-1
        p_code: 2
        exact_bit_length: 505
        security_label_bits: 512
        field_bytes: 64
    fp2: >-
      u^2+1=0; field elements are j0+j1*u with coefficient order j0,j1,
      canonical unsigned coefficients in [0,p-1], and fixed field_bytes per
      prime. curve_id is version(u8=1)||j0(field_bytes)||j1(field_bytes).
    vertex_manifest:
      format: SSJ-MANIFEST-v1
      generation: >-
        Enumerate every pair (j0,j1) in [0,p-1]^2, evaluate the exact Deuring
        supersingular polynomial S_p over F_{p^2}, retain exact roots, reject
        duplicate curve_id values, sort by curve_id, then serialize.
      header: >-
        tag 0x10 || version 0x01 || p_code(u8) || expression(bytestring) ||
        S_p_sha256(digest) || vertex_count(biguint)
      body: vertex_count consecutive curve_id values, no padding
      digest_preimage: header || body
      setup_foe: enumeration + polynomial evaluation + deduplication + sorting + serialization + digest verification
      missing_or_wrong_manifest: invalid_input

  physical_contracts:
    c_helper:
      format: C-HELPER-v3
      purpose: >-
        A single interleaved fixed-capacity table maps an endpoint pair key to
        one middle-factor record. There is no alternate endpoint table or
        payload array. The table is generated from the complete owner set and
        its bytes are the only helper input consumed by a query.
      constants:
        slot_width_bytes: 96
        key_width_bytes: 32
        payload_width_bytes: 64
        capacity_rule: next_power_of_two(2*A_C), where A_C is occupied count
        max_capacity: 2^32-1
      slot_record: >-
        occupied(u8=1)||key(32)||owner_index(biguint)||endpoint_index(biguint)||
        middle_degree(biguint)||middle_factor_count(biguint)||middle_factor_digest(32)||
        payload_reserved(32 zero bytes). Empty is occupied=0 followed by 95
        zero bytes. All indices and degrees use biguint and must be in range.
      generation: >-
        Enumerate owner-set pairs in owner-index order, derive key=SHA256(tag
        0x31||version 0x03||p_code||owner_curve_id||endpoint_curve_id), derive
        the middle-factor record by HNF-RIGHT-ROW-v2, reject duplicate keys,
        sort insertion input by key, and insert each record by linear probing
        from low 32 bits of key modulo capacity. The generator identity,
        source digest, and seed are committed in ORDER-MANIFEST-v3.
      lookup: >-
        Query computes the same key, starts at key mod capacity, reads each
        complete 96-byte slot, charges one probe per slot, compares all 32 key
        bytes, accepts the first equal occupied slot, and stops at the first
        empty slot. Probe count must be <= capacity; otherwise invalid_table.
      digest_preimage: >-
        tag 0x32 || version 0x03 || p_code || capacity(biguint) || A_C(biguint)
        || slot_width(biguint) || body_bytes, where body_bytes is every slot
        from index zero through capacity-1, including empty slots.
      outputs: helper_digest, capacity, occupied_count, total_probe_count, peak_bytes
      memory_bytes: header_bytes + capacity*slot_width_bytes
      charged_events: [helper_key_hash, helper_slot_read, helper_key_compare, helper_payload_decode, helper_digest]
    order_manifest:
      format: ORDER-MANIFEST-v3
      owner_set: >-
        Exactly the sorted vertex manifest indices selected by the fixed advice
        constructor. The list is a canonical biguint index array with no hidden
        owner oracle; owner_count and every index are serialized.
      generator_binding: >-
        generator_id is an ASCII bytestring naming the versioned executable or
        proof-producing generator; generator_source_sha256, generator_seed,
        owner_set_digest, and hnf_order_source_sha256 are required. A missing
        generator digest is invalid_input.
      bytes: >-
        tag 0x20 || version 0x03 || p_code || owner_count(biguint) || each
        owner_index(biguint) || generator_id(bytestring) ||
        generator_source_sha256 || generator_seed(bytestring) ||
        hnf_order_source_sha256 || owner_set_digest
      digest_preimage: bytes above without the final manifest_digest
      setup_foe: owner enumeration + HNF order generation + duplicate rejection + sorting + serialization + digest
      output: manifest_digest and exact owner_index array
    query_index:
      format: TARGET-SELECTION-INDEX-v3
      domain: >-
        The finite Cartesian domain is every target vertex index in V_p crossed
        with every declared selection code in selection_codes. target_count and
        selection_count are serialized; no target/selection query oracle is
        implicit.
      selection_codes: [0, 1, 2, 3]
      record: >-
        target_index(biguint)||selection_code(u8)||query_key(32)||slot_pointer(biguint)||
        payload_digest(32)||record_tag(u8=0x41). Records are sorted by
        (target_index, selection_code), and all four records exist for every
        target. slot_pointer is in [0, capacity-1].
      generation: >-
        For each domain pair, derive query_key=SHA256(tag 0x40||version 0x03||
        p_code||target_index(biguint)||selection_code||target_curve_id||
        owner_set_digest), compute slot_pointer by the C-helper lookup, and
        serialize the complete record. The target curve bytes and owner-set
        digest are inputs, not free query knowledge.
      digest_preimage: >-
        tag 0x42 || version 0x03 || p_code || target_count(biguint) ||
        selection_count(biguint) || record_width(biguint) || all_records
      build_foe: every target/selection hash + helper lookup + pointer check + record serialization + digest
      memory_bytes: header_bytes + target_count*selection_count*record_width
      lookup: binary search on the canonical record order, charging comparisons and digest verification
    large_integer_and_byte_audit:
      required_check: >-
        The validator must enumerate every scalar field in this specification,
        prove its encoding is fixed or biguint, and report the maximum implied
        byte count. A field not found in this inventory fails the contract.

    finite_builder:
      request: >-
        A builder request is tag 0x50||version 0x03||p_code||request_id(biguint)||
        target_count(biguint)||selection_count(biguint)||seed(bytestring)||
        requested_owner_count(biguint). It is immutable after hashing.
      record_stream: >-
        The builder emits exactly one fixed-width record per requested owner
        position. A retained record is a complete framed owner, degree-factor,
        matrix, and helper payload. A non-retained position is a null record
        with the same fixed width and reason code; no variable omitted row is
        allowed.
      terminal_codes:
        - COMPLETE
        - ZERO_REQUEST
        - CAP_EXHAUSTED
        - ZERO_RETENTION
        - INVALID_RECORD
        - OVERFLOW
        - INFRASTRUCTURE_UNAVAILABLE
      terminal_encoding: >-
        The terminal frame is tag 0x51||version 0x03||code(u8)||emitted_count(biguint)
        ||retained_count(biguint)||attempt_count(biguint)||stream_digest(32)||
        reason(bytestring). It is emitted exactly once after the last record.
      padding: >-
        Null records use tag 0x52, all numeric fields zero, empty payload digest
        SHA256(empty), and the declared reason code. Terminal literals and
        padding bytes are fixed by this paragraph; unknown reason bytes are
        invalid. A cap or infrastructure terminal is not evidence against the
        mathematical mechanism.
      partial_rows: forbidden
      setup_vs_access: >-
        Builder generation and serialization belong to T_setup. Reading one
        retained or null record during a query belongs to T_access and is
        charged again; setup bytes are not silently free query memory.

    degree_matrix_hnf_output:
      factor_encoding: >-
        Each isogeny degree and each prime factor is a canonical biguint in a
        length-prefixed factor list; product and product overflow are checked.
      matrix_encoding: >-
        MATRIX-v3 is tag 0x60||version 0x03||rows(biguint)||columns(biguint)||
        row-major signed-bigint entries, with dimensions within global limits.
        The matrix digest covers the header and every entry.
      hnf: >-
        HNF-RIGHT-ROW-v2 consumes MATRIX-v3, applies the specified deterministic
        right-row operations in lexicographic pivot order, records every row
        operation and degree factor, checks divisibility and saturation after
        each factor, and emits the final HNF matrix plus operation-log digest.
        No abstract HNF call is a free operation.
      saturation: >-
        For each factor in serialized order, multiply the declared scalar and
        saturate the exact lattice; each factor operation and intermediate
        matrix is charged and bounded. Failure emits invalid_saturation.
      output: >-
        OUTPUT-v3 is tag 0x61||version 0x03||branch_code(u8)||scalar_class(u8)||
        witness_count(biguint)||witnesses(signed-bigint records)||matrix_digest(32)||
        hnf_log_digest(32)||output_digest(32). Scalar/non-scalar classification
        is deterministic over the normalized output bytes. A query succeeds
        only on a non-scalar output with a complete witness.
      output_path: >-
        The only positive output path is query index lookup -> helper payload ->
        HNF-RIGHT-ROW-v2 -> factor saturation -> scalar classification ->
        OUTPUT-v3 serialization. Every branch has an explicit null output and
        an event code; no branch may bypass HNF or output serialization.

    edge_certificate:
      format: EDGE-CERT-v3
      fields: >-
        tag 0x70||version 0x03||p_code||horizon(biguint)||edge_count(biguint)||
        path_bytes(biguint)||transition_root(32)||provider_id(bytestring)||
        provider_receipt(bytestring)||mirror_path(bytestring)||mirror_sha256(32)||
        edge_stream(bytestring)||certificate_digest(32)
      generation: >-
        The edge stream contains exactly edge_count framed transitions. Each
        transition carries source index, destination index, degree, factor list,
        and transition digest. transition_root is SHA256 of the ordered
        transition digest list. horizon and path_bytes are checked before
        allocation and against the global maxima.
      availability: >-
        Provider receipt and local mirror are both required. The mirror bytes
        must hash to mirror_sha256 and reproduce edge_stream. Provider absence,
        timeout, or unavailable mirror yields INFRASTRUCTURE_UNAVAILABLE and is
        not proof rejection or negative research evidence.
      digest_preimage: all fields through edge_stream, excluding certificate_digest
      charged_events: [certificate_parse, transition_hash, root_hash, provider_receipt_check, mirror_read, certificate_digest]
      memory_bytes: certificate_header_bytes + path_bytes + max_transition_bytes

  accounting:
    foe_unit: >-
      FOE is an integer field-operation equivalent. The primitive table below
      is the sole event-to-cost mapping; an event not in the table is invalid.
    primitive_costs:
      - code: 1
        name: field_add
        foe: 1
      - code: 2
        name: field_mul
        foe: 1
      - code: 3
        name: field_inv
        foe: 1
      - code: 4
        name: hash_32_bytes
        foe: 1
      - code: 5
        name: byte_read
        foe: 1
      - code: 6
        name: byte_compare
        foe: 1
      - code: 7
        name: biguint_op
        foe: 1
      - code: 8
        name: matrix_row_op
        foe: 1
      - code: 9
        name: certificate_transition
        foe: 1
      - code: 10
        name: output_serialize
        foe: 1
    event_record: >-
      Every completed event is tag 0x80||version 0x03||event_code(u8)||phase(u8)
      ||operand_count(biguint)||operands(biguint list)||event_foe(biguint). The
      declared event_foe must equal primitive_cost(event_code)*the declared
      operation count. The trace digest is SHA256 of the concatenated event
      records in execution order.
    setup_events: [manifest_build, order_manifest_build, c_helper_build, query_index_build, incumbent_read]
    query_events: [query_index_read, helper_lookup, certificate_read, hnf_row_op, saturation_factor, output_serialize]
    attempt_sum: >-
      T_attempt is the sum of every event_foe in one completed attempt,
      including setup-access reads, probes, certificate transitions, all HNF
      operations, saturation, witness serialization, and null-output events.
      Missing events, duplicate charging, or a trace digest mismatch is invalid.
    setup_sum: T_setup=sum(event_foe) for setup_events exactly once per fixed A_p
    query_sum: T_q_run=sum(event_foe) for one attempt before inverse success probability
    memory: >-
      M_advice is the sum of retained manifest, order, helper, query-index,
      certificate mirror, and incumbent bytes. M_work is the peak of all live
      temporary buffers, matrix/HNF state, event trace, and output buffers.
      Both are exact biguint byte sums with a live-range table; a digest or
      source file is not free merely because it is on disk.
    incumbent: >-
      T_inc_foe is read only from the bound INCUMBENT-FOE-v1 artifact. The
      asymptotic p^(1/3+o(1)) label is not a FOE value. Until that artifact has
      a matched parameter, exact integer value, memory bytes, source command,
      source digest, and independent verification receipt, all break-even and
      improvement fields are invalid_accounting and no freeze is permitted.
    break_even: >-
      For positive integers T_inc_foe>T_q_run, Q_break_even is the least
      positive Q satisfying T_setup + Q*T_q_run <= Q*T_inc_foe, found by exact
      cross multiplication. If the incumbent is absent, equal, or smaller,
      Q_break_even is undefined; floating point and omitted setup are invalid.

  incumbent_gate:
    artifact_path: experiments/EXP-SSI-16649/inputs/INCUMBENT-FOE-v1.yaml
    artifact_sha256: ce81c7cd326320176aacbe1266a42f2af5741ee065de07b022c185e73476f628
    required_status: supplied_and_independently_verified
    current_status: pending_external_measurement
    hard_failure: >-
      The bound artifact is a concrete gate record but currently contains no
      numeric baseline. This is intentional: it prevents fabrication. Its
      pending status keeps this experiment design-only and evidence-ineligible;
      a later Coordinator successor or amendment must replace the gate with a
      separately archived measured source before freeze.

  controls:
    paired_replay: >-
      Treatment and matched null consume the identical complete event stream,
      including helper probes, certificate reads, HNF operations, output
      serialization, and terminal event. Only the final identity bit is masked
      after all shared bytes are hashed. Different early exits are invalid.
    branch_null: >-
      Every branch code has an owner-specific null path with the same request,
      manifest, index, helper, certificate, matrix, and trace framing. Null
      output uses OUTPUT-v3 with scalar_class=2 and reason code; no null oracle.
    c_pair: >-
      The C-pair control uses the same finite owner marginal, descriptor,
      C-HELPER-v3 generator, and query-index builder as treatment. Its reference
      is a declared finite null-replicate table with seed, replicate count,
      censoring rule, and digest; iid substitution is forbidden.
    synthetic_reference: >-
      Each synthetic cell serializes seed, target set, advice size, q numerator
      and denominator, T_setup, T_q_run, T_inc_foe reference, censoring limit,
      and exact rational reference numerator/denominator. The cell reports the
      maximum over targets only after each target has a complete row; partial
      rows are censored and cannot be silently dropped.
    query_generation: >-
      Seeds are SHA256(tag 0x90||version 0x03||p_code||experiment_id||replicate
      ||instance||attempt) and every counter uses biguint. Fisher-Yates and
      next-distinct selection have finite rejection bounds; exhaustion emits a
      terminal code rather than looping indefinitely.

  stopping_and_artifacts:
    no_execution_until: >-
      A Coordinator decision records successful independent Validator and Red
      Team review, all fields have one canonical encoding, and a verified
      INCUMBENT-FOE-v1 measurement is present. This record itself cannot grant
      execution.
    stopping_rules:
      - stop after max_attempts per target
      - stop after max_steps_per_attempt
      - stop on any overflow, malformed frame, digest mismatch, or terminal code
      - stop on provider or mirror unavailability without interpreting it as evidence
    required_artifacts:
      - exact command and immutable git commit
      - environment and dependency versions
      - canonical input and output bytes plus SHA256 digests
      - seeds, parameter rows, event trace, and resource measurements
      - validity status and reason
      - requested model policy, resolved model, and probe status
      - independent Validator and Red Team reports
    proof_search_map:
      exact_baseline_reproduction: >-
        Reproduce the declared incumbent source at both parameter rows before
        any candidate comparison; missing source is a hard failure.
      observation_collision_search: >-
        Search for distinct byte streams with the same reported semantic row or
        different rows from the same stream; any collision invalidates the row.
      quantifier_order: >-
        Audit that fixed A_p is committed before target selection and that no
        per-target advice regeneration appears in code or receipts.
      method_ceiling_nearby_control: >-
        Run only after approval, using the matched finite C-pair and synthetic
        controls; report design limits separately from any observation.

  completion_gate:
    - YAML parses and every direct input path exists
    - only SSI-CANONICAL-v8 fields are active
    - every declared integer is covered by the fixed-width or biguint audit
    - C-helper, order manifest, query index, builder, FOE, certificate, HNF/output, and controls are byte-recomputable
    - incumbent artifact is hash-bound and its pending status keeps freeze false
    - predecessor bytes remain unchanged
    - execution_authorized remains false
