experiment:
  id: EXP-AEADC-c669b3
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-f0cdb2; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-f0cdb2
  question_id: RQ-AEADC-8db132
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Measure recovered-plaintext yield from the keystream difference system of a counter-mode
    AEAD as a function of nonce-repeat multiplicity, overlap profile and source redundancy, against
    distinct-nonce and random-array nulls
  objective: 'The single uncertainty a run reduces is whether the confidentiality cost of a repeated
    nonce in a counter-mode composition is a graded, measurable function of declared parameters or
    an effectively binary event at the resolution this instrument can see. Concretely: (i) does the
    recovered-plaintext bit fraction, produced by a decoder frozen before any run, increase with repeat
    multiplicity r at a rate distinguishable from zero once the two null arms are subtracted, and
    does that increase depend on the plaintext source redundancy in the direction the stage-1 algebra
    predicts; (ii) does the increase saturate at a multiplicity inside the tested range, so that a
    deployment-facing number -- the point past which further repeats buy almost nothing -- exists
    at all at these parameters; (iii) is the whole surface a property of the composition rather than
    of the primitive, tested by refilling the primitive slot with a seeded ideal permutation and requiring
    the matched cells to agree within a declared tolerance. A run also reduces a second-order uncertainty
    about this program''s own instrument: whether a source-model decoder can be built that reads the
    difference system and not its own prior, which is precisely what a flat null arm would establish
    and a rising null arm would refute.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for the implemented counter-mode
      composition at 16-bit block width, under the three declared plaintext source models and the
      declared overlap profiles, the frozen decoder recovered the measured bit fractions at each multiplicity,
      with the stated confidence intervals, while both nulls remained at the stated baseline. What
      does NOT follow: nothing about AES-GCM, ChaCha20-Poly1305, or any named or deployed AEAD; nothing
      about any protocol, product or service; no attack, break, speedup or security consequence of
      any kind; no statement that the measured fractions are the best achievable, since a stronger
      decoder could read more from the identical difference system; and no transfer to full block
      widths or to real traffic without a separate argument that this contract does not supply.'
  inputs:
    procedure: 'STAGE 0, zero compute: write and record the symbolic rank argument and freeze the
      decoder specification with its file hash. STAGE 1, minutes: implement the counter-mode keystream
      over a 16-bit block with a seeded lazily-sampled bijection in the primitive slot; validate encrypt-decrypt
      round trips and record the counter-block collision count per configuration. STAGE 2, minutes:
      implement the three declared plaintext source models and their samplers, and verify their measured
      per-byte entropies against their declared values. STAGE 3, tens of minutes: run the crossed
      sweep over r in {2,4,8,16,32} and three overlap profiles at 200 tuples per cell, computing for
      each cell the exact difference-system rank, the decoder recovered-bit fraction, and a bootstrap
      confidence interval. STAGE 4, same invocation, comparable cost: run both null arms through the
      identical decoder from the same tuples with a disjoint seed schedule. STAGE 5, minutes: rerun
      one overlap profile with a real block cipher in the primitive slot. STAGE 6, zero compute: emit
      the surface, the saturation index, both null baselines, the rank check and the primitive-swap
      comparison into an immutable run record via harness/runner.py.'
    instrument: 'Python 3, standard library only for the mode and the decoder: a pure-Python counter-mode
      keystream over a configurable block width, a seeded lazily-sampled random bijection as the ideal-primitive
      slot, and a frozen decoder module. Real-primitive arm uses a pinned pure-Python block cipher
      implementation validated against its published test vectors before use. Run orchestration, seeding
      and manifest emission through harness/runner.py in the pattern of the existing harness/run_blocknull.py
      and harness/ctrl_valueshuffle.py control runners. No Sage, no external service, no network.'
    parameters: 'Block width 16 bits, counter space 2^16, message lengths 32, 128 and 512 blocks.
      Repeat multiplicity r in {2,4,8,16,32}. Three overlap profiles: full overlap, half overlap,
      and a staggered profile where the i-th message overlaps the reference on L/2^i blocks. Three
      plaintext source models at declared per-byte entropies of approximately 2.0, 4.5 and 8.0 bits.
      200 independent tuples per cell, 2000 bootstrap resamples. One real-primitive arm at 128-block
      length and full overlap. Total 45 signal cells, 90 null cells, 5 primitive-swap cells.'
  controls:
  - NULL ONE, distinct-nonce arm, run in the same invocation over the identical plaintext tuples.
  - NULL TWO, uniform random difference arrays of matched dimensions through the identical decoder.
  - 'Primitive-substitution arm: real block cipher versus seeded ideal permutation at matched cells;
    a difference beyond the declared tolerance means the measurement is reading the primitive.'
  - Round-trip validation of the mode implementation against its own decryption before any measurement
    run.
  - 'Decoder freeze: the decoder file hash is recorded in the run manifest before the first arm executes,
    so no post-hoc tuning is possible.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The identical decoder, running in the same invocation, against two
    nulls of the same shape. NULL ONE: the same plaintext tuples encrypted under r DISTINCT nonces,
    producing an array of the same dimensions built from unrelated keystreams. NULL TWO: an array
    of the same dimensions filled with uniform random bytes. For the signal arm to mean anything,
    both nulls must show a recovered-bit fraction statistically indistinguishable from the decoder''s
    prior on the source model alone, within the declared confidence interval, at every cell of the
    sweep. If either null shows a rising trend in r, the decoder is reading its own source model rather
    than the difference system and the entire signal arm is uninterpretable.'
  independent_variables:
  - nonce-repeat multiplicity r
  - overlap profile
  - plaintext source per-byte entropy
  - 'primitive slot occupant: seeded ideal permutation versus pinned real block cipher'
  metrics:
    primary:
    - recovered plaintext bit fraction per cell, with bootstrap confidence interval
    - exact rank of the difference system in bits per cell
    - marginal recovered-bit gain per additional repeat
    - saturation index in r under the declared threshold
    - null-arm recovered-bit fraction per matched cell
    secondary:
    - counter-block collision count per configuration
    - measured versus declared per-byte source entropy
    - wall-clock per cell and total sample count
    - absolute difference between primitive-slot arms at matched cells
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The exact rank of the difference system, and the shape of recovered-bit fraction as
      a function of repeat multiplicity in each null arm.
    formula: 'Rank in bits equals (r-1) times the overlap length in blocks times the block width,
      where overlap length is the number of block positions on which the message being differenced
      and the reference message both carry plaintext. Null-arm prediction: recovered-bit fraction
      equals the decoder prior on the source model alone, constant in r, with zero slope to within
      the bootstrap confidence interval at every cell.'
    source: Pre-registered in the parent proposal IDEA-20260816-f0cdb2 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at 16-bit block width and message lengths up to 512 blocks, chosen so that
      the difference-system rank can be computed exactly and the decoder can be run to completion
      at every cell. The transfer assumption, stated rather than hidden: the quotient structure that
      defines the tracked object is independent of block width, so the rank law is expected to hold
      verbatim at any width, while the recovered-bit surface depends on the source models and transfers
      to nothing else. No extrapolation to cryptographic block widths or to real traffic is performed
      or licensed, and the counter-block collision count is reported precisely because it is the one
      artifact of the small width that could contaminate the keystream layer.'
    correspondence: null
  tail_checks:
  - Cells at the highest multiplicity where recovered-bit fraction approaches 1.0 are reported with
    one-sided intervals, since a bounded fraction near its endpoint fakes significance.
  - Cells where any counter-block collision occurred are reported separately and excluded from the
    headline surface.
  - The lowest-redundancy source model is checked for a recovered-bit fraction indistinguishable from
    its null, which is the expected boundary behaviour and a sanity check on the decoder.
  - The staggered overlap profile at r=32 is checked for empty overlap rows, which contribute zero
    rank and must not be counted.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt the whole run and record nothing as evidence if the exact rank check fails at any cell, since
    the symbolic basis is then wrong.
  - Halt if either null arm shows a slope in r whose confidence interval excludes zero, and report
    the instrument as invalid rather than reporting the signal arm.
  - Cap total wall clock at four core-hours; if the sweep is incomplete, report the completed cells
    and the missing ones by name, never as absent evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: A completed crossed sweep in which the exact rank law holds at every cell, both
    null arms are flat in r within their confidence intervals, and the signal-arm recovered-bit fraction
    at the highest-redundancy source exceeds its matched null by at least 0.15 absolute at r=8 with
    a non-overlapping interval.
  falsification_criterion:
  - Recovered-bit fraction shows no dependence on r at any source model, with intervals overlapping
    across the whole sweep.
  - A null arm rises with r, invalidating the decoder as an instrument.
  - The measured rank disagrees with (r-1) times overlap times block width at any cell.
  - The real-primitive arm and the ideal-permutation arm differ by more than 0.03 absolute at matched
    cells, which relocates the effect to the primitive and out of this bucket.
  - No saturation index is reached within r up to 32, leaving the graded claim unsupported at the
    tested parameters.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-f0cdb2
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The frozen decoder is specified only as a source-model decoder here; the Coordinator must approve
    its exact rule set and its file hash before any run, because the entire surface is a lower bound
    whose tightness is set by that choice.
  - The declared per-byte entropies and the source models that realise them are named but not fully
    specified, and a source model with unintended structure would confound the surface.
  - The tolerance of 0.03 absolute for the primitive-substitution arm is asserted rather than derived
    from the sampling variance at 200 tuples per cell.
