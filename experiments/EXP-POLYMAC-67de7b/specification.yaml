experiment:
  id: EXP-POLYMAC-67de7b
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-4b35b0; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-4b35b0
  question_id: RQ-POLYMAC-7c89e4
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Four-cell characterisation of achievable difference-coefficient sets and maximum attainable
    distinct-root counts under each construction's block encoding, transported across both fields,
    with a free-encoding null and a matched-cardinality random-subset control
  objective: The uncertainty reduced is whether the forger in each construction can actually realise
    the difference polynomials that the forgery bound implicitly grants, and whether any shortfall
    belongs to the encoding or to the field. (i) Write and validate each construction's block-encoding
    map against pinned test vectors, then characterise the image of the induced difference map at
    each degree, by exhaustive enumeration where affordable and by structural argument beyond, requiring
    the two to agree where they overlap. (ii) Maximise the number of distinct roots over that image
    at each degree, giving the true numerator of the optimal forgery probability, and compare it against
    the degree, which is the numerator the bound implicitly assumes. (iii) Transport each encoding
    into the other field to obtain four cells, two of which exist in no deployment, so that the encoding
    main effect, the field main effect and their interaction are separately measurable rather than
    confounded as they are in the deployed pair. The run does not measure forgery probability against
    any bound and does not reduce uncertainty about tightness; it supplies the correction term that
    the tightness contracts need.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: at n = 12 (and n = 16 where affordable)
      and degrees up to the declared cap, the maximum attainable number of distinct roots over each
      construction''s achievable difference-coefficient set is exactly the tabulated integer in each
      of the four cells, with the free-encoding null attaining the degree and the random-subset control
      at matched cardinality tabulated alongside. WHAT DOES NOT FOLLOW: nothing about achievability
      at deployed degrees or field sizes; no claim that any published bound is incorrect, since an
      upper bound remains an upper bound under any restriction of the forger''s domain; no attack;
      and no statement about the deployed constructions beyond the arithmetic of the encoding maps
      that were validated against test vectors.'
  inputs:
    procedure: 'STAGE 0 (cost: a day, human): write both encoding maps from specification text, define
      the two transports, freeze the degree cap and the structured subfamily. STAGE 1 (cost: minutes):
      validate both encoding maps against pinned published test vectors; halt on mismatch. STAGE 2
      (cost: minutes to hours): enumerate the achievable difference-coefficient set per cell per degree
      up to the enumeration limit; beyond it, generate the structured subfamily and a uniform random
      sample of the full achievable set, recording which regime each number came from. STAGE 3 (cost:
      minutes to hours): for each achievable vector, count distinct roots over the full key space;
      take the maximum per cell per degree. STAGE 4 (cost: minutes): run the free-encoding null and
      the matched-cardinality random-subset encoding through the identical maximiser. STAGE 5 (cost:
      seconds): compute the encoding main effect, field main effect and interaction as exact integers.
      STAGE 6 (cost: seconds): emit the correction table for citation by the other contracts in this
      bucket, and the manifest.'
    instrument: Python 3 standard library. Binary field by shift-and-XOR with pinned reduction polynomial;
      prime field with native int; encoding maps implemented directly from specification text with
      their test vectors embedded as fixtures. Root counting over the full key space by direct evaluation
      into an int bitmap. Structured subfamily generation by explicit construction of products of
      linear factors followed by an achievability check, so that a constructive lower bound exists
      in every cell. Manifest and inference block via harness/runner.py. No Sage, no network.
    parameters: 'Widths n = 12 primary, n = 16 where affordable. Degrees d in {1, 2, 3, 4, 6, 8},
      with exhaustive enumeration up to the largest d whose achievable set is under 2^22 members and
      sampling above it at 2^20 uniform draws plus the full structured subfamily. Four cells: (binary
      field, native encoding), (binary field, transported prime-style encoding), (prime field, native
      encoding), (prime field, transported binary-style encoding). Free-encoding null and matched-cardinality
      random-subset control per cell, the latter with 32 draws. Five primes per width for the prime
      cells.'
  controls:
  - Free-encoding null where all coefficient vectors are achievable, maximum root count must equal
    the degree.
  - Random-subset encoding at matched image cardinality, isolating cardinality from structure.
  - Test-vector validation of both encoding maps before measurement, with a halt on mismatch.
  - Enumeration versus structural characterisation cross-check in the overlap degree range.
  - All four cells through one code path with encoding and field as independent parameters.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The FREE-ENCODING NULL: an arm in which every coefficient vector is
    achievable, run through the identical root maximiser. Its maximum achievable distinct-root count
    must equal the degree exactly at every degree; if it does not, the maximiser cannot find fully
    split polynomials even when they exist and every signal number is a lower bound of unknown quality.
    The second control is a RANDOM-SUBSET ENCODING: a random subset of coefficient space with the
    same cardinality as the measured achievable set, run identically - for the encoding to be doing
    anything beyond reducing cardinality, the real encoding''s maximum root count must differ from
    the random subset''s. If it does not, the finding is that the encoding acts only through the size
    of its image, which is a complete and useful result and directly bounds the confounder for the
    rest of the bucket.'
  independent_variables:
  - field type (binary extension, prime)
  - encoding (native binary-style, native prime-style, free, random subset at matched cardinality)
  - polynomial degree d
  - bit width n
  metrics:
    primary:
    - achievable difference-coefficient set cardinality per (cell, d)
    - maximum attainable distinct-root count per (cell, d)
    - maximum root count divided by d per cell
    - encoding-by-field interaction as an exact integer
    secondary:
    - regime label per number (exhaustive, structured-subfamily lower bound, sampled lower bound)
    - free-encoding null root count per d
    - random-subset control root count at matched cardinality
    - test-vector validation status per encoding map
    - prime-sweep spread per prime cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: M(cell, d) = the maximum, over achievable difference-coefficient vectors of degree d
      in that cell, of the number of distinct roots in the key space; and the shortfall d - M(cell,
      d).
    formula: 'M(free, d) = d exactly for every d, by the fundamental fact that a degree-d polynomial
      over a field has at most d roots and that a fully split polynomial with distinct roots exists
      whenever coefficients are free and the field is large enough. Predicted: the free-encoding null
      attains this exactly; the random-subset control at matched cardinality gives the cardinality-only
      baseline against which each real encoding''s M is read. No value is pre-committed for the real
      encodings'' shortfall.'
    source: Pre-registered in the parent proposal IDEA-20260816-4b35b0 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested at n = 12 and 16 with degrees up to 8, chosen so that root counting is exhaustive
      over the full key space and the achievable set is either enumerable or bounded by an explicit
      structured subfamily plus a sample, with every reported number carrying its regime label. There
      is no extrapolation to deployed degrees or widths, and the contract explicitly refuses to project
      a shortfall measured at degree 8 to degrees in the thousands; the deliverable is a correction
      term valid where the rest of this bucket measures.
    correspondence: null
  tail_checks:
  - d = 1, where the polynomial is linear and M must be exactly 1 in every cell that can realise a
    nonzero linear difference at all
  - d equal to the enumeration limit, where exhaustive and sampled regimes meet, must show the sampled
    maximum not exceeding the exhaustive one
  - cells where the achievable set is empty at some degree must be reported as empty rather than as
    M = 0 with no explanation
  - the transported encodings must be checked at d = 1 to confirm they permit any nonzero difference
    at all
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - halt if either encoding map fails its test vectors
  - switch from exhaustive to sampled regime at 2^22 achievable members and label every subsequent
    number as a lower bound
  - cap total wall clock at 5400 seconds; on exceeding, drop n = 16 and the two largest degrees, recording
    the reduction
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All four cells plus both controls complete in one invocation, both encoding maps
    pass their test vectors, the free-encoding null attains M = d at every degree, and the maximum
    attainable root counts are emitted per cell per degree with their regime labels and the interaction
    integer.
  falsification_criterion:
  - free-encoding null does not attain M = d
  - an encoding map fails its test vectors
  - exhaustive and sampled regimes disagree at the boundary degree
  - a counted root multiplicity exceeds the degree
  - the four-cell transport cannot be defined without changing a second variable
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-4b35b0
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The exact block-encoding and length-encoding rules must be taken from primary specification text
    and validated against published test vectors; this record names the requirement and does not supply
    the rules.
  - The Coordinator must ratify the two encoding transports, since the two artificial cells are defined
    by that choice and the interaction term depends entirely on it.
  - A ruling is needed on whether sampled lower bounds may be compared across cells at all, or whether
    only the structured subfamily's constructive bounds are comparable.
  - This contract should be scheduled before the ratio-surface and tight-region contracts, since both
    currently cap their achievable-difference family arbitrarily at 2^18 and this record would replace
    that cap with a justified family - the Coordinator must decide the batch order.
