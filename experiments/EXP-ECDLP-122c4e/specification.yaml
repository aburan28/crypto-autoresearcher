      sha256: 67113b5f14a93a0699cb70089b270403edb62a5791d7f498d1380149a5cb7508
  controls:
    - id: CTRL-SOURCE-HASHES
      pass_condition: all five source hashes match before parsing
    - id: CTRL-PRIOR-G3
      pass_condition: recomputed G3 values match all 60 committed summaries within 1e-6
    - id: CTRL-SPARSE-ROW
      pass_condition: every level with 4B<|D_f| has rho=2 floor(sqrt(B))
    - id: CTRL-LOWER-B
      pass_condition: matched B/1000 control has the same sparse-row identity and no product label
  inputs:
    B: 1000000
    lower_B_divisor: 1000
    source_run_id: RUN-ECDLP-03a8c9-001
    expected_curve_count: 60
    master_seed: 3308421
  metrics:
    primary:
      - sparse_level_count
      - sparse_level_identity_pass_rate
      - prior_g3_exceedance_count
      - g3_exceedance_explained_rate
    secondary:
      - density_valid_normalized_deviation_max
      - prior_g3_reproduction_max_abs_error
      - lower_B_control_pass_rate
  preregistered_prediction:
    formula: >-
      If 4B<|D_f| then rho_f(B)=2 floor(sqrt(B)); sparse G3 products equal
      h_f times this constant, while density-valid normalized deviations stay
      below 0.01 in the inherited G1 regime.
    source: exact principal-form row geometry plus frozen prior implementation
  scale_relevance:
    tier: toy
    justification: reanalysis of 7-8 bit prime-field source cells only
    correspondence: null
  budget:
    wall_clock_seconds_per_run: 300
    total_cpu_hours: 0.1
    maximum_memory_gb: 1
    maximum_runs: 1
  stopping_rules:
    - stop invalid on any source hash, cell, or prior-G3 mismatch
    - stop after all 60 cells and lower-B control pass
  invalidation_rules:
    - source hash mismatch
    - missing or duplicated source summary
    - imported arithmetic identity mismatch
  success_criterion: >-
    All source and control checks pass, prior G3 values reproduce, and every
    prior G3>4 curve is explained by the sparse density classification.
  falsification_criterion: >-
    A valid sparse-row mismatch, density-valid G3>4 curve, or normalized
    deviation >=0.01 is a scoped falsification of the proposed explanation.
  required_artifacts:
    - experiments/EXP-ECDLP-122c4e/code/analyze_density_confounds.py
    - experiments/EXP-ECDLP-122c4e/runs/RUN-ECDLP-122c4e-001/manifest.yaml
    - experiments/EXP-ECDLP-122c4e/runs/RUN-ECDLP-122c4e-001/raw-result.json
    - experiments/EXP-ECDLP-122c4e/runs/RUN-ECDLP-122c4e-001/stdout.log
    - experiments/EXP-ECDLP-122c4e/runs/RUN-ECDLP-122c4e-001/stderr.log
    - experiments/EXP-ECDLP-122c4e/runs/RUN-ECDLP-122c4e-001/command.txt
    - experiments/EXP-ECDLP-122c4e/runs/RUN-ECDLP-122c4e-001/environment.json
