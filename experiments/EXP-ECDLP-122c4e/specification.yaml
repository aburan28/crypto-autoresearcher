  objective: >-
    Recompute the prior 60-cell conductor-level rho and product observations
    from exact source bytes, test the sparse-row identity, reproduce prior G3
    values, and determine whether G3>4 is confined to density-poor levels.
  claim_tier_ceiling: toy
  source_artifacts:
    - path: experiments/EXP-ECDLP-03a8c9/specification.yaml
      sha256: 47382be1754a6c07e43e5cae92c9f14a88e19fc15a8cb93fa4194a07e8ed0d53
    - path: experiments/EXP-ECDLP-03a8c9/runs/RUN-ECDLP-03a8c9-001/run_volcano_audit.py
