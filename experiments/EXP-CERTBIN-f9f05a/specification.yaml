# EXP-CERTBIN-f9f05a
# Half-fold count arithmetic. No table is built.
# Approved by DEC-20261003-c5de75.
experiment:
  id: EXP-CERTBIN-f9f05a
  hypothesis_id: H-CERTBIN-c22992
  source_idea: IDEA-20260930-77ec1c
  question_id: RQ-CERTBIN-836ce2
  version: 1
  title: Written count versus the binomial
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-c5de75
  objective: >-
    Check the gap 695700, the cross 5924, and the tenth gap 9.
  inputs:
    binom: 33539489304300
    written_count: 33539490000000
    binom_gap: 695700
    ratio_num: 14185801
    ratio_den: 7986
    ratio_quot: 1776
    ratio_rem: 5330
    ratio_cross: 5924
    fold_gib: 375
    tenth_floor: 3752
    millionth_cross: 254422
    pair_gib: 20570461
    pair_rem: 105170224
    tenth_gap: 9
  controls:
    - >-
      Choosing 4 from 5328 gives 33539489304300. The written count
      exceeds it by 695700. Choosing 4 from 5325 invalidates the run.
    - >-
      14185801 divided by 7986 is 1776 with remainder 5330. The cross
      against 177633 over 100 is 5924. A remainder of 0 drops that
      cross.
    - >-
      The 3-fold quotient is 375 and the tenth-floor is 3752. The
      millionth cross is 254422. The pair quotient is 20570461 with
      remainder 105170224. 205704626 exceeds 205704617 by 9.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {binomial, ratio, tenth}
    - route in {choose, cross}
  metrics:
    primary:
      - binom_gap
      - ratio_cross
      - tenth_gap
      - implementations_agree
    secondary:
      - ratio_rem
      - fold_gib
      - millionth_cross
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      33539490000000 exceeds 33539489304300 by 695700. The cross
      against 177633 over 100 is 5924. 205704626 exceeds 205704617
      by 9.
    formula: >-
      Choose 4 from 5328 and subtract from 33539490000000. Cross
      14185801 over 7986 with 177633 over 100. Subtract 205704617
      from 205704626.
    source: >-
      IDEA-20260930-77ec1c states the base 5325, the weight 7, the
      complementary count, the ratio 1776.33, the 375.2 figure, the
      base 872790, and the pair GiB figure, read 2026-10-03. The
      products were recomputed in this design session. That
      computation is not a run. No table was built. The subgroup
      order was not computed.
  scale_relevance:
    tier: toy
    justification: One written base and one written complementary count. No transfer to a memory measurement.
    correspondence: null
  tail_checks:
    - The cross 5924 and the tenth gap 9 are required. A check that stops at the gap 695700 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the gap 695700 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The binomial is not 33539489304300.
    - The gap is not 695700.
    - The cross is not 5924.
    - The tenth gap is not 9.
    - A table is built.
  success_criterion: >-
    Both runs agree that choosing 4 from 5328 gives
    33539489304300, that the written count exceeds it by 695700,
    that the cross against 177633 over 100 is 5924, and that
    205704626 exceeds 205704617 by 9.
  falsification_criterion: >-
    The runs agree that choosing 4 from 5328 is computed, and that
    value is not 33539489304300.
  required_artifacts:
    - experiments/EXP-CERTBIN-f9f05a/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CERTBIN-f9f05a/runs/<RUN-ID>/command.txt
    - experiments/EXP-CERTBIN-f9f05a/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CERTBIN-f9f05a/runs/<RUN-ID>/stderr.log
    - experiments/EXP-CERTBIN-f9f05a/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CERTBIN-f9f05a/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any table build, memory measurement, or membership test.
    - Any claim that a pair column is a feasibility bound.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
