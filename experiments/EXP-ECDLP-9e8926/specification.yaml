experiment:
  id: EXP-ECDLP-9e8926
  hypothesis_id: H-ECDLP-32e5d7
  question_id: RQ-ECDLP-bc7a54
  question_ids:
    - RQ-ECDLP-bc7a54
  source_idea: IDEA-20261003-76df35
  goal_id: null
  goal_ids: []
  goal_ids_note: >-
    No goal head is edited. GOAL-ECDLP2M-001.yaml is out of write-scope.
  version: 1
  title: >-
    Stage 0 Theorem U / class-K / H1 worksheet; Stage 1 Python mixed-spectrum
    C(E) and tau(D) certificate versus pairing-preserving NULL-1 on
    field_bits 10..14
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-04'
  approval_decision: DEC-20261004-57f0cc
  packaging_only: false
  designed_at: '2026-10-04'
  frozen: true
  frozen_at: '2026-10-04'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261004-57f0cc under AGENTS.md standing user
    authorization (2026-09-06). Trial-plan-v1 admits Stages 0-1 only.
    No Magma/Sage/AUXIN/Bedrock. No Stage 2 (full Wiener library) or Stage 3
    (A_L(W) ladder); those are idea Stages deferred to a successor DEC.
  execution_surface:
    trial_plan: experiments/EXP-ECDLP-9e8926/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-ECDLP-9e8926/implementation/run.py --stage 0
      --trial-plan experiments/EXP-ECDLP-9e8926/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-ECDLP-9e8926/implementation/run.py --stage 1
      --trial-plan experiments/EXP-ECDLP-9e8926/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. {run_dir} is substituted by
      the process supervisor. trial-plan.json is a byte-identical twin of
      trial-plan-v1.json.
  approval:
    approval_decision: DEC-20261004-57f0cc
    composing_decision: DEC-20261004-57f0cc
    rule: >-
      Approved under AGENTS.md "Standing user authorization for ideas and
      experiments" (user, 2026-09-06: "all is approved. ideas/experiments should
      be always approved") once the protocol was complete. Approval does not
      assert the hypothesis is true. Stages 0-1 only.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      section: Standing user authorization for ideas and experiments
      instruction_date: '2026-09-06'
      quotation: 'all is approved. ideas/experiments should be always approved'
      renewed_user_approval_required: false

  objective: >-
    Decide, on Python-enumerable prime-order toys at field_bits 10..14, whether
    the mixed-spectrum constant C(E) is bounded and flat while Theorem U's
    tightness ratio tau(D) stays <= 1 on a constructed library (O-U-HOLDS), or
    else exhibits C-growth (O-C-GROWING) or a tau violation (O-TAU-VIOLATION),
    after a zero-run Stage-0 worksheet that freezes Theorem U, the class-K
    corollary, and the H1 prediction table.

  class: heuristic-validation
  class_note: >-
    Heuristic-validation of H1 (uniform C(E) bound) at toy scale, with Theorem U
    as the rigorous size bound under the cited character-sum estimate. No
    exponent-moving claim.

  claim_tier_and_scope:
    claim_tier: toy
    statement: >-
      Exact mixed-spectrum C(E) and tau(D) on self-generated field_bits {10..14}
      curves versus NULL-1. No discrete-logarithm solve. No deployed curve.
    sota_delta: zero on every ECDLP cost axis
    dominated_by: rho / van Oorschot-Wiener at 0.886 sqrt(n)
    certificate_kind: spectrum_argmax
    certificate_note: >-
      Argmax (a,t) of |S| and the library tau table are re-verifiable from the
      stored discrete-log table and FFT path. No DL solve certificate.
    affected_vs_safe: No deployed or standardized curve is touched.

  scope:
    included:
      - 'Stage 0 (zero scientific trials): Theorem U, class-K corollary, D_x and interval-of-logs readings, piecewise corollary honesty, anomalous treatment, retrieval status, H1 table, self-checks, precommit hashes'
      - 'Stage 1: field_bits {10..14}; C(E) mixed spectrum; NULL-1; j=0 orbit equalities; anomalous ceiling when found; minimal D_x/D_I/random library for tau(D)'
    excluded:
      - Stage 2 full Wiener-norm library (M5 out-of-class chi sets beyond the minimal library)
      - Stage 3 A_L(W(m,w)) ladder to n=2^26 (E-SPREAD / E-STRUCTURED)
      - Magma/Sage/AUXIN/Bedrock success paths
      - Deployed curves and cryptographic p
      - Editing GOAL-ECDLP2M-001.yaml or IDEA-20261003-76df35
      - Algebraic-omega A(1) census (sibling EXP-ECDLP-02bd1c)

  stages:
    stage_0:
      name: Zero-run Theorem U / class-K / H1 worksheet
      deliverables:
        - stage0/preregistered-predictions.json
        - stage0/theorem-u.yaml
        - stage0/class-k-corollary.yaml
        - stage0/h1-prediction-table.yaml
        - stage0/retrieval-status.yaml
        - stage0/precommit-hashes.json
        - stage0/selfchecks.json
      blocks_stage_1_until: >-
        Stage-0 self-checks pass and precommit-hashes.json is written BEFORE
        any curve enumeration. A failed self-check halts Stage 1.
    stage_1:
      name: Python C(E) / tau certificate versus NULL-1
      deliverables:
        - stage1/cells.yaml
        - stage1/ladder.json
        - stage1/census.json
        - stage1/decision-rules.json
        - RESULTS.md

  freeze:
    field_bits: [10, 11, 12, 13, 14]
    curves_per_size_declared: 10
    null1_per_size_declared: 10
    j0_per_size_declared: 2
    executed_taper:
      "10-12": 10
      "13-14": 4
    C0_soft: 4
    C0_hard: 6
    tau_hard: 1.0
    j0_tol_factor: 1.0e-9
    library_B_exponents: [0.5, 0.6, 0.7]
    library_L_exponents: [0.5, 0.6, 0.7]
    seeds_base: 2026100476
    ratio_note: taper is a disclosed Python/numpy wall-clock bound, not a silent change of H1 thresholds

  inputs:
    field_bits: [10, 11, 12, 13, 14]
    C0_soft: 4
    C0_hard: 6
    implementation: experiments/EXP-ECDLP-9e8926/implementation/run.py

  controls:
    - 'NULL-1 pairing-preserving relabelled Z/n (blocking generic-group null)'
    - 'j=0 beta-orbit spectral equalities when a j=0 curve is present (positive)'
    - 'Calibration rows: D=everything identity; interval A_x / A_L forced O(ln); random set A ~ sqrt(size)'
    - 'Theorem U audit tau(D) <= 1 with measured C(E) (blocking)'
    - 'Anomalous ceiling arm when a CM toy is found (hardness-independence control)'
    - 'Decay test of C(E) in p (slope consistent with 0)'
    - 'Timeouts/crashes are O-IMPEDIMENT, never O-U-HOLDS / O-C-GROWING / O-TAU-VIOLATION'

  independent_variables:
    - field_bits in {10..14}
    - arm in {curve, null1, j0, anomalous}
    - curve/null seed
    - library set family in {Dx, DI, random, everything}

  metrics:
    primary:
      - C_E
      - C_null
      - tau_max
      - outcome_label
      - C_slope_ln_p
    secondary:
      - j0_orbit_residual_max
      - A_x_library
      - A_L_library
      - peak_rss_bytes
      - executed_curves_per_size

  heuristic_under_test: H1
  preregistered_prediction:
    quantity: C(E) = max_{a!=0,t} |S(a,t)|/sqrt(p) and tau(D) = |D|/(4(C sqrt(p)+1) A_x A_L)
    formula: >-
      O-U-HOLDS: C(E)<=4 soft / <=6 hard, slope~0, tau<=1, j0 pass;
      O-C-GROWING: C>6 or rising slope; O-TAU-VIOLATION: tau>1;
      NULL-1 C_null ~ sqrt(ln(pn)) growing
    source: >-
      IDEA-20261003-76df35 predictions M1-M3,M6 and minimal_test Stages 0-1,
      copied 2026-10-04; executed taper for bits>12 disclosed as Python/numpy
      wall-clock bound
  scale_relevance:
    tier: toy
    justification: >-
      field_bits 10..14 with Python enumeration (+ optional numpy.fft). Transfer
      to cryptographic p is not claimed; uniformity of C(E) rests on the cited
      theorem beyond the ladder.
    correspondence: null
  tail_checks:
    - Top |S(a,t)|/sqrt(p) per curve with (a,t) recorded
    - j0 equalities must hold; tau must stay <= 1; calibration rows must match forced scales

  replication:
    seeds_base: 2026100476
    independent_instances: 'per-size curve/null draws'
    replication_note: Sizes are the replication axis; taper disclosed above.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 3
    maximum_workers: 1

  stopping_rules:
    - 'Stage 0 completes or Stage 1 does not start'
    - 'tau > 1 or C(E) > 6 voids the mathematical reading as O-TAU-VIOLATION / O-C-GROWING'
    - 'j0 equality miss yields O-ARTIFACT and stops scoring'
    - 'A crash, timeout, or memory abort is O-IMPEDIMENT / failed_infrastructure'
    - 'Stop after Stages 0-1; do not start Stage 2 or Stage 3'

  invalidation_rules:
    - Dual meters / null use a different spectrum implementation than the object
    - Magma, Sage, AUXIN, or Bedrock is selected as a success path
    - H1 / O-* thresholds are edited after any Stage-1 read
    - 'IDEA-20261003-76df35 or GOAL-ECDLP2M-001.yaml is edited'

  success_criterion: >-
    Stage 0 self-checks pass. Stage 1 emits exactly one of O-U-HOLDS,
    O-C-GROWING, O-TAU-VIOLATION, O-INCONCLUSIVE, O-ARTIFACT, O-IMPEDIMENT from
    the frozen decision rules, with census tables and controls archived.

  falsification_criterion: >-
    O-U-HOLDS is false under the idea's F1/F2 (tau>1 or C>6 / rising).
    j0 or calibration failures void the run.

  outcome_table:
    O-U-HOLDS: tau<=1 on library; C(E)<=4 soft and <=6 hard; slope~0; j0 pass; calibration pass
    O-C-GROWING: C(E)>6 on any curve, or rising slope in ln p with CI excluding 0
    O-TAU-VIOLATION: tau(D)>1 for any library set with measured C(E)
    O-INCONCLUSIVE: controls pass but neither HOLDS nor GROWING/VIOLATION decides cleanly
    O-ARTIFACT: j0 miss, calibration failure, or null decay instrument break
    O-IMPEDIMENT: curve search exhausted, timeout, crash; not a mathematical result

  required_artifacts:
    - experiments/EXP-ECDLP-9e8926/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-9e8926/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-9e8926/runs/<RUN-ID>/RESULTS.md
    - experiments/EXP-ECDLP-9e8926/stage0/preregistered-predictions.json
    - experiments/EXP-ECDLP-9e8926/stage0/precommit-hashes.json
    - experiments/EXP-ECDLP-9e8926/stage1/census.json
    - experiments/EXP-ECDLP-9e8926/stage1/ladder.json
  required_artifacts_note: >-
    Supervisor-generated files per trial (launch.json, execution-receipt.json,
    command.txt, environment.json, stdout.log, stderr.log, check.stdout.log,
    check.stderr.log) are reserved to the process supervisor.

  assigned_to: executor
  amazon_bedrock: NOT SELECTED
  out_of_scope:
    - Magma or Sage tabulated discrete logs
    - AUXIN records
    - 'Any "run: Magma" success path'
    - GOAL-ECDLP2M-001.yaml
    - Stage 2 full Wiener library / Stage 3 A_L(W) ladder
    - Sibling algebraic-omega A(1) census (EXP-ECDLP-02bd1c)
    - Deployed curves
