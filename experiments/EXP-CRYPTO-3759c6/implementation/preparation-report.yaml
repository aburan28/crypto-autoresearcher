preparation_report:
  task_id: TASK-20260907-da9b67
  experiment_id: EXP-CRYPTO-3759c6
  hypothesis_id: H-CRYPTO-1d65d5
  approval_decision_id: DEC-20260907-b8bd3e
  implementation_manifest_path: experiments/EXP-CRYPTO-3759c6/implementation/implementation-manifest.yaml
  no_run_attestation: >-
    Zero scientific runs occurred. No corpus census, label assignment, query
    execution, index construction, fixture evaluation, bootstrap resample,
    or metric computation was performed against real or synthetic data by
    this task. The only executions performed were: `python3 -m ast` syntax
    checks on the five new .py files, `json.load` validation of the two new
    .json files, and `sha256sum`/`git status`/`git rev-parse`/`git log`
    read-only inspection commands used to populate this report and
    implementation-manifest.yaml. No rg/grep call, no sparse scoring call,
    and no sampler call from evaluate.py/queries.py/corpus.py/controls.py
    was invoked.
  requirement_mapping:
    - deliverable: corpus.py
      spec_clauses: [corpus.ordering, corpus.manifest_fields, corpus.identity, corpus.routes, corpus.payloads, corpus.malformed, corpus_views, candidates]
      status: source_prepared
      note: git_ls_tree/git_cat_blob are read-only helpers defined but not invoked; resolve_route/extract_candidates/dedupe_aliases are frozen interfaces raising NotImplementedError pending real corpus/route data; extract_title_abstract_view and view/metadata helpers are fully implemented pure functions (no I/O) ready for the future admission pass to call against real text.
    - deliverable: queries.py
      spec_clauses: [query_extraction, query_compiler]
      status: source_prepared
      note: parse_argv/validate_flags/classify_fidelity/check_leakage/apply_path_filters-signature and normalize_for_contamination_check are implemented as pure functions; compile_boolean/reconstruct_summary_terms/extract_bm25_terms/union_multi_search/apply_path_filters are frozen interfaces (NotImplementedError) pending real recorded commands and admitted path lists.
    - deliverable: evaluate.py
      spec_clauses: [sparse_model, nulls, bootstrap, metrics, pipeline, runtime.failure_capture, runtime.resume]
      status: source_prepared
      note: BM25 tokenizer/embedder/dot-product, null and bootstrap deterministic samplers, exact-fraction metric functions, and the StageGate ordering enforcer are fully implemented pure functions; none is called against real corpus/query/label data. LaunchRecord/ReceiptRecord/CheckpointRecord are field-only dataclasses, not instantiated.
    - deliverable: controls.py
      spec_clauses: [controls]
      status: source_prepared
      note: CONTROL_FIXTURES (c00-c05) and TIE_FIXTURE (t00-t20) are frozen source constants (27 documents total, asserted at import time by static assertions, not by a run). The six check_* obligation oracles are implemented as pure predicates over hypothetical already-computed result arguments; none is invoked with real returned sets in this task.
    - deliverable: independent_checker.py
      spec_clauses: [labels.disagreement-adjacent structural checks, artifacts.exact_bytes, formalization.smallest_obligation, execution_gate independent-checker requirement]
      status: source_prepared
      note: Independently reimplemented (no imports from the other four producer modules) set-membership/count/null-expectation/margin/rank-tie/hash-binding checks. All are pure functions over hypothetical inputs; none is invoked against real evaluator output.
    - deliverable: schemas.json
      spec_clauses: [artifacts.admission_files, artifacts.run_files, artifacts.summary_files, corpus.manifest_fields, corpus.denominators, controls.obligations_count, nulls.draws_per_proposal_per_seed, bootstrap.resamples]
      status: source_prepared
      note: JSON Schema-style definitions for every declared artifact row family, with denominator_check annotations describing (not enforcing at runtime, in this task) the invariants a future admission/run pass must maintain.
    - deliverable: admission-template.json
      spec_clauses: [execution_gate, artifacts.exact_bytes, runtime.protection]
      status: source_prepared
      note: Every value is null or an explicit "unverified"/"not_admitted" placeholder; no real corpus/label/query/code/config/executable/version/resource hash or independent-review attestation is populated.
    - deliverable: label-rubric.md
      spec_clauses: [labels]
      status: source_prepared
      note: Frozen two-pass rubric, masking rules, third-adjudicator procedure, exclusion rules, and an access-attestation template with every field null. No actual label is assigned.
    - deliverable: implementation-manifest.yaml
      spec_clauses: [artifacts.exact_bytes]
      status: source_prepared
      note: Hashes the other eight prepared files (this report is identified by path only, without its digest, to keep the manifest<->report reference acyclic); records dependency bindings, source authorship, model-identity as "unverified", and remaining admission dependencies. Does not hash its own bytes and issues no launch/receipt record.
    - deliverable: preparation-report.yaml
      spec_clauses: [n/a — this report itself]
      status: this_document
      note: Identifies implementation-manifest.yaml by path only, without its digest, matching the manifest's own acyclic reference.
  independence_and_read_limitations:
    - This entire ten-file preparation task was performed by one executor
      session. independent_checker.py's separation from the producer
      modules is structural (no shared imports) only; it is explicitly NOT
      independent authorship or a successful review, as stated in the
      module's own docstring and required by DEC-20260907-b8bd3e.approval_scope.independent_review.
    - This Coordinator/executor lineage did not read raw corpus/proposal
      blobs at source_commit for census purposes; evaluate.py's BM25
      reimplementation is based on the source-packet-transmitted excerpts of
      kb/src/crypto_kb/embeddings/sparse.py and kb/src/crypto_kb/text.py
      (hashes recorded in coordination/design/BATCH-bee684/source-packet.json
      and cross-cited in implementation-manifest.yaml), not on an
      independently re-verified checkout of source_commit's kb package by
      this executor session.
    - >-
      No process-local knowledge-store query, corpus fetch, or network
      access of any kind occurred; the source-packet's own retrieval_limit
      note (embedded "memory" Qdrant mode, absent collection) is unchanged
      and unexercised by this task.
