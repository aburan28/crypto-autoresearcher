#
# ZERO RUNS in this design packet. Stages 0-1 authorized for executor
# TASK-20261002-9ddef1. No AUXIN. Amazon Bedrock prohibited. NO break.
# NO attack. NO exponent. Runnable command surface declared below.
# =============================================================================
experiment:
  id: EXP-FROB-7d51ae
  hypothesis_id: H-FROB-772c0b
  question_id: RQ-FROB-7d8dd4
  source_idea: IDEA-20261002-711e84
  goal_id: GOAL-FROB-6333a9
  version: 1
  title: >-
    Mumford u_0 eliminant at n=19: genus-2 Jac census with 19|#Jac,
    Cantor integrity, (L,b), degree proxy vs GGMP-6 / subspace / random
  status: approved
  approved_by: DEC-20261002-da97c5
  approved_at: '2026-10-02'
  # Top-level frozen/execution_authorized are what tools/experiment_execution.py
  # load_plan reads (nested approval.frozen alone is not sufficient).
  frozen: true
  frozen_at: '2026-10-02'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261002-da97c5 under AGENTS.md standing
    user authorization (2026-09-06). No Magma/Sage/AUXIN/Bedrock. No
    ECC2K-130 solve. No n>=131 attack. Full descended S_3 first-fall is
    Stage 2 (not authorized).
  approval:
    approved_by: DEC-20261002-da97c5
    composing_decision: DEC-20261002-da97c5
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 freezes genus-2 census (19|#Jac), GGMP degree-6 prediction,
      and Koblitz n=19 recipe. Stage 1 runs Cantor integrity, (L,b),
      eliminant_degree / boolean_degree_proxy vs subspace / random-subset /
      identity / null controls; writes RESULTS.md with exactly one O-*
      label. No Magma/Sage. No AUXIN. No Bedrock. No ECC2K-130 solve.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether a genus-2 Mumford Couveignes fibre at n=19 yields an
    eliminant / Boolean-degree proxy different from GGMP vector-space
    degree 6 at m=3 with branching b>=2; deliver exactly one O-* label
    from H-FROB-772c0b.

  class: measurement
  class_note: >-
    Toy structural / degree measurement. Not an exponent-moving
    breakthrough; no ECDLP attack table produced.

  scope:
    included:
      - >-
        Stage 0. Enumerate y^2+h y=f over F_2 (deg h<=3, deg f<=6);
        compute N1,N2,#Jac; retain 19|#Jac with Weil gate; freeze
        stage0/preregistered-predictions.json (GGMP figure 6),
        stage0/genus2-census.json, stage0/koblitz-recipe.json.
      - >-
        Stage 1. For <=3 hits: Cantor integrity on three random triples;
        find order-19 t; measure (L,b), eliminant_degree, boolean_degree_proxy;
        subspace (preregistered GGMP-6), random-subset, identity, null-curve
        controls; RESULTS.md with exactly one O-* label.
        first_fall_degree of full descended S_3 = UNDETERMINED_STAGE2.
    excluded:
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Stage-2 full Weil-descended S_3 first-fall under this card.
      - Editing IDEA-20261002-711e84 claim text or GOAL-FROB-6333a9.yaml.
      - Treating infra failure as mathematical evidence.

  execution_surface:
    trial_plan: experiments/EXP-FROB-7d51ae/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-FROB-7d51ae/implementation/run.py --stage 0
      --trial-plan experiments/EXP-FROB-7d51ae/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-FROB-7d51ae/implementation/run.py --stage 1
      --trial-plan experiments/EXP-FROB-7d51ae/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. implementation/run.py +
      check.py + gf2.py + hyperelliptic.py are the hash-bound sources.
      {run_dir} is substituted by the process supervisor.

  inputs:
    n_toy: 19
    order_prime: 19
    genus: 2
    ggmp_vs_degree_m3: 6
    m_arity: 3
    max_hits_reported: 3
    source_idea: ledger/proposals/IDEA-20261002-711e84.yaml
    hypothesis: ledger/hypotheses/H-FROB-772c0b.yaml
    related_readonly:
      - ledger/proposals/IDEA-20260926-80209d.yaml
      - ledger/proposals/IDEA-20260926-5c26f9.yaml
      - knowledge/open-problems/KN-OPEN-095df5.md

  controls:
    - name: weil_gate
      definition: >-
        #Jac in 1..33 and even N1^2+N2 before any hit is kept.
    - name: cantor_integrity
      definition: >-
        Three random associative/identity checks on Jac(F_2) before degrees.
    - name: subspace_ggmp6
      definition: >-
        Preregistered GGMP vector-space Weil-descended degree 6 at m=3
        as equal-cardinality shape benchmark.
    - name: random_subset
      definition: >-
        Equal-cardinality random subset of the u_0 universe (F_2);
        reproducing a Jacobian-specific gap voids as O-ARTIFACT when
        informative; F_2 cardinality ceiling is disclosed in RESULTS.
    - name: identity_projection
      definition: Predicted b=1 and L=0.
    - name: null_curve
      definition: >-
        Ordinary curve over F_{2^{19}} not defined over F_2, matched
        cardinality intent (recipe; optional probe).

  independent_variables:
    - name: model_index
      levels: [hit_0, hit_1, hit_2]
    - name: control_family
      levels: [jacobian_fibre, subspace_ggmp6, random_subset, identity, null_curve]

  metrics:
    primary:
      - name: hit_count_raw
        unit: integer
        definition: Number of genus-2 models with 19|#Jac(F_2).
      - name: eliminant_degree
        unit: integer
        definition: >-
          Cardinality of im(pi) on the order-19 fibre (square-free
          eliminant degree).
      - name: boolean_degree_proxy
        unit: integer
        definition: eliminant_degree * m_arity (Stages 0-1 proxy; not Gröbner).
      - name: branching_b
        unit: integer
        definition: Max fibre size of pi on Jac(F_2).
      - name: L_bits
        unit: bits
        definition: log2 of average fibre size of pi.
      - name: outcome_label
        unit: enum
        definition: Exactly one of O-POSITIVE/O-NEGATIVE/O-NO-MODEL/O-ARTIFACT/O-IMPEDIMENT.
    secondary:
      - name: first_fall_degree
        unit: integer_or_undetermined
        definition: UNDETERMINED under Stages 0-1 (Stage 2).
      - name: cantor_integrity_pass
        unit: boolean
      - name: peak_rss_bytes
        unit: bytes
      - name: wall_clock_seconds
        unit: seconds

  heuristic_under_test: H1

  preregistered_prediction:
    quantity: >-
      GGMP vector-space degree 6 at m=3; predicted eliminant/proxy differs
      by >=1; predicted b >= 2; existence of a 19|#Jac model is open
      (O-NO-MODEL allowed).
    formula: >-
      ggmp_vs_degree_m3 = 6; boolean_degree_proxy = eliminant_degree * 3;
      b = max fibre size of pi.
    source: >-
      ledger/proposals/IDEA-20261002-711e84.yaml predictions +
      proof_search_map; frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      n=19, genus 2, |Jac(F_2)|<=33. No transfer of degree to n=131
      (genus-2 ceiling 33 precludes order-131 over F_2).
    correspondence: null

  tail_checks:
    - >-
      H1: leading_coefficient of eliminant nonzero on every kept hit.
    - >-
      Random-subset control must be reported beside any degree-vs-6 gap;
      F_2 universe cardinality ceiling is disclosed when it forces the gap.

  replication:
    seeds: [2026100219]
    independent_instances: 2
    note: >-
      Census is deterministic. Stage-1 Cantor sample uses MASTER_SEED.
      Up to three hit models are independent instances.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4.0
    maximum_memory_gb: 4
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and genus2-census.json.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT / O-NO-MODEL stop.
    - RESULTS.md names exactly one O-* label from H-FROB-772c0b.
    - maximum_runs = 4.
    - Do not open Stage-2 S_3 first-fall under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Cantor integrity fail → O-IMPEDIMENT; do not read degrees as support.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an n=131 exponent move → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with ggmp_vs_degree_m3=6 and a genus-2 census
    table (hit_count_raw integer, possibly 0); Stage 1 produces panels and
    control table (or a named O-NO-MODEL / O-ARTIFACT / O-IMPEDIMENT stop);
    RESULTS.md names exactly one O-* label from H-FROB-772c0b with cited
    artifacts.

  falsification_criterion: >-
    Any of: Weil-gate / jac_order recomputation disagreement on a reported
    hit; Cantor integrity fail presented as mathematical negative evidence;
    a claimed break/exponent under this card. (O-NEGATIVE and O-NO-MODEL
    are valid scientific outcomes, not protocol fails.)

  required_artifacts:
    - experiments/EXP-FROB-7d51ae/trial-plan-v1.json
    - experiments/EXP-FROB-7d51ae/stage0/preregistered-predictions.json
    - experiments/EXP-FROB-7d51ae/stage0/genus2-census.json
    - experiments/EXP-FROB-7d51ae/stage1/
    - experiments/EXP-FROB-7d51ae/RESULTS.md
    - experiments/EXP-FROB-7d51ae/runs/<RUN-FROB-*>/
    - experiments/EXP-FROB-7d51ae/implementation/run.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
