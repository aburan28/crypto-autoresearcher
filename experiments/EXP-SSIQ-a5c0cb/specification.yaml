experiment:
  id: EXP-SSIQ-a5c0cb
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-SSIQ-90e07b
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  batch_id: null
  batch_id_note: >-
    Deliberately null. This is an unapproved draft written by an idea-generator
    session; assigning it to BATCH-006 would imply a dispatch decision only the
    Coordinator may make.
  title: >-
    The screen-threshold cost identity and its screen census: a zero-compute
    reproduction gate on E(theta, s, gamma), followed by a closed-list
    measurement of delta_E screens against a matched null on the four committed
    toy graphs

  objective: >-
    Decide two separable things, cheapest first. (1) SYMBOLIC: whether the cost
    identity E(theta, s, gamma) = (1/2 - 3theta/2)_+ + max(gamma, theta - s)
    reproduces the archived algorithm's exponent 1/3 at (1/3, 0, 1/3), this
    campaign's committed reading 3/8 at (1/4, 0, 1/4), and the frozen source's
    own parameter X = B^{1/2}(p/2)^{1/6} at threshold T = (p/2)^{1/3}. IF ANY
    OF THE THREE FAILS THE RUN STOPS AT STAGE 0 AND THE HYPOTHESIS IS
    WITHDRAWN. (2) EMPIRICAL, TOY TIER: whether any screen on the closed
    pre-registered list has selectivity exponent bounded away from zero with
    recall indistinguishable from p^{-o(1)}, measured on the four supersingular
    2-isogeny graphs with real delta_E labels already committed under
    RUN-SSIQ-a85692-b, against a matched random-subset null of identical size.

  what_this_is_not:
    - Not an algorithm, not an attack, and not a claim that any exponent below 1/3 is attained.
    - Not a claim that a screen exists. The identity states what a screen would have to be; the census measures a closed list and expects to find none.
    - Not a reopening of lever L1. EV-SSIQ-e43afd's CLOSED-IN-SCOPE verdict stands; this contract works in the rare tail below the structural bound, which that verdict does not cover.
    - Not a test of lever L4's descent branch, which is EXP-SSIQ-c45ea2's object.
    - Not a validation or refutation of Heuristic 1 as the frozen source states it. It touches only a CONDITIONED restatement, at toy scale.
    - Not a concrete-cost or security-parameter statement. Goal condition SC-3 forbids carrying concrete cost across the reduction cascade and nothing here does.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling:
    tier_symbolic: theory
    tier_measured: toy
    exact_scope_a_run_could_support: >-
      SYMBOLIC HALF: at most, that a stated cost identity reproduces three
      committed or textual values exactly and that its minimum over a stated
      admissible region with a free exact screen is 1/5. This is arithmetic over
      a proof and asserts nothing about any algorithm's existence.
      MEASURED HALF: at most, that on four supersingular 2-isogeny graphs with
      N in {203, 324, 478, 611} and real delta_E labels, a NAMED list of six
      screens has measured selectivity and recall as tabulated, each beside a
      matched random-subset null of identical size. A run CANNOT close lever L4,
      cannot establish that no screen exists, cannot support any exponent claim,
      and cannot support any statement about cryptographic parameters. Toy
      evidence is never crypto-scale evidence (AGENTS.md rule 7).

  scale_relevance:
    tier: toy
    justification: >-
      The SYMBOLIC half is scale-free: it is an identity about exponents and its
      three reproduction targets are exact. The MEASURED half is toy and does
      not transfer: at p <= 7333 the whole vertex set is smaller than the
      constants in the counting law it tests, so a screen that shows selectivity
      here is a candidate for a larger test and a screen that does not is closed
      only at this scale (rule 6). The specific transfer limit: the base rate
      p^{3theta/2-1/2} at theta = 0.25 and p = 7333 is about 2^{-3.3}, so the
      small-delta stratum contains roughly 60 of 611 vertices -- enough to
      measure a recall to about +/- 0.06 and not enough to resolve an exponent
      in p from four points without an anchor.
    correspondence: >-
      null. Instances are sampled directly by building the graphs; the frozen
      source's Deuring-correspondence sampling route (Section 4.2) is NOT used
      because it needs quaternion arithmetic this environment does not have, and
      that absence is an infrastructure fact recorded here rather than a design
      choice.

  environment_facts_measured_this_session:
    numpy: "2.4.6, imports successfully"
    sympy: "absent -- ModuleNotFoundError"
    sage: "absent"
    pari_gp: "absent"
    consequence: >-
      Every stage below is designed for pure Python plus numpy. NO STAGE MAY
      INSTALL A DEPENDENCY AS PART OF A RUN. A stage that turns out to need
      quaternion order arithmetic is an INFRASTRUCTURE REQUEST under AGENTS.md
      rule 5, is reported as an infrastructure outcome, and is never reported as
      a mathematical result. The session's angle brief records a disagreement
      between two prior sweeps about whether numpy is present in this container;
      the value above was measured directly in this session and supersedes both
      for this contract.

  inputs:
    primes: [2437, 3889, 5737, 7333]
    prime_provenance: >-
      Exactly the four primes recorded as usable_primes_for_fit in
      experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-b/raw-result.json. NO NEW
      PRIME IS ADDED and no new delta_E search is performed, consistent with
      this goal's own deferral (i) that new real search budget waits until the
      control-code defects are fixed.
    expected_graph_sizes: {2437: 203, 3889: 324, 5737: 478, 7333: 611}
    graph_size_check: >-
      Rebuilt vertex counts MUST equal the committed N exactly. Any mismatch is
      an invalidation of the rebuild, not a finding about the graphs.
    isogeny_degree: 2
    theta_grid: [0.10, 0.15, 0.20, 0.25, 0.30, 0.33333333]
    graded_L_over_T: [0.125, 0.25, 0.5, 0.75]
    screens:
      S1: "j in F_p"
      S2: "threshold on Tr(j) = j + j^p and on Nm(j) = j^{1+p}, both in F_p, at the median"
      S3: "Phi_l(j, j^p) = 0 for some prime l <= L, L in {2, 3, 5, 7}"
      S4: "count of primes l <= L with j^p in the l-neighbourhood of j, thresholded at its median"
      S5: "graph distance <= d from the F_p locus in the 2-isogeny graph, d in {1, 2, 3}"
      S6: "MATCHED NULL: a uniformly random vertex subset of the same size as the screen it is matched to"
    screen_list_is_closed: >-
      NO SCREEN OUTSIDE THIS LIST MAY BE ADDED AFTER ANY MEASUREMENT IS SEEN.
      Adding one requires a versioned protocol amendment with
      confirmatory_status exploratory_only, and its results may not be pooled
      with the confirmatory arm.
    master_seed: 20260805
    seed_derivation_rule: >-
      Every stochastic draw uses SHA-256 over the ASCII byte string
        "EXP-SSIQ-a5c0cb/v1" || "|" || label || "|" || decimal(p) || "|" ||
        decimal(counter)
      with the digest read as a big-endian unsigned integer. Labels are exactly:
      "null-subset", "bootstrap", "anchor-lattice". The counter starts at 0 and
      advances by one per digest consumed. A third party reproduces every
      instance bit-for-bit from (master_seed is unused for these streams by
      design -- the domain string carries the identity, so a change of seed
      cannot silently change the instances).
    builder: >-
      experiments/EXP-SSIQ-58b642/implementation/build_isogeny_graph.py at the
      commit recorded in the run manifest, invoked with the same parameters the
      committed run used. The builder's sha256 is recorded at setup by the
      Executor; THIS DRAFTING SESSION DID NOT COMPUTE IT and does not assert it.
    delta_labels: >-
      The real in-session delta_E labels produced by RUN-SSIQ-a85692-b. Their
      NORMALISATION IS RE-VERIFIED against
      experiments/EXP-SSIQ-a85692/implementation/compute_delta_e_v2.py in Stage
      1 before any comparison, per GD-6's standing repair; a mismatch is an
      invalidation.
    modular_polynomials: >-
      experiments/EXP-SSIQ-a85692/implementation/modpoly_data, used for screens
      S3 and S4. If the data does not cover l <= 7 at the required precision,
      those screens are recorded as NOT RUN with the reason -- never silently
      dropped and never replaced by a substitute screen.

  independent_variables:
    - threshold exponent theta
    - screen identity from the closed list
    - graded ratio L/T for the graded control
    - prime (equivalently N)

  arms_and_controls:
    treatment: >-
      For each prime and each theta on the grid, compute the true small-delta
      set D(theta) = {v : delta_v <= N^theta} from the committed labels, then
      for each screen S compute its admitted set A(S), the admitted fraction
      |A(S)|/N, and the recall |A(S) and D(theta)| / |D(theta)|.
    measured_null: >-
      S6. For each screen S and each theta, draw a uniformly random vertex
      subset of size exactly |A(S)| using the declared seed stream, and compute
      its recall. Repeat 2000 times to obtain the null recall distribution.
      FORCED VALUE, DERIVED BEFORE THE RUN: mean null recall = |A(S)|/N exactly,
      with hypergeometric spread. THE NULL CAN FAIL: if a screen's recall lies
      inside the null distribution, that screen carries no information about
      delta_E, and if the null's own mean departs from |A(S)|/N the sampler is
      broken.
    positive_control: >-
      S_EXACT(v) = [delta_v <= N^theta], computed from the committed labels.
      FORCED: recall exactly 1.000 and admitted fraction exactly the measured
      base rate, at every prime and every theta. IF THE PIPELINE DOES NOT RETURN
      1.000 FOR S_EXACT, THE INSTRUMENT IS BROKEN AND NO NEGATIVE RESULT MAY BE
      REPORTED FOR ANY SCREEN.
    graded_control: >-
      S_GRADED(L) = [delta_v <= (L/T) * N^theta] for L/T in
      {0.125, 0.25, 0.5, 0.75}. FORCED RECALLS, derived before the run from the
      counting law #{delta <= T} proportional to T^{3/2}: 0.0442, 0.125, 0.354,
      0.650. Monotone increasing. Report measured-versus-forced at all four
      points AND the monotonicity. A deviation above 0.15 in absolute recall at
      any point falsifies the counting law's applicability at this scale and
      voids the base-rate term of the identity there.
    nearby_object_control_ordinary: >-
      Apply the identity's reasoning to ORDINARY elliptic curves, where
      End(E) has rank 2, there is no Theorem 1.5 analogue, and the isogeny
      problem demonstrably does not have the cost the reasoning would predict.
      THE METHOD MUST BE SEEN TO FAIL THERE, and the failure is a required
      artifact. This is symbolic and costs nothing; if the reasoning transfers
      cleanly it has not identified the supersingular rank-3 trace-zero collapse
      as the load-bearing structure and both halves of the hypothesis are
      withdrawn.
    census_calibration_control: >-
      The auxiliary-target criterion log_p(det)/rank must return EXACTLY 1/3 for
      the target E^{(p)} (rank 3, determinant asymptotic to p) and EXACTLY 1/2
      for a generic supersingular target (rank 4, determinant asymptotic to
      p^2). A criterion returning the same value for both is measuring the
      apparatus and voids the census section entirely.
    ordering_control: >-
      The complete null arm, the graded control and the anchor computations are
      generated, analysed, committed and sha256-hashed BEFORE any candidate
      screen's recall is computed or looked at. The frozen decision rule is
      executed on the null arm first; if it emits the same label on the null as
      on a candidate, it discriminates nothing and must be rewritten before the
      candidate arms are read. Absence of the pre-treatment commitment is an
      invalidation.
    dead_control_check: >-
      GD-9's standing repair, EXECUTED rather than promised. For every control
      in this contract, exhibit at least one synthetic input on which it FAILS
      and one on which it PASSES, and commit both transcripts, BEFORE the
      control is applied to real data. A control with no exhibited failing input
      is not a control and is reported as such.
    comparability_policy: >-
      No comparison to EXP-SSIQ-4de240's alpha measurement, to EXP-SSIQ-58b642,
      or to any other contract's numbers is permitted inside this package. Those
      used different objects, different estimators and, in one case, a window
      this goal's instrument_calibration block records as biased by ~-0.36. Any
      cross-contract comparison requires a separately registered comparator
      naming both domains, both estimators and the expected relation.

  metrics:
    primary:
      - "G0a: symbolic value of E(1/3, 0, 1/3). Forced: exactly 1/3."
      - "G0b: symbolic value of E(1/4, 0, 1/4). Forced: exactly 3/8."
      - "G0c: X under the generalised Lemma 3.4 at T = (p/2)^{1/3}. Forced: exactly B^{1/2}(p/2)^{1/6}."
      - "G3: per screen, per prime, per theta -- the ratio (screen recall)/(matched-null mean recall), with a 2000-resample bootstrap CI."
      - "G2: graded-control measured recall against its forced value at four points, with monotonicity."
    secondary:
      - "G0d: minimum of E over the admissible region with gamma = 0 and s maximal. Forced: exactly 1/5 at theta = 1/5."
      - "G1: anchored exponent of the empirical Pr[delta <= T] in T, with the anchor object's recovered exponent reported beside it."
      - "G4: census criterion values for the two calibration cells and a verdict column for the seven census cells."
      - "G5: the ordinary-curve nearby-object control's output and the explicit statement that the method fails there."
      - "Per-screen evaluation cost in elementary operations, reported as the exponent gamma at each prime and as a fit across primes."
      - "Rebuilt vertex counts against the committed N; delta_E normalisation check transcript."
      - "Number of vertices in the small-delta stratum at each (prime, theta), so a reader can see the resolution the recall estimate actually has."

  heuristic_under_test: HEUR-SS-1
  heuristic_under_test_note: >-
    HEUR-SS-1 (the lower bound on the base rate) is the heuristic this contract
    can actually probe, through metric G1. HEUR-SS-2 (conditioned smoothness) is
    named by the same hypothesis but is NOT tested here -- it is
    IDEA-20260805-2d2c41's object and is listed in this contract's
    known_untested_dependencies so it cannot be mistaken for covered.
    HEUR-SS-5 (screening validity) is probed only through the census's two-cell
    calibration.

  known_untested_dependencies:
    - "HEUR-SS-2, conditioned smoothness. Untested here. Any E value quoted from this package carries that gap."
    - "The mixing bound n = O(log p) for the re-randomising walk, relayed via the frozen source from [37] and [6, Lemma 14], neither read. Not tested here."
    - "The matching lower bound in HEUR-SS-1 beyond what G1 can resolve at four primes."

  preregistered_prediction:
    quantity: >-
      The recall ratio (screen recall)/(matched-null mean recall) for each of
      S1-S5, and the graded control's recall at four ratios.
    formula: >-
      Null mean recall = |A(S)|/N exactly (hypergeometric). Graded forced recall
      = (L/T)^{3/2}, from #{delta <= T} proportional to T^{3/2}, i.e. the
      counting law whose exponent is derivation D1's.
    source: >-
      Derivation D1 as recorded in ledger/evidence/EV-SSIQ-e43afd.yaml
      observation O-5, and its independent lattice-point route in
      ledger/proposals/IDEA-20260805-2d2c41.yaml mechanism (1). The null's forced
      value is elementary and is derived in this contract.
    directional_prediction: >-
      S1 recall ratio far below 1 at every theta > 0 (it selects only
      delta = 1). S2 recall ratio indistinguishable from 1 -- it is a second
      null in all but name. S3 and S5 recall ratios above 1 by construction
      (they are exact partial detectors) but with admitted fractions too large
      to give s > 0. S4 is THE ONLY CANDIDATE WITH A MECHANISM and its
      pre-registered prediction is a ratio in [1.0, 2.0], i.e. below the
      interest threshold. PRE-REGISTERING THE NEGATIVE IS DELIBERATE: it makes a
      positive finding cost something to reach.

  stages_cheapest_first:
    - id: STAGE-0
      compute: zero
      terminating: true
      content: >-
        Re-read inputs/P13-WESOLOWSKI-2026/paper_fulltext.md lines 133-135,
        154-158, 160, 162-175, 177-185, 193-220 IN FULL (GD-6's standing repair:
        a review re-reads every cited prior artefact in full, not just its
        headline). Re-derive the threshold generalisation of Lemma 3.4. Compute
        G0a, G0b, G0c, G0d. IF ANY OF G0a/G0b/G0c FAILS, STOP AND REPORT; the
        hypothesis is withdrawn and no later stage runs. THIS IS THE STAGE THAT
        CAN END THE WHOLE LINE, AND IT COSTS NOTHING.
    - id: STAGE-1
      compute: seconds
      terminating: true
      content: >-
        Rebuild the four graphs; check vertex counts against the committed N;
        re-verify the delta_E normalisation against compute_delta_e_v2.py; count
        F_p-rational vertices directly. A normalisation mismatch STOPS the run
        as an invalidation.
    - id: STAGE-2
      compute: minutes
      terminating: false
      content: >-
        The dead-control check: exhibit each control passing and failing on
        synthetic inputs, and commit the transcripts. Then the null arm and the
        graded control, committed and hashed before any candidate screen runs.
    - id: STAGE-3
      compute: minutes
      terminating: false
      content: >-
        Candidate screens S1-S5 across primes and theta; recall ratios with
        bootstrap CIs; per-screen evaluation cost.
    - id: STAGE-4
      compute: zero
      terminating: false
      content: >-
        The census section: the two calibration cells, the seven cell verdicts,
        and the ordinary-curve nearby-object control. Symbolic; any cell needing
        quaternion arithmetic is recorded as an infrastructure request.

  replication:
    seeds: [20260805]
    seed_note: >-
      One master domain string, with the per-stream derivation rule above. The
      stochastic content is the null subsets and the bootstrap resamples; the
      treatment arms are DETERMINISTIC given the graphs and labels, so seed
      replication tests the null sampler rather than the finding. A second
      independent seed (20260806) is run for the null arm ONLY, and the two null
      distributions must agree within their own spread; disagreement is a
      sampler defect and an invalidation.
    independent_instances: 4

  budget:
    maximum_runs: 1
    stage0_wall_clock_seconds: 3600
    total_wall_clock_seconds: 10800
    total_cpu_hours: 3
    maximum_memory_gb: 8
    maximum_workers: 1
    no_network: true
    budget_allocation_reading: >-
      GD-7's standing repair, applied. THE OPERATIVE READING IS CUMULATIVE, NOT
      PER-ITEM: the four primes are processed in ascending order and the run
      continues while the CUMULATIVE elapsed time is below
      total_wall_clock_seconds minus a 900-second reserve for artifact writing.
      An individual per-prime cap is NOT used, because an ascending-prefix
      selection rule that already discards the expensive tail must not reserve
      an equal share for items it will never reach. Both readings are stated
      here so a pre-freeze reviewer can check the code against the operative
      one, which is what GD-7 requires.

  stopping_rules:
    - Do not execute at all unless separately approved, frozen, archived and authorized by the Coordinator. status is review_required and approved_by is absent.
    - Stop at STAGE-0 if any of G0a, G0b, G0c fails. Report the failure; run no further stage.
    - Stop at STAGE-1 if the delta_E normalisation check fails or a rebuilt vertex count differs from the committed N.
    - Stop before STAGE-3 if the null arm and graded control have not been committed and hashed.
    - Stop before STAGE-3 if the positive control S_EXACT does not return recall exactly 1.000.
    - Stop before STAGE-3 if any control lacks an exhibited failing synthetic input.
    - Stop on cumulative budget exhaustion, reporting exactly which primes and which screens were covered.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any screen added to the list after any measurement is observed.
    - Any recall reported without its matched-null recall beside it.
    - Any exponent reported without the anchor object's recovered exponent beside it.
    - Any comparison to another contract's numbers without a separately registered comparator.
    - Any dependency installed during the run.
    - Any use of the committed delta_E labels before the normalisation check has passed and been recorded.

  decision_rule:
    branches:
      - id: SYMBOLIC-FAIL
        condition: "Any of G0a, G0b, G0c fails at STAGE-0."
        disposition: >-
          The identity is not an extension of the archived algorithm or of this
          campaign's committed curve. H-SSIQ-90e07b is withdrawn. This is a
          mathematical result and is reported as one.
      - id: DATA-UNAVAILABLE-BLOCKED
        condition: >-
          The graphs cannot be rebuilt, the delta_E normalisation check fails,
          the modular-polynomial data does not cover l <= 7, or a required
          dependency is absent.
        disposition: >-
          INFRASTRUCTURE OUTCOME under AGENTS.md rule 5. Never negative
          mathematical evidence and never merged into CONTROL-FAILURE-VOID.
          DECLARED AS A DISTINCT BRANCH, per GD-6's standing repair that a
          successor contract names a DATA-UNAVAILABLE/BLOCKED branch separate
          from a control-failure void wherever an external dataset or a prior
          run's artifacts are load-bearing.
      - id: CONTROL-FAILURE-VOID
        condition: >-
          S_EXACT does not return recall 1.000, or the null sampler's mean
          recall departs from |A(S)|/N beyond its own spread, or any control
          lacks an exhibited failing input, or the graded control deviates above
          0.15 at any point.
        disposition: >-
          The instrument cannot support any verdict about any screen. No
          negative may be reported. Distinct from DATA-UNAVAILABLE-BLOCKED and
          from SYMBOLIC-FAIL.
      - id: NO-SCREEN-DETECTED
        condition: >-
          All controls pass and every candidate screen returns a recall ratio
          whose bootstrap CI lower bound is below 2.0, or has selectivity
          exponent s with CI including 0, at three or more of the four primes.
        disposition: >-
          A SCOPED NEGATIVE AND A FIRST-CLASS DELIVERABLE. It closes the six
          named screens at N <= 611 with the tested boundary stated, and it does
          NOT close lever L4. Forward guidance is MANDATORY and must name: (i)
          screens using neighbourhoods of radius beyond the reachable d; (ii)
          screens using modular polynomials at degrees this scale cannot reach;
          (iii) the descent branch, which EXP-SSIQ-c45ea2 tests; (iv) any
          census cell left OPEN. A negative without that statement HAS NOT
          FINISHED.
      - id: SCREEN-DETECTED
        condition: >-
          All controls pass and some candidate screen has recall-ratio CI lower
          bound at or above 2.0 with selectivity exponent s CI lower bound above
          0, at three of the four primes.
        disposition: >-
          A toy-scale detection ONLY. By the identity it would imply an exponent
          below 1/3 if the same (s, gamma) held asymptotically, WHICH THIS RUN
          CANNOT ESTABLISH. It is therefore routed immediately to independent
          review-breakthrough at max effort under AGENTS.md rule 12 BEFORE any
          record asserts anything, and the evidence record may not assert above
          toy tier.

  success_criterion: >-
    The package succeeds when: STAGE-0 returns exactly 1/3, exactly 3/8 and
    exactly B^{1/2}(p/2)^{1/6}; the delta_E normalisation check passes; every
    control has an exhibited failing and passing synthetic input; the positive
    control returns recall 1.000 at every prime and theta; the graded control's
    four measured recalls lie within 0.15 of their forced values and are
    monotone; the null arm is committed and hashed before any candidate screen
    is read; and a complete six-screen by four-prime by six-theta table of
    recall ratios with bootstrap CIs is produced together with the census
    section and the ordinary-curve control. SUCCESS IS A COMPLETE, CONTROLLED
    READOUT -- NOT A POSITIVE FINDING. NO-SCREEN-DETECTED is a successful run.

  falsification_criterion: >-
    H-SSIQ-90e07b's symbolic half is falsified by any failure of G0a, G0b or
    G0c, or by an exhibited use of the bound (p/2)^{1/3} inside Lemma 3.4's
    proof beyond the two linear places the mechanism identifies. Its measurable
    half (H-A2, stated as a negative) is falsified by the SCREEN-DETECTED
    branch. HEUR-SS-1 is falsified by G1 landing outside [1.35, 1.65] with an
    anchored estimator. HEUR-SS-5 is falsified by the census calibration failing
    to separate 1/3 from 1/2. The whole hypothesis is withdrawn if the
    ordinary-curve nearby-object control shows the reasoning transferring
    cleanly to a case where its conclusion is known false.

  infrastructure_failure_disposition: >-
    A timeout, crash, missing dependency, absent modular-polynomial degree, or
    unbuildable graph is reported under DATA-UNAVAILABLE-BLOCKED as an
    INFRASTRUCTURE SIGNAL and is NEVER negative mathematical evidence about
    H-SSIQ-90e07b, about any screen, or about lever L4 (AGENTS.md rule 5). It is
    also never merged into CONTROL-FAILURE-VOID: GD-6 records this campaign
    absorbing an unforeseen outcome category into a label reserved for a
    materially different situation, and the two branches are kept apart here for
    exactly that reason.

  required_artifacts:
    - Frozen approved specification and a freeze receipt binding its sha256.
    - manifest.yaml conforming to the run-manifest schema, including the RUN_REQUIRED_TOP keys `code` and `inputs` (GD-5's standing repair -- required_artifacts are stated against the schema, not invented here).
    - command.txt, environment.json, stdout.log, stderr.log.
    - STAGE-0 derivation transcript with the three forced values and the lines re-read.
    - Graph rebuild transcript with vertex counts against the committed N, and the delta_E normalisation check.
    - Dead-control transcripts: each control's exhibited passing and failing synthetic input.
    - Null-arm commitment: the null recall distributions and their sha256, timestamped before any candidate screen output.
    - raw-result.json with the full screen table, the graded table, the census table, and per-stage timings.
    - The ordinary-curve nearby-object control's written output.
    - Execution report naming the terminal branch and, if any stage did not run, exactly which and why.

  approval_requirements:
    - Independent pre-freeze Red Team review, per this goal's REC-5 standing mitigation and GD-4's repair.
    - That review must verify by DIRECT CODE READING that every control's comparison logic is implemented, not infer it from the presence of a report block (GD-9's standing repair).
    - That review must re-read every cited prior artefact IN FULL, including RUN-SSIQ-a85692-b's execution report and the frozen source lines listed in STAGE-0 (GD-6's standing repair).
    - That review must derive BOTH the individual-cap and cumulative-prefix readings of the budget rule and confirm the operative one against the actual code (GD-7's standing repair).
    - Coordinator approval, freezing and archival as a separate act; this draft is not edited by the reviewer.

  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved and only the Coordinator may approve it (AGENTS.md rule 1).

  assigned_to: executor
