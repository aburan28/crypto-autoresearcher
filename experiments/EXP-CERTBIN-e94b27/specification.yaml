# =============================================================================
# EXP-CERTBIN-e94b27 -- RC-1 (DEC-20260923-f25b97 NA-3; KN-OPEN-3c8f51 item C,
# resolution criterion 1). Degree-5 and iterated-degree-4 (mutant) closures on
# the 62 archived unsatisfiable F-S3 attempts of RUN-CERTBIN-3b7e05 that plain
# D <= 4 Macaulay did not refute, plus 62 archived satisfiable controls and 62
# + 62 archived null controls. ZERO NEW SAMPLING. Every counted refutation
# carries an explicit certificate verified by independent code.
#
# NEW EXPERIMENT, NOT AN AMENDMENT OF EXP-CERTBIN-4e92d7: ruling and
# citations in `new_contract_not_amendment` below and in DEC-20260924-8e2f47.
#
# ID PROVENANCE (disclosed): EXP-CERTBIN-e94b27 and RUN-CERTBIN-c417e0 were
# minted WITHOUT A SHELL (random 6-hex tokens, grep checked only). The design
# snapshot TASK-20260924-d3a90c runs allocate_id.py --check on both first.
#
# CLAIM TIER: toy. A refutation-degree measurement at n = 17. No cost claim;
# oracle A and parallel rho dominate. sota_delta zero.
# =============================================================================
experiment:
  id: EXP-CERTBIN-e94b27
  version: 1
  hypothesis_id: H-CERTBIN-5e71c9
  hypothesis_claims_tested: [C1]
  question_id: RQ-CERTBIN-836ce2
  question_ids: [RQ-CERTBIN-836ce2]
  proposal_id: IDEA-20260923-5d0b8e
  source_decision: DEC-20260923-f25b97 (RC-1, NA-3)
  open_problem_id: KN-OPEN-3c8f51
  source_experiment: EXP-CERTBIN-4e92d7
  source_run: RUN-CERTBIN-3b7e05
  run_id: RUN-CERTBIN-c417e0
  goal_ids: []
  goal_ids_note: No goal head is edited (DEC-20260922-61cdc1 NA-2 pending). There is no batch queue for this lane.
  title: >-
    Is plain Macaulay's "not reached at D <= 4" a closure artifact? The
    degree-4 mutant closure W_4, the degree-5 Macaulay closure M_5 and (on the
    residual) the degree-5 mutant closure W_5 on the 62 archived unrefuted
    unsatisfiable m = 2 S_3 attempts at n = 17, with satisfiable and
    same-support null controls and independently verified certificates.
  status: approved
  frozen: true
  execution_authorized: true
  execution_authorized_note: >-
    In fact only after the design snapshot TASK-20260924-d3a90c verifies
    against Git. Until then the executor card TASK-20260924-41c7be may not
    launch.
  assigned_to: executor
  approved_by: coordinator
  approved_at: '2026-09-24'
  approval_decision: DEC-20260924-8e2f47
  approval_basis: >-
    Standing user authorization (AGENTS.md, 2026-09-06), plus the user's
    explicit approval of RC-1 on 2026-09-24 as relayed by the dispatching
    session. The readiness finding is DEC-20260924-8e2f47's own. Approval
    asserts nothing about whether E-A or E-G holds.

  new_contract_not_amendment:
    ruling: NEW EXPERIMENT. EXP-CERTBIN-4e92d7 is not amended.
    basis:
      - >-
        An amendment changes a frozen protocol for runs under that contract
        and must state "why the original protocol cannot proceed unchanged"
        (docs/task-lifecycle.md, "Protocol amendments"; .claude/skills/
        design-experiment/SKILL.md, Rules). EXP-CERTBIN-4e92d7's protocol
        proceeded unchanged and COMPLETED (DEC-20260923-f25b97
        official_transitions: approved -> completed). RC-1 changes nothing in
        it; it asks a different question (refutation degree) with a different
        instrument (W_D, M_5, certificates).
      - >-
        A post-completion amendment adding a measurement to a contract whose
        outcomes are known is the pattern AGENTS.md and agents/coordinator.md
        forbid ("change success criteria after observing outcomes"). DEC-
        20260923-f25b97 applied the same rule to RC-2: "preregistered in a new
        contract. It is never applied retroactively to RUN-CERTBIN-3b7e05",
        and F-J3-2: "No protocol_amendment is written after data".
      - >-
        EXP-CERTBIN-4e92d7's maximum_runs = 2 reserves the second run for an
        INFRASTRUCTURE re-run only (its budget_note). A new scientific run
        under it would contradict its frozen budget.
      - >-
        Run records are immutable (AGENTS.md core rule 4). RC-1's outputs
        cannot live in RUN-CERTBIN-3b7e05; they are a new run reading that
        run's archived bytes as hash-bound INPUTS, which is additive.
      - >-
        H-CERTBIN-a73f1c's boundary excludes D > 4 (HEUR-CERTBIN-TS4
        validation_scope_note: "The full test belongs to later stages"), and
        DEC-20260923-f25b97 NA-3 asks for "a small frozen contract".

  objective: >-
    Decide, on the fixed archived set U62, between E-A (the 16% is a
    plain-Macaulay closure artifact: W_4 refutes >= 56 of 62) and E-G (a
    genuine refutation degree above 4: W_4 refutes <= 6), and whether every
    unsatisfiable attempt at the Stage-1 cell is refuted at D <= 5. Check
    soundness on satisfiable controls and S_3-specificity against same-support
    nulls under the identical closures. Output feeds DEC-20260923-f25b97 NA-5
    (the n = 19 cell is designed only if the D <= 5 picture is clean).

  claim_tier_and_scope:
    claim_tier: toy
    statement: >-
      Refutation-degree measurement on archived instances of one cell: n = 17,
      f = t^17 + t^3 + 1, m = 2, l = 9, polynomial V = {deg < 9}, curve
      A = 97044, B = 126251 (#E = 4 * 32603), subgroup targets, under the
      closures M_4, W_4, M_5 and W_5 as defined below.
    sota_delta: zero on every ECDLP cost axis
    dominated_by: >-
      Per attempt at m = 2: oracle A (2^9 = 512 quadratic root-findings)
      decides satisfiability and returns the solutions; it dominates every
      closure measured here (a D = 5 elimination is 16796 x 12616 over F_2).
      For the DLP: parallel Pollard rho (about 160 group operations at
      q = 32603). FES GPU exhaustive search (KN-LIT-287) and WDSat not
      compared.
    certificate_kind: unsatisfiability_certificate
    certificate_note: >-
      Each counted refutation carries a set C of pairs (mu, k) with
      sum_{(mu,k) in C} mu*f_k = 1 in B, verified by code that imports nothing
      from the closure engine. These are instrument certificates of
      unsatisfiability of one Boolean system each. No discrete logarithm and
      no relation is claimed.
    affected_vs_safe: No deployed or standardized curve is touched or affected.

  inputs:
    source_run_dir: experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05/
    files:
      - experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05/curve.json
      - experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05/targets-F-S3.jsonl.gz
      - experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05/checkpoint/p1-instances.json.gz
      - experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05/targets-F-AFF-1.jsonl.gz
      - experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05/targets-F-NULLF2.jsonl.gz
      - experiments/EXP-CERTBIN-4e92d7/impl/ (copied, never imported or edited; see object.reuse)
    hash_binding: >-
      Before any computation the executor records the sha256 of every input
      file and checks it against the TASK-20260923-c2e57b snapshot receipt
      (coordination/design/certbin-trace-20260923-5d0b8e/archives/
      TASK-20260923-c2e57b/snapshot-receipt.json). Any mismatch is a STOP
      (C-SRC).

  object:
    ring: >-
      B = F_2[v_0..v_17]/(v_i^2 + v_i); B_{<=d} the span of multilinear
      monomials of degree <= d. f_0..f_16 are the descended equations of
      S_3(x_1, x_2, x_R) exactly as EXP-CERTBIN-4e92d7 object.descended_system
      defines them (x_1 = sum_{j<9} v_j t^j, x_2 = sum_{j<9} v_{9+j} t^j).
    reuse: >-
      The executor MAY COPY (not import) gf2n.py, curve.py, macaulay.py and
      elim.py from experiments/EXP-CERTBIN-4e92d7/impl/ into this experiment's
      impl/, generalizing D to 5. impl/impl-provenance.json records each copied
      file's source sha256 and a unified diff of every change. These files
      passed J1 and J6/J7 of REVIEW-CERTBIN-20260923-c51f07 at D in {3, 4}.
    macaulay_M_D: >-
      Identical conventions to EXP-CERTBIN-4e92d7 (row index = mu_index * 17 +
      k; mu by degree ascending then ascending sorted index tuple; columns in
      descending degrevlex, constant LAST; zero rows retained). D = 4:
      2924 x 4048. D = 5: 16796 x 12616. "1 in R_D" iff the constant column is
      a pivot column. The pivot rule is the Stage-1 rule; the measured
      quantity (row-space membership) does not depend on it.
    mutant_closure_W_D: >-
      W_D = the least F_2-subspace of B_{<=D} that (i) contains every row of
      M_D and (ii) contains the multilinear reduction of v_j * g for every
      g in W_D with deg g <= D - 1 and every j in 0..17. Computed by
      iteration: W^(0) = rowspace(M_D); W^(i+1) = W^(i) + span{v_j * b :
      b in a basis of W^(i) intersected with B_{<=D-1}, j = 0..17}; stop at the
      first i with dim W^(i+1) = dim W^(i). A basis of W^(i) intersected with
      B_{<=D-1} is the set of RREF rows (descending degrevlex columns) whose
      leading monomial has degree <= D - 1. W_D is unique and independent of
      product order (least fixpoint). "1 in W_D" iff the RREF of W_D contains
      the row 1. Record per instance: iterations to the fixpoint, final
      dimension, the iteration at which 1 first appears, and dim(W_D
      intersected with B_{<=d}) for d = 0..D.
    closures_run:
      - 'M_4: baseline only (C-BASE), on every instance set'
      - 'W_4: on U62, S62, C20, N-AFF62, N-F262'
      - 'M_5: on U62, S62, N-AFF62, N-F262'
      - >-
        W_5: ONLY on (i) every U62 instance refuted by neither W_4 nor M_5;
        (ii) the 10 lowest-idx S62 instances (PS1 at W_5); (iii) up to the
        10 lowest-idx instances of each null set refuted by neither W_4 nor
        M_5. Per-instance watchdog 14,400 s; an expiry labels that instance
        UNDETERMINED(budget) for W_5, never "not refuted".
    certificate_format: >-
      certificates.jsonl.gz, one line per (instance, closure) refutation:
      instance key, closure, and C as a sorted list of pairs (mu as a sorted
      tuple of variable indices, k). The claim is sum_{(mu,k) in C} mu*f_k = 1
      in B. The executor obtains C by provenance tracking or by any other
      method; the verifier does not care how. If C cannot be produced within
      the memory cap and per-instance watchdog, the executor may instead emit
      a straight-line certificate (a DAG whose nodes are Macaulay rows
      (mu, k), products v_j * (node) and XORs of nodes, with a designated
      output), and the verifier re-executes it. A refutation with neither
      form is UNCERTIFIED and NOT counted.
    verifier: >-
      experiments/EXP-CERTBIN-e94b27/verifier/verify_cert.py, run as a
      SEPARATE PROCESS after the closures. It imports nothing from impl/ and
      nothing from EXP-CERTBIN-4e92d7/impl/. It rebuilds f_0..f_16 from
      (A, B, x_R) (or from the archived null coefficients) using its own
      F_{2^17} schoolbook arithmetic and its own S_3 expansion, multiplies and
      XORs in B with its own monomial arithmetic, and checks the result is
      exactly the constant 1. Output: certificate-verification.json (per
      certificate: verified true/false, |C|, max deg mu).

  instance_sets:
    rule_note: >-
      Every set is fixed by a deterministic rule on archived records. No
      randomness, no seed. The expected counts are from EV-CERTBIN-6c3e0a;
      a different archived count is a STOP (contract defect), not an
      adjustment.
    U62: >-
      Every F-S3 test-target record of RUN-CERTBIN-3b7e05 with D = 4,
      stratum "unsat" and one_in_R false. Expected exactly 62 (all also have
      one_in_R false at D = 3).
    S62: The 62 lowest-idx F-S3 test targets with stratum "sat" (non-degenerate).
    C20: The 20 lowest-idx F-S3 test targets with stratum "unsat" and one_in_R true at D = 4 (monotonicity and baseline control).
    N-AFF62: >-
      The 62 lowest-idx non-degenerate F-AFF-1 test targets with stratum
      "unsat" (archived one_in_R false at D = 4 is expected for all; F-AFF-1
      had 0/115). Instance = A0 + sum_j r_j Aj from the archived A0_hex/Aj_hex.
    N-F262: >-
      The 62 lowest-idx F-NULLF2 test targets with stratum "unsat" (0/138 at
      D = 4). Instance = the archived per-target E_hex.
    missing_field_rule: >-
      If p1-instances.json.gz lacks a needed field (A0_hex, Aj_hex or E_hex),
      the executor regenerates it from the frozen EXP-CERTBIN-4e92d7 seed with
      numpy 2.4.6 (DEC-20260923-4d7a19 R-2) and requires per-idx agreement of
      s and stratum with the archived records. Any disagreement is a STOP.

  # ---------------------------------------------------------------------------
  # CONTROLS -- every control has a stated FAIL condition (F-J2-2/3/4 fixes)
  # ---------------------------------------------------------------------------
  controls:
    - id: C-SRC
      what: Input files hash-bound to the TASK-20260923-c2e57b receipt.
      fails_if: any sha256 differs. STOP before phase 1.
    - id: C-SELF
      what: >-
        Before phase 1, seed S_selftest = 2026092430099: modulus
        irreducibility; field axioms on 10^4 triples; S_3 against point
        addition on 10^3 pairs; descended equations against direct F_{2^17}
        evaluation on 10^3 (v, x_R); M_5 rows against naive multiplication on
        50 random rows; W_D on 5 random small Boolean systems (6 variables)
        against a brute-force fixpoint.
      fails_if: any item fails. STOP (INV-1).
    - id: C-FIX
      what: M_4 is 2924 x 4048 and M_5 is 16796 x 12616.
      fails_if: any dimension differs. STOP (INV-1).
    - id: C-BASE
      what: >-
        Baseline reproduction (the KN-TECH-080 fixture). For every instance of
        U62, S62, C20, N-AFF62 and N-F262, the rebuilt M_4 and M_3 give the
        archived rank_4, rank_3 and "1 in R_D" flags of RUN-CERTBIN-3b7e05.
      fails_if: any per-instance mismatch. The run is void (INV-3).
    - id: C-ORACLE
      what: >-
        Oracle B (exhaustive 2^18) is re-run on every instance of every set,
        and oracle A on every curve-algebra instance.
      fails_if: >-
        any disagreement with the archived s or stratum. Arm-dependent
        metrics are void (INV-4).
    - id: C-MONO
      what: >-
        Monotonicity, a theorem: on C20, 1 is in W_4 for all 20 (M_4 is
        contained in W_4); on every instance, every closure that ran is
        consistent with M_4 <= W_4 <= W_5 and M_5 <= W_5 (a refutation by a
        smaller closure implies one by every larger closure that ran).
      fails_if: any violation. The run is void (INV-3).
    - id: C-PS1
      what: >-
        Soundness on S62: no satisfiable instance is refuted by W_4 or M_5
        (all 62) or by W_5 (10).
      fails_if: >-
        any refutation of a satisfiable instance. The INSTRUMENT is falsified
        and the run is void (INV-5). If its certificate VERIFIES, the arm label
        is wrong instead, and INV-4 applies too.
    - id: C-CERT
      what: >-
        Every refutation the closures report on any set is submitted to the
        verifier. The counted metrics use VERIFIED refutations only.
      fails_if: >-
        any submitted certificate fails verification. The closure or the
        certificate extraction is wrong: MR1-MR4 are void (INV-6). An
        UNCERTIFIED refutation is not a failure; it is reported and not
        counted.
    - id: C-VERIFIER
      what: >-
        The verifier's own f_0..f_16 equal the closure engine's E(r) on every
        curve-algebra instance, and the verifier rejects 20 corrupted
        certificates (one pair removed, or one k changed) built by the
        executor from verified ones.
      fails_if: any construction disagreement, or any corrupted certificate accepted. INV-6.
    - id: C-NULLS
      what: >-
        The null sets run through the identical closure code path (the sha256
        of the closure module is recorded per set). Each null instance
        satisfies its structural identity: F-AFF-1 instances equal
        A0 + sum_j r_j Aj recomputed two ways; F-NULLF2 supports lie within
        the archived union support U_k.
      fails_if: >-
        a code-path hash differs between sets, or a structural identity
        fails. The null comparisons (DR-4) are void.
    - id: C-DET
      what: >-
        Determinism: M_5 and W_4 are recomputed in a SEPARATE process on the
        10 lowest-idx U62 instances and the 5 lowest-idx S62 instances.
      fails_if: >-
        any difference in rank_5, "1 in X", W_4 dimension or iteration count.
        The run is void (INV-7).

  independent_variables:
    - instance set (U62, S62, C20, N-AFF62, N-F262)
    - closure (M_4 baseline, W_4, M_5, W_5 on the residual)

  metrics:
    primary:
      - id: MR1
        name: w4_refuted_U62
        definition: >-
          a = #{U62 : a VERIFIED certificate for 1 in W_4}, with a
          Clopper-Pearson 95% interval computed in exact arithmetic (RC-3).
      - id: MR2
        name: m5_refuted_U62
        definition: >-
          b = #{U62 : VERIFIED certificate for 1 in R_5}, with CP95.
      - id: MR3
        name: refuted_at_D_le_5_U62
        definition: >-
          r = #{U62 : VERIFIED refutation by W_4, M_5 or W_5}. Per instance, the
          closure label: W4 (and M5 or not), M5-only, W5-only, none,
          UNDETERMINED(budget), UNCERTIFIED.
      - id: MR4
        name: null_refutation_rates
        definition: Per null set and per closure (W_4, M_5, W_5 where run), the verified refutation count out of the set size, with CP95.
      - id: MR5
        name: soundness_and_certificates
        definition: C-PS1 counts; certificates submitted, verified, failed, uncertified, per set and closure.
    secondary:
      - The 2 x 2 table (W_4 refuted?) x (M_5 refuted?) on U62 and on each null set.
      - 'The plain-Macaulay D* distribution of the F-S3 unsat arm extended to D = 5: {4: 324, 5: b, "> 5": 62 - b} (a reading for HEUR-CERTBIN-TS4 of H-CERTBIN-a73f1c; no verdict on it).'
      - 'Combined unsat-arm rates at the Stage-1 cell: W_4: (324 + a)/386; any closure at D <= 5: (324 + r)/386. The 324 are inherited from RUN-CERTBIN-3b7e05 through monotonicity (checked on C20).'
      - Per instance, the W_4 iteration at which 1 first appears; final dim W_4; dim(W_4 intersected with B_{<=d}), d = 0..4; whether the linear consequence ell of EV-CERTBIN-6c3e0a O-11 is in W_4 intersected with B_{<=1}.
      - Certificate sizes |C| and max deg mu per closure.
      - Wall time and peak RSS per closure and set (reported, not a primary unit).
    primary_unit: verified refutations (counts of instances)

  preregistered_prediction:
    quantity: The predictions PA-1 to PA-3 of H-CERTBIN-5e71c9 (C1).
    formula: >-
      E-A: a >= 56. E-G: a <= 6. CLEAN: r = 62; NEAR-CLEAN: 59 <= r <= 61;
      RESIDUE: r <= 58. Soundness: 0 refuted satisfiable controls.
    source: >-
      H-CERTBIN-5e71c9, fixed before any W_D or M_5 value exists in the
      program. Semi-regular reference points (derived there): D_reg = 5 for
      17 quadratics in 18 Boolean variables and for 16 in 17.
  heuristic_under_test: null
  heuristic_under_test_note: >-
    C1 is an exact closure measurement on fixed instances; no heuristic is
    tested. HEUR-CERTBIN-TS4 (H-CERTBIN-a73f1c) is only read (secondary).
  scale_relevance:
    tier: toy
    justification: >-
      n = 17, one curve, one V, archived instances. Nothing transfers to n = 19
      (KN-OPEN-3c8f51 item B) or to other curves (EXP-CERTBIN-3f06d1) without
      measurement.
    correspondence: null
  tail_checks:
    - >-
      EXACT ARITHMETIC (RC-3). Every binomial interval and tail is computed
      with exact integer / rational arithmetic (math.comb and fractions) or
      with log-space summation at >= 50 significant digits (mpmath), and
      reported as log10. Floating-point survival functions are never used for
      a tail below 1e-12.
    - >-
      Null-versus-S_3 separation at each closure (DR-4) uses exact CP95
      bounds; no asymptotic test is quoted.

  replication:
    seeds: [2026092430099]
    seeds_note: S_selftest only. No stream draws an instance; all instances are archived.
    independent_instances: 268
    plan: >-
      Within-run: two closures of different kind (W_4, M_5) on the same
      instances, the C-DET separate-process re-run, and the null sets.
      Cross-curve replication of the rate itself is EXP-CERTBIN-3f06d1.

  # ---------------------------------------------------------------------------
  # DECISION RULES (fixed now; applied mechanically)
  # ---------------------------------------------------------------------------
  decision_rules:
    - id: RC1-DR-1
      rule: >-
        Question C at D = 4, on U62, using verified refutations only:
        "ARTIFACT (predominant)" iff a >= 56; "GENUINE D*_W > 4 (predominant)"
        iff a <= 6; otherwise "MIXED", reported with a and its CP95. E-A is
        FALSIFIED iff a <= 31. E-G is FALSIFIED iff a >= 32.
    - id: RC1-DR-2
      rule: >-
        D <= 5 completeness on U62. Compute the label twice: L1 with every
        UNDETERMINED(budget) or UNCERTIFIED instance counted as not refuted,
        and L2 with those instances excluded from the denominator. Labels:
        CLEAN iff all counted instances are refuted; NEAR-CLEAN iff at most 3
        are not; RESIDUE otherwise. If L1 and L2 differ, the verdict is
        "UNDETERMINED (budget or certification)", with both labels shown.
        The residue is listed by idx.
    - id: RC1-DR-3
      rule: >-
        Plain-Macaulay reading: b and the 2 x 2 table are reported. "M_5
        SUFFICES" iff b = 62; otherwise the count. Descriptive; no verdict on
        TS4.
    - id: RC1-DR-4
      rule: >-
        S_3-specificity per closure X in {W_4, M_5}: "S_3-SPECIFIC at X" iff
        the CP95 lower bound of the U62 rate exceeds the CP95 upper bound of
        EACH null set's rate; "NOT DISTINGUISHED at X" otherwise. Both null
        sets are, like U62, unsatisfiable instances that M_4 does not refute,
        so the comparison is like for like.
    - id: RC1-DR-5
      rule: >-
        Instrument: C-PS1, C-CERT, C-MONO, C-BASE, C-VERIFIER, C-DET must pass.
        Any failure applies its invalidation rule; no DR-1..DR-4 verdict is
        then issued.
    - id: RC1-DR-6
      rule: >-
        NA-5 gate (DEC-20260923-f25b97), recorded, not decided here: the
        executor reports whether RC1-DR-2 returned CLEAN or NEAR-CLEAN. The
        Coordinator decides NA-5 after review.
    - id: RC1-DR-7
      rule: Primary verdicts are RC1-DR-1 and RC1-DR-2 on U62. Everything else is secondary.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    watchdog_seconds: 172800
    total_cpu_hours: null
    maximum_memory_gb: 3
    maximum_runs: 2
    maximum_workers: 1
    budget_note: >-
      CERTBIN is ECC; research time is unbudgeted (CLAUDE.md rule 11). The run
      watchdog (48 h, with checkpoint and --resume) and the per-instance W_5
      watchdog (14,400 s) are machine protection; expiry is never a result.
      maximum_runs = 2: one run plus one re-run after an INFRASTRUCTURE
      failure, the failed attempt retained. Memory cap 3 GB (the 4-core, 15 GB
      machine runs up to three CERTBIN executors at once; see
      DEC-20260924-8e2f47 concurrency).
    dominant_cost: >-
      M_5 eliminations (16796 x 12616 over F_2, about 40 s each by scaling
      the Stage-1 D = 4 timing) on about 250 instances, and W_5 on the
      residual (up to about 30 min per instance). Estimate only.

  stopping_rules:
    - id: SR-1
      rule: Instance sets are fixed by rule. None is extended, trimmed or reordered after any output.
    - id: SR-2
      rule: C-SRC, C-SELF or C-FIX failure stops the run before phase 1. The failed attempt is retained.
    - id: SR-3
      rule: >-
        Watchdog expiry, a crash or an out-of-memory event checkpoints (one
        checkpoint per closure per set) and resumes with --resume. It is never
        a result. A per-instance W_5 expiry labels that instance
        UNDETERMINED(budget).
    - id: SR-4
      rule: No D = 6 closure is computed in this contract, whatever the residue.

  invalidation_rules:
    - {id: INV-1, rule: 'C-SELF or C-FIX failure: the run is void (stop).'}
    - {id: INV-2, rule: 'C-SRC failure: the run is void (stop).'}
    - {id: INV-3, rule: 'C-BASE or C-MONO failure: the run is void.'}
    - {id: INV-4, rule: 'C-ORACLE disagreement: every arm-dependent metric is void.'}
    - {id: INV-5, rule: 'C-PS1 failure: the instrument is falsified; the run is void and is not evidence about H-CERTBIN-5e71c9.'}
    - {id: INV-6, rule: 'C-CERT or C-VERIFIER failure: MR1-MR4 are void.'}
    - {id: INV-7, rule: 'C-DET mismatch: the run is void.'}
    - {id: INV-8, rule: 'A void run is an implementation failure (AGENTS.md core rule 5). It says nothing about S_3 or the refutation degree.'}

  success_criterion: >-
    The run succeeds iff C-SRC, C-SELF, C-FIX, C-BASE, C-ORACLE, C-MONO,
    C-PS1, C-CERT, C-VERIFIER, C-NULLS and C-DET pass; every instance of
    every set has a closure label for every closure that was due to run; and
    RC1-DR-1..RC1-DR-7 each return a verdict or "not evaluable" with its
    reason. ARTIFACT, GENUINE and MIXED are all successes; CLEAN, NEAR-CLEAN,
    RESIDUE and UNDETERMINED are all informative outcomes.
  falsification_criterion: >-
    - E-A (H-CERTBIN-5e71c9 C1) is falsified iff a <= 31.
    - E-G is falsified iff a >= 32.
    - "Clean at D <= 5" is falsified iff RC1-DR-2 returns RESIDUE under both
      L1 and L2.
    NOT falsification: a void run (INV-1..INV-8), a watchdog expiry, an
    UNCERTIFIED refutation, an UNDETERMINED(budget) instance.

  coordinator_prior: >-
    Written before any run; no W_D or M_5 value has been seen by anyone in the
    program. A prior, not a prediction; it changes no threshold.
    (a) W_4 refutes a substantial but not overwhelming part of U62: most
        likely a in [15, 50] (MIXED), about 60%; ARTIFACT about 25%; GENUINE
        about 15%. Reason: W_4 uses the linear fall ell at degree 4, but the
        substituted system is still semi-regular-degree 5.
    (b) M_5 refutes nearly all of U62 (b >= 56, about 75%), so the D <= 5
        picture is CLEAN or NEAR-CLEAN (about 80%).
    (c) The nulls are refuted at M_5 at a high rate too (semi-regular
        D_reg = 5), so "NOT DISTINGUISHED at M_5" is likely (about 65%). At W_4
        the nulls stay near 0, so if a >= 10, "S_3-SPECIFIC at W_4" is likely.
    (d) Certificates: every W_4 / M_5 refutation certifies (about 90%); the
        likeliest failure is certificate SIZE under the memory cap, handled by
        the straight-line format, not a wrong refutation.
    Most likely to be overturned: (a) in either direction.

  proof_search_map_audit:
    performed_by: coordinator (DEC-20260924-8e2f47), before approval
    baseline_fixture: C-BASE (archived per-instance rank_4 / "1 in R_4" / rank_3 / "1 in R_3" for 268 instances) and C-FIX (2924 x 4048; 16796 x 12616).
    observation_collision: >-
      Passes by construction: a counted refutation carries a verified
      certificate, so a false positive requires a wrong arm label (C-ORACLE)
      or a verifier bug (C-VERIFIER negative controls). S62 is the explicit
      collision search.
    quantifier_order: >-
      Stated in H-CERTBIN-5e71c9. The set U62 is CONDITIONED on a Stage-1
      outcome; conclusions are about that set, and the combined arm rate uses
      monotonicity, checked on C20.
    method_ceiling: >-
      W_D is a degree-bounded closure: a non-refutation at W_5 is a statement
      about derivations whose a-priori degree stays <= 5, not a proof that no
      refutation of higher degree exists, and not an F4 step degree. The
      nearby-object control is the pair of null sets.
    verdict: No audit failure. Approved.

  attention_contract:
    decisive_evidence: RC1-DR-1 and RC1-DR-2 on verified certificates.
    positive_next_decision: >-
      CLEAN or NEAR-CLEAN: design the n = 19 cell (DEC-20260923-f25b97 NA-5)
      with W_4 beside M_4. ARTIFACT: quote the W_4 rate, not the M_4 rate,
      as the Stage-1 refutation statistic from now on.
    negative_next_decision: >-
      RESIDUE or GENUINE: the n = 19 cell is not designed on the D <= 5
      premise; the residue instances become the object of KN-OPEN-3c8f51 item
      (A) (mechanism), and the D* distribution is recorded as it falls.
    inconclusive_decision: >-
      UNDETERMINED (budget or certification): a successor task with a raised
      per-instance W_5 watchdog on exactly the undetermined instances.
    local_ambiguity_rule: >-
      Any case the rules do not cover is recorded as "not evaluable" with its
      reason; no threshold is added after data.
    peripheral_exclusions: [D = 6, F4, any new instance draw, n = 19]
    rerank_trigger: Completion of this run triggers the CERTBIN rerank (DEC-20260924-8e2f47 NA-6).

  execution:
    entry_point: experiments/EXP-CERTBIN-e94b27/impl/driver.py
    selftest: experiments/EXP-CERTBIN-e94b27/impl/selftest.py
    verifier: experiments/EXP-CERTBIN-e94b27/verifier/verify_cert.py
    interpreter: python3 with numpy 2.4.6 (record versions in environment.json); mpmath optional for log-space tails
    trial_plan: experiments/EXP-CERTBIN-e94b27/trial-plan-v1.json
    trial_plan_rule: >-
      Written by the executor from this specification alone before phase 1:
      input paths and hashes, the set-selection rules, phases and output
      paths. It contains no computed closure value. Its sha256 is in the
      manifest.
    command: >-
      python3 experiments/EXP-CERTBIN-e94b27/impl/selftest.py --out
      experiments/EXP-CERTBIN-e94b27/runs/RUN-CERTBIN-c417e0/selftest.json &&
      python3 experiments/EXP-CERTBIN-e94b27/impl/driver.py --spec
      experiments/EXP-CERTBIN-e94b27/specification.yaml --plan
      experiments/EXP-CERTBIN-e94b27/trial-plan-v1.json --source-run
      experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05 --run-id
      RUN-CERTBIN-c417e0 --out experiments/EXP-CERTBIN-e94b27/runs/RUN-CERTBIN-c417e0
      [--resume]
    determinism_command: >-
      python3 experiments/EXP-CERTBIN-e94b27/impl/driver.py --spec
      experiments/EXP-CERTBIN-e94b27/specification.yaml --plan
      experiments/EXP-CERTBIN-e94b27/trial-plan-v1.json --source-run
      experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05 --run-id
      RUN-CERTBIN-c417e0 --out experiments/EXP-CERTBIN-e94b27/runs/RUN-CERTBIN-c417e0
      --phase determinism
    verify_command: >-
      python3 experiments/EXP-CERTBIN-e94b27/verifier/verify_cert.py --certs
      experiments/EXP-CERTBIN-e94b27/runs/RUN-CERTBIN-c417e0/certificates.jsonl.gz
      --source-run experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05
      --out experiments/EXP-CERTBIN-e94b27/runs/RUN-CERTBIN-c417e0/certificate-verification.json
    phases:
      - 0 C-SRC, C-SELF, C-FIX
      - 1 instance-set selection and C-ORACLE; C-BASE (M_3, M_4)
      - 2 W_4 on all sets
      - 3 M_5 on U62, S62 and the null sets
      - 4 W_5 on the residual, the 10 S62 controls and the null residuals
      - 5 C-DET (separate process, --phase determinism)
      - 6 verifier (separate process; verify_command), C-VERIFIER negative controls
      - 7 aggregation, decision rules, run report (--resume after phase 6)
    output_bound: >-
      Per-instance records gzipped JSONL. Certificates gzipped. The total run
      package stays below 80 MiB; if certificates would exceed it, the
      executor keeps every certificate for U62 and S62 and for the first 20
      of each null set, and records hashes and sizes of the rest.
    dispatch_note: >-
      No batch queue exists for this lane, so tools/experiment_execution.py
      is not the launch path. The executor launches the commands above under
      TASK-20260924-41c7be after TASK-20260924-d3a90c verifies.

  constraints:
    - No new instance is drawn. No deployed curve is an attack instance. No discrete logarithm is attempted.
    - A timeout, crash or environment restart is execution status, never negative mathematical evidence.
    - EXP-CERTBIN-4e92d7 and RUN-CERTBIN-3b7e05 are read only; nothing under them is written.

  artifact_paths:
    - experiments/EXP-CERTBIN-e94b27/specification.yaml
    - experiments/EXP-CERTBIN-e94b27/trial-plan-v1.json
    - experiments/EXP-CERTBIN-e94b27/impl/
    - experiments/EXP-CERTBIN-e94b27/verifier/
    - experiments/EXP-CERTBIN-e94b27/runs/RUN-CERTBIN-c417e0/

  required_artifacts:
    - trial-plan-v1.json (before phase 1)
    - impl/impl-provenance.json (copied files, source sha256, diffs)
    - selftest.json (C-SELF, C-FIX)
    - inputs.json (input sha256 and the C-SRC comparison)
    - instance-sets.json (U62, S62, C20, N-AFF62, N-F262 by idx, with archived fields)
    - closures.jsonl.gz (per instance and closure; rank, "1 in X", W_D iterations and dims, labels)
    - certificates.jsonl.gz and certificate-verification.json
    - instrument-checks.json (every C-* with pass/fail and violating instances)
    - decision-rules.json (RC1-DR-1..7 with inputs, including both RC1-DR-2 labels)
    - cell-summary.json (MR1-MR5 and secondary metrics)
    - manifest.yaml, raw-result.json, command.txt, environment.json, stdout.log, stderr.log
    - >-
      run-report.md: each RC1-DR verdict; which of PA-1..PA-3 held, failed or
      were not evaluable; which parts (a)-(d) of the coordinator_prior were
      overturned; the claim tier and scope statement verbatim.

  claim_tier_and_review:
    review_required: true
    default: >-
      review-adversarial. The validator re-verifies EVERY counted certificate
      with its own verifier, written without reading impl/ or verifier/ (this
      is the second, independent certificate verification the user required),
      and recomputes W_4 on a blind 10-instance U62 subsample from the object
      definitions alone. A red-team pass attacks the W_D definition, the
      monotonicity inference behind (324 + a)/386, and the null comparison.
      The review_plan is written after the run snapshot TASK-20260924-e27f93
      verifies, before any reviewer runs.
    escalation: >-
      None expected. If an evidence decision would close a lane or record
      reject_scoped on this basis, review-breakthrough at max comes first.

  dependencies: []
  dependencies_note: None. Every input is committed on main (RUN-CERTBIN-3b7e05 archive, 64cba9f and later).

  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    fallback_reason: >-
      DEC-20260923-4d7a19 R-1 forward rule. Claude Code subagents inherit the
      session model; per-role model selection is process-level (CLAUDE.md
      model policy note), so a same-session executor cannot be pinned to the
      bound model. This is not a tier downgrade: the requested policy and
      effort must still be served and recorded.
    degraded_allowed: false
    independent_session_required: false
