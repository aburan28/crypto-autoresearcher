experiment:
  id: EXP-PAIR-a0079e
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-df5984
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: THE ONE-POINT ESCAPE TAXONOMY - classify every publicly computable map out of the cryptographic
    subgroup that needs only ONE point, by the mathematical object it factors through (End(E), divisors,
    the formal group, Galois cohomology, a change of base field), show that four of the five classes
    collapse to exactly two known escapes (N | Phi_k(p) with k small, and N = p), record WHY each
    collapses, and leave the fifth class explicitly unclassified rather than declared empty - the
    point being to ask, with a structural spine rather than a list, whether CM supplies a third escape,
    and to answer NO with a reason instead of a tally
  status: draft
  objective: '(A) THE QUESTION IN ITS GENERAL FORM. A non-generic attack on ECDLP that needs only
    the public data (E, p, P, Q) and ONE point is, structurally, an efficiently computable map psi
    from G into some group H in which the DLP is easier, satisfying psi([x]P) = x . psi(P) in H''s
    operation. Every known non-generic prime-field attack has this shape. So the honest way to ask
    "does CM supply a self-pairing computable from one point" is to ask what such maps can factor
    through at all.

    (B) THE FIVE CLASSES, AND THE FOUR COLLAPSES. CLASS I - psi factors through End(E). CLOSED. G
    has prime order, so End(G) = Z/N and every endomorphism acts as a scalar (H-ENDO-001); the endomorphism-image
    oracle is generic-group simulable (KN-FIND-b7e091, EV-GGM-79e710, DEC-20260804-3b4258). CM contributes
    exactly here and nowhere else, which is already the answer to the lane''s headline question. CLASS
    II - psi factors through divisors and functions on E, i.e. a pairing. COLLAPSES TO ONE ESCAPE.
    Bilinearity needs a second argument. With only one point the argument must be P itself, and IDEA-20260807-30868b
    shows the self-pairing is trivial unless p = 1 mod N. So Class II yields exactly the small-embedding-degree
    escape N | Phi_k(p), and its one-point sub-case is k = 1. CLASS III - psi factors through the
    formal group / a p-adic lift. COLLAPSES TO ONE ESCAPE. The formal logarithm is defined on the
    kernel of reduction, and [N]P lands there only when N = p - the anomalous case, where Smart /
    Satoh-Araki / Semaev give a polynomial-time additive transfer (KN-TECH-033). For N not equal to
    p the lift ambiguity covers all of Z/N and the channel is exactly closed - which the catalogue''s
    A4-3 proposes to measure and which this record cites rather than duplicates. CLASS IV - psi factors
    through Galois cohomology / descent. COLLAPSES INTO CLASS II, AND THIS IS THE OBSERVATION MOST
    WORTH RECORDING. Over a finite field, Lang''s theorem gives H^1(Gal(F_p-bar/F_p), E) = 0 for the
    connected group E, so the descent map E(F_p)/N.E(F_p) -> H^1(Gal, E[N]) is an isomorphism onto
    E[N]/(pi - 1)E[N]. That target is precisely the second argument of the Tate-Lichtenbaum pairing.
    So descent over a finite field supplies no map that the Tate pairing does not already supply,
    and Class IV yields nothing new. Over a NUMBER FIELD the same construction is the engine of descent
    and is not vacuous - which is why this collapse is a statement about finite fields specifically,
    and is worth stating rather than assuming. CLASS V - psi factors through a change of base field
    (cover, Weil restriction, GHS). VACUOUS OVER F_p. The mechanism needs a proper subfield to shrink
    into and F_p has none; the exponent identity e(n, g) = (2 - 2/g)/n gives e >= 1 > 1/2 at n = 1
    (catalogue A4-4, unrun). CLASS VI - UNCLASSIFIED. Anything not factoring through any of the above.
    NOT declared empty. Named candidates that this record cannot place - correspondences on E x E
    that are not graphs of endomorphisms; maps into abelian varieties that are not Jacobians of curves;
    the elliptic-net recurrence, which KN-FIND-b7e091 records as non-simulable but not usefully invertible
    (Oracle B); and anything using the Weierstrass coefficients as integers rather than as field elements.

    (C) THE ANSWER TO THE LANE''S QUESTION, WITH A REASON. CM structure contributes to Class I and
    to nothing else - a CM endomorphism is an endomorphism. It does not enlarge Class II (the embedding
    degree is independent of every CM datum, IDEA-20260807-653dda), it does not enlarge Class III
    (N = p is a trace condition, not a CM one), and it collapses in Class IV with everything else.
    So there is no CM-specific third escape among the four classified classes, and the residual is
    Class VI, which is stated as open. THAT IS THE DIFFERENCE BETWEEN THIS RECORD AND A FATIGUE REPORT
    - it names the obstruction per class, and it names what remains.

    (D) WHY THE TWO SURVIVING ESCAPES LOOK ALIKE, WHICH IS A HYPOTHESIS AND NOT A THEOREM. Both surviving
    conditions are divisibility of N by a small-height polynomial evaluated at p - N | Phi_k(p) for
    small k, and N = p (which is N | p, the degenerate member of the same shape). Using the identity
    p = t - 1 (mod N) from IDEA-20260807-653dda, both become conditions on the TRACE - k = ord_N(t-1),
    and anomalous is t = 1. HYPOTHESIS TO TEST - every publicly computable one-point escape is a divisibility
    condition on a small-height integer polynomial in p (equivalently in t). If true, the search for
    a third escape becomes a search over small-height polynomials, which is finite and enumerable
    at any given height. If false, the counterexample IS the third escape. Both outcomes are deliverables
    and the record commits to reporting either.'
  resource_label: Spans the taxonomy - R3 (Class I), R7 (Class II), R6 (Class III), R5 and R7 (Class
    IV), R1 and R2 (Class V). The record itself consumes no resource; it is an audit of which resources
    can support a one-point map, and it is the L8 counterpart of lane L12's simulability audit.
  admissibility: admissible
  admissibility_argument: The audit is admissible because it asserts no attack. Its per-class verdicts
    are the interesting part - Class I is INADMISSIBLE by the campaign's own filter (H-ENDO-001, KN-FIND-b7e091),
    Classes II and III are ADMISSIBLE and non-empty but only on measure-zero curve families, Classes
    IV and V are admissible and empty over F_p, and Class VI is UNCLASSIFIED, which is neither admissible
    nor inadmissible until a candidate is named concretely enough to test. Recording an unclassified
    cell rather than forcing a verdict is deliberate - docs/inventor-protocol.md treats premature
    closure as a failure mode symmetric with overclaiming.
  reachability_gate: NOT A MOVE BETWEEN CURVES, but the taxonomy has a reachability consequence worth
    stating. The two surviving escapes are conditions on (N, p), hence on the trace, hence class invariants
    (IDEA-20260807-b92080) - so neither is reachable from a curve that does not already satisfy it,
    at any cost. A hypothetical third escape found in Step 4 would need its own reachability analysis,
    and the record pre-registers that requirement - a third condition that is also a function of (N,
    p) is unreachable for the same reason and would be a scope result rather than an attack, whereas
    one depending on j or on End(E) WOULD be reachable by walking and would be the campaign's most
    important finding. That dichotomy is stated in advance so it cannot be tuned afterwards.
  inputs:
    procedure: 'ENTIRELY SYMBOLIC AND ZERO COMPUTE except for optional Step 5. STAGE 0 (hours): literature
      pass for an existing classification of ECDLP transfers; record whatever is found in knowledge/.
      STAGE 1 (hours): write the five classes and the composition rule. STAGE 2 (hours): the four
      collapse arguments, with Lang''s theorem transcribed. STAGE 3 (HARD GATE, one hour): the three
      nearby-object controls - if any fails, stop and repair before writing any F_p verdict. STAGE
      4 (hours): the small-height enumeration of (D), by hand or with sympy. STAGE 5 (optional, low
      compute): toy search for any third condition found.'
    mechanism: 'STEP 1 (zero compute) - write the five classes with the factorisation condition for
      each, and the composition rule. STEP 2 (zero compute) - write the four collapse arguments. Class
      I cites H-ENDO-001 and KN-FIND-b7e091. Class II cites IDEA-20260807-30868b. Class III cites
      KN-TECH-033 and states the lift-ambiguity obstruction. Class IV is the one requiring new work
      here - state Lang''s theorem, derive H^1(Gal, E[N]) = E[N]/(pi-1)E[N], and identify it with
      the Tate pairing''s second argument. Class V cites the n = 1 exponent identity. STEP 3 (zero
      compute) - the residual. Enumerate Class VI candidates explicitly and, for each, apply the lossy-projection
      test - does the candidate define a genuinely lossy projection whose discarded part is discarded
      compatibly with the group law? A candidate failing that test is dropped WITHOUT measurement
      and the reason recorded; a candidate passing it becomes a successor proposal with its own record.
      THIS IS THE STEP THAT MAKES THE RECORD FORWARD-LOOKING RATHER THAN AN OBITUARY. STEP 4 (zero
      compute) - the small-height hypothesis of (D). Enumerate all integer polynomials f of degree
      at most 4 and coefficients at most 4 in absolute value, evaluate the condition N | f(p) under
      the substitution p = t - 1 mod N, and check which of them can hold for a curve with N | #E(F_p)
      - i.e. which are consistent with the Hasse bound. This is a finite symbolic enumeration costing
      nothing, and its output is either "only the known two" (supporting the hypothesis) or a third
      candidate condition, which would be the single most valuable output of this lane. STEP 5 (low
      compute) - for any third condition surviving Step 4, search toy p for a curve satisfying it
      and ask whether an attack follows. A condition that is satisfiable but supports no attack is
      itself informative and must be reported as such rather than quietly dropped.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - number-field control - Class IV must be live
  - F_{q^3} control - Class V must be live
  - supersingular control - Class I must be live
  - small-height enumeration must recover both known conditions at low height
  - lossy-projection test applied to every Class VI candidate before any measurement is proposed
  - 'NULL OBJECT (from the proposal): MANDATORY, and for a taxonomy the null is a NEARBY SETTING WHERE
    THE SAME CLASSIFICATION MUST GIVE A DIFFERENT ANSWER. Three are required. (i) NUMBER FIELDS -
    Class IV must be NON-vacuous over Q, where descent is the standard engine for computing Mordell-Weil
    ranks. A classification that also kills descent over number fields has mis-stated the Lang''s-theorem
    step and is void. (ii) EXTENSION FIELDS F_{q^n} with n >= 3 - Class V must be NON-vacuous there,
    where GHS and cover attacks genuinely win. A classification that reports Class V empty for F_{q^3}
    proves too much. (iii) SUPERSINGULAR CURVES - Class I must be NON-vacuous there, since End is
    a quaternion order and distortion maps exist. A classification that reports Class I closed for
    supersingular curves has ignored the very fact that makes pairing-based cryptography possible.
    DECAY PARAMETER - the height bound in Step 4. As the polynomial degree and coefficient bound increase
    from (1,1) to (4,4), the number of admissible conditions must grow slowly and must reproduce the
    two known ones at the smallest heights. If the count explodes, the enumeration is not constraining
    anything and the hypothesis in (D) is vacuous - which is itself a reportable outcome and would
    mean the "small-height" framing is the wrong lens.'
  independent_variables: []
  metrics:
    primary:
    - the five-class table with a verdict and citation per cell
    - the composition rule, stated and checked on at least three composites
    - the small-height enumeration output, as an explicit list
    - per Class VI candidate - the lossy-projection verdict and its reason
    secondary:
    - pass or fail of each nearby-object control
  heuristic_under_test: null
  preregistered_prediction:
    quantity: number of distinct one-point escape families surviving the five-class classification
      over F_p
    formula: Predicted EXACTLY TWO - small k and anomalous. THREE would be the most valuable single
      output of this lane and would be escalated immediately. ONE would mean one of the two known
      families has been mis-assigned and is decision-relevant as an error.
    source: pre-registered in IDEA-20260807-df5984 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - Classification by convenience. It is easy to assign an awkward map to Class VI and declare the
    taxonomy complete over the other five. Every assignment must state the factorisation explicitly,
    and a map that plausibly fits two classes must be recorded in both.
  - Cost blindness. The taxonomy classifies EXISTENCE, not cost. Two maps in one class can differ
    by an exponent. No cost conclusion may be drawn from a class label, and the observation-collision
    search exists to make that limitation explicit.
  - Confusing "no third escape found" with "no third escape exists". KN-OPEN-019 says this program
    has no object enumeration for the ECDLP, so the table is a sketch. The record must carry that
    sentence in any summary.
  - The Lang's-theorem step is the one place where an error would be both easy to make and hard to
    notice, because the conclusion (nothing new) matches the expectation. It must be checked by someone
    who wants it to be wrong.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Predicted EXACTLY TWO - small k and anomalous. THREE would be the most valuable
    single output of this lane and would be escalated immediately. ONE would mean one of the two known
    families has been mis-assigned and is decision-relevant as an error.
  falsification_criterion:
  - Any nearby-object control failing - i.e. the argument also killing descent over number fields,
    or cover attacks over F_{q^3}, or distortion maps on supersingular curves. The classification
    proves too much and is void.
  - The small-height enumeration failing to recover the two known conditions. The enumeration is mis-specified;
    repair before any count is reported.
  - A third satisfiable condition appearing. The hypothesis in (D) survives but the taxonomy's "exactly
    two" prediction is refuted - which is the GOOD outcome and the one worth the most.
  - Lang's theorem being misapplied, so that Class IV does not in fact collapse. Then descent over
    finite fields is a separate route and the record's most novel step is wrong - decision-relevant,
    and the successor would be an examination of what that route yields.
  - A Class VI candidate passing the lossy-projection test with a definable one-step propagation.
    The taxonomy is incomplete in a specific, named way, and that candidate becomes the lane's forward
    direction.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
