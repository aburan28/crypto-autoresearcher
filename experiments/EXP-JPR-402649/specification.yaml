experiment:
  id: EXP-JPR-402649
  hypothesis_id: H-JPR-5e33d6
  question_id: RQ-ECDLP-160d89
  idea_id: IDEA-20260901-a66d70
  goal_id: null
  goal_id_note: >-
    RQ-ECDLP-160d89 is bound to no active goal head. GOAL-ECDLP-001 is paused
    at its 57-batch ceiling (DEC-20260823-eb7baf); this contract is a
    standalone design under the question's own claim boundary and does NOT
    open a lane on GOAL-ECDLP-001.
  version: 1
  recorded_at: '2026-09-02'
  drafted_under_task: TASK-20260902-d89741
  title: >-
    Zero-run static derivation of order-join rigidity (T1), approximate
    additivity with explicit constants (T2), and the SFT cascade (T3) for
    two-pointer join keys on a prime-order group, with three blocking
    symbolic controls and the one-percent obligation stated
  status: approved
  approved_by: coordinator
  assigned_to: executor
  implementation_authorized: false
  implementation_authorized_note: Nothing to implement; the contract forbids code.
  execution_authorized: true
  execution_authorized_note: >-
    Authorized FOR THE ZERO-RUN STATIC DERIVATION ONLY: the written artifact
    package under experiments/EXP-JPR-402649/runs/STATIC-001/. No run, no
    code, no curve generation, no curve sampling, and no ECDLP instance is
    authorized by this field; maximum_runs remains 0.
  approval_note: >-
    Approved by ordinary Coordinator authority (AGENTS.md rule 1) on user
    confirmation of 2026-09-02 ('Approve as drafted'), executing the
    /design-experiment gate (skill step 4); decision record
    DEC-20260902-52868a. The specification is frozen as of the snapshot
    commit; any change is a versioned protocol_amendment under
    experiments/EXP-JPR-402649/amendments/, never an edit. The preregistered
    prediction (tau_0 strictly in (0, 1/6), on the order of 1/20) is part of
    the frozen contract and is never adjusted after the derivation.
  zero_run_contract: true
  claim_ceiling: >-
    zero_experiment_static_derivation_and_design_integrity_only; no ECDLP
    evidence, no speedup, no closure of the lane, no hypothesis or goal
    status change.
  claim_tier_basis: >-
    DERIVATION TIER per docs/claims-and-verification.md ('Refutation
    artifacts' item 2 and 'Heuristic-conditional claims'). No solve is
    claimed and no certificate of any kind other than `none` can arise: no
    run occurs, no curve exists, no discrete logarithm is computed. Every
    artifact is a checkable written argument labelled `derivation`, never
    'proved'. No claim-tier label (toy/medium/crypto) applies because no
    scale is tested; the artifact package asserts nothing above derivation
    tier and any downstream evidence record must carry
    proof_status: derivation with proof_refs pointing at this package.
  objective: >-
    Write, inside the RQ-ECDLP-160d89 claim boundary (static theorem and
    certificate architecture only), the derivation package for
    H-JPR-5e33d6, in five stages, with ZERO runs, NO code, NO curve sampling,
    and NO ECDLP instance. Budget note required by the template floors: no
    run occurs; wall_clock_seconds_per_run = 600 is the declared floor and
    bounds any incidental mechanical arithmetic check the executor may make
    (e.g. re-adding the N = 23 fixture), which is not a run, produces no run
    record, is not evidence, and must not be needed for any conclusion.

    STAGE 0 -- CONTROLS (M1, HARD GATE, zero compute). Write T1 with the
    dihedral-embedding step in full and apply it, step by step, to the three
    control objects listed under `controls`. For the composite Z/(d*e) coset
    object and the F_2^{3m} lexicographic object the derivation must FAIL
    with the failing step NAMED (predicted: pairwise-distinct translates /
    injective dihedral embedding for the composite object; prime order and
    distinct translates for the XOR object, whose D-stabilizer is D itself).
    For Z/N with the identity order T1 must return rho = -id on start
    positions and T3 must be vacuous. Include the N = 23, w = 5 fixture as a
    HAND ENUMERATION written into derivation.md: the 23 width-5 cyclic
    intervals, the 23 translates of one of them, their coincidence as sets,
    and the rotation by -T for each T. This is a paper enumeration and is
    not a run.

    STAGE 1 -- T2 WITH EXPLICIT CONSTANTS AND THE THRESHOLD (M2). Track the
    three approximation steps (soundness on a row, size matching under
    w' >= (1-eta')w, translate comparison) and the union bound over the rows
    R, R', R + R' that produces the 3*delta fraction; state C and the
    constant in delta = O(eta + eta') explicitly. Write the translate-
    comparison step in full or report that only the coarser defect O(w) is
    available and carry that constant instead. Derive tau_0, the absolute
    threshold on eta + eta' below which Stage 2's Fourier real part exceeds
    zero AND the heavy frequency is unique ((1 - gamma)^2 > 1/2), and state
    honestly that above tau_0 the record has no conclusion. Also write, for
    HEUR-001, the second-moment bound for the sampled soundness rate with
    the shared-leaf dependence charged (symbolic validation of HEUR-001).

    STAGE 2 -- T3 AS THREE LEMMAS. Lemma (i): the Fourier identity and the
    Parseval extraction of xi_0, with the exclusion of xi_0 = 0 argued from
    |D| = Theta(N/L) and the uniqueness of the heavy frequency. Lemma (ii):
    transfer of the heavy coefficient from G to t -> e(f([t]P)) and
    t -> e(f([t]Q)) on Z/N at xi_0 and xi_0*x. Lemma (iii): the two SFT calls
    and the division xi_0*x / xi_0, with per-attempt cost times inverse
    success probability bookkept. Lemma (iii) is MARKED as dependent on the
    recalled Akavia-Goldwasser-Safra statement; the exact required form of
    that statement (query model, tau dependence, failure probability, output
    list size) must be extracted from the lemma's needs and written down
    VERBATIM in external-obligations.yaml as an obligation, not as a fact.

    STAGE 3 -- THE ONE-PERCENT OBLIGATION, STATED AND NOT CLAIMED. Record
    what happens when coverage is a constant bounded away from 1: T2's
    size-matching step fails, only 'additivity on a dense set of pairs'
    remains, and the BSG-plus-Freiman route yields a noisy coarse-log oracle
    with unknown error positions. Write the exact HNP-with-errors statement
    that HEUR-002 would need into external-obligations.yaml. Claim nothing.

    STAGE 4 -- SURFACE PLACEMENT. Place the order-join branch on the
    IDEA-20260829-3f0f4b (gamma, s) surface: it is not a point at
    (gamma, s) = (1, 2/3) but, conditional on T3, a point at exponent 0 off
    the surface; record this in surface-placement.yaml together with the
    list of join primitives NOT covered by T1-T3.
  inputs:
    group: symbolic G = <P> of odd prime order N; no concrete curve
    N: symbolic odd prime
    L: N^(1/3)
    w: symbolic accepted-window length, Theta(N^(2/3)) at the certificate target
    w_prime: symbolic emission-window length with w' >= (1 - eta')w
    eta: symbolic soundness defect
    eta_prime: symbolic size-matching defect
    order_key: symbolic nu from G to Z/N, ties allowed, predeclared, independent of Q
    fixture: 'N = 23, w = 5; hand enumeration of 23 width-5 cyclic intervals; not a run'
    curve_generation: none
    runs: 0
  controls:
    - id: CTRL-COMPOSITE-COSET
      row_class: join_core
      blocking: true
      object: >-
        Composite cyclic group Z/(d*e), D a coset of the order-e subgroup, nu
        the 'sort by coset, then arbitrarily within the coset' order.
      forced_disposition: >-
        T1's hypothesis must FAIL with the failing step named. Every translate
        of D is a nu-interval, but the translates are NOT pairwise distinct,
        the dihedral embedding is not injective, and nu is NOT a log order. A
        derivation that concludes a log order here proves too much (F1).
    - id: CTRL-XOR-LEX
      row_class: join_core
      blocking: true
      object: >-
        F_2^{3m} with the lexicographic order and D a prefix subspace;
        XOR-translates of D are dyadic intervals.
      forced_disposition: >-
        The theorem must be SILENT: the group is not of prime order, the
        stabilizer of D is D itself so the distinct-translates step fails,
        and T2's additivity is false because XOR is not addition of ranks.
        Scored on the common join-core rows ONLY; no ECDLP-only source-replay
        or scalar-recovery row is scored on it (JPR-REV-2).
    - id: CTRL-ZN-IDENTITY
      row_class: join_core
      blocking: true
      object: Z/N with nu the identity order and D a genuine interval.
      forced_disposition: >-
        T1 must return the identity (start map s(T) = j - T, rho = -id, an
        injective homomorphism), T2 must hold with zero defect, and T3 must
        be vacuous because the logarithm is already known. The N = 23, w = 5
        hand fixture is this control's frozen fixture.
    - id: NULL-1-RANDOM-ORDER
      row_class: join_core
      blocking: false
      object: A uniformly random cyclic order on G.
      forced_disposition: >-
        Predicted: T2's additivity holds with probability w/N per pair, the
        Fourier statistic of e(nu/N) is O(N^{-1/2}) at every frequency, and
        the scan is sound only at rate 1/L. EXPECTED TIME N: this is exactly
        the JPR-REV-4 corrected cost of the literal independent pair coin
        (N^{2/3} pair enumeration per fresh attempt times N^{1/3} retries),
        NOT the optimistic N^{2/3}, and the artifact must say so.
    - id: NULL-2-X-COORDINATE-ORDER
      row_class: join_core
      blocking: false
      object: >-
        The x-coordinate integer order of K-EC-XINTERVAL-1
        (IDEA-20260823-cab6c6) used as a two-pointer key.
      forced_disposition: >-
        Same prediction as NULL-1: soundness rate 1/L and expected time N
        (JPR-REV-4's pair-coin cost). T1 must NOT be applied to it, because
        x(-R) = x(R) makes the order non-injective; T2/T3 apply and predict
        no heavy coefficient. This is the record's statement that
        K-EC-XINTERVAL-1 cannot be two-pointer joined.
    - id: PARETO-RHO
      row_class: pareto_control
      blocking: false
      object: Pollard rho, (time exponent, memory exponent) = (1/2, 0), O(1) memory.
      forced_disposition: >-
        Stated as a CONTROL ROW ONLY. No domination claim in either direction
        is made on any axis (JPR-REV-3): this contract mounts no attack, so
        its realized position is dominated trivially, and the conditional
        exponent 0 is not a Pareto position.
    - id: PARETO-BSGS
      row_class: pareto_control
      blocking: false
      object: Baby-step giant-step, (time exponent, memory exponent) = (1/2, 1/2).
      forced_disposition: >-
        Stated as a CONTROL ROW ONLY; no domination asserted (JPR-REV-3).
  independent_variables:
    - 'Under T1: the object (prime-order G; composite Z/(d*e); F_2^{3m}; Z/N identity).'
    - 'Under T2: eta, eta prime, and the ratio w prime / w, all symbolic.'
  metrics:
    primary:
      - outcome_of_each_stage_0_control_with_the_failing_hypothesis_named
      - explicit_constant_in_the_T2_additivity_defect
      - explicit_threshold_on_eta_plus_eta_prime_from_T3
      - exact_external_statement_required_from_AGS_for_lemma_iii
      - list_of_join_primitives_not_covered_by_T1_to_T3
      - position_of_the_order_join_branch_relative_to_the_3f0f4b_surface
    secondary:
      - >-
        dominated_by check: every frontier row re-listed from
        IDEA-20260901-a66d70 with the verdict that no attack is mounted and
        no domination is asserted on any unknown or conditional axis
      - >-
        sota_delta: realized cryptanalytic delta 0 on time, memory, and data;
        static deltas (join-class, quantifier, conditional exponent) stated
        exactly as in the proposal, each labelled conditional
      - >-
        honest-accounting list of join primitives NOT covered (hash joins,
        polynomial-relation joins, data-dependent orders, constant-coverage
        joins, non-prime orders) with the reason each escapes
      - >-
        the HEUR-001 second-moment bound as written, and the HEUR-002
        obligation as stated (not discharged)
  heuristic_under_test: null
  heuristic_under_test_note: >-
    Null because this contract tests the main static claims T1-T3, not a
    single heuristic. HEUR-001 (sample-to-population) receives its
    second-moment bound written SYMBOLICALLY in Stage 1, which is the only
    validation this contract supplies for it; HEUR-002 (one-percent regime)
    receives only its literature-extraction OBLIGATION stated in Stage 3 and
    is not validated here.
  preregistered_prediction:
    quantity: >-
      tau_0 = the absolute threshold on eta + eta' (M2) below which T3's
      Fourier real part is positive and the heavy frequency is unique and
      extractable.
    formula: >-
      tau_0 lies strictly in the open interval (0, 1/6), on the order of
      1/20. Shape of the bound: Re E[g(R+R') conj g(R) conj g(R')]
      >= (1 - 3*delta)*cos(2*pi*C*(eta+eta')*w/N) - 3*delta with
      delta = c_1*(eta + eta'); positivity and the uniqueness requirement
      (1 - gamma)^2 > 1/2 together yield tau_0; any derivation giving a
      threshold above 1/6 has dropped a term.
    source: >-
      IDEA-20260901-a66d70, T2/T3 union-bound sketch and prediction M2,
      fixed now (2026-09-02) before any derivation; the uniqueness term is
      the coordinator's tightening recorded in H-JPR-5e33d6 and is likewise
      fixed now. This prediction is never adjusted after the derivation; a
      different outcome is reported as such.
  scale_relevance:
    tier: null
    justification: >-
      Static derivation, no tested scale; the N = 23 fixture is a hand
      enumeration of 23 width-5 intervals and is not a run. No transfer or
      extrapolation argument is made or needed because every statement is
      symbolic in N.
    correspondence: null
  tail_checks: []
  replication:
    seeds: []
    independent_instances: 0
    reason: >-
      Zero runs and no sampling: there is nothing to seed or replicate. The
      replication analogue for a derivation is the blind re-derivation of
      tau_0 in the later review round, which is a separate handoff and is
      not performed inside this contract.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.1
    maximum_memory_gb: 8
    maximum_runs: 0
    maximum_workers: null
    notes: >-
      maximum_runs 0: no run occurs. wall_clock_seconds_per_run 600 is the
      template floor and bounds only incidental mechanical arithmetic checks
      that are not runs and not evidence. total_cpu_hours 0.1 is machine
      compute for such checks, not the executor's session time, which is
      budgeted in the handoff. Dispatcher task attempts are accounted
      separately.
  stages:
    - id: stage-0-controls
      purpose: T1 written in full; three control dispositions; N = 23 hand fixture
      dominant_operation: writing and hand enumeration
      machine_compute: none required
    - id: stage-1-t2-threshold
      purpose: T2 with explicit constants; tau_0 derived; HEUR-001 second-moment bound
      dominant_operation: symbolic derivation
      machine_compute: none required
    - id: stage-2-t3-lemmas
      purpose: lemmas (i)-(iii); AGS obligation extracted verbatim
      dominant_operation: symbolic derivation and obligation extraction
      machine_compute: none required
    - id: stage-3-one-percent-obligation
      purpose: HEUR-002 obligation stated, not claimed
      dominant_operation: writing
      machine_compute: none required
    - id: stage-4-surface-placement
      purpose: placement on the 3f0f4b surface; uncovered primitives listed
      dominant_operation: writing
      machine_compute: none required
  stopping_rules:
    - >-
      Stop immediately if any Stage 0 control takes a disposition other than
      its forced one (composite or XOR object not failing at a named step;
      identity order not returning rho = -id). Record the mismatch as the
      result; do not repair the derivation to fit.
    - >-
      Stop if the derivation would require code, a curve sample, a
      curve generation, or a run. Report the point at which it was needed.
    - >-
      Stop if a recalled source (AGS, Kazhdan, Boneh-Venkatesan, BSG,
      Green-Ruzsa, HNP-with-errors) is needed to SUPPORT a conclusion rather
      than to be pointed at as an obligation. A recalled citation may not
      discharge anything (AGENTS.md rule 9); if the executor opens a source,
      it records provenance retrieved with verified_by in
      external-obligations.yaml and the extracted statement, and still
      claims nothing beyond the derivation tier.
    - >-
      Stop when all five stages are written and the execution report is
      complete; no iteration, tuning, or search.
  invalidation_rules:
    - >-
      An artifact that applies T1 to a non-injective order (in particular
      any coordinate order, since x(-R) = x(R)) is INVALID; T1 requires
      injectivity, T2 and T3 do not.
    - >-
      A derived threshold tau_0 above 1/6 is a dropped-term error and
      INVALIDATES Stage 1 until repaired; the repair is a new artifact
      version, never an edit that hides the first value.
    - >-
      Any claim of an ECDLP speedup, of a sub-rho algorithm, of closure of
      the whole lane, of an ECDLP lower bound, or of any hypothesis, goal,
      or experiment status change is outside the claim ceiling and
      INVALIDATES the artifact making it.
    - >-
      Any run record, manifest.yaml, curve parameters, sampled points, or
      executable code appearing in the package INVALIDATES the package as a
      breach of the RQ claim boundary.
    - >-
      A recalled source presented as a checked source (provenance other than
      recalled without verified_by, or a conclusion resting on a recalled
      statement) INVALIDATES the artifact.
  success_criterion: >-
    Decidable from the primary metrics, ALL of: (1) all three Stage 0
    controls take their forced disposition with the failing hypothesis
    named for the composite and XOR objects and rho = -id returned for the
    identity object, and the N = 23 hand fixture is written out; (2) T2
    carries an explicit constant C and an explicit constant in delta, with
    the translate-comparison step either written in full or its O(w)
    fallback declared; (3) tau_0 (M2) is derived with its derivation chain
    and lies strictly in (0, 1/6); (4) T3's three lemmas are written, with
    lemma (iii)'s exact external obligation stated verbatim and marked
    recalled/unopened (or retrieved with verified_by if opened); (5) the
    HEUR-002 obligation is stated and not claimed; (6) the list of join
    primitives not covered by T1-T3 is recorded; (7) the placement on the
    IDEA-20260829-3f0f4b surface is recorded; (8) NULL-1 and NULL-2 carry
    the expected-time-N statement and the Pareto rows carry no domination
    claim. THIS SUCCESS IS DESIGN INTEGRITY ONLY: it supplies no ECDLP
    evidence, no implementation or execution authority, and changes no
    hypothesis, experiment, question, or goal status. A package meeting (1)
    and (2) but failing (3) is a valid NEGATIVE derivation result (F5-type),
    not an infrastructure failure, and is reported as such.
  falsification_criterion: >-
    Any of: F1 -- T1's derivation, as written, also concludes a log order on
    the composite Z/(d*e) coset object or on the F_2^{3m} lexicographic
    object (proves too much; void until repaired); F2 -- an injective nu on
    a prime-order group is exhibited whose width-w interval system is
    translation-invariant and which is not a log order (T1 false outright);
    F5 -- the derived tau_0 excludes every eta compatible with a Theta(L)
    emitted output, so T3 says nothing about the certificate and the record
    reduces to T1 plus the one-percent obligation; or M3 fails -- an
    independent derivation within the package finds the cascade costs N^{c}
    for some c > 0 rather than (log N)^{O(1)}, so the conditional-exponent-0
    headline is false and must be restated. F3 and F4 are recorded if they
    arise but require, respectively, an exhibited key and an opened source,
    neither of which this contract produces. F6 is not a falsification: a
    derived polynomial-time logarithm from an exhibited key is routed to
    review-breakthrough and not claimed.
  artifact_package_directory: experiments/EXP-JPR-402649/runs/STATIC-001/
  artifact_package_note: >-
    STATIC-001 is a ZERO-RUN PACKAGE DIRECTORY, not a run. It carries NO
    manifest.yaml, no command, no seeds, no timings, and no certificate of
    any kind other than the explicit statement 'certificate kind: none, no
    run occurred' inside the execution report. Every file is a written
    artifact. All seven required artifacts live under this directory.
  required_artifacts:
    - >-
      experiments/EXP-JPR-402649/runs/STATIC-001/derivation.md -- T1-T3 in
      full with all constants; Stage 0 dispositions worked step by step; the
      N = 23 hand fixture; Stage 3 obligation; Stage 4 placement
    - >-
      experiments/EXP-JPR-402649/runs/STATIC-001/stage0-controls.yaml --
      per-control disposition (as forced or not) and the named failing step
      for each control, including NULL-1/NULL-2 expected time N and the
      Pareto rows as controls only
    - >-
      experiments/EXP-JPR-402649/runs/STATIC-001/threshold.yaml -- tau_0 (M2)
      with the derivation chain, every constant, and the comparison against
      the preregistered prediction (0, 1/6)
    - >-
      experiments/EXP-JPR-402649/runs/STATIC-001/external-obligations.yaml --
      the exact AGS statement required by lemma (iii) and the exact
      HNP-with-errors statement required by HEUR-002, each with provenance
      recalled and marked unopened unless the executor opened the source, in
      which case provenance retrieved with verified_by and the extracted
      statement
    - >-
      experiments/EXP-JPR-402649/runs/STATIC-001/uncovered-primitives.yaml --
      the join primitives NOT covered by T1-T3 with the reason each escapes
    - >-
      experiments/EXP-JPR-402649/runs/STATIC-001/surface-placement.yaml --
      placement of the order-join branch relative to the IDEA-20260829-3f0f4b
      (gamma, s) surface, with dominated_by and sota_delta restated honestly
    - >-
      experiments/EXP-JPR-402649/runs/STATIC-001/execution-report.md --
      stage-by-stage execution report; success-criterion checklist (1)-(8)
      with outcome; falsification outcomes; sources actually read with
      provenance; the statement that zero runs occurred, no code was written,
      and no curve was sampled; inference block (requested policy, resolved
      model, fallback_used)
  jpr_rev_compliance:
    JPR-REV-1:
      finding: Contradictory blind-rederivation handoff in the prior JPR round (CORR-20260823-f20ec3).
      disposition: satisfied_by_writing_none_here_with_obligation_forwarded
      how: >-
        This contract opens no review round and contains no
        blind-rederivation handoff, so it cannot be contradictory. The
        obligation is forwarded to the review handoff the Coordinator writes
        after the snapshot archive: it must contain either no
        blind_rederivation block or exactly one, whose quantity is tau_0 as
        STATED in H-JPR-5e33d6 (M2) with parameters (w, w', eta, eta') and
        whose blind_from names runs/STATIC-001/derivation.md and
        runs/STATIC-001/threshold.yaml; the re-deriver's declared sources
        must be disjoint from blind_from, and blind re-derivation is split
        from the snapshot audit.
    JPR-REV-2:
      finding: XOR positive control could not literally pass ECDLP-only source-replay rows.
      disposition: satisfied
      how: >-
        Every control carries a row_class. CTRL-XOR-LEX is scored on the
        common join-core rows only (prime order, distinct translates,
        additivity) and is a hypothesis-necessity control whose forced
        disposition is silence; no ECDLP-only source-replay or
        scalar-recovery row exists in this contract, and none is scored on
        any control.
    JPR-REV-3:
      finding: Pareto domination was asserted on unknown or conditional axes.
      disposition: satisfied
      how: >-
        PARETO-RHO and PARETO-BSGS are stated as control rows only. The
        secondary metric dominated_by must record that no attack is mounted,
        that the realized position is dominated trivially, and that the
        conditional exponent 0 is a conditional collapse, not a Pareto
        position; no domination is asserted on any axis whose value is
        unknown or conditional.
    JPR-REV-4:
      finding: The literal independent pair coin costs expected time N, not N^{2/3}.
      disposition: satisfied
      how: >-
        NULL-1 (random order) and NULL-2 (x-coordinate order) are specified
        with predicted soundness 1/L and EXPECTED TIME N, stated in the
        contract as exactly JPR-REV-4's corrected pair-coin cost; the
        artifact must repeat the statement and may not quote N^{2/3}.
  interpretation_limits:
    - >-
      A derivation package is conditional on all of its stated hypotheses
      and on the recalled AGS statement; it is not an instantiated attack,
      not an ECDLP lower bound, and not a closure of the lane.
    - >-
      A static PASS changes no hypothesis, experiment, question, or goal
      status and authorizes no implementation or run; those are separate
      Coordinator decisions after independent review.
    - >-
      No cryptographic-scale transfer is made; no scale is tested.
    - >-
      The one-percent regime (HEUR-002) is stated as an obligation and is
      not validated, so nothing here reaches constant-coverage joins.
  review_plan: null
  review_plan_note: >-
    Written by the Coordinator on the handoff that opens the review round
    after the snapshot archive, per AGENTS.md 'Review architecture'; not part
    of this contract. Expected joints: (J1) T1 dihedral step and boundary
    widths; (J2) T2 translate-comparison step and constants; (J3) lemma (i)
    xi_0 = 0 exclusion and uniqueness; (J4) lemma (iii) AGS obligation as
    extracted; (J5) Stage 0 dispositions as proves-too-much control.
  id_allocation_provenance: >-
    EXP-JPR-402649 pre-allocated by the orchestrator with tools/allocate_id.py
    and --check verified free; supplied in the task context; this agent did
    not allocate identifiers.
  yaml_parse_disclosure: >-
    NO INTERPRETER WAS AVAILABLE TO THE AUTHORING AGENT and this file was NOT
    machine-parsed by its author. Every prose value is a folded block scalar
    or a quoted scalar; no key is duplicated within a mapping to the author's
    reading; no tabs are used. The orchestrator must run the strict parse
    and tools/validate_ledger.py before this contract is relied on.
