  obligations:
    - id: AGS-1
      required_by: 'derivation.md Stage 2 lemma (iii)'
      role: single external dependence of T3
      status: obligation_not_fact
      provenance: recalled
      verified_by: null
      opened: false
      source_pointer: 'A. Akavia, S. Goldwasser, S. Safra, Proving hard-core predicates using list decoding, FOCS 2003 (recalled; unopened)'
      exact_statement_required: >-
        There is a randomized algorithm SFT which, given a modulus N (odd
        prime suffices), a threshold tau in (0, 1], a failure probability
        eps in (0, 1), and QUERY ACCESS to an arbitrary function
        phi : Z/N -> C with |phi(t)| <= 1 for all t, where a query consists of
        the algorithm choosing any t in Z/N and receiving phi(t) exactly,
        outputs a list Lambda subset Z/N such that, with probability at least
        1 - eps over its own randomness and for every such phi, (a) every m
        with |phihat(m)| >= tau belongs to Lambda, where phihat(m) :=
        (1/N) sum_t phi(t) exp(-2 pi i m t / N); and (b) |Lambda| <= B(tau)
        for an explicit bound B polynomial in 1/tau; using at most
        q(log N, 1/tau, log(1/eps)) queries and p(log N, 1/tau, log(1/eps))
        arithmetic operations, q and p explicit polynomials. Required
        instantiation: tau = 1/sqrt(2) + Gap/2 with Gap the spectral gap of
        lemma (i), so tau is a constant; the polynomial degrees of q and p fix
        the degree of the cascade's (log N)^{O(1)}.
      what_lemma_iii_supplies_itself: >-
        Query access (lemma ii), a constant threshold with a unique
        coefficient above it (lemma i), coefficient re-estimation by Chebyshev
        to isolate the heavy frequency inside Lambda, verification by one
        scalar multiplication, and the retry bookkeeping. Nothing else.
      f4_condition: >-
        If the opened statement uses a different query model (e.g. random
        samples only, or oracle access to a Boolean predicate rather than a
        complex-valued phi), a tau dependence the transfer lemma cannot meet,
        or no list-size bound, F4 is triggered and T3 must be restated on the
        Boneh-Venkatesan fallback for w < N^(1/2).
    - id: HNP-ERR-1
      required_by: 'derivation.md Stage 3 (HEUR-002, the one-percent regime)'
      role: obligation only; nothing claimed
      status: obligation_not_fact
      provenance: recalled
      verified_by: null
      opened: false
      source_pointer: >-
        Bleichenbacher's Fourier-analytic treatment of the hidden number
        problem with erroneous samples (circulated 2000, reported in later HNP
        literature) and D. Boneh, R. Venkatesan, CRYPTO 1996 (both recalled;
        unopened)
      exact_statement_required: >-
        Let N be prime and x in (Z/N)^* unknown. An oracle O, fixed before
        any query and independent of the query sequence, answers a query
        t in Z/N (chosen by the algorithm) with y_t in Z/N such that for a
        set S subset Z/N of density at least c, where c > 0 is an absolute
        constant that may be as small as 0.01, |y_t - (a t x + b) mod N| <= W
        for unknown fixed a in (Z/N)^*, b in Z/N and W = Theta(N^(2/3)),
        while for t not in S the value y_t is arbitrary; membership of t in S
        is not revealed. REQUIRED: an algorithm making N^{o(1)} queries and
        N^{o(1)} arithmetic operations that outputs x with probability at
        least 2/3. The record needs the error rate 1 - c to be a constant
        and the error positions to be unknown; a result requiring error rate
        o(1), known error positions, or N^{Omega(1)} queries does not
        discharge HEUR-002 and would restate T3 for the 99-percent regime
        only.
      supporting_route_also_recalled:
        - 'Balog-Szemeredi (1994) and Gowers (GAFA 1998): recalled, unopened, verified_by null'
        - 'Green-Ruzsa, Freiman in an arbitrary abelian group, arXiv:math/0505198: recalled, unopened, verified_by null'
  pointers_not_relied_upon:
