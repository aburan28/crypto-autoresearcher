threshold:
  experiment_id: EXP-JPR-402649
  hypothesis_id: H-JPR-5e33d6
  task_id: TASK-20260902-19eacf
  quantity: 'tau_0 (M2): absolute threshold on eta + eta_prime below which the Fourier real part is positive and the heavy frequency is unique'
  source: derivation.md sections 1.1 to 1.7 and Stage 2 lemma (i)
  preregistered_prediction:
    frozen_text: >-
      tau_0 lies strictly in the open interval (0, 1/6), on the order of 1/20.
      Shape: Re E[g(R+R') conj g(R) conj g(R')] >= (1 - 3*delta)*
      cos(2*pi*C*(eta+eta')*w/N) - 3*delta with delta = c_1*(eta + eta');
      positivity and (1 - gamma)^2 > 1/2 together yield tau_0; any derivation
      giving a threshold above 1/6 has dropped a term.
    adjusted: false
  derived_value:
    tau_0_asymptotic: 0.023826
    tau_0_as_fraction: '(1 - 1/sqrt(2)) / (12 + (1 - 1/sqrt(2))) = 0.292893 / 12.292893, about 1/42.0'
    finite_N_correction: 'subtract (1 - 3*delta)*(1 - cos(2*pi*w_prime/N)) = O((w_prime/N)^2) from 0.292893 before dividing; vanishes at rate N^(-2/3) for w_prime = Theta(N^(2/3))'
    lies_in_open_interval_0_to_one_sixth: true
    order_of_magnitude_vs_prediction: 'about 1/42, i.e. smaller than the predicted 1/20 by a factor of about 2; not above 1/6; no dropped-term error'
    conditional_on: >-
      The missing lemma (TC) of derivation.md 1.4 (stability of T1 / the
      translate-comparison step), which is NOT derived in this package. The
      chain from the all-pairs form of T2 to tau_0 is complete and explicit;
      the all-pairs form itself is not obtained from soundness and size
      matching by this derivation.
  constants:
    C_row_defect: 'a_R = eta_prime + 2*eta_R/(1 - eta); row symmetric difference Delta_R <= a_R * w'
    abar_bound: 'abar <= eta_prime + 2*eta/(1-eta) <= 2*(eta + eta_prime)/(1 - eta)'
    w_prime_upper_bound: 'w_prime <= w/(1 - eta), derived from soundness by averaging (A prime)'
    markov_parameter_K: 'free; delta = 1/K; good-row defect K*abar*w'
    non_vacuity_condition: 'K*abar*w < w_prime (symdiff-to-start conversion informative only below 2*w_prime)'
    K_chosen: 'K -> w_prime/(abar*w), the non-vacuity limit'
    c_1: '2 / ((1 - eta)(1 - eta_prime)) >= 2, so delta <= c_1*(eta + eta_prime)'
    C_in_frozen_form: '2K/(1 - eta); tied to delta by C*delta = 2/(1 - eta), so C and c_1 are not both absolute'
    C_fallback: 'C_fb = max(1, w_prime/w) <= 1/(1 - eta), the O(w) fallback constant on emitted sound pairs (FB)'
    theta_defect_in_R_mod_Z: 'K*abar*w/N -> w_prime/N <= w/((1 - eta)*N)'
    union_bound_factor: 3
    uniqueness_constant: '1 - 1/sqrt(2) = 0.292893'
    positivity_constant: '1/6 (from 6*delta < 1 when theta -> 0); the uniqueness constant is the binding one'
  derivation_chain:
    - 'Step A (soundness on a row): Delta_R = w - w_prime + 2*eta_R*w_prime.'
    - 'Step B (size matching): Delta_R <= (eta_prime + 2*eta_R/(1-eta))*w using w_prime >= (1-eta_prime)*w and w_prime <= w/(1-eta).'
    - 'Markov: rows with a_R > K*abar have density <= 1/K = delta.'
    - 'Union bound over rows R, R_prime, R + R_prime: bad pairs <= 3*delta.'
    - 'Step C (translate comparison): symdiff <= 2*K*abar*w derived (C1); conversion to a start distance <= K*abar*w is CONDITIONAL on (TC), non-vacuous only if K*abar*w < w_prime.'
    - 'Lemma (i): Re sum ghat|ghat|^2 >= (1 - 3*delta)*cos(2*pi*theta) - 3*delta = 1 - gamma; extraction max|ghat| >= 1 - gamma; uniqueness iff (1 - gamma)^2 > 1/2.'
    - 'Choose K at the non-vacuity limit: delta <= abar/(1 - eta_prime) <= 2t/((1-eta)(1-eta_prime)), t = eta + eta_prime; theta <= w_prime/N negligible.'
    - 'Condition: 6*delta < 1 - 1/sqrt(2); with (1-eta)(1-eta_prime) >= 1 - t: 12t < 0.292893*(1 - t).'
    - 'tau_0 = 0.292893/12.292893 = 0.023826.'
    - 'Above tau_0: no conclusion (one-sided bound).'
  comparison:
    predicted_interval: '(0, 1/6)'
    derived_in_interval: true
    predicted_order: '1/20'
    derived_order: '1/42'
    discrepancy_attribution: 'c_1 = 2 from the factor 2 in Step A, where the prediction implicitly used c_1 = 1; direction is downward, so no term was dropped'
    prediction_adjusted: false
  f5_check:
    triggered: false
    reason: 'tau_0 about 1/42 admits eta = eta_prime = 0 with w_prime = w = N^(2/3) (identity order), which has Theta(L) output; not every eta compatible with Theta(L) output is excluded'
  alternative_route_noted:
    description: >-
      If (TC) were established only at the coarser global precision
      O(eta + eta_prime) in R/Z (the chaining route of derivation.md 1.4),
      theta would no longer be negligible and tau_0 would be re-derived from
      (1 - 3*delta)*cos(2*pi*c*(eta+eta_prime)) - 3*delta > 1/sqrt(2) with the
      chaining constant c; not derived, not a value of this record.
  yaml_parse_disclosure: >-
    Written without an interpreter; not machine-parsed by its author. Prose
    values are folded block scalars or quoted; no duplicate keys to the
    author's reading; no tabs.
