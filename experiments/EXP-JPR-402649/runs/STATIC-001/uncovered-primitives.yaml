uncovered_primitives:
  experiment_id: EXP-JPR-402649
  hypothesis_id: H-JPR-5e33d6
  task_id: TASK-20260902-19eacf
  scope_note: >-
    T1-T3, as derived in derivation.md, concern ONE primitive: the sorted
    two-pointer (rank-sum window) join with a predeclared, Q-independent
    order key on a group of odd prime order. Each primitive below escapes
    for the stated reason. Listing a primitive here asserts nothing about
    its feasibility; it records only that this package is silent on it.
  primitives:
    - id: hash_joins
      description: 'Fiber-system / rectangle-cover joins (A_c x B_c), the class of IDEA-20260829-390ccc'
      escapes_because: 'No rank order and no interval structure exist; T1 (translation-invariant interval systems) and T2 (row windows are nu-intervals) have no object to act on.'
    - id: polynomial_relation_joins
      description: 'Joins whose emission predicate is a polynomial relation on coordinates (IDEA-20260901-730f23)'
      escapes_because: 'The emission set is not a rank-sum window; Step A of T2 (row window equals a nu-interval with start affine in nu(R)) fails at the first line.'
    - id: data_dependent_orders
      description: 'Order keys chosen after seeing Q or the sampled lists'
      escapes_because: 'Assumption A2 is violated; lemma (ii) transfers a coefficient of a FIXED g to phi_Q, and T3 quantifies over algorithms depending on nu but not on Q.'
    - id: constant_coverage_joins
      description: 'Joins whose emission window captures only a constant fraction c < 1 of accepted incidences (the one-percent regime)'
      escapes_because: 'Step B (size matching) fails; only additivity on a dense set of pairs survives; the continuation is HEUR-002 and obligation HNP-ERR-1, stated and not claimed.'
    - id: non_prime_orders
      description: 'Groups of composite order, XOR spaces, products'
      escapes_because: 'T1 Step 1 (distinct translates) and Step 5 (odd order) fail, as the composite and XOR controls show; T2 and T3 use characters of a prime cyclic group.'
    - id: non_injective_keys_under_T1
      description: 'Coordinate orders and any key with ties, under T1'
      escapes_because: 'T1 requires injectivity (x(-R) = x(R) is the canonical failure); invalidation rule 1 forbids applying it. T2/T3 apply only with the set-form size matching of derivation.md 1.6 and the xi_0 hypothesis of lemma (i).'
    - id: narrow_emission_windows
      description: 'Joins with w_prime << w (emit little, stay sound trivially)'
      escapes_because: 'The hypothesis w_prime >= (1 - eta_prime) w is exactly what excludes them; the constants are stated only in that regime.'
    - id: two_sided_error_joins
      description: 'Joins that lose accepted pairs (incompleteness) as well as emitting unsound ones'
      escapes_because: 'Soundness alone is hypothesised; completeness enters only through size matching, and a two-sided-error join breaks the averaging identity (A prime).'
    - id: non_sum_window_predicates
      description: 'Rank-difference, rank-product, or multi-window emission predicates on the same sorted lists'
      escapes_because: 'Step A identifies the row window with nu^{-1}(J_prime - nu(R)); other predicates give row windows that are not translates of a single interval.'
    - id: multi_key_or_multi_round_joins
      description: 'Joins sorting by several keys, or iterating a scan with re-keying between rounds'
      escapes_because: 'T2 is a statement about one key and one window pair; the Fourier identity of lemma (i) is for a single function g.'
    - id: above_threshold_regime
      description: 'Any order key at eta + eta_prime >= tau_0'
      escapes_because: 'The lemma (i) bound is one-sided; above tau_0 the record states no conclusion (derivation.md 1.7 step 8).'
    - id: all_pairs_additivity_not_derived
      description: 'The T2 all-pairs form itself, for ANY key, pending lemma (TC)'
      escapes_because: 'Recorded for honesty: until (TC) is derived, even the covered primitive is covered only conditionally (derivation.md 1.4).'
  yaml_parse_disclosure: >-
    Written without an interpreter; not machine-parsed by its author. Prose
    values are quoted or folded; no duplicate keys to the author's reading;
    no tabs.
