    time_exponent: 'max(gamma*(2-s)/4, s/2)'
    memory_exponent: 'max((2-s)/4, s/2)'
    beat_rho_boundary: 'gamma < 2/(2-s)'
  order_join_branch:
    nominal_point_on_surface: {gamma: 1, s: '2/3', time_exponent: '1/3', memory_exponent: '1/3'}
    placement_as_derived: >-
      Not a point on the surface. Conditional on (TC) (derivation.md 1.4),
      on eta + eta_prime < tau_0 (about 1/42, threshold.yaml), and on
      obligation AGS-1, a key realising the level-1 join at that soundness
      yields log_P(Q) in (log N)^{O(1)} evaluations of nu without using the
      four-list structure: exponent 0 off the surface. This is a
      CONDITIONAL COLLAPSE of the branch, not an achieved position.
    conditions: [TC_not_derived, eta_plus_eta_prime_below_tau_0, AGS-1_unopened]
    realized_position: 'no attack mounted; no point of the surface realized; realized exponents undefined'
    unconditional_claim: 'nothing below N^(1/2)'
  dominated_by:
    as_attack: >-
      None is mounted, so every frontier row of IDEA-20260901-a66d70
      dominates the realized position trivially. Re-listed: (1) parallel rho
      with distinguished points and negation, 0.886*sqrt(N), O(1) memory;
      (2) automorphism-discounted rho on CM curves; (3) BSGS, 2*sqrt(N) time
      and sqrt(N) memory; (4) van Oorschot-Wiener total work N^(1/2);
      (5) Pohlig-Hellman, not applicable, N prime; (6) MOV / Frey-Ruck, not
      applicable at large embedding degree; (7) SSSA, not applicable, N != p;
      (8) GHS / Weil descent, not applicable over a prime field; (9) Semaev
      over F_p, no proven advantage; (10) preprocessing S*T^2 = N, not
      applicable, no advice; (11) Kuhn-Struik multi-target, not applicable;
      (12) Shor, out of scope. Data and query axis: no oracle queries, no
      solve. Verdict on every row: no attack is mounted and no domination is
      asserted on any unknown or conditional axis (JPR-REV-3).
    as_static_contribution: >-
      Nearest incumbent IDEA-20260829-390ccc dominates on generality of the
      join class covered; this package is narrower (one primitive) and, as
      derived, weaker than the proposal claimed, since the all-pairs form of
      T2 is conditional on (TC). Labelled conditional.
    pareto_controls: {rho: '(1/2, 0), control only', bsgs: '(1/2, 1/2), control only'}
  sota_delta:
    realized_cryptanalytic_delta: {time: 0, memory: 0, data: 0}
    static_deltas:
      - id: join_class_delta
        label: conditional
        statement: 'The sorted range scan (cost L log L independent of fibre size) is outside every prior closure cost model in the lane and is addressed here for order keys; conditional on (TC).'
      - id: quantifier_delta
        label: conditional
        statement: '390ccc heuristic H3 (no cheap top-bits oracle) is replaced by a conditional theorem shape about all predeclared order keys; conditional on (TC) and AGS-1.'
      - id: conditional_exponent_delta
        label: conditional
        statement: 'The conditional exponent of the order-join branch moves from 1/3 to 0; conditional on (TC), eta + eta_prime < tau_0, and AGS-1. Unconditionally derived here instead: (U1), a coefficient of size N^(-1/6)/log N for some dilate of the key, which would give exponent Theta(1) through an SFT and is NOT an exponent-0 statement.'
    honesty_note: 'No delta above is realized; each is a statement about a hypothesised key that the record predicts does not exist.'
