      N_required=10 primary metric.
    - >-
      No independent review of J2 (interpretation/scope) or red-team
      falsification routes was performed; this report covers J1
      (correctness) only, per the assigned joint.
    - >-
      Wall-clock budget: the literal per-draw N=44310 recalibration in
