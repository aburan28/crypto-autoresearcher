    receipt"), a Validator must refuse to certify a working-tree-only
    producer receipt as admissible. `git status --porcelain` at review time
    shows execution_report.yaml, implementation.md, implementation/, and
    runs/ all as untracked ("??"); only the frozen specification.yaml and
    hypothesis were committed (at commit 88f0a034e). No Coordinator
    snapshot commit exists for the execution artifacts.
    (2) THE FROZEN CONTRACT WAS MUTATED IN PLACE, POST-EXECUTION, DURING
    THIS VERY REVIEW. While this review was in progress, commit
    7c81c68e138f0883d99a8688d4c05a092dc2063a ("fix(EXP-MONO-715694): repair
    degenerate null control, pairwise decision set, census row count,
    N3/N5 sample size, and D_4 support claim", author "Cursor Agent
    <cursoragent@cursor.com>" -- a different runtime/tool than this
    session) landed on this same branch, editing both
    experiments/EXP-MONO-715694/specification.yaml and
    ledger/hypotheses/H-MONO-819f2b.yaml IN PLACE, with `version:` left at
    `1` and `frozen:` left at `true`. No new run directory was created
    (runs/ still contains only RUN-MONO-715694-1 and -2, both executed
    against the ORIGINAL text at commit 88f0a034e), no protocol_amendment
    record exists, no ledger/decisions/*.yaml or ledger/handoffs/*.yaml
    references this fix, and no Coordinator decision record accompanies
    it (checked via grep across ledger/decisions, ledger/handoffs,
    coordination/bus/receipts -- no hits). Substantively, the edit:
      - lowers the search floor from N=10 to N=1 (exactly the range this
        review's own supplementary analysis, item 3 below, shows the
        predicted ordering actually lives in);
      - redefines NULL-1/NULL-2 to forbid the literal `sub_law == full_law`
        construction the Executor actually used (correctly, per the
        ORIGINAL text) and requires a genuine independent-second-S4-stream
        construction instead;
      - redefines the record's own falsification_criterion for the central
        ordering claim from "N_required(D4) not exceeding N_required(A4)"
        (a tie counts as falsified -- the ORIGINAL wording, which the
        Executor correctly applied to its own tied N_required=10 result and
        reported as a triggered falsification) to "N_required(D4) coming
        out STRICTLY BELOW N_required(A4)" (a tie is explicitly declared
        NOT a falsification under the new wording).
    Whatever the mathematical merit of these fixes (see per-item findings
    below -- two of the three are independently judged correct on the
    merits), editing a `frozen: true` experiment specification in place,
    after execution artifacts already exist against the original text, by
    a different tool/session, with no version bump, no
    protocol_amendment record, and no Coordinator decision, is a direct
    instance of the failure mode AGENTS.md core rule 2 and the "Durable
    research commits" section exist to prevent ("Results are immutable
    records... corrections create new records", never overwrite a frozen
    artifact). It also happens to soften the falsification bar for the
    exact metric whose original-wording verdict ("falsified: tie observed")
    was already known at edit time -- which is the shape of a finding this
    program's evidence-integrity rules treat as reportable regardless of
    intent. This review evaluates the EXECUTED run against the contract
    AS IT EXISTED AT EXECUTION TIME (commit 88f0a034e, cited correctly by
    execution_report.yaml's own `implementation_commit` field), which is
    the only contract text the artifacts under review can be judged
    against; it does not extend any verdict to the current, silently-
    amended specification.yaml/hypothesis text at HEAD.
  recommended_remedy: >-
    Coordinator should (a) make the snapshot commit for the actual executed
