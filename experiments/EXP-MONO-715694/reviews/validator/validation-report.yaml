  metric_recomputations:
    - id: STAGE0-EXACT-TABLES
      method: >-
        Fresh, independent script (v_stage0.py; does not import
        run_experiment.py), different code style (set-based orbit trace vs
        the Executor's boolean-array trace), enumerating all 24
        permutations of {0,1,2,3} and their 12 even sub-permutations.
      result: "S4 vec=[1,6,3,8,6]/24, A4 vec=[1,0,3,8,0]/12"
      matches_reported: true
    - id: STAGE0B-D4-FROM-REAL-DATA
      method: >-
        Same fresh script, independently reading and cycle-decomposing
        every row of BOTH RUN-MONO-a20e48-1 and -2's
        N1_k1_exhaustive.jsonl, excluding class==null rows.
      result: >-
        Both runs: total_rows=44521, excluded=211, non_ramified=44310,
        counts=[6105,11100,16050,0,11055], three_cycles_found=0.
      matches_reported: true
      note: Exact match to the Executor's reported figures, both runs.
    - id: LR-STATISTIC-AND-REJECTION-DIRECTION
      method: >-
        Blind analytic re-derivation (not reading run_experiment.py's
        comments beforehand for this step; done from the LR formula and
        KL-divergence identities alone): E[LR|data~S4] =
        -D_KL(P_S4||P_sub) = -infinity (P_sub assigns 0 to a category
        P_S4 has positive mass on, for both A4 and D4); E[LR|data~sub] =
        +D_KL(P_sub||P_S4) >= 0 (Gibbs' inequality, always non-negative).
      result: >-
        Confirms the Executor's chosen convention (LR > threshold =>
        classify "it's the subgroup", threshold = empirical 95th
        percentile of the S4-generated LR distribution) is the internally
        consistent, Neyman-Pearson-correct choice given the stated LR
        formula -- re-derived independently, not merely checked for
        plausibility.
      matches_reported: true
    - id: LR-MONTE-CARLO-AT-N10
      method: >-
        Independent re-implementation (v_lr.py), fresh RNG seed (99),
        LITERAL per-draw categorical sampling (deliberately NOT the
        Executor's O(1)-per-draw multinomial-shortcut, as an independent
        check on the claimed equivalence), 20,000 trials per side per
        pair, at N=10.
      result: >-
        S4-vs-A4: threshold=-1e18, power=1.00000, se=0.000000,
        fp_rate=0.00130. S4-vs-D4: threshold=-1e18, power=1.00000,
        se=0.000000, fp_rate=0.01825.
      matches_reported: >-
        Qualitatively exact (power=1.0, se=0.0, both), fp rates same order
        of magnitude and same ordering as reported (A4 0.0007/0.00130,
        D4 0.01675/0.01825) -- expected variation from independent RNG
        streams, not a discrepancy.
    - id: CHERNOFF-STEIN-CROSS-REFERENCE
      method: >-
        Independent recomputation of D_KL(A4||S4), D_KL(D4||S4) (using the
        independently-tabulated D4 law from Stage 0b) and
        ln(1/(alpha*beta))/D_KL with alpha=0.05, beta=0.01.
      result: >-
        D_KL(A4||S4)=0.6931471805599453 (=ln 2, exact), D_KL(D4||S4)=
        0.5501594905668814. Chernoff-Stein estimate: A4=10.965784284662085,
        D4=13.81581630394152.
      matches_reported: >-
        BIT-FOR-BIT IDENTICAL to the Executor's reported
        10.965784284662085 and 13.81581630394152. D_KL(D4||S4) < D_KL(A4||S4)
        genuinely holds, and since Chernoff-Stein N ~ 1/D_KL, this
        correctly produces D4's estimate > A4's estimate, confirming the
        predicted ordering direction at this (asymptotic, not literal-N)
        cross-reference metric.
    - id: STEP4B-REAL-DATA-CLASSIFICATION
      method: >-
        Independent script (v_step4b.py), independently tabulating N3
        histograms from raw jsonl (both runs) and N1's full 44,310-vector,
        independently recalibrating thresholds at N=2000 and N=44310
        (20,000 trials, literal per-draw sampling, fresh seed), then
        classifying.
      result: >-
        N3 run1: counts=[78,513,250,669,490] (used=2000, discarded=10).
        N3 run2: counts=[88,527,243,661,481] (used=2000, discarded=4).
        Both classify as NOT-A4 and NOT-D4 (i.e. S4) under both pairwise
        tests, both runs. N1 (both runs, identical vector
        [6105,11100,16050,0,11055]): NOT-A4, IS-D4.
      matches_reported: true
      note: >-
        All four forced-output classifications match the Executor's
        report exactly, via independently tabulated data and
        independently recalibrated thresholds (not reusing the
        Executor's threshold values).

  control_checks:
    - id: NULL-1-IDENTICAL-GROUP
      as_implemented_result: "false_positive_rate = 0.0 at every tested N, both runs"
      as_implemented_verdict: correct_arithmetic_but_degenerate_control
      finding: >-
        VALIDATOR FINDING (not a fabrication -- fully disclosed by the
        Executor in implementation.md -- but a genuine control-design gap
        that this review independently re-derives and confirms rather than
        just accepting the disclosure). As specified in the ORIGINAL
        frozen contract ("sub law set equal to the full law") and as
        implemented (`null1_check` calls `calibrate_and_measure_power(s4_law,
        s4_law, ...)`), the LR log-ratio table `log(P_sub(c)/P_full(c))` is
        IDENTICALLY ZERO for every category whenever P_sub and P_full are
        the same probability VECTOR -- this holds regardless of which RNG
        stream generates the sampled counts, so NULL-1/NULL-2 as
        implemented cannot depend on sample realization at all and are
        guaranteed to report false_positive_rate=0.0 by construction, never
        measuring the genuine question (does the empirical (1-alpha)-
        quantile threshold, estimated from one finite 20,000-trial S4
        batch, generalize to control the false-positive rate near
        alpha=0.05 when applied to a FRESH, independent, out-of-sample S4
        batch under the REAL S4-vs-A4 / S4-vs-D4 log-ratio tables). This is
        exactly the null-object-control gap this program's rules flag
        ("a quantity that does not decay/vary when it should is the
        canonical artifact tell" -- here the quantity cannot even IN
        PRINCIPLE vary, which is a stronger version of the same defect).
      independent_genuine_control_run: >-
        Supplementary check (v_null1_genuine.py): calibrated the REAL
        S4-vs-A4 and S4-vs-D4 log-ratio tables and thresholds from one
        20,000-trial S4 batch at N=10, then measured the classification
        rate of a SECOND, INDEPENDENT, out-of-sample 20,000-trial S4 batch
        (the genuine null-object construction the contract intended).
        Result: S4-vs-A4 out-of-sample FP=0.00105 (in-sample was 0.00075);
        S4-vs-D4 out-of-sample FP=0.01940 (in-sample was 0.01760). Both
        remain comfortably under alpha=0.05.
      conclusion: >-
        The SUBSTANTIVE conclusion NULL-1/NULL-2 were meant to support (no
        false-positive problem in the calibrated test construction) is
        independently CONFIRMED even under a properly-constructed
        null-object control -- but the as-implemented NULL-1/NULL-2 in the
        run under review did not actually test this and would have
        reported 0.0 regardless of whether a real problem existed. Note
        (see admissibility_finding) that the post-review fix commit
        7c81c68e1 independently identifies and proposes to correct exactly
        this defect in the specification text, which corroborates this
        finding but does not retroactively fix the run under review.
    - id: NULL-2-VARIANCE-BOUND
      finding: Same degeneracy and same independent-control resolution as NULL-1 above.
    - id: BOOTSTRAP-VS-SIMULATION-CROSSCHECK (Step 4a)
      as_implemented_result: "gap=0.0 at the only grid point tested, N=10 (both saturate at power=1.0)"
      finding: >-
        Correctly computed (bootstrap resampling literally from the real
        44,310-point pool, matching contract's requirement), but honestly
        disclosed by the Executor itself as a "degenerate agreement" since
        the contract's own N=10 floor never lands on a point where the
        power curve is still rising -- this review's item-3 finding below
        shows a genuinely informative Step 4a comparison would require
        floor-below-10 grid points, which the frozen v1 contract's own
        search_floor_N=10 precludes.
    - id: CROSS-RUN-CONSISTENCY
      result: >-
        Independently confirmed via byte-level diff of raw-result.json
        run1 vs run2 (see artifact_checks above): all reported
        figures agree exactly except seed-dependent Monte Carlo noise in
        two FP-rate fields (same order of magnitude, same conclusion).

