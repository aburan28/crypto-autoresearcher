  central_question_item3_finding: >-
    ITEM 3 -- THE CENTRAL QUESTION. Ran a SUPPLEMENTARY, clearly independent
    (not a modification of the frozen contract's own official N_required=10
    result, which correctly stands as reported under the ORIGINAL v1
    search_floor_N=10) exploratory Monte Carlo search over N in {1..9} for
    both pairs, using the identical LR-test procedure/calibration
    convention, fresh code (v_fine_grid.py, does not import
    run_experiment.py), the independently-derived A4/D4 laws, 20,000
    trials per candidate N, and TWO independent seeds (777 and 424242) for
    robustness.
    RESULT (both seeds agree exactly): N_required(S4_vs_A4)=5,
    N_required(S4_vs_D4)=8. The predicted ordering
    N_required(D4) > N_required(A4) DOES emerge, robustly, well below the
    frozen contract's own N=10 floor. Full power curve (seed 777): N=1..4
    A4 power=0.0 exactly (A4's own draws never contain an excluded
    category, so the calibration-derived threshold under-N=5 samples never
    admits a positive classification -- see mechanism below), D4 power
    rises smoothly 0.1365 -> 0.6914 over the same range; at N=5 A4 jumps
    to power=1.0 (se=0.0) while D4 is still at 0.812; D4 crosses 0.99
    between N=7 (power=0.978, se=0.001, seed1; 0.986, se=0.0008, seed2 --
    consistently just under 0.99 in BOTH seeds, not borderline noise) and
    N=8 (power=1.0, se=0.0).
    INDEPENDENT ANALYTIC CROSS-CHECK (a third, non-Monte-Carlo method):
    because the LR statistic here is driven almost entirely by whether an
    S4-generated sample of size N ever contains a cycle type the subgroup
    categorically excludes (which forces NEG_INF_CAP and hence a decisive
    classification), the crossover point is closed-form:
    N* = ceil( ln(alpha) / ln(1 - excluded_mass) ). A4's excluded mass
    (transposition+4-cycle) = 12/24 = 0.5 => N*=ceil(4.322)=5, EXACTLY
    matching the Monte Carlo crossover. D4's excluded mass (3-cycle only)
    = 8/24 = 0.3333 => N*=ceil(7.388)=8, EXACTLY matching the Monte Carlo
    crossover. This closed-form derivation independently explains BOTH the
    ordering (D4's smaller excluded mass needs proportionally more draws
    to be near-certain of observing it) and the specific integer values (5
    and 8), triangulating the Monte Carlo result via a completely
    different (combinatorial, not simulation-based) route.
    CONCLUSION ON THE CENTRAL PREDICTION: the frozen contract's own
    reported N_required=10-for-both-pairs tie is genuinely a
    resolution-ceiling artifact of the specific N=10 floor choice, exactly
    as the Executor's own interpretation_scope_note argued -- this review
    independently confirms that argument rather than merely accepting it.
    Once resolution is fine enough (below the floor the ORIGINAL v1
    contract happened to fix), the central prediction
    (imprimitive D_4 needs strictly more independent census draws than
    primitive A_4 to be statistically distinguishable from S_4) is
    GENUINELY SUPPORTED, confirmed by three independent methods (two
    Monte Carlo seeds plus one closed-form derivation), not merely
    asserted by secondary metrics. This finding is reported here as a
    VALIDATOR OBSERVATION about the underlying mathematical claim; it is
    explicitly NOT a modification of the frozen contract's own primary
    N_required metric (still correctly N_required=10 for both pairs,
    which is what was actually pre-registered and executed), and it
    renders no verdict on H-MONO-819f2b's status (Coordinator authority
    only, AGENTS.md rule 1).

