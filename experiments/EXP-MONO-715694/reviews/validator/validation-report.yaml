  admissibility_finding: >-
    NOT ADMISSIBLE AS A DURABLE RECEIPT YET, for two independent reasons,
    neither of which is the Executor's fault:
    (1) MISSING SNAPSHOT COMMIT. Per operating rules and agents/validator.md
