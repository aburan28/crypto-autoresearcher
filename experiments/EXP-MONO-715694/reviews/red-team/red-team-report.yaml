        agrees: true
      - quantity: "N_required at the frozen floor"
        record_says: "10 for both pairs, power 1.0, SE 0.0"
        i_get: >-
          confirmed and, more strongly, EXACT: power is exactly 1 at N=10 for both pairs,
          because the threshold IS the -inf sentinel and neither subgroup's law can ever
          produce the sentinel. The reported SE=0.0 is not a Monte Carlo accident.
        agrees: true

  # -------------------------------------------------------------------------
  objections:
    - id: OBJ-1
      severity: major
      title: >-
        THE CENTRAL PREDICTION IS TRUE AND THE RECORD COULD HAVE SHOWN IT
        EXACTLY, IN CLOSED FORM, WITHOUT ANY MONTE CARLO. Item 1.
      finding: >-
        Lifting the contract's frozen floor to N=1 and computing power EXACTLY
        by full enumeration of the multinomial support gives:
        N_required(S4-vs-A4) = 5 and N_required(S4-vs-D4) = 8.
        The imprimitive pair needs strictly more draws, ratio 1.6. Both answers
        lie BELOW the frozen floor N=10, which is why the primary metric could
        not see them. The full exact power curves are:
        A4 -- N=1..4 power 0.000 (the test cannot reject at all), N=5..15 power
        1.000 exactly; a step function, because cycle type determines parity in
        S_4 and A_4's law is exactly S_4 conditioned on the even classes, so the
        log-ratio is ln2 on every even class and -inf on every odd one: the
        statistic carries exactly ONE BIT per draw no matter how large N is.
        D4 -- power 0.1378, 0.3190, 0.5000, 0.6385, 0.8152, 0.9186, 0.9879,
        1.0000 at N=1..8; a genuine graded curve.
        Moreover there is a CLOSED FORM. For any proper subgroup H whose law
        excludes S_4-mass m, the test degenerates to "was an H-impossible cycle
        type observed", so size = (1-m)^N, power = 1 as soon as (1-m)^N <=
        alpha, and
            N_required = ceil( ln(alpha) / ln(1-m) ).
        I verified this against exact enumeration for five subgroups; it is
        exact in every case (A4 m=1/2 -> 5; D4-real m=1/3 -> 8; D4-Haar -> 8;
        C4 m=7/12 -> 4; V4 m=5/6 -> 2). The record's PRIMARY METRIC is a
        one-line formula. Its 2 x 20,000-trial Monte Carlo machinery was never
        the binding constraint and delivered strictly less resolution than the
        formula it never wrote down.
      what_it_does_not_do: >-
        This does NOT discharge the contract's falsification condition. That
        condition was written against the primary Monte Carlo metric on the
        frozen grid and it triggered as written; it stays triggered. My analysis
        is EXPLORATORY, outside the frozen protocol, and must not be substituted
        for the record's official N_required=10. It is grounds for a successor
        contract, not for a re-read of this one.

    - id: OBJ-2
      severity: major
      title: >-
        THE CHERNOFF-STEIN CROSS-REFERENCE IS DERIVED IN THE WRONG REGIME,
        OVER-PREDICTS BY 1.7-2.2x, AND SILENTLY CONTRADICTS THE RECORD'S OWN
        PRIMARY METRIC.
      finding: >-
        The reported values ln(1/(alpha*beta))/D_KL(P_sub||P_full) = 10.966 (A4)
        and 13.816 (D4) reproduce arithmetically -- I get the same -- but:
        (a) The Chernoff-Stein / Stein's-lemma exponent for type-II error at
        fixed type-I is D_KL(P_full||P_sub), not D_KL(P_sub||P_full). Here
        D_KL(P_S4||P_A4) and D_KL(P_S4||P_D4) are both +infinity, because each
        subgroup assigns zero to a class S_4 gives positive mass. The
        asymptotic the record invokes does not apply to its own object.
        (b) Consequently the formula badly mis-levels: true N_required is 5 and
        8; the formula says 11 and 14. It over-predicts by 2.2x and 1.7x.
        (c) MOST SERIOUSLY, both values EXCEED the frozen floor N=10. Taken at
        face value the cross-reference predicts the Stage-2 search should NOT
        have terminated at N=10 for either pair -- it directly contradicts the
        measured power=1.0 at N=10 that sits three lines above it in the same
        report. The report presents it as corroboration and does not flag the
        conflict. A cross-reference that disagrees with the primary measurement
        is a finding, not a footnote.
        (d) For completeness and fairness: I checked where the formula IS good.
        On a one-parameter family Q_t = (1-t)S4 + t*D4 with t<1 (fully
        supported, no zeros) the product N_required * D_KL(Q||S4) sits between
        7.6 and 8.2 against ln(1/(alpha*beta)) = 7.60 across four orders of
        magnitude in N -- but that agreement is a numerical coincidence of the
        chosen alpha=0.05, beta=0.01 with the local-asymptotic constant
        (z_0.95+z_0.99)^2 * 2D / (2D)^2 = 7.89/D, not a validation of the
        derivation. The formula is right for contiguous alternatives and wrong
        for this record's.
      correct_replacement: "N_required = ceil( ln(alpha) / ln(1-m) ), m = excluded S_4 mass."

    - id: OBJ-3
      severity: major
      title: >-
        THE "PRIMITIVE VS IMPRIMITIVE" FRAMING IS FALSIFIED BY A NEARBY-OBJECT
        CONTROL. N_required is ordered by excluded mass, not by primitivity.
      finding: >-
        H-MONO-819f2b, IDEA-20260815-711932 and the spec all frame the contrast
        as primitive (A_4) versus imprimitive (D_4), and predict imprimitive is
        harder. I ran the identical test construction against every transitive
        proper subgroup of S_4, exactly:
          A4  PRIMITIVE   order 12  excluded mass 0.5000  N_required 5
          D4  imprimitive order  8  excluded mass 0.3333  N_required 8
          C4  imprimitive order  4  excluded mass 0.5833  N_required 4
          V4  imprimitive order  4  excluded mass 0.8333  N_required 2
        Two imprimitive groups need FEWER draws than the primitive one. The
        ordering is a strictly decreasing function of excluded mass and is
        indifferent to primitivity. D_4 happens to be the transitive proper
        subgroup of S_4 with the SMALLEST excluded mass; that, not
        imprimitivity, is the whole mechanism. The record's own prose gets the
        mechanism right ("D_4's cycle-type support equals S_4's support") and
        then attaches the wrong label to it, and the label is what propagates
        into the prediction, the battery names and the `observation_collision`
        block of the proof_search_map.
      also: >-
        The same control retires `confounders` item 3. D_4-real (the non-Haar
        law measured from N1) and D_4-Haar (|class|/|G|) give the SAME
        N_required = 8, because they exclude the same class. The record's
        insistence on using the real law rather than the formula is
        methodologically sound but immaterial to its own headline metric, and
        saying so would have been cheap honesty.

    - id: OBJ-4
      severity: major
      title: >-
        NULL-1 AND NULL-2 ARE THE SAME DEGENERATE CHECK AND ARE BLIND TO EVERY
        CALIBRATION BUG BUT ONE. The record has no working evidence that its
        test attains its nominal size. Item 4.
      finding: >-
        First, the report's stated mechanism is wrong in a way that matters for
        diagnosis. It attributes the exact 0.0 to sub_law being "the identical
        Python object" as full_law. It is not object identity: I re-ran NULL-1
        with a DISTINCT list carrying identical values and got the identical
        thr=0, FPR=0.0, power=0.0. The cause is numerical EQUALITY of the two
        laws. An implementation that fixed the object-identity "problem" would
        change nothing.
        Second, and this is the real gap: I mutation-tested the control by
        corrupting the calibration inside the NULL-1 setup.
          quantile 0.95, strict '>'    (baseline)      FPR 0.00000  control silent
          quantile 0.50  (alpha=0.50!)                 FPR 0.00000  control silent
          quantile 0.05  (wrong tail)                  FPR 0.00000  control silent
          quantile 0.00  (no calibration at all)       FPR 0.00000  control silent
          tie rule '>=' instead of '>'                 FPR 1.00000  control FIRES
        NULL-1 as executed detects exactly one bug -- the tie rule -- and is
        blind to a silently mis-set alpha, to the wrong tail, and to no
        calibration at all. NULL-2 is byte-identical in construction
        (`calibrate_and_measure_power(s4_law, s4_law, ...)`), so the record has
        ONE degenerate control reported twice, not two independent ones, and
        NULL-2's stated purpose ("bound the estimator's own variance") is
        entirely unmet: the variance of a point mass is zero by construction.
        The record's `falsification_conditions` treat "NULL-1 shows no
        separation" as a pass; it is a pass that could not have failed for any
        reason the control was created to catch.
      severity_qualifier: >-
        This is a gap in evidentiary value, not a demonstration that the test is
        broken. I supply the missing evidence directly under required_controls
        RC-1: with a genuinely near-null sub law the empirical size lands on
        0.0494-0.0500 at N in {100, 1000, 10000, 44310}. The calibration does
        work. The record just never showed it.

    - id: OBJ-5
      severity: major
      title: >-
        STEP 4A CANNOT DETECT WHAT HEUR-MONO-CONV-1 SAYS IT DETECTS, AT ANY N.
        The degeneracy is structural, not a consequence of the N=10 floor.
      finding: >-
        HEUR-MONO-CONV-1's declared gap is "whether the i.i.d. simulation model
        matches the ACTUAL correlation structure of the real census". Step 4a
        tests it by drawing UNIFORMLY WITH REPLACEMENT from the pooled 44,310
        points. That resample is i.i.d. from the empirical law BY CONSTRUCTION;
        it destroys the ordering, which is the only place correlation could
        live. The comparison is therefore guaranteed to agree whatever the real
        census does. The Executor discloses the agreement is "degenerate ...
        both hit the ceiling" at N=10 and says a grid with smaller N would be
        informative. It would not: I ran the identical i.i.d. bootstrap at
        N=1..9 against my EXACT synthetic power and the gaps are
        -0.0016, -0.0054, -0.0001, +0.0013, -0.0030, +0.0006, +0.0005, 0, 0
        -- agreement to within Monte Carlo noise at every N, including the ones
        where power is 0.14, 0.32, 0.50. Step 4a is vacuous across the whole
        range, not only at the ceiling.
      what_the_missing_control_finds: >-
        I ran the control the record should have run -- CONTIGUOUS-BLOCK
        resampling in the file's own (e1,e2) order, which preserves whatever
        correlation exists -- with an order-shuffled null object of the same
        shape, using disjoint (non-overlapping) windows so the variance
        estimate is honest. Statistic: the identity count in a window of size N,
        against the binomial variance N p(1-p) with finite-population
        correction, p = 0.137779.
          N=10   real/theory 0.967   shuffled-null 1.004
          N=50   real/theory 0.827   shuffled-null 1.056
          N=100  real/theory 0.669   shuffled-null 1.029
          N=211  real/theory 0.540   shuffled-null 0.979
        (p = 211, so N=211 is exactly one e1 row; I do not claim the N=500 point,
        where only 88 disjoint windows remain and the shuffled null itself reads
        0.786, i.e. my estimator has stopped being reliable.) Direct structural
        confirmation: the 211 per-e1-row identity counts have variance 6.97
        against a binomial 24.95 -- a ratio of 0.28 -- and range only over
        23..35 where i.i.d. sampling would give a far wider spread.
        CONCLUSION: the archived N1 point-parametrized census is significantly
        UNDER-DISPERSED relative to i.i.d., the effect survives the null-object
        control, and HEUR-MONO-CONV-1 is measurably FALSE AS STATED for the
        N1-style member. It is false in the conservative direction (structured
        sampling is more informative per draw than i.i.d., not less), and N1 is
        exhaustive anyway so no verdict depends on it, and the N3/N5-style
        members the record actually targets draw independent coefficients where
        i.i.d. is far more plausible. So this does not overturn anything. What
        it does overturn is the claim that Step 4a validated the heuristic. The
        heuristic remains untested by this record, and one measurement outside
        it says it is wrong.

    - id: OBJ-6
      severity: moderate
      title: >-
        STEP 4B'S CLASSIFIER CERTIFIES "NOT S_4", NOT "IS D_4". Proves-too-much.
        Item 5.
      finding: >-
        At N=2000 the recalibrated threshold is the -inf sentinel, so the
        classifier reduces to "did I observe a 3-cycle". Running my independent
        implementation on synthetic samples of size 2000:
          resampled from D4  counts [287,466,726,0,521]  LR +1115.5  -> SUBGROUP
          real N3 run1       counts [78,513,250,669,490] LR -inf     -> S4
          real N3 run2       counts [88,527,243,661,481] LR -inf     -> S4
          resampled from V4  counts [515,0,1485,0,0]     LR +2195.9  -> "D4"   (FALSE)
          resampled from C4  counts [480,0,506,0,1014]   LR +1110.3  -> "D4"   (FALSE)
          S4 conditioned on no 3-cycle (not a group law)  LR  +558.2  -> "D4"   (FALSE)
          all 2000 draws are transpositions (not any group law) LR +4.1 -> "D4" (FALSE)
          resampled from A4  counts [158,0,491,1351,0]   LR -inf     -> "S4"   (FALSE)
        The good news, and it is real: the classifier is NOT a rubber stamp.
        Over 2,000 replicates it flags 100.00% of genuine D4 samples and 0.00%
        of genuine S4 samples at N=2000. Step 4b's clean pass on the real N3
        data is a genuine pass and the four forced outputs are genuinely met.
        The finding is about what the pass licenses. A sample of 2000 draws all
        of which are transpositions -- an event of probability 0.2505^2000 under
        D_4, i.e. impossible at any scale -- still scores LR = +4.1 > -inf and
        is labelled D_4. The contract's forced_output "classifies as D_4 (not
        S_4, not A_4)" reads as a three-way identification and is not one; a
        simple-vs-simple LR test can only decline to favour S_4 against ONE
        named alternative. The A_4 row shows the complementary failure: a
        genuine proper subgroup that DOES produce 3-cycles is labelled "S_4" by
        the S4-vs-D4 test.

    - id: OBJ-7
      severity: minor
      title: "`implementation_commit` names a commit that does not contain the implementation."
      finding: >-
        `git cat-file -e 88f0a034...:experiments/EXP-MONO-715694/implementation/run_experiment.py`
        fails: the file was untracked at run time. The manifest's `code.commit`
        and the report's `implementation_commit` therefore do not pin the code
        that ran; `git checkout 88f0a03` reproduces the spec and not the run.
        The Executor DOES disclose that the artifacts are not yet committed
        (`implementation_commit_note`), so this is a naming and binding defect
        rather than a misstatement. Remedy: carry
        `implementation_sha256: 7bce891659b21c320ae06ef84f053c50647716ee7973994f01aa1929876a19d4`
        beside the commit id, and let the Coordinator's snapshot commit be the
        binding one.

    - id: OBJ-8
      severity: minor
      title: "Reported Monte Carlo SE = 0.0 is a formula artifact; two dead-code defects."
      finding: >-
        (a) `power_se = sqrt(p(1-p)/n)` returns exactly 0.0 at p=1, which reads
        as "zero uncertainty" rather than "the binomial SE formula is degenerate
        at the boundary". A Clopper-Pearson lower bound (0.99985 at 20,000/20,000)
        would have been honest and, uniquely here, would have made no difference,
        because I show power is EXACTLY 1 for structural reasons. Harmless in
        this record; a trap if the idiom is reused where power is near but not
        at 1.
        (b) `bootstrap_power_curve` (line 497) is dead code that raises
        NotImplementedError and its docstring states the OPPOSITE rejection
        direction ("classified as 'sub' (D4) i.e. below threshold") from the one
        actually implemented. The live function `bootstrap_power_curve_with_thresholds`
        counts `lr > threshold` into a variable named `below`. A later reader
        auditing direction-of-rejection can land on either of these first. Given
        that direction-of-rejection is the single highest-risk decision in this
        record (OBJ/item 3), leaving a stale opposite-direction docstring in the
        file is a real hazard.

  # -------------------------------------------------------------------------
  rejection_direction_check:   # item 3 -- reported separately because it could have inverted the record
    question: >-
      Is the Executor's resolution of the handoff's self-contradiction correct?
      It implemented threshold = empirical 0.95 quantile of the S4-generated LR
      distribution, rejecting "it's S_4" (i.e. classifying as the subgroup) when
      LR > threshold. The handoff's prose elsewhere said the opposite.
    method: >-
      A two-category toy small enough to check by hand, plus exact enumeration
      of BOTH conventions at several N, plus both conventions applied to the
      real pairs. P_full = (1/2, 1/2); P_sub = (3/4, 1/4); per-draw log ratios
      ln(3/2) = +0.405465 on category A and ln(1/2) = -0.693147 on category B.
    hand_check_N4:
      table: >-
        k = #A:  LR = k*0.405465 + (4-k)*(-0.693147);  P_null(k) = C(4,k)/16;  P_sub(k)
        k=0  LR = -2.772589   P_null 1/16    P_sub 0.003906
        k=1  LR = -1.673976   P_null 4/16    P_sub 0.046875
        k=2  LR = -0.575364   P_null 6/16    P_sub 0.210938
        k=3  LR = +0.523248   P_null 4/16    P_sub 0.421875
        k=4  LR = +1.621860   P_null 1/16    P_sub 0.316406
      reading: >-
        LR is strictly INCREASING in k, and k counts the category the SUB law
        favours (3/4 vs 1/2). Large LR is therefore evidence FOR the sub law.
        Rejecting the null for LARGE LR is Neyman-Pearson correct. The handoff's
        prose aside is backwards; the Executor is right.
    exact_two_convention_comparison:
      toy_2_category:
        - {N: 10, size_UP: 0.01074, power_UP: 0.24403, size_DOWN: 0.01074, power_DOWN: 0.00003}
        - {N: 20, size_UP: 0.02069, power_UP: 0.61717, size_DOWN: 0.02069, power_DOWN: 0.00000}
        - {N: 40, size_UP: 0.04035, power_UP: 0.94556, size_DOWN: 0.04035, power_DOWN: 0.00000}
        - {N: 80, size_UP: 0.04646, power_UP: 0.99896, size_DOWN: 0.04646, power_DOWN: 0.00000}
      real_pairs_at_N10:
        - {pair: S4_vs_A4, size_UP: 0.00098, power_UP: 1.00000, size_DOWN: 0.00000, power_DOWN: 0.00000}
        - {pair: S4_vs_D4, size_UP: 0.01734, power_UP: 1.00000, size_DOWN: 0.00000, power_DOWN: 0.00000}
    conclusion: >-
      CONFIRMED CORRECT, with margin. Under the Executor's convention power
      rises monotonically to 1 exactly as Neyman-Pearson requires. Under the
      handoff's prose convention power collapses to ~0 and, at N >= 20, falls
      strictly BELOW its own size -- an anti-informative test, worse than a coin
      flip at the same level. Applied to the real pairs the prose convention
      would have given power 0.00000 for BOTH, i.e. "N_required not reached by
      the search ceiling", inverting the entire record. The Executor took the
      one judgment call in this experiment that could have destroyed it, took it
      correctly, and disclosed it in full. That should be recorded as a credit,
      not merely as a deviation.

