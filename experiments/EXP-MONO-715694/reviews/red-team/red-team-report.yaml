  role: red-team
  joints_owned: [J2-adversarial-verification]
  reviewed_at: '2026-08-30'
  id_allocation_provenance: >-
    tools/allocate_id.py has no `redteam` record type (RT-* is not a ledger
    namespace), so the 6-hex token was minted with `secrets.token_hex(3)` --
    which scans no committed state, exactly the property AGENTS.md rule 14
    requires -- and then confirmed free with
    `python3 tools/allocate_id.py --check RT-20260830-909b4e`
    (0 occurrences across 91,788 identifier-bearing paths).

  # -------------------------------------------------------------------------
  claim_under_review: >-
    EXP-MONO-715694's execution report: (a) that N_required -- the smallest N
    at which a calibrated likelihood-ratio test reaches 99% power at 5%
    false-positive rate -- saturates at the frozen contract's own search floor
    N=10 for BOTH the S4-vs-A4 and the S4-vs-D4 pair, in both runs, at
    power=1.0 with Monte Carlo SE=0.0; (b) that the contract's central
    pre-registered ordering prediction N_required(S4-vs-D4) >
    N_required(S4-vs-A4) is therefore NOT confirmed by the primary metric and
    its named falsification condition is triggered as written; (c) that the
    ordering nevertheless plausibly holds BELOW the frozen floor, argued from
    two secondary metrics (a Chernoff-Stein cross-reference A4~=10.97 vs
    D4~=13.82, and the false-positive rate at N=10, A4=0.0007 vs D4=0.01675);
    (d) that NULL-1/NULL-2, Step 4a and Step 4b all pass.

  verdict: holds_with_finding

  verdict_statement: >-
    EVERY NUMBER THE RECORD REPORTS IS INDEPENDENTLY REPRODUCED. Writing fresh
    code that shares no line with the Executor's, I re-enumerated S4 and A4,
    re-derived D4's law by cycle-decomposing all 44,310 non-ramified `perm`
    tuples from BOTH archived a20e48 runs, re-tabulated N3's histograms from
    the `shape` field rather than the `label` string, and recomputed the N1
    log-likelihood ratio: all match to the reported precision. The one
    judgment call that could have inverted the entire record -- the
    rejection-region direction -- is CORRECT, and I show by exact enumeration
    that the alternative reading would have driven power to ~0 for both pairs.
    The Executor's "it is a search-floor artifact" explanation is also
    CORRECT: lifting the floor to N=1 and computing power EXACTLY (no Monte
    Carlo) gives N_required(S4-vs-A4)=5 and N_required(S4-vs-D4)=8, so the
    imprimitive pair does need strictly more draws, by a factor 1.6, and the
    frozen contract simply placed its floor above both answers.
    THE FINDINGS ARE THAT THE RECORD IS RIGHT FOR REASONS IT DID NOT ESTABLISH,
    AND THAT ITS CONTROL BATTERY IS LARGELY VACUOUS. Specifically: (1) the
    Chernoff-Stein cross-reference offered as support for the ordering is
    derived in a regime whose hypotheses fail here, over-predicts N_required by
    2.2x/1.7x, and -- unremarked -- CONTRADICTS the record's own primary metric
    by predicting N>=11 and N>=14 when power was measured as 1.0 at N=10;
    (2) the "primitive vs imprimitive" framing is falsified by a nearby-object
    control -- N_required is ordered by the S4-mass a subgroup EXCLUDES, not by
    primitivity, and two imprimitive groups (V4: 2 draws, C4: 4 draws) beat the
    primitive A4 (5 draws); (3) NULL-1 and NULL-2 are the SAME degenerate check
    and my mutation test shows both stay at 0.0 even when alpha is silently set
    to 0.50 or the wrong tail is used, so the record carries no working evidence
    that its calibration ever attains its nominal size; (4) Step 4a cannot
    detect what HEUR-MONO-CONV-1 says it detects -- uniform with-replacement
    resampling is i.i.d. BY CONSTRUCTION, so it agrees with the i.i.d.
    synthetic at every N, not only at the degenerate N=10 -- and a block-
    resampling control I ran against an order-shuffled null shows the real N1
    stream IS significantly non-i.i.d.; (5) Step 4b's N=2000 classifier is a
    one-bit "did I see a 3-cycle" test that labels V4-, C4- and even
    all-transposition samples as "D4". None of these breaks the record's
    reported observations. All of them bear on how the Coordinator may read
    them.

  # -------------------------------------------------------------------------
