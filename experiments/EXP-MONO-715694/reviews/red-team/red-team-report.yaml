  counterexample_or_mutation: >-
    THE CHEAPEST SINGLE MUTATION THAT EXPOSES THE MOST: change the frozen search
    floor from N=10 to N=1 and replace the 20,000-trial Monte Carlo with exact
    enumeration of the multinomial support for N <= 20. Cost: milliseconds,
    fewer lines of code than the Monte Carlo it replaces, and no new data. It
    converts the record's headline from "N_required saturates at the floor for
    both pairs, central prediction not confirmed" into "N_required = 5 and 8,
    central prediction confirmed with ratio 1.6, exactly, with zero Monte Carlo
    error" -- and it simultaneously kills the Chernoff-Stein cross-reference
    (OBJ-2) by making it checkable. Second cheapest: run NULL-1 with a near-null
    rather than an equal sub law (RC-1); it is a one-line change and it is the
    difference between a control that cannot fail and one that measures the
    nominal size. Third: add V_4 to the battery (RC-4); one extra group law and
    the primitivity framing falls out immediately.

  # -------------------------------------------------------------------------
  baseline_comparison:
    pollard_rho: >-
      NOT APPLICABLE, and I checked rather than assumed. `grep -niE
      'ecdlp|discrete log|pollard|bsgs|rho|relation rate|speedup|exponent|attack'`
      over execution_report.yaml, implementation.md and run_experiment.py
      returns ZERO matches. No group-order, relation-rate, or curve quantity
      appears anywhere in the producer artifacts. There is no attack cost to
      compare against a baseline because no attack is proposed.
    bsgs: "Not applicable, same reason."
    closest_specialized_baseline: >-
      The correct incumbent for this record is NOT "nothing exists here" (the
      idea record's `dominated_by` prose). It is elementary classical
      statistics, in two rows:
      ROW 1 -- the exact closed form. Because a proper subgroup H of a finite
      group G never meets every conjugacy class of G (G is not a union of
      conjugates of a proper subgroup: |union| <= [G:H](|H|-1)+1 < |G|), and
      because the conjugacy classes of S_n ARE the cycle types, the LR test of
      "S_n" against any proper subgroup is a support test to first order, and
      N_required = ceil(ln(alpha)/ln(1-m)). Exact; O(1) time; O(1) memory; no
      seed; no sampling error; resolves at N=1 granularity.
      ROW 2 -- local asymptotics for contiguous alternatives:
      N ~ (z_{1-alpha}+z_{power})^2 * sigma^2 / J^2 with J the Jeffreys
      divergence, which is what actually governs the fully-supported family in
      RC-2 and which the record's Chernoff-Stein formula approximates by
      numerical coincidence at alpha=0.05, beta=0.01.
    dominated_by_finding: >-
      OBJECTION, and it is the one I would put in front of the Coordinator
      first on Pareto grounds. IDEA-20260815-711932 carries
      `dominated_by: "CHECKED ACROSS EVERY AXIS ... As a census power analysis:
      none exists here. Not null on any axis."` That is not right. On the census
      power-analysis axis the record IS dominated, on every axis at once, by
      ROW 1 above: the closed form is exact where the Monte Carlo is an
      estimate, is O(1) where the Monte Carlo is 2 x 20,000 trials per grid
      point, and RESOLVES BELOW THE FLOOR THE MONTE CARLO COULD NOT REACH --
      which is precisely the resolution the record found itself missing. The
      `sota_delta` should be restated: the delta this record actually delivers
      over the closed form is the D_4 law measured from real archived data
      rather than assumed, plus the four real-sample classifications. Those are
      genuine and the closed form does not supply them. The N_required numbers
      are not part of the delta.
    invariance_cost_check: >-
      Per KN-LIT-7593, an eliminated search dimension is not a speedup until
      the invariant's own cost is charged. Nothing is eliminated here and no
      precomputation is claimed, so this check is vacuous for this record and I
      record that it was run and found inapplicable rather than skipping it.

