  independent_reproduction:
    method: >-
      Fresh code, written from the statement of each quantity and the raw data
      only; the Executor's run_experiment.py was read for auditing AFTER my own
      enumeration was already producing numbers, and no line of it was reused.
      Where N is small enough (N <= 15, five categories, at most C(19,4)=3876
      count vectors) I computed power and size EXACTLY by enumerating the whole
      multinomial support with exact rationals, rather than by Monte Carlo.
    results:
      - quantity: "S_4 cycle-type vector"
        record_says: "[1,6,3,8,6]/24"
        i_get: "[1,6,3,8,6]/24 (brute force over all 24 permutations, own cycle tracer)"
        agrees: true
      - quantity: "A_4 cycle-type vector"
        record_says: "[1,0,3,8,0]/12"
        i_get: "[1,0,3,8,0]/12 (own inversion-count parity, no library)"
        agrees: true
      - quantity: "D_4 law from RAW perm tuples, run 1 and run 2"
        record_says: "[6105,11100,16050,0,11055] / 44310, both runs, 211 ramified excluded"
        i_get: "identical in both runs; 0 three-cycles; every perm a valid permutation of {0,1,2,3}"
        agrees: true
      - quantity: "D_4-internal class -> S_4 cycle type fusion (spec's verified_field_mapping)"
        record_says: "block_swap_involution->(2,2); sigma1_sigma2->(2,2); sigma_i->(2,1,1); four_cycle->(4); identity->(1^4)"
        i_get: >-
          confirmed exhaustively: block_swap_involution 11100 -> double_transposition,
          sigma1_sigma2 4950 -> double_transposition, sigma_i 11100 -> transposition,
          four_cycle 11055 -> four_cycle, identity 6105 -> identity
        agrees: true
      - quantity: "N3 histograms (both runs)"
        record_says: "[78,513,250,669,490] and [88,527,243,661,481], used=2000, discarded=10/4"
        i_get: >-
          identical, re-derived from the `shape` field (e.g. [[1,2],[2,1]] -> (2,1,1))
          rather than the `label` string; 0 label/shape mismatches across all 4,014 rows
        agrees: true
      - quantity: "N1 exhaustive LR under the S4-vs-D4 statistic"
        record_says: 24377.56702701852
        i_get: 24377.56702702
        agrees: true
      - quantity: "false-positive rate at N=10"
        record_says: "A4 0.0007 / 0.00085 ; D4 0.01675 / 0.01635 (20,000-trial Monte Carlo)"
        i_get: >-
          EXACT values are (1-m)^10 with m the excluded S4 mass: A4 = 0.5^10 =
          0.00097656, D4 = (2/3)^10 = 0.01734153. The four Monte Carlo estimates sit
          -1.25, -0.57, -0.64 and -1.07 binomial SE below exact. All four are on the low
          side, consistent with the type-7 interpolated quantile at q=0.95 on n=20,000
