  narrowest_supported_statement: >-
    For the two named group pairs (S_4 vs A_4, S_4 vs D_4) acting on 4 points,
    under a likelihood-ratio test on the 5-way S_4 cycle-type vector with
    threshold at the 0.95 quantile of the S_4-generated statistic and rejection
    for LARGE likelihood ratio, and with D_4's law taken exactly from the 44,310
    non-ramified points of EXP-MONO-a20e48's archived N1 exhaustive census:
    (1) the Monte Carlo search prescribed by the frozen contract reports
    N_required = 10 for both pairs at power 1.0, which is the contract's own
    search floor, so the contract's pre-registered ordering prediction is not
    confirmed by its primary metric and its named falsification condition
    triggered as written;
    (2) all four real-data classifications match their forced outputs, and my
    independent implementation reproduces every reported figure;
    (3) the rejection-region direction chosen by the Executor is
    Neyman-Pearson-correct and the alternative reading would have driven power
    to zero for both pairs;
    (4) EXPLORATORY, OUTSIDE THE FROZEN PROTOCOL: with the floor lifted to N=1
    and power computed exactly, N_required is 5 for S_4-vs-A_4 and 8 for
    S_4-vs-D_4, so the ordering prediction is true for this pair at a resolution
    the frozen grid could not reach; and the ordering is governed by excluded
    cycle-type mass rather than by primitivity, since the imprimitive V_4 and
    C_4 require 2 and 4 draws respectively;
    (5) whichever figure is used, the lane's actual spend (S=2,000-10,000 for
    Chebotarev-density members; exhaustive for point-parametrized members)
    exceeds the requirement by more than two orders of magnitude, so the worry
    IDEA-20260815-711932 raised is retired cheaply for the tested pairs;
    (6) NOTHING here is evidence about any curve, any field, any monodromy
    verdict, any relation rate, or any ECDLP quantity, and nothing here changes
    the status of H-MONO-59f6a6, H-MONO-0b3def, H-MONO-0f9170, or any other
