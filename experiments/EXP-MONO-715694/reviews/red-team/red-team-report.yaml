  # -------------------------------------------------------------------------
  spawned_reading:   # red-team.md responsibility 8: read the obstruction as a resource
    obstruction_as_measured: >-
      "The test separates instantly, so the census-power question is not live
      for this lane" -- measured as N_required saturating at the search floor.
    resource_reading: >-
      The instant separation is not a defect of the instrument; it is a theorem
      about the object, and it generalises far past degree 4. For ANY finite
      group G and proper subgroup H, G is not the union of the conjugates of H
      (|union| <= [G:H](|H|-1)+1 < |G|), so H misses at least one conjugacy
      class of G. Taking G = S_n, whose conjugacy classes are exactly the cycle
      types, EVERY proper subgroup of S_n misses at least one cycle type. Hence
      a Chebotarev cycle-type census testing "the monodromy group is all of S_n"
      against any proper-subgroup alternative is, to first order, a SUPPORT test
      and not a density comparison, and its draw requirement is the
      coupon-collector quantity
          N_required(H) = ceil( ln(alpha) / ln(1 - m_H) ),
      m_H = the S_n-mass of the cycle types H omits, with no dependence on the
      fine density structure at all. The hard case is the subgroup with the
      SMALLEST omitted mass, which is a purely group-theoretic optimisation over
      the subgroup lattice of S_n and is computable once per degree. That
      converts this record's "toy, degree 4 only" scope into a candidate general
      lemma covering any degree the lane might later census, and it replaces
      "run a Monte Carlo power study per census" with "compute min_H m_H once".
    status: >-
      CANDIDATE FOR THE RANKING, NOT EVIDENCE. It changes no status on its own.
      I verified the m_H -> N_required formula exactly against enumeration for
      the four proper transitive subgroups of S_4 only; the group-theoretic step
      is recalled standard finite group theory, provenance `recalled`,
      verified_by: null, and it needs an independent check before any record
      leans on it.
    spawned_ids: []

