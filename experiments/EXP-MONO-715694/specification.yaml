experiment:
  id: EXP-MONO-715694
  hypothesis_id: H-MONO-819f2b
  version: 1
  title: >-
    Census-convergence power analysis: does this lane's actual sample size
    resolve S_4 from its proper subgroups A_4 and D_4?
  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-08-30'
  coordinator_approval_rationale: >-
    APPROVED under the identical precedent already established and
    user-confirmed for the three sibling contracts EXP-MONO-4c7479,
    EXP-MONO-2a13d7, and EXP-MONO-a20e48: this is a small, standalone
    experiment under the classic lifecycle (docs/task-lifecycle.md steps
    3-7), not a GOAL-MONO-001 campaign batch. It draws on no part of that
    goal's exhausted campaign budget (maximum_batches: 3, already spent);
    it makes no relation-rate claim and touches no live GOAL-MONO-001
    next_action. Pure combinatorics/statistics simulation plus reading two
    already-archived JSON artifacts (EXP-MONO-a20e48's N1/N3 per-point
    logs); no field arithmetic, no curve construction, negligible compute,
    matching the source proposal's own `estimated_cost: implementation
    low, compute low`.
  objective: >-
    Determine, for two named group pairs (S_4-vs-A_4, S_4-vs-D_4) acting on
    4 points, the minimum number of independent cycle-type census draws
    (N_required) a Neyman-Pearson-optimal likelihood-ratio test needs to
    reach 99% power at 5% false-positive rate — and compare N_required
    against the actual sample sizes this lane's protocol has spent
    (S=2,000 for Chebotarev-density members like N3/N5; exhaustive
    p^2=44,521 for point-parametrized members like N1). Validate the
    simulation model itself against real archived data via bootstrap
    resampling (Step 4a) and direct real-sample classification (Step 4b).
    Produces observations only; renders no verdict on H-MONO-819f2b.

  what_this_is_not: >-
    NOT a new mathematical result about any curve, field, or monodromy
    group. NOT a re-examination of any exact-closure census member
    (N1/N2/N2-twin/N4-style in H-MONO-0b3def/H-MONO-59f6a6) — both prior
    independent reviewers already established those are
    existence-proof-grade, immune to sampling risk, and this record does
    not revisit that finding. NOT an ECDLP, relation-rate, or exponent
    claim in either direction. NOT a status change to H-MONO-0b3def,
    H-MONO-0f9170, or H-MONO-59f6a6 — a finding here (e.g. that N3/N5's
    S=2,000 is under-powered) would name a concrete follow-up, never
    silently retract a already-`supported` record.

  inputs:
    real_data_sources:
      - path: experiments/EXP-MONO-a20e48/runs/RUN-MONO-a20e48-1/per_base_point_log/N1_k1_exhaustive.jsonl
        role: "D_4 ground-truth cycle-type law + bootstrap resampling source (Step 1, Step 4a)"
        fields_used: ["perm (4-tuple, e.g. [2,3,0,1])", "class (used only to exclude ramified points, stratum=='i', class is null)"]
        note: >-
          44,521 rows total; 211 have class=null (ramified, stratum "i") and
          are EXCLUDED from the census exactly as the source contract
          excluded them; the remaining 44,310 rows each carry a genuine
          `perm` 4-tuple to cycle-decompose directly. Read-only; never
          modified.
      - path: experiments/EXP-MONO-a20e48/runs/RUN-MONO-a20e48-2/per_base_point_log/N1_k1_exhaustive.jsonl
        role: "second independent exhaustive D_4 census, cross-check that Step 1's derived law is run-independent (it must be, since k=1 exhaustive is deterministic/seed-free by the source contract's own design)"
      - path: experiments/EXP-MONO-a20e48/runs/RUN-MONO-a20e48-1/per_base_point_log/N3_k1.jsonl
        role: "real S_4 sample, run 1, Step 4b classification target"
        fields_used: ["label (already an S_4 cycle-type string: '1^4','2.1.1','2^2','3+1','4')", "discarded (exclude discarded==true rows)"]
      - path: experiments/EXP-MONO-a20e48/runs/RUN-MONO-a20e48-2/per_base_point_log/N3_k1.jsonl
        role: "real S_4 sample, run 2, Step 4b classification target"
    verified_field_mapping: >-
      Confirmed by the Coordinator directly against the real files before
      approval (not assumed): N1's perm tuples cycle-decompose as
      block_swap_involution -> (2,2) [double-transposition],
      sigma1_sigma2 -> (2,2) [double-transposition, the SAME S_4 cycle
      type as block_swap_involution — these two D_4-internal classes fuse
      under the S_4 cycle-type projection], sigma_i -> (2,1,1)
      [transposition], four_cycle -> (4), identity -> (1,1,1,1). No
      instance of a 3-cycle is possible for D_4 (confirmed by group theory
      in `heuristic_assumptions`, and to be confirmed exhaustively by the
      Executor's own tabulation over all 44,310 non-ramified points as a
      Stage-0 gate). N3's `label` field already uses S_4 cycle-type
      notation directly (`1^4`=identity, `2.1.1`=transposition,
      `2^2`=double-transposition, `3+1`=3-cycle, `4`=4-cycle) — no
      re-derivation needed for N3, only tabulation.

  controls:
    - id: NULL-1-IDENTICAL-GROUP
      description: >-
        Run the identical Step-2 LR-test procedure with the "sub" law set
        equal to the "full" law (S_4 vs an independently-drawn second S_4
        stream). A materially nonzero apparent separation rate above the
        calibrated alpha=0.05 at any tested N is a false-positive problem
        in the test construction and voids every N_required figure in this
        record.
    - id: NULL-2-VARIANCE-BOUND
      description: >-
        Report the empirical false-positive rate of the calibrated
        S_4-vs-S_4 test at N in {100, 1000, 10000, 44310} to bound the
        test's own variance across the full range of N this record uses,
        independent of any group-separation claim.
    - id: BOOTSTRAP-VS-SIMULATION-CROSSCHECK
      description: >-
        Step 4a: resample (with replacement) sub-samples of size N
        directly from the real 44,310 non-ramified N1 data points (run 1),
        cycle-decomposed, at every N in the Step-2 search grid; compare the
        resulting empirical power against the synthetic i.i.d. Monte Carlo
        simulation's power at the same N. This is the record's test of its
        own load-bearing assumption (HEUR-MONO-CONV-1).
    - id: CROSS-RUN-CONSISTENCY
      description: >-
        Confirm N1's derived D_4-in-S_4-cycle-type law is identical
        between RUN-MONO-a20e48-1 and RUN-MONO-a20e48-2's k=1 exhaustive
        logs (both are deterministic, seed-free, exhaustive censuses per
        the source contract, so they must match exactly; a mismatch is
        `failed_infrastructure`, not evidence of anything).

  independent_variables:
    - name: group_pair
      values: ["S4_vs_A4", "S4_vs_D4"]
    - name: N (census draw count)
      description: >-
        Searched by doubling from N=10 up to search_ceiling_N=100,000,
        then bisected to the nearest power-of-two-ish grid point once the
        power crosses 0.99, to locate N_required per pair.

  metrics:
    primary:
      - "N_required(S4_vs_A4): smallest N with Monte Carlo power >= 0.99 at alpha=0.05"
      - "N_required(S4_vs_D4): smallest N with Monte Carlo power >= 0.99 at alpha=0.05"
      - "NULL-1 apparent separation rate at the calibrated threshold, both pairs, all tested N"
      - "Step 4b classification outcome: N3 real S=2,000 sample (both runs) under both pairwise LR tests"
      - "Step 4b classification outcome: N1 real exhaustive 44,310-point sample (both runs) under both pairwise LR tests"
    secondary:
      - "NULL-2 empirical false-positive rate at N in {100,1000,10000,44310}"
      - "Step 4a bootstrap-vs-simulation power-curve agreement, S4_vs_D4 pair, at every N in the search grid"
      - "Exact S_4/A_4 cycle-type tables (Stage 0 output, zero-compute)"
      - "N_required(S4_vs_D4) / N_required(S4_vs_A4) ratio, testing the record's central prediction that the imprimitive pair needs strictly more draws"

  heuristic_under_test: HEUR-MONO-CONV-1
  preregistered_prediction:
    quantity: "N_required per group pair, and the ordering N_required(S4_vs_D4) > N_required(S4_vs_A4)"
    formula: >-
      No closed-form formula is pre-registered as the primary metric (the
      exact answer depends on the full multinomial LR power curve, which
      has no simple closed form for a 5-category test); the Chernoff-Stein
      lemma gives the asymptotic ORDER of magnitude
      N ~ ln(1/(alpha*beta)) / D_KL(P_sub || P_full), reported as a
      sanity-check cross-reference against the Monte Carlo result, never
      as a substitute for it.
    source: >-
      Chernoff-Stein lemma (standard information theory / hypothesis
      testing; RECALLED, NOT FETCHED) for the cross-reference formula;
      Neyman-Pearson lemma for the LR test's optimality.

  scale_relevance:
    tier: toy
    justification: >-
      Degree-4 permutation groups only (S_4 order 24, A_4 order 12, D_4
      order 8); N up to a 100,000-draw search ceiling. No transfer or
      extrapolation to any other degree, group, or census design is
      claimed.
    correspondence: null

  tail_checks:
    - >-
      The largest N tested in the search grid (up to search_ceiling_N)
      is where a Monte Carlo trial-count artifact (only 20,000 trials per
      candidate N) is most likely to produce a noisy power estimate near
      the 0.99 threshold; report the Monte Carlo standard error of the
      power estimate at the reported N_required for both pairs.
    - >-
      N1's real data has only ONE exhaustive sample (44,310 points) per
      run, not many independent replicates; Step 4a's bootstrap resampling
      is the only way to probe finite-N behaviour from this single
      dataset, and its own resampling variance (report the spread across
      >=1,000 bootstrap replicates per N) is disclosed rather than treated
      as free additional information.

  replication:
    seeds: [20260830, 20260831]
    independent_instances: 2

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1.0
    maximum_memory_gb: 2
    maximum_runs: 2
    maximum_workers: 1

  stopping_rules:
    - "If Stage 0's exact cycle-type tables for S_4 or A_4 fail their hand-checkable totals (24 and 12 elements respectively, summing correctly across the 5 cycle-type categories), halt before any Monte Carlo work; failed_infrastructure."
    - "If the Executor's own exhaustive tabulation of N1's 44,310 real perm tuples ever produces a 3-cycle, halt and report prominently as the run's headline finding (a direct contradiction of D_4 group theory, escalate per AGENTS.md rule 12) rather than silently discarding the anomalous row."
    - "If N_required search reaches search_ceiling_N (100,000) without crossing power 0.99 for either pair, report N_required as 'not reached by search_ceiling_N' rather than extrapolating."
    - "Total wall clock per run must not exceed wall_clock_seconds_per_run; if approached, reduce Monte Carlo trial count for the largest untested N candidates only, disclose the reduction, and never silently truncate the search grid."

  invalidation_rules:
    - >-
      Any post-hoc change to alpha (0.05), target_power (0.99), or
      monte_carlo_trials_per_candidate_N (20,000) after Stage 2 numbers
      have been observed requires a versioned protocol_amendment; it is
      never a silent re-selection.
    - >-
      The real-data file paths in `inputs.real_data_sources` are frozen
      exactly as listed; substituting a different run or a re-derived
      dataset requires an amendment.

  success_criterion: >-
    Both N_required figures are reported with their Monte Carlo standard
    error; NULL-1 and NULL-2 controls confirm the test construction has no
    false-positive problem; Step 4a's bootstrap-vs-simulation agreement is
    reported explicitly (agree or disagree, with the measured gap);
    Step 4b's four real-data classifications (N1 x 2 runs, N3 x 2 runs,
    each against both pairwise tests) are all reported. A run that reports
    all of these, regardless of which direction the numbers point, is
    successful — the record's success criterion is decidable independent
    of outcome, per `docs/task-lifecycle.md`'s requirement that no possible
    outcome counts as an automatic non-result.

  falsification_criterion: >-
    See H-MONO-819f2b's `falsification_conditions` (carried over verbatim,
    not restated in full here): NULL-1 showing a false-positive problem;
    real N1/N3 data misclassifying; N_required(S4_vs_D4) not exceeding
    N_required(S4_vs_A4); or the real protocol's actual spend falling
    below the measured requirement at either census-member type.

  required_artifacts:
    - implementation.md
    - implementation/ (source code)
    - runs/RUN-MONO-715694-1/
    - runs/RUN-MONO-715694-2/
    - execution_report.yaml

  battery:
    - id: STAGE0-EXACT-TABLES
      description: >-
        Zero-compute, hand-checkable exact cycle-type tables for S_4 (all
        24 permutations of {0,1,2,3}) and A_4 (the 12 even permutations),
        each cycle-decomposed and tabulated into the 5-way S_4 cycle-type
        space (identity, transposition, double-transposition, 3-cycle,
        4-cycle). Emitted BEFORE any Monte Carlo code runs, per the
        ordering-is-an-invalidation-rule convention already used in
        EXP-MONO-a20e48. FORCED: S_4 totals to 1/24, 6/24, 3/24, 8/24,
        6/24; A_4 totals to 1/12, 0, 3/12, 8/12, 0 (zero transpositions,
        zero 4-cycles).
      forced_output: "S4: [1,6,3,8,6]/24; A4: [1,0,3,8,0]/12"
    - id: STAGE0B-D4-FROM-REAL-DATA
      description: >-
        Read N1_k1_exhaustive.jsonl from BOTH RUN-MONO-a20e48-1 and
        RUN-MONO-a20e48-2, exclude rows with class==null (ramified,
        stratum=="i"), cycle-decompose every remaining `perm` 4-tuple
        into the same 5-way S_4 cycle-type space, and tabulate. FORCED:
        zero 3-cycles in every one of the 44,310 non-ramified rows, in
        both runs; the two runs' derived law must agree exactly
        (deterministic exhaustive census, no seed dependence).
      forced_output: "3-cycle count == 0 in both runs; law identical between runs"
    - id: STAGE1-NULL-CONTROLS
      description: "NULL-1 and NULL-2, per `controls` above."
    - id: STAGE2-N-REQUIRED-SEARCH
      description: >-
        For each of (S4_vs_A4, S4_vs_D4): calibrate the LR threshold from
        20,000 S_4-generated trials at each candidate N (targeting
        alpha=0.05 via the empirical (1-alpha)-quantile of the
        S_4-generated LR statistic), measure power as the fraction of
        20,000 sub-group-generated trials whose LR statistic crosses that
        threshold, and search N by doubling from 10 then bisecting once
        power first exceeds 0.99, up to search_ceiling_N=100,000.
      forced_output: "N_required(S4_vs_D4) > N_required(S4_vs_A4)"
    - id: STAGE3-REAL-DATA-VALIDATION
      description: "Step 4a and Step 4b, per `mechanism` in H-MONO-819f2b."
      forced_output: >-
        N1's real exhaustive data classifies as D_4 (not S_4, not A_4)
        under both pairwise tests, both runs; N3's real S=2,000 data
        classifies as S_4 under both pairwise tests, both runs.

  observation_requirements:
    - "Report the exact LR statistic formula used, in closed form, for auditability."
    - "Report the calibrated threshold value at each tested N, not just the pass/fail outcome."
    - "Report Monte Carlo standard error on every power estimate (binomial SE from 20,000 trials)."
    - "Report the bootstrap resampling's own variance (spread across replicates) alongside its point estimate."

  assigned_to: executor
