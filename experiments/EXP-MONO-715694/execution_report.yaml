  protocol_deviations:
    - >-
      PERFORMANCE: exact multinomial sampling (Python 3.12+ stdlib
      `random.Random.binomialvariate`, via sequential conditional binomial
      draws) substituted for literal per-draw categorical sampling in Stage
      2's Monte Carlo loop. Drawing N categorical samples one at a time
      would cost O(N) per sample and was infeasible in pure Python at N up
      to 100,000 with 20,000 trials per candidate N (estimated many minutes
      to hours for a single candidate N alone). The substitution produces
      the mathematically IDENTICAL target distribution (a fixed i.i.d.
      categorical law over N draws is exactly Multinomial(N, law) in
      distribution) -- this is a performance detail, not a change to what
      is being measured. Full derivation in implementation.md. Both runs
      completed in ~2.3 seconds wall-clock as a result, far under the
      1800-second budget.
    - >-
      PERFORMANCE: Step 4a's bootstrap resampling uses stdlib
      `random.Random.choices` (equal-weight with-replacement draw from the
      real 44,310-point pool) rather than a hand-written per-element
      `randrange` loop; identical sampling distribution, faster stdlib-
      internal implementation. The literal with-replacement resampling
      FROM THE REAL DATA POOL (not from the derived D_4 law) is preserved
      exactly as the contract requires -- only the loop implementation is
      optimized.
    - >-
      DISCLOSED JUDGMENT CALL, REJECTION-REGION DIRECTION: the handoff's
      task description contains two mutually contradictory statements about
      which tail of the LR statistic is the rejection region -- one says "a
      lower/more-negative LR favors it's the subgroup" (implying threshold =
      alpha-quantile, reject for LOW LR), the other's own explicit
      NEG_INF_CAP worked example says "-infinity ... is an immediate,
      maximally confident vote for it's S_4" (implying LOW/-infinity LR
      means "it's S_4", i.e. reject for HIGH LR). Working through the
      arithmetic of LR = sum log(P_sub/P_full): under true S_4 data, E[LR] =
      -D_KL(P_full||P_sub) = -infinity (since both tested subgroups exclude
      cycle types S_4 assigns positive probability to); under true subgroup
      data, E[LR] = +D_KL(P_sub||P_full) >= 0, finite. This is also the
      standard Neyman-Pearson convention (reject null for LARGE
      alternative/null likelihood ratio). This Executor implemented
      threshold = empirical (1-alpha) quantile of the S4-generated LR
      distribution, with "LR > threshold" classifying as "it's the
      subgroup" -- consistent with the handoff's own NEG_INF_CAP example and
      with the stated formula's arithmetic, and treating the contradictory
      prose aside as a documentation slip. Full derivation in
      implementation.md. This does not touch any frozen numeric parameter
      (alpha, target_power, monte_carlo_trials_per_candidate_N); it resolves
      which comparison direction is needed to make the stated formula
      computable and internally consistent at all.
    - >-
      THRESHOLD RECALIBRATION AT N=2000 AND N=44310 FOR STEP 4B: the
      Stage-2 search grid for both pairs contains only N=10 (see Stage 2
      results below), so neither N=2000 (N3's real sample size) nor N=44310
      (N1's real exhaustive size) was already a grid point. Per the
      contract's own explicit fallback instruction, both thresholds were
      recalibrated exactly at those N values using the identical seeded
      calibration procedure used in Stage 2. Recorded per-run in
      raw-result.json's `step4b.threshold_source` with `recalibrated: true`
      for all four thresholds used.
    - >-
      HEADLINE FINDING, NOT A DEVIATION BUT REPORTED PROMINENTLY PER THE
      CONTRACT'S OWN INSTRUCTION: N_required saturates at the contract's own
      search floor (N=10) for BOTH pairs in BOTH runs, so the central
      ordering prediction N_required(S4_vs_D4) > N_required(S4_vs_A4) is NOT
      confirmed by the primary Monte Carlo metric at this search's
      resolution -- this is explicitly named as a falsification condition in
      the frozen contract and H-MONO-819f2b, and is reported here as such,
      not worked around by extending the search below its own frozen floor.
      See Stage 2 section below for the full numbers and the Chernoff-Stein
      asymptotic cross-reference, which DOES show the predicted ordering as
      a secondary, non-primary metric.

