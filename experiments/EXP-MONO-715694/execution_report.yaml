  stage1_null_controls:
    null1_identical_group:
      description: >-
        S_4 vs an independent second S_4 stream, at N in
        {10,100,1000,10000,44310,100000}.
      false_positive_rate_by_n: {10: 0.0, 100: 0.0, 1000: 0.0, 10000: 0.0, 44310: 0.0, 100000: 0.0}
      max_apparent_separation_rate: 0.0
      pass: true
      mechanism_note: >-
        Because sub_law is literally the SAME probability table as full_law
        (not merely an independent draw of the same law, but the identical
        Python object), log(P_sub(c)/P_full(c)) = log(1) = 0 exactly for
        every cycle type -- the LR statistic is identically 0.0 for every
        possible draw regardless of N, and the calibrated threshold is
        therefore also exactly 0.0. This is a degenerate but mathematically
        correct outcome (not an unexplained zero), disclosed in full in
        implementation.md; it trivially satisfies "not materially above
        alpha=0.05".
    null2_variance_bound:
      description: "Empirical FP rate of the calibrated S4-vs-S4 test."
      false_positive_rate_by_n: {100: 0.0, 1000: 0.0, 10000: 0.0, 44310: 0.0}
    both_runs_agree: true

  stage2_n_required_search:
    lr_statistic_formula: >-
      LR(sample) = sum over the N draws in the sample of
      log(P_sub(cycle_type)/P_full(cycle_type)), where P_full is S_4's exact
      law (from Stage 0) and P_sub is the candidate subgroup's law (A_4's
      exact law from Stage 0, or D_4's real-data-derived law from Stage 0b).
      If P_sub(cycle_type)=0 and P_full(cycle_type)>0 and that cycle type is
      observed, the term is treated as NEG_INF_CAP = -1e18 (a finite
      sentinel standing in for -infinity, chosen far more extreme than any
      achievable finite sum of <=100,000 real terms, each of magnitude at
      most ln(24)~=3.2); any single such occurrence makes the WHOLE sample's
      LR statistic equal to NEG_INF_CAP, an "immediate, maximally confident"
      result, not merely a large negative contribution among others.
    rejection_rule: >-
      threshold = empirical (1-alpha)=0.95 quantile of the S4-generated LR
      distribution (20,000 trials); classify a sample as "it's the
      subgroup" if LR > threshold, else "it's S4". See implementation.md
      "Direction-of-rejection" section for the full derivation of why this
      direction (not the literal "below the threshold" phrasing elsewhere
      in the handoff) is the internally consistent one given the stated LR
      formula and the handoff's own NEG_INF_CAP worked example.
    search_floor_n: 10
    search_ceiling_n: 100000
    monte_carlo_trials_per_candidate_n: 20000
    s4_vs_a4:
      n_required: 10
      n_required_power: 1.0
      n_required_power_monte_carlo_se: 0.0
      false_positive_rate_at_n10: 0.0007
      threshold_at_n10: -1.0e+18
      grid_points_tested: [10]
      chernoff_stein_cross_reference: >-
        10.965784284662085 (asymptotic order-of-magnitude sanity check via
        ln(1/(alpha*beta))/D_KL(P_A4||P_S4), alpha=0.05, beta=0.01; recalled
        formula per Chernoff-Stein lemma, NOT a substitute for the Monte
        Carlo result).
    s4_vs_d4:
      n_required: 10
      n_required_power: 1.0
      n_required_power_monte_carlo_se: 0.0
      false_positive_rate_at_n10: 0.01675
      threshold_at_n10: -1.0e+18
      grid_points_tested: [10]
      chernoff_stein_cross_reference: >-
        13.81581630394152 (same formula, D_KL(P_D4||P_S4)).
    ordering_prediction_check:
      forced_output_expected: "N_required(S4_vs_D4) > N_required(S4_vs_A4)"
      measured: "N_required tied at 10 for both pairs"
      n_required_d4_gt_a4: false
      interpretation_scope_note: >-
        This is a measured observation, reported as required by the
        contract's own falsification_conditions, not an interpretation of
        whether H-MONO-819f2b's central prediction holds. Both pairs
        already reach power=1.0 (Monte Carlo SE=0.0 across 20,000 trials) at
        the contract's own search floor N=10, because a proper subgroup
        that excludes at least one S_4 cycle type makes the LR statistic
        hit NEG_INF_CAP for virtually every S_4-generated sample once N is
        large enough that observing an excluded category is near-certain --
        and N=10 already exceeds that point for both A_4 (excluded mass
        0.5, P(none in 10 draws)~=0.001) and D_4 (excluded mass 0.333,
        P(none in 10 draws)~=0.017). The predicted ordering DOES appear in
        the Chernoff-Stein asymptotic cross-reference (10.97 vs 13.82) and
        in the false-positive rate at N=10 (0.0007 vs 0.01675, both well
        under alpha), but the primary Monte Carlo N_required metric cannot
        resolve an ordering below its own frozen search floor. This
        Executor did not extend the search below N=10 to attempt to surface
        the predicted ordering there, since the search range is a frozen
        contract parameter and doing so would be a post-hoc re-selection
        the contract's invalidation_rules forbid.
    both_runs_agree: true

  step4a_bootstrap_vs_simulation:
    description: >-
      With-replacement resampling directly from the real 44,310-point N1
      (run 1) pool, at every N in the Stage-2 S4-vs-D4 search grid
      (which contains only N=10, per Stage 2 above), 1,000 bootstrap
      replicates, using the SAME threshold calibrated in Stage 2 at that N.
    grid:
      - n: 10
        threshold_used: -1.0e+18
        bootstrap_power: 1.0
        bootstrap_power_se: 0.0
        n_bootstrap: 1000
        synthetic_monte_carlo_power: 1.0
        synthetic_monte_carlo_power_se: 0.0
        gap: 0.0
    max_absolute_gap: 0.0
    agreement_verdict: >-
      AGREE (gap = 0.0 exactly at the one grid point tested, N=10). Both the
      synthetic i.i.d. simulation and the real-data bootstrap already
      saturate at power=1.0 with zero measured variance at this N, so this
      is a degenerate agreement (both hit the ceiling) rather than a
      finely-resolved match; a genuinely informative Step 4a comparison
      would require the Stage-2 search grid to contain N values below the
      separation threshold, which the contract's own N=10 floor precludes
      here. Reported as measured, per docs/evidence-and-reproducibility.md.
    both_runs_agree: true

