  non_claims:
  - NC2d-PROPER measures a p-scaling exponent at three primes of 20, 30 and 40 bits and applies
    it to fields up to 768 bits. It is a three-point extrapolation basis, two of whose points
    are `toy`, and it carries a `toy` ceiling regardless of the primary field's `medium` size.
  - A retirement of FC-4 removes a MECHANISM-INCONSISTENCY LABEL. It does not make alpha =
    1 correct, does not make it measured at scale, and is worth at most 0.4277 bits at NIST-I
    and 0.6809 bits at log2 p = 768. FC-4 fired on the smallest term in the corrected law.
  - NC2b-SLOPE is SYNTHETIC. It asserts nothing about any field, any prime, or the attack.
    ASSUMPTION L1 REMAINS UNTESTED AFTER THIS EXPERIMENT; what changes is that its magnitude
    under three named alternatives is on the record.
  - L2-WEIGHT changes a CHARGING CONVENTION inside a model. It produces no new datum about
    the attack, is reported as a separate column, and is NEVER netted against the excluded
    costs, against L4, or against any other correction.
  - The ~7.5 unmeasured octaves at NIST-I (and ~18 at log2 p = 768) are not reduced by this
    experiment at all.
  - gamma remains a property of this pure-Python implementation pair over this range, not
    of Algorithm 1. Quasi-linear / batched Sutherland-type evaluation is not implemented and
    could remove up to 13.25 bits of the modelled NIST-I overhead -- more than everything
    this experiment measures.
  - 'The comparison remains asymmetric in the attack''s disfavour: measured overhead is charged
    to the attack while Delfs-Galbraith keeps the nominal one-operation-per-step convention.'
  - Nothing here bears on Heuristic 1 or on P0; that is EXP-HEUR-d640d9's object.
  - Nothing here changes any hypothesis status, promotes or weakens H-P13-001, lifts any standing
    prohibition, or supports any security-parameter action. concrete_threat_nist1 stays INCONCLUSIVE
    (SP-6); this batch is not designed to produce evidence clearing the irreproducibility
    band.
  - Nothing here bears on CSIDH, (qt-)Pegasis, or torsion-based constructions.
