  protocol_deviations:
  - id: D-1
    kind: infrastructure constraint, recorded as a deviation not a repair
    what_the_contract_says: 'l2_weight.dickman_comparator_arm: ''using RUN-P13VOW-001''s committed
      cross-validated Dickman implementation (Laplace inversion ...), read-only''.'
    what_was_done: experiments/EXP-P13VOW-001/cost_model.py imports numpy, which is NOT INSTALLED
      in this environment -- a fact the frozen contract itself records in environment_facts_at_freeze_time.
      The committed implementation therefore cannot be executed. It was NOT modified and NOT
      forked. closeout.py contains a PURE-PYTHON PORT of exactly that algorithm with identical
      constants (Laplace inversion through the real saddle; trapezoid in tau with h = 0.05
      out to T = 25; Ein by 96-node Gauss-Legendre; rho grid u in [1, 130] step 0.05; linear
      interpolation of log2 rho).
    how_it_is_verified: dickman_port_verification compares the port against the committed
      run's OWN recorded Laplace values at u = 2..8 and against rho(2) = 0.30631868259405853.
      The check is reported with its maximum absolute difference and is a gate on the arm's
      citability.
    why_not_a_stop: 'The contract''s UNDERSPECIFICATION stopping rule covers a contract that
      is silent on a point that changes a number. The contract is NOT silent here: it names
      the implementation and its algorithm exactly. What is missing is a dependency, which
      is an environment fact the contract already recorded. The alternatives were to skip
      a contract-required arm or to edit committed code; both are worse, and editing committed
      code is forbidden outright.'
  - id: D-2
    kind: ordering detail inside execution_order step 1
    what_the_contract_says: execution_order step 1 is 'C-INSTR and C-IMMUT (pre-execution
      hashes)'; step 4 is 'C-BASE.1 at p1, p2, p3; j-pool generation'.
    what_was_done: per_entry_cost.control_c_instr needs the instrument's process-global prime
      to be set, so p3 -- the primary prime, computed by the carried Miller-Rabin procedure
      -- is computed and set in the parent process before C-INSTR runs. C-BASE.1 still runs
      at step 4, inside each prime's forked child. No measurement of any kind precedes C-INSTR,
      which is what step 1 exists to guarantee.
    effect_on_any_number: none
  - id: D-3
    kind: feasibility declaration required by the contract itself
    what_the_contract_says: 'l2_weight.exact_enumeration_arm.operating_point_arm: ''by exact
      enumeration where the range permits, and report explicitly at which field sizes exact
      enumeration was and was not feasible''.'
    what_was_done: 'A single feasibility rule was declared in code BEFORE any Delta was computed:
      attempt exact enumeration whenever the Dickman-predicted B-smooth count is at most 1e9,
      and otherwise record EXACT-NOT-FEASIBLE together with the predicted count. The rule
      reads only the predicted ENUMERATION SIZE and never any Delta value.'
    explicitly_not_a_budget: 'THERE IS NO BUDGET and none was invented, and no scientific
      stopping rule fired here. The threshold is a FEASIBILITY declaration of the kind the
      contract itself asks for (''by exact enumeration where the range permits, and report
      explicitly at which field sizes exact enumeration was and was not feasible''). Every
      excluded pair is listed with its predicted enumeration size AND with the enumeration
      time that size implies at this run''s own measured node rate, so a reader can see exactly
      what was not enumerated and what it would have cost. The tail check the contract names
      -- the exact Delta across the B ladder at a fixed w -- is COMPLETE at this threshold:
      all five B values are exactly enumerated at the NIST-I w.'
