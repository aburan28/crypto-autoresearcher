  # ==================================================================
  # 10. NON-CLAIMS (explicit; binding on every downstream record)
  # ==================================================================
  non_claims:
    - >
      NC2d-PROPER MEASURES A P-SCALING EXPONENT AT THREE PRIMES OF 20, 30 AND
      40 BITS AND APPLIES IT TO FIELDS UP TO 768 BITS. It is a three-point
      extrapolation basis, two of whose points are `toy`, and it carries a
      `toy` ceiling regardless of the primary field's `medium` size.
    - >
      A RETIREMENT OF FC-4 REMOVES A MECHANISM-INCONSISTENCY LABEL. It does not
      make alpha = 1 correct, does not make it measured at scale, and is worth
      at most 0.4277 bits at NIST-I and 0.6809 bits at log2 p = 768. FC-4 fired
      on the smallest term in the corrected law.
    - >
      NC2b-SLOPE IS SYNTHETIC. It asserts nothing about any field, any prime,
      or the attack. It measures a property of the estimator, and its
      misspecified arms measure the SIZE of an identifiability gap rather than
      closing it. ASSUMPTION L1 REMAINS UNTESTED AFTER THIS EXPERIMENT.
    - >
      The variance-aware tolerance is WIDER than the fixed 0.75-bit tolerance
      exactly where the data are thin, so it is HARDER, not easier, to detect a
      real bias at large B_opt. The number of PASS-WITH-POWER points is
      reported precisely so this cost is visible.
    - >
      L2-WEIGHT CHANGES A CHARGING CONVENTION INSIDE A MODEL. It produces no
      new datum about the attack. Its correction is reported as a separate
      column and is NEVER netted against the excluded costs, against L4, or
      against any other correction: the directions are reported separately, as
      EXP-PEC-49c773 required.
    - >
      Any statement about NIST-I, NIST-III or NIST-V remains an EXTRAPOLATION
      under the corrected law, conditional on L1-L6, reported as conditional,
      and carrying NO claim tier at any field size.
    - >
      The ~7.5 unmeasured octaves at NIST-I (and ~18 at log2 p = 768) are not
      reduced by this experiment at all. This experiment cannot discriminate
      between per-entry cost laws that agree over ell <= 211 and diverge at
      ell ~ 2^14 -- it QUANTIFIES that non-discrimination on three named
      alternatives, which is a different and much smaller thing.
    - >
      gamma remains a property of this pure-Python implementation pair over this
      range, not of Algorithm 1. Quasi-linear / batched Sutherland-type
      evaluation is not implemented and could remove up to 13.25 bits of the
      modelled NIST-I overhead -- more than everything this experiment measures.
    - >
      The comparison remains asymmetric in the attack's disfavour: measured
      overhead is charged to the attack while Delfs-Galbraith keeps the nominal
      one-operation-per-step convention. NC2f, not this experiment, addresses
      it.
    - >
      NOTHING HERE BEARS ON HEURISTIC 1 OR ON P0, which multiplies every margin
      row identically. EXP-HEUR-d640d9 is the experiment that addresses it, and
      no result here may be presented as bearing on it.
    - >
      Nothing here changes any hypothesis status, promotes or weakens
      H-P13-001, lifts any standing prohibition, or supports any
      security-parameter action.
    - "Nothing here bears on CSIDH, (qt-)Pegasis, or torsion-based constructions."

  honesty_constraints:
    - "No fabricated commands, outputs, timings, statistics, citations, or runs."
    - "Every number in raw-result.json is produced by code in this run, except values explicitly labelled as carried verbatim from a named committed file with the source field named."
    - "Counts come from instrumentation, not timing. Wall-clock is recorded alongside and never substituted for the counted unit, and never used as a stopping criterion."
    - "Deviations, failures, truncations, a standing FC-4, a failed anchor and a NO-POWER gate are reported, not tuned away."
    - "Unexpected observations are recorded, not discarded (AGENTS.md rule 8)."
    - "Never hardcode modular-polynomial coefficients from recollection; use the committed provenance route and record URL, UTC timestamp, byte length and SHA-256 for anything fetched."
    - "Nothing under experiments/EXP-PEC-6be870/ or experiments/EXP-PEC-49c773/ is edited, moved, or regenerated."
    - "REM-2 binds: this FROZEN CONTRACT governs, including its execution order. If a task card or dispatch message disagrees, follow the contract and report the discrepancy."

  # ==================================================================
  # 11. INVENTOR-PROTOCOL SECTION 8 DETERMINATION
  # ==================================================================
  section_8_determination:
    ref: "docs/inventor-protocol.md section 8; knowledge/techniques/KN-TECH-080.md; templates/research-records.md proof_search_map"
    proof_search_map_required: false
    reason: >
      NOT REQUIRED, on the same reasoning the Coordinator recorded for
      EXP-PEC-49c773 and for the same reason it is recorded rather than
      omitted. A proof_search_map is required before approving implementation
      or expensive experiments for a PROOF-ORIENTED proposal -- a theorem,
      asymptotic bound, certificate family, reduction, or closure argument.
      This experiment proposes none. It is (a) a bounded empirical
      re-measurement of a p-scaling exponent on a different ell grid, (b) a
      synthetic estimator study with known ground truth, and (c) an exact
      integer enumeration reproducing a committed recomputation. It advances no
      asymptotic claim and closes no lane. Note the contrast with the sibling
      contract EXP-HEUR-d640d9, which DOES carry the map: its falsification arm
      would be offered as a scoped closure argument, and this one's would not.
    but_two_components_are_argumentative: >
      L5's alpha = 1 remains a DERIVATION about the committed pipeline rather
      than a measurement, and NC2b-SLOPE is, in experimental form, precisely an
      identifiability study -- which is what the observation-collision audit
      is. Both are below the threshold of a proof-oriented proposal, but they
      are argumentative enough that the four audits are addressed inline rather
      than silently omitted.
    audit_dispositions:
      baseline_reproduction:
        status: DISCHARGED AND STRENGTHENED
        how: >
          Three independent reproductions are gating or reported here: RG-CONTROL
          requires this run to reproduce the committed per-ell and pooled alpha
          values within 0.02 AND to reproduce the FC-4 firing itself; C-SYNTH
          requires the fit to recover a noiseless synthetic truth to 1e-9; and
          L2-ANCHOR requires reproduction of a committed exact enumeration to
          0.005 bits with exact agreement on two integer counts. The baseline
          being reproduced is this programme's own committed evidence, by
          frozen fixture rather than by visual similarity.
      observation_collision:
        status: APPLICABLE, NOT CLOSED, AND NOW QUANTIFIED
        how: >
          The collision is L1: distinct per-entry cost laws produce the same
          observable over ell <= 211 and diverge at ell ~ 2^14. This experiment
          does not narrow it. What it adds is the first MEASUREMENT of the
          collision's magnitude: T-BREAK is a ground truth identical to
          T-POWER on every measured point and different at B_opt, so its
          extrapolation error is the collision's cost in bits. A second
          collision IS closed here: at a single ell grid below the Karatsuba
          threshold, "the primary and null objects share the p-scaling
          mechanism" and "they do not" were observationally confounded with
          "the implementations execute the identical code path". C-KARA and the
          new ell grid separate them, and RG-CONTROL prevents the separation
          from being a mere change of subject.
      quantifier_order:
        status: STATED
        how: >
          The supported statement is: "for THIS implementation pair, at THESE
          three primes, for the ell in the measured grid, there exists alpha
          such that per_entry at fixed ell scales as (log2 p)^alpha". The
          uniform forms -- "for all ell", "for all implementations", "for all
          p" -- are NOT supported, which is exactly why alpha is reported per
          arm and per grid rather than pooled into one number, and why the
          committed C-PSCALE's small-ell alpha could not license the large-ell
          extrapolation (RT3-C3(c) makes this the same family of mismatch as
          the pairing rule, one level up). For NC2b-SLOPE the order is: "for
          each named truth arm, the estimator's error at x* is at most T" --
          quantified over the arms actually generated, never over all possible
          truths.
      method_ceiling_and_nearby_object:
        status: ADDRESSED
        how: >
          METHOD CEILING, unchanged and restated: this method can bound the
          per-entry exponent of an UNOPTIMISED implementation from above; it can
          never establish a lower bound on the cost of an optimal one, and it
          can never resolve behaviour at ell it does not measure. NEARBY
          OBJECT: C-NULL remains the object where the ell-growth must NOT
          appear, and for the p-scaling it is the object that must exhibit the
          SAME alpha if the derivation is right -- which is exactly FC-4-NEW.
          For NC2b-SLOPE the nearby objects are T-BAND, T-SATURATE and T-BREAK:
          ground truths adjacent to the assumed power law on which the
          hoped-for conclusion fails. A method that cannot distinguish T-POWER
          from T-BREAK on the measured grid has not identified the load-bearing
          structure -- and it cannot, which is the honest content of L1.

