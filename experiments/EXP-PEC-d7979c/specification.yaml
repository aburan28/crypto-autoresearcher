experiment:
  id: EXP-PEC-d7979c
  hypothesis_id: H-P13-001
  version: 1
  title: >
    The c-programme closeout: NC2d-PROPER (retire or uphold the FIRED FC-4
    falsifier BY MEASUREMENT at ell above the Karatsuba threshold, with the old
    grid re-measured in the same run so the design cannot be read as dodging),
    NC2b-SLOPE (a synthetic slope null with known ground truth, carrying a
    tolerance WITH a variance term -- the repair of Validator finding V-1), and
    L2-WEIGHT (the entry-weighted charging correction, exact enumeration plus
    the Dickman comparator, with its sign stated in advance).
  status: approved
  approved_by: coordinator
  approval:
    task_id: TASK-20260802-0a794b
    goal_id: GOAL-P13-001
    batch_id: BATCH-004
    approved_at: "2026-08-02"
    authority: >
      Only the Coordinator approves an experiment (AGENTS.md, "Roles"). This
      approval authorizes execution of the protocol below by
      TASK-20260802-459b18. It changes no hypothesis status, promotes nothing,
      lifts no prohibition, and asserts no result.
    frozen: true
    freeze_rule: >
      This contract is written before any datum of RUN-PEC-d7979c-a exists and
      is not revised in light of results. A needed change is a SUPERSEDING
      contract under a new EXP id. Editing this file after the snapshot archive
      (TASK-20260802-56524a) is a contract violation, not a repair.
    preregistration_honesty: >
      Stated plainly. The inputs to all three items ALREADY EXIST and are
      already committed: the Coordinator has read RUN-PEC-49c773-a's C-PSCALE
      block (both arms, per-ell and pooled, the jackknife ranges and the FC-4
      firing), the seam-free fits, the Validator's V-1 noise figures and the
      red team's RT3-C1 exact-enumeration anchors while writing this contract.
      The pre-registration is therefore NOT a blind prediction about unseen
      data for NC2b-SLOPE's retro-fit arm or for L2-WEIGHT's anchor
      reproduction. It IS blind for NC2d-PROPER, whose ell grid has never been
      measured at more than one prime. What is load-bearing throughout, and
      what is genuinely fixed in advance, is the DECISION RULE and its
      CONSEQUENCE -- in particular the exact conjunction that retires FC-4 and
      the exact conditions that leave it standing.

  # ==================================================================
  # 0. RELATION TO COMMITTED EVIDENCE
  # ==================================================================
  relation_to_prior_work:
    extends: EXP-PEC-49c773
    supersedes: "nothing. This contract SUPERSEDES NO RECORD. It adds three measurements that EXP-PEC-49c773's own review cycle named as its successors."
    immutability_rule_binding: >
      experiments/EXP-PEC-49c773/, experiments/EXP-PEC-6be870/,
      RUN-PEC-49c773-a, RUN-PEC-6be870-a, EV-PEC-2e67ff, EV-PEC-857664,
      DEC-20260802-8227b9, DEC-20260802-48c72c and every BATCH-002/BATCH-003
      review report are IMMUTABLE and are NOT edited, moved, regenerated or
      repaired by this experiment or by any task under it (AGENTS.md rule 4).
      They are READ-ONLY INPUT DATA. A repair that quietly edits committed
      evidence is an evidence-integrity failure, not a repair, and the
      BATCH-004 Validator will confirm both directories are byte-unchanged.
    what_this_contract_repairs_and_how:
      - id: R-1
        defect: "Validator V-1: the NC2b-G1 gate tolerance has NO VARIANCE TERM, so its power depends on the null window's size in a way the contract never states."
        evidence: >
          V-1's own figures, read from the committed report: the extrapolated
          level N inherits the slope's sampling error multiplied by a lever arm
          of up to 26.1, giving +/- 0.1506 bits on the committed null W-MID at
          log2 B_opt = 14.2, +/- 0.3523 at 26.1, +/- 0.4875 on the NEW null
          W-TOP at 14.2 and +/- 1.3626 at 26.1. A fixed 0.75-bit tolerance is
          therefore about ONE noise unit on the gate of record (the observed
          worst miss 0.2717 sits inside its own +/- 0.3523 band) and about HALF
          a noise unit on the confirmatory arm. The PASS was real at the
          pre-registered tolerance and is not disputed; it must not be read as
          certifying the estimator to 0.75 bits at large B_opt.
        repair: "section 3, NC2b-SLOPE: every tolerance derives a variance term explicitly, and any evaluation point whose tolerance exceeds the resolution of its own window is classified NO-POWER rather than PASS."
      - id: R-2
        defect: "RT3-C3: FC-4 fired on ell in {3,5} and on nothing else; restricted to {11,13} the two arms agree to 0.0015. The pre-registered falsifier fired on a grid that lies almost entirely outside the window where the p-scaling is applied."
        evidence: >
          Committed C-PSCALE, read from RUN-PEC-49c773-a: primary per-ell
          alpha_hat = 1.261350527134655 (ell 3), 1.237716405897268 (5),
          1.0940226597021612 (7), 1.1181186978950635 (11),
          1.0872800752218785 (13), pooled 1.1596976731702053, jackknife
          [1.134284459679093, 1.177802072657287]; null per-ell 0.8590333573564346,
          0.8625420861667586, 1.0435915441964234, 1.1055810800486818,
          1.0967921759427506, pooled 0.9935080487422099, jackknife
          [0.9654897909155918, 1.0271267215886537]; FC-4 gap
          0.16618962442799545 > 0.15, FC-4_fires true, designation
          MECHANISM-INCONSISTENT.
        repair: "section 2, NC2d-PROPER: measure alpha where the p-scaling is actually applied, with the old grid re-measured in the same run as the control that makes the comparison a measurement of the MECHANISM rather than a change of grid."
      - id: R-3
        defect: "RT3-C1: assumption L2 (per-entry cost charged at ell = B_opt) OVERSTATES the entry-weighted table-build cost. Declared in the frozen contract, never priced."
        evidence: >
          RT3-C1's own exact enumeration, read from the committed report:
          at (X, B) = (10^7, 100) with w = 3.500 over 269,882 smooth d,
          Delta = 0.598 bits at gamma 0.810 and 0.676 at gamma 0.933; at
          (10^8, 215) with w = 3.430 over 2,792,530 smooth d, Delta = 0.625 and
          0.704; by the Dickman asymptotic 0.868 / 0.969 at NIST-I and
          0.899 / 1.001 at log2 p = 768.
        repair: "section 4, L2-WEIGHT: price it, with the sign stated in advance, and reproduce RT3-C1's anchors as the instrument check."

  # ==================================================================
  # 1. OBJECTIVE, INSTRUMENT, AND WHAT THIS EXPERIMENT CANNOT DO
  # ==================================================================
  objective: >
    (NC2d-PROPER) Measure the p-scaling exponent alpha at ell in
    {47, 101, 151, 211} -- deliberately ABOVE KARATSUBA_THRESHOLD = 16 and
    inside the primary fit window -- for both implementations and for the null
    object, at the same three primes, and re-measure the old ell in
    {3,5,7,11,13} grid in the SAME run, so that the pre-registered conjunction
    of section 2 either retires the FIRED FC-4 by measurement or leaves it
    standing. (NC2b-SLOPE) Run the committed estimator against synthetic series
    with KNOWN ground truth, under a correctly specified power law and under
    three misspecifications that agree on the measured range and diverge at
    ell ~ B_opt, with a tolerance that carries an explicit variance term.
    (L2-WEIGHT) Price the entry-weighted charging correction by exact
    enumeration with the Dickman comparator. Record observations only.

  what_this_experiment_cannot_do:
    - >
      IT CANNOT REDUCE THE ~7.5 UNMEASURED OCTAVES AT NIST-I (or ~18 at
      log2 p = 768) BY A SINGLE OCTAVE. NC2b-SLOPE measures the MAGNITUDE of
      the identifiability gap under declared misspecifications; measuring how
      large an unknown is is not the same as knowing it. Assumption L1 remains
      UNTESTED after this experiment, and its status must be reported as
      unchanged.
    - >
      It cannot move H-P13-001.adjudicated_positions.concrete_threat_nist1 off
      INCONCLUSIVE. SP-6 binds and this experiment is not designed to produce
      evidence clearing the irreproducibility band.
    - >
      It cannot address assumption L4 (batched Sutherland-type modular-polynomial
      evaluation), which remains the dominant residual uncertainty at 11.50-13.25
      bits -- larger than everything measured here. NC2c, not this experiment,
      addresses it.
    - >
      NOTHING HERE BEARS ON HEURISTIC 1 OR ON P0. That is EXP-HEUR-d640d9's
      object, and the two experiments measure opposite sides of the margin. A
      result here is not a result there, in either direction.
    - >
      L2-WEIGHT changes a CHARGING CONVENTION inside a model. It produces no
      new datum about the attack and cannot by itself move any claim about it.
    - "Nothing here bears on CSIDH, (qt-)Pegasis, or torsion-based constructions."

  inputs:
    frozen_paper: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
    frozen_paper_loci:
      algorithm_1: "lines 137-152 (listing B-smooth isogenies; the entry-creation loop L2-WEIGHT re-weights)"
      lemma_3_3: "line 156 (per-batch cost (B + log p)^{O(1)}; footnote on batched evaluation)"
      section_4_1: "line 230 (the one-F_{p^2}-operation-per-entry assumption the overhead is measured against)"
    committed_read_only:
      - path: experiments/EXP-PEC-49c773/specification.yaml
        role: "the frozen contract this one extends: the law, the pairing rule, alpha_selection_rule, FC-1..FC-4, L1..L6, the standing prohibitions."
      - path: experiments/EXP-PEC-49c773/runs/RUN-PEC-49c773-a/raw-result.json
        role: "READ-ONLY INPUT DATA: the C-PSCALE block, the admitted ell grid, the per-ell medians, the seam-free fits, the committed null series, the NC2b block and its gate evaluations."
      - path: experiments/EXP-PEC-6be870/implementation/per_entry_cost.py
        role: "THE INSTRUMENT. Imported by path, never copied, forked, patched or reimplemented."
      - path: experiments/EXP-PEC-6be870/runs/RUN-PEC-6be870-a/raw-result.json
        role: "READ-ONLY: the committed null series NC2b-G1 was evaluated on."
      - path: experiments/EXP-P13VOW-001/runs/RUN-P13VOW-001/raw-result.json
        role: "READ-ONLY: B_opt and X per field size, and the cross-validated Dickman implementation L2-WEIGHT's comparator uses."
      - path: coordination/goals/GOAL-P13-001/batches/BATCH-003/reviews/TASK-20260802-c50ea2/validation_report.yaml
        role: "READ-ONLY: finding V-1 and its noise figures."
      - path: coordination/goals/GOAL-P13-001/batches/BATCH-003/reviews/TASK-20260802-8e00fe/red_team_report.yaml
        role: "READ-ONLY: RT3-C1's anchors and RT3-C3's diagnosis."
    algorithmic_reference: inputs/P13-PANNY-POC/p-one-third.py
    algorithmic_reference_status: "FROZEN ALGORITHMIC REFERENCE ONLY. SageMath is not installed; the PoC is not executed. Do not modify it."

  instrument_reuse:
    rule: >
      experiments/EXP-PEC-d7979c/implementation/closeout.py IMPORTS
      experiments/EXP-PEC-6be870/implementation/per_entry_cost.py as a module
      (by path) and calls its existing entry points. It does not copy, fork,
      patch, or reimplement the instrument. This is the only way NC2d-PROPER is
      comparable to the committed C-PSCALE.
    recording: >
      The SHA-256 of per_entry_cost.py as imported is recorded in the manifest
      and in raw-result.json and MUST equal the value committed at 49166fa5,
      which the Executor re-reads in full from the committed manifest and
      reports in full.
    if_import_requires_modification: >
      STOP and report the required modification as an underspecification. Do
      NOT edit per_entry_cost.py and do NOT fork it. Filling a gap by rewriting
      the instrument silently redesigns the experiment and destroys
      comparability.

  environment_facts_at_freeze_time:
    python: "3.11.15"
    sagemath: "not installed"
    sympy: "not installed"
    gmpy2: "not installed"
    numpy: "not installed"
    scipy: "not installed"
    third_party_packages: "none (Python standard library only)"
    cpus: 4
    memory_gb_approx: 15
    source: "experiments/EXP-PEC-49c773/runs/RUN-PEC-49c773-a/environment.json, as observed."
    note: "The Executor re-records the environment it actually observes; a discrepancy is a finding, not a licence to change the protocol."

  # ==================================================================
  # 2. NC2d-PROPER
  # ==================================================================
  nc2d_proper:
    name: "C-PSCALE at ell above the Karatsuba threshold, with the old grid re-measured as the control"
    discriminates: "RT3-C3; assumption L5; the FIRED falsifier FC-4."

    design:
      ell_grid_new:
        values: [47, 101, 151, 211]
        why_these: >
          All four are ABOVE KARATSUBA_THRESHOLD = 16, so IMPL-A and IMPL-B do
          NOT execute the identical code path (RT3-C3(a) verified that at
          ell in {2,3,5,7,11,13} the two implementations' cost multisets are
          BIT-IDENTICAL, which made the committed C-PSCALE a schoolbook-only
          measurement). All four lie INSIDE the primary window W-MID
          (ell >= 11), and three of the four lie in the upper half of the
          measured range, which is where the extrapolated level is actually
          evaluated. Phi_ell is already acquired for all four in the committed
          run, so no new acquisition is required and an acquisition failure
          cannot silently reshape the grid.
        binds_completion_gate: true
      ell_grid_old_control:
        id: RG-CONTROL
        values: [3, 5, 7, 11, 13]
        binds_completion_gate: true
        mandatory: true
        why_it_is_mandatory_and_gating: >
          THIS IS THE CONTROL THAT MAKES THE NEW GRID INTERPRETABLE, AND IT IS
          THE ANSWER TO THE OBVIOUS OBJECTION AGAINST THIS DESIGN. Re-measuring
          only ell in {47,101,151,211} and reporting "FC-4 does not fire" would
          RELOCATE the falsifier, not retire it: a new grid that avoids the
          failing region cannot distinguish "the inconsistency is a property of
          small ell" from "the inconsistency has gone away for some other
          reason, or was never reproducible". Re-measuring the OLD grid in the
          SAME run, with the same instrument, the same primes and the same
          seeds, decides exactly that. If the old grid reproduces its committed
          alpha values and the new grid does not fire, the difference is a
          property of ell -- a measurement of the mechanism. If the old grid
          does NOT reproduce, the two runs differ for an unknown reason and
          NOTHING is retired.
        reproduction_tolerance: >
          Each of the five committed per-ell alpha_hat values must be
          reproduced to within 0.02 in alpha, and the committed pooled primary
          1.1596976731702053 and pooled null 0.9935080487422099 to within 0.02.
          A deviation beyond that is a REPRODUCTION FAILURE and is reported as
          such.
      primes:
        values:
          - "p1 = the largest prime < 2^20 with p1 = 3 (mod 4)"
          - "p2 = the largest prime < 2^30 with p2 = 3 (mod 4)"
          - "p3 = the largest prime < 2^40 with p3 = 3 (mod 4) -- the primary p of the committed run"
        rule: "computed by the carried Miller-Rabin procedure and recorded; C-BASE.1 (primality, congruence, j(E_0) = 1728, (p+1)P = O for three random P) verified at each."
        carried_from: "EXP-PEC-49c773 C-PSCALE. The same three primes are used deliberately, so that the ONLY difference from the committed measurement is the ell grid and the implementation arm."
      j_design: "a pool of 4 supersingular j-invariants per prime, generated by the carried walk with n_walk = 3*ceil(log2 p) and the first four walk_seeds, exactly as the committed C-PSCALE did."
      arms_required:
        - "PRIMARY-A: IMPL-A (schoolbook), all ell, all three primes."
        - "PRIMARY-B: IMPL-B (Karatsuba), all ell, all three primes. NEW: the committed C-PSCALE measured IMPL-A only, so it said nothing about the series (S-B/S-MIN) that supplies the low end of the citable bracket."
        - "NULL: the C-NULL object (per-entry cost O(1) in ell by construction), all ell, all three primes, both implementations."
      estimator: >
        Carried unchanged from EXP-PEC-49c773: OLS of log2(per_entry) on
        log2(log2 p) at each ell, and pooled across ell with ell fixed effects;
        report alpha_hat per ell and pooled, with the jackknife
        leave-one-ell-out range.
      interval_reading_fixed_now: >
        "alpha_hat's interval" means the JACKKNIFE LEAVE-ONE-ELL-OUT RANGE of
        the pooled estimate. The per-ell range is reported beside it as the
        alternative reading. This is fixed here because the committed run had
        to interpret it at execution time (RT3-C3 records the reading it
        chose). BOTH readings are reported for every arm; if they give
        different band verdicts the result is recorded as READING-DEPENDENT and
        the WIDER (more conservative) reading governs.

    alpha_band:
      band: [0.85, 1.15]
      carried_from: "EXP-PEC-49c773 C-PSCALE preregistered_prediction.acceptance_band"
      unchanged_deliberately: >
        The band is CARRIED VERBATIM and is not re-derived, re-centred or
        widened. Changing an acceptance band between the run where it nearly
        fired and the run designed to settle it would be indistinguishable from
        tuning, whatever the justification. It is the same band.
      the_near_miss_on_the_record: >
        RT3-C3 records that FC-2 (falsification of alpha = 1) required the
        interval DISJOINT from the band; the committed jackknife low end was
        1.134284, and the point estimate would have had to be 1.1754 instead of
        1.1597 -- a 1.35% move -- for FC-2 to fire. alpha = 1 is alive by a
        hair, and any record citing c at alpha = 1 alone is quoting a value
        whose own falsifier nearly fired. That sentence is carried into this
        contract so it cannot be lost.

    primary_designation_rule:
      preregistered: true
      fixed_across_every_outcome_before_the_number_is_seen: true
      always_reported: "c at alpha = 0 AND at alpha = 1, for every series, window and field size. Neither may be omitted under any outcome."
      cases:
        - id: CASE-CONTAINED
          condition: "alpha_hat's interval (both readings) is CONTAINED in [0.85, 1.15]."
          designation: "primary = alpha 1, labelled MEASURED-CONSISTENT, with the measured interval reported."
        - id: CASE-DISJOINT
          condition: "alpha_hat's interval (either reading) is DISJOINT from [0.85, 1.15]."
          designation: >
            alpha = 1 is FALSIFIED (FC-2). Primary becomes alpha = alpha_hat; c
            is additionally reported at both endpoints of alpha_hat's interval;
            the falsification is the headline finding of NC2d-PROPER. Nothing is
            tuned; alpha = 1 rows remain in the table, labelled falsified.
        - id: CASE-OVERLAPPING
          condition: "alpha_hat's interval OVERLAPS the band without containment."
          designation: "primary = alpha 1, the discrepancy is declared, and c is reported at alpha 0, alpha 1, and both endpoints of alpha_hat's interval."
        - id: CASE-READING-DEPENDENT
          condition: "the jackknife and per-ell readings give different case verdicts."
          designation: "the WIDER reading governs, the disagreement is reported as a finding, and both case outcomes are stated."
      per_arm: >
        The rule is applied SEPARATELY to PRIMARY-A, PRIMARY-B and NULL, and
        the three designations are reported separately. There is no pooled
        designation across implementations: gamma_A and gamma_B are already
        reported as a pair for exactly this reason, and collapsing alpha across
        implementations would reintroduce the same error one level up.

    fc4_disposition:
      the_falsifier_as_frozen: >
        FC-4 (EXP-PEC-49c773 section 6): "The measured alpha of the NULL object
        differs from the measured alpha of the primary object by more than 0.15
        under C-PSCALE." It FIRED at 0.16618962442799545 and the designation
        MECHANISM-INCONSISTENT stands on the record.
      governance_position_restated_and_binding: >
        A POST-HOC RESTRICTION OF THE ELL GRID CANNOT LIFT A PRE-REGISTERED
        FALSIFIER. RT3-C3 states this against its own analysis and the
        Coordinator adopts it. FC-4 fired as written. Nothing in this contract
        un-fires it, and no record produced here may say that FC-4 "did not
        really fire" or that it "fired on the wrong grid". What this experiment
        can do is decide, BY MEASUREMENT, whether the mechanism claim FC-4
        tests is true where the p-scaling is applied.
      fc4_new:
        definition: "|alpha_primary - alpha_null| > 0.15 on the ell in {47,101,151,211} grid, evaluated separately for PRIMARY-A vs NULL and for PRIMARY-B vs NULL."
        note: "The 0.15 threshold is CARRIED VERBATIM from FC-4 and is not adjusted."
      what_retires_fc4:
        verdict_word: "RETIRED-BY-MEASUREMENT"
        conjunction_all_five_required:
          - "(a) FC-4-NEW does not fire on the new grid, for BOTH PRIMARY-A vs NULL and PRIMARY-B vs NULL."
          - "(b) alpha_primary's interval is CONTAINED in [0.85, 1.15], for BOTH implementation arms, under BOTH readings."
          - "(c) alpha_null's interval is CONTAINED in [0.85, 1.15], under BOTH readings."
          - "(d) no residual trend of alpha_hat(ell) in ell across the four new ell: the OLS slope of alpha_hat on log2(ell) has a four-point interval containing 0, for every arm."
          - "(e) RG-CONTROL REPRODUCES: all five committed per-ell alpha_hat values and both committed pooled values are reproduced within 0.02, AND FC-4-NEW fires on the OLD grid (i.e. the committed firing is itself reproduced)."
        why_e_is_in_the_conjunction: >
          Because (e) is what converts the result from "we measured somewhere
          else and saw nothing" into "the inconsistency is a property of ell
          below the Karatsuba threshold, demonstrated by exhibiting it and its
          absence in the same run under the same instrument". Without (e) the
          new grid is an unanchored measurement. AVOIDING THE FAILING REGION IS
          NOT THE SAME AS RETIRING THE FALSIFIER, and (e) is the clause that
          enforces the difference.
      what_leaves_fc4_standing:
        verdict_word: "STANDS"
        conditions_any_one_suffices:
          - "FC-4-NEW fires on the new grid for either implementation arm. Then the derivation really is contradicted where the p-scaling is applied, assumption L5 must be REPLACED by the measured exponent, and that replacement is the headline finding."
          - "alpha_primary's or alpha_null's interval is not contained in the band."
          - "a residual trend of alpha_hat in ell is present."
          - "RG-CONTROL fails to reproduce the committed values within 0.02, in which case the two runs differ for an unknown reason and no comparison between grids is admissible."
          - "RG-CONTROL reproduces the values but FC-4-NEW does NOT fire on the old grid, which would mean the committed firing is not reproducible and is itself the finding -- reported as such, and still not a retirement."
      inconclusive:
        verdict_word: "INCONCLUSIVE"
        condition: >
          Any outcome not matching the retirement conjunction or a standing
          condition, and ANY truncation of the grid. A partial grid CANNOT
          retire FC-4. This is stated in advance so that stopping short can
          never become a retirement.
      only_three_words_are_available: >
        The run reports exactly one of RETIRED-BY-MEASUREMENT, STANDS, or
        INCONCLUSIVE. No softer formulation ("largely retired", "retired in the
        relevant range", "effectively resolved") may appear in any record.
      what_a_retirement_would_and_would_not_mean: >
        A retirement would remove the MECHANISM-INCONSISTENT label from the
        alpha designation. It would NOT make alpha = 1 measured at
        cryptographic scale: alpha is estimated from three primes at 40-, 60-
        and 80-bit fields, the two smaller of which are `toy`, and it is then
        applied to a 512-bit field. And the whole alpha question is worth
        log2(256/40)*(1.1597-1) = 0.4277 bits at NIST-I and 0.6809 bits at
        log2 p = 768 (RT3-C3's proportionality note, carried): FC-4 fired on
        the SMALLEST term in the corrected law, and its retirement is
        correspondingly small.

  # ==================================================================
  # 3. NC2b-SLOPE
  # ==================================================================
  nc2b_slope:
    name: "Synthetic slope null with known ground truth, and the variance-aware repair of the NC2b-G1 tolerance"
    discriminates: "assumption L1; Validator finding V-1."
    why_it_is_the_only_gate_with_power_against_L1: >
      Every other control in the c-programme compares a measurement against
      another measurement or against a null whose true level is known only up
      to the same estimator. NC2b-SLOPE generates data whose extrapolated value
      at ell = B_opt is known EXACTLY by construction, so the estimator's error
      over the unmeasured octaves is directly observable. That is the only way
      to obtain any quantitative statement about the 7.5-octave extrapolation
      without measuring at ell ~ 2^14.

    honest_statement_of_its_power_and_its_limit:
      binding: true
      text: >
        THE GATE HAS POWER AGAINST ESTIMATOR ERROR UNDER A CORRECTLY SPECIFIED
        POWER LAW. IT HAS NO POWER AGAINST MISSPECIFICATION OF THE LAW ITSELF,
        WHICH IS WHAT L1 ACTUALLY ASSERTS. A pure-power-law arm that passes
        shows the fitting and extrapolation arithmetic is sound; it shows
        nothing about whether the true per-entry cost is a power law out to
        ell ~ 2^14. That is why arms T-BAND, T-SATURATE and T-BREAK exist: they
        are ground truths that AGREE with a power law on the measured grid and
        DISAGREE at B_opt, and the error they induce is not a gate but a
        MEASUREMENT of the identifiability gap. After this experiment L1 remains
        UNTESTED; what changes is that its magnitude under three named
        alternatives is on the record.

    truth_arms:
      generation_grid: >
        The EXACT admitted ell grid of RUN-PEC-49c773-a, read from the
        committed raw result (read-only). Using the real grid means the fitted
        window, the point spacing and the lever arm (x* - xbar) are the real
        ones, so SE_pred is the real one.
      arms:
        - id: T-POWER
          truth: "y(ell) = log2(A_true) + gamma_true * log2(ell)"
          role: "CORRECTLY SPECIFIED. The gate arm."
        - id: T-BAND
          truth: >
            T-POWER plus an additive staircase: a constant offset added within
            each band ell+1 in [16,31], [32,63], [64,127], [128,255], [256,511],
            ..., with per-band increment delta_band. This is the Karatsuba
            recursion structure RT3-C2 identified in the committed residuals
            (KARATSUBA_THRESHOLD = 16; poly_mul_kara delegates to schoolbook at
            operand length <= 16).
          role: "MISSPECIFICATION-1: a real structural feature of the committed instrument."
        - id: T-SATURATE
          truth: "y(ell) = log2(A_true) + gamma_true * log2(ell) - kappa * (log2 ell)^2, kappa > 0"
          role: "MISSPECIFICATION-2: a bounded approach to a ceiling, which is what the seam-free per-band slopes suggest."
        - id: T-BREAK
          truth: >
            piecewise linear in log2(ell) with slope gamma_lo for ell <= 211 and
            slope gamma_hi != gamma_lo for ell > 211 -- a breakpoint ABOVE the
            entire measured range.
          role: >
            MISSPECIFICATION-3 AND THE L1 ARM. Its ground truth is IDENTICAL to
            T-POWER on every measured point and DIFFERENT at B_opt. It is
            unfalsifiable from the measured range by construction, which is
            exactly what L1 says. Its extrapolation error is the L1
            identifiability gap, measured in bits, for the first time in this
            programme.
      parameter_grid:
        gamma_true: [0.70, 0.81, 0.93, 1.00]
        gamma_hi_for_T_BREAK: "gamma_lo + d for d in {0.10, 0.25, 0.50}"
        delta_band: [0.05, 0.116]
        kappa: [0.005, 0.02]
        log2_A_true: "the committed intercepts, read from RUN-PEC-49c773-a: 9.2983509117 (S-A W-MID) and 9.7307533347 (S-B W-MID)."
        noise: >
          Gaussian on log2(per_entry) with sigma in {0, sigma_hat}, where
          sigma_hat is the residual standard error of the corresponding
          committed W-MID fit, recomputed by the Executor from the committed
          per-ell medians. 200 replications per noisy configuration, declared
          seed.
      run_through: "the identical fit -> corrected-law -> extrapolation pipeline used for the real data, with the pairing rule enforced (an intercept is always paired with the slope of the same fit of the same series over the same window)."

    tolerance_with_its_variance_term:
      the_defect_being_repaired: >
        V-1: the NC2b-G1 tolerance of 0.75 bits was derived from the committed
        null's realised flatness (0.202 bits) and realised slope drift
        (0.346 bits) only. It contains NO term for the sampling error of the
        extrapolated LEVEL, which is what the gate actually constrains.
      formula:
        statement: >
          For a fit over n admitted ell with regressor x = log2(ell), residual
          standard error s, mean regressor xbar and Sxx = sum (x_i - xbar)^2,
          evaluated at x* = log2(B_opt(level)):
            SE_pred(level, window) = s * sqrt( 1/n + (x* - xbar)^2 / Sxx )
            T(level, window)       = max( 0.25, 2 * SE_pred(level, window) )
        why_this_form: >
          SE_pred is the standard error of the FITTED MEAN at x*, which is
          exactly the quantity the gate compares against a known truth. The
          lever arm (x* - xbar) is the 7.5-to-18 octaves, and it is why V-1's
          noise half-widths grow from +/- 0.1506 bits at log2 B_opt = 14.2 to
          +/- 1.3626 bits on an 8-point window at 26.1. The factor 2 is the
          approximate 95% multiplier and is fixed here, not chosen later. The
          0.25-bit floor prevents a degenerate zero tolerance on the sigma = 0
          arm, where SE_pred vanishes and any nonzero arithmetic error would
          otherwise fail.
      power_classification_binding:
        rule: >
          Any (window, level) evaluation point whose T exceeds 1.0 bit is
          classified NO-POWER and its verdict does NOT count toward the gate.
        why: >
          This is the direct repair of V-1's observation that "on the 8-point
          W-TOP window at 768 bits the tolerance is roughly HALF the 95 per cent
          half-width of the very quantity it constrains, so that arm has
          essentially no resolving power: its failure is not evidence that the
          corrected estimator is biased at the top field size, and a pass there
          would not have been evidence that it is unbiased." A gate that cannot
          resolve its own quantity must say so rather than emit a verdict.
        what_it_costs: >
          Stated plainly. Making the tolerance variance-aware means the gate is
          WIDER exactly where the data are thin, so it is HARDER to detect a
          real bias at large B_opt. That is the honest trade: the fixed 0.75-bit
          tolerance was narrower there but its verdict was not interpretable.
          The number of evaluation points that survive as PASS-WITH-POWER is
          therefore itself a reported metric, and if very few survive, the
          honest conclusion is that the gate family has little power at large
          B_opt -- which is a finding about the method, not a failure of the
          run.
      gate_verdicts_available: [PASS-WITH-POWER, FAIL, NO-POWER]

    retro_fit_of_the_committed_gate:
      id: NC2b-G1-VAR
      what: >
        ZERO NEW MEASUREMENT. Recompute the committed NC2b-G1's TEN evaluation
        points (2 null windows x 5 field sizes -- ten, not fifteen; Validator
        V-5 records that three committed files mis-state the count as fifteen,
        and this contract uses ten) with the variance term above, and classify
        each as PASS-WITH-POWER, FAIL or NO-POWER.
      inputs: "the committed null series and fits from RUN-PEC-6be870-a and RUN-PEC-49c773-a, read-only."
      required_reporting: >
        For each of the ten points: |N_null - REF_null|, SE_pred, T, the
        original fixed-0.75 verdict, and the new variance-aware
        classification -- side by side. The original verdict is NOT overwritten
        or contradicted: it was correct at its own pre-registered tolerance and
        the Validator confirmed it. What is added is what it could and could not
        resolve.
      binding_limit: >
        This retro-fit does NOT edit, re-open, or invalidate RUN-PEC-49c773-a
        or its evidence record. It is a new analysis of committed data under a
        stated better-calibrated criterion, and any downstream use must say so.

    preregistered_expectations:
      - id: SL1
        statement: "On T-POWER at sigma = 0, the extrapolation error at every field size is below 1e-6 bits (pure arithmetic reproduction)."
        if_it_fails: "the pipeline has an arithmetic defect. The run is INVALID pending reconciliation; this is not a discovery about cost laws."
      - id: SL2
        statement: "On T-POWER at sigma = sigma_hat, at least 90% of PASS-WITH-POWER evaluation points pass."
        if_it_fails: "the estimator is biased even under correct specification; that would be a substantive finding and the headline of NC2b-SLOPE."
      - id: SL3
        statement: "On T-BREAK the extrapolation error at NIST-I is at least 0.5 bits for d = 0.25 and grows with d and with field size."
        kind: "MEASUREMENT, NOT A GATE. T-BREAK is expected to fail the gate by construction; that failure is its content."
        if_it_fails: "the breakpoint's effect is smaller than expected, which would WEAKEN L1's stated magnitude and must be reported as favouring the extrapolation."
      - id: SL4
        statement: "The number of PASS-WITH-POWER points among the ten NC2b-G1-VAR retro-fit evaluations is at least 5."
        if_it_fails: "the committed gate of record had resolving power at fewer than half its evaluation points, and every downstream citation of it must carry that fact."
    verdict_recording: >
      Each of SL1-SL4 is recorded as MET or NOT MET with its numbers. Success
      of the experiment is a property of the protocol being executed and
      reported, never of any prediction taking a particular value.

  # ==================================================================
  # 4. L2-WEIGHT
  # ==================================================================
  l2_weight:
    name: "The entry-weighted charging correction"
    discriminates: "declared assumption L2 (RT3-C1)."
    the_assumption: >
      L2 of EXP-PEC-49c773: "The table build's per-entry cost is charged at
      ell = B_opt." Status DECLARED, NOT MEASURED. Direction as declared:
      "Attack-unfavourable within the law: Algorithm 1 creates entries at every
      prime ell <= B, so the entry-weighted mean of ell^gamma is at most
      B^gamma."

    sign_stated_in_advance:
      binding: true
      predicted_sign: "THE CORRECTION IS ATTACK-FAVOURABLE."
      what_that_means_concretely: >
        Charging every entry at ell = B_opt OVERSTATES the entry-weighted cost.
        The correction therefore REDUCES the modelled overhead in bits, REDUCES
        c, and INCREASES the modelled margin of the attack over
        Delfs-Galbraith. It moves every margin row in the attack's favour.
      predicted_magnitude: >
        Delta = 0.60 to 1.00 bits of overhead at every field size, i.e. c at
        NIST-I overstated by roughly 0.038 to 0.063, per RT3-C1's own range.
      note_recorded_because_it_matters_for_credibility: >
        This correction was found and quantified by the RED TEAM, against its
        own prior objection: RT3-C1 is labelled ANTI-ATTACK-OBJECTION in the
        committed report because it cuts against the red team's own RT2-C1
        correction. Stating the sign in advance here is therefore not a
        prediction the programme is invested in; it is a carried finding whose
        reproduction is being checked.
      falsifier_of_the_sign: >
        If the measured Delta is <= 0 -- i.e. entry-weighting INCREASES the
        charge -- the sign prediction is FALSIFIED and that is the headline
        finding of L2-WEIGHT. Nothing is adjusted; the measured sign is
        reported.

    definition_fixed_now:
      quantity: >
        Delta(gamma, X, B) = gamma * log2(B) - log2( E_entry[ ell^gamma ] ),
        in bits, where E_entry is the entry-weighted expectation
          E_entry[ ell^gamma ] = integral y^gamma dS(y) / S(B),
          S(y) = sum over d <= X with P(d) <= y of d,
        with P(d) the largest prime factor of d. This is RT3-C1's own
        definition, adopted verbatim so its anchors are reproducible.
      alternative_weighting_also_required: >
        The same quantity with d replaced by psi(d), the cyclic-kernel count,
        as the weight. RT3-C1 reports the change as < 0.001 bits; that is a
        claim this run checks rather than assumes.
      gammas: >
        gamma_A = 0.9328644281 and gamma_B = 0.8100336227, the committed
        seam-free W-MID fits read from RUN-PEC-49c773-a (read-only, labelled as
        carried). Also reported at gamma = 0.810 and 0.933 so the comparison
        with RT3-C1's stated values is direct.

    exact_enumeration_arm:
      method: "enumerate every B-smooth d <= X with its largest prime factor, in exact integer arithmetic, and form S(y) and the entry-weighted expectation directly."
      anchor_reproduction_check_binding:
        id: L2-ANCHOR
        requirement: >
          Reproduce RT3-C1's committed exact-enumeration values:
            (X, B) = (10^7, 100): w = 3.500, 269,882 smooth d, Delta = 0.598
            bits at gamma 0.810 and 0.676 at gamma 0.933;
            (X, B) = (10^8, 215): w = 3.430, 2,792,530 smooth d, Delta = 0.625
            at gamma 0.810 and 0.704 at gamma 0.933.
          Tolerance: 0.005 bits on each Delta, and EXACT agreement on the two
          smooth-d counts.
        pass: "all four Delta values within 0.005 bits and both counts exact."
        fail: >
          The L2-WEIGHT instrument is NOT VERIFIED. Its Delta values are
          reported as UNVERIFIED and may not be cited as a correction by any
          downstream record. The discrepancy is reported in full, with both
          this run's values and the committed ones. Nothing is tuned to make
          the anchors match.
        why_it_is_the_right_check: >
          It is the discriminating check RT3-C1 itself named ("reproduce my
          exact-enumeration values 0.598 and 0.625"), it costs nothing beyond
          the computation already required, and it converts a red-team
          recomputation into an independently reproduced quantity.
      operating_point_arm: >
        Evaluate Delta at each field size's stored B_opt and X from
        RUN-P13VOW-001, by exact enumeration where the range permits, and
        report explicitly at which field sizes exact enumeration was and was
        not feasible. Where it was not, the Dickman comparator is the only
        estimate and is labelled as such.

    dickman_comparator_arm:
      method: >
        Psi(t, y) ~ t * rho( ln t / ln y ) using RUN-P13VOW-001's committed
        cross-validated Dickman implementation (Laplace inversion, agreeing
        with a du = 1e-5 marching solution to 2.5e-3 bits at u = 2 and 6e-6 at
        u = 7), read-only.
      required_reporting: >
        Delta by exact enumeration and by Dickman, side by side, at every
        (X, B, gamma) where both are computed, with their difference. RT3-C1's
        own figures show the asymptotic OVERSTATES at finite X (0.868 Dickman
        against 0.598-0.625 exact) while the exact values trend upward with B
        (0.598 -> 0.625). Report the trend of the exact values across a B
        ladder so the convergence claim is measured rather than asserted.
      b_ladder: "B in {50, 100, 215, 500, 1000} with X chosen so that w = log X / log B matches each field's operating w to within 0.01, and the achieved w reported."

    what_a_result_here_changes_and_what_it_does_not:
      changes: >
        The charging convention inside the corrected law. Reported as a
        SEPARATE COLUMN beside the charging-point c, never as a replacement for
        it, and never netted against any other correction.
      does_not_change: >
        Any measured quantity about the attack; any claim tier; the standing
        prohibitions; concrete_threat_nist1. The correction is 0.60-1.00 bits
        against a modelling-choice bracket 3.99 bits wide and an L4 term
        11.50-13.25 bits wide: real, worth reporting, and it changes no sign
        (RT3-C1's own magnitude assessment, carried).

  # ==================================================================
  # 5. CONTROLS
  # ==================================================================
  controls:
    - id: C-INSTR
      status: CARRIED UNCHANGED from EXP-PEC-6be870 / EXP-PEC-49c773
      runs_first: true
      checks: "C-INSTR.1 through C-INSTR.4, verbatim, plus the SHA-256 equality of the imported per_entry_cost.py against the value committed at 49166fa5."
      verdict_rule:
        pass: "all checks exact"
        fail: "ANY inexact check -> the run is invalid_measurement and STOPS. The instrument is not adjusted and no per-entry number is reported."
    - id: C-BASE.1
      status: CARRIED
      check: "at each of p1, p2, p3: primality by the carried Miller-Rabin procedure, p = 3 (mod 4), j(E_0) = 1728, and (p+1)P = O for three random P."
      fail: "invalid_measurement at that prime."
    - id: C-ALT.1
      status: CARRIED, MANDATORY
      check: "every root reported by each implementation verifies by an independent Horner evaluation, and the root count equals deg(gcd(x^{p^2} - x, f))."
      fail: "any failure -> run INVALID."
    - id: C-ALT.2
      status: CARRIED, NOW BINDING ON THE NC2d GRID
      check: "IMPL-A and IMPL-B return IDENTICAL root SETS at every sampled (ell, j, p) of the NC2d-PROPER grid. Counts are expected to differ."
      fail: "root sets differ at any sample -> run INVALID pending reconciliation."
    - id: C-KARA
      status: NEW
      name: "Karatsuba code-path identity below the threshold"
      check: >
        At ell in {3, 5, 7, 11, 13} the IMPL-A and IMPL-B cost multisets must be
        BIT-IDENTICAL, and at ell in {47, 101, 151, 211} they must DIFFER.
      why: >
        RT3-C3(a) verified the identity below the threshold from committed data
        and used it to argue the old C-PSCALE was a schoolbook-only measurement.
        This control re-verifies it directly and, more importantly, verifies its
        converse on the new grid: if the two implementations did NOT differ at
        ell >= 47, the new grid would be schoolbook-only too and the whole
        NC2d-PROPER design would be void.
      fail: "identity violated below the threshold, or no difference above it -> the NC2d-PROPER design premise is void; report and do NOT report a retirement verdict."
    - id: C-NULL
      status: CARRIED
      construction: "verbatim as in EXP-PEC-6be870 (ell+1 entries by ell+1 successive non-backtracking 2-isogeny steps, identical harness, identical denominator convention, identical aggregation)."
      coverage_rule: "the null is measured at EVERY ell and EVERY prime of the NC2d-PROPER grid. Any (ell, p) lacking null coverage is EXCLUDED from every alpha fit, and the exclusion is recorded individually."
      role_here: >
        The null is the NEARBY OBJECT for the p-scaling derivation: if the
        p-scaling is a property of the shared poly_powmod loop, the null must
        exhibit the same alpha. FC-4-NEW is exactly that comparison.
    - id: C-IMMUT
      status: NEW
      name: "Committed-evidence immutability"
      check: >
        Before and after execution, record the SHA-256 of every file under
        experiments/EXP-PEC-49c773/ and experiments/EXP-PEC-6be870/ that this
        run reads, and confirm they are unchanged.
      fail: "any change -> INVALID, and an evidence-integrity failure to be reported immediately."
    - id: C-SYNTH
      status: NEW
      name: "Synthetic-arm self-consistency"
      check: "on T-POWER at sigma = 0, the fitted (intercept, slope) must recover (log2 A_true, gamma_true) to within 1e-9."
      fail: "the fit code is defective -> run INVALID pending reconciliation."

  independent_variables:
    - "ell, over {3,5,7,11,13} (RG-CONTROL) and {47,101,151,211} (NC2d-PROPER)."
    - "p, over {p1, p2, p3}."
    - "implementation, over {IMPL-A, IMPL-B}."
    - "object, over {primary, null}."
    - "truth arm, over {T-POWER, T-BAND, T-SATURATE, T-BREAK} with its parameter grid (NC2b-SLOPE)."
    - "gamma, over {0.810, 0.933, gamma_A, gamma_B} (L2-WEIGHT)."
    - "(X, B), over the anchor pairs and the B ladder (L2-WEIGHT)."

  # ==================================================================
  # 6. METRICS
  # ==================================================================
  metrics:
    primary:
      - "NC2d-PROPER: alpha_hat per ell, pooled, and jackknife range, for PRIMARY-A, PRIMARY-B and NULL, on the new grid and on RG-CONTROL, at both interval readings."
      - "NC2d-PROPER: FC-4-NEW gap for A-vs-NULL and B-vs-NULL on both grids, with the fire/no-fire verdict."
      - "NC2d-PROPER: the band verdict per arm per reading, the primary designation per arm under the four-case rule, and the single FC-4 disposition word (RETIRED-BY-MEASUREMENT / STANDS / INCONCLUSIVE) with the status of each of the five conjunction clauses (a)-(e)."
      - "NC2b-SLOPE: per (arm, parameter set, window, field size): the known truth at x*, the recovered value, the error, s, n, xbar, Sxx, SE_pred, T, and the verdict in {PASS-WITH-POWER, FAIL, NO-POWER}."
      - "NC2b-SLOPE: the count of PASS-WITH-POWER, FAIL and NO-POWER points per arm; SL1-SL4 verdicts with numbers."
      - "NC2b-G1-VAR: the ten committed evaluation points with |N_null - REF_null|, SE_pred, T, the original fixed-0.75 verdict and the new classification, side by side."
      - "L2-WEIGHT: Delta by exact enumeration and by Dickman, per (X, B, gamma), under both d-weighting and psi(d)-weighting; the L2-ANCHOR reproduction check with all four Delta values and both counts; the measured SIGN of the correction; the corrected overhead and c per field size reported as a separate column beside the charging-point values."
    secondary:
      - "per-sample cost, entries, per_entry, inversion count, CZ seed string and wall-clock for every measured (ell, j, p, implementation, object)."
      - "the achieved w of every (X, B) pair in the L2-WEIGHT ladder."
      - "the exact-minus-Dickman difference in Delta, and the trend of the exact Delta across the B ladder."
      - "every excluded (ell, p) with the control condition it failed."
      - "C-IMMUT hash tables before and after."
      - "the SHA-256 of the imported instrument, reported in full."

  preregistered_prediction:
    quantity: "whether FC-4's mechanism claim holds where the p-scaling is applied; whether the committed estimator recovers a known extrapolated level; and the size and sign of the entry-weighted charging correction."
    formula: >
      Under the derivation of L5: alpha_primary = alpha_null = 1 at every ell,
      because the p-scaling is a property of the shared poly_powmod loop whose
      iteration count is bit_length(p*p) - 1 and whose per-iteration polynomial
      multiplication cost, in counted F_{p^2} multiplications, depends on the
      polynomial degree and not on p. Under a correctly specified power law,
      the extrapolated level at x* equals the truth up to SE_pred. Under
      Algorithm 1's entry structure, E_entry[ell^gamma] < B^gamma.
    source: >
      EXP-PEC-49c773 sections 4 and 6 (the derivation read from the committed
      pipeline), RT3-C3 (the ell-localisation of the FC-4 firing), RT3-C1 (the
      entry-weighted correction), Validator V-1 (the missing variance term).

  scale_relevance:
    tier: medium
    justification: >
      The primary instance is F_{p^2} with p ~ 2^40, an 80-bit field, which is
      `medium` under the mechanical rule of docs/claims-and-verification.md
      (32 < 80 <= 96). The p1 and p2 arms are 40-bit and 60-bit fields, i.e.
      `toy`; therefore EVERY ALPHA ESTIMATE, which is a regression ACROSS all
      three primes, carries a `toy` ceiling and may not be cited above it. This
      is stated because the alpha estimate is the headline of NC2d-PROPER and
      its tier is the minimum of its inputs, not the maximum. NC2b-SLOPE is
      synthetic and carries NO empirical tier at all: it is an estimator study
      and asserts nothing about any field. L2-WEIGHT is an exact enumeration
      over integers and likewise asserts nothing about any field. Nothing here
      is a cryptographic-scale measurement; AGENTS.md rule 7 applies in full.
    correspondence: null

  tail_checks:
    - "alpha_hat(ell) across the four new ell, with its OLS trend and four-point interval (retirement clause (d))."
    - "The committed-versus-remeasured comparison table for RG-CONTROL: all five per-ell alpha_hat values and both pooled values, with differences."
    - "NC2b-SLOPE: the extrapolation error as a function of the lever arm (x* - xbar), across all five field sizes, per arm. The error must grow with the lever arm on the misspecified arms; an error that does NOT grow with the lever arm is an artifact tell and is reported as such."
    - "L2-WEIGHT: the exact Delta across the B ladder, checked for monotone approach to the Dickman value. A non-monotone or diverging trend is reported, not smoothed."
    - "C-KARA's converse on the new grid: the IMPL-A/IMPL-B cost difference at each of ell in {47,101,151,211}, reported individually."

  replication:
    seeds:
      master: 20260802
      walk_seeds: [20260802001, 20260802002, 20260802003, 20260802004]
      cantor_zassenhaus: "seeded deterministically on (ell, j_index, p), NOT on implementation, exactly as the committed runs; the seed strings are recorded per sample."
      synthetic_noise: 20260802201
      bootstrap: 20260802202
    independent_instances: 4
    note: >
      One run is authorized. Four j per (ell, p) provide within-run replication
      of the per-cell statistic; they do NOT provide independent replication of
      the run, and the resulting evidence strength may not be recorded above
      `preliminary` on that basis alone. RG-CONTROL provides genuine cross-run
      reproduction against RUN-PEC-49c773-a, which is replication of the
      INSTRUMENT and of the determinism claim -- not of the inference.
    paired_seed_consequence_carried: >
      CZ is seeded on (ell, j_index, p) and not on implementation, so alpha_A
      and alpha_B are NON-INDEPENDENT estimates. No record produced under this
      contract may present their agreement, or their difference, as agreement
      between two independent implementations. Their difference is a
      measurement of the multiplication-routine effect under a fixed split
      structure, and must be labelled as such. (Carried from EXP-PEC-49c773
      C-ALT.seed_policy_decision.binding_consequence; Validator V-4 found this
      label missing from one committed file, so it is restated here and is
      required in EVERY file this run produces, including the execution report.)

  # ==================================================================
  # 7. STOPPING RULES -- SCIENTIFIC ONLY. THERE IS NO BUDGET.
  # ==================================================================
  no_budget_declaration:
    binding: true
    text: >
      THERE IS NO BUDGET. No wall clock, no memory ceiling, no run cap, no
      per-phase reserve, no "stop after N seconds", and no budget-conditional
      control. The budgeting mechanism is retired repo-wide (AGENTS.md rule 3
      as amended; DEC-20260802-fa3b26), and a contract that states a ceiling is
      INVALID. Note what this changes concretely against the predecessor
      contract: in EXP-PEC-49c773, C-PSCALE was "NEW, BUDGET-CONDITIONAL,
      NON-GATING" and was the first item a truncation would drop. HERE ITS
      SUCCESSOR IS THE PRIMARY ITEM AND IS GATING. Nothing in this contract is
      conditional on remaining time. The Executor must not invent a ceiling,
      must not stop because a computation feels long, and must not treat
      slowness as a result.

  execution_order:
    rationale: >
      Ordered so that (a) the instrument is verified before any number is
      produced, (b) the zero-new-measurement items are on the record before any
      new measurement, and (c) the control that makes NC2d-PROPER interpretable
      runs in the same session as the measurement it anchors.
    steps:
      - "1. C-INSTR and C-IMMUT (pre-execution hashes). On failure: STOP, invalid_measurement, no per-entry number reported."
      - "2. NC2b-G1-VAR retro-fit and L2-WEIGHT's exact-enumeration anchors (L2-ANCHOR), both from committed data with no new measurement. Write both blocks to disk immediately."
      - "3. NC2b-SLOPE in full: C-SYNTH, then all four truth arms over the parameter grid, with the variance-aware verdicts."
      - "4. C-BASE.1 at p1, p2, p3; j-pool generation."
      - "5. C-NULL over the full NC2d grid (both ell sets, all three primes, both implementations) BEFORE the primary measurement, so coverage is a precondition of membership rather than a verdict recorded afterwards."
      - "6. RG-CONTROL primary measurement: ell in {3,5,7,11,13}, both implementations, all three primes."
      - "7. NC2d-PROPER primary measurement: ell in {47,101,151,211}, both implementations, all three primes."
      - "8. C-ALT.1, C-ALT.2, C-KARA."
      - "9. L2-WEIGHT operating-point arm and the Dickman comparator over the B ladder."
      - "10. All fits, the four-case designation per arm, the FC-4 disposition conjunction, the full tables, C-IMMUT (post-execution hashes), artifacts, receipt."
    note: >
      REM-2 binds: THIS ORDER IS PART OF THE FROZEN CONTRACT. RUN-PEC-49c773-a
      recorded a deviation in which a dispatch message directed a different
      order from the frozen contract (INCIDENT-20260802-P13-03). If a task card
      or dispatch message disagrees with this order, FOLLOW THE CONTRACT and
      report the discrepancy. A dispatch message cannot amend a frozen protocol.

  stopping_rules:
    - >
      NORMAL END: the experiment ENDS when all three items are complete --
      NC2d-PROPER over both ell sets, all three primes, both implementations
      and the null; NC2b-SLOPE over all four truth arms with variance-aware
      verdicts at every (window, field size) point plus the ten-point
      NC2b-G1-VAR retro-fit; and L2-WEIGHT with its anchor check, its
      operating-point arm and its Dickman comparator over the B ladder.
    - >
      TERMINAL INSTRUMENT FAILURE: if C-INSTR fails, or the imported
      per_entry_cost.py SHA-256 differs from the committed value, STOP
      immediately. No per-entry number is reported. This is an infrastructure
      outcome and is NEVER mathematical evidence about the attack.
    - >
      TERMINAL INTEGRITY FAILURE: if C-IMMUT detects any change under
      experiments/EXP-PEC-49c773/ or experiments/EXP-PEC-6be870/, STOP and
      report it immediately as an evidence-integrity failure.
    - >
      DESIGN-PREMISE FAILURE: if C-KARA fails -- the implementations are
      identical above the threshold, or differ below it -- the NC2d-PROPER
      design premise is void. Report the finding and DO NOT report any FC-4
      disposition word other than INCONCLUSIVE.
    - >
      ANCHOR FAILURE IS NOT A STOP: if L2-ANCHOR fails, L2-WEIGHT continues and
      its Delta values are reported as UNVERIFIED and non-citable. The
      discrepancy is reported in full. Nothing is tuned to make the anchors
      match.
    - >
      PARTIAL NC2d IS INCONCLUSIVE BY CONSTRUCTION: if any cell of the
      NC2d-PROPER grid or of RG-CONTROL is missing, the FC-4 disposition is
      INCONCLUSIVE. Stated in advance so that stopping short can never become a
      retirement, and so that no reader can mistake an incomplete grid for a
      clean result.
    - >
      UNDERSPECIFICATION: if this contract is underspecified on any point that
      changes a number, the Executor STOPS and reports the underspecification
      rather than choosing for itself. A choice made at execution time is not
      pre-registered and cannot carry a pre-registered threshold.
    - >
      WHAT A PARTIAL RESULT MEANS: a partial result is evidence about exactly
      the (ell, p, implementation, object) cells measured, the truth arms run,
      and the (X, B, gamma) triples enumerated -- each reported explicitly as a
      list, not as an adjective. No alpha is quoted from an incomplete grid, no
      gate verdict is quoted from an arm that did not run, and no Delta is
      quoted from an unverified instrument.

  invalidation_rules:
    - "C-INSTR fails any check -> invalid_measurement."
    - "Instrument SHA-256 mismatch -> invalid_measurement."
    - "C-IMMUT detects any change under the committed EXP-PEC-* directories -> INVALID and an evidence-integrity failure."
    - "C-BASE.1 fails at any prime -> invalid_measurement at that prime."
    - "C-ALT.1 any unverified root -> INVALID."
    - "C-ALT.2 root sets differ at any sample -> INVALID pending reconciliation."
    - "C-SYNTH fails (the fit does not recover a noiseless synthetic truth to 1e-9) -> INVALID pending reconciliation; it is a code defect, not a result."
    - "An alpha fit including an (ell, p) cell without null coverage -> INVALID for that fit."
    - "Any FC-4 disposition word other than RETIRED-BY-MEASUREMENT, STANDS or INCONCLUSIVE -> INVALID."
    - "A RETIRED-BY-MEASUREMENT verdict reported without all five conjunction clauses (a)-(e) individually satisfied and individually reported -> INVALID."
    - "Any threshold, band, grid, tolerance or convention differing from this contract -> INVALID (REM-2)."
    - "Any number in raw-result.json not produced by code in this run, other than values explicitly labelled as carried verbatim from a named committed file -> INVALID (AGENTS.md rule 9)."
  explicitly_not_an_invalidation:
    - "FC-4 STANDING. That is a legitimate scientific outcome and is the outcome the design must be able to produce."
    - "A FAIL or NO-POWER classification on any NC2b-SLOPE point. Both are results."
    - "L2-ANCHOR failing. The instrument is then unverified and its numbers are non-citable; the run is not invalid."
    - "An unmet completion gate. Scoped evidence over what was achieved."

  success_criterion: >
    The run is a SUCCESS if all three items execute and report as specified:
    NC2d-PROPER reports alpha per arm on both grids with both interval
    readings, the four-case designation, the FC-4-NEW gap, and exactly one
    disposition word with all five conjunction clauses individually reported;
    NC2b-SLOPE reports, for every (arm, parameter set, window, field size), the
    known truth, the recovered value, the error, SE_pred, T and a verdict in
    {PASS-WITH-POWER, FAIL, NO-POWER}, plus the ten-point NC2b-G1-VAR retro-fit
    side by side with the original verdicts; and L2-WEIGHT reports Delta with
    its sign and magnitude by exact enumeration and by Dickman, with the
    L2-ANCHOR check passed or its failure reported in full. SUCCESS IS A
    PROPERTY OF THE PROTOCOL BEING EXECUTED AND REPORTED, NEVER OF ANY VALUE
    OBTAINED. FC-4 STANDING is a success. Every NC2b-SLOPE point coming back
    NO-POWER is a success -- and an important finding about the gate family.
    A measured Delta of the opposite sign is a success.

  falsification_criterion: >
    Assumption L5 (alpha = 1) is FALSIFIED if NC2d-PROPER returns
    CASE-DISJOINT on either primary arm. THE MECHANISM CLAIM UNDERLYING L5 --
    that the p-scaling is a property of the shared poly_powmod loop and
    therefore common to the primary and null objects -- is CONTRADICTED WHERE
    THE P-SCALING IS APPLIED if FC-4-NEW fires on the new grid; the
    MECHANISM-INCONSISTENT designation then persists and L5 must be replaced by
    the measured exponent. THE ESTIMATOR is falsified as an extrapolator under
    correct specification if SL2 fails. THE DECLARED SIGN OF L2 is falsified if
    the measured Delta is <= 0. THE NC2d-PROPER DESIGN PREMISE is falsified if
    C-KARA fails. None of these falsifies Theorem 1.1, the p^{1/3+o(1)}
    exponent, or any statement about Heuristic 1.

