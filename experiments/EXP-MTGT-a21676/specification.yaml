experiment:
  id: EXP-MTGT-a21676
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-a127ab
  question_id: RQ-MTGT-2cabee
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE PREPROCESSING TABLE IS A GROUP OBJECT, SO IT TRANSPORTS EXACTLY AND ALMOST FOR FREE:
    one Bernstein-Lange cube-root table built on one curve serves every curve in the F_p-isogeny class,
    with per-curve advice falling from M*N^{1/3} bits to N^{1/3} bits, because the cheaper of the
    two transport modes moves the TWO TARGET POINTS rather than the S TABLE ENTRIES and therefore
    costs O(L*ell^3) field operations INDEPENDENT of S -- and the result is exactly ON the S*T^2 =
    N frontier, never below it, so it is a multi-CURVE amortisation with a quantitatively ZERO attack
    delta'
  status: draft
  objective: "(A) THE OBJECT AND WHY IT TRANSPORTS. A discrete-log preprocessing table on (E, P) is\
    \ a finite set A = {(R_1, r_1), ..., (R_S, r_S)} subset of G x Z/N with R_i = [r_i]P. Its ONLY\
    \ defining property is the pairing of a group element with its logarithm. Let phi: E -> E' be\
    \ an F_p-rational isogeny of degree d with gcd(d, N) = 1. By the transport theorem T1 (analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md\
    \ section 3), phi restricted to G is an injective group homomorphism, phi(P) has order N, and\
    \ phi([r]P) = [r]phi(P). Therefore\n  phi_*(A) := {(phi(R_1), r_1), ..., (phi(R_S), r_S)}\nis\
    \ a preprocessing table on (E', phi(P)) with THE SAME SCALARS. Not approximately, not statistically:\
    \ entrywise, exactly, with a per-entry certificate [r_i]phi(P) == phi(R_i) that a validator re-checks\
    \ without the solver. Transport of a preprocessing table is a THEOREM, not a measurement.\n(B)\
    \ THE COST, CHARGED IN THE FULL MODEL, WITH MEMORY BESIDE TIME. Write the baseline as Bernstein-Lange's\
    \ cube-root precomputation (INDOCRYPT 2012; figures RELAYED FROM THE ABSTRACT, see assumptions):\
    \ in a group of order ell, a table of size ell^{1/3} precomputed with 1.24*ell^{2/3} multiplications\
    \ gives online cost 1.77*ell^{1/3} multiplications. Hence S = N^{1/3} elements of memory, T =\
    \ 1.77*N^{1/3} time, S*T^2 = 3.13*N -- ON the Corrigan-Gibbs--Kogan frontier S*T^2 = Omega~(N)\
    \ (KN-LIT-013, KN-TECH-005), which KN-LIT-013 records as essentially tight. Let phi be a composition\
    \ of L prime-degree steps of degrees ell_1..ell_L, ell = max_j ell_j. Two costs must be separated\
    \ and the literature routinely conflates them:\n  C_build  -- CONSTRUCTING the isogeny (finding\
    \ the neighbour, then the\n              kernel polynomial). In the ordinary F_p setting the ell-torsion\n\
    \              is generally NOT F_p-rational, so a kernel generator is not\n              cheaply\
    \ sampleable and the applicable model is O(ell^3) per\n              step via modular polynomials,\
    \ improvable toward O(ell^2) by\n              Elkies-style methods -- NOT O(sqrt(ell)). This\
    \ caveat is\n              recorded verbatim in research/JMV004_branch_a_scouting_20260726.md\n\
    \              and is labelled there as SCOUTING, not evidence; it is cited\n              here\
    \ as a cost-model caveat and nothing more.\n              C_build = O(L * ell^3) field operations,\
    \ paid ONCE.\n  c_eval   -- EVALUATING an already-constructed isogeny at one point. Velu's\n \
    \             formulas construct and evaluate a degree-ell isogeny at about\n              6*ell\
    \ field operations (KN-LIT-780, relaying Adj--Chi-Dominguez\n              2020); square-root\
    \ Velu (Bernstein--De Feo--Leroux--Smith 2020,\n              same source) reduces evaluation\
    \ to O~(sqrt(ell)).\n              c_eval = sum_j 6*ell_j <= 6*L*ell field operations, PER POINT.\n\
    \n(C) THE TWO TRANSPORT MODES, AND WHY MODE B IS THE ONE THAT MATTERS.\n  MODE A -- PUSH THE TABLE.\
    \ Transport all S entries:\n      cost_A = C_build + S * c_eval = O(L*ell^3) + 6*L*ell*N^{1/3}.\n\
    \    Rebuilding a native table on E' costs 1.24*N^{2/3} multiplications.\n    TRANSPORT WINS IFF\
    \  6*L*ell*N^{1/3} + O(L*ell^3) < 1.24*N^{2/3},\n    i.e. (dropping the build term) iff L*ell\
    \ < 0.207*N^{1/3}.\n    At N = 2^256: N^{1/3} = 2^{85.3}, so Mode A wins for any L*ell < 2^{83};\n\
    \    a GRH-small generator set has ell = O(log^2 p) ~ 2^{16} and a mixing walk\n    has L = O(log\
    \ p) ~ 2^8, so L*ell ~ 2^{24} and Mode A wins by ~2^{59}.\n    At N = 2^{40} (a size this program\
    \ can actually reach in a toy proxy):\n    N^{1/3} = 2^{13.3}, 0.207*N^{1/3} = 2^{11}, so Mode\
    \ A wins only while\n    L*ell < 2^{11}. THE WIN IS ASYMPTOTIC AND IT IS SMALL AT TOY SCALE --\n\
    \    stated here so no toy run is over-read.\n  MODE B -- PULL THE TARGET. Do not move the table\
    \ at all. Given a target\n    (E', P', Q') on a classmate, apply the DUAL isogeny phi-hat: E'\
    \ -> E to\n    the TWO points. By T1 applied to phi-hat, phi-hat(P') and phi-hat(Q')\n    lie\
    \ in G, and if P' = phi(P) then phi-hat(P') = [d]P with gcd(d,N) = 1,\n    so [d]P is another\
    \ generator of G and phi-hat(Q') = [k]phi-hat(P') with\n    THE SAME k. Cost:\n      cost_B =\
    \ C_build + 2 * c_eval = O(L*ell^3) + 12*L*ell,\n    INDEPENDENT OF S. Mode B dominates Mode A\
    \ whenever S > 2, i.e. always.\n    At N = 2^256 with ell ~ 2^{16}, L ~ 2^8: cost_B ~ 2^{56} field\n\
    \    operations, against an online phase of 1.77*N^{1/3} ~ 2^{86} group\n    operations ~ 2^{89}\
    \ field operations. THE TRANSPORT OVERHEAD IS 2^{-33}\n    OF THE ONLINE PHASE.\n\n(D) WHAT IS\
    \ ACTUALLY BOUGHT, STATED AS A LEDGER WITH NO ROUNDING UP.\n  BOUGHT: for M curves of one class,\
    \ total advice falls from M*N^{1/3}\n    elements to N^{1/3} elements plus O(L*log p) bits of\
    \ path description.\n    Per-target online time rises by an additive O(L*ell^3) field operations,\n\
    \    which is o(1) relative to 1.77*N^{1/3} for ell = polylog(p).\n    So the FAMILY of M curves\
    \ is attacked at S*T^2 = N*(1+o(1)) instead of\n    the M*N that M separately-preprocessed groups\
    \ would cost. That is a\n    factor-M reduction in the advice-time product OF THE FAMILY.\n  NOT\
    \ BOUGHT, AND THIS IS THE HEADLINE: ZERO speedup against any single\n    instance. For M = 1 the\
    \ construction is exactly Bernstein-Lange and the\n    frontier point is unchanged. The exponent\
    \ 1/3 does not move, the memory\n    exponent 1/3 does not move, and rho at 0.886*sqrt(N) with\
    \ O(1) memory\n    (KN-TECH-001, KN-TECH-006) is untouched. This proposal claims NO ATTACK\n \
    \   IMPROVEMENT and the correct sota_delta is zero.\n\n(E) WHY THIS IS NOT WHAT EXP-ISADV-001\
    \ MEASURED, AND WHY THAT PRIOR NEGATIVE MUST NOT BE CITED AGAINST IT. experiments/EXP-ISADV-001/advice_transfer.py\
    \ was read in full for this record. It groups curves by #E(F_p) to obtain a class (correct), picks\
    \ a generator on each member INDEPENDENTLY via first_point() (line 99 and line 111), and then\
    \ asks whether x-coordinates of multiples of one member's generator land in an x-coordinate advice\
    \ set built from a DIFFERENT member's generator. IT NEVER CONSTRUCTS OR EVALUATES AN ISOGENY --\
    \ the string \"isogeny\" appears in the docstring and in the class- finding helper's comment,\
    \ and nowhere in the computation. There is no generator correspondence and no map. What that script\
    \ measured is therefore precisely the NULL OBJECT of the present question: a size-matched random\
    \ relabelling. Its reported result (research_directions_20260718.md section 9.1: cross-curve transfer\
    \ indistinguishable from baseline at p = 101, 211, 431) is the CORRECT and EXPECTED null outcome\
    \ and is fully consistent with this proposal. The scoped negative recorded in outputs/prior_proposals_digest.md\
    \ (\"A2 weakened ... scoped negative on transfer\") is a negative on UNTRANSPORTED relabelling,\
    \ not on transport."
  resource_label: 'R8 primary (multi-instance / preprocessing structure: the model contains M distinct
    encoded groups, not one), R4 secondary (the isogeny graph supplies the efficiently computable
    identification between those encodings).'
  admissibility: admissible
  admissibility_argument: 'The filter in DECOMPOSITION.md section 2 closes a lane whose ONLY use of
    phi is to apply it to points of G. This proposal does apply phi to points of G -- and that use,
    taken alone, is indeed worth nothing: on a SINGLE instance phi|_G is an isomorphism onto a different
    group, contributes no new congruence, and is covered by H-ENDO-001 and by the sibling lane record
    IDEA-20260807-5cabfc (vertical transport closure). The advantage claimed here does not come from
    that use. It comes from the MODEL: the preprocessing model with M encoded groups charges advice
    per group, and the generic version of that model draws M INDEPENDENT encodings. An F_p-isogeny
    class supplies M encodings that are efficiently inter-convertible in polylog(p) per point. That
    inter-convertibility is not group-operation output on any one group; it is a relation BETWEEN
    groups, which is exactly resource R8 with R4 as the supplier. A generic-group simulator for the
    single-group model can simulate phi|_G (it is a relabelling), but a simulator for the M-group
    model cannot manufacture the cross-encoding map without being handed it, which is the formal content
    of the escape. Consistent with that, the escape yields strictly zero speedup on any single instance:
    an admissible resource that buys nothing against the deployed threat model is the honest outcome
    here, and it is recorded as such rather than dressed up.'
  reachability_gate: T5 INSTANTIATED FOR L13, WITH THE ANSWER SPLIT BY THREAT MODEL, WHICH IS THE
    POINT. (i) IS A GOOD OBJECT REACHABLE? The lane does NOT need to reach a curve with a rare good
    property, so the hard half of T5 -- goodness identifiable only by a global address -- does not
    arise. It needs to reach a SPECIFIED curve, namely the one the target lives on (Mode B) or the
    one the table lives on (Mode A). That is the vectorization problem. (ii) AT WHAT COST? Classically,
    claw-finding on Cl(O) with h ~ p^{1/2} gives p^{1/4+o(1)} steps (H1). Since 1/4 < 1/3, PATH-FINDING
    IS ASYMPTOTICALLY CHEAPER THAN THE N^{1/3} ONLINE PHASE IT SERVES, so the gate PASSES asymptotically.
    CONCRETELY at p = 2^{256}, with the conservative O(ell^3) per-step model and ell = O(log^2 p)
    ~ 2^{16}, path-finding costs 2^{64} * 2^{48} = 2^{112} field operations against an online phase
    of ~2^{89}, so THE GATE FAILS CONCRETELY BY 2^{23} in the adaptive model. Under the Elkies O(ell^2)
    model it fails by 2^{7}; under an O(sqrt(ell)) model it passes. THE VERDICT IS ENTIRELY DETERMINED
    BY THE PER-STEP MODEL, exactly as JMV004 scouting found for the JMV reduction, and this record
    reports the range rather than picking the favourable row. (iii) THE THREAT-MODEL SPLIT THAT DISSOLVES
    THE GATE. If the target curves are PUBLISHED IN ADVANCE (the only realistic case, since a deployed
    system's curve is a public parameter), C_build moves entirely into preprocessing, is dominated
    by the table build for M < p^{5/12} (H2), and the gate does not bind at all. The gate binds ONLY
    against an adversary who learns the target curve online, which is not a deployment this record
    can name.
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE): the lossy-projection test in object_first_candidate
      and the arithmetic in claim (B)/(C). Both are algebraic and already written. If a reviewer finds
      that phi_*(A) is not a valid table, the proposal ends without any run. STAGE 1 (minutes): on
      one toy class at p ~ 2^{10}, construct one explicit ell = 2 or 3 isogeny and run the T1 certificate
      (Step 2). This is the CHEAPEST VALID DISCRIMINATOR of the whole lane: it separates "transport
      preserves the table" from "transport destroys the table" with S = 8 entries and a handful of
      field operations, and it is the exact measurement EXP-ISADV-001 never made. STAGE 2 (minutes):
      the three null arms and the alpha sweep. STAGE 3 (hours): the S sweep, the Mode A / Mode B /
      rebuild cost comparison, and the frontier plot, at p in {2^{16}, 2^{20}, 2^{24}}. STAGE 4 (zero
      compute): the non-isogenous nearby-object control and the M = 1 baseline reproduction.'
    mechanism: 'STEP 1 -- CLASS AND PATH. Enumerate a toy F_p-isogeny class by trace (the method already
      in advice_transfer.py find_isogeny_class, which is correct as far as it goes), restricted to
      prime-order members. For each ordered pair (E_i, E_j) in the class, construct an explicit F_p-rational
      isogeny path: at toy scale, by brute-force search over rational subgroups of small prime order
      ell and Velu''s formulas, recording (ell_1..ell_L) and the rational maps. STEP 2 -- CERTIFY
      T1 BEFORE MEASURING ANYTHING. For each constructed phi, verify: (i) phi(P) != O and [N]phi(P)
      == O; (ii) phi(Q) == [k]phi(P) for the known toy k; (iii) gcd(deg phi, N) == 1. A failure here
      is an instrument failure and halts the line (AGENTS.md rule 5), never a mathematical result.
      STEP 3 -- BUILD ONE TABLE. On E_1, build a Bernstein-Lange-style table of S known-log distinguished
      points, S swept over {N^{1/4}, N^{1/3}, N^{2/5}}. Record build cost in group operations AND
      in bytes of storage. STEP 4 -- MODE A. Transport all S entries by phi and re-certify EVERY entry
      ([r_i]phi(P) == phi(R_i)). Record: number of entries surviving certification (predicted S, i.e.
      100%), field operations spent, wall clock. STEP 5 -- MODE B. For targets generated on E_j, pull
      back by phi-hat and solve on E_1 with the single table. Record field operations for the pullback
      and group operations for the online phase, separately, and the recovered k certified against
      the ORIGINAL instance on E_j. STEP 6 -- REBUILD CONTROL. Build a native table on E_j from scratch
      and solve the same targets. Record the same quantities. The comparison cost_A vs cost_B vs cost_rebuild
      is the deliverable, plotted against the predicted crossover L*ell = 0.207*N^{1/3}. STEP 7 --
      FRONTIER PLACEMENT. For every arm, plot the measured (S, T) point against S*T^2 = N and against
      matched rho at 0.886*sqrt(N) and matched BSGS. A point below the frontier is a falsification
      of the expected outcome and triggers AGENTS.md rule 12, not a promotion.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - random-relabelling null of identical size (certification must be 1/N)
  - scalar-shuffle null (certification must be 1/N)
  - alpha dose-response sweep, affine with slope 1
  - same-order different-class curves (path must not be found)
  - matched Pollard rho with distinguished points on every instance
  - matched BSGS on every instance
  - M = 1 degeneracy check against single-curve preprocessing
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. THE NULL IS A RANDOMLY RELABELLED TABLE
    OF IDENTICAL SIZE: replace phi|_G by a uniformly random bijection sigma: G -> G'' and form {(sigma(R_i),
    r_i)}. Under the null the certification rate must equal the chance rate 1/N (a random pairing
    is right by accident), against 100% for true transport. SECOND NULL: a SCALAR SHUFFLE -- keep
    phi but permute the r_i, which must also certify at 1/N. THIRD NULL, and the one that matters
    for the COST claim: a curve E'''' of the SAME ORDER N but a DIFFERENT trace (hence a different
    isogeny class), where no F_p-isogeny exists and Mode B is unavailable; the pipeline must report
    "no path" rather than silently producing one. DECAY PARAMETER: alpha, the fraction of table entries
    transported by the true phi with the remaining 1 - alpha relabelled at random. Certification rate
    must be AFFINE in alpha with slope 1 and intercept 1/N. A retention that fails to fall as alpha
    decreases is the canonical artifact tell (docs/inventor-protocol.md, controls before belief) and
    voids the run set.'
  independent_variables: []
  metrics:
    primary:
    - per-entry certificate pass count, per arm
    - field operations for C_build and for c_eval, counted separately
    - group operations for table build, online phase, and verification
    - peak stored entries and bytes, per arm
    secondary:
    - measured (S, T) and the product S*T^2, per cell
    - matched rho and BSGS group operations on the identical instances
    - wall clock and peak memory, per run
  heuristic_under_test: null
  preregistered_prediction:
    quantity: fraction of transported table entries passing the certificate [r_i]phi(P) == phi(R_i)
    formula: EXACTLY 1.000 (S of S entries) for true transport, at every tested (p, class, ell, S).
      Anything below 1.000 with gcd(deg phi, N) = 1 is an implementation error, not a mathematical
      finding. Null arm (random relabelling) must be at 1/N, i.e. 0 successes at every toy size. A
      gap of less than 0.999 between the arms voids the instrument.
    source: pre-registered in IDEA-20260807-a127ab before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - C_build/c_eval conflation. The single most likely error in this lane is charging isogeny CONSTRUCTION
    per point instead of once. The protocol counts them in separate registers and reports both.
  - Field operations versus group operations. Transport is priced in field operations, the online
    phase in group operations. A conversion factor must be measured per bit size on the same machine,
    and every conclusion must be checked to survive a factor-2 perturbation of it (the H-MTIC-001
    HEUR-001 dual-accounting audit is the precedent and is adopted here).
  - Toy classes are tiny. At p ~ 2^{10} an isogeny class may have 3-6 prime-order members, so M is
    small and the factor-M amortisation is invisible. The M-dependence must be read from the ARITHMETIC,
    not extrapolated from toy M.
  - Storage accounting. A table entry is a point plus a scalar; whether it is stored as (x, y, r),
    as (x, sign, r), or as a truncated distinguished-point hash changes S by a small constant and
    the frontier product by its square. The encoding must be frozen before Stage 3 and reported with
    every number.
  - Path length inflation. A brute-force toy path search may return a much longer path than necessary,
    inflating C_build and making transport look worse than it is. Shortest-path search within the
    enumerated class is required and L must be reported.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACTLY 1.000 (S of S entries) for true transport, at every tested (p, class,
    ell, S). Anything below 1.000 with gcd(deg phi, N) = 1 is an implementation error, not a mathematical
    finding. Null arm (random relabelling) must be at 1/N, i.e. 0 successes at every toy size. A gap
    of less than 0.999 between the arms voids the instrument.
  falsification_criterion:
  - Any transported entry fails its certificate with gcd(deg phi, N) = 1. T1 would be false, which
    contradicts an elementary theorem; the honest disposition is suspected implementation error requiring
    independent replication before it is reported as anything else.
  - The random-relabelling null certifies above 1/N. Instrument broken; nothing is reported and the
    run set is INVALID, not negative.
  - The alpha sweep is not affine with slope 1. The retention metric is not measuring what it claims
    and every downstream number is void.
  - cost_B does not scale independently of S. Mode B's whole advantage is that independence; a measured
    S-dependence refutes the cost model.
  - The measured family product S_total*T^2 falls below N. This CONTRADICTS the expected outcome,
    would be a non-generic signal in the multi-group preprocessing model, and requires review-breakthrough
    review (AGENTS.md rule 12) before any claim.
  - Toy sizes are too small to resolve the Mode A crossover within budget. That is an INFRASTRUCTURE
    outcome (AGENTS.md rule 5), recorded as such, and is not evidence about the cost model.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
