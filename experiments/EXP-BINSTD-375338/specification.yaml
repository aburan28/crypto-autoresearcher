# contract for H-BINSTD-74b002: Stage 0 ord_n(2)/stable-dim census + Koblitz
# A,B regression fixture + orbit-system restatement; Stage 1 equivariance vs
# per-instance-symmetry discrimination on named Koblitz toys (n=19 primary,
# n=17 stable-V control) per HOLD-R concrete_experiment.
#
# Source: IDEA-20260922-7ab503 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Absorbs review defects from
# analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-7ab503.yaml
# (verdict defective / HOLD-R): equivariance not symmetry; empty on
# K-163/ECC2K-130; parser bug already fixed; named toys; zero per-instance
# leaf-count claim.
#
# ZERO RUNS in this design packet. Stages 0-1 authorized for later executor
# TASK-20261001-ff051b. No AUXIN. Amazon Bedrock prohibited.
# packaging_only false.
# =============================================================================
experiment:
  id: EXP-BINSTD-375338
  hypothesis_id: H-BINSTD-74b002
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-7ab503
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Stage 0 absolute-Frobenius reachability census (ord_n(2), empty|live) +
    Koblitz A,B regression fixture; Stage 1 equivariance vs unsound
    single-instance constraint on BIN-TOY-K19 / BIN-TOY-K17-STABLE
  status: approved
  approved_by: DEC-20261001-495bd1
  approved_at: '2026-10-01'
  packaging_only: false
  approval:
    approved_by: DEC-20261001-495bd1
    composing_decision: DEC-20261001-495bd1
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 only. HOLD-R defects
      absorbed; source IDEA per-instance leaf-count claim is the named
      falsifiable alternative, not the primary success criterion.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stages 0-1 only. Stage 0 is arithmetic/census (zero scientific group
      walks on deployed curves). Stage 1 is toy exhaustive census + shift
      tests at m=2 on named cells. Solver leaf-count arms, normal-basis
      construction, deployed-curve attacks, and HOLD-I orbit-system solving-
      degree comparisons are NOT authorized.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    (A) Commit the corrected absolute-Frobenius / orbit-batched reachability
    cells: ord_n(2) and stable-dimension sets for named n; mark K-163 and
    ECC2K-130 STRUCTURALLY EMPTY; flag live rows for FROB routing.
    (B) Demonstrate at toy scale that absolute Frobenius is equivariance
    between conjugate targets (same_instance_hits=0, conjugate_hits=1.0),
    that a single-instance shift-canonical constraint is unsound
    (solutions_lost>0), and that stable-V bookkeeping holds (n=17 control).
    (C) Record the parser-regex regression fixture as already satisfied.

  class: structure-validation
  class_note: >-
    Proof-oriented discrimination of equivariance vs per-instance symmetry
    (HOLD-R), plus Stage 0 arithmetic census. Not a heuristic-validation of
    smoothness CDFs; HEUR ids are falsification hooks for the equivariance
    and unsoundness predictions. No exponent-moving claim. Cost-model fields
    record measured-vs-modeled separation for the census column vs any later
    leaf-count (unauthorized here).

  corrections_absorbed:
    equivariance_not_symmetry: >-
      Primary claim is a77711 Lemmas A1/A2 at q=2: sigma maps I_R to
      I_{sigma R}; V(I_R) ∩ V(I_{sigma R})=empty for R in G\{O}. Source IDEA
      claim (A)/(D) per-instance leaf division by mu is REJECTED as primary
      and retained only as named falsifiable alternative.
    empty_rows: >-
      K-163 (ord_163(2)=162) and ECC2K-130 (ord_131(2)=130) structurally
      empty for useful orbit-batched V; live rows K-233+ route to FROB.
    parser_bug: >-
      hexblob() third fallback already accepts optional (0xHEX) on current
      tree; Stage 0 records regression fixture only, not a new defect.
    named_toys: >-
      BIN-TOY-K19 (review cell) and BIN-TOY-K17-STABLE; RC-1 null; Z/l
      scalar replica. RC-1 with generic A is NOT a Frobenius endomorphism
      test curve for positive arms.

  scope:
    included:
      - >-
        Stage 0 (arithmetic; zero scientific trials on deployed curves):
        (i) recompute ord_n(2) for n in {17,19,131,163,233,239,283,409,571};
        (ii) derive stable-dimension sets from T^n-1 factorisation over F_2;
        (iii) write empty|live verdict per named standardized Koblitz /
        ECC2K-130 row; (iv) Koblitz A,B regression fixture against
        binary-curve-params.txt (six rows in F_2); (v) confirm current
        subfield_scan.py hexblob() regex accepts (0xHEX) form; (vi)
        restatement artifact: orbit-system reading replacing per-instance
        symmetry (cite a77711 A1/A2).
      - >-
        Stage 1 (toy executable cells): BIN-TOY-K19 primary; BIN-TOY-K17-
        STABLE positive control; NULL-RC1; Z/l scalar replica; tests (a)-(e)
        from HOLD-R concrete_experiment; m=2 only; every claimed
        decomposition certificate-reverified by summing on the curve.
    excluded:
      - Any scientific group walk / attack run at deployed m >= 131
      - Per-instance CNF-XOR leaf-count arms claiming division by mu
      - Normal-basis constructor / HOLD-I solving-degree comparison
      - Composite ANSI c2pnb* orbit systems (owned elsewhere / FROB)
      - AUXIN / QSP / SEMBIN edits
      - Amazon Bedrock

  inputs:
    proposal: ledger/proposals/IDEA-20260922-7ab503.yaml
    review: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-7ab503.yaml
    curve_audit: analysis/binstd-curve-audit/
    hypothesis: ledger/hypotheses/H-BINSTD-74b002.yaml
    a77711: ledger/proposals/IDEA-20260906-a77711.yaml
    optional_code_refs:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
    cells:
      Stage0-ord-column:
        n_list: [17, 19, 131, 163, 233, 239, 283, 409, 571]
        frozen_expected_ord_n_2:
          17: 8
          19: 18
          131: 130
          163: 162
          233: 29
          239: 119
          283: 94
          409: 204
          571: 114
        empty_rows: [ECC2K-130, K-163]
        live_rows: [K-233, K-283, K-409, K-571, sect239k1]
      BIN-TOY-K19: >-
        Koblitz y^2+xy=x^3+1 over F_2[t]/(t^19+t^5+t^2+t+1); #E=4*130873
        (l=130873 prime, review-computed — recompute at setup; halt on
        disagreement); m=2; V={deg<10} polynomial-basis window (~512 points);
        50 targets R in G with >=1 m=2 decomposition over V, found by
        exhaustive census; fixed recorded integer seed for any randomised
        subsample of the census (default: use all qualifying targets up to
        50, deterministic order by x-coordinate).
      BIN-TOY-K17-STABLE: >-
        Koblitz over F_{2^17} with a,b in F_2; choose Frobenius-stable V of
        dimension in the stable set (ord_17(2)=8 — dims include 8,9);
        m=2; enough targets with certified decompositions for in-V shift
        test (minimum 20). Exact irreducible and (A,B) recorded at setup.
      NULL-RC1: >-
        Non-Koblitz ordinary binary curve at matching n (prefer n=19) with
        A a generic field element (review exemplar A=97044 at its native n,
        or a freshly sampled non-F_2 A at n=19); sigma(P) must not lie on E
        for random points — instrument must report not-on-curve for every
        shifted tuple.
    stage0_expected_review_precompute:
      note: >-
        Frozen EXPECTED values for independent recomputation (recomputed
        column vs expected column — never mixed).
      ord_n_2: {17: 8, 19: 18, 131: 130, 163: 162, 233: 29, 239: 119, 283: 94, 409: 204, 571: 114}
      koblitz_ab_in_F2:
        sect163k1: {A: 1, B: 1}
        sect233k1: {A: 0, B: 1}
        sect283k1: {A: 0, B: 1}
        sect409k1: {A: 0, B: 1}
        sect571k1: {A: 0, B: 1}
        sect239k1: {A: 0, B: 1}

  controls:
    - name: leg_swap_same_instance
      object: >-
        Test (c): (x_2, x_1) decomposes same R. MUST be 100%. Genuine
        same-instance symmetry control; failure invalidates the instrument.
    - name: zl_scalar_replica
      object: >-
        Test (d): in Z/l let "sigma" be multiplication by the scalar mu by
        which sigma acts on G; apply same (a)/(b) tests to a random
        size-matched window. Curve statistics must match the replica
        (equivariance of a group action, no curve geometry).
    - name: null_non_koblitz_RC1
      object: >-
        Test on NULL-RC1: every shifted tuple reports not-on-curve.
        Distinguishes endomorphism from non-endomorphism.
    - name: stable_V_positive
      object: >-
        BIN-TOY-K17-STABLE: shifted legs stay in V (in-V fraction=1.0).
        Isolates stable-subspace bookkeeping from the emptiness pattern.
    - name: koblitz_ab_regression_fixture
      object: >-
        Stage 0: six Koblitz A,B values match frozen expected F_2 values
        from binary-curve-params.txt (fresh grep).
    - name: certificate_oracle
      object: >-
        Every claimed decomposition re-verified by summing points on the
        curve; exhaustive census so no solver verdict is trusted alone.

  independent_variables:
    - curve_cell  # BIN-TOY-K19 | BIN-TOY-K17-STABLE | NULL-RC1 | Stage0-row
    - n
    - m  # frozen at 2 for Stage 1
    - V_kind  # nonstable_window | frobenius_stable | size_matched_random_Zl
    - test_arm  # a_same_R | b_conjugate | c_leg_swap | d_Zl_replica | e_canonical_constraint
    - target_seed

  metrics:
    primary:
      - same_instance_hits
      - conjugate_instance_hits
      - solutions_lost_under_canonical_constraint
      - shifted_legs_in_V_fraction
      - ord_n_2_recomputed
      - stable_dimension_set_per_n
      - empty_or_live_verdict_per_named_row
    secondary:
      - leg_swap_hit_rate
      - curve_over_generic_ratio
      - certificate_pass_rate
      - koblitz_ab_fixture_match
      - hexblob_regex_accepts_ox_form
      - peak_rss_bytes
      - wall_s
      - termination_reason

  heuristic_under_test:
    - HEUR-BINSTD-74b002-H0
    - HEUR-BINSTD-74b002-H1
    - HEUR-BINSTD-74b002-H2

  preregistered_prediction:
    quantity: >-
      (A) same_instance_hits=0; (B) conjugate_instance_hits=1.0 on Koblitz
      toys; (C) solutions_lost_under_canonical_constraint median fraction
      within [0.7,1.0]*(1-1/n) at n=19; (D) in-V fraction=1.0 on stable-V
      control and ~0 on n=19 non-stable window; (E) Stage 0 ord_n(2) matches
      frozen expected column exactly.
    formula: >-
      Equivariance: sigma(I_R)=I_{sigma R}; V(I_R)∩V(I_{sigma R})=∅ for
      R∈G\{O}. Unsoundness: fraction lost ≈ 1-1/n under free cyclic action.
      Stable V: V^2=V ⇒ shifted legs in V.
    source: >-
      IDEA-20260906-a77711 Lemmas A1/A2; analysis/binstd-idea-review-20260926/
      reviews/IDEA-20260922-7ab503.yaml concrete_experiment; H-BINSTD-74b002
    claim_tier: observational
    measured_vs_modeled: >-
      Stage 0 ord_n(2) and stable dims are RECOMPUTED arithmetic (labeled
      recomputed); review precompute is EXPECTED comparator in a separate
      column. Stage 1 hit counts, fractions, wall_s, peak_rss are MEASURED.
      The source IDEA's predicted leaf-ratio ~1/mu is MODELED/ALTERNATIVE
      only and is NOT scored as a Stage 1 success metric (unauthorized arm).

  scale_relevance:
    tier: toy
    justification: >-
      Stage 1 toys at n in {17,19} with m=2 are brute-forceable and sit in
      the same structural emptiness pattern as ECC2K-130 (ord≈n-1). Transfer:
      empty-cell verdict for ECC2K-130/K-163 is arithmetic (ord_n(2)), not
      extrapolated from toy hit rates. Toy equivariance certificates support
      the q=2 reading of a77711 only at tested cells; no attack claim at
      deployed parameters.
    correspondence: null

  tail_checks:
    - >-
      Single worst-case target's solutions_lost fraction reported alongside
      median (not averaged away).
    - >-
      Any same_instance_hit is a hard stop / headline, not absorbed into a
      rate.
    - >-
      Stable-V control must achieve exact 1.0 in-V, not "near 1".

  replication:
    seeds:
      - 20261001
      - 20261002
      - 20261003
      - 20261004
      - 20261005
    independent_instances: >-
      Primary n=19 cell uses exhaustive census (deterministic); seeds apply
      to Z/l replica window draws and any optional subsample. Minimum 5
      independent Z/l replica draws. Stable-V control: >=20 targets.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 20
    maximum_workers: 1

  stopping_rules:
    - >-
      Stage 0 complete when ord column, stable dims, empty|live verdicts,
      A,B fixture, and regex fixture are written.
    - >-
      Stage 1 complete when tests (a)-(e) recorded for BIN-TOY-K19 with
      certificate verification, plus stable-V control, RC-1 null, and >=5
      Z/l replica draws.
    - >-
      Hard stop on first same_instance_hit with sigma R != R: preserve
      artifacts, set termination_reason, do not interpret as support.
    - Advisory wall-clock: checkpoint and report; never fabricate completion.

  invalidation_rules:
    - leg_swap_hit_rate < 1.0 on any Koblitz toy cell
    - RC-1 null reports on-curve shifted images
    - #E or l recomputation disagrees with frozen cell description at setup
    - certificate_pass_rate < 1.0 on claimed decompositions
    - timeout/crash/OOM → failed_infrastructure, not negative math evidence
    - Amazon Bedrock invocation attempted → abort

  success_criterion: >-
    Stage 0: recomputed ord_n(2) matches frozen expected for all listed n;
    K-163 and ECC2K-130 marked STRUCTURALLY EMPTY; live rows listed; A,B
    fixture matches; regex fixture confirms (0xHEX) accepted.
    Stage 1: same_instance_hits=0; conjugate_instance_hits=1.0 on Koblitz
    toys; solutions_lost_under_canonical_constraint > 0 with median fraction
    in [0.7,1.0]*(1-1/19); stable-V in-V fraction=1.0; all controls pass.
    Decidable from predefined metrics without post-hoc threshold tuning.

  falsification_criterion: >-
    Any of: same_instance_hit with sigma R != R; conjugate_hits < 1.0 on
    Koblitz toys; solutions_lost=0 on all Stage-1 targets; stable-V in-V
    < 1.0; Stage 0 ord mismatch after independent recompute; control
    invalidation. Distinguishable from infrastructure via invalidation_rules.

  required_artifacts:
    - experiments/EXP-BINSTD-375338/stage0/ord-n-2-census.yaml
    - experiments/EXP-BINSTD-375338/stage0/stable-dimension-sets.yaml
    - experiments/EXP-BINSTD-375338/stage0/reachability-table-cells.yaml
    - experiments/EXP-BINSTD-375338/stage0/koblitz-ab-regression-fixture.yaml
    - experiments/EXP-BINSTD-375338/stage0/hexblob-regex-fixture.yaml
    - experiments/EXP-BINSTD-375338/stage0/orbit-system-restatement.md
    - experiments/EXP-BINSTD-375338/stage1/metrics-summary.json
    - experiments/EXP-BINSTD-375338/stage1/certified-decompositions/
    - experiments/EXP-BINSTD-375338/stage1/controls-report.yaml
    - experiments/EXP-BINSTD-375338/runs/*/manifest.yaml
    - experiments/EXP-BINSTD-375338/runs/*/raw-result.json
    - experiments/EXP-BINSTD-375338/runs/*/stdout.log

  procedure:
    stage0:
      - Recompute ord_n(2) = multiplicative order of 2 modulo n for each listed prime n.
      - Factor T^n-1 over F_2; emit stable-dimension set; compare to expected emptiness pattern.
      - Write reachability-table-cells.yaml with empty|live + routing note (FROB for live).
      - Grep binary-curve-params.txt for six Koblitz A,B; write fixture.
      - Assert current subfield_scan.py hexblob() third fallback accepts (0xHEX).
      - Write orbit-system-restatement.md citing a77711 A1/A2 and HOLD-R.
    stage1:
      - Setup BIN-TOY-K19; recompute #E and l; halt on disagreement.
      - Exhaustive census of unordered pairs in V×V with P1+P2=±R for targets in G; keep 50 with ≥1 decomp.
      - Test (a): shifted tuple vs same R — predict never.
      - Test (b): shifted tuple vs sigma(R) — predict always as points; record in-V fraction.
      - Test (c): leg-swap — predict always.
      - Test (d): Z/l scalar replica ≥5 seeds — statistics must match.
      - Test (e): impose lex-smallest shift-orbit constraint; count solutions lost.
      - Run BIN-TOY-K17-STABLE in-V test and NULL-RC1 not-on-curve test.
      - Certificate-verify every SAT/decomposition claim by curve summation.

  assigned_to: executor
  dominated_by: >-
    Matched rho with Frobenius classes on every standardized Koblitz row;
    within decomposition, a77711/GGMP orbit batching on live rows. This
    experiment's sota_delta is table-correctness (empty cells + equivariance
    certificate), not attack-cost improvement.
  sota_delta:
    time: Zero attack-cost delta at ECC2K-130/K-163; per-instance mu division claimed = 0.
    memory: Unchanged.
    data_queries: N/A.
