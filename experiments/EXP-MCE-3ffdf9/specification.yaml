experiment:
  id: EXP-MCE-3ffdf9
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-MCE-31d438
  question_id: RQ-MCE-e65b3c
  goal_id: GOAL-MCE-001
  source_idea_id: IDEA-20260805-9704d9
  assigned_to: executor

  title: >-
    Review-required contract: exact GF(2) verification of the binary-Goppa
    squarefree-doubling identity and of the m*t dimension excess at r = 2t,
    against a matched random-multiplier alternant null and a graded
    squarefreeness ladder

  objective: >-
    If separately approved, frozen and authorized, decide by exact F_2 linear
    algebra at toy scale whether a binary Goppa code with squarefree g of degree
    t is ALSO an alternant code of degree 2t, and whether in that presentation
    it carries a dimension excess of exactly m*t over a MATCHED alternant code
    with a uniformly random multiplier at identical (n, m, r). The stake is
    GOAL-MCE-001's headline number: if the identity holds, "the alternant degree
    of Classic McEliece" takes two admissible values differing by a factor of
    two, and the distance from any degree-stated published threshold cannot be
    reported as a single number until the reading stage says which value that
    threshold consumes. The experiment also emits, as free arithmetic, the five
    exact redundancy fractions that the excess equals as a fraction of n.

  what_this_is_not:
    - Not an attack, a break, a key recovery, or a decoding computation of any kind.
    - Not a distinguisher result. The square-code arm MEASURES an observable; measuring it is not distinguishing, and promoting a measurement toward a distinguisher or a key recovery is forbidden by docs/claims-and-verification.md and by RQ-MCE-e65b3c constraint 4.
    - Not a reading of arXiv:2304.14757, KN-LIT-13a01d, KN-LIT-71d1a0 or KN-LIT-7ee1a9. None of those papers was read for this contract; the only text used is the quoted observation EV-MCE-332f99 O-5.
    - Not a citation of the doubling identity to any author, year, venue or theorem number. None is asserted, because none was checked.
    - Not a correction to KN-LIT-4c8135, to RQ-MCE-e65b3c.constraints, or to any other record. Those are Coordinator acts queued in GOAL-MCE-001's next_action and this contract is disjoint from them.
    - Not a claim that Classic McEliece is closer to, or further from, any attack regime. The direction is an output of the reading stage, not an input.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has happened.
    - Not a re-attempt at iacr:2026/1232's PDF by any route.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      TOY, and RQ-MCE-e65b3c's ceiling is unchanged and unwaived. A completed run
      could support exactly this: that at m in {4,5,6}, t in {2,3,4,5} and
      n <= 64, over the declared field representations and the declared unfiltered
      cells, the two codes Gamma(L,g) and Gamma(L,g^2) coincide for squarefree g;
      that the measured dimension excess at r = 2t is the stated integer against a
      matched null measured in the same run; and that the square-code observable
      takes the tabulated values with a generic reference column. It could NOT
      support any statement about Classic McEliece's security, about any
      distinguisher's existence or non-existence, about any published threshold
      whose text was not obtained, or about anything at m = 13 and n = 6960. The
      DOUBLING IDENTITY, if verified, is scale-independent algebra and the toy run
      CHECKS A DERIVATION rather than extrapolating -- but the square-code table
      has no such property and is a toy measurement with no crypto-scale reading
      whatsoever. EV-MCE-332f99 O-8's exclusion of mceliece348864 from the ISO
      list is carried on the face of any table using the phrase "standardized
      parameter sets".

  environment_measured_not_assumed: >-
    Measured on this container rather than assumed, because two scouting reports
    of this session disagreed: python 3.11.15; numpy 2.4.6 PRESENT; sage ABSENT;
    sympy ABSENT; fpylll ABSENT; src/ic_first_fall_fast.py fails to import for
    want of sage. NO STAGE OF THIS CONTRACT REQUIRES ANY ABSENT PACKAGE.
    F_(2^m) is implemented directly over an explicit irreducible polynomial and
    F_2 rank is Gaussian elimination on Python integers used as bit rows, so all
    ranks are exact and no floating point enters any measured quantity. numpy
    may be used for bookkeeping only and NEVER for a rank.

  inputs:
    field_representation:
      policy: >-
        One explicit irreducible polynomial per m, WRITTEN INTO THIS CONTRACT so
        a third party reproduces the arithmetic bit-for-bit and no library
        default silently changes the field.
      m4: "x^4 + x + 1"
      m5: "x^5 + x^2 + 1"
      m6: "x^6 + x + 1"
      element_encoding: >-
        An element of F_(2^m) is the integer whose bit j is the coefficient of
        x^j. Multiplication is carry-less multiplication followed by reduction
        by the polynomial above. The mapping is stated so the artifact's element
        listings are checkable by hand.
    grid:
      m_values: [4, 5, 6]
      t_values: [2, 3, 4, 5]
      n_rule: "n in {2^m, 2^m - 1}"
      filter: >-
        A cell (m, t, n) is UNFILTERED iff n - 2*m*t >= 1. Cells failing the
        filter are EXCLUDED BEFORE ANY MEASUREMENT, are listed in the artifact
        as filtered with their (m, t, n), and produce no number. The generic
        bound n - m*r is vacuous below that threshold and measuring delta there
        would manufacture a spurious excess.
      support_rule: >-
        L is the elements of F_(2^m) in increasing integer order under the
        encoding above, truncated to n, minus any element that is a root of the
        g in use. A cell whose |L| falls below n after that removal is recorded
        with its actual |L| and the actual value is used everywhere; it is never
        padded.
    goppa_polynomials:
      treatment_stream: >-
        For each (m, t): enumerate monic polynomials of degree t over F_(2^m) in
        increasing integer order under the encoding above, retain those that are
        SQUAREFREE (gcd(g, g') = 1, computed exactly in F_(2^m)[X]) and have no
        root in L, and take the first 20. If fewer than 20 exist the actual
        count is used and reported.
      graded_stream: >-
        g_j = g_0 * h^j for j = 0,1,2,3, with g_0 the first squarefree monic of
        degree t-3 in the enumeration order and h the first monic linear
        polynomial coprime to g_0 whose root is NOT in L. Degrees therefore run
        t-3, t-2, t-1, t; the degree change is recorded and the comparison is
        made WITHIN each j against that j's own generic bound, never across j.
    null_multipliers:
      count_per_cell: 20
      derivation: >-
        y_i = 1 + (H_i mod (2^m - 1)) interpreted in F_(2^m) under the encoding
        above, where H_i is the big-endian unsigned integer of
        SHA-256(domain || "|" || label || "|" || decimal(m) || "|" ||
        decimal(t) || "|" || decimal(n) || "|" || decimal(replicate) || "|" ||
        decimal(i)), with domain = "EXP-MCE-3ffdf9/v1" and label = "nullmult".
        The +1 and the modulus 2^m - 1 together guarantee y_i is nonzero, which
        the alternant definition requires. A drawn value must be re-derived
        identically by any third party from this rule alone.
    random_code_control:
      count_per_cell: 20
      derivation: >-
        A uniformly random [n, k] binary code is drawn as the row space of a
        k-by-n matrix whose rows are the low n bits of
        SHA-256(domain || "|randcode|" || decimal(m) || "|" || decimal(t) ||
        "|" || decimal(n) || "|" || decimal(replicate) || "|" || decimal(row)),
        redrawn with an incremented row counter if the rank falls short of k.
        Every redraw is logged with its counter so the stream is reproducible.
    master_seed_policy: >-
      There is no master seed integer. Every pseudorandom object in this
      contract is derived by the SHA-256 rules above from the cell parameters
      and a declared label, so the entire input set is a deterministic function
      of the grid and is reproducible bit-for-bit without transmitting a seed.
      This is stated instead of inventing a seed number.
    external_reads_stage_3:
      specification: >-
        The transcribed Classic McEliece specification already in this goal's
        lineage, read for one question only: does it require g irreducible,
        merely squarefree, or neither? The answer is QUOTED VERBATIM.
      threshold_papers: [KN-LIT-13a01d, KN-LIT-4c8135, KN-LIT-71d1a0, KN-LIT-7ee1a9]
      threshold_question: >-
        For each, record VERBATIM the parameter its applicability condition is
        stated in, classified as DEGREE, RATE, CODE-FAMILY, or ABSENT with the
        routes tried. No other question is asked of these papers by this
        contract.
      forbidden_route: >-
        iacr:2026/1232's PDF is NOT re-attempted. Its 403 is path-scoped and
        reproducible (EV-MCE-332f99 O-9), circumvention is forbidden, and a
        blocked route is a recorded outcome (AGENTS.md rule 5).

  arms_and_controls:
    treatment: >-
      For each unfiltered cell and each squarefree g in the treatment stream:
      build Gamma(L, g) and Gamma(L, g^2) as F_2 codes via their alternant
      parity checks expanded over a fixed F_2-basis of F_(2^m); compute exact
      ranks; test row-space equality by requiring rank of the stacked generators
      to equal each individual rank; and record delta at r = t and at r = 2t.
    measured_null: >-
      NULL-RANDMULT, the matched null. A_r(L, y) at IDENTICAL (n, m, r),
      identical field, identical construction and identical rank code, differing
      ONLY in that y is drawn by the declared SHA-256 rule instead of being
      g(alpha_i)^(-1). FORCED VALUES DERIVED BEFORE THE RUN: delta = 0 at BOTH
      r = t and r = 2t, hence dim A_t - dim A_(2t) = m*t EXACTLY, against the
      Goppa arm's delta = m*t at r = 2t and dimension difference 0. THIS NULL
      CAN FAIL: if a random multiplier also exhibited the doubling, the
      phenomenon would not be about Goppa structure at all and the hypothesis
      would be refuted by its own control. Per-cell attainment rate of
      dim A_r = n - m*r is reported BEFORE any Goppa number is compared against
      it; a cell below 0.90 attainment is EXCLUDED from the contrast rather than
      the contrast being reinterpreted (HEUR-SD-1).
    positive_control: >-
      TWO, both required, both with zero tolerance.
      CTRL-RANDCODE: a uniformly random [n, k] binary code must return the
      GENERIC square-code dimension of its dual, min(n, C(s+1,2)) with s the
      dual dimension. CTRL-DEGENERATE: at g = 1 the Goppa code is all of F_2^n
      and the pipeline must return dim = n; and at (m, t) = (m, 1) every monic
      linear g has its root in F_(2^m), so under the no-root-in-L rule the
      ADMISSIBLE count must be EXACTLY 0 -- an enumerator returning anything
      else is not applying the precondition. IF EITHER POSITIVE CONTROL FAILS,
      THE RANK ROUTINE OR THE CODE CONSTRUCTION IS BROKEN AND NO NEGATIVE RESULT
      FROM ANY ARM MAY BE REPORTED (inventor protocol section 3).
    graded_control: >-
      CTRL-SQFREE, four points, monotonicity reported. The graded stream
      g_j = g_0 * h^j, j = 0..3, measuring dim Gamma(L, g_j) - dim Gamma(L,
      g_j^2). FORCED: EXACTLY 0 at j = 0, NON-DECREASING in j, strictly positive
      by j = 3. This converts a possible "the identity did not hold" into "the
      identity holds up to multiplicity j and fails from j onward", localising
      the obstruction to squarefreeness itself. A flat sweep means squarefreeness
      is not the driver, which falsifies the stated mechanism while leaving the
      FV-A measurement intact.
    ordering_control: >-
      The null arm and both positive controls are computed for every cell, their
      per-cell outputs hashed, and those hashes committed BEFORE any treatment
      number is examined. The decision rule for each control is fixed in this
      contract and is not revisable afterwards. EV-IC-002 is this program's own
      precedent for a verdict retracted because a criterion was revised after
      the prior criterion was observed to fail.
    comparability_policy: >-
      Numbers are compared only WITHIN a cell and WITHIN a degree. Cross-cell
      comparison of delta is meaningless because m*t differs; cross-degree
      comparison inside the graded arm is forbidden because deg g_j varies by
      construction, and each j is compared only against its own generic bound.

  independent_variables:
    - m, over {4, 5, 6}
    - t, over {2, 3, 4, 5}
    - presentation degree r, over {t, 2t}
    - arm, over {goppa, null_randmult, randcode, degenerate, graded_j}
    - graded multiplicity j, over {0, 1, 2, 3}

  metrics:
    primary:
      - >-
        FV-A: fraction of unfiltered treatment instances at which Gamma(L,g) and
        Gamma(L,g^2) have identical F_2 row spaces.
      - >-
        FV-B: delta(Gamma(L,g), 2t) = dim Gamma(L,g) - (n - 2*m*t), per instance,
        as an exact integer.
      - >-
        FV-D: delta(A_(2t)(L, y_random), 2t) and dim A_t(L,y) - dim A_(2t)(L,y),
        per null instance, as exact integers.
    secondary:
      - Fraction of treatment instances attaining dim Gamma(L,g) = n - m*t exactly, per cell.
      - Per-cell attainment rate of dim A_r(L, y) = n - m*r for the null arm, at both r = t and r = 2t, reported before any contrast.
      - FV-C: the five redundancy fractions (n-k)/n in exact lowest-terms rationals and to six decimals.
      - CTRL-SQFREE table over j = 0..3 with monotonicity stated as a boolean.
      - Square-code dimensions dim((C^perp)*(C^perp)) for four arms against the generic reference min(n, C(s+1,2)), with the (m,t) cell at which any shortfall first appears.
      - CTRL-RANDCODE and CTRL-DEGENERATE outcomes.
      - List of filtered cells with their (m, t, n) and the value of n - 2*m*t.
      - Stage-3 census: per paper, DEGREE / RATE / CODE-FAMILY / ABSENT with a verbatim quotation or the routes tried; and the verbatim specification sentence on g's squarefreeness or irreducibility.

  heuristic_under_test: HEUR-SD-2

  preregistered_prediction:
    quantity: >-
      Four pre-registered quantities, of two kinds, stated separately so neither
      is read as the other. FORCED INTEGERS: FV-A, FV-B, FV-D, FV-C, and the
      CTRL-SQFREE value at j = 0. NO PREDICTION AT ALL: the size of any
      square-code shortfall, which is deliberately left unpredicted.
    formula: >-
      FV-A = 1.00 (identity at every unfiltered squarefree instance, at least 60
      instances across at least 3 values of m).
      FV-B = m*t exactly at every instance attaining dim Gamma(L,g) = n - m*t;
      integer identity, no tolerance.
      FV-D: delta = 0 exactly and dim A_t - dim A_(2t) = m*t exactly, at at
      least 90 per cent of null draws per unfiltered cell.
      FV-C = 24/109, 13/48, 52/209, 1547/6960, 13/64, i.e. 0.220183, 0.270833,
      0.248804, 0.222270, 0.203125 to six decimals, obtained as 1 minus the
      rates 85/109, 35/48, 157/209, 5413/6960, 51/64.
      CTRL-SQFREE at j = 0 = 0 exactly, non-decreasing in j, strictly positive
      by j = 3.
      SQUARE-CODE ARM: the random-code control MUST attain min(n, C(s+1,2)); for
      the Goppa arm a strict shortfall is predicted at the high-rate cells and
      ITS SIZE IS NOT PREDICTED, because no defect formula was read and
      inventing one would be fabrication under AGENTS.md rule 5.
    source: >-
      FV-A from H-MCE-31d438 mechanism step 2, a RECALLED-UNVERIFIED identity
      with an in-repo derivative-is-a-square sketch and NO citation asserted.
      FV-B and FV-D from mechanism step 3, derived in-repo from the generic
      subfield-subcode bound dim A_r >= n - m*r. FV-C from
      ledger/evidence/EV-MCE-332f99.yaml observation O-1 by subtraction, using
      k = n - m*t from mceliece-spec-20221023.pdf section 3 as transcribed
      there and independently recomputed 5/5.

  scale_relevance:
    tier: toy
    justification: >-
      Two different things are measured and they have different scale
      properties, which is stated rather than blurred. The DOUBLING IDENTITY is
      an algebraic fact that does not depend on m, n or t, so verifying it at
      m <= 6 CHECKS A DERIVATION and its verification transfers -- what does not
      transfer is any claim that a specific published threshold is affected,
      which is the reading stage's business. The SQUARE-CODE TABLE has no such
      property: it is a toy measurement at m <= 6 and n <= 64 with NO
      crypto-scale reading of any kind, and any citation of it must carry that.
      The FV-C arithmetic is exact at the real parameter sets but is arithmetic
      on published parameters, not a measurement, and remains toy.
    correspondence: >-
      null. Nothing is sampled to reach scale; the toy cells are the object, and
      the real parameter sets enter only as arithmetic.

  tail_checks:
    - >-
      At the LARGEST unfiltered cell and the SMALLEST, the row-space equality of
      Gamma(L,g) and Gamma(L,g^2) is verified by a second, independent route --
      mutual containment tested by reducing each generator of one against the
      row-echelon form of the other -- and must agree with the stacked-rank test
      at every instance. A disagreement is an implementation failure, not a
      result.
    - >-
      The generic square-code reference min(n, C(s+1,2)) is evaluated at both
      the boundary cells where the min switches branch, so the branch logic is
      exercised rather than assumed.
    - >-
      For at least one cell, the code dimensions are cross-checked against a
      brute-force enumeration of the code's codewords at n <= 20, so the parity-
      check-to-generator path is validated end to end at least once.

  replication:
    seeds: []
    seeds_note: >-
      EMPTY AND CORRECT AS AN INTEGER LIST. There is no master seed. Every
      pseudorandom object is derived by the declared SHA-256 rules from the cell
      parameters and a label, so reproducibility is by declared construction and
      no seed number is invented. The replicate counters used inside those rules
      are 0..19 per cell and are recorded per draw.
    independent_instances: 20
    independent_instances_note: >-
      20 squarefree g per cell, 20 null multipliers per cell, 20 random codes
      per cell, across up to 24 grid cells before filtering.
    interpretation: >-
      A single execution is a design-validation computation. It cannot support
      or reject any claim about any scheme. What replication buys here is the
      per-cell attainment RATES, which are the quantity that makes the matched
      contrast interpretable at all.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
    network: >-
      STAGES 1 AND 2 REQUIRE NO NETWORK AND MUST BE RUNNABLE WITH IT DISABLED.
      Stage 3 requires network, is separately budgeted at 10800 wall-clock
      seconds, and is NOT AUTHORIZED BY THIS CONTRACT.

  stage_order_and_termination:
    stage_0: >-
      Zero compute. Re-derive H-MCE-31d438 mechanism steps 1 and 3 -- that
      Gamma(L,g) = A_t(L, g(alpha)^(-1)), that delta(C,r') - delta(C,r) =
      m*(r'-r), and that delta(C, 2t) = n - k under k = n - m*t. A failure here
      ends the line before any code is written.
    stage_1: >-
      Pure Python, seconds, no network. Field arithmetic, code construction,
      exact ranks; then in this order: CTRL-DEGENERATE, CTRL-RANDCODE,
      NULL-RANDMULT with its per-cell attainment rates, and only then the
      treatment arm FV-A and FV-B, followed by CTRL-SQFREE. FV-A IS THE PRIMARY
      FALSIFIER AND CAN TERMINATE THE WHOLE LINE IN SECONDS.
    stage_2: >-
      Pure Python, seconds, no network. The square-code arm with its generic
      reference column, and the FV-C arithmetic at the five parameter sets.
    stage_3: >-
      Reading, network, separately budgeted, NOT AUTHORIZED HERE. The
      specification's squarefreeness requirement quoted verbatim, and the
      four-paper threshold-parameter census. Every paper not obtained is ABSENT
      with the routes tried.
    cheapest_decisive_gate: stage_0, then stage_1's FV-A

  stopping_rules:
    - Do not execute unless this contract is separately reviewed, approved, frozen, archived and explicitly authorized. Only the Coordinator approves (AGENTS.md rule 1); no approved_by field is present.
    - Stop the whole line if stage 0 refutes the alternant identification or the delta shift rule.
    - Stop before any treatment number is examined if either positive control fails.
    - Exclude from the contrast, and report as excluded, any cell whose null attainment rate is below 0.90; compute no contrast for that cell.
    - Stop and report if FV-A fails at any unfiltered squarefree instance; record the failing instance in full (m, t, n, g, both dimensions) and do not weaken the prediction.
    - Do not construct or measure any code at m = 13 or n = 6960. The five parameter sets enter as ARITHMETIC ONLY.
    - Do not report any square-code shortfall as a distinguisher, and do not compare a measured shortfall to any published formula, since no such formula was read.
    - Do not state a distance from any threshold whose text was not obtained.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any rank computed with floating point, or any use of numpy for a rank rather than for bookkeeping.
    - Any measurement in a cell failing the n - 2*m*t >= 1 filter, or any filtered cell omitted from the artifact.
    - Any comparison of a measured dimension against a designed value rather than against the matched null measured in the same run.
    - Any modification to the null arm or to either positive control after a treatment number has been read.
    - Any citation of the doubling identity to an author, year, venue or theorem number.
    - Any statement presenting step 6's candidate mechanism as a reading of arXiv:2304.14757.
    - Any edit to, or status change of, KN-LIT-4c8135, RQ-MCE-e65b3c or any other existing record.
    - Any attempt on iacr:2026/1232's PDF.

  infrastructure_failure_disposition: >-
    A timeout, crash, missing dependency, unreachable source or HTTP 403 is
    recorded as an INFRASTRUCTURE OBSERVATION with its exact symptom and is
    NEVER negative mathematical evidence (AGENTS.md rule 5). Specifically: a
    stage-3 paper that cannot be obtained yields an ABSENT census row with the
    routes tried, never a conclusion that the threshold is not degree-stated;
    and a stage-1 crash yields a partial cell table reporting exactly which
    cells completed, never a conclusion about the identity.

  success_criterion: >-
    This contract has NO CURRENT SUCCESS OUTCOME because it is not authorized
    for execution; its only present disposition is "review_required draft". If a
    separately approved, frozen and authorized successor is executed, its only
    positive disposition is a COMPLETE INSTRUMENT READOUT, defined as ALL of:
    (a) both positive controls passing with zero tolerance; (b) the null arm's
    per-cell attainment rates reported before any treatment number, with the
    excluded cells named; (c) FV-A reported over at least 60 unfiltered
    squarefree instances across at least 3 values of m; (d) FV-B and FV-D
    reported as exact integers per instance with the matched contrast displayed
    side by side; (e) CTRL-SQFREE reported over j = 0..3 with monotonicity
    stated; (f) the square-code table with its generic reference column and no
    predicted size claimed for any shortfall; (g) FV-C reproducing the five
    exact rationals; and (h) the filtered-cell list.
    NOTE EXPLICITLY: FV-A COMING OUT AS 0.00 -- the identity failing -- IS A
    COMPLETE AND SUCCESSFUL READOUT, not a failed batch. It refutes HEUR-SD-2 in
    seconds and is the cheapest possible outcome of the whole line. This is
    written into the criterion so that a refutation cannot later be presented as
    a failure.

  falsification_criterion: >-
    The hypothesis H-MCE-31d438 is falsified by ANY of: FV-A failing at a single
    unfiltered squarefree instance (falsifies H2-A, and with it H2-B and H2-C);
    the matched null ALSO exhibiting the doubling (falsifies the identifiability
    claim by the experiment's own control); FV-C failing to reproduce the five
    exact rationals (falsifies either this derivation or the committed
    transcription, and the contradiction is routed to a correction record rather
    than absorbed); or the stage-3 census returning DEGREE for zero papers
    (falsifies H2-C's relevance to GOAL-MCE-001, leaving H2-A and H2-B intact as
    coding theory with no bearing on any published threshold -- which must be
    recorded in exactly those words and not reframed).
    A positive-control failure falsifies the INSTRUMENT, not the hypothesis, and
    blocks all reporting.
    THE PLANNED NEGATIVE: if stage 1 passes and stage 3 is blocked, the package
    MUST state plainly that the relevance claim is UNRESOLVED, with the routes
    tried, and MUST NOT let the verified algebra borrow the unfinished reading
    stage's significance. A package that omits that statement has not finished,
    and under inventor-protocol section 4 its honest status is unverified.

  required_artifacts:
    - The approved frozen specification and a freeze receipt binding its SHA-256.
    - Field-arithmetic self-test transcript (multiplication table closure, inverse checks) for each m, run before any code is built.
    - Per-instance records - (m, t, n, |L|, g as an integer list of coefficients, dim Gamma(L,g), dim Gamma(L,g^2), identity holds yes/no, delta at r = t, delta at r = 2t).
    - Per-cell null-arm attainment rates at r = t and r = 2t, timestamped and hashed BEFORE the treatment arm.
    - CTRL-DEGENERATE and CTRL-RANDCODE outputs with their zero-tolerance pass/fail.
    - CTRL-SQFREE table over j = 0..3 with monotonicity stated as a boolean.
    - Square-code table, four arms, with the generic reference column and the first-shortfall cell.
    - FV-C arithmetic, five exact rationals plus six-decimal forms, with the (m, n, t) source line for each.
    - Filtered-cell list with n - 2*m*t for each.
    - Tail-check outputs including the brute-force codeword enumeration at one cell.
    - Stage-3 census - per paper, classification plus verbatim quotation or ABSENT with routes tried; and the verbatim specification sentence on g.
    - Complete manifest - exact commands, git commit and dirty-tree state, environment and dependency versions, resolved model identifier and probe status, stdout, stderr, timestamps, resource measurements, validity status and reason.
    - A snapshot archive followed by independent Validator and Red Team review, per GOAL-MCE-001 completion criterion 3.

  approval_requirements:
    - Independent review confirms that NULL-RANDMULT can actually fail and is matched in n, m, r, field and construction, differing only in the multiplier.
    - Independent review confirms that both positive controls are genuine sensitivity demonstrations with zero tolerance, and that the cell filter is applied before measurement.
