# EXP-ECDLP-7f7ccc
# Digit-count arithmetic. No curve point is added.
# Approved by DEC-20261004-dc76fb.
experiment:
  id: EXP-ECDLP-7f7ccc
  hypothesis_id: H-ECDLP-296414
  source_idea: IDEA-20261003-ac4b14
  question_id: RQ-ECDLP-002
  version: 1
  title: Doubling count and addition count of the integer 127
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-dc76fb
  objective: >-
    Check the counts 7, 6, and 6, the product 252, and the nearby gap 0.
  inputs:
    bit_length: 7
    doublings: 6
    additions: 6
    length_gap: 1
    doubling_gap: 0
    digit_product: 252
    digit_sum: 19
    nearby_a: 6
    nearby_b: 6
    nearby_gap: 0
    nearby_product: 36
  controls:
    - >-
      The bit length is 7. The doubling count is 6. The addition
      count is 6. Reporting the addition count as 7 drops the gap
      against the bit length and invalidates the run.
    - >-
      Seven exceeds six by 1. Six equals six, so that gap is 0.
      The product of 7, 6, and 6 is 252. Their sum is 19.
    - >-
      Two readings of the addition count are both 6. Their gap is
      0 and their product is 36.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {bits, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - additions
      - implementations_agree
    secondary:
      - digit_product
      - digit_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The integer 127 has bit length 7, 6 doublings, and 6
      additions. The gap of two addition counts is 0.
    formula: >-
      Read the bit length 7. Count 6 doublings. Count 6 additions.
      Multiply 7, 6, and 6. Subtract 6 from 6.
    source: >-
      IDEA-20261003-ac4b14 states the counts 7, 6, and 6, read
      2026-10-04. The gaps, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 252 and the nearby gap 0 are required. A check that stops at the bit length 7 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the addition count 6 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 7.
    - The doubling count is not 6.
    - The addition count is not 6.
    - The product is not 252.
    - The addition count is reported as 7, or a curve point is added.
  success_criterion: >-
    Both runs agree that the bit length is 7, that the doubling
    count is 6, that the addition count is 6, and that the product
    of those three counts is 252.
  falsification_criterion: >-
    The runs agree that the addition count is computed, and that
    count is not 6.
  required_artifacts:
    - experiments/EXP-ECDLP-7f7ccc/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-7f7ccc/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-7f7ccc/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-7f7ccc/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-7f7ccc/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-7f7ccc/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a digit-count gap moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
