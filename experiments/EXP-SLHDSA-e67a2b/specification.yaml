# EXPERIMENT CONTRACT -- EXP-SLHDSA-e67a2b (review_required, unapproved, zero runs).
experiment:
  id: EXP-SLHDSA-e67a2b
  hypothesis_id: H-SLHDSA-604af3
  derived_from_idea: IDEA-20261018-0e2ae9
  question_id: RQ-SLHDSA-001
  goal_id: GOAL-SLHDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Per-field acceptance census at n in {8,12} bytes
  objective: Whether any signature field is accepted after mutation beyond collision rates.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: Python 3 toy signer and two verifiers (reference-faithful, planted lax); multiprocessing
    parameters: >-
      n in {8,12} bytes; h=8, d=2, k=8, a=4, w=16; 10^4 signatures; all single-bit flips (~
      sig_len*8 each) subsampled to 10^6 per field; 10^6 trailing-byte variants
    procedure: >-
      1. Sign. 2. Mutate per field. 3. Verify with both verifiers. 4. Tabulate acceptance
      with Clopper-Pearson CIs. 5. Compare to collision surface.
  controls:
  - 'null: random byte strings of signature length, acceptance must be ~0'
  - 'positive: planted lax verifier skipping one auth-path node'
  - 'A/A: reference verifier census under two seed blocks'
  independent_variables:
  - verifier
  - n_bytes
  metrics:
    primary:
    - accepted fraction per field
    secondary:
    - acceptance vs n slope
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: accepted fraction per hashed field
    formula: approximately (number of hash inputs the field feeds) x 2^{-8n}
    source: collision probability of truncated output
  scale_relevance:
    tier: toy
    justification: 'n reduced to make collisions visible; transfer assumption: rate scales
      as 2^{-8n}'
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 10
    maximum_memory_gb: 4
    maximum_runs: 12
  stopping_rules:
  - stop at 10^6 mutations per field
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - >-
    a verifier disagreement with an independent verifier on honest signatures invalidates
    the run
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    Success (no non-binding field) if C3 shows every field within 2x of prediction and C2
    shows the 2^{-8n} slope (P1, P2), with C1 confirming the instrument sees a planted defect
    (P3), beyond the AA1 noise floor.
  falsification_criterion: >-
    Falsified if C3 shows any field accepted above 10x prediction or C1 fails to separate
    the planted lax verifier.
  decision_impact:
    on_positive: >-
      Record SLH-DSA reference as field-binding and supply the census harness for implementation
      audits.
    on_negative: Isolate the non-binding field and file a SUF-CMA defect claim with a certificate
      pair.
  variable_ledger:
    independent:
    - name: verifier
      levels:
      - reference
      - planted_lax
    - name: n_bytes
      levels:
      - '8'
      - '12'
    factors:
    - name: seed_block
      treatment: randomized
      value: seed blocks A and B, disjoint master seeds
      how: >-
        two disjoint master seeds derived by SHAKE256 from a frozen label; every arm run under
        both
    comparisons:
    - id: C1
      arms:
      - reference n=8
      - planted_lax n=8
      differs_in:
      - verifier
      design: one_factor
    - id: C2
      arms:
      - reference n=8
      - reference n=12
      differs_in:
      - n_bytes
      design: one_factor
    - id: C3
      arms:
      - reference vs collision prediction per field
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - reference n=8 seed-block A
      - reference n=8 seed-block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-0e2ae9.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-0e2ae9.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P3
    first_recorded_in: ledger/proposals/IDEA-20261018-0e2ae9.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml with frozen parameters, seeds, code commit and tool versions
  - raw-result.json with per-trial records and verification flags
  - acceptance table CSV
  - example accepted mutations with verifier transcripts
  - PDF report
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-SLHDSA-e67a2b/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-0e2ae9.
    standing_authorization: >-
      AGENTS.md 'Standing user authorization' lets the Coordinator approve once the contract
      is complete and runnable; no user re-approval is required.
