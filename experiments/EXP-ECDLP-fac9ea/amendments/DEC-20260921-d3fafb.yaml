protocol_amendment:
  id: DEC-20260921-d3fafb
  experiment_id: EXP-ECDLP-fac9ea
  version_from: 1
  version_to: 2
  recorded_at: '2026-09-21'
  predecessor_path: experiments/EXP-ECDLP-fac9ea/specification.yaml
  predecessor_sha256: d7434225ebbaed536057fd0c1f7645fa9ec5df8c91884a67688cd587a06fecd7

  reason: >-
    Pre-run resolution of an internal inconsistency in the frozen
    specification's prime_ladders.secondary block, discovered during
    implementation preparation BEFORE any cell has run (registry.json does
    not exist yet; no transform has been executed). The frozen text says
    the secondary ladder is "at least 8 primes spanning 2^12..2^26, chosen
    as the smallest prime >= 2^{12 + 1.7*j} for j = 0..7" and, in the same
    block, that it "includes the largest point 2^26-class prime used for
    the jackknife tail check". These two statements conflict: the formula
    for j = 0..7 tops out at exponent 23.9, which does not reach 2^26 and
    cannot serve as the jackknife tail point. The primary-ladder block
    separately states that "the 2^26 point is added from the secondary
    ladder below so the full span 2^12..2^26 is covered", so the intent
    that a 2^26-class prime be included is stated twice and the formula is
    the single outlier. Per the additive-amendment rule, no frozen value is
    rewritten: the eight formula primes (j = 0..7) stand exactly as frozen,
    and ONE additional prime is appended -- the smallest prime >= 2^26 --
    making the secondary ladder 9 primes, satisfying "at least 8" and both
    2^26 statements. The jackknife tail point of tail_checks is the
    largest prime over both ladders, which after this amendment is that
    appended 2^26-class prime. No statistic row, control, metric,
    convention, seed, budget, stopping rule, or success/falsification
    criterion is touched. Decided by the coordinator session executing
    TASK-20260921-4888d4 preparation; recorded before any run so the
    census executes against a single unambiguous ladder.

  changes:
    - >-
      prime_ladders.secondary: EXTENDED additively from the 8 frozen
      formula primes (smallest prime >= 2^{12 + 1.7*j} for j = 0..7) to 9
      primes by appending the smallest prime >= 2^26, found by the same
      deterministic trial-division scan in canonical order and frozen in
      the manifest before any transform runs. The eight formula primes are
      unchanged.
    - >-
      tail_checks jackknife point: clarified to be the largest prime over
      both ladders after the extension above (the appended 2^26-class
      prime). This is a clarification of which frozen point serves as the
      already-frozen jackknife tail, not a new check.
  execution_scope: >-
    This amendment authorizes no additional run, no re-run, and no change
    to budget (maximum_runs stays 1): the census has not yet executed, so
    version 2 of the ladder list is the list the single frozen run uses.
  decided_by: coordinator
