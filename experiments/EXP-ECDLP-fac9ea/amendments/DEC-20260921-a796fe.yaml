protocol_amendment:
  id: DEC-20260921-a796fe
  experiment_id: EXP-ECDLP-fac9ea
  version_from: 3
  version_to: 4
  recorded_at: '2026-09-21'
  predecessor_path: experiments/EXP-ECDLP-fac9ea/specification.yaml
  predecessor_sha256: ea92a69ab37dd88a60f35283da4eade1e1cacd94e00a7f47276190217f3dccbe
  predecessor_amendments: [DEC-20260921-d3fafb, DEC-20260921-f1d95a]

  reason: >-
    Named-successor extension, executing the next action recorded in
    DEC-20260921-4516a0 (the evidence round on RUN-ECDLP-8e13c2): the R07
    index-5 coset reading (lambda 0.5709 +- 0.0349) is the ONLY
    PGL_2-stable, above-random-level candidate in the census, and it was
    decided on 4 fit points because the frozen ladder wastes 6 of its 10
    possible points on primes where p != 1 mod 5 makes the row
    unavailable. This amendment authorizes exactly one additional bounded
    run scoped to deciding that reading: a dedicated p = 1 mod 5 prime
    ladder, the R07 row, its PGL_2 battery variant R07M, and the two
    analytic controls (C01, C02A, plus C02B for seed agreement) on the
    same ladder. The success criterion is stated in the
    CONVENTION-FREE form that survives the unadjudicated normalisation
    conflict (DEC-20260921-4516a0 limitations): the decision quantity is
    the level difference delta = lambda(R07) - lambda(C02A) fitted on the
    same ladder, since a uniform transform prefactor shifts both lambdas
    equally and cancels in the difference. Under the standing user
    authorization of 2026-09-06 and the DEC-20260921-4516a0 next_actions,
    no further user confirmation is required; the Coordinator's
    completeness check is satisfied by this amendment's frozen ladder,
    rows, seeds, controls, metrics, stopping rules, and artifacts.

  changes:
    - >-
      budget.maximum_runs: EXTENDED from 1 to 2, the second run scoped
      ONLY to the work named here (one full pass over the frozen extension
      cells; no further run authorized by this amendment).
    - >-
      ADDITIVE ROW SET (extension run only): R07 (index-5 coset
      indicator, probability normalisation, construction unchanged from
      amendment DEC-20260921-f1d95a), R07M (its frozen-hash Moebius
      variant), C01, C02A, C02B (constructions unchanged).
    - >-
      ADDITIVE PRIME LADDER (extension run only), frozen deterministically
      before any transform: the smallest prime p >= 2^(12 + 1.2*j) with
      p = 1 mod 5, for j = 0..10 (11 primes spanning 2^12..2^24), found by
      the canonical trial-division scan in canonical order; every prime on
      this ladder satisfies the R07 congruence by construction, so the row
      has 11 fit points instead of 4. All primes are <= 2^24.2-class, the
      range in which RUN-ECDLP-8e13c2's ok cells stayed within the 8 GiB
      machine-protection cap.
    - >-
      PRIMARY DECISION METRIC (extension run only): delta =
      lambda(R07) - lambda(C02A) on the extension ladder, with SE(delta)
      from the two fits; verdict vocabulary: resolved_above_random if
      delta > 2*SE(delta) with >= 10 R07 fit points; at_random_level if
      |delta| <= 2*SE(delta); unresolved otherwise (fewer points, control
      failure, or HEUR-1-style two-spacing disagreement on either fit).
      The absolute gate thresholds (1/4, 1/6) are NOT applied to this
      extension (they are convention-relative per DEC-20260921-4516a0).
    - >-
      CONTROLS (extension run only): C01 exact numerical zero; C02A/C02B
      seed agreement within 2SE and both within the Parseval band 0.5 +-
      (2SE + 0.02) under the executed normalisation; R07M PGL_2 stability
      within 2SE of R07 (a deviation marks the row artifactual and leaves
      delta unresolved); vhat(0) = 1 within 1e-9 in every ok cell; a
      naive O(p^2) DFT spot check at the smallest extension prime and a
      second independently structured chirp-z at a mid extension prime,
      agreement 1e-9.
    - >-
      STOPPING RULES (extension run only): first failed control voids the
      extension run (infrastructure, never evidence); memory above 8 GiB
      checkpoints the cell resource_exhaustion with a continuation
      pointer (machine protection; NOT expected on this ladder, whose
      largest prime is 2^24.2-class where the previous run stayed within
      cap); no ladder prime, row, or seed change after any cell outcome.
    - >-
      REQUIRED ARTIFACTS (extension run only), under
      experiments/EXP-ECDLP-fac9ea/runs/TASK-20260921-a5e995/:
      r07_driver.py, r07_checker.py, manifest.yaml, r07_registry.json,
      r07_fits.json, r07_report.md, command.txt, environment.json,
      stdout.log, stderr.log, raw-result.json.
  execution_scope: >-
    Exactly one additional bounded run (RUN-ECDLP-ccf8f0) over the frozen
    extension cells. No re-run of the original census, no new registry
    rows beyond those named, no change to any frozen field of version 3.
  decided_by: coordinator
