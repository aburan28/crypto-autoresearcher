protocol_amendment:
  id: DEC-20260921-e7edc5
  experiment_id: EXP-ECDLP-fac9ea
  version_from: 4
  version_to: 5
  recorded_at: '2026-09-21'
  predecessor_path: experiments/EXP-ECDLP-fac9ea/specification.yaml
  predecessor_sha256: ea92a69ab37dd88a60f35283da4eade1e1cacd94e00a7f47276190217f3dccbe
  predecessor_amendments: [DEC-20260921-d3fafb, DEC-20260921-f1d95a, DEC-20260921-a796fe]

  reason: >-
    Named-successor extension, executing the chunked/low-precision
    continuation pointer recorded in the RUN-ECDLP-8e13c2 registry for
    the 26 resource_exhaustion cells at the appended 2^26-class tail prime
    67108879, and in DEC-20260921-4516a0's next actions. The original
    measurement of those cells breached the frozen 8 GiB machine-
    protection cap (two complex128 padded arrays + bspec mmap pages +
    chirp live together at L = 167772160; measured 9.6-13.8 GiB
    high-water, disclosed in the manifest) because the pre-run need
    estimate missed the mmap page contribution. The continuation pointer
    names 'chunked or on-disk convolution'; the cheapest sound route that
    stays within the cap is SINGLE-PRECISION (complex64) execution of the
    SAME transform algorithm: every array halves (L-sized arrays 1.34 GiB
    each), projected peak ~5 GiB, comfortably within cap. Precision is
    bounded, not assumed: a dual-precision cross-check runs one full row
    (R03) at a mid ladder prime (4818013) in BOTH complex128 and
    complex64 and records the relative L1 difference as the empirical
    precision bound for the tail prime; the complex64 tolerance for the
    vhat(0)=1 invariant is set to 1e-4 relative accordingly, and the C01
    numerical-zero threshold to 1e-2 relative (PRE-ARCHIVE CORRECTION,
    disclosed: this amendment's first draft set 1e-5, a complex128-scale
    bound; the measured complex64 zero-row noise floor at the tail prime
    is 2.2e-3 relative -- single-precision FFT roundoff accumulated over
    67 million zero coefficients -- so the achievable bound is 1e-2.
    Corrected before any archive or publication of the tail results;
    measurement values untouched.) Under the standing user
    authorization of 2026-09-06 and the recorded next actions, no further
    user confirmation is required.

  changes:
    - >-
      budget.maximum_runs: EXTENDED from 2 (amendment DEC-20260921-a796fe)
      to 3, the third run scoped ONLY to the work named here (one pass
      over the frozen tail cells plus the dual-precision cross-check
      cells); no further run authorized by this amendment.
    - >-
      TAIL RE-MEASURE SET (exactly 26 cells at p = 67108879): C01, C02A,
      C02B, R01, R01M, R02, R02M, R03, R03B, R03M, R04, R04M, R05, R05M,
      R06, R06:curve0..2, R06M, R08, R08:curve0..2, R08M, R09, R09M.
      R07:67108879 and R07M:67108879 remain unavailable (p mod 5 = 4,
      certificate already recorded). Constructions, seeds, and the frozen
      probability normalisation are unchanged; the values preserved in
      the original registry cells (measured during the disclosed breach)
      are superseded by this run's in-cap measurements, with the old
      values retained in git history and in the original registry file.
    - >-
      PRECISION ROUTE: the same Bluestein exponent-space chirp-z over the
      prime, executed in complex64 (single-precision FFT path); projected
      peak ~5 GiB against the 8 GiB cap, enforced by the same guard with
      complex64-sized need estimates.
    - >-
      DUAL-PRECISION CROSS-CHECK (frozen before the run): R03 at p =
      4818013 in complex128 AND complex64; the relative L1 difference is
      recorded as the empirical precision bound; success requires it <=
      1e-4.
    - >-
      CONTROLS (this run): vhat(0) = 1 within 1e-4 relative for every ok
      cell; C01 numerical zero within 1e-2 relative of |vhat(0)| (see
      the pre-archive correction in the reason block); the
      C02A/C02B seed agreement and Parseval band (0.5 +- (2SE + 0.02))
      refit with the tail point included; checker spot re-derivations
      (naive DFT at the smallest ladder prime and a second independently
      structured chirp-z at a mid ladder prime, both in complex64 against
      a complex128 reference, agreement 1e-4).
    - >-
      OUTPUT: refits of every affected row with the tail point included
      (lambda, SE, jackknife on the new largest point), and a verdict
      comparison against the census verdicts (EV-ECDLP-81f4d4). Any
      verdict change is reported as the primary outcome; none is expected
      from a single additional ladder point, and the normalisation-
      invariant findings (PGL_2 deltas, coset-vs-random level) do not
      depend on it.
    - >-
      REQUIRED ARTIFACTS under experiments/EXP-ECDLP-fac9ea/runs/
      TASK-20260921-3a6335/: tail_driver.py, tail_checker.py,
      manifest.yaml, tail_registry.json, tail_fits.json, tail_report.md,
      command.txt, environment.json, stdout.log, stderr.log,
      raw-result.json.
  execution_scope: >-
    Exactly one additional bounded run (RUN-ECDLP-0c5f65): the 26 tail
    cells, the dual-precision cross-check, and the refits. No new rows,
    no other primes, no change to any frozen field of version 4.
  decided_by: coordinator
