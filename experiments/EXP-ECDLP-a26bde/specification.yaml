experiment:
  id: EXP-ECDLP-a26bde
  hypothesis_id: H-ECDLP-6a9479
  derived_from_idea: IDEA-20260905-848b77
  instrument_idea: IDEA-20260905-dacf4f
  question_id: RQ-ECDLP-c1b7b1
  goal_id: GOAL-ECDLP-001
  version: 1
  title: >-
    Explicit global lifts of toy discrete-log instances: the formal-group digit
    identity, the m-squared size law, the non-homomorphic contrast, the leak from
    any explicit lift, and the anomalous break step
  status: approved
  objective: >-
    On five frozen global curves with small rational points, reduced at toy primes,
    compute exact multiples m S^ over Q, read their formal-group digit at p, and
    verify the identity d(m S^) = m d(S^) mod p, the size law of x(m S^), the
    failure of the identity for the Teichmuller section, the recovery of m from any
    explicit lift with certificate, and the refusal of the torsion-section step on
    an anomalous curve. Decide H-ECDLP-6a9479 claims (1)-(4).
  inputs:
    procedure: >-
      STAGE 0 (zero compute, blocking): freeze the five curves and their primes by
      the seeded generator; write the derivation note (splitting, uniqueness of the
      section, the digit identity, the size law with the recalled height
      comparison flagged). STAGE 1 (instrument, blocking): the p-adic module's five
      self-checks (shared with EXP-ECDLP-1e6502; may be reused with the transcript
      hash). STAGE 2: exact multiples and digits. STAGE 3: contrast, leak and
      anomalous break. STAGE 4: report.
    mechanism: >-
      For each curve and prime: compute S = S^ mod p, n = ord(S), verify gcd(n, p)
      = 1 and #E != p. Compute X_S = S^ - t(S) p-adically at precision 4 via the
      module (S^ reduced mod p^4 is an ordinary lift of S), v = v_p(psi(X_S)),
      d(S^). For each m in the ladder compute m S^ exactly over Q (double-and-add
      on fractions), record the numerator bit-size of x(m S^), reduce m S^ mod
      p^(v+2) (numerator times inverse denominator; if the denominator is
      divisible by p then n divides m and the point is skipped and counted), and
      compute d(m S^) via the module; compare with m d(S^) mod p. Fit log
      bit-size against log m for m >= 16. Contrast: compute delta_1(s(m S)) for
      the Teichmuller section of the reduced point and test linearity in m.
      Leak: for seeded j, T' = (m + j n) S^ exactly; read d(T') and the bit-size
      of x(T'); recover |m + j n| = round(sqrt(bitsize / c)) with c the measured
      constant of claim (2), fix the sign and residue by d(T') mod p, obtain m,
      certify [m]S = T by independent recomputation. Anomalous: on the anomalous
      curve, call torsion_section and record that it refuses at the division by n
      = p in E_1; any other failure is a defect.
    instrument: >-
      Python fractions for exact arithmetic; the p-adic module of
      IDEA-20260905-dacf4f; harness/toycurve.py; harness/runner.py for run
      records. No numpy.
  controls:
    - the five instrument self-checks (blocking)
    - the Teichmuller section as the non-homomorphic contrast (blocking for claim 3)
    - the anomalous curve as the proves-too-much object (blocking for claim 4)
    - independent certificate [m]S = T on every recovered scalar (blocking)
    - a second prime per curve so the identity is not prime-specific
  independent_variables:
    - curve in the frozen five
    - prime in the frozen four per curve
    - m in the ladder
    - j in {-3, ..., 3}
  metrics:
    primary:
      - digit identity agreement rate per curve and prime
      - size slope with bootstrap interval, and the fitted constant
      - Teichmuller linearity rate
      - leak recovery count with certificates
      - anomalous break step (which function refused, at which operation)
    secondary:
      - v per instance
      - skipped multiples (n divides m) per instance
      - wall seconds and peak bytes per run
  heuristic_under_test: null
  preregistered_prediction:
    quantity: d(m S^) versus m d(S^) mod p; bit-size of x(m S^) versus m
    formula: exact equality; bit-size proportional to m^2 with slope 2.00 +- 0.05
    source: >-
      IDEA-20260905-848b77 (splitting and digit identity) and the recalled
      quadraticity of the canonical height; pre-registered before any run; never
      tuned to data.
  scale_relevance:
    tier: toy
    justification: five curves, primes of 10 to 14 bits, m to 256; evidence capped at claim_tier toy.
    correspondence: null
  tail_checks:
    - Instances with v > 1 are listed; the identity is checked at precision v + 1 and v + 2 on them.
    - The largest deviation of bit-size / m^2 from its limit at m = 256 is reported per curve.
  replication:
    seeds: [20260905]
    independent_instances: 20
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 4
    maximum_memory_gb: 4
    maximum_runs: 24
  stopping_rules:
    - Stop at maximum_runs or total_cpu_hours, whichever binds first.
    - Stop immediately if a self-check fails; measurements with a failed instrument are attempted_and_inconclusive.
  invalidation_rules:
    - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure and is never negative mathematical evidence (AGENTS.md rule 5).
    - A recovered scalar whose certificate fails makes the instance completed_invalid.
  success_criterion: >-
    Digit identity agreement 1.0 on every instance; size slope 2.00 +- 0.05;
    Teichmuller linearity rate at most 3/p; certified recovery on every leak
    instance; the anomalous curve refuses at the division by n = p. This supports
    H-ECDLP-6a9479 claims (1)-(4) at toy scale.
  falsification_criterion:
    - Any exact disagreement in the digit identity after the self-checks pass. Claim (1) false.
    - Size slope outside 2.00 +- 0.05. Claim (2) false as stated; reported with the measured constant.
    - Teichmuller linearity rate far above 3/p. Claim (3) false; uniqueness contradicted.
    - Recovery failure or an anomalous break at another step. Claim (4) fails; defect or misplaced hypothesis.
    - Crashes, timeouts, memory exhaustion. Infrastructure, never negative mathematical evidence.
  required_artifacts:
    - manifest.yaml with command, commit, dirty-tree state, environment and the inference block
    - raw-result.json with every instance's v, digits, bit-sizes, agreement flags, recovery certificates and the anomalous break transcript
    - the frozen curve and prime list
    - the Stage 0 derivation note
    - the self-check transcripts or their hash if reused from EXP-ECDLP-1e6502
  assigned_to: executor
  approved_by: coordinator
  approval_gate:
    - Coordinator approval required before execution; this contract is a design draft and is NOT approved.
    - Stage 1 is blocking; no multiple is computed before the self-checks pass.
    - The leak arm consumes the scalar to build the lift it reads; its output is a demonstration of the identity, never a recovery result, and the evidence record must say so.
