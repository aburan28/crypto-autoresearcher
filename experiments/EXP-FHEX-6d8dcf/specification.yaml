experiment:
  id: EXP-FHEX-6d8dcf
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-28a7fb; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-28a7fb
  question_id: RQ-FHE-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Derive and mechanically verify the exact count of samples under one key that stated levelled-circuit
    families publish, under three declared conventions, and tabulate it against the conventional sample
    counts a security derivation assumes.
  objective: The one uncertainty a run reduces is whether the sample count a homomorphic circuit publishes
    under a single key is a well-defined, convention-labelled function of circuit shape, and how far
    it departs from the conventional value a cost-model evaluation uses. (i) It forces the definitional
    question into the open by enumerating the plausible conventions for what a sample is and reporting
    the count under each, rather than choosing one silently. (ii) It produces closed-form counts for
    three circuit families and cross-checks them mechanically against an independently written circuit
    walker on a thousand random instances per family, so the derivation is verified rather than asserted;
    a discrepancy is the audit's most valuable output. (iii) It establishes the counts per modulus
    level rather than as a single total, because samples at different moduli are not interchangeable
    and a single total would already be a modelling assumption. The run enters no cost model, computes
    no bit count, and produces no security estimate, by design.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for the three stated circuit
      families and the three declared conventions, the number of ciphertexts published under one key
      is the given closed form, verified against an independently written walker on the stated random
      instance sets, reported per modulus level; and those counts stand in the tabulated relation
      to the conventional sample counts named in the table. What does NOT follow: nothing whatever
      about attack cost, nothing about any security level, nothing about whether a larger sample count
      helps any adversary, and nothing about any parameter set. The map from sample count to cost
      is deliberately not entered, and no reader may infer a direction from the counts alone.'
  inputs:
    procedure: 'STAGE 0 (hours, human): write the convention definitions, naming for each what counts
      as a sample, whether both ring-ciphertext components count, and how a modulus-switched ciphertext
      is treated. STAGE 1 (hours, human): derive the nine closed forms, one per family-convention
      pair, as functions of depth and width. STAGE 2 (hours implementation, seconds compute): implement
      the circuit walker over a minimal DAG description, emitting counts per modulus level. STAGE
      3 (seconds): generate 1000 random instances per family with random depth in 1..12 and random
      width, run the walker, compare against the closed forms, and require exact agreement. STAGE
      4 (hours, human): write a second, independent walker for one family and require agreement with
      the first. STAGE 5 (seconds): run both walkers on structure-free DAGs of matched shape and require
      identical counts, which is the null. STAGE 6 (seconds): degenerate-circuit checks at depth 0
      and width 1. STAGE 7 (hours, human): tabulate against the conventional sample counts, each labelled
      as a convention with its source stated.'
    instrument: Python 3 with no numerical dependencies; a minimal DAG circuit description as nested
      tuples, a recursive walker, and a second walker written iteratively over a topological order
      so the two share no code. Random instance generation from a seeded generator, with the seed
      recorded. Run manifests through harness/runner.py conventions. No Sage, no FHE library, no lattice
      estimator, no cost model of any kind is imported or invoked, and the contract's success does
      not depend on any numeric library.
    parameters: 'Circuit families: balanced multiplication tree, sequential multiplication chain,
      matrix-vector product. Depth range 1..12, width range 1..64, sampled uniformly for 1000 random
      instances per family. Conventions: (C1) leaves and final output only; (C2) leaves, output and
      all relinearization outputs; (C3) every intermediate ciphertext that exists at any point. Modulus
      levels 1..8. Degenerate checks at depth 0 and width 1. Seeds: 3 independent instance-generation
      seeds. Structure-free null DAGs: 1000 per family, shape-matched to the signal instances.'
  controls:
  - Structure-free null circuits of matched shape, where the count must match exactly.
  - Closed-form cross-check against the walker on 1000 random instances per family.
  - All three conventions reported side by side, so no single convention can be selected after seeing
    the numbers.
  - 'Degenerate-circuit control: depth 0 and width 1, where the count is known by inspection.'
  - An independently written second walker for one family, required to agree with the first.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Null arm: run the identical circuit walker over circuits whose gates
    are replaced by structure-free no-ops that emit ciphertext-shaped objects with no homomorphic
    relationship, and over randomly generated directed acyclic graphs of matched shape. The count
    produced must be identical to the signal arm''s for matched shapes, because a counter must depend
    only on shape. For the audit to mean anything the null must show exactly this identity: a discrepancy
    would prove the walker is inferring something from gate semantics and is therefore not a counter.
    This is the inverse of the usual null, and stating it that way is deliberate: for a counting instrument
    the null must MATCH, not differ, and any measurement whose null must differ is not a counting
    instrument.'
  independent_variables:
  - circuit family
  - declared convention (C1, C2, C3)
  - circuit depth
  - circuit width
  - modulus level
  metrics:
    primary:
    - exact sample count per modulus level, per family, per convention
    - number of walker-versus-closed-form discrepancies over 1000 random instances per family
    - number of disagreements between the two independently written walkers
    - count on structure-free null DAGs of matched shape
    secondary:
    - ratio of the C3 count to the C1 count per family
    - ratio of counted samples to each tabulated conventional value
    - degenerate-circuit counts at depth 0 and width 1
    - instance-generation seeds and the realised depth and width distributions
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The discrepancy count between the hand-derived closed forms and the mechanically computed
      counts, and the ratio between the counts under the most and least inclusive conventions.
    formula: 'For the balanced tree of depth d under convention C3 with all intermediates retained,
      count = 2^(d+1) - 1 ciphertexts plus one relinearization output per internal node, i.e. 2^(d+1)
      - 1 + (2^d - 1); under C1, count = 2^d + 1. Predicted discrepancies between closed form and
      walker: exactly 0 over all 3000 instances. Predicted ratio count(C3)/count(C1) >= 2 for at least
      two of the three families at depth 8. Predicted null-DAG count exactly equal to the signal count
      at matched shape.'
    source: Pre-registered in the parent proposal IDEA-20260816-28a7fb before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The tested objects are circuit shapes at depth up to 12 and width up to 64, which
      are toy circuits by any measure. However the deliverable is a closed form verified over that
      range rather than a number read off at one point, so the transfer assumption is explicit and
      unusually weak: the closed forms are claimed to hold for the stated families at any depth and
      width, and the mechanical check over 3000 instances is evidence for the derivation rather than
      for an extrapolation. What does not transfer is any statement about circuits people actually
      run, whose shapes are not among the three families and which the contract does not model.'
    correspondence: null
  tail_checks:
  - Report the counts at the largest tested depth separately, since exponential family counts are
    where an off-by-one in a closed form shows up.
  - Report the per-modulus-level breakdown, not only the total, since a total hides the fact that
    samples at different moduli are not interchangeable.
  - Report the instances with extreme aspect ratio (depth 12 width 1, and depth 1 width 64) explicitly,
    since degenerate shapes are where walkers and closed forms most often diverge.
  - Report the count under a fourth, adversarially chosen convention proposed by a reviewer after
    the first three are published, to test that the convention set is not self-serving.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop and report a derivation error immediately on the first walker-versus-closed-form discrepancy,
    rather than continuing the sweep.
  - Stop if the two independent walkers disagree, and report which.
  - Halt the instance sweep at 1000 per family per seed.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Zero discrepancies between the nine closed forms and both independently written
    walkers over all random instances and all degenerate checks, with the structure-free null DAGs
    producing identical counts and at least two families showing a C3-to-C1 ratio of 2 or more at
    depth 8.
  falsification_criterion:
  - Any walker-versus-closed-form discrepancy, which falsifies the corresponding derivation.
  - Disagreement between the two independently written walkers.
  - Null DAG counts differing from signal counts at matched shape, meaning the walker is not a pure
    counter.
  - All three conventions yielding identical counts, which falsifies the convention-dependence claim
    and reduces the audit to one identity.
  - Degenerate-circuit counts disagreeing with counts obtained by inspection.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-28a7fb
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must rule whether the three conventions are an adequate enumeration or whether
    a fourth is required, since the audit's value is entirely a function of the convention set being
    defensible.
  - Whether both components of a ring ciphertext count as one sample or two is left as a declared
    choice and needs a ruling, as it changes every number by a factor of 2.
  - The relationship between a sample count and any cost model's dependence on m is deliberately not
    derived here, and the approved contract must state that this leaves the audit's practical significance
    undetermined rather than implying one.
  - The RQ-FHE-001 primary-source constraint must be ruled on, although this contract cites no attack
    claim and reads no external source at all.
