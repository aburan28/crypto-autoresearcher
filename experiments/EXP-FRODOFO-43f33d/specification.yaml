experiment:
  id: EXP-FRODOFO-43f33d
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-d270bc; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-d270bc
  question_id: RQ-FRODO-a2dbe2
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Argmax-label partition extractor for additive security bounds, validated on a hand-derived
    toy bound and run against a random-exponent null, with exponent-versus-constant mutation ladders
    as the diagnostic readout.
  objective: 'A run reduces exactly one uncertainty: whether projecting an additive security bound
    to its per-point dominant-term index yields a discriminative object, or an artifact of the grid.
    Stated as parts: (i) DOES THE EXTRACTOR WORK. Given a four-term bound whose partition is derivable
    by hand, does the implementation return that partition exactly, including the location of tie
    regions under interval arithmetic? This is the gating baseline reproduction demanded by RQ-FRODO-a2dbe2
    methods, and nothing downstream may be reported if it fails. (ii) IS THE PROJECTION DISCRIMINATIVE.
    Run on a random-exponent bound with matched term count, matched variable count and matched constant
    span, in the same invocation, does the pipeline return a materially different cell count and boundary
    structure than for the structured toy bound? If not, then any partition later extracted from the
    real FrodoKEM bound carries no information and the whole representation is dead, which is a cheap
    and useful negative. (iii) IS THE PARTITION AN EXPONENT FINGERPRINT. Under a one-unit exponent
    mutation ladder versus a factor-of-two constant mutation ladder, do topology-change rates separate?
    This is what licenses the later use of the partition to compare two independent transcriptions
    of a printed inequality. The run deliberately does NOT touch the FrodoKEM bound: no primary source
    is filed yet, and RQ-FRODO-a2dbe2 constraint 1 forbids designing against it.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: on a frozen grid, for the
      specific hand-written toy bound and the specific random-exponent null family used, the argmax
      projection produced cell counts, boundary normals and mutation-response rates with the measured
      values and error bars, and the extractor reproduced a hand-derived partition exactly. WHAT DOES
      NOT FOLLOW: nothing about FrodoKEM, nothing about any published bit-security figure, nothing
      about the tightness of any real reduction, and nothing about any adversary. A discriminative
      null result licenses only the later use of the same instrument on a filed transcription; it
      does not license any statement about what that transcription will show, and it is not evidence
      about plain LWE at any dimension.'
  inputs:
    procedure: 'STAGE 0, instrument build. Implement the term-list representation, the interval-arithmetic
      evaluator over log-space, the argmax labeller, the cell extractor and the boundary-normal recovery.
      Cost: implementation, no compute. STAGE 1, baseline reproduction gate. Hand-derive on paper
      the partition of a frozen four-term toy bound in three variables over a frozen grid, then run
      the extractor and require exact agreement including tie regions. Cost: minutes of CPU. A failure
      here halts the experiment and is reported as the result. STAGE 2, grid-refinement control. Re-run
      stage 1 at two and four times resolution, confirm cell count and normals are stable. Cost: minutes.
      STAGE 3, null arm. Generate one hundred random-exponent bounds with matched term and variable
      counts and matched constant span under frozen seeds, run the identical pipeline in the same
      invocation, and record the cell-count distribution and boundary structure. Cost: under one CPU-hour.
      STAGE 4, single-term degenerate control, which must return exactly one cell. Cost: seconds.
      STAGE 5, mutation ladders. For the toy bound and for ten null bounds, apply every one-unit exponent
      mutation and every factor-of-two constant mutation, recompute the partition, record topology-change
      indicators. Cost: under one CPU-hour. STAGE 6, write immutable run records through harness/runner.py,
      including the frozen grid, seeds and resolved inference block.'
    instrument: 'Python 3 standard library only for the mathematics: fractions.Fraction for exact
      rational exponent arithmetic, decimal.Decimal with explicitly set rounding contexts for the
      two-sided interval evaluation of logs, random.Random with recorded seeds for the null generator.
      No Sage, no external computer-algebra system, no lattice estimator. Run manifests, seeds and
      the resolved inference block are written through harness/runner.py exactly as every other run
      in this program; ids are minted with tools/allocate_id.py. Output is a per-arm JSON record of
      cell counts, boundary normals as integer vectors, tie fractions and mutation-response tables.'
    parameters: 'Toy bound: 4 terms, 3 variables, integer exponents in the range minus two to plus
      three, constants spanning 2^0 to 2^40. Grid: 3 axes, each 129 log-spaced points spanning 40
      binary orders of magnitude, frozen before the run; refinement arms at 257 and 513 points per
      axis. Null arm: 100 random bounds, seeds 1 through 100, exponents drawn uniformly from the same
      integer range, constants drawn log-uniformly over the same span. Mutation ladders: all 12 exponent
      slots at plus and minus one unit, all 4 constants at factors of one half and two, applied to
      the toy bound and to null bounds with seeds 1 through 10. Decimal precision 60 digits, with
      the interval width reported per grid point.'
  controls:
  - Random-exponent null bound with matched term count and matched constant span, run in the same
    invocation as the signal arm.
  - Single-term degenerate bound, which must yield exactly one cell.
  - Hand-derived toy bound with a paper-computable partition, used as the baseline reproduction gate
    before any other arm is reported.
  - Exponent mutation ladder at plus and minus one unit on each exponent in turn.
  - Constant mutation ladder at factors of one half and two on each constant in turn.
  - 'Grid-refinement control: re-run at twice the grid resolution and confirm cell count and boundary
    normals are stable, so that a reported cell is not a sampling artifact.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): A synthetic bound with the same number of terms and the same number
    of input variables, whose exponents are drawn uniformly at random from the integer range minus
    two to plus three and whose constants are drawn log-uniformly over the same span as the transcribed
    ones, evaluated by the IDENTICAL argmax pipeline on the IDENTICAL grid in the same invocation.
    The null must show materially MORE cells and boundary normals with no shared direction; if the
    random bound produces the same small cell count and the same near-axis-aligned boundaries as the
    transcribed bound, then the partition is a property of the grid and the pipeline rather than of
    FrodoKEM, and the signal arm means nothing. A second null runs the pipeline on a bound with a
    single term, which must return exactly one cell; failure there is a pipeline bug rather than a
    finding.'
  independent_variables:
  - 'bound family arm: hand-derived toy, random-exponent null, single-term degenerate'
  - 'grid resolution: 129, 257, 513 points per axis'
  - 'mutation type: exponent by one unit, constant by a factor of two, none'
  - null seed index, 1 through 100
  metrics:
    primary:
    - cell count per arm and per resolution
    - boundary normal vectors recovered, as integer exponent-difference vectors
    - per-axis monotonicity flag for every label region
    - topology-change rate under exponent mutation
    - topology-change rate under constant mutation
    secondary:
    - fraction of grid points whose interval argmax is ambiguous
    - mean and maximum interval width in log-space
    - wall-clock and peak memory per arm
    - agreement or disagreement between the extractor and the hand-derived partition, cell by cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The separation between the cell-count distribution of the random-exponent null arm and
      the cell count of the structured toy arm, and the separation between exponent-mutation and constant-mutation
      topology-change rates.
    formula: 'Predicted before the run: toy-arm cell count at most 6, defined as the number of maximal
      connected grid regions carrying a constant argmax label at the frozen resolution; null-arm median
      cell count at least 12 over the same grid; exponent-mutation topology-change rate at least 0.5
      and constant-mutation topology-change rate at most 0.1, where the topology-change indicator
      is 1 if cell count changes or any boundary normal vector changes and 0 otherwise; non-monotone
      axis count exactly 0 for every purely monomial bound in every arm.'
    source: Pre-registered in the parent proposal IDEA-20260816-d270bc before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are 4-term, 3-variable synthetic bounds on a 129-point-per-axis
      grid. This is deliberately not FrodoKEM: no primary source is filed, so the real bound cannot
      be transcribed and RQ-FRODO-a2dbe2 constraint 1 forbids designing against it. TRANSFER ASSUMPTION,
      stated and not assumed benign: results transfer to a real five-variable bound with more terms
      only insofar as the argmax projection is term-count-agnostic, which the null arm''s dependence
      on term count directly tests, and only insofar as the real bound is a sum of monomials, which
      it may well not be. A discriminative result here does NOT establish that the real partition
      will be small or informative; it establishes only that the instrument can tell structured from
      random bounds of this size.'
    correspondence: null
  tail_checks:
  - 'Tie fraction: report the number of grid points where the interval argmax is ambiguous, and confirm
    it is below a frozen threshold before any cell count is reported.'
  - 'Extreme-corner behaviour: verify that at each of the eight grid corners the dominant term is
    the one predicted analytically from the extreme exponents.'
  - 'Thin-cell check: report the smallest cell by grid-point count and confirm it survives one grid
    refinement, since a cell of one or two points is the classic sampling artifact.'
  - 'Null-arm tail: report the 5th and 95th percentile of the null cell-count distribution, not only
    the median, since the prediction is a separation claim.'
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report if stage 1 baseline reproduction fails; no downstream arm is run or reported.
  - Halt if the tie fraction exceeds the frozen threshold at the base resolution, and report the tie
    fraction as the result.
  - Cap total wall clock at two CPU-hours across all arms; a cap hit is an infrastructure outcome
    and is never reported as negative mathematical evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The extractor exactly reproduces the hand-derived toy partition including tie
    regions, cell counts and boundary normals are stable under grid refinement, and the null arm's
    cell-count distribution is separated from the toy arm's at the pre-registered margin with the
    exponent-versus-constant mutation-rate separation also observed.
  falsification_criterion:
  - The extractor does not reproduce the hand-derived toy partition.
  - Null-arm median cell count falls inside the toy arm's grid-refinement uncertainty, so the projection
    is not discriminative at this size.
  - Cell count or a boundary normal changes under grid refinement, so the partition is a sampling
    artifact.
  - Exponent-mutation and constant-mutation topology-change rates are not separated at the pre-registered
    margin.
  - A non-monotone label region is found for a verified-monomial bound, refuting the structural claim.
  - The tie fraction exceeds the frozen threshold, so the argmax object is not well defined on this
    grid.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-d270bc
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The frozen grid ranges and the tie-fraction threshold are not yet chosen; a Coordinator must fix
    both before approval, and they cannot be tuned after seeing an arm.
  - The definition of a boundary normal for a partition sampled on a discrete grid needs a precise
    finite-difference statement, since exponent-difference vectors are exact but the grid recovery
    of them is not.
  - Whether the later, source-dependent stage is even reachable depends on RQ-FRODO-a2dbe2 constraint
    1 being discharged by an acquisition batch; this contract deliberately does not depend on it,
    and a Coordinator must decide whether to sequence them.
