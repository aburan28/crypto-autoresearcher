# EXP-GFPN-76a1cd
# Exhaustive three-point side table at n=3 for two toy models.
# Frozen before any run. Counts below are a prediction, not a result.
experiment:
  id: EXP-GFPN-76a1cd
  hypothesis_id: H-GFPN-ce885c
  source_idea: IDEA-20261004-31991f
  question_id: RQ-GFPN-c01af8
  goal_id: GOAL-GFPN-380702
  version: 1
  title: >-
    Side types of three-point sums over F_{q^3} at q=5, 7, 11
  status: approved
  frozen: true
  designed_at: '2026-10-05'
  approved_by: coordinator
  approval_decision_id: DEC-20261005-031527
  objective: >-
    Enumerate every nondecreasing factor-base triple and every
    relative sign pattern, and classify sums that land in E(K)
    or in the kernel of Frobenius-plus-one.
  inputs:
    primes: [5, 7, 11]
    n: 3
    m: 3
    modulus_low_to_high:
      5: [2, 1, 0, 0, 0, 0, 1]
      7: [2, 0, 0, 0, 0, 0, 1]
      11: [2, 1, 0, 0, 0, 0, 1]
    theta_trace_exponent: [1, 2, 4, 3, 5]
    theta_low_to_high:
      5: [0, 2, 3, 4, 2, 1]
      7: [0, 0, 2]
      11: [0, 6, 10, 4, 6]
    torsion_model: "y^2 = x^3 + x"
    rootfree_c0_c1_c2:
      5: [1, 1, 0]
      7: [6, 1, 0]
      11: [0, 1, 0]
    predicted_roots:
      torsion: {5: [0, 2, 3], 7: [0], 11: [0]}
      rootfree: {5: [], 7: [], 11: []}
    predicted_side0:
      torsion: {5: [], 7: [1, 3, 5], 11: [5, 7, 8, 9, 10]}
      rootfree: {5: [1, 4], 7: [0, 5], 11: [1, 3, 4, 6, 9]}
    predicted_side1:
      torsion: {5: [1, 4], 7: [2, 4, 6], 11: [1, 2, 3, 4, 6]}
      rootfree: {5: [0, 2, 3], 7: [1, 2, 3, 4, 6], 11: [0, 2, 5, 7, 8, 10]}
    predicted_type_a:
      torsion: {5: 0, 7: 40, 11: 140}
      rootfree: {5: 16, 7: 16, 11: 140}
    predicted_type_b:
      torsion: {5: 0, 7: 21, 11: 59}
      rootfree: {5: 13, 7: 22, 11: 61}
    predicted_type_c:
      torsion: {5: 0, 7: 15, 11: 39}
      rootfree: {5: 0, 7: 0, 11: 0}
    predicted_side1_sums:
      torsion: {5: 16, 7: 64, 11: 202}
      rootfree: {5: 51, 7: 158, 11: 283}
    predicted_lemma_violations:
      torsion: {5: 0, 7: 0, 11: 0}
      rootfree: {5: 0, 7: 0, 11: 0}
  controls:
    - >-
      Root-free control. f has no root in K, so type (c) is 0.
      The q=5 torsion model is not this control: its side-0 set
      is empty, and its type (c) count of 0 does not show the
      effect of torsion.
    - >-
      Torsion control at q=7 and q=11. y^2 = x^3 + x has the
      rational point (0, 0), and the type (c) counts are 15
      and 39.
    - >-
      Two norm formulas, computed independently. The product
      a * a^q * a^{q^2}, and the power a^{1+q+q^2}. They must
      not import each other's side sets.
    - >-
      Two addition orders. The same three points are summed
      left to right and right to left. A mismatch invalidates
      the cell.
  independent_variables:
    - prime in {5, 7, 11}
    - model in {torsion, rootfree}
  metrics:
    primary:
      - side0
      - side1
      - type_a
      - type_b
      - type_c
      - side1_sums
      - lemma_violations
      - routes_agree
    secondary:
      - rational_sums
      - roots
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: >-
      The side sets and the type counts under inputs. Lemma
      violations are 0. Type (c) is 0, 15, 39 on the torsion
      model and 0, 0, 0 on the root-free model.
    formula: >-
      A cell is one prime and one model. Triples are
      combinations with replacement from the factor base.
      Sign patterns are (+, + or -, + or -). Type (a) is a
      K-rational sum of three side-0 points. Type (b) is a
      K-rational mixed sum whose side-1 subsum is the identity.
      Type (c) is a K-rational mixed sum whose side-1 subsum
      is a nonzero K-rational 2-torsion point. A side-1 sum
      is a kernel point outside E(K).
    source: >-
      IDEA-20261004-31991f lemma (L) and root types (a), (b),
      (c), specialized to these six cells. The counts were
      computed in the design session and are not a run.
  scale_relevance:
    tier: toy
    justification: >-
      Three primes, n=3, and m=3. No transfer to EcGFp5 or
      EcMasFp5, and no claim about a summation-polynomial solver.
    correspondence: null
  tail_checks:
    - >-
      The q=5 torsion cell must be reported, including its empty
      side-0 set. Dropping it invalidates the batch.
    - >-
      Side lists are sorted increasingly. A different order with
      the same set is accepted only after sorting.
    - >-
      |side0| + |side1| + |roots| equals q on every cell.
  replication:
    seeds: []
    independent_instances: 1
    replication_note: >-
      Deterministic. One manifest per prime and model. Both
      norm formulas and both addition orders are inside that
      manifest.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 6
    maximum_workers: 1
  stopping_rules:
    - Stop after six valid manifests.
    - Do not add a prime, a degree, or a third model.
    - Do not continue a cell after the routes disagree.
  invalidation_rules:
    - The two norm formulas disagree.
    - The two addition orders disagree.
    - A factor-base abscissa outside F_q is used.
    - A root of f is placed in a side set.
    - A timeout, crash, or missing manifest.
  success_criterion: >-
    All six manifests are valid, the routes agree, the side sets
    match, lemma violations are 0, type (a) counts are 0, 40, 140
    and 16, 16, 140, type (b) counts are 0, 21, 59 and 13, 22, 61,
    type (c) counts are 0, 15, 39 and 0, 0, 0, and side-1 sum
    counts are 16, 64, 202 and 51, 158, 283, torsion model first.
  falsification_criterion: >-
    The routes agree and any side set or any of those counts
    differs from the table, or a lemma violation is nonzero.
    A route disagreement does not meet this criterion.
  required_artifacts:
    - experiments/EXP-GFPN-76a1cd/runs/<run-id>/command.txt
    - experiments/EXP-GFPN-76a1cd/runs/<run-id>/stdout.txt
    - experiments/EXP-GFPN-76a1cd/runs/<run-id>/stderr.txt
    - experiments/EXP-GFPN-76a1cd/runs/<run-id>/result.json
    - experiments/EXP-GFPN-76a1cd/runs/<run-id>/sums.json
  assigned_to: executor
  out_of_scope:
    - A summation-polynomial solver, including msolve.
    - Any prime outside {5, 7, 11}.
    - Any n other than 3 or any m other than 3.
    - EcGFp5 or EcMasFp5 at their deployed prime.
    - Editing an existing GFPN hypothesis or experiment.
