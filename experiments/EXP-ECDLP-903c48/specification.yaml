# EXP-ECDLP-903c48 — stage-0 instrument for H-ECDLP-753879.
# Frozen under DEC-20261012-e7075a. No run, outcome, or conclusion is in this file.
experiment:
  id: EXP-ECDLP-903c48
  hypothesis_id: H-ECDLP-753879
  source_idea: IDEA-20261009-8d09c0
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  version: 1
  title: >-
    Stage-0 instrument: rank-1 net zeros for (1, 5) on y^2 = x^3 + 2 over F_11
  status: approved
  frozen: true
  designed_at: '2026-10-12'
  approved_by: DEC-20261012-e7075a
  execution_authorized: true
  objective: >-
    Run one preregistered deterministic cell that computes the group-law order
    of P = (1, 5) and the division-polynomial net through n = 24. Record the
    order, the first positive zero, and whether the zeros are exactly the
    multiples of the order. Do not estimate mutual information.
  inputs:
    p: 11
    a: 0
    b: 2
    point: [1, 5]
    window_end: 24
    curve: "y^2 = x^3 + 2"
    runner: experiments/EXP-ECDLP-903c48/implementation/run.py
  controls:
    - >-
      Group-law order by repeated chord-and-tangent addition, separate from
      the net recurrence.
    - >-
      Non-multiples in n = 1..24 must be nonzero. n = 6 is inside that check.
      No random lattice is sampled.
  independent_variables:
    - none; the cell is a single preregistered point, not a sweep
  metrics:
    primary:
      - on_curve
      - group_law_order
      - first_positive_zero
      - zeros_match_order_multiples
      - zeros
    secondary:
      - w1
      - w2
      - w3
      - w4
      - w6
      - w12
      - elapsed_seconds
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      On this cell the point is on the curve, the group-law order is 12, the
      first positive net zero is 12, and the zeros in 1..24 are exactly 12 and 24.
    formula: >-
      Curve check: 5^2 = 1^3 + 2 in F_11. Initial net: W(0) = 0, W(1) = 1,
      W(2) = 2*5 = 10, W(3) = 3*1^4 + 2 = 5, W(4) = 4. Doubling recurrences
      then give W(12) = 0, W(24) = 0, and W(n) != 0 for every other n in 1..24.
    source: >-
      The formulas were evaluated in F_11 by a design-time script before any
      run of this contract. They are not a Dickman law and not a mutual-information estimate.
  scale_relevance:
    tier: toy
    justification: >-
      One prime, p = 11, one point, rank 1, window 24. No transfer to
      cryptographic p, and no rank r >= 2 net.
    correspondence: null
  tail_checks: []
  replication:
    seeds: []
    independent_instances: 1
    seed_policy: >-
      Deterministic cell. No seed is drawn. The parent idea's seed base is
      not consumed.
  budget:
    enforcement: advisory
    maximum_memory_gb: 1
    maximum_runs: 1
    wall_clock_seconds_per_run: 60
  stopping_rules:
    - Stop after the single preregistered cell. Do not open another prime or another point in this version.
  invalidation_rules:
    - >-
      A crash, timeout, or exception invalidates the instrument run. It is not
      evidence about sieve independence.
    - >-
      Changing p, the curve, the point, or the window after this freeze
      requires an amendment. It is not a rerun of version 1.
  success_criterion: >-
    The run records on_curve true, group_law_order 12, first_positive_zero 12,
    zeros_match_order_multiples true, and zeros equal to [12, 24], at p = 11
    and window_end 24.
  falsification_criterion: >-
    The run records a complete cell in which on_curve is false, or
    group_law_order is not 12, or first_positive_zero is not 12, or
    zeros_match_order_multiples is false, or zeros is not [12, 24]. That
    result invalidates the instrument cell and does not decide the
    mutual-information claim.
  decision_impact:
    on_positive: >-
      The instrument cell passed. A later amendment may add a rank r >= 2 net
      and a mutual-information table. This pass does not show that small-prime
      net values leak Lambda_p, and it does not close IDEA-20261009-8d09c0.
    on_negative: >-
      The instrument cell failed. Do not schedule the sieve null test from
      this runner. Repair the instrument by amendment. Do not read the failure
      as evidence that net membership is independent of Lambda_p.
  required_artifacts:
    - experiments/EXP-ECDLP-903c48/runs/RUN-ECDLP-4616a2/manifest.yaml
    - experiments/EXP-ECDLP-903c48/runs/RUN-ECDLP-4616a2/raw-result.json
    - experiments/EXP-ECDLP-903c48/runs/RUN-ECDLP-4616a2/RESULTS.md
  assigned_to: executor
  scope_note: >-
    Version 1 is the rank-1 stage-0 instrument only. Smoothness, Dickman yield,
    and mutual information remain proposed and are not predecessors that this
    run waits on. No external computer-algebra system is on the path.
