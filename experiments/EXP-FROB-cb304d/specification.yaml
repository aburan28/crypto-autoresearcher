# EXP-FROB-cb304d
# Negation-fibre arithmetic. No surface.
# Approved by DEC-20261002-dced20.
experiment:
  id: EXP-FROB-cb304d
  hypothesis_id: H-FROB-06331d
  source_idea: IDEA-20261002-bedc95
  question_id: RQ-FROB-7d8dd4
  version: 1
  title: Negation-fibre arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-dced20
  objective: >-
    Check that all 19 residues have a moved negation pair, and that
    the witness sets are {0, 2} and {2, 17}.
  inputs:
    modulus: 19
    inverse_witness: 10
    product: 20
    remainder: 1
    fixed_residue: 0
    pair_count: 9
    witness: 1
    translated_a: 0
    translated_b: 2
    negated_a: 2
    negated_b: 17
    mismatch_count: 19
    odd_remainder: 1
  controls:
    - >-
      Two times 10 leaves remainder 1 modulo 19. Reporting 2 congruent
      to 0 modulo 19 invalidates the run.
    - >-
      The witness sets {0, 2} and {2, 17} differ. The mismatch count
      over all 19 residues is 19. Reporting a match count of 19
      invalidates the run.
    - >-
      The only residue fixed by negation is 0. Nineteen minus 1
      divided by 2 is 9.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - route in {enumerate_residues, invert_two}
  metrics:
    primary:
      - mismatch_count
      - witness_sets_differ
      - implementations_agree
    secondary:
      - pair_count
      - remainder
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The mismatch count is 19, and the witness sets are {0, 2} and
      {2, 17}.
    formula: >-
      For each residue x, compare the set of x plus 1 and minus x plus
      1 with the set of x plus 1 and minus (x plus 1). Separately
      multiply 2 by 10 and reduce modulo 19.
    source: >-
      IDEA-20261002-bedc95 states the involution on Z/19Z and the
      branching 2, read 2026-10-02. The 19 residues were compared in
      this design session. That comparison is not a run. No surface
      was built.
  scale_relevance:
    tier: toy
    justification: Nineteen residues. No transfer to a surface.
    correspondence: null
  tail_checks:
    - The full count 19 is required. A check that stops at the witness is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the mismatch count 19 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The mismatch count is not 19.
    - The witness sets are reported equal.
    - A match count of 19 is reported.
    - 2 is reported congruent to 0 modulo 19.
    - A surface is built or an ideal is computed.
  success_criterion: >-
    Both runs agree that the mismatch count is 19, that the witness
    sets {0, 2} and {2, 17} differ, that the only fixed residue is 0,
    and that 2 times 10 leaves remainder 1 modulo 19.
  falsification_criterion: >-
    The runs agree that there are 19 residues, and the mismatch count
    is not 19.
  required_artifacts:
    - experiments/EXP-FROB-cb304d/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-FROB-cb304d/runs/<RUN-ID>/command.txt
    - experiments/EXP-FROB-cb304d/runs/<RUN-ID>/stdout.log
    - experiments/EXP-FROB-cb304d/runs/<RUN-ID>/stderr.log
    - experiments/EXP-FROB-cb304d/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-FROB-cb304d/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any abelian surface, Kummer ideal, or generator degree.
    - Any claim that branching 2 changes the rho exponent.
    - Any measured first-fall degree.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
