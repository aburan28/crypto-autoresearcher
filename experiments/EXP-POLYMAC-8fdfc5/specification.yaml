experiment:
  id: EXP-POLYMAC-8fdfc5
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-4ea533; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-4ea533
  question_id: RQ-POLYMAC-7c89e4
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Eight-width field-size ladder of the measured-to-bound forgery ratio in both fields at fixed
    length and query count, with an analytically predicted random-function null and an exact resolution
    floor derived from count discreteness
  objective: The uncertainty reduced is whether this campaign's central instrument - a scaled-down
    analogue measured by exhaustion - produces a quantity that is stable under change of scale, and
    how finely that instrument can resolve anything at all. (i) Compute the exact ratio at eight bit
    widths in both fields at a fixed (L, q) slice, plus a second slice, so that the width-dependence
    is a measured curve rather than an assumption. (ii) Derive the resolution floor at each width
    arithmetically from the integer discreteness of root-set counts, and verify by checking every
    observed ratio lies on the predicted lattice, so that every effect reported anywhere in this bucket
    has a floor to be compared against. (iii) Run the random-function null across the identical ladder
    and require it to reproduce its analytically known width-dependence within one resolution unit,
    since only that establishes the ladder can detect a drift and therefore that a flat signal ladder
    is informative rather than blind. The run does not reduce uncertainty about tightness, about deployed
    parameters, or about either construction's security.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: over bit widths 6 to 20, for the
      declared analogues, the pinned bound and the fixed (L, q) slices, the measured-to-bound ratio
      behaves as the ladder shows, with the stated total drift measured in units of the largest width''s
      resolution floor, and the harness resolves ratio differences no finer than the tabulated floor.
      WHAT DOES NOT FOLLOW: nothing about widths above 20, and in particular nothing about the deployed
      field sizes; no licence to extrapolate a flat ladder beyond its tested range; no statement about
      tightness at any parameters; and no attack or security consequence of any kind.'
  inputs:
    procedure: 'STAGE 0 (cost: a day, human): derive the null arm''s analytic width-dependence, freeze
      the ladder, the two slices, the three fit models and the prime selection rule; record the bound
      as a derivation gap. STAGE 1 (cost: seconds to minutes for widths 6 to 14): run the shared exhaustive
      enumeration at each width in both fields. STAGE 2 (cost: minutes to an hour for widths 16 to
      20): the same at the top of the ladder, which dominates the budget. STAGE 3 (cost: seconds):
      instantiate the bound, form ratios, compute lattice spacings, and check lattice membership.
      STAGE 4 (cost: as stages 1-2): run the null across the identical ladder and compare against
      its analytic prediction. STAGE 5 (cost: seconds): fit the three models, refusing selection when
      the floors cannot distinguish them. STAGE 6 (cost: minutes): run 100 synthetic one-unit-per-width
      drift injections through the fitting stage. STAGE 7 (cost: seconds): emit the floor table for
      citation by every other contract in this bucket, plus the manifest.'
    instrument: Python 3 standard library, sharing the achievable-difference enumeration module with
      the other contracts in this batch so the ladder measures the same instrument they use. Exact
      rational arithmetic via fractions.Fraction for the ratio and its lattice, so the floor is computed
      without floating point. Model fitting by exhaustive comparison of the three declared forms against
      the data with the floor as the tolerance - no optimiser, no external statistics package. Manifest
      and inference block via harness/runner.py. No Sage, no network.
    parameters: 'Bit widths n in {6, 8, 10, 12, 14, 16, 18, 20}, both fields, five primes per width
      for the prime arm. Slices: (L = 4, q = 1) primary and (L = 8, q = 2) secondary. Fit models:
      ratio constant in n, ratio linear in n, ratio linear in 2^-n. Null arm: 32 random keyed functions
      per width. Synthetic drift injections: 100 draws at one resolution unit per width. Achievable-difference
      family capped at 2^18 per (field, width, slice), with cap-hit counts recorded.'
  controls:
  - Random-function null on the identical ladder with a known analytic width-dependence.
  - Synthetic drift injection of one resolution unit per width, 100 draws, to establish the fitting
    stage's sensitivity.
  - 'Lattice-membership check: every observed ratio must lie exactly on the predicted discreteness
    lattice.'
  - Second (L, q) point repeated across the whole ladder to confirm the width-dependence is not an
    accident of the chosen slice.
  - Both fields run through one code path with the field as a parameter.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The random-function null runs on the identical ladder in the same invocation
    and is the load-bearing control here, because its width-dependence is known analytically: its
    optimal forgery probability is the generic one and its ratio to the bound therefore varies with
    width in a computable way. The null must reproduce that computed drift to within the resolution
    floor at every width. If it does, the ladder is proven capable of detecting a drift of that size,
    and a flat signal ladder is then informative. If it does not, the ladder is blind and the entire
    campaign''s extrapolation premise remains untested regardless of what the signal arms show. A
    second control injects a synthetic drift of exactly one resolution unit per width into a copy
    of the signal data and confirms the fitting stage flags it, establishing the smallest drift the
    analysis can name.'
  independent_variables:
  - field type (binary extension, prime, random-function null)
  - bit width n
  - slice (L, q)
  - choice of prime within a width
  metrics:
    primary:
    - exact ratio per (field, width, slice)
    - resolution floor per (field, width)
    - total drift across the ladder in floor units
    - null-arm ratio minus its analytic prediction, per width
    - selected model or an explicit non-identifiability verdict
    secondary:
    - lattice-membership pass rate
    - synthetic-drift detection rate
    - cap-hit counts per width
    - prime-sweep spread of the ratio per width
    - wall clock per width
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The total drift D = R(n = 20) - R(n = 6) in each field, expressed in units of the resolution
      floor at n = 20, and the null arm's deviation from its analytic width-dependence at every width.
    formula: 'The resolution floor at width n is the spacing of the achievable ratio lattice, equal
      to 1 / (|key space| * B(L, q, n)) since the numerator of R is an integer count divided by the
      key-space size. Predicted: every observed R lies exactly on that lattice; the null arm''s R
      matches its analytic form within one floor unit at every width; the ladder is declared flat
      only if |D| is below one floor unit at n = 20.'
    source: Pre-registered in the parent proposal IDEA-20260816-4ea533 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The ladder is the scale statement. Tested widths are 6 to 20, chosen as the full
      range over which exhaustive enumeration is affordable, and the contract''s entire purpose is
      to measure what happens to the central quantity across that range rather than to assume it.
      The extrapolation assumption is explicitly the object under test and is never used: no result
      from this ladder is projected beyond width 20, and a flat ladder is reported as flat over 6
      to 20 and nothing more.'
    correspondence: null
  tail_checks:
  - width 6, where the resolution floor is coarsest and the ratio may take only a few values, must
    be reported with its floor and excluded from any drift fit that the floor cannot support
  - width 20, which carries most of the weight, must complete or the ladder is reported as truncated
    at the largest completed width
  - the second slice must be run at both ends of the ladder even if dropped in the middle, so that
    slice-dependence is bounded
  - widths where the achievable-difference family hits its cap must be flagged, since a cap hit at
    large width mimics a drift
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - halt if any observed ratio lies off the predicted lattice
  - halt interpretation if the null arm deviates from its analytic prediction by more than one floor
    unit at any width
  - cap total wall clock at 7200 seconds; on exceeding, drop widths from the top and report the ladder
    as truncated, never from the middle
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The ladder completes at all eight widths in both fields, every observed ratio
    lies on the predicted lattice, the null reproduces its analytic width-dependence within one floor
    unit at every width, and the total drift is reported in floor units with an explicit flat-or-drifting
    verdict.
  falsification_criterion:
  - null deviates from its analytic prediction beyond one floor unit
  - any off-lattice ratio
  - synthetic drift detection below 95 percent
  - the three models are indistinguishable given the floors and no verdict can be issued
  - the ladder truncates below width 16, leaving the informative end unmeasured
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-4ea533
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The bound formula is the shared derivation gap for this batch and must be pinned from primary
    text; without it there is no ratio and no ladder.
  - The null arm's analytic width-dependence must be derived and checked by the Coordinator before
    the run, since the entire control rests on it being right.
  - The Coordinator must rule on whether fixed L across widths or fixed L-to-field-size ratio is the
    correct scaling variable; the contract runs the former and flags the ambiguity as unresolved.
  - Whether the floor table produced here becomes a mandatory citation for the other contracts in
    this bucket is a Coordinator decision about batch structure, not something this record can impose.
