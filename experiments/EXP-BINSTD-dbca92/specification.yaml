    command_stage0: >-
      python3 experiments/EXP-BINSTD-dbca92/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-dbca92/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-dbca92/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-dbca92/trial-plan-v1.json
