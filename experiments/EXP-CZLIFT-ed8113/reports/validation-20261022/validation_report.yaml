    - control: edge-of-bound probe (validator-added; the frozen control exercises only max|m| = 2, r = 2)
      result: pass
      detail: >-
        Both the producer's dependent() and the blind search find (5, -6) for (6Q, 5Q) at p = 101 and
        p = 12809, and (6, -5, -1) for (P1, P2, 6P1 - 5P2) at p = 101. Both find nothing for (7Q, 6Q),
        whose primitive relation (6, -7) lies outside the bound. There is no off-by-one at the bound.

  blind_rederivation:
    quantity: >-
      Relation search written from the statement, on the planted control P~_2 = [2] P~_1 for curves at
      every frozen prime, and on the two generators of 389a1.
    blind_implementation: >-
      blind/relsearch.py: general-Weierstrass exact rational arithmetic (Silverman III.2.3) and an exact
      meet-in-the-middle search over [-6, 6]^r, cross-checked by brute force. blind/run_blind.py:
      symmetric lifts, r = 2 short fit and r = 3 fit with an X^2 term, three planted-control
      constructions, PTM objects, and an independent sampler. Interpretation choices are recorded in
      blind/interpretation.json.
    blind_results_sealed:
      planted_controls: >-
        40/40 detected (all 8 primes; constructions A x3, B x1, C x1 per prime); brute force agrees.
        One control (C, p = 101) also showed an independent 2-torsion relation (0, 0, 2) because its
        third point lifted to (-39, 0); the planted relation was still detected.
      ptm_389a1: >-
        No relation within bound 6 or 12 in [0,1,1,-2,0], the integral model [0,4,0,-32,16] and the
        short model [0,0,0,-3024,46224]. The unplanted positive (P1, P2, (1,0)) gives (1, 1, -1).
      instrument_positive_11a1: (5,5) on 11a1 gives the relation (5); brute force agrees.
      blind_sampler: >-
        Seed 0x67902E+1, uniform over ALL affine points (y = 0 admitted): 8/1600 dependent (0.005),
        every one a 2-torsion relation from a y = 0 lift, at p in {101, 211}; 0/1592 among trials with
        no y = 0 point. Analytic expectation with y = 0 admitted: sum_p 100*(2+3)/p = 9.77 dependent
        trials per seed.
    comparison_with_producer:
      controls_and_ptm: >-
        Agree. The producer recorded 48/48 controls and the blind re-derivation detected 48/48. On the
        producer's instrument PTM-1 returns no relation, as the blind search does.
      same_inputs_replay: >-
        j3_replay.py regenerated the producer's sampled inputs by calling only the frozen sampler
        (harness.czlift.random_point, harness.toycurve.EllipticCurve) in build()'s RNG order. All fitting
        and searching used the sealed blind code. Per-cell mean heights agree to <= 1.8e-14, which
        shows the inputs are identical. 3200/3200 trial outcomes agree (valid 1600/1600 and dependent
        1/0 per seed), the relation sets agree, and 48/48 controls agree element-wise.
      divergence_explained: >-
        My sealed blind dependence rate (0.005) differs from the producer's (0.000625 and 0.0) only
        because the samplers differ, not because of arithmetic. harness/czlift.py random_point (line
        353) rejects y = 0, so 2-torsion points are never drawn: replayed inputs contain 0 points with
        y = 0. Restricted to y != 0, the blind sample gives 0/1592, against the producer's 1/1600 and
        0/1600. See finding F1.
    verdict: holds

  accidental_relation_probe:
    trial: 'seed 20261009, p = 101, r = 2, trial index 61 (0-based within the cell)'
    inputs: '(a, b) = (90, 49) mod 101; points (77, 86), (48, 86); lifts (-24, -15), (48, -15)'
    fitted_curve: 'y^2 = x^3 - 1728 x - 27423, discriminant 5352901200 (nonzero)'
    relation: >-
      2 P~_1 + P~_2 = O, recorded as [-2, -1], canonical (2, 1). Within bound 12 there are only its
      multiples. Mechanism: x^3 - 1728x - 27648 = (x + 24)^2 (x - 48), so the line y = -15 is tangent
      at P~_1 and meets the curve again at P~_2. P~_1 has no torsion order <= 12 (Mazur), so it has
      infinite order. The relation is genuine, within bound and correctly recorded, not an instrument
      artifact.
    expectation: >-
      For the r = 2 short fit, 2 P~_1 +- P~_2 = O iff (x1 - x2)^2 (2 x1 + x2) = (y1 -+ y2)^2 (derived;
      confirmed by the blind search on 300 sampled pairs per prime). The exact per-trial probability of
      this family under the producer's sampler is 9.86e-4 at p = 101 and 2.46e-4 at p = 211, roughly
      1/p^2. P(at least one in the 200 r = 2 trials at p = 101 over both seeds) = 0.179. One hit, at the
      smallest prime only, is consistent with this rate and decays the way a coincidence rate should.

  proves_too_much:
    - id: PTM-1
      object: generators of 389a1 (rank 2, independent in E(Q))
      instrument: producer run.py dependent() with q_add/q_mul, bound 6 (and 12)
      models: >-
        Integral [0,4,0,-32,16] with (-4,12), (0,4), discriminant 1593344 = 389*2^12; short
        [0,0,0,-3024,46224] with (-24,324), (12,108), discriminant 846768328704 = 389*2^12*3^12. Both
        are isomorphic to 389a1. The instrument supports a1 = a3 = 0 only.
      result: >-
        The instrument returns None (no relation) at bound 6 and at bound 12 in both models, which is
        the expected failure signature. On the same curves it finds (-2, 1) for (P1, [2]P1) and
        (-1, -1, 1) for (P1, P2, P1+P2), so the null does not come from the instrument failing on these
        models. Its q_add and q_mul agree with the blind arithmetic.
      verdict: holds

  findings_for_review_evidence:
    - id: F1
      severity: scope (not a J1/J2 break; interpretation and scope joints are unowned in this round per PD-1)
      text: >-
        The sampler excludes points with y = 0 (harness/czlift.py random_point, line 353). Neither the
        specification nor the hypothesis states this; it is fixed only through the hash-pinned harness.
        Under the literal reading "random points of E(F_p)", 2-torsion points are drawn with probability
        about r/p and their lifts are 2-torsion over Q (relation (...,2,...)). That predicts about 9.77
        dependent trials per seed, a rate of about 0.0061: above the 0.002 success threshold and below
        the 0.01 falsification threshold. The blind sample gave 8/1600 = 0.005. The recorded success
        condition therefore depends on this sampler definition. Whether excluding 2-torsion points is
        the right reading of "dependence an xedni attack could use" is an interpretation question for
        the review-evidence round.
    - id: F2
      severity: definition
      text: >-
        height_ratio_point_over_log_p covers r = 2 points only; the largest difference from a pooled
        definition is 0.0159. See secondary_metrics.
    - id: F3
      severity: control strength
      text: >-
        The singular-fit exclusion control is vacuous by construction, and the planted control
        exercises only max|m| = 2 with r = 2. My edge-of-bound probe covers |m| = 6 and r = 3 and found
        no defect.
    - id: F4
      severity: reporting
      text: >-
        The preregistered point prediction (0/1600 per seed) is not met on seed 20261009 (1/1600). The
        frozen success criterion (rate <= 0.002) is met on both seeds. The hypothesis statement's
        "upper 95 percent bound below 0.002" holds for seed 20261010 (0.00187) and pooled (0.00148),
        but not for seed 20261009 alone (0.00296).
    - id: F5
      severity: checker independence
      text: >-
        check.py reuses run.py, so it confirms reproducibility, not correctness. Independence comes
        from this report's j2_recompute.py and the sealed blind search in j3_replay.py.

  heuristic_validation_checks:
    - check: pre-registered prediction
      result: pass
      detail: >-
        The preregistered_prediction (0 of 1600 per seed; control rate 1.0) was committed in the frozen
        specification at 172ec3c94f (21:19:47Z), before run 1 started at 21:20:47Z. heuristic_under_test
        is null.
    - check: sample integrity
      result: pass_with_finding
      detail: >-
        The manifest carries seed, trials_per_cell, pmax and relation_bound. The sampling procedure is
        fixed only by hash-pinned code, and its y != 0 restriction is undeclared in the text (F1). Every
        count and rate is recomputed from raw rows and replayed per trial.
    - check: correspondence validity
      result: not_applicable
      detail: No substitute sampling correspondence is used.
    - check: scale binding
      result: pass
      detail: >-
        Toy tier: p <= 12809, relation bound 6, r <= 3, symmetric lifts only, as recorded in the
        specification's scale_relevance and out_of_scope. The run records make no transfer claim.
    - check: null-object control (docs/inventor-protocol.md section 3)
      result: not_applicable_with_note
      detail: >-
        No correlation, bias or excess is claimed; the measured quantity is a near-zero count. The run
        records carry no null-model expectation for accidental relations. I supplied one: the exact
        probability of the observed family decays roughly as 1/p^2 (9.86e-4 to 2.46e-4 from p = 101 to
        p = 211), and the single hit sits at the smallest prime.
    - check: scaled-down ladder (docs/inventor-protocol.md section 6)
      result: not_applicable
      detail: No speedup or improvement is claimed.

  cost_model_checks:
    - check: concrete cost table
      result: not_applicable
      detail: >-
        The run packages contain no cost table or cost claim. Resource records hold wall time only.

  proof_architecture_checks:
    - check: proof-oriented task
      result: not_applicable
      detail: This is a counting measurement, not a proof-architecture task.

  verdict: passed
  verdict_meaning: >-
    The two run packages RUN-CZLIFT-c3f8a8 and RUN-CZLIFT-218843 are admissible evidence: custody is
    complete and bound, every frozen metric and control recomputes exactly, and the instrument passes
    the proves-too-much control and an independent blind search on identical inputs. This verdict does
    not support or weaken H-CZLIFT-cb95b8, changes no status, and authorizes no promotion. Findings F1-F5
    are forwarded to the review-evidence round.

  limitations:
    - >-
      Interpretation and scope joints, including F1 (what the y != 0 sampler means for H2), are not owned
      here (PD-1; no red team this round).
    - >-
      Producer inputs were regenerated by executing the frozen sampler (harness.czlift.random_point,
      harness.toycurve.EllipticCurve). The sampler was not independently reimplemented. toycurve.py was
      hash-verified and executed but not read. Heights agreeing to <= 1.8e-14 across all 32 cells shows
      the regenerated inputs are identical.
    - >-
      The full producer run was not re-executed (task budget maximum_runs 0; shared 4-core host). I
      sampled: check.py re-execution covers p = 101 per seed (about 14 s each), and my independent
      replay covers all 3200 trials and 48 controls with the blind search (about 26 s). The
      accidental-family probability was computed exactly for p in {101, 211} only; p = 401 was stopped
      for compute and is not reported.
    - >-
      The resource record lacks peak memory; only wall time (driver bracket) is recorded.
    - >-
      dirty false is the driver's write-time self-report. The operative check, source hashes at the
      recorded commit, was verified directly.
    - >-
      Both archive receipts carry commit_sha null, with the binding in the dispatch_queue.json archive
      block, which is outside my read_scope and was not read. The commit binding was established
      independently from git history (cec6b5425e, 07c65591b0).
    - >-
      This plan assigns the blind re-derivation and J1/J2 to one task with no phase addendum, so
      tools/check_review_independence.py will mechanically report an intersection of sources_read with
      blind_from. Blindness was enforced by order: a hash seal at 08:11:07Z before any blind_from path
      was opened. The tool cannot verify that ordering.
    - >-
      PTM-1 used a1 = a3 = 0 models isomorphic to 389a1 (discriminants 389*2^12 and 389*2^12*3^12),
      because the producer's instrument does not support a1 or a3. The blind search also ran the
      original [0,1,1,-2,0] model.
    - >-
      The blind sampler is one seed of 1600 trials; the y = 0 count is backed by an analytic
      expectation.

  compute_used: >-
    Single core throughout. Reported computations took about 2 minutes CPU: blind phase 28 s,
    j3_replay 26 s, check.py x2 29 s, accidental_rate 4 s, PTM and edge probes 5 s, smoke tests about
    26 s. A first accidental_rate attempt that included p = 401 ran about 10 minutes on one core and
    was stopped without output; nothing from it is reported.

