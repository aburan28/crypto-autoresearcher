    secondary_metrics:
      cell_internals: >-
        Every cell satisfies dependence_rate = dependent/valid, len(relations) = dependent, every
        relation has length r and lies within bound 6, and log_p = ln p exactly.
      height_ratio_point_over_log_p: >-
        The recorded values equal round(mean_log_height_point / log p, 4) of the r = 2 cell ONLY, for
        all 8 primes on both seeds. run.py line 209 filters c["r"] == 2, so the r = 3 cells (60 percent
        of the lifted points) are absent from this secondary metric. The specification does not define
        it. Pooled over all points, the values differ from the recorded ones by at most 0.0139 on seed
        20261009 (p = 401: 0.7316 recorded vs 0.7177 pooled) and 0.0159 on seed 20261010 (p = 211:
        0.7136 vs 0.6977). The ratio rises with p under every definition: from 0.63-0.66 at p = 101 to
        0.81-0.83 at p = 12809. Under the producer's definition the recorded values reproduce exactly,
        so this is a definition finding, not a break.

  control_checks:
    - control: 'spec control 1: planted P~_2 = [2] P~_1 must be found as (2, -1)'
      result: pass
      detail: >-
        Recorded 24/24 per seed. Independently re-derived per control by regenerating each control draw
        in the producer's RNG order and running the SEALED blind search on (P~_1, [2] P~_1), with the
