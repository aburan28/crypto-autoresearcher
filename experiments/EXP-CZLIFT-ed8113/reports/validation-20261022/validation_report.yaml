        and the result agrees element-wise with both raw controls lists. No control drew y1 = 0. The
        producer's construction is A4 = a + p*k (k in 1..4), A6 = Y1^2 - X1^3 - A4 X1.
    - control: 'spec control 2: each lifted point re-verified on the fitted curve'
      result: pass
      detail: >-
        run.py asserts this per trial (line 151). My replay asserted it independently for all 3200
        trials and also checked that each fit reduces mod p to the sampled (a, b).
    - control: 'spec control 3: singular fits counted and excluded'
      result: pass (vacuous by construction)
      detail: >-
        trials - valid = 0 in all 32 cells. run.py tests only the fit's linear-system determinant mod
        p, a Vandermonde in symmetric lifts with distinct x residues (|X_i - X_j| < p), so it cannot
        vanish. The fit also reduces to the sampled nonsingular curve, so no exclusion can occur.
        Nothing is silently dropped, and the control cannot fire.
    - control: independent checker receipt (check.py)
      result: pass_with_limitation
      detail: >-
        Re-executed 2026-10-22 on both runs: rc 0 (14.2 s and 14.4 s), output byte-identical to the
