# EXP-CZLIFT-ed8113 -- the xedni dependence rate as an exact count.
# H-CZLIFT-cb95b8 / IDEA-20261009-7b0abf / RQ-CZLIFT-b9f765 / GOAL-CZLIFT-1516d5.
experiment:
  id: EXP-CZLIFT-ed8113
  hypothesis_id: H-CZLIFT-cb95b8
  source_idea: IDEA-20261009-7b0abf
  question_id: RQ-CZLIFT-b9f765
  goal_id: GOAL-CZLIFT-1516d5
  version: 1
  title: >-
    Lift r in {2, 3} random points of random curves at 8 primes to symmetric
    integer representatives, fit the curve, and search exactly for relations
    with coefficients up to 6; planted-dependence controls
  status: approved
  frozen: true
  designed_at: '2026-10-09'
  approved_by: coordinator
  approval_decision: DEC-20261009-296cee
  execution_authorized: true
  status_note: >-
    Frozen at version 1 and approved 2026-10-09 by DEC-20261009-296cee under
    AGENTS.md "Standing user authorization" after the readiness check
    (pilot: 80 trials at p <= 809, no dependence, 12 of 12 controls
    detected). Approval asserts nothing about H-CZLIFT-cb95b8.
  objective: >-
    Measure the dependence rate of xedni lifts with an exact bounded
    relation search, the naive heights of the lifted points and
    coefficients against log p, and the detection rate of planted
    dependences.
  inputs:
    primes: [101, 211, 401, 809, 1601, 3203, 6421, 12809]
    r: [2, 3]
    trials_per_cell: 100
    relation_bound: 6
    controls_per_prime: 3
    seeds: [20261009, 20261010]
  controls:
    - 'Planted dependence P~_2 = [2] P~_1 on a lifted curve through P~_1 must be found as the relation (2, -1); detection rate below 1.0 invalidates the run.'
    - 'Each lifted point is re-verified on the fitted curve before the search.'
    - 'Trials whose fit is singular mod p are counted and excluded, never silently dropped.'
  independent_variables:
    - p (8 values)
    - r (2, 3)
  metrics:
    primary:
      - dependence_rate_overall and dependence_rate_by_r
      - control_detection_rate
    secondary:
      - height_ratio_point_over_log_p
      - per-cell valid counts and relations found
  heuristic_under_test: null
  preregistered_prediction:
    quantity: dependence_rate_overall
    formula: '0 of 1600 valid trials per seed (upper 95 percent bound 0.0019); control_detection_rate = 1.0'
    source: H-CZLIFT-cb95b8 predictions; KR-IC-cd159a (JKSST analysis)
  scale_relevance:
    tier: toy
    justification: p <= 12809 and relation bound 6; the obstruction is a count at the scale where dependence would be cheapest.
    correspondence: null
  tail_checks:
    - 'Any relation found is recorded with its coefficients; a relation with max |m| = 1 means the lifted points coincided, which the sampler prevents by distinct x.'
  replication:
    seeds: [20261009, 20261010]
    independent_instances: 2
    replication_note: two seeds with independent curves and points.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1
  stopping_rules:
    - Stop after the two planned trials have output_validated receipts.
    - A crash or timeout is failed_infrastructure; never a metric value.
  invalidation_rules:
    - control_detection_rate < 1.0.
    - A recorded relation outside the bound (checker).
    - The checker cannot reproduce the first prime's cells from the seed.
  success_criterion: >-
    On both seeds: dependence_rate_overall <= 0.002 and
    control_detection_rate = 1.0.
  falsification_criterion: >-
    On both seeds dependence_rate_overall > 0.01 with
    control_detection_rate = 1.0.
  decision_impact:
    on_positive: >-
      H-CZLIFT-cb95b8 moves to supported at toy tier after review; the
      measured rate and heights are promoted as the counting form of the
      xedni obstruction (KR-IC-cd159a gains a measured row).
    on_negative: >-
      A dependence rate above 0.01 on both seeds reopens the xedni line with
      a red-team card and a larger relation bound; the found relations are
      the evidence.
  required_artifacts:
    - experiments/EXP-CZLIFT-ed8113/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CZLIFT-ed8113/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CZLIFT-ed8113/runs/<RUN-ID>/command.txt
    - experiments/EXP-CZLIFT-ed8113/runs/<RUN-ID>/environment.json
    - experiments/EXP-CZLIFT-ed8113/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CZLIFT-ed8113/runs/<RUN-ID>/stderr.log
  launcher:
    trial_plan: experiments/EXP-CZLIFT-ed8113/trial-plan.json
    driver: experiments/EXP-CZLIFT-ed8113/implementation/run.py
    checker: experiments/EXP-CZLIFT-ed8113/implementation/check.py
    library: [harness/czlift.py, harness/czlift_run.py, harness/toycurve.py]
  assigned_to: executor
  out_of_scope:
    - Relation coefficients above 6; r above 3; non-symmetric lifts.
    - Any claim about a deployed curve.
