experiment:
  id: EXP-MTGT-e5926f
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-a2fb45
  question_id: RQ-MTGT-2cabee
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'CLOSURE WITH A NAMED OBSTRUCTION -- THE PREPROCESSING FRONTIER IS AN ISOGENY-CLASS INVARIANT:
    the achievable (S, T) set of any advice-based DLP algorithm is the same on every member of an
    F_p-isogeny class up to an additive O(L*ell^3) field-operation term, by a two-way simulation,
    so the optimisation "find the classmate on which preprocessing is cheapest" -- the ONLY route
    by which L13 could ever produce a single-instance attack -- is VACUOUS, and any L13 proposal whose
    payoff is a better (S, T) on one curve is inadmissible on its face'
  status: draft
  objective: "(A) THE FUNCTIONAL BEING CLOSED, DEFINED PRECISELY SO THE CLOSURE HAS EDGES. For a curve\
    \ E with distinguished point P generating a prime-order subgroup G of order N, define\n    F(E,\
    \ P) := { (S, T) : there is an algorithm that, given S bits of advice\n                 depending\
    \ only on (E, P), solves Q = [k]P in T online group\n                 operations with success\
    \ probability >= 2/3 }.\nF is the ACHIEVABLE PREPROCESSING FRONTIER of the instance. Corrigan-Gibbs--\
    \ Kogan bound it from below by S*T^2 = Omega~(N) (KN-LIT-013, KN-TECH-005) and Bernstein-Lange\
    \ realise a point on it at S = T = N^{1/3}. The only way lane L13 could ever produce an attack\
    \ on a single deployed curve is if F VARIED across the isogeny class, so that an attacker could\
    \ preprocess on the cheapest classmate and transport. This record closes that.\n(B) THE CLOSURE,\
    \ AS A TWO-WAY SIMULATION. Let E, E' be F_p-isogenous with a path of length L and maximum step\
    \ degree ell, gcd(deg, N) = 1. Let phi be the composite, phi-hat its dual, and write delta :=\
    \ 2*c_eval + C_build/(queries) for the transport overhead, where c_eval <= 6*L*ell field operations\
    \ per point (Velu; KN-LIT-780) and C_build = O(L*ell^3) is paid once.\n  DIRECTION 1. Given advice\
    \ a of size S achieving online time T on (E, P),\n  the SAME STRING a achieves online time T +\
    \ delta on (E', phi(P)): on input\n  (E', phi(P), Q'), apply phi-hat to P' and Q', obtaining an\
    \ instance on E\n  with the same k by T1, then run the E-algorithm with advice a. Correctness\n\
    \  is T1; the extra cost is two isogeny evaluations.\n  DIRECTION 2. Symmetric, using phi in place\
    \ of phi-hat.\n  HENCE  F(E, P) + (0, delta)  subset  F(E', phi(P))  and conversely, so\n    F(E,\
    \ P) = F(E', phi(P))  UP TO AN ADDITIVE delta IN THE TIME COORDINATE\n    AND EXACTLY IN THE ADVICE\
    \ COORDINATE.\n  THE NAMED OBSTRUCTION: THE PREPROCESSING FRONTIER IS AN ISOGENY-CLASS\n  INVARIANT.\
    \ Its advice axis is invariant EXACTLY, with no additive slack at\n  all, because the same advice\
    \ string is reused verbatim.\n\n(C) WHAT THE CLOSURE FORBIDS, STATED SO IT IS USABLE. It forbids\
    \ every proposal of the following shape: \"search the isogeny class for a curve E* on which preprocessing\
    \ is cheaper, preprocess there, and transport.\" The minimum of F over the class equals F at every\
    \ member, so the search returns the curve you started on. In particular it forbids: a class-wide\
    \ search for a smaller table; a class-wide search for a faster online phase; a class-wide search\
    \ for a better time-memory point; and any claim that the class-minimum of a preprocessing cost\
    \ is below the class-maximum by more than delta. It also gives lane L13 its honest prior: the\
    \ lane's remaining content is ACCOUNTING ACROSS CURVES (IDEA-20260807-a127ab, IDEA-20260807-406fef),\
    \ not OPTIMISATION WITHIN THE CLASS.\n(D) WHAT THE CLOSURE DOES NOT REACH -- THE FORWARD GUIDANCE,\
    \ WHICH IS THE PART THAT MAKES THIS A CLOSURE AND NOT A FATIGUE REPORT (docs/inventor-protocol.md\
    \ section 4). Four classes remain open and they are named with the reason the simulation fails\
    \ on each:\n  OPEN-1. NON-GROUP-LEVEL PREPROCESSING. F is defined over algorithms that\n    access\
    \ G as a group. Preprocessing whose cost depends on the CURVE\n    EQUATION -- Semaev relation\
    \ collection, factor-base construction,\n    Groebner solving degree -- is not a functional of\
    \ (G, P) and the\n    simulation says nothing about it, because Direction 1 would have to\n  \
    \  translate an E-factor-base into an E'-factor-base and the shape\n    invariants do not transport\
    \ (IDEA-20260807-e0ddc6, Class II/III). THIS\n    IS LANE L1's TARGET (RQ-ICINV-475b5e) AND THE\
    \ CLOSURE HANDS IT OVER\n    RATHER THAN ABSORBING IT.\n  OPEN-2. ADVICE SIZE VERSUS ADVICE ENCODING.\
    \ The advice axis is invariant\n    because the same STRING is reused. But the number of BITS\
    \ needed to\n    write a table may depend on the curve: a curve with a small j-invariant,\n  \
    \  a small CM discriminant, or a sparse Weierstrass model might admit a\n    shorter encoding\
    \ of the same table. That is a compression question about\n    the representation, not about the\
    \ group, and the simulation does not\n    touch it. Predicted to be worth O(1) bits per entry\
    \ at most, but it is\n    genuinely open and is the one micro-lane this closure leaves inside\
    \ L13.\n  OPEN-3. NON-NEGLIGIBLE delta. The closure is up to an additive delta, and\n    delta\
    \ is negligible only when ell is polylog and L is short. A class\n    whose members are connected\
    \ only by large-degree isogenies would have a\n    non-negligible delta; whether such a class\
    \ exists for cryptographic\n    parameters is not settled here. Related: the reachability gate\
    \ below.\n  OPEN-4. NON-CLASSICAL MODELS. Quantum path-finding in an ordinary class is\n    subexponential,\
    \ and a quantum preprocessing frontier is a different\n    functional. Nothing here applies.\n\
    \n(E) WHY THIS RECORD'S ADMISSIBILITY VERDICT IS THE NEGATIVE ONE. The admissibility filter of\
    \ DECOMPOSITION.md section 2 closes a lane whose only use of phi is to apply it to points of G.\
    \ Direction 1 and Direction 2 do exactly and only that. So THE SINGLE-INSTANCE READING OF L13\
    \ IS INADMISSIBLE, and this record's verdict is inadmissible_generic_group -- not because the\
    \ argument is weak but because the argument PROVES the filter's verdict for this functional. A\
    \ generic adversary handed one group can simulate the \"other curve\" by relabelling, and gains\
    \ nothing. Recording the inadmissibility as a derived theorem rather than as a screening opinion\
    \ is the deliverable."
  resource_label: 'R8 and R4 nominally (the functional is a preprocessing functional and the map is
    an isogeny), but the finding is that NEITHER RESOURCE DELIVERS ANYTHING for this functional: R4''s
    action on G is a relabelling and R8''s advice axis is invariant under it. The honest label is
    therefore "R8/R4, closed".'
  admissibility: inadmissible_generic_group
  admissibility_argument: 'The closure argument IS the inadmissibility argument, which is why the
    two coincide here. F(E, P) is a functional of the abstract advice-augmented group. phi|_G is an
    efficiently computable group isomorphism, so a generic-group adversary against (E'', phi(P)) is
    simulable by a generic-group adversary against (E, P) with the identical advice string and two
    extra isogeny evaluations, and conversely. Every use of phi in the argument is an application
    of phi to points of G, which is precisely the pattern the section 2 filter closes, and KN-FIND-b7e091''s
    Oracle D closure (endomorphism images are computable from Q alone) is the same phenomenon one
    step down. The inadmissibility verdict is therefore not a screening judgement but a consequence:
    for THIS functional, on ONE instance, the isogeny class is generic-group information. What is
    NOT closed is the M-instance accounting (IDEA-20260807-a127ab, IDEA-20260807-406fef), where the
    resource is the identification BETWEEN encodings rather than the action WITHIN one, and those
    records are correspondingly labelled admissible. The two verdicts are consistent and their boundary
    is exactly the number of instances.'
  reachability_gate: 'THE GATE IS WHAT MAKES THE CLOSURE''S OWN QUALIFIER MEANINGFUL, AND IT CUTS
    BOTH WAYS. Direction 1 and Direction 2 both require an EXPLICIT path between the two SPECIFIED
    curves, so the closure as an ALGORITHMIC statement is only as constructive as path-finding, at
    p^{1/4+o(1)} field operations (see IDEA-20260807-a127ab heuristic H1, with its concrete-versus-asymptotic
    split). But as a CLOSURE the gate is irrelevant in the helpful direction: to rule OUT a class-wide
    optimisation one only needs the path to EXIST, not to be findable, because if the attacker cannot
    find the path to the allegedly better curve then the optimisation is unavailable for that reason
    instead. THE CLOSURE IS THEREFORE ROBUST TO THE GATE: either the frontier is invariant (no better
    curve) or the better curve is unreachable (no access to it), and both branches close the optimisation.
    This is the only record in the lane for which a FAILING reachability gate strengthens rather than
    weakens the conclusion, and that asymmetry is recorded as the reason it is worth writing.'
  inputs:
    procedure: 'STAGE 0 (zero compute, AND IT IS THE WHOLE RESULT): Steps 1 and 2 -- the two-way simulation
      written out, with the exact break point named for each of OPEN-1..OPEN-4. A closure is a written
      argument; if it does not survive review at this stage there is nothing to run. STAGE 1 (zero
      compute, HARD GATE): Step 3, the nearby-object control. Apply the argument to Semaev yield and
      confirm it fails. Costs nothing and is the cheapest falsification available. STAGE 2 (minutes):
      Step 4''s delta measurement on one toy class, including the L = 0 identity check. STAGE 3 (low
      hours): Step 5''s within-class and between-class variance measurement over enumerable toy classes
      at p in {2^{10}, 2^{12}, 2^{14}}, matched seeds, class size m swept. STAGE 4 (zero compute):
      Step 6''s routing paragraph.'
    mechanism: 'STEP 1 -- WRITE THE SIMULATION OUT IN FULL, BOTH DIRECTIONS, WITH THE COST TERM EXPLICIT.
      This is a proof obligation, not a measurement, and it is done before any compute. Include the
      case where phi is a composite of L steps and the case where the dual is used. STEP 2 -- IDENTIFY
      EXACTLY WHERE THE SIMULATION BREAKS. For each of OPEN-1 through OPEN-4, exhibit the specific
      step of Direction 1 that fails and why. A closure whose author cannot say where its own argument
      stops is a fatigue report. STEP 3 -- THE NEARBY-OBJECT CONTROL, WHICH IS BLOCKING. Apply the
      identical argument to a functional that is NOT group-level -- the m = 3 Semaev decomposition
      yield over an x-box factor base, measured by harness/semaev.py. THE ARGUMENT MUST FAIL TO APPLY.
      If the same reasoning appears to prove that Semaev yield is a class invariant, the argument
      is too strong and is wrong, because L1''s whole premise is that such functionals might vary.
      This control is the cheapest possible falsification of the closure and it costs nothing. STEP
      4 -- MEASURE delta AT TOY SCALE. Construct explicit paths in enumerable toy classes, count the
      field operations of two-point transport, and confirm delta is small relative to a measured single-target
      online phase. This does not test the closure (which is a theorem) but it tests whether the closure''s
      "up to delta" qualifier is doing hidden work. STEP 5 -- EMPIRICAL CONSISTENCY, WHICH IS A CHECK
      AND NOT A PROOF. Measure a concrete (S, T) point -- table size and online walk length for a
      Bernstein-Lange-style store -- on EVERY member of an enumerable toy class, with matched seeds.
      Predicted: zero variance beyond the harness''s own run-to-run spread. Non-zero structured variance
      would contradict the closure and require the argument to be re-examined before the measurement
      is trusted. STEP 6 -- WRITE THE FORWARD-GUIDANCE PARAGRAPH of (D) into a form the coordinator
      can route: OPEN-1 to L1, OPEN-2 stays in L13, OPEN-3 to the reachability work, OPEN-4 out of
      campaign scope.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - Semaev-yield nearby-object control (argument must fail)
  - between-class variance arm (pipeline sensitivity check)
  - identity-map arm (delta must be exactly zero)
  - matched-seed within-curve repeats (the noise floor the zero is read against)
  - class-size sweep m (decay parameter for the enumeration artifact)
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, AND IT IS THE NEARBY-OBJECT CONTROL
    OF STEP 3: apply the identical closure argument to the m = 3 Semaev decomposition yield and Groebner
    solving-degree proxy over a fixed x-box factor base -- a functional that is explicitly NOT group-level
    and that lane L1 exists to test. THE ARGUMENT MUST FAIL. If it appears to succeed, the argument
    proves too much and is void. SECOND NULL, EMPIRICAL: measure the concrete (S, T) point on every
    member of an enumerable toy class against a matched set of curves of the SAME ORDER N drawn from
    DIFFERENT classes. Within-class variance must be indistinguishable from within-curve seed noise;
    between-class variance is unconstrained by this record and serves as the scale against which "zero"
    is read. DECAY PARAMETER: the number of class members enumerated, m. The measured within-class
    variance of (S, T) must NOT grow with m beyond seed noise. A variance that grows with m means
    the "invariant" is only invariant on the members that were looked at first, which is the canonical
    artifact tell in its class-enumeration form.'
  independent_variables: []
  metrics:
    primary:
    - the written simulation, both directions, with delta explicit
    - the named break point for each of OPEN-1..OPEN-4
    - within-class and between-class variance of (S, T), per class, per m
    - measured delta in field operations, per path, including L = 0
    secondary:
    - within-curve seed-noise floor
    - pass/fail of the nearby-object control
  heuristic_under_test: null
  preregistered_prediction:
    quantity: within-class variance of the measured (S, T) operating point
    formula: Indistinguishable from within-curve seed noise on every enumerable toy class, at every
      class size m. Structured nonzero variance contradicts the closure and must be investigated as
      a measurement artifact BEFORE it is read as a mathematical result.
    source: pre-registered in IDEA-20260807-a2fb45 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - 'CURVE-INSENSITIVE PIPELINE. The dominant risk: a measurement whose table construction depends
    only on (N, seed) will report zero within-class variance for a trivial reason. The between-class
    arm is the required antidote and is blocking.'
  - TOY CLASS SIZE. Enumerable toy classes have few prime-order members, so the within-class variance
    estimate has few degrees of freedom. The m sweep and the seed-noise floor are what make the zero
    readable.
  - ISOMORPHIC MEMBERS. Two class members that are F_p-isomorphic are one curve and will trivially
    show zero variance. j-invariants must be recorded and distinct.
  - delta AMORTISATION AMBIGUITY. Whether C_build is charged once per path, once per target, or once
    per class changes delta by orders of magnitude. The convention must be frozen before Stage 2 and
    reported with every figure.
  - CONFLATING THE CLOSURE WITH ITS MEASUREMENT. The closure is a theorem; the measurement is a consistency
    check. A passing measurement does not confirm the theorem and a failing one indicts the measurement
    first. This ordering must be stated in the write-up.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Indistinguishable from within-curve seed noise on every enumerable toy class,
    at every class size m. Structured nonzero variance contradicts the closure and must be investigated
    as a measurement artifact BEFORE it is read as a mathematical result.
  falsification_criterion:
  - The closure argument, written out, also proves that a non-group-level functional (Semaev yield)
    is class-invariant. The argument is too strong, is wrong, and this record is superseded.
  - Structured nonzero within-class variance of (S, T) survives its seed-noise floor and the between-class
    sensitivity check. The closure is false as stated and lane L13 acquires a live target; this would
    require independent replication before any interpretation.
  - delta is measured nonzero at L = 0. Instrument fault; every delta figure is void.
  - The pipeline shows zero BETWEEN-class variance too. It is curve-insensitive and its within-class
    zero is uninformative; the run set is INVALID rather than confirming.
  - A member of the class is connected only by steps of degree comparable to N, making delta non-negligible.
    OPEN-3 becomes binding and the closure's qualifier is doing real work; this must be reported rather
    than absorbed.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-a2fb45
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
