        - {relative_offset: 1, bytes: 1, type: u8, name: target_field_id}
        - {relative_offset: 2, bytes: 1, type: u8, name: target_encoding_code}
        - {relative_offset: 3, bytes: 1, type: zero, name: reserved_zero}
      alias_id_enum: {X: 0, Y: 1, V: 2}
      target_field_id_enum: {M: 0, S: 1}
      target_encoding_code_enum: {one_bit: 1, u16be: 2}
      base_entry_values:
