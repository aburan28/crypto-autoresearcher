        - {offset: 8, bytes: 1, type: u8, name: schema_version, required_value: 2}
        - {offset: 9, bytes: 1, type: u8, name: arm, required_value: 0}
        - {offset: 10, bytes: 1, type: u8, name: bits, required_value: 18}
        - {offset: 11, bytes: 1, type: u8, name: cluster, required_value: 0}
        - {offset: 12, bytes: 2, type: u16be, name: root_count, required_value: 8}
        - {offset: 14, bytes: 2, type: u16be, name: reserved_zero_a, required_value: 0}
        - {offset: 16, bytes: 4, type: u32be, name: bitset_bytes, required_value: 1}
        - {offset: 20, bytes: 4, type: u32be, name: multiplicity_bytes, required_value: 16}
        - {offset: 24, bytes: 4, type: u32be, name: alias_descriptor_bytes, required_value: 24}
        - {offset: 28, bytes: 4, type: u32be, name: reserved_zero_b, required_value: 0}
        - {offset: 32, bytes: 1, type: bytes, name: success_bitset}
        - {offset: 33, bytes: 7, type: zero, name: bitset_slot_padding}
        - {offset: 40, bytes: 16, type: bytes, name: multiplicity_u16be_table}
        - {offset: 56, bytes: 24, type: bytes, name: alias_descriptor}
        - {offset: 80, bytes: 32, type: bytes, name: retained_summary_digest}
        - {offset: 112, bytes: 32, type: bytes, name: retained_alias_digest}
        - {offset: 144, bytes: 16, type: zero, name: trailing_reserved_zero}
      layout_total: '8+1+1+1+1+2+2+4+4+4+4+1+7+16+24+32+32+16=160.'
      base_field_values:
        success_bitset_hex: a0
        multiplicity_u16be_table_hex: '00010000000100000000000000000000'
        alias_descriptor_hex: '414c49415376303203000000000002000100020002000200'
        retained_summary_digest: 50feeffdfbe1e3c747a62c3e334b98619af67c7b6a987ca556115e17b659bee8
        retained_alias_digest: c09bf72aff24512f208159b70cd736f3b9cd96e729f966778dd7e6acb3a0015f
      base_enclosure_sha256: null
      base_enclosure_sha256_null_reason: >-
        The 160 enclosure bytes are fully frozen above, but their SHA-256 is
        not computed in this task and is not fabricated.
      semantic_consistency_note: >-
        Bitset byte 0xa0 selects roots 0 and 2, matching multiplicity entries
        M[0]=1 and M[2]=1 with all other entries zero in the diffuse arm.
    alias_descriptor_grammar:
      closes_finding_part: REV-CANONICAL-SCHEDULE-008
      implements_repair: 3
      id: ALIASv02
      total_bytes: 24
      derivation_statement: >-
        This layout is a freezing of the 24 base bytes already published by
        EXP-ECDLP-ffa5c3. Every published byte, the published base digest, the
        published mutated digest, and the published zero-based changed offset
        21 are preserved unchanged; only the previously absent field
        assignment is now stated, which is what makes the parse unique.
      layout:
        - {offset: 0, bytes: 8, type: ASCII, name: magic, required_value: ALIASv02}
        - {offset: 8, bytes: 1, type: u8, name: alias_count, required_value: 3}
        - {offset: 9, bytes: 3, type: zero, name: reserved_zero, required_value: 0}
        - {offset: 12, bytes: 4, type: alias_entry, name: entry_0}
        - {offset: 16, bytes: 4, type: alias_entry, name: entry_1}
        - {offset: 20, bytes: 4, type: alias_entry, name: entry_2}
      layout_total: '8+1+3+4+4+4=24.'
      alias_entry_layout:
