      - Any S/M decoder mismatch or any claim that X, Y, and V are independent encoded channels.
      - Any mismatch between a regenerated stream and its archived artifact.
      - Any exact count, mean, slope, gamma, gap orientation, ordinal, Type-1 rank, or fit mismatch.
      - Any gap enclosure that is not an exact beta difference or whose width reaches 2^-119.
      - Any violation of the frozen gap total order, tie rule, or zero-refinement policy.
      - Any mutation accepted or rejected at a different first check or reason code.
      - Any nonconverged, dropped, replaced, capped, or imputed fit or draw.
      - Any log byte emitted by S4, S5, or S6, or any forbidden provenance content.
      - Any artifact that attests a fact about itself or about a later stage.
      - Any nonzero resource, archive, artifact-coverage, write, or read residual.
    interpretation: >-
