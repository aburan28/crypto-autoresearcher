    mutation_resource_rows:
      first_error_checks: 4
      digest_recomputations: 8
      digest_recomputation_derivation: '4 mutations * 2 enclosing digests recomputed per mutation = 8.'
      base_enclosure_read_bytes: 640
      base_enclosure_read_derivation: '4 mutations * 160 base bytes = 640.'
      mutated_enclosure_read_bytes: 639
      mutated_enclosure_read_derivation: '160+160+159+160 = 639.'
      total_enclosure_read_bytes: 1279
      total_enclosure_read_derivation: '640+639 = 1279.'
    pass_rule: >-
      Every base fixture is accepted and every mutation is rejected at exactly
      its registered first check and reason code. Any acceptance, alternate
      first reason, or crash invalidates the apparatus control.

  finalization_graph:
    closes_finding: REV-PACKAGE-FINALIZATION-010
    implements_repairs: [6, 7]
    predecessor_cycles_identified:
      - id: CYC-1
        description: 'S4 wrote the log file whose content included S4 stdout and stderr, so the file described its own production.'
        removal: 'the frozen capture-boundary rule makes S0 through S3 the only emitting stages and requires S4, S5, and S6 to be silent.'
      - id: CYC-2
        description: 'S4 wrote the provenance record containing final resource measurements and the final validity verdict of the stage writing it.'
        removal: 'provenance carries measured values for S0 through S3 only, declared frozen constants for S4 through S6, and a validity code scoped to end of S3; measured S4 through S6 values and the final verdict move to the external receipt.'
      - id: CYC-3
        description: 'the container index was produced by the same stage that also produced files it hashes, and it nominally contained its own whole-file hash.'
        removal: 'the self-neutral index entry is retained, index construction is the last action of S5 and depends only on files already written, and independent reread validation moves to S6 which writes nothing.'
    nodes:
      - {id: SPEC, kind: external_constant, produces: 'frozen constants of this specification', inside_package: false}
      - {id: S0, kind: stage, produces: [0, 1]}
      - {id: S1, kind: stage, produces: [2, 3, 4, 5, 7, 8]}
      - {id: S2, kind: stage, produces: [6]}
      - {id: S3, kind: stage, produces: [9, 10, 11]}
      - {id: S4, kind: stage, produces: [12, 13], note: 'produces content only; bytes reach disk in S5'}
      - {id: S5, kind: stage, produces: [14], note: 'writes files 0 through 13 to disk, computes their whole-file digests, then constructs and writes the index'}
      - {id: S6, kind: stage, produces: [], note: 'reads only; emits a verdict and no artifact'}
      - {id: EXTRECEIPT, kind: external_receipt, produces: 'final package receipt', inside_package: false}
    edges:
      - {from: SPEC, to: S0}
      - {from: SPEC, to: S4, reason: 'declared-only S4 through S6 resource constants'}
      - {from: S0, to: S1}
      - {from: S1, to: S2}
      - {from: S2, to: S3}
      - {from: S0, to: S4, reason: 'S0 measurements and emissions'}
      - {from: S1, to: S4, reason: 'S1 measurements and emissions'}
      - {from: S2, to: S4, reason: 'S2 measurements and emissions'}
      - {from: S3, to: S4, reason: 'S3 measurements and emissions'}
      - {from: S0, to: S5}
      - {from: S1, to: S5}
      - {from: S2, to: S5}
      - {from: S3, to: S5}
      - {from: S4, to: S5}
      - {from: S5, to: S6}
      - {from: S5, to: EXTRECEIPT}
      - {from: S6, to: EXTRECEIPT}
    intra_S5_order:
      - 'write files 0 through 13 in ascending ordinal order, computing each payload digest before its header and each whole-file digest from the bytes as written'
      - 'construct index entries 0 through 13 from those whole-file digests'
      - 'construct index entry 14 with 32 zero bytes in whole_file_sha256 and flags bit 0 set'
      - 'write file 14 last'
    topological_order: [SPEC, S0, S1, S2, S3, S4, S5, S6, EXTRECEIPT]
    acyclicity_argument: >-
      Assign each node its index in the topological order above. Every edge in
      the edge list goes from a lower index to a strictly higher index, and no
      edge is a self-loop. A directed graph admitting a strict topological
      numbering of all its edges contains no directed cycle. Within S5 the
      artifact order is a linear chain by file ordinal and the last file's own
      digest field is the frozen constant of 32 zero bytes, which depends on
      nothing, so the intra-stage expansion adds no back edge.
    self_reference_audit:
      artifact_that_contains_its_own_digest: none
      artifact_that_contains_its_own_measurement: none
      artifact_that_contains_a_later_stage_measurement: none
      stage_that_validates_bytes_it_wrote_in_the_same_stage: none
      final_validity_owner: EXTRECEIPT
      final_validity_inside_package: false
    external_final_receipt:
      produced_by: external_archive_or_snapshot_task
      apparatus_stage: false
      inside_package: false
      apparatus_budget_consumed: 0
      contents:
        - whole-file SHA-256 of every file including artifact ordinal 14
        - measured wall, CPU, RSS, operation, and logical-I/O values for S4, S5, and S6
        - the S6 reread verdict
        - the final validity verdict for the whole package
      index_whole_file_sha256: null
      index_whole_file_sha256_null_reason: 'not knowable before a run exists; fabricating it is forbidden.'
      binding_note: >-
        Because the final receipt lives outside the package, binding it cannot
        change any package byte and therefore cannot reintroduce a cycle.

  exact_probability_contract:
    review_disposition: >-
      REV-PROBABILITY-LABEL-006 remains closed at design scope. Terminology is
      preserved exactly: a fixed aggregated binomial objective over
      deterministic aggregates, with no sampling-law, variance, or
      confidence-interval reading of the bootstrap percentiles.
    status: finite_deterministic_fixture_with_exact_resampling_map
    materialized_data_law: >-
      After seed freeze every record is deterministic. Frequencies are finite
      sums and are never described as independent Bernoulli samples.
    bootstrap_map: >-
      Under the declared ideal-XOF model each low-five-bit index is uniform on
      {0,...,31}. The realized index package is deterministic. Arm-separated
      keys are disjoint, so diffuse and concentrated resamples are independent
      under that model. There is no rejection, conditioning, imputation,
      regenerated draw, or dropped draw.
    objective_label: fixed_aggregated_binomial_objective
    sampling_law_inference: forbidden
    percentile_reading: >-
      Type-1 rank 41 and rank 8151 selections are ordinal selections from a
      finite deterministic multiset. They are not confidence intervals, not
      variance estimates, and not standard errors.
    interpretation: >-
      Objective curvature, interval-Newton boxes, ordinal percentiles, and
      gap endpoints are deterministic apparatus outputs. They provide no
      sampling-law inference about curves, ECDLP, SHAKE256, or an asymptotic
      population.

  estimators:
    exact_cell_summaries:
      mu_M: 'sum(M)/262144 at each arm and size'
      mean_X_alias: mu_M
      mean_Y_alias: mu_M
      mean_V_alias: mu_M
      m2_M: 'sum(M^2)/262144 at each arm and size'
      kappa: 'm2_M/mu_M; zero mu_M is invalid'
      p: 'sum(S)/262144 at each arm and size'
      ratio: 'p/mu_M; zero mu_M is invalid'
    bridge_slopes:
      x_axis: 'ln(N/2^24)'
      eta_basis: 'N^(-1/3)-2^-8'
      corrected_response: 'ln(metric)-eta*(N^(-1/3)-2^-8)'
      fit: equal_size_OLS_with_free_intercept_over_five_positive_values
      metrics: [kappa, ratio]
      precision: directed_256_bit_with_final_decimal_interval_width_below_1e-15
      eta_basis_OLS_slope_exact: '-3/(2560*ln(2))'
      eta_basis_OLS_slope_decimal: '-0.00169065825104175399299991173554909235'
      preserved_unchanged: true
    marginal_gamma:
      name: fixed_aggregated_binomial_objective
      rows: five_size_aggregates
      definition: >-
        For fixed arm and eta, set x_i=ln(N_i/16777216),
        z_i=N_i^(-1/3)-2^-8, theta_i=alpha+beta*x_i+eta*z_i,
        and q_i=exp(theta_i), restricted to theta_i<0. Maximize the fixed
        deterministic objective Q(alpha,beta)=sum_i[s_i*theta_i+
        (262144-s_i)*log1p(-exp(theta_i))]. This algebraic criterion uses
        binomial-shaped terms but asserts no binomial sampling law.
      solve: >-
        A deterministic directed 384-bit interval-Newton procedure uses the
        fixed initial box alpha in [-32,0] and beta in [-2,2], bisects alpha
        before beta on an inconclusive contraction, rejects any box with a
        theta_i upper bound at or above zero, visits lower subboxes first, and
        must isolate exactly one interior stationary point whose alpha and beta
        widths are each below 2^-120. No estimator substitution, continuity
        correction, dropped size, or alternate link is permitted.
