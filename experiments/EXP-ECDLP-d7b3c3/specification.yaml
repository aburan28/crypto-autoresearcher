        grammar: 'EXP-ECDLP-adaa91|matched-mean-bootstrap-v1|arm=concentrated|eta={eta}|bits={bits}|draw={draw}|position={position}|component=cluster-index-u64'
        eta_values: [0, 4]
        key_bytes: 123
        absorbed_message_bytes: 157
    output_semantics:
      cluster_rank: 'Squeeze 32 bytes and interpret as u256be.'
      root_rank: 'Squeeze 32 bytes and interpret as u256be.'
      bootstrap_index: >-
        Squeeze 8 bytes, interpret as u64be, and return word AND 31. Because
        32 divides 2^64, this is exact uniform reduction under the ideal-XOF
        model with one word, no rejection, no cap, and no dropped draw.
