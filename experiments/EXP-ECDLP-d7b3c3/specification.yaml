      canonical_json_encoding:
        character_encoding: UTF-8
        byte_order_mark: forbidden
        insignificant_whitespace: forbidden
        trailing_newline: forbidden
        key_sort_rule: >-
          At every object level, keys are sorted ascending by unsigned byte
          value of their UTF-8 encoding. Duplicate keys at any level are
          invalid.
        number_rule: >-
          Integers only. Decimal digits with no leading zero except the single
          digit 0, no plus sign, no exponent, no fraction. Floating point,
          NaN, and infinity are forbidden. Durations are expressed as integer
          milliseconds and byte counts as integers.
        string_escape_rule: >-
          Escape only the double quote as backslash-quote, the backslash as
          double backslash, and the code points U+0000 through U+001F as
          lowercase four-hex-digit backslash-u escapes. Do not escape the
          solidus. Never escape any code point above U+001F. All other
          characters appear as raw UTF-8 bytes.
        array_rule: array element order is significant and is the order declared in this schema
        boolean_and_null_rule: 'the literals true, false, and null only'
