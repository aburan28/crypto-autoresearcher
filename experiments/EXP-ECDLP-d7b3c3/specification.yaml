  proof_search_map:
    applicable: true
    bottleneck: >-
      Determine whether an equal expected multiplicity observable can conceal
      a polynomial loss in Boolean success without allowing encoding,
      resampling, ordering, or accounting choices to manufacture the
      separation.
    baseline_embedding:
      parameter_slice: >-
        Diffuse arm, eta zero, all five N values, mu_M=1/4, kappa=1,
        p/mu_M=1, beta=0, and gamma_s=1/3.
      reproduction_check: >-
        Exact integer sums and the fixed-objective score vanish at the
        registered alpha and beta; no fitted or simulated baseline is used.
    observation_collision:
      observable: 'Mean multiplicity mu_M, exposed identically as X, Y, and V.'
      distinct_preimage_search: >-
        The diffuse and concentrated planted populations collide exactly at
        mu_M=1/4 for every size while differing in M second moment and Boolean
        success. This is a constructed observable-fiber collision, not a
        claim about curve data.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: same-shape populations with fixed mu_M and different concentration
        predicted_gain: isolate whether kappa, ratio, and gamma_s detect the planted lost structure
    quantifier_order: >-
      For the one seed, every arm, each of five fixed sizes, each fixed eta,
      all 32 clusters, all 8192 roots, all 8191 draw ordinals, both independent
      decoder implementations, the exact schemas, orderings, tie rules,
      refinement budget, thresholds, and hard caps are fixed before
      implementation; only then may a future run evaluate whether every
      registered equality and rejection holds. No witness, parser, resample,
      estimator, ordering key, tie rule, refinement decision, rank convention,
      or budget may depend on an observed result.
    quantifier_order_repair_note: >-
      TASK-20260809-923ede audited quantifier_order as fail. The successor
      response is the zero-adaptive-refinement policy and the value-independent
      total order and tie rule, which remove the only ordering decisions that
      could have consulted an observed value. Whether the audit now passes is
      for the next independent reviewer to judge; this record claims only that
      the identified decision points are now frozen.
    method_ceiling:
      strongest_certifiable_claim: >-
        One valid future run could certify only that this deterministic
        apparatus recognizes its own planted one-third separation under the
        exact byte and resource contract.
      nearby_object_control: >-
        The diffuse arm has the same schema and exact mean without
        concentration; the post-decode label swap, the four mutation fixtures
        inside a frozen enclosure, and the independent artifact comparisons
        attack hidden treatment state and permissive rejection paths.
      nearby_object_control_repair_note: >-
        TASK-20260809-923ede audited nearby_object_control as incomplete. The
        successor adds independent cluster-rank and bootstrap-index artifact
        comparisons and a frozen mutation enclosure with an executable check
        order. The audit disposition remains the next reviewer's to set.
    proof_obligations:
      - {claim: preserved predecessor population and arithmetic, responsibility: baseline}
      - {claim: byte-identical XOF inputs and preserved concrete outputs, responsibility: interface}
      - {claim: one encoded M channel with truthful aliases, responsibility: interface}
      - {claim: 'canonical archived gap representation, ordering, and endpoints', responsibility: correctness}
      - {claim: exact eta-zero gap orientation and ordinal law, responsibility: correctness}
      - {claim: Type-1 ranks and fit counts, responsibility: success_probability}
      - {claim: complete producer-consumer-verifier resource closure, responsibility: runtime}
      - {claim: acyclic finalization with an external final receipt, responsibility: runtime}
      - {claim: apparatus-only ceiling, responsibility: scope}
