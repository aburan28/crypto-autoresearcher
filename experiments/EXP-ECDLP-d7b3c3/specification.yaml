        expected_reason: BITSET_DIGEST_MISMATCH
        earlier_checks_pass_argument: 'length 160 passes CHK-LEN, header and geometry are untouched, all reserved bytes remain zero, so CHK-SUMDIG is the first failure.'
      - id: MUT-ENDIAN-SWAP-002
        mutation_ordinal: 1
        enclosing_object: MUTENC02
        enclosure_field_path: 'MUTENC02.multiplicity_u16be_table[0..7]'
        enclosure_absolute_byte_offset: 40
        enclosure_affected_byte_range: '40..55'
        transformation: 'Reverse the two bytes of each u16be entry and rebind the enclosing summary digest so that semantic decoding is reached.'
        base_multiplicity_hex: '00010000000100000000000000000000'
        mutated_multiplicity_hex: '01000000010000000000000000000000'
        mutated_enclosure_bytes: 160
        retained_digests:
          retained_alias_digest: c09bf72aff24512f208159b70cd736f3b9cd96e729f966778dd7e6acb3a0015f
        rebound_digests: [retained_summary_digest]
        rebound_digest_values:
