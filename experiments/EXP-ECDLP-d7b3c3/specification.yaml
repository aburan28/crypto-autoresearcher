        rebound_digest_input_frame_hex: '4353554d4441543200120000000001a00000001001000000010000000000000000000000'
        rebound_digest_input_frame_bytes: 36
        rebound_digest_null_reason: >-
          The rebound digest is SHA-256 of the exact 36-byte mutated CSUMDAT2
