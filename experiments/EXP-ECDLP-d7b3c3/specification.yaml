        transformation: 'Remove the byte at enclosure offset 55 without changing any declared length field.'
        mutated_enclosure_bytes: 159
        declared_lengths_unchanged: true
        retained_digests:
          retained_summary_digest: 50feeffdfbe1e3c747a62c3e334b98619af67c7b6a987ca556115e17b659bee8
          retained_alias_digest: c09bf72aff24512f208159b70cd736f3b9cd96e729f966778dd7e6acb3a0015f
        rebound_digests: []
        rebound_digest_values: {}
        resulting_enclosure_sha256: null
        first_failing_check: CHK-LEN
        expected_reason_code: '0x0303'
        expected_reason: STREAM_TRUNCATED
        earlier_checks_pass_argument: 'CHK-LEN is the first check and 159 does not equal 160, so no later check is reached.'
      - id: MUT-ALIAS-004
        mutation_ordinal: 3
        enclosing_object: MUTENC02
        enclosure_field_path: 'MUTENC02.alias_descriptor.entry_2.target_field_id'
        enclosure_absolute_byte_offset: 77
        enclosure_offset_derivation: '56 + 21 = 77, where 21 is the zero-based offset inside the alias descriptor published by the predecessor.'
        descriptor_relative_byte_offset: 21
        transformation: 'Change the V alias target from M with field id 0 to S with field id 1 and rebind the enclosing alias digest.'
        base_alias_descriptor_hex: '414c49415376303203000000000002000100020002000200'
        mutated_alias_descriptor_hex: '414c49415376303203000000000002000100020002010200'
        mutated_enclosure_bytes: 160
        retained_digests:
          retained_summary_digest: 50feeffdfbe1e3c747a62c3e334b98619af67c7b6a987ca556115e17b659bee8
        rebound_digests: [retained_alias_digest]
        rebound_digest_values:
          retained_alias_digest: c48503b5b1ebf78845f00fcf5bc9814f30c56e791cf1aa72f6dce429b0bd2699
        resulting_enclosure_sha256: null
        first_failing_check: CHK-ALIAS
        expected_reason_code: '0x0304'
        expected_reason: ALIAS_INTERFACE_INVALID
        earlier_checks_pass_argument: >-
          Length, magic, geometry, and reserved bytes are untouched and the
          bitset and multiplicity table are unchanged, so CHK-SUMDIG passes.
          CHK-ALIAS then fails because entry 2 declares target_field_id 1 with
