  gap_representation_contract:
    closes_finding: REV-GAP-REPRESENTATION-007
    implements_repairs: [1, 5]
    scope_statement: >-
      This block defines the canonical archived representation, refinement
      policy, total ordering, tie rule, and endpoint records for the eta-zero
      diffuse-minus-concentrated gap and for the six per-arm gamma series. It
      is a serialization and ordering contract only and asserts nothing about
      curves, ECDLP, or any sampling law.
    source_quantities:
      parent_records: FITREC02 alpha and beta directed endpoints
      gamma_definition: 'gamma_s = beta + 1/3 exactly'
      gap_definition: 'gap_star[d] = gamma_diffuse_star[d] - gamma_concentrated_star[d]'
      cancellation_lemma: >-
        gap_star[d] = (beta_diffuse[d] + 1/3) - (beta_concentrated[d] + 1/3)
        = beta_diffuse[d] - beta_concentrated[d]. The one-third constant
        cancels exactly, so the gap is computed from beta endpoints only and
        no one-third rounding enters any gap value.
      parent_locators:
        diffuse: 'FITREC02 record ordinal 8193+d'
        concentrated: 'FITREC02 record ordinal 32769+d'
        draw_domain: '[0..8190]'
        count: 8191
      additional_fits: 0
      additional_fits_statement: 'No fit is added, regenerated, replaced, or dropped to build the gap series.'
    exact_interval_arithmetic:
      gap_lower: 'beta_diffuse_lower[d] - beta_concentrated_upper[d]'
      gap_upper: 'beta_diffuse_upper[d] - beta_concentrated_lower[d]'
      rounding: none
      exactness_argument: >-
        The fixed initial box constrains beta to [-2,2], so every beta
        endpoint has magnitude at most 2 and every difference has magnitude at
        most 4. Both operands share the Q63.128 scale, so the difference is
        represented exactly in i192 with no rounding and no overflow.
      width_bound_derivation: >-
        width(gap[d]) = width(beta_diffuse[d]) + width(beta_concentrated[d]).
        Each parent width is strictly below 2^-120 by the frozen fit
        criterion, so width(gap[d]) is strictly below 2^-119.
      frozen_admissible_width_bound: '2^-119'
      width_violation_reason_code: '0x0505'
    refinement_policy:
      adaptive_refinement_passes_permitted: 0
      rationale: >-
        Adaptive refinement triggered by an ambiguous comparison would make
        the archived ordering depend on observed values, which is exactly the
        frozen-quantifier-order violation this apparatus is built to exclude.
        The parent fit criterion already forces every gap width strictly below
        2^-119, so refinement is unnecessary; a gap enclosure that fails the
        bound invalidates rather than triggering a search.
      refinement_budget_operations: 0
      refinement_budget_logical_bytes: 0
    canonical_total_order:
      ordering_key: transformed_gap_lower
      transform: >-
        Take the 24 bytes of gap_lower as i192be two's complement and invert
        bit 7 of byte 0. The transformed bytes compare as unsigned big-endian
        integers in the same order as the signed values they encode.
      primary_comparison: ascending unsigned bytewise over the 24 transformed bytes
      tie_rule: ascending draw_ordinal
      tie_rule_realization: >-
        The sort is a stable least-significant-digit radix sort with 24 passes
        over the 24 transformed key bytes, applied to an input sequence in
        ascending draw-ordinal order. Stability therefore realizes the tie
        rule exactly and no second key is required.
      totality_argument: >-
        Draw ordinals are pairwise distinct over [0..8190], so the pair
        (transformed_gap_lower, draw_ordinal) is a strict total order on the
        8191 records.
      upper_endpoint_participation: none
      declared_consequence: >-
        Two enclosures with equal lower endpoints and different upper
        endpoints are ordered by draw ordinal. This is deterministic, is
        independent of any observed value, and is stated rather than hidden.
      byte_visit_derivation: '8191 keys * 24 key bytes = 196584 byte visits per sorted series.'
      logical_byte_derivation: 'one read and one write per visited byte: 2*196584=393168.'
    per_arm_gamma_series:
      series_count: 6
      series_enumeration: 'arm in [diffuse, concentrated] crossed with eta in [-4, 0, 4]'
      values_per_series: 8191
      ordering_key: transformed_beta_lower
      ordering_key_rationale: >-
        x maps to x + 1/3 is strictly increasing and directed rounding is
        monotone nondecreasing, so ranking by exact beta_lower and ranking by
        the rounded gamma_lower agree except on ties, which the same frozen
        draw-ordinal tie rule resolves identically. Ordering on beta_lower is
        exact and needs no one-third rounding.
      gamma_derivation_scope: 'gamma endpoints are derived only for the twelve selected endpoint records'
      byte_visits_per_series: 196584
      byte_visits_total: 1179504
      byte_visits_total_derivation: '6*196584=1179504.'
      logical_bytes_total: 2359008
      logical_bytes_total_derivation: '6*393168=2359008.'
    directed_one_third_enclosure:
      applies_to: 'derivation of gamma endpoints for the twelve arm-series endpoint records only'
      lower_constant_integer: 'floor(2^128/3) = (2^128-1)/3'
      lower_constant_hex_128bit: '55555555555555555555555555555555'
      upper_constant_integer: 'ceil(2^128/3) = (2^128-1)/3 + 1'
      upper_constant_hex_128bit: '55555555555555555555555555555556'
      divisibility_note: '2 is congruent to -1 modulo 3, so 2^128 is congruent to 1 modulo 3 and (2^128-1)/3 is an exact integer.'
      rule: 'gamma_lower = beta_lower + lower_constant scaled by 2^-128; gamma_upper = beta_upper + upper_constant scaled by 2^-128.'
    type1_selection:
      sample_size: 8191
      one_based_lower_rank: 41
      one_based_upper_rank: 8151
      rank_derivation:
        lower: 'ceil(8191*0.005)=41'
        upper: 'ceil(8191*0.995)=8151'
      zero_based_interpretation: forbidden
      zero_based_violation_reason_code: '0x0504'
      selections_per_series: 2
      arm_series_selections: 12
      arm_series_selection_derivation: '6 series * 2 endpoints = 12.'
      gap_series_selections: 2
      endpoint_read_bytes_per_selection: 24
      arm_series_endpoint_read_bytes: 288
      arm_series_endpoint_read_derivation: '12*24=288.'
      gap_series_endpoint_read_bytes: 48
      gap_series_endpoint_read_derivation: '2*24=48.'
    archived_representation:
      gap_values_file_ordinal: 10
      gap_values_schema_id: gap_value_file_v2
      gap_values_records: 8191
      endpoint_file_ordinal: 11
      endpoint_schema_id: type1_endpoint_record_file_v2
      endpoint_records: 14
      endpoint_record_composition: '12 arm-series endpoint records plus 2 paired-gap endpoint records.'
      archive_increment_bytes: 525360
      archive_increment_derivation: '524288 + 1072 = 525360.'
      archive_total_check: '24037344 + 525360 = 24562704.'
      payload_increment_bytes: 525744
      payload_increment_derivation: '524224 + 1008 + (3840-3328) = 525744.'
      padding_decrement_bytes: 512
      padding_decrement_reason: 'the container index payload grows by 512 bytes inside an unchanged 1048576-byte slot.'
      header_increment_bytes: 128
      header_increment_derivation: '2 new files * 64 header bytes = 128.'
      increment_consistency_check: '525744 - 512 + 128 = 525360.'
    gap_invalidation_conditions:
      - {condition: 'gap count differs from 8191', reason_code: '0x0503'}
      - {condition: 'any gap enclosure width is at or above 2^-119', reason_code: '0x0505'}
      - {condition: 'gap orientation is not diffuse minus concentrated at eta zero', reason_code: '0x0504'}
      - {condition: 'sorted_position is not a permutation of [0..8190]', reason_code: '0x0506'}
      - {condition: 'two records violate the frozen total order or tie rule', reason_code: '0x0506'}
      - {condition: 'any fit is added, dropped, replaced, or regenerated to build the series', reason_code: '0x0503'}
      - {condition: 'zero-based reading of ranks 41 or 8151', reason_code: '0x0504'}

