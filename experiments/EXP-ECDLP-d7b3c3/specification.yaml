        resulting_enclosure_sha256: null
        first_failing_check: CHK-DOMAIN
        expected_reason_code: '0x0302'
        expected_reason: MULTIPLICITY_ENDIAN_OR_DOMAIN
        detection_basis: 'the diffuse multiplicity domain is exactly {0,1} but the first decoded u16be value becomes 0x0100 = 256.'
        earlier_checks_pass_argument: 'the rebound summary digest makes CHK-SUMDIG pass, the alias descriptor and its digest are untouched, so CHK-DOMAIN is the first failure.'
      - id: MUT-TRUNCATE-003
        mutation_ordinal: 2
        enclosing_object: MUTENC02
        enclosure_field_path: 'MUTENC02.multiplicity_u16be_table[7] low byte'
