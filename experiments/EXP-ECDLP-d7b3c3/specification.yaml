        - {entry: 1, alias_id: 1, alias_name: Y, target_field_id: 0, target_encoding_code: 2}
        - {entry: 2, alias_id: 2, alias_name: V, target_field_id: 0, target_encoding_code: 2}
      base_hex: '414c49415376303203000000000002000100020002000200'
      base_sha256: c09bf72aff24512f208159b70cd736f3b9cd96e729f966778dd7e6acb3a0015f
      byte_map_check:
        offset_8_value_hex: '03'
        offset_9_through_11_value_hex: '000000'
        offset_12_through_15_value_hex: '00000200'
        offset_16_through_19_value_hex: '01000200'
        offset_20_through_23_value_hex: '02000200'
        reconstruction: 'concatenating 414c494153763032, 03, 000000, 00000200, 01000200, and 02000200 reproduces the published 24 base bytes exactly.'
      validity_rule: >-
        Every entry must declare target_field_id 0 and target_encoding_code 2,
        alias_count must be 3, alias_id values must be 0, 1, 2 in that order,
        and all reserved bytes must be zero. Any other parse is
        ALIAS_INTERFACE_INVALID.
    frozen_first_error_check_sequence:
      purpose: >-
        The predecessor listed precedence classes but not an executable check
        order, so two conforming enclosures could reach different first
        errors. This ordered list makes the first error a function of the
        bytes alone.
      checks:
        - {index: 1, id: CHK-LEN, test: 'enclosure length equals 160', reason_code_on_failure: '0x0303'}
        - {index: 2, id: CHK-MAGIC, test: 'magic equals MUTENC02 and schema_version equals 2', reason_code_on_failure: '0x0201'}
        - {index: 3, id: CHK-GEOM, test: 'bitset_bytes equals 1, multiplicity_bytes equals 16, alias_descriptor_bytes equals 24', reason_code_on_failure: '0x0202'}
        - {index: 4, id: CHK-ZERO, test: 'all reserved and slot-padding bytes are zero', reason_code_on_failure: '0x0203'}
        - {index: 5, id: CHK-SUMDIG, test: 'retained_summary_digest equals SHA-256 of the CSUMDAT2 frame recomputed from arm, bits, cluster, bitset, and multiplicity table', reason_code_on_failure: '0x0301'}
        - {index: 6, id: CHK-ALIAS, test: 'alias descriptor parses and satisfies the ALIASv02 validity rule', reason_code_on_failure: '0x0304'}
        - {index: 7, id: CHK-ALIASDIG, test: 'retained_alias_digest equals SHA-256 of the 24 alias descriptor bytes', reason_code_on_failure: '0x0205'}
        - {index: 8, id: CHK-DOMAIN, test: 'every decoded u16be multiplicity lies in the arm domain and agrees with the bitset', reason_code_on_failure: '0x0302'}
        - {index: 9, id: CHK-XDEC, test: 'independent reconstruction agrees root-for-root on S and M', reason_code_on_failure: '0x0305'}
      determinism_statement: >-
        Checks run in this exact index order and the apparatus stops at the
        first failure. The first reason code is therefore a function of the
        enclosure bytes only.
    deterministic_mutations:
      - id: MUT-BIT-FLIP-001
        mutation_ordinal: 0
        enclosing_object: MUTENC02
        enclosure_field_path: 'MUTENC02.success_bitset[0]'
        enclosure_absolute_byte_offset: 32
        transformation: 'Flip bit 7 of the success bitset byte, changing a0 to 20.'
        base_byte_hex: a0
        mutated_byte_hex: '20'
        mutated_enclosure_bytes: 160
        retained_digests:
