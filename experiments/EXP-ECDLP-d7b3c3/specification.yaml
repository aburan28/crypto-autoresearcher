      - No hard wall, CPU, RSS, shard, operation, logical-I/O, archive, or scope cap is crossed.
    claim_supported: >-
      At most, a separately authorized future valid run would certify this
      deterministic apparatus on this one planted fixture. No ECDLP claim, no
      security claim, and no novelty claim follows from any outcome.

  falsification_criterion:
