  stopping_rules:
    - Stop before materialization on any S0 compiler, fixture, path, schema, budget, or residual failure.
    - Stop before estimation on any seed, rank, digest, decoder, alias, mutation, artifact-comparison, exact-count, or summary mismatch.
    - Stop and classify invalid on the first hard wall, CPU, RSS, shard, operation, logical-I/O, archive, padding, or convergence cap hit.
    - Never stop early for a favorable mean, slope, gamma, gap, interval, or mutation outcome.
    - Execute all 8191 draws in every admitted arm-eta cell or classify invalid.
    - Construct exactly 8191 eta-zero gap values by matching existing arm fit records on draw ordinal; add no fit.
    - Perform zero adaptive interval-refinement passes; a width failure invalidates instead of triggering a search.
    - Emit no stdout or stderr byte in S4, S5, or S6.
    - Write no byte in S6.
    - No later stage may run after a blocking control fails.
    - A timeout, crash, resource exhaustion, or implementation failure stops infrastructure work only and has no ECDLP interpretation.

  invalidation_rules:
    - A missing, extra, duplicate, malformed, whitespace-bearing, wrong-length, or non-prefix-free key invalidates.
    - A duplicate rank within a declared unique stream invalidates.
    - A wrong enum, endian, magic, version, record count, record width, order, path, padding byte, digest, or index row invalidates.
    - Any encoded multiplicity channel beyond M, or any claim that X, Y, and V are independently decoded, invalidates scope.
    - Any mismatch between a regenerated cluster rank or accepted index and its archived artifact invalidates.
    - Any accepted mutation, alternate first check, or alternate first rejection reason invalidates.
    - Any estimator other than the fixed aggregated binomial objective, or any binomial sampling-law inference, invalidates.
    - Any imputed, dropped, replaced, capped, winsorized, or nonconverged fit or draw invalidates.
    - Any gap other than diffuse minus concentrated at the same draw ordinal and eta zero invalidates.
    - Any gap enclosure that is not an exact beta difference, or whose width reaches 2^-119, invalidates.
    - Any violation of the frozen gap total order, tie rule, sorted-position permutation, or zero-refinement policy invalidates.
    - Any zero-based interpretation of Type-1 ranks 41 and 8151 invalidates.
    - Any stdout or stderr byte emitted by S4, S5, or S6 invalidates.
    - Any provenance content forbidden by the provenance scope rule invalidates.
    - Any artifact attesting a fact about itself or about a later stage invalidates.
    - Any byte written by S6 invalidates.
    - Any resource, archive, artifact-coverage, write, read, or padding residual different from zero invalidates.
    - Any curve, scalar, selector, point, isomorphism model, signed-y, ECDLP, attack, speedup, or status artifact invalidates scope.
    - Timeout, crash, resource exhaustion, or implementation failure is infrastructure evidence only.

