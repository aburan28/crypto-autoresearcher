  canonical_binary_contract:
    integer_encoding: unsigned_big_endian_unless_i8_i192_or_i256_is_named
    signed_integer_encoding: twos_complement_big_endian
    fixed_point_encoding:
      name: Q63.128
      container: i192be
      total_bits: 192
      sign_bits: 1
      integer_bits: 63
      fraction_bits: 128
      unit_in_last_place: '2^-128'
      exactness_rule: >-
        Addition and subtraction of two Q63.128 values whose magnitudes are at
        most 2^62 are exact in i192 and perform no rounding. Directed rounding
        is required only where a value not representable in Q63.128 is
        introduced, and every such site is named explicitly in this record.
    path_encoding: ASCII_POSIX_relative_no_dot_segments_no_symlinks
    common_file_header:
      header_bytes: 64
      fields:
        - {offset: 0, bytes: 8, type: ASCII, name: magic}
        - {offset: 8, bytes: 2, type: u16be, name: schema_version, required_value: 2}
        - {offset: 10, bytes: 2, type: u16be, name: header_bytes, required_value: 64}
        - {offset: 12, bytes: 4, type: u32be, name: record_bytes}
        - {offset: 16, bytes: 8, type: u64be, name: record_count}
        - {offset: 24, bytes: 8, type: u64be, name: payload_bytes}
        - {offset: 32, bytes: 32, type: bytes, name: payload_sha256}
      digest_rule: SHA-256 over exactly payload_bytes bytes after the header
      padding_rule: >-
        Bytes after header plus payload through exact_file_bytes must all be
        0x00. Padding is never hashed by payload_sha256 but is included in the
        whole-file SHA-256 recorded by the index.
      length_rule: '64+payload_bytes+padding_bytes=exact_file_bytes=maximum_slot_bytes.'
    canonical_orders:
      arm: [diffuse, concentrated]
      arm_enum: [0, 1]
      bits: [18, 21, 24, 27, 30]
      eta: [-4, 0, 4]
      cluster: '[0..31]'
      root: '[0..8191]'
      draw: '[0..8190]'
      position: '[0..31]'
      stream_order: arm_then_bits_then_cluster_then_root
      bootstrap_order: arm_then_eta_then_bits_then_draw_then_position
      fit_order: >-
        For each arm in enum order and eta in numeric order, serialize the
        point fit first, followed by draw 0 through 8190. Record ordinal is
        ((arm_enum*3+eta_index)*8192)+(draw+1), where point uses draw=-1 and
        therefore offset 0.
      fit_ordinal_locators:
        eta_index: {'-4': 0, '0': 1, '4': 2}
        diffuse_eta_zero_draw_d: '(0*3+1)*8192+(d+1)=8193+d for d in [0..8190], giving ordinals 8193 through 16383.'
        concentrated_eta_zero_draw_d: '(1*3+1)*8192+(d+1)=32769+d for d in [0..8190], giving ordinals 32769 through 40959.'
        note: >-
          The two parent fit ordinals of every gap record are computed from
          these closed forms and are therefore not stored in the gap record.

