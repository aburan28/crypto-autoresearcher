  # ---------------------------------------------------------------------------
  # DEFINITIONS USED BELOW (restating the specification and Lemma 2B)
  # ---------------------------------------------------------------------------
  definitions:
    traces: >-
      For an instance u at a regime-B cell, its own elimination (the
      specification's column-major rule) yields T_strict(u) = ((p_k^u,
      c_k^u))_{k < L_u} with L_u = rank_66(u), and T_ops(u) = ((p_k^u, c_k^u,
      X_k^u)). X_k^u is the set of unused rows other than p_k^u that are
      nonzero at c_k^u in u's state before step k.
    first_divergence_index: >-
      For a target t and reference r: k = the first index at which T_strict(t)
      and T_strict(r) differ. If one is a proper prefix of the other, k = the
      shorter length (the Stage-1 f_div definition, unchanged). S_k = the
      target's state after its first k steps.
    lemma_2B_state: >-
      H-CERTBIN-b20d4e TRACE STATE: if T_strict(t) and T_strict(r) agree on
      steps < k, the two states before step k are the same rational functions
      of x_R, evaluated at x_t and x_r respectively. In particular, the entry
      of unused row i at column c_k^r in S_k is
      E_{i,k}(x) = det M_66(x)[{p_0..p_{k-1}, i}, {c_0..c_{k-1}, c_k}] /
      Delta_k(x), and the pivot entry is e_k(x) = Delta_{k+1}(x) / Delta_k(x).
      These are Schur complements; there are no signs in characteristic 2.
    reference_coincidental_zero: >-
      An entry function E_{i,k} that is NOT identically zero but vanishes at
      the reference's x_r. The target sees a nonzero where the reference saw
      zero. This is a property of the reference point alone.

  # ---------------------------------------------------------------------------
  # RULING 1 -- divergence classification (issues 1 and 7)
  # ---------------------------------------------------------------------------
  ruling_1_classification:
    the_defect: >-
      specification object.regime_B.divergence_classification lists
      ZERO-PIVOT, COLUMN, ROW-ORDER and PREFIX with no precedence. (a)
      COLUMN and PREFIX can hold together. (b) No type covers a target whose
      step k lies at a column c_k^t < c_k^r that the reference passed
      without a pivot (issue 7). At that column none of the three state
      conditions at c_k^r need hold. The rule is therefore neither a
      function nor total.
    derivation_that_the_overlap_is_the_typical_case_at_l5: >-
      At l = 5, Lemma B-S (c) and C-RANKB give rank_66 = 2278 = C for an
      unsatisfiable reference. Its trace therefore has exactly one step per
      column, and c_k^r is the k-th column of the declared order. For a
      satisfiable target, R_66 = I_{<=66}. So the target's non-pivot columns
      are exactly the standard monomials of its solution set in the column
      order (descending degrevlex, x_1 > x_2, constant last). S_3 is
      symmetric in (x_1, x_2), and the dominant satisfiable cases are s = 1,
      a solution (a, a), and s = 2, the pair (a, b), (b, a) with a != b.
      For s = 1 the standard set is {1}. For s = 2 the two points have
      distinct x_2-coordinates, so the standard set is {x_2, 1}. In both
      cases these are the LAST s columns. A satisfiable target that matches
      the reference up to its first standard monomial therefore stops
      pivoting there. Its T_strict is a PROPER PREFIX of the reference's,
      and at c_k^r no unused row is nonzero, which is the COLUMN condition.
      The overlap is what C3 PREDICTS for a well-behaved satisfiable target,
      not an edge case. This derivation uses no dev value.
    first_match_rule: >-
      BINDING. Apply the rules in order. The FIRST rule that matches gives
      the type.
      R0 MATCH: T_strict(t) = T_strict(r). No divergence.
      R1 PREFIX: L_r = k < L_t. The REFERENCE's trace is a proper prefix of
         the target's: the target pivots after the reference's last step.
      R2 EXTRA-PIVOT: L_r > k, L_t > k and c_k^t < c_k^r. The target pivots
         at a column the reference passed without a pivot (issue 7).
      R3 COLUMN: L_r > k and no unused row of S_k is nonzero at c_k^r.
         Also set prefix_flag = (L_t = k), meaning the TARGET's trace is a
         proper prefix of the reference's.
      R4 ZERO-PIVOT: L_r > k and the entry of S_k at (p_k^r, c_k^r) is 0.
         Some unused row is then nonzero at c_k^r, because R3 did not match.
      R5 ROW-ORDER: L_r > k, the entry at (p_k^r, c_k^r) is nonzero, and an
         unused row of smaller original index is nonzero at c_k^r.
      R6 UNCLASSIFIED: none of the above. This is unreachable (next item)
         and is a C-CLASS failure.
    derivation_that_the_rule_is_total: >-
      Suppose R0-R2 fail and L_r > k. If L_t = k, the target found no
      nonzero unused row at any column after c_{k-1}, including c_k^r, so R3
      matches. If c_k^t > c_k^r, the column-major target passed c_k^r in
      state S_k without a pivot, so R3 matches. If c_k^t = c_k^r, some unused
      row is nonzero there and p_k^t != p_k^r. If the entry at p_k^r is 0, R4
      matches. Otherwise p_k^t, the smallest-index nonzero row, precedes
      p_k^r, and R5 matches. Every other combination was excluded by R0-R2.
      R6 is therefore unreachable in a correct implementation.
    why_COLUMN_state_first_answers_the_P_GPU_question: >-
      The P-GPU question that E3 (C3, MB5, DB-5) asks at a deciding cell is
      this: does the learned schedule run unchanged on a satisfiable attempt
      up to the point where satisfiability shows, and does it diverge exactly
      there, at the target's first standard monomial, where the column is
      empty? That is a statement about the STATE at the divergence step.
      Lemma 2B classifies first divergences by exactly that state (ZERO-PIVOT,
      ROW-ORDER, COLUMN). The H-CERTBIN-b20d4e TRACE STATE paragraph states,
      before any data, that for a satisfiable target at l = 5 "this [COLUMN]
      is a standard monomial". MB5 counts "a COLUMN divergence at the
      target's own first non-pivot column". PREFIX, as the specification used
      it, describes the SHAPE of the trace after the divergence: whether the
      reference has more steps. Whether the target's remaining standard
      monomials are the last columns is a fact about the column order. It is
      not information about the attempt or about replay behaviour. Under a
      PREFIX-first reading, the derivation above makes every s <= 2
      satisfiable target that behaves exactly as C3 predicts count AGAINST
      E3. DB-5 would then be settled by where the standard monomials fall in
      the order, not by replay behaviour, and would not test C3 at all. So
      the state condition wins. PREFIX is kept only for R1, where the
      reference has no step k and so no state condition at c_k^r exists (the
      executor's proposal, adopted).
    e3_stays_falsifiable: >-
      Under this ruling, a satisfiable target still counts AGAINST E3 when
      its first divergence is ZERO-PIVOT or ROW-ORDER. That is, the fixed
      schedule breaks before the target's first standard monomial. A
      satisfiable target is a root of Delta_C, the minor on all of the
      reference's pivots, because its rank is C - s. Whether that root first
      shows as a zero pivot with another row covering the column, or as an
      empty column, is a real empirical question. At l = 5 there are 3276
      rows for 2278 columns, so many unused rows can cover a column.
    direction_disclosure: >-
      Against the rejected PREFIX-first reading, this ruling makes "E3 HOLDS"
      REACHABLE rather than foreclosed. That direction favours the hypothesis,
      and it is disclosed here as such. The executor saw dev values under
      both readings before this ruling. The ruling rests on the pre-data texts
      cited above and on the derivation, and would be the same if the dev
      values had been reversed. The review round must check this claim (see
      review_obligations).
    rejected_reading_reported: >-
      REPORTING ONLY. For each l = 5 cell and unsat reference, cell-summary.json
      also reports the E3 fraction under the rejected PREFIX-first reading,
      labelled "E3_prefix_first_sensitivity". It feeds no decision rule,
      and no record may read a verdict from it.
    consequences_for_other_rules: >-
      ZERO-PIVOT is disjoint from both the prefix case and EXTRA-PIVOT, so
      the DB-3 break count differs from the v1 text only where v1 could have
      mislabelled an EXTRA-PIVOT (R2) as ZERO-PIVOT. At l = 5 against an
      unsatisfiable reference, R1 and R2 are impossible, because that trace
      has one step per column and maximal length. So E3 is always read from
      R3, R4 or R5 there. EXTRA-PIVOT and PREFIX never count as E3 successes.
      EXTRA-PIVOT, like ROW-ORDER, arises from a reference coincidental zero
      (here at a column the reference skipped). It is counted in MB2 and
      lowers T_strict retention exactly as in v1, and it is not a break (MB3).

  # ---------------------------------------------------------------------------
  # RULING 2 -- C-REPLAYB, INV-5 and K_B (issue 2)
  # ---------------------------------------------------------------------------
  ruling_2_replay:
    the_false_premise: >-
      specification C-REPLAYB asserts that "a matched T_strict with matching
      state implies" the fixed-schedule replay survives every step and is
      schedule-valid. Lemma 2B's "identical state" means identical RATIONAL
      FUNCTIONS. It does not mean identical zero patterns. T_strict fixes
      (p_k, c_k). The replay also fixes X_k^r, the reference's set of nonzero
      unused rows at c_k, and that set depends on which entry functions
      vanish at x_r.
    proposition_R: >-
      (Derived here. The review round must check it.) Let T_strict(t) =
      T_strict(r). Then the fixed-schedule replay of (p_k^r, c_k^r, X_k^r) on
      t, with multipliers from t's current entries, is schedule-valid at
      every step iff X_k^t is a subset of X_k^r for every k. In that case the
      replay reproduces t's own elimination: its multipliers are t's own on
      X_k^t and 0 on X_k^r minus X_k^t, and it survives every step. Otherwise,
      let k* = min{k : X_k^t not a subset of X_k^r}. The replay equals t's
      own elimination before k*, has no zero pivot before k*, and is
      schedule-invalid at k*, where the rows in X_{k*}^t minus X_{k*}^r stay
      nonzero at c_{k*}.
      Proof, by induction on k. The states coincide before k, so t's own
      multipliers M_t[j, c_k] / M_t[p_k, c_k] and the replay's are the same
      numbers. They are zero exactly off X_k^t. T_ops(t) = T_ops(r) is
      sufficient for validity but not necessary.
    attribution_to_the_reference: >-
      A row i in X_k^t minus X_k^r, with k <= k*, is an unused row whose entry
      function E_{i,k} is nonzero at x_t and zero at x_r. That is a reference
      coincidental zero at a row with i > p_k^r. The same kind of zero at
      i < p_k^r is exactly a ROW-ORDER divergence, and at a skipped column it
      is EXTRA-PIVOT. One such (k, i) makes the replay schedule-invalid for
      every target that is not itself a root of E_{i,k}, which is almost all
      of them. Under HEUR-CERTBIN-TS2B's own random-polynomial model, the
      expected number of such zeros per reference is about (number of
      non-identically-zero entry functions over all steps and unused rows) /
      2^n. The specification never counted that quantity, and nothing makes
      it small. So v1's C-REPLAYB fails for an ordinary reference, not a rare
      one. Under v1's INV-5 that would void DB-3, DB-4 and DB-11 at most
      cells, although DB-3 and DB-11 read ZERO-PIVOT first divergences of
      the targets' OWN eliminations, which C-BREAK verifies independently,
      and never read the replay.
    K_B_has_the_same_defect: >-
      specification K_B evaluates "the fixed-schedule replay" at probe points
      to count the pivots whose entry varies. HEUR-CERTBIN-TS2B DEFINES K_B
      through e_k(x) = Delta_{k+1}(x) / Delta_k(x). By proposition R, the
      ops replay at a probe computes e_k only up to the probe's first k* for
      a reference with a coincidental zero. After k* its pivot entries are
      not Schur complements. And if "breaks the schedule" is read as schedule
      invalidity, every probe is skipped and K_B cannot be estimated. So a
      property of the reference would silently change or remove the DB-3
      Poisson mean.
    ruling: >-
      See changes C-4 to C-7. (i) K_B is computed by the T_STRICT-GUIDED
      computation. This follows the reference's pivot sequence with full
      clearing and is the computation that yields HEUR-CERTBIN-TS2B's e_k by
      definition. For a reference with no coincidental zero it coincides with
      the v1 replay. (ii) C-REPLAYB is replaced by a control whose failure
      conditions are exact identities an implementation must satisfy:
      guided = own on matched targets, replay outcome = proposition R's
      prediction, and each attributed reference zero verified by the
      independent determinant module. A genuine implementation defect
      therefore still voids DB-3, DB-4 and DB-11 through INV-5, as in v1.
      (iii) Schedule invalidity that is predicted and verified is a property
      of the reference. It is recorded as data and is never a failure or a
      void.
    direction_disclosure: >-
      This ruling makes voids rarer. It does not move any verdict of DB-3,
      DB-4 or DB-11 in either direction, because those rules read counts the
      replay never enters. For a reference with no coincidental zero, K_B is
      unchanged. For one with such a zero, K_B becomes the quantity TS2B
      names instead of an ill-defined one. The replay invalidity is NOT
      hidden: it stays measured (the C-REPLAYB v2 data items, T_ops retention
      and the replay secondary metric), and it bears on how a strict-ops GPU
      replay would have to be masked. This ruling does not depend on how many
      references or targets were affected in dev.

  # ---------------------------------------------------------------------------
  # CHANGES (binding; numbered; additive)
  # ---------------------------------------------------------------------------
  changes:
    - id: C-1
      issue: (1), (7)
      target: specification object.regime_B.divergence_classification
      change: >-
        Replaced by ruling_1_classification.first_match_rule (R0-R6), in
        both regimes' regime-B classification and against every reference
        (unsat, sat and modal). Each per-target record in
        targets-<cell>-B-<family>.jsonl.gz carries: type (one of MATCH,
        PREFIX, EXTRA-PIVOT, COLUMN, ZERO-PIVOT, ROW-ORDER, UNCLASSIFIED),
        prefix_flag, k, the divergence column (c_k^r for R3-R5, c_k^t for R1
        and R2) and its degree, and the target's own first non-pivot column.
        MB2 counts all six non-MATCH types and the prefix_flag count, per arm
        and reference.
    - id: C-2
      issue: (1)
      target: specification metrics MB5; decision rule DB-5 (input only)
      change: >-
        A satisfiable target t is an E3 SUCCESS against an unsat reference r
        at an l = 5 cell iff its first divergence has type COLUMN (R3) AND
        c_k^r equals t's own first non-pivot column. The prefix_flag does not
        enter. Every other type, and MATCH, is a non-success. (MATCH is
        impossible at l = 5 for s >= 1, because rank_66 = 2278 - s < L_r.)
        The E3 fraction is successes over the pooled E3 arm of C-9. The DB-5
        threshold of 0.95 is unchanged. The rejected-reading sensitivity is
        reported as ruling_1_classification.rejected_reading_reported
        describes.
    - id: C-3
      issue: (1), (7); new failure condition
      target: specification controls (new C-CLASS); invalidation_rules (new INV-10)
      change: >-
        NEW CONTROL C-CLASS. What it checks: (i) no first divergence of any
        regime-B target against any reference is UNCLASSIFIED; (ii) at the
        l = 5 cells against every UNSAT reference, no divergence is PREFIX or
        EXTRA-PIVOT, every COLUMN divergence belongs to a target with
        s >= 1, and its column equals that target's own first non-pivot
        column; (iii) prefix_flag is set only on COLUMN divergences. Items
        (i)-(iii) are consequences of R0-R6, Lemma B-S (c) and the column-
        major rule (ruling_1_classification). fails_if: any violation. That
        is an implementation defect in the classifier or the elimination.
        NEW INV-10: a C-CLASS failure on any curve-algebra family (F-S3,
        F-SAT, F-PLANT, F-RANDX) voids MB2, MB3 and MB5 and DB-3, DB-4, DB-5
        and DB-11 for the cell. A failure confined to F-NULLB or F-AFFB
        voids that family's regime-B metrics and DB-8 and M3 for the cell.
        If C-RANKB or C-DELTA also fails for the same family and cell
        (including their null-family computation under C-12), INV-4 or C-12
        takes precedence (INVALID pending adjudication).
    - id: C-4
      issue: (2)
      target: specification controls C-REPLAYB (replaced)
      change: >-
        C-REPLAYB (v2). On the 50 lowest-idx T_strict-matched F-S3 unsat-arm
        targets per unsat reference, plus each reference itself:
        (a) GUIDED = OWN. The T_strict-guided computation (C-6) reproduces
        the instance's own-elimination pivot entries exactly (F_{2^n}
        equality) at every step, and its cleared-row sets equal the
        instance's own X_k.
        (b) REPLAY = PREDICTION. The v1 fixed-schedule replay, which is
        UNCHANGED (reference (p_k, c_k, X_k^r), target multipliers), is
        schedule-valid at every step iff X_k^t is a subset of X_k^r for all
        k. When it is not, its first schedule-invalid step equals
        k* = min{k : X_k^t not a subset of X_k^r}, computed from the two op
        logs. It has no zero pivot before k*, and its pivot entries before
        k* (all of them, if k* does not exist) equal the target's own.
        (c) ATTRIBUTION VERIFIED. For each distinct (r, k, i) with i in
        X_k^t minus X_k^r for some matched t (all of them, or the 20 with the
        smallest k per reference if there are more, with the total count
        recorded), the independent determinant module of C-BREAK finds the
        minor det M_66(x)[{p_0..p_{k-1}, i}, {c_0..c_k}] equal to 0 at x_r
        and nonzero at the lowest-idx matched target exhibiting it.
        (d) DATA, NEVER A FAILURE. For each reference: the list of verified
        coincidental zeros (k, i, c_k), the number of matched targets on
        which the replay is schedule-valid, the distribution of k*, and the
        label "X-ZERO REFERENCE" when the list is nonempty. The label is
        descriptive and does not imply non-genericity. It feeds no decision
        rule and does not alter DB-3's REFERENCE NON-GENERIC label, which
        still reads ROW-ORDER only.
        fails_if: any violation of (a), (b) or (c). A replay that is schedule-
        invalid exactly as (b) predicts, with its zeros verified by (c), is
        NOT a failure. The v1 fails_if ("any failure" of survival or
        schedule validity) is withdrawn.
    - id: C-5
      issue: (2)
      target: specification invalidation_rules INV-5 (replaced)
      change: >-
        INV-5 (v2): a C-BREAK failure, or a C-REPLAYB (v2) failure under (a),
        (b) or (c), voids DB-3, DB-4 and DB-11 for the cell. Schedule
        invalidity of the fixed replay that C-REPLAYB (v2) (b) predicts and
        (c) verifies is a property of the reference. It is recorded under (d)
        and is never a failure, never a void and never evidence about
        HEUR-CERTBIN-TS2B.
    - id: C-6
      issue: (2), (6)
      target: specification object.regime_B.K_B
      change: >-
        T_STRICT-GUIDED COMPUTATION of reference r at a point x: start from
        M_66(x). For k = 0..L_r - 1, let e_k(x) be the entry at
        (p_k^r, c_k^r). If e_k(x) = 0, stop and record that x breaks the pivot
        sequence at k. Otherwise, for EVERY unused row i != p_k^r that is
        nonzero at c_k^r, set row_i <- row_i + (M[i, c_k^r] / e_k(x)) *
        row_{p_k^r}, then mark p_k^r used. By Lemma 2B, this yields
        e_k(x) = Delta_{k+1}(x) / Delta_k(x) at every completed step.
        K_B = the number of k at which e_k is not identical across the
        reference and the 3 accepted probes. A probe is SKIPPED iff its
        guided computation stops, that is, iff the probe is a root of some
        Delta_{k+1}. Each draw counts toward the limit of 10.
        PROBE STREAM (issue 6): the specification's S_probe = 2026092420098
        governs. HEUR-CERTBIN-TS2B's parenthetical "from S_selftest" is an
        estimation detail in an immutable record. It is superseded for this
        experiment, and S_selftest is reserved for the pilot and self-tests.
        ONE generator, PCG64(S_probe), is instantiated ONCE and consumed in
        cell order c = 1, 2, 3, 4 (the seeds.formula cell index), within a
        cell in reference order U1, U2, U3, with at most 10 draws per
        reference. Draws map to field elements by the implementation's
        uniform F_{2^n} element routine used for F-RANDX's uniform x
        (declared in trial-plan-v1.json before any frozen draw). The draw
        index of every probe, and the stream position at each cell start,
        are recorded in regimeB-breaks-<cell>.json so that --resume
        regenerates the sequence exactly. This DEPARTS from the executor's
        proposal of a fresh PCG64(S_probe) per cell. The reason is the
        specification's seed_rule "none is re-seeded": a per-cell re-seed
        re-seeds one stream four times and gives both n = 17 cells identical
        probe integers. The sequence is defined by cell order whatever the
        execution order.
    - id: C-7
      issue: executor minor item on DB-4
      target: specification decision rule DB-4 (the K_B clause only)
      change: >-
        K_B(cell) in "CONSISTENT WITH (K_B(19) / K_B(17)) / 4" is the SUM of
        K_B over the cell's unsat references. Derivation: under
        HEUR-CERTBIN-TS2B, the expected pooled distinct breaking count is
        about N_unsat * sum_r K_B,r / 2^n, with overlaps second order. So the
        predicted rate ratio is (sum_r K_B,r(19) / sum_r K_B,r(17)) *
        2^17 / 2^19. When both cells have three unsat references this equals
        the executor's proposed mean. Under a reference shortfall, only the
        sum predicts the pooled count. A reference whose K_B is not estimable
        (every probe skipped within 10 draws) makes the K_B clause "not
        evaluable" at that l. The DECAYS / NON-DECAYING / UNRESOLVED part of
        DB-4 does not use K_B and is unaffected.
    - id: C-8
      issue: (3)
      target: specification counts.sat_arm_rule; F-PLANT sampling (by extension)
      change: >-
        TERMINATION BY FINITE POPULATION. Before F-SAT's scan, the executor
        ENUMERATES E_SAT(cell). This is the set of x_R that the F-SAT scan
        could ever keep: non-degenerate subgroup abscissae with s >= 1, not
        a reference and not an F-S3 target. It is computed exhaustively with
        the SAME satisfiability and subgroup tests the scan uses (the
        enumeration route is fixed by C-17).
        The scan of S_sat stops at N_SAT kept OR when every member of
        E_SAT(cell) has been kept, whichever comes first. The same rule
        applies to F-PLANT with E_PLANT(cell) = the set of z the Stage-1
        F-PLANT rule could ever keep (z = x(P_1 + P_2), P_1 != +-P_2, z not in
        V, not an F-S3 target or reference). cells.json records |E_SAT|,
        |E_PLANT|, the draws and rejections of each scan, and whether it
        stopped by exhaustion. The enumeration is a deterministic function of
        the cell's curve and V and draws no stream. At n = 19 it follows the
        phase-1 curve draw. When a scan stops by exhaustion, its rejection
        count is not an estimate of 1 - P_sat, because duplicates dominate
        late draws. P_sat (secondary) is then reported EXACTLY as
        |{non-degenerate satisfiable subgroup abscissae}| / |{non-degenerate
        subgroup abscissae}| from the enumeration, beside the F-S3 estimate.
        The rule does not use the value 63 or 254, and it is the same for
        every population size.
    - id: C-9
      issue: (3)
      target: specification MB5 / DB-5 input arm; SR-3 reading; DB-7 reading; attention_contract.inconclusive_decision reading
      change: >-
        (i) The E3 arm at an l = 5 cell is the UNION BY x_R of the F-SAT and
        F-PLANT targets. A regime-B instance depends on x_R only, so an x_R
        in both arms is one target and is counted once (DEC-20260924-8e2f47
        R-D, OBJ-4: distinct measurements counted). Each family's own
        fraction is also reported. The F-PLANT population contains every
        satisfiable subgroup abscissa of the form x(P_1 +- P_2) with
        P_1 != +-P_2, which is most of what F-SAT samples. It misses only
        targets that are satisfiable solely through a doubling. Without this
        rule the pooled arm would double-count the overlap.
        (ii) SR-3 applies per arm, unchanged. An arm that stops by exhaustion
        below 100 non-degenerate targets is flagged "UNDERPOWERED (POPULATION
        CEILING)". The flag is structural. It is not an infrastructure
        failure, and run 2 (reserved for infrastructure) is not used to
        address it: a re-run would draw from the same population.
        (iii) DB-5 at an l = 5 cell is UNDERPOWERED iff the pooled distinct
        E3 arm has fewer than 100 targets. DB-5 then reports its value
        flagged, and DB-7 at that cell reads "NOT EVALUABLE (E3 arm
        underpowered)", which is the attention_contract's inconclusive
        branch. An F-SAT flag alone, with a pooled arm of 100 or more, does
        not make DB-5 underpowered.
        (iv) Wherever DB-5 is void (INV-10) or DB-2/DB-1 is void, DB-7 at that
        cell reads "NOT EVALUABLE" with the reason. A void or underpowered
        conjunct is never a "failing conjunct" (specification
        falsification_criterion "NOT falsification").
        WHAT THIS DOES AND DOES NOT CHANGE: NO preregistered threshold moves.
        The thresholds 0.95 (E3), 0.9 and 0.5 (DB-1, DB-6, DB-8), 5% and 95%
        (DB-2), 100 (SR-3) and every Poisson, binomial and ratio interval
        are unchanged. Verdict READINGS are clarified in (i)-(iv) only. The
        sample_size_justification sentence "F-SAT + F-PLANT give 400 (C_std)
        or 200 (C_low)" is superseded as a statement of fact at the l = 5
        cells. There the E3 arm is bounded by the cell's finite satisfiable
        population (E_SAT together with E_PLANT), and E3 is measured on most
        or all of it rather than on a sample. ARM POWER DOES CHANGE: the
        pooled arm is smaller than the 400 or 200 the justification assumed.
        DB-5 is still a point-threshold rule on that arm, and its scope is
        that cell's population on one curve and one V.
    - id: C-10
      issue: (4)
      target: specification controls C-TR
      change: >-
        C-TR (v2). On each cell's curve, by enumeration over F_{2^n}:
        (i) RESTATED CHECK, which is the operative one. For every x in x(E),
        meaning x = 0 or Tr(x + A + B / x^2) = 0: x is in x(2E) iff
        Tr(x) = Tr(A). Membership in x(2E) is decided by a point test that
        does not use the trace criterion (a [#E/2]-multiple or halving test on
        a lifted point, as EXP-CERTBIN-3f06d1 x2E_membership).
        (ii) LITERAL COUNT, reported. The v1 statement over all of F_{2^n},
        with its violations split into x(E) and twist abscissae.
        fails_if: any violation of (i). The consequence is unchanged:
        recorded as data, the measured hull used anyway, no invalidation.
        Derivation: the classical halving criterion is a statement about
        POINTS of E. A twist abscissa carries no point of E, so the literal
        form fails at every twist abscissa with Tr(x) = Tr(A). Its count
        carries no instrument information. The x(2E) classification of
        F-RANDX targets uses the three classes of (i): x(2E), x(E) minus
        x(2E), and twist.
    - id: C-11
      issue: (5)
      target: specification counts.modal_rule
      change: >-
        The incorporated Stage-1 modal_reference_rule is itself "per family
        and D" (EXP-CERTBIN-4e92d7), and M3 and DB-8 compare retention_family
        across families. The modal rule therefore applies per regime, cell,
        D AND FAMILY, to every family that has an unsat-arm retention
        statistic (F-S3, F-RANDX, F-AFF, F-NULLF2, F-NULLB, F-AFFB). Each
        family's modal is taken from its own targets 1..100 and scored on its
        targets 101.. only. A family with 100 or fewer non-degenerate test
        targets has no modal score ("not evaluable"), and its retention_family
        is the max over its unsat references. F-S3 is unchanged.
        DIRECTION: a null's retention_family can only rise. M3 ratios can
        only fall, "S_3-SPECIFIC STABILITY" becomes harder to reach and
        "GENERIC STABILITY" easier. This affects secondary verdicts only
        (DB-12).
    - id: C-12
      issue: executor minor item on C-DELTA / C-RANKB scope
      target: specification controls C-DELTA, C-RANKB; INV-4 scope
      change: >-
        The FAILURE scope of C-DELTA and C-RANKB stays the curve-algebra
        families. C-DELTA says so explicitly, and C-RANKB inherits that scope.
        Lemma B-S uses only that g_0 has degree 4 and, for (b) and (d), no
        zero on V x V. It therefore applies to F-NULLB and F-AFFB too. Both
        checks are COMPUTED on every F-NULLB and F-AFFB instance. A mismatch
