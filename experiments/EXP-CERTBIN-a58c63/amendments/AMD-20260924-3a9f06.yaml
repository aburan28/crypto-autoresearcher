    - id: C-19
      issue: fold-in B, F-AFF and F-AFFB references
      target: specification null_families_A, null_families_B F-AFFB; counts.reference_rule
      change: >-
        STREAM 01 IS ONE SEQUENCE. Per cell, the c01 generator is instantiated
