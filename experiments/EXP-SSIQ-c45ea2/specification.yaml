experiment:
  id: EXP-SSIQ-c45ea2
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-SSIQ-2efc5c
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  batch_id: null
  batch_id_note: >-
    Deliberately null. Assigning this draft to BATCH-006 would imply a dispatch
    decision only the Coordinator may make.
  title: >-
    Anchor the descent estimator to the forced value it already contains:
    exact hitting times, a four-rung bias ladder, two matched nulls, a planted
    positive control, and a calibrated replacement for the underived
    trapped-fraction cut -- all on committed data, with zero new search

  objective: >-
    Decide, at zero new search cost and on artifacts already committed, whether
    lever L4's descent instrument can support the readings the campaign has
    taken from it. Specifically: (1) compute the mean hitting time of the
    F_p-rational locus EXACTLY on each of the four committed graphs and test the
    forced value gamma_random = 1/2; (2) measure the frozen estimator's residual
    against that exact value; (3) measure the residual's dependence on the true
    exponent over a four-rung ladder with two constructions per rung; (4) run two
    matched nulls (free permutation and target-pinned permutation) and a
    planted-gradient positive control; (5) derive and measure the escape ratio
    that replaces the underived trapped_fraction > 0.5 cut; and (6) report the
    corrected greedy exponent IF AND ONLY IF the ladder licenses a correction.
    THIS CONTRACT ADVANCES THE GOAL'S DECLARED next_action -- it repairs GD-9's
    dead control with a rule stated before it is evaluated, and it supplies the
    derivation GD-8's inherited threshold has never had -- AND IT OPENS A LANE
    THE next_action DOES NOT CONSIDER: that the estimator producing every number
    in the lane has a forced-value anchor sitting inside the same run, never
    exercised.

  what_this_is_not:
    - Not an attack, not an algorithm, and not an exponent claim of any kind.
    - Not evidence about the supersingular isogeny problem. It is evidence about an instrument.
    - Not a status change to RUN-SSIQ-a85692-b, EV-SSIQ-f3ce32, H-SSIQ-36e970 or any other record. That run's terminal CONTROL-FAILURE-VOID label stands and this contract does not seek to lift it.
    - Not a closure of lever L4. A corrected greedy exponent above 1/4 would close only the claim that the current toy measurement shows the descent meeting its own ceiling, at N <= 611, on one estimator.
    - Not a new delta_E search. No new prime and no new label is computed, consistent with this goal's deferral (i).
    - Not a statement about cryptographic scale, and not a route to one -- even a favourable descent measurement needs a cheap delta_E label, whose cost is charged by EXP-SSIQ-a5c0cb and not here.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: that on four supersingular 2-isogeny graphs with
      N in {203, 324, 478, 611}, (a) the exactly computed mean hitting time of
      the F_p-rational locus has a stated exponent; (b) one named estimator has
      a stated residual against that exponent; (c) that residual behaves in a
      stated way across four forced exponents realised by two constructions
      each; (d) two matched nulls and one planted positive control produce
      stated trapped fractions, m_gap values and escape ratios. A run CANNOT
      establish whether greedy descent on delta_E beats a random walk
      asymptotically, cannot move any exponent, cannot close lever L4, and
      cannot support any statement about cryptographic parameters (AGENTS.md
      rule 7).

  scale_relevance:
    tier: toy
    justification: >-
      Every measured quantity is at log2 p <= 13 and N <= 611, spanning a factor
      of three in N. THAT IS THE POINT RATHER THAN A LIMITATION: the contract's
      primary output is a RESIDUAL AGAINST A KNOWN ANSWER, which is meaningful
      at any scale where the known answer applies, whereas an exponent fitted
      over a factor of three is not. If the exact computation shows the forced
      value itself does not apply at these sizes, that is a decisive statement
      about what any exponent measured in this lane can mean, and it is
      pre-registered as an admissible outcome.
    correspondence: >-
      null. Direct construction of the graphs; no correspondence trick is used
      and none is available in this environment.

  environment_facts_measured_this_session:
    numpy: "2.4.6, imports successfully"
    sympy: "absent -- ModuleNotFoundError"
    sage: "absent"
    pari_gp: "absent"
    consequence: >-
      A dense (I - P')h = 1 solve at N <= 611 is trivial under numpy, so the
      exact hitting-time stage is comfortably inside the environment. No stage
      of this contract needs quaternion arithmetic. NO DEPENDENCY MAY BE
      INSTALLED DURING A RUN; a stage that turns out to need one is an
      infrastructure request under AGENTS.md rule 5.

  inputs:
    primes: [2437, 3889, 5737, 7333]
    prime_provenance: >-
      Exactly the four usable_primes_for_fit of
      experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-b/raw-result.json. No
      prime is added or removed.
    expected_graph_sizes: {2437: 203, 3889: 324, 5737: 478, 7333: 611}
    committed_reference_values_read_from_that_artifact:
      gamma_random: 0.4013966802748042
      gamma_greedy: 0.23353930498277403
      m_gap: 0.16785737529203015
      m_gap_ci_lo: -0.4077113485550079
      m_gap_ci_hi: 1.325623864261203
      greedy_median: {2437: 10.0, 3889: 11.0, 5737: 12.0, 7333: 13.0}
      random_median: {2437: 22.0, 3889: 20.0, 5737: 24.0, 7333: 36.0}
      greedy_trapped_fraction:
        2437: 0.8374384236453202
        3889: 0.7222222222222222
        5737: 0.8200836820083682
        7333: 0.851063829787234
      terminal_branch: CONTROL-FAILURE-VOID
      provenance_note: >-
        These values are READ FROM A COMMITTED ARTIFACT whose run carries a
        terminal CONTROL-FAILURE-VOID label. They are INPUTS TO AN INSTRUMENT
        STUDY, not admitted measurements of a mathematical quantity, and no
        conclusion of this contract may treat them otherwise. EV-SSIQ-f3ce32
        governs them.
    ladder_forced_exponents: [0.25, 0.33333333, 0.5, 0.66666667]
    ladder_constructions_per_rung: 2
    null_variants: [NULL-P, NULL-Q]
    bootstrap_resamples: 2000
    master_domain: "EXP-SSIQ-c45ea2/v1"
    seed_derivation_rule: >-
      Every stochastic draw uses SHA-256 over the ASCII byte string
        "EXP-SSIQ-c45ea2/v1" || "|" || label || "|" || decimal(p) || "|" ||
        decimal(counter)
      read big-endian unsigned. Labels are exactly: "null-p", "null-q",
      "planted-target", "ladder-a", "ladder-b", "bootstrap", "random-regular".
      Counters start at 0 and advance by one per digest consumed. The domain
      string carries the run's identity, so a third party reproduces every
      instance bit-for-bit and no change of a numeric seed can silently change
      the instances.
    builder: >-
      experiments/EXP-SSIQ-58b642/implementation/build_isogeny_graph.py at the
      commit recorded in the run manifest. Its sha256 is recorded at setup by
      the Executor; THIS DRAFTING SESSION DID NOT COMPUTE IT and asserts nothing
      about it.
    estimator: >-
      The SAME function object used by the committed run to fit gamma_greedy and
      gamma_random, invoked by import from
      experiments/EXP-SSIQ-58b642/implementation/descent_hitting_time.py (or
      wherever the pre-freeze code reading locates it) with its call site
      recorded. IT MAY NOT BE REIMPLEMENTED: the object under study IS that
      estimator, and a reimplementation would measure a different thing.
    delta_labels: >-
      The real in-session delta_E labels from RUN-SSIQ-a85692-b, with their
      normalisation re-verified against
      experiments/EXP-SSIQ-a85692/implementation/compute_delta_e_v2.py in
      STAGE-1 before any use (GD-6's standing repair).

  independent_variables:
    - labelling arm (real, NULL-P, NULL-Q, planted, ladder rung, random-regular control)
    - forced hitting exponent on the ladder
    - construction realising a given forced exponent
    - prime (equivalently N)

  arms_and_controls:
    treatment: >-
      The real delta_E labelling on each of the four graphs. Greedy descent from
      every vertex; record the full hitting-time distribution, the median, the
      trapped fraction, and the basin-size distribution. Random-walk hitting
      times likewise. Fit gamma_greedy and gamma_random with the frozen
      estimator.
    exact_anchor: >-
      For each graph, solve (I - P')h = 1 restricted to non-target vertices,
      where P is the simple random-walk transition matrix and the target is the
      F_p-rational locus, giving the EXACT mean hitting time per start vertex.
      Fit the exponent of the mean across the four graphs. FORCED VALUE 0.500,
      derived before the run from |target| = Theta(N^{1/2}) and expander mixing.
      THIS STAGE REPLACES A RELAYED CITATION (Pizer, via the frozen source, NOT
      READ) WITH A COMPUTATION, so no conclusion rests on the unread reference.
    measured_null_P: >-
      NULL-P: a uniformly random permutation of the SAME delta_E multiset over
      the SAME vertex set. Label distribution preserved exactly; geometry and
      target location destroyed. FORCED VALUES DERIVED BEFORE THE RUN: hitting
      exponent 1/2; trapped fraction 1 - Theta(N^{-1/2}), predicted in
      [0.88, 0.98]; m_gap 0.000. ALL THREE CAN FAIL.
    measured_null_Q: >-
      NULL-Q: a uniformly random permutation of the delta_E labels with the
      delta = 1 vertices PINNED in place, so the target set is preserved and
      only the gradient is destroyed. THIS IS THE NULL THAT ISOLATES THE
      GRADIENT. FORCED VALUE: m_gap 0.000. A non-zero m_gap on NULL-Q means the
      estimator manufactures a gap from graph structure alone and VOIDS the real
      arm outright, independently of everything else in this contract.
      NULL-P AND NULL-Q ANSWER DIFFERENT QUESTIONS AND MAY NOT BE CONFLATED OR
      POOLED; both are reported separately, always.
    positive_control: >-
      PLANTED-GRADIENT: L(v) = graph distance from v to a planted target set of
      size ceil(N^{1/2}) chosen by the declared seed stream. Greedy descent on
      L reaches the target in at most diam(G) = O(log N) steps BY CONSTRUCTION,
      so gamma_greedy is forced to ~0 and m_gap to ~0.5. PRE-REGISTERED
      THRESHOLD: m_gap >= 0.35 and trapped fraction ~0. IF THE INSTRUMENT DOES
      NOT FIRE HERE IT CANNOT DETECT A DESCENT SIGNAL AND NO NEGATIVE RESULT MAY
      BE REPORTED FOR THE REAL ARM.
    graded_control: >-
      THE BIAS LADDER, four rungs, two constructions per rung. For e in
      {1/4, 1/3, 1/2, 2/3}, plant a target set of size ceil(N^{1-e}) so that the
      random-walk hitting exponent is FORCED to e. Construction A: target chosen
      uniformly at random. Construction B: target chosen as a ball of the
      appropriate size around a random vertex. Both realise the same forced
      exponent through different geometry. REPORT the fitted exponent minus e at
      every rung and every construction, the MONOTONICITY of the residual in e,
      and the A-versus-B disagreement at each rung. A failure localises whether
      the estimator breaks at small exponents (short, discreteness-dominated
      hitting times) or at large ones (window saturation) -- the same
      decomposition this goal's instrument_calibration block found for a
      different estimator, whose independent recurrence here would be strong
      corroboration.
    nearby_object_control: >-
      RANDOM-REGULAR: a uniformly random 3-regular graph on the same N, with a
      random target set of size ceil(N^{1/2}) and a distance-based labelling.
      Here a gradient is real but there is no supersingular structure at all.
      IF THE REAL ARM'S m_gap MATCHES THIS OBJECT'S, the measurement is about
      greedy descent on labelled expanders in general and not about delta_E, and
      every delta_E-specific reading in the lane must be rescoped. NO PRIOR RUN
      IN THIS LANE HAS INCLUDED THIS CONTROL.
    c_null_label_repair: >-
      GD-9's fix, with the ordering the standing repair requires. The
      comparison rule is WRITTEN AND FROZEN FIRST, then EXHIBITED on two
      synthetic inputs -- one where it must fire and one where it must not --
      and only then evaluated on the committed null_by_prime medians. THE RULE:
      fit a null M-GAP from the null medians with the same estimator and the
      same bootstrap procedure as the real arm; c_null_label_control_failure is
      TRUE iff the null arm's m_gap bootstrap CI excludes 0 at the 95 per cent
      level in the positive direction. Justification, stated before evaluation:
      a null arm whose gap is significantly positive means the gap is not
      attributable to the label, which is precisely the contamination the
      control exists to detect. A CONTROL WITH NO EXHIBITED FAILING INPUT IS NOT
      A CONTROL AND IS REPORTED AS SUCH.
    trapped_fraction_repair: >-
      GD-8's fix, replaced by a calibrated version rather than applied as
      inherited. The inherited rule is a cut at trapped_fraction > 0.5 whose
      derivation does not exist in any record of this campaign. The replacement
      is the scale-free escape ratio
        R = (1 - trapped_real) / (1 - trapped_null_matched),
      with forced null value 1.000, computed against NULL-Q. BOTH READINGS ARE
      REPORTED: the inherited 0.5 cut's verdict on each prime, and R's. NEITHER
      IS SILENTLY SUBSTITUTED FOR THE OTHER, and the contract states plainly
      that if the derived null trapped fraction lands in [0.88, 0.98] then the
      0.5 cut excludes every prime including any that beat their null -- which
      is a finding about the cut, not about the data.
    ordering_control: >-
      All nulls, the ladder, the planted control and the random-regular control
      are computed, analysed, committed and sha256-hashed BEFORE the real arm's
      corrected reading is computed or looked at. The decision rule is executed
      on NULL-Q first. If it emits the same label on NULL-Q as on the real arm,
      it discriminates nothing and must be rewritten before the real arm is read.
      Absence of the pre-treatment commitment is an invalidation.
    dead_control_check: >-
      For EVERY control in this contract -- not only C-NULL-LABEL -- exhibit at
      least one synthetic input on which it FAILS and one on which it PASSES,
      and commit both transcripts, before the control touches real data. This is
      GD-9's standing repair executed rather than promised, and it is applied
      contract-wide because GD-9's finding was that a control surviving several
      batches' reviews is no evidence its internals were ever exercised.
    comparability_policy: >-
      No number from EXP-SSIQ-4de240 or from any other contract is compared to
      anything here without a separately registered comparator. In particular
      the ~-0.36 bias recorded in this goal's instrument_calibration block
      belongs to a DIFFERENT estimator on a DIFFERENT object and is cited as
      precedent for the shape of the effect, never as a value to transfer.

  metrics:
    primary:
      - "P1: exponent of the EXACTLY computed mean hitting time of the F_p locus, fitted across the four graphs. Forced 0.500 +/- 0.05."
      - "P2: anchor residual -- the frozen estimator applied to the same exact hitting times, minus 0.500. Forced 0.000, tolerance 0.03."
      - "P8: m_gap on NULL-Q. Forced 0.000."
      - "P9: m_gap on the planted-gradient positive control. Pre-registered threshold >= 0.35."
      - "P7: escape ratio R per prime, against NULL-Q, with bootstrap CI. Forced null value 1.000."
    secondary:
      - "P3: directly counted F_p-rational vertices per graph and the fitted exponent of that count in N. Predicted 0.5 +/- 0.05."
      - "P4: ladder residual at each of four forced exponents and two constructions, with monotonicity and A-versus-B disagreement."
      - "P5: corrected gamma_greedy, REPORTED ONLY IF P4 licenses a correction. Pre-registered directional prediction: exceeds 0.25."
      - "P6: trapped fraction of NULL-P per graph. Predicted in [0.88, 0.98] and above the real arm at all four primes."
      - "P10: observable resolution -- the number of distinct m_gap values the four-point fit can produce given integer-valued medians in the observed range."
      - "P11: m_gap on the RANDOM-REGULAR nearby object, beside the real arm's."
      - "c_null_label_control_failure, derived from the frozen rule, with the two exhibited synthetic branches."
      - "The inherited 0.5-cut verdict per prime, reported beside R, neither substituted for the other."
      - "Full per-start hitting-time and basin-size distributions per arm, not medians alone."

  heuristic_under_test: HEUR-SS-3
  heuristic_under_test_note: >-
    HEUR-SS-3 (bias transfer) is what the ladder tests, and it gates only the
    CORRECTION (P5), never the finding (P1, P2). HEUR-SS-9 (target density) is
    tested by P3 and is replaced there by direct measurement rather than
    relayed. No other heuristic of H-SSIQ-2efc5c is load-bearing here.

  known_untested_dependencies:
    - "The expander mixing bound relayed via the frozen source from [37], not read. DELIBERATELY NOT LOAD-BEARING: P1 computes the hitting time exactly."
    - "Whether any of this transfers beyond N = 611. It does not, and the contract says so rather than testing it."
    - "The cost of evaluating delta_E at a visited vertex, which is what would turn a descent into an algorithm. Charged by EXP-SSIQ-a5c0cb, untested here."

  preregistered_prediction:
    quantity: >-
      gamma_random as computed exactly, the estimator's residual against it, the
      matched nulls' trapped fractions and m_gaps, and the planted control's
      m_gap.
    formula: >-
      Hitting time of a density-d set on an expander is Theta(1/d), with
      d = |F_p locus| / N = Theta(N^{-1/2}), giving exponent 1/2. Local minima of
      a uniformly random labelling of a 3-regular graph have density 1/(k+1) =
      1/4, giving trapped_fraction_null = 1 - Theta(N^{-1/2}).
    source: >-
      The target-set identification is ledger/goals/GOAL-SSIQ-001/goal.yaml
      lever L4 and the frozen source line 51; the 3-regularity is the frozen
      source line 99; the local-minimum density is derived in
      ledger/hypotheses/H-SSIQ-2efc5c.yaml mechanism (D); the expander property
      is relayed via the frozen source's [37] and is REPLACED by the exact solve.
    directional_prediction: >-
      P1 near 0.500; P2 materially negative (the committed run's own
      gamma_random of 0.4014 implies about -0.10 if the forced value holds);
      P6 above the real arm at all four primes; P5 above 0.25. THE LAST IS A
      PREDICTION AGAINST THIS CAMPAIGN'S OWN BEST LEVER and is stated in that
      direction on purpose, so that confirming it costs as much as refuting it.

  stages_cheapest_first:
    - id: STAGE-0
      compute: zero
      terminating: true
      content: >-
        Read descent_hitting_time.py and the frozen EXP-SSIQ-58b642 /
        EXP-SSIQ-a85692 specification text IN FULL and confirm (a) what the
        descent target set is and (b) what the estimator's fitting rule is.
        RECOMPUTE the forced value from the confirmed target. If the target is
        not the F_p locus, the forced value becomes 1 - log_N(|target|) and the
        contract proceeds with that number -- THE ANCHOR IS RECOMPUTED, NEVER
        ABANDONED. Also re-read RUN-SSIQ-a85692-b's execution report in full
        (GD-6's standing repair). This stage can end the run's premise and costs
        nothing.
    - id: STAGE-1
      compute: seconds
      terminating: true
      content: >-
        Rebuild the four graphs; check vertex counts against the committed N;
        verify connectivity and 3-regularity directly rather than citing the
        committed correctness_gates headline; COUNT the F_p-rational vertices
        (P3); re-verify the delta_E normalisation. A normalisation mismatch or a
        vertex-count mismatch STOPS the run as an invalidation.
    - id: STAGE-2
      compute: seconds
      terminating: true
      content: >-
        THE EXACT ANCHOR (P1). Solve (I - P')h = 1 per graph and fit the
        exponent. THIS IS THE DECISIVE CHEAP GATE: if the exact exponent is not
        near 1/2, the forced value does not apply at these sizes, the anchor is
        void, and the correct conclusion is that no exponent measured on graphs
        this small is interpretable -- including gamma_greedy. Report and stop
        the correction branch; the null and control stages still run because
        they do not depend on the anchor.
    - id: STAGE-3
      compute: minutes
      terminating: false
      content: >-
        Dead-control transcripts for every control; then NULL-P, NULL-Q, the
        planted positive control, the RANDOM-REGULAR nearby object, and the
        four-rung two-construction ladder. All committed and hashed before the
        real arm is read.
    - id: STAGE-4
      compute: minutes
      terminating: false
      content: >-
        The real arm: greedy and random hitting distributions, trapped
        fractions, escape ratio R, the frozen C-NULL-LABEL rule evaluated, and
        -- only if P4 licenses it -- the corrected gamma_greedy (P5). Report the
        inherited 0.5-cut verdict beside R.

  replication:
    seeds: [0, 1]
    seed_note: >-
      The two seeds index the counter streams for NULL-P, NULL-Q, the planted
      targets, the ladder targets and the random-regular graphs. The real arm is
      DETERMINISTIC given the graphs and labels, so seed replication tests the
      null and control samplers rather than the finding. The two seeds' null
      distributions must agree within their own spread; disagreement is a
      sampler defect and an invalidation, not a result.
    independent_instances: 4

  budget:
    maximum_runs: 1
    stage0_wall_clock_seconds: 1800
    total_wall_clock_seconds: 7200
    total_cpu_hours: 2
    maximum_memory_gb: 4
    maximum_workers: 1
    no_network: true
    new_search_budget: 0
    new_search_note: >-
      ZERO NEW SEARCH, by design and consistent with this goal's own deferral
      (i): no new prime, no new delta_E computation, no new isogeny search. The
      entire cost is graph rebuilds, a dense linear solve at N <= 611, and
      permutation sampling.
    budget_allocation_reading: >-
      GD-7's standing repair, applied. THE OPERATIVE READING IS CUMULATIVE: the
      four graphs are processed in ascending N and the run continues while
      cumulative elapsed time is below total_wall_clock_seconds minus a
      600-second reserve for artifact writing. An individual per-graph cap is
      NOT used. Both readings are stated so the pre-freeze reviewer can check
      the code against the operative one, which is exactly what GD-7 requires.

  stopping_rules:
    - Do not execute unless separately approved, frozen, archived and authorized by the Coordinator. status is review_required and approved_by is absent.
    - Stop at STAGE-0 if the frozen artifacts cannot be read in full or the estimator's call site cannot be located.
    - Stop at STAGE-1 on any vertex-count, connectivity, degree or delta_E normalisation mismatch.
    - Halt the CORRECTION branch (P5) at STAGE-2 if the exact anchor exponent is not within 0.05 of the forced value; the null and control stages still run.
    - Stop before STAGE-4 if the null arms, ladder and controls have not been committed and hashed.
    - Stop before STAGE-4 if the planted positive control does not reach m_gap >= 0.35.
    - Stop before STAGE-4 if any control lacks an exhibited failing synthetic input.
    - Stop on cumulative budget exhaustion, reporting exactly which graphs and arms were covered.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Reimplementing the estimator instead of importing the committed one.
    - Pooling or conflating NULL-P and NULL-Q.
    - Reporting a corrected gamma_greedy when the ladder shows A-versus-B disagreement above 0.10 at any rung.
    - Reporting any m_gap without its matched-null m_gap beside it.
    - Reporting any exponent without the anchor residual beside it.
    - Lowering any pre-registered threshold after a value is observed.
    - Any dependency installed during the run.
    - Any use of the committed delta_E labels before the normalisation check has passed and been recorded.

  decision_rule:
    branches:
      - id: DATA-UNAVAILABLE-BLOCKED
        condition: >-
          The graphs cannot be rebuilt, the estimator's call site cannot be
          located, the delta_E normalisation check fails, or a required artifact
          is absent.
        disposition: >-
          INFRASTRUCTURE OUTCOME under AGENTS.md rule 5. Never negative
          mathematical evidence and NEVER merged into CONTROL-FAILURE-VOID.
          Declared as a distinct branch per GD-6's standing repair, which named
          exactly this conflation as a defect of a prior contract in this lane.
      - id: CONTROL-FAILURE-VOID
        condition: >-
          The planted positive control does not reach m_gap >= 0.35, or NULL-Q
          returns a non-zero m_gap, or any control lacks an exhibited failing
          input, or the two seeds' null distributions disagree beyond their own
          spread.
        disposition: >-
          The instrument cannot support any verdict about the real arm. No
          negative may be reported about lever L4. Distinct from
          DATA-UNAVAILABLE-BLOCKED and from ANCHOR-INAPPLICABLE.
      - id: ANCHOR-INAPPLICABLE
        condition: >-
          The EXACTLY computed hitting exponent (P1) is not within 0.05 of the
          forced value.
        disposition: >-
          A FOURTH, PRE-DECLARED BRANCH, minted precisely because GD-6 records
          this campaign absorbing an unforeseen outcome category into a label
          reserved for something else. The forced value is a large-N statement
          that does not apply at N <= 611. The anchor is void; NO exponent
          measured in this lane at this scale is interpretable, INCLUDING
          gamma_greedy. This is a harsher outcome for the lever than the
          contract predicts and it is admissible, reportable, and must not be
          re-labelled.
      - id: ESTIMATOR-SOUND
        condition: >-
          All controls pass, P1 is within 0.05 of the forced value, and the
          anchor residual P2 satisfies |P2| <= 0.03.
        disposition: >-
          The estimator is fit for purpose at this scale. gamma_greedy may be
          read as measured, and the campaign's headline survives its first real
          calibration. The deliverable additionally includes the calibrated
          escape-ratio filter replacing the underived 0.5 cut, and the repaired
          C-NULL-LABEL rule with both branches exhibited.
      - id: ESTIMATOR-BIASED-CORRECTABLE
        condition: >-
          All controls pass, P1 is within 0.05 of forced, |P2| > 0.03, and the
          ladder (P4) is monotone with A-versus-B agreement within 0.10 at every
          rung.
        disposition: >-
          Report the residual table and the corrected gamma_greedy (P5) WITH its
          correction visible, never folded in. If the corrected value exceeds
          1/4, report that lever L4's descent branch does not currently meet its
          own ceiling AT TOY SCALE ON THIS ESTIMATOR -- a scoped statement under
          rule 6, not a closure. Forward guidance is MANDATORY: what would move
          the corrected value, what larger N would be needed, and the fact that
          the label's evaluation cost remains uncharged here.
      - id: ESTIMATOR-BIASED-NOT-CORRECTABLE
        condition: >-
          All controls pass, |P2| > 0.03, and the ladder fails monotonicity or
          A-versus-B agreement.
        disposition: >-
          HEUR-SS-3 is refuted. NO corrected gamma_greedy may be reported. The
          deliverable is the uncorrected anchor residual plus the statement that
          the estimator is not correctable at this scale -- which is itself
          decisive about what the lane's measurements can mean, and is a
          first-class negative rather than a failure.

  success_criterion: >-
    The package succeeds when: the target set and estimator are confirmed by
    direct reading; the four graphs rebuild to the committed vertex counts with
    connectivity and 3-regularity verified directly; the F_p-rational vertices
    are counted directly; the exact mean hitting time is computed on every graph
    and its exponent reported; the frozen estimator's residual against that
    exponent is reported; every control has an exhibited failing and passing
    synthetic input; NULL-P, NULL-Q, the planted positive control, the
    random-regular nearby object and the four-rung two-construction ladder are
    all computed, committed and hashed before the real arm is read; the escape
    ratio and the inherited 0.5-cut verdict are both reported; the C-NULL-LABEL
    rule is frozen, exhibited on two synthetic branches, and only then
    evaluated; and a terminal branch is named. SUCCESS IS A COMPLETE,
    CONTROLLED, ORDERED READOUT -- NOT A PARTICULAR VALUE. Every branch except
    DATA-UNAVAILABLE-BLOCKED and CONTROL-FAILURE-VOID is a successful run.

  falsification_criterion: >-
    H-SSIQ-2efc5c's H-B1 is falsified by the ANCHOR-INAPPLICABLE branch (the
    exact computation itself failing to return ~1/2), or by the target set
    turning out not to be the F_p locus in a way that makes the forced value
    incoherent rather than merely different. H-B2 is falsified by
    ESTIMATOR-SOUND (no material bias to transfer), by
    ESTIMATOR-BIASED-NOT-CORRECTABLE (HEUR-SS-3 refuted), or by a corrected
    gamma_greedy at or below 0.25. H-B3 is falsified by the matched null's
    trapped fraction landing at or below the real arm's at two or more primes,
    or by the escape ratio's CI including 1 at three or more primes.

  infrastructure_failure_disposition: >-
    A timeout, crash, missing artifact, unreadable implementation file or absent
    dependency is reported under DATA-UNAVAILABLE-BLOCKED as an INFRASTRUCTURE
    SIGNAL and is NEVER negative mathematical evidence about H-SSIQ-2efc5c,
    about the descent, or about lever L4 (AGENTS.md rule 5). It is never merged
    into CONTROL-FAILURE-VOID and never into ANCHOR-INAPPLICABLE: this contract
    carries four terminal branches specifically because GD-6 records the cost of
    having only one.

  required_artifacts:
    - Frozen approved specification and a freeze receipt binding its sha256.
    - manifest.yaml conforming to the run-manifest schema, including the RUN_REQUIRED_TOP keys `code` and `inputs` (GD-5's standing repair -- required_artifacts stated against the schema, not invented).
    - command.txt, environment.json, stdout.log, stderr.log.
    - STAGE-0 transcript: the target-set and estimator confirmations, the estimator's call site, and the recomputed forced value.
    - Graph rebuild transcript: vertex counts against committed N, direct connectivity and degree verification, direct F_p-rational vertex counts, delta_E normalisation check.
    - Exact hitting-time solution per graph and the fitted exponent.
    - Dead-control transcripts: every control's exhibited passing and failing synthetic input.
    - Null-and-control commitment: NULL-P, NULL-Q, planted, random-regular and the full ladder, with their sha256, timestamped before any real-arm output.
    - raw-result.json with per-arm full hitting-time and basin-size distributions, the residual table, the escape-ratio table, and per-stage timings.
    - The frozen C-NULL-LABEL rule text, its two synthetic branch transcripts, and its verdict, in that order.
    - Execution report naming the terminal branch and, if any stage did not run, exactly which and why.

  approval_requirements:
    - Independent pre-freeze Red Team review, per this goal's REC-5 mitigation and GD-4's repair.
    - That review must verify BY DIRECT CODE READING that every control's comparison logic is implemented, including C-NULL-LABEL's, and must not infer it from the presence of a report block (GD-9's standing repair, which this contract is partly written to discharge).
    - That review must re-read every cited prior artefact IN FULL -- RUN-SSIQ-a85692-b's execution report, descent_hitting_time.py, compute_delta_e_v2.py, and the frozen EXP-SSIQ-58b642 metric definitions (GD-6's standing repair).
    - That review must derive BOTH the individual-cap and cumulative-prefix readings of the budget rule and confirm the operative one against the actual code (GD-7's standing repair).
    - That review must confirm the four terminal branches are mutually exclusive and jointly cover the outcome space, since GD-6's finding was an outcome with no branch.
    - Coordinator approval, freezing and archival as a separate act; this draft is not edited by the reviewer.

