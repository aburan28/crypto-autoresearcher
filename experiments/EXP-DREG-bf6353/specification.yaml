# EXP-DREG-bf6353
# Transport reading rules. No matrix.
# Approved by DEC-20261002-f0f974.
experiment:
  id: EXP-DREG-bf6353
  hypothesis_id: H-DREG-b87341
  source_idea: IDEA-20260922-be09d7
  question_id: RQ-DREG-c8ae8d
  version: 1
  title: Transport reading rules
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-f0f974
  objective: >-
    Apply the transport reading rules to five integer triples and
    check the cleared degree of one degree-2 map.
  inputs:
    triple_no_both: [5, 5, 5]
    triple_no_move: [5, 5, 4]
    triple_equal: [5, 3, 3]
    triple_presentation: [5, 3, 4]
    triple_weaker: [5, 4, 2]
    drops_presentation: [2, 1]
    drops_weaker: [1, 3]
    drops_equal: [2, 2]
    seeds_stable: [4, 4, 4]
    seeds_unstable: [4, 4, 3]
    spread_stable: 0
    spread_unstable: 1
    ell: 2
    set_size: 3
    pullback_degrees: [2, 2, 2]
    generator_count: 3
    order: 15
    gcd_2: 1
    gcd_3: 3
    gcd_5: 5
  controls:
    - >-
      The triple (5, 5, 4) is no movement, because the transported
      integer equals the native integer. Calling it equal enrichment
      invalidates the run.
    - >-
      The triple (5, 3, 3) is equal enrichment, with drops 2 and 2.
      The triple (5, 3, 4) is presentation, with drops 2 and 1.
      The triple (5, 4, 2) is weaker, with drops 1 and 3. Swapping
      those readings invalidates the run.
    - >-
      Seeds 4, 4, 4 have spread 0. Seeds 4, 4, 3 have spread 1.
      Issuing a presentation label on the unstable seeds invalidates
      the run.
    - >-
      Each cleared polynomial X^2 - v X + 1, for v in {0, 1, 2}, has
      degree 2. Reporting degree 1 invalidates the run.
    - >-
      The random-generator count is the set size 3, not the degree 2.
      Reporting 2 invalidates the run.
    - >-
      Two is coprime to 15. Three and five are not. Reporting three
      as coprime to 15 invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - triple
    - route in {rules, subtract}
  metrics:
    primary:
      - presentation_reading
      - weaker_reading
      - generator_count
      - implementations_agree
    secondary:
      - seed_spread
      - pullback_degrees
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The reading of (5, 3, 4) and the generator count 3.
    formula: >-
      Drop is native minus the arm. No movement if the transported
      integer equals the native integer. Equal enrichment if the drops
      are equal and nonzero. Presentation if the transported drop is
      at least the random drop plus 1. Weaker if the random drop is
      strictly larger. Spread is the maximum seed minus the minimum
      seed. The cleared polynomial is X squared minus v X plus 1.
    source: >-
      IDEA-20260922-be09d7 states the three readings and the same-count
      enrichment, read 2026-10-02. The fixtures were evaluated in this
      design session. That evaluation is not a run. No matrix was built.
  scale_relevance:
    tier: toy
    justification: Five triples and one map. No transfer to a measured degree.
    correspondence: null
  tail_checks:
    - The unstable-seed row is required. Stopping at the presentation triple and still labeling the spread-1 seeds is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If (5, 5, 4) is reported as equal enrichment, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - (5, 5, 4) is reported as equal enrichment or as presentation.
    - (5, 3, 4) is reported as weaker.
    - (5, 4, 2) is reported as presentation.
    - Seeds 4, 4, 3 are given a presentation label.
    - A pullback degree is reported as 1.
    - The generator count is reported as 2.
    - A matrix or an isogeny graph is reported.
  success_criterion: >-
    Both runs agree that (5, 5, 5) and (5, 5, 4) are no movement,
    that (5, 3, 3) is equal enrichment, that (5, 3, 4) is
    presentation, that (5, 4, 2) is weaker, that the seed spreads
    are 0 and 1, that the three pullback degrees are 2, that the
    generator count is 3, and that gcd(2, 15) is 1 while gcd(3, 15)
    and gcd(5, 15) are not.
  falsification_criterion: >-
    The runs agree, (5, 3, 4) stays presentation, and any reading
    differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-DREG-bf6353/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-DREG-bf6353/runs/<RUN-ID>/command.txt
    - experiments/EXP-DREG-bf6353/runs/<RUN-ID>/stdout.log
    - experiments/EXP-DREG-bf6353/runs/<RUN-ID>/stderr.log
    - experiments/EXP-DREG-bf6353/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-DREG-bf6353/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any Macaulay matrix, degree measurement, or isogeny graph.
    - Any new factor base, and any claim that a universal factor-base obstruction is settled.
    - A presentation label from seeds whose spread is at least 1.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
