experiment:
  id: EXP-ECDLP-0ecf02
  hypothesis_id: H-ECDLP-7c8bc5
  version: 1
  title: >-
    Conditioning the committed crypto-scale Groebner baseline - reconstruct
    d_reg = 150 and log2 cost 1194 from the archived script, emit the full
    omega-by-reading-by-axis cost table with memory beside time and rho beside
    it, and separate the block-support effect from a partitioning artefact with
    a full-support null of forced gap exactly zero, a four-point graded block-
    size ladder, and a curve-free random GF(2) system carrying the same block
    pattern
  status: draft
  status_note: >-
    DRAFT. Not review_required and not approved. Coordinator design freeze
    converting IDEA-20260805-e732ed into a testable protocol under
    TASK-20260904-43152a. Not snapshot-committed, not independently reviewed, NO
    RUN AUTHORIZED. Nothing here revises the committed BATCH-001 checkpoint,
    which is immutable.
  objective: >-
    Establish what the committed baseline actually computes, attach the omega
    and memory columns it lacks, and measure whether the block support structure
    changes the freeze degree - separating a real structural effect from an
    artefact of the partitioning code and from a generic property of
    block-supported GF(2) systems. The design is cheapest-first and every stage
    can end the line.
  inputs:
    committed_cell: >-
      t = 7, n = 161, k = ceil(161/7) = 23, nb = n(t-2) + kt = 966, degree
      histogram 161 quadrics and 805 cubics, claimed freeze degree 150, claimed
      log2 cost 1194. The committed checkpoint line is copied verbatim into the
      run manifest for comparison rather than paraphrased.
    series_definition: >-
      H(z) = (1+z)^nb * (1+z^2)^(-n_quad) * (1+z^3)^(-n_cub); the freeze degree
      is the least D at which the coefficient of z^D is non-positive. Computed
      in exact integer arithmetic.
    block_shapes_at_t7: >-
      Three shapes, from the system's own support structure: n quadrics in
      n + k = 184 variables; n cubics in n + 2k = 207 variables; n cubics in
      2n + k = 345 variables.
    toy_ladder: 't = 3 at n in {9, 12, 15, 18, 21, 24, 30}.'
    omega_grid: '2, 2.37, 3'
  controls:
    - id: CTRL-RECONSTRUCTION-POSITIVE
      description: >-
        POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR, AND THE REASON THE AUDIT
        IS CREDIBLE AT ALL. The pipeline must return exactly 150 for the freeze
        degree and 597.19 for log2 of the column count at the committed cell,
        and the archived cost script must be opened and its formula quoted
        verbatim into results/archived_formula.md.
      failure_meaning: >-
        If the reconstruction does not reproduce the committed numbers, the
        audit is aimed at the wrong expression and NO finding stands. If the
        archived formula proves to be something other than the column count
        raised to omega = 2, the first two audits are restated against what it
        actually is before anything else proceeds.
    - id: NULL-FULL-SUPPORT
      description: >-
        NAMED NULL OBJECT, FORCED VALUE DERIVED PRE-RUN, CAN FAIL. Apply the
        IDENTICAL block-freeze computation to a system with the SAME degree
        histogram and the SAME nb but FULL supports - every polynomial on all nb
        variables. Its per-block freeze degree is by construction identical to
        the global one, so the FORCED VALUE OF THE GAP IS EXACTLY 0.
      failure_meaning: >-
        A nonzero gap on the full-support object means the code is measuring its
        own partitioning rather than the system's support structure, and NOTHING
        else in the run may be reported. This null is non-degenerate: the
        treatment object's gap is predicted at 125 degrees (150 minus 25) while
        the null's is predicted at exactly 0, so the discriminator has a
        separation of 125 degrees against a forced band of width 0 on an exact
        integer quantity.
    - id: CTRL-GRADED-BLOCKSIZE
      description: >-
        DEMONSTRATED DYNAMIC RANGE WITH PLANTED SIZES. Interpolate the block
        variable count from the true block (184) to the full ambient (966) in
        four equal steps, holding the degree histogram fixed, and report the
        freeze degree at each. It must rise MONOTONICALLY from 25 to 150, and
        the predicted value at each interpolation point is computed and written
        to results/forced_values.yaml BEFORE the run; each measured value must
        equal its predicted value exactly, since both are exact integer series
        computations.
      failure_meaning: >-
        A non-monotone curve, or any point off its predicted integer, means the
        freeze-degree computation is unstable in the regime being used and every
        block number is void. This is the planted-defect-of-known-size control:
        four interpolation points with exactly known answers.
    - id: CTRL-NEARBY-T3
      description: >-
        NEARBY OBJECT WHERE THE CONCLUSION COULD FAIL. t = 3, where the block gap
        is only 2 to 3 degrees and where actual measurements exist in this lane.
      failure_meaning: >-
        If the block story cannot be seen at t = 3, claiming it at t = 7 on
        series arithmetic alone is unsupported and the audit must say so.
    - id: NULL-CURVE-FREE-GF2
      description: >-
        NAMED CURVE-FREE NULL FOR THE MEASURED STAGE. A random GF(2) polynomial
        system with the same nb, the same degree histogram, and the SAME BLOCK
        SUPPORT PATTERN, but generated with random coefficients and no
        connection to any summation polynomial or elliptic curve. Its measured
        block-versus-full saturation gap is compared against the real system's
        at the same toy rungs, at matched seeds.
      failure_meaning: >-
        CONSEQUENCE DECLARED IN ADVANCE. If the curve-free system reproduces the
        real system's saturation gap, the block effect is a generic property of
        block-supported GF(2) systems and NOT of summation polynomials or
        elliptic curves, and NOTHING measured here may be quoted as a statement
        about elliptic curves or the ECDLP. This null is required because the
        entire object under audit - a Hilbert series and a support pattern - can
        be reproduced with no curve behind it.
    - id: CTRL-MEMORY-BESIDE-TIME
      description: >-
        Every cost cell in the emitted table carries a memory figure beside its
        time figure, and the comparator row (Pollard rho / van Oorschot-Wiener)
        carries both as well. A table row with a time and no memory is
        incomplete and is reported as such.
      failure_meaning: >-
        A time-only comparison against a memory-negligible comparator is the
        exact defect this audit exists to correct; reproducing it would void the
        deliverable.
  independent_variables:
    - 'parameter t, in {3, 7}'
    - 'n, over the toy ladder at t = 3 and fixed at 161 at t = 7'
    - 'support reading, in {global, per-block, graded interpolation}'
    - 'linear-algebra exponent omega, in {2, 2.37, 3}'
    - 'object, in {real chained system, full-support null, curve-free random GF(2) system}'
  metrics:
    primary:
      - >-
        freeze degree D, an integer in degrees, per object per reading per
        parameter cell.
      - >-
        log2 of the Macaulay column count N(nb, D), in bits, per cell.
      - >-
        log2 time cost = omega * log2 N(nb, D), in bits, per cell per omega.
      - >-
        log2 memory lower bound = log2 N(nb, D), in bits, per cell, reported
        beside every time figure.
      - >-
        block-versus-global freeze-degree gap, an integer in degrees, per object.
        Forced to exactly 0 on NULL-FULL-SUPPORT.
      - >-
        verbatim archived cost formula with its file path, or an explicit record
        that the file could not be found.
    secondary:
      - 'the four graded-interpolation freeze degrees against their pre-computed integers.'
      - 'the t = 3 ladder gap at every rung, integer degrees.'
      - 'measured saturation degree of the block-A subsystem and of the full system at the two smallest toy rungs, integer degrees, real system and curve-free null side by side.'
      - 'the full cost table: omega in {2, 2.37, 3} crossed with reading in {global, block-bounded} crossed with {time, memory}, plus the rho row, every cell labelled with the assumption producing it.'
      - 'per-run wall clock and peak memory.'
  heuristic_under_test: HEUR-DREG-GEN-1
  preregistered_prediction:
    quantity: >-
      The per-block freeze degrees at t = 7 and the block-versus-global gap on
      the real system and on the full-support null.
    formula: >-
      Freeze degree of (1+z)^V * (1+z^2)^(-a) * (1+z^3)^(-b) evaluated per block
      with V the block variable count. Predicted exactly 25 at V = 184, 43 at
      V = 207, 80 at V = 345, against the global 150 at V = 966; and gap exactly
      0 on the full-support null.
    source: >-
      Derived in H-ECDLP-7c8bc5 from the same series construction that produces
      the committed global figure. The underlying semi-regularity framework is
      cited at provenance `recalled` and is a pointer, not support.
  scale_relevance:
    tier: toy
    justification: >-
      Every t = 7, n = 161 number in this contract is SERIES ARITHMETIC, not a
      measurement, and is labelled model-derived in every output row. The only
      measured stage is at t = 3, n in {9, 12}, and it is separately authorised.
      NOT REACHABLE, STATED PLAINLY: the sign of the block correction at t = 7
      cannot be measured by any reachable computation, because the Macaulay
      matrix at degree 150 has about 2^597 columns. This contract does not
      shrink that claim to something measurable; it declares it untestable and
      measures the t = 3 analogue instead, whose sign does not transfer.
    correspondence: null
  tail_checks:
    - >-
      The t = 3 rung with the SMALLEST gap is reported explicitly, since the
      prediction is a floor of 2 and the smallest rung is where it is closest to
      failing.
    - >-
      The largest absolute discrepancy between a graded-interpolation freeze
      degree and its pre-computed integer, reported with its interpolation
      point.
    - >-
      The single most optimistic cell of the cost table (lowest time, lowest
      memory) reported explicitly beside rho's row, so that a reader cannot
      quote it without seeing the comparator.
  replication:
    seeds:
      - 'RUN-ECDLP-0ecf02-1 (Stage 1 archived-formula read and reconstruction control): deterministic; recorded seed 20260904021'
      - 'RUN-ECDLP-0ecf02-2 (series arithmetic - global, per-block, graded ladder, full-support null, t=3 ladder): deterministic; recorded seed 20260904022'
      - 'RUN-ECDLP-0ecf02-3 (cost table emission across omega and reading, with memory and rho rows): deterministic; recorded seed 20260904023'
      - 'RUN-ECDLP-0ecf02-4 (OPTIONAL, separately authorised: measured toy saturation degrees, real system and NULL-CURVE-FREE-GF2 at matched seeds): master seed 20260904024'
    independent_instances: 10
    replication_note: >-
      SEEDS POLICY. RUN-1 to RUN-3 consume NO randomness; their series and cost
      computations are exact integer arithmetic and their recorded seeds fix only
      reporting order. RUN-4 is the only stochastic run: it draws 10 independent
      random GF(2) systems per rung for NULL-CURVE-FREE-GF2 from the declared
      master seed, PAIRED against the real system's measurement at the same rung,
      with the derivation rule and every derived seed recorded in the manifest.
      No seed may change after a run; a re-seeded protocol is a NEW contract.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 8
    maximum_runs: 4
    budget_feasibility_note: >-
      RUN-1 to RUN-3 are power-series arithmetic to degree at most a few hundred
      in exact integers and take seconds. RUN-4 is the only real work: GF(2)
      linear algebra on toy systems at n = 9 and n = 12, which is small. The
      600-second and 8 GB template floors are met and are not the binding
      constraint; the binding constraint on RUN-4 is that it is OPTIONAL and
      SEPARATELY AUTHORISED and must not be started under this contract alone.
  stopping_rules:
    - >-
      ST-0 STAGE GATE, DECISIVE. Stage 1 opens the archived cost script and
      confirms or refutes that the committed figure is the column count raised
      to omega = 2. If refuted, the run STOPS, records the real formula verbatim,
      and the audit is restated against it before any further stage runs.
    - >-
      ST-1 PER-RUN CAP. 600 seconds and 8 GB per run; on approaching the cap the
      run STOPS and names every cell not reached.
    - >-
      ST-2 STOP AND REPORT ON AMBIGUITY. If the block support structure cannot
      be read unambiguously from the committed system source, the Executor STOPS
      AND REPORTS rather than inferring it from the source proposal.
    - >-
      ST-3 NO INTERPRETATION. Observations only. The run package must not state
      whether the baseline is wrong, must not write an evidence or decision
      record, and must not touch any hypothesis or checkpoint.
    - >-
      ST-4 NO ATTACK LANGUAGE. No output file may present any cell of the cost
      table as an attack, a speedup, or a weakening of ECDLP security. Every
      table is emitted with the rho comparator row attached.
  invalidation_rules:
    - >-
      INV-RECONSTRUCTION. CTRL-RECONSTRUCTION-POSITIVE fails: the audit is aimed
      at the wrong expression; run set INVALID.
    - >-
      INV-NULL-GAP. NULL-FULL-SUPPORT shows a nonzero gap: the instrument is
      measuring its own partitioning; run set INVALID.
    - >-
      INV-LADDER. CTRL-GRADED-BLOCKSIZE is non-monotone or any point differs
      from its pre-computed integer: every block number is VOID.
    - >-
      INV-MEMORYLESS. Any emitted cost cell lacks its memory figure: that table
      is INVALID and is not reported.
    - >-
      INV-UNAUTHORISED-STAGE. RUN-4 executed without its separate authorisation:
      its results are INVALID regardless of content.
    - >-
      INV-INFRASTRUCTURE. A crash, timeout or missing-file failure is recorded
      with its terminal status and IS INFRASTRUCTURE SIGNAL, never evidence about
      HEUR-DREG-GEN-1 (AGENTS.md rule 5).
  success_criterion: >-
    S1. CTRL-RECONSTRUCTION-POSITIVE returns exactly 150 and 597.19 and the
    archived formula is quoted verbatim; NULL-FULL-SUPPORT returns a gap of
    exactly 0; CTRL-GRADED-BLOCKSIZE is monotone and on its pre-computed
    integers; the three t = 7 per-block freeze degrees are exactly 25, 43 and 80,
    all strictly below 150; every t = 3 rung shows a gap of at least 2; and the
    full cost table is emitted with a memory column and the rho row. S1 MET means
    the committed headline is the most optimistic member of a documented family,
    lacks a memory column, and rests on a named heuristic that the system's own
    support structure violates - AS A STATEMENT ABOUT THE COST MODEL AND ITS
    ASSUMPTIONS, WITH THE DIRECTION OF THE RESULTING ERROR EXPLICITLY UNKNOWN.
    S1 MET IS NOT AN ATTACK AND NOT A WEAKENING OF ANYTHING.
  falsification_criterion: >-
    F1. Any of: (a) the archived derivation shows the figure is not the column
    count raised to omega = 2; (b) any t = 7 block freeze degree is at least 150;
    (c) any t = 3 gap is below 2; (d) a memory figure for this baseline is found
    on the record. (a) forces findings one and two to be restated or withdrawn;
    (b) and (c) void the genericity finding; (d) withdraws the memory finding.
    F2, VOIDING RATHER THAN FALSIFYING: NULL-FULL-SUPPORT shows a nonzero gap, or
    CTRL-GRADED-BLOCKSIZE misses a pre-computed integer. F3, DECLARED IN ADVANCE
    AND BINDING WHATEVER ELSE HOLDS: if NULL-CURVE-FREE-GF2 reproduces the real
    system's measured saturation gap, the effect is generic to block-supported
    GF(2) systems and no output of this experiment may be quoted as a statement
    about elliptic curves or the ECDLP.
  required_artifacts:
    - experiments/EXP-ECDLP-0ecf02/driver/freeze_degree.py
    - experiments/EXP-ECDLP-0ecf02/driver/cost_table.py
    - experiments/EXP-ECDLP-0ecf02/results/archived_formula.md
    - experiments/EXP-ECDLP-0ecf02/results/forced_values.yaml
    - experiments/EXP-ECDLP-0ecf02/results/cost_table.json
    - experiments/EXP-ECDLP-0ecf02/results/summary.json
    - experiments/EXP-ECDLP-0ecf02/results/seed_env_manifest.yaml
    - experiments/EXP-ECDLP-0ecf02/runs/RUN-ECDLP-0ecf02-1/manifest.yaml
    - experiments/EXP-ECDLP-0ecf02/runs/RUN-ECDLP-0ecf02-1/results.json
    - experiments/EXP-ECDLP-0ecf02/runs/RUN-ECDLP-0ecf02-1/stdout.log
    - experiments/EXP-ECDLP-0ecf02/runs/RUN-ECDLP-0ecf02-2/manifest.yaml
    - experiments/EXP-ECDLP-0ecf02/runs/RUN-ECDLP-0ecf02-2/results.json
    - experiments/EXP-ECDLP-0ecf02/runs/RUN-ECDLP-0ecf02-2/stdout.log
    - experiments/EXP-ECDLP-0ecf02/runs/RUN-ECDLP-0ecf02-3/manifest.yaml
    - experiments/EXP-ECDLP-0ecf02/runs/RUN-ECDLP-0ecf02-3/results.json
    - experiments/EXP-ECDLP-0ecf02/runs/RUN-ECDLP-0ecf02-3/stdout.log
    - experiments/EXP-ECDLP-0ecf02/runs/RUN-ECDLP-0ecf02-4/manifest.yaml
    - experiments/EXP-ECDLP-0ecf02/runs/RUN-ECDLP-0ecf02-4/results.json
    - experiments/EXP-ECDLP-0ecf02/runs/RUN-ECDLP-0ecf02-4/stdout.log
  required_artifacts_note: >-
    results/archived_formula.md contains either a verbatim quotation of the
    archived cost formula with its file path, or an explicit statement that the
    file could not be found; it is never left implicit, because findings one and
    two are conditional on it. results/forced_values.yaml is written before any
    measured value and holds the four graded-ladder integers, the three block
    freeze degrees, and the forced null gap of 0.
  run_plan:
    - id: RUN-ECDLP-0ecf02-1
      description: 'Stage 1: open and quote the archived cost script; CTRL-RECONSTRUCTION-POSITIVE at the committed cell'
    - id: RUN-ECDLP-0ecf02-2
      description: 'Stage 2: global, per-block, graded-ladder and t=3 series arithmetic; NULL-FULL-SUPPORT; CTRL-NEARBY-T3'
    - id: RUN-ECDLP-0ecf02-3
      description: 'Stage 3: emit the omega-by-reading-by-axis cost table with memory beside time and the rho row; CTRL-MEMORY-BESIDE-TIME'
    - id: RUN-ECDLP-0ecf02-4
      description: 'Stage 4, OPTIONAL AND SEPARATELY AUTHORISED: measured toy saturation degrees at n = 9 and n = 12, real system and NULL-CURVE-FREE-GF2 at paired seeds'
  provenance:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    independent_session: false
    independent_review_status: 'NOT YET REQUESTED. Contract is at `draft`.'
    design_session_verification_note: >-
      The Coordinator subagent that wrote this contract located and read the
      committed baseline line in ledger/goals/GOAL-DREG-001.yaml by pattern
      search on 2026-09-04 and confirmed the source proposal quotes it faithfully,
      including the absence of any omega or memory term on the matched lines. It
      did NOT open the archived cost script, the system builder source, or the
      Bardet-Faugere-Salvy literature. Every claim in this contract about those
      sources is scheduled for verification in RUN-1 and RUN-2, not asserted.
  source_refs:
    - ledger/hypotheses/H-ECDLP-7c8bc5.yaml
    - ledger/proposals/IDEA-20260805-e732ed.yaml
    - ledger/goals/GOAL-DREG-001.yaml
    - ledger/RQ-DREG-001.yaml
    - docs/claims-and-verification.md
    - docs/target-result-profile.md
  assigned_to: executor
  approved_by: null
