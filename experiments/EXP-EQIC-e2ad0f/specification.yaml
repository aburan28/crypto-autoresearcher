experiment:
  id: EXP-EQIC-e2ad0f
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-5ddccf
  question_id: RQ-EQIC-8cb959
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE |Aut| SCALING LAW, MEASURED ACROSS THREE CURVE FAMILIES: the invariant reformulation
    deflates the candidate count by exactly r^m and inflates the per-variable degree by exactly r^{m-1},
    so deg_u T_m = (2r)^{m-1} against deg_x S_{m+1} = 2^{m-1}; run r = 3 (j = 0, weight-1 semi-invariant),
    r = 2 (j = 1728, weight-0 invariant) and r = 1 (generic, no action) to discriminate an |Aut|-DRIVEN
    effect from a j = 0 ACCIDENT'
  status: draft
  objective: "(A) THE TWO SEMI-INVARIANCE FACTS, WITH THEIR BICONDITIONALS. For\n  S_3(x1,x2,x3) =\
    \ (x1-x2)^2 x3^2 - 2((x1+x2)(x1 x2 + a) + 2b) x3\n                  + ((x1 x2 - a)^2 - 4 b (x1+x2)):\n\
    \  j = 0 CASE (a = 0). Every monomial has total degree congruent to 1 mod 3,\n    so S_3(zeta\
    \ x1, zeta x2, zeta x3) = zeta S_3(x1,x2,x3): a WEIGHT-1\n    relative invariant for the diagonal\
    \ mu_3-action. Holds iff a = 0, since\n    the terms -2a(x1+x2)x3, -2a x1 x2 and a^2 have total\
    \ degrees 3, 2, 0.\n  j = 1728 CASE (b = 0). Every monomial has EVEN total degree, so\n    S_3(-x1,-x2,-x3)\
    \ = S_3(x1,x2,x3): a WEIGHT-0 invariant for the diagonal\n    (Z/2)-action. Holds iff b = 0, since\
    \ the terms -4b x3 and -4b(x1+x2)\n    have odd total degrees 1 and 1.\nThese are two DIFFERENT\
    \ algebraic situations, not two instances of one, and that difference is the reason the comparison\
    \ in this record is informative rather than decorative.\n(B) THE SCALING LAW, DERIVED. Let r be\
    \ the order of the automorphism's action on the x-line: r = 3 for j = 0 with p = 1 mod 3 (phi:\
    \ x -> zeta x); r = 2 for j = 1728 with p = 1 mod 4 (phi: x -> -x, since (x,y) -> (-x, iy) needs\
    \ i in F_p); r = 1 for a generic ordinary curve, where |Aut| = 2 and negation acts TRIVIALLY on\
    \ x. Let u = x^r be the invariant coordinate and\n  T_m(u_1, ..., u_m) = prod_{(c_1,...,c_m) in\
    \ (Z/r)^m}\n                        S_{m+1}(zeta_r^{c_1} x_1, ..., zeta_r^{c_m} x_m, x_R).\nThen,\
    \ since deg_{x_i} S_{m+1} = 2^{m-1} (KN-TECH-002) and the product has r^m factors:\n  deg_{x_i}\
    \ T_m = 2^{m-1} r^m,  hence  deg_{u_i} T_m = 2^{m-1} r^{m-1}\n                               \
    \                     = (2r)^{m-1}.\nSimultaneously the factor-base membership degree falls from\
    \ r m to m and the candidate count falls from (r m)^m to m^m, a deflation of exactly r^m. CHECKS:\
    \ at m = 2, r = 3 this gives deg_u T = 6 (matching the bidegree (6,6) computed independently in\
    \ IDEA-20260807-1ea327); at m = 2, r = 2 it gives 4; at r = 1 it gives 2^{m-1} = deg_x S_{m+1},\
    \ i.e. the construction degenerates to the incumbent exactly, which is the baseline embedding.\n\
    (C) THE TWO COMPETING EXPLANATIONS THIS RECORD DISCRIMINATES.\n  H-SCALE: the measured cost ratio\
    \ ENC-X / ENC-SYM is a function of r and m\n    alone, following the bookkeeping in (B). Then\
    \ the invariant\n    reformulation is an |Aut|-driven, predictable, and therefore\n    EXTRAPOLABLE\
    \ phenomenon, and the r = 2 and r = 3 points determine its\n    behaviour without further measurement.\n\
    \  H-ACCIDENT: the j = 0 behaviour departs from the r = 2 point in a way the\n    law does not\
    \ predict. Then something specific to the CUBIC case is\n    acting -- the weight-1 semi-invariance\
    \ rather than weight-0 invariance,\n    or the fact that mu_3 has no fixed points on X_E other\
    \ than 0 while\n    mu_2's fixed points on the x-line (x = 0) are the 2-torsion -- and the\n \
    \   j = 0 result cannot be extrapolated in r.\nBoth outcomes are deliverables and the pre-registered\
    \ decision rule is in predictions.\n(D) THE CROSSOVER PREDICTION, WHICH IS WHERE THE MECHANISM\
    \ DIES. Groebner cost grows roughly as (n + D choose D)^omega in the reached degree D (KN-TECH-011),\
    \ and D is bounded below by the input degree. The candidate deflation r^m is a saving on the SOLUTION\
    \ COUNT, which enters roughly linearly, while the degree inflation r^{m-1} enters through D. At\
    \ m = 2 the two are r^2 = 9 against r = 3 for j = 0 and 4 against 2 for j = 1728, so the deflation\
    \ is nominally ahead. At m = 3 they are r^3 = 27 against r^2 = 9, with degrees deg_u T_3 = 36\
    \ for r = 3 (against deg_x S_4 = 4) -- a degree of 36 in each of three variables, which is very\
    \ likely infeasible in this harness. THE PRE-REGISTERED PREDICTION IS A CROSSOVER AT OR BEFORE\
    \ m = 3: the invariant encoding is at best competitive at m = 2 and is worse at m = 3, and identifying\
    \ the crossover exactly is the record's main quantitative deliverable.\n(E) RELATION-COUNT ARITHMETIC,\
    \ STATED FOR EVERY FAMILY. On any of the three families a factor base of cardinality r m built\
    \ from m orbits has m unknowns, because the automorphism acts on G as a scalar lambda_r (for r\
    \ = 3, lambda^2 + lambda + 1 = 0 mod N; for r = 2, phi is the order-4 automorphism so its square\
    \ is negation and lambda^2 = -1 mod N; for r = 1, lambda = 1 and there is no reduction). One successful\
    \ decomposition yields exactly ONE independent equation over those m unknowns with coefficients\
    \ in the powers of lambda_r; the automorphism images of that relation are lambda_r-multiples and\
    \ contribute rank 0 (IDEA-20260807-5dfe4a). SO THE RELATION SUPPLY IS IDENTICAL ACROSS THE THREE\
    \ FAMILIES AT MATCHED CARDINALITY AND THE ONLY VARYING QUANTITY IS THE ALGEBRAIC COST OF FINDING\
    \ A RELATION. That is what makes the cross-family comparison a controlled one."
  resource_label: R1, R2, R3
  admissibility: admissible
  admissibility_argument: 'R1: the measured quantity is the Groebner behaviour of a polynomial system
    in x-coordinates as FIELD ELEMENTS, which a generic-group simulator cannot produce. R2: the family
    selection is by curve EQUATION (a = 0, b = 0, or neither) and both semi-invariance facts are biconditionals
    on those coefficients. R3: |Aut(E)| and hence r is determined by End(E) as a ring and by the CM
    discriminant -- j = 0 requires D_0 = -3 and j = 1728 requires D_0 = -4 (T4 of DECOMPOSITION.md)
    -- so the parameter being swept is a property of the endomorphism ring, not of the group. The
    automorphism is never applied to a point of G to gain information; claim (E) states positively
    that doing so contributes rank 0.'
  reachability_gate: 'REQUIRED AND BINDING, BECAUSE THIS RECORD MOVES BETWEEN CURVE FAMILIES. (1)
    IS A GOOD OBJECT REACHABLE? For the EXPERIMENT, yes and for free: j = 0 and j = 1728 curves are
    constructed directly by setting a = 0 or b = 0, at O(1) cost per instance, with no isogeny walking.
    So the experimental design incurs no reachability cost at all. (2) FOR AN ATTACK, NO, AND THE
    COST IS INFINITE RATHER THAN LARGE. By T4 of DECOMPOSITION.md, j = 0 requires the isogeny class
    to have D_0 = -3 and j = 1728 requires D_0 = -4; the class fixes the trace t and hence D, so a
    curve whose class lacks the discriminant CANNOT be walked to one that has it -- not at cost p^{1/4},
    not at any cost. The reachability gate therefore closes hard for a target curve chosen adversarially
    or at random, and this record''s results apply only to curves already known to be CM by -3 or
    -4. (3) IS GOODNESS LOCALLY DETECTABLE? Trivially yes -- j is computed from (a, b) in O(1) --
    but that is irrelevant given (2): detectability does not help when the target is unreachable.
    This gate is stated at full strength because it is the single most important scope limit on the
    entire L4 lane, and it is a structural limit rather than a budgetary one.'
  inputs:
    procedure: 'CHEAPEST VALID DISCRIMINATOR, MINUTES, NO CURVES NEEDED: STEP 1 and STEP 2 -- the
      two symbolic semi-invariance checks and the degree table at the six (r, m) cells. Six integers,
      each predicted exactly. This alone tests claim (A) and claim (B) completely and can falsify
      the record before a single curve is generated. THEN, an hour: generate the three families over
      a common p = 1 mod 12 at 12 and 16 field bits and confirm prime N, the automorphism rationality,
      and matched factor-base cardinality. THEN, hours: the m = 2 sweep with 20 targets per family,
      including the r = 1 noise-floor cell and the within-family b-variation cells. THEN, as budget
      allows: the m = 3 cells, expecting infeasibility at r = 3 and recording the memory number when
      it occurs.'
    mechanism: 'STEP 1 -- VERIFY BOTH SEMI-INVARIANCES SYMBOLICALLY, ZERO COMPUTE, HARD GATE. Confirm
      S_3(z x1, z x2, z x3) = z S_3 for a = 0 modulo z^3 - 1, and S_3(-x1,-x2,-x3) = S_3 for b = 0,
      and confirm both fail for generic (a, b). Confirm the total-degree congruences that explain
      them (all degrees 1 mod 3; all degrees even).

      STEP 2 -- VERIFY THE DEGREE FORMULA AT EVERY AVAILABLE CELL. Construct T_m by iterated resultants
      for (r, m) in {(3,2), (2,2), (1,2), (3,3), (2,3), (1,3)} and check deg_{u_i} T_m = (2r)^{m-1}
      exactly: expected 6, 4, 2, 36, 16, 4. The (3,3) cell has degree 36 in three variables and may
      be infeasible to construct at all; a construction failure there IS the crossover evidence and
      is recorded as a measured infeasibility with its memory number, not as an absence.

      STEP 3 -- BUILD MATCHED INSTANCES ACROSS THE THREE FAMILIES. For each field size, generate:
      a j = 0 curve (a = 0) with p = 1 mod 3; a j = 1728 curve (b = 0) with p = 1 mod 4; and a generic
      ordinary curve with a b != 0. THE MATCHING PROBLEM IS THE HARD PART OF THIS DESIGN AND IS STATED
      RATHER THAN GLOSSED: p can be matched exactly only if p = 1 mod 12, so the design fixes p =
      1 mod 12 and generates all three families over the SAME p. N cannot be matched (it is determined
      by the curve) and is therefore carried as a COVARIATE: every cost is reported against its own
      N, and any cross-family ratio is reported with the N ratio beside it. A design that silently
      compares curves with different N has confounded the family with the group order.

      STEP 4 -- MEASURE AT MATCHED CARDINALITY. On each family build a factor base of the SAME cardinality
      (a common multiple of 1, 2 and 3, i.e. 6m''), as a union of complete orbits where orbits exist.
      Run ENC-X and ENC-SYM at m = 2, and at m = 3 as far as feasibility allows, on an identical number
      of targets per family. Record wall time, basis size, max reduced-basis total degree, solutions,
      certified solutions, peak memory.

      STEP 5 -- THE LAW TEST. Compare the measured ENC-X / ENC-SYM ratio at r = 2 and r = 3 against
      the ratio the bookkeeping in (B) predicts, using the r = 1 cell to calibrate the fixed overhead
      (at r = 1 the two encodings are identical, so their measured ratio is 1.00 by construction and
      any deviation is pure instrument noise -- which is what makes r = 1 the noise floor rather than
      a data point).

      STEP 6 -- THE NULLS. For each family, the size-matched random (non-orbit) base under ENC-X,
      and the formal cube/square substitution on a curve WITHOUT the corresponding automorphism (NULL-1
      of IDEA-20260807-1ea327), so that every family carries its own controlled null.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - r = 1 noise floor, where the two encodings are the same program (blocking)
  - within-family b-variation at fixed r (blocking before any law is stated)
  - per-family matched null (a != 0 for r = 3, b != 0 for r = 2)
  - size-matched random base under ENC-X in every family
  - r = 1 degeneration fixture: T_m must equal S_{m+1} coefficientwise
  - independent certificate re-verification of every decomposition
  - N reported as a covariate beside every cross-family ratio
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, WITH A NOISE FLOOR AND A DECAY PARAMETER.
    NOISE FLOOR (r = 1): on a generic curve the invariant coordinate is u = x, T = S_3 and ENC-SYM
    is literally ENC-X. Their measured ratio must therefore be 1.00, and the spread around 1.00 measured
    over the full target stream IS the instrument''s noise band. Every cross-family claim must exceed
    that measured band, not an assumed one. This is the cheapest and most important control in the
    record. MATCHED NULL PER FAMILY: for r = 3 the a != 0 curve with the formal cube substitution;
    for r = 2 the b != 0 curve with the formal square substitution. If the invariant encoding shows
    the same behaviour there, the effect belongs to the substitution and not to the automorphism,
    in that family. SIZE NULL: at every family, ENC-X on a size-matched random base of the same cardinality.
    DECAY PARAMETER: r itself, run DOWNWARD. The effect must be monotone in r and must vanish at r
    = 1 by construction. A measured effect that does NOT vanish at r = 1 is definitionally an artifact,
    because at r = 1 the two encodings are the same program. This is the strongest form of a decay
    test available anywhere in this lane, since the null is not merely matched but identical.'
  independent_variables: []
  metrics:
    primary:
    - deg_{u_i} T_m as constructed, per (r, m)
    - Groebner wall time, basis size, max total degree, per family per target
    - peak memory per cell, especially at (3,3)
    - N, p, |V|, m and orbit count per family
    secondary:
    - r = 1 noise band as a measured spread
    - within-family b-variation spread
    - certified solutions per family
  heuristic_under_test: null
  preregistered_prediction:
    quantity: deg_{u_i} T_m as constructed, at (r, m) in {(3,2),(2,2),(1,2),(2,3), (1,3)} and at (3,3)
      if feasible
    formula: 'Exactly 6, 4, 2, 16, 4 and 36 respectively. Zero tolerance: these are arithmetic predictions
      of claim (B) and a single deviation falsifies the formula cheaply and immediately.'
    source: pre-registered in IDEA-20260807-5ddccf before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - N MISMATCH. Different families over the same p have different N, and cost depends on N through
    the number of targets needed and through the modulus arithmetic. N must be reported with every
    ratio and cross-family ratios must never be presented without it.
  - p = 1 mod 12 RESTRICTION. Requiring both zeta_3 and i restricts the prime set and could correlate
    with something else. The mitigation is to also run each family over primes satisfying only its
    own condition and check that the within-family numbers do not move.
  - 2-TORSION AT r = 2. For j = 1728 the fixed point of x -> -x is x = 0, which is a 2-torsion x-coordinate
    when a is such that 0 is on the curve (b = 0 gives y^2 = x^3 + a x, so x = 0 gives y = 0 always).
    So the r = 2 family ALWAYS has a degenerate orbit at x = 0 and it is always a 2-torsion point;
    excluding it is mandatory and its exclusion changes the orbit count by one in a way the r = 3
    family does not experience.
  - DIFFERENT |Aut| VERSUS DIFFERENT r. |Aut| is 6, 4, 2 while r is 3, 2, 1. Any statement must name
    which of the two it is about; the rho baseline scales with sqrt(|Aut|) and the index-calculus
    unknown count with r, and conflating them produces a factor-of-2 error in every comparison.
  - 'SOLVER IDIOSYNCRASY, as in IDEA-20260807-1ea327: within-solver only.'
  - THREE POINTS. The temptation to fit a curve through r = 1, 2, 3 and report an exponent is the
    main interpretive risk here and is forbidden in advance.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'Exactly 6, 4, 2, 16, 4 and 36 respectively. Zero tolerance: these are arithmetic
    predictions of claim (B) and a single deviation falsifies the formula cheaply and immediately.'
  falsification_criterion:
  - Either semi-invariance check in STEP 1 fails, or holds for the wrong coefficient condition. Claim
    (A) is wrong; the record is superseded.
  - A constructed deg_{u_i} T_m differs from (2r)^{m-1}. Claim (B) is wrong; every cost prediction
    resting on it is void.
  - T_m at r = 1 is not equal to S_{m+1}. The norm construction is wrong and no comparative number
    may be reported.
  - The r = 1 ratio is systematically different from 1.00. Instrument defect; the sweep is blocked.
  - Within-family variation over b exceeds between-family variation. r is not the controlling parameter,
    H-SCALE is refuted, and the record's headline becomes that the effect is curve-specific rather
    than |Aut|-driven.
  - The three families cannot be generated over a common p with prime N. A FEASIBILITY outcome; the
    design falls back to matched field size with p as an additional covariate, and the weakening is
    recorded rather than hidden.
  - (3,3) cannot be constructed or solved in budget. An INFRASTRUCTURE outcome under AGENTS.md rule
    5, recorded with its memory number, and admissible as support for the crossover only under that
    label.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
