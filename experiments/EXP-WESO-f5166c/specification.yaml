experiment:
  id: EXP-WESO-f5166c
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-WESO-9dc201
  question_id: RQ-WESO-8aff57
  goal_id: GOAL-P13-001
  title: >-
    Review-required contract: exhaustive toy-scale measurement of the
    conjugate-degree density rho_p(Y), with an exact class-number positive
    control, a matched random null, a class-number arm that runs before any curve
    is built, and a small-CM nearby-object control

  objective: >-
    If separately approved, frozen and authorised, measure
    delta(E) = min{deg phi : 0 != phi in Hom(E, E^{(p)})} for EVERY supersingular
    elliptic curve over F_{p^2} at three toy primes, obtain the exact empirical
    density rho_p(Y) on the full integer grid 1 <= Y <= floor((p/2)^{1/3}), and
    decide between the two competing pre-registered exponents 3/2 (the
    class-number derivation of H-WESO-9dc201) and 2 (the generic rank-4 lattice
    heuristic) at the scale reached. Report the local slopes, not only a global
    fit, and report every control before the headline number.

  what_this_is_not:
    - Not an attack, an ECDLP or isogeny computation, a key recovery, or a claw search.
    - Not a validation or refutation of Heuristic 1. Heuristic 1 concerns the SMOOTHNESS of the minimal degree; this contract measures its SIZE. The two are different functionals of the same object and no arm here bears on the former.
    - Not a per-entry cost measurement. No value, estimator, bracket or margin row from EXP-PEC-6be870, EXP-PEC-49c773, EV-PEC-2e67ff or EV-PEC-857664 is used, cited as support, or contradicted.
    - Not evidence about GOAL-P13-001 completion criterion 1, which concerns an empirical per-entry calibration that no arm here touches.
    - Not a cryptographic-scale measurement, not an asymptotic certification, and not an exponent claim of any kind.
    - Not approval, freezing, execution authorisation, a run, an observed output, or evidence. No run has happened.

  claim_ceiling:
    tier: toy
    exact_supportable_scope: >-
      A successful run could support, at most: "over the complete supersingular
      populations at p in {1019, 10007, 100003} (F_{p^2}, p = 3 mod 4), with
      delta computed exactly over all degrees up to floor((p/2)^{1/3}) using
      fetched modular polynomials for every prime l up to that ceiling, the
      empirical density rho_p(Y) has least-squares log-log slope a_hat = <value>
      with local slopes in <range>, against the pre-registered competing values
      3/2 and 2." NOTHING FURTHER. The largest prime here is 10^5 against a
      cryptographic p of 2^256; the fitting range spans about one decade in Y;
      and the p^{o(1)} factors in the derivation are of the same order as the
      effect at these sizes. A measured 1.5 is CONSISTENT WITH an asymptotic 3/2
      and does not establish it, and no downstream record may raise this tier
      (AGENTS.md rule 7).

  inputs:
    ladder_primes: [1019, 10007, 100003]
    prime_selection_rule: >-
      The three primes are FROZEN BY ENUMERATION HERE, not by a search rule, so
      there is no selection freedom: they are the smallest primes congruent to
      3 mod 4 exceeding 10^3, 10^4 and 10^5 respectively, and each is verified
      prime and verified = 3 mod 4 at setup, with the verification recorded. If
      any fails verification the cell terminates as CONSTRUCTION_FAILURE; no
      substitute prime may be chosen.
    field_model: >-
      F_{p^2} = F_p[i]/(i^2 + 1). Valid exactly because p = 3 mod 4 makes -1 a
      non-residue; the non-residuosity of -1 is CHECKED at setup by Euler's
      criterion and recorded, not assumed from the congruence.
    seed_curve_j: 1728
    seed_curve_justification: >-
      j = 1728 is supersingular when p = 3 mod 4. This is checked at setup by an
      independent route -- counting points on y^2 = x^3 + x over F_p by Legendre
      symbols and verifying the trace is 0 -- and the check is a required
      artifact. A recalled fact used as a seed without verification would
      silently corrupt the entire enumeration.
    degree_ceiling_rule: "C_p = floor((p/2)^(1/3)), computed in exact integer arithmetic by binary search on c^3 <= floor(p/2)"
    degree_ceiling_values_expected: {1019: 7, 10007: 17, 100003: 36}
    degree_ceiling_values_note: >-
      Computed in this session and recorded here so that a mismatch at setup is
      detected immediately. The run recomputes them and halts on disagreement.
    isogeny_primes_rule: "all primes l <= C_p"
    y_grid: "every integer Y in [1, C_p]"
    modular_polynomial_provenance:
      route: >-
        Phi_l coefficients are FETCHED from
        https://math.mit.edu/~drew/modpolys/jfiles/phi_j_%d.txt, the same route
        this goal's own BATCH-002 and BATCH-003 runs used and recorded.
      required_record_per_l: "URL, UTC timestamp, HTTP status, byte length, SHA-256, coefficient count, and the SHA-256 of the reduced coefficient array mod p"
      prohibition: >-
        HARDCODING ANY MODULAR POLYNOMIAL COEFFICIENT FROM RECOLLECTION IS
        FORBIDDEN AND IS AN INVALIDATION CONDITION. A recalled coefficient that
        is silently wrong corrupts the enumeration in a way no downstream control
        detects. If a fetch fails, that l is recorded as an infrastructure
        obstruction and the affected cell reports a TRUNCATED degree ceiling; it
        is never filled by a remembered value.
      offline_fixture: >-
        For l in {2, 3, 5, 7} the reduced coefficient arrays are additionally
        stored verbatim as an artifact so a third party can re-run the smallest
        cell without network access.
    seed_derivation_rule: >-
      The measurement is DETERMINISTIC AND EXHAUSTIVE and uses no randomness at
      all in the primary arm; there is no seed and no sampling, which is why the
      counts are exact integers. Randomness enters ONLY in the matched-null arm
      (C-NULL), whose stream is defined as: for null index n, draw
      int(SHA256("EXP-WESO-f5166c/v1|null|" + decimal(p) + "|" + decimal(Y) +
      "|" + decimal(n))) big-endian unsigned, reduce modulo #S_p, and take that
      index into the canonical ordering of S_p. Rejection on repeats; the
      canonical ordering of S_p is by the pair (lift of the F_p-part, lift of the
      i-part) of each j, ascending, and its SHA-256 is committed.
    null_replicates_per_cell: 200

  arms_and_controls:
    treatment: >-
      ARM T. Enumerate S_p exhaustively by breadth-first search from j = 1728
      through the roots of Phi_2(j, X) in F_{p^2}; for every j in S_p compute
      delta(j) as the least d <= C_p such that j^p lies in the degree-d ball of j,
      the ball being generated by composing l-isogeny steps for primes l <= C_p
      in a canonical multiplicative order. Report the exact integer counts
      N(d) = #{j : delta(j) = d} and the exact rational rho_p(Y) =
      (sum_{d<=Y} N(d)) / #S_p at every Y in the grid.
    measured_null: >-
      ARM C-NULL (matched random subset, forced value pre-derived, CAN FAIL). At
      each Y, form a uniformly random subset R of S_p of cardinality exactly
      equal to the measured mean degree-<= Y ball size, and count sigma-collisions
      within R, where a sigma-collision is a pair (j1, j2) in R with j2 = j1^p.
      FORCED EXPECTATION, DERIVED BEFORE THE RUN: E[#collisions] = |R|^2 / #S_p
      by linearity over ordered pairs, since sigma is a fixed involution and R is
      uniform. At the operating point |R| ~ p^{1/3} and #S_p ~ p/12 this is of
      order 12 p^{-1/3}, i.e. essentially zero AND DECAYING ACROSS THE LADDER AT
      EXPONENT -1/3. The null fails if the measured collision count is at the
      structural rate, or if it does not decay across the three primes -- the
      latter being the canonical artifact tell of inventor-protocol section 3.
    ordering_control: >-
      C-ORDER. The class-number arm (C-CLASS), the positive control (C-ANCHOR1),
      the bound control (C-ANCHOR2) and the null (C-NULL) are computed, written
      and hash-committed BEFORE the treatment's rho_p table is computed or looked
      at, and the commitment digests are required artifacts. Absence of the
      pre-commitment is invalid_measurement. Rationale: the deciding comparison
      is between two pre-registered exponents, and a controls-after-treatment
      order would allow the controls to be calibrated against the answer.
    positive_control: >-
      C-ANCHOR1 (the control the instrument MUST pass; exact, free, cannot be
      passed by accident). The set {j in S_p : delta(j) = 1} must equal exactly
      {j in S_p : j in F_p}, and its cardinality must equal, INTEGER FOR INTEGER,
      the count obtained by a DISJOINT code path: the number of reduced binary
      quadratic forms of discriminant -p (p = 3 mod 4) or -4p, per the standard
      correspondence, computed by direct enumeration of (a, b, c) with
      b^2 - 4ac = D, |b| <= a <= c, and the boundary conventions recorded
      explicitly. IF C-ANCHOR1 FAILS, THE ENUMERATION IS BROKEN AND NO RESULT --
      IN PARTICULAR NO NEGATIVE RESULT ABOUT rho_p -- MAY BE REPORTED FROM THAT
      RUN.
    bound_control: >-
      C-ANCHOR2. max over j in S_p of delta(j) must be <= C_p at every ladder
      prime, by the frozen paper's Theorem 1.5. DISAMBIGUATION RULE, FIXED HERE
      BEFORE THE RUN AND NOT SELECTABLE AFTERWARDS: a violation is treated FIRST
      as an enumeration defect. It must be reproduced by an independent
      recomputation of that single curve's conjugate-degree by a different method
      (direct search over all degrees d <= C_p via composed Phi_l root tests,
      implemented separately) before any sentence about Theorem 1.5 is drafted;
      and even a reproduced violation is routed to ESCALATION under AGENTS.md
      rule 12, never to a claim, because contradicting an external theorem is a
      breakthrough-tier assertion and that tier is unavailable in this harness.
    class_number_arm: >-
      C-CLASS (runs FIRST, needs no curve, and can terminate the whole contract).
      For every ladder prime and every d <= C_p, compute h(-4pd) by counting
      reduced binary quadratic forms, and test (i) SUM_{d<=Y} h(-4pd) against
      (2/3) Y^{3/2} p^{1/2} over the Y grid, and (ii) HW-2's trend test: fitted
      slope of log(N_exact(d)) - log(h(-4pd)) against log d, where N_exact(d) is
      the treatment's count of curves with an isogeny of degree exactly d to the
      conjugate. Part (i) needs no curve at all and runs before any fetch; part
      (ii) is computed after the treatment but REPORTED BEFORE the global fit.
    nearby_object_control: >-
      C-CM. Restrict the fit to the small-CM sub-population -- j = 0 (when
      supersingular, i.e. p = 2 mod 3) and j = 1728, together with their
      degree-<= 2 neighbourhoods -- and report a_hat there beside the global
      a_hat. NO FORCED VALUE IS DECLARED, because none is derivable. The control's
      purpose is discriminative: if the restricted a_hat equals the global a_hat
      to within 0.05 on a population selected for anomalous class number, the fit
      is responding to ball geometry rather than to arithmetic and the mechanism
      is NOT identified even if the global fit passes. This is the
      nearby-object-where-the-conclusion-fails audit of inventor-protocol
      section 8, and it is the arm most likely to be quietly dropped for being
      inconvenient, which is why it is named as a completion-gate item.
    graded_control: >-
      C-SLOPE. Report the local slope d log rho / d log Y at EVERY interior grid
      point (at least 5 interior points at p = 1019, 15 at 10007, 34 at 100003)
      together with their spread, BEFORE any global fit is reported. Required
      readout: monotonicity of rho_p in Y (a violation is an enumeration bug, not
      a finding) and the spread of local slopes against the 0.5 gap between the
      competing exponents. If the spread exceeds 0.5, the pre-registered verdict
      is "no single power law over this range" -- a legitimate outcome, not a
      failure.
    comparability_policy: >-
      Cross-contract comparison with EXP-PEC-6be870, EXP-PEC-49c773,
      EXP-P13-NC2b, EXP-P13-NC2d, EXP-P13-NC36 or EXP-WESOVOW-001 is FORBIDDEN.
      Different objects, different observables, different scales. Any comparison
      requires a separately registered comparator contract naming both domains,
      both instruments, the comparison statistic, the expected relation and the
      failure disposition.

  metrics:
    primary:
      - "a_hat: least-squares slope of log rho_p against log Y over the full interior grid, per ladder prime, with residuals."
      - "The exact integer table N(d) for every d <= C_p, and the exact rational rho_p(Y) at every grid Y."
      - "Local slopes d log rho / d log Y at every interior grid point, with their spread."
    secondary:
      - "C-ANCHOR1: enumerated |{delta = 1}| beside the independently computed class number, as two integers."
      - "C-ANCHOR2: max delta beside C_p, as two integers."
      - "C-CLASS(i): SUM h(-4pd) beside (2/3) Y^{3/2} p^{1/2} at every Y."
      - "C-CLASS(ii): fitted slope of log N_exact(d) - log h(-4pd) against log d, with its standard error."
      - "C-NULL: measured sigma-collision counts beside their forced expectations, per prime, with the decay exponent across the ladder."
      - "C-CM: restricted a_hat beside the global a_hat."
      - "Competing-model fit: the exponent-2 model's residuals on the identical grid, reported beside the exponent-3/2 fit."
      - "#S_p exact, beside p/12 and its exact p mod 12 correction."
      - "Modular polynomial provenance block: per l, URL, UTC timestamp, HTTP status, byte length, SHA-256."

  preregistered_prediction:
    quantity: "a_hat at the largest completed ladder prime"
    formula: "rho_p(Y) = c * Y^a * p^{-1/2}; a is claimed to be 3/2"
    source: >-
      Derived in H-WESO-9dc201 mechanism steps (2) and (3) from an Eichler
      optimal-embedding count and Siegel's class-number law, and independently
      forced by the two exact anchors rho_p(1) = p^{-1/2+o(1)} and
      rho_p((p/2)^{1/3}) = 1. The competing value a = 2 is the generic rank-4
      lattice heuristic and is fitted on the same grid.
    admissible_band: [1.35, 1.65]
    competing_value: 2.0
    decision_rule: >-
      a_hat inside [1.35, 1.65] with C-ANCHOR1, C-ANCHOR2, C-NULL and C-SLOPE all
      passing SUPPORTS the density law at toy scale. a_hat outside the band with
      those controls passing REFUTES it over the tested range and the measured
      value supersedes 3/2 in every downstream statement. Any control failure
      voids the arm entirely and no direction may be reported.

  replication:
    seeds: >-
      The primary arm is deterministic and exhaustive: there is no seed, and
      replication means recomputation, which must be bit-identical. The null arm
      uses the SHA-256 stream defined in inputs.seed_derivation_rule with null
      indices n = 0..199 per (p, Y) cell; the full seed list is derived from that
      rule and is reproducible by a third party from this specification alone.
    determinism_check: >-
      Each ladder prime's treatment arm is computed TWICE, by the same code with
      the traversal order of the breadth-first search reversed, and the two runs
      must produce byte-identical N(d) tables. A mismatch is invalid_measurement.
    planned_runs: 1
    interpretation: >-
      One run is a toy-scale instrument readout on a complete population. It
      cannot by itself support any asymptotic claim, any cost claim, or any
      statement about Heuristic 1.

  budget:
    maximum_runs: 1
    maximum_wall_seconds: 14400
    maximum_cpu_seconds: 43200
    maximum_peak_rss_bytes: 8589934592
    maximum_total_disk_bytes: 4294967296
    maximum_workers: 1
    network: >-
      Permitted ONLY for the modular polynomial fetches at the recorded URLs.
      Every request is logged with URL, UTC timestamp, HTTP status, byte length
      and SHA-256. No other network access is permitted.

  execution_order:
    - "S0. Environment record: python version, numpy version, and explicit recorded results of `import sympy` and `import sage` (both expected to FAIL; the session that wrote this contract measured numpy 2.4.6 present, sympy and SageMath absent, and the contract requires the run to re-measure rather than inherit)."
    - "S1. C-CLASS part (i): the pure class-number arm, at all three primes. NO CURVE IS BUILT. This stage can terminate the contract (see stopping_rules SR1)."
    - "S2. Setup verification: primality and p mod 4 for each ladder prime; non-residuosity of -1; supersingularity of j = 1728 by an independent point count; exact C_p by integer binary search against the expected values recorded in inputs."
    - "S3. Modular polynomial acquisition with the full provenance block; offline fixture for l in {2,3,5,7}."
    - "S4. Enumerate S_p; record exact #S_p against p/12 and its p mod 12 correction; commit the canonical ordering digest."
    - "S5. C-ANCHOR1 and C-ANCHOR2. Both are computed and hash-committed here, BEFORE any rho_p table exists."
    - "S6. C-NULL at every Y, hash-committed before the treatment table is examined."
    - "S7. ARM T: delta for every curve; the N(d) table; the determinism recomputation."
    - "S8. C-CLASS part (ii) trend test, reported before any global fit."
    - "S9. C-SLOPE local slopes, reported before any global fit."
    - "S10. a_hat and the competing exponent-2 fit, both on the identical grid."
    - "S11. C-CM restricted fit."
    - "Deviation from this order requires a versioned protocol_amendment or a superseding contract. A dispatch handoff may NOT direct a different order, a different tolerance, a different window, a different estimator or a different prediction (INCIDENT-20260802-P13-03, whose remedy this clause implements)."

  terminating_stage: >-
    S1. The class-number arm needs no curve, no modular polynomial, no network
    and no elliptic-curve code, and it tests the derivation's own arithmetic
    directly. If SUM_{d<=Y} h(-4pd) does not follow (2/3) Y^{3/2} p^{1/2} within
    tolerance, the derivation is refuted before anything expensive is built and
    the contract stops there, having cost minutes.

  stopping_rules:
    - "SR0. Do not execute unless this contract is separately approved, frozen, archived, and execution-authorised, and unless GOAL-P13-001 has received the explicit budget amendment its own next_action requires."
    - "SR1. Stop at S1 if the class-number arm's fitted exponent in Y differs from 3/2 by more than 0.15 at every ladder prime. Report the measured exponent; do not proceed to curve work."
    - "SR2. Stop at S5 if C-ANCHOR1 fails at any prime. Report the two integers and the discrepancy; report NOTHING about rho_p."
    - "SR3. Stop and escalate at S5 if C-ANCHOR2 is violated and the violation survives independent recomputation."
    - "SR4. Stop at S6 if C-NULL returns collisions at the structural rate."
    - "SR5. Truncate the ladder rather than exceeding the budget: report the primes completed and mark the rest UNATTEMPTED. A truncated ladder reports what it covered; it does not fail."
    - "SR6. Stop if a modular polynomial fetch fails and no offline fixture covers it. Record as an infrastructure obstruction with URL, status and timestamp."

  invalidation_rules:
    - "Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false."
    - "Any modular polynomial coefficient not traceable to the recorded provenance block or to the committed offline fixture."
    - "Any control computed or examined after the treatment table, in violation of C-ORDER."
    - "Any floating-point value entering C-ANCHOR1, C-ANCHOR2 or the N(d) table; those are exact integer computations."
    - "Any missing determinism recomputation, or any mismatch in it."
    - "Any deviation from execution_order without a versioned protocol_amendment."
    - "Any comparison against another contract's artifacts without a registered comparator."

  infrastructure_failure_disposition: >-
    A timeout, crash, out-of-memory, failed fetch, missing dependency, or absent
    library is an INFRASTRUCTURE OUTCOME and is NEVER negative mathematical
    evidence about H-WESO-9dc201, about rho_p, about Theorem 1.5, or about any
    proposition in GOAL-P13-001 (AGENTS.md rule 5). It is recorded with its
    cause, its stage, and its exact error, and the affected cell is reported as
    UNATTEMPTED rather than as measured. This goal has already lost one lane
    (NC-3/NC-6) to an environment failure and that record stands unretracted;
    this contract is deliberately built from Python and numpy alone, both
    verified present, so that the same failure mode has no purchase.

  scale_relevance:
    tier: toy
    transfer_argument: >-
      NONE IS CLAIMED FOR THE MEASURED NUMBERS. The ladder reaches p = 10^5
      against a cryptographic p of 2^256, and the fitting range spans about one
      decade in Y. What DOES transfer is the ALGEBRA: the correspondence
      theta^2 = -pd, the class-number sum, and the two anchors are p-independent
      statements, and the toy measurement is a CHECK OF A DERIVATION at the only
      scale where the population can be enumerated exhaustively -- step 1 of the
      validation ladder in inventor-protocol section 6, explicitly not step 2 and
      not step 3.
    stated_limit: >-
      A toy fit of 1.5 is consistent with an asymptotic 3/2 and does not
      establish it. A toy fit of 2.0 would additionally contradict the exact
      anchor C-ANCHOR1 measured in the same run, which is why the anchor, not the
      fit, carries the discriminating weight.

  required_artifacts:
    - "Frozen approved specification and a freeze receipt binding its SHA-256."
    - "Environment record including the explicit import results for numpy, sympy and sage."
    - "Modular polynomial provenance block, per l, and the offline fixture for l in {2,3,5,7}."
    - "The canonical ordering of S_p and its SHA-256, per prime."
    - "The exact integer N(d) table, per prime, from both traversal orders."
    - "Pre-treatment hash commitments for C-CLASS, C-ANCHOR1, C-ANCHOR2 and C-NULL, with timestamps establishing the ordering."
    - "Local slope table, global fits under both competing exponents, and C-CM restricted fit."
    - "Command, stdout, stderr, timing, peak RSS, git commit and dirty-tree state, and the resolved model/policy block per AGENTS.md artifact policy."
    - "An explicit statement of every stage NOT reached and why."

  success_criterion: >-
    This contract has NO current success outcome because it is not authorised for
    execution; its only present disposition is review_required. If a later,
    separately approved and frozen successor is executed, its positive
    disposition is: all three ladder primes completed; C-ANCHOR1 exact at every
    prime; C-ANCHOR2 satisfied at every prime; C-NULL within its forced
    expectation and decaying across the ladder; the determinism recomputation
    bit-identical; C-CLASS(i) and C-CLASS(ii) reported before any global fit;
    C-SLOPE reported with its spread; and a_hat reported with its residuals
    beside the competing exponent-2 fit and beside the C-CM restricted fit. THAT
    DISPOSITION IS AN INSTRUMENT READOUT AND ESTABLISHES NO ATTACK, NO COST, NO
    EXPONENT, NO CRYPTOGRAPHIC-SCALE CONCLUSION, AND NOTHING ABOUT HEURISTIC 1.

  falsification_criterion: >-
    H-WESO-9dc201's density law (H-A) is REFUTED OVER THE TESTED RANGE if, with
    C-ANCHOR1, C-ANCHOR2, C-NULL and the determinism check all passing, a_hat
    falls outside [1.35, 1.65] at the largest completed prime, OR if C-CLASS(ii)
    returns a trend slope differing from 0 by more than 0.15. It is refuted as a
    SINGLE POWER LAW if C-SLOPE's local-slope spread exceeds 0.5, in which case
    the frontier statement (H-C) must be restated piecewise or withdrawn. Each
    refutation closes exactly the tested scope -- three toy primes, degrees up to
    floor((p/2)^{1/3}), one instrument lineage -- and none of them licenses any
    statement about the asymptotic exponent (AGENTS.md rule 6).

  outcomes:
    no_execution_authorization: >-
      The only current disposition: a review_required draft. No run, no evidence,
      no mathematical inference, and no status change to any record.
    future_toy_readout: >-
      Only after separate approval, freezing, authorisation and valid execution;
      scoped toy-only, never an attack claim and never a statement about
      Heuristic 1.
    planned_negative: >-
      A refutation of the density law at toy scale is a FIRST-CLASS DELIVERABLE,
      but only if it ships with its exact tested boundary, the measured exponent
      that replaced 3/2, the named obstruction, and a concrete successor or
      revisit condition. A negative without those HAS NOT FINISHED; a count of
      what did not work is a fatigue report, not a closure
      (inventor-protocol section 4).
    infrastructure_or_integrity_failure: >-
      Inconclusive infrastructure signal, never evidence against H-WESO-9dc201,
      against Theorem 1.5, or against any proposition in GOAL-P13-001.

  approval_requirements:
    - "Independent review confirms that C-ANCHOR1's two code paths are genuinely disjoint and that its failure genuinely voids the run."
    - "Independent review confirms that C-NULL can actually fail, and that its forced expectation is derived rather than fitted."
    - "Independent review confirms the C-ORDER pre-commitment is enforceable from the artifacts alone."
    - "Coordinator separately approves and freezes a successor contract without editing this draft."
    - "GOAL-P13-001 receives the explicit budget amendment its own next_action requires; this contract does not and cannot self-authorise a batch."
  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved and only the Coordinator may approve it (AGENTS.md rule 1).
