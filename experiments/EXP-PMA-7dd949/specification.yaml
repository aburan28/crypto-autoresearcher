experiment:
  id: EXP-PMA-7dd949
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-fbe304; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-fbe304
  question_id: RQ-PMA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exhaustive enumeration of all 3x3 matrices over F_3, F_5 and F_7 to compute the complete
    image of the principal-minor map, its fiber-size histogram, and its density against a degree-matched
    random-map null
  objective: 'The one uncertainty a run reduces is: what does the realizable set of principal-minor
    tables actually look like at the smallest size where it can be computed in full, and does it differ
    measurably from a structureless map of the same shape. Concretely: (i) it fixes the exact cardinality
    and density of the image of the 3x3 principal-minor map over each of F_3, F_5 and F_7, replacing
    an unknown with three integers that no later session needs to recompute; (ii) it fixes the fiber-size
    histogram, which is the quantitative content of the lossy-projection test for this object -- how
    much matrix information the principal-minor projection actually discards, per table, rather than
    as an assertion; (iii) it decides whether that image is distinguishable at all from the image
    of a degree-matched and arity-matched random polynomial map, which is the null-object control
    required before any structural reading of the census is permitted. The run reduces no uncertainty
    about n = 4, about k(t), about the divisor-parity predicate, or about any cryptographic quantity,
    and the contract must not be read as reducing any of those. A secondary and explicitly subordinate
    outcome is an instrument: the stored image sets become reusable ground truth for scoring any future
    finite-field PMA3 predicate by set membership rather than by re-derivation.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for n = 3 and for
      each q in {3, 5, 7} individually, the exact image of the principal-minor map over F_q, its exact
      cardinality, its exact fiber-size histogram, and a comparison of its density against one declared
      degree-matched null, all verified by an exact fiber-sum accounting identity. What does NOT follow:
      nothing about n = 4 or any larger n, nothing about q outside {3, 5, 7}, nothing about infinite
      constant fields or about k(t) where RQ-PMA-001''s actual question lives, no general PMA theorem
      at any size, no statement that the observed density is a limit or a trend, and no attack, speedup,
      or security consequence of any kind.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes, human): freeze the seven-subset ordering, the field list,
      the null-map seed, and the tolerance for the density gap. STAGE 1 (cost: seconds at q=3): vectorized
      enumeration of all q^9 matrices, exact cofactor minors modulo q, accumulate tuple counts. STAGE
      2 (cost: seconds): invert to the image set and the fiber histogram; assert the fiber sum equals
      q^9 exactly; abort the whole run on any residual. STAGE 3 (cost: seconds): invariance control
      over 10^4 sampled (A, D) pairs plus transpose; second independent minor implementation on 10^3
      samples; positive-control membership on 10^4 samples. STAGE 4 (cost: same order as stage 1):
      identical enumeration for the null map, identical statistics, identical accounting assertion.
      STAGE 5 (cost: minutes): compute densities, the signal-minus-null gap, and the degenerate-table
      counts; write the run record. STAGE 6 (cost: seconds at q=5, up to tens of minutes at q=7):
      repeat stages 1 to 5 per field in ascending order, halting at the first field that exceeds its
      declared per-field budget and recording that field as the exhaustion boundary.'
    instrument: Python 3 with numpy for the vectorized enumeration and exact small-integer modular
      arithmetic (reduce after every multiply; no floating point, no library determinant). A second
      pure-Python cofactor implementation as the independent cross-check. The existing harness/runner.py
      manifest and seed discipline for run records and the inference block. No Sage, no computer algebra
      system, no external solver -- the whole point is that this needs none.
    parameters: 'n = 3 fixed. q in {3, 5, 7}, run in ascending order. Domain sizes 19683, 1953125,
      40353607. Candidate-table space sizes q^7 = 2187, 78125, 823543. Sample sizes: 10^4 matrices
      per field for the membership positive control, 10^4 (A, D) pairs per field for the invariance
      control, 10^3 matrices per field for the independent-implementation cross-check. Null map: seven
      fixed random polynomials, one per nonempty subset S, of total degree |S| in the nine matrix
      entries, drawn once per field from a declared seed and stored verbatim in the run record. Density-gap
      tolerance: factor 1.5. Per-field wall-clock cap: 300 s at q = 3 and q = 5, 3600 s at q = 7.
      Peak memory cap: 8 GB.'
  controls:
  - 'Null-object arm: shape-matched random polynomial map of identical arity and coordinate degrees,
    run in the same invocation over the same enumeration, with the identical statistics computed by
    the identical code path.'
  - 'Accounting control: sum of fiber sizes equals q^9 exactly, checked per field before any statistic
    is reported.'
  - 'Invariance control: A, D A D^{-1}, and A-transpose must produce byte-identical tuples on 10^4
    sampled matrices per field.'
  - 'Positive control: 10^4 uniformly sampled matrices per field must each have their computed tuple
    present in the stored R_3(q); a miss is a census bug.'
  - 'Independent minor implementation: a second, slower, obviously-correct cofactor implementation
    recomputes the tuple for 10^3 sampled matrices per field and must agree exactly with the vectorized
    one.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The identical enumeration and identical statistics are run against
    a shape-matched null: the map A maps to (f_S(A) for the seven nonempty S), where each f_S is a
    fixed uniformly random degree-|S| polynomial in the entries of A drawn once from a declared seed,
    matching the principal-minor map in output arity, in coordinate degrees, and in field. The null
    must show a substantially LARGER image density and a substantially FLATTER fiber-size histogram
    than the signal arm. If the null reproduces the signal arm''s density and histogram within the
    declared tolerance, then no property specific to principal minors has been measured and the census
    is recorded as a controlled null: informative about arity and degree only.'
  independent_variables:
  - constant field q in {3, 5, 7}
  - 'arm: signal (principal-minor map) versus null (degree-matched random polynomial map)'
  - 'minor implementation: vectorized versus independent pure-Python reference'
  metrics:
    primary:
    - image cardinality |R_3(q)| per field and per arm
    - image density |R_3(q)| / q^7 per field and per arm
    - fiber_size_accounting_residual per field and per arm (must be exactly 0)
    - density_gap_signal_minus_null as a ratio per field
    - fiber-size histogram per field and per arm
    secondary:
    - count of realizable tables containing at least one zero entry, per field
    - diagonal_conjugation_invariance_violations and transpose_invariance_violations
    - independent_implementation_disagreements
    - per-field wall clock and peak memory
    - gauge-orbit-normalised fiber histogram (fiber size divided by the free-orbit size (q-1)^2 times
      2 for transpose where the action is free)
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The exact fiber-sum accounting identity, and the ordering of signal density below null
      density by at least a factor of 1.5 at q = 5 and q = 7.
    formula: 'sum over all realizable tuples p of fiber(p) equals q^9 exactly, for each field and
      each arm, where fiber(p) is the number of matrices A over F_q with (det A[S,S])_S equal to p
      over the seven nonempty S. And: density_null / density_signal at least 1.5 at q = 5 and q =
      7, where density equals |image| / q^7. No numeric prediction is made for density_signal itself,
      by explicit refusal recorded in the proposal.'
    source: Pre-registered in the parent proposal IDEA-20260816-fbe304 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are exactly n = 3 and q in {3, 5, 7}: 19683, 1953125 and 40353607
      matrices respectively, all enumerated in full with no sampling in the primary arm. NO transfer
      or extrapolation assumption is made -- not to larger q, not to n = 4, not to characteristic
      0, and above all not to k(t), which is where RQ-PMA-001''s question lives and where a finite
      enumeration has no purchase. The three fields are reported as three separate facts, and any
      trend across them is descriptive only.'
    correspondence: null
  tail_checks:
  - Tables containing a zero minor are counted and reported separately; the density is reported both
    including and excluding them.
  - The largest and smallest fibers are inspected individually and their matrices printed, to confirm
    the extremes are the gauge orbit and not an artifact.
  - 'The null arm is checked for a degenerate draw: any f_S identically zero on the domain triggers
    a recorded redraw under the declared rule.'
  - Tables realizable only by singular matrices are counted separately from those realizable by invertible
    ones.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt the entire run immediately and report no statistics if the fiber-sum accounting residual
    is nonzero for any field or arm.
  - Halt at the first field exceeding its per-field wall-clock or memory cap; record that field as
    the exhaustion boundary and report results only for completed fields.
  - Halt if the independent minor implementation disagrees with the vectorized one on any sampled
    matrix.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: For at least q = 3 and q = 5, both arms complete with an exactly zero fiber-sum
    accounting residual, all five controls pass, and the image cardinality, density and fiber histogram
    are stored in full for each arm.
  falsification_criterion:
  - Nonzero fiber-sum accounting residual in any completed field or arm.
  - Any sampled matrix whose tuple is absent from the stored image set.
  - Any invariance violation under diagonal conjugation or transpose.
  - Any disagreement between the two minor implementations.
  - 'Signal and null densities within a factor of 1.5 at both q = 5 and q = 7 with statistically indistinguishable
    fiber histograms: recorded as a controlled null, meaning the census measured arity and degree
    rather than principal-minor structure.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-fbe304
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must fix the exact construction rule for the null map's random polynomials (monomial
    support, coefficient distribution, and whether the degree is total or per-variable), since the
    density gap is entirely sensitive to it.
  - The Coordinator must decide whether singular matrices are included in the primary enumeration
    or reported only as a tail check; the density changes materially either way.
  - The gauge-orbit normalisation needs an explicit rule for matrices where the diagonal-conjugation
    action is not free (matrices with zero off-diagonal blocks), which are exactly the ones with the
    smallest orbits.
  - Budget for q = 7 needs a pilot timing before approval; 4.04e7 by 7 exact minors is the only stage
    with real uncertainty.
