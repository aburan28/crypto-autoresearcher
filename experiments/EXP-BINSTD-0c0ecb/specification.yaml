# EXP-BINSTD-0c0ecb
# Yield-band arithmetic. No curve.
# Approved by DEC-20261002-9058ca.
experiment:
  id: EXP-BINSTD-0c0ecb
  hypothesis_id: H-BINSTD-291fd7
  source_idea: IDEA-20261001-0fcbe2
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Yield-band gaps on three degrees
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-9058ca
  objective: >-
    Check the cross gaps 13, 19 and 27, the size gap 1, and the
    slot count 240.
  inputs:
    band_num: 5
    band_den: 4
    n17: 17
    gap17: 13
    square17: 289
    n23: 23
    gap23: 19
    square23: 529
    n31: 31
    gap31: 27
    square31: 961
    dim_lo: 3
    dim_hi: 4
    size_lo: 8
    size_hi: 16
    size_gap: 1
    cell_count: 6
    targets: 40
    slots: 240
  controls:
    - >-
      Five times 17 minus four times 18 is 13. Reporting five over
      four equal to 18 over 17 invalidates the run.
    - >-
      Two to the 3 is 8 and two to the 4 is 16. Reporting the
      matched-size ratio as five over four invalidates the run.
    - >-
      The gaps at 23 and 31 are 19 and 27. Six times 40 is 240.
    - >-
      The squares are 289, 529 and 961. They are not a measured
      speedup.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - degree in {17, 23, 31}
    - route in {cross_multiply, size_and_slots}
  metrics:
    primary:
      - gap17
      - size_gap
      - implementations_agree
    secondary:
      - gap23
      - gap31
      - slots
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The cross gaps are 13, 19 and 27. The matched-size gap is 1.
      The slot count is 240.
    formula: >-
      Subtract four times (n plus 1) from five times n. Separately
      compare two to the 3 with two to the 4, and multiply six by 40.
    source: >-
      IDEA-20261001-0fcbe2 states the band 1.25, at least 40 targets,
      and dimensions 3 and 4 on degrees 17, 23 and 31, read
      2026-10-02. The products were recomputed in this design
      session. That computation is not a run. No curve was built.
  scale_relevance:
    tier: toy
    justification: Three degrees and two dimensions. No transfer to a solver.
    correspondence: null
  tail_checks:
    - The gaps 19 and 27 and the three squares are required. A check that stops at the gap 13 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the gap 13 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The gap at 17 is not 13.
    - Five over four is reported equal to 18 over 17.
    - The matched-size ratio is reported as five over four.
    - A curve is built or a success is counted.
  success_criterion: >-
    Both runs agree that the gaps are 13, 19 and 27, that the
    matched-size gap is 1, that the slot count is 240, and that the
    squares are 289, 529 and 961.
  falsification_criterion: >-
    The runs agree that two to the 3 is 8, and the cross gap at 17
    is not 13.
  required_artifacts:
    - experiments/EXP-BINSTD-0c0ecb/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-0c0ecb/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-0c0ecb/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-0c0ecb/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-0c0ecb/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-0c0ecb/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any curve, factor base, or success count.
    - Any claim that a closed subspace is richer.
    - Any measured speedup.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
