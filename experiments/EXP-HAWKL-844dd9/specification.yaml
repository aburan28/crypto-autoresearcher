experiment:
  id: EXP-HAWKL-844dd9
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-ddee51; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-ddee51
  question_id: RQ-HAWK-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Apply the unconditional reduction's dimension-halving construction to every element of a
    bounded re-randomisation orbit and measure the achieved exact-SVP instance dimension distribution
    against a trivial-orbit baseline and an unstructured null.
  objective: 'The one uncertainty a run reduces is whether the re-randomisation mechanism that survived
    its cost correction interacts at all with the heuristic-free reduction that this corpus records
    as the incumbent route. Concretely: (i) whether the reduction''s dimension-halving construction
    can be reconstructed from committed records well enough to reproduce the recorded exact-SVP dimension
    n/2+1 on a toy HAWK-shaped instance - a baseline reproduction in the sense of inventor-protocol
    section 8 item 1, whose failure ends the contract with a list of unreconstructible steps as its
    output; (ii) if it reproduces, what the distribution of achieved instance dimensions is when the
    construction is applied to every element of the conjugation orbit under all words up to a fixed
    length in a declared generating set, with the orbit-wide minimum and the number of distinct achieved
    dimensions as the primary metrics, expected to be a point mass at n/2+1; (iii) whether the construction
    depends on the module structure at all, decided by running the identical pipeline on an unstructured
    lattice of matched dimension and determinant, where a construction that succeeds would supersede
    the whole composition question. A run never solves SVP, never runs lattice reduction, never records
    a timing, and builds no cost model.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for HAWK-SHAPED instances
      at ring degrees 4, 8 and possibly 16, under one or two declared short-unimodular generating
      sets and words up to length 3, the reduction''s construction as reconstructed from committed
      records yields exact-SVP instances of dimension d over the whole orbit, with minimum d_min and
      multiplicity distribution as reported, while the unstructured null yields no valid construction.
      What does NOT follow: nothing about the COST of any exact-SVP call at any dimension; nothing
      about whether a lower dimension, if found, would be exploitable, since instance quality is discarded
      by design; nothing that verifies or reproduces the Straznickas-Weis result itself, which is
      used as relayed and not checked against its source; nothing about ring degrees or word lengths
      beyond those run; nothing that reopens KN-OPEN-028; and no statement about HAWK''s security
      in either direction.'
  inputs:
    procedure: 'STAGE 0 (cost: days of human work, zero compute). Reconstruct the dimension-halving
      construction from committed records as an explicit algorithm; list every step the records do
      not determine. Run the method-ceiling audit: does the construction factor through the isometry
      class? If provably yes, halt and report a PROVED floor, which is cheaper and stronger than the
      measurement. STAGE 1 (cost: minutes). Baseline reproduction: build one HAWK-SHAPED instance
      per ring degree by the declared rule; apply the construction to the identity word; check the
      resulting dimension equals n/2+1 exactly. Halt if not. STAGE 2 (cost: minutes). Enumerate the
      conjugation orbit under all words of length at most 3 in the declared six-element generating
      set, deduplicating by canonical form; verify each element generates the same lattice by exact
      Hermite normal form. STAGE 3 (cost: minutes). Apply the construction to every orbit element;
      record the exact rank of each resulting instance. STAGE 4 (cost: seconds). Form the dimension
      distribution; report minimum, mode and distinct-value count. STAGE 5 (cost: minutes). Unstructured
      null arm in the same invocation: same orbit-and-construct pipeline, report whether the construction
      is defined. STAGE 6 (cost: minutes). Repeat STAGES 2 to 4 with the second generating set. STAGE
      7 (cost: minutes). Emit through harness/runner.py with word lengths, orbit sizes, all dimensions,
      the unreconstructible-step list and the null result.'
    instrument: Python 3 with exact integer arithmetic; integer and cyclotomic-ring matrices as tuples
      of tuples with explicit reduction modulo X^n+1; sympy for Hermite and Smith normal forms and
      for exact rank; no floating point anywhere. No lattice reduction library, no SVP solver, no
      computer-algebra system, and specifically no Sage - the contract never solves an SVP instance,
      only constructs one and takes its rank. Instance generation follows the HAWK-SHAPED declared-rule
      discipline of H-HAWK-c7a551 and the EXP-HAWK-a2f34a lineage. Runs, seeds and manifests through
      harness/runner.py.
    parameters: Ring degrees n in {4, 8, 16} (dimensions 2n in {8, 16, 32}), giving expected exact-SVP
      dimensions n/2+1 in {3, 5, 9}. One HAWK-SHAPED instance per degree for the primary arm plus
      one alternate base point. Two declared generating sets of at most 6 short unimodular matrices
      each; all words of length at most 3 (at most 259 words per set), deduplicated. One matched unstructured
      null lattice per degree. No sample-size parameter beyond orbit size; no solver parameters, since
      no solver runs. Seeds declared in the specification.
  controls:
  - 'Method-ceiling audit first, at zero compute: does the construction factor through the isometry
    class? A yes makes the measurement a confirmation and is reported as such.'
  - 'Trivial-orbit control: conjugation by the identity alone must give exactly one dimension equal
    to the recorded n/2+1, else the baseline reproduction failed.'
  - 'Unstructured null lattice: the construction must be undefined or must fail, else it is not using
    module structure.'
  - 'Isometry check: every orbit element must generate the same lattice as the base, verified by exact
    Hermite normal form; a failure means the conjugation implementation is wrong.'
  - 'Second generating set: repeat the orbit and dimension distribution with a different declared
    generating set, since any orbit-wide statistic is defined relative to the set.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a random integral lattice of the same dimension
    2n and determinant with no module structure, put through the IDENTICAL orbit-and-construct pipeline
    in the same invocation. Two things must hold for the signal arm to mean anything. First, if the
    construction is DEFINED on the null (produces an instance of dimension n/2+1 on an unstructured
    lattice), then it is not using the module structure at all, and the entire composition question
    is about something other than module-LIP - which would be a major finding about the construction
    as this corpus records it, and would need to be reported before any signal-arm number. Second,
    if the construction is undefined on the null, that confirms module structure is a precondition
    and the signal arm''s dimension distribution is interpretable. Additionally a trivial-orbit control
    (conjugation by the identity alone) must return a single dimension equal to the recorded n/2+1,
    or the baseline reproduction has failed.'
  independent_variables:
  - orbit element (indexed by generating word)
  - ring degree n in {4, 8, 16}
  - generating set (primary versus secondary)
  - arm (HAWK-shaped module instance versus unstructured null)
  metrics:
    primary:
    - achieved exact-SVP instance dimension per orbit element
    - orbit-wide minimum achieved dimension
    - number of distinct achieved dimensions over the orbit
    - baseline reproduction dimension at the identity word, per ring degree
    secondary:
    - orbit size after deduplication, per word length
    - Hermite normal form isometry check pass rate
    - whether the construction is defined on the unstructured null
    - count of construction steps unreconstructible from committed records
    - cross-generating-set agreement of the dimension distribution
  heuristic_under_test: null
  preregistered_prediction:
    quantity: d_min(n), the minimum over the enumerated re-randomisation orbit of the dimension of
      the exact-SVP instance produced by applying the reconstructed dimension-halving construction
      to each orbit element, at ring degree n.
    formula: 'd_min(n) = min over words w of length at most 3 of rank(Construct(U_w-star G U_w)),
      where Construct is the reconstructed dimension-halving map and rank is an exact integer rank.
      Predicted: d_min(n) = n/2 + 1 for every tested n, and the number of distinct achieved dimensions
      equals 1 - i.e. a measured floor and a point mass. Any d_min below n/2+1 triggers mandatory
      independent re-derivation before reporting, per the falsification list.'
    source: Pre-registered in the parent proposal IDEA-20260816-ddee51 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Ring degrees 4, 8 and 16, matching the range already used by H-HAWK-c7a551 and
      EXP-HAWK-a2f34a, chosen because the construction and the rank computations are exact and complete
      there. These are far below deployed parameters. NO extrapolation is offered: a floor measured
      at these degrees is a floor at these degrees, on HAWK-SHAPED declared-rule instances, under
      a declared generating set and word length 3, and every one of those four scope qualifiers accompanies
      every reported number. The construction itself is relayed second-hand and unverified against
      its source, which is a further and separate scope limit.'
    correspondence: null
  tail_checks:
  - Check the identity word explicitly as its own case, since the whole baseline rests on it.
  - Check the longest words in the orbit, where the conjugating matrices are least short, and report
    whether achieved dimension varies with word length even if the overall distribution is a point
    mass.
  - Check orbit elements whose Gram entries are largest, where exact rank computations are most likely
    to be slow or to expose a reduction bug.
  - Check whether any orbit element yields a construction that fails to be defined - a partial failure
    would be as informative as the null arm's result and must be reported per element, not aggregated
    away.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt at STAGE 0 and report a PROVED floor if the method-ceiling audit shows the construction factors
    through the isometry class.
  - Halt at STAGE 1 if the baseline reproduction does not give exactly n/2+1, and report the unreconstructible-step
    list as the contract's output.
  - Halt if any orbit element fails the Hermite normal form isometry check.
  - Halt and require independent re-derivation before any reporting if d_min is found below n/2+1.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run emits, per ring degree and per generating set, the full achieved-dimension
    distribution over the deduplicated orbit with its minimum and distinct-value count, a passing
    baseline reproduction at the identity word, a passing isometry check on every orbit element, and
    the unstructured null arm's result - together with the explicit list of construction steps that
    could not be reconstructed from committed records.
  falsification_criterion:
  - The baseline reproduction fails to give n/2+1 at any tested ring degree.
  - The construction is defined and succeeds on the unstructured null lattice.
  - Any orbit element fails the Hermite normal form isometry check.
  - The dimension distribution differs between the two declared generating sets.
  - The orbit-wide minimum falls below n/2+1 (triggering mandatory independent re-derivation, not
    reporting).
  - Too many construction steps prove unreconstructible, so the contract reports a boundary rather
    than a measurement.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-ddee51
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The dimension-halving construction is relayed second-hand in this corpus; the Coordinator must
    decide whether a reconstruction from the route table and evidence records is admissible at all,
    or whether this contract waits on source acquisition for KN-LIT-7592.
  - The declared short-unimodular generating set stands in for the route's re-randomisation sampler,
    which the corpus does not hold; the Coordinator must approve the substitute and accept the resulting
    scope limit.
  - Word length 3 is chosen for enumerability, not argued sufficient; the Coordinator must decide
    whether a floor measured at that length is worth recording.
  - The method-ceiling audit in STAGE 0 may settle the question symbolically and make the run unnecessary;
    the Coordinator should require that audit's outcome before authorising any compute.
