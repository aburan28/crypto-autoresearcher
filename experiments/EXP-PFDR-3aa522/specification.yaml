experiment:
  id: EXP-PFDR-3aa522
  hypothesis_id: H-PFDR-5e230f
  question_id: RQ-ECDLP-002
  idea_id: IDEA-20260815-b4d106
  batch_id: BATCH-2eaca1
  version: 1
  recorded_at: '2026-09-04'
  drafted_under_task: TASK-20260904-b2a7e9
  batch_position: 3 of 4 (theory-gov; corpus classification, no curve, no cryptographic computation)
  title: >-
    Nine intermediate result classes fixed IN THIS CONTRACT before the
    corpus is enumerated, with field-level checklists so most of the
    classification is decidable, two polarity nulls that must separate a
    section-4 closure from a fatigue report, blind double classification
    with kappa, a field-only ablation measuring how much of the taxonomy is
    prose-driven, and a NON-ELLIPTIC-CURVE comparison population without
    which 'the ECDLP corpus reads as a run of negatives' cannot be
    distinguished from 'this program writes records that way'
  status: draft
  approved_by: null
  approved_at: null
  status_note: >-
    Written and frozen at the /design-experiment stage; NOT submitted for
    approval and NOT authorized for implementation. 'draft' is the canonical
    first state of the experiment machine in AGENTS.md ("Research states"):
    draft -> review_required -> approved -> running -> completed |
    failed_infrastructure | invalid -> analyzed -> archived. The originating
    handoff TASK-20260904-b2a7e9 initially mandated 'designed', which is not
    in that machine; the designing coordinator flagged the conflict rather
    than silently choosing, and the handoff was corrected to 'draft'.
  assigned_to: executor
  implementation_authorized: false
  implementation_authorized_note: >-
    No implementation and no execution is authorized by this record.
    Execution begins only from a Coordinator approval decision plus a
    frozen contract at this path.
  claim_ceiling: >-
    corpus classification only. No mathematical claim, no evidence about
    elliptic curves or the ECDLP, no judgement about any record's quality,
    no hypothesis or goal status change, and no inference that an empty
    class is unreachable.
  claim_tier_basis: >-
    NOT_APPLICABLE per docs/claims-and-verification.md: no cryptographic
    claim of any tier is made, no computation on mathematical content
    occurs, and no certificate kind arises. Any evidence record derived
    from this contract sets proof_status empirical_only ABOUT THE CORPUS.
  objective: >-
    Fix an explicit spectrum of intermediate result classes -- in writing,
    in this contract, before the corpus is enumerated -- and measure where
    this program's ECDLP evidence and decision records actually land on it,
    so that the campaign has a stateable target class instead of being
    scored against a break it will not reach. The result is meaningful only
    if it survives four checks: that the criteria separate a closure from a
    fatigue report, that two agents applying them agree, that most records
    are classifiable at all, and that the resulting distribution differs
    from the one the same criteria produce on records concerning no curve.
  frozen_class_definitions:
    note: >-
      THESE DEFINITIONS ARE THE FREEZING DEVICE AND ARE THE POINT OF
      WRITING THE CONTRACT FIRST. Criteria written after seeing a corpus fit
      it by construction and no downstream care recovers from that. No
      criterion may be changed after any record has been classified; a
      change requires a versioned protocol_amendment under
      experiments/EXP-PFDR-3aa522/amendments/ and reclassification from
      scratch. The classes are ORDERED BY CLAIM STRENGTH AND EXPLICITLY NOT
      BY WORTH: instrument and cost-model work is most of what this program
      can deliver and sits low on this scale by design, not by demotion.
    classes:
      - id: C0
        name: NO-RESULT
        criteria: >-
          The record reports that work was attempted and states no quantity
          with units, no tested scope, and no named boundary.
          Infrastructure failures land here by AGENTS.md rule 5 and are NOT
          negative evidence about anything.
      - id: C1
        name: INSTRUMENT
        criteria: >-
          Delivers a measurement device (meter, solver port, closure,
          certificate checker, extractor) validated against a known answer
          or a planted fixture. The deliverable is the instrument; any
          number about the target is incidental. FIELD CHECK: at least one
          blocking instrument control with a forced disposition and a
          reported pass.
      - id: C2
        name: CALIBRATED-NULL
        criteria: >-
          A signal was measured and shown to be reproduced by a null object
          of the same shape, so the claim is about the null. FIELD CHECK:
          a null-object control reported with a value comparable to the
          treatment arm, and an explicit statement of what the result is
          NOT about.
      - id: C3
        name: MEASURED-CONSTANT
        criteria: >-
          A quantity of the target measured with units, error bars and a
          stated scope. FIELD CHECK: an obstruction block per
          templates/research-records.md with statement, quantity, value
          with units, nonempty measured_by and scope all non-empty --
          which qualifies by construction -- or an equivalent
          quantity/value/units/scope quadruple elsewhere in the record.
      - id: C4
        name: CORRECTED-COST-MODEL
        criteria: >-
          A previously asserted cost expression is shown wrong or refined,
          with the corrected expression and its parameter range stated.
          FIELD CHECK: a named prior expression, a corrected expression,
          and a parameter range.
      - id: C5
        name: SCOPED-NEGATIVE
        criteria: >-
          A mechanism class shown not to deliver its claimed effect over an
          explicitly stated tested scope. FIELD CHECK: direction in
          {weakens, contradicts}, a stated tested scope, AND a C3-standard
          obstruction. A weaken with a narrative obstruction and no measured
          quantity is C0, not C5.
      - id: C6
        name: CLOSURE
        criteria: >-
          A C5 that additionally meets the inventor-protocol section 4
          standard: named obstruction, an argument, and forward guidance
          naming what remains open. FIELD CHECK: C5 satisfied PLUS a
          forward-guidance statement naming an open question or a successor
          record id.
      - id: C7
        name: CONDITIONAL-EXPONENT
        criteria: >-
          An asymptotic improvement stated conditionally on numbered
          heuristics. FIELD CHECK: the referenced hypothesis has a nonempty
          heuristic_assumptions list in which EVERY entry carries either a
          nonempty supporting_results of non-recalled provenance or a
          nonempty validation_experiment_ids, AND an asymptotic_claim
          block with claim_kind exponent_improvement.
      - id: C8
        name: BREAK
        criteria: >-
          A verified sub-baseline solve at declared parameters. FIELD
          CHECK: a certificate_refs entry naming a certificate recorded as
          independently re-verified, and a stated comparison against the
          matched baseline.
      - id: CX
        name: UNCLASSIFIABLE
        criteria: >-
          The record states a conclusion that satisfies no checklist above.
          A record that states NO conclusion is C0, not CX; the distinction
          is the single interpretive step in the whole procedure and is
          exactly what kappa and the field-only ablation measure.
    assignment_rule: >-
      A record is assigned the HIGHEST class whose checklist it fully
      satisfies. A record failing a checklist drops to the highest class it
      does satisfy; it is never assigned a class 'in spirit'. A record may
      hold exactly one class.
  inputs:
    ecdlp_population_query: >-
      Live (non-superseded) records under ledger/evidence/ and
      ledger/decisions/ whose area token is in the declared elliptic-curve
      set {ECDLP, PFDR, EQIC, ENDO, SMTH, XEDN, JPR, SDEG, RELN, ECQ, ECTD,
      TORS, JINV, ISOU, VOLC, EWALK}, executed ONCE at a commit recorded in
      the manifest and frozen as a record-id list before any record is
      classified. The area set is declared here so it cannot be adjusted to
      shape the distribution.
    noncurve_population_query: >-
      Live records under the same directories whose area token is in the
      declared NON-elliptic set {MLKEM, MLDSA, ASCON, SHATHREE, SHATWO,
      SHAONE, BLAKE, ARGON, FALCON, POLYMAC, AEADC, HQCX, FRODOFO, NTRUL},
      which concern no curve, no group and no discrete logarithm.
      Size-matched to the ECDLP population by a declared seeded draw.
    polarity_nulls: >-
      Exactly two records, NAMED IN THE RUN PACKAGE BEFORE ANY
      CLASSIFICATION BEGINS, with a one-line reason each: NULL-CLOSURE, a
      record the executor judges to meet the section 4 closure standard,
      and NULL-FATIGUE, a record that reports a count of
      screened-and-rejected mechanisms with no measured obstruction.
      Choosing them after seeing the distribution would make the control
      unfalsifiable and INVALIDATES the run.
    reliability_samples: >-
      25 records from the ECDLP population, drawn by a declared seeded
      sample, for blind double classification; 20 records, drawn
      separately, for the field-only ablation.
  controls:
    - id: CTRL-CRITERIA-FROZEN
      row_class: instrument
      blocking: true
      object: 'the nine class definitions above'
      forced_disposition: >-
        FORCED: this contract's archive commit must PRECEDE the run
        package's, and the run package must record the contract's sha256.
        This is the only available evidence that the criteria were fixed
        before the corpus was seen, and criteria drift cannot be detected
        any other way after the fact.
    - id: CTRL-NULL-CLOSURE
      row_class: polarity_null
      blocking: true
      object: 'the pre-named NULL-CLOSURE record'
      forced_disposition: 'FORCED C6. A misclassification means the criteria are wrong; the run halts and nothing is classified.'
    - id: CTRL-NULL-FATIGUE
      row_class: polarity_null
      blocking: true
      object: 'the pre-named NULL-FATIGUE record'
      forced_disposition: >-
        FORCED NOT C6; predicted C0 or CX. Conflating a fatigue report with
        a closure is the specific error the taxonomy exists to prevent and
        a scheme that does so is discarded rather than adjusted.
    - id: CTRL-INTERRATER
      row_class: instrument
      blocking: true
      object: '25 seeded records classified independently and blindly by two agents'
      forced_disposition: >-
        FORCED Cohen kappa >= 0.7 over the nine classes. Each agent
        declares what it read; neither may read the other's labels or any
        earlier classification of the same record. Below 0.7 the
        distribution is not reproducible, kappa is the only reported
        result, and no class count is quoted anywhere.
    - id: CTRL-FIELD-ONLY-ABLATION
      row_class: honesty
      blocking: false
      object: '20 seeded records classified with title, abstract and narrative prose redacted, leaving only the structured fields the checklists read'
      forced_disposition: >-
        Reported as an agreement number against the full-text
        classification, WITH NO THRESHOLD. It measures how much of the
        taxonomy is decidable structure and how much is rhetoric. A low
        value does not void the result; it bounds every other statement in
        the run and the bound is reported beside them.
    - id: CTRL-NONCURVE-POPULATION
      row_class: null_object
      blocking: true
      object: 'the size-matched non-elliptic-curve population, classified by the identical criteria, checklists and agents'
      forced_disposition: >-
        THE BLOCKING CURVE-FREE NULL. A class distribution is a property of
        RECORDS, and records in every area of this program are written by
        the same agents under the same contract, so a distribution
        concentrated in the low classes is exactly the kind of signature a
        curve-free object reproduces. The ECDLP C0+C1+C2 mass must exceed
        the non-curve mass by at least 0.15 with a bootstrap 95 percent
        interval excluding 0. If it does not, the concentration is a
        property of this program's record-keeping and NOT of ECDLP research,
        and no ECDLP-specific reading is permitted.
    - id: CTRL-INCUMBENT-COLLAPSE
      row_class: fixture
      blocking: true
      object: 'the nine classes collapsed to the goal own binary reading: C8 plus qualifying C7 as met, C0-C7 otherwise as not met'
      forced_disposition: >-
        FORCED consistent with GOAL-ECDLP-001's own treatment of its record
        set: every record the goal currently treats as not meeting a
        completion criterion must fall in C0-C7. A record classified C8
        that the goal does not treat as a completion is a CONTRADICTION and
        halts the run for adjudication; it is never resolved by the
        classifier.
    - id: CTRL-EXCLUSIONS
      row_class: honesty
      blocking: false
      object: 'handoff and question records'
      forced_disposition: >-
        EXCLUDED BY NAME. They state no conclusion by design, and including
        them would manufacture C0 mass and inflate the very concentration
        the record claims to measure. The exclusion is declared here, before
        the population is enumerated.
    - id: CTRL-DETERMINISM
      row_class: instrument
      blocking: true
      object: 'the mechanical checklist evaluation, re-run from the frozen record list'
      forced_disposition: >-
        FORCED byte-identical output for the mechanically decided part of
        every classification, verified by sha256. The single interpretive
        step is exempt and is covered by CTRL-INTERRATER instead.
  independent_variables:
    - 'population in {ECDLP, NON-CURVE}'
    - 'classification mode in {full-text, field-only} (ablation arm)'
    - 'classifying agent in {A, B} (blind double-classification arm)'
  metrics:
    primary:
      - 'class counts n_C0 ... n_C8, n_CX, per population. UNITS: records (integer counts).'
      - 'class distribution: counts divided by population size. UNITS: dimensionless fractions summing to 1.'
      - 'low-class mass: the fraction in C0 + C1 + C2, per population. UNITS: dimensionless fraction. THE HEADLINE QUANTITY.'
      - 'ECDLP low-class mass minus NON-CURVE low-class mass, with a bootstrap 95 percent interval. UNITS: dimensionless. THE ONLY NUMBER THAT IS ABOUT THE ECDLP LANE.'
      - 'empty classes: the set of classes among C4..C8 with count zero, listed by name. UNITS: a set of class ids.'
      - 'CX share, per population. UNITS: dimensionless fraction.'
      - 'Cohen kappa on the blind double-classified sample. UNITS: dimensionless in [-1, 1].'
      - 'field-only agreement with full-text classification. UNITS: dimensionless fraction in [0, 1].'
    secondary:
      - 'per-record class label with the satisfied and failed checklist items named, for every record in both populations'
      - 'chi-square statistic over the nine classes, ECDLP against NON-CURVE, with its p-value'
      - 'the confusion matrix of the two blind classifiers over the nine classes'
      - 'per-class count of records that satisfied the checklist mechanically versus by the interpretive step'
      - 'the incumbent-collapse table (met versus not met) against the goal own reading'
  heuristic_under_test: >-
    HEUR-001 (spectrum completeness) and HEUR-002 (classification
    reproducibility) of H-PFDR-5e230f. Both are validated here and nowhere
    else.
  preregistered_prediction:
    quantity: >-
      The two polarity-null dispositions, kappa, the ECDLP class
      distribution, the set of empty classes, the CX share, and the
      difference between the ECDLP and NON-CURVE low-class masses.
    formula: >-
      NULL-CLOSURE classifies C6; NULL-FATIGUE does not classify C6 and is
      predicted C0 or CX; Cohen kappa >= 0.7; ECDLP low-class mass
      (C0+C1+C2) >= 0.5; at least 2 of C4..C8 empty; ECDLP CX share <= 0.2;
      ECDLP low-class mass minus NON-CURVE low-class mass >= 0.15 with the
      bootstrap 95 percent interval excluding 0. The field-only agreement is
      reported with NO predicted value: it is a calibration and predicting
      it would invite tuning.
    source: >-
      H-PFDR-5e230f claims H1-H4 and its predictions P1-P8, which extend
      IDEA-20260815-b4d106's four predictions with the reliability controls
      and the non-curve comparison. The premise that GOAL-ECDLP-001 names
      only two endpoints is read verbatim at
      ledger/goals/GOAL-ECDLP-001/goal.yaml lines 7009-7018. FIXED ON
      2026-09-04, BEFORE EITHER POPULATION IS ENUMERATED AND BEFORE ANY
      RECORD IS CLASSIFIED. The thresholds 0.7, 0.5, 0.2, 0.15 and the
      count 2 are part of the frozen contract and are never adjusted after
      an outcome is seen.
  scale_relevance:
    tier: null
    justification: >-
      Explicitly null rather than absent: no cryptographic parameter is
      involved, no curve is sampled, and no computation on mathematical
      content occurs. The only 'scale' present is the two population sizes
      at one commit, which are reported and are properties of the
      repository. There is no transfer assumption to state because there is
      no cryptographic claim to transfer.
    correspondence: 'none; no sampling of any mathematical object occurs'
  tail_checks:
    - >-
      EVERY CX record in the ECDLP population, read individually against
      HEUR-001's stated gap: the spectrum is derived from what the program
      has already named, so a genuinely new kind of result would be
      recorded CX and would be indistinguishable from a record that says
      nothing. Any CX record whose conclusion a reviewer judges to be a
      genuine result of an uncovered kind is NAMED, and the missing class
      it implies is described. This is the most valuable single output the
      run can produce and it is a manual read, not a guarantee.
    - >-
      The two polarity nulls' full checklist traces, item by item, so a
      reader can see WHICH criterion separated the closure from the fatigue
      report rather than trusting that one did.
    - >-
      The records where the two blind classifiers disagreed: each listed
      with both labels and the checklist item they read differently.
      Disagreements localise the taxonomy's soft joints.
    - >-
      The class with the largest ECDLP-versus-NON-CURVE difference,
      reported with both counts, so a reader can see whether the headline
      difference rests on one class.
  replication:
    seeds:
      - 'SEED-NONCURVE-MATCH = 20260904021 (the size-matched draw from the non-elliptic population)'
      - 'SEED-INTERRATER = 20260904022 (the 25-record blind double-classification sample)'
      - 'SEED-ABLATION = 20260904023 (the 20-record field-only ablation sample)'
      - 'SEED-BOOTSTRAP = 20260904024 (bootstrap resampling for the low-class-mass difference interval)'
    independent_instances: 2
    reason: >-
      The two independent instances are the two blind classifiers on the
      double-classified sample; that is the only genuine replication
      available, because each population is a single fixed object and
      re-measuring it with the same procedure and the same agent reproduces
      the same answer by construction. SEEDS POLICY: every seed is declared
      here before execution and recorded in the manifest. No seed may be
      chosen, changed or added after any outcome is observed. Both
      population queries are executed ONCE and frozen in the run package:
      re-running them later returns different populations, because the
      ledger grows in several worktrees at once, and re-running after
      seeing a distribution would let the population be selected.
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 2
    maximum_memory_gb: 8
    maximum_runs: 6
    maximum_workers: 1
    notes: >-
      A run is one stage (population freeze; polarity nulls; mechanical
      checklist pass; blind double classification; ablation; comparison and
      tail checks). No cryptographic computation occurs; the machine cost is
      YAML parsing and counting. wall_clock_seconds_per_run is 1800, above
      the template floor of 600, and bounds the mechanical pass; the
      interpretive step and the blind classifications are agent time and are
      budgeted in their own handoffs, not here.
  stages:
    - id: stage-0-freeze
      purpose: 'execute both population queries once, record the commit, freeze both record-id lists, name the two polarity nulls'
      blocking: true
    - id: stage-1-polarity
      purpose: 'classify the two polarity nulls and check CTRL-NULL-CLOSURE and CTRL-NULL-FATIGUE'
      blocking: true
    - id: stage-2-mechanical
      purpose: 'evaluate every checklist mechanically from parsed YAML on both populations, recording satisfied and failed items per record'
    - id: stage-3-interpretive-and-blind
      purpose: 'the single interpretive step; blind double classification on 25 records; kappa'
      blocking: true
    - id: stage-4-ablation-and-comparison
      purpose: 'field-only ablation, the ECDLP versus NON-CURVE comparison with bootstrap, the incumbent collapse, the four tail checks'
  stopping_rules:
    - >-
      Stop at stage 1 if either polarity null misclassifies. The criteria
      are wrong; record which null failed and on which checklist item;
      classify nothing further. Fixing the criteria requires a versioned
      protocol_amendment and reclassification from scratch.
    - >-
      Stop after stage 3 if kappa < 0.7. Report kappa as the run's only
      result; quote no class count anywhere.
    - >-
      Stop at once if CTRL-INCUMBENT-COLLAPSE produces a contradiction (a
      C8 the goal does not treat as a completion). Report the contradiction
      for Coordinator adjudication; do not resolve it in the classifier.
    - >-
      Stop when stage 4 is complete. Both record lists are frozen at stage
      0 and no record is added, dropped, or reclassified because of what the
      distribution showed.
    - >-
      A parse failure on a record is INFRASTRUCTURE SIGNAL (AGENTS.md rule
      5): the record is reported as unparseable and counted separately from
      CX; it is never counted as C0 and never counted as evidence about the
      corpus's conclusions.
  invalidation_rules:
    - >-
      Changing any class criterion, threshold, area set, or exclusion after
      any record has been classified INVALIDATES the run. Such a change is
      a versioned protocol_amendment plus reclassification from scratch,
      never an edit.
    - >-
      Naming either polarity null after any classification has begun
      INVALIDATES that control and the run.
    - >-
      Reporting the ECDLP distribution without the NON-CURVE distribution
      beside it INVALIDATES the report: an uncompared distribution cannot
      distinguish a property of ECDLP research from a property of this
      program's record-keeping.
    - >-
      Quoting any class count when kappa < 0.7 INVALIDATES the quotation.
    - >-
      Describing an empty class as unreachable, or a low-class record as
      lesser work, INVALIDATES the artifact making the statement. The
      ordering is by claim strength and not by worth, and the difference
      between unreachable and unattempted is explicitly open.
    - >-
      Including handoff or question records in either population
      INVALIDATES the distribution.
    - >-
      Quoting any count without its commit, population query, area set,
      criteria version and classifying agents INVALIDATES the quotation.
  success_criterion: >-
    Decidable from the primary metrics, ALL of: (1) CTRL-CRITERIA-FROZEN
    holds -- the contract's archive precedes the run package's and its
    sha256 is recorded; (2) both polarity nulls dispose as forced, with
    their checklist traces shown; (3) Cohen kappa >= 0.7 is measured and
    reported, and the field-only agreement is reported; (4) both
    populations are fully classified with per-record checklist traces, and
    the counts, distributions, empty-class set and CX shares are reported
    for both; (5) the ECDLP-versus-NON-CURVE comparison is reported with
    its bootstrap interval and chi-square, the incumbent collapse is
    consistent, and the four tail checks are complete with every CX record
    read.
    SUCCESS IS CLASSIFICATION INTEGRITY, NOT A PARTICULAR DISTRIBUTION: a
    run meeting (1)-(5) and finding the ECDLP corpus NOT concentrated in
    the low classes is a FULL SUCCESS and is reported with the same
    prominence. Nothing here validates a heuristic about mathematics,
    supplies ECDLP evidence, or changes any status.
  falsification_criterion: >-
    ANY of the following, evaluated in this order and reported by name.
    F1 CRITERIA FAILURE: a polarity null misclassifies. The criteria are
    wrong; the failing null and checklist item are named and no
    distribution is produced.
    F2 RELIABILITY FAILURE: kappa < 0.7. The classification is not
    reproducible between agents; kappa is the only reported result.
    F3 UNCLASSIFIABILITY: ECDLP CX share > 0.2. The corpus does not state
    its conclusions in classifiable terms. This process finding supersedes
    the concentration and empty-class claims rather than being reported
    alongside them.
    F4 NULL FAILURE, THE SCOPE-CONSTRAINT OUTCOME: the ECDLP low-class mass
    does not exceed the NON-CURVE low-class mass by 0.15 with the interval
    excluding 0. The concentration is a property of this program's
    record-keeping across all areas, is recorded as a CONTROLLED NULL, and
    says nothing about ECDLP research or about the difficulty of the ECDLP.
    F5 CONCENTRATION REFUTED: ECDLP low-class mass < 0.5 while F1-F4 do not
    fire. H1 of H-PFDR-5e230f is refuted for this population at this
    commit; the measured distribution is the finding.
    F6 SPECTRUM INCOMPLETE: the tail check finds a CX record whose
    conclusion is a genuine result of a kind no class covers. HEUR-001 is
    falsified and the missing class, named, is the run's most valuable
    output.
    F7 INCUMBENT CONTRADICTION: a record classifies C8 that the goal does
    not treat as meeting a completion criterion. Reported for Coordinator
    adjudication and never resolved inside the run.
  required_artifacts:
    - 'experiments/EXP-PFDR-3aa522/runs/<RUN-ID>/manifest.yaml (full artifact policy: command, commit and dirty state, environment, all declared seeds, requested policy, resolved model, probe status, timings, validity status and reason; plus the sha256 of this contract, evidencing CTRL-CRITERIA-FROZEN)'
    - 'experiments/EXP-PFDR-3aa522/runs/<RUN-ID>/populations.yaml (both exact query texts, the commit executed at, both frozen record-id lists with sha256, the size-matching draw, and the declared exclusions)'
    - 'experiments/EXP-PFDR-3aa522/runs/<RUN-ID>/polarity-nulls.yaml (the two pre-named records with their reasons as written before classification began, their assigned classes, and their full checklist traces item by item)'
    - 'experiments/EXP-PFDR-3aa522/runs/<RUN-ID>/classification-ecdlp.yaml (per record: class, satisfied checklist items, failed checklist items, whether the class was decided mechanically or by the interpretive step)'
    - 'experiments/EXP-PFDR-3aa522/runs/<RUN-ID>/classification-noncurve.yaml (the same, for the comparison population)'
    - 'experiments/EXP-PFDR-3aa522/runs/<RUN-ID>/reliability.yaml (the two blind classifications on the 25-record sample, each declaring what it read, the confusion matrix, Cohen kappa; and the field-only ablation on the 20-record sample with its agreement)'
    - 'experiments/EXP-PFDR-3aa522/runs/<RUN-ID>/distributions.yaml (class counts and fractions for both populations, low-class masses, the difference with its bootstrap interval, chi-square, the empty-class set by name, CX shares, and the unparseable count kept separate from CX)'
    - 'experiments/EXP-PFDR-3aa522/runs/<RUN-ID>/incumbent-collapse.yaml (the met-versus-not-met table against the goal own reading, and any contradiction)'
    - 'experiments/EXP-PFDR-3aa522/runs/<RUN-ID>/tail-checks.yaml (every CX record read individually with a verdict on whether it implies a missing class; the polarity traces; the classifier disagreements; the largest-difference class)'
    - 'experiments/EXP-PFDR-3aa522/runs/<RUN-ID>/execution-report.md (stage-by-stage; success-criterion checklist (1)-(5); which of F1-F7 fired; per-file sha256; the determinism re-run comparison; the inference block; an explicit statement that no curve was sampled, no mathematical claim made, and no record judged for quality)'
  interpretation_limits:
    - >-
      A classification scheme. It makes no mathematical claim, produces no
      evidence about elliptic curves, and cannot support, weaken, or change
      the status of any hypothesis about the ECDLP.
    - >-
      It makes NO judgement about any record's quality. The ordering is by
      claim strength, not by worth: a C1 instrument may be worth more to
      this program than a C5 scoped negative, and the taxonomy is written
      to make that sayable rather than to rank effort.
    - >-
      An empty class is NOT evidence that the class is unreachable.
      Whether an empty class is unreachable or merely unattempted is the
      follow-up question and this contract declines to answer it; an
      artifact that answers it on this evidence is invalid.
    - >-
