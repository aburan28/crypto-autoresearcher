experiment:
  id: EXP-INSTR-f1aebb
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-899c5e
  question_id: RQ-INSTR-f8faa0
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE SOLVING-DEGREE METER CARD: sympy reports the maximum total degree of the REDUCED Groebner
    basis, which is a property of the OUTPUT and is neither an upper nor a lower bound on the degree
    the computation reached; the deliverable is a frozen written statement of exactly which claims
    that proxy can and cannot support, backed by a definition-faithful Macaulay-rank meter for the
    solving degree and the first-fall degree on the same frozen fixtures'
  status: draft
  objective: "(A) WHAT THE HARNESS MEASURES AND WHAT ITS OWN NOTE SAYS. harness/semaev.py's module\
    \ docstring states: \"sympy uses a Buchberger/F5-style routine, not an optimized F4, and does\
    \ not expose the true degree of regularity reached during computation. We therefore report *observable*\
    \ proxies -- the size and maximum total degree of the reduced Groebner basis, and wall time --\
    \ and label them as implementation-bound proxies, never as the theoretical degree of regularity.\"\
    \ That note is honest and is more than most programs write. IT IS ALSO NOT SUFFICIENT, because\
    \ it does not say WHICH DIRECTION the proxy errs in, and a proxy with an unknown error direction\
    \ cannot support a comparative claim.\n(B) THE PRECISE DEFECT, AND IT IS NOT A MATTER OF PRECISION.\
    \ measure_s3_decomposition computes G = sympy.groebner(system, x1, x2, modulus=p, order=\"grevlex\"\
    ) and then takes max over g in G.exprs of sympy.Poly(g, x1, x2, modulus=p).total_degree(). Four\
    \ separate quantities are in play and only the first is measured:\n  Q1  max total degree of the\
    \ polynomials in the REDUCED Groebner basis;\n  Q2  the SOLVING DEGREE: the maximum degree of\
    \ any polynomial appearing during\n      the computation, in the sense of Lazard's degree-by-degree\
    \ linear algebra;\n  Q3  the FIRST-FALL DEGREE: the least degree at which a non-trivial degree\
    \ fall\n      occurs, i.e. the least D at which the Macaulay matrix in degree D has rank\n   \
    \   below the generic (Koszul-only) prediction;\n  Q4  the DEGREE OF REGULARITY in the Bardet-Faugere-Salvy\
    \ sense, defined\n      through the Hilbert series of the homogenised ideal under a\n      semi-regularity\
    \ assumption.\nQ1 <= Q2 always, but Q1 can be far below Q2: a zero-dimensional grevlex basis can\
    \ be low-degree while the computation passed through much higher degrees. So Q1 is a LOWER bound\
    \ on Q2 and carries no upper information whatsoever. It is also not monotone in the way cost is:\
    \ adding a variable can raise Q2 and cost while lowering Q1. KN-TECH-004 and KN-TECH-011 both\
    \ name Q2 and Q3 as the cost drivers, and KN-TECH-075 records, for the closest external analogue,\
    \ that \"solving degree is not the same as degree of regularity, and structured systems routinely\
    \ violate the semi-regularity assumptions under which the latter is computed\". The campaign is\
    \ currently instrumented on Q1 and reasoning about Q2.\n(C) WHY THIS IS AN L14 QUESTION AND NOT\
    \ A SOLVER QUESTION. The lane's rule is that an instrument that cannot detect a planted signal\
    \ cannot support a negative and one that fires on a matched null cannot support a positive. For\
    \ Q1 both failures are constructible in principle: two systems with identical Q1 and materially\
    \ different Q2 (a planted-signal miss), and a change of monomial order that moves Q1 with the\
    \ ideal and the cost fixed (a matched-null fire, since the reduced basis depends on the order\
    \ while the ideal does not). Constructing both at toy scale is cheap and is the core of the experiment.\n\
    (D) THE DELIVERABLE IS THE STATEMENT, NOT THE NUMBER. The primary artifact is a frozen METER CARD\
    \ -- one page, snapshot-committed, cited by every lane record that reports a degree -- with, for\
    \ each of Q1 through Q4:\n  the exact definition;\n  the exact code path that produces it, by\
    \ file and function;\n  what it is a bound on, in which direction, with the argument;\n  the claims\
    \ it CAN support, with the required qualifiers verbatim;\n  the claims it CANNOT support, listed\
    \ explicitly;\n  the measured relationship to the definition-faithful quantity on a frozen\n \
    \   fixture set, with the observed spread;\n  the failure modes under which it silently misleads.\n\
    A meter card that says \"this proxy cannot compare two curves' Groebner cost\" is a complete and\
    \ useful deliverable. It is cheaper than any experiment it would prevent.\n(E) THE BACKING MEASUREMENT,\
    \ SO THE CARD IS NOT OPINION. Q2 and Q3 are computable exactly at toy scale by linear algebra\
    \ with no solver at all. For a degree bound D, build the Macaulay matrix M_D whose rows are the\
    \ products of each system generator by every monomial of complementary degree up to D, over F_p.\
    \ Then:\n  Q3 (first fall) is the least D at which rank(M_D) is below the count predicted\n  \
    \  by the generic Koszul syzygy bookkeeping -- a rank comparison, nothing more;\n  Q2 (solving\
    \ degree, in the Lazard sense for the chosen order) is the least D\n    at which row reduction\
    \ of M_D yields a Groebner basis of the ideal for that\n    order, checkable by verifying that\
    \ the leading terms of the reduced rows\n    generate the same initial ideal as sympy's answer.\n\
    Both are exact, deterministic, order-explicit and independent of any solver's strategy. The cost\
    \ is a rank computation of size binomial(n + D, D), which is the honest ceiling on how far this\
    \ can go.\n(F) WHAT THIS IS NOT. It is not a claim about cryptographic-scale solving degree. It\
    \ is not an improvement to any solver. It does not resolve KN-OPEN-002 (the growth of solving\
    \ degree for prime-field summation-polynomial systems); it supplies the meter that question needs\
    \ and states what the current meter cannot answer."
  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: An instrument audit consuming no non-generic resource. It instruments the
    R1/R2 functionals of lanes L1, L4 and L11, all of which propose to compare Groebner behaviour
    across curves or models. No oracle is defined, so neither KN-FIND-b7e091 nor H-ENDO-001 applies;
    there is nothing here for a generic-group simulator to simulate.
  reachability_gate: NOT APPLICABLE, and stated rather than omitted. No movement between curves is
    proposed. Fixtures are single curves; the comparison is across systems and orders on the same
    curve. T5 is untouched. Should the meter later be used to compare curves within an isogeny class,
    T5 becomes binding on the attack reading of that comparison, and this record does not license
    skipping it.
  inputs:
    procedure: 'STAGE 0 (zero compute, hard gate): write down Q1 through Q4 and the code path for
      each; confirm by reading harness/semaev.py lines 120-133 that the measured quantity is the reduced-basis
      maximum total degree. If the code turns out to measure something else, the whole record is superseded
      rather than amended. STAGE 1 (hours): implement the Macaulay-rank meter; validate on textbook
      systems before any Semaev instance. STAGE 2 (HARD GATE, minutes): the satisfiable control and
      the baseline embedding at p = 1009, B = 8. STAGE 3 (hours): the fixture grid, all four quantities,
      three orders. STAGE 4 (minutes): the planted-signal construction (append a redundant high-degree
      generator) and the matched-random null. STAGE 5 (zero compute): write the meter card. THE CHEAPEST
      VALID DISCRIMINATOR IS STAGE 4''s planted-signal construction: it needs no new mathematics,
      produces a pair of systems by appending one polynomial, and settles in minutes whether Q1 can
      miss a real cost difference.'
    mechanism: "STEP 1 -- FROZEN FIXTURE SET. Choose F instances spanning small arity and field size\
      \ where the Macaulay computation is certainly feasible: m = 2 (S_3) at p in {101, 1009, 4001},\
      \ factor base sizes 4, 8, 16, with one decomposable and one non-decomposable target each. Record\
      \ the exact systems by sha256 so a number is checkable without re-execution.\nSTEP 2 -- MEASURE\
      \ Q1 AS THE HARNESS DOES. Run measure_s3_decomposition unchanged and record groebner_basis_max_degree,\
      \ groebner_basis_size, groebner_seconds, is_trivial_ideal.\nSTEP 3 -- MEASURE Q2 AND Q3 BY MACAULAY\
      \ RANK. For D = 1, 2, ... build M_D over F_p, compute its rank, and record the whole rank profile\
      \ rather than only the threshold. Read Q3 off as the first D where the rank falls below the\
      \ generic prediction; read Q2 off as the least D at which the reduced rows' leading terms generate\
      \ the same initial ideal as sympy's grevlex answer. Validate the implementation FIRST on textbook\
      \ systems with known behaviour, before any Semaev system is touched.\nSTEP 4 -- THE TWO INSTRUMENT\
      \ CONTROLS, IN BOTH DIRECTIONS.\n  PLANTED-SIGNAL DIRECTION: construct a pair of systems with\
      \ equal Q1 and\n    materially different Q2. The natural construction is to append to a system\
      \ a\n    generator that is already in the ideal but of high degree: the reduced basis\n    is\
      \ unchanged, so Q1 is unchanged, while the computation must handle the new\n    generator, so\
      \ Q2 and cost rise. If Q1 does not move and Q2 does, the miss is\n    demonstrated, not argued.\n\
      \  MATCHED-NULL DIRECTION: hold the ideal and the cost model fixed and change\n    only the\
      \ monomial order (grevlex, lex, and a weighted order). If Q1 moves\n    while the ideal does\
      \ not, Q1 is shown to be an artifact of the presentation\n    at a magnitude that must then\
      \ be quoted next to every reported Q1.\n\nSTEP 5 -- WRITE THE CARD, AND MAKE IT BINDING. Draft\
      \ the meter card from the measurements; propose it to the Coordinator for promotion into knowledge/\
      \ as a technique record. Every lane record reporting a degree cites it. Any claim of the form\
      \ \"curve A has higher solving degree than curve B\" that rests on Q1 must quote the measured\
      \ Q2 - Q1 spread from the card in the same sentence, or it is an overclaim."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - matched random system on variables, degrees and support
  - three monomial orders on the same ideal
  - satisfiable instance, which must behave differently
  - textbook systems of known behaviour, before any Semaev number is produced
  - sympy version and git commit recorded with every cell
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, in both directions. NULL 1 -- MATCHED
    RANDOM SYSTEM: a random polynomial system matched to the Semaev system on number of variables,
    total degree, per-variable degree and support size. If Q1, Q2 and Q3 agree with the Semaev system
    within 1, then at this scale the degrees are functions of shape and no Semaev-specific or curve-specific
    statement may be made from them. NULL 2 -- ORDER PERMUTATION: the same ideal presented under three
    monomial orders. Any Q1 difference between two curves that is smaller than the Q1 difference between
    two orders of the SAME curve is not a curve effect. NULL 3 -- SATISFIABLE CONTROL: an instance
    whose target does decompose. The first-fall meter must behave differently there, and a meter that
    returns the same profile for satisfiable and unsatisfiable instances is not measuring the obstruction.
    DECAY PARAMETER: the factor-base size B, which controls the degree of the membership polynomials
    f_V and hence the system''s size. Q2 must GROW with B -- that is the whole content of the cost
    model. A measured Q1 that does NOT grow with B while wall time does is the canonical artifact
    tell of docs/inventor-protocol.md section 3 and would establish, empirically and at once, that
    Q1 is not tracking cost.'
  independent_variables: []
  metrics:
    primary:
    - Q1, Q2, Q3 per (fixture, order), with the full Macaulay rank profile
    - groebner_seconds and groebner_basis_size from the unchanged harness path
    - Macaulay matrix dimensions and peak memory per cell
    - the planted pair's (Q1, Q2, wall time) before and after appending
    secondary:
    - matched-random null values on the identical pipeline
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Q2 - Q1 over the frozen fixture set, at fixed order
    formula: Strictly positive on at least half the fixtures, with a spread of at least 1 across fixtures.
      A gap that is constant across fixtures would LICENSE Q1 as a within-fixture-family comparator
      and is the good outcome for the campaign; a varying gap forbids it. Both are recorded; the card
      is written either way.
    source: pre-registered in IDEA-20260807-899c5e before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - ORDER SENSITIVITY. Q1 and Q2 are both order-dependent. Every number names its order or it is meaningless.
  - FIELD-EQUATION CONVENTION. Whether x^p - x is an axiom or built into the ambient ring changes
    the degrees materially. Frozen before Stage 3 and reported with every number.
  - SMALL-p ARTIFACTS. At p = 101 the field equations are cheap and can dominate; the prime ladder
    must span enough range to show whether the degrees depend on p at all.
  - sympy's INTERNAL STRATEGY. Buchberger with a pair-selection heuristic is not F4 and not F5. Nothing
    measured here transfers to F4/F5 behaviour, and the card must say that in its "cannot support"
    list.
  - THE FACTOR-BASE MEMBERSHIP POLYNOMIAL. f_V is a product of B linear factors, so its degree is
    B; the system's degrees are therefore dominated by B rather than by anything about the curve.
    This is the single largest confound for any cross-curve degree comparison and the card must lead
    with it.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Strictly positive on at least half the fixtures, with a spread of at least 1
    across fixtures. A gap that is constant across fixtures would LICENSE Q1 as a within-fixture-family
    comparator and is the good outcome for the campaign; a varying gap forbids it. Both are recorded;
    the card is written either way.
  falsification_criterion:
  - The Macaulay meter does not reproduce sympy's initial ideal at D = Q2 on the baseline slice. The
    two meters are incomparable and no card can be written from them; the line halts.
  - Textbook validation instances give the wrong known behaviour. Implementation failure; nothing
    is reported.
  - The satisfiable control produces the same profile as the unsatisfiable one. The first-fall meter
    is not measuring the obstruction and is withdrawn.
  - Q2 - Q1 is exactly zero on every fixture. Then Q1 IS the solving degree on this family and the
    whole premise of this record is falsified -- a clean negative, and a very useful one, because
    it would license the campaign's existing meter outright.
  - Macaulay matrices exceed the memory budget before any degree resolves. That is an INFRASTRUCTURE
    outcome under AGENTS.md rule 5, is recorded as such, and is not evidence about degrees.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-899c5e
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
