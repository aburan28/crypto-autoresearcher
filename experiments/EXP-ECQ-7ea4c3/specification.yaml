experiment:
  id: EXP-ECQ-7ea4c3
  version: 1
  hypothesis_id: H-ECQ-a609f8
  question_id: RQ-ECQ-80f23c
  goal_id: GOAL-ECQ-002
  title: BATCH-da59ec - NAGAO-1994 height budget and cell reachability
  contract_provenance: >-
    AUTHORED AFTER EXECUTION; NOT a pre-registered contract. Written for one mechanical reason:
    tools/validate_ledger.py indexes runs only under experiments/*/runs/, so EV-ECQ-cbc837's
    references to RUN-ECQNAG-f88f54-001..012 were unresolvable and raised 12 validation errors.
  recurrence_note: >-
    THIS IS THE THIRD OCCURRENCE of the same defect: GOAL-ECQ-001 (EXP-ECQ-89de3c), BATCH-f2341e
    (EXP-ECQ-139c9f), and now BATCH-da59ec. The cause is structural, not clerical: the harness
    dispatches producers whose write_scope is a BATCH directory, so runs are written under
    coordination/goals/**/tasks/**/runs/, while the ledger validator only indexes
    experiments/*/runs/. Every batch that cites its own runs in an evidence record hits it, and
    every batch has fixed it the same way afterwards. The additive port is a REMEDY, not a fix;
    the fix is either to have producers write runs under an experiments/<EXP-ID>/ path from the
    start, or to teach the validator the batch layout. Recorded here so the pattern is visible
    rather than rediscovered a fourth time.
  port_note: >-
    ADDITIVE COPIES. The originals under
    coordination/goals/GOAL-ECQ-002/batches/BATCH-da59ec/tasks/TASK-20260823-f88f54/runs/ are
    UNMODIFIED and remain the record of what ran; each copy records the original's sha256. On any
    disagreement the original wins. Nothing trimmed, nothing regenerated.
  protocol_summary: >-
    Re-verify the NAGAO-1994 transcription's internal identity; convert quartic to Weierstrass and
    minimalise; measure the height budget h ~ a + b log H(t); report the admissible parameter box
    at each of three pre-declared ICARM cells; sieve only if a box is non-empty, with an exact
    height gate applied before any Mestre-Nagao ordering.
  metrics:
    primary: [measured_min_naive_height, admissible_box_at_each_predeclared_target]
    secondary: [height_fit_a_b_r2, certified_rank_at_probe_parameters, minimalisation_height_stripped]
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 1
    maximum_memory_gb: 4
    maximum_runs: 80
    maximum_workers: 1
  budget_note: >-
    From the TASK-20260823-f88f54 handoff. Producer reported ~100 s of 3600 and 12 runs of 80.
    NOTE the validator's finding F4: the producer's prose says peak RSS well under 1 GB while
    RUN-009's manifest records 3651036 kB = 3.48 GiB, inside the 4 GB cap but not what was written.
  success_criterion: >-
    RECORDED AFTER THE FACT from the handoff's completion_gate: the transcription identity
    re-verified at all seven coefficients; (a, b) measured and the admissible box reported for all
    three targets; the exact height gate applied before any Mestre-Nagao ordering; every certified
    rank backed by that many exhibited points in exact arithmetic; nothing submitted to ICARM.
    NOTE: this experiment did NOT take a leaderboard cell and its success criterion never included
    doing so. All three boxes were measured EMPTY, which is the result.
  runs_recorded: 12
  runs_invalid: 3
  invalid_note: >-
    RUN-008 (implementation_error, superseded by -009) and RUN-010/-011 (deliverable-build errors,
    superseded by -012). The BATCH-da59ec validator confirmed the 011/012 identical-hash question
    is reading (a) and DETERMINATE: the 1258 lived only in prose strings, RUN-011's own stdout.log
    says "1258 fibres", and both were reproduced byte for byte from a clean export.
    AGENTS.md rule 2 is NOT engaged. It also recorded (F-status) that all 12 manifests say
    completed_valid, including the three superseded ones, so invalidity exists only in report prose.
  status: executed
  owner: coordinator
