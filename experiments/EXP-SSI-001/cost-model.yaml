concrete_cost:
  id: COST-SSI-001
  hypothesis_id: H-SSI-001
  cost_unit: >-
    F_{p^2}-operations (time); memory in table entries with declared
    bytes-per-entry scenarios {64, 256} (house convention, per
    experiments/EXP-WESOVOW-001).
  bound_kind: heuristic_estimate
  convention_note: >-
    One record per method below (task-mandated single file covering the
    proposal's three methods). time_log2 / memory_log2 are full-cost values
    under the wiener_full_cost_plus_isogeny_step_count convention and are
    the deliverable of EXP-SSI-001: null at draft. prior_time_log2 /
    prior_memory_log2 are the quoted step-count figures at exponent level
    from the cited corpus (pre-filled only where a citation actually states
    them; DG's memory is not stated in corpus and stays null, mirroring the
    F5a/F5b case split). All tables are bounds under the disclosed
    optimistic assumptions, not predictions.

  algorithm_ref:
    - id: ALG-MITM-FP2
      description: >-
        Meet-in-the-middle on the F_p2 supersingular 2-isogeny graph
        (two-sided birthday, table of sqrt(pi*N/8) entries over N ~ p/12
        vertices); quoted O~(p^{1/2}) time and space.
      citation: KN-TECH-024, KN-TECH-029 (quoted step-count baseline)
      regimes: [F_p2]
      parameter_sets:
        - {name: "SQIsign NIST-I, F_p2 regime", security_parameter: "log2(p) ~ 256", time_log2: null, memory_log2: null, prior_time_log2: 128, prior_memory_log2: 128}
        - {name: "SQIsign NIST-III, F_p2 regime", security_parameter: "log2(p) ~ 384", time_log2: null, memory_log2: null, prior_time_log2: 192, prior_memory_log2: 192}
        - {name: "SQIsign NIST-V, F_p2 regime", security_parameter: "log2(p) ~ 512", time_log2: null, memory_log2: null, prior_time_log2: 256, prior_memory_log2: 256}
        - {name: "large-768, F_p2 regime", security_parameter: "log2(p) ~ 768", time_log2: null, memory_log2: null, prior_time_log2: 384, prior_memory_log2: 384}
      prior_source: >-
        KN-TECH-024: meet-in-the-middle expected O~(p^{1/2}) time and
        space; consistent with the frozen P13 source's "previous methods
        ~ 2^128 / 2^192 / 2^256 F_{p^2}-operations" (control C1).
    - id: ALG-LOWMEM-CS
      description: >-
        Low-memory distinguished-point parallel collision search
        (isogeny-graph van Oorschot-Wiener analogue, defined or falsified
        by EXP-SSI-001): two-flavored non-backtracking 2-isogeny walk,
        predicate survival 2^{-theta}, golden-collision path
        reconstruction. Costed on the full F_p2 graph and on the
        F_p-rational subgraph.
      citation: KN-LIT-012 (algorithm template and tradeoff law)
      regimes: [F_p2, F_p]
      parameter_sets:
        - {name: "SQIsign NIST-I, F_p2 regime", security_parameter: "log2(p) ~ 256", time_log2: null, memory_log2: null, prior_time_log2: 128, prior_memory_log2: null}
        - {name: "SQIsign NIST-III, F_p2 regime", security_parameter: "log2(p) ~ 384", time_log2: null, memory_log2: null, prior_time_log2: 192, prior_memory_log2: null}
        - {name: "SQIsign NIST-V, F_p2 regime", security_parameter: "log2(p) ~ 512", time_log2: null, memory_log2: null, prior_time_log2: 256, prior_memory_log2: null}
        - {name: "large-768, F_p2 regime", security_parameter: "log2(p) ~ 768", time_log2: null, memory_log2: null, prior_time_log2: 384, prior_memory_log2: null}
        - {name: "SQIsign NIST-I, F_p regime (on subgraph)", security_parameter: "log2(p) ~ 256", time_log2: null, memory_log2: null, prior_time_log2: 64, prior_memory_log2: null}
        - {name: "SQIsign NIST-III, F_p regime (on subgraph)", security_parameter: "log2(p) ~ 384", time_log2: null, memory_log2: null, prior_time_log2: 96, prior_memory_log2: null}
        - {name: "SQIsign NIST-V, F_p regime (on subgraph)", security_parameter: "log2(p) ~ 512", time_log2: null, memory_log2: null, prior_time_log2: 128, prior_memory_log2: null}
        - {name: "large-768, F_p regime (on subgraph)", security_parameter: "log2(p) ~ 768", time_log2: null, memory_log2: null, prior_time_log2: 192, prior_memory_log2: null}
      prior_source: >-
        F_p2 prior time: the quoted O~(p^{1/2}) baseline (KN-TECH-024; the
        frozen P13 source's "previous methods ~ 2^128 / 2^192 / 2^256 ...
        and negligible memory" - "negligible" is quoted without a figure,
        hence prior_memory_log2 null). F_p prior time: Delfs-Galbraith
        quoted O~(p^{1/4}) (KN-LIT-078).
    - id: ALG-DELFS-GALBRAITH-FP
      description: >-
        Delfs-Galbraith path-finding on F_p-rational instances via the
        F_p-rational subgraph (size ~ p^{1/2}, reported); quoted
        O~(p^{1/4}) for the F_p case. Memory profile unresolved in corpus:
        case F5a (table-based MITM on the subgraph, memory Theta(p^{1/4}))
        vs case F5b (polylog memory), resolved from the primary text at
        execution or tabulated both ways.
      citation: KN-LIT-078 (DOI 10.1007/s10623-014-0010-1, arXiv:1310.7789)
      regimes: [F_p]
      parameter_sets:
        - {name: "SQIsign NIST-I, F_p regime", security_parameter: "log2(p) ~ 256", time_log2: null, memory_log2: null, prior_time_log2: 64, prior_memory_log2: null}
        - {name: "SQIsign NIST-III, F_p regime", security_parameter: "log2(p) ~ 384", time_log2: null, memory_log2: null, prior_time_log2: 96, prior_memory_log2: null}
        - {name: "SQIsign NIST-V, F_p regime", security_parameter: "log2(p) ~ 512", time_log2: null, memory_log2: null, prior_time_log2: 128, prior_memory_log2: null}
        - {name: "large-768, F_p regime", security_parameter: "log2(p) ~ 768", time_log2: null, memory_log2: null, prior_time_log2: 192, prior_memory_log2: null}
      prior_source: >-
        KN-LIT-078: descending to the F_p-rational subgraph gives
        O~(p^{1/4}) for the F_p case; memory not stated in corpus
        (abstract-relayed), hence prior_memory_log2 null.

  optimistic_assumptions:
    - id: OA-1
      assumption: >-
        Step-count convention charges unit-cost table access and zero
        memory (one F_{p^2}-operation per step, storage free).
      bias_direction: >-
        Underestimates table-method (MITM; DG under case F5a) cost. This is
        precisely the convention under critique; it is disclosed so the two
        conventions are never compared unknowingly.
    - id: OA-2
      assumption: >-
        Graph-size models N = p/12 and n' ~ p^{1/2} used at exponent level;
        polylog factors and class-number cofactors dropped from absolute
        figures.
      bias_direction: Underestimates all absolute time and memory figures slightly.
    - id: OA-3
      assumption: >-
        Ideal birthday constant: collision search charged at
        sqrt(pi*n/2)*(1+o(1)); real isogeny-walk constants are typically
        worse (walk-quality variation of the Teske type is known for rho,
        KN-LIT-012).
      bias_direction: Underestimates low-memory collision-search time.
    - id: OA-4
      assumption: >-
        Distinguished-point storage charged at Theta(sqrt(n)/2^theta)
        entries at 64 bytes/entry in the optimistic scenario; predicate
        evaluation, walk restarts, and reconstruction overhead dropped.
      bias_direction: Underestimates low-memory collision-search memory and time.
    - id: OA-5
      assumption: >-
        Measured per-step operation constants (toy scale, pure Python,
        schoolbook arithmetic) extrapolated to standardized sizes via the
        pinned fit F6.
      bias_direction: >-
        Indeterminate, flagged: operation counts are exact at toy scale and
        arithmetic-model changes (Montgomery-style optimized arithmetic)
        alter constants, not exponents; wall-clock values are never
        extrapolated.
    - id: OA-6
      assumption: Success probability charged as 1 (expected-cost figures; no failure-probability multiplier).
      bias_direction: Underestimates all methods.
    - id: OA-7
      assumption: >-
        KN-LIT-094 o(1) terms unextracted; the full-cost convention is
        applied at finite standardized sizes with the wiring model's
        technology abstraction (three spatial dimensions; no latency,
        bandwidth, or energy itemization, per KN-TECH-035 applicability
        limits).
      bias_direction: >-
        Indeterminate (can under- or over-estimate); flagged as the
        dominant model uncertainty. Full-cost columns are labeled
        heuristic_estimate bounds, not predictions.
    - id: OA-8
      assumption: >-
        DG memory-profile case split F5a/F5b unresolved at design time;
        choosing a single case would bias the F_p verdict (F5a charges DG
        a Theta(p^{1/4}) table, F5b charges polylog).
      bias_direction: >-
        Neutralized by design: both cases are tabulated unconditionally and
        the F_p verdict is stated conditionally when the primary text is
        not resolved.

  overestimating_factors:
    - id: OF-1
      factor: >-
        The KN-LIT-094 wiring penalty applied at finite sizes with
        unextracted o(1) may overstate table-method full cost at the
        standardized sets (the asymptotic bound treated as tight).
    - id: OF-2
      factor: >-
        Collision search charged for full birthday coverage with no
        early-stopping credit: slight overestimate of low-memory method
        expected cost.
    - id: OF-3
      factor: >-
        Non-backtracking walk trap-avoidance charged as deterministic
        overhead: overestimates expected low-memory steps by the
        trap-handling term.

  parallelism: >-
    Low-memory collision search: near-linear speedup in processor count m
    under the random-walk heuristic (KN-LIT-012), with m priced as hardware
    in the full-cost convention. Table methods: parallelization limited by
    shared-table wiring under KN-LIT-094; no free parallel scaling claimed.
    Classical parallelization only, and only when processors and
    interconnect are priced (proposal full-cost boundary).

  time_memory_tradeoff: >-
    Distinguished-point granularity interpolates between the high-memory
    endpoint (store-everything MITM, theta = 0) and the low-memory endpoint
    (theta up to ~ (1/2)*log2(n), minimal storage): expected wall-clock
    Theta~((sqrt(pi*n/2) + 2^theta)/m), storage Theta~(sqrt(n)/2^theta)
    entries, interpolation range theta in [0, (1/2)*log2(n)]; parallel form
    with m processors per KN-LIT-012 (van Oorschot-Wiener). Full-cost
    interpolation across the range applies KN-LIT-094 charging to the
    stored table at each theta; stated in the deliverable table with both
    endpoints labeled.

  affected_scope:
    - >-
      Cost-comparison accounts quoting O~(p^{1/2}) MITM (time and space) as
      the classical baseline for pure supersingular path-finding (the
      KN-TECH-024 / KN-TECH-029 style account): a confirmed flip changes
      the honest matched-baseline identity or full-cost figure in the
      affected regime.
    - >-
      GOAL-SSI-001 candidate screening discipline: future candidates must
      beat the re-priced matched baseline, not the step-count MITM figure.
  safe_scope:
    - >-
      CGL, SQIsign, and CSIDH parameter sets: no attack is costed against
      any deployed parameter here; baseline repricing is not a break
      (proposal interpretation limit, carried verbatim into H-SSI-001).
    - >-
      SIDH/SIKE: broken in the torsion-image regime regardless (KN-TECH-026);
      this record neither weakens nor strengthens that.
    - >-
      The CSIDH quantum lane (KN-OPEN-014): no quantum cost model is
      applied; quantum queries are explicitly not charged here because none
      are used.
    - >-
      Any constant-factor or bit-security reading: the model is asymptotic
      with unextracted o(1) terms (KN-TECH-035 applicability limit);
      standardized-set tables are bounds under OA-1..OA-8, not predictions.

  implementation_ref: null
  status: draft
