experiment:
  id: EXP-EQIC-23e4fb
  hypothesis_id: H-EQIC-70a21a
  derived_from_idea: IDEA-20260807-1ea327
  question_id: RQ-EQIC-8cb959
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Three-encoding comparison of the arity-2 j = 0 decomposition system in the
    mu_3-invariant coordinate u = x^3, with the a != 0 fake-invariant curve as the
    blocking null and the r = 1 degeneration as the baseline fixture

  objective: >-
    The one uncertainty a run reduces is whether pushing the arity-2 decomposition
    system to the mu_3-invariant subring lowers the measured algebraic solving cost,
    and if so whether the saving is attributable to the endomorphism or merely to the
    cube substitution. A run establishes, at the declared toy parameters and on one
    fixed solver, (i) whether the symbolic gates of H-EQIC-70a21a hold exactly, which
    can end the line in minutes; (ii) the Groebner wall time, reduced-basis size and
    maximum-total-degree proxy for ENC-X, ENC-ASYM and ENC-SYM on identical instances
    and identical target streams; (iii) the NULL-1 separation between the a = 0 and
    a != 0 arms, which bounds what any measured saving may be attributed to; and
    (iv) the number of independent relations recovered per solved system, which must
    be exactly one. No attack, no speedup against any baseline and no security
    consequence is claimed here or would follow from a run.

  what_this_is_not:
    - >-
      Not an attack, a key recovery, a distinguisher or a cryptanalytic result. It is
      a comparative measurement of three encodings of the same solution set.
    - >-
      Not a claim in either direction about H-STR-002, displacement rank, or any
      linear-algebra cost; no relation matrix is formed.
    - >-
      Not a status change to any hypothesis, evidence record, decision or goal, and
      not a knowledge promotion.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or
      evidence. No run has been executed under this contract.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE. At field_bits in {12, 16, 20}, on j = 0 curves over
      prime fields with p = 1 mod 3, at arity 2, with mu_3-stable factor bases of size
      3m, under sympy.groebner with grevlex, the invariant encodings attain a stated
      wall-time ratio and a stated degree-proxy difference against ENC-X, and the
      a = 0 versus a != 0 arms separate by a stated amount. WHAT DOES NOT FOLLOW - no
      exponent change of any kind; nothing about a != 0 curves; nothing at arity above
      2; nothing about an optimized F4/F5 implementation; nothing about any
      standardized curve, none of which has j = 0; and no statement about the ECDLP.

  inputs:
    procedure: >-
      STAGE 0 (zero compute, HARD GATE). With sympy over Q, verify that
      S_3(z x1, z x2, z x3) - z S_3(x1, x2, x3) reduces to 0 modulo z^3 - 1 for a = 0
      and symbolic b, and verify that it FAILS for symbolic a != 0. If either check
      does not come out as H-EQIC-70a21a (S1) states, the line ends here at a cost of
      minutes and that is the reported result.
      STAGE 1 (minutes). Build T_rel(u1, x2) = Res_x1(S_3(x1, x2, x_R), x1^3 - u1) and
      T(u1, u2) = Res_x2(T_rel(u1, x2), x2^3 - u2) per (curve, target). Verify the four
      declared degrees exactly. Reduce mod p before expanding, to avoid symbolic
      coefficient growth over Z.
      STAGE 2 (minutes, BASELINE FIXTURE). Verify the r = 1 degeneration as an exact
      polynomial identity and verify that ENC-SYM and ENC-X then return identical
      reduced bases. A mismatch halts before any comparative number is produced.
      STAGE 3 (hours, THE COMPARISON). On each (field_bits, seed) cell, construct a
      j = 0 instance and a mu_3-stable base V of size 3m, exclude x = 0, and for each
      of 20 targets solve ENC-X, ENC-ASYM and ENC-SYM under the identical solver,
      order, modulus and machine, recording per solve the wall time, reduced-basis
      size, maximum total degree, solution count, certified-solution count, and
      whether the ideal is trivial. Include one satisfiable and one unsatisfiable
      target per cell so the trivial-ideal branch is exercised in every encoding.
      STAGE 4 (hours, THE BLOCKING NULL). Repeat STAGE 3 unchanged on a matched
      a != 0 curve at the same p and comparable group order, where the cube
      substitution still formally applies and no automorphism exists. Also run NULL-2,
      ENC-X on a uniformly drawn base of the same cardinality 3m on the same j = 0
      curve, and the ENC-ASYM solvable-fraction decay over epsilon, the fraction of
      broken orbits, at epsilon in {0, 0.25, 0.5, 0.75, 1.0}.
      STAGE 5 (zero compute). Assemble the three-encoding table with the NULL-1
      columns beside it. NO COST CLAIM MAY BE ASSEMBLED BEFORE NULL-1 IS IN THE SAME
      TABLE.
    instrument: >-
      Python 3.11 with sympy for resultants and Groebner bases over modulus p, and the
      existing harness/semaev.py call path with the polynomial system swapped;
      harness/endomorphism_la.py _find_zeta3 for the cube root of unity, re-verified
      per instance; harness/semaev.py verify_decomposition_certificate for independent
      re-verification of every claimed decomposition. No Sage. All runs recorded
      through harness/runner.py with a full manifest.
    parameters: >-
      field_bits in {12, 16, 20}; seeds {1, 2, 3}; arity 2; |V| = 3m the largest
      multiple of 3 not exceeding floor(sqrt(N)), with the degenerate orbit x = 0
      excluded and the exclusion recorded per cell; 20 targets per cell drawn from a
      frozen stream; monomial order grevlex; modulus p; encodings ENC-X, ENC-ASYM,
      ENC-SYM; null arms as in STAGE 4. Resultant construction time and memory are
      charged to the invariant encodings, and g (which depends only on V) is amortized
      across targets while T (which depends on x_R) is not.

  controls:
    - >-
      NULL-1, THE FAKE-INVARIANT CURVE, BLOCKING. The identical pipeline on a curve
      with a != 0, where the mu_3 semi-invariance fails but the substitution u = x^3
      and the resultant construction still formally produce a membership degree m and
      a norm of bidegree (6,6). If the measured saving is the same there, the saving
      belongs to the substitution and NOT to the endomorphism, and no phi-attributed
      claim may be made. This is the single most informative control in the design and
      the run is invalid without it.
    - >-
      NULL-2, THE CARDINALITY-MATCHED RANDOM BASE. ENC-X on a uniformly drawn base of
      the same size 3m on the same curve, isolating orbit structure from base size.
    - >-
      DECAY CONTROL. ENC-SYM is not well posed once orbits are broken, so the decay is
      measured on ENC-ASYM's solvable fraction over epsilon in {0, 0.25, 0.5, 0.75, 1}.
      The solvable fraction must fall to 0 as epsilon approaches 1; a saving that
      persists at epsilon = 1 is an artifact.
    - >-
      r = 1 DEGENERATION FIXTURE. ENC-SYM built with a one-element conjugate set must
      reproduce ENC-X as an exact polynomial identity and return identical bases.
    - >-
      SATISFIABLE AND UNSATISFIABLE TARGETS per cell, so the trivial-ideal branch is
      exercised in all three encodings and a fast trivial solve is not mistaken for a
      saving.
    - >-
      INDEPENDENT CERTIFICATE RE-VERIFICATION of every claimed decomposition, by a
      checker that does not use the solver's output path. Uncertified solutions are
      discarded and counted.
    - >-
      IDENTICAL SOLVER, MONOMIAL ORDER, MODULUS AND MACHINE across all encodings and
      all arms, executed in the same invocation, so the encoding is the only varied
      factor.

  independent_variables:
    - 'encoding: ENC-X versus ENC-ASYM versus ENC-SYM'
    - 'curve arm: a = 0 (real mu_3 automorphism) versus a != 0 (formal substitution)'
    - field_bits and hence m
    - 'base construction: mu_3-stable orbits versus uniformly random of matched size'
    - orbit-breaking fraction epsilon
    - 'target: satisfiable versus unsatisfiable'

  metrics:
    primary:
      - >-
        Groebner wall time in seconds per (encoding, cell, target), measured by the
        harness timer around the solver call only, with resultant construction time
        reported separately and charged to the invariant encodings.
      - >-
        Maximum total degree of the reduced Groebner basis per (encoding, cell,
        target), computed by taking the maximum over basis elements of the total
        degree of the leading monomial under grevlex; labelled an IMPLEMENTATION-BOUND
        solving-degree proxy (KN-TECH-004), never a solving degree.
      - >-
        Wall-time ratio ENC-X over ENC-SYM and ENC-X over ENC-ASYM, per cell, computed
        as the ratio of medians over the 20 targets, with the interquartile range
        reported alongside and the per-target win/loss count reported so a varying
        winner is visible.
      - >-
        NULL-1 separation, in ratio units, computed as (ratio at a = 0) minus (the
        same ratio at a != 0) at matched field_bits and matched m.
      - >-
        Constructed degrees of T_rel and T, as integers read off the built
        polynomials, compared against the declared (2, 6) and (6, 6) with total
        degree 12.
      - >-
        Independent relations recovered per solved ENC-SYM system, counted as the rank
        increment of the accumulated relation system over the m reduced unknowns after
        adding the recovered equation.
    secondary:
      - Reduced-basis cardinality per encoding per target.
      - Solutions found and solutions certified per encoding, with the discard count.
      - Resultant construction wall time and peak memory, charged per encoding.
      - Trivial-ideal rate per encoding on the unsatisfiable targets.
      - ENC-ASYM solvable fraction as a function of epsilon.
      - sha256 of the factor base, of g, of T_rel and of T per cell.
      - Per-cell uniformity flag - whether one encoding wins on all 20 targets.

  heuristic_under_test: null
  heuristic_under_test_note: >-
    Explicitly null, not omitted. H-EQIC-70a21a carries no numbered heuristic: its
    symbolic parts are exact identities and its cost parts are direct measurements.
    This contract is therefore not a heuristic-validation experiment and does not
    pretend to be one.

  preregistered_prediction:
    quantity: >-
      The pair (median wall-time ratio ENC-X over ENC-SYM at the largest affordable m,
      NULL-1 separation at the same m).
    formula: >-
      ratio(m) := median over targets of t_ENC-X / t_ENC-SYM at cell m; predicted
      ratio at least 2.0 for at least one invariant encoding and increasing in m.
      separation := ratio_{a=0}(m) - ratio_{a!=0}(m); predicted at least 0.5. Under
      the pre-registered competing explanation (exact cancellation of the r-fold
      degree inflation against the r^2-fold candidate deflation), ratio(m) = 1 within
      noise at every m and separation = 0.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-1ea327 predictions block and
      restated in H-EQIC-70a21a before any run under this contract exists. Never tuned
      to data; a run reporting a different quantity reports a different experiment.

  scale_relevance:
    tier: toy
    justification: >-
      Executed at field_bits 12 to 20 in pure Python, far below any cryptographic
      scale, because the comparison requires all three encodings to be solved to
      completion on the same instances and the incumbent ENC-X is the binding cost.
      The transfer assumption is stated and narrow - that the RELATIVE ordering of
      encodings on one solver at these sizes is indicative of the ordering at slightly
      larger sizes - and it is explicitly NOT used to claim any cost at cryptographic
      scale, nor any exponent, nor anything about an optimized F4/F5. The scoping is
      structural as well as budgetary: the mechanism exists only on curves whose
      isogeny class has CM discriminant -3, so no positive result reaches a curve
      chosen adversarially or at random.
    correspondence: null

  tail_checks:
    - >-
      Report the per-target win/loss counts, not only the median ratio; a median ratio
      above 2 driven by a few targets is a different finding from a uniform win and
      the quantifier audit turns on the difference.
    - >-
      Report the ratio's trend in m explicitly with its sign; a ratio above 1 but flat
      in m is a fixed overhead difference, not a structural saving.
    - >-
      Report the largest and smallest observed max-total-degree per encoding, since a
      single degenerate target can dominate a mean.
    - >-
      Report resultant construction cost as a fraction of the invariant encodings'
      total, since at small m it can exceed the Groebner saving outright.

  replication:
    seeds: [1, 2, 3]
    independent_instances: 3
    repeat_count_per_cell: 3
    note: >-
      Each (field_bits, seed) cell is an independent curve and base; each solve is
      repeated 3 times and the median taken, because pure-Python wall time is noisy at
      these sizes and a single timing is not a measurement.

  budget:
    wall_clock_seconds: 5400
    wall_clock_seconds_note: >-
      Per run. total_cpu_hours bounds the whole contract across all runs.
    total_cpu_hours: 8.0
    memory_gb: 8
    maximum_runs: 60

  stopping_rules:
    - >-
      Abort the entire contract if the STAGE 0 symbolic gate fails in either
      direction, and report only that.
    - >-
      Abort if the constructed degrees disagree with the declared ones, and report the
      constructed degrees.
    - >-
      Abort if the r = 1 degeneration fixture fails; no comparative number may be
      reported.
    - >-
      Skip a cell and record the skip if any single ENC-X solve exceeds 900 seconds;
      a skipped cell is a budget stop, never a negative result.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
      exhaustion is a stop, never a negative result (AGENTS.md rule 5).

  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence.
    - >-
      A run in which the NULL-1 arm was not executed in the same invocation as the
      signal arm is invalid_measurement - the comparison this contract exists to make
      was not made - and no cost claim may be extracted from it.
    - >-
      A run whose encodings did not share solver, monomial order, modulus and machine
      is invalid_measurement.
    - >-
      A run in which x = 0 was not excluded from a factor base is invalid_measurement,
      because f_V(x) = g(x^3) fails and the declared degrees are wrong.
    - >-
      Any claimed decomposition whose certificate fails independent re-verification
      makes the run completed_invalid (docs/claims-and-verification.md).
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT
      experiment and requires a new contract; it is never a repair of this one.

  success_criterion: >-
    ALL of the following, each decidable from the primary metrics. (1) The STAGE 0
    symbolic gate passes in both directions. (2) The constructed degrees equal
    deg_u1 T_rel = 2, deg_x2 T_rel = 6, deg_u1 T = deg_u2 T = 6, total degree 12
    exactly. (3) The r = 1 fixture reproduces ENC-X exactly. (4) Every reported
    decomposition is certificate-verified and independent relations per solved system
    is exactly 1.000. (5) The three-encoding table and the NULL-1 table are both
    complete at every executed cell. A run meeting (1) to (5) is a VALID run and its
    cost verdict is then read off the pre-registered prediction: the hypothesis's cost
    claim (S3) is SUPPORTED IN SCOPE only if the median wall-time ratio is at least
    2.0 at the largest executed m for at least one invariant encoding AND increasing
    in m AND the degree proxy is lower by at least 2; and the attribution claim (S4)
    is supported only if in addition the NULL-1 separation is at least 0.5.

  falsification_criterion:
    - >-
      The STAGE 0 gate failing in either direction falsifies (S1) with a symbolic
      counterexample certificate and the hypothesis is superseded.
    - >-
      Constructed degrees differing from the declared ones falsifies (S2) and voids
      every cost prediction built on the degree bookkeeping.
    - >-
      Median wall-time ratios inside [0.8, 2.0] at every executed m, or above 1 but
      flat in m, falsifies (S3) and records the pre-registered CANCELLATION verdict as
      the deliverable.
    - >-
      NULL-1 separation below 0.5 falsifies (S4). The saving, if any, belongs to the
      cube substitution; no phi-attributed claim may be made anywhere.
    - >-
      ENC-SYM wall time exceeding ENC-X at every tested m falsifies (S3) in the
      stronger direction; the obstruction is named as per-variable degree inflation,
      scoped to arity 2 and this solver.
    - >-
      A per-cell winner that varies target by target falsifies the intended quantifier
      order and downgrades any positive to unusable.
    - >-
      Independent relations per solved system differing from 1 means the relation
      arithmetic or the pipeline is wrong and nothing comparative is reportable.

  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment
    - raw-result.json carrying every per-target, per-encoding measurement, not summaries
    - the NULL-1 and NULL-2 arms' measurements in the same file as the signal arm
    - the STAGE 0 symbolic transcript and the r = 1 fixture transcript
    - sha256 of the factor base, g, T_rel and T per cell
    - certificates for every claimed decomposition, re-verified by the run wrapper
    - the three-encoding table and the NULL-1 table as emitted, not retyped

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not approve. This contract is review_required and NOT
      approved; approved_by is null and execution_authorized is false. Approval is the
      USER's gate because it authorizes execution and spends compute.
    - >-
      The proof_search_map on H-EQIC-70a21a must be audited against KN-TECH-080 before
      implementation, since the record carries symbolic proof obligations.
    - >-
      The blocking NULL-1 arm must remain in the frozen protocol. A version of this
      contract without it must not be approved, because it would license a
      phi-attributed claim the design cannot support.

  derivation_provenance:
    tool: coordinator subagent, /design-experiment lifecycle steps 3-5
    source_record: IDEA-20260807-1ea327
    authored_at: '2026-08-25'
    note: >-
      Every stage, control, metric and criterion is taken from the parent proposal's
      mechanism, minimal_test, predictions and falsification_conditions blocks, or is
      program boilerplate from a fixed table (invalidation rules, required artifacts,
      approval gate). Budgets come from the parent's estimated_cost.compute of medium.
      No measurement, timing, run or citation is invented; a value the proposal did
      not supply is null and is marked as a derivation gap.

  derivation_gaps:
    - >-
      The largest affordable m is not fixed in advance because it depends on ENC-X's
      cost at field_bits 20 on the execution machine. The contract fixes the base-size
      RULE, not the number, and the executed m must be recorded per cell; a comparison
      quoted at an unrecorded m is not interpretable.
    - >-
      The a != 0 null curve's group order can only be made comparable, not equal, to
      the a = 0 arm's. The contract requires the achieved orders and the achieved m to
      be recorded per arm so a reviewer can judge whether the arms are comparable at
      all; if they are not, the NULL-1 separation is uninterpretable and must be
      reported as such rather than as a number.
    - >-
      The parent proposal notes that solver idiosyncrasy is a confounder and that a
      second solver on frozen seeds is the mitigation. No second solver is available
      in this environment (no Sage), so the contract cannot discharge it. Every ratio
      reported is valid WITHIN sympy only, and that qualifier must travel with it.
    - >-
      Whether the S_m symmetrization of KN-LIT-004 composes with the mu_3 quotient is
      a prediction of the parent record and is NOT tested here; a composed encoding
      would be a different contract.
