experiment:
  id: EXP-SIMSPK-a82a61
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-5552b8; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-5552b8
  question_id: RQ-SIMSPK-f6a6c0
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Resampling max-statistic null over the SIMON portfolio: corrected percentile of the standardized
    rotation triple''s most extreme standardized rank, with leave-one-measure-out sensitivity, a Bonferroni
    comparison and a permuted-signal calibration check'
  objective: 'A run reduces exactly one uncertainty: what the RQ''s any-measure question can be answered
    with, once the fact that several measures were computed is paid for. Concretely it determines
    (i) whether the procedure is calibrated, measured by replacing the signal with 200 randomly drawn
    constant sets and confirming the resulting corrected percentiles are approximately uniform, which
    is the only check that the whole construction reports honest positions rather than manufactured
    ones; (ii) the empirical null distribution of T, the maximum standardized rank across the frozen
    portfolio, obtained by scoring N uniformly drawn constant sets through the identical pipeline
    before the standardized triple is scored at all, together with its number of distinct values and
    per-measure marginal uniformity; and (iii) the standardized triple''s corrected percentile of
    T with a binomial interval, its full per-measure z vector, the identity of the argmax measure
    reported as description only, and the five leave-one-measure-out recomputations that show whether
    the headline number rests on any single measure. The Bonferroni comparison and the redundant-surrogate
    control are reported alongside. No hypothesis is minted and no measure-specific claim is produced.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'At most, a run could support: for the portfolio frozen and hashed
      in STAGE A, at the word size and round counts actually run, under the frozen censoring rule,
      with N null draws, (a) a calibration result showing the procedure''s percentiles are or are
      not uniform under a null signal; (b) an empirical null distribution of T with its resolution
      stated; (c) the standardized triple''s corrected percentile of T with a binomial interval of
      width at least 1/(N+1); and (d) the five leave-one-measure-out values and the Bonferroni comparison.
      What does NOT follow: any claim that the standardized constants are anomalous or unremarkable
      under any INDIVIDUAL measure, since the statistic deliberately does not support one; any claim
      about a backdoor, a trapdoor, designer intent, organisational motive or provenance in either
      direction; any clearance, endorsement or security statement about any SIMON variant; any attack,
      distinguisher or complexity claim; any transfer to word sizes, round counts or portfolio memberships
      not run; and any inference from the argmax measure''s identity, which is reported as a label
      and not as a finding.'
  inputs:
    procedure: 'STAGE 0, freeze and hash the portfolio specification: membership, per-measure scoring
      procedure, word size, round counts, censoring rule, standardization map, N. Zero compute, 1
      to 2 hours human, and this hash is what makes the run interpretable. STAGE 1, dependency check:
      confirm each portfolio measure has been validated by its own contract and record the validation
      identifiers; an unvalidated measure is either excluded or the whole run is labelled instrument-conditional.
      Minutes. STAGE 2, null draws: score N = 2000 uniformly drawn constant sets through every portfolio
      measure, recording full score vectors, censoring flags and per-draw timing. This stage runs
      to completion before STAGE 4 begins and the ordering is recorded. Cost dominates the run and
      is bounded by the declared budget. STAGE 3, null assembly: leave-one-out standardization, T
      per draw, empirical distribution, marginal uniformity checks, distinct-value count. Seconds.
      STAGE 4, signal: score the standardized triple through the identical pipeline, compute T, report
      the corrected percentile with interval. Minutes. STAGE 5, sensitivity: five leave-one-measure-out
      recomputations, Bonferroni comparison, redundant-surrogate control. Minutes. STAGE 6, calibration:
      200 permuted-signal draws through STAGE 4, uniformity check on the resulting percentiles. Cost
      equal to 200 signal evaluations.'
    instrument: CPython 3.11 standard library only; numpy, z3, python-sat and pulp are absent in this
      environment as verified on 2026-08-16 and Sage is excluded by contract. Ranking, mid-rank standardization,
      the binomial interval and the uniformity check are implemented from scratch and cross-checked
      against hand-computed values on a fixed 12-element fixture stored in the run directory. The
      portfolio measures are invoked as separate frozen modules from their own contracts rather than
      reimplemented here, so this contract contributes only the statistic. Draws come from a seeded
      random.Random with the seed in the manifest and the draw order recorded. Manifest, seeding and
      per-stage timing follow harness/runner.py conventions; identifiers minted with tools/allocate_id.py
      --note the allocate_id tool is used with --next rather than by scanning state.
    parameters: 'Word size n = 8 for the full-portfolio arm, with the surrogate-portfolio calibration
      arm also at n = 8. Portfolio size 5 measures, plus one deliberately redundant sixth for the
      control arm only. N = 2000 null draws, giving a corrected-percentile resolution of about 0.0005
      and a binomial interval half-width of roughly 0.011 at the median. Permuted-signal calibration:
      200 draws. Leave-one-measure-out: 5 recomputations. Round counts fixed per measure by that measure''s
      own contract and recorded. Censoring rule frozen: any cell not completed within its measure''s
      declared per-cell budget is flagged, and a constant with more than a declared fraction of censored
      cells is dropped from both arms symmetrically. Declared marginal-concentration ceiling: no single
      rank may hold more than 25 percent of null mass for a measure to remain in the portfolio. Total
      run ceiling 5400 seconds excluding the portfolio measures'' own budgets.'
  controls:
  - 'Redundant-surrogate control: a measure that is a deterministic monotone function of another is
    added to the portfolio, and the corrected percentile must not move materially; movement indicates
    the construction manufactures significance from correlated measures.'
  - Bonferroni comparison computed on the same five per-measure percentiles, reported alongside so
    the power gained by retaining dependence is a visible number.
  - Leave-one-measure-out recomputation, all five, reported as a set rather than summarized.
  - 'Permuted-signal control: replace the standardized triple with a randomly drawn constant set and
    recompute the corrected percentile 200 times; the resulting percentiles must be approximately
    uniform on [0,1], which is the direct check that the whole procedure is calibrated.'
  - 'Ordering audit: the run record must show null draws scored before the standardized triple, since
    a null assembled after the signal is not a null.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a rotation constant set drawn uniformly at random
    from the same constant space, of the same shape as the standardized set, scored through the IDENTICAL
    pipeline with the identical round counts, budgets and censoring rules, in the same invocation.
    The null is not a robustness check here, it is the statistic''s definition: without it T has no
    scale. What the null must show for the signal arm to mean anything: first, that each per-measure
    marginal rank is approximately uniform over the null family, which is a direct check that the
    standardization is doing its job and is falsified by a measure whose ties concentrate mass at
    a few ranks; second, that the empirical distribution of T has at least a declared number of distinct
    values so a percentile can be stated with an interval; and third, that leave-one-out standardization
    changes no null draw''s T by more than a declared tolerance, confirming that the standardization
    is not dominated by any single draw. If any of the three fails, no corrected percentile may be
    reported for the standardized triple at all.'
  independent_variables:
  - portfolio membership (full, each of five hold-outs, plus-redundant-surrogate)
  - arm (null draw, standardized signal, permuted signal)
  - correction method (resampling max-statistic versus Bonferroni)
  - number of null draws N
  - word size n
  metrics:
    primary:
    - corrected percentile of the standardized triple's T with binomial interval
    - distribution of corrected percentiles over 200 permuted-signal draws, and its deviation from
      uniform
    - number of distinct T values among N null draws
    - per-measure marginal rank uniformity deviation over the null family
    secondary:
    - full per-measure z vector for the standardized triple and the argmax measure identity
    - five leave-one-measure-out corrected percentiles
    - Bonferroni-corrected percentile and its gap to the resampling value
    - change in corrected percentile under the redundant-surrogate control
    - censoring rate per measure per arm
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The corrected percentile of the standardized rotation triple's maximum standardized
      rank T within the empirical null distribution of T built from N uniformly drawn constant sets,
      together with the uniformity of the corrected-percentile distribution over 200 permuted-signal
      calibration draws.
    formula: For each constant set c and each measure m in the frozen portfolio, z_m(c) is the mid-rank
      percentile of c's raw measure value within the null family, computed leave-one-out so that c
      is not ranked against itself, and oriented so that larger z means more extreme in the direction
      the measure's own contract declares. T(c) = max over m of z_m(c). The corrected percentile of
      the standardized triple s is the fraction of null draws c with T(c) at least T(s), reported
      with an exact binomial interval at N draws. The calibration prediction is that, when s is replaced
      by a uniformly drawn constant set, the resulting corrected percentiles are uniform on the unit
      interval; the predicted deviation from uniform is zero up to sampling error at 200 draws. No
      value is pre-committed for the standardized triple itself, because doing so would be pre-committing
      an answer to the RQ's central question.
    source: Pre-registered in the parent proposal IDEA-20260816-5552b8 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Everything runs at word size 8, block 16 bits, against a family whose smallest
      deployed block size is 32 bits, and the word size is chosen as the smallest at which every portfolio
      measure has been shown to possess resolution by its own contract. The statistic itself is scale-free:
      it is a property of the ranking procedure rather than of the cipher, so its calibration result
      transfers to any word size at which the same procedure is run, and that is the one thing this
      contract claims transfers. The corrected percentile does NOT transfer: it is a statement about
      the standardized triple''s position at this word size and these round counts, and a percentile
      computed at word size 16 would be a different number requiring its own null. The transfer of
      the percentile is exactly what the separate transfer contract exists to measure, and this contract
      asserts nothing about it.'
    correspondence: null
  tail_checks:
  - The extreme order statistics of the null T distribution, the largest and smallest five values,
    are reported explicitly, since the corrected percentile of an extreme signal is determined entirely
    by them.
  - Null draws with any censored cell are reported as a separate stratum and the corrected percentile
    is recomputed with them excluded, so a censoring-driven tail is visible.
  - Constant sets with degenerate structure, for example a = b, are reported as their own stratum
    in both arms since their measure values may be atypical in every coordinate at once.
  - The behaviour of the corrected percentile at N/2, N and 2N draws is reported, so a percentile
    that moves with N is caught rather than reported as stable.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt and withhold every reported percentile if the permuted-signal calibration shows a materially
    non-uniform distribution; a miscalibrated procedure produces no admissible number.
  - Halt and exclude any measure whose null marginal concentrates more than 25 percent of mass at
    a single rank, recording the exclusion, before any signal is scored.
  - Halt the run at its declared ceiling and report the number of null draws actually completed; a
    truncated null is reported with its actual N and its wider interval, never padded.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The permuted-signal calibration produces corrected percentiles consistent with
    uniform, the null T distribution has at least 20 distinct values, every retained measure's null
    marginal passes the concentration ceiling, and the standardized triple's corrected percentile
    is reported with its binomial interval alongside all five leave-one-measure-out values.
  falsification_criterion:
  - Materially non-uniform corrected percentiles in the permuted-signal calibration.
  - The redundant-surrogate control moving the corrected percentile beyond its binomial interval.
  - Fewer than 20 distinct T values among N null draws.
  - Any retained measure's null marginal concentrating more than 25 percent of mass at one rank.
  - Differential censoring rates between the null and signal arms beyond a declared tolerance.
  - A run record that cannot establish that null draws were scored before the standardized triple.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-5552b8
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Portfolio membership must be fixed and hashed by the Coordinator before any scoring, and the Coordinator
    must decide what happens to a measure that turns out too expensive to run N times, since excluding
    it after the fact is a researcher degree of freedom the statistic cannot absorb.
  - The orientation of each measure, which direction counts as more extreme, must be declared per
    measure in its own contract before standardization; an orientation chosen after seeing the standardized
    triple's value would invert the meaning of the corrected percentile.
  - The value of N is a budget-versus-resolution tradeoff the Coordinator owns; N = 2000 is a proposal-level
    suggestion giving roughly 0.011 interval half-width, and a smaller N must be accompanied by a
    wider reported interval rather than by a rounder number.
  - Whether the corrected percentile may be computed at all when one portfolio measure is unvalidated,
    or whether the run must be labelled instrument-conditional throughout, is a Coordinator call this
    proposal does not make.
