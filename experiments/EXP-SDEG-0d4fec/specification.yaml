experiment:
  id: EXP-SDEG-0d4fec
  hypothesis_id: H-SDEG-3f7790
  question_id: RQ-SDEG-001
  goal_id: GOAL-SDEG-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  approved_by: null
  source_proposal: IDEA-20260805-83344d
  companion_proposal: IDEA-20260805-decb14
  assigned_to: executor

  title: >-
    Four-stage comparator audit of RATE-DS-1: does the number HEUR-DS-1 measures
    against equal the Dickman function, the exact smooth density, or the
    forward-Euler error floor of its own implementation

  objective: >-
    Establish, at the three completed and two queued cells of EXP-DS-001's
    HEUR-DS-1 ladder, what value the RATE-DS-1 comparator p0 SHOULD take under
    each of three candidate definitions, what value it DID take, and what verdict
    and band margin follow from each. Report the resulting trend direction and
    the forecast verdict at bits = 28 and 32 BEFORE any ladder extension is run.
    Every stage is arithmetic; the entire treatment arm is seconds of pure-Python
    compute with no third-party dependency.

  what_this_is_not:
    - Not an ECDLP attack, a decomposition, a relation search, or a solve.
    - Not a cost, runtime, asymptotic, exponent, crypto-scale, or deployed-scheme claim.
    - Not a claim that HEUR-DS-1 is true, or that it is false.
    - >-
      Not a claim that any evidence record is wrong. Twelve evidence records
      reference HEUR-DS-1; none of their conclusions is evaluated here.
    - >-
      Not a status change, and not a request for one. It does not promote,
      demote, retire, or reopen EXP-DS-001, H-DS-001, H-SMTH-001, HEUR-DS-1, the
      HEUR_DS_1_anti_promotion gate, or any goal.
    - >-
      Not an execution of, or an amendment to, EXP-DS-001. Its specification,
      results, and implementation are read-only inputs and are never modified.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.
    - >-
      Not a statement about KS-DS-1 or TAIL-DS-1, which consume Dickman-derived
      quantities and are therefore exposed to the same defect but are OUT OF
      SCOPE and are named only as forward guidance.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: that at the five named cells (B = 64, m = 4, D = 2^(2 bits),
      bits in {16, 20, 24, 28, 32}) the comparator implemented by
      ds001_driver.py:dickman_rho differs from the Dickman function and from the
      exact density of 64-smooth integers below D by stated factors; that the
      RATE-DS-1 verdict and band margin under each comparator are as computed;
      and that under the current implementation the forecast verdict at 28 and 32
      bits is as stated, CONDITIONAL on the declared p_hat extrapolation.
    explicitly_not_supportable_under_any_outcome: >-
      Any statement about prime-field decomposition cost; any statement about
      C_decomp, the index-calculus exponent alpha, or GOAL-ICEX-001; any
      crypto-scale conclusion; any conclusion about the truth of HEUR-DS-1; any
      conclusion about the correctness of any evidence record; closure or
      narrowing of KN-OPEN-002. Toy evidence is never crypto-scale evidence
      (AGENTS.md rule 7).

  scale_relevance:
    tier: toy
    justification: >-
      The treatment is arithmetic on numbers, not on curves, so "scale" enters
      only through the cells being audited, all of which are 16-32 bit toy cells
      of an existing toy experiment. TRANSFER STATEMENT: the numerical-analysis
      finding (a first-order scheme's absolute error floor swamps a rapidly
      decaying solution) is scale-free and would hold identically for any u; the
      CONSEQUENCES are confined to the cells actually audited and transfer
      nowhere else without a separate audit of the consuming record.
    correspondence: null

  inputs:
    read_only_artifacts:
      - path: experiments/EXP-DS-001/results/HEUR_DS_1_report.json
        role: the committed rho_u_star and p_hat values under audit
      - path: experiments/EXP-DS-001/specification.v2.yaml
        role: heur_ds_1_decision_rule, verbatim, applied without restatement
      - path: experiments/EXP-DS-001/implementation/ds001_driver.py
        role: the dickman_rho implementation under audit, run verbatim
      - path: experiments/EXP-LPF-001/implementation/lpf001_driver.py
        role: >-
          the corpus's own FROZEN_RHO_TABLE (u = 1..6),
          DICKMAN_REPRODUCTION_TOLERANCE = 0.01, and an independent Simpson
          solver used as reference scheme B
      - path: coordination/tasks/TASK-20260724-P13-REV-R1/numerical_checks.py
        role: a third independent rho implementation, run for the register row
    cells_under_audit:
      B: 64
      m: 4
      d_half: 2
      D_rule: "D(bits, m) = 2**(bits * d_half[m]); at m = 4 this is 2**(2*bits)"
      u_star_rule: "u*(bits, B, m) = ln(D) / ln(B); at B = 64 this is bits/3"
      bits_completed: [16, 20, 24]
      bits_queued: [28, 32]
      committed_p_hat: {16: 0.14746, 20: 0.04836, 24: 0.016}
      committed_rho_u_star:
        16: 0.0025165067046856934
        20: 0.0017957280493462733
        24: 0.0014431270058181517
    grid_steps_for_refinement: [0.01, 0.005, 0.002, 0.001]
    reference_solver_A:
      form: "u * rho(u) = integral_{u-1}^{u} rho(t) dt, implicit in the right endpoint"
      quadrature: trapezoid
      grid_steps: [0.0002, 0.00005]
      richardson: required, reported
    reference_solver_B:
      form: same integral equation
      quadrature: composite Simpson (the lpf001_driver.py scheme, independently reimplemented)
      grid_steps: [0.00025]
      note: >-
        Scheme B must NOT be derived from scheme A's code. Two implementations of
        the same quadrature are one scheme, not two.
    exact_density_recursion:
      formula: "Psi(N, k) = Psi(N, k-1) + Psi(floor(N / p_k), k),  Psi(N, 0) = 1 for N >= 1"
      arithmetic: exact Python integers; no float anywhere in the recursion
      primes: the 18 primes below 64
      hand_control: "Psi(100, 5) = 34, enumerable by hand"
    sampling_control_instance:
      draws: 200000
      range: uniform integers in (1, 2**32]
      test: exact trial division by the 18 primes below 64
    seeds: [20260805]
    seed_derivation_rule: >-
      All randomness in this contract is confined to the 200,000-draw sampling
      positive control. Seed = int(SHA256(ASCII of
      "EXP-SDEG-0d4fec/v1|sampling-control|" + decimal(counter))) taken as a
      big-endian unsigned integer and reduced mod 2**64, counter starting at 0
      and incrementing once per draw block of 10,000. The base label
      "EXP-SDEG-0d4fec/v1" and counter start 0 are frozen here so a third party
      reproduces the instance stream bit-for-bit. Every other stage is
      deterministic and seedless.
    environment_declaration:
      measured_in_this_session: >-
        python3 --version 3.11.15; `import numpy` SUCCEEDS at 2.4.6;
        `import sympy` FAILS (ModuleNotFoundError); `import sage` FAILS
        (ModuleNotFoundError). Recorded because two independent scouting sweeps
        of this session disagreed about numpy's availability.
      dependency_policy: >-
        Stages 0-3 MUST run on the standard library alone. If any stage requires
        an absent dependency, that is an INFRASTRUCTURE REQUEST and is reported as
        infrastructure signal, never as a result (AGENTS.md rule 5).

  stages:
    - id: S0
      name: provenance
      cost: minutes, zero compute beyond file reads
      action: >-
        Re-run ds001_driver.py:dickman_rho verbatim at u = 16/3, 20/3, 8 and
        compare with the three committed rho_u_star decimals. Locate and record
        the run manifest that produced HEUR_DS_1_report.json, including its
        commit and dirty-tree state.
      terminating_condition: >-
        If the three values are not reproduced to 17 significant figures, the
        audit's subject is unidentified. REPORT AND STOP; the deliverable is a
        provenance finding, not a comparator finding.
    - id: S1
      name: forced-value tables
      cost: seconds
      action: >-
        Produce FV-1 (rho_driver(8, h)/h at four grid steps), FV-2 (reference rho
        at u = 2, 3, 4, 5, 6, 16/3, 20/3, 8, 28/3, 32/3 from BOTH reference
        schemes with the Richardson estimate), and FV-3 (exact Psi(2^(2b), 64) at
        the five bit sizes, with the Psi(100,5) = 34 control).
      terminating_condition: >-
        THIS IS THE CHEAPEST DECISIVE GATE AND IT CAN END THE WHOLE EXPERIMENT.
        If rho_driver(8, h)/h is constant AND equals rho(8) -- i.e. the driver is
        accurate -- there is no comparator finding and the run stops with a clean
        negative plus the explicit clearance that extending the ladder is safe.
    - id: S2
      name: decision-rule recomputation and forecast
      cost: seconds
      action: >-
        Apply RATE-DS-1 verbatim under each of the three comparators at each
        completed cell; report verdict and band margin p_hat/(8 p0) for all nine
        combinations. Compute the satisfiability floor n_min per cell per
        comparator. Compute the forecast band and verdict at 28 and 32 bits under
        the current implementation, with the p_hat extrapolation stated as
        HEUR-CMP-2 and its interval carried.
      terminating_condition: none; S2 always completes if S1 completes.
    - id: S3
      name: realised size distribution (defect D3)
      cost: minutes
      action: >-
        Emit the empirical distribution of log2(N_j) at each completed cell and
        compare its median with the frozen bound log2(D) = 2 * bits.
      terminating_condition: >-
        NOT AUTHORIZED BY THIS CONTRACT. S3 is the only stage that touches
        EXP-DS-001's sampling code path. GOAL-SDEG-001's committed next_action is
        "Defer activation/executor ... no runs now" and this contract does not
        override it. S3 requires a separate committed Coordinator ledger
        authorization. If unauthorized, S3 is reported NOT REACHED, which is a
        scope statement and never a result.

  arms_and_controls:
    treatment: >-
      ARM-T. The corrected comparators: reference rho from two independent
      schemes, and the exact density Psi(D, 64)/D, evaluated at the five cells.
    measured_null: >-
      ARM-N (NULL OBJECT OF THE SAME SHAPE, FORCED VALUE DERIVED PRE-RUN, ABLE TO
      FAIL). The committed driver comparator evaluated at u = 2 and u = 3, where
      the Dickman function is large compared with any plausible O(h) floor.
      FORCED VALUES, FIXED BEFORE EXECUTION: driver returns 3.093466e-01 at u = 2
      against a closed-form 1 - ln 2 = 3.0685282e-01 (+0.81 per cent) and
      5.249470e-02 at u = 3 against the corpus's own frozen 4.8608e-02
      (+8.0 per cent). PASS BAND: within 2 per cent at u = 2. THIS NULL CAN FAIL:
      a driver that also misses at u = 2 is broken outright, which is a DIFFERENT
      and WEAKER finding than the error-floor diagnosis and must be reported as
      the weaker one.
    positive_control: >-
      ARM-P (THE EFFECT MUST APPEAR; IF IT DOES NOT, THE INSTRUMENT IS BROKEN AND
      NO NEGATIVE MAY BE REPORTED FROM ANY STAGE). Two parts, both with
      thresholds declared before execution.
      (P-a) HAND CONTROL: the exact-count recursion must return Psi(100, 5) = 34,
      a value obtained by direct enumeration and independently checkable in a
      minute.
      (P-b) SAMPLING CONTROL: 200,000 uniform draws in (1, 2^32] tested for
      64-smoothness by exact trial division must yield a count in [80, 140]
      (expectation 108.0 = 200000 * 5.402167e-04, Poisson sd 10.4, band about
      +/- 2.7 sd). This ties the exact count to a measurement and is the only
      arm in the contract that can void the whole audit.
    graded_controls:
      - id: G-GRID
        interior_points: 4
        variable: grid step h in {0.01, 0.005, 0.002, 0.001}
        quantity_reported: rho_driver(8, h) / h
        expected_shape: >-
          CONSTANT to within 1 per cent (forced values 0.14431, 0.14443, 0.14451,
          0.14455, monotone increasing). Monotonicity IS reported. A
          non-constant ratio localises the defect away from discretization.
      - id: G-U
        interior_points: 5
        variable: u in {16/3, 20/3, 8, 28/3, 32/3}
        quantity_reported: rho_driver(u, 0.01) / rho_reference(u)
        expected_shape: >-
          STRICTLY MONOTONE INCREASING (forced 18.12, 711.8, 4.465e4, 3.893e6,
          4.454e8). This is the canonical artifact test of
          docs/inventor-protocol.md section 3 applied to the comparator: the
          quantity that ought to decay as u rises is rho, and the driver's does
          not, so the ratio must diverge. A flat or decreasing ratio refutes the
          mechanism and localises the obstruction to the reference solver
          instead.
      - id: G-B
        interior_points: 5
        variable: bits in {16, 20, 24, 28, 32}
        quantity_reported: Psi(D, 64) / (D rho(u*))
        expected_shape: >-
          STRICTLY MONOTONE INCREASING (forced 3.889, 7.245, 14.86, 33.40,
          81.97), as the fixed-y regime requires. Non-monotone localises an error
          in the counting.
    ordering_control: >-
      MANDATORY AND FROZEN. The null arm (ARM-N) and the driver-comparator
      recomputation are executed and their results COMMITTED BEFORE the corrected
      comparators are evaluated at any completed cell. The executor records a
      commit for the null-arm results before reading ARM-T. This prevents the
      comparator being chosen after seeing which one changes a verdict.
    comparability_policy: >-
      All three comparators are evaluated at the SAME u*, from the SAME frozen
      D_rule, against the SAME committed p_hat, under the SAME verbatim
      RATE-DS-1 rule with c = 8. No comparator is given a different tolerance, a
      different D, or a different sample-size assumption. Where a comparator
      cannot be computed (exact Psi at B = 128 and B = 256) the cell is reported
      MISSING and is never interpolated, extrapolated, or replaced by the
      nearest available value.

  independent_variables:
    - grid step h of the audited implementation
    - u (equivalently bits, at fixed B and m)
    - comparator definition (driver / reference rho / exact density)

  metrics:
    primary:
      - id: M1
        name: grid_linearity_spread
        definition: max relative spread of rho_driver(8, h)/h across the four grid steps
      - id: M2
        name: reference_scheme_disagreement
        definition: max relative disagreement between reference solvers A and B over the ten audited u
      - id: M3
        name: comparator_ratio
        definition: rho_driver(u*, 0.01) / rho_reference(u*) at each of the five cells
      - id: M4
        name: rate_ds1_verdict_and_margin
        definition: >-
          verdict and p_hat/(8 p0) at each completed cell under each of the three
          comparators, nine combinations
      - id: M5
        name: trend_direction
        definition: >-
          the sequence p_hat/p0 across bits = 16, 20, 24 under each comparator,
          reported with its monotonicity classified as increasing or decreasing
    secondary:
      - id: M6
        name: exact_smooth_counts
        definition: Psi(2^(2b), 64) as exact integers at the five bit sizes
      - id: M7
        name: fixed_B_correction
        definition: Psi(D,64)/(D rho(u*)) at the five cells
      - id: M8
        name: satisfiability_floor
        definition: >-
          smallest n for which RATE-DS-1 can be passed by a population exactly
          uniform on (1, D], per cell per comparator
      - id: M9
        name: forecast_verdict
        definition: forecast RATE-DS-1 verdict at bits = 28, 32 under the current implementation
      - id: M10
        name: cross_implementation_register
        definition: >-
          discrepancy of each of the three corpus rho implementations against
          FROZEN_RHO_TABLE at u = 2, 3, 4, 5, 6, with each implementation's grid
          recorded
      - id: M11
        name: realised_size_distribution
        definition: >-
          median and 5th/95th percentiles of log2(N_j) per cell. REPORTED AS NOT
          REACHED unless S3 is separately authorized.

  preregistered_prediction:
    quantity: >-
      The comparator p0 at each cell under each definition, the resulting
      RATE-DS-1 verdict and margin, and the direction of the p_hat/p0 trend.
    formula: >-
      p0_driver = the committed forward-Euler recurrence at h = 0.01;
      p0_reference = the solution of u rho(u) = int_{u-1}^u rho(t) dt;
      p0_exact = Psi(D, B)/D by the divisibility partition.
      RATE-DS-1: pass iff p0/8 <= p_hat <= 8 p0 when p0 >= 1e-15, else pass iff
      p_hat = 0. Verbatim from experiments/EXP-DS-001/specification.v2.yaml.
    source: >-
      H-SDEG-3f7790 predictions G1-G8 and heuristic assumptions HEUR-CMP-1..3.
      All forced values below were derived and computed BEFORE this contract was
      written, are recorded in IDEA-20260805-83344d, and are GENERATOR-COMPUTED
      OUTSIDE THE HARNESS -- they are the thing this run re-derives, not evidence.
    forced_values:
      M1_spread: "< 0.01 (computed 0.0017)"
      M2_disagreement: "< 0.01"
      M3_ratios: [18.12, 711.8, 44650, 3.893e6, 4.454e8]
      M4_verdicts: "FAIL at all nine combinations"
      M4_margin_bits24_driver: 1.386
      M5_trend_driver: "58.6, 26.9, 11.1 -- DECREASING"
      M5_trend_reference: "1.062e3, 1.917e4, 4.950e5 -- INCREASING"
      M5_trend_exact: "273, 2646, 3.332e4 -- INCREASING"
      M6_counts: [2320213, 20097408, 135168022, 747101831, 3527728593]
      M7_correction: [3.889, 7.245, 14.86, 33.40, 81.97]
      M8_floor_bits24: "n >= 1.67e7 (exact density), n >= 2.48e8 (Dickman)"
      M9_forecast: "PASS at bits = 28 and 32, conditional on HEUR-CMP-2"
      control_P_a: "Psi(100,5) = 34"
      control_P_b: "count in [80, 140], expectation 108.0"
      control_ARM_N: "driver at u = 2 within 2 per cent of 1 - ln 2"

  replication:
    seeds: [20260805]
    independent_instances: 1
    determinism_note: >-
      Stages S0-S2 are fully deterministic; replication means an independent
      REIMPLEMENTATION, not a reseeding. Required: reference solver B must be
      written without reference to solver A's source, and the Psi recursion must
      be independently reimplemented. Seeded replication applies only to the
      200,000-draw sampling control, which is repeated three times with counters
      0, 1, 2 and all three counts reported.

  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 4
    maximum_runs: 6

  stopping_rules:
    - id: SR1
      rule: >-
        S0 fails to reproduce the three committed decimals -> STOP. Emit a
        provenance report. No comparator conclusion.
    - id: SR2
      rule: >-
        S1 shows the driver accurate at u >= 8 -> STOP. Emit the clean negative
        AND the explicit clearance that the ladder extension is safe to run.
    - id: SR3
      rule: >-
        Reference solvers A and B disagree by more than 1 per cent at any audited
        u -> STOP. Emit an infrastructure report; no comparator is established.
    - id: SR4
      rule: >-
        Either positive control (P-a or P-b) fails -> STOP. NO NEGATIVE OF ANY
        KIND MAY BE REPORTED. The instrument is unvalidated.
    - id: SR5
      rule: >-
        Budget exhaustion -> report exactly which stages completed and which did
        not. An exhausted budget is reported as such and never as a result
        (AGENTS.md rule 5).
    - id: SR6
      rule: >-
        S3 is not separately authorized -> S3 is reported NOT REACHED and defect
        D3 is reported UNSETTLED. This is a scope statement, not a negative.

  invalidation_rules:
    - >-
      Any use of a float in the Psi recursion invalidates M6 and M7.
    - >-
      Any evaluation of a corrected comparator at a completed cell BEFORE the
      null-arm commit invalidates the ordering control and hence M4 and M5.
    - >-
      Any restatement of RATE-DS-1's thresholds, of c = 8, of D_rule, or of
      u_star_rule invalidates the whole run. The rule is applied verbatim or not
      at all.
    - >-
      Any substitution of an interpolated or extrapolated value for a MISSING
      exact-density cell invalidates M7.
    - >-
      Any modification of a file under experiments/EXP-DS-001/ invalidates the
      run outright; those artifacts are read-only inputs.
    - >-
      Reporting M9 without its HEUR-CMP-2 conditional attached invalidates M9.

  infrastructure_failure_disposition: >-
    A timeout, crash, out-of-memory, or missing dependency at ANY stage is
    recorded as INFRASTRUCTURE SIGNAL with the exact command, the exit status and
    the resource state, and is NEVER negative mathematical evidence and never
    evidence for or against HEUR-DS-1, the comparator, or any hypothesis
    (AGENTS.md rule 5). Specifically anticipated: the exact-density recursion is
    expected to exhaust memory at B = 128 and B = 256; those cells are declared
    MISSING in advance, their absence is an infrastructure fact, and no value is
    inferred for them.

  success_criterion: >-
    The run SUCCEEDS -- meaning it produces a usable, citable audit, NOT that any
    particular conclusion is reached -- when all of the following hold:
    (1) both positive controls pass (Psi(100,5) = 34 and the sampling count in
    [80, 140]); (2) the two reference schemes agree within 1 per cent at every
    audited u; (3) the null arm result is committed before the treatment arm is
    read; and (4) M1-M5 are reported for all five cells with every MISSING cell
    declared. A run meeting (1)-(4) is successful whether it confirms or refutes
    H-SDEG-3f7790.

  falsification_criterion: >-
    H-SDEG-3f7790 is FALSIFIED, in the sense that its assertion C1 fails, if
    M1 >= 0.01 (rho_driver(8,h)/h is not constant in h) or if M3 is not strictly
    monotone increasing across the five cells. It is PARTIALLY falsified if M4
    contradicts the verdict-invariance prediction (some comparator flips a
    recorded verdict) -- which must be reported as a pre-registered surprise and
    routed to a correction record, NOT presented as the finding. It is falsified
    on its forecast alone if a later authorized ladder extension measures
    p_hat(28) outside [3.5e-03, 8.0e-03]; C1, C2 and C4 are unaffected by that
    and the report must say so explicitly rather than let one failure discredit
    the rest.

  required_artifacts:
    - the exact command line and git commit for every stage, with dirty-tree state
    - the S0 reproduction: three driver values against three committed decimals, to full precision
    - the run manifest id for HEUR_DS_1_report.json, or an explicit record that it could not be located
    - FV-1 table: rho_driver(8, h) and rho_driver(8, h)/h at four grid steps
    - FV-2 table: both reference schemes at ten u values, with the Richardson estimate and the pairwise disagreement
    - FV-3 table: exact integer Psi counts, the recursion source, and the Psi(100,5) control
    - the three-implementation register against FROZEN_RHO_TABLE, with each implementation's grid step
    - the nine-combination RATE-DS-1 verdict and margin table
    - the trend table with monotonicity classified per comparator
    - the satisfiability-floor table
    - the forecast table for 28 and 32 bits with the HEUR-CMP-2 interval attached
    - null-arm results and their commit sha, timestamped before the treatment-arm read
    - both positive-control results with seeds and counters
    - an explicit MISSING list (B = 128, B = 256 exact density; M11 if S3 unauthorized)
    - environment record: python version and the import status of numpy, sympy, sage
    - stdout and stderr for every stage

  reviewer_notes:
    - >-
      REVIEW THIS FIRST: every forced value in preregistered_prediction was
      computed by the PROPOSING AGENT, outside the harness, in this session. They
      are pre-registration, not evidence. If the executor reproduces them, that is
      corroboration by an independent path; if the executor merely re-runs the
      proposer's script, it is not. The contract requires independent
      reimplementation of reference solver B and of the Psi recursion for exactly
      this reason.
    - >-
      The reference values rho(3) = 0.048608388, rho(5) = 0.00035472470,
      rho(8) = 3.2320196e-8, rho(10) = 2.7701718e-11 used as sanity checks in the
      proposal are RECALLED-UNVERIFIED. The in-repository FROZEN_RHO_TABLE
      (u = 1..6) corroborates the first two independently and is the only
      reference this contract treats as committed. NO RECALLED VALUE IS
      LOAD-BEARING and the contract's acceptance depends on none of them.
    - >-
      Dickman (1930), de Bruijn (1951), Canfield-Erdos-Pomerance (1983), Ennola,
      and Bernstein on smooth counting are NOT READ. No claim in this contract
      cites any of them as support.
    - >-
      The single most likely way this contract produces a misleading result is
      the executor running the proposer's own code for both the treatment and the
      reference. Independence of reference solver B is the check on that and is a
      required artifact, not a suggestion.
