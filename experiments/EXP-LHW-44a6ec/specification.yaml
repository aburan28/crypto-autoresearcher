# EXP-LHW-44a6ec
# Residue-guess bounds. No walk.
# Approved by DEC-20261002-2133d6.
experiment:
  id: EXP-LHW-44a6ec
  hypothesis_id: H-LHW-90bf21
  source_idea: IDEA-20260930-750de2
  question_id: RQ-LHW-1877bb
  version: 1
  title: Floor-square bounds on two cells
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-2133d6
  objective: >-
    Check the width-8 bound 229824, the width-6 bound 20640, and
    the four-unit gap under the written 20644.
  inputs:
    weight_count_32: 906192
    kangaroo_32: 131072
    weight_excess: 775120
    bound8: 229824
    bound8_excess: 98752
    bound12: 1892352
    bound16: 4100096
    bound24: 4307072
    square8: 4104
    square_gap8: 194
    interval8: 16843010
    weight_count_24: 2024
    kangaroo_24: 8192
    weight_short: 6168
    bound6: 20640
    written6: 20644
    written_gap: 4
    bound6_excess: 18616
    bound12b: 28160
    bound18: 13056
    square6: 516
    square_gap6: 50
    interval6: 266306
  controls:
    - >-
      The width-8 bound is 229824. Reporting it at most 131072
      invalidates the run.
    - >-
      The weight count 2024 falls short of 8192 by 6168. Reporting
      2024 above 8192 invalidates the run.
    - >-
      The width-6 floor bound is 20640. Reporting it as 20644
      invalidates the run.
    - >-
      4104 squared falls short of 16843010 by 194. 516 squared
      falls short of 266306 by 50.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - cell in {(32, 6), (24, 3)}
    - route in {binomial_times_root, square_gap}
  metrics:
    primary:
      - bound8
      - written_gap
      - implementations_agree
    secondary:
      - bound6
      - weight_excess
      - bound6_excess
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-8 bound is 229824. The width-6 floor bound is
      20640, four below 20644. The weight count 906192 exceeds
      131072 by 775120.
    formula: >-
      Multiply C(k, w) by twice the integer square root of the
      ceiling of 2 to the m over 2 to the k minus 1. Separately
      compare that square with the interval length.
    source: >-
      IDEA-20260930-750de2 states the worked cells (32, 6) and
      (24, 3), read 2026-10-02. The products were recomputed in
      this design session. That computation is not a run. No walk
      was run.
  scale_relevance:
    tier: toy
    justification: Two cells and seven bounds. No transfer to a group.
    correspondence: null
  tail_checks:
    - The bounds 1892352, 4100096, 4307072, 28160 and 13056 are required. A check that stops at 229824 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the bound 229824 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The width-8 bound is not 229824.
    - 2024 is reported above 8192.
    - The width-6 bound is reported as 20644.
    - A walk is run or a residue is sampled.
  success_criterion: >-
    Both runs agree that the width-8 bound is 229824, that the
    width-6 floor bound is 20640, that 20644 exceeds it by 4, that
    906192 exceeds 131072 by 775120, and that 2024 falls short of
    8192 by 6168.
  falsification_criterion: >-
    The runs agree that C(32, 6) is 906192, and the width-8 bound
    is not 229824.
  required_artifacts:
    - experiments/EXP-LHW-44a6ec/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-LHW-44a6ec/runs/<RUN-ID>/command.txt
    - experiments/EXP-LHW-44a6ec/runs/<RUN-ID>/stdout.log
    - experiments/EXP-LHW-44a6ec/runs/<RUN-ID>/stderr.log
    - experiments/EXP-LHW-44a6ec/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-LHW-44a6ec/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any group, walk, or residue sample.
    - Any claim that a modulus concentrates a weight class.
    - Any measured concentration ratio.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
