experiment:
  id: EXP-ICEX-c93308
  hypothesis_id: H-ICEX-31f4e3
  derived_from_idea: IDEA-20260808-5e257f
  question_id: RQ-RELN-001
  batch_id: BATCH-d6838c
  version: 1
  title: >-
    SYNTHETIC CENSORING VALIDATION WITH A PLANTED EXPONENT, PLUS A READ-ONLY
    INSTRUMENT AUDIT- recover a KNOWN theta from right-censored ordinal
    observations at five imposed censoring levels and show the interval is at
    least 3 times narrower than the binary one at 75 percent censoring, check
    monotonicity on the real solver lineage at three budgets, plant no-solution
    instances that must not move the estimate, and report as a deliverable whether
    any committed artifact in this corpus records per-attempt degree progress at all
  status: draft
  objective: >-
    (A) THE UNCERTAINTY. A binary success bit under a wall budget is the indicator
    of a monotone ordinal exceeding a threshold, so it discards the ordering and
    its variance is maximal exactly where the interesting cells are. Whether
    replacing it by the ordinal D_reached - the largest Macaulay degree at which a
    full graded reduction completed before the budget expired - actually buys
    precision, and how much, is a checkable statistical fact that this contract
    checks on data whose true parameter is KNOWN.
    (B) WHY THE VALIDATION IS SYNTHETIC AND NOT A RE-ANALYSIS. The source proposal
    first step is to re-analyse an existing run set. GOAL-RELN-001 HAS NO RUN SET-
    EV-RELN-001 carries empty experiment_ids and empty run_ids and the goal head
    records that no decomposition-probability measurement was performed. THE
    RE-ANALYSIS LIMB IS UNRUNNABLE AND IS NOT ATTEMPTED. It is replaced by (i) a
    synthetic arm with a planted exponent, which is the only way to know whether an
    estimator recovers the truth, and (ii) a read-only audit of what the corpus
    artifacts actually record.
    (C) THE BAND, DERIVED BEFORE ANY DATA. At censoring fraction c the binary
    estimator Fisher information for the slope scales as n times c times (1-c) and
    vanishes as c approaches 1; the censored ordinal keeps a full likelihood term
    per uncensored attempt and a one-sided survival term per censored one, so its
    information degrades far more slowly. At c = 0.75 that predicts an
    interval-width ratio near 2.3 to 3.3 and at c = 0.9 near 3.3. THE BANDS ARE
    FROZEN HERE AS at least 1.5 at c = 0.5 AND at least 3.0 at c = 0.75, and a
    ratio at or below 1.0 at ANY level falsifies the premise.
    (D) THE CURVE-FREE STATUS, RECORDED AS A PROOF AND NOT AS AN ARM. The
    synthetic arm is a function of a declared power law, a declared censoring rule
    and a random-number stream. NO CURVE, NO GROUP, NO FACTOR BASE AND NO SOLVER
    APPEARS IN IT, so a curve-free null would be the identical computation and
    running one would prove nothing. PRE-DECLARED AND FROZEN- NO OUTCOME OF THE
    SYNTHETIC ARM IS AN ELLIPTIC-CURVE OR ECDLP STATEMENT OF ANY KIND.
    (E) WHAT IS NOT DECIDED. Whether D_reached is SUFFICIENT for any ICEX input.
    That claim rests in the source on E2-02, a label occurring only inside seven
    IDEA-20260808-prefixed proposals and in NO committed record; and EV-RELN-001
    restricts the committed ICEX feed to charged Clopper-Pearson p_L, a
    probability bound rather than a cost exponent. THE SUFFICIENCY QUESTION IS
    EXPLICITLY OUT OF SCOPE HERE.
  inputs:
    cost_unit: >-
      D_reached IS A DEGREE- a dimensionless non-negative integer. BUDGETS ARE
      WALL-CLOCK SECONDS. THE TWO ARE NEVER DIVIDED INTO EACH OTHER; the budget
      enters the model solely as a censoring time. The estimated quantity theta is
      dimensionless. Interval widths are compared in the SAME unit as theta, so the
      P1 ratio is dimensionless over dimensionless.
    unit_discipline: >-
      BINDING. Every value carries a tag in {degree, seconds, dimensionless,
      count, probability}. Cross-tag arithmetic requires a named recorded
      conversion, and no such conversion is used anywhere in this contract.
    event_coding: >-
      BLOCKING AND ENFORCED. Four distinct event codes, never pooled- COMPLETED;
      CENSORED_TIME; CENSORED_MEMORY; NO_SOLUTION. Time and memory exhaustion are
      different censoring mechanisms with different covariate dependence. An
      instance with no decomposition is a property of the INSTANCE, not of the
      budget, and confusing it with censoring is the exact error this contract
      exists to prevent. The harness refuses to emit a record without an event
      code.
    frozen_before_execution: >-
      The three planted theta values, the five censoring fractions, the replicate
      count of 200 per cell, the bands 1.5 at c = 0.5 and 3.0 at c = 0.75, the
      coverage band [0.92, 0.98], the three budgets of the monotonicity arm, the
      planted no-solution fraction, and the list of artifact paths the audit arm
      inspects. None may change after any cell runs.
    procedure: >-
      STAGE 0 (synthetic generator check, zero curve content). Generate D_trial
      from a declared power law with theta in {0.5, 1.0, 2.0} over a declared
      covariate ladder in B, verify by direct regression on the UNCENSORED data
      that the generator reproduces the planted theta within a narrow tolerance,
      and record that tolerance. A generator that does not reproduce its own
      planted parameter HALTS the run.
      STAGE 1 (main synthetic comparison). For each (theta, censoring fraction c)
      cell with c in {0.0, 0.25, 0.5, 0.75, 0.9}, impose the budget that realises
      c, then fit theta by BOTH estimators - a binary logistic fit on the success
      indicator and a parametric right-censored AFT fit on D_reached - over at
      least 200 replicates. Record the interval widths, their ratio, the coverage
      of each nominal 95 percent interval against the KNOWN theta, and the
      fraction of attempts contributing to each estimate.
      STAGE 2 (planted no-solution control). Repeat stage 1 at
      (theta = 1.0, c = 0.5) with a declared fraction of instances that have NO
      solution, coded as NO_SOLUTION. The estimated theta must not move outside
      its interval relative to the arm without them.
      STAGE 3 (monotonicity arm, real solver, read-only on the lineage). For at
      least 30 instances from ONE frozen degree-graded solver lineage, run each at
      three increasing budgets with the SAME seed and record D_reached. Require
      non-decreasing D_reached at 100 percent of instances. This arm modifies no
      solver and produces no cost claim.
      STAGE 4 (instrument audit, read-only, zero compute). Inspect the committed
      run artifacts of this corpus for PER-ATTEMPT degree progress, listing every
      path inspected and reporting a yes or no with evidence. A negative answer is
      a DELIVERABLE, not a failure- it is the finding that the lane instrument does
      not emit its own most informative variable.
      STAGE 5 (report). Emit the interval-width table with bands evaluated, the
      coverage table, the usable-fraction table marked as a construction check, the
      no-solution control outcome, the monotonicity table, the audit table, and
      the lack-of-fit statistic for every AFT fit.
    mechanism: >-
      STEP 1. One synthetic generator, one random-number stream, one reporting
      path. Both estimators consume the SAME generated data in the SAME cell, so
      the comparison is paired and no generator variance enters the ratio.
      STEP 2. The AFT fit reports a LACK-OF-FIT STATISTIC alongside every interval.
      A power-law specification is an assumption; with the statistic reported, a
      drifting theta shows as misfit instead of as a confidently wrong number, and
      the statistic is MANDATORY for that reason.
      STEP 3. The censoring fraction per cell is reported. If censoring is
      near-total at the largest covariate value the fit is EXTRAPOLATING and the
      report says so rather than quoting an interval.
      STEP 4. The monotonicity arm calls the frozen solver lineage through its
      existing entry point and records D_reached only. It changes no solver code,
      so a violation is a fact about that solver and not about this harness.
      STEP 5. Every row is reported as (arm, theta_true, censoring fraction, seed,
      estimator, point estimate, interval, coverage flag, usable fraction,
      lack-of-fit statistic, event code counts), never as a scalar.
    instrument: >-
      A standalone estimator harness- synthetic generator, binary logistic fit,
      parametric right-censored AFT fit - sharing one random stream and one
      reporting path. THE SYNTHETIC ARM IMPORTS NO CURVE CODE, NO GROUP CODE AND NO
      SOLVER, and the run manifest must list its imported modules so that is
      checkable. Memory is trivial; the largest object is a table of 200 replicates
      times 5 censoring levels times 3 theta values.
  controls:
    - >-
      CONTROL 1, PLANTED EXPONENT (blocking, and the entire validity argument).
      Synthetic data with a KNOWN theta. REQUIRED MAGNITUDE- the censored AFT
      interval must cover the known theta at 0.92 to 0.98 nominal 95 percent
      coverage over at least 200 replicates per level, AND must be at least 1.5
      times narrower than the binary interval at c = 0.5 and at least 3.0 times
      narrower at c = 0.75. This control CAN FAIL and its failure withdraws the
      record. A control that merely returns a number proves nothing; this one has
      a known answer and must produce it at a predicted magnitude.
    - >-
      CONTROL 2, GENERATOR SELF-CHECK (blocking). On UNCENSORED data the plain
      regression must recover the planted theta within the tolerance recorded in
      stage 0. A generator that cannot reproduce its own parameter invalidates
      every downstream comparison.
    - >-
      CONTROL 3, MONOTONICITY (blocking on applicability). Same instance, same
      seed, three increasing budgets, D_reached non-decreasing at 100 percent of
      instances. A violation means the solver is not degree-graded in the required
      sense and the interval-censoring model DOES NOT APPLY TO IT - a genuine
      limitation reported as such and never absorbed.
    - >-
      CONTROL 4, NULL-INSTANCE ARM (blocking). Instances with NO decomposition,
      coded NO_SOLUTION, must not move the estimated theta outside its interval.
      An estimator that shifts has confused -no solution- with -not enough budget-,
      and its output is VOID.
    - >-
      CONTROL 5, EVENT-TYPE SEPARATION. Time censoring, memory censoring,
      completion and no-solution are coded distinctly and reported as four counts
      per cell. A pooled count is inadmissible.
    - >-
      CONTROL 6, USABLE-FRACTION CHECK, REPORTED AND EXPLICITLY NOT EVIDENCE. The
      censored estimator uses 100 percent of attempts and the binary one uses
      (1 - c). This is a FORCED ARITHMETIC CONSEQUENCE of the definitions, is
      reported as a construction check, and is excluded from the efficiency
      verdict.
  independent_variables:
    - planted theta in {0.5, 1.0, 2.0}
    - imposed censoring fraction in {0.0, 0.25, 0.5, 0.75, 0.9}
    - estimator in {binary logistic on the success bit, right-censored AFT on D_reached}
    - presence or absence of planted no-solution instances
    - budget level in the monotonicity arm (three increasing values per instance)
  metrics:
    primary:
      - >-
        ratio of 95 percent confidence-interval widths for theta, binary over
        censored AFT, per (theta, censoring) cell (dimensionless)
      - >-
        empirical coverage of each nominal 95 percent interval against the planted
        theta, per cell (probability)
    secondary:
      - point estimates and interval endpoints for both estimators per cell
      - lack-of-fit statistic for every AFT fit
      - fraction of attempts contributing to each estimate (construction check)
      - four event-code counts per cell
      - monotonicity violation count and the instances involved
      - audit table- artifact paths inspected and whether per-attempt degree progress is recorded
      - wall-clock seconds per run, for budget accounting only
  heuristic_under_test: HEUR-CENS-1
  preregistered_prediction:
    quantity: >-
      The width of the 95 percent confidence interval for the power-law exponent
      theta under each estimator, and the coverage of each interval against the
      planted value.
    formula: >-
      Binary interval width scales as 1/sqrt(n*c*(1-c)); censored AFT width scales
      as 1/sqrt(n*k) with k of order 1. Predicted width ratio at least 1.5 at
      c = 0.5 and at least 3.0 at c = 0.75, with censored coverage in
      [0.92, 0.98] at every level.
    source: >-
      Consistency and asymptotic efficiency of right-censored maximum-likelihood
      estimation under correct specification, and the Fisher information of a
      binomial proportion, both standard. NO SOURCE WAS OPENED for either; they
      are marked recalled in the hypothesis structural_ingredients so a reviewer
      can supply the reference. The numeric bands are derived in this contract
      from that information arithmetic.
  scale_relevance:
    tier: toy
    justification: >-
      The synthetic arm has no scale in the cryptographic sense at all- it is a
      statistical simulation whose only parameters are the planted exponent, the
      covariate ladder and the censoring fraction. The monotonicity arm inherits
      the scale of whatever frozen solver lineage it calls and makes no cost
      claim. TRANSFER ASSUMPTION, STATED- that a real degree-graded solver
      produces right-censored D_reached observations of the same shape as the
      simulation. THAT ASSUMPTION IS EXACTLY WHAT CONTROL 3 TESTS and it is not
      assumed elsewhere.
    correspondence: null
  tail_checks:
    - >-
      The censoring fraction per covariate value is reported; if it approaches 1
      at the largest B the fit is extrapolating and the report says so instead of
      quoting an interval.
    - >-
      The distribution of D_reached among CENSORED attempts is reported, not only
      its mean, because a censored mass piled at a single degree indicates the
      budget is binding before the solver has graded at all, in which case the
      ordinal carries no more information than the bit.
  replication:
    seeds: >-
      At least 200 independent replicates per (theta, censoring) cell, from one
      declared random stream with its seed recorded before stage 1. At least 30
      instances in the monotonicity arm.
    independent_instances: 200
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 2.0
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
    - >-
      Stage 0 generator self-check failure HALTS the run.
    - >-
      The monotonicity arm stops at its declared instance count or at its budget,
      whichever comes first; a partial monotonicity arm is reported with its
      achieved count and is not extrapolated.
    - >-
      The audit arm is read-only and bounded by the declared path list; paths not
      inspected are listed as NOT INSPECTED rather than implied clean.
    - >-
      Total wall-clock at the declared cap; remaining cells recorded as NOT
      ATTEMPTED.
  invalidation_rules:
    - >-
      Any record emitted without one of the four event codes invalidates the cell.
    - >-
      Pooling time censoring with memory censoring invalidates the fit.
    - >-
      An AFT interval reported without its lack-of-fit statistic is inadmissible.
    - >-
      Any use of a budget adapted to observed progress invalidates the run, since
      it makes the censoring informative and breaks the estimator.
    - >-
      The synthetic arm importing any curve, group or solver module invalidates its
      curve-free declaration and therefore the whole pre-declaration in the
      objective.
  success_criterion: >-
    The generator self-check passes; the censored AFT interval covers the planted
    theta at 0.92 to 0.98 at every censoring level; the interval-width ratio is at
    least 1.5 at c = 0.5 and at least 3.0 at c = 0.75; the planted no-solution
    instances do not move the estimate; monotonicity holds at 100 percent on the
    real lineage; and the audit table is emitted with every inspected path listed.
  falsification_criterion: >-
    An interval-width ratio at or below 1.0 at ANY censoring level, OR coverage
    outside [0.92, 0.98] at any level, OR any monotonicity violation, OR a shift
    in theta when correctly coded no-solution instances are added. Each is a
    distinct failure with a distinct consequence, stated in the hypothesis
    falsification_conditions, and none of them is absorbed as noise.
  required_artifacts:
    - exact command, git commit and dirty-tree state, environment and versions
    - the frozen parameter file with theta values, censoring fractions, replicate count, bands, budgets and the audit path list
    - the module import list of the synthetic arm, demonstrating it loads no curve, group or solver code
    - per-replicate raw records (arm, theta_true, c, seed, estimator, estimate, interval, event codes, lack-of-fit)
    - the interval-width ratio table with its bands evaluated
    - the coverage table against the planted theta
    - the usable-fraction table, marked as a construction check and excluded from the verdict
    - the no-solution control outcome
    - the monotonicity table with any violating instances named
    - the audit table- paths inspected, paths not inspected, and the yes-or-no finding
    - stdout, stderr, timestamps, resource measurements
    - inference block- requested policy, backend, resolved model id, effort, fallback, degraded requirements
  assigned_to: executor
  approved_by: null
  limitations:
    - >-
      PURELY AN INSTRUMENT RESULT. It changes no claim, produces no attack, and
      cannot make a negative result positive. It can only make an underpowered
      measurement powered.
    - >-
      THE SYNTHETIC ARM IS CURVE-FREE BY CONSTRUCTION and that is recorded as a
      PROOF rather than discharged by a null arm, because a curve-free null would
      be the identical computation. PRE-DECLARED- NO OUTCOME OF THIS EXPERIMENT IS
      AN ELLIPTIC-CURVE OR ECDLP STATEMENT.
    - >-
      SUFFICIENCY FOR THE ICEX INPUT IS NOT TESTED AND IS NOT TESTABLE HERE. The
      committed feed is charged Clopper-Pearson p_L, a probability bound; the
      source sufficiency argument rests on E2-02, which resolves to no committed
      record. Nothing here may be quoted as showing D_reached can replace p_L.
    - >-
      NO RELN RUN SET EXISTS TO RE-ANALYSE, so the real-data half of the source
      proposal is not attempted and its absence is reported as the audit finding
      rather than worked around.
    - >-
      Results transfer only within ONE frozen solver lineage. D_reached depends on
      implementation as much as on the system and a cross-lineage comparison is
      inadmissible.
    - >-
      A failure of monotonicity is a REAL LIMITATION of the model for that solver,
      not a nuisance, and it ends the applicability claim rather than being
      absorbed.
    - >-
      claim_tier toy. sota_delta zero on every attack axis. On the narrow axis of
      estimator efficiency for a censored monotone observable, right-censored
      maximum likelihood is the textbook incumbent and this is an application of
      it, not an improvement on it.
  yaml_parse_disclosure: >-
    Written by a Coordinator subagent without an interpreter. Every prose value is
    a folded block scalar; no tabs; no duplicate keys to the author reading. THIS
    AGENT COULD NOT RUN A STRICT YAML PARSE OR tools/validate_ledger.py AND DID
    NOT DO SO; the orchestrating session must run both before this contract is
    reviewed.
