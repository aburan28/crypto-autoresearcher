  falsification_criterion: >-
    A2 alarm (closure or overlap on eligible R); or equivariance_agreement
    < 1 on V; or h2_count_agreement false; or forbidden-n cell used; or
    Stage 0 lattice omits empty flags.

  required_artifacts:
