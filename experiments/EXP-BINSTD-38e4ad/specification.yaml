    - experiments/EXP-BINSTD-38e4ad/runs/*/stdout.log

  procedure:
    stage0:
      - Re-read IDEA-20260904-3c7a91, IDEA-20260915-eee7e4, IDEA-20260920-b9f0c5 in full; write citation-reread-notes.md confirming distinctions vs corrected H1.
      - Recompute/list mid-dimension tau-stable dims; write lattice.yaml with empty flags for {163,29,37}.
      - Write conversion-cost-note.md charging O(n^2) once; state it is not a priority argument.
      - Write notation-lock.md (n=degree, m=arity).
    stage1:
      - Confirm stage0/ exists; refuse if any forbidden n is requested.
      - Factor Phi_17; build ker g(tau) dim-8 V; write tau-stability-check.yaml.
      - Re-factor #E; verify 2*65587 with 65587 prime.
      - Draw 200 prime-order targets (seeds); for each enumerate unordered pairs in V×V; record S(R).
      - Test closure under squaring vs S(R) and membership in S(sigma(R)); write soundness-census.yaml and heur-h1-verdict.yaml.
    stage2:
      - Confirm stage1/ exists.
      - Repeat leave-V' fraction on random V'; write vprime-control.yaml.
      - Ordinary-curve control (b not in F_2); write ordinary-curve-control.yaml.
      - H2 direct vs per-orbit counts on Stage-1 V; write h2-count-agreement.yaml and heur-h2-verdict.yaml.

  optimistic_assumptions_disclosed:
    - >-
      Treating fixed-target orbit clauses as a per-attempt exponent gain
      would be optimistic (bias: overstates cryptanalytic impact). Protocol
      forbids that framing; tests unsoundness null instead.
    - >-
      Treating H2 factor-n preprocessing saving as an attack exponent move
      would be optimistic. Protocol discloses preprocessing-only.
    - >-
      Pure-Python 200×2^16 enumerations may hit instrument_ceiling
      (bias: may under-complete target count). Record instrument_ceiling
      and completed eligible-target count honestly.

  memory_accounting: >-
    Stage 0 negligible. Stage 1/2: peak_rss_bytes measured per run;
    dominant structures are F_{2^17} elements and pair-enumeration
    scratch of size O(2^{2l})=O(2^16) — analytic size stated in stage
    reports; reconcile measured RSS against that. No large factor-base
    tables.

  assigned_to: executor
  dominated_by: >-
    Matched rho ~2^{77.16} on K-163; a77711 dimension-gain reading;
    KN-FIND-47da4e ratios >=1. Soundness census cannot close any rho gap.
  sota_delta:
    time: Zero cryptanalytic movement.
    memory: Zero.
    data_queries: First HOLD-S-absorbed fixed-target orbit soundness census in this lane.
