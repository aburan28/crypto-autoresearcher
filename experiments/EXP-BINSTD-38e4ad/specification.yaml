    - experiments/EXP-BINSTD-38e4ad/stage0/citation-reread-notes.md
    - experiments/EXP-BINSTD-38e4ad/stage0/conversion-cost-note.md
    - experiments/EXP-BINSTD-38e4ad/stage0/notation-lock.md
