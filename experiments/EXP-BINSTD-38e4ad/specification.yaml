    quantity: >-
      (A) Stage 0 lattice marks n=163 and {29,37} empty mid-lanes;
      (B) closure_fraction = 0 on eligible targets; (C) conjugate_overlap
      = 0; (D) equivariance_agreement = 1 on tau-stable V; (E)
      h2_count_agreement true; (F) leave-V' fraction reported on V';
      (G) ordinary-curve equivariance fails; (H) NO deployed-curve
      security claim; (I) conversion charged O(n^2) once.
    formula: >-
      Null: closure_fraction=0 ∧ conjugate_overlap=0 ∧
      equivariance_agreement=1 on V (a77711 A1/A2); H2 counts equal;
      KN-FIND-47da4e prior ratio band [1.00,1.47] is background only
      (Stage 1 does not re-run WDSat).
    source: >-
      analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-2a3771.yaml
      concrete_experiment; H-BINSTD-c3d68f HOLD-S restatement; a77711;
      KN-FIND-47da4e
    claim_tier: observational
    measured_vs_modeled: >-
      Stage 0 lattice ord_n(2) values are RECOMPUTED. Citation re-reads
      are DOCUMENTATION. Stage 1/2 census metrics are MEASURED. a77711
      Lemmas and 47da4e ratio band are MODELED/PRIOR comparators (labeled)
      placed beside measured metrics — never mixed unlabeled. Matched rho
      is modeled baseline only.

  scale_relevance:
    tier: toy
    justification: >-
      Executable cell at n=17 only in the frozen Stages 1-2. Optional
      extension to {23,31,41} is named but not required for protocol
      completion of Stages 0-2. Deployed n>=131 is lattice note only,
      never a run target. Transfer to n>=131 is NOT claimed.
    correspondence: null

  sample_size_justification: >-
    Review concrete_experiment: 200 random prime-order targets plus
    sigma(R) each. Under the null every eligible target contributes a
    hard 0/1 check; expected closure count is 0, so N=200 gives many
    independent confirmations. Exhaustive 2^16 pair enumerations per
    target (seconds to a minute pure Python). Exact census; no
    smoothness-tail sample-size derivation applies.

  tail_checks:
    - Report any single eligible R with closure or overlap (hard A2 alarm).
    - Filter and report count of targets with sigma(R)=+-R separately.
    - Tau-stability basis check must pass before any metric is trusted.
    - h2_count_agreement must be exact equality (hard fail if not).

  replication:
    seeds:
      - 2026100117
      - 2026100118
      - 2026100119
      - 2026100120
      - 2026100121
      - 2026100122
    independent_instances: >-
      Stage 0 deterministic. Stage 1: four seeds for target draws only
      (enumeration exhaustive given targets). Stage 2: one V' seed, one
      ordinary-curve seed; H2 arm deterministic on Stage-1 V.

  budget:
