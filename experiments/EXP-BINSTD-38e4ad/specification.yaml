    (B) At n=17 m=2 exhaustively test a77711 A1/A2 via closure_fraction,
    conjugate_overlap, equivariance_agreement on a tau-stable V.
    (C) Run V' and ordinary-curve controls; verify H2 count agreement.
    Never claim a deployed break or an exponent move.

  class: control-certificate
  class_note: >-
    Soundness / lattice control certificate plus toy exhaustive census.
    Absorbs HOLD-S. Not a smoothness-CDF heuristic-validation and not an
    attack cost-model. HEUR-BINSTD-c3d68f-H1 and HEUR-BINSTD-c3d68f-H2 are
    the numbered heuristics under test. Measured vs modeled columns stay
    separate. No exponent-moving claim. Fixed-target orbit clauses are
    under test as UNSOUND (null), not as a speedup.

  corrections_absorbed:
    hold_s_h1_unsound: >-
      HOLD-S: delete/restate source H1 as conjugate orbit-system soundness
      check with a77711 A1/A2 and KN-FIND-47da4e null (ratio~1 / closure=0).
    hold_s_k163_empty: >-
      HOLD-S: state stable-subspace lattice; K-163 has no mid-dimension
      tau-stable V (ord_163(2)=162).
    hold_s_toy_ladder: >-
      HOLD-S: restrict measurement cells to n in {17,23,31,41}; forbid
      {29,37}.
    hold_s_conversion_cost: >-
      HOLD-S: charge poly→normal conversion O(n^2) once; drop from title
      and priority argument.
    hold_s_notation: >-
      HOLD-S: n = degree throughout; m = arity; never overload m as |tau|.
    hold_s_dominated_by: >-
      HOLD-S: add a77711 and KN-FIND-47da4e to dominated_by / frontier.

  scope:
    included:
      - >-
        Stage 0 (zero scientific trials on deployed curves):
        (i) re-read notes for IDEA-20260904-3c7a91, IDEA-20260915-eee7e4,
        IDEA-20260920-b9f0c5 confirming distinctions vs corrected H1;
        (ii) stable-subspace lattice YAML for FIPS Koblitz n in
        {163,233,283,409,571} and toy n in {17,23,29,31,37,41};
        (iii) charged conversion note O(n^2) once;
        (iv) notation lock document (n vs m).
      - >-
        Stage 1 (toy): n=17 Koblitz-shaped y^2+xy=x^3+x^2+1 over
        F_2[t]/(t^17+t^3+1), #E=2*65587 (l_order=65587 prime);
        m=2; l=8; V=ker g(tau) for a degree-8 irreducible factor of
        Phi_17; 200 random prime-order targets R plus sigma(R); exhaustive
        unordered pair enumeration; metrics closure_fraction,
        conjugate_overlap, equivariance_agreement.
      - >-
        Stage 2 (controls): random non-stable V' dim 8; ordinary-curve
        control b not in F_2 over same field; H2 direct vs per-orbit
        |x(E)∩V| equality.
    excluded:
      - Any scientific group walk / attack at deployed n >= 131
      - Measurement cells at n in {29, 37, 163}
      - Claiming fixed-target orbit clauses are satisfiability-preserving
      - Claiming an exponent-class or K-163-vs-rho crossing
      - Editing AUXIN / prior EXP-BINSTD packets / IDEA claim text
      - Amazon Bedrock
      - Filing a deployed-curve security / break claim
      - WDSat solver runs as the Stage 1 primary instrument (exhaustive
        group-arithmetic census is required; SAT is out of Stage 1 scope)

  inputs:
