    - Measurement cell at n in {29,37,163} → invalid.
    - Claiming fixed-target orbit clauses satisfiability-preserving → invalid framing.
    - Editing IDEA-20260922-2a3771 claim text → protocol violation.
    - Deployed n>=131 attack attempt → out of scope / invalid.
    - Timeout/crash → failed_infrastructure, not negative math evidence.
    - Amazon Bedrock use → prohibited / invalid.

  success_criterion: >-
    Stage 0 artifacts present with empty mid-lanes on {163,29,37};
    Stage 1/2 decide among DO-1..DO-3 of H-BINSTD-c3d68f from the
    pre-registered metrics without post-hoc threshold edits. A null
    confirmation (DO-1) or A2 alarm (DO-2) both count as successful
