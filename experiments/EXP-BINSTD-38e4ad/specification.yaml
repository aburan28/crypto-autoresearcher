      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - experiments/EXP-CERTBIN-e94b27/impl/instances.py
    cells:
      Stage0-lattice:
        description: >-
          Recompute ord_n(2) / list mid-dimension tau-stable dims for
          named n; mark empties.
      Stage1-n17-soundness:
        n: 17
        m: 2
        l: 8
        curve: y^2+xy=x^3+x^2+1
        field_poly: t^17+t^3+1
        frozen_expected:
          group_order_E: 131174
          l_order: 65587
          cofactor_h: 2
        n_targets: 200
        seeds: [2026100117, 2026100118, 2026100119, 2026100120]
        note: >-
          Review-computed; Stage 1 must re-factor #E and verify l_order
          prime before census.
      Stage2-Vprime:
        description: Random 8-dim subspace, not tau-stable
        seeds: [2026100121]
      Stage2-ordinary:
        description: >-
          Same field; curve with b not in F_2 (e.g. b=t); sigma not an
          endomorphism
        seeds: [2026100122]
      Stage2-H2:
        description: Direct vs per-orbit |x(E)∩V| on Stage-1 V
      FORBIDDEN-n:
        values: [29, 37, 163]
        description: Must never appear as measurement cells

  controls:
    - name: tau_stability_basis_check
      object: Direct squaring of V basis must stay in V before census.
    - name: random_Vprime_null
      object: >-
        Matched-dim non-stable V'; report leave-V' fraction under
        squaring as the artifact tell.
    - name: ordinary_curve_no_endo
      object: >-
        b not in F_2; squared tuples must fail to lie in S(sigma(R)) for E.
    - name: filter_sigma_pm_R
      object: >-
        Targets with sigma(R)=+-R excluded from closure_fraction
        denominator (A2 premise).
    - name: matched_rho_baseline
      object: Modeled comparator only; labeled modeled; never mixed into census columns.

  independent_variables:
    - stage  # 0 | 1 | 2
    - n  # 17 (optional extension 23|31|41 only after Stage 1 complete)
    - m  # 2
    - l  # 8
    - window_kind  # tau_stable | random | ordinary_curve
    - seed

  metrics:
    primary:
      - lattice_empty_flags
      - citation_reread_complete
      - closure_fraction
      - conjugate_overlap
      - equivariance_agreement
      - h2_count_agreement
      - leave_Vprime_fraction
