# EXP-CERTBIN-a2eb65
# Union-column arithmetic. No image is enumerated.
# Approved by DEC-20261003-46d632.
experiment:
  id: EXP-CERTBIN-a2eb65
  hypothesis_id: H-CERTBIN-0d55a0
  source_idea: IDEA-20260930-14c753
  question_id: RQ-CERTBIN-836ce2
  version: 1
  title: Linearization versus the exact union
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-46d632
  objective: >-
    Check the excess 59601, the cross 1, and the mantissa gap 1.
  inputs:
    union_num: 3940399
    lin_num: 4000000
    lin_excess: 59601
    half_cross: 1
    mantissa_gap: 1
    written_gap: 2
    draws: 1040
    cap_quot: 9615
    cap_rem: 400
    addition_cap: 10000000
  controls:
    - >-
      Four million exceeds 3940399 by 59601. Reporting the union as
      four hundredths drops that excess and invalidates the run.
    - >-
      Seventeen exceeds 16 by 1. Four times 8564834857521739 exceeds
      34259339430086955 by 1. Ten times 10181408817884119 exceeds
      four times 25453522044710297 by 2.
    - >-
      One hundred times 4 plus twenty times 32 is 1040. One thousand
      forty times 9615 plus 400 is 10000000. Ninety-nine to the
      fourth is 96059601.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {linearization, half, mantissa}
    - route in {subtract, multiply}
  metrics:
    primary:
      - lin_excess
      - half_cross
      - mantissa_gap
      - implementations_agree
    secondary:
      - written_gap
      - draws
      - addition_cap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Four million exceeds 3940399 by 59601. Seventeen exceeds 16
      by 1. Four times 8564834857521739 exceeds 34259339430086955
      by 1.
    formula: >-
      Subtract 96059601 from 100000000. Subtract 3940399 from
      4000000. Subtract 16 from 17. Multiply 8564834857521739 by 4
      and subtract 34259339430086955.
    source: >-
      IDEA-20260930-14c753 states the one-percent row, the one-half
      cell, the two ceiling products, the batch counts, and the
      addition cap, read 2026-10-03. The products were recomputed in
      this design session. That computation is not a run. No image
      was enumerated. The subgroup order was not computed.
  scale_relevance:
    tier: toy
    justification: One written one-percent identity and two written ceiling mantissas. No transfer to a union frequency.
    correspondence: null
  tail_checks:
    - The cross 1 and the mantissa gap 1 are required. A check that stops at the excess 59601 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the excess 59601 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The excess is not 59601.
    - The cross is not 1.
    - The mantissa gap is not 1.
    - The union is reported as four hundredths, or an image is enumerated.
  success_criterion: >-
    Both runs agree that 4000000 exceeds 3940399 by 59601, that 17
    exceeds 16 by 1, that 4 times 8564834857521739 exceeds
    34259339430086955 by 1, and that 1040 times 9615 plus 400 is
    10000000.
  falsification_criterion: >-
    The runs agree that 4000000 minus 3940399 is computed, and that
    difference is not 59601.
  required_artifacts:
    - experiments/EXP-CERTBIN-a2eb65/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CERTBIN-a2eb65/runs/<RUN-ID>/command.txt
    - experiments/EXP-CERTBIN-a2eb65/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CERTBIN-a2eb65/runs/<RUN-ID>/stderr.log
    - experiments/EXP-CERTBIN-a2eb65/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CERTBIN-a2eb65/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any image enumeration, batch draw, or membership test.
    - Any claim that a four-target column is a batch speedup.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
