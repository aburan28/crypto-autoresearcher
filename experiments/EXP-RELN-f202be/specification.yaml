experiment:
  id: EXP-RELN-f202be
  id_allocation_provenance: >-
    Pre-minted by the dispatching session with tools/allocate_id.py and
    confirmed free with --check; supplied in the task assignment. Not
    re-minted and not derived by scanning state.
  hypothesis_id: H-RELN-41562a
  source_proposal: IDEA-20260906-d1494b
  question_id: RQ-RELN-61638a
  version: 1
  title: >-
    Exact-enumeration dispersion battery for the decomposition-count vector
    at m = 3 on prime-order toy curves, with Poisson null bands, forced-value
    controls and a code-independent spectral cross-check
  status: approved
  approved_by: coordinator
  execution_authorized: true
  assigned_to: executor
  design_handoff: TASK-20260906-16e62c
  design_handoff_note: >-
    Approved under DEC-20260906-0b4030 (2026-09-06). Basis: the user invoked
    /run-experiment after this contract was explicitly named as the
    recommended first, cheapest, decisive battery of RQ-RELN-61638a's three
    drafted contracts, then confirmed via AskUserQuestion "run all three, in
    dependency order" -- treated as the confirmation event under
    docs/research-budget-policy.md and this repo's design-experiment
    convention that existing user authorization satisfies the confirmation
    gate, without a further per-contract approval cycle. No scientific field
    of this specification was altered for approval.
  approval_note: >-
    Frozen as written at approval. Every control, budget figure, threshold,
    convention, seed, and predicted value above is part of the frozen
    contract; any needed change is a versioned protocol_amendment under
    experiments/EXP-RELN-f202be/amendments/, never an inline edit.

  objective: >-
    Measure, exactly and with every count certified by a checked group
    identity, the dispersion index Delta = E_3/M - mu of the
    decomposition-count vector c_D(r) for x-interval and quadratic-residue
    class bases on prime-order curves E/F_p at four rungs N near 2^14, 2^16,
    2^18, 2^20, under two frozen base-size conventions and both sign
    conventions, against (a) Monte Carlo bands from 100 uniformly random
    class-set and random-point bases per cell, (b) the Z/N interval positive
    control with its pre-computed forced value, (c) the Bose-Chowla
    minimum-energy control with its exact forced value, (d) the
    negation-forced gap with its forced value, and (e) the analytic
    selection null of INV-3 for a frozen family of seven x-predicates; and
    decide between the pre-committed NULL outcome (Delta inside the band at
    every rung, growth slope interval containing 0) and the ALIVE outcome
    (positive excess beyond 3 SD at the two largest rungs, increasing across
    rungs). The battery's exhaustive count vectors and per-cell summaries are
    consumed by EXP-RELN-82f487 (labels) and EXP-RELN-141a86 (summaries).
    This contract is unapproved and authorizes zero executions. Toy scale
    only; no ECDLP cost, speedup or attack claim under any outcome.

  inputs:
    records:
      - ledger/hypotheses/H-RELN-41562a.yaml
      - ledger/proposals/IDEA-20260906-d1494b.yaml
      - ledger/questions/RQ-RELN-61638a.yaml
      - knowledge/findings/KN-FIND-007.md
      - experiments/EXP-FB3-001/conservation.md
      - ledger/proposals/IDEA-20260830-c5c614.yaml (claim section (C), lift definitions)
      - docs/claims-and-verification.md
      - docs/research-budget-policy.md
    curve_generation:
      recipe: >-
        For rung k in {14, 16, 18, 20} and seed s = 1, 2, 3, ... in
        increasing order: p_s = the smallest prime >= 2^k + (SHA256('s:p')
        as an integer mod 2^(k - 6)), so that p lies in [2^k, 2^k + 2^(k-6)]
        and every N is within about 2 percent of the nominal 2^k after the
        Hasse deviation; a = SHA256('s:a') mod p, b = SHA256('s:b') mod p
        (the hash tag convention of harness/toycurve.py, _seed_int); reject
        if 4a^3 + 27b^2 = 0 mod p; compute N = #E(F_p); accept the curve if
        and only if N is prime. The first three accepting seeds per rung
        define the rung's curve set; the accepted seeds and every rejected
        seed with its rejection reason are recorded in curves.json.
        harness/toycurve.py's generate_instance is NOT used as-is because it
        accepts cofactors; only its arithmetic and hashing conventions are
        reused.
      point_count_certificate: >-
        N is computed by the naive Legendre-symbol sum N = p + 1 +
        sum_{x in F_p} legendre(x^3 + a x + b) and independently checked by
        (1) the Hasse bound |N - p - 1| <= 2 sqrt(p), (2) N R = O for 8
        deterministic points R = lift_x(SHA256('s:x{j}') mod p), j = 1..8,
        and (3) primality of N by two independent methods (deterministic
        Miller-Rabin bases and trial division to sqrt(N)). All three are
        recorded per curve in curves.json; a curve failing any one is not
        used and the failure is recorded.
      generator: >-
        The base point P used for the E small-multiples arm, for the mirror
        of Z/N arms and for the log table is R_1 = lift_x(SHA256('s:x1') mod
        p) (any non-identity point generates the prime-order group). The
        full log table log_P : E(F_p) -> Z/N is built by enumerating [k]P
        for k = 1..N-1 once per curve and stored keyed by (x, y).
      minimum_curves_per_rung: 3
      recorded_fields_per_curve: [rung, seed, p, a, b, N, generator_x, generator_y, certificate]
    base_size_conventions:
      B_1: >-
        B_1 = ceil((6N)^{1/3}) computed from the ACTUAL N of the curve;
        rounded up to the next even integer for negation-closed arms (W
        arms: x-interval, QR-class, random-x-classes), unrounded for plain
        arms (random points, Z/N random, Z/N interval, E small-multiples).
        Nominal values at N = 2^k exactly, for the design table only: even
        B_1 = 48, 74, 118, 186 with M = C(B_1 + 2, 3) = 19600, 70300, 280840,
        1089836 and mu = 1.196, 1.073, 1.071, 1.039; M_red = M - B_1^2/2 =
        18448, 67562, 273878, 1072538. The run-time recomputation from actual
        N is the binding value and is recorded per cell; it must agree with
        the nominal value to within 2 in B_1 or the cell is flagged for
        review before any number is read.
      B_2: >-
        B_2 = the largest prime power q with 3(q^3 - 1) < N, computed from the
        ACTUAL N of the curve. Nominal values at N = 2^k exactly: 17, 27, 43,
        67 with M_2 = C(B_2 + 2, 3) = 969, 3654, 14190, 52394 and mu_2 =
        0.059, 0.056, 0.054, 0.050. The run-time recomputation is binding
        and recorded; a departure from the nominal value is permitted only
        if 3(q^3 - 1) < N fails or newly holds at the actual N, and the
        recomputed inequality is recorded. B_2 is used for the Bose-Chowla
        control and for the object arms' second-convention cells (where W
        has B_2 rounded up to even points).
    sign_conventions:
      reference: >-
        experiments/EXP-FB3-001/conservation.md freezes: base D of B distinct
        nonzero elements, all size-3 multisets from D counted, targets over
        the whole group, total C(B + 2, 3); its section 3 exploratory arm
        counts all multisets from D' = D union -D with total C(|D'| + 2, 3).
      plain: >-
        FB3's primary convention applied to a base of B elements that is not
        required to be negation-closed (random points on E, Z/N random, Z/N
        interval, E small-multiples, Bose-Chowla). Total M = C(B + 2, 3).
      unreduced: >-
        FB3's section-3 symmetric convention applied to a negation-closed
        base W = V union -V of B points (B/2 x-classes): ALL size-3 multisets
        from W counted, including those containing a pair {P, -P}. Total
        M = C(B + 2, 3). Under this convention every Q in W receives the B/2
        forced multisets {P, -P, Q} (INV-2pp).
      reduced: >-
        The same base W, counting only size-3 multisets that contain NO pair
        {P, -P}; exactly three points, signs free. Total M_red = M - B^2/2.
        The identity c_unreduced(r) = c_reduced(r) + (B/2) [r in W] holds
        exactly and is checked per cell.
      rule: >-
        Every cell declares exactly one convention; negation-closed arms are
        run under both, never mixed; plain arms carry the plain convention
        only. A cell with an undeclared or ambiguous convention is invalid.
    object_bases:
      x_interval_low: >-
        V = the B/2 smallest x in [1, p) that are on-curve (x^3 + a x + b a
        nonzero square); W = V union -V. Verified to contain exactly B/2
        distinct on-curve x values before enumeration.
      x_interval_mid: >-
        V = the B/2 smallest on-curve x with x >= floor(p/2); W = V union -V.
      qr_class: >-
        V = the B/2 smallest on-curve x in [1, p) with legendre(x) = 1;
        W = V union -V. (The interval restricted to quadratic residues; the
        selection rule is frozen here because a QR class alone has (p - 1)/2
        elements and needs a size rule.)
    null_bases:
      NULL_A: >-
        E with a uniformly random B/2-subset of on-curve x-classes,
        negation-closed (W = V union -V), 100 draws per (curve, B
        convention), run under both sign conventions. The band for every
        negation-closed arm. Sampler: rejection sampling of x uniform in
        [1, p) until on-curve, distinct.
      NULL_B_points: >-
        E with a uniformly random B-subset of non-identity points (not
        negation-closed), 100 draws per (curve, B convention), plain
        convention. Sampler: x uniform in [1, p) until on-curve, then a
        uniform sign; distinct points; a draw containing both P and -P is
        kept (it is a valid uniform subset) and flagged.
      NULL_B_ZN: >-
        Z/N with a uniformly random B-subset of nonzero residues, 100 draws
        per (curve, B convention), plain convention, integer arithmetic;
        each draw is mirrored on E by scalar multiplication [k]P and the two
        count vectors must agree bit-for-bit. The E-point and Z/N random
        arms must agree in distribution (KS at 1 percent on Delta).
    control_bases:
      ZN_interval: >-
        Z/N with the base [1, B_1] (unrounded B_1), plain convention, integer
        arithmetic; identical count vector to the E small-multiples base
        {[i]P : i = 1..B_1}, which is enumerated in point arithmetic and
        must agree bit-for-bit.
      bose_chowla: >-
        Z/N with the Bose-Chowla B_3 set of size q = B_2 lifted from
        Z/(q^3 - 1) to integers in [0, q^3 - 2), plain convention. The B_3
        property is verified exhaustively in the integers before the arm
        runs (all C(q + 2, 3) 3-multiset sums distinct). Also mirrored on E.
      q_decay_ladder: >-
        Z/N interval [1, B_1] with a fraction q in {0, 0.25, 0.5, 0.75, 1} of
        its elements (round(q B_1) of them, chosen by seed) replaced by
        uniformly random nonzero residues (distinct from the rest), 10 draws
        per q > 0, plain convention.
    predicate_family:
      frozen_before_any_run: true
      applied_to: >-
        Targets on E arms only (including the E mirrors of Z/N arms), read
        from x(R) with no logarithm. Densities are the exact counts of
        satisfying targets over E(F_p) minus O.
      predicates:
        - {id: P1, predicate: x < p/2, nominal_density: 0.5}
        - {id: P2, predicate: x mod 4 = 0, nominal_density: 0.25}
        - {id: P3, predicate: legendre(x) = 1, nominal_density: 0.5}
        - {id: P4, predicate: legendre(x - 1) = 1, nominal_density: 0.5}
        - {id: P5, predicate: legendre(x + 1) = 1, nominal_density: 0.5}
        - {id: P6, predicate: low three bits of x are zero, nominal_density: 0.125}
        - {id: P7, predicate: x < p/8, nominal_density: 0.125}
      anchor:
        id: ANCHOR-LOG
        predicate: log_P(R) in [0, N/8)
        nominal_density: 0.125
        realizable: false
        note: >-
          Unrealizable sensitivity check for the pushforward instrument;
          labelled so in every table; expected rho near 8 on the Z/N interval
          arm.
    lift_definitions: >-
      From IDEA-20260830-c5c614 claim section (C): for S = the target set
      where the predicate holds, of density sigma, the yield lift
      rho_S = E_{r in S}[c(r)] / E_{r in G}[c(r)] = T_S/(sigma M) and the
      precision lift lambda_S = Pr[c(r) >= 1 | r in S] / Pr[c(r) >= 1].
      Analytic null (INV-3, plain arms only): rho_S has mean 1 and SD
      sqrt((1 - sigma)/(sigma M)); z = (rho_S - 1) sqrt(sigma M/(1 - sigma)).
      Negation-closed arms: z against the NULL-A Monte Carlo mean and SD of
      rho_S over the 100 draws.
    forced_value_table:
      written_and_hashed_before_any_curve_arm: true
      rows_per_rung_and_convention:
        - M and M_red (from the recomputed B_1)
        - M_2 (from the recomputed B_2)
        - B_1^3/(4M) (forced negation gap)
        - 0.05 B_1^2 (positive-control threshold)
        - Z/N interval E_3 and Delta at B_1 by exact integer enumeration
        - Bose-Chowla E_3 = M_2 and Delta = 1 - mu_2
        - 1 - 1/N (random-base mean) and the design SD sqrt(mu + 6 mu^2 + 4 mu^3)/(mu sqrt N)
        - analytic null SD sqrt((1 - sigma)/(sigma M)) per predicate cell (plain arms)
        - N P[Poisson(mu) >= k] for k = 1..8

  controls:
    - name: ZN_interval_positive_control
      construction: >-
        Z/N base [1, B_1], plain convention, integer enumeration of all
        C(B_1 + 2, 3) multisets; mirrored by the E small-multiples base
        {[i]P} in point arithmetic; q-decay ladder attached.
      expected: >-
        Delta >= 0.05 B_1^2 (nominal >= 115, 274, 696, 1730 at the four
        rungs; design value about (11/120) B_1^2 = 211, 502, 1277, 3172),
        equal to the pre-registered exact integer enumeration in the forced
        value table; ratio to the NULL-B mean above 100 at every rung; the E
        mirror bit-identical. BLOCKING: if missed, no negative may be read
        from any arm of the run.
    - name: bose_chowla_minimum_energy_control
      construction: >-
        Bose-Chowla B_3 set of size B_2 lifted to Z/N, plain convention,
        integer enumeration; B_3 property pre-verified in the integers;
        mirrored on E.
      expected: >-
        E_3 = M_2 = C(B_2 + 2, 3) EXACTLY (nominal 969, 3654, 14190, 52394)
        and Delta = 1 - mu_2 exactly; any repeated 3-sum fails the control
        (HEUR-003 refuted or the enumerator faulty, localised by re-checking
        3-sums in the integers).
    - name: forced_negation_gap_trap_control
      construction: >-
        Every negation-closed arm enumerated under both conventions; the
        reduced vector also derived from the unreduced one by subtracting
        (B/2) [r in W].
      expected: >-
        Delta_unreduced - Delta_reduced = B_1^3/(4M) within 0.1 (nominal
        1.411, 1.441, 1.463, 1.476 at even B_1 = 48, 74, 118, 186); the
        derived and directly enumerated reduced vectors identical.
    - name: NULL_A_random_class_band
      construction: >-
        100 uniformly random negation-closed x-class-set bases per (curve,
        B convention), both sign conventions, enumerated in point arithmetic.
      expected: >-
        Mean Delta (reduced) within 3 SE of 1 - 1/N; measured SD reported
        against the design figure 0.026, 0.013, 0.0066, 0.0033 (HEUR-001,
        not asserted); the band (mean plus or minus 3 SD) is the reference
        for every negation-closed object arm. BLOCKING for M6.
    - name: NULL_B_random_point_and_ZN_band
      construction: >-
        100 uniformly random B-subsets of E points and, separately, 100 of
        Z/N (each Z/N draw mirrored on E), plain convention.
      expected: >-
        Mean Delta within 3 SE of 1 - 1/N; the two arms agree in
        distribution (KS at 1 percent); mirrored vectors bit-identical; for
        every predicate cell and the anchor, Var T_S = sigma (1 - sigma) M
        within 3 SE and z-scores N(0, 1) (KS at 1 percent). BLOCKING for M8
        on plain arms.
    - name: INV1_accounting_identity
      construction: >-
        Per cell, sum over all targets (including O) of the directly
        enumerated counts, integer-exact.
      expected: >-
        Equals M (plain, unreduced) or M_red (reduced) with deviation 0 in
        every cell; asserted before any other number is read from the cell.
    - name: INV2_accounting_identity_spectral_route
      construction: >-
        A second implementation sharing no code with the direct enumerator
        computes, from the base's log-set indicator on Z/N, the ordered
        count vector by FFT cyclic self-convolution (rounded to integers),
        the pair-type vector from the convolution of the 2-dilated indicator
        with the indicator, the triple-type vector from 3-dilation, and from
        these the multiset count vector c = (c_ord + 3 c_pair + 5 c_triple)/6
        exactly; for the reduced convention it subtracts (B/2) [r in W]. It
        also reports E_3 = sum c^2, E_3^ord = sum c_ord^2 and checks
        E_3^ord = (1/N) sum_chi |S_D(chi)|^6 (Parseval) to relative 1e-9
        before rounding.
      expected: >-
        The spectral multiset count vector equals the direct enumerator's
        vector exactly in every target, so sum of squares agrees exactly;
        E_3 <= E_3^ord <= 36 E_3. Any disagreement invalidates the cell.
    - name: analytic_selection_null
      construction: >-
        For each plain arm and predicate S of measured density sigma,
        z = (rho_S - 1) sqrt(sigma M/(1 - sigma)) from the INV-3 closed form;
        for negation-closed arms z from the NULL-A Monte Carlo mean and SD.
      expected: >-
        On NULL-B arms z ~ N(0, 1) over cells; on the Z/N interval arm the
        anchor shows rho near 8 (sensitivity check); the expected null on
        object arms is max Holm-corrected |z| below the 5 percent threshold.
    - name: label_permutation_null
      construction: >-
        For each object cell, the count vector is kept and the predicate
        labels are permuted uniformly over targets (100 permutations, seeded);
        rho_S and z recomputed under each permutation.
      expected: >-
        The permuted z-scores are N(0, 1) and the observed |z| is compared
        against the permutation distribution as a second, distribution-free
        p-value; a predicate 'significant' under the analytic null but not
        under permutation is reported as such and not counted as a lift.
    - name: q_decay_ladder
      construction: >-
        Z/N interval with fraction q in {0, 0.25, 0.5, 0.75, 1} of elements
        replaced by random residues, 10 draws per q > 0.
      expected: >-
        Delta falls monotonically in q (mean over draws) and equals the
        NULL-B band at q = 1; a Delta flat in q is the artifact tell and
        invalidates the run's positive control.
    - name: ordering_control
      construction: >-
        The forced-value table is written and sha256-hashed before any curve
        arm is enumerated; the null and control arms' verdicts are recorded
        in accounting.json before any object arm's Delta is read.
      expected: >-
        Hash of the forced-value table in the manifest precedes (by
        timestamp and by run log order) every object-arm artifact.
    - name: pareto_rows
      construction: >-
        One instance per rung: rho with negation (0.886 sqrt N) and BSGS
        (sqrt N time and memory) in group operations, computed as formulas,
        not run.
      expected: >-
        Recorded as modeled reference rows only, labelled modeled; no
        measured comparison and no attack claim.

  independent_variables:
    N_rung: [14, 16, 18, 20]
    geometry_panel:
      - x_interval_low
      - x_interval_mid
      - qr_class
      - NULL_A_random_x_classes
      - NULL_B_random_points
      - NULL_B_ZN_random
      - ZN_interval_and_E_small_multiples
      - bose_chowla
      - q_decay_ladder
    B_convention: [B_1, B_2]
    sign_convention: [plain, unreduced, reduced]
    k_for_k_rich: [1, 2, 3, 4, 5, 6, 7, 8]
    predicate: [P1, P2, P3, P4, P5, P6, P7, ANCHOR-LOG]
    cell_definition: >-
      A cell is one (curve, geometry, B convention, sign convention) tuple;
      null geometries have 100 draws per cell, the q-decay ladder 10 per q.
    fixed: {arity_m: 3, null_draws: 100, holm_alpha: 0.05, band_width_sd: 3}

  metrics:
    primary:
      - >-
        Delta per cell (E_3/M - mu with the cell's own M or M_red), with a
        bootstrap 95 percent interval across the curves of the rung for each
        object geometry, and the NULL-A band (mean, SD, 100 draws) per
        (curve, B convention, sign convention).
      - >-
        Excess Delta - Delta_null_mean per object cell in units of the NULL-A
        SD (z_Delta), and the verdict inside/outside the mean plus or minus
        3 SD band per rung and curve.
      - >-
        Growth-fit slope of log(max(Delta - Delta_null_mean, SD_null))
        against log N over the four rungs per object geometry (reduced,
        B_1), with a bootstrap interval from resampling curves within rungs,
        and the verdict 'contains 0' / 'excludes 0'.
      - >-
        k-rich counts #{r : c(r) >= k} for k = 1..8 per cell, the Poisson
        reference N P[Poisson(mu) >= k], and the Chebyshev bound
        N mu Delta/(k - mu)^2 for k > mu with a pass/fail per cell.
      - >-
        Predicate lifts rho_S and lambda_S for P1-P7 and ANCHOR-LOG per E
        cell, z-scores against the analytic null (plain arms) or the NULL-A
        Monte Carlo band (negation-closed arms), Holm-corrected within each
        (arm, rung) family at 5 percent, plus the permutation p-value.
      - >-
        INV-1 deviation (sum of counts minus M or M_red) and INV-2 deviation
        (direct sum of squares minus spectral-route sum of squares), both
        integers, per cell; target 0.
      - >-
        Control verdicts per rung: ZN_interval Delta against 0.05 B_1^2 and
        against the forced-value table; Bose-Chowla E_3 against M_2;
        forced-negation gap against B_1^3/(4M) within 0.1; q-decay
        monotonicity; NULL-B KS agreement; anchor rho on the ZN_interval arm.
    secondary:
      - E_3 and E_3^ord per cell; the ratio E_3^ord/E_3 (must lie in [1, 36]).
      - >-
        Coverage #{r : c(r) >= 1}/N and the FB3 concentration statistic
        (1/N) sum_r c(r)(c(r) - 1) per cell, computed under the FB3 plain
        convention where applicable, for cross-record comparison with
        EXP-FB3-001.
      - >-
        Spectral summaries per base (toy only, log-defined): (1/N)
        sum_{chi != 1} |S_D(chi)|^6 / B^3 and max_{chi != 1} |S_D(chi)| /
        sqrt(B log N), with the Kohel-Shparlinski reference level
        p^{1/2} log p (HEUR-002) reported alongside.
      - >-
        Measured SD of Delta over the 100 null draws against the design
        figure (HEUR-001), and the max c(r) histogram over draws against the
        Poisson maximum.
      - Wall clock per stage and per cell; peak RSS per run; point-addition count per cell.
      - >-
        FFT-versus-direct agreement report: number of targets differing
        (target 0) and the Parseval relative residual before rounding.
      - Planned versus executed cell count, and every rejected curve seed with its reason.

  heuristic_under_test: HEUR-001
  heuristic_under_test_note: >-
    The main claim is the M6 dispersion measurement; HEUR-001 (Poisson
    dispersion of random bases) is validated by the same run through the
    NULL-A and NULL-B bands, HEUR-003 by the Bose-Chowla pre-check, and
    HEUR-002 only by the zero-compute retrieval stage and the toy spectral
    maximum. This field names the heuristic whose validation this run also
    serves; the primary metric remains M6.

  preregistered_prediction:
    quantity: >-
      The dispersion index Delta = E_3/M - mu of the decomposition-count
      vector, per cell, and its excess over the random-base band; the forced
      values of the three calibration controls; the accounting identities.
    formula: >-
      Random bases: E[Delta] = 1 - 1/N (INV-2p), design SD
      sqrt(mu + 6 mu^2 + 4 mu^3)/(mu sqrt N) = 0.026, 0.013, 0.0066, 0.0033
      (nominal rungs). Z/N interval: Delta about (11/120) B_1^2 - mu =
      211, 502, 1277, 3172 nominal, threshold 0.05 B_1^2 = 115, 274, 696,
      1730, binding value the exact integer enumeration. Bose-Chowla:
      E_3 = M_2 = 969, 3654, 14190, 52394 and Delta = 1 - mu_2 exactly.
      Forced-negation gap: B_1^3/(4M) = 1.411, 1.441, 1.463, 1.476 at even
      B_1 = 48, 74, 118, 186. Accounting: sum c = M or M_red, sum c^2 = E_3,
      deviation 0. Object arms (x-interval, QR-class), pre-committed
      expected outcome: Delta inside the NULL-A band (mean plus or minus 3
      SD) at every rung on every curve, growth slope interval containing 0,
      max Holm-corrected predicate |z| below threshold; competing outcome:
      Delta - Delta_null > 3 SD on every curve at the two largest rungs and
      increasing across rungs, slope interval excluding 0. Spectral: random
      arms' sixth-moment ratio near 6 and max ratio near 1; Z/N interval far
      above both; x-interval arms expected near the random values (INV-4c).
      All nominal numbers are re-derived from the actual N per curve by the
      frozen formulas before any run and the re-derived values are binding.
    source: >-
      IDEA-20260906-d1494b predictions M1-M9 and null_object_control,
      restated in H-RELN-41562a; the random-base value from INV-2p (in-record
      derivation, unreviewed); the Z/N interval constant from the recalled
      Irwin-Hall density (design value only; binding value by enumeration);
      the Bose-Chowla forced value from HEUR-003 (verified exhaustively in
      the run). Written before any run and never adjusted afterward; a
      change requires a versioned protocol_amendment.

  scale_relevance:
    tier: toy
    justification: >-
      Exhaustive enumeration at N near 2^14 to 2^20 on generated prime-order
      curves with m = 3 and B of order (6N)^{1/3}. The accounting identities
      are scale-free; the measured Delta values, bands and slopes are
      toy-tier and transfer nowhere. No transfer or extrapolation assumption
      is made; the growth fit over four rungs spanning a factor 64 in N is a
      toy-scale trend, not an asymptotic statement. Nothing here is an ECDLP
      cost claim.
    correspondence: null

  tail_checks:
    - >-
      Largest Delta over the 100 NULL-A draws per cell against the mean plus
      3 SD band; the number of draws outside the band reported against the
      Gaussian expectation.
    - >-
      Largest c(r) over all targets per null draw against the Poisson
      maximum of order log N / log log N; the max histogram over draws.
    - >-
      Largest spectral value max_{chi != 1} |S_D(chi)| over x-interval bases,
      curves and rungs against sqrt(B log N) (random level) and against
      p^{1/2} log p (HEUR-002 bound).
    - >-
      The k = 8 rich count on every random arm (expected essentially empty)
      and the peak count on the Z/N interval arm (expected of order B^2/8,
      about 4300 at B = 186).
    - >-
      Smallest and largest per-predicate z over all NULL-B cells against the
      N(0, 1) extreme-value expectation for the number of cells.

  replication:
    seeds:
      curve_seed_scan: >-
        s = 1, 2, 3, ... per rung until three prime-order curves are accepted;
        all accepted and rejected seeds recorded.
      null_draw_master_seed: 20260906
      null_draw_derivation: >-
        Draw i of arm A on curve (k, s) at B convention c uses the 64-bit
        integer SHA256('20260906:k:s:A:c:i'); the sampler is a seeded PCG64
        or equivalent recorded in environment.json.
      permutation_master_seed: 20260907
      q_decay_master_seed: 20260908
    independent_instances: >-
      At least 3 prime-order curves per rung (12 minimum); 100 null draws per
      null cell; 10 draws per q-decay step. Object-base enumeration is
      deterministic given the curve, so seeds affect only the curve draw and
      the random-base, permutation and q-decay draws; re-running with the
      same seeds must reproduce every count vector bit-for-bit.
    cross_check: >-
      Every log-defined arm is computed twice (integers in Z/N and points on
      E via [k]P) and must agree exactly; every cell's count vector is
      recomputed by the spectral implementation and must agree exactly.

  budget:
    enforcement: advisory
    policy: docs/research-budget-policy.md
    wall_clock_seconds_per_run: 14400
    total_cpu_hours: 12
    maximum_memory_gb: 4
    maximum_runs: 8
    maximum_workers: 4
    sizing_note: >-
      Design figures, not measurements. Per base at N near 2^20: about
      1.1e6 point additions (pairwise sums precomputed, one addition per
      multiset) in numpy-vectorised modular arithmetic; 100 NULL-A + 100
      NULL-B(E) + 100 NULL-B(Z/N, integers) + 3 object geometries x 2 B
      conventions + controls per curve, three curves per rung. Memory at
      N = 2^20: count vector int64 8 MiB, complex128 FFT 16 MiB with
      temporaries under 200 MiB, log table under 32 MiB, object count vectors
      retained in memory under 200 MiB; 4 GB is headroom, not a need.
      maximum_workers 4 permits one process per curve within a rung and is
      conditional on parallel.verify_determinism passing on the enumerator;
      otherwise the run executes with 1 worker.
    run_plan: >-
      Run A: Stage 0 and Stage 1 for all four rungs (forced-value table,
      Z/N integer arms, Bose-Chowla pre-check). Runs B14, B16, B18, B20:
      Stages 2-4 for one rung each. maximum_runs 8 leaves three re-runs for
      infrastructure failures; a re-run never replaces a completed run's
      artifacts.

  stage_budgets:
    - stage: stage0_derivations_and_forced_value_table
      wall_clock_seconds: 600
      description: >-
        Zero-compute symbolic re-derivation of INV-2, 2p, 2pp, 3, 3pp, 9
        recorded in execution-report.md; retrieval attempt for the
        Kohel-Shparlinski theorem statement (HEUR-002) recorded as retrieved
        or not retrieved, never paraphrased as read; forced-value table
        computed from the actual N of each accepted curve and hashed.
    - stage: stage1_ZN_integer_arms
      wall_clock_seconds: 1200
      description: >-
        Z/N interval, Z/N random (100 draws), Bose-Chowla (with B_3
        pre-check), q-decay ladder, all rungs, integer arithmetic.
    - stage: stage2_curve_enumeration_per_rung
      wall_clock_seconds: 10800
      description: >-
        Curve generation with certificates; log table; E arms (object,
        NULL-A, NULL-B points, E mirrors of every Z/N arm) in point
        arithmetic; INV-1 asserted per cell.
    - stage: stage3_spectral_cross_check_per_rung
      wall_clock_seconds: 1200
      description: >-
        FFT implementation over the log-set of every base; exact vector
        agreement; spectral summaries.
    - stage: stage4_analysis
      wall_clock_seconds: 600
      description: >-
        Bands, z-scores, Holm, permutation null, k-rich, growth fit,
        control verdicts; metrics.json, accounting.json,
        predicate-lifts.json.
    - stage: stage5_optional_extension
      wall_clock_seconds: 0
      description: >-
        Rungs 2^22 and 2^24 are NOT authorized by this version; if M6 is
        underpowered the decision path names them for a versioned amendment
        or a successor contract.
  budget_interpretation: >-
    Advisory ceilings per docs/research-budget-policy.md; no stage borrowing
    without recording it; no automatic reruns; fixed scientific sample
    counts (3 curves, 100 draws, 7 predicates, 8 k-values) are frozen and
    are not budget quantities.

  stopping_rules:
    - >-
      Stop the cell on any INV-1 or INV-2 deviation, on a spectral-versus-
      direct disagreement, or on a reduced-versus-derived-reduced vector
      disagreement; preserve the cell's artifacts, mark it
      failed_accounting, read nothing from it, and continue other cells.
    - >-
      Stop the run's object-arm reading if the Z/N interval positive control
      fails its threshold, the q-decay ladder is not monotone, the E
      small-multiples mirror is not bit-identical, the Bose-Chowla E_3 != M_2,
      or the forced-negation gap is off by more than 0.1 on any
      negation-closed arm; complete and record the null and control arms,
      mark the run instrument_failed, and report no scientific verdict.
    - >-
      Stop the rung if fewer than three prime-order curves are accepted
      within 400 seeds; record the seed scan and report the rung as
      not_run, never substitute a composite-order curve.
    - >-
      Stop the run at the wall-clock, CPU or memory ceiling; record partial
      artifacts and failed_infrastructure; never report a completed result
      from a partial run.
    - >-
      Stop on lost provenance or inability to bind the approved
      specification hash and source hashes in the manifest.
    - >-
      Never change the predicate family, the B or sign conventions, the seed
      derivation, the number of draws or any threshold during or after a
      run; such a change is a versioned protocol_amendment and a new run.

  invalidation_rules:
    - An accounting identity (INV-1, INV-2, Chebyshev, reduced-derivation) violated in a cell invalidates that cell.
    - >-
      A control outside its pre-committed value (Z/N interval below
      0.05 B_1^2 or not equal to the forced table; Bose-Chowla E_3 != M_2;
      forced gap off by more than 0.1; q-decay not monotone; NULL-B means
      outside 3 SE at two rungs) invalidates the run's object-arm verdicts.
    - The spectral (FFT) count vector and the direct count vector disagree in any target.
    - >-
      The direct enumerator and the spectral implementation share code, or
      the spectral implementation is called from the enumerator or vice
      versa.
    - A cell whose sign convention or B convention is undeclared, ambiguous, or mixed.
    - >-
      A curve without a complete point-count certificate, or with composite
      N, or with fewer than B/2 distinct on-curve x values in an object base.
    - >-
      A predicate that depends on a discrete logarithm (other than the
      declared unrealizable anchor) or a predicate added, removed or altered
      after any count is read.
    - >-
      Object-arm Delta values read before the null and control verdicts are
      recorded (ordering control), or the forced-value table hash absent
      from the manifest.
    - >-
      Timeout, out-of-memory, crash or a numpy/FFT failure is
      failed_infrastructure for the affected run and is never evidence for
      or against any outcome (AGENTS.md rule 3).
    - >-
      Any artifact fabricated, overwritten, detached from its source commit,
      or produced before frozen approval; any missing count reported as a
      number.

  success_criterion: >-
    A run set is COMPLETE when all four rungs have at least three
    certified prime-order curves, every cell passes INV-1 and INV-2 with
    deviation 0 and the spectral cross-check exactly, and every blocking
    control (Z/N interval, Bose-Chowla, forced gap, NULL-A and NULL-B means,
    q-decay monotonicity, ordering) meets its pre-committed value. On a
    complete run set the primary metric decides: NULL OUTCOME (valid,
    reportable, the pre-committed expectation) if every object cell
    (reduced, B_1 and B_2) has Delta inside its NULL-A band at every rung on
    every curve, the growth-slope interval contains 0 for every object
    geometry, and the max Holm-corrected predicate |z| is below threshold at
    every rung; ALIVE OUTCOME if for some object geometry Delta - Delta_null
    exceeds 3 SD on every curve at the two largest rungs and the slope
    interval excludes 0 on the positive side. Either outcome is a success of
    the experiment as a measurement; neither is an ECDLP claim. Promotion of
    H-RELN-41562a in either direction is a separate Coordinator decision
    after independent review.

  falsification_criterion: >-
    The hypothesis's null branch is refuted at toy scale by the ALIVE
    outcome on a complete run set with every control passing (this refutes
    conjecture INV-4c at toy scale and is the competing prediction, not an
    error). The derived null INV-2p or INV-3 is refuted if, with the sampler
    uniformity checks passing, NULL-B mean Delta lies outside 3 SE of
    1 - 1/N at two rungs or Var T_S departs from sigma (1 - sigma) M beyond 3
    SE on the anchor; that supersedes the derivation, not the measurement.
    An outcome with the slope interval containing both 0 and the alive
    threshold is INCONCLUSIVE (underpowered) and is reported with the rung
    count needed. Instrument failures, control misses, invalid cells and
    infrastructure failures are never negative evidence.

  decision_paths:
    positive: >-
      ALIVE outcome on a complete run set: the Coordinator schedules
      replication on three fresh prime-order curves per rung (new seed scan
      starting after the last accepted seed) under an amendment or a
      successor contract before any hypothesis status change; on
      replication, the exhaustive count vectors and the measured
      between-cell budget mu (Delta - Delta_null) are handed to
      EXP-RELN-82f487 as labels and to EXP-RELN-141a86 as summaries with the
      alive verdict recorded; the promotion gates of AGENTS.md apply to any
      later claim.
    negative: >-
      NULL outcome on a complete run set: the Coordinator records the
      measured obstruction as an obstruction-block-ready quantity, namely
      the Delta excess with its bootstrap interval per geometry and rung
      over the stated scope (curves, N, B conventions, sign conventions,
      m = 3, this solver and budget), together with the envelope bound
      sqrt(Delta (1 - sigma)/(sigma mu)) on every predicate lift at those
      cells and a resource_check stating that the rungs were exhaustive and
      the null bands fully sampled; forward guidance names the 2^22 and
      2^24 extension and the size-biased estimator of IDEA-20260906-cd7b7e
      as the scaling route. No lane is closed by this outcome; INV-4c stays
      a conjecture supported at toy scale only.
    inconclusive: >-
      Underpowered slope, an incomplete rung, an instrument failure or an
      infrastructure failure: preserve every immutable partial artifact,
      name the missing rung, control or repair in a new handoff, and retain
      H-RELN-41562a at status proposed with no claim promoted or demoted.

  required_artifacts:
    - manifest.json
    - environment.json
    - inputs.json
    - curves.json
    - forced-value-table.json
    - cells/<cell-id>/count-vector.npy (object, control and mirror cells; null draws store sha256 of the vector plus histogram)
    - cells/<cell-id>/histogram.json
    - cells/<cell-id>/spectral.json
    - cells/<cell-id>/count-vector.sha256
    - accounting.json
    - metrics.json
    - predicate-lifts.json
    - bands.json
    - execution-report.md
    - stdout.log
    - stderr.log
    - source/direct_enumerator.py
    - source/spectral_crosscheck.py
    - source/zn_integer_arms.py
    - source/analysis.py
    - source/SHA256SUMS
  artifact_binding: >-
    All future artifacts belong to newly allocated immutable run directories
    under experiments/EXP-RELN-f202be/runs/. The manifest binds the approved
    specification hash, the forced-value-table hash, curve certificates,
    seeds, source hashes, commit, exact commands, runtime and dependency
    versions (python, numpy, sympy), the inference block with
    requested_policy, artifact hashes and measured costs (wall clock per
    stage, peak RSS, point-addition counts). source/direct_enumerator.py and
    source/spectral_crosscheck.py are separate implementations sharing no
    module, function or imported helper beyond the standard library and
    numpy; the manifest records their independence. No run directory is
    authorized now.

  later_review_requirements:
    - >-
      A committed Coordinator review_plan must precede any claim-changing
      review, declaring the prior (proposal's 0.7 null / 0.25 bounded excess
      / 0.05 growing excess), the owned joints (band construction, B
      convention, predicate family), blindness, and the known-false control
      (Z/N interval must fail 'no cluster').
    - >-
      Independent validator checks receipts, curve certificates, cell
      counts, seed derivations, the two-implementation independence, and
      recomputes the forced-value table from the recorded N values.
    - >-
      Blind re-derivation: the validator receives one object cell's
      count-vector.npy, its (N, B, M, convention) and nothing else, and
      recomputes Delta, the k-rich counts and one predicate lift without the
      producer's code or report; exact agreement required.
    - >-
      Red team attacks the band construction (100 draws, 3 SD, reduced
      convention as reference), the B-convention choice (even rounding,
      B_2 rule), the selection rules for the object bases (low, mid, QR),
      the Holm family definition, and any transfer language.
    - >-
      Review-adversarial at xhigh (validator and red team), no silent
      downgrade; a proposed breakthrough, closure, or contradiction of
      KN-FIND-007 requires nondegradable review-breakthrough at max.
    - >-
      Knowledge promotion follows the Coordinator's evidence-review decision;
      no KN-FIND is written from an unreplicated single run set.
