protocol_amendment:
  experiment_id: EXP-RELN-f202be
  amendment_ordinal: 1
  version_from: 1
  version_to: 2
  filename_convention_note: >-
    THE FILENAME IS v1.yaml BECAUSE THIS IS THE FIRST AMENDMENT TO THIS
    CONTRACT, NOT BECAUSE IT PRODUCES CONTRACT VERSION 1. The contract is
    frozen at version 1; this amendment produces version 2.
  filed_at: '2026-09-07'
  filed_by: coordinator (orchestrating session, RQ-RELN-61638a)
  recorded_by_decision: DEC-20260907-432a39
  status: filed_after_the_affected_data_is_generated
  claim_tier: toy

  applies_to: >-
    FUTURE RUNS ONLY, for the forced_negation_gap_trap_control alone.
    RUN-RELN-f202be-N14 and RUN-RELN-f202be-N16 are NOT re-scored against
    anything in this file, no artifact of either is altered, and their
    recorded object-arm reading stands exactly as written: the underlying
    measurements (curve certificates, E3_direct, E3_spectral, INV1/INV2
    accounting, all of which passed exactly) are unaffected by this
    amendment and remain valid data. Only the forced-negation-gap PASS/FAIL
    threshold applied to that already-measured data changes, and only for a
    re-analysis under a new run identifier (AGENTS.md rules 2 and 4: a
    correction supersedes, it does not overwrite). RUN-RELN-f202be-N18,
    RUN-RELN-f202be-N20 and RUN-RELN-f202be-stage4 are likewise not edited;
    their recorded control-verdicts already satisfy the amended threshold
    (see change G1's validation table) and their pass/fail status is
    unchanged by this amendment.

  reason: >-
    The frozen contract's forced_negation_gap_trap_control checked the
    measured gap Delta_unreduced - Delta_reduced against a fixed ABSOLUTE
    tolerance of 0.1 around the leading-order prediction B_1^3/(4M), for
    every rung uniformly. The hypothesis's own candidate_invariants
    (INV-2doubleprime / INV-A3, ledger/hypotheses/H-RELN-41562a.yaml)
    already named that this leading-order value carries a relative,
    finite-size correction of order m/B_1 that the absolute-0.1 tolerance
    never budgeted for. RUN-RELN-f202be-N14 and N16 (executed under handoff
    TASK-20260906-16e62c) measured this correction directly: the deviation
    is always small, of consistent sign, and shrinks monotonically in
    RELATIVE terms as B_1 grows (worst relative deviation 13.0% at B_1=48,
    8.1% at B_1=74, 5.1% at B_1=118, 3.3% at B_1=186 -- see change G1's
    validation table), exactly the pattern a relative correction predicts
    and not the pattern an implementation defect would produce (INV-1 and
    INV-2 accounting passed with zero deviation in every one of these
    cells, and the spectral cross-check agreed exactly). At the two
    smallest rungs this relative correction is large enough in ABSOLUTE
    terms (up to 0.167) to exceed the frozen 0.1 tolerance on 23 of 72
    object cells, triggering the contract's own mechanical
    instrument_failed stopping rule. This is a miscalibration of the
    ORIGINAL TOLERANCE (an absolute figure applied where the true error
    scales with B_1), not a fabricated result, not grounds to promote
    H-RELN-41562a, and not evidence about the dispersion index itself,
    which this control does not measure.

  the_freeze_is_NOT_fully_intact_and_that_is_stated_rather_than_hidden: >-
    THIS AMENDMENT'S SPECIFIC SAFETY MARGIN WAS CHOSEN WITH THE RUNG-14
    THROUGH RUNG-20 RESIDUALS ALREADY VISIBLE. An attempt was made to derive
    the EXACT next-order term in closed form (the exact algebraic identity
    relating Delta_unreduced, Delta_reduced, E3_reduced, the forced sum
    S_W = sum over W of the reduced count, B_1, M and M_red is elementary
    and was checked against RUN-RELN-f202be-N14 seed17/x_interval_low_B1's
    own numbers: E3_direct_unreduced=66010, E3_direct_reduced=37306,
    M=19600, M_red=18448, B_1=48 give S_W=22 by that identity, and the
    identity reproduces the recorded forced_negation_gap_measured=1.275717
    exactly). But S_W is a BASE-GEOMETRY-SPECIFIC quantity (it depends on
    how the reduced count is distributed ACROSS W's own points, which
    differs between x_interval_low, x_interval_mid and qr_class) with no
    closed form available from B_1 and N alone, so a tight EXACT
    replacement tolerance is not available without further theory. What is
    adopted instead is a multiplicative safety factor (3x) over the named
    order-of-magnitude correction m/B_1, and that factor of 3 was picked,
    after the fact, to cover the worst already-measured relative deviation
    at EVERY one of the four rungs with comfortable (approximately 40-50%)
    margin -- see the validation table under change G1. A reader preferring
    a different, independently-derived tolerance has every raw number: the
    exact per-cell forced_negation_gap_measured and _expected values are in
    experiments/EXP-RELN-f202be/runs/RUN-RELN-f202be-N*/curve_results.json
    under object_arms.*, unedited by this amendment.

  changes:
    - id: G1
      field: >-
        controls[name=forced_negation_gap_trap_control].expected, and every
        stopping_rules / invalidation_rules clause referencing "off by more
        than 0.1" for the forced-negation gap
      kind: defect_repair_miscalibrated_absolute_tolerance
      decided_by: >-
        THE USER, this session (AskUserQuestion: "Amend tolerance, rerun
        small rungs (recommended)"), implemented by the Coordinator.
        Recorded in DEC-20260907-432a39.
      from: >-
        "Delta_unreduced - Delta_reduced = B_1^3/(4M) within 0.1" (a fixed
        ABSOLUTE tolerance, applied identically at every rung).
      to: |-
        "Delta_unreduced - Delta_reduced = B_1^3/(4M) within
        max(0.1, 3*(m/B_1)*(B_1^3/(4M)))", m = 3 (the contract's fixed
        arity), evaluated per cell from that cell's own recomputed B_1 and
        M exactly as the contract's ordering and provenance rules already
        require -- no new frozen numeric table is introduced, only the
        tolerance formula. At large B_1 (rungs 18, 20 in this contract) the
        relative term falls below 0.1 and the floor of 0.1 is binding,
        so this change is INERT there; at small B_1 (rungs 14, 16) the
        relative term dominates and widens the tolerance.
      validation_table: |-
        Computed directly from the already-recorded
        forced_negation_gap_measured / _expected values in
        RUN-RELN-f202be-N14/16/18/20's curve_results.json, worst case over
        every (curve, cell) pair at that rung (18 cells per rung: 3 curves
        x 6 object cells):

        rung14 (B_1=48): worst_abs_deviation=0.1671, worst_rel_deviation=0.1303,
          amended_relative_tolerance=3*(3/48)=0.1875 (margin 44% above worst
          observed relative deviation); amended_absolute_tolerance at that
          cell's forced_negation_gap_expected=1.4106*... exceeds 0.1671.
        rung16 (B_1=74): worst_abs=0.1089, worst_rel=0.0806,
          amended_relative_tolerance=3*(3/74)=0.1216 (margin 51%).
        rung18 (B_1=118): worst_abs=0.0716, worst_rel=0.0510,
          amended_relative_tolerance=3*(3/118)=0.0763 (margin 50%; the 0.1
          floor is the binding constraint here and was already satisfied
          under the ORIGINAL tolerance -- this rung's pass/fail is
          unchanged).
        rung20 (B_1=186): worst_abs=0.0467, worst_rel=0.0325,
          amended_relative_tolerance=3*(3/186)=0.0484 (margin 49%; likewise
          the 0.1 floor was already binding and satisfied -- unchanged).

        Every rung passes the amended formula with 40-50% margin on its
        worst observed cell, using the SAME already-measured data as
        before; no new measurement is required to confirm this table, only
        a re-analysis run that applies the new formula.
      why_a_factor_of_3_and_not_something_tighter: >-
        m/B_1 alone (factor 1x) would leave rung14's worst observed
        relative deviation (0.1303) OUTSIDE a 1x tolerance of 0.0625 --
        too tight, would still fail. A factor of 2x gives 0.125, which is
        inside 0.1303's near neighborhood with almost no margin (a single
        percentage point) and would be fragile to a fresh re-run's ordinary
        curve-to-curve variation. Factor 3 was the smallest round multiplier
        checked that clears every rung's worst cell with a comfortable,
        non-fragile margin; it is not fitted separately per rung and is not
        the tightest multiplier that would technically pass.
      what_this_change_is_not: >-
        IT IS NOT A CLAIM THAT THE EXACT NEXT-ORDER TERM OF INV-2doubleprime
        / INV-A3 HAS BEEN DERIVED. It is not a finding about the dispersion
        index Delta itself, which this control does not measure and which
        the run's OTHER metrics (bootstrap Delta, NULL-A z-scores, growth
        fits) already report unaffected by this change. It does not touch
        the ZN_interval, Bose-Chowla, q-decay, NULL-A, NULL-B, INV-1, INV-2,
        or spectral-agreement controls, all of which passed cleanly at
        every rung and are unchanged.

  reanalysis_authorization: >-
    A re-analysis of RUN-RELN-f202be-N14 and N16 under the amended formula
    is authorized as NEW, separately identified run(s) (e.g.
    RUN-RELN-f202be-N14v2, RUN-RELN-f202be-N16v2), which MAY either (a) fully
    re-execute stages 2-3 with the SAME deterministic seeds -- required by
    the contract to reproduce every count vector bit-for-bit, so this is
    expected to reproduce E3_direct_unreduced, E3_direct_reduced, INV1, INV2
    and every other measured quantity exactly -- or (b) re-derive the
    forced-gap classification directly from the existing immutable
    RUN-RELN-f202be-N14 / N16 object_arms records without re-executing the
    enumeration, PROVIDED the re-analysis run's manifest records the exact
    source run, its content hash, and that no enumeration was re-run. Either
    path is a NEW run identifier; RUN-RELN-f202be-N14 and N16 as recorded
    are never edited. A combined re-analysis (RUN-RELN-f202be-stage4v2) then
    recomputes the run set's overall classification (NULL / ALIVE /
    INCONCLUSIVE) from N14v2, N16v2, and the UNCHANGED N18/N20 metrics.

  unchanged_and_still_frozen:
    - >-
      Every other control: ZN_interval_positive_control, bose_chowla, forced
      negation existence itself (the identity c_unreduced=c_reduced+(B/2)
      [r in W]), NULL_A_random_class_band, NULL_B_random_point_and_ZN_band,
      INV1_accounting_identity, INV2_accounting_identity_spectral_route,
      analytic_selection_null, label_permutation_null, q_decay_ladder,
      ordering_control, pareto_rows.
    - >-
      The curve-generation recipe, seeds, base-size and sign conventions,
      geometry panel, predicate family, metrics, preregistered_prediction,
      scale_relevance, replication protocol, budget, stage_budgets, and
      every other stopping_rule and invalidation_rule not named in change
      G1.
    - >-
      success_criterion and falsification_criterion in full; this amendment
      changes what counts as a passing forced-gap CONTROL, not what counts
      as a NULL or ALIVE scientific verdict on Delta itself.
    - claim_tier toy; no ECDLP claim under any outcome.

  what_this_amendment_does_not_do:
    - >-
      It does not promote or demote H-RELN-41562a. Status stays proposed.
    - >-
      It does not make RUN-RELN-f202be-N14 or N16's recorded
      instrument_failed classification into evidence, positive or negative.
      Instrument failures are categorically not evidence (AGENTS.md rule 3).
    - >-
      It does not authorize a scientific conclusion. A NULL or ALIVE
      classification from the re-analysis still requires the independent
      validator and red-team review named in the contract's
      later_review_requirements before any claim-changing use.
    - >-
      It does not change EXP-RELN-82f487 or EXP-RELN-141a86, which are
      separate contracts under RQ-RELN-61638a with their own approval
      decisions.

  approved_by: coordinator
  approved_at: '2026-09-07'
  approved_by_note: >-
    Approved on filing. The repaired parameter (the tolerance formula) was
    decided by the user this session, not inferred by this Coordinator, and
    every input to the validation table is a number already committed in
    RUN-RELN-f202be-N14/16/18/20's immutable artifacts, machine-readable and
    independently re-checkable by anyone from those files. What review is
    still owed is unchanged: the contract's later_review_requirements
    (independent validator blind re-derivation, red-team attack on the band
    and convention choices, review-adversarial at xhigh) apply in full to
    any eventual NULL/ALIVE classification before it backs a claim.
  approval_scope_limit: >-
    This approval authorizes the tolerance-formula change and the
    re-analysis run(s) it makes possible. It does not authorize any change
    to the other three contracts under RQ-RELN-61638a and does not itself
    constitute a scientific decision on H-RELN-41562a.

