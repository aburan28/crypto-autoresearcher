experiment:
  id: EXP-ICEX-4a3099
  hypothesis_id: H-ICEX-7af505
  derived_from_idea: IDEA-20260808-f4edc6
  question_id: RQ-ECDLP-002
  batch_id: BATCH-d6838c
  version: 1
  title: >-
    THE WINDOW LEDGER, WITH THE MEAN ARM REMOVED AS A PROOF AND A PLANTED TRUE
    DLOG INTERVAL AS THE CONTROL- exact windowed decomposition counts against a
    CURVE-FREE random-subset-of-Z/N null, a planted defect whose predicted
    coverage is about 2690 times below the null at the design cell, and a separate
    lattice-reach arm whose scrambled null must fail at every B and whose reach
    must decay monotonically to zero as the window is scrambled
  status: draft
  objective: >-
    (A) THE UNCERTAINTY, RESTATED NARROWLY. Two quantities are wanted- the
    distribution of windowed m-decomposition counts, and the largest B at which a
    small-root solver still returns a PLANTED windowed decomposition. But the
    count c_D(r) is a function of the DISCRETE-LOG IMAGE of the factor base alone,
    so the only elliptic content available in the yield half is whether an
    x-coordinate window maps to a subset of Z/N that behaves like a uniform random
    one. That is what this contract tests, and it is much narrower than -measuring
    windowed yield on real curves-.
    (B) THE ARM THAT IS REMOVED, AND WHY. KN-FIND-007 states VERBATIM that
    sum over r of c_D(r) = binomial(B+m-1, m) exactly, so the mean per-target yield
    is binomial(B+m-1, m)/N FOR EVERY BASE OF SIZE B independently of how the base
    is chosen. THE MEAN IS AN IDENTITY. It is recorded as a PROOF and its
    measurement is demoted to a CONSTRUCTION CHECK- a deviation is a harness bug
    and nothing else, and NO OUTCOME ON THE MEAN IS AN ELLIPTIC-CURVE STATEMENT.
    Running it as an arm and reporting agreement as a finding would be reporting
    an arithmetic identity as a measurement.
    (C) THE CONTROL WITH DEMONSTRATED DYNAMIC RANGE, COMPUTED IN THIS CONTRACT.
    The planted defect is the factor base taken as the multiples 0 through B-1 of
    the generator, i.e. A TRUE INTERVAL IN DISCRETE-LOG SPACE, whose m-fold sumset
    is an interval of exactly 3B-2 values at m = 3. At the design cell
    p about 2^22, N about 2^22, B = 2^8, m = 3-
        mu = binomial(258,3)/2^22 = 2829056/4194304 = 0.6745,
        Poisson coverage = 1 - exp(-0.6745) = 0.4906,
        planted coverage = (3B-2)/N = 766/4194304 = 1.83e-4,
        ratio approximately 2690.
    THE CONTROL THEREFORE HAS ABOUT THREE ORDERS OF MAGNITUDE OF RANGE and is
    required to fire at that magnitude. A control that merely returns a number
    proves nothing.
    (D) THE CURVE-FREE NULL AND ITS PRE-STATED CONSEQUENCE. A uniformly random
    size-B subset of Z/N with m-subset sums as decompositions, containing no curve
    arithmetic. FROZEN HERE- IF THE x-INTERVAL, x-ARITHMETIC-PROGRESSION AND
    RANDOM x-SUBSET ARMS ARE INDISTINGUISHABLE FROM IT ON COVERAGE AND DISPERSION,
    NOTHING IN THE YIELD HALF MAY BE QUOTED AS A STATEMENT ABOUT ELLIPTIC CURVES
    OR THE ECDLP; the finding is that x-windows give pseudorandom dlog subsets.
    (E) WHAT IS NOT DECIDED. RQ-ECDLP-002 in either direction; any crypto-scale
    reach; and the cost of FINDING a decomposition, which KN-FIND-007 states
    explicitly it says nothing about and which this contract also does not measure.
  inputs:
    cost_unit: >-
      COUNTS ARE INTEGERS. COVERAGE IS A PROBABILITY. DISPERSION IS
      Var(count)/mean, a dimensionless ratio of a variance to a mean OF THE SAME
      QUANTITY. THE REACH epsilon-hat = log_p(B^m) IS DIMENSIONLESS. NO
      WALL-CLOCK QUANTITY ENTERS ANY REPORTED RATIO; wall-clock is recorded for
      budget accounting only.
    unit_discipline: >-
      BINDING. Every value carries a tag in {count, probability, dimensionless,
      bits, seconds}. Cross-tag arithmetic requires a named recorded conversion.
      Coverage ratios are probability over probability; the dispersion is variance
      over mean of the same count and is never mixed with a coverage figure.
    size_matching: >-
      BLOCKING. The x-coordinate map is 2-to-1 away from 2-torsion, so a nominal
      window size is not the number of group elements it contributes. EVERY ARM IS
      MATCHED ON MEASURED SIZE - the number of distinct group elements actually in
      the base - and the nominal-to-measured gap is reported per cell. A
      nominal-size comparison is INADMISSIBLE.
    frozen_before_execution: >-
      The p ladder, the B values, the arity, the three window types, the solver
      configuration (reduction algorithm, block size, shift set), the scramble
      fractions, the seed lists, the bands [0.9, 1.1] on coverage ratio and
      [0.85, 1.20] on dispersion, and the planted-defect thresholds (coverage ratio
      below 0.01, dispersion above 10). None may change after any cell runs.
    procedure: >-
      STAGE 0 (counter ground truth, blocking). At the smallest cell, verify the
      multiset counter against brute-force exhaustive enumeration on EVERY target.
      Disagreement invalidates every count in the run and HALTS.
      STAGE 1 (identity construction check, blocking, NOT evidence). Verify the
      measured mean equals binomial(B+m-1, m)/N to floating-point error at every
      cell for every arm. A deviation is a HARNESS BUG and halts interpretation.
      Reported as a construction check and excluded from every finding.
      STAGE 2 (yield arms). At at least four p values in [2^18, 2^28] and B in
      {2^6, 2^7, 2^8} at m = 3, enumerate windowed decomposition counts over a
      declared target sample for the x-interval, x-arithmetic-progression and
      random x-subset arms, and for the CURVE-FREE random-subset-of-Z/N arm through
      the identical counter and reporting path. Record coverage and dispersion per
      cell per arm with at least 5 seeds. Attempt m = 4 only where B^m stays at or
      below 2^30.
      STAGE 3 (planted defect, blocking). The factor base taken as the multiples 0
      through B-1 of the generator. REQUIRED- coverage ratio against the
      curve-free null BELOW 0.01 and dispersion ABOVE 10 at the design cell.
      Failure invalidates every null result in the yield half.
      STAGE 4 (reach arm). Plant m windowed points, set the target to their sum,
      and ask the small-root solver to recover them. Sweep B upward to failure and
      record epsilon-hat per solver configuration. CLASSIFY every failure as
      BOUND, PRECISION or ROOT-EXTRACTION; pooling them under-reports the reach and
      is forbidden.
      STAGE 5 (reach controls). The scrambled-window null - a random size-B subset
      replacing the window - must fail at every B. Then sweep the scramble fraction
      over {0, 0.25, 0.5, 0.75, 1.0} and require monotone decay of the reach to
      zero, with the reach at 0.5 at most half its unscrambled value. Also run a
      random-polynomial null with the same Newton polytope to separate polytope
      effects from curve effects.
      STAGE 6 (planting-bias check). At the smallest cell, compare recovery rates
      on planted instances against naturally enumerated ones from stage 2. A
      difference means planting is biased and the reach numbers are withdrawn.
      STAGE 7 (report). Emit the yield table with coverage and dispersion per arm
      against the curve-free null, the planted-defect row with its computed
      thresholds, the reach table per solver configuration with failure
      classification, the scramble decay curve, the polytope null, and the
      planting-bias comparison.
    mechanism: >-
      STEP 1. ONE exact multiset counter, ONE reporting path, ONE seed list, shared
      by the three window arms, the curve-free arm and the planted arm. The
      curve-free arm replaces the group and the base-construction rule only, and
      the manifest lists shared and disjoint modules so that is checkable.
      STEP 2. Enumeration is STREAMED over the B^m multiset space rather than
      materialised, so the memory cap is respected at B^m up to 2^30.
      STEP 3. The reach arm uses a solver configuration PINNED in this contract.
      The reach is a property of that configuration; a reach quoted without its
      configuration is inadmissible.
      STEP 4. Every row is reported as (arm, p, N, m, B nominal, B measured, seed,
      targets sampled, coverage, mean count, variance, dispersion, epsilon-hat,
      failure class, scramble fraction, wall seconds), never as a scalar.
    instrument: >-
      An exact streaming enumerator plus a shift-lattice small-root module. The
      largest object is a streamed B^m enumeration of at most 2^30 entries and a
      target-count array of size N at most 2^28, held as a compact array; both fit
      the memory cap. NO GROEBNER BASIS IS BUILT in the yield half.
  controls:
    - >-
      CONTROL 1, CURVE-FREE RANDOM-SUBSET-OF-Z/N NULL (blocking for
      interpretation). A uniformly random size-B subset of Z/N with m-subset sums
      as decompositions, through the identical counter, with NO curve arithmetic.
      PRE-STATED CONSEQUENCE, FROZEN HERE- if the three window arms are
      indistinguishable from it on coverage and dispersion, NOTHING IN THE YIELD
      HALF MAY BE QUOTED AS A STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP.
    - >-
      CONTROL 2, PLANTED TRUE DLOG INTERVAL, DEFECT OF KNOWN SIZE (blocking). The
      factor base as the multiples 0 through B-1 of the generator. REQUIRED
      MAGNITUDE, COMPUTED- coverage ratio against the null BELOW 0.01, with the
      derived value about 3.7e-4 at the design cell, and dispersion ABOVE 10. IF
      IT DOES NOT FIRE AT THAT MAGNITUDE THE INSTRUMENT CANNOT SEE ADDITIVE
      STRUCTURE AND EVERY NULL RESULT IN THE YIELD HALF IS VOID.
    - >-
      CONTROL 3, EXHAUSTIVE-ENUMERATION GROUND TRUTH (blocking). The counter must
      agree with brute force on every target at the smallest cell.
    - >-
      CONTROL 4, IDENTITY CONSTRUCTION CHECK (blocking, NOT evidence). The measured
      mean must equal binomial(B+m-1, m)/N to floating-point error. This is an
      identity, so agreement proves nothing and disagreement is a bug.
    - >-
      CONTROL 5, SCRAMBLED-WINDOW NULL FOR THE REACH (blocking). Must fail to
      recover planted roots at EVERY B. If it recovers, the reach measurement is
      lattice luck rather than window structure and every reach number is void.
    - >-
      CONTROL 6, DECAY CONTROL (blocking). Scramble fraction swept 0 to 1; the
      reach must decay MONOTONICALLY to zero, at most half its unscrambled value by
      scramble fraction 0.5 and no recovery at any B at 1.0. A quantity that fails
      to decay when the parameter meant to destroy it increases is the canonical
      artifact signature.
    - >-
      CONTROL 7, RANDOM-POLYNOMIAL NULL WITH THE SAME NEWTON POLYTOPE, to separate
      polytope effects from curve effects in the reach half.
    - >-
      CONTROL 8, PLANTING-BIAS CHECK. Recovery rates on planted instances against
      naturally enumerated ones at the smallest cell. A difference withdraws the
      planted reach numbers.
  independent_variables:
    - prime p, at least four values in [2^18, 2^28]
    - factor-base size B in {2^6, 2^7, 2^8} at m = 3; at most 2^7 at m = 4
    - arity m in {3, 4}, with m = 4 only where B^m is at most 2^30
    - >-
      arm in {x-interval, x-arithmetic-progression, random x-subset, CURVE-FREE
      random Z/N subset, PLANTED true dlog interval}
    - scramble fraction in {0, 0.25, 0.5, 0.75, 1.0} for the reach half
    - solver configuration, pinned, for the reach half
  metrics:
    primary:
      - >-
        coverage ratio, window arm over curve-free random-Z/N null of the same
        measured size, per cell (dimensionless)
      - >-
        dispersion Var(count)/mean per arm per cell (dimensionless)
      - >-
        planted-root recovery threshold epsilon-hat = log_p(B^m) at failure, per
        solver configuration (dimensionless)
    secondary:
      - measured mean against binomial(B+m-1, m)/N (construction check, not evidence)
      - planted dlog-interval coverage and dispersion against their computed thresholds
      - scrambled-window recovery outcome at every B
      - reach as a function of scramble fraction (the decay curve)
      - random-polynomial same-polytope null recovery outcome
      - planted versus natural recovery rates at the smallest cell
      - nominal-to-measured base-size gap per cell
      - failure classification counts (bound, precision, root extraction)
      - wall-clock seconds per run, for budget accounting only
  heuristic_under_test: HEUR-WIN-1
  preregistered_prediction:
    quantity: >-
      Coverage and dispersion of windowed m-decomposition counts over uniform
      targets, for each window type, against a uniformly random size-B subset of
      Z/N; and the planted-root recovery threshold with its scrambled null.
    formula: >-
      coverage = 1 - exp(-mu) with mu = binomial(B+m-1, m)/N; dispersion = 1
      (Poisson). Coverage ratio against the curve-free null in [0.9, 1.1] and
      dispersion in [0.85, 1.20] for all three window arms. Planted true dlog
      interval- coverage (3B-2)/N, ratio below 0.01, dispersion above 10.
      Scrambled window- no recovery at any B.
    source: >-
      The exact mean identity of KN-FIND-007, read in full for this contract, which
      fixes the first moment and leaves only coverage and dispersion free; and the
      representation-function Poisson heuristic for random sumsets, which is the
      standard imitation and is exactly what the window arms are tested against.
      The planted-interval figures are derived in this contract by direct
      arithmetic at the design cell.
  scale_relevance:
    tier: toy
    justification: >-
      p at most 2^28, B at most 2^8 at m = 3, exact enumeration bounded by
      B^m at most 2^30. The dimensionless coverage ratio and dispersion are the
      transferable quantities in the yield half. THE REACH HALF CALIBRATES
      INSTRUMENT SHAPE ONLY. TRANSFER ASSUMPTION, STATED- HEUR-WIN-2, that planted
      decompositions are distributed like natural ones, which control 8 tests
      directly at the smallest cell rather than assuming.
    correspondence: null
  tail_checks:
    - >-
      Coverage at most min(1, mu) at every cell, the exact ceiling KN-FIND-007
      records; a measured coverage above it is a bug.
    - >-
      The coverage ratio of any structured arm against a random base bounded by the
      Sidon ceiling 1.1071 recorded in KN-FIND-007; a ratio above it indicates the
      base is not what it is labelled.
    - >-
      The maximum observed count per cell against the Poisson extreme-value
      prediction, since bulk agreement with a tail excess is the classic signature
      of clustering the mean cannot see.
  replication:
    seeds: >-
      At least 5 independent seeds per cell for the yield arms, listed explicitly
      in the run manifest before stage 2 and shared across arms so the comparison
      is paired. The reach arm declares its own seed list for the planting.
    independent_instances: 5
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 8.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
    - >-
      A cell whose enumeration would exceed B^m = 2^30 is NOT ATTEMPTED and is
      recorded as out of enumeration range, never estimated.
    - >-
      Stage 0 counter ground-truth failure HALTS the run.
    - >-
      Stage 1 identity deviation HALTS interpretation until the harness is fixed.
    - >-
      A reach cell exceeding its wall-clock budget is recorded as CENSORED with its
      budget and is an infrastructure receipt under AGENTS.md rule 5, never a
      reach failure.
    - >-
      Total wall-clock at the declared cap; remaining cells recorded as NOT
      ATTEMPTED.
  invalidation_rules:
    - >-
      The counter disagreeing with brute force at the smallest cell invalidates
      every count in the run.
    - >-
      The planted true dlog interval not firing at its computed magnitude
      invalidates every null result in the yield half.
    - >-
      The scrambled-window null recovering planted roots invalidates every reach
      number.
    - >-
      A reach figure quoted without its solver configuration is inadmissible.
    - >-
      Arms matched on nominal rather than measured size invalidate the comparison.
    - >-
      Pooling bound failures with precision or root-extraction failures invalidates
      the reach table.
  success_criterion: >-
    Stage 0 and stage 1 pass; the planted true dlog interval fires at coverage
    ratio below 0.01 and dispersion above 10; the scrambled-window null fails at
    every B; the reach decays monotonically to zero under scrambling; and the
    coverage and dispersion tables are emitted for all three window arms against
    the curve-free null at all tested cells. Success is the EXISTENCE OF THE LEDGER
    WITH ITS CONTROLS FIRING, not a particular direction.
  falsification_criterion: >-
    The interval arm coverage ratio outside [0.9, 1.1] or dispersion outside
    [0.85, 1.20] against the curve-free null, reproduced across seeds, means
    x-intervals carry additive structure the mean identity cannot see and reopens
    the yield question for boxes. The scrambled-window arm recovering planted roots
    means the reach measurement is an artifact and E1-style reach conclusions lose
    their instrument. A measured mean differing from the identity is a harness bug
    and falsifies nothing mathematical.
  required_artifacts:
    - exact command, git commit and dirty-tree state, environment and versions
    - the frozen parameter file with the p ladder, B values, arities, window types, solver configuration, scramble fractions, seeds and all bands
    - the module import list of the curve-free arm, demonstrating no curve arithmetic
    - stage 0 brute-force agreement record at the smallest cell
    - stage 1 identity check per cell, marked construction check and excluded from findings
    - per-cell raw records (arm, p, N, m, B nominal, B measured, seed, targets, coverage, mean, variance, dispersion)
    - the coverage-ratio and dispersion tables against the curve-free null, with bands evaluated
    - the planted dlog-interval row with its computed thresholds and the measured values
    - the reach table per solver configuration with epsilon-hat and failure classification
    - the scrambled-window outcome at every B and the scramble-fraction decay curve
    - the random-polynomial same-polytope null outcome
    - the planted-versus-natural recovery comparison at the smallest cell
    - not-attempted and censored cell inventory with reasons
    - stdout, stderr, timestamps, resource measurements
    - inference block- requested policy, backend, resolved model id, effort, fallback, degraded requirements
  assigned_to: executor
  approved_by: null
  limitations:
    - >-
      THE MEAN IS AN IDENTITY AND IS NOT AN OBSERVABLE OF THIS EXPERIMENT. It is
      recorded as a proof; its measurement is a construction check; NO OUTCOME ON
      IT IS AN ELLIPTIC-CURVE STATEMENT.
    - >-
      COVERAGE AND DISPERSION ARE FUNCTIONS OF THE DISCRETE-LOG MULTISET ALONE. The
      only elliptic content in the yield half is whether an x-window maps to a
      pseudorandom subset of Z/N. IF THE CURVE-FREE NULL MATCHES, NOTHING IN THAT
      HALF IS AN ELLIPTIC-CURVE OR ECDLP STATEMENT. Pre-stated so it cannot be
      renegotiated after the data.
    - >-
      TOY SCALE, p at most 2^28. THE REACH HALF CALIBRATES INSTRUMENT SHAPE ONLY AND
      MUST NEVER BE QUOTED AS A CRYPTO-SCALE epsilon. A CRYPTO-SCALE REACH IS NOT
      TESTABLE AT ANY SCALE THIS PROGRAM CAN REACH, because both the exact
      enumeration and the planting construction need an enumerable window. Stated
      rather than the claim being quietly shrunk.
    - >-
      x-coordinate 2-to-1 fibres and 2-torsion inflate counts; every arm is matched
      on MEASURED size and the nominal-to-measured gap is reported.
    - >-
      Solver failures from precision or root extraction are classified separately
      from bound failures; pooling them under-reports the reach.
    - >-
      This contract measures NOTHING about the COST of finding a decomposition,
      which KN-FIND-007 states explicitly is where the index-calculus cost sits.
    - >-
      claim_tier toy. No attack, no exponent moved, sota_delta zero. No claim about
      any curve above the tested p is licensed.
  yaml_parse_disclosure: >-
    Written by a Coordinator subagent without an interpreter. Every prose value is
    a folded block scalar; no tabs; no duplicate keys to the author reading. THIS
    AGENT COULD NOT RUN A STRICT YAML PARSE OR tools/validate_ledger.py AND DID
    NOT DO SO; the orchestrating session must run both before this contract is
    reviewed.
