experiment_id: EXP-SSI-002
title: >
  NC-2 empirical per-entry cost calibration of Algorithm 1 (Wesolowski 2026,
  frozen source SRC-P13-WESOLOWSKI-2026): a swept measurement of the true
  per-entry table-construction cost over p in 2^20..2^40 on one host, and a
  FITTED overhead exponent with error bars, controls, and a clearly labelled
  conditional extrapolation to NIST-I.
