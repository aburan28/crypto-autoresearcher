primes:
  selection_rule: >-
    For each k, p_k = the LARGEST prime strictly below 2^k with p_k congruent to 3
    modulo 4, computed in-session with Sage previous_prime and a congruence
    filter. NO PRIME WAS HARDCODED, TRANSCRIBED OR SUPPLIED ON THE COMMAND LINE.
  E0: "y^2 = x^3 + x over F_{p^2} (F = GF((p,2), modulus=[1,0,1])), j = 1728"
  supersingularity_verified_not_assumed: true
  list:
    - {log2p_target: 20, p: 1048571,       candidates_rejected: 1, E0_is_supersingular: true}
    - {log2p_target: 23, p: 8388587,       candidates_rejected: 1, E0_is_supersingular: true}
    - {log2p_target: 26, p: 67108859,      candidates_rejected: 0, E0_is_supersingular: true}
    - {log2p_target: 29, p: 536870879,     candidates_rejected: 1, E0_is_supersingular: true}
    - {log2p_target: 32, p: 4294967291,    candidates_rejected: 0, E0_is_supersingular: true}
    - {log2p_target: 35, p: 34359738319,   candidates_rejected: 1, E0_is_supersingular: true}
    - {log2p_target: 38, p: 274877906899,  candidates_rejected: 0, E0_is_supersingular: true}
    - {log2p_target: 40, p: 1099511627563, candidates_rejected: 4, E0_is_supersingular: true}
  none_stopped: true

# ---------------------------------------------------------------------------
randomness:
  sources:
    - name: starting-curve walk PRNG
      library: Python stdlib random.Random (imported as pyrandom because `from sage.all import *` shadows `random`)
      seed_derivation: "seed = int(sha256('k<NN>|<B-setting>|<variant>|<seeding>|curve<idx>').hexdigest()[:16], 16)"
      seed_label_excludes_role: >-
        deliberately, so that the CTRL-DET re-execution of a cell uses the SAME
        seeds and must reproduce entry counts, table sizes and j-invariant sets exactly
      per_cell_seeds_recorded_in: summary.json cells[].curves[].{seed_label, seed}
    - name: CTRL-COUNT spot-check sampling PRNG
      seed_derivation: "sha256('<seed_key>|spot') and sha256('<seed_key>|spotpick')"
    - name: CI-BOOT bootstrap PRNG
      library: Python stdlib random.Random
      seed: 20260731001
      resamples: 2000
      recorded_in: fit_report.json every CI_BOOT block
  no_other_source_of_randomness: >-
    Sage's global RNG is not used for any measured quantity. F_{p^2} random
    elements in CTRL-CAL are drawn once per prime for the multiplication and
    inversion operands and do not affect the reported medians.

