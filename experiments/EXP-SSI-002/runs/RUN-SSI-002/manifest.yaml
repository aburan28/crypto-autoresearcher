what_was_charged:
  statement: >-
    THE TIMED WINDOW FOR A NEIGHBOUR-EXPANSION STEP CHARGED ALL FOUR COMPONENTS,
    EACH TIMED SEPARATELY AND ALL FOUR TOTALLED. ROOT FINDING IS COUNTED. MODULAR
    POLYNOMIAL EVALUATION IS COUNTED.
  components:
    c1: "V-1: evaluating Phi_ell(j(E'), x) in F_{p^2}[x].  V-2: E'.isogenies_prime_degree(ell)."
    c2: "V-1: finding its roots in F_{p^2}.  V-2: j-invariants of the codomains."
    c3: "the non-backtracking filter, with root multiplicity handled."
    c4: "building the entry record and inserting it into the table keyed by codomain, including the hash and dedup work."
  outside_every_timed_window_and_reported_separately:
    - sage_startup_seconds
    - walk_seconds (the starting-curve random walk)
    - seed_seconds (SEED-A identity entry; SEED-B first layer)
    - phi_load_seconds and phi_generic_build_seconds (precomputation)
    - the CTRL-COUNT spot checks
  per_entry_cost_reported_twice: >-
    AMORTISED (primary; Phi retrieval excluded and reported separately) AND FULLY
    CHARGED (Phi generic build time divided across the cell's entries). BOTH FITS
    ARE REPORTED and no series shows a disjoint pair.
  memory_reported_beside_time_for_every_cell: true

