seeding_strategy_per_cell:
  statement: NO CELL IS SILENT ABOUT ITS SEEDING. Every cell record carries `seeding`.
  SEED-A: PRIMARY, used by all 32 primary-role cells and both re-execution cells. L initialised with the single identity entry; the entire first layer is charged to a timed window.
  SEED-B: VARIANT, used by exactly 2 cells (log2 p = 20 and 40, B-FIX-8, V-1). L initialised with the identity entry AND the 2-neighbours of E, computed OUTSIDE the timed window.
  seed_seconds_recorded_for_every_cell: true
  seed_seconds_inside_timed_window: false
  gap_1_statement: >-
    ALGORITHM 1 AS PUBLISHED NEVER SEEDS THE LIST AND CANNOT BE RUN. Supplying a
    seeding strategy is an implementation decision of EXP-SSI-002. IT IS NOT A
    REPAIR OF THE FROZEN TEXT, IT DOES NOT CLOSE GAP-1, AND NO ARTIFACT OF THIS
    RUN SAYS GAP-1 IS RESOLVED. GAP-1 REMAINS AN OPEN RECORDED DEFECT OF
    SRC-P13-WESOLOWSKI-2026.
  no_seed_b_slope_is_fitted: >-
    Only two primes run under SEED-B. TWO POINTS CANNOT SUPPORT A SLOPE WITH AN
    INTERVAL, SO NO SEED-B SLOPE IS REPORTED AS A FITTED EXPONENT ANYWHERE.

