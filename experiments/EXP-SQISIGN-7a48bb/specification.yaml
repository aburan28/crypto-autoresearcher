experiment:
  id: EXP-SQISIGN-7a48bb
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-SQISIGN-f40078
  question_id: RQ-SQISIGN-001
  goal_id: GOAL-SQISIGN-001
  batch_id: null
  assigned_to: executor
  title: >-
    Exact mixing-scaling measurement of the supersingular 2-isogeny graph over an
    eight-prime toy ladder, against a matched random-3-regular null and a graded
    dumbbell positive control, to decide which of three pre-registered candidate
    slopes governs the commitment-uniformity premise

  objective: >-
    If separately approved, frozen and authorized: construct the supersingular
    2-isogeny graph G_2(p) at eight declared toy primes; verify the construction
    against four exact forced values; compute total-variation distance from
    stationary EXACTLY by sparse iteration (no sampling anywhere); extract
    k_mix(n) for the simple and non-backtracking walks from two declared start
    vertices; fit k_mix against log2(n); and assign the fitted slope to exactly
    one of the three pre-registered candidates {1.0, 3.0, 5.884949} under a
    frozen +/-0.35 rule, or report that none is selected. Run the identical code
    path on a matched random-3-regular null and on a graded dumbbell family whose
    slow mixing is forced by conductance.

  what_this_is_not:
    - >-
      NOT an implementation of SQIsign, of any version. No key is generated, no
      transcript is produced, no signature is signed or verified, and no
      simulator is run.
    - >-
      NOT a statement about SQIsign. Stages 1-5 measure a graph. Any
      scheme-facing sentence is blocked behind Stage 0, which is a READING gate
      that this contract does not perform and that
      RQ-SQISIGN-001.constraints requires before any per-scheme claim.
    - >-
      NOT an attack, a key recovery, a forgery, a distinguisher against a
      deployed scheme, or any cost, exponent, asymptotic or cryptographic-scale
      claim.
    - >-
      NOT a measurement of the endomorphism-ring problem, of isogeny path
      finding, or of any KN-TECH-057 baseline. That flank belongs to
      GOAL-SSI-001 and is untouched here.
    - >-
      NOT a measurement of the F_p-rational subgraph. KN-TECH-057's conditional
      p^{1/4} row rests on an unproven mixing assumption about THAT graph; this
      contract measures the FULL supersingular graph and neither supports nor
      weakens that row.
    - >-
      NOT an audit of SQIsign's published-data surface and NOT an instantiation
      of the SIDH/Kani template. Those belong to GOAL-SQISIGN-002.
    - >-
      NOT approval, freezing, execution authorization, a run, an observed output,
      or evidence. No approved_by field is present because this contract is not
      approved.

  claim_ceiling: >-
    TIER toy, and it may not be raised by any citation of any resulting record.
    The strongest statement a valid run could support is: an empirical
    total-variation mixing scaling law for the SIMPLE and NON-BACKTRACKING walks
    on the l = 2 supersingular isogeny graph, at the eight declared primes
    (vertex counts 87 to 10927), from the two declared start vertices, in one
    instrument lineage, with its fit residual and its 36x extrapolation factor
    (7.0 measured bits of log2(n) against 252.4 bits of interest) reported beside
    every extrapolated number. It cannot support a mixing time at cryptographic
    n, anything about a union graph over several isogeny degrees, anything about
    the F_p-rational subgraph, any exponent, or any sentence containing the word
    SQIsign.

  inputs:
    primes:
      values: [1031, 2063, 4099, 8219, 16411, 32771, 65539, 131111]
      construction_rule: >-
        For b = 10..17, p_b is the SMALLEST prime >= 2^b with p_b = 3 mod 4,
        by deterministic trial division over odd candidates in increasing order.
        The listed values were computed by that rule on this machine on
        2026-08-05 and the run MUST recompute them and require exact agreement;
        a mismatch is a construction failure, not a parameter update.
      p_mod_12: [11, 11, 7, 11, 7, 11, 7, 11]
    base_curve: >-
      E_0 : y^2 = x^3 + x over F_{p^2}, supersingular for p = 3 mod 4,
      j(E_0) = 1728.
    field_model: >-
      F_{p^2} = F_p(i) with i^2 = -1, valid because p = 3 mod 4. Elements are
      pairs (u, v) of integers in [0, p). Canonical ascending order on elements
      is lexicographic on (u, v).
    isogeny_degree_l: 2
    walks: [simple_reversible, non_backtracking]
    start_vertices:
      j_1728: "the vertex j = 1728, which is the honest commitment walk's origin"
      deterministic_generic: >-
        The element of SS(p) at index floor(n/2) in canonical ascending order of
        the F_{p^2} encodings AFTER deleting j = 0 and j = 1728 from the ordered
        list. Deterministic and seed-free; no randomness selects it.
    tv_targets: [0.25, 0.01]
    max_walk_steps: 400
    stationary_weights: >-
      pi(j) proportional to w(j) = 2/|Aut(E_j)|: w = 1 generically, 1/2 at
      j = 1728, 1/3 at j = 0. |Aut| is determined by j alone (6 at j = 0, 4 at
      j = 1728, 2 otherwise) and is computed from j, never inferred from the
      graph.
    null_seeds: [1, 2, 3]
    dumbbell_cross_edges: [1, 2, 4, 8, 16, 32]
    frozen_constants:
      spectral_bound_mu: 0.9428090415820634
      spectral_bound_mu_exact: "2*sqrt(2)/3"
      log2_inv_mu: 0.08496250072115605
      log2_inv_mu_exact: "log2(3) - 3/2"
      candidate_slopes: [1.0, 3.0, 5.884949192361728]
      candidate_slope_derivations:
        - "1.0  = non-backtracking cutoff at log_{d-1}(n), d = 3 (RECALLED, UNVERIFIED)"
        - "3.0  = simple-walk cutoff at (d/(d-2))*log_{d-1}(n), d = 3 (RECALLED, UNVERIFIED)"
        - "5.884949192361728 = 0.5/(log2(3) - 1.5), the spectral-bound slope (DERIVED)"
      decision_window: 0.35
      slope_stability_window: 0.35
      dumbbell_ratio_threshold: 10
      srw_nbrw_ratio: 3.0
      srw_nbrw_ratio_window: 0.5
    master_seed: 7448110
    domain: "EXP-SQISIGN-7a48bb/v1"
    seed_derivation_rule: >-
      Every random draw in the null and control arms uses
      SHA-256( ASCII( domain || "|" || arm_label || "|" || decimal(n) || "|" ||
      decimal(seed_index) || "|" || decimal(counter) ) ), digests interpreted as
      big-endian unsigned integers, counter advancing once per digest consumed.
      arm_label is one of "null3reg", "dumbbell". THE TREATMENT ARM CONSUMES NO
      RANDOMNESS AT ALL: G_2(p), its start vertices and its walks are fully
      deterministic given p, so the treatment arm is bit-for-bit reproducible
      from p alone and this must be demonstrated by two independent runs at
      p = 1031 producing identical artifact digests.

  arms_and_controls:
    treatment: >-
      G_2(p) at each ladder prime, both walks, both start vertices. Fully
      deterministic; no seed.
    measured_null: >-
      A random 3-regular graph on exactly n vertices by the configuration model
      (reject and redraw on self-loops or multi-edges), at seeds 1, 2, 3, at
      every ladder n, run through the IDENTICAL TV, k_mix, mu_emp and fit code
      path. Matched on vertex count, degree and regularity - not merely
      "random". FORCED EXPECTATION DERIVED PRE-RUN: near-Ramanujan behaviour and
      a slope equal to the treatment's within 0.35. THIS NULL CAN FAIL IN EITHER
      DIRECTION AND BOTH FAILURES ARE REPORTABLE FINDINGS.
    positive_control: >-
      The DUMBBELL at t = 1: two independent random 3-regular graphs on
      floor(n/2) and ceil(n/2) vertices, with one edge deleted from each half and
      one cross edge inserted (repeated t times for t > 1). Slow mixing is FORCED
      by conductance: Phi ~ 2/(3n), relaxation time >= 3n/4, so k_mix grows
      LINEARLY in n. REQUIRED: k_mix(dumbbell, t = 1) / k_mix(G_2(p)) >= 10 at
      matched n. IF THIS DOES NOT FIRE, THE INSTRUMENT CANNOT DETECT SLOW MIXING
      AND NO NEGATIVE RESULT FROM ANY ARM MAY BE REPORTED.
    graded_control: >-
      The same dumbbell at t in {1, 2, 4, 8, 16, 32}: six points, four interior.
      k_mix must be monotone non-increasing in t with
      k_mix(32)/k_mix(1) <= 1/8. t is precisely the parameter meant to destroy
      the obstruction, so a k_mix that fails to fall as t rises is the canonical
      artifact tell and is pre-declared as such.
    start_vertex_control: >-
      j = 1728 versus the deterministic generic vertex on the identical graph.
      This is the only arm that maps onto the honest-versus-simulated asymmetry
      and its statistic is Delta_start.
    walk_type_control: >-
      Simple versus non-backtracking on the identical graph. Their predicted
      slope ratio of exactly 3 tests both recalled cutoff results at once
      without either being trusted individually.
    ordering_control: >-
      THE NULL ARM IS COMPUTED, FIT AND COMMITTED - with its artifact digest
      recorded - BEFORE ANY TREATMENT TV CURVE IS LOOKED AT. The frozen decision
      rule is then executed on the null's slope and the resulting candidate
      assignment is written down. If the rule assigns the same candidate to the
      null and later to the treatment, the rule discriminates nothing between
      "supersingular" and "generic expander" and the package must say so
      explicitly in its report rather than presenting the treatment assignment as
      a finding about supersingular structure.
    comparability_policy: >-
      No cross-contract comparison to any other experiment in this repository is
      permitted from this package. There are no prior SQISIGN-area experiments
      and no prior isogeny-graph spectral measurements anywhere in the corpus, so
      any comparison would be to an object of unestablished comparability. A
      comparison may be made only by a separately registered comparator contract
      naming both domains, artifacts, statistic, expected relation and failure
      disposition.

  stages_cheapest_first:
    stage_0_reading_gate:
      cost: "zero compute; reading only"
      performed_by_this_contract: false
      statement: >-
        DECLARED AND DELIBERATELY NOT PERFORMED HERE. Acquiring the SQIsign
        Round-3 specification, quoting how the commitment curve is generated and
        what the zero-knowledge argument assumes about its distribution, and
        filing KN-LIT entries is a SEPARATE reading task that
        RQ-SQISIGN-001.constraints requires before any per-scheme claim. This
        contract runs without it and produces NO scheme-facing sentence. It is
        recorded here so that a later reader cannot mistake its absence for an
        oversight, and so that the Coordinator can order it first if the
        scheme-facing interpretation is wanted.
    stage_1_instrument_gate:
      cost: "seconds to a few minutes, p = 1031 only"
      can_terminate_the_run: true
      statement: >-
        Build G_2(1031) by Velu; check the four forced values F-a..F-d. THIS IS
        THE DECISIVE CHEAP GATE AND IT RUNS FIRST. Any failure ends the package
        immediately as failed_infrastructure, never as a mathematical result.
    stage_2_treatment:
      cost: "minutes"
      statement: >-
        Exact TV curves, k_mix at both targets, and mu_emp for G_2(p) over all
        eight primes, both walks, both start vertices. No sampling.
    stage_3_null_and_positive_control:
      cost: "minutes"
      statement: >-
        Matched random-3-regular null at three seeds and the t = 1 dumbbell, at
        every ladder n, through the identical code path. Fit and commit the null
        BEFORE reading Stage 2's curves (see ordering_control).
    stage_4_graded_control:
      cost: "minutes"
      statement: "The dumbbell family at t in {1,2,4,8,16,32}; monotonicity reported."
    stage_5_fit_and_assignment:
      cost: "seconds"
      statement: >-
        Report the stability checks first (top-four refit, second TV target),
        then the SRW/NBRW ratio, then the candidate assignment under the frozen
        +/-0.35 rule, then Delta_start and its trend. In that order, so that a
        stability failure cannot be discovered after an assignment has been read.

  metrics:
    primary:
      - >-
        slope_NBRW: fitted dk_mix/dlog2(n), non-backtracking walk, G_2(p),
        start j = 1728, TV target 0.25, over all eight primes.
      - >-
        slope_SRW: the same for the simple reversible walk.
      - >-
        slope_NULL: the same for the matched random-3-regular null, per seed and
        pooled.
      - >-
        candidate_assignment: the element of {1.0, 3.0, 5.884949} within 0.35 of
        the measured slope, or the literal value "none_selected".
      - >-
        dumbbell_ratio: k_mix(dumbbell, t = 1)/k_mix(G_2(p)) at matched n.
    secondary:
      - "mu_emp per prime per arm, with the Ramanujan bound 0.9428090 beside it."
      - "The full exact TV_k curves, k = 0..400, per prime, per arm, per walk, per start vertex."
      - "k_mix at both TV targets, per prime, per arm, per walk, per start vertex."
      - "slope_stability: |top-four refit - all-eight fit| and |target 0.25 - target 0.01|."
      - "srw_nbrw_ratio and its deviation from 3.0."
      - "Delta_start per prime, and its own fitted trend against log2(n)."
      - "graded k_mix(t) for t in {1,2,4,8,16,32} and the monotonicity verdict."
      - >-
        Forced values F-a (vertex count), F-b (Eichler mass as an exact
        rational), F-c (detailed-balance residual), F-d (Velu vs Phi_2 edge
        multiset agreement), per prime.
      - "Accumulated floating-point error bound on each TV curve."
      - "Determinism check: identical artifact digests from two independent treatment runs at p = 1031."

  heuristic_under_test: HEUR-CWM-2

  preregistered_prediction:
    quantity: >-
      slope_NBRW, the fitted dk_mix/dlog2(n) of the non-backtracking walk on
      G_2(p) from j = 1728 at TV target 0.25.
    formula: >-
      k_mix(n) = a*log2(n) + b with a = 1.0. The two competing candidates and
      their derivations, all fixed before any run:
      a = 1.0 from the recalled non-backtracking cutoff at log_{d-1}(n), d = 3;
      a = 3.0 from the recalled simple-walk cutoff at (d/(d-2))*log_{d-1}(n);
      a = 0.5/(log2(3) - 1.5) = 5.884949192361728 from the DERIVED spectral bound
      TV_k <= (sqrt(n)/2)*mu^k with mu = 2*sqrt(2)/3. Assignment is to the
      nearest candidate within 0.35, else "none_selected".
    source: >-
      The spectral candidate is DERIVED IN FULL in H-SQISIGN-f40078's mechanism
      (Cauchy-Schwarz on the L^2 contraction; no citation needed and none
      asserted). The two cutoff candidates are RECALLED, UNVERIFIED - no author,
      venue, year or theorem number is asserted anywhere in this contract - and
      enter ONLY as pre-registered candidate values under test, never as
      authority.

  additional_preregistered_predictions:
    - quantity: mu_emp
      formula: "mu_emp <= 2*sqrt(2)/3 = 0.9428090415820634 at every ladder prime"
      source: >-
        Pizer's Ramanujan theorem, RECALLED, UNVERIFIED. Used as an INSTRUMENT
        CHECK: a violation means the construction is wrong, not that the theorem
        is.
    - quantity: "F-a, vertex count"
      formula: "|SS(p)| = floor(p/12) + e, e = 2 for p = 11 mod 12, e = 1 for p = 7 mod 12"
      source: "RECALLED, UNVERIFIED; re-verified by direct enumeration inside the run."
    - quantity: "F-b, Eichler mass"
      formula: "sum over supersingular E of 1/|Aut(E)| = (p-1)/24, exactly, as a rational"
      source: >-
        RECALLED, UNVERIFIED. Checked by hand at two ladder primes while writing
        H-SQISIGN-f40078: p = 1031 gives 85/2 + 1/6 + 1/4 = 42.9166666... =
        (1031-1)/24, and p = 4099 gives 341/2 + 1/4 = 170.75 = (4099-1)/24. Both
        exact.
    - quantity: "dumbbell_ratio"
      formula: ">= 10, from conductance Phi ~ 2/(3n) and relaxation time >= 1/(2*Phi) = 3n/4"
      source: "DERIVED; elementary conductance bound for a reversible chain."
    - quantity: "Delta_start"
      formula: "0 +/- 1 step, and no growth in log2(n)"
      source: >-
        No derivation exists - G_2(p) is not vertex-transitive, so this is a
        genuinely open prediction and is labelled as one. It is pre-registered so
        that a nonzero value cannot be reinterpreted after the fact.

  scale_relevance:
    tier: toy
    justification: >-
      Vertex counts 87 to 10927 against a scheme-relevant ~2^252. NOTHING
      TRANSFERS BY SCALE ALONE. The only quantity for which transfer is even
      argued is the SLOPE of k_mix against log2(n), and the argument is
      explicitly heuristic (HEUR-CWM-2): it assumes the constants fitted over 7.0
      bits of log2(n) are the constants that govern at 252.4 bits, a 36x
      extrapolation. That assumption has its own pre-registered test - the
      top-four-primes refit and the second TV target - and on failure the
      extrapolation is WITHDRAWN, not reported with a caveat. The spectral bound
      is a genuine upper bound at every n and needs no extrapolation; only the
      cutoff candidates do.
    correspondence: >-
      null. No sampling correspondence is used and none is available. The
      measurement is direct and exact on the toy objects themselves.

  tail_checks:
    - >-
      Pointwise inequality: TV_k <= (sqrt(n)/2)*mu_emp^k must hold at EVERY
      measured k and every prime, not merely on average. A violation is an
      arithmetic or construction error.
    - >-
      TV_0 = 1 - pi(v_start) exactly, at every prime and arm, checked before any
      curve is read.
    - >-
      TV_k must be non-increasing in k for the reversible simple walk. A
      non-monotone TV curve for the SRW indicates numerical error and
      invalidates that cell. (The NBRW's vertex marginal is not required to be
      monotone and any non-monotonicity there is reported, not treated as an
      error.)
    - >-
      Determinism: two independent treatment runs at p = 1031 must produce
      identical artifact digests.

  replication:
    seeds: [1, 2, 3]
    seed_scope: >-
      Seeds apply ONLY to the null and dumbbell arms. The treatment arm is
      deterministic given p and consumes no randomness; its replication is the
      digest-identity check rather than a seed sweep.
    independent_instances: 8
    planned_runs: 1
    interpretation: >-
      One future run is a design-validation attempt at toy scale. It cannot by
      itself support, reject or validate any claim about SQIsign, about any
      isogeny hard problem, or about any cost model.

  budget:
    wall_clock_seconds_per_run: 5400
    stage_1_wall_clock_seconds: 300
    total_cpu_hours: 2
    maximum_memory_gb: 4
    maximum_runs: 1
    maximum_total_disk_bytes: 2147483648
    maximum_workers: 1
    no_network: true

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, archived and authorized. It carries no approved_by field.
    - Stop immediately at Stage 1 if any of the forced values F-a..F-d fails at p = 1031.
    - Stop if mu_emp exceeds 0.9428090415820634 at any prime.
    - Stop if the pointwise inequality TV_k <= (sqrt(n)/2)*mu_emp^k fails anywhere.
    - Stop before reading any treatment curve if the null arm has not been computed, fit and digest-committed.
    - Stop at the wall-clock, CPU, memory or disk ceiling and report the ladder primes actually completed rather than failing the whole package.
    - >-
      Stop and report a truncated ladder if the largest prime cannot be
      constructed within Stage-2's share of the budget. A truncated ladder with
      five or more primes still permits a slope fit; fewer than five primes
      permits none, and the package reports the curves without a slope.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any missing forced-value record, TV curve, arm digest, or seed record.
    - Any treatment arm consuming randomness, or any failure of the p = 1031 digest-identity check.
    - Any change to the frozen constants, arms, TV targets, decision window or fit rule after any number has been observed.
    - Any candidate assignment reported before the slope-stability checks are reported.
    - Any comparison to another contract's artifacts without a separately registered comparator.
    - Any sentence in any resulting artifact that names SQIsign in an assertive claim, given that Stage 0 is not performed by this contract.

  success_criterion: >-
    This contract has NO current success outcome because it is not authorized for
    execution. If a later separately approved and frozen successor is executed,
    its only positive disposition is a complete toy-scale readout in which: all
    four forced values pass at every completed prime; mu_emp respects the
    Ramanujan bound everywhere; the pointwise TV inequality holds everywhere; the
    dumbbell positive control fires at ratio >= 10; the graded control is
    monotone with k_mix(32)/k_mix(1) <= 1/8; the null arm was committed before
    the treatment arm was read; both slope-stability checks are below 0.35; and
    the frozen decision rule returns either exactly one candidate slope or the
    literal "none_selected". That disposition establishes no attack, no cost, no
    exponent, no cryptographic-scale conclusion, and no statement about SQIsign.

  falsification_criterion: >-
    The hypothesis H-SQISIGN-f40078 is falsified as stated if slope_NBRW is not
    within 0.35 of 1.0. If it is instead within 0.35 of 3.0 or of 5.884949, that
    alternative is reported as the finding. If it is within 0.35 of none of the
    three, the reported result is "none of the three models describes this graph
    at these sizes", with the measured slope and residual attached and with
    forward guidance naming what a fourth model would have to explain - which is
    the most interesting outcome available from this contract and is NOT treated
    as a failed run.

  outcomes:
    no_execution_authorization: >-
      The only current disposition: a review_required draft. No run, no
      evidence, no mathematical inference.
    future_complete_toy_readout: >-
      Only after separate approval, freezing, authorization and valid execution.
      Scoped toy-only, to l = 2, to the full supersingular graph, and to the
      eight declared primes.
    controlled_null: >-
      slope_NULL equals slope_NBRW within 0.35. PRE-DECLARED AS A DELIVERABLE,
      NOT A FAILURE: the commitment-uniformity premise then rests on generic
      expansion and on nothing supersingular-specific, and the report MUST state
      that sentence with the measured numbers. A run that produces this and does
      not emit that sentence has not finished.
    instrument_failure: >-
      Any forced value failing, or the positive control not firing. Reported as
      INFRASTRUCTURE SIGNAL. Under AGENTS.md rule 5 this is NEVER negative
      mathematical evidence, never evidence against H-SQISIGN-f40078, and never
      evidence about SQIsign, mixing, or anything else.
    budget_exhaustion: >-
      A timeout, memory ceiling or truncated ladder is a BUDGET outcome. It is
      reported as the set of primes completed and is never a mathematical
      result. AGENTS.md rule 5.
    dependency_absence: >-
      This container has numpy 2.4.6 and no sympy, no scipy, no Sage and no PARI
      (all verified on this machine 2026-08-05). If any stage turns out to need
      one, that is an INFRASTRUCTURE REQUEST under AGENTS.md rule 3, reported as
      such, and never a negative result about the mathematics.

  required_artifacts_if_later_authorized:
    - Frozen approved specification plus a freeze receipt binding its SHA-256.
    - Per-prime construction transcript: p, the recomputed prime-selection trace, |SS(p)|, the ordered vertex list digest, the edge list digest, and the |Aut| assignment.
    - The four forced-value records F-a..F-d per prime, with F-b as an exact rational.
    - The Velu-vs-Phi_2 edge-multiset comparison, including the recalled Phi_2 coefficients actually used, so a reviewer can check them.
    - Exact TV curves for every (prime, arm, walk, start vertex) cell, k = 0..400, with the accumulated error bound.
    - mu_emp per cell with the power-iteration residual.
    - The null arm's fit and digest, timestamped BEFORE the treatment curves were read.
    - k_mix tables at both TV targets, the fits, the stability checks, and the candidate assignment, in the frozen reporting order.
    - Delta_start per prime and its trend fit.
    - The graded dumbbell table and its monotonicity verdict.
    - Manifest, environment and dependency versions, exact command, git commit and dirty-tree state, seeds, stdout, stderr, timestamps, and resource measurements.
    - Requested policy, backend, resolved model identifier, probe-verification status, reasoning effort, fallback and degraded-requirement records.
    - Snapshot archive followed by independent validation and red-team review.

  approval_requirements:
    - Independent review confirms that the four forced values, the arms, the ordering control, the frozen decision rule and the withdrawal rule for HEUR-CWM-2 are specified, reproducible and internally consistent.
    - Independent review confirms that no stage of this contract can produce a sentence about SQIsign, since Stage 0 is not performed here.
    - Coordinator separately approves and freezes a successor contract without editing this draft.
    - Separate authorization to execute after the approved frozen package is delivered.

  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved, and only the Coordinator may approve (AGENTS.md rule 1).
