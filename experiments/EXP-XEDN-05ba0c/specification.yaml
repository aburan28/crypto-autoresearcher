experiment:
  id: EXP-XEDN-05ba0c
  hypothesis_id: H-XEDN-78ab66
  derived_from_idea: IDEA-20260805-4ddf4e
  question_id: RQ-XEDN-003
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Lattice-forcing audit of the XEDN coefficient observable -- mechanical E8
    root-subsystem dichotomy, Shioda-pairing recomputation over committed
    census archives, an instrument-reach driver, a chi = 2 null family, a
    graded deg-b sweep, and the archived planted control as the primary
    positive test

  objective: >-
    THE ONE UNCERTAINTY A RUN REDUCES -- whether the XEDN lane's primary
    observable could have taken any value other than the one it took. A run
    establishes -- (i) D1, the number of committed surfaces satisfying all
    three premises on which the group-law shortest relation has infinity norm
    outside {1} and is not absent, which the dichotomy forces to zero; (ii) D2,
    the fraction of "undefined" surfaces whose recomputed root system is
    exactly A1^r; (iii) D3, the fraction of surfaces whose recomputed
    (rank, positive-root count) pair is ADE-admissible; (iv) I1, the maximum
    value the committed search function can return when driven with a synthetic
    configuration whose only relation has infinity norm 4; (v) P1, which premise
    the archived planted control violates, given that it reported a value the
    dichotomy forbids; (vi) N1, the matched synthetic null distribution; and
    (vii) R1, the number of distinct Dynkin types the proposed replacement
    observable actually exhibits. NO ATTACK, no exponent, no prime-field
    transfer, no status change, and DEC-20260724-021's forbidden-sentence list
    remains binding word for word.

  what_this_is_not:
    - >-
      Not an attack, a key recovery, or any cryptanalytic result. No exponent
      moves; Pollard rho remains the ECDLP baseline untouched.
    - >-
      Not a claim that any prior XEDN hypothesis, decision, evidence record or
      knowledge finding is false, and not a request to change any of their
      statuses. A confirmed dichotomy shows only that at the sizes reached the
      measurement could not have distinguished true from false.
    - >-
      Not a claim that the multi-section or Mordell-Weil relation-source route
      is closed, and not a claim that no lifting-based relation source exists
      over F_p(t). Those sentences are on DEC-20260724-021's forbidden list and
      no outcome of this run licenses either.
    - >-
      Not new curve generation beyond the declared graded deg-b sweep, and not
      an execution of any archived Sage implementation, which this container
      cannot run.
    - >-
      Not approval, freezing, execution authorization, a run, an observed
      output, or evidence. approved_by is null.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE -- "on the committed configurations satisfying
      squarefree recomputed discriminant, all-I1 fibres and recomputed Shioda
      height 2, the observed coefficient equals the only value the
      configuration's root system permits ([D1] violations found); and the
      committed search function returns at most [I1] when driven with a
      configuration whose only relation has infinity norm 4." WHAT DOES NOT
      FOLLOW -- that the coefficient bound of any prior hypothesis is FALSE;
      anything about surfaces with more sections than were censused; any
      exponent, solver cost, or statement about xedni calculus as an attack;
      and any claim about the uniform-measure surface family, since every
      censused surface is two-section-planted by the sampler.

  inputs:
    procedure: >-
      STAGE 0 (pure Python, minutes, zero curve compute, ORDERING CONTROL) --
      construct the 240 roots of E8 in the standard coordinate model in exact
      integer arithmetic; enumerate every root subsystem type by rank and
      positive-root count; tabulate the admissible (r, N) pairs; and verify the
      Case-O / Case-R dichotomy mechanically on synthetic saturated subsets
      including adversarially chosen ones. COMMIT AND HASH the admissible
      (r, N) table and the forced values D1 = 0, D2 = 1.00, D3 = 1.00 BEFORE
      any archived surface record is opened. If the dichotomy fails on any
      synthetic saturated subset, STOP -- the derivation is wrong and that is
      the deliverable.
      STAGE 1 (minutes) -- INSTRUMENT REACH. Read shortest_relation_group_law
      and record its coefficient bound, support bound and early-return
      behaviour; then drive it with a synthetic point set whose only relation
      has infinity norm 4 and record what it returns. Commit this result before
      Stage 2.
      STAGE 2 (under a CPU-minute, pure Python over ARCHIVED data) -- for every
      surface in the committed EXP-XEDN-005 and EXP-XEDN-007 raw results,
      recompute the discriminant and its squarefree-ness, the fibre types, the
      Shioda height of every listed slot, the Shioda Gram, the rank, the Dynkin
      type and the relation lattice; report each BESIDE the recorded naive-Gram
      rank and the recorded metric, without reconciling them.
      STAGE 3 (minutes) -- the archived planted control, recomputed in full,
      with its premise verdict.
      STAGE 4 (bounded, pure Python) -- the matched synthetic null lattices,
      the chi = 2 null family, and the graded deg-b sweep with the
      dichotomy-holding fraction per cell and its monotonicity.
      STAGE 5 (zero compute) -- assemble D1, D2, D3, I1, P1, N1, R1 and the
      forward-guidance statement naming the configuration size at which the
      metric regains content.
    instrument: >-
      Python 3.11 with numpy; NO Sage and NO sympy -- both recorded absent from
      this container in prior lane records, and their absence must be
      re-checked and RECORDED at run time rather than assumed. The frozen
      predicate module experiments/EXP-XEDN-001/xedni_sections.py is pure
      Python; its sha256 must be re-verified against the value recorded in the
      parent proposal before use, and a mismatch is a stop. E8 roots,
      discriminants, Gram matrices and relation lattices are computed in exact
      integer or rational arithmetic; no floating-point rank decision is
      admissible. Recorded through harness/runner.py.
    parameters: >-
      Committed archives -- EXP-XEDN-005 (primary), EXP-XEDN-006 and
      EXP-XEDN-007 (chi = 2 null arm). Primes 7, 13, 19, 31 as already
      censused. Graded sweep deg b in {6, 7, 8, 9, 10, 11, 12} at deg a <= 4.
      Synthetic null -- random integral lattices of rank 2 and 3 with n in
      {3, 4, 5} closest vectors, one per plus/minus pair, at least 300 draws
      per cell. Synthetic driver -- a point configuration whose only relation
      has infinity norm exactly 4. E8 constructed with all 240 roots and its
      integer Gram.
  controls:
    - >-
      ORDERING CONTROL -- the Stage-0 admissible (r, N) table, the Stage-1
      instrument-range result, and the forced values D1 = 0, D2 = 1.00,
      D3 = 1.00 are committed and hashed BEFORE any archived surface record is
      opened. A forced value fixed after seeing an archive is not a forced
      value.
    - >-
      POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR -- the
      archived EXP-XEDN-005 planted control that reported max_abs_coeff = 2.
      The dichotomy FORBIDS 2 among saturated height-2 roots at support 3, so
      this surface must be shown to violate a premise. If the recomputation
      finds squarefree discriminant, all fibres irreducible and all slots at
      height 2, then the instrument is not broken and THE DERIVATION IS, and NO
      negative statement about the lane's metric may be reported from any arm.
    - >-
      NULL OBJECT, SAME SHAPE, FORCED VALUE DERIVED PRE-RUN -- the chi = 2
      family (deg b = 10, deg a <= 2) already committed in EXP-XEDN-006 and
      -007. There the minimal integral-section height is 4 and the E8 root
      argument DOES NOT APPLY, so the recomputed Shioda diagonal must be 4 and
      the (rank, count) pairs must NOT be constrained to the ADE table. If the
      null family behaves identically to the chi = 1 family, the audit is
      detecting a property of the code rather than of the surfaces and NO
      conclusion may be drawn about either.
    - >-
      GRADED CONTROL with at least 3 interior points and monotonicity reported
      -- deg b swept over {6,...,12} at fixed deg a <= 4. The
      dichotomy-holding fraction must be 1.00 at deg b = 6 and must FALL AWAY
      above it. A fraction flat at 1.00 across the whole sweep is the canonical
      artifact tell and the audit reports an artifact and stops.
    - >-
      MATCHED SYNTHETIC NULL -- random integral lattices with no elliptic curve
      behind them, at least 300 draws per (rank, n) cell. If the null's
      shortest-relation distribution matches the archive's, the observable does
      not identify the elliptic-surface geometry. If it differs materially, the
      observation-collision claim is WRONG and the lane's original conclusion
      is rescued.
    - >-
      INSTRUMENT-REACH DRIVER -- a synthetic point set whose only relation has
      infinity norm exactly 4, fed to the committed search function. It must
      return None or fall through to the Gram path, never 4.
    - >-
      SATURATION CHECK -- for every observed pair with recomputed Shioda inner
      product -1, form the sum in the group law over F_p(t) and check
      membership in the observed slot list. A single failure refutes saturation
      and localises the error.
    - >-
      ARCHIVE CHECK, ZERO COMPUTE -- enumerate every prior measurement of this
      observable in the corpus and state what each did with it. The absence of
      a derivation in any of them is REPORTED AS AN ABSENCE, never claimed as a
      passed check.

  independent_variables:
    - prime p
    - "deg b (the graded sweep, hence chi)"
    - deg a
    - "premise status (squarefree discriminant / all-I1 fibres / all slots at height 2)"
    - "object class (censused surface / planted control / synthetic lattice / synthetic driver)"
    - "pairing used (recorded naive-degree Gram versus recomputed Shioda Gram)"

  metrics:
    primary:
      - >-
        D1 forced_dichotomy_violation_count -- number of censused surfaces with
        squarefree recomputed discriminant, all slots at recomputed Shioda
        height 2, and a group-law-verified shortest relation whose infinity
        norm is neither 1 nor absent. Unit -- dimensionless count. Forced
        value 0.
      - >-
        D2 case_O_identification_rate -- fraction of surfaces reporting an
        undefined metric whose recomputed root system is exactly A1^r, i.e.
        pairwise orthogonal with N = r. Unit -- fraction. Forced value 1.00.
      - >-
        D3 ade_admissibility_rate -- fraction of pure-stratum surfaces whose
        recomputed (rank, positive-root count) pair appears in the Stage-0
        admissible table. Unit -- fraction. Forced value 1.00.
      - >-
        I1 instrument_max_returnable_value -- the value the committed
        shortest_relation_group_law returns on the synthetic
        infinity-norm-4 driver. Unit -- integer or None. Must not be 4.
      - >-
        P1 planted_control_premise_verdict -- for the archived planted control,
        the recomputed (discriminant squarefree flag, fibre type multiset,
        per-slot Shioda height). Unit -- categorical. At least one premise must
        be violated.
      - >-
        R1 dynkin_type_spread -- number of DISTINCT Dynkin types among the
        recomputed root systems across the census. Unit -- dimensionless count.
        Required at least 4 for the constructive half to succeed.
    secondary:
      - >-
        N1 matched-null distribution of shortest-relation infinity norm, per
        (rank, n) cell, reported in full rather than as a single fraction
      - the Stage-0 240-root E8 construction with its integer Gram and the admissible (r, N) table, both hashed
      - per-surface recomputed discriminant, squarefree flag, fibre type multiset, per-slot Shioda height, Shioda Gram, rank, Dynkin type, relation-lattice basis
      - the recorded naive-Gram rank and recorded metric BESIDE the recomputed ones, per surface, unreconciled
      - the chi = 2 null arm's Shioda diagonal and (rank, count) admissibility rate
      - the graded deg-b sweep's dichotomy-holding fraction per cell and its monotonicity
      - saturation-check failures (pairs whose group-law sum is not in the slot list)
      - a recorded check of whether sage and sympy import, and the re-verified sha256 of the frozen predicate module

  heuristic_under_test: HEUR-X3-1
  preregistered_prediction:
    quantity: >-
      D1 = 0, D2 = 1.00, D3 = 1.00 on the pure-root stratum; I1 not equal to 4;
      P1 shows at least one violated premise on the planted control; R1 >= 4.
    formula: >-
      D1 := |{surfaces : disc squarefree AND all heights = 2 AND group-law
      shortest relation has infinity norm not in {1} and is not absent}|.
      D2 := |{undefined-metric surfaces with N = r}| / |{undefined-metric
      surfaces}|. D3 := |{surfaces whose (r, N) is in the Stage-0 admissible
      table}| / |{pure-stratum surfaces}|. Under the NULL that the observable
      carries information about p, deg a or the surface, D1 would be nonzero
      somewhere in the census, because a metric free to move would sometimes
      move.
    source: >-
      Pre-registered in IDEA-20260805-4ddf4e (predictions
      forced_dichotomy_violation_count, case_O_identification_rate,
      ade_admissibility_rate, instrument_reachability,
      planted_control_explanation, dynkin_type_spread) and restated as D1-D3,
      I1, P1, R1 in H-XEDN-78ab66 before any run under this contract exists.
      THE PARENT PROPOSAL'S SCOUT-COMPUTED PILOT NUMBERS FOR THE SYNTHETIC NULL
      ARE DELIBERATELY NOT PRE-REGISTERED AS THRESHOLDS HERE, because that
      pilot ran outside the harness and is not citable; N1 is reported as a
      measured distribution instead.

  scale_relevance:
    tier: toy
    justification: >-
      Executed over committed toy-scale census archives at p in {7,13,19,31}
      and over synthetic lattices with no curve behind them. The E8 dichotomy
      itself is not a scale-dependent statement -- it is an algebraic
      consequence of three premises, and the experiment's job is to check the
      premises SURFACE BY SURFACE rather than to reach larger parameters. THE
      TRANSFER ASSUMPTION IS STATED AND IS NARROW -- nothing here transfers
      beyond the tested configuration sizes, beyond toy primes, or to any
      prime-field ECDLP cost statement, and no downstream citation may raise
      the tier. The census surfaces are two-section-planted by the sampler, so
      no statement about the uniform-measure family is available at any scale.
    correspondence: null

  tail_checks:
    - >-
      Report every surface whose recomputed (rank, N) pair is NOT
      ADE-admissible, individually, since under the derivation each must be a
      naive-Gram rank artifact and a residue that is not would refute the
      derivation.
    - >-
      Report every saturation-check failure individually rather than as a rate,
      since a single failure localises the error to the height-to-degree
      correspondence.
    - >-
      Report the largest recomputed Shioda height observed on the chi = 1 arm;
      a value above 2 means the pure-stratum filter is admitting non-roots.
    - >-
      Report the number of censused surfaces EXCLUDED from the pure stratum and
      why, so a small D1 cannot be produced by a large exclusion.
    - >-
      Report the deg-b sweep cell by cell, never averaged, so the required
      fall-away is visible rather than smoothed.

  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
    note: >-
      Seeds govern only the synthetic null lattice draws and the graded sweep's
      surface generation. The E8 construction, the archive recomputation, the
      instrument-reach driver and the planted-control verdict are DETERMINISTIC
      and must be identical across seeds; any seed-to-seed difference there is
      an implementation defect, not variance.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 2.0
    maximum_memory_gb: 4
    maximum_runs: 6

  stopping_rules:
    - >-
      STOP AT STAGE 0 if the dichotomy fails on any synthetic saturated root
      subset. The derivation is wrong and that is the deliverable; no archive
      is opened.
    - >-
      STOP reporting any negative statement about the lane's metric if the
      planted control satisfies every premise while reporting 2. The
      deliverable becomes the refutation of the derivation.
    - >-
      STOP if the frozen predicate module's sha256 does not match the value
      recorded in the parent proposal. The enumeration side is not the one that
      was censused and nothing is comparable.
    - >-
      Stop at the declared archives and the declared deg-b sweep. New primes or
      new families are a different experiment and require a new contract.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
      exhaustion is a stop, never a negative result (AGENTS.md rule 5).

  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or missing-dependency failure makes
      the run failed_infrastructure and is NEVER negative mathematical evidence
      (AGENTS.md rule 5). In particular the absence of Sage is an
      infrastructure fact, not a result.
    - >-
      A run whose chi = 2 null arm or matched synthetic null was not executed
      in the same invocation as the signal arm is invalid_measurement.
    - >-
      A run that reports a recomputed rank against a recorded naive rank as if
      the difference were a finding, rather than reporting both, is
      completed_invalid.
    - >-
      A run whose Stage-0 forced values or admissible (r, N) table were
      committed AFTER any archived surface record was opened is
      completed_invalid; the ordering control is the whole basis of the forced
      values.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT
      experiment and requires a new contract.

  success_criterion: >-
    The run is SUCCESSFUL as a measurement when -- (a) Stage 0 completed, the
    dichotomy held on every synthetic saturated subset, and the admissible
    (r, N) table and forced values were hashed before any archive was opened;
    (b) I1 is reported from the synthetic driver; (c) every censused surface in
    the declared archives was recomputed under the Shioda pairing and its
    recomputed and recorded quantities are reported side by side; (d) the
    planted-control verdict P1 is reported; and (e) the chi = 2 null arm, the
    matched synthetic null and the graded deg-b sweep were all executed in the
    same invocation. CLAIM D is SUPPORTED at toy tier if, in addition, D1 = 0,
    D2 = 1.00 and D3 = 1.00 on the pure-root stratum, the chi = 2 arm behaves
    DIFFERENTLY, and the graded sweep's dichotomy-holding fraction falls away
    above deg b = 6. CLAIM I is SUPPORTED if I1 is not 4 and the read code
    bounds confirm it.

  falsification_criterion:
    - >-
      D1 >= 1 -- a censused surface with squarefree recomputed discriminant,
      all slots at recomputed height 2, and a group-law-verified shortest
      relation of infinity norm >= 2. CLAIM D IS FALSE; the surface is archived
      verbatim as the counterexample certificate and the hypothesis is
      withdrawn by a superseding record.
    - >-
      I1 = 4 -- the committed search returns 4 on the synthetic driver. CLAIM I
      IS FALSE and is withdrawn independently of Claim D.
    - >-
      The planted control satisfies every premise while reporting 2. The
      instrument is not broken and the derivation is; NO negative statement
      about the lane's metric may be reported from any arm.
    - >-
      The chi = 2 null arm reproduces the chi = 1 behaviour exactly, or the
      graded sweep's dichotomy-holding fraction stays at 1.00 across all
      deg b. ARTIFACT -- the recomputation is measuring the pipeline and
      neither claim is supported.
    - >-
      Stage 0 finds a saturated root set with N > r and no infinity-norm-1
      relation. The elementary argument is wrong; the line ends before any
      archive is opened.
    - >-
      A saturation-check failure -- a group-law sum of two observed roots with
      recomputed inner product -1 that is not in the observed slot list. The
      third premise fails and the dichotomy does not apply to that surface.
    - >-
      R1 < 4 distinct Dynkin types. The proposed replacement observable has no
      more comparator spread than the one it replaces; the constructive half
      FAILS and is reported as failed.
    - >-
      The matched synthetic null's distribution differs materially from the
      archive's. The observation-collision claim is wrong and the lane's
      original conclusion is rescued.

  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
    - raw-result.json carrying every per-surface recomputation, not summaries
    - the Stage-0 240-root E8 construction, its integer Gram and the admissible (r, N) table, hashed, with the commit timestamp preceding any archive read
    - the Stage-1 instrument-reach result with the synthetic driver configuration recorded verbatim
    - the chi = 2 null arm, the matched synthetic null and the graded deg-b sweep, in the same file as the signal arm
    - the planted-control recomputation with its premise verdict
    - the recorded naive-Gram rank and recorded metric beside every recomputed value, unreconciled
    - the full data of any surface violating a forced value, archived verbatim as a counterexample certificate
    - a recorded check of whether sage and sympy import, and the re-verified sha256 of experiments/EXP-XEDN-001/xedni_sections.py

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution. This contract is
      review_required and is NOT approved; approved_by is null and
      execution_authorized is false (AGENTS.md rule 1). Approval is the user's
      gate because it authorizes execution and spends compute.
    - >-
      The parent proposal is proof-oriented; the filled proof_search_map is
      carried in H-XEDN-78ab66 (and the parent notes a sibling map in
      H-XEDN-906489) and must be audited before implementation (KN-TECH-080).
    - >-
      The Stage-0 admissible table and the forced values must be committed and
      hashed BEFORE any archived surface record is opened. This ordering is not
      a nicety; without it none of D1, D2, D3 is a forced value.
    - >-
      This experiment reads committed artifacts of EXP-XEDN-005/006/007 but
      changes NO status of any XEDN record. A Coordinator must confirm that no
      approval here is read as re-opening GOAL-XEDN-001/002/003.

  derivation_provenance:
    tool: coordinator-subagent design pass
    source_record: IDEA-20260805-4ddf4e
    authored_at: '2026-08-25'
    note: >-
      Metrics D1-D3, I1, P1, N1 and R1, the four controls and the criteria
      render the parent proposal's six predictions and its minimal_test
      controls into quantities decidable from a recorded number. The parent's
      SCOUT-COMPUTED pilot fractions for the synthetic null are deliberately
      NOT imported as thresholds, because that pilot ran outside the harness
      and the parent record says so. Budgets come from the parent's declared
      estimated_cost (implementation low, compute very low) with headroom for
      the graded sweep. No field is invented; unsupplied values are listed in
      derivation_gaps.

  derivation_gaps:
    - >-
      The exact Shioda intersection convention needed to build the Gram is
      stated in DEC-20260724-021's next_actions but has never been implemented
      in this repository. The executor must write it from that decision's
      committed text and record which convention was used; two different
      conventions would produce two different ranks for reasons unrelated to
      the mathematics.
    - >-
      Steps (1) and (2) of the mechanism rest on RECALLED Shioda theory. Stage
      1 must either obtain a primary source or replace the recalled statements
      with an in-repo derivation and SAY WHICH IT DID. A recalled theorem that
      cannot be sourced is carried as HEUR-X3-2 with its own falsification
      condition, never as a fact.
    - >-
      The matched-null lattice construction (how ranks, minima and ball radii
      are drawn) is described but not fully specified. It must be frozen before
      the run, since a null whose spread is tuned after seeing the archive is
      not a null.
    - >-
      The graded deg-b sweep requires new surface generation, which the parent
      proposal budgets as "bounded minutes" without specifying a surface count.
      A Coordinator must fix the count before approval; an unbounded sweep has
      no completion gate.
    - >-
      Whether the archived planted control's recorded specialisation check can
      be re-run in this container is unknown, since the original ran under
      Sage. If it cannot, the premise verdict rests on the recomputed
      discriminant, fibre types and heights alone, and the run must say so
      rather than implying the specialisation was re-verified.
