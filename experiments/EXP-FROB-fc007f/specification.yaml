experiment:
  id: EXP-FROB-fc007f
  hypothesis_id: H-FROB-ad36e7
  source_idea: IDEA-20261017-fd3924
  question_id: RQ-FROB-7d8dd4
  goal_id: GOAL-FROB-6333a9
  version: 1
  title: 'Normal-basis window V_nb versus V_poly at matched (n, m, k) on toy Koblitz curves: paired WDSat UNSAT
    conflict ratio R in -b and XG-ext modes, closure degree D_W over D in {3,4,5}, with V_rand and N0 controls and
    the pilot yield accounting recomputed'
  experiment_class: cost-model-measurement
  status: review_required
  frozen: false
  designed_at: '2026-10-17'
  designed_under_task: TASK-20261017-a62974
  approved_by: null
  approval_decision: null
  execution_authorized: false
  status_note: >-
    review_required, not approved (AGENTS.md "Approval is bounded by execution"): no launcher could be bound and
    smoke-tested in the design session. Missing before approval: (1) implementation/run.py and check.py binding the
    tau_fb_pilot.py builders (analysis/ecdlp2m-iteration-20261009/tau-factor-base-pilot/), the m4-sat-cost pilot
    WDSat exporter (wdsat_io.py) with the vendored WDSat at
    experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/builds/wdsat_987b7f5ef9, and the EXP-SEMBIN-d9767f closure
    implementation (independent eliminator), all sha256-bound; (2) a second enumerator sharing no code with the
    pilot's meet-in-the-middle; (3) trial-plan.json for RUN-FROB-2458d5, RUN-FROB-9f5468, RUN-FROB-b689bc,
    RUN-FROB-e8aa02; (4) runbook.yaml with session RBS-FROB-fc007f, LINT OK; (5) lane BATCH-245929 under
    GOAL-FROB-6333a9 with its dispatch queue; (6) tools/experiment_preapproval.py approvable true. Predictions,
    controls, falsification conditions and H1-H3 are copied from IDEA-20261017-fd3924 without adjustment; where the
    design memo differed (falsification at half the cells vs over 10% for D_W; single -b mode vs both modes; the
    random-subspace prediction) the idea wins and the difference is noted. The tau factor-base pilot is
    exploratory provenance only.
  objective: >-
    For each of 20 toy Koblitz cells (n in {11,13,17,19,23}, m in {2,3}, k in {k0, k0+1}), build the descended
    S_(m+1) decomposition system over V_poly, V_nb (three random normal elements, plus an optimal normal basis at n
    = 11 and 23), V_rand and the N0 re-encoding for the same targets; certify UNSAT by two independent enumerators;
    measure paired WDSat conflicts in -b and XG-ext modes and the minimal refuting mutant-closure degree D_W over D
    in {3,4,5} with columns at D_W; recompute the pilot's orbit shrink g and usable conjugates on the same V; and
    report R, D_W equality, the E1/E2/E3 discriminant and B_net per cell. The experiment prices a constant factor;
    it measures no cost against rho and claims no speedup.
  inputs:
    implementation_sources:
      sha256_binding: to-be-bound-at-approval
      note: 'No file is bound yet; the list is the design memo''s and the idea''s. Digests are recorded here and in
        the trial plan at approval, never invented.'
      from_tau_factor_base_pilot:
        root: analysis/ecdlp2m-iteration-20261009/tau-factor-base-pilot/
        files: [tau_fb_pilot.py, aggregate.py]
        role: field, Koblitz curves, factor bases V_poly / V_nb / V_orb, exhaustive meet-in-the-middle decomposition
          (enumerator 1), orbit and usable-conjugate accounting
      from_m4_sat_cost_pilot:
        root: analysis/ecdlp2m-iteration-20261009/m4-sat-cost-pilot/
        files: [wdsat_io.py, wdsat_source_sha256.txt]
        role: ANF exporter with the counters and complete symmetry patches
      from_exp_sembin_d9767f:
        root: experiments/EXP-SEMBIN-d9767f/implementation/
        files: [myclosure.c, pilot2_lib.py, vendor/boolsys.py]
        role: mutant closure W_D (independent eliminator) and Boolean system builder for D_W, columns and first
          refuting iteration
      anf_emitter:
        path: analysis/frobenius-orbit-union/emit_anf.py
        role: descended ANF emitter named by the IDEA minimal_test; binding to be decided against wdsat_io.py at
          approval
      wdsat:
        path: experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/builds/wdsat_987b7f5ef9
        role: vendored WDSat source; modes -b (complete symmetry-pruned) and XG-ext
      new:
      - path: experiments/EXP-FROB-fc007f/implementation/run.py
        role: trial driver (not written)
      - path: experiments/EXP-FROB-fc007f/implementation/check.py
        role: independent checker (not written)
      - path: experiments/EXP-FROB-fc007f/implementation/enum2.py
        role: second enumerator sharing no code with tau_fb_pilot.py (not written)
    curves:
      family: 'Koblitz y^2+xy=x^3+a x^2+1 over F_(2^n), n in {11,13,17,19,23}, a chosen so #E = h r with r prime (h = 2
        for a = 1, h = 4 for a = 0); order by the Koblitz trace recursion checked against point count'
      table_source: tau-factor-base-pilot README (n=11 a=1 r=991; n=13 a=0 r=2003; n=17 a=1 r=65587; n=19 a=0
        r=130873; n=23 a=0 r=2095853), exploratory provenance
    cells:
      rule: 'm in {2,3}; k in {k0, k0+1}, k0 = ceil(n/m); 20 cells'
      list:
      - {n: 11, m: 2, k: [6, 7]}
      - {n: 13, m: 2, k: [7, 8]}
      - {n: 17, m: 2, k: [9, 10]}
      - {n: 19, m: 2, k: [10, 11]}
      - {n: 23, m: 2, k: [12, 13]}
      - {n: 11, m: 3, k: [4, 5]}
      - {n: 13, m: 3, k: [5, 6]}
      - {n: 17, m: 3, k: [6, 7]}
      - {n: 19, m: 3, k: [7, 8]}
      - {n: 23, m: 3, k: [8, 9], note: k = 9 may be dropped for cost and is then a recorded scope reduction}
      source: IDEA-20261017-fd3924 claim and notes section 3; k values computed here from k0 = ceil(n/m)
    arms:
      V_poly: '{x : deg x < k} in the polynomial basis'
      V_nb: 'span of k consecutive conjugates of a normal element; 3 random normal elements per cell, plus an
        optimal normal basis stratum at n = 11 and 23 (existence checked by the executor, fallback random)'
      V_rand: size-matched random k-dimensional F_2-subspace, fixed seed
      N0: V_poly re-encoded in a random field basis (noise-floor control; R must be 1 in closure)
      source: IDEA-20261017-fd3924 minimal_test and controls
    targets:
      rule: 'targets x_R in the order-r subgroup, the same x_R across arms, until 20 are certified UNSAT for every arm
        by two independent enumerators; up to 2,000 targets drawn, a short cell recorded rather than the 20 relaxed;
        SAT instances recorded separately, never fitted'
      planted: planted decomposable targets per cell, which every arm must find (control)
      source: IDEA-20261017-fd3924 minimal_test; notes section 3
    solver:
      wdsat_modes: ['-b (complete symmetry-pruned configuration)', 'XG-ext']
      per_instance_limits: '600 s / 2 GB; censored rows reported, never imputed'
      source: IDEA-20261017-fd3924 (both modes, since EV-FROB-b6e1e9 observed XG-ext cuts the baseline 69x-220x);
        design memo
    closure:
      degrees: [3, 4, 5]
      records: 'D_W = min{D : 1 in W_D}, columns at D_W, first refuting iteration'
      eliminator: independent bit-packed eliminator (myclosure.c) of EXP-SEMBIN-d9767f
      source: IDEA-20261017-fd3924 minimal_test and notes 1.4
    yield_accounting:
      records: orbits, g, usable conjugates per relation, eff against lambda = C(|FB|, m)/r, recomputed on the same
        V (pilot accounting)
      role: secondary; B_net = log2(g_nb/g_poly) - log2(R)
  controls:
  - id: N0
    name: V_poly re-encoded in a random field basis
    check: 'R(N0/poly) = 1 in closure (identical D_W and columns); WDSat ratio spread per cell <= 1.4 in both modes'
    role: 'Prop. B re-tested as a control: a basis change alone moves no closure; the WDSat spread is the noise
      floor against which R is read'
    provenance: IDEA-20261017-fd3924 control N0
  - id: C-RAND
    name: size-matched random k-dim subspace
    check: 'R(rand/poly) per cell and mode reported; |log2 R(nb) - log2 R(rand)| per cell (P3)'
    role: separates E2 (product-space effect) from E3 (window structure)
    provenance: IDEA-20261017-fd3924 control V_rand
  - id: C-PLANT
    name: planted decomposable targets
    check: every planted target is found (SAT with a curve-verified model) by every arm in both modes
    role: soundness of the exporter and of each arm's factor base
    provenance: IDEA-20261017-fd3924 control 3
  - id: C-ENUM
    name: two independent enumerators
    check: the pilot meet-in-the-middle and the second implementation agree on the label of every target in every
      arm
    role: labels are ground truth only when both agree; a disagreement voids the instance
    provenance: IDEA notes section 3
  - id: C-G
    name: pilot input reproduced
    check: 'g_nb in [1.6, 2.4] on the recomputed accounting; eff within 0.1 bit of 1 where the base holds more than a
      handful of orbits'
    role: the 0.6-0.8 bit figure this experiment prices against is reproduced on the same instances
    provenance: IDEA falsification condition 4; tau pilot README facts 2 and 4 (exploratory)
  independent_variables:
  - n in {11, 13, 17, 19, 23}
  - m in {2, 3}
  - k in {k0, k0+1}
  - arm in {poly, nb_1, nb_2, nb_3, onb (n = 11, 23), rand, n0}
  - WDSat mode in {b, xg}
  - closure degree D in {3, 4, 5}
  metrics:
    primary:
    - name: R per cell and mode
      pointer: 'median over targets UNSAT in both arms of log2(/rows[arm == nb*]/conflicts) - log2(/rows[arm ==
        poly]/conflicts) at equal (instance_id, mode), exponentiated; bootstrap CI; from /rows[] with label ==
        UNSAT, censored == false; /pairs[] carries the per-cell summary'
      prediction: P1
    - name: D_W equality per cell
      pointer: '/closure[]/D_W for arm nb* against arm poly at equal instance_id; share of cells with equality;
        /closure[]/cols_at_DW ratio nb/poly'
      prediction: P2
    secondary:
    - name: E2/E3 discriminant
      pointer: 'abs(log2 R(nb) - log2 R(rand)) per cell from /pairs[]'
      prediction: P3
    - name: B_net
      pointer: 'log2(/yield[arm == nb]/g / /yield[arm == poly]/g) - log2 R per cell'
      prediction: P4
    - name: N0 spread
      pointer: '/pairs[arm == n0]/ratio_median and its CI per cell and mode; /closure[] equality for n0 vs poly'
      prediction: N0
    - name: planted-target recovery
      pointer: '/rows[] with planted == true: label == SAT and model_verified == true for every arm'
      prediction: C-PLANT
    - name: pilot accounting
      pointer: '/yield[]/orbits, /g, /usable_conjugates, /eff, /fb_size per arm'
      prediction: C-G (g_nb in [1.6, 2.4])
    - name: per-row cost fields
      pointer: '/rows[]/conflicts, /wall_s, /censored, /solver_sha; /closure[]/cols, /rows_count, /iterations,
        /first_refuting_iteration, /wall_s, /peak_rss_mb'
      prediction: none (descriptive)
    - name: SAT-instance costs
      pointer: '/rows[] with label == SAT, listed per cell, never fitted'
      prediction: none
  preregistered_predictions:
  - id: P1
    claim: E1 (cost depends on (n,m,k) only)
    test: 'R, median paired conflicts(V_nb)/conflicts(V_poly), WDSat -b and XG-ext, in [0.7, 1.4] in 90% of 20
      cells; outside refutes E1'
    source: IDEA-20261017-fd3924 prediction 1
  - id: P2
    claim: V_nb is free in closure
    test: 'D_W equal in 90% of cells (4 at m=3, handoff figure); columns ratio in [0.5, 2]'
    source: IDEA-20261017-fd3924 prediction 2 (memo had D_W identical only; idea wins)
  - id: P3
    claim: E3 versus E2
    test: 'abs(log2 R(nb) - log2 R(rand)) below 0.5 bit separates E3 from E2'
    source: IDEA-20261017-fd3924 prediction 3 (memo had R(rand) in [0.7,1.4]; idea wins)
  - id: P4
    claim: net gain against V_poly
    test: 'B_net mean 0.5-0.9 bit at R near 1; at most 0 if R is 2 or more'
    source: IDEA-20261017-fd3924 prediction 4
  preregistered_prediction:
    quantity: R per cell and mode; D_W and columns per arm; B_net
    formula: 'conflicts = c * 2^(mk) / |G| with c in [0.9, 1.0] for every V (H1), hence R = 1; B_net = log2(g_nb/g_poly)
      - log2(R) with g_nb -> 2 and g_poly about 1.05'
    source: IDEA-20261017-fd3924 heuristic H1 (Prop. B, IDEA-20260926-917981; exhaustive-core law,
      IDEA-20260915-0d8e90) and notes section 2
  heuristic_under_test: H1
  heuristic_validation:
    heuristic: >-
      H1 (verbatim from IDEA-20261017-fd3924): UNSAT cost depends on (n,m,k) and the shape of V, not the basis:
      conflicts = c * 2^(mk) / |G|, c in [0.9,1.0] for every V. Quantifiers as tested: for every cell and every arm
      (poly, nb, rand, n0) the median over >= 20 certified UNSAT targets of WDSat conflicts in the complete
      symmetry-pruned mode equals c * 2^(mk) / |G| with c in [0.9, 1.0].
    source: IDEA-20261017-fd3924
    rigorous_support: Prop. B (a basis change is a ring automorphism) and the exhaustive-core law (uniform visit of
      all 2^(mk) leaves)
    operationalization: c fitted per arm per cell from the median conflicts and the known 2^(mk)/|G|; R is the
      arm ratio; D_W and columns are read from the closure arm
    what_is_uniform: nothing is assumed uniform; the comparison objects are V_rand (generic subspace of the same
      dimension) and N0 (same set V, different basis)
    scale_access: toy scale only (n <= 23, m in {2,3}); no correspondence reaches a larger scale and no transfer to
      n = 131 is claimed
    sample_size_justification: >-
      20 UNSAT-for-all-arms targets per cell (IDEA minimal_test) paired by target, so R is a median of 20 paired
      log-ratios per cell and mode; with 20 cells the 90% criterion tolerates two failing cells. Conflict counts are
      deterministic per instance. At cells with decomposition probability near 0.6-0.9 (pilot: n = 17, m = 3, k =
      8 about 0.99) most targets are SAT, so up to 2,000 targets are drawn and a short cell is recorded (IDEA notes
      section 3).
    comparison_metric: R per cell and mode against [0.7, 1.4]; D_W equality share against 90%; columns ratio against
      [0.5, 2]; |log2 R(nb) - log2 R(rand)| against 0.5 bit; N0 spread against 1.4
    tail_checks_available: worst target per cell per arm (H1 validation plan); every censored row listed; per-cell
      CI reported, never pooled across modes
    controls_for_heuristic: N0, C-RAND, C-PLANT, C-ENUM, C-G above
  scale_relevance:
    tier: toy
    justification: 'n in {11,13,17,19,23}, m in {2,3}; nothing at n = 131; the whole Frobenius lever is at most
      log2(131) = 7.03 bits (orbit union) and this prices about 0.76 bit of it; no exponent moves'
    correspondence: null
  tail_checks:
  - worst (maximum) conflict target per cell and arm reported beside the median
  - every censored row listed with its cell, arm, mode and limit hit
  - per-cell R reported separately for -b and XG-ext; a result that holds in one mode only is reported as such
  - D_W distribution per arm reported over D in {3,4,5} with not_refuted_at_5 listed
  replication:
    seeds: []
    seed_rule: to be fixed in the trial plan (one seed per trial; normal-element and V_rand draws seeded per cell)
    independent_instances: 4
    trials:
    - trial_id: m2-all
      run_id: RUN-FROB-2458d5
      content: m=2, all n, k0 and k0+1, all arms, both modes
    - trial_id: m3-small-n
      run_id: RUN-FROB-9f5468
      content: m=3, n <= 17, all arms, both modes
    - trial_id: m3-large-n
      run_id: RUN-FROB-b689bc
      content: m=3, n in {19, 23}, all arms, both modes
    - trial_id: closure-and-controls
      run_id: RUN-FROB-e8aa02
      content: closure-degree arm (D in {3,4,5}) on the certified instances of the other trials; N0, planted
        targets, pilot accounting
    replication_note: three normal elements per cell are the within-cell replication of the V_nb arm; conflict counts
      are deterministic
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 28800
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1
    note: 'machine protection only: one solver process; 600 s / 2 GB per instance (censoring, not a result);
      about 10 CPU hours expected, dominated by n = 23, m = 3, k = 9 (IDEA estimated_cost; design memo); not a
      research budget'
  stopping_rules:
  - Stop a trial when every cell of its plan has 20 UNSAT-for-all-arms targets run under both modes (and D in
    {3,4,5} for the closure trial), or 2,000 targets have been drawn with fewer (recorded as a short cell).
  - A row exceeding 600 s or 2 GB is censored and recorded; the cell continues; censored rows are listed, never
    imputed.
  - The k = 9 cell at n = 23, m = 3 may be dropped for cost; the drop is recorded as a scope reduction, not a result.
  - Stop after the four planned trials have checker-validated outputs; no fifth run without a protocol amendment
    and a new approval.
  - A crash, timeout or memory kill is failed_infrastructure or censoring; never a metric value (AGENTS.md rule 5).
  invalidation_rules:
  - enumerator disagreement on any target in any arm; the instance is void and, if it entered a pairing, the run is
    completed_invalid
  - model-check failure (WDSat answers UNSAT on a SAT-labelled instance, or a SAT model fails verification on the
    curve); the run is completed_invalid
  - a planted target missed by any arm in any mode; the run is completed_invalid
  - 1 in W_D on a SAT-labelled instance (false refutation) in the closure arm; the run is completed_invalid
  - check.py exits 3 (pairing re-derivation mismatch, re-labelling disagreement on its sample, closure recount
    mismatch); the run is invalid
  success_criterion: >-
    SUPPORT (scoped to the 20 toy Koblitz cells, the vendored WDSat build in both modes, the independent eliminator
    at D <= 5): P1 and P2 hold (R in [0.7, 1.4] in >= 90% of cells in both modes; D_W equal in >= 90% of cells with
    columns ratio in [0.5, 2]); the N0 spread is <= 1.4 in both modes and N0 is identical to V_poly in closure;
    every planted target is found by every arm; g_nb in [1.6, 2.4]; check.py exits 0 on all four runs. P3 then
    labels the reading E1 (R(rand) also near 1) or E3 (|log2 R(nb) - log2 R(rand)| >= 0.5) and P4 reports B_net.
  falsification_criterion: >-
    FALSIFY: on checker-valid runs with N0, C-PLANT, C-ENUM and C-G passing, R above 2 in half the cells in both
    modes (the V_nb bit is cancelled; the orbit union is the only Frobenius lever), or D_W differs by 1 or more on
    over 10% of cells (V_nb is not free). These are IDEA-20261017-fd3924 falsification conditions 1 and 2; the design
    memo's "D_W differs in >= half the cells" is superseded by the idea's 10%.
  inconclusive_criterion: >-
    INCONCLUSIVE: N0 spread above 1.4 in either mode (noise floor; not support); g_nb outside [1.6, 2.4] (pilot
    input not reproduced; IDEA falsification condition 4, read here as an instrument condition); fewer than 20
    UNSAT-for-all-arms targets in more than half the cells; or the closure arm not runnable at m = 3 within budget
    (then P2 is dropped for m = 3 cells and the record says so, IDEA notes 1.4). A checker-invalid run is not
    evidence; timeouts and memory kills are censoring or failed_infrastructure.
  heuristic_criterion: >-
    P1 pass with c in [0.9, 1.0] for every arm leaves H1 validated at toy scale; P1 fail weakens H1 at the failing
    cells only. P3 decides between E2 and E3 and bears on H1's "shape of V" clause, never on P1-P2. H2 and H3 are
    recomputed as the pilot accounting (C-G) and carry no criterion beyond g_nb in [1.6, 2.4]; the field-only
    sampling of H2 at n up to 163 is not part of this experiment.
  decision_impact:
    on_positive: >-
      H-FROB-ad36e7 may move to analyzed and, after independent review including a blind re-derivation of R from
      rows[] and of D_W from the closure records, to supported at the tested scope: the 0.6-0.8 bit per relation
      of the normal-basis window is a real, free gain at toy scale that composes with other constant-factor gains
      (IDEA notes section 4, row 1), which routes GOAL-FROB-6333a9 toward the optimal-normal-basis stratum if E3 or
      toward the "small V.V and large g" search otherwise; no exponent, cost record or frontier row changes.
    on_negative: >-
      Instrument before theory: N0, C-ENUM and C-PLANT are re-examined and the run goes to independent review
      first. On a checker-valid falsifying outcome H-FROB-ad36e7 is weakened at most (a single unreplicated run never
      supports reject_scoped); the recorded reading is that the V_nb bit is cancelled by solve cost (E2 or E3 named
      by P3), the orbit union remains the only Frobenius lever for the tested cells, and the next dispatch is a
      replication at the failing cells with larger k before any closure of the lever.
  interpretation_limits:
  - UNSAT only; SAT cost and cost per relation not measured; toy n up to 23; conflicts are a search property, not
    a degree (IDEA interpretation limits)
  - W_4 is saturated and cannot rank systems (KN-FIND-c3a917); read D_W, columns, W_3
  - no speedup is measured or claimed; the whole Frobenius lever is at most log2(131) = 7.03 bits (orbit union)
    and no exponent moves; nothing at n = 131 and nothing about the security of any deployed curve
  - R in [0.7, 1.4] is the null prediction of the exhaustive-core law; the risk sits in V_rand, D_W/columns and the
    pruned mode (IDEA notes 1.3)
  - a result that holds in one WDSat mode only is a solver-mode artefact and is reported as such
  - factor-base sizes differ by the Tr(1/x) and halving split; pairing is by target and |FB| is recorded
  - dense random normal elements and the sparse optimal normal basis are separate strata
  - the tau factor-base pilot is exploratory provenance for the cells, g and the 0.6-0.8 bit figure, never
    evidence
  - check.py will be producer-written; independent review precedes any status move
  required_artifacts:
  - experiments/EXP-FROB-fc007f/runs/RUN-FROB-2458d5/manifest.yaml
  - experiments/EXP-FROB-fc007f/runs/RUN-FROB-2458d5/raw-result.json
  - experiments/EXP-FROB-fc007f/runs/RUN-FROB-2458d5/instances.json
  - experiments/EXP-FROB-fc007f/runs/RUN-FROB-9f5468/manifest.yaml
  - experiments/EXP-FROB-fc007f/runs/RUN-FROB-9f5468/raw-result.json
  - experiments/EXP-FROB-fc007f/runs/RUN-FROB-9f5468/instances.json
  - experiments/EXP-FROB-fc007f/runs/RUN-FROB-b689bc/manifest.yaml
  - experiments/EXP-FROB-fc007f/runs/RUN-FROB-b689bc/raw-result.json
  - experiments/EXP-FROB-fc007f/runs/RUN-FROB-b689bc/instances.json
  - experiments/EXP-FROB-fc007f/runs/RUN-FROB-e8aa02/manifest.yaml
  - experiments/EXP-FROB-fc007f/runs/RUN-FROB-e8aa02/raw-result.json
  - experiments/EXP-FROB-fc007f/runs/RUN-FROB-e8aa02/instances.json
  artifact_schema:
    raw_result: 'frob.nb_window_cost.result.v1: experiment_id, hypothesis_id, trial_id, run_id, seed, environment
      (host, compiler, solver_sha), cells[] (cell, n, m, k, a, r, fb_size per arm, unsat_for_all_arms, short_cell),
      rows[] one per (instance, arm, mode) with instance_id, cell, n, m, k, arm (poly|nb_1|nb_2|nb_3|onb|rand|n0),
      mode (b|xg), label, planted, conflicts, wall_s, censored, model_verified, solver_sha, anf_sha256; pairs[] per
      (cell, arm, mode) with ratio_median, ci_low, ci_high, n_pairs; closure[] one per (instance, arm, D) with
      D, contains_one, cols, rows_count, iterations, first_refuting_iteration, wall_s, peak_rss_mb, D_W,
      cols_at_DW; yield[] per (cell, arm) with orbits, g, usable_conjugates, eff, lambda'
    instances_json: labels from both enumerators, solutions, planted targets, normal elements and V_rand bases per
      cell
    environment_record: 'at raw-result.json pointer /environment; the file named environment.json in a run
