# EXP-ICPERF-1fbf7d
# E-side x-counts on three subspaces. No solver.
# Approved by DEC-20261001-616964.
experiment:
  id: EXP-ICPERF-1fbf7d
  hypothesis_id: H-ICPERF-58799e
  source_idea: IDEA-20260915-eee7e4
  question_id: RQ-ICPERF-94c86e
  version: 1
  title: E-side x-counts at three factor-base cells
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-616964
  objective: >-
    On y^2 + xy = x^3 + x^2 + 1, count the x-coordinates in V that lie on
    E for (n, l) in {(15, 5), (17, 6), (19, 6)}. Convert each count to a
    point count and a leaf ratio. Reject the triple 16, 30, 32.
  inputs:
    curve_a: 1
    curve_b: 1
    cells:
      - {n: 15, l: 5, modulus_integer: 32821, x_count: 11, point_count: 21, leaf_ratio: "32768/1331"}
      - {n: 17, l: 6, modulus_integer: 131081, x_count: 32, point_count: 63, leaf_ratio: "8/1"}
      - {n: 19, l: 6, modulus_integer: 524327, x_count: 32, point_count: 63, leaf_ratio: "8/1"}
    f2:
      affine_points: [[0, 1]]
      group_order: 2
      frobenius_trace: 1
    full_group_orders: [32494, 131174, 525086]
    rejected_x_counts: [16, 30, 32]
  controls:
    - >-
      The x-counts 16, 30, and 32 are false. Reporting that triple
      invalidates the run.
    - >-
      Over F_2 the equation has exactly one affine point, (0, 1).
      Reporting a second affine point invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - cell in {(15, 5), (17, 6), (19, 6)}
    - route in {side_bit, recurrence_check}
  metrics:
    primary:
      - x_count_by_cell
      - point_count_by_cell
      - leaf_ratio_by_cell
      - rejected_triple_is_false
      - implementations_agree
    secondary:
      - f2_group_order
      - full_group_order_by_n
      - nonzero_hits_at_15_5
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Three x-counts, three point counts, three leaf ratios, and three full group orders.
    formula: >-
      Nonzero x is on E when Tr(x + 1 + x^{-2}) = 0. x = 0 is on E.
      point_count = 2 * (x_count - 1) + 1. leaf_ratio = (2^l / x_count)^3.
      Full orders use the trace recurrence with t = 1.
    source: >-
      IDEA-20260915-eee7e4 counting paragraph and IDEA-20260915-3f1964
      point counts 21, 63, 63, read 2026-10-01. The moduli are the INFO
      strings in inputs/TRIMOSKA-ECICB-2024/source_record.yaml. The table
      was computed in this design session. That computation is not a run.
      No solver was launched.
  scale_relevance:
    tier: toy
    justification: Three subspaces of size at most 64, plus one pass over each full field. No transfer to a NIST degree.
    correspondence: null
  tail_checks:
    - The cell (19, 6) is required. Stopping after (17, 6) and still reporting the third count is invalid.
  replication:
    seeds: []
    independent_instances: 3
    replication_note: Deterministic. The second run is the other arithmetic module.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the x-counts 16, 30, 32 are accepted, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The reported x-counts are 16, 30, and 32.
    - A second affine F_2 point is reported.
    - A WDSat run, a DIMACS file, or a Groebner basis is reported.
  success_criterion: >-
    Both runs agree, the x-counts are 11, 32, and 32, the point counts are
    21, 63, and 63, the leaf ratios are 32768/1331, 8, and 8, the F_2 order
    is 2, the full orders are 32494, 131174, and 525086, the nonzero hit
    count at (15, 5) is 10, and the triple 16, 30, 32 is rejected.
  falsification_criterion: >-
    The runs agree, the triple 16, 30, 32 is rejected, and any x-count,
    point count, leaf ratio, F_2 order, full group order, or the (15, 5)
    nonzero hit count differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-ICPERF-1fbf7d/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ICPERF-1fbf7d/runs/<RUN-ID>/command.txt
    - experiments/EXP-ICPERF-1fbf7d/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ICPERF-1fbf7d/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ICPERF-1fbf7d/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ICPERF-1fbf7d/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - WDSat, blocking clauses, and conflict ratios.
    - Groebner bases and any Boolean-native engine.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
