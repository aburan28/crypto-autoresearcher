experiment:
  id: EXP-ZKARG-eae9f4
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-7269da; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-7269da
  question_id: RQ-WFS-e776b6
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Count distance change under one folding step of a toy Reed-Solomon low-degree test over the
    complete challenge set, with exact nearest-codeword decoding, against codeword and uniformly random
    nulls
  objective: 'The one uncertainty a run reduces: how often a single folding step of a low-degree test
    brings a function that is far from the code strictly closer to the smaller code, at parameters
    where the answer can be counted with an exact decoder rather than bounded. Specifically (i) it
    constructs an enumerated family of functions at exact Hamming distance e from a toy Reed-Solomon
    code and applies the fold at every challenge in the field, so the reported per-input rate is over
    the complete challenge set and not a sample; (ii) it decodes every folded function exactly and
    reports the distance profile, the strict-decrease fraction, the mean relative distance change,
    and the attained worst case over the family, per domain size, rate and distance; (iii) it runs
    a codeword null that must fold to distance zero everywhere and a uniformly random null through
    the identical fold and decoder, so that any elevated strict-decrease rate in the signal arm is
    attributable to near-codeword structure rather than to the geometry of a small code, and so that
    agreement between arms is recorded as a controlled null. The run makes no proximity conjecture,
    composes nothing across layers, and examines no system outside the code and fold written for this
    contract.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for the named prime, evaluation
      domain sizes, code rates and distances, over the named corruption family and using exact nearest-codeword
      decoding, the measured fraction of folding challenges at which relative distance strictly decreases
      is the tabulated value, with the attained worst case exhibited. What does NOT follow: any statement
      about a multi-layer low-degree test, since this record composes nothing; any statement about
      distances outside the exact-decoding regime or about any proximity conjecture; any statement
      about cryptographic-size domains or rates; any statement about any deployed, third-party or
      standardized proof system; and no attack, break, speedup or security consequence.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes) Freeze the prime, the two domain sizes, the two rates, the
      distance range, the corruption family and its cap, the decoder, and the relative-distance convention
      in writing. STAGE 1 (cost: minutes) Implement the code, the fold and the exact decoder; run
      the decoder self-check on random codewords and the rate-one degenerate control. STAGE 2 (cost:
      minutes) Run the codeword null and require distance zero at every challenge. STAGE 3 (cost:
      several hours compute) For each (domain size, rate, e) build the input family and, for every
      input, apply the fold at every challenge and decode exactly, recording the distance profile
      and the strict-decrease fraction. STAGE 4 (cost: under one hour) Run the uniformly random null
      through the identical pipeline in the same invocation. STAGE 5 (cost: minutes) Tabulate maxima,
      means and null comparisons; emit the worst-case inputs as certificate artifacts. STAGE 6 (cost:
      equal to stages 3 to 4) Replay from the declared seed and require identical histograms before
      writing the run record.'
    instrument: Python 3, no Sage. A self-contained F_p module on Python integers; Reed-Solomon encoding
      by evaluation over a multiplicative subgroup; the even-odd fold implemented directly from the
      squaring map; exact nearest-codeword decoding by minimum-distance search over interpolations
      from every message-length subset of positions, written as an independent routine with a re-encode
      self-check; numpy only for histogram assembly. Execution is wrapped by harness/runner.py so
      commit, environment, timing, resources and seeds are captured and the run record is immutable,
      and the worst-case inputs are emitted as certificates whose distance profiles the wrapper recomputes
      independently.
    parameters: 'Prime p equal to 65537. Evaluation domain sizes N in {16, 32}, both powers of two
      dividing p minus one. Message lengths k in {2, 4} giving rates one eighth and one quarter at
      N equal to 32. Input distances e in {1, 2, 3, 4}. Corruption family: all position subsets of
      size e, capped at 65536 functions per cell, crossed with 8 declared corruption values. Folding
      challenges: all 65537 field elements per input, complete. Decoder: exhaustive subset interpolation,
      at most 120 interpolations per decode at k equal to 2 and N over 2 equal to 16. Uniformly random
      null: 4096 functions per cell. Total decodes bounded by the family cap times the challenge count,
      enforced by the stopping rule with truncation labelled.'
  controls:
  - Codeword null at distance zero, required to fold to a codeword at every challenge.
  - Uniformly random function null through the identical fold and decoder in the same invocation.
  - Degenerate control at rate one, where every function is a codeword and every distance must be
    zero.
  - 'Decoder self-check: re-encode the decoded message and confirm the reported distance equals the
    actual Hamming distance to the re-encoding.'
  - Two code rates and two domain sizes so the measured rate is not a coincidence of one parameter
    pair.
  - Seed replay of the random null reproducing its profile histogram exactly.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): NULL OBJECT: uniformly random functions on the same domain, drawn from
    a declared seed rather than constructed as corrupted codewords, pushed through the identical fold
    at every challenge and the identical exact decoder in the same invocation. A uniformly random
    function is at large distance from the code with overwhelming probability, so the null must show
    a distance profile concentrated near the maximum with essentially no challenges at which the folded
    function is close to the smaller code. For the signal arm to mean anything the null must show
    a strictly smaller strict-decrease rate than the corrupted-codeword arm; if the two agree, the
    measurement is reading generic distance geometry rather than any property of near-codeword structure,
    and the record closes as a controlled null. A second null is a genuine codeword, at distance exactly
    zero, which must fold to a codeword at every challenge, giving distance zero at every z and confirming
    the decoder and the fold agree.'
  independent_variables:
  - input Hamming distance e
  - code rate k over N
  - evaluation domain size N
  - input family (corrupted codeword, codeword null, uniformly random null)
  metrics:
    primary:
    - fraction of challenges at which relative distance strictly decreases, per input
    - maximum of that fraction over the family per cell
    - mean relative distance change under folding per cell
    - codeword null profile
    - uniformly random null strict-decrease distribution
    secondary:
    - full distance profile histograms
    - decoder self-check failure count, required zero
    - worst-case input function and its profile
    - decoder wall time per cell
    - number of truncated family members per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The maximum over the enumerated input family, per (N, rate, e), of the fraction of folding
      challenges at which the folded function's relative distance to the smaller code is strictly
      less than the input's relative distance to the larger code.
    formula: 'Relative distance is defined as absolute Hamming distance divided by the current domain
      size, so an input at absolute distance e on a domain of size N has relative distance e over
      N and a folded function at absolute distance f on a domain of size N over two has relative distance
      2f over N; strict decrease means 2f is strictly less than e. Pre-registered structure, not value:
      the strict-decrease fraction is non-increasing in e at fixed rate, non-decreasing in rate at
      fixed e, and exactly zero for the codeword null. No numerical value is pre-registered for the
      corrupted-codeword arm, because producing that number is the purpose of the run.'
    source: Pre-registered in the parent proposal IDEA-20260816-7269da before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at p equal to 65537 with evaluation domains of size 16 and 32, message
      lengths 2 and 4, and distances up to 4, chosen because exact nearest-codeword decoding and complete
      challenge enumeration are both affordable there. Transfer assumption, stated and expected to
      be weak: nothing measured here is claimed to transfer to cryptographic domain sizes or to the
      large-distance regime, because the exact-decoding window is precisely the regime in which proximity
      questions are least interesting; the two domain sizes give only a two-point check on whether
      the strict-decrease rate depends on N at fixed rate.'
    correspondence: null
  tail_checks:
  - Report the single input with the highest strict-decrease fraction and confirm its profile is consistent
    with the family rather than with a decoder failure.
  - Report the upper tail of the uniformly random null's strict-decrease distribution and confirm
    the signal-arm maximum lies outside it before claiming any separation.
  - Examine the e equal to 1 cell separately, since it is closest to the code and most likely to fold
    closer for trivial reasons.
  - Report the fraction of decodes where two distinct nearest codewords tie, since ties are the tail
    case that makes a distance ambiguous.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt if the codeword null or the decoder self-check fails.
  - Cap the input family at 65536 functions per cell and label truncated cells as lower bounds.
  - Cap total wall time at twelve hours; truncation reduces the (N, rate, e) grid and is recorded
    as a budget outcome, never as evidence about folding soundness.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run succeeds if the codeword null folds to distance zero at every challenge,
    the decoder self-check reports zero failures, and the strict-decrease fraction, its family maximum,
    the mean relative distance change and the null comparisons are reported for every attempted cell,
    whether or not the arms separate.
  falsification_criterion:
  - The codeword null does not fold to distance zero everywhere.
  - The decoder self-check fails on any decode.
  - The corrupted-codeword arm and the uniformly random null are indistinguishable in strict-decrease
    rate, closing the record as a controlled null.
  - The strict-decrease fraction is exactly zero in every cell, falsifying the premise that a single
    fold can decrease relative distance at these parameters and closing with the named obstruction.
  - The measured rate is non-monotone in code rate or in e, indicating a decoder or convention fault.
  - Replay from the declared seed does not reproduce the histograms.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-7269da
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Whether a folded code with message length 2 is large enough for closeness to be meaningful, or
    whether the whole parameter window must move up, which would break exact decoding; the Coordinator
    must resolve this tension before approval.
  - The corruption-value set is declared but not justified; a value set lying in a multiplicative
    subgroup could correlate the folded functions and needs a ruling.
  - Whether the tie-breaking convention for two equidistant nearest codewords should record the minimum,
    both, or mark the input as excluded.
  - Whether a list-decoding cell at larger e should be included as a separate labelled column or excluded
    entirely to keep every reported distance exact.
