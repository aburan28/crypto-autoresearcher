experiment:
  id: EXP-DREG-6de989
  hypothesis_id: H-DREG-2af583
  question_id: RQ-DREG-d7b6d6
  derived_from_idea: IDEA-20260922-881df9
  version: 1
  title: >-
    Three-arm attribution of a named-degree increment range: isogeny class,
    different trace, support-matched non-elliptic system
  status: approved
  objective: >-
    Assign one attribution label to the increment ranges of last-fall degree
    and of grevlex solving degree. The isogeny-effect label is allowed only
    when the class range is at least 1 and both null ranges are 0. No ECDLP
    exponent is claimed.
  inputs:
    ladder: "experiments/EXP-DREG-dd668d/specification.yaml#frozen_ladder"
    class_run: experiments/EXP-DREG-ab3fee/runs
    prerequisite_rule: >-
      A completed EXP-DREG-ab3fee metrics.json whose outcome_label is equal,
      gap, or not-growing-regime. Labels blocked-instrument and
      uncertified-class stop this contract with label blocked-census.
  controls:
    - id: ARM-B
      description: >-
        Four lex-first ordinary F_4 curves whose trace is not the base trace.
        They cannot match the group order. That confound is reported, not removed.
    - id: ARM-C
      description: >-
        One system with the base monomial support and coefficients drawn once
        from random.Random(20260922) in F_2. Not redrawn.
    - id: LEVEL-SHUFFLE
      description: >-
        If the certified class has at least two distinct counts of rational
        degree-2 kernels along the walk, shuffle those level labels 20 times
        with seed 20260922. A level effect is reported only when the true
        level-range difference is at least 1 and every shuffle gives difference 0.
        One level means the stratum is not applicable.
  independent_variables:
    - arm in {A, B, C}
    - named degree in {last-fall, grevlex solving degree}
  metrics:
    primary:
      - range_A, range_B, range_C for each named degree
      - attribution_label in {A-only, trace-noise, shape-noise, flat, blocked-census, unmeasured}
    secondary:
      - per-curve increments
      - volcano stratum label, or not-applicable
  heuristic_under_test: HEUR-2af583
  preregistered_prediction:
    quantity: attribution_label
    formula: >-
      A-only only if range_A >= 1 and range_B = 0 and range_C = 0. Otherwise
      trace-noise if range_B >= range_A, shape-noise if range_C >= range_A,
      flat if all three ranges are 0.
    source: H-DREG-2af583
  scale_relevance:
    tier: toy
    justification: Same ladder as EXP-DREG-dd668d. Four extra curves and one non-elliptic system. No transfer.
    correspondence: null
  tail_checks: []
  replication:
    seeds: [20260922]
    independent_instances: 1
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - One draw of arm C. Do not resample.
    - Do not add curves to arm B beyond the four lex-first models.
  invalidation_rules:
    - Missing or blocked census. Label blocked-census.
    - A cell that does not finish is unmeasured and is omitted from its range. If an arm then has no finished increment, label unmeasured for that degree.
    - Subset-column ranks are not admissible.
  success_criterion: >-
    The census prerequisite is equal or gap or not-growing-regime, all three
    arms have a finished increment for a named degree, and the attribution
    label equals the pre-registered formula for that degree. Flat and
    trace-noise and shape-noise are successful executions of the control.
    They are not isogeny effects.
  falsification_criterion: >-
    The isogeny-effect claim is false for a named degree unless the label is
    A-only under the formula. Any finished pattern other than A-only falsifies
    the isogeny-effect claim for that degree. The label itself remains the result.
  required_artifacts:
    - experiments/EXP-DREG-6de989/runs/<RUN-ID>/metrics.json
    - experiments/EXP-DREG-6de989/runs/<RUN-ID>/report.md
    - experiments/EXP-DREG-6de989/runs/<RUN-ID>/manifest.yaml
  assigned_to: executor
  approved_by: coordinator
  approval_decision: DEC-20260922-c27cf2
  claim_ceiling:
    tier: toy
    forbids:
      - reading A-only as an attack
      - answering RQ-VOLC-f6253b
      - an ECDLP exponent
