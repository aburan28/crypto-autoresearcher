  summary: >-
    Executed EXP-MONO-d4840b: a structurally O(p^2) root-pair enumeration
    (every Z=3 curve generated directly from an unordered pair of
    distinct roots {r1,r2}, with r3=-(r1+r2) forced and A,B computed in
    O(1)), replacing EXP-MONO-8ec0e5's own two prior O(p^3)-class
    attempts. Construction audit (500 candidates) and filter audit (250
    candidates, fast-vs-brute-force h_+/h_- agreement) both PASSED with
    zero disagreements -- the new enumeration is independently confirmed
    correct on its own terms. Despite this, Stage 0 STILL did not find a
    qualifying curve (Z=3, h_+>=1, h_->=1, max(h_+,h_-)>=2) within the
    approved 900s budget: 6,179,235 root pairs examined (6,149,265
    genuine, non-degenerate Z=3 candidates) across 87 primes ascending
    from 101 through 613, in 861.2s wall / 861.0s cpu / ~22.5MB peak RSS.
    Classified `resource_exhaustion` (the declared range [101,2000], 278
    primes, was NOT exhausted). Per AGENTS.md rule 3, this is an
    infrastructure-class outcome, not evidence for or against
    H-MONO-dd666a in either direction.

  construction_and_filter_audits:
    construction_audit: {n_audited: 500, failures: 0, note: "verified f(r1)=f(r2)=f(r3)=0 mod p for every audited candidate"}
    filter_audit: {n_audited: 250, disagreements: 0, note: "fast character-based h_+/h_- method agrees with brute-force 4-torsion counting on every audited candidate, consistent with every prior experiment in this sub-thread"}

  measured_throughput_comparison:
    note: >-
      CORRECTED. An earlier draft of this section (before the Executor's
      own final report was read in full) compared raw root-pair counts
      and concluded a 1.71x speedup. That comparison was WRONG: the
      Executor's own final report discloses a 3x REDUNDANCY in this
      run's own declared search order -- every genuine (A,B) curve with
      distinct roots {ra,rb,rc} is generated independently by EACH of
      its own 3 unordered sub-pairs ({ra,rb},{ra,rc},{rb,rc}), since
      ra+rb+rc=0 forces the SAME third root regardless of which two are
      chosen as (r1,r2). This is confirmed exactly by the data:
      candidates_examined_total (6,149,265) / 3 = 2,049,755.0 exactly,
      i.e. exactly 2,049,755 DISTINCT curves were actually examined, not
      6,149,265. The Coordinator independently re-derived this
      redundancy from the root-sum-to-zero identity and confirms it is
      mathematically necessary, not a coding accident.
    run_2_fast_splitting_test_distinct_curves_per_second: 4154
    run_3_root_pair_DISTINCT_curves_per_second: 2380
    run_3_vs_run_2: >-
      run 3 is approximately 1.75x SLOWER than run 2 in the metric that
      actually matters (distinct curves examined per second), not
      faster. The per-candidate cost reduction this experiment's own
      specification anticipated (skipping the O(p) cubic_roots scan) was
      real, but it was more than offset by the 3x redundancy in the
      declared search order, which the Coordinator did not anticipate
      when designing EXP-MONO-d4840b's own specification. This is a
      genuine Coordinator design defect, disclosed in full in the
      companion correction record.

