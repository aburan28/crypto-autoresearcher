  objections:
    - id: OBJ-J4a-1
      target: "J4(a) -- the current status wording is not merely incomplete, it is affirmatively wrong if finding_2 holds"
      statement: >-
        `search_infeasible_at_declared_budget_pending_faster_enumeration_design`
        makes two specific, falsifiable implicit claims: (i) infeasibility is
        a function of the DECLARED BUDGET (implying a larger budget could
        succeed); (ii) the correct remedy is a FASTER ENUMERATION DESIGN
        (implying a smarter/quicker search could succeed where the slow one
        did not). DEC-20260904-826703's own `next_action` and
        GOAL-MONO-001's own IMP-2 `clears_when` both operationalize exactly
        this: "a follow-up experiment enumerates Z=3 candidates directly by
        root-pair choice... OR a Coordinator authorizes a multi-hour budget."
        If finding_2 is confirmed, BOTH of these named remedies are
        provably futile, not merely unlikely to help: no enumeration speed,
        however fast, and no budget, however large, can ever produce a
        curve that does not exist for any prime. Retaining the current
        status (or IMP-2's current `clears_when`) would actively mislead a
        future session into spending real compute building the root-pair
        enumerator FOR THIS PURPOSE -- a purpose finding_2 would have already
        closed. (The root-pair enumerator itself is not valueless; it fixes
        a real, separately-confirmed 3x redundancy defect, CORR-20260905-783157
        finding_1, and would still be useful for OTHER Z=3 work in this
        sub-thread. What is specifically wasted is building it *in order to
        finally reach the joint-regime target*, since that target would not
        exist to be reached.) This is the load-bearing consequence: the
        defect is not in the status's completeness but in its causal
        attribution (performance bottleneck vs. mathematical impossibility),
        exactly the distinction DEC-20260904-826703's own status-note text
        claims to be careful about ("the BLOCKER is search performance, not
        a scientific ambiguity") -- if finding_2 holds, that sentence itself
        becomes false and needs correcting, not merely extending.
    - id: OBJ-J4a-2
      target: "J4(a) -- the instrument_no_go precedent does not transfer verbatim; the mechanism here is different and a distinct status name is needed"
      statement: >-
        H-MONO-5b6617's `instrument_no_go_zero_discriminating_power_proven_by_null_object_control`
        status names a MEASUREMENT-BLINDNESS failure: the diagnostic (cycle
        type conditional on g irreducible) was proven, via an explicit null
        object with a WRONG monodromy group that nonetheless reproduced
        every observed instance, to be a deterministic function of something
        OTHER than the quantity under test (the base point's own
        factorization type, not the fibre's actual monodromy) -- so even
        with a genuine target curve in hand, the instrument could never have
        told the true answer from a false one, at ANY scale. That is NOT
        this situation. Here, IF a curve with Z=3, h_+>=1, h_->=1,
        max(h_+,h_-)>=2 existed, the comparison instrument (exact census vs.
        D_sum vs. D_prod) would work perfectly and would genuinely
        discriminate -- that is exactly what H-MONO-dd666a's own
        pre-registration argues, correctly, conditional on existence. The
        problem, if finding_2 holds, is not that the measurement is blind;
        it is that the OBJECT the measurement needs to be pointed at does
        not exist, for any prime, under this construction. Reusing the
        literal string `instrument_no_go` here would misdescribe the
        mechanism and would misdirect any future reader searching for a fix
        (they would look for a better diagnostic within Z=3, which cannot
        help, rather than a different curve family/stratum, which might).
        RECOMMENDED DISTINCT STATUS (semantics, not literal string -- the
        Coordinator composes the actual field): something in the spirit of
        `target_object_provably_nonexistent_for_every_prime_neither_confirmable_nor_falsifiable_by_this_construction`.
        Like `instrument_no_go`, this should be framed as a POSITIVE,
        load-bearing finding (a derivation-tier non-existence result, if
        J1-J3's case analysis is prime-general rather than sampled -- see
        OBJ-J4c-3 below) rather than a demotion to plain "inconclusive," but
        it must NOT borrow `instrument_no_go`'s literal wording, since that
        would misattribute the cause.
    - id: OBJ-J4a-3
      target: "J4(a) -- 'vacuously satisfied' is a category error and should be explicitly rejected as a candidate label, not merely not chosen"
      statement: >-
        "Vacuously satisfied" is only formally correct for a
        UNIVERSALLY-quantified statement over an empty domain ("for every
        curve in {Z=3, h_+>=1, h_->=1, max>=2}, census=D_sum" is vacuously
        true if that set is empty). But H-MONO-dd666a's own text is not
        phrased that way -- it is an EXISTENTIAL, pre-registered, two-sided
        test: "On A FOUND curve with [filter], (I) census matches D_sum and
        not D_prod... (II) census matches D_prod or neither." Both branches
        presuppose a curve was found. If the domain is empty, NEITHER branch
        is reached -- there is no sense in which outcome (I) "occurred." If
        a future reader sees a status containing the phrase "vacuously
        satisfied" without extremely careful qualification, the natural
        (and false) reading is "outcome (I) happened" -- i.e., that the
        additive form was supported at a genuine interaction point. That
        would be exactly the kind of overclaiming AGENTS.md rule 5/9 and
        `docs/inventor-protocol.md` forbid: dressing up "we could never test
        this" as "this passed." I recommend the ledger status and its note
        EXPLICITLY STATE that this is NOT vacuous satisfaction of outcome
        (I), and is not confirmation of anything about the additive form's
        behavior at a genuine (both-large) interaction point -- that
        question remains completely untouched, not resolved in either
        direction.
    - id: OBJ-J4a-4
      target: "J4(a) -- plain 'unanswerable' is too weak/generic a label on its own"
      statement: >-
        "Unanswerable" by itself does not distinguish "we haven't found the
        right method yet" (exactly what the CURRENT, wrong status already
        implies) from "unanswerable BY THIS EXACT CONSTRUCTION, PROVABLY,
        FOREVER, regardless of budget or algorithm" (the much stronger claim
        finding_2 would establish). The status and its note need to carry
        the mechanism (domain provably empty, derivation-tier, all primes)
        and the scope boundary (this closes off testing D_prod -- and, per
        OBJ-J4c-2 below, a wider class of rivals -- via Z=3 curves
        specifically; it does NOT close off the broader bivariate-interaction
        question, which remains open pending a different construction, e.g.
        a non-split stratum per J4(c)). A bare "unanswerable" tag, without
        that mechanism and that scope boundary stated explicitly in the same
        note, would under-inform exactly the way the current status does.
    - id: OBJ-J4a-5
      target: "J4(a) -- GOAL-MONO-001's own IMP-2 impediment inherits the identical defect and is not itself within this task's scope but must be flagged"
      statement: >-
        `ledger/goals/GOAL-MONO-001/goal.yaml` IMP-2's `clears_when` reads:
        "A follow-up experiment enumerates Z=3 candidates directly by
        root-pair choice... OR a Coordinator authorizes a multi-hour budget
        for the existing method." If finding_2 is confirmed, THIS
        `clears_when` CAN NEVER FIRE under either disjunct -- both name
        exactly the two remedies OBJ-J4a-1 shows are futile. An impediment
        record whose own stated clearing condition can provably never be
        met is not an impediment in AGENTS.md rule 10's sense (a scheduling
        fact that resolves with more work); it is a mis-scoped record that
        needs its own correction alongside H-MONO-dd666a's status change.
        This is beyond my assigned joints and I make no ledger edit, but the
        Coordinator's composed decision record should address IMP-2
        explicitly, not only H-MONO-dd666a, or the goal record will keep
        pointing future sessions at a dead end.
    - id: OBJ-J4b-1
      target: "J4(b) -- symbolic verification of D_prod=D_sum at (1,1) for ALL n_+,n_-"
      statement: >-
        D_prod - D_sum = h_-(h_+-1)n_+ + h_+(h_--1)n_-. Substituting
        h_+=1, h_-=1 (NOT substituting any value for n_+,n_-): the first
        term's coefficient is h_-(h_+-1) = 1*(1-1) = 1*0 = 0, and the second
        term's coefficient is h_+(h_--1) = 1*(1-1) = 1*0 = 0. So
        D_prod - D_sum = 0*n_+ + 0*n_- = 0, IDENTICALLY as a polynomial in
        n_+ and n_- -- both coefficients vanish before n_+,n_- are ever
        assigned a value. I confirmed this with an independent symbolic
        computation (sympy, shown in artifact_paths / commands below):
        expanding h_-(h_+-1)n_+ + h_+(h_--1)n_- and substituting
        (h_+,h_-)=(1,1) while leaving n_+,n_- as free symbols returns the
        zero polynomial exactly. CONCLUSION: this is FORCED BY THE ALGEBRA,
        not an accident of EXP-MONO-98abb2's specific curve (p=103, A=1,
        B=11, n_+=58, n_-=42). Any curve anywhere with (h_+,h_-)=(1,1),
        for ANY n_+,n_- whatsoever (hence for any p, A, B producing that
        h-pair), makes D_prod and D_sum exactly, algebraically equal before
        a single count is measured. This is a stronger and cleaner
        statement than "matched on the tested curve's numbers": it is a
        proof that the two formulas are the SAME FUNCTION restricted to the
        line h_+=h_-=1, not merely equal-valued at one sampled point on
        that line.
    - id: OBJ-J4c-1
      target: "J4(c) -- is the interaction-term question permanently unanswerable by any Z=3 curve"
      statement: >-
        YES, assuming J1-J3 hold. The claimed achievable sets give exactly
        ONE joint-nonzero (h_+>=1 AND h_->=1) pair reachable by ANY Z=3
        curve at ANY prime: (h_+,h_-)=(1,1), and only at p=3mod4 (at
        p=1mod4, h_+ and h_- are never both nonzero at all). By OBJ-J4b-1,
        that single reachable joint point is EXACTLY where D_prod and D_sum
        coincide identically. So the chain is: Z=3 forces the joint domain
        down to one point -> that one point forces D_prod=D_sum identically
        -> therefore NO Z=3 curve, at any prime, in any budget, can ever
        produce a census that discriminates the additive form from the
        named multiplicative rival in a genuine (max(h_+,h_-)>=2)
        interaction regime. This is not a rarity or a budget problem; it is
        a closed loop by construction.
    - id: OBJ-J4c-2
      target: "J4(c) -- the closure is broader than the single named rival D_prod; flag scope, do not let the record understate it"
      statement: >-
        CORR-20260905-783157's own framing addresses D_prod specifically.
        But the SAME argument (OBJ-J4c-1) shows the closure is generic: ANY
        candidate rival formula R(h_+,h_-,n_+,n_-) satisfying
        R(1,1,n_+,n_-) = n_+ + n_- for all n_+,n_- (i.e., any rival that
        happens to agree with D_sum's own value at h_+=h_-=1, not only the
        specific multiplicative form D_prod) is EQUALLY untestable against
        D_sum using Z=3 curves, for the identical reason -- (1,1) is the
        only joint-nonzero point Z=3 can ever reach, so any rival tied to
        D_sum there is invisible to this construction regardless of how it
        behaves elsewhere (e.g. at h_+=2,h_-=3, a point Z=3 simply cannot
        produce). This is worth stating explicitly in whatever record
        supersedes H-MONO-dd666a's status, because a reader who sees only
        "D_prod is indistinguishable from D_sum" might reasonably conclude a
        DIFFERENT interaction-bearing rival (one that also happens to pass
        through (1,1)) could still be tested via Z=3 -- it cannot, by the
        same argument. Per this program's own Pareto/`dominated_by`
        honesty discipline, the closure's own scope should name the whole
        class it excludes, not just the one example that prompted it.
    - id: OBJ-J4c-3
      target: "J4(c) -- is the closure toy-scale or genuinely general (all primes), and why that distinction matters here"
      statement: >-
        Unlike most claims in this sub-thread (which are explicitly toy-tier,
        scoped to primes in [101,2000] or to the two tested primes 101/103),
        CORR-20260905-783157's own finding_2 is presented as a fact about
        `h_pair_from_characters`'s ALGEBRAIC STRUCTURE -- the p mod 4
        dichotomy comes from chi(-1), a classical fact (Euler's criterion)
        that holds for literally every odd prime p, not a pattern sampled at
        small primes. If J1-J2's case analysis is genuinely prime-general
        (as its own text claims: "the achievable (h_+,h_-) pairs for a Z=3
        curve depend on p mod 4" -- stated as a structural fact, not an
        empirical one), then the resulting non-existence closure is
        DERIVATION-TIER and holds for EVERY prime p>3, not merely within
        the declared toy range. This is a materially stronger and more
        useful claim than this sub-thread's other toy-scale results, and
        the eventual status/decision record should say so explicitly and
        not blur it into the same "toy, [101,2000]-scoped" register as
        everything else in this thread -- conflating "provably impossible
        for every prime" with "not found up to p=2000" would understate
        what would actually have been shown. (My own supplementary
        computation below independently corroborates generality across 13
        primes spanning both residue classes, up to p=2003, with zero
        counterexamples -- consistent with, though not a substitute for, a
        genuine all-primes derivation.)
    - id: OBJ-J4c-4
      target: "J4(c) -- value of testing multiple (n_+,n_-) at the SAME forced (1,1) point"
      statement: >-
        Genuinely but narrowly valuable, and must be pre-registered honestly
        to avoid repeating this exact sub-thread's own already-corrected
        mistake (CORR-20260904-b9f9c1's "comparator degeneracy" naming).
        Because D_prod=D_sum identically at (1,1) (OBJ-J4b-1), no additional
        (1,1) curve can EVER discriminate D_sum from D_prod, at any
        (n_+,n_-) -- that avenue is dead, permanently, not merely at the one
        curve already tested. What IS still open is whether the underlying
        MECHANISM (the combinatorial derivation that produces D_sum, already
        independently re-derived and confirmed sound by Red Team for the
        h_+=0 slice in EV-MONO-fae201) continues to hold when h_+ and h_-
        are BOTH simultaneously nonzero -- EV-MONO-b967e0 supplies exactly
        one instance of that (p=103, A=1, B=11). A second, third, etc.
        independent (1,1) curve (different p=3mod4 prime, different n_+,n_-)
        would be legitimate, cheap, additional corroboration that the
        mechanism's joint behavior is not an artifact of that one curve --
        but it must be labeled EXACTLY as that (a repeat confirmation of the
        mechanism at the one forced joint point, not a test of the
        interaction term, and not evidence bearing on D_prod vs. D_sum in
        any way) or it risks being cited later as if it were progress toward
        the original bivariate-discrimination objective, which it
        structurally cannot be.
    - id: OBJ-J4c-5
      target: "J4(c) -- plausibility of a different h_+/h_- structure in the Z<3 (non-split) strata"
      statement: >-
        Plausible and worth naming as a candidate direction, but genuinely
        open, not a near-term rescue, and requires new mathematics rather
        than a rerun of the existing pipeline. `h_pair_from_characters`'s
        classification is built entirely on `roots` being three ELEMENTS OF
        F_p and `chi` being the F_p quadratic-residue table indexed 0..p-1 --
        both are intrinsically Z=3 constructs. For Z=1 (one rational root,
        one irreducible quadratic factor) there is only ONE F_p root, so
        "three pairwise F_p-differences among three F_p roots" does not
        exist as an object at all; for Z=0 (irreducible cubic) there are
        ZERO F_p roots. Neither admits a literal reuse of this exact
        function. A genuinely new invariant would need to be constructed --
        most plausibly using the Frobenius action on the roots living in
        F_{p^2} (Z=1's quadratic factor) or F_{p^3} (Z=0's irreducible
        cubic), and a correspondingly different notion of "which points
        become rational after twisting/halving." This is NOT guaranteed to
        produce a richer achievable set: the same underlying mechanism
        (3 objects, a sign/character structure ultimately controlled by
        chi(-1), i.e. by p mod 4 alone, independent of the curve) might
        still force an equally restrictive pattern once the Z<3 analogue is
        worked out -- OR the different symmetry (Frobenius acting as a
        3-cycle on Z=0's roots, versus a fixed-point-plus-transposition-like
        structure for Z=1, versus the identity for Z=3) could break the
        restriction entirely. I flag this as a legitimate, moderately
        promising, EXPLICITLY UNSOLVED candidate direction for RQ-MONO-001's
        backlog -- not a claim that it works, and not a rescue of
        H-MONO-dd666a itself, which is stated to scope Z=3 only and would
        need its own new hypothesis record, its own derivation of what
        "D_sum"/"D_prod" (or their non-split analogues) even mean for a
        differently-structured base-point census, and its own review, before
        any experiment is designed.

  required_controls:
