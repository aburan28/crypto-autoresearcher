  counterexample_or_mutation: >-
    None found against CORR-20260905-783157's finding_2 or against
    CORR-20260904-b9f9c1's identity. My own independent computation
    (reimplementing `h_pair_from_characters` from the verbatim code cited in
    the handoff, not importing any prior script) enumerated ALL Z=3 root
    triples for 7 primes p=1mod4 (5,13,17,29,37,41,101) and 7 primes p=3mod4
    (7,11,19,23,31,43,103), plus three additional larger primes near/within
    the declared [101,2000] range and just beyond it (211,503,1009,1013,
    1999,2003) -- 16 primes total, spanning both residue classes and two
    orders of magnitude. In every case the OBSERVED achievable set was a
    SUBSET of (never exceeded) the claimed set for that residue class, with
    zero counterexamples (p=5, too small to realize the (0,3)/(3,0) members,
    still gave a strict subset {(0,1),(1,0)} -- consistent, not
    contradictory, since the claimed sets are upper bounds on what is
    achievable, not a claim every member is realized at every prime). I also
    spot-checked permutation-invariance of `h_pair_from_characters` under
    all 6 orderings of the 3 roots at p=101,103,41,43 (30 random triples
    each) and found zero disagreements -- the classification does not
    depend on root-labeling order, which is a basic soundness property the
    Coordinator's case analysis implicitly relies on. Separately, sympy
    symbolically confirmed D_prod-D_sum reduces to the exact zero polynomial
    in n_+,n_- when h_+,h_- are substituted with 1,1 (OBJ-J4b-1). This is a
    SUPPLEMENTARY, disclosed-as-such check going beyond my assigned J5 ask
    (which only required confirming the three specific session data points);
    it corroborates but does not replace the Validator's own required blind
    from-scratch rederivation (J2) or exhaustive scan (J3).

