    quantity: "Achievable (h_+,h_-) sets for p=1mod4 and p=3mod4, from the exact h_pair_from_characters code."
    blind_from_declared: [ledger/corrections/CORR-20260905-783157.yaml]
    blind_from_respected: true
    order_of_operations: >-
