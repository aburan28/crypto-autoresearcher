  proof_architecture_checks:
    - check: exact-baseline-reproduction
      result: >-
        The verbatim h_pair_from_characters code was reproduced exactly (byte-for-byte logic) in my own
        independent implementation for J3, and its symbolic behavior was independently re-derived for J2. Both
        agree with each other and with the exhaustive computation.
    - check: quantifier-fidelity
      result: >-
        The J2 symbolic derivation is a per-instance argument (for a GIVEN Z=3 curve with a GIVEN
        (u,v,w) sign pattern and a GIVEN p mod 4 class, (h_+,h_-) is determined) that is then shown, by
        exhausting all 2^3=8 sign patterns, to bound the REACHABLE SET uniformly over all curves in each
        residue class. This is a valid uniform claim: chi(-1) depends only on p mod 4 (a property of the
        prime, not the curve), and (u,v,w) range over all of {+1,-1}^3 as the curve varies (each sign pattern
        is achievable in principle since u,v,w are three logically-independent quadratic-character values of
        three field-element differences that are otherwise unconstrained beyond being nonzero -- confirmed
        empirically by the exhaustive scan actually producing all 8-case-image outcomes at both test primes).
        No per-curve witness is being passed off as a per-prime uniform witness without support.
    - check: generality-beyond-the-two-test-primes
      result: >-
        The J2 symbolic derivation depends on p only through chi(-1), which by Euler's criterion (confirmed in
        J1, and standard for every odd prime) is a function of p mod 4 alone. The case enumeration over
        (u,v,w) in {+1,-1}^3 uses no other prime-specific fact. The derivation therefore generalizes to every
        odd prime p (excluding the small degenerate cases p=2,3 where "Z=3 with three distinct roots" and the
        character machinery are not meaningfully defined in the usual way) -- p=101 and p=103 are corroborating
        concrete instances of a general symbolic argument, not the source of its generality. This is stated as
        a scope note, not asserted as an additional empirical check beyond the two primes actually scanned.

  blind_rederivation_attestation:
