experiment:
  id: EXP-MONO-d4840b
  version: 1
  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-09-04'
  hypothesis_id: H-MONO-dd666a
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  coordinator_approval_rationale: >-
    APPROVED. DEC-20260904-826703's own named next_action: EXP-MONO-8ec0e5
    resource-exhausted TWICE (unmodified O(p^3)-per-prime search, then a
    verified-correct but only 1.55x-faster O(log p) splitting test,
    itself still O(p^3) overall since it did not reduce the NUMBER of
    (A,B) candidates enumerated, only the cost of checking each). This
    contract eliminates the dominant cost structurally: instead of
    scanning O(p^2) (A,B) pairs and checking each for Z=3 (of which only
    ~1/6 qualify), it enumerates DIRECTLY over the O(p^2) unordered root
    pairs {r1,r2} that PARAMETERIZE every Z=3 curve exactly (since a
    short-Weierstrass cubic's roots always sum to zero, r3=-(r1+r2) is
    forced), computing A,B in O(1) per candidate. This is a genuine
    O(p^2) total algorithm, not merely a cheaper O(p^3) one -- expected
    to finish the FULL declared range comfortably inside budget where
    both prior attempts could not.

  title: >-
    Root-pair enumeration: find a curve with Z=3, h_+>=1, h_->=1, AND
    max(h_+,h_-)>=2 by parameterizing every Z=3 curve directly via its
    own root pair, eliminating the O(p) wasted root-scan on non-splitting
    (A,B) pairs that resource-exhausted both prior attempts.

  what_this_is_not:
    - Not a discrete-logarithm computation, not an ECDLP attack, not relation collection.
    - Not an ECDLP cost, runtime, or exponent claim.
    - >-
      Not a change to H-MONO-dd666a's own scientific claim, falsification
      condition, or predictions -- D_sum, D_prod, and the qualifying
      filter (Z=3, h_+>=1, h_->=1, max(h_+,h_-)>=2) are UNCHANGED. Only
      the Stage-0 SEARCH ALGORITHM changes.
    - >-
      Not a re-run expected to find the SAME curve as EXP-MONO-8ec0e5's
      own (unsuccessful) attempts -- a materially different enumeration
      order will, in general, encounter a DIFFERENT first qualifying
      curve. This is an intended, disclosed consequence of the
      algorithmic change, not a defect.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Identical to H-MONO-dd666a's own claim_ceiling (unchanged): at
      most, whether the additive D_sum form matches an exhaustive census
      exactly on a found h_+>=1, h_->=1, max(h_+,h_-)>=2 curve, while the
      named multiplicative rival D_prod does not.
    what_no_outcome_can_support: >-
      Identical to H-MONO-dd666a's own, unchanged.

  inputs:
    construction_reused: >-
      EXP-MONO-8ec0e5's own already-independently-verified Stage-1/M6/
      Stage-2 logic (D_sum/D_prod computation, the sanity-check identity,
      the exhaustive census via EXP-MONO-0e6e8f's own construction),
      reused UNMODIFIED. Only Stage 0's own enumeration method is new.
    domain: EXP-MONO-d4840b/v1
    NEW_declared_search_order: >-
      DECLARED HERE, BEFORE ANY RUN, per this program's own discipline
      against post-hoc search-order selection. For each prime p in
      [101,2000] ascending: enumerate unordered pairs {r1,r2} of DISTINCT
      elements of F_p, in the fixed order "r1 ascending 0..p-1, then r2
      ascending r1+1..p-1" (i.e. r1 < r2 always, lexicographic). For each
      pair, compute r3 = -(r1+r2) mod p. If r3 = r1 or r3 = r2 (a
      repeated root -- the triple does not give 3 DISTINCT roots), skip
      (this is a genuine degenerate case, not a filter to be gamed: it
      occurs for exactly p-1 of the C(p,2) pairs at each prime, a fixed,
      declared, small fraction). Otherwise compute
      A = r1*r2 + r1*r3 + r2*r3 (mod p) and B = -r1*r2*r3 (mod p); this
      (A,B) is GUARANTEED to have f(X)=X^3+AX+B split into the three
      distinct roots {r1,r2,r3} (Z=3 unconditionally, no check needed).
      Compute h_+, h_- for this curve (via the already-verified fast
      character method, cross-checked against brute force per
      EXP-MONO-8ec0e5's own established FILTER_AUDIT_N practice) and take
      the FIRST (A,B) in this order satisfying h_+>=1 AND h_->=1 AND
      max(h_+,h_-)>=2. THIS ORDER IS UNRELATED TO, AND WAS NOT CHOSEN
      WITH KNOWLEDGE OF, WHICH (A,B) PAIRS EXP-MONO-8ec0e5's OWN SEARCH
      DID OR DID NOT REACH -- it is a natural, minimal, lexicographic
      order on the parameterizing coordinates (r1,r2), declared before
      execution, not tuned to reproduce or avoid any specific prior
      result.
    qualifying_filter_UNCHANGED: "Z=3 (now unconditional by construction) AND h_+>=1 AND h_->=1 AND max(h_+,h_-)>=2"

  stage_order:
    stage_0:
      name: "root-pair search, O(p^2) total, for a qualifying curve"
      compute: >-
        seconds to low minutes (estimated total candidates across the
        full [101,2000] range: sum of C(p,2) over 278 primes, roughly
        the SAME order of magnitude as the total (A,B) pairs scanned
        before, but now each candidate costs O(1) for the Z=3
        determination instead of O(p) -- eliminating the dominant cost
        that caused both prior resource_exhaustions).
      description: >-
        Enumerate as declared above. Report the exact number of root
        pairs examined before success (or full-range exhaustion), the
        found curve's own full parameters, and the same self-consistency
        checks EXP-MONO-8ec0e5's own script already used (twist-order
        identity, tau=Z+1, n_++n_-=p-Z, etc.).
    stage_m6:
      name: "pre-Stage-1 sanity check (unchanged from EXP-MONO-8ec0e5)"
      compute: seconds
      description: >-
        Verify D_sum != D_prod on the found curve via the proven identity
        (h_-(h_+-1)n_+ + h_+(h_--1)n_- != 0) before proceeding. If this
        fails, STOP and report specification_error.
    stage_1_2:
      name: "exhaustive census and comparison (unchanged from EXP-MONO-8ec0e5)"
      compute: seconds to minutes
      description: >-
        Identical to EXP-MONO-8ec0e5's own Stage 1 (exhaustive
        distinct-split census via EXP-MONO-0e6e8f's own construction) and
        Stage 2 (compare against D_sum and D_prod, report R1_sum, R2_sum,
        R1_prod, R2_prod exactly).

  metrics:
    primary:
      - "R1_sum, R2_sum: residuals against the additive D3 formula (exact integers, zero-tolerance)"
      - "R1_prod, R2_prod: residuals against the named multiplicative rival"
    secondary:
      - "M6's own sanity-check result"
      - "the found curve's own (p,A,B,n_+,n_-,h_+,h_-) values"
      - "the exact number of root pairs examined before success (or exhaustion)"
      - "wall-clock time for Stage 0 specifically, to measure the actual speedup achieved over EXP-MONO-8ec0e5's own two attempts"

  preregistered_prediction:
    - quantity: R1_sum, R2_sum
      value: "Exactly 0, under the additive D3 formula (unchanged, per H-MONO-dd666a)."
      formula: "D_sum = h_+ n_- + h_- n_+"
      source: IDEA-20260904-4f614a mechanism, unmodified; H-MONO-dd666a.
    - quantity: R1_prod, R2_prod
      value: "Nonzero, GUARANTEED by the max(h_+,h_-)>=2 filter (proven necessary and sufficient by two independent reviewers in EXP-MONO-98abb2's own review round)."
      formula: "D_prod = h_+ h_- (n_++n_-)"
      source: CORR-20260904-b9f9c1.

  replication:
    planned_runs: 1
    seeds: [20260904010]
    interpretation: >-
      Deterministic once the new search order is fixed; exact
      reproducibility from the recorded curve and search order.

  budget:
    maximum_runs: 1
    maximum_wall_seconds: 900
    maximum_cpu_seconds: 900
    maximum_peak_rss_bytes: 134217728
    maximum_total_disk_bytes: 10485760
    maximum_workers: 1
    no_network: true

  environment_preconditions:
    consequence: NO CAS REQUIRED. Pure Python, reusing already-verified implementations for Stage 1/2/M6.
    if_a_precondition_fails: A missing interpreter or arithmetic exception is `failed_infrastructure`, never negative mathematical evidence.

  infrastructure_failure_disposition: >-
    Any crash is recorded with its exact cause and classified
    `failed_infrastructure`. Supports and weakens NOTHING about
    H-MONO-dd666a.

  stopping_rules:
    - Do not execute unless separately reviewed, approved, frozen and authorized. (Satisfied here.)
    - >-
      The declared root-pair search order (r1 ascending, then r2
      ascending, r1<r2) may NOT be altered after seeing any result.
    - M6's sanity check must pass before Stage 1/2 run; if it fails, stop and report specification_error.
    - >-
      If Stage 0 STILL does not find a qualifying curve within budget
      (a genuine possibility this contract does not rule out), report
      resource_exhaustion or no_qualifying_curve_found exactly as
      EXP-MONO-8ec0e5's own specification defined those outcomes --
      do NOT silently extend any internal safety-break constant without
      explicit disclosure.

  invalidation_rules:
    - Any execution while frozen, execution_authorized or evidence_eligible is false.
    - Any change to the declared root-pair search order after seeing a result.
    - Reporting Stage-2 residuals without all four (R1_sum, R2_sum, R1_prod, R2_prod).
    - Skipping the M6 sanity check.

  success_criterion: >-
    A run is well-formed evidence if: Stage 0's search outcome is
    reported with the exact curve or exact scan count; M6's result is
    reported; and, if M6 passes, Stage 1/2's exact residuals are
    reported plainly.

  falsification_criterion: >-
    Identical to H-MONO-dd666a's own: any nonzero R1_sum or R2_sum on a
    found, sanity-checked qualifying curve.

  outcomes:
    additive_form_confirmed_interaction_rival_excluded: >-
      A qualifying curve is found, M6 passes, R1_sum=R2_sum=0, and
      R1_prod/R2_prod nonzero (guaranteed by the filter). Completes
      H-MONO-dd666a's own test, closing the bivariate sub-thread this
      time with a genuinely fast, complete search.
    additive_form_falsified: >-
      A qualifying curve is found (M6 passed) but R1_sum or R2_sum is
      nonzero. Falsifies the additive form for the joint regime.
    no_qualifying_curve_found: >-
      The FULL declared range [101,2000] is exhausted (all 278 primes)
      without finding a qualifying curve. A genuine, reportable, non-
      evidentiary occupancy finding this time (unlike EXP-MONO-8ec0e5's
      own resource_exhaustion, which never reached full-range exhaustion).
    resource_exhaustion: >-
      If the new algorithm STILL cannot finish in time (assessed as
      unlikely given the O(p^2) vs O(p^3) improvement, but not ruled
      out) -- reported honestly, with Stage-0-specific timing data to
      measure the actual speedup achieved.
    specification_error: M6 fails. Stop, do not proceed to Stage 1/2.
    infrastructure_or_construction_failure: See infrastructure_failure_disposition. Never mathematical evidence.

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_do_not: >-
      Identical to H-MONO-dd666a's own scale_relevance, unchanged.

  required_artifacts_if_later_authorized:
    - Frozen approved specification (this file).
    - Stage-0 search outcome with exact scan count (root pairs examined).
    - M6's result.
    - Run manifest, command, environment, raw-result.json with all four residuals if reached.
    - Independent Validator + Red Team review, with a joint specifically auditing the new root-pair-to-(A,B) construction's own correctness (every generated (A,B) genuinely has Z=3 with the claimed roots) and the search order's own good-faith declaration.

  approval_requirements:
    - This contract is DEC-20260904-826703's own named next_action.
    - Independent review confirms the root-pair construction is correct and the search order was genuinely declared before execution, not tuned post-hoc.

  approval_status: >-
    APPROVED 2026-09-04 by the Coordinator; see `coordinator_approval_rationale` above.

  source_refs:
    - ledger/hypotheses/H-MONO-dd666a.yaml
    - ledger/decisions/DEC-20260904-826703.yaml
    - ledger/corrections/CORR-20260904-b9f9c1.yaml
    - experiments/EXP-MONO-8ec0e5/amendments/v1_to_v2.yaml
    - experiments/EXP-MONO-8ec0e5/implementation/run_amended_bivariate_test.py
    - experiments/EXP-MONO-0e6e8f/implementation/run_uncond_census.py

  inference:
    requested_policy: executor-implementation
    reasoning_effort: medium
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
