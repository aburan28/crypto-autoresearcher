  protocol_deviations:
  - id: D1
    status: RESOLVED BY AMENDMENT v2 CHANGE A2 -- no longer a deviation
    severity: was material -- affected which class is measured
    what: Version 1's contract stated the primary-class rule two ways that disagree on a tie, and all
      three required primes ARE tied between t and -t. The version-1 Executor resolved it to the harness/run_saturation.py:run
      idiom before taking any measurement (deviation D1, accepted in CORR-20260807-14431d).
    resolved_as: amendment change A2 states the rule ONCE, by reference to that function, and WITHDRAWS
      the prose tie-break as erroneous. `select_classes_v2` implements the idiom verbatim, does not evaluate
      the withdrawn text at all, and records the selected (p, t, member count) per prime plus the traces
      tied with it.
    decided_before_any_measurement: true
  - id: D2
    status: RESOLVED BY AMENDMENT v2 CHANGE A1 -- no longer a deviation
    severity: was material -- made the p=6007 gate unsatisfiable by construction
    what: Version 1 compared Arm A0 at p=6007 against RUN-ICINV-p6007-fixed, which was measured at n_targets
      500 over eleven factor-base sizes while the contract froze 400 over thirteen (CORR-20260807-14431d).
    resolved_as: 'change A1: the p=6007 baseline was RE-MEASURED at the frozen parameters and committed
      as a new run under EXP-ICINV-55c2d8 BEFORE any version-2 Arm A0 or Arm B measurement. SR3 at p=6007
      now compares Arm A0 against that run. The superseded record is still read and hashed in baseline-provenance.json,
      and no number from it enters any comparison.'
    decided_before_any_measurement: true
  - id: D3
    status: UNCHANGED -- still applies
    severity: procedural
    what: 'SR3 says ''do not run Arm B'' if the Arm A0 baseline gate fails, while inputs.cost_sharing_requirement
      makes recomputing the exact m=3 sum set per arm an INVALIDATION RULE. The two cannot both be honoured
      literally: scoring Arm B later than Arm A0 requires either a second sum-set pass (invalid) or holding
      every sum set in memory (about 1 GB at p=6007, against a 4 GB cap).'
    resolved_as: one shared pass per (curve, fb_size) scores every arm; the per-cell aggregates for every
      arm are computed inside the sweep, and the baseline gate is then evaluated and written BEFORE any
      Arm B statistic is READ, aggregated into a persistence or stratification verdict, or reported as
      an arm contrast. On a gate failure the run is written status invalid with the defect, the Arm B
      cell aggregates are dropped from the run record, NO persistence or stratification statistic is computed
      for that prime, and the driver halts. Raw per-curve hit counts for every arm are RETAINED (measurements
      are never discarded).
    decided_before_any_measurement: true
  - id: D4
    status: UNCHANGED -- still applies
    severity: procedural
    what: The handoff asks the Executor to merge new origin/main changes into the branch; agents/executor.md
      forbids the Executor from merging main, pushing, or opening PRs (those are Coordinator duties).
    resolved_as: origin/main was FETCHED and COMPARED, and the comparison is recorded in every run manifest
      and in the execution report. No merge was performed by this Executor.
    decided_before_any_measurement: true
  - id: D5
    status: UNCHANGED -- still applies
    severity: reporting
    what: The contract's STEP-2 variance identity is an identity only when VR_1 and VR_3 are taken against
      the POOLED null v = mubar(1-mubar)/T, whereas the controls block requires each stratum's acceptance
      band to be computed from that cell's OWN df and mean.
    resolved_as: 'both are computed and reported side by side and are labelled: `own_null` (per-stratum
      mubar; the per-cell verdict and band) and `ratio_pooled_null` (class-wide v; the only version under
      which the identity check at 1e-9 is meaningful). S3 uses the own-null ratios, which are the quantities
      the metrics block defines as variance_ratio_by_r_stratum.'
    decided_before_any_measurement: true
  - id: D6
    status: UNCHANGED -- still applies
    severity: reporting
    what: The frozen decision rule indexes VR by [arm][prime][class][density][seed] but does not say which
      seed or target count feeds the persistence statistic F_p.
    resolved_as: F_p and the S1/S2/S3 rows are computed at the contract's own target_count_primary = 400
      and at seed 20260807 -- the first frozen seed and the one the bit-exact baseline requires. F_p at
      the other two seeds and at T=100/1600 is ALWAYS reported alongside, whatever the verdict.
    decided_before_any_measurement: true
  - id: D8
    status: NEW IN VERSION 2
    severity: material -- fixes the reference value of one SR3 sub-check
    what: The contract's operating-row sub-check reads 'operating-density row within +-0.25 of 1.918 (p
      = 4001) and 1.591 (p = 6007)'. Those two constants are prose in the contract, and 1.591 was measured
      at T=500 on the very record amendment change A1 replaces. Change A1 says SR3 at p=6007 'compares
      Arm A0 against THAT run', and change A4 says every reference value quoted from a committed record
      is read from the record at run time. Those two directions leave the source of the +-0.25 reference
      ambiguous.
    resolved_as: 'THE GATE USES THE RECORD-READ VALUE: the `row_closest_to_operating_density.variance_ratio`
      of the baseline run bound in baseline-provenance.json, read at run time and hashed (A1 + A4). The
      contract''s prose constants are ALSO evaluated and reported at every prime, in `checks.contract_stated_reference_reported_not_gating`,
      whatever the verdict, so a reader can see both, together with their difference. Fixed in code before
      any version-2 measurement existed. At p=4001 the committed record and the contract''s prose constant
      differ far inside the +-0.25 tolerance and cannot differ in verdict; at p=6007 the record-read value
      is the whole point of change A1.'
    decided_before_any_measurement: true
  - id: D9
    status: NEW IN VERSION 2
    severity: procedural -- affects how change A6 is verified, not what it requires
    what: The handoff's completion gate names `python3 tools/check_run_source_provenance.py --experiment
      EXP-ICINV-4d33aa --strict`. That scope includes the NINETEEN version-1 run directories, every one
      of which predates the N6 fix and is unpinned, and every one of which is immutable and may not be
      edited (AGENTS.md rule 4). The command as written therefore cannot pass while those records exist,
      for a reason that has nothing to do with any version-2 run.
    resolved_as: 'BOTH forms are run and BOTH results are reported verbatim: the handoff''s exact command,
      and the tool''s own documented scoping `--experiment EXP-ICINV-4d33aa --since-commit <base> --strict`,
      which is the check that actually binds the version-2 runs. No run is treated as admissible unless
      the scoped strict check passes on it, and the unscoped result is not presented as a version-2 failure
      or hidden.'
    decided_before_any_measurement: true
  - id: D10
    status: NEW IN VERSION 2 -- corrects version 1's D7
    severity: procedural -- a stopping rule is now honoured in time
    what: Version 1 launched the p=6007 and p=2003 stage-3 runs in one shell invocation, so p=2003 had
      already executed when the p=6007 SR3 gate result could be read (deviation D7).
    resolved_as: 'stage 3 is executed ONE PRIME PER INVOCATION in the contract''s own order (p=4001, then
      p=6007, then p=2003), and the gate result is read before the next prime is launched. If the gate
      fails at p=6007 the experiment STOPS there: no stage-3 run is launched at p=2003, the decision run
      records that prime as NOT RUN with SR3 as the reason, and the resulting shortfall of persistence
      verdicts is reported as the contract''s own ''fewer than two primes'' invalidation rather than papered
      over.'
    decided_before_any_measurement: true
