  - EV-ENDO-10109d
  - CORR-20260807-14431d
  - CORR-20260807-a24675
  - CORR-20260807-d78e2f
  inference:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-opus-5
    reasoning_effort: null
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the policy aliases in
      orchestration/model-policies.yaml; every alias falls back to the one model
      the session runs on. Recorded, never silently substituted (AGENTS.md
      rule 11).
    degraded_allowed: false
    degraded_requirements: []
    model_verified: false
    model_verified_reason: >-
      No adapter probe receipt exists for this session.
