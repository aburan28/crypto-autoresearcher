  # ─────────────────────────────────────────────────────────────────────────
  # DESIGN (transcribed; frozen contract governs)
  # ─────────────────────────────────────────────────────────────────────────
  objective: >-
    Determine whether adaptive challenge/response transcripts produced by a toy
    SQIsign prover using KLPT expose a statistic on the response-isogeny kernel
    representation that distinguishes real transcripts from a true simulator null
    (uniformly random kernel selection of the same degree).

  evidence_class: toy_or_derivation_only
  not_claimed: [key_recovery, cryptographic_scale, break, completion, exponent_improvement]

  statistic:
    name: Chi-squared goodness-of-fit on response-isogeny kernel-scalar residues modulo q
    symbol: chi2_q
    test_modulus_q: 7
    summary: >-
      For each transcript i, recover the kernel scalar s_i in Z/DZ with
      ker(sigma^(i)) = <P_i + [s_i] Q_i> against the canonical Weil-normalized
      basis of E_1^(i)[D]; bin r_i = s_i mod 7 and compute
      chi2_q = sum_k (O_k - E_k)^2 / E_k with E_k = n/q. Under H0 (uniform kernel
      selection) chi2_q ~ chi-squared(df = 6). Full formula, canonical-basis
      definition and the Sp(2, Z/DZ) basis-invariance note (REV-4) are in the
      frozen contract.

  simulator:
    id: SIM-UNIFORM-KERNEL
    summary: >-
      Replaces KLPT-derived kernel selection with uniform selection of s_i from
      Z/DZ, holding the commitment walk and the Velu response computation
      identical, so the only difference is the source of the kernel scalar.
    calibration_criteria: [CAL-1, CAL-2, CAL-3, CAL-4]
    calibration_sample_size: 5000
    calibration_budget_seconds: 300

  parameters:
    prime: 6143            # 3 * 2^11 - 1; p = 3 mod 4; ~512 supersingular curves
    fallback_prime: 4391
    security_bits: 6
    response_degree_D: 131072   # 2^17
    exponent_e: 17
    isogeny_prime: 2
    transcript_count:
      per_key: 400
      num_keys: 5
      total_real: 2000
      total_simulator: 2000
      total_independent: 2000
      total_shuffled: 2000
      grand_total: 8000

  independent_variables:
    - name: condition
      levels: [same_key_real, simulator_null, independent_key, shuffled_key]
    - name: key_id
      levels: [key_1, key_2, key_3, key_4, key_5]

  metrics:
    primary:
      - chi2_7 per key per condition
      - chi2_7 p-value (from chi-squared(6) reference)
    secondary:
      - KS two-sample statistic (real vs simulator per key)
      - Mutual information I(residue; key_id) (pooled across keys)
      - Per-bin residue frequencies (for diagnostic visualization)

  preregistered_prediction:
    quantity: chi2_7 distribution under H0
    formula: "chi2_7 ~ chi-squared(df=6) with mean 6 and variance 12"
    source: "Standard chi-squared theory; kernel-scalar uniformity is the security assumption"

  tail_checks:
    - "Maximum observed chi2_7 across 5 keys x 3 runs (15 values) vs. Bonferroni-corrected extreme-value bound"
    - "Per-bin counts: no bin with fewer than 20 observations (validates chi-squared approximation)"

  threshold:
    minimum_advantage_TV: 0.05
    per_test_alpha: 0.001
    multiple_testing_correction: Bonferroni
    num_primary_tests: 5
    corrected_alpha: 0.0002
    target_power: 0.80
    power_guarantee_scope: aggregate_concentrated_bias
    binding_guarantee: >-
      Power >= 0.95 at aggregate level for concentrated (1-2 bin) biases at
      TV = 0.05; approximately 0.73 for diffuse (3+ bin) biases; worst case
      approximately 0.62. Per-key tests (n = 400) are QUALITATIVE consistency
      checks and are not individually powered (0.02-0.24 depending on pattern).
    revision_note: >-
      Corrected per TASK-20260803-b5ce08 validation (REV-1, REV-2): the original
      derivation contained an invalid probability distribution and an incorrect
      Cohen's w formula. REV-3 (explicit control non-rejection threshold, alpha =
      0.05) and REV-4 (basis-invariance note) applied as recommended improvements.
      These corrections are the substance of DEC-20260804-a6bb36's approval.

  controls:
    - id: CTRL-NULL
      description: True simulator null (SIM-UNIFORM-KERNEL); uniformly random kernel of the same degree from the same E_1 distribution.
      purpose: Primary null hypothesis (H0). Leakage = deviation from this.
    - id: CTRL-SHUFFLE
      description: Shuffled-secret control; 2000 real transcripts from K=5 keys with key assignments uniformly permuted.
      purpose: Distinguish key-correlated leakage from per-transcript protocol artifacts.
    - id: CTRL-INDEP
      description: Independent-key control; 2000 transcripts each from a fresh random key, preserving real KLPT execution.
      purpose: Determine whether any observed leakage requires key reuse.
    - id: CTRL-DIAGNOSTIC
      description: CTRL-INDEP vs CTRL-NULL comparison; should show no significant difference.
      purpose: Detect implementation or model errors in the simulator.

  replication:
    seeds:
      - "0x20260803_EXP_SSI_S1_RUN01"
      - "0x20260803_EXP_SSI_S1_RUN02"
      - "0x20260803_EXP_SSI_S1_RUN03"
    independent_instances: 3
    consistency_requirement: >-
      The primary conclusion (reject or fail-to-reject) must agree across all 3
      runs; disagreement is reported as "inconsistent".

  budget:
    simulator_construction_seconds: 600
    transcript_generation_seconds: 900
    statistical_testing_seconds: 300
    total_wall_clock_seconds: 1800
    memory_gb: 4
    maximum_runs: 3
    per_run_budget_note: >-
      The 1800s budget is per-run across 3 replicate runs; total wall-clock across
      runs is 5400s.

  stopping_rules:
    - id: STOP-1
      condition: Simulator calibration fails (any of CAL-1..CAL-4 rejects after one re-calibration attempt).
      action: Record calibration failure as the outcome; report as infrastructure/methodology finding, NOT as evidence for or against leakage.
    - id: STOP-2
      condition: The chi2_7 statistic was selected or modified after inspecting real-transcript kernel residues.
      action: Abort; invalidated by post-hoc statistic choice.
    - id: STOP-3
      condition: Prime verification fails.
      action: Switch to fallback p = 4391 and re-run calibration from the beginning.
    - id: STOP-4
      condition: KLPT cannot produce connecting ideals of norm D = 2^17 for more than 10% of sampled pairs.
      action: Record as infrastructure limitation; reduce D. Do NOT interpret KLPT failure as evidence of leakage.
    - id: STOP-5
      condition: Any phase exceeds its sub-budget by more than 50%.
      action: Reduce transcript count proportionally and recompute power; abort below power 0.50.
    - id: STOP-6
      condition: Fewer than 90% of planned transcripts generated in any condition.
      action: Proceed only if per-key count remains >= 200.

  invalidation_rules:
    - Any modification to the chi2_7 formula, the modulus q, the canonical-basis definition, or the kernel-scalar extraction procedure after transcript generation begins.
    - Re-running with a different statistic after observing results, unless filed as a separate exploratory experiment with its own ID.
    - Using the calibration transcripts in the primary statistical test.
    - Interpreting a positive result as evidence of a key-recovery attack or cryptographic-scale vulnerability.

  success_criterion: >-
    PRIMARY: For at least 3 of K=5 keys, chi2_7(same-key real) exceeds the
    chi-squared(6) critical value at alpha = 0.0002 (Bonferroni-corrected), AND
    chi2_7(CTRL-NULL) and chi2_7(CTRL-INDEP) do NOT reject at alpha = 0.05
    (REV-3). This would constitute evidence that same-key KLPT transcripts carry a
    detectable residue bias at toy scale.

  falsification_criterion: >-
    For ALL 5 keys across ALL 3 replicate runs, chi2_7(same-key real) p-value >
    0.05, AND the diagnostic control (CTRL-INDEP vs CTRL-NULL) shows no significant
    difference. This would constitute a clean negative: the preregistered statistic
    does not distinguish real from simulator at toy scale, with the stated power
    against TV >= 0.05.

  scale_relevance:
    tier: toy
    justification: >-
      p = 6143 gives ~512 supersingular curves, at which every endomorphism ring is
      computable by brute force. KLPT behaviour at this scale may differ from
      cryptographic scale because the quaternion algebra has small discriminant,
      the space of norm-D ideals is fully enumerable, and lattice structure in the
      maximal order is more constrained. A negative result provides a controlled
      null baseline and validates methodology; it does NOT prove absence of leakage
      at crypto scale. A positive result would motivate mid-scale follow-up but
      would NOT constitute a vulnerability finding.
    correspondence: null

  required_artifacts:
    - preregistration_manifest.yaml
    - prime_verification.txt
    - simulator_calibration_report.yaml
    - raw_transcripts/
    - statistic_results.json
    - validity_report.yaml

  inputs:
    decision_ref: DEC-20260803-ce35f1
    red_team_control: RT-CTRL-001
    idea_screen_candidate: SSI-S1
    literature_refs:
      - KN-LIT-072
      - KN-LIT-1231
      - KN-LIT-1159
      - KN-LIT-1903
      - KN-TECH-028
      - KN-TECH-057

  scope:
    what_this_does_not_test:
      - Key recovery from transcripts (not attempted)
      - Deployed SQIsign security (toy scale only)
      - Timing side channels (excluded by CAL-4 equalization)
      - Security against adversaries with knowledge of the secret key
      - CSIDH, CGL, or other non-SQIsign protocols
      - Quantum distinguishers
