        path: experiments/EXP-SEMAEV-002/runs/RUN-SEMAEV-002-d
    invalid: []
    failed: []
  budget_actuals:
    total_wall_clock_seconds_budget: 6300
    total_wall_clock_seconds_used: 3.983165268
    stage_actuals_seconds:
      instance_generation_and_calibration: {budget: 1800, used: 0.432405266}
      exhaustive_m3_enumeration: {budget: 1800, used: 0.340843747}
      exhaustive_m4_enumeration: {budget: 1800, used: 2.894877617}
      cross_method_audit_and_classification: {budget: 900, used: 0.315439028}
    maximum_runs_budget: 4
    runs_used: 4
    maximum_memory_gb_budget: 4
    peak_memory_measured: false
    note: >-
      Wall-clock usage was far below budget at every stage; no timeout,
      cancellation, or resource-exhaustion event occurred. Memory was not
      independently instrumented (RSS) because the computation's footprint
      -- integer-keyed coefficient dictionaries with at most a few hundred
      entries -- was visibly negligible relative to the 4GB ceiling; this is
      disclosed as unmeasured rather than claimed as a measured number.
  observations:
    - metric: nonexceptional_full_box_fraction
      frozen_prediction: "exactly 1 (every non-exceptional target has all 2^(m-1) box vertices present)"
      observed: "1.0 at every one of the 8 tested (m,p,E) cells (both classification methods)"
    - metric: exceptional_set_cardinality
      frozen_prediction: "<= m-1 at every cell; exactly m-1 under the frozen selection rule (m=3: 2; m=4: 3)"
      observed: "exactly m-1 at every one of the 8 tested cells (2 for m=3, 3 for m=4), both methods"
    - metric: exceptional_set_identity
      frozen_prediction: "observed Exc_m(E) == {x([r]P0): 1<=r<=m-1, affine} exactly"
      observed: "exact set equality at all 8 cells, both classification methods, against the independently (group-arithmetic) computed predicted set"
    - metric: m3_calibration_identity_match
      frozen_prediction: "c_{3,0}=A^2-4Bt, c_{3,1}=t^2, c_{3,2}=1 exactly on every tested m=3 curve"
      observed: "true on all 4 tested m=3 curves, verified against the full-expansion coefficient dictionary (not the hardcoded Method-2 formula)"
    - metric: cross_method_classification_agreement
      frozen_prediction: "1.0 on the required sample (every 10th target plus every exceptional target)"
      observed: "1.0 at every cell on the required sample, and 1.0 on the FULL exhaustive sweep (0 disagreements found anywhere)"
    - note: >-
        This is a computational base-case theorem-check, not a
        heuristic-validation experiment; per the frozen success/falsification
        criteria, every falsification condition was checked mechanically and
        none was triggered (see analysis.md). No hypothesis, heuristic, or
        goal status is declared supported, validated, or closed by this
        report -- that judgment belongs to the Coordinator/Validator/Red Team
        on review.
  anomalies:
    - >-
      All 8 selected curves happened to have identical (A,B)=(1,1) across
      every tested prime and both m values -- a consequence of the
      deterministic search rule finding the smallest-radius pair
      satisfying nonsingularity + B-is-QR + ord(P0)>=2m-1 at every tested p,
      not a code defect (verified: (0,0) is singular and skipped at every
      p, so (1,1) is genuinely the first candidate at radius 1 to pass at
      every tested prime). Recorded because a reviewer might otherwise
      suspect the curve search is not actually varying by input.
    - see protocol_deviations above for the two implementation-development
      anomalies (metric-definition bug, m=4 c_{4,0} partial independence)
      and the BKK-001 consistency-check scope limitation.
