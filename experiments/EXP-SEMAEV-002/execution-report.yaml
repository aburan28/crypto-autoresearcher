  dispatch_authorization:
    decision_id: DEC-20260906-1c8b5d
    note: >-
      Cited as the operative Coordinator approval per this dispatch's
      explicit instruction. TASK-20260727-010's own authorized_by:
      "DEC-20260727-002" field is a known-false, immutable citation (per
      DEC-20260807-5adc24 / DEC-20260906-1c8b5d) and is left exactly as
      committed; it is used here only for its objective/inputs/constraints/
      budget/deliverables content, not as the authorization record.
    original_handoff: TASK-20260727-010
  implementation_commit: 53aac6d8875a3c5badd66cbd753a25027621f0f3
  implementation_commit_dirty: true
  implementation_commit_dirty_note: >-
    Shared multi-agent worktree; see any run manifest's code.dirty_detail
    for the exact untracked-path list at run time. No file this experiment
    reads or depends on was modified relative to this commit; only new,
    disjoint paths existed (this task's own new files plus unrelated
    concurrent tasks' new files). Execution-relevant files are pinned by
    sha256 in each run manifest.
  protocol_deviations:
    - >-
      Mid-implementation, pre-finalization: an early draft of the
      exhaustive-cell computation used interior support_fill==1.0 instead
      of the spec's actual "all 2^(m-1) box vertices present" (`saturated`)
      criterion for the nonexceptional_full_box_fraction metric. This
      produced a spurious apparent failure in every cell before any
      artifact was finalized or handed off; found and corrected by
      re-reading specification.yaml's exact metric definition. No delivered
      run was ever invalid due to this. Recorded per AGENTS.md rule 5/9
      (record every deviation, even ones caught before delivery). See
      RUN-SEMAEV-002-b and -c manifests for the full account.
    - >-
      corner_classes.py's m=4 base corner class c_{4,0}(t) has no
      literature closed form in the frozen specification and is computed by
      early zero-substitution into the (unexpanded) S4 resultant
      expression rather than a fully independent formula; the other three
      m=4 classes (c_{4,1}, c_{4,2}, c_{4,3}) are genuinely independent
      closed forms. Disclosed in analysis.md and corner_classes.py's module
      docstring; CTRL-SEM-CROSS-METHOD's 100% agreement result should be
      read with this partial-independence scope noted for m=4.
    - >-
      CTRL-SEM-CONSISTENCY-BKK001 was checked as a documented plausibility
      consistency check against EV-BKK-001's recorded (non-exhaustive,
      2-samples-per-instance) m=3 result at p=101, not as a literal
      target-for-target replay against EV-BKK-001's raw run artifacts
      (out of this dispatch's scope). No contradiction found under either
      reading; see RUN-SEMAEV-002-d manifest and raw-result.json.
  runs:
    completed:
      - id: RUN-SEMAEV-002-a
        status: completed_valid
        purpose: instance generation and calibration
        path: experiments/EXP-SEMAEV-002/runs/RUN-SEMAEV-002-a
      - id: RUN-SEMAEV-002-b
