experiment:
  id: EXP-SEMAEV-002
  hypothesis_id: H-SEMAEV-002
  goal_id: GOAL-CRYPTO-001
  version: 1
  title: >-
    Exhaustive computational theorem-check of the full-box target-sectioned
    Semaev Newton polytope claim at m = 3 and m = 4 with exceptional-target
    classification
  status: approved
  status_enactment_note: >-
    Enacted 2026-09-06 by the Coordinator: DEC-20260906-1c8b5d (2026-09-06)
    re-approved this experiment with a genuine, checkable Coordinator review,
    repairing the fabricated-citation defect DEC-20260807-5adc24 found on
    2026-08-07. Any dispatch of this contract must cite DEC-20260906-1c8b5d
    as authorized_by, not the original false citation, which remains visible
    and immutable in its original handoff. Prior value: paused (enacted
    2026-08-08, citing DEC-20260807-5adc24).
  frozen: true
  approved_by: coordinator
  approved_at: '2026-07-27'
  claim_tier: toy
  objective: >-
    Computationally verify the corner-coefficient induction claim of
    IDEA-20260723-006 in its base cases: for m in {3, 4} over several small
    prime fields (4 primes per m), enumerate ALL targets t in F_p, compute
    the target-sectioned Newton polytope of f_{m,t} = S_m(x_1,...,x_{m-1}, t)
    symbolically and exactly, classify every target as SATURATED (full box
    [0, 2^(m-2)]^(m-1)) or EXCEPTION (lost box vertex), and check the
    exceptional set against the pre-registered prediction
    Exc_m(E) = {x([r]P_0): 1 <= r <= m-1, affine} of size <= m-1 (exactly
    m-1 under the frozen selection rule). Controls re-derive a sample of
    polytopes by a second independent method and pin the known m=3
    literature corner identities as calibration. Both outcomes are
    reachable: exact confirmation at every cell, or one falsifying target.
  source_proposal: IDEA-20260723-006
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Target-sectioned Newton polytope and exceptional target set of the
      canonical Semaev family at m in {3, 4} over the tested small primes.
    formula: >-
      Newt(f_{m,t}) = [0, 2^(m-2)]^(m-1) for all t not in Exc_m(E);
      Exc_m(E) = {x([r]P_0): 1 <= r <= m-1, [r]P_0 affine} with
      |Exc_m(E)| = m-1 under the frozen selection rule (ord(P_0) >= 2m-1);
      corner classes c_{m,k} = c_{m-k,0}^(2^k), c_{m,m-2} = t^(D_m),
      c_{m,m-1} = 1; m=3 calibration: c_{3,0} = A^2-4*B*t, c_{3,1} = t^2,
      c_{3,2} = 1.
    source: >-
      Corner-coefficient induction of IDEA-20260723-006, normalization-locked
      in the proof packet recorded as EV-CRYPTO-009
      (coordination/goals/GOAL-CRYPTO-001/batches/BATCH-009/tasks/TASK-20260724-901/normalization_locked_proof.md)
      and decided in DEC-20260724-001; Semaev's summation-polynomial degree,
      symmetry, and leading-coefficient identity (KN-TECH-002; Semaev, IACR
      ePrint 2004/031 = KN-LIT-001); BKK/box-Bezout interpretation
      (KN-TECH-007).
  scale_relevance:
    tier: toy
    justification: >-
      An exhaustive exact computation at m in {3,4} over small primes
      replicates the induction's base cases computationally; it is not a
      proof of the all-m theorem and transfers to larger m or crypto scale
      only through the separate derivation track (EV-CRYPTO-009), never by
      extrapolation from these cells (AGENTS.md rule 7).
    correspondence: null
  inputs:
    cells:
      m_values: [3, 4]
      primes_per_m: [101, 103, 107, 211]
      curve_selection_rule: >-
        Per (m,p): deterministic search in increasing |A|,|B|; the first
        nonsingular curve (4A^3+27B^2 nonzero mod p) with B a quadratic
        residue mod p and ord((0,beta)) >= 2m-1 is selected; the curve,
        beta, and ord(P_0) are recorded as artifacts. If no curve is found
        within the search cap (|A|,|B| <= p), the cell is recorded
        instance_unavailable; success requires valid cells at >= 3 primes
        per m.
      targets: exhaustive -- every t in F_p per valid (m,p,E) cell
    computation_rule: >-
      S_m is computed directly over F_p (exact finite-field arithmetic, not
      integer lift and reduction); exact coefficient support defines the
      Newton polytope; no numerical thresholding.
    predicted_exception_sets: >-
      Computed independently of the polynomial code path by group
      arithmetic on E(F_p) via harness/toycurve.py: x([r]P_0) for
      1 <= r <= m-1, [r]P_0 affine.
  controls:
    - id: CTRL-SEM-M3-CALIBRATION
      method: Compute the m=3 corner classes c_{3,0}, c_{3,1}, c_{3,2} symbolically on every m=3 curve and compare with the pre-declared expected identities.
      pass_condition: c_{3,0} = A^2-4*B*t, c_{3,1} = t^2, c_{3,2} = 1 exactly on every tested m=3 curve; any mismatch stops the experiment as a derivation/normalization failure.
    - id: CTRL-SEM-CROSS-METHOD
      method: Re-derive a sample of polytope classifications by a second independent method -- direct leading-coefficient / corner evaluation via the recursive corner identities, independent of the convex-hull code -- on every 10th target plus every exceptional target per cell.
      pass_condition: 100% agreement between hull-based and corner-based classifications on the sample; any disagreement invalidates the affected cell's measurement (implementation unsoundness), not the hypothesis.
    - id: CTRL-SEM-PREDICTED-SET
      method: The observed exceptional set is compared against the predicted multiples x([r]P_0), 1 <= r <= m-1, computed by independent group arithmetic, never by polynomial vanishing.
      pass_condition: Set equality at every valid cell (no unexplained exception, no missed predicted exception).
    - id: CTRL-SEM-CONSISTENCY-BKK001
      method: m=3 results at p=101 are checked for consistency with EV-BKK-001's recorded m=3 saturation.
      pass_condition: Consistent, or any contradiction is recorded explicitly and escalated to review-breakthrough (AGENTS.md rule 12); never silently resolved inside this experiment.
  independent_variables:
    - decomposition_arity_m: "m in {3, 4} (D_m = 2^(m-2): 2 and 4)"
    - prime_field_p: "p in {101, 103, 107, 211} per m"
    - target_t: exhaustive over F_p within each cell
  metrics:
    primary:
      - nonexceptional_full_box_fraction: fraction of non-exceptional targets with all 2^(m-1) box vertices present (target exactly 1)
      - exceptional_set_cardinality: "|Exc_m(E)| per cell (bound <= m-1; expected exactly m-1 under the selection rule)"
      - exceptional_set_identity: boolean set equality with the predicted affine multiples x([r]P_0), 1 <= r <= m-1, per cell (target true everywhere)
      - m3_calibration_identity_match: boolean per m=3 curve (target true everywhere)
      - cross_method_classification_agreement: fraction on the re-derived sample (target 1.0)
    secondary:
      - per_cell_support_fill: interior (non-corner) support fill per cell, recorded descriptively
      - corner_class_values: evaluated c_{m,k}(t) tables per cell
      - degenerate_specializations: count and list of t inducing degree drops or vanishing normalization factors, recorded and disclosed
      - instance_unavailable_cells: cells failing the selection rule, if any
      - per_stage_wall_clock_seconds: timing per stage
  replication:
    seeds: []
    seed_policy: >-
      Deterministic exhaustive enumeration: every target in F_p is tested,
      the curve search rule is deterministic, and no random sampling
      occurs; seeds are not applicable and none are used.
    independent_instances: 8
    planned_runs:
      - id: RUN-SEMAEV-002-a
        purpose: "Instance generation and calibration: frozen curve search per (m,p); compute S_3 and S_4 over F_p; verify the m=3 corner identities; record P_0, ord(P_0), and predicted exception sets."
      - id: RUN-SEMAEV-002-b
        purpose: "Exhaustive m=3 enumeration at every valid (3,p) cell: exact support, hull classification, corner-based classification, exception-set comparison."
      - id: RUN-SEMAEV-002-c
        purpose: "Exhaustive m=4 enumeration at every valid (4,p) cell: exact support, hull classification, corner-based classification, exception-set comparison."
      - id: RUN-SEMAEV-002-d
        purpose: Cross-method audit aggregation, EV-BKK-001 consistency check, outcome classification, analysis and execution report.
    expected_run_count: 4
  budget:
    wall_clock_seconds_per_run: 1800
    total_wall_clock_seconds: 6300
    total_cpu_hours: 1.75
    maximum_memory_gb: 4
    maximum_runs: 4
    stages:
      - id: instance_generation_and_calibration
        wall_clock_seconds: 1800
        stop_rule: Any m=3 calibration mismatch stops the experiment as derivation_failure; a cell failing the selection rule after the search cap is recorded instance_unavailable and the run continues.
      - id: exhaustive_m3_enumeration
        wall_clock_seconds: 1800
        stop_rule: Stop at 1800s recording completed cells; unfinished cells are cancelled_by_budget and reported as incomplete, never extrapolated.
      - id: exhaustive_m4_enumeration
        wall_clock_seconds: 1800
        stop_rule: Stop at 1800s recording completed cells; unfinished cells are cancelled_by_budget and reported as incomplete, never extrapolated.
      - id: cross_method_audit_and_classification
        wall_clock_seconds: 900
        stop_rule: Stop without interpretation if any required artifact is incomplete.
  stopping_rules:
    - Stop as derivation_failure on any m=3 calibration identity mismatch.
    - Stop and record failed_infrastructure on any symbolic-computation crash; a crash is not evidence for or against the hypothesis (AGENTS.md rule 5).
    - Stop at 1800s per run and 6300s total wall clock; record remaining planned work as cancelled_by_budget.
    - Stop after the four planned runs; no exploratory fifth run and no extension to m >= 5 or larger primes without an amendment.
    - Stop on any contradiction with EV-CRYPTO-009 or EV-BKK-001: record it explicitly and escalate per AGENTS.md rule 12; do not resolve it in-run.
  invalidation_rules:
    - Any run missing its manifest, exact command, environment, stdout, stderr, or raw-result file is invalid (run-integrity failure, not a scientific result).
    - Any run with a dirty code revision in its manifest is invalid.
    - A cross-method disagreement invalidates the affected cell's measurement (implementation unsoundness), not the hypothesis.
    - A cell computed by integer lift and reduction instead of directly over F_p is invalid (specialization artifact risk).
    - Interior-monomial losses are recorded but never counted as exceptions; only box-vertex losses classify EXCEPTION.
  success_criterion: >-
    At every valid tested (m,p,E) cell: every target outside the predicted
    exceptional set has all 2^(m-1) box vertices present in supp(f_{m,t})
    (full-box Newton polytope); the observed exceptional set equals
    {x([r]P_0): 1 <= r <= m-1, affine} with |Exc| <= m-1 (exactly m-1 under
    the frozen selection rule); the m=3 calibration identities hold exactly
    on every m=3 curve; the two independent classification methods agree on
    100% of the re-derived sample including every exceptional target; and
    no contradiction with EV-CRYPTO-009 or EV-BKK-001 is found.
  falsification_criterion: >-
    Any one of: a single non-exceptional target loses a box vertex at any
    tested cell; the exceptional set exceeds m-1 or contains a target
    outside the predicted multiples; a predicted affine multiple x([r]P_0),
    1 <= r <= m-1, is saturated; or the m=3 calibration identities fail
    (recorded as a derivation/normalization failure, not as changed
    literature). A contradiction with EV-CRYPTO-009 or EV-BKK-001 is
    escalated to review-breakthrough (AGENTS.md rule 12). Infrastructure
    failure falsifies nothing.
  required_artifacts:
    - experiments/EXP-SEMAEV-002/specification.yaml
    - experiments/EXP-SEMAEV-002/implementation/newton_sections.py
    - experiments/EXP-SEMAEV-002/implementation/corner_classes.py
    - experiments/EXP-SEMAEV-002/implementation/exception_sets.py
    - experiments/EXP-SEMAEV-002/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-SEMAEV-002/runs/<RUN-ID>/command.txt
    - experiments/EXP-SEMAEV-002/runs/<RUN-ID>/environment.json
    - experiments/EXP-SEMAEV-002/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-SEMAEV-002/runs/<RUN-ID>/summary.json
    - experiments/EXP-SEMAEV-002/runs/<RUN-ID>/stdout.log
    - experiments/EXP-SEMAEV-002/runs/<RUN-ID>/stderr.log
    - experiments/EXP-SEMAEV-002/analysis.md
    - experiments/EXP-SEMAEV-002/execution-report.yaml
    - ledger/hypotheses/H-SEMAEV-002.yaml
  assigned_to: executor
  inference_receipt:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: null
    fallback_used: false
    authorization_ref: null
