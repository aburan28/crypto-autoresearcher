experiment:
  id: EXP-SEMAEV-002
  hypothesis_id: H-SEMAEV-002
  version: 1
  title: Independent m=2 clean-room replication of factor-base yield (structured vs random)
  status: approved
  objective: >-
    Independently test, with an implementation separate from the campaign's
    semaev_tree.py, whether structured m=2 factor bases beat a matched random
    base on S_3 decomposition yield over toy prime fields, as a clean-room
    cross-check of the m=3 rejected_scoped finding H-FB-001 / EXP-FB-001.
  inputs:
    instance_generator: harness.toycurve.generate_instance
    bits: [12, 14, 16]
    seeds: [1, 2, 3]
    factor_base_size: 20
    target_count: 300
  controls:
    - matched random factor base of equal size is the null for each instance
    - identical target set and enumeration across all three base geometries
  independent_variables: [factor_base_geometry]
  metrics:
    primary: [ratio_interval_over_random, ratio_ap_over_random]
    secondary: [yield_random, yield_interval, yield_ap]
  replication:
    seeds: [1, 2, 3]
    independent_instances: 9
  budget:
    wall_clock_seconds_per_run: 60
    total_cpu_hours: 0.1
    maximum_memory_gb: 2
    maximum_runs: 9
  stopping_rules:
    - stop a run at 60s wall clock (record as resource_exhaustion)
  invalidation_rules:
    - any counted decomposition whose certificate fails independent verification
      invalidates the run
  success_criterion: >-
    All tested instances show structured/random yield ratios <= 1.5x
    (independently corroborates H-FB-001's rejection at m=2).
  falsification_criterion: >-
    Any instance with a structured/random yield ratio > 1.5x weakens the
    corroboration and flags an m=2 vs m=3 discrepancy for follow-up.
  required_artifacts:
    - per-run manifest, command, environment, stdout, stderr, raw-result
    - verified certificate for at least one decomposition per run where yield>0
  assigned_to: executor
  approved_by: coordinator
