      or handed off): an earlier draft of _exhaustive_cell computed
      "nonexceptional_full_box_fraction_ok" from interior support_fill==1.0
      instead of the spec's actual criterion (all 2^(m-1) box vertices
      present, i.e. the `saturated` flag). This produced a spurious
      apparent falsification (nonexceptional_full_box_fraction_ok=False in
      every cell) caused entirely by permitted interior-monomial losses
      (explicitly allowed by specification.yaml's invalidation_rules), not
      by any lost box vertex. Found and fixed by re-reading the spec's exact
      metric definition before finalizing any run artifact; the corrected
      code (committed to this run's sha256-pinned implementation) uses the
      `saturated` flag. No finalized/handed-off run was ever invalidated by
      this; it is recorded here per AGENTS.md rule 5/9 (record every
      deviation) even though it never reached a delivered artifact.
