experiment:
  id: EXP-ICPERF-779f11
  hypothesis_id: null
  hypothesis_id_note: >-
    Explicitly null, not omitted. The six rounds were designed outside this
    ledger's hypothesis lifecycle and score no prediction of any H-* record
    here. Naming H-ICPERF-cc4847 or H-ICPERF-2c57cc would invite exactly the
    inference this record cannot support -- the same category error
    CORR-20260916-b35a05 corrects.
  version: 1
  title: >-
    EXTERNAL: the Riemann-Roch decomposition-oracle panel on ECC2K-130 --
    solver separation, null-object control, method ceiling, batch amortisation
    and subspace-structure certificate
  status: external_completed
  status_note: >-
    `external_completed`, deliberately not `completed`. The work is finished and
    its artifacts are content-bound, but the status vocabulary this ledger uses
    for its own contracts carries an approval and review history that this
    record does not have. approved_by is absent because no Coordinator approved
    it; AGENTS.md rule 1 gives that field one legitimate value and inventing it
    here would be worse than leaving it out.
  external:
    repository: github.com/aburan28/crypto
    commit: 50ea716
    commit_note: >-
      Advisory. The hashes in EV-ICPERF-10c5fc's external_provenance are
      authoritative, per CLAUDE.md "Archive receipts bind to CONTENT first" --
      which matters concretely in that repository, where two earlier pull
      requests were squash-merged and made recorded commit shas unreachable.
    frozen_contracts:
      - research/nagao_relations/solver_10/contract.json
      - research/nagao_relations/solver_11/contract.json
      - research/nagao_relations/solver_12/contract.json
      - research/nagao_relations/solver_13/contract.json
      - research/nagao_relations/solver_14/contract.json
      - research/nagao_relations/solver_15/contract.json
    freeze_discipline: >-
      Each round's contract was written before that round executed. That is what
      makes the partially falsified prediction in round 13 reportable as a
      falsification rather than as a revised expectation.
    research_note: RESEARCH_ECC2K130_RR_SOLVER_PANEL.md
  objective: >-
    Determine whether a Riemann-Roch (Nagao) point-decomposition oracle, encoded
    in L(4O) as f = x^2 + ax + c + by with
    div(f) = (P_1)+(P_2)+(P_3)+(-R)-4(O), gives index calculus a route below rho
    on the exact Certicom ECC2K-130 curve, by measuring it against three
    controls: Semaev-via-SAT on matched targets under identical factor-base
    constraints and budgets, brute-force pair enumeration as a NULL OBJECT, and
    rho's own multi-target amortisation law.
  rounds:
    - id: solver_10
      what: >-
        Solver separation. 128 trials, 0 errors, 28 relations independently
        re-derived by a verify() that rebuilds each point from its abscissa and
        tries all eight sign patterns.
      result: 32/32 for Riemann-Roch against 0/32 for Semaev-via-SAT at d = 6
    - id: solver_11
      what: batch amortisation share of the relation search
      result: 0.12% at d = 6, 0.07% at d = 7
    - id: solver_12
      what: NULL-OBJECT CONTROL, brute-force pair enumeration
      result: >-
        0.494x the field operations of the RR quadratic-image search at d = 6,
        on identical solution sets. The d = 7 ratio is WITHDRAWN by that round's
        own CORRECTION.md -- it divided a completed enumeration by timed-out
        arms, which reads a timeout as negative mathematical evidence and breaks
        AGENTS.md rule 3. Only d = 6 is citable.
    - id: solver_13
      what: method ceiling, RR candidates against |F|^2/2
      result: >-
        3.00, 3.12, 2.33, 1.92, 1.99 at d = 4..8; operation ratio 2.83 -> 1.55.
        The frozen prediction said "roughly flat" and is PARTIALLY FALSIFIED.
    - id: solver_14
      what: subspace-structure certificate, first attempt
      result: >-
        DEFECTIVE AND SUPERSEDED, not deleted. Its DEFECT.md records that
        plantedTarget() enumerated all 2^d - 1 abscissas and the round was
        killed by its author at d = 12. No number from it is cited anywhere.
    - id: solver_15
      what: subspace-structure certificate, sound re-run with sampling
      result: >-
        Affine-span dimensions 71, 97, 123 at d = 4, 5, 6; span saturates the
        full 131 from d = 7 onward, confirmed by direct measurement at d = 45.
  metrics:
    - relations returned per matched target, by solver arm
    - field operations, RR quadratic-image search against pair enumeration
    - ratio of RR candidates to |F|^2/2
    - amortisable share of the relation search across a target batch
    - affine-span dimension of the Weil-descended S_4 value set over V^3
  success_criterion: null
  success_criterion_note: >-
    Explicitly null, not omitted. Rounds 10-13 and 15 are OBSERVATIONAL: they
    measure an oracle's cost against controls and have no criterion to succeed
    or fail on. Round 13 did carry a frozen prediction, which was partially
    falsified and is reported against rather than around.
  budget:
    wall_clock_cap_seconds: null
    memory_cap_bytes: null
    budget_note: >-
      Null because this program set no budget for work it did not commission.
      Per-round caps live in the external contracts; several d = 7 arms of round
      10 reached theirs and are recorded as timeouts, never as negative
      mathematical evidence.
  scope:
    claim_tier: toy
    curve: >-
      exactly ECC2K-130, K_0: y^2 + xy = x^3 + 1 over GF(2^131) in a permuted
      type-II optimal normal basis, #E = 4r with r the 129-bit prime
      680564733841876926932320129493409985129
    factor_base_dimension: >-
      d = 4..8 for every relation-search and cost-ratio number. The d = 45 and
      d = 80 figures are span dimensions for the certificate question only and
      carry no relation-search cost.
    summands: >-
      m = 3 for the solver panel. The m = 4 figures cited by EV-ICPERF-10c5fc
      are the free-oracle floor (derivation) and an exact-kernel computation,
      not relation search.
    what_it_does_not_touch:
      - >-
        Any other curve, including the other Certicom challenge curves and the
        FIPS binary curves.
      - >-
        Any rho measured on this host. The 2^60.8090 reference is a published
        figure, so every "versus rho" statement is arithmetic against it.
  review_status:
    independent_review_in_this_program: none
    external_adversarial_review: >-
      Two adversarial reviews ran in the producing session and both found real
      errors: an arity error claiming the m = 4 prize of 2^56.40 for an m = 3
      object whose floor is 2^68.58, and a headroom overstatement of 2^11.44
      that silently assumed a materialised orbit-union base unavailable for an
      F_2-subspace. Both corrections are folded into EV-ICPERF-10c5fc. That is
      not this ledger's independence check and is not offered as one.
  owner: coordinator
  created_at: '2026-09-17'
