# EXPERIMENT CONTRACT -- EXP-QLWE-65244f (review_required, unapproved, zero runs).
experiment:
  id: EXP-QLWE-65244f
  hypothesis_id: H-QLWE-be6b9f
  derived_from_idea: IDEA-20261018-451388
  question_id: RQ-QLWE-1c4a3b
  goal_id: GOAL-QLWE-291164
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Exact log-unit CVP on short-element targets at k = 4..7
  objective: Whether Part III's Voronoi claim holds at the conductors where it is asserted
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: SageMath 10.x, fpylll exact CVP, NumPy
    parameters: k in {4,5,6,7}; 1000 targets per (k, law); laws ternary and discrete Gaussian
      sigma=1.0
    procedure: >-
      1. Build log-unit basis. 2. Sample short elements, compute log embeddings projected
      to trace-zero hyperplane. 3. Exact CVP. 4. Record distance and zero-indicator. 5. Controls.
  controls:
  - >-
    null/negative: targets drawn uniformly on the span of the log-unit lattice (Voronoi-uniform),
    expected fraction inside origin cell = 1/index-related baseline
  - >-
    positive: targets = log-embedding of short g times a random unit of large log-norm, which
    must NOT decode to 0
  - 'A/A: two sampling seed blocks of short elements'
  independent_variables:
  - target_law
  - conductor_k
  metrics:
    primary:
    - fraction decoding to origin
    secondary:
    - CVP distance / sqrt(n)
    - L-infinity distance
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: fraction inside origin cell at k>=4
    formula: Luo claims 1 (all targets)
    source: KN-LIT-1742 abstract
  scale_relevance:
    tier: toy
    justification: 'n <= 64; transfer: claim is stated for every k >= 4 so small k is in scope'
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 16
    maximum_runs: 32
  stopping_rules:
  - stop at k where exact CVP exceeds 1 h per target
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - positive control decoding to 0 > 5% invalidates
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    C2 shows fraction >= 0.95 at every k (P1 reproduced) and C1 separates short from uniform
    targets, AA1 noise floor
  falsification_criterion: >-
    C2 shows fraction <= 0.5 at some k >= 4 (P1 falsifies the claim as written) or P2 relative
    error > 25%
  decision_impact:
    on_positive: >-
      Part III's step recorded as reproduced at small k; adjudication of KN-LIT-1743 proceeds
      to the Part IV tower step
    on_negative: >-
      Part III's Voronoi claim recorded as not established as written with the measured fraction;
      Part IV adjudication cites the broken premise
  variable_ledger:
    independent:
    - name: target_law
      levels:
      - short_ternary
      - short_gaussian
      - uniform_span_null
      - planted_unit_positive
    - name: conductor_k
      levels:
      - '4'
      - '5'
      - '6'
      - '7'
    factors:
    - name: sampling_seed_block
      treatment: randomized
      value: 2 blocks x 500
      how: rng seeds
    - name: log_precision_bits
      treatment: fixed
      value: '200'
      how: Sage RealField(200)
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - short_ternary
      - uniform_span_null
      differs_in:
      - target_law
      design: one_factor
    - id: C2
      arms:
      - short_ternary k=4..7
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - short_ternary block A
      - short_ternary block B
      differs_in:
      - sampling_seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-451388.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-451388.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml (frozen protocol, tool versions, seeds, git commit)
  - raw-result.json (per-trial records)
  - voronoi_fraction.csv
  - distance_hist.png
  - report.pdf
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
