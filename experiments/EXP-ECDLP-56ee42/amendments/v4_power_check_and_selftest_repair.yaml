  # ===========================================================================
  # CHANGE 10 (review attack_1, required_controls item 6 / objections item 1):
  # soften the "regardless of what c turns out to be" overclaim to cite the
  # now-available V3-RA-1 measurement.
  # ===========================================================================
  change_10_c2a_weil_bound_wording_softening:
    id: V4-CHG-10
    closes: >-
      Review required_controls item 6 / objections item 1 (attack_1,
      finding_on_the_bound_and_the_smuggled_constant): "the amendment's
      sentence 'a qualitatively different regime... regardless of what c
      turns out to be' is not rigorously supported by the bound alone: for
      a sufficiently large (but still O(1)) constant c, '0.5 - c*0.033' is
      negative and the bound would be VACUOUS ... Recommend softening that
      sentence to '(V3-RA-1) confirms a qualitatively different regime'
      rather than asserting it follows from the bound alone."
    old_text_superseded_verbatim: >-
      Even at the smallest rung, the guaranteed floor on each fiber's
      share of N is at worst on the order of 0.5 - c*0.033 for an
      undetermined O(1) constant c from the RECALLED bound -- a
      qualitatively different regime from top_bit's 1.6e-7 to 2.4e-4
      fractions, by many orders of magnitude, regardless of what c turns
      out to be.
    new_text_softened: >-
      Even at the smallest rung, the guaranteed floor on each fiber's
      share of N implied by the bound ALONE is at worst on the order of
      0.5 - c*0.033 for an undetermined O(1) constant c from the RECALLED
      bound; taken by itself, this does not rule out a sufficiently large
      (but still O(1)) c making the bound vacuous, which is a real, if
      minor, overclaim in this amendment's original wording (identified by
      the amendment-v3-review's attack_1 and corrected here, amendment v4
      V4-CHG-10). The qualitative claim -- that C2a occupies a
      qualitatively different, non-sparse regime from top_bit's 1.6e-7 to
      2.4e-4 minority-fiber fractions -- is NOT asserted here on the
      strength of the bound's shape alone. It is CONFIRMED by V3-RA-1's
      actual measurement (experiments/EXP-ECDLP-56ee42/reviews/
      amendment-v3-review/report.yaml, attack_1_c2a_weil_bound_and_actual_
      computation; raw output experiments/EXP-ECDLP-56ee42/reviews/
      amendment-v3-review/attack1_output.txt), independently computed by
      exact Legendre-symbol classification of every x in [0, p) against
      y^2 = x^3 + x + b using only public (p, b, N): minority-fiber
      fractions of 0.498890 (T17) to 0.499994 (T27) at all six frozen
      rungs -- 2.0e3x to 3.1e6x larger than top_bit's measured minority
      fractions at matched rungs -- with the deviation from exact 1/2
      shrinking monotonically as p grows (0.00110973 at T17 down to
      0.00000597 at T27), exactly the qualitative trend originally
      claimed, now established by direct computation rather than by
      appeal to the bound's shape.
    scope_note: >-
      This is a wording correction to the amendment's own prose only. It
      does not change C2a's formula, gate, blocking status, or any
      required_artifact; V3-RA-1 (the required exact-per-rung verification
      v3 already demanded before C2a is relied on) is hereby treated as
      DISCHARGED by the review's own computation, per DEC-20260906-da1212's
      rationale, and this amendment records the citation that discharge
      rests on directly in the contract text rather than leaving the
      "regardless of c" sentence as the load-bearing claim.

