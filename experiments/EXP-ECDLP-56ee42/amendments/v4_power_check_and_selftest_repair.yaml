  # ===========================================================================
  # CHANGE 5 (review attack_3): selftest.py falls outside v3's named T3-repair
  # scope and will break, or assert a now-false fact, once v3's rename is
  # applied.
  # ===========================================================================
  change_5_selftest_repair:
    id: V4-CHG-5
    closes: >-
      Review required_controls item 4 / objections item 5 (attack_3):
      "selftest.py hard-codes the CURRENT BROKEN recursion as ground truth
      (including a 'frozen audit fact' of exactly 135/256 mismatches against
      the literal block-count definition) and is neither a 'pipeline file'
      nor a numbered stage, so it falls outside both the required_naming_and_
      wiring instruction and required_rerun_before_stage_3's named artifact
      set -- it will raise AttributeError or assert a now-false fact if run
      unmodified after the amendment's rename."
    verified_directly_by_this_coordinator: >-
      Read experiments/EXP-ECDLP-56ee42/implementation/selftest.py in full
      (current committed content, not paraphrased from the review). Confirmed
      test_digit_statistics (lines 22-65) builds its own reference list `r`
      via the BROKEN recursion (lines 35-37), asserts
      E.rudin_shapiro_sign(x) == r[x] for x in range(256) (line 39, ground-
      truth role), and separately asserts a literal-block-count mismatch
      count of exactly 135 of 256 against that same broken `r` (lines 40-43,
      commented "frozen audit fact") -- exactly as the review describes. Once
      v3's required rename (rudin_shapiro_sign -> _rudin_shapiro_signflip_
      variant, rudin_shapiro_sign_array -> _rudin_shapiro_signflip_variant_
      array) is applied to estimator.py, line 39's call to
      E.rudin_shapiro_sign raises AttributeError (name no longer exists); if
      an Executor instead patches only the name without changing the test's
      logic, the true implementation (rudin_shapiro_sign_true, the literal
      block-count definition per v3's V3-CHG-2) would show 0 mismatches
      against itself trivially or -- if compared against the OLD recursion
      as v3 leaves it -- would still assert the WRONG fact (135 mismatches
      against a function that is no longer ground truth). Neither v3's
      required_naming_and_wiring ("wire in ... whichever pipeline file
      currently calls rudin_shapiro_sign_array") nor its
      required_rerun_before_stage_3 (naming only RUN-ECDLP-56ee42-S0/-S1/-S2)
      names selftest.py, which is neither a pipeline file nor a numbered
      stage -- confirmed, by this Coordinator's own read, to be a real,
      currently-passing, executable validation script, distinct from
      stage0.py/stage1.py/stage2.py.
    old_text_superseded_verbatim_selftest_py_lines_31_47: |
      # Rudin-Shapiro: the standard recursion r(0)=r(1)=1, r(2n)=r(n),
      # r(2n+1)=-r(n) (n>=1).  (The contract's 'count of block 11' is a
      # heuristic characterization that does not exactly match; see the
      # interpretation note in estimator.rudin_shapiro_sign.)
      r = [1, 1]
      for m in range(2, 256):
          r.append(r[m >> 1] if m % 2 == 0 else -r[m >> 1])
      for x in range(256):
          assert E.rudin_shapiro_sign(x) == r[x], x
      # the literal block-count '11' is kept for audit and differs (documented)
      n_diff = sum(1 for x in range(256)
                   if (1 if E._rudin_shapiro_u(x) % 2 == 0 else -1) != r[x])
      assert n_diff == 135, n_diff  # frozen audit fact
      xs = np.arange(5000, dtype=np.uint32)
      arr = E.rudin_shapiro_sign_array(xs)
      for x in range(0, 5000, 13):
          assert arr[x] == E.rudin_shapiro_sign(x), x
    old_text_location_note: >-
      This is the exact, complete, currently committed content of
      selftest.py's test_digit_statistics function between the Thue-Morse
      block (which ends at the blank line 30) and the popcount-mod-4 block
      (which begins at line 49, "# popcount mod 4"). Nothing before line 31
      or after line 47 is touched by this change.
    new_text_replacement: |
      # Rudin-Shapiro TRUE ground truth is the literal block-count '11'
      # definition (OEIS A020985, specification.yaml's own arms.T3 text),
      # implemented by _rudin_shapiro_u (scalar) and rudin_shapiro_sign_true
      # / _array (per amendment v3, V3-CHG-2 / V3-RA-3).  PRIMARY
      # correctness check: rudin_shapiro_sign_true(_array) against
      # _rudin_shapiro_u, 0 mismatches required.  This supersedes the old
      # test's use of the now-retired broken recursion as ground truth
      # (amendment v4, V4-CHG-5).
      for x in range(256):
          assert E.rudin_shapiro_sign_true(x) == (
              1 if E._rudin_shapiro_u(x) % 2 == 0 else -1), x
      xs = np.arange(5000, dtype=np.uint32)
      arr = E.rudin_shapiro_sign_true_array(xs)
      for x in range(0, 5000, 13):
          assert arr[x] == E.rudin_shapiro_sign_true(x), x

      # RETIRED (v3-renamed) recursion: kept ONLY as a self-consistency /
      # audit-trail regression check on the historical, now-unused
      # _rudin_shapiro_signflip_variant(_array) pair.  This block does NOT
      # test against ground truth and its passing must never be read as
      # validating T3; it exists so the audit trail can detect if the
      # retired function's own behaviour is ever accidentally changed.
      r = [1, 1]
      for m in range(2, 256):
          r.append(r[m >> 1] if m % 2 == 0 else -r[m >> 1])
      for x in range(256):
          assert E._rudin_shapiro_signflip_variant(x) == r[x], x
      arr_variant = E._rudin_shapiro_signflip_variant_array(xs)
      for x in range(0, 5000, 13):
          assert arr_variant[x] == E._rudin_shapiro_signflip_variant(x), x
      # Historical audit fact, PRESERVED under the renamed identifier: the
      # retired variant differs from the TRUE block-count definition at
      # exactly 135 of the first 256 values.  This is the SAME fact the
      # pre-v4 test recorded (only the identifier and its "ground truth"
      # status have changed; the underlying divergence count is unchanged
      # because neither function's code changes under this amendment).
      n_diff = sum(1 for x in range(256)
                   if E._rudin_shapiro_signflip_variant(x)
                   != E.rudin_shapiro_sign_true(x))
      assert n_diff == 135, n_diff  # frozen audit fact, retired-variant-vs-truth
    application_note_for_the_executor: >-
      This replaces exactly the old_text_superseded_verbatim block above,
      in place, inside test_digit_statistics, once estimator.py carries
      rudin_shapiro_sign_true / _array (V3-CHG-2) and the renamed
      _rudin_shapiro_signflip_variant / _array (V3-CHG-2's required_naming_
      and_wiring). No other line of selftest.py is touched by this change:
      the Thue-Morse block above it, and the popcount-mod-4 / top-bit-fiber
      blocks below it, are unaffected and unchanged. print("  digit
      statistics: OK") at the function's end (line 65) is unaffected.
    required_artifact: >-
      REQUIRED_ARTIFACT V4-RA-1: selftest.py's test_digit_statistics, after
      this replacement, PASSES (0 mismatches on the primary
      rudin_shapiro_sign_true-vs-_rudin_shapiro_u check, 0 mismatches on the
      retained variant's self-consistency check, n_diff == 135 on the
      retired-variant-vs-truth audit fact) before selftest.py is treated as
      passing for any purpose, and specifically before the change_2 Stage
      0-2 re-run (V3-RA-3) is treated as validated. This is required in
      addition to, not instead of, V3-RA-3's existing x in [0, 200000) /
      OEIS x=0..15 / [0, 2^20) array-vs-scalar checks -- selftest.py's
      checks are a distinct, smaller-range regression artifact that must
      also pass, since it is a real gate an Executor or future contributor
      will actually run (`python3 selftest.py`).

  # ===========================================================================
  # CHANGE 6 (review attack_2, required_controls item 1): pin V3-RA-2's seed
  # and replication count.
  # ===========================================================================
  change_6_power_check_seed_and_replication:
    id: V4-CHG-6
    closes: >-
      Review required_controls item 1 / objections item 2 (attack_2,
      finding_gap_1_unpinned_seed_in_the_power_check): "required_synthetic_
      power_check (V3-RA-2) ... specifies NEITHER a seed nor a replication
      count beyond one realization of 8 draws per condition per rung ...
      the regime decision has a hidden researcher degree of freedom ...
      Required control: pin an explicit seed (or run N >> 1 independent
      repetitions ... and require the separation criterion to hold in a
      stated fraction of them, e.g. all of N=20 draws)."
    old_text_superseded_verbatim_v3_method: >-
      For each of the six rungs, using ONLY public curve/ladder
      parameters (no cache, no k, no real enumeration needed beyond what
      V3-RA-1 already computes): place n = N total positions; synthesize
      a NULL placement of m0 "fiber-0" and m1 "fiber-1" values (m0, m1
      from V3-RA-1's exact per-rung counts, each approximately N/2) at
      UNIFORMLY RANDOM positions -- the stand-in for "no genuine dlog
      structure", exactly as J2's own script used for the sparse case.
      Compute, over 8 draws each: (i) max ratio under a genuine full
      random permutation (mirrors the frozen NULL-2 protocol exactly);
      (ii) max ratio under the DEGENERATE "reading 1" (fix ALL max-tied
      positions) case -- for THIS binary (2-valued) statistic this is
      mathematically IDENTICAL to the identity/no-op permutation (see
      change_3 below: permuting only among positions that share one
      value cannot change any observable value), so (ii) needs no
      simulation: report ratio = 1.0 exactly, and record this identity
      explicitly rather than silently omitting the reading; (iii) max
      ratio under "reading 2" (fix exactly one arbitrary max-tied
      position, permute everything else), the non-degenerate case for a
      binary statistic per change_3's disambiguation.
    old_text_superseded_verbatim_v3_required_outcome: >-
      The check must show, and the run record must state PRE-REGISTERED
      (before any real calibration data is seen), which of the two
      combination_rule_for_C2 regimes applies: C2a is BLOCKING iff, across
      all six rungs, max(genuine-full-shuffle ratio) < min(reading-2
      ratio) - 0.05 (the same 0.05 effect-size convention this contract
      already uses for the LEAD branch). If that separation is not
      achieved -- plausible, since fixing one point out of ~N/2 is a mild
      perturbation and may itself be close to a no-op at these n -- C2a
      reports as DIAGNOSTIC ONLY per the combination rule, and this
      finding (power achieved / power not achieved, with the actual
      numbers) is itself a required_artifact, not an outcome to be
      smoothed over or silently downgraded after the fact.
    chosen_disposition: >-
      REPLICATION (N=20 independent repetitions, unanimity required), not a
      single fixed seed. Justification: the check's purpose is to measure
      whether C2a's power (its ability to separate a genuine shuffle's
      collapse ratio from a known-broken shuffle's ratio) is real at the
      achieved (n, m), which is fundamentally a statistical power question
      -- a single realization of "8 draws under each of two conditions"
      cannot itself distinguish "reliable separation" from "one lucky draw",
      regardless of whether its seed is pinned. Pinning a single seed closes
      the review's REPRODUCIBILITY objection (anyone re-running it gets the
      identical result) but not its POWER objection (whether that single
      result generalizes). N=20 independent repetitions, each with its own
      deterministically derived seed (so the whole schedule remains fully
      pinned and reproducible, closing both objections at once), and a
      REQUIRED PASS FRACTION of 20/20 (100%, not merely >=90%), is chosen
      because the two possible errors are asymmetric: wrongly downgrading
      C2a to diagnostic-only (a false negative on power) costs only that
      C2's evidentiary weight narrows to C2b -- v3's own combination_rule_
      for_C2 already treats this as a safe, non-catastrophic fallback (C2b
      alone still blocks C2 on a proven-magnitude statistic); wrongly
      keeping C2a blocking when its true power is marginal (a false
      positive) costs C2 gating Stage-3 dispatch on unreliable evidence,
      the more expensive error given C2's role. Requiring unanimity (not a
      90% majority) keeps the blocking designation conservative in the
      direction that matters: a single repetition failing to separate is
      itself informative that the separation is not robust at this (n, m),
      and is a legitimate basis for DIAGNOSTIC-ONLY, not something to be
      outvoted by 19 successful repetitions.
    seed_schedule: >-
      A NEW, separate namespace from the real NULL-2 seed schedule
      (0x56EE42 + 1000 + 10*arm_index + shuffle_index, arm_index in 0..7),
      chosen to make collision structurally impossible rather than merely
      unlikely, since this check synthesizes PURELY SYNTHETIC null data and
      is never applied to real curve points: for repetition rep in 0..19
      and rung_idx in 0..5 (T17=0, T19=1, T21=2, T23=3, T25=4, T27=5, per
      the frozen ladder order): (a) PLACEMENT seed (drives the uniformly
      random assignment of the m0/m1 synthetic fiber-0/fiber-1 values to
      positions): seed_placement(rep, rung_idx) = 0x56EE42 + 90000 +
      1000*rep + 10*rung_idx. (b) SHUFFLE seeds (drive each of the 8 draws
      under each of the two conditions -- genuine full shuffle and reading-2
      broken shuffle -- per rung per repetition), for draw_idx in 0..7:
      seed_genuine(rep, rung_idx, draw_idx) = 0x56EE42 + 190000 + 1000*rep +
      10*rung_idx + draw_idx; seed_reading2(rep, rung_idx, draw_idx) =
      0x56EE42 + 290000 + 1000*rep + 10*rung_idx + draw_idx. All three
      ranges (90000+, 190000+, 290000+ offsets) are disjoint from each
      other and from the real NULL-2 range (1000-1077) and from any future
      arm's seed range under change_4's "next unused integer, appended"
      rule, by inspection of the fixed offsets and the bounded rep
      (0..19) x rung_idx (0..5) x draw_idx (0..7) ranges (max index within
      each block is 1000*19+10*5+7 = 19057, far below the next block's
      100000 spacing).
    replication_and_pass_fraction: >-
      The ENTIRE synthetic power check (synthetic null placement plus 8
      genuine-shuffle draws plus 8 reading-2 draws, per rung) is repeated
      N=20 times independently, rep = 0..19, using the seed_schedule above
      (a fresh, independently drawn synthetic placement AND a fresh set of
      16 shuffle draws per repetition, not the same placement re-shuffled).
      For each rung, C2a's power is judged SEPARATED in a given repetition
      iff that repetition's max(genuine-full-shuffle ratio) <
      min(reading-2 ratio) - 0.05 (v3's unchanged 0.05 effect-size
      convention). C2a is BLOCKING (across the whole check) iff separation
      holds in ALL 20 of 20 repetitions at EVERY rung actually computed
      (see the T27 carve-out below); if separation fails in even one
      repetition at one rung, C2a is DIAGNOSTIC ONLY, per v3's unchanged
      combination_rule_for_C2.
    t27_carve_out_interaction: >-
      v3's disclosed_limitation already permits T27's power-check
      simulation to be marked NOT-COMPUTED under budget/memory constraints
      (T27's own COMPARATOR/T1-T4 measurements are unaffected). This
      replication requirement multiplies T27's compute cost by
      approximately 20x if attempted; if 20 repetitions at T27 cannot be
      run within budget, the regime decision may be made on T17-T25's full
      20-repetition results alone, with T27 explicitly marked NOT-COMPUTED
      for the power-check specifically -- exactly as v3 already allows for
      a single repetition, unchanged by this amendment. This is a disclosed
      infrastructure risk (AGENTS.md rule 3: a timeout/memory failure here
      is not evidence, for or against C2a's power), not a result.
    required_committed_content: >-
      Committed alongside the regime decision (a structured, machine-
      readable artifact, e.g. power_check_results.yaml, under this
      experiment's runs/ or reviews/ directory per the dispatching task
      card): for every (repetition, rung) pair actually computed: the
      three literal derived seed integers used (placement, and the 8+8
      shuffle seeds, or a reference to the deterministic formula plus rep/
      rung_idx/draw_idx so they are re-derivable); the computed
      max(genuine-full-shuffle ratio) and min(reading-2 ratio); whether
      separation held (boolean) for that repetition at that rung. THEN,
      aggregated: per rung, the count of repetitions with separation held
      out of 20 (or out of however many were computed, with T27's carve-out
      noted if applicable); and the single overall regime decision
      (BLOCKING or DIAGNOSTIC-ONLY) with the exact rule applied (20/20 at
      every computed rung => BLOCKING; else DIAGNOSTIC-ONLY), stated
      PRE-REGISTERED (before any real C2 calibration data exists), per
      v3's unchanged required_outcome_before_the_real_calibration_run
      discipline.

  # ===========================================================================
  # CHANGE 7 (review attack_2, required_controls item 2): enforce, not merely
  # state, that the power check precedes the calibration run.
  # ===========================================================================
  change_7_power_check_sequencing_enforcement:
    id: V4-CHG-7
    closes: >-
      Review required_controls item 2 / objections item 3 (attack_2,
      finding_gap_2_no_concrete_sequencing_enforcement): "The amendment
      states the power check 'must exist, committed, before the calibration
      run's task card is opened' ... but names no concrete, checkable
      enforcement mechanism ... Required control: add an explicit, checkable
      ordering requirement (e.g. the calibration run's task card must cite
      the power-check artifact's commit sha as an ancestor) mirroring
      change_4's own pattern in the SAME amendment."
    old_text_superseded_verbatim_v3_gate: >-
      The C2 calibration run (any run measuring C2a and/or C2b against
      real curve data) MUST NOT be dispatched until this synthetic power
      check has been run and its regime decision recorded. This is a
      required_artifact of THIS AMENDMENT, not of a future run: the check
      must exist, committed, before the calibration run's task card is
      opened.
    new_stopping_rule_added_not_superseding_any_existing_one: >-
      APPENDED to specification.yaml's stopping_rules (an addition; no
      existing stopping_rules item, including change_4's V3-CHG-4 addition,
      is altered): "The C2 calibration run's task card / handoff record
      (ledger/handoffs/TASK-*.yaml) MUST carry an explicit field,
      `power_check_ancestor_commit_sha`, naming the exact 40-hex-character
      git commit SHA at which change_6's V4-CHG-6 power-check artifact
      (power_check_results.yaml, containing the pre-registered regime
      decision) was committed. Before the calibration run's task card may
      be opened for dispatch, this MUST be verified mechanically -- not
      merely asserted in prose -- by running `git merge-base --is-ancestor
      <power_check_ancestor_commit_sha> <branch-HEAD-the-task-card-is-
      opened-on>` and confirming exit code 0. If the field is null, absent,
      or the ancestry check exits non-zero, the calibration run's task card
      FAILS this check and MUST NOT be dispatched, regardless of whether
      the power-check artifact exists somewhere in the working tree
      uncommitted. This closes exactly the gap the review found: change_4's
      own manifest-before-next-stage rule (V3-CHG-4) already enforces an
      analogous invariant mechanically for the seed manifest; this rule
      gives the power-check-before-calibration-run discipline the same
      mechanical enforcement, rather than leaving it as stated intent."
    required_artifact: >-
      REQUIRED_ARTIFACT V4-RA-3: the output of the
      `git merge-base --is-ancestor` check above (the two commit SHAs
      compared and the exit code), recorded in the calibration run's task
      card or its manifest.yaml, before that run's gates are scored. A
      calibration run record missing this artifact is, per this rule,
      never validly dispatched in the first place -- this required_artifact
      exists so the check's having been performed is itself independently
      auditable after the fact, not merely inferable from the calibration
      run having occurred at all.
    scope_note: >-
      This is a sequencing/provenance control only. It does not change
      V4-CHG-6's regime-decision RULE (20/20 unanimity) or v3's
      combination_rule_for_C2; it only makes the ORDER in which the power
      check and the calibration run occur mechanically checkable rather
      than a stated discipline.

  # ===========================================================================
  # CHANGE 8 (review attack_2, required_controls item 3): if C2a is
  # diagnostic-only, disclose the regularity-vs-magnitude scope limitation
  # explicitly.
  # ===========================================================================
  change_8_c2a_diagnostic_regularity_disclosure:
    id: V4-CHG-8
    closes: >-
      Review required_controls item 3 / objections item 4 (attack_2,
      finding_gap_3_external_validity_of_c2b_as_sole_fallback): "If the
      power check finds C2a's power inconclusive ... C2's ENTIRE
      evidentiary weight for validating NULL-2 against natural, irregular,
      x-derived statistics ... rests on C2b alone. But C2b is POS-A = (-1)^k
      -- a MAXIMALLY REGULAR, perfectly period-2 alternating sequence ... a
      categorically easier task ... than destroying whatever irregular,
      curve-structure-correlated dependence a natural x-based statistic
      might carry ... this is a distinct failure mode ... Required control:
      if the power check finds C2a diagnostic-only, the run record and any
      Stage-3-dispatch decision must state this scope limitation
      explicitly (not merely report 'C2: PASS')."
    old_text_superseded_verbatim_v3_combination_rule_diagnostic_branch: >-
      If the required synthetic power check instead shows C2a's power is
      inconclusive at the achieved (n, m) (a possibility this amendment
      discloses below, since "fix one arbitrary point out of ~n/2" is
      itself a very mild perturbation and may not separate cleanly), C2a
      is reported as DIAGNOSTIC ONLY, not blocking, and C2's overall
      pass/fail rests on C2b alone -- exactly mirroring how v2 already
      treats C1 as a non-blocking-alone qualitative floor next to a
      blocking positive-control leg.
    new_text_required_disclosure: >-
      UNCHANGED: if change_6's power check finds C2a's power inconclusive
      (i.e. does not achieve 20/20 separation at every rung computed), C2a
      is reported DIAGNOSTIC ONLY and C2's overall pass/fail still rests on
      C2b alone, exactly as v3 specifies. ADDED (amendment v4, V4-CHG-8):
      in THIS regime, the calibration run's record and any decision that
      dispatches or relies on Stage 3 MUST include, verbatim (rung/run-id
      references may be filled in; no other wording may be paraphrased or
      omitted), the following disclosure sentence: "SCOPE LIMITATION
      (required by amendment v4, V4-CHG-8): C2's PASS in this regime
      reflects NULL-2's demonstrated power to collapse an exactly-periodic,
      k-based sequence (POS-A / leg C2b) only; it does NOT demonstrate
      NULL-2's power against irregular, natural x-based statistics (C2a,
      T1-T4, the frozen COMPARATOR arm), because C2a's synthetic power
      check (V3-RA-2, as pinned by V4-CHG-6) did not achieve the required
      20-of-20 separation and C2a was therefore downgraded to
      diagnostic-only, non-blocking, per v3's combination_rule_for_C2." A
      bare "C2: PASS" with no such sentence, in this regime, is an
      incomplete record and MUST NOT be treated as satisfying C2's gate for
      the purpose of any Stage-3-dispatch decision.
    required_artifact: >-
      REQUIRED_ARTIFACT V4-RA-4: the disclosure sentence above, present
      verbatim in the calibration run's record (and repeated in any
      Stage-3-dispatch decision that relies on that run), whenever
      change_6's power check outcome is DIAGNOSTIC-ONLY. Not applicable
      (no disclosure required) if the power check outcome is BLOCKING.
    what_this_does_not_close: >-
      This is a disclosure requirement, not a repair of the regularity gap
      itself. It does not add a planted-but-irregular positive control (the
      review's own "ideally" suggestion) -- that remains open, named in
