  # ===========================================================================
  # CHANGE 3 (J2 required_controls item 4): max-preserving proves_too_much
  # disambiguation for any future re-run.
  # ===========================================================================
  change_3_max_preserving_disambiguation:
    id: V3-CHG-3
    closes: >-
      J2's required_controls item 4: "state explicitly whether ties at the
      maximum value are all fixed or only one arbitrary one is, since the
      two readings give materially different diagnostic pictures for a
      sparse statistic."
    general_rule_for_any_future_re_run: >-
      For the "max-preserving permutation" proves_too_much object applied
      to ANY statistic v with a value set of size s:
      (1) IF s = 2 (a binary/two-valued statistic -- e.g. top_bit_fiber,
      C2A-COMPARATOR): "fix ALL positions at the maximum value" (reading 1)
      is MATHEMATICALLY DEGENERATE, identical to the identity/no-op
      permutation for every such statistic, because permuting positions
      that all share one constant value cannot change any observable value
      in the sequence (a proof, not an estimate: if v is 2-valued and every
      maximum-valued position is held fixed, only minimum-valued positions
      are permuted among themselves, and a minimum-valued position moved to
      another minimum-valued position's slot still reads as the minimum
      value everywhere -- the resulting array is IDENTICAL to the
      pre-permutation array). Reading 1 therefore adds NOTHING beyond the
      already-tabulated no-op object for a binary statistic and MUST NOT be
      reported as a separate finding for one; the only meaningful reading
      for a binary statistic is READING 2: fix exactly ONE arbitrary
      maximum-tied position, freely permute every other position (including
      the remaining maximum-tied ones). This is the reading used throughout
      change_1's required_synthetic_power_check.
      (2) IF s >= 3 (e.g. T4, values in {0,1,2,3}): both readings are
      non-degenerate and materially different (fixing ALL ~n/s maximum-
      valued positions is a substantially larger perturbation-block than
      fixing one). READING 1 (fix ALL maximum-tied positions) is the
      DEFAULT operative reading for such statistics, matching this round's
      own T4 analysis (J2's c_broken_shuffle_scenarios.max_preserving_
      permutation.reading_1_fix_all_tied_max_positions, which analytically
      estimated fixing ~n/4 of T4's positions). If reading 2 is ALSO
      computed for an s >= 3 statistic, its results must be reported
      SEPARATELY and explicitly labelled by which reading produced them --
      never averaged or merged into one number.
      This rule is prospective: it governs any FUTURE re-run of this
      proves_too_much object (including change_1's required synthetic power
      check above), and does not retroactively reinterpret J2's own
      round-1 findings, which already correctly identified and reported
      both readings separately for the sparse comparator.

  # ===========================================================================
  # CHANGE 4 (J1 finding (d)): missing seed manifest; arm_index pinning;
  # NULL-2 mechanism-name correction; a forward stopping rule to prevent
  # recurrence.
  # ===========================================================================
  change_4_seed_manifest_and_provenance:
    id: V3-CHG-4
    closes: >-
      J1's seed_arithmetic_d finding: "MISSING REQUIRED ARTIFACT. None of
      RUN-ECDLP-56ee42-S0, -S1, or -S2's raw-result.json records an actual
      integer seed value for any NULL-1 replicate or NULL-2 shuffle. No
      manifest.yaml or equivalent file exists anywhere under experiments/
      EXP-ECDLP-56ee42/... specification.yaml's own required_artifacts list
      explicitly requires a 'manifest per stage' carrying 'all seeds'... "
      and the related open ambiguity: "arm_index is nowhere stated in
      specification.yaml as an explicit numbered table."
    disposition_chosen: >-
      DEC-20260906-030aad's own limitations text already names the
      acceptable disposition: "either a located seed manifest or an
      explicit disclosure that none exists and the stages must be re-run
      with proper instrumentation before being treated as fully
      provenance-complete." No manifest.yaml or equivalent artifact was
      located anywhere in the repository's history by either round-1
      report (both explicitly checked and found none); this amendment
      therefore adopts the SECOND option: DISCLOSE that no seed manifest
      exists for RUN-ECDLP-56ee42-S0/S1/S2, and require the change_2
      re-run to produce one, per specification.yaml's own already-stated
      (but never enforced) required_artifacts.

    arm_index_pinning:
      old_text_superseded_verbatim: >-
        null2_shuffles: '8 seeds per arm: SplitMix64 seeded 0x56EE42 + 1000
        + 10*arm_index + shuffle_index (arm_index per the declared arm
        order)'
      new_text: >-
        null2_shuffles: '8 seeds per arm: [MECHANISM NAME CORRECTED, see
        mechanism_name_correction below] seeded 0x56EE42 + 1000 +
        10*arm_index + shuffle_index, where arm_index is PINNED (not merely
        inferred) as: T1=0, T2=1, T3=2, T4=3, COMPARATOR=4, POS-A=5,
        POS-B=6 -- confirmed by J1 (seed_arithmetic_d.well_definedness_
        check) to be collision-free over these 7 arms x 8 shuffles under
        this exact numbering, the "only available reading" of
        specification.yaml arms YAML key order. C2A-COMPARATOR (new in
        this amendment) is arm_index=7. Any further statistic added by a
        future amendment takes the next unused integer, appended here, not
        inferred from YAML order alone again.'
      justification: >-
        J1 explicitly flagged this as unconfirmable from the frozen text
        alone ("whether POS-A/POS-B are even counted in the arm_index range
        ... is not independently confirmable from the permitted inputs").
        Pinning it explicitly removes that ambiguity for every future run
        and for any future review's blind re-derivation of the seed
        schedule.

    mechanism_name_correction:
      finding: >-
        J2's disclosed aside (objections, unpursued, flagged as J1's
        domain): estimator.py's null2_shuffle passes its integer seed
        straight to numpy's default_rng (PCG64-based), not a hand-rolled
        SplitMix64 stream -- confirmed by this Coordinator's own direct
        read of estimator.py (null2_shuffle, lines 407-419: "rng =
        np.random.default_rng(seed & 0xFFFFFFFFFFFFFFFF); perm = rng.
        permutation(n)"). NULL-1 (null1_signs) DOES correctly implement a
        hand-rolled SplitMix64 stream (estimator.py lines 359-400,
        confirmed by direct read); only NULL-2's own prose mislabels its
        mechanism.
      old_text_superseded_verbatim: 'SplitMix64 seeded 0x56EE42 + 1000 + 10*arm_index + shuffle_index (arm_index per the declared arm order)'
      new_text: >-
        'numpy default_rng (PCG64), seeded with the 64-bit integer 0x56EE42
        + 1000 + 10*arm_index + shuffle_index masked to 64 bits, per
        arm_index as pinned above -- NOT SplitMix64 (that mechanism is used
        by NULL-1 only; the prior text's "SplitMix64" label was a
        documentation error for NULL-2, corrected by this amendment, with
        NO change to the actual seed INTEGER formula or to null2_shuffle's
        code, which is unchanged and was always PCG64-based.'
      scope_note: >-
        This is a documentation correction only -- it does not change what
        code runs or what seed integers are computed, only what the
        contract's prose calls the underlying PRNG algorithm, so it does
        not affect the collision-freedom argument above (which depends only
        on the seed INTEGER formula and arm_index, not the PRNG family).

    required_manifest_content: >-
      REQUIRED_ARTIFACT V3-RA-4: a manifest.yaml (or equivalent structured,
      machine-readable file) committed under experiments/EXP-ECDLP-56ee42/
      implementation/runs/<RUN-ID>/ for EVERY run from the change_2 re-run
      onward (S0v3/S1v3/S2v3, the change_1 calibration run, and Stage 3),
      containing AT MINIMUM everything specification.yaml's required_
      artifacts already lists verbatim ("exact command, git commit and
      dirty-tree state, environment and dependency versions, input
      parameters, all seeds, requested model policy and resolved runtime
      model identifier, reasoning effort, fallback and degraded flags,
      stdout and stderr, timestamps, wall-clock, peak_rss_bytes") PLUS,
      made explicit by this amendment because their absence is exactly what
      broke: every NULL-1 replicate's actual 64-bit key/state value (or a
      complete, re-derivable record of the key bytes per replicate), and
      every NULL-2 shuffle's actual applied 64-bit integer seed, per
      (arm, rung, shuffle_index) triple, as literal recorded values, not
      only the formula that should have produced them.

    new_stopping_rule_added_not_superseding_any_existing_one: >-
      APPENDED to specification.yaml's stopping_rules (an addition; no
      existing stopping_rules item is altered): "If a stage's manifest
      (per required_artifacts and V3-RA-4 above) is not produced and
      committed alongside that stage's raw-result.json, that stage's gates
      are NOT SATISFIED regardless of whether the raw numbers themselves
      pass -- the next stage (including the C2 calibration run and Stage 3)
      may not be dispatched on the strength of an un-manifested stage's
      numbers alone. This closes exactly the gap J1 found: a stage-2 record
      that passed its numeric gate checks while its required seed manifest
      simply did not exist anywhere in the archive."

