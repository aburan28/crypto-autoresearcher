        the Weil ceiling past its own reach, on three statistics, at toy
        scale, with the o2 artifact removed by balance and confirmed by
        shuffle' -- it closes three arms, not the family, and proves no
        bound.
      new_text_appended_disambiguation: >-
        [PREDICTION AND BAND TEXT UNCHANGED.] DISAMBIGUATION (added by
        amendment v3, per DEC-20260906-030aad next_actions (b)): "all of
        T1-T3" is evaluated against T3 AS CORRECTED by this amendment
        (rudin_shapiro_sign_true / _array, the literal block-count
        Rudin-Shapiro sequence) -- never against the pre-v3 archived T3
        numbers, which measured a different, non-independent statistic and
        are not valid T3 evidence for CLOSURE, LEAD, or INCONCLUSIVE
        determination under this contract. No arm is dropped and no band is
        widened, narrowed, or reversed; the three-arm requirement's MEANING
        is pinned, not its VALUE.

