      instrumentation, producing a new run-id set (e.g. RUN-ECDLP-56ee42-
      S0v3 / -S1v3 / -S2v3, exact naming left to the dispatching task card).
      T1, T2, T4, POS-A, POS-B, the frozen COMPARATOR arm, NULL-1, the
      NULL-2 mechanism, and C1's gate are NOT EXPECTED to change materially
