  rationale: >-
    Directed by the independent red-team review of v4
    (experiments/EXP-ECDLP-56ee42/reviews/amendment-v4-review/report.yaml,
    verdict REVISE -- not BROKEN: none of v4's six changes was found
    mathematically or logically wrong; three (change_5, change_9, change_10)
    were independently confirmed correct with no action needed). This
    amendment closes the review's four remaining items: its highest-priority
    NEW finding (stage2.py's static_provenance_check will fail the REQUIRED
    Stage 0-2 re-run's own Stage-2 gate, for an undisclosed reason, unless
    its function-name dict is updated -- a gap outside the five DEC-
    20260906-da1212-named items, found by the review's own further search)
    plus its three required_controls on change_6, change_7, and change_8.
    Two of the review's own computations are cited directly below per its
    own next_concrete_action ("this review's own patched-estimator/patched-
    selftest reconstruction and seed-collision/timing/git-ancestor scripts
    may be cited directly by the next amendment rather than re-derived from
    scratch"): stage2_static_provenance_break.py / _output.txt (the stage2.py
    finding) and change6_power_check_timing.py / _output.txt (the budget
    finding). Both are re-examined and independently re-confirmed as far as
    this Coordinator's own tools allow (direct reads of the real committed
    stage2.py and of the review's script logic; no independent
    re-execution, since this Coordinator's session, like the ones that
    drafted v3 and v4, has no code-execution tool -- disclosed here as it
