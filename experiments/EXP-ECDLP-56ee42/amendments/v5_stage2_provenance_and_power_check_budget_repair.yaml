  # ===========================================================================
  # CHANGE 1 (v4-review new_finding, required_controls item 4): stage2.py's
  # static_provenance_check() scans for the RETIRED T3 function names and
  # will block the required re-run's own Stage-2 gate.
  # ===========================================================================
  change_1_stage2_static_provenance_dict_repair:
    id: V5-CHG-1
    priority: highest_priority_blocking
    closes: >-
      The amendment-v4-review's new_finding
      (additional_findings_beyond_the_five_named_gaps.NEW_finding_stage2_
      static_provenance_check_breaks_under_v3_rename) and required_controls
      item 4: stage2.py's static_provenance_check() does a literal
      source-text scan for the retired T3 function names ("def
      rudin_shapiro_sign(", "def rudin_shapiro_sign_array("), which neither
      v3's required_naming_and_wiring (scoped to the CALL SITE, stage0.py
      line 54, per the amendment-v3-review's attack_3) nor v4's change_5
      (scoped explicitly to selftest.py) touches.
    verified_directly_by_this_coordinator: >-
      Read experiments/EXP-ECDLP-56ee42/implementation/stage2.py in full
      (current committed content, not paraphrased from the review). Confirmed
      static_provenance_check() (lines 49-103) reads estimator.py's own
      source TEXT (Path("estimator.py").read_text(), line 53) and searches it
      for literal function-signature strings held in a `functions` dict
      (lines 63-72) -- this is a source-text scan, not a call site, and is
      DISTINCT from the stage0.py call site v3's required_naming_and_wiring
      already addresses. Confirmed the two T3 entries, at lines 66-67
      verbatim, read exactly as quoted in old_text_superseded_verbatim below.
      Separately read the amendment-v4-review's stage2_static_provenance_
      break.py in full and confirmed, line for line, that its
      static_provenance_check_reimplementation function reproduces stage2.py's
      real extraction logic exactly (same src.find(sig) / next_def = src.find
      ("\ndef ", idx+1) / body slice / code_lines comment-and-quote filter /
      re.findall(r'\bk\b', ...) sequence, lines 76-93 of stage2.py against
      lines 75-91 of the review's script) -- this is a faithful
      reimplementation, not a different check. Read the review's own output
      file (stage2_static_provenance_break_output.txt) and confirmed it
      reports, for the two T3 entries: (a) against the REAL, currently
      committed estimator.py, {found:true, reads_k:true, k_refs_in_code:
      [seven "k" entries], pass:false} for "T3 (rudin_shapiro_sign_array)"
      -- confirmed by the review to reproduce archived RUN-ECDLP-56ee42-S2/
      raw-result.json's own recorded entry exactly, a FALSE POSITIVE already
      correctly diagnosed by round-1's validator (J1,
      reviews/round-1/validator/check_e_t3_dataflow_and_definition.py lines
      76-88: the seven "k" matches are the function's own local bit-shift
      loop-level index variable, bounded by the array's own length, plus a
      docstring continuation-line the scanner's comment filter does not
      strip -- unrelated to the discrete-log coordinate); (b) against a
      reconstruction of estimator.py with v3's V3-CHG-2 rename/add applied
      (full_patched_estimator_v3only.py, the same reconstruction file used
      to independently verify v4's change_5), both T3 entries flip to
      {found:false, reads_k:null, pass:false} -- STILL FAILING, now because
      the search strings "def rudin_shapiro_sign(" / "def rudin_shapiro_
      sign_array(" are no longer a substring of anything in the renamed
      source at all (the old names become _rudin_shapiro_signflip_
      variant(_array); the new true implementation is named
      rudin_shapiro_sign_true(_array), which does not match the old search
      strings as a substring); (c) updating the dict's two T3 entries to
      search for "def rudin_shapiro_sign_true(" / "def rudin_shapiro_sign_
      true_array(" instead lets both PASS cleanly (found:true, k_refs_in_
      code: [], pass:true), since rudin_shapiro_sign_true(_array) (per
      V3-CHG-2's required_vectorized_fix) contains no local variable
      literally named k. This Coordinator did NOT independently re-execute
      the review's script (no code-execution tool in this session, the same
      disclosed limitation v3's and v4's own drafting sessions recorded);
      the correctness of (a)-(c) rests on this Coordinator's own direct,
      line-by-line comparison of the review's reimplementation against the
      real stage2.py source (confirming the script is a faithful
      reimplementation, not a different or friendlier check) plus the
      review's own committed, machine-readable output file, not on
      re-running the code a third time. Separately confirmed, by inspection,
      that the proposed new search strings do not collide as substrings
      of each other or of any other entry: "def rudin_shapiro_sign_true("
      is not a substring of "def rudin_shapiro_sign_true_array(" (the
      character immediately after "true" differs, "(" vs "_"), exactly the
      same non-collision property the existing dict already relies on for
      thue_morse_sign vs thue_morse_sign_array and for the other three arm
      pairs.
    old_text_superseded_verbatim_stage2_py_lines_66_67: |2-
              "T3 (rudin_shapiro_sign)": "def rudin_shapiro_sign(",
              "T3 (rudin_shapiro_sign_array)": "def rudin_shapiro_sign_array(",
    old_text_location_note: >-
      This is the exact, complete, currently committed content of stage2.py's
      static_provenance_check() function's `functions` dict at lines 66-67,
      the two T3 entries sitting between the two T1/T2 entries (lines 64-65)
      and the two T4 entries (lines 68-69). Nothing else in the dict (the
      T1/T2, T4, or COMPARATOR entries), and nothing in static_provenance_
      check()'s surrounding extraction/scoring logic (lines 49-65 and
      73-103), is touched by this change.
    new_text: |2-
              "T3 (rudin_shapiro_sign_true)": "def rudin_shapiro_sign_true(",
              "T3 (rudin_shapiro_sign_true_array)": "def rudin_shapiro_sign_true_array(",
    new_text_display_key_note: >-
      The dict's KEYS are human-readable display labels (they appear verbatim
      in every stage-2 raw-result.json's static_provenance_check.functions
      object), not identifiers referenced elsewhere in code; renaming the
      keys alongside the search-string values (from "T3 (rudin_shapiro_
      sign...)" to "T3 (rudin_shapiro_sign_true...)") does not break any
      other reader of this dict -- grepped, the only other places these
      exact key strings appear are the archived, immutable
      RUN-ECDLP-56ee42-S2/{raw-result.json, static-provenance-check.json}
      records (never edited by this amendment), the amendment-v4-review's
      own scratch files (outside this experiment's write scope), and
      reviews/round-1/validator/check_e_t3_dataflow_and_definition.py
      (lines 41-42; a third, harmless, historical location where the
      retired key strings appear as recorded inputs to a one-off
      validation script -- it reads them, it does not consume the dict,
      and it is not a live reader of stage2.py's output). Added per the
      amendment-v5-review's required_controls item 1 so the "grepped, the
      only other places" claim is accurate as written.
    sequencing_dependency: >-
      This change is meaningless, and must not be applied, until estimator.py
      actually carries rudin_shapiro_sign_true / _array and the renamed
      _rudin_shapiro_signflip_variant / _array, per V3-CHG-2's
      required_vectorized_fix and required_naming_and_wiring. The Executor
      applies this stage2.py dict change TOGETHER with V3-CHG-2's
      estimator.py rename/add and V4-CHG-5's selftest.py replacement, as one
      coherent commit feeding the required Stage 0-2 re-run -- not as a
      separable, independently-timed step.
    extends_v3_and_v4_scope_fields: >-
      This supersedes (extends, does not contradict) v3's
      change_2_t3_repair.required_naming_and_wiring and
      required_rerun_before_stage_3: both are hereby read as ALSO naming
      stage2.py's static_provenance_check `functions` dict as in-scope for
      the T3 repair, alongside the stage0.py call site (required_naming_and_
      wiring) and selftest.py's test_digit_statistics (v4's change_5,
      already extending the same two v3 fields once). required_rerun_
      before_stage_3's own gate list ("static provenance C3") cannot be
      satisfied by the required Stage 0-2 re-run unless this dict is also
      updated -- this was the review's own why_this_matters finding, adopted
      here as a required control.
    required_artifact: >-
      REQUIRED_ARTIFACT V5-RA-1: after V3-CHG-2's rename/add and this dict
      update are BOTH applied, a re-run of the amendment-v4-review's own
      stage2_static_provenance_check_reimplementation logic (or an
      equivalent direct invocation of stage2.py's real
      static_provenance_check() against the real, updated estimator.py)
      MUST show, for the two updated T3 entries, {found: true, reads_k:
      false, pass: true}, and MUST show all_pass: true across all eight
      entries (T1/T2, T4, COMPARATOR unaffected and already passing per
      the archived S2 record). This verification is REQUIRED before the
      Stage 0-2 re-run's Stage-2 "static_provenance" gate (per
      specification.yaml's own gate list and v3's required_rerun_before_
      stage_3) is scored as passing. The Executor MUST re-run this
      verification against the REAL, post-edit estimator.py and stage2.py --
      not merely cite this amendment's or the review's reconstruction as
      sufficient, since neither this Coordinator's session nor the review's
      own session has code-execution access to the actual production
      environment the Stage 0-2 re-run will use.
    secondary_fix_named_not_implemented_here: >-
      As the review itself names (required_control, more durable secondary
      fix): the scanner's comment/docstring-continuation-line filter
      (stage2.py lines 89-92) has the SAME class of false-positive risk for
      ANY future function whose docstring prose happens to contain the
      identifier "k", independent of this specific rename -- an AST-based
      implementation would remove this entire failure class. This is named
      here as a required follow-up Executor/tooling task, per this
      amendment's own write_scope (experiments/EXP-ECDLP-56ee42/amendments/
      only); it is NOT implemented by this amendment and is NOT a
      precondition for the dict-entry fix above, which is sufficient on its
      own to let the required re-run's Stage-2 gate pass cleanly (confirmed
      by the review's own output).

  # ===========================================================================
  # CHANGE 2 (v4-review required_controls item 1): budget-feasibility
  # disclosure and a concrete stopping/fallback rule for change_6's N=20
  # power check at its own T17-T25 fallback rungs.
  # ===========================================================================
  change_2_power_check_budget_feasibility:
    id: V5-CHG-2
    closes: >-
      The amendment-v4-review's required_controls item 1 / objections item 1
      (change_6): the N=20-repetition power check's disclosed infrastructure
      risk covers ONLY T27 (a memory ceiling, inherited from v3); it does not
      disclose or compute the aggregate wall-clock cost at the T17-T25 rungs
      the amendment's own carve-out relies on as the fallback if T27 is
      infeasible. Neither v3 nor v4 states which budget line item the power
      check draws from, or whether it counts against maximum_runs: 12.
    review_timing_treated_as_a_prior_not_a_fact: >-
      The review independently timed T17-T25's full 20-repetition schedule
      (17 length-n FFTs per repetition: 1 pre-shuffle baseline + 8 genuine +
      8 reading-2, matching V3-RA-2's stated method) at 8152.1s (~2.2645
      CPU-hours) on ITS OWN sandbox, single-threaded, "on unknown-relative-
      speed sandbox hardware," explicitly disclosed by the review as "not a
      certified production estimate." This Coordinator did not independently
      re-time it (no code-execution tool in this session) and does not
      assert 8152.1s as a certified production number; it is treated here as
      a strong, disclosed prior that a per-invocation and an aggregate
      budget risk are both real, requiring the confirmation step
      required_artifact V5-RA-2 mandates below before the full schedule is
      ever dispatched.
    budget_arithmetic_from_specification_yaml: >-
      specification.yaml's budget note itemizes, against total_cpu_hours: 24:
      Stage 0 (1h), Stage 1 fixture run (1h; the 2-day implementation effort
      is explicitly excluded from the run budget), Stage 2 (1h), Stage 3
      (12h wall total), and Stage 4 (+4h, CONTINGENT -- only if the LEAD
      branch fires). Summing the stages that are not contingent on an
      outcome not yet known (0, 1-fixture, 2, 3): 15h, leaving 9h of the 24h
      total formally unallocated; summing including the contingent Stage 4
      (since the power check runs BEFORE Stage 3, i.e. before whether Stage 4
      will be needed is known): 19h, leaving 5h unallocated. This amendment
      uses the MORE CONSERVATIVE 5h figure (reserving headroom for Stage 4
      in case the LEAD branch fires later) as the ceiling for the new budget
      line item below, rather than the more permissive 9h.
    chosen_disposition: >-
      BOTH (a) and (b) from this amendment's own drafting brief, combined,
      because either alone leaves a gap this amendment can close more
      cheaply than either its production text: (b) an explicit budget-line
      classification and a pre-registered fallback rule, made now, before
      any real timing exists; PLUS (a) a required, concrete pre-dispatch
      confirmation step against the ACTUAL production implementation and
      infrastructure, since the review's own sandbox timing is disclosed as
      uncertified and must not be treated as a substitute for measurement.
    budget_line_item_classification: >-
      A NEW, explicit budget line item is declared: "Stage 1.5 (C2a
      synthetic power check, V3-RA-2 as pinned by V4-CHG-6)", allocated UP
      TO 5 CPU-hours, drawn from the experiment's existing total_cpu_hours:
      24 (no increase to the total budget). This line item does NOT count
      against maximum_runs: 12: specification.yaml's own budget note defines
      "a run" as "one stage invocation over all six rungs," scoped to the
      five numbered stages (0-4); the power check operates entirely on
      SYNTHETIC placements of public curve/ladder parameters (no cache, no
      k, no real curve enumeration beyond what V3-RA-1 already computed) and
      is not itself one of Stages 0-4, so it is not a "stage invocation" in
      the budget note's own sense. It IS, however, still bound by
      wall_clock_seconds_per_run: 7200 PER INVOCATION (the literal cap
      applies without a stage-scoped qualifier), so it must be split across
      multiple task invocations if a single invocation cannot complete
      within 7200s -- exactly the split this amendment requires next.
    required_invocation_split: >-
      Using the review's own per-rung timings as a DISCLOSED, UNCERTIFIED
      planning prior (change6_power_check_timing_output.txt: T17=0.4452s,
      T19=2.0090s, T21=10.9491s, T23=56.0052s, T25=338.1961s per single
      repetition's 17 FFTs; x20 reps: T17=8.90s, T19=40.18s, T21=218.98s,
      T23=1120.10s, T25=6763.92s): a natural split respecting the 7200s
      per-invocation cap is INVOCATION 1 = {T17, T19, T21, T23} (sum of the
      review's own x20 timings: 8.90+40.18+218.98+1120.10 = 1388.16s, well
      under 7200s) and INVOCATION 2 = {T25} alone (6763.92s per the review's
      timing, under but close to the 7200s cap -- this Coordinator flags
      this margin as THIN and requiring the production confirmation below,
      not merely accepted on the sandbox number). T27 remains eligible for
      the existing NOT-COMPUTED carve-out (v3's disclosed_limitation,
      unchanged by this amendment) regardless of which invocation split is
      used.
    required_pre_dispatch_confirmation_gate: >-
      REQUIRED_ARTIFACT V5-RA-2: before the full N-repetition schedule
      (whether N=20 or the N=10 fallback below) is dispatched on ANY rung,
      the Executor MUST independently time the ACTUAL production power-check
      implementation (not the review's standalone reconstruction) on the
      ACTUAL execution infrastructure, for at least one full repetition (17
      FFTs) at each of T17, T19, T21, T23, T25, and record these five timings
      plus the resulting extrapolated aggregate cost for the full N
      schedule under the invocation split above. This confirmation is a
      STOPPING-RULE GATE: the full schedule may not be dispatched until it
      passes.
    stopping_rule_and_fallback: >-
      APPENDED to specification.yaml's stopping_rules (an addition; no
      existing stopping_rules item, including V3-CHG-4's and V4-CHG-7's own
      additions, is altered): "If V5-RA-2's confirmed production timing,
      extrapolated to the full N-repetition schedule under the required
      invocation split, exceeds 80% of the declared 5-CPU-hour Stage-1.5
      budget line item (i.e. exceeds 4 CPU-hours, reserving a margin for
      other infrastructure-reinvocation needs), OR if any single required
      invocation cannot be re-split to fit within the 7200s
      wall_clock_seconds_per_run cap, the FULL N=20 schedule is NOT
      dispatched. The pre-registered fallback, stated now before any real
      timing or power-check statistical outcome data exists (so this is a
      budget decision, not a re-scoring of an observed result): re-scope to
      N=10 independent repetitions, preserving change_6's own 100% (10-of-10,
      not merely a majority) pass-fraction requirement and its stated
      asymmetric-cost justification at half the repetition count, using the
      SAME seed_schedule formula restricted to rep = 0..9. If even the N=10
      schedule (per the same confirmation gate, applied to N=10's smaller
      extrapolated cost) does not fit the 4-CPU-hour threshold, STOP and
      record an infrastructure-budget finding (AGENTS.md rule 3: this is
      never evidence for or against C2a's power) -- Stage 3 dispatch is
      then blocked pending a further Coordinator decision, not silently
      proceeded with on an unverified check." This mirrors v3's and v4's own
      pattern of stating a fallback regime explicitly and in advance rather
      than deciding after seeing results.
    required_artifact_recorded_content: >-
      REQUIRED_ARTIFACT V5-RA-2 (continued): the five per-rung single-
      repetition production timings, the extrapolated aggregate cost under
      the required invocation split, the resulting regime (N=20 proceeds /
      N=10 fallback triggered / STOP-infrastructure-budget triggered), and
      which of the two required invocations (if N=20 or N=10 proceeds) each
      rung's runs were dispatched under -- committed alongside change_6's own
      required_committed_content (power_check_results.yaml or a sibling
      file, e.g. power_check_budget_confirmation.yaml, under this
      experiment's runs/ or reviews/ directory per the dispatching task
      card), BEFORE the full repetition schedule itself is dispatched.
    scope_note: >-
      This does not change change_6's seed schedule, its 0.05 effect-size
      separation criterion, or (in the N=20 case) its 20/20 unanimity rule
      -- all UNCHANGED. It adds a budget classification, a concrete
      pre-dispatch confirmation gate, and one pre-registered fallback
      (N=10, 10/10) for the case where N=20 does not fit the declared
      budget, stated in advance of any real data.

  # ===========================================================================
  # CHANGE 3 (v4-review required_controls item 2): content-verification for
  # change_7's power-check-before-calibration-run sequencing check.
  # ===========================================================================
  change_3_power_check_content_verification:
    id: V5-CHG-3
    closes: >-
      The amendment-v4-review's required_controls item 2 / objections item 2
      (change_7): `git merge-base --is-ancestor` verifies DAG reachability of
      the cited commit sha only -- the review demonstrated, with a throwaway
      git repository, that an UNRELATED ancestor commit containing NO
      power-check artifact passes the check with the same exit code 0 as the
      correct commit. Also closes the review's related finding that
      `power_check_ancestor_commit_sha` is not a recognized field in
      tools/validate_ledger.py's handoff schema and that no tool actually
      implements the merge-base check.
    verified_directly_by_this_coordinator: >-
      Read the review's change7_ancestor_check_gap_demo.sh methodology
      description and its stated result in report.yaml (change_7's
      result_soundness_gap and result_enforcement_gap sections) directly;
      this Coordinator did not re-run the throwaway git experiment itself
      (no shell/code-execution tool in this session), but the claim checked
      -- that `git merge-base --is-ancestor <sha> <HEAD>` verifies only DAG
      ancestry and never inspects the ancestor commit's tree contents -- is
      a well-known, structural property of the command itself (it is
      documented Git behaviour, not a claim resting on the review's sandbox
      environment), so this Coordinator accepts it without needing
      independent re-execution to confirm the qualitative mechanism, while
      still not asserting the review's specific demonstration script's exact
      output as independently re-verified.
    old_text_superseded_verbatim_v4_stopping_rule: >-
      APPENDED to specification.yaml's stopping_rules (an addition; no
      existing stopping_rules item, including change_4's V3-CHG-4 addition,
      is altered): "The C2 calibration run's task card / handoff record
      (ledger/handoffs/TASK-*.yaml) MUST carry an explicit field,
      `power_check_ancestor_commit_sha`, naming the exact 40-hex-character
      git commit SHA at which change_6's V4-CHG-6 power-check artifact
      (power_check_results.yaml, containing the pre-registered regime
      decision) was committed. Before the calibration run's task card may
      be opened for dispatch, this MUST be verified mechanically -- not
      merely asserted in prose -- by running `git merge-base --is-ancestor
      <power_check_ancestor_commit_sha> <branch-HEAD-the-task-card-is-
      opened-on>` and confirming exit code 0. If the field is null, absent,
      or the ancestry check exits non-zero, the calibration run's task card
      FAILS this check and MUST NOT be dispatched, regardless of whether
      the power-check artifact exists somewhere in the working tree
      uncommitted. This closes exactly the gap the review found: change_4's
      own manifest-before-next-stage rule (V3-CHG-4) already enforces an
      analogous invariant mechanically for the seed manifest; this rule
      gives the power-check-before-calibration-run discipline the same
      mechanical enforcement, rather than leaving it as stated intent."
    new_stopping_rule_addition_appended_to_v4s_own_rule_not_replacing_it: >-
      APPENDED to specification.yaml's stopping_rules, alongside (not
      replacing) V4-CHG-7's rule quoted above, which remains UNCHANGED and
      still required: "In ADDITION to the `git merge-base --is-ancestor`
      check V4-CHG-7 requires, the calibration run's task card / handoff
      record MUST ALSO carry an explicit field,
      `power_check_artifact_sha256`, recording the sha256 digest of
      power_check_results.yaml (or the sibling budget-confirmation artifact
      V5-CHG-2 requires) AS IT EXISTS in the committed tree at
      `power_check_ancestor_commit_sha`. Before the calibration run's task
      card may be approved for dispatch, this MUST be verified by running
      `git show <power_check_ancestor_commit_sha>:<path-to-power_check_
      results.yaml> | sha256sum` and confirming the output matches
      `power_check_artifact_sha256` byte-for-byte. This mirrors this
      program's own established archive-receipt convention (CLAUDE.md
      'Archive receipts bind to CONTENT first': tools/research_dispatch.py
      verifies path_sha256 as PRIMARY and treats commit reachability as
      merely ADVISORY): ancestry alone (V4-CHG-7's check) rules out 'no sha
      cited,' 'sha does not exist,' or 'sha postdates HEAD'; the content
      check added here additionally rules out 'an arbitrary-but-real
      ancestor commit that happens to contain no such artifact, or a
      different, stale, or wrong artifact at that path' -- the specific gap
      the review's throwaway-git-repository demonstration exposed. NEITHER
      check alone is sufficient; BOTH are required and neither supersedes
      the other."
    enforcement_mechanism_named_as_a_required_control_this_amendment_does_not_implement: >-
      Per this amendment's own write_scope (experiments/EXP-ECDLP-56ee42/
      amendments/ only) and per this drafting task's explicit instruction
      that naming the gap is sufficient, this amendment does NOT itself edit
      tools/validate_ledger.py. It names, as a REQUIRED FOLLOW-UP for the
      Executor/tooling task that wires the calibration run's task card:
      (1) `power_check_ancestor_commit_sha` and `power_check_artifact_
      sha256` should be added as recognized (and, for this experiment's
      calibration-run task cards specifically, required) fields in
      tools/validate_ledger.py's handoff record schema, which today
      requires only ["id","from","to","objective","budget"] and does not
      recognize either field (confirmed by the review's own grep of
      tools/); (2) a small verification script (under this experiment's own
      directory or under tools/) should implement BOTH the merge-base
      ancestry check and the sha256 content check mechanically, rather than
      leaving either as a human/Coordinator manual read-and-verify step.
      UNTIL that tooling exists, this amendment scopes the required_control
      down to something enforceable by a human/Coordinator TODAY: the
      Coordinator personally runs both commands (the merge-base check and
      the `git show | sha256sum` check) and pastes both commands' literal
      output into the calibration run's task card, verified by the
      Coordinator before approving dispatch of that task card -- exactly
      mirroring how the review itself performed both checks by hand with
      scratch scripts, without any pre-existing tooling.
    required_artifact: >-
      REQUIRED_ARTIFACT V5-RA-3: the literal output of BOTH the `git
      merge-base --is-ancestor` check (V4-CHG-7, unchanged) and the `git
      show <sha>:<path> | sha256sum` content-verification check (this
      change), recorded in the calibration run's task card or its
      manifest.yaml, with the Coordinator's own confirmation that the
      sha256 output matches the recorded `power_check_artifact_sha256`
      value, before that run's gates are scored. A calibration run record
      missing either output is, per this rule, never validly dispatched.
    scope_note: >-
      This does not change V4-CHG-6's regime-decision rule, V4-CHG-7's
      ancestry-check mechanism, or v3's combination_rule_for_C2; it adds one
      additional, independent content-verification step and names the
      tooling gap explicitly rather than leaving the sequencing discipline
      enforceable by ancestry alone.

  # ===========================================================================
  # CHANGE 4 (v4-review required_controls item 3): wording fix for change_8's
  # required verbatim disclosure sentence.
  # ===========================================================================
  change_4_c2a_diagnostic_disclosure_wording_fix:
    id: V5-CHG-4
    closes: >-
      The amendment-v4-review's required_controls item 3 / objections item 3
      (change_8): the required verbatim disclosure sentence groups T1-T4
      under "irregular, natural x-based statistics," but T2 is defined on y
      (specification.yaml arms.T2: "Thue-Morse sign of y: v(R) =
      (-1)^{s_2(y(R))}"), not x -- confirmed by this Coordinator's own direct
      re-read of specification.yaml's arms.T2 field (quoted above in the
      required-reading pass over specification.yaml), matching the review's
      own citation exactly.
    old_text_superseded_verbatim_v4_new_text_required_disclosure: >-
      UNCHANGED: if change_6's power check finds C2a's power inconclusive
      (i.e. does not achieve 20/20 separation at every rung computed), C2a
      is reported DIAGNOSTIC ONLY and C2's overall pass/fail still rests on
      C2b alone, exactly as v3 specifies. ADDED (amendment v4, V4-CHG-8): in
      THIS regime, the calibration run's record and any decision that
      dispatches or relies on Stage 3 MUST include, verbatim (rung/run-id
      references may be filled in; no other wording may be paraphrased or
      omitted), the following disclosure sentence: "SCOPE LIMITATION
      (required by amendment v4, V4-CHG-8): C2's PASS in this regime
      reflects NULL-2's demonstrated power to collapse an exactly-periodic,
      k-based sequence (POS-A / leg C2b) only; it does NOT demonstrate
      NULL-2's power against irregular, natural x-based statistics (C2a,
      T1-T4, the frozen COMPARATOR arm), because C2a's synthetic power
      check (V3-RA-2, as pinned by V4-CHG-6) did not achieve the required
      20-of-20 separation and C2a was therefore downgraded to
      diagnostic-only, non-blocking, per v3's combination_rule_for_C2." A
      bare "C2: PASS" with no such sentence, in this regime, is an
      incomplete record and MUST NOT be treated as satisfying C2's gate for
      the purpose of any Stage-3-dispatch decision.
    new_text_corrected_required_disclosure: >-
      UNCHANGED: if change_6's power check finds C2a's power inconclusive
      (i.e. does not achieve 20/20, or 10/10 under V5-CHG-2's fallback,
      separation at every rung computed), C2a is reported DIAGNOSTIC ONLY
      and C2's overall pass/fail still rests on C2b alone, exactly as v3
      specifies. ADDED (amendment v4, V4-CHG-8; WORDING CORRECTED by
      amendment v5, V5-CHG-4): in THIS regime, the calibration run's record
      and any decision that dispatches or relies on Stage 3 MUST include,
      verbatim (rung/run-id references may be filled in; no other wording
      may be paraphrased or omitted), the following disclosure sentence:
      "SCOPE LIMITATION (required by amendment v4, V4-CHG-8, wording
      corrected by amendment v5, V5-CHG-4): C2's PASS in this regime
      reflects NULL-2's demonstrated power to collapse an exactly-periodic,
      k-based sequence (POS-A / leg C2b) only; it does NOT demonstrate
      NULL-2's power against irregular, natural, coordinate-based
      (non-planted) statistics (C2a, T1-T4, the frozen COMPARATOR arm),
      because C2a's synthetic power check (V3-RA-2, as pinned by V4-CHG-6
      and, if triggered, re-scoped by V5-CHG-2) did not achieve the required
      unanimous separation and C2a was therefore downgraded to
      diagnostic-only, non-blocking, per v3's combination_rule_for_C2." A
      bare "C2: PASS" with no such sentence, in this regime, is an
      incomplete record and MUST NOT be treated as satisfying C2's gate for
      the purpose of any Stage-3-dispatch decision.
    why_this_wording: >-
      "Coordinate-based, non-planted" (the review's own suggested
      replacement, adopted here rather than devising an alternative) covers
      T1 and COMPARATOR (functions of x), T2 (a function of y, a different
      coordinate of the same point), T3 (a function of x), T4 (a function of
      x), and C2a (a function of x) uniformly and accurately, without
      claiming any of them is a function of x specifically. It preserves the
      sentence's substantive claim exactly (these are natural, non-planted,
      non-k-reading statistics in the same evidentiary category the
      regularity gap applies to) while removing the T2 mischaracterization
      the review found.
    required_artifact: >-
      REQUIRED_ARTIFACT V5-RA-4 (supersedes V4-RA-4's sentence text; the
      requirement to include it if and only if the power check outcome is
      DIAGNOSTIC-ONLY is UNCHANGED from V4-RA-4): the corrected disclosure
      sentence above, present verbatim in the calibration run's record (and
      repeated in any Stage-3-dispatch decision that relies on that run),
      whenever change_6's power check outcome (as amended by V5-CHG-2) is
      DIAGNOSTIC-ONLY. Not applicable if the power check outcome is
      BLOCKING.

