experiment:
  id: EXP-ECDLP-56ee42
  hypothesis_id: H-ECDLP-a4be60
  version: 1
  title: >-
    THE DIGIT-STATISTIC CELL OF THE PROBABILISTIC REGIME: exact
    DL-coordinate advantages (A(v) and q_maj - 1/2) for the balanced
    Thue-Morse and Rudin-Shapiro digit signs of a coordinate's integer lift
    over a frozen six-rung ladder of prime-order toy subgroups (17-27 bits,
    span 1024x), against the x-top-bit comparator, a keyed-random null
    (256 replicates), the matched-marginal shuffle (8 seeds), and two
    planted positives -- the discrete-log parity at the flat 2/pi scale and
    the Thue-Morse sign of the log at the n^{-0.21} scale -- with the
    popcount-mod-4 diagnostic reproducing the o2 lane's marginal artifact
  status: approved
  status_note: >-
    Frozen at version 1 and approved 2026-09-03 by user confirmation in the
    top-level orchestration session (the design-experiment step-4 gate): the
    full contract was presented to the user and confirmed as frozen before
    approval. No run of this contract was authorized before this mark;
    execution proceeds under TASK-20260903-087076. Any change after this
    point requires a versioned protocol_amendment in amendments/; the
    pre-registered prediction is never edited.
  source_proposal: IDEA-20260902-c17bf6
  objective: >-
    Measure whether the digit family -- the one cheap family for which the
    program's probabilistic-regime closure (f558e4 sub-result (E)) has no
    proof, because the F_p spectral norm of its members is a power of p and
    the Weil composition is vacuous -- behaves at the DL coordinate like the
    family inside the proof, or like an approximate-AP primitive. Every
    outcome is a result: the CLOSURE branch (digit arms match the comparator
    within the pre-registered band, beta in [0.4, 0.6]) extends the Weil
    ceiling empirically past its own reach on three statistics at toy scale;
    the LEAD branch (an advantage >= 0.05, reproduced at >= 3 rungs,
    surviving both nulls, not decaying) is a distinguisher-scale
    approximate-AP primitive routed to independent review; the INCONCLUSIVE
    branch is the pre-registered band between. NO ATTACK is run; every
    instance is toy and self-generated; no key is involved.
  class: heuristic-validation
  heuristic_under_test: H1
  inputs:
    ladder:
      artifact: experiments/EXP-ECDLP-56ee42/design/ladder.json
      selector: experiments/EXP-ECDLP-56ee42/design/select_ladder.py
      model: 'y^2 = x^3 + x + b over F_p (a = 1, generic, non-CM: j != 1728 at every rung)'
      note: >-
        Cofactor 1 at every rung (#E = N prime), so the whole group is the
        prime-order subgroup; the KN-TECH-034 exclusions as stated in
        IDEA-20260901-863e36 and IDEA-20260901-b4e6eb are satisfied by
        construction (N prime hence not smooth; N != p hence not anomalous).
        Deterministic selector (no seed; pure function of the target cells);
        re-running it reproduces the table exactly.
      curves:
        - {T: 17, p: 131101, b: 27, N: 131113, log2_N: 17.000451, j: 44084, t: -11}
        - {T: 19, p: 524309, b: 80, N: 525361, log2_N: 19.00295, j: 115588, t: -1051}
        - {T: 21, p: 2097169, b: 1, N: 2098321, log2_N: 21.000804, j: 879235, t: -1151}
        - {T: 23, p: 8388617, b: 21, N: 8391797, log2_N: 23.000548, j: 3553770, t: -3179}
        - {T: 25, p: 33554473, b: 49, N: 33557891, log2_N: 25.000149, j: 23293163, t: -3417}
        - {T: 27, p: 134217757, b: 70, N: 134234689, log2_N: 27.000182, j: 76125442, t: -16931}
      span_nmax_over_nmin: 1023.8
    arms:
      T1: 'Thue-Morse sign of x: v(R) = (-1)^{s_2(x(R))}, s_2 the binary digit sum'
      T2: 'Thue-Morse sign of y: v(R) = (-1)^{s_2(y(R))}'
      T3: 'Rudin-Shapiro sign of x: v(R) = (-1)^{u(x(R))}, u the count of block 11 in the binary expansion'
      T4: 'popcount of x mod 4 (the o2 family-I member, unbalanced; doubles as diagnostic CONTROL C)'
      COMPARATOR: 'top bit of x (an interval statistic inside the pinning)'
      POS-A: >-
        discrete-log parity: v(R) = (-1)^k, the coarsest DL interval bucket;
        computable only by the harness (k known). Design-time verified:
        A(POS-A) = 2/pi = 0.636620 at EVERY rung (exact, with the same DFT
        estimator), flat in n. This is the maximal-end planted positive.
      POS-B: >-
        Thue-Morse sign of the discrete log: v(R) = (-1)^{s_2(k)}; computable
        only by the harness. Largest Fourier coefficient along k of order
        n^{-0.21} (Gelfond, RECALLED -- order-level gate). Design-time sanity
        values: A(POS-B) = 0.054186 at n = 131113, 0.040388 at n = 525361
        (ratio 1.34, matching (n2/n1)^{0.21} = 1.33). The intermediate-scale
        planted positive: the instrument must resolve it as intermediate
        between the comparator and POS-A and must show it NOT decaying like
        n^{-1/2}.
    nulls:
      NULL-1: >-
        keyed random sign: v_s(R) = +/-1 from SplitMix64 keyed on (EXP id,
        replicate index s, point-encoding bytes (x, y) in [0, p)
        big-endian), run through the identical estimator; 256 replicates per
        rung. Its A(v) distribution over seeds is the reference for 'no
        structure' and its largest value over the 256 replicates is the tail
        reference (an empirical extreme-value law, NOT 1/sqrt(n)).
      NULL-2: >-
        matched-marginal shuffle inherited unchanged from the o2 lane's
        RT-EXP-1: a seeded permutation of the statistic's values among the
        points of G preserving the multiset, so every marginal is kept and
        every dependence on the point is destroyed; 8 seeds per arm. The
        arm's post-shuffle advantage is the MAX over the 8 shuffles, and the
        two-branch rule's 'NOT reproduced by NULL-2' is evaluated against
        that max. An arm that matches its shuffle is reporting marginal
        imbalance and nothing else.
    lift_convention: 'canonical integer representative in [0, p); named in every output row'
    estimator: >-
      The estimator of f558e4 (the RQ-PROP-24458b instrument of
      H-PROP-c95932 does not exist -- experiments/EXP-PROP-ba2e44 is
      specification-only -- so it is implemented per this definition):
      (i) enumerate the subgroup completely: R_k = [k]P for k = 0..n-1 by
      repeated addition, recording (x, y) with the lift convention;
      (ii) q_maj = max over F: SxS -> S of the EXACT fraction of the n^2
      pairs (R_k, R_l) with v(R_k + R_l) = F(v(R_k), v(R_l)), evaluated
      exactly via integer cyclic convolutions c_{ijm} = SUM_x (f_i * f_j)(x)
      f_m(x) (f_m the reversed indicator of fiber m) with the
      integer-recovery check |g - round(g)| < 0.25 asserted on every
      convolution -- the exact value of the n^2-pair sum in O(n log n);
      direct n^2 enumeration is infeasible at the top rung and is NOT
      permitted as the reported method; (iii) A(v) = max over a in Z/n of
      |SUM_k v_k e(2 pi i a k / n)| / n by one length-n DFT of the
      discrete-log-ordered statistic sequence.
    baseline_fixture:
      source: IDEA-20260815-f558e4 (frozen fixture, proof_search_map.baseline_embedding)
      statement: >-
        At N = 23, s = 3, the interval partition of Z/23Z (fibers
        {k : k in [j*23/3, (j+1)*23/3)}) must give q_strict = 0 and
        q_maj = 284/529 (0.536862...), both by exact rational arithmetic
        over all 529 pairs. Design-time re-verified 2026-09-03 (orchestration
        session, exact rationals). These are the numbers the ideation check
        produced; the frozen run must reproduce them EXACTLY or the
        discrepancy is an implementation bug and blocks the record.
  controls:
    - name: NULL-1 keyed random sign
      role: blocking
      detail: '256 replicates per rung; tail reference = max over replicates; the confounder of the multiple-testing over a in Z/n is handled by this empirical extreme-value reference, not by 1/sqrt(n)'
    - name: NULL-2 matched-marginal shuffle
      role: blocking
      detail: '8 seeds per arm, max over shuffles; inherited unchanged from the o2 lane; the control that killed the o2 lane digit signals'
    - name: COMPARATOR top bit of x
      role: blocking
      detail: 'inside the pinning; fixture gate 284/529 at N = 23 s = 3 (exact rationals) plus fitted beta consistent with 1/2 over the ladder; if it misses, no digit-arm number is reported (F2)'
    - name: POSITIVE CONTROL A = (-1)^k
      role: blocking
      detail: 'gate: |A(POS-A) - 2/pi| <= 0.005 at every rung and flat in n; failing it, the instrument has not calibrated the maximal end and no digit number is reported (F2)'
    - name: POSITIVE CONTROL B = Thue-Morse of k
      role: blocking
      detail: 'gate: fitted beta in [0.10, 0.35] (consistent with 0.21) AND A(POS-B) within [0.5, 2] x n^{-0.21} at every rung (order-level; Gelfond RECALLED); failing it, the run reports no digit number (F2)'
    - name: CONTROL C = T4 popcount of x mod 4
      role: diagnostic (blocking as a calibration)
      detail: 'expected pre-shuffle excess that the shuffle removes, reproducing the o2 lane artifact as a known-answer calibration of NULL-2; if the shuffle does not remove it, every digit number is void (F3)'
    - name: static provenance check
      role: blocking
      detail: 'no T1-T4 or COMPARATOR statistic code path reads k (scope: the T arms and the comparator only -- POS-A, POS-B and NULL-1 read k / harness data BY DESIGN and are exempt); the check is a source scan plus a manifest declaration, recorded before Stage 3'
    - name: curve exclusions
      role: blocking
      detail: 'anomalous (#E = p) and smooth-order excluded per KN-TECH-034 as stated in 863e36/b4e6eb; satisfied by construction of the frozen ladder (N prime, N != p, j != 1728); archived in design/ladder.json'
    - name: f558e4 (G) x-bucket smoke check
      role: diagnostic (NOT blocking)
      detail: 'on p = 101/103/107 at FULL (composite) group order N = 115/118/105, the x-coordinate bucket should give q_maj near 0.530/0.394/0.342/0.282 at s = 2/3/4/5, per f558e4 (G); composite-N caveat: a smoke check on the measurement code, not evidence'
  independent_variables:
    - 'prime order (the frozen ladder; six rungs)'
    - 'arm id (T1, T2, T3, T4, COMPARATOR, POS-A, POS-B)'
    - 'shuffle on/off (and shuffle index 1..8 for NULL-2)'
    - 'NULL-1 replicate index 1..256'
  metrics:
    primary:
      - >-
        P1 -- A(v) and q_maj - 1/2 for T1, T2, T3 minus the same quantities
        for the comparator, at matched n, before and after NULL-2 (exact
        rationals / exact integers, named estimator, named lift)
      - >-
        P2 -- fitted decay exponent beta per arm in A(v) ~ n^{-beta} over the
        six rungs, with bootstrap interval and residuals
    secondary:
      - >-
        P3 -- the exact F_p spectral norms of t, r and the comparator at each
        ladder prime (Stage 0: one length-p FFT per statistic, reported
        beside the comparator's O(log p) norm; fitted growth exponents)
      - >-
        P4 -- CONTROL C's pre-shuffle excess and post-shuffle residual
      - >-
        P5 -- each arm's own marginal over x(G) (the mixed sum of the digit
        sign against the curve's Legendre indicator, normalised), per (arm,
        rung), with the NULL-1 marginal distribution at the same n
      - 'NULL-1 A(v) distribution and empirical tail reference (max over 256 replicates) per rung'
      - >-
        design-time balance facts, re-confirmed at run time: SUM_{m<p} t(m)
        and SUM_{m<p} r(m) in {+1, -1} at each rung (frozen values in
        design/ladder.json's companion record; the design-time values were
        +1,-1,+1,+1,-1,+1 for t and -1,+1,+1,+1,+1,+1 for r in ladder
        order)
  heuristic_under_test_note: >-
    H1 (the digit sequence behaves like a uniform +-1 sequence w.r.t. its
    largest Fourier coefficient along k, A(v) = O(sqrt(log n / n))) is a
    genuine heuristic with NO rigorous hybrid-sum half for this family --
    that absence is the record's reason to exist. H2 (the marginal over
    x(G) at the n^{-1/2} scale) is diagnostic: NULL-2 removes its effect
    from the DL question by construction.
  preregistered_prediction:
    quantity: >-
      A(v) and q_maj - 1/2 of the digit arms relative to the comparator, and
      the fitted decay exponent beta per arm
    formula: >-
      Two-branch rule (frozen): |arm - comparator| <= 0.01 at every tested
      n, before and after NULL-2, for all of T1-T3 with beta in [0.4, 0.6]
      => CLOSURE; |arm - comparator| >= 0.05 reproduced at >= 3 prime
      orders, NOT reproduced by NULL-2 (max over the 8 shuffles), not
      decaying in n (beta <= 0.25) => LEAD, routed to independent review
      before any interpretation; between => INCONCLUSIVE in advance.
      POS-A expected at A = 2/pi flat (gate |A - 2/pi| <= 0.005); POS-B
      expected at beta in [0.10, 0.35] and A within [0.5, 2] x n^{-0.21}.
    source: >-
      The random-model heuristic H1 (imitating the DFT-of-Rademacher
      extreme value O(sqrt(n log n)) whp, RECALLED) composed with f558e4
      (E)'s n^{-1/2} ceiling for the comparator; the bands are the
      n^{-1/2} scale at the tested sizes, the same bands b4e6eb uses so the
      three panels remain comparable. Untested expectations, stated as
      such. FROZEN: any adjustment after any run requires a versioned
      protocol_amendment in amendments/; runs already executed are never
      re-scored against a new prediction.
  scale_relevance:
    tier: toy
    justification: >-
      p and n in the 16-30 bit band, frozen ladder 17-27 bits, span 1024x.
      Complete enumeration makes A(v) and q_maj EXACT, so no estimator
      variance competes with the n^{-1/2} effect; the cost of exactness is
      the ~30-bit cap, and the ladder top is set at 27 bits so that
      enumeration plus the O(n log n) exact transforms stay within budget
      (the 6x span requirement is binding; the 30-bit band is a cap, not an
      obligation). TRANSFER TO CRYPTOGRAPHIC n IS AN EXPLICIT UNLICENSED
      EXTRAPOLATION: the toy-scale image ratio biases TOWARD apparent
      structure (a one-bit statistic on a 20-bit group is a far larger
      fraction of the group than at cryptographic size); the ladder is the
      only defence, and no transfer is claimed.
    correspondence: null
  tail_checks:
    - >-
      The largest A(v) observed over all digit arms and rungs, against the
      largest over the equal number (256) of NULL-1 replicates at the same
      n: a real effect shifts the distribution, not one cell.
    - >-
      POS-B tail: A(POS-B) at every rung against the [0.5, 2] x n^{-0.21}
      band (the known intermediate scale the instrument must resolve).
    - >-
      P5 tail: the largest marginal over all arms and rungs against the
      NULL-1 marginal maximum at the same n.
  replication:
    seeds:
      base_seed: 0x56EE42
      null1_schedule: >-
        SplitMix64 keyed on (EXP id string, replicate index s in 1..256,
        point-encoding bytes (x, y) in [0, p) big-endian); output truncated
        to +/-1
      null2_shuffles: '8 seeds per arm: SplitMix64 seeded 0x56EE42 + 1000 + 10*arm_index + shuffle_index (arm_index per the declared arm order)'
      bootstrap: '0x56EE42 + 900000 for the P2 bootstrap intervals (B = 1000 resamples of the rung set, log-n weights)'
      note: 'every (arm, prime, seed) cell is a row of the raw output; no cell is ever silently re-run with a different seed'
    independent_instances: 6
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 24
    maximum_memory_gb: 16
    maximum_runs: 12
    maximum_workers: 1
    note: >-
      A run is one stage invocation over all six rungs. Stage 0 (vacuity
      derivation + one length-p FFT per prime per statistic): 1h wall, 4 GB
      peak. Stage 1 (implementation -- a day's work per the proposal since
      the RQ-PROP instrument is not reusable -- then the fixture run):
      implementation effort 2 days, excluded from the run budget; fixture
      run 1h. Stage 2 (blocking controls): 1h. Stage 3 (the measurement;
      the top rung n = 134234689 dominates: enumeration ~30-60 min,
      ~270 length-n DFTs including the 256 NULL-1 replicates ~45-90 min,
      ~64 exact q_maj convolutions ~15-30 min; lower rungs negligible):
      12h wall total, 16 GB peak (enumeration arrays ~2.1 GB at the top
      rung + FFT working set). Stage 4 (only if the LEAD branch fires:
      re-run at two further primes, then stop): +4h. maximum_runs 12 allows
      re-invocations for infrastructure failure only, each recorded.
  stopping_rules:
    - 'Stage 0 gate fails for an arm (P3: a digit norm is polylog): that arm is dropped, the computed norm archived, the remaining arms proceed (F1).'
    - 'Stage 1 fixture gate fails (284/529 not reproduced in exact rationals): STOP; implementation bug; no number is reported (F2).'
    - 'Stage 2 gate fails for POS-A, POS-B or CONTROL C: STOP per F2/F3; every digit number is void until resolved.'
    - 'The LEAD branch fires in Stage 3: re-run the lead arm at two further primes (Stage 4), then STOP and route to independent review; no interpretation before that review.'
    - 'Budget exhaustion before the ladder resolves: STOP, record F6 -- an infrastructure outcome under AGENTS.md rule 5, never evidence about the statistics.'
  invalidation_rules:
    - 'F2 (comparator fixture miss, or POS-A/POS-B failing to separate at their predicted scale): instrument failure; nothing is reported.'
    - 'F3 (CONTROL C excess survives the shuffle): NULL-2 is not the control the o2 lane reported; every digit number is void.'
    - 'The static provenance check fails (a T-arm or COMPARATOR code path reads k): every Stage 3 number is void.'
    - 'Any gate failure archives its evidence (computed norm / failing fixture value) BEFORE stopping.'
  success_criterion: >-
    DECIDABLE FROM THE PREDEFINED METRICS ALONE. CLOSURE = F5: all of T1-T3
    within 0.01 of the comparator in A(v) and q_maj - 1/2 at every rung,
    before and after NULL-2, with fitted beta in [0.4, 0.6], all gates
    passed; honest headline: 'a measured extension of the Weil ceiling past
    its own reach, on three statistics, at toy scale, with the o2 artifact
    removed by balance and confirmed by shuffle' -- it closes three arms,
    not the family, and proves no bound. LEAD = F4: a digit arm at >= 0.05
    over the comparator, reproduced at >= 3 rungs, surviving NULL-1 and
    NULL-2, not decaying in n; a distinguisher-scale statement, NOT an
    attack (conversion to a solver is f558e4 (F)'s separate question).
    INCONCLUSIVE = the pre-registered band between, or a non-passed gate
    that is not F2/F3.
  falsification_criterion: >-
    F1-F6 of the hypothesis, verbatim: F1 a polylog digit norm drops that
    arm; F2 the comparator/positive-control fixture failure invalidates the
    instrument; F3 the shuffle failure voids every digit number; F4 the
    lead-branch observation refutes H1 at the tested scale (the
    distinguisher, not an attack); F5 the predicted closure outcome; F6
    budget exhaustion is infrastructure, never evidence.
  required_artifacts:
    - 'manifest per stage: exact command, git commit and dirty-tree state, environment and dependency versions, input parameters, all seeds, requested model policy and resolved runtime model identifier, reasoning effort, fallback and degraded flags, stdout and stderr, timestamps, wall-clock, peak_rss_bytes'
    - 'raw machine-readable results: A(v), q_maj, and the marginal per (arm, n, seed) before and after shuffle, with the estimator and lift convention named on every row'
    - 'the exact F_p spectral norms per statistic per prime (Stage 0) beside the comparator norm, with fitted growth exponents'
    - 'the gate pass/fail record for every gate, with the archived evidence of any failure'
    - 'the NULL-1 A(v) distribution and empirical tail reference per rung (all 256 replicate values)'
    - 'the P2 fitted beta per arm with bootstrap interval and residuals'
    - 'the Stage 0 vacuity derivation document (triangle-inequality form of the pinning; recalled Gelfond / root-N facts marked recalled)'
    - 'the ladder selector script and its output (already present under design/)'
    - 'the static provenance check record (source-scan output + manifest declaration)'
    - 'the f558e4 (G) smoke-check output (diagnostic; composite-N caveat stated)'
  measured_vs_modeled: >-
    Every reported number is MEASURED on exact enumeration and exact
    integer/FFT evaluation; there is no modeled column and no cost formula
    standing in for a measurement in this contract.
  drafting_provenance: >-
    Drafted by the Coordinator role in the top-level orchestration session
    (opencode runtime) on 2026-09-03. The design-experiment skill directs
    this drafting to the coordinator subagent; in this runtime the subagent
    tool surface has no shell and three consecutive long-task dispatches
    returned empty with zero artifacts, while short tasks completed (see
    H-ECDLP-a4be60.drafting_provenance). All design-time computations     are
    archived under experiments/EXP-ECDLP-56ee42/design/ and are
    independently checkable. Approval: granted 2026-09-03 on user
    confirmation (see status_note); approved_by: coordinator.
  assigned_to: executor
  approved_by: coordinator
