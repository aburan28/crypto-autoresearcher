validation_report:
  id: VAL-20260906-J1-410404
  id_note: >-
    Local report id (not a minted ledger EV-* id; tools/allocate_id.py has no
    "validation report" record type -- this report is a review work product
    under write_scope, cited by task_id below; any EV-* record is minted by
    the Coordinator's ledger archive step).
  task_id: TASK-20260904-410404
  decision_under_review: DEC-20260904-92dec2
  joint_owned: >-
    J1 only (blind re-derivation of the 284/529 fixture; blind re-derivation
    of the T21 t L1 spectral norm; S2 gate-table arithmetic recompute;
    NULL-2 seed arithmetic; T3 static-provenance data-flow adjudication).
    J2 (CONTROL-C / amendment v2 control design, TASK-20260904-a897dc) was
    NOT read, contacted, or opined on.

  run_ids:
    - RUN-ECDLP-56ee42-S0
    - RUN-ECDLP-56ee42-S1
    - RUN-ECDLP-56ee42-S2

  git_provenance_check:
    cited_commit: 5e709a5c6
    is_ancestor_of_HEAD: true
    dec_commit: 555961aa3
    dec_is_ancestor_of_HEAD: true
    dirty_tree_check: >-
      git diff 5e709a5c6 against every file this task reads
      (implementation/runs/, specification.yaml, design/ladder.json,
      implementation/estimator.py, ledger/proposals/IDEA-20260815-f558e4.yaml)
      is EMPTY: every input is byte-identical to the cited snapshot commit.
      git diff 555961aa3 against ledger/decisions/DEC-20260904-92dec2.yaml is
      EMPTY: the DEC record matches its own commit exactly. git status
      --porcelain shows only this task's own untracked write_scope directory
      (experiments/EXP-ECDLP-56ee42/reviews/) as a working-tree change -- no
      dirty-tree contamination of any input this report reads or cites.
    verdict: >-
      clean -- this is a genuine Coordinator-committed snapshot, not a
      working-tree-only receipt.

  # ===========================================================================
  # (a) BLIND RE-DERIVATION: 284/529 fixture, N=23, s=3, interval partition
  # ===========================================================================
  blind_rederivation_a:
    quantity: >-
      q_maj and q_strict of the f558e4 interval-partition statistic on Z/23Z,
      s = 3, exact rationals over all 529 ordered pairs.
    derived_from:
      - "ledger/proposals/IDEA-20260815-f558e4.yaml -- claim (B): definitions of q_strict, q_maj"
      - "experiments/EXP-ECDLP-56ee42/specification.yaml -- baseline_fixture block, fiber rule {k in [j*23/3, (j+1)*23/3)}"
    blind_from_respected: true
    script: experiments/EXP-ECDLP-56ee42/reviews/round-1/validator/rederivation_a_fixture.py
    computed:
      fiber_sizes: "{0: 8, 1: 8, 2: 7}"
      q_strict: "0/529 = 0.0"
      q_maj: "284/529 = 0.5368620037807184"
    recorded:
      source: "RUN-ECDLP-56ee42-S1/raw-result.json, steps.fixture"
      q_strict_expected: "0"
      q_maj_expected: "284/529"
      q_maj_float: 0.5368620037807184
    match: "EXACT (both q_strict and q_maj, as exact Fraction equality)"
    verdict: SUSTAINED

  # ===========================================================================
  # (b) BLIND RE-DERIVATION: T21 rung digit-statistic F_p spectral L1 norms
  # ===========================================================================
  blind_rederivation_b:
    quantity_primary: >-
      L1 spectral norm SUM_a |SUM_x v(x) e(2 pi i a x / p)| of t(x) =
      (-1)^{s_2(x)} (Thue-Morse sign), x swept over the full field domain
      [0, p), p = 2097169 (T21 rung), one length-p DFT -- per
      specification.yaml metrics.secondary.P3 and RUN-ECDLP-56ee42-S0's own
      stated spectral_norm_definition (both permitted inputs).
    scope_note_recorded: >-
      The task card's own gloss of this quantity ("of the T1-arm ... digit
      statistic on the order-2098321 subgroup") names the subgroup order N,
      not the field size p; N (2098321) and p (2097169) are different values
      on the same T21 ladder row. The recorded value 717522016.0036793 is
      copied verbatim from RUN-ECDLP-56ee42-S0's T21.t.L1 field, and that
      record's own definition (quoted above) is unambiguously a length-p
      transform over the raw field domain, independent of curve/subgroup
      membership. I derived from that permitted record's own stated
      definition rather than resolve the gloss by reading code, and flag the
      wording gap here rather than silently reconciling it.
    derived_from:
      - "specification.yaml -- arms.T1, arms.T3, arms.COMPARATOR text definitions; metrics.secondary.P3"
      - "design/ladder.json -- T21: p = 2097169"
      - "RUN-ECDLP-56ee42-S0/raw-result.json -- permitted input; supplies the exact operative definition text for the checked quantity"
    blind_from_respected: true
    script: experiments/EXP-ECDLP-56ee42/reviews/round-1/validator/rederivation_b_t21_norms.py
    results:
      t_thue_morse:
        computed_L1: 717522016.0036793
        recorded_L1: 717522016.0036793
        computed_Linf: 64154.59808658087
        recorded_Linf: 64154.598086580874
        match: "EXACT (relative error 0.0 / 1.1e-16)"
        verdict: "SUSTAINED -- this is the primary graded quantity for (b)"
      comparator_top_bit_crosscheck:
        computed_L1: 11063466.790552605
        recorded_L1: 11063466.790552609
        computed_Linf: 2097134.999999999
        recorded_Linf: 2097134.999999999
        match: "EXACT (relative error ~3.4e-16)"
        verdict: "SUSTAINED (method cross-check passes)"
        note: >-
          Confirms my independently-inferred comparator definition (top bit
          = bit position p.bit_length()-1, i.e. x >= 2^floor(log2 p)) is
          correct. This was inferred BEFORE reading estimator.py, purely
          from the recorded Linf value and specification.yaml's comparator
          text, and matches the actual code exactly (confirmed in joint (e)
          below).
      r_rudin_shapiro_crosscheck:
        my_definition: >-
          Standard Rudin-Shapiro sequence r(x) = (-1)^{u(x)}, u(x) = count of
          overlapping "11" blocks in the binary expansion of x -- the literal
          reading of specification.yaml arms.T3, independently verified
          against OEIS A020985 for x = 0..15 before use.
        computed_L1: 2863410553.624861
        computed_Linf: 2053.7774088337123
        recorded_L1: 718196597.0195143
        recorded_Linf: 64154.01743560407
        relative_error_L1_percent: 298.7
        match: "NO -- large, unambiguous mismatch, not a rounding difference"
        verdict: BROKEN
        verdict_explanation: >-
          This is a numeric mismatch in the (b) attack plan's own
          cross-check ("also recompute the r norm ... as a cross-check on
          your method"). Since the SAME script's t and comparator
          computations matched the recorded values EXACTLY (to 1e-16
          relative error), the mismatch is not a defect in my method: it
          localises to the archived r value / its producing code. Root
          cause confirmed under joint (e) below (estimator.py read there,
          permitted only for that item); recorded as a finding of (b), the
          sub-item that first surfaced it via the blind cross-check the
          plan itself specified.

  # ===========================================================================
  # (c) S2 GATE TABLE ARITHMETIC RECOMPUTE (RUN-ECDLP-56ee42-S2 raw JSON only)
  # ===========================================================================
  recompute_c_s2_gates:
    script: experiments/EXP-ECDLP-56ee42/reviews/round-1/validator/rederivation_c_s2_gates.py
    POS_A:
      recomputed_per_row_diffs: "EXACT match to all 6 recorded abs_diff_2pi values"
      recomputed_max_abs_diff_2pi: 1.5228929228783272e-11
      recorded_max_abs_diff_2pi: 1.5228929228783272e-11
      gate_pass_recomputed: true
      gate_pass_recorded: true
      verdict: SUSTAINED
    POS_B:
      method: "OLS regression of ln(A) vs ln(n) over the 6 rungs; beta = -slope"
      recomputed_beta: 0.17045574660101365
      recorded_beta: 0.17045574660101379
      relative_difference: "~1e-15, float rounding only"
      both_in_band_0.10_0.35: true
      verdict: SUSTAINED
    CONTROL_C:
      per_rung_postmax_from_array: "EXACT match to recorded A_noDC_post_shuffle_max for all 6 rungs"
      per_rung_excess_removed: "EXACT match to recorded excess_removed for all 6 rungs"
      survival_ratios_recomputed: [0.784666, 0.934297, 0.828523, 0.779945, 0.855404, 0.813005]
      dec_quoted_ratios: [0.785, 0.934, 0.828, 0.780, 0.855, 0.813]
      note_T21_rounding: >-
        DEC prose quotes 0.828 for T21; exact recomputation gives 0.828523
        (rounds to 0.829 under round-half-up). This is negligible
        presentation rounding in the DEC's prose (0.06% relative), NOT a
        discrepancy in any archived raw number: every underlying field
        (pre, post_shuffle_all, excess_removed) matches exactly. Not a
        break.
      gate_pass_per_row_recomputed: [false, false, false, false, false, false]
      overall_gate_pass_recomputed: false
      overall_gate_pass_recorded: false
      verdict: SUSTAINED
    top_level_gates_crosscheck:
      note: >-
        POS-A, POS-B, CONTROL-C, and static_provenance top-level `gates`
        entries all correctly mirror their respective `steps.*.gate_pass` /
        `steps.static_provenance_check.all_pass` values.
      verdict: SUSTAINED
    overall_verdict: SUSTAINED

  # ===========================================================================
  # (d) NULL-2 SEED ARITHMETIC
  # ===========================================================================
  seed_arithmetic_d:
    script: experiments/EXP-ECDLP-56ee42/reviews/round-1/validator/rederivation_d_seed_check.py
    formula: "SplitMix64 seeded 0x56EE42 + 1000 + 10*arm_index + shuffle_index"
    source: >-
      specification.yaml replication.seeds.null2_shuffles -- the only
      permitted input for this sub-item. stage2.py and estimator.py's seed
      construction were deliberately NOT read for (d); see scope_note below.
    scope_note: >-
      SCOPE CORRECTION FROM THE GENERIC ATTACK-PLAN TEXT: the review_plan's
      attack_plan prose for (d) says to read "the seed construction in
      stage2.py/estimator.py". The task dispatch's own inputs list and
      explicit dispatcher instruction restrict estimator.py to joint (e)
      only and do not list stage2.py or runrecord.py as permitted inputs
      for this task at all. I followed the more restrictive, task-specific
      instruction (estimator.py read only for (e), opened only after (a)-(d)
      were complete) over the generic joint-J1 prose, and did not open
      stage2.py at any point in this task. This is recorded as a deliberate
      scope choice, not a silent deviation.
    well_definedness_check: >-
      Under the only "declared arm order" visible in the frozen contract
      (specification.yaml arms YAML key order: T1, T2, T3, T4, COMPARATOR,
      POS-A, POS-B, read 0-based), the formula is collision-free over 7 arms
      times 8 shuffles (56 distinct seeds, verified exhaustively).
    what_cannot_be_confirmed:
      - >-
        arm_index is nowhere stated in specification.yaml as an explicit
        numbered table; the YAML key order is an inference from prose, not
        a verified mapping. Whether POS-A/POS-B are even counted in the
        arm_index range (5 arms or 7) is not independently confirmable from
        the permitted inputs.
      - >-
        MISSING REQUIRED ARTIFACT. None of RUN-ECDLP-56ee42-S0,
        RUN-ECDLP-56ee42-S1, or RUN-ECDLP-56ee42-S2's raw-result.json
        records an actual integer seed value for any NULL-1 replicate or
        NULL-2 shuffle. No manifest.yaml or equivalent file exists anywhere
        under experiments/EXP-ECDLP-56ee42/, confirmed by a full directory
        listing at review time (only raw-result.json, vacuity-derivation.md,
        and static-provenance-check.json are present per run).
        specification.yaml's own required_artifacts list explicitly
        requires a "manifest per stage" carrying "all seeds" among other
        fields. This artifact is missing from the archived record set, not
        merely unread by this task.
    verdict: INCOMPLETE
    verdict_explanation: >-
      The formula is well-defined and, under the only available reading,
      collision-free, but whether it was actually applied to produce the
      archived NULL-2 results cannot be confirmed or refuted: the required
      seed manifest does not exist in the archive. Reported as a
      missing-artifact finding, not as a pass or a break of the arithmetic
      itself.

  # ===========================================================================
  # (e) T3 STATIC-PROVENANCE DATA-FLOW ADJUDICATION
  # (estimator.py read here, permitted for this item only)
  # ===========================================================================
  dataflow_adjudication_e:
    script: experiments/EXP-ECDLP-56ee42/reviews/round-1/validator/check_e_t3_dataflow_and_definition.py
    read_for_this_item_only: experiments/EXP-ECDLP-56ee42/implementation/estimator.py
    opened_after: >-
      rederivation_a_fixture.py, rederivation_b_t21_norms.py,
      rederivation_c_s2_gates.py, and rederivation_d_seed_check.py were
      already written, executed, and their outputs fixed. estimator.py was
      not read before that point in this task.
    part_1_k_input_check:
      functions_checked:
        - thue_morse_sign
        - thue_morse_sign_array
        - "_rudin_shapiro_u (unused helper, kept for reference; not on the measurement path but checked anyway)"
        - rudin_shapiro_sign
        - rudin_shapiro_sign_array
        - popcount_mod4
        - popcount_mod4_array
        - top_bit_fiber
        - top_bit_fiber_array
      result: >-
        None of the T1-T4/COMPARATOR functions take k (the discrete-log
        coordinate) as parameter, closure, global, or index-by-discrete-log.
        Every function's only parameters are x/xs (integer lift of a curve
        coordinate) and, for the comparator, p.
      T3_array_7_k_tokens_accounted: >-
        Confirmed line-by-line: 2 occurrences are the docstring's prose
        mention of "bit-length k"; 5 are the local loop variable in
        k = 1; while (1 << k) < n: lo = 1<<k; hi = min(1<<(k+1), n); ...
        k += 1, where n = int(xs.max(initial=0)) + 1 -- bounded by the
        largest integer-lift value in the input array (an x-coordinate),
        not by the discrete-log exponent or the group order via k. This
        exactly confirms DEC-20260904-92dec2's F-static finding (which
        quotes "k = 1; while (1 << k) < n: ...; k += 1" verbatim) at the
        level of every individual token, not merely by description.
      verdict: SUSTAINED
      verdict_explanation: >-
        The static-provenance T3 flag IS a false positive of the
        token-based scanner, confirmed independently and in full. The
        frozen contract's data-flow intent ("no T1-T4 or COMPARATOR code
        path reads k") is met by the archived code.
    part_2_unassigned_but_load_bearing_finding: >-
      UNEXPECTED OBSERVATION, recorded per AGENTS.md core rule 8 rather than
      discarded because it fell outside the specific question asked.
      estimator.py's rudin_shapiro_sign / rudin_shapiro_sign_array -- the
      function that produced every archived T3 ("Rudin-Shapiro") number in
      this experiment, including the RUN-ECDLP-56ee42-S0 r.L1/r.Linf values
      independently confirmed to match to full float precision when run
      directly -- does NOT implement the digit statistic specification.yaml
      arms.T3 states ("Rudin-Shapiro sign of x ... u the count of block 11
      in the binary expansion"). That literal definition is the standard
      Rudin-Shapiro sequence, OEIS A020985. estimator.py instead computes a
      different recursion, r(0) = r(1) = 1, r(2n) = r(n), r(2n+1) = -r(n)
      unconditionally, which is mathematically equivalent to
      -thue_morse_sign(x) for every x >= 1, and to +thue_morse_sign(0) at
      x = 0 (0 mismatches confirmed over x in [0, 200000)). q_maj, q_strict,
      A(v), and A_noDC(v) are all exactly invariant under a global sign
      flip v -> -v (a bijection on candidate majority functions F, and
      |FFT(-v)| = |FFT(v)| pointwise), so T3's Stage 0/2/3 measurements are
      mathematically forced to equal T1's, up to the single differing point
      x = 0 (exactly the point-at-infinity convention value R_0), which
      contributes a negligible O(1/n) perturbation to any of these
      aggregate statistics at the n used here (hundreds of thousands to
      hundreds of millions). T3 therefore carries no independent structural
      information beyond T1 in this run, contrary to the experiment's
      premise of three independent digit families (T1 Thue-Morse of x, T2
      Thue-Morse of y, T3 Rudin-Shapiro of x).
      Disclosure status: the producer's own code docstring (estimator.py,
      the rudin_shapiro_sign docstring) explicitly discloses the divergence
      from the contract's literal text, stating the two characterizations
      "diverge at x=5, 9, 10, ...; 135 of the first 256 values differ" --
      independently confirmed exactly, 135 of 256 -- and explicitly invites
      a protocol_amendment. What the docstring does not get right is its own
      characterization: it calls its recursion "the standard Rudin-Shapiro
      sequence"; my independent derivation and check show it is not an
      independent structural family at all, but a near-total sign-flip of
      T1, a materially stronger and more consequential problem than "uses a
      nonstandard variant".
      Scope: this does not touch joint J2 (CONTROL-C / T4 / comparator);
      T3/Rudin-Shapiro and T4/CONTROL-C are unrelated statistics. It is
      recorded in full here because it is squarely inside J1 (found via the
      data-flow read of exactly the functions J1(e) assigns me to read, and
      via the (b) cross-check), not as an opinion on J2.
      Recommendation (an observation, not an instruction; disposition is
      the Coordinator's): Stage 3 dispatch on the current estimator.py
      would report a T3 result that is a redundant echo of T1, not new
      evidence. The experiment's own success_criterion (CLOSURE requires
      all of T1-T3 to close, "not the family") would silently close only
      two arms while reporting three. This looks like exactly the kind of
      gap a versioned protocol_amendment would need to close before any
      Stage 3 run is treated as measuring three independent families;
      estimator.py already contains a correct, unused implementation of the
      literal block-count Rudin-Shapiro as the helper _rudin_shapiro_u.
    verdict_e: >-
      SUSTAINED on the assigned k-input question, WITH an additional
      breaking finding recorded jointly under (b)/(e): the T3 definitional
      mismatch above.

  # ===========================================================================
  # OVERALL JOINT J1 VERDICT
  # ===========================================================================
  joint_J1_verdict: BROKEN
  joint_J1_verdict_detail: >-
    Specific mismatch: the archived T3 ("Rudin-Shapiro of x") digit
    statistic, used throughout Stages 0-2 of EXP-ECDLP-56ee42 and slated for
    Stage 3, does not implement the digit statistic specification.yaml
    itself defines, and is instead numerically equivalent to a sign-flip of
    the already-tested T1 (Thue-Morse of x) statistic. Confirmed exactly via
    (i) the (b) blind cross-check (recorded r.L1 disagrees with an
    independent, OEIS-verified implementation of the contract's own stated
    definition by about 299%, while the same independent method matches the
    recorded t and comparator norms to 1e-16 relative error) and (ii) direct
    execution of the archived rudin_shapiro_sign/_array functions under
    joint (e)'s permitted read of estimator.py.
    Everything else J1 was asked to check is SUSTAINED: (a) the 284/529
    fixture is an exact match; (b) the primary T21 t-norm and the
    comparator cross-check are exact matches; (c) every S2 gate-table
    number recomputes exactly from the raw JSON; (e) the T3
    static-provenance flag IS a confirmed false positive (the local
    bit-level loop counter, not a k-input), fully vindicating
    DEC-20260904-92dec2's F-static finding on its own narrow question. (d)
    is INCOMPLETE rather than broken: the seed formula is well-defined, but
    the archive is missing the seed manifest required to confirm it was
    actually applied.
  joint_J1_consequence_for_dec: >-
    DEC-20260904-92dec2's F-static finding (T3 flag is a scanner false
    positive) is CONFIRMED and STRENGTHENED by this independent read. The
    DEC does not address, and this review round therefore surfaces for the
    first time, a separate and more consequential T3 problem: not a false
    alarm about provenance, but a genuine failure of the T3 arm to measure
    what the contract says it measures. This is squarely a J1 finding
    (archived-records-vs-contract fidelity) and does not bear on J2's
    CONTROL-C/comparator adjudication.

