    previously unflagged budget-feasibility gap at the T17-T25 fallback
    rungs it relies on if T27 is infeasible. (3) change_7 (sequencing
    enforcement) is a real, directionally sound improvement over prose,
    but has a demonstrated content-blindness gap (any ancestor commit sha
    passes, correct or not) and is not wired into any existing validator,
    so its own "verified mechanically" language overstates current
    enforcement. (4) change_8 (diagnostic-regime disclosure) is
    substantively accurate with one minor, easily-fixed wording
    imprecision (T2 mischaracterized as "x-based"). (5) change_9 (S2
    citation correction) is independently confirmed accurate on both
    halves by direct reads of both raw-result.json files. (6) change_10
    (wording softening) is independently confirmed accurate on every
    cited number, correctly hedged, no overclaim or underclaim. Beyond
    the five named gaps: a NEW, real, load-bearing gap was found --
    stage2.py's static_provenance_check will fail the required Stage 0-2
    re-run's Stage 2 gate again, for an undisclosed new reason, unless
    its function-name dict is also updated to the new true
    implementation's names, which neither v3 nor v4 specifies. None of
    v4's six changes is WRONG in its core mathematical or logical
    content (mirroring the v3-review's own finding about v3); this review
    finds v4 INCOMPLETE in the same sense the v3-review found v3
    incomplete -- a fresh, comparably real completeness gap on the T3/
    static-provenance side, plus two disclosure/soundness gaps on the
    power-check side (budget, and sequencing-check content-blindness),
    plus one cosmetic wording nit.

  next_concrete_action: >-
    Before any Coordinator decision authorizes dispatch of the Stage 0-2
    re-run, the power check, or the C2 calibration run: (a) extend the T3
    repair's scope to stage2.py's static_provenance_check dict (this
