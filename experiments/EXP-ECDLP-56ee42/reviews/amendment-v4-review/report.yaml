  counterexample_or_mutation: >-
    The single cheapest, most decisive check available was exactly the
    one this review ran for change_5: actually apply v3's specified
    rename to a faithful copy of estimator.py, drop v4's verbatim
    replacement text into a copy of selftest.py, and EXECUTE the whole
    file -- not read it. That same technique, pointed one file further
    (stage2.py's static_provenance_check, which reads the SAME renamed
    estimator.py source text but was never itself patched by either
    amendment), is what surfaced the new finding above: a mutation as
    cheap as "search for these signature strings in the post-rename
    source" immediately reveals a gate that will fail again, silently,
    for a new reason. A second cheap, decisive check was the git-DAG
    mutation for change_7 (cite a wrong-but-valid ancestor sha instead of
    the right one) -- a two-line git experiment that fully falsifies "not
    merely asserted in prose."

  baseline_comparison: >-
    Not applicable in the Pollard-rho/BSGS sense: EXP-ECDLP-56ee42 is a
