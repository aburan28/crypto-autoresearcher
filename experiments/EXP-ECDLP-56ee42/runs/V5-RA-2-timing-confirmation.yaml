  n20_fits_4_cpu_h_and_7200s_per_invocation: true
  n10_fits_4_cpu_h_and_7200s_per_invocation: true
  regime: "N=20 proceeds"
  rationale: >-
    The confirmed production timing extrapolates to 1455.0s (0.4042 CPU-h)
    for the full N=20 schedule, far below the 4-CPU-hour threshold, and both
    required invocations (328.5s and 1126.6s) are far below the 7200s
    per-invocation cap.  The pre-registered rule therefore selects N=20
    (the N=10 fallback is NOT triggered).  This is a budget decision made
    before any power-check statistical outcome data exists.

