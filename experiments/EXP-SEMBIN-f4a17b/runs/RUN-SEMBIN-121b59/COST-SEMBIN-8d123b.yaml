concrete_cost:
  id: COST-SEMBIN-8d123b
  hypothesis_id: H-SEMBIN-83999d
  experiment_id: EXP-SEMBIN-f4a17b
  run_id: RUN-SEMBIN-121b59
  recorded_at: '2026-09-13'
  algorithm_ref: >
    Chained-S_3 point decomposition with index calculus over E(F_{2^n}),
    Semaev 2015 (ePrint 2015/310, frozen at inputs/SEMAEV-2015-310/, read into
    KN-LIT-fa346d, abstracted as KN-TECH-b18366). Stage 1 charged as
    m! 2^{n/m} n^{4 omega} and stage 2 as 2^{2n/m} per Table 3 and eqs.
    (15)-(17).
  cost_unit: >
    log2 of F_{2^n}-operation-equivalents for time; log2 of bits for memory.
    The two algorithms' operation units are NOT identical -- a rho step is one
    group operation and a Semaev stage-1 unit is a Groebner step on the
    chained system -- and no unit-conversion factor is applied. This is the
    largest single source of imprecision in the table and it is disclosed
    rather than modelled, because the frozen source supplies no conversion.
  bound_kind: heuristic_estimate
  comparator_ref: >
    van Oorschot-Wiener parallel collision search with distinguished points,
    per KN-TECH-006 and KN-LIT-012, both read in full. Serial cost
    0.886*sqrt(q) group operations; parallel form sqrt(q)/M with small
    per-processor memory. The 0.886 constant is RELAYED from those internal
    records; the primary paper was not opened by this program and KN-LIT-012
    records that its own full text was not re-read.

  # ------------------------------------------------------------------
  # The point of this record: a crossover is meaningless without its metric.
  # ------------------------------------------------------------------
  metrics_defined:
    - name: time_only_zero_memory_weight
      definition: time alone; memory free on both sides
      rationale: >
        reproduces the comparison Table 3 and Section 4.5.2 actually make, and
        is the reference row against which every other metric is read
    - name: time_memory_product
      definition: time * memory
      rationale: >
        the standard way a memory-hungry algorithm is charged against a
        memory-light one when both must be provisioned for the whole run
    - name: area_time_AT
      definition: >
        area * time with area taken as memory; identical to the product here
        because no separate area term is modelled for the processor array
      rationale: hardware-cost convention
      disclosure: >
        AT and the time-memory product coincide in this table by construction.
        They are reported separately so that a reader is not misled into
        counting them as two independent confirmations.
    - name: equal_rate_max_of_time_and_memory
      definition: max(time, memory)
      rationale: >
        the weakest possible memory charge -- memory matters only when it
        exceeds time. Included so the table cannot be accused of choosing a
        metric that punishes memory maximally.

  parameter_sets:
    - name: NIST/FIPS PUB 186-4 K-163 and B-163
      security_parameter: n = 163
      semaev_time_log2: 123.7697
      semaev_memory_log2_dense: 70.3526
      semaev_memory_log2_sparse: 55.2782
      semaev_optimal_m: 7
      vow_time_log2: 81.3254
      margin_bits_time_only: -42.4443
      margin_bits_time_memory_dense: -73.8632
      margin_bits_time_memory_sparse: -58.7888
      semaev_wins_under_any_metric: false
    - name: NIST/FIPS PUB 186-4 K-233 and B-233
      security_parameter: n = 233
      semaev_time_log2: 138.7283
      semaev_memory_log2_dense: 77.7467
      semaev_memory_log2_sparse: 59.9741
      semaev_optimal_m: 9
      vow_time_log2: 116.3254
      margin_bits_time_only: -22.4029
      margin_bits_time_memory_dense: -60.7004
      margin_bits_time_memory_sparse: -42.9278
      semaev_wins_under_any_metric: false
    - name: NIST/FIPS PUB 186-4 K-283 and B-283
      security_parameter: n = 283
      semaev_time_log2: 147.6495
      semaev_memory_log2_dense: 80.0103
      semaev_memory_log2_sparse: 61.9374
      semaev_optimal_m: 9
      vow_time_log2: 141.3254
      margin_bits_time_only: -6.3241
      margin_bits_time_memory_dense: -46.6047
      margin_bits_time_memory_sparse: -28.5319
      semaev_wins_under_any_metric: false
    - name: NIST/FIPS PUB 186-4 K-409 and B-409
      security_parameter: n = 409
      semaev_time_log2: 166.5438
      semaev_memory_log2_dense: 86.8371
      semaev_memory_log2_sparse: 66.5250
      semaev_optimal_m: 11
      vow_time_log2: 204.3254
      margin_bits_time_only: 37.7816
      margin_bits_time_memory_dense: -8.7946
      margin_bits_time_memory_sparse: 11.5175
      semaev_wins_under_any_metric: metric-dependent
      the_load_bearing_row: >
        THIS IS THE ROW THE WHOLE RECORD IS ABOUT. Under time alone -- the
        paper's own comparison -- the chained algorithm is ahead by 37.8 bits
        at n = 409. Charge memory as a time-memory product with the DENSE
        working-set reading and it is BEHIND by 8.8 bits. Charge it with
        Semaev's own SPARSE reading and it is ahead by 11.5. A 46.6-bit swing
        between two defensible storage readings of the same algorithm, straddling
        zero, is the entire finding: at n = 409 the published conclusion is
        decided by the memory model, and the paper states no memory model.
    - name: NIST/FIPS PUB 186-4 K-571 and B-571
      security_parameter: n = 571
      semaev_time_log2: 186.3070
      semaev_memory_log2_dense: 91.7726
      semaev_memory_log2_sparse: 70.2718
      semaev_optimal_m: 12
      vow_time_log2: 285.3254
      margin_bits_time_only: 99.0184
      margin_bits_time_memory_dense: 47.9882
      margin_bits_time_memory_sparse: 69.4889
      semaev_wins_under_any_metric: true
      note: >
        n = 571 is ahead under every metric and both storage readings. Charging
        memory does not rescue the largest FIPS binary curve from the paper's
        conclusion, and this record does not claim it does.

  crossover_n_by_metric:
    time_only_zero_memory_weight: {dense: 303, semaev_sparse: 303}
    time_memory_product: {dense: 435, semaev_sparse: 375}
    area_time_AT: {dense: 435, semaev_sparse: 375}
    equal_rate_max_of_time_and_memory: {dense: 303, semaev_sparse: 303}
  crossover_published: 302
  crossover_published_convention: >
    stage 1 alone, minimized over m, against a bare 2^{n/2}. Reproduced
    exactly. Adding stage 2 to the attack's side moves it to 302 and
    additionally charging the vOW walk constant to the baseline moves it to
    303; both shifts are one or two in n and are far below the memory effects
    this record is about. They are reported so a later reader cannot mistake a
    convention difference for a disagreement.
  crossover_shift_attributable_to_memory:
    dense: +132 in n (303 -> 435)
    semaev_sparse: +72 in n (303 -> 375)
    attribution_control: >
      Under the time-only and equal-rate metrics the matched null (a
      zero-memory comparator of the same shape) gives the identical crossover,
      so the share of the shift attributable to charging the BASELINE's
      distinguished-point store is zero. The whole shift is Semaev's own
      memory.

  parallelism: >
    The baseline parallelizes near-linearly as sqrt(q)/M with small
    per-processor memory (KN-TECH-006). Semaev's stage 1 parallelizes across
    independent decomposition attempts, but every worker writes into ONE
    relation store of 2^{ceil(n/m)} rows, and stage 2 is a single linear-algebra
    problem over that store. So the memory charged here is a shared resource
    that does not divide by M, which is exactly why the time-only comparison
    flatters it: adding processors buys time on both sides but memory on
    neither.
  time_memory_tradeoff: >
    NOT MODELLED, and this is the sharpest limitation of the record. The
    baseline has a genuine tradeoff curve -- a coarser distinguished-point
    criterion shrinks the store at a time cost -- and it is charged here at its
    memory endpoint with NO time penalty, which favours the baseline. Semaev's
    side has no published tradeoff curve at all: the relation store size is
    fixed by the factor base, and shrinking it means changing m, which the
    optimization already sweeps. A reader wanting the honest form of this
    comparison should read every row as "at these endpoints", not "at the
    optimum of each algorithm's tradeoff".

  ceiling_discrepancy:
    what: >
      Table 3's printed stage-1 column reproduces from the UN-CEILED k = n/m,
      while Section 3 defines k = ceil(n/m), and the relation store charged
      here is 2^{ceil(n/m)}. The published table therefore does not charge a
      ceiling that its own factor base pays.
    crossover_unceiled: 303
    crossover_ceiled: 281
    per_n_stage1_discrepancy_bits: {233: -0.89, 283: -4.44, 310: 0.00, 409: -8.18,
      571: -4.58}
    stance: >
      Both readings are reported. Neither is asserted to be the intended one,
      and this is recorded as an ambiguity in the text rather than an error in
      it. Note the direction: the ceiled reading is CHEAPER for the attack, so
      resolving the ambiguity the paper's own way would move the crossover
      down, not up.

  degree_bound_sensitivity:
    assumption: every figure above assumes Assumption 1's bound d_F4 <= 4
    bits_added_if_the_bound_is_5: {310: 18.246, 409: 19.356, 571: 20.590}
    bits_added_if_the_bound_is_6: {310: 35.964, 409: 38.186, 571: 40.654}
    direction: >
      ONE-SIDED. If EXP-SEMBIN-7e1371 locates the boundary below the parameters
      of interest, every time and memory figure here is an UNDERESTIMATE by the
      amounts tabulated, never an overestimate. At n = 409 a bound of 5 alone
      is 19.4 bits, which is more than twice the 8.8-bit dense-reading deficit.

  affected_scope:
    - >
      time_only_zero_memory_weight: n >= 303, so B-409/K-409 and B-571/K-571
      of FIPS PUB 186-4. This is the paper's own scope and this record
      reproduces it.
    - >
      time_memory_product and area_time_AT, dense reading: n >= 435, so
      B-571/K-571 only.
    - >
      time_memory_product and area_time_AT, sparse reading: n >= 375, so
      B-409/K-409 and B-571/K-571.
    - >
      equal_rate_max_of_time_and_memory: n >= 303, unchanged from time-only,
      because Semaev's memory never exceeds his time in the swept range.
  safe_scope:
    - >
      B-163/K-163, B-233/K-233 and B-283/K-283 are outside the affected range
      under EVERY metric and both storage readings, by margins of 6.3 to 73.9
      bits. The reason is the crossover, not the memory charge: they were
      already outside it in the paper.
    - >
      B-409/K-409 leaves the affected range under the dense time-memory
      product and stays inside it under the sparse one. "Safe" is therefore
      NOT a property this record can assign to n = 409 -- it is undetermined
      by the memory model, which is the finding rather than a gap in it.
  scope_caveat: >
    "Affected" here means "inside the range where a heuristic cost model puts
    this algorithm ahead of another heuristic cost model". It does NOT mean a
    curve is broken, attacked, or weakened, and no row of this record supports
    such a reading in either direction. Semaev's Assumption 2 and the
    asymptotic bound (17) are untouched by anything here.

  implementation_ref: experiments/EXP-SEMBIN-f4a17b/code/memory_charged_cost.py
  independent_arithmetic_ref: experiments/EXP-SEMBIN-81dc96/code/independent_arith.py
  status: superseded_in_scope
  status_note: >
    Was draft pending REVIEW-SEMBIN-20260913-9d649f. That round completed and
    DEC-20260913-74e208 official_transitions moves this record to
    superseded_in_scope: arithmetic stands (triply reproduced) and is not
    withdrawn or corrected in place; what is superseded is SCOPE — it reports a
    one-parameter slice of a surface at an undeclared store value, and may no
    longer be quoted for the n=409 straddle, matched-null share = 0, a
    four-metric corroboration count, or a crossover without its full cell label.
    EXP-SEMBIN-2c40bb produces the superseding record. Applied on the COST head
    to match the decision (previously only present there).
  superseded_by_decision: DEC-20260913-74e208
  superseded_by_experiment: EXP-SEMBIN-2c40bb
