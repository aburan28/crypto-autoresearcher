  protocol_deviations:
    - id: D1
      severity: material -- a declared control is weaker than specified
      what: >
        The nearby-object control is eq. (4), the single high-degree summation
        polynomial, NOT the prime-field index calculus the contract specified.
      resolved_as: >
        A prime-field index-calculus cost model is in neither the frozen source
        nor this repository's corpus. Building one would have meant inventing
        formulas and then validating the machinery against the invention, which
        is a fabricated comparator under core rule 9 and worse than a
        substituted control. eq. (4) serves the same structural function -- a
        nearby object whose relative cost is known IN ADVANCE from the frozen
        text, since the paper's entire contribution is that the chain beats it
        -- and its degree 2^{m-1} comes from Section 2 of the source.
      effect_on_conclusions: >
        The control that would catch a cost model tuned to flatter index
        calculus IN GENERAL is weaker than specified. eq. (4) is a member of
        the same family as the object under test, so it cannot detect a bias
        shared by the family. The prime-field control remains OWED and every
        reviewer of this record should treat it as an open gap.
      owed: prime-field index calculus nearby-object control
    - id: D2
      severity: reporting
      what: >
        The van Oorschot-Wiener citation was upgraded from the contract's
        "recalled, not opened" to internal records read in full (KN-TECH-006,
        KN-LIT-012).
      resolved_as: >
        The sources were in this repository's corpus. Resolving the citation
        also supplied the program's own baseline convention, which the contract
        requires the comparison to charge against.
      effect_on_conclusions: >
        The 0.886 walk constant and the near-linear parallel speedup are still
        RELAYED rather than verified against the primary paper, which
        KN-LIT-012 itself records as not re-read.
    - id: D3
      severity: procedural
      what: >
        A stopping rule names the prime-field control ("stop the whole costing
        if the prime-field control reports index calculus beating rho at
        cryptographic sizes"). With that control substituted, the rule cannot
        be evaluated as written.
      resolved_as: >
        The rule's PURPOSE -- refuse to quote any row from machinery that
        flatters index calculus -- is carried by eq. (4) and by the
        known-false metric-sensitivity control, both of which pass. The rule
        itself is recorded as unevaluable rather than as satisfied.
  scope:
    claim_tier: heuristic_estimate
    what_this_is: >
      A cost table under four stated metrics. A memory figure is not a
      refutation; an unfavourable crossover is not an error in the paper; and
      no row says anything about the security of any curve in either
      direction. Both sides are heuristic cost models and the verdicts are
      properties of the models as much as of the algorithms.
    optimistic_assumptions_semaev:
      - >
        Assumption 1 holds at every (n, m) costed. Semaev's own Section 4.4
        remark says d_F4 generally exceeds 4 when k > ceil(n/m), and Kosters
        reported degree 5 at n = 45 (KN-LIT-e77232). Where it fails, both time
        and memory here are UNDERESTIMATES by the amounts in the
        degree-sensitivity table.
      - >
        the block-structured Groebner algorithm of Section 4.5.2 reduces
        solving to n^{4 omega}. The paper says only "We think the same approach
        is applicable" and reports no implementation.
      - eq. (11)'s yield is realized rather than bounded; H-SEMBIN-c5b2e0
        predicts it overstates realized yield
      - the relation store is charged at m*k + 2n bits per relation, assuming
        perfectly sparse storage with no index overhead
      - stage 2 is charged at 2^{k w'} with w' = 2, assuming the relation
        matrix is sparse enough for Wiedemann or Lanczos
      - the un-ceiled k = n/m reading that Table 3 uses is cheaper than the
        ceiled k the paper defines wherever m does not divide n
    optimistic_assumptions_baseline:
      - >
        q is taken as 2^n, neglecting the FIPS cofactor of 2 or 4. This
        flatters the BASELINE, not Semaev.
      - near-linear parallel speedup sqrt(q)/M at every processor count, which
        KN-LIT-012 records as heuristic rather than proved
      - >
        no time penalty for a small distinguished-point store: the
        granularity/steps tradeoff is not modelled, so a 2^30 store is given
        the same time as a 2^60 one. This is the single largest approximation
        on the baseline side and it favours the baseline.
      - the 0.886 constant is relayed from KN-TECH-006 and KN-LIT-012; the
        primary paper was not opened by this program
      - only distinguished points are charged; per-processor working state is
        neglected
    overestimating_factors_semaev:
      - the dense reading charges width^2 bits, which no implementation would
        use if the matrix is as sparse as Semaev claims
      - charging the maximum of the relation store and the working set for the
        whole run overstates peak-times-duration if the phases do not overlap
