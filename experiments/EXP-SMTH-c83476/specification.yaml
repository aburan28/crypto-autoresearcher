    - EV-DS-1e5e91

  dominated_by: Pollard rho at generic exact-ECDLP exponent 1/2
  sota_delta:
    time_exponent: 0.0
    memory_exponent: 0.0
    data_exponent: 0.0
    note: >-
      Distributional toy instrument measurement only; no ECDLP algorithm
      improvement claimed under any branch; no HEUR-DS-1 validation claimed
      under M-SUPPORT.
