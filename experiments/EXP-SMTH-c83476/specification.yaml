  # ==================================================================
  heuristic_under_test: HEUR-DS-1
  heuristic_statement: >-
    Intermediate degrees arising from half-arity Semaev partial maps on uniform
    random targets behave, for B-smoothness purposes, like uniform random integers
    of the same size. At finite X this is tested by comparing the measured LPF /
    smoothness law of the encoded intermediates to a MEASURED null distribution of
    uniform integers on the identical support [1, X], not to the asymptotic
    Dickman function rho. This contract's support branch is an instrument-pass at
    toy FB-census cells only and is NEVER a declaration that HEUR-DS-1 is
    validated.
  dickman_rho_prohibition: >-
    The asymptotic Dickman function rho is NOT the calibration of this experiment
    and MAY NOT be substituted for the measured null at the actual X. No KS
    threshold, rate-band bound, or tail threshold in this contract is derived from
    rho, from u**(-u), or from any other asymptotic smoothness model. Rho may
    appear only as optional descriptive annotation that is never a decision input.

  # ==================================================================
  objective: >-
    At each toy field size bits in {16, 20}, construct one ordinary prime-field
    curve and a deterministic factor base of Bfb = 512 distinct x-coordinates;
    enumerate EVERY unordered half-tuple with STRICT index order 0 <= i < j < 512
    (exactly C(512, 2) = 130816 pairs — diagonal absent by construction); form the
    ENC-B integer N_ij in [1, X] with X = p^2; factor every N_ij; and decide,
    under thresholds that are named order statistics of a MEASURED null
    distribution at that same X — including a mid-band LPF deep-smooth/tail
    limb with thr_TAIL>0 integrity gate — whether the LPF / smoothness law of
    {N_ij} is distinguishable from uniform integers on [1, X] as an instrument
    readout at these toy cells only.

  what_this_experiment_is_NOT:
    - Not a search, relation harvest, claw table, or discrete-logarithm computation.
    - Not a cost / wall-clock / charged-unit measurement.
    - Not a crypto-scale, medium-scale, affected-scheme, or asymptotic claim under any outcome.
    - Not a reuse, re-score, or edit of EXP-SMTH-9d04ba, EXP-SMTH-4403c4, EXP-SMTH-001, or any asymptotic-rho rule.
    - Not sufficient alone to move G1-G4 or to declare HEUR-DS-1 validated at any tier.
    - Not a license to read M-SUPPORT as HEUR-DS-1 validation under vacuous TAIL or FB-census-only scope.
    - Not an execute authorization of EXP-SMTH-9d04ba.

  claim_ceiling: >-
    TOY ONLY. Claimable at most: a scoped toy-tier instrument-pass or instrument-
    reject of the named ENC-B intermediate smoothness law versus the measured null
    at the two tested field sizes, under the frozen rules below, provided
    GATE-TAIL-NONVACUOUS passed. NOT claimable: HEUR-DS-1 validated / supported /
    discharged at any tier; crypto-scale validity or invalidity of HEUR-DS-1; any
    exponent; any scheme impact; dominated_by null; GOAL-ECDLP-001 completion.

  # ==================================================================
  smoothness_quantity:
    id: Q-SMTH-c83476
    name: ENC-B LPF and finite-X smoothness law of half-arity Semaev intermediates
    intermediate_map:
      id: INT-SMTH-c83476
      arity_m: 4
      d_half: 2
      polynomial: >-
        For distinct factor-base x-coordinates x_i, x_j in F_p, form
        S_3(x_i, x_j, Z) = c2 Z^2 + c1 Z + c0 over F_p, with
        c2 = (x_i - x_j)^2 mod p,
        c1 = -2*((x_i+x_j)*(x_i*x_j+a)+2*b) mod p,
        c0 = (x_i*x_j - a)^2 - 4*b*(x_i+x_j) mod p.
      invariants: >-
        e1 = (-c1) * c2^(-1) mod p, e2 = c0 * c2^(-1) mod p, lifts in [0, p).
      encoding_ENC_B: >-
        N = lift(e1) * p + lift(e2) + 1. Support exactly [1, p^2].
      actual_X: >-
        X = p^2 for the cell's field prime p. Every null draw, every rate bound
        B_u, and every z-transform uses this exact integer X — never D = 2^(2*bits)
        as a substitute support, and never an asymptotic model in place of X.
    primary_observables_per_integer:
      - N
      - sorted prime-power factorization of N
      - LPF(N), with LPF(1) = 1
      - z(N) = ln(max(1, LPF(N))) / ln(X)   # natural logs
      - I_u(N) = 1 if LPF(N) <= B_u else 0, for each frozen rung u
      - eligible_midband(N) = 1 if B_5 < LPF(N) <= B_4 else 0
    smoothness_rungs:
      u_values: [2, 3, 4, 5]
      bound_rule: B_u = max(2, floor(X^(1/u)))
      smooth_rate: q_u = (1/n) * sum_j I_u(N_j)
      powered_rungs: >-
        A rung u is POWERED for rate-band decisions iff the measured null
        reference rate q_u(REF) satisfies n * q_u(REF) >= 30. Unpowered rungs are
        recorded and feed descriptive diagnostics but are excluded from RATE-BAND
        pass/fail. The power cut is fixed here before any datum.
    sample_transforms:
      empirical_lpf_cdf: empirical CDF of the multiset {z(N_j)}
      ks_two_sample: >-
        D = sup_t |F_A(t) - F_B(t)| on the z-values of two equal-length samples A, B
      deep_smooth_tail_midband:
        id: Q-SMTH-c83476.deep_smooth_tail_midband
        repairs: RTc8c9eb-B1
        mid_band_definition:
          interval_notation: (L, U]
          L_exclusive: B_5
          U_inclusive: B_4
          L_formula: L = B_5 = max(2, floor(X^(1/5)))
          U_formula: U = B_4 = max(2, floor(X^(1/4)))
          eligible_predicate: B_5 < LPF(N) <= B_4
          equivalent_statement: >-
            N is mid-band eligible iff its least prime factor lies in the
            half-open integer interval (B_5, B_4].
        definition: >-
          Let S_elig = { z(N) : N in the sample and B_5 < LPF(N) <= B_4 }.
          This is the mid-band deep-smooth/tail statistic: eligibility is the
          explicit LPF interval (B_5, B_4], and T averages z over the entire
          eligible set (effective depth k_eff = |S_elig|).
        T_formula: >-
          T = mean of ALL values in S_elig (full mid-band mean;
          k_eff = |S_elig| by construction).
          If |S_elig| < min_eligible_count (=8), the run fires M-0 (insufficient
          eligible mass), never a HEUR verdict.
        min_eligible_count: 8
        secondary_mass_diagnostic: >-
          q_mid = (1/n) * |S_elig| = (1/n) * #{N : B_5 < LPF(N) <= B_4} is
          recorded as a secondary diagnostic only; it is NOT a decision input
          unless substituted by a future superseding EXP. Primary TAIL uses T
          (mean z on S_elig).
        why_not_prior_T8_lpf_gt_2: >-
          The EXP-SMTH-9d04ba statistic (mean of 8 smallest z among LPF>2) is
          FORBIDDEN here: RTc8c9eb-B1 showed E[#{LPF=3}]≈21803 ≫ 8 forces
          T≡ln(3)/ln(X) and thr_TAIL=0. The EXP-SMTH-4403c4 unrestricted
          LPF=2-inclusive T_8 is also FORBIDDEN.
        why_not_fixed_k_extremes_on_midband: >-
          Fixed k=8 extremes on the same mid-band remain FORBIDDEN at freeze
          time: E[#{LPF ≈ B_5+}] is still ≫ 8 under Mertens proxies at both
          toy X values, so k=8 extremes would re-saturate on the cheapest
          mid-band atom. Full-set mid-band mean is the structural escape.
        freeze_time_non_saturation_argument: >-
          SHORT ARGUMENT (RTc8c9eb-B1 / task gate). Target n = 130816.
          (1) Failure mode being escaped: under LPF>2 with fixed k=8,
          E[#{LPF=3}] = n/6 ≈ 21803 ≫ k, so the k-deep mean is forced to the
          single atom log ln(3)/ln(X) on essentially every null replicate.
          (2) Mid-band eligibility: LPF in (L,U] = (B_5, B_4] with
          L = max(2, floor(X^(1/5))), U = max(2, floor(X^(1/4))).
          Classical Mertens proxy P(LPF > y) ≈ e^(-γ)/ln(y) yields
          E[|S_elig|] = n * (P(LPF>B_5) - P(LPF>B_4)) of order ~3.5e3 at
          bits-16-scale X and ~2.8e3 at bits-20-scale X — many distinct primes
          in (B_5, B_4] with distinct ln(p)/ln(X).
          (3) This contract sets T = mean of the entire eligible set, so the
          effective depth is k_eff = |S_elig|. Therefore E[eligible count] =
          E[k_eff] and is not ≫ k_eff (equality, not a cheap-atom overrun of a
          fixed small k). The k-deep mean is consequently a mixture over many
          mid-band atom logs, not forced to a single atom log.
          (4) GATE-ATOM-ESCAPE-PREDICATE below forbids reintroducing any
          fixed-k extreme-mean with E[cheapest eligible atom count] ≥ k.
        forbidden_substitutions: >-
          Mean of fixed k=8 (or any fixed k with E[cheapest eligible atom] ≥ k)
          smallest z over LPF>2, over the unrestricted sample, or over the
          mid-band; any statistic whose deep-smooth end is identically a single
          ln(p_atom)/ln(X) on every null replicate; any Dickman-rho tail.

  # ==================================================================
  enumeration:
    id: ENUM-IJ-STRICT
    rule: >-
      Enumerate factor-base index pairs by the STRICT generator
      for i in 0..Bfb-1: for j in (i+1)..Bfb-1: yield (i, j).
      Equivalently: all pairs (i, j) with 0 <= i < j < Bfb.
    diagonal_exclusion: >-
      BY CONSTRUCTION. The generator never yields i == j. There is no
      post-enumeration filter, drop, mask, or "skip undefined" step. The diagonal
      is absent because the nested loops never produce it.
    pair_count_n: 130816
    pair_count_derivation: C(512, 2) = 512*511/2 = 130816
    leading_coefficient_invariant: >-
      Distinct x-coordinates and i < j imply c2 = (x_i - x_j)^2 != 0 mod p.
      Any recorded c2 == 0 is an integrity failure (M-0), not a datum.
    forbidden: >-
      Enumerating i <= j and then dropping the diagonal, or sampling with
      replacement from a smaller support, is forbidden.

  factor_base:
    Bfb: 512
    notation: >-
      Bfb = factor-base size. B_u = smoothness bound at rung u. Never write both as B.
    policy: frozen_deterministic_subset
    construction: >-
      First 512 x-coordinates in F_p, in increasing integer order, that are
      x-coordinates of points of E(F_p) for the cell's frozen curve (a, b, p).
      Record factor_base_sha256 over the canonical decimal newline-joined x-list.
    object_scope_honesty: >-
      The measured object is an ENC-B factor-base census under Bfb=512, not a
      draw of uniform-random Semaev targets in the full HEUR-DS-1 statement.
      Per RT411037-B2 / RT411037-M2 / RTc8c9eb-B2, no branch of this contract may
      equate an FB-census instrument-pass with HEUR-DS-1 validation.

  curve_family:
    field_bits: [16, 20]
    curves_per_bit_size: 1
    toy_only: true
    master_seed: 2901
    seed_domain: EXP-SMTH-c83476/v1
    seed_rule: >-
      seed(label, bits, stream_index) = first_128_bits(SHA256(
      "EXP-SMTH-c83476/v1|" || label || "|" || decimal(bits) || "|" ||
      decimal(stream_index))).
    prime_rule: >-
      Start at 2^(bits-1) + (seed("prime", bits, 0) mod 2^(bits-2)); take the
      first prime strictly below 2^bits; advance deterministically on rejection.
    curve_rule: >-
      Derive a, b from successive SHA256 blocks of seed("curve", bits, 0); reject
      until 4*a^3 + 27*b^2 != 0 mod p.
    bits_labelling: >-
      `bits` names the FIELD prime p only. No deliverable may say "at 20 bits"
      without stating that it is the field.

  # ==================================================================
  objects:
    - id: OBJ-REAL
      role: the quantity under instrument readout (FB-census ENC-B intermediates)
      description: >-
        Exhaustive ENC-B integers N_ij over ENUM-IJ-STRICT on the frozen
        deterministic factor base. Count exactly n = 130816. No sampling seed.
        This is an FB census, not a uniform-random-target draw.
    - id: OBJ-NULL-REF
      role: fixed reference null replicate (replicate index 0)
      description: >-
        n = 130816 i.i.d. uniform integers on [1, X], drawn by rejection sampling
        from unbiased SHA256-derived bits (modulo reduction forbidden), stream
        seed("null", bits, 0).
    - id: OBJ-NULL-CAL
      role: measured null calibration replicates
      description: >-
        M_CAL = 200 independent replicates, each of n = 130816 uniform integers
        on the SAME [1, X], streams seed("null", bits, r) for r = 1..200.
        These replicates ARE the measured null distribution at the actual X.
    - id: OBJ-PLANT
      role: gross power certificate only — never evidence about HEUR-DS-1
      description: >-
        Draw uniform U on [1, X] via seed("plant", bits, 0); factor U; retain only
        prime powers with prime <= B_4; set N_plant to their product (or 1).
        Emit n such integers and push through the identical pipeline.

  sample_size:
    n_per_arm: 130816
    M_CAL: 200
    bit_sizes: 2
    planned_factorizations_order_of_magnitude: >-
      Declared parameters only: 1 real + 1 ref + 200 cal + 1 plant per bit size,
      times 130816, times 2 bit sizes. Exact completed counts are recorded at
      measurement time; this freeze task produces none.

  # ==================================================================
  null_calibration:
    id: CAL-NULL-X
    statement: >-
      BEFORE any OBJ-REAL integer is generated or factored, measure the null
      distribution at the actual X: compute every decision statistic on
      (OBJ-NULL-CAL[r] vs OBJ-NULL-REF) for r = 1..200, archive the 200 values
      per statistic per bit size, and SUBSTITUTE the named order statistics
      below as the numeric thresholds. Commit null_calibration.json before the
      treatment arm begins. Immediately after committing thresholds, evaluate
      GATE-TAIL-NONVACUOUS; on failure do not begin OBJ-REAL and emit
      M-INSTRUMENT (never M-SUPPORT).
    asymptotic_rho_forbidden_here: >-
      Substituting Dickman rho, a rho-band, or any asymptotic KS critical value
      for these measured order statistics is a protocol violation and fires M-0.
    exchangeability: >-
      REF and each CAL replicate are i.i.d. uniform on [1, X] at matched n, so a
      fresh uniform sample is exchangeable with the calibration pool.

  # ==================================================================
  decision_rules:
    frozen_before_any_datum: true
    freeze_binding_task: TASK-20260803-df10d7

    ks_rule:
      id: KS-SMTH-c83476
      statistic: >-
        D_real = two-sample KS distance on z-values between OBJ-REAL and
        OBJ-NULL-REF at the same bit size.
      calibration_replicates: >-
        For r = 1..200, D_r = two-sample KS on z-values between OBJ-NULL-CAL[r]
        and OBJ-NULL-REF.
      threshold_formula: >-
        thr_KS = the 199th ascending order statistic of {D_1, ..., D_200}.
      reject_rule: D_real > thr_KS
      pass_rule: D_real <= thr_KS
      exact_null_level: >-
        P(fresh uniform exceeds the 199th of 200 exchangeable null replicates)
        = (201 - 199) / 201 = 0.00995 on the measured null, by construction.
      numeric_constants_pre_registered:
        M_CAL: 200
        order_statistic_index_ascending_1_based: 199
        alpha_exact_on_measured_null: 0.00995

    rate_band_rule:
      id: RATE-BAND-SMTH-c83476
      statistic_per_powered_u: >-
        delta_u_real = |q_u(OBJ-REAL) - q_u(OBJ-NULL-REF)|
      calibration_per_powered_u: >-
        For r = 1..200, delta_u,r = |q_u(OBJ-NULL-CAL[r]) - q_u(OBJ-NULL-REF)|
      threshold_formula: >-
        thr_RATE_u = the 199th ascending order statistic of
        {delta_u,1, ..., delta_u,200}.
      band_statement: >-
        Equivalently, q_u(OBJ-REAL) lies in the closed interval
        [q_u(REF) - thr_RATE_u, q_u(REF) + thr_RATE_u]. Those two endpoints ARE
        the pre-registered numeric rate-band bounds once CAL-NULL-X is committed.
      reject_at_u: delta_u_real > thr_RATE_u
      pass_at_bit_size: >-
        RATE-BAND passes at a bit size iff for EVERY powered u in {2,3,4,5},
        delta_u_real <= thr_RATE_u.
      fail_at_bit_size: negation of pass_at_bit_size
      numeric_constants_pre_registered:
        M_CAL: 200
        order_statistic_index_ascending_1_based: 199
        u_ladder: [2, 3, 4, 5]
        min_expected_smooth_for_power: 30

    tail_rule:
      id: TAIL-SMTH-c83476
      repairs: RTc8c9eb-B1
      statistic: >-
        Using Q-SMTH-c83476.deep_smooth_tail_midband exclusively:
        T_real = mean of all z-values among OBJ-REAL integers with
        B_5 < LPF <= B_4; T_ref = same transform on OBJ-NULL-REF;
        tau_real = |T_real - T_ref|.
      calibration: >-
        For r = 1..200, tau_r = |T_CAL[r] - T_ref| with T_CAL[r] the mid-band
        full-eligible-set mean of OBJ-NULL-CAL[r].
      threshold_formula: >-
        thr_TAIL = the 199th ascending order statistic of {tau_1, ..., tau_200}.
      reject_rule: tau_real > thr_TAIL
      pass_rule: tau_real <= thr_TAIL
      why_not_rho: >-
        The asymptotic rule n * min_j rho(u_j) >= 1 false-fires on correct finite-X
        nulls. This rule uses only the measured mid-band order-statistic null.
      why_not_atom_saturating: >-
        Full mid-band mean on (B_5, B_4] is a mixture over many LPF atoms with
        distinct ln(p)/ln(X); it is not the fixed-k extreme mean that collapsed
        onto ln(2)/ln(X) (4403c4) or ln(3)/ln(X) (9d04ba). See
        freeze_time_non_saturation_argument.
      numeric_constants_pre_registered:
        M_CAL: 200
        order_statistic_index_ascending_1_based: 199
        mid_band_L_exclusive: B_5
        mid_band_U_inclusive: B_4
        eligible_predicate: B_5 < LPF(N) <= B_4
        tail_mean_mode: full_eligible_set
        min_eligible_count: 8
        fixed_k_extreme_mean_forbidden: true

    integrity_gate_tail_nonvacuous:
      id: GATE-TAIL-NONVACUOUS
      repairs: [RT411037-B1, RTc8c9eb-B1]
      evaluated_when: >-
        Immediately after CAL-NULL-X commits thr_TAIL (and the archived tau_1..tau_200)
        at each bit size, BEFORE any OBJ-REAL generation and BEFORE any reading
        branch other than M-0 / M-INSTRUMENT may be emitted.
      pass_conditions_all_required:
        - thr_TAIL > 0
        - max(tau_1, ..., tau_200) > 0
        - not (all tau_r identical and equal to 0)
        - >-
          thr_TAIL is discriminating: the reject_rule tau_real > thr_TAIL is not
          vacuously impossible for every sample retaining the mid-band eligible
          mass that the null itself exhibits (equivalently: thr_TAIL is positive and
          at least one calibration replicate has tau_r > 0)
      fail_classification: >-
        On failure at either bit size: abort the measurement package as
        invalid_measurement / inconclusive_instrument. Emit reading branch
        M-INSTRUMENT. MUST NOT emit M-SUPPORT. MUST NOT emit M-REFUTE or
        M-SPLIT as a HEUR verdict. Record thr_TAIL, the tau cloud summary, and
        the failing pass_condition ids.
      explicit_prohibition: >-
        If thr_TAIL == 0, OR thr_TAIL is non-positive, OR the calibrated tail
        threshold is non-discriminating under the pass_conditions above, then
        M-SUPPORT is forbidden. A conjunction that would otherwise look like
        KS-pass ∧ RATE-BAND-pass ∧ TAIL-pass under a vacuous thr_TAIL is NOT a
        support outcome and MUST be reclassified as M-INSTRUMENT.

    integrity_gate_atom_escape:
      id: GATE-ATOM-ESCAPE-PREDICATE
      repairs: RTc8c9eb-B1
      evaluated_when: freeze_time_and_implementation_review
      statement: >-
        Any deep-smooth design that takes the mean of a fixed k smallest eligible
        z-values is ADMISSIBLE only if a freeze-time (or pre-exec) audit shows
        E[count of cheapest eligible LPF atom] < k at the target n. Designs with
        E[cheapest eligible atom count] ≥ k are FORBIDDEN (they force T to a
        single atom log). This contract's full-eligible-set mid-band mean
        satisfies the predicate vacuously by not using fixed-k extremes;
        reintroducing fixed-k extremes on (B_5, B_4] or LPF>2 without a passing
        atom audit is an integrity failure (M-0).
      pass_condition: >-
        Implementation uses Q-SMTH-c83476.deep_smooth_tail_midband
        (full_eligible_set) only; no fixed-k extreme-mean path exists.

    bit_size_pass: >-
      A completed bit size PASSES the instrument-consistency conjunction iff
      GATE-TAIL-NONVACUOUS passed at that bit size AND KS-SMTH-c83476 pass AND
      RATE-BAND-SMTH-c83476 pass AND TAIL-SMTH-c83476 pass, after M-0, M-INSTRUMENT,
      and M-5 have not fired.
    bit_size_reject: >-
      A completed bit size REJECTS the instrument-consistency conjunction iff
      GATE-TAIL-NONVACUOUS passed at that bit size AND at least one of KS,
      RATE-BAND, or TAIL rejects, after M-0, M-INSTRUMENT, and M-5 have not fired.

  plant_control:
    id: CTRL-PLANT-B4
    required_before_treatment_reading: true
    pass_rule: >-
      At each bit size, KS between OBJ-PLANT and OBJ-NULL-REF must reject at
      thr_KS (same formula), AND delta_4(OBJ-PLANT, REF) must reject at
      thr_RATE_4. Failure suspends under M-5; it is not a HEUR-DS-1 result.
    non_claim: >-
      Certifies only that the apparatus detects gross B_4-smooth truncation.
      It does not certify power against subtle alternatives, and it does not
      alone certify TAIL power (GATE-TAIL-NONVACUOUS is the TAIL integrity gate).

  # ==================================================================
  pre_registered_reading_rule:
    id: RR-SMTH-c83476
    repairs: [RTc8c9eb-B1, RTc8c9eb-B2, RT411037-B1, RT411037-B2]
    frozen_before_any_datum_exists: true
    precedence: >-
      M-0, then M-INSTRUMENT, then M-5, then exactly one of M-SUPPORT, M-REFUTE,
      M-SPLIT.
    HEUR_DS_1_anti_promotion:
      id: HEUR_DS_1_anti_promotion
      repairs: [RT411037-B2, RTc8c9eb-B2]
      rule: >-
        No reading branch of this contract — including M-SUPPORT — may be
        equated with "HEUR-DS-1 validated", "HEUR-DS-1 supported", or
        "HEUR-DS-1 discharged" at any tier. This prohibition is especially
        binding while TAIL is vacuous (GATE-TAIL-NONVACUOUS failed or thr_TAIL
        non-positive / non-discriminating) OR while the measured object is only
        an FB census under ENC-B / Bfb=512 (which is always true of OBJ-REAL
        here). Coordinator evidence/decision text citing this package must not
        mark HEUR-DS-1 validated or supported on the strength of this contract
        alone.
    branches:
      - id: M-0
        name: INTEGRITY GUARD
        condition: >-
          Any of: pair count != 130816; any i >= j in the enumerated index list;
          any c2 == 0; any N outside [1, X]; any factorization that fails
          independent reconstruction/primality re-check; null support or n
          mismatch; any use of Dickman rho as a decision threshold; timeout,
          crash, or budget cancellation; contract sha256 mismatch vs freeze
          receipt; treatment arm begun before null_calibration.json commit;
          |S_elig| < min_eligible_count (=8) on any arm required for TAIL;
          substitution of a forbidden fixed-k extreme-mean (LPF>2 T_8, unrestricted
          T_8, or mid-band T_8) for Q-SMTH-c83476.deep_smooth_tail_midband;
          violation of GATE-ATOM-ESCAPE-PREDICATE.
        disposition: >-
          Infrastructure / integrity signal. NEVER a mathematical result about
          HEUR-DS-1 (AGENTS.md rule 5). NEVER M-SUPPORT.
        heuristic_verdict: none
        failure_class: invalid_measurement

      - id: M-INSTRUMENT
        name: INCONCLUSIVE INSTRUMENT (VACUOUS OR NON-DISCRIMINATING TAIL)
        repairs: [RT411037-B1, RTc8c9eb-B1]
        condition: >-
          GATE-TAIL-NONVACUOUS fails at either bit size after CAL-NULL-X:
          thr_TAIL == 0, OR thr_TAIL is non-positive, OR the calibrated tail
          threshold is non-discriminating under GATE-TAIL-NONVACUOUS
          pass_conditions (including max tau_r == 0 or all tau_r identical at 0).
        disposition: >-
          inconclusive_instrument / invalid_measurement. The deep-smooth/tail
          limb is vacuous or non-discriminating; the package aborts. MUST NOT
          emit M-SUPPORT. MUST NOT treat KS∧RATE-BAND alone as a support
          conjunction. NEVER a HEUR-DS-1 validated / supported / refuted claim.
        heuristic_verdict: none
        failure_class: invalid_measurement
        alternate_label: inconclusive_instrument
        forbids_branches: [M-SUPPORT, M-REFUTE, M-SPLIT]

      - id: M-5
        name: APPARATUS FAILURE
        condition: >-
          CTRL-PLANT-B4 fails at either bit size, OR OBJ-NULL-REF versus a held-out
          null stream (seed("null", bits, 201), n = 130816) itself rejects KS or
          RATE-BAND or TAIL at the calibrated thresholds (impossible for a correct
          uniform apparatus at the declared level except with exact probability
          ~0.01 per test), AFTER GATE-TAIL-NONVACUOUS has passed.
        disposition: MAP SUSPENDED. Instrument failure. No HEUR-DS-1 verdict. NEVER M-SUPPORT as HEUR validation.
        heuristic_verdict: none
        failure_class: invalid_measurement

      - id: M-SUPPORT
        name: TOY-CELL INSTRUMENT-PASS (NOT HEUR-DS-1 VALIDATION)
        repairs: [RT411037-B2, RTc8c9eb-B2]
        condition: >-
          No M-0, no M-INSTRUMENT, no M-5, GATE-TAIL-NONVACUOUS passed at BOTH
          bit sizes, AND bit_size_pass at BOTH bits 16 and bits 20.
        disposition: >-
          INSTRUMENT-PASS AT TOY CELLS ONLY. At the tested toy cells
          (bits in {16,20}), under INT-SMTH-c83476 / ENC-B / Bfb=512 / measured-
          null thresholds including non-vacuous TAIL-SMTH-c83476, the FB-census
          intermediate smoothness law is NOT distinguishable from the measured
          uniform null by the frozen KS ∧ RATE-BAND ∧ TAIL conjunction.
          Explicitly NOT "HEUR-DS-1 validated". Explicitly NOT "HEUR-DS-1
          supported" at any tier. Explicitly NOT heuristic validation of
          HEUR-DS-1. Explicitly NOT crypto-scale validation; NOT asymptotic
          support; NOT movement of G1-G4; NOT `supported` for H-SMTH-001.
          While the object remains an FB census (always, under this contract),
          this branch MUST NOT be read as discharging HEUR-DS-1's
          uniform-random-target statement. If TAIL were vacuous, this branch
          would be unreachable (M-INSTRUMENT fires instead).
        heuristic_verdict: instrument_pass_at_toy_cells_only
        forbids_reading_as:
          - HEUR-DS-1 validated
          - HEUR-DS-1 supported
          - HEUR-DS-1 discharged
          - support_at_toy_scope as heuristic validation
        hypothesis_transition_ceiling: >-
          Evidence may record direction consistent_with instrument at toy cells
          only; it MUST NOT mark HEUR-DS-1 validated. Coordinator alone may
          change H-SMTH-001 status and must refuse HEUR-DS-1 promotion on this
          branch alone.

      - id: M-REFUTE
        name: TOY-CELL INSTRUMENT-REJECT (NOT CRYPTO-SCALE REFUTATION)
        condition: >-
          No M-0, no M-INSTRUMENT, no M-5, GATE-TAIL-NONVACUOUS passed at BOTH
          bit sizes, AND bit_size_reject at BOTH bits 16 and bits 20.
        disposition: >-
          INSTRUMENT-REJECT AT TOY CELLS ONLY. At the tested toy cells, under the
          same frozen objects and measured-null thresholds, the FB-census
          intermediate smoothness law IS distinguishable from the measured
          uniform null. Scoped toy-cell instrument reject only. Explicitly NOT
          crypto-scale refutation of HEUR-DS-1; NOT reject_scoped-as-impossibility
          on one unreplicated package; NOT a statement about other encodings, m,
          or Bfb.
        heuristic_verdict: instrument_reject_at_toy_cells_only
        hypothesis_transition_ceiling: >-
          Evidence may record direction against at toy instrument scope;
          Coordinator alone may change H-SMTH-001 status, and must write
          status_scope. Not HEUR-DS-1 crypto-scale refutation.

      - id: M-SPLIT
        name: INCONCLUSIVE SPLIT
        condition: >-
          No M-0, no M-INSTRUMENT, no M-5, GATE-TAIL-NONVACUOUS passed at BOTH
          bit sizes, AND exactly one of the two bit sizes satisfies bit_size_pass
          while the other satisfies bit_size_reject.
        disposition: >-
          Inconclusive on the toy instrument conjunction. Record both cells'
          statistics and thresholds. No post-hoc single-cell success or failure
          label. NOT HEUR-DS-1 validated. NOT HEUR-DS-1 refuted.
        heuristic_verdict: inconclusive

    symmetric_support_and_refute: >-
      M-SUPPORT and M-REFUTE are symmetric instrument outcomes: both require
      GATE-TAIL-NONVACUOUS and the same conjunction structure at BOTH bit sizes;
      both are scoped to the identical toy FB-census boundary; both are blocked
      by M-0 / M-INSTRUMENT / M-5; neither is crypto-scale; neither validates or
      refutes HEUR-DS-1 as a heuristic beyond the instrument readout. Support
      here means indistinguishability from the measured null under the frozen
      instrument; refute means distinguishability. An inconclusive split is
      first-class, not dressed as either. Vacuous TAIL cannot produce M-SUPPORT.
    exhaustiveness: >-
      After M-0 / M-INSTRUMENT / M-5, each bit size is pass or reject. Both pass
      -> M-SUPPORT (instrument-pass only). Both reject -> M-REFUTE. Mixed ->
      M-SPLIT. No gap. Vacuous thr_TAIL routes to M-INSTRUMENT before any of
      these three.

  # ==================================================================
  metrics:
    primary:
      - SMTH_ks_D_real
      - SMTH_ks_thr
      - SMTH_ks_pass
      - SMTH_q_u_real
      - SMTH_q_u_ref
      - SMTH_delta_u_real
      - SMTH_thr_RATE_u
      - SMTH_rate_band_pass
      - SMTH_T_real_midband
      - SMTH_T_ref_midband
      - SMTH_tau_real
      - SMTH_thr_TAIL
      - SMTH_tail_pass
      - SMTH_gate_tail_nonvacuous_pass
      - SMTH_bit_size_pass
      - SMTH_plant_ks_rejected
      - SMTH_reading_branch
    secondary:
      - factor_base_sha256
      - null_calibration_sha256
      - pair_count_verified
      - diagonal_present_count
      - eligible_midband_count
      - q_mid_diagnostic
      - factorization_certificates_verified
      - peak_rss_bytes
      - wall_seconds_total

  controls:
    - id: CTRL-NULL-FIRST
      method: Commit measured null_calibration.json before any OBJ-REAL factorization.
      pass_condition: treatment arm entry point disabled until calibration artifact exists and hashes.
    - id: CTRL-TAIL-NONVACUOUS
      method: >-
        Evaluate GATE-TAIL-NONVACUOUS immediately after thr_TAIL is committed from
        the measured null tau cloud; require thr_TAIL > 0 and discriminating tau_r.
      pass_condition: >-
        GATE-TAIL-NONVACUOUS pass at both bit sizes; else M-INSTRUMENT and halt
        before OBJ-REAL / before M-SUPPORT.
    - id: CTRL-ATOM-ESCAPE
      method: >-
        Implementation review against GATE-ATOM-ESCAPE-PREDICATE: TAIL must use
        full mid-band eligible-set mean on (B_5, B_4]; no fixed-k extreme-mean path.
      pass_condition: Q-SMTH-c83476.deep_smooth_tail_midband only.
    - id: CTRL-IJ-CONSTRUCTION
      method: >-
        Verify the enumerated index list equals [(i,j) for i in range(512) for j in
        range(i+1, 512)] and len == 130816.
      pass_condition: exact match; diagonal_present_count == 0.
    - id: CTRL-RANGE
      method: Assert every N in [1, X] with X = p^2.
      pass_condition: no violation, else M-0.
    - id: CTRL-FACT
      method: >-
        Independent re-verification of every recorded factorization (primality of
        each factor + product reconstruction) on a path that does not reuse the
        factoring call.
      pass_condition: verified == total on every arm, else M-0.
    - id: CTRL-PLANT-B4
      method: Gross B_4-smooth truncation power certificate (see plant_control).
      pass_condition: must reject KS and RATE at u=4; else M-5.
    - id: CTRL-NO-RHO
      method: Grep decision path for any rho-based threshold substitution.
      pass_condition: zero hits in decision code and in applied thresholds.
    - id: CTRL-NO-FIXED-K-ATOM-TAIL
      method: >-
        Grep decision path for forbidden fixed-k extreme-mean TAIL (LPF>2 T_8,
        unrestricted T_8, or mid-band T_8); require full_eligible_set mid-band mean.
      pass_condition: TAIL uses Q-SMTH-c83476.deep_smooth_tail_midband only.

  independent_variables:
    - field_bits: [16, 20]
    - object: [OBJ-REAL, OBJ-NULL-REF, OBJ-NULL-CAL, OBJ-PLANT]
  fixed_variables:
    arity_m: 4
    d_half: 2
    factor_base_size_Bfb: 512
    n_per_arm: 130816
    M_CAL: 200
    master_seed: 2901
    enumeration: ENUM-IJ-STRICT
    mid_band_L_exclusive: B_5
    mid_band_U_inclusive: B_4
    tail_mean_mode: full_eligible_set

  replication:
    master_seed: 2901
    runs_planned: 2
    planned_runs:
      - id: RUN-SMTH-c83476-calib
        purpose: >-
          CAL-NULL-X at both bit sizes; commit thr_KS, thr_RATE_u, thr_TAIL;
          evaluate GATE-TAIL-NONVACUOUS; run CTRL-PLANT-B4; do NOT generate
          OBJ-REAL. On GATE failure emit M-INSTRUMENT and stop.
      - id: RUN-SMTH-c83476-real
        purpose: >-
          After calibration commit, GATE-TAIL-NONVACUOUS pass, and plant pass,
          generate OBJ-REAL at both bit sizes, evaluate KS / RATE-BAND / TAIL
          against frozen thresholds, emit reading branch (instrument-pass scope
          only for M-SUPPORT).
    replication_status_declared: >-
      NONE claimed. A single unreplicated package cannot promote H-SMTH-001 to
      supported or reject_scoped, and cannot validate HEUR-DS-1.

  budget:
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 2
    new_dependencies: >-
      sympy factorint / isprime only (version recorded at runtime). No ECM, no
      external CAS, no network.
    stopping_rules_budget: >-
      Stop at wall-clock ceiling; short arms fire M-0 and are never padded.
      Budget exhaustion is resource_exhaustion, never a HEUR-DS-1 negative.

  stopping_rules:
    - Stop calibration when all 200 CAL replicates and REF and plant complete at both bit sizes, or at wall clock.
    - Immediately after thr_TAIL commit, evaluate GATE-TAIL-NONVACUOUS; on fail emit M-INSTRUMENT and do not begin OBJ-REAL.
    - Do not begin OBJ-REAL until null_calibration.json is committed, GATE-TAIL-NONVACUOUS passes, and CTRL-PLANT-B4 passes.
    - Stop treatment when OBJ-REAL completes at both bit sizes, or at wall clock.
    - Stop immediately on CTRL-FACT or CTRL-IJ-CONSTRUCTION failure.

  invalidation_rules:
    - Any edit of this specification after freeze_receipt.json without a new EXP id.
    - Any Dickman-rho threshold used as KS, rate-band, or tail decision input.
    - Any i <= j enumeration or post-hoc diagonal drop.
    - Null calibrated after seeing OBJ-REAL statistics.
    - Sample-size or threshold choice after seeing treatment data.
    - Any use of fixed-k extreme-mean (LPF>2 T_8, unrestricted T_8, or mid-band T_8) as TAIL-SMTH-c83476.
    - Any emission of M-SUPPORT when GATE-TAIL-NONVACUOUS failed or thr_TAIL <= 0.
    - Any reading of M-SUPPORT as HEUR-DS-1 validated / supported / discharged.
    - Any edit of EXP-SMTH-9d04ba or EXP-SMTH-4403c4.

  success_criterion: >-
    S-SMTH-c83476 — a complete valid package: calibration committed,
    GATE-TAIL-NONVACUOUS passed, plant control passed, both bit sizes at
    n = 130816 with 100 percent factorization re-verification, no M-0 /
    M-INSTRUMENT / M-5, and exactly one of M-SUPPORT, M-REFUTE, or M-SPLIT
    readable from RR-SMTH-c83476 with instrument-pass scoping. Success is
    completeness of the measurement, not a preferred HEUR verdict, and never
    HEUR-DS-1 validation.

  falsification_criterion: >-
    F-SMTH-c83476-REFUTE — branch M-REFUTE: instrument reject at both toy cells
    under the measured-null rules (scoped toy instrument reject).
    F-SMTH-c83476-SUPPORT — branch M-SUPPORT is the symmetric positive criterion
    for instrument-pass at both toy cells (NOT HEUR-DS-1 validation).
    F-SMTH-c83476-INSTRUMENT — M-0, M-INSTRUMENT, or M-5 falsifies the instrument
    only (vacuous thr_TAIL routes here; never to M-SUPPORT).

  outcome_disposition:
    M-0_or_M-INSTRUMENT_or_M-5: >-
      inconclusive on HEUR-DS-1; infrastructure/instrument; AGENTS.md rule 5;
      invalid_measurement or inconclusive_instrument; NEVER M-SUPPORT.
    M-SUPPORT: >-
      toy-cell instrument-pass only; NOT HEUR-DS-1 validated; replicate and
      broaden beyond FB census before any stronger claim.
    M-REFUTE: toy-cell instrument-reject only; status_scope mandatory if weakened.
    M-SPLIT: inconclusive; not HEUR-DS-1 validated or refuted.

  certificate:
    kind: none
    note: >-
      No discrete-logarithm solve and no factor-base relation is claimed. Per-integer
      factorization reconstruction checks are instrument controls, not solution
      certificates under docs/claims-and-verification.md.

  required_artifacts:
    - experiments/EXP-SMTH-c83476/specification.yaml
    - experiments/EXP-SMTH-c83476/implementation/smthc83476_driver.py
    - experiments/EXP-SMTH-c83476/implementation/implementation.md
    - experiments/EXP-SMTH-c83476/runs/RUN-SMTH-c83476-calib/manifest.yaml
    - experiments/EXP-SMTH-c83476/runs/RUN-SMTH-c83476-calib/command.txt
    - experiments/EXP-SMTH-c83476/runs/RUN-SMTH-c83476-calib/environment.json
    - experiments/EXP-SMTH-c83476/runs/RUN-SMTH-c83476-calib/stdout.log
    - experiments/EXP-SMTH-c83476/runs/RUN-SMTH-c83476-calib/stderr.log
    - experiments/EXP-SMTH-c83476/runs/RUN-SMTH-c83476-calib/raw-result.json
    - experiments/EXP-SMTH-c83476/runs/RUN-SMTH-c83476-real/manifest.yaml
    - experiments/EXP-SMTH-c83476/runs/RUN-SMTH-c83476-real/command.txt
    - experiments/EXP-SMTH-c83476/runs/RUN-SMTH-c83476-real/environment.json
    - experiments/EXP-SMTH-c83476/runs/RUN-SMTH-c83476-real/stdout.log
    - experiments/EXP-SMTH-c83476/runs/RUN-SMTH-c83476-real/stderr.log
    - experiments/EXP-SMTH-c83476/runs/RUN-SMTH-c83476-real/raw-result.json
    - experiments/EXP-SMTH-c83476/results/null_calibration.json
    - experiments/EXP-SMTH-c83476/results/HEUR_SMTH_report.json

  does_not_modify_hypotheses:
