  controls:
  - 'Exactly one native control process, after committed source/build admission. Field:
    all361monomial products and4096hash products from SHA256(N19-PAIR-TRANSPORT-v1-field-k),
    k0..4095, firsttwo32bitlelimbs mod2^19. Independent unreduced polynomial product/reduction.
    For inverses use1+firstlimb mod(2^19-1) so all4096 are nonzero; validate zero
    separately.'
  - 'Normal conversion: verify all524288fieldvalues round-trip polynomial/normal and
    Frob-to-left-rotate-one correspondence. Check both5nibble-table and independent
    linear-combination implementations. Verify least normalbeta and all19columns,
    not an assumed rotation direction.'
  - 'Group: 4096hash samples from SHA256(N19-PAIR-TRANSPORT-v1-group-k), firsttwo32bitlelimbs
    mod152 selectsortedp,q; batch[q,O,p,-p,-q] comparedentrywise with independent
    group arithmetic. Include all152point subgroupchecks incontrols, identity,T=(0,1),
    doubling/cancellation, and standalone canonicalization ofT andO to exercise short
    orbits.'
  - Verify each table row is a real pair of B points with sum equal to its stored
    key/representative under its documented convention. For every one of11097expanded
    pair sums, both canonical lookups must recover an exact pair. Allnonnull returnedendpoints
    remaininB.
  - 'Form a control-only public point universe: O, thenfor each of the6909archived
    publicscalarrepresentatives d, Q=[d]G, iterate j0..18 and signs+,- inthatorder.
    Verify262543distinct points, oncurve/prime-subgroup coverage and orbit sizes.
    Compare all3pair-membership decisions on every point against the expanded pairset;
    replay both canonical witnesses for everypairmember. Retain three membershipbitvectors
    aligned tothis declared order and equality/hash receipts; do not emit a scalar-log
    lookup table.'
  - For all6909public target representatives compare exact3queries acrossall3arms,
    retaining pertarget verdicts, probe counts and witnesses. Required coverage6189SAT/720UNSAT
    in each arm, matchingacceptedprior; outcome and first-hit third-point index should
    agree. Witness pairs maydiffer. Table reuse inthis exhaustivecontrol is labeledvalidation
    and nottiming evidence. Also compare Q=O and all152points ofB as153separate exception
    queries, with expanded reference outcomes and full witness checks; these do not
    enter the6909nonzero-orbit coverage totals.
  - 'Known-false controls: an inputbase missingonepoint mustfail Frobenius/signclosure
    guard; choose a nonzero prime-subgroup pair sum and corrupt its inverse shift
    by+1 and its sign separately, and require actualgroup verifier rejects both forgedwitnesses;
    reject mismatched tablekey/storedsum and offcurve input. A stand-alone xkey match
    is not a witness. Preserve forged-input definitions and actual rejection results.'
