experiment:
  id: EXP-SLHDSA-9cbad4
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-SLHDSA-3a403a
  question_id: RQ-SLHDSA-001
  goal_id: GOAL-SLHDSA-001
  batch_id: null

  title: >-
    SLH-DSA FORS slack meter: cheapest-decisive-first evaluation of the
    interleaved-target occupancy moment with its leaf-collision refinement, the
    worst-case-occupancy exclusion, the VARIANT-P nearby-object control, and a
    cost-convention register anchored on AES-128 key search

  objective: >-
    If separately approved, frozen, and authorized, produce GOAL-SLHDSA-001's
    first deliverable: a re-derived FORS interleaved-target quantity with every
    constant tracked, at the six FIPS 205 parameter sets, together with the
    resulting slack reported as a CURVE over the signature budget q crossed with
    a REGISTER over cost conventions, classical and quantum, and an explicit
    statement of which conventions and which q the headline figures assume. The
    first deliverable is the measurement, not an attack; the contract is written
    so that "the margin is comfortable" is a fully admissible outcome and so
    that no arm can produce an attack claim.

  what_this_is_not:
    - Not an attack on SLH-DSA, not a forgery, not a key recovery, not a break of any kind.
    - Not an improvement to any known attack. The generic interleaved-target attack costed here is the known one and is not modified.
    - Not a claim about SHA-2, SHAKE, or any hash function's cryptanalytic security.
    - Not a claim about the WOTS+ layer or the hypertree. It computes ONE TERM of a figure that is a minimum over layers.
    - >-
      NOT A FAULT, ROWHAMMER, OR MEMORY-CORRUPTION RESULT, AND NOT COMPARABLE TO
      ONE. RQ-SLHDSA-001 and GOAL-SLHDSA-001 both require that claim class to be
      strictly separate. No artifact of this contract may cite, combine with, or
      appear alongside such a result.
    - Not a statement that any FIPS 205 parameter set should change, is adequate, or is inadequate.
    - Not a security level for SLH-DSA. Any output sentence of the form "SLH-DSA-128x has N bits of security" is an invalidation event, not a result.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run exists.
    - >-
      Not an analysis of any deployed scheme when it speaks of VARIANT-P.
      VARIANT-P is a hypothetical control object constructed here and is not
      SLH-DSA, not FIPS 205, and not any standardized or deployed algorithm.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      TOY while the parameter constants remain unverified, which is their status
      as this contract is written. A completed run could support, at most:
      "under the random-oracle idealization of the SLH-DSA message digest, and
      taking (h, a, k) as [the values established or recorded as unverified in
      Stage 0], the expected per-attempt success probability of the described
      generic interleaved-target forgery against the FORS layer equals
      2^{-ak} T_k(q/2^h), its leaf-collision refinement equals
      2^{-ak} E[m(X)^k], no worst-case-occupancy bound is non-vacuous at these
      constants, and the charged costs under the stated conventions are [the
      register]." IF STAGE 0 OBTAINS PRIMARY TEXT AND VERIFIES THE CONSTANTS the
      ceiling rises to medium for the arithmetic conclusions only, and NEVER to
      crypto: no run of this contract computes anything about a fielded system's
      resistance to a real adversary. AGENTS.md rule 7 applies with the extra
      force RQ-SLHDSA-001 states for standardized algorithms.
    tier_of_the_variant_p_arm: >-
      Toy, permanently, and separately labelled. VARIANT-P is a constructed
      control object; no tier statement about it transfers to SLH-DSA.

  inputs:
    parameter_sets_recalled_unverified:
      note: >-
        RECALLED-UNVERIFIED. These are candidates to check, not authorities. Stage
        0 replaces each with a quotation carrying a document section number, or
        records that the document could not be obtained. Every downstream number
        inherits whichever status results.
      sets:
        "128s": {h: 63, d: 7, a: 12, k: 14, n_bytes: 16, nominal_category_bits: 128}
        "128f": {h: 66, d: 22, a: 6, k: 33, n_bytes: 16, nominal_category_bits: 128}
        "192s": {h: 63, d: 7, a: 14, k: 17, n_bytes: 24, nominal_category_bits: 192}
        "192f": {h: 66, d: 22, a: 8, k: 33, n_bytes: 24, nominal_category_bits: 192}
        "256s": {h: 64, d: 8, a: 14, k: 22, n_bytes: 32, nominal_category_bits: 256}
        "256f": {h: 68, d: 17, a: 9, k: 35, n_bytes: 32, nominal_category_bits: 256}
      q_max_recalled_unverified: 18446744073709551616
      q_max_note: "2^64 signatures per key pair. RECALLED-UNVERIFIED."
    grids:
      q_log2: [20, 30, 40, 48, 50, 60, 64]
      lambda_log2: [-40, -30, -20, -10, -4, -1, 0, 1]
      theta: ["0", "1/3", "1/2", "2/3", "1"]
      tail_probability_log2: [-64, -128, -192, -256]
      maxdepth_log2_recalled_unverified: [40, 64, 96]
      resubmission_budget_r: [0, 1, 4, 16, 64]
      k_null: 1
      a_ladder_for_correction_control: [6, 8, 9, 12, 14]
    monte_carlo_cells:
      note: "Only Stage 4 uses randomness. Everything else is deterministic exact arithmetic."
      cells:
        - {B_log2: 10, q_log2: 10, a: 4, k: 3}
        - {B_log2: 10, q_log2: 12, a: 4, k: 5}
        - {B_log2: 12, q_log2: 12, a: 6, k: 5}
        - {B_log2: 12, q_log2: 14, a: 6, k: 8}
      trials_per_cell: 4096
    seeds:
      master_seed_decimal: "9142713"
      derivation_rule: >-
        Every random draw uses a counter-based stream. For a cell labelled
        L = "<B_log2>-<q_log2>-<a>-<k>" and a trial ordinal t (0-based) and a
        purpose string P in {"index", "leaf"}, the seed bytes are
        SHA-256( ASCII of  "EXP-SLHDSA-9cbad4/v1" || "|" || L || "|" || P || "|"
        || decimal(t) ), big-endian unsigned. Values are produced by rejection
        sampling: for a range of size R, draw ceil(log2 R) + 64 bits from the
        stream, reject any value >= floor(2^bits / R) * R, otherwise emit
        value mod R. A third party reproduces every instance bit-for-bit from
        this rule, the master seed, and the cell labels; no other source of
        randomness is permitted anywhere in the contract.
    environment_declared:
      note: >-
        MEASURED BY THE PROPOSING SESSION ON THIS CONTAINER, 2026-08-05, because
        the session angle brief records two scouts disagreeing about it and
        requires the contract to settle it rather than inherit it.
      python: "3.11.15"
      numpy: "2.4.6 PRESENT"
      sympy: "ABSENT"
      dependencies_used: "Python standard library only: math, fractions, itertools, random, hashlib, json"
      consequence: >-
        No solver, no CAS, and no numerical library is required by any stage.
        This contract therefore cannot be blocked by a missing dependency, and no
        infrastructure request is implied.

  arms_and_controls:
    treatment:
      - >-
        ARM T1 -- exact moment. Compute T_k(lambda) = SUM_{j=1..k} S(k,j)
        lambda^j over exact Fractions for every (parameter set, q) cell, and
        C2 = a*k - log2 T_k(lambda).
      - >-
        ARM T2 -- leaf-collision refinement. Compute
        E_{X~Poisson(lambda)}[ m(X)^k ], m(g) = 2^a (1 - (1 - 2^{-a})^g), by a
        log-space Poisson sum truncated where the term ratio has fallen below
        2^{-80} for 20 consecutive terms, with the truncation point recorded;
        and C3 = a*k - log2 E[m(X)^k].
      - >-
        ARM T3 -- surrogate ladder. Compute S0 = q^k; S1 = q * G^{k-1} with G the
        least integer such that 2^h * P[Poisson(lambda) > G] <= 2^{-s} for each s
        in the tail grid; S2 = 2^h T_k(lambda); S3 = 2^h E[m(X)^k]. Report
        slack_1(s) = log2 S1 - log2 S2 and the ordering S0 >= S1 >= S2 >= S3.
      - >-
        ARM T4 -- cost register. W_theta(q) = 2^{ak} (q k)^{theta} / T_k(lambda)
        over the theta grid, plus the quantum rows (depth-capped Grover, with and
        without a charged QRAM), each reported as a RATIO to its AES-128
        reference cell computed by the identical code path.
      - >-
        ARM T5 -- data row. Largest q reachable under a declared signing budget
        (10^6 signatures per second, 10 years, one key), and every arm re-reported
        at that q.
    measured_null:
      - >-
        NULL-1 (k = 1). Every arm re-run with k = 1 and all other parameters
        unchanged. FORCED VALUES DERIVED BEFORE THE RUN: amplification exactly 1
        at every lambda; S0 = S1 = S2 exactly, because SUM_i gamma_i^1 = q for
        every occupancy vector; slack_1 exactly 0. THIS NULL CAN FAIL -- any
        defect in the Stirling recurrence, the rational arithmetic, the
        Poissonization, or the ladder ordering breaks at least one of the three.
      - >-
        NULL-2 (lambda -> 0). Every arm at q = 2^20, where lambda ranges from
        2^-43 to 2^-48 across the sets. FORCED VALUE: |A(lambda) - 1| < 10^-6 at
        every set. Two independent ways of switching the effect off; surviving one
        and not the other localises the defect.
      - >-
        NULL-3 (single-signature charge). W_theta at q = 1. FORCED VALUE: the
        charge is EXACTLY theta * log2(k) bits, because the table holds exactly k
        cells. An implementation charging the trial count instead of the table
        fails here immediately.
    positive_controls:
      - >-
        POS-1 (Bell numbers; the effect MUST appear). T_k(1) must equal exactly
        190899322 (k=14), 82864869804 (k=17), 4506715738447323 (k=22),
        1629595892846007606764728147 (k=33), 281600203019560266563340426570
        (k=35). Computed twice by independent algorithms -- the Stirling
        recurrence and the Poisson moment recurrence m_{j+1} = lambda SUM_i
        C(j,i) m_i -- which must agree exactly. IF POS-1 FAILS, THE INSTRUMENT IS
        BROKEN AND NO NEGATIVE RESULT MAY BE REPORTED FROM ANY ARM.
      - >-
        POS-2 (VARIANT-P nearby object; the effect MUST appear). The identical
        pipeline applied to VARIANT-P, in which the message randomizer is
        publicly computable and the reachable occupancy set is the whole simplex.
        Required separation from SLH-DSA at 128s parameters: AT LEAST 30 bits
        (pre-registered estimate about 57). IF POS-2 SHOWS NO SEPARATION, THE
        PIPELINE IS BLIND TO THE CONTROL INTERFACE AND NO CONCLUSION OF ANY KIND
        MAY BE REPORTED.
      - >-
        POS-3 (AES-128 key search; the effect MUST VANISH). Exhaustive AES-128
        key search pushed through the identical charging code path. FORCED VALUE:
        memory charge EXACTLY 0 bits at every theta, because the search holds
        O(1) state. If the pipeline charges it anything, no register cell may be
        reported. POS-3 also supplies the reference cell every quantum row is
        reported against.
      - >-
        POS-4 (birthday collision search; the effect MUST equal a number). An
        n-bit hash collision search with memory 2^{n/2}. FORCED VALUE: the
        theta = 1/2 charge is EXACTLY n/4 bits. POS-3 and POS-4 bracket the
        charging pipeline from opposite directions -- one where the charge must
        vanish and one where it must take a specific value.
    graded_controls:
      - >-
        GRAD-1 (8 interior points, monotonicity reported). A(lambda) at
        lambda in {2^-40, 2^-30, 2^-20, 2^-10, 2^-4, 2^-1, 1, 2}. Report every
        consecutive difference and its sign. REQUIRED: strictly increasing. This
        is the artifact tell in canonical form -- the amplification must decay
        when the parameter meant to destroy it shrinks. A non-monotone sequence
        localises the defect to a lambda decade instead of leaving "it did not
        work".
      - >-
        GRAD-2 (5 interior points). The leaf-collision correction at
        a in {6, 8, 9, 12, 14} at fixed k. REQUIRED: monotonically decreasing in
        a. This separates "the correction tracks the FORS tree height" from "the
        correction is an artifact of the log-space sum".
      - >-
        GRAD-3 (5 interior points). The theta ladder {0, 1/3, 1/2, 2/3, 1}.
        REQUIRED: W monotone increasing in theta at every set and every q.
      - >-
        GRAD-4 (6 interior points). The q ladder at theta = 1/2. Report where the
        charged optimum sits; it must not be at q = 1.
      - >-
        GRAD-5 (5 interior points). The control-interface ladder interpolating
        between SLH-DSA and VARIANT-P: an adversary permitted to reject and
        resubmit a message after observing its index, with budget r in
        {0, 1, 4, 16, 64}. REQUIRED: achievable max_i gamma_i monotone
        non-decreasing in r, and the r = 0 cell reproducing the pure multinomial
        exactly. This prices the control interface itself, which is the axis this
        program has never charged for any scheme.
    ordering_control: >-
      MANDATORY AND BINDING. The complete null and positive-control battery
      (NULL-1, NULL-2, NULL-3, POS-1, POS-3, POS-4) is executed, its outputs
      serialized, and its SHA-256 committed BEFORE any treatment arm is computed
      and BEFORE any primary-text figure from Stage 0 is compared to any computed
      number. Additionally the surrogate ladder T3 and the VARIANT-P derivation
      are committed BEFORE Stage 0's text is read, so the ladder cannot be
      reverse-engineered to match the document. Absence of either commitment is
      invalid_measurement.
    verdict_on_the_null_first: >-
      The frozen decision rule (see success_criterion) is executed against
      NULL-1's outputs before any treatment arm is looked at. If it emits the
      same label on NULL-1 as on the treatment, the rule discriminates nothing
      and must be rewritten before any treatment output is read.
    comparability_policy: >-
      No cross-contract comparison is permitted. IDEA-20260801-009 proposed a toy
      enumeration meter with different objects and no frozen protocol; nothing
      here is comparable to it and no such comparison may be made without a
      separately registered comparator contract naming both designs, both
      streams, the comparison statistic, the expected relation, and the failure
      disposition. Likewise the VARIANT-P arm's numbers may never be tabulated in
      the same row as an SLH-DSA number without the label travelling.
    archive_check: >-
      ZERO COMPUTE, PERFORMED AT WRITE TIME. Prior archived measurements of this
      observable in this corpus: NONE. Area SLHDSA has no experiments, no runs and
      no evidence records. Recorded as unavailable rather than claimed as a passed
      check.

  stages:
    ordering_principle: >-
      Cheapest-decisive-first. STAGE 1 IS THE STAGE THAT CAN TERMINATE THE RUN:
      it is seconds of integer arithmetic and it contains the primary falsifier
      (NULL-1). Stage 0 is expensive in reading time but zero in compute and does
      not block Stages 1 to 6, so a source-availability failure degrades the
      claim tier rather than halting the contract.
    stage_0:
      name: primary-source read
      compute: zero
      terminal: >-
        Terminal for the CONSTANTS only. If a parameter triple differs from the
        recalled one, Stages 1 to 6 are re-run on the corrected constants and the
        affected predictions of H-SLHDSA-3a403a are recorded VOID, not falsified.
      tasks:
        - >-
          Obtain FIPS 205 and the SPHINCS+ framework text under the goal's
          declared source-preference order. RQ-SLHDSA-001 records csrc.nist.gov
          and nist.gov as unreachable under this harness's network policy (proxy
          CONNECT 403); the session angle brief records eprint.iacr.org ABSTRACT
          pages returning 200 and PDF bodies returning 403, with arXiv and
          author-hosted copies generally reachable. Try, in order: an author or
          institutional copy; the ePrint abstract page; arXiv; a mirror of the
          FIPS text. Record every URL tried and its status code.
        - >-
          G0-A: quote the six parameter sets with a document section number.
        - >-
          G0-B: quote the signing algorithm's index derivation and establish
          whether SK.prf enters the message randomizer in EVERY signing mode.
          THIS IS THE HIGHEST-VALUE READING TASK IN THE GOAL.
        - >-
          G0-C: quote the interleaved-target bound and identify which rung of the
          surrogate ladder (S0/S1/S2/S3/unlisted) its occupancy handling occupies.
        - >-
          G0-D: record whether ePrint 2026/632 (RELAYED via the session angle
          brief: claims to eliminate the SM-DSPR conjecture and to recover up to
          18 classical / 9 quantum bits relative to NIST's evaluation) can be
          obtained. IT IS NOT READ, NOT CITED, AND NOT USED BY ANY ARM; it is
          recorded as a named candidate for a successor task so that a later
          agent does not mistake its absence for its non-existence.
      disposition_if_unobtainable: >-
        Record the failure with every URL and status code, mark every constant
        RECALLED-UNVERIFIED in the output, keep the claim tier at toy, and
        proceed to Stage 1. A source-availability failure is INFRASTRUCTURE
        SIGNAL and is never negative mathematical evidence and never evidence
        about the bound's tightness. GOAL-SLHDSA-001's second pause_condition
        governs whether the campaign continues.
    stage_1:
      name: exact-integer core and the null battery
      compute: seconds, single core, pure Python integers and Fractions
      terminal: >-
        YES -- THIS IS THE DECISIVE CHEAP GATE. If NULL-1 or POS-1 fails, the run
        halts here and reports an instrument failure. No treatment number is
        computed, serialized, or looked at.
      tasks:
        - Stirling table S(k,j) by recurrence, with S(k,1) = 1 and S(k,k) = 1 asserted.
        - T_k(lambda) over exact Fractions, by two independent algorithms that must agree exactly.
        - NULL-1, NULL-2, POS-1 executed and committed with their hash.
        - ARM T1 and the amplification A(lambda); GRAD-1 with its difference signs.
        - ARM T3's S0 column and the worst-case vacuity check (G6).
        - Numerical bound on the Poissonization residual against the exact multinomial moment at the toy cells.
    stage_2:
      name: leaf-collision refinement
      compute: seconds, log-space Poisson sums
      terminal: no
      tasks: [ARM T2, GRAD-2, the s-versus-f split of the correction, truncation-point recording]
    stage_3:
      name: surrogate ladder and slack
      compute: seconds
      terminal: no
      tasks: [ARM T3's G search per tail-probability target, slack_1 table, ordering assertion S0 >= S1 >= S2 >= S3]
    stage_4:
      name: Monte-Carlo validation of HEUR-SLHDSA-OCC-2
      compute: minutes, seeded per the derivation rule
      terminal: no
      tasks:
        - Simulate occupancy and revealed-leaf sets at the four toy cells; estimate E[PROD_t |S_t|] with a standard error.
        - Compare against m(g)^k; report agreement within 4 standard errors or report the discrepancy.
        - Measure the coefficient of variation of SUM_i gamma_i^k (G11, the mirror-failure check).
    stage_5:
      name: VARIANT-P nearby-object control and the interface ladder
      compute: one page of derivation plus seconds of arithmetic
      terminal: no
      note: >-
        Needs no primary text and therefore survives the goal's
        source-availability pause_condition intact.
      tasks:
        - >-
          Re-derive the multi-collision grinding cost from first principles and
          state the derivation. The recalled form is a candidate; where the
          re-derivation disagrees, the derived form is used and the discrepancy
          recorded.
        - >-
          Re-derive the coupon-collector coverage argument for G, or replace it
          with an exact expected-cover computation.
        - POS-2 separation measurement; GRAD-5 interface ladder.
        - >-
          Label every VARIANT-P artifact "HYPOTHETICAL CONTROL OBJECT -- NOT
          SLH-DSA, NOT FIPS 205, NOT A DEPLOYED SCHEME" in the file itself, not
          only in the report.
    stage_6:
      name: cost-convention register
      compute: seconds
      terminal: no
      prerequisite: "Stages 1 and 2 must have completed. Charging a cost model that has not itself passed its nulls is forbidden."
      tasks:
        - POS-3 and POS-4 executed and committed before any SLH-DSA cell.
        - ARM T4 classical rows over the theta grid; GRAD-3, GRAD-4.
        - >-
          ARM T4 quantum rows: depth-capped Grover per MAXDEPTH value, with and
          without a charged QRAM, EACH REPORTED AS A RATIO TO ITS AES-128
          REFERENCE CELL. Re-derive the depth-cap formula from the parallel-Grover
          argument and check it against the recalled NIST category definition; on
          inconsistency, report NO quantum row and record the inconsistency as
          the finding.
        - ARM T5 data row with its signing-budget assumption stated as an explicit number.
    stage_7:
      name: write-up
      compute: zero
      tasks:
        - The slack curve over q crossed with the convention register.
        - An explicit scope statement naming the layer, the idealization, the constants' provenance, and the conventions.
        - The planned-negative disposition if it fired (see stopping_rules SR-5).

  metrics:
    primary:
      - "C2(set, q) = a*k - log2 T_k(q/2^h), the uncorrected generic interleaved-target cost in log2."
      - "C3(set, q) = a*k - log2 E[m(X)^k], the leaf-collision-refined cost in log2."
      - "A(set, q) = T_k(lambda)/lambda, the multi-target amplification, in log2."
      - "slack_1(set, q, s) = log2(q * G(s)^{k-1}) - log2(2^h T_k(lambda)), the proof-surrogate slack in bits."
      - "W_theta(set, q) = the charged cost register, log2, one cell per (set, q, theta) and per quantum row, each with its AES-128 reference."
      - "net(set) = log2 A - (1/2) log2(q k) at q = 2^64, with its SIGN, per set."
    secondary:
      - "log2 p_wc = k(64-a) - h per set (the worst-case-occupancy vacuity check)."
      - "T_k(1) per k, as exact integers, from two independent algorithms."
      - "Poissonization residual bound at the toy cells."
      - "Monte-Carlo estimate and standard error of E[PROD_t |S_t|] per toy cell."
      - "Coefficient of variation of SUM_i gamma_i^k per toy cell."
      - "VARIANT-P separation in bits, and the interface ladder's achievable max occupancy per r."
      - "Truncation point of every log-space Poisson sum."
      - "Every URL tried in Stage 0 with its HTTP status."

  heuristic_under_test: HEUR-SLHDSA-OCC-2

  preregistered_prediction:
    quantity: >-
      The expected per-attempt success probability of the generic
      interleaved-target forgery against the FORS layer, and the amplification
      and charged costs derived from it.
    formula: >-
      E[p] = 2^{-ak} * T_k(lambda),  lambda = q/2^h,
      T_k(lambda) = SUM_{j=1..k} S(k,j) lambda^j;
      refined:  E[p]_corr = 2^{-ak} * E_{X~Poisson(lambda)}[ m(X)^k ],
      m(g) = 2^a (1 - (1 - 2^{-a})^g);
      charged: W_theta(q) = 2^{ak} (q k)^{theta} / T_k(lambda).
    source: >-
      DERIVED IN H-SLHDSA-3a403a mechanism (D), (E), (G) from the attack
      description in mechanism (B) plus Poissonization of a multinomial
      occupancy. No external theorem is cited and none is needed; the Touchard
      identity and the convexity argument are elementary and are re-derived
      in-record. The parameter constants are RECALLED-UNVERIFIED and are the
      only external inputs.
    values:
      note: >-
        PRE-REGISTERED, COMPUTED BY THE PROPOSING SESSION OUTSIDE THE HARNESS ON
        2026-08-05 IN PURE-PYTHON EXACT INTEGER ARITHMETIC. NOT MEASUREMENTS. NOT
        EVIDENCE. To be reproduced in-harness; where the in-harness value
        differs, the defect is in H-SLHDSA-3a403a and this contract.
      C2_at_q_2_64_log2: {"128s": 133.729, "128f": 128.405, "192s": 193.898, "192f": 194.405, "256s": 255.999, "256f": 255.599}
      correction_C3_minus_C2_bits: {"128s": 0.020, "128f": 2.960, "192s": 0.007, "192f": 0.760, "256s": 0.009, "256f": 0.315}
      amplification_at_q_2_64_log2: {"128s": 33.271, "128f": 71.595, "192s": 43.102, "192f": 71.595, "256s": 52.001, "256f": 63.401}
      log2_p_wc: {"128s": 665, "128f": 1848, "192s": 787, "192f": 1782, "256s": 1036, "256f": 1857}
      net_sign_at_theta_half: {"128s": -0.633, "128f": 37.073, "192s": 9.057, "192f": 37.073, "256s": 17.771, "256f": 28.836}
      W_theta_128s_log2: {"0": 133.7, "1/3": 156.3, "1/2": 167.6, "2/3": 178.9, "1": 201.5}
      bell_numbers: {"14": 190899322, "17": 82864869804, "22": 4506715738447323, "33": 1629595892846007606764728147, "35": 281600203019560266563340426570}

  scale_relevance:
    tier: toy
    justification: >-
      The computation is EXACT arithmetic on a combinatorial model evaluated at
      the real FIPS 205 constants, not a toy-scale extrapolation -- there is no
      scaling step and nothing is fitted. That is a strength of the model and is
      NOT a licence to raise the tier. What limits the tier is the provenance of
      the constants (recalled, not read) and the random-oracle idealization of
      the digest split. Conclusions transfer to the real parameter sets exactly
      to the extent that Stage 0 verifies the constants and no further. The
      Monte-Carlo arm at B <= 2^12 is genuinely toy and its results are labelled
      toy independently of everything else.
    correspondence: >-
      null -- no sampling correspondence is used. The exact evaluation is direct;
      the Monte-Carlo arm validates an identity at small parameters and is not a
      route to crypto scale.

  tail_checks:
    - >-
      Every log-space Poisson sum reports its truncation index and the magnitude
      of the last retained term; a truncation whose tail exceeds 2^-60 of the
      total is a failure, not a rounding note.
    - >-
      The exact-Fraction path and the log-space path must agree on C2 to within
      10^-6 bits wherever both are computable; a disagreement indicts the
      log-space arithmetic before it indicts the mathematics.
    - >-
      The Monte-Carlo arm reports the smoothest and roughest cells, not the mean
      alone, and compares the extreme cell against its predicted deviation.

  replication:
    seeds: ["9142713"]
    independent_instances: 4
    interpretation: >-
      The deterministic arms are exactly reproducible and have no seed
      dependence; "replication" for them means recomputation by the two
      independent algorithms already required. Only Stage 4 has seed dependence,
      and its four toy cells are the independent instances. One execution is a
      design-validation attempt and cannot by itself support any statement about
      a standardized parameter set.

  budget:
    maximum_runs: 3
    maximum_wall_seconds: 7200
    maximum_wall_seconds_stage_0: 5400
    maximum_cpu_seconds: 1800
    maximum_peak_rss_bytes: 2147483648
    maximum_workers: 1
    maximum_total_disk_bytes: 268435456
    network: >-
      Stage 0 only, read-only fetches of primary text. Every URL and status code
      is recorded. All other stages run with no network.

  stopping_rules:
    - SR-0. Do not execute unless this contract is separately approved, frozen, archived, and authorized. It is review_required and carries no approved_by.
    - SR-1. Halt at Stage 1 if NULL-1 fails (amplification at k = 1 is not exactly 1). Report instrument failure; compute no treatment arm.
    - SR-2. Halt at Stage 1 if POS-1 fails (T_k(1) is not the exact Bell number, or the two algorithms disagree). Report instrument failure.
    - SR-3. Halt at Stage 1 if GRAD-1 is non-monotone or NULL-2 fails. The amplification is an artifact; no negative result may be reported.
    - SR-4. Halt before Stage 6 if POS-3 or POS-4 fails. No register cell may be reported.
    - >-
      SR-5. THE PLANNED NEGATIVE IS NOT A STOPPING RULE. If Stage 0 shows the
      published formula already uses the exact moment, the verdict is CONFIRMED
      TIGHT and the run CONTINUES to emit the slack curve, the register, and the
      reachable-q row. A run that reports "no slack found" without those has NOT
      FINISHED and is incomplete, not negative.
    - >-
      SR-6. Halt and ESCALATE, without writing a report, if Stage 0's G0-B finds
      any signing mode in which the FORS index is publicly computable. That is an
      AGENTS.md rule 12 event requiring an independent review-breakthrough
      session; it is not written up by the executing session.
    - SR-7. Halt on any budget exhaustion and report it as infrastructure signal.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any treatment arm computed or inspected before the null and positive-control battery is committed with its hash.
    - Any comparison of a computed number against a Stage 0 figure before the ordering commitment exists.
    - Any output sentence asserting a security level for SLH-DSA, or asserting that a parameter set is adequate or inadequate.
    - Any artifact in which a VARIANT-P number appears without its HYPOTHETICAL CONTROL OBJECT label.
    - Any artifact citing, combining with, or appearing alongside a fault, Rowhammer, or memory-corruption result.
    - Any quantum figure reported without its convention row label and its AES-128 reference cell.
    - Any register cell reported with a claim tier above toy while the parameter constants remain RECALLED-UNVERIFIED.
    - Any use of a random source other than the declared counter-based stream, or any unrecorded seed.
    - Any missing truncation record for a log-space sum, or any missing URL/status record from Stage 0.
    - Any edit to this contract after freezing. Corrections supersede.

  success_criterion: >-
    THIS CONTRACT HAS NO CURRENT SUCCESS OUTCOME BECAUSE IT IS NOT AUTHORIZED FOR
    EXECUTION. If a later, separately approved and frozen successor is executed,
    its only positive disposition is: the complete null and positive-control
    battery passes (NULL-1, NULL-2, NULL-3, POS-1, POS-3, POS-4 all at their
    forced values, GRAD-1 through GRAD-5 all monotone in the declared direction);
    every arm T1-T5 completes on every parameter set and q-grid point; the
    predicted values of preregistered_prediction.values are reproduced within
    their declared tolerances or their deviations are reported with the
    responsible step named; and the deliverable is emitted as a slack CURVE over
    q crossed with the convention REGISTER, carrying an explicit statement of the
    layer, the idealization, the constants' provenance, and every convention
    assumed. THE FROZEN DECISION RULE, stated so it can be executed on NULL-1
    first: emit label CONFIRMED-TIGHT if slack_1 against the rung Stage 0 found is
    below 1 bit at every set; SLACK-MEASURED if it is at or above 1 bit at any
    set, with the value; and CONSTANTS-UNVERIFIED prefixed to either if Stage 0
    did not obtain the text. That disposition establishes NO attack, NO security
    level, NO exponent, NO crypto-scale claim, and NO statement about any deployed
    system.

  falsification_criterion: >-
    The run falsifies H-SLHDSA-3a403a if any of the following is observed:
    (F1) amplification at k = 1 is not exactly 1;
    (F2) A(lambda) does not converge to 1 as lambda -> 0;
    (F3) T_k(1) is not the pre-registered Bell number, or the two independent
    algorithms disagree;
    (F4) the VARIANT-P control shows less than 30 bits of separation from
    SLH-DSA through the identical pipeline;
    (F5) the AES-128 control acquires a non-zero memory charge, or the birthday
    control's theta = 1/2 charge is not exactly n/4 bits;
    (F6) the leaf-collision correction is negative anywhere;
    (F9) the coefficient of variation of SUM_i gamma_i^k is zero at every toy
    cell (the projection is a constant of the apparatus);
    (F-ORD) the surrogate ladder ordering S0 >= S1 >= S2 >= S3 is violated.
    F8 IS EXPRESSLY NOT A FALSIFICATION: a Stage 0 parameter correction renders
    the dependent numeric predictions VOID, and the hypothesis is superseded with
    corrected constants rather than weakened. This disposition is fixed here,
    before any evaluation, and may not be selected after seeing a result.

  infrastructure_failure_disposition: >-
    A network failure, a 403 from any source, a timeout, a crash, a missing
    dependency, or a budget exhaustion is INFRASTRUCTURE SIGNAL and is recorded
    as failed_infrastructure. IT IS NEVER NEGATIVE MATHEMATICAL EVIDENCE, never
    evidence about the tightness of any bound, never evidence about SLH-DSA's
    margin, and never evidence against H-SLHDSA-3a403a or any of its heuristics
    (AGENTS.md rule 5, restated because the single most likely failure of this
    contract is exactly a 403 on the primary text). In particular: an inability
    to read FIPS 205 leaves the constants RECALLED-UNVERIFIED and the claim tier
    at toy; it does not license any inference about the bound.

  required_artifacts_if_later_authorized:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - Stage 0 source log: every URL, HTTP status, timestamp, and either a verbatim quotation with section number or an explicit non-obtainment record.
    - The null/positive-control commitment file and its SHA-256, timestamped before any treatment output.
    - Raw results per arm per cell, JSON with sorted keys and canonical serialization, including exact integers as decimal strings.
    - The Stirling table and both independent T_k implementations, with their agreement check.
    - Truncation records for every log-space Poisson sum.
    - Monte-Carlo raw draws' seeds, per-cell estimates, and standard errors.
    - The VARIANT-P derivation in full, with its HYPOTHETICAL CONTROL OBJECT label in the file.
    - The convention register with every row label and every AES-128 reference cell.
    - Manifest, environment (python and package versions as measured, not assumed), exact command, git commit and dirty-tree state, stdout, stderr, timings, and peak RSS.
    - An execution report naming, for every reported number, its claim tier and the provenance of the constants it used.

  approval_requirements:
    - Independent review confirms the null battery can actually fail and that every forced value is derived rather than fitted.
    - Independent review confirms that no arm can produce an attack claim and that the VARIANT-P labelling is enforced by the contract rather than by convention.
    - Independent review confirms the claim ceiling and the fault/memory-corruption separation are enforced by the invalidation rules.
    - Coordinator separately approves and freezes a successor contract without editing this draft.

  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved and only the Coordinator may approve it (AGENTS.md rule 1).

  assigned_to: executor
