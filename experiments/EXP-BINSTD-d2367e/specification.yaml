# EXP-BINSTD-d2367e
# Charged-cost band arithmetic. No solver.
# Approved by DEC-20261003-5a3882.
experiment:
  id: EXP-BINSTD-d2367e
  hypothesis_id: H-BINSTD-700a51
  source_idea: IDEA-20261001-99487f
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Target floor versus the one-half band
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-5a3882
  objective: >-
    Check the excess 34, the doubled floor 80, and the product 10880.
  inputs:
    n_17: 17
    n_19: 19
    n_23: 23
    ell_lo: 3
    ell_hi: 4
    cells: 6
    target_floor: 40
    slots: 240
    cell_excess: 34
    band_equal_gap: 0
    two_thirds_gap: 1
    three_fifths_gap: 1
    factor: 2
    doubled_targets: 80
    target_excess: 40
    n_gap_lo: 2
    n_gap_hi: 4
    span_product: 8
    n_span: 6
    span_cell_gap: 0
    gap_product: 10880
    n_sum: 59
    n_product: 7429
    ell_product: 12
  controls:
    - >-
      Three times 2 is 6. Six times 40 is 240. Forty minus 6 is 34.
      Reporting the target floor as 6 invalidates the run.
    - >-
      One times 100 minus 2 times 50 is 0. Two times 2 minus 3 times
      1 is 1. Three times 2 minus 5 times 1 is 1. Twice 40 is 80, and
      80 minus 40 is 40.
    - >-
      Nineteen minus 17 is 2, and 23 minus 19 is 4. Two times 4 is 8.
      Twenty-three minus 17 is 6, and 6 minus 6 is 0. The product of
      34, 40, and 8 is 10880. Seventeen times 19 times 23 is 7429.
      Three times 4 is 12.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {cells, band, product}
    - route in {difference, product}
  metrics:
    primary:
      - cell_excess
      - gap_product
      - implementations_agree
    secondary:
      - doubled_targets
      - two_thirds_gap
      - n_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Forty exceeds 6 by 34. Twice 40 is 80. The product of 34, 40,
      and 8 is 10880.
    formula: >-
      Subtract 6 from 40. Multiply 2 and 40. Multiply 34, 40, and 8.
      Subtract 2 times 50 from 1 times 100.
    source: >-
      IDEA-20261001-99487f states the n list 17, 19, 23, the
      dimension list 3 and 4, the target floor 40, epsilon 1 over
      40, and the band 0.50, read 2026-10-03. The products were
      recomputed in this design session. That computation is not a
      run. No solver was timed.
  scale_relevance:
    tier: toy
    justification: Three listed n values and one written band. No transfer to a cost ratio.
    correspondence: null
  tail_checks:
    - The product 10880 and the excess 40 are required. A check that stops at the excess 34 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the excess 34 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The cell excess is not 34.
    - The doubled floor is not 80.
    - The product is not 10880.
    - A solver is timed, or the target floor is reported as 6.
  success_criterion: >-
    Both runs agree that 40 minus 6 is 34, that 6 times 40 is 240,
    that twice 40 is 80, that 1 times 100 minus 2 times 50 is 0, and
    that the product of 34, 40, and 8 is 10880.
  falsification_criterion: >-
    The runs agree that 40 minus 6 is computed, and that difference
    is not 34.
  required_artifacts:
    - experiments/EXP-BINSTD-d2367e/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-d2367e/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-d2367e/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-d2367e/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-d2367e/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-d2367e/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any solver timing, symmetry reduction, or charged-cost ratio.
    - Any claim that a symmetry cuts a decomposition cost.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
