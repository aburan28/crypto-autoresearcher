[package]
name = "nfield"
version = "0.1.0"
edition = "2021"
description = "Number-field toolkit for the SNFS-G lift experiments: Q[t]/(g) arithmetic, factorisation mod q, exact square roots, elliptic curves over K, bounded point search; optional PARI/GP cross-checks over FFI"
publish = false
build = "build.rs"

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
num-rational = "0.4"
serde_json = "1"

[build-dependencies]
cc = { version = "1", optional = true }

[features]
default = []
pari = ["dep:cc"]
