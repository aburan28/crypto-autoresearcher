[package]
name = "snfs-g1"
version = "0.1.0"
edition = "2021"
description = "EXP-ECDLP-84af7b runner: cyclotomic lift with complete splitting (H-ECDLP-2f1033)"
publish = false

[[bin]]
name = "g1"
path = "src/main.rs"

[dependencies]
nfield = { path = "nfield" }
serde_json = "1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
sha2 = "0.10"

[features]
default = []
pari = ["nfield/pari"]

[workspace]
members = [".", "nfield"]

[profile.release]
opt-level = 3
debug = false
