experiment:
  id: EXP-CANL-50a70f
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-44ba75
  question_id: RQ-CANL-63098f
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'CM SUPPLIES THE RANK CONTROL XEDNI HAD TO BUY WITH MESTRE''S CONDITIONS, BUT IN THE FATAL
    DIRECTION: for a CM curve the rank is pinned by an L-value (Coates-Wiles/Rubin) rather than by
    construction, and the pinned value is generically 0 -- which does not make the lifted points short,
    it empties the set of liftable points, so the reduction map''s image collapses to the O(1) torsion
    subgroup and the fraction of E(F_p) that lifts at all falls from Theta(B^{r/2}/(sqrt(Reg) N))
    to O(1/N)'
  status: draft
  objective: "(A) WHAT XEDNI PAID FOR AND WHAT CM GIVES FREE. Silverman's construction (KN-LIT-020)\
    \ needs the global curve through the lifted points to have SMALL Mordell-Weil rank, so that r+1\
    \ points are forced dependent, and it obtains that by imposing Mestre-style conditions -- which\
    \ is exactly the cost centre Jacobson-Koblitz-Silverman-Stein-Teske (KN-LIT-021) charge as prohibitive.\
    \ On the Serre-Tate canonical lift the rank is not imposed: the lift is a CM curve, and for CM\
    \ curves the rank is controlled by an L-value. THE THIRD QUANTITY IN RQ-CANL-63098f'S DECISION\
    \ TARGET -- the RANK of the lifted Mordell-Weil group -- IS THEREFORE GENUINELY CHANGED BY CM,\
    \ from \"expensively imposed\" to \"freely determined\". This record asks what the free determination\
    \ determines, and answers: the wrong thing.\n(B) THE DIRECTION, AND WHY IT IS FATAL RATHER THAN\
    \ HELPFUL. Coates-Wiles (and Rubin's extension) give, for an elliptic curve with complex multiplication:\
    \ L(E/K, 1) != 0 implies rank E(K) = 0. Analytic rank 0 is the generic behaviour in any family\
    \ with no forced parity obstruction. So the canonical lift's Mordell-Weil group is, generically,\
    \ FINITE. And a finite Mordell-Weil group is not a small lattice with short vectors -- it is no\
    \ lattice at all. Xedni's arithmetic needs r+1 points to be dependent AND to exist; CM optimises\
    \ the first and destroys the second.\n(C) THE QUANTITY, DEFINED SO IT CAN BE MEASURED. Define\
    \ the LIFTABLE FRACTION\n    rho_lift(B) := |{P in E(F_p) : P = red(P~) for some P~ in Ẽ(H)\n\
    \                      with hhat(P~) <= B}| / N.\nCounting lattice points in the Mordell-Weil\
    \ lattice of rank r_Z and regulator Reg gives\n    |{P~ : hhat(P~) <= B}| = V_{r_Z} B^{r_Z/2}\
    \ / sqrt(Reg) * (1 + o(1)),\nwhere V_{r_Z} is the volume of the unit ball in R^{r_Z}, so\n   \
    \ rho_lift(B) <= V_{r_Z} B^{r_Z/2} / (sqrt(Reg) * N).\nAT RANK 0 THIS IS EXACTLY |Ẽ(H)_tors| /\
    \ N = O(1)/N, for every B, forever. That is a strictly worse failure than JKSST's: not \"the relation\
    \ that exists has bounded coefficients\", but \"the points do not exist\".\n(D) THE PRICE OF ESCAPING\
    \ IT, IN EXPONENTS. To have rho_lift(B) = Omega(1) one needs B >= (N sqrt(Reg)/V_{r_Z})^{2/r_Z}.\
    \ Since the canonical lift is a CM curve it has integral j-invariant, so Lang's height conjecture\
    \ is a theorem for it (Hindry-Silverman, Inventiones 93 (1988) 419-450; RELAYED FROM A WEB-SEARCH\
    \ ABSTRACT 2026-08-07, FULL PAPER NOT READ), giving hhat(P~) >= c log|Delta| for every non-torsion\
    \ P~ and hence Reg >= (c log|Delta|)^{r_Z}. Substituting only makes B larger. So the rank must\
    \ be BOUGHT, and CM refuses to sell: the same L-value that makes the rank free makes it 0.\n(E)\
    \ THE TWO OUTCOMES, BOTH DELIVERABLES. OUTCOME 1: measured rho_lift on toy CM lifts tracks V_{r}\
    \ B^{r/2}/(sqrt(Reg) N) within a constant. Then the height-budget model is validated, the rank\
    \ is confirmed as the binding parameter, and the lane's cost is settled by IDEA-20260807-6533fd's\
    \ exponent identity. OUTCOME 2: rho_lift on CM lifts is systematically HIGHER than on rank-matched,\
    \ discriminant-matched non-CM curves. Then CM supplies an excess of low-height liftable points\
    \ that the lattice count does not explain, the excess is a new object, and this lane reopens with\
    \ a concrete target. There is no outcome in which the measurement says nothing."
  resource_label: 'R6 (the characteristic-zero lift and its Mordell-Weil group) and R3 (End(E) as
    a ring: it is CM-ness that supplies the L-value rank control and the integral j-invariant that
    makes Lang unconditional).'
  admissibility: admissible
  admissibility_argument: 'Nothing here applies an endomorphism to a point of G. The operative objects
    are a Mordell-Weil lattice in characteristic zero, an L-value, and a reduction map. H-ENDO-001''s
    scalar collapse applies only downstream of reduction and is not used. The one place an inadmissibility
    could hide is the phrase "the reduction map is O-linear": that is a statement about a map between
    two O-modules, not an oracle call, and its content here is only that rank is preserved as an O-invariant.
    Note however the honest corollary: because reduction is O-linear and O acts on G by scalars, ANY
    structure the lift''s O-module carries reduces to scalars on G -- which is why this record''s
    positive branch must be about the SIZE of the liftable set, not about extra structure inside it.'
  reachability_gate: 'T5 EVALUATED. Moving from E/F_p to its canonical lift is priced in IDEA-20260807-ee6ef7
    at |D_E|^{1+o(1)} = p^{1+o(1)} time and p^{1/2+o(1)} space by the class-polynomial route, which
    FAILS the gate for the generic curve. This record therefore confines itself to the evasion class
    h(D_E) = 1 where the lift is a curve over Q obtainable in polylog(p) -- the gate PASSES there.
    Within that class the object this lane wants (a lift of large rank and small regulator) is NOT
    reachable by any move: the canonical lift is a FUNCTION of E, so there is nothing to walk to,
    and by T4 the class fixes D_0 so the volcano cannot change the CM field. The one residual freedom
    is the choice of lift parameter within the twist family, whose cost is the subject of IDEA-20260807-13c821.
    Goodness (large rank) is locally detectable only by a point search costing B^{r/2}, which is the
    same search the attack needs -- so detection confers no separate advantage.'
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE): verify or downgrade the Coates-Wiles/ Rubin and
      Hindry-Silverman citations; if either fails to verify, restate parts (B) and (D) in their weaker
      empirical forms before proceeding. STAGE 1 (hours): implement naive global point search over
      x = u/w^2 with |u| <= U, w <= W; validate on the frozen known-generator fixture. STAGE 2 (hours):
      measure |Im_B| for a ladder of B on 10 CM curves (j = 0 and j = 1728 families) at 3 primes each.
      STAGE 3 (hours): the matched non-CM null on the identical pipeline. STAGE 4 (minutes): the rank-0
      arm and the planted-lift positive control. STAGE 5 (zero compute): fit exponents, extrapolate
      B*, charge against 0.886 sqrt(N).'
    mechanism: 'STEP 1 -- BUILD TOY CM LIFTS EXPLICITLY. Restrict to h(D_E) = 1 so the lift is a curve
      over Q (IDEA-20260807-ee6ef7''s evasion class): the j = 0 family y^2 = x^3 + k and the j = 1728
      family y^2 = x^3 + a x. Choose p and the twist so that the reduction has a large prime-order
      subgroup. STEP 2 -- GET RANK AND GENERATORS WITHOUT SAGE. Use published rank tables for these
      two families where available, and independently confirm each used curve by (a) exhibiting generators
      found by naive search over x = u/w^2 with bounded u, w, and (b) a 2-descent-free consistency
      check: the found points must be non-torsion (torsion is computable by Nagell-Lutz) and Z-independent
      (verified by a numerical height Gram determinant bounded away from 0). RANK IS NOT CLAIMED,
      ONLY A LOWER BOUND FROM EXHIBITED INDEPENDENT POINTS -- an upper bound would need descent and
      is out of scope. Every statement is phrased with that asymmetry. STEP 3 -- MEASURE rho_lift
      DIRECTLY. Enumerate all global points with naive height below a ladder of bounds B, reduce each
      mod p, and count distinct images in E(F_p). Plot |Im_B| against B and fit the exponent against
      the predicted r/2. STEP 4 -- THE NULL. Repeat on a NON-CM curve over Q with (i) the same exhibited-independent-point
      count, (ii) minimal discriminant within a factor 2, (iii) the same p. Any CM excess must survive
      this comparison. STEP 5 -- THE RANK-0 ARM. Include at least three CM curves whose exhibited
      point search returns NOTHING below the largest B. Confirm |Im_B| equals the torsion image, i.e.
      O(1), for every B. This is the record''s central predicted phenomenon and it must be observed,
      not assumed. STEP 6 -- CHARGE IT. Compute the B* at which |Im_B| would reach N, from the fitted
      exponent, and compare the implied coordinate bit-size against 0.886 sqrt(N).'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - Matched non-CM curve at equal exhibited rank and discriminant.
  - Rank-0 CM arm (forced value O(1)/N).
  - Planted lift (instrument must detect a known signal).
  - Random-subset target control (|Im_B| must not depend on the target set).
  - Known-generator frozen fixture.
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. MATCHED NULL: a non-CM elliptic curve
    over Q with the same number of exhibited independent points, minimal discriminant within a factor
    2, reduced modulo the same p, subjected to the identical enumeration. DECAY PARAMETER: p. rho_lift
    MUST DECAY like B^{r/2}/N, i.e. with slope -1 against p at fixed B. A CM-versus-null excess that
    FAILS TO DECAY with p is the canonical artifact tell and means the enumeration is finding twist-related
    or torsion points rather than genuine independent lifts. SECOND NULL: replace E(F_p) by a random
    subset of the same size and recount -- the measured |Im_B| must be unchanged, since it is a property
    of the global side only; a dependence on the target set means the counter is contaminated. POSITIVE
    CONTROL: plant a lift by choosing P~ of known small height FIRST and defining the target as red(P~);
    the pipeline must find it at the corresponding B.'
  independent_variables: []
  metrics:
    primary:
    - '|Im_B| per (curve, p, B), exact counts'
    - Fitted exponent with interval, both arms
    - Exhibited rank and numerical height Gram determinant per curve
    - Torsion order per curve
    secondary:
    - Extrapolated B* and implied coordinate bit-size
    - Wall clock and search bounds (U, W) per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: fitted exponent of |Im_B| against B on CM lifts with exhibited rank r
    formula: Predicted r/2 with a fit interval excluding r/2 +- 0.5. An exponent materially above
      r/2 means points are being found that the lattice count does not predict, i.e. Outcome 2.
    source: pre-registered in IDEA-20260807-44ba75 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - Rank lower bounds only. A curve reported "rank 0" may have rank > 0 with generators above the
    search bound; every such report is phrased as "no independent point below B" and never as "rank
    0".
  - Torsion contamination. CM curves have larger torsion (up to 6-torsion on j = 0); torsion reductions
    inflate |Im_B| at every B and must be quotiented before counting.
  - Twist coupling. Changing the twist changes both rank and the reduction, so a CM/null pair must
    be matched after twisting, not before.
  - Small-B bias. The lattice asymptotic is poor at reachable B; both arms carry the identical bias,
    which is why only the CM/null RATIO is interpreted, never the absolute value.
  - Class number. This record is confined to h(D_E) = 1 so the lift is over Q; for h > 1 the lift
    lives over a degree-2h field and the enumeration is out of reach here. That confinement is a scope
    limit, not a result.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Predicted r/2 with a fit interval excluding r/2 +- 0.5. An exponent materially
    above r/2 means points are being found that the lattice count does not predict, i.e. Outcome 2.
  falsification_criterion:
  - The known-generator fixture does not reproduce. Instrument failure under AGENTS.md rule 5; nothing
    reported.
  - rho_lift on a rank-0 CM lift exceeds 64/N. The rank-0 arm is mis-implemented (most likely torsion
    or twist contamination).
  - 'The fitted exponent exceeds r/2 + 0.5 on CM arms but not on the null. Outcome 2: CM supplies
    unexplained liftable points; the lane reopens and this record is superseded by one that characterises
    them.'
  - The CM excess ratio exceeds 4 reproducibly. Same disposition.
  - The excess does not decay with p. Artifact tell; no CM claim may be made.
  - The planted-lift control fails. The instrument cannot see a signal it is designed to see and no
    negative may be reported from any arm.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
