    solver_interface_report: experiments/EXP-ICPERF-018b0c/implementation/solver_interface_report.md
    trial_plan: experiments/EXP-ICPERF-018b0c/trial-plan.json
    note: >-
      The input emitter, stage runner, both input checkers, independent result
      checker, three manifests, two replay records and synthetic solver CLI
      receipt are bound above. run.py prepares inputs only; execute.py is the
      admitted scientific driver. A frozen trial plan, archive coverage,
      dispatch queue and legal goal lane remain prerequisites for approval.
      No code or target is silently substituted.

  input_preparation:
    status: independently_replayed_inputs_only
    admitted_subgroup_targets: 8
    raw_channels: 32
    natural_formulas: 64
    separately_planted_positive_formulas: 2
    scope: >-
      Serialized replay checked all target scalars, channels, formula gate
      structures, exact membership tables, target-constant evaluations,
      positive Boolean models and full-point certificates. Independent Sage
      replay checked all eight subgroup points and 32 raw channels. These
      checks establish prepared input correctness only; no bounded solver
      call, natural relation, rank or complete cost is observed.

  target_schedule:
    source: The certified fixture generator G; neither base nor any solver output enters scalar selection.
    domain: ICPERF-k11-natural-v1
    candidate_counter: Unsigned 32-bit big-endian j, starting at zero.
    scalar_rule: >-
      k_j = 1 + (int.from_bytes(SHA256(b'ICPERF-k11-natural-v1\0' ||
      bytes.fromhex(fixture_sha256) || j.to_bytes(4,'big')), 'big') mod (r-1)).
      The candidate subgroup point is Q_j=[k_j]G. The scalar is public in the
      manifest for known-answer verification, but the solver receives only
      the four raw target coordinates.
    raw_channels: >-
      Let R0=[inverse_mod(4,r)]Q_j and T=[r]P_source, where P_source is the
      fixture's cofactor-projectable source point. Channels c=0,1,2,3 are
      R0+[c]T in that order; each projects under [4] to the same Q_j.
    admission: >-
      Admit the first eight distinct Q_j for which all four raw channel
      points are affine, have nonzero x, and x is not gamma (the pole of
      t=gamma/(x+gamma)). Scan at most j=0..1023. Record every rejected
      candidate and its base-independent reason. Fewer than eight admitted
      points is an invalid target-preparation outcome, not a solver result.
    count: 8
    serialization: >-
      The bound target and formula manifests record fixture/base/source
      hashes, every scanned candidate, eight accepted scalars, subgroup
      points, four raw points and phi coordinates per target, and hashes of
      all 64 generated XCNF files. Commit and archive these exact inputs
      before any solver call; a later edit requires a protocol amendment.
    interpretation: Public known-answer target schedule; no unknown-scalar recovery claim.

  planted_controls:
    source: Both independently replayed synthetic controls in input_bindings.positive_controls.
    construction: >-
      For each base separately, use that record's eight canonical points,
      raw sum, projected target, phi coordinate and primary assignment to
      emit one exact k11 XCNF positive formula. Check the stored primary
      assignment against every serialized CNF and native-XOR row and the
      full-point certificate before invoking CryptoMiniSat. The solver may
      return another valid full-point relation; require one certified model
      within the same cap as a natural call.
    bit_flip_control: Flip the first primary bit and require full-point certificate rejection.
    gate: >-
      Run the two positive calls first. If either is invalid, stop and record
      an implementation defect. If either is wall/memory/model censored or
      solver-reported UNSAT without proof, stop the natural panel and report
      instrument viability unresolved at the cap. Preserve both attempts.

  formula_and_checker:
    kind: torsion_phi
    summands: 8
    equations: Seven chained three-point equations; direct S8 means seven summands and is outside this pilot.
    membership: Exact 632 accepted coordinate values per base, representing 316 sign-folded projected columns.
    per_target: >-
      Use the same encoder, base offset 4096 and width 11 for both arms;
      change only the accepted-coordinate table and raw target phi constant.
      Generate four XCNFs per admitted Q_j per arm. Decode complete signed
      DIMACS models; check every CNF clause and native XOR row before exact
      field equations, membership, all curve lifts, 256 signs, raw sum and
      projected subgroup row. Block rejected primary assignments and charge
      their solver and checker work to the same call.
    pole_and_sign_rule: >-
      Reject pole, nonliftable, wrong-sign and wrong-raw-sum roots as point
      relations; retain their checked model and rejection certificate.
    rank_rule: >-
      Deduplicate exact projected coefficient vectors across signs, torsion
      pair presentations and the four channels of a subgroup target. Report
      distinct rows only; do not infer linear rank without modular elimination.
    static_size_control: >-
      Under this fixed forbidden-value encoding the archived weighted and
      local-random k11 arms have equal per-channel CNF and native-XOR counts:
      89,122 clauses per channel and 62,655 XOR rows on channel 0. Their
      accepted 632-value membership tables differ. This pilot may observe
      solver behavior or certified yield, but cannot show a static
      formula-size sparsity gain from weighting. Degree of regularity remains
      unmeasured.

  controls:
    - Equal-column local-random base on the same curve, circuit and target schedule.
    - Separate solver-positive XCNF and full-point fixtures for both bases.
    - Bit-flipped primary assignment rejected by the point checker.
    - All four raw channels for each subgroup point, counted as one target.
    - Independent checker recomputes target scalars, formula hashes, SAT model validity and full-point sums without trusting producer summaries.
    - Same fixed binary, seed, one-thread configuration, caps and point filter in both arms.
  independent_variables:
    - {name: base, levels: [weighted, local_random]}
    - {name: target, levels: [positive_per_base, natural_0_to_7]}
    - {name: raw_channel, levels: [0, 1, 2, 3], note: Natural targets only; positive controls use their separately planted raw target.}
  trial_order: >-
    First weighted positive, then local_random positive. If both pass,
    natural targets i=0..7 in order; for each i, use weighted then local_random
    when i is even and local_random then weighted when i is odd; within each
    arm use channels 0,1,2,3. This fixed alternation exposes host drift.
  stage_schedule:
    positive:
      run_id: RUN-ICPERF-712e85
      trial_id: positive
      calls: 2
      order: [weighted, local_random]
      output: runs/RUN-ICPERF-712e85
    natural:
      run_id: RUN-ICPERF-1c8bfe
      trial_id: natural
      calls: 64
      depends_on: positive output_validated receipt and exact raw-result.json digest
      output: runs/RUN-ICPERF-1c8bfe
      gate: >-
        The driver launches natural solver calls only if both positive calls
        have independently checked full-point certificates. Otherwise it
        records the gated stage without a natural solver call. Four raw
        channels share one subgroup target.
    archive_requirement: >-
      For each stage the executor handoff and isolated archive task must
      declare the exact files calls-manifest.json and calls.tar.gz, alongside
      manifest.yaml, raw-result.json, independent_check.json and the adapter
      receipts. The fixed bundle retains every dynamic calls/ file, including
      solver input, stdout, stderr, attempt.json, certificate.json and
      summary.json. The independent checker must compare the complete raw
      tree, file-hash manifest and bundle; archiving only top-level summaries
      is incomplete.
  runbook_route:
    status: not_written
    reason: >-
      A supervisor runbook cannot pass tools/runbook.py lint until the trial
      plan names a readable dispatch queue containing an executor task whose
      artifact_paths cover every declared run file. Both ICPERF lanes remain
      open, and BATCH-e261c2 has a dispatcher archive-ancestry refusal. Do
      not fabricate a queue or mark a runbook lintable.
    handoff_policy_if_no_lintable_runbook: executor-implementation

  solver_limits:
    binary_options: [--verb, '0', --threads, '1', --maxsol, '1', --random, '20261017', --maxtime, '<remaining-call-seconds>', '<xcnf-path>']
    seed: 20261017
    threads: 1
    maximum_calls: 66
    wall_seconds_per_call: 300
    sampled_rss_bytes_per_call: 8589934592
    maximum_primary_models_per_call: 64
    total_wall_seconds: 25200
    watchdog_interval_seconds: 0.02
    panel_wall_interpretation: >-
      The 25,200-second allowance stops admission of additional solver calls
      across the positive and natural stages. The positive stage's recorded
      total, including its bundle packaging, is subtracted before natural
      calls. The natural stage's final bundle packaging and independent
      checker may extend full charged wall beyond that call-admission bound;
      the outer stage watchdogs are 1,200 and 27,000 seconds respectively.
    host_admission: >-
      Run one solver process at a time on a quiet host. Before each call,
      retain MemAvailable/free-memory and disk receipts; require at least
      10 GiB available memory and the runner's declared raw-output disk
      reserve. If either fails, record an admission stop and do not relabel
      that call as a mathematical nonrelation. The RSS sample may overshoot
      between polls; retain the observed peak and interval.
    budget_note: >-
      Fixed sample count, formulas and process watchdogs are protocol and
      machine-protection limits. They do not impose a campaign spending cap.

  budget:
    enforcement: advisory
    maximum_runs: 2
    maximum_workers: 1
    maximum_calls: 66
    wall_clock_seconds_per_call: 300
    total_wall_clock_seconds: 56400
    maximum_memory_bytes_per_call: 8589934592
    maximum_primary_models_per_call: 64
    note: >-
      Sample count and locked trial order are scientific protocol limits;
      25,200 seconds is the internal cross-stage solver-call admission bound.
      The 56,400-second sum of the two driver and two checker watchdogs is a
      conservative machine-protection ceiling, not a scientific stopping
      threshold or spending cap. Report full observed wall, CPU and bytes
      even if a watchdog stops a stage. The ECC
      campaign budget remains unlimited under AGENTS.md.

  metrics:
    primary:
      - Both positive controls' checked solver-model and full-point-certificate outcomes under the cap.
      - Number of natural calls with at least one certified projected row, by base and target.
      - Number of distinct certified projected rows after cross-channel and torsion/sign deduplication.
      - Full classification of all 64 natural calls as certified, solver_reported_exhausted_unvalidated, wall_censored, memory_censored, model_cap_censored, invalid, or infrastructure_failure.
    secondary:
      - Per-call wall and process CPU seconds, sampled peak RSS and host load; censored calls retain their spent work.
      - calls_bundle.wall_seconds, cpu_seconds, tar_bytes, manifest_bytes and raw_file_count from each raw-result.json; packaging wall is included in that stage's total_wall_seconds.
      - Solver-reported conflicts where available, labeled diagnostic and never degree of regularity.
      - Models attempted, CNF/XOR-valid models, point-rejected models and reasons, sign certificates and repeated rows.
      - Candidate and control base selection scans, setup CPU/wall/memory, XCNF construction, decompression, solver, extraction and verification times separately.
      - Paired cost and yield descriptions with censoring, without an advantage threshold or speedup claim.
  replication:
    seeds: [20261017]
    independent_instances: 8
    note: Eight targets are a pilot, not a powered comparison of a 1.25x effect.
  scale_relevance:
    tier: medium
    justification: One fixed GF(2^61) curve with a 60-bit prime-order subgroup; no transfer to other curves, arities or sizes.
    correspondence: null
  preregistered_prediction:
    quantity: Planted certification in both arms and at least one distinct natural projected row in either arm.
    formula: Two planted successes under identical caps; union of certified distinct natural rows has cardinality at least one.
    source: IDEA-20261017-3f46a5 predictions.
  decision_impact:
    on_positive: >-
      After independent review, proceed to a powered, separately frozen
      target panel and then relation-rank/linear-algebra/target-cost work.
      Do not promote a base superiority or end-to-end claim from this pilot.
    on_negative: >-
      If both positive controls pass and all 64 natural calls complete with
      independently validated absence of point relations, weaken only the
      exact finite-panel viability prediction and redesign capacity or base.
      Solver-reported UNSAT without proof does not satisfy this condition.
    on_inconclusive: >-
      Censored calls, unproved UNSAT, missing positive control, invalid
      output or host admission stop identify the exact solver/instrument
      gate; preserve all bytes and refine the implementation or resource plan.
  stopping_rules:
    - Stop before solver work on input, binary, source or target-manifest hash mismatch.
    - Stop natural calls if either planted solver-positive gate fails as specified above.
    - Stop one call at 300 seconds, 8 GiB sampled RSS, 64 primary models or solver terminal status; preserve its raw attempts.
    - Stop admitting solver calls at the remaining 25,200-second cross-stage panel allowance; charge final packaging and checker work separately in full observed totals, preserving all completed and partial calls.
    - Stop on disk or memory admission refusal; classify infrastructure, not zero yield.
  invalidation_rules:
    - A SAT model failing CNF or native XOR checks is invalid and preserved.
    - A point certificate with incorrect curve, membership, raw sum or projection is invalid and preserved.
    - A missing raw stdout/stderr, command, binary/input digest or outcome classification invalidates that call.
    - A checksum or target-schedule mismatch invalidates the panel before scientific interpretation.
    - Solver-reported UNSAT without an independent proof remains unvalidated, never verified absence.
  success_criterion: >-
    Both planted formulas produce independently checked full-point certificates
    under their caps, and at least one distinct certified projected row is
    found over the eight common natural targets. Success establishes only
    bounded solver-to-certificate viability.
  falsification_criterion: >-
    A planted formula fails within an admitted cap, or both planted controls
    pass and every natural call completes with independently verified no
    point relation. The latter requires proof of exhaustion; unproved solver
    UNSAT, timeout or memory stop is inconclusive for natural yield.
  required_artifacts:
    - experiments/EXP-ICPERF-018b0c/trial-plan.json
    - experiments/EXP-ICPERF-018b0c/implementation/run.py
    - experiments/EXP-ICPERF-018b0c/implementation/check.py
    - experiments/EXP-ICPERF-018b0c/implementation/check_sage.py
    - experiments/EXP-ICPERF-018b0c/inputs/target_manifest.json
    - experiments/EXP-ICPERF-018b0c/inputs/positive_manifest.json
    - experiments/EXP-ICPERF-018b0c/inputs/formula_manifest.json
    - experiments/EXP-ICPERF-018b0c/inputs/independent_replay.json
    - experiments/EXP-ICPERF-018b0c/inputs/sage_replay.json
    - experiments/EXP-ICPERF-018b0c/inputs/preparation_failures.md
    - experiments/EXP-ICPERF-018b0c/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ICPERF-018b0c/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ICPERF-018b0c/runs/<RUN-ID>/calls-manifest.json
    - experiments/EXP-ICPERF-018b0c/runs/<RUN-ID>/calls.tar.gz
    - experiments/EXP-ICPERF-018b0c/runs/<RUN-ID>/independent_check.json
    - experiments/EXP-ICPERF-018b0c/runs/<RUN-ID>/report.md
    - experiments/EXP-ICPERF-018b0c/runs/<RUN-ID>/diagram.svg
    - experiments/EXP-ICPERF-018b0c/runs/<RUN-ID>/report.pdf
  assigned_to: executor
  approval_preconditions:
    - The bound input emitter, input checkers, positive controls and base-independent common-target formulas are archived by exact digest; the existing input replays alone are not solver-result checks.
    - The bound execute.py and verify_run.py are included by exact hash in a complete two-stage trial plan, with calls-manifest.json and calls.tar.gz declared as exact files for each run in the executor and archive handoffs.
    - The pinned CryptoMiniSat binary and CLI flags match the bound small synthetic XCNF receipt; that receipt is an implementation check, not a scientific pilot call.
    - A complete trial-plan.json binds exact commands, inputs, caps, output paths, task and queue; `tools/newest_experiments.py --experiment EXP-ICPERF-018b0c --json` reports execution_state ready.
    - A runbook satisfying design-experiment requirements lints with `LINT OK`, or an explicit implementation-tier reason is recorded and the execution handoff names executor-implementation.
    - The two existing goal lanes are reconciled or a disjoint lane is lawfully admitted within max_concurrent=2; BATCH-e261c2's archive ancestry failure is not ignored.
    - A Coordinator decision approves only after frozen artifacts, exact paths and hashes, queue binding and standing authorization are recorded; independent review is planned before any claim-changing interpretation.
  readiness_note: >-
    The eight base-independent subgroup targets, 32 raw channels, 64 natural
    XCNF inputs, two planted positives and their independent input replays
    are prepared and bound by digest. The bounded two-stage runner and
    independent result checker are archived, and a synthetic CLI check passed;
    no scientific solver call has run. A frozen, authority-bound trial plan,
    complete raw-bundle archive handoff, lintable runbook or recorded
    implementation-tier reason, dispatch queue and legal goal lane remain
    missing. The historical standalone solver is not bound to this
    common-target schedule. Keep
    review_required, approved_by null and execution_authorized false until
    `newest_experiments` reports ready and a Coordinator decision approves.
