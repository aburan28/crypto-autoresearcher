experiment:
  id: EXP-ICPERF-018b0c
  version: 1
  title: Bounded k11 solver-to-certificate pilot on matched ordinary-binary bases
  goal_id: GOAL-ICPERF-e6b6a4
  question_id: RQ-ICPERF-94c86e
  hypothesis_id: H-ICPERF-195806
  idea_ids: [IDEA-20261017-3f46a5]
  status: review_required
  approved_by: null
  execution_authorized: false
  frozen: false
  designed_at: '2026-10-17'
  designed_by: coordinator
  objective: >-
    Determine whether a fixed bounded solver can produce independently
    certified m=8 full-point relations on the 60-bit prime subgroup of the
    certified GF(2^61) ordinary binary curve, using the target-blind B=316
    weighted k11 base and equal-column local random control. This is an
    instrument and relation-feasibility pilot; it makes no end-to-end speed
    or base-superiority claim.

