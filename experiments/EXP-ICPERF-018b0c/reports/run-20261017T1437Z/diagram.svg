<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370" role="img" aria-label="Two positive solver calls each reached the 300-second wall cap">
<rect width="880" height="370" fill="#ffffff"/>
<text x="40" y="42" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#162536">Positive controls: solver process wall time</text>
<text x="40" y="69" font-family="Arial,sans-serif" font-size="13" fill="#526171">RUN-ICPERF-712e85 · one call per base · both wall censored</text>
<line x1="220.00" y1="100" x2="220.00" y2="288" stroke="#d9e0e8"/>
<text x="220.00" y="311" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#35485b">0</text>
<line x1="407.50" y1="100" x2="407.50" y2="288" stroke="#d9e0e8"/>
<text x="407.50" y="311" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#35485b">100</text>
<line x1="595.00" y1="100" x2="595.00" y2="288" stroke="#d9e0e8"/>
<text x="595.00" y="311" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#35485b">200</text>
<line x1="782.50" y1="100" x2="782.50" y2="288" stroke="#d9e0e8"/>
<text x="782.50" y="311" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#35485b">300</text>
<text x="206" y="150" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#162536">weighted k11</text>
<rect x="220" y="126" width="562.529" height="38" rx="4" fill="#23678b"/>
<text x="774.53" y="150" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">300.016 s</text>
<text x="794.53" y="150" font-family="Arial,sans-serif" font-size="12" fill="#526171">n=1</text>
<text x="206" y="241" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#162536">local random k11</text>
<rect x="220" y="217" width="562.540" height="38" rx="4" fill="#568c69"/>
<text x="774.54" y="241" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">300.021 s</text>
<text x="794.54" y="241" font-family="Arial,sans-serif" font-size="12" fill="#526171">n=1</text>
<line x1="782.50" y1="103" x2="782.50" y2="270" stroke="#b63b42" stroke-width="2" stroke-dasharray="5 4"/>
<text x="778.50" y="98" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#9e3038">300 s cap</text>
<text x="520" y="341" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#35485b">Measured solver process wall time (seconds)</text>
<text x="40" y="362" font-family="Arial,sans-serif" font-size="11" fill="#526171">Censoring is an observation about the cap; the bars do not imply relation absence or solver exhaustion.</text>
</svg>
