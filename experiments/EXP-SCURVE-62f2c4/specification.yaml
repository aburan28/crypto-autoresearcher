  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL identities hold; KF rejected;
      NULL rejected. Certificate kind none.
    formula: >
      W={-3..3}. Arm E: t≡1 (mod 2) has 4 survivors.
      Arm T: t≡1 (mod 3) has 2 survivors. Joint is {1}.
    source: IDEA-20260905-03f570 mechanism (internal)
    claim_tier: observational

  inputs:
    fixture:
      real_window: [-3, -2, -1, 0, 1, 2, 3]
      real_arm_e:
        modulus: 2
        residue: 1
        must_survivors: [-3, -1, 1, 3]
        must_count: 4
      real_arm_t:
        modulus: 3
        residue: 1
        must_survivors: [-2, 1]
        must_count: 2
      real_joint:
        must_survivors: [1]
        must_count: 1
      known_false:
        kind: false_uniqueness_even_mod_2
        modulus: 2
        residue: 0
        survivors: [-2, 0, 2]
        claimed_unique: true
        must_reject: true
      matched_null:
        kind: unsupported_integer_as_divisor
        claimed_modulus: 3
        witness: none
        must_reject: true
      invalid:
        - {empty_window_unique: true, must_reject: true, refuse_code: empty_window}

  controls:
    - name: known_false
      object: KF nearby overclaim that t≡0 (mod 2) is unique on W
    - name: matched_null
      object: dummy unsupported integer presented as a divisor
    - name: invalid_empty_window
      object: empty window called unique

  independent_variables:
