experiment:
  id: EXP-SEMBIN-04ec3c
  hypothesis_id: H-SEMBIN-8e7ae3
  version: 1
  title: >-
    Charge the decomposition oracle's MEMORY, symmetrically with the rho
    baseline: the minimum store an m-summand index calculus needs to reach rho
    on a binary curve, swept over every summand count and every declared memory
    budget
  status: approved
  status_note: >-
    `specified` as authored. Approval is a separate Coordinator act and NO RUN
    MAY EXECUTE UNTIL IT IS RECORDED. This ordering is not ceremony:
    DEC-20260918-4b7e21 closed EXP-SEMBIN-992e73 to approval permanently because
    its run preceded any approval, and the reasoning there applies verbatim
    here. The predictions in this contract are frozen before the code that tests
    them exists.
  status_history:
    - status: specified
      at: '2026-09-28'
      by: coordinator
      note: >-
        Authored with no implementation and no run. Verified at approval time by
        Glob over experiments/EXP-SEMBIN-04ec3c/**, which returned
        specification.yaml ALONE -- no code/, no runs/, no RESULTS.md. This is
        the check that distinguishes this contract from EXP-SEMBIN-992e73 and it
        was performed rather than assumed.
    - status: approved
      at: '2026-09-28'
      by: coordinator
      decision: DEC-20260928-7c3d91
      note: >-
        Approved WITH BINDING PRE-APPROVAL AMENDMENTS A1-A8 below, which are
        additive and supersede named fields without editing them. Approval
        precedes implementation and execution. It asserts that the protocol is
        complete and that its claim ceiling is enforceable; it asserts nothing
        about whether H-SEMBIN-8e7ae3 is true.
  approved_by: coordinator
  approved_at: '2026-09-28'
  approval_decision: DEC-20260928-7c3d91
  approval_basis: >-
    Standing user authorization recorded in AGENTS.md on 2026-09-06 ("all is
    approved. ideas/experiments should be always approved"). No user
    confirmation was sought. Protocol completeness remained the Coordinator's
    responsibility and is discharged by amendments A1-A8, not waived by the
    authorization.
  execution_authorized: true
  implementation_authorized: true
  claim_ceiling: >-
    heuristic_estimate, conditional on HEUR-GENERIC-MSUM. On this run alone
    H-SEMBIN-8e7ae3 may reach at most `analyzed`. It may not reach `replicated`
    (one run), and it may NEVER reach `supported` while HEUR-GENERIC-MSUM is
    `unvalidated` (agents/coordinator.md promotion gate 2). No outcome of this
    experiment may close the decomposition-oracle lane: a negative prices the
    family GIVEN generic m-SUM and names the sub-generic oracle as the surviving
    route, which is the contract's own reading and is now binding.
  objective: >-
    Settle, for the whole decomposition-oracle family rather than one oracle,
    whether ANY summand count can put index calculus below rho on a binary
    curve once the oracle's memory is charged on the same footing as the
    baseline's.

    THE ASYMMETRY THIS CLOSES. H-SEMBIN-97ea23 (status: supported) established
    that the rho baseline must be costed at a single coherent operating point on
    van Oorschot-Wiener's own time-memory curve, and that doing so moves the
    crossover by +85 in n and -29.0 bits. That discipline was applied to the
    BASELINE only. The index-calculus side has been costed with its oracle's
    store treated as free. A meet-in-the-middle decomposition oracle is exactly
    the kind of algorithm whose apparent advantage lives in its store, so
    charging one side and not the other is the single largest unexamined
    asymmetry in this program's comparison.

    WHY THIS IS THE RANKED ACT, and not more oracle engineering. Three committed
    results interlock. The product law is independent of dim V, so with the
    oracle charged NOTHING the m = 3 floor is already 2^68.58 against rho's
    2^60.8090 (EV-ICPERF-10c5fc, KN-FIND-aa2efc). The Riemann-Roch oracle
    realises the generic Theta(|F|^2) cost of 3SUM with constant near 2 and
    LOSES to structureless pair enumeration at 0.494x field operations on
    identical solution sets. And the family's measured implicit base of 2^132.58
    is, to within constants, exactly what a generic oracle predicts at n = 131.
    Read together those say the family achieves generic search and nothing
    better, and that at m = 3 generic search makes the total independent of the
    factor-base dimension, so tuning the base cannot move it. The only escape in
    the arithmetic is larger m. This contract prices that escape.

    Derivation only. No curve is instantiated, no factor base is built, no
    polynomial system is solved, no security statement is made in either
    direction. Every n is a parameter label in a cost formula.
  cost_model:
    relations_needed: >-
      |F| = 2^d, taking one relation per factor-base element and ignoring the
      small excess, which is a constant factor and is declared as such.
    decomposition_probability: >-
      p = |F|^m / (m! * N) for a uniform target, with N the prime subgroup order
      rather than #E. Using #E would overstate rho, which is the error
      DEC-20260915-428a17 already records for a sibling lane.
    trials_per_relation: 1/p = m! * N / |F|^m
    oracle_models:
      - id: FREE
        cost: 1
        memory: 0
        role: >-
          CONTROL, not a candidate. Reproduces the committed free-oracle floor
          table, which is the only external check this contract has on its own
          arithmetic.
      - id: ENUM
        cost: "|F|^(m-1)"
        memory: "O(1) beyond the factor base"
        role: >-
          Fix m-1 summands and test whether the remainder lies in F. The
          honest memory-free baseline for m-SUM over a group.
      - id: MITM
        cost: "|F|^ceil(m/2)"
        memory: "|F|^floor(m/2)"
        role: >-
          Generalised birthday: tabulate sums of floor(m/2) elements, probe with
          sums of the complement. Time is the larger side, store is the smaller.
          At m = 3 this degenerates to |F|^2 time either way, which is why the
          measured m = 3 result and the generic prediction coincide.
      - id: MITM_CAPPED
        cost: "|F|^(m-s), s = min(floor(m/2), floor(log2(B)/d))"
        memory: "|F|^s <= B"
        role: >-
          Partial meet-in-the-middle under a declared store budget B: tabulate
          what fits, enumerate the rest. This is the model the whole question
          turns on.
    linear_algebra:
      time: "|F|^2 (sparse, Wiedemann)"
      memory: "~m * |F| (m nonzeros per row)"
    baseline: >-
      rho total work W = 0.886 * 2^(n/2) from H-SEMBIN-97ea23's HEUR-VOW-CURVE
      (status: unvalidated). Work is INVARIANT along vOW's curve, so the
      baseline's operation count does not improve with memory -- store buys
      parallel wall-clock efficiency, not work. That invariance is what makes
      the comparison meaningful: the index-calculus side's store buys TIME, the
      baseline's does not, so charging memory cannot disadvantage rho unfairly.
      For ECC2K-130 the published 2^60.8090 with the <-1> x <pi> speedup is
      carried as a second baseline column.
  procedure:
    - >-
      Reproduce the committed free-oracle floor table under the FREE model and
      assert agreement in shape and ordering. Abort on disagreement: without
      this gate a divergence anywhere else is uninterpretable.
    - >-
      For each oracle model and each m, minimise total cost over the
      factor-base dimension d, reporting the optimising d, the total cost, the
      store required, and the margin against both baselines.
    - >-
      Sweep declared store budgets B in {2^30, 2^40, 2^50, 2^60, 2^70, 2^80,
      2^90, 2^100, unlimited} under MITM_CAPPED and report, per (m, B), whether
      any cell falls below either baseline.
    - >-
      Compute the MINIMUM STORE that admits a sub-rho cell at each m, by solving
      the margin condition for d and reading the store exponent off it. Report
      the m that minimises that store, which is the family's cheapest possible
      entry point.
    - >-
      Repeat at every binary curve degree already in the program's scope: the
      Certicom binary challenge degrees 97, 109, 131, 163, 191, 239 and the FIPS
      binary degrees 163, 233, 283, 409, 571, all prime.
  controls:
    - id: C-FLOOR-REPRO
      what: FREE model against the committed free-oracle floor table
      why: the only external check on this contract's own arithmetic
      pass_criterion: >-
        ordering preserved and each row within 5 bits of the committed value,
        the slack being the m! and excess-relation constants this contract
        states explicitly and the committed table folds in
    - id: C-M3-ANCHOR
      what: >-
        ENUM and MITM at m = 3 against the MEASURED implicit base of 2^132.58
        and against the d-independence the measurement found
      why: >-
        This is a measured anchor, not a derived one. If the derivation does not
        reproduce d-independence at m = 3 it has the wrong oracle exponent, and
        every larger-m row inherits the error.
      pass_criterion: >-
        total cost at m = 3 varies by less than 1 bit across d in [10, 60] under
        both models, and lands within 5 bits of 2^132.58
    - id: C-NULL-NO-MEMORY-CHARGE
      what: >-
        NULL OBJECT. Re-run the whole sweep with the store charged at zero, so
        MITM_CAPPED collapses to MITM at every B.
      why: >-
        Controls before belief. If the sub-rho cells are the same with and
        without the memory charge, the charge is buying nothing and the result is
        about the product law alone, not about memory.
      pass_criterion: >-
        diagnostic, reported either way; a null that matches the charged sweep
        REFUTES this contract's premise and must be reported as such
    - id: C-DEGENERATE-M
      what: flag any cell whose optimising d makes k = n/m fall below 2, or m > n
      why: >-
        a factor base of dimension 1 is not a factor base, and an argmin at a
        degenerate parameter is a boundary reading dressed as an optimum
      pass_criterion: diagnostic; every flagged cell reported as flagged
  metrics:
    - total cost in log2 operations, per (curve degree, m, oracle model, store budget)
    - the optimising factor-base dimension, and whether it sits at a sweep bound
    - store required, in log2 entries and log2 bits
    - margin in bits against vOW total work and against the published ECC2K-130 reference
    - the minimum store admitting a sub-rho cell at each m, and the m minimising it
  success_criterion: >-
    The sweep completes for every listed curve degree with C-FLOOR-REPRO and
    C-M3-ANCHOR passing and every degenerate cell flagged. SATISFIED EQUALLY BY
    EITHER OUTCOME: a sweep in which no cell beats rho satisfies this contract
    exactly as well as one in which some cell does. There is no result this
    contract is trying to reach.
  falsification_criterion:
    added_at_approval: >-
      Absent from the authored contract and REQUIRED by the schema once status
      became `approved`, so it is an approval-time Coordinator judgement rather
      than authoring boilerplate. Written before any implementation exists.
      CONSTRAINED BY AMENDMENT A2: it may NOT be stated as "P3a fails", because
      P3a is a theorem of the cost model and its falsifier is algebraically
      unreachable within the stated oracle class. A criterion that cannot fire is
      not a falsification criterion.
    what_falsifies_this_contract:
      - >-
        PRIMARY, AND THE ONLY GENUINELY SEARCHED ONE. Any cell -- at any of the
        eleven listed degrees, any summand count m, any factor-base dimension d --
        that falls below EITHER baseline column with a declared store budget
        B <= 2^80, i.e. at a store a machine could plausibly hold. This is P5's
        falsifier. It is thinnest at the small degrees: at n = 97 the required
        store is about 2^85 entries against the 2^80 budget, roughly five bits,
        so n = 97 and n = 109 are where it would fire.
      - >-
        C-FLOOR-REPRO's structural gate failing -- ordering, monotone decrease in
        m, or the sign of any margin (m = 3 above rho, m = 4 below) not
        reproduced -- OR the offset diagnostic departing from the declared
        signature of positive, monotone in m, within 1.5 bits of 2*log2(m). Either
        says the arithmetic in this contract or in its implementation is wrong and
        no row may be read.
      - >-
        The genuine null object of amendment A4 showing that the family's VERDICT
        is unchanged between the store-budgeted and store-free treatments. That
        would refute this contract's premise -- that the oracle's unpriced store
        was the largest unexamined asymmetry in the comparison -- and would make
        the whole sweep a restatement of the product law.
      - >-
        The J1 attack succeeding: the excess-relation term growing in m rather
        than being the declared constant, or an odd summand count admitting a
        sub-rho cell at lower store than both its even neighbours. Either
        mis-accounts the closed forms every reported cell rests on, and the second
        would additionally void P4's argmin.
      - >-
        The proves-too-much control failing: this accounting finding NO sub-rho
        cell for the discrete logarithm in F_q^* or for a high-genus hyperelliptic
        Jacobian, where index calculus demonstrably does beat generic square-root
        search. An argument that reaches this contract's conclusion where that
        conclusion is known false has proved too much and the defect is in the
        bookkeeping.
    what_does_NOT_falsify_this_contract:
      - >-
        P3a failing. It cannot, within the stated oracle class: a sub-rho cell
        requires d(s-1) > n/2 + log2(m!), hence store exponent ds >
        S/(S-1)*(n/2 + log2 m!) > n/2. An apparent P3a failure is an arithmetic
        bug and is reported as one, never as a result.
      - >-
        HEUR-GENERIC-MSUM turning out false. That falsifies the HYPOTHESIS
        H-SEMBIN-8e7ae3, not this contract, and it is out of this contract's reach
        by its own declared scope. The distinction is deliberate: the contract
        prices a family GIVEN an oracle class; the hypothesis asserts the oracle
        class is the best available. Only the second is refuted by exhibiting a
        sub-generic m-SUM algorithm.
      - >-
        A timeout, crash, or memory stop. Infrastructure facts, recorded as such,
        never negative mathematical evidence (AGENTS.md rule 3).
      - >-
        C-M3-ANCHOR or C-FLOOR-REPRO failing against the external anchors in a way
        that cannot be localised. Per amendment A8 such a failure is AMBIGUOUS
        between a defect here and a defect in an `external_unreviewed` record
        whose grade this program has not conferred, and is reported as ambiguous
        rather than resolved against this contract.
  preregistered_predictions:
    provenance_of_these_predictions: >-
      STATED HONESTLY BECAUSE IT CHANGES HOW THEY SHOULD BE WEIGHED. These are
      not blind guesses. The session author derived them by hand before writing
      this contract, and the contract exists to check that hand derivation
      exactly, sweep it properly, and expose any cell it missed. A confirmation
      is therefore WEAK evidence -- it says the arithmetic was done twice by the
      same mind. A refutation is STRONG, and is the outcome this contract is
      most useful for. Treat P1 through P5 as conjectures under test, never as
      results this run reproduced.
    predictions:
      - id: P1
        statement: >-
          Under ENUM the total cost is m! * 2^n INDEPENDENT of both d and m, so
          no memory-free enumeration oracle beats rho at any summand count or any
          factor-base size. The d and m exponents cancel exactly.
        falsified_if: >-
          the ENUM total varies with d by more than the stated constants, or any
          ENUM cell falls below either baseline
      - id: P2
        statement: >-
          Under MITM with the store free, the cost is 2^(2n/(floor(m/2)+1)) and
          the first m strictly below the published ECC2K-130 reference is m = 8,
          with m = 6 landing near it rather than under it.
        falsified_if: a different m is the first strictly-below row at n = 131
      - id: P3
        statement: >-
          THE LOAD-BEARING ONE. The store exponent required for any sub-rho cell
          is bounded below by n/2 at EVERY m, so beating rho always costs at
          least as much memory as rho's entire work. The bound tightens as m
          grows because the m! term grows faster than the store exponent falls.
        falsified_if: >-
          any m admits a sub-rho cell with store exponent below n/2
      - id: P4
        statement: >-
          That minimum store is minimised near m = 8 at roughly 2^108 entries
          for ECC2K-130, against rho's total work of about 2^61 -- so the store
          alone exceeds the attack it is trying to beat by more than 40 bits.
        falsified_if: >-
          the minimising m is not in {6, 8, 10}, or the minimum store exponent
          is below 95 or above 125
      - id: P5
        statement: >-
          No cell with a store budget at or below 2^80 falls below either
          baseline at any listed curve degree.
        falsified_if: any such cell is found
  budget:
    wall_clock_cap_seconds: 900
    memory_cap_bytes: 2147483648
    cpu_note: >-
      Seconds of standard-library arithmetic over an integer parameter sweep. No
      Groebner engine, no solver, no quiet host, so this contends with no
      measurement lane. That is why it is doable now and why it ranks ahead of
      anything needing the machine.
  scope:
    claim_tier: heuristic_estimate
    what_this_is: >-
      Arithmetic on a cost model, sweeping a parameter the model already had and
      the program had left free. Not a measurement, not a new algorithm, not an
      attack, and not a statement about the security of any curve.
    inherited_assumptions:
      - >-
        HEUR-VOW-CURVE (unvalidated) for the vOW baseline column.
      - >-
        That m-SUM over a group admits no better generic time-store tradeoff
        than partial meet-in-the-middle. THIS IS THE ASSUMPTION THE WHOLE RESULT
        RESTS ON and it is an assumption, not a theorem: a sub-generic m-SUM
        algorithm exploiting the curve's group structure would void every row.
        The contract's own conclusion is therefore conditional in exactly the
        place where a breakthrough would live, and says so.
      - >-
        Sparse linear algebra at |F|^2 time and m|F| memory.
      - >-
        Semaev's Assumption 1 is NOT inherited: no degree bound and no Groebner
        cost enters any model here. That is deliberate. Every other cost table
        this program holds is conditional on an assumption checked only at n <= 21
        (EV-ICPERF-a8080e), and this contract is designed to be independent of
        it, which is most of why it is worth running.
    what_it_does_not_touch:
      - >-
        The security of any Certicom challenge curve or any FIPS curve, in either
        direction.
      - >-
        Whether a sub-generic m-SUM oracle exists. A negative here bounds the
        family GIVEN generic m-SUM, and names the sub-generic oracle as the one
        surviving route rather than closing it.
      - >-
        Prime-field curves, and Weil descent or cover attacks, which every
        listed degree being prime already blocks.
  # ===================================================================
  # PRE-APPROVAL COORDINATOR AMENDMENTS (DEC-20260928-7c3d91)
  #
  # Additive and binding. Each names the field it supersedes; NO field above
  # is edited or deleted, so a reader can compare what was authored against
  # what was approved. Every amendment was written BEFORE any implementation
  # exists and before any outcome has been observed by anyone, which is what
  # makes it a control rather than a post-hoc criterion change (the act
  # agents/coordinator.md Prohibitions forbids).
  # ===================================================================
  coordinator_amendments_pre_approval:
    - id: A1
      supersedes: controls[C-FLOOR-REPRO].pass_criterion, procedure[1]
      severity: blocking_defect_repaired
      finding: >-
        C-FLOOR-REPRO AS AUTHORED IS UNSATISFIABLE BY A CORRECT IMPLEMENTATION,
        so as written it would abort the run on a bad control rather than on a
        bad result. Two agents reconstructed the committed free-oracle floor
        table independently from the cost model and AGREED with each other to
        within 0.05 bits while NEITHER reproduced the committed table. Standard
        balance -- relations |F|, trials m!N/|F|^m, linear algebra |F|^2, optimum
        at d = n/(m+1), cost 2n/(m+1) -- gives 87.33, 65.50, 52.40, 43.67,
        37.43, 29.11 at m = 2, 3, 4, 5, 6, 8 against the committed 89.25, 68.58,
        56.40, 48.44, 42.85, 35.61. The offsets are +1.92, +3.08, +4.00, +4.77,
        +5.42, +6.50: POSITIVE AND MONOTONE INCREASING IN m, so m = 8 exceeds
        the authored 5-bit tolerance and the control fails on correct
        arithmetic.
      amendment: >-
        C-FLOOR-REPRO is split. (i) THE GATE, which may abort, is
        CONVENTION-INDEPENDENT STRUCTURE: the FREE model must reproduce the
        committed table's ordering across all six rows, its strict monotone
        decrease in m, and the SIGN of every margin against the 2^60.8090
        reference -- in particular m = 3 strictly ABOVE rho and m = 4 strictly
        BELOW it. Both reconstructions preserve all three properties, and these
        are the only properties any downstream claim in this program actually
        uses. (ii) THE OFFSETS ARE A REPORTED DIAGNOSTIC AND NEVER A GATE: per
        row, absolute offset against the committed value and the trend of that
        offset in m.
      why_not_widen_the_tolerance: >-
        Rejected. A tolerance moved to fit what was just measured has stopped
        being a check -- the failure CLAUDE.md names for corpus floors, and it
        applies here unchanged. Worse, the authored 5-bit slack ALREADY absorbs a
        systematic monotone-in-m divergence, which is the signature of a wrong
        oracle exponent rather than of a constant; a gate that cannot fail for
        the right reason while it can fail for the wrong one is not a control.
      why_not_recover_the_convention_first: >-
        Rejected as disproportionate AND as unbounded. Two agents attempted the
        recovery and both failed; the published derivation in
        KN-FIND-aa2efc proof_refs states the product law and the required-speedup
        formula 2^-(70.19 + log_2 m) -- whose 70.19 checks out exactly as
        131 - 60.809 -- and then says "hence" six numbers that do not follow from
        it. Converting a seconds-long derivation into open-ended records
        archaeology to recover a convention that is not published is the wrong
        trade. The gap is a real and separate defect and is filed as
        CORR-20260928-2b8f4e rather than folded into this contract.
      recovered_failure_detection: >-
        THIS IS THE PART THAT REPLACES WHAT THE TOLERANCE GATE LOSES, and it is
        required reporting. The offset pattern has a DECLARED EXPECTED SIGNATURE,
        recorded here before the run: positive, monotone increasing in m, and
        tracking roughly 2*log2(m) (2.00, 3.17, 4.00, 4.64, 5.17, 6.00 against
        the six offsets above). A sign flip, a non-monotone pattern, or a
        departure exceeding 1.5 bits from that signature must be reported as a
        SUSPECTED IMPLEMENTATION DEFECT even though the structural gate passed,
        and the run stops for Coordinator adjudication rather than proceeding.
      conjectured_convention_not_a_recovery: >-
        Recorded as forward guidance and explicitly NOT a recovery. The committed
        rows are fit by 2n/(m+1) + 2*log2(m) to within 0.08, 0.09, 0.00, 0.13,
        0.25, 0.50 bits -- exact at m = 4 -- with the residual itself monotone.
        That is a LEAD for whoever closes CORR-20260928-2b8f4e, not a derivation,
        and it must not be cited as the committed table's convention.
    - id: A2
      supersedes: preregistered_predictions (classification only; no prediction text is altered)
      severity: material
      finding: >-
        THE FIVE PREDICTIONS ARE NOT THE SAME KIND OF OBJECT, and counting their
        confirmations together would manufacture evidential weight. P3 in
        particular is NOT FALSIFIABLE BY THIS SWEEP. Under the contract's own
        MITM_CAPPED relation -- time |F|^(m-s), store |F|^s -- the total is
        m! * 2^(n + d(1-s)), so a sub-rho cell requires d(s-1) > n/2 + log2(m!)
        and the store exponent ds therefore exceeds (n/2 + log2 m!)*s/(s-1),
        which is strictly greater than n/2 for every s >= 2. P3's stated
        falsifier -- "any m admits a sub-rho cell with store exponent below n/2"
        -- is unreachable as an algebraic consequence of the model, not as an
        empirical finding. Its only real falsifier is HEUR-GENERIC-MSUM, which
        this contract states it cannot test.
      amendment: >-
        Each prediction carries an epistemic class, and the derived evidence
        record MAY NOT count the confirmation of a `model_consequence` as support
        for H-SEMBIN-8e7ae3. Classes, fixed here: P1 `model_consequence`;
        P2 `model_consequence_with_sweep_selection` (the closed form is derivable
        -- balancing n + d(1 + ceil(m/2) - m) against the linear-algebra term 2d
        gives d = n/(floor(m/2)+1) and cost 2^(2n/(floor(m/2)+1)), and 262/(S+1)
        < 60.809 forces S >= 4, hence m = 8 -- but WHICH row is first below the
        reference at each of eleven degrees is genuinely read off the sweep);
        P3a `model_consequence`; P3b see A2b; P4 `model_consequence` (the same
        closed form minimises at S/(S-1)*(n/2 + log2 m!), giving 140.2, 112.5,
        107.7, 109.1, 113.2 at m = 4, 6, 8, 10, 12 for n = 131, hence the m = 8
        argmin near 2^108 that P4 states); P5 `sweep_search`, the one prediction
        whose falsifier the sweep genuinely hunts across eleven degrees, every m
        and every B.
      what_the_run_therefore_buys: >-
        Stated plainly so no reader overreads it. For P1, P2, P3a and P4 the run
        buys IMPLEMENTATION FIDELITY -- that code computes what three
        derivations say the model implies -- plus the cells the hand derivation
        never enumerated: eleven curve degrees, every m, every B, and the
        degenerate-cell flags. It does not buy evidence that the model is right.
        P5 is the row where a surprise is possible.
    - id: A2b
      supersedes: preregistered_predictions.predictions[P3].statement, second sentence
      severity: material
      finding: >-
        P3's mechanism clause -- "the bound tightens as m grows because the m!
        term grows faster than the store exponent falls" -- CONTRADICTS P4 IN THE
        SAME CONTRACT, and no run is needed to see it. The minimum store exponent
        S/(S-1)*(n/2 + log2 m!) FALLS from 140.2 at m = 4 to 107.7 at m = 8 and
        only then rises; P4 asserts exactly that argmin. So the bound LOOSENS
        over m <= 8 and tightens after. P3's falsified_if covers only the n/2
        limb, so the false clause was unfalsifiable as authored.
      amendment: >-
        P3 is read as two claims. P3a, which stands: the required store exponent
        exceeds n/2 at every m. P3b, the monotonicity clause, is WITHDRAWN AS
        AUTHORED and replaced by a reportable quantity -- the run must report the
        minimum-store curve over m and the m at which it turns, and must state
        that P3b as written is inconsistent with P4. The run may not silently
        reconcile them.
    - id: A3
      supersedes: controls (adds C-BOUND-PROBE), metrics[2]
      severity: material
      finding: >-
        The authored controls guard the oracle exponent and the degenerate
        parameters but NOT the search bounds, and every headline figure here is
        an ARGMIN or a solved margin condition: procedure step 2 minimises over
        d, step 4 solves the margin condition for d. The metrics note "whether
        the optimising d sits at a sweep bound" but nothing gates on it. This is
        the exposure that produced CORR-20260917-02cfe6, where `crossover()`
        returned its own search floor as a plausible integer.
      amendment: >-
        C-BOUND-PROBE, a declared control, applying the STANDING CONTROL
        REQUIREMENT of DEC-20260918-4b7e21 ITEM-2 to this contract's argmins.
        Every minimum-store figure, optimising d, and margin-condition solution
        is computed at NO FEWER THAN TWO MATERIALLY SEPARATED d-sweep bounds and
        reported per bound. A figure that TRACKS ITS BOUND is recorded as "no
        sub-rho cell in range" or "argmin not interior", never as a minimum or a
        crossover. pass_criterion: both bounds agree on every reported argmin, or
        the disagreement is reported per bound and the figure is downgraded to
        bound-tracking.
    - id: A4
      supersedes: controls[C-NULL-NO-MEMORY-CHARGE]
      severity: material
      finding: >-
        THE AUTHORED NULL OBJECT CANNOT REFUTE THE PREMISE IT IS AIMED AT.
        Re-running with the store charged at zero collapses MITM_CAPPED to MITM,
        whose feasible cells are a strict SUPERSET of the capped ones whenever B
        binds. So "the sub-rho cells are identical" can only occur where B never
        binds, and the test reduces to confirming that a constraint constrains.
        Its stated refutation branch is unreachable.
      amendment: >-
        Relabelled `C-BINDINGNESS-DIAGNOSTIC`, reported and never read as a
        refutation. The GENUINE null object is declared instead and must be
        reported: does the family's VERDICT differ from the verdict already
        obtainable with the store free? It does, and the contract already
        contains the reason -- P2 puts m = 8 below the reference with store free
        while P4/P5 put the required store at ~2^108 entries, far above any
        declared budget. Report that comparison as the null-object result. If the
        verdict were the SAME under both, the memory treatment would be buying
        nothing and the contract's premise would be refuted; that is the branch
        the authored control meant to test and could not.
    - id: A5
      supersedes: title, objective (framing only; no computation changes)
      severity: material
      finding: >-
        "CHARGE THE ORACLE'S MEMORY" OVERSTATES WHAT IS COMPUTED. No store term
        enters any cost functional on either side. The oracle's store is
        BUDGET-CONSTRAINED (s <= floor(log2 B / d)) and reported; rho's work is
        invariant along its own curve and its memory is reported, not charged.
        The comparison is defensible and is arguably the right one, but a reader
        of the title would believe memory entered a cost.
      amendment: >-
        BINDING LANGUAGE CEILING. No record derived from this experiment -- no
        EV-*, no DEC-*, and above all no KN-FIND title -- may state that memory
        was charged into a cost. The permitted formulation is: the oracle's store
        is budget-constrained and reported symmetrically with the baseline's,
        neither side adding store to its operation count. This exists because a
        corpus title states a conclusion where an evidence record states its
        caveats, which is precisely how KN-FIND-9cba50 propagated an attribution
        its own source disowned (DEC-20260918-4b7e21 ITEM-3).
    - id: A6
      supersedes: procedure[3] and procedure[4], reconciliation between them
      severity: material
      finding: >-
        STEP 3 AND STEP 4 COMPUTE DIFFERENT OBJECTS AND THE CONTRACT DOES NOT SAY
        SO. Step 3 sweeps integer s = min(floor(m/2), floor(log2 B / d)); step 4
        solves the margin condition continuously. Integrality is not cosmetic: at
        n = 131, m = 8, B = 2^80, d = 27 the continuous store exponent 4d = 108
        is unreachable and floor(80/27) = 2 forces s = 2, giving m! * 2^(n-d)
        = 2^119.3 -- some 54 bits above the continuous reading. So step 4's
        minimum store may be realised by NO cell of step 3's sweep, while P3a/P4
        are read off step 4 and P5 is falsified only by step 3.
      amendment: >-
        Both are reported and their relationship is stated per (degree, m): the
        continuous minimum store from step 4, the best integer-s cell from step
        3, and whether the step-4 minimum is REALISED by any step-3 cell. An
        unrealised minimum is reported as a model bound, never as an attack
        parameter.
    - id: A7
      supersedes: controls (adds C-BASELINE-CONSISTENCY)
      severity: disclosed
      finding: >-
        Two baseline columns are carried and nothing guards their separation.
        0.886 * 2^(131/2) = 2^65.33 while the published ECC2K-130 reference is
        2^60.8090, a 4.52-bit gap attributed to the <-1> x <pi> speedup. A margin
        that silently mixes the two columns moves by up to 4.52 bits.
      amendment: >-
        C-BASELINE-CONSISTENCY. Recompute both columns and report the gap at
        n = 131 explicitly. pass_criterion: the vOW column reproduces
        0.886 * 2^(n/2) at every listed degree; the published reference is used
        ONLY at n = 131, where the curve it describes lives; no margin mixes
        columns; and every margin names which column it is against. The published
        reference may not be extrapolated to any other degree.
    - id: A8
      supersedes: controls[C-FLOOR-REPRO].why, controls[C-M3-ANCHOR].why
      severity: material
      finding: >-
        BOTH OF THIS CONTRACT'S EXTERNAL ANCHORS REST ON RECORDS WHOSE GRADES
        THIS PROGRAM HAS RULED NOT CONFERRED. The committed floor table, the
        2^132.58 implicit base and the m = 3 d-independence all come from
        EV-ICPERF-10c5fc and KN-FIND-aa2efc, which DEC-20260918-4b7e21 ITEM-3
        ruled `external_unreviewed`, whose `strength: replicated` it ruled not
        this program's grade, and which no reviewer in this program has read.
        C-M3-ANCHOR is therefore NOT the stronger control for being "measured":
        it is measured externally, by an instrument this program has not opened.
      amendment: >-
        Both anchors are pinned to exact paths --
        knowledge/findings/KN-FIND-aa2efc.md and
        ledger/evidence/EV-ICPERF-10c5fc.yaml -- and both are declared
        CONSISTENCY ANCHORS OF UNCONFERRED GRADE. Passing them confers nothing on
        either record and does not lift DEC-20260918-4b7e21's ceiling: no KN-*
        may be promoted from them, and neither may support a hypothesis status
        change. Conversely, and this is the operative half: a FAILURE of either
        anchor is ambiguous between a defect in this implementation and a defect
        in the external record, and must be reported as ambiguous rather than
        resolved against this contract's arithmetic.
