    - experiments/EXP-SEMBIN-04ec3c/runs/<RUN-SEMBIN-new>/{manifest.yaml, raw-result.json, command.txt, environment.json, timing.json, stdout.log, stderr.log, artifact-digests.json}
    - experiments/EXP-SEMBIN-04ec3c/runs/<RUN-SEMBIN-new>/gate/{gate_report.json, mutants/}
