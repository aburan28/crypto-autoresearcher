protocol_amendment:
  id: AMD-20261001-e61f2b
  amendment_id: AMD-20261001-e61f2b
  experiment_id: EXP-SEMBIN-04ec3c
  hypothesis_id: H-SEMBIN-8e7ae3
  kind: additive
  version_from: 1
  version_to: 2
  recorded_at: '2026-10-01'
  authored_by: coordinator
  approved_by: coordinator
  approval_decision: DEC-20261001-5c9e7a
  execution_handoff: TASK-20261001-c2a58e
  snapshot_handoff: TASK-20261001-41f6b3
  archived_by: TASK-20261001-7d04c9
  id_provenance: >-
    Random 6-hex token chosen without allocate_id.py (no shell); Grep over the
    working tree finds it only inside unrelated hash strings. Committed-state
    check owed on TASK-20261001-7d04c9 (DEC-20261001-5c9e7a PD-1).
  authority: >-
    Coordinator, standing user authorization of 2026-09-06. CLAUDE.md: "Changing
    a frozen scientific protocol uses an additive amendment; never rewrite
    historical records." agents/coordinator.md forbids changing success criteria
    after observing outcomes WITHOUT a versioned protocol_amendment; this is that
    record, and its post-data status is declared rather than hidden.

  precedence: >-
    Protocol version 2 = experiments/EXP-SEMBIN-04ec3c/specification.yaml
    (version 1, including coordinator_amendments_pre_approval A1-A8) plus this
    file. This file governs wherever it names a field; every other field of
    version 1 governs unchanged.

  reason: >-
    Version 1 cannot proceed unchanged. (i) Its cost model omits the construction
    of the oracle's |F|^s table, so every sub-rho cell it reports needs fewer than
    one oracle call and a table larger than rho's whole work (J1 S6; J2 section 3;
    J3 section 1; blind re-derivation S2/V3). (ii) Its gating control C-FLOOR-REPRO,
    as amended by A1, accepts an m!-free implementation and rejects every
    m!-faithful one, and is blind to every oracle exponent (J2). (iii) Its run
    tripped the A1 stop and did not stop, and omitted A3, A6 and A7
    (DEC-20261001-5c9e7a R2; CORR-20261001-a38d14 C6, C7).

  pre_data_assessment:
    status: POST-DATA
    exposures:
      - RUN-SEMBIN-c68773 raw-result.json and manifest, read by the Coordinator and all five reviewers.
      - >-
        The construction-charged outcome, computed by two reviewers independently
        (J1 S6 corrected_margin_over_vow_bits; J3 section 1 fill-charged floor
        table) and implied analytically by the blind re-derivation (identity I1).
    consequence: >-
      Every v2 outcome below is KNOWN IN ADVANCE to the authoring Coordinator. It
      is recorded as a reviewer-derived expectation (E-1 to E-4) so the rerun can
      disagree, and a disagreement is localised to one of three named
      implementations, never resolved in favour of the expectation.

  # ---------------------------------------------------------------------------
  # The v2 model, stated exactly. All quantities are log2. For a cell (n, m, d, s):
  #   N   = log2 of the group order used in v1: log2 r ~ 129.000 at n = 131 (r the
  #         ECC2K-130 subgroup order in the frozen input), n at every other degree.
  #   L   = log2(m!)
  #   S   = floor(m/2)
  #   K   = d                                (relations; v1 convention)
  #   TPR = N + L - m*d                      (trials per relation, 1/p)
  #   CALLS = K + TPR                        (log2 of total oracle invocations)
  #   ORACLE exponent o: FREE 0; ENUM (m-1)*d; MITM (m-S)*d with s = S;
  #         MITM_CAPPED (m-s)*d with s = min(S, floor(log2 B / d)).
  #   PROBE = K + TPR + o
  #   FILL  = s*d for MITM and MITM_CAPPED when s >= 1; 0 for FREE and ENUM.
  #   LA    = 2*d                            (v1 convention)
  #   TOTAL = log2(2^PROBE + 2^FILL + 2^LA)
  #   VOW   = log2(0.886) + N/2             (per degree, with N as above)
  #   PUB   = 60.8090, used ONLY at n = 131
  # ---------------------------------------------------------------------------
  changes:
    - id: C-1
      supersedes: specification.cost_model (adds a term; no v1 term is altered)
      title: Charge the oracle table's construction
      text: >-
        TOTAL includes FILL = s*d, one operation per table entry written, for every
        table-based oracle model (MITM, MITM_CAPPED with s >= 1). The table is
        target-independent and built once per cell. The unit is the v1 unit (one
        group operation, probe, multiply-add or table write each count as one) and
        is declared optimistic for index calculus. The v1 probe-only total is
        reported beside every v2 total as `probe_only_v1_reference`, labelled
        "not a cost", and is never read as one.
    - id: C-2
      title: Trials >= 1 domain guard
      text: >-
        A cell with CALLS < 0 (fewer than one oracle invocation in the whole
        relation phase) is flagged OUT_OF_DOMAIN. It is reported with its flag,
        EXCLUDED from every sub-rho count, every argmin and every minimum-store
        figure, and never read as a cost. The count of out-of-domain cells per
        (degree, model) is a required metric.
    - id: C-3
      title: Generic-lower-bound consistency flag (STOPPING)
      text: >-
        For every cell of ENUM, MITM and MITM_CAPPED (FREE is a control with an
        oracle charged at zero and is exempt), if TOTAL < N/2 - 2.0 the run STOPS
        and reports an ARITHMETIC DEFECT. Threshold declared here before the
        rerun. Basis: the model's own analytic floor TOTAL >= (N + L + d)/2
        (J1 analytic_floor; blind identity I1), with Shoup's generic bound
        (KN-LIT-011) as the external sanity reason; the 2-bit slack covers constant
        conventions (relation count 1 bit, the 0.886 constant 0.17 bit) and nothing
        else. The v1 store-free branch would have fired this flag by 16 to 148 bits
        (J3 section 1).
    - id: C-4
      supersedes: controls[C-FLOOR-REPRO] (as amended by A1) as the GATING control
      title: Replacement implementation gate C-IMPL-GATE (STOPPING)
      text: >-
        Adapted from the gate TASK-20260928-3f90b8 demonstrated
        (j2_mutation_harness.py proposed_gate), re-implemented by the executor
        from this text. Any failure STOPS the run; no row may be read.
        (a) YIELD IDENTITY. For every evaluated cell with d >= 16 the
        implementation's TPR equals N - log2 binom(2^d, m), computed independently
        via lgamma, to within 0.05 bits.
        (b) CLOSED FORMS. At every listed degree, every m in 2..16 (both
        parities), d in {16, 24, 32} and every permitted s, the implementation's
        PROBE, FILL, LA and TOTAL equal the closed forms in the header block above
        to within 1e-6 bits, for every oracle model.
        (c) BUDGET INVARIANT. Every MITM_CAPPED cell satisfies s*d <= log2 B and
        s = min(S, floor(log2 B / d)).
        (d) M-BOUND PROBE. Any argmin over m that lands at m = 16 is re-evaluated
        with m up to 24 and reported as bound-tracking if it moves.
        (e) GATE POWER SELF-TEST. Four mutated copies of the v2 driver are built
        and run through (a)-(d): M1 drop L from TPR; M2 tabulate floor((m-1)/2)
        (oracle exponent +d at even m); M3 swap the time and store halves; M4 use
        s = min(S, ceil(log2 B / d)). The gate must FAIL every mutant and PASS the
        unmutated driver. A gate that passes any mutant stops the run. Mutant
        sources and their gate outputs are required artifacts.
    - id: C-5
      supersedes: A1 recovered_failure_detection (the offset signature)
      title: Withdraw the A1 offset signature
      text: >-
        A1(ii)'s declared signature (positive, monotone, within 1.5 bits of
        2 log2 m) is WITHDRAWN. It was calibrated on an m!-free reconstruction and
        fails every m!-faithful implementation (J2 OBJ-2). It is not re-tuned. The
        A1(i) structural floor reproduction and the per-row offsets against the
        committed floor table are REPORTED AS A NON-GATING DIAGNOSTIC only; A8's
        unconferred-grade ruling on that table stands.
    - id: C-6
      title: Implement the controls v1 omitted
      text: >-
        (i) C-BOUND-PROBE exactly as A3: every argmin and margin solution at no
        fewer than two materially separated d-sweep upper bounds (declared: n and
        n/2), reported per bound, bound-tracking figures labelled as such.
        (ii) The A6 table: per (degree, m), the step-4 continuous minimum, the
        best step-3 integer-s cell, and whether the former is realised by any
        step-3 cell.
        (iii) C-BASELINE-CONSISTENCY, RESTATED: the vOW column equals
        log2(0.886) + N/2 with the per-degree N declared above (so at n = 131 it is
        computed from r, 1.000 bit below 0.886 * 2^(n/2)); PUB is used only at
        n = 131; the n = 131 gap PUB - VOW is reported as computed (expected
        3.516 = log2 sqrt(131) per J4-3); A7's 4.52-bit attribution is WITHDRAWN;
        no margin mixes columns and every margin names its column.
        (iv) A4's genuine null, as written: report whether the family's verdict
        differs between store-free and store-budgeted treatments under C-1. If it
        does not, report A4's refutation branch in terms -- the oracle's unpriced
        STORE was not the asymmetry; the unpriced BUILD TIME was.
    - id: C-7
      title: Exploratory sensitivity columns (NON-GATING, never confirmatory)
      text: >-
        Reported per degree beside the v2 primary, each labelled with its source,
        each under C-1's construction charge unless stated:
        X-1 truncated-MITM relation cost with s! in place of m! (blind V4);
        X-2 K = d - 1 (negation-closed F; blind D1);
        X-3 LA = log2 m + 2d, and the same plus log2 3 (blind D2, V6);
        X-4 N = log2(4r) at n = 131 (blind V5);
        X-5 oracle VOW_GC: o = log2 7 + (m-S)d + (S-s)d/2 for s < S with memory
        2^(s d) >= 2^10 per target and no shared-table fill (J3 RC3);
        X-6 relation model PCS_BATCH: total = 2 + d + (N - w)/2 for w <= d (J3 RC3);
        X-7 Frobenius x negation orbit quotient at n = 131 and 163: K, FILL and
        store reduced by log2(2n), LA by 2 log2(2n), reported against VOW,
        VOW - log2 sqrt(2n), and (n = 131) PUB (J3 section 4; TASK-20260929-c05f6e
        DESIGN.md section 7);
        X-8 rows at n = 79 and n = 89 with N = n - 1 (cofactor 2), probe-only and
        construction-charged (J4-6).
        None of X-1 to X-8 may be read as a confirmatory outcome, enter a sub-rho
        count of the primary, or be quoted without its label.
    - id: C-8
      supersedes: A5 binding language ceiling (extends it)
      title: Language
      text: >-
        A5 stands. Added: the permitted wording for C-1 is "the oracle table's
        construction is charged as operations, one per entry; memory is reported,
        not charged". No record may describe the store-free v1 cells as costs,
        name a curve as beaten or safe, or quote a probe-only total as an attack.
    - id: C-9
      title: Degrees
      text: >-
        Ten distinct degrees: 97, 109, 131, 163, 191, 233, 239, 283, 409, 571 (163
        appears in both v1 lists once). "Eleven" in v1 text is read as ten.

  expectations_post_data:
    status: reviewer-derived, NOT preregistered predictions, NOT support for H-SEMBIN-8e7ae3
    items:
      - id: E-1
        text: >-
          Zero in-domain sub-rho cells in the primary (ENUM, MITM, MITM_CAPPED; every
          degree, every m in 2..16, every B including unlimited) against either
          column.
      - id: E-2
        text: >-
          Store-free, construction-charged minimum TOTAL minus VOW, by degree
          (97, 109, 131, 163, 191, 233, 239, 283, 409, 571): +16.54, +17.69, +19.12,
          +21.55, +23.55, +26.22, +26.55, +29.00, +35.49, +42.70 bits (J3 section 1;
          J1 S6 agrees to its stated rounding). At n = 131 the minimum is about
          2^83.44 at m 8, s 4, d about 20.55 (J1), +22.6 bits against PUB (J3).
      - id: E-3
        text: C-IMPL-GATE passes the unmutated v2 driver and fails M1, M2, M3 and M4.
      - id: E-4
        text: The generic-lower-bound flag does not fire on any primary cell.
    disagreement_rule: >-
      A v2 value differing from E-2 by more than 0.1 bit is reported per cell with
      both values and localised to one of three implementations (v2 driver, J1's
      j1_rederive.py, J3's computation). It is not resolved toward the
      expectation, and the expectation is not tuned to it.

  stopping_rules:
    - C-IMPL-GATE failure (any of C-4 (a)-(e)) -> stop; preserve the run; report; no row read.
    - Generic-lower-bound flag fires (C-3) -> stop; arithmetic defect; report.
    - C-BOUND-PROBE disagreement -> do NOT stop; downgrade the figure to bound-tracking and report per bound.
    - Timeout, crash or memory stop -> infrastructure fact, recorded as such, never negative evidence (AGENTS.md rule 5).
  invalidation_rules:
    - Any primary row read or reported after a stopping rule fired.
    - Any v1 artifact (specification.yaml, code/memory_charged_family.py, runs/RUN-SEMBIN-c68773/) modified.
    - The executor reading coordination/goals/GOAL-SEMBIN-5078bc/reviews/** before its run is complete.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    maximum_memory_gb: 2
    maximum_runs: 2
    maximum_workers: 1
    note: >-
      maximum_runs 2 permits exactly one retry after a gate failure that the
      executor attributes to its own implementation, with the failed run
      preserved as its own RUN directory. Mutant self-tests execute inside the run.

  required_artifacts:
