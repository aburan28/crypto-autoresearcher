      raw-result.json byte for byte.
  inference:
    requested_policy: executor-implementation
    canonical_policy: executor-implementation
    backend: null
    resolved_model_id: null
    resolved_model_id_note: >
      Null deliberately. No model is in the measurement loop: every number is
      produced by deterministic standard-library arithmetic. Naming a model
      would suggest otherwise.
    fallback_used: true
    fallback_reason: >
      this runtime cannot resolve the policy aliases in
      orchestration/model-policies.yaml; every alias falls back to the single
      model the session runs on. Recorded rather than silently substituted.
    independent_session: false
    independent_session_note: >
      NOT independent. The same session authored the contract, wrote the driver
      and executed it. The Coordinator that approved it is a separate subagent
      session, but no VALIDATOR or RED TEAM has read this run. The review round
      is TASK-20260928-e4f7b2 and is owed.
