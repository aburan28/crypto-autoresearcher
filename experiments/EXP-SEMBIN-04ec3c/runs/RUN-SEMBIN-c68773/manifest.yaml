  purpose: >
    Charge the decomposition oracle's MEMORY, symmetrically with the rho
    baseline, and sweep every summand count and store budget to determine
    whether any cell of the decomposition-oracle family can fall below rho on a
    binary curve of prime extension degree.
  status: completed
  stage: derivation
  code:
    commit: e56b0a215
    dirty: true
    dirty_paths:
      - '?? experiments/EXP-SEMBIN-04ec3c/runs/RUN-SEMBIN-c68773/'
    dirty_note: >
      The only untracked path at execution time was this run directory, which
      cannot exist in the commit that produces it. The driver
      memory_charged_family.py and the frozen contract were both committed at
      e56b0a215 and are unmodified, which is what reproducibility requires.
    driver: experiments/EXP-SEMBIN-04ec3c/code/memory_charged_family.py
    command: python3 .../memory_charged_family.py --out <run_dir>/raw-result.json
    command_exact_path: command.txt
    determinism: >
      Deterministic and seedless. Integer parameter sweeps in log2 space over
      formulas transcribed from the contract's cost_model block. No random value
