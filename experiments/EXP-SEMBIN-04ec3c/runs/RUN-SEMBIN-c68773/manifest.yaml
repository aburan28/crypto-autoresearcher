    controls:
      C-FLOOR-REPRO: pass
      C-FLOOR-REPRO_detail: >
        Structural gate passed: both tables strictly decreasing in m, every
        margin sign against the published rho reference agreeing, m = 3 above
        and m = 4 below. Max absolute offset 2.78 bits, growing monotonically in
        m as the amendment's declared signature requires. NOTE the offsets are
        SMALLER than the hand reconstruction that prompted amendment A1 (which
        reached 6.50 bits at m = 8), because this implementation uses the real
        129-bit subgroup order and the exact m! term where the hand version used
        n = 131 and approximations. The committed table's convention is still
        not recovered; the structural gate remains the right criterion and the
        offsets remain a diagnostic, not a pass condition.
      C-M3-ANCHOR: pass
      C-M3-ANCHOR_detail: >
        Both ENUM and MITM reproduce d-independence at m = 3 to 0.0004 bits
        across d in [10, 60], and land 0.995 bits from the MEASURED implicit
        base of 2^132.58. That is a far closer agreement with the measured
        anchor than the contract required, and it is the strongest single piece
        of evidence that the oracle exponent is right. Per amendment A8 this
        anchor is not treated as stronger for being measured, since it rests on
        records ruled external_unreviewed with grades not conferred.
      C-NULL-NO-MEMORY-CHARGE: discriminates
      C-NULL-NO-MEMORY-CHARGE_detail: >
        DECISIVE. With the store charged at zero, 720 cells fall below the
        baseline; with it charged, 14 do. The charge removes 706. So the memory
        charge is doing the work and this result is NOT merely a restatement of
        the product law. Per amendment A4 this is recorded as a bindingness
        diagnostic rather than a null object, because zero-charge collapses
        MITM_CAPPED to a strict superset and its refutation branch was
        unreachable as originally written.
      C-DEGENERATE-M: pass
      C-DEGENERATE-M_detail: >
        every degenerate cell flagged and excluded from the sub-rho counts; no
        surviving cell has a factor base of dimension below 2
      controls_reported: 4
    valid: true
    invalid_reason: null
    halted: null
    preregistered_prediction_refuted: true
    preregistered_prediction_detail: >
      P1 PARTIALLY REFUTED, and the refutation strengthens the result rather
      than weakening it. P1 claimed the ENUM total is independent of BOTH d and
      m. The d half is confirmed to 0.0014 bits. The m half is FALSE: the total
      RISES with m (130.0, 131.59, 133.59, 135.91 bits at m = 2, 3, 4, 5),
      because the m! term is not cancelled by the exponent arithmetic as the
      hand derivation assumed. So a memory-free enumeration oracle does not
      merely fail to improve with more summands, it gets monotonically worse.
      Reported against the prediction rather than around it.

      P2 CONFIRMED: the first summand count strictly below the published
      ECC2K-130 reference under a store-free MITM oracle is m = 8, exactly as
      predicted.

      P3a is a THEOREM of the cost model, not a prediction, per amendment A2 --
      its falsifier is algebraically unreachable and this run had no failure to
      detect. P3b was withdrawn pre-approval as a prediction because its
      monotonicity clause was false and contradicted P4. The reported
      minimum-store curve at n = 131 confirms the withdrawal was right: it falls
      to m = 8 and rises after.

      P4 CONFIRMED within its stated band: the minimising summand count is 8
      (predicted within {6, 8, 10}) and the minimum store is 2^106.8 (predicted
      roughly 2^108, band 95 to 125), exceeding the baseline's total work by
      42.5 bits (predicted more than 40).

      P5 CONFIRMED: no cell at a store budget of 2^80 or below falls below
      either baseline at any listed degree.

      WEIGHTING, per amendment A2: P2, P4 and P5 are model_consequence or
      sweep_selection classifications and their confirmation is NOT counted as
      support for the hypothesis. The honest summary is one searched prediction
      confirmed, three fidelity checks confirmed, and one prediction partially
      refuted.
    certificate:
      kind: none
      verified: true
      verifier: no-claim
      note: >
        Pure derivation. No discrete log is solved, no relation is claimed and
        no polynomial system is solved, so there is nothing to certify under
        docs/claims-and-verification.md.
  protocol_deviations: []
  scope:
    claim_tier: heuristic_estimate
    what_this_is: >
      Arithmetic on a cost model, sweeping the oracle store that the existing
      free-oracle floor table left free. Not a measurement, not a new
      algorithm, not an attack, and not a statement about the security of any
      curve in either direction.
    inherited_assumptions:
      - >
        HEUR-GENERIC-MSUM (unvalidated) -- m-SUM over this curve's point group
        admits no better generic time-store tradeoff than partial
        meet-in-the-middle. THIS CARRIES THE ENTIRE RESULT. A sub-generic
        m-SUM algorithm on this group voids every row above, and exhibiting one
        is the single surviving route this run points at rather than closes.
        Its one supporting datum, the measured m = 3 anchor, cannot discriminate
        it, because m = 3 is precisely the arity where meet-in-the-middle confers
        no time advantage at all.
      - HEUR-VOW-CURVE (unvalidated) for the baseline column.
      - Sparse linear algebra at |F|^2 time and m|F| memory.
    not_inherited:
      - >
        Semaev's Assumption 1. No degree bound and no Groebner cost enters any
        model here, deliberately, so this result does not share the dependency
        that every other cost table in this program carries on an assumption
        checked only at n <= 21 (EV-ICPERF-a8080e).
    what_it_does_not_touch:
      - the security of any Certicom challenge curve or any FIPS curve
      - >
        whether a sub-generic m-SUM oracle exists. This bounds the family GIVEN
        generic m-SUM and names the sub-generic oracle as the surviving route.
      - >
        prime-field curves, and Weil descent or cover attacks, which every
        listed degree being prime already blocks
  artifacts:
    command: command.txt
    environment: environment.json
    timing: timing.json
    stdout: stdout.log
    stderr: stderr.log
    raw_result: raw-result.json
    artifact_digests: artifact-digests.json
