    architecture: see environment.json
    python_version: see environment.json
    python_implementation: CPython
    sage_version: null
    groebner_engine: null
    groebner_engine_note: >
      none, and deliberately so. This contract solves no polynomial system and
      charges no Groebner cofactor. Semaev's Assumption 1 is NOT inherited and
      no degree bound enters any model, which is why this result is independent
      of the assumption every other cost table in this program rests on.
    dependencies: {}
    dependency_note: standard library only
  inputs:
    frozen_sources:
      - inputs/BAILEY-2009-541-ECC2K130/talk-35minutes_text.md
      - inputs/SAFECURVES-20260825/specs/sp800-186.txt
      - inputs/SAFECURVES-20260825/specs/sec2-v2.txt
    seed: null
    seed_note: seedless derivation; no random value is drawn
    parameters:
      degrees_certicom_binary: [97, 109, 131, 163, 191, 239]
      degrees_fips_binary: [163, 233, 283, 409, 571]
      degrees_note: >
        All prime, which is what blocks Weil descent and cover attacks on every
        listed target. The 359-bit level-2 Certicom challenge is ECCp-359, a
        PRIME-field curve, so there is no binary challenge at 359 and none is
        swept.
      m_range: [2, 16]
      d_range: [1, n]
      d_step: 0.25
      store_budgets_log2_entries: [30, 40, 50, 60, 70, 80, 90, 100]
      oracle_models: [FREE, ENUM, MITM, MITM_CAPPED]
      linear_algebra_exponent: 2.0
      subgroup_order: >
        the real 129-bit prime r for n = 131, so the yield term is not
        overstated; n elsewhere, with the cofactor choice reported rather than
        hidden because it shifts the yield by 1-2 bits and changes no sign
      field_bits: null
      field_bits_note: >
        No field is instantiated and no curve is touched. Every n is a parameter
        label in a cost formula.
