    - id: PD-3
      what: >-
        C-4 (a) "computed independently via lgamma". The three-lgamma form loses
        all IEEE-double precision once d exceeds about 40. The falling factorial
        is therefore summed via log1p and m! comes from lgamma. The pure
        three-lgamma form was cross-checked on 4950 (n,m,d) triples with
        d <= 24, max disagreement 8.3e-8 bit (gate_report.json).
    - id: PD-4
      what: >-
        C-4 (d) is a labelling rule, not a pass/fail test. Its executable pass
        criterion here is that every argmin over m at m = 16 is probed to m = 24
        and the m <= 16 re-evaluation reproduces the original argmin. That
        criterion is weak. The gate's failure power comes from (a)-(c).
    - id: PD-5
      what: >-
        Source of r. The card's inputs_note names raw-result.json for the
        frozen subgroup order at n = 131, but that file carries only rounded
        log2 columns, not r. r was read from the frozen input
        inputs/BAILEY-2009-541-ECC2K130/talk-35minutes_text.md (3 identical
        occurrences; Miller-Rabin probable-prime sanity check passed). That is
        the "frozen input" the amendment's header names.
    - id: PD-6
      what: >-
        Interpretation choices. (i) FILL = 0 is read literally as a 2^0 term in
        TOTAL. (ii) MITM_CAPPED at B = unlimited is evaluated as s = S
        (identical to MITM) and both are reported. (iii) The C-3 flag is applied
        to out-of-domain cells as well ("every cell"). (iv) Sub-rho counts are
        over in-domain (n, model, B, m, d) grid cells and also over argmin rows.
        (v) A6 step 4 solves for the continuous store x = s*d in [0, S*d]
        analytically at a d step of 0.05 (v1's step-4 convention), with the C-2
        guard. (vi) Store is reported in log2 entries only. Bits are not
        reported because the v2 model declares no entry width. (vii) v1
        controls C-M3-ANCHOR and C-DEGENERATE-M are retained under the v2 model
        as non-stopping.
    - id: PD-7
      what: >-
        Exploratory interpretations (X-block only). X-1: MITM_CAPPED law, cells
        with s >= 1. X-5: integer s in 1..S-1 with s*d >= 10, no fill term,
        m >= 4. X-6: w = d. Its argmin sits at the lower d bound (d = 1) at every
        degree and is bound-tracking. X-8: the C-2 domain guard is applied to the
        probe-only column too. That guard is why its probe-only values sit about
        0.5 bit below the construction-charged ones, not below VOW. An unguarded
        probe-only column (the reading J4-6 may have used) was NOT computed.
    - id: PD-8
      what: >-
        Card inference.fallback_allowed is false. This runtime cannot resolve the
        policy, so the single session model served it (fallback_used: true).
        Recorded, not resolved.
    - id: PD-9
      what: >-
        Pre-run development smoke test. Before the run, on 2026-10-01, run_v2.py
        was executed once with --smoke-degrees 53,61. Those are not protocol
        degrees, and the code refuses protocol degrees and 131 in that mode. No
        protocol row was computed. Its output is preserved unedited at
        pre-run-smoke-test-NOT-A-RUN/ and is not a run.
    - id: PD-10
      what: >-
        experiments/EXP-SEMBIN-04ec3c/implementation.md was not written because
        it is outside the card's write scope. Implementation notes are in this
        manifest and in the module docstrings.
