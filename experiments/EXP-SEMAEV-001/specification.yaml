experiment:
  id: EXP-SEMAEV-001
  hypothesis_id: H-SEMAEV-001
  version: 1
  title: Toy-scale S_3 decomposition Groebner cost with matched rho baseline
  status: approved
  objective: >-
    Measure the reduced Groebner basis size, max-degree proxy, and wall time of
    the S_3 length-2 decomposition system over toy prime fields (8/10/12 bits),
    at fixed factor-base size 14, with a matched Pollard-rho baseline recorded
    as context (not equated).
  inputs:
    instance_generator: harness.toycurve.generate_instance
    bits: [8, 10, 12]
    seeds: [1, 2]
  controls:
    - matched Pollard-rho baseline solve per instance (group operations)
    - trivial-ideal detection distinguishes "no decomposition" from cheap solve
  independent_variables: [field_bits]
  metrics:
    primary: [groebner_basis_max_degree_proxy, groebner_seconds]
    secondary: [groebner_basis_size, decomposition_found, rho_baseline_group_operations]
  replication:
    seeds: [1, 2]
    independent_instances: 6
  budget:
    wall_clock_seconds_per_run: 60
    total_cpu_hours: 0.1
    maximum_memory_gb: 2
    maximum_runs: 12
  stopping_rules:
    - stop a run at 60s wall clock (record as resource_exhaustion)
  invalidation_rules:
    - any claimed decomposition whose certificate fails independent verification
      is invalid_measurement
  success_criterion: >-
    All tested instances show max-degree proxy <= 6 and wall time < 1.0s with
    no super-linear growth across bits (supports H-SEMAEV-001 at toy scale).
  falsification_criterion: >-
    Any instance with max-degree proxy > 6 or wall time >= 1.0s, or clear
    super-linear time growth, weakens or rejects H-SEMAEV-001.
  required_artifacts:
    - per-run manifest, command, environment, stdout, stderr, raw-result
    - verified certificate for every claimed decomposition
  assigned_to: executor
  approved_by: coordinator
