  output_contract:
    schema_version: lattice_ic.combined.v1
    required_top_level:
    - schema_version
    - direction
    - seed
    - parameters
    - cases
    - checks
    - limitations
    - work_accounting
    - instrument_scope
    exact_numbers: Canonical integers/normalized rationals and field coefficient tuples; no floating certificates.
    case_fields:
    - id
    - panel
    - status
    - inputs
    - observables
    - certificates
    - work
    - limits
  interpretation_limits:
  - Synthetic tiny fields only; no asymptotic extrapolation, novelty or performance claim.
  - Development tests are software checks, not admitted scientific evidence.
  - Hypothesis remains proposed until specification/approval; no scientific promotion without independent review.
  - All canonical nonzero admitted G targets are used for each fixed selected fiber/bound; R=O remains DP/homogeneous/projective-oracle
    only and is explicitly inadmissible for finite-x S3.
  - The exact target-schedule clarification was written before combined study observations or approval; archived
    original protocol JSON remains unchanged.
  - Original selected fiber is fixed before height filtering and all canonical nonzero G targets are retained; O
    is explicit density/homogeneous/projective-only branch for finite-x S3.
  - W97 is a whole-field control and never described as small height or attack advantage.
  - Every route rebuilds and charges its catalog/setup; earlier observed catalogs and DP do not become free candidate
    computation.
  - Actual identity/no-chain lattice reduction is exercised even if all strict certificate/root yields are zero.
  - Vacuous zero certificate, a constant/unit ideal, or modular roots lacking rational auxiliary/subgroup/sum verification
    do not establish usable finite-root recovery.
  - All-target DP, planting and exact-box enumeration are separate paid oracles, never injected as candidate recovery/log
    rows.
  - Public-known normalized marginal rank excludes O/P/verified signed-alpha orbit constraints, never verifier G-index
    logs.
  - Factorbase/pairing observations and original polynomial infrastructure failure remain unreviewed; repaired successor
    and this combined interface were requested prospectively, not positive-result expansion.
  - Operation counts are heterogeneous vectors, inclusive times cannot be summed, zero-denominator cost-per-new-rank
    is undefined, and unpriced work bars advantage claims.
  - Original five independent mathematical/cost joints and local artifact-integrity review remain pending observations.
