experiment:
  id: EXP-IC-ab2c47
  hypothesis_id: H-IC-a8ab20
  version: 1
  title: combined exact finite-field lattice interface experiment
  status: review_required
  frozen: false
  objective: Run the complete prescribed combined finite schedule and preserve certificates, adverse controls, zero
    yields and instrument limits.
  inputs:
    prospective_protocol_path: research/lattice_ic_experiments_20261015/coordinator/prospective-protocols.json
    source_main: 7f11ebacb149fe7936ff45b6bdeff2918ad0edf9
    parameters:
      target:
      - 97
      - 0
      - 2
      auxiliary:
      - 97
      - 1
      - 0
      depths:
      - 0
      - 1
      - 2
      - 3
      coordinate_bounds:
      - 2
      - 4
      - 8
      - 16
      - 32
      - 97
      tuple_lengths:
      - 2
      - 3
      - 5
      reduction_m: 2
      reduction_t: 1
      reduction_L: 0
      selected_fibers: Every finite image fiber catalog for density/height; for actual combined lattice choose first
        admitted nonempty target base in canonical fiber order at each d, not adaptive best fiber.
      minimum_stage: At least one identity-depth or explicit window control must exercise a real lattice reduction;
        other cells may honestly yield no certified equation.
      root_boxes: For each fixed bound W, every retained original/chain x variable uses signed integers -W+1..W-1
        and weight_bound W; finite-field reductions map them back modulo97.
    protocol_panels:
    - Rebuild exact same auxiliary catalog in this run using shared exported code, charge all setup; do not treat
      previous run outputs as free computation. At each rational target/auxiliary lifted x, retain complete chain
      intermediates with centered integer representatives and pole branches.
    - For every W bound, measure actual retained M and fraction of points/chains whose every intermediate satisfies
      abs(centered x_j)<W; W97 is a whole-field baseline. Record distributions/maxima, rejected points and density
      loss. No bound nearp is called low-height.
    - All-target ordered-tuple group-sum density by DP for m2/3/5 before/after chain-height filters, actual first
      moment and coverage; for m3/5 addition tree record intermediate group x heights separately, including O branch.
      Uniform and planted cohorts separate.
    - Compose actual m2 S3 with two auxiliary chain-membership systems and terminal finite-image constraints in
      shared centered integer x variables; include every y-lift/projective exception in verification. For polynomial
      system f_i=0 modp, build shifts x^a*product(f_i^b_i)*p^(t-sum b_i), all b_i>=0,sum b_i<=t, |a|<=L. Use all
      declared equations, exact HNF/integer-row lattice, actual support/rank/bit counts and n64,D256 caps. Root
      boxes are signed abs(x)<W for intermediate/target coordinates retained by the height filter; column weights
      use W. Zero-dimensional equations and extraction must satisfy all original systems and target sum. Matched
      no-chain baseline uses exactly the same final target candidates and root boxes. At least the identity/no-chain
      panel performs actual LLL, even if no strict certificate results.
    - Demonstrate precisely whether density-preserving small intermediate coordinates coexist with certified independent
      integer equations. Larger variable boxes are charged in column weights and caps; do not multiply independent
      conditional benefits or inject oracle roots into candidate extraction.
    route_interfaces: research/lattice_ic_experiments_20261015/coordinator/route-interfaces.md
    user_intake: research/lattice_ic_experiments_20261015/intake.md
  controls:
  - d0 identity/no-chain
  - identical final base as explicit list
  - fullfield intermediate bound97
  - tiny intermediate windows causing measured density loss
  - random same-size base and coordinate relabeling
  - projective/pole kernel branch
  - positive-dimensional chain-equation controls
  independent_variables:
  - target
  - auxiliary
  - depths
  - coordinate_bounds
  - tuple_lengths
  - reduction_m
  - reduction_t
  - reduction_L
  - selected_fibers
  - minimum_stage
  metrics:
    primary:
    - height-filter retention and actual uniform target coverage
    - new variables/degrees/monomials/weighted norms
    - valid complete chain+point witness and genuinely extracted roots
    - full construction/extraction/new-rank cost or explicit zero-yield/cap
    secondary:
    - Exact case coverage and explicit adverse/inadmissible/instrument-stop counts
    - Per-phase operations,time,RSS; unpriced_work and source/manifest provenance
  scale_relevance:
    tier: toy
    justification: Synthetic explicitly enumerated finite fields and bounded integer boxes; no crypto transfer.
    correspondence: null
  replication:
    seeds:
    - 1729
    independent_instances: 0
    plan: One deterministic frozen finite schedule, seeded controls only; no independent replication asserted.
  budget:
    enforcement: advisory
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
  - Exactly one finite prescribed schedule; no adaptive target/curve/box replacement.
  - Dimension/bit caps, dependency absence or machine protection stop retain incomplete case and logs; never mathematical
    refutation.
  invalidation_rules:
  - Missing controls, mismatched source/spec/plan hashes or changed parameters.
  - Accepted invalid field/point/ring/lattice/root certificate; wrong denominator or improper affine O handling.
  - Oracle/planted truth injected into candidate solver or uncharged extraction described as candidate success.
  success_criterion: Prescribed coverage and mandatory integrity/control checks complete, with every valid negative/zero
    yield and derived instrument-stop explicit. This is trial integrity, not support or improvement.
  falsification_criterion: Small-height density collapse or missing independent certified equations is scoped adverse
    measurement. No generic impossibility, performance or crypto-scale transfer follows.
  required_artifacts:
  - raw-result.json
  - manifest.yaml
  - stdout.log
  - stderr.log
  - check.stdout.log
  - check.stderr.log
  - command.txt
  - environment.json
  - launch.json
  - execution-receipt.json
  assigned_to: executor
  approved_by: null
  execution_authorized: false
  implementation_path: tools/lattice_ic_combined.py
  candidate_argv:
  - python3
  - tools/lattice_ic_combined.py
  - --seed
  - '1729'
  - --output-dir
  - '{run_dir}'
  candidate_check_argv:
  - python3
  - tools/lattice_ic_combined.py
  - --check
  - '{run_dir}/raw-result.json'
  output_contract:
    schema_version: lattice-ic-combined/v1
    required_top_level:
    - schema_version
    - direction
    - seed
    - parameters
    - cases
    - checks
    - limitations
    - work_accounting
    - instrument_scope
    exact_numbers: Canonical integers/normalized rationals and field coefficient tuples; no floating certificates.
    case_fields:
    - id
    - panel
    - status
    - inputs
    - observables
    - certificates
    - work
    - limits
  interpretation_limits:
  - Synthetic tiny fields only; no asymptotic extrapolation, novelty or performance claim.
  - Development tests are software checks, not admitted scientific evidence.
  - Hypothesis remains proposed until specification/approval; no scientific promotion without independent review.
  approval_missing:
  - Committed implementation and complete source closure hashes
  - Bound canonical trial plan, actual executor handoff and source snapshot Git verification
  - Protocol completeness audit and prospective newest_experiments ready check; no approval before ready
  idea_ids:
  - IDEA-20261015-1e8145
  - IDEA-20261015-9defe9
  added: '2026-10-15'
  scientific_scope_sharpening: Prospectively fixed exact panel before implementation or observations.
