    - >-
      My J2 verification confirms the identification "degree drop <=> exactly
      one signed sum is O" on all 6,762 disclosed drops and on 250
      g-irreducible non-drops. It does NOT independently re-run point
      arithmetic on the 681,538 non-deviating instances; for those I verified
      the factorization pattern by independent recomputation of Q_e (all
      688,300) but ran point arithmetic on a 250-instance control only.
    - >-
      Scope is toy: p in {101, 211, 1009, 1999}, five curves, m = 4. Nothing
      here transfers to cryptographic scale, to F_{q^n}, to other m, to
      supersingular curves, or to j in {0,1728}, and nothing here is a
      relation-rate, cost, exponent or ECDLP statement of any kind. A passed
      validation means this receipt is admissible evidence; it is not an
      ECDLP claim, not a speedup, and not an authorization to promote
      anything.
    - >-
      My verdict is on J1 and J2 only. The correctness of the S_4 derivation
