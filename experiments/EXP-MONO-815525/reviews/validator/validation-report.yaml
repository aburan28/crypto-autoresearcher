  # =====================================================================
  # J1 - PROJECTIVE VS AFFINE ADJUDICATION
  # =====================================================================
  j1_projective_vs_affine_adjudication:
    verdict: holds
    verdict_meaning: >-
      The "one of the four projective roots has moved to the point at
      infinity" interpretation of c_4(e)=0 is CORRECT, and it is correct for
      a structural reason, not as a post-hoc rescue. It is not an artifact of
      the resultant-elimination construction, and it is demonstrably NOT the
      same thing as a repeated root -- the two are separated by my method,
      both occur in the wider parameter space, and only the former occurs in
      the g-irreducible regime.

    step_1_my_own_derivation:
      what_i_did: >-
        I wrote my own multivariate polynomial engine (dict of exponent
        tuples -> integer coefficient; Sylvester resultant by permutation
        expansion of the determinant) with no sympy and no reading of the
        Executor's tables, and re-derived S_3 and S_4 from the group law:
        clear lambda's denominator in x(P1+P2)=x3, eliminate y1 then y2, then
        S_4 = Res_U(S_3(x1,x2,U), S_3(x3,x4,U)).
      results:
        - "Res_{y2}(Res_{y1}(rel, f1), f2) == (x1-x2)^4 * S_3^2 : TRUE (my own check, matching the Executor's own claim)"
        - "S_3 symmetric, degree 2 in each variable"
        - "S_4: 540 terms, degree [4,4,4,4] in x1..x4"
        - "MY S_4 monomial table is IDENTICAL to implementation/s4_monomials.json (540/540 monomials, all coefficients equal)"
        - "MY S_3 monomial table is IDENTICAL to implementation/s3_monomials.json"
        - "MY own symmetric descent (classical symmetric-reduction algorithm, my code) reproduces implementation/s4_symmetric_coeffs.json EXACTLY for all five c_k, term for term"
      the_key_structural_identity: >-
        THE ANSWER TO "WHAT DOES c_4 = 0 MEAN". Write S_3(x1,x2,U) =
        a2 U^2 + a1 U + a0 with a2 = (x1-x2)^2, and S_3(x3,x4,U) =
        b2 U^2 + b1 U + b0. The Sylvester resultant of two quadratics is
        (a2 b0 - a0 b2)^2 - (a2 b1 - a1 b2)(a1 b0 - a0 b1). Extracting the
        x4^4 coefficient (b2, b1, b0 are each degree 2 in x4, with leading
        parts 1, -2x3, x3^2) gives
             (a2 x3^2 - a0)^2 + (2 a2 x3 + a1)(a1 x3^2 + 2 a0 x3)
           = (a2 x3^2 + a1 x3 + a0)^2
           = S_3(x1,x2,x3)^2.
        I verified this as an exact polynomial identity with my own engine:
        `c_4 - S_3(x1,x2,x3)^2 == 0` is TRUE over Z[A,B,x1,x2,x3]. In
        symmetric coordinates S_3 = A^2 - 2A e2 - 4B e1 + e2^2 - 4 e1 e3, so
             c_4(e) = (A^2 - 2A e2 - 4B e1 + e2^2 - 4 e1 e3)^2,
        which is the Executor's stated c_4 up to the sign inside the square.
      why_that_settles_the_interpretation: >-
        S_3 is, by construction and by its own verified defining property
        (Stage 0's pre-check, and my own 268,088-triple point-arithmetic
        check below), the polynomial whose vanishing at (x1,x2,x3) says
        exactly: there exist y_i with (x_i,y_i) on E and P_1 + P_2 + P_3 = O.
        So c_4(e) = 0 is not "a leading coefficient that happens to vanish
        for elimination-theoretic reasons"; it is LITERALLY the condition
        that one of the four sign classes sums to the identity, i.e. that the
        fourth fibre point x(eps.P) is x(O) = infinity. The geometric reading
        and the algebraic condition are the same equation. This is the
        strongest form the identification could take, and it is independent
        of how the elimination was carried out.
      subtlety_i_checked_rather_than_assumed: >-
        c_4 is a PERFECT SQUARE, so the leading coefficient vanishes to order
        2 along the divisor {S_3 = 0}. That is a statement about the vanishing
        order of a function on the BASE, and it does NOT imply that T=infinity
        is a double root of the FIBRE. The multiplicity of infinity in the
        fibre over a specific e is 4 - deg_T Q_e, which is 1 exactly when
        c_3(e) != 0. I checked c_3(e) != 0 in all 6,762 disclosed
        degree-drop instances (6762/6762), so the root at infinity is simple
        in every one of them. Conflating the two would have been the natural
        error here and it does not occur.

    step_2_repeated_root_is_a_different_and_separable_event:
      statement: >-
        A root at infinity and a repeated root are different phenomena with
        different signatures, and the review plan's proves_too_much object
        demands that my method distinguish them rather than absorb both.
        Root-at-infinity: leading coefficient vanishes, remainder stays
        squarefree. Repeated root: discriminant vanishes / gcd(Q,Q') has
        positive degree, independently of the leading coefficient. They can
        co-occur.
      independent_recomputation_of_all_6762:
        method: >-
          For every one of the 6,762 disclosed degree-drop instances I rebuilt
          F_{p^3} = F_p[X]/(g) myself, set x1 = X, x2 = x1^p, x3 = x1^{p^2},
          evaluated MY OWN S_4 table with x4 = T symbolic, checked F_p
          rationality, and factored with MY OWN factorization code (explicit
          root stripping with multiplicity + squarefree test + distinct-degree
          for the root-free part). Nothing from run_census.py was imported.
        results:
          Qe_matches_the_recorded_coefficients: 6762 / 6762
          g_irreducible_confirmed_independently: 6762 / 6762
          Qe_lands_in_Fp: 6762 / 6762
          c4_equals_zero: 6762 / 6762
          c3_nonzero_so_exactly_one_simple_root_at_infinity: 6762 / 6762
          S3_of_e_equals_zero: 6762 / 6762
          degree_in_T_equals_3: 6762 / 6762
          SQUAREFREE: 6762 / 6762
          discriminant_of_the_cubic_nonzero: 6762 / 6762
          IRREDUCIBLE_CUBIC_shape_exactly_[3]: 6762 / 6762
          non_squarefree_or_repeated_root_cases_found: 0
        answer_to_the_direct_question: >-
          ALL 6,762 are squarefree irreducible cubics. NOT ONE non-squarefree
          / repeated-root case exists among them.
      full_independent_replication_of_both_exhaustive_sweeps:
        method: >-
          Using my own symmetric coefficients and my own factorization, I
          re-ran the complete exhaustive F_101^3 sweeps for C1 (A=2,B=3) and
          C5 (A=37,B=29) -- all 1,030,301 triples each -- and additionally
          recorded squarefreeness for every g-irreducible instance, which the
          pattern alone would only imply indirectly.
        C1: {g_irreducible: 343400, degree_drops: 3378, patterns: {"deg4:1+3": 340022, "deg3:3": 3378}, non_squarefree_Qe: 0, unexpected: 0, wall_seconds: 15.8}
        C5: {g_irreducible: 343400, degree_drops: 3378, patterns: {"deg4:1+3": 340022, "deg3:3": 3378}, non_squarefree_Qe: 0, unexpected: 0, wall_seconds: 14.6}
        conclusion: >-
          Exact reproduction of the Executor's counts, and ZERO repeated-root
          instances anywhere in the g-irreducible locus at p=101 on either
          curve. Combined with the 1500 sampled instances (all independently
          recomputed and all matching, including 6 drops at p in
          {101, 1009}), the entire 688,300-instance census is independently
          replicated.
      the_discrimination_control_the_review_plan_demanded:
        why: >-
          A criterion that never fires is not discriminating. I scanned ALL of
          F_101^3 for both curves WITHOUT the g-irreducibility filter, so that
          repeated-root events could actually appear, and classified every
          triple by (g irreducible?, deg Q_e, squarefree?).
        C1_and_C5_identical_counts:
          g_irr_deg4_squarefree: 340022
          g_irr_deg3_squarefree: 3378
          g_irr_REPEATED_ROOT: 0
          g_red_deg4_squarefree: 650272
          g_red_deg4_REPEATED_ROOT: 29806
          g_red_deg3_squarefree: 6528
          g_red_deg3_REPEATED_ROOT: 194
          g_red_deg2_REPEATED_ROOT: 100
          g_red_deg0: 1
        what_this_proves: >-
          The criterion fires on 30,100 genuine repeated-root instances per
          curve, INCLUDING 194 instances that have a degree drop AND a
          repeated root simultaneously (deg 3, non-squarefree, factor shape
          [1,1,1] rather than [3]) and 100 with two roots at infinity plus a
          collision. So the method sees the exact combination the
          proves_too_much object worries about, and reports it as such. It
          reports ZERO of them inside the g-irreducible locus. The
          proves_too_much object is discharged: my J1 reasoning would NOT have
          said "just a point at infinity, nothing to see" for a genuine
          multiplicity collapse -- it would have shown a factor shape other
          than [3], which is exactly what the census would have reported as a
          different pattern.
      direct_point_arithmetic_version_of_the_same_discrimination:
        method: >-
          On the split-g locus, where both phenomena occur and everything is
          F_p-rational, I enumerated 134,044 triples of distinct-x points of
          E(F_p) per curve, computed the four signed sums by ordinary point
          addition, and compared (number of classes summing to O) against
          (4 - deg Q_e) and (number of x-collisions among the finite sums)
          against (Q_e non-squarefree).
        result: >-
          268,088 triples across C1 and C5, ZERO mismatches on all three
          predicates (degree law, squarefreeness law, and monic Q_e ==
          prod(T - x_eps) over the finite classes). The observed joint
          distribution per curve is: (0 at inf, 0 collisions, deg4, squarefree)
          116032; (0,1,deg4,REPEATED) 8104; (0,2,deg4,REPEATED) 4232;
          (1,0,deg3,squarefree) 5408; (1,1,deg3,REPEATED) 176;
          (2,1,deg2,REPEATED) 92. All six cells behave exactly as the
          separation predicts. This is a 996x larger version of the
          Executor's own Stage-0 check (a2)/(b), which used 269 probes.

    step_3_what_the_prediction_was_actually_about:
      finding: >-
        IDEA-20260904-ad63fe's mechanism (C3) does not state its prediction on
        the affine polynomial at all. It states it on V := F_2^3/<(1,1,1)>,
        the four SIGN CLASSES, with R_u = x(eps_1 P_1 + eps_2 P_2 + eps_3 P_3),
        and derives that Frobenius acts on V by the affine map
        v |-> pi(v) + pi(sigma). (C3)(c)'s claim is "the linear part has order
        3, which has a unique fixed point on V, so type 3+1 ALWAYS". I checked
        that group-theoretic step myself: an order-3 element of GL_2(F_2) has
        no nonzero fixed vector, so pi - 1 is bijective on V, so v |-> pi(v)+c
        has exactly one fixed point for every c, and the remaining three form
        a single 3-cycle. The claim is correct.
      consequence_for_the_adjudication: >-
        The prediction is a statement about Frobenius's cycle type on the four
        sign classes. The map V -> P^1, u |-> x(R_u), sends the class that
        sums to O to x(O) = infinity, which is an F_p-rational point of P^1 and
        is the image of the F_p-rational point O of E. Counting it is therefore
        the faithful transcription of the mechanism, and NOT counting it is
        what loses a point that the mechanism explicitly has. The affine
        reading is the underspecified one, exactly as the Coordinator's
        recorded prior supposed.
      the_sharpest_confirmation: >-
        A prediction that follows: if the class summing to O were one of the
        three in the Frobenius 3-cycle, then all three of its orbit would sum
        to O as well (Frobenius commutes with the group law and fixes O), and
        deg Q_e would be 1, not 3. So the class at infinity MUST be the
        Frobenius-FIXED class -- precisely the class that would otherwise have
        contributed the F_p-rational linear factor. That predicts, without any
        further freedom, that a degree drop removes the LINEAR factor and
        leaves exactly the conjugate triple, i.e. an irreducible cubic. That
        is what all 6,762 show, and J2 below verifies the fixed-class
        identification directly by point arithmetic in every one of them. This
        is a non-trivial, falsifiable consequence of the projective reading
        that the affine reading does not make, and it holds 6762/6762.
      admissibility_boundary_i_found:
        finding: >-
          The projective reading is not vacuous and can fail. With g monic
          irreducible, Res(g,f) = 0 forces g = f (both monic cubic), so the
          three x_i are the three roots of f and P_1,P_2,P_3 are the three
          nontrivial 2-torsion points over F_{p^3}; they sum to O and every
          sign flip is trivial, so ALL FOUR classes sum to O, deg Q_e = 0, and
          the projective pattern is 1+1+1+1, not 1+3.
        verified_instance: >-
          C3, p=211, A=3, B=11, e=(0,3,200). f = X^3+3X+11 IS irreducible over
          F_211. I computed Q_e = [1,0,0,0,0] (the constant 1, degree 0) and
          verified by direct F_{p^3} point arithmetic that all four signed
          sums are O and the degree law 4 - deg = 4 still holds exactly.
        why_it_did_not_appear_in_the_census: >-
          f is REDUCIBLE over F_p for C1, C2, C4 and C5, so the locus is empty
          on the two exhaustively swept curves; on C3, where it is non-empty,
          only 300 random draws out of 211^3 were made and the single
          offending triple was not hit (I confirmed it is absent from the 300
          recorded C3 instances). My own p=101 full scans found the analogous
          triple e=(0,A,-B) in the g-REDUCIBLE bucket, exactly once per curve.
        what_should_be_recorded: >-
          IDEA-20260904-ad63fe's (C3) states its recipe "on any admissible base
          point (g separable, Res(g,f) != 0, Q_e squarefree)". The
          experiment's selection rule is only "g irreducible" and does not
          implement the Res(g,f) != 0 clause. The census is therefore over a
          set marginally LARGER than the prediction's declared domain. It made
          no difference to the observed result, but the honest statement of
          the result is "for every admissible g-irreducible base point
          tested", and a future exhaustive sweep on a curve with f irreducible
          must apply the admissibility filter or it will record a spurious
          projective deviation.

  # =====================================================================
  # J2 - DIRECT VERIFICATION IN THE G-IRREDUCIBLE REGIME
  # =====================================================================
  j2_direct_verification_in_the_irreducible_g_regime:
    verdict: holds
    this_closes_the_executors_disclosed_gap: true

    implementation_i_wrote:
      field_tower: >-
        K = F_p[X]/(g) with g the instance's OWN residual cubic (irreducible by
        selection), elements as 3-vectors over F_p, reduction by
        X^3 = e1 X^2 - e2 X + e3; inverse by a^(p^3 - 2); square roots by
        Tonelli-Shanks over K. L = K[Y]/(Y^2 - n) = F_{p^6} with n a K-non-square
        found by rejection, elements as pairs (a,b) meaning a + bY,
        (a+bY)^-1 = (a - bY)/(a^2 - n b^2).
      why_F_p6_is_needed_and_sufficient: >-
        f(x1) need not be a square in K. Every element of K* IS a square in
        F_{p^6}, since a^((p^6-1)/2) = (a^(p^3-1))^((p^3+1)/2) = 1 for a in K*
        with p odd. So the y-lift always exists in L: if f(x1) is a K-square,
        take its K-root; otherwise write f(x1) = n * d^2 and take y1 = d*Y. I
        used both branches and both occur in the data.
      the_three_points: >-
        x1 = X (a root of g by construction), P1 = (x1, y1),
        P2 = (x1^p, y1^p), P3 = (x1^{p^2}, y1^{p^2}), the exponentiations done
        in L. No root-finding and no separate conjugation logic: the three
        x-coordinates ARE the Frobenius orbit of the generator. Every point was
        checked to satisfy y^2 = x^3 + Ax + B in L, and every x_i was checked to
        be a root of g.
      point_addition: >-
        Short-Weierstrass chord-and-tangent over L, with the point at infinity
        represented as None, Q = -P detected as x1 == x2 and y1 + y2 == 0, and
        doubling handled separately. Signed sums computed for
        eps in {(+,+,+), (+,+,-), (+,-,+), (+,-,-)} with eps_1 fixed to +1,
        matching this program's own sign-class convention. Every finite sum was
        re-checked to lie on the curve.
      independence: >-
        No function, table or constant from implementation/run_census.py is
        imported or transcribed. The only cross-reference to the Executor's
        work is the comparison step, which uses MY OWN S_4 table (itself
        independently derived) to build Q_e and then compares to the recorded
        coefficients.

    coverage: >-
      ALL 6,762 disclosed degree-drop instances were verified by point
      arithmetic, not a sample of 5. That is the 6 sampled-arm deviations
      (curves C1 x4, C2 at p=1009 x1, C5 x1) plus all 3,378 from each of the
      two exhaustive sweeps. Total wall time 16 s.

    results_over_all_6762:
      EXACTLY_ONE_signed_sum_equals_O: 6762 / 6762
      number_of_classes_at_infinity_distribution: {1: 6762}
      deg_drop_equals_number_of_classes_at_infinity: 6762 / 6762
      degree_in_T_of_Qe: {3: 6762}
      class_at_infinity_is_the_FROBENIUS_FIXED_class: 6762 / 6762
      P2_and_P3_verified_on_the_curve: 6762 / 6762
      x_coordinates_distinct_and_all_roots_of_g: 6762 / 6762
      every_finite_signed_sum_is_a_root_of_Qe: 6762 / 6762
      monic_Qe_equals_prod_over_the_three_finite_classes: 6762 / 6762
      finite_sums_with_an_Fp_rational_x_coordinate: {0: 6762}
      c4_equals_S3_of_e_squared: 6762 / 6762
      failures: 0
    frobenius_fixed_class_detail: >-
      In 26/50 of a first sample and consistently across all 6,762, the class
      at infinity is (+,+,+) exactly when f(x1) is a square in F_{p^3}
      (equivalently phi^3(P1) = +P1), and (+,-,+) exactly when it is not
      (phi^3(P1) = -P1). Those are precisely the two Frobenius-fixed classes
      predicted by the affine action v |-> pi(v) + pi(sigma) in the two cases:
      (eps1,eps2,eps3) |-> (eps3,eps1,eps2) fixes (+,+,+), and
      (eps1,eps2,eps3) |-> (-eps3,eps1,eps2) fixes (+,-,+) modulo global sign.
      Predicted class == observed class in 6762/6762.

    direct_cycle_type_measurement:
      why: >-
        The factorization pattern is a proxy for the cycle type. I also
        measured the cycle type DIRECTLY: apply x |-> x^p to the four fibre
        points (with infinity fixed) and read off the permutation, with no
        polynomial factorization anywhere in the path.
      degree_drop_instances_300_sampled_from_the_6762:
        cycle_type: {"(1,3)": 300}
        four_fibre_points_distinct_with_infinity_counted_as_one: 300 / 300
      non_drop_g_irreducible_controls_200_40_per_curve_all_five_curves:
        cycle_type: {"(1,3)": 200}
        four_fibre_points_distinct: 200 / 200
      reading: >-
        The predicted (1,3) cycle type is confirmed on the object the
        mechanism is actually about, in both the drop and the non-drop
        regime, without going through Q_e's factorization at all.

  # =====================================================================
  # CONTROLS
  # =====================================================================
  control_checks:
    - control: positive control, g-irreducible with NO degree drop
      spec_reference: "the complement of the deviating class; the regime where the prediction is uncontroversial"
      method: "50 instances, 10 per curve on all five curves (p in {101,211,1009,1999}), full F_p^6 point arithmetic"
      result: pass
      detail: >-
        n_classes_at_infinity = 0 in all 50; deg Q_e = 4 in all 50; every one
        of the four signed sums is finite and is a root of Q_e; monic Q_e ==
        prod over all four classes in all 50; EXACTLY ONE of the four has an
        F_p-rational x-coordinate in all 50, which is the linear factor, so
        the remaining three are a conjugate triple and the shape is 1+3.
    - control: negative / discrimination control, repeated roots
      spec_reference: "review_plan.proves_too_much.failure_signature"
      method: "full F_101^3 scans without the g-irreducibility filter, both curves; plus 268,088 split-g point-arithmetic triples"
      result: pass
      detail: >-
        30,100 genuine repeated-root instances per curve exist in the wider
        parameter space and are correctly separated from degree drops,
        including 194 per curve that exhibit BOTH at once. Zero occur inside
        the g-irreducible locus. The criterion is therefore discriminating,
        not vacuous.
    - control: Executor's Stage-0 check (a2) degree law, independently rerun at scale
      spec_reference: "execution_report stage_0.checks.check_a2_specialised_degree_law (269 probes)"
      result: pass
      detail: >-
        Reproduced at 268,088 split-g triples (996x the Executor's probe
        count) with 0 mismatches, plus 6,762 g-irreducible drops, 250
        g-irreducible non-drops and the C3 four-at-infinity boundary point.
        deg_T Q_e = 4 - #(classes summing to O) holds everywhere I tested.
    - control: Executor's Stage-0 check (b) split-g baseline
      spec_reference: "execution_report stage_0.checks.check_b_split_g_baseline (269 probes)"
      result: pass
      detail: >-
        monic Q_e == prod(T - x(eps.P)) over the finite classes, verified on
        the same 268,088 split-g triples with 0 mismatches, and on every
        g-irreducible instance I ran point arithmetic for.
    - control: construction cross-check against the derived tables
      result: pass
      detail: >-
        My independently derived S_4 (540 terms), S_3, and all five symmetric
        coefficients c_0..c_4 are IDENTICAL to the Executor's committed tables.
        This is a genuine independent reproduction of Stage 0's derivation, not
        a re-execution of their code.

