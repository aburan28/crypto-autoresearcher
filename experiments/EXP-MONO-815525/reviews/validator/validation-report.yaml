  # =====================================================================
  # OBSERVATIONS OUTSIDE MY JOINTS
  # =====================================================================
  observations_outside_my_joints:
    note: >-
      Recorded because they surfaced inside my own J1 derivation and would be
      dishonest to omit, NOT adjudicated here. J4-INTERPRETATION-AND-SCOPE-CHECK
      is the red team's joint and owns them.
    items:
    - id: OBS-1
      observation: >-
        The (1,3) outcome in the g-irreducible case follows from (i) the
        monodromy containing the translation group V = (Z/2)^2 -- already
        established at the ORDERED base by H-MONO-45183a -- plus (ii)
        Frobenius's linear part being the order-3 element supplied by g's own
        Galois group, plus (iii) the four fibre points being distinct. It does
        NOT require the monodromy to be full S_4. A_4 = V semidirect C_3 makes
        exactly the same (1,3) prediction for g irreducible; so does any group
        containing V whose Frobenius linear part has order 3. The diagnostic
        this experiment ran therefore cannot separate S_4 from A_4. By
        IDEA-20260904-ad63fe's own ladder, the arm that CAN is (C3)(b) --
        g = (linear)(irreducible quadratic) with chi_p(Res(q,f)) = -1
        predicting a 4-cycle, and 4-cycles are the odd permutations that
        distinguish S_4 from A_4. That arm was deliberately not run here. The
        near-exhaustive sample size (688,300) is a strong confirmation of a
        prediction that is weakly discriminating between the candidate groups,
        which is a different thing from strong evidence for full S_4.
    - id: OBS-2
      observation: >-
        Two of the five curves are the same prime p=101 with the same trace
        t=6, and they returned bitwise-identical five-class counts. Under
        IDEA-20260904-ad63fe's own (C4) that is the PREDICTED behaviour for a
        matched-(t,Z) pair, so C1 vs C5 is not two independent samples of
        "curve structure" -- it is one (t,Z) class sampled twice. The
        exhaustive evidence is thus exhaustive over base points but narrow
        over curves. J3 owns the fairness question.

  # =====================================================================
  # LIMITATIONS
  # =====================================================================
  limitations:
    - >-
      REVISION BINDING NOT VERIFIED. I verified all 7 declared sha256 values
      against the files on disk, but I was instructed not to run git in this
