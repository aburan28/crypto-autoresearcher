      note: "6762/688300 = 0.00982420... ; the reported 0.009824 is correct to the digits given."
    - metric: M1 projective reading
      reported: true
      my_recomputation: "true for all 688,300 instances actually tested"
      agree: true
      caveat: >-
        True as measured. NOT true as a general statement about the
        g-irreducible locus: see the C3 e=(0,3,200) boundary point, where the
        projective pattern is 1+1+1+1. That point is inadmissible under the
        prediction's own Res(g,f) != 0 clause but is inside the experiment's
        own selection rule.
    - metric: M2 distributions
      reported: {sampled: {"deg4:1+3": 1494, "deg3:3": 6}, exhaustive_C1: {"deg4:1+3": 340022, "deg3:3": 3378}, exhaustive_C5: {"deg4:1+3": 340022, "deg3:3": 3378}}
      my_recomputation: {sampled: {"deg4:1+3": 1494, "deg3:3": 6}, exhaustive_C1: {"deg4:1+3": 340022, "deg3:3": 3378}, exhaustive_C5: {"deg4:1+3": 340022, "deg3:3": 3378}}
      agree: true
      method: "1500 sampled instances recomputed from their recorded (p,A,B,e); both exhaustive sweeps re-run in full with my own code"
    - metric: M3 Stage-0 checks
      reported: all pass
      my_recomputation: >-
        Symbolic parts independently re-derived and identical; the two
        numeric parts re-run at 996x the probe count with zero mismatches.
      agree: true
    - metric: g_irreducible_count per exhaustive sweep
      reported: 343400
      my_recomputation: 343400
      agree: true
      note: "= (101^3 - 101)/3, the exact number of monic irreducible cubics over F_101"
    - metric: "Executor's unexpected observation: at e1=0 every deviating triple has e2 = A"
      my_check: >-
        Confirmed analytically: S_3(e)|_{e1=0} = A^2 - 2A e2 + e2^2 = (e2-A)^2,
        so S_3(e) = 0 at e1 = 0 iff e2 = A exactly. The observation is a
        theorem, not a coincidence.
    - metric: "Executor's unexpected observation: C1 and C5 return identical counts 340022/3378"
      my_check: >-
        Independently reproduced (identical counts from my own code on both
        curves), so it is not a bug in their loop. I did not investigate the
        cause; the count of e with S_3(e)=0 and g irreducible being
        curve-independent at p=101 is consistent with IDEA-20260904-ad63fe's
        (C4) claim that these counts depend only on (p,t,Z), and C1 and C5 have
        the same p=101 and t=6. Flagged for J3/J4 rather than resolved here.

  # =====================================================================
  # HEURISTIC-VALIDATION AND COST-MODEL CHECKS
  # =====================================================================
  heuristic_validation_checks:
    - check: pre-registered prediction
      result: pass
      detail: >-
        The prediction is frozen verbatim in specification.yaml
        (preregistered_prediction: "TRUE for every tested instance") with its
        source named as IDEA-20260904-ad63fe (C3)(c), and the execution report
