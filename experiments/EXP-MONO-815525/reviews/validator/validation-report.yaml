      c_4 is not an artifact of resultant elimination: as a polynomial
      identity over Z[A,B,x1,x2,x3] the leading T-coefficient of S_4 is
      EXACTLY S_3(x1,x2,x3)^2, so c_4(e)=0 is, by the defining property of
      the third Semaev polynomial, precisely the statement "some signed sum
      eps_1 P_1 + eps_2 P_2 + eps_3 P_3 equals O" -- the root-at-infinity
      condition itself, not a proxy for it. Direct F_{p^6} point arithmetic
      confirms it in the g-irreducible regime for ALL 6,762 disclosed
      degree-drop instances (not a sample): exactly one of the four signed
      sums is the point at infinity in every one, the missing class is
      always the Frobenius-FIXED class, and the surviving three are always a
      genuine conjugate triple. No repeated-root case exists anywhere in the
      g-irreducible locus, verified exhaustively over all of F_101^3 on both
      swept curves.
    caveat_that_matters_most: >-
      The projective reading is correct but is NOT a universal escape hatch,
      and the census as run is very slightly wider than the prediction's own
      stated domain. There exists a g-irreducible base point on tested curve
      C3 (p=211, e=(0,3,200), i.e. g == f) at which ALL FOUR sign classes sum
      to O, Q_e is the nonzero constant 1, and the PROJECTIVE pattern is
      1+1+1+1, not 1+3. IDEA-20260904-ad63fe's own (C3) admissibility clause
