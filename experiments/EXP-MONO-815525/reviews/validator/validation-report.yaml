  # METRIC RECOMPUTATIONS
  # =====================================================================
  metric_recomputations:
    - metric: M1 literal affine reading
      reported: false
      reported_counts: {matching: 681538, deviating: 6762, rate: 0.009824}
      my_recomputation: {matching: 681538, deviating: 6762, rate: 0.0098242}
