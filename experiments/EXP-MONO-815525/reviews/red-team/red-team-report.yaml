  reviewed_snapshot_commit: null
  snapshot_integrity: >-
    NOT INDEPENDENTLY VERIFIED, AND THE REASON IS RECORDED RATHER THAN GLOSSED.
    The dispatching session instructed this reviewer to run NO git commands
    (shared working directory, many concurrent sessions) and to read files by
