  protocol_deviations:
    - >-
      Stage 0 check (a) was operationalised before any Stage-1 result was
      observed, and in two parts rather than one, because the specification's
      literal wording ("it must be degree 4 in T") is ambiguous between the
      polynomial S_4 and its specialisation Q_e at a particular (e1,e2,e3).
      Part (a1) is the symbolic statement deg_T S_4 = 4, checked in
      derive_s4.py: PASS. Part (a2) is the specialisation law
      deg_T Q_e = 4 - #(sign classes summing to O), checked on all 269
      split-g probes: PASS, 0 mismatches, of which 4 probes had a sign class
      at infinity. Had (a) been read as "deg_T Q_e = 4 always", it would have
      failed on those 4 probes -- a fact about the specialisation, not a
      construction defect. Timeline: this split was made and the code fixed
      during a smoke test in which Stage 1 never executed (Stage 0 aborted
      the smoke run); the first Stage-1 numbers were produced afterwards.
    - >-
      Five curves at four primes were used, exceeding the specified minimum
      of two curves at two primes. C5 was added solely so that the exhaustive
      p=101 sweep could be replicated on a second curve.
    - >-
      Two census arms were run, both reported in full: a seeded random-sample
      arm (300 g-irreducible base points per curve on all five curves) and an
      exhaustive lexicographic arm over all 101^3 = 1,030,301 triples
      (e1,e2,e3) in F_101^3 for C1 and C5. The exhaustive arm completed; no
      time cap was hit.
    - >-
      No git command was run and no commit sha is recorded, per the
      dispatching Coordinator's explicit instruction for this shared working
      directory. See `code.commit_note`.
    - >-
      run_census.py was re-run once after adding resource/CPU instrumentation
      (resource.getrusage) to its final report block. The instrumentation
      touches no mathematics; the recorded stdout.log, stderr.log and
      raw-result.json are all from the single final, instrumented execution,
      and the deterministic and seeded results were unchanged between the two
      executions.

  anomalies:
    - >-
      0.98% of g-irreducible base points (6756 of 686800 exhaustively, 6 of
      1500 sampled) have a vanishing leading coefficient
      c_4 = (-A^2 + 2A e2 + 4B e1 + 4 e1 e3 - e2^2)^2, so Q_e has degree 3 in
      T and factors as a single irreducible cubic. This is reported both
      ways: it is a literal deviation from the pre-registered "one linear
      factor and one irreducible cubic factor", and it is NOT a deviation
      once the root at T = infinity is counted (all 4 fibre points are then
      accounted for as 1 rational + 3 conjugate). Adjudicating which reading
      the prediction intended is a Reviewer/Coordinator judgement, not the
      Executor's.
    - >-
      The exhaustive sweeps on C1 (A=2,B=3) and C5 (A=37,B=29) returned
      byte-identical pattern counts (340022 / 3378) on different base-point
      sets. Recorded as observed. The g-irreducible total 343400 equals
      (101^3 - 101)/3 exactly, as it must.
