experiment:
  id: EXP-MONO-815525
  version: 1
  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-09-04'
  hypothesis_id: H-MONO-5b6617
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  coordinator_approval_rationale: >-
    APPROVED. This is the single cheapest, most targeted diagnostic for
    the m=4 symmetric-base monodromy question, named independently and
    convergently by (a) IDEA-20260904-ad63fe's own (C3)(c) prediction and
    (b) H-MONO-93bc4d's Red Team review's own recommended next check.
    Scoped deliberately narrower than IDEA-20260904-ad63fe's own full
    four-arm Stage 1 (which remains a separate, larger, not-yet-approved
    undertaking) to get a fast, falsifiable read on the single highest-
    value question first: does the g-irreducible case force cycle type
    3+1, as full S_4 monodromy requires?

  title: >-
    Does the m=4 symmetric-base Semaev cover force cycle type (linear,
    irreducible-cubic) whenever the residual base cubic g is irreducible,
    as full S_4 monodromy requires?

  what_this_is_not:
    - Not a discrete-logarithm computation, not an ECDLP attack, not relation collection.
    - Not an ECDLP cost, runtime, exponent, or cryptographic-scale claim.
    - >-
      Not IDEA-20260904-ad63fe's own full four-arm calibration ladder or
      exact matched-(t,Z) integer test -- those remain separate, larger,
      not-yet-approved work.
    - Not a claim about m != 4.
    - >-
      Not, by itself, a change to IDEA-20260904-ad63fe's own status --
      that record's own broader claim is addressed by this experiment's
      own result only insofar as this specific diagnostic bears on it.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: whether, on the specific curves and base points tested,
      every g-irreducible instance produces cycle type (linear,
      irreducible-cubic) in Q_e(T)'s own factorization over F_p, or
      whether a counterexample exists. A pass is consistent with full S_4
      monodromy at m=4 but does not independently prove it (other,
      untested diagnostics could still fail); a single confirmed failure
      is a complete falsification of the full-S_4 claim at m=4.
    what_no_outcome_can_support: >-
      No outcome supports any relation-rate, cost, exponent, or
      cryptographic-scale claim. No outcome resolves m != 4. No outcome by
      itself closes KN-OPEN-009 (whose relation-rate half is untouched).

  inputs:
    construction_required: >-
      The explicit m=4 Semaev summation polynomial descended to symmetric
      coordinates, Q_e(T) = S_4^sym(e1,e2,e3,T), MUST be derived from the
      curve's own group law via resultant elimination (extending the
      method already used and verified this session for S_3: eliminate
      y1,y2,y3 successively from the relation encoding P1+P2+P3+P4=O, then
      symmetrize in x1,x2,x3 or work directly with elementary symmetric
      functions). This derivation is itself part of the deliverable and
      must be shown, not assumed or copied from any external, unread
      source, per this lane's own citation discipline.
    domain: EXP-MONO-815525/v1
    curves: >-
      At least 2 independent ordinary curves, j not in {0,1728}, at 2
      independent toy primes p in [101, 2000].
    base_point_construction: >-
      For each curve, repeatedly draw random (e1,e2,e3) in F_p^3 (or
      equivalently a random monic cubic g(X)=X^3-e1X^2+e2X-e3), check
      whether g is irreducible over F_p (no rational root: check via
      trial evaluation over all of F_p, or via gcd(X^p-X, g) = 1), and
      keep only irreducible instances -- this is a SELECTION on the base
      point, explicitly disclosed as such (not a rejection of a curve or
      an infrastructure failure).
    sample_size: >-
      At least 50 g-irreducible base points per curve (100+ total across
      the 2 curves), or exhaustive enumeration over F_p^3 if p is small
      enough to make that cheaper than random sampling (the Coordinator's
      own D-5 and H-MONO-93bc4d witness-search precedents both favor
      exhaustive/deterministic search over random sampling wherever
      affordable at this scale).

  stage_order:
    stage_0:
      name: derive and verify Q_e(T)
      compute: minutes
      description: >-
        Derive the explicit polynomial Q_e(T) via resultant elimination.
        Verify it against known facts before use: (a) it must be degree 4
        in T; (b) evaluating it at a base point where g SPLITS COMPLETELY
        (three rational roots) must reproduce the ALREADY-ESTABLISHED
        ordered-base result (H-MONO-93bc4d's own now-discharged HEUR-KUM-2:
        the four roots correspond to the (Z/2)^2 sign-class structure,
        distinct whenever no signed subset sum of the three actual points
        is 2-torsion); (c) it must be symmetric under permuting e1,e2,e3's
        own underlying roots (a sanity check reusable from this session's
        own S_3 verification method). A construction that fails any of
        these checks is reported as a construction defect, not evidence
        about monodromy.
    stage_1:
      name: g-irreducible cycle-type census
      compute: seconds to minutes
      description: >-
        For each qualifying base point (g irreducible over F_p), construct
        the three roots of g in F_{p^3}, evaluate Q_e(T) at that point
        (the result must land in F_p[T] since Q_e is symmetric and the
        root triple is Galois-stable -- verify this explicitly, it is
        itself a check on the construction), and factor the resulting
        quartic over F_p using squarefree/distinct-degree factorization
        (no CAS required: gcd(T^p - T, Q) and repeated-squaring modular
        exponentiation suffice, matching this session's own established
        toy-scale polynomial-factorization method). Record the exact
        factorization-degree pattern for every tested instance.
    stage_2:
      name: report and compare against the two-sided prediction
      compute: seconds
      description: >-
        Report the full distribution of observed factorization patterns
        among g-irreducible base points. Compare against the sole
        prediction under test: cycle type EXACTLY (1,3) (one linear
        factor, one irreducible cubic factor) for every instance. Report
        any deviation prominently and precisely (curve, base point,
        observed pattern) -- a single deviation is the headline result,
        not an average or a rate.

  metrics:
    primary:
      - "M1: for each g-irreducible base point tested, does Q_e(T) factor as exactly (linear)(irreducible cubic)? (per-instance boolean, zero-tolerance)"
    secondary:
      - "M2: the full observed distribution of factorization-degree patterns among g-irreducible base points, for descriptive context."
      - "M3: Stage 0's own construction-verification checks (degree, ordered-base baseline reproduction, symmetry), each reported pass/fail."

  preregistered_prediction:
    - quantity: M1
      value: "TRUE for every tested instance, under the full-S_4 monodromy hypothesis."
      formula: "IDEA-20260904-ad63fe's own (C3)(c): g irreducible => Frobenius linear part has order 3 => unique fixed point on V => type 3+1 always."
      source: IDEA-20260904-ad63fe mechanism (C3).

  replication:
    planned_runs: 1
    seeds: [20260904002]
    interpretation: >-
      Deterministic once the curves and search order are fixed; the base
      points searched are recorded exactly, and results are exactly
      reproducible from the recorded curves and search order.

  budget:
    maximum_runs: 1
    maximum_wall_seconds: 600
    maximum_cpu_seconds: 600
    maximum_peak_rss_bytes: 134217728
    maximum_total_disk_bytes: 10485760
    maximum_workers: 1
    no_network: true

  environment_preconditions:
    consequence: NO CAS AND NO SOLVER IS REQUIRED. Pure Python (with sympy permitted for the one-time symbolic derivation of Q_e(T) in Stage 0, if available; a from-scratch resultant implementation is an acceptable and even preferred fallback per this lane's own derive-don't-import discipline).
    if_a_precondition_fails: >-
      A missing interpreter, a failed Stage-0 construction-verification
      check, or an arithmetic exception is `failed_infrastructure`, never
      negative mathematical evidence (AGENTS.md rule 3).

  infrastructure_failure_disposition: >-
    Any crash or failed Stage-0 verification is recorded with its exact
    cause and classified `failed_infrastructure`. Supports and weakens
    NOTHING about H-MONO-5b6617 or IDEA-20260904-ad63fe.

  stopping_rules:
    - Do not execute unless separately reviewed, approved, frozen and authorized. (Satisfied here.)
    - Stop and report `failed_infrastructure` if Stage 0's own construction-verification checks fail -- do not proceed to Stage 1 with an unverified Q_e(T).
    - Do not silently discard or re-draw away a disconfirming instance; report it as the headline result.

  invalidation_rules:
    - Any execution while frozen, execution_authorized or evidence_eligible is false.
    - Any post-hoc change to the g-irreducibility selection rule after observing any Stage-1 result.
    - Any reporting of Stage 1's own result without Stage 0's construction-verification outcome alongside it.

  success_criterion: >-
    A run is well-formed evidence if: Stage 0's construction is explicitly
    derived and its own verification checks are reported pass/fail; Stage
    1's exact per-instance factorization patterns are reported for every
    tested base point, with no silent discarding; Stage 2's comparison
    against the sole prediction is stated plainly.

  falsification_criterion: >-
    Any single g-irreducible base point, correctly constructed and
    verified, whose Q_e(T) does not factor as (linear)(irreducible cubic).

  outcomes:
    full_s4_diagnostic_holds: >-
      Every tested g-irreducible instance shows cycle type (1,3). Consistent
      with (but not proof of) full S_4 monodromy at m=4; supports
      IDEA-20260904-ad63fe's own claim on this one diagnostic.
    full_s4_diagnostic_falsified: >-
      At least one g-irreducible instance shows a different factorization
      pattern. The full-S_4 claim at m=4 is FALSIFIED, matching the fate
      of H-MONO-93bc4d's own D3 at m=3; the true symmetric-base monodromy
      at m=4 is a proper subgroup, not yet identified, and is a new open
      question for this lane.
    infrastructure_or_construction_failure: See infrastructure_failure_disposition. Never mathematical evidence.

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_do_not: >-
      Toy scale only; no transfer to cryptographic scale or F_{q^n}. A
      pass at 2 curves/2 primes is toy-scale supportive evidence, not a
      proof for every curve.

  required_artifacts_if_later_authorized:
    - Frozen approved specification (this file).
    - The derived Q_e(T) construction, with its own Stage-0 verification checks shown.
    - Run manifest, command, environment, raw-result.json with every tested instance's exact factorization pattern.
    - Independent Validator + Red Team review before any citation of this result alongside IDEA-20260904-ad63fe's own broader claim.

  approval_requirements:
    - This contract IS the concrete next action named convergently by DEC-20260904-4eb323 and IDEA-20260904-ad63fe's own Stage 1.
    - Independent review confirms Q_e(T)'s own derivation is correct (via the same construction-verification checks Stage 0 requires, independently reproduced) before the result is cited.

  approval_status: >-
    APPROVED 2026-09-04 by the Coordinator; see `coordinator_approval_rationale` above.

  source_refs:
    - ledger/proposals/IDEA-20260904-ad63fe.yaml
    - ledger/hypotheses/H-MONO-5b6617.yaml
    - ledger/hypotheses/H-MONO-93bc4d.yaml
    - ledger/decisions/DEC-20260904-4eb323.yaml
    - experiments/EXP-MONO-917e3a/reviews/red-team/red-team-report.yaml
    - experiments/EXP-MONO-917e3a/implementation/witness_search.py

  inference:
    requested_policy: executor-implementation
    reasoning_effort: medium
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
