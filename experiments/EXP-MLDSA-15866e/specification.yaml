experiment:
  id: EXP-MLDSA-15866e
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-MLDSA-acac6d
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  title: >-
    Rank before reading: derive the faulty-signature bracket for every ML-DSA
    fault class from the scheme's own dataflow, verify the two rank-zero nulls
    and the full-rank positive control, then classify the published attacks by
    injection site and state the proof boundary as a conditional -- or report
    that the proof is not in the corpus and the goal's second criterion is not
    reachable

  objective: >-
    Produce, if a later approval and execution authorization are granted, four
    things in strict order. (1) The RANK ARITHMETIC: the ring-split check, the
    c-invertibility floor, and the (w, r, N_LA, N_IT) ladder at all three
    parameter sets, with the unrounded-ratio invariance verified. (2) The
    CONTROL BATTERY: two independently derived rank-zero nulls (unfaulted
    transcript, message-digest fault) and one full-rank positive control
    (y-known fault), all with forced values fixed before execution. (3) The
    FORCING ARGUMENT written out formally, including an exhaustive enumeration
    of every occurrence of s1 and s2 in an ML-DSA signature, offered for a
    reviewer to break. (4) The TAXONOMY, with one row per obtainable published
    attack, undetermined rows left undetermined, and the boundary stated as a
    conditional whose antecedent's source is recorded as obtained or not.
    NO FAULT IS INJECTED, SIMULATED, OR ENABLED AT ANY STAGE.

  what_this_is_not:
    - Not a fault injection, a fault simulation, a glitch, an EM or power measurement, or any interaction with any device.
    - Not an attack, an attack improvement, or an implementation of any published attack.
    - Not evidence about MLWE, MSIS or SelfTargetMSIS in EITHER direction. AGENTS.md rule 7 binds both ways: a fault result is never a break of those problems, and equally never a reassurance about them.
    - Not a statement about any deployed product, any specific implementation, or the presence or absence of countermeasures. A countermeasure changes the fault-landing probability and never the constraint rank.
    - Not a countermeasure proposal. Proposing a fix is not classifying a boundary.
    - Not a reproduction or an audit of the Lean 4 development in KN-LIT-8ce0b5; its rank bound is consumed as a relayed claim to be checked and is never quoted as a number, because its value is not known to this program.
    - Not a measurement of anything GOAL-MLDSA-002 owns -- no rejection predicate, no leak rate, no t0 reconstruction.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has happened.

  claim_ceiling:
    tier_for_rank_arithmetic: crypto
    tier_for_taxonomy_rows: >-
      Each row inherits the provenance of its source. All four filed
      implementation entries record "Full text not obtained", so a row built on
      an abstract is reported at the strength of an abstract and its site cell
      is UNDETERMINED unless the body is obtained in Stage 3.
    tier_for_boundary_statement: >-
      NONE UNLESS THE FAULT-SECURITY PROOF IS OBTAINED. The boundary is a
      conditional whose antecedent is currently unsourced -- no KN-LIT entry
      corresponds to the proof RQ-MLDSA-001's motivation names. If Stage 3 does
      not obtain it, the package reports the conditional and the named gap, and
      no unconditional boundary statement is made.
    exact_scope_a_run_could_support: >-
      At most: "for an ML-DSA signer as specified in the algorithm description
      sourced in Stage 0, a fault exposing w coefficients of the commitment
      randomness y yields rank w per faulty signature, hence N_LA and N_IT as
      tabulated; the published attacks obtainable to this program fall into site
      classes <table>; and IF the fault-security proof's model is <as relayed>
      THEN rows <list> lie outside it." Nothing about any of the three
      mathematical problems; nothing about any device.

  inputs:
    algorithm_description_provenance_rule: >-
      The Algorithm 7 / Algorithm 8 dataflow enters the run with a provenance
      class in {READ_PRIMARY, READ_SECONDARY, RELAYED, RECALLED-UNVERIFIED}.
      Stage 0 attempts READ_PRIMARY. Every downstream statement is stamped with
      the lowest provenance class among its inputs. THE FORCING ARGUMENT IS
      ESPECIALLY SENSITIVE: it rests on the claim that s1 occurs exactly once in
      the published transcript, which is a structural property of the sourced
      algorithm and not of the recalled one.
    parameter_table_recalled:
      q: 8380417
      q_minus_1_factorisation: "8380416 = 2^13 * 3 * 11 * 31"
      ring_degree: 256
      log2_q: 22.9986
      ML-DSA-44: {k: 4, l: 4, eta: 2, tau: 39, s1_coeffs: 1024, s1_entropy_bits: 2377.6}
      ML-DSA-65: {k: 6, l: 5, eta: 4, tau: 49, s1_coeffs: 1280, s1_entropy_bits: 4057.5}
      ML-DSA-87: {k: 8, l: 7, eta: 2, tau: 60, s1_coeffs: 1792, s1_entropy_bits: 4160.9}
      provenance: RECALLED-UNVERIFIED
      corroboration: >-
        Sibling-goal records IDEA-20260805-bb52fa and H-MLDSA-2d4123 quote tau,
        d and gamma2 identically. NOT A READING OF THE STANDARD. KN-LIT-4dadec
        records the FIPS 204 body as NOT READ, and those sibling records
        nonetheless cite "FIPS 204 Table 1"; the inconsistency is reported to
        the Coordinator and repaired by nobody here.
    canonical_corrected_values:
      jendral_year: 2024
      jendral_success_probability: 0.582
      source: >-
        DEC-20260805-0d59ff gate 2, which canonicalises these against
        RQ-MLDSA-001's provisional 2026 / ~53 per cent. THIS CONTRACT USES THE
        CORRECTED VALUES, as every BATCH-002 handoff is required to.
    synthetic_fault_classes:
      w_ladder: [1, 8, 64, 256, 1024]
      description: >-
        Five COUNTING OBJECTS, not simulations: "a fault exposing w coefficients
        of y". No mechanism by which such a fault would occur is proposed,
        modelled, or evaluated. They exist to exercise the rank arithmetic across
        its range.
    published_attacks_to_classify:
      - {entry: KN-LIT-340675, note: "DFA with targets identifiable from public information. ABSTRACT ONLY."}
      - {entry: KN-LIT-4f3b80, note: "Single-trace voltage glitch, hedged mode, 0.582. ABSTRACT ONLY. The single-signature forcing argument applies to this row."}
      - {entry: KN-LIT-180ad5, note: "SCA/FIA survey. ABSTRACT ONLY. Expected to yield multiple rows or none."}
      - {entry: KN-LIT-8ce0b5, note: "NTT twiddle-factor rank bound, Lean 4. ABSTRACT ONLY. Its bound is a checkable input; its value is NOT known to this program and is never quoted."}
    seeds: []
    seed_derivation_rule: >-
      NO RANDOM SEED IS USED ANYWHERE IN THIS CONTRACT. Every quantity is exact
      integer arithmetic, one binary logarithm, and integer ceilings; a third
      party reproduces every number from the parameter table alone. The absence
      of seeds is recorded explicitly so a reader cannot mistake an omitted field
      for an overlooked one. If a future version adds a sampled arm -- for
      instance measuring the genericity of the restricted functionals -- it
      requires a new contract version with a stated derivation rule.

  arms_and_controls:
    treatment: >-
      For each of the three parameter sets and each w in the ladder: compute
      r = w, N_LA = ceil(256*l / w), N_IT = ceil(256*l*log2(2*eta+1)/(w*log2 q)),
      and the unrounded ratio. Then, for each obtainable published attack,
      assign (site, w, r, N_LA, N_IT, site class, provenance) or mark
      UNDETERMINED.
    measured_null: >-
      NULL-1, THE UNFAULTED TRANSCRIPT. Apply the rank procedure to an honest
      ML-DSA signature. FORCED VALUE, DERIVED BEFORE THE RUN: rank EXACTLY 0,
      because rejection sampling makes the distribution of z independent of s1
      and y is never published. THIS NULL CAN FAIL: a procedure that counts
      equations rather than INDEPENDENT equations, or that forgets y is unknown,
      returns positive rank here. A positive value is a bookkeeping "break" of
      ML-DSA and HALTS THE CONTRACT IMMEDIATELY -- it is an error, never a
      result.
      NULL-2, THE MESSAGE-DIGEST FAULT (same shape as a real fault row, and the
      more informative of the two). Corrupt mu before the challenge is computed.
      The output is a syntactically valid signature on a different message; s1
      and s2 enter it exactly as in an honest signature. FORCED VALUE: w = 0,
      r = 0, N_LA and N_IT infinite. THIS NULL CAN FAIL and is designed to
      separate "a fault occurred" from "the secret is constrained" -- a
      procedure that cannot hold those apart has not identified the load-bearing
      structure and every taxonomy row is void.
    positive_control: >-
      PC-1, THE Y-KNOWN FAULT (the effect MUST appear). A fault making all of y
      computable. FORCED VALUE: r = 256*l, N_LA = 1, N_IT = 1, with the recovery
      map s1 = c^{-1}(z - y) exhibited symbolically and its failure probability
      bounded by 256/q. IF PC-1 DOES NOT RETURN r = 256*l AND N = 1, the
      procedure cannot detect a full-rank constraint system, and NO statement of
      the form "attack X needs many signatures" -- and no negative statement of
      any kind -- may be reported anywhere in the package.
    graded_controls: >-
      GC-1, THE w-LADDER, five interior points, monotonicity AND invariance
      reported. Forced values at ML-DSA-44: N_LA = 1024 / 128 / 16 / 4 / 1 and
      N_IT = 104 / 13 / 2 / 1 / 1 for w = 1 / 8 / 64 / 256 / 1024. Two separate
      verdicts are required: (i) both sequences strictly non-increasing;
      (ii) the UNROUNDED ratio equal to log2 q / log2(2*eta+1) = 9.9050 at
      ML-DSA-44 and -87 and 7.2554 at ML-DSA-65, at EVERY w. The rounded ratio
      is NOT constant -- at w = 64 it is 8 -- and a package that reports the
      rounded ratio as constant has made an error. A departure from
      ceil(256*l/w) at a specific w localises the failure of HEUR-FLT-1's
      independence claim to that w rather than leaving "the numbers look wrong".
      GC-2, THE PARAMETER-SET LADDER. The same w-ladder at all three sets. The
      s1 dimension grows 1024 -> 1280 -> 1792 while eta is 2 -> 4 -> 2, so N_LA
      grows monotonically while the unrounded ratio is NOT monotone (9.9050 ->
      7.2554 -> 9.9050). That non-monotone shape is pre-registered: an
      instrument that produced a monotone ratio would be responding to the
      dimension rather than to eta.
    ordering_control: >-
      NULLS AND POSITIVE CONTROL BEFORE ANY TAXONOMY ROW IS WRITTEN. Execute
      NULL-1, NULL-2 and PC-1, write their outputs and a SHA-256 digest to disk,
      and only then read any published attack or assign any row. Absence of that
      digest invalidates the package. Additionally: the site-classification rule
      is applied to NULL-2 before any real attack is classified; if it assigns
      NULL-2 a nonzero rank or a meaningful site class, the rule discriminates
      nothing and must be rewritten before a real row is touched.
    comparability_policy: >-
      A taxonomy row's cells never inherit provenance from a neighbouring row.
      A number derived here (r, N_LA, N_IT) is never presented in the same
      column as a number reported by a paper (a measured signature count) without
      both being labelled. The canonical 0.582 is used only in the separation
      computation and is never placed beside a derived probability without the
      derivation's own floor beside it.

  metrics:
    primary:
      - "K0 ring-split check: does 512 divide q - 1. Pre-registered YES."
      - "K1 c-invertibility floor 1 - 256/q. Pre-registered 0.99996945."
      - "K3/K4 the (N_LA, N_IT) ladder at all three parameter sets, exact integers."
      - "K5 the unrounded N_LA/N_IT ratio at every w and set. Pre-registered 9.9050 / 7.2554 / 9.9050."
      - "K6 the w forced by a reported single-signature full-s1 recovery. Pre-registered 1024 / 1280 / 1792."
      - "K10 taxonomy_determined_fraction, with undetermined rows published as undetermined."
      - "K11 was the fault-security proof obtained: boolean, with the full search recorded."
    secondary:
      - "K2 the separation |0.582 - invertibility floor|, and the resulting attribution of 0.582 to hardware."
      - "K7 rank assigned to the message-digest fault. Must be exactly 0."
      - "K8 rank assigned to an unfaulted transcript. Must be exactly 0."
      - "K9 the y-known positive control: r, N_LA, N_IT, and the exhibited recovery map."
      - "The enumeration of every occurrence of s1 and of s2 in a published ML-DSA signature, as a list, offered as the target of FC1."
      - "Wall-clock per stage; provenance class per parameter field and per taxonomy cell after Stage 0 and Stage 3."

  heuristic_under_test: HEUR-FLT-1

  preregistered_prediction:
    quantity: >-
      The rank arithmetic, the control battery's forced values, and the forcing
      constant -- all fixed before any execution.
    formula: >-
      r = w for a fault exposing w coefficients of y;
      N_LA = ceil(256*l / w);
      N_IT = ceil(256*l*log2(2*eta+1) / (w*log2 q));
      unrounded N_LA/N_IT = log2 q / log2(2*eta+1), independent of w and l;
      P[c invertible in R_q] >= 1 - 256/q;
      single-signature full-s1 recovery forces w = 256*l.
    source: >-
      Derived in ledger/hypotheses/H-MLDSA-acac6d.yaml, mechanism STEPS 1-4.
      The complete splitting of X^256 + 1 mod q follows from
      q - 1 = 2^13 * 3 * 11 * 31, checked here. No external citation is asserted
      for any step; KN-TECH-047 is cited only as the technique record naming
      what could occupy the N_IT-to-N_LA gap, and KN-LIT-8ce0b5 only as a
      relayed candidate value that is never quoted.
    values:
      ring_split_512_divides_q_minus_1: true
      c_invertibility_floor: 0.99996945
      N_LA_mldsa44: [1024, 128, 16, 4, 1]
      N_IT_mldsa44: [104, 13, 2, 1, 1]
      unrounded_ratio: {ML-DSA-44: 9.9050, ML-DSA-65: 7.2554, ML-DSA-87: 9.9050}
      forcing_constant_256l: [1024, 1280, 1792]
      null_1_rank: 0
      null_2_rank: 0
      pc_1_rank: 1024
    taxonomy_prediction: >-
      NOT PRE-REGISTERED AS A THRESHOLD, AND NONE MAY BE SET: the determined
      fraction depends on what Stage 3 can fetch. The pre-registered RULE is that
      undetermined rows are published as undetermined and the fraction is
      reported. Reaching 100 per cent by inference is a contract violation, not a
      success.
    proof_availability_prediction: >-
      NOT OBTAINED. No KN-LIT entry corresponds to the fault-security proof
      RQ-MLDSA-001's motivation names, and GOAL-MLDSA-001's own pause conditions
      contemplate primary sources being unreachable. The pre-registered
      consequence is that the package reports the conditional boundary plus the
      named gap, and that GOAL-MLDSA-001's second completion criterion is
      recorded as not currently reachable from the filed corpus.

  scale_relevance:
    tier: crypto
    justification: >-
      Every count is evaluated at the actual parameter sets with no
      extrapolation: 256*l, log2(2*eta+1) and log2 q are the real values, and the
      ceilings are exact. There is no toy cell and none would answer anything,
      because the object is a dimension count rather than a solved instance. What
      does NOT reach crypto tier is any taxonomy row whose source is an abstract,
      and that limitation is per-row rather than global.
    correspondence: >-
      null -- no sampling correspondence. Nothing is sampled and nothing is
      simulated.

  tail_checks:
    - "The unrounded ratio recomputed independently as log2 q / log2(2*eta+1) and as (N_LA_unrounded / N_IT_unrounded) at each w; agreement to 1e-6 required."
    - "The rounded ratio reported separately and explicitly NOT claimed constant (at w = 64 it is 8, not 9.9)."
    - "N_IT recomputed from the entropy side (256*l*log2(2*eta+1)) and from the equation side (rank * log2 q) and checked for consistency."
    - "The forcing constant 256*l cross-checked against the s1 dimension used in N_LA, so that a single transcription error cannot pass both."
    - "For every taxonomy row, whether its site cell was DETERMINED from a body, RELAYED from an abstract, or UNDETERMINED. A row with a determined site and an abstract-only source is an error."

  replication:
    seeds: []
    independent_instances: 3
    interpretation: >-
      Three parameter sets are three independent instantiations of one
      derivation, not statistical replicates. The computation is deterministic
      and there is nothing to replicate stochastically. The useful independence
      is structural: the non-monotone unrounded-ratio shape (9.9050 / 7.2554 /
      9.9050) is unlikely to survive a transcription error, so reproducing it at
      all three sets is a real check.

  budget:
    wall_clock_seconds_per_run: 4020
    stage_ceilings_seconds: {stage_1_arithmetic: 120, stage_2_forcing_argument: 900, stage_3_reading_and_taxonomy: 2400, stage_4_boundary: 600}
    total_cpu_hours: 1.2
    maximum_memory_gb: 1
    maximum_runs: 2
    no_network_for_compute_stages: true
    network_for_stage_3_only: true
    budget_note: >-
      Ceiling 4020 s, of which 2400 s is reading that may yield nothing under
      the network policy. Compute stages total 1620 s, 15 per cent of
      GOAL-MLDSA-001's 10800 s campaign, which its campaign_budget's
      budget_risk_note asks contracts to respect after BATCH-001's ceilings
      consumed 83 per cent of it.

  stopping_rules:
    - "Do not execute unless this contract is separately approved, frozen, archived, and execution-authorized. No approved_by field is present because it is not approved."
    - "HALT IMMEDIATELY if NULL-1 (unfaulted transcript) returns positive rank. That is a bookkeeping error that has produced an apparent break of ML-DSA; it is never reported as a result and the run stops."
    - "Stop before any taxonomy row if NULL-2 returns positive rank or if the pre-treatment control digest is absent."
    - "Stop if PC-1 does not return r = 256*l with N = 1: no negative signature-count statement may be reported."
    - "Stop Stage 3 at its ceiling whether or not the sources were obtained, and record exactly what was attempted, with URLs and HTTP statuses."
    - "Stop Stage 4 without a boundary statement if the fault-security proof was not obtained. Report the conditional and the named gap instead."
    - "Stop and report if the sourced algorithm description shows a second published occurrence of s1 or s2: that finding supersedes the taxonomy and is reported alone."

  invalidation_rules:
    - "Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false."
    - "Any fault injected, simulated, or emulated. This contract computes; it does not attack."
    - "Any sentence that can be read as evidence about MLWE, MSIS or SelfTargetMSIS, in either direction (AGENTS.md rule 7). The mechanism's hardware/algebra separation is the instrument for checking this and must be applied to every sentence."
    - "Any joint claim with EXP-MLDSA-1c66ac or with any lattice cost result."
    - "Any taxonomy row whose site cell is DETERMINED while its source is abstract-only."
    - "Any quotation of KN-LIT-8ce0b5's rank bound as a number: its value is not known to this program."
    - "Any use of the superseded Jendral values (2026, ~53 per cent) instead of the canonical 2024 / 0.582 from DEC-20260805-0d59ff."
    - "Any statement about a deployed product, a specific implementation, or a countermeasure's efficacy."
    - "Any statement about t0 secrecy, leak rates, or Algorithm 7 rejection predicates (GOAL-MLDSA-002's scope)."
    - "Any report of N_IT as an achievable attack cost. It is a floor from counting; no attaining algorithm is exhibited or claimed."

  success_criterion: >-
    This contract has no current success outcome because it is not authorized
    for execution. IF a later, separately approved and frozen successor is
    executed, its positive disposition is: NULL-1 and NULL-2 both return rank
    exactly 0; PC-1 returns r = 256*l with N = 1 and the exhibited recovery map;
    the ring-split check, the invertibility floor, the (N_LA, N_IT) ladder, the
    unrounded-ratio invariance and the forcing constant all reproduce their
    pre-registered values or their deviation is traced to a Stage-0 substitution
    and relabelled; the forcing argument is written out with the s1/s2
    occurrence enumeration attached; and the taxonomy is delivered with every
    row's provenance stated and every undeterminable site left UNDETERMINED.
    THE BOUNDARY STATEMENT IS NOT PART OF THE SUCCESS CRITERION. If the proof is
    obtained, the conditional is discharged and the boundary is stated. If it is
    not, the package delivers the conditional plus an explicit named gap
    recording that GOAL-MLDSA-001's second completion criterion is not currently
    reachable from the filed corpus -- and THAT IS A SUCCESS, because it is the
    honest state of the goal and no record currently says it.

  falsification_criterion: >-
    The contract falsifies H-MLDSA-acac6d if: a second published occurrence of
    s1 or s2 is exhibited (FC1, the strongest, and STEP 2 of the design exists to
    invite it); or the sourced modulus does not satisfy 512 | q - 1 (FC2); or
    NULL-1 or NULL-2 returns positive rank with the procedure otherwise sound
    (FC3); or PC-1 does not fire (FC4); or the w-ladder departs from
    ceil(256*l/w) at any point (FC5, refuting HEUR-FLT-1 at that w); or a
    published attack reports a single-signature full-s1 recovery from a site
    contaminating fewer than 256*l coefficients of y (FC6, refuting the forcing
    argument); or a published attack's signature count falls strictly below its
    class's N_IT (FC7); or every obtainable attack lands in one site class
    (FC8, the invariant does not discriminate over the actual population -- and
    that is itself a reportable finding about the fault literature).

  infrastructure_failure_disposition: >-
    A timeout, crash, missing dependency, blocked URL, or paywall is
    INFRASTRUCTURE SIGNAL and is NEVER negative mathematical evidence
    (AGENTS.md rule 5), and equally never evidence about any attack's strength.
    Specifically: failure to obtain a paper body in Stage 3 leaves that row
    UNDETERMINED and is recorded as a source-availability finding; failure to
    obtain the fault-security proof triggers the pre-registered conditional
    disposition and the named gap. Neither weakens the rank arithmetic, the
    control battery, or the forcing argument, all of which are derived and need
    no source. The environment was measured this session (numpy 2.4.6 present;
    sympy, fpylll, Sage, gmpy2 absent) and this contract requires none of them,
    so a solver-absence failure would indicate the implementation departed from
    the contract.

  required_artifacts_if_later_authorized:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - Stage-0 and Stage-3 source logs: every URL or path attempted, HTTP status or error, and the provenance class assigned to each field and each taxonomy cell.
    - The algorithm description actually used, with its provenance, and the s1/s2 occurrence enumeration derived from it.
    - Control outputs (NULL-1, NULL-2, PC-1) with their pre-taxonomy SHA-256 digest, timestamped before any row is written.
    - The full (w, r, N_LA, N_IT, unrounded ratio) table at all three parameter sets, as exact integers plus the ratio to six places.
    - The taxonomy, one row per attack, with per-cell provenance and undetermined cells marked.
    - The boundary conditional, and an explicit statement of whether its antecedent was sourced.
    - Exact command, git commit and dirty-tree state, environment and dependency versions, stdout, stderr, timings, peak RSS.
    - Requested model policy, backend, resolved model identifier, probe-verification status, reasoning effort, fallback and degraded flags.
    - Validity status and reason; a snapshot archive followed by independent validation and red-team review, with the Red Team directed specifically at whether any sentence can be read as a claim about MLWE, MSIS or SelfTargetMSIS.

  approval_requirements:
    - Independent review confirms that NULL-1 and NULL-2 can genuinely fail and are not decorations, and that PC-1 blocks all negative reporting when it does not fire.
    - Independent review confirms that no sentence can be read as evidence about the three mathematical problems in either direction, and that no sentence bears on any deployed implementation.
    - Independent review confirms that the boundary statement is a conditional and that the package cannot report an unconditional boundary without the proof.
    - Coordinator separately approves and freezes a successor contract without editing this draft.
    - Execution is separately authorized after the approved frozen package is delivered.

  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved; only the Coordinator approves (AGENTS.md rule 1).

  assigned_to: executor
