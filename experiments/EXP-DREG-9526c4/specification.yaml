# EXP-DREG-9526c4
# One F_5 S_3 first-fall gap against a support-matched null.
# Source: IDEA-20261005-be4540 via H-DREG-2b51fb. No run under this contract yet.
# Approved by DEC-20261006-135683.
experiment:
  id: EXP-DREG-9526c4
  hypothesis_id: H-DREG-2b51fb
  source_idea: IDEA-20261005-be4540
  question_id: RQ-DREG-bd6c86
  version: 1
  title: One F_5 S_3 first-fall gap against a support-matched null
  status: approved
  frozen: true
  designed_at: '2026-10-06'
  approved_by: coordinator
  approval_decision_id: DEC-20261006-135683
  objective: >-
    Decide, at the single frozen cell (F_5, raw S_3, m=3, n'=1, grevlex,
    degree cap 6), whether the first positive new_falls degree of the
    Semaev system differs by at least 1 from the median of the same degree
    on 20 support-matched null systems, with a second implementation
    checking one null draw. Record observations only. No exponent, no
    growth claim, no cover attack.
  inputs:
    field: F_5
    m: 3
    n_prime: 1
    system: raw descended S_3 (unsymmetrized)
    monomial_order: grevlex
    degree_cap: 6
    sentinel: 7
    null_draws: 20
    null_seeds:
      - 20261001
      - 20261002
      - 20261003
      - 20261004
      - 20261005
      - 20261006
      - 20261007
      - 20261008
      - 20261009
      - 20261010
      - 20261011
      - 20261012
      - 20261013
      - 20261014
      - 20261015
      - 20261016
      - 20261017
      - 20261018
      - 20261019
      - 20261020
    curve_rule: >-
      First short-Weierstrass curve y^2 = x^3 + A x + B over F_5 in
      lexicographic order of (A, B) whose trace of Frobenius is nonzero,
      frozen before any matrix is built.
    new_falls_formula: >-
      new_falls(D) = rank(M_D) minus the rank of the degree-exactly-D
      columns of M_D minus rank(M_{D-1}).
  controls:
    - >-
      The 20 support-matched nulls: same support and same order as the
      Semaev system, nonzero coefficients replaced by independent uniform
      nonzero field elements drawn under the frozen null_seeds in order.
      A dense random system of different support is not the control. A
      semi-regular degree prediction is not the control.
    - >-
      Second implementation of new_falls on null draw 1 (seed 20261001),
      written without importing the primary implementation. Disagreement
      voids the cell and is not evidence about S_3.
    - >-
      Curve frozen before any matrix is built. If the frozen curve is
      later shown supersingular, the cell is void, not a negative.
    - >-
      Jacobian operations performed must be 0. Any hyperelliptic Jacobian
      computation invalidates the run as off-contract.
    - >-
      Sentinel rule: a profile with no positive new_falls through degree 6
      is recorded as 7 for the comparison only. The pair (7, 7) reads as
      agreement.
  independent_variables:
    - system in {semaev, null-01, ..., null-20}
    - degree D in {1, 2, 3, 4, 5, 6}
    - null seed from the frozen list of 20
  metrics:
    primary:
      - semaev_comparison_value
      - null_comparison_values (20 integers)
      - null_median
      - absolute_gap
      - implementations_agree
      - curve_A
      - curve_B
      - curve_trace
      - jacobian_operations (required to be 0)
    secondary:
      - null_range
      - full new_falls profile per D for the Semaev system
      - full new_falls profile per D for each null draw
      - Macaulay matrix shapes per D
      - measured peak RSS and wall time
  heuristic_under_test: H1
  heuristic_under_test_note: >-
    H1 of H-DREG-2b51fb: the 20-draw null median is a stable one-cell
    baseline. This contract validates it only through the frozen tail
    check (null range under 2); it is not a semi-regular prediction and no
    rank-probability theorem is invoked.
  preregistered_prediction:
    quantity: >-
      The Semaev comparison value, the median of the 20 null comparison
      values, and their absolute gap, with the sentinel-7 rule applied.
    formula: >-
      Absolute difference at least 1 between the Semaev comparison value
      and the null median. The sign of the gap is not predicted. A gap of
      0, including (7, 7), falsifies a structural gap at this cell.
    source: >-
      IDEA-20261005-be4540 minimal_test and falsification_conditions, read
      2026-10-06. The new_falls formula is the title formula of
      IDEA-20260916-4b7c1e as quoted in the proposal; the rest of that
      file was not used. No run was executed while freezing this contract.
  scale_relevance:
    tier: toy
    justification: >-
      One cell at q=5, m=3, n'=1, degree cap 6. No transfer to other q, m,
      n', to F_{2^n}, to n' > 1, to a hyperelliptic Jacobian, to
      cryptographic size, or to any ECDLP exponent. A gap, or its absence,
      is a statement about this cell only.
    correspondence: null
  tail_checks:
    - >-
      Range of the 20 null comparison values. A range of 2 or more marks
      the median unstable and the cell inconclusive rather than a
      structural gap.
    - >-
      Report all 20 null comparison values, not the median alone, so a
      later reader can re-scope the comparison.
    - >-
      Report the curve coefficients (A, B) and the trace beside the gap.
    - >-
      Report the count of Jacobian operations, required to be 0.
  replication:
    seeds:
      - 20261001
      - 20261002
      - 20261003
      - 20261004
      - 20261005
      - 20261006
      - 20261007
      - 20261008
      - 20261009
      - 20261010
      - 20261011
      - 20261012
      - 20261013
      - 20261014
      - 20261015
      - 20261016
      - 20261017
      - 20261018
      - 20261019
      - 20261020
    independent_instances: 20
    replication_note: >-
      The Semaev arm is deterministic given the frozen curve, so seeds vary
      the 20 null fills, which is where the variability lives. Null draw k
      uses the k-th frozen seed. The second-implementation repeat reuses
      seed 20261001 on null draw 1. A draw that cannot be reproduced from
      its seed is not evidence.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 2
    maximum_workers: 1
    note: >-
      Advisory machine-protection watches, not approval gates. The binding
      scientific counts are the 20 null draws, the degree cap 6, and the
      one second-implementation repeat. maximum_runs bounds infrastructure
      retries only: run 1 is the measurement, run 2 is an infrastructure
      retry. Exceeding a watch checkpoints the task; it never converts a
      missing cell into a result.
  stopping_rules:
    - Stop after the primary measurement run completes, or after maximum_runs.
    - If the two implementations disagree on the repeated null draw, stop: the cell is void.
    - If the null range is 2 or more, stop: the cell is inconclusive.
    - Stop at maximum_memory_gb. A memory abort is failed_infrastructure, never a high degree of regularity.
  invalidation_rules:
    - >-
      A timeout, crash, or memory exhaustion makes the cell or the run
      failed_infrastructure and is NEVER negative evidence about S_3 or
      about any degree invariant (AGENTS.md rule 5).
    - >-
      A null draw that redraws the zero pattern, uses a different monomial
      order, or symmetrizes S_3 is invalid_measurement: it measured a
      different cell.
    - >-
      Either implementation importing the other is invalid_measurement.
    - >-
      A run comparing against a dense random system of different support,
      or against a semi-regular prediction, is invalid as to that
      comparison.
    - >-
      A run performing any Jacobian operation is invalid as to this
      contract.
    - >-
      A run whose parameters differ from this frozen contract is a
      DIFFERENT experiment and requires a new contract.
  success_criterion: >-
    ALL of the following, each decidable from the primary metrics: (1) the
    curve (A, B) is the first lexicographic pair with nonzero trace and was
    frozen before any matrix was built; (2) both the Semaev and all 20 null
    profiles finish through degree 6; (3) the two implementations agree on
    the repeated null draw; (4) Jacobian operations equal 0; (5) the null
    range is below 2; (6) the absolute gap, sentinel rule applied, is at
    least 1. A run meeting (1)-(6) is VALID and reports a structural gap at
    this cell, scoped to this cell only.
  falsification_criterion: >-
    The run is valid under (1)-(5) and the absolute gap is 0, including the
    censored pair (7, 7): the support accounts for the fall at this cell
    and a structural gap at this cell is falsified. A second-implementation
    disagreement, a supersingular curve finding, or a null range of 2 or
    more voids or inconclusives the cell and is not a falsification in
    either direction.
  required_artifacts:
    - experiments/EXP-DREG-9526c4/implementation/
    - experiments/EXP-DREG-9526c4/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-DREG-9526c4/runs/<RUN-ID>/command.txt
    - experiments/EXP-DREG-9526c4/runs/<RUN-ID>/stdout.log
    - experiments/EXP-DREG-9526c4/runs/<RUN-ID>/stderr.log
    - experiments/EXP-DREG-9526c4/runs/<RUN-ID>/raw-result.json
  assigned_to: executor
  out_of_scope:
    - Any growth statement in n or m, and any transfer past this cell.
    - Any subexponential ECDLP cost, any exponent move, any rho-baseline comparison beyond the stated constant.
    - Any GHS cover, hyperelliptic Jacobian computation, or MOV/Frey-Ruck/anomalous reduction.
    - Any semi-regular estimate, any identification of new_falls with last fall degree, any challenge to KR-IC-fbdb61.
    - The binary re-measure cells of IDEA-20260929-688ea4 and any other curve, order, or symmetrization.
