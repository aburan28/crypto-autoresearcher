      all twelve code files. This record does not copy those hashes: a second
      copy of a hash is a second thing to drift.

  stopping_rule_that_fired:
    rule: >-
      A measured ratio ABOVE 1 halts for diagnosis and is never reported as a
      finding.
    fired: true
    diagnosis_artifact: ratio-above-1-diagnosis.txt
    where_the_full_evaluation_lives: >-
      run.stopping_rules_evaluated of the archived manifest, which records all
      six declared rules and the outcome of each. Reproduced here only to the
      extent of naming WHICH rule fired, because a schema completion that
      omitted that would read as a clean run.
    what_is_not_claimed: >-
      The diagnosis is committed unread. Whether its multiplicative
      attribution holds, and whether the negative bias sign it reports
      survives, is TASK-20260913-31d530's judgement and not this record's.

