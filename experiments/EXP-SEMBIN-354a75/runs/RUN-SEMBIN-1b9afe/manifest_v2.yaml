  # ---------------------------------------------------------------------------
  # ADDITIVE SCHEMA COMPLETION. Every value below is transcribed from the
  # archived bytes named in `schema_completion.derived_from`. NOTHING WAS RERUN
  # and no fact is added: where the archived manifest recorded a quantity under
  # a different field name, this record carries the same quantity under the name
  # tools/validate_ledger.py checks for, and says which archived field it came
  # from. Where the archived package recorded a quantity in a companion file
