    specification_modified: false
    evidence_record_written: false
    hypothesis_status_changed: false
    conclusion_about_any_curve_stated: false
    heuristic_declared_validated_or_refuted: false
    committed_by_executor: false
    write_scope_respected: false
    write_scope_respected_note: >-
      The archived manifest records `write_scope_respected: true` alongside a
      declared deviation writing coordination/bus/messages/MSG-20260913-477ddd.yaml,
      which is outside the declared write_scope. Those two statements are in
      tension in the archived bytes. THIS RECORD DOES NOT OVERWRITE THE
      ARCHIVED CLAIM -- it reports the tension and resolves the field the way
      the deviation block itself already describes: one write did land outside
      scope, the executor recorded it as a deviation rather than concealing or
      deleting it, and the Coordinator has since committed and published that
      message. The measurement is unaffected; see the deviation block below.

  protocol_deviations:
    - kind: write_outside_declared_write_scope
      what: coordination/bus/messages/MSG-20260913-477ddd.yaml
      detail: >-
        After the measurement and all artifacts were complete, the executor
        sent one agent-bus message pointing the Coordinator at this run package
        and at the ratio-above-1 diagnosis. The handoff's write_scope names
        only experiments/EXP-SEMBIN-354a75/code/ and
        experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/, so that path is
        outside it. Recorded rather than reverted: a bus record is write-once
        and deleting one is the worse of the two faults.
      affects_no_measurement: true
      affects_no_measurement_reason: >-
        Written after raw-result.json and per-R-counts.json were sealed. It
        contains no number not already in task-report.md, and under AGENTS.md
        a message is a pointer and never evidence, so no finding depends on it.
      disposition_since: >-
        The Coordinator committed that message and acked it, and published it
        along with MSG-20260913-60eaf9. The remedy the archived manifest
        offered has therefore been taken.
      source: run.deviations_from_approved_protocol of the archived manifest

  unexpected_observations_are_in: >-
    run.unexpected_observations of the archived manifest, which records four:
    a specification annotation mismatch at cell (n15, m5, t3, k3) where the
    spec annotates paper_probability 0.0009 against the frozen transcription's
    0.0026; a Poisson shape failure at 7 of 9 cells where the matched null
    passes the identical test at every cell; a shape deficit that is NOT
    monotone in t; and a chained presentation that never gains a solution over
    the single presentation and loses on 648 of 360000 draws, every one of them
    a cell where the Lemma 2 side condition had failed. They are not restated
    here. They are load-bearing and a reader must go to the archived record.

  reproduction:
    how: >-
      From the recorded commit with the code hashes in the archived manifest,
      run the wrapper command in command.txt from
      experiments/EXP-SEMBIN-354a75/code. The measurement is deterministic
      given the recorded seeds; the exact-over-all-targets measurements are
      independent of the seeds entirely.
    verified: true
    verified_how: >-
      All three self-test suites were re-run after the measurement completed
      and all passed (selftests.txt). The order-independence control
      re-enumerates three cells under a permuted factor-base order and
      reproduces every per-R count. The exact-over-all-targets pass reproduces
      the sampled hit fractions to sampling error and is itself sampling-free.

  schema_completion:
