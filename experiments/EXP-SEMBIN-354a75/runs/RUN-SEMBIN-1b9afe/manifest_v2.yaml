  # ---------------------------------------------------------------------------

  # RUN_REQUIRED_TOP wants `status`; the archived manifest recorded the same
  # value at `run.validity.status`, with its reason beside it.
  status: completed_valid
  status_source: run.validity.status of the archived manifest
  validity:
    status: completed_valid
    reason: >-
      Transcribed verbatim in substance from the archived manifest's
      run.validity.reason: all 180 configurations ran to completion with exit
      code 0; every declared cell was reached exhaustively; no cell was
      unreached and no sampling was substituted for enumeration inside any
      cell; the baseline, matched-null, nearby-object, known-false,
      invalid-input, exhaustiveness and Lemma-2-side-condition controls all
      returned their required outcomes. The contract's ratio-above-1 stopping
      rule DID fire in six of nine cells; the run was halted for diagnosis
      before any claim, the diagnosis is recorded in
      ratio-above-1-diagnosis.txt, and no ratio above 1 is reported as a
      finding anywhere in the run package. The archived manifest is the
      governing text for this reason; read it there.
    failure_class: null
  invalid_reason: null

  # RUN_REQUIRED_TOP wants `code` with `.commit` and `.command`; the archived
  # manifest split the same facts across run.revision and run.command.
  code:
    commit: 71509d763983588b89ce04ba355e161426baf547
    dirty: true
    branch: cursor/semaev-2015-audit-program-5b8b
    command: >-
      /usr/bin/python3 yield_run.py
      --out /workspace/experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/raw-result.json
      --per-r-out /workspace/experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/per-R-counts.json
      --repo /workspace
    working_directory: experiments/EXP-SEMBIN-354a75/code
    wrapper: >-
      python3 run_wrapper.py --script yield_run.py --run-dir
      /workspace/experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe
      --repo /workspace
    recorded_in: command.txt
    source: run.revision and run.command of the archived manifest
    dirty_tree_note: >-
      The tree was dirty at launch and the archived manifest lists every dirty
      path exactly as `git status --porcelain` reported it, at
      run.revision.git_dirty_paths. All of this experiment's own dirty paths
      were untracked files authored for the task and are hash-pinned by
      run.artifacts.code_sha256, so the run reproduces from those hashes
      regardless of the commit. Reproduction therefore binds to the code
      hashes, not to the commit alone.

  # RUN_REQUIRED_TOP wants `environment`; the archived package recorded it in
  # environment.json (sha256 a115bf25...) and the archived manifest pinned that
  # file's hash rather than repeating its contents.
  environment:
    operating_system: Linux-6.12.94+-x86_64-with-glibc2.39
    architecture: x86_64
    python_implementation: CPython
    python_version: 3.12.3
    processor_count: 4
    sage_version: null
    dependencies:
      numpy: 2.4.4
      pyyaml: 6.0.1
    groebner_engine: null
    groebner_engine_note: >-
      None, and none is needed: this contract COUNTS decompositions by
      enumerating and adding points. No polynomial system is solved, no
      Macaulay matrix is formed, and no degree is measured, estimated or
      assumed anywhere in it. (IMP-SEMBIN-ENGINE therefore does not bound this
      run, which is why it was runnable.)
    field_arithmetic:
      reference_implementation: code/binary_field.py
      vectorised_implementation: code/fastfield.py
      agreement_selftest: code/selftest_fastfield.py
      note: >-
        Irreducible moduli are found by programmatic search, not from a table;
        the two implementations share the modulus and are compared element by
        element.
    source: environment.json, transcribed key for key

  # RUN_REQUIRED_TOP wants `inputs`; the archived manifest recorded the same
  # parameters and seeds under run.parameters and run.randomness.
  inputs:
    curve_family: >-
      y^2 + xy = x^3 + A x^2 + B over F_{2^n}, A = 0, B in {1, one seeded
      random value per configuration}. The paper writes the curve with a
      tabulated b only, so A is fixed at 0 and recorded rather than varied.
      No standardised curve is used and none is implicated.
    cells: 9
    cells_note: >-
      Exactly the nine cells declared in the specification, all inside
      tk - n in [-6, +6]. No cell outside the declared window was added.
    configurations_run: 180
    R_draws_per_configuration_per_side: 2000
    subspace_variants: [low_degree_polynomial, random_k_dimensional]
    curve_coefficient_modes: [B_eq_1, random_B]
    target_populations: [E, T]
    presentations: [single, chained, usable]
    class_count_variants:
      - semaev_v_to_the_t_over_t_factorial
      - exact_multiset_count_binom_V_plus_t_minus_1_choose_t
      - known_false_v_to_the_t_no_symmetry
    seeds: [20260913201, 20260913202, 20260913203, 20260913204, 20260913205]
    seed_derivation: >-
      Each configuration derives its own seed deterministically from the base
      seed and the configuration label; the derived value is recorded per
      configuration in raw-result.json under derived_seed. Generator is
      numpy.random.default_rng (PCG64).
    what_is_not_random: >-
      Every decomposition count is exhaustive over the enumeration domain and
      carries no randomness. Sampling enters only in the choice of WHICH
      targets R are examined, never in how a given R's count is obtained, and
      the exact-over-all-targets measurements remove even that.
    source: run.parameters and run.randomness of the archived manifest

  timing:
    started_at: '2026-09-13T17:14:10.233864+00:00'
    finished_at: '2026-09-13T17:27:57.520344+00:00'
    wall_seconds: 827.286
    cpu_seconds: 827.474
    exit_code: 0
    source: run.timing of the archived manifest, unchanged

  # RUN_REQUIRED_TOP wants `result`, and certificate discipline
  # (docs/claims-and-verification.md) reads `result.certificate.kind`. The
  # archived manifest recorded the certificate at run.certificate, one level
  # too high for the checker to find it.
  result:
    observations_are_in: raw-result.json
    observations_note: >-
      raw-result.json (sha256 54aea992...) carries the measurement: 9 cells,
      180 configurations, a 3231-row results_table, and a controls block with
      six named controls (baseline, exhaustiveness, invalid_input,
      known_false_class_count, matched_null,
      specification_annotation_crosscheck). Per-target counts are retained in
      full in per-R-counts.json. This record does not restate any measured
      value, because restating one would create a second place for it to be
      wrong; the numbers live in the artifacts and the reading of them is the
      reviewer's task (TASK-20260913-31d530).
    enumeration_integrity:
      exhaustive_within_every_cell: true
      unreached_cells: []
      sampling_substituted_for_enumeration_anywhere: false
      order_independence_verified: true
      conservation_identity_audited: true
      conservation_identity_holds_in_every_audited_cell: true
      no_polynomial_system_solved: true
      no_degree_measured_estimated_or_assumed: true
    certificate:
      kind: none
      verified: true
      verifier: no-claim
      note: >-
        Pure measurement run. It claims no discrete-log solve and no
        factor-base relation, so there is nothing for a solution certificate
        to attest. What stands in place of one, per the archived manifest's
        run.certificate.reason: the independent cross-checks in
        code/selftest_yield_core.py (brute-force F_{q^2} enumeration, direct
        summation-polynomial evaluation, root-set intersection, an independent
        t!-permutation chain search, and a brute-force Lemma-2 check), the
        order-independence control, and the exact per-cell conservation
        identity. All are recorded in selftests.txt and raw-result.json.
      source: run.certificate of the archived manifest, relocated under result

  inference:
    requested_policy: executor-implementation
    resolved_model_id: claude-opus-5
    resolved_model_id_provenance: >-
      As self-reported by the runtime to the producing session. That session
      was not launched through `orchestration.adapter env`, so no
      AUTORESEARCH_POLICY/AUTORESEARCH_BACKEND pair was injected and no
      adapter-resolved identifier string is available to quote.
    backend: cursor_cloud_agent
    runtime: cursor_cloud_agent
    reasoning_effort: null
    model_verified: false
    model_verified_note: >-
      `python3 -m orchestration.adapter doctor --probe` was not run from the
      producing session, so the identifier above is unverified configuration
      under the AGENTS.md model policy rather than a probe-confirmed fact. No
      inference was used inside the measurement itself: every number in
      raw-result.json comes from deterministic enumeration and addition in
      F_{2^n}, so the measurement does not depend on this field being right.
    fallback_used: false
    degraded_allowed: false
    degraded_requirements: []
    source: run.inference of the archived manifest, unchanged

  resources:
    peak_rss_bytes_upper_bound: 1043222528
    peak_rss_gb_upper_bound: 1.043
    peak_rss_measurement_note: >-
      getrusage(RUSAGE_CHILDREN).ru_maxrss is the maximum over all reaped
      children, so it is an UPPER BOUND on this run's own peak rather than a
      measurement of it. The in-process high-water mark read from
      /proc/self/status by the measurement process itself is recorded per
      configuration in raw-result.json and never exceeded 0.50 GB.
    processes: 1
    cores_used: 1
    budget_wall_clock_seconds: 3600
    budget_memory_gb: 4
    budget_maximum_runs: 200
    within_budget: true
    source: run.resources of the archived manifest, unchanged

