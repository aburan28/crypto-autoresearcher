      and `result` to companion files it hash-pinned instead of to manifest
      fields. This record supplies those field names over the same values and
      names the archived field each came from.
    no_rerun: true
    defect_class: >-
      Schema field-name and field-location divergence in a freshly written
      manifest. NOT a legacy record predating the schema: this manifest was
      written on 2026-09-13 against the current schema and diverged from it, so
      this is a live defect and is reported as one rather than grandfathered
      into tools/validate_ledger_baseline.txt. The baseline is for records that
      predate the rule; adding a same-day record to it would turn the check
      off for exactly the case it exists to catch.
    derived_from:
      experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/manifest.yaml: 7729836bca6fd513dd28ccbc0f5fdeac779f93b0641f04904ea7242836c03ca9
