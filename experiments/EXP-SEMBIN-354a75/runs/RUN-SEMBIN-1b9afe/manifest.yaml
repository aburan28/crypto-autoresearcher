  unexpected_observations:
    - kind: specification_annotation_mismatch
      cell: {n: 15, m: 5, t: 3, k: 3}
      detail: >-
        specification.yaml annotates paper_probability = 0.0009 for this cell,
        but the frozen transcription in inputs/SEMAEV-2015-310/tables.yaml
        prints 0.0026 for it, and eq. (11) evaluates to 0.002601. The
        specification is frozen and was not edited. The baseline control is run
        against the frozen transcription of the paper, which is the primary
        source; against it eq. (11) reproduces every printed value. Recorded
        here rather than silently reconciled.
    - kind: poisson_shape_fails_where_the_null_passes
      detail: >-
        The per-R count distribution fails a chi-square Poisson
        goodness-of-fit at 7 of 9 cells, with p below 1e-8 at 5 of them, while
        the matched null's own realized counts pass the identical test at every
        cell (p = 0.22 to 0.96). The failure is in the direction of excess
        zeros and a heavy upper tail: at n13 the usable presentation puts 586
        of 40000 targets in the >= 5 bin where the fitted Poisson expects 5.77,
        and the largest observed count of 20 has probability 0 under the fit.
        Recorded as an observation about the shape of the realized
        distribution; whether HEUR-003's Poisson clause survives it is a
        reviewer's judgement, not this run's.
    - kind: shape_deficit_not_monotone_in_t
      detail: >-
        The shape-only dispersion factor -- the measured decomposable fraction
        divided by the Poisson zero-complement at the measured mean, which no
        class-count convention can move -- is 0.9091, 0.9020 and 0.9026 at the
        three t = 2 cells, then 0.9978, 0.9823 and 0.9929 at all three t = 3
        cells, then 0.7610 at t = 4 and 0.3922 at t = 6. The t = 3 cells carry
        the SMALLEST departure from eq. (11)'s Poisson link anywhere in the
        window, so the t-trend dips in the middle rather than worsening
        monotonically. No mechanism for the dip is offered. Recorded because
        the frozen prediction's second clause asked for monotonicity in t and
        because a monotone reading of this trend would be wrong.
    - kind: chained_never_gains
      detail: >-
        Across all 9 cells and 360000 E-side target draws, the chained
        presentation differs from the single presentation on 648 targets. In
        every one of those 648 the Lemma 2 side condition had FAILED, and in
        zero of them had it held. Every difference is negative: the chain loses
        solutions and never gains any, with per-target deficits of 1 to 12. A
        mean difference of zero would have hidden this; the per-R retention the
        contract requires is what made it visible.

