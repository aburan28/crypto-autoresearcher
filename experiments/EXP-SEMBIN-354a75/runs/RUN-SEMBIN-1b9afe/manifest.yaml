  stopping_rules_evaluated:
    - rule: >-
        Stop and report a procedure defect if the recomputed eq. (11) fails to
        match the four printed decimals at the four published cells.
      fired: false
      outcome: >-
        eq. (11) was recomputed against all 33 P_theoretical entries of the
        frozen transcription of Tables 1 and 2, not only the four cells in this
        window. All 33 match to four decimals under truncation; maximum
        absolute error 9.871e-05. Only 10 of 33 match under rounding, which
        identifies the paper's convention as truncation.
    - rule: >-
        Stop the whole run if the realized-random-map control returns a ratio
        below 1.
      fired: false
      outcome: >-
        45 realizations, five per cell. Every one has a 95% interval containing
        1. Point estimates run 0.9906 to 1.0123 with cell means 0.9999 to
        1.0079; the most negative point estimate, 0.9906, carries the interval
        [0.9630, 1.0185]. The pipeline does not manufacture a shortfall.
    - rule: >-
        The known-false class count must shift the ratio by the expected t!
        factor, or the run is invalid.
      fired: false
      outcome: >-
        The modelled lambda shifts by exactly t! in every cell (24, 6, 6, 6, 6,
        720, 2, 2, 2 against t! for t = 4, 3, 3, 3, 3, 6, 2, 2, 2), to
        floating-point equality. The resulting P ratio shifts by less than t!
        wherever lambda is not small, because P = 1 - exp(-lambda) saturates;
        that is a property of the link function, not of the class count, and
        lambda is the quantity the class count multiplies.
    - rule: >-
        A measured ratio ABOVE 1 halts for diagnosis and is never reported as a
        finding.
      fired: true
      outcome: >-
        The rule FIRED. Six of nine cells returned a Semaev-variant ratio whose
        95% interval lies strictly above 1, and two of those (n17 and n21) stay
        above 1 under the exact-multiset class count as well. The run was
        halted and diagnosed before any claim was formed. The diagnosis is an
        exact multiplicative attribution, recorded in
        ratio-above-1-diagnosis.txt: the ratio of the measured mean to eq.
        (11)'s lambda factors as f_legal * f_multiset * f_base * f_pop, and the
        product reproduces the observed ratio to within 1e-9 in every cell,
        leaving no unattributed excess. Three of the four factors are
        properties of eq. (11)'s own approximation rather than of the curve
        (f_multiset, the exact multiset count against |V|^t/t!, up to 14.77x at
        |V| = 4; f_base = (L/|V|)^t, where L is the number of F_q-rational
        factor-base points and eq. (11) charges |V| x-values instead, up to
        1.99x; f_pop = q over the size of the actual target population, within
        2.5% of 1 everywhere). The single factor that reflects the curve,
        f_legal, is at or below 1 in EVERY cell without exception. No ratio
        above 1 is reported as a finding in this run package.
      diagnosis_artifact: ratio-above-1-diagnosis.txt
    - rule: >-
        Stop a cell at its cap and record it unreached with the size of V^t it
        needed.
      fired: false
      outcome: >-
        No cell hit its cap. All nine ran exhaustively. The unreached list is
        empty and no sampling was substituted for enumeration in any cell.
    - rule: Do not add cells outside the declared window.
      fired: false
      outcome: >-
        Exactly the nine declared cells were run, all inside
        tk - n in [-6, +6].

