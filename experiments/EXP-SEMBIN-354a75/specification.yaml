experiment:
  id: EXP-SEMBIN-354a75
  hypothesis_id: H-SEMBIN-c5b2e0
  version: 1
  title: >-
    Exhaustively enumerate realized decomposition yield of the chained S_3 system
    against Semaev eq. (11), and fix the sign of the bias it puts into stage-1 cost
  status: approved
  objective: >-
    Calibrate the yield law this program has already been citing. Two frozen protocols
    -- EXP-RELN-164ad3 with H-RELN-cfa1a2 and H-RELN-96e3ba under GOAL-RELN-001, and the
    charged-exponent work under GOAL-ICEX-001 -- carry a reference curve named
    HEUR-SEMAEV-2015-4.3, which is Section 4.3 of a paper this program recorded as
    unread until 2026-09-13. Freezing the paper confirmed the formula is eq. (11),
    P = 1 - exp(-2^{tk-n}/t!), reproducing every printed probability cell of Tables 1-2
    to four decimals. What remains open is whether eq. (11) is the right law for the
    chained system and which way its stated inequality biases cost.
    The paper derives eq. (11) inside P(first t-1 systems) >= P(n,m,t,k) >= P(solve
    eq. 5) and then assumes the right-hand relation is an equality. Since this
    probability sits in the DENOMINATOR of stage-1 relation cost in eqs. (15)-(17), an
    upper bound substituted for the truth biases the paper's stage-1 cost DOWNWARD. The
    experiment measures the realized yield exactly, by enumeration rather than by
    solving, so no Groebner engine and no degree assumption enters it at all.
    It also settles a pre-existing signal: H-RELN-96e3ba reports a 2^m-type discrepancy
    against this curve at m = 2. Now that the curve is identified, that discrepancy is
    either a defect of eq. (11), a difference between the chained and single-polynomial
    presentations, or a mapping error between an F_{2^n} derivation and a toy
    prime-field instrument. Counting both presentations on the same target points is
    what separates the three.
  inputs:
    curve: >-
      E/F_{2^n}: Y^2 + XY = X^3 + A X^2 + B, B = 1 and random B
    counted_object: >-
      the exact number of decompositions of a target point R as a sum of t points whose
      x-coordinates lie in V, obtained by exhaustive enumeration over V^t -- never by
      sampling within a cell and never by solving a polynomial system
    presentations:
      - chained: eq. (5) of KN-LIT-fa346d, the chain of S_3 equations
      - single: eq. (4), the single summation polynomial S_{t+1}
    frozen_source: inputs/SEMAEV-2015-310/
    window: 'tk - n in [-6, +6], where 1 - exp(-2^{tk-n}/t!) is neither saturated nor negligible'
    cells:
      - {n: 13, m: 4, t: 4, k: 4, paper_probability: 0.2834}
      - {n: 15, m: 5, t: 3, k: 3, paper_probability: 0.0009}
      - {n: 17, m: 3, t: 3, k: 6}
      - {n: 19, m: 3, t: 3, k: 7, paper_probability: 0.4865}
      - {n: 21, m: 3, t: 3, k: 7, paper_probability: 0.1535}
      - {n: 12, m: 6, t: 6, k: 2, paper_probability: 0.0013}
      - {n: 20, m: 2, t: 2, k: 10}
      - {n: 22, m: 2, t: 2, k: 11}
      - {n: 24, m: 2, t: 2, k: 12}
    random_R_draws_per_cell: 2000
    subspace_variants: [low_degree_polynomial, random_k_dimensional]
    class_count_variants:
      - semaev_v_to_the_t_over_t_factorial
      - exact_multiset_count_binom_V_plus_t_minus_1_choose_t
    seeds: [20260913201, 20260913202, 20260913203, 20260913204, 20260913205]
  controls:
    - kind: baseline
      design: >-
        Recompute 1 - exp(-2^{tk-n}/t!) at the four cells whose probability the paper
        prints, and match all four decimals. This checks that this program evaluates
        eq. (11) correctly. It is explicitly NOT evidence that eq. (11) is right: the
        paper's probability column is the model's own output, not an observation, and
        reporting this control as support for eq. (11) would be a category error.
    - kind: matched_null
      design: >-
        A directly realized symmetric random map from V^t to F_q -- the object eq. (11)
        actually models -- pushed through the identical counting and ratio pipeline. Its
        measured ratio must be 1 within a 95% interval. If the pipeline reports a ratio
        below 1 for a true random map, the deficit is an artifact of the counting code
        and every curve-derived cell is void. This control is what separates the
        model's shape from the curve's behaviour.
    - kind: nearby_object
      design: >-
        The single-polynomial eq. (4) count on the SAME R draws, as the matched
        presentation. This is what distinguishes "eq. (11) is the wrong law" from
        "eq. (11) is right for eq. (4) and the chain loses solutions" (HEUR-004).
    - kind: known_false
      design: >-
        A deliberately wrong class count -- |V|^t with no symmetry correction at all --
        which must produce a ratio differing from the correct pipeline by the expected
        t! factor. If it does not, the pipeline is insensitive to the class count and
        cannot attribute a discrepancy to it.
    - kind: invalid_input
      design: >-
        R the point at infinity, and V not closed under F_2-addition. Both must be
        rejected rather than counted.
    - kind: exhaustiveness
      design: >-
        For the smallest cell, enumerate V^t twice by two independent orderings and
        confirm identical per-R counts. An enumeration that is order-dependent is
        incomplete.
    - kind: lemma2_side_condition
      design: >-
        Per R, record whether the Lemma 2 side condition holds -- whether the lower-t
        systems are unsatisfiable -- and record separately the solutions whose y_i fall
        in F_{q^2} \ F_q, which are counted by the algebraic system and are not usable
        relations. Without this the chained-versus-single comparison has no denominator.
  independent_variables:
    - t
    - tk - n
    - presentation (chained eq. 5; single eq. 4; realized random map)
    - class count variant
    - subspace variant
    - curve coefficient B
    - random draw of R
  metrics:
    primary:
      - realized_decomposition_count_per_R
      - yield_ratio_to_eq11
      - yield_ratio_confidence_interval_95
      - ratio_trend_in_t
      - chained_minus_single_count_per_R
      - lemma2_side_condition_failure_fraction
    secondary:
      - poisson_goodness_of_fit_p_value
      - fitted_correction_factor_c_of_t
      - ratio_under_exact_multiset_class_count
      - y_outside_Fq_solution_fraction
      - enumeration_seconds_per_cell
      - peak_resident_gb
  heuristic_under_test: HEUR-003
  preregistered_prediction:
    quantity: >-
      The ratio of exactly enumerated decomposition yield to the eq. (11) prediction, as
      a function of t and tk - n.
    formula: >-
      realized_yield / P(n,m,t,k) < 1 with the 95% interval excluding 1 in every cell
      with t >= 3 and tk - n in [-2, +2], falling short by at least 20%; the ratio
      decreasing monotonically as t goes 2 -> 3 -> 4 at matched tk - n, with the t = 4
      ratio below the t = 2 ratio by at least a factor of 2; per-R counts Poisson with
      mean 2^{tk-n} * c(t) and c(t) < 1 decreasing in t (HEUR-003); chained and single
      counts agreeing per R except on the measured Lemma-2 failure fraction (HEUR-004).
      Direction is not a guess: it is forced by the paper's own inequality
      P(n,m,t,k) >= P(solve eq. 5).
    source: >-
      Semaev eq. (11) and the Section 4.3 inequality chain,
      inputs/SEMAEV-2015-310/paper_fulltext.md; Lemma 2 for the side condition; the
      three mechanisms of shortfall derived in H-SEMBIN-c5b2e0 (t! versus the exact
      multiset count, the F_{q^2}\F_q solutions, and the substituted upper bound).
  scale_relevance:
    tier: toy
    justification: >-
      n <= 24, chosen so |V|^t is exhaustively enumerable and the count is exact rather
      than estimated. Exactness is the point: at small tk - n a sampled yield has
      variance comparable to the effect, and sampling is the cheapest way to manufacture
      a discrepancy that is not there. The MAGNITUDE of the measured ratio is claimed
      only over this window; only the SIGN of the bias transfers to cryptographic
      parameters, and it transfers by the paper's own inequality rather than by any
      measurement here.
    correspondence: null
  tail_checks:
    - >-
      Compare the largest observed per-R decomposition count in each cell against its
      predicted extreme-value probability under the fitted Poisson law. A bulk fit that
      passes while the tail is wrong indicates the wrong law rather than a wrong
      constant.
    - >-
      Report the fraction of R with ZERO decompositions separately from the mean count.
      eq. (11) is a statement about exactly that fraction, so it is the directly
      comparable quantity and a ratio built from means could agree while it disagrees.
    - >-
      Report per-R chained-minus-single differences individually, not their mean. A mean
      of zero is consistent with a chain that loses solutions on some R and gains on
      others, which would refute HEUR-004 invisibly.
    - >-
      Report the m = t = 2 cells against H-RELN-96e3ba's reported 2^m-type discrepancy
      explicitly, with the comparison stated either way.
  replication:
    seeds: [20260913201, 20260913202, 20260913203, 20260913204, 20260913205]
    independent_instances: 2000
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 200
    maximum_workers: 1
  stopping_rules:
    - >-
      Stop and report a procedure defect if the recomputed eq. (11) fails to match the
      four printed decimals at the four published cells.
    - >-
      Stop and diagnose before any claim if the measured ratio comes out ABOVE 1. That
      would contradict the paper's own inequality chain and indicates an error in the
      enumeration or in the reading of the derivation; it is not a finding.
    - >-
      Stop the whole run if the realized-random-map control returns a ratio below 1: the
      pipeline is then producing the effect by itself.
    - >-
      Stop a cell at its cap and record it unreached with the size of V^t it needed.
      Never substitute sampling for enumeration in a cell that did not fit -- doing so
      silently converts an unreached cell into a noisy measurement, which is this
      experiment's principal false-positive route.
    - >-
      Do not add cells outside the declared window to strengthen a trend.
  invalidation_rules:
    - >-
      Any cell where enumeration was not exhaustive is invalid as a ratio measurement and
      is recorded as unreached.
    - >-
      The run is invalid if the exhaustiveness control shows order-dependent counts.
    - >-
      The run is invalid if the known-false class-count control does not shift the ratio
      by the expected t! factor, since the pipeline could not then attribute a
      discrepancy to the class count.
    - >-
      A chained-versus-single comparison is invalid for any R whose Lemma-2 side
      condition was not recorded, since the failure fraction is the comparison's
      denominator.
    - >-
      Solutions whose y_i lie in F_{q^2} \ F_q must be reported separately. A count that
      silently includes or silently excludes them is invalid, because the two
      conventions differ by exactly the quantity under measurement.
  success_criterion: >-
    eq. (11) reproduces the four published decimals; the realized-random-map control
    returns ratio 1 within its interval; and a measured ratio with a 95% interval is
    reported for every cell in the window, separately for the chained and single
    presentations, together with the Lemma-2 failure fraction. The sign of the bias
    entering stage-1 cost is stated with its derivation. A ratio indistinguishable from
    1 satisfies the criterion as an answer -- it refutes the hypothesis and vindicates
    eq. (11) -- provided the controls passed. The criterion additionally requires an
    explicit statement, either way, of whether HEUR-SEMAEV-2015-4.3 remains a sound
    comparator for EXP-RELN-164ad3.
  falsification_criterion: >-
    A ratio indistinguishable from 1 across the window refutes the hypothesis. A ratio
    above 1 contradicts the paper's own inequality and indicates a procedure defect.
    Per-R counts failing a Poisson fit where the control passes refutes HEUR-003's
    shape; a flat or increasing trend in t refutes the class-count explanation while
    possibly leaving the ratio < 1 intact, and the two must be reported separately.
    Chained and single counts differing beyond the measured Lemma-2 failure fraction
    refutes HEUR-004 and relocates the discrepancy from eq. (11) to eq. (5), which
    changes which of this program's conclusions follow.
  required_artifacts:
    - per-R decomposition counts in full, for both presentations, retained rather than aggregated
    - the zero-decomposition fraction per cell
    - the Lemma-2 side-condition outcome and the F_{q^2}\F_q solution count per R
    - measured ratio with 95% interval per cell per presentation per class-count variant
    - the Poisson fit and its goodness-of-fit statistic, and the fitted c(t)
    - all seven control outcomes
    - the exact command, git commit and dirty-tree state
    - field arithmetic implementation and version; the exact V basis used
    - random seeds and the R draw list per cell
    - peak resident memory and wall clock per cell
    - stdout and stderr, retained for failed and unreached cells
    - a machine-readable results table keyed by (n, m, t, k, presentation, class_count, subspace, B, seed)
    - the explicit statement about HEUR-SEMAEV-2015-4.3's comparator status
  assigned_to: executor
  approved_by: DEC-20260913-ebd639
  approval_basis: >-
    Standing user authorization of 2026-09-06. Approval asserts protocol completeness,
    not that H-SEMBIN-c5b2e0 is true.
  dependencies: []
  independence_note: >-
    This experiment depends on NO degree measurement and inherits neither Assumption 1
    nor Assumption 2, because it enumerates rather than solves. It may therefore run
    concurrently with EXP-SEMBIN-c2c312 rather than behind it.
  interpretation_limits:
    - >-
      A yield result says nothing about Assumption 1 or Assumption 2. eq. (11) is a
      probability model; those are degree bounds. Neither supports nor refutes the other.
    - >-
      A ratio below 1 makes Semaev's stage-1 cost an underestimate and moves the
      concrete crossover n. It cannot move the asymptotic exponent
      2^{1.6986 sqrt(n ln n)}, which absorbs a constant or t-dependent factor in P
      identically; saying otherwise would overclaim in exactly the direction
      docs/target-result-profile.md's cost-honesty clause forbids.
    - >-
      If HEUR-SEMAEV-2015-4.3 proves biased, EXP-RELN-164ad3 and H-RELN-96e3ba are
      immutable. The remedy is a new record and an additive amendment, never an edit.
    - >-
      No claim about the security of any deployed curve, in either direction.
