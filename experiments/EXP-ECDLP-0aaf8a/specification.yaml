# EXP-ECDLP-0aaf8a
# Digit-weight arithmetic. No curve point is added.
# Approved by DEC-20261003-0d122f.
experiment:
  id: EXP-ECDLP-0aaf8a
  hypothesis_id: H-ECDLP-10c2bf
  source_idea: IDEA-20261003-362fe2
  question_id: RQ-ECDLP-002
  version: 1
  title: Binary weight and non-adjacent weight of 15
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-0d122f
  objective: >-
    Check the weights 4 and 2, the product 8, and the nearby gap 0.
  inputs:
    value: 15
    binary_weight: 4
    naf_weight: 2
    weight_gap: 2
    weight_product: 8
    weight_sum: 6
    binary_length: 4
    naf_length: 5
    length_gap: 1
    nearby_a: 2
    nearby_b: 2
    nearby_gap: 0
    nearby_product: 4
  controls:
    - >-
      The integer 15 has binary weight 4. Reporting that weight as
      2 drops the gap and invalidates the run.
    - >-
      The non-adjacent digits from low to high are -1, 0, 0, 0, 1,
      so that weight is 2. Four exceeds two by 2. The product is
      8. The sum is 6. The binary length is 4 and the non-adjacent
      length is 5.
    - >-
      Two readings of the non-adjacent weight are both 2. Their gap
      is 0 and their product is 4.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {binary, naf, nearby}
    - route in {count, subtract}
  metrics:
    primary:
      - binary_weight
      - naf_weight
      - nearby_gap
      - implementations_agree
    secondary:
      - weight_product
      - weight_sum
      - naf_length
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The binary weight is 4. The non-adjacent weight is 2. The
      gap of two non-adjacent weights is 0.
    formula: >-
      Count the nonzero binary digits of 15. Count the nonzero
      non-adjacent digits of 15. Subtract 2 from 4. Multiply 4 by
      2. Subtract 2 from 2.
    source: >-
      IDEA-20261003-362fe2 states the integer 15 and the weights 4
      and 2, read 2026-10-03. The product, the sum, and the
      lengths were recomputed in this design session. That
      computation is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a curve addition.
    correspondence: null
  tail_checks:
    - The product 8 and the nearby gap 0 are required. A check that stops at the weight 4 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the weight 4 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The binary weight is not 4.
    - The non-adjacent weight is not 2.
    - The gap is not 2.
    - The product is not 8.
    - Both weights are reported as 2, or a curve point is added.
  success_criterion: >-
    Both runs agree that the binary weight is 4, that the
    non-adjacent weight is 2, and that 4 exceeds 2 by 2.
  falsification_criterion: >-
    The runs agree that the binary weight is computed, and that
    weight is not 4.
  required_artifacts:
    - experiments/EXP-ECDLP-0aaf8a/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-0aaf8a/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-0aaf8a/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-0aaf8a/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-0aaf8a/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-0aaf8a/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a weight gap of 2 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
