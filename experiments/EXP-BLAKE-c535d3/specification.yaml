experiment:
  id: EXP-BLAKE-c535d3
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-7dce27; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-7dce27
  question_id: RQ-BLAKE-584719
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Build the pairwise mode-separation matrix for BLAKE3's unkeyed, keyed and key-derivation
    modes over one initialisation map, resolving each cell by universal argument where possible and
    by concrete enumeration otherwise, against per-cell planted breakages.
  objective: 'The one uncertainty a run reduces is whether BLAKE3''s modes are pairwise separated
    at initialisation, and by which field in each case. Decomposed: (i) whether the modes and their
    stages enumerate from pinned primary text into a finite set of predicates over one initialisation
    map, and whether every flag word is fixed per mode rather than input-dependent -- because an input-dependent
    flag turns each matrix cell into a family and changes the experiment''s shape entirely; (ii) which
    cells admit a UNIVERSAL separating field, argued in writing and then checked against the enumerated
    class as a universality control, and which cells require concrete enumeration because the question
    is numeric (specifically, whether a keyed-mode key can equal a chaining value key derivation produces)
    -- a distinction the single-object framing hides and this re-representation is built to surface;
    (iii) whether the matrix is faithful, established by per-cell planted breakages that must each
    flip exactly one cell, since a breakage flipping several cells means the cells are not independent
    and the representation is not doing the work claimed for it. A run does NOT reduce uncertainty
    about exploitability, about the tree walk, or about anything downstream of initialisation.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for the modes enumerated from
      specification S at revision R, the pairwise separation matrix has C cells, of which C_u were
      resolved by a written universal argument naming field F_i for cell i and passing the universality
      control against class K x X, and C_e were resolved by concrete enumeration over K x X with the
      class sizes stated; U cells were found unseparated; and each of the P planted breakages flipped
      exactly its own cell. What does NOT follow: that an unseparated cell, if any, is exploitable
      -- this experiment has no means to assess exploitability and makes no such claim; that enumeration-resolved
      cells hold outside K x X; that construction-resolved cells hold if their written argument is
      wrong, since the argument and not the run is what covers all inputs there; or anything about
      the tree walk, the compression function, full BLAKE3, or any deployed system.'
  inputs:
    procedure: 'STAGE 0 (cost: agent time): pin the reference, validate against published vectors
      INCLUDING keyed and key-derivation vectors specifically. STAGE 1 (cost: agent reading time,
      zero compute): write Psi for every mode and stage; enumerate modes; check whether any flag bit
      is input-dependent. STAGE 2 (cost: agent writing time, zero compute -- the intellectual core):
      build the m(m-1)/2 cells and attempt a universal separating-field argument for each; record
      which cells resolve and which do not. STAGE 3 (cost: seconds to minutes): universality control
      -- evaluate every claimed universal field across the full K x X class and confirm it differs
      everywhere. STAGE 4 (cost: minutes): concrete enumeration for the residual cells, with chaining
      values computed rather than symbolic. STAGE 5 (cost: minutes): per-cell planted breakages; require
      exactly-one-cell localisation; plus the enumeration-branch planted control. STAGE 6 (cost: agent
      time): write the matrix with per-cell method, named field, class bounds, and the list of cells
      where nothing was discarded by the projection.'
    instrument: Python 3.11, standard library. The initialisation map re-implemented in pure Python
      and cross-checked against the pinned BLAKE3 C reference via ctypes on all keyed and key-derivation
      test vectors. Enumeration as direct evaluation with a dict keyed on (initial chaining value,
      initial flag word). Planted breakages implemented as alternative flag tables passed as an argument,
      so every null runs through the identical code path in the same invocation. Manifests and seeds
      via harness/runner.py. No solver and no Sage; the construction branch is prose and the enumeration
      branch is direct evaluation.
    parameters: 'Modes: unkeyed, keyed, key-derivation stage one (context), key-derivation stage two
      (material) -- four, subject to STAGE 1''s enumeration, giving 6 cells. Key set K: 256 keys comprising
      all-zero, all-one, single-bit-set (32 of them), single-bit-clear, keys equal to chaining values
      produced by key derivation on the context set (the adversarially structured subset, and the
      reason this branch is concrete rather than symbolic), and 128 drawn from a recorded seed. Context
      set X: 128 strings comprising empty, single-byte, long, and strings chosen to make stage-one
      outputs structured, plus seeded random ones. Planted breakages: one per construction-resolved
      cell, plus one enumeration-branch control. Total evaluations bounded by 4 modes x 256 keys x
      128 contexts and reported exactly.'
  controls:
  - Per-cell planted-breakage variants (flag words merged for one specified mode pair each), requiring
    exactly-one-cell localisation.
  - 'Enumeration-branch planted control: a variant feeding key material identically in two modes,
    which the concrete enumeration must find within the declared class.'
  - Test-vector precondition covering keyed and key-derivation modes specifically, since those are
    the modes under audit and a reference that is right only in the default mode would be silently
    wrong here.
  - 'Universality control for every construction-level resolution: the claimed always-differing field
    must be checked against the full enumerated class as well, so that a construction argument is
    never accepted on its own.'
  - 'Independence control: the count of cells flipped per planted variant, reported per variant rather
    than in aggregate.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Planted-breakage nulls at the matrix level: variants of Psi in which
    two specified modes'' flag words are made identical, one variant per cell that stage three resolved
    at construction level. Each planted variant must be caught by the matrix, IN THE CORRESPONDING
    CELL AND NOT ELSEWHERE, which is a stronger requirement than catching it at all and is the point
    of a matrix representation. What the null must show for the signal arm to mean anything: for every
    construction-resolved cell, the planted variant that removes that cell''s separating field must
    flip exactly that cell to unseparated while leaving other cells unchanged. If a planted breakage
    flips several cells, the cells are not independent and the matrix representation is not faithful
    -- which would itself be a finding about the representation and must be reported rather than patched.
    A second null covers the enumeration branch: a variant in which key material is fed identically
    in two modes, which the enumeration must find as a concrete collision within the declared class.'
  independent_variables:
  - mode and stage
  - key material
  - context string
  - arm (real | planted breakage variant)
  metrics:
    primary:
    - per-cell resolution method
    - per-cell named separating field
    - count of unseparated cells
    - cells flipped per planted variant
    - universality control pass/fail per construction-resolved cell
    secondary:
    - class sizes |K| and |X|
    - count of distinct (cv, flags) initial pairs observed
    - list of cells where the projection discards nothing
    - wall-clock per stage
    - count of input-dependent flag bits found at STAGE 1
  heuristic_under_test: null
  preregistered_prediction:
    quantity: 'Predicted: the number of unseparated cells in the real matrix, and the localisation
      count for each planted breakage.'
    formula: 'Unseparated(real) = |{cells (a,b) : exists k1,x1,k2,x2 with Psi(a,k1,x1) = Psi(b,k2,x2)}|
      is predicted to equal 0, where equality is over the full pair (initial chaining value, initial
      flag word) with chaining values compared as concrete 256-bit values. Localisation is predicted
      as: for each planted variant v targeting cell c, Flipped(v) = 1 and the flipped cell is exactly
      c. A run in which Flipped(v) > 1 for any v falsifies the matrix representation''s faithfulness
      and is reported as a result about the representation rather than about the design.'
    source: Pre-registered in the parent proposal IDEA-20260816-7dce27 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The construction branch is not a toy at all: a correct universal argument covers
      every input, and the record must claim that scope where it earns it rather than under-claiming.
      The enumeration branch is toy: 256 keys and 128 context strings out of 2^256 and unbounded strings
      respectively, and its class boundary is the deliverable''s scope for those cells. NO EXTRAPOLATION
      from the enumerated class to general keys or contexts is performed or implied, and cells resolved
      by enumeration are labelled distinctly from cells resolved by argument precisely so a reader
      cannot conflate the two scopes.'
    correspondence: null
  tail_checks:
  - Inspect the adversarially structured key subset (keys set equal to derived chaining values) individually,
    since that subset is the entire reason the enumeration branch exists and averaging it into the
    random keys would hide its result.
  - Check whether any planted breakage flipped zero cells, which would mean the matrix is insensitive
    rather than faithful.
  - Examine the longest and empty context strings specifically, where length-encoding special cases
    concentrate.
  - Verify that the count of distinct initial pairs equals the count of distinct (mode, key, context)
    inputs wherever the projection is claimed lossless.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - HALT at STAGE 1 if any flag bit is found input-dependent, since the matrix as specified no longer
    describes the object.
  - HALT if any universality control fails, since a construction-resolved cell would then be resting
    on a false argument.
  - HALT and escalate to maintainer disclosure, before any other record, if an unseparated cell survives
    hand re-derivation.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run succeeds if every cell carries a resolution method and a named separating
    field, every construction-resolved cell passes its universality control, every planted breakage
    flips exactly one cell, and the enumerated class bounds are stated for enumeration-resolved cells
    -- whether or not any cell required enumeration and whether or not the unseparated count is zero.
  falsification_criterion:
  - A planted breakage flips more or fewer than one cell.
  - A universality control fails.
  - An input-dependent flag bit is found.
  - The reference fails a keyed or key-derivation test vector.
  - Every cell is found to be a change of coordinates with nothing discarded, so the re-representation
    added no object.
  - An unseparated cell survives hand re-derivation.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-7dce27
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The flag-word layout and the exact initialisation for keyed and key-derivation modes are unread;
    the specification is not filed as KN-LIT and RQ-BLAKE-584719's first constraint blocks approval.
  - The mode count m (and therefore the cell count) is not fixed until STAGE 1; the parameters here
    assume four and a Coordinator must confirm or correct it.
  - Whether the adversarially structured key subset is constructed correctly depends on key derivation's
    output width and format, which is unread.
  - The relationship between this record and the input-side symbolic audit -- specifically which record
    owns the concrete-chaining-value cell -- is a sequencing and ownership decision a Coordinator
    must make to prevent two records claiming the same cell.
