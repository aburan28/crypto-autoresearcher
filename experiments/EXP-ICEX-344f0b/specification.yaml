experiment:
  id: EXP-ICEX-344f0b
  hypothesis_id: H-ICEX-76c6bb
  derived_from_idea: IDEA-20260901-e849e4
  question_id: RQ-SNFS-005666
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    End-to-end special-versus-general number field sieve on ONE implementation at a pinned commit and
    ONE named machine, three arms per cell on the SAME composite - special, same-degree
    large-coefficient null, and the implementation's own optimal general polynomial - with memory
    beside time per stage, interleaved repetitions reported as distributions, independently
    re-verified certificates, a discrete-logarithm arm on openly constructed special primes, and an
    explicit prohibition on comparing any measured time against any published record-scale figure
  objective: >-
    Reduce the uncertainty the governing goal names as its first parallel action and which no proposal
    has instantiated: WHERE the special sieve actually beats the general sieve, on one implementation
    and one machine, across a declared grid of sizes and forced degrees, with memory beside time. The
    program's current knowledge of this crossover is a recalled folklore figure with no stated
    implementation, machine, or charging convention.
    THE COMPARABILITY DISCIPLINE IS THE MEASUREMENT, NOT ITS HOUSEKEEPING. A crossover is a ratio, and
    a ratio is a measurement only if numerator and denominator were produced under the same
    conditions. Every ratio here is between arms run ON THE SAME COMPOSITE, at the same pinned commit,
    on the same named machine with pinned cores, under one frozen charging convention, with arms
    interleaved so that machine drift affects them equally. No published record-scale figure and no
    folklore constant enters any denominator.
    A second uncertainty is reduced at the same cost: whether the headline ratio is a coefficient-size
    effect or a degree-mismatch effect. The third arm separates them, and without it the headline
    ratio confounds two things that move in opposite directions.
  what_this_is_not:
    - >-
      Not a record attempt and not an attack on any real parameter set. The composites and primes are
      openly constructed by this program under a recorded seed policy and are not models of anyone's
      parameters.
    - >-
      NOT A TRAPDOOR CONSTRUCTION. No hidden-special construction is used, reimplemented, approximated
      or reconstructed from memory. An openly special prime is a different object from a hidden one and
      is used only to measure where the special sieve pays.
    - >-
      Not a detectability measurement. No statistic battery, no freeze order and no trapdoored class is
      touched; that lane owns those questions.
    - >-
      Not a norm-distribution proxy. A companion record computes the advantage as a histogram shift and
      forbids reporting it as a time; this contract runs the sieve and reports times and memory, using
      that record's null as its third arm.
    - >-
      Not a comparison against the literature. No measured time in this run may be divided by, or
      compared with, any published record-scale figure; those are different implementations on
      different clusters with different tuning.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence.
      approved_by is null.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: on ONE named implementation at a pinned commit, on ONE named machine
      under the frozen charging convention, over the grid actually run, the special sieve's total time
      and peak memory relative to the implementation's own general sieve ON THE SAME COMPOSITE are X,
      decomposed into a coefficient-size factor and a degree-mismatch factor, with the crossover at the
      highest forced degree located at size Y by interpolation and the fitted slope against the size
      function equal to Z. WHAT DOES NOT FOLLOW: nothing about any other implementation, machine or
      tuning; nothing at any size beyond the grid, since the lower-order term of the sieve exponent is
      large here; nothing about detectability; and nothing about any real, published or deployed
      parameter set.
  inputs:
    procedure: >-
      STEP 0 (blocking, zero compute). Commit and hash: the implementation commit and build
      configuration; the MACHINE description including core count, memory, storage and the pinned-core
      allocation; the grid of sizes and forced degrees; the special-form seed policy; the
      trial-division bound and elliptic-curve-method effort for cofactoring, with the required cofactor
      size tolerance; the parameter files for EVERY arm; the charging convention; the repetition counts
      and the interleaving order; and the acceptance bands for every predicted ratio. Re-read the
      companion record supplying the asymptotic shape and record its two exponents verbatim rather than
      as a paraphrase. Verify from the implementation's source that the factoring and discrete-logarithm
      pipelines share the sieve and filtering code paths, which is the rigorous half of the transfer
      heuristic.
      STEP 1 (generation). Generate the special composites and their special polynomial pairs, the
      same-degree large-coefficient pairs, and the special and random primes for the discrete-logarithm
      arm, all under recorded seeds. Record the polynomial pairs of ALL THREE ARMS per cell together
      with the polynomial quality measure of each, the achieved cofactor size, and any redraws.
      STEP 2 (the factoring arms). For each cell, run the three arms END TO END on the SAME composite,
      INTERLEAVED, collecting per stage: wall-clock seconds, CPU seconds, peak resident set, relation
      count, matrix rows and matrix density. Re-verify each factorisation independently by multiplying
      the factors back and testing their primality BEFORE any timing from that cell is read.
      STEP 3 (the discrete-logarithm arm). At the two declared sizes, run the pipeline on the openly
      special prime and on a random prime of the same size, collecting the same per-stage counters.
      Re-verify each logarithm independently by exponentiation in the subgroup before any timing is read.
      STEP 4 (the parameter-sweep control). At one declared cell, sweep the special arm's factor-base
      bounds over a declared small set, to bound the effect of general-tuned parameter files, and report
      the spread.
      STEP 5 (analysis). Compute the ratio vectors and the two-factor decomposition per cell from
      MEDIANS over the interleaved repetitions, with the full per-repetition values archived. Fit the
      slopes against the size function; interpolate the crossovers. Emit the grid table with the
      (time, memory) statement per cell, the discrete-logarithm comparison, and the artifact manifest
      with a rebuild receipt.
    instrument: >-
      The implementation is invoked UNMODIFIED at the pinned commit. The driver under
      experiments/EXP-ICEX-344f0b/driver/ generates composites and polynomial pairs, schedules the
      interleaved arms on the pinned cores, collects per-stage counters from the implementation's own
      output plus an external resident-set sampler, and re-verifies every certificate independently of
      the implementation that produced it. Recorded through harness/runner.py.
    parameters: >-
      THE INSTANCE SET IS FIXED IN STEP 0 AND ALL THREE ARMS RUN ON THE SAME COMPOSITE AT EVERY CELL.
      Grid: four composite sizes crossed with four forced special-polynomial degrees. Repetitions: at
      least two per cell at the smaller three sizes, at least one at the largest, interleaved across
      arms. Discrete-logarithm arm at two of the sizes. Cofactor within a declared tolerance of the
      target size, with the achieved size recorded per cell. THE MACHINE IS NAMED AND PINNED, no other
      declared workload runs on it, and every row carries it.
  controls:
    - >-
      THIRD ARM, THE NON-SPECIAL NULL OF THE SAME SHAPE, BLOCKING: a same-degree large-coefficient base-m
      polynomial run END TO END on the SAME composite. It separates the coefficient-size effect from the
      degree-mismatch effect, which move in opposite directions and are otherwise confounded in the
      headline ratio.
    - >-
      SELF-CONSISTENCY CELL, BLOCKING: at the cell where the implementation's own chosen general degree
      equals the forced degree, the degree-mismatch ratio MUST be near one. This control can fail, and
      its failure voids the two-factor decomposition while leaving the headline ratio standing.
    - >-
      SAME-COMPOSITE DISCIPLINE, the contract's central control: the general arm runs on the SAME
      composite as the special arm, so the comparison carries no between-instance confound. A ratio
      formed across different composites, machines, commits or charging conventions is an invalidation
      condition, not a caveat.
    - >-
      INTERLEAVED REPETITIONS WITH PINNED CORES: arms are interleaved so machine drift affects them
      equally, and every cell's cost is reported as a DISTRIBUTION over repetitions rather than as a
      single number.
    - >-
      CERTIFICATES RE-VERIFIED INDEPENDENTLY BEFORE ANY TIMING IS READ - factorisations by multiplying
      back and primality testing, logarithms by exponentiation in the subgroup. A cell whose certificate
      fails has its timings DISCARDED, not caveated.
    - >-
      DISCRETE-LOGARITHM ARM ON OPENLY SPECIAL VERSUS RANDOM PRIMES, at two sizes. The random prime is
      the non-special object of the same shape on the discrete-logarithm side, and no hidden trapdoor
      construction appears anywhere in the run.
    - >-
      PARAMETER-SWEEP CONTROL at one cell, bounding the effect of general-tuned parameter files on the
      special arm. The ratio is otherwise read at the implementation's own defaults and every row is
      LABELLED with the parameter regime it was measured under.
    - >-
      POLYNOMIAL-QUALITY ACCOUNTING: the standard polynomial quality measure is recorded for every
      polynomial in every arm and reported beside every ratio, since the special polynomial's root
      properties differ from a general one's independently of coefficient size.
    - >-
      PRE-REGISTRATION, BLOCKING: the grid, seeds, parameter files, charging convention and acceptance
      bands are hashed before any run, and every output is compared against that committed file.
    - >-
      CURVE-FREE NULL - NOT APPLICABLE AND RECORDED AS SUCH RATHER THAN OMITTED. The standing scope
      constraint requires a curve-free null wherever a non-curve object could reproduce the signature
      and the result could be misread as a statement about elliptic curves or the ECDLP. NO ARM OF THIS
      CONTRACT INVOLVES AN ELLIPTIC CURVE at any point - the objects are integers, number fields and
      prime-field multiplicative groups - so no such misreading is available. The constraint's spirit,
      that a non-special object of the same shape must reproduce the signature before special structure
      is credited for it, is discharged by the third arm and by the random-prime discrete-logarithm arm,
      both of which are blocking.
  independent_variables:
    - composite size, across four grid values
    - forced special-polynomial degree, across four values
    - arm - special, same-degree large-coefficient, optimal general
    - problem - factoring versus discrete logarithm
    - repetition index within a cell
    - factor-base bound, in the parameter-sweep control cell only
  metrics:
    primary:
      - >-
        per-stage wall-clock seconds and CPU seconds, per cell per arm per repetition, on the NAMED
        machine. Archived per repetition; summarised by the MEDIAN with the full range shown. A single
        run's time is not a legitimate summary of a stage whose cost varies between invocations, and
        this contract prohibits quoting one.
      - >-
        per-stage peak resident set in GiB, per cell per arm per repetition, sampled by an external
        sampler on the process group under the frozen definition. Reported BESIDE time on every row, as
        the governing goal requires.
      - >-
        relation count, matrix rows and matrix density per cell per arm. MACHINE-INDEPENDENT COUNTERS:
        they let a reader separate a hardware effect from an algorithmic one, and they are what a
        different machine could reproduce.
      - >-
        coefficient_size_ratio(cell) = median relation-collection time of the special arm divided by
        that of the same-degree large-coefficient arm ON THE SAME COMPOSITE, dimensionless, with an
        interval from the repetitions.
      - >-
        degree_mismatch_ratio(cell) = median relation-collection time of the same-degree
        large-coefficient arm divided by that of the optimal-general arm on the same composite,
        dimensionless, with an interval.
      - >-
        headline_ratio(cell) = median total time of the special arm divided by that of the
        optimal-general arm on the same composite, dimensionless, with an interval. Equal to the product
        of the two factors above up to the stages not in relation collection, and that identity is
        checked per cell.
      - >-
        crossover_size(degree): the size at which headline_ratio crosses one, interpolated on the grid,
        with the interpolation method fixed in advance and the bracketing cells reported.
      - >-
        slope_in_size_function(degree): the fitted slope of the logarithm of coefficient_size_ratio
        against the standard size function at fixed forced degree, dimensionless, against the declared
        band around the asymptotic difference of the two exponent constants.
      - >-
        memory_ratio(cell): peak resident set of the special arm over the optimal-general arm in the
        linear-algebra stage, and the matrix-row ratio, dimensionless.
      - >-
        dlp_headline_ratio(size): median total time on the openly special prime over the random prime of
        the same size, dimensionless, with an interval, and the CLASSIFICATION - special wins or loses -
        compared against the factoring cell at the same size and degree within the declared band.
    secondary:
      - >-
        the polynomial pairs of all three arms per cell, with the polynomial quality measure of each.
      - >-
        the achieved cofactor size per cell against the target, and every redraw with its reason.
      - >-
        the self-consistency cell's degree-mismatch ratio.
      - >-
        the parameter-sweep control's spread at the declared cell, and the parameter regime label on
        every other row.
      - >-
        the certificate re-verification outcome per cell, as a pass or fail flag with the verification
        method named.
      - >-
        per-stage input-output volume and storage high-water, since the sieve's disk cost is a real
        resource this comparison would otherwise hide.
      - >-
        the Step 0 committed file with its hash, including the verbatim quotation of the companion
        record's two exponents.
      - >-
        cells dropped for budget, with the reason and the size reached, listed explicitly.
  heuristic_under_test: HEUR-XOV-1
  preregistered_prediction:
    quantity: >-
      coefficient_size_ratio and its monotonicity; degree_mismatch_ratio including the self-consistency
      cell; crossover_size at the highest forced degree; headline_ratio at the two largest sizes for the
      middle degrees; slope_in_size_function; memory_ratio; and dlp_headline_ratio's classification.
    formula: >-
      THE PREDICTION IS A SHAPE AND A SIGN, NOT A VALUE, and the reason is stated rather than hedged:
      at these sizes the lower-order term of the sieve exponent is not small, so the asymptotic constants
      set a direction and a band and nothing narrower.
      coefficient_size_ratio is below the declared threshold at every cell and monotone decreasing in
      size at fixed forced degree, because at matched degree the special arm's norm product is smaller by
      the coefficient bound.
      degree_mismatch_ratio is above one whenever the forced degree exceeds the implementation's chosen
      degree by two or more, increases with the degree gap, and is NEAR ONE at the self-consistency cell.
      A crossover in headline_ratio exists at the highest forced degree, at or above the lower end of the
      grid.
      slope_in_size_function is NEGATIVE with magnitude inside the declared band around the asymptotic
      difference of the two exponent constants.
      memory_ratio is below one wherever the special arm wins on time, since a smaller factor base gives
      a smaller matrix.
      dlp_headline_ratio gives the SAME classification as the factoring cell at the same size and degree,
      within the declared band.
      THE NUMERIC THRESHOLDS AND BANDS ARE FIXED IN THE STEP 0 COMMITTED FILE AND HASHED BEFORE ANY RUN.
      No value is transcribed here from any published computation, and no measured time in this run may
      be compared against one.
    source: >-
      The three-arm design, the grid, the discrete-logarithm arm, the controls and the falsification
      conditions are taken from IDEA-20260901-e849e4, read in full by TASK-20260904-8f2f95 on 2026-09-04.
      The two norm-size exponents behind the predicted shape come from a companion record in this lane
      which this session did NOT open; Step 0 re-reads it and quotes it verbatim, and the run is read
      against what it actually says rather than against the parent proposal's paraphrase. The
      lower-order-term observation and the record-scale comparisons are RECALLED at this session's
      remove - the parent reports fetched summaries, this session opened nothing - and support nothing.
      Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      The grid sits where the full pipeline can be run END TO END, repeatedly, in both arms, within a
      declared budget - which is the only way to obtain a ratio rather than a proxy. THE TESTED SIZES
      ARE THE CLAIMED SIZES. Everything measured lives inside the lower-order term of the sieve exponent
      at these sizes, so the deliverable is the shape and the measured slope; a conditional projection to
      larger sizes may be LABELLED as one but is not a result of this run and no unlabelled extrapolation
      is permitted.
    correspondence: null
  tail_checks:
    - >-
      Report the full per-repetition timings, not only the medians, and the range at every cell. A stage
      whose repetitions disagree by more than the declared factor is reported as unstable and its ratio
      is quoted with that instability rather than smoothed.
    - >-
      Report the largest-size cell at each forced degree against the trend fitted on the smaller cells
      with that cell HELD OUT. A trend that does not predict its own held-out endpoint is reported as
      not predictive.
    - >-
      Report the slowest stage per arm per cell, so that a total-time ratio driven entirely by one stage
      is visible as such rather than presented as a pipeline-wide effect.
    - >-
      Report the storage high-water and input-output volume at the largest cells, since a time ratio that
      ignores a disk bottleneck is not a cost comparison.
    - >-
      Report every cell whose certificate failed re-verification individually, with its stage counters
      discarded, rather than aggregating around it.
  replication:
    seeds:
      - 20260904
      - 20260905
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 86400
    total_cpu_hours: 800
    maximum_memory_gb: 32
    maximum_runs: 120
  stopping_rules:
    - >-
      Drop the largest-size cells rather than reducing their repetitions or swapping their arms if the
      budget binds. A dropped cell is recorded as dropped WITH the size reached; it is a budget outcome
      and never evidence.
    - >-
      DISCARD the timings of any cell whose certificate fails independent re-verification, and record the
      failure. A timing for a computation whose output is unverified measures nothing.
    - >-
      HALT the two-factor decomposition, while continuing to report the headline ratio, if the
      self-consistency cell's degree-mismatch ratio is far from one. This is a stopping rule on a claim,
      not on the run.
    - >-
      Stop at the frozen grid. No size, degree, arm or parameter file is added after any ratio has been
      seen.
    - >-
      Stop at maximum_runs, total_cpu_hours or wall_clock_seconds_per_run, whichever binds first. Budget
      exhaustion is a stop and is never a negative result.
  invalidation_rules:
    - >-
      A timeout, crash, out-of-memory kill or dependency failure makes that cell failed_infrastructure
      and is NEVER negative mathematical evidence.
    - >-
      A run that forms any ratio between arms that did NOT run on the same composite, at the same pinned
      commit, on the same named machine, under the same charging convention, is invalid_measurement. This
      is the contract's central discipline and its violation is not repairable by annotation.
    - >-
      A run that compares any measured time against a published record-scale figure or a folklore
      crossover constant is invalid_measurement.
    - >-
      A run reporting a cell's cost as a single number without its per-repetition values and range is
      invalid_measurement.
    - >-
      A run reporting time without peak resident set for the same stage is invalid_measurement; the
      governing goal requires memory beside time.
    - >-
      A run reporting a timing from a cell whose certificate was not independently re-verified is
      invalid_measurement.
    - >-
      A run that uses, reimplements or approximates any hidden-special construction is
      invalid_measurement and a scope violation.
    - >-
      A run whose grid, seeds, parameter files, charging convention or acceptance bands differ from the
      Step 0 committed file is a DIFFERENT experiment and needs a new contract.
  success_criterion: >-
    The run yields interpretable evidence when ALL of the following hold: (1) the Step 0 committed file,
    including the verbatim quotation of the companion record's exponents and the named machine
    description, is archived and hashed before any run; (2) all three arms ran on the SAME composite at
    every reported factoring cell, interleaved, with per-repetition costs archived; (3) every reported
    cell's certificate was independently re-verified before its timings were read; (4) every row carries
    per-stage wall-clock seconds, CPU seconds and peak resident set, plus relation count, matrix rows and
    matrix density; (5) the self-consistency cell's degree-mismatch ratio is reported; (6) the two-factor
    decomposition reconciles with the headline ratio per cell; (7) the crossover at the highest forced
    degree is located or its absence is stated with the bracketing cells; (8) the slope against the size
    function is reported with its declared band; (9) the discrete-logarithm arm is reported at both sizes
    with its classification against the matching factoring cell; (10) dropped cells are listed with the
    size reached.
  falsification_criterion:
    - >-
      coefficient_size_ratio at or above one at any cell. The end-to-end small-coefficient advantage fails
      there and contradicts the norm-level proxy; the record reconciles by measuring that cell's norm
      distribution with the proxy's instrument and reporting which is wrong.
    - >-
      No crossover at the highest forced degree within the grid and none implied by the trend. The
      degree-mismatch effect is weaker at these sizes than the norm arithmetic suggests, reported with the
      measured ratios and the bracketing cells.
    - >-
      slope_in_size_function non-negative, or outside its declared band, at any forced degree. The
      predicted shape is contradicted at these sizes; the lower-order term dominates and the run licenses
      NO extrapolation.
    - >-
      The self-consistency cell's degree-mismatch ratio is far from one. The third arm is not isolating
      what it was built to isolate; the two-factor decomposition is VOID and only the headline ratio
      survives.
    - >-
      The discrete-logarithm classification disagrees with the factoring classification beyond the declared
      band. The transfer heuristic fails, a discrete-logarithm-specific ingredient is localised, and the
      discrete-logarithm crossover is stated separately.
    - >-
      memory_ratio above one at a cell where the time ratio is below one. The crossover is a TRADEOFF and
      must be stated in both coordinates; quoting the time ratio alone is prohibited.
    - >-
      A certificate fails re-verification. That cell's timings are discarded rather than caveated.
  required_artifacts:
    - manifest.yaml with exact command, commit sha, dirty-tree state, resolved inference block, environment, the implementation's pinned commit and build configuration, and the NAMED machine with its pinned-core allocation
    - the Step 0 committed file with its hash - grid, seeds, cofactor policy, parameter files for every arm, charging convention, repetition and interleaving plan, acceptance bands - and the verbatim quotation of the companion record's two exponents
    - the polynomial pairs of all three arms per cell, with each polynomial's quality measure, the achieved cofactor size, and every redraw with its reason
    - raw-result.json with per-stage wall-clock seconds, CPU seconds, peak resident set, relation count, matrix rows and matrix density, PER REPETITION, for every cell and arm
    - the certificate re-verification output per cell, with the method named, timestamped before the timings were read
    - the coefficient-size and degree-mismatch ratios with intervals, and the identity check reconciling them against the headline ratio
    - the interpolated crossovers per forced degree with their bracketing cells, and the fitted slopes with their declared bands
    - the memory ratios and matrix-row ratios per cell
    - the discrete-logarithm arm's complete results at both sizes with its classification comparison
    - the parameter-sweep control's spread at the declared cell, and the parameter-regime label on every other row
    - the storage high-water and input-output volume at the largest cells
    - the list of dropped cells with the size reached, and a rebuild receipt for the artifact set
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not confer approval. status is draft, frozen is false,
      execution_authorized is false, approved_by is null.
    - >-
      This is by far the most expensive contract in its batch. Approval must confirm the total CPU-hour
      budget, the drop rule for the largest cells, and that a dropped cell is recorded as a budget outcome
      rather than as a result.
    - >-
      Approval must confirm the machine is exclusively available and its cores pinned for the duration.
      Every number in this run is a ratio between interleaved arms, and a shared machine would put the
      confound back into the one place the design removes it from.
    - >-
      Approval must confirm the charging convention and the parameter files for all three arms before any
      run. The special arm runs under general-tuned parameters by default, which is a disclosed bias in a
      stated direction; the parameter-sweep control bounds it but does not remove it.
    - >-
      Approval should confirm the scope prohibitions explicitly: no trapdoor construction, no detectability
      statistic, no allegation about any real parameter set, and no comparison against any published
      record-scale figure.
  derivation_provenance:
    tool: coordinator-authored contract under TASK-20260904-8f2f95
    source_record: IDEA-20260901-e849e4
    authored_at: '2026-09-04'
    note: >-
      The three-arm design, the size-by-degree grid, the discrete-logarithm arm on openly constructed
      special primes, the six controls, the five falsification conditions and the scope prohibitions are
      taken from the parent proposal and restated as measured quantities with units and decision rules.
      Added by this contract: the same-composite, same-commit, same-machine, one-charging-convention
      discipline as an invalidation rule rather than an aspiration; interleaved repetitions with costs
      reported as distributions and medians rather than single numbers; machine-independent counters
      beside every timing; certificate re-verification as a precondition for reading a timing rather than
      as an artifact; the explicit prohibition on comparing measured times against published record-scale
      figures; and the explicit recording of WHY the standing curve-free-null constraint is not applicable
      here, with the third arm and the random-prime arm named as what discharges its spirit. The two
      norm-size exponents are re-read verbatim in Step 0 rather than adopted from the parent's paraphrase.
  derivation_gaps:
    - >-
      The asymptotic shape comes from a companion record this session did not open. Step 0 re-reads it and
      quotes it verbatim; if what it states differs from the parent proposal's paraphrase, the band is
      restated from the verbatim text and the difference is recorded rather than absorbed.
    - >-
      At these sizes everything measured lives inside the lower-order term of the sieve exponent. Only the
      sign and the monotonicity are relied on, and a fitted slope agreeing with the asymptotic difference
      is CONSISTENCY, not confirmation.
    - >-
      The implementation's parameter files are tuned for general inputs, so the special arm may be
      under-tuned. The one-cell parameter sweep bounds this but cannot remove it; every ratio carries its
      parameter-regime label and the bias direction is disclosed.
    - >-
      The special polynomial's root properties differ from a general polynomial's independently of
      coefficient size. The quality measure is recorded for every polynomial, but the coefficient-size
      ratio and the root-property difference are not fully separable at this grid size, and that is
      disclosed rather than presented as separated.
    - >-
      The special polynomial's norms are set by the full special integer while the general arm sees only
      the cofactor. Cells are chosen with the cofactor close to the full size and the achieved sizes are
      recorded per cell, but the residual mismatch is a disclosed bias in a stated direction.
    - >-
      Whether the largest cells complete within budget is unknown. If they do not, the crossover at the
      highest forced degree may fall outside the completed grid, and the run reports the bracketing cells
      and the absence rather than extrapolating a crossover it did not reach.
