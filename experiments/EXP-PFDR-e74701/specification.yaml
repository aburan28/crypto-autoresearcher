experiment:
  id: EXP-PFDR-e74701
  hypothesis_id: H-PFDR-e0988d
  question_id: RQ-ECDLP-002
  idea_id: IDEA-20260815-6ee0d3
  batch_id: BATCH-2eaca1
  version: 1
  recorded_at: '2026-09-04'
  drafted_under_task: TASK-20260904-b2a7e9
  batch_position: 1 of 4 (theory-gov; the only arm of this batch that touches a curve)
  title: >-
    Orbit smoothness of integer lifts of x-coordinates on E(F_p), measured
    on the x-line against an EXACTLY COMPUTED Psi(p,B) reference, with the
    composition statistic delta_add the folklore is actually about,
    calibrated by spike injection so a null result is a BOUND, and run
    identically on four non-elliptic objects -- random integers, a
    multiplicative orbit, a cuspidal cubic and a nodal cubic -- so that any
    signal is attributed before it is believed
  status: draft
  approved_by: null
  approved_at: null
  status_note: >-
    Written and frozen at the /design-experiment stage; NOT submitted for
    approval and NOT authorized for implementation. 'draft' is the canonical
    first state of the experiment machine in AGENTS.md ("Research states"):
    draft -> review_required -> approved -> running -> completed |
    failed_infrastructure | invalid -> analyzed -> archived. The originating
    handoff TASK-20260904-b2a7e9 initially mandated 'designed', which is not
    in that machine; the designing coordinator flagged the conflict rather
    than silently choosing, and the handoff was corrected to 'draft'.
  assigned_to: executor
  implementation_authorized: false
  implementation_authorized_note: >-
    No implementation, no run, no curve generation is authorized by this
    record. Execution begins only from a Coordinator approval decision plus
    a frozen contract at this path, per AGENTS.md "Inter-agent messaging".
  claim_ceiling: >-
    toy-scale distributional measurement only. No attack, no exponent, no
    cost model, no ECDLP claim, no hypothesis or goal status change. The
    only positive deliverable available to this contract is a measured
    upper bound on the composition statistic delta_add at the tested
    (p, u), stated with its minimum detectable effect.
  claim_tier_basis: >-
    EMPIRICAL_ONLY at claim_tier toy per docs/claims-and-verification.md.
    No solve is claimed and no certificate kind arises: the experiment
    solves no discrete logarithm and computes no relation. Claim (A) of
    H-PFDR-e0988d is a DERIVATION and is archived as a derivation note,
    separately from any measured statistic.
  objective: >-
    Decide, at the tested scope, whether the integer lift of the
    x-coordinate along a scalar orbit on E(F_p) carries any smoothness
    structure -- marginal, lag, or compositional -- that (i) exceeds a
    shape-matched null, (ii) decays with p as a real effect must, and
    (iii) is absent from four non-elliptic objects of the same shape. The
    experiment exists because the additive/multiplicative mismatch is
    stated everywhere as folklore and nowhere as a measurement, and because
    the derivation that no COMPOSITION LAW exists is routinely conflated
    with the untested claim that no STATISTICAL DEPENDENCE exists. The
    deliverable in the expected (null) case is the bound
    |delta_add| <= MDE, never the phrase 'no correlation'.
  inputs:
    primes: '65537, 262147, 1048583, 4194319, 16777259 (5 primes, 2^16 to 2^24)'
    curves_per_prime: >-
      4 curves y^2 = x^3 + ax + b over F_p with |E(F_p)| prime, found by a
      declared seeded search over (a, b) rejecting singular curves and
      curves of non-prime order; the accepted (a, b, |E|, P) tuples are
      recorded in full
    lift_convention: 'L(z) = least non-negative integer representative in [0, p); FROZEN'
    smoothness_parameter: >-
      u in {1.5, 2.0, 2.5, 3.0, 3.5}; B = round(p^{1/u}). B is DERIVED from
      u and never fixed directly, so rates are comparable across p and the
      decay test in P6 is meaningful
    marginal_reference: >-
      Psi(p, B)/p, the EXACT count of B-smooth integers in [1, p) divided
      by p, computed from the smallest-prime-factor sieve. No
      Dickman-de Bruijn asymptotic enters any comparison
    composition_sample: 'M = 2000000 seeded unordered pairs (k, j) per cell'
    shuffles_per_cell: 32
    injection_levels: 'epsilon in {0.001, 0.003, 0.01}'
    orbit_range: 'k in [1, (n-1)/2] where n = ord(P); the x-line quotient by plus-or-minus one'
    non_elliptic_objects: >-
      NULL-RANDINT uniform integers in [0, p); NULL-MULT the multiplicative
      orbit L(g^k) for g a generator of F_p^*; NULL-CUSP the cuspidal cubic
      y^2 = x^3 with nonsingular locus isomorphic to (F_p, +) by
      (x, y) -> x/y, inverse s -> (s^{-2}, s^{-3}); NULL-NODE the split
      nodal cubic y^2 = x^2(x + 1) with nonsingular locus isomorphic to
      F_p^* by w = (m + 1)/(m - 1) where m^2 = x + 1, inverse
      x(w) = 4w/(w - 1)^2
  controls:
    - id: CTRL-PARAM-HOMOMORPHISM
      row_class: instrument
      blocking: true
      object: 'the cuspidal and nodal parametrisations, on 1000 seeded random pairs each'
      forced_disposition: >-
        FORCED: the parametrisation must be verified numerically to be a
        group homomorphism -- x(k1 + k2) and x(w1 w2) computed through the
        parametrisation must equal the value computed through the curve's
        own chord-tangent law on the nonsingular locus. The citation
        backing these isomorphisms is RECALLED (Silverman III.2.5) and may
        not be relied on; this check is what licenses the two null arms. A
        failure removes NULL-CUSP or NULL-NODE from the run and is recorded
        as a missing control, not worked around.
    - id: CTRL-PSI-EXACT
      row_class: instrument
      blocking: true
      object: 'Psi(p, B) from the sieve, at p = 65537 and B in the declared set'
      forced_disposition: >-
        FORCED EXACT against an independent brute-force count by trial
        division at the smallest prime. A mismatch is an instrument failure
        and no rate is reported.
    - id: CTRL-SYMMETRY-P7
      row_class: instrument
      blocking: true
      object: 'S_B[k] versus S_B[n-k] over the FULL orbit range, all three curve-shaped arms'
      forced_disposition: >-
        FORCED IDENTICAL on ELLIPTIC, NULL-CUSP and NULL-NODE (it is an
        identity: x(kP) = x(-kP)), and FORCED ABSENT on NULL-MULT and
        NULL-RANDINT. Reported explicitly. This is how the record
        demonstrates the trivial symmetry was REMOVED by the half-range
        quotient rather than merely claimed to be; a statistic computed on
        the full range would report this identity as perfect correlation.
    - id: CTRL-SPIKE-INJECTION
      row_class: instrument
      blocking: true
      object: 'the elliptic bit vector perturbed to plant delta_add = epsilon, at epsilon in {0.001, 0.003, 0.01}'
      forced_disposition: >-
        FORCED: each planted epsilon recovered inside its 95 percent
        interval. The smallest reliably recovered epsilon IS the minimum
        detectable effect MDE(p, u) and every null statement in the run is
        scoped to it. There is NO natural positive control for delta_add --
        index calculus over F_p^* works by linear relations, not by orbit
        smoothness correlation, so F_p^* is a null here and not a positive
        control -- and injection is therefore the only way to show the
        pipeline can see a signal at all. A failure to recover
        epsilon = 0.01 voids every null statement in the run.
    - id: NULL-SHUFFLE
      row_class: null_object
      blocking: true
      object: '32 seeded shuffles of the elliptic half-orbit multiset per cell'
      forced_disposition: >-
        Provides the EMPIRICAL null band for delta_2 and delta_add. The
        multiset is preserved and the k-ordering destroyed, so the band
        isolates orbit structure from coordinate distribution. The band,
        not a parametric formula, is the reference for P2 and P3.
    - id: NULL-RANDINT
      row_class: null_object
      blocking: true
      object: 'uniform seeded integers in [0, p), same count as the half orbit'
      forced_disposition: >-
        CURVE-FREE, GROUP-FREE. Predicted rate = Psi(p, B)/p and both
        correlation statistics null. Any statistic reproduced here is a
        property of integer lifts and of nothing else.
    - id: NULL-MULT
      row_class: null_object
      blocking: true
      object: 'the multiplicative orbit L(g^k), g a generator of F_p^*'
      forced_disposition: >-
        CURVE-FREE, WITH A GROUP. Predicted identical to the elliptic arm
        on all three statistics. This also serves as the baseline_embedding
        of H-PFDR-e0988d: it reproduces the only distributional fact
        classical index calculus uses. A nonzero delta_add here is an
        instrument failure, not a discovery.
    - id: NULL-CUSP
      row_class: null_object
      blocking: true
      object: 'the cuspidal cubic y^2 = x^3, nonsingular locus isomorphic to (F_p, +), DLP trivial'
      forced_disposition: >-
        NOT AN ELLIPTIC CURVE. Carries an orbit, an x-coordinate, an
        integer lift and the same 2-to-1 coordinate symmetry, and carries
        no hard discrete logarithm. A signal reproduced here is not about
        elliptic curves and not about the hardness of anything.
    - id: NULL-NODE
      row_class: null_object
      blocking: true
      object: 'the split nodal cubic y^2 = x^2(x+1), nonsingular locus isomorphic to F_p^*, DLP as easy as the F_p^* DLP'
      forced_disposition: >-
        NOT AN ELLIPTIC CURVE, and the NEARBY-OBJECT CONTROL of the proof
        search map: same shape, same symmetry, easy discrete logarithm. A
        pipeline that reports an elliptic-curve-specific signal must report
        a different answer here; if it does not, the signal is not about
        hardness.
    - id: CTRL-DETERMINISM
      row_class: instrument
      blocking: true
      object: 'one declared cell, re-run end to end with identical seeds'
      forced_disposition: 'FORCED: byte-identical raw output, verified by sha256. A mismatch invalidates every cell.'
    - id: CTRL-UNDERPOWER
      row_class: honesty
      blocking: true
      object: 'every (p, u) cell'
      forced_disposition: >-
        A cell with expected smooth count Psi(p, B) < 200 is labelled
        UNDERPOWERED and is excluded from every fit. The rule is fixed here,
        before any data exists, and is the pre-registered handling of the
        small-p degeneracy confounder. Underpowered cells are still
        reported with their counts; they are excluded from FITS, never
        deleted.
    - id: PARETO-NONE
      row_class: pareto_control
      blocking: false
      object: 'the ECDLP cost frontier'
      forced_disposition: >-
        NOT APPLICABLE AND STATED: this contract mounts no attack, so no
        row of the frontier dominates or is dominated by it. dominated_by
        is n/a on the attack axis by construction, not by an unchecked
        null; sota_delta on every attack axis is exactly 0.
  independent_variables:
    - 'p in the 5 declared primes'
    - 'u in {1.5, 2.0, 2.5, 3.0, 3.5}, with B = round(p^{1/u})'
    - 'arm in {ELLIPTIC, NULL-RANDINT, NULL-MULT, NULL-CUSP, NULL-NODE}'
    - 'curve index 1..4 within the ELLIPTIC arm'
  metrics:
    primary:
      - >-
        rate_B: fraction of k in [1, (n-1)/2] with L(x(kP)) B-smooth.
        UNITS: dimensionless fraction in [0, 1]. Reported with a Wilson 95
        percent interval and with the signed deviation from Psi(p, B)/p in
        units of Wilson standard errors.
      - >-
        delta_2: P(S_B[k]=1 and S_B[2k]=1) - rate_B^2, the excess two-point
        correlation. UNITS: dimensionless probability difference. Reported
        with its position in the 32-shuffle empirical null band as a
        percentile and as a z-score.
      - >-
        delta_add: P(S_B[k+j]=1 or S_B[k-j]=1 | S_B[k]=1 and S_B[j]=1)
        minus P(S_B[a]=1 or S_B[b]=1) over seeded uniform (a, b),
        estimated on M unordered pairs. UNITS: dimensionless probability
        difference. THE PRIMARY QUANTITY. Reported with a bootstrap 95
        percent interval and beside its cell MDE.
      - >-
        MDE(p, u): the smallest injected epsilon recovered inside its 95
        percent interval. UNITS: dimensionless probability difference.
        Every null statement in the run is quoted as
        '|delta_add| <= MDE(p, u)' and never as 'no correlation'.
      - >-
        decay slope: ordinary least squares slope of log|excess| against
        log p over the 5 primes, per statistic and per u. UNITS:
        dimensionless (log-log slope). Reported with a 95 percent interval.
    secondary:
      - 'Psi(p, B) and Psi(p, B)/p per cell, exact integers'
      - 'the (a, b, |E|, P) tuple and the generator g, per instance'
      - 'the 32-shuffle null band per cell, as quantiles'
      - 'per-cell counts entering every rate, so any interval can be recomputed'
      - 'the full-range symmetry check of CTRL-SYMMETRY-P7, per arm'
      - 'wall clock and peak memory per cell'
  heuristic_under_test: >-
    HEUR-001 (smoothness-typicality of the x-line) and HEUR-002 (no
    composition signal) of H-PFDR-e0988d. Both are validated here and
    nowhere else.
  preregistered_prediction:
    quantity: >-
      The triple (rate_B, delta_2, delta_add) on the ELLIPTIC arm, each
      referred to its own declared reference, plus the decay slope of any
      excess and the four non-elliptic arms' values of the same triple.
    formula: >-
      rate_B = Psi(p, B)/p to within 3 Wilson standard errors, where
      Psi(p, B) is the exact sieve count and B = round(p^{1/u}).
      delta_2 inside the 32-shuffle empirical null band at the
      Bonferroni-corrected 5 percent level.
      |delta_add| <= MDE(p, u).
      Any measured excess: decay slope in log p strictly negative with a 95
      percent interval excluding 0.
      The four non-elliptic arms: statistically indistinguishable from the
      ELLIPTIC arm on all three statistics.
    source: >-
      H-PFDR-e0988d claims (B), (C), (D) and its HEUR-001/HEUR-002; the
      exact reference Psi(p, B) is computed in-experiment and depends on no
      external theorem. FIXED ON 2026-09-04, BEFORE ANY CODE IS WRITTEN.
      A disagreement is reported as such and corrected by a superseding
      record, never by editing this prediction. In particular the
      thresholds (3 standard errors, Bonferroni 5 percent, Psi < 200
      underpower, epsilon levels) are part of the frozen contract and are
      not adjusted after any outcome is seen.
  scale_relevance:
    tier: toy
    justification: >-
      Tested p spans 2^16 to 2^24 against a cryptographic 2^256. The
      binding cost is FULL ORBIT ENUMERATION, which is O(p) point additions
      and O(p) memory for the sieve and the bit vectors, so the ladder
      cannot be extended by more compute of the same kind -- it is bounded
      by the design, not by the budget. NO TRANSFER ARGUMENT IS OFFERED.
      Every statement is scoped to the tested p, and any use of these
      numbers at larger p is an extrapolation assumption that the using
      record must declare as one. The decay test (P6) is the only quantity
      here with any bearing on larger p, and it bears on it only by
      excluding an artifact, never by predicting a value.
    correspondence: >-
      none. No correspondence trick is available: unlike the Deuring
      correspondence used to reach scale in the isogeny setting, there is
      no known isometry that would let smoothness statistics of x(kP) at
      cryptographic p be sampled from a smaller object. This is stated so
      that the absence is a recorded design fact rather than an oversight.
  tail_checks:
    - >-
      The SMOOTHEST lifts: the 100 smallest largest-prime-factor values per
      cell, checked for small-x artifacts (x(kP) small as an integer, e.g.
      x < 2^8, is trivially smooth and is a coordinate artifact rather than
      a smoothness signal). The count of such points is reported and the
      statistics are recomputed with them excluded, both versions shown.
    - >-
      The extreme cell of the decay fit: the largest |excess| observed at
      the largest p, reported with its cell and its shuffle-band
      percentile, so a reader can see whether the fit is driven by one
      point.
    - >-
      The 5 equivalence-breaking k values: any k where S_B[k] differs from
      S_B[n-k] on a curve-shaped arm, which cannot happen and whose
      appearance is an implementation bug, reported by index.
  replication:
    seeds:
      - 'SEED-CURVE-SEARCH = 20260904001 (curve (a,b) search per prime)'
      - 'SEED-GENERATOR = 20260904002 (choice of P per curve, of g per prime, of the cuspidal s and nodal w)'
      - 'SEED-RANDINT = 20260904003 (NULL-RANDINT draws)'
      - 'SEED-SHUFFLE-BASE = 20260904004 (shuffle t of cell c uses SEED-SHUFFLE-BASE + 1000*c + t)'
      - 'SEED-PAIRS = 20260904005 (the M unordered (k, j) draws)'
      - 'SEED-INJECT = 20260904006 (spike injection triples)'
      - 'SEED-SAMPLE-BASELINE = 20260904007 (the uniform (a, b) draws for the delta_add base rate)'
    independent_instances: 4
    reason: >-
      4 curves per prime are 4 independent instances of the ELLIPTIC arm at
      each p; the primes are 5 further independent instances of the object.
      SEEDS POLICY: every seed above is declared here, before execution,
      and is recorded in each run manifest. No seed may be chosen, changed,
      or added after any outcome is observed; a seed change is a new
      version of this contract, never an edit. Every reported statistic
      must be exactly reproducible from the declared seeds, and
      CTRL-DETERMINISM verifies that on one cell by sha256.
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 24
    maximum_memory_gb: 8
    maximum_runs: 48
    maximum_workers: 1
    notes: >-
      A run is one (p, arm, instance) cell; 5 primes x (4 elliptic + 4
      null arms) is 40 cells and the ceiling of 48 is headroom for the
      instrument controls. The dominant cost is the p = 2^24 cells: a
      uint32 smallest-prime-factor sieve on [1, 2^24) is 64 MB and the
      orbit walk is about 8.4 million point additions on the half range,
      batched with Montgomery inversion. wall_clock_seconds_per_run is
      3600, above the template floor of 600, sized to that work.
      maximum_workers is 1: the pipeline has not passed a determinism check
      under parallel execution and CTRL-DETERMINISM must hold.
  stages:
    - id: stage-0-instrument
      purpose: 'sieve, Psi exactness, parametrisation homomorphism check, symmetry check, spike injection and MDE'
      dominant_operation: 'sieve construction and exact counting'
      blocking: true
    - id: stage-1-orbits
      purpose: 'orbit enumeration and smoothness bit vectors for all five arms at all five primes'
      dominant_operation: 'point addition with batched modular inversion; sieve lookup'
    - id: stage-2-statistics
      purpose: 'rate_B, delta_2, delta_add, shuffle bands, bootstrap intervals'
      dominant_operation: 'array lookup and counting'
    - id: stage-3-decay-and-attribution
      purpose: 'decay fits, the five-arm comparison, tail checks'
      dominant_operation: 'least squares on 5 points; tabulation'
  stopping_rules:
    - >-
      Stop before stage 1 if any blocking instrument control (PARAM-
      HOMOMORPHISM, PSI-EXACT, SYMMETRY-P7, SPIKE-INJECTION) fails; record
      the failure as the result and report no statistic about any arm.
    - >-
      Stop if the p = 2^24 cells exceed the memory contract; report the
      ladder as truncated at the largest completed p, state the achieved
      MDE, and do NOT extrapolate the decay fit past the completed range.
    - >-
      Stop when all four stages are complete. There is no adaptive
      stopping: the cell list is fixed by this contract and no cell is
      added, dropped, or re-run because of what another cell showed.
    - >-
      A timeout, crash, or out-of-memory at any cell is INFRASTRUCTURE
      SIGNAL (AGENTS.md rule 5). It is recorded as such, the cell is
      reported missing, and it is never counted as an absence of
      correlation.
  invalidation_rules:
    - >-
      Any statistic computed over the FULL orbit range rather than the
      half range INVALIDATES that statistic: the identity S_B[k] =
      S_B[n-k] would be reported as correlation.
    - >-
      Any comparison against a Dickman-de Bruijn asymptotic instead of the
      exact sieve count Psi(p, B) INVALIDATES the marginal result.
    - >-
      Any B fixed independently of p, rather than derived as
      round(p^{1/u}), INVALIDATES the decay fit that uses it.
    - >-
      Any null statement phrased as 'no correlation' rather than as a bound
      against the cell's MDE INVALIDATES the artifact making it.
    - >-
      Reporting an ELLIPTIC-arm signal without reporting the four
      non-elliptic arms at the same (p, u) INVALIDATES the report. Reporting
      any signal in elliptic-curve or ECDLP language when it is reproduced
      on NULL-RANDINT, NULL-MULT, NULL-CUSP or NULL-NODE at comparable
      magnitude INVALIDATES the artifact making the statement.
    - >-
      Any floating-point value entering a COUNTED quantity (rates,
      correlations, Psi) INVALIDATES it; floating point is admissible only
      in fitted slopes and reported intervals.
    - >-
      Any use of these numbers to make a statement at cryptographic p
      without an explicitly declared extrapolation assumption INVALIDATES
      the artifact making it.
  success_criterion: >-
    Decidable from the primary metrics, ALL of: (1) every blocking
    instrument control passes -- Psi exact, parametrisations verified as
    homomorphisms, the full-range symmetry identity confirmed and
    quotiented out, and epsilon = 0.01 recovered by injection; (2) at least
    3 of the 5 primes have at least 3 powered (Psi >= 200) u values on
    every arm; (3) rate_B, delta_2, delta_add and their intervals are
    reported for every powered cell on all five arms, with MDE beside every
    delta_add; (4) the decay fit is reported for every statistic showing a
    nonzero excess, with its interval, or an explicit statement that no
    excess was found to fit; (5) the five-arm attribution table is complete.
    SUCCESS HERE IS MEASUREMENT INTEGRITY, NOT A POSITIVE FINDING: a run
    meeting (1)-(5) and finding |delta_add| <= MDE everywhere is a FULL
    SUCCESS and is the expected outcome. It validates no attack, supports
    no exponent, and changes no status.
  falsification_criterion: >-
    ANY of the following, evaluated in this order and reported by name.
    F1 INSTRUMENT: a blocking control fails; nothing about any curve is
    reported.
    F2 MARGINAL: rate_B deviates from Psi(p, B)/p by more than 3 Wilson
    standard errors on at least 3 of 4 curves at some p and at a majority
    of powered u, while NULL-RANDINT and NULL-MULT at the same cells agree
    with the reference. HEUR-001 of H-PFDR-e0988d is falsified.
    F3 COMPOSITION: |delta_add| exceeds MDE at the Bonferroni-corrected 5
    percent level on at least 3 of 4 curves at some p and at a majority of
    powered u, AND is absent from all four non-elliptic arms, AND decays
    with p per the decay fit. HEUR-002 is falsified and there is genuine
    scoped composition structure; replication at independent curves and
    seeds is required before any language beyond 'measured correlation' is
    used, and nothing about the ECDLP follows without a new hypothesis.
    F4 ARTIFACT: any excess is flat in p (decay slope interval contains 0)
    or is reproduced by any non-elliptic arm at comparable magnitude. It is
    recorded as a CONTROLLED NULL and, in the reproduction case,
    explicitly as NOT a statement about elliptic curves or the ECDLP.
    F5 UNDERPOWER: more than half the (p, u) cells are underpowered, or
    MDE at the largest p exceeds 0.01. The result is INCONCLUSIVE with the
    achieved MDE stated; it is not a null.
  required_artifacts:
    - 'experiments/EXP-PFDR-e74701/runs/<RUN-ID>/manifest.yaml (full artifact policy: command, commit and dirty state, environment, all declared seeds, requested policy, resolved model, probe status, timings, memory, validity status and reason)'
    - 'experiments/EXP-PFDR-e74701/runs/<RUN-ID>/instrument-controls.yaml (Psi exactness, parametrisation homomorphism checks, full-range symmetry check, spike injection with recovered epsilon and the derived MDE per cell; pass or fail each)'
    - 'experiments/EXP-PFDR-e74701/runs/<RUN-ID>/instances.yaml (per prime: the accepted (a, b, |E|, P) tuples, the generator g, the cuspidal s and nodal w, all reproducible from the declared seeds)'
    - 'experiments/EXP-PFDR-e74701/runs/<RUN-ID>/rates.yaml (rate_B, Psi(p,B), Psi(p,B)/p, raw counts and Wilson intervals for every cell on every arm)'
    - 'experiments/EXP-PFDR-e74701/runs/<RUN-ID>/correlations.yaml (delta_2 and delta_add per cell per arm, with shuffle-band quantiles, bootstrap intervals, and the cell MDE beside every delta_add)'
    - 'experiments/EXP-PFDR-e74701/runs/<RUN-ID>/decay.yaml (log-log fits of every nonzero excess against p, with intervals, and the explicit list of statistics with no excess to fit)'
    - 'experiments/EXP-PFDR-e74701/runs/<RUN-ID>/attribution.yaml (the five-arm table: each statistic on ELLIPTIC, NULL-RANDINT, NULL-MULT, NULL-CUSP, NULL-NODE at every powered cell, with the explicit verdict on whether any signal is elliptic-curve-specific)'
    - 'experiments/EXP-PFDR-e74701/runs/<RUN-ID>/tail-checks.yaml (the three declared tail checks with their numbers)'
    - 'experiments/EXP-PFDR-e74701/derivation/non-composition-note.md (claim (A) of H-PFDR-e0988d written out as a derivation with its quantifiers, archived SEPARATELY from any measured statistic so that the derivation and the measurement can never be cited as one another)'
    - 'experiments/EXP-PFDR-e74701/runs/<RUN-ID>/execution-report.md (stage-by-stage; success-criterion checklist (1)-(5); which of F1-F5 fired; per-file sha256; the determinism re-run comparison; the inference block with requested policy, resolved model and fallback_used; an explicit statement of what was NOT measured)'
  interpretation_limits:
    - >-
      THE CENTRAL CLAIM CANNOT BE TESTED AT REACHABLE SCALE, and this is a
      property of the design rather than of the budget. Full orbit
      enumeration is O(p) in time and memory; the tested ceiling is p =
      2^24 against a cryptographic 2^256, and no correspondence is known
      that would sample cryptographic-scale smoothness statistics from a
      smaller object. Nothing here constrains the behaviour of x(kP)
      smoothness at cryptographic p by measurement.
    - >-
      A null result is a BOUND against the measured MDE, not an absence.
      Correlations below MDE are invisible to this design at every cell.
    - >-
