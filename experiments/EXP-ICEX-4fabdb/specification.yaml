experiment:
  id: EXP-ICEX-4fabdb
  hypothesis_id: H-ICEX-77c62a
  derived_from_idea: IDEA-20260826-4bc5d2
  question_id: RQ-JINV-8fc13a
  version: 1
  status: designed
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Rotation-invariant second moment of subgroup x-coordinate window incidence, measured by
    complete enumeration at three matched-order toy primes, against a matched-random-curve
    null, a CURVE-FREE uniform-subset null of the same cardinality, an exact
    rotation-averaging identity check, and a quadratic-twist nearby object
  objective: >-
    Reduce exactly one uncertainty: whether the ROTATION-INVARIANT VARIANCE of the normalised
    window-incidence deviation of a prime-order subgroup's x-coordinates depends on |D_0| at
    matched p and matched N, once the automorphism reindexing has been averaged out by
    construction. The lane owns a first-moment yield-invariance closure and no second-moment
    measurement at all; a class-invariant mean is logically consistent with a |D_0|-dependent
    variance, so the existing closure does not answer this object. The run additionally
    establishes whether the measured signature is reproduced by an object with no elliptic
    curve in it, which decides whether any result may be stated about curves at all.
  what_this_is_not:
    - >-
      Not an attack, not an algorithm, not a speedup. No factor base is built, no relation is
      collected, no discrete logarithm is solved, and no certificate of a solve is produced.
    - >-
      Not a measurement of relation yield. The lane's yield mean is a different object and is
      neither remeasured nor contradicted here.
    - >-
      Not a statement about the automorphism discount. The design removes that mechanism by
      rotation-averaging and verifies the removal numerically; an advantage at or below the
      orbit-collapse factor is baseline calibration.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence.
      No run has been executed under this contract and approved_by is null.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: at the three tested toy primes, on the enumerated curves, over
      the frozen rotation-closed window family, the rotation-invariant variance of the
      normalised window-incidence deviation of the prime-order subgroup does or does not depend
      on |D_0| beyond a stated resolution, relative to a matched-random-curve null and to a
      curve-free uniform-subset null. WHAT DOES NOT FOLLOW: nothing about relation-collection
      cost, nothing about factor-base design in practice, no exponent, nothing at
      cryptographic scale, and - if the curve-free arm reproduces the signature - nothing about
      elliptic curves at all.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, blocking, HARD GATE). Derive the null band for Var_rot(Delta) from
      the stated incomplete-character-sum bound specialised to a prime-order subgroup, and
      record the derivation in full. Freeze and hash: the three primes, the matched-order
      family construction, the window widths, the rotation-closed offset grid, the resolution
      thresholds per prime, and the pre-registered null expectation of zero |D_0| slope. Locate
      or record as UNAVAILABLE the primary source for the character-sum bound; an unavailable
      source is recorded as unavailable, never as a passed check, and the band is then reported
      as an internally derived band with that provenance stated on every row.
      STAGE 1 (curve-free arm first, blocking). For each prime and each window width, draw a
      uniform subset of F_p of cardinality (N-1)/2 under a declared seed - with NO curve
      constructed at any point - and compute Delta over the frozen window family and its
      rotation-invariant variance. Write down the result BEFORE any curve is enumerated. This
      ordering is a rule, not a preference: it prevents the curve arms from setting the reader's
      expectation for what a random subset does.
      STAGE 2 (matched-random curve arm, blocking). Enumerate G completely on at least eight
      generic-D_0 curves with |Aut| = 2 per prime; compute the same statistic. Both Stage 1 and
      Stage 2 must land inside the Stage 0 band before any small-|D_0| arm is read.
      STAGE 3 (rotation identity check, blocking). On a j = 0 curve at each prime, compute the
      rotation-averaged deviation of the x -> zeta x reindexed windows. Forced to 0 within
      enumeration tolerance.
      STAGE 4 (the comparison). Enumerate the small-|D_0| arms - the j = 0 and j = 1728 craters
      where they exist, plus at least four small-|D_0| classes with |Aut| = 2 - and their
      quadratic twists. Report each arm's Var_rot as a DIFFERENCE against the matched-random
      arm at the same p and N, never in isolation, with an exact permutation distribution over
      class labels.
      STAGE 5 (analysis). Regress Var_rot on |D_0| across the matched-order family per prime,
      with Holm correction across window widths. Emit the full empirical distribution of Delta
      over windows per arm, not only its variance.
    instrument: >-
      Pure Python integer arithmetic and an explicit affine short-Weierstrass group law under
      experiments/EXP-ICEX-4fabdb/driver/. Complete enumeration of G by repeated addition of a
      generator; every S_W is an exact integer count. Costs are recorded as exact operation
      counts and, separately, as wall-clock seconds on the declared machine; no conclusion may
      rest on wall clock. Recorded through harness/runner.py.
    parameters: >-
      THE INSTANCE SET IS FIXED IN STAGE 0 AND EVERY ARM IS MEASURED ON THAT SAME SET. Three
      matched-order families, N prime in [2^16, 2^20], p = N + t - 1 prime. Window widths
      B = round(p * f) for f in {1/64, 1/16, 1/4}; at least 256 rotation-closed offsets per
      width, generated by the automorphism orbit of a frozen offset grid. Seeds for the
      curve-free draw and for the matched-random curve draw are declared in replication.seeds
      and are DISTINCT per arm and per prime; a shared seed across arms invalidates the run.
      THE MACHINE IS NAMED IN THE MANIFEST and every timing row carries it; timings are
      reported for budget accounting only.
  controls:
    - >-
      CURVE-FREE NULL OBJECT, MANDATORY AND BLOCKING (standing scope constraint from the
      pfdr-battery lane): a uniformly drawn subset of F_p of cardinality (N-1)/2, constructed
      with no elliptic curve, no group law and no coordinate map. FORCED: Var_rot inside the
      Stage 0 band and within the declared resolution of the matched-random curve arm. If the
      curve arms agree with it, the run's supported statement is about subsets of F_p of this
      size and MAY NOT be restated as a statement about elliptic curves or the ECDLP.
    - >-
      MATCHED-RANDOM CURVE NULL, blocking: generic D_0, |Aut| = 2, SAME p, SAME N, drawn in the
      same invocation and measured through the identical code path. Every small-|D_0| number is
      reported as a difference against it.
    - >-
      ROTATION-AVERAGING IDENTITY CHECK, blocking and forced to 0: the rotation-averaged
      deviation of the x -> zeta x reindexed windows on a j = 0 curve. This is the control that
      makes the design's orthogonality to the sqrt(|Aut|) mechanism a checked fact rather than
      an argument.
    - >-
      QUADRATIC-TWIST NEARBY OBJECT: same CM order, same |Aut|, different point set. Separates a
      |D_0|-driven effect from a coefficient-instance effect.
    - >-
      DERIVED ANALYTIC BAND as the reference, frozen and hashed in Stage 0 with its provenance
      recorded. If the primary source cannot be obtained, the band is reported as internally
      derived and every downstream row says so.
    - >-
      NULL-ARM-FIRST ORDERING, blocking: the curve-free arm and the matched-random arm are
      analysed and written down before any small-|D_0| arm is examined.
    - >-
      WINDOW-FAMILY FREEZE: the family is hashed before Stage 1. Adding, removing or reweighting
      a window after any arm is read invalidates the run, because window choice can swing the
      apparent deviation more than any |D_0| effect.
  independent_variables:
    - fundamental discriminant |D_0| of the class, across the matched-order family
    - automorphism group order, 2 versus 4 versus 6
    - window width fraction f = B/p
    - arm type: curve-free uniform subset, matched-random curve, small-|D_0| curve, quadratic twist
    - toy prime p at matched N
  metrics:
    primary:
      - >-
        S_W per arm per window: the exact integer COUNT of points of G \ {O} whose lifted
        x-coordinate lies in the window. Units: points. Recorded per window, never only
        aggregated.
      - >-
        Delta_W = (S_W - B (N-1) / p) / sqrt(B) per arm per window. Dimensionless. Recorded as a
        DISTRIBUTION over the window family - the full empirical CDF and its order statistics -
        because the mean over a rotation-closed family is forced to approximately zero by
        construction and is therefore NOT a legitimate summary. Reporting the mean of Delta as
        evidence is prohibited by this contract.
      - >-
        var_rot_delta: the rotation-invariant variance of Delta over the frozen window family,
        per arm, per width, per prime. Dimensionless. THE LEGITIMATE SUMMARY, with a bootstrap
        interval over windows and over curve draws stated separately so that window noise and
        curve-draw noise are never pooled.
      - >-
        var_rot_delta_difference: small-|D_0| arm minus matched-random arm at the same p, N and
        width, with an exact permutation distribution over class labels. Dimensionless.
      - >-
        var_rot_delta_curve_free_difference: matched-random curve arm minus curve-free
        uniform-subset arm, same p, N and width. Dimensionless. This is the metric that decides
        whether the run may say anything about curves.
      - >-
        rotation_average_residual: the rotation-averaged deviation of the reindexed windows on a
        j = 0 curve. Dimensionless. FORCED 0 within enumeration tolerance.
      - >-
        d0_slope: slope of var_rot_delta against |D_0| across the matched-order family, per
        prime, per width, with an exact permutation p-value and Holm correction across widths.
    secondary:
      - >-
        Per-prime resolution: the half-width of the permutation null band for d0_slope, stated
        so that a null result is a bounded statement rather than an absence.
      - >-
        The maximum and minimum Delta observed per arm, against the derived tail of the band -
        a bulk variance can match while the tail is wrong.
      - >-
        Effective x-image size per arm, i.e. |x(G \ {O})|, to detect an unnoticed collision that
        would change the denominator of the null.
      - >-
        Exact operation counts for the enumeration per arm, plus wall-clock seconds and peak RSS
        on the NAMED machine, for budget accounting only.
      - >-
        The Stage 0 record: the derivation of the band, the frozen window-family hash, and the
        source-availability outcome recorded verbatim.
  heuristic_under_test: HEUR-INC-1
  preregistered_prediction:
    quantity: >-
      var_rot_delta for the curve-free arm, the matched-random arm and each small-|D_0| arm; the
      d0_slope; and the rotation_average_residual.
    formula: >-
      Under H-null, Delta is mean-zero over a rotation-closed family and its variance is a
      curve-independent constant times a slowly varying factor in log p, so var_rot_delta agrees
      across all three arm types within the Stage 0 band and d0_slope has an interval containing
      0. rotation_average_residual is forced to 0 exactly, up to enumeration tolerance, by the
      finite-group averaging identity. Under H-bias, var_rot_delta for the small-|D_0| arms
      exceeds both null arms by an amount growing with the number of windows.
      THE NUMERIC BAND IS COMPUTED IN STAGE 0 AND HASHED BEFORE ANY ARM IS RUN. No number is
      written into this contract in advance of that derivation, because inventing one here
      would be a fabricated statistic.
    source: >-
      The two-branch structure, the rotation-closed family, the twist control and the null
      expectation are taken from IDEA-20260826-4bc5d2, read in full by TASK-20260904-8f2f95 on
      2026-09-04. The analytic band derives from an incomplete-character-sum bound whose primary
      source is RECALLED ONLY and has not been opened by any agent in this program; Stage 0 must
      either obtain it or record the band as internally derived. Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      N between 2^16 and 2^20 is chosen because complete enumeration of G is required: the
      measured quantity is an exact incidence count and sampling points would reintroduce
      exactly the estimation noise the second-moment statistic is trying to see. THE TESTED
      SCALE IS THE CLAIMED SCALE. Transfer to larger p would require the uniformity range of the
      character-sum bound in B, which is an explicit assumption and is NOT validated here; no
      extrapolation is offered.
    correspondence: null
  tail_checks:
    - >-
      Compare the most extreme Delta observed per arm against the derived tail of the band. The
      hypothesised effect is a low-frequency coherence and would show first in the tail.
    - >-
      Recompute var_rot_delta with each single window width removed, since three widths are few
      and one can carry the whole difference.
    - >-
      Report the d0_slope refitted with the j = 0 and j = 1728 classes excluded, so that a trend
      carried entirely by the two |Aut| > 2 classes is visible as such.
    - >-
      Report the number of windows contributing to each variance and refuse any cell with fewer
      than 64, reporting the shortfall rather than a variance.
  replication:
    seeds:
      - 20260904
      - 20260905
      - 20260906
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 6
    maximum_memory_gb: 8
    maximum_runs: 12
  stopping_rules:
    - >-
      HALT before Stage 4 if either null arm lands outside the Stage 0 band. No small-|D_0| arm
      is enumerated and no |D_0| comparison is reported.
    - >-
      HALT the whole run if rotation_average_residual is nonzero beyond enumeration tolerance.
    - >-
      STOP and request independent review, before writing any sentence asserting an excess, if a
      small-|D_0| arm exceeds BOTH null bands and survives the twist control.
    - >-
      Stop at the frozen instance set. No prime, curve, width or window is added after any arm
      has been read.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a
      stop and is never a negative result.
  invalidation_rules:
    - >-
      A timeout, crash, or dependency failure makes the run failed_infrastructure and is NEVER
      negative mathematical evidence.
    - >-
      A run in which the window family was altered after any arm was read is invalid_measurement.
    - >-
      A run in which the curve-free arm and a curve arm share a seed is invalid_measurement: the
      arms would no longer be independent draws and the comparison that licenses any statement
      about curves would be void.
    - >-
      A run reporting var_rot_delta without the corresponding curve-free arm value at the same
      p, N and width is invalid_measurement.
    - >-
      A run reporting the MEAN of Delta as a summary statistic is invalid_measurement; the mean
      is forced to approximately zero by the rotation-closed family and carries no information.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment and needs
      a new contract; it is never a repair of this one.
  success_criterion: >-
    The run yields interpretable evidence when ALL of the following hold, each decidable from
    the primary metrics: (1) the curve-free arm's var_rot_delta lies inside the Stage 0 band at
    every prime and width; (2) the matched-random curve arm lies inside the same band and within
    the declared resolution of the curve-free arm; (3) rotation_average_residual is 0 within
    enumeration tolerance at every prime; (4) every reported var_rot_delta carries its bootstrap
    interval and its window count, with no cell below 64 windows; (5) d0_slope is reported per
    prime and width with its exact permutation distribution and its resolution half-width;
    (6) every small-|D_0| arm is accompanied by its quadratic twist; (7) the full empirical
    distribution of Delta per arm is archived, not only its variance.
  falsification_criterion:
    - >-
      d0_slope's permutation interval excludes 0 after Holm correction, the effect survives the
      twist control, and the curve-free arm does NOT show it. H-null is falsified at the tested
      orders; the record STOPS for independent review before asserting an excess.
    - >-
      d0_slope excludes 0 and the curve-free arm shows the same excess. The signature is a
      property of the statistic or the window family, not of curves; the |D_0| reading is
      withdrawn and the finding is reported as an instrument result.
    - >-
      Either null arm misses the Stage 0 band. The band or the instrument is wrong; this is a
      derivation and infrastructure outcome, and no mathematical conclusion is drawn in either
      direction.
    - >-
      rotation_average_residual is nonzero. The design's orthogonality to the automorphism
      mechanism fails and every comparison in the run is void.
    - >-
      d0_slope's interval contains 0 at a resolution too wide to exclude the smallest effect
      that would matter for factor-base size. The run is INCONCLUSIVE at this instance set and
      reports the resolution it achieved, not a closure.
  required_artifacts:
    - manifest.yaml with exact command, commit sha, dirty-tree state, resolved inference block, environment, and the NAMED machine
    - the Stage 0 derivation of the null band, hashed, with the source-availability outcome recorded verbatim
    - the frozen window family and its hash, written before Stage 1
    - raw-result.json with S_W and Delta_W for every arm, window and width - the full distribution, not summaries
    - the curve-free arm's results, written and timestamped before any curve arm was enumerated
    - the rotation-averaging identity check and its residual
    - var_rot_delta per arm with bootstrap intervals over windows and over curve draws, reported separately
    - the d0_slope regression with its exact permutation distribution and the per-prime resolution half-width
    - the quadratic-twist arm for every small-|D_0| curve, in the same file as its parent
    - exact operation counts, wall-clock seconds and peak RSS per arm on the named machine
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not confer approval. This contract is status designed, frozen is
      false, execution_authorized is false and approved_by is null.
    - >-
      Approval must confirm the Stage 0 outcome for the character-sum source: the band's
      provenance changes what the run's negative can claim, and an internally derived band is a
      weaker reference than a cited theorem.
    - >-
      Approval must confirm the resolution thresholds per prime. A null result at a resolution
      wider than the smallest interesting effect is inconclusive, not a closure, and the
      thresholds decide which of those two the run can produce.
  derivation_provenance:
    tool: coordinator-authored contract under TASK-20260904-8f2f95
    source_record: IDEA-20260826-4bc5d2
    authored_at: '2026-09-04'
    note: >-
      The functional, the rotation-closed family, the twist control, the four falsification
      conditions and the pre-registered null expectation are taken from the parent proposal,
      restated as measured quantities with units and with a decision rule. The CURVE-FREE
      uniform-subset arm and the null-arm-first ordering are added by this contract under the
      standing scope constraint that a signature reproducible by a non-curve object may not be
      reported as a statement about elliptic curves. No numeric band is written here; it is
      derived and hashed in Stage 0 so that no statistic in this contract is invented.
  derivation_gaps:
    - >-
      The analytic null band rests on a character-sum bound no agent in this program has read.
      Stage 0 must obtain it or record the band as internally derived; in the latter case the
      run's negative is scoped to that internal derivation.
    - >-
      The specialisation of a full-group discrepancy bound to a prime-order subgroup is asserted
      by the parent proposal and is not re-derived here. If the specialisation is wrong the
      curve-free arm still calibrates the statistic, which is why that arm is blocking.
    - >-
      Three window widths and three primes are few. The contract reports the achieved resolution
      per cell precisely so that a null is read as a bound rather than as an absence.
    - >-
      The matched-order family construction fixes N but leaves p varying as p = N + t - 1, so p
      is a residual covariate. It is reported alongside |D_0| and not adjusted away, which means
      a p-driven trend and a |D_0|-driven trend are only partially separable at three primes.
