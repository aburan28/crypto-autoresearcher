experiment:
  id: EXP-SNFS-761081
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-76d133; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-76d133
  question_id: RQ-SNFS-005666
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Generator-attribution control for special-form prime detectability: three honest and trapdoored
    sampling arms, one frozen ten-statistic battery, and a self-consistency null that can void the
    run'
  objective: 'The one uncertainty a run reduces is whether any separation a distinguishing battery
    reports between honest and special-form primes can be attributed to the special form at all, rather
    than to the code that generated the samples. (i) Is the scoring pipeline clean: does the identical
    battery return chance separation between two independent seeds of the same generator, which is
    the only contrast that is identically distributed by construction and therefore the only one where
    any separation is definitionally an artifact. (ii) How large is the generator effect: across two
    honest generators differing only in incremental versus resampling prime search, both passing an
    identical public-criteria checklist, what separation does each statistic report, and which statistics
    are dominated by that effect rather than by any mathematical property of the primes. (iii) Can
    the two effects be told apart: does the observed separation between the resampling honest arm
    and the special-form arm follow the additivity rule that would allow generator effect to be subtracted,
    or do the effects interact, in which case the deliverable is a bound on interpretability rather
    than a correction. A run answers all three from one score matrix, and a run in which the self-consistency
    null fails answers none of them and says so.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal claim a run could support is: for this frozen battery,
      these three generators and these sizes, the measured generator-attributable fraction per statistic
      is as reported, the self-consistency null passed or failed as reported, and any later detectability
      separation using these statistics must be discounted accordingly. What does NOT follow: nothing
      about whether special-form primes are detectable, nothing about statistics outside the frozen
      battery, nothing about any generator this program did not write, and nothing about any real,
      published or deployed parameter set or the intent of any party.'
  inputs:
    procedure: 'STAGE 0, zero compute: write and hash the battery file, the separation measure and
      the classification thresholds before any prime exists, and record the hash. STAGE 1, minutes:
      implement the three samplers plus the second seed of A behind one interface with a shared primality
      routine. STAGE 2, tens of minutes: generate 2000 primes per arm at each bit size, recording
      seeds. STAGE 3, minutes: run the public-criteria checklist on all arms and confirm identical
      pass rates. STAGE 4, minutes: evaluate the battery on every prime, producing the score matrix.
      STAGE 5, minutes: compute all six pairwise separations with 1000 bootstrap resamples each. STAGE
      6, seconds: compute G per statistic, classify, and evaluate the additivity deviation. STAGE
      7, minutes: run the shuffled-label control, the sample-size sweep and the order-permutation
      control. STAGE 8: emit the run manifest, the score matrix and the immutable run record.'
    instrument: Pure Python 3.11 standard library only, since numpy, sympy, gmpy2 and fpylll were
      checked and are absent and Sage is excluded by contract. random.Random seeded per arm and per
      sample for reproducibility, a shared Miller-Rabin over pow, statistics and a hand-written bootstrap
      for intervals, hashlib for the battery freeze receipt. New module harness/snfs_genattr.py holds
      the samplers, the battery, the separation measure and the controls; harness/runner.py records
      the manifest.
    parameters: 'Bit sizes n in {64, 96}. Arms: honest-incremental A, honest-incremental second seed
      A prime, honest-resampling B, special-form T with d = 3 and H = 64. Sample sizes 500, 1000 and
      2000 primes per arm per size. Battery of K = 10 frozen statistics. Bootstrap resamples 1000
      per separation. Classification thresholds: generator-blind G below 0.2, contaminated 0.2 to
      0.5, dominated above 0.5. Per-arm wall-clock cap 600 seconds.'
  controls:
  - The self-consistency null, two seeds of generator A, scored identically in the same invocation.
  - A shuffled-label control on every pair, which must return chance separation.
  - A public-criteria checklist run on A and B, confirming identical pass rates so both are honest
    by any verifier test.
  - A sample-size sweep at 500, 1000 and 2000 primes per arm to show the separations and the bootstrap
    bands behave as sample size demands.
  - A statistic-order permutation to confirm no statistic depends on the order primes were generated
    in.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two independent seeds of the SAME generator, A and A prime, scored
    by the identical battery in the identical invocation. The null must show every statistic at chance
    separation, area under the curve within the bootstrap band of 0.5. If any statistic separates
    a generator from itself, the scoring pipeline leaks the label or the statistic depends on sample
    order, and every G value in the run is void. This null is the strongest available because the
    two arms are provably identically distributed by construction, so any separation is definitionally
    an artifact.'
  independent_variables:
  - generator arm
  - bit size n
  - sample size per arm
  - statistic index within the frozen battery
  metrics:
    primary:
    - pairwise separation per statistic for all arm pairs with bootstrap intervals
    - generator-attributable fraction G per statistic
    - self-consistency separation sep(A,A prime) per statistic
    - count of statistics per classification band
    secondary:
    - public-criteria pass rate per arm
    - shuffled-label separation per statistic
    - additivity deviation per statistic
    - wall-clock seconds and candidates tested per accepted prime
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The generator-attributable fraction G(s) for each statistic in the frozen battery.
    formula: G(s) = (sep_s(A,B) - 0.5) / (sep_s(A,T) - 0.5), where sep_s(X,Y) is the area under the
      ROC curve of statistic s discriminating arm X from arm Y, rescaled so that chance is 0.5, and
      G is reported as undefined whenever the denominator is inside its own bootstrap interval. The
      predicted value for a statistic that sees only the trapdoor is 0, and for a statistic that sees
      only the search strategy it is at or above 1.
    source: Pre-registered in the parent proposal IDEA-20260816-76d133 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Bit sizes 64 and 96 with 2000 primes per arm are used because prime generation
      and battery evaluation are then cheap enough to run every control in the same invocation, which
      is the property that makes the null credible. No transfer to larger n is assumed or claimed:
      G is a property of a battery and a generator pair, both of which would change at cryptographic
      sizes, and the contract forbids reporting G as a size-independent constant.'
    correspondence: null
  tail_checks:
  - Inspect the primes contributing the extreme values of any statistic with high G, to see whether
    the effect is a few outliers or the bulk.
  - Check the top and bottom of the bit-length range separately, where incremental search behaves
    differently.
  - Check whether any statistic is a deterministic function of another, which would double-count contamination.
  - Inspect arms where candidates-tested-per-accepted-prime is anomalous, indicating a sampler bug.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort and void the run if any statistic separates A from A prime beyond its bootstrap band.
  - Stop an arm at its 600-second cap and record it as budget-truncated rather than as a result.
  - Stop if the public-criteria checklist distinguishes A from B, since the control premise has failed.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The self-consistency null returns chance for every statistic, and every statistic
    in the frozen battery receives either a G value with a bootstrap interval or an explicit undefined
    verdict with the reason.
  falsification_criterion:
  - The self-consistency null fails for any statistic, voiding the run.
  - Every statistic is at chance on every pair, so the battery has no power and no G is estimable.
  - G values differ materially across the sample-size sweep, showing the quantity is not estimable
    here.
  - Shuffled labels produce non-chance separations, indicating a pipeline leak.
  - The public-criteria checklist separates the two honest arms, invalidating the control design.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-76d133
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The classification thresholds 0.2 and 0.5 are stipulated and the Coordinator must either justify
    them or convert the classification into a continuous report with no bands.
  - The residual generator effect in the special-form arm cannot be removed by this design; the Coordinator
    must decide whether it is reported as a bound or whether a third honest generator matching the
    special arm's search shape is required.
  - The choice of ten statistics is a design decision that determines what contamination can be found
    at all, and it must be frozen under Coordinator sign-off rather than by the executing session.
