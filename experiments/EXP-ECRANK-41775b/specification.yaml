experiment:
  id: EXP-ECRANK-41775b
  id_allocation_provenance: >
    Allocated via python3 tools/allocate_id.py --next experiment --area
    ECRANK and confirmed free with --check before use (random 6-hex
    suffix; rule 14).
  version: 1
  recorded_at: '2026-09-10'
  goal_id: GOAL-ECRANK-002
  question_id: RQ-ECRANK-27dcc5
  batch_id: BATCH-2305cb
  hypothesis_id: H-ECRANK-a84737
  converts_next_action: >
    N4 of DEC-20260909-5756cb (HEUR-1 reconciliation, ranked above new
    mechanism ideation on this question). DESIGN REFINEMENT, disclosed:
    the N4 sketch named "extended-H construct enumeration ... larger H
    range" as one option; the bound bytes of the frozen 73275e pipeline
    (source/construct.py solve_n6 lines 65-95; source-v2/construct_v2.py
    lines 27-111) show H enters only as a post-solve admission filter and
    the per-tuple candidate set is the rational root set of ONE
    univariate quadratic (<= 2, H-independent). A plain extended-H
    re-enumeration of the frozen pipeline is therefore information-void
    beyond the recorded root heights. This contract replaces it with the
    equivalent decisive measurements: exact structural verification on
    the bound bytes (T1), exact extended-height RE-ADMISSION from the
    committed near-miss ledger (T2 -- the only extended-H quantity the
    frozen pipeline can yield), the theoretical density derivation (T3),
    and the instrument calibration the v2 round's failed gates (b)/(c)
    left open (T4). If T1 breaks (H participates in candidate
    generation), the original extended-H enumeration sketch revives as
    the required amendment path.
  status: approved
  approved_by: coordinator
  approval_note: >
    APPROVED 2026-09-10 by the Coordinator under AGENTS.md standing
    user authorization of 2026-09-06, recorded in DEC-20260910-c10298,
    binding the design-commit bytes sha256
    4d395b9d8a7dfc4bb581994293edfba1e0986d3a66c94e7d24e17bf83d47536e
    at commit 3efe41fbac66ed66acbcb834bf907ddf800e718c. Exactly three
    gate fields changed (status, approved_by, approval_note); every
    protocol field is untouched and frozen at version 1. Any later
    protocol change is a versioned protocol_amendment under a new
    decision; never an inline edit, never a re-score. EXECUTION GATED
    on a healthy executor-capable runtime (2026-09-10 backend
    degradation; recheck adapter doctor --probe).
  objective: >
    Decide, with possible negative outcomes, whether the construct-side
    decade-ratio tension of EXP-ECRANK-73275e v2 (TENSION-REAL,
    EV-ECRANK-d7e05f) is a STRUCTURAL-SCOPE mismatch (the frozen arm
    measures a 0-dimensional slice on which the H^(5-n/2) law is
    untestable) or a small-height scarcity / local-obstruction density
    finding; and calibrate the decade-ratio instrument against a
    synthetic known-answer family. The Executor records observations
    only; branch selection (STRUCTURAL-SCOPE / SCARCITY-REVIVED /
    DEFECT) is a Coordinator act at the independent review round.
  inputs:
    bound_sources:
      - experiments/EXP-ECRANK-73275e/source/construct.py (v1 solver; READ-ONLY, hash-bound at approval)
      - experiments/EXP-ECRANK-73275e/source-v2/construct_v2.py (v2 arm; READ-ONLY, hash-bound)
      - experiments/EXP-ECRANK-73275e/source-v2/run_v2.py (v2 driver; READ-ONLY, hash-bound)
      - experiments/EXP-ECRANK-73275e/source-v2/n2r.py (N2R conventions A/B; READ-ONLY, hash-bound)
    committed_data:
      - experiments/EXP-ECRANK-73275e/runs/RUN-ECRANK-73275e-R12-construct-n6-replication/raw-result.json (found[], near_miss_ledger, counts_per_H)
      - experiments/EXP-ECRANK-73275e/runs/RUN-ECRANK-73275e-R14-construct-n8-rescoped/raw-result.json (n=8 vacuity check)
      - experiments/EXP-ECRANK-76a70d/runs/RUN-ECRANK-76a70d-R3-armB/ (draw-side committed data for the T3 proves-too-much control, READ-ONLY)
    records:
      - ledger/evidence/EV-ECRANK-d7e05f.yaml
      - ledger/evidence/EV-ECRANK-8b35bb.yaml (draw-side F1 regime)
      - ledger/hypotheses/H-ECRANK-36d8d7.yaml (HEUR-1 statement, random_model_justification)
      - ledger/hypotheses/H-ECRANK-ee6e0e.yaml (HEUR-1 lineage, W'(b) statement, M0-M6)
      - experiments/EXP-ECRANK-73275e/amendments/v2_replication_protocol.yaml (N2R conventions)
  runs:
    frozen_order: [R1-calibration, R2-structural-trace, R3-extended-readmission, R4-density-derivation, R5-replay]
    frozen_order_note: >
      Control admission first (R1): if the ratio instrument cannot
      reproduce hand-computed known ratios, every ratio reading in this
      experiment is void and the run package stops (stopping rule SR-2).
    definitions:
      - id: RUN-ECRANK-41775b-R1-calibration
        arm: T4
        protocol: >
          Synthetic known-answer family: K = 200 constructed tuples, each
          with exactly two admissible roots whose heights are hand-chosen
          exact rationals -- one root at height in [2, 10^2) and one at
          height in [10^3, 10^4) (heights set by the family constructor,
          recorded exactly). Run the SAME counting and decade-ratio
          instrument (reimplemented from the N2R convention definitions in
          the bound n2r.py, conventions A and B) over H in {10^2, 10^3,
          10^4}. Expected by hand: N^A = N^B = {10^2: 200, 10^3: 400,
          10^4: 400}; decade ratios [2.0, 1.0]; two-decade 2.0. PASS iff
          every count and ratio equals the hand value exactly (Fractions).
          A second calibration family with one root per tuple at heights
          uniform in decades 10^1..10^4 must reproduce its hand-computed
          per-decade counts exactly. Failure voids all ratio readings
          (SR-2) and is reported, never re-scored.
      - id: RUN-ECRANK-41775b-R2-structural-trace
        arm: T1
        protocol: >
          Machine-checked dataflow trace of the bound bytes. (a) Static
          trace: parse source/construct.py and source-v2/construct_v2.py
          (ast module, stdlib); report every use site of the H parameter
          in solve_n6, solve_n8, construct_arm, construct_arm_v2 with its
          line number and syntactic role; PASS-criterion for the n=6
          adjudication: in solve_n6, H appears ONLY in the comparison
          h > H rejection (bound-byte line 86 at the frozen hash) and in
          no candidate-generation expression (coefficients A,B,C, root
          extraction, g construction, r evaluation). (b) Dynamic
          confirmation: invoke solve_n6 on the three frozen b-tuples
          b_index 649, 1299, 4995 (the blind-re-derivation pairs of
          EV-ECRANK-d7e05f) with H = 10^4 and H = 10^9; the returned
          (kept, near, meta) must differ ONLY in the kept/near partition
          by the height filter -- identical root sets, identical meta
          (A, B, C, n_rational_roots). (c) solve_n8 trace recorded
          verbatim, DESCRIPTIVE only (no n=8 adjudication). Outputs:
          trace report JSON (use sites, line numbers, roles), dynamic
          diff JSON, verdict ledger lines. A trace showing H in n=6
          candidate generation is a STOP (SR-3): the structural reading
          is falsified at P1; record and stop the adjudication arms.
      - id: RUN-ECRANK-41775b-R3-extended-readmission
        arm: T2
        protocol: >
          Exact extended-height re-admission from the committed R12 raw
          bytes -- no solver re-run, no new b-tuples, no seed use.
          Precondition check (P2): every near_miss entry with reason
          r_height_<h> in the committed near_miss_ledger carries the exact
          root datum t (string Fraction) sufficient for recomputation;
          count entries; if ANY entry lacks the datum, record the shortfall
          exactly and report the band counts as LOWER BOUNDS over the
          recoverable subset (never imputed). For each recoverable root:
          recompute r_i = g(b_i) with g = [t, 1] (exact Fractions), h_A =
          max rat_height(r_i), h_B = rat_height(t) (conventions A/B
          verbatim from bound n2r.py), then engine.build_instance(xs,
          dpat, r, 6) and, when kept, the same certificate path as R12
          (certifier from the bound source-v2). Report: N_6^{A,ext}(H')
          and N_6^{B,ext}(H') for H' in {10^4, 10^5, 10^6, 10^7} as
          kept(R12) + re-admitted(h <= H'), exact decade ratios between
          consecutive bands under both conventions, the saturation ceiling
          (kept + all recoverable re-admissible roots), and the per-tuple
          multiplicity histogram (roots per tuple, max multiplicity).
          n=8 band: read the committed R14 raw bytes; near_miss_total 0
          and found 0 make the n=8 extended band VACUOUS -- report the
          zero verbatim, no computation. Ops cap 1.0e6 counted ops
          (IC-1 convention); wall cap 600 s; exhaustion reported AS
          exhaustion with band counts as lower bounds (rules 3/5).
      - id: RUN-ECRANK-41775b-R4-density-derivation
        arm: T3
        protocol: >
          Theoretical density derivation from the committed records, with
          exact spot checks (stdlib Fractions; no floating point in any
          checked statement). (a) Exhibit the parameter space of HEUR-1's
          statement (H-ECRANK-ee6e0e: "expected square-pattern points of
          height <= H in W'(b) ~ C(b,d) H^(5-n/2)") and of the draw-side
          random-model justification (H-ECRANK-36d8d7: subspace lattice
          count times square-class equidistribution; draws from a height-H
          sub-box of 5 seeded coordinates); state which quantity grows
          with H and why the exponent has the form 5 - n/2 in that
          regime; mark every recalled external pointer (Hasse-Minkowski)
          as recalled-not-verified and show it is not load-bearing.
          (b) Exhibit the construct arm's parameter count from the bound
          bytes: g linear (2 coefficients, 1 free parameter t after the
          monic normalization), one quadratic condition -> Bezout <= 2
          rational candidates per tuple, 0-dimensional; conclude the
          formal distinction between the two counted quantities.
          (c) Reformulate the testable construct-side density quantity
          (b-box scaling: feasible fraction times multiplicity <= 2 over
          growing samples) as CANDIDATE heuristic HEUR-1-C -- text only,
          status proposed, never validated here. (d) PROVES-TOO-MUCH
          control (P5): apply the structural argument to the draw-side
          committed data (EXP-ECRANK-76a70d R3-armB; EV-ECRANK-8b35bb F1
          regime): the draw-side search space grows with H by
          construction, so the argument must NOT predict saturation there;
          record the explicit step where the two cases diverge. If the
          argument predicts draw-side saturation, record DEFECT and void
          the derivation readings. Outputs: derivation.md (numbered
          steps, every citation with provenance class), spot-check JSON,
          control JSON.
      - id: RUN-ECRANK-41775b-R5-replay
        arm: determinism
        protocol: >
          Fresh-process replay of R1 and R3 (the computational runs):
          every count, ratio, ceiling, multiplicity, and the calibration
          verdicts must reproduce bit-for-bit (replay-diff.json empty).
          R2/R4 artifacts are re-hashed and compared (analysis outputs
          deterministic by construction; a hash mismatch is a defect
          record, not a re-run).
  controls:
    - id: C1
      control: R1 calibration admission FIRST -- the ratio instrument must reproduce two hand-computed known-answer families exactly before any measured ratio is read; failure voids all ratio readings (SR-2).
    - id: C2
      control: R2 dynamic double-invocation (H = 10^4 vs 10^9) on the three frozen blind-derivation tuples -- root sets and meta identical, partition differs only by the height filter.
    - id: C3
      control: R3 precondition (P2) -- every re-admission computation is from committed bytes with the exact root datum; missing data yields declared lower bounds, never imputation.
    - id: C4
      control: R4(d) proves-too-much control on the draw-side committed data -- the structural argument must NOT predict saturation where growth was measured (F1).
    - id: C5
      control: R5 fresh-process bit-for-bit replay of the computational runs.
    - id: C6
      control: certificate-path reuse -- re-admitted kept instances pass the SAME certifier as R12 (bound source-v2); a certificate failure on a re-admitted instance is recorded per-instance, never dropped.
  metrics:
    - exact per-band counts N^{A,ext}, N^{B,ext} (Fractions/ints)
    - exact decade ratios per band pair under both conventions
    - saturation ceiling and per-tuple multiplicity histogram
    - trace use-site table (line numbers, syntactic roles)
    - calibration exactness booleans
    - counted ops per run (IC-1 convention), wall seconds, peak RSS
  budget:
    maximum_runs: 5
    wall_clock_seconds_total: 3600
    per_run_wall_seconds: {R1: 300, R2: 600, R3: 600, R4: 1800, R5: 300}
    counted_ops_caps: {R3: 1.0e6}
    memory_gb: 4
    budget_note: >
      Envelope per docs/research-budget-policy.md (advisory); binding
      scientific budgets are the frozen 5-run set, the per-run caps
      above, and the fixed data inputs. All arithmetic is exact rational
      over committed small data; expected wall is minutes.
  success_criterion: >
    DECIDABLE, WITH A POSSIBLE NEGATIVE OUTCOME. The package succeeds
    as a measurement when: R1 calibration reproduces BOTH known-answer
    families exactly (every count and decade ratio equal to the
    hand-computed Fraction values); R2 reports the complete H use-site
    table with line numbers and syntactic roles for solve_n6, solve_n8
    and construct_arm_v2, plus the dynamic double-invocation diff on
    the frozen b_index 649/1299/4995 tuples; R3 reports exact per-band
    counts and decade ratios under both conventions for
    H' in {10^4, 10^5, 10^6, 10^7}, the saturation ceiling, and the
    per-tuple multiplicity histogram, with declared lower-bound labels
    wherever root data was unrecoverable and the n=8 vacuity reported
    verbatim from the committed R14 zeros; R4 carries the numbered
    derivation with citation provenance classes, the exact spot
    checks, the HEUR-1-C candidate text (proposed, never validated),
    and the proves-too-much control outcome; R5 reproduces R1/R3
    bit-for-bit and re-hashes R2/R4. A preserved SR-2/SR-3/SR-4 stop
    with all receipts is a successful measurement package of the stop,
    never a failed experiment. Branch selection (STRUCTURAL-SCOPE /
    SCARCITY-REVIVED / DEFECT) is NOT part of this criterion -- it is
    a Coordinator act at the independent review round.
  falsification_criterion: >
    The hypothesis H-ECRANK-a84737 is falsified at the tested scope by
    any recorded observation matching its frozen falsification
    conditions: P1 -- the R2 trace exhibits H inside n=6 candidate
    generation anywhere in the bound path (SR-3 stop; the extended-H
    enumeration amendment path revives); P3 -- any R3 extended-band
    decade ratio >= 10 (small-height scarcity revives); P5 -- the
    structural argument predicts draw-side saturation on the committed
    F1-regime data (argument defective, readings void); P6 -- the R1
    calibration fails (every ratio reading in the package is
    uncalibrated and void, SR-2). Falsifying observations are
    recorded, preserved, and reported AS the result; they are never
    re-scored, and a cap breach or infrastructure failure falsifies
    nothing (rules 3 and 5).
  stopping_rules:
    - id: SR-1
      rule: counted-ops or wall cap on any run -> report exhaustion AS exhaustion with lower-bound labels where applicable; never re-score (rules 3/5).
    - id: SR-2
      rule: R1 calibration failure -> stop the package; all ratio readings void; record defect.
    - id: SR-3
      rule: R2 trace shows H in n=6 candidate generation -> stop adjudication arms; P1 falsified; record verbatim and preserve all receipts (the extended-H enumeration amendment path revives).
    - id: SR-4
      rule: any bound-byte hash mismatch at run start -> spec defect, stop, record; correction only by amendment.
  artifacts:
    per_run: [run.yaml (RUN_REQUIRED_TOP), command.txt, environment.json, stdout.log, stderr.log, raw-result.json, manifest.yaml, cost-ledger.json]
    additional:
      R1: [calibration-families.json, instrument-verdicts.json]
      R2: [trace-report.json, dynamic-diff.json, verdict-ledger.json]
      R3: [readmission.json, multiplicity-histogram.json, verdict-ledger.json]
      R4: [derivation.md, spot-check.json, proves-too-much-control.json]
      R5: [replay-diff.json]
    package: [implementation.md, source/, execution-report.yaml]
  constraints:
    - Stdlib only (fractions, ast, json, hashlib, random for nothing -- no seeds are drawn in this experiment); no PARI, no Magma, no Sage, no network, no third-party packages.
    - Exact rational arithmetic in every verdict and checked statement; no floating point anywhere in this contract (no comparison-only cross-check exists here).
    - All inputs are the committed bound bytes; NO solver re-enumeration, NO new b-tuples, NO seeds; the only dynamic invocations are R2's double solve_n6 calls on the three frozen tuples and R1's synthetic families.
    - READ-ONLY on every input path; workers never commit; write only inside write_scope.
    - Zero interpretation: the Executor records observations against frozen expectations; branch selection and any heuristic reformulation are Coordinator acts at review.
    - Recalled citations stay marked recalled (rule 9); nothing discharges HEUR-1's own support status here.
    - Bedrock prohibited (rule 16); no network calls at all.
  write_scope:
    - experiments/EXP-ECRANK-41775b/implementation.md
    - experiments/EXP-ECRANK-41775b/source
    - experiments/EXP-ECRANK-41775b/runs/R1-calibration
    - experiments/EXP-ECRANK-41775b/runs/R2-structural-trace
    - experiments/EXP-ECRANK-41775b/runs/R3-extended-readmission
    - experiments/EXP-ECRANK-41775b/runs/R4-density-derivation
    - experiments/EXP-ECRANK-41775b/runs/R5-replay
    - experiments/EXP-ECRANK-41775b/execution-report.yaml
    - coordination/goals/GOAL-ECRANK-002/batches/BATCH-2305cb/tasks/TASK-20260910-87e6fd
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
    backend_note: >
      Designed during the 2026-09-10 backend degradation (opencode
      role-subagent empty returns; zai 429; fireworks intermittent;
      local proxy >600s/request). Execution is GATED on a healthy
      executor-capable runtime; the task is small (minutes of exact
      computation) and suits any servable tier. Recheck: python3 -m
      orchestration.adapter doctor --probe.
  scale_relevance:
    claim_tier: toy
    transfer_assumptions: >
      NONE. The adjudication is over a frozen toy pipeline's committed
      bytes; nothing transfers to cryptographic parameters; no
      asymptotic claim is made.
  review_required: true
  review_note: >
    Independent review round (frozen review_plan: prior, owned joints,
    blind re-derivation of the R3 readmission arithmetic and the R2
    trace, validator, red team with the proves-too-much control on the
    argument itself) is a SEPARATE later batch; only that round may move
    H-ECRANK-a84737 or reclassify the TENSION-REAL reading.
