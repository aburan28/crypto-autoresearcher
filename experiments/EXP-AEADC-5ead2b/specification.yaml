experiment:
  id: EXP-AEADC-5ead2b
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-9b2260; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-9b2260
  question_id: RQ-AEADC-8db132
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Fit the growth exponent of multi-key advantage against key population for an AEAD mode at
    toy key widths, in independent and structured key regimes, against a union accounting prediction
    and a random-function null
  objective: 'The one uncertainty a run reduces is whether population-level accounting for an AEAD
    mode departs measurably from multiplying a per-key statement by the key count, at parameters where
    the departure can be measured rather than argued. Concretely: (i) does the empirical multi-key
    advantage of a frozen adversary, fitted as a power law in the key population u, produce an exponent
    whose confidence interval excludes the union accounting prediction computed in stage 0, at any
    of the four tested key widths; (ii) does that exponent differ between a population of independent
    keys and a population derived from one salt under a declared relation, which is the regime where
    per-key statements are most often carried over without re-derivation; (iii) is the fitted exponent
    a stable mode quantity rather than a small-key-space artifact, tested by requiring stability across
    key widths from 8 to 20 bits and by requiring the random-function null arm to reproduce only the
    closed-form birthday exponent. The honest expectation is that (i) returns no departure, and that
    outcome is the point: it converts a folklore worry into a measured floor with a named tested scope,
    which the corpus currently lacks entirely.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for the implemented mode at
      key widths 8, 12, 16 and 20 bits, under the declared game, the declared frozen adversary and
      the declared query budget convention, the measured advantage grew in key population with the
      fitted exponents reported, in each of the two key regimes, while the random-function null reproduced
      its closed-form birthday exponent. What does NOT follow: nothing about any named AEAD, any key-management
      system, any deployment key count, or any product, protocol or service; no attack, break or security
      consequence; no statement about what any published multi-user bound asserts, since none is read
      or quoted; and no extension of the fitted exponent to cryptographic key widths, which would
      be a projection this contract does not perform.'
  inputs:
    procedure: 'STAGE 0, zero compute: compute and record the union accounting prediction under both
      budget conventions and the closed-form birthday exponent for the null arm; freeze the game,
      the success predicates and the adversary with file hashes. STAGE 1, minutes: implement the mode
      at configurable key width with a seeded ideal permutation in the primitive slot; validate round
      trips and enumerate the derived key population at the smallest width to confirm the structured
      relation. STAGE 2, roughly one core-hour: run the independent-key arm across four key widths
      and six values of u at 200 populations per cell, recording success rates and coincidence fractions.
      STAGE 3, comparable cost, same invocation: run the structured-key arm and the random-function
      null arm from the same query schedule with disjoint seeds. STAGE 4, minutes: fit log advantage
      against log u per width per arm with 2000 bootstrap resamples, recording slope and interval.
      STAGE 5, minutes: repeat one width with the second success predicate. STAGE 6, zero compute:
      emit exponents, intervals, both predictions, coincidence fractions and the width-drift table
      into an immutable run record via harness/runner.py.'
    instrument: Python 3, standard library plus numpy for the slope fitting and bootstrap if available,
      with a pure-Python fallback recorded in the manifest. One mode module with configurable key
      width and a seeded lazily-sampled bijection filling the primitive slot; one population driver;
      one frozen adversary module; one random-function null module exposing the identical interface.
      Orchestration, seeding and manifest emission through harness/runner.py, in the pattern of harness/run_blocknull.py.
      No Sage, no network.
    parameters: 'Key widths 8, 12, 16 and 20 bits. Key populations u in {1,4,16,64,256,1024}. Fixed
      total query budget of 2^14 across the population, split evenly, with the convention declared
      in stage 0. 200 independent populations per cell. 2000 bootstrap resamples for each slope. Two
      success predicates, the second run at 16-bit keys only. Three arms: independent keys, structured
      keys derived from one salt, random-function null. Total 72 primary cells plus 6 second-predicate
      cells.'
  controls:
  - Random-function null population, same interface and same query schedule, executed in the same
    invocation.
  - Closed-form birthday prediction for the null arm, computed in stage 0 before any run.
  - Union accounting prediction computed in stage 0 for both budget-splitting conventions.
  - Second success predicate for the multi-key game, to separate a mode effect from a predicate artifact.
  - Direct enumeration of the derived key population at the smallest width, verifying the structured
    regime contains exactly the declared relation.
  - 'Key-width sweep itself acts as a control: a genuine mode exponent should be stable across widths,
    and one that drifts with width is a small-space artifact.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): A null population of u independent random functions with the same interface
    and the same output width, replacing the mode entirely, answered from the same query schedule
    in the same invocation. The adversary code is identical. For the signal arm to mean anything,
    the null must show a fitted exponent equal to the value predicted by pure birthday coincidence
    among u independent random functions -- computed in closed form in stage 1 -- and no more. If
    the null reproduces the signal arm''s exponent, the fit is reading population size rather than
    mode structure and the measurement means nothing.'
  independent_variables:
  - key population u
  - key width
  - 'key regime: independent versus derived from a shared salt'
  - 'arm: mode versus random-function null'
  - success predicate
  metrics:
    primary:
    - fitted exponent of advantage against u, per width per arm, with bootstrap interval
    - signed gap between the fitted exponent and the union accounting prediction
    - fitted exponent of the null arm against its closed-form birthday prediction
    - empirical success rate per cell with confidence interval
    - fraction of queries in a nontrivial coincidence class per cell
    secondary:
    - exponent drift across key widths within one arm
    - honest key-collision count within each population
    - wall-clock and population count per cell
    - exponent difference between the two success predicates at 16-bit keys
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The exponent of the random-function null arm and the union accounting prediction for
      the mode arm.
    formula: 'Null arm: with u independent random functions of output width w and a total budget of
      q queries split evenly, the population success probability under the declared predicate is 1
      minus (1 minus p) raised to the power u, with p the single-function success probability at budget
      q/u; the fitted log-log slope of this quantity against u over the tested range is computed exactly
      in stage 0 and is the value the null must reproduce. Union prediction for the mode arm: advantage
      equals u times a(q/u), with a the per-key advantage measured at u=1 in the same run, giving
      a predicted log-log slope recorded before the sweep.'
    source: Pre-registered in the parent proposal IDEA-20260816-9b2260 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Key widths 8 to 20 bits and populations up to 1024 are chosen so that the coincidence
      structure is enumerable, the honest key-collision count is countable exactly, and the union
      prediction can be instantiated from a measured u=1 advantage in the same run rather than assumed.
      The transfer assumption is stated and not exercised: a mode-level exponent that is stable across
      four key widths is evidence that it is not a small-space artifact at those widths, and nothing
      more; this contract does not project the exponent to cryptographic key widths, and the width-drift
      table exists precisely so a later reader can see whether such a projection would be defensible.'
    correspondence: null
  tail_checks:
  - Cells where the coincidence fraction exceeds one half are flagged and excluded from the fit, since
    the tracked object has dissolved there.
  - The u=1 cell is checked against the per-key advantage used to instantiate the union prediction,
    since the two must be the same number by construction.
  - The largest u at the smallest key width is checked for honest key collisions dominating the success
    rate.
  - Slope fits whose bootstrap interval exceeds 0.4 in width are reported but excluded from the headline
    comparison.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt and report the instrument invalid if the null arm's fitted exponent departs from its closed-form
    value by more than 0.1.
  - Halt if the u=1 cell disagrees with the advantage used to build the union prediction.
  - Cap total wall clock at eight core-hours, reporting completed cells by name and listing incomplete
    cells as missing rather than as null.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: A completed three-arm sweep in which the null arm reproduces its closed-form
    exponent within 0.1, the u=1 consistency check passes at every width, and every mode-arm exponent
    is reported with a bootstrap interval narrower than 0.4 alongside its signed gap to the union
    prediction.
  falsification_criterion:
  - The null arm does not reproduce its closed-form exponent, invalidating the instrument.
  - The mode-arm exponent drifts monotonically with key width beyond the interval widths, indicating
    a small-space artifact and not a mode quantity.
  - The two success predicates yield non-overlapping exponents at 16-bit keys.
  - Coincidence fraction exceeds one half at a majority of cells, leaving no regime where the tracked
    object survives.
  - The structured-key population enumeration reveals relations other than the declared one.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-9b2260
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The key-derivation relation for the structured regime is named as a shared-salt derivation but
    not specified; the Coordinator must fix it, and the second prediction is explicitly refused until
    it is.
  - The multi-key success predicate is described only as a hit on any key in the population; its exact
    form determines the whole exponent and must be approved before the run.
  - The budget-splitting convention is computed both ways in stage 0 but only one is used for the
    headline comparison, and which one is a Coordinator decision.
  - The tested key widths stop at 20 bits on a cost argument that has not been sized against the largest
    u.
