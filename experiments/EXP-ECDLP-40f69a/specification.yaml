# EXP-ECDLP-40f69a
# Digit-weight arithmetic. No curve point is added.
# Approved by DEC-20261003-040d5d.
experiment:
  id: EXP-ECDLP-40f69a
  hypothesis_id: H-ECDLP-daad18
  source_idea: IDEA-20261003-3d892e
  question_id: RQ-ECDLP-002
  version: 1
  title: Binary weight and non-adjacent weight of 7
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-040d5d
  objective: >-
    Check the weights 3 and 2, the product 6, and the nearby gap 0.
  inputs:
    value: 7
    binary_weight: 3
    naf_weight: 2
    weight_gap: 1
    weight_product: 6
    weight_sum: 5
    binary_length: 3
    naf_length: 4
    nearby: 1
    nearby_binary: 1
    nearby_naf: 1
    nearby_gap: 0
    nearby_product: 1
  controls:
    - >-
      The integer 7 has binary weight 3. Reporting that weight as
      2 drops the gap and invalidates the run.
    - >-
      The non-adjacent digits from low to high are -1, 0, 0, 1,
      so that weight is 2. Three exceeds two by 1. The product is
      6. The sum is 5. The binary length is 3 and the non-adjacent
      length is 4.
    - >-
      The integer 1 has both weights equal to 1. Their gap is 0
      and their product is 1.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {binary, naf, nearby}
    - route in {count, subtract}
  metrics:
    primary:
      - binary_weight
      - naf_weight
      - nearby_gap
      - implementations_agree
    secondary:
      - weight_product
      - weight_sum
      - naf_length
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The binary weight is 3. The non-adjacent weight is 2. The
      weight gap at 1 is 0.
    formula: >-
      Count the nonzero binary digits of 7. Count the nonzero
      non-adjacent digits of 7. Subtract 2 from 3. Multiply 3 by
      2. Subtract 1 from 1.
    source: >-
      IDEA-20261003-3d892e states the integer 7 and the weights 3
      and 2, read 2026-10-03. The product, the sum, and the
      lengths were recomputed in this design session. That
      computation is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a curve addition.
    correspondence: null
  tail_checks:
    - The product 6 and the nearby gap 0 are required. A check that stops at the weight 3 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the weight 3 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The binary weight is not 3.
    - The non-adjacent weight is not 2.
    - The gap is not 1.
    - The product is not 6.
    - Both weights are reported as 2, or a curve point is added.
  success_criterion: >-
    Both runs agree that the binary weight is 3, that the
    non-adjacent weight is 2, and that 3 exceeds 2 by 1.
  falsification_criterion: >-
    The runs agree that the binary weight is computed, and that
    weight is not 3.
  required_artifacts:
    - experiments/EXP-ECDLP-40f69a/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-40f69a/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-40f69a/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-40f69a/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-40f69a/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-40f69a/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a weight gap of 1 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
