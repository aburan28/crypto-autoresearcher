# EXP-NISTBIN-90a5c3
# Degree-7 modulus tensor census. No solver.
# Approved by DEC-20261002-0c5605.
experiment:
  id: EXP-NISTBIN-90a5c3
  hypothesis_id: H-NISTBIN-1803fe
  source_idea: IDEA-20260922-cdca3a
  question_id: RQ-NISTBIN-06157b
  version: 1
  title: Degree-7 modulus tensor census
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-0c5605
  objective: >-
    Check the five named Hamming weights and the 18 degree-7 incidence
    totals.
  inputs:
    nist_degrees: [163, 233, 283, 409, 571]
    nist_weights: [5, 3, 5, 3, 5]
    nist_weight_sum: 21
    degree: 7
    irreducible_count: 18
    count_formula_num: 126
    count_formula_den: 7
    weight3_count: 4
    weight5_count: 10
    weight7_count: 4
    distinct_each: 49
    square: 49
    moduli: [131, 137, 145, 193, 143, 157, 167, 171, 185, 203, 211, 213, 229, 241, 191, 239, 247, 253]
    incidences: [70, 73, 76, 105, 118, 120, 118, 102, 104, 114, 120, 129, 123, 99, 131, 114, 118, 109]
    weight3_sum: 324
    weight5_sum: 1147
    weight7_sum: 472
    crossing_high: 105
    crossing_low: 99
    crossing_gap: 6
    named_trinomial: 131
    named_trinomial_incidences: 70
  controls:
    - >-
      Each of the 18 moduli keeps 49 bilinear monomials. Reporting a
      distinct count above 49 invalidates the run.
    - >-
      The incidence total 105 exceeds 99 by 6. Reporting every weight-5
      total above every weight-3 total invalidates the run.
    - >-
      The five named weights sum to 21. Reporting weight 3 at degree
      163 invalidates the run.
    - >-
      The irreducible count is 18. Reporting another count invalidates
      the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {census, incidences}
    - route in {masks, folds}
  metrics:
    primary:
      - distinct_monomials
      - crossing_gap
      - implementations_agree
    secondary:
      - irreducible_count
      - nist_weight_sum
      - incidence_sums
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The distinct count 49 and the crossing gap 6.
    formula: >-
      A monic degree-7 polynomial is irreducible when it has no
      irreducible factor of degree at most 3. The count of all such
      polynomials is (2^7 - 2) / 7. Each bilinear monomial a_i b_j is
      sent to the bits of the reduced power t^{i+j}. The incidence
      total is the sum of those bit counts over the 49 pairs.
    source: >-
      IDEA-20260922-cdca3a states the tensor comparison and the five
      named polynomials, read 2026-10-02. The census was computed in
      this design session. That computation is not a run. No solver
      was run.
  scale_relevance:
    tier: toy
    justification: One census at degree 7 and five term counts. No transfer to a solver.
    correspondence: null
  tail_checks:
    - The crossing pair is required. A weight ordering that omits modulus 193 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If a distinct count is reported above 49, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The irreducible count is not 18.
    - Any incidence total differs from the preregistered list.
    - A distinct count is reported above 49.
    - Every weight-5 total is reported above every weight-3 total.
    - A solver is run or a summation system is built.
  success_criterion: >-
    Both runs agree that there are 18 monic irreducibles, each keeps
    49 bilinear monomials, the incidence totals match the preregistered
    list, 105 exceeds 99 by 6, and the five named weights sum to 21.
  falsification_criterion: >-
    The runs agree, the irreducible count stays 18, and any incidence
    total differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-NISTBIN-90a5c3/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-NISTBIN-90a5c3/runs/<RUN-ID>/command.txt
    - experiments/EXP-NISTBIN-90a5c3/runs/<RUN-ID>/stdout.log
    - experiments/EXP-NISTBIN-90a5c3/runs/<RUN-ID>/stderr.log
    - experiments/EXP-NISTBIN-90a5c3/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-NISTBIN-90a5c3/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any solver run or conflict count.
    - Any summation-polynomial support at a larger degree.
    - Any claim that a modulus weight changes a search exponent.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
