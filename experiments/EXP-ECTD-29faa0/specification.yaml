experiment:
  id: EXP-ECTD-29faa0
  hypothesis_id: H-ECTD-ac8627
  derived_from_idea: IDEA-20260731-017
  question_id: RQ-ECTD-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Large-conductor vertical barrier - two-sided measurement of ECDLP-meter ratios across
    at least eight prime conductor steps in ordinary volcanoes, against a matched
    horizontal ell-neighbour sample, with an isolated endomorphism-cost instrument channel
  objective: >-
    The one uncertainty a run reduces is whether any algebraic ECDLP meter responds to a
    change of endomorphism ring across a vertical q-isogeny, at a scale where the meters
    can actually be computed. A run establishes (i) the multiset of primary-meter ratios
    across at least eight independent vertical prime-conductor edges with q in
    {17, 19, 23, 29, 31}; (ii) the matched multiset across at least eight horizontal
    ell-neighbour edges at the same volcano levels under identical factor-base and solver
    conventions, which is the only thing that makes the vertical numbers interpretable;
    (iii) the two-sample Kolmogorov-Smirnov statistic between them with a permutation
    p-value at a pre-registered alpha; and (iv) the isolated endomorphism-evaluation-cost
    channel on a known GLV/CM pair, which is an instrument check and not a result. The run
    assigns exactly one of three pre-registered verdicts. No attack is proposed, no
    trapdoor is claimed, and neither verdict is a statement about isogeny path-finding
    hardness.
  what_this_is_not:
  - >-
    Not a trapdoor construction, not a key recovery, not a distinguisher, and not an
    attack of any kind. It is a stratified measurement of an existing instrument.
  - >-
    Not a measurement of Galbraith's algorithmic conductor-gap hardness, which is a
    path-finding claim about computing the connecting isogeny and is not touched here.
  - >-
    Not a proof that vertical Teske analogues are impossible. A continuity verdict closes
    the equation-dependent Semaev-meter channel at the tested scale and nothing wider.
  - >-
    Not a statement about cryptographic parameters. Every cell is 40 to 56 bits.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or
    evidence. No run has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - across the executed vertical q-edges with
      q in {17, 19, 23, 29, 31} at subgroup orders of 40 to 56 bits, under the frozen
      factor-base and solver convention, the primary ECDLP meters do or do not move by a
      stated factor, and the vertical ratio sample is or is not exchangeable with the
      matched horizontal sample at the pre-registered alpha. WHAT DOES NOT FOLLOW - no
      statement about larger q, about cryptographic group orders, about non-Semaev
      channels, about isogeny path-finding cost, or about the existence or impossibility of
      any trapdoor. A continuity verdict is bounded below by the horizontal sample's own
      dispersion, which is the instrument's sensitivity floor and must be quoted with it.
  inputs:
    procedure: >-
      STAGE 0 (zero compute) - freeze the factor-base convention, the solver, the term
      order, the per-endpoint solver budget, the primary meter list, the permutation count
      and alpha, and the three-branch decision table, and hash the pre-registration.
      STAGE 1 (hours) - generate ordinary curves over prime fields with subgroup order in
      40 to 56 bits whose Frobenius conductor is divisible by a prime q in the declared
      set; compute the endomorphism ring on each candidate and record the volcano level and
      height. Record the selection rate and every rejected candidate with its reason.
      STAGE 2 (hours) - construct one vertical q-isogeny per selected curve, climbing or
      descending one step, and emit kernel and degree certificates on both endpoints; a
      certificate that fails independent re-verification discards the edge with its reason
      recorded. Verify gcd(deg, N) = 1 on every edge.
      STAGE 3 (the bulk of the budget) - compute the full meter vector on BOTH endpoints of
      every vertical edge in the same invocation under the identical frozen convention, and
      likewise on both endpoints of every matched horizontal ell-edge at the same levels.
      Vertical and horizontal edges are interleaved in the schedule so that a host or
      version drift cannot align with the arm.
      STAGE 4 (minutes) - the isomorphism null - re-run the meters on F_p-isomorphic
      Weierstrass models of a sample of endpoints and require identical meter values, since
      a meter that moves under a coordinate change is measuring the model and not the curve.
      STAGE 5 (minutes) - the isolated endomorphism-evaluation-cost channel on the known
      GLV/CM pair, reported in its own section and never pooled with the Semaev meters.
      STAGE 6 (zero compute) - compute per-edge ratios, the KS statistic and its permutation
      p-value, the fraction of vertical edges outside [0.1, 10], and assign exactly one
      branch of the frozen decision table.
    instrument: >-
      The meter instrument of IDEA-20260731-016 / EXP-ECTD-001 at a frozen convention -
      factor base construction, summation-polynomial degree, term order, solver and
      per-endpoint budget identical on both endpoints of every edge. Kohel-style volcano
      and endomorphism-ring computation for level and conductor. Vertical and horizontal
      isogenies constructed with kernel and degree certificates re-verified by the run
      wrapper. Recorded through harness/runner.py.
    parameters: >-
      Conductor primes q in {17, 19, 23, 29, 31}. Subgroup order N prime, 40 to 56 bits, and
      recorded exactly per curve. At least 8 independent vertical edges and at least 8
      matched horizontal ell-edges at the same levels, with ell declared and held fixed
      across the horizontal sample. alpha = 0.05, two-sided, by a permutation test with
      10000 permutations. Discontinuity threshold - primary-meter ratio at or above 100, or
      degree-of-regularity delta at or above 2. Continuity band [0.1, 10]. Per-endpoint
      solver budget identical and declared in Stage 0.
  controls:
  - >-
    MATCHED HORIZONTAL CONTROL, the comparator that makes the vertical numbers mean
    anything - ell-isogeny pairs at the SAME volcano level as the vertical edges,
    measured under the identical convention in the interleaved schedule. Expected ratio
    near 1. Its dispersion IS the instrument's sensitivity floor and must be reported with
    any continuity verdict, because a vertical effect smaller than the horizontal spread is
    invisible by construction.
  - >-
    ISOLATED ENDOMORPHISM-COST CHANNEL - a known GLV/CM curve pair, on which the
    endomorphism-EVALUATION-cost meter must show its expected move. This channel checks that
    the harness can see an endomorphism effect at all. Any Semaev meter movement observed on
    this instrument pair is recorded but MUST NOT be promoted as vertical-discontinuity
    evidence, and the contract requires that prohibition to be restated in the run report.
  - >-
    ISOMORPHISM NULL - re-run the meters on F_p-isomorphic Weierstrass models of the same
    endpoints. FORCED VALUE - identical meter values. Any movement means the meters are
    coordinate artifacts and every ratio in the package is void.
  - >-
    CONVENTION-SYMMETRY CHECK - both endpoints of every edge are solved in the same
    invocation with the same declared budget, and the run reports, per edge, whether either
    side hit its solver budget. An edge where one side truncated is discarded as an invalid
    measurement, never reported as a ratio.
  - >-
    ORDERING RULE - the horizontal sample's dispersion and the isomorphism null are computed
    and written down before the vertical ratios are read, so no threshold can be adjusted
    once the vertical numbers are known.
  - >-
    CERTIFICATE RE-VERIFICATION - every claimed isogeny and every claimed endomorphism-ring
    determination carries a certificate independently re-checked by the run wrapper
    (docs/claims-and-verification.md). A failing certificate discards the edge with its
    reason recorded; it never becomes a ratio.
  independent_variables:
  - edge type - vertical q-isogeny versus matched horizontal ell-isogeny
  - conductor prime q
  - volcano level of the lower endpoint
  - subgroup order N in bits
  - primary meter identity within the frozen meter vector
  metrics:
    primary:
    - >-
      ks_distance_vertical_vs_horizontal - two-sample Kolmogorov-Smirnov distance between
      the multiset of log10 vertical primary-meter ratios and the multiset of log10 matched
      horizontal ratios, dimensionless, with a permutation p-value from 10000 permutations
      at alpha = 0.05. THIS IS THE PRE-REGISTERED PRIMARY STATISTIC.
    - >-
      vertical_meter_ratio_max - the largest primary-meter ratio observed over all valid
      vertical edges, dimensionless, computed as meter(upper endpoint) / meter(lower
      endpoint) with the orientation fixed in Stage 0 and applied identically to every edge.
    - >-
      fraction_vertical_outside_band - the fraction of valid vertical edges with any
      primary-meter ratio outside [0.1, 10], dimensionless.
    - >-
      d_reg_delta_max - the largest absolute difference in degree of regularity across any
      valid vertical edge, in integer degrees.
    - >-
      endring_volcano_agreement_rate - fraction of edges on which the computed endomorphism
      ring agrees with the volcano degree, dimensionless. Forced value 1.00.
    secondary:
    - >-
      per-edge meter ratios for every meter in the frozen vector, vertical and horizontal,
      each with the two raw endpoint meter values that produced it, never only the ratio.
    - >-
      horizontal_ratio_dispersion - interquartile range and maximum of the horizontal ratio
      sample, dimensionless. This is the instrument's sensitivity floor and is quoted with
      every negative verdict.
    - >-
      endomorphism-evaluation-cost channel result on the GLV/CM pair, reported in isolation.
    - >-
      isomorphism-null meter differences, per sampled endpoint. Forced value 0.
    - >-
      per-edge End ring, conductor, volcano level and height, isogeny kernel and degree
      certificates, and gcd(deg, N).
    - >-
      per-edge solver-budget consumption on each endpoint, and the count and reasons of
      discarded candidates and edges.
  heuristic_under_test: HEUR-ECTD-VERT-1
  preregistered_prediction:
    quantity: >-
      The two-sample KS distance between vertical and horizontal log-ratio samples with its
      permutation p-value, and vertical_meter_ratio_max.
    formula: >-
      Under HEUR-ECTD-VERT-1 (continuity), the vertical and horizontal ratio samples are
      exchangeable - the permutation p-value is not below 0.05 - AND every vertical primary
      ratio lies in [0.1, 10] with d_reg_delta_max below 2. Under the discontinuity
      alternative, the permutation p-value is below 0.05 AND
      vertical_meter_ratio_max >= 100 or d_reg_delta_max >= 2. The two branches are stated
      with equal weight and the thresholds 100, 2 and [0.1, 10] are frozen before any edge
      is measured.
    source: >-
      Pre-registered in the parent proposal IDEA-20260731-017, whose predictions and
      decision_table fix the primary statistic, the 100x and d_reg-delta-2 thresholds, the
      [0.1, 10] band and the three-branch verdict before any run under this contract exists.
      The proposal was revised under BATCH-002 with notes TASK-20260731-031 and
      TASK-20260731-049. No value here is tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at subgroup orders of 40 to 56 bits, which is the range where the full meter
      vector - including a Macaulay rank profile and a degree of regularity - can be
      computed on BOTH endpoints of enough edges to form two samples. That is the binding
      constraint - the experiment needs pairs, not records, so it is cheaper to run 16 small
      edges than 2 large ones, and only a paired design can separate a vertical effect from
      instrument noise. The transfer assumption is stated and is NOT used - no claim about
      cryptographic group orders is made in either branch. A continuity verdict transfers
      only as far as the horizontal control's dispersion permits, which is measured and
      reported rather than assumed small.
    correspondence: null
  tail_checks:
  - >-
    Report the two most extreme vertical ratios and the two most extreme horizontal ratios
    with their full endpoint data, since a KS statistic is a bulk comparison and a single
    trapdoor-relevant edge would live in the tail.
  - >-
    Report the KS statistic recomputed with each single vertical edge removed
    (leave-one-out), so that a verdict driven by one edge is visible as such.
  - >-
    Report, per meter, whether the vertical and horizontal samples agree, since a single
    meter moving while the others do not localises any effect and a pooled statistic would
    hide it.
  - >-
    Report the number of valid vertical edges achieved. Fewer than 8 is a censored sample and
    neither branch may be declared from it.
  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 21600
    total_cpu_hours: 120.0
    maximum_memory_gb: 32
    maximum_runs: 40
  stopping_rules:
  - >-
    Abort the package if the isomorphism null shows any meter movement under an F_p-isomorphic
    model change - the meters are coordinate artifacts and nothing is reportable.
  - >-
    Abort the package if endring_volcano_agreement_rate falls below 1.00 on more than one
    edge - the harness is void and the failing edges are reported.
  - >-
    Discard, with a recorded reason, any edge whose isogeny or End-ring certificate fails
    re-verification, whose gcd(deg, N) is not 1, or where either endpoint exhausted its
    solver budget. Discards are reported, never silently dropped.
  - >-
    Stop at the declared conductor primes, the declared level set and the declared meter
    vector. No meter, curve family or threshold is added after any ratio is seen.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion with
    fewer than 8 valid vertical edges is a censored sample and a stop, never a negative
    result (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run
    failed_infrastructure and is NEVER negative mathematical evidence (AGENTS.md rule 5). In
    particular a solver that times out on one endpoint does not make that endpoint's meter
    large.
  - >-
    A run whose horizontal control arm is missing, or was not executed under the identical
    convention in the interleaved schedule, is invalid_measurement - the comparison this
    contract exists to make was not made.
  - >-
    A run whose vertical and horizontal arms used different factor bases, solver budgets or
    term orders is invalid_measurement, regardless of what it observed.
  - >-
    Any claimed isogeny, endomorphism-ring determination or ECDLP solve whose certificate
    fails independent re-verification by the run wrapper makes the run completed_invalid
    (docs/claims-and-verification.md).
  - >-
    A run whose parameters differ from the frozen contract is a DIFFERENT experiment and
    requires a new contract; it is never a repair of this one.
  success_criterion: >-
    The run is successful, in the sense of producing interpretable evidence, when ALL of the
    following hold and the run then assigns exactly one frozen branch -
    (1) the isomorphism null shows zero meter movement;
    (2) endring_volcano_agreement_rate is 1.00 on every retained edge and every retained edge
    carries re-verified isogeny certificates with gcd(deg, N) = 1;
    (3) the GLV/CM endomorphism-cost channel shows its expected move;
    (4) at least 8 valid vertical edges and at least 8 matched horizontal edges are measured
    under the identical convention;
    (5) ks_distance_vertical_vs_horizontal, its permutation p-value, vertical_meter_ratio_max,
    fraction_vertical_outside_band, d_reg_delta_max and horizontal_ratio_dispersion are all
    reported.
    The branch assigned is discontinuity_nominates_endpoint if the p-value is below 0.05 AND
    (vertical_meter_ratio_max >= 100 OR d_reg_delta_max >= 2); continuity_scoped if the
    p-value is at or above 0.05 AND fraction_vertical_outside_band is 0; and inconclusive
    otherwise.
  falsification_criterion:
  - >-
    CONTINUITY_SCOPED - every vertical primary-meter ratio inside [0.1, 10] across at least 8
    independent prime conductor steps with the permutation p-value at or above 0.05 and all
    instrument checks passing. This FALSIFIES the trapdoor-useful discontinuity at the tested
    scope. It is a genuine negative result, recorded with horizontal_ratio_dispersion as the
    sensitivity floor and scoped to the Semaev-meter channel only.
  - >-
    INCONCLUSIVE - the p-value is below 0.05 but no vertical edge reaches the 100x ratio or
    the d_reg delta of 2. The samples differ without any edge reaching a trapdoor-relevant
    magnitude; the evidence cannot discriminate between a small End-ring effect and a residual
    convention asymmetry, and the decision is inconclusive with a named replication follow-up.
  - >-
    INSTRUMENT VOID - the isomorphism null moves, or End-ring computation disagrees with the
    volcano degree on more than one edge, or the GLV/CM channel fails its expected move.
    Infrastructure signal under AGENTS.md rule 5; no mathematical claim is drawn and the run
    returns to the Executor with the failing checks listed.
  - >-
    CENSORED - fewer than 8 valid vertical edges inside the budget. Neither branch may be
    declared; the partial ratios are reported as a censored sample.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
  - raw-result.json carrying every per-edge, per-meter endpoint value, not ratios or summaries
  - the matched horizontal arm's measurements, in the same file as the vertical arm
  - the isomorphism null's measurements and the GLV/CM channel's result, each in its own labelled section
  - per-edge End ring, conductor, volcano level and height, and isogeny kernel and degree certificates in a form a third party can re-verify
  - the full list of rejected candidates and discarded edges with reasons and counts
  - the frozen Stage 0 pre-registration text, written before the first edge is measured and hashed
  - the permutation-test implementation, its seed, and the full permutation null distribution
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator drafting does not confer approval. This contract is review_required and is
    NOT approved; approved_by is null and execution_authorized is false. Approval is the
    user's gate because it authorizes execution and spends compute, and this is the most
    expensive design in its batch.
  - >-
    The frozen convention - factor base, summation-polynomial degree, term order, solver and
    per-endpoint budget - must be written out and hashed before approval. A convention fixed
    after any edge is measured turns this contract into a fitted one.
  - >-
    The horizontal control's ell must be named before approval. Choosing it after seeing the
    vertical ratios would select the comparator.
  - >-
    The budget is high (120 cpu-hours). Approval should confirm that the vertical-edge yield
    from Stage 1 selection is plausible at these conductor primes, since a run that produces
    fewer than 8 valid edges spends the whole budget and declares nothing.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260731-017
    authored_at: '2026-08-25'
    note: >-
      The primary statistic, the 100x and d_reg-delta-2 thresholds, the [0.1, 10] band, the
      minimum of 8 vertical edges, the three-branch decision table and the three named
      controls are taken verbatim in substance from the parent proposal's decision_table,
      minimal_test and falsification_conditions, restated here as measurable quantities with
      units and orientations. Boilerplate identical across contracts by program rule comes
      from the fixed table. Budgets follow the parent's declared estimated_cost of high
      implementation and high compute. No field is invented; a value the proposal did not
      supply is null or is recorded as a derivation gap.
  derivation_gaps:
  - >-
    The parent proposal does not fix the ORIENTATION of the vertical ratio (crater over floor
    or floor over crater). The contract fixes it in Stage 0 and applies it identically to
    every edge, but which orientation is the meaningful one must be settled before approval,
    because the [0.1, 10] band is symmetric while the 100x threshold is not.
  - >-
    The proposal specifies "the IDEA-20260731-016 / EXP-ECTD-001 meter vector" without listing
    which meters are PRIMARY. The KS statistic and the 100x threshold are defined over the
    primary set, so that set must be enumerated before approval or the multiple-comparison
    burden is undeclared.
  - >-
    No multiplicity correction is specified for testing several meters. With a primary set of
    size k the per-meter alpha must be adjusted or the family-wise claim stated explicitly;
    the contract reports per-meter results but the headline verdict's alpha needs fixing.
  - >-
    The horizontal control's ell is not named by the proposal, and the matched levels are
    described but not enumerated. Both must be fixed before approval.
  - >-
    The proposal's confounder "selecting only tiny class numbers where vertical structure is
    atypical" is real and unaddressed by the design. The contract requires the class number
    and |D_K| to be reported per curve so the selection can be audited after the fact, but a
    pre-declared stratification would be better and is not specified.
