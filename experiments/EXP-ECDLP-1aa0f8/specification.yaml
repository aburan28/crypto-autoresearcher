experiment:
  id: EXP-ECDLP-1aa0f8
  hypothesis_id: H-ECDLP-a23318
  version: 1
  title: >
    Exact (U, P) enumerative calibrator on a
    frozen 5-variable free-target CNF
  status: approved
  approved_by: coordinator
  approved_at: '2026-09-08'
  approval_decision: DEC-20260908-097d3b
  approval_basis: >
    Standing user authorization recorded in AGENTS.md on
    2026-09-06 (ideas and experiments always approved once
    the protocol is complete). Coordinator completeness
    check is DEC-20260908-097d3b after TASK-20260908-f86f28.
    User confirmation is not an outstanding gate.
  frozen: true
  frozen_at: '2026-09-08'
  execution_authorized: true
  execution_authorized_note: >
    Stage 0 only. Stages 1 and later remain unauthorized
    until an independent review of the Stage 0 instrument
    holds and a later Coordinator decision extends
    execution_authorized_stages. This approval does not
    authorize Stage 1 of EXP-ECDLP-79f8c4, does not
    authorize Stage 1 of EXP-ECDLP-628891, does not
    authorize Stage 1 of EXP-ECDLP-9e9536, does not
    authorize Stage 1 of EXP-ECDLP-90f602, does not
    authorize Stage 2 of EXP-ECDLP-4be480, does not
    authorize Stage 2 of EXP-ECDLP-6a97f4, does not
    authorize Stage 17 of EXP-ECDLP-420e73, does not
    authorize Stage 5 of EXP-ECDLP-a98ea9, does not
    classify W, and does not change H-ECDLP-536b21,
    H-ECDLP-3f68f6, H-ECDLP-b51c3d, H-ECDLP-4afa77,
    H-ECDLP-2ac931, H-ECDLP-e9d9bb, H-ECDLP-77caa5,
    H-ECDLP-07c7c6, H-ECDLP-2ade73, or H-ECDLP-a3598b.
  execution_authorized_stages: [0]
  execution_authorized_decision: DEC-20260908-097d3b
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260908-f86f28
  source_proposal: IDEA-20260905-3993c3
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-097d3b under the standing 2026-09-06
    user authorization. Stage 0 is the exact-count
    calibrator. ApproxMC, XOR hashing, and a PAC
    counter are a later stage and are not run here.

  objective: >
    Compute brute-force unprojected and projected
    counts on one frozen family (REAL3, KF3, NULL3)
    and decide whether the enumerative calibrator
    works. Stage 0 does not run ApproxMC, does not
    XOR hash, does not run cadical, and does not
    authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL3 has U=8 and P=4;
      KF3 has U=32 and P=4; NULL3 has U=0 and
      P=0; empty and core-only objects rejected.
      Certificate kind none.
    formula: >
      Variables a, b, c, r0, r1. REAL3 is the
      CNF of r0 = a XOR b and r1 = a XOR c.
      KF3 is the empty clause set on the same
      five variables. NULL3 is (a) and (not a).
      U is the number of satisfying assignments.
      P is the number of distinct (r0, r1) values
      among them. FORCED Stage 0: fixture_pass,
      real_up_pass, known_false_unconstrained_pass,
      reject_invalid_pass, null_unsat_pass all true.
    source: >
      ledger/proposals/IDEA-20260905-3993c3.yaml
      proof_search_map.baseline_embedding and
      method_ceiling.nearby_object_control.
      Provenance internal; read in this design session.

  design_tightening_stage0_is_instrument_not_approxmc: >
    IDEA-20260905-3993c3 also flags ApproxMC,
    XOR hashing, and a PAC counter on a pdp
    CNF as later questions, and names exact
    counts at l in 3,4,5. Stage 0 does not
    run ApproxMC, does not XOR hash, does
    not run cadical, and does not claim the
    Trimoska pdp encoder. The l-ladder and
    hashed-call curve are Stage 1+ objects.
    This is a disclosed tightening, not a
    silent change of the idea's claim.

  inputs:
    fixture:
      variables: [a, b, c, r0, r1]
      core: [a, b, c]
      target: [r0, r1]
      real:
        id: REAL3
        m: 3
        l: 1
        clauses:
          - [a, b, "~r0"]
          - ["~a", "~b", "~r0"]
          - [a, "~b", r0]
          - ["~a", b, r0]
          - [a, c, "~r1"]
          - ["~a", "~c", "~r1"]
          - [a, "~c", r1]
          - ["~a", c, r1]
        must_U: 8
        must_P: 4
        role: real_system
      known_false:
        id: KF3
        clauses: []
        must_U: 32
        must_P: 4
        role: known_false_unconstrained_cube
      matched_null:
        id: NULL3
        clauses:
          - [a]
          - ["~a"]
        must_U: 0
        must_P: 0
        role: matched_null_unsat
      invalid:
        - id: VARS-empty
          variables: []
          must_reject: true
        - id: TARGET-missing
          variables: [a, b, c]
          must_reject: true
      working_model: >
        Exact brute-force enumeration of U and P
        on a frozen 5-variable free-target CNF.
        Not ApproxMC. Not XOR hashing. Not cadical.
        Not the Trimoska encoder.
      do_not_hunt_a_new_cnf: true

  independent_variables:
    - object in the frozen family
    - presence of the XOR-determination clauses

  null_object:
    name: KF3 unconstrained 5-bit cube
    construction: >
      Empty clause set on a, b, c, r0, r1.
      U=32 and P=4. This is the known-false
      object for a "U equals the number of
      cores" reading.
    non_degeneracy_check: >
      known_false_unconstrained_pass must be
      true before any REAL3 U is read as a
      measurement.
    dynamic_range_demonstration: >
      VARS-empty and TARGET-missing must be
      rejected before U is read as a
      free-target census.

  controls:
    - KF3 U=32 and P=4 (known-false / proves-too-much)
    - REAL3 U=8 and P=4
    - NULL3 U=0 and P=0
    - empty and core-only rejection
    - exact discrete enumeration, no sampling
    - CNF frozen before any count is read

  metrics:
    primary:
      - fixture_pass boolean
      - real_up_pass boolean
      - known_false_unconstrained_pass boolean
      - reject_invalid_pass boolean
      - null_unsat_pass boolean
    secondary:
      - REAL3 U / P
      - KF3 U / P
      - NULL3 U / P
      - wall-clock seconds and peak RSS

  heuristic_under_test: none

  scale_relevance:
    tier: toy
    justification: >
      One 5-variable free-target CNF. No
      transfer to ApproxMC, a pdp encoder,
      hashed SAT calls, or cryptographic n.
    correspondence: null

  tail_checks:
    - REAL3 clauses are the frozen eight XOR clauses
    - KF3 is the empty clause set
    - NULL3 is the frozen unit contradiction
    - VARS-empty and TARGET-missing are rejected

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 0 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: fixture_pass,
      real_up_pass, known_false_unconstrained_pass,
      reject_invalid_pass, and null_unsat_pass.
      A miss classifies the run failed_infrastructure
      if it is a size or encoding bug, otherwise it
      is a scoped falsification of P-S0-COUNT.
    - Stages 1 and later are not authorized.
    - Do not hunt a new CNF.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 0 is not in execution_authorized_stages
    - Changing the 5-variable CNF after this freeze
    - Hunting a new CNF because a frozen cell fails
    - Reading Stage 0 as ApproxMC, XOR hashing, cadical, a pdp encoder, or a decoder
    - Reading Stage 0 as an ECDLP advantage
    - Authorizing Stage 1 of EXP-ECDLP-79f8c4 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-628891 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-9e9536 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-90f602 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-4be480 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-6a97f4 from this contract
    - Authorizing Stage 17 of EXP-ECDLP-420e73 from this contract
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this contract
    - Editing EXP-ECDLP-a5f766 or H-ECDLP-a3598b
    - Changing H-ECDLP-536b21, H-ECDLP-3f68f6, H-ECDLP-b51c3d, H-ECDLP-4afa77, H-ECDLP-2ac931, H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6, or H-ECDLP-2ade73

  success_criterion: >
    Stage 0 succeeds as a measurement when
    fixture_pass, real_up_pass,
    known_false_unconstrained_pass,
    reject_invalid_pass, and null_unsat_pass
    are true, and the run manifest carries
    certificate.kind none. Success is
    instrument reproduction, not an ApproxMC
    claim and not an attack.

  falsification_criterion: >
    A certified KF3 miss of U=32 after
    fixture_pass is a scoped miss of P-S0-COUNT.
    A certified REAL3 (U, P) other than (8, 4)
    after fixture_pass is a scoped miss of
    P-S0-COUNT. Infrastructure bugs are not
    mathematics. Stage 0 does not test
    P-S1-APPROXMC.

  required_artifacts:
    - Stage 0 raw-result.json with the five gates
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt

  assigned_to: executor

  limitations:
    - One 5-variable toy CNF.
    - Not ApproxMC. Not XOR hashing. Not cadical.
    - Not the Trimoska pdp encoder.
    - No decoder. No cryptographic transfer.
    - No Stage 1 of 79f8c4. No Stage 1 of 628891.
      No Stage 1 of 9e9536. No Stage 1 of 90f602.
      No Stage 2 of 4be480. No Stage 2 of 6a97f4.
      No Stage 17 of 420e73. No Stage 5 of a98ea9.
    - Certificate kind none. No solve or attack.
    - W is not classified.
    - EXP-ECDLP-a5f766 remains another lane.
    - Do not hunt a new CNF.
