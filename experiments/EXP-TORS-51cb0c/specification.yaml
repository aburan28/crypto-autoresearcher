experiment:
  id: EXP-TORS-51cb0c
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-aabd67
  question_id: RQ-TORS-8c7b79
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: DIVISION-POLYNOMIAL VALUES ARE AUTOMORPHISM-EQUIVARIANT BY WEIGHTED HOMOGENEITY, SO THEY
    GIVE A CANONICAL WALK PARTITION ON E/Aut FOR CM CURVES -- and the honest question is whether that
    canonicity buys anything over the incumbent orbit-representative rule, which this proposal predicts
    it does not and measures the exact cost ratio at which it loses
  status: draft
  objective: "(A) THE ALGEBRAIC FACT, DERIVED HERE AND USED AS BOTH MECHANISM AND INSTRUMENT SELF-TEST.\
    \ Division polynomials are weighted-homogeneous: under the curve isomorphism (x, y) -> (u^2 x,\
    \ u^3 y) with (a, b) -> (u^4 a, u^6 b),\n  psi_n(u^2 x, u^3 y; u^4 a, u^6 b) = u^{n^2 - 1} psi_n(x,\
    \ y; a, b).\nFor ODD n, psi_n is a polynomial in x, a, b alone. Specialising to the extra automorphisms\
    \ of CM curves:\n  j = 0 (a = 0, |Aut| = 6): the automorphism is x -> zeta x with zeta a cube\n\
    \    root of unity, realised by u a primitive 6th root of unity (u^6 = 1 fixes b,\n    u^4 * 0\
    \ = 0 fixes a, u^2 = zeta). Hence\n    psi_ell(zeta x; 0, b) = u^{ell^2 - 1} psi_ell(x; 0, b):\
    \ the value is\n    multiplied by a FIXED root of unity depending only on ell.\n  j = 1728 (b\
    \ = 0, |Aut| = 4): the automorphism is x -> -x, realised by u = i\n    (u^4 = 1 fixes a, u^6 *\
    \ 0 = 0 fixes b, u^2 = -1). For odd ell,\n    ell^2 - 1 is divisible by 8, so i^{ell^2 - 1} =\
    \ 1 and\n    psi_ell(-x; a, 0) = psi_ell(x; a, 0) EXACTLY: the odd division polynomials\n    are\
    \ literally even functions of x on j = 1728 curves.\nCONSEQUENCE: the class of psi_ell(x(R)) modulo\
    \ the fixed root-of-unity scaling is invariant under the full automorphism group, so any function\
    \ of that class is a well-defined function on E/Aut. That is exactly the requirement a walk partition\
    \ must satisfy for an automorphism-quotient Pollard rho to be correct (KN-TECH-018): the partition\
    \ must be constant on Aut-orbits, or the walk is not well defined on the quotient.\n(B) THE HONEST\
    \ QUESTION, WHICH IS NOT WHETHER IT WORKS BUT WHETHER IT PAYS. The incumbent way to define a partition\
    \ on E/Aut is to pick a canonical orbit representative -- for j = 0, the minimum of {x, zeta x,\
    \ zeta^2 x} as integers in [0, p) -- and hash it. That costs 2 field multiplications plus 2 comparisons\
    \ per step. The psi_ell route costs (ell^2 - 1)/2 field multiplications per step by Horner: 4\
    \ at ell = 3, 12 at ell = 5, 24 at ell = 7, 60 at ell = 11, 84 at ell = 13. THE COMPARISON IS\
    \ THEREFORE DECIDED BEFORE ANY EXPERIMENT ON COST GROUNDS: the torsion partition is at least 2x\
    \ more expensive at ell = 3 and 42x more expensive at ell = 13, per step, against a rho walk whose\
    \ step count is 0.886*sqrt(N/|Aut|) and is partition-independent for any well-mixing partition.\
    \ THE PROPOSAL IS FILED ANYWAY, AND FOR A STATED REASON: the prediction that step count is partition-independent\
    \ is exactly the kind of \"obviously true\" claim that this program's own protocol requires to\
    \ be measured against a null, and the measurement has a second, non-obvious output -- the FRUITLESS-CYCLE\
    \ RATE, which IS partition-dependent and is the one place a structured partition could differ.\n\
    (C) THE TWO OUTCOMES, AND WHY NEITHER IS A NON-EVENT.\n  OUTCOME 1 (predicted) -- the psi_ell\
    \ partition gives a step count matching\n    0.886*sqrt(N/|Aut|) within the pre-registered tolerance,\
    \ identical to a\n    matched random partition of the same cell count, and a fruitless-cycle rate\n\
    \    also identical. Then the torsion structure contributes NOTHING beyond being\n    a legal\
    \ Aut-invariant function, the cost ratio measured in (B) stands as the\n    quantified domination,\
    \ and a plausible-sounding intuition -- \"a partition\n    derived from the curve's torsion structure\
    \ should interact better with the\n    curve's automorphisms\" -- is closed with a number attached\
    \ rather than with\n    a shrug.\n  OUTCOME 2 -- the fruitless-cycle rate differs materially.\
    \ Fruitless cycles on\n    automorphism-quotient walks arise when the walk maps a point into its\
    \ own\n    orbit, and their rate depends on how the partition interacts with the orbit\n    structure.\
    \ A partition that is CANONICALLY Aut-equivariant (as psi_ell is,\n    by (A)) rather than equivariant-by-construction\
    \ (as the orbit-representative\n    rule is) could plausibly have a different collision structure\
    \ with orbits.\n    If measured, this is a genuine if modest algorithmic observation about walk\n\
    \    design, and it is worth reporting with its cost ratio so a reader can see\n    immediately\
    \ that it does not pay at ell >= 5.\n\n(D) HARD-CONSTRAINT ENGAGEMENT. Is the data point-dependent?\
    \ YES -- psi_ell(x(R)) is evaluated at the walked point and changes with it, and it is publicly\
    \ computable with no discrete logarithm. Does it leak anything about k? NO, and the reason is\
    \ not the coprimality theorem (psi_ell is not homomorphic) but the rigidity theorem of IDEA-20260807-df906f:\
    \ a partition is a lossy projection of the point, and on a prime-order group no lossy projection\
    \ propagates exactly, so the partition cannot be used to search in partition-space instead of\
    \ in G. The partition's only role is the classical one -- to make a pseudo-random walk -- and\
    \ that role is worth exactly the sqrt(|Aut|) discount KN-TECH-018 already records as a CONSTANT,\
    \ never an exponent."
  resource_label: R5
  admissibility: admissible
  admissibility_argument: 'ADMISSIBLE AS A RESOURCE USE, WITH ZERO EXPONENT CLAIMED AND A DOMINATION
    ALREADY DERIVED. psi_ell is a field-level function of E[ell] and is not obtainable from the generic
    group oracle, so R5 escapes the generic model in the same way R1''s x-coordinate data does. But
    the escape is used only to define a partition function, and a partition function is exactly the
    part of Pollard rho that the generic-group analysis treats as a random oracle -- so the escape
    buys nothing by construction. This is the third distinct pattern this batch has recorded: a resource
    can escape the generic model and be (a) constant in k (IDEA-20260807-6eab6a), (b) simulable at
    the point level (IDEA-20260807-053a55), or (c) admissible but occupying a slot the analysis already
    models as random -- which is this record. Naming pattern (c) is part of the contribution, because
    "my object is non-generic" is otherwise easy to mistake for "my object helps".'
  reachability_gate: 'NOT APPLICABLE, and stated rather than omitted. The walk moves between POINTS
    on one fixed curve, never between curves, so T5 imposes no cost and no isogeny reachability question
    arises. Worth recording for the campaign: this is the one L7 proposal whose "walk" is a rho walk
    rather than an isogeny walk, and conflating the two would be an easy and expensive error -- rho
    walks track collisions in G (escape E4 of IDEA-20260807-df906f) while isogeny walks move between
    curves (IDEA-20260807-631e80), and the reachability gate binds only on the latter.'
  inputs:
    procedure: 'STAGE 0 (zero compute): derive (A), record both specialisations, and record the forced-value
      derivation for the step count so that a forced zero is not later written up as a controlled
      null. STAGE 1 (minutes, HARD GATE): the two algebraic self-tests -- the j = 1728 evenness identity
      and the j = 0 fixed-root-of-unity ratio. STAGE 2 (minutes, HARD GATE): the |Aut| = 2 baseline
      reproduction against 0.886*sqrt(N/2). STAGE 3 (hours): the three-partition comparison on j =
      0 and j = 1728 curves at 16, 20, 24 field bits, 5 seeds, at cell counts c in a declared ladder,
      with enough solves per cell for a usable cycle-rate interval. STAGE 4 (minutes): the non-invariant
      partition control, which must break the quotient walk. STAGE 5 (zero compute): the cost-ratio
      table. BUDGET: ell in {3, 5, 7} for the walk comparison -- ell = 11 and 13 are included in the
      COST table (which is arithmetic) but not in the walk runs, because a 30x or 42x per-step cost
      makes the wall clock dominate without changing any conclusion. This restriction is stated as
      a budget choice, not as a scientific one.'
    mechanism: "STEP 1 (zero compute) -- derive (A) and record the two specialisations as predictions\
      \ with forced values. The j = 1728 statement psi_ell(-x; a, 0) = psi_ell(x; a, 0) for odd ell\
      \ is an exact identity and is the cheapest possible instrument self-test: it must hold on every\
      \ sample or the division-polynomial code is wrong.\nSTEP 2 (implementation, low, reusing shared\
      \ code) -- a rho walk driver (harness/rho.py is the existing instrument) with a pluggable partition\
      \ function. Three partitions are registered:\n  PART-A (incumbent): canonical orbit representative\
      \ -- min over the Aut-orbit\n    of x -- hashed to c cells. Cost: 2 multiplications plus |Aut|/2\
      \ comparisons.\n  PART-B (this record): psi_ell(x(R)) reduced to its scaling class and hashed\
      \ to\n    c cells. Cost: (ell^2 - 1)/2 multiplications.\n  PART-C (the null): a keyed random\
      \ function of the canonical orbit\n    representative, hashed to the SAME c cells. Same cell-count,\
      \ same\n    Aut-invariance, no torsion content.\nAll three must be Aut-invariant or the walk\
      \ on the quotient is incorrect; the driver asserts invariance per partition on a battery of\
      \ orbit-mates before any walk runs.\nSTEP 3 (measurement) -- on j = 0 (|Aut| = 6) and j = 1728\
      \ (|Aut| = 4) toy curves at 16, 20, 24 field bits, 5 seeds each, run rho to solution under each\
      \ partition and record: step count, step count divided by sqrt(N/|Aut|), fruitless cycles encountered,\
      \ wall clock, and field multiplications per step. Also run the generic |Aut| = 2 family as the\
      \ r = 1 baseline.\nSTEP 4 (the cost ratio, which is the actual deliverable) -- report field\
      \ multiplications per step for PART-B against PART-A as a function of ell, and the resulting\
      \ wall-clock ratio. The ARITHMETIC ratio is known in advance from (B) -- (ell^2-1)/2 against\
      \ 2, i.e. 2x at ell = 3 up to 42x at ell = 13 -- and the measurement's job is the WALL-CLOCK\
      \ ratio, which differs because of interpreter overhead and is the number a practitioner would\
      \ actually see.\nSTEP 5 (the fruitless-cycle comparison) -- the only non-forced measurement\
      \ here. Report cycle rates for all three partitions with confidence intervals, against the PART-C\
      \ null."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - PART-C matched random partition, same cell count, same Aut-invariance (blocking)
  - '|Aut| = 2 baseline reproduction against 0.886*sqrt(N/2) (blocking)'
  - non-Aut-invariant partition, must break the quotient walk (blocking)
  - j = 1728 evenness identity self-test (blocking)
  - j = 0 fixed-root-of-unity ratio self-test (blocking)
  - cell-count ladder as the decay parameter
  - anomalous / smooth-order exclusion per KN-TECH-034 before any timing
  - 'NULL OBJECT (from the proposal): MANDATORY AND SUPPLIED. MATCHED NULL OBJECT: PART-C -- a keyed
    random function of the canonical orbit representative, hashed to the SAME number of cells, therefore
    matched on Aut-invariance, on cell count, and on cell-occupancy distribution, and differing from
    PART-B ONLY in carrying torsion content. This is the object null: it removes the torsion meaning
    and preserves everything a partition is supposed to have. DECAY PARAMETER: the number of cells
    c. Any difference between PART-B and PART-C must DECAY as c grows, because at large c both partitions
    approach the random-oracle idealisation that the 0.886 constant assumes, and the difference should
    vanish. A difference that is FLAT in c is the canonical artifact tell (docs/inventor-protocol.md
    section 3) and would indicate the driver is responding to something other than the partition --
    most likely a difference in how the two partitions handle the point at infinity or the zeros of
    psi_ell. SECOND DECAY PARAMETER: field bits. Any step-count difference must shrink relative to
    sqrt(N/|Aut|) as N grows; a constant absolute difference is a small-N artifact. FORCED-VALUE DERIVATION
    (KN-TECH-1a5b7e obligation 4): the step-count contrast between PART-B and PART-C is FORCED TO
    ZERO under the standard rho analysis, which treats any well-mixing partition as a random oracle.
    So the step-count measurement CANNOT distinguish the hypotheses and is included only as a calibration
    against 0.886*sqrt(N/|Aut|). The measurement that is NOT forced is the fruitless-cycle rate, and
    that is where the record''s only real question lives. Stating this before the run is what keeps
    a forced zero from being written up as a controlled null.'
  independent_variables: []
  metrics:
    primary:
    - step count and step count / sqrt(N/|Aut|) per (curve, partition, seed)
    - fruitless-cycle count per solve, with intervals
    - field multiplications per step, measured
    - wall clock per solve
    secondary:
    - psi_ell self-test residuals
    - cell-occupancy distribution per partition (to confirm matched shape)
  heuristic_under_test: null
  preregistered_prediction:
    quantity: psi_ell(-x(R)) - psi_ell(x(R)) on j = 1728 curves (b = 0), odd ell, all sampled points
    formula: Exactly 0 on 100 percent of samples. BASIS - derivation in claim (A) using i^{ell^2-1}
      = 1 for odd ell (since 8 divides ell^2 - 1); this is an algebraically FORCED instrument self-test,
      not a finding, and a non-zero value means the division-polynomial code is wrong.
    source: pre-registered in IDEA-20260807-aabd67 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - Cell-occupancy imbalance. If PART-B's cells are unevenly occupied relative to PART-C's, the comparison
    measures hash quality rather than torsion content. The occupancy distribution is a required metric
    for exactly this reason.
  - The zero cell. psi_ell(x(R)) = 0 for ell-torsion R must be handled identically by PART-B and PART-C,
    or the comparison is confounded at a rare but systematically placed set of points.
  - Interpreter overhead. In pure Python the cost of a partition evaluation relative to a group operation
    is very different from what it would be in a compiled implementation, so the WALL-CLOCK ratio
    does not transfer. The ARITHMETIC ratio does, and both must be reported with the distinction stated.
  - Small N. At 16 bits the walk is short enough that cycle events are rare and the interval is dominated
    by the number of solves, not by the effect.
  - Curve family constraints. j = 0 requires p ≡ 1 mod 3 and j = 1728 requires p ≡ 1 mod 4; comparing
    across families without matching N confounds |Aut| with instance size.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Exactly 0 on 100 percent of samples. BASIS - derivation in claim (A) using i^{ell^2-1}
    = 1 for odd ell (since 8 divides ell^2 - 1); this is an algebraically FORCED instrument self-test,
    not a finding, and a non-zero value means the division-polynomial code is wrong.
  falsification_criterion:
  - The j = 1728 evenness identity fails. The division-polynomial code is wrong; every number in this
    record and in IDEA-20260807-df906f built on the same code is void.
  - The j = 0 scaling ratio varies with R. Claim (A) is false as derived and the record is superseded
    rather than amended.
  - The |Aut| = 2 baseline misses 0.886*sqrt(N/2) by more than 20 percent. harness/rho.py's accounting
    is off; the partition comparison is uninterpretable.
  - The non-Aut-invariant partition does NOT break the quotient walk. Either the quotient walk is
    not actually running on the quotient, or the invariance requirement is not load-bearing as stated;
    both invalidate the design.
  - PART-B's step count differs from PART-C's beyond 10 percent. Since the contrast is FORCED to zero
    by the standard analysis, a difference is a signal that one partition mixes badly, which is a
    property of the specific hash and cell count rather than of torsion, and must be diagnosed via
    the cell-occupancy distribution before anything is reported.
  - The cycle-rate intervals are too wide to distinguish anything within budget. That is a POWER outcome,
    is recorded as such, and is not evidence of no difference.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
