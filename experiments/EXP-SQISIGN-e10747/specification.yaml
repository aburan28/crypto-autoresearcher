experiment:
  id: EXP-SQISIGN-e10747
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-SQISIGN-c0488f
  question_id: RQ-SQISIGN-39f231
  goal_id: GOAL-SQISIGN-002
  batch_id: null
  title: >-
    The byte-budget completeness certificate: nine pre-registered residuals that
    decide whether the SQIsign published-data inventory is complete, plus a
    deletion ladder that proves the certificate can detect an omission

  objective: >-
    Supply the acceptance gate that GOAL-SQISIGN-002's first completion criterion
    needs and that its fourth completion criterion directs the Red Team at. An
    inventory is a list, and a list carries no internal check against omission;
    the specification's own size table supplies one, because the sum of the
    declared component encodings must equal the stated total exactly. This
    contract evaluates that sum at three security levels for three objects, and
    -- more importantly -- proves that the check can DETECT an omission, by
    deleting components one at a time and requiring the residual to grow by
    exactly the deleted width.

  what_this_is_not:
    - Not an attack, a cryptanalysis, or any statement about hardness, cost, exponents, or the security of SQIsign.
    - Not a claim that the specification contains an error. The two residuals this contract pre-registers are extraction-uncertain until Stage 0 says otherwise, and a documentation or extraction question is not a defect and is never a vulnerability.
    - Not sufficient for inventory correctness. It can detect an omitted or spurious component; it cannot detect a component that is present, correctly sized, and wrongly described. That burden is EXP-SQISIGN-1177f2's.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling:
    tier: toy
    documentary_component: >-
      Entirely documentary. Every quantity is integer arithmetic on integers
      printed in a published document.
    experimental_component: >-
      None. No mathematical object is computed, no instance is generated, no
      randomness is used.
    exact_scope_a_run_could_support: >-
      At most: that the component list of SQIsign v2.0.1 Section 4.6 accounts for
      PUBLICKEY_BYTES, SECRETKEY_BYTES and SIGNATURE_BYTES exactly at the levels
      where the residual is zero, and that at any level where it is not, a stated
      number of bytes is unaccounted for. Nothing about security, and nothing
      about any other version or variant.

  inputs:
    primary_source:
      title: "SQIsign Algorithm specifications and supporting documentation, Version 2.0.1"
      date: '2025-07-07'
      url: https://sqisign.org/spec/sqisign-20250707.pdf
      sha256: >-
        NOT RECORDED. To be computed by the executor at Stage 0. This session
        fetched the file (HTTP 200, 1,087,080 bytes) but did not record a digest
        into the ledger and does not assert one.
    declared_component_lists_from_section_4_6:
      public_key: [E_pk_montgomery_coefficient, hint_pk]
      secret_key: [public_key, I_sk, M_sk]
      signature: [E_aux, n_bt, r_rsp, M_chl, chl, hint_aux, hint_chl]
    declared_widths:
      field_element_bytes: "FP_ENCODED_BYTES = 32 / 48 / 64"
      curve_bytes: "EC_CURVE_ENCODED_BYTES = 2 * FP_ENCODED_BYTES = 64 / 96 / 128"
      hint_bytes: 1
      n_bt_bytes: 1
      r_rsp_bytes: 1
      m_chl_component_bytes: "floor((e_rsp + 7) / 8) = 16 / 24 / 32"
      chl_bytes: "lambda / 8 = 16 / 24 / 32"
      m_sk_component_bytes: "TORSION_2POWER_BYTES = floor((f + 7) / 8) = 32 / 48 / 63"
      ideal_bytes: "nrd(I) as one FP_ENCODED_BYTES integer plus four FP_ENCODED_BYTES quaternion coefficients = 5 * FP_ENCODED_BYTES"
    declared_totals_from_table_4_and_appendix_b:
      publickey_bytes: {NIST-I: 65, NIST-III: 97, NIST-V: 129}
      secretkey_bytes: {NIST-I: 353, NIST-III: 529, NIST-V: 701}
      signature_bytes: {NIST-I: 148, NIST-III: 224, NIST-V: 292}
    derived_parameters:
      e_rsp: {NIST-I: 126, NIST-III: 192, NIST-V: 253}
      f: {NIST-I: 248, NIST-III: 376, NIST-V: 500}
      lambda: {NIST-I: 128, NIST-III: 192, NIST-V: 256}
    seeds_and_seed_derivation_rule: >-
      NONE. The contract is deterministic and uses no randomness. This field
      records that fact rather than inventing a seed.
    reproducibility_rule: >-
      A third party reproduces every number by fetching the URL, extracting Table
      4 and Appendix B by any two independent methods, and evaluating the stated
      integer formulas. There are no free choices.

  arms_and_controls:
    treatment: >-
      Evaluate residual(object, level) = stated_total - sum(declared component
      widths), for object in {public key, secret key, signature} and level in
      {NIST-I, NIST-III, NIST-V}. Nine integers.
    measured_null: >-
      THE DELETION LADDER, which is what makes this a test rather than a
      tautology. For each of the seven declared signature components in turn,
      delete it from the component list and recompute the residual. FORCED
      VALUES DERIVED BEFORE THE RUN: deleting a component of width w must change
      the residual by exactly +w, for every one of the seven. Then delete two and
      three components at a time (all C(7,2) = 21 and C(7,3) = 35 subsets) and
      require the residual to equal the sum of the deleted widths, with
      monotonicity in the number deleted. THIS NULL CAN FAIL: if a deletion does
      not move the residual, or moves it by the wrong amount, the procedure is not
      measuring completeness and NO COMPLETENESS CLAIM MAY BE MADE FROM IT.
    positive_control: >-
      The NIST-III signature cell, where this session's reading predicts a
      NON-ZERO residual of exactly 4. It is the only cell in the battery where a
      non-zero value is expected on unmodified input, and it is therefore the
      instrument's only demonstration that it can produce a non-zero residual
      without being deliberately mutilated. IF IT RETURNS 0 WHILE NIST-I AND
      NIST-V ALSO RETURN 0, the only remaining sensitivity evidence is the
      deletion ladder, which MUST then be run in full before any completeness
      claim is recorded.
    graded_control: >-
      The deletion ladder at 1, 2 and 3 deleted components is the graded control
      and has three interior points, meeting the minimum. Monotonicity in the
      number of deleted components is reported explicitly, and any non-monotone
      cell localises the defect to a specific component.
    ordering_control: >-
      The nine pre-registered residual values -- (0,0,0) for the public key,
      (0,0,0) for the secret key under the Section 4.6 ideal encoding, and
      (0,4,0) for the signature -- are committed in IDEA-20260805-244f78 and in
      this contract, both written before approval. They may not be revised after
      any output is observed. The deletion ladder's forced values are likewise
      committed here.
    comparability_policy: >-
      No comparison to SQIsign v2.0, SQIsign2D-West, or any Round-3 document is
      admissible without a separately registered comparator contract naming both
      documents. Sizes are version-specific.

  stages:
    - id: S0
      name: Re-extract
      cost: "<= 900 s"
      can_terminate_the_run: true
      steps:
        - "Fetch the PDF, record SHA-256, byte size, HTTP status."
        - >-
          Extract Table 4 (Section 7.1) and the Appendix B encoding table by TWO
          independent methods and diff them. Report every disagreement. If the two
          methods disagree on any of the nine totals, STOP and report the
          extraction as unreliable; the residuals are then not computable and this
          is an infrastructure outcome, not a finding.
    - id: S1
      name: The nine residuals
      cost: "<= 600 s, integer arithmetic"
      can_terminate_the_run: true
      steps:
        - "Evaluate all nine residuals and report against the pre-registered (0,0,0) / (0,0,0) / (0,4,0)."
        - >-
          Report separately the residual for the secret key under BOTH readings of
          the Appendix B formula (4 * FP_ENCODED_BYTES as extracted, and 5 *
          FP_ENCODED_BYTES as Section 4.6's ideal encoding requires), so a reviewer
          sees which reading closes and by how much, rather than being handed the
          one that works.
    - id: S2
      name: The deletion ladder
      cost: "<= 600 s"
      can_terminate_the_run: true
      steps:
        - "All 7 single deletions, all 21 double deletions, all 35 triple deletions, on the signature component list at NIST-I. Report residual versus sum of deleted widths for each, and monotonicity."
    - id: S3
      name: Specification versus artefact
      cost: "<= 1800 s"
      can_terminate_the_run: false
      steps:
        - >-
          Fetch the SQIsign reference implementation's public headers from the
          SQIsign GitHub organisation and compare CRYPTO_PUBLICKEYBYTES,
          CRYPTO_SECRETKEYBYTES and CRYPTO_BYTES, and the serialisation routine's
          field list, against Section 4.6. Report any field present in the code and
          absent from the document.
        - >-
          If KAT files are obtainable, check observed byte lengths of one pk, sk
          and signature per level.
        - >-
          IF THE SOURCES CANNOT BE FETCHED this is recorded as an unobtained source
          and an infrastructure outcome, never as agreement.

  metrics:
    primary:
      - "residual_publickey[level]: signed integer, three values. Pre-registered (0, 0, 0)."
      - "residual_signature[level]: signed integer, three values. Pre-registered (0, 4, 0)."
      - "residual_secretkey[level] under the Section 4.6 ideal encoding: pre-registered (0, 0, 0)."
      - "deletion_ladder_exactness: fraction of the 63 deletion cells whose residual equals the sum of the deleted widths. Pre-registered 63/63."
    secondary:
      - "residual_secretkey[level] under the Appendix B formula as extracted: pre-registered (32, 48, 64), i.e. the formula as extracted does NOT close."
      - "extraction_disagreement_count between the two methods, over the nine totals and the encoding constants."
      - "eighth_field_count: fields in the reference implementation's serialisation absent from Section 4.6. Pre-registered 0."
      - "kat_length_match: boolean per object per level, or NOT RUN."

  preregistered_prediction:
    quantity: >-
      The nine residuals, the deletion-ladder exactness fraction, and the
      eighth-field count.
    formula: >-
      PUBLICKEY_BYTES = 1 + EC_CURVE_ENCODED_BYTES.
      SIGNATURE_BYTES = 4 + EC_CURVE_ENCODED_BYTES + 4*floor((e_rsp+7)/8) +
      lambda/8, which evaluates to 148, 220 and 292 against stated 148, 224 and
      292 -- hence the pre-registered (0, 4, 0).
      SECRETKEY_BYTES = PUBLICKEY_BYTES + 5*FP_ENCODED_BYTES +
      4*TORSION_2POWER_BYTES, which evaluates to 353, 529 and 701 against stated
      353, 529 and 701 -- hence (0, 0, 0); the 4* reading gives 321, 481 and 637,
      hence (32, 48, 64).
      Deletion exactness follows from length-additivity of concatenation, which is
      exact because every component width is fixed per instance.
    source: >-
      SQIsign v2.0.1 Section 4.6, Section 7.1 Table 4, and Appendix B, READ
      2026-08-06 and computed in IDEA-20260805-244f78 before this contract was
      written. No value may be revised after any output is observed.

  scale_relevance:
    tier: toy
    justification: >-
      The result is documentary and does not scale in any direction, because it
      is a statement about one document at its own three declared parameter sets.
      Evaluating at all three levels is the only generalisation available and it
      is performed. Nothing here transfers to any other scheme, version or
      variant, and no outcome is evidence about SQIsign's security at any scale.
    correspondence: null

  tail_checks:
    - >-
      The NIST-III signature residual and the NIST-III-only anomaly in the surplus
      identity of H-SQISIGN-c0488f, if it appears, must be reported together as a
      possible common extraction fault at that level rather than as two
      independent findings.
    - >-
      A residual that is a multiple of 4 at every level where it is non-zero is
      consistent with a per-M_chl-component off-by-one; a residual equal to
      FP_ENCODED_BYTES is consistent with a missing field element. The contract
      requires the report to state which pattern, if any, the observed residual
      matches, rather than reporting a bare integer.

  replication:
    seeds: []
    seeds_note: Deterministic contract; no randomness is used.
    independent_instances: 3
    interpretation: >-
      One execution suffices for a deterministic arithmetic check. What is NOT
      replicated by one execution is the extraction, which is why two independent
      extraction methods are mandatory at Stage 0.

  budget:
    wall_clock_seconds_per_run: 3900
    total_cpu_hours: 0.2
    maximum_memory_gb: 1
    maximum_runs: 1
    network: >-
      REQUIRED for Stage 0 and Stage 3, and to be granted explicitly at approval.
      Stages 1 and 2 need no network once the constants are extracted.
    budget_note: >-
      Small enough to run inside a single batch of GOAL-SQISIGN-002's 10,800-second
      campaign budget alongside Stage 0 of EXP-SQISIGN-1177f2. Budget exhaustion is
      a budget outcome and never a finding (AGENTS.md rule 5).

  stopping_rules:
    - Do not execute unless separately reviewed, approved, frozen, archived and execution-authorized by the Coordinator.
    - STOP at Stage 0 if the two extraction methods disagree on any of the nine totals; the residuals are not computable and that is an infrastructure outcome.
    - STOP before reporting any completeness claim if the deletion ladder's exactness fraction is below 63/63.
    - Stop on wall-clock exhaustion, recording which stages completed.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any pre-registered residual revised after an output was observed.
    - Reporting only the secret-key reading that closes, without also reporting the reading that does not.
    - Reporting a completeness claim without the deletion ladder.
    - A SHA-256 asserted rather than computed, or a KAT check reported as passed when the KATs were not obtained.
    - Any characterisation of a residual as a defect in SQIsign, or as a security-relevant finding of any kind.

  infrastructure_failure_disposition: >-
    A proxy refusal, a 403, a failed fetch, an extraction crash, an unobtainable
    reference implementation or KAT file, or a timeout is recorded as
    INFRASTRUCTURE SIGNAL and is NEVER negative mathematical evidence and never
    evidence about inventory completeness (AGENTS.md rule 5). In particular, an
    inability to obtain the reference implementation means Stage 3 is recorded as
    NOT RUN and the certificate covers the document only, which must be stated on
    every citation of it.

  success_criterion: >-
    No current success outcome: the contract is not authorized for execution and
    its only present disposition is review_required. IF later approved, frozen and
    authorized, the positive disposition is: two independent extractions agreeing
    on all nine totals; the nine residuals reported against their pre-registered
    values with both secret-key readings shown; a deletion-ladder exactness of
    63/63; and an explicit verdict SEALED or NOT SEALED on the inventory, where
    SEALED requires every residual either zero or fully explained. A SEALED verdict
    with an unrun deletion ladder is inadmissible. The certificate establishes no
    security, cost, exponent or cryptographic-scale claim of any kind.

  falsification_criterion: >-
    A non-zero residual at NIST-I or NIST-V for any object -- the seven-component
    signature inventory and the two-component public-key inventory would then be
    incomplete and every downstream statement in GOAL-SQISIGN-002 is blocked until
    the missing item is named. Or a deletion-ladder exactness below 63/63 -- the
    procedure is then not a completeness test. Or an extraction showing NIST-III's
    signature size is 220, which falsifies this contract's pre-registered (0,4,0)
    and localises the whole discrepancy to the extractor.

  required_artifacts:
    - The fetched PDF with SHA-256, byte size, HTTP status and timestamp.
    - Both extraction outputs for Table 4 and Appendix B, and their diff.
    - A machine-readable table of the nine residuals with the arithmetic shown for each.
    - The full 63-cell deletion-ladder table.
    - The reference implementation's three size constants with file and line, or a NOT RUN record with the reason.
    - Manifest, environment, commands, stdout, stderr.
    - A snapshot archive followed by independent Validator and Red Team review, with the Red Team directed at whether the certificate can actually detect an omission.

  approval_requirements:
    - Independent review confirms the pre-registered residuals are stated before execution and that the deletion ladder is enforceable from the artifacts.
    - Independent review confirms the contract makes no security claim and cannot be cited as one.
    - Coordinator separately approves and freezes; network access granted explicitly.

  approval_status: >-
    Pending review. No approved_by field is present because this contract is not
    approved and only the Coordinator may approve it (AGENTS.md rule 1).

  assigned_to: executor
