# EXP-LHW-54723e
# Threshold-count arithmetic. No walk is run.
# Approved by DEC-20261003-ec86b2.
experiment:
  id: EXP-LHW-54723e
  hypothesis_id: H-LHW-c72fa4
  source_idea: IDEA-20260930-79abd9
  question_id: RQ-LHW-1877bb
  version: 1
  title: Written entropy figures versus one half
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-ec86b2
  objective: >-
    Check the cross 2, the difference 1/7500, and the quotient 16.
  inputs:
    half_cross: 2
    half_gap_num: 1
    half_gap_den: 10000
    written_h11_num: 4999
    threshold_cross: -2
    threshold_num: -1
    threshold_den: 5000
    two_thirds_cross: 4
    two_thirds_gap_num: 1
    two_thirds_gap_den: 7500
    written_h174_num: 6668
    balanced_cross: 4
    balanced_gap_num: 1
    balanced_gap_den: 15000
    exponent_ratio: 2
    rho_hi: 8
    rho_lo: 2
    rho_excess: 6
    t_lo: 64
    t_hi: 1024
    t_quot: 16
    const_prod: 23353
  controls:
    - >-
      One half exceeds 4999/10000 by cross 2, and the difference
      is 1/10000. Reporting the written figure as 1/2 drops that
      cross and invalidates the run.
    - >-
      Twice 4999 minus 10000 is -2, so twice the written figure
      minus one is -1/5000. 6668/10000 exceeds 2/3 by cross 4,
      and the difference is 1/7500. Half of 6668/10000 exceeds
      1/3 by cross 4, and the difference is 1/15000. The ratio
      of the two written exponent formulas is 2.
    - >-
      Eight exceeds 2 by 6. 1024 divided by 64 is 16. The product
      of 8 and 2 is 16. The product of 193 and 121 is 23353.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {half, two_thirds, powers}
    - route in {cross, divide}
  metrics:
    primary:
      - half_cross
      - two_thirds_gap_den
      - t_quot
      - implementations_agree
    secondary:
      - threshold_cross
      - rho_excess
      - const_prod
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      One half exceeds 4999/10000 by cross 2. 6668/10000 exceeds
      2/3 by 1/7500. 1024 divided by 64 is 16.
    formula: >-
      Cross 1/2 with 4999/10000. Cross 6668/10000 with 2/3.
      Divide 1024 by 64. Multiply 8 by 2. Multiply 193 by 121.
    source: >-
      IDEA-20260930-79abd9 states the four-place figures 0.4999
      and 0.6668, the targets 1/2 and 2/3, the exponent ratio 2,
      the thresholds 2 and 8, the powers 2^6 and 2^10, and the
      constants 1.93 and 1.21, read 2026-10-03. No group order is
      named as an integer. The crosses were recomputed in this
      design session. That computation is not a run. No walk was
      run.
  scale_relevance:
    tier: toy
    justification: Two written four-place figures and two written powers. No transfer to a deficit.
    correspondence: null
  tail_checks:
    - The difference 1/7500 and the quotient 16 are required. A check that stops at the cross 2 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the cross 2 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The half cross is not 2.
    - The two-thirds difference is not 1/7500.
    - The quotient is not 16.
    - The written figure is reported as 1/2, or a walk is run.
  success_criterion: >-
    Both runs agree that one half exceeds 4999/10000 by cross 2,
    that 6668/10000 exceeds 2/3 by 1/7500, that 8 exceeds 2 by 6,
    and that 1024 divided by 64 is 16.
  falsification_criterion: >-
    The runs agree that the cross of 1/2 against 4999/10000 is
    computed, and that cross is not 2.
  required_artifacts:
    - experiments/EXP-LHW-54723e/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-LHW-54723e/runs/<RUN-ID>/command.txt
    - experiments/EXP-LHW-54723e/runs/<RUN-ID>/stdout.log
    - experiments/EXP-LHW-54723e/runs/<RUN-ID>/stderr.log
    - experiments/EXP-LHW-54723e/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-LHW-54723e/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any walk, sumset count, or table construction.
    - Any claim that a cross of 2 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
