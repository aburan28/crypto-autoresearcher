experiment:
  id: EXP-PRECOMP-012
  status: proposed
  title: Equal-budget relation precompute versus solver precompute
  objective: >-
    Under identical offline compute budgets, compare spending work on traditional
    relation/log databases versus spending it on reusable solver state, then
    measure total cost over fresh target batches.
  fixtures:
    field_bits: [13, 16, 20, 24, 28]
    curve_seeds: [1, 2, 3]
    target_batch_sizes: [1, 10, 100, 1000, 10000]
  strategies:
    traditional_relation_precompute: >-
      Spend the frozen offline budget generating and verifying factor-base
      relations/log information available to all later targets.
    reusable_solver_precompute: >-
      Spend the same offline budget on the best validated trace/prefix/template
      mechanism from PRECOMP-002/004/005/007.
    hybrid: >-
      Split the same budget using a predeclared 50/50 allocation.
  metrics:
    primary: total_batch_cost
    required:
      - offline_cost
      - online_cost_per_target
      - solved_target_fraction
      - verified_relation_count
      - break_even_batch_size
      - storage_bytes
      - peak_memory_bytes
  accounting: >-
    All offline and online computation, failed attempts, verification, lookup,
    serialization, and linear algebra are charged. Strategies receive exactly
    the same offline wall-clock or normalized-operation budget per cell.
  controls:
    - identical curve and target batch across strategies
    - same solver backend where applicable
    - independent verification of every accepted relation/log/decomposition
  success_criterion: >-
    Solver-precompute or hybrid strategy beats traditional relation precompute
    by >=2x total charged cost at some N<=1000 in two >=20-bit cells.
  strong_signal: >-
    The solver-precompute crossover N decreases as field size increases.
  falsification_hook: >-
    Traditional relation precomputation dominates at every tested N after equal
    offline-budget accounting.
  depends_on: [EXP-PRECOMP-002, EXP-PRECOMP-004, EXP-PRECOMP-005, EXP-PRECOMP-007]
