# EXP-ECDLP-64fbb4
# Subset-door count arithmetic. No predictor is sampled.
# Approved by DEC-20261003-34289b.
experiment:
  id: EXP-ECDLP-64fbb4
  hypothesis_id: H-ECDLP-bdd8ab
  source_idea: IDEA-20260930-a6491b
  question_id: RQ-ECDLP-4fcbd3
  version: 1
  title: Density one half versus the written cost
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-34289b
  objective: >-
    Check the quotient 2, the product 8, and the cross 2.
  inputs:
    half_cost: 2
    half_cross: 1
    quarter_coefficient: 4
    minimum_coefficient: 2
    coefficient_excess: 2
    coefficient_product: 8
    exponent_cross: 2
    bias_cross: 2
    meeting_cross: 0
  controls:
    - >-
      One divided by one half is 2. Reporting the density as 1 drops
      the cost to 1 and invalidates the run.
    - >-
      Four exceeds 2 by 2, and 4 times 2 is 8. The cross of 3/4
      against 1/2 is 2. The cross of 1/2 against 1/4 is 2. The
      meeting cross of 1/2 against 1/2 is 0.
    - >-
      One against one half has cross 1.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {cost, product, cross}
    - route in {divide, multiply}
  metrics:
    primary:
      - half_cost
      - coefficient_product
      - exponent_cross
      - implementations_agree
    secondary:
      - half_cross
      - bias_cross
      - meeting_cross
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      One divided by one half is 2. Four times 2 is 8. The cross of
      3/4 against 1/2 is 2. The meeting cross is 0.
    formula: >-
      Divide 1 by 1/2. Multiply 4 by 2. Cross 3/4 with 1/2. Cross
      1/2 with 1/2.
    source: >-
      IDEA-20260930-a6491b states the density 1/2, the cost 2, the
      meeting at a square root, the concentration exponent 3/4, and
      the bias exponents 1/2 and 1/4, read 2026-10-03. It does not
      name the group order as an integer. The products were
      recomputed in this design session. That computation is not a
      run. No predictor was sampled.
  scale_relevance:
    tier: toy
    justification: One written density and three written exponents. No transfer to an advantage.
    correspondence: null
  tail_checks:
    - The product 8 and the cross 2 are required. A check that stops at the quotient 2 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the quotient 2 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The quotient is not 2.
    - The product is not 8.
    - The cross is not 2.
    - The meeting cross is not 0.
    - The density is reported as 1, or a predictor is sampled.
  success_criterion: >-
    Both runs agree that 1 divided by 1/2 is 2, that 4 times 2 is 8,
    that the cross of 3/4 against 1/2 is 2, and that the meeting
    cross is 0.
  falsification_criterion: >-
    The runs agree that 1 divided by 1/2 is computed, and that
    quotient is not 2.
  required_artifacts:
    - experiments/EXP-ECDLP-64fbb4/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-64fbb4/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-64fbb4/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-64fbb4/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-64fbb4/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-64fbb4/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any predictor sample, subset census, or walk.
    - Any claim that a subset door is closed.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
