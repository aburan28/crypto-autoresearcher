experiment:
  id: EXP-SHATHREE-d1158e
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-13b1ca; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-13b1ca
  question_id: RQ-SHATHREE-cd2cb2
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Three-arm comparison of the deviation-growth curve over Keccak-f[1600], over 1000 z-equivariant
    random permutations of matched shape and density, and over 1000 non-equivariant matched-density
    controls, with zero-constant validation
  objective: The uncertainty a run reduces is whether the symmetry-decay curve this bucket measures
    is a fact about SHA-3 or a fact about the architecture class SHA-3 belongs to. (i) It establishes,
    by exact matrix commutation checks and a zero-constant validation, that a constructible family
    of Keccak-shaped random permutations preserves the same fixed subspaces S_t that Keccak does,
    and that a matched-density family without the equivariance constraint does not -- turning 'symmetry
    preservation' from a headline property into a verified generic feature of the shape, and isolating
    the constants as the sole injection site in both. (ii) It runs the byte-identical curve computation
    used by the companion active-row contract over 1000 members of each family and over Keccak itself,
    emitting active-row, Hamming-weight and z-support curves for rounds 1-12 and placing Keccak at
    an explicit quantile of each null distribution per round and per statistic. (iii) It reports whether
    the equivariant and non-equivariant null distributions separate at all, which is the internal
    validity check without which the whole comparison is uninterpretable -- a measurement that cannot
    see the property it was built around has falsified itself and that outcome is recorded as the
    primary result if it occurs.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: ''over the constructed shape class,
      sampled members preserve S_t exactly and produce deviation-growth curves whose distribution
      places Keccak-f[1600] at the following quantiles per round and statistic; the non-equivariant
      control family separates from the equivariant one by the following amount.'' What does NOT follow:
      any statement that SHA-3 is stronger or weaker than a random member of its shape class, any
      security consequence, any attack, any claim about achievable round counts, and anything about
      full 24-round SHA-3 or any deployed use.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes). Import the hashlib-validated Keccak transcription and the
      companion contract''s curve function unchanged. STAGE 1 (cost: ~4h human, ~10 min CPU). Implement
      sampling of 25x25 matrices over GF(2)[z]/(z^64-1) at density matched to theta.rho.pi; expand
      each to a 1600x1600 GF(2) matrix; reject singular draws and record the rejection rate. STAGE
      2 (cost: ~20 min CPU). Verify commutation with tau_t for all t | 64 on every sampled member,
      by exact matrix comparison. STAGE 3 (cost: ~10 min CPU). Zero-constant validation: run the deviation
      recursion from a symmetric start with all constants zero on 100 members of each family; equivariant
      members must give identically zero deviation at every round and non-equivariant members must
      not. Halt if this fails. STAGE 4 (cost: ~3h CPU). Draw random constants of matched support shape
      and run the twelve-round curve computation on 1000 equivariant and 1000 non-equivariant members
      plus the FIPS arm. STAGE 5 (cost: ~1h CPU). Repeat stage 4 for the two sensitivity matchings
      (branch number, rank profile) at 200 members each. STAGE 6 (cost: ~30 min). Emit quantile positions,
      separation statistics, rejection rates and the run manifest with all seeds.'
    instrument: Python 3.11; numpy bit-packed GF(2) linear algebra with hand-written rank, multiply
      and commutation routines; polynomial arithmetic in GF(2)[z]/(z^64-1) implemented directly on
      64-bit integers with carry-less convolution; the hashlib-validated pure-Python Keccak-f[1600];
      the companion contract's curve function imported unchanged. No Sage. Manifests, seeds and the
      inference block via harness/runner.py.
    parameters: '1000 equivariant members, 1000 non-equivariant members, plus 200 members each for
      two sensitivity matchings. Linear-layer density matched to theta.rho.pi. Nonlinear layer: one
      uniformly random 5-bit permutation shared across rows, plus a per-y independent variant as a
      secondary arm. Constants: matched support shape {z = 2^j - 1}. Translations t in {1,2,4,8,16,32}.
      Rounds r = 1..12. PCG64 seeds 1..2400 declared in advance.'
  controls:
  - 'Zero-constant validation: equivariant members must give identically zero deviation from a symmetric
    start; non-equivariant members must not.'
  - 'Commutation check: every sampled equivariant member''s induced 1600x1600 matrix must commute
    with tau_t for all t | 64, by exact matrix comparison.'
  - 'Singularity rejection: non-invertible linear layers are rejected and the rejection rate is reported,
    since a singular layer is not a permutation and would bias the curves.'
  - 'Density-matching sensitivity: repeat with branch-number matching and with rank-profile matching
    as declared secondary arms.'
  - 'Code-identity control: the curve computation is the byte-identical function used by the companion
    active-row contract, invoked with a different permutation object.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): This entry IS the null-object control for the bucket, so its own control
    is a positive one: the non-equivariant arm, in which the linear layer is drawn with matched density
    but no commutation constraint. For the equivariant null to be interpretable, the non-equivariant
    arm must show visibly different behaviour -- specifically the fixed subspaces S_t must fail to
    be preserved, and the deviation must become nonzero even with all constants set to zero. If the
    two null arms are indistinguishable on every reported statistic, the measurement cannot see the
    property it was designed around and the entire bucket''s framing needs rebuilding, which is the
    most valuable single outcome this entry could produce.'
  independent_variables:
  - permutation family arm in {FIPS, equivariant random, non-equivariant random}
  - round index r
  - translation divisor t
  - matching criterion in {density, branch number, rank profile}
  - nonlinear-layer variant in {shared 5-bit permutation, per-y independent}
  metrics:
    primary:
    - commutation verdict per member per t
    - zero-constant deviation weight per member
    - active-row count per round per member
    - Hamming weight of D_r per round per member
    - quantile of Keccak within each null distribution
    secondary:
    - z-support size per round per member
    - singular-draw rejection rate
    - separation statistic between the two null families
    - sensitivity of quantiles to the matching criterion
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The quantile Q of Keccak's round-6 active-row count within the equivariant null distribution,
      and the zero-constant deviation weight per family.
    formula: 'Q := (number of equivariant null members whose round-6 active-row count is at most Keccak''s)
      / 1000. Predicted: 0.10 <= Q <= 0.90, i.e. Keccak is typical for its shape on this statistic.
      Zero-constant deviation weight is forced to be exactly 0 at every round for every equivariant
      member, because a symmetric start under an equivariant map with no constant injection stays
      symmetric; and is predicted to be nonzero by round 1 for at least 99 percent of non-equivariant
      members. These two forced values are the internal validity of the whole comparison.'
    source: Pre-registered in the parent proposal IDEA-20260816-13b1ca before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Full 1600-bit state, full-width sampled permutations, rounds 1-12. Labelled toy
      because the arms are structural surrogates evaluated under the same linear chi treatment as
      the companion contract rather than executed attacks. Transfer assumption stated explicitly:
      results transfer only to the shape class as constructed in stage 1, and not to any other family,
      not to larger round counts, and not to any attack.'
    correspondence: null
  tail_checks:
  - Every equivariant member must give exactly zero deviation under zero constants at all twelve rounds.
  - Every sampled linear layer must be invertible after rejection filtering.
  - Keccak's own curve, recomputed in this contract, must match the companion contract's committed
    values bit-for-bit.
  - The commutation check must pass for all t | 64 on 100 percent of equivariant members and fail
    for at least 99 percent of non-equivariant ones.
  - Density of each sampled layer must lie within a declared tolerance of theta.rho.pi's.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt if the stage 3 zero-constant validation fails for either family.
  - Fixed sample sizes with no adaptive extension after seeing quantiles.
  - Total wall-clock ceiling 8 hours; a timeout terminates the run and unfinished members are recorded
    as not attempted, never as negative evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run is successful if the commutation and zero-constant validations pass,
    all three arms produce complete twelve-round curves for every sampled member, and Keccak's quantile
    position is reported per round and statistic with the two null families' separation quantified
    -- whatever those positions turn out to be.
  falsification_criterion:
  - Any equivariant member fails commutation with some tau_t.
  - Any equivariant member shows nonzero deviation under zero constants.
  - Fewer than 99 percent of non-equivariant members show nonzero deviation under zero constants.
  - The two null families are indistinguishable on every reported statistic.
  - Keccak's recomputed curve disagrees with the companion contract's committed values.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-13b1ca
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The matching criterion between the sampled linear layer and theta.rho.pi is not settled; three
    are run and a Coordinator must designate the primary before any quantile is treated as authoritative.
  - The nonlinear slot uses a uniformly random 5-bit permutation, which differs from chi in degree
    and DDT; a degree-2 restricted null is arguably the fair one and needs specification.
  - Sample size 1000 gives tail resolution of only 0.1 percent, and a Coordinator must decide whether
    that suffices for the tail claims in the falsification list.
