# dim(V)=ℓ (Stages 0-1). Source: IDEA-20261001-febbe1 under RQ-BINSTD-b6f698 /
# GOAL-ECDLP2M-001.
#
# ZERO RUNS in this design packet. Stages 0-1 authorized for executor
# TASK-20261003-1deeb5. No AUXIN. Amazon Bedrock prohibited. NO break.
# NO attack. NO exponent. Runnable command surface declared below.
# =============================================================================
experiment:
  id: EXP-BINSTD-5b2fd0
  hypothesis_id: H-BINSTD-880e8b
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-febbe1
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Twin-meter Spearman: does smaller dim(V·V) predict fewer remaining
    XOR-SAT variables at fixed dim(V)=ℓ on n=17 toys?
  status: approved
  approved_by: DEC-20261003-672507
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261003-672507 under AGENTS.md standing
    user authorization (2026-09-06). No Magma/Sage/AUXIN/Bedrock. No
    ECC2K-130 solve. No n>=131 attack. Stage 2 (n=19,23 + random-Boolean
    null) not authorized here.
  approval:
    approved_by: DEC-20261003-672507
    composing_decision: DEC-20261003-672507
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 freezes V catalogs, Spearman band 0.70, encoder pin, twin
      probes. Stage 1 runs n=17 ℓ∈{3,4} panels with twin meters and
      bootstrap CI; writes RESULTS.md with exactly one O-* label. No
      Magma/Sage. No AUXIN. No Bedrock. No ECDLP solve.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether Spearman ρ(dim(V·V), N_var) ≥ 0.70 on Stage-1 toy cells
    under twin agreement; deliver exactly one O-* label from H-BINSTD-880e8b.

  class: heuristic_validation
  class_note: >-
    Pre-registered Spearman band on an encoding-size instrument. Not an
    exponent-moving breakthrough; no ECDLP attack table.

  scope:
    included:
      - >-
        Stage 0. Freeze ≥12-shape V catalogs for (n,ℓ)∈{17,19,23}×{3,4};
        freeze preregistered-predictions.json (band 0.70, seeds, encoder
        pin); twin self-check on one probe V per cell.
      - >-
        Stage 1. For (n,ℓ)∈{(17,3),(17,4)} measure twin dimVV and twin
        N_var on every catalog V; compute Spearman ρ ± bootstrap CI;
        write stage1/panels.json, stage1/control-table.json, RESULTS.md
        with exactly one O-* label.
    excluded:
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Stage-2 n=19,23 panels and random-Boolean null under this card.
      - Editing IDEA-20261001-febbe1 claim text or GOAL-ECDLP2M-001.yaml.
      - Editing the 0.70 band after Stage-0 freeze.
      - Treating infra failure as mathematical evidence.

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-5b2fd0/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-5b2fd0/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-5b2fd0/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-5b2fd0/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-5b2fd0/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. implementation/run.py +
      check.py + gf2n.py + product_space.py + encode_s3.py are the
      hash-bound sources. Twin meters are the dual-implementation control.
      {run_dir} is substituted by the process supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20261001-febbe1.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-880e8b.yaml
    spearman_band: 0.70
    catalog_seed: 2026100317
    bootstrap_seed: 2026100318
    bootstrap_reps: 200
    stage1_cells:
      - {n: 17, ell: 3}
      - {n: 17, ell: 4}

  controls:
    - name: twin_dimVV
      definition: >-
        product_space.dim_vv_path_a == dim_vv_path_b on every measured V.
    - name: twin_Nvar
      definition: >-
        encode_s3 N_var path A == path B (independent linear elim) on every
        measured V.
    - name: ctl_fixed_dim_V
      definition: Every catalog entry has exactly ℓ basis elements (dim ℓ).
    - name: ctl_frozen_V_catalog
      definition: Catalog frozen in stage0/v-catalog.json before Stage 1.
    - name: ctl_no_posthoc_band_edit
      definition: Spearman band 0.70 frozen in preregistered-predictions.json.
    - name: ctl_distinct_value_floors
      definition: ≥3 distinct dimVV and ≥2 distinct N_var else O-INCONCLUSIVE.
    - name: null_random_boolean_matched_catalog
      definition: >-
        Stage 2 only (NOT AUTHORIZED). Named so the Stage-1 reading cannot
        silently claim the null.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_spearman_n17]
    - name: cell
      levels: ['(17,3)', '(17,4)']
    - name: V_shape
      levels: [poly, geometric, random]

  metrics:
    primary:
      - name: spearman_dimVV_vs_Nvar
        unit: dimensionless
        definition: Spearman ρ between dim(V·V) and N_var across the catalog.
      - name: twin_agreement
        unit: boolean
        definition: Both twin meters agree on every measured V.
    secondary:
      - name: bootstrap_ci_95
        unit: interval
        definition: Percentile bootstrap CI on ρ (200 reps, frozen seed).
      - name: distinct_dimVV
        unit: integer
      - name: distinct_Nvar
        unit: integer
      - name: wall_clock_seconds
        unit: seconds
      - name: peak_rss_bytes
        unit: bytes
        definition: Peak RSS if available (secondary).

  heuristic_under_test: HEUR-BINSTD-febbe1-H1

  preregistered_prediction:
    quantity: >-
      Spearman ρ(dim(V·V), N_var) ≥ 0.70 on each Stage-1 cell after twin
      agreement and distinct-value floors.
    formula: >-
      N_var = |nonlinear_support \ pivots| after F_2 Gaussian elimination
      of pure-linear equations from Weil-descended S_3; dim(V·V) via twin
      product-space ranks.
    source: >-
      ledger/proposals/IDEA-20261001-febbe1.yaml predictions; frozen before
      Stage 1 in stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Encoding-size instrument on n=17 only under this card. No transfer of
      a Spearman band into an n≥131 attack is claimed.
    correspondence: null

  tail_checks:
    - Twin disagreement voids ρ claims (O-ARTIFACT).
    - Distinct-value floor failure → O-INCONCLUSIVE (not O-SUPPORT).

  seeds_and_replication:
    catalog_seed: 2026100317
    bootstrap_seed: 2026100318
    bootstrap_reps: 200
    independent_instances: 2
    note: >-
      Cells (17,3) and (17,4) are independent instances. Twin meters are the
      replication instrument for each V.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 2.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and v-catalog.json.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-BINSTD-880e8b.
    - maximum_runs = 4.
    - Do not open Stage-2 under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin failure → O-ARTIFACT; do not read ρ as support.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an n≥131 exponent move → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with twin_ok true on probes; Stage 1 produces
    Spearman ρ ± CI for each Stage-1 cell with twin agreement (or a named
    O-ARTIFACT/O-IMPEDIMENT/O-INCONCLUSIVE stop); RESULTS.md names exactly
    one O-* label from H-BINSTD-880e8b with cited artifacts.

  falsification_criterion: >-
    Any of: twin disagreement; post-hoc band edit; a claimed break/exponent
    under this card. (O-FAIL-BAND is a valid scientific negative of
    O-SUPPORT, not a protocol fail.)

  required_artifacts:
    - experiments/EXP-BINSTD-5b2fd0/trial-plan-v1.json
    - experiments/EXP-BINSTD-5b2fd0/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-5b2fd0/stage0/v-catalog.json
    - experiments/EXP-BINSTD-5b2fd0/stage1/
    - experiments/EXP-BINSTD-5b2fd0/RESULTS.md
    - experiments/EXP-BINSTD-5b2fd0/runs/<RUN-BINSTD-*>/
    - experiments/EXP-BINSTD-5b2fd0/implementation/run.py
    - experiments/EXP-BINSTD-5b2fd0/implementation/check.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
