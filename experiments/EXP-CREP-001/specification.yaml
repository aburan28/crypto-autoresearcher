experiment:
  id: EXP-CREP-001
  hypothesis_id: H-CREP-001
  goal_id: GOAL-CRYPTO-001
  version: 1
  title: >-
    Bounded constructive attempt: explicit compact target-independent
    representation for z_R = gcd(g_I, r_R) over eight frozen routes with a
    frozen machine verifier
  status: approved
  frozen: true
  approved_by: coordinator
  approved_at: '2026-07-27'
  source_proposal: IDEA-20260723-001
  claim_tier: toy
  claim_tier_basis: >-
    This is a bounded constructive attempt whose only computation is a
    deterministic verifier over recorded symbolic labelled-deck instances
    (deck sizes B in {2, 3}); no curve arithmetic, no standardized curve, and
    no Monte-Carlo sampling occurs. Declared exponent certificates are static
    documents checked by the verifier, so a PASS is a scale-independent
    typed-construction fact about the exhibited representation, while the
    instance checks are toy-scale semantics only. A NEGATIVE outcome is
    scale-independent in form but scope-bounded: it covers only the eight
    frozen routes and the recorded instance family. Either outcome is capped
    at toy tier; nothing here authorizes medium or cryptographic claims.
  objective: >-
    For each of the eight frozen construction routes, attempt to exhibit an
    explicit target-independent compact representation constructing the exact
    target-label support factor z_R = gcd(g_I, r_R) from the compact
    source-labelled dyadic pair-product generators, as a typed representation
    package (dependency graph, construction maps, declared exponent
    certificate). Machine-verify every package with the frozen verifier
    (predicates V1-V6 below) on the recorded symbolic instances. Decide: at
    least one route produces a verifier-passing representation within budget
    (success), or all routes fail / the best still carries Theta(B^3)
    target-dependent coordinates (falsification of H-CREP-001, scoped to the
    frozen route set). This is design only: implementation and execution are
    deferred to a separate Executor task after approval.

  inputs:
    corpus_snapshot:
      pinned_commit: b8af1551e45fbe4435745239d29f4d141eea3356
      verification_rule: >-
        The audit reads git blob content at the pinned commit (git cat-file),
        never the working tree. At run start the executor materializes
        corpus_manifest.json mapping every path below to its expected git
        blob SHA-1 (from this manifest) and to the SHA-256 of the blob
        content actually read; any missing path or hash mismatch invalidates
        the run (corpus integrity control).
      hash_manifest:
        - {path: ledger/proposals/IDEA-20260723-001.yaml, git_blob_sha1: 8d4e27a2c3eb24d89cd6db4c4e9db518cb04e58c}
        - {path: ledger/evidence/EV-CRYPTO-002.yaml, git_blob_sha1: efb66d5df4703aadd48e370b5f2e7a89709120c8}
        - {path: ledger/decisions/DEC-20260724-002.yaml, git_blob_sha1: b7016be67d9aff59355f35bdefda4173752cb2ec}
        - {path: ledger/decisions/DEC-20260724-003.yaml, git_blob_sha1: 97e281462308b49d396dbe2767033e426e33ec0d}
        - {path: ledger/FINDING-PF-IC-001.md, git_blob_sha1: e80a5605de614da825cd2b0b9f71e4df7cfd22b8}
        - {path: knowledge/INDEX.md, git_blob_sha1: ab1da88b80f870bb8f9d23a54bf64352dab4172e}
        - {path: knowledge/techniques/KN-TECH-005.md, git_blob_sha1: 2d07572a7e56ee0d50465022a887b06d58a68d5a}
        - {path: knowledge/literature/KN-LIT-011.md, git_blob_sha1: 981953514f3fc6e40d6f9ce6468b5d26c9c36772}
        - {path: ideas/reviews/P1552_MECHANISM_FRONTIER_20260718.md, git_blob_sha1: 69cc833aa010cc08e2c5d84b448caa3cbd387c3a}
        - {path: ideas/artifacts/ECDLP-IDEA-012/p1553_query2p1_indexing_gate_r3.md, git_blob_sha1: 372a8d3441bdba9d336cab05d017ce98cb033141}
        - {path: ideas/artifacts/ECDLP-IDEA-012/p1553_target_label_common_factor_gate_r4.md, git_blob_sha1: 939fdeb083347145c9422ee387089723e283af7b}
        - {path: coordination/tasks/TASK-20260718-P1553-ZR-P1/zr_theorem_gate.md, git_blob_sha1: 5298c151354cc1507eb606df37b718b39fe36b69}
        - {path: coordination/tasks/TASK-20260718-P1553-ZR-RT-R1/zr_red_team.md, git_blob_sha1: c9a74480dc88f45b1691ac1d716b130756303695}
        - {path: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-001/tasks/TASK-20260722-101/candidate_report.yaml, git_blob_sha1: 69615720416250cd713c030df9b7414eefc13494}
        - {path: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-001/tasks/TASK-20260722-101/mechanism_note.md, git_blob_sha1: 2dece2c6e8051dd17abd1cff0b288d62957aad17}
        - {path: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-001/tasks/TASK-20260722-103/red_team_report.yaml, git_blob_sha1: ff2eb660109094728863aef53d87b26cb1347ce6}
        - {path: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-002/tasks/TASK-20260723-201/admission_report.yaml, git_blob_sha1: e0b047267d9eea6dcc96c75936205c151e4c272d}
        - {path: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-002/tasks/TASK-20260723-201/constructor_admission.md, git_blob_sha1: 27989596959a0a2b81a6fdd267d4c332432bb564}
        - {path: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-002/tasks/TASK-20260723-203/stage_zero_review.md, git_blob_sha1: e752adb002fecb723b73224c3964a7d8fa0a466d}
    external_references:
      rule: >-
        External sources enter only as the claims recorded about them in the
        pinned corpus records above (retrieval date 2026-07-22 as recorded in
        the pinned candidate report). No live retrieval is performed. Any
        voluntary re-retrieval is informational only, must be pinned by URL,
        version, retrieval date, and content hash in the run manifest, and
        may not change any verdict.
      items:
        - {id: dinur_golovnev_3sum_indexing, url: https://arxiv.org/abs/2512.04258v2, recorded_retrieval_date: '2026-07-22'}
        - {id: kirkpatrick_preprocessed_3sum, url: https://arxiv.org/abs/2602.11363v1, recorded_retrieval_date: '2026-07-22'}
        - {id: borodin_moenck_modular_transforms, url: https://doi.org/10.1016/S0022-0000(74)80029-2, recorded_retrieval_date: '2026-07-22'}
        - {id: moroz_schost_truncated_resultant, url: https://arxiv.org/abs/1609.04259, recorded_retrieval_date: '2026-07-22'}
        - {id: kedlaya_umans_modular_composition, url: https://doi.org/10.1137/08073408X, recorded_retrieval_date: '2026-07-22'}
        - {id: stange_elliptic_nets, url: https://arxiv.org/abs/0710.1316, recorded_retrieval_date: '2026-07-22'}
        - {id: lauter_stange_eds_dlp, url: https://arxiv.org/abs/0803.0728, recorded_retrieval_date: '2026-07-22'}
    frozen_route_set:
      routes:
        - id: ROUTE-01-component-resultants
          description: Componentwise resultant construction over the complete-chart strata.
        - id: ROUTE-02-quotient-ring-resultants
          description: Resultant construction in the quotient-ring direction (r_R mod g_I).
        - id: ROUTE-03-split-norms
          description: Norm-from-extension / split-norm constructor.
        - id: ROUTE-04-multipoint-evaluation
          description: Multipoint evaluation and interpolation from the compact pair-product generators.
        - id: ROUTE-05-modular-composition
          description: Modular-composition constructor (Brent-Kung / Kedlaya-Umans lineage).
        - id: ROUTE-06-power-projection
          description: Power-projection / transposed-evaluation constructor.
        - id: ROUTE-07-subresultant-hgcd
          description: Subresultant / half-gcd chain constructor, including truncated resultants.
        - id: ROUTE-08-displacement-representation
          description: Low-displacement-rank (Sylvester/Cauchy) representation constructor acting on the pair-product generators.
      route_rules: >-
        A route attempt must produce a representation package: a typed
        dependency graph from the compact pair-product generators to z_R, one
        typed construction map per edge (declared input size exponent, output
        size exponent, cost exponent in B), and a declared exponent
        certificate. A route that only restates a BATCH-002 forbidden payload
        (supplied resultant, residue, common factor, source tuple, scalar
        character, target-fitted selector, whole-divisor translation macro,
        represented degree-B^2 target coefficient vector, Theta(B^3)
        translated endpoints) is recorded as failed_duplicate with owner
        EV-CRYPTO-002, not as a passing construction.
    recorded_instances:
      generator: experiments/EXP-CREP-001/instances/generate_instances.py
      format: experiments/EXP-CREP-001/instances/INST-<B>-<STRATUM>.json
      enumeration:
        deck_count: 5
        deck_sizes: [2, 3]
        strata:
          - no_relation_unit          # z_R = 1; no dynamic zero-divisor split may be credited
          - single_hit                # exactly one linear label factor; replay returns exactly one tuple
          - multi_hit
          - collision_duplicate_endpoints
          - exceptional_markers       # tangent/vertical/identity/infinity markers on synthetic labels
          - repeated_source
      instance_count: 12
      content_rule: >-
        Instances are fully public combinatorial labelled-deck objects: five
        signed, coloured decks of B occurrence records each, a target label
        set, the pair-product generator list (size Theta(B^2)), the reference
        support set E (extendible labels, by construction), reference
        z_R = product over labels in E, and the reference replay table. No
        curve arithmetic, no hidden scalar, no real key material. Each
        instance also carries a mutated twin (same decks and preprocessing
        universe, different target label set) for the fresh-target mutation
        control.
    representation_package_schema: experiments/EXP-CREP-001/verifier/package_schema.json
    verifier: experiments/EXP-CREP-001/verifier/check_representation.py
    frozen_verifier_predicates:
      V1_typed_completeness: >-
        Every construction map declares input size exponent, output size
        exponent, and cost exponent in B; the dependency graph from the
        compact pair-product generators to z_R is total (no untyped macro, no
        oracle node, no free lookup).
      V2_target_independence: >-
        No preprocessing object depends on the fresh target except through
        the declared public query interface; on every instance pair (I, I')
        sharing decks, the preprocessing artifacts are byte-identical under
        the target mutation (fresh-target mutation control).
      V3_compactness: >-
        No object carries a forbidden payload (degree-B^2 target coefficient
        vector, Theta(B^3) translated pair endpoints or quotient coordinates,
        supplied resultant/residue/common factor/source tuple/scalar,
        target-fitted selector); declared exponents satisfy: preprocessing
        time, retained advice, and retained state at most 9/4 in B;
        online-materialized target-dependent coordinates at most 5/4 in B.
      V4_exact_support: >-
        On every recorded instance stratum, support(z_R_constructed)
        symmetric-difference support(z_R_reference) is empty, including the
        exceptional-markers and collision strata.
      V5_exact_replay: >-
        On every recorded instance, every root of the constructed z_R replays
        to an exact labelled source tuple with zero errors, including
        negative child queries, and the no-relation-unit stratum returns z_R
        = 1 with no credited split.
      V6_cost_caps: >-
        The declared exponent certificate aggregates: preprocessing
        time/advice/state at most 9/4 in B; fresh-target online time and peak
        workspace at most 5/4 in B including every O(log B) positive and
        negative dyadic replay query per tuple and the final exact source
        verification.
    calibration_fixtures:
      - id: CAL-PASS-CREP-001
        kind: must_pass
        synthetic_fixture: true
        description: >-
          Synthetic restricted-existence index constructor: preprocessing
          computes dyadic-interval OR-bits over the static pair-product
          relation table (declared exponents: preprocessing work 2, retained
          state 1 in B, polylog absorbed); online per target it reads B
          labels times O(log B) dyadic probes (declared online exponent 1);
          replay descends dyadically with O(log B) calls per tuple. Expected
          verdict: PASS on V1-V6 over the recorded instances. This fixture
          passes only because the synthetic instance model makes
          extendibility a static Boolean OR; it proves the verifier can emit
          PASS and exercises every predicate, and it is NOT a curve
          construction and NOT evidence about H-CREP-001.
      - id: CAL-FAIL-CREP-001
        kind: must_fail
        synthetic_fixture: true
        description: >-
          Componentwise reference constructor with declared online exponent 3
          in B (B labels times B^2 coefficient work) and Theta(B^3)
          target-dependent translated coordinates. Expected verdict: FAIL at
          V3 (and V6), proving the verifier can emit FAIL on the known
          blow-up shape.

  controls:
    - id: CTRL-CORPUS-INTEGRITY
      method: >-
        Every audited artifact path is pinned to commit
        b8af1551e45fbe4435745239d29f4d141eea3356 with the embedded hash
        manifest; the run reads git blob content and records SHA-256 per
        file in corpus_manifest.json.
      pass_condition: zero missing paths and zero hash mismatches.
    - id: CTRL-VERIFIER-CALIBRATION
      method: >-
        Run the frozen verifier on CAL-PASS-CREP-001 and CAL-FAIL-CREP-001
        before any route package is checked.
      pass_condition: >-
        CAL-PASS-CREP-001 passes all of V1-V6 and CAL-FAIL-CREP-001 fails at
        least V3; any other outcome invalidates the run (instrument failure,
        not a scientific result).
    - id: CTRL-DEDUP-PRIOR-NEGATIVES
      method: >-
        Every route package is first matched against the BATCH-002 forbidden
        payload list (EV-CRYPTO-002, DEC-20260724-003) and the P1553/P1513
        duplicate-owner list in the pinned candidate report.
      pass_condition: >-
        every match is recorded as failed_duplicate with its named owner; no
        renamed forbidden payload is scored as a novel construction.
    - id: CTRL-REPLAY-DETERMINISM
      method: Apply the verifier twice over every package and instance.
      pass_condition: byte-identical verdict tables on both passes.

  independent_variables:
    - route_id: the eight frozen routes ROUTE-01 through ROUTE-08.
    - instance_id: the twelve recorded symbolic instances (B in {2, 3} crossed with six strata), each with its mutated twin.
    - calibration_fixture_id: the two frozen calibration fixtures.

  metrics:
    primary:
      - route_verdict: PASS or FAIL per route; a route passes only if its package passes all of V1-V6 on all recorded instances.
      - predicate_matrix: boolean route-by-predicate (8 x V1..V6) verdict table with first-failed-predicate per failing route.
      - support_symmetric_difference: per package per instance; must be exactly 0 for any PASS (V4).
      - labelled_source_replay_error_rate: per package per instance; must be exactly 0 for any PASS (V5).
      - target_dependent_materialized_coordinates_exponent_in_B: declared exponent per package; PASS requires at most 9/4 retained and at most 5/4 online (V3/V6).
      - calibration_accuracy: fraction of the 2 calibration fixtures correctly classified; must be exactly 1.0 before route verdicts are read.
    secondary:
      - failed_duplicate_count_with_owners: routes rejected as renamed BATCH-002 payloads, with owner ids.
      - fresh_target_mutation_invariance: boolean per package (V2 evidence).
      - per_stratum_verdicts: V4/V5 results broken down by the six strata.
      - corpus_hash_mismatch_count: must be 0.
      - wall_clock_and_memory_per_stage.

  heuristic_under_test: null
  preregistered_prediction:
    quantity: verifier-passing representation among the eight frozen routes
    formula: >-
      exists r in {ROUTE-01..ROUTE-08} such that V1 and V2 and V3 and V4 and
      V5 and V6 hold on all 12 recorded instances, with declared exponents at
      most 9/4 (preprocessing time/advice/state) and at most 5/4 (online
      time/workspace) in B, support symmetric difference exactly 0, and
      replay error rate exactly 0.
    source: >-
      Construction rectangle of OBL-ZR-COMPACT-CONSTRUCTOR-001 as recorded in
      the pinned TASK-20260722-101 candidate report; closed-sheet context
      EV-CRYPTO-002 and DEC-20260724-003.
  scale_relevance:
    tier: toy
    justification: >-
      Verdicts on declared exponent certificates are static and
      scale-independent in form, but the semantic checks run on B in {2, 3}
      symbolic instances, and a negative result covers only the eight frozen
      routes; both directions are scope-bounded to the frozen design and are
      reported at toy tier.
    correspondence: null
  tail_checks:
    - >-
      Mutation-tail check: for every package, preprocessing artifacts must be
      byte-identical across all 12 mutated instance twins; any divergence is
      recorded and fails V2 regardless of other predicates.
    - >-
      Best-representation tail check: if no route passes, the package with
      the fewest predicate failures is recorded with its exact failure set,
      and the falsification line (still Theta(B^3) target-dependent
      coordinates, i.e. V3 failed) is evaluated on it explicitly.

  replication:
    seeds: []
    seed_policy: >-
      Deterministic construction attempt and deterministic audit; no
      randomness anywhere (instances are fully enumerated, the verifier is
      deterministic).
    independent_instances: 8
    independent_instances_note: >-
      The 8 frozen construction routes are the independent construction
      attempts; the 12 recorded instances are shared check instances, not
      independent samples.
    planned_runs:
      - id: RUN-CREP-001-A
        purpose: >-
          Materialize and verify the corpus hash manifest; generate the 12
          recorded instances and their mutated twins with the frozen
          generator; run the two calibration fixtures through the frozen
          verifier; abort as invalid if calibration is not 2/2.
      - id: RUN-CREP-001-B
        purpose: >-
          Construction attempts and verifier evaluation for ROUTE-01 through
          ROUTE-04, including the dedup control and the mutation control.
      - id: RUN-CREP-001-C
        purpose: >-
          Construction attempts and verifier evaluation for ROUTE-05 through
          ROUTE-08, including the dedup control and the mutation control.
      - id: RUN-CREP-001-D
        purpose: >-
          Determinism replay of every verdict, best-representation tail
          assessment, aggregate predicate matrix, and the success/
          falsification decision table.
    expected_run_count: 4

  budget:
    wall_clock_seconds_per_run: 1800
    total_wall_clock_seconds: 5400
    total_cpu_hours: 1.5
    maximum_memory_gb: 4
    maximum_runs: 4
    stages:
      - id: freeze_calibrate_generate
        wall_clock_seconds: 900
        stop_rule: >-
          Stop and mark the run invalid if the corpus manifest mismatches or
          if either calibration fixture misses its pre-declared verdict.
      - id: routes_1_to_4
        wall_clock_seconds: 1800
        stop_rule: >-
          Stop a route attempt at its package deadline and record it
          failed_budget for that route; a route budget overrun is a failed
          route, not evidence about the hypothesis.
      - id: routes_5_to_8
        wall_clock_seconds: 1800
        stop_rule: same per-route deadline rule as routes_1_to_4.
      - id: aggregate_and_decide
        wall_clock_seconds: 900
        stop_rule: >-
          Stop without issuing a verdict if any required artifact (predicate
          matrix, corpus manifest, calibration receipt) is incomplete.

  stopping_rules:
    - >-
      Stop after the four planned runs; no exploratory fifth run and no
      additional routes beyond the frozen set without a versioned amendment.
    - >-
      A crash, timeout, or implementation failure in the generator, verifier,
      or a route package is recorded as failed_infrastructure /
      failed_implementation and is evidence for nothing (AGENTS.md rule 5).
    - Stop at 5400 total wall-clock seconds, 1.5 CPU-hours, or 4 GB resident memory.
    - >-
      Stop before any elliptic-curve computation, any standardized curve,
      any real key material, or any cryptographic-scale extrapolation; the
      safety scope is non-operational academic mathematics with fully public
      synthetic instances.
  invalidation_rules:
    - Any run missing its manifest, exact command, environment, stdout, stderr, or raw machine-readable verdict tables is invalid.
    - Any corpus hash mismatch or missing corpus path invalidates the run (corpus integrity failure).
    - Calibration accuracy below 2/2 invalidates the run (verifier unsound as instrumented).
    - Non-identical verdict tables across the two determinism passes invalidate the run.
    - A run whose instances differ from the frozen generator enumeration (12 instances, fixed strata) is invalid.
    - >-
      A genuine all-routes-fail outcome is NOT an invalidation; it is the
      falsification outcome of H-CREP-001.
  success_criterion: >-
    At least one of the eight frozen routes produces a representation package
    that passes all frozen verifier predicates V1-V6 on all 12 recorded
    instances within budget: typed complete construction maps (V1),
    target-independent preprocessing proven by the mutation control (V2), no
    forbidden payload and declared exponents within the 9/4 and 5/4 caps
    (V3, V6), exact support on every stratum (V4), and zero-error replay
    (V5). Calibration must be 2/2 and corpus integrity must hold for the
    verdict to count.
  falsification_criterion: >-
    Every route in the frozen set fails at least one verifier predicate
    within budget, or the best exhibited representation (fewest predicate
    failures) still fails V3, i.e. carries Theta(B^3) target-dependent
    coordinates. This is a scoped negative over the frozen route set and
    recorded instance family, not an impossibility theorem.

  required_artifacts:
    - experiments/EXP-CREP-001/specification.yaml
    - experiments/EXP-CREP-001/instances/generate_instances.py
    - experiments/EXP-CREP-001/instances/INST-*.json
    - experiments/EXP-CREP-001/verifier/package_schema.json
    - experiments/EXP-CREP-001/verifier/check_representation.py
    - experiments/EXP-CREP-001/verifier/calibration_receipt.json
    - experiments/EXP-CREP-001/packages/ROUTE-*/package.json
    - experiments/EXP-CREP-001/runs/RUN-CREP-001-A/{manifest.yaml,command.txt,environment.json,raw-result.json,stdout.log,stderr.log}
    - experiments/EXP-CREP-001/runs/RUN-CREP-001-B/{manifest.yaml,command.txt,environment.json,raw-result.json,stdout.log,stderr.log}
    - experiments/EXP-CREP-001/runs/RUN-CREP-001-C/{manifest.yaml,command.txt,environment.json,raw-result.json,stdout.log,stderr.log}
    - experiments/EXP-CREP-001/runs/RUN-CREP-001-D/{manifest.yaml,command.txt,environment.json,raw-result.json,stdout.log,stderr.log}
    - experiments/EXP-CREP-001/corpus_manifest.json
    - experiments/EXP-CREP-001/predicate_matrix.json
    - experiments/EXP-CREP-001/analysis.md
    - experiments/EXP-CREP-001/execution-report.yaml
    - ledger/hypotheses/H-CREP-001.yaml

  assigned_to: executor
  inference_receipt:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: null
    fallback_used: false
    authorization_ref: null
