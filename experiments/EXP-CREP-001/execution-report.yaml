      artifact was affected; the incident prompted making the audit fully
      spec-parsed. Recorded per AGENTS.md rule 8.
    - >-
      jsonschema library absent in the repo interpreter (python3 3.12.8);
      the verifier validates natively against package_schema.json. No
      packages were installed; not an infrastructure failure.
    - >-
      cpu_seconds exceeds wall_seconds on RUN-CREP-001-A because cpu_seconds
      is the process-tree cumulative value from getrusage(RUSAGE_CHILDREN);
      measurement method recorded in each manifest.
    - >-
      Pre-existing ._ AppleDouble files under experiments/EXP-SIG-008/ make
      the worktree dirty (outside write scope, untouched); ._ files that
      appeared inside experiments/EXP-CREP-001/ were deleted as non-data and
      never treated as data.

