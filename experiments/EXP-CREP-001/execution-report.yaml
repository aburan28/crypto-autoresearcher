    verifier_outputs:
      V3_failure_basis: >-
        All eight routes carry forbidden payloads: seven materialize the
        represented degree-B^2 target coefficient vector (declared
        online-materialized target-dependent coordinates exponent 3, cap 5/4);
        ROUTE-02 imports a supplied resultant (oracle node, also fails V1).
      V6_failure_basis: >-
        Every route's declared online workspace exponent is 3 (cap 5/4);
        all preprocessing aggregates stay within the 9/4 cap.
      V4_exact_support: >-
        Support symmetric difference empty on all 12 instances for all 8
        routes (including exceptional-markers, collision, and
        no-relation-unit strata).
      V5_exact_replay: >-
        Zero replay errors on all 12 instances for all 8 routes;
        no-relation-unit stratum returns z_R = 1 with no credited split;
        repeated_source replays exactly two tuples for its support label.
      V2_mutation_invariance: >-
        Preprocessing artifacts byte-identical across all 12 instance/twin
        pairs for every package (12/12 each).
    best_representation_tail_check:
      tied_packages_count: 7
      representative: ROUTE-01-component-resultants
      failure_set: [V3, V6]
      falsification_line: "best exhibited representation still fails V3 (carries Theta(B^3) target-dependent coordinates): true"
    decision_table_mechanical:
      success_formula_satisfied: false
      falsification_formula_satisfied: true
      note: >-
        Mechanical evaluation of the preregistered formulas on frozen-verifier
        outputs only; calibration 2/2 and corpus integrity hold so the
        verdicts count under the contract's own rules. This is a scoped
        observation over the eight frozen routes and the recorded instance
        family, not an impossibility theorem, and not a conclusion that
        H-CREP-001 is supported or refuted; the hypothesis-status decision
        belongs to the Coordinator.

