# =============================================================================
# EXP-SSIQ-354ffb — version 1, approved by DEC-20261006-84ccca. Frozen
# census of least separable degrees for IDEA-20261006-2abea4. Success
# is the idea's prediction: every supersingular δ at p = 101 is at
# most 3, and at least one δ is at least 2. The concrete negative is
# that some supersingular j has least found degree at least 4 inside
# the cap 8. This design session did not build the supersingular
# polynomial and did not compute a degree. No discrete logarithm is
# authorized. Source idea bytes are copied unchanged from
# origin/design/hyper-79cb0a-prym, blob
# 5bd9739da7c93ae940ef8b62fc279c6da374a9ef.
# =============================================================================
experiment:
  id: EXP-SSIQ-354ffb
  hypothesis_id: H-SSIQ-fe24c0
  question_id: RQ-SSIQ-9702af
  source_idea: IDEA-20261006-2abea4
  version: 1
  title: >-
    Least separable degree from E to E^{(p)} on the supersingular
    set in characteristic 101, against the integer ceiling 3
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261006-84ccca
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null.
      Approval does not assert that every degree is at most 3, does
      not assert that the conditional exponent moves, and does not
      assert that the recalled degree bound was verified.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Work only at p = 101. Represent F_{p^2} as F_101[a]/(a^2 - 2).
      Confirm that a^2 - 2 has no root in F_101. Build the
      supersingular polynomial and list every root. For each root,
      test j^p = j, then enumerate cyclic kernels of degrees 2
      through 8, compute the codomain j, and compare it with j^p.
      Record δ as the least hit, or 9 if none. Repeat the
      lexicographically first supersingular j with the degree loop
      and the root order reversed. Select one ordinary j by the
      frozen rule and score it separately. Do not test smoothness
      and do not search for a discrete logarithm.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether every supersingular j at p = 101 has δ at most 3
    and at least one has δ at least 2. The concrete negative is that
    some supersingular j has least found degree at least 4 inside
    the cap 8. An all-degree-1 set is a separate negative. No faster
    isogeny algorithm is in scope.

  inputs:
    prime: 101
    field: >-
      F_{101^2} = F_101[a]/(a^2 - 2). Write each field element as
      c0 + c1*a with c0 and c1 integers from 0 through 100. If
      a^2 - 2 has a root in F_101, the run is instrument_failure.
      Do not replace the polynomial after seeing any degree.
    supersingular_set: >-
      The roots, in this field, of the supersingular polynomial in
      characteristic 101. The cardinality is reported. It is not a
      success gate.
    degree_1_test: >-
      δ(j) = 1 if and only if j^p = j. In this basis that is
      c1 = 0. A root with c1 = 0 and j^p unequal to j is
      instrument_failure.
    kernel_search: >-
      For each d from 2 through 8, enumerate cyclic subgroups of
      order d, compute the codomain j-invariant of the separable
      isogeny with that kernel, and test equality with j^p. The
      least such d is δ(j). If j^p = j, δ(j) = 1 and the kernel
      search is not required for that j. If no hit occurs through
      degree 8, record δ(j) = 9. Do not count an inseparable map.
      Do not treat the size of a non-cyclic kernel as the degree.
    lex_order: >-
      The lexicographically first supersingular j is the root
      c0 + c1*a whose pair (c0, c1) is least in dictionary order.
    repeat_enumeration: >-
      On that first j only, repeat the kernel search with degrees
      running from 8 down to 2 and with the roots of each division
      polynomial taken in reverse order. The two recorded values
      of δ must agree. Disagreement is instrument_failure and voids
      the census.
    ordinary_control: >-
      The ordinary control is the least pair (c0, c1) with c1 at
      least 1 whose j is not a supersingular root. Score δ of that
      j by the same procedure and exclude it from the maximum and
      from the count of δ at least 2. The ceiling 3 is not claimed
      for it. A small δ on it does not support the supersingular
      bound. If every non-subfield j is supersingular, the control
      is missing and the run is instrument_failure.

  controls:
    - id: repeat-first-j
      statement: >-
        The two enumerations of the lexicographically first
        supersingular j return the same δ. Disagreement voids the
        census and is not a degree.
    - id: ordinary-excluded
      statement: >-
        The ordinary control's δ is reported and is not an entry of
        the supersingular multiset. Including it in the maximum
        voids the run.
    - id: degree-1-field-membership
      statement: >-
        j^p = j if and only if the representative has c1 = 0.
        A disagreement between the Frobenius test and the basis
        coefficient voids the run.

  independent_variables:
    - the supersingular root j
    - the degree d in 1 through 8, or the miss code 9
    - whether the enumeration is the forward pass or the reverse pass on the first j
    - whether the j is the ordinary control

  metrics:
    primary:
      - id: max_delta
        statement: >-
          The maximum of δ(j) over supersingular j. The idea's
          prediction is an integer at most 3. A maximum at least 4
          is the concrete negative.
      - id: count_delta_at_least_2
        statement: >-
          The number of supersingular j with δ(j) at least 2. The
          idea's prediction is at least 1. A count of 0 is the
          negative for the witness clause.
    secondary:
      - id: cardinality
        statement: the number of supersingular roots
      - id: multiset
        statement: the multiset of δ(j) on the supersingular set
      - id: repeat_agreement
        statement: whether the two enumerations of the first j agree
      - id: ordinary_delta
        statement: >-
          δ of the ordinary control, reported separately and not
          used in max_delta

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 says the least separable degree on this finite set is the
    least d in 1..8 with a cyclic kernel whose codomain j equals
    j^p, or else the degree exceeds 8. The row ceiling_exceeded is
    the negative for the ceiling on this prime. It is not a
    refutation of the degree bound at any other prime. Do not
    relabel an instrument failure as that negative.

  preregistered_prediction:
    quantity: >-
      The pair (maximum δ over supersingular j, count of
      supersingular j with δ at least 2) at p = 101, with δ the
      least separable degree of an isogeny from E to E^{(p)}.
    formula: >-
      The maximum is an integer at most 3, and the count is at least
      1. The concrete negative is that some supersingular j has
      least found degree at least 4 inside the cap 8, including the
      miss code 9. A count of 0 is the separate negative in which
      every δ equals 1. Source idea IDEA-20261006-2abea4. No
      supersingular root was listed before this formula was frozen.
    source: >-
      IDEA-20261006-2abea4, whose ceiling sentence is the integer
      form of factor F1 in RQ-SSIQ-9702af. The Aubry-Oyono-Vincent
      bound is recalled and was not opened. KR-RHO-755e35,
      KR-RHO-13bf67, KR-IC-5ea2f8, and KR-IC-f5c584 were opened in
      this session and do not predict this histogram.

  scale_relevance:
    tier: toy
    justification: >-
      The only prime is p = 101. No transfer to a cryptographic
      prime is assumed. The set is the full supersingular locus, not
      a sample, so there is no tail probability that must be
      resolved by extra draws. The minimum effect is the idea's own:
      maximum at most 3 and count at least 1.
    correspondence: >-
      Direct enumeration of supersingular roots and direct
      comparison of codomain j-invariants with j^p. No Deuring
      correspondence is used to skip a degree.

  tail_checks:
    - >-
      Any j with no hit through degree 8 is kept as δ = 9 and counts
      toward a maximum at least 4. It is not dropped.
    - >-
      The ordinary control's δ is recorded and is not folded into
      the supersingular maximum.

  replication:
    seeds:
      - EXP-SSIQ-354ffb|forward
      - EXP-SSIQ-354ffb|reverse-first-j
    independent_instances: 1
    note: >-
      The census is deterministic. One is the number of primes
      scored. The two seeds name the forward pass and the reverse
      pass on the first j. There is no shuffle sample.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One run manifest covers the supersingular list, every δ, the
      reverse pass, and the ordinary control. Wall-clock and CPU
      figures are advisory and null. The 4 GB memory figure is
      machine protection for the division polynomials through
      degree 8. A watchdog expiry is failed_infrastructure, not a
      degree and not a miss.

  stopping_rules:
    - Stop after every supersingular root has a recorded δ, the reverse pass on the first j has been compared, and the ordinary control has been scored or marked missing.
    - Do not drop a root whose search reached degree 8 without a hit.
    - Do not lower the cap from 8 or raise the ceiling from 3 after seeing a degree.
    - A timeout voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - The two enumerations of the first j disagreeing voids the run.
    - Including the ordinary control in the supersingular maximum voids the run.
    - A missing ordinary control voids the run.
    - a^2 - 2 having a root in F_101 voids the run.
    - j^p = j disagreeing with c1 = 0 voids the run.
    - Counting an inseparable map, or equating a non-cyclic kernel's size with the degree, voids the run.
    - Dropping a root with δ recorded as 9 voids the run.

  success_criterion: >-
    The instrument checks pass, every supersingular δ is an integer
    at most 3, and at least one supersingular δ is at least 2. This
    is the prediction of IDEA-20261006-2abea4. It is reachable as a
    failure when some supersingular j has least found degree at
    least 4 inside the cap 8.

  falsification_criterion: >-
    The instrument checks pass and some supersingular j has least
    found degree at least 4 inside the cap 8, including a recorded
    9. That is the concrete negative named with the source idea.
    Every supersingular δ equaling 1 is a separate failure of the
    witness clause. Disagreement of the two enumerations, a missing
    ordinary control, and a timeout are not this negative.

  required_artifacts:
    - experiments/EXP-SSIQ-354ffb/runs/RUN-*/manifest.yaml
    - experiments/EXP-SSIQ-354ffb/runs/RUN-*/stdout.txt
    - experiments/EXP-SSIQ-354ffb/runs/RUN-*/stderr.txt
    - experiments/EXP-SSIQ-354ffb/runs/RUN-*/degrees.csv
    - experiments/EXP-SSIQ-354ffb/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: instrument_failure
      when: >-
        a^2 - 2 is reducible over F_101, the two enumerations of the
        first supersingular j disagree, the ordinary control is
        missing or is included in the maximum, j^p = j disagrees
        with c1 = 0, an inseparable map is counted, a non-cyclic
        kernel size is used as the degree, or a root with no hit
        through degree 8 is dropped
    - id: ceiling_exceeded
      when: >-
        the instrument checks pass and some supersingular j has δ
        at least 4, including a recorded 9
    - id: all_degree_one
      when: >-
        the instrument checks pass, every supersingular δ equals 1,
        and therefore the count of δ at least 2 is 0
    - id: census_meets_prediction
      when: >-
        the instrument checks pass, every supersingular δ is at most
        3, and at least one supersingular δ is at least 2
  reading_rule: >-
    Name exactly one row, the first whose condition holds in the
    order listed. census_meets_prediction is the only success row.
    ceiling_exceeded is the concrete negative. all_degree_one
    falsifies the witness clause and is not a ceiling miss.
    instrument_failure is not a degree. Record the cardinality, the
    multiset, the maximum, the count of δ at least 2, the ordinary
    control's δ, whether the two enumerations agree, and
    attack_claimed false beside the row. Those fields do not change
    the row.
