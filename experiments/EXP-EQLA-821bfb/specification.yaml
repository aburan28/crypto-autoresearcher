experiment:
  id: EXP-EQLA-821bfb
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-d20846
  question_id: RQ-EQLA-0d3f40
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'FOLD BEFORE YOU PEEL: structured Gaussian elimination lives on the light column tail, and
    closing a relation matrix under phi triples the row count without adding rank - which multiplies
    every column weight by g and, under a Poisson weight law at arity 3, cuts the number of peelable
    weight-1 columns by about two orders of magnitude, so the lane''s own construction actively destroys
    the one linear-algebra saving that real index-calculus implementations rely on'
  status: draft
  objective: "(A) THE STAGE NOBODY IN THIS LANE HAS MEASURED. Production index calculus does not run\
    \ Wiedemann on the raw relation matrix. It runs STRUCTURED GAUSSIAN ELIMINATION first - filtering,\
    \ merging, weight-1 and weight-2 column peeling - and only then hands a much smaller, denser core\
    \ to an iterative solver. The peeling stage is driven entirely by the LIGHT COLUMN TAIL: a column\
    \ of weight 1 gives a free pivot with no fill-in, and a column of weight 2 gives an exact elimination\
    \ whose fill-in is bounded by the symmetric difference of two rows. This program already owns\
    \ an implementation of exactly that two-phase peel plus dense core (src/h012_peel_rank.py::peel_and_rank,\
    \ with its weight histogram, pivot counts, fill-in accounting and core dimensions), written for\
    \ GF(2) Macaulay matrices. Not one record in the STR/EQLA lane has ever measured a peeling statistic\
    \ on a relation matrix.\n(B) THE ARITHMETIC OF THE HARM, AND IT IS THE RECORD'S CENTRAL CLAIM.\
    \ Take a phi-stable factor base of size B, harvest R base relations of weight m, and close under\
    \ sigma to get 3R rows (g = 3). Compare three objects:\n  OBJ-1 THE CLOSED, UNFOLDED MATRIX: B\
    \ columns, gR rows, total nonzeros\n    g R m, so the mean column weight is g R m / B.\n  OBJ-2\
    \ THE FOLDED MATRIX: B/g columns, R rows (the g R closed rows fold to\n    R rows up to scalars,\
    \ IDEA-20260807-0e4d83), total nonzeros about R m,\n    so the mean column weight is R m / (B/g)\
    \ = g R m / B.\n  OBJ-3 THE SIZE-MATCHED GENERIC MATRIX: B columns, B rows of weight m at\n  \
    \  the same relations-per-unknown ratio, mean column weight m R' / B.\nAt the natural operating\
    \ point R = B/g for OBJ-2 and R' = B for OBJ-3, the mean column weights are: OBJ-1 has mean m\
    \ (g rows per base relation, but only B/g base relations needed... measured, not assumed - see\
    \ below), OBJ-2 has mean m, OBJ-3 has mean m. THE MEANS AGREE, AND THAT IS THE FIRST NON-OBVIOUS\
    \ FINDING: folding does not thin the light tail, because it shrinks rows and columns by the same\
    \ factor g. THE HARM APPEARS WHEN THE MATRIX IS NOT FOLDED. If one harvests enough BASE relations\
    \ to make the CLOSED matrix square - which is what a pipeline that does not know the rows are\
    \ redundant will do, and which is what harness/endomorphism_la.py's collection loop produces -\
    \ then R = B and OBJ-1 has gB rows on B columns with mean column weight g m. Under a Poisson weight\
    \ law the expected fraction of weight-1 columns falls from mu e^{-mu} at mu = m to g mu e^{-g\
    \ mu} at mu = g m. At m = 3 and g = 3 that is 3 e^{-3} = 0.149 against 9 e^{-9} = 0.00111: A FACTOR\
    \ OF ABOUT 134 FEWER PEELABLE COLUMNS. The weight-2 tail is suppressed comparably. So closing\
    \ the matrix under phi before peeling does not merely waste rank - it removes the structure that\
    \ structured Gaussian elimination exists to exploit.\n(C) THE CONSEQUENCE FOR EVERY COST NUMBER\
    \ THE LANE HAS PRODUCED. All of them - EV-STR-002's cost_ratio, H-STR-002's alpha^2 B log B against\
    \ 2 B^2, the four measured phi_alpha values - are computed on OBJ-1, the closed unfolded matrix.\
    \ If a real pipeline would peel first, then OBJ-1's true cost is not 2 B^2 but (post-peel core\
    \ dimension)^2-ish, and OBJ-1 is exactly the object whose post-peel core is LARGEST. Comparing\
    \ a structured-solve model on OBJ-1 against a Wiedemann model on OBJ-1 compares two ways of solving\
    \ the worst-conditioned object the lane can construct. The correct comparison is fold-then-peel-then-solve\
    \ against generic-peel-then-solve, and it has never been made.\n(D) THE SECOND, SUBTLER EFFECT,\
    \ WHICH COULD CUT EITHER WAY. Folding can ANNIHILATE a column: a relation meeting an orbit in\
    \ all g positions with equal coefficients contributes 1 + lambda + ... + lambda^{g-1} = 0 there\
    \ (IDEA-20260807-61049d, IDEA-20260807-d6956c section C). So the folded row is LIGHTER than the\
    \ base row by one for each fully-hit orbit, at a rate about C(m, g) (g/B)^{g-1}. Lighter rows\
    \ mean lighter columns mean MORE peelable columns - a small benefit, concentrated at small B,\
    \ and therefore exactly the regime the lane's toy measurements occupy. Whether the annihilation\
    \ benefit or the closure harm dominates at the measured B values is an empirical question with\
    \ a two-sided answer, and it is one candidate explanation for EV-STR-003 O-9's unexplained rank\
    \ deficiencies of 4, 6, 30 and 67.\n(E) THE THREE OUTCOMES.\n  OUTCOME 1 (predicted) - OBJ-2 and\
    \ OBJ-3 have statistically identical\n    peeling profiles after scaling by g, and OBJ-1's profile\
    \ is far worse.\n    Then the lane's linear-algebra recommendation is settled: fold first,\n \
    \   never peel the closed matrix, and the resulting saving is exactly the\n    g^2 = 9 of IDEA-20260807-9ecc6f\
    \ with no interaction term. A clean,\n    useful, negative-flavoured engineering result.\n  OUTCOME\
    \ 2 - OBJ-2's profile is materially BETTER than OBJ-3's after\n    scaling. Then the phi structure\
    \ interacts constructively with structured\n    Gaussian elimination and the lane has found something\
    \ beyond the block\n    split. The candidate mechanism is (D)'s annihilation, and its scaling\
    \ in\n    B is measurable, so the finding would come with its own extrapolation\n    warning built\
    \ in.\n  OUTCOME 3 - OBJ-2's profile is materially WORSE than OBJ-3's. Then folding\n    costs\
    \ something at the peeling stage and part of the g^2 is given back;\n    the amount is measured\
    \ and the lane's ceiling drops accordingly."
  resource_label: R1 + R3. R3 supplies the fold (powers of lambda) and the orbit partition; R1 is
    what makes the orbit computable by field multiplication. The peeling itself consumes no resource
    - it is ordinary sparse linear algebra - and the record's content is how the resource-derived
    structure interacts with it.
  admissibility: admissible
  admissibility_argument: 'Admissible on the lane''s standard narrow ground: the measured objects
    are matrices of field data and the fold is a field operation. The ceiling is stated with it -
    the informational content of the phi structure is generic-group simulable (KN-FIND-b7e091), so
    no exponent can arise here and none is claimed. What this record contributes is not a new resource
    but the observation that the lane has been consuming its resource in the WORST available order
    (close, then measure) and that the correct order (fold, then peel, then solve) changes the numbers
    by more than the structure itself is worth.'
  reachability_gate: 'T5''s isogeny-walk form does not apply: one curve, no movement. T4 binds as
    everywhere in L5: the orbit structure requires D_0 = -3 or -4, which is class-determined and unreachable
    from a generic curve at any cost, so OBJ-1 and OBJ-2 do not exist for a generic prime-field curve
    and only OBJ-3 does. Within the CM families the objects are free: folding costs nnz field multiplications
    and peeling costs what it costs regardless of the curve. SCOPE NOTE, not an attack claim: secp256k1
    has a = 0 and lies in the D_0 = -3 family.'
  inputs:
    procedure: 'STAGE 0 (hours, HARD GATE): adapt peel_and_rank to F_N and reproduce its committed
      GF(2) validation gates exactly (28096 and 143882). No F_N number is reported before this passes.
      STAGE 1 (minutes, HARD GATE): the planted weight-1/weight-2 positive control - declared counts
      must be found exactly. STAGE 2 (minutes): build OBJ-1..OBJ-4 on one instance; emit all four
      histograms; check the three propagation rules of STEP 4 exactly. This alone establishes or refutes
      the (B) arithmetic and costs almost nothing. STAGE 3 (minutes): run the peel on all four objects;
      report pivots, fill-in, core dimensions and exact ranks. STAGE 4 (an hour): the three pipelines
      end to end, same units, memory beside time. STAGE 5 (an hour): the c-sweep decay test and NULL
      2. STAGE 6 (an hour): the annihilation-rate scaling across three B values. THE CHEAPEST DECISIVE
      SUBSET is STAGES 0-2: the histograms alone settle whether closure suppresses the light tail
      by the predicted amount, and that is the record''s central claim.'
    mechanism: "STEP 1. Adapt src/h012_peel_rank.py::peel_and_rank from GF(2) to F_N: the weight-1\
      \ phase is unchanged (a weight-1 column is a free pivot in any field); the weight-2 phase becomes\
      \ t := t - c p for the appropriate scalar c rather than t := t XOR p, and the fill-in bookkeeping\
      \ is identical because it depends on supports. Validate the adaptation against the existing\
      \ GF(2) validation gates recorded in that file's header (n = 12 sem D5 ti0 -> 28096; n = 18\
      \ sem D5 ti0 -> 143882) by running it over GF(2) and reproducing them exactly. A rank engine\
      \ that does not reproduce its own committed gates is not usable and the line halts there.\n\
      STEP 2. Build the three objects on the same instance and the same harvest: OBJ-1 (closed, unfolded),\
      \ OBJ-2 (folded), OBJ-3 (size-matched generic), plus OBJ-4 (the quotient-size generic control\
      \ of IDEA-20260807-d6956c ARM QUOT, which has B/g columns and no structure). OBJ-2 versus OBJ-4\
      \ is the sharpest comparison in the record: same dimensions, same unknown count, one has the\
      \ phi structure and one does not.\nSTEP 3. Emit, for each object: the full column weight histogram;\
      \ the weight-1 and weight-2 counts; peeling pivots from each phase; fill-in; maximum row weight\
      \ reached; residual core dimensions and core rank; total exact rank; and the time in each phase.\
      \ These are exactly the fields peel_and_rank already returns.\nSTEP 4. Check the three predicted\
      \ propagation rules directly: closure multiplies column weights by g (exactly, on OBJ-1 against\
      \ its base sub-matrix); folding sums weights within orbits (exactly, minus annihilations); and\
      \ the first peeling round's pivot count is predicted by n_1 (exactly). Each is a known-answer\
      \ test of the implementation and costs nothing.\nSTEP 5. Measure the end-to-end cost of the\
      \ two candidate pipelines on the same instance, in the same units, with memory beside time:\n\
      \  PIPELINE A (what the lane has effectively been modelling): close, then\n    solve OBJ-1.\n\
      \  PIPELINE B (what this record recommends): fold, then peel, then solve the\n    core of OBJ-2.\n\
      \  PIPELINE C (the generic baseline): peel, then solve the core of OBJ-3.\nReport B/C - the\
      \ honest saving - and A/B, which is the size of the mistake.\nSTEP 6. The annihilation limb\
      \ of (D): measure the rate of fully-hit orbits and the resulting folded-row lightening, and\
      \ check whether the peeling profile of OBJ-2 improves relative to OBJ-4 by an amount consistent\
      \ with it. Report the rate's scaling in B, since the effect is predicted to be a small-B phenomenon\
      \ and therefore not extrapolable.\nSTEP 7. The null and the decay sweep (see null_object_control)."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - NULL 1 - OBJ-4, quotient-size generic matrix, dimension- and weight-matched to OBJ-2 with no orbit
    structure
  - NULL 2 - matched random matrix with identical shape, density and column-orbit partition, closed
    under a zero-endomorphism permutation
  - planted weight-1/weight-2 counts, recovered exactly
  - src/h012_peel_rank.py's committed GF(2) validation gates, reproduced exactly by the adapted engine
  - c-sweep over orbit closure fraction as the decay test
  - matched Pollard rho with negation and BSGS in group operations for the Pareto row, even though
    nothing is attacked
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. NULL 1 - OBJ-4, the quotient-size generic
    control: B/g columns, B/g rows of weight m, no orbit structure, same field. It is dimension-matched
    and weight-matched to OBJ-2 and differs only in provenance. PREDICTED: identical peeling profile
    within seed noise. If so, the phi structure contributes nothing to peeling and OUTCOME 1 fires.
    NULL 2 - MATCHED RANDOM MATRIX with identical shape, density and column-orbit partition, closed
    under a positional permutation with zero endomorphism content (the generator of IDEA-20260807-1e673d).
    Its peeling profile must match OBJ-1''s, establishing that the light-tail suppression is a consequence
    of closure per se and not of the endomorphism - which is the honest attribution and is what makes
    the (B) arithmetic a general statement rather than a curve fact. DECAY PARAMETER: the orbit closure
    fraction c. The mean column weight must rise linearly from m at c = 0 to g m at c = 1, and the
    weight-1 column count must fall along the Poisson prediction over that range. A light-tail count
    that does not fall as c rises means the closure is not doing what (B) says and every number is
    void. PLANTED POSITIVE: a synthetic matrix with a DECLARED number of weight-1 and weight-2 columns.
    The peeler must find exactly that many phase-1 and phase-2 pivots. src/h012_peel_rank.py''s own
    committed validation gates serve the same role for the rank output and must be reproduced exactly
    over GF(2) before any F_N number is reported.'
  independent_variables: []
  metrics:
    primary:
    - full column weight histogram for OBJ-1..OBJ-4, per cell, per seed
    - n_1 and n_2 measured, beside their Poisson predictions and the chi-squared deviation
    - phase-1 and phase-2 pivot counts, fill-in, maximum row weight
    - core rows, core columns, core rank, total exact rank
    secondary:
    - the three propagation-rule checks, exactly
    - PIPELINE A, B, C costs in field operations, wall time and peak memory
    - fully-hit-orbit rate at three B values, with its fitted scaling
    - c-sweep curves for mean column weight and n_1
    - GF(2) gate reproduction results
  heuristic_under_test: null
  preregistered_prediction:
    quantity: mean column weight, OBJ-1 divided by its base sub-matrix
    formula: 'EXACTLY g (= 3), with no tolerance: closure under sigma replicates every nonzero g times.
      A measured ratio below g localises dedup suppression (harness/endomorphism_la.py lines 303-304)
      and is an instrument finding.'
    source: pre-registered in IDEA-20260807-d20846 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - DEDUPLICATION. The committed harness suppresses duplicate rows, which breaks the exact "closure
    multiplies weights by g" rule and does so unevenly across instances (EV-STR-003 O-4 recorded dedup_suppressed_count
    0 at some cells with nonzero misalignment at the same cells). Dedup must be off or logged per
    row.
  - TOY-SCALE PEELING IS NOT PRODUCTION FILTERING. Real filtering also merges heavy columns, prunes
    singleton rows and optimises a weight function over many passes. The two-phase peel measured here
    is a lower bound on what filtering achieves, so all three pipelines are understated - but understated
    in the same direction, which is why ratios are reported rather than absolutes.
  - THE CORE SOLVE IS NOT MODELLED. peel_and_rank hands its core to a dense echelon; a production
    pipeline would hand it to Wiedemann. The pipeline comparison of STEP 5 must charge the same core
    solver on all three arms or it is comparing solvers rather than objects.
  - SMALL B. At B = 27 with g = 3 there are 9 folded columns and the histogram has essentially no
    resolution; peeling on a 9-column matrix is not informative. B must span at least an order of
    magnitude and small-B cells labelled low-resolution.
  - SIGNS AND RIGHT-HAND SIDES. Peeling an unsigned incidence matrix computes a rank with no linear-system
    meaning. IDEA-20260807-add964 must be settled first or this record measures the wrong object.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'EXACTLY g (= 3), with no tolerance: closure under sigma replicates every nonzero
    g times. A measured ratio below g localises dedup suppression (harness/endomorphism_la.py lines
    303-304) and is an instrument finding.'
  falsification_criterion:
  - The adapted peeler does not reproduce the committed GF(2) gates. The engine is wrong; halt and
    report as infrastructure under AGENTS.md rule 5, never as mathematical evidence.
  - The planted weight-1/weight-2 counts are not recovered exactly. The instrument cannot count what
    it claims to count; every profile is void.
  - OBJ-1's mean column weight is not exactly g times its base sub-matrix's. Closure is not replicating
    nonzeros as claimed - most likely dedup - and the (B) arithmetic does not apply to the object
    actually built.
  - The weight-1 suppression is below a factor 20. The Poisson prediction is badly wrong at these
    B, HEUR-L5-17's negative correlation dominates, and the harm claimed in (B) is overstated; the
    record's headline is withdrawn and the measured factor is reported instead.
  - OBJ-2 and OBJ-4 differ materially. The phi structure interacts with peeling beyond dimension reduction;
    OUTCOME 2 or 3; requires replication before interpretation, and if OBJ-2 is BETTER it is the only
    constructive result available in this lane's linear-algebra stage.
  - PIPELINE B is not cheaper than PIPELINE A. Folding before peeling does not help, which would contradict
    both the rank argument (IDEA-20260807-0e4d83) and the weight argument, and would require reconciling
    before anything is reported.
