  # =====================================================================
  # 11. WHAT THIS ESTABLISHES AND WHAT IT LEAVES UNTESTED
  # =====================================================================
  what_this_establishes_and_what_it_leaves_untested:
    relation_to_HEUR_DS_1: >-
      NO TRANSFER IN EITHER DIRECTION, AND NOTHING IN THIS BATCH MAY BLUR IT. Equidistribution
      of the fibre invariants is a LOAD-BEARING INPUT to HEUR-DS-1 AND IS NOT IDENTICAL TO IT.
      HEUR-DS-1 is a statement about the B-SMOOTHNESS of the intermediates against the Dickman
      law. THIS EXPERIMENT MEASURES NO SMOOTHNESS, FACTORS NO INTEGER AND COMPUTES NO LARGEST
      PRIME FACTOR, and no such primitive may exist in the driver. It is one further step
      removed than EXP-EQD-001 was - it characterizes the INSTRUMENT that measured a load-bearing
      input, not the input and not the heuristic. OPEN-BATCH023-A, the owed direct smoothness
      measurement, is NOT DISCHARGED BY ANY OUTCOME OF THIS EXPERIMENT and no deliverable may
      state or imply otherwise.
    relation_to_EV_EQD_001: >-
      EV-EQD-001 IS IMMUTABLE AND IS NEVER EDITED. Its reading is amended, in whichever direction
      the frozen rule selects, by the SUPERSEDING record EV-EQD-002 filed at the ledger close.
      Supersession here is one-directional by construction - EV-EQD-001 carries no forward
      pointer, because adding one would edit it - and that discoverability gap is filed as the
      new open item OPEN-BATCH024-A rather than papered over.
    what_a_D_2_outcome_would_NOT_establish: >-
      That the deterministic factor base is generic, equidistributed or random-like; that the
      joint law is bounded against classes U1 to U6; that HEUR-DS-1 holds; anything at any field
      size above 20 bits, any Bfb other than 512, any arity other than 4 or any intermediate
      other than INT-2; any cost, exponent or affected-scheme consequence; and it is NOT a
      replication of EV-EQD-001 because the curve instances are deliberately the same.
    what_a_D_3_outcome_would_NOT_establish: >-
      That the deterministic factor base IS structured - it is not tested here; that H-EQD-001 is
      false; that EV-EQD-001 was wrongly executed, which it was not; or that BATCH-023 was
      worthless, which would be premature closure. D-3 says the EV-EQD-001 test had little power
      against these dependence families and therefore that its non-rejection carries little
      information about the joint law. That is a statement about an instrument.
    the_confound_this_experiment_does_not_touch: >-
      RT049-B6, THE DETERMINISM VERSUS SMALL-x WINDOW CONFOUND, IS CARRIED FORWARD UNADDRESSED.
      Its discriminating arm is RT049-CTRL-2, the windowed null, which is not run here. The L1
      cancellation argument does NOT reach this confound.
  decision_variable_variation_check:
    statement: >-
      EVERY DECISION VARIABLE IS CHECKED TO VARY WITH WHAT IT MEASURES, AND THE CHECK IS STATED
      HERE FOR THE REVIEWER TO ATTACK - the BATCH-021 lesson, where a proxy was a closed form
      with an object-free expectation.
    per_variable:
      DDV_1_to_DDV_3: >-
        Detection rate is a measured proportion over 200 independent replicates against a fixed
        external threshold; it is not a closed form and has no object-free expectation. It
        provably varies with the plant parameter IF the plant moves the joint table, which is
        the separate check DIAG-DEP-RHO performs and which DESIGN-TRAP-1 explains is not
        automatic.
      DDV_4_and_DDV_5: >-
        Both are order-statistic style floors over the ladders and take the declared literal
        NONE_ON_LADDER when no rung qualifies, so both are total functions of the measurement
        and neither can be undefined.
    the_new_and_most_important_clause: >-
      THE POWER CERTIFICATE MUST BE AGAINST THE RIGHT ALTERNATIVE CLASS. It is not enough for a
      decision variable to vary; it must vary with the class of deviation the claim is about.
      ALT-CLASS-DEP-1 states, for this experiment, exactly which classes each statistic will
      have measured power against and exactly which remain uncertified, and TASK-20260801-040
      carries a named duty to check it against the driver source. THIS IS THE DEFECT BATCH-024
      EXISTS TO REPAIR AND REPEATING IT HERE WOULD BE INEXCUSABLE.

