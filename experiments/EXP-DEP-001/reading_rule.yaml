  # -------------------------------------------------------------------
  # 14. DRIVER SHAPE CONFORMANCE - WHAT SHAPE THIS FILE INTENDS
  # -------------------------------------------------------------------
  driver_shape_conformance:
    why_this_block_exists: >-
      BATCH-023 nearly lost a run to a quoted-versus-integer key mismatch in a reading rule, which
      would have raised an uncaught KeyError and written no run package at all. The intended shape
      is therefore stated explicitly so that a mechanical load-and-index check can confirm it
      before the snapshot.
    loader: 'experiments/EXP-DEP-001/implementation/dep001_driver.py, load_reading_rule()'
    loader_requirement: >-
      yaml.safe_load of this file must return a dict whose "reading_rule" key maps to a dict.
      Anything else raises ValueError. This file satisfies it - the top level is a mapping with
      exactly two keys, "reading_rule" and "record", and "reading_rule" is a mapping.
    indexer: 'check_reading_rule_thresholds(rr, repro)'
    indexer_behaviour: >-
      It reads rr.get("thresholds"). If that is None it returns
      {"reading_rule_states_thresholds": false, "agrees": null} and nothing is checked. If it is
      present it iterates FIELD_BITS = (16, 20) as PYTHON INTEGERS and evaluates
      stated.get(bits, stated.get(str(bits), {})) - integer key FIRST, string key as fallback -
      then for each sid in STATISTIC_IDS checks `if sid in block` and compares
      float(block[sid]) == float(threshold_vector(repro, bits)[sid]) for exact equality, raising
      RuntimeError on any inequality.
    intended_shape:
      top_level_keys: [reading_rule, record]
      reading_rule_thresholds_key_type: >-
        BARE YAML INTEGERS 16 and 20, which PyYAML safe_load parses as Python ints, so
        stated.get(bits) succeeds on the FIRST lookup and the str(bits) fallback is never needed.
        They are NOT quoted. The same convention RR-EQD-1 used.
      statistic_key_type: >-
        The exact literal strings STAT-CHI-16, STAT-CHI-64, STAT-KS1-E1 and STAT-KS1-E2,
        unquoted plain scalars, which YAML parses as those strings and which equal the members of
        STATISTIC_IDS character for character.
      value_type: >-
        YAML floats written as the exact repr of the archived doubles, so that safe_load produces
        the identical double and the driver's exact-equality comparison holds. All four statistics
        are present at each cell.
      all_four_statistics_present: >-
        DELIBERATE. STAT-KS1-E2 is non-certifying but it IS thresholded and measured at every rung,
        so its archived threshold is written and cross-checked like the other three.
    expected_result_of_the_mechanical_check:
      yaml_safe_load: 'succeeds; top level is a dict with keys reading_rule and record'
      load_reading_rule: 'returns the reading_rule mapping without raising'
      check_reading_rule_thresholds: >-
        returns reading_rule_states_thresholds true, agrees true, and a comparison list of exactly
        8 rows - 2 cells times 4 statistics - every row with equal true and no RuntimeError.
      keyerror_risk: 'none; every lookup the driver performs is a .get with a default or an `in` guard.'
    what_would_have_gone_wrong_if_the_secondary_numbers_had_been_written_under_thresholds: >-
      The driver would have compared the DEP-CAL-A fresh order statistics against the recomputed
      archived values, found them different, and raised RuntimeError, aborting the measurement run
      as an integrity failure. That is the CORRECT behaviour of the guard, and it is why the fresh
      numbers are written under secondary_fresh_null_order_statistics_DEP_CAL_A instead.

  # -------------------------------------------------------------------
  # 15. VERIFICATION AND LIMITATIONS OF THIS FREEZE
  # -------------------------------------------------------------------
  verification_of_the_numbers_in_this_file:
    what_the_coordinator_checked_directly: >-
      Every number written here was read from the archived artifacts in this session and
      cross-checked across at least two independent locations - the eight primary thresholds
      against experiments/EXP-DEP-001/results/calib/null_replicate_statistics.json
      cells.<bits>.archived_thresholds_used, against the run payload's
      archived_thresholds_used and threshold_archived_recomputed fields in every DEP-CAL-C, D and E
      detection block at both cells, and against the TASK-20260801-035 execution report
      DEP-CAL-B block; the eight secondary order statistics against
