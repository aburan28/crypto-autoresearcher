experiment:
  id: EXP-CODESD-514d35
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-2c83a3; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-2c83a3
  question_id: RQ-SDITH-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exhaustive transcript enumeration of a toy threshold MPC-in-the-head shell at N from 2 to
    16, tau from 1 to 4, field size 2 to 16, measuring the exact optimal cheating probability against
    the composed per-repetition budget.
  objective: 'The one uncertainty a run reduces is whether the per-repetition soundness accounting
    used across this proof paradigm is exact, loose or incomplete at the only scale where the question
    can be settled by counting rather than by argument. Concretely: (i) whether the maximum over all
    cheating strategies of the honest verifier''s accept probability, computed by complete enumeration
    of the corruption space crossed with the full challenge space, equals the analytic per-repetition
    budget at tau equal to one, for every grid point; (ii) whether composing tau repetitions multiplies
    the measured single-repetition error exactly, or whether a coupling term appears whose size grows
    with tau; (iii) whether the enumeration instrument itself returns known answers, established by
    a transcript-independent verifier with hard-coded bias and by an honest prover on a true statement,
    both run through the identical code path in the same invocation. A run does not reduce uncertainty
    about any deployed scheme, about any published bound, or about any underlying hard problem. It
    reduces uncertainty about whether the paradigm''s accounting survives an exact test at the scale
    where an exact test exists, and it makes the maximizing cheating strategy an inspectable artifact
    rather than an abstraction.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for the declared toy
      shell with idealized commitments and a placeholder linear relation, at the enumerated (N, |F|,
      tau) grid, the exactly measured optimal cheating probability was X and the composed budget was
      Y, with this argmax strategy. What does NOT follow: nothing about SDitH, FAEST or MQOM at any
      parameter set; nothing about the commitment or hash layer, which is idealized away; and no extrapolation
      of the measured ratio to larger tau, N or lambda, since the run''s whole validity rests on enumerability
      and enumerability ends at the grid.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes) freeze the shell specification and the grid in a fixture file
      before any budget formula is written. STAGE 1 (cost: hours human) implement honest prover and
      verifier; verify completeness at 100 percent over the full grid on true statements. STAGE 2
      (cost: hours human) implement the corruption enumerator and verify on N equal to 2 against a
      hand-computed fixture. STAGE 3 (cost: minutes compute) run NULL-1 (transcript-independent verifier,
      hard-coded bias b) and NULL-2 (honest prover, true statement) through the identical enumeration;
      HALT if NULL-1 does not return b exactly or NULL-2 does not return 1. STAGE 4 (cost: minutes
      to hours compute) run the full grid sweep, recording exact integer accept counts, space sizes
      and the argmax corruption. STAGE 5 (cost: minutes) run the shuffled-challenge invariance control
      at three grid points. STAGE 6 (cost: minutes) compute the analytic budget, form ratios, and
      emit the table plus the argmax strategies as artifacts. Total compute is expected under one
      core-hour; the dominant cost is STAGE 1 and STAGE 2 human time.'
    instrument: 'Python 3.11 standard library: itertools for enumeration, fractions.Fraction for exact
      ratios, random.Random with declared seeds for instance generation only. numpy 2.4.6 optional
      for accept-table bookkeeping. No Sage, no cryptographic library, no external solver. Executed
      through harness/runner.py so the run manifest records the resolved inference block and seeds,
      with immutable run records under an experiments/EXP-* directory.'
    parameters: 'N in {2, 3, 4, 6, 8, 12, 16}; field size |F| in {2, 3, 4, 8, 16}; tau in {1, 2, 3,
      4}; placeholder relation: m linear equations over F in n variables with m in {2, 3, 4} and n
      in {4, 6, 8}, matrix sampled fresh per instance with a declared seed. Instances per grid point:
      20 independently sampled relation matrices, since the measured maximum may depend on the sampled
      matrix and the spread must be reported. Grid points: 7 times 5 times 4 times 9 equals 1260,
      times 20 instances equals 25200 enumerations. Enumeration size capped at 5 million (corruption
      times challenge) pairs per point; points exceeding the cap are reported as lower bounds and
      labelled.'
  controls:
  - 'NULL-1: transcript-independent verifier with hard-coded accept bias b; must return b exactly.'
  - 'NULL-2: honest prover on a true statement; must return accept rate exactly 1.'
  - 'N equal to 2 hand-computed fixture: the one-of-two cut-and-choose soundness error is computable
    by hand and must be reproduced exactly.'
  - 'tau equal to 1 versus tau equal to 2 at fixed (N, |F|): the tensor-composition check.'
  - A shuffled-challenge control in which the challenge is drawn from a permuted but identical space;
    the measured maximum must be invariant under permutation.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls, both executed in the same invocation as the signal arm.
    NULL-1: an identical shell whose verifier accepts on a hard-coded, transcript-independent coin
    of known bias b; the instrument must return exactly b. NULL-2: an identical shell run on a TRUE
    statement with an honest prover, where the accept rate must be exactly 1. For the signal arm to
    mean anything, NULL-1 must return b to the last bit and NULL-2 must return 1 exactly. If either
    misses, the enumeration is measuring the implementation and not the protocol, and no soundness
    number from that run is admissible.'
  independent_variables:
  - party count N
  - field size |F|
  - repetition count tau
  - placeholder relation shape (m, n)
  - arm identity (signal, NULL-1, NULL-2)
  metrics:
    primary:
    - exact measured optimal cheating probability as an integer ratio per grid point
    - analytic composed budget at the same point
    - ratio measured over budget
    - ratio of measured error at tau to the tau-th power of measured error at tau equal to one
    secondary:
    - enumerated corruption-space and challenge-space sizes
    - argmax corruption strategy fingerprint
    - spread of measured error across the 20 sampled relation matrices
    - NULL-1 deviation from b and NULL-2 accept rate
    - wall-clock seconds per grid point
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The composition residue R(tau) = measured_error(tau) divided by measured_error(1) raised
      to the power tau, at each (N, |F|) with tau in 2, 3, 4.
    formula: R(tau) = e(tau) / e(1)^tau, where e(tau) is the exact enumerated maximum accept probability
      at repetition count tau. Predicted R(tau) equals 1 exactly for all tau if repetitions are independent
      as the accounting assumes. R(tau) greater than 1 by more than one part in 10000 at any point
      localizes a coupling term and is the informative outcome; R(tau) less than 1 would indicate
      an enumeration bug and halts interpretation.
    source: Pre-registered in the parent proposal IDEA-20260816-2c83a3 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are N up to 16, field size up to 16, tau up to 4, which is four
      to five orders of magnitude below any deployed parameter set in the family. NO EXTRAPOLATION
      IS PERFORMED OR PERMITTED. The transfer assumption is stated and deliberately not relied on:
      results describe the declared shell at the declared grid. The design''s value is that at this
      scale the quantity is exact, and exactness at toy scale is a different kind of statement from
      an estimate at deployed scale, not a weaker version of one.'
    correspondence: null
  tail_checks:
  - 'N equal to 2, tau equal to 1: hand-computed fixture must be reproduced exactly.'
  - '|F| equal to 2: the field term collapses and the budget must reduce to the pure cut-and-choose
    value.'
  - 'tau equal to 1: R(1) is identically 1 by definition and must be produced as such by the code
    path, not special-cased.'
  - 'Grid points at the 5-million enumeration cap: verify they are labelled as lower bounds in the
    emitted table and excluded from every equality claim.'
  - 'Instances where the sampled relation matrix is singular: these must be either excluded by a declared
    rule or reported separately, never silently mixed.'
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt if NULL-1 does not return its hard-coded bias exactly or NULL-2 does not return 1.
  - Halt if the N-equal-2 fixture fails.
  - Halt if measured error exceeds 1 or falls below 0 at any point, indicating a counting bug.
  - Stop the sweep early and report partial coverage if wall-clock exceeds four core-hours, recording
    which grid points completed; an incomplete sweep is reported as incomplete and never as a null
    result.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both nulls return their known answers exactly, the N-equal-2 fixture is reproduced,
    and the sweep emits exact measured optimal cheating probabilities with their composition residues
    R(tau) at every grid point below the enumeration cap, with the argmax strategies retained as inspectable
    artifacts.
  falsification_criterion:
  - NULL-1 or NULL-2 misses its known answer, voiding all soundness numbers from the run.
  - The corruption space is not enumerable even at the smallest grid point, so no exact maximum is
    obtainable at any scale this design reaches.
  - R(tau) is less than 1 at any point, indicating a counting error rather than a finding.
  - Measured error at tau equal to 1 exceeds the analytic budget, which for this idealized shell indicates
    a shell-construction error and blocks interpretation until diagnosed.
  - The measured maximum changes under the shuffled-challenge invariance control.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-2c83a3
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must approve the exact shell specification, in particular how much freedom the
    cheating prover is granted at commitment time, since that single choice determines whether the
    enumeration is a maximum or a lower bound.
  - The analytic budget formula to compare against must be written down and frozen by the Coordinator
    BEFORE the sweep, and its provenance recorded as derived-here rather than read from any specification.
  - Whether singular sampled relation matrices are excluded or reported separately.
  - Whether the 5-million enumeration cap is the right budget, or whether a smaller cap with more
    grid points is the better use of the same compute.
