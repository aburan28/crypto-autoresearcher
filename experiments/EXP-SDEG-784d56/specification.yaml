experiment:
  id: EXP-SDEG-784d56
  hypothesis_id: H-SDEG-082f7f
  derived_from_idea: IDEA-20260803-202a15
  question_id: RQ-SDEG-001
  goal_id: GOAL-SDEG-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Zero-compute two-number gate on a frozen untruncated boolean/Koszul closed
    form against both committed n=12 D=6 deficits (7,110 column-matched and
    17,947 support-restricted), followed - only if the gate passes - by a chunked
    n=9..13 by D=5,6 dual-null ladder with a seed-spread arm, an n=9 known-shape
    control, and a categorical saturation-shape prediction
  objective: >-
    The one uncertainty a run reduces is whether the semi-regularity model that
    GOAL-SDEG-001, GOAL-DREG-001 and GOAL-SIG-001 all measure against can be
    REPAIRED at D >= 6, or must be CONDEMNED there with a stated boundary. A run
    establishes (i) whether ONE frozen closed form, with no parameter fitted to
    either, reproduces BOTH committed n = 12 D = 6 deficits - 7,110 under
    EV-SIG-008's column-matched generic null and 17,947 under EV-DREG-008's
    support-restricted CTRL-B - which is a zero-compute gate that runs FIRST and
    bounds the cost of a wrong candidate to nothing; (ii) whether the seed-to-seed
    spread of the deficit at fixed cell is smaller than the model error, without
    which no model error may be reported as a fit at all; (iii) whether the form
    holds across an n = 9..13 by D = 5,6 ladder under both null families; (iv)
    whether it reproduces the SIGN CROSSING (D5 support-induced share falling 40.6
    to 0.0 percent while the D6 defect turns on); and (v) whether it correctly
    classifies, at every cell, saturation at rank = ncols - |V| versus collapse
    below it. If no candidate passes, the deliverable is the NAMED NO-GO in a form
    IDEA-20260803-fa9839 can consume. THIS IS A MODEL REPAIR, NOT AN ATTACK: no
    system becomes easier to solve and no exponent moves under any outcome.
  what_this_is_not:
    - >-
      Not an attack, not a solve, not a cost improvement. sota_delta is zero on
      every attack axis in every branch.
    - >-
      NOT A RE-DERIVATION OF THE TWO COMMITTED NUMBERS. 7,110 and 17,947 are read
      AS-IS from EV-SIG-008 and EV-DREG-008. A run that reconciles them by
      reinterpreting either measurement is INADMISSIBLE.
    - >-
      Not a null recalibration. GOAL-SIG-001's SIG-D6-NULL-RECAL-v2 repairs how
      the null is BUILT; this contract asks for a PREDICTIVE MODEL of the deficit
      under BOTH currently committed null families and would consume a
      recalibrated null as an additional family if one lands. It does not wait for
      it.
    - >-
      Not a statement about prime-field systems. The SIG/DREG lineage is BOOLEAN
      and the ECDLP target is prime-field; a repaired boolean d_reg model does not
      transfer.
    - >-
      Not a closure of KN-OPEN-002. A growth law needs a growth range this ladder
      (n <= 13) does not reach.
    - >-
      Not support or weakening of H-SIG-001, H-DREG-001, or any hypothesis about
      the Semaev cascade. This is about the NULL, which is the instrument.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run
      has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - over n in {9,...,13} and D in {5, 6}, under the
      two committed null families and at the seeds actually run, a frozen closed
      form predicts the rank deficit against the semi-regular model to within the
      stated tolerance and classifies the saturation shape correctly at every
      cell; OR it does not, in which case d_reg-derived cost predictions are
      unusable over exactly that range. WHAT DOES NOT FOLLOW - nothing at n > 13
      or D > 6; nothing about PRIME-FIELD systems, which are a different object;
      no closure of KN-OPEN-002; no statement about whether the Semaev cascade is
      exploitable; and no attack, cost or exponent claim of any kind. Cells run at
      a single seed are marked and carry no separation between mechanism and seed
      variation.
  inputs:
    procedure: >-
      STEP 1 (zero compute) - DERIVE the candidate untruncated boolean/Koszul
      closed form IN-REPO FROM FIRST PRINCIPLES, with the up-closure law carried
      explicitly and the field equations x_i^2 = x_i carried rather than absorbed.
      Primary sources are unreachable from this environment, so any recalled form
      may be used ONLY as a candidate to test, never as an authority, and must be
      labelled as such. STEP 2 (zero compute) - FREEZE the form with its parameter
      values and their HASH, together with all six predictions, in a hash-bound
      contract, BEFORE any new rank is computed. Also state, before the gate runs,
      WHICH READING APPLIES if the model cannot explain the difference between the
      two numbers: model failure, or non-comparability of two differently
      constructed nulls. STEP 3, THE TWO-NUMBER GATE (zero compute) - evaluate the
      frozen form at the two committed n = 12, D = 6 cells and record the result
      FIRST. This is the gate; it costs nothing and it is the cheapest possible
      falsification of the candidate. STEP 4, THE SEED-SPREAD ARM - measure the
      seed-to-seed spread of extra_D at fixed (n, D, null family) at the cheapest
      affordable cells and REPORT IT BEFORE any model error is reported. STEP 5,
      THE LADDER (only if the gate passes) - compute n = 9..13, D = 5,6, both null
      families, at least two seeds per cell wherever budget permits, CHUNKED under
      a fresh write_scope with per-chunk receipts and a persisted system hash.
      STEP 6 - the n = 9 known-shape control and the independent recomputation
      control. STEP 7 - report the crossing and the categorical saturation-shape
      classification. STEP 8 - emit EITHER the validated closed form OR the
      negative disposition in fa9839-consumable form. n = 14 is OPTIONAL and
      explicitly outside the completion gate; a truncated ladder degrades
      gracefully and reports what it covered.
    instrument: >-
      Exact rank computation over the working field with a REPRODUCIBLE PIVOTING
      ORDER and a PERSISTED SYSTEM HASH, following the EXP-DREG lineage. Chunked
      execution with per-chunk receipts under a fresh write_scope, because
      EV-DREG-004 records a destroyed checkpoint at 24.93 percent of columns with
      a measured carrier-codec bottleneck. Recorded through harness/runner.py with
      a manifest and source blob hashes.
    parameters: >-
      n in {9, 10, 11, 12, 13}; D in {5, 6}; two null families - EV-SIG-008's
      column-matched generic null and EV-DREG-008's support-restricted CTRL-B; at
      least two seeds per cell wherever budget permits, with single-seed cells
      MARKED. Gate targets: 7,110 (column-matched) and 17,947
      (support-restricted), both at n = 12, D = 6, tolerance 5 percent on each.
      Ladder tolerance: median absolute relative error below 5 percent, maximum
      below 15 percent. Known-shape control at n = 9, where every
      histogram-matched generic null is recorded as saturating at
      rank = ncols - |V|. Reference figures from the committed records: rank
      149,410 against a semi-regular 156,520 with ncols - |V| = 174,031 at n = 12,
      D = 6; D5 support-induced share 40.6 percent at n = 9 and 0.0 percent at
      n = 12; frozen quotient 3,112 dimensions with measured variety sizes 0/1/6
      at n = 9. n = 14 optional and outside the gate.
  controls:
    - >-
      TWO-NUMBER GATE, evaluated with ZERO COMPUTE BEFORE the ladder is
      authorized. A model fitted to ONE deficit is a fit; a model producing 7,110
      under one null family and 17,947 under another at the same n and D with
      nothing tuned to either is a mechanism. This is the cheapest possible
      falsification and it runs first.
    - >-
      FROZEN-PARAMETER CONTROL - the contract records the parameter values and
      their HASH. ANY POST-HOC ADJUSTMENT VOIDS THE BATCH rather than producing a
      revised model. This addresses EV-IC-002 directly, where a criterion was
      revised after the prior criterion was seen to fail, and KN-FIND-029's five
      false-green escapes across three repairs of one mutation control.
    - >-
      DUAL-NULL CONTROL - both null families at every cell, so the model is
      constrained by the DIFFERENCE between them and not only by their levels.
    - >-
      KNOWN-SHAPE CONTROL at n = 9, where EV-SIG-006 records that every
      histogram-matched generic null saturates to rank = ncols - |V|. THE MODEL
      MUST REPRODUCE THAT SATURATION BEFORE ANY n = 12 PREDICTION IS BELIEVED.
      This is also the proves-too-much control: a model predicting collapse at
      n = 9 is void.
    - >-
      SEED-SPREAD ARM (runs before any model error is reported) - at least two
      seeds per cell wherever budget permits, with the spread reported first. A
      spread comparable to the model error means the model is FITTING NOISE and
      must be reported as such.
    - >-
      RECOMPUTATION CONTROL - one cell per null family recomputed independently
      with a DIFFERENT pivoting order and matched exactly, addressing the
      EV-DREG-004 lineage.
    - >-
      NON-COMPARABILITY DISCLOSURE - the reading that applies if the model cannot
      explain the difference between the two numbers is STATED BEFORE THE GATE
      RUNS, not chosen afterwards. GOAL-DREG-001 describes the raw 17,947 as
      QUARANTINED AS CONFOUNDED, and the two numbers come from different
      experiments with different seeds, support histograms and admission metrics.
  independent_variables:
    - n over {9, 10, 11, 12, 13}
    - degree D over {5, 6}
    - null family - column-matched generic versus support-restricted CTRL-B
    - seed, at least two per cell where budget permits
    - pivoting order, for the recomputation control
  metrics:
    primary:
      - >-
        two_number_gate_result - the frozen form's extra_6 at n = 12, D = 6 under
        each null family (unitless rank-deficit counts), with the RELATIVE ERROR
        against 7,110 and against 17,947 respectively
      - >-
        per_cell_extra_D - the measured rank deficit against the semi-regular
        prediction (unitless), per (n, D, null family, seed), with the model's
        relative error at each cell
      - >-
        saturation_shape_classification - categorical per cell, saturates at
        rank = ncols - |V| versus collapses below it, MEASURED, against the
        model's categorical PREDICTION
      - >-
        seed_spread - the spread of extra_D across seeds at fixed
        (n, D, null family) (unitless), reported BEFORE any model error
    secondary:
      - >-
        d5_support_induced_share across n (percent), reproducing or failing to
        reproduce the committed 40.6 percent at n = 9 to 0.0 percent at n = 12
        crossing
      - >-
        ladder_error_summary - median and maximum absolute relative error
        (percent) across the ladder, per null family
      - >-
        n9_known_shape_control_status - pass/fail against the committed saturation
        diagnosis
      - >-
        recomputation_residual - the exact difference between the two independent
        pivoting orders at the recomputed cells (must be 0)
      - >-
        per_chunk_receipts and persisted system hashes for every computed cell
      - >-
        cells_completed versus cells_planned, so a truncated ladder reports what
        it covered rather than failing
      - >-
        negative_disposition_statement - the explicit D and n ranges over which
        d_reg-derived cost predictions are declared unusable, in
        fa9839-consumable form, present whenever no candidate passes
  heuristic_under_test:
    - id: HEUR-001
      formal_statement: >-
        The D6 deficit is a DETERMINISTIC function of (n, D, support histogram,
        null family) and not a stochastic property of the particular random system
        drawn.
      preregistered_prediction: >-
        The seed-to-seed spread of extra_D at fixed (n, D, null family) is
        SMALLER than the model's own relative error at that cell, and materially
        smaller than the 5 percent gate tolerance.
      prediction_source: >-
        NOT SUPPORTED BY ANY PRIOR RESULT, and the parent proposal says so
        explicitly: EV-SIG-008 is a single cell at a single seed and is labelled
        `single_cell`. The prediction is the PREMISE of the whole hypothesis
        rather than an inference from evidence, which is why it is measured first.
      scale_access_and_transfer: >-
        Measured at the same cells the model is evaluated on, so no transfer
        assumption. Where budget forces a single seed, the cell is MARKED and
        contributes nothing to this heuristic.
      sample_size_justification: >-
        At least TWO seeds per cell is a declared MINIMUM, not a power
        calculation: two seeds give a range, not a variance, and can only detect a
        spread comparable to or larger than the model error. That limitation is
        stated rather than hidden - the arm can show the premise is FALSE but
        cannot establish it is true, and a Coordinator wanting the latter must
        fund more seeds at the cheapest cells.
      comparison_metric: >-
        Seed spread of extra_D against the model's relative error at the same
        cell.
      tail_checks:
        - >-
          Report the spread at the CHEAPEST cells first, since those are where
          more than two seeds are affordable and where the premise is testable at
          all.
        - >-
          List every single-seed cell explicitly; they carry no seed information
          and must not be counted as supporting determinism.
      falsification_condition: >-
        The seed-to-seed spread is comparable to the model error. The premise that
        a closed form exists is then wrong, the model is fitting noise, and NO
        model error may be reported as a fit.
    - id: HEUR-002
      formal_statement: >-
        The truncation convention at the freeze degree is the responsible
        discrepancy, so an untruncated series with field equations carried
        explicitly is the right candidate family.
      preregistered_prediction: >-
        The frozen untruncated form returns extra_6 within 5 percent of 7,110 for
        the column-matched null AND within 5 percent of 17,947 for the
        support-restricted null, at n = 12 D = 6, with NO parameter fitted to
        either.
      prediction_source: >-
        EV-SIG-006's committed and independently reviewed diagnosis that D6 is the
        freeze degree and the frozen quotient of 3,112 dimensions is unrealizable
        by any generic boolean system (measured variety sizes 0/1/6), plus its
        up-closure law explaining the support asymmetry at all degrees. THE
        INFERENCE FROM "THE CONVENTION IS SUSPECT" TO "THIS PARTICULAR UNTRUNCATED
        FORM IS RIGHT" IS NOT SUPPORTED and is the weakest link.
      scale_access_and_transfer: >-
        Evaluated at exactly the committed cells, so no transfer. The ladder then
        tests whether the form describes the phenomenon or only n = 12.
      sample_size_justification: >-
        TWO committed numbers is the entire sample and that is the point: a
        one-number target would be indistinguishable from a fit, and this
        programme's own history (EV-IC-002's retraction, KN-FIND-029's five
        false-green escapes) is why a single number is not acceptable here. Two
        numbers from two null families at one cell is a constraint a wrong model
        cannot satisfy by accident.
      comparison_metric: >-
        Relative error of the frozen form against each committed number
        separately, never averaged.
      tail_checks:
        - >-
          Report both errors SEPARATELY and never as a mean; a model that
          overshoots one and undershoots the other has not explained the
          difference.
        - >-
          Report the model's predicted DIFFERENCE between the two null families
          against the committed difference of 10,837, since the difference is what
          a level fit cannot reproduce.
      falsification_condition: >-
        The gate misses either committed value by more than 5 percent. The
        candidate is discarded BEFORE any ladder is authorized, bounding the cost
        of being wrong to zero.
  preregistered_prediction:
    quantity: >-
      two_number_gate_result, ladder_error_summary, crossing reproduction,
      saturation_shape_classification agreement, and seed_spread.
    formula: >-
      Predicted gate: within 5 percent of 7,110 (column-matched) AND within 5
      percent of 17,947 (support-restricted), at n = 12 D = 6, NOTHING FITTED to
      either. Predicted ladder: median absolute relative error below 5 percent and
      maximum below 15 percent across n = 9..13 by D = 5,6 under both null
      families. Predicted crossing: the D5 support-induced share falls from 40.6
      percent at n = 9 to 0.0 percent at n = 12 while the D6 defect turns on over
      the same range. Predicted saturation-shape agreement: 100 percent of cells.
      Predicted seed spread: smaller than the model error at every multi-seed
      cell. Under the null that the truncation convention is NOT the responsible
      discrepancy, the gate misses at least one number and the ladder is never
      authorized.
    source: >-
      Pre-registered in IDEA-20260803-202a15's `predictions` block and restated in
      H-SDEG-082f7f before any run under this contract exists. The comparison
      values 7,110, 17,947, 149,410, 156,520, 174,031, 40.6 percent, 0.0 percent,
      3,112 and 0/1/6 are CITED to EV-SIG-006, EV-SIG-008 and EV-DREG-008 and are
      NOT measurements made here. Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      n <= 13 with D <= 6 on BOOLEAN systems. The ladder is chosen not for scale
      but because the phenomenon TURNS ON inside it: EV-SIG-008 records the D5
      picture at n = 12 as clean while the D6 defect appears there, and n = 9
      shows the opposite pattern, so the crossing is visible only across this
      range. THE TRANSFER ASSUMPTION IS STATED AND EXPLICITLY NOT USED: boolean
      and prime-field systems are DIFFERENT OBJECTS, a repaired boolean d_reg
      model does not transfer to the prime-field ECDLP target, and any citation
      toward prime-field cost must carry that gap. n = 14 would extend the range
      but is optional and outside the completion gate; even n = 14 would not reach
      the growth range KN-OPEN-002 needs.
    correspondence: null
  tail_checks:
    - >-
      Report the two gate errors SEPARATELY, never averaged, and report the
      model's predicted difference between null families against the committed
      difference.
    - >-
      Report the seed spread at multi-seed cells BEFORE any model error, and list
      every single-seed cell.
    - >-
      Report cells_completed against cells_planned; a truncated ladder reports
      what it covered rather than failing, and n = 13 D = 6 is the cell most
      likely to be missing.
    - >-
      Report the recomputation residual exactly; anything other than 0 indicts the
      rank computation before it indicts the model.
    - >-
      Report the saturation-shape classification at EVERY cell including those
      where the numeric error is small, since a model can get magnitudes right for
      the wrong reason.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 43200
    total_cpu_hours: 60.0
    maximum_memory_gb: 64
    maximum_runs: 30
  stopping_rules:
    - >-
      THE LADDER IS NOT AUTHORIZED unless the two-number gate passes. On a gate
      failure the batch either proposes a SECOND frozen candidate (with its own
      hash, frozen before evaluation) or reports the negative. This is the primary
      stopping rule and it costs zero compute.
    - >-
      VOID THE BATCH on any post-hoc adjustment of the frozen form's parameters. A
      revised model is a NEW frozen candidate with a new hash, not an edit.
    - >-
      HALT if the n = 9 known-shape control does not reproduce; route the
      contradiction to a correction record rather than adjusting the model.
    - >-
      STOP reporting model error if the seed spread is comparable to it; report
      the spread and the noise-fitting verdict instead.
    - >-
      n = 14 is OPTIONAL and outside the completion gate. Stop the ladder at
      n = 13; a truncated ladder degrades gracefully and reports its coverage.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
      exhaustion is a stop, never a negative result (AGENTS.md rule 5).
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run (or
      the chunk) failed_infrastructure and is NEVER negative mathematical evidence
      (AGENTS.md rule 5). The chunked design exists so a crash costs a CHUNK
      rather than a CELL.
    - >-
      A run that re-derives, re-interprets or adjusts either committed number
      (7,110 or 17,947) is INADMISSIBLE on its face.
    - >-
      A run whose closed form was not frozen with a hash before the first new rank
      was computed is invalid_measurement; the test has become a description.
    - >-
      A run reporting a model error without having reported the seed spread first
      is invalid_reporting.
    - >-
      A run whose rank computation lacks a reproducible pivoting order or a
      persisted system hash is invalid_reproducibility.
    - >-
      A run whose recomputation residual is nonzero is invalid_measurement at that
      cell until the discrepancy is located.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT
      experiment requiring a new contract; it is never a repair of this one.
  success_criterion: >-
    The two-number gate returns extra_6 within 5 percent of 7,110 for the
    column-matched null AND within 5 percent of 17,947 for the support-restricted
    null at n = 12 D = 6, with the frozen-parameter hash recorded and nothing
    fitted to either; the seed spread at every multi-seed cell is smaller than the
    model error at that cell; the n = 9 known-shape control reproduces the
    committed saturation at rank = ncols - |V|; the ladder's median absolute
    relative error is below 5 percent and its maximum below 15 percent under both
    null families across the completed cells; the crossing from 40.6 percent to
    0.0 percent is reproduced; the saturation-shape classification agrees at 100
    percent of cells; and the recomputation residual is 0. Meeting all of these
    supports a REPAIRED d_reg model over exactly the tested (n, D) range for
    BOOLEAN systems only.
  falsification_criterion:
    - >-
      F1 - the two-number gate misses either committed value by more than 5
      percent. The candidate closed form is WRONG, the ladder is not authorized on
      it, and the batch proposes a second frozen candidate or reports the
      negative. Zero compute spent.
    - >-
      F2 - the ladder error exceeds median 5 percent or maximum 15 percent. The
      form describes n = 12 and not the phenomenon; it is reported as a FITTED
      DESCRIPTION, not a mechanism.
    - >-
      F3 - the saturation-shape prediction is wrong at any cell. The model does
      not distinguish the two regimes and CANNOT be used to repair d_reg
      predictions, whatever its numeric accuracy.
    - >-
      F4 - the n = 9 known-shape control does not reproduce. The model contradicts
      a committed, independently reviewed diagnosis; the contradiction is routed
      to a CORRECTION RECORD and is not resolved by adjusting the model.
    - >-
      F5 - no candidate passes. THE NEGATIVE DISPOSITION IS THE DELIVERABLE:
      d_reg-derived cost predictions are unusable at D >= 6 over the tested n
      range, stated with its exact boundary and in fa9839-consumable form. This is
      PLANNED FOR, not a failure, and is as valuable as the confirmation.
    - >-
      F6 - the seed spread is comparable to the model error. HEUR-001 fails, the
      premise that a closed form exists is wrong, and the model is fitting noise.
    - >-
      F7 - the crossing is not reproduced although the magnitudes are. The model
      describes two unrelated regimes and must SAY SO rather than claiming the
      mechanism.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment
    - >-
      the derived closed form with its derivation from first principles, its
      parameter values, and its HASH, written before any new rank was computed
    - >-
      the pre-registration of all six predictions and the non-comparability
      reading, hashed alongside the form
    - >-
      the two-number gate result with the relative errors against 7,110 and
      17,947 reported SEPARATELY, plus the predicted-versus-committed difference
    - >-
      raw-result.json carrying per-cell extra_D with its relative error, for both
      null families and every seed across the ladder - not summaries
    - >-
      the saturation-shape classification per cell, measured against the model's
      categorical prediction
    - >-
      the D5 support-induced share across n, against the committed 40.6 to 0.0
      percent crossing
    - the seed-spread table, reported before any model error
    - >-
      per-chunk receipts, persisted system hashes, and the independent
      recomputation residual
    - >-
      cells_completed against cells_planned, with every single-seed cell marked
    - >-
      EITHER the validated closed form OR the negative disposition statement in
      fa9839-consumable form. A negative that does not produce that statement has
      not finished.
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution. This contract is
      review_required and is NOT approved; `approved_by` is null and
      `execution_authorized` is false (AGENTS.md rule 1).
    - >-
      THE GATE AND THE LADDER SHOULD BE AUTHORIZED SEPARATELY. The gate costs zero
      compute and is what authorizes the rest; approving the ladder before the
      gate has run spends tens of core-hours on a candidate that may be
      falsifiable for free.
    - >-
      The frozen form, its parameters and its hash must be reviewed BEFORE the
      gate is evaluated, because a form frozen after the gate is not a prediction.
    - >-
      The non-comparability reading - whether a failure to explain the 7,110 /
      17,947 difference indicts the model or the comparison - must be fixed before
      the gate runs.
    - >-
      A fresh write_scope is required for the chunked ladder (EV-DREG-004
      lineage).
  derivation_provenance:
    tool: coordinator subagent, design-experiment lifecycle steps 3-5
    source_record: IDEA-20260803-202a15
    authored_at: '2026-08-25'
    note: >-
      Design, controls, the six predictions, the falsification conditions F1-F5
      and both heuristics are transcribed from the parent proposal's
      `minimal_test`, `predictions`, `controls`, `heuristic_assumptions`,
      `confounders` and `instrument_failure_guards` blocks rather than
      re-invented. F6 and F7 are the decidable renderings of the parent's
      HEUR-BF-1 and crossing prediction. All committed figures (7,110, 17,947,
      149,410, 156,520, 174,031, 40.6 percent, 0.0 percent, 3,112, 0/1/6, 24.93
      percent) are CITED to EV-SIG-006, EV-SIG-008, EV-DREG-008 and EV-DREG-004
      and are NOT measurements made here. Budget follows the parent's declared
      estimated_cost (implementation medium, compute medium) and its
      compute_budget_note that n = 13 D = 6 dominates. No field is invented; gaps
      below.
  derivation_gaps:
    - >-
      THE CLOSED FORM DOES NOT EXIST YET. The parent names a candidate FAMILY -
      the untruncated boolean/Koszul series with field equations carried and the
      up-closure law explicit - but no form is written down, and the entire
      contract turns on deriving one BEFORE the gate. A Coordinator must confirm
      the derivation is a funded step with its own deliverable, not an assumed
      input.
    - >-
      PRIMARY SOURCES ARE UNREACHABLE. Bardet-Faugere-Salvy and the Hilbert-series
      literature for boolean systems with field equations cannot be retrieved from
      this environment, so the form must be derived in-repo. Whether an in-repo
      derivation of the right object is achievable inside the implementation
      budget is UNMEASURED.
    - >-
      THE SEED-SPREAD ARM IS UNDERPOWERED BY DESIGN. Two seeds per cell gives a
      range, not a variance; it can show HEUR-001 is false but cannot establish it
      is true. A Coordinator wanting the positive direction must fund more seeds
      at the cheapest cells, and the cost of that is not estimated here.
    - >-
      THE NON-COMPARABILITY QUESTION MAY SWALLOW THE RESULT. GOAL-DREG-001
      describes the raw 17,947 as QUARANTINED AS CONFOUNDED, and the two numbers
      differ in seed, support histogram and admission metric as well as in null
      construction. If they are simply not comparable, the two-number gate is not
      a test of the model at all - and the contract can only require that the
      reading be declared in advance, not that it be correct.
    - >-
      n = 13, D = 6 MAY NOT COMPLETE. Its ncols materially exceeds the 174,031 of
      n = 12 D = 6 and this lineage has already lost a checkpoint at 24.93 percent
      of columns. The chunked design bounds the loss, but the completion gate must
      state explicitly whether a ladder missing that cell still counts as
      complete.
    - >-
      GOAL-DREG-001 AND GOAL-SIG-001 ARE DOWNSTREAM CONSUMERS but neither is a
      declared dependency of this contract. A Coordinator should confirm the
      write_scope does not overlap theirs, since three goals read the same
      committed evidence.
