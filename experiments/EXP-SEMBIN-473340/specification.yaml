experiment:
  id: EXP-SEMBIN-473340
  hypothesis_id: H-SEMBIN-d8c4fe
  version: 1
  title: >-
    Re-measurement of the FFD_SEMAEV_MEASUREMENT1 section 2 table (Semaev
    versus degree-profile-matched null first fall degree, 8 cells, same seeds
    and draw counts) with the corrected XOR Boolean-ring product, under two
    named degree conventions. The superseded OR-row instrument serves as a
    transcription control only.
  status: approved
  status_history:
    - status: approved
      at: '2026-09-29'
      by: coordinator
      ref: DEC-20260929-0d6685
      note: >-
        Approved under the standing user authorization (AGENTS.md "Standing
        user authorization for ideas and experiments"). Approval is permission
        to run. It is not a claim that any prediction holds.
  question_id: RQ-DREG-bd6c86
  goal_id: GOAL-SEMBIN-fcb7a2
  idea_id: IDEA-20260929-688ea4
  ordered_by: DEC-20260929-d75c82 NA-3 (instrument built under NA-2)
  objective: >-
    Decide, separately for each named convention, whether the three
    MEASUREMENT1 section 2 claims (P1 Semaev pinned at 2, P2 null exceeds
    Semaev, P3 null rises with n') survive when the observable is computed
    with the true Boolean-ring product on exactly the same systems. Until this
    runs, DEC-20260929-d75c82 forbids citing the comparison.
  launcher: >-
    python3 experiments/EXP-SEMBIN-473340/src/remeasure.py
    experiments/EXP-SEMBIN-473340/runs/RUN-SEMBIN-3a4248
  launcher_cwd: repository root of a clean checkout of the approved commit
  pre_launch_gate: >-
    python3 experiments/EXP-SEMBIN-473340/src/test_boolean_macaulay.py must
    exit 0. Its stdout and stderr are captured to
    experiments/EXP-SEMBIN-473340/runs/RUN-SEMBIN-3a4248/prelaunch_test.log.
    A non-zero exit means DO NOT LAUNCH. That is an instrument failure, not
    evidence.
  run_id: RUN-SEMBIN-3a4248
  run_exit_codes:
    '0': >-
      All cells executed and results.json and manifest.json written. Controls
      may still fail and predictions are not scored by the runner.
    '3': infrastructure failure (uncaught exception, traceback on stderr). Never mathematical evidence.
  inputs:
    source_files:
      experiments/EXP-SEMBIN-473340/src/boolean_macaulay.py:
        sha256: 20f70ad5bd39458cc6702bc324244816be51eb050c7643d29eeda7e81487676c
        role: >-
          Corrected instrument. bool_mul (XOR product), fall_profile(eqs, N,
          Dmax, convention in {reduced, formal}), first_fall, and
          legacy_or_fall_profile (superseded OR-row instrument, control only).
      experiments/EXP-SEMBIN-473340/src/remeasure.py:
        sha256: f1ee28dc3e31fda654c2ad2b63a35695a702fd47204238f2ce185426b6fbce6a
        role: >-
          Frozen runner. Cells, seeds and loop structure are verbatim from
          research/verification/ffd_semaev_measure.py. It holds the PUBLISHED
          transcription of MEASUREMENT1 section 2, computes control C1, and
          writes log.txt, results.json and manifest.json.
      experiments/EXP-SEMBIN-473340/src/ffd_semaev_core_v1.py:
        sha256: 15acdaeccc96edafaeaebae17ce16c4c28322ce54ee400aaa1268a17bc1fad2b
        role: >-
          Verbatim copy of research/verification/ffd_semaev_core.py. Only
          build_system, random_matched and on_curve are imported by the
          runner; its defective fall_profile is not. The hash equals that of
          experiments/EXP-SEMBIN-e76704/src/ffd_semaev.py, which is the same
          file.
      experiments/EXP-SEMBIN-473340/src/test_boolean_macaulay.py:
        sha256: 87f38ff89d8e1c00457ff09347ca9c6718c991e56d2b752101fce699dd3b74fc
        role: pre-launch gate (instrument tests; see controls C2)
    external_dependency_of_gate:
      experiments/EXP-SEMBIN-e76704/validation/validator-20260929/boolring.py:
        sha256: ff9d6d80d24bfe8b634130edf3c89d05eaf39616a8a282ecc0683faa55abcc5f
        role: >-
          The validator's independent Boolean-ring kernel, imported by test
          section 3 only. It is committed on main via PR #1491. The runner
          does not import it.
    source_hash_provenance: >-
      All five sha256 values were computed by the top-level session on
      2026-09-29 and relayed to this Coordinator, which has no shell. The
      session reports src/ committed at be6c822cb5. The runner independently
      writes source_sha256 for every src/*.py into manifest.json, which covers
      exactly these four files, and they must agree (IR-1). src/__pycache__/ is
      a derived artifact and not part of the frozen source.
    published_reference: >-
      research/FFD_SEMAEV_MEASUREMENT1.md section 2 and
      research/verification/ffd_semaev_measure_results.txt, transcribed in
      remeasure.PUBLISHED. The Coordinator checked the transcription by
      reading both on 2026-09-29, and all 16 distributions match.
    cells: '(n, n'') in {4,5,6,7} x {3,4}; N = 2 n''; Dmax = min(N, 6) = 6'
    draws: 10 Semaev per cell; 25 null per cell, all matched to the s = 0 Semaev system
    system_construction: >-
      Semaev draw s: rng = random.Random(7919 n + 131 n' + s). x_R =
      rng.choice(x-coordinates of E(F_{2^n}): y^2 + xy = x^3 + x^2 + 1).
      basis = indep_basis(n, n', rng). eqs = build_system(n, n', 1, x_R,
      basis): the S_3(x1, x2, x_R) Weil descent, n Boolean equations with
      empty components dropped. Null draw t: random_matched(eqs_{s=0}, N,
      random.Random(31 n + 7 n' + t)), which keeps the same per-equation
      monomial-degree profile. Unreduced generator sets; no independence
      reduction.
    observable_naming_NA4: >-
      Every d_ff in this experiment names three things. (i) Definition: the
      MEASUREMENT1 section 0 differencing fall profile,
      new_falls(D) = dim(V_D cap R_{<D}) - dim V_{D-1} and
      d_ff = min{D : new_falls(D) > 0}. It is not Nagao 2013/549
      Definition 1 and not literal 2015/984 Definitions 5 or 6.
      (ii) Field equations: reduced modulo in every product. Convention
      "reduced" filters rows by the reduced product degree <= D. Convention
      "formal" filters rows by deg m + deg f <= D. Convention "legacy" is the
      control and filters by the degree of the set-OR product.
      (iii) Product: XOR Boolean-ring for reduced and formal; set-OR for
      legacy.
      The formal convention is defined by the code. Its equality with the
      {f} union S_fe Macaulay filtration in F_2[u] is not asserted.
  controls:
    - id: C1
      kind: transcription and seed-integrity control (blocking)
      design: >-
        For every cell, the legacy (set-OR) column must equal the PUBLISHED
        Semaev and null distributions exactly
        (results.json control_C1_legacy_reproduces_all == true). This checks
        together the cell and seed transcription, the RNG streams under the
        executing CPython, the draw counts, and the legacy re-implementation.
      on_failure: >-
        The run is not scorable. It is recorded as an infrastructure or
        transcription failure, preserved, and never read as mathematics. No
        P is scored from it.
      limit: >-
        It confirms that the systems are the published ones. It cannot
        validate the corrected instrument, which is C2's job.
    - id: C2
      kind: instrument validation (pre-launch gate, blocking)
      design: >-
        test_boolean_macaulay.py exits 0 before launch. It covers the product
        cases (u0u1*(u0+u1) = 0 and others). It checks the rank method against
        explicit span enumeration on 120 N = 3 systems in both conventions,
        and d_ff(reduced) against the validator's boolring kernel on 12
        systems. Fixtures: identity 2 and witness [1,2,4,8,26] 3 under
        reduced; counterexample [1,2,4,13,26] 2 under reduced but 3 under
        legacy; witness 3 and identity 2 under formal. The Def-1 D = 2
        element sum_j u_j h4 = h4 exists, and it is not new under formal.
      limit: >-
        The formal convention is checked against brute-force span
        enumeration at N = 3 only, not against an independent kernel. The
        boolring comparison is non-blind: the validator's kernel reuses the
        same system construction.
    - id: C3
      kind: count integrity (blocking)
      design: >-
        In results.json, each of the 8 declared cells is present exactly once.
        For each of reduced, formal and legacy, the Semaev counts sum to 10
        and the null counts sum to 25.
    - id: C4
      kind: scorer self-test
      design: >-
        Applying scoring_rule to the legacy column must give P1 holds, P2
        holds and P3 holds, because the published table satisfies all three.
        If it does not, the scorer is wrong and must be fixed before any
        convention is scored. This checks the scoring, not the run.
  independent_variables:
    - cell (n, n') in {4,5,6,7} x {3,4}
    - system kind (Semaev descent; degree-profile-matched null)
    - convention (reduced, formal; legacy as control)
  metrics:
    primary:
      - per cell and convention, the Semaev and null d_ff distributions (results.json cells[].<convention>.semaev / .null)
      - the six scored outcomes P1_reduced, P2_reduced, P3_reduced, P1_formal, P2_formal, P3_formal, each holds | fails | indeterminate under scoring_rule
      - results.json control_C1_legacy_reproduces_all
    secondary:
      - per cell and convention, the count of Semaev draws with d_ff != 2 (the strict "pinned" reading; descriptive, not scored)
      - the (7,3) deficit in each convention (descriptive; published legacy value 0)
      - per cell, a side-by-side table of reduced, formal and legacy
      - any d_ff of 1 or None (no fall up to Dmax), reported explicitly
      - the runner's semaev_median and null_median (None excluded), reported next to the censored medians when a None occurs
      - elapsed_seconds; manifest.json python, platform, source_sha256
  heuristic_under_test: not_applicable. No numbered heuristic is assumed or validated.
  preregistered_prediction:
    quantity: >-
      Six outcomes, scored separately (convention c in {reduced, formal}):
      P1_c: the Semaev median d_ff equals 2 in all 8 cells.
      P2_c: the null median minus the Semaev median is >= 1 in each of the 7
      cells other than (7,3).
      P3_c: for each n in {4,5,6,7}, the null median at n' = 4 is strictly
      greater than at n' = 3.
    formula: See scoring_rule. Exact comparisons on medians of integer multisets; no tolerance and no statistical test.
    source: >-
      INDEPENDENT OF THIS RUN'S DATA: these are the claims
      research/FFD_SEMAEV_MEASUREMENT1.md section 2 published on 2026-09-16
      with the defective instrument. P1 is its sentence "Semaev's d_ff is
      pinned at 2 in every cell". Its table (medians all 2, with 10 of 80
      draws at 3) fixes the operational reading as the median. The strict
      reading (every draw 2) is contradicted by the published table itself,
      so it is reported as a secondary quantity and not scored. P2 is the
      "median deficit" column (null median minus Semaev median), >= 1
      except 0 at (7,3). P3 is its sentence "The null's d_ff rises with n'".
      The only derivation behind any of them is section 3a. It bears on the
      EXISTENCE of a degree-2 Semaev combination when x_R != 0, and it does
      not imply P1 in every draw (see H-SEMBIN-d8c4fe mechanism). No theorem
      predicts P2 or P3. Nothing here was read off a run of the corrected
      instrument on these cells. The instrument-development facts the
      Coordinator was given concern test fixtures only.
    published_values_under_legacy: >-
      Semaev medians 2 in all cells. Null medians (4,3) 3, (4,4) 4, (5,3) 3,
      (5,4) 4, (6,3) 3, (6,4) 4, (7,3) 2, (7,4) 3. Deficits 1, 2, 1, 2, 1, 2,
      0, 1.
  scoring_rule:
    applied_by: >-
      The Coordinator at evidence review, and independently by the
      validator, from results.json alone. The runner does not score and the
      executor scores nothing.
    precondition: >-
      C1, C2, C3 and C4 all pass and IR-1..IR-9 are not triggered. Otherwise
      nothing is scored.
    censoring: >-
      A d_ff recorded as "None" means no new fall at any D <= Dmax = 6. It is
      treated as CENSORED, ranked above every integer. The multiset median
      follows statistics.median: the middle order statistic for 25 values,
      and the mean of the 5th and 6th order statistics for 10 values. If any
      order statistic entering the median is CENSORED, the median is
      CENSORED. If no None occurs, the medians equal the runner's
      semaev_median and null_median.
    P1_c: >-
      For each cell, satisfied iff the Semaev median equals 2. A CENSORED
      median is not satisfied.
    P2_c: >-
      For each cell other than (7,3): if both medians are finite, satisfied
      iff null minus Semaev is >= 1. If only the null median is CENSORED,
      satisfied. If the Semaev median is CENSORED, indeterminate.
    P3_c: >-
      For each n: if both null medians are finite, satisfied iff the median
      at (n,4) is greater than the median at (n,3). If only (n,4) is
      CENSORED, satisfied. If only (n,3) is CENSORED, not satisfied. If both
      are CENSORED, indeterminate.
    aggregation: >-
      P_c holds if every condition is satisfied. It fails if any condition is
      not satisfied. It is indeterminate if none fails and at least one is
      indeterminate. Outcomes are never pooled across conventions or across
      P1 to P3.
  interpretation_map:
    C1_fails: >-
      No mathematical reading. Infrastructure or transcription. The failure
      is preserved and a re-attempt goes under SR-2 only after the cause is
      identified.
    P2_c_and_P3_c_hold: >-
      The null-exceeds-Semaev and null-rises-with-n' pattern is re-verified
      at toy tier for convention c on these systems. It stays an upper bound
      on the real deficit until the block-multiaffine null (MEASUREMENT1 N1)
      runs, and it says nothing about solving degree.
    P2_c_or_P3_c_fails: >-
      The MEASUREMENT1 headline does not hold for convention c on these
      systems. For c = reduced, given C1 passes, the published pattern was an
      artifact of the set-OR product. For c = formal the difference is not
      attributed to the product alone, because the row filter also differs.
      The MEASUREMENT1 comparison may then not be cited for c.
    P1_c_fails: The "Semaev pinned at 2" statement does not hold for convention c.
    mixed_across_conventions: >-
      Reported per convention. Any citation of MEASUREMENT1's comparison must
      name the convention (DEC-20260929-d75c82 NA-4).
  scale_relevance:
    tier: toy
    justification: >-
      F_{2^n} with n in 4..7, N in {6, 8} Boolean variables, at most 7
      equations. Tested parameters only. No transfer to larger n or n', to
      m > 2, to other curves or characteristics, to cryptographic parameters,
      or to solving degree.
    correspondence: not_applicable. Direct computation on seeded instances.
  tail_checks:
    - >-
      Not a distribution-fit experiment. The analogous check is that every
      None (censored) value and every d_ff = 1 is reported per cell and
      convention, never dropped. The runner's medians exclude None, and the
      scoring rule does not.
  replication:
    seeds: >-
      Semaev: 7919 n + 131 n' + s for s in 0..9, i.e. bases 32069 (4,3),
      32200 (4,4), 39988 (5,3), 40119 (5,4), 47907 (6,3), 48038 (6,4),
      55826 (7,3), 55957 (7,4). Null: 31 n + 7 n' + t for t in 0..24, i.e.
      bases 145, 152, 176, 183, 207, 214, 238, 245 in the same cell order.
    seeds_note: >-
      The null seed ranges overlap between cells: (4,3) and (4,4), (4,4) and
      (5,3), (5,3) and (5,4), (5,4) and (6,3), (6,3) and (6,4), (6,4) and
      (7,3), and (7,3) and (7,4) all share seeds. This is inherited from
      MEASUREMENT1 and kept deliberately so the systems are identical. It is
      disclosed in the hypothesis's interpretation_limits.
    independent_instances: 280
    independent_instances_note: >-
      80 Semaev and 200 null systems, identical to MEASUREMENT1's. The run is
      a re-computation, not a fresh sample. The null systems are not
      independent across cells (seed overlap), and all 25 per cell are
      matched to one Semaev system.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 86400
    total_cpu_hours: 24
    maximum_memory_gb: 4
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      Machine-protection ceilings, not estimates. The session's rough
      expectation is tens of minutes (8 cells x 35 systems x 3 conventions,
      N <= 8, Dmax 6, bitset elimination over at most 256 columns), but it
      has not been measured. The 86,400 s watchdog protects the shared host
      from a hung single-threaded process. Its expiry checkpoints the task as
      an infrastructure event and is never evidence. maximum_runs 1 counts
      the one scored execution.
  stopping_rules:
    - >-
      SR-1: Run the pre-launch gate, then the launcher, each exactly once. A
      run that exits 0 is final whatever its controls or outcomes show, and
      it is never re-run for a different result.
    - >-
      SR-2: A gate failure, a non-zero launcher exit or a watchdog kill is an
      infrastructure event. Preserve every file written, report it, and do
      not re-attempt in the same task. A re-attempt needs a Coordinator
      decision, a new RUN id minted by the session, and the same frozen
      contract. src/ and PUBLISHED are never edited.
    - >-
      SR-3: Stop without launching if any src/*.py sha256 differs from
      inputs.source_files, or if the run directory exists before the gate
      runs.
  invalidation_rules:
    - IR-1 manifest.json source_sha256 differs from inputs.source_files for any of the four files. The run is invalid and not evidence.
    - IR-2 The run was launched from a working tree where any src/ file is modified or untracked relative to the approved commit. The run is invalid.
    - IR-3 results.json is missing, unparseable, or lacks cells or control_C1_legacy_reproduces_all. Infrastructure failure, not evidence.
    - IR-4 manifest.json command does not name the runner path and experiments/EXP-SEMBIN-473340/runs/RUN-SEMBIN-3a4248. The run is invalid.
    - IR-5 Any edit to src/, PUBLISHED or this specification after approval without a versioned protocol_amendment under amendments/. The run is invalid.
    - IR-6 control_C1_legacy_reproduces_all is false. The run is not scorable (C1).
    - IR-7 C3 count integrity fails. The run is invalid.
    - IR-8 The pre-launch gate did not exit 0, or prelaunch_test.log is absent. The run is invalid.
    - IR-9 raw-result.json is not byte-identical to results.json. The run record is invalid until repaired from the preserved results.json.
  success_criterion: >-
    Protocol success, which is not success of the hypothesis: exit 0,
    IR-1..IR-9 not triggered, C1..C4 pass, and all six outcomes scored by
    scoring_rule (holds, fails or indeterminate). H-SEMBIN-d8c4fe is
    confirmed for convention c only if P1_c, P2_c and P3_c all hold, and only
    at these cells and for this convention.
  falsification_criterion: >-
    Under a valid, scorable run, any of P1_c, P2_c or P3_c "fails" falsifies
    that claim for convention c on these systems, per interpretation_map.
    Each of the six is falsified independently. An infrastructure failure,
    C1 failure or watchdog kill falsifies nothing.
  interpretation_limits:
    - Toy tier, N <= 8. One curve shape, characteristic 2, m = 2.
    - The null is matched on the degree profile only. The block-multiaffine null (MEASUREMENT1 N1) is not run, so any surviving deficit is an upper bound.
    - d_ff is not the solving degree. Nothing about subexponentiality, ECDLP cost or any curve's security.
    - The run re-computes on MEASUREMENT1's systems. It is not a fresh sample, and null draws are correlated across cells by seed overlap.
    - >-
      The conventions are named by code, and neither is asserted equal to a
      numbered literature definition. The formal convention has no
      independent-kernel check.
    - >-
      Identity presentations only. Nothing here bears on recombination
      separation (H-SEMBIN-934774, KN-OPEN-7f0511 (A)).
  required_artifacts:
    - experiments/EXP-SEMBIN-473340/runs/RUN-SEMBIN-3a4248/prelaunch_test.log (executor; stdout and stderr of the pre-launch gate)
    - experiments/EXP-SEMBIN-473340/runs/RUN-SEMBIN-3a4248/results.json (runner)
    - experiments/EXP-SEMBIN-473340/runs/RUN-SEMBIN-3a4248/manifest.json (runner)
    - experiments/EXP-SEMBIN-473340/runs/RUN-SEMBIN-3a4248/log.txt (runner)
    - experiments/EXP-SEMBIN-473340/runs/RUN-SEMBIN-3a4248/manifest.yaml (executor run record in the tools/validate_ledger.py check_run schema; certificate kind none)
    - experiments/EXP-SEMBIN-473340/runs/RUN-SEMBIN-3a4248/command.txt
    - experiments/EXP-SEMBIN-473340/runs/RUN-SEMBIN-3a4248/environment.json
    - experiments/EXP-SEMBIN-473340/runs/RUN-SEMBIN-3a4248/stdout.log
    - experiments/EXP-SEMBIN-473340/runs/RUN-SEMBIN-3a4248/stderr.log
    - experiments/EXP-SEMBIN-473340/runs/RUN-SEMBIN-3a4248/raw-result.json (byte-identical copy of results.json, sha256 recorded in manifest.yaml)
  required_artifacts_note: >-
    results.json, manifest.json and log.txt are what the runner writes.
    prelaunch_test.log preserves the C2 gate output, including the
    formal-convention witness fixture that DEC-20260929-0d6685 cites. The
    rest are the program's run-record wrapper and add no computation.
  assigned_to: executor
  approved_by: coordinator
  approval_ref: DEC-20260929-0d6685
