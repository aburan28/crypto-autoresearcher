        max degree <= D. dim V_0 is computed, not assumed. falls(D) is
        computed differently from the producer, as rank(rows) minus the rank
        of the rows restricted to the degree-D columns (the kernel of the
        top-degree projection), valid because every admitted row has degree
        <= D. The producer instead orders the degree-D columns first. d_ff is
        min{D >= 1 : new_falls(D) > 0}, else None. Self-tests (vbr.selftest):
        u0u1*(u0+u1) = 0. The XOR product equals the pointwise product of
        functions on {0,1}^N, via the ANF bijection, on 300 random cases.
        Rank equals explicit span size on 300 cases. falls and dim V_D equal
        explicit span enumeration on 120 random N = 3 systems in all three
        conventions.
      system_construction_reused_disclosed: >-
        Imported from src/ffd_semaev_core_v1.py: build_system, random_matched
        and on_curve (its fall_profile is not used). Copied verbatim from
        src/remeasure.py: indep_basis and the seeding loop (lines 30-44 and
