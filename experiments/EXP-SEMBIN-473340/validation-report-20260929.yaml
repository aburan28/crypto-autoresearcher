          formal: {semaev: {2: 10}, null: {3: 1, 4: 24}}
          agrees_with_results_json: true
      extended_result: >-
        All 8 cells x {reduced, formal, legacy} x {Semaev, null}: 48 of 48
        distributions identical to results.json (compare_blind_vs_runner.json).
        This covers all 280 systems, well beyond the minimum of s = 0 plus 5
        nulls at two cells.
      audit_of_boolean_macaulay_after_blind_phase:
        result: no defect found
        findings:
          - bool_mul toggles each t|m in a set (out ^= {mm | m}), which is the XOR Boolean-ring product.
          - >-
            fall_profile skips empty generators. Formal admits m iff
            popcount(m) + deg f <= D. Reduced admits nonzero products whose
            reduced degree <= D. Zero products are dropped, which is harmless.
            rank_low is a correct echelon reduction. Each new pivot row is
            reduced against all earlier pivots, and the pivot is the first set
            column in (degree-D columns, then lower columns). So the rows whose
            pivot has degree < D span V_D cap R_{<D}. Any combination involving
            a degree-D-pivot row keeps the pivot bit of its earliest member.
          - >-
            D starts at 1 with dim V_0 := 0. By definition V_0 is nonzero only
            if some generator is the constant 1. The validator found 0 constant
            generators, and dim V_0 = 0 under every convention in all 280
            systems. The shortcut has no effect here, but it would misreport
            d_ff = 1 on a system that has a constant generator.
          - >-
            Two docstring claims go beyond the evidence. "formal ... the
            standard Macaulay filtration of {f} + field equations" is TRUE for
            the differencing observable (check 5). "the degree a solver actually
            pays at" is unsupported, because d_ff is not the solving degree
            (MEASUREMENT1 section 4). The specification and hypothesis already
            decline to adopt it.

    5_formal_convention:
      result: PASS (the identification holds for the differencing observable)
      argument: >-
        Let pi: F_2[u] -> B be reduction mod S_fe = {u_j^2 + u_j}, and
        V'_D = span{mu*g : g in {f} union S_fe, deg mu + deg g <= D} in F_2[u],
        with the generators f given squarefree. (i) The lead terms u_j^2 are
        pairwise coprime, so S_fe is a Groebner basis for any
        degree-compatible order. Hence ker pi cap F_2[u]_{<=D} is contained in
        V'_D. (ii) pi(V'_D) = V_D^formal, because pi(mu) is a squarefree
        monomial of degree <= deg mu. (iii) pi restricted to
        V'_D cap F_2[u]_{<=D-1} maps onto V_D^formal cap B_{<=D-1}, by lifting
        the squarefree representative and using (i), with kernel
        ker pi cap F_2[u]_{<=D-1}. So falls'(D) - dim V'_{D-1} =
        falls_formal(D) - dim V_{D-1}^formal for every D, because the
        ker pi terms cancel. The dimensions themselves differ by
        dim ker pi cap F_2[u]_{<=D}. Only new_falls, and hence d_ff, coincide.
      computation: >-
        polyring_formal_check.py builds the Macaulay filtration in the
        UNREDUCED ring F_2[u] (exponent vectors, field equations as
        generators) and compares new_falls(D) for every D with vbr formal.
        Hand example: identical. Random systems (N = 2..4, generator degree
        <= 3): 296 of 296 identical, and in 130 of them formal d_ff differs
        from reduced d_ff, so the check discriminates between the
        conventions. Experiment systems: all 35 of (4,3) (N = 6, Dmax 6)
        plus (6,4) Semaev s = 0 and nulls t = 0..2 (N = 8, Dmax 6), 39 of 39
        identical. Sanity check (polyring_dimension_sanity.txt, (6,4) s = 0):
        dim V'_D = C(N+D,D) - sum_{k<=D} C(N,k) + dim V_D^formal exactly for
        D = 0..6 (0, 0, 14, 125, 484, 1281, 2997). This confirms the
        computation really runs in F_2[u].
      hand_example: >-
        N = 3, f = u0u1 + u0 + u1. FORMAL (Boolean). D=2: V_2 = <f>, whose top
        part u0u1 is nonzero, so falls 0. D=3: u0*f = u0u1 + u0 + u0u1 = u0,
        u1*f = u1, and u2*f = u0u1u2 + u0u2 + u1u2. dim V_3 = 4, and only
        u2*f has a degree-3 part, so falls(3) = 3 and new_falls(3) =
        3 - dim V_2 = 2. d_ff = 3. F_2[u] with S_fe. D=2: V'_2 = <f, u0^2+u0,
        u1^2+u1, u2^2+u2>, whose top parts u0u1, u0^2, u1^2, u2^2 are
        independent, so falls 0. D=3: u0*f + u1*(u0^2+u0) + (u0^2+u0) = u0 and
        u1*f + u0*(u1^2+u1) + (u1^2+u1) = u1, two new low-degree elements.
        new_falls'(3) = 2, d_ff = 3, which agrees. REDUCED on the same f: at
        D=1, u0*f = u0 and u1*f = u1 are admitted directly as rows of V_1, so
        they never register as falls. new_falls = (0, 0, 0) and d_ff = None at
        Dmax 3. The reduced convention is therefore not the F_2[u] filtration,
        and the two conventions genuinely differ.
      consequence: >-
        The specification's caveat "Its equality with the {f} union S_fe
        Macaulay filtration in F_2[u] is not asserted" can be discharged for
        the new_falls/d_ff observable. The scope is generators given
        squarefree, and it does not extend to dim V_D. The Coordinator may
        record this. The formal convention now has an independent-kernel check
        at scale, from this blind re-derivation over 280 systems.

    6_interpretation_audit:
      what_the_outcomes_license:
        - >-
          On exactly MEASUREMENT1's 80 Semaev and 200 null systems, at toy
          tier, per named convention (differencing definition of MEASUREMENT1
          section 0; field equations reduced in every product; XOR product;
          rows filtered by reduced degree or by formal degree). P1: the Semaev
          median d_ff is 2 in all 8 cells. P2: the null median exceeds the
          Semaev median by at least 1 in all 7 scored cells. P3: fails, because
          at n = 7 the null median does not rise from n' = 3 to n' = 4. It
          does rise at n = 4, 5 and 6.
        - >-
          Per interpretation_map P2_c_or_P3_c_fails, the MEASUREMENT1 headline
          does not hold for either convention on these systems, and
          MEASUREMENT1's comparison may not be cited for either convention as
          preregistered.
        - >-
          Scoping caution for the evidence record. The map's clause "for
          c = reduced ... the published pattern was an artifact of the set-OR
          product" is supported only for the part of the pattern that changed.
          Reduced and legacy differ only in the product, and C1 pins the
          systems. So the product is established as the cause of exactly one
          change: the (7,3) null median fell from 3 to 2 under OR (13/25 null
          draws at 2 under OR, against 7/25 reduced and 1/25 formal). That is
          what made P3 hold at n = 7 in the published table. The n = 4, 5, 6
          rises (3 -> 4) and every P2 deficit survive the product correction.
          Reading the clause as "the whole null-rises/deficit pattern was an
          artifact" would overclaim.
        - >-
          For formal, the P3 failure is not attributed to the product alone,
          because the row filter also differs (as the specification says).
          Descriptively, formal and reduced give identical medians in all 16
          cell-kinds, and the same failing condition.
      measurement1_headline:
        semaev_pinned_at_2: >-
          Survives in the preregistered median reading (P1 holds under both
          conventions). The strict reading (every draw 2) was already false in
          the published table (10/80 at 3). It is slightly worse after
          correction (12/80): (5,3) moves from 10/10 to 8/10 at 2. The two
          changed draws (s = 4 and s = 8, x_R = 8) each carry a degree-1
          generator. Under the XOR product the only degree <= 1 element of V_2
          is that generator, which is already in V_1, so no new fall occurs at
          D = 2. This is consistent with the H-SEMBIN-d8c4fe mechanism caveat
          that section 3a gives existence, not a new fall in every draw.
          "Stable under both n and the random draws" does not hold in the
          strict sense.
        null_rises_with_n_prime: >-
          Does not survive as the preregistered universal statement (P3 fails
          under both conventions). What does survive: medians 3 -> 4 at
          n = 4, 5 and 6 under both conventions. At n = 7 they are 3 -> 3. Note
          that "3 at n'=3, 4 at n'=4" was already not literally true at n = 7
          in the published table (2 -> 3).
        deficit_widens_with_n_prime: >-
          The corrected deficits from n' = 3 to n' = 4 are 1 -> 2 at n = 4, 5
          and 6 and 1 -> 1 at n = 7. It widens at three of four n, not at n = 7.
        null_exceeds_semaev: >-
          Survives (P2 holds). The null median is above the Semaev median by at
          least 1 in all 8 cells, including (7,3), under both conventions. This
          is measured only against a degree-profile-matched null (see limits).
      cell_7_3: >-
        The published exception (deficit 0, null median 2) disappears. The
        corrected deficit is 1 under both conventions, with null median 3
        (null draws at d_ff 2: legacy 13, reduced 7, formal 1). Per-draw,
        legacy to reduced: 7 go 2 -> 3, 1 goes 3 -> 2, 17 unchanged. (7,3) is
        excluded from P2 by preregistration, so its new deficit neither helps
        nor hurts P2. It is the direct cause of the P3 failure at n = 7: the
        (7,3) null median rises from 2 to 3 while (7,4) stays at 3. As a
        descriptive fact, not scored and no rescue, the n = 7 null
        distribution does shift upward with n': mean d_ff 2.72 -> 3.12
        reduced and 2.96 -> 3.32 formal. The preregistered median rule does
        not register that shift. SPECULATION, not a finding: the null d_ff
        falls with n at fixed n' (for n' = 4, n equations in N = 8 variables),
        so at n = 7 the n-trend may mask the n'-trend. An untested reading.
      what_is_not_licensed:
        - Any statement that Semaev systems have a structural d_ff advantage beyond "exceeds a degree-profile-matched random system". The block-multiaffine null (MEASUREMENT1 N1, IDEA-20260916-9d2fa6 rung 3) was not run.
        - Any reading of d_ff as the solving degree, the degree of regularity or an ECDLP cost, and any subexponentiality statement.
        - Any transfer to n > 7, n' > 4, m > 2, other curves or characteristics, or cryptographic parameters. That includes the "trend" claim MEASUREMENT1 N3 would test.
        - Any statement about recombination separation (H-SEMBIN-934774, KN-OPEN-7f0511 (A)). This is identity presentations only.
        - Pooling reduced and formal, or pooling P1 to P3.
      null_object_control_audit: >-
        The null is of the same shape, with the same equation count and the
        same per-equation monomial-degree profile, and it is run through the
        identical instrument, so the inventor-protocol section 3 minimum is
        met. Only the weakest rung is met, though. The report does state what
        the deficit should do as the null is made more structure-matched:
        MEASUREMENT1 section 4 and IDEA-20260916-9d2fa6 predict that a
        count-matched null overstates the deficit. That prediction is
        UNMEASURED. So the canonical artifact tell (does the deficit decay
        under the structure-matched null?) is unaddressed by data, and the P2
        deficit is an upper bound.
      limits_carried_over:
        - Toy tier. N <= 8, n <= 7, one curve (a2 = a6 = 1), characteristic 2, m = 2. Dmax = 6, which equals N at n' = 3.
        - The null is degree-profile-matched only. The block-multiaffine null N1 was not run.
        - All 25 null draws per cell are matched to ONE Semaev system (s = 0), so null variation across Semaev degree profiles is unsampled. None of the 8 s = 0 systems has a degree-1 generator. All 8 degree-1-generator systems are Semaev draws with s != 0.
        - >-
          Null seeds are correlated across cells. Each P3 comparison (n,3)
          against (n,4) shares 18 of 25 RNG seeds (for example 145..169
          against 152..176). The adjacent (n,4)/(n+1,3) pairs share 1 seed.
          The systems differ because N and the profiles differ, but the draws
          are not independent.
        - This is a re-computation on MEASUREMENT1's systems, not a fresh sample. The exact median comparisons with 10 and 25 draws carry no statistical test, as preregistered.
        - d_ff (the differencing definition) is not Nagao 2013/549 Definition 1, not literal 2015/984 Definitions 5 or 6, and not the solving degree.
        - System construction (build_system, random_matched) is shared between producer and validator. C1 pins the systems to the published ones, but a construction defect common to both would be invisible to this validation.

