    4_blind_rederivation:
      result: PASS (agreement)
      blind_from_respected: true
      blind_from: >-
        As DEC-20260929-0d6685 NA-3 lists it:
        experiments/EXP-SEMBIN-473340/src/boolean_macaulay.py,
        experiments/EXP-SEMBIN-473340/runs/, experiments/EXP-SEMBIN-e76704/validation/.
        The validator also held back src/test_boolean_macaulay.py and
        experiments/EXP-SEMBIN-e76704/validation-report-20260929.yaml.
      procedure: >-
        vbr.py was written from specification.yaml
        inputs.observable_naming_NA4 and MEASUREMENT1 section 0 only. Ring
        B = F_2[u]/(u_j^2+u_j). The XOR product accumulates t|m by symmetric
