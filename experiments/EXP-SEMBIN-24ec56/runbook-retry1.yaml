steps:
- id: S01-retries
  kind: trials
  title: Execute the three frozen retry trials once each, in plan order, under the supervisor claim
  explain: Runs run.py then check.py for every trial of trial-plan-retry1.json under the supervisor claim and keeps
    every output file.
  plan: experiments/EXP-SEMBIN-24ec56/trial-plan-retry1.json
  engine: supervisor
  claim:
    ttl_minutes: 4320
  timeout_seconds: 259200
  validity:
    files:
    - path: manifest.yaml
    - path: results.jsonl
    - path: instances.json
    - path: raw-result.json
      json: true
      assertions:
      - pointer: /schema
        equals: sembin.closure_degree.result.v1
      - pointer: /experiment_id
        equals: EXP-SEMBIN-24ec56
      - pointer: /hypothesis_id
        equals: H-SEMBIN-106967
      - pointer: /trial_id
        equals: '{trial_id}'
      - pointer: /run_id
        equals: '{run_id}'
      - pointer: /environment/m4ri_available
        type: boolean
      - pointer: /cells
        type: array
      - pointer: /instances
        type: array
      - pointer: /instances
        min_length: 1
      - pointer: /summary/false_refutations
        type: integer
      - pointer: /summary/censored_jobs
        type: integer
      - pointer: /summary/eliminator_disagreements
        type: integer
      - pointer: /instances_canonical_sha256
        matches: ^[0-9a-f]{64}$
      - pointer: /status
        in:
        - completed_valid
        - completed_invalid
  by_trial:
    poly-m4-n9:
      files:
      - path: raw-result.json
        json: true
        assertions:
        - pointer: /seed
          equals: 20261019
        - pointer: /run_id
          equals: RUN-SEMBIN-af9f0f
        - pointer: /trial_id
          equals: poly-m4-n9
    rand-m4-n9:
      files:
      - path: raw-result.json
        json: true
        assertions:
        - pointer: /seed
          equals: 20261020
        - pointer: /run_id
          equals: RUN-SEMBIN-cf4102
        - pointer: /trial_id
          equals: rand-m4-n9
    null-support-m4-n9:
      files:
      - path: raw-result.json
        json: true
        assertions:
        - pointer: /seed
          equals: 20261022
        - pointer: /run_id
          equals: RUN-SEMBIN-d3997d
        - pointer: /trial_id
          equals: null-support-m4-n9
  controls:
  - null-support-m4-n9
  replay:
    mode: fields
    sample: 2
    compare:
    - file: raw-result.json
      pointers:
      - /cells
      - /instances_canonical_sha256
      - /determinism_excluded_fields
      - /summary/false_refutations
      - /summary/m4_refutations
      - /summary/r4_by_cell
  on_invalid: stop
  on_failure:
  - when:
      timed_out: true
    class: resource_exhaustion
    action: stop
  - when:
      exit_code: 3
    class: implementation_error
    action: stop
  - when:
      validity: false
    class: invalid_measurement
    action: stop
  tell_on_failure: Report the tool-recorded terminal class and this step's log paths, preserve all files, and stop
    this session without retry.
