schema: crypto.autoresearch.runbook.v1
experiment_id: EXP-SEMBIN-24ec56
session_id: RBS-SEMBIN-ed3a5b
title: Retry, once each, the three EXP-SEMBIN-24ec56 one-cell trials killed by container restarts (new run ids,
  AMD-EXP-SEMBIN-24ec56-20261022-retry1)
purpose: 'Measures, per cell (m in 3..5; n, k per the plan; V polynomial and random), the share of enumeration-certified
  UNSAT chained-S_3 descended systems refuted by the degree-4 mutant closure W_4 (with its Clopper-Pearson 95% interval),
  the false-refutation count on SAT instances, the plain Macaulay M_4 refutation count and the D_W distribution,
  beside the same statistics on support-matched and dense nulls, the m=2 control, the block-local L2adj1 arm at
  m=4, the C1 pilot gate and the C6 determinism replicate, with two GF(2) eliminators and two enumerators. Observations
  only; check.py re-derives every count from instances[] and re-labels a seeded sample from source. No speedup,
  no cost against rho and no statement at n = 131 is claimed. Retry session of AMD-EXP-SEMBIN-24ec56-20261022-retry1:
  poly-m4-n9, rand-m4-n9 and null-support-m4-n9 under new run ids; the killed attempts RUN-SEMBIN-63c142, RUN-SEMBIN-6718c2,
  RUN-SEMBIN-6928a2 stay preserved as non-evidence.'
