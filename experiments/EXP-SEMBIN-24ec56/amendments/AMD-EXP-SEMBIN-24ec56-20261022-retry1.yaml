amendment:
  id: AMD-EXP-SEMBIN-24ec56-20261022-retry1
  experiment_id: EXP-SEMBIN-24ec56
  recorded_at: '2026-10-22'
  kind: execution_retry
  approved_by: DEC-20261022-063e36
  standing_authorization: AGENTS.md 2026-09-06; user instruction 2026-10-22 ('Restart them')
  trigger: 'Container restarts on 2026-10-19 killed three one-cell trials of runbook session RBS-SEMBIN-24ec56 mid-run:
    poly-m4-n9 (RUN-SEMBIN-63c142, about 2026-10-19T01:47Z); rand-m4-n9 (RUN-SEMBIN-6718c2, about 2026-10-19T02:38Z);
    null-support-m4-n9 (RUN-SEMBIN-6928a2, about 2026-10-19T03:42Z). Each left launch artifacts and partial results.jsonl
    / stdout.log and no execution receipt, so tools/experiment_execution.py reads them needs_reconciliation and
    the resumed session skips them.'
  findings:
  - 'The three interruptions are infrastructure losses (host reclaimed while idle), not implementation, resource
    or measurement failures: no worker returned, no watchdog or RSS cap fired.'
  - No partial output of the three killed attempts was read as a result; none is evidence.
  - 'docs/experiment-execution.md: an existing run directory is never reused; a retry needs a new immutable run
    id and explicit additive authorization.'
  changes:
  - No byte of the specification, trial-plan.json, runbook.yaml or implementation/ changes.
  - The killed attempts RUN-SEMBIN-63c142, RUN-SEMBIN-6718c2, RUN-SEMBIN-6928a2 stay preserved as interrupted, non-evidence
    attempts and are archived as such.
  - Each of the three trials is retried exactly once under a new run id (RUN-SEMBIN-af9f0f, RUN-SEMBIN-cf4102, RUN-SEMBIN-d3997d)
    by experiments/EXP-SEMBIN-24ec56/trial-plan-retry1.json (same trial id, cell, seed, argv apart from run id and
    plan path, watchdog, memory cap and checker) through experiments/EXP-SEMBIN-24ec56/runbook-retry1.yaml (session
    RBS-SEMBIN-ed3a5b), after session RBS-SEMBIN-24ec56 ends.
  - A retry that is itself interrupted is reconciled again by a further additive record; a completed retry (valid
    or invalid) is final and never rerun.
  scientific_protocol_unchanged: true
  scientific_protocol_note: The seed fixes curves, V, targets and the instance stream, so each retry measures the
    instances its killed attempt would have measured. The retries replace infrastructure losses only and are distinct
    from replications; the C3 checker scope question for null families (check.py) is untouched here and is reviewed
    separately.
  retries:
  - trial_id: poly-m4-n9
    interrupted_run: RUN-SEMBIN-63c142
    retry_run: RUN-SEMBIN-af9f0f
  - trial_id: rand-m4-n9
    interrupted_run: RUN-SEMBIN-6718c2
    retry_run: RUN-SEMBIN-cf4102
  - trial_id: null-support-m4-n9
    interrupted_run: RUN-SEMBIN-6928a2
    retry_run: RUN-SEMBIN-d3997d
