  trigger: 'Session RBS-SEMBIN-24ec56 ended on 2026-10-31 with its step failed: 4 trials were killed by container
    restarts without receipts (poly-m4-n9, rand-m4-n9, null-support-m4-n9 on 2026-10-19; poly-m3-n15 on 2026-10-22)
    and the 15 unstarted trials failed in about one second each with infrastructure_error receipts because the 2026-10-31
    container image lacked numpy and libm4ri-dev. rand-m3-n13''s run id RUN-SEMBIN-989e60 had one earlier launch
    lost with a container (disclosed in experiments/EXP-SEMBIN-24ec56/reports/execution-notes-20261031.md).'
  findings:
  - Every one of the 19 losses is infrastructure (host reclaimed, or missing packages), not implementation, resource
    or measurement failure; no measurement of these cells exists.
  - With numpy 2.4.6 and libm4ri-dev 20200125-1build2 installed, build.sh rebuilds every shared library byte-identical
    (sha256) to those of the validated runs.
  - 'docs/experiment-execution.md: a retry needs a new immutable run id and explicit additive authorization; existing
    run directories are never reused.'
  changes:
  - No byte of the specification, trial-plan.json, runbook.yaml or implementation/ changes.
  - The 19 earlier run directories stay preserved as interrupted or infrastructure_error, non-evidence attempts.
  - Each of the 19 trials is retried exactly once under a new run id by experiments/EXP-SEMBIN-24ec56/trial-plan-retry2.json
    (same trial id, cell, seed, argv apart from run id and plan path, watchdog, memory cap and checker) through
    experiments/EXP-SEMBIN-24ec56/runbook-retry2.yaml (session RBS-SEMBIN-620add).
  - Retry-1 (AMD-EXP-SEMBIN-24ec56-20261022-retry1, DEC-20261022-063e36) is superseded before any launch; its tasks
    are cancelled.
  - A completed retry (valid or invalid) is final and never rerun.
  scientific_protocol_unchanged: true
  scientific_protocol_note: Seeds fix curves, V, targets and instances, so each retry measures what its lost attempt
    would have measured. Python is 3.11.18 here against 3.11.15 for the earlier runs (recorded per run in environment.json);
    GF(2) results are exact and the interpreter affects wall time only. The C3 checker-scope question for null families
    is untouched here.
