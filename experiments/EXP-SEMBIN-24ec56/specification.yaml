experiment:
  id: EXP-SEMBIN-24ec56
  hypothesis_id: H-SEMBIN-106967
  source_idea: IDEA-20261010-066c44
  question_id: RQ-SEMBIN-fa2e3f
  goal_id: GOAL-SEMBIN-5078bc
  version: 1
  title: 'Per-cell successor of EXP-SEMBIN-d9767f. Heuristic validation of Semaev 2015 Assumption 1 on the UNSAT arm: minimal refuting mutant-closure
    degree D_W of chained-S_3 descended decompositions at m in {3,4,5}, n in {9,11,13,15}, |V| >= 8, poly and
    random V, with support-matched and dense nulls, two eliminators and two enumerators'
  experiment_class: heuristic-validation
  status: review_required
  frozen: true
  designed_at: '2026-10-18'
  designed_under_task: TASK-20261018-7639af
  approved_by: null
  approval_decision: DEC-20261018-9262ac
  execution_authorized: false
  status_note: >-
    Successor of EXP-SEMBIN-d9767f (version 1, approved by DEC-20261017-3fa9e1), frozen and approved 2026-10-18 by
    DEC-20261018-9262ac under AGENTS.md 'Standing user authorization' and recorded by AMD-EXP-SEMBIN-24ec56-20261018-successor. The scientific protocol
    (cells, curves, targets, closures, eliminators, enumerators, controls, thresholds, invalidation rules)
    is EXP-SEMBIN-d9767f's, with three changes: (1) the six multi-cell trials become 36 one-cell trials with the
    parent trial's seed, so each cell reproduces exactly the instances the parent plan intended; (2) the
    watchdogs are per cell and the runbook step covers the protocol's measured duration (the parent's
    14 h step and 10 h trial watchdogs could not cover its own m=3 n=13 cell, which ran more than 8.6 h);
    (3) the variable ledger and prediction provenance of docs/confound-control.md are added, and the
    success and falsification criteria are scoped to the cells no earlier result measured. The parent's
    interrupted RUN-SEMBIN-07f442 is preserved as a non-evidence attempt and never read as a result here.
    Any later change is a versioned protocol_amendment under experiments/EXP-SEMBIN-24ec56/amendments/.
  objective: >-
    For each cell (m; n,k) of the Stage-1 ladder, build enumeration-certified chained-S_3 descended
    decomposition systems (t = m, Semaev 2015 eq. (5)) on up to three curves per n (curves_used reported per
    cell) for both V = {deg < k} and a seeded
    random k-dimensional V, label every instance SAT/UNSAT by two independent exhaustive enumerators, run the
    closures M_3, W_3, M_4, W_4 (W_5 where columns <= 4e4) with two GF(2) eliminators, and record per cell the
    UNSAT share refuted by W_4 with its Clopper-Pearson 95% interval, the false-refutation count on SAT
    instances, the M_4 refutation count and the D_W distribution, beside the same statistics on a
    support-matched null and a dense matched null and a block-local secondary arm at m = 4. The experiment
    measures a degree; it measures no cost against rho and claims no speedup.
  successor_of:
    experiment_id: EXP-SEMBIN-d9767f
    amendment: experiments/EXP-SEMBIN-d9767f/amendments/AMD-EXP-SEMBIN-d9767f-20261018-successor.yaml
    interrupted_run: RUN-SEMBIN-07f442
    reason: container restart at about 06:02 UTC on 2026-10-18 during the parent's first trial; the parent's
      14 h step and 10 h trial watchdogs could not cover its protocol in any case
