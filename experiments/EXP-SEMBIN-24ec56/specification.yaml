  artifact_schema:
    raw_result: 'sembin.closure_degree.result.v1: experiment_id, hypothesis_id, trial_id, run_id, seed,
      environment (host, compiler, libm4ri presence and version, Python and numpy versions, m4ri_available; JSON
      pointer /environment), cells[] (with curves_used per cell), instances[] one per (instance, closure,
      eliminator) with instance_id, cell,
      m, n, k, v_type (poly|rand), family (S3|NULL|NULL2|M2CTRL), curve_b, label, nsol, closure_kind
      (M|W|L2adj1), D, eliminator (m4ri|independent), contains_one, rank, cols, rows, codim, iterations,
      ops_proxy, wall_s, peak_rss_mb, censored, elimination_faults, evalcheck_mismatch (design memo;
      Coordinator resolutions h, i)'
    results_jsonl: raw per job
    instances_json: labels and solutions
    environment_record: 'at raw-result.json pointer /environment (host, compiler, libm4ri presence and version,
      Python and numpy versions, m4ri_available); the file named environment.json in a run directory is written
      by the supervisor, not by run.py, and is not a driver artifact'
  launcher:
    trial_plan: experiments/EXP-SEMBIN-24ec56/trial-plan.json
    driver: experiments/EXP-SEMBIN-24ec56/implementation/run.py
    checker: experiments/EXP-SEMBIN-24ec56/implementation/check.py
    build: experiments/EXP-SEMBIN-24ec56/implementation/build.sh
    command: python3 experiments/EXP-SEMBIN-24ec56/implementation/run.py --run-dir {run_dir} --run-id <RUN>
      --trial-id <trial> --seed <seed> --plan experiments/EXP-SEMBIN-24ec56/trial-plan.json
    checker_command: python3 experiments/EXP-SEMBIN-24ec56/implementation/check.py {run_dir}
      experiments/EXP-SEMBIN-24ec56/trial-plan.json
    runbook: experiments/EXP-SEMBIN-24ec56/runbook.yaml
    runbook_session: RBS-SEMBIN-24ec56
    library:
    - 'libm4ri-dev (host release 0.0.20200125) for closure.c; optional: absence degrades the trial to the
      independent eliminator with a recorded flag'
    - gcc, Python 3 with numpy (pilot2_lib)
  assigned_to: executor
  out_of_scope:
  - the direct S_{m+1} presentation (any m)
  - any n > 15
  - any solver other than the two eliminators (no msolve, M2, BRiAl or SAT engine; H1 is not tested here)
  - any cost extrapolation, cost table, crossover or comparison against rho
  - any statement about n = 131 or the security of any deployed curve
