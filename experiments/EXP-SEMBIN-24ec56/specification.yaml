  heuristic_under_test: A1
  heuristic_validation:
    heuristic: >-
      A1, Semaev 2015 Assumption 1 (KN-LIT-fa346d, wording as recorded in RQ-SEMBIN-fa2e3f): for the Boolean
      systems of eq. (5) at the parameters the paper uses, d_F4 - the maximal total degree of polynomials
      occurring strictly before F4 terminates (Section 4.4) - is at most 4. Quantifiers as tested here: for
      every enumeration-certified UNSAT instance of every tested cell (m in {3,4,5}; (n,k) per the cell list;
      V poly and random; up to three curves per n), 1 in W_4, i.e. D_W = 4; the prediction tolerates a 10%
      non-refuted share per cell (P1).
    source: RQ-SEMBIN-fa2e3f (Assumption 1 statement); IDEA-20261010-066c44 (operationalisation D_W via H1)
    rigorous_support: >-
      D_W <= d_F4 on UNSAT (IDEA notes section 3, derivation sketch, unchecked), so D_W >= 5 on an instance
      implies d_F4 >= 5 there; the converse (d_F4 <= D_W + 1) is heuristic H1 of H-SEMBIN-106967 and is not
      tested here. Columns C(N,<=4) are polynomial in N (IDEA notes section 1).
    operationalization: >-
      W_D is the mutant closure to fixpoint of the Boolean chained-S_3 system with field equations; 1 in W_D
      is a certificate of UNSAT (Prop S). D_W = min{D : 1 in W_D} over the closures run. r_4 is the share of
      UNSAT instances with 1 in W_4. Flat 4 (P1) leaves Assumption 1 not contradicted on the UNSAT arm at the
      tested cells; growth (r_4 < 0.5 at a cell) with the support null still at 4 reads, via the sketched
      inequality, as Assumption 1 measured false at that cell on the UNSAT arm; growth with the support null
      also >= 5 reads as a property of the presentation's support (IDEA notes section 4 reading table).
    what_is_uniform: >-
      Nothing is assumed uniform. The comparison objects are the support-matched null (same monomials, iid
      coefficients) and the dense matched null (same per-degree monomial counts, uniform monomials), which
      separate curve coefficients, sparse support and counting (IDEA proof_search_map observation_collision).
    scale_access: >-
      toy scale only (n <= 15, m <= 5, N <= 48, columns <= 213,053 at D = 4); no correspondence reaches a
      larger scale and no transfer to n = 131 or any cryptographic size is claimed.
    sample_size_justification: >-
      >= 30 UNSAT instances per (cell, V), drawn as the first 10 unique UNSAT targets per (curve, V) over three
      curves: resolves r_4 >= 0.9 against 0.5 with a Clopper-Pearson 95% width
      below 0.2 (design memo). IDEA notes section 4: 30/30 has CP95 lower bound 0.884, 60/60 gives 0.940, and
      30 UNSAT detect a true 20% non-refuted share with probability 1 - 0.8^30 = 0.9987. A rate >= 0.9 at 30
      does not exclude a constant non-refuted share (H4). Nulls: >= 10 labelled per null per cell (design memo).
    comparison_metric: >-
      per (cell, V) r_4 with Clopper-Pearson 95% against 0.90; null r_4 against 0.9 and 0.1; M_4 count against
      0; D_W distribution per cell; P4 by AIC comparison of log2(ops_proxy) ~ a + b log2 N against ~ a + c N
      on independent-eliminator counts pooled over all uncensored S_3 UNSAT cells.
    tail_checks_available: >-
      the D_W distribution per cell reports every non-refuted UNSAT instance individually (the tail of P1);
      the minimal refuting D is reported where W_5 ran; the censored count per cell is reported beside r_4;
      the per-key block-local rate is reported beside the full-W_4 rate on the same instances.
    controls_for_heuristic: C1-C6 above; the dense matched null is the synthetic control of the same shape.
  scale_relevance:
    tier: toy
    justification: >-
      n in {9, 11, 13, 15}, m in {3, 4, 5}, up to three curves per n, |V| in {8, 16, 32}; no cryptographic-scale
      statement; no transfer or extrapolation assumption is made (RQ-SEMBIN-fa2e3f constraints; AGENTS.md
      rule 7).
    correspondence: null
