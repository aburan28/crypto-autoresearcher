  - presentation = chained S_3 only (t = m); the direct S_{m+1} presentation is out of scope
  - one host class; wall_s and peak_rss_mb are descriptive and are excluded from the determinism replicate
  - M4RI 2020 caveat; the host libm4ri is 0.0.20200125 with a documented large-elimination defect, so the
    independent eliminator is primary above 50,000 columns and both must agree wherever both run; if libm4ri
    is absent the trial runs independent-only with a recorded flag and C5 is reported as not run
  - the pilots are exploratory provenance for the cell choice only, never evidence; their numbers are quoted
    here as provenance, not as expectations that bind the reading
  - check.py is producer-written; it re-derives schema, recounts r_4 and false refutations, re-labels a seeded
    sample of >= 10 instances per cell with the Boolean C enumerator from source and verifies codim/solution
    agreement; it is still not independent review, which precedes any status move
  - censoring at the 6 GB / 1800 s limits is expected to concentrate on the cells with >= 124,314 columns
    (m4-n13-k4, m5-n9-k3, m5-n11-k3); a censored cell is reported with its count and is never negative
  - the thresholds are the IDEA's pre-registered ones (support at r_4 >= 0.9, falsification at r_4 <= 0.8);
    a cell between them makes the contract inconclusive, and no threshold is moved after a run without a
    versioned protocol_amendment
  - Assumption 1 and Assumption 2 are different claims and are never refuted as one (RQ-SEMBIN-fa2e3f)
