experiment:
  id: EXP-MONO-b19c6b
  version: 1
  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-08-31'
  coordinator_approval_rationale: >-
    APPROVED. This contract IS DEC-20260831-a4b23f's own `next_action`: a
    THIRD, properly re-derived attempt at H-MONO-663fb4's K3/K4 question,
    fixing every design defect independently confirmed by two consecutive
    experiments' review rounds. (1) DESIGN-TIME FLOOR-VS-THRESHOLD CHECK,
    PERFORMED BEFORE THIS APPROVAL (KN-TECH-95a42b): with alpha=0.05 and
    the tightest declared family at m=100 tests (50 curves x {Var, C/F}),
    the Holm threshold is alpha/m=0.0005. At null_draws_per_cell=20000, the
    permutation p-value floor is 1/20001~=0.00005 -- exactly 10x below
    0.0005, a stated, checked safety margin, unlike EXP-MONO-670aa6 whose
    n=200 gave a floor 5-10x ABOVE its own thresholds. This arithmetic is
    written into this contract's own text (see `inputs.null_draws_note`)
    specifically so a future reader never has to re-derive it to trust the
    design. (2) A `family` DISCRIMINATOR IS THREADED THROUGH EVERY SEED
    CALL SITE (prime, curve-a, curve-b, null-subset, null-object-pick,
    coset-pick) -- not only the two the out-of-band EXP-MONO-670aa6 patch
    touched -- fixing the total prime/B/t_used collision both reviewers
    found. (3) A PRE-REGISTERED, FLOOR-IMMUNE PANEL-LEVEL FISHER-COMBINED
    STATISTIC IS A SECOND PRIMARY METRIC, alongside (never instead of) the
    per-curve Holm test, so a true effect too small to survive per-curve
    FWER correction is not silently discarded. (4) THE j0 FAMILY IS SPLIT
    INTO ORDINARY AND SUPERSINGULAR SUB-ARMS BY AN EXPLICIT, FROZEN
    ADMISSION RULE (p = 1 mod 3), closing the 58%-contamination finding.
    (5) THE DUAL-PATH CONTROL IS EXTENDED to a declared random sample of
    null/null-object draws (not only the 100 real-arm cells), with its
    residual diagnostics PERSISTED and THRESHOLDED, not discarded. (6) RAW
    (not only Holm-adjusted) per-curve p-values are PERSISTED for the
    Stage-2 gate, closing the artifact-retention asymmetry both reviewers
    flagged. (7) THE LEGACY SUB-PANEL EXPLICITLY RELIES ON
    EXP-MONO-c819ba's own already-confirmed subgroup/coset-union positive
    controls rather than requiring its own fresh 8-curve construction to
    happen to realize >=2 subgroup-capable curves (which failed by chance
    in both EXP-MONO-670aa6 runs) -- this contract's own legacy panel is
    OPTIONAL, reported only if convenient, never gating. (8) SAME
    STANDALONE-BRANCH AUTHORITY AS ALL NINE PRIOR MONO CONTRACTS THIS
    SESSION: GOAL-MONO-001 is `paused` with its batch campaign budget
    exhausted; this draws on none of it. (9) THIS CONTRACT'S OWN TEXT
    CARRIES A MACHINE-READABLE PROVENANCE POINTER (see `provenance_note`
    immediately below `version`) precisely because two out-of-band edits
    to EXP-MONO-670aa6's own specification.yaml, post-execution, made its
    on-disk text silently diverge from what was actually run -- a future
    reader of THIS file should never need git history to know whether it
    is trustworthy.
  provenance_note: >-
    This file, as committed at design-snapshot time, IS the text this
    experiment is executed against. If this file's content ever differs
    from what a later reader observes without an accompanying
    `protocol_amendment` record under experiments/EXP-MONO-b19c6b/amendments/,
    that is unauthorized drift -- check `git log -- <this path>` for any
    commit not authored by an authorized Coordinator session, and consult
    ledger/corrections/ for a disclosure before trusting the on-disk text.
  hypothesis_id: H-MONO-663fb4
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  batch_id: null
  batch_id_note: >-
    No batch is asserted. GOAL-MONO-001 is `paused` with its campaign
    budget exhausted; batch assignment is a Coordinator act and is not
    performed here.

  title: >-
    Third K3/K4 attempt: design-time floor-vs-threshold checked (n=20000,
    10x safety margin), family-keyed seed derivation, pre-registered
    Fisher-combined second primary metric, ordinary/supersingular j0
    split.

  objective: >-
    Decide, at toy scale, whether the real x-coordinate factor base's
    character bias (Var_R N_m(R) and C/F at m=4) is statistically
    distinguishable from a matched random symmetric subset, under a design
    whose statistical power was verified arithmetically BEFORE approval,
    and whose panel-independence claim was verified by direct code
    extraction BEFORE approval -- the two failure modes that separately
    killed EXP-MONO-c819ba (uncontrolled false-positive rate) and
    EXP-MONO-670aa6 (zero power; correlated panel).

  supersession_note: >-
    A NEW experiment, not an amendment: EXP-MONO-c819ba and
    EXP-MONO-670aa6 are both frozen, completed and immutable. Nothing here
    edits, reruns, or retroactively reinterprets either's archived
    numbers. This contract's implementation is written FRESH (it may reuse
    EXP-MONO-670aa6's arithmetic core -- fields/curve/conv/groupstate --
    verified correct by both reviews, but the panel-construction and
    seed-derivation modules must be rewritten to genuinely thread `family`
    through every call site, not patched in place).

  what_this_is_not:
    - Not a discrete-logarithm computation, not an ECDLP attack, not relation collection at scale.
    - Not an ECDLP cost, runtime, asymptotic, exponent, cryptographic-scale, or deployed-scheme claim.
    - Not a closure of KN-OPEN-009. Its imprimitivity/monodromy half is EXP-MONO-12ce1c's and is untouched here.
    - >-
      Not a re-litigation of EXP-MONO-c819ba's or EXP-MONO-670aa6's own
      dispositions: this contract accepts both prior findings (uncalibrated
      bands; zero-power design) and does not re-test either specific claim.
    - Not a claim on GOAL-ECDLP-001's or GOAL-RELN-001's territory.
    - Not approved for any purpose beyond what this record states once run.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: that on a declared panel of >= 100 independently-constructed
      curves (>= 50 j0-ordinary-admitted, >= 50 random-ordinary) over
      primes in [100, 3000], with exhaustive target enumeration, 20000
      matched null draws per cell, a design-time-verified Holm/Bonferroni
      per-curve test AND a pre-registered Fisher-combined panel-level test,
      the real x-coordinate factor base's character bias at m=4, F=N/4
      either was or was not distinguishable from a matched random symmetric
      subset -- reported per curve-family, both metrics, with an explicit
      enrichment comparison between the two genuinely-independent families.
    what_no_outcome_can_support: >-
      No outcome establishes the asymptotic size of C; no outcome converts
      a measured deviation into a cost or an exponent; no outcome
      transfers to crypto scale or to F_{q^n}. Toy evidence is never
      crypto-scale evidence (AGENTS.md rule 7).

  inputs:
    field_bits: [7, 8, 9, 10, 11]
    prime_range: [100, 3000]
    m_values_primary: [4]
    m_values_secondary: [1, 2, 3]
    m_note: >-
      m=4 is the PRIMARY test moment, matching K4's sharpest moment and
      both prior experiments' own choice (so this run remains comparable
      in spirit, though not in raw numbers, to its two predecessors). m=1
      is calibration-only, excluded from every corrected/combined family.
      m=2,3 are secondary/graded only, on the optional legacy panel.
    primary_factor_base_size: "N/4"
    null_draws_per_cell: 20000
    null_draws_note: >-
      DESIGN-TIME CHECK, PERFORMED AND RECORDED HERE (per KN-TECH-95a42b),
      NOT LEFT FOR EXECUTION OR REVIEW TO DISCOVER: with alpha=0.05 and
      the four declared Holm families each having m<=100 tests (50 curves
      x {Var,C/F}), the smallest per-family threshold is alpha/m=0.0005.
      A two-sided permutation p-value at n=20000 has floor 1/20001 ~=
      0.00005 -- exactly 10x below every declared threshold. This margin
      is deliberately generous (EXP-MONO-670aa6's own floor was 5-10x
      ABOVE its thresholds, the opposite failure): a design with the floor
      merely equal to the threshold would still make an EXACTLY-at-floor
      observation borderline; 10x margin means even a moderately-extreme
      (not maximally-extreme) real observation can be Holm-significant.
      FROZEN: this number may not be revised after any Stage-2 or Stage-3
      number is observed (invalidation_rules).
    targets: >-
      ALL R in E(F_p), exhaustively. No target sampling.
    primary_panel:
      j0_ordinary_curves: 50
      j0_supersingular_curves_reported_not_corrected: "as realized, uncapped"
      random_ordinary_curves: 50
      total_ordinary_comparison: 100
      construction_note: >-
        j0 curves are constructed under an EXPLICIT, FROZEN admission rule
        (p = 1 mod 3, checked, not assumed -- see `prime_construction`)
        so every j0 curve counted toward the primary 50-curve j0 family is
        GENUINELY ORDINARY, closing EXP-MONO-670aa6's undisclosed
        58%-supersingular-contamination finding. Any j0 curve_ordinal
        whose prime fails p=1 mod 3 is SKIPPED (the scan continues to the
        next candidate at that (b,k), matching the out-of-band patch's own
        mechanism, independently re-derived and adopted here on this
        Coordinator's own authority after verifying it is a standard,
        correct number-theoretic admission rule) and is reported in
        `construction_failures`, never silently dropped without a count.
        Supersingular j0 curves that WOULD have been constructed are not
        separately panel-tested in this contract (out of scope; a future
        contract may test the ordinary-vs-supersingular axis directly).
      independence_note: >-
        Each of the 100 curves is constructed from a seed stream keyed by
        (domain, FAMILY, label, field_bits_or_p, curve_ordinal, m,
        draw_index, counter) -- see `seed_derivation_rule` -- so a j0 curve
        and a random-ordinary curve at the SAME curve_ordinal draw from
        DISJOINT hash streams and, generically, distinct primes. This is
        the fix for EXP-MONO-670aa6's total (100%) prime/B/t_used
        collision, VERIFIED here (not merely asserted) via a required
        pre-approval extraction script (see `required_artifacts_if_later_authorized`).
    legacy_panel:
      status: optional_non_gating
      rationale: >-
        EXP-MONO-670aa6's own 8-curve legacy sub-panel failed its
        subgroup-availability precondition by chance (only 1 of 8 curves
        had 4|n2, vs >=2 required) in BOTH runs, leaving this lane's
        mandatory positive control (H-MONO-663fb4's own
        `proof_search_map.method_ceiling.nearby_object_control`) entirely
        reliant on EXP-MONO-c819ba's own, already-independently-reviewed,
        n=30 legacy panel (which DID realize 2 subgroup-capable curves:
        RO3, CM1). This contract explicitly RELIES ON THAT PRIOR RESULT
        rather than re-attempting a fresh 8-curve draw that might fail the
        precondition again by chance: `positive_control_1`/`_2` are NOT
        re-run here. If a future reviewer wants a fresh legacy panel with
        a GUARANTEED subgroup-capable pair, that requires either enlarging
        the legacy panel size or hand-selecting primes with 4|n2 by
        construction (not attempted here, to keep this contract's own
        marginal scope narrow and its budget small).
    master_seed: 20260901
    domain: EXP-MONO-b19c6b/v1
    seed_derivation_rule: >-
      Every draw uses SHA-256 of the ASCII bytes of
      domain || "|" || decimal(master_seed) || "|" || family || "|" ||
      label || "|" || decimal(field_bits_or_p) || "|" ||
      decimal(curve_ordinal) || "|" || decimal(m) || "|" ||
      decimal(draw_index) || "|" || decimal(counter), big-endian unsigned,
      with rejection sampling against modulo bias (reject digests >=
      floor(2^256/M)*M for a draw in [0,M)). Labels used, and no others:
      "prime", "curve-a", "curve-b", "null-subset", "null-object-pick".
      `family` is one of "j0", "random-ordinary" and no others, and MUST
      appear in the preimage of EVERY ONE of these five labels -- this is
      the single arithmetic fix for EXP-MONO-670aa6's total panel-
      independence failure, and its presence at every call site (not only
      two of five) must be verified by direct code inspection before
      approval is finalized (done; see `coordinator_approval_rationale`
      point 2) and by the required extraction script before any run.
      `master_seed` also appears in the preimage (fixing a second, latent
      EXP-MONO-670aa6 defect: its own seed rule declared `master_seed` as
      an input but never used it, so both its "independent" replication
      runs shared one identical panel). curve_ordinal runs 0..49
      independently within each family; field_bits round-robins
      [7,8,9,10,11] via field_bits[k mod 5]. A third party holding domain
      and master_seed reproduces every instance bit-for-bit.
    prime_construction: >-
      For a target field_bits b, curve_ordinal k, family f: h =
      int(SHA256(seed(f,"prime",b,k,0,0))), L=2^(b-1), U=2^b, c_0=L+1+
      2*(h mod 2^(b-2)), test c_j=c_0+2j while c_j<U; prime iff >3, odd, no
      odd divisor up to floor(sqrt(c_j)). FOR THE j0 FAMILY ADDITIONALLY
      REQUIRE p = 1 mod 3 (checked directly, not assumed): a j=0 curve
      y^2=x^3+B over p=2 mod 3 is FORCED supersingular for every B, which
      would contaminate the ordinary-vs-ordinary comparison this contract
      declares; candidates failing this congruence are skipped and the
      scan continues. Reaching U is CONSTRUCTION_FAILURE for that (b,k,f);
      no wrapping, no reseeding -- report and exclude, never backfill.
    curve_construction: >-
      For t=0,...,65535: a_t=int(SHA256(seed(f,"curve-a",p,k,0,t))) mod p,
      b_t=int(SHA256(seed(f,"curve-b",p,k,0,t))) mod p; reject if
      (4a_t^3+27b_t^2) mod p=0. For the j0 family: A=0 forced, B=b_t
      (reject B=0); the p=1 mod 3 admission rule above already guarantees
      ordinariness, so NO SEPARATE trace-of-Frobenius check is required
      for j0 (this is a stronger, purely number-theoretic guarantee, not a
      probabilistic one). For the random-ordinary family: A=a_t, B=b_t
      (reject A=0 or B=0, i.e. reject the j=0 and j=1728 loci exactly)
      AND additionally reject if the curve is supersingular (trace of
      Frobenius t_E with t_E = p+1-N; supersingular iff t_E = 0 mod p at
      these sizes, checked directly via `count_E_points`) -- unlike j0,
      "ordinary" is not guaranteed by a congruence alone for a free (A,B)
      pair, so this family DOES need the explicit computed check. Full
      group structure E(F_p)=Z/n1 x Z/n2 computed and recorded for every
      curve.
    factor_base_construction: >-
      Identical rule to EXP-MONO-c819ba/EXP-MONO-670aa6: FB = points P
      with x(P) in the x-coordinate set of the first F values (increasing
      scan order) with (x^3+Ax+B)^((p-1)/2) mod p = 1. Symmetry (-FB=FB)
      CHECKED, not assumed; failure excludes that curve, reported, never
      patched.

  stage_order_and_the_terminating_stage:
    principle: >-
      Cheapest decisive gate first; the null-object gate still comes
      before any real-arm number is read (OBJ-6/EXP-MONO-c819ba's own
      lesson, unchanged), but its statistical power is now verified at
      DESIGN time, not discovered after execution.
    stage_0:
      name: exact-identity sanity gate, reused fixture
      compute: none to seconds
      description: >-
        Re-verify (I1)-(I3) on the SAME frozen fixture cell used by both
        prior EXP-MONO-c819ba and EXP-MONO-670aa6 (p=101, A=1, B=1,
        N=105, F=52), already independently confirmed twice.
      terminates_the_run_if: Either identity fails on the fixture.
    stage_1:
      name: construct the family-keyed 100-curve primary panel
      compute: seconds to low minutes
      description: >-
        Construct every curve under the corrected, family-keyed seed
        rule; record group structure, factor base, symmetry check,
        construction-failure counts, AND the full per-curve construction
        transcript (p, A, B, N, t_used) in the persisted raw-result.json
        -- closing EXP-MONO-670aa6's artifact-completeness gap.
      independence_verification: >-
        BEFORE any Stage-2/3 compute, run the required extraction script
        (see `required_artifacts_if_later_authorized`) comparing (p, B,
        t_used) for every matching curve_ordinal across the two families;
        report the comparison directly in the execution report even
        though the frozen design should make every value differ. Finding
        ANY collision here is a construction-implementation defect,
        report prominently, treat as `failed_infrastructure`.
    stage_2:
      name: MANDATORY NULL-OBJECT GATE, RAW P-VALUES PERSISTED
      compute: minutes (n=20000 draws is the dominant cost; see budget cost_note)
      description: >-
        For every curve, draw 20000 matched-null symmetric subsets
        (label "null-subset") and one null-object-pick draw. Compute BOTH
        the per-curve Holm/Bonferroni family test (families i/ii, Var AND
        C/F pooled per family -- explicit and unambiguous this time, no
        Executor interpretation required) AND the Fisher-combined
        panel-level statistic (a single, m=1, uncorrected test per family
        per statistic, pooling all realized curves' raw p-values). PERSIST
        raw (uncapped) per-curve p-values for BOTH the null-object arm and
        the eventual real arm in raw-result.json.
      terminates_the_run_if: >-
        EITHER the per-curve Holm test OR the Fisher-combined test shows a
        significant result on the null-object arm in either family, at
        alpha=0.05. (Widened from EXP-MONO-670aa6's Holm-only gate,
        because the Fisher-combined statistic is now a co-equal primary
        metric and must be calibrated exactly as strictly as the per-curve
        test.) STOP: report `instrument_still_uncalibrated`, do not
        compute, read, or report any Stage-3 real-arm number.
    stage_3:
      name: real arm and both corrected/combined metrics, gated on Stage 2 passing
      compute: minutes
      description: >-
        Only entered if Stage 2 passes (both tests, both families).
        Compute the real x-coordinate factor base's Var and C/F at m=4,
        F=N/4, per curve, per family. Report BOTH the per-curve
        Holm/Bonferroni result (families iii/iv) AND the Fisher-combined
        panel-level result, side by side, neither privileged over the
        other as this contract's headline. Report the cross-family
        enrichment comparison (Fisher exact on nominal, uncorrected
        per-curve exceedance) as a secondary, non-primary check -- this
        time licensed by a genuinely independent panel.
    stage_4:
      name: EXTENDED dual-path control, sampled beyond the real arm
      compute: seconds to low minutes
      description: >-
        In addition to checking route 1 (direct convolution) against
        route 2 (FFT-derived) on all 100 real-arm cells (as before),
        ALSO run both routes on a declared random sample of >= 200
        null/null-object draws (>=1 per curve, drawn via a fixed,
        pre-declared selection rule: the draw_index congruent to 0 mod
        100 for that curve, so the sample is deterministic and
        reproducible). PERSIST and THRESHOLD (tolerance 1e-6 relative)
        the per-draw route2_max_round_residual and
        route2_max_imag_residual for every sampled draw -- closing
        EXP-MONO-670aa6's discard-diagnostics gap. A threshold breach on
        any sampled draw is `failed_infrastructure`, not evidence.

  arms_and_controls:
    treatment: >-
      REAL ARM. Per curve, per family, at F=N/4, m=4: exact-integer
      convolution, Var_real (ordered; multiset reported per
      dual_convention_control), C_real/F.
    measured_null: >-
      20000 matched-null symmetric subsets per curve, identical size
      F=N/4, SAME curve, SAME m, SAME exhaustive targets, label
      "null-subset". p_curve = (1 + #{null draws at least as extreme}) /
      20001, two-sided, per curve, per family, per statistic.
    null_object_arm: >-
      MANDATORY, GATES EVERYTHING (Stage 2). One additional draw per
      curve, label "null-object-pick", identical generating process,
      tested by BOTH the per-curve Holm test and the Fisher-combined test
      before any real-arm number is read.
    fisher_combined_panel_statistic: >-
      NEW, CO-EQUAL PRIMARY METRIC (not present in EXP-MONO-c819ba or
      EXP-MONO-670aa6). Within each family, pool the k (~49-50) realized
      curves' raw p-values for a single statistic via Fisher's method
      (-2*sum(ln(p_i)) ~ chi2(2k)), separately for Var and C/F, separately
      for the null-object arm (Stage 2, gating) and the real arm (Stage 3,
      reported). This is floor-immune (m=1 per test, no per-test
      correction) and was independently identified by EXP-MONO-670aa6's
      own Red Team review as a genuine, cheap discriminator the prior
      design missed. PRE-REGISTERED HERE, not applied post-hoc.
    legacy_panel_reliance: >-
      NOT RE-RUN. This contract explicitly relies on EXP-MONO-c819ba's
      own subgroup (positive_control_1) and coset-union (positive_control_2)
      results, already independently reviewed and confirmed, for
      H-MONO-663fb4's mandatory nearby-object control. See `inputs.legacy_panel`.
    dual_convention_control: Ordered and multiset counts at every cell, unchanged in design.
    dual_path_control: >-
      EXTENDED per Stage 4 above: all real-arm cells AND a declared,
      deterministic sample of >=200 null/null-object draws, with
      persisted, thresholded (1e-6 relative) residual diagnostics.
    multiplicity_correction: >-
      Holm-Bonferroni, applied SEPARATELY within four declared families,
      EXPLICITLY Var-AND-C/F pooled in every family (removing
      EXP-MONO-670aa6's textual ambiguity that forced an Executor
      interpretive choice): (i) j0-family null-object (k~50 curves x 2
      statistics), (ii) random-ordinary-family null-object (same), (iii)
      j0-family real-arm, (iv) random-ordinary-family real-arm. alpha=0.05
      family-wise. RUN ALONGSIDE, NEVER INSTEAD OF, the Fisher-combined
      statistic above.
    comparability_policy: >-
      No comparison of measured numbers with EXP-MONO-c819ba or
      EXP-MONO-670aa6 is licensed -- distinct domain, distinct seeds,
      distinct (now genuinely independent) panel. The internal
      j0-vs-random-ordinary enrichment test and the two prior experiments'
      OWN enrichment findings may be qualitatively compared as
      replication-stability context (as EV-MONO-849355 already did),
      never as a single pooled statistic.

  metrics:
    primary:
      - "P1 (j0 family, per-curve): Holm/Bonferroni-corrected permutation p-value of Var_real and C/F_real vs the 20000-draw null, per curve, m=4, F=N/4."
      - "P2 (random-ordinary family, per-curve): identical statistic and correction, independently."
      - "P3 (j0 family, Fisher-combined): panel-level combined-probability test, Var and C/F separately, pooling all realized j0 curves."
      - "P4 (random-ordinary family, Fisher-combined): identical, independently."
      - "P5 (null-object gate): P1-P4's identical statistics and tests applied to the null-object arm; MUST show no significant result in EITHER test, EITHER family, for P1-P4 to be interpretable."
      - "P6 (enrichment): Fisher exact test comparing the two families' uncorrected nominal-exceedance rates, licensed this time by a genuinely independent panel."
    secondary:
      - Optional legacy-panel graded controls (F-ladder, m-ladder, prime-ladder) IF the 8-curve sub-panel is additionally constructed; not required for this contract's completion.
      - Realized panel sizes, construction-failure counts, and the independence-verification comparison (Stage 1) per family.
      - Per-curve group structure, N, factor-base digest, symmetry-check result, and full construction transcript (p, A, B, t_used).
      - Extended dual-path sample residual diagnostics (Stage 4).

  preregistered_prediction:
    - quantity: P5 (null-object gate, both tests)
      value: no significant result in either test, either family
      formula: >-
        By construction the null-object arm has no real effect. Unlike
        EXP-MONO-670aa6, this is not merely EXPECTED but VERIFIED
        achievable at the declared (n, m, alpha): the per-curve test's
        floor (1/20001) sits 10x below its tightest threshold, and the
        Fisher-combined test has no floor at all (continuous chi-squared
        statistic), so both tests can, in principle, fire on real
        signal -- confirming they do NOT fire on the null-object arm is a
        genuine, non-tautological calibration check this time.
      source: KN-TECH-95a42b; EV-MONO-849355.
    - quantity: P1-P4 (real arm, both tests, both families)
      value: >-
        TWO-SIDED, GENUINELY OPEN: zero/few significant results in both
        tests is the controlled-null outcome; a significant,
        family-consistent, ENRICHMENT-CONSISTENT result in one family
        (either test) is the exceptional-locus outcome. Either is a
        first-class deliverable, and this time either can ACTUALLY be
        observed rather than being precluded by the design.
      source: H-MONO-663fb4 K3/K4, retested under a design-time-verified instrument.
    - quantity: P6 (enrichment)
      value: >-
        NOT pre-registered in a direction. EXP-MONO-670aa6's own (panel-
        correlated) reading showed j0 rate >= random-ordinary rate in
        both its runs (opposite the original Red Team's 12.1%-vs-20.0%
        finding); whether that reverses, persists, or vanishes under a
        genuinely independent panel is exactly what this metric tests.
      source: EV-MONO-849355; EV-MONO-b84b24.

  replication:
    planned_runs: 2
    seeds: [20260901, 20260902]
    interpretation: >-
      Two runs at different master seeds. Because `master_seed` now
      enters the seed preimage for EVERY draw including panel
      construction (fixing EXP-MONO-670aa6's own latent defect), these
      two runs draw GENUINELY DIFFERENT curve panels, not merely
      different null populations on a shared panel. Both must
      independently pass Stage 2's gate before either's Stage 3 output is
      read.

  budget:
    maximum_runs: 2
    maximum_wall_seconds: 7200
    maximum_cpu_seconds: 14400
    maximum_peak_rss_bytes: 4294967296
    maximum_total_disk_bytes: 4294967296
    maximum_workers: 1
    no_network: true
    cost_note: >-
      Dominant cost is null-draw generation: 100 curves x 20000 draws x 2
      (null-subset + eventual null-object check reuses the same
      population) ~= 2,000,000 draws per run, versus EXP-MONO-670aa6's
      ~20,100 -- roughly a 100x increase. EXP-MONO-670aa6 completed in
      ~7.1s wall-clock; a linear scale-up projects ~710s per run,
      comfortably inside the 7200s ceiling, but this is a projection, not
      a measurement -- if wall-clock trends past ~3000s with no end in
      sight, STOP and report as an infrastructure/budget signal rather
      than let it run to a timeout. Memory ceiling raised to 4GB
      (from 2GB) as a precaution for the larger null-draw arrays; report
      actual peak_rss regardless.

  environment_preconditions:
    consequence: NO CAS AND NO SOLVER IS REQUIRED, unchanged from both predecessors.
    if_a_precondition_fails: >-
      A missing interpreter, a failed symmetry check, a curve-construction
      shortfall, or an independence-verification collision (Stage 1) is
      `failed_infrastructure`, reported as infrastructure signal, NEVER
      negative mathematical evidence (AGENTS.md rule 3).

  infrastructure_failure_disposition: >-
    Any timeout, crash, memory-cap breach, construction failure,
    independence-verification collision, or dual-path/residual-threshold
    breach is recorded with its exact cause and classified
    `failed_infrastructure` or `invalid`. Supports and weakens NOTHING
    about H-MONO-663fb4 or the ECDLP.

  stopping_rules:
    - Do not execute unless separately reviewed, approved, frozen and authorized. (Satisfied here.)
    - Stop at Stage 0 if either reused identity fails on the fixture.
    - >-
      Stop at Stage 1 if the independence-verification script finds ANY
      (p, B, t_used) collision between matched curve_ordinals across
      families -- this would mean the family-keying fix itself has a
      bug, report prominently as `failed_infrastructure`.
    - >-
      STOP AT STAGE 2 (HARD) if EITHER the per-curve Holm test OR the
      Fisher-combined test shows a significant null-object result in
      either family. No Stage 3/4 output may be computed, read, or
      reported if this triggers.
    - Stop on any dual-path residual-diagnostic threshold breach (Stage 4), reporting as infrastructure signal.
    - Stop on any budget breach (see cost_note's early-warning guidance), reporting it as infrastructure signal.

  invalidation_rules:
    - Any execution while frozen, execution_authorized or evidence_eligible is false.
    - Any missing construction record, factor-base digest, symmetry check, seed record, manifest, or per-curve construction transcript.
    - Any run manifest lacking field_bits.
    - Any cell reporting one convention only.
    - Any cell whose targets were sampled rather than exhaustively enumerated.
    - Any real-arm p-value (per-curve OR Fisher-combined) read, computed, or reported before Stage 2's gate has passed in both tests, both families.
    - Any Stage-2 per-curve raw p-value NOT persisted (this contract requires it explicitly; a repeat of EXP-MONO-670aa6's retention gap is itself an invalidating omission here).
    - >-
      Any post-hoc change to null_draws_per_cell, the correction method,
      alpha, the declared families, or the Fisher-combined statistic's
      definition after any Stage-2 or Stage-3 number has been observed.
      Requires a versioned protocol amendment marked exploratory_only,
      never a silent edit -- and per `provenance_note` above, an
      unauthorized edit to this file after this point is disclosed via a
      correction record, never silently trusted.

  success_criterion: >-
    A run is well-formed evidence (regardless of which direction P1-P6
    come out) if: Stage 0 passes; Stage 1's independence-verification
    finds zero cross-family collisions; the primary panel realizes at
    least 40 curves per family; Stage 2's gate passes (both tests, both
    families, both seeds); P1-P6 are reported with exact values, both
    conventions; Stage 4's extended dual-path sample shows no threshold
    breach. THAT DISPOSITION SUPPORTS EXACTLY the scoped statement in
    claim_ceiling and nothing more.

  falsification_criterion: >-
    Any of: (a) Stage 0 identity failing; (b) Stage 1 finding a
    cross-family collision (instrument-construction defect, not evidence);
    (c) Stage 2's gate failing in either test or family
    (instrument_still_uncalibrated, not evidence about H-MONO-663fb4 --
    though this time it would itself be a significant, surprising finding
    given the design-time verification, worth escalating prominently);
    (d) a significant result (per-curve Holm OR Fisher-combined) appearing
    in ONE family's real arm but not the other, WITH Stage 2 clean in
    both -- this falsifies the pre-registered "no exceptional locus
    anywhere" default and is escalated to independent review; (e) P6's
    enrichment direction disagreeing with either prior experiment's own
    reading, itself a reportable replication-stability finding.

  outcomes:
    no_execution_authorization: Not applicable; authorized as of this Coordinator approval.
    controlled_null_confirmed_at_verified_power: >-
      Stage 2 clean; P1-P4 show no (or statistically expected few)
      significant results in either test, either family. This time the
      "no signal" reading is backed by a design-time-verified-powered
      instrument, not a guaranteed non-result -- the relation-rate
      statement KN-OPEN-009 wanted, finally tested by an instrument that
      could have found something and did not.
    exceptional_locus_found: >-
      Stage 2 clean; one family shows a significant, enrichment-consistent
      signal (either test) the other does not. Escalated to independent
      review-adversarial.
    instrument_still_uncalibrated_despite_design_time_verification: >-
      Stage 2 fails even at n=20000 with a Fisher-combined co-metric. This
      would be a highly significant, surprising finding given the
      arithmetic verification performed at approval -- report prominently
      and treat as an urgent methodological priority, not a routine
      instrument-failure footnote.
    infrastructure_or_integrity_failure: See infrastructure_failure_disposition. Never mathematical evidence.

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_do_not: >-
      Unchanged from both predecessors: identities are scale-free and
      hold by derivation; measured quantities (C/F, Var ratios) at p~10^3
      do not transfer to cryptographic scale. Nothing here addresses
      F_{q^n} or charges the linear-algebra stage.

  required_artifacts_if_later_authorized:
    - Frozen approved specification with a freeze receipt binding its SHA-256.
    - Stage-0 fixture reproduction.
    - >-
      PRE-APPROVAL independence-verification script output: direct
      extraction and comparison of (p, B, t_used) for every matching
      curve_ordinal across the two families, confirming zero collisions,
      run against the frozen (not yet executed) implementation before
      the Executor is dispatched to run full Stage 2/3.
    - Full per-curve construction transcript (p, A, B, N, group structure, factor-base digest, symmetry check, t_used) for every primary-panel curve, persisted in raw-result.json.
    - RAW (uncapped) per-curve p-values for BOTH the null-object arm and the real arm, both statistics, both families, persisted in raw-result.json.
    - Holm/Bonferroni-corrected AND Fisher-combined result tables for all declared families.
    - Extended dual-path sample (>=200 null/null-object draws) with persisted, thresholded residual diagnostics.
    - Run manifests carrying field_bits, git commit, dirty-tree state, environment, resolved model identifier and probe status.
    - Command, stdout, stderr, timings, peak RSS, and an execution report.
    - Snapshot archive followed by independent validation and red-team review.

  approval_requirements:
    - >-
      This contract IS the Coordinator-named next_action of
      DEC-20260831-a4b23f; the design-time floor-vs-threshold check and
      the family-discriminator code-inspection check named there are both
      PERFORMED in this contract's own text above, not merely required of
      a future reviewer.
    - >-
      Independent review confirms the pre-approval independence-
      verification script's output before execution is dispatched (i.e.
      the check happens on the frozen implementation BEFORE the Executor
      runs Stage 2/3, not only after, per `stage_1`'s own text).
    - >-
      Independent review confirms the Fisher-combined statistic's
      definition (formula, family pooling, gating role) is fixed in this
      frozen text and is not adjustable post-hoc.

