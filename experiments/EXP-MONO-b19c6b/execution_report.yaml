  stage_1_family_keyed_panel_and_independence_verification:
    reported_before_any_stage_2_3_compute: true
    independence_verification:
      collision_definition_used: >-
        Full-tuple (p, B, t_used) match between the two families at a given
        curve_ordinal (see implementation.md's disclosed interpretation
        note: single-field coincidences, especially t_used, occur by
        chance under correct independent family-keying and are NOT
        themselves collisions).
      run_1: {n_matched_curve_ordinals_compared: 45, n_collisions: 0, zero_collisions: true}
      run_2: {n_matched_curve_ordinals_compared: 48, n_collisions: 0, zero_collisions: true}
    realized_panel_sizes_after_fb_construction:
      run_1: {j0: 45, random_ordinary: 48}
      run_2: {j0: 48, random_ordinary: 49}
      floor_met: "both runs, both families >= 40 (success_criterion floor)"
    construction_failures:
      run_1:
        j0_prime_exhausted: 4
        random_ordinary_prime_exhausted: 0
        j0_fb_coordinate_map_collision: 1
        random_ordinary_fb_coordinate_map_collision: 2
      run_2:
        j0_prime_exhausted: 1
        random_ordinary_prime_exhausted: 1
        j0_fb_coordinate_map_collision: 1
        random_ordinary_fb_coordinate_map_collision: 0
      disposition: >-
        All reported per curve_ordinal in raw-result.json
        (primary_panel_construction.construction_failures,
        primary_panel_fb_construction_failures); none backfilled, per the
        handoff's explicit instruction.
    j0_p_equiv_1_mod_3_admission_check:
      run_1: {n_curves: 45, n_violations: 0, all_admitted_correctly: true}
      run_2: {n_curves: 48, n_violations: 0, all_admitted_correctly: true}
    random_ordinary_supersingularity_check:
      run_1: {n_curves: 48, n_leaked_supersingular: 0, all_ordinary: true}
      run_2: {n_curves: 49, n_leaked_supersingular: 0, all_ordinary: true}
    curves_realized_are_genuinely_different_between_runs: >-
      Confirmed by direct extraction: of 45 matched j0 curve_ordinals
      between run 1 and run 2, only 5 happened to draw the same prime by
      chance (small prime pool at low field_bits); the panels are NOT
      identical, as expected once master_seed enters panel construction.

  stage_2_dual_test_null_object_gate:
    headline_result: BOTH RUNS PASSED, BOTH TESTS, BOTH FAMILIES.
    gating_rule: >-
      Per-curve Holm/Bonferroni (Var-AND-C/F pooled per family, up to
      ~100 tests) AND Fisher-combined (computed separately for Var and for
      C/F, per family) must BOTH show no significant result, in BOTH
      families, for the gate to pass. Any failure in either test, either
      family, would have hard-stopped the run before any Stage-3 number was
      computed, read, or reported (structurally enforced -- Stage-3 code is
      never reached unless stage2_gate_pass is True for both families).
    run_1:
      stage2_gate_pass: true
      j0:
        holm_n_significant_of_90_tests: 0
        fisher_combined_var: {statistic: 79.394102635072, df: 90, combined_p: 0.780438148323888, significant: false}
        fisher_combined_cf: {statistic: 81.62605992653884, df: 90, combined_p: 0.7239197631637523, significant: false}
      random_ordinary:
        holm_n_significant_of_96_tests: 0
        fisher_combined_var: {statistic: 97.11690998773891, df: 96, combined_p: 0.44892192142493925, significant: false}
        fisher_combined_cf: {statistic: 97.78076736411653, df: 96, combined_p: 0.43022855975456314, significant: false}
    run_2:
      stage2_gate_pass: true
      j0:
        holm_n_significant_of_96_tests: 0
        fisher_combined_var: {statistic: 96.23827696183653, df: 96, combined_p: 0.4739642091192113, significant: false}
        fisher_combined_cf: {statistic: 88.17379428042393, df: 96, combined_p: 0.7027959157087365, significant: false}
      random_ordinary:
        holm_n_significant_of_98_tests: 0
        fisher_combined_var: {statistic: 88.38700925332616, df: 98, combined_p: 0.7461521354245729, significant: false}
        fisher_combined_cf: {statistic: 92.81249995005882, df: 98, combined_p: 0.6290838812612259, significant: false}
    raw_pvalues_persisted: >-
      RAW (uncapped) per-curve p-values for both statistics (Var, C/F), both
      families, for BOTH the null-object arm and the real arm, are
      persisted in each run's raw-result.json under
      stage2_per_curve_raw_pvalues / stage3_per_curve_raw_pvalues. The
      full 20,000-draw null population arrays themselves are NOT persisted
      (disclosed scope decision, see implementation.md); only the
      resulting raw p-values, which are the contract's own required
      artifact, are.
    design_time_power_check_outcome: >-
      This gate passing at n=20000 (floor 1/20001, 10x below the tightest
      Holm threshold 0.0005, per the frozen contract's own design-time
      arithmetic) and at a continuous, floor-immune Fisher-combined
      statistic is the "no false positive" reading the design-time check
      predicted was achievable. This is an observation, not a validation of
      the design-time arithmetic as a general method.

