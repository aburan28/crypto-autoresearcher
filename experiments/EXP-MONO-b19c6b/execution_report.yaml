  stage_0_fixture_gate:
    both_runs: pass
    detail: >-
      Same frozen fixture cell (p=101, A=1, B=1, N=105, F=52) as
      EXP-MONO-c819ba/EXP-MONO-670aa6. Both runs: m1 exact match true,
      m2 additive-quadruple and variance-identity relative residuals
