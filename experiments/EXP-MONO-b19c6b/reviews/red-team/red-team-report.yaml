red_team_report:
  id: RT-20260831-b19c6b
  task_id: red-team-mono-b19c6b
  experiment_id: EXP-MONO-b19c6b
  hypothesis_id: H-MONO-663fb4
  role: red-team
  joint: J2-adversarial

  review_plan_copy: >-
    Prior (Coordinator): EXP-MONO-b19c6b -- the THIRD consecutive attempt at
    H-MONO-663fb4's K3/K4 question -- finally has a sound instrument: a
    design-time-verified n=20000 draw count giving real statistical power, a
    genuinely independent two-family panel (family-keyed seed derivation,
    verified via a mandatory pre-Stage-2 independence check finding zero
    collisions), a clean dual-test (Holm + Fisher-combined) null-object gate
    pass in both tests/families/seeds, and a real-arm result showing no
    significant deviation anywhere -- i.e. a genuine (not tautological, not
    confounded) "controlled null confirmed" reading. The Coordinator also
    disclosed (CORR-20260831-d663e0) that an out-of-band commit correctly
    found an alpha-inflation issue in the Stage-2 gate's composite 6-test
    definition but verified it is empirically inconsequential here. TASK:
    attack all of this -- find the strongest case that any part of this
    disposition is wrong. Joint J2-adversarial: find defects the Coordinator
    missed, check whether "controlled null confirmed" is actually earned by
    this data, and attack the alpha-inflation "inconsequential" claim
    specifically -- six uncorrected tests at nominal 0.05 has a ~26.5%
    false-CLEAR-pass rate too (not just a false-stop rate) worth checking:
    does relaxing to a wider effective alpha change whether the observed
    statistics would have been "significant enough to worry about" under a
    more suspicious reading? Blindness: dispatched fresh and concurrently
    with an independent Validator session; do not read
    experiments/EXP-MONO-b19c6b/reviews/validator/ or any validator-labeled
    path. Proves-too-much / cross-lane check: does anything about this
    experiment's own design or result retroactively change how
    EXP-MONO-c819ba's or EXP-MONO-670aa6's dispositions should be read?
    Given three consecutive experiments have now failed-or-passed-cleanly in
    three different specific ways, is there a pattern across all three worth
    naming explicitly?

  snapshot_reviewed:
    commit_sha: cd9e446679a39a56095ec7c800566213dea31c51
    receipt: coordination/tasks/TASK-20260831-5088b1/snapshot-receipt.json
    design_snapshot_commit_run_was_executed_against: 7d10489bf171a93c62bd526a91286bbea538f247
    out_of_band_edit_disclosed: 16c7432aa0328666fd88ba8370946a39942805d3 (CORR-20260831-d663e0)
    content_verification: >-
      Confirmed HEAD == cd9e446679a39a56095ec7c800566213dea31c51 via
      `git rev-parse HEAD`; confirmed the receipt's parent_sha (5a8653c47)
      matches `git log --oneline -5`, and that commit cd9e44667 (`git show
      --stat`) touches exactly the archive_artifact_paths declared in the
      snapshot receipt. Pulled the AS-EXECUTED specification.yaml text via
      `git show 7d10489bf171a93c62bd526a91286bbea538f247:experiments/EXP-MONO-b19c6b/specification.yaml`
      (not the current on-disk, post-16c7432aa text) and read every review
      finding, quoted number, and audit against THAT text, per the task's
      explicit instruction. Diffed line counts (635 vs 656 lines) confirming
      the on-disk text genuinely differs from what was executed.

  claim_under_review: >-
    The Coordinator's snapshot headline and CORR-20260831-d663e0: (1)
    EXP-MONO-b19c6b's instrument is, for the first time in this lane,
    genuinely powered (design-time floor 1/20001 sits 10x below the
    tightest Holm threshold) and genuinely independent (family-keyed seed
    derivation, zero full-triple collisions in Stage 1, on both runs); (2)
    Stage 2's dual-test (Holm + Fisher-combined) null-object gate passed
    cleanly in both tests, both families, both seeds; (3) Stage 3's real
    arm (P1-P6) shows no significant result anywhere, supporting a genuine
    "controlled_null_confirmed_at_verified_power" reading; (4) a
    thirteenth out-of-band commit correctly found a real alpha-inflation
    defect in Stage 2's composite 6-test gate definition (1-(0.95)^6 ~=
    26.5% true false-stop rate per seed, not 5%), independently verified
    mathematically and checked against the archived data as
    "empirically inconsequential" because every one of the 8 relevant
    statistics is far from both the 0.05 and 0.05/6 thresholds.

  verdict: holds_with_findings_that_confirm_and_meaningfully_qualify_the_disposition
  joint_verdicts:
    is_controlled_null_confirmed_actually_earned: >-
      YES, MORE ROBUSTLY THAN A CASUAL READ OF THE SUMMARY SUGGESTS, WITH
      TWO NAMED GAPS. I extracted and audited all 760 raw per-curve
      p-values directly (not the Holm/Fisher summaries) across both stages
      (null-object, real-arm), both statistics (Var, C/F), both families,
      both runs. Only 27/760 (3.55%) fall below the nominal 0.05 threshold
      -- BELOW the 38/760 (5.00%) a perfectly-calibrated null instrument
      would produce in expectation, not above it. This is an independent,
      non-corrected line of evidence the archived record does not itself
      report, and it points the same direction as the Holm/Fisher
      summaries: no excess of nominally-interesting results anywhere,
      which is exactly what "controlled null confirmed" should look like
      under a suspicious re-reading, not merely under the contract's own
      corrected statistics. See OBJ-1 for the minimum p-values found (none
      near any Holm threshold) and the one exploratory pattern this audit
      surfaced (field_bits=9), which I additionally null-object-controlled
      myself and found is NOT specific to the real arm -- see OBJ-1's
      second half. The two qualifications that keep this from being an
      unconditional "yes": (a) the co-equal Fisher-combined primary metric
      has never been positive-control-tested against any known-exceptional
      case anywhere in this three-experiment lane (OBJ-5); (b) the
      composite-gate alpha-inflation issue means the binary "Stage 2
      passed" event, taken alone and divorced from the raw p-value
      magnitudes, is weaker evidence of calibration than a naive reading
      would suggest (OBJ-2).
    alpha_inflation_inconsequential_claim: >-
      CORR-20260831-d663e0's ARITHMETIC AND ITS CHECK AGAINST THE ARCHIVED
      DATA ARE BOTH CORRECT, INDEPENDENTLY RE-DERIVED AND CONFIRMED HERE --
      but its "empirically inconsequential" framing needs the sharpening in
      OBJ-2: passing the flawed composite gate on BOTH seeds was, a priori,
      only a ~54% likely outcome even under a perfectly calibrated
      instrument (not the near-certain outcome "gate passed" superficially
      suggests), so the bare pass/fail event carries materially less
      evidentiary weight about calibration than its face value implies.
      This does not overturn CORR-20260831-d663e0's narrower, correctly
      scoped claim (that the specific numbers observed are nowhere near
      either the 0.05 or 0.05/6 threshold, verified independently here
      too), but it does mean any future reader should not cite "Stage 2
      passed cleanly" by itself as strong evidence of calibration -- the
      actual evidentiary weight rests on the raw p-value magnitudes (OBJ-1)
      and the arithmetic floor argument (KN-TECH-95a42b), not on the binary
      gate-pass event.
    family_independence_verified_not_trusted: >-
      CONFIRMED: zero full-triple (p,B,t_used) collisions in either run,
      independently re-derived from raw-result.json's own comparison
      records and from re-reading panel_primary.py/curve.py/controls.py/
      seed.py directly (family is threaded through all five declared
      labels: "prime","curve-a","curve-b","null-subset","null-object-pick").
      ONE UNDISCLOSED, MINOR RESIDUAL FOUND: partial (prime-only, not
      full-triple) collisions occur in 3/46 (run 1) and 3/48 (run 2) of
      matched curve_ordinals -- the j0 and random-ordinary curve at that
      ordinal happen to share the SAME PRIME (B and t_used differ). This is
      expected sampling behaviour given a small prime pool at 7-11 bit
      field sizes, not a seed-derivation bug (the same reasoning
      implementation.md already gives for t_used coincidences), but it was
      never surfaced anywhere in the prose -- only the full-triple
      definition is reported. See OBJ-3.
    admission_rules_verified_directly: >-
      CONFIRMED BY DIRECT EXTRACTION FROM raw-result.json, NOT BY TRUSTING
      THE EXECUTION REPORT: 100% of realized j0 curves (45/45, 48/48
      across the two runs) satisfy p = 1 (mod 3); 0/48 and 0/49
      random-ordinary curves are supersingular by the trace-of-Frobenius
      check (t_E mod p == 0), independently recomputed by me from the
      persisted (p, N) pairs, not merely read off the `computed_supersingular`
      flag. curve.py's admission logic matches this exactly (j0 admission
      rechecked directly in panel_primary.py, plus a defensive assert that
      no j0 curve is ever computed-supersingular). No violation found.
    inherited_defects_and_whats_still_different: >-
      master_seed genuinely produces different panels across runs,
      independently confirmed: only 5/43 (j0) and 5/47 (random-ordinary)
      matched curve_ordinals share a prime ACROSS runs (small-prime-pool
      coincidence, exactly analogous to the within-run partial collisions
      above), fixing EXP-MONO-670aa6's total shared-panel defect. The
      legacy-panel-optional decision is transparently disclosed in the
      frozen text and is defensible as scoped (it relies on
      EXP-MONO-c819ba's own already-reviewed subgroup/coset-union result
      for conv.py, the reused component K5 actually exercises -- see
      reduction_and_scope_challenges). ONE DEFECT DID RECUR IN A NEW FORM:
      Stage 4's "extended dual-path control," meant to close
      EXP-MONO-670aa6's own validation-coverage gap (route 2 alone computing
      >99.5% of the null-draw arithmetic with route 1 never checking it),
      is satisfied via a literal-minimal interpretation that reintroduces a
      narrower version of the SAME gap -- see OBJ-4.
    genuinely_new_defect: >-
      The mandatory K5 nearby-object/positive control (H-MONO-663fb4's own
      proof_search_map.method_ceiling.nearby_object_control: "any
      instrument that cannot reproduce N/h-1 exactly cannot detect an
      exceptional factor base at all") has NEVER been re-exercised against
      the Fisher-combined statistic anywhere in this three-experiment lane
      -- see OBJ-5, the strongest new finding in this review.

  objections:
    - id: OBJ-1
      severity: independent_line_of_evidence_supporting_the_disposition_plus_one_controlled_exploratory_pattern
      target: >-
        Task item 1 -- pull the raw per-curve p-values directly and check
        whether the Holm/Fisher-combined summaries mask a near-boundary
        result.
      what_i_did: >-
        Loaded both runs' raw-result.json and extracted every
        stage2_per_curve_raw_pvalues / stage3_per_curve_raw_pvalues entry
        (both families, both statistics, both stages, both runs): 760
        total raw p-values (380 curve-arm-stage cells x 2 statistics). Note:
        p_var_raw and p_cf_raw are strongly correlated within a cell
        (Spearman rho=0.727, p=1e-63, independently computed), so the
        EFFECTIVE independent-test count is closer to 380 than 760 --
        worth naming since the raw 760 figure overstates independence if
        cited elsewhere.
      results: >-
        27/760 (3.55%) below nominal 0.05 -- BELOW the 38/760 (5.00%)
        expected under a perfectly calibrated null, not above it. Minimum
        p-value found anywhere: 0.0062 (j0, ordinal 33, C/F, stage 2, run
        1) -- three orders of magnitude above the tightest Holm threshold
        (alpha/98 ~= 0.00051) and nowhere near a corrected-significant
        reading. No p-value anywhere approaches the design's own floor
        (1/20001 ~= 0.00005). The Holm/Fisher-combined summaries are NOT
        masking a near-miss.
      the_one_exploratory_pattern_found_and_its_own_null_object_control: >-
        Among the 27 nominally-low p-values, field_bits=9 (256-511-bit
        primes) is enriched: 10/152 (6.58%) vs a 3.55% pooled baseline,
        Fisher exact p=0.045 (does NOT survive Bonferroni over the 5
        field_bits categories tested post-hoc, threshold 0.01). I THEN
        SPLIT THIS BY STAGE, applying the inventor protocol's own
        "controls before belief" discipline to my own finding: field_bits=9
        enrichment appears in BOTH the null-object arm (5.26% vs ~2.9%
        baseline, Fisher p=0.24, NOT significant) AND the real arm (7.89%
        vs ~4.2% baseline, Fisher p=0.10, NOT significant) at COMPARABLE
        magnitude. Because the null-object arm has NO real effect by
        construction and shows a similarly elevated rate, this pattern
        reads as (at most) a mild, benign texture in the permutation
        test's per-cell noise at that particular group-size range -- NOT
        evidence of a real deviation specific to the real x-coordinate
        factor base. Reported as informative context only, exactly per
        this lane's own established treatment of exploratory findings
        (KN-TECH-7745e6/95a42b addenda), explicitly not evidence toward
        H-MONO-663fb4's status and changing nothing here.
      independent_computations_performed: >-
        Loaded raw-result.json for both runs directly; computed baseline
        and p<0.05 counts per field_bits bucket per stage; computed Fisher
        exact tests (scipy.stats.fisher_exact) and a Spearman correlation
        (scipy.stats.spearmanr) between p_var_raw and p_cf_raw.

    - id: OBJ-2
      severity: sharpens_but_does_not_overturn_the_coordinators_inconsequential_finding
      target: >-
        Task item 2 -- attack the alpha-inflation "empirically
        inconsequential" claim by checking whether it changes how
        confidently "Stage 2 passed" should be read as "the instrument is
        calibrated."
      what_i_verified_independently: >-
        Re-derived 1-(0.95)^6 = 0.2649081... from first principles before
        reading CORR-20260831-d663e0's own number -- matches its "~=26.5%"
        claim exactly. Then computed the quantity the correction record
        does NOT compute: P(pass all 6 tests, one seed, well-calibrated) =
        (0.95)^6 = 0.735092; P(pass all 6 on BOTH seeds, well-calibrated,
        seeds independent since master_seed genuinely varies the panel and
        null draws) = 0.735092^2 = 0.540360. Under the CORRECTED
        alpha/6=0.00833 reading, this rises to 0.951030 per seed / 0.904458
        both seeds.
      the_sharpening: >-
        A well-calibrated instrument had only a ~54.0% (not a comfortable
        ~90%+) a priori chance of passing the DECLARED (uncorrected) gate
        on both seeds -- i.e. there was a ~46% chance a perfectly-calibrated
        instrument would have tripped a false stop on at least one seed
        under the flawed design. The observed clean pass on both seeds is
        therefore the MAJORITY-LIKELY outcome even under good calibration,
        not a rare, hard-to-clear bar that only a genuinely well-calibrated
        instrument could have passed -- so the bare pass/fail EVENT is
        LESS informative about calibration than a naive reader (who might
        assume "passed a 5%-level check" implies ~95% confidence per test,
        compounded across 6) would conclude. This is a real qualification
        CORR-20260831-d663e0 does not state, though it is a
        strictly-narrower point than the correction's own (which asks
        "does this change the interpretation of the specific numbers,"
        answered correctly there as no).
      checked_the_reviews_own_specific_ask: >-
        Does relaxing to the wider (original, uncorrected) alpha=0.05
        effective threshold change whether the observed statistics would
        have been significant under a more suspicious reading? NO,
        independently re-verified against the archived execution_report.yaml
        and raw-result.json directly: minimum Fisher-combined p-value
        across all 8 Stage-2 checks is 0.4302 (RO, C/F, run 1), and every
        Holm test reports 0/90-100 significant with the minimum raw
        per-curve p-value (0.0062, OBJ-1) still ~12x the LOOSEST
        stage-2-gate Holm threshold (alpha/49 ~= 0.00102). Nothing here is
        borderline under either reading; the "empirically inconsequential"
        characterization of the SPECIFIC data is correct.
      required_correction_for_future_readers: >-
        Any future citation of this run should say "Stage 2 passed cleanly,
        with every statistic 40x-800x above its threshold under either
        alpha reading" (informative) rather than merely "Stage 2 passed"
        (which, given the composite-gate defect, would have been the
        expected outcome roughly half the time regardless of calibration
        quality, and should not be over-read as a strong calibration
        attestation on its own).

    - id: OBJ-3
      severity: minor_undisclosed_but_benign_residual
      target: >-
        Task item 3 -- re-run or directly inspect the panel construction
        code to independently confirm zero cross-family collisions, and
        that `family` genuinely enters every relevant seed call site.
      what_i_verified_independently: >-
        Read seed.py, curve.py, controls.py, panel_primary.py directly.
        `family` is threaded through seed_int/Drawer's signature and
        appears in every one of the five declared labels ("prime",
        "curve-a", "curve-b" in curve.py/panel_primary.py; "null-subset",
        "null-object-pick" in controls.py's draw_symmetric_subset). This
        matches the frozen text's own claim exactly, unlike
        EXP-MONO-670aa6 where only 2 of 5 call sites carried it.
        Independently extracted stage1_independence_verification's
        `comparisons` array from both runs' raw-result.json and recomputed
        p_collision/B_collision/t_used_collision/full_triple_collision
        counts myself: 46 (run1) / 48 (run2) matched ordinals, 0 full-triple
        collisions in either run -- matches the archived "zero_collisions:
        true" exactly.
      the_undisclosed_residual: >-
        3/46 (run 1) and 3/48 (run 2) matched ordinals DO share the same
        prime between the j0 and random-ordinary curve (B and t_used
        differ, so no full-triple collision) -- an expected consequence of
        a small prime pool at 7-11 bit field sizes (the same reasoning
        implementation.md already gives for the much more common t_used
        coincidence, 43-45 of 46-48 ordinals), but this specific prime-only
        rate is never stated anywhere in the archived prose, only the
        full-triple definition and count are reported. This is benign
        (B_collision=0 in every case, so the two curves at a shared-prime
        ordinal are still genuinely distinct objects) but worth naming as a
        documentation-completeness gap, not a seed-derivation defect.

    - id: OBJ-4
      severity: recurring_validation_coverage_gap_relocated_not_closed
      target: >-
        Task item 5/6 -- whether a defect from EXP-MONO-670aa6 (the
        dual-path check covering only the 100 real-arm cells, with route 2
        alone computing the >20,000-draw null population and its own
        residual diagnostics discarded) recurs here in a new form.
      what_i_verified_independently: >-
        Read run_experiment.py's Stage-4 code directly (lines ~564-620):
        `stage4_extended_dual_path_sample`'s selection rule is literally
        "null-subset draw_index in {0,100} plus the curve's null-object-pick
        draw" -- i.e. exactly TWO within-curve draw-index positions (0 and
        100) out of the up-to-200 positions a literal reading of the
        frozen text's own selection rule ("the draw_index congruent to 0
        mod 100 for that curve") would sample (every index in {0, 100,
        200, ..., 19900}). implementation.md discloses this choice and its
        rationale (avoiding ~19,400 extra comparisons), and the archived
        n_samples (279, 291) do exceed the declared ">=200" floor -- but
        only by multiplying a THIN per-curve slice (indices 0 and 100 only,
        i.e. the very FIRST 100-500 of each curve's 20,000-draw null
        population) across ~97-98 curves, not by sampling breadth WITHIN
        any one curve's full null-draw range.
      the_finding: >-
        This satisfies the declared numeric floor (">=200 samples") while
        leaving >99% of each curve's null-draw INDEX RANGE (indices
        200-19999) completely unchecked by route 1 in this run -- the same
        underlying gap EXP-MONO-670aa6's Red Team named (route 2 alone
        computing the bulk of the null population, diagnostics discarded),
        now closed in name (persisted, thresholded diagnostics exist) but
        reopened in substance (the swept range is a narrow, fixed prefix,
        not a representative sample of the full range). Given that every
        check performed anywhere in this lane -- the 100/93-97 real-arm
        cells here, the 120-draw supplementary spot-check the prior Red
        Team ran on EXP-MONO-670aa6, and this run's own {0,100} sample --
        has found EXACT route1/route2 agreement (0.0 relative residual),
        the practical risk is assessed as low, but the coverage claim
        should not be read as "the null-draw arithmetic across the full
        range was spot-checked" -- it was spot-checked only at its very
        start, identically for every curve.
      required_control_for_any_successor: >-
        If a Stage-4-style extended dual-path control is used again, draw
        the sampled indices via the SAME seeded rejection-sampling Drawer
        used elsewhere in this contract (uniformly across [0, n_null_draws)
        per curve, not a small fixed prefix), so the swept range is
        representative rather than positionally biased toward the start of
        each curve's draw sequence.

    - id: OBJ-5
      severity: genuinely_new_finding_this_review_the_strongest_one_here
      target: >-
        Task item 6 -- hunt for a genuinely new, previously-undiscovered
        defect. Also bears on task item 1's "is controlled_null_confirmed
        earned."
      the_gap: >-
        H-MONO-663fb4's own proof_search_map.method_ceiling.nearby_object_control
        is explicit and MANDATORY: "any instrument that cannot reproduce
        N/h - 1 exactly cannot detect an exceptional factor base at all,"
        and metric K5 requires this be checked "before any other arm is
        interpreted." This contract's `inputs.legacy_panel` explicitly
        relies on EXP-MONO-c819ba's own already-reviewed subgroup/
        coset-union result rather than re-running it, on the reasoning that
        the CONVOLUTION ENGINE (conv.py) is reused verbatim and was
        independently confirmed correct by two prior review rounds. That
        reliance is defensible for the per-curve Var_R N_m(R) computation
        specifically, because K5 exercises exactly that computation and
        conv.py has not changed since it was validated. BUT this contract
        ALSO introduces the Fisher-combined statistic (P3/P4, gating via
        P5) as a CO-EQUAL primary metric for the first time in this lane --
        and NO run, in any of the three experiments in this lane, has EVER
        applied Fisher's method to a known-exceptional case (a subgroup
        factor base, a coset-union factor base, or any other positive
        control). The mandatory nearby-object control was therefore
        discharged for the per-curve Holm/permutation half of Stage 2/3,
        but never for the Fisher-combined half that this contract elevates
        to equal standing -- despite the frozen text's own approval
        rationale point 3 describing the Fisher-combined statistic as
        existing specifically "so a true effect too small to survive
        per-curve FWER correction is not silently discarded."
      what_i_did_about_it: >-
        Cross-checked stats.py's chi2_sf_even_df (the closed-form
        chi-squared survival function backing fisher_combined_pvalue)
        against scipy.stats.chi2.sf across 200 random (x, df) pairs:
        max absolute error 4.4e-14 -- the arithmetic is correct. I THEN RAN
        MY OWN SYNTHETIC POSITIVE-CONTROL CHECK (not part of the archived
        record, disclosed here as a supplementary computation, not
        contract-sanctioned evidence): fed fisher_combined_pvalue synthetic
        panels of 50 p-values where 0, 2, 5, or 10 curves are replaced with
        genuinely tiny (Uniform(0,0.001)) p-values simulating an exceptional
        subset. Results: 0 exceptional -> combined p=0.79; 2/50 -> p=0.00028;
        5/50 -> p=0.0074; 10/50 -> p=1.1e-14. This confirms the STATISTIC's
        machinery is not fundamentally broken and CAN reject given a
        sufficiently concentrated signal -- but it does NOT close the gap
        this objection names: it is my own synthetic check, not a
        pre-registered or archived positive control run against this
        experiment's OWN group-theoretic construction (a real subgroup or
        coset-union factor base fed through this contract's actual
        panel/curve/factor-base code), and it says nothing about whether a
        genuine deviation of the kind H-MONO-663fb4 hypothesizes (a mild,
        diffuse character-bias shift spread across many curves rather than
        a handful of extreme ones) would concentrate enough per-curve
        p-value mass to trip Fisher's method at this panel's realized
        size (k~45-50).
      practical_assessment: >-
        This does not overturn "controlled null confirmed" for the
        per-curve Holm half of the result (which IS backed by a valid
        chain: reused, twice-reviewed conv.py + a verified design-time
        power argument + K5's prior-experiment reliance). It DOES mean the
        Fisher-combined half's contribution to the "genuinely powered
        instrument" claim rests on an UNTESTED sensitivity assumption, not
        a demonstrated one -- the null-object gate (Stage 2) only confirms
        the Fisher-combined test does NOT fire on a null-vs-null
        comparison (specificity), never that it WOULD fire on a genuine
        positive (sensitivity in a concrete instance, as opposed to the
        general "no floor" arithmetic argument).
      required_control_for_any_successor: >-
        Apply the Fisher-combined statistic to EXP-MONO-c819ba's own
        already-realized subgroup (RO3) and coset-union positive-control
        cells (pooled with a matched panel of non-exceptional curves at the
        same k), or construct a small synthetic panel using THIS contract's
        own factor-base/curve code with a genuine subgroup arm mixed in,
        and confirm the Fisher-combined statistic rejects it -- before
        relying on Fisher-combined "no signal" as informative about K3/K4
        in a future contract.

  proves_too_much_control:
    instructed_check: >-
      Does anything about EXP-MONO-b19c6b's own design or result
      retroactively change how EXP-MONO-c819ba's or EXP-MONO-670aa6's
      dispositions should be read?
    exp_mono_c819ba_and_670aa6: >-
      NO NEW RETROACTIVE EFFECT FOUND beyond what KN-TECH-95a42b's
      addendum and CORR-20260831-d663e0 already disclose (the composite-
      gate alpha-inflation issue is a property of THIS contract's own
      Stage-2 definition, not a defect either predecessor's text shares --
      neither c819ba's nor 670aa6's Stage-2 gate was framed as a union of
      6 independently-thresholded tests). I did not find grounds to reopen
      either prior disposition.
    the_cross_lane_pattern_worth_naming_explicitly: >-
      YES, THERE IS A NAMEABLE, THREE-INSTANCE PATTERN, and it is a
      recurring blind spot in how successor contracts in this lane close a
      review-identified gap, not merely three unrelated defects. In every
      one of the three experiments so far, a validation-coverage or
      positive-control clause that a prior review flagged as needing to be
      broadened is satisfied by the NEXT contract via the cheapest literal
      reading that clears a stated NUMERIC FLOOR, while narrowing the
      underlying INTENT of the check: (1) EXP-MONO-670aa6's dual-path
      check covered only the 100 real-arm cells, leaving the >20,000-draw
      null population entirely unchecked by route 1 (flagged by that
      lane's Red Team); (2) EXP-MONO-b19c6b's own "fix" for that gap
      (Stage 4's extended dual-path sample) clears the declared ">=200"
      floor but does so by sampling only 2 fixed within-curve positions
      (indices 0 and 100) repeated across ~97 curves, leaving >99% of any
      SINGLE curve's null-draw range unchecked (OBJ-4) -- a narrower
      version of the identical gap, satisfied in letter rather than
      intent; (3) the mandatory K5 nearby-object positive control is
      satisfied by "relying on" a prior experiment's result for the
      REUSED component (conv.py) but was never even considered for the
      NEW co-primary metric (Fisher-combined) this contract itself
      introduces (OBJ-5) -- again, the letter of "the legacy panel is
      optional and may rely on a prior confirmation" is honoured while the
      INTENT (confirm every metric that could render a verdict can detect
      a genuine positive) is not. The floor-vs-threshold fixes (the
      subject of KN-TECH-95a42b) were, by contrast, handled with
      unusually explicit rigor in this same contract -- so the pattern is
      specific to VALIDATION-COVERAGE and POSITIVE-CONTROL clauses, not to
      this Coordinator's overall care, and is worth a named entry alongside
      KN-TECH-95a42b: "a coverage or positive-control requirement
      satisfied at its stated numeric floor is not the same as satisfying
      its stated intent; check the latter separately, every time, even in a
      contract that got the arithmetic checks right."

  required_controls:
    - >-
      Before citing EXP-MONO-b19c6b's Fisher-combined "no signal" result as
      informative about K3/K4 in any future contract, run it against a
      known-exceptional panel (a subgroup or coset-union factor base mixed
      into an otherwise-null panel, using this contract's own code) to
      confirm the statistic's sensitivity in a concrete instance, not only
      its floor-free arithmetic (OBJ-5).
    - >-
      If a Stage-4-style extended dual-path sample is used again, draw the
      sampled indices via the contract's own seeded Drawer uniformly across
      the full null-draw range per curve, not a small fixed prefix
      repeated across curves (OBJ-4).
    - >-
      Report the prime-only (not only full-triple) cross-family collision
      rate explicitly in any successor's stage1 output, even when it does
      not gate the run, since it is currently reported only if a reviewer
      re-derives it from the raw comparison array (OBJ-3).
    - >-
      When a Stage-2-style gate is built from a UNION of k independently-
      thresholded sub-tests, state and check floor-vs-threshold arithmetic
      at the GATE level (alpha/k across all k, not alpha within each) at
      design time, alongside the existing per-test check -- exactly the
      extension KN-TECH-95a42b's addendum already recommends, restated
      here because this review independently re-derived the same
      requirement before reading that addendum's text.

  counterexample_or_mutation: >-
    Cheapest available discriminating action, requiring zero new
    Stage-2/3 compute: apply this run's own already-archived
    fisher_combined_pvalue implementation to a synthetic panel built by
    mixing EXP-MONO-c819ba's already-realized subgroup-curve (RO3) cell
    into an otherwise-matched null panel of this run's own realized
    curves' raw p-values, and confirm the combined statistic rejects. I
    ran a purely synthetic version of this (uniform p-values plus 2-10
    injected near-zero p-values, OBJ-5) and confirmed the arithmetic can
    reject; the real, contract-grounded version (using this experiment's
    actual curves and an actual subgroup-type factor base) is the
    recommended next concrete action and was not attempted here to keep
    this review's own compute footprint minimal, per agents/red-team.md's
    preference for the cheapest discriminating control.

  baseline_comparison: >-
    NOT APPLICABLE IN THE ASYMPTOTIC SENSE, unchanged from every prior
    record in this lane: H-MONO-663fb4's asymptotic_claim is null
    throughout and this experiment makes no cost, exponent, or attack
    claim. Pollard rho at O(sqrt(N)) time / O(1) memory remains the
    unchallenged prime-field ECDLP baseline; nothing in this toy-scale
    character-bias measurement (p in [~73, ~2050], F=N/4, m=4) could move
    that baseline in either direction even under the most favorable
    possible outcome, because the linear-algebra/relation-collection stage
    this hypothesis would need to charge is uncharged here and everywhere
    in this corpus's relation-rate findings. sota_delta = 0; dominated_by =
    not_applicable, for the same reason the hypothesis's own
    asymptotic_claim_note gives.

  heuristic_challenges:
    - >-
      HEUR-CHR-2 (the load-bearing conditional that C = O(sqrt(N) log N)
      for the real x-coordinate factor base) is exactly as untested by
      this run's clean null as it was before: a "no significant deviation"
      reading is CONSISTENT WITH but does not CONFIRM HEUR-CHR-2 --
      absence of a detected deviation at this toy scale, panel size, and
      statistical power is not evidence the deviation is bounded as
      HEUR-CHR-2 claims for all generic ordinary curves; it is evidence
      only that no deviation exceeding this instrument's now-real
      detection threshold was found on THIS panel. This distinction is
      already implicit in the contract's own claim_ceiling
      ("what_no_outcome_can_support") but is restated here because a
      "controlled null confirmed" headline is easy to over-read as
      confirming the heuristic itself.

  cost_model_challenges:
    - >-
      No cost model is asserted or implied anywhere in this record, and
      none should be inferred from either direction of a hypothetical
      K3/K4 resolution: even a confirmed character-bias deviation would be
      one term of a relation-rate model whose linear-algebra stage remains
      completely uncharged in this hypothesis's entire evidence chain.
      Unchanged from every prior record in this lane; restated here only
      to confirm it was checked, not assumed.

  reduction_and_scope_challenges:
    - >-
      The legacy-panel reliance on EXP-MONO-c819ba's own subgroup/
      coset-union positive control is scoped correctly for the REUSED
      convolution engine (conv.py, byte-identical, twice independently
      reviewed) but does NOT extend to the NEW Fisher-combined statistic --
      see OBJ-5, the primary reduction-and-scope finding of this review.
      The frozen text's own `inputs.legacy_panel.rationale` should be read
      as scoping K5's discharge to "the statistic conv.py computes," not
      to "every statistic this contract uses to render a verdict," even
      though its prose does not draw that line explicitly.
    - >-
      The F=N/4 exact-symmetric-prefix construction (`primary_F_of`,
      `factor_base_x_coords`) was independently re-read and found sound,
      identical in mechanism to both predecessors: points are only ever
      appended in (x,y)/(x,-y) pairs, so any even-length prefix is
      symmetric by construction, and an explicit per-curve symmetry check
      still gates (never patches) any failure. No instance of asymmetry
      was found or reported in either run (fb_full_symmetric,
      real_fb_symmetric both true for every realized curve, spot-checked
      directly).

  proof_architecture_challenges: []
  proof_architecture_not_applicable_reason: >-
    This is a toy-scale empirical calibration test of an already-derived,
    unconditional identity (I1)-(I3) plus one conditional heuristic
    (HEUR-CHR-2), not a new proof-oriented theorem, asymptotic bound, or
    reduction. Section 8's proof-architecture portfolio does not apply
    beyond what H-MONO-663fb4's own frozen proof_search_map already
    discharged; this run does not reopen or extend that map.

  narrowest_supported_statement: >-
    EXP-MONO-b19c6b's Stage 0 identities, Stage 1 family-independence
    verification (zero full-triple collisions, family genuinely threaded
    through every declared seed call site, master_seed genuinely varying
    the realized panel), and admission rules (100% p=1 mod 3 for j0, zero
    supersingular leaks in random-ordinary) are all independently
    reconfirmed here by direct extraction and code inspection, not merely
    trusted. Stage 2's dual-test gate passed cleanly with every one of the
    8 relevant statistics 40x-800x above its significance threshold under
    EITHER the original or the corrected (alpha/6) reading, independently
    re-verified; the composite-gate alpha-inflation defect CORR-20260831-
    d663e0 discloses is real and its arithmetic is confirmed here, but its
    practical bite is on how confidently the bare "gate passed" EVENT
    should be read as evidence of calibration (a priori only ~54% likely
    even under perfect calibration, OBJ-2) rather than on the interpretation
    of the specific archived numbers (which are unaffected either way). An
    independent audit of all 760 raw per-curve p-values finds no excess of
    nominally-significant results (27/760, below the 38/760 null
    expectation) and one exploratory, non-pre-registered, field_bits=9
    pattern that a null-object control (comparing its rate in the
    null-object arm to the real arm) shows is NOT specific to the real arm
    and should be read as noise, not signal (OBJ-1). The mandatory K5
    nearby-object positive control is validly discharged for the reused
    per-curve Var/permutation-test computation but was never discharged
    for the NEW Fisher-combined co-primary metric anywhere in this lane
    (OBJ-5) -- the single largest open qualification on "controlled null
    confirmed at verified power." A Stage-4-style coverage-closing fix
    (extended dual-path sampling) satisfies its stated numeric floor while
    reintroducing a narrower version of the SAME coverage gap the
    immediately preceding experiment's review named (OBJ-4). Taken
    together: the disposition HOLDS -- this is a materially better-powered
    and better-verified instrument than either predecessor, and the
    real-arm null reading is not an artifact of the alpha-inflation issue
    or of a masked near-boundary result -- but "controlled null confirmed"
    should be read as confirmed for the per-curve Holm/permutation half of
    the design with high confidence, and confirmed for the Fisher-combined
    half only insofar as its arithmetic is sound and its calibration
    (specificity) is verified; its sensitivity to a genuine positive
    remains an assumption, not a demonstrated fact, in every experiment in
    this lane to date.

  next_concrete_action: >-
    (1) Apply the archived fisher_combined_pvalue implementation to a
    small synthetic or reconstructed positive-control panel (a subgroup or
