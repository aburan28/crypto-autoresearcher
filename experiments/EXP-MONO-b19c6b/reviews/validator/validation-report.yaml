    - >-
      Model-correlation confound: this review runs under claude-sonnet-5
      (see review_attestation), the same resolved model as the Coordinator
      that authored this contract, its approval, and CORR-20260831-d663e0.
      This review mitigates the confound by (a) performing every numeric
