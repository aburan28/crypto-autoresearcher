      math line-by-line from scratch a third time.
    - >-
      Did not independently re-derive the dual-convention (ordered vs
      multiset) values cell-by-cell; unaffected by any named defect and
      already exercised end-to-end by the full bit-for-bit reproduction
      (RECOMP-7).
    - >-
      OTHER-FINDING-3's recommended fix (explicit per-draw thresholding of
      route2_max_imag_residual/route2_max_round_residual) was not
      implemented or retrofitted by this review; per the Validator's
