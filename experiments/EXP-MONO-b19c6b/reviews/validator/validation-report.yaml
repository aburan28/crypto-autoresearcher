    seeds; Stage 3's real arm shows no significant result anywhere. The
    Coordinator separately disclosed, via CORR-20260831-d663e0, an
    out-of-band commit (16c7432aa, authored 2026-08-31T08:02:25Z) that
    correctly identified an alpha-inflation issue in Stage 2's own
    composite 6-test gate definition (should be alpha/6~=0.00833, not
