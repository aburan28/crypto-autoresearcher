  other_correctness_findings:
    - id: OTHER-FINDING-1
      title: >-
        The frozen contract's own claim that panel independence was
        "verified... via a required pre-approval extraction script"
        could not literally have been true at approval time, though the
        outcome it predicted was empirically confirmed.
      finding: >-
        `specification.yaml`'s `inputs.primary_panel.independence_note`
        and `coordinator_approval_rationale` point 2 both assert the
        family-threading fix was "VERIFIED here (not merely asserted) via
        a required pre-approval extraction script." Independently
        confirmed via `git show 7d10489bf --stat`: at the design/approval
        commit, NO implementation code existed at all (only
        specification.yaml, the handoff, and the design snapshot receipt
        were added) -- so no extraction script could possibly have been
        run against actual code before this approval was granted. The
        genuine Stage-1 independence check that DID run (confirmed by
        RECOMP-7/control-checks above, zero collisions in both runs) ran
        WITHIN each evidence-eligible run itself, gating Stage 2/3 of that
        SAME invocation, not as a separate pre-approval dry run distinct
        from RUN-MONO-b19c6b-1/2. This is a milder recurrence of the same
        self-verification-without-artifact pattern the prior round's
        Validator flagged as OTHER-FINDING-1 in EXP-MONO-670aa6 (there,
        the self-asserted claim was FALSE and consequential; here, the
        underlying claim -- that the family-keying fix genuinely produces
        independent panels -- turned out to be TRUE and is independently
        confirmed by this review, so it is process-only and
        inconsequential to this run's disposition). Worth the
        Coordinator's continued attention for approval-time practice: an
        approval rationale should not claim a check was "performed" when
        no artifact demonstrating it exists.
    - id: OTHER-FINDING-2
      title: >-
        The Stage-2 gate's disclosed alpha-inflation defect
        (CORR-20260831-d663e0) recurs, unremarked, in Stage 3's final
        outcome-label determination.
      finding: See RECOMP-8 above. Empirically inconsequential to these
        runs; a genuine scope gap in the correction's disclosure that a
        successor contract should close by applying the same
        Bonferroni-style correction (or an equivalent joint gate) to BOTH
        the pre-treatment null-object gate AND the final escalation
        criterion, not only the former.
    - id: OTHER-FINDING-3
      title: >-
        Stage 4's route2_max_imag_residual/route2_max_round_residual are
        persisted but not individually thresholded, contrary to the
        frozen text's literal instruction.
      finding: >-
        The frozen `specification.yaml` (`stage_order_and_the_terminating_
        stage.stage_4`) says: "PERSIST and THRESHOLD (tolerance 1e-6
        relative) the per-draw route2_max_round_residual and
        route2_max_imag_residual for every sampled draw... A threshold
        breach on any sampled draw is `failed_infrastructure`." Reading
        `run_experiment.py` directly: `within_1e-6` and
        `all_within_threshold` are computed ONLY from the derived
        route1-vs-route2 `relative_residual`; `route2_max_imag_residual`/
        `route2_max_round_residual` are computed (in `conv.py`) and
        stored per sample, and their maxima are reported at the top
        level, but no code path compares either of them individually
        against 1e-6 or would halt the run if they were large. This is a
        genuine, previously-undisclosed (neither the Executor's
        `anomalies_and_deviations` nor CORR-20260831-d663e0 mention it)
        partial gap between the frozen text and the executed
        implementation. EMPIRICALLY INCONSEQUENTIAL: the actual observed
        maxima (RUN-1: imag=3.539e-08, round=4.098e-08; RUN-2:
        imag=1.423e-08, round=2.235e-08) sit 100-2800x inside the 1e-6
        tolerance, so even a correctly-implemented individual threshold
        check would have passed trivially in both runs. Recommend a
        successor contract's Stage 4 explicitly gate on
        `max(route2_max_imag_residual, route2_max_round_residual) < 1e-6`
        in addition to the relative-residual check already present.
    - id: OTHER-FINDING-4
      title: >-
        Minor textual inconsistency in the (original, untampered) frozen
        contract: "coset-pick" is named as a sixth family-keyed seed-call
        site that does not exist in the executed design.
      finding: >-
        `specification.yaml`'s `coordinator_approval_rationale` point 2
        (present in BOTH the original 7d10489bf text and the tampered
        HEAD text identically -- this is not a tampering artifact) lists
        "prime, curve-a, curve-b, null-subset, null-object-pick,
        coset-pick" as the six call sites requiring `family`. `seed.py`'s
        own `ALLOWED_LABELS` enumerates only five: {"prime", "curve-a",
        "curve-b", "null-subset", "null-object-pick"} -- no "coset-pick"
        anywhere in the executed implementation, consistent with this
        contract's own explicit, disclosed decision (`inputs.legacy_panel:
        status: optional_non_gating`) not to implement any coset/subgroup
        construction. Purely a leftover reference to EXP-MONO-670aa6's
        six-label list; has zero computational effect since no coset-pick
        draw was ever attempted. Cosmetic; noted for completeness only.
    - id: OTHER-FINDING-5
      title: >-
        The currently-committed specification.yaml and handoff at HEAD no
        longer describe what RUN-MONO-b19c6b-1/2 actually executed
        against, exactly as CORR-20260831-d663e0 already discloses --
        independently re-confirmed here, not a new finding.
      finding: >-
        Confirmed via `git diff 7d10489bf cd9e44667 --
        experiments/EXP-MONO-b19c6b/specification.yaml` that the
        committed text differs from what governed execution in exactly
        the two ways CORR-20260831-d663e0 states (alpha_gate wording, P6
        clause), and via `git show cd9e44667:ledger/handoffs/
        TASK-20260831-34198b.yaml` that the handoff file carries the same
        post-tampering alpha_gate=0.05/6 text -- matching
        CORR-20260831-d663e0's own `corrects:` list exactly. This
        documentation-currency hazard is fully disclosed by the cited
        correction and does not need independent remediation from this
        review; listed here only to record that this review independently
        checked it rather than assuming it.

  assessment_of_review_questions:
    a_was_the_run_executed_as_the_frozen_contract_specifies: >-
      YES. Both runs' manifests bind commit 7d10489bf (the design/approval
      commit, before either the implementation existed or the tampering
      commit landed), record a disclosed dirty-tree state limited to
      unrelated paths, and are bit-for-bit reproducible from the archived
      command against the archived implementation (RECOMP-7). The executed
      code's Stage-2 gate genuinely uses the ORIGINAL alpha=0.05-per-test
      semantics (confirmed by direct source reading, not the
      currently-committed, tampered specification.yaml text), matching
      what the Executor actually ran and what the timestamps independently
      confirm was possible.
    b_does_the_design_time_power_claim_hold_up_to_independent_rederivation: >-
      YES, exactly, and this is the single most important reversal versus
      the lane's second attempt. n=20000 confirmed directly in both runs;
      realized per-family test counts (90, 96, 96, 98) confirmed directly;
      the floor (1/20001) sits 10.2x-11.1x BELOW every realized family's
      Holm threshold (RECOMP-2), the opposite inequality from
      EXP-MONO-670aa6's 5-10x ABOVE. No p-value anywhere in either run
      approaches the floor (minimum raw p is ~124x the floor), and no
      Holm-adjusted or Fisher-combined p-value comes remotely close to
      significance at either alpha=0.05 or the tighter alpha/6 (RECOMP-3,
      RECOMP-4, RECOMP-6) -- this is a genuinely powered null result, not
      a guaranteed one.
    c_does_the_panel_independence_claim_hold_up_to_independent_rederivation: >-
      YES. `family` is threaded through all five declared seed call sites,
      confirmed by direct source reading of seed.py/curve.py/controls.py
      (not inferred from the absence of reported collisions). Zero
      full-tuple (p,B,t_used) collisions in either run, confirmed directly
      from the raw comparison arrays (46 and 48 matched curve_ordinals
      respectively), a complete reversal of EXP-MONO-670aa6's 100%
      collision rate.
    d_is_the_alpha_inflation_correction_arithmetically_correct_and_is_its_empirical_inconsequential_claim_correct: >-
      YES to both, independently re-derived. 1-(0.95)^6 = 0.264908...
      confirms the ~26.5% figure exactly (RECOMP-5), and the defect is
      confirmed present in the ACTUAL EXECUTED CODE (not merely the
      tampered specification text) via direct reading of
      `family_gate_pass()`. The empirical-inconsequence claim is
      independently confirmed: every one of the 8 relevant Stage-2
      statistics sits far from both alpha=0.05 and alpha/6~=0.00833
      (RECOMP-6). One genuine gap in the correction's own scope was
      found and is disclosed as OTHER-FINDING-2/RECOMP-8: the identical
      defect recurs, unremarked, in Stage 3's final outcome-label
      determination -- also empirically inconsequential here, but not
      covered by the cited correction's stated scope.
    e_any_other_correctness_issue: >-
      Two genuine, previously-undisclosed, empirically-inconsequential
      findings (OTHER-FINDING-2, OTHER-FINDING-3) plus one recurring
      process pattern (OTHER-FINDING-1) and one cosmetic textual
      leftover (OTHER-FINDING-4). None of these bear on the correctness
      of any number this run actually reports; all are disclosed for a
      successor contract's benefit.

  limitations:
    - >-
      This review is J1-correctness scope. It renders no verdict on
      H-MONO-663fb4 itself, authorizes no status change, and creates no
      ECDLP, relation-rate, or cryptographic-scale claim (AGENTS.md rule 1
