  metric_recomputations:
    - id: RECOMP-1-n-null-draws-and-test-counts
      description: >-
        Directly read `n_null_draws` and the realized per-family Holm test
        counts (`holm_pooled_var_and_cf.n_tests`) from both runs'
        raw-result.json.
      result: >-
        CONFIRMED. `n_null_draws=20000` in BOTH runs (module constant
        `N_NULL_DRAWS=20000` in run_experiment.py, and present verbatim in
        both archived JSONs' top-level key). Realized per-family test
        counts: RUN-1 j0=90 (45 curves x 2 stats), RUN-1
        random-ordinary=96 (48 x 2); RUN-2 j0=96 (48 x 2), RUN-2
        random-ordinary=98 (49 x 2). All four values fall exactly in the
        "~90-98" range the task card anticipated, and match the realized
        panel sizes (45/48/48/49) recorded in the same JSONs'
        `primary_panel_realized_after_fb_check`.
    - id: RECOMP-2-floor-vs-threshold
      description: >-
        BLIND RE-DERIVATION script (`floor_vs_threshold_and_min_p.py`,
        see receipt) computing floor=1/(n+1) and alpha/m for every
        declared family, both runs, both stages, directly from
        raw-result.json's own per-test data -- no reliance on the
        Coordinator's, CORR-20260831-d663e0's, or the frozen contract's
        own stated arithmetic.
      result: >-
        CONFIRMED, exactly, and the opposite finding from EXP-MONO-670aa6.
        floor = 1/20001 = 4.999750012499375e-05 in both runs. Tightest
        realized family (m=90, j0, RUN-1) has alpha/m = 0.05/90 =
        5.55556e-4, a floor/threshold ratio of 11.11x; the loosest
        realized family (m=98) gives 10.20x. All four (run x family)
        cells sit comfortably (10.2x-11.1x) BELOW their own Holm
        threshold -- confirming the design-time claim "roughly 10x below
        the tightest family threshold" almost exactly, and confirming
        this design COULD, in principle, produce a Holm-significant
        result, unlike EXP-MONO-670aa6 (floor 5-10x ABOVE threshold,
        structurally incapable of ever firing).
    - id: RECOMP-3-minimum-observed-p-values
      description: >-
        Extracted EVERY raw and Holm-adjusted p-value from both runs
        (stage2_per_curve_raw_pvalues, stage3_per_curve_raw_pvalues, and
        the holm_pooled_var_and_cf.per_test adjusted_p arrays) -- 372
        raw p-values in RUN-1, 388 in RUN-2, none at or near the
        theoretical floor -- to directly answer the task's question "did
        any Holm-adjusted p-value actually get close to significance, or
        were they all far from it."
      result: >-
        ALL FAR FROM SIGNIFICANCE, IN BOTH RAW AND ADJUSTED FORM. Global
        minimum RAW p-value across both runs, both arms, both statistics,
        both families: 0.0061996900... (Stage-2, j0, RUN-1) -- about 124x
        ABOVE the theoretical floor (4.9998e-05), meaning this design's
        null distribution has genuine spread and does not saturate at the
        floor the way EXP-MONO-670aa6's did (that run's minimum p hit
        EXACTLY 1/201, the floor itself, in RUN-2). Zero of the 760 raw
        p-values examined across both runs sit at or within 1e-12 of the
        floor (checked programmatically). Global minimum HOLM-ADJUSTED
        p-value: 0.5579721013949303 (Stage-2, j0, RUN-1) -- roughly 11x
        the nominal alpha=0.05, and this is the SMALLEST adjusted p-value
        found anywhere in either run; every other cell is looser still
        (Stage-3's tightest adjusted minimum is 0.6614669266536674). No
        Holm-adjusted p-value in either run comes remotely close to
        alpha=0.05, let alone any tighter gate-level threshold.
    - id: RECOMP-4-minimum-fisher-combined-p
      description: >-
        Extracted every Fisher-combined `combined_p` (Stage 2 and Stage 3,
        both statistics, both families, both runs -- 16 values total)
        directly from raw-result.json.
      result: >-
        Global minimum across ALL 16 values: 0.43022855975456314
        (Stage-2, random-ordinary, RUN-1, C/F statistic) -- confirming
        the Coordinator's/CORR-20260831-d663e0's stated "min
        Fisher-combined p=0.4302" EXACTLY, and confirming it is the
        Stage-2 (gate-relevant) minimum specifically. If Stage-3's own
        values are also included the global minimum is 0.39943412054181854
        (Stage-3, j0, RUN-2, C/F) -- still far above both alpha=0.05 and
        alpha/6~=0.00833.
    - id: RECOMP-5-alpha-inflation
      description: >-
        Independently computed 1-(1-0.05)^6 from first principles (no
        reliance on CORR-20260831-d663e0's own stated figure), and
        separately confirmed BY DIRECT CODE READING that the executed
        `family_gate_pass()` function in run_experiment.py checks exactly
        six sub-conditions at the nominal, uncorrected ALPHA=0.05
        constant: {j0_holm_pass, j0_fisher_var_pass, j0_fisher_cf_pass,
        ro_holm_pass, ro_fisher_var_pass, ro_fisher_cf_pass}, ANDed
        together per family then across families -- exactly the "composite
        6-test definition" the correction describes, confirmed from the
        source code rather than assumed from the correction's prose.
      result: >-
        1 - (0.95)^6 = 0.2649081... ~= 26.5%, confirming
        CORR-20260831-d663e0's claim to 4 significant figures. This
        arithmetic fact is INDEPENDENT of any observed data; it is a
        property of the design (six uncorrected alpha=0.05 tests jointly
        gating one pass/fail decision) regardless of which curves or
        seeds are used. CONFIRMED that the correction's claim is a
        genuine defect in the general design, not merely plausible-
        sounding prose.
    - id: RECOMP-6-alpha-inflation-empirical-inconsequence-check
      description: >-
        Checked whether the actual observed Stage-2 statistics in both
        runs would cross EITHER alpha=0.05 OR alpha_gate=0.05/6, to
        directly verify (not merely accept) the Coordinator's
        "empirically inconsequential" claim.
      result: >-
        CONFIRMED INCONSEQUENTIAL FOR THIS RUN. Per RECOMP-3/4: the
        tightest Stage-2 Holm result anywhere is an adjusted p of
        0.5579721013949303 (>> 0.05 >> 0.05/6), and the tightest Stage-2
        Fisher-combined result is 0.43022855975456314 (>> 0.05 >> 0.05/6).
        Every one of the 8 relevant Stage-2 checks (4 Fisher-combined
        values x 2 runs, plus both Holm "0 significant" results x 2 runs)
        clears BOTH thresholds by a wide margin, so RUN-MONO-b19c6b-1/2
        would have passed Stage 2's gate identically whichever threshold
        is used. This independently reproduces CORR-20260831-d663e0's own
        stated empirical check rather than merely trusting it.
    - id: RECOMP-7-bit-for-bit-reproduction
      description: >-
        Full re-execution of both runs from the archived, unmodified
        `implementation/` directory and each run's own `command.txt`
        invocation (see artifact_checks above for the summary; scripts
        and hashes in the receipt).
      result: >-
        PASS. Both reproduced JSONs match the archived JSONs exactly
        after stripping timing/RSS/checkpoint/environment fields --
        independently confirms every reported number in this report
        (panel construction, construction-failure counts, collision
        comparisons, admission-rule checks, all Stage 2/3/4 statistics)
        is a genuine, reproducible computation, not a transcription or a
        fabricated result.
    - id: RECOMP-8-same-alpha-inflation-defect-in-stage3-outcome
      description: >-
        NOT requested verbatim by the task card, but a direct consequence
        of RECOMP-5: checked whether the SAME uncorrected-6-test-union
        structure that gates Stage 2 ALSO governs Stage 3's final
        `outcome` label (`exceptional_locus_found` vs
        `controlled_null_confirmed_at_verified_power`).
      result: >-
        YES, CONFIRMED BY DIRECT CODE READING, AND NOT MENTIONED BY
        CORR-20260831-d663e0. `run_experiment.py`'s final `outcome`
        computation ORs together the identical six conditions (j0 Holm
        n_significant>0, j0 Fisher-var significant, j0 Fisher-cf
        significant, and the same three for random-ordinary), each
        evaluated at the same uncorrected ALPHA=0.05 -- structurally
        identical to the Stage-2 gate defect, one level further into the
        pipeline. This means the program's own headline
        "exceptional_locus_found" escalation criterion has the SAME
        ~26.5%-per-seed uncorrected false-escalation rate the Stage-2
        gate has, and the disclosed correction's scope ("Stage-2 gate's
        own composite 6-test definition") does not mention it. EMPIRICALLY
        INCONSEQUENTIAL TO THESE RUNS (per RECOMP-3/4, every Stage-3
        Fisher-combined and Holm-adjusted p-value is likewise far above
        both alpha=0.05 and alpha/6), but this is a genuine scope gap in
        CORR-20260831-d663e0's disclosure that a successor contract should
        close explicitly (apply the same Bonferroni-across-six correction
        to the escalation criterion, not only to the pre-treatment gate).

  control_checks:
    - control: Stage-0 exact identity gate (same frozen fixture as both predecessors, p=101/A=1/B=1).
      result: >-
        PASS, independently recomputed by re-execution. gate_pass=true
        both runs; m1 exact match; m2 additive-quadruple relative residual
        0.0 (exact); m2 variance-identity relative residual
        3.752926491954027e-15 -- identical in both runs (same fixture,
        seed-independent), matching execution_report.yaml exactly.
    - control: >-
        Dual-path control (route 1 direct convolution vs route 2
        FFT-derived) on all real-arm cells, both runs.
      result: >-
        PASS by full deterministic re-execution. `dual_path_control_real_
        arm_all_within_1e-9: true` in both archived runs (93 cells in
        RUN-1, 97 in RUN-2), max relative residual 0.0 in both,
        reproduced exactly.
    - control: >-
        Stage-1 mandatory independence verification: `family` genuinely
        threaded through EVERY seed call site.
      result: >-
        PASS, confirmed by DIRECT SOURCE READING (not merely trusting the
        archived comparison table). `seed.py`'s `seed_digest`/`seed_int`/
        `Drawer` all require `family` as a positional, non-defaulted
        parameter and assert it is one of `{"j0","random-ordinary"}`.
        Every one of the five declared call sites threads it through:
        `curve.py::construct_prime` (label "prime"), `curve.py::
        curve_stream` (labels "curve-a"/"curve-b"), and
        `controls.py::draw_symmetric_subset` (labels "null-subset"/
        "null-object-pick", via its own `Drawer(domain, master_seed,
        family, label, ...)` construction). All five call sites read
        directly from source, not inferred from the comparison table's
        absence of collisions.
    - control: >-
        Stage-1 zero (p,B,t_used)-FULL-TUPLE collisions across matched
        curve_ordinals.
      result: >-
        PASS, confirmed directly from raw-result.json's own
        `stage1_independence_verification.comparisons` array (not merely
        the summary `zero_collisions: true` flag): RUN-1 has 46 matched
        curve_ordinals, 0 full-triple collisions; RUN-2 has 48, 0
        full-triple collisions. Per-FIELD coincidences occur by chance as
        expected under genuine independence (RUN-1: 3/46 prime
        coincidences, 0 B coincidences, 43/46 t_used=0-vs-0 coincidences
        -- j0's `t_used` is 0 for literally every realized curve in both
        runs, since A=0/B=b_t admits on the FIRST candidate whenever
        b_t!=0 and the discriminant is nonzero, which is generic; this is
        an expected property of the j0 construction rule, not a
        collision artifact, and is correctly excluded from the "full
        triple" collision definition per implementation.md's disclosed
        interpretation). This is the single most consequential control in
        this review: EXP-MONO-670aa6 had 100% full-triple collisions;
        this run has 0/46 and 0/48.
    - control: j0 family's p=1 (mod 3) admission rule.
      result: >-
        PASS, enforced in TWO independent places in the code (`curve.py::
        construct_prime`'s own scan-and-skip loop, AND a defensive
        re-check + `assert not supersingular_flag` in `panel_primary.py::
        _construct_one`), and confirmed zero violations directly from
        raw-result.json's `j0_p_mod_3_admission_check`:
        {n_curves: 45/48, n_violations: 0, all_admitted_correctly: true}
        in both runs.
    - control: random-ordinary family's explicit supersingularity rejection.
      result: >-
        PASS, enforced via `is_supersingular()` (trace of Frobenius,
        t_E=0 mod p) in `panel_primary.py`'s scan loop, confirmed zero
        leaks directly from raw-result.json's
        `random_ordinary_supersingularity_check`: {n_curves: 48/49,
        n_supersingular_leaked_into_panel: 0, all_ordinary: true} in both
        runs -- this closes EXP-MONO-670aa6's 58%-j0-supersingular-
        contamination finding (verified j0-side above) and its
        random-ordinary analogue.
    - control: Stage-4 extended dual-path sample -- persisted vs discarded.
      result: >-
        PARTIAL PASS, one finding. `route2_max_imag_residual` and
        `route2_max_round_residual` ARE persisted per sampled draw (279
        samples in RUN-1, 291 in RUN-2, exceeding the >=200 floor in
        both) -- this genuinely fixes EXP-MONO-670aa6's discard-
        diagnostics gap, where these were computed and thrown away. BUT
        the code's actual pass/fail gate (`within_1e-6`,
        `all_within_threshold`) checks ONLY the derived route1-vs-route2
        relative residual, NOT these two diagnostics individually,
        contrary to the frozen text's literal instruction to "PERSIST and
        THRESHOLD (tolerance 1e-6 relative)... route2_max_round_residual
        and route2_max_imag_residual." See OTHER-FINDING-3 --
        EMPIRICALLY INCONSEQUENTIAL (observed maxima 3.5e-8/4.1e-8 in
        RUN-1, 1.4e-8/2.2e-8 in RUN-2, both ~100-2800x inside the 1e-6
        tolerance), but a genuine, disclosed-here-for-the-first-time
        completeness gap between the frozen text and the executed code.
    - control: Legacy 8-curve sub-panel positive controls.
      result: >-
        Correctly NOT RUN, per the frozen contract's own explicit
        declaration (`inputs.legacy_panel: status:
        optional_non_gating`), relying instead on EXP-MONO-c819ba's
        already-independently-reviewed subgroup/coset-union positive
        controls. Confirmed the contract's own text makes this an
        intentional design choice for THIS contract, not a silent
        omission -- unlike EXP-MONO-670aa6, which attempted and reported
        a legacy panel that then failed its own precondition.
    - control: Dual-convention control (ordered vs multiset).
      result: >-
        Present at every convention-dependent cell
        (`var_real_ordered`/`var_real_multiset`,
        `mean_real_ordered`/`mean_real_multiset`), confirmed by direct
        inspection of `stage3_per_curve`; not independently re-derived
        cell-by-cell this round (out of primary decision weight, unchanged
        in design from both predecessors, and already exercised by
        RECOMP-7's full bit-for-bit reproduction).

  heuristic_validation_checks:
    - check: >-
        Pre-registered prediction (the design-time floor-vs-threshold
        arithmetic, and P1-P6's own preregistered_prediction block)
        recorded before any run.
      result: >-
        PASS, confirmed via `git show 7d10489bf:experiments/EXP-MONO-b19c6b/
        specification.yaml` -- the design-time arithmetic
        (`inputs.null_draws_note`, `coordinator_approval_rationale` point
        1) and the full `preregistered_prediction` block are present in
        the design/approval commit (2026-08-31T00:53:17-07:00, i.e.
        07:53:17 UTC), which independently-confirmed timestamps place
        BEFORE either run started (01:00:52Z/01:07:15Z). Not fit after
        seeing data.
    - check: >-
        Sample size, seeds, and sampling procedure in the manifest; the
        empirical statistics recomputed from raw samples, not copied from
