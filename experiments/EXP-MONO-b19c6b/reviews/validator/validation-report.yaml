  j1_attack_verdict: holds
  j1_attack_verdict_note: >-
    This task's specific J1-correctness attack -- "does this run deliver a
    genuine, powered test of K3/K4, with a null-object gate that could
    actually fail, and a panel that is genuinely independent" -- HOLDS,
    reversing the verdict on this lane's two prior attempts
    (EXP-MONO-c819ba: uncontrolled false-positive rate; EXP-MONO-670aa6:
    j1_attack_verdict breaks, zero statistical power and total panel
    collision). Both of EXP-MONO-670aa6's named defects are independently
    confirmed fixed and measured, not merely asserted fixed: the floor now
    sits an order of magnitude BELOW every realized family's threshold
    (RECOMP-2), and the panel-independence collision rate is 0% (was
    100%). The disclosed alpha-inflation defect in the Stage-2 gate is
    independently confirmed real (RECOMP-5) and independently confirmed
    inconsequential to these specific runs (RECOMP-6), with one genuine
    scope gap found in the disclosure's own coverage (RECOMP-8/
    OTHER-FINDING-2, also inconsequential here). The instrument genuinely
    could have found a signal this time and did not (min raw p ~124x the
    floor, min Fisher-combined p 0.43, min Holm-adjusted p 0.56) -- this
    is the "controlled null confirmed at verified power" outcome the
    contract's own text anticipated, not a guaranteed non-result. This
    verdict is scoped to J1-correctness only: it says the receipt is
    trustworthy evidence of exactly what it measured (a toy-scale,
    design-time-power-verified null result on 90-98 curves at p in
    [100,3000]), not that K3/K4 is closed, not that H-MONO-663fb4 is
    confirmed or refuted, and not any claim beyond AGENTS.md rules 4/7.

