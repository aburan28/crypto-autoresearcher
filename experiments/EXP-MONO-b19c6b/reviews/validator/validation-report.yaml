    specific runs. Task: verify the runs were executed as the frozen
    contract specifies; independently re-derive the design-time power
    claim and the panel-independence claim from raw-result.json and source
    (not the Coordinator's prose); independently recompute 1-(1-alpha)^6
    and check it against the actual observed Fisher-combined/Holm p-values
    in both runs; check for any other correctness issue. Blind
    re-derivation observed: all numeric claims below (floor, alpha/m,
    minimum raw/adjusted/Fisher-combined p-values, the 26.5% alpha-
    inflation figure, the family-threading and zero-collision claims) were
    computed directly from runs/RUN-MONO-b19c6b-{1,2}/raw-result.json and
    implementation/{seed,curve,panel_primary,controls,stats,run_experiment}.py
    BEFORE reading CORR-20260831-d663e0's or DEC-20260831-a4b23f's own
    arithmetic in detail a second time to cross-check.

