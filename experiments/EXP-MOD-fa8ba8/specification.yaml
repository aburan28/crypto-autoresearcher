experiment:
  id: EXP-MOD-fa8ba8
  hypothesis_id: H-MOD-e9d87e
  version: 1
  title: >-
    The diamond-operator torsor of an ECDLP instance: exhaustive verification of
    the dictionary and of three forced values, with a non-free control that
    proves the derivations used freeness
  status: review_required
  objective: >-
    Build X_1(N)(F_p) and X_0(N)(F_p) explicitly at small N; verify exhaustively
    that the fibre coordinate equals k mod +-1; verify F1 (torsor triviality) in
    the correct group scheme and F2 (freeness, hence constancy of
    diamond-invariant single-point functions); measure the Hecke separation
    statistic against its derived forced value and a random-correspondence null;
    and confirm on non-free controls that the derivations give a DIFFERENT answer
    there, which is what shows they used freeness rather than assumed the
    conclusion.
  experiment_class: control
  inputs:
    N_values: [5, 7, 11, 13]
    primes: >-
      Small p with p not dividing N and N dividing #E(F_p), enumerated and frozen
      into instances.json with the curve, generator and point count.
    ell_values: small primes different from p, for the Hecke correspondence
    non_free_controls:
      - j = 0 curves (extra automorphisms)
      - j = 1728 curves (extra automorphisms)
      - one composite N, where the fibre is a torsor under a non-cyclic group
    group_scheme_note: >-
      The fibre is a torsor under (Z/N)^*/{+-1} as an abstract group, but the
      GALOIS ACTION decides triviality, and the Weil-pairing normalisation makes
      mu_N appear. The Galois module structure is written out explicitly at
      Stage 0 and frozen; getting it wrong flips F1's conclusion in either
      direction and is the most likely technical error in the whole experiment.
  controls:
    - id: C1_dictionary_exhaustive
      description: >-
        For EVERY (E, P, k) in the toy range, the computed fibre coordinate must
        equal k mod +-1 as an integer. Exhaustive, not sampled. BLOCKING: a
        mismatch means the dictionary is wrong and nothing downstream is
        meaningful.
    - id: C2_identity_null
      description: >-
        k = 1, so (E, P) = (E, Q) and the fibre coordinate must be the identity.
        Any pipeline returning a non-identity coordinate is broken. BLOCKING.
    - id: C3_non_free_control
      description: >-
        At j = 0, j = 1728 and the composite-N case, the freeness argument fails
        and the derivations MUST give a different answer -- specifically, at
        least one diamond-invariant single-point function must be non-constant on
        a fibre there. BLOCKING AND DECISIVE: if the answer is the same as in the
        free case, the derivation did not use freeness and F2 is not established
        whatever its conclusion.
    - id: C4_random_correspondence_null
      description: >-
        Replace T_ell by a random correspondence of the same degree on the same
        fibre set. It must give a NON-ZERO separation statistic. If it does not,
        the statistic cannot discriminate and the forced zero for T_ell means
        nothing.
    - id: C5_two_constructions
      description: >-
        X_1(N)(F_p) built by two independent routes -- moduli enumeration and
        direct construction from E(F_p) points of order N -- must agree exactly
        as sets with their diamond actions.
  independent_variables:
    - N (4 values, plus one composite for the control)
    - prime p
    - ell for the Hecke statistic
    - curve class (generic, j = 0, j = 1728)
  metrics:
    primary:
      - >-
        dictionary_match_rate: fraction of instances where the fibre coordinate
        equals k mod +-1. Required to be exactly 1.
      - >-
        torsor_obstruction_class per instance, required to be trivial (F1).
      - >-
        nonconstant_invariant_count: number of diamond-invariant single-point
        functions found non-constant on a fibre, reported separately for the free
        and non-free cases. Required 0 in the free case and > 0 in at least one
        non-free case.
    secondary:
      - Hecke separation statistic per ell, against its derived forced value
      - the random-correspondence null's separation statistic
      - fibre size phi(N)/2 versus the enumerated fibre, exact integer check
      - genus of X_1(N) and fibre count per (N, p), for feasibility bookkeeping
  measured_vs_modeled:
    measured:
      - dictionary match rate, obstruction classes, invariant counts
      - Hecke and random-correspondence separation statistics
      - enumerated fibre sizes
    modeled:
      - F1 (torsor triviality from a rational point)
      - F2 (freeness for N prime > 3 with Aut(E) = {+-1})
      - F3 (the congruence relation involving only <p mod N>)
      - the forced zero for the Hecke separation statistic
    rule: >-
      Measured and modeled never share a column. This experiment exists to check
      derivations, so the modeled column is the substance and the measured column
      is the audit; the report must present them in that relation rather than
      letting the measurements read as discoveries.
  optimistic_assumptions:
    - >-
      Only N <= 13 is reachable, where X_1(N) has small genus. BIAS: the
      dictionary and controls are verified in the easiest possible regime.
      Direction: a derivation error that only bites at large N would not be
      caught -- and at cryptographic N the curve has genus ~ N^2/24 and cannot be
      written down at all, so it never will be by this route.
    - >-
      The Hecke statistic is computed for a few small ell only. BIAS: the forced
      zero is confirmed on a narrow slice.
  optimistic_assumption_rule: >-
    Every conclusion is reported as verified AT THE TESTED N, with the explicit
    note that the derivations rather than the computations are what would carry
    to cryptographic N and that no computation in this experiment reaches there.
    The list above is reproduced in the results report with the direction of each
    bias.
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The Hecke separation statistic on a single fibre for T_ell, ell != p.
    formula: >-
      Identically zero, because the diamond operators commute with the Hecke
      correspondences and therefore T_ell acts on the fibre through the quotient
      by the diamond action.
    source: >-
      Derived in H-MOD-e9d87e (F3 and its surrounding argument), written out at
      Stage 0 before the statistic is implemented. Frozen; a revision is a
      protocol_amendment.
  scale_relevance:
    tier: toy
    justification: >-
      N <= 13 and small p, chosen so X_1(N)(F_p) is fully enumerable and every
      check is exhaustive rather than sampled -- which is what makes "exactly
      zero" and "exactly 1" meaningful assertions here. The genus of X_1(N) grows
      like N^2/24, so this representation is not computable at cryptographic N by
      any route, and the record states that as a hard barrier rather than a
      budget limitation. Resulting evidence is capped at claim_tier toy.
    correspondence: null
  tail_checks:
    - >-
      The largest N reached, with its fibre size and genus, so the feasibility
      wall is documented rather than implied.
    - >-
      The single non-free instance with the LARGEST number of non-constant
      diamond-invariant functions, confirming C3 is not passing on one marginal
      case.
    - >-
      The instance where the enumerated fibre size differs most from phi(N)/2 --
      required to be zero difference everywhere; any deviation is a construction
      bug.
  replication:
    seeds: [17, 19, 23]
    independent_instances: 3
    note: >-
      Every check in this experiment is exhaustive over a finite set, so results
      are deterministic. Seeds vary only the choice of curve within each (N, p)
      class; results must be IDENTICAL up to relabelling, and a seed-dependent
      answer indicates a bug rather than variance.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 4
    maximum_memory_gb: 4
    maximum_runs: 200
  stopping_rules:
    - HALT at C1 if the dictionary does not match exhaustively.
    - >-
      HALT at C3 if the non-free control gives the same answer as the free case:
      F2 is not established and continuing would produce a conclusion the
      derivation does not support.
    - Stop at the CPU-hour cap; report completed (N, p) cells and name the rest.
  invalidation_rules:
    - C1, C2, C3 or C5 failing invalidates every downstream result.
    - >-
      A conclusion about F1 stated without the explicit Galois module structure
      from Stage 0 is invalid, because the group-scheme choice determines it.
    - >-
      Crashes and timeouts are infrastructure outcomes under AGENTS.md rule 5.
  success_criterion: >-
    C1-C5 pass, F1 and F2 are verified computationally in the free case AND shown
    to fail in the non-free case, and the Hecke separation statistic is reported
    against both its derived forced value and the random-correspondence null. The
    experiment succeeds by confirming the three forced values, which is a closure
    with three named obstructions -- or by refuting one, which is a larger result.
  falsification_criterion: >-
    F1 is REFUTED by a non-trivial torsor class on a rational instance; F2 by a
    non-constant diamond-invariant single-point function in the free case; the
    dictionary by any mismatch at C1; and the Hecke forced value by a non-zero
    statistic where the derivation forces zero. Each refutation is independent
    and none implies the others. A refutation of F1 or F2 is escalated
    immediately: it would be computable structure attached to an ECDLP instance
    and supersedes this record's conclusion.
  required_artifacts:
    - the Stage-0 write-up of F1, F2, F3 including the explicit Galois module
      structure and the freeness exception list
    - frozen instances.json with curves, generators, point counts and N | #E(F_p)
    - per-run manifest with command, commit, environment, seed, resolved model
    - full enumerated X_1(N)(F_p) and X_0(N)(F_p) with the diamond action
    - per-instance fibre coordinate versus k mod +-1, exhaustive
    - torsor obstruction class per instance
    - invariant-constancy tables for free and non-free cases, side by side
    - Hecke and random-correspondence separation statistics
    - control outcomes C1-C5 with pass/fail
  assigned_to: executor
  approved_by: null
  approval_note: >-
    Status is review_required. Cheap (4 CPU-hours). The substance is the Stage-0
    derivation; the runs exist to catch a transcription error in it, and the
    non-free control at C3 is the one check that distinguishes a real derivation
    from an asserted conclusion.
