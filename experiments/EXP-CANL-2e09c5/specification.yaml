# =============================================================================
# EXP-CANL-2e09c5 — version 1, approved by DEC-20261006-8faafb.
# Frozen measurement of Q_4, the 19-denominator share of the duplication
# height estimator, on three named points. The prediction is
# |Q_4(P_cm)-Q_4(P_n1)| >= 0.25 and |Q_4(P_n1)-Q_4(P_n2)| <= 0.10.
# A finished gap |Q_4(P_cm)-Q_4(P_n1)| < 0.25, with the null-null gap
# at most 0.10 and the other gates passing, is a negative.
# This design session checked the three point substitutions, the
# discriminants modulo 5, 7, and 19, and #E(F_17)=18 for y^2=x^3+1.
# It did not double any point and it does not know Q_4.
# No xedni attack and no discrete logarithm are authorized.
# Source idea IDEA-20261005-8276a8 is already on origin/main and is
# not rewritten.
# =============================================================================
experiment:
  id: EXP-CANL-2e09c5
  hypothesis_id: H-CANL-2d15e2
  question_id: RQ-CANL-63098f
  source_idea: IDEA-20261005-8276a8
  version: 1
  title: >-
    p-denominator share Q_4 on the j=0 lift versus two non-CM nulls at p=19
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261006-8faafb
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null.
      Approval does not assert that the CM-null gap is at least 0.25
      and does not assert that xedni works.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Double three named rational points to 16P with exact fractions,
      score Q_3 and Q_4 at p=19, and apply the ordinary, non-CM,
      stability, and p=17 refusal gates. Do not lift a discrete log
      and do not search for a global relation.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether Q_4, the ratio of the 19-adic denominator contribution
    to the naive logarithmic height of x(16P), separates
    P_cm=(2,3) on y^2=x^3+1 from P_n1=(0,1) on y^2=x^3+x+1 by at least
    0.25 while P_n1 and P_n2=(1,1) on y^2=x^3-x+1 differ by at most 0.10.
    A finished absolute CM-null gap strictly below 0.25, with the
    null-null gap at most 0.10 and the gates below passing, is a
    negative. No characteristic-zero ECDLP method is in scope.

  inputs:
    prime: 19
    natural_log: >-
      decimal.Decimal.ln at precision 50. The same function is used for
      the naive height and for ln(19). A binary float is not the record.
    models:
      - id: C_cm
        equation: y^2 = x^3 + 1
        A: 0
        B: 1
        point: [2, 3]
      - id: C_n1
        equation: y^2 = x^3 + x + 1
        A: 1
        B: 1
        point: [0, 1]
      - id: C_n2
        equation: y^2 = x^3 - x + 1
        A: -1
        B: 1
        point: [1, 1]
    doubling: >-
      On y^2 = x^3 + A x + B, if y is 0 then 2P is the point at infinity.
      Otherwise the slope is (3 x^2 + A) / (2 y), the next x is
      slope^2 - 2 x, and the next y is slope (x - x_next) - y, in exact
      rational arithmetic. Reduce x = a/b with b > 0 and gcd(a, b) = 1.
    height: >-
      For x(2^n P) = a/b in lowest terms with b > 0, let M = max(|a|, |b|).
      If M <= 1 then h = 0 and Q_n is undefined. If M >= 2 then
      h = ln(M), hhat_n = h / 4^n, and
      lambda_{19,n} = v_19(b) * ln(19) / 4^n. Then
      Q_n = lambda_{19,n} / hhat_n, which equals v_19(b) * ln(19) / h.
      The 4^n factors cancel and must still be recorded.
    comparison: >-
      gap_cm = abs(Q_4(P_cm) - Q_4(P_n1)).
      gap_null = abs(Q_4(P_n1) - Q_4(P_n2)).
      A value within 1e-12 of 0.25, 0.10, or 0.05 is a boundary and is
      not success and not the numerical negative.
    ordinary_gate: >-
      Count #C_cm(F_19) twice, once by enumerating affine points and
      once by the Legendre sum 19 + 1 + sum_x (x^3+1 / F_19), including
      the point at infinity. The two counts must agree. Ordinary means
      the common count is not 20. A count of 20 is supersingular and
      the canonical-lift label does not apply.
    non_cm_gate: >-
      For C_n1 and for C_n2, at each q in {5, 7, 19}, compute t = q + 1 - #E(F_q)
      by the same two counters, require agreement, and set n = t^2 - 4 q.
      The square-free kernel is n / k^2 where k is the largest positive
      integer whose square divides n. If the three kernels of one model
      are identical and nonzero, that model fails the non-CM check and
      the claim is not scored.
    stability_gate: >-
      On each scored point, abs(Q_4 - Q_3) <= 0.05. A larger drift means
      the ratio is not stable under doubling.
    p17_guard: >-
      On y^2 = x^3 + 1 over F_17, count points by both counters. The
      design session's enumeration gives #E = 18 and trace 0. The
      executor repeats the count. If the common count is 18, refuse:
      do not compute Q_4 and do not emit a comparison. If the counters
      disagree or the count is not 18, the guard is void. Emitting a
      finite Q_4 for this reduction is a failure of the object
      identification.
    discriminant_gate: >-
      For each model and each q in {5, 7, 19}, 4 A^3 + 27 B^2 is nonzero
      in F_q. The design session checked the integer values 27, 31, and
      23. A zero reduction is singular and voids the cell.
    independent_arithmetic: >-
      Compute the doubling orbit twice, in two separately written
      rational implementations of the same slope formula. The reduced
      fractions x(8P) and x(16P) must agree on every model. Disagreement
      voids the cell.
    forbidden:
      - Do not search for a plane curve through lifted points.
      - Do not claim an ECDLP solution, a change in the exponent 1/2, or a revival of xedni.
      - Do not treat sqrt(6) as a height.
      - Do not score Q_4 when a gate fails.
      - Do not adjust 0.25 or 0.10 after seeing a height.

  controls:
    - id: null-null
      statement: >-
        |Q_4(P_n1) - Q_4(P_n2)| must be at most 0.10 before a CM-null
        gap can count as the predicted separation. The two nulls are
        the same shape of measurement on two non-CM models.
      pass_condition: gap_null <= 0.10 after the non-CM and stability gates
      on_fail: >-
        A larger null-null gap means the CM-null gap is not
        distinguishable from curve-to-curve variation. That is a
        negative for the claim, not a CM effect.
    - id: stability
      statement: >-
        |Q_4 - Q_3| <= 0.05 on each scored point.
      pass_condition: the inequality holds on C_cm, C_n1, and C_n2
      on_fail: >-
        A larger drift means the projection does not survive doubling.
        The claim fails. It is not a CM effect.
    - id: supersingular-refusal
      statement: >-
        y^2 = x^3 + 1 over F_17 has #E = 18 and is not scored.
      pass_condition: the executor count agrees on 18 and no Q_4 is emitted
      on_fail: >-
        Emitting a comparison, or disagreeing with the count 18, voids
        the identification. It is not a height result at p=19.
    - id: rho-constant
      statement: >-
        sqrt(6) is the j=0 automorphism factor on rho's iteration count
        from KN-TECH-018 and KR-RHO-0528e7. It is recorded and it is
        not Q_4.
      pass_condition: the reading does not set Q_4 equal to sqrt(6)
      on_fail: >-
        Treating sqrt(6) as the height share invalidates the run.

  independent_variables:
    - which of the three named models and points is doubled
    - whether the duplication index is n=3 or n=4
    - whether the second rational implementation is the checker
    - whether the prime in the guard is 19 or the refused prime 17

  metrics:
    primary:
      - id: gap_cm
        statement: >-
          abs(Q_4(P_cm) - Q_4(P_n1)), as a Decimal. The prediction is
          at least 0.25. Strictly below 0.25, with the other success
          gates passing and gap_null at most 0.10, is the negative.
      - id: gap_null
        statement: >-
          abs(Q_4(P_n1) - Q_4(P_n2)). The prediction requires this
          to be at most 0.10.
    secondary:
      - id: point_count_19
        statement: The agreed #C_cm(F_19), and whether it equals 20.
      - id: kernels
        statement: The three square-free kernels at q=5, 7, 19 for C_n1 and for C_n2.
      - id: heights
        statement: >-
          hhat_3, hhat_4, lambda_19_3, lambda_19_4, Q_3, and Q_4 on
          each scored point, plus the reduced fractions x(8P) and x(16P).
      - id: stability_gaps
        statement: abs(Q_4 - Q_3) on each scored point.
      - id: p17_refused
        statement: 1 if the F_17 count is 18 and no Q_4 was emitted, else 0.
      - id: attack_claimed
        statement: Boolean. The design-session value is false. The run value must stay false.

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 says Q_4 is an exact ratio of integer functions of a and b,
    with no random model. The branch prediction is still the numerical
    gap from IDEA-20261005-8276a8. A finished gap_cm below 0.25 with
    gap_null at most 0.10 falsifies that prediction. It does not
    falsify the exactness of the arithmetic.

  preregistered_prediction:
    quantity: >-
      The pair of absolute gaps gap_cm and gap_null at n=4 and p=19,
      after the ordinary, non-CM, stability, and p=17 gates.
    formula: >-
      gap_cm >= 0.25 and gap_null <= 0.10. A finished gap_cm < 0.25
      with gap_null <= 0.10 and the gates passing is a negative.
      A gap_null > 0.10 is a separate negative. No attack term enters
      the formula.
    source: >-
      IDEA-20261005-8276a8, prediction of an absolute CM-null gap at
      least 0.25 gated by a null-null gap at most 0.10. The Decimal
      precision and the 1e-12 boundary band are pinned here so the
      comparison does not depend on a binary float.

  scale_relevance:
    tier: toy
    justification: >-
      The cell is p=19 and n=4 on three named points. No transfer to
      a cryptographic prime, to the canonical height of order N, or
      to an ECDLP cost is claimed.
    correspondence: >-
      Direct doubling on three models over Q. No Deuring correspondence.

  tail_checks:
    - >-
      The curve equation holds at 2P, 4P, 8P, and 16P on each model,
      and gcd(a, b) = 1 for x(16P), so no cancelled factor of 19
      remains in a tail of the fraction.

  replication:
    seeds: []
    independent_instances: 2

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - Stop after the three orbits through 16P, the two counters, the kernels, and the p=17 guard.
    - Do not double to 32P.
    - Do not score a fourth model.
    - On the first disagreement of the two rational implementations, stop and mark the cell void.

  invalidation_rules:
    - A named point fails the curve equation by direct substitution.
    - A reduction at q in {5, 7, 19} is singular.
    - The two point counters disagree, or the two rational implementations disagree on a reduced x(8P) or x(16P).
    - The reading assigns success when a gate failed or when a comparison sits in the 1e-12 boundary band.
    - attack_claimed is true, or Q_4 is replaced by sqrt(6).
    - A Q_4 comparison is emitted for y^2 = x^3 + 1 over F_17.

  success_criterion: >-
    The three points lie on the named cubics, every required reduction
    is nonsingular, the two counters agree, #C_cm(F_19) is not 20, both
    nulls pass the non-CM kernel test, no scored 16P is at infinity and
    every hhat_4 is positive, abs(Q_4-Q_3) <= 0.05 on each scored point,
    the p=17 guard refuses with count 18, the two rational
    implementations agree, attack_claimed is false, gap_null <= 0.10,
    and gap_cm >= 0.25, with no comparison inside the 1e-12 boundary
    band. That is the prediction in IDEA-20261005-8276a8. Any other
    finished assignment is not success.

  falsification_criterion: >-
    The same gates pass, including gap_null <= 0.10 and a refused p=17
    count of 18, and gap_cm < 0.25. A CM-null gap smaller than one
    quarter, against nulls that agree within 0.10, falsifies a CM
    effect of Q_4 at this pin. A gap of 0, which is what happens if
    every v_19 through n=4 is 0, is this negative. A timeout, a
    counter disagreement, or an undefined height is not this negative.

  required_artifacts:
    - experiments/EXP-CANL-2e09c5/runs/RUN-*/manifest.yaml
    - experiments/EXP-CANL-2e09c5/runs/RUN-*/stdout.txt
    - experiments/EXP-CANL-2e09c5/runs/RUN-*/stderr.txt
    - experiments/EXP-CANL-2e09c5/runs/RUN-*/reading.yaml

  assigned_to: executor
  reading_rows:
    - cm_separated
    - gap_below_threshold
    - nulls_unmatched
    - unstable
    - supersingular
    - not_non_cm
    - height_undefined
    - p17_scored
    - boundary
    - void
    - failed_infrastructure
  reading_rule: >-
    reading.yaml names exactly one row. cm_separated requires the
    success criterion. gap_below_threshold requires the falsification
    criterion. nulls_unmatched is a finished valid run with
    gap_null > 0.10. unstable is abs(Q_4-Q_3) > 0.05 on a scored
    point after the ordinary and non-CM gates. supersingular is
    #C_cm(F_19) = 20. not_non_cm is a failed kernel test. 
    height_undefined covers hhat_4 = 0 or a point at infinity.
    p17_scored means a Q_4 was emitted at p=17. boundary is a
    comparison within 1e-12 of 0.25, 0.10, or 0.05. void covers a
    singular reduction, a counter disagreement, or a rational
    disagreement. failed_infrastructure covers a timeout. 
    attack_claimed stays false on every row.
