experiment:
  id: EXP-CANL-b50c7d
  hypothesis_id: H-CANL-8984c3
  derived_from_idea: IDEA-20260807-6533fd
  question_id: RQ-CANL-63098f
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Measuring the covering exponent of reductions of bounded-height global points -
    local slope against height budget on CM and non-CM curves, a CM knee hunt, an
    injectivity profile, and instrumented meet-in-the-middle entry sizes, against a
    matched random-lattice null and an exact rank-1 fixture
  objective: >-
    The one uncertainty a run reduces is whether the representation cost of a lift-based
    attack is governed by a covering exponent that behaves as the lattice count predicts,
    and whether the CM effective-rank correction is real. A run establishes, per curve
    and per prime, the count of distinct reductions and the count of enumerated points at
    each budget on a declared ladder; the local slope of the first against the budget with
    an interval; the ratio of the two, which is the injectivity profile; the empirical
    maximum canonical-minus-naive height difference; the predicted and measured location
    of the CM knee, or an explicit statement that the knee was not reachable; the measured
    bytes per stored meet-in-the-middle entry against table size; and the same quantities
    on a matched random lattice, on synthetic skew lattices, and on an exact closed-form
    rank-1 fixture. No attack is mounted, no discrete logarithm is claimed, and the
    deliverable is a quantified DEFICIT against Pollard rho rather than any advantage.
  what_this_is_not:
    - >-
      Not an attack, not a speedup, and not a lower bound on lift attacks in general. It
      measures a size exponent; a compressed representation of high-height points would
      evade the whole argument and that escape is named rather than dismissed.
    - >-
      Not an ECDLP hardness result. Nothing here bears on any deployed curve in either
      direction.
    - >-
      Not independent evidence from the sibling record IDEA-20260807-44ba75. The two share
      the lattice-count ingredient and must never be counted as two confirmations.
    - >-
      Not a crypto-scale measurement. The crypto-size rows of the identity are arithmetic
      evaluations of a formula and are labelled as such wherever they appear.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run has been
      executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope. On the tested curves, primes and budget ladder, the
      covering exponent takes stated values with stated intervals; the CM knee is or is not
      observed within a stated factor of its predicted position, or is recorded as not
      reachable; the injectivity ratio takes stated values; and the meet-in-the-middle entry
      size grows or does not grow with table size. WHAT DOES NOT FOLLOW. No lower bound on
      lift attacks of any kind; no statement about growing or correlated arity; no statement
      at cryptographic N; and no claim that the measured exponents are attainable costs for
      any real attack, since the construction cost of the global model is excluded from every
      exponent reported and dominates all of them for a generic curve.
  inputs:
    procedure: >-
      STAGE 0, zero compute, HARD GATE. Write the three lemmas - lattice count,
      height-to-bit-size comparison, saturation condition - each with a single
      responsibility, and produce the SECOND independent derivation via the index-N kernel
      sublattice. The two derivations must agree symbolically. If they do not, the contract
      is superseded rather than run.
      STAGE 1, hours, HARD GATE. The rank-1 closed-form fixture. On a rank-1 curve with a
      known generator at a named prime, the distinct-reduction count at each budget has an
      exact closed form; require EXACT INTEGER EQUALITY on the declared ladder. A mismatch
      blocks every other arm.
      STAGE 2, hours. Measure the covering exponent on at least eight curves spanning
      exhibited ranks 1 to 4, both CM with class number 1 and non-CM, at three primes each.
      Enumerate points in the declared box, compute canonical heights numerically, bin by
      budget, reduce modulo each prime, count distinct images, and fit the LOCAL slope at
      each budget rather than one global slope. Subtract torsion images before counting.
      STAGE 3, hours. The CM KNEE HUNT. On CM curves compute the predicted knee budget and
      check whether the measured local slope steps at that location. If no curve places the
      predicted knee inside the reachable budget range, RECORD THE ARM AS NOT TESTABLE
      rather than reporting a null result.
      STAGE 4, hours. The NULL and NEARBY-OBJECT arms. A random lattice of matched rank and
      regulator with a random surjection onto the cyclic group of order N, expected to
      reproduce beta and expected NOT to reproduce the knee. At least two synthetic skew
      lattices, where a uniform rank-over-two answer would be refuted.
      STAGE 5, hours. A small meet-in-the-middle at toy N with table size well below the
      birthday point, measuring actual stored bytes per entry against table size. Extrapolate
      nothing; report the measured growth.
      STAGE 6, zero compute. Charge both exponents against parallel rho and against BSGS in
      the FULL bit-cost model, and report the tradeoff curve rather than only the balanced
      point.
    instrument: >-
      Python 3.11 with numpy and exact integer arithmetic for the fixture; canonical heights
      computed numerically with a declared precision and the precision recorded per
      measurement. A new standalone driver under experiments/EXP-CANL-b50c7d/driver/ performs
      enumeration, height computation, reduction, distinct-image counting, local slope fitting
      with intervals, and the instrumented meet-in-the-middle with per-entry byte accounting.
      Nothing under harness/ is modified. Recorded through harness/runner.py.
    parameters: >-
      At least eight curves over the rationals of exhibited rank 1 to 4, both CM with
      discriminant absolute value in {3, 4, 7, 8, 11} and class number 1, and non-CM; three
      primes per curve. Enumeration box over points with x written as u over w squared with
      the bounds on u and w declared before the run and identical across arms. A budget ladder
      declared before the run and identical across arms. Numerical height precision declared
      and recorded. Meet-in-the-middle table sizes on a declared ladder, all well below the
      birthday point.
  controls:
    - >-
      RANK-1 CLOSED-FORM POSITIVE CONTROL, mandatory and blocking. The distinct-reduction
      count has an exact integer closed form; exact equality is required on the whole ladder.
      An instrument that cannot match a closed form cannot measure a slope.
    - >-
      NULL OBJECT, MANDATORY AND BLOCKING. A random lattice of matched rank and regulator with
      a random surjection onto the cyclic group of order N - an object of exactly the same
      shape whose arithmetic content is empty. It is EXPECTED to reproduce beta, and that
      expectation is recorded in advance so a match is a passing control rather than a
      disappointment. It must NOT reproduce the CM knee; if it does, the measurement has no
      arithmetic content at all.
    - >-
      NEARBY-OBJECT CONTROL. At least two synthetic skew lattices of nominal rank r that are
      nearly rank-1 in the metric sense, where the distinct-reduction slope should be far below
      rank over two. A method returning rank over two on them is not responding to lattice shape.
    - >-
      DECAY CONTROL. The covering fraction at FIXED budget must decay with N with slope minus
      one. A covering fraction that fails to decay is the canonical artifact tell and indicates
      the enumeration is finding torsion or twist-related images; no exponent may be reported.
    - >-
      TORSION AND TWIST EXCLUSION. Torsion reduces to a fixed small set present at every budget
      and is subtracted before counting, or the distinct-reduction count carries a spurious
      constant.
    - >-
      MATCHED BASELINES. Parallel Pollard rho and BSGS charged in the same bit-cost model on
      the same N, so the deficit is stated against something rather than asserted.
    - >-
      IDENTICAL BOX AND LADDER ACROSS ARMS, since the enumeration samples a naive-height box
      rather than a canonical-height ball and the distortion must be common to signal and null.
  independent_variables:
    - exhibited Mordell-Weil rank, at 1 through 4
    - 'curve type: CM with class number 1 / non-CM'
    - reduction prime, three per curve
    - height budget along the declared ladder
    - 'arm: genuine curve / random-lattice null / skew-lattice nearby object / rank-1 fixture'
    - meet-in-the-middle table size
  metrics:
    primary:
      - >-
        Distinct-reduction count and enumerated-point count per curve, prime and budget, both
        integers. Computed by enumerating the declared box, computing canonical heights,
        filtering by budget, reducing, and counting distinct images with torsion subtracted.
      - >-
        Covering exponent beta, dimensionless, computed as the LOCAL slope of log
        distinct-reduction count against log budget at each ladder point, with an interval
        from the seed and prime spread. Reported as a profile, never as one global fit.
      - >-
        CM knee location, in budget units, predicted and measured, or the literal value
        not_testable when the predicted knee lies outside the reachable range.
      - >-
        Injectivity ratio, dimensionless, computed as distinct-reduction count divided by
        enumerated-point count within budget.
      - >-
        Measured bytes per stored meet-in-the-middle entry against table size, in bytes.
    secondary:
      - >-
        Empirical maximum of canonical height minus half the naive height per curve, which
        measures rather than assumes the comparison constant.
      - >-
        Covering fraction at fixed budget against N, whose slope must be minus one.
      - >-
        Null-arm and skew-arm beta profiles and knee readings.
      - >-
        Full-cost time and memory exponents for the meet-in-the-middle, derived from the
        measured entry size and the model, each labelled DERIVED and never MEASURED.
      - >-
        Matched rho and BSGS costs in the same bit-cost model.
      - >-
        Every observed reduction collision with BOTH preimages, since a collision below the
        birthday point is the reopening signal and a count alone would hide it.
      - >-
        Numerical height precision used, and the count of points excluded for precision reasons.
  heuristic_under_test: HEUR-CANL-B2
  heuristic_under_test_note: >-
    HEUR-CANL-B1, the injectivity heuristic, is validated by the SAME run through the
    injectivity-ratio metric and its collision tail check. Two heuristics are validated here;
    the field names the one whose failure would change the hypothesis's threshold conclusion.
  preregistered_prediction:
    quantity: >-
      The covering exponent beta as a function of exhibited rank on the non-CM arm; the CM knee
      location; the injectivity ratio below the birthday point; and the growth of bytes per
      meet-in-the-middle entry against table size.
    formula: >-
      Predicted beta equal to r over 2 with a fit interval excluding r over 2 plus or minus
      0.4, measured on at least four ranks. Predicted CM knee at the budget where the companion
      lattice directions enter the ball, within a factor 3. Predicted injectivity ratio one
      minus a vanishing quantity while the enumerated count is far below the square root of N,
      with a collision count above it matching the birthday expectation. Predicted bytes per
      entry growing like table size to the power two over r. Under the null that beta measures
      lattice shape only, the random-lattice arm reproduces beta EXACTLY - which is expected and
      is a passing control - but does NOT reproduce the knee; if it reproduces the knee too, the
      measurement has no arithmetic content.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-6533fd, predictions block and
      heuristic_assumptions, written before any run under this contract exists. The
      lattice-point asymptotic is shared with IDEA-20260807-44ba75 and is cited from there;
      the height-comparison bound is RECALLED and NOT READ, and its constant is measured here
      rather than taken on trust.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at toy N with height budgets small enough to enumerate exhaustively, because the
      quantity of interest is a LOCAL SLOPE and a slope is measurable long before saturation is
      reachable. The regime an actual attack would need - saturation, where the covering exponent
      falls to zero - is UNREACHABLE at any budget here, and that limitation is stated rather than
      hidden. Sample-size justification for the injectivity arm: at least ten to the fifth
      enumerated points per curve, so that the birthday-scale collision count predicted above the
      threshold is comfortably larger than one and its absence below the threshold is
      informative. Transfer assumption: none is asserted. The crypto-size rows in any deliverable
      are arithmetic evaluations of the identity and are labelled as such.
    correspondence: null
  tail_checks:
    - >-
      Report EVERY observed reduction collision with both preimages and the budget at which it
      occurred, since one structured collision below the birthday point is the reopening signal
      and a summary count would erase it.
    - >-
      Report the local slope in the single ladder decade around the predicted CM knee separately
      from the global fit, because a knee is exactly what a global fit averages away.
    - >-
      Report the smallest and largest enumerated canonical height per curve against the box
      bounds, so a box that truncates the distribution is visible.
    - >-
      Report the empirical maximum canonical-minus-naive height difference per curve, since it is
      additive in the budget and dominates at small budgets, which is the reason only slopes are
      interpreted.
    - >-
      Report the count of points excluded for numerical precision, since silent exclusion at the
      low end would bias every slope upward.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 8.0
    maximum_memory_gb: 32
    maximum_runs: 40
  stopping_rules:
    - >-
      Halt if Stage 0's two independent derivations disagree; the contract is superseded rather
      than run.
    - >-
      Halt if the rank-1 closed-form fixture fails exact integer equality anywhere on the ladder.
    - >-
      Record the CM knee arm as NOT TESTABLE, and stop it, if no available curve places the
      predicted knee inside the reachable budget range. Do not extend the box to force it, and do
      not report the absence as a null.
    - >-
      Stop the meet-in-the-middle at the declared table-size ladder; larger tables are outside
      this contract.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop,
      never a negative result, under AGENTS.md rule 5.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence.
    - >-
      A run whose random-lattice null or skew-lattice control was not executed in the same
      invocation as the signal arm is invalid_measurement.
    - >-
      A run whose covering fraction at fixed budget does not decay with N is invalid_measurement -
      the enumeration is finding torsion or twist images and no exponent from it is interpretable.
    - >-
      A run whose enumeration box or budget ladder differs between arms is invalid_measurement,
      because the box distortion must be common to signal and control.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT experiment and requires a
      new contract; it is never a repair of this one.
  success_criterion: >-
    The run is successful when the Stage 0 derivations agree, the rank-1 fixture reproduces
    exactly, and the run reports the beta profile with intervals on at least four exhibited ranks,
    the CM knee as predicted-and-measured or as not_testable, the injectivity profile with every
    collision listed, the measured bytes-per-entry curve, the null and skew arms from the same
    invocation, the empirical height-comparison constant per curve, and both full-cost exponents
    charged against rho and BSGS in the bit model. Success means a DECIDABLE run. H-CANL-8984c3
    is confirmed only if, in addition, beta tracks rank over two within the stated interval, the
    CM knee is observed within a factor 3 and is NOT reproduced by the null, injectivity holds
    below the birthday point, and bytes per entry grow rather than staying flat.
  falsification_criterion:
    - >-
      No CM knee on a curve where one is predicted and reachable. Limb B2 and HEUR-CANL-B2 are
      FALSE; the CM effective-rank halving is withdrawn and the representation threshold moves
      back to the lower arity. A genuine negative, recorded as one.
    - >-
      The injectivity ratio falls below 0.5 while the enumerated count is still far below the
      square root of N. HEUR-CANL-B1 and limb B3 are REFUTED; structured non-injectivity exists
      and REOPENS the lane. Requires independent replication before anything is claimed from it.
    - >-
      beta does not track rank over two across ranks. Limb B1 is UNVALIDATED, not refuted - the
      lattice count is inapplicable at reachable budgets - and the record must state which of the
      two it is rather than reporting the identity as confirmed.
    - >-
      The random-lattice null reproduces the CM KNEE. The measurement has no arithmetic content
      and that is the reported finding. The null reproducing beta alone is a PASSING control and
      is not this outcome.
    - >-
      Bytes per meet-in-the-middle entry are flat against table size. Limb B4 is UNVERIFIED rather
      than refuted; the full-cost exponents may be reported only as derivations.
    - >-
      The rank-1 fixture fails, the covering fraction fails to decay with N, or the skew-lattice
      control returns rank over two. INSTRUMENT FAILURE; the run set is invalid, not negative.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model and
      inference block, environment, enumeration box bounds, budget ladder and height precision.
    - >-
      The Stage 0 lemma decomposition and the second, kernel-sublattice derivation, written before
      the first run and hashed.
    - >-
      raw-result.json carrying every per-curve, per-prime, per-budget count, not summaries.
    - >-
      Every observed reduction collision with both preimages.
    - >-
      The null-arm and skew-arm measurements, in the same file as the signal arm.
    - >-
      The rank-1 closed-form fixture with its exact expected integer sequence.
    - >-
      The instrumented meet-in-the-middle byte accounting per table size.
    - >-
      The matched rho and BSGS bit-model baselines.
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution, and under this engagement approval is the
      USER's gate because it authorizes execution and spends compute. This contract is
      review_required and is NOT approved; approved_by is null and execution_authorized is false.
    - >-
      This hypothesis is proof-oriented and carries a proof_search_map. Its bottleneck, baseline
      embedding, observation collision, quantifier order, method ceiling and nearby-object control
      must be audited before implementation or expensive stages are approved, per KN-TECH-080.
      Stage 0 and Stage 1 are the executable part of that audit and are hard gates.
    - >-
      The asymptotic_claim block asserts a DEFICIT rather than an improvement. No transition toward
      supported as a complexity improvement is available from this contract and none may be sought;
      the four promotion gates therefore do not apply and must not be invoked to elevate it.
  derivation_provenance:
    tool: coordinator subagent, design-experiment step
    source_record: IDEA-20260807-6533fd
    authored_at: '2026-08-25'
    note: >-
      Stages, controls, metrics, predictions and falsification conditions are taken from the parent
      proposal's mechanism, minimal_test, predictions and heuristic_assumptions blocks and restated
      as contract fields. The requirement that the knee arm be recorded not_testable rather than
      null when unreachable, the requirement that every collision be listed with both preimages, and
      the separation of DERIVED from MEASURED in the full-cost exponents are coordinator additions.
      Budgets come from the parent's declared medium implementation and medium compute.
  derivation_gaps:
    - >-
      The enumeration box bounds are not supplied by the parent and must be fixed before approval.
      A box chosen after seeing a slope would make the slope an artifact of the box.
    - >-
      The numerical precision for canonical height computation is unspecified. Too little precision
      silently drops low-height points and biases every slope upward; the precision and the count of
      exclusions are therefore both required metrics.
    - >-
      Whether any available CM curve places the predicted knee inside a reachable budget range is
      UNVERIFIED at authoring time. The parent's own honest prior puts this near one in three. If
      none does, the most consequential arm of the contract does not run, and the contract requires
      that be recorded as not_testable rather than as a null.
    - >-
      The regulator is computed from exhibited generators, which may generate a finite-index
      sublattice. This shifts intercepts but not slopes; the contract therefore interprets only
      slopes, and a deliverable quoting an intercept would be outside its scope.
    - >-
      The construction cost of the global model is excluded from every exponent reported here and
      dominates all of them for a generic curve. Any downstream use of these exponents as attack
      costs must add it back, and this contract does not measure it.
