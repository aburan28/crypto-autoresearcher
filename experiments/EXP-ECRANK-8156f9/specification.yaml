experiment:
  id: EXP-ECRANK-8156f9
  hypothesis_id: H-ECRANK-ef097f
  version: 1
  recorded_at: '2026-09-09'
  designed_by: TASK-20260909-a4da3d
  converts_idea: IDEA-20260829-173a32
  opening_decision: DEC-20260908-84d015
  title: >
    The degree-8 rung with the base curves that now exist: run the k = 3 and
    k = 4 coset optimisation of H-ECRANK-f2a2f7 on the committed certified
    rank-12/13 base curves (plus a matched rank-3/4 arm), reproduce the
    committed degree-8 control exactly before any new number is believed,
    and measure the separability of the non-base coset contribution T_k
    from the base rank, producing the C2 base-rank number for
    GOAL-ECRANK-002.
  status: approved
  approved_by: coordinator
  approval_note: >
    APPROVED 2026-09-09 by the Coordinator under AGENTS.md standing
    user authorization of 2026-09-06 ('all is approved. ideas/
    experiments should be always approved'), recorded in
    DEC-20260909-9ce59b. Protocol completeness checked before this
    mark (full checklist in that decision): objective with decidable
    positive and negative outcomes, inputs, controls C1-C8,
    independent variables, primary/secondary metrics, seeds (frozen
    20260909 for bootstrap and permutation), budget (4 runs, per-run
    wall clock table, 8 GB, 8 workers), stopping and invalidation
    rules, decidable success and falsification criteria, and required
    artifacts are all present. Exactly three gate fields change
    (status, approved_by, approval_note); every protocol field is
    untouched. Executor handoff: TASK-20260909-a4da3d. Any later
    protocol change is a versioned protocol_amendment under
    experiments/EXP-ECRANK-8156f9/amendments/, never an edit of this
    frozen contract; executed runs are never re-scored. PRE-APPROVAL
    NOTE, PRESERVED VERBATIM: "DESIGNING IS NOT APPROVING. This frozen
    contract sits at approved_by null, status review_required.
    Approval requires a committed Coordinator decision in a later step
    under the standing user authorization of 2026-09-06 ('all is
    approved. ideas/experiments should be always approved'); no run of
    this experiment is authorized until then. Protocol completeness as
    of this design, checked before this mark: objective with decidable
    positive and negative outcomes, inputs, controls C1-C8,
    independent variables, primary/secondary metrics, seeds (frozen
    20260909 for bootstrap and permutation), budget (4 runs, per-run
    wall clock table, 8 GB, 8 workers), stopping and invalidation
    rules, decidable success and falsification criteria, and required
    artifacts are all present. Any later protocol change is a
    versioned protocol_amendment under
    experiments/EXP-ECRANK-8156f9/amendments/, never an edit of this
    frozen contract, and executed runs are never re-scored."
  successor_of: null
  objective: >
    Decide, with possible negative outcomes, (M-A) whether the committed
    coset pipeline still reproduces the committed degree-8 control
    exactly - per-class profile on the committed control classes and the
    committed best total 20 over the full 11,811-coset enumeration - so
    that every downstream number is read on a verified instrument; (M-B)
    what the best k = 3 and k = 4 certified totals are over the frozen
    32-base set and the full coset enumeration, against the committed 20
    and 32, with the base-rank transfer quantified (P1, P4); (M-C) the
    separability slope beta of T_3 on base rank across the frozen rank
    strata, with interval (P2); and (M-D) the derived base rank R* that
    would be needed for a k = 3 total of 31 from the measured coset
    structure, with bootstrap interval (P3) - the number GOAL-ECRANK-002
    completion criterion C2 names.
  inputs:
    mechanism_source: >
      H-ECRANK-ef097f (statement, mechanism, assumptions, P1-P4, HA-1,
      HA-2, proof_search_map) and
      ledger/proposals/IDEA-20260829-173a32.yaml (claim, mechanism,
      lossy projection test, controls, cost model). The coset
      optimisation is the one of H-ECRANK-f2a2f7 as executed by the
      committed engine of EXP-ECRANK-e1e30e.
    solver: >
      The committed descent engine, ported from
      experiments/EXP-ECRANK-e1e30e/source/twist_family.py (PARI ellrank
      via cypari, per-twist alarm, certified = min(r_low, points
      exhibited), timeout = (-1,-1,[]) counted as timed_out, never rank
      0), with the committed support and class arithmetic (class_value,
      subspaces enumeration). Points found by PARI are NEVER trusted
      from it: every point entering a total is re-checked on-curve and
      non-torsion by the committed independent pure-Python verifier
      (experiments/EXP-ECRANK-e1e30e/source/verify_certificate.py) that
      did not find the point. NO Magma, NO network. Floating point is
      permitted ONLY inside the committed regulator discipline for
      within-class multiplicity (weakness labelled per class); it never
      enters the exact column and never enters a verdict by itself.
    committed_inputs:
      - path: coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-a7a9e8/highrank_pool.json
        role: high-rank base curves (1206 curves, certified rank lower bounds, histogram 13x2, 12x29, 11x425, 10x150, 9x300, 8x150, 7x150; committed selection rule, file order is the frozen file order)
      - path: coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/tasks/TASK-20260822-81141a/certified_curves.json
        role: the rank-12 pencil curve (a-invariants [0, 0, 0, -518228207838672723, 141005837549331272675978478], certified rank 12, EV-ECQ-0d142e). READ ONLY, another goal's artifact.
      - path: experiments/EXP-ECRANK-e1e30e/runs/RUN-ECRANK-e1e30e-001/pool.json
        role: the committed 497-entry pool (rank 4 x2, rank 3 x495) for the matched rank-3/4 arm; file order is the frozen file order
      - path: experiments/EXP-ECRANK-e1e30e/certificates/cert_deg8_control.json
        role: the committed degree-8 control, the regression target of R1
      - path: experiments/EXP-ECRANK-e1e30e/source/twist_family.py
        role: the committed descent engine and subgroup enumeration (READ; ported, not re-derived, so the regression control is meaningful)
      - path: experiments/EXP-ECRANK-e1e30e/source/verify_certificate.py
        role: the committed independent exact verifier for the best-coset certificates (READ; the implementation that must NOT be the producer)
    frozen_base_set: >
      Exactly 32 base curves, frozen by the rules below; file order is
      the order of the committed file as of the design commit.
      (1) rank-13, 2 curves: the two entries of highrank_pool.json with
      certified_rank 13, curve_id m10+extra#-20_-16_-14_-13_-7_-6_2_3_14_19
      (min_ainv [1, 0, 0, -10735733389588488545,
      13386166243940268673745678025]) and m10+extra#-12_5_6_7_9_10_11_13_14_17
      (min_ainv [1, -1, 1, -97623025006346669, 342379984015184906117269]).
      (2) rank-12, 10 curves: the EV-ECQ-0d142e pencil curve from
      certified_curves.json, plus the FIRST 9 entries in file order of
      highrank_pool.json with certified_rank 12. (3) rank-11, 10
      curves: the FIRST 10 entries in file order of
      highrank_pool.json with certified_rank 11. (4) rank-4, 2 curves:
      the FIRST 2 entries in file order of pool.json with rank 4 (j =
      -37933056/545723 and -1404928/797611). (5) rank-3, 8 curves: the
      committed degree-8 control base (a-invariants [0, -1, 1, 8, -50],
      j = 49836032/989531, which is itself an entry of pool.json) plus
      the FIRST 7 entries in file order of pool.json with rank 3,
      excluding the control base. The committed certified base rank
      base_rank(E) is read from the named committed file for every base
      (pool.json rank field, highrank_pool.json certified_rank field,
      certified rank 12 for the pencil curve); it is NEVER re-derived by
      a fresh descent.
    frozen_support: >
      S = {-1, 2, 3, 5, 7, 11, 13}, the committed DEFAULT_SUPPORT of the
      engine. It spans an F_2 space of dimension 7: 128 squarefree
      classes total, 127 nontrivial, indexed by masks 0..127 in the
      committed class_value order (mask bit i selects the i-th element
      of S). The mask-0 class (d = 1) is the base curve itself.
    frozen_alarms: >
      R1 regression: time_limit 20 s per twist, the committed
      build_certificate alarm. R2 primary arm: time_limit 30 s. R3
      censoring arm: time_limit 240 s on the frozen subsample only. No
      other alarm value is used anywhere in this experiment.
    frozen_subsample: >
      The R3 censoring arm descends, per base, exactly the 10 nontrivial
      classes at mask indices 12, 24, 36, 48, 60, 72, 84, 96, 108, 120
      (the mask indices i congruent to 0 mod 12 with 1 <= i <= 127), at
      time_limit 240 s. 32 bases times 10 classes = 320 descents.
    frozen_seeds: >
      The bootstrap of P3 resamples cosets with replacement, 10,000
      resamples, seed 20260909. The HA-2 permutation test uses at least
      2,000 permutations, seed 20260909. No other randomization exists
      in this experiment; all enumeration is deterministic.
    stated_exact_facts: >
      Machine-verified at design time 2026-09-09 (exact arithmetic and
      PARI cross-check), to be RE-VERIFIED exactly at run start before
      any verdict is read: F1, the number of order-8 subgroups of F_2^7
      is 11,811 and the number of order-16 subgroups is 11,811
      (Gaussian binomial [7,3]_2 = [7,4]_2 = 11,811); the support S
      spans 128 classes, 127 nontrivial. F2, the committed control
      coset V = {-154, -105, -66, -5, 1, 21, 330, 770} has squarefree
      kernel set {1, 5, 21, 66, 105, 154, 330, 770}, is closed under
      product modulo squares, and is generated by 5, 21, 66. F3, the
      control base short model y^2 = x^3 + 9936x - 2200176 and the
      minimal model [0, -1, 1, 8, -50] are Q-isomorphic, both with
      j = 49836032/989531, minimal discriminant -989531, short-model
      discriminant -2153993601724416. F4, the frozen base set is 32
      pairwise distinct curves (21 high-rank pool entries distinct by
      curve_id; the pencil curve is absent from highrank_pool.json; the
      9-curve 502-arm distinct by j including the control base). F5,
      the committed pool histograms support the selection rules
      (13: 2 >= 2 needed; 12: 29 >= 9 needed; 11: 425 >= 10 needed;
      502 pool: 2 rank-4 >= 2 needed and 495 rank-3, of which 494
      excluding the control base, >= 7 needed). Any mismatch between a
      stated fact and its exact recomputation is a SPEC DEFECT, the
      affected run is invalid, and the correction goes through a
      versioned amendment.
  runs:
    - id: R1
      name: regression_and_admission
      description: >
        Executed FIRST, stop condition on any mismatch. (a) Profile the
        committed control base (a-invariants [0, -1, 1, 8, -50]) at
        time_limit 20 s over the frozen support, all 128 masks in mask
        order. For the 8 committed control classes d in {1, -5, 21,
        -105, -66, 330, -154, 770} the recomputed entry (pari_r_low,
        pari_r_high, canonical point set) must match the committed
        cert_deg8_control.json entry EXACTLY, and timed_out must be
        false for all 8 (the committed control had timed_out_classes
        0). (b) Enumerate all order-8 and order-16 subgroups of the
        class space: exactly 11,811 and 11,811, each verified closed
        under product, canonicalised as the sorted tuple of nonzero
        squarefree kernels. (c) Run the coset optimiser over all
        11,811 order-8 subgroups on the control base profile: the best
        total_mult must be EXACTLY 20, achieved by the committed coset
        (all achieving cosets are listed), and the best total_exact
        must be EXACTLY 8, achieved by the committed coset (all
        achieving cosets listed). More is a bug, less is a bug.
    - id: R2
      name: primary_measurement
      description: >
        For each of the 32 frozen bases: profile the 127 nontrivial
        classes at time_limit 30 s in mask order; the mask-0 entry is
        the committed base certificate (curve, certified base rank,
        exhibited points), never a fresh descent (C2). For every base,
        the full coset optimisation over all 11,811 order-8 and all
        11,811 order-16 subgroups, per coset: total_exact (number of
        classes of V carrying at least one certified point, each class
        counted at most once), total_mult (base_rank at d = 1 plus the
        certified per-class exhibited-point multiplicities for d != 1,
        within-class independence by the committed regulator
        discipline, certificate kind per class, weakest kind per
        coset), and T_3 = total_mult - base_rank for order-8 cosets.
        Per base: best coset per k and per column with the coset
        exhibited, and the population mean/median over all cosets.
        Global: P1 (best k = 3 total, both columns, argmax (E, V)),
        P4 (best k = 4 total, both columns, argmax (E, V)). P2: OLS of
        best-coset T_3 and of median-coset T_3 on the committed base
        rank across the 32 bases, slope beta with 95 percent Wald
        interval. P3: for each of the 22 bases of rank >= 11, R*_E =
        31 - (best-coset T_3 for that base); R* = the median of the
        22 values; bootstrap interval by resampling the 11,811 cosets
        of each base with replacement (10,000 resamples, seed
        20260909, best coset per resample). HA-1: rank histogram per
        stratum (3-4, 11, 12, 13) against the pooled distribution by a
        chi-squared test on binned ranks; tail check, the maximum twist
        rank per stratum and the count of twists of rank >= 5 (the
        committed 364,756-twist scan found none).         HA-2: per coset,
        mean certified rank of the generator classes versus the
        product classes, where the generator classes are the k
        elements of the coset's CANONICAL BASIS - the unique
        row-echelon basis over F_2 of the coset's mask matrix with
        rows in ascending mask order - and the         product classes are the
        remaining 2^k - 1 - k nonzero elements (for order-8 cosets,
        the 3 pairwise sums of distinct basis elements plus the
        single triple sum);
        permutation test over cosets, at least 2,000 permutations,
        seed 20260909; falsifying threshold 0.3 rank units. C4, C5, C6 as
        frozen. Finally, for the global best (E, V) at k = 3 and at
        k = 4 on the total_mult column: build the certificate file in
        the committed format and run it through the committed
        independent exact verifier (verify_certificate.py); the result
        must be zero errors, or the P1/P4 total is reported as a
        computed total with the certificate claim closed as failed.
    - id: R3
      name: censoring_arm
      description: >
        The frozen 320-descent subsample at time_limit 240 s. Per base:
        completion at 30 s (from R2) versus 240 s on the 10 frozen
        classes; the censoring slope; totals computed over COMPLETED
        descents only, with the denominator, at both alarm settings;
        Spearman correlation between the log of the maximum absolute
        base-coefficient and timeout, per base and pooled, at both
        alarms. The committed measured correlation of +0.765
        (EV-ECQ-0d142e) is the anchor.
    - id: R4
      name: replay
      description: >
        Fresh process. Re-run the ENTIRE R2 statistics pipeline (coset
        optimisation, P1-P4 quantities, HA-1/HA-2 tests, bootstrap,
        permutation) from the committed R2 raw tables, NO new
        descents. Every reported number must be bit-identical to R2.
  controls:
    - id: C1
      control: >
        exact baseline, regression on the committed degree-8 control.
        R1 must reproduce the committed per-class entries on the 8
        committed classes and the committed best totals 20 (mult) and
        8 (exact) over the full 11,811-coset enumeration, with the
        committed coset among the achievers. Executed FIRST, before
        any other reading. Failure voids ALL runs of this experiment
        and stops it; more is a bug, less is a bug.
    - id: C2
      control: >
        null class. For EVERY base, the mask-0 entry must equal the
        committed base certificate (curve invariants, certified base
        rank, exhibited point count), and the optimiser must count the
        d = 1 class exactly once, as base_rank, never as a second
        independent copy. A pipeline that counts the trivial class
        twice inflates every total by the base rank, which at base 13
        is most of the gap to 31 - so this control is not ceremonial.
        The invariant total_mult(V) = base_rank + sum over d in V, d !=
        1, of mult(d) is audited per coset.
    - id: C3
      control: >
        coset degeneracy and subgroup validity. Every enumerated
        subgroup passes product-closure verification modulo squares
        (all pairwise products of elements lie in the subgroup); the
        canonical form is the sorted tuple of nonzero squarefree
        kernels; the count of rejected degenerate candidates is a
        required metric (expected 0 from a subspace enumeration, but
        the check runs and its count is archived).
    - id: C4
      control: >
        censoring audit, the confound most likely to manufacture P1's
        shortfall. Report the timeout rate per base and per alarm; the
        Spearman correlation between log maximum absolute
        base-coefficient and timeout, per base and pooled; the totals
        over completed descents only, with the denominator. The new
        bases have systematically larger coefficients (the committed
        correlation is +0.765), so this arm exists to separate a real
        shortfall from an instrumental one.
    - id: C5
      control: >
        selection over cosets. The best total over many enumerated
        cosets is an order statistic and grows with the number
        enumerated. The number of cosets evaluated per base is frozen
        and equal across all bases and arms (11,811 at k = 3 and
        11,811 at k = 4), and every headline order statistic is
        reported beside the coset-population mean, median, and count.
    - id: C6
      control: >
        mixed certificate kinds. If some classes use the exact
        point-verification route and others fall back on the committed
        regulator discipline, the resulting total has mixed strength.
        The certificate kind is recorded per class, every rung total
        carries the WEAKEST kind used anywhere in it, and the exact
        column (eigenspace-only, no regulator) is always reported
        beside the regulator-assisted column.
    - id: C7
      control: >
        synthetic known-answer controls for the optimiser, run inside
        R1 after the regression. Two frozen synthetic profiles over
        the 127 nontrivial classes, base rank 3. (i) UNIFORM: every
        nontrivial class certified rank 2. The best order-8 total_mult
        must be exactly 3 + 7*2 = 17, achieved by ALL 11,811 cosets
        (all tie), and the best total_exact exactly 8.         (ii) PLANTED:
        one fixed nontrivial class d* (frozen: the class d = 11, mask
        index 32) at certified rank 5, every other nontrivial class at
        2.
        The best order-8 total_mult must be exactly 3 + 5 + 6*2 = 20,
        achieved by EXACTLY the 651 cosets containing d* (the number
        of order-8 subgroups of F_2^7 containing a fixed nonzero class
        equals [6,2]_2 = 651, stated exact fact, re-verified at run
        start), and the best total_exact exactly 8. Any other answer
        is an optimiser bug and voids the run.
    - id: C8
      control: >
        determinism, replay. R4 reproduces every R2 reported number
        bit-identically from the committed R2 raw tables in a fresh
        process, no new descents. No wall-clock, pid, dict-order, or
        scheduling dependence in any reported quantity. Failure voids
        the R2 and R3 readings (the raw tables remain as records).
  independent_variables:
  - the base curve (the frozen 32, across rank strata 3, 4, 11, 12, 13)
  - the field degree rung (k = 3, order-8 subgroups; k = 4, order-16 subgroups)
  - the descent alarm (20 s regression, 30 s primary, 240 s censoring arm)
  - the certificate column (exact eigenspace-only; regulator-assisted with per-class kind)
  metrics:
    primary:
    - name: P1_best_k3
      definition: >
        the best k = 3 total over all 32 bases and all 11,811 order-8
        cosets, both columns (total_exact, total_mult), with the
        argmax (E, V) exhibited, the committed base rank, and the
        coset-population mean and count beside the order statistic.
    - name: P2_beta
      definition: >
        the OLS slope beta of T_3 on the committed base rank across the
        32 bases, for both the best-coset and the median-coset
        variants, each with its 95 percent Wald interval and n = 32.
    - name: P3_Rstar
      definition: >
        R*, the base rank needed for a k = 3 total of 31, computed as
        the median over the 22 bases of rank >= 11 of
        (31 - best-coset T_3 for that base), with the bootstrap 95
        percent percentile interval (10,000 resamples, seed 20260909)
        and its width, plus the per-base table.
    - name: P4_best_k4
      definition: >
        the best k = 4 total over all 32 bases and all 11,811
        order-16 cosets, both columns, with the argmax (E, V)
        exhibited, beside the coset-population mean and count and the
        committed 32.
    - name: regression_status
      definition: >
        R1 pass/fail with the exact per-class comparison table and the
        achieving-coset lists for totals 20 and 8.
    secondary:
    - per-base best k = 3 and k = 4 totals (both columns) with the coset exhibited
    - per-base coset-population statistics (mean, median, max) at each k
    - per-stratum (3-4, 11, 12, 13) rank histogram per the frozen binned-rank scheme, the chi-squared statistic against the pooled distribution, and the per-stratum maximum twist rank
    - the count of twists of rank >= 5 anywhere in the frozen set, with their (base, class) pairs
    - HA-2 generator-class mean versus product-class mean, the permutation p-value, and the maximum of each
    - per-base and pooled timeout rates per alarm, and the Spearman correlation of log maximum coefficient size with timeout at both alarms
    - the certificate-kind ledger per class and the weakest kind per reported rung
    - the C3 degenerate-candidate count and the C7 synthetic-control results
    - per-run descent ledger (attempts, completed, timed_out) and wall_seconds per run, internal monotonic AND timestamp span, both reported, and peak_rss_bytes per run
  heuristic_under_test: >
    HA-1 (separability of twist ranks from base rank) and HA-2
    (product classes generic), both carried from
    ledger/proposals/IDEA-20260829-173a32.yaml, status unverified.
    This experiment is their pre-registered validation: P2 is the
    HA-1 test, the per-stratum histograms and tail checks are the
    HA-1 distribution check, and the HA-2 comparison with its
    permutation test is the product-class check. No certified total
    depends on either heuristic.
  heuristics_stated_exactly:
    - >
      HA-1, from H-ECRANK-ef097f (carried from
      IDEA-20260829-173a32, internal provenance): fix a base curve
      E/Q and let d range over the squarefree integers supported on
      S = {-1, 2, 3, 5, 7, 11, 13}, excluding the trivial class. The
      ranks rank E^(d)(Q) are modelled as INDEPENDENT draws from a
      single distribution D(E) depending on E only through quantities
      that do NOT include rank E(Q); the conditional expectation of
      T_k is (2^k - 1) times the mean of D(E), independent of rank
      E(Q). The proven bound fixing the quantity is the exact
      multiquadratic decomposition; the unconditional Bhargava-Shankar
      cap bounds the mean from above; the classical distribution
      half (Goldfeld / Katz-Sarnak for twist families, Delaunay /
      Poonen-Rains) is CONJECTURAL and the gap is declared. Validation
      is P2, the stratum histograms, and the rank >= 5 tail check.
    - >
      HA-2, from H-ECRANK-ef097f (carried from
      IDEA-20260829-173a32, internal provenance): the 2^k - 1 - k
      product classes of a subgroup V generated by k classes are
      modelled as behaving like GENERIC square classes with respect to
      twist rank, so selection for high twist rank confers no advantage
      on the products. The algebraic fact that V must be a subgroup is
      proven; the modelling content is the independence of the
      products from the selected generators. Validation is the
      generator-versus-product mean comparison with the frozen
      permutation test and the 0.3-rank-unit falsifying threshold.
  preregistered_prediction:
    written_before_any_run: '2026-09-09 (this frozen contract; no run of this experiment exists)'
    never_adjusted_afterward: >
      This prediction is part of the frozen contract. Any later
      change requires a versioned protocol_amendment in
      experiments/EXP-ECRANK-8156f9/amendments/ and creates a new
      record; it is never an edit of this field, and runs already
      executed are never re-scored against the new one.
    quantity: >
      P1, the best k = 3 total (regulator-assisted column) over the
      frozen search space, predicted in the interval [26, 30], an
      increase over the committed 20 but a FALL SHORT of 31. P2, the
      separability slope beta not distinguishable from 0, predicted
      |beta| < 0.5 with the 95 percent interval excluding |beta| >
      1.0. P3, R* a finite number with bootstrap interval width under
      6 rank units. P4, the best k = 4 total (regulator-assisted) at
      least 38 against the committed 32.
    formula: >
      P1, 26 <= best_k3_mult <= 30 with argmax on a base of committed
      rank >= 11, and best_k3_exact <= 8 (structural, at most one per
      class). P2, |beta_best| < 0.5 and the 95 percent interval
      excludes |beta| > 1.0. P3, R* finite, interval width < 6. P4,
      best_k4_mult >= 38.
    source: >
      Internal derivation from the committed measurements: the
      committed degree-8 control total 20 = base rank 3 plus T_3 = 17
      on rank-3/4 bases (EV-ECRANK-b6c9b6, cert_deg8_control.json,
      internal, read at design time); the committed base-rank input
      now reaches 13 (EV-ECQ-0d142e, internal, read at design time).
      The P1 interval is the idea's arithmetic: a rank-13 base plus a
      base-independent T_3 of about 16 gives about 29. No recalled
      external source backs any number in this contract (core rule
      9); the Bhargava-Shankar / Goldfeld framework is a recalled
      pointer in the hypothesis citations, support for nothing
      quantitative.
  sample_size_derivation:
    method: >
      No sampling of the search space: the coset space is enumerated
      in FULL (11,811 order-8 and 11,811 order-16 subgroups per base),
      so the order statistic is exact over the frozen space, and C5
      fixes the equal denominator. The base sample is the frozen 32:
      both existing rank-13 curves, 10 rank-12 (including the
      EV-ECQ-0d142e pencil curve), 10 rank-11, and a matched 10-curve
      rank-3/4 arm (2 rank-4, 8 rank-3 including the committed
      control base) from the committed 497-entry pool, first in file
      order - the idea's requirement of at least 10 bases per stratum
      for strata 11, 12 and 3-4, plus both available rank-13 curves.
      32 bases times 127 nontrivial classes = 4,064 primary-arm
      descents. The rank >= 5 tail check is a DETECTOR, not a
      resolved probability: the committed anchor is 0 such twists in
      364,756 (EV-ECRANK-b6c9b6), and a single hit on a high-rank base
      is a strong coupling signal, so the check needs no sample-size
      floor.
    smallest_probability_to_resolve: null
    derived_sample_count: '4 runs: R1 128 descents; R2 4,064 descents; R3 320 descents; R4 0 descents (replay)'
  scale_relevance:
    tier: measurement
    justification: >
      The bases are the committed certified curves, coefficients up to
      about 1.4e26 (the rank-12 pencil curve); the support is the
      committed 7-class set; the coset space is enumerated in full.
      The transfer assumptions are stated: the twist-rank
      distributions estimated here are for the frozen support and the
      frozen base set only, and a shortfall is a property of the
      frozen enumerated search space and the alarm budget, never a
      proof of unreachability.
    correspondence: null
    correspondence_note: no correspondence trick; the committed descent machinery (PARI ellrank with per-twist alarm, independent exact point verification) is the scale access, exactly as in the committed ladder.
  tail_checks:
    - The run-start stated exact facts F1-F5 are recomputed exactly before any verdict is read; any mismatch is a spec defect, the affected run invalid, correction by versioned amendment.
    - The per-stratum maximum twist rank and the count of twists of rank >= 5 are reported; a single rank >= 5 twist on a high-rank base is a strong coupling signal and is reported even if every prediction holds.
    - Every headline order statistic is reported beside the coset-population mean, median, and the frozen count 11,811.
    - The per-base timeout rate and the censoring correlation are reported for EVERY base, not just the aggregate; a base with timeout rate above 80 percent is flagged and its totals are labelled censored.
    - The certificate kind per class is archived for every coset entering a headline total; the weakest kind per rung is stated.
  replication:
    seeds: [20260909]
    seeds_note: >
      One frozen seed, 20260909, used in exactly two places: the P3
      bootstrap (10,000 resamples) and the HA-2 permutation test
      (at least 2,000 permutations). All enumeration is deterministic;
      the R4 replay is a fresh-process re-derivation of every R2
      statistic from the committed raw tables (C8), not a re-seed.
    independent_instances: 32
    independent_instances_note: 32 independent base curves across 5 committed rank strata (3, 4, 11, 12, 13) in two arms (the new high-rank bases and the matched old-pool arm), the arm split being the base-effect control.
  budget:
    wall_clock_seconds_per_run:
      R1: 7200
      R2: 130000
      R3: 90000
      R4: 3600
    wall_clock_note: >
      Per-run wall-clock ceilings, serial worst case: R1, 128 descents
      at 20 s = 2,560 s plus overhead; R2, 4,064 descents at 30 s =
      121,920 s plus combinatorics; R3, 320 descents at 240 s =
      76,800 s; R4, pure computation. The executor may parallelise
      across (base, class) tasks with at most 8 workers; the totals
      are scheduling-independent by C8, and the wall clock only
      shortens. These are ceilings, not targets.
    total_cpu_hours: 56
    total_cpu_hours_note: >
      Worst-case ceiling, (128*20 + 4,064*30 + 320*240) s = 201,280 s
      of descent time plus overhead, i.e. about 56 CPU-hours.
      Expected far lower: committed mean completed descent of 7.5 s
      (EV-ECRANK-b6c9b6) puts the expectation near 15-30 CPU-hours,
      advisory, not a cap (research-budget policy: CPU is measured for
      comparison, not rationed).
    maximum_memory_gb: 8
    maximum_memory_gb_note: template floor respected; the dominant structure is the rank table (32 x 128 small integers, kilobytes) plus PARI's own working set per descent.
    maximum_runs: 4
    maximum_runs_note: enumerated R1-R4 above. Infrastructure-retry slots are recorded per run, never as new scientific runs.
    maximum_workers: 8
    counted_exact_rational_operations_per_run: null
    counted_ops_note: no counted-op stop rule; the descent wall clock is the binding cap.
    maximum_attempts_per_run: null
    descent_calls: 4512
    descent_calls_note: worst-case attempted descents, R1 128 + R2 4,064 + R3 320 = 4,512; every attempt is ledgered (completed or timed_out), timed_out is never rank 0.
    pari_ellrank_calls: 4512
    network: none
  stopping_rules:
    - The R1 regression (C1, plus the C7 synthetic controls) must pass before any R2 reading is taken; on any mismatch the experiment stops as invalid (voids all runs), reported as an instrument failure, never interpreted.
    - NO early stop on a prediction mismatch: P1/P2/P4 can fail in either direction and that is the OUTCOME; the runs complete so that the censoring data, the per-stratum histograms, and the opposite-rung readings are all recorded (core rule 8).
    - NO adaptive alarm, NO support widening, NO base re-selection, NO coset re-enumeration beyond the frozen space; each arm is a fixed pass.
    - A wall-clock or budget exhaustion is reported as failed_infrastructure (core rule 3), never as a mathematical result.
    - A timeout rate above 80 percent on the high-rank arm (the 22 bases of rank >= 11, R2) makes P1 and P3 censored: they are reported as an INFRASTRUCTURE outcome of unknown depth, not settled, and the run package records it as such.
  invalidation_rules:
    - Any R1 mismatch (per-class entry, total 20, total 8, subgroup count, or a C7 synthetic-control answer) voids ALL runs (the instrument is broken); the R1 run remains as a record of the failure.
    - Any C2 audit failure (mask-0 entry differing from the committed base certificate, or a double-counted trivial class) invalidates the affected run.
    - Any C3 degenerate subgroup that slips through invalidates the affected run (a non-subgroup was scored as a field).
    - Any C6 audit failure (a headline total without its per-class certificate kinds and weakest-kind label) invalidates the affected reading.
    - C8 (R4) any non-identical statistic voids the R2 and R3 readings (the statistics pipeline is non-deterministic); the raw descent tables remain as records.
    - Any run-start stated exact fact F1-F5 that fails its exact recomputation is a SPEC DEFECT, the affected run invalid, correction by a versioned amendment (never an edit of this contract); executed runs are never re-scored.
    - A best-coset certificate that fails the committed independent verifier closes the certificate claim as failed and downgrades the affected P1/P4 total to a computed total (the points remain individually verified; the rung is not stated as certified).
    - Every invalidation is recorded with the failing check's exact inputs; a voided run is never silently discarded (core rule 8).
  success_criterion: >
    DECIDABLE, WITH A POSSIBLE NEGATIVE OUTCOME. G1 (M-A, primary), R1
    passes exactly: the 8 committed classes match, the best totals are
    exactly 20 and 8 with the committed coset among the achievers, the
    subgroup counts are exactly 11,811 each, and both C7 synthetic
    controls return their frozen answers. G2 (M-B, primary), P1 and P4
    are reported with argmax (E, V) exhibited and independently
    verified; each lands in one of its pre-registered outcome classes
    (P1 in [26,30], or the falsification branches P1 >= 31 or P1 <= 20
    on the rank-13 bases; P4 >= 38 or the defect branch). G3 (M-C,
    primary), P2 is reported with interval and lands in one of its
    outcome classes (|beta| < 0.5 with interval excluding |beta| > 1.0,
    or the coupling branch |beta| > 1.0 with interval excluding 0).
    G4 (M-D, primary), P3 is reported: R* finite with interval width
    under 6 (the C2 number produced), or the heterogeneity branch with
    the width reported. G5 (controls), C2, C3, C4, C5, C6 and C8 all
    pass. Negative outcomes are FIRST-CLASS: each falsification branch
    of P1, P2, and the censoring branch closing their declared scope is
    a success of the DECISION, not a failure of the experiment.
  success_criterion_decidability_note: >
    Every clause is machine-checkable from the predefined metrics:
    regression_status for G1, P1_best_k3 and P4_best_k4 for G2,
    P2_beta for G3, P3_Rstar for G4, the per-control metric ledgers
    for G5. No clause requires judgement beyond the frozen thresholds.
  falsification_criterion: >
    Exactly the five conditions of H-ECRANK-ef097f, each closing ONLY
    its declared scope (core rule 6): (1) R1 regression failure
    invalidates the instrument, not the hypothesis; (2) P1 >= 31
    certified is a new degree-8 Pareto point and falsifies P1 in the
    valuable direction - the total must survive the full independent-
    verifier and null-object battery before it is stated anywhere, and
    the C1 question becomes live; (3) P1 <= 20 on the rank-13 bases
    refutes base-rank transfer at the tested scope and the premise of
    GOAL-ECRANK-002's resume condition; (4) |beta| > 1.0 with the
    interval excluding 0 refutes separability at the tested scope and
    every extrapolation in H-ECRANK-f2a2f7 must be recomputed; (5)
    high-rank-arm timeout above 80 percent is an infrastructure
    outcome invalidating P1 and P3 as censored, never a mathematical
    negative. A shortfall at k = 3 is always a property of the frozen
    enumerated search space and the alarm budget, stated with its
    denominator, and is never read as unreachability.
  required_artifacts:
    - 'the ledger run schema for EVERY enumerated run, the nested `run:` record carrying RUN_REQUIRED_TOP fields (id, experiment_id, status, code, environment, inputs, results, stdout, stderr, timestamps, resources, validity, model provenance) plus the command.txt and environment.json companions, the omission class that forced the EXP-ECRANK-73275e predecessor repair'
    - 'the run-start re-verification artifact: the exact recomputation of F1-F5, archived before any verdict is read'
    - 'R1: the per-class comparison table against cert_deg8_control.json (all 8 committed classes, pass/fail per field), the subgroup enumeration count check, the achieving-coset lists for totals 20 and 8, and the C7 synthetic-control results'
    - 'R2: the per-base raw profile tables (mask, d, pari_r_low, pari_r_high, canonical point set, certified, timed_out, certificate kind), the per-base per-coset total tables (11,811 x 2 columns per base, both k), the per-base and global argmax with coset exhibited, the P2 regression table, the P3 per-base table and bootstrap draw file, the HA-1 histograms and chi-squared statistic, the HA-2 means and permutation p-value, the C4/C5/C6 ledgers'
    - 'R2: the best-coset certificate files (k = 3 and k = 4, total_mult column) in the committed format, and the committed independent verifier output on each (zero errors required, or the failed-certificate record)'
    - 'R3: the per-base 30 s vs 240 s completion table, the censoring slope, the completed-descents-only totals with denominators, and the Spearman correlations at both alarms'
    - 'R4: the replay diff log, the bit-for-bit comparison of every R2 statistic'
    - 'per-run descent ledger (attempts, completed, timed_out), wall_seconds per run (internal monotonic AND timestamp span), and peak_rss_bytes per run'
    - 'execution-report.yaml (executor observations only, no interpretation)'
  assigned_to: executor
  completion_gate:
    - All 4 enumerated runs finalized with the nested `run:` record schema.
    - validate_ledger.py adds no new violations after the run package.
    - The snapshot archive commits the full run package before any independent review.
  inference:
    requested_policy: executor-implementation
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
