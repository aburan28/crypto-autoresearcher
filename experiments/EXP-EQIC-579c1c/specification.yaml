experiment:
  id: EXP-EQIC-579c1c
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-e57607
  question_id: RQ-EQIC-8cb959
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE ONE PLACE AN EXPONENT COULD MOVE IN THIS LANE, AND AN HONEST LOW PRIOR ON IT: everything
    phi does to the factor base is a constant, so the only exponent-relevant lever is the GROWTH IN
    ARITY of the solving degree -- measure whether the phi-quotiented encodings shift d_ff by a constant
    (constant-factor, dead) or change its growth rate in m (exponent-relevant), with a third encoding
    ENC-AUX that lowers the membership degree from r m to m without inflating the summation polynomial
    at all'
  status: draft
  objective: "(A) WHY THIS IS THE ONLY EXPONENT-RELEVANT QUESTION IN L4, DERIVED. For prime-field\
    \ point decomposition at arity m with factor base size B and automorphism order r acting on the\
    \ x-line: the per-target success probability is about B^m / (m! N); the number of independent\
    \ relations needed is B / r (IDEA-20260807-5dfe4a); so the number of successful searches is about\
    \ m! N / (r B^{m-1}), and the total is that times G(m, B), the cost of one algebraic decomposition\
    \ test. Balancing at B = N^{1/m} gives\n  total  =  (m! / r) * N^{1/m} * G(m, N^{1/m}).\nTHE FACTOR\
    \ 1/r IS A CONSTANT AND CANNOT MOVE AN EXPONENT. THE FACTOR N^{1/m} FALLS WITH m. SO THE ENTIRE\
    \ QUESTION IS WHETHER G(m, B) GROWS SLOWLY ENOUGH IN m TO LET m GROW -- and G is governed by the\
    \ solving degree D through roughly (m + D choose D)^omega (KN-TECH-011). Everything else in lane\
    \ L4 -- the orbit quotient, the phase statistic, the factor-base design, the |Aut| sweep -- is\
    \ a constant. D(m) is the exponent.\n(B) THE TWO BRANCHES, PRE-REGISTERED AND MUTUALLY EXCLUSIVE.\
    \ Let D_X(m) be the measured solving degree of the incumbent encoding and D_I(m) that of a phi-quotiented\
    \ encoding.\n  BRANCH CONST: D_I(m) - D_X(m) is bounded as m grows (a constant shift, or\n   \
    \ zero). Then the quotient buys a constant factor in G and nothing more,\n    the exponent of\
    \ the method is unchanged, and L4 IS CLOSED FOR EXPONENT\n    PURPOSES with a named obstruction\
    \ -- \"the automorphism quotient acts on\n    the constant, not on the degree\". That is a closure\
    \ at the\n    docs/inventor-protocol.md section 4 standard and it is the expected\n    outcome.\n\
    \  BRANCH RATE: D_I(m) / D_X(m) tends to a limit strictly below 1, or D_I\n    grows in a strictly\
    \ smaller class. Then the quotient acts on the\n    exponent and the composed cost above changes,\
    \ and the honest next step\n    is a full conditional-complexity record with numbered heuristics\
    \ and a\n    cost table -- not a claim made here.\nNOTHING IN BETWEEN IS REPORTABLE AS A RATE\
    \ CHANGE FROM TWO OR THREE ARITIES, and the record says so in advance: with m in {2, 3} and possibly\
    \ 4, a measured ratio is a data point, never a growth rate. THE HONEST CEILING OF THIS EXPERIMENT\
    \ IS THEREFORE TO REFUTE BRANCH RATE OR TO FAIL TO REFUTE IT, and the record is written to make\
    \ the refutation cheap.\n(C) THE THREE ENCODINGS, AND ENC-AUX IS THE NEW ONE. Let V be a union\
    \ of m' orbits, |V| = r m', with orbit invariants u_1, ..., u_{m'} and membership polynomial g\
    \ of degree m' (IDEA-20260807-1ea327 claim (B)).\n  ENC-X: {S_{m+1}(x_1,..,x_m,x_R) = 0} together\
    \ with f_V(x_i) = 0 for each\n    i. Variables m. Degree sequence (2^{m-1}, r m', ..., r m').\n\
    \  ENC-SYM: the norm form on the invariant line,\n    {T_m(u_1,..,u_m) = 0, g(u_i) = 0}. Variables\
    \ m. Degree sequence\n    ((2r)^{m-1}, m', ..., m'). The membership degree falls by r; the\n \
    \   summation degree RISES by r^{m-1}. This is the encoding of\n    IDEA-20260807-1ea327 and IDEA-20260807-5ddccf.\n\
    \  ENC-AUX (NEW HERE, AND THE POINT OF THIS RECORD): keep the summation\n    polynomial in the\
    \ x-variables and introduce auxiliary invariants,\n    {S_{m+1}(x_1,..,x_m,x_R) = 0,  u_i - x_i^r\
    \ = 0,  g(u_i) = 0}.\n    Variables 2m. Degree sequence (2^{m-1}, r, ..., r, m', ..., m').\n \
    \   THE MAXIMUM GENERATOR DEGREE IS max(2^{m-1}, r, m'), against ENC-X's\n    max(2^{m-1}, r m')\
    \ and ENC-SYM's max((2r)^{m-1}, m'). ENC-AUX is the\n    only encoding that gets the r-fold membership\
    \ reduction WITHOUT paying\n    the r^{m-1} summation inflation, and it pays instead in VARIABLE\
    \ COUNT,\n    doubling m. Whether trading degree for variables helps a Groebner\n    computation\
    \ is exactly the kind of question that degree bookkeeping does\n    not answer and measurement\
    \ does.\n\n(D) WHY THE BOOKKEEPING MIGHT NOT PREDICT THE ANSWER, WHICH IS THE ONLY REASON THIS\
    \ IS WORTH RUNNING. KN-TECH-011's applicability limits record that \"the clean semi-regular complexity\
    \ is a HEURISTIC: Semaev systems are structured (symmetric, sparse) and may not be semi-regular,\
    \ so measured solving degrees can deviate from Hilbert-series predictions -- a deviation is itself\
    \ a finding, not an error.\" The phi-quotient changes the structure in a specific way (it removes\
    \ an exact group symmetry from the solution set, reducing the solution count by r^m while raising\
    \ or holding degrees), and structured systems are precisely where degree predictions fail. So\
    \ the measurement can disagree with the bookkeeping, and if it does, the direction of the disagreement\
    \ is the finding.\n(E) RELATION-COUNT ARITHMETIC, UNCHANGED AND STATED. In every encoding, a solved\
    \ system certifies one decomposition and yields ONE independent equation over the m' reduced unknowns,\
    \ with coefficients in the powers of lambda; the automorphism images are lambda-multiples with\
    \ rank increment 0. No encoding manufactures relations. The encodings differ ONLY in the cost\
    \ of finding one, which is G(m, B), which is claim (A)'s exponent."
  resource_label: R1, R2
  admissibility: admissible
  admissibility_argument: 'R1: the measured quantity is the degree behaviour of a polynomial system
    in x-coordinates as FIELD ELEMENTS. A generic-group simulator cannot form a summation polynomial,
    cannot introduce an auxiliary invariant variable, and cannot report a solving degree, so nothing
    here is simulable in the sense of KN-FIND-b7e091. R2: the invariant u = x^r exists only because
    of the curve equation (a = 0 for r = 3, b = 0 for r = 2), a biconditional established in IDEA-20260807-5ddccf
    claim (A). phi is never applied to a point of G to gain information; claim (E) states positively
    that doing so yields rank 0.'
  reachability_gate: 'NOT APPLICABLE TO THE DESIGN: encodings are compared on one fixed curve per
    instance, with the null curves constructed rather than reached, so T5 does not bind and no reachability
    cost is paid. BINDING ON THE SCOPE via T4: the invariant encodings exist only on curves whose
    isogeny class has D_0 = -3 or -4, which cannot be reached from a class that lacks them at any
    cost. NOTE THE ASYMMETRY WORTH RECORDING: the ENC-X arm and the semi-regular predictions are NOT
    scope-limited to CM curves, so the part of this record that concerns how solving degree grows
    with arity for the standard system is of general prime-field interest, while only the comparative
    part is confined to the measure-zero families.'
  inputs:
    procedure: 'CHEAPEST VALID DISCRIMINATOR, AND IT USES NO SOLVER AT ALL: STEP 4, the semi-regular
      prediction. Compute the Hilbert series prod_i (1 - t^{d_i}) / (1 - t)^n for all three encodings
      at m = 2..8 from their degree sequences. This is symbolic, costs seconds, and yields the predicted
      degree curves for every arity including ones no solver can reach. IF THE PREDICTIONS FOR ENC-AUX
      AND ENC-X COINCIDE AT EVERY m, then BRANCH RATE is unsupported by the only model available at
      large m, and the remaining question is narrowed to whether the measured degrees deviate from
      the model -- which is a much smaller and cheaper question than the one this record started with.
      THEN, the consistency gate (STEP 2) against the existing DREG lane. THEN, hours: measure all
      three encodings at m = 2 on 3 instances and 20 targets, plus the r = 1 noise floor and the fake-invariant
      null. THEN, as budget allows: m = 3, expecting ENC-SYM to be infeasible and recording its memory
      number when it is.'
    mechanism: "STEP 1 -- BUILD THE THREE ENCODINGS AT m = 2 AND m = 3, WITH DEGREES VERIFIED. Construct\
      \ ENC-X from S_3 and S_4 (harness/semaev.py::s3_expr, s4_expr), ENC-SYM by iterated resultants,\
      \ and ENC-AUX by adding the m auxiliary equations u_i - x_i^r and the m membership equations\
      \ g(u_i). Verify the declared degree sequences exactly; a mismatch halts the line.\nSTEP 2 --\
      \ CONSISTENCY GATE AGAINST THE EXISTING DREG LANE. On an instance already recorded in the RQ-DREG-001\
      \ family, run ENC-X through this record's instrumentation and require exact agreement with the\
      \ recorded solving-degree proxy. If the two meters disagree, they are not measuring comparable\
      \ things and no cross-encoding comparison is valid. THIS GATE COMES BEFORE ANY NEW NUMBER IS\
      \ PRODUCED.\nSTEP 3 -- MEASURE D AND d_ff ON ALL THREE, AT m = 2 AND m = 3. Report both proxies:\
      \ the maximum total degree of the reduced basis (the implementation-bound proxy harness/semaev.py\
      \ already computes and labels) and, where the solver exposes it, the first-fall degree. KN-OPEN-002\
      \ records that whether d_ff tracks d_reg over prime fields is open, so BOTH are reported and\
      \ neither is presented as the other.\nSTEP 4 -- THE SEMI-REGULAR PREDICTION, COMPUTED SYMBOLICALLY\
      \ AND FOR FREE. From each encoding's degree sequence and variable count, compute the Bardet-Faugere-Salvy\
      \ semi-regular degree of regularity as the index of the first non-positive coefficient of the\
      \ Hilbert series\n  prod_i (1 - t^{d_i}) / (1 - t)^{n}.\nThis costs no compute and gives a PREDICTION\
      \ for each (E, m) before any solver runs. The deviation between prediction and measurement is\
      \ the quantity KN-TECH-011 flags as itself a finding, and it is reported per cell.\nSTEP 5 --\
      \ THE ARITY EXTRAPOLATION, AND ITS REFUSAL. Tabulate D_E(2), D_E(3) and, if feasible, D_E(4)\
      \ for each encoding, together with the semi-regular predictions at m up to 8 (which are free\
      \ to compute at any m). STATE EXPLICITLY that two or three measured points cannot distinguish\
      \ a constant shift from a rate change, and that the extrapolation reported is the SEMI-REGULAR\
      \ PREDICTION -- a symbolic model -- not a measurement. The measurement's role is to say whether\
      \ the model is trustworthy at the arities where it can be checked.\nSTEP 6 -- THE NULLS. For\
      \ each encoding, the size-matched random factor base; and for the invariant encodings, the formal\
      \ substitution on a curve without the automorphism (NULL-1 of IDEA-20260807-1ea327). Plus the\
      \ r = 1 degeneration, where all three encodings collapse toward ENC-X and the measured differences\
      \ must vanish."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - r = 1 degeneration noise floor (blocking)
  - DREG-lane consistency gate on ENC-X (blocking)
  - fake-invariant curve (a != 0) with the formal substitution
  - size-matched random factor base in every encoding
  - degree-and-variable-matched random polynomial system as the shape null for ENC-AUX
  - semi-regular prediction computed for every cell before measurement
  - certificate re-verification of every claimed decomposition
  - identical solver, monomial order and modulus across encodings
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, FOUR LAYERS. NULL-1, THE r = 1 DEGENERATION:
    on a generic curve, u = x^1 = x, so ENC-SYM and ENC-AUX both collapse toward ENC-X (ENC-AUX retains
    its auxiliary variables but they become u_i = x_i, i.e. trivially eliminable). The measured degrees
    must coincide, and the residual spread IS the instrument''s noise band. Every cross-encoding claim
    must exceed that measured band. NULL-2, THE FAKE-INVARIANT CURVE: apply the formal substitution
    u = x^3 on a curve with a != 0, where no automorphism exists. If the encodings behave the same
    there, the degree behaviour belongs to the substitution and not to the endomorphism. NULL-3, THE
    SIZE-MATCHED RANDOM BASE at |V| = r m'' in every encoding. NULL-4, THE SEMI-REGULAR PREDICTION
    as a MODEL null: if measured degrees match the Hilbert-series prediction in all three encodings,
    then the encodings differ exactly as their degree sequences say and there is no structural surprise
    -- a controlled null, and the pre-registered expectation. DECAY PARAMETER: r, run downward to
    1, where the effect must vanish identically because the encodings become the same system. Secondarily,
    epsilon (orbit-breaking at fixed |V|), under which the invariant encodings become ill-posed and
    the required decay is measured on ENC-AUX''s solvable fraction.'
  independent_variables: []
  metrics:
    primary:
    - degree sequence and variable count per encoding per arity
    - semi-regular predicted degree of regularity per cell
    - measured maximum reduced-basis total degree per cell
    - measured first-fall degree per cell where obtainable
    secondary:
    - measurement minus prediction, per cell, with its sign
    - Groebner wall time and peak memory per cell
    - highest feasible arity per encoding, with the memory number at failure
    - r = 1 noise band as a measured spread
  heuristic_under_test: null
  preregistered_prediction:
    quantity: maximum generator degree of each encoding at m = 2, 3 (r = 3, m' the orbit count)
    formula: Exactly max(2^{m-1}, 3 m') for ENC-X, max(6^{m-1}, m') for ENC-SYM, and max(2^{m-1},
      3, m') for ENC-AUX. Arithmetic predictions with zero tolerance; a deviation falsifies the encoding
      construction cheaply.
    source: pre-registered in IDEA-20260807-e57607 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - 'TWO POINTS ARE NOT A RATE. The single largest interpretive risk here, and it is forbidden in
    advance: with m in {2, 3} no growth rate is measurable, and the semi-regular curve at larger m
    is a MODEL, not data.'
  - SOLVER NON-CANONICITY. D depends on solver and monomial order. All conclusions are within-solver;
    the composition with IDEA-20260806-e4f96e's solver-independent refutation degree is the fix and
    is named, not attempted.
  - BINOMIAL NON-GENERICITY. ENC-AUX's u_i - x_i^r equations are binomials, and binomial ideals are
    highly non-generic; the semi-regular prediction is least trustworthy exactly for the encoding
    whose behaviour matters most. This is why the shape null (a degree-and-variable-matched random
    system) is a required control rather than an optional one.
  - m' VERSUS m. The orbit count m' and the arity m are different parameters and both appear in the
    degree sequences. Conflating them produces wrong predictions; every table must carry both.
  - TARGET DEPENDENCE. The summation polynomial is specialised at x_R, so the system and its degree
    depend on the target. Degrees must be reported as distributions over at least 20 targets, not
    as single values.
  - ELIMINATION ORDER. ENC-AUX has a natural elimination order (eliminate u first, or x first) and
    the two can give very different degrees. Both must be run, or the encoding is credited or debited
    by an arbitrary choice.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 10800
    total_cpu_hours: 12.0
    maximum_memory_gb: 8
    maximum_runs: 60
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Exactly max(2^{m-1}, 3 m') for ENC-X, max(6^{m-1}, m') for ENC-SYM, and max(2^{m-1},
    3, m') for ENC-AUX. Arithmetic predictions with zero tolerance; a deviation falsifies the encoding
    construction cheaply.
  falsification_criterion:
  - A constructed encoding does not have its declared degree sequence. The construction is wrong;
    nothing is reported.
  - The DREG-lane consistency gate fails. The meters are not comparable and no cross-encoding number
    may be reported or compared with existing ledger records.
  - The r = 1 degeneration shows a spread between encodings. Instrument defect; the record is blocked.
  - 'The ENC-AUX minus ENC-X degree difference is the same at m = 2 and m = 3. BRANCH CONST FIRES:
    the phi-quotient acts on the constant, not on the degree; L4 is closed for exponent purposes with
    that named obstruction; and the forward guidance is that only a change to the summation polynomial
    itself, or a non-algebraic decomposition method, remains.'
  - ENC-AUX's measured degree exceeds its semi-regular prediction systematically. The extra variables
    cost more than the degree reduction saves and the encoding is refuted.
  - Arity 3 is infeasible for every encoding. Then only m = 2 is measurable, no arity comparison is
    possible at all, and the record must say so plainly rather than reporting a one-point trend. This
    is a BUDGET outcome under AGENTS.md rule 5.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-e57607
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
