# EXP-CERTBIN-c7b981
# Stable-subspace dimensions. No closure.
# Approved by DEC-20261002-789bf5.
experiment:
  id: EXP-CERTBIN-c7b981
  hypothesis_id: H-CERTBIN-c1dfed
  source_idea: IDEA-20260926-917981
  question_id: RQ-CERTBIN-836ce2
  version: 1
  title: Stable-subspace dimensions
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-789bf5
  objective: >-
    Compute the order of 2 modulo 17, 19 and 131. List the stable
    dimensions k*ord and k*ord+1. Reject dimension 9 at n = 19 and
    at n = 131.
  inputs:
    orders:
      - {modulus: 17, order: 8, witness_exp: 4, witness: 16}
      - {modulus: 19, order: 18, witness_exp: 9, witness: 18}
      - {modulus: 131, order: 130, residues: {10: 107, 26: 53, 65: 130}}
    stable:
      - {n: 17, dims: [0, 1, 8, 9, 16, 17], contains_9: true}
      - {n: 19, dims: [0, 1, 18, 19], contains_9: false}
      - {n: 131, dims: [0, 1, 130, 131], contains_9: false}
    written_rates:
      polynomial_m4: 144
      random_m4: 0
      random_w4: 25
      rates_differ: true
  controls:
    - >-
      Dimension 9 stable at n = 19 is false. Reporting that
      invalidates the run.
    - >-
      Dimension 9 stable at n = 131 is false. Reporting that
      invalidates the run.
    - >-
      The order of 2 modulo 17 equal to 4 is false. 2^4 is 16, not
      1. Reporting that order invalidates the run.
    - >-
      The written rates 144 and 0 being equal is false. Reporting
      them equal invalidates the run.
    - Two integer routes. They must not import each other.
  independent_variables:
    - modulus
    - route in {powers, repeat_module}
  metrics:
    primary:
      - orders
      - contains_9
      - dim9_at_19_rejected
      - dim9_at_131_rejected
      - implementations_agree
    secondary:
      - written_rates_differ
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Three orders and three membership bits for dimension 9.
    formula: >-
      The order is the least positive e with 2^e congruent to 1.
      A stable dimension is k*ord or k*ord+1, at most n. Dimension
      9 is stable only when it appears in that list. The residues
      107, 53 and 130 show that the proper divisors of 130 do not
      give order 1 at modulus 131.
    source: >-
      IDEA-20260926-917981 names the orders 8 and 18, the dimension
      lists, and the absence at n = 131, read 2026-10-02. The
      powers were recomputed in this design session. That
      computation is not a run. The written rates 144 and 0 are
      copied, not remeasured. No closure was built.
  scale_relevance:
    tier: toy
    justification: Three modular orders. No transfer to a closure rate.
    correspondence: null
  tail_checks:
    - Degree 131 is required. Stopping after n = 19 and still reporting the n = 131 list is invalid.
  replication:
    seeds: []
    independent_instances: 3
    replication_note: Deterministic. The second run is the other integer route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If dimension 9 is reported stable at n = 19, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - Dimension 9 is reported stable at n = 19 or at n = 131.
    - The order modulo 17 is reported as 4.
    - The written rates 144 and 0 are reported equal.
    - A closure or a refutation rate is computed.
  success_criterion: >-
    Both runs agree on the orders 8, 18 and 130, the three lists,
    and the three membership bits. Dimension 9 stays present at
    n = 17 and absent at n = 19 and n = 131. The written rates
    144 and 0 stay unequal.
  falsification_criterion: >-
    The runs agree, dimension 9 stays absent at n = 19 and n = 131,
    and any order, residue, or list differs from the preregistered
    table.
  required_artifacts:
    - experiments/EXP-CERTBIN-c7b981/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CERTBIN-c7b981/runs/<RUN-ID>/command.txt
    - experiments/EXP-CERTBIN-c7b981/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CERTBIN-c7b981/runs/<RUN-ID>/stderr.log
    - experiments/EXP-CERTBIN-c7b981/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CERTBIN-c7b981/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any closure, Macaulay matrix, or refutation rate.
    - A claim that the basis is irrelevant or is not.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
