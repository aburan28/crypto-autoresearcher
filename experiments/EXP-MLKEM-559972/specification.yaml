experiment:
  id: EXP-MLKEM-559972
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-MLKEM-fef5ae
  question_id: RQ-MLKEM-003
  goal_id: GOAL-MLKEM-003
  title: >-
    Four-arm exhaustive saturation-ball census at rank 12-32 on ML-KEM-shaped
    module q-ary, plain q-ary, unstructured, and planted-anisotropy lattices,
    against the Siegel-forced population (4/3)^(d/2)

  objective: >-
    Supply the measurement GOAL-MLKEM-003's completion criterion 1 names and
    twelve batches never attempted: a measured value, with an interval, for the
    memory exponent 0.20751874963942182 that the campaign has charged since
    BATCH-010 as a literal borrowed from a code path the attack never invokes
    (EV-MLKEM-020: `lwe_primal` "never calls `short_vectors`, so the instrument
    supplies NO memory figure for this attack at all"). The measurement is an
    exact integer count of lattice points inside the saturation ball, compared
    against a forced value that is an instance of Siegel's mean value theorem
    rather than a heuristic, with a null arm that can fail, a planted positive
    control that must fire, and a five-point graded control.

  what_this_is_not:
    - Not a sieve, not a lattice reduction benchmark, and not an SVP or LWE solve.
    - Not an attack on ML-KEM, on Module-LWE, or on any lattice problem; no secret is recovered and none is planted in the treatment arms.
    - Not a statement about any FIPS 203 parameter set, block size, category assignment, or deployed system.
    - Not a measurement of a sieve's actual memory: it measures a set a saturated sieve must contain, which is a LOWER BOUND under HEUR-SB-1, and HEUR-SB-1 is declared unvalidated.
    - Not a test of the 0.292 time exponent, of dimensions-for-free, or of any running-time quantity.
    - Not a challenge to EV-MLKEM-020's c* < 1/3 inequality; the paired hypothesis derives in advance that no outcome of this contract can reach it.
    - Not a reopening of GOAL-MLKEM-003, not a status change to any record, and not a route around AGENTS.md rule 12.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has happened.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      For rank d in {12, 16, 20, 24, 28, 32}, modulus q = 3329 (plus one
      robustness modulus at d = 24), 20 instances per arm per cell, the declared
      enumerator lineage and the declared radius rule: the measured population
      |S(L)| per arm, the ratio rho_d against (4/3)^(d/2), the fitted exponent
      0.20751874963942182 + s with a confidence interval over 12 <= d <= 32, the
      2n-divisibility law for the module arm, and the graded control's decay
      profile. NOTHING ABOVE THAT. A single run cannot support any statement
      about d > 32, about ML-KEM's security, about a sieve's realised memory, or
      about any exponent at cryptographic scale. Any propagation to
      n_peak = 426.4 / 634.4 / 871.8 is conditional on HEUR-SB-3 and must be
      cited with that heuristic attached.

  inputs:
    d_ladder: [12, 16, 20, 24, 28, 32]
    q_primary: 3329
    q_robustness: 7681
    q_robustness_note: >-
      A second prime with q = 1 mod 2n for the module arm at d = 24, used ONLY
      as a robustness arm so that no conclusion rests on a single modulus. It is
      not an ML-KEM parameter and is not presented as one.
    instances_per_cell: 20
    module_shapes:
      d12: [[2, 3]]
      d16: [[4, 2]]
      d20: [[2, 5]]
      d24: [[4, 3]]
      d28: [[2, 7]]
      d32: [[8, 2], [4, 4]]
    module_shapes_note: >-
      Pairs are (n, k) with ring R_n = Z[X]/(X^n + 1), module rank k, lattice
      rank d = 2nk, determinant q^(d/2). d = 32 carries TWO shapes so that ring
      degree and module rank are separated at one ladder point: (8,2) and (4,4)
      have identical d and determinant and different 2n.
    planted_stretch_values: [1.0, 1.25, 1.5, 2.0, 4.0]
    planted_arm_dimension: 24
    z_control_dimensions: [4, 8, 12, 16, 20, 24, 28, 32]
    radius_rule: >-
      gh(L) = det(L)^(1/d) * Gamma(d/2 + 1)^(1/d) / sqrt(pi);
      R = sqrt(4/3) * gh(L); S(L) = { v in L : 0 < ||v||^2 <= R^2 }.
    forced_population_by_d:
      d12: 5.618655692729765
      d16: 9.988721231519580
      d20: 17.757726633812588
      d24: 31.569291793444595
      d28: 56.123185410568160
      d32: 99.774551841010050
    exponent_under_audit: 0.20751874963942182
    precision_rule: >-
      gh and R^2 are computed in 50-decimal-digit arithmetic (Python `decimal`
      with prec >= 50). The membership test compares the EXACT INTEGER ||v||^2
      against that threshold. No floating-point norm is used for the decision.
    node_cap_per_instance: 100000000
    master_seed: 559972
    domain: EXP-MLKEM-559972/v1
    seed_derivation_rule: >-
      Every random object is drawn from a stream keyed by
      SHA-256( UTF-8 bytes of  domain || "|" || arm || "|" || decimal(d) ||
      "|" || decimal(q) || "|" || decimal(instance_index) || "|" ||
      decimal(counter) ), with digests interpreted as big-endian unsigned
      integers and consumed 32 bytes at a time, counter starting at 0 and
      incrementing once per digest. `arm` is one of the literals "N", "Q", "M",
      "P", "Z". Rejection sampling, where used, discards and increments the
      counter; it never reseeds. A third party reproduces every instance
      bit-for-bit from (domain, arm, d, q, instance_index) alone.
    construction_rules:
      arm_N: >-
        Sample a rank-d integer lattice in Hermite normal form with determinant
        exactly q^(d/2): choose diagonal entries d_1..d_d as a random ordered
        factorisation of q^(d/2) into d factors each a power of q drawn by
        uniform composition sampling from the stream, then fill the strictly
        lower-triangular entries uniformly in [0, d_i). Reject and redraw any
        composition whose largest diagonal entry exceeds q^(d/2 - 1). LLL-reduce
        before enumeration. The construction is declared here in full so that
        arm N is not "some random lattice" but a reproducible object.
      arm_Q: >-
        Draw A uniformly over Z_q^{(d/2) x (d/2)} from the stream; the lattice is
        { (x, y) in Z^{d/2} x Z^{d/2} : y = A x mod q } with basis in the
        standard q-ary block form. Determinant q^(d/2). LLL-reduce before
        enumeration.
      arm_M: >-
        Draw A uniformly over (R_n / q R_n)^{k x k} from the stream; the lattice
        is { (x, y) in R_n^k x R_n^k : y = A x mod q }, embedded coefficientwise
        with the coefficient order (constant term first) declared and fixed.
        Determinant q^(d/2). LLL-reduce before enumeration. THE REDUCED BASIS IS
        NOT REQUIRED TO RESPECT THE RING ACTION; the census is basis-independent
        and the divisibility check tests the lattice, not the basis.
      arm_P: >-
        Take the arm-N instance at the same index and dimension, apply
        diag(t, 1, ..., 1), then rescale the whole basis by t^(-1/d) so that the
        determinant is unchanged. t = 1.0 must reproduce the arm-N instance
        exactly, which is itself a checkable identity.
      arm_Z: >-
        The standard basis of Z^d. No randomness. Determinant 1.

  arms_and_controls:
    treatment: >-
      Arm M, the ML-KEM-shaped module q-ary lattices, and the derived quantities
      rho_d(M), the 2n-divisibility residue, and the orbit-size histogram.
    measured_null: >-
      Arm N, unstructured random integer lattices at matched rank and
      determinant, whose forced value is 1.000 for rho_d from Siegel's mean value
      theorem, with acceptance band 3 standard errors under the Rogers variance:
      +/- 0.283 / 0.212 / 0.159 / 0.119 / 0.089 / 0.067 at
      d = 12 / 16 / 20 / 24 / 28 / 32 over 20 instances. THIS NULL CAN FAIL IN
      THREE DISTINGUISHABLE WAYS -- the recalled theorem could be wrong as used,
      the HNF sampler could fail to equidistribute (HEUR-SB-2), or the enumerator
      could be wrong -- and each has a different repair, which is why it runs
      before anything else.
    second_null_for_attribution: >-
      Arm Q, plain q-ary at matched (d, det, q). Arm Q exists because the module
      claim must be tested as M-versus-Q, not M-versus-N: any difference between
      M and N could be caused by q-ary-ness alone, and Q is the object that
      isolates it. Pre-registered in the hypothesis as falsification condition F5.
    positive_control: >-
      Arm P at t >= 2.0, where the effect MUST appear: stretching one axis and
      rescaling provably evacuates the ball, so rho must fall. Required outcome
      rho(4.0) <= 0.5 * rho(1.0). IF IT DOES NOT, THE INSTRUMENT IS BLIND AND NO
      NEGATIVE RESULT MAY BE REPORTED FROM ANY ARM. This is a hard gate on the
      whole package, not a diagnostic.
    graded_control: >-
      Arm P at t in {1.0, 1.25, 1.5, 2.0, 4.0} -- four interior points beyond the
      t = 1.0 identity -- with monotonicity of rho(t) reported explicitly. The
      parameter meant to destroy the signal is t; a quantity that fails to decay
      in t is the canonical artifact tell. The smallest t at which decay becomes
      detectable IS the instrument's sensitivity floor and is reported as a
      number.
    instrument_control: >-
      Arm Z: |S(Z^d)| against the exact coefficient sum of theta_3(z)^d over the
      same radius, computed independently by convolution of one-dimensional
      integer-point counts. EXACT INTEGER EQUALITY required at every d in
      {4, 8, 12, 16, 20, 24, 28, 32}.
    ordering_control: >-
      Execution order is FROZEN: Z, then N, then P, then Q, then M. Arms Z, N and
      P are completed, written, and hash-committed BEFORE any arm-Q or arm-M
      basis is constructed. The decision rule for G4 is executed on the (N, Q)
      pair before arm M is read; if it emits the same verdict there as it later
      does on M, it discriminates nothing and must be rewritten before M is
      looked at. The commitment digest of the N and P results is recorded in the
      run manifest and is verifiable after the fact.
    comparability_policy: >-
      No cross-contract comparison to any prior EXP-MLKEM-* artifact is
      permitted: none of them measured this observable, and a shared numeric seed
      implies nothing about stream, construction, or output equivalence. Any
      comparison to an external published saturation measurement requires a
      separately registered comparator contract naming both sources, the
      normalisation, and the expected relation.

  independent_variables:
    - rank d
    - arm (N, Q, M, P, Z)
    - module shape (n, k) at fixed d
    - planted stretch t
    - modulus q (primary vs robustness)

  metrics:
    primary:
      - "rho_d = |S(L)| / (4/3)^(d/2), per instance and as an arm mean with sample standard deviation and standard error, per arm per d."
      - "rho_d(M) - rho_d(Q) and rho_d(M) - rho_d(N), with 3-standard-error bands."
      - "Fitted OLS slope s of log2(rho_d) against d, per arm, reported over all d and over d >= 20, with the derived memory exponent 0.20751874963942182 + s and its confidence interval."
      - "2n-divisibility residue |S| mod 2n for every arm-M instance."
    secondary:
      - "Orbit-size histogram of S(L) under the group generated by v -> X*v and v -> -v, arm M; and under v -> -v alone, arms N and Q."
      - "Boundary-band count: vectors with | ||v|| / R - 1 | <= 1e-6, per instance."
      - "Enumeration node count, peak recursion depth, and wall time per instance."
      - "Gram-Schmidt profile of the reduced basis per instance (log norms), retained for post-hoc cost analysis."
      - "Arm Z exact-equality table."
      - "The Stage-5 propagated interval on log2 M and c* at n_peak = 426.4 / 634.4 / 871.8, printed together with the sentence that c* < 1/3 is unaffected."

  heuristic_under_test: HEUR-SB-2

  preregistered_prediction:
    quantity: >-
      The mean of rho_d over 20 independent instances of arm N, at each d in the
      ladder.
    formula: >-
      E[rho_d] = 1 exactly, from E|S(L)| = vol(B_d(R)) / det(L) = (R/gh)^d =
      (4/3)^(d/2); standard error over m instances = 1 / sqrt(m * (4/3)^(d/2))
      under Var|S| approximately E|S|.
    source: >-
      Siegel's mean value theorem for the Haar measure on unimodular lattices,
      and Rogers' second moment theorem. RECALLED, UNVERIFIED -- NOT READ, no
      author, year, theorem number, page or venue is asserted. Stage 1 of this
      contract is simultaneously the empirical test of these two statements and
      the null arm; a failure is reported as a refutation of the prediction's
      source, not of anything about lattices in the ML-KEM sense.

  scale_relevance:
    tier: toy
    justification: >-
      Conclusions transfer across scale ONLY as follows, and the limits are the
      point. (a) The 2n-divisibility law and the log2(2n) orbit bound are
      ALGEBRA and hold at every n, including n = 256, because the negacyclic
      shift is an isometry at every n -- these transfer as derivations, not as
      measurements. (b) The POPULATION result does NOT transfer: d <= 32 against
      the campaign's n_peak = 426.4 / 634.4 / 871.8 is a factor of 13 to 27, the
      transfer is HEUR-SB-3, and HEUR-SB-3 is declared unvalidated with its own
      falsification condition. (c) The q-ary non-contamination argument
      (R/q = 0.0221 / 0.0294 at d = 16 / 32) is a property of these toy
      parameters and says nothing about projected sublattices at attack scale.
    correspondence: >-
      null. No sampling correspondence is used; the lattices are sampled
      directly and the measurement is exhaustive within the declared radius.

  tail_checks:
    - >-
      Extreme-instance check: the largest and smallest |S| observed per arm per
      d, against the Poisson tail probability implied by mean (4/3)^(d/2). An
      instance in the far tail is reported individually with its seed rather than
      averaged in silently.
    - >-
      Radius-perturbation check: recompute |S| at R * (1 +/- 1e-4) on a
      pre-declared subset of instances and confirm the count changes by
      approximately d * 1e-4 in relative terms, as the derivative argument
      requires. A count that does not respond to the radius as derived means the
      threshold arithmetic is wrong.
    - >-
      Shape-separation check at d = 32: the two module shapes (8,2) and (4,4)
      share d and determinant and differ in 2n (16 vs 8). Their rho values must
      agree within the statistical band while their divisibility moduli differ --
      a consistency requirement no tuned quantity has to satisfy.

  replication:
    seeds: [559972]
    seed_note: >-
      One master seed; all instance streams are derived from it by the declared
      SHA-256 rule, so 20 independent instances per cell are replicates in the
      statistical sense and the whole package is reproducible from the single
      integer. A second master seed is NOT required for the primary result but
      IS required before any structural difference (G4 above threshold) may be
      reported: a second-seed replication of the M and Q arms at the two
      implicated d values is a precondition of that reading.
    independent_instances: 20

  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 2
    maximum_memory_gb: 4
    maximum_runs: 1
    no_network: true
    stage_budgets:
      stage0_z_control_seconds: 300
      stage1_null_arm_seconds: 900
      stage2_graded_control_seconds: 900
      stage3_q_and_m_arms_seconds: 4800
      stage4_analysis_seconds: 300

  execution_stages:
    - stage: 0
      name: instrument gate (arm Z)
      can_terminate_run: true
      description: >-
        Enumerate Z^d for d in {4, ..., 32} and compare integer-to-integer
        against the theta-series convolution. THIS IS THE CHEAPEST DECISIVE GATE
        AND IT RUNS FIRST. A single mismatch halts the package with an
        instrument-failure report and no arm is read.
    - stage: 1
      name: null arm and forced-value test (arm N)
      can_terminate_run: true
      description: >-
        Run arm N alone across the ladder; compare the mean rho_d against the
        Siegel forced value 1.000 within the declared band; write and hash-commit
        the results. A miss halts the package: the forced-value structure of the
        hypothesis has failed, which is the most informative available outcome
        and is the deliverable in that branch.
    - stage: 2
      name: graded positive control (arm P)
      can_terminate_run: true
      description: >-
        Run t in {1.0, 1.25, 1.5, 2.0, 4.0} at d = 24, verify the t = 1.0
        identity against the arm-N instance, and require strictly monotone decay
        with rho(4.0) <= 0.5 * rho(1.0). Failure halts the package; no negative
        may be reported from any arm.
    - stage: 3
      name: treatment and attribution arms (Q then M)
      can_terminate_run: false
      description: >-
        Run arm Q, then arm M, with the 2n-divisibility check on every M
        instance. Arm M is the last object constructed in the entire package.
    - stage: 4
      name: analysis and propagation
      can_terminate_run: false
      description: >-
        Fit s, report the exponent interval, evaluate G4 against its threshold,
        and propagate to log2 M and c* at n_peak = 426.4 / 634.4 / 871.8 under
        HEUR-SB-3, printing in the same paragraph that c* < 1/3 is unaffected
        because reaching it would require an exponent of 0.019702 / 0.028567 /
        0.004392.

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, archived, and execution-authorized by the Coordinator. It carries no approved_by field.
    - Halt at stage 0 on any Z^d mismatch.
    - Halt at stage 1 if the arm-N mean lies outside the declared band at any d.
    - Halt at stage 2 if the graded control does not decay monotonically or does not reach rho(4.0) <= 0.5 * rho(1.0).
    - Halt the affected cell, and only that cell, if the enumeration node cap of 1e8 is reached; record it as budget-exhausted and continue the remaining cells.
    - Halt the package if total wall clock reaches 7200 seconds, reporting exactly which cells completed.
    - Do not add, remove, or retune any arm, radius, threshold or band after any number has been observed. Any change requires a versioned amendment with confirmatory_status exploratory_only and is never an edit.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any arm-M or arm-Q instance constructed before the arm-N and arm-P commitment digests are written.
    - Any use of a floating-point norm in the membership decision, or any gh computed at fewer than 50 decimal digits.
    - Any unexplained nonzero |S| mod 2n in arm M without an exhibited vector fixed by a power of X.
    - Any t = 1.0 arm-P instance that does not reproduce its arm-N counterpart exactly.
    - Any post-hoc change to the G4 detection threshold of 0.15, to the 3-standard-error bands, or to the ladder.
    - Any reported comparison against an external saturation measurement without a separately registered comparator contract.

  infrastructure_failure_disposition: >-
    A timeout, node-cap exhaustion, crash, memory exhaustion, missing dependency,
    or interpreter failure is INFRASTRUCTURE SIGNAL AND IS NEVER NEGATIVE
    MATHEMATICAL EVIDENCE (AGENTS.md rule 5). Specifically: node-cap exhaustion
    at any d means the census is unaffordable at that d in this environment and
    is recorded as such with the node count reached; it is NOT evidence that the
    population differs from (4/3)^(d/2), NOT evidence about ML-KEM, and NOT a
    reason to report a truncated ladder as a completed one. The honest deliverable
    in that branch is the completed prefix of the ladder plus a costed
    infrastructure request. Environment facts verified in the authoring session
    and to be re-verified by the Executor at setup: numpy 2.4.6 present; `sage`
    and `fpylll` both absent (ModuleNotFoundError). No stage of this contract
    requires either.

  success_criterion: >-
    This draft has NO current success outcome because it is not authorized for
    execution. If a later, separately approved and frozen successor is executed,
    its only positive disposition is: stage 0 exact at every d; stage 1 arm-N
    mean inside the declared band at every completed d; stage 2 monotone decay
    with rho(4.0) <= 0.5 * rho(1.0); stage 3 zero unexplained 2n-divisibility
    residues; and a reported memory-exponent interval of width at most +/- 0.004
    bits per dimension over the completed ladder, together with the arm-M-versus
    -arm-Q comparison stated with its 3-standard-error band whichever way it
    falls. THAT DISPOSITION IS A CALIBRATION, NOT A SECURITY RESULT: it
    establishes no attack, no cost, no exponent movement, no crypto-scale claim,
    and no statement about any FIPS 203 parameter set.

  falsification_criterion: >-
    The paired hypothesis is falsified, in the parts that can be falsified, by:
    (i) the arm-N mean lying outside the Siegel band at any completed d, which
    refutes the claim that (4/3)^(d/2) is exactly forced as used;
    (ii) any unexplained nonzero |S| mod 2n in arm M, which refutes the
    divisibility law as implemented;
    (iii) a fitted |s| exceeding 0.01 bits per dimension in the unstructured arm,
    which refutes the constancy of the memory exponent over the measured range
    and therefore HEUR-SB-3;
    (iv) rho_d(M) - rho_d(Q) exceeding 0.15 at two consecutive d with the same
    sign, which falsifies the prediction that the population is
    structure-independent and is the single most interesting available outcome.
    A below-threshold G4 at every d is NOT a falsification: it is a CONTROLLED
    NULL and is a required deliverable under the hypothesis's F7.

  outcomes:
    no_execution_authorization: >-
      The only current disposition: a review_required draft. No run, no
      observation, no evidence, no mathematical inference.
    future_calibration_readout: >-
      Only after separate approval, freezing, authorization and a valid
      execution. Scoped toy-only, memory-only, and never an ML-KEM security
      claim in either direction.
    controlled_null: >-
      Arm M indistinguishable from arm Q in population. A real and reportable
      result which still discharges the measured half of completion criterion 1
      and must not be written up as a failure.
    instrument_failure: >-
      Stage 0, 1 or 2 gate failure. Reported as an instrument result; no arm
      reading and no negative about any lattice family is admissible.
    infrastructure_or_budget_failure: >-
      Inconclusive infrastructure signal, never evidence against H-MLKEM-fef5ae
      or against any proposition about ML-KEM.

  required_artifacts:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - Enumerator and construction source with sha256, plus the environment record (python version, numpy version, verified absence of sage and fpylll).
    - Arm-Z exact-equality table with both independent computations.
    - Arm-N and arm-P results with their commitment digests, written before any arm-Q or arm-M construction.
    - Per-instance raw records: arm, d, q, (n,k) where applicable, instance index, seed inputs, det, gh to 50 digits, R^2 to 50 digits, |S|, rho, boundary-band count, orbit histogram, node count, wall time.
    - The divisibility check output for every arm-M instance.
    - The fitted exponent with its interval, both fits (all d, d >= 20).
    - The Stage-4 propagation table with the c* < 1/3 statement printed beside it.
    - Manifest, exact command, git commit and dirty-tree state, stdout, stderr, timestamps, resource measurements, and the inference block (requested policy, backend, resolved model id, model_verified).
    - Snapshot archive followed by independent validation and red-team review before any evidence record is written.

  approval_requirements:
    - Independent review confirms that the forced values (Siegel band, 2n-divisibility, Z^d theta count) are derived rather than fitted, and that each can actually fail.
    - Independent review confirms the ordering control is enforceable from the artifacts, i.e. that the N and P commitment digests provably precede the M construction.
    - Coordinator separately approves and freezes without editing this draft.
    - Any claimed structural difference (G4 above threshold) requires a second-seed replication before it may be written into an evidence record, and is routed to AGENTS.md rule 12 if presented as contradicting an existing evidence record.

  approval_status: >-
    Pending Coordinator review. No approved_by field is present because this
    draft is not approved, and no execution authorization exists. GOAL-MLKEM-003
    is closed_at_budget; this contract does not reopen it and asserts no
    entitlement to a budget.

  inference:
    requested_policy: research-deep
    resolved_model_id: claude-opus-5
    reasoning_effort: null
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the policy aliases in
      orchestration/model-policies.yaml; every alias falls back to one model.
      Recorded, never silently substituted (AGENTS.md rule 11).
    degraded_allowed: false
    degraded_requirements: []
    model_verified: false
    model_verified_reason: >-
      No adapter probe receipt exists for this session; `python3 -m
      orchestration.adapter doctor --probe` was not run.
