    off-lattice rungs do NOT have nb = 2n: the pinned builder gives
    nb = n + 3*ceil(n/3) = 22/23/28/29 at n = 10/11/13/14, so any closed form
    written with nb = 2n would be wrong there. (6) schemas/hypothesis.schema.json
    and schemas/experiment.schema.json require an id suffix [0-9]{3,} and set
    additionalProperties false, which is incompatible BOTH with the mandated
    random 6-hex identifiers (AGENTS.md rule 14, under which these two ids were
