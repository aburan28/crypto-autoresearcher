  discrepancies_found_against_the_dispatching_summary: >-
    RECORDED BECAUSE THE COMMITTED RECORD WINS. (1) 17,947 IS NOT A NULL
    DEFICIT. TASK-20260731-016 results.json records rank_null_restricted =
    156,520 = sr_pred exactly, so the support-restricted CTRL-B null's OWN
    defect is ZERO; 17,947 = 156,520 - 138,573 is the SEM's deficit against
    that validating baseline. (2) 17,947 CARRIES NO INDEPENDENT INFORMATION
    beyond G2: rank_sem = 138,573 was already the committed BATCH-002 anchor
    and sr_pred = 156,520 was already committed, so the only new bit is that
    rank(null|sem_support) = sr_pred - which EV-DREG-008 says itself. The
    "two independent point predictions" framing in IDEA-20260803-202a15 is
    therefore overstated, and the gate is restated on the two genuinely
    independent NULL numbers 7,110 and 0. (3) EV-SIG-006's inference that
    "every histogram-matched generic null saturates to rank = ncols - |V|" is
    CONTRADICTED BY ITS OWN OBSERVATION: N1 at n = 9 D6 has rank 28,939 against
    ncols - |V| = 29,332. The n = 9 known-shape control is anchored to N0
    only. (4) EV-SIG-008 records the n = 12 D6 SEM deficit as 17,950
    (rank 138,570, seed 2) while EV-DREG-008 records 17,947 (rank 138,573,
    seed 2026), with ncols 174,033 vs 174,035 and deleted columns 16,018 vs
