experiment:
  id: EXP-SDEG-f7faa8
  hypothesis_id: H-SDEG-0dd021
  version: 1
  title: >-
    Two-stage below-freeze test of the frozen closed form Phi. STAGE 1 is a
    ZERO-COMPUTE four-number gate against committed n = 9 and n = 12 cells;
    STAGE 2 (the n = 9..13 by D = 5,6 ladder over both null arms) is NOT
    authorized by this contract and requires a Stage-1 PASS plus a separate
    committed Coordinator ledger authorization.
  status: review_required

  objective: >-
    Decide, at zero compute, whether the frozen parameter-free closed form Phi
    (H-SDEG-0dd021 assumptions clause 1) can produce the two committed and
    genuinely independent n = 12 D = 6 NULL numbers - 7,110 for the
    system-restricted arm R (EV-SIG-008, seed 2) and EXACTLY 0 for the
    matrix-projected arm P (TASK-20260731-016 / EV-DREG-008, seed 2026) -
    while simultaneously reproducing the n = 9 D = 6 full-support saturation
    (31,179) and the n = 12 D = 5 arm-R zero defect (29,418), with NO
    PARAMETER FITTED TO ANY OF THEM. If it can, authorize a ladder that tests
    whether Phi describes a mechanism or one point. If it cannot, emit a named
    no-go stating which (n, D) ranges make d_reg-derived cost predictions
    unusable, in a form IDEA-20260803-fa9839 can consume as a
    NOT-THRESHOLD-CONVERTIBLE finding. BOTH OUTCOMES ARE PLANNED DELIVERABLES.

  inputs:
    frozen_closed_form_ref: >-
      ledger/hypotheses/H-SDEG-0dd021.yaml, assumptions clause 1, items
      (1)-(9). THE CLOSED FORM IS PART OF THIS FROZEN CONTRACT. It is
      reproduced in full below so that this file is self-contained and
      hash-freezable.
    frozen_closed_form:
      family_structure: >-
        t = 3 chained Semaev, ti = 0. k(n) = ceil(n/3); nb(n) = n + 3*k(n);
        n equations of degree 2 and n of degree 3. nb = 2n ONLY when 3 | n.
        nb = 18/22/23/24/28/29 at n = 9/10/11/12/13/14.
      counting: >-
        N(nb,D) = sum_{j<=D} C(nb,j);
        nrows(n,D) = n*N(nb,D-2) + n*N(nb,D-3).
      untruncated_series_with_field_equations_carried: >-
        H_n(z) = (1+z)^{nb(n)} * (1+z^2)^{-n} * (1+z^3)^{-n};
        h_k = [z^k] H_n(z), UNTRUNCATED. The field equations x_i^2 = x_i are
        carried in TWO places and absorbed in neither: (a) the numerator
        (1+z)^{nb} is the Hilbert series of B = F_2[x]/(x_j^2 - x_j) itself;
        (b) each Koszul factor is (1 - z^{d_i})/(1 - z^{2 d_i}) =
        1/(1 + z^{d_i}), whose 2*d_i pole encodes the trivial syzygy
        f_i*(f_i + 1) = 0 that Frobenius forces in B.
      legacy_truncation_and_baseline: >-
        h_k^+ = h_k while h_j > 0 for all j <= k, else 0;
        phi_full(n) = min{k : h_k <= 0};
        sr_pred(n,D) = N(nb,D) - sum_{k<=D} h_k^+.
        THE TRUNCATION IS A MODELLING CONVENTION, NOT A PROPERTY OF THE
        SYSTEM. It is the suspect under test.
      up_closure_law: >-
        Cols_F(D) = { m : exists i, exists m' in supp(f_i), m' | m,
        deg(m) - deg(m') <= D - d_i } (EV-SIG-006, machine-verified, zero
        cancellation/parity deviation). a_k = #{degree-k elements};
        A = sum_{k<=D} a_k; u_k = C(nb,k) - a_k.
      support_restricted_series: >-
        A_F(z) = sum_k a_k z^k;
        S_{n,F}(z) = A_F(z) * (1+z^2)^{-n} * (1+z^3)^{-n};  s_k = [z^k] S_{n,F}.
        DERIVED IDENTITY, VERIFIED PER CELL AND NEVER ASSUMED: if u_k = 0 for
        all k < D then s_k = h_k for k < D and s_D = h_D - u_D.
        phi_F = min{k : s_k <= 0}.
        COROLLARY (a theorem in-model, not a fit): A - sum_{k<=D} s_k =
        N(nb,D) - sum_{k<=D} h_k, so an untruncated restricted prediction
        equals the untruncated full one - i.e. sr_pred is SUPPORT-INDEPENDENT,
        exactly as GOAL-DREG-001 asserts.
      arm_rule_HEUR_BF_3: >-
        ARM P (matrix-projected: full-support SYSTEM whose Macaulay columns
        are deleted afterwards) uses h:
          rank_P = sr_pred(n,D) - max(0, sr_pred(n,D) + u_D - N(nb,D)).
        ARM R (system-restricted: the EQUATION supports are themselves
        constrained) uses s and the collapse rule below.
        Arm classification is fixed from committed CONSTRUCTION artifacts and
        NEVER from a measured rank.
      collapse_rule_candidates: >-
        EXACTLY THREE, FROZEN, CLOSED BEFORE EVALUATION, EACH PARAMETER-FREE,
        differing ONLY in Q:
          C1 HARD_FREEZE       rank_R = A - sum_{k < phi_F} s_k
          C2 SIGNED_CARRY      rank_R = A - max(|V|, sum_{k <= D} s_k)
          C3 VARIETY_COLLAPSE  rank_R = A - |V| if D >= phi_F,
                               else A - sum_{k <= D} s_k
      derived_outputs: >-
        deficit = sr_pred(n,D) - rank; rankK_D is modelled as nrows - sr_pred
        (the identity EV-SIG-008 verified for arm R at n = 12: rankK6_null =
        26,792 = 183,312 - 156,520), hence extra = deficit under Phi.
      degrees_of_freedom: >-
        NONE beyond the choice among C1/C2/C3, which is itself frozen as a
        closed three-member list. Every member is evaluated and every result
        is reported.
    committed_gate_cells:
    - id: CELL-A
      arm: R
      source: ledger/evidence/EV-SIG-008.yaml (GATE 1 FINAL)
      cell: {n: 12, D: 6, seed: 2, nb: 24, t: 3, ti: 0}
      committed: {ncols: 174033, nrows: 183312, u_6: 16018, rank: 149410,
                  sr_pred: 156520, deficit_6: 7110, extra_6: 7110,
                  rankK6: 26792, variety_size: 2, ncols_minus_V: 174031}
      arm_evidence: >-
        Built by safe pools + seeded greedy set-cover + 5 swap repairs so that
        the D6 column set equals the sem's EXACTLY (EV-SIG-006 N1
        construction). The EQUATION SUPPORTS were constructed; this is arm R.
      provenance_caveat: >-
        WEAKEST PROVENANCE IN THE GATE. EV-SIG-008's own
        artifact_absence_statement records that its run directories are on a
        pre-current manifest schema or absent, and that
        experiments/EXP-SIG-008/specification.yaml is prose in a .yaml file so
        the experiment does not register: "no claim in this record is bound to
        a frozen protocol or to a reproducible run receipt through the
        ledger". Figures survive via the live transcript and git branch
        exp-sig-008-artifacts commit d1d36dd.
    - id: CELL-B
      arm: P
      source: >-
        coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-016/results.json
        (adopted as ledger/evidence/EV-DREG-008.yaml)
      cell: {n: 12, D: 6, seed: 2026, nb: 24, t: 3, ti: 0}
      committed: {ncols_restricted: 174035, ncols_null_full: 190051,
                  ncols_deleted: 16016, nrows: 183312,
                  rank_null_restricted: 156520, rank_null_full: 156520,
                  sr_pred: 156520, deficit_of_this_null: 0,
                  rank_sem: 138573, sem_deficit_vs_this_baseline: 17947}
      arm_evidence: >-
        results.json: arm = null_restricted_to_sem_support;
        deleted_set_equals_null_minus_sem = true; the null system hash equals
        the CTRL-A pin; restricted_adj_sha256 is derived from
        source_adj_sha256 via restriction_sha256_kept_idx. The SYSTEM is
        full-support and only the MATRIX columns were deleted; this is arm P.
      what_17947_is_and_is_not: >-
        17,947 = 156,520 - 138,573 is the SEM'S deficit against this null
        baseline, NOT this null's deficit. THIS NULL'S OWN DEFICIT IS ZERO.
        rank_sem = 138,573 was already the committed BATCH-002 anchor
        (admission metric rank_sem_anchor_138573_unchanged = true) and
        sr_pred = 156,520 was already committed, so the ONLY new information
        in 17,947 is that rank(null|sem_support) = sr_pred - which
        EV-DREG-008 states itself. It is carried as a derived consistency
        check, not as an independent point prediction.
    - id: CELL-C
      arm: P (full support, u_6 = 0)
      source: ledger/evidence/EV-SIG-006.yaml (N0, determinism rerun)
      cell: {n: 9, D: 6, seed: 1, nb: 18, t: 3, ti: 0}
      committed: {ncols: 31180, nrows: 45324, u_6: 0, rank: 31179,
                  sr_pred: 28068, variety_size: 1, extra_6: 4986,
                  freeze_degree: 6, frozen_quotient: 3112,
                  HF: [1, 18, 144, 645, 1566, 738, 0]}
      control_scope_warning: >-
        THIS CONTROL IS ANCHORED TO N0 ONLY. EV-SIG-006's inference paragraph
        asserts that EVERY histogram-matched generic null saturates to
        ncols - |V|, but its own observation records N1 (exactly
        column-matched, |V| = 0, ncols 29,332) at rank 28,939 - 393 BELOW
        ncols - |V|. The blanket claim is contradicted by its own data and is
        NOT used as a control. N1 at n = 9 D6 is REPORTED, not gating.
    - id: CELL-D
      arm: R
      source: ledger/evidence/EV-SIG-008.yaml (GATE 3 FINAL)
      cell: {n: 12, D: 5, seed: 2, nb: 24, t: 3, ti: 0}
      committed: {sem_ncols: 46709, nrows: 31512, u_5: 8746,
                  null_rank: 29418, sr_pred: 29418, null_extra_5: 0,
                  sem_rank: 28097, sem_deficit_5: 1321, sem_extra_5: 1322,
                  support_induced_share_pct: 0.0}
      why_gating: >-
        Degree-adjacent nearby-object control. Phi must return 0 here and
        7,110 one degree higher ON THE SAME OBJECT.
    reported_not_gating_cells:
    - {id: CELL-E, arm: R, source: EV-SIG-006, cell: {n: 9, D: 6, seed: 1},
       committed: {construction: N1, ncols: 29332, rank: 28939, sr_pred: 28068,
                   deficit_6: -871, extra_6: 7226, variety_size: 0,
                   ncols_minus_V: 29332}}
    - {id: CELL-F, arm: R, source: EV-SIG-006, cell: {n: 9, D: 5, seed: 1},
       committed: {construction: N1, ncols: 11032, u_5: 1584, rank: 9135,
                   sr_pred: 9504, extra_5: 369,
                   note: "369 replicated on the independent RUN-c variant"}}
    - {id: CELL-G, arm: sem, source: EV-SIG-008, cell: {n: 9, D: 6, seed: 1},
       committed: {rank: 27292, deficit_6: 776, extra_6: 8897,
                   residual_6: 2615, variety_size: 6}}
    - {id: CELL-H, arm: sem, source: EV-SIG-008, cell: {n: 12, D: 6, seed: 2},
       committed: {rank: 138570, deficit_6: 17950, extra_6: 17982,
                   rankK6: 26760, residual_6: 2722}}
    - {id: CELL-I, arm: sem, source: EV-SIG-008, cell: {n: 9, D: 5, seed: 1},
       committed: {deficit_5: 909, support_induced_share_pct: 40.6,
                   support_induced_count: 369}}
    seed_spread_datum_already_in_the_ledger: >-
      CELL-H and CELL-B report the SAME sem object at n = 12, D = 6 from two
      lineages at two seeds: rank 138,570 (seed 2, EV-SIG-008) versus 138,573
      (seed 2026, TASK-20260731-016), with ncols 174,033 vs 174,035 and
      deleted columns 16,018 vs 16,016. Neither record cross-references the
      other. This is a live, unexploited datum bearing directly on HEUR-BF-1
      and Stage 1 must report it. IT MAY NOT BE TREATED AS A SEED SPREAD UNTIL
      STAGE 1 VERIFIES, FROM THE COMMITTED SYSTEM HASHES AND BUILDER PATHS,
      THAT THE TWO CELLS WERE BUILT BY THE SAME BUILDER UNDER THE SAME
      CONVENTIONS. If that cannot be established, it is recorded as
      inconclusive rather than as a spread.
    variety_sizes_available: {n9_N0: 1, n9_N1: 0, n9_sem: 6, n12_N1: 2}
    variety_sizes_missing: >-
      |V| for the n = 12 sem and for the n = 12 arm-P null are NOT committed.
      C2 and C3 need |V| on the arm they are applied to. The four GATE cells
      need only |V_N0(9)| = 1 and |V_N1(12)| = 2, both committed, so the gate
      is fully evaluable; the missing values block only sem-arm reporting and
      are listed in blocking_nulls.
    stage2_ladder_definition: >-
      n in {9, 10, 11, 12, 13} x D in {5, 6} x arms {P, R} x >= 2 seeds.
      nb(n) = n + 3*ceil(n/3), so the off-lattice rungs n = 10, 11, 13 have
      nb = 22, 23, 28 and are NOT the idealized nb = 2n family; the builder
      admits them (family_params in
      research/dreg-linear-law/scripts/dreg_crypto_cost_model.py, read and
      verified from experiments/EXP-SIG-005/src/semaev_tree.py) but no
      off-lattice cell of this lineage is committed, so L0 below verifies
      constructibility before any off-lattice cell is charged. n = 14
      (nb = 29) is OPTIONAL and EXPLICITLY OUTSIDE the completion gate. NOT
      AUTHORIZED BY THIS CONTRACT.

  controls:
  - >-
    CTRL-1 ZERO-COMPUTE TWO-NUMBER GATE (arm R and arm P at the same n = 12,
    D = 6). Evaluated BEFORE the ladder is authorized and BEFORE any rank is
    computed. Phi must return 7,110 +/- 5 per cent at CELL-A and EXACTLY 0 at
    CELL-B. These are the two genuinely independent committed null numbers.
    This is the cheapest possible falsification of HEUR-BF-2 and HEUR-BF-3 and
    it runs first.
  - >-
    CTRL-2 n = 9 KNOWN-SHAPE CONTROL. Phi must reproduce EXACTLY the committed
    saturation rank = ncols - |V| = 31,180 - 1 = 31,179 at CELL-C (N0,
    machine-confirmed, determinism-reproduced). Anchored to N0 only; see the
    control_scope_warning on CELL-C. Phi's prediction at CELL-E (N1, 28,939)
    is REPORTED alongside, non-gating, precisely because the committed record
    over-generalizes there.
  - >-
    CTRL-3 DUAL-NULL CONTROL. Both arms are evaluated at EVERY cell, so Phi is
    constrained by the DIFFERENCE between them and not only by their levels.
    At the gate this is CELL-A vs CELL-B (committed difference 7,110). In
    Stage 2 it is arm P and arm R at every ladder cell. A candidate that
    returns the same value for both arms at a cell where the committed ranks
    differ is refuted at that cell.
  - >-
    CTRL-4 FROZEN-PARAMETER CONTROL. The closed form, its three collapse
    candidates, the arm rule, the four gate thresholds and all seven
    predictions are frozen in this file BEFORE any evaluation. Any post-hoc
    adjustment VOIDS THE BATCH rather than producing a revised model, unless
    recorded as a versioned protocol_amendment with confirmatory_status
    exploratory_only. EV-IC-002 records this exact lane retracting a support
    verdict because a criterion was revised after the prior criterion had been
    observed to fail; KN-FIND-029 records five false-green escapes across
    three repairs of one mutation control.
  - >-
    CTRL-5 RECOMPUTATION CONTROL (Stage 2). One cell per arm is recomputed
    independently with a DIFFERENT pivoting order and must match the primary
    rank EXACTLY. Addresses the EV-DREG-004 lineage. A mismatch invalidates
    both computations for that cell (IR9) and is recorded as an open defect.
  - >-
    CTRL-6 ANCHOR-REPRODUCTION CONTROL. Before any new claim, the Stage-1
    evaluator recomputes sr_pred(9,3..6), sr_pred(12,3..6), HF(n=9), the
    frozen quotient 3,112, N(24,6) = 190,051, nrows(9,6) = 45,324,
    nrows(12,6) = 183,312 and nrows(12,5) = 31,512 from Phi clauses (2)-(4)
    and compares against the committed values. Any mismatch is INSTRUMENT
    DRIFT and halts the experiment (SR5); it is not evidence.
  - >-
    CTRL-7 INDEPENDENT ARITHMETIC RECOMPUTATION OF THE GATE. The Stage-1 gate
    arithmetic is recomputed by a second, non-originating session before the
    result is treated as a gate outcome. The Coordinator's own derivation in
    H-SDEG-0dd021 is NOT that second party.
  - >-
    CTRL-8 MULTIPLICITY CONTROL. The candidate list is closed at three. Every
    member is evaluated at every gate cell and EVERY result is reported,
    including the failures. A PASS is always reported as "1 of 3 pre-declared
    candidates", never as "the model works".
  - >-
    CTRL-9 ARM-CLASSIFICATION CONTROL. Every cell's arm is established from
    committed construction artifacts (system hashes, deleted-set derivation,
    construction description) BEFORE Phi is evaluated on it, and recorded with
    its evidence. A cell whose arm cannot be established is invalid for CTRL-3
    (IR6). Classifying an arm by its measured rank is a protocol violation.

  independent_variables:
  - "STAGE (1 zero-compute gate | 2 ladder), with a hard authorization gate between"
  - "collapse-rule candidate in {C1 HARD_FREEZE, C2 SIGNED_CARRY, C3 VARIETY_COLLAPSE}"
  - "arm in {P matrix-projected, R system-restricted}"
  - "n in {9, 10, 11, 12, 13} (Stage 2); n = 14 optional, out of gate"
  - "degree D in {5, 6}"
  - "seed (>= 2 per cell where budget permits; committed seeds 1, 2, 2026 always included)"

  metrics:
    primary:
    - >-
      G1: |predicted_deficit - 7,110| / 7,110 at CELL-A (arm R, n = 12, D = 6,
      u_6 = 16,018), per candidate. PASS iff < 0.05, i.e. predicted deficit in
      [6,754.5, 7,465.5] and predicted rank in [149,054.5, 149,765.5].
    - >-
      G2: predicted rank at CELL-B (arm P, n = 12, D = 6, u_6 = 16,016), per
      candidate. PASS iff EXACTLY 156,520 (predicted deficit EXACTLY 0). The
      tolerance is exact and not 5 per cent: the committed measurement is an
      exact equality with sr_pred, and a +/-5 per cent band would admit
      +/-7,826, exceeding the entire G1 effect and making the control vacuous.
    - >-
      G3: predicted rank at CELL-C (n = 9, D = 6, full-support N0), per
      candidate. PASS iff EXACTLY 31,179 = ncols - |V|.
    - >-
      G5: predicted deficit at CELL-D (arm R, n = 12, D = 5, u_5 = 8,746), per
      candidate. PASS iff EXACTLY 0 (predicted rank EXACTLY 29,418).
    - >-
      GATE VERDICT: PASS iff at least one single candidate satisfies
      G1 AND G2 AND G3 AND G5 SIMULTANEOUSLY with no parameter fitted.
      A candidate satisfying a strict subset is PARTIAL and authorizes
      nothing.
    secondary:
    - >-
      G4 (REPORTED, EXPLICITLY NON-GATING): Phi's sem-side quantity against
      17,947 (CELL-B) and 17,950 (CELL-H). Non-gating because Phi models NULL
      ranks and the sem's departure is the residual Phi is designed NOT to
      predict; this disposition is fixed here BEFORE the gate runs and may not
      be selected afterwards.
    - >-
      Per-candidate prediction at every reported_not_gating_cell (CELL-E..I),
      with residuals, reported in full including failures.
    - >-
      phi_full(n) and phi_F(n, D, F, arm) at every cell, with s_D = h_D - u_D
      and the per-cell verification that u_k = 0 for k < D.
    - >-
      HEUR-BF-1 seed spread of extra_D at every core cell, REPORTED BEFORE any
      model error at that cell (Stage 2), plus the Stage-1 builder-identity
      finding on the 138,570 / 138,573 pair.
    - >-
      Saturation-shape categorical classification per cell (saturating at
      ncols - |V| versus collapsing below it) against Phi's categorical
      prediction (Stage 2).
    - >-
      D5 support-induced share across n, reproducing the committed 40.6 per
      cent (n = 9) -> 0.0 per cent (n = 12) crossing (Stage 2).
    - >-
      Per-chunk receipts, system hashes, chunk-coverage exactness, and the
      independent-recomputation residual (Stage 2).
    - >-
      L0 lattice admissibility: for each n in {10, 11, 13, 14}, whether the
      pinned builder constructs the cell, with the resulting nb, equation
      degree histogram, ncols and nrows recorded (Stage 2 prerequisite).

  heuristic_under_test: HEUR-BF-2
  heuristic_under_test_note: >-
    Stage 1 tests HEUR-BF-2 (the truncation convention is the responsible
    discrepancy) and HEUR-BF-3 (the arm rule) jointly and at zero compute; G2
    is HEUR-BF-3's own falsifier. Stage 2 tests HEUR-BF-1 FIRST (seed spread
    before model error) and only then the ladder predictions.

  preregistered_prediction:
    quantity: >-
      The exact GF(2) Macaulay rank, and hence deficit_D = sr_pred - rank and
      extra_D, of boolean chained-Semaev null objects at (n, D, support, arm).
    formula: >-
      rank_P = sr_pred(n,D) - max(0, sr_pred(n,D) + u_D - N(nb,D));
      rank_R = A - Q with Q in {C1: sum_{k<phi_F} s_k;
      C2: max(|V|, sum_{k<=D} s_k); C3: |V| if D >= phi_F else sum_{k<=D} s_k};
      where nb(n) = n + 3*ceil(n/3), h_k = [z^k] (1+z)^{nb} (1+z^2)^{-n}
      (1+z^3)^{-n} UNTRUNCATED, s_k = h_k for k < D, s_D = h_D - u_D,
      phi_F = min{k : s_k <= 0}, A = sum_{k<=D} a_k, and {a_k, u_k} come from
      the up-closure law.
    source: >-
      DERIVED IN-REPO in ledger/hypotheses/H-SDEG-0dd021.yaml (mechanism). NO
      THEOREM IS CITED. Primary sources for boolean semi-regular Hilbert
      series are unreachable from this environment; any recalled form is a
      CANDIDATE TO TEST, never an authority, and is labelled so throughout.
      The up-closure law alone is committed in-repo (EV-SIG-006, machine
      verified). The skeleton's baseline-reproduction audit against ten
      committed structural numbers is recorded in the hypothesis and PASSED
      before this contract was written.

  coordinator_prior_disclosure: >-
    DISCLOSED RATHER THAN CONCEALED, AND NOT ACTED UPON. While deriving the
    skeleton the Coordinator computed h_6(n=12) = 7,494 (forced by the two
    committed values sr_pred(12,5) = 29,418 and sr_pred(12,6) = 156,520) and
    hence s_6 = h_6 - u_6 = 7,494 - 16,018 = -8,524 at CELL-A. That quantity
    is the MECHANISM STATEMENT itself - the support restriction pulls the
    effective freeze degree from phi_full(12) = 7 down to phi_F = 6, which is
    precisely the "below-freeze collapse" EV-SIG-008 named and left
    unexplained - so it belongs in the record. It also makes each candidate's
    G1 prediction computable in one line by any reader, so the Coordinator
    holds a NON-TRIVIAL PRIOR THAT G1 WILL NOT PASS. That prior is recorded
    here so it cannot be silently deployed later. IT AUTHORIZES NOTHING: it
    does not weaken G1, does not add a fourth candidate, does not reinterpret
    7,110, and does not pre-empt the gate. The Coordinator deliberately did
    NOT evaluate the collapse rules at the gate cells - that is Stage 1's job
    and it is executed and reported exactly as frozen, by a party that is not
    this session. An expected-negative gate that costs zero compute is a
    reason to run it, not a reason to soften it.

  scale_relevance:
    tier: toy
    justification: >-
      Boolean chained Semaev at n <= 14, nb <= 29, D <= 6, exact GF(2) rank,
      one instrument lineage, 2-3 seeds. CONCLUSIONS DO NOT TRANSFER. Boolean
      systems are not prime-field systems; a repaired boolean d_reg model does
      not transfer to the ECDLP target, and every citation toward prime-field
      cost must carry that gap explicitly. KN-OPEN-002 asks about growth over
      PRIME fields and IS NOT CLOSED, narrowed, or advanced by anything here.
      No exponent moves. Pollard rho remains the ECDLP baseline; sota_delta is
      zero on every attack axis. This is a MODEL REPAIR of a measurement
      instrument, not an attack.
    correspondence: null

  tail_checks:
  - >-
    CATEGORICAL SATURATION-SHAPE CHECK: at every cell Phi must state whether
    the object saturates at rank = ncols - |V| (the CELL-C shape) or collapses
    below it (the CELL-A shape), and be correct at 100 per cent of measured
    cells. A categorical prediction is much harder to satisfy by accident than
    a numeric one.
  - >-
    CROSSING CHECK: Phi must reproduce the OPPOSITION recorded across
    EV-SIG-006 and EV-SIG-008 - the D5 support-induced share falling from 40.6
    per cent (369/909, n = 9) to 0.0 per cent (0/1,321, n = 12) while the D6
    defect turns on over the same range. A model that predicts the magnitudes
    but not the crossing is describing two unrelated regimes and must say so.
  - >-
    SIGN CHECK: at CELL-E the committed deficit is NEGATIVE (-871, rank above
    sr_pred) while at CELL-A it is POSITIVE (+7,110). Any candidate whose
    prediction has the wrong sign at either cell is reported as
    sign-inconsistent even if its magnitude is close.
  - >-
    EXTREME-CASE CHECK: Phi's prediction at u_D = 0 (full support) must reduce
    to the arm-P rule with zero projection loss, i.e. to sr_pred, at every n
    and D below phi_full. If it does not, the parameterization is
    inconsistent.

  replication:
    seeds: [1, 2, 2026]
    independent_instances: 2
    policy: >-
      STAGE 1 is deterministic arithmetic over committed numbers and has no
      seed; its replication requirement is CTRL-7 (independent arithmetic
      recomputation by a non-originating session). STAGE 2 requires AT LEAST
      TWO SEEDS PER CELL wherever budget permits, and the committed seed for a
      cell is ALWAYS one of them so replication is anchored to a committed
      number. ANY SINGLE-SEED CELL IS EXPLICITLY MARKED single_seed IN THE
      RESULTS AND MAY NOT CONTRIBUTE TO ANY DETERMINISM CLAIM. HEUR-BF-1 IS
      MEASURED FIRST: the seed-to-seed spread of extra_D at every core cell is
      reported BEFORE any model error at that cell. A spread comparable to or
      larger than the model error means the model is fitting noise and MUST be
      reported as such.

