      wall_clock_seconds: 1800
      cpu_hours: 0.5
      maximum_memory_gb: 2
      maximum_runs: 3
      rank_computations: 0
      note: >-
        ZERO COMPUTE. Evaluating a frozen closed form at four committed cells
        is arithmetic. Runs: (1) gate evaluation + anchor reproduction,
        (2) CTRL-7 independent arithmetic recomputation, (3) report emission.
    stage2_NOT_authorized:
      wall_clock_seconds_ceiling: 28800
      cpu_hours: 8.0
      maximum_memory_gb: 24
      maximum_runs: 117
      authorization: >-
        REQUIRES (a) a Stage-1 PASS and (b) a SEPARATE committed Coordinator
        ledger authorization decision. GOAL-SDEG-001's committed next_action
        is "Protocol design PASS. Defer activation/executor until ECDLP
        verifier-hash and precommit residuals clear under a separate ledger
        authorization; no runs now." NOTHING IN THIS CONTRACT OVERRIDES THAT,
        AND NO PART OF STAGE 2 MAY BE STARTED UNDER STAGE-1 AUTHORITY.
      cost_shape: >-
        n = 13 D = 6 DOMINATES: nb = 28, ncols N(28,6) = 499,178, nrows
        361,933 - roughly 2.6x the columns and 2.0x the rows of the n = 12
        D6 cell that took 1,623.8 s at chunk_force 12,000 with 7.16 GB peak
        RSS (TASK-20260731-016). Ladder column counts: 31,180 (n=9), 110,056
        (n=10), 145,499 (n=11), 190,051 (n=12), 499,178 (n=13), 621,616
        (n=14, optional, out of gate). Chunked under a fresh write_scope so a
        truncated ladder reports what it covered rather than failing.

  stopping_rules:
  - >-
    SR1 HARD STAGE GATE. Stage 2 may not begin until BOTH (a) the Stage-1 gate
    verdict is PASS and (b) a separate Coordinator ledger authorization
    decision is committed and accepted by the post-commit verifier. A Stage-1
    PASS alone authorizes nothing. This contract must not smuggle a run past
    GOAL-SDEG-001's committed "no runs now" posture.
  - >-
    SR2 GATE FAILURE HALTS. On F1 (no candidate satisfies G1 and G2 and G3 and
    G5), Stage 1 halts immediately. The ladder is NOT authorized on any
    member of the frozen list, and the deliverable becomes the negative
    disposition (see success_criterion, branch NEGATIVE). Proposing a fourth
    candidate at that point is a NEW frozen contract, never an amendment of
    this one.
  - >-
    SR3 INVOCATION CAP. Any single invocation exceeding 600 s is killed AT A
    CHUNK BOUNDARY; completed chunks are flushed and receipted first. This is
    infrastructure censoring (AGENTS.md rule 5) and is NEVER evidence.
  - >-
    SR4 SCOPE-REDUCTION ORDER when budget is exhausted, applied in this exact
    order: drop n = 14; then n = 13 D = 6; then n = 13 D = 5; then the second
    seed at n in {10, 11}; then n = 11; then n = 10. The CORE (n in {9, 12} x
    D in {5, 6} x both arms x 2 seeds) is never dropped. If the core cannot
    complete, the batch reports what it covered with terminal status
    resource_exhaustion; A TRUNCATED LADDER REPORTS ITS COVERAGE RATHER THAN
    FAILING.
  - >-
    SR5 ANCHOR DRIFT HALTS. Any CTRL-6 anchor-reproduction mismatch halts the
    experiment. It is instrument drift, not evidence.
  - >-
    SR6 HEUR-BF-1 HALT. If the measured seed-to-seed spread of extra_D at any
    core cell is greater than or equal to Phi's absolute error at that cell,
    the ladder STOPS and the model is reported as fitting noise. Remaining
    ladder cells are not evidence for the model.
  - >-
    SR7 ARM-AMBIGUITY HALT. If a planned Stage-2 cell's arm cannot be fixed
    from construction artifacts before measurement, that cell is not run.
  - >-
    SR8 The n = 14 rung is attempted only after every gate-relevant deliverable
    is complete AND >= 3,600 s of budget remains; otherwise it is censored by
    SCOPE, not by failure, and is recorded as such.

  invalidation_rules:
  - >-
    IR1 INFRASTRUCTURE. Any timeout, OOM, kill, host restart, filesystem loss,
    checkpoint destruction, or codec failure is failed_infrastructure
    (AGENTS.md rule 5). It voids NO cell mathematically; the affected CHUNK is
    re-run. It is never negative evidence about Phi or about any hypothesis.
  - >-
    IR2 SYSTEM-HASH MISMATCH. If a cell's rebuilt system hash does not equal
    its recorded pin, the cell is completed_invalid.
  - >-
    IR3 COLUMN-SET MISMATCH. If the built column count or its degree histogram
    does not reproduce the committed value at a committed cell (CELL-A ncols
    174,033 with top slice 118,578; CELL-B restricted 174,035 / deleted 16,016
    all of degree 6; CELL-C 31,180; CELL-D 46,709), the cell is invalid -
    instrument drift.
  - >-
    IR4 CHUNK-COVERAGE DEFECT. If per-chunk receipts do not cover [0, ncols)
    exactly once, or the sum of per-chunk new pivots does not equal the
    reported rank, or any per-chunk carrier hash fails verification, the cell
    is invalid.
  - >-
    IR5 ANCHOR-REPRODUCTION FAILURE. Any recomputation of a committed anchor
    (sr_pred, nrows, ncols, HF, frozen quotient, or a committed rank) that
    disagrees invalidates the whole run set and halts under SR5.
  - >-
    IR6 ARM MISCLASSIFICATION. A cell whose arm cannot be established as P or
    R from committed construction artifacts is invalid for CTRL-3, and any
    dual-null conclusion drawn from it is void. Classifying an arm from its
    measured rank invalidates the cell outright.
  - >-
    IR7 POST-HOC ADJUSTMENT VOIDS THE BATCH. Any change to Phi clauses
    (1)-(9), to the three-member candidate list, to the arm rule, to the gate
    cells, to the G1/G2/G3/G5 thresholds, or to the seven predictions, AFTER
    any Stage-1 or Stage-2 number has been observed, voids the entire batch
    unless recorded as a versioned protocol_amendment with
    confirmatory_status: exploratory_only. Such a batch may never be evaluated
    against the original confirmatory criterion.
  - >-
    IR8 SEED/REPLICATION DEFECT. Duplicated seeds reported as independent, a
    cell reported under a seed outside the declared set, or a single-seed cell
    not marked single_seed, invalidates that cell.
  - >-
    IR9 RECOMPUTATION-CONTROL FAILURE. If CTRL-5's independent recomputation
    with a different pivoting order does not match the primary rank EXACTLY,
    BOTH computations are invalid for that cell and the disagreement is
    recorded as an open defect, never averaged or adjudicated by preference.
  - >-
    IR10 PROVENANCE DEFECT. A cell whose manifest lacks the exact command, git
    commit and dirty-tree state, environment and dependency versions, input
    parameters and seeds, requested policy and resolved model identifier,
    stdout/stderr, raw machine-readable results, or per-chunk receipts is
    invalid under the artifact policy.
  - >-
    IR11 DESTROYED-ARTIFACT CITATION. A Stage-2 cell may NOT be reported as
    "reproducing" a committed number by citing EV-SIG-008's unregistrable or
    destroyed run receipts. Reproduction means RE-MEASURING under this
    contract's own receipts. Citing a destroyed artifact as a live receipt
    invalidates the claim, not the underlying number.
  - >-
    IR12 MULTIPLICITY MISREPORT. Reporting a Stage-1 PASS without stating that
    it is a pass by one of three pre-declared candidates invalidates the gate
    report.
  - >-
    IR13 GATE MISATTRIBUTION. Reporting 17,947 as a NULL deficit, or as an
    independent second point prediction, invalidates the gate report. It is
    the SEM's deficit against a null baseline whose own deficit is zero, and
    it is arithmetically implied by G2 plus two prior committed anchors.

  success_criterion: >-
    DECIDABLE, WITH A REACHABLE NEGATIVE. Exactly one of two branches is
    emitted; there is no third, and neither is a failure.

    BRANCH POSITIVE (Stage-1 PASS): at least one single candidate among
    C1/C2/C3, with NO parameter fitted to any committed number, simultaneously
    satisfies G1 (|pred_deficit - 7,110|/7,110 < 0.05 at CELL-A), G2
    (pred_rank = 156,520 EXACTLY at CELL-B), G3 (pred_rank = 31,179 EXACTLY at
    CELL-C) and G5 (pred_deficit = 0 EXACTLY at CELL-D); AND all three
    candidates' predictions at all four gate cells and all five reported cells
    are published, including failures; AND the pass is reported as "1 of 3
    pre-declared candidates"; AND CTRL-6 and CTRL-7 pass. This branch
    AUTHORIZES NOTHING BY ITSELF: it makes Stage 2 eligible for a separate
    Coordinator ledger authorization, and is not evidence for Phi until the
    ladder confirms it.

    BRANCH NEGATIVE (Stage-1 FAIL, F1): no candidate satisfies all four gate
    conditions. THIS IS A PLANNED OUTCOME AND ITS DELIVERABLE IS MANDATORY. The
    batch emits a NAMED NO-GO containing, at minimum: (a) each candidate's
    predicted rank and deficit at all nine cells with residuals and signs;
    (b) the exact boundary of what is refuted - the untruncated boolean/Koszul
    series with field equations carried, plus the up-closure law, under the
    three canonical collapse conventions, over n in {9, 12} and D in {5, 6},
    both arms; (c) a statement of which (n, D) ranges make d_reg-derived cost
    predictions UNUSABLE, with that boundary explicit, in a form
    IDEA-20260803-fa9839 can consume as a NOT-THRESHOLD-CONVERTIBLE finding;
    (d) FORWARD GUIDANCE naming what remains open - specifically the residual
    mechanism of the 7,110 arm-R defect, which is NOT closed by this refutation
    - because a count of screened-and-rejected candidates is a fatigue report,
    not a closure (docs/inventor-protocol.md, closure standard); and (e) the
    explicit statement that this refutes a MODEL FAMILY and asserts nothing
    about ECDLP hardness in either direction.

    CONFOUND DISPOSITION, FIXED HERE BEFORE THE GATE RUNS AND NOT SELECTABLE
    AFTERWARDS: if Phi cannot account for the DIFFERENCE between CELL-A and
    CELL-B, the FIRST reading is that the two cells are not comparable - they
    come from different experiments, different constructions (arm R vs arm P),
    different seeds (2 vs 2026), different support histograms (u_6 = 16,018 vs
    16,016), different admission metrics, and radically different artifact
    provenance (CELL-A's receipts are unregistrable per EV-SIG-008's own
    artifact_absence_statement; CELL-B carries a schema-complete results.json).
    THAT THE TWO NUMBERS ARE NOT COMPARABLE IS A LEGITIMATE FINDING AND IS NOT
    THE SAME AS Phi FAILING, and the report must state which of the two it is
    claiming.

  falsification_criterion: >-
    F1 (primary, zero compute): no frozen candidate satisfies G1 and G2 and G3
    and G5 simultaneously - the candidate family is wrong over the declared
    boundary and the ladder is not authorized. F2: a passing candidate's
    Stage-2 ladder error exceeds median 5 per cent or maximum 15 per cent -
    fitted description, not mechanism. F3: the saturation-shape categorical
    prediction is wrong at any measured cell. F4: G3 does not reproduce 31,179
    - Phi contradicts a committed machine-confirmed diagnosis and the
    contradiction is routed to a correction record. F5: HEUR-BF-1 fails (seed
    spread >= model error at a core cell) - the deficit is not a deterministic
    function of the structural data and the correct object is a distribution.
    F6 is NOT a falsification of Phi (see the confound disposition above). F7:
    a negative outcome that does not emit the full BRANCH NEGATIVE deliverable
    HAS NOT FINISHED.

