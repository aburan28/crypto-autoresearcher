experiment:
  id: EXP-PFGB-d630f6
  hypothesis_id: H-PFGB-f9ae08
  question_id: RQ-SDEG-001
  goal_id: GOAL-SDEG-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  claim_tier: toy
  title: >-
    Prime-field Semaev first-fall and true solving-degree growth census with
    support-matched nulls
  objective: >-
    Replace the existing max-degree proxy with a commissioned, exact graded
    rank instrument and measure d_ff and true d_reg for target-sectioned prime-
    field Semaev decomposition systems. The lower field-size rungs reproduce
    existing proxy cells only as a calibration boundary; the actual outcome is
    the support-matched null comparison on m in {2,3,4}, with held-out top rungs
    scored under a pre-registered model family. A backend failure is an honest
    infrastructure result and cannot be interpreted as mathematical evidence.
  what_this_is_not:
    - Not a crypto-scale experiment or an asymptotic scaling law.
    - Not a reuse of the max-degree proxy as d_ff or d_reg.
    - Not a binary-field transfer, a wall-time comparison to rho, or an ECDLP attack.
    - Not authorization to run before independent protocol review and backend commissioning.
  backend_gate:
    required: true
    acceptance: >-
      Exact dense reference ranks agree with the fast F4/F5 or GBLA path on all
      pinned small fixtures; manifests contain non-null backend, library, and
      Sage/GBLA environment fingerprints; a tamper fixture is rejected.
    failure_status: failed_infrastructure
  inputs:
    field_bits: [8, 10, 12, 14, 16, 18, 20]
    training_rungs: [8, 10, 12, 14, 16]
    held_out_rungs: [18, 20]
    decomposition_arities: [2, 3, 4]
    factor_base_sizes: [4, 6, 8, 12, 16]
    curves_per_cell: 3
    seeds_per_cell: 4
    curve_selection: deterministic ordinary short-Weierstrass curves with recorded subgroup and target
    factor_base_selection: deterministic and uniform-random arms, matched by cardinality and recorded by digest
    null_definition: support-matched random coefficients over the same F_p monomial support
    planted_control: known-solution cells with independently checked decomposition certificates
  controls:
    - id: CTRL-PFGB-PROXY-CALIBRATION
      method: Reproduce EXP-SEMAEV-001 overlap cells and report its max-degree value under the explicit label proxy_only.
      pass_condition: Bit-for-bit agreement on the proxy artifact; disagreement is a code/provenance issue, not d_reg evidence.
    - id: CTRL-PFGB-DENSE-REFERENCE
      method: Compare exact graded ranks at every dense-reference cell with the commissioned fast backend.
      pass_condition: Integer equality of ranks, Hilbert coefficients, d_ff, and d_reg where both are defined.
    - id: CTRL-PFGB-NULL
      method: Build a support-matched semi-regular coefficient null independently for every measured cell.
      pass_condition: Null calibration residual is zero on dense fixtures and within the declared integer tolerance on the fast path.
    - id: CTRL-PFGB-TRIVIAL-IDEAL
      method: Include cells with no decomposition and distinguish a trivial ideal from a cheap successful solve.
      pass_condition: The manifest records the explicit trivial-ideal status and no false certificate is emitted.
    - id: CTRL-PFGB-PLANTED
      method: Plant a known decomposition and verify it independently after solving.
      pass_condition: Every reported solution carries an independently verified certificate.
    - id: CTRL-PFGB-BINARY-NEARBY
      method: Run a small binary Weil-descent control with membership degree 2, kept separate from prime-field conclusions.
      pass_condition: The instrument distinguishes this nearby object from the prime-field degree-B membership arm.
    - id: CTRL-PFGB-RHO-CONTEXT
      method: Record matched Pollard-rho group-operation context on identical toy instances.
      pass_condition: Rho operations remain a separate column; no field-operation conversion is performed here.
  independent_variables:
    - field_bits
    - decomposition_arity
    - factor_base_size
    - curve_instance
    - coefficient_arm
  metrics:
    primary:
      - first_fall_degree
      - true_solving_degree
      - null_calibration_residual
      - sem_minus_null_degree_gap
    secondary:
      - Macaulay_column_count_at_dreg
      - graded_rank_profile
      - matrix_peak_memory_gb
      - backend_wall_clock_seconds
      - verified_decomposition_rate
      - matched_rho_group_operations
      - held_out_model_error
  preregistered_model_family:
    models:
      - constant_d_ff_by_m
      - affine_d_reg_in_field_bits
      - logarithmic_d_reg_in_field_bits
      - support_matched_null_difference
    selection_rule: >-
      Fit only training_rungs; select by held-out error and report every model,
      not the winner alone.
  replication:
    seeds: [1, 2, 3, 4]
    independent_instances: 3
    seed_policy: >-
      Seed = SHA-256 digest of EXP-PFGB-d630f6/v1, arm, field_bits, m, curve,
      factor_base_size, and replicate, reduced to 64 bits. No ambient randomness.
  budget:
    wall_clock_seconds_per_run: 3600
    total_wall_clock_seconds: 259200
    maximum_memory_gb: 32
    maximum_runs: 120
  stopping_rules:
    - Do not enter the measurement ladder until the backend gate passes and a snapshot archive exists.
    - Stop the affected cell on dense/fast disagreement, missing environment fingerprint, or certificate failure; classify it as invalid_measurement.
    - Stop each run at 3600 seconds and record censored cells without extrapolation.
    - If a replicated sem-versus-null degree drop survives all controls, stop interpretation and request independent review-breakthrough before any further run.
    - Stop after the declared grid and held-out analysis; no post-hoc field sizes, arities, or model classes.
  invalidation_rules:
    - Any use of the max-degree proxy as d_ff or d_reg invalidates the affected conclusion.
    - A timeout, OOM, solver crash, or missing artifact is infrastructure failure, not evidence against the hypothesis.
    - Dirty code, missing command/environment/stdout/stderr/raw result, or unverified decomposition certificates invalidates the run.
    - Binary-field or extension-field observations cannot be substituted for missing prime-field cells.
  success_criterion: >-
    A completed experiment has backend and controls passing, complete manifests
    for every uncensored cell, exact d_ff/d_reg values, null distributions, and a
    held-out model table. The scientific branch is then reported as null-tracking,
    non-generic-collapse, or inconclusive, with no automatic status transition.
  falsification_criterion: >-
    A valid replicated prime-field cell with d_reg below the support-matched null
    and non-overlapping uncertainty, or a held-out d_ff growth signal excluding
    the registered constant model, falsifies the no-collapse prediction in that
    tested scope. Backend or resource failure falsifies nothing mathematical.
  required_artifacts:
    - experiments/EXP-PFGB-d630f6/specification.yaml
    - experiments/EXP-PFGB-d630f6/implementation/prime_field_degree_census.py
    - experiments/EXP-PFGB-d630f6/implementation/dense_reference.py
    - experiments/EXP-PFGB-d630f6/fixtures/
    - experiments/EXP-PFGB-d630f6/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-PFGB-d630f6/runs/<RUN-ID>/command.txt
    - experiments/EXP-PFGB-d630f6/runs/<RUN-ID>/environment.json
    - experiments/EXP-PFGB-d630f6/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-PFGB-d630f6/runs/<RUN-ID>/stdout.log
    - experiments/EXP-PFGB-d630f6/runs/<RUN-ID>/stderr.log
    - experiments/EXP-PFGB-d630f6/analysis.md
    - experiments/EXP-PFGB-d630f6/execution-report.yaml
  assigned_to: executor
  inference_receipt:
    requested_policy: executor-implementation
    resolved_model_id: null
    fallback_used: false
    authorization_ref: null
