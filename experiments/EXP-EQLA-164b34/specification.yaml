experiment:
  id: EXP-EQLA-164b34
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-0e4d83
  question_id: RQ-EQLA-0d3f40
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'INFORMATIVE RANK, NOT RANK: on a phi-stable factor base the phi-image of a relation row
    is, as a linear functional on the only subspace the unknown log vector can inhabit, exactly lambda
    times the original row - so appending phi-orbit rows adds provably ZERO usable rank, and the correct
    progress meter for the linear-algebra stage is rank(M restricted to V_lambda), a quantity computable
    from lambda and the orbit permutation alone with no discrete logarithm'
  status: draft
  objective: "(A) THE SETTING. E/F_p with j = 0 (a = 0), p = 1 mod 3, zeta a primitive cube root of\
    \ unity in F_p, phi(x, y) = (zeta x, y) the order-3 automorphism. G = <P> of prime order N, x_i\
    \ = log_P(P_i) for a factor base F = {P_1, ..., P_B} that is a union of phi-orbits, with sigma\
    \ the index permutation defined by P_{sigma(i)} = phi(P_i).\n(B) THE TWO ELEMENTARY FACTS, both\
    \ exact, neither heuristic.\n  FACT 1 (determinacy, known - IDEA-20260727-001, H-ENDO-001). phi\
    \ acts on\n  G as multiplication by lambda with lambda^2 + lambda + 1 = 0 mod N.\n  Hence x_{sigma(i)}\
    \ = lambda x_i, so the unknown vector x lies in\n    V_lambda := { v in F_N^B : v_{sigma(i)} =\
    \ lambda v_i },\n  a subspace of dimension exactly B/3, NOT in F_N^B.\n  FACT 2 (row redundancy\
    \ - THE NEW CONTENT). Let r in F_N^B be any relation\n  row and let r^sigma be its phi-shift,\
    \ r^sigma_{sigma(i)} := r_i. Then for\n  EVERY v in V_lambda,\n    r^sigma . v = sum_i r_i v_{sigma(i)}\
    \ = sum_i r_i lambda v_i\n                = lambda (r . v).\n  So on V_lambda the shifted row\
    \ is a SCALAR MULTIPLE of the original row.\n  It is a different vector in F_N^B and it generically\
    \ raises rank(M) by 1,\n  but it raises rank(M|_{V_lambda}) by 0. Exactly. Always. For every row,\n\
    \  every curve, every factor base, every arity.\n\n(C) THE CLAIM. rank(M|_{V_lambda}) = rank(M_base|_{V_lambda}),\
    \ where M_base is the sub-matrix of un-shifted (independently harvested) rows. Therefore the entire\
    \ block-circulant / low-displacement-rank signature that H-STR-002 and EXP-STR-002/003/004 have\
    \ been measuring is produced by rows that carry no information about the factor-base logarithms,\
    \ and any progress metric computed on the full B-column matrix - rank(M), phi_alpha, rand_alpha,\
    \ rank deficiency B - rank(M) - is measuring the wrong object. The right object is the (B/3) x\
    \ (B/3) FOLDED matrix\n  tilde-r_s = sum_{t=0}^{2} lambda^t r_{sigma^t(i_s)},   s = 1..B/3,\n\
    which is the coordinate expression of restriction to V_lambda.\n(D) WHY THIS IS CHEAPER THAN THE\
    \ EXISTING CONTROL. IDEA-20260727-001 proposed to settle determinacy by BRUTE-FORCE COMPUTING\
    \ ALL B FACTOR-BASE LOGARITHMS and reporting a residual fraction. That is only possible at toy\
    \ sizes and it tests FACT 1, which is already a theorem. FACT 2 is a rank identity in the row\
    \ space: it needs lambda (a root of L^2 + L + 1 mod N, obtained by one square root mod N) and\
    \ sigma (obtained by one field multiplication per factor-base element). NO DISCRETE LOGARITHM\
    \ IS COMPUTED AT ANY POINT, so the measurement runs at any B the machine can hold and the verdict\
    \ is exact rather than statistical.\n(E) THE THREE OUTCOMES AND WHAT EACH MEANS.\n  OUTCOME 1\
    \ - measured informative-rank gain from appended rows is exactly\n    0 at every cell. FACT 2\
    \ is confirmed operationally, the appended-row\n    signature is certified information-free, and\
    \ EV-STR-003's UC-1\n    (\"the phi_alpha instrument is UNADJUDICATED\") is settled in the only\n\
    \    direction that a theorem permits: not by declaring phi_alpha an\n    artifact, but by exhibiting\
    \ a DIFFERENT metric whose meaning is proved.\n  OUTCOME 2 - measured gain is nonzero at some\
    \ cell. Then either the factor\n    base is not exactly phi-stable (truncation - the committed\
    \ harness's\n    `xs[:B]` cut, EV-STR-003 O-4), or lambda was computed for the wrong\n    root,\
    \ or sigma does not match phi on the chosen lifts (the sign question\n    of IDEA-20260807-add964).\
    \ Each of these is a named, separately testable\n    implementation fault, so OUTCOME 2 is a bug-locator,\
    \ not a discovery.\n  OUTCOME 3 - the folded matrix has informative rank strictly below the\n\
    \    number of base rows. That is the interesting one: it would mean the\n    harvested relations\
    \ are themselves dependent beyond the phi-redundancy,\n    which is a statement about relation\
    \ COLLECTION and hands the lane to\n    IDEA-20260807-d6956c."
  resource_label: 'R1 + R3. R3: End(E) as a ring supplies lambda and the Z[phi]-module structure of
    the unknown vector. R1: the phi-action is realised as ONE multiplication of a field element (x
    -> zeta x), not as a group operation, which is why the orbit is buildable at all.'
  admissibility: admissible
  admissibility_argument: 'Admissible, but narrowly and with the ceiling stated. The lane does not
    merely "apply phi to points of G": the object measured is a rank over F_N of a matrix of field
    data, and the phi-orbit is generated by field multiplication rather than by the group oracle.
    Simulating phi(P) generically costs about log N group operations (multiply by the scalar lambda),
    so evaluating phi as one field multiplication is a genuine non-generic saving - of a log N factor,
    on the orbit-construction step ONLY, which is not where the cost lives. The INFORMATION content
    of the resulting rows is generic-group simulable (KN-FIND-b7e091 Oracle D), and this proposal''s
    whole point is to MEASURE that rather than assume it. A proposal that assumed it would be inadmissible;
    one that tests it with an exact rank identity is the admissibility filter being applied, not evaded.'
  reachability_gate: 'T5''s isogeny-walk form does not apply: this lane fixes one curve and never
    moves between curves, so no walk is costed. T4 binds harder. The order-3 action on x-coordinates
    exists ONLY when the CM fundamental discriminant is -3 (j = 0). By T4 that is fixed by the isogeny
    class - equivalently by t and p - and CANNOT be reached from a curve whose class lacks it by any
    isogeny walk at any cost. So the cost of reaching a good object from a generic prime-field curve
    is not high, it is infinite, and the lane is scoped to the D_0 = -3 family for all time. Within
    that family the good object is free: the phi-stable factor base costs B multiplications by zeta
    in F_p, versus about B log N group operations to build the same orbits generically. SCOPE NOTE,
    stated because it makes the lane non-vacuous and for no other reason: secp256k1 has a = 0, hence
    j = 0, hence D_0 = -3 and the order-3 endomorphism (this is the publicly documented GLV endomorphism
    used for its fast scalar multiplication). That places a deployed curve inside the lane''s scope.
    It is NOT an attack claim: this proposal''s own predicted outcome is that the structure carries
    zero informative rank.'
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE): archive the derivation of FACT 2 and the folding
      identity. Nothing is measured before this exists as a committed artifact - this is the exact
      gap EV-STR-003 recorded when a derivation lived only inside review reports. STAGE 1 (minutes):
      on one 12-bit j = 0 instance with B = 27 (divisible by 3), reproduce the five committed EXP-STR-003
      arm-A integers. HARD GATE. STAGE 2 (minutes): compute lambda, verify lambda^3 = 1 and lambda
      != 1 and 1 + lambda + lambda^2 = 0 mod N; build sigma; assert sigma^3 = identity and that sigma
      has exactly B/3 orbits of length 3. STAGE 3 (the whole test, minutes at toy scale): harvest
      R base rows WITH right-hand sides; compute the four ranks; report raw_gain and informative_gain.
      STAGE 4: NULL 1, NULL 2 across c in {0, 1/4, 1/2, 3/4, 1}, NULL 3 planted positive. All on the
      identical pipeline. STAGE 5 (zero compute): report the rank-arrival curve and relations_needed_for_full_informative_rank
      against the size-matched generic base. The whole thing is a few hundred lines of numpy plus
      the existing harness/toycurve.py and harness/semaev.py, and runs in minutes. The cheapest possible
      discriminator for the central L5 question.'
    mechanism: "STEP 1 (zero compute, derivation, must be archived before measurement). Write the\
      \ two-line proof of FACT 2 above and the identity tilde-r_s = sum_t lambda^t r_{sigma^t(i_s)},\
      \ together with the statement that the map r -> tilde-r IS the isotypic projection onto the\
      \ lambda-eigenspace of the sigma-action, expressed in orbit-representative coordinates. This\
      \ is the derivation artifact that docs/claims-and-verification.md requires to exist BEFORE a\
      \ decision rests on it (the gap EV-STR-003 recorded as `proof_status_basis`).\nSTEP 2 (cheap).\
      \ On each toy j = 0 instance: compute lambda by solving L^2 + L + 1 = 0 mod N; verify lambda^3\
      \ = 1 and lambda != 1; build a factor base as a union of COMPLETE phi-orbits with no truncation\
      \ (B divisible by 3 by construction, so the B mod 3 != 0 crash path of harness/endomorphism_la.py:451\
      \ is never entered and the instance set is not silently filtered); record sigma explicitly.\n\
      STEP 3 (the measurement). Harvest R base relation rows by the existing decomposition search.\
      \ Build three matrices: M_base (R rows), M_closed (3R rows: each base row plus its two sigma-shifts),\
      \ and the folded matrices tilde-M_base and tilde-M_closed over F_N^{B/3}. Report the four ranks\
      \ and the two DIFFERENCES that carry the claim:\n  raw_gain      := rank(M_closed) - rank(M_base)\
      \          [predicted ~2R]\n  informative_gain := rank(tilde-M_closed) - rank(tilde-M_base)\
      \  [predicted 0]\n\nSTEP 4 (the meaning). Report `relations_needed_for_full_informative_rank`:\
      \ the number of BASE rows at which rank(tilde-M) first reaches B/3. That, and not the row count,\
      \ is the quantity index calculus is actually buying with its search budget. Compare it against\
      \ the same quantity for a size-matched generic (non-phi-stable) factor base with B columns and\
      \ B unknowns.\nSTEP 5 (the null, run on the identical pipeline). See null_object_control: the\
      \ load-bearing null is NOT a random matrix - a random matrix must show the SAME collapse, because\
      \ FACT 2 is a statement about the operator, not about elliptic curves. The load-bearing null\
      \ perturbs the FOLDING WEIGHT."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - NULL 1 - matched random sigma-closed matrix; must show the same zero.
  - NULL 2 - wrong folding weight mu with mu^3 != 1, swept over the correct-fold fraction c; the decay
    test.
  - 'NULL 3 - planted positive: sigma-symmetric-support but genuinely independent rows; must show
    informative_gain > 0.'
  - Size-matched generic factor base with B columns on the same curve, same arity, same harvest budget
    - the only comparison that isolates the phi structure from factor-base size.
  - Frozen EXP-STR-003 arm-A fixture at B = 27 for instrument comparability.
  - Matched Pollard rho with negation and matched BSGS on the same instances, in group operations,
    for the Pareto row - reported even though no attack is claimed, because otherwise `dominated_by`
    is unchecked.
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, and its design is unusual enough to
    state carefully. NULL 1 - MATCHED RANDOM MATRIX (shape, density, column-orbit structure). A random
    0/1 matrix with the same dimensions, the same row-weight distribution, the same column-orbit partition,
    closed under sigma. PREDICTED OUTCOME: the SAME informative_gain of exactly 0. This is NOT a falsification.
    FACT 2 quantifies over all rows, so the collapse must appear on the null, and the fact that it
    does is what establishes that the signature is a property of the OPERATOR and carries no elliptic-curve
    content. Reporting the collapse as a curve-specific finding without having run this null is prohibited.
    NULL 2 - THE LOAD-BEARING ONE: THE FOLDING WEIGHT. Refold with weight mu instead of lambda, for
    mu drawn uniformly from F_N^* with mu^3 != 1. PREDICTED OUTCOME: informative_gain jumps to about
    2R, i.e. the redundancy vanishes completely. DECAY PARAMETER: the fraction c in [0, 1] of orbits
    folded with the correct lambda. informative_gain must decay monotonically from about 2R at c =
    0 to exactly 0 at c = 1, and the decay must be approximately linear in the number of correctly
    folded orbits. A statistic that stays flat as c increases is the canonical artifact tell of docs/inventor-protocol.md
    section 3 and voids the measurement. NULL 3 - PLANTED POSITIVE. A synthetic sigma-closed matrix
    whose rows are deliberately NOT sigma-shifts of one another (independent rows that merely happen
    to have sigma-symmetric support). The instrument must report informative_gain > 0 there, or it
    cannot detect genuine new information and every zero it reports is void.'
  independent_variables: []
  metrics:
    primary:
    - rank(M_base), rank(M_closed), rank(tilde-M_base), rank(tilde-M_closed)
    - raw_gain, informative_gain, per instance and per arm
    - lambda, its multiplicative order, and the sigma orbit-length histogram
    - rank-arrival curve of tilde-M against base-row count
    secondary:
    - relations_needed_for_full_informative_rank, phi arm and generic arm
    - NULL 2 decay curve over at least five values of c
    - sha256 of the factor base and of the final row list per cell (closes EV-STR-003 UC-6 at zero
      cost)
    - matched rho and BSGS group-operation counts and BSGS memory
  heuristic_under_test: null
  preregistered_prediction:
    quantity: informative_gain = rank(tilde-M_closed) - rank(tilde-M_base)
    formula: EXACTLY 0 at every cell, on every instance, at every B, for both the curve arm and NULL
      1. Not "small" - zero. A single nonzero cell with a passing lambda-order check and a verified
      complete-orbit factor base falsifies FACT 2 as implemented and triggers the bug-locator branch.
    source: pre-registered in IDEA-20260807-0e4d83 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - 'TRUNCATION. `_build_phi_invariant_factor_base` ends with `xs[:B]`, which can cut an orbit in
    half; EV-STR-003 O-4 traced the entire arm-E divergence to phase effects of exactly this kind,
    and EV-STR-004''s IL0 truncation reading is still live. Mitigation: B is forced divisible by 3
    and complete-orbit membership is ASSERTED, not assumed.'
  - LIFT/SIGN CONSISTENCY. For j = 0, phi preserves y, so the sign is trivially +1. This is a fact
    about j = 0 only and must not be carried to j = 1728, where the sign is forced to be -1 around
    each orbit (IDEA-20260807-add964).
  - lambda AMBIGUITY. L^2 + L + 1 = 0 mod N has two roots, lambda and lambda^2 = lambda^{-1}. Folding
    with the wrong one gives the OTHER eigenspace and produces a spurious nonzero informative_gain.
    The check "phi(P_1) equals P_{sigma(1)} and lambda x_1 = x_{sigma(1)} for one known pair" pins
    the root; at toy scale one brute-force logarithm suffices and only one is needed, ever.
  - NO RIGHT-HAND SIDE. The committed harness never records the target's scalar (EV-STR-003 O-9).
    Without it, "rank" is the rank of an incidence matrix and not of a linear system. The driver must
    record it.
  - SMALL B. At B = 27 the folded matrix is 9 x 9 and rank statements have almost no resolution. At
    least three B values spanning an order of magnitude are required before any trend is reported.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACTLY 0 at every cell, on every instance, at every B, for both the curve arm
    and NULL 1. Not "small" - zero. A single nonzero cell with a passing lambda-order check and a
    verified complete-orbit factor base falsifies FACT 2 as implemented and triggers the bug-locator
    branch.
  falsification_criterion:
  - informative_gain != 0 at any cell where lambda's order is verified 3, the factor base is verified
    to be a union of complete orbits, and sigma^3 is verified to be the identity. FACT 2 is false
    as implemented; the record is superseded rather than amended, and the three named bug-locator
    causes are checked in order.
  - raw_gain is near 0 as well. The appended rows are duplicates, not shifts; the collection rule
    is the object being measured and nothing about phi is established in either direction.
  - NULL 3 (planted positive) reports informative_gain = 0. The instrument cannot detect new information;
    every zero it produced is void and the run set is INVALID, not negative.
  - NULL 2 shows no decay in c. Canonical artifact tell; the measurement is void.
  - The B = 27 fixture does not reproduce the committed integers. Instrument incomparability; halt,
    and report as an infrastructure outcome under AGENTS.md rule 5, never as mathematical evidence.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
