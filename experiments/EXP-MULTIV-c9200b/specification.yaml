experiment:
  id: EXP-MULTIV-c9200b
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-347b82; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-347b82
  question_id: RQ-UOV-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Construct and certify one tiny instance of every composable pair of the four UOV-family structure
    transforms, and record a sixteen-cell status table with each composite's flattened parameter triple
    and coefficient algebra.
  objective: 'The uncertainty reduced is whether the four schemes'' defining transforms compose, and
    what the composites are. Stated as parts: (i) the run fixes each transform as an explicit map
    on a five-slot tuple and computes all sixteen ordered composites symbolically, which costs nothing
    and produces a predicted status per cell before any code runs, so the computational stage is a
    test rather than an exploration; (ii) for each cell predicted defined, the run constructs one
    instance at the smallest nontrivial parameters, plants an oil module, and verifies by exhaustive
    evaluation that the composite public map annihilates it, which converts ''defined'' from an assertion
    into a certificate the wrapper re-verifies; (iii) it runs a plain-UOV null at each composite''s
    flattened parameter triple through the identical certificate checker, so that a passing certificate
    is known not to be an artifact of a checker that passes everything, and so that a composite indistinguishable
    from the null is correctly reported as degenerate rather than as new. The run recovers no keys,
    forges nothing, computes no attack cost, and ranks no cell. Its output is the table, sixteen statuses,
    and a list of defined cells that no record in this repository has ever examined.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supported scope is: under the recalled definitions
      of the four transforms and the five-slot abstraction, each of the sixteen ordered composites
      has the recorded status, and each defined cell admits at least one constructed instance at the
      named tiny parameters whose planted oil module is annihilated by the composite public map, certificate
      re-verified. What does NOT follow: nothing about the security of any composite or of any of
      the four schemes; no claim that a defined composite is a good scheme, an efficient one, or one
      anybody should build; no claim that an undefined cell is undefined under any other abstraction;
      and no transfer of any parameter-triple arithmetic to deployed parameter sets.'
  inputs:
    procedure: 'STAGE 0, definitions frozen (cost: human, half a day): write each transform''s slot
      map into the run log, each flagged UNVERIFIED with its source of recall. STAGE 1, symbolic table
      (cost: zero compute): compose all sixteen ordered pairs on the tuple and record a predicted
      status and predicted flattened triple per cell. STAGE 2, construction code (cost: medium): one
      core UOV generator plus four independent transform implementations, composable in either order,
      sharing only exact F_q tables. STAGE 3, degenerate-parameter controls (cost: seconds): k=1,
      deg f=1, ell=1, identity expander; each must collapse its cells exactly, and any failure aborts
      the run. STAGE 4, per-cell construction and certification (cost: minutes): build one instance
      per predicted-defined cell and verify annihilation exhaustively over the oil module. STAGE 5,
      null and negative controls (cost: minutes): plain-UOV null at each flattened triple, plus a
      deliberately non-isotropic planted module that must fail certification. STAGE 6, order-swap
      comparison and reporting (cost: human): compare the two orders per unordered pair under the
      pre-fixed rule and publish the table with statuses, reasons, and the unpopulated-cell count.'
    instrument: Python 3 with exact F_q arithmetic via precomputed tables for q in {2, 3, 4, 8}; polynomial
      arithmetic modulo f implemented directly for the quotient-ring transform; ell by ell matrix
      algebra implemented directly for the SNOVA-style transform; no computer algebra system and no
      Sage. Certificate verification is a separate module that receives only the public map and the
      claimed oil module, so it cannot see how either was constructed. Driven by harness/runner.py
      for manifest, seeds and the inference block.
    parameters: 'Base core: q in {4, 8}, n in {4, 5}, m = 2, o = 1. Whipping k in {1, 2}. Quotient
      polynomial f of degree in {1, 2, 3}, both irreducible and reducible, over F_q. SNOVA-style algebra
      dimension ell in {1, 2}. Seed expander: identity and one hash-based expander. Flattened variable
      count bounded by 16 over F_q so that exhaustive verification over the oil module is at most
      q^{flattened o-dimension} <= 8^4 = 4096 evaluations per cell. One instance per cell for existence,
      plus 20 random instances per defined cell for the certificate rate.'
  controls:
  - Plain-UOV null at each composite's flattened parameter triple, constructed by the same code in
    the same invocation, with the certificate checker run against it to prove the checker is not structure-sensitive.
  - 'Identity-transform control: compose each transform with the identity in both orders and confirm
    the tuple is unchanged, catching slot-map bugs before any real cell is read.'
  - 'Degenerate-parameter control: whipping with k = 1, quotient with deg f = 1, SNOVA with ell =
    1, seed with the identity expander; all four must collapse their cells to the other factor exactly.'
  - 'Order-swap control: for each unordered pair, compare the two ordered cells and report whether
    the composites are equal, isomorphic, or distinct, with the comparison rule stated in advance.'
  - 'Certificate-negative control: plant a module that is deliberately NOT isotropic and confirm the
    certificate fails, so that verification success is informative.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object for each defined cell is a UOV-shaped object with the
    composite''s FLATTENED parameter triple over F_q but with no algebra structure at all - a plain
    random UOV with a planted oil space of the same F_q-dimension - constructed in the same invocation
    by the same code path. The null must show that the annihilation certificate verifies there too,
    which proves the certificate checker is not itself detecting structure; and it must show that
    the composite''s public map is NOT reproducible by the null construction, which is what makes
    the composite a distinct object rather than a relabelled plain UOV. If the null and the composite
    are indistinguishable as objects, the cell is reported as degenerate, which is a legitimate and
    informative outcome.'
  independent_variables:
  - first transform applied
  - second transform applied
  - quotient polynomial factorization type
  - algebra dimension ell
  - whipping factor k
  metrics:
    primary:
    - cell status in {defined, degenerate, undefined, open-with-reason}
    - flattened F_q parameter triple per cell
    - annihilation certificate pass rate per defined cell
    - agreement of measured triple with the predicted product of multipliers
    secondary:
    - named coefficient algebra per defined cell
    - order-swap equality/isomorphism/distinctness verdict per unordered pair
    - count of defined cells with no corresponding in-repo record
    - construction failure reasons, verbatim
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The status of each of the sixteen ordered composition cells, and the flattened F_q parameter
      triple of each defined composite.
    formula: 'Predicted flattened triple for a composite of transforms with multipliers (a_n, a_m,
      a_o) and (b_n, b_m, b_o) acting on a base (n, m, o): exactly (a_n b_n n, a_m b_m m, a_o b_o
      o), where Whip_k contributes (k, 1, k), QR_f contributes (deg f, deg f, deg f) on flattening,
      SNOVA_ell contributes (ell, ell, ell) on flattening, and Seed contributes (1, 1, 1). Predicted
      statuses: 14 defined, and the two cells composing QR_f with SNOVA_ell in either order predicted
      degenerate or undefined.'
    source: Pre-registered in the parent proposal IDEA-20260816-347b82 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Every constructed instance has at most 16 flattened variables over F_q with q <=
      8, chosen so that annihilation is verified exhaustively rather than by sampling. The claims
      being tested are existence and shape, which are not cost claims, so small parameters are adequate
      to the question rather than a compromise. The only extrapolation is the parameter-triple arithmetic,
      which is exact arithmetic on multipliers and is stated as such; no transfer to deployed parameter
      sets is claimed anywhere.
    correspondence: null
  tail_checks:
  - deg f = 1 and ell = 1 simultaneously, the fully degenerate corner where every composite must equal
    the core
  - a reducible quotient polynomial, where H-QRUOV-e8ae3e's CRT split makes the algebra non-local
    and the composite algebra may behave differently
  - the cell composing two structure-adding transforms whose flattened oil dimension is smallest,
    where a nonzero oil module may fail to exist at all
  - q = 2, where isotropy in characteristic 2 is most degenerate
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - abort if any degenerate-parameter control fails to collapse
  - cap construction attempts per cell at 20 random instances; exhausting them yields open-with-reason,
    never undefined
  - stop when every cell has a status and every defined cell has at least one verified certificate
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All sixteen cells carry a status derived from an executed construction attempt
    or a symbolic incompatibility argument, every defined cell has at least one instance whose planted
    oil module is annihilated with the certificate independently re-verified, and the plain-UOV null
    passes the checker while the non-isotropic negative control fails it.
  falsification_criterion:
  - A cell predicted undefined is constructed and certified.
  - A cell predicted defined yields no certified instance in 20 attempts.
  - A measured flattened triple disagrees with the predicted multiplier product.
  - The non-isotropic negative control passes certification, voiding every certificate in the run.
  - A degenerate-parameter control fails to collapse to its other factor.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-347b82
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The seed-compression transform's slot map is the least well specified of the four and a Coordinator
    must fix whether it acts on the key representation only or also constrains the map.
  - Whether 'degenerate' and 'undefined' are distinguished by a symbolic argument or only by failed
    construction must be decided before approval, because the difference is exactly the inventor-protocol
    section 4 boundary between a closure and a fatigue report.
  - The order-swap comparison rule (equality, isomorphism up to change of basis, or distinctness)
    is named but not defined precisely enough to implement; it must be frozen before Stage 6.
  - All four transform definitions are recalled and UNVERIFIED, and all four anchor questions carry
    a constraint that no experiment be designed until primary sources are filed; approval must address
    that constraint explicitly.
