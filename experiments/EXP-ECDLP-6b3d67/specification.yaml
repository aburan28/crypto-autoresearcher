  execution_authorized_stages: [0]
  execution_authorized_decision: DEC-20260908-c439ad
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260908-472825
  source_proposal: IDEA-20260825-49129b
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-c439ad under the standing 2026-09-06
    user authorization. Stage 0 is the exact F_9
    parent-from-children calibrator.

  objective: >
    Evaluate the exact identity that on
    F_3[α]/(α^2+1) one has F(a+bα)=a+2bα,
    children s0=1+α, s1=1+2α, parent
    2+2α, and rejects identity Frobenius
    whose parent is 2, on one frozen
    family (REAL, KF, NULL). Stage 0
    does not form Semaev S_m and does
    not authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL F_9 has
      F(s1)=1+α and parent 2+2α; KF
      identity-Frobenius parent 2
      rejected; NULL empty pair
      rejected; p=0 rejected.
      Certificate kind none.
    formula: >
      Ring F_3[α]/(α^2+1), α^2=2.
      Field Frobenius F(x)=x^3.
      F(a+bα)=a+2bα because α^3=2α.
      Parent S = s0 + F(s1).
      REAL: s0=1+α, s1=1+2α,
      F(s1)=1+α, S=2+2α.
      KF: F_id(s1)=s1, S=2, rejected
      as a generic identity-F target.
    claim_tier: observational

  inputs:
    fixture:
      real_ring:
        p: 3
        modulus: [1, 0, 1]
        alpha_squared: 2
        s0: [1, 1]
        s1: [1, 2]
        must_F_s1: [1, 1]
        must_parent: [2, 2]
      known_false:
        kind: identity_frobenius
        must_parent: [2, 0]
        must_reject: true
      matched_null:
        kind: empty_pair
        must_reject: true
      invalid:
        - {p: 0, must_reject: true}

  controls:
    - name: known_false_identity_frobenius
      object: KF identity map (a,b)->(a,b)
    - name: matched_null
      object: empty child pair
    - name: invalid_p
      object: p=0

  independent_variables:
    - p
    - s0
    - s1
  primary_metrics:
    - fixture_pass
    - real_semilinear_pass
    - known_false_id_pass
    - reject_invalid_pass
    - null_empty_pass
  secondary_metrics: []
  seeds: [8]
  replication_plan: >
    One Stage 0 run. Deterministic
    exact ring tables. No sampling.
  budget:
    wall_clock_seconds: 120
    memory_gb: 2
    maximum_runs: 1
  stopping_rules:
    - Stop after the five gates are recorded.
    - A timeout is failed_infrastructure, not a mathematical miss.
  invalidation_rules:
    - Missing artifact paths invalidate the run.
    - Overwriting an existing run record invalidates the procedure.
  success_criteria:
    - All five gates true and certificate kind none.
  falsification_criteria:
    - After fixture_pass, any REAL table miss or KF accept.
  required_artifacts:
    - raw-result.json
    - execution-report-s0.yaml
    - implementation/stage0_frobsem.py
  dependencies:
    - H-ECDLP-9e65d4
    - DEC-20260908-c439ad
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
  scientific_boundary: >
    Stage 0 P-S0-FROBSEM only. Not
    Semaev. Not a P1553 recurrence.
    Not a factor-base. Not Velu. Not
    a rho beat. No Stage 1 of
    EXP-ECDLP-6b3d67. No Stage 1 of
    EXP-ECDLP-71c37d.
