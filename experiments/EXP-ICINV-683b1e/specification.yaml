experiment:
  id: EXP-ICINV-683b1e
  hypothesis_id: H-ICINV-b96cc7
  derived_from_idea: IDEA-20260807-0ff796
  question_id: RQ-ICINV-475b5e
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Exact-integer test that the length-2 Semaev relation locus has p - 1 - t affine points, run across
    complete toy isogeny classes at transported targets, with a gauge-orbit matched null, a 2-torsion
    nearby-object control that must disagree, a random-form control that must disagree, and a
    four-point factor-base sweep that fits the sampling decay rather than asserting it
  objective: >-
    The one uncertainty a run reduces - whether arity-2 relation yield carries any isogeny-class
    information at all, or whether its mean is an exact function of the class and every observed
    within-class spread belongs to one of three named residual channels. A run establishes (i) whether
    the symbolic identities the argument rests on (bidegree, weight-8 homogeneity, the classical
    discriminant identity) hold, which is a zero-compute hard gate; (ii) whether the exact affine point
    count of the relation locus equals p - 1 - t on every member of complete toy isogeny classes at a
    TRANSPORTED target, which is an exact integer test with no tolerance; (iii) whether the two nearby
    objects - a 2-torsion target and a random (2,2) form of matched support - give DIFFERENT counts, which
    is what shows the counter reads the geometry rather than the shape; and (iv) whether the within-class
    relative spread of the SAMPLED yield is bounded by the gauge-orbit spread and decays as B^{-1} p^{1/2}
    across four factor-base sizes. No attack is mounted, no relation-collection speedup is produced, and
    no exponent moves.
  what_this_is_not:
  - >-
    Not an attack, a relation-collection speedup, or a cryptanalytic result of any kind. The run's own cost
    is strictly worse than the square-root baseline and is affordable only because it is a measurement.
  - >-
    Not a claim about arity 3 or above, where the locus is higher-dimensional and the genus argument gives
    out and the argument must be redone or must fail.
  - >-
    Not a claim about the VARIANCE or higher moments of the relation count, only about its mean.
  - >-
    Not a claim about structured factor bases, where the box-localisation channel dominates and is carried
    as OPEN.
  - >-
    Not a claim about preimage augmentation across an isogeny, which is a different question owned by a
    weakened hypothesis in this lane; the two touch at exactly one point and the direction is consistent.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has been
    executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the executed toy primes, on completely enumerated F_p-isogeny classes,
      at transported non-2-torsion targets and for short-Weierstrass models, the exact affine point count of
      the arity-2 relation locus equals p - 1 - t on every member, the two nearby objects give different
      counts, and the within-class relative spread of the sampled yield stands in the measured ratio to the
      gauge-orbit spread with the measured decay in B. WHAT DOES NOT FOLLOW - nothing about arity 3 or above;
      nothing about the variance or tails of the count; nothing about structured factor bases beyond what the
      interval arm measures at these primes; nothing about solving degree or any other functional; and
      nothing whatever about the ECDLP.
  inputs:
    procedure: >-
      STAGE 0 (zero compute). External literature check for the (2,2)/genus-1 model of the relation locus;
      record whatever is found in the knowledge corpus WHETHER OR NOT it supports the record. A positive hit
      is an INGREDIENT, not a disappointment.
      STAGE 1 (minutes, HARD GATE). Symbolic verification - confirm the bidegree in the first two coordinates
      is (2,2) and that the coefficient of the squared first coordinate is the expected square; confirm the
      weight-8 homogeneity as a polynomial identity in the scaling parameter and the curve coefficients;
      RE-DERIVE (do not quote) the classical identity expressing the discriminant in the third coordinate as
      a constant times the product of the curve polynomial evaluated at the first two. Any failure kills the
      record.
      STAGE 2 (minutes, HARD GATE). The exact-integer regression fixture - assert the counted locus equals
      p - 1 - t on at least 20 curves spanning at least three distinct traces at two toy primes, plus the
      2-torsion nearby-object control which MUST DISAGREE and the random-(2,2)-form control which MUST also
      disagree.
      STAGE 3 (about an hour). Full class enumeration at the declared toy primes by a vectorised
      quadratic-character table sweep; bucket by trace; select the three largest ordinary classes under the
      PRE-REGISTERED rule; exclude or stratify trace-zero classes.
      STAGE 4 (hours). The four-arm yield measurement across every member of those classes - (a) a COMMON
      uniformly random factor base, identical across class members, which isolates the class effect from the
      factor-base choice; (b) an interval factor base, which introduces the box channel; (c) the gauge orbit
      of one fixed member, which is the matched null; (d) the random-(2,2)-form null - sweeping the factor-base
      size over at least four values so the sampling decay is FITTED rather than asserted.
      STAGE 5 (zero compute). Fit the decay exponent, compare class spread with gauge spread at matched size,
      and record the closure or its failure.
    instrument: >-
      Symbolic algebra for Stage 1 only. Exact integer and finite-field arithmetic elsewhere - a single
      length-p quadratic-character table built once per prime, class enumeration by one vectorised table sweep
      per j-invariant with the quadratic twist handled explicitly, and locus counting by evaluating the
      summation polynomial as a quadratic in the second coordinate for each first coordinate and testing the
      discriminant's quadratic character. Transport by explicit small-degree isogenies on rational kernels
      found from division polynomials, with the transported pair RE-VERIFIED by direct scalar multiplication.
      Factor bases frozen by seed. Recorded through harness/runner.py.
    parameters: >-
      Toy primes small enough for complete class enumeration, pre-registered before any measurement, with at
      least three primes so a p-trend can be reported rather than a single value. At least 20 curves spanning
      at least three traces in the Stage-2 fixture. The three largest ordinary classes per prime, selected by
      a pre-registered rule, with the selection confound recorded - selecting the largest classes selects on
      class number, which correlates with the arithmetic of the discriminant and hence with 2-torsion
      structure, which is not selection on the outcome but is not neutral either. Factor-base sizes at four or
      more values. Gauge orbit sampled over many Weierstrass equations of one fixed member. Targets
      transported, non-2-torsion, non-identity. Trace-zero classes excluded or stratified. THERE IS NO
      STANDARDIZED PARAMETER SET IN SCOPE and none is implied.
  controls:
  - >-
    THE MATCHED NULL IS THE GAUGE ORBIT, MANDATORY AND BLOCKING. The same curve - same j, same trace, same
    order, same endomorphism ring - written with many different Weierstrass equations. It has EXACTLY the
    shape of the real arm (a set of curve equations with a coordinate-defined factor base) and differs from it
    in exactly one thing: it holds the isogeny-class member fixed. The class arm's relative spread must not
    exceed the gauge arm's by more than a factor of 1.5.
  - >-
    DECAY PARAMETER, THE FACTOR-BASE SIZE B. The sampling channel must decay as B^{-1} p^{1/2} relative to the
    mean, fitted across at least four values of B. A within-class spread that does NOT decay when B grows is
    the canonical artifact tell and voids the closure regardless of the ratio.
  - >-
    SECOND NULL, FOR THE EXACT-COUNT ARM ONLY, AND ITS STATUS IS DECLARED HONESTLY. The exact-count arm has NO
    sampling noise, so its forced value under the derivation is the integer p - 1 - t with spread exactly zero.
    That makes it a control THAT CANNOT FAIL for anything except an outright error in the structural identity.
    It is run for exactly that purpose and is reported as such, NEVER as evidence of invariance of the yield
    functional.
  - >-
    THIRD NULL, THE RANDOM (2,2) FORM. A random (2,2) form with the same support but coefficients drawn
    uniformly, whose point count is NOT p - 1 - t. The pipeline must distinguish it from the summation
    polynomial, or the counter is reading the shape and not the curve.
  - >-
    NEARBY-OBJECT CONTROL, THE 2-TORSION TARGET. There the map is 2-to-1, the locus degenerates, and the count
    is NOT p - 1 - t. Running the pipeline on a 2-torsion target MUST produce a different number; if it
    produces p - 1 - t anyway, the whole measurement is an artifact.
  - >-
    COMMON FACTOR BASE ACROSS CLASS MEMBERS. A per-curve factor base seeded by the instance would make the
    factor base a function of the curve and confound factor-base variance with class variance. The common-base
    arm removes this and is NOT optional.
  - >-
    TRANSPORT CERTIFICATE. The target must be the transported target, not an independently chosen point, or the
    comparison is between different problems. The transported pair is re-verified by direct scalar
    multiplication on every transport; a failed re-verification is an INFRASTRUCTURE failure under AGENTS.md
    rule 5, never evidence.
  - >-
    INDEPENDENT POINT COUNT. The curve's own point count is recomputed by naive counting and compared against
    the trace used, so a wrong trace cannot silently satisfy the identity.
  independent_variables:
  - class member (every curve in each selected complete isogeny class)
  - 'factor-base type: common uniform random / interval / gauge orbit / random (2,2) form'
  - factor-base size B (at least four values)
  - 'target: transported non-2-torsion (signal) / 2-torsion (nearby object)'
  - prime p (at least three toy primes, so a p-trend is reportable)
  - Weierstrass model within the gauge orbit
  metrics:
    primary:
    - >-
      exact_locus_count - an integer per class member per prime, the affine F_p-point count of the relation
      locus at the transported target, compared against p - 1 - t by EXACT INTEGER EQUALITY with no tolerance.
      Within-class variance is required to be exactly zero.
    - >-
      spread_ratio - dimensionless. The within-class relative standard deviation of the sampled relation count
      at a common random factor base of size B, divided by the within-gauge relative standard deviation at the
      same B. Required below 1.5.
    - >-
      decay_exponent - dimensionless. The fitted exponent of the relative within-class spread against B, over at
      least four values of B, required to be consistent with -1 (i.e. relative spread proportional to
      B^{-1} p^{1/2}).
    - >-
      nearby_object_disagreement - a boolean pair. Whether the 2-torsion target's count differs from p - 1 - t,
      and whether the random (2,2) form's count differs from p - 1 - t. BOTH must be true; either being false
      voids the run.
    - >-
      symbolic_gate - PASS or FAIL for each of the three Stage-1 identities (bidegree, weight-8 homogeneity,
      the re-derived discriminant identity).
    secondary:
    - >-
      the sampled relation count per (curve, factor-base type, B), with the factor base frozen by seed.
    - >-
      within-class, within-gauge and between-class variances at matched B, reported side by side.
    - >-
      the interval arm's class spread versus gauge spread at matched B, and its trend across the three primes.
    - >-
      the maximum interval-arm deviation divided by the square root of p, and its fitted p-exponent, which is the
      H2 test.
    - >-
      the empirical standard deviation over many independent factor bases per (curve, B) against the Poisson
      prediction by ratio, and the largest observed count against the Poisson upper quantile, which is the H1
      test.
    - >-
      class sizes, traces and the selection record, including the recorded selection confound.
    - >-
      the transport certificate for every transported pair, with its re-verification result.
    - >-
      pass/fail of every gate control, reported BEFORE any yield number.
  heuristic_under_test: H1
  heuristic_under_test_note: >-
    H1 (the Poisson/hypergeometric variance model for the sampled count) and H2 (the box-localisation error) are
    both under test in the sampling arms, with H1 primary. Note carefully that the MEAN is not heuristic - it is
    exact by linearity of expectation together with the structural identity - so what the sampling arms test is
    the VARIANCE model and the box error, not S1. The exact-count arm tests S1 and is not a heuristic test at
    all. Keeping these separate is a contract obligation, because reporting the exact-count arm's zero variance
    as evidence for H1 would be reporting a control that cannot fail.
  preregistered_prediction:
    quantity: >-
      Three quantities, fixed before any run exists. (1) exact_locus_count on every non-2-torsion class member.
      (2) spread_ratio at matched B. (3) decay_exponent over the four B values.
    formula: >-
      Under S1 the map from the curve to the relation locus is an F_p-isomorphism away from two boundary points,
      so the affine point count equals #E(F_p) - 2 = p - 1 - t EXACTLY, for every member of the class, with
      within-class variance exactly zero. Under S3 the sampled relative spread has mean B^2 (p - 1 - t)/p^2 and
      standard deviation the square root of that, so the RELATIVE spread is proportional to B^{-1} p^{1/2} and
      the fitted decay_exponent is -1. PREDICTED - exact integer equality on every member; spread_ratio below
      1.5; decay_exponent consistent with -1. Under the null that the class carries information, spread_ratio
      would exceed the gauge spread materially and would NOT decay in B.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-0ff796, predictions block, before any run under this
      contract exists. The exact integer identity is a DERIVATION, not a fitted value, and it is the sharpest
      falsifier available at this scale precisely because it admits no tolerance. It may not be relaxed after a
      run; a relaxation is an amendment or it is nothing.
  scale_relevance:
    tier: toy
    justification: >-
      Toy primes, chosen small enough that a COMPLETE isogeny class can be enumerated and every member's locus
      counted exactly in linear time. The scale is forced by the measurement - a complete class is what makes
      'within-class variance' a population quantity rather than a sample statistic, and exact counting is what
      makes the primary test an integer identity rather than a statistical threshold. TRANSFER, STATED
      NARROWLY - the DERIVATION of S1 is unconditional and does not depend on p, so the exact-count arm's
      result is a check on the derivation and its implementation rather than an extrapolation. The SAMPLING
      arms are toy-scale and their fits are toy-scale, and at these primes the Weil error is a visible fraction
      of p so the box channel is visible here and would not be at cryptographic scale. Neither arm licenses an
      extrapolation to cryptographic parameters, and no cryptographic-scale claim is made.
    correspondence: null
  tail_checks:
  - >-
    Report the largest observed sampled count per (curve, B) against the Poisson upper quantile at the same
    sample size. A tail systematically heavier than Poisson means the fibre-structure dependence is larger than
    the bounded constant the variance model assumes.
  - >-
    Report the maximum interval-arm deviation over ALL interval widths, divided by the square root of p, at every
    tested prime, and fit its p-exponent. An exponent materially above 1/2 refutes H2 and is the reportable
    outcome.
  - >-
    Report the smallest factor-base size at which the sampled count's mean falls below 10, and exclude smaller
    sizes from the decay fit by a pre-declared rule rather than a post-hoc trim.
  - >-
    Report the exact-count arm's result separately for the SMALLEST class in each prime, since a class with few
    members gives the identity the fewest chances to fail and a closure resting only on large classes is weaker
    than it looks.
  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
    note: >-
      The exact-count arm is deterministic and its three instances must agree bit-for-bit. The seeds control the
      common random factor base, the interval start offsets, the gauge-orbit sampling and the random (2,2) form
      draw. WITHIN a comparison the factor base is IDENTICAL across class members by construction - that is the
      point of the common-base arm - and the seed varies only across instances.
  budget:
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 8.0
    maximum_memory_gb: 8
    maximum_runs: 12
  stopping_rules:
  - >-
    HALT at Stage 1 if any symbolic identity fails. The record is killed at zero compute.
  - >-
    HALT at Stage 2 if the exact-integer fixture fails on any non-2-torsion curve, or if either nearby object
    returns p - 1 - t.
  - >-
    HALT if any transport certificate fails to re-verify. That is an infrastructure failure, the affected pair is
    excluded and recorded, and if it recurs the transport implementation is the deliverable.
  - >-
    Stop at the declared primes, the declared class-selection rule and the declared factor-base sizes. Selecting a
    different class or adding a B value after seeing a spread is a different experiment.
  - >-
    If class enumeration at the largest prime exceeds the memory or time budget, reduce the prime and RECORD the
    reduction. Budget exhaustion is a stop, never a negative result about invariance (AGENTS.md rule 5).
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first.
  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure and is NEVER
    negative mathematical evidence (AGENTS.md rule 5). A class enumeration that did not finish is not evidence
    about invariance.
  - >-
    A run comparing class members at INDEPENDENTLY CHOSEN targets rather than a transported one is
    invalid_measurement - that compares different problems and is the single most likely way to manufacture a
    fake within-class signal.
  - >-
    A run using a per-curve factor base seeded by the instance, rather than a common one, is invalid_measurement
    for the class-effect comparison.
  - >-
    A run whose gauge arm or nearby-object arms were not executed in the same invocation as the signal arm is
    invalid_measurement.
  - >-
    A run that reports the exact-count arm's zero variance as evidence about the yield functional's invariance is
    invalid_reporting; that arm is a control that cannot fail for anything except an error in the structural
    identity, and it is declared as such in advance.
  - >-
    A run that reports a single prime's box-channel result without its p-trend is invalid_reporting - at toy
    primes the Weil error is a visible fraction of p.
  - >-
    A run whose parameters differ from this frozen contract is a DIFFERENT experiment and needs a new contract.
  success_criterion: >-
    ALL FIVE of the following, each decidable from the primary metrics. (1) symbolic_gate is PASS on all three
    Stage-1 identities. (2) exact_locus_count is emitted for every member of every selected class, compared
    against p - 1 - t by exact integer equality, at a transported target with its certificate re-verified.
    (3) nearby_object_disagreement is true on BOTH nearby objects. (4) spread_ratio is reported at every value of
    B for the common-random arm, the interval arm and the gauge arm. (5) decay_exponent is FITTED over at least
    four values of B and reported with its fit quality. NOTE that success means THE MEASUREMENT WAS MADE AND ITS
    GATES PASSED; whether the hypothesis is supported is decided by the pre-registered prediction and the
    falsification criteria, and a completed run that refutes S1 or S3 is a successful run.
  falsification_criterion:
  - >-
    Any non-2-torsion class member gives exact_locus_count different from p - 1 - t - S1 is FALSE as stated; the
    record is SUPERSEDED, not amended, and the failure is itself the finding.
  - >-
    symbolic_gate FAILS on the weight-8 identity - the gauge analysis is wrong and every gauge-null design in
    this lane must be revisited, not just this record's.
  - >-
    The 2-torsion control returns p - 1 - t, or the random (2,2) form does - the counter is not reading the
    geometry; nothing is reported.
  - >-
    spread_ratio exceeds 1.5 at matched B, or decay_exponent is not consistent with -1 - S3 is FALSE, relation
    yield has a class-dependent component the derivation misses, the closure is WITHDRAWN, and the lane gets a
    target instead. The reachability accounting then becomes live before any attack reading.
  - >-
    The interval arm's fitted p-exponent is materially above 1/2 - H2 is refuted and the box-localisation figure
    may not be quoted anywhere in this lane.
  required_artifacts:
  - >-
    manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and
    environment
  - >-
    raw-result.json carrying every per-curve exact count and every per-(curve, type, B) sampled count, not
    summaries
  - >-
    the gauge-orbit arm, the 2-torsion arm and the random-form arm, in the same file as the signal arm
  - >-
    the transport certificates with their re-verification results, one per transported pair
  - >-
    the Stage-1 symbolic verification transcript, including the RE-DERIVED discriminant identity rather than a
    quotation of it
  - >-
    the class enumeration - traces, class sizes and membership - with the pre-registered selection rule and the
    recorded selection confound
  - >-
    the Stage-0 literature-check record, filed whether or not it supports the record
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval is required before execution. This contract is NOT approved; approved_by is null,
    execution_authorized is false and frozen is false (AGENTS.md rule 1). Approval is the user's gate because it
    authorizes execution and spends compute.
  - >-
    The parent proposal is proof-oriented and carries a proof_search_map, inherited into H-ICINV-b96cc7; it must
    be audited against KN-TECH-080 before implementation. Stages 1 and 2 alone are sufficient to kill the record
    and cost minutes, which is why this is the cheapest item in the lane and a natural first authorization.
  - >-
    THIS CONTRACT CAN CLOSE A LANE. Under the Coordinator's closure gate, a closure decision resting on it needs a
    complete obstruction block - the quantity, its measured value with units and error bars, the runs it is read
    from, and the scope claimed - and a genuine resource check. The obstruction quantity here is named in advance:
    the exact integer p - 1 - t and the measured spread_ratio and decay_exponent, over the scope 'arity 2, in the
    mean, at the executed toy primes, for short-Weierstrass models, at transported non-2-torsion targets'. A
    closure asserted over a wider scope than that is refused.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260807-0ff796
    authored_at: '2026-08-25'
    note: >-
      Design, controls, metrics and criteria are taken from the parent proposal's mechanism, minimal_test,
      controls, required_metrics, predictions, falsification_conditions and heuristic_assumptions, and restated as
      a contract. Boilerplate identical across contracts by program rule comes from a fixed table. Budgets come
      from the parent's declared estimated_cost (implementation low, compute low), sized for a full class
      enumeration at toy primes. NO NUMBER IS INVENTED and no measurement is asserted; the exact integer identity
      is a derivation the run is built to check, and the parent's own honest prior is that the residual risk lies
      in an unnoticed degenerate configuration rather than in the argument being wrong.
  derivation_gaps:
  - >-
    The toy primes and the class-selection rule are not enumerated here. They must be pre-registered before any
    measurement, because selecting the largest classes selects on class number, which correlates with the
    arithmetic of the discriminant and hence with the 2-torsion structure that drives several functionals. That
    is not selection on the outcome but it is not neutral, and it must be recorded rather than discovered.
  - >-
    The box-localisation error is carried as OPEN. Its exponent is not re-derived here and must be either
    re-derived or replaced by the measured empirical bound before any write-up quotes it. The interval arm
    measures it; it does not settle it.
  - >-
    The number of gauge representatives and the number of independent factor bases per (curve, B) are described as
    'many' rather than fixed. Both must be pinned before the run, because a gauge arm with too few draws will
    understate the gauge spread and thereby make spread_ratio look worse than it is - i.e. the under-specification
    biases AGAINST the hypothesis, which is the safe direction but is still under-specification.
  - >-
    Trace-zero classes are excluded or stratified but the choice between the two is not made here. It must be made
    before the run, because supersingular-over-F_p behaviour there is different and mixing it into a class-effect
    comparison would confound it.
  - >-
    The Stage-0 external literature check may well find the (2,2)/genus-1 model already in the summation-polynomial
    literature. That would be an INGREDIENT and not a defeat, but the Coordinator should decide in advance how a
    positive hit changes the record's novelty status, so the decision is not made after the fact.
