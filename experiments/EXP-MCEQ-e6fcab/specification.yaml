experiment:
  id: EXP-MCEQ-e6fcab
  hypothesis_id: H-MCEQ-ecf07c
  derived_from_idea: IDEA-20260808-0b3072
  question_id: RQ-MCEQ-fcb504
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Hull non-invariance, determinantal transformation identity, and
    determinantal-fibre size for matrix code equivalence at toy parameters --
    with an orthogonal-subgroup positive control, a blocking inequivalent-pair
    soundness null, a planted-substitution recovery check, and an explicit
    exhaustive-versus-lower-bound separation on the q-growth question

  objective: >-
    THE ONE UNCERTAINTY A RUN REDUCES -- whether the hull-based
    support-splitting route transfers to matrix code equivalence, and whether
    the determinantal form is a usable replacement invariant with a small,
    q-independent fibre. A run establishes -- (i) A1, the rate at which the
    trace-form hull dimension CHANGES under random group elements, against
    (ii) A2, the rate at which it is PRESERVED under the orthogonal subgroup,
    which separates a real obstruction from a broken measurement; (iii) B1,
    coefficient-wise agreement of Delta_{ACB} with det(A) det(B) Delta_C over
    F_q with the scalar RECOVERED rather than fitted; (iv) C1, the number of
    GL_k substitutions matching the determinantal forms of an equivalent pair,
    per cell, labelled EXHAUSTIVE or LOWER-BOUND, with its q-dependence;
    (v) C2, the same count on random INEQUIVALENT pairs with matching rank
    distribution, which must be zero; (vi) C3, recovery of the planted
    substitution on the exhaustive baseline slice; and (vii) G1 and H1, the
    density of degenerate codes excluded and the agreement of random codes with
    the expected-codimension prediction. NO ATTACK IS PROPOSED and no statement
    about any deployed matrix-code scheme follows.

  what_this_is_not:
    - >-
      Not an attack. A reduction to hypersurface equivalence is not an attack;
      polynomial equivalence is itself a hard problem family and nothing here
      claims it is easier.
    - >-
      Not a claim about MEDS or any deployed matrix-code scheme, at any
      parameter set, in either direction.
    - >-
      Not a comparison against published matrix-code equivalence algorithms.
      This program's characterisation of them is recalled and unverified, so no
      such comparison is made and none may be reported.
    - >-
      Not a treatment of the rectangular case m not equal to n, where the
      determinant is undefined and the invariant must be replaced by maximal
      minors.
    - >-
      Not approval, freezing, execution authorization, a run, an observed
      output, or evidence. approved_by is null.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE -- "at n = k in {3,4,5} and q in {5,7,11,13},
      the trace-form hull dimension changed under random (A, B) at rate [A1]
      and was preserved under the orthogonal subgroup at rate [A2]; the
      determinantal identity held coefficient-wise on [B1] of tested instances
      with the scalar recovered; and the number of matching GL_k substitutions
      was [C1], measured EXHAUSTIVELY at n = k = 3 for q in {5,7} and as a
      LOWER BOUND elsewhere." WHAT DOES NOT FOLLOW -- that form equivalence is
      easier than matrix code equivalence; any attack; anything about the
      rectangular case; anything about a deployed scheme; and no statement that
      the fibre is q-independent based on any non-exhaustive cell, since a
      bounded search can demonstrate growth but never its absence.

  inputs:
    procedure: >-
      STAGE 0 (zero compute) -- freeze and hash the cell list, which cells are
      EXHAUSTIVE and which are LOWER-BOUND, the degenerate-code exclusion rule,
      the random-code and random-group sample counts, and the forced values
      A2 = 1.00, B1 = 1.000, C2 = 0, C3 recovered.
      STAGE 1 (minutes) -- generate random matrix codes per cell; EXCLUDE codes
      with identically zero Delta or contained in the singular locus and RECORD
      their density; then apply random (A, B) and measure the hull dimension
      before and after (A1). Run the ORTHOGONAL SUBGROUP arm in the same
      invocation (A2).
      STAGE 2 (minutes) -- verify the determinantal identity coefficient-wise
      over F_q on every equivalent pair, RECOVERING the observed scalar and
      comparing it against det(A) det(B) rather than fitting it (B1). A failure
      here BLOCKS everything downstream.
      STAGE 3 (hours) -- for each equivalent pair, solve for the GL_k
      substitution matching the two determinantal forms. At the EXHAUSTIVE
      cells (n = k = 3, q in {5,7}) enumerate GL_k completely and report an
      exact count; elsewhere run a bounded structured-plus-random search and
      report a LOWER BOUND with the bias direction stated. Run the
      INEQUIVALENT-PAIR null (C2) and the PLANTED RECOVERY check (C3) in the
      same invocation.
      STAGE 4 (minutes) -- for the same random codes, compute the singular
      locus dimension and the number of irreducible factors of Delta and
      compare against the expected-codimension prediction (H1), examining every
      failing code for whether it is one of the declared degenerate families.
      STAGE 5 (zero compute) -- report C1's q-dependence SEPARATELY for
      exhaustive and lower-bound cells, and state explicitly that no
      q-independence conclusion is drawn from a lower-bound cell.
    instrument: >-
      Python 3.11 with numpy, all arithmetic exact over F_q by integer
      operations modulo q -- no floating point anywhere. Determinants of
      symbolic linear matrix pencils are expanded by direct multivariate
      polynomial arithmetic over F_q implemented from its definition; NO Sage
      and NO sympy, whose absence in this container is recorded in prior lane
      records and must be re-checked and RECORDED at run time. Hull dimension
      is computed by exact rank over F_q of the trace-form Gram. GL_k
      enumeration at the exhaustive cells is a complete loop with the group
      order checked against its closed form. Recorded through harness/runner.py.
    parameters: >-
      n = k in {3, 4, 5}; q in {5, 7, 11, 13}. EXHAUSTIVE substitution cells --
      n = k = 3 at q in {5, 7} only, where |GL_3(F_q)| is small enough to
      enumerate completely; every other cell is LOWER-BOUND. 1000 random codes
      per cell; 200 random (A, B) per code for the hull measurement; 200
      inequivalent pairs per cell for the soundness null; the orthogonal
      subgroup arm at the same sample size. Degenerate codes -- identically
      zero Delta, common kernel vector, or common image -- excluded with their
      density reported.
  controls:
    - >-
      ORTHOGONAL-SUBGROUP POSITIVE CONTROL, BLOCKING -- restrict (A, B) to the
      subgroup where B is the inverse transpose of A. The hull MUST be
      preserved there. This is what separates "the hull is not invariant under
      the group" from "the hull measurement is broken"; a failure voids every
      A1 number.
    - >-
      INEQUIVALENT-PAIR SOUNDNESS NULL, BLOCKING -- random INEQUIVALENT codes
      with matching rank distribution must yield an EMPTY substitution set. A
      non-empty result means the invariant is too coarse and the reduction is
      unsound, and no positive fibre measurement means anything.
    - >-
      SCALAR CONTROL -- the observed scalar relating Delta_{ACB} to Delta_C is
      RECOVERED from the data and compared against det(A) det(B), never fitted.
      Fitting it would make the identity a tautology instead of a check.
    - >-
      PLANTED-SUBSTITUTION RECOVERY -- the exhaustive search on the baseline
      slice must rediscover the substitution used to construct the equivalent
      pair. A search that cannot find a solution it was given is not measuring
      a fibre.
    - >-
      BASIS-INVARIANCE CHECK -- the substitution count on the baseline slice
      must be stable under re-running with a different generating basis of the
      same code. A count that depends on the basis is a property of the
      representation, not of the code.
    - >-
      DEGENERATE-CODE EXCLUSION, REPORTED -- codes with identically zero Delta
      or lying in the singular locus are excluded and their DENSITY is
      reported per cell, never silently dropped, since a large exclusion
      changes what "random code" means in every other number.
    - >-
      EXHAUSTIVE-VERSUS-LOWER-BOUND SEPARATION -- every substitution count is
      labelled, and the q-growth conclusion is drawn ONLY from exhaustive
      cells. A bounded search can demonstrate growth but can never demonstrate
      its absence, and the contract states that bias direction explicitly.
    - >-
      GROUP-ORDER CHECK -- the exhaustive GL_k enumeration's element count must
      match the closed-form group order exactly, so an incomplete enumeration
      cannot masquerade as a complete one.

  independent_variables:
    - "dimension n = k"
    - field size q
    - "group arm (full GL_n x GL_n / orthogonal subgroup)"
    - "pair class (equivalent / inequivalent with matched rank distribution)"
    - "search mode (exhaustive GL_k enumeration / bounded lower-bound search)"
    - generating basis of the code (for the basis-invariance check)

  metrics:
    primary:
      - >-
        A1 hull_change_rate -- fraction of random (A, B) in GL_n x GL_n for
        which the trace-form hull dimension of the code changes. Computed as
        exact rank over F_q of the trace-form Gram before and after. Unit --
        fraction, per (n, k, q).
      - >-
        A2 orthogonal_preservation_rate -- the same quantity restricted to the
        subgroup where B is the inverse transpose of A, reporting the fraction
        PRESERVED. Unit -- fraction. Forced value 1.00; BLOCKING.
      - >-
        B1 determinantal_identity_match_rate -- fraction of tested instances
        where Delta_{ACB} equals det(A) det(B) Delta_C coefficient-wise over
        F_q, with the observed scalar recovered and compared. Unit -- fraction.
        Forced value 1.000; BLOCKING.
      - >-
        C1 substitution_solution_count -- the number of GL_k substitutions
        matching the determinantal forms of an equivalent pair, per (n, k, q),
        each labelled EXHAUSTIVE or LOWER-BOUND. Unit -- dimensionless count.
      - >-
        C2 inequivalent_pair_solution_count -- the same count on random
        inequivalent pairs with matching rank distribution. Unit --
        dimensionless count. Forced value 0; BLOCKING.
      - >-
        C3 planted_substitution_recovered -- boolean, whether the exhaustive
        search rediscovers the planted substitution on the baseline slice.
        Unit -- boolean. Required true.
    secondary:
      - >-
        G1 degenerate_code_density -- fraction of random codes excluded for
        identically zero Delta, common kernel or common image, per cell
      - >-
        H1 expected_codimension_agreement -- fraction of random codes whose
        singular-locus dimension and irreducible-factor count of Delta match
        the prediction, with every failing code examined for membership in a
        declared degenerate family
      - the basis-invariance check result on the baseline slice
      - the group-order check for the exhaustive enumeration
      - number of coefficients in the determinantal form, C(k + n - 1, n), as the storage cost, measured against peak memory
      - wall clock per cell and per search mode
      - a recorded check of whether sage and sympy import

  heuristic_under_test: HEUR-MCEQ-1
  preregistered_prediction:
    quantity: >-
      A1 approaching 1 and strictly above 0 at every cell; A2 = 1.00;
      B1 = 1.000; C1 finite and FLAT in q on the exhaustive cells; C2 = 0;
      C3 true.
    formula: >-
      A1 := |{(A,B) : dim(ACB intersect (ACB)-perp) not equal to
      dim(C intersect C-perp)}| / (number of sampled (A,B)). B1 := |{instances
      where every coefficient of Delta_{ACB} equals det(A) det(B) times the
      corresponding coefficient of Delta_C}| / (number of instances). C1 :=
      |{S in GL_k : Delta_D composed with S is a scalar multiple of Delta_C}|,
      exact where the cell is exhaustive. Under the NULL that the hull IS
      invariant, A1 = 0. Under the NULL that the invariant is too coarse,
      C2 > 0. Under the NULL that the fibre grows exponentially, C1 increases
      with q on the exhaustive cells.
    source: >-
      Pre-registered in IDEA-20260808-0b3072 (its three predictions -- hull
      change under random (A,B), exact coefficient-wise determinantal equality,
      and the size of the substitution solution set with its q-dependence) and
      restated as A1-A2, B1, C1-C3 in H-MCEQ-ecf07c before any run exists. The
      exhaustive-versus-lower-bound separation and the group-order and
      basis-invariance checks are ADDED here, because the parent's q-growth
      test is not decidable from a bounded search alone.

  scale_relevance:
    tier: toy
    justification: >-
      Executed at n = k <= 5 and q <= 13, chosen so that the decisive
      measurement -- the substitution count -- can be EXHAUSTIVE on at least
      two cells. That is the whole reason for the small parameters -- a fibre
      size measured by bounded search is a lower bound and cannot answer the
      q-growth question, which is Claim C's entire content. TRANSFER
      ASSUMPTIONS, STATED -- none. Nothing extrapolates to larger n, k or q, to
      the rectangular case, or to any deployed scheme, and the parent
      proposal's own honest prior puts the probability that this reduction
      leads anywhere computationally useful at about 0.1. Small q also makes
      solver behaviour atypical, which is why q is swept rather than fixed.
    correspondence: null

  tail_checks:
    - >-
      Report the codes that FAIL the expected-codimension prediction
      individually and check whether they are exactly the declared degenerate
      families; an unexplained failure class falsifies HEUR-MCEQ-1 and must not
      be averaged away.
    - >-
      Report the maximum substitution count observed per cell, not only the
      mean, since a fibre that is usually 1 and occasionally large is a
      different object from one that is uniformly small.
    - >-
      Report the hull dimension DISTRIBUTION before and after, not only the
      change rate, since a hull that is generically zero-dimensional would make
      A1 uninformative for a reason unrelated to invariance.
    - >-
      Report every cell where the bounded search exhausted its budget, as
      LOWER-BOUND with the budget stated, so a flat count cannot be read as a
      flat fibre.
    - >-
      Report C(k + n - 1, n), the coefficient count of the determinantal form,
      beside measured peak memory per cell, since that is the real storage cost
      of the representation and it is what would grow first.

  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
    note: >-
      Seeds govern the random code draws, the random group elements and the
      bounded searches' restarts. The EXHAUSTIVE GL_k enumerations and the
      determinantal identity check are deterministic given their inputs and
      must be identical across seeds; a seed-to-seed difference there is an
      implementation defect, not variance.

  budget:
    wall_clock_seconds_per_run: 10800
    total_cpu_hours: 8.0
    maximum_memory_gb: 8
    maximum_runs: 8

  stopping_rules:
    - >-
      STOP at Stage 2 if B1 is below 1.000. Every downstream metric is void
      until the implementation is verified; if the discrepancy survives
      verification the invariant is mis-stated and the idea dies at zero
      further cost, which is the cheapest available outcome.
    - >-
      STOP all Claim-A reporting if A2 is below 1.00. The hull measurement is
      at fault rather than the group.
    - >-
      STOP all fibre reporting if C2 is above 0 or C3 is false. The invariant
      is unsound or the search is not measuring a fibre.
    - >-
      Report a cell as LOWER-BOUND, never as a count, when the search exhausts
      its budget, and state the bias direction. The q-growth verdict uses
      exhaustive cells only.
    - >-
      Stop at maximum_runs, total_cpu_hours or maximum_memory_gb, whichever
      binds first. Budget exhaustion is a stop, never a negative result
      (AGENTS.md rule 5).

  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or missing-dependency failure makes
      the run failed_infrastructure and is NEVER negative mathematical evidence
      (AGENTS.md rule 5). An unfinished GL_k enumeration is unfinished, not
      empty.
    - >-
      A run reporting A1 without the orthogonal-subgroup arm executed in the
      same invocation is invalid_measurement.
    - >-
      A run reporting C1 without the inequivalent-pair null executed in the
      same invocation is invalid_measurement.
    - >-
      A run in which the observed scalar was FITTED rather than recovered and
      compared is completed_invalid; the identity would then be untested.
    - >-
      A run whose exhaustive GL_k enumeration element count does not match the
      closed-form group order is completed_invalid; an incomplete enumeration
      reported as exhaustive would make the q-growth verdict meaningless.
    - >-
      A run that draws a q-independence conclusion from a LOWER-BOUND cell is
      completed_invalid.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT
      experiment and requires a new contract.

  success_criterion: >-
    The run is SUCCESSFUL as a measurement when -- (a) A2 = 1.00 and
    B1 = 1.000; (b) C2 = 0 and C3 is true; (c) the exhaustive cells' group
    order check passed and their counts are reported as exact integers; (d) A1,
    C1, G1 and H1 are reported per cell with every count labelled EXHAUSTIVE or
    LOWER-BOUND; and (e) the degenerate-code density and the basis-invariance
    check are reported. CLAIM A is SUPPORTED at toy tier if A1 is strictly
    above 0 at every cell and rises with q while A2 = 1.00. CLAIM B is
    SUPPORTED if B1 = 1.000 with the scalar recovered. CLAIM C is SUPPORTED if
    C1 is finite and does NOT grow with q ON THE EXHAUSTIVE CELLS, and is
    otherwise UNDECIDED rather than supported.

  falsification_criterion:
    - >-
      A1 = 0 at any cell while A2 = 1.00 -- the hull is PRESERVED under general
      group elements. CLAIM A IS FALSE and support splitting may transfer to
      matrix codes, which is a strictly more useful finding and must be
      reported prominently.
    - >-
      B1 < 1.000 after the implementation is verified. CLAIM B IS FALSE, the
      invariant is mis-stated, and the whole idea dies at zero further cost.
    - >-
      C1 GROWS with q on the exhaustive cells. CLAIM C IS FALSE; the reduction
      hides an exponentially growing ambiguity and the measured growth is the
      recorded obstruction.
    - >-
      C2 > 0 -- inequivalent codes admit a matching substitution. The invariant
      is too coarse, the reduction is UNSOUND, and the collision is the
      deliverable.
    - >-
      A2 < 1.00 -- the orthogonal control fails. Instrument defect; every
      Claim-A number is void.
    - >-
      C3 false -- the planted substitution is not recovered. The search is not
      measuring a fibre and no count is admissible.
    - >-
      An unexplained class of random codes fails the expected-codimension
      prediction. HEUR-MCEQ-1 is falsified and Claim C loses its stated
      support.
    - >-
      A bounded search returns a HIGHER count than the exhaustive search where
      both ran. HEUR-MCEQ-2 fails; the search returns non-solutions and every
      count is void.

  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
    - raw-result.json carrying every per-code and per-cell measurement, not summaries
    - the orthogonal-subgroup arm and the inequivalent-pair null, in the same file as the signal arm
    - the recovered scalars alongside det(A) det(B) per instance, so the identity is visibly checked rather than assumed
    - the exhaustive GL_k enumeration's element count beside the closed-form group order, per exhaustive cell
    - the planted-substitution recovery result and the basis-invariance check
    - the degenerate-code exclusion list with its density per cell
    - every count explicitly labelled EXHAUSTIVE or LOWER-BOUND, with the search budget for each lower-bound cell
    - the coefficient count C(k + n - 1, n) beside measured peak memory per cell
    - a recorded check of whether sage and sympy import

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution. This contract is
      review_required and is NOT approved; approved_by is null and
      execution_authorized is false (AGENTS.md rule 1). Approval is the user's
      gate because it authorizes execution and spends compute.
    - >-
      The parent proposal is proof-oriented in part; its obligations are
      carried in H-MCEQ-ecf07c.proof_search_map and must be audited before
      implementation (KN-TECH-080).
    - >-
      A Coordinator must confirm which cells are EXHAUSTIVE before approval.
      The q-growth verdict rests entirely on them, and a cell wrongly declared
      exhaustive would make Claim C undecidable while looking decided.
    - >-
      A Coordinator must confirm that approving this contract licenses NO
      statement about MEDS or any deployed matrix-code scheme under any
      outcome, and no comparison against published algorithms whose
      complexities are recalled and unverified in this program.

  derivation_provenance:
    tool: coordinator-subagent design pass
    source_record: IDEA-20260808-0b3072
    authored_at: '2026-08-25'
    note: >-
      Metrics A1, A2, B1, C1, C2, G1 and H1 render the parent proposal's three
      predictions, its three controls and its four falsification conditions
      into quantities decidable from a recorded number. THREE THINGS ARE ADDED
      HERE AND ARE DISCLOSED -- the exhaustive-versus-lower-bound separation
      (without it the q-growth test is not decidable, since a bounded search
      can show growth but never its absence), the planted-substitution recovery
      check C3, and the group-order check on the exhaustive enumeration.
      Budgets come from the parent's declared estimated_cost (implementation
      medium, compute low) and from its own order-of-magnitude estimate of
      10^2 to 10^3 core-seconds, with headroom for the exhaustive cells. No
      field is invented; unsupplied values are listed in derivation_gaps.

  derivation_gaps:
    - >-
      THE PARENT PROPOSAL ASSUMES A GROEBNER SOLVER for the substitution
      search. Prior lane records report Sage and sympy absent from this
      container. This contract therefore specifies EXHAUSTIVE ENUMERATION at
      the small cells as the certified path and a bounded structured search
      elsewhere, reported as a lower bound. A Coordinator should confirm the
      solver situation before approval; if a solver is available, the
      lower-bound cells could be upgraded, and that would be a new contract
      rather than a repair of this one.
    - >-
      The exact bounded-search strategy for non-exhaustive cells (structured
      starts, restart count, budget per cell) is not specified. It must be
      frozen before the run, since a search budget chosen after seeing a count
      would make the lower bound uninterpretable.
    - >-
      The rank-distribution matching rule for the inequivalent-pair null is
      named but not defined. Matching on the full rank profile versus on the
      minimum rank gives different nulls, and the choice must be frozen.
    - >-
      The finiteness of determinantal representations in higher dimension is
      RECALLED AND UNVERIFIED in the parent proposal and no source is asserted
      here. It is carried as HEUR-MCEQ-1 with its own falsification condition
      and is measured rather than assumed; a session able to reach the primary
      literature should verify it before Claim C is cited anywhere.
    - >-
      The parent proposal's most likely honest outcome -- that the reduction is
      correct but computationally useless -- is NOT directly measured by this
      contract, which does not benchmark form equivalence against matrix code
      equivalence. That comparison is named as a distinguishable outcome and as
      a named closure, but it would need its own contract and its own baselines,
      and the omission is disclosed rather than silently dropped.
