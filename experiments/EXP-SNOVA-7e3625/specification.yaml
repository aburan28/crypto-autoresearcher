experiment:
  id: EXP-SNOVA-7e3625
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-SNOVA-ec84c2
  question_id: RQ-SNOVA-001
  goal_id: GOAL-SNOVA-001
  batch_id: null
  title: >-
    Review-required contract: exhaustive module-count gate for the oil-object
    entropy of structured-ring UOV variants, with an ell = 1 null, a
    non-semisimple discriminator, a QR-UOV nearby object, and two
    pre-registered non-binding ceilings over SNOVA's eleven published
    parameter rows

  objective: >-
    If separately approved, frozen and authorized, decide whether one frozen
    parameter-free formula set (Psi, fixed in H-SNOVA-ec84c2) reproduces the
    exhaustively enumerated number of admissible oil objects for every algebra
    class in a closed list, and - conditional on reading SNOVA's secret-
    transformation structure from primary text - compute the exponent of the
    entropy-matched plain-UOV baseline and two unconditional security ceilings
    for the eleven published SNOVA parameter rows. The predicted outcome is
    that Psi passes and that BOTH ceilings are non-binding at every row. This
    contract is a design proposal only; no run has occurred and none is
    authorized by this file.

  goal_ordering_note: >-
    GOAL-SNOVA-001 is status draft and its committed next_action requires the
    reported SNOVA attacks to be filed as KN-LIT entries from primary text
    BEFORE ideation is run, and forbids restating this program's inherited
    secondhand SNOVA figures. This contract does not override that ordering and
    does not claim to satisfy it: Stage 0 IS the primary-text task, no
    secondhand figure appears anywhere in this contract, and Stages 1-3 are
    gated behind Stage 0 completing or recording an explicit source blocker.
    Only the Coordinator may approve, freeze or authorize anything here.

  what_this_is_not:
    - Not a key recovery, not a forgery, not a signature, not an attack of any kind.
    - Not a certificate of the sort GOAL-SNOVA-001's first completion criterion requires, and no substitute for one.
    - Not a claim that any SNOVA parameter set is broken, weakened, or safe.
    - Not a confirmation, contradiction, reproduction or restatement of any reported SNOVA attack, weak-key density, or security-margin figure.
    - Not a cost model, not a runtime measurement, and not an attack-complexity exponent - the exponents computed here are exponents of key-space cardinalities.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.
    - Not a statement about UOV, MAYO or QR-UOV beyond the single QR-UOV-shaped nearby-object arm, which exists only as a control.

  claim_ceiling: >-
    TIER toy for every enumerated cell. Any future execution would be limited
    to: base fields q in {2, 3}; algebras in the frozen list F_q, F_{q^2},
    F_{q^3}, F_q x F_q, F_q[x]/(x^2), M_2(F_q), M_3(F_q); free modules A^N with
    N in {2, 3} and submodule rank k in {1, 2}, k < N; plus exact integer
    arithmetic on eleven published parameter rows. A single run cannot support
    or reject any attack claim, cannot establish any cost, exponent,
    cryptographic-scale or deployed-scheme conclusion, and cannot raise its own
    tier. The parameter arithmetic in Stage 2 is exact but is arithmetic on
    published parameters, NOT a measurement, and evidence derived from it must
    say so in those words.

  inputs:
    algebra_list_frozen:
      - {label: A0_base, form: "F_q", ell: 1}
      - {label: A1_field2, form: "F_q[x]/(f), f irreducible of degree 2", ell: 2}
      - {label: A2_field3, form: "F_q[x]/(f), f irreducible of degree 3", ell: 3}
      - {label: A3_split, form: "F_q x F_q", ell: 2}
      - {label: A4_local, form: "F_q[x]/(x^2)", ell: 2}
      - {label: A5_mat2, form: "M_2(F_q)", ell: 2}
      - {label: A6_mat3, form: "M_3(F_q)", ell: 3}
    module_shapes:
      N_values: [2, 3]
      k_values: [1, 2]
      constraint: "k < N"
    enumeration_fields: [2, 3]
    arithmetic_field: 16
    ell_values_for_symbolic_deficit: [1, 2, 3, 4, 5]
    irreducible_polynomial_selection: >-
      For A1_field2 and A2_field3 the defining polynomial is the
      lexicographically first monic irreducible of the required degree over
      F_q, in the ordering induced by reading coefficients from the constant
      term upward as base-q digits. This is a deterministic rule, not a choice:
      no polynomial may be substituted after any count is observed.
    parameter_rows_source: >-
      The eleven (SL, v, o, q, ell) rows to be TRANSCRIBED FROM RAW HTML in
      Stage 0 from https://snova.pqclab.org/. The rows fetched on 2026-08-06
      through the harness web tool, which renders through a summarising model,
      are recorded in H-SNOVA-ec84c2 for comparison ONLY; if the raw-HTML
      transcription differs in any cell, the transcription wins and the
      discrepancy is reported.
    master_seed: 7362519
    domain: "EXP-SNOVA-7e3625/v1"
    seed_encoding: >-
      ASCII bytes of domain || "|" || label || "|" || decimal(q) || "|" ||
      decimal(N) || "|" || decimal(counter), hashed with SHA-256; digest
      integers use big-endian unsigned interpretation. Seeds are used ONLY by
      the optional randomized cross-check arm (CROSS-1). The primary
      enumeration is exhaustive and deterministic and consumes no randomness at
      all, which is why a seed disagreement can never explain a gate failure.

  environment_preflight:
    statement: >-
      This session's two scouting reports disagree about whether numpy, sympy,
      Sage, fpylll or any algebra system is importable in this container. THE
      CONTRACT RESOLVES THE DISAGREEMENT BY NOT DEPENDING ON IT: every stage
      uses the Python 3 standard library only. The executor must still record,
      as a diagnostic, the output of `python3 -c "import numpy"` and
      `python3 --version`, so the disagreement is settled on the record - but
      neither result can block or invalidate any stage.
    required_record:
      - python3 --version
      - "python3 -c \"import numpy\" exit status and message"
      - "confirmation that no import outside the standard library appears in the run script"

  stages:
    - id: STAGE-0
      name: primary-text acquisition and reading
      compute: zero
      can_terminate_run: true
      description: >-
        Attempt, in this declared order and recording every URL with its HTTP
        status code: (a) https://snova.pqclab.org/ raw HTML, and transcribe the
        eleven parameter rows by hand from source; (b) the SNOVA specification
        document linked from that page; (c) https://eprint.iacr.org/2026/237
        abstract page, then its PDF, then arXiv, then an author-hosted copy.
        From the specification, record VERBATIM: the ring, the form of the
        central map, WHICH GROUP THE SECRET TRANSFORMATION RANGES OVER, whether
        the characteristic polynomial of S is stated to be irreducible or
        squarefree, and whether signing is possible from the oil object alone.
      terminating_conditions:
        - >-
          If the secret-transformation structure cannot be established from
          obtainable text, Stages 2 and 3 are NOT run: Stage 1 still runs
          (it is about algebras, not SNOVA), and the package reports a SOURCE
          BLOCKER with the URL/status table. A source blocker is infrastructure
          signal and is NEVER negative mathematical evidence about SNOVA or
          about H-SNOVA-ec84c2.
        - >-
          If the specification establishes Reading 3 (no algebra structure on
          the secret transformation), Stage 2's deficit computation is reported
          as VOID with the reason, Stage 1 stands, and the hypothesis's Part B
          is recorded as falsified by F4.
    - id: STAGE-1
      name: exhaustive module-count gate
      compute: seconds to minutes, pure Python
      can_terminate_run: true
      description: >-
        For every (algebra, q, N, k) cell in the frozen list, construct A^N
        explicitly, generate every cyclic left submodule, close under addition,
        deduplicate, and count submodules by cardinality. Compare each count
        against the pre-registered integer in H-SNOVA-ec84c2's frozen table.
        Independently recount |A^N| as a coverage check.
      terminating_conditions:
        - >-
          A single mismatch at the A5_mat2/q=2/N=2/k=1 cell (pre-registered 35)
          fires falsification F1: Psi is wrong, the ell^3 figure is withdrawn,
          and the package emits the named no-go with its exact boundary.
        - >-
          A deficit factor other than exactly 1 at ell = 1 fires F2 and NO
          result of any sign may be reported.
    - id: STAGE-2
      name: parameter arithmetic and the matched baseline
      compute: seconds, exact integers
      can_terminate_run: false
      description: >-
        Using the Stage-0 transcription, compute for each of the eleven rows:
        the Reading-1, Reading-2 and Reading-3 exponents; the two ceilings in
        bits; the binding counts G6 and G7; and the entropy-matched plain-UOV
        instance (n', o') with o'(n' - o') equal to the Reading-1 exponent,
        reported as the full set of integer solutions with n' > o' > 0 rather
        than one chosen representative.
    - id: STAGE-3
      name: nearby-object separation
      compute: seconds
      can_terminate_run: false
      description: >-
        Recompute the deficit factor for a QR-UOV-shaped instance - commutative
        coefficient algebra of F_q-dimension ell, variables NOT ell-by-ell
        matrices - through the identical code path, and report whether it
        differs from the SNOVA value. Forced value ell, against SNOVA's ell^3.

  arms_and_controls:
    treatment: >-
      The A5_mat2 and A6_mat3 cells (the SNOVA-shaped matrix-ring algebras) and
      the Reading-1 exponent computation over the eleven rows.
    measured_null: >-
      The A0_base cells at ell = 1, where the algebra is F_q itself, the
      scheme degenerates to plain UOV, and the deficit factor is FORCED TO
      EXACTLY 1 and the count to exactly [N choose k]_q. This null can fail: an
      implementation that conflates the ambient F_q-dimension with the module
      rank returns something other than 1 here.
    positive_control: >-
      The A5_mat2 cell at q = 2, N = 2, k = 1, where the effect - a count
      strictly larger than that of the commutative algebra of the same
      F_q-dimension - MUST appear, with the exact value 35 against A1_field2's
      5. IF THE ENUMERATOR DOES NOT RETURN 35, THE INSTRUMENT IS BROKEN AND NO
      NEGATIVE RESULT OF ANY KIND MAY BE REPORTED.
    graded_control: >-
      The five-rung ladder at q = 2, N = 2, k = 1 over A0_base, A1_field2,
      A4_local, A3_split, A5_mat2, with pre-registered exact values
      (3, 5, 6, 9, 35). Monotonicity is REPORTED but is not the criterion: the
      ladder is pre-registered as non-monotone in semisimplicity and the
      coincidence with [2 choose 1]_8 = 9 is recorded in advance, so observing
      either is a pass and not a discovery. A failure at one rung localises the
      obstruction to that algebra class.
    semisimplicity_discriminator: >-
      A1_field2 (forced 5) against A4_local (forced 6) at q = 2, and 10 against
      12 at q = 3. Equal values on the two arms mean the instrument is blind to
      semisimplicity, which is the property the companion proposal's Maschke
      argument turns on; the ladder must then be reported as blind rather than
      as a pass.
    nearby_object_control: >-
      The QR-UOV-shaped arm of Stage 3, whose deficit factor is forced to ell.
      If it equals the SNOVA value, the method is responding to the dimension
      of the algebra rather than its structure and the SNOVA-specific claim is
      withdrawn.
    ordering_control: >-
      The ell = 1 null arm and the A4_local discriminator are computed,
      serialized, and SHA-256 committed BEFORE any A5/A6 treatment count is
      read by a human or written into a report. Absence of that commitment,
      with its digest and timestamp preceding the treatment output file's, is
      invalid_measurement.
    verdict_on_the_null_first: >-
      The frozen pass/fail rule is executed against the ell = 1 arm before the
      treatment arm is looked at. If the rule emits the same verdict on both,
      it discriminates nothing and must be rewritten before the treatment arm
      is read.
    comparability_policy: >-
      No count from this contract may be compared with any figure from any
      reported SNOVA attack, from IDEA-20260801-016, or from any UOV, MAYO or
      QR-UOV record, except through the single declared Stage-3 nearby-object
      arm. A shared symbol (ell, o, v) does not imply a shared definition
      across schemes. Any other cross-scheme comparison requires a separately
      registered comparator contract naming both definitions.
    archive_check: >-
      ZERO COMPUTE, and its result is already known: the SNOVA area has no
      prior experiment, evidence or hypothesis records, and no record anywhere
      in the corpus measures a module count or an oil-object cardinality. This
      is recorded as UNAVAILABLE, not as a passed check.

  independent_variables:
    - algebra class (7 levels, frozen list)
    - base field q (2 levels for enumeration)
    - module rank N and submodule rank k
    - reading of SNOVA's secret transformation (3 levels, resolved by Stage 0)
    - ell, symbolically, for the deficit factor

  metrics:
    primary:
      - Exact enumerated count of free rank-k left A-submodules of A^N, per cell, compared for exact integer equality against the pre-registered value.
      - Deficit exponent factor between readings, as an exact symbolic expression in ell, evaluated at ell in {1,2,3,4,5}.
      - Binding count G6 - number of the eleven rows whose Reading-1 entropy ceiling is below its claimed category level.
      - Binding count G7 - the same for the ell (v - o) log2 q ceiling.
    secondary:
      - Count of submodules by every cardinality class, not only the free rank-k one, so the full lattice shape is recorded.
      - Independently recounted |A^N| as an enumeration-coverage check.
      - The full integer solution set of o'(n' - o') = Reading-1 exponent, per row.
      - The QR-UOV-shaped deficit factor.
      - Stage-0 URL and HTTP status table, and any cell where the raw-HTML transcription differs from the model-rendered fetch.
      - Wall-clock and peak RSS per cell.

  preregistered_prediction:
    quantity: >-
      The exact enumerated count per cell, the deficit exponent factor, and the
      two binding counts.
    formula: >-
      Psi, frozen in H-SNOVA-ec84c2 assumptions clause 1: [N choose k]_{q^ell}
      for a field; [ell N choose ell k]_q for M_ell(F_q); ([N choose k]_q)^2
      for F_q x F_q; q(q+1) for F_q[x]/(x^2) at (N,k) = (2,1);
      [N choose k]_q at ell = 1. Deficit factors E3/E1 = ell^3, E3/E2 = ell^2,
      E2/E1 = ell, all exactly 1 at ell = 1. Ceiling 1 = ell*o*(n-o)*log2 q
      bits; Ceiling 2 = ell*(v-o)*log2 q bits. Binding counts predicted 0 and 0.
    source: >-
      DERIVED IN H-SNOVA-ec84c2, not cited. Morita equivalence and the
      Gaussian-binomial subspace count were NOT retrieved from any source in
      this session; they are re-derived in the hypothesis and are candidates to
      test. The specific integers 35, 15, 6 and 12 were SESSION-COMPUTED
      OUTSIDE THIS HARNESS by exhaustive enumeration and are pre-registered
      here to be recomputed inside it; until they are, they are a derivation
      check and not a measurement.

  scale_relevance:
    tier: toy
    justification: >-
      Stage 1 tests an algebraic identity that has no size dependence, so the
      toy enumeration is a CHECK OF A DERIVATION rather than an extrapolation -
      but it is still a toy computation and every statement from it carries the
      toy label. Stage 2's arithmetic reaches the actual published parameters,
      which is possible only because closed forms replace enumeration there;
      that arithmetic is exact but is arithmetic on published parameters, not a
      measurement, and it establishes an information-theoretic ceiling and
      nothing else. NOTHING IN THIS CONTRACT TRANSFERS TO A STATEMENT ABOUT AN
      ATTACK AT ANY SCALE.
    correspondence: null

  tail_checks:
    - >-
      Recount |A^N| independently of the submodule enumeration and require
      exact agreement; a mismatch means the enumeration did not cover the
      ambient module and every count from that cell is void.
    - >-
      Verify that the counts by cardinality class sum consistently with the
      submodule lattice's expected structure (the trivial submodule appears
      exactly once, the whole module exactly once).
    - >-
      Cross-check every Gaussian binomial computed by the product formula
      against a second, independent computation by the recursion
      [N choose k]_Q = [N-1 choose k-1]_Q + Q^k [N-1 choose k]_Q, and require
      exact agreement. Two implementations, one answer.
    - >-
      Verify the ell = 1 collapse symbolically as well as numerically: all
      three reading formulas must be literally the same expression at ell = 1.

  replication:
    seeds: [7362519]
    independent_instances: 0
    interpretation: >-
      Stage 1 is EXHAUSTIVE and DETERMINISTIC, so replication across seeds is
      meaningless for it and claiming otherwise would overstate the design.
      The single seed is listed because the optional CROSS-1 randomized
      membership cross-check consumes it. What replaces seed replication here
      is the two-implementation requirement in tail_checks: every count is
      produced by enumeration AND by closed form, and the two must agree
      exactly.

  budget:
    maximum_runs: 1
    wall_clock_seconds_per_run: 3600
    maximum_wall_seconds: 3600
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_peak_rss_bytes: 2147483648
    maximum_total_disk_bytes: 268435456
    maximum_workers: 1
    network: >-
      Stage 0 requires outbound HTTPS and nothing else does. Stages 1-3 run
      with no network. If Stage 0's network access is unavailable, Stage 1
      still runs and the package reports a source blocker.

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, archived and authorized by the Coordinator. GOAL-SNOVA-001's next_action ordering must be satisfied first or explicitly waived in a committed decision.
    - Stop before any treatment cell if the ell = 1 null arm and the A4_local discriminator have not been committed with a digest whose timestamp precedes the treatment output.
    - Stop the whole package if the positive control (A5_mat2, q=2, N=2, k=1, expected 35) does not pass; no negative result may be reported.
    - Stop Stage 1 at the first cell whose enumeration exceeds the memory ceiling, report coverage as truncated with the exact cell named, and do not substitute a sampled estimate for an exhaustive count.
    - Stop Stages 2 and 3 if Stage 0 could not establish the secret-transformation reading, and report the source blocker.
    - Stop and route to independent review-breakthrough at max effort, before any other use, if G6 or G7 returns a nonzero binding count.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any import outside the Python 3 standard library in the run script.
    - Any floating-point arithmetic anywhere in a count, an exponent, or a bit figure.
    - Any sampled or estimated count reported in a field designated exhaustive.
    - Any change to Psi, to the pre-registered integer table, or to the frozen algebra list after any count has been observed, other than through a versioned protocol amendment recorded as exploratory_only.
    - Any parameter row used in Stage 2 that was not transcribed from raw page source in Stage 0.
    - Any comparison against a reported SNOVA attack figure, or any restatement of the figures GOAL-SNOVA-001's next_action places out of bounds.
    - Absence of the ordering commitment for the null arm.

  infrastructure_failure_disposition: >-
    A timeout, a crash, an exhausted memory ceiling, an unavailable network
    endpoint, an unobtainable specification, an HTTP 403 on a PDF body, or a
    missing dependency is reported as INFRASTRUCTURE SIGNAL and is NEVER
    negative mathematical evidence, never evidence against H-SNOVA-ec84c2 or
    any of its heuristics, and never evidence about SNOVA (AGENTS.md rule 5,
    core rules 3 and 5). In particular: failing to obtain the SNOVA
    specification does not license any statement about SNOVA's structure, and
    failing to enumerate a large cell does not license a statement about that
    algebra class. Each is recorded with its exact cause and the package
    disposition is failed_infrastructure, not invalid and not negative.

  success_criterion: >-
    This contract has NO current success outcome because it is not authorized
    for execution. If a later, separately approved and frozen successor is
    executed, its only positive disposition is: every Stage-1 cell returns
    exactly its pre-registered integer, including 35 at the positive control, 3
    at the ell = 1 null with deficit factor exactly 1, and the discriminating
    pair (5, 6); the ladder returns exactly (3, 5, 6, 9, 35); both independent
    Gaussian-binomial implementations agree exactly at every cell; the ambient
    recount matches at every cell; Stage 0 establishes the secret-transformation
    reading from primary text with the passage quoted; and Stage 2 emits, for
    all eleven transcribed rows, the three reading exponents, both ceilings,
    both binding counts, and the full integer solution set of the
    entropy-matched plain-UOV instance. That disposition establishes NO attack,
    NO cost, NO exponent of any algorithm, NO cryptographic-scale claim and NO
    statement that any parameter set is broken or safe.

  falsification_criterion: >-
    Any of the following, each of which is a reportable outcome rather than a
    failure of the experiment: (F1) the A5_mat2/q=2/N=2/k=1 count is not 35 -
    Psi's Morita clause is wrong and the ell^3 figure is withdrawn; (F2) the
    ell = 1 deficit factor is not exactly 1 - the instrument measures its own
    construction and nothing is reportable; (F3) the ladder is not exactly
    (3, 5, 6, 9, 35) - the failing rung is named; (F4) Stage 0 establishes
    Reading 3 - Part B of H-SNOVA-ec84c2 is void and Part A stands; (F5) Stage 0
    establishes that the characteristic polynomial of S is not squarefree - the
    semisimple branch does not apply to SNOVA; (F6) G6 or G7 is nonzero - the
    universally quantified negative is falsified, and this outcome is routed to
    independent review-breakthrough at max effort under AGENTS.md rule 12
    before it is used, cited, or described to anyone as a break; (F7) the
    package passes every gate but does not emit the entropy-matched plain-UOV
    table for all eleven rows - the run HAS NOT FINISHED, because that table is
    the deliverable and the non-binding ceilings are the by-product.

  outcomes:
    no_execution_authorization: >-
      The only current disposition: a review_required draft. No run, no
      evidence, no mathematical inference, no claim.
    future_complete_readout: >-
      Only after separate approval, freezing, authorization and valid
      execution. Scoped toy for Stage 1 and exact-arithmetic-on-published-
      parameters for Stage 2, and in no case an attack claim.
    source_blocked: >-
      Stage 1 completes, Stages 2-3 do not, and the package reports the
      URL/status table. Infrastructure signal; never negative evidence; and it
      is the outcome GOAL-SNOVA-001's own pause_conditions anticipate.
    infrastructure_or_integrity_failure: >-
      Inconclusive infrastructure signal, never evidence against
      H-SNOVA-ec84c2, any of its heuristics, or any proposition about SNOVA.

  required_artifacts_if_later_authorized:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - The run script, standard library only, with its SHA-256, and the environment preflight record.
    - Per-cell enumeration output: counts by cardinality class, the ambient recount, wall clock, peak RSS.
    - The closed-form computation output from BOTH independent Gaussian-binomial implementations, with the equality check.
    - The null-arm commitment file with its digest and a timestamp preceding the treatment output.
    - Stage-0 raw-HTML transcription of the eleven rows, the URL/status table, and verbatim quotations of every specification passage relied on, with a diff against the model-rendered fetch recorded in H-SNOVA-ec84c2.
    - Stage-2 tables: three reading exponents, two ceilings, two binding counts, and the entropy-matched plain-UOV solution set per row.
    - Stage-3 QR-UOV-shaped deficit factor with the code path shown to be identical.
    - Manifest, exact command, git commit and dirty-tree state, stdout, stderr, validity status and reason.
    - Snapshot archive followed by independent validation and red-team review before any evidence record is written.

  approval_requirements:
    - Independent review confirms that every pre-registered integer is derivable from Psi as written, without reference to any observed count.
    - Independent review confirms the ordering control is enforceable as specified and that the positive control can actually fail.
    - Independent review confirms no restated figure from GOAL-SNOVA-001's out-of-bounds list appears anywhere in this contract or in H-SNOVA-ec84c2.
    - Coordinator separately approves and freezes a contract without editing this draft; corrections supersede.
    - The goal's next_action ordering is satisfied, or explicitly waived, in a committed Coordinator decision.

  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved and only the Coordinator may approve it (AGENTS.md rule 1).

  assigned_to: executor
