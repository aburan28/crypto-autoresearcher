# EXP-ECDLP-c9110e
# Translation count on one toy curve. No summation polynomial.
# Approved by DEC-20261002-7649ed.
experiment:
  id: EXP-ECDLP-c9110e
  hypothesis_id: H-ECDLP-242aa4
  source_idea: IDEA-20260920-0490f5
  question_id: RQ-ECDLP-002
  version: 1
  title: Degree-2 translation count
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-7649ed
  objective: >-
    Check the commuting count on one curve, the witness sides, and the
    gap between 96 and 384.
  inputs:
    prime: 11
    curve_A: 8
    curve_B: 2
    point_count: 12
    centers:
      - [0, 0]
      - [1, 0]
      - [2, 0]
    commuting_count: 4
    witness_S: [0, 0]
    witness_T: [5, 4]
    witness_left: [7, 1]
    witness_right: [7, 10]
    double_T: [5, 7]
    bound_m: 3
    bound: 96
    nearby_bound: 384
    gap: 288
  controls:
    - >-
      The curve has 12 rational points. Reporting another count
      invalidates the run.
    - >-
      Exactly four translations commute for each listed center.
      Reporting the count as 12 invalidates the run.
    - >-
      The witness sides are (7,1) and (7,10). Reporting them equal
      invalidates the run.
    - >-
      The m = 3 bound is 96. Reporting it as 384 invalidates the run.
      The gap is 288.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {commuting_count, bound}
    - route in {enumeration, doubling}
  metrics:
    primary:
      - commuting_count
      - bound
      - implementations_agree
    secondary:
      - gap
      - witness_left
      - witness_right
      - point_count
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Exactly four translations commute, and the gap is 288.
    formula: >-
      iota(P) is the negation of P+S. A translation by T commutes with
      iota when the two compositions agree on every rational point. The
      bound is 4 raised to m-1, times m!, at m = 3. The nearby integer
      uses the exponent m. Their difference is the gap.
    source: >-
      IDEA-20260920-0490f5 states the degree-2 bound 4^(m-1) m!, read
      2026-10-02. The point count, the witness, and the gap were
      computed in this design session. That computation is not a run.
      No summation polynomial was built.
  scale_relevance:
    tier: toy
    justification: One curve over a field with 11 elements. No transfer to a larger field.
    correspondence: null
  tail_checks:
    - The witness at T = (5,4) is required. A check that stops at the four points of order dividing 2 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the point count disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The point count is not 12.
    - The commuting count is reported as 12.
    - The witness sides are reported equal.
    - The m = 3 bound is reported as 384.
    - Doubling of (5,4) is reported as the identity.
    - A summation polynomial is built or a Lean proof is claimed.
  success_criterion: >-
    Both runs agree that the curve has 12 points, that each listed
    center has commuting count 4, that the witness sides are (7,1) and
    (7,10), and that 384 exceeds 96 by 288.
  falsification_criterion: >-
    The runs agree, the curve has 12 points, and the commuting count
    for S = (0,0) is not 4.
  required_artifacts:
    - experiments/EXP-ECDLP-c9110e/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-c9110e/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-c9110e/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-c9110e/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-c9110e/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-c9110e/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any summation polynomial, Groebner basis, or Lean development.
    - Any claim that the lemma holds for every curve.
    - Any measured attack cost.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
